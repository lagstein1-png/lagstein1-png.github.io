# בדיקה חיה של האתר שנפרס.
#
# למה ורקפלו: סביבת הפיתוח של הסוכן חסומה מול
# bekol.co.il (זה כתוב גם ב-CLAUDE.md), ולכן אי אפשר
# לבדוק משם מה באמת מוגש ללומד. הרנרים של GitHub אינם חסומים.
#
# **זו אינה בדיקת קוד — היא בדיקת מה שמוגש.** `all.js` בודק את
# העץ; כאן נבדק ה-HTML שחוזר מהרשת, כולל השאלה החשובה: האם
# מפתח הקאש שמוגש הוא זה שב-main, או שהפריסה מפגרת.
#
# בלי סודות ובלי כתיבה — כתובות ציבוריות בלבד.

name: live-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: בודק את האתר החי
        run: |
          # **בלי -e, ובכוונה.** GitHub מריץ ב-bash -e, ו-grep שאינו
          # מוצא יוצא 1 — ב-bagrut-806 מפתח הקאש יושב ב-app.js ולא
          # בדף, ולכן החיפוש בדף ריק והריצה נפלה שם באמצע הלולאה.
          # הכישלון נמדד ב-FAIL ומדווח בסוף, ולא בקריסה.
          set +e
          set -uo pipefail
          set +e
          # הדומיין מ-22.9.2026 (CNAME בשורש). הכתובת הישנה עונה 301 לכאן,
          # ו-curl בלי -L היה מדווח 301 על כל דף.
          BASE=https://bekol.co.il
          APPS="math-app math-teen math-uni math-uni2 math-uni3 english ulpan history lomda kotvim reader bagrut-806"
          FAIL=0
          # HTTP 000 על הכול יכול להיות DNS שלא הופנה, או תעודה שעוד לא
          # הונפקה. השורה הזאת מבדילה: אין כתובת = DNS; יש כתובת = תעודה.
          HOST=${BASE#https://}
          DNS=$(getent ahosts "$HOST" | awk '{print $1}' | sort -u | tr '\n' ' ')
          OLD=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 30 "https://lagstein1-png.github.io/?cb=$GITHUB_RUN_ID")
          echo "DNS מהרנר: $HOST → ${DNS:-(אין כתובת)}"
          echo "הכתובת הישנה: $OLD"
          {
            echo "## בדיקה חיה — $BASE"
            echo ""
            echo "DNS מהרנר: \`$HOST\` → ${DNS:-**אין כתובת** — ה-DNS לא הופנה}  ·  הכתובת הישנה עונה: \`$OLD\`"
            echo ""
            echo "| אפליקציה | HTTP | קישור לבית | מפתח מוגש | מפתח ב-main | |"
            echo "|---|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          for app in $APPS; do
            # מנטרל מטמון קצה, כדי שלא ניבדק מול עותק ישן
            CODE=$(curl -s -o /tmp/p.html -w '%{http_code}' --max-time 30 \
                   -H 'Cache-Control: no-cache' "$BASE/$app/?cb=$GITHUB_RUN_ID")

            if grep -q 'כל האפליקציות' /tmp/p.html; then LINK="✓"; else LINK="✗"; FAIL=1; fi

            # המפתח שמוגש בפועל מול המפתח שבעץ
            SRC=$app/index.html
            [ "$app" = "bagrut-806" ] && SRC=$app/app.js
            WANT=$(grep -o 'sw\.js?v=[a-z0-9-]*' "$SRC" 2>/dev/null | head -1 | sed 's/.*v=//' || true)
            GOT=$(grep -o 'sw\.js?v=[a-z0-9-]*' /tmp/p.html 2>/dev/null | head -1 | sed 's/.*v=//' || true)
            # ב-bagrut-806 המפתח יושב ב-app.js ולא בדף
            if [ -z "$GOT" ] && [ "$app" = "bagrut-806" ]; then
              curl -s --max-time 30 "$BASE/$app/app.js?cb=$GITHUB_RUN_ID" -o /tmp/a.js
              GOT=$(grep -o 'sw\.js?v=[a-z0-9-]*' /tmp/a.js 2>/dev/null | head -1 | sed 's/.*v=//' || true)
            fi

            if [ "$CODE" != "200" ]; then FAIL=1; fi
            if [ "$GOT" = "$WANT" ]; then VER="✓"; else VER="✗ מפגר"; FAIL=1; fi

            echo "| \`$app\` | $CODE | $LINK | $GOT | $WANT | $VER |" >> "$GITHUB_STEP_SUMMARY"
            echo "$app  HTTP=$CODE  link=$LINK  served=$GOT  main=$WANT"
          done

          # דף הבית — אין לו BUILD, אבל יש לו מפתח קאש (CLAUDE.md, ״גרסאות״)
          CODE=$(curl -s -o /tmp/home.html -w '%{http_code}' --max-time 30 \
                 -H 'Cache-Control: no-cache' "$BASE/?cb=$GITHUB_RUN_ID")
          WANT=$(grep -o 'sw\.js?v=[a-z0-9-]*' index.html | head -1 | sed 's/.*v=//' || true)
          GOT=$(grep -o 'sw\.js?v=[a-z0-9-]*' /tmp/home.html 2>/dev/null | head -1 | sed 's/.*v=//' || true)
          if [ "$CODE" != "200" ]; then FAIL=1; fi
          if [ "$GOT" = "$WANT" ]; then VER="✓"; else VER="✗ מפגר"; FAIL=1; fi
          echo "| \`home\` | $CODE | – | $GOT | $WANT | $VER |" >> "$GITHUB_STEP_SUMMARY"
          echo "home  HTTP=$CODE  served=$GOT  main=$WANT"

          # שם העוזר ב-HTML שמוגש בפועל — דף הבית ו-math-app.
          # ספירה, לא כן/לא: כמה פעמים השם מופיע במה שהשרת החזיר.
          #
          # **השם נגזר מהעץ, מאותה סיבה כמו התווית למטה.** כאן היה
          # 'ג׳וש' קשיח, והשורה דיווחה 0 · 0 אחרי שהשם הוחלף —
          # מספר נכון שאינו אומר כלום, שמדווח שהשם שאיננו מחפשים
          # איננו. עכשיו נמדד השם שבאמת בשימוש.
          curl -s --max-time 30 -H 'Cache-Control: no-cache' "$BASE/math-app/?cb=$GITHUB_RUN_ID" -o /tmp/ma.html
          NAME=$(grep -o 'btn:"[^"]*"' tutor/tutor.js | head -1 | sed 's/^btn:"//;s/ *—.*//')
          JH=$(grep -oF "$NAME" /tmp/home.html | wc -l)
          JM=$(grep -oF "$NAME" /tmp/ma.html | wc -l)
          echo "name-in-served-html  name=$NAME  home=$JH  math-app=$JM"
          {
            echo ""
            echo "**\`$NAME\` ב-HTML המוגש:** דף הבית $JH · math-app $JM (מופעים)"
          } >> "$GITHUB_STEP_SUMMARY"

          # תווית העוזר — קובץ אחד, משותף לכולן.
          #
          # **המחרוזת נגזרת מהעץ ואינה מקודדת כאן.** היא הייתה
          # 'ג׳וש — עזרה מהמורה' קשיח, והשם הוחלף פעמיים (פאולה,
          # ואז ברק) — ומאותו רגע הבדיקה החיה נפלה על מחרוזת שכבר
          # אינה קיימת באף מקום. כישלון על סיבה שגויה גרוע מאין
          # בדיקה: הוא מלמד להתעלם מהאדום. עכשיו זו אותה השוואה
          # של מפתח הקאש — מה שבעץ מול מה שמוגש.
          curl -s --max-time 30 "$BASE/tutor/tutor.js?cb=$GITHUB_RUN_ID" -o /tmp/t.js
          WANTB=$(grep -o 'btn:"[^"]*"' tutor/tutor.js | head -1 | sed 's/^btn:"//;s/"$//')
          if [ -n "$WANTB" ] && grep -qF "$WANTB" /tmp/t.js; then JOSH="✓"; else JOSH="✗"; FAIL=1; fi
          echo "tutor.js  label=$JOSH  want=$WANTB"
          {
            echo ""
            echo "**תווית העוזר ב-\`tutor/tutor.js\` החי:** $JOSH — \`$WANTB\`"
            echo ""
            echo "**כתובת השרת שמוגשת:** \`$(grep -o 'var API = "[^"]*"' /tmp/t.js | sed 's/.*= //')\`"
          } >> "$GITHUB_STEP_SUMMARY"

          # ״תאוריה מדברת״ — היא בכרטיס בדף הבית, והיא **לא נבדקה
          # כאן מעולם**. היא בריפו נפרד, ולכן אין לה מפתח קאש
          # ב-main להשוות מולו; מה שנבדק הוא בדיוק מה שהכרטיס
          # מבטיח — שהקישור עונה, ושמה שחוזר הוא הדף ולא שגיאת
          # 404 של GitHub Pages, שחוזרת עם גוף HTML תקין.
          #
          # הכתובת נקראת מ-DATA.APPS ואינה מקודדת כאן: שדה `u`
          # הוא מקור האמת, ושינוי שם הריפו יילקח מאליו.
          TURL=$(grep -o '"id":"theory","u":"[^"]*"' index.html | sed 's/.*"u":"//;s/"$//')
          if [ -z "$TURL" ]; then
            echo "::error::לא נמצא שדה u לרשומת theory ב-DATA.APPS"
            FAIL=1
            TSTAT="— (אין כתובת)"
          else
            TCODE=$(curl -s -L -o /tmp/th.html -w '%{http_code}' --max-time 30 \
                    -H 'Cache-Control: no-cache' "$TURL?cb=$GITHUB_RUN_ID")
            if grep -qi "isn't a GitHub Pages site\|Site not found\|404: Not Found" /tmp/th.html; then
              TBODY="✗ 404 של Pages"; FAIL=1
            elif grep -qi '<title' /tmp/th.html; then
              TBODY="✓"
            else
              TBODY="✗ אין דף"; FAIL=1
            fi
            [ "$TCODE" = "200" ] || FAIL=1
            TSTAT="$TCODE · $TBODY"
            echo "theory  HTTP=$TCODE  body=$TBODY  url=$TURL"
          fi
          {
            echo ""
            echo "**״תאוריה מדברת״ (ריפו נפרד, אין מפתח להשוות):** $TSTAT"
            echo ""
            echo "כתובת מ-\`DATA.APPS\`: \`$TURL\`"
          } >> "$GITHUB_STEP_SUMMARY"

          # קובצי החיפוש — מפת האתר, robots.txt וקובץ האימות של
          # Search Console. נוסף 17.9.2026 כש-Search Console אמר
          # ״Sitemap could not be read״ על קובץ שבעץ הוא XML תקין:
          # ההבדל בין ״הקובץ שבור״ ל״הקובץ לא מוגש״ נראה רק מכאן.
          # נמדד: סטטוס, Content-Type, ומספר ה-<loc> שחוזר בפועל.
          {
            echo ""
            echo "| קובץ | HTTP | Content-Type | \`\<loc\>\` מוגש | \`\<loc\>\` ב-main |"
            echo "|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for f in sitemap.xml robots.txt $(ls google*.html 2>/dev/null); do
            CODE=$(curl -s -o /tmp/f.out -D /tmp/f.hdr -w '%{http_code}' --max-time 30 \
                   -H 'Cache-Control: no-cache' "$BASE/$f?cb=$GITHUB_RUN_ID")
            CT=$(grep -i '^content-type:' /tmp/f.hdr | tr -d '\r' | sed 's/^[^:]*: *//' | head -1)
            GOT=$(grep -c '<loc>' /tmp/f.out || true)
            WANT=$(grep -c '<loc>' "$f" || true)
            [ "$CODE" = "200" ] || FAIL=1
            if [ "$f" = "sitemap.xml" ] && [ "$GOT" != "$WANT" ]; then FAIL=1; fi
            echo "| \`$f\` | $CODE | $CT | $GOT | $WANT |" >> "$GITHUB_STEP_SUMMARY"
            echo "$f  HTTP=$CODE  type=$CT  loc_served=$GOT  loc_main=$WANT"
            echo "--- $f (first 5 lines as served) ---"; head -5 /tmp/f.out; echo "---"
          done

          if [ "$FAIL" != "0" ]; then
            echo "::error::הבדיקה החיה נכשלה. ראה את הטבלה בסיכום."
            exit 1
          fi
          echo "הכול תקין באתר החי."
