# השכבה המוקלטת — הקלטת המאגרים ב-Gemini TTS, על הרנר, לא בסביבת הפיתוח.
#
# **מה זה.** המנוע של ״תאוריה מדברת״: קובץ MP3 לכל משפט במאגר,
# מוגש כקובץ סטטי, וקול המכשיר רק כשקובץ חסר. הבעלים, 21.9.2026:
# ״תעתיק את המנוע, כבר שילמנו, ותיישם כמנוע שממנו לוקחים בעתיד״.
#
# **למה רנר.** המפתח יושב ב-Secrets בלבד (GEMINI_API_KEY, אותו
# מפתח של ברק), לעולם לא בדף; הרשת בסביבת הפיתוח חסומה; ffmpeg
# נדרש להמרת ה-PCM שג׳מיני מחזיר.
#
# **הקצב נמדד בריפו הנפרד:** כ-5 בקשות לדקה גם במדרגה בתשלום.
# ריצה אחת מקליטה מאות. ההרצה מתחדשת — קובץ קיים אינו מופק שוב —
# ולכן מריצים שוב ושוב עד שהכיסוי מלא. הקלטה חלקית ב-main תקינה:
# משפט בלי קובץ נופל לקול המכשיר, בדיוק כמו היום.
#
# **התוצר נדחף ל-main ישירות**, אחרי `record.js --check`. הקבצים
# הם תוכן, לא קוד: `qa.yml` ירוץ עליהם ויעבור כל עוד המניפסט
# תואם לדיסק.

name: record

# **רץ לבד כל בוקר** (הבעלים, 22.9.2026: ״רוץ״). המכסה היומית של
# המפתח מתאפסת בחצות בשעון פסיפיק — 07:00 UTC (נמדד ב-O-71) — ולכן
# 07:30. כל ריצה מקליטה מה שהמכסה מרשה, באפליקציה שהכי הרבה חסר
# בה (`record.js --next`), ונעצרת על 429. הרצה ידנית בוחרת אפליקציה.
on:
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch:
    inputs:
      app:
        description: 'english, history, ulpan, lomda, or pilot (staging-only artifact)'
        required: true
        default: 'english'
      max:
        description: 'כמה מחרוזות לכל היותר בריצה הזאת'
        required: false
        default: '300'
      provider:
        description: 'gemini (GEMINI_API_KEY) או gcloud (TTS_KEY, Cloud Text-to-Speech). ריק — משתנה הריפו TTS_PROVIDER, ואם אין — gemini'
        required: false
        default: ''
      voice:
        description: 'שם הקול. ריק — משתנה הריפו TTS_VOICE, ואם אין — Kore / he-IL-Chirp3-HD-Kore'
        required: false
        default: ''
      replace:
        description: 'YES — למחוק הקלטות בקול אחר ולהקליט מחדש'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: record
  cancel-in-progress: false

jobs:
  record:
    if: ${{ github.event_name == 'schedule' || github.event.inputs.app != 'pilot' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ffmpeg אינו מותקן על ubuntu-latest (נמדד ב-voice, ריצה 1).
      - name: מתקין ffmpeg
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: ffmpeg קיים
        run: ffmpeg -version

      # הספק והקול: קלט ידני → משתנה ריפו (Settings → Variables) → ברירת מחדל.
      # כך הריצה המתוזמנת מקבלת את הבחירה בלי לגעת בקוד.
      - name: ספק וקול
        id: prov
        run: |
          P="${{ github.event.inputs.provider || vars.TTS_PROVIDER || 'gemini' }}"
          V="${{ github.event.inputs.voice || vars.TTS_VOICE }}"
          echo "provider=$P" >> "$GITHUB_OUTPUT"
          echo "voice=$V" >> "$GITHUB_OUTPUT"
          echo "ספק: $P · קול: ${V:-ברירת מחדל}"

      - name: יש מפתח
        env:
          GKEY: ${{ secrets.GEMINI_API_KEY }}
          TKEY: ${{ secrets.TTS_KEY }}
          P: ${{ steps.prov.outputs.provider }}
        run: |
          if [ "$P" = "gcloud" ] && [ -z "${TKEY:-}" ]; then
            echo "::error::הספק gcloud דורש TTS_KEY ב-Secrets (מפתח Cloud Text-to-Speech)."
            exit 1
          fi
          if [ "$P" != "gcloud" ] && [ -z "${GKEY:-}" ]; then
            echo "::error::חסר GEMINI_API_KEY ב-Secrets. בלעדיו אין מה להקליט."
            exit 1
          fi

      # ריצה מתוזמנת — אין קלט: בוחרים את האפליקציה שהכי הרבה חסר בה.
      - name: איזו אפליקציה
        id: pick
        run: |
          APP="${{ github.event.inputs.app }}"
          if [ -z "$APP" ]; then APP="$(node .claude/qa/record.js --next)"; fi
          if [ -z "$APP" ]; then echo "הכול מוקלט — אין מה להריץ."; fi
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "max=${{ github.event.inputs.max || '300' }}" >> "$GITHUB_OUTPUT"

      - name: תכנון
        if: steps.pick.outputs.app != ''
        run: node .claude/qa/record.js --plan "${{ steps.pick.outputs.app }}"

      # נופל על מכסה? מה שהוקלט נשמר, והצעדים שאחריו דוחפים אותו.
      - name: מקליט
        if: steps.pick.outputs.app != ''
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TTS_KEY: ${{ secrets.TTS_KEY }}
          TTS_PROVIDER: ${{ steps.prov.outputs.provider }}
          TTS_VOICE: ${{ steps.prov.outputs.voice }}
          REPLACE: ${{ github.event.inputs.replace }}
        run: |
          EXTRA=""
          if [ "${REPLACE:-}" = "YES" ]; then EXTRA="--replace"; fi
          node .claude/qa/record.js "${{ steps.pick.outputs.app }}" --max "${{ steps.pick.outputs.max }}" $EXTRA

      - name: המניפסט תואם לדיסק
        run: node .claude/qa/record.js --check

      - name: דוחף ל-main
        if: steps.pick.outputs.app != ''
        run: |
          set -euo pipefail
          APP="${{ steps.pick.outputs.app }}"
          if [ -z "$(find "$APP/audio" -type f -name '*.mp3' 2>/dev/null | head -1)" ]; then
            echo "לא נוצר אף קובץ — אין מה לדחוף."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$APP/audio"
          if git diff --cached --quiet; then echo "אין קבצים חדשים."; exit 0; fi
          N=$(find "$APP/audio/he" -type f -name '*.mp3' | wc -l)
          git commit -q -m "הקלטות: $APP — $N קבצים במניפסט (record.yml)"
          # main זז בזמן הריצה? מושכים ומנסים שוב, פעם אחת.
          git pull --rebase -q origin main || true
          git push origin HEAD:main
          echo "נדחף: $APP, $N הקלטות."

      - name: כיסוי
        run: |
          {
            echo "### השכבה המוקלטת"
            echo ""
            echo '```'
            node .claude/qa/record.js --plan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Manual staging-branch trial only. `app: pilot` is an existing dispatch input
  # on the default branch, so dispatch with `ref` set to the reviewed staging branch.
  pilot:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.app == 'pilot' && github.ref != 'refs/heads/main' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ffmpeg
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Validate 32 pilot selections without API calls
        run: node .claude/qa/pilot-hebrew.js --check
      - name: Make 32 clips, stop on first error or quota response
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node .claude/qa/pilot-hebrew.js
      - name: Store samples and usage report privately as a run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hebrew-pilot-${{ github.run_id }}
          path: ${{ runner.temp }}/hebrew-pilot/
          if-no-files-found: warn
          retention-days: 7
