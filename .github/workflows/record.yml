# השכבה המוקלטת — הקלטת המאגרים ב-Gemini TTS, על הרנר, לא בסביבת הפיתוח.
#
# **מה זה.** המנוע של ״תאוריה מדברת״: קובץ MP3 לכל משפט במאגר,
# מוגש כקובץ סטטי, וקול המכשיר רק כשקובץ חסר. הבעלים, 21.9.2026:
# ״תעתיק את המנוע, כבר שילמנו, ותיישם כמנוע שממנו לוקחים בעתיד״.
#
# **למה רנר.** המפתח יושב ב-Secrets בלבד (GEMINI_API_KEY, אותו
# מפתח של ברק), לעולם לא בדף; הרשת בסביבת הפיתוח חסומה; ffmpeg
# נדרש להמרת ה-PCM שג׳מיני מחזיר.
#
# **הקצב נמדד בריפו הנפרד:** כ-5 בקשות לדקה גם במדרגה בתשלום.
# ריצה אחת מקליטה מאות. ההרצה מתחדשת — קובץ קיים אינו מופק שוב —
# ולכן מריצים שוב ושוב עד שהכיסוי מלא. הקלטה חלקית ב-main תקינה:
# משפט בלי קובץ נופל לקול המכשיר, בדיוק כמו היום.
#
# **התוצר נדחף ל-main ישירות**, אחרי `record.js --check`. הקבצים
# הם תוכן, לא קוד: `qa.yml` ירוץ עליהם ויעבור כל עוד המניפסט
# תואם לדיסק.

name: record

# **רץ לבד כל בוקר** (הבעלים, 22.9.2026: ״רוץ״). המכסה היומית של
# המפתח מתאפסת בחצות בשעון פסיפיק — 07:00 UTC (נמדד ב-O-71) — ולכן
# 07:30. כל ריצה מקליטה מה שהמכסה מרשה, באפליקציה שהכי הרבה חסר
# בה (`record.js --next`), ונעצרת על 429. הרצה ידנית בוחרת אפליקציה.
on:
  # הבעלים אישר 29.9.2026 את הקול Gacrux, ו-2.10.2026 החליף ל-Kore
  # בכל האתר (כמו תאוריה מדברת), במודל 2.5 Flash, עם תקרת
  # הוצאה מצטברת של $25 (TTS_BUDGET_USD, record-spend.json).
  # ה-cron הוסר 3.10.2026: הוא רץ במצב אצוות (פי 2.7 לתו מ-batch=NO,
  # ריצת המדידה 30) ובחר אפליקציה וקול בעצמו. ריצה 31 נורתה באיחור
  # ב-12:40 על lomda בקול Kore, וסתרה את ההוראה ״Gacrux, אפליקציה
  # לכל דיספאץ׳״. את התור מנהלים ידנית עד שהכיסוי מלא.
  workflow_dispatch:
    inputs:
      app:
        description: 'אפליקציה, רשימה מופרדת בפסיקים (hebrew,ulpan,civics) או all. כל אחת נדחפת מיד; max — לכל אחת'
        required: true
        default: 'english'
      max:
        description: 'כמה מחרוזות לכל היותר בריצה הזאת'
        required: false
        default: '700'
      provider:
        description: 'gemini (GEMINI_API_KEY) או gcloud (TTS_KEY, Cloud Text-to-Speech). ריק — משתנה הריפו TTS_PROVIDER, ואם אין — gemini'
        required: false
        default: ''
      voice:
        description: 'שם הקול. ריק — משתנה הריפו TTS_VOICE, ואם אין — Kore (gemini) / he-IL-Chirp3-HD-Kore (gcloud)'
        required: false
        default: ''
      replace:
        description: 'לא בשימוש: החלפת קול באפליקציה עם הקלטות עדיין אינה נתמכת (record.js עוצר בלי למחוק)'
        required: false
        default: ''
      batch:
        description: 'NO — הקלטה מחרוזת־מחרוזת (הישן). ריק/YES — אצווה של ~40 מחרוזות לבקשה (ברירת מחדל)'
        required: false
        default: ''

permissions:
  contents: write

# קבוצה לכל אפליקציה (הבעלים, 3.10.2026: ״רוץ בכמה חזיתות״) — ריצות
# של אפליקציות שונות רצות במקביל; שתי ריצות של אותה אפליקציה עדיין
# בתור (אחרת שתיהן היו מקליטות את אותם משפטים וכותבות לאותו מניפסט).
concurrency:
  group: record-${{ github.event.inputs.app || 'next' }}
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      # ref: main ולא הקומיט שבו הריצה נכנסה לתור: ריצה שחיכתה מאחורי
      # אחרת (concurrency) חייבת לראות את מה שהקודמת הקליטה והוציאה
      # (record-spend.json), אחרת היא מקליטה שוב ומשלמת שוב.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ffmpeg אינו מותקן על ubuntu-latest (נמדד ב-voice, ריצה 1).
      - name: מתקין ffmpeg
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: ffmpeg קיים
        run: ffmpeg -version

      # הספק והקול: קלט ידני → משתנה ריפו (Settings → Variables) → ברירת מחדל.
      # כך הריצה המתוזמנת מקבלת את הבחירה בלי לגעת בקוד.
      - name: ספק וקול
        id: prov
        run: |
          P="${{ github.event.inputs.provider || vars.TTS_PROVIDER || 'gemini' }}"
          V="${{ github.event.inputs.voice || vars.TTS_VOICE }}"
          echo "provider=$P" >> "$GITHUB_OUTPUT"
          echo "voice=$V" >> "$GITHUB_OUTPUT"
          echo "ספק: $P · קול: ${V:-ברירת מחדל}"

      - name: יש מפתח
        env:
          GKEY: ${{ secrets.GEMINI_API_KEY }}
          TKEY: ${{ secrets.TTS_KEY }}
          P: ${{ steps.prov.outputs.provider }}
        run: |
          if [ "$P" = "gcloud" ] && [ -z "${TKEY:-}" ]; then
            echo "::error::הספק gcloud דורש TTS_KEY ב-Secrets (מפתח Cloud Text-to-Speech)."
            exit 1
          fi
          if [ "$P" != "gcloud" ] && [ -z "${GKEY:-}" ]; then
            echo "::error::חסר GEMINI_API_KEY ב-Secrets. בלעדיו אין מה להקליט."
            exit 1
          fi

      # ריצה מתוזמנת — אין קלט: בוחרים את האפליקציה שהכי הרבה חסר בה.
      - name: איזו אפליקציה
        id: pick
        run: |
          APP="${{ github.event.inputs.app }}"
          if [ -z "$APP" ]; then APP="$(node .claude/qa/record.js --next)"; fi
          if [ -z "$APP" ]; then echo "הכול מוקלט — אין מה להריץ."; fi
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          MAX="${{ github.event.inputs.max || '700' }}"
          # ריצה מתוזמנת שמשדרגת את אנגלית: MAX הוא מספר הקליפים שבאמת
          # ממתינים (מתחת ל-KBPS ולא מיצו ניסיונות), לא מספר כל הקבצים.
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$APP" = "english" ]; then
            N=$(node .claude/qa/record.js --pending english)
            if [ "$N" -gt 0 ]; then MAX="$N"; fi
          fi
          echo "max=$MAX" >> "$GITHUB_OUTPUT"

      - name: תכנון
        if: steps.pick.outputs.app != ''
        run: |
          APP="${{ steps.pick.outputs.app }}"
          if [ "$APP" = "all" ]; then node .claude/qa/record.js --plan; else node .claude/qa/record.js --plan $(echo "$APP" | tr ',' ' '); fi

      # **אפליקציה־אפליקציה, דחיפה אחרי כל אחת** (3.10.2026, אחרי ריצה 27):
      # app=all רץ 3:45 שעות, היה נחתך ב-timeout ומאבד הכול — את הקבצים ואת
      # רישום ההוצאה, וגוגל גובה בכל זאת. עכשיו app הוא רשימה מופרדת בפסיקים
      # (או all), כל אפליקציה נעטפת ב-timeout -s INT עד 300 דקות מתחילת הצעד
      # (40 דקות לפני גבול ה-job), record.js מסיים בעצירה נקייה, וכל אפליקציה
      # נדחפת מיד. נחתכה אחת — מפסידים לכל היותר את הבקשה שבדרך.
      # ולמה לא 15 הרצות נפרדות: קבוצת concurrency מחזיקה רצה אחת וממתינה
      # אחת בלבד; כל הרצה חדשה מבטלת את הממתינה.
      - name: מקליט ודוחף
        id: push
        if: steps.pick.outputs.app != ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TTS_KEY: ${{ secrets.TTS_KEY }}
          TTS_PROVIDER: ${{ steps.prov.outputs.provider }}
          TTS_VOICE: ${{ steps.prov.outputs.voice }}
          # התקרה: $40 (הבעלים, 3.10.2026). ריצה 30 קיבלה כאן 25 — המשתנה
          # שהוגדר אינו מגיע ל-vars (אולי נשמר כ-Secret), ולכן נקרא גם משם.
          TTS_BUDGET_USD: ${{ vars.TTS_BUDGET_USD || secrets.TTS_BUDGET_USD || '40' }}
          # Tier 2 (הבעלים, 3.10.2026): 6.6 משפטים לדקה במרווח 5 שניות היו 31 שעות
          TTS_PACE_MIN_MS: ${{ vars.TTS_PACE_MIN_MS || '1500' }}
        run: |
          # Actions מריץ bash -e: יציאה 1 של record.js (מכסה בלי אף קובץ)
          # הפילה את הצעד לפני הבדיקה והדחיפה (ריצה 52). השגיאות כאן נבדקות ביד.
          set +e
          set -uo pipefail
          EXTRA=""
          if [ "${{ github.event.inputs.batch }}" != "NO" ]; then EXTRA="--batch"; fi
          APPS="${{ steps.pick.outputs.app }}"
          if [ "$APPS" = "all" ]; then APPS="$(node .claude/qa/record.js --list)"; fi
          APPS="$(echo "$APPS" | tr ',' ' ')"
          DEADLINE=$(( $(date +%s) + 300 * 60 ))
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          : > /tmp/rec.log
          # מקטעים של CHUNK משפטים, דחיפה אחרי כל מקטע (4.10.2026): ריצה 53
          # (lomda) בוטלה ידנית אחרי 3:50 שעות ואיבדה הכול — הדחיפה הייתה רק
          # בסוף האפליקציה. עכשיו ביטול, timeout או נפילה מאבדים מקטע אחד לכל היותר.
          CHUNK=400
          MAXAPP="${{ steps.pick.outputs.max }}"
          STOPALL=""
          for APP in $APPS; do
            TOTAL=0
            while :; do
              LEFT=$(( (DEADLINE - $(date +%s)) / 60 ))
              if [ "$LEFT" -lt 10 ]; then echo "נשארו $LEFT דקות — עוצרים לפני מקטע נוסף של $APP." | tee -a /tmp/rec.log; STOPALL=1; break; fi
              REMAIN=$(( MAXAPP - TOTAL ))
              if [ "$REMAIN" -le 0 ]; then break; fi
              CH=$(( REMAIN < CHUNK ? REMAIN : CHUNK ))
              echo "=== $APP · מקטע עד $CH · עד $LEFT דקות ===" | tee -a /tmp/rec.log
              timeout -s INT -k 10m "${LEFT}m" node .claude/qa/record.js "$APP" --max "$CH" $EXTRA 2>&1 | tee /tmp/app.log
              cat /tmp/app.log >> /tmp/rec.log
              if ! node .claude/qa/record.js --check; then echo "::error::המניפסט של $APP אינו תואם לדיסק — לא דוחפים"; exit 1; fi
              git add -- '*/audio/*'
              if [ -d .claude/qa/record-spend ]; then git add .claude/qa/record-spend; fi
              if ! git diff --cached --quiet; then
                N=$(git diff --cached --name-only | grep -c '\.mp3$' || true)
                git commit -q -m "הקלטות: $APP — $N קבצים חדשים או מוחלפים (record.yml)"
                # ריצות במקביל דוחפות זו ליד זו: דחיפה שנדחתה (main זז) מנסה שוב.
                # כל ריצה נוגעת רק בתיקיית האפליקציה שלה ובקובץ ההוצאה שלה,
                # ולכן ה-rebase נקי; כישלון אחרי שישה ניסיונות הוא אמיתי.
                OK=""
                for TRY in 1 2 3 4 5 6; do
                  if git pull --rebase -q origin main && git push -q origin HEAD:main; then OK=1; break; fi
                  git rebase --abort 2>/dev/null || true
                  sleep $(( TRY * 7 + RANDOM % 10 ))
                done
                if [ -z "$OK" ]; then
                  echo "::error::הדחיפה של $APP נכשלה שש פעמים — עוצרים, כדי לא להקליט עוד מה שלא יישמר"; exit 1
                fi
                echo "pushed=1" >> "$GITHUB_OUTPUT"
                echo "נדחף: $APP, $N הקלטות."
              fi
              MADE=$(grep -oE 'נוצרו [0-9]+' /tmp/app.log | tail -1 | grep -oE '[0-9]+' || true)
              MADE=${MADE:-0}
              TOTAL=$(( TOTAL + MADE ))
              # מכסה, תקרה או זמן — אין טעם להמשיך בכלל
              if grep -qE 'כל המודלים נגמרו|המכסה נגמרה|תקרת ההוצאה|SIGINT' /tmp/app.log; then STOPALL=1; break; fi
              # מקטע בלי אף קובץ חדש — האפליקציה הושלמה (או שהנותרים מיצו ניסיונות)
              if [ "$MADE" -eq 0 ]; then break; fi
            done
            if [ -n "$STOPALL" ]; then echo "עוצרים אחרי $APP."; break; fi
          done
      # ריצה בלי תוצר (מכסה או כישלון)? היומן עולה לריפו כדי שאפשר
      # יהיה לראות למה - בלי גישה ללוגים של Actions.
      - name: שומר יומן ריצה ריקה
        if: steps.pick.outputs.app != '' && steps.push.outputs.pushed != '1'
        run: |
          set -euo pipefail
          # יומן לכל אפליקציה: ריצות במקביל לא כותבות לאותו קובץ
          APP="${{ steps.pick.outputs.app }}"
          LOG=".claude/qa/last-record-$(echo "$APP" | tr ',' '-').log"
          if [ -f /tmp/rec.log ]; then tail -n 120 /tmp/rec.log > "$LOG"; else echo "אין יומן מהריצה." > "$LOG"; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$LOG"
          # מונה הניסיונות עולה גם בריצה בלי קבצים — אחרת קליפ תקול לא ייצא מהתור לעולם
          git add -- '*/audio/attempts.json' 2>/dev/null || true
          if [ -d .claude/qa/record-spend ]; then git add .claude/qa/record-spend; fi
          if git diff --cached --quiet; then echo "היומן לא השתנה."; exit 0; fi
          git commit -q -m "יומן הקלטה: ריצה בלי קבצים חדשים (record.yml)"
          for TRY in 1 2 3 4 5 6; do
            if git pull --rebase -q origin main && git push -q origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $(( TRY * 7 + RANDOM % 10 ))
          done
          echo "::error::היומן לא נדחף שש פעמים"; exit 1

      - name: כיסוי
        run: |
          {
            echo "### השכבה המוקלטת"
            echo ""
            echo '```'
            node .claude/qa/record.js --plan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
