# פריסת ג׳וש ל-Cloudflare Workers.
#
# **הקובץ הזה אינו מחליף את ההדבקה הידנית** שמתוארת ב-README —
# הוא מוסיף מסלול שני, לפריסה מ-GitHub Actions בלי לפתוח דפדפן.
# worker.js נשאר קובץ אחד בלי npm ובלי build, כפי שהוחלט.
#
# `id` של ה-KV הוא מציין מיקום: הוורקפלו
# .github/workflows/deploy-tutor.yml מוצא או יוצר את המרחב
# ומחליף אותו לפני הפריסה. אין כאן מזהה אמיתי ואין כאן סוד.

name = "tutor"
main = "worker.js"
compatibility_date = "2026-09-01"

# חסם העלות. בלי הקישור הזה worker.js נכשל־סגור ומחזיר 503 —
# וזו התנהגות מכוונת: בלי מונה אין תקרה יומית.
[[kv_namespaces]]
binding = "RATE"
id = "KV_ID_PLACEHOLDER"

# הכתובות שהאתר מוגש מהן. מקור שאינו ברשימה נחסם.
# bekol.co.il נוסף 20.9.2026 לקראת מעבר הדומיין — לצד הכתובת
# הישנה, לא במקומה, כדי שברק ימשיך לעבוד בזמן המעבר.
# ANTHROPIC_API_KEY אינו כאן — הוא Secret, ונכנס בנפרד.
[vars]
ALLOW_ORIGIN = "https://lagstein1-png.github.io,https://bekol.co.il,https://lagstein-hub.onrender.com"

# ---------- סטייג׳ינג — מנוע ברק, 16.9.2026 ----------
# אותו worker.js בדיוק, בשם tutor-staging ועם מרחב KV משלו. כל
# העבודה על הענף נבדקת מולו; `tutor` (הייצור) נפרס רק ב״יאללה״.
# הפריסה: .github/workflows/deploy-tutor-staging.yml — הוא מוצא או
# יוצר מרחב בשם RATE_STAGING ומחליף את מציין המיקום.
[env.staging]
name = "tutor-staging"
[[env.staging.kv_namespaces]]
binding = "RATE"
id = "KV_STAGING_ID_PLACEHOLDER"
[env.staging.vars]
ALLOW_ORIGIN = "https://lagstein1-png.github.io,https://bekol.co.il,https://lagstein-hub.onrender.com"
