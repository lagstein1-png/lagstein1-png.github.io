   Q("ha-derive-2-1",{"he": "המילה \"רַמְזוֹר\" נוצרה בהלחם בסיסים. מאילו שתי מילים הולחמה?", "ar": "كلمة «רַמְזוֹר» نشأت بدمج كلمتين. من أي كلمتين دُمجت؟", "ru": "Слово «רַמְזוֹר» образовано слиянием. Из каких двух слов?", "en": "The word \"רַמְזוֹר\" is a blend. Which two words form it?"},[{"he": "רֶמֶז + אוֹר", "ar": "רֶמֶז + אוֹר (רמז ואור)", "ru": "רֶמֶז + אוֹר", "en": "רֶמֶז + אוֹר (sign + light)"}, {"he": "רֶמֶז + זוֹרֵם", "ar": "רֶמֶז + זוֹרֵם", "ru": "רֶמֶז + זוֹרֵם", "en": "רֶמֶז + זוֹרֵם"}, {"he": "רָמָה + זוֹר", "ar": "רָמָה + זוֹר", "ru": "רָמָה + זוֹר", "en": "רָמָה + זוֹר"}, {"he": "רֶמֶז + זֵר", "ar": "רֶמֶז + זֵר", "ru": "רֶמֶז + זֵר", "en": "רֶמֶז + זֵר"}],0,{"he": "הרמזור נותן אותות באמצעות משהו זוהר.", "ar": "الرامزور يعطي إشارات بواسطة شيء مضيء.", "ru": "Рамзор подаёт сигналы с помощью чего-то светящегося.", "en": "The traffic light gives signals by means of something glowing."},{"he": "הלחם בסיסים לוקח חלק מכל מילה: רמז נתן את רמז, ואור נתן את ור, ויחד נוצר רמזור, מתקן המאיר ונותן רמזים לנהגים. דוגמה נוספת: מגדלור הוא הלחם של מגדל ואור.", "ar": "دمج الكلمات يأخذ جزءًا من كل كلمة: רמז أعطت רמז، وאור أعطت ור، ومعًا نشأ رמזור، جهاز يضيء ويعطي إشارات للسائقين. مثال آخر: מגדלור هو دمج מגדל وאור.", "ru": "Слияние берёт часть каждого слова: רמז дало רמז, а אור дало ור, и вместе получился רמזור - прибор, который светит и подаёт сигналы водителям. Другой пример: מגדלור - слияние מגדל и אור.", "en": "A blend takes part of each word: רמז gave רמז and אור gave ור, forming רמזור, a device that lights up and gives drivers signals. Another example: מגדלור blends מגדל and אור."},null,[null, {"he": "זורם פירושו נובע; המילה אינה קשורה לזרימה.", "ar": "זורם означает течёт; слово не связано с течением.", "ru": "זורם means flowing; the word is unrelated to flow.", "en": "זורם means flowing; the word is unrelated to flow."}, {"he": "רמה פירושה גבעה; אין בה קשר לאותות דרך.", "ar": "רָמָה - холм; нет связи с дорожными сигналами.", "ru": "רָמָה means hill; no connection to road signals.", "en": "רָמָה means hill; no connection to road signals."}, {"he": "זֵר פירושו זר פרחים; אינו קשור לרמזור.", "ar": "זֵר - букет; не связан с рамзором.", "ru": "זֵר means a bouquet; unrelated to the traffic light.", "en": "זֵר means a bouquet; unrelated to the traffic light."}]),
   Q("ha-derive-2-2",{"he": "המילה \"תַּחְבּוֹרָה\" נגזרה מן השורש ח־ב־ר בגזירה קווית. מהי גזירה קווית?", "ar": "كلمة «תַּחְבּוֹרָה» اشتُقت من الجذر ח־ב־ר بالاشتقاق الخطي. ما هو الاشتقاق الخطي؟", "ru": "Слово «תַּחְבּוֹרָה» образовано от корня ח־ב־ר линейным способом. Что такое линейное словообразование?", "en": "The word \"תַּחְבּוֹרָה\" was derived from the root ח־ב־ר linearly. What is linear derivation?"},[{"he": "חיבור של שתי מילים קיימות ליצירת מילה חדשה אחת", "ar": "دمج كلمتين موجودتين لإنشاء كلمة جديدة واحدة", "ru": "соединение двух существующих слов для создания одного нового", "en": "joining two existing words to create one new word"}, {"he": "קיצור של מילה ארוכה לצורה קצרה יותר", "ar": "اختصار كلمة طويلة إلى صيغة أقصر", "ru": "сокращение длинного слова до более короткой формы", "en": "shortening a long word to a shorter form"}, {"he": "שאילת מילה שלמה משפה אחרת", "ar": "اقتراض كلمة كاملة من لغة أخرى", "ru": "заимствование целого слова из другого языка", "en": "borrowing a whole word from another language"}, {"he": "הוספת אותיות מקובלות לאותיות השורש מבלי לשנות את סדרן", "ar": "إضافة حروف مألوفة إلى حروف الجذر دون تغيير ترتيبها", "ru": "добавление принятых букв к буквам корня без изменения их порядка", "en": "adding standard letters to the root letters without changing their order"}],3,{"he": "בגזירה קווית אותיות השורש נשארות במילה, באותו סדר.", "ar": "في الاشتقاق الخطي تبقى حروف الجذر في الكلمة بنفس الترتيب.", "ru": "При линейном способе буквы корня остаются в слове в том же порядке.", "en": "In linear derivation the root letters stay in the word, in the same order."},{"he": "במילה תחבורה נשמרו אותיות השורש ח ב ר בסדרן, והתווספו ת בתחילת המילה וו וה במשפחת הצורנים. כך נוצרות מילים רבות: למשל מכתבה מן כ ת ב ותלמיד מן ל מ ד. לעומת זאת, הלחם בסיסים מחבר שתי מילים, כמו רמזור.", "ar": "في كلمة תחבורה حُفظت حروف الجذر ח ב ר بترتيبها، وأُضيفت ت في البداية وو و ה من عائلة الصيغ. هكذا تُنشأ كلمات كثيرة: مثل מכתבה من כ ת ב وתלמיד من ל מ ד. في المقابل، دمج الكلمات يجمع كلمتين، مثل רמזור.", "ru": "В слове תחבורה буквы корня ח ב ר сохранились в своём порядке, а ת в начале и ו и ה добавлены как служебные. Так образуется много слов: например מכתבה от כ ת ב и תלמיד от ל מ ד. В отличие от этого, слияние соединяет два слова, как רמזור.", "en": "In תחבורה the root letters ח ב ר kept their order, while ת at the start and ו and ה were added as pattern letters. Many words form this way: for example מכתבה from כ ת ב and תלמיד from ל מ ד. By contrast, a blend joins two words, like רמזור."},null,[{"he": "חיבור שתי מילים הוא הלחם בסיסים, לא גזירה קווית.", "ar": "دمج كلمتين هو دمج الأساسات، وليس اشتقاقًا خطيًا.", "ru": "Соединение двух слов - это слияние, а не линейное словообразование.", "en": "Joining two words is blending, not linear derivation."}, {"he": "קיצור מילה הוא דרך אחרת: למשל הפיכת שם משרד לראשי תיבות.", "ar": "اختصار الكلمة طريقة أخرى: مثل تحويل اسم المكتب إلى حروف أولية.", "ru": "Сокращение слова - другой способ, например превращение названия в аббревиатуру.", "en": "Shortening a word is a different way, like turning a name into an acronym."}, {"he": "שאילה היא לקיחת מילה מוכנה משפה זרה, כמו טלפון.", "ar": "الاقتراض هو أخذ كلمة جاهزة من لغة أجنبية، مثل טלפון.", "ru": "Заимствование - взятие готового слова из иностранного языка, как טלפון.", "en": "Borrowing is taking a ready word from a foreign language, like טלפון."}, null]),
   Q("ha-derive-2-3",{"he": "איזו מהמילים הבאות היא מילה שאולה בעברית?", "ar": "أي من الكلمات التالية كلمة دخيلة في العبرية؟", "ru": "Какое из следующих слов является заимствованным в иврите?", "en": "Which of the following words is a loanword in Hebrew?"},[{"he": "סִפְרִיָּה", "ar": "סִפְרִיָּה", "ru": "סִפְרִיָּה", "en": "סִפְרִיָּה (library)"}, {"he": "כִּתָּה", "ar": "כִּתָּה", "ru": "כִּתָּה", "en": "כִּתָּה (classroom)"}, {"he": "אוּנִיבֶרְסִיטָה", "ar": "אוּנִיבֶרְסִיטָה", "ru": "אוּנִיבֶרְסִיטָה", "en": "אוּנִיבֶרְסִיטָה (university)"}, {"he": "מִבְחָן", "ar": "מִבְחָן", "ru": "מִבְחָן", "en": "מִבְחָן (test)"}],2,{"he": "איזו מילה נשמעת דומה במילים ממנה בשפות אחרות של העולם?", "ar": "أي كلمة تبدو مشابهة لمقابلها في لغات العالم الأخرى؟", "ru": "Какое слово звучит похоже на его аналоги в других языках мира?", "en": "Which word sounds similar to its counterparts in other world languages?"},{"he": "אוניברסיטה נשאלה מלטינית דרך שפות אירופה, ולכן היא דומה לצורות שלה בשפות רבות. שאר המילים עבריות מקוריות: ספרייה מן השורש ס פ ר, כיתה מן כ ת ת ומבחן מן ב ח נ. מילים שאולות נוספות: טלפון, אקדמיה וטלוויזיה.", "ar": "كلمة אוניברסיטה اقترضت من اللاتينية عبر لغات أوروبية، ولذلك تشبه صيغها في لغات كثيرة. بقية الكلمات عبرية أصلية: ספרייה من الجذر ס פ ר، وכיתה من כ ת ת، ומבחן من ב ח נ. كلمات دخيلة أخرى: טלפון وאקדמיה וטלוויזיה.", "ru": "Слово אוניברסיטה заимствовано из латыни через европейские языки, поэтому звучит похоже во многих языках. Остальные слова исконно ивритские: ספרייה от корня ס פ ר, כיתה от כ ת ת и מבחן от ב ח נ. Другие заимствования: טלפון, אקדמיה и טלוויזיה.", "en": "אוניברסיטה was borrowed from Latin through European languages, so it sounds similar in many languages. The other words are native Hebrew: ספרייה from the root ס פ ר, כיתה from כ ת ת, and מבחן from ב ח נ. Other loanwords: טלפון, אקדמיה and טלוויזיה."},null,[{"he": "ספרייה עברית מקורית, מן השורש ס פ ר.", "ar": "ספרייה عبرية أصلية، من الجذر ס פ ר.", "ru": "ספרייה - исконно ивритское, от корня ס פ ר.", "en": "ספרייה is native Hebrew, from the root ס פ ר."}, {"he": "כיתה עברית מקורית, מן השורש כ ת ת.", "ar": "כיתה עברית מקורית, מן השורש כ ת ת.", "ru": "כיתה - исконно ивритское, от корня כ ת ת.", "en": "כיתה is native Hebrew, from the root כ ת ת."}, null, {"he": "מבחן עברי מקורי, מן השורש ב ח נ.", "ar": "מבחן עברי מקורי, מן השורש ב ח נ.", "ru": "מבחן - исконно ивритское, от корня ב ח נ.", "en": "מבחן is native Hebrew, from the root ב ח נ."}])

   Q("ha-derive-3-1",{"he": "מהו שורש המילה \"וּבְהִתְרַגְּשׁוּתָם\" (בהתרגשותם)?", "ar": "ما جذر كلمة «וּבְהִתְרַגְּשׁוּתָם» (في انفعالهم)؟", "ru": "Каков корень слова «וּבְהִתְרַגְּשׁוּתָם» (в их волнении)?", "en": "What is the root of the word \"וּבְהִתְרַגְּשׁוּתָם\" (in their excitement)?"},[{"he": "ה־ת־ר־ג־ש", "ar": "هـ־ت־ر־ج־ش", "ru": "ה־ת־ר־ג־ש", "en": "ה־ת־ר־ג־ש"}, {"he": "ת־ר־ג", "ar": "ت־ر־ج", "ru": "ת־ר־ג", "en": "ת־ר־ג"}, {"he": "ב־ה־ר", "ar": "ب־هـ־ر", "ru": "ב־ה־ר", "en": "ב־ה־ר"}, {"he": "ר־ג־ש", "ar": "ر־ج־ش", "ru": "ר־ג־ש", "en": "ר־ג־ש"}],3,{"he": "הורידו את ו בתחילת המילה, את ב, את ה ת של הבניין ואת ו ת ם בסוף.", "ar": "احذفوا و في البداية، و ب، و هـ ت الخاصة بالوزن، و و ת ם في النهاية.", "ru": "Уберите ו в начале, ב, ה и ת биньяна и ו ת ם в конце.", "en": "Remove the initial ו and ב, the ה and ת of the binyan, and the final ו ת ם."},{"he": "במילה ובהתרגשותם האותיות ו ו ב הן אותיות תחילית, ה ות שייכות לבניין התפעל, ו ות ם בסוף הן סיומת. נשארות ר ג ש, שורש הרגש והתרגשות. למשל גם במילה מרגש נמצא אותו שורש.", "ar": "في كلمة ובהתרגשותם الحروف و و ב زائدة في البداية، و ה ות تخص وزن התפעל، و ות ם في النهاية لاحقة. تبقى ר ג ש، جذر רגש وהתרגשות. مثلًا في كلمة מרגש نجد الجذر نفسه.", "ru": "В слове ובהתרגשותם буквы ו и ב - приставки, ה и ת принадлежат биньяну התפעל, а ו ת ם в конце - окончание. Остаются ר ג ש, корень слов רגש и התרגשות. Например, в слове מרגש тот же корень.", "en": "In ובהתרגשותם the letters ו and ב are prefixes, ה and ת belong to the התפעל binyan, and ו ת ם at the end are a suffix. What remains is ר ג ש, the root of רגש and התרגשות. For example, מרגש has the same root."},null,[{"he": "ה ת הן אותיות הבניין התפעל, לא אותיות שורש.", "ar": "هـ ت هما حرفا وزن התפעל، وليسا من الجذر.", "ru": "ה и ת - буквы биньяна התפעל, а не корня.", "en": "ה and ת are letters of the התפעל binyan, not root letters."}, {"he": "השורש אינו ת־ר־ג: הת שייכת לבניין התפעל, והאותיות שנשארות הן ר ג ש.", "ar": "الجذر ليس ت־ر־ج: فالتاء تخص وزن התפעל، والحروف المتبقية هي ر ג ש.", "ru": "Корень не ת־ר־ג: буква ת принадлежит биньяну התפעל, а остающиеся буквы - ר ג ש.", "en": "The root is not ת־ר־ג: the ת belongs to the התפעל binyan, and the remaining letters are ר ג ש."}, {"he": "ב ו ה הן אותיות תחילית, לא חלק מהשורש.", "ar": "ب و هـ حروف زائدة في البداية، وليست من الجذر.", "ru": "ב и ה - приставочные буквы, не часть корня.", "en": "ב and ה are prefix letters, not part of the root."}, null]),
   Q("ha-derive-3-2",{"he": "איזו מילה נוצרה באותה דרך שבה נוצרה המילה \"רמזור\" (הלחם בסיסים)?", "ar": "أي كلمة نشأت بنفس طريقة نشوء كلمة «רמזור» (دمج الأساسات)؟", "ru": "Какое слово образовано тем же способом, что и «רמזור» (слияние)?", "en": "Which word was formed the same way as \"רמזור\" (a blend)?"},[{"he": "מַדְרֵכָה", "ar": "מַדְרֵכָה", "ru": "מַדְרֵכָה", "en": "מַדְרֵכָה (sidewalk)"}, {"he": "מִגְדָּלוֹר", "ar": "מִגְדָּלוֹר", "ru": "מִגְדָּלוֹר", "en": "מִגְדָּלוֹר (lighthouse)"}, {"he": "חַלּוֹן", "ar": "חַלּוֹן", "ru": "חַלּוֹן", "en": "חַלּוֹן (window)"}, {"he": "סְפּוֹרְט", "ar": "סְפּוֹרְט", "ru": "סְפּוֹרְט", "en": "סְפּוֹרְט (sport)"}],1,{"he": "חפשו מילה שגם היא חיבור של שתי מילים: מבנה גבוה ומשהו זוהר.", "ar": "ابحثوا عن كلمة هي أيضًا دمج كلمتين: بناء عالٍ وشيء مضيء.", "ru": "Ищите слово, тоже соединяющее два слова: высокое строение и нечто светящееся.", "en": "Look for a word that also joins two words: a tall structure and something glowing."},{"he": "מגדלור הוא הלחם של מגדל ואור, בדיוק כמו שרמזור הוא הלחם של רמז ואור. מדרכה נגזרה מן השורש ד ר כ, חלון הוא שם עצם בסיסי, וספורט היא מילה שאולה.", "ar": "מגדלור هو دمج מגדל ואור، تمامًا كما أن רמזור هو دمج רמז ואור. أما מדרכה فاشتُقت من الجذر ד ר כ، وחלון اسم أصلي، וספורט كلمة دخيلة.", "ru": "מגדלור - слияние מגדל и אור, точно как רמזור - слияние רמז и אור. מדרכה образовано от корня ד ר כ, חלון - исходное существительное, а ספורט - заимствование.", "en": "מגדלור blends מגדל and אור, exactly as רמזור blends רמז and אור. מדרכה derives from the root ד ר כ, חלון is a basic noun, and ספורט is a loanword."},null,[{"he": "מדרכה נגזרה מן השורש ד ר כ בגזירה קווית, לא בהלחם.", "ar": "מדרכה اشتُقت من الجذر ד ר כ بالاشتقاق الخطي، لا بالدمج.", "ru": "מדרכה образовано от корня ד ר כ линейно, не слиянием.", "en": "מדרכה derives from the root ד ר כ linearly, not by blending."}, null, {"he": "חלון הוא שם עצם בסיסי בעברית, לא הלחם של שתי מילים.", "ar": "חלון اسم أصلي في العبرية، وليس دمج كلمتين.", "ru": "חלון - исходное существительное, не слияние двух слов.", "en": "חלון is a basic Hebrew noun, not a blend of two words."}, {"he": "ספורט היא מילה שאולה משפה זרה, לא הלחם.", "ar": "ספורט كلمة دخيلة من لغة أجنبية، وليست دمجًا.", "ru": "ספורט - заимствование из иностранного языка, не слияние.", "en": "ספורט is a loanword from a foreign language, not a blend."}]),
   Q("ha-derive-3-3",{"he": "מהו שורש המילה \"מִשְׂתָּלָה\" (מקום שמטפחים בו צמחים)?", "ar": "ما جذر كلمة «מִשְׂתָּלָה» (مكان تُرعى فيه النباتات)؟", "ru": "Каков корень слова «מִשְׂתָּלָה» (место, где выращивают растения)?", "en": "What is the root of \"מִשְׂתָּלָה\" (a place where plants are grown)?"},[{"he": "מ־ש־ת־ל", "ar": "מ־ש־ת־ל", "ru": "מ־ש־ת־ל", "en": "מ־ש־ת־ל"}, {"he": "ס־ת־ל", "ar": "س־ت־ل", "ru": "ס־ת־ל", "en": "ס־ת־ל"}, {"he": "ש־ת־ל", "ar": "ش־ت־ل", "ru": "ש־ת־ל", "en": "ש־ת־ל"}, {"he": "ש־ט־ל", "ar": "ش־ط־ل", "ru": "ש־ט־ל", "en": "ש־ט־ל"}],2,{"he": "המילה קרובה לפועל ש מתאר את הפעולה שעושים בצמח צעד אחר צעד באדמה.", "ar": "الكلمة قريبة من الفعل الذي يصف ما يفعلونه بالنبتة الصغيرة في الأرض.", "ru": "Слово близко к глаголу, описывающему то, что делают с саженцем в земле.", "en": "The word is close to the verb describing what one does with a seedling in the soil."},{"he": "האות מ בתחילת המילה היא אות תחילית, והאות ה בסוף היא סיומת. נשארות ש ת ל, שורש השתילה: שותלים צמח באדמה. למשל גם המילה שתיל, צמח שניטע, היא מאותה משפחה.", "ar": "حرف המ في البداية زائد، وحرف ה في النهاية لاحقة. تبقى ש ת ל، جذر השתילה: שותלים نبتة في الأرض. مثلًا كلمة שתיל، نبتة تُغرس، من العائلة نفسها.", "ru": "Буква מ в начале - приставка, а ה в конце - окончание. Остаются ש ת ל, корень посадки: שותלים - сажают растение в землю. Например, слово שתיל, саженец, из той же семьи.", "en": "The letter מ at the start is a prefix and the final ה is a suffix. What remains is ש ת ל, the root of planting: שותלים means planting a plant in the soil. For example, שתיל, a seedling, is from the same family."},null,[{"he": "האות מ היא אות תחילית, לא חלק מהשורש.", "ar": "حرف המ زائد في البداية، وليس من الجذר.", "ru": "Буква מ - приставка, не часть корня.", "en": "The letter מ is a prefix, not part of the root."}, {"he": "האות הראשונה היא ש, לא ס.", "ar": "الحرف الأول هو ש وليس س.", "ru": "Первая буква - ש, а не ס.", "en": "The first letter is ש, not ס."}, null, {"he": "האות האמצעית היא ת, לא ט.", "ar": "الحرف الأوسط هو ת وليس ט.", "ru": "Средняя буква - ת, а не ט.", "en": "The middle letter is ת, not ט."}])
  ]
]);

topic("ha-verb","014381",{"he": "נטיית הפועל", "ar": "تصريف الفعل", "ru": "Спряжение глагола", "en": "Verb inflection"},{"he": "בניינים, זמנים, גופים ושורשים שלמים וגרוניים", "ar": "الأوزان والأزمنة والضمائر والجذور الصحيحة والحلقية", "ru": "Биньяны, времена, лица, правильные и гортанные корни", "en": "Binyanim, tenses, persons, regular and guttural roots"}, [

Q("ha-verb-1-1",{"he": "איזה זמן מביע הפועל \"כתבה\" במשפט \"אתמול דנה כתבה מכתב\"?", "ar": "ما الزمن الذي يدل عليه الفعل «كتبت» في الجملة «كتبت دانا رسالة أمس»؟", "ru": "Какое время выражает глагол «כתבה» в предложении «Вчера Дана написала письмо»?", "en": "What tense does \"כתבה\" express in \"Yesterday Dana wrote a letter\"?"},[{"he": "עבר", "ar": "الماضي", "ru": "прошедшее", "en": "past"}, {"he": "הווה", "ar": "المضارع", "ru": "настоящее", "en": "present"}, {"he": "עתיד", "ar": "المستقبل", "ru": "будущее", "en": "future"}, {"he": "ציווי", "ar": "الأمر", "ru": "повелительное", "en": "imperative"}],0,{"he": "שימו לב למילת הזמן במשפט ולצורת הפועל.", "ar": "انتبهوا إلى كلمة الزمن وصيغة الفعل.", "ru": "Обратите внимание на слово времени и форму глагола.", "en": "Notice the time word and the verb form."},{"he": "\"כתבה\" מתאר פעולה שהסתיימה. למשל: \"אתמול היא שרה\" הוא משפט בזמן עבר.", "ar": "«כתבה» تصف فعلًا انتهى. مثلًا: «غنّت أمس» في الماضي.", "ru": "«כתבה» описывает завершённое действие. Например, «Вчера она пела» стоит в прошедшем времени.", "en": "\"כתבה\" describes a completed action. For example, \"Yesterday she sang\" is in the past tense."},null,[null, {"he": "הצורה אינה מתארת פעולה המתרחשת עכשיו.", "ar": "هذه الصيغة لا تصف فعلًا يحدث الآن.", "ru": "Эта форма не описывает действие сейчас.", "en": "This form does not describe an action happening now."}, {"he": "אין כאן פעולה שטרם התרחשה.", "ar": "لا يدل الفعل على حدث لم يقع بعد.", "ru": "Здесь нет действия, которое ещё не произошло.", "en": "This is not an action yet to happen."}, {"he": "אין כאן הוראה למישהו לבצע פעולה.", "ar": "لا يوجد هنا أمر لشخص بفعل شيء.", "ru": "Здесь никому не велят что-либо сделать.", "en": "No one is being told to do something."}]),
Q("ha-verb-1-2",{"he": "איזה זמן מביע \"יקראו\" במשפט \"מחר הילדים יקראו סיפור\"?", "ar": "ما الزمن الذي تدل عليه «יקראו» في جملة «سيقرأ الأطفال قصة غدًا»؟", "ru": "Какое время у «יקראו» в предложении «Завтра дети прочитают рассказ»?", "en": "What tense does \"יקראו\" express in \"Tomorrow the children will read a story\"?"},[{"he": "עבר", "ar": "الماضي", "ru": "прошедшее", "en": "past"}, {"he": "עתיד", "ar": "المستقبل", "ru": "будущее", "en": "future"}, {"he": "הווה", "ar": "المضارع", "ru": "настоящее", "en": "present"}, {"he": "ציווי", "ar": "الأمر", "ru": "повелительное", "en": "imperative"}],1,{"he": "בדקו אם הפעולה כבר קרתה או עוד תקרה.", "ar": "تحقّقوا هل وقع الفعل أم سيقع لاحقًا.", "ru": "Проверьте, произошло ли действие или ещё произойдёт.", "en": "Check whether the action has happened or is yet to happen."},{"he": "\"יקראו\" מציין פעולה שעדיין לא התרחשה. למשל: \"בשבוע הבא הם ילמדו\" מציין עתיד.", "ar": "«יקראו» يدل على فعل لم يقع بعد. مثلًا: «سيدرسون الأسبوع القادم» يدل على المستقبل.", "ru": "«יקראו» обозначает действие, которое ещё не произошло. Например: «На следующей неделе они будут учиться» - будущее.", "en": "\"יקראו\" names an action that has not happened yet. For example, \"They will study next week\" is future tense."},null,[{"he": "הפעולה אינה מוצגת כפעולה שהסתיימה.", "ar": "لا يُعرض الفعل على أنه حدث وانتهى.", "ru": "Действие не представлено как завершённое.", "en": "The action is not presented as completed."}, null, {"he": "הפעולה אינה מתרחשת בזמן הדיבור.", "ar": "لا يحدث الفعل وقت الكلام.", "ru": "Действие не происходит в момент речи.", "en": "The action is not happening at the time of speaking."}, {"he": "המשפט מוסר מידע ואינו נותן הוראה.", "ar": "الجملة تخبر ولا تأمر.", "ru": "Предложение сообщает, а не приказывает.", "en": "The sentence informs rather than commands."}]),
Q("ha-verb-1-3",{"he": "לאיזה גוף מתייחס הפועל \"לומדים\" במשפט \"אנחנו לומדים עברית\"?", "ar": "إلى أي ضمير يعود الفعل «לומדים» في جملة «نحن نتعلّم العبرية»؟", "ru": "К какому лицу относится «לומדים» в «Мы учим иврит»?", "en": "Which person does \"לומדים\" refer to in \"We are learning Hebrew\"?"},[{"he": "הוא", "ar": "هو", "ru": "он", "en": "he"}, {"he": "הם", "ar": "هم", "ru": "они", "en": "they"}, {"he": "אנחנו", "ar": "نحن", "ru": "мы", "en": "we"}, {"he": "אתם", "ar": "أنتم", "ru": "вы (множ.)", "en": "you (plural)"}],2,{"he": "אתרו את כינוי הגוף שמופיע לפני הפועל.", "ar": "حدّدوا الضمير الذي يسبق الفعل.", "ru": "Найдите местоимение перед глаголом.", "en": "Find the pronoun before the verb."},{"he": "\"אנחנו\" הוא גוף ראשון רבים, והפועל מתאים לו. למשל: \"אנחנו כותבים במחברת\".", "ar": "«אנחנו» ضمير المتكلم الجمع، والفعل يوافقه. مثلًا: «نحن نكتب في الدفتر».", "ru": "«אנחנו» - первое лицо множественного числа; глагол согласуется с ним. Например: «Мы пишем в тетради».", "en": "\"אנחנו\" is first-person plural and the verb agrees with it. For example: \"We write in the notebook.\""},null,[{"he": "זהו גוף שלישי יחיד, שאינו כינוי הגוף במשפט.", "ar": "هذا ضمير الغائب المفرد، وليس الضمير في الجملة.", "ru": "Это третье лицо единственного числа, не местоимение в предложении.", "en": "That is third-person singular, not the pronoun in the sentence."}, {"he": "זהו גוף שלישי רבים; במשפט הדוברים מדברים על עצמם.", "ar": "هذا ضمير الغائب الجمع، لكن المتكلمين يتحدثون عن أنفسهم.", "ru": "Это третье лицо множественного числа; здесь говорящие говорят о себе.", "en": "That is third-person plural; here the speakers refer to themselves."}, null, {"he": "זהו גוף שני רבים, הפונה לנמענים ולא לדוברים.", "ar": "هذا ضمير المخاطبين، لا المتكلمين.", "ru": "Это второе лицо множественного числа, обращение к другим людям.", "en": "That is second-person plural, addressing others rather than the speakers."}]),

Q("ha-verb-2-1",{"he": "לאיזה בניין שייך הפועל \"סיפר\"?", "ar": "إلى أي وزن عبري ينتمي الفعل «סיפר»؟", "ru": "К какому биньяну относится глагол «סיפר»?", "en": "Which binyan does the verb \"סיפר\" belong to?"},[{"he": "קל", "ar": "פָּעַל (קל)", "ru": "пааль (каль)", "en": "Pa’al (Kal)"}, {"he": "נפעל", "ar": "נِفعال", "ru": "нифаль", "en": "Nif’al"}, {"he": "הפעיל", "ar": "هِفعيل", "ru": "hифиль", "en": "Hif’il"}, {"he": "פיעל", "ar": "پيعل", "ru": "пиэль", "en": "Pi’el"}],3,{"he": "השוו את צורת העבר של הפועל לדגם של כל בניין.", "ar": "قارنوا صيغة الماضي بنمط كل وزن.", "ru": "Сравните форму прошедшего времени с образцом каждого биньяна.", "en": "Compare the past-tense form with each binyan pattern."},{"he": "\"סיפר\" בנוי בדגם פיעל, כמו \"דיבר\" ו\"לימד\". השורש ס־פ־ר מופיע גם ב\"סיפור\".", "ar": "«סיפר» على وزن פיעל، مثل «דיבר» و«לימד». ويظهر الجذر ס־פ־ר أيضًا في «סיפור».", "ru": "«סיפר» относится к пиэль, как «דיבר» и «לימד». Корень ס־פ־ר есть и в «סיפור».", "en": "\"סיפר\" follows Pi’el, like \"דיבר\" and \"לימד\". Its root ס־פ־ר also appears in \"סיפור\"."},null,[{"he": "דגם קל שונה מדגם הפועל הנתון.", "ar": "نمط קל يختلف عن صيغة الفعل المعطى.", "ru": "Модель каль отличается от формы данного глагола.", "en": "The Kal pattern differs from this verb form."}, {"he": "בצורת העבר של נפעל מופיעה בדרך כלל נ תחילית.", "ar": "في ماضي נפעל تظهر عادة نون في البداية.", "ru": "У нифаль в прошедшем времени обычно есть начальная נ.", "en": "Nif’al past forms usually have an initial נ."}, {"he": "דגם הפעיל נראה למשל ב\"הדליק\"; כאן אין ה תחילית.", "ar": "نمط הפעיל يظهر مثلًا في «הדליק»؛ هنا لا توجد ה في البداية.", "ru": "Модель хифиль видна, например, в «הדליק»; здесь нет начальной ה.", "en": "Hif’il appears in \"הדליק\"; this form has no initial ה."}, null]),
Q("ha-verb-2-2",{"he": "לאיזה בניין שייך \"הדליק\" במשפט \"השומר הדליק את האור\"?", "ar": "إلى أي وزن ينتمي «הדליק» في جملة «أشعل الحارس الضوء»؟", "ru": "К какому биньяну относится «הדליק» в предложении «Охранник включил свет»?", "en": "Which binyan does \"הדליק\" belong to in \"The guard turned on the light\"?"},[{"he": "הפעיל", "ar": "هِفعيل", "ru": "хифиль", "en": "Hif’il"}, {"he": "פיעל", "ar": "پيعل", "ru": "пиэль", "en": "Pi’el"}, {"he": "נפעל", "ar": "نِفعال", "ru": "нифаль", "en": "Nif’al"}, {"he": "התפעל", "ar": "هِتْپَعِل", "ru": "хитпаэль", "en": "Hitpa’el"}],0,{"he": "בחנו את תחילת הפועל ואת הדגם של צורת העבר.", "ar": "افحصوا بداية الفعل ونمط صيغة الماضي.", "ru": "Проверьте начало глагола и модель прошедшего времени.", "en": "Check the verb’s beginning and past-tense pattern."},{"he": "\"הדליק\" הוא עבר, גוף שלישי יחיד, בבניין הפעיל. למשל: \"הכניס\" בנוי באותו דגם.", "ar": "«הדליק» فعل ماضٍ للغائب المفرد في وزن הפעיל. مثلًا: «הכניס» على النمط نفسه.", "ru": "«הדליק» - прошедшее время, третье лицо единственного числа, биньян хифиль. Например, «הכניס» имеет ту же модель.", "en": "\"הדליק\" is past tense, third-person singular, in Hif’il. For example, \"הכניס\" has the same pattern."},null,[null, {"he": "דגם פיעל אינו כולל ה תחילית כזאת.", "ar": "نمط פיעל لا يتضمن هذه الـה في البداية.", "ru": "У модели пиэль нет такой начальной ה.", "en": "Pi’el does not have this initial ה pattern."}, {"he": "דגם נפעל כולל בדרך כלל נ בתחילת צורת העבר.", "ar": "تبدأ صيغة الماضي في נפעל عادة بحرف נ.", "ru": "Нифаль обычно имеет начальную נ в прошедшем времени.", "en": "Nif’al past forms usually begin with נ."}, {"he": "דגם התפעל כולל את הרצף הת בתחילת צורת העבר.", "ar": "يبدأ ماضي התפעל عادة بالمقطع הת.", "ru": "Хитпаэль обычно начинается с הת в прошедшем времени.", "en": "Hitpa’el past forms begin with הת."}]),
Q("ha-verb-2-3",{"he": "לאיזה בניין שייך \"נכנס\" במשפט \"האורח נכנס לחדר\"?", "ar": "إلى أي وزن ينتمي «נכנס» في جملة «دخل الضيف الغرفة»؟", "ru": "К какому биньяну относится «נכנס» в предложении «Гость вошёл в комнату»?", "en": "Which binyan does \"נכנס\" belong to in \"The guest entered the room\"?"},[{"he": "קל", "ar": "קל", "ru": "каль", "en": "Kal"}, {"he": "נפעל", "ar": "נפעל", "ru": "нифаль", "en": "Nif’al"}, {"he": "פיעל", "ar": "פיעל", "ru": "пиэль", "en": "Pi’el"}, {"he": "הפעיל", "ar": "הפעיל", "ru": "хифиль", "en": "Hif’il"}],1,{"he": "שימו לב לאות שמופיעה לפני אותיות השורש כ־נ־ס.", "ar": "انتبهوا للحرف الذي يسبق حروف الجذر כ־נ־ס.", "ru": "Обратите внимание на букву перед корнем כ־נ־ס.", "en": "Notice the letter before the root כ־נ־ס."},{"he": "שורש הפועל הוא כ־נ־ס, והנון התחילית היא חלק מדגם נפעל בעבר. למשל: \"נשמר\" הוא גם פועל בבניין נפעל.", "ar": "جذر الفعل ك־ن־س، والنون الأولى من وزن נפעל في الماضي. مثلًا «נשמר» من الوزن نفسه.", "ru": "Корень כ־נ־ס; начальная נ принадлежит модели нифаль в прошедшем времени. Например, «נשמר» тоже нифаль.", "en": "The root is כ־נ־ס; the initial נ belongs to the Nif’al past pattern. For example, \"נשמר\" is also Nif’al."},null,[{"he": "בדגם קל אין נ תחילית לפני השורש הזה.", "ar": "في وزن קל لا تسبق الجذر هنا נ زائدة.", "ru": "В модели каль перед этим корнем нет добавочной נ.", "en": "Kal does not add an initial נ before this root."}, null, {"he": "הדגם של פיעל אינו מתחיל בנון הזאת.", "ar": "نمط פיעל لا يبدأ بهذه النون.", "ru": "Модель пиэль не начинается с такой נ.", "en": "Pi’el does not begin with this נ."}, {"he": "הפעיל מאופיין בדגם אחר, כמו \"הכניס\".", "ar": "وزن הפעיל له نمط آخر، مثل «הכניס».", "ru": "У хифиль другая модель, например «הכניס».", "en": "Hif’il has a different pattern, as in \"הכניס\"."}]),

Q("ha-verb-3-1",{"he": "השורש של \"עמד\" הוא ע־מ־ד. לאיזו קבוצת שורשים הוא שייך?", "ar": "جذر «עמד» هو ע־מ־ד. إلى أي مجموعة جذور ينتمي؟", "ru": "Корень «עמד» - ע־מ־ד. К какой группе корней он относится?", "en": "The root of \"עמד\" is ע־מ־ד. Which root group does it belong to?"},[{"he": "נחי ע״ו", "ar": "الأجوفة (ع״و)", "ru": "корни со слабой средней (ע״ו)", "en": "hollow roots (middle-weak)"}, {"he": "נחי ל\"ה", "ar": "المعتلة باللام ה", "ru": "корни с конечной ה", "en": "roots ending in ה"}, {"he": "גרוניות", "ar": "الحلقية", "ru": "гортанные корни", "en": "guttural roots"}, {"he": "כפולים", "ar": "المضاعفة", "ru": "удвоенные корни", "en": "geminate roots"}],2,{"he": "בדקו את אותיות השורש והשוו אותן למאפיינים של קבוצות השורשים.", "ar": "افحصوا حروف الجذر وقارنوها بخصائص مجموعات الجذور.", "ru": "Проверьте буквы корня и сравните их с признаками групп корней.", "en": "Check the root letters against the defining features of root groups."},{"he": "האות ע היא אות גרונית, ולכן ע־מ־ד נמנה עם שורשים גרוניים. למשל גם שורש א־כ־ל מכיל אות גרונית.", "ar": "الحرف ע حرف حلقي، لذا الجذر ע־מ־ד من الجذور الحلقية. وكذلك الجذر א־כ־ל يحوي حرفًا حلقيًا.", "ru": "Буква ע гортанная, поэтому ע־מ־ד - гортанный корень. Корень א־כ־ל тоже содержит гортанную букву.", "en": "The letter ע is guttural, so ע־מ־ד is a guttural root. The root א־כ־ל also contains a guttural letter."},null,[{"he": "בשורש נח ע״ו האות האמצעית חלשה, למשל ק־ו־ם. בע־מ־ד כל שלוש האותיות נשמעות.", "ar": "في الجذر الأجوف الحرف الأوسط ضعيف، مثل ق־و־م. في ע־מ־ד تُسمع الأحرف الثلاثة كلها.", "ru": "В корне ע״ו средняя буква слабая, как в ק־ו־ם. В ע־מ־ד слышны все три буквы.", "en": "A hollow root has a weak middle letter, like ק־ו־ם. In ע־מ־ד all three letters are sounded."}, {"he": "שורש זה מסתיים בדל\"ת, לא בה\"א.", "ar": "ينتهي الجذر بحرف ד لا بحرف ה.", "ru": "Этот корень оканчивается на ד, а не на ה.", "en": "This root ends in ד, not ה."}, null, {"he": "שתי האותיות האחרונות בשורש שונות זו מזו.", "ar": "آخر حرفين من الجذر مختلفان.", "ru": "Последние две буквы корня различны.", "en": "The final two root letters are different."}]),
Q("ha-verb-3-2",{"he": "השלימו את המשפט: \"אתמול אני ___ את ההודעה למורה\".", "ar": "أكملوا الجملة: «أمس أنا ___ الرسالة إلى المعلم».", "ru": "Дополните: «Вчера я ___ сообщение учителю».", "en": "Complete: \"Yesterday I ___ the message to the teacher.\""},[{"he": "כתב", "ar": "كتبَ (هو)", "ru": "написал (он)", "en": "wrote (he)"}, {"he": "כותב", "ar": "يكتب", "ru": "пишет", "en": "write (present)"}, {"he": "אכתוב", "ar": "سأكتب", "ru": "напишу", "en": "will write"}, {"he": "כתבתי", "ar": "كتبتُ", "ru": "написал(а) (я)", "en": "wrote (I)"}],3,{"he": "התאימו גם את הזמן וגם את הגוף למילים שכבר כתובות במשפט.", "ar": "طابقوا الزمن والضمير مع الكلمات الموجودة في الجملة.", "ru": "Согласуйте и время, и лицо с уже данными словами.", "en": "Match both tense and person to the words already in the sentence."},{"he": "\"אתמול\" מכוון לעבר, ו\"אני\" דורש גוף ראשון יחיד: \"כתבתי\". למשל: \"אתמול אני שלחתי מכתב\".", "ar": "«أمس» يدل على الماضي، و«أنا» تتطلب المتكلم المفرد: «כתבתי». مثلًا: «أرسلت رسالة أمس».", "ru": "«Вчера» указывает на прошлое, а «я» требует первого лица единственного числа: «כתבתי». Например: «Вчера я отправил(а) письмо».", "en": "\"Yesterday\" calls for past tense, and \"I\" for first-person singular: \"כתבתי\". For example: \"Yesterday I sent a letter.\""},null,[{"he": "צורה זו היא עבר של גוף שלישי יחיד, לא של \"אני\".", "ar": "هذه صيغة الماضي للغائب المفرد لا للمتكلم.", "ru": "Это прошедшее время третьего лица, не форма для «я».", "en": "That is third-person singular past, not the form for \"I\"."}, {"he": "זו צורת הווה ואינה מתאימה לציון הזמן.", "ar": "هذه صيغة المضارع ولا تناسب ظرف الزمن.", "ru": "Это настоящее время, оно не соответствует указанию времени.", "en": "That is present tense and does not match the time word."}, {"he": "זו צורת עתיד ואינה מתאימה לציון הזמן.", "ar": "هذه صيغة المستقبل ولا تناسب ظرف الزمن.", "ru": "Это будущее время, оно не соответствует указанию времени.", "en": "That is future tense and does not match the time word."}, null]),
Q("ha-verb-3-3",{"he": "השלימו: \"מחר אתם ___ ליד שער בית הספר\". השורש הוא ע־מ־ד.", "ar": "أكملوا: «غدًا أنتم ___ قرب بوابة المدرسة». الجذر ע־מ־ד.", "ru": "Дополните: «Завтра вы ___ у школьных ворот». Корень ע־מ־ד.", "en": "Complete: \"Tomorrow you (plural) ___ by the school gate.\" The root is ע־מ־ד."},[{"he": "תעמדו", "ar": "ستقفون", "ru": "будете стоять", "en": "will stand"}, {"he": "יעמדו", "ar": "سيَقِفون", "ru": "будут стоять (они)", "en": "they will stand"}, {"he": "עמדתם", "ar": "وقفتم", "ru": "стояли (вы)", "en": "you stood"}, {"he": "עומדים", "ar": "تقفون الآن", "ru": "стоите сейчас", "en": "are standing"}],0,{"he": "השוו בין גוף שני רבים לגוף שלישי רבים ובין עבר לעתיד.", "ar": "قارنوا بين المخاطبين والغائبين وبين الماضي والمستقبل.", "ru": "Сравните второе и третье лицо множественного числа, прошлое и будущее.", "en": "Compare second- and third-person plural, and past and future."},{"he": "\"תעמדו\" מתאים ל\"אתם\" ולעתיד. למשל: \"מחר אתם תעבדו יחד\" בנוי באותו גוף וזמן.", "ar": "«תעמדו» يوافق «أنتم» والمستقبل. مثلًا: «غدًا ستعملون معًا» بنفس الشخص والزمن.", "ru": "«תעמדו» согласуется с «אתם» и стоит в будущем времени. Например: «Завтра вы будете работать вместе» - то же лицо и время.", "en": "\"תעמדו\" agrees with \"אתם\" and is future tense. For example, \"Tomorrow you will work together\" has the same person and tense."},null,[null, {"he": "זו צורת עתיד של גוף שלישי רבים, המתאימה ל\"הם\".", "ar": "هذه صيغة المستقبل للغائب الجمع، وتوافق «هم».", "ru": "Это будущее время третьего лица множественного числа, для «они».", "en": "This is third-person plural future, matching \"they\"."}, {"he": "זו צורת עבר של גוף שני רבים.", "ar": "هذه صيغة الماضي للمخاطبين.", "ru": "Это прошедшее время второго лица множественного числа.", "en": "This is second-person plural past."}, {"he": "זו צורת הווה של רבים, לא עתיד.", "ar": "هذه صيغة المضارع للجمع لا المستقبل.", "ru": "Это настоящее время множественного числа, не будущее.", "en": "This is plural present, not future."}]),
],

Q("ha-noun-1-1",{"he": "מה מינה הדקדוקי של \"מחברת\"?", "ar": "ما الجنس النحوي لكلمة «מחברת»؟", "ru": "Какого грамматического рода слово «מחברת»?", "en": "What is the grammatical gender of \"מחברת\"?"},[{"he": "זכר", "ar": "مذكر", "ru": "мужской", "en": "masculine"}, {"he": "נקבה", "ar": "مؤنث", "ru": "женский", "en": "feminine"}, {"he": "זכר ונקבה יחד", "ar": "مذكر ومؤنث معًا", "ru": "оба рода одновременно", "en": "both genders at once"}, {"he": "אין מין דקדוקי", "ar": "لا جنس نحوي لها", "ru": "нет грамматического рода", "en": "no grammatical gender"}],1,{"he": "בדקו איזו צורת תואר מתאימה לשם.", "ar": "افحصوا صيغة الصفة التي توافق الاسم.", "ru": "Проверьте, какая форма прилагательного согласуется с существительным.", "en": "Check which adjective form agrees with the noun."},{"he": "אומרים \"מחברת חדשה\", ולכן השם נקבי. למשל גם \"מפה חדשה\" היא נקבה.", "ar": "نقول «מחברת חדשה» (دفتر جديد بصيغة المؤنث)، فالاسم مؤنث. وكذلك «מפה חדשה».", "ru": "Говорят «מחברת חדשה» (новая тетрадь), значит, слово женского рода. Так же «מפה חדשה».", "en": "We say \"מחברת חדשה\" (a new notebook), so the noun is feminine. \"מפה חדשה\" is feminine too."},null,[{"he": "התואר המתאים הוא \"חדשה\", לא \"חדש\".", "ar": "الصفة الموافقة هي «חדשה» لا «חדש».", "ru": "Подходит «חדשה», а не «חדש».", "en": "The agreeing adjective is \"חדשה\", not \"חדש\"."}, null, {"he": "שם עצם מסוים זה אינו משמש בשני המינים באותו הקשר.", "ar": "هذا الاسم المحدّد لا يُستعمل بالجنسين في السياق نفسه.", "ru": "Это существительное не употребляется сразу в двух родах в данном значении.", "en": "This noun is not used in both genders in this context."}, {"he": "לשמות עצם בעברית יש מין דקדוקי.", "ar": "للأسماء في العبرية جنس نحوي.", "ru": "У существительных в иврите есть грамматический род.", "en": "Hebrew nouns have grammatical gender."}]),
Q("ha-noun-1-2",{"he": "מה צורת הרבים של \"ספר\"?", "ar": "ما صيغة جمع «ספר» (كتاب)؟", "ru": "Какое множественное число у «ספר» (книга)?", "en": "What is the plural of \"ספר\" (book)?"},[{"he": "ספרות", "ar": "كتب (صيغة غير مناسبة هنا)", "ru": "книги (не та форма)", "en": "not the plural here"}, {"he": "ספרים", "ar": "كتب", "ru": "книги", "en": "books"}, {"he": "ספריהם", "ar": "كتبهم", "ru": "их книги", "en": "their books"}, {"he": "ספרי", "ar": "كتبي", "ru": "мои книги", "en": "my books"}],1,{"he": "הבחינו בין צורת רבים לבין צורת שייכות.", "ar": "ميّزوا بين الجمع والملكية.", "ru": "Отличайте множественное число от притяжательной формы.", "en": "Distinguish plural from possession."},{"he": "\"ספרים\" הוא הרבים של \"ספר\": \"בספרייה יש ספרים רבים\". לעומתו \"ספריהם\" מציין שייכות.", "ar": "«ספרים» جمع «ספר»: «في المكتبة كتب كثيرة». أما «ספריהם» فيدل على الملكية.", "ru": "«ספרים» - множественное число от «ספר»: «В библиотеке много книг». «ספריהם» выражает принадлежность.", "en": "\"ספרים\" is the plural of \"ספר\": \"There are many books in the library.\" \"ספריהם\" indicates possession."},null,[{"he": "\"ספרות\" היא מילה אחרת, למשל שם התחום העוסק ביצירות כתובות.", "ar": "«ספרות» كلمة أخرى، مثل اسم مجال الأدب.", "ru": "«ספרות» - другое слово, например «литература».", "en": "\"ספרות\" is another word, for example \"literature\"."}, null, {"he": "זו צורת רבים עם כינוי שייכות, ולא רבים בלבד.", "ar": "هذه صيغة جمع مع ضمير ملكية، وليست جمعًا فقط.", "ru": "Это множественное число с притяжательным суффиксом, не просто множественное число.", "en": "This is plural with a possessive suffix, not plain plural."}, {"he": "זו צורה המציינת שייכות לדובר, לא צורת רבים רגילה.", "ar": "تدل هذه الصيغة على ملكية المتكلم، لا على جمع عادي.", "ru": "Эта форма указывает на принадлежность говорящему, а не на обычное множественное число.", "en": "This indicates possession by the speaker, not an ordinary plural."}]),
Q("ha-noun-1-3",{"he": "איזה שם עצם מתאים לצירוף \"שלוש ___\"?", "ar": "أي اسم يناسب التركيب «שלוש ___» (ثلاث)؟", "ru": "Какое существительное подходит к «שלוש ___» (три)?", "en": "Which noun fits \"שלוש ___\" (three)?"},[{"he": "ספרים", "ar": "كتب", "ru": "книги", "en": "books"}, {"he": "שולחנות", "ar": "طاولات", "ru": "столы", "en": "tables"}, {"he": "מחברות", "ar": "دفاتر", "ru": "тетради", "en": "notebooks"}, {"he": "חלונות", "ar": "نوافذ", "ru": "окна", "en": "windows"}],2,{"he": "בדקו את המין הדקדוקי של כל שם ברבים.", "ar": "افحصوا الجنس النحوي لكل اسم في الجمع.", "ru": "Проверьте род каждого существительного во множественном числе.", "en": "Check the gender of each plural noun."},{"he": "\"מחברת\" היא נקבה, ולכן אומרים \"שלוש מחברות\". למשל: \"שלוש מפות\".", "ar": "«מחברת» مؤنث، لذا نقول «שלוש מחברות». ومثل ذلك «שלוש מפות».", "ru": "«מחברת» женского рода, поэтому говорят «שלוש מחברות». Например: «שלוש מפות».", "en": "\"מחברת\" is feminine, so we say \"שלוש מחברות\". Likewise, \"שלוש מפות\"."},null,[{"he": "\"ספר\" הוא זכר; המספר המתאים הוא \"שלושה\".", "ar": "«ספר» مذكر؛ العدد المناسب هو «שלושה».", "ru": "«ספר» мужского рода; нужно «שלושה».", "en": "\"ספר\" is masculine; use \"שלושה\"."}, {"he": "\"שולחן\" הוא זכר אף שצורת הרבים מסתיימת ב־ות.", "ar": "«שולחן» مذكر رغم أن جمعه ينتهي بـות.", "ru": "«שולחן» мужского рода, хотя множественное число оканчивается на ות.", "en": "\"שולחן\" is masculine although its plural ends in ות."}, null, {"he": "\"חלון\" הוא זכר; המספר המתאים הוא \"שלושה\".", "ar": "«חלון» مذكر؛ العدد المناسب هو «שלושה».", "ru": "«חלון» мужского рода; нужно «שלושה».", "en": "\"חלון\" is masculine; use \"שלושה\"."}]),
],

Q("ha-noun-2-1",{"he": "מהי צורת הסמיכות של \"בית\" ו\"ספר\"?", "ar": "ما صيغة الإضافة العبرية لكلمتي «בית» و«ספר»؟", "ru": "Какая форма сопряжённого сочетания для «בית» и «ספר»?", "en": "What is the construct form of \"בית\" and \"ספר\"?"},[{"he": "בית הספר", "ar": "المدرسة (بيت الكتاب)", "ru": "школа (букв. дом книги)", "en": "the school (literally book-house)"}, {"he": "הבית של ספר", "ar": "بيت كتاب", "ru": "дом книги с предлогом", "en": "the house of a book"}, {"he": "בתים ספר", "ar": "بيوت كتاب", "ru": "дома книга", "en": "houses book"}, {"he": "בית וספר", "ar": "بيت وكتاب", "ru": "дом и книга", "en": "house and book"}],0,{"he": "חפשו צירוף שבו השם הראשון קשור ישירות לשם השני.", "ar": "ابحثوا عن تركيب يتصل فيه الاسم الأول مباشرة بالثاني.", "ru": "Ищите сочетание, где первое существительное непосредственно связано со вторым.", "en": "Look for a phrase in which the first noun directly links to the second."},{"he": "\"בית הספר\" הוא צירוף סמיכות: \"בית\" נסמך ל\"ספר\". למשל: \"חדר המורים\" הוא צירוף סמיכות נוסף.", "ar": "«בית הספר» تركيب إضافة: «בית» مضاف إلى «ספר». ومثله «חדר המורים».", "ru": "«בית הספר» - сопряжённое сочетание: «בית» связано с «ספר». Например, «חדר המורים» - ещё одно такое сочетание.", "en": "\"בית הספר\" is a construct phrase: \"בית\" is linked to \"ספר\". \"חדר המורים\" is another example."},null,[null, {"he": "זה אינו הצירוף המקובל לשני השמות האלה.", "ar": "هذا ليس التركيب المعتاد لهذين الاسمين.", "ru": "Это не принятое сочетание этих двух существительных.", "en": "This is not the established phrase for these nouns."}, {"he": "כאן שם העצם הראשון ברבים, והצירוף אינו תקין.", "ar": "الاسم الأول هنا جمع والتركيب غير سليم.", "ru": "Первое существительное здесь во множественном числе, а сочетание неверно.", "en": "The first noun is plural here, and the phrase is incorrect."}, {"he": "ו החיבור מחברת שתי מילים, אך אינה יוצרת סמיכות.", "ar": "واو العطف تصل كلمتين لكنها لا تصنع إضافة.", "ru": "Союз «и» соединяет слова, но не образует сопряжённую конструкцию.", "en": "The conjunction \"and\" joins words but does not make a construct phrase."}]),
Q("ha-noun-2-2",{"he": "השלימו: \"קראתי שני ___ חדשים\".", "ar": "أكملوا: «قرأتُ ___ جديدين».", "ru": "Дополните: «Я прочитал(а) два новых ___».", "en": "Complete: \"I read two new ___.\""},[{"he": "ספרות", "ar": "أدب", "ru": "литература", "en": "literature"}, {"he": "ספר", "ar": "كتاب", "ru": "книга", "en": "book"}, {"he": "ספרים", "ar": "كتب", "ru": "книги", "en": "books"}, {"he": "ספריהם", "ar": "كتبهم", "ru": "их книги", "en": "their books"}],2,{"he": "בדקו התאמה בין המספר, השם והתואר.", "ar": "افحصوا التوافق بين العدد والاسم والصفة.", "ru": "Проверьте согласование числительного, существительного и прилагательного.", "en": "Check agreement among numeral, noun, and adjective."},{"he": "\"שני ספרים חדשים\" מתאים לריבוי ולמין הזכר. למשל: \"שני תלמידים חרוצים\".", "ar": "«שני ספרים חדשים» يوافق الجمع المذكر. ومثله «שני תלמידים חרוצים».", "ru": "«שני ספרים חדשים» согласуется по мужскому роду и множественному числу. Например: «שני תלמידים חרוצים».", "en": "\"שני ספרים חדשים\" agrees in masculine plural. Compare \"שני תלמידים חרוצים\"."},null,[{"he": "\"ספרות\" היא שם תחום, ולא הרבים של \"ספר\".", "ar": "«ספרות» اسم مجال الأدب وليس جمع «ספר».", "ru": "«ספרות» означает литературу, а не множественное число слова «ספר».", "en": "\"ספרות\" names literature, not the plural of \"ספר\"."}, {"he": "שם יחיד אינו מתאים ל\"שני\" ול\"חדשים\".", "ar": "الاسم المفرد لا يوافق «שני» ولا «חדשים».", "ru": "Единственное число не согласуется с «שני» и «חדשים».", "en": "A singular noun does not agree with \"שני\" and \"חדשים\"."}, null, {"he": "כינוי השייכות מוסיף משמעות של בעלות שאינה נדרשת במשפט.", "ar": "ضمير الملكية يضيف معنى لا يحتاج إليه السياق.", "ru": "Притяжательный суффикс добавляет ненужное значение принадлежности.", "en": "The possessive suffix adds ownership that the sentence does not call for."}]),
Q("ha-noun-2-3",{"he": "השלימו: \"המורה חילקה את הדפים ל___ התלמידות\".", "ar": "أكملوا: «وزّعت المعلمة الأوراق على ___ الطالبات».", "ru": "Дополните: «Учительница раздала листы ___ ученицам».", "en": "Complete: \"The teacher gave the sheets to ___ students (female).\""},[{"he": "שלושה", "ar": "ثلاثة (مذكر)", "ru": "троим (муж.)", "en": "three (masculine)"}, {"he": "שלוש", "ar": "ثلاث (مؤنث)", "ru": "трём (жен.)", "en": "three (feminine)"}, {"he": "שלישי", "ar": "الثالث", "ru": "третьему", "en": "third (masculine)"}, {"he": "שלישית", "ar": "الثالثة", "ru": "третьей", "en": "third (feminine)"}],1,{"he": "האם צריך מספר מונה או סודר, ומה מינו של השם?", "ar": "هل المطلوب عدد أصلي أم ترتيبي، وما جنس الاسم؟", "ru": "Нужно количественное или порядковое числительное? Каков род существительного?", "en": "Is a cardinal or ordinal numeral needed, and what is the noun’s gender?"},{"he": "\"שלוש\" הוא מספר מונה המתאים לנקבה: \"שלוש התלמידות\". למשל \"ארבע הבנות\".", "ar": "«שלוש» عدد أصلي للمؤنث: «שלוש התלמידות». ومثل ذلك «ארבע הבנות».", "ru": "«שלוש» - количественное числительное для женского рода: «שלוש התלמידות». Например: «ארבע הבנות».", "en": "\"שלוש\" is a feminine cardinal numeral: \"שלוש התלמידות\". Compare \"ארבע הבנות\"."},null,[{"he": "זו צורת מנייה לזכר, ואילו \"תלמידות\" היא נקבה.", "ar": "هذه صيغة العدّ للمذكر، و«תלמידות» مؤنث.", "ru": "Это форма для мужского рода, а «תלמידות» - женского.", "en": "That counts masculine nouns, while \"תלמידות\" is feminine."}, null, {"he": "זהו מספר סודר לזכר, המציין מקום בסדר ולא כמות.", "ar": "هذا عدد ترتيبي مذكر يدل على الترتيب لا الكمية.", "ru": "Это порядковое числительное мужского рода, оно обозначает место, а не количество.", "en": "That is a masculine ordinal, indicating position rather than quantity."}, {"he": "זהו מספר סודר המציין מיקום בסדר ולא כמות של תלמידות.", "ar": "هذا عدد ترتيبي يدل على الترتيب لا عدد الطالبات.", "ru": "Это порядковое числительное: оно обозначает порядок, а не число учениц.", "en": "That is an ordinal, indicating position rather than the number of students."}]),
],

Q("ha-noun-3-1",{"he": "איזה צירוף סמיכות מיודע כראוי?", "ar": "أي تركيب إضافة معرّف بصورة صحيحة؟", "ru": "Какое сопряжённое словосочетание правильно определено?", "en": "Which construct phrase is correctly definite?"},[{"he": "החדר המורים", "ar": "غرفة المعلّمين (صيغة خاطئة)", "ru": "комната учителей (ошибочная форма)", "en": "the teachers room (incorrect form)"}, {"he": "החדר של המורים", "ar": "غرفة المعلّمين مع «של»", "ru": "комната учителей с «של»", "en": "the room of the teachers with \"של\""}, {"he": "חדר מורים", "ar": "غرفة معلّمين نكرة", "ru": "учительская (без артикля)", "en": "a teachers room"}, {"he": "חדר המורים", "ar": "غرفة المعلّمين", "ru": "учительская", "en": "the teachers room"}],3,{"he": "בסמיכות, בדקו היכן מופיעה ה הידיעה.", "ar": "في الإضافة، افحصوا موضع أداة التعريف ה.", "ru": "В сопряжённом сочетании проверьте, где стоит определённый артикль ה.", "en": "In a construct phrase, check where the definite article ה appears."},{"he": "בצירוף סמיכות מיודע ה הידיעה באה לפני הסומך: \"חדר המורים\". למשל: \"תיק התלמיד\".", "ar": "في الإضافة المعرّفة تأتي ה قبل المضاف إليه: «חדר המורים». ومثله «תיק התלמיד».", "ru": "В определённом сопряжённом сочетании артикль ה стоит при втором слове: «חדר המורים». Например: «תיק התלמיד».", "en": "In a definite construct phrase, ה attaches to the second noun: \"חדר המורים\". Compare \"תיק התלמיד\"."},null,[{"he": "ה הידיעה אינה באה לפני הנסמך בצירוף סמיכות רגיל.", "ar": "لا تأتي ה التعريف قبل المضاف في تركيب الإضافة المعتاد.", "ru": "В обычном сопряжённом сочетании артикль не ставят перед первым словом.", "en": "The article does not go on the first noun of an ordinary construct phrase."}, {"he": "זהו צירוף עם \"של\", ולא צורת סמיכות.", "ar": "هذا تركيب مع «של» وليس إضافة مباشرة.", "ru": "Это конструкция с «של», а не сопряжённая форма.", "en": "This uses \"של\", not the construct form."}, {"he": "ללא ה הידיעה הצירוף אינו מיודע.", "ar": "بلا أداة التعريف ה لا يكون التركيب معرّفًا.", "ru": "Без артикля ה сочетание не является определённым.", "en": "Without ה, this phrase is not definite."}, null]),
Q("ha-noun-3-2",{"he": "השלימו: \"נועה סיימה במקום ה___ בתחרות\".", "ar": "أكملوا: «أنهت نوعا المسابقة في المرتبة الـ___».", "ru": "Дополните: «Ноа заняла ___ место на соревновании».", "en": "Complete: \"Noa finished in ___ place in the competition.\""},[{"he": "שלוש", "ar": "ثلاث", "ru": "три (жен.)", "en": "three (feminine)"}, {"he": "שלישי", "ar": "الثالث", "ru": "третий", "en": "third (masculine)"}, {"he": "שלישית", "ar": "الثالثة", "ru": "третья", "en": "third (feminine)"}, {"he": "שלושה", "ar": "ثلاثة", "ru": "три (муж.)", "en": "three (masculine)"}],1,{"he": "שימו לב לשם שאחרי \"במקום\" ולמשמעות של דירוג.", "ar": "انتبهوا لاسم «מקום» ومعنى الترتيب.", "ru": "Обратите внимание на слово «מקום» и смысл места в соревновании.", "en": "Notice the noun \"מקום\" and the meaning of rank."},{"he": "\"מקום\" הוא זכר, ודירוג מביעים במספר סודר: \"במקום השלישי\". למשל: \"הוא הגיע למקום השני\".", "ar": "«מקום» مذكر، ويُعبّر عن المرتبة بعدد ترتيبي: «במקום השלישי». مثلًا: «وصل إلى المرتبة الثانية».", "ru": "«מקום» мужского рода; место выражают порядковым числительным: «במקום השלישי». Например: «Он занял второе место».", "en": "\"מקום\" is masculine, and rank uses an ordinal: \"במקום השלישי\". For example: \"He came in second place.\""},null,[{"he": "זהו מספר מונה לנקבה, לא דירוג.", "ar": "هذا عدد أصلي للمؤنث، لا ترتيب.", "ru": "Это количественное числительное женского рода, а не номер места.", "en": "That is a feminine cardinal, not a rank."}, null, {"he": "זו צורת סודר לנקבה, אך \"מקום\" הוא זכר.", "ar": "هذا عدد ترتيبي مؤنث، لكن «מקום» مذكر.", "ru": "Это порядковое числительное женского рода, а «מקום» мужского.", "en": "That is a feminine ordinal, but \"מקום\" is masculine."}, {"he": "זהו מספר מונה לזכר, לא מספר סודר.", "ar": "هذا عدد أصلي للمذكر لا ترتيبي.", "ru": "Это количественное числительное мужского рода, не порядковое.", "en": "That is a masculine cardinal, not an ordinal."}]),
Q("ha-noun-3-3",{"he": "מהי צורת הסמיכות של \"ספרים\" ו\"לימוד\" בצירוף שמשמעותו ספרים ללימוד?", "ar": "ما صيغة الإضافة لـ«ספרים» و«לימוד» بمعنى كتب للدراسة؟", "ru": "Какова сопряжённая форма «ספרים» и «לימוד» в значении учебных книг?", "en": "What is the construct form of \"ספרים\" and \"לימוד\" meaning study books?"},[{"he": "ספרי לימוד", "ar": "كتب دراسية", "ru": "учебники", "en": "study books"}, {"he": "ספרים לימוד", "ar": "كتب دراسة (صيغة غير صحيحة)", "ru": "книги учёба (неверно)", "en": "books study (incorrect)"}, {"he": "הספרים לימוד", "ar": "الكتب دراسة (صيغة غير صحيحة)", "ru": "книги учёба с артиклем (неверно)", "en": "the books study (incorrect)"}, {"he": "ספרים של לימוד", "ar": "كتب للتعلّم مع «של»", "ru": "книги для учёбы с «של»", "en": "books of study with \"של\""}],0,{"he": "בדקו איך משתנה סיומת רבים בזכר כשהשם בא ראשון בסמיכות.", "ar": "افحصوا كيف تتغيّر نهاية جمع المذكر حين يأتي الاسم أولًا في الإضافة.", "ru": "Проверьте, как меняется окончание множественного числа мужского рода у первого слова.", "en": "Check how the masculine plural ending changes on the first noun."},{"he": "בנסמך ברבים הסיומת \"־ים\" משתנה ל\"־י\": \"ספרי לימוד\". למשל: \"תלמידי הכיתה\".", "ar": "في المضاف جمع المذكر تتحوّل النهاية «־ים» إلى «־י»: «ספרי לימוד». ومثلها «תלמידי הכיתה».", "ru": "У первого слова мужского рода во множественном числе окончание «־ים» меняется на «־י»: «ספרי לימוד». Например: «תלמידי הכיתה».", "en": "In a masculine plural construct, ־ים becomes ־י: \"ספרי לימוד\". Compare \"תלמידי הכיתה\"."},null,[null, {"he": "שם הרבים הראשון לא הועבר לצורת הנסמך.", "ar": "لم يتحوّل الاسم الأول الجمع إلى صيغة المضاف.", "ru": "Первое слово во множественном числе не переведено в сопряжённую форму.", "en": "The first plural noun has not taken its construct form."}, {"he": "ה הידיעה והסיומת נשארו בצורתם הרגילה; זו אינה סמיכות תקינה.", "ar": "بقيت أداة التعريف ونهاية الجمع بصيغتهما العادية؛ هذه ليست إضافة صحيحة.", "ru": "Артикль и окончание остались в обычной форме; это не верная сопряжённая конструкция.", "en": "The article and ending remain in ordinary form; this is not a valid construct."}, {"he": "זהו צירוף עם \"של\", ולא צורת הסמיכות המבוקשת.", "ar": "هذا تركيب مع «של» لا صيغة الإضافة المطلوبة.", "ru": "Это конструкция с «של», а не требуемая сопряжённая форма.", "en": "This uses \"של\", not the requested construct form."}]),

Q("ha-syntax-1-1",{"he": "איזה משפט הוא משפט פועלי?", "ar": "أي جملة هي جملة فعلية؟", "ru": "Какое предложение является глагольным?", "en": "Which sentence is verbal?"},[{"he": "הספר על המדף.", "ar": "الكتاب على الرف.", "ru": "Книга на полке.", "en": "The book is on the shelf."}, {"he": "הילדה קוראת סיפור.", "ar": "تقرأ الفتاة قصة.", "ru": "Девочка читает рассказ.", "en": "The girl reads a story."}, {"he": "החצר רחבה.", "ar": "السад واسع.", "ru": "Двор просторный.", "en": "The yard is spacious."}, {"he": "אחי תלמיד בתיכון.", "ar": "أخي طالب في المدرسة الثانوية.", "ru": "Мой брат - старшеклассник.", "en": "My brother is a high-school student."}],1,{"he": "בדקו אם הנשוא הוא פועל נטוי.", "ar": "افحصوا هل الخبر فعل مصرّف.", "ru": "Проверьте, является ли сказуемое личной формой глагола.", "en": "Check whether the predicate is a conjugated verb."},{"he": "ב\"הילדה קוראת סיפור\" הנשוא \"קוראת\" הוא פועל. למשל: \"הילד כותב מכתב\" הוא משפט פועלי.", "ar": "في «הילדה קוראת סיפור» الخبر «קוראת» فعل. ومثلها «الولد يكتب رسالة».", "ru": "В «הילדה קוראת סיפור» сказуемое «קוראת» - глагол. Например, «Мальчик пишет письмо» - глагольное предложение.", "en": "In \"הילדה קוראת סיפור\", \"קוראת\" is a verb predicate. \"The boy writes a letter\" is also verbal."},null,[{"he": "הנשוא כאן אינו פועל נטוי.", "ar": "الخبر هنا ليس فعلًا مصرّفًا.", "ru": "Сказуемое здесь не личная форма глагола.", "en": "The predicate here is not a conjugated verb."}, null, {"he": "\"רחבה\" הוא תואר, לא פועל נטוי.", "ar": "«רחבה» صفة لا فعل مصرّف.", "ru": "«רחבה» - прилагательное, не личная форма глагола.", "en": "\"רחבה\" is an adjective, not a conjugated verb."}, {"he": "\"תלמיד\" הוא שם עצם, לא פועל נטוי.", "ar": "«תלמיד» اسم لا فعل مصرّف.", "ru": "«תלמיד» - существительное, не личная форма глагола.", "en": "\"תלמיד\" is a noun, not a conjugated verb."}]),
Q("ha-syntax-1-2",{"he": "מהו הנושא במשפט \"התלמידים פתרו את התרגיל\"?", "ar": "ما الفاعل في جملة «حلّ التلاميذ التمرين»؟", "ru": "Что является подлежащим в «התלמידים פתרו את התרגיל»?", "en": "What is the subject of \"התלמידים פתרו את התרגיל\"?"},[{"he": "התלמידים", "ar": "التلاميذ", "ru": "ученики", "en": "the students"}, {"he": "פתרו", "ar": "حلّوا", "ru": "решили", "en": "solved"}, {"he": "את התרגיל", "ar": "التمرين", "ru": "упражнение", "en": "the exercise"}, {"he": "התרגיל", "ar": "التمرين", "ru": "упражнение", "en": "exercise"}],0,{"he": "שאלו מי ביצע את הפעולה.", "ar": "اسألوا من قام بالفعل.", "ru": "Спросите, кто совершил действие.", "en": "Ask who performed the action."},{"he": "\"התלמידים\" הם המבצעים את הפעולה ולכן הם הנושא. למשל: ב\"המורה הסבירה\" הנושא הוא \"המורה\".", "ar": "«التلاميذ» هم من قاموا بالفعل، لذا هم الفاعل. ومثلًا فاعل «شرحت المعلمة» هو «المعلمة».", "ru": "«התלמידים» выполняют действие и являются подлежащим. Например, в «המורה הסבירה» подлежащее - «המורה».", "en": "\"התלמידים\" perform the action and are the subject. In \"המורה הסבירה\", the subject is \"המורה\"."},null,[null, {"he": "זהו הנשוא הפועלי: הפעולה שנעשתה.", "ar": "هذا هو الفعل الذي يبيّن الحدث.", "ru": "Это глагольное сказуемое, обозначающее действие.", "en": "This is the verb predicate, the action performed."}, {"he": "זהו המושא של הפועל, לא מבצע הפעולה.", "ar": "هذا مفعول به لا فاعل.", "ru": "Это дополнение, а не исполнитель действия.", "en": "This is the object, not the actor."}, {"he": "השם מציין את מה שפתרו, לא את מי שפתר.", "ar": "يدل الاسم على ما حُلّ لا من حلّه.", "ru": "Слово обозначает то, что решили, а не того, кто решил.", "en": "The noun names what was solved, not who solved it."}]),
Q("ha-syntax-1-3",{"he": "איזה משפט תקין מבחינת התאם מין ומספר?", "ar": "أي جملة صحيحة من حيث توافق الجنس والعدد؟", "ru": "Какое предложение правильно по согласованию рода и числа?", "en": "Which sentence has correct gender and number agreement?"},[{"he": "הילדות משחק.", "ar": "البنات يلعب (غير متوافق).", "ru": "Девочки играет.", "en": "The girls plays."}, {"he": "הילדות משחקת.", "ar": "البنات تلعب (غير متوافق).", "ru": "Девочки играет (жен. ед.).", "en": "The girls plays (singular)."}, {"he": "הילדות משחקים.", "ar": "البنات играют (мужская форма).", "ru": "Девочки играют (мужская форма).", "en": "The girls play (masculine form)."}, {"he": "הילדות משחקות.", "ar": "البنات يلعبن.", "ru": "Девочки играют.", "en": "The girls play."}],3,{"he": "התאימו את הפועל לנושא גם במין וגם במספר.", "ar": "طابقوا الفعل مع الفاعل في الجنس والعدد.", "ru": "Согласуйте глагол с подлежащим по роду и числу.", "en": "Match the verb to the subject in both gender and number."},{"he": "\"הילדות\" הן נקבה רבות, ולכן הפועל בהווה הוא \"משחקות\". למשל: \"התלמידות לומדות\".", "ar": "«הילדות» جمع مؤنث، لذلك الفعل المضارع «משחקות». مثلًا: «الطالبات يدرسن».", "ru": "«הילדות» - женский род множественного числа, поэтому глагол в настоящем времени - «משחקות». Например: «התלמידות לומדות».", "en": "\"הילדות\" is feminine plural, so the present verb is \"משחקות\". Compare \"התלמידות לומדות\"."},null,[{"he": "הפועל כאן ביחיד זכר, והנושא ברבות נקבה.", "ar": "الفعل مفرد مذكر والفاعل جمع مؤنث.", "ru": "Глагол мужского рода единственного числа, подлежащее женского рода множественного.", "en": "The verb is masculine singular; the subject is feminine plural."}, {"he": "הפועל כאן ביחידה נקבה, והנושא ברבות.", "ar": "الفعل مفرد مؤنث والفاعل جمع.", "ru": "Глагол женского рода единственного числа, подлежащее множественного.", "en": "The verb is feminine singular; the subject is plural."}, {"he": "הפועל כאן ברבים זכר, והנושא ברבות נקבה.", "ar": "الفعل جمع مذكر والفاعل جمع مؤنث.", "ru": "Глагол мужского рода множественного числа, подлежащее женского рода множественного.", "en": "The verb is masculine plural; the subject is feminine plural."}, null]),

Q("ha-syntax-2-1",{"he": "מהו האוגד במשפט \"רחל היא תלמידה מצטיינת\"?", "ar": "ما الرابطة في جملة «راحيل طالبة متفوّقة»؟", "ru": "Что является связкой в «רחל היא תלמידה מצטיינת»?", "en": "What is the copula in \"רחל היא תלמידה מצטיינת\"?"},[{"he": "רחל", "ar": "راحيل", "ru": "Рахель", "en": "Rachel"}, {"he": "תלמידה", "ar": "طالبة", "ru": "ученица", "en": "student"}, {"he": "היא", "ar": "هي", "ru": "она", "en": "she"}, {"he": "מצטיינת", "ar": "متفوّقة", "ru": "отличница", "en": "outstanding"}],2,{"he": "חפשו את המילה המחברת בין הנושא לבין הנשוא השמני.", "ar": "ابحثوا عن الكلمة التي تصل المبتدأ بالخبر الاسمي.", "ru": "Найдите слово, связывающее подлежащее с именным сказуемым.", "en": "Find the word linking the subject with the nominal predicate."},{"he": "\"היא\" מחברת בין \"רחל\" לבין הנשוא השמני \"תלמידה מצטיינת\". למשל: \"אורי הוא רופא\".", "ar": "«היא» تصل «רחל» بالخبر الاسمي «תלמידה מצטיינת». ومثلها «أوري طبيب» وفي العبرية «אורי הוא רופא».", "ru": "«היא» связывает «רחל» с именным сказуемым «תלמידה מצטיינת». Например: «אורי הוא רופא».", "en": "\"היא\" links \"רחל\" to the nominal predicate \"תלמידה מצטיינת\". Compare \"אורי הוא רופא\"."},null,[{"he": "זהו הנושא, לא מילת הקישור.", "ar": "هذا هو المبتدأ لا الرابطة.", "ru": "Это подлежащее, не связка.", "en": "That is the subject, not the linking word."}, {"he": "זהו חלק מן הנשוא השמני, לא האוגד.", "ar": "هذا جزء من الخبر الاسمي لا الرابطة.", "ru": "Это часть именного сказуемого, не связка.", "en": "This is part of the nominal predicate, not the copula."}, null, {"he": "זהו תואר המתאר את התלמידה, לא האוגד.", "ar": "هذه صفة تصف الطالبة، لا الرابطة.", "ru": "Это прилагательное, описывающее ученицу, не связка.", "en": "This adjective describes the student; it is not the copula."}]),
Q("ha-syntax-2-2",{"he": "השלימו בלשון תקינה: \"מחר אני ___ לבית הספר מוקדם\".", "ar": "أكملوا بالعبرية الصحيحة: «غدًا أنا ___ إلى المدرسة مبكرًا».", "ru": "Дополните на правильном иврите: «Завтра я ___ в школу рано».", "en": "Complete in standard Hebrew: \"Tomorrow I ___ to school early.\""},[{"he": "יבוא", "ar": "سيأتي هو", "ru": "придёт он", "en": "he will come"}, {"he": "אבוא", "ar": "سآتي", "ru": "приду я", "en": "I will come"}, {"he": "בא", "ar": "يأتي", "ru": "приходит", "en": "comes"}, {"he": "באתם", "ar": "أتيتم", "ru": "пришли вы", "en": "you came"}],1,{"he": "בדקו את הגוף והזמן של הפועל, לא רק את משמעותו.", "ar": "افحصوا الضمير والزمن، لا المعنى فقط.", "ru": "Проверьте лицо и время глагола, не только значение.", "en": "Check the verb’s person and tense, not just its meaning."},{"he": "\"אני אבוא\" היא צורת עתיד של גוף ראשון יחיד. למשל: \"מחר אני אלמד\".", "ar": "«אני אבוא» صيغة المستقبل للمتكلم المفرد. مثلًا: «غدًا سأدرس».", "ru": "«אני אבוא» - будущее время первого лица единственного числа. Например: «Завтра я буду учиться».", "en": "\"אני אבוא\" is first-person singular future. Compare \"מחר אני אלמד\"."},null,[{"he": "זו צורת עתיד של גוף שלישי יחיד, שאינה מתאימה ל\"אני\".", "ar": "هذه صيغة مستقبل للغائب المفرد ولا توافق «أنا».", "ru": "Это будущее время третьего лица единственного числа, не для «я».", "en": "This is third-person singular future, not for \"I\"."}, null, {"he": "זו צורת הווה ואינה תואמת את \"מחר\".", "ar": "هذه صيغة الحاضر ولا توافق «غدًا».", "ru": "Это форма настоящего времени, не соответствует «завтра».", "en": "This is present tense and does not match \"tomorrow\"."}, {"he": "זו צורת עבר של גוף שני רבים.", "ar": "هذه صيغة الماضي للمخاطبين.", "ru": "Это прошедшее время второго лица множественного числа.", "en": "This is second-person plural past."}]),
Q("ha-syntax-2-3",{"he": "מהו הנשוא במשפט השמני \"הדרך ארוכה\"?", "ar": "ما الخبر في الجملة الاسمية «الطريق طويلة»؟", "ru": "Что является сказуемым в именном предложении «הדרך ארוכה»?", "en": "What is the predicate in the nominal sentence \"הדרך ארוכה\"?"},[{"he": "הדרך", "ar": "الطريق", "ru": "дорога", "en": "the road"}, {"he": "הדרך ארוכה", "ar": "الطريق طويلة", "ru": "дорога длинная", "en": "the road is long"}, {"he": "דרך", "ar": "طريق", "ru": "дорога", "en": "road"}, {"he": "ארוכה", "ar": "طويلة", "ru": "длинная", "en": "long"}],3,{"he": "שאלו מה נאמר על הנושא.", "ar": "اسألوا ماذا قيل عن المبتدأ.", "ru": "Спросите, что сообщается о подлежащем.", "en": "Ask what is said about the subject."},{"he": "\"ארוכה\" הוא הנשוא: הוא מוסר תכונה של \"הדרך\". למשל: ב\"החדר שקט\" הנשוא הוא \"שקט\".", "ar": "«ארוכה» هو الخبر، فهو يصف «הדרך». ومثلًا خبر «الغرفة هادئة» هو «هادئة».", "ru": "«ארוכה» - сказуемое: оно сообщает признак слова «הדרך». Например, в «החדר שקט» сказуемое - «שקט».", "en": "\"ארוכה\" is the predicate, giving a quality of \"הדרך\". In \"החדר שקט\", the predicate is \"שקט\"."},null,[{"he": "זהו הנושא, שעליו נאמרת התכונה.", "ar": "هذا هو المبتدأ الذي تُذكر صفته.", "ru": "Это подлежащее, о котором сообщается признак.", "en": "That is the subject whose quality is described."}, {"he": "הצירוף כולל גם נושא וגם נשוא, ולא נשוא בלבד.", "ar": "يشمل التركيب المبتدأ والخبر، لا الخبر وحده.", "ru": "Фраза включает и подлежащее, и сказуемое, а не только сказуемое.", "en": "This includes both subject and predicate, not just predicate."}, {"he": "זו צורת שם ללא יידוע; במשפט מופיע הנושא המיודע.", "ar": "هذا اسم غير معرّف؛ في الجملة المبتدأ معرّف.", "ru": "Это существительное без артикля; в предложении подлежащее определённое.", "en": "That is an indefinite noun form; the sentence has a definite subject."}, null]),

Q("ha-syntax-3-1",{"he": "במשפט \"התלמידים היו עייפים אחרי הבחינה\", מה תפקיד \"היו\"?", "ar": "في جملة «كان الطلاب متعبين بعد الامتحان»، ما وظيفة «היו»؟", "ru": "Какова роль «היו» в «התלמידים היו עייפים אחרי הבחינה»?", "en": "What is the role of \"היו\" in \"The students were tired after the exam\"?"},[{"he": "אוגד", "ar": "رابطة", "ru": "связка", "en": "copula"}, {"he": "נושא", "ar": "مبتدأ", "ru": "подлежащее", "en": "subject"}, {"he": "מושא", "ar": "مفعول به", "ru": "дополнение", "en": "object"}, {"he": "תיאור זמן", "ar": "ظرف زمان", "ru": "обстоятельство времени", "en": "time adverbial"}],0,{"he": "בדקו מה מחבר את הנושא לתכונה המיוחסת לו.", "ar": "افحصوا ما يصل الفاعل بالصفة المنسوبة إليه.", "ru": "Проверьте, что связывает подлежащее с его признаком.", "en": "Check what links the subject to the quality attributed to it."},{"he": "\"היו\" משמש אוגד המחבר את \"התלמידים\" ל\"עייפים\" בעבר. למשל: \"הדרך הייתה ארוכה\".", "ar": "«היו» رابطة تصل «התלמידים» بالخبر «עייפים» في الماضي. ومثلها «كانت الطريق طويلة».", "ru": "«היו» - связка, соединяющая «התלמידים» и «עייפים» в прошедшем времени. Например: «הדרך הייתה ארוכה».", "en": "\"היו\" is a copula linking \"התלמידים\" to \"עייפים\" in the past. Compare \"הדרך הייתה ארוכה\"."},null,[null, {"he": "\"התלמידים\" הם מי שעליהם נמסר המידע.", "ar": "«התלמידים» هم من يُخبر عنهم.", "ru": "«התלמידים» - те, о ком говорится.", "en": "\"התלמידים\" are the ones being described."}, {"he": "אין כאן מושא שהפעולה נעשית עליו.", "ar": "لا يوجد مفعول يقع عليه فعل.", "ru": "Здесь нет дополнения, на которое направлено действие.", "en": "There is no object receiving an action."}, {"he": "\"אחרי הבחינה\" מציין את הזמן, לא המילה שנשאלה.", "ar": "«אחרי הבחינה» يحدّد الزمن، لا الكلمة المطلوبة.", "ru": "«אחרי הבחינה» указывает время, а не данное слово.", "en": "\"אחרי הבחינה\" indicates time, not the target word."}]),
Q("ha-syntax-3-2",{"he": "איזה משפט כתוב לפי כללי ההתאם?", "ar": "أي جملة صحيحة وفق قواعد التوافق؟", "ru": "Какое предложение написано с правильным согласованием?", "en": "Which sentence has correct agreement?"},[{"he": "ההודעות נשלח אתמול.", "ar": "أُرسلت الرسائل أمس (صيغة غير متوافقة).", "ru": "Сообщения был отправлен вчера.", "en": "The messages was sent yesterday."}, {"he": "ההודעות נשלחו אתמול.", "ar": "أُرسلت الرسائل أمس.", "ru": "Сообщения были отправлены вчера.", "en": "The messages were sent yesterday."}, {"he": "ההודעה נשלחו אתמול.", "ar": "أُرسلت الرسالة أمس (صيغة غير متوافقة).", "ru": "Сообщение были отправлены вчера.", "en": "The message were sent yesterday."}, {"he": "ההודעות נשלחה אתמול.", "ar": "أُرسلت الرسائل أمس (صيغة مفردة).", "ru": "Сообщения была отправлена вчера.", "en": "The messages was sent yesterday (singular)."}],1,{"he": "השוו את מספר הנושא למספר הפועל בעבר.", "ar": "قارنوا عدد الفاعل بعدد الفعل في الماضي.", "ru": "Сравните число подлежащего и глагола в прошедшем времени.", "en": "Compare the number of the subject and past-tense verb."},{"he": "\"ההודעות\" ברבות ו\"נשלחו\" ברבים. בעבר צורת הרבים הזאת מתאימה לזכר ולנקבה. למשל: \"המכתבים נשלחו אתמול\".", "ar": "«ההודעות» جمع و«נשלחו» جمع. في الماضي هذه الصيغة تلائم المذكر والمؤنث. مثلًا: «أُرسلت الرسائل أمس».", "ru": "«ההודעות» - множественное число, как и «נשלחו». В прошедшем времени эта форма подходит обоим родам. Например: «המכתבים נשלחו אתמול».", "en": "\"ההודעות\" is plural and so is \"נשלחו\". This past plural form works for both genders. Compare \"המכתבים נשלחו אתמול\"."},null,[{"he": "\"נשלח\" ביחיד זכר, אך הנושא ברבים.", "ar": "«נשלח» مفرد مذكر، والفاعل جمع.", "ru": "«נשלח» - мужской род единственного числа, подлежащее множественного.", "en": "\"נשלח\" is masculine singular, but the subject is plural."}, null, {"he": "\"ההודעה\" ביחידה, אך הפועל ברבים.", "ar": "«ההודעה» مفرد مؤنث، والفعل جمع.", "ru": "«ההודעה» - единственное число, а глагол множественного.", "en": "\"ההודעה\" is singular, but the verb is plural."}, {"he": "\"נשלחה\" ביחידה נקבה, אך הנושא ברבות.", "ar": "«נשלחה» مفرد مؤنث، والفاعل جمع.", "ru": "«נשלחה» - женский род единственного числа, подлежащее множественного.", "en": "\"נשלחה\" is feminine singular, but the subject is plural."}]),
Q("ha-syntax-3-3",{"he": "במשפט \"הספרים החדשים הגיעו לספרייה\", מהו הנשוא?", "ar": "ما الخبر الفعلي في جملة «وصلت الكتب الجديدة إلى المكتبة»؟", "ru": "Какое сказуемое в «הספרים החדשים הגיעו לספרייה»?", "en": "What is the predicate of \"הספרים החדשים הגיעו לספרייה\"?"},[{"he": "הספרים", "ar": "الكتب", "ru": "книги", "en": "the books"}, {"he": "החדשים", "ar": "الجديدة", "ru": "новые", "en": "the new ones"}, {"he": "הגיעו", "ar": "وصلوا", "ru": "прибыли", "en": "arrived"}, {"he": "לספרייה", "ar": "إلى المكتبة", "ru": "в библиотеку", "en": "to the library"}],2,{"he": "הבחינו בין תואר של השם לבין הפועל המתאר את ההתרחשות.", "ar": "ميّزوا بين صفة الاسم والفعل الذي يصف الحدث.", "ru": "Отличите определение существительного от глагола, описывающего событие.", "en": "Distinguish the noun’s adjective from the verb describing the event."},{"he": "\"הגיעו\" הוא הנשוא הפועלי, ו\"הספרים החדשים\" הם הנושא. למשל: ב\"התלמידים הצעירים יצאו\" הנשוא הוא \"יצאו\".", "ar": "«הגיעו» هو الخبر الفعلي و«הספרים החדשים» الفاعل. ومثلًا في «خرج الطلاب الصغار» الخبر «יצאו».", "ru": "«הגיעו» - глагольное сказуемое, «הספרים החדשים» - подлежащее. Например, в «התלמידים הצעירים יצאו» сказуемое - «יצאו».", "en": "\"הגיעו\" is the verb predicate; \"הספרים החדשים\" is the subject. In \"התלמידים הצעירים יצאו\", the predicate is \"יצאו\"."},null,[{"he": "זהו חלק מן הנושא, לא הפעולה שנאמרת עליו.", "ar": "هذا جزء من الفاعل، لا الفعل الذي يصفه.", "ru": "Это часть подлежащего, не действие, которое о нём сообщается.", "en": "This is part of the subject, not its action."}, {"he": "זו מילה המתארת את הספרים, לא נשוא המשפט.", "ar": "هذه كلمة تصف الكتب وليست خبر الجملة.", "ru": "Это определение слова «книги», не сказуемое.", "en": "This word describes the books; it is not the predicate."}, null, {"he": "הצירוף מציין יעד, לא את הפעולה המרכזית.", "ar": "يشير التركيب إلى الوجهة لا إلى الفعل الأساسي.", "ru": "Эта фраза обозначает направление, не основное действие.", "en": "This phrase indicates a destination, not the main action."}]),
],

Q("ha-lexicon-1-1",{"he": "איזו מילה נרדפת ל\"שמח\" במשפט \"הילד שמח לקבל את ההזמנה\"?", "ar": "أي كلمة مرادفة لـ«שמח» في جملة «فرح الطفل بتلقّي الدعوة»؟", "ru": "Какой синоним у «שמח» в предложении «Ребёнок рад приглашению»?", "en": "Which word is a synonym of \"שמח\" in \"The boy was happy to receive the invitation\"?"},[{"he": "עייף", "ar": "متعب", "ru": "усталый", "en": "tired"}, {"he": "מודאג", "ar": "قلق", "ru": "обеспокоенный", "en": "worried"}, {"he": "כועס", "ar": "غاضب", "ru": "сердитый", "en": "angry"}, {"he": "מרוצה", "ar": "مسرور", "ru": "довольный", "en": "pleased"}],3,{"he": "חפשו מילה שמביעה רגש חיובי דומה בהקשר הזה.", "ar": "ابحثوا عن كلمة تعبّر عن شعور إيجابي قريب في هذا السياق.", "ru": "Ищите слово с близким положительным чувством в этом контексте.", "en": "Look for a similar positive feeling in this context."},{"he": "\"מרוצה\" קרוב במשמעותו ל\"שמח\" כאן. למשל: \"היא הייתה מרוצה מן הבשורה\".", "ar": "«מרוצה» قريبة المعنى من «שמח» هنا. مثلًا: «كانت مسرورة بالخبر».", "ru": "«מרוצה» здесь близко по значению к «שמח». Например: «Она была довольна новостью».", "en": "\"מרוצה\" is close in meaning to \"שמח\" here. For example: \"She was pleased by the news.\""},null,[{"he": "עייפות מתארת חוסר אנרגיה, לא שמחה.", "ar": "التعب يصف نقص الطاقة لا الفرح.", "ru": "Усталость означает нехватку сил, не радость.", "en": "Tiredness describes low energy, not happiness."}, {"he": "דאגה היא רגש של חשש, לא של שמחה.", "ar": "القلق شعور بالخوف لا بالفرح.", "ru": "Тревога - это беспокойство, не радость.", "en": "Worry is a feeling of concern, not joy."}, {"he": "כעס הוא רגש שונה מן הרגש שבמשפט.", "ar": "الغضب شعور مختلف عن الشعور في الجملة.", "ru": "Гнев отличается от чувства в предложении.", "en": "Anger is different from the feeling in the sentence."}, null]),

function itemId(tid,lv,i){return tid+"|"+lv+"|"+i}
function itemRec(id){
  if(!state.item[id])state.item[id]={n:0,ok:0};
  return state.item[id];
}
function poolOf(tp,lv){return (tp.L[lv-1]||tp.L[0]||[])}

/* בחירת פריט לתרגול. משקל גבוה לחדש, בינוני לנכשל, נמוך לנשלט. */
function chooseIndex(tid,lv,pool,avoid){
  var cand=[],i,w;
  for(i=0;i<pool.length;i++){
    if(avoid!==undefined&&i===avoid&&pool.length>1)continue;
    var r=state.item[itemId(tid,lv,i)];
    if(!r||!r.n)w=6;                            /* חדש */
    else if(r.ok<r.n)w=1+Math.min(4,r.n-r.ok);  /* נכשל בעבר */
    else w=1;                                   /* נשלט */
    for(var j=0;j<w;j++)cand.push(i);
  }
  if(!cand.length)return 0;
  return pick(cand);
}
/* בחירת פריט למבחן. אחידה, ואינה נוגעת ב-state כלל. */
function pureIndex(pool,avoid){
  var cand=[],i;
  for(i=0;i<pool.length;i++){
    if(avoid!==undefined&&i===avoid&&pool.length>1)continue;
    cand.push(i);
  }
  return cand.length?pick(cand):0;
}

   הגרשיים העבריים משמשים לשני דברים: ראשי תיבות (חוק־יסוד,
   בג״ץ) ומירכאות (״מדינה יהודית״). המנוע מכיר רק את הראשון.
   הכלל שמפריד: בראשי תיבות באה אחרי הגרשיים אות עברית אחת

   יכולה להזיק, מירכאה שנשארה כן.

   המירכאות המסולסלות (“ ”) משמשות כאן לציטוט מונחים בלבד,
   ולכן הן נופלות תמיד. הקו המפריד הופך לפסיק, כדי שהקול

function saySpell(x){
  return String(x==null?"":x)
    .replace(/[“”‘’]/g,"")
    .replace(/״/g,function(m,i,str){
      return /^[א-ת](?![א-ת])/.test(str.slice(i+1))?m:"";
    })
    .replace(/\s—\s/g,", ");
}

function O(html,ok,why){return {h:html,ok:!!ok,why:why||""}}

/* בונה שאלה מפריט אחד. סדר האפשרויות מעורבב בכל בנייה, ולכן
   האינדקס ok שבתוכן אינו מגיע למסך לעולם. */
/* קטע הקריאה נשאר בעברית בכל שפת ממשק: המיומנות הנבחנת היא הבנת
   הנקרא בעברית, והבעלים אישר (29.9) שהקטע לא יתורגם. ההוראה והשאלה
   מסביב מתורגמות. רק שאלות ha-read בנויות הוראה<br>קטע<br>שאלה. */
function leadFor(it){
  var s=gl(it.q);
  if(state.lang==="he")return s;
  var he=it.q&&it.q.he;
  if(!he||he.indexOf("<br>")<0||s.indexOf("<br>")<0)return s;
  var a=s.split("<br>"), b=he.split("<br>");
  if(a.length<3||a.length!==b.length)return s;
  return a[0]+"<br>"+b.slice(1,b.length-1).join("<br>")+"<br>"+a[a.length-1];
}
function buildFromItem(it){
  var opts=it.o.map(function(o,i){return O(esc(gl(o)),i===it.ok,it.wrong&&it.wrong[i]?gl(it.wrong[i]):"")});
  var ans=gl(it.o[it.ok]);
  return {
    type:"mcq",
    prompt:t("qPick"),
    lead:leadFor(it),
    fig:figHtml(it.fig),
    opts:shuffle(opts),
    answer:ans,
    /* מה שנאמר אחרי המענה: השאלה, התשובה הנכונה, וההסבר.
       תשובה בלי ההסבר נשמעת כמו עובדה לשינון, וזה בדיוק מה
       שהאפליקציה הזאת קיימת כדי להחליף. */
    say:leadFor(it)+" "+ans+". "+gl(it.ex),
    reveal:it
  };
}
function buildQuestion(tid,lv,avoid,pure){
  var tp=topicOf(tid); if(!tp)return null;
  var pool=poolOf(tp,lv);
  if(!pool.length)return null;
  var idx=pure?pureIndex(pool,avoid):chooseIndex(tid,lv,pool,avoid);
  var it=pool[idx];
  if(!it)return null;
  var q=buildFromItem(it);
  q.tid=tid; q.lv=lv; q.idx=idx; q.id=itemId(tid,lv,idx);
  q.hint=gl(it.hint);
  return q;
}

/* ============================================================
   מבחן מדומה
   ------------------------------------------------------------
   עשרים שאלות מכל הנושאים ומכל הרמות, בחוברת אחת שגוללים בה —
   ולא שאלה־שאלה. מי שקורא לאט צריך לראות כמה נשאר, לחזור אחורה
   ולשנות תשובה; ניווט שמסתיר את שאר השאלות לוקח ממנו בדיוק את זה.

   המבחן אינו נשמר. הוא מצב זמני בזיכרון בלבד, ורענון הדף מתחיל
   אותו מחדש — זו הצהרה ולא פער: שעון שממשיך לרוץ בין ביקורים
   הוא בדיוק המקום שבו נולדים באגים שקשה לשחזר.
   ============================================================ */
var SIM_N=20, SIM_MIN=30;
var SIM={on:false,done:false,q:[],ans:[],end:0,tick:null};

function simStop(){if(SIM.tick){clearInterval(SIM.tick);SIM.tick=null}}
function simFmt(ms){
  if(ms<0)ms=0;
  var sec=Math.round(ms/1000),m=Math.floor(sec/60),c=sec%60;
  return m+":"+(c<10?"0":"")+c;
}
function simLeftN(){
  var n=0,i;
  for(i=0;i<SIM.ans.length;i++)if(SIM.ans[i]<0)n++;
  return n;
}
function simRight(){
  var n=0,i;
  for(i=0;i<SIM.q.length;i++)if(SIM.ans[i]>=0&&SIM.q[i].opts[SIM.ans[i]].ok)n++;
  return n;
}
function simStart(){
  var pairs=[],qs=[],i,q;
  TOPICS.forEach(function(tp){for(var l=1;l<=3;l++)pairs.push([tp.id,l])});
  shuffle(pairs);
  for(i=0;i<pairs.length&&qs.length<SIM_N;i++){
    q=buildQuestion(pairs[i][0],pairs[i][1],undefined,true);
    if(q)qs.push(q);
  }
  /* פחות צמדי נושא-רמה מ-SIM_N: סבב נוסף, בלי לחזור על אותו פריט. */
  var guard=0;
  while(qs.length<SIM_N&&guard<400){
    var pr=pairs[guard%pairs.length]; guard++;
    q=buildQuestion(pr[0],pr[1],undefined,true);
    if(!q)continue;
    var dup=false,k;
    for(k=0;k<qs.length;k++)if(qs[k].id===q.id){dup=true;break}
    if(!dup)qs.push(q);
  }
  SIM.q=qs;
  SIM.ans=qs.map(function(){return -1});
  SIM.on=true; SIM.done=false; SIM.end=Date.now()+SIM_MIN*60000;
  simArm();
}
function simArm(){
  simStop();
  if(SIM.on&&!SIM.done)SIM.tick=setInterval(simClock,1000);
}
function simClock(){
  var el=$("#simclock");
  /* המסך הוחלף — אין מה לעדכן, והשעון נעצר מעצמו. */
  if(!el){simStop();return}
  var left=SIM.end-Date.now();
  el.textContent=simFmt(left);
  if(left<=60000)el.classList.add("low");
  if(left<=0){simStop();simSubmit()}
}
/* ההגשה היא גם רגע הרישום: עד כאן לא נספרה אף תשובה, כדי
   שהמבחן לא ידחוף לבנק הטעויות שאלה שהנבחן עוד עמד לשנות. */
function simSubmit(){
  if(!SIM.on||SIM.done)return;
  simStop();
  var i;
  for(i=0;i<SIM.q.length;i++){
    var q=SIM.q[i],pk=SIM.ans[i];
    recordItem(q.tid,q.lv,q.id,pk>=0&&!!q.opts[pk].ok);
  }
  SIM.done=true; save(); render(); window.scrollTo(0,0);
}

  var h='<div class="wrap"><h2 style="margin:1.1rem 0 .3rem;font-size:1.4rem">'+esc(t("simT"))+"</h2>";

/* ============================================================
   18. מבחן כיתתי — פרסום בוואטסאפ, קבלת תשובות וציונים
   ------------------------------------------------------------
   אין שרת, ואין כוונה שיהיה. לכן המבחן אינו נשלח לשום מקום:
   הוא *נארז לתוך הקישור*. המורה מקבל קישור, שולח אותו בוואטסאפ,
   והמכשיר של התלמיד בונה מהקישור בדיוק את אותן שאלות.

   מה שהופך את זה לאפשרי הוא שכל מחולל שאלות כאן משתמש ב-
   Math.random בלבד. אם מזרעים אותו, אותו זרע מייצר את אותן
   שאלות ואת אותו סדר תשובות — אצל המורה ואצל התלמיד. הקישור
   נושא זרע ורשימת נושאים, לא עשרים שאלות מלאות, ולכן הוא נשאר
   קצר מספיק לוואטסאפ.

   שלוש מגבלות שנאמרות כאן במפורש כי הן חלק מהתכנון:
   · אין איסוף אוטומטי. התלמיד שולח קוד תשובות בוואטסאפ, והמורה
     מדביק אותו. זה המחיר של אפס שרת ואפס עלות.
   · אפשר לזייף קוד. הציון מחושב מחדש אצל המורה מתוך התשובות
     ולא נלקח מהתלמיד, אבל אין כאן הגנה קריפטוגרפית — זה מבחן
     כיתתי מעצב, לא בגרות.
   · שמות התלמידים נשארים במכשיר של המורה. הם לא עוברים דרך
     שום שרת, כי אין שרת.
   ============================================================ */
var GENV=2;                 /* גרסת המחוללים. מבחן שנוצר בגרסה אחרת
                               אינו נפתח — עדיף הודעה ברורה מאשר
                               עשרים שאלות אחרות בשקט. */

/* --- מחולל מזורע. mulberry32: קצר, מהיר, ופיזור טוב דיו --- */
function withSeed(seed,fn){
  var real=Math.random,s=(seed>>>0)||1;
  Math.random=function(){
    s|=0; s=s+0x6D2B79F5|0;
    var t=Math.imul(s^s>>>15,1|s);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
  try{return fn()}finally{Math.random=real}
}
function hash32(str){
  var h=0x811c9dc5,i;
  for(i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193)}
  return (h>>>0);
}
/* base64url. הניקוי בפענוח אינו קוסמטי: וואטסאפ שובר מחרוזות
   ארוכות בשורות, ורווח אחד הורס את כל הקוד. */
function b64e(str){
  var bytes=new TextEncoder().encode(str),bin="",i;
  for(i=0;i<bytes.length;i+=8192)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));
  return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
