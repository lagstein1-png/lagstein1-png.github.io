<style>
/* ============================================================
   עברית לדוברי ערבית — עברית לבגרות
   קהל היעד הוא תלמידי החינוך הערבי הלומדים עברית. הוא נכשל בה שוב
   ושוב, מפני
   שהמקצוע כולו טקסט ומושגים — ולכן כל החלטה כאן נמדדת בשאלה
   אחת: האם היא מורידה עומס, או מוסיפה.
   · כל שאלה נושאת רמז שאינו התשובה, והסבר שנפתח גם כשצדקו.
   · שום טקסט לא מוצג בלי שאפשר לשמוע אותו.
   · שפת האם אינה קישוט: מושג נלמד קודם בשפה שחושבים בה.
   כל המידות ב-rem, כדי שהגדלת טקסט תגדיל את הכול יחד.
   ============================================================ */
:root{
  --font:"Heebo","Rubik",system-ui,"Segoe UI",Arial,sans-serif;
  --en:"Lexend","Heebo",system-ui,"Segoe UI",Arial,sans-serif;
  --ar:"Noto Sans Arabic",system-ui,"Segoe UI",Arial,sans-serif;
  --ru:"Noto Sans","Heebo",system-ui,"Segoe UI",Arial,sans-serif;   /* קירילית — Heebo אינו מכיל אותה */
  --bg:#f5f7fb; --surface:#ffffff; --surface2:#e8ecf6;
  --ink:#101828; --muted:#55607a; --faint:#6f7a95; --line:#dde3f0;
  --accent:#1d4ed8; --accent-ink:#ffffff; --accent-soft:#dbe4fe;
  --gold:#a16207; --gold-soft:#fbf0d5; --hit:#f5c451; --hit-ink:#1a1300;
  --ok:#15803d; --ok-soft:#dcfce7; --bad:#be123c; --bad-soft:#ffe4e9;
  --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px -12px rgba(16,24,40,.2);
  --r:14px;
  /* צבע לכל מסלול. לא קישוט: ארבעה סוגי לימוד שונים לגמרי, וצבע
     קבוע לכל אחד חוסך למי שמתקשה להתמצא את השאלה "איפה אני". */
  --c-sound:#0369a1; --cs-sound:#dbeefc;   /* צליל ואות   */
  --c-words:#15803d; --cs-words:#dcfce7;   /* מילים       */
  --c-talk:#b43a0a;  --cs-talk:#fde5d8;    /* מדוברת — #c2410c היה 4.28:1 על ה-cs (30.9) */
  --c-read:#6d28d9;  --cs-read:#eae2fd;    /* ספרותית     */
}
:root[data-theme="dark"]{
  --bg:#0e1425; --surface:#17203a; --surface2:#202c4d;
  --ink:#e8edf8; --muted:#9aa5c0; --faint:#78829e; --line:#2a3762;
  --accent:#93c5fd; --accent-ink:#0e1425; --accent-soft:#1b2a5c;
  --gold:#fbbf24; --gold-soft:#33270f; --hit:#ffd24d; --hit-ink:#241a00;
  --ok:#4ade80; --ok-soft:#132a1c; --bad:#fb7185; --bad-soft:#33161f;
  --warn:#fbbf24; --warn-soft:#33260f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  --c-sound:#7dd3fc; --cs-sound:#0b2a3d;
  --c-words:#86efac; --cs-words:#0f2a1a;
  --c-talk:#fdba74;  --cs-talk:#3a2113;
  --c-read:#c4b5fd;  --cs-read:#261a45;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1425; --surface:#17203a; --surface2:#202c4d;
    --ink:#e8edf8; --muted:#9aa5c0; --faint:#78829e; --line:#2a3762;
    --accent:#93c5fd; --accent-ink:#0e1425; --accent-soft:#1b2a5c;
    --gold:#fbbf24; --gold-soft:#33270f; --hit:#ffd24d; --hit-ink:#241a00;
    --ok:#4ade80; --ok-soft:#132a1c; --bad:#fb7185; --bad-soft:#33161f;
    --warn:#fbbf24; --warn-soft:#33260f;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
    --c-sound:#7dd3fc; --cs-sound:#0b2a3d;
    --c-words:#86efac; --cs-words:#0f2a1a;
    --c-talk:#fdba74;  --cs-talk:#3a2113;
    --c-read:#c4b5fd;  --cs-read:#261a45;
  }
}
/* ניגודיות גבוהה — שחור על לבן, מסגרות מלאות, בלי גוונים רכים */
:root.hc{
  --bg:#ffffff; --surface:#ffffff; --surface2:#ffffff;
  --ink:#000000; --muted:#1a1a1a; --faint:#333333; --line:#000000;
  --accent:#00434b; --accent-ink:#ffffff; --accent-soft:#e6f2f3;
  --gold:#5c3d00; --gold-soft:#f7efdf; --hit:#ffe600; --hit-ink:#000000;
  --ok:#0a5c2a; --ok-soft:#e6f4ea; --bad:#8c0f2c; --bad-soft:#fbe9ed;
  --warn:#6b3d00; --warn-soft:#f7efdf; --shadow:none;
  --c-sound:#00305c; --cs-sound:#e8eef7;
  --c-words:#0a5c2a; --cs-words:#e6f4ea;
  --c-talk:#7a2c00;  --cs-talk:#f9ece4;
  --c-read:#3d1a75;  --cs-read:#eee8f9;
}
:root.hc *{box-shadow:none!important}
:root.hc .card,:root.hc .btn,:root.hc .opt{border-width:2px!important}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs,17px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  font-size:1rem;line-height:1.65;-webkit-text-size-adjust:100%}
:root.clear body{font-family:"Verdana","Tahoma","Heebo",sans-serif;letter-spacing:.012em}
:root.spaced body{word-spacing:.22em;line-height:1.95}
:root.rm *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
h1,h2,h3{margin:0;line-height:1.3;font-weight:800}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}
/* כרטיס ״מבנה הבגרות״ (--gold-soft): הקישור לאתר משרד החינוך בלי צבע נפל לכחול ברירת המחדל — 1.55:1 בכהה (30.9) */
.gcard a{color:var(--accent)}
.skip{position:absolute;inset-inline-start:-9999px}
.skip:focus{position:static;display:inline-flex;align-items:center;min-height:44px;
  margin:8px;padding:8px 14px;background:#0b7c71;color:#fff;
  border-radius:8px;font-weight:700;text-decoration:none;z-index:100}

/* כל טקסט אנגלי — כיוון, גופן ומרווח משלו. unicode-bidi:isolate מונע
   מהמשפט האנגלי לגרור אחריו את סימני הפיסוק של המשפט העברי. */
.en{font-family:var(--en);direction:ltr;unicode-bidi:isolate;text-align:start}
.en-b{font-family:var(--en);direction:ltr;unicode-bidi:isolate;display:inline-block}

.wrap{max-width:56rem;margin:0 auto;padding:0 clamp(.9rem,3vw,1.5rem)}
.hbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-block:.6rem}
:root.hc .hbar{background:var(--bg);backdrop-filter:none}
.hrow{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
.brand{font-size:1.35rem;font-weight:800;letter-spacing:-.01em;display:flex;
  align-items:baseline;gap:.5rem;margin-inline-end:auto}
.brand small{font-size:.72rem;font-weight:600;color:var(--muted);letter-spacing:.06em}
.gbtn{display:inline-flex;align-items:center;gap:.4rem;background:var(--surface);
  border:1px solid var(--line);border-radius:999px;padding:.42rem .8rem;cursor:pointer;
  font-size:.86rem;font-weight:600;box-shadow:var(--shadow);min-height:44px}
.gbtn:hover{border-color:var(--accent)}
.gbtn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:1.1rem}
.grid{display:grid;gap:.85rem}
@media(min-width:640px){.g2{grid-template-columns:1fr 1fr}}
@media(min-width:900px){.g3{grid-template-columns:repeat(3,1fr)}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;
  border:1px solid var(--line);background:var(--surface);border-radius:12px;
  padding:.72rem 1.1rem;font-weight:700;cursor:pointer;box-shadow:var(--shadow);
  min-height:2.9rem;font-size:1rem}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;box-shadow:none}
.btn[disabled]{opacity:.45;cursor:default}
.btn.wide{width:100%}

.chip{display:inline-flex;align-items:center;gap:.35rem;border-radius:999px;
  padding:.22rem .6rem;font-size:.78rem;font-weight:700;background:var(--surface2);color:var(--muted)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}

/* גופני שפה: Heebo אינו מכיל ערבית וקירילית, ולכן שפת הממשק
   מחליפה גופן ולא רק כיוון. */
html[lang="ar"] body,html[lang="ar"] input,html[lang="ar"] button,
html[lang="ar"] textarea,html[lang="ar"] select{font-family:var(--ar)}
html[lang="ru"] body,html[lang="ru"] input,html[lang="ru"] button,
html[lang="ru"] textarea,html[lang="ru"] select{font-family:var(--ru)}
button[data-a="lang"][lang="ar"]{font-family:var(--ar)}
button[data-a="lang"][lang="ru"]{font-family:var(--ru)}

/* ===== מסלולים: הצבע נכנס ככרטיס, לא כרקע של טקסט ===== */
.trk{--c:var(--accent);--cs:var(--accent-soft)}
.t-sound{--c:var(--c-sound);--cs:var(--cs-sound)}
.t-words{--c:var(--c-words);--cs:var(--cs-words)}
.t-talk{--c:var(--c-talk); --cs:var(--cs-talk)}
.t-read{--c:var(--c-read); --cs:var(--cs-read)}
.tcard{border-inline-start:5px solid var(--c);cursor:pointer;text-align:start;width:100%;
  display:flex;flex-direction:column;gap:.4rem;align-items:stretch}
.tcard:hover{border-color:var(--c)}
.tcard h3{font-size:1.05rem}
.tcard .sub{font-size:.85rem;color:var(--muted)}
.tdot{width:.62rem;height:.62rem;border-radius:50%;background:var(--c);flex:none}
.thead{display:flex;align-items:center;gap:.5rem}
.tpill{background:var(--cs);color:var(--c);border-radius:999px;padding:.15rem .55rem;
  font-size:.72rem;font-weight:800}

/* ===== סרגל שליטה ברמות ===== */
.lvls{display:flex;gap:.4rem;flex-wrap:wrap}
.lvl{border:1px solid var(--line);background:var(--surface);border-radius:10px;
  padding:.4rem .7rem;font-size:.82rem;font-weight:700;cursor:pointer;
  display:inline-flex;align-items:center;gap:.4rem}
.lvl.on{background:var(--c,var(--accent));color:var(--accent-ink);border-color:var(--c,var(--accent))}
.bar{height:.42rem;border-radius:999px;background:var(--surface2);overflow:hidden;flex:1;min-width:3rem}
.bar i{display:block;height:100%;background:var(--c,var(--accent))}
.bar.b0 i{background:var(--bad)} .bar.b1 i{background:var(--warn)} .bar.b2 i{background:var(--ok)}

/* ===== תרגול ===== */
.qcard{border-top:5px solid var(--c,var(--accent))}
.qtop{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.7rem}
.qtext{font-size:1.12rem;font-weight:600;margin:.2rem 0 .3rem}
.qhint{color:var(--muted);font-size:.9rem}
/* המילה או המשפט שנלמדים. גדול, מרווח, ותמיד לצד כפתור השמעה. */
.subject{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;
  background:var(--surface2);border-radius:12px;padding:.85rem 1rem;margin:.5rem 0}
.subject .word{font-family:var(--en);direction:ltr;unicode-bidi:isolate;
  font-size:1.7rem;font-weight:700;letter-spacing:.01em;line-height:1.25}
.subject .ipa{font-family:var(--en);direction:ltr;unicode-bidi:isolate;
  color:var(--muted);font-size:.95rem}
.spk{border:1px solid var(--line);background:var(--surface);border-radius:999px;
  width:2.7rem;height:2.7rem;display:inline-flex;align-items:center;justify-content:center;
  cursor:pointer;flex:none;box-shadow:var(--shadow)}
.spk:hover{border-color:var(--accent);color:var(--accent)}
.spk.sm{width:2.1rem;height:2.1rem;background:#0b7c71;border-color:#0b7c71;color:#fff}
/* הרמקול הקטן — אותו ירוק של כפתור ההקראה הגדול, התקן המשותף */
.spk.sm:hover{background:#0b7c71;border-color:#0b7c71;color:#fff}
.spk.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.opts{display:grid;gap:.6rem;margin-top:.9rem}
.orow{display:flex;gap:.45rem;align-items:center;min-width:0}
/* min-width:0 — פריט grid נולד עם min-width:auto, ולכן משפט ארוך
   באפשרות היה מרחיב את השורה מעבר למכל ודוחף את הרמקול מחוץ למסך. */
.orow .opt{flex:1;min-width:0}
@media(min-width:560px){.opts.two{grid-template-columns:1fr 1fr}}
.opt{display:flex;align-items:center;gap:.6rem;text-align:start;width:100%;
  border:2px solid var(--line);background:var(--surface);border-radius:12px;
  padding:.8rem .9rem;cursor:pointer;font-size:1.02rem;font-weight:600;min-height:3.1rem}
.opt:hover{border-color:var(--accent)}
.opt .k{width:1.9rem;height:1.9rem;border-radius:8px;background:var(--surface2);
  display:inline-flex;align-items:center;justify-content:center;font-size:.85rem;
  font-weight:800;color:var(--muted);flex:none}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .k{background:var(--ok);color:var(--bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .k{background:var(--bad);color:var(--bg)}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.55}
/* בחירה במבחן היא בחירה, לא תשובה נכונה. במסכי התרגול הצבע
   הירוק אומר "צדקת", ובמבחן אסור לו להופיע כלל — הוא נותן
   משוב שגוי לכל בחירה. ניטרלי, ורק מסמן מה סומן. */
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);margin-inline-start:3px}
.dot.ok{background:var(--ok);border-color:var(--ok)}
.dot.no{background:var(--bad);border-color:var(--bad)}
.dot.flag{box-shadow:0 0 0 2px var(--accent)}

/* אריחי בניית משפט. הסדר הוא התרגיל, ולכן האריח חייב להיראות כמשהו
   שאפשר להרים — מסגרת מלאה ורקע משלו, לא טקסט על רקע הכרטיס. */
.tiles{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:.7rem}
.tile{font-family:var(--en);direction:ltr;border:2px solid var(--line);
  background:var(--surface);border-radius:10px;padding:.5rem .8rem;font-weight:600;
  cursor:pointer;font-size:1.02rem;min-height:2.7rem}
.tile:hover{border-color:var(--accent)}
.slot{min-height:3.2rem;border:2px dashed var(--line);border-radius:12px;
  background:var(--surface2);padding:.5rem;display:flex;flex-wrap:wrap;gap:.45rem;
  align-items:center;direction:ltr}
.slot.ok{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.slot.bad{border-style:solid;border-color:var(--bad);background:var(--bad-soft)}
.slot .tile{background:var(--surface)}

/* ===== משוב ===== */
.fb{margin-top:.9rem;border-radius:12px;padding:.85rem 1rem;border:1px solid transparent}
.fb.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.fb.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.fb b{display:block;font-size:1.02rem;margin-bottom:.2rem}
.fb .body{color:var(--ink);font-weight:500;font-size:.95rem}
.why{margin-top:.55rem;padding-top:.55rem;border-top:1px dashed currentColor;color:var(--ink);
  font-weight:500;font-size:.93rem}

/* ===== קטע קריאה ===== */
/* איור בתוך כרטיס שאלה. הצבע יורש מ-color, ולכן אותו SVG נראה
   נכון גם בערכה הבהירה וגם בכהה בלי גרסה שנייה. */
.figure{margin:.7rem 0;padding:.6rem;border:1px solid var(--line);border-radius:12px;
  background:var(--surface2);color:var(--ink);overflow-x:auto}
.figure svg{display:block;max-width:100%}
/* המבחן המדומה: השאלות זו אחר זו, כמו חוברת בחינה. */
.simq{border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;margin:.8rem 0;
  background:var(--surface)}
.simq.miss{border-color:var(--warn)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.simn{font-weight:800;color:var(--muted);font-size:.86rem}
.simbar{position:sticky;top:0;z-index:5;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:.6rem .8rem;margin:.8rem 0;display:flex;gap:.6rem;
  align-items:center;flex-wrap:wrap;box-shadow:var(--shadow)}
.clock{font-weight:800;font-variant-numeric:tabular-nums;font-size:1.1rem}
.clock.low{color:var(--bad)}
.passage{background:var(--surface2);border-radius:12px;padding:1rem 1.1rem;margin:.6rem 0;
  font-family:var(--en);direction:ltr;unicode-bidi:isolate;font-size:1.08rem;line-height:2}
.passage .s{border-radius:5px;padding:.05em .12em;cursor:pointer}
.passage .s:hover{background:var(--accent-soft)}
.passage .s.now{background:var(--accent-soft);box-shadow:0 2px 0 var(--accent)}
.wd{border-radius:5px;padding:1px 3px}
.wd.hit{background:var(--hit);color:var(--hit-ink);font-weight:600}
/* כשמנוע הדיבור אינו מדווח על גבולות מילים — קורה הרבה בעברית
   באנדרואיד — אין מה להדגיש מילה־מילה, ואז מודגש כל האיבר. הכלל
   שקיים כאן מכוון למשפט בתוך קטע קריאה בלבד, ולכן ההדגשה החלופית
   על איבר אחר לא נראתה כלל. */
.wd.now,p.now,div.now,span.now,b.now{background:var(--hit);color:var(--hit-ink);
  border-radius:8px;box-shadow:0 0 0 4px var(--hit)}
.gloss{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.5rem}
.gword{border:1px solid var(--line);background:var(--surface);border-radius:999px;
  padding:.25rem .6rem;font-size:.85rem;cursor:pointer}
.gword b{font-family:var(--en);direction:ltr;unicode-bidi:isolate}

/* ===== סרגל מצב הקול ===== */
.vstrip{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;border-radius:10px;
  padding:.45rem .7rem;font-size:.85rem;font-weight:600;margin-bottom:.7rem}
.vstrip.ok{background:var(--ok-soft);color:var(--ok)}
.vstrip.warn{background:var(--warn-soft);color:var(--warn)}
.vstrip.bad{background:var(--bad-soft);color:var(--bad)}
.vstrip .btn{padding:.3rem .7rem;min-height:44px;font-size:.82rem}  /* 2.1rem היו 36 פיקסלים — מתחת ליעד המגע */

/* ===== הגדרות ===== */
.row{display:flex;align-items:center;justify-content:space-between;gap:.8rem;
  padding:.7rem 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row:last-child{border-bottom:0}
.row .lab{font-weight:700}
.row .desc{font-size:.85rem;color:var(--muted);font-weight:500}
.sw{width:3.2rem;height:1.8rem;border-radius:999px;background:var(--surface2);
  border:1px solid var(--line);position:relative;cursor:pointer;flex:none}
.sw i{position:absolute;top:.18rem;inset-inline-start:.2rem;width:1.3rem;height:1.3rem;
  border-radius:50%;background:var(--faint);transition:.15s}
.sw.on{background:var(--accent);border-color:var(--accent)}
.sw.on i{inset-inline-start:1.5rem;background:#fff}
.vgrid{display:grid;gap:.5rem;grid-template-columns:1fr}
@media(min-width:560px){.vgrid{grid-template-columns:1fr 1fr}}
.vopt{display:flex;align-items:center;gap:.6rem;border:2px solid var(--line);
  background:var(--surface);border-radius:12px;padding:.6rem .75rem;cursor:pointer;text-align:start}
.vopt.on{border-color:var(--accent);background:var(--accent-soft)}
.vopt .nm{font-weight:700}
.vopt .ds{font-size:.8rem;color:var(--muted)}
input[type=password],input[type=text]{font:inherit;background:var(--surface);color:var(--ink);
  border:1px solid var(--line);border-radius:10px;padding:.6rem .7rem;min-width:0;flex:1;
  direction:ltr;text-align:left}
input[type=range]{width:100%;accent-color:var(--accent)}

.fbar{border-top:1px solid var(--line);margin-top:2rem;padding-block:1rem;
  color:var(--muted);font-size:.82rem}   /* --faint יצא 2.96:1 */
.hidden{display:none!important}

/* ---------- שדה קלט של המבחן ----------
   מודול המבחן הועתק לכאן מאפליקציה שבה .field כבר היה מוגדר.
   בלי הכלל הזה שדה השם של הנבחן נשאר תיבת ברירת המחדל של
   הדפדפן — 21 פיקסלים גובה, הרבה מתחת ליעד המגע של 44. */
.field{width:100%;box-sizing:border-box;font:inherit;font-size:1rem;
  min-height:48px;padding:12px 14px;border-radius:11px;outline:none;background:var(--surface2);color:inherit;border:1px solid var(--line)}
.field:focus{border-color:var(--accent)}
/* הטבעת המיקוד על שדה טקסט. ה-outline:none של .field בא אחרי הכלל
   הגורף :focus-visible, ולכן גבר עליו: מי שעובד במקלדת נשאר בלי
   טבעת מיקוד על שדה השם של הנבחן. החזרת הטבעת, על השדה עצמו. */
.field:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
textarea.field{min-height:96px;resize:vertical}

/* ---------- שורות המבחן ----------
   .tog הגיע ממודול המבחן שהועתק לכאן, ולא היה לו עיצוב כלל: השם
   והמידע שמתחתיו נדבקו לשורה אחת בלי רווח. */
.tog{display:flex;align-items:center;gap:13px;width:100%;text-align:start;
  background:var(--surface2);border:1px solid transparent;border-radius:12px;
  padding:13px 15px;min-width:0}
.tog:hover{border-color:var(--line)}
.tog+.tog{margin-top:9px}
.tog .tt{flex:1;min-width:0}
.tog .tt b{display:block;font-size:.97rem;overflow-wrap:anywhere}
.tog .tt span{display:block;color:var(--muted);font-size:.85rem;overflow-wrap:anywhere;margin-top:2px}

/* יעד מגע לקישור התחתית. קישור טקסט בשורה יוצא בגובה הטקסט —
   15 פיקסלים — וזה קטן מדי לאצבע, גם כשהוא רק לתנאי השימוש. */
.lg-foot a{display:inline-flex;align-items:center;min-height:44px;padding-inline:6px}

/* ---------- יעדי מגע ----------
   .lvl יצא 39 פיקסלים ומתג ה-.sw רק 31, שניהם מתחת ל-44 שהפרויקט
   מחייב את עצמו בהם. במתג לא מגדילים את המסילה — היא תיראה מגושמת —
   אלא מרחיבים את שטח הלחיצה סביבה. */
.lvl{min-height:44px}
.sw{position:relative}
.sw::after{content:"";position:absolute;inset-block:-7px;inset-inline:-4px}

/* ---------- מסך בניית המבחן ----------
   .seg ו-.tpc הגיעו עם מודול המבחן שהועתק לכאן, ולא היה להם עיצוב:
   כפתורי הבחירה יצאו 34 פיקסלים, וכרטיסי הנושאים 6 פיקסלים בלבד —
   כלומר המורה לא יכול היה לבחור נושאים בכלל. */
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 auto;min-width:0;min-height:44px;border:1px solid var(--line);
  background:var(--surface);border-radius:10px;padding:10px 12px;font:inherit;
  font-weight:600;font-size:.9rem;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.tpc{position:relative;display:flex;flex-direction:column;gap:9px;text-align:start;
  background:var(--surface);border:1px solid var(--line);
  border-inline-start:4px solid var(--c,var(--accent));border-radius:12px;padding:14px;
  box-shadow:var(--shadow);min-width:0;min-height:44px;cursor:pointer;font:inherit;color:inherit}
.tpc.on{border-color:var(--accent);background:var(--accent-soft)}
.tpc .tn{font-weight:700;font-size:.98rem;overflow-wrap:anywhere;color:var(--c,var(--ink))}
.tpc .td{color:var(--muted);font-size:.8rem;overflow-wrap:anywhere}

/* טקסט על רקע ההדגשה: --accent-ink ולא לבן קבוע. במצב כהה
   ההדגשה בהירה, ולבן עליה יצא 1.5–2.0:1 — כמעט בלתי קריא. */
/* ---------- מצב מורה ---------- */
.te-wrap{position:fixed;inset:0;z-index:2147482500;background:rgba(8,12,20,.72);
  display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto;
  font-family:system-ui,"Heebo","Rubik",Arial,sans-serif}
.te-box{background:#fff;color:#111827;max-width:26rem;width:100%;border-radius:18px;
  box-shadow:0 24px 70px -20px rgba(0,0,0,.6);padding:clamp(18px,4vw,26px);
  max-height:92vh;overflow-y:auto;font-size:16px;line-height:1.6}
.te-box h2{margin:0 0 6px;font-size:1.35rem;font-weight:800;line-height:1.25}
.te-lead{margin:0 0 10px;color:#374151}
.te-warn{margin:0 0 12px;font-size:.88rem;color:#7c2d12;background:#fef3c7;
  border-radius:10px;padding:9px 11px}
.te-lab{display:block;margin:10px 0 4px;font-weight:700;font-size:.92rem}
.te-in{width:100%;box-sizing:border-box;font:inherit;letter-spacing:.3em;
  border:1px solid #d1d5db;border-radius:11px;padding:.7rem .8rem;min-height:48px;
  background:#fff;color:#111827}
.te-in:focus-visible{outline:3px solid #2563eb;outline-offset:1px}
.te-chk{display:flex;align-items:center;gap:.5rem;margin-top:14px;min-height:44px;
  font-size:.94rem;cursor:pointer}
.te-chk input{width:20px;height:20px}
.te-note{margin:2px 0 0;font-size:.82rem;color:#6b7280}
.te-msg{margin:10px 0 0;font-size:.92rem;font-weight:700;color:#7f1d1d;
  background:#fee2e2;border-radius:10px;padding:9px 11px}
.te-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.te-btn{font:inherit;font-weight:700;border-radius:12px;padding:.75rem 1.2rem;
  cursor:pointer;border:1px solid #d1d5db;background:#fff;color:#111827;min-height:48px}
.te-btn.pri{background:#111827;color:#fff;border-color:#111827;flex:1 1 9rem}
.te-btn.pri[disabled]{opacity:.5;cursor:default}
.te-btn.link{border:0;background:none;text-decoration:underline;padding:.6rem .2rem;
  color:#374151;margin-top:8px;min-height:44px}
.te-btn:focus-visible{outline:3px solid #2563eb;outline-offset:2px}
@media (prefers-color-scheme:dark){
  .te-box{background:#141a24;color:#e8ecf4}
  .te-lead,.te-note{color:#b9c2d4}
  .te-warn{background:#3a2a10;color:#fcd9a5}
  .te-in{background:#1d2531;color:#e8ecf4;border-color:#2c3648}
  .te-msg{background:#4a1717;color:#ffd7d7}
  .te-btn{background:#1d2531;color:#e8ecf4;border-color:#2c3648}
  .te-btn.pri{background:#e8ecf4;color:#141a24;border-color:#e8ecf4}
  .te-btn.link{color:#b9c2d4}
}

/* ---------- רשימת השאלות במסך בניית המבחן ---------- */
.xq-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.xq{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface2)}
.xq-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.xq-n{flex:0 0 auto;min-width:27px;height:27px;border-radius:8px;display:inline-flex;
  align-items:center;justify-content:center;font-weight:800;font-size:.85rem;background:var(--ink);color:var(--bg)}
.xq-tp{font-weight:700;font-size:.88rem;color:var(--muted);overflow-wrap:anywhere}
.xq-acts{margin-inline-start:auto;display:flex;gap:6px;flex-wrap:wrap}
/* 44 פיקסלים גם כאן. כפתור קטן בתוך רשימה ארוכה הוא בדיוק
   הכפתור שנהג מבוגר או ילד עם ADHD לא מצליח לפגוע בו. */
.xq-b{padding:8px 13px;font-size:.88rem;font-weight:700;border-radius:10px;min-height:44px;
  border:1px solid var(--line);background:transparent;color:inherit;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:inherit}
.xq-b:hover{background:var(--line)}
.xq-b[aria-pressed="true"]{background:var(--line)}
.xq-q{margin-top:8px;line-height:1.5;overflow-wrap:anywhere}
.xq-e{margin-top:5px;font-weight:700;overflow-wrap:anywhere}
.xq-a{margin-top:7px;font-size:.92rem;color:var(--ok);overflow-wrap:anywhere}
.xq-add{margin-top:12px;gap:8px}
.xq-add .sub{margin:0}
/* שאלת מקור נושאת קטע שלם. בלי תקרה הוא דוחף את שאר הרשימה
   אל מחוץ למסך. */
.xq .passage{max-height:11rem;overflow:auto}
.hlang{display:flex;gap:4px;flex:none;align-items:center;flex-wrap:wrap}
.hlang button{border:1px solid #d4dbe7;background:transparent;color:inherit;border-radius:10px;padding:3px 9px;font:inherit;font-size:.82rem;cursor:pointer;min-height:36px}
.hlang button.on{border-color:#2f5fd8;color:#fff;background:#2f5fd8;font-weight:700}

/* ---------- יעדי מגע ≥44px — 1.10.2026 ----------
   נמדד בדפדפן ב-390px וב-360px, בדף הפתיחה ובשני צעדי לחיצה ממנו.
   הבלוק אחרון ב-style כדי לגבור על ההגדרות שמעליו. מגדילים בריפוד
   ובגובה מינימלי, לא בגובה קשיח — ערבית ורוסית ארוכות יותר. */
.hlang button{min-height:44px;padding-block:6px}
input[type=range]{min-height:44px}
.spk.sm{min-width:44px;min-height:44px}
.lvl{min-width:44px}

/* ---------- קישור בתוך טקסט — אזור נגיעה ≥44px · 2.10.2026 (O-110) ----------
   שני מקרים, ונמדדו שניהם ב-390px וב-360px:
   - קישור בתוך שורת טקסט רצה: ריפוד אנכי בלבד. ב-inline הוא מגדיל את
     אזור הנגיעה ואינו נכנס לגובה השורה — אף אלמנט לא זז.
   - קישורים זה מתחת לזה (<br>), וקישור בתוך פס ההקראה הקבוע: שם הריפוד
     חרג מהשורה וכיסה את הקישור או הכפתור שלידו, ולכן inline-flex
     בגובה 44 — כמו `.lg-foot a`. השורה גדלה, ואין חפיפה.
   לא `a` כללי: `.lg-foot a` ודומיו כבר 44px בבנייה אחרת. */
#tts-fail a,a[href*="education.gov.il"]{display:inline-flex;align-items:center;min-height:44px}
</style>

<style>#gate[hidden]{display:none!important}
/* כפתורי הקראה גדולים וצבעוניים — התקן המשותף (ירוק הקראה, אדום עצירה) */
.spk:not(.sm){border-radius:12px;background:#0b7c71;border-color:#0b7c71;color:#fff;font-weight:700;min-height:46px;width:auto;height:auto;padding:8px 18px;font-size:1.02rem;gap:.4rem}

/* כפתורי העזר הצבעוניים — התקן המשותף המלא (26.9.2026, דיווח הבעלים:
   ״הכפתורים רמז הקראה וכו קטנים יש להסיף צבע״). ירוק הקראה, אדום עצירה,
   כתום רמז, סגול לימור, כחול פתרון מודרך, אפור־כחלחל נוסחה — אותם

.btn[data-a="read"],.btn[data-a="readsteps"]{background:#0b7c71!important;border-color:#0b7c71!important;color:#fff!important;font-weight:700;min-height:46px;padding:10px 16px!important;font-size:1rem!important}

.btn[data-a="hush"]:hover,.btn[data-a="stop"]:hover{background:#a03a20!important;color:#fff!important}
.btn[data-a="hint"]{background:#b45309!important;border-color:#92400e!important;color:#fff!important;font-weight:700;min-height:46px;padding:10px 16px!important;font-size:1rem!important}
.btn[data-a="hint"]:hover{background:#92400e!important;color:#fff!important}

.btn[data-a="guide"]{background:#1d4ed8!important;border-color:#1e40af!important;color:#fff!important;font-weight:700;min-height:46px;padding:10px 16px!important;font-size:1rem!important}
.btn[data-a="guide"]:hover{background:#1e40af!important;color:#fff!important}
.btn[data-a="rule"]{background:#334155!important;border-color:#1e293b!important;color:#fff!important;font-weight:700;min-height:46px;padding:10px 16px!important;font-size:1rem!important}
.btn[data-a="rule"]:hover{background:#1e293b!important;color:#fff!important}
/* רמקול לכל תשובה — מי שקורא בקושי בוחר באוזן (אותו תקן של history) */
.opts .orow{display:flex;gap:6px;align-items:stretch}
.opts .orow .opt{flex:1 1 auto}
.optspk{flex:0 0 auto;min-width:46px;min-height:46px;border:2px solid #0b7c71;border-radius:12px;background:#0b7c71;color:#fff;font:inherit;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:8px 10px}
.optspk:hover{background:#0b7c71}
</style>

<script>
/* ============================================================
   מצב הדגמה — נכנס אך ורק דרך ?demo=1 בכתובת.
   ------------------------------------------------------------
   התסריט הוא נתון, לא קוד שפזור במסכים: כל פריט אומר מה נכתב
   בכתוביות (subtitle), מה נעשה על המסך (action) וכמה זמן הצופה
   נשאר עם המסך הזה (duration, באלפיות שנייה).

   ההדגמה מפעילה את האפליקציה האמיתית — היא לוחצת על אותם
   כפתורים שהמשתמש לוחץ עליהם. אין כאן מסך מזויף ואין תוכן
   שנכתב במיוחד להדגמה, ולכן היא גם לא יכולה להראות משהו
   שהאפליקציה לא באמת עושה.

   בלי ?demo=1 שום שורה כאן אינה רצה: המשתנים מוגדרים ונשארים
   בלי שימוש, לא נרשם אף מאזין אירועים, ולא נוסף דבר למסך.
   ============================================================ */
var DEMO_ON=/(^|[?&])demo=1(&|$)/.test(location.search||"");

/* בוחר אפשרות לפי נכונותה. התסריט לא מקודד תשובה: הוא שואל את
   השאלה שעל המסך עכשיו, ולכן הוא עובד גם כשההגרלה שינתה אותה. */
/* כאן לכל שאלה יש כפתור השמעה, ולכן אין צורך להגריל שאלה אחרת
   כדי למצוא אחד. הלולאה נשארה כרשת ביטחון בלבד. */
function demoHear(){
  for(var n=0;n<8&&!document.querySelector('[data-a="say"]');n++){

var DEMO={on:false,i:0,timer:null,extra:[],bar:null,txt:null,step:null,fill:null,btn:null};

/* עוזרים לתסריט. כולם מחזירים false כשהאיבר אינו על המסך, כדי
   שצעד שלא מצא את מה שחיפש ידלג ולא יפיל את ההדגמה כולה. */
function demoEl(s){return typeof s==="string"?document.querySelector(s):s}
function demoShow(s){
  var e=demoEl(s); if(!e)return false;
  try{e.scrollIntoView({behavior:"smooth",block:"center"})}catch(err){try{e.scrollIntoView()}catch(err2){}}
  return true;
}
/* מדגיש את האיבר, ורק אז לוחץ — צופה שלא ראה לאן נלחץ לא הבין
   מה קרה. לכן אין צעד קצר מ-1200 אלפיות בתסריטים. */
function demoTap(s){
  var e=demoEl(s); if(!e||e.disabled)return false;
  demoShow(e);
  e.classList.add("demo-tap");
  DEMO.extra.push(setTimeout(function(){
    e.classList.remove("demo-tap");
    /* המסך מצטייר מחדש כל הזמן. אם האיבר שסומן כבר אינו במסמך,
       מחפשים אותו שוב לפי אותו בורר — לחיצה על איבר מת אינה
       עושה דבר, וזה בדיוק צעד שנראה כאילו נתקע. */
    var live=(typeof s==="string"&&!document.contains(e))?demoEl(s):e;
    if(DEMO.on&&live&&!live.disabled&&document.contains(live))try{live.click()}catch(err){}
  },430));
  return true;
}
function demoClick(s){
  var e=demoEl(s); if(!e||e.disabled)return false;
  try{e.click()}catch(err){return false}
  return true;
}
/* הקלדה אות אחר אות, עם אירוע input אמיתי — שדה חיפוש שמאזין
   ל-input לא היה מגיב להשמה ישירה ל-value. */
function demoType(s,text){
  var e=demoEl(s); if(!e)return false;
  demoShow(e); try{e.focus()}catch(err){}
  e.value=""; var i=0;
  var t=setInterval(function(){
    if(!DEMO.on||!e.parentNode){clearInterval(t);return}
    e.value=String(text).slice(0,++i);
    e.dispatchEvent(new Event("input",{bubbles:true}));
    if(i>=String(text).length)clearInterval(t);
  },85);
  DEMO.extra.push(t);
  return true;
}

/* ESC יוצא. הקשבה בשלב הלכידה, כדי שמסך שכבר מטפל ב-Escape
   לא יבלע את המקש לפני שההדגמה ראתה אותו. */
function demoKey(e){
  if(!DEMO.on)return;
  if(e.key==="Escape"||e.keyCode===27){
    e.preventDefault(); e.stopPropagation();
    demoStop();
  }
}

function demoStart(){
  if(DEMO.on)return;
  DEMO.on=true; DEMO.i=0;
  DEMO.btn.hidden=true; DEMO.bar.hidden=false;
  document.documentElement.classList.add("demo-running");
  demoNext();
}

function demoNext(){
  if(!DEMO.on)return;
  if(DEMO.i>=DEMO_SCRIPT.length){demoStop();return}
  var it=DEMO_SCRIPT[DEMO.i++]||{};
  var d=Math.max(600,it.duration||3000);
  DEMO.txt.textContent=it.subtitle||"";
  DEMO.step.textContent=DEMO.i+" / "+DEMO_SCRIPT.length;
  DEMO.fill.style.transition="none"; DEMO.fill.style.width="0";
  void DEMO.fill.offsetWidth;
  DEMO.fill.style.transition="width "+d+"ms linear";
  DEMO.fill.style.width="100%";
  if(typeof it.action==="function"){
    try{it.action()}catch(err){if(window.console)console.warn("demo:",err)}
  }
  DEMO.timer=setTimeout(demoNext,d);
}

function demoStop(){
  DEMO.on=false;
  if(DEMO.timer){clearTimeout(DEMO.timer);DEMO.timer=null}
  DEMO.extra.forEach(function(t){clearTimeout(t);clearInterval(t)});
  DEMO.extra=[];
  var m=document.querySelectorAll(".demo-tap"),i;
  for(i=0;i<m.length;i++)m[i].classList.remove("demo-tap");
  if(DEMO.bar)DEMO.bar.hidden=true;
  if(DEMO.btn)DEMO.btn.hidden=false;
  document.documentElement.classList.remove("demo-running");
  demoQuiet();
}

    poll=setInterval(function(){if(allVoices().length)finish()},120);

       עדיף לדבר בקול ברירת מחדל מאשר לשתוק לנצח. */

function vchkT(){ var g=state.lang||"he"; return VCHKMSG[g]||VCHKMSG.he }
function voiceCheck(){
  var M=vchkT();
  VCHK=M.sent; render();
  function show(m){ VCHK=m; render() }
  if(!("speechSynthesis" in window)){ show(M.noSup); return }
  var list=[]; try{ list=speechSynthesis.getVoices()||[] }catch(e){}
  try{ speechSynthesis.cancel() }catch(e){}
  var u;
  try{ u=new SpeechSynthesisUtterance(M.say) }
  catch(e){ show(M.mkFail+e.message); return }
  u.lang=(LANGS[state.lang||"he"]||LANGS.he).tts; u.volume=1; u.rate=1; u.pitch=1;
  var done=false;
  u.onstart=function(){ done=true; show(M.okN[0]+list.length+M.okN[1]) };
  u.onerror=function(e){ done=true;
    var er=(e&&e.error)||M.unk;
    if(er==="interrupted"||er==="canceled"){ show(M.ok); return }
    show(M.engine[0]+er+" · "+list.length+M.engine[1]); };
  try{ speechSynthesis.speak(u) }
  catch(e){ show(M.spFail+e.message); return }
  setTimeout(function(){ if(!done)
    show(M.timeout[0]+list.length+M.timeout[1]) },2000);
}

/* ------------------------------------------------------------
   דור ההקראה. speechSynthesis.cancel() אינו מבטל setTimeout:
   כרום יורה onend על האמירה שבוטלה, המקטע הבא נרשם בכל זאת,
   וכעבור SEG_GAP ההקראה הישנה חוזרת מעל החדשה — שני קולות
   במקביל. מונה אחד פותר את זה: כל הקראה מקבלת מספר, stopSpeak
   מקדם אותו, ומקטע מדור ישן פשוט אינו מדבר.
   ------------------------------------------------------------ */
var _sayGen=0;
function speakDevice(text,code,rate){
  if(!("speechSynthesis" in window))return false;
  try{speechSynthesis.cancel()}catch(e){}
  var my=++_sayGen;
  /* האמירה יוצאת מיד, בתוך הלחיצה. קודם היא נעטפה ב-voicesReady,
     שממתין לרשימת הקולות ועד ארבע שניות אם היא לא מגיעה — ואמירה
     שיוצאת ארבע שניות אחרי המגע נזרקת בשקט באנדרואיד ובספארי.
     כשהרשימה כבר כאן, בוחרים קול ומדברים. כשהיא ריקה — מדברים
     בכל זאת, עם u.lang בלבד: קול ברירת מחדל בשפה הנכונה עדיף על
     שתיקה, ויש מכשירים שמחזירים רשימה ריקה לצמיתות ומדברים היטב.
     voicesReady נשאר בשימוש למסך בחירת הקול, שם ההמתנה במקומה. */
  (function(){
    try{
      var v=bestVoice(code), lang=(v&&v.lang)||code;
      var segs=segments(String(text)), rt=tuneRate(lang,clamp(rate,0.55,1.4));
      var pit=femLift(v);
      (function sayseg(k){
        if(my!==_sayGen)return;   /* ההקראה הזאת בוטלה — המקטע הבא לא יוצא */
        if(k>=segs.length){ hlClear(); ttsOK(); return }
        var seg=segs[k];
        var u=new SpeechSynthesisUtterance(seg.text);
        u.lang=lang;
        if(v){ try{ u.voice=v }catch(e2){} }
        u.rate=rt; u.pitch=pit; u.volume=1;
        u.onboundary=function(e){if(!e.name||e.name==="word")hlAt(seg.start+e.charIndex)};
        u.onend=function(){
          if(k+1<segs.length) setTimeout(function(){sayseg(k+1)},SEG_GAP);
          else { hlClear(); ttsOK() }
        };
        u.onerror=function(e){ttsFail(e&&e.error)};
        speechSynthesis.speak(u);
      })(0);
    }catch(e){}
  })();
  return true;
}
/* lang: "en" לחומר הנלמד, או קוד שפת האם להוראה. */
function speak(text,lang,rateMul){
  /* כל טקסט שמגיע להקראה מנוקה מתגיות. חלק מהקריאות כבר מנקות
     לבד, וניקוי חוזר אינו משנה דבר — אבל בלעדיו כל מחרוזת שנשארה
     עם <sub> או <span class="frac"> הוקראה בקול כתגית: הסטודנט
     שמע "span class frac" באמצע השאלה. */
  /* 6.10.2026 — O-145: `<br>` נעלם ב-plainOf בלי להשאיר רווח, ולכן
     "…ניקיון גדול<br>עד איזו שעה" נאמר כמילה אחת מודבקת. תגית `br`
     היא סוף משפט, ולכן היא הופכת לנקודה לפני ההשטחה. נמדד
     ב-hebrew-arab: 450 מופעים בקטעי הקריאה. */
  text=plainOf(String(text||"").replace(/<br\s*\/?>/gi,". ")).trim().replace(/_{2,}/g,"\u2026"); if(!text)return;
  lang=lang||"en";
  var code=lang==="en"?EN_TTS:LANGS[lang].tts;
  var rate=clamp(state.rate*(rateMul||1),0.55,1.4);
  stopSpeak();
  var my=_sayGen;   /* גם תשובת רשת שמגיעה אחרי עצירה לא תושמע */
  /* שכבה 1 - קובץ מוקלט (המנוע של תאוריה מדברת). יש קובץ:
     מנגנים וזהו; אין: קול המכשיר כרגיל. מבדק חוסרים 30.9 סעיף 4. */
  if(typeof RECORDED!=="undefined"&&RECORDED.play(text,lang,{rate:state.rate,
      onError:function(){ if(my===_sayGen)speakDevice(text,code,rate) }})){
    return;
  }
  if(gemOn()){
    var vid=gvOf(state.gemVoice).id;
    var ck=lang+"|"+vid+"|"+rate.toFixed(2)+"|"+text;
    if(gCache[ck]){playUrl(gCache[ck],text,code,rate);return}
    gBusy=true; renderSpeakState();
    gSynth(text,vid,rate,lang).then(function(u){
      if(my!==_sayGen)return;
      gCache[ck]=u; gBusy=false; renderSpeakState(); playUrl(u,text,code,rate);
    }).catch(function(){
      gBusy=false; renderSpeakState(); speakDevice(text,code,rate);
    });
    return;
  }
  speakDevice(text,code,rate);
}
function playUrl(url,text,code,rate){
  gStop();
  /* משתמשים באלמנט ששוחרר במגע ולא יוצרים חדש. */
  if(!GEL)GEL=new Audio();
  gAudio=GEL; gAudio.src=url;
  gAudio.play().catch(function(){speakDevice(text,code,rate)});
}
function stopSpeak(){_sayGen++;gStop();if(typeof RECORDED!=="undefined")RECORDED.stop();hlClear();try{if(window.speechSynthesis)speechSynthesis.cancel()}catch(e){}}
/* עוזבים את הדף — הקול נעצר. בלעדיו הוא ממשיך ברקע אחרי מעבר לטאב
   אחר, ולפעמים נתקע עד סגירת הדפדפן. */
try{document.addEventListener("visibilitychange",function(){
  if(document.hidden)stopSpeak();
});}catch(e){}
/* iOS לא ישמיע כלום עד שאמירה אחת יצאה מתוך handler של מגע אמיתי.
   אמירה אוטומטית בטעינת הדף נבלעת בשקט — בלי חריגה, בלי לוג, בלי
   דרך לדעת. משחררים פעם אחת עם אמירה ריקה.
   חשוב: קריאה ישירה, בלי voicesReady — הבטחה שוברת את שרשרת המגע
   ו-Safari כבר לא יזהה את האמירה כיוזמת משתמש. */
try{document.addEventListener("pointerdown",function(){
  try{speechSynthesis.speak(new SpeechSynthesisUtterance(""))}catch(e){}
  /* ואותו דבר לאלמנט השמע: מקור שקט, play בתוך המגע עצמו. */
  try{
    if(!GEL)GEL=new Audio();
    GEL.src=SILENT_WAV;
    var pr=GEL.play();
    if(pr&&pr.then)pr.then(function(){try{GEL.pause();GEL.currentTime=0}catch(e){}},function(){});
  }catch(e){}
},{once:true});}catch(e){}
function renderSpeakState(){
  var b=document.querySelectorAll(".spk");
  for(var i=0;i<b.length;i++)b[i].classList.toggle("on",gBusy);
}

/* ============================================================
   7. תוכן
   ------------------------------------------------------------
   בנק שאלות כתוב, ולא מחולל. בלשון אין נוסחה שממנה נגזרת
   שאלה: הניסוח המדויק הוא החומר הנלמד, ומסיח שנבנה אוטומטית
   מנוסח אחר היה יוצא או מופרך מדי או נכון בעצמו.

   Q(id, q, opts, ok, hint, ex, fig)
     id   — מזהה יציב לפריט. הוא נכנס לסטטיסטיקה של הלומד, ולכן
            אסור לו להשתנות כשמוסיפים פריט לפניו.
     q    — נוסח השאלה, בארבע שפות.
     opts — ארבע תשובות, כל אחת בארבע שפות. תמיד ארבע: שלוש
            אפשרויות הן ניחוש של אחד משלושה.
     ok   — אינדקס התשובה הנכונה במערך opts (0..3). הסדר על
            המסך מעורבב בכל הצגה, ולכן האינדקס אינו רמז.
     hint — רמז שמכוון לחשיבה ואינו מוסר את התשובה.
     ex   — ההסבר שנפתח אחרי המענה, גם כשענו נכון.
     fig  — מפתח איור מתוך FIGS, או null. אופציונלי בהגדרה:
            רוב השאלות כאן הן טקסט בלבד.

   כל שדה קיים בארבע השפות. לשון נלמדת בשפת האם — מי שקורא
   בקושי בעברית לא ילמד ממנה מדרג נורמות, ולכן התוכן עצמו
   מתורגם ולא רק הממשק.

   מקור: תוכנית הלימודים בעברית לחינוך הערבי של משרד החינוך (014381, 014281), meyda.education.gov.il. הניסוח מקורי של בקול, עם קרדיט וקישור למשרד החינוך.
   השאלות נכתבו לאפליקציה הזאת ואינן העתק של בחינה.
   ============================================================ */
function Q(id,q,opts,ok,hint,ex,fig,wrong){
  return {id:id,q:q,o:opts,ok:ok,hint:hint,ex:ex,fig:fig||null,wrong:wrong||null};
}

topic("ha-read","014381",{"he": "הבנת הנקרא: טקסטים קצרים", "ar": "فهم المقروء: نصوص قصيرة", "ru": "Понимание прочитанного: короткие тексты", "en": "Reading comprehension: short texts"},{"he": "קטעים שימושיים, עיוניים ומדעת, ושאלות כמו בבגרות", "ar": "نصوص تطبيقية ومعرفية وصحفية، وأسئلة كما في البجروت", "ru": "Практические, информационные и публицистические отрывки с вопросами в стиле багрута", "en": "Practical, informational and opinion passages with bagrut-style questions"}, [
  [
   Q("ha-read-1-1",{"he": "קראו את הקטע וענו על השאלה.<br>הודעה לתלמידים: החל מיום ראשון הקרוב, ספריית בית הספר תהיה פתוחה גם בשעות אחר הצהריים, עד השעה שבע בערב. ההחלטה התקבלה בעקבות בקשות רבות של תלמידים המתכוננים לבחינות הבגרות. במהלך שעות הערב יעבוד בספרייה מדריך שיסייע בחיפוש מקורות ובכתיבת עבודות. כדי לשמור על סביבת לימוד שקטה, לא יהיה ניתן להשתמש בטלפונים ניידים בתוך אולם הקריאה.<br>עד באיזו שעה תהיה הספרייה פתוחה בשעות אחר הצהריים?", "ar": "اقرأوا القطعة وأجيبوا عن السؤال.<br>إعلان للطلاب: ابتداءً من يوم الأحد القريب، ستكون مكتبة المدرسة مفتوحة أيضًا في ساعات ما بعد الظهر، حتى الساعة السابعة مساءً. اتُّخذ القرار إثر طلبات كثيرة من طلاب يستعدون لامتحانات البجروت. خلال ساعات المساء سيعمل في المكتبة مرشد يساعد في البحث عن مصادر وفي كتابة الوظائف. وللحفاظ على بيئة تعلّم هادئة، لن يكون بالإمكان استخدام الهواتف الخليوية داخل قاعة المطالعة.<br>حتى أي ساعة ستكون المكتبة مفتوحة في ساعات ما بعد الظهر؟", "ru": "Прочитайте отрывок и ответьте на вопрос.<br>Объявление для учеников: с ближайшего воскресенья школьная библиотека будет открыта также во второй половине дня, до семи часов вечера. Решение принято по многочисленным просьбам учеников, готовящихся к экзаменам на аттестат зрелости. В вечерние часы в библиотеке будет работать инструктор, который поможет искать источники и писать работы. Чтобы сохранить тихую учебную обстановку, пользоваться мобильными телефонами в читальном зале будет нельзя.<br>До какого часа библиотека будет открыта во второй половине дня?", "en": "Read the passage and answer the question.<br>Notice to students: starting this Sunday, the school library will also be open in the afternoon, until seven in the evening. The decision was made following many requests from students preparing for the matriculation exams. During the evening hours an instructor will work in the library, helping with finding sources and writing papers. To keep a quiet study environment, mobile phones may not be used inside the reading hall.<br>Until what time will the library be open in the afternoon?"},[{"he": "שבע בערב", "ar": "السابعة مساءً", "ru": "семь вечера", "en": "seven in the evening"}, {"he": "שש בערב", "ar": "السادسة مساءً", "ru": "шесть вечера", "en": "six in the evening"}, {"he": "שמונה בבוקר", "ar": "الثامنة صباحًا", "ru": "восемь утра", "en": "eight in the morning"}, {"he": "חמש בצהריים", "ar": "الخامسة ظهرًا", "ru": "пять дня", "en": "five in the afternoon"}],0,{"he": "חפשו את השעה הרשומה בהודעה.", "ar": "ابحثوا عن الساعة المذكورة في الإعلان.", "ru": "Найдите час, указанный в объявлении.", "en": "Look for the time written in the notice."},{"he": "ההודעה קובעת במפורש: עד השעה שבע בערב. שימו לב למילה גם: היא מלמדת ששעות הבוקר נשארות כרגיל, והחידוש הוא רק אחר הצהריים. כך למשל, תלמיד שמסיים את הלימודים בארבע יכול להישאר בספרייה עד שבע.", "ar": "ينصّ الإعلان صراحةً: حتى الساعة السابعة مساءً. لاحظوا كلمة أيضًا: فهي تدل على أن ساعات الصباح تبقى كالمعتاد، والجديد هو فترة ما بعد الظهر فقط. مثلًا، طالب ينهي دراسته في الرابعة يمكنه البقاء في المكتبة حتى السابعة.", "ru": "В объявлении прямо сказано: до семи часов вечера. Обратите внимание на слово также: оно показывает, что утренние часы не меняются, а новшество касается только второй половины дня. Например, ученик, заканчивающий занятия в четыре, может оставаться в библиотеке до семи.", "en": "The notice states explicitly: until seven in the evening. Note the word also: it shows morning hours stay the same and only the afternoon is new. For example, a student finishing classes at four can stay in the library until seven."},null,[null, {"he": "השעה שש אינה מוזכרת בהודעה.", "ar": "الساعة السادسة غير مذكورة في الإعلان.", "ru": "Шесть часов в объявлении не упоминается.", "en": "Six o'clock is not mentioned in the notice."}, {"he": "שמונה בבוקר היא שעת הפתיחה הרגילה, לא סוף יום הפתיחה החדש.", "ar": "الثامنة صباحًا هي ساعة الافتتاح المعتادة، لا نهاية دوام الافتتاح الجديد.", "ru": "Восемь утра - обычное время открытия, а не конец нового вечернего графика.", "en": "Eight in the morning is the regular opening time, not the end of the new afternoon hours."}, {"he": "חמש בצהריים אינה מוזכרת; ההודעה אומרת שבע.", "ar": "الخامسة ظهرًا غير مذكورة؛ الإعلان يقول السابعة.", "ru": "Пять часов не упоминается; в объявлении сказано семь.", "en": "Five is not mentioned; the notice says seven."}]),
   Q("ha-read-1-2",{"he": "קראו את הקטע וענו על השאלה.<br>הודעה לתלמידים: החל מיום ראשון הקרוב, ספריית בית הספר תהיה פתוחה גם בשעות אחר הצהריים, עד השעה שבע בערב. ההחלטה התקבלה בעקבות בקשות רבות של תלמידים המתכוננים לבחינות הבגרות. במהלך שעות הערב יעבוד בספרייה מדריך שיסייע בחיפוש מקורות ובכתיבת עבודות. כדי לשמור על סביבת לימוד שקטה, לא יהיה ניתן להשתמש בטלפונים ניידים בתוך אולם הקריאה.<br>מדוע הוחלט להאריך את שעות הפתיחה של הספרייה?", "ar": "اقرأوا القطعة وأجيبوا عن السؤال.<br>إعلان للطلاب: ابتداءً من يوم الأحد القريب، ستكون مكتبة المدرسة مفتوحة أيضًا في ساعات ما بعد الظهر، حتى الساعة السابعة مساءً. اتُّخذ القرار إثر طلبات كثيرة من طلاب يستعدون لامتحانات البجروت. خلال ساعات المساء سيعمل في المكتبة مرشد يساعد في البحث عن مصادر وفي كتابة الوظائف. وللحفاظ على بيئة تعلّم هادئة، لن يكون بالإمكان استخدام الهواتف الخليوية داخل قاعة المطالعة.<br>لماذا تقرر تمديد ساعات فتح المكتبة؟", "ru": "Прочитайте отрывок и ответьте на вопрос.<br>Объявление для учеников: с ближайшего воскресенья школьная библиотека будет открыта также во второй половине дня, до семи часов вечера. Решение принято по многочисленным просьбам учеников, готовящихся к экзаменам на аттестат зрелости. В вечерние часы в библиотеке будет работать инструктор, который поможет искать источники и писать работы. Чтобы сохранить тихую учебную обстановку, пользоваться мобильными телефонами в читальном зале будет нельзя.<br>Почему решили продлить часы работы библиотеки?", "en": "Read the passage and answer the question.<br>Notice to students: starting this Sunday, the school library will also be open in the afternoon, until seven in the evening. The decision was made following many requests from students preparing for the matriculation exams. During the evening hours an instructor will work in the library, helping with finding sources and writing papers. To keep a quiet study environment, mobile phones may not be used inside the reading hall.<br>Why was it decided to extend the library's opening hours?"},[{"he": "כי המדריך ביקש לעבוד שעות נוספות", "ar": "لأن المرشد طلب العمل ساعات إضافية", "ru": "потому что инструктор попросил дополнительные часы", "en": "because the instructor asked for extra hours"}, {"he": "כי נסגרה ספרייה אחרת בעיר", "ar": "لأن مكتبة أخرى في المدينة أُغلقت", "ru": "потому что другая библиотека в городе закрылась", "en": "because another library in town closed"}, {"he": "בעקבות בקשות רבות של תלמידים המתכוננים לבגרות", "ar": "إثر طلبات كثيرة من طلاب يستعدون للبجروت", "ru": "из-за многочисленных просьб учеников, готовящихся к багруту", "en": "following many requests from students preparing for matriculation"}, {"he": "כי בוטלו שיעורי אחר הצהריים בבית הספר", "ar": "لأن حصص ما بعد الظهر في المدرسة أُلغيت", "ru": "потому что послеобеденные уроки в школе отменили", "en": "because afternoon classes at school were cancelled"}],2,{"he": "ההודעה מסבירה את הסיבה מיד אחרי שמבשרת על השינוי.", "ar": "الإعلان يشرح السبب مباشرةً بعد الإخبار عن التغيير.", "ru": "В объявлении причина объясняется сразу после сообщения об изменении.", "en": "The notice explains the reason right after announcing the change."},{"he": "הביטוי בעקבות מסמן סיבה: ההחלטה באה אחרי בקשות רבות של תלמידים המתכוננים לבחינות הבגרות. המדריך הוא חלק מהפתרון, לא הסיבה לו. למשל, אילו כתוב היה בעקבות גשמים כבדים, הסיבה הייתה מזג האוויר.", "ar": "تدل كلمة إثر على السبب: القرار جاء بعد طلبات كثيرة من طلاب يستعدون للبجروت. المرشد جزء من الحل، لا سبب له. مثلًا، لو كان مكتوبًا إثر أمطار غزيرة، لكان السبب الطقس.", "ru": "Выражение вследствие обозначает причину: решение последовало за многочисленными просьбами учеников, готовящихся к экзаменам. Инструктор - часть решения, а не его причина. Например, если бы было написано вследствие сильных дождей, причиной была бы погода.", "en": "The word following marks a cause: the decision came after many requests from students preparing for the exams. The instructor is part of the solution, not its reason. For example, if it said following heavy rains, the cause would be the weather."},null,[{"he": "המדריך יעבוד בערב, אבל הוא אינו הסיבה להארכת השעות.", "ar": "المرشد سيعمل مساءً، لكنه ليس سبب تمديد الساعات.", "ru": "Инструктор будет работать вечером, но он не причина продления часов.", "en": "The instructor will work evenings, but he is not the reason for the extension."}, {"he": "לא מוזכרת בספרייה אחרת בעיר.", "ar": "لا تُذكر مكتبة أخرى في المدينة.", "ru": "Другая библиотека в городе не упоминается.", "en": "No other library in town is mentioned."}, null, {"he": "ביטול שיעורים אינו מוזכר; ההחלטה נוגעת לספרייה בלבד.", "ar": "إلغاء الحصص غير مذكور؛ القرار يخص المكتبة فقط.", "ru": "Отмена уроков не упоминается; решение касается только библиотеки.", "en": "Cancelled classes are not mentioned; the decision concerns the library only."}]),
   Q("ha-read-1-3",{"he": "קראו את הקטע וענו על השאלה.<br>הודעה לתלמידים: החל מיום ראשון הקרוב, ספריית בית הספר תהיה פתוחה גם בשעות אחר הצהריים, עד השעה שבע בערב. ההחלטה התקבלה בעקבות בקשות רבות של תלמידים המתכוננים לבחינות הבגרות. במהלך שעות הערב יעבוד בספרייה מדריך שיסייע בחיפוש מקורות ובכתיבת עבודות. כדי לשמור על סביבת לימוד שקטה, לא יהיה ניתן להשתמש בטלפונים ניידים בתוך אולם הקריאה.<br>מה מטרת האיסור להשתמש בטלפונים ניידים באולם הקריאה?", "ar": "اقرأوا القطعة وأجيبوا عن السؤال.<br>إعلان للطلاب: ابتداءً من يوم الأحد القريب، ستكون مكتبة المدرسة مفتوحة أيضًا في ساعات ما بعد الظهر، حتى الساعة السابعة مساءً. اتُّخذ القرار إثر طلبات كثيرة من طلاب يستعدون لامتحانات البجروت. خلال ساعات المساء سيعمل في المكتبة مرشد يساعد في البحث عن مصادر وفي كتابة الوظائف. وللحفاظ على بيئة تعلّم هادئة، لن يكون بالإمكان استخدام الهواتف الخليوية داخل قاعة المطالعة.<br>ما هدف حظر استخدام الهواتف الخليوية في قاعة المطالعة؟", "ru": "Прочитайте отрывок и ответьте на вопрос.<br>Объявление для учеников: с ближайшего воскресенья школьная библиотека будет открыта также во второй половине дня, до семи часов вечера. Решение принято по многочисленным просьбам учеников, готовящихся к экзаменам на аттестат зрелости. В вечерние часы в библиотеке будет работать инструктор, который поможет искать источники и писать работы. Чтобы сохранить тихую учебную обстановку, пользоваться мобильными телефонами в читальном зале будет нельзя.<br>Какова цель запрета пользоваться телефонами в читальном зале?", "en": "Read the passage and answer the question.<br>Notice to students: starting this Sunday, the school library will also be open in the afternoon, until seven in the evening. The decision was made following many requests from students preparing for the matriculation exams. During the evening hours an instructor will work in the library, helping with finding sources and writing papers. To keep a quiet study environment, mobile phones may not be used inside the reading hall.<br>What is the purpose of banning mobile phones in the reading hall?"},[{"he": "למנוע גניבה של טלפונים", "ar": "لمنع سرقة الهواتف", "ru": "чтобы предотвратить кражу телефонов", "en": "to prevent phone theft"}, {"he": "לשמור על סביבה שקטה", "ar": "للحفاظ على بيئة هادئة", "ru": "чтобы сохранить тихую обстановку", "en": "to keep a quiet environment"}, {"he": "לחסוך בחשמל", "ar": "لتوفير الكهرباء", "ru": "чтобы экономить электричество", "en": "to save electricity"}, {"he": "לאפשר למדריך לנוח", "ar": "لإتاحة الراحة للمرشد", "ru": "чтобы инструктор мог отдохнуть", "en": "to let the instructor rest"}],1,{"he": "המילה כדי פותחת משפט מטרה.", "ar": "كلمة لكي تفتتح جملة الهدف.", "ru": "Слово чтобы открывает предложение цели.", "en": "The words in order to open a purpose clause."},{"he": "ההודעה אומרת במפורש: כדי לשמור על סביבת לימוד שקטה. המילה כדי מכוונת אותנו למטרה. שאלו את עצמכם: מה רוצה כותב ההודעה להשיג? לא חיסכון ולא נוחות, אלא שקט ללומדים. למשל, תלמיד שמתקשר באולם מפריע לכל מי שקורא.", "ar": "يقول الإعلان صراحةً: للحفاظ على بيئة تعلّم هادئة. كلمة لكي توجهنا إلى الهدف. اسألوا أنفسكم: ماذا يريد كاتب الإعلان أن يحقق؟ لا توفيرًا ولا راحة، بل الهدوء للمتعلمين. مثلًا، طالب يجري مكالمة في القاعة يزعج كل من يقرأ.", "ru": "В объявлении прямо сказано: чтобы сохранить тихую учебную обстановку. Слово чтобы указывает на цель. Спросите себя: чего хочет добиться автор объявления? Не экономии и не отдыха, а тишины для занимающихся. Например, ученик, разговаривающий по телефону в зале, мешает всем читающим.", "en": "The notice says explicitly: to keep a quiet study environment. The words in order to point us to the purpose. Ask yourself: what does the writer want to achieve? Not savings or rest, but quiet for the learners. For example, a student taking a call in the hall disturbs everyone reading."},null,[{"he": "גניבה אינה מוזכרת בהודעה.", "ar": "السرقة غير مذكورة في الإعلان.", "ru": "Кража в объявлении не упоминается.", "en": "Theft is not mentioned in the notice."}, null, {"he": "חיסכון בחשמל אינו קשור לאיסור ואינו מוזכר.", "ar": "توفير الكهرباء لا علاقة له بالحظر وغير مذكور.", "ru": "Экономия электричества не связана с запретом и не упоминается.", "en": "Saving electricity is unrelated to the ban and is not mentioned."}, {"he": "המדריך בא לסייע לתלמידים, לא לנוח.", "ar": "المرشد جاء لمساعدة الطلاب، لا للراحة.", "ru": "Инструктор пришёл помогать ученикам, а не отдыхать.", "en": "The instructor is there to help students, not to rest."}]),
   Q("rd-1-01",{"he": "קראו את הקטע וענו על השאלה.<br>הודעה לתושבים: ביום שלישי הקרוב יתקיים ניקיון גדול בגן הציבורי ברחוב הזית. המפגש יתחיל בשעה 9:00 בבוקר, ליד המזרקה. העירייה תחלק לכל המשתתפים כפפות ושקיות. בסוף הניקיון יקבלו כולם שתייה קרה ופירות. מי שרוצה להשתתף צריך להירשם מראש במרכז הקהילתי.<br>איפה ייפגשו המשתתפים בתחילת הניקיון?", "ar": "اقرأوا القطعة وأجيبوا عن السؤال.<br>إعلان للسكان: يوم الثلاثاء القادم سيُقام تنظيف كبير في الحديقة العامة في شارع الزيتون. يبدأ اللقاء الساعة 9:00 صباحًا، بجانب النافورة. ستوزّع البلدية على جميع المشاركين قفازات وأكياسًا. في نهاية التنظيف سيحصل الجميع على مشروبات باردة وفواكه. من يريد المشاركة عليه أن يسجّل مسبقًا في المركز الجماهيري.<br>أين سيلتقي المشاركون في بداية التنظيف؟", "ru": "Прочитайте отрывок и ответьте на вопрос.<br>Объявление для жителей: в ближайший вторник в городском саду на улице Ха-Зайт пройдёт большая уборка. Встреча начнётся в 9:00 утра у фонтана. Муниципалитет раздаст всем участникам перчатки и мешки. В конце уборки все получат холодные напитки и фрукты. Кто хочет участвовать, должен заранее записаться в общинном центре.<br>Где встретятся участники в начале уборки?", "en": "Read the passage and answer the question.<br>Notice to residents: this coming Tuesday there will be a big clean-up in the public garden on HaZayit Street. The meeting starts at 9:00 a.m., next to the fountain. The municipality will give all participants gloves and bags. At the end of the clean-up everyone will get cold drinks and fruit. Anyone who wants to take part must register in advance at the community center.<br>Where will the participants meet at the start of the clean-up?"},[{"he": "ליד המזרקה שבגן", "ar": "بجانب النافورة في الحديقة", "ru": "у фонтана в саду", "en": "next to the fountain in the garden"}, {"he": "ליד בניין העירייה ברחוב הזית", "ar": "بجانب مبنى البلدية في شارع الزيتون", "ru": "у здания муниципалитета на улице Ха-Зайт", "en": "next to the city hall building on HaZayit Street"}, {"he": "במרכז הקהילתי של השכונה", "ar": "في المركز الجماهيري في الحي", "ru": "в общинном центре района", "en": "at the neighborhood community center"}, {"he": "בכניסה לבית הספר הקרוב", "ar": "عند مدخل المدرسة القريبة", "ru": "у входа в ближайшую школу", "en": "at the entrance to the nearby school"}],0,{"he": "חפשו את המשפט שמספר מתי ואיפה מתחיל המפגש.", "ar": "ابحثوا عن الجملة التي تذكر متى وأين يبدأ اللقاء.", "ru": "Найдите предложение о том, когда и где начинается встреча.", "en": "Find the sentence that says when and where the meeting starts."},{"he": "בהודעה כתוב: המפגש יתחיל בשעה 9:00, ליד המזרקה. המרכז הקהילתי מוזכר רק כמקום ההרשמה.", "ar": "في الإعلان مكتوب: يبدأ اللقاء الساعة 9:00، بجانب النافورة. المركز الجماهيري مذكور فقط كمكان للتسجيل.", "ru": "В объявлении написано: встреча начнётся в 9:00 у фонтана. Общинный центр упомянут только как место записи.", "en": "The notice says: the meeting starts at 9:00, next to the fountain. The community center is mentioned only as the place to register."},null,[null, {"he": "רחוב הזית הוא הכתובת של הגן, ובניין העירייה אינו מוזכר.", "ar": "شارع الزيتون هو عنوان الحديقة، ومبنى البلدية غير مذكور.", "ru": "Улица Ха-Зайт - адрес сада, а здание муниципалитета не упоминается.", "en": "HaZayit Street is the garden's address; the city hall building is not mentioned."}, {"he": "במרכז הקהילתי נרשמים מראש, אבל לא נפגשים בו.", "ar": "في المركز الجماهيري يسجّلون مسبقًا، لكن لا يلتقون فيه.", "ru": "В общинном центре записываются заранее, но встречаются не там.", "en": "You register in advance at the community center, but you do not meet there."}, {"he": "בית ספר אינו מוזכר בהודעה.", "ar": "المدرسة غير مذكورة في الإعلان.", "ru": "Школа в объявлении не упоминается.", "en": "A school is not mentioned in the notice."}]),
   Q("rd-1-02",{"he": "קראו את הקטע וענו על השאלה.<br>הודעה לתושבים: ביום שלישי הקרוב יתקיים ניקיון גדול בגן הציבורי ברחוב הזית. המפגש יתחיל בשעה 9:00 בבוקר, ליד המזרקה. העירייה תחלק לכל המשתתפים כפפות ושקיות. בסוף הניקיון יקבלו כולם שתייה קרה ופירות. מי שרוצה להשתתף צריך להירשם מראש במרכז הקהילתי.<br>מה תיתן העירייה לכל המשתתפים?", "ar": "اقرأوا القطعة وأجيبوا عن السؤال.<br>إعلان للسكان: يوم الثلاثاء القادم سيُقام تنظيف كبير في الحديقة العامة في شارع الزيتون. يبدأ اللقاء الساعة 9:00 صباحًا، بجانب النافورة. ستوزّع البلدية على جميع المشاركين قفازات وأكياسًا. في نهاية التنظيف سيحصل الجميع على مشروبات باردة وفواكه. من يريد المشاركة عليه أن يسجّل مسبقًا في المركز الجماهيري.<br>ماذا ستعطي البلدية لجميع المشاركين؟", "ru": "Прочитайте отрывок и ответьте на вопрос.<br>Объявление для жителей: в ближайший вторник в городском саду на улице Ха-Зайт пройдёт большая уборка. Встреча начнётся в 9:00 утра у фонтана. Муниципалитет раздаст всем участникам перчатки и мешки. В конце уборки все получат холодные напитки и фрукты. Кто хочет участвовать, должен заранее записаться в общинном центре.<br>Что муниципалитет даст всем участникам?", "en": "Read the passage and answer the question.<br>Notice to residents: this coming Tuesday there will be a big clean-up in the public garden on HaZayit Street. The meeting starts at 9:00 a.m., next to the fountain. The municipality will give all participants gloves and bags. At the end of the clean-up everyone will get cold drinks and fruit. Anyone who wants to take part must register in advance at the community center.<br>What will the municipality give all participants?"},[{"he": "כובעים וחולצות", "ar": "قبعات وقمصان", "ru": "шапки и футболки", "en": "hats and shirts"}, {"he": "מטאטאים ודליים לניקוי הגן", "ar": "مكانس ودلاء لتنظيف الحديقة", "ru": "мётлы и вёдра для уборки сада", "en": "brooms and buckets for cleaning the garden"}, {"he": "כפפות ושקיות", "ar": "قفازات وأكياس", "ru": "перчатки и мешки", "en": "gloves and bags"}, {"he": "כרטיסים לבריכה העירונית", "ar": "تذاكر للمسبح البلدي", "ru": "билеты в городской бассейн", "en": "tickets to the city pool"}],2,{"he": "קראו את המשפט שבו מופיעה המילה העירייה.", "ar": "اقرأوا الجملة التي تظهر فيها كلمة البلدية.", "ru": "Прочитайте предложение, в котором есть слово «муниципалитет».", "en": "Read the sentence that contains the word municipality."},{"he": "כתוב: העירייה תחלק לכל המשתתפים כפפות ושקיות. שתייה ופירות יקבלו רק בסוף הניקיון. שאר הדברים אינם מוזכרים בהודעה.", "ar": "مكتوب: ستوزّع البلدية على جميع المشاركين قفازات وأكياسًا. المشروبات والفواكه تُعطى فقط في نهاية التنظيف. باقي الأشياء غير مذكورة في الإعلان.", "ru": "Написано: муниципалитет раздаст всем участникам перчатки и мешки. Напитки и фрукты дадут только в конце уборки. Остальное в объявлении не упоминается.", "en": "It says: the municipality will give all participants gloves and bags. Drinks and fruit come only at the end. The other things are not mentioned in the notice."},null,[{"he": "כובעים וחולצות אינם מוזכרים בהודעה.", "ar": "القبعات والقمصان غير مذكورة في الإعلان.", "ru": "Шапки и футболки в объявлении не упоминаются.", "en": "Hats and shirts are not mentioned in the notice."}, {"he": "מטאטאים ודליים אינם מוזכרים; העירייה מחלקת דברים אחרים.", "ar": "المكانس والدلاء غير مذكورة؛ البلدية توزّع أشياء أخرى.", "ru": "Мётлы и вёдра не упоминаются; муниципалитет раздаёт другое.", "en": "Brooms and buckets are not mentioned; the municipality gives other things."}, null, {"he": "בריכה אינה מוזכרת בהודעה כלל.", "ar": "المسبح غير مذكور في الإعلان أبدًا.", "ru": "Бассейн в объявлении вообще не упоминается.", "en": "A pool is not mentioned in the notice at all."}]),
   Q("rd-1-03",{"he": "קראו את הקטע וענו על השאלה.<br>הודעה לתושבים: ביום שלישי הקרוב יתקיים ניקיון גדול בגן הציבורי ברחוב הזית. המפגש יתחיל בשעה 9:00 בבוקר, ליד המזרקה. העירייה תחלק לכל המשתתפים כפפות ושקיות. בסוף הניקיון יקבלו כולם שתייה קרה ופירות. מי שרוצה להשתתף צריך להירשם מראש במרכז הקהילתי.<br>מהי המטרה של ההודעה?", "ar": "اقرأوا القطعة وأجيبوا عن السؤال.<br>إعلان للسكان: يوم الثلاثاء القادم سيُقام تنظيف كبير في الحديقة العامة في شارع الزيتون. يبدأ اللقاء الساعة 9:00 صباحًا، بجانب النافورة. ستوزّع البلدية على جميع المشاركين قفازات وأكياسًا. في نهاية التنظيف سيحصل الجميع على مشروبات باردة وفواكه. من يريد المشاركة عليه أن يسجّل مسبقًا في المركز الجماهيري.<br>ما هدف الإعلان؟", "ru": "Прочитайте отрывок и ответьте на вопрос.<br>Объявление для жителей: в ближайший вторник в городском саду на улице Ха-Зайт пройдёт большая уборка. Встреча начнётся в 9:00 утра у фонтана. Муниципалитет раздаст всем участникам перчатки и мешки. В конце уборки все получат холодные напитки и фрукты. Кто хочет участвовать, должен заранее записаться в общинном центре.<br>Какова цель объявления?", "en": "Read the passage and answer the question.<br>Notice to residents: this coming Tuesday there will be a big clean-up in the public garden on HaZayit Street. The meeting starts at 9:00 a.m., next to the fountain. The municipality will give all participants gloves and bags. At the end of the clean-up everyone will get cold drinks and fruit. Anyone who wants to take part must register in advance at the community center.<br>What is the purpose of the notice?"},[{"he": "לספר על מזרקה חדשה שנבנתה בגן הציבורי", "ar": "أن يخبر عن نافورة جديدة وجميلة بُنيت في الحديقة العامة", "ru": "рассказать о новом красивом фонтане, построенном в саду", "en": "to tell about a new fountain that was built in the public garden"}, {"he": "להזמין תושבים להשתתף בניקיון הגן", "ar": "أن يدعو السكان إلى المشاركة في تنظيف الحديقة", "ru": "пригласить жителей участвовать в уборке сада", "en": "to invite residents to take part in cleaning the garden"}, {"he": "להודיע שהגן ייסגר ביום שלישי", "ar": "أن يُعلن أن الحديقة ستُغلق يوم الثلاثاء", "ru": "сообщить, что сад закроют во вторник", "en": "to announce that the garden will close on Tuesday"}, {"he": "להודיע על מכירת פירות בגן", "ar": "أن يُعلن عن بيع فواكه في الحديقة", "ru": "сообщить о продаже фруктов в саду", "en": "to announce a fruit sale in the garden"}],1,{"he": "חשבו מה הכותבים רוצים שהקוראים יעשו.", "ar": "فكّروا ماذا يريد الكاتبون أن يفعل القرّاء.", "ru": "Подумайте, что авторы хотят, чтобы сделали читатели.", "en": "Think about what the writers want the readers to do."},{"he": "ההודעה מספרת על ניקיון בגן, ומסבירה איך נרשמים אליו. מי שכותב איך להצטרף רוצה שאנשים יבואו. לכן המטרה היא להזמין את התושבים.", "ar": "الإعلان يخبر عن تنظيف في الحديقة، ويشرح كيف يسجّلون له. من يكتب كيف ينضمّون يريد أن يأتي الناس. لذلك الهدف هو دعوة السكان.", "ru": "Объявление сообщает об уборке в саду и объясняет, как на неё записаться. Кто пишет, как присоединиться, хочет, чтобы люди пришли. Поэтому цель - пригласить жителей.", "en": "The notice tells about a clean-up and explains how to register. Whoever explains how to join wants people to come. So the purpose is to invite the residents."},null,[{"he": "המזרקה מוזכרת רק כמקום המפגש, לא כמשהו חדש.", "ar": "النافورة مذكورة فقط كمكان اللقاء، لا كشيء جديد.", "ru": "Фонтан упомянут только как место встречи, а не как что-то новое.", "en": "The fountain is mentioned only as the meeting place, not as something new."}, null, {"he": "הגן לא ייסגר; דווקא בו יתקיים הניקיון.", "ar": "الحديقة لن تُغلق؛ بل فيها سيُقام التنظيف.", "ru": "Сад не закроют; наоборот, в нём пройдёт уборка.", "en": "The garden will not close; the clean-up takes place there."}, {"he": "את הפירות מקבלים המשתתפים בסוף, ואין מכירה.", "ar": "المشاركون يحصلون على الفواكه في النهاية، ولا يوجد بيع.", "ru": "Фрукты участники получают в конце, никакой продажи нет.", "en": "The participants get the fruit at the end; nothing is sold."}]),
   Q("rd-1-04",{"he": "קראו את הקטע וענו על השאלה.<br>סמיר בן 16. בכל יום שישי הוא עובד בחנות פרחים קטנה בעיר. בבוקר הוא מסדר את הפרחים בדליים עם מים. אחר כך הוא עוזר ללקוחות לבחור זר. סמיר אוהב את העבודה, כי היא שקטה והוא לומד בה דברים חדשים. בעתיד הוא רוצה לפתוח חנות משלו.<br>באיזה יום עובד סמיר בחנות?", "ar": "اقرأوا القطعة وأجيبوا عن السؤال.<br>سمير عمره 16 سنة. في كل يوم جمعة يعمل في محل زهور صغير في المدينة. في الصباح يرتّب الزهور في دلاء فيها ماء. بعد ذلك يساعد الزبائن على اختيار باقة. سمير يحبّ العمل، لأنه هادئ ويتعلّم فيه أشياء جديدة. في المستقبل يريد أن يفتح محلًا خاصًا به.<br>في أي يوم يعمل سمير في المحل؟", "ru": "Прочитайте отрывок и ответьте на вопрос.<br>Самиру 16 лет. Каждую пятницу он работает в маленьком цветочном магазине в городе. Утром он расставляет цветы в вёдра с водой. Потом он помогает покупателям выбрать букет. Самир любит эту работу, потому что она спокойная и он узнаёт на ней новое. В будущем он хочет открыть свой магазин.<br>В какой день Самир работает в магазине?", "en": "Read the passage and answer the question.<br>Samir is 16. Every Friday he works in a small flower shop in town. In the morning he arranges the flowers in buckets of water. After that he helps customers choose a bouquet. Samir likes the job because it is quiet and he learns new things there. In the future he wants to open his own shop.<br>On which day does Samir work in the shop?"},[{"he": "ביום שבת", "ar": "يوم السبت", "ru": "в субботу", "en": "on Saturday"}, {"he": "ביום ראשון אחרי הלימודים", "ar": "يوم الأحد بعد الدراسة", "ru": "в воскресенье после уроков", "en": "on Sunday after school"}, {"he": "בכל יום אחרי בית הספר", "ar": "كل يوم بعد المدرسة", "ru": "каждый день после школы", "en": "every day after school"}, {"he": "ביום שישי", "ar": "يوم الجمعة", "ru": "в пятницу", "en": "on Friday"}],3,{"he": "חפשו את המשפט השני בקטע.", "ar": "ابحثوا عن الجملة الثانية في القطعة.", "ru": "Найдите второе предложение отрывка.", "en": "Look at the second sentence of the passage."},{"he": "במשפט השני כתוב: בכל יום שישי הוא עובד בחנות פרחים. המילים בכל יום שישי מלמדות שזה קורה פעם בשבוע, באותו יום.", "ar": "في الجملة الثانية مكتوب: في كل يوم جمعة يعمل في محل زهور. عبارة في كل يوم جمعة تدل على أن ذلك يحدث مرة في الأسبوع، في اليوم نفسه.", "ru": "Во втором предложении написано: каждую пятницу он работает в цветочном магазине. Слова «каждую пятницу» показывают, что это бывает раз в неделю, в один и тот же день.", "en": "The second sentence says: every Friday he works in a flower shop. The words every Friday show it happens once a week, on the same day."},null,[{"he": "שבת אינה מוזכרת בקטע.", "ar": "السبت غير مذكور في القطعة.", "ru": "Суббота в отрывке не упоминается.", "en": "Saturday is not mentioned in the passage."}, {"he": "יום ראשון אינו מוזכר בקטע.", "ar": "يوم الأحد غير مذكور في القطعة.", "ru": "Воскресенье в отрывке не упоминается.", "en": "Sunday is not mentioned in the passage."}, {"he": "סמיר אינו עובד בכל יום, אלא פעם בשבוע.", "ar": "سمير لا يعمل كل يوم، بل مرة في الأسبوع.", "ru": "Самир работает не каждый день, а раз в неделю.", "en": "Samir does not work every day, only once a week."}, null]),
   Q("rd-1-05",{"he": "קראו את הקטע וענו על השאלה.<br>סמיר בן 16. בכל יום שישי הוא עובד בחנות פרחים קטנה בעיר. בבוקר הוא מסדר את הפרחים בדליים עם מים. אחר כך הוא עוזר ללקוחות לבחור זר. סמיר אוהב את העבודה, כי היא שקטה והוא לומד בה דברים חדשים. בעתיד הוא רוצה לפתוח חנות משלו.<br>מה עושה סמיר בחנות בבוקר?", "ar": "اقرأوا القطعة وأجيبوا عن السؤال.<br>سمير عمره 16 سنة. في كل يوم جمعة يعمل في محل زهور صغير في المدينة. في الصباح يرتّب الزهور في دلاء فيها ماء. بعد ذلك يساعد الزبائن على اختيار باقة. سمير يحبّ العمل، لأنه هادئ ويتعلّم فيه أشياء جديدة. في المستقبل يريد أن يفتح محلًا خاصًا به.<br>ماذا يفعل سمير في المحل في الصباح؟", "ru": "Прочитайте отрывок и ответьте на вопрос.<br>Самиру 16 лет. Каждую пятницу он работает в маленьком цветочном магазине в городе. Утром он расставляет цветы в вёдра с водой. Потом он помогает покупателям выбрать букет. Самир любит эту работу, потому что она спокойная и он узнаёт на ней новое. В будущем он хочет открыть свой магазин.<br>Что Самир делает в магазине утром?", "en": "Read the passage and answer the question.<br>Samir is 16. Every Friday he works in a small flower shop in town. In the morning he arranges the flowers in buckets of water. After that he helps customers choose a bouquet. Samir likes the job because it is quiet and he learns new things there. In the future he wants to open his own shop.<br>What does Samir do in the shop in the morning?"},[{"he": "מנקה את הרצפה ואת החלונות של החנות", "ar": "ينظّف أرضية المحل ونوافذه", "ru": "моет пол и окна магазина", "en": "cleans the floor and the windows of the shop"}, {"he": "מסדר את הפרחים בדליים", "ar": "يرتّب الزهور في الدلاء", "ru": "расставляет цветы в вёдра", "en": "arranges the flowers in buckets"}, {"he": "עוזר ללקוחות לבחור זר", "ar": "يساعد الزبائن على اختيار باقة", "ru": "помогает покупателям выбрать букет", "en": "helps customers choose a bouquet"}, {"he": "קונה פרחים בשוק", "ar": "يشتري زهورًا من السوق", "ru": "покупает цветы на рынке", "en": "buys flowers at the market"}],1,{"he": "שימו לב למילים שמסמנות את סדר הזמן בקטע.", "ar": "انتبهوا إلى الكلمات التي تدل على ترتيب الزمن في القطعة.", "ru": "Обратите внимание на слова, которые показывают порядок времени.", "en": "Pay attention to the words that show the order of time in the passage."},{"he": "כתוב: בבוקר הוא מסדר את הפרחים בדליים עם מים. רק אחר כך הוא עוזר ללקוחות. המילים אחר כך מסמנות שזה קורה מאוחר יותר.", "ar": "مكتوب: في الصباح يرتّب الزهور في دلاء فيها ماء. بعد ذلك فقط يساعد الزبائن. عبارة بعد ذلك تدل على أن هذا يحدث لاحقًا.", "ru": "Написано: утром он расставляет цветы в вёдра с водой. Только потом он помогает покупателям. Слово «потом» показывает, что это происходит позже.", "en": "It says: in the morning he arranges the flowers in buckets of water. Only after that does he help customers. The words after that show it happens later."},null,[{"he": "ניקיון החנות אינו מוזכר בקטע.", "ar": "تنظيف المحل غير مذكور في القطعة.", "ru": "Уборка магазина в отрывке не упоминается.", "en": "Cleaning the shop is not mentioned in the passage."}, null, {"he": "את זה הוא עושה אחר כך, ולא בבוקר.", "ar": "هذا يفعله بعد ذلك، لا في الصباح.", "ru": "Это он делает потом, а не утром.", "en": "He does this later, not in the morning."}, {"he": "קנייה בשוק אינה מוזכרת בקטע.", "ar": "الشراء من السوق غير مذكور في القطعة.", "ru": "Покупка на рынке в отрывке не упоминается.", "en": "Buying at the market is not mentioned in the passage."}]),
   Q("rd-1-06",{"he": "קראו את הקטע וענו על השאלה.<br>סמיר בן 16. בכל יום שישי הוא עובד בחנות פרחים קטנה בעיר. בבוקר הוא מסדר את הפרחים בדליים עם מים. אחר כך הוא עוזר ללקוחות לבחור זר. סמיר אוהב את העבודה, כי היא שקטה והוא לומד בה דברים חדשים. בעתיד הוא רוצה לפתוח חנות משלו.<br>למה סמיר אוהב את העבודה?", "ar": "اقرأوا القطعة وأجيبوا عن السؤال.<br>سمير عمره 16 سنة. في كل يوم جمعة يعمل في محل زهور صغير في المدينة. في الصباح يرتّب الزهور في دلاء فيها ماء. بعد ذلك يساعد الزبائن على اختيار باقة. سمير يحبّ العمل، لأنه هادئ ويتعلّم فيه أشياء جديدة. في المستقبل يريد أن يفتح محلًا خاصًا به.<br>لماذا يحبّ سمير العمل؟", "ru": "Прочитайте отрывок и ответьте на вопрос.<br>Самиру 16 лет. Каждую пятницу он работает в маленьком цветочном магазине в городе. Утром он расставляет цветы в вёдра с водой. Потом он помогает покупателям выбрать букет. Самир любит эту работу, потому что она спокойная и он узнаёт на ней новое. В будущем он хочет открыть свой магазин.<br>Почему Самир любит эту работу?", "en": "Read the passage and answer the question.<br>Samir is 16. Every Friday he works in a small flower shop in town. In the morning he arranges the flowers in buckets of water. After that he helps customers choose a bouquet. Samir likes the job because it is quiet and he learns new things there. In the future he wants to open his own shop.<br>Why does Samir like the job?"},[{"he": "כי היא שקטה והוא לומד בה", "ar": "لأنه هادئ ويتعلّم فيه", "ru": "потому что она спокойная и он учится", "en": "because it is quiet and he learns there"}, {"he": "כי היא קרובה מאוד לבית שלו", "ar": "لأنه قريب جدًا من بيته", "ru": "потому что магазин очень близко к дому", "en": "because it is very close to his home"}, {"he": "כי החברים שלו עובדים איתו בחנות", "ar": "لأن أصدقاءه يعملون معه في المحل", "ru": "потому что его друзья работают с ним в магазине", "en": "because his friends work with him in the shop"}, {"he": "כי הוא מקבל בה פרחים במתנה", "ar": "لأنه يحصل فيه على زهور هدية", "ru": "потому что ему дарят там цветы", "en": "because he gets flowers there as a gift"}],0,{"he": "חפשו מילה שפותחת הסבר במשפט על העבודה.", "ar": "ابحثوا عن كلمة تفتح تفسيرًا في الجملة عن العمل.", "ru": "Найдите слово, которое начинает объяснение в предложении о работе.", "en": "Look for a word that opens an explanation in the sentence about the job."},{"he": "כתוב: סמיר אוהב את העבודה, כי היא שקטה והוא לומד בה דברים חדשים. המילה כי פותחת את הסיבה. שאר התשובות אינן מוזכרות בקטע.", "ar": "مكتوب: سمير يحبّ العمل، لأنه هادئ ويتعلّم فيه أشياء جديدة. كلمة لأن تفتح السبب. باقي الإجابات غير مذكورة في القطعة.", "ru": "Написано: Самир любит работу, потому что она спокойная и он узнаёт новое. Слова «потому что» открывают причину. Остальные ответы в отрывке не упоминаются.", "en": "It says: Samir likes the job because it is quiet and he learns new things. The word because opens the reason. The other answers are not in the passage."},null,[null, {"he": "המרחק מהבית אינו מוזכר בקטע.", "ar": "المسافة من البيت غير مذكورة في القطعة.", "ru": "Расстояние от дома в отрывке не упоминается.", "en": "The distance from home is not mentioned in the passage."}, {"he": "חברים של סמיר אינם מוזכרים בקטע.", "ar": "أصدقاء سمير غير مذكورين في القطعة.", "ru": "Друзья Самира в отрывке не упоминаются.", "en": "Samir's friends are not mentioned in the passage."}, {"he": "מתנות אינן מוזכרות בקטע.", "ar": "الهدايا غير مذكورة في القطعة.", "ru": "Подарки в отрывке не упоминаются.", "en": "Gifts are not mentioned in the passage."}])
