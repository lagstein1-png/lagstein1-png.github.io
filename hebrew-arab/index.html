Q("ha-lexicon-3-1",{"he": "בערך המילוני \"עמוד\" מופיעות המשמעויות: (1) דף בספר, (2) מבנה גבוה ותומך. איזו משמעות מתאימה ל\"עמוד הגדר נשבר\"?", "ar": "في مدخل «עמוד» معنيان: (1) صفحة كتاب، (2) عمود مرتفع داعم. أي معنى يناسب «انكسر عمود السياج»؟", "ru": "У слова «עמוד» два значения: (1) страница книги, (2) высокая опора. Какое подходит к «Столб забора сломался»?", "en": "The entry \"עמוד\" lists (1) a page in a book and (2) a tall support. Which fits \"The fence post broke\"?"},[{"he": "דף בספר", "ar": "صفحة في كتاب", "ru": "страница книги", "en": "a page in a book"}, {"he": "מבנה תומך", "ar": "عمود داعم", "ru": "опора", "en": "a supporting post"}, {"he": "כותרת בספר", "ar": "عنوان في كتاب", "ru": "заголовок книги", "en": "a book heading"}, {"he": "פועל מן השורש ע־מ־ד", "ar": "فعل من الجذر ע־מ־ד", "ru": "глагол от корня ע־מ־ד", "en": "a verb from root ע־מ־ד"}],1,{"he": "בדקו מה יכול להישבר כחלק מגדר.", "ar": "افحصوا ما الذي يمكن أن ينكسر بوصفه جزءًا من السياج.", "ru": "Подумайте, что может сломаться как часть забора.", "en": "Consider what can break as part of a fence."},{"he": "\"עמוד הגדר\" הוא חלק תומך בגדר, ולא דף. למשל: \"עמוד החשמל ניצב ליד הכביש\".", "ar": "«עמود הגדר» جزء داعم للسياج لا صفحة. مثلًا: «يقف عمود الكهرباء قرب الطريق».", "ru": "«עמוד הגדר» - опорная часть забора, не страница. Например: «Столб электросети стоит у дороги».", "en": "\"עמוד הגדר\" is a supporting part of a fence, not a page. Compare \"The utility pole stands by the road.\""},null,[{"he": "דף שייך לספר, לא למבנה של גדר.", "ar": "الصفحة جزء من كتاب لا من السياج.", "ru": "Страница принадлежит книге, не забору.", "en": "A page belongs to a book, not a fence."}, null, {"he": "משמעות זו אינה אחת משתי ההגדרות שניתנו לערך.", "ar": "هذا المعنى ليس من التعريفين المعطيين.", "ru": "Такого значения нет среди двух данных определений.", "en": "This is not one of the two definitions supplied."}, {"he": "המילה במשפט היא שם עצם המציין חלק מן הגדר.", "ar": "الكلمة في الجملة اسم يدل على جزء من السياج.", "ru": "В предложении это существительное, обозначающее часть забора.", "en": "The word is a noun naming part of the fence."}]),
Q("ha-lexicon-3-2",{"he": "איזה משפט משתמש בביטוי \"ירד לטמיון\" במשמעותו המקובלת?", "ar": "أي جملة تستعمل التعبير «ירד לטמיון» بمعناه الشائع (ضاع هباءً)؟", "ru": "В каком предложении «ירד לטמיון» употреблено в обычном значении «пропало даром»?", "en": "Which sentence uses \"ירד לטמיון\" in its usual meaning, \"went to waste\"?"},[{"he": "המאמץ ירד לטמיון כי הקובץ נמחק.", "ar": "ذهب الجهد هباءً لأن الملف حُذف.", "ru": "Усилия пропали даром, потому что файл удалили.", "en": "The effort went to waste when the file was deleted."}, {"he": "הילד ירד לטמיון במדרגות.", "ar": "نزل الطفل «לטמיון» على الدرج.", "ru": "Ребёнок спустился «לטמיון» по лестнице.", "en": "The child went down \"לטמיון\" on the stairs."}, {"he": "הגשם ירד לטמיון כל הלילה.", "ar": "هطل المطر «לטמיון» طوال الليل.", "ru": "Дождь шёл «לטמיון» всю ночь.", "en": "The rain fell \"לטמיון\" all night."}, {"he": "המורה ירדה לטמיון מן האוטובוס.", "ar": "نزلت المعلمة «לטמיון» من الحافلة.", "ru": "Учительница вышла «לטמיון» из автобуса.", "en": "The teacher got off the bus \"לטמיון\"."}],0,{"he": "ביטוי קבוע אינו רק צירוף של המשמעויות המילוליות שלו.", "ar": "التعبير الثابت ليس مجرد مجموع المعاني الحرفية لكلماته.", "ru": "Устойчивое выражение - не просто сумма буквальных значений слов.", "en": "An idiom is not merely the literal meanings of its words."},{"he": "\"ירד לטמיון\" פירושו אבד ללא תועלת. למשל: \"כל התכנון ירד לטמיון לאחר ביטול האירוע\".", "ar": "«ירד לטמיון» تعني ضاع بلا فائدة. مثلًا: «ضاع التخطيط كله بعد إلغاء الحدث».", "ru": "«ירד לטמיון» означает «пропало даром». Например: «Все планы пошли прахом после отмены события».", "en": "\"ירד לטמיון\" means \"went to waste.\" For example: \"All the planning went to waste after the event was canceled.\""},null,[null, {"he": "ירידה במדרגות היא תנועה ממשית, ולא אובדן של מאמץ או תוכנית.", "ar": "النزول على الدرج حركة فعلية لا ضياع جهد أو خطة.", "ru": "Спуск по лестнице - буквальное движение, не потеря усилий или плана.", "en": "Going down stairs is literal movement, not wasted effort."}, {"he": "לגשם יש פועל \"ירד\", אך צירוף הביטוי כאן אינו מתאים למשמעותו.", "ar": "الفعل «ירד» يناسب المطر، لكن التعبير كله لا يناسب المعنى.", "ru": "Глагол «ירד» подходит к дождю, но идиома целиком здесь неуместна.", "en": "The verb \"ירד\" fits rain, but the full idiom does not fit here."}, {"he": "יציאה מאוטובוס היא ירידה ממשית, לא אובדן.", "ar": "النزول من الحافلة حركة فعلية لا ضياع.", "ru": "Выход из автобуса - буквальное движение, не потеря.", "en": "Getting off a bus is literal movement, not waste."}]),
Q("ha-lexicon-3-3",{"he": "במילון כתוב: \"שקע (פועל): ירד למטה; שקע (שם עצם): חיבור לחשמל בקיר\". מה משמעות \"שקע\" במשפט \"חיברתי את המטען לשקע\"?", "ar": "في القاموس: «שקע» فعل بمعنى غاص، و«שקע» اسم بمعنى مقبس كهربائي في الجدار. ما معناه في «وصلت الشاحن بالمقبس»؟", "ru": "Словарь: «שקע» как глагол - опустился; как существительное - розетка. Что оно значит в «Я подключил зарядку к розетке»?", "en": "The dictionary gives \"שקע\" as a verb meaning \"sank\" and a noun meaning \"wall outlet.\" What does it mean in \"I plugged the charger into the שקע\"?"},[{"he": "ירד למטה", "ar": "نزل إلى الأسفل", "ru": "опустился", "en": "went down"}, {"he": "שקע בים", "ar": "غاص في البحر", "ru": "затонул в море", "en": "sank at sea"}, {"he": "חיבור לחשמל בקיר", "ar": "مقبس كهربائي في الجدار", "ru": "настенная розетка", "en": "a wall outlet"}, {"he": "נעשה שקוע במחשבות", "ar": "انغمس في الأفكار", "ru": "погрузился в мысли", "en": "became lost in thought"}],2,{"he": "היעזרו במילה \"מטען\" ובמילת היחס \"ל\".", "ar": "استعينوا بكلمة «شاحن» وحرف الجر «ל».", "ru": "Ориентируйтесь на слова «מטען» и предлог «ל».", "en": "Use the word \"charger\" and the preposition \"ל\" as clues."},{"he": "במשפט \"שקע\" הוא שם עצם המציין נקודת חיבור לחשמל. למשל: \"המנורה מחוברת לשקע שבקיר\".", "ar": "في الجملة «שקע» اسم يدل على نقطة توصيل الكهرباء. مثلًا: «المصباح موصول بمقبس الجدار».", "ru": "Здесь «שקע» - существительное, обозначающее электрическую розетку. Например: «Лампа подключена к розетке в стене».", "en": "Here \"שקע\" is a noun meaning an electrical outlet. For example: \"The lamp is plugged into the wall outlet.\""},null,[{"he": "זו משמעות פועלית שאינה מתאימה לחיבור מטען.", "ar": "هذا معنى فعلي لا يناسب توصيل الشاحن.", "ru": "Это значение глагола, не подходящее к подключению зарядки.", "en": "That is a verb meaning and does not fit plugging in a charger."}, {"he": "המשפט אינו עוסק בים או בטביעה.", "ar": "لا تتحدث الجملة عن البحر أو الغرق.", "ru": "Предложение не о море или затоплении.", "en": "The sentence is not about the sea or sinking."}, null, {"he": "זו משמעות ציורית של פועל, ולא שם של אביזר חשמלי.", "ar": "هذا معنى مجازي لفعل، لا اسم جهاز كهربائي.", "ru": "Это переносное значение глагола, не название электрического устройства.", "en": "That is a figurative verb meaning, not the name of an electrical fitting."}]),
Q("lx-3-01",{"he": "באיזה משפט המילה \"מחזור\" פירושה קבוצת תלמידים שסיימו את הלימודים יחד?", "ar": "في أي جملة تعني كلمة «מחזור» مجموعة طلاب أنهوا الدراسة معًا (دفعة)؟", "ru": "В каком предложении «מחזור» значит «выпуск» - группу учеников, окончивших учёбу вместе?", "en": "In which sentence does \"מחזור\" mean a class of students who graduated together?"},[{"he": "בחג קראנו תפילות מתוך המחזור.", "ar": "בחג קראנו תפילות מתוך המחזור.", "ru": "בחג קראנו תפילות מתוך המחזור.", "en": "בחג קראנו תפילות מתוך המחזור."}, {"he": "מחזור המים בטבע כולל אידוי וגשם.", "ar": "מחזור המים בטבע כולל אידוי וגשם.", "ru": "מחזור המים בטבע כולל אידוי וגשם.", "en": "מחזור המים בטבע כולל אידוי וגשם."}, {"he": "המחזור שלנו נפגש עשר שנים אחרי סוף התיכון.", "ar": "המחזור שלנו נפגש עשר שנים אחרי סוף התיכון.", "ru": "המחזור שלנו נפגש עשר שנים אחרי סוף התיכון.", "en": "המחזור שלנו נפגש עשר שנים אחרי סוף התיכון."}, {"he": "שמנו את כל הבקבוקים הריקים בפח המחזור שליד הבית.", "ar": "שמנו את כל הבקבוקים הריקים בפח המחזור שליד הבית.", "ru": "שמנו את כל הבקבוקים הריקים בפח המחזור שליד הבית.", "en": "שמנו את כל הבקבוקים הריקים בפח המחזור שליד הבית."}],2,{"he": "בדקו בכל משפט אילו מילים שמסביב ל\"מחזור\" עוזרות להבין את משמעותה.", "ar": "افحصوا في كل جملة أي كلمات حول «מחזור» تساعد على فهم معناها.", "ru": "Проверьте в каждом предложении, какие слова вокруг «מחזור» помогают понять его значение.", "en": "In each sentence, check which words around \"מחזור\" help you understand its meaning."},{"he": "למילה \"מחזור\" יש כמה משמעויות. במשפט הנכון היא קבוצת בוגרים שסיימו את התיכון באותה שנה. המילים \"נפגש\" ו\"סוף התיכון\" מראות שמדובר באנשים.", "ar": "لكلمة «מחזור» عدّة معانٍ. في الجملة الصحيحة هي دفعة خرّيجين أنهوا الثانوية في السنة نفسها. الكلمتان «נפגש» و«סוף התיכון» تدلّان على أنّ المقصود أشخاص.", "ru": "У слова «מחזור» несколько значений. В правильном предложении это выпуск - те, кто окончил школу в один год. Слова «נפגש» и «סוף התיכון» показывают, что речь о людях.", "en": "\"מחזור\" has several meanings. In the right sentence it is a graduating class that finished high school in the same year. The words \"נפגש\" and \"סוף התיכון\" show it refers to people."},null,[{"he": "כאן \"מחזור\" הוא ספר תפילות לחגים.", "ar": "هنا «מחזור» كتاب صلوات للأعياد.", "ru": "Здесь «מחזור» - праздничный молитвенник.", "en": "Here \"מחזור\" is a holiday prayer book."}, {"he": "כאן \"מחזור\" פירושו תהליך שחוזר על עצמו שוב ושוב.", "ar": "هنا «מחזור» تعني دورة تتكرّر مرّة بعد مرّة.", "ru": "Здесь «מחזור» значит круговорот, процесс, который повторяется.", "en": "Here \"מחזור\" means a cycle that repeats again and again."}, null, {"he": "כאן זו מילה אחרת, \"מִחְזוּר\": שימוש חוזר בחומרים.", "ar": "هنا كلمة أخرى، «מִחְזוּר»: إعادة تدوير المواد.", "ru": "Здесь другое слово, «מִחְזוּר»: переработка материалов.", "en": "Here it is a different word, \"מִחְזוּר\": recycling materials."}]),
Q("lx-3-02",{"he": "באיזה משפט הביטוי \"על קצה המזלג\" משמש במשמעותו הנכונה?", "ar": "في أي جملة يُستعمل التعبير «על קצה המזלג» بمعناه الصحيح؟", "ru": "В каком предложении выражение «על קצה המזלג» употреблено в правильном значении?", "en": "In which sentence is \"על קצה המזלג\" used in its correct meaning?"},[{"he": "בשיעור הראשון המורה הציגה את הנושא רק על קצה המזלג.", "ar": "בשיעור הראשון המורה הציגה את הנושא רק על קצה המזלג.", "ru": "בשיעור הראשון המורה הציגה את הנושא רק על קצה המזלג.", "en": "בשיעור הראשון המורה הציגה את הנושא רק על קצה המזלג."}, {"he": "אכלתי את העוגה על קצה המזלג כי הייתי רעב מאוד.", "ar": "אכלתי את העוגה על קצה המזלג כי הייתי רעב מאוד.", "ru": "אכלתי את העוגה על קצה המזלג כי הייתי רעב מאוד.", "en": "אכלתי את העוגה על קצה המזלג כי הייתי רעב מאוד."}, {"he": "הוא הסביר על קצה המזלג במשך שלוש שעות, עם כל הפרטים הקטנים.", "ar": "הוא הסביר על קצה המזלג במשך שלוש שעות, עם כל הפרטים הקטנים.", "ru": "הוא הסביר על קצה המזלג במשך שלוש שעות, עם כל הפרטים הקטנים.", "en": "הוא הסביר על קצה המזלג במשך שלוש שעות, עם כל הפרטים הקטנים."}, {"he": "הספר נפל על קצה המזלג.", "ar": "הספר נפל על קצה המזלג.", "ru": "הספר נפל על קצה המזלג.", "en": "הספר נפל על קצה המזלג."}],0,{"he": "הביטוי מתאר כמה הרבה מסבירים על נושא.", "ar": "التعبير يصف كم نشرح عن موضوع ما.", "ru": "Выражение описывает, насколько подробно рассказывают о теме.", "en": "The expression describes how much is explained about a topic."},{"he": "\"על קצה המזלג\" פירושו בקצרה, רק מעט. בשיעור הראשון המורה נתנה רק \"טעימה\" קטנה מהנושא. אפשר להבין שבהמשך היא תרחיב.", "ar": "«על קצה המזלג» معناه باختصار، أي القليل فقط. في الحصّة الأولى قدّمت المعلّمة «تذوّقًا» صغيرًا للموضوع. ونفهم أنها ستتوسّع لاحقًا.", "ru": "«על קצה המזלג» значит «вкратце, совсем немного». На первом уроке учительница дала лишь маленькую «пробу» темы. Можно понять, что потом она расскажет подробнее.", "en": "\"על קצה המזלג\" means briefly, just a little. In the first lesson the teacher gave only a small \"taste\" of the topic. We can tell she will expand later."},null,[null, {"he": "הביטוי אינו קשור לאכילה. כאן הוא נקרא כפשוטו.", "ar": "التعبير لا علاقة له بالأكل، وهنا فُهم حرفيًا.", "ru": "Выражение не связано с едой; здесь его поняли буквально.", "en": "The expression is not about eating; here it is read literally."}, {"he": "\"על קצה המזלג\" פירושו בקצרה, וזה סותר הסבר של שלוש שעות.", "ar": "«על קצה המזלג» معناه باختصار، وهذا يناقض شرحًا لثلاث ساعات.", "ru": "«על קצה המזלג» значит «вкратце», а это противоречит трёхчасовому объяснению.", "en": "\"על קצה המזלג\" means briefly, which contradicts a three-hour explanation."}, {"he": "המשפט משתמש במילים כפשוטן, ואין לו משמעות הגיונית.", "ar": "الجملة تستعمل الكلمات حرفيًا، وليس لها معنى منطقي.", "ru": "Слова здесь взяты буквально, и смысла у предложения нет.", "en": "The sentence uses the words literally and makes no sense."}]),
Q("lx-3-03",{"he": "\"האוויר בחדר היה מחניק, ולכן פתחנו את כל החלונות.\" מה אפשר להסיק על האוויר בחדר?", "ar": "«האוויר בחדר היה מחניק, ולכן פתחנו את כל החלונות». ماذا نستنتج عن الهواء في الغرفة؟", "ru": "«האוויר בחדר היה מחניק, ולכן פתחנו את כל החלונות». Что можно понять о воздухе в комнате?", "en": "\"האוויר בחדר היה מחניק, ולכן פתחנו את כל החלונות.\" What can we infer about the air in the room?"},[{"he": "הוא היה קר מאוד", "ar": "كان باردًا جدًا", "ru": "он был очень холодным", "en": "it was very cold"}, {"he": "הוא היה שקט ושליו", "ar": "كان هادئًا ومريحًا", "ru": "он был тихим и спокойным", "en": "it was quiet and calm"}, {"he": "הוא היה נקי ומלא ריח של פרחים", "ar": "كان نظيفًا ومليئًا برائحة الأزهار", "ru": "он был чистым и полным запаха цветов", "en": "it was clean and full of the scent of flowers"}, {"he": "קשה היה לנשום בו", "ar": "كان التنفّس فيه صعبًا", "ru": "в нём было трудно дышать", "en": "it was hard to breathe"}],3,{"he": "המילה \"ולכן\" מראה מה הייתה התוצאה. חשבו מה גרם לה.", "ar": "كلمة «ולכן» تبيّن النتيجة. فكّروا: ما الذي سبّبها؟", "ru": "Слово «ולכן» показывает результат. Подумайте, что его вызвало.", "en": "The word \"ולכן\" shows the result. Think about what caused it."},{"he": "פתחנו חלונות כדי להכניס אוויר. מכאן שהאוויר בחדר היה כבד, וקשה היה לנשום. \"מחניק\" בא מן השורש ח־נ־ק.", "ar": "فتحنا النوافذ لإدخال الهواء. إذن كان الهواء في الغرفة ثقيلًا، وكان التنفّس صعبًا. «מחניק» من الجذر ח־נ־ק، ومعناها خانق.", "ru": "Мы открыли окна, чтобы впустить воздух. Значит, воздух был тяжёлым и дышать было трудно. «מחניק» (душный) - от корня ח־נ־ק.", "en": "We opened windows to let air in. So the air was heavy and hard to breathe. \"מחניק\" (stifling) comes from the root ח־נ־ק."},null,[{"he": "אם היה קר מאוד, לא היינו פותחים את כל החלונות.", "ar": "لو كان الجوّ باردًا جدًا لما فتحنا كل النوافذ.", "ru": "Если бы было очень холодно, мы бы не открыли все окна.", "en": "If it were very cold, we would not open all the windows."}, {"he": "שקט אינו סיבה לפתוח חלונות.", "ar": "الهدوء ليس سببًا لفتح النوافذ.", "ru": "Тишина - не причина открывать окна.", "en": "Quiet is no reason to open windows."}, {"he": "אוויר נקי וריחני אינו סיבה לפתוח את כל החלונות.", "ar": "الهواء النظيف والعطِر ليس سببًا لفتح كل النوافذ.", "ru": "Чистый, ароматный воздух - не причина открывать все окна.", "en": "Clean, fragrant air is no reason to open every window."}, null]),
Q("lx-3-04",{"he": "המילים \"הציץ\", \"בהה\" ו\"העיף מבט\" קרובות במשמעותן. איזו מילה מתאימה למשפט: \"הוא ___ בתקרה שעה ארוכה, בלי לזוז\"?", "ar": "الكلمات «הציץ» و«בהה» و«העיף מבט» متقاربة في المعنى. أي كلمة تناسب الجملة: «הוא ___ בתקרה שעה ארוכה, בלי לזוז»؟", "ru": "Слова «הציץ», «בהה» и «העיף מבט» близки по смыслу. Какое слово подходит к фразе «הוא ___ בתקרה שעה ארוכה, בלי לזוז»?", "en": "The words \"הציץ\", \"בהה\" and \"העיף מבט\" are close in meaning. Which fits \"הוא ___ בתקרה שעה ארוכה, בלי לזוז\"?"},[{"he": "הציץ", "ar": "הציץ", "ru": "הציץ", "en": "הציץ"}, {"he": "בהה", "ar": "בהה", "ru": "בהה", "en": "בהה"}, {"he": "העיף מבט", "ar": "העיף מבט", "ru": "העיף מבט", "en": "העיף מבט"}, {"he": "הבחין לרגע", "ar": "הבחין לרגע", "ru": "הבחין לרגע", "en": "הבחין לרגע"}],1,{"he": "שימו לב לזמן: כמה זמן נמשך המבט?", "ar": "انتبهوا إلى الزمن: كم استمرّت النظرة؟", "ru": "Обратите внимание на время: сколько длился взгляд?", "en": "Pay attention to time: how long did the look last?"},{"he": "\"בהה\" פירושו הסתכל זמן רב, בלי לחשוב על מה שרואים. זה מתאים ל\"שעה ארוכה, בלי לזוז\". \"הציץ\" ו\"העיף מבט\" מתארים מבט קצר.", "ar": "«בהה» معناها حدّق طويلًا دون أن يفكّر فيما يراه. وهذا يناسب «שעה ארוכה, בלי לזוז» (وقتًا طويلًا دون حركة). أما «הציץ» و«העיף מבט» فتصفان نظرة قصيرة.", "ru": "«בהה» значит долго смотреть в одну точку, не думая об увиденном. Это подходит к «שעה ארוכה, בלי לזוז» (долго, не двигаясь). «הציץ» и «העיף מבט» описывают короткий взгляд.", "en": "\"בהה\" means stared for a long time without thinking about what one sees. It fits \"שעה ארוכה, בלי לזוז\" (a long time, without moving). \"הציץ\" and \"העיף מבט\" describe a short look."},null,[{"he": "\"הציץ\" פירושו הסתכל מהר ובחטף. זה סותר \"שעה ארוכה\".", "ar": "«הציץ» معناها نظر نظرة سريعة خاطفة، وهذا يناقض «שעה ארוכה».", "ru": "«הציץ» значит «взглянул мельком», а это противоречит «שעה ארוכה».", "en": "\"הציץ\" means peeked quickly, which contradicts \"שעה ארוכה\"."}, null, {"he": "\"העיף מבט\" פירושו הסתכל לרגע קצר. זה סותר \"שעה ארוכה\".", "ar": "«העיף מבט» معناها ألقى نظرة قصيرة، وهذا يناقض «שעה ארוכה».", "ru": "«העיף מבט» значит «бросил короткий взгляд», это противоречит «שעה ארוכה».", "en": "\"העיף מבט\" means glanced briefly, which contradicts \"שעה ארוכה\"."}, {"he": "\"הבחין לרגע\" מתאר רגע קצר, ולא \"שעה ארוכה\".", "ar": "«הבחין לרגע» تصف لحظة قصيرة، لا «שעה ארוכה».", "ru": "«הבחין לרגע» описывает краткий миг, а не «שעה ארוכה».", "en": "\"הבחין לרגע\" describes a short moment, not \"שעה ארוכה\"."}]),
Q("lx-3-05",{"he": "באיזה משפט יש מילה שהגיעה לעברית מן הערבית?", "ar": "في أي جملة توجد كلمة دخلت العبرية من العربية؟", "ru": "В каком предложении есть слово, пришедшее в иврит из арабского?", "en": "Which sentence contains a word that came into Hebrew from Arabic?"},[{"he": "היה לנו כיף גדול בטיול.", "ar": "היה לנו כיף גדול בטיול.", "ru": "היה לנו כיף גדול בטיול.", "en": "היה לנו כיף גדול בטיול."}, {"he": "קראתי ספר חדש בבית.", "ar": "קראתי ספר חדש בבית.", "ru": "קראתי ספר חדש בבית.", "en": "קראתי ספר חדש בבית."}, {"he": "הלכנו ברגל עד הים.", "ar": "הלכנו ברגל עד הים.", "ru": "הלכנו ברגל עד הים.", "en": "הלכנו ברגל עד הים."}, {"he": "אכלנו ארוחת ערב טעימה עם כל המשפחה.", "ar": "אכלנו ארוחת ערב טעימה עם כל המשפחה.", "ru": "אכלנו ארוחת ערב טעימה עם כל המשפחה.", "en": "אכלנו ארוחת ערב טעימה עם כל המשפחה."}],0,{"he": "חפשו מילה שדוברי ערבית מכירים מהשפה שלהם.", "ar": "ابحثوا عن كلمة يعرفها الناطقون بالعربية من لغتهم.", "ru": "Ищите слово, которое носители арабского узнают из своего языка.", "en": "Look for a word Arabic speakers know from their own language."},{"he": "\"כיף\" הגיעה לעברית מן הערבית, ובעברית פירושה הנאה. עוד מילה כזאת בדיבור היא \"יאללה\". שאר המילים במשפטים האחרים עבריות.", "ar": "«כיף» دخلت العبرية من العربية «كيف»، ومعناها في العبرية متعة. ومن الكلمات المشابهة في الكلام «יאללה» (يلّا). أما كلمات الجمل الأخرى فعبرية.", "ru": "«כיף» пришло в иврит из арабского, на иврите оно значит «удовольствие». Ещё одно такое слово в разговоре - «יאללה». Слова в других предложениях ивритские.", "en": "\"כיף\" came into Hebrew from Arabic; in Hebrew it means fun. Another such word in speech is \"יאללה\". The words in the other sentences are Hebrew."},null,[null, {"he": "כל המילים במשפט הן מילים עבריות.", "ar": "كل كلمات الجملة كلمات عبرية أصيلة.", "ru": "Все слова в этом предложении - исконно ивритские.", "en": "All the words in this sentence are native Hebrew words."}, {"he": "כל המילים במשפט הן מילים עבריות.", "ar": "كل كلمات الجملة كلمات عبرية أصيلة.", "ru": "Все function itemId(tid,lv,i){return tid+"|"+lv+"|"+i}
function itemRec(id){
  if(!state.item[id])state.item[id]={n:0,ok:0};
  return state.item[id];
}
function poolOf(tp,lv){return (tp.L[lv-1]||tp.L[0]||[])}

/* בחירת פריט לתרגול. משקל גבוה לחדש, בינוני לנכשל, נמוך לנשלט. */
function chooseIndex(tid,lv,pool,avoid){
  var cand=[],i,w;
  for(i=0;i<pool.length;i++){
    if(avoid!==undefined&&i===avoid&&pool.length>1)continue;
    var r=state.item[itemId(tid,lv,i)];
    if(!r||!r.n)w=6;                            /* חדש */
    else if(r.ok<r.n)w=1+Math.min(4,r.n-r.ok);  /* נכשל בעבר */
    else w=1;                                   /* נשלט */
    for(var j=0;j<w;j++)cand.push(i);
  }
  if(!cand.length)return 0;
  return pick(cand);
}
/* בחירת פריט למבחן. אחידה, ואינה נוגעת ב-state כלל. */
function pureIndex(pool,avoid){
  var cand=[],i;
  for(i=0;i<pool.length;i++){
    if(avoid!==undefined&&i===avoid&&pool.length>1)continue;
    cand.push(i);
  }
  return cand.length?pick(cand):0;
}


/* ------------------------------------------------------------
   ניקוי להקראה בלבד. המסך אינו משתנה ממנו.

   הגרשיים העבריים משמשים לשני דברים: ראשי תיבות (חוק־יסוד,
   בג״ץ) ומירכאות (״מדינה יהודית״). המנוע מכיר רק את הראשון.
   הכלל שמפריד: בראשי תיבות באה אחרי הגרשיים אות עברית אחת

   יכולה להזיק, מירכאה שנשארה כן.

   המירכאות המסולסלות (“ ”) משמשות כאן לציטוט מונחים בלבד,
   ולכן הן נופלות תמיד. הקו המפריד הופך לפסיק, כדי שהקול
   ייעצר במקום לרוץ הלאה.
   ------------------------------------------------------------ */
function saySpell(x){
  return String(x==null?"":x)
    .replace(/[“”‘’]/g,"")
    .replace(/״/g,function(m,i,str){
      return /^[א-ת](?![א-ת])/.test(str.slice(i+1))?m:"";
    })
    .replace(/\s—\s/g,", ");
}

function O(html,ok,why){return {h:html,ok:!!ok,why:why||""}}

/* בונה שאלה מפריט אחד. סדר האפשרויות מעורבב בכל בנייה, ולכן
   האינדקס ok שבתוכן אינו מגיע למסך לעולם. */
/* קטע הקריאה נשאר בעברית בכל שפת ממשק: המיומנות הנבחנת היא הבנת
   הנקרא בעברית, והבעלים אישר (29.9) שהקטע לא יתורגם. ההוראה והשאלה
   מסביב מתורגמות. רק שאלות ha-read בנויות הוראה<br>קטע<br>שאלה. */
function leadFor(it){
  var s=gl(it.q);
  if(state.lang==="he")return s;
  var he=it.q&&it.q.he;
  if(!he||he.indexOf("<br>")<0||s.indexOf("<br>")<0)return s;
  var a=s.split("<br>"), b=he.split("<br>");
  if(a.length<3||a.length!==b.length)return s;
  return a[0]+"<br>"+b.slice(1,b.length-1).join("<br>")+"<br>"+a[a.length-1];
}
function buildFromItem(it){
  var opts=it.o.map(function(o,i){return O(esc(gl(o)),i===it.ok,it.wrong&&it.wrong[i]?gl(it.wrong[i]):"")});
  var ans=gl(it.o[it.ok]);
  return {
    type:"mcq",
    prompt:t("qPick"),
    lead:leadFor(it),
    fig:figHtml(it.fig),
    opts:shuffle(opts),
    answer:ans,
    /* מה שנאמר אחרי המענה: השאלה, התשובה הנכונה, וההסבר.
       תשובה בלי ההסבר נשמעת כמו עובדה לשינון, וזה בדיוק מה
       שהאפליקציה הזאת קיימת כדי להחליף. */
    say:leadFor(it)+" "+ans+". "+gl(it.ex),
    reveal:it
  };
}
function buildQuestion(tid,lv,avoid,pure){
  var tp=topicOf(tid); if(!tp)return null;
  var pool=poolOf(tp,lv);
  if(!pool.length)return null;
  var idx=pure?pureIndex(pool,avoid):chooseIndex(tid,lv,pool,avoid);
  var it=pool[idx];
  if(!it)return null;
  var q=buildFromItem(it);
  q.tid=tid; q.lv=lv; q.idx=idx; q.id=itemId(tid,lv,idx);
  q.hint=gl(it.hint);
  return q;
}

/* ============================================================
   מבחן מדומה
   ------------------------------------------------------------
   עשרים שאלות מכל הנושאים ומכל הרמות, בחוברת אחת שגוללים בה —
   ולא שאלה־שאלה. מי שקורא לאט צריך לראות כמה נשאר, לחזור אחורה
   ולשנות תשובה; ניווט שמסתיר את שאר השאלות לוקח ממנו בדיוק את זה.

   המבחן אינו נשמר. הוא מצב זמני בזיכרון בלבד, ורענון הדף מתחיל
   אותו מחדש — זו הצהרה ולא פער: שעון שממשיך לרוץ בין ביקורים
   הוא בדיוק המקום שבו נולדים באגים שקשה לשחזר.
   ============================================================ */
var SIM_N=20, SIM_MIN=30;
var SIM={on:false,done:false,q:[],ans:[],end:0,tick:null};

function simStop(){if(SIM.tick){clearInterval(SIM.tick);SIM.tick=null}}
function simFmt(ms){
  if(ms<0)ms=0;
  var sec=Math.round(ms/1000),m=Math.floor(sec/60),c=sec%60;
  return m+":"+(c<10?"0":"")+c;
}
function simLeftN(){
  var n=0,i;
  for(i=0;i<SIM.ans.length;i++)if(SIM.ans[i]<0)n++;
  return n;
}
function simRight(){
  var n=0,i;
  for(i=0;i<SIM.q.length;i++)if(SIM.ans[i]>=0&&SIM.q[i].opts[SIM.ans[i]].ok)n++;
  return n;
}
function simStart(){
  var pairs=[],qs=[],i,q;
  TOPICS.forEach(function(tp){for(var l=1;l<=3;l++)pairs.push([tp.id,l])});
  shuffle(pairs);
  for(i=0;i<pairs.length&&qs.length<SIM_N;i++){
    q=buildQuestion(pairs[i][0],pairs[i][1],undefined,true);
    if(q)qs.push(q);
  }
  /* פחות צמדי נושא-רמה מ-SIM_N: סבב נוסף, בלי לחזור על אותו פריט. */
  var guard=0;
  while(qs.length<SIM_N&&guard<400){
    var pr=pairs[guard%pairs.length]; guard++;
    q=buildQuestion(pr[0],pr[1],undefined,true);
    if(!q)continue;
    var dup=false,k;
    for(k=0;k<qs.length;k++)if(qs[k].id===q.id){dup=true;break}
    if(!dup)qs.push(q);
  }
  SIM.q=qs;
  SIM.ans=qs.map(function(){return -1});
  SIM.on=true; SIM.done=false; SIM.end=Date.now()+SIM_MIN*60000;
  simArm();
}
function simArm(){
  simStop();
  if(SIM.on&&!SIM.done)SIM.tick=setInterval(simClock,1000);
}
function simClock(){
  var el=$("#simclock");
  /* המסך הוחלף — אין מה לעדכן, והשעון נעצר מעצמו. */
  if(!el){simStop();return}
  var left=SIM.end-Date.now();
  el.textContent=simFmt(left);
  if(left<=60000)el.classList.add("low");
  if(left<=0){simStop();simSubmit()}
}
/* ההגשה היא גם רגע הרישום: עד כאן לא נספרה אף תשובה, כדי
   שהמבחן לא ידחוף לבנק הטעויות שאלה שהנבחן עוד עמד לשנות. */
function simSubmit(){
  if(!SIM.on||SIM.done)return;
  simStop();
  var i;
  for(i=0;i<SIM.q.length;i++){
    var q=SIM.q[i],pk=SIM.ans[i];
    recordItem(q.tid,q.lv,q.id,pk>=0&&!!q.opts[pk].ok);
  }
  SIM.done=true; save(); render(); window.scrollTo(0,0);
}

/* ============================================================
   מתאם למסכי המבחן
   ------------------------------------------------------------
   מסכי המבחן נכתבו לאפליקציות המתמטיקה. שם השאלה נראית אחרת —
   ask, options, topicName — וכאן היא prompt, lead ו-opts. גם
   הניווט שונה: שם משתנה view, וכאן state.screen. ההמרה נעשית
   כאן, במקום אחד, ולא בפיזור תנאים בתוך המסכים.
   ============================================================ */
var view="";   /* מסכי המבחן בלבד. שאר האפליקציה מנווטת ב-state.screen. */
/* שמות הרמות כבר מתורגמים באפליקציה (lv1..lv3). המסכים קוראים
   LVL[i] וגם LVL.map, ולכן זה חייב להיות מערך אמיתי — ומכיוון
   שהוא מערך, הוא מתרענן בכל ציור מסך, אחרת החלפת שפה לא הייתה
   משנה את מה שכתוב במבחן. */
var LVL=["","",""];
function lvlSync(){LVL[0]=t("lv1");LVL[1]=t("lv2");LVL[2]=t("lv3")}
var LVL_C=["var(--c-sound)","var(--c-words)","var(--c-talk)"];
/* מסכי המבחן שואלים אם ההקראה פעילה. באפליקציה הזאת אין מתג כזה —
   ההקראה זמינה תמיד דרך כפתורי ההשמעה — ולכן התשובה קבועה. */
if(!state.settings)state.settings={tts:true};
/* לא לכל אפליקציה יש דף נוסחאות. מקטע המבחן הגיע מאפליקציה שיש
   בה אחד, והציע אותו גם כאן — כפתור שמוביל למסך שאינו קיים. */
var HAS_FORMULAS=(typeof viewFormulas==="function");
function topicById(id){return topicOf(id)}
/* אין track ב-blankState של האפליקציה הזאת, ולכן בכניסה הראשונה
   הוא undefined ורשימת הנושאים הייתה יוצאת ריקה. נופלים למסלול
   הראשון במקום להציג מסך בלי כלום. */
function trackSel(){
  var k=state.track;
  if(k&&TOPICS.some(function(x){return x.trk===k}))return k;
  return (TRACKS[0]||{}).id;
}
function topicsForTrack(trk){
  if(!trk||!TOPICS.some(function(x){return x.trk===trk}))trk=(TRACKS[0]||{}).id;
  return TOPICS.filter(function(x){return x.trk===trk});
}
function topicCls(id){var tp=topicOf(id);return tp?trackOf(tp.trk).cls:""}
function areaCls(id){return topicCls(id)}
/* טקסט נקי מתוך HTML — המסכים משווים ומדווחים תשובות כטקסט. */
function plainOf(h){
  var d=document.createElement("div"); d.innerHTML=String(h||"");
  return (d.textContent||"").replace(/\s+/g," ").trim();
}
function buildQ(tid,lv){
  /* pure=true — הבחירה כאן אינה מביטה בהתקדמות הלומד. זה מה
     שמאפשר לזרע אחד לייצר את אותה שאלה בדיוק אצל המורה ואצל
     התלמיד; ראו את ההסבר בראש סעיף 8. */
  var q=buildQuestion(tid,lv,undefined,true); if(!q)return null;
  var tp=topicOf(tid);
  return {topic:tid, topicName:tp?tName(tp):"", ask:brOk(esc(q.lead||"")), expr:"", fig:q.fig||"",
          options:(q.opts||[]).map(function(o){
            return {h:o.h,t:plainOf(o.h),ok:!!o.ok,why:o.why||""}}),
          say:q.say||"", hint:q.hint||""};
}


/* ============================================================
   18. מבחן כיתתי — פרסום בוואטסאפ, קבלת תשובות וציונים
   ------------------------------------------------------------
   אין שרת, ואין כוונה שיהיה. לכן המבחן אינו נשלח לשום מקום:
   הוא *נארז לתוך הקישור*. המורה מקבל קישור, שולח אותו בוואטסאפ,
   והמכשיר של התלמיד בונה מהקישור בדיוק את אותן שאלות.

   מה שהופך את זה לאפשרי הוא שכל מחולל שאלות כאן משתמש ב-
   Math.random בלבד. אם מזרעים אותו, אותו זרע מייצר את אותן
   שאלות ואת אותו סדר תשובות — אצל המורה ואצל התלמיד. הקישור

/* --- מחולל מזורע. mulberry32: קצר, מהיר, ופיזור טוב דיו --- */
function withSeed(seed,fn){
  var real=Math.random,s=(seed>>>0)||1;
  Math.random=function(){
    s|=0; s=s+0x6D2B79F5|0;
    var t=Math.imul(s^s>>>15,1|s);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
  try{return fn()}finally{Math.random=real}
}
function hash32(str){
  var h=0x811c9dc5,i;
  for(i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193)}
  return (h>>>0);
}
/* base64url. הניקוי בפענוח אינו קוסמטי: וואטסאפ שובר מחרוזות
   ארוכות בשורות, ורווח אחד הורס את כל הקוד. */
function b64e(str){
  var bytes=new TextEncoder().encode(str),bin="",i;
  for(i=0;i<bytes.length;i+=8192)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));
  return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function b64d(s){
  s=String(s||"").replace(/[^A-Za-z0-9\-_]/g,"").replace(/-/g,"+").replace(/_/g,"/");
  while(s.length%4)s+="=";
  var bin=atob(s),bytes=new Uint8Array(bin.length),i;
  for(i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

   רמה, שהמורה החליף באחד מהם שאלה, אינם אותו מבחן. מבחן ישן
   שאין לו זרעים מקבל בדיוק את המזהה שקיבל תמיד — אחרת ההגשות
   שכבר נקלטו אליו מתייתמות. */

  return x[0]+x[1]+(x.length>2?"@"+x[2]:"")}).join(",")).toString(36)}

    o.q=o.q.filter(function(x){return topicById(x[0])});

/* בונה את שאלות המבחן. אותו זרע → אותן שאלות, גם אצל המורה
   כשהוא בודק וגם אצל התלמיד כשהוא נבחן. */
function examQuestions(spec){
  /* מסננים נושאים שאינם מוכרים לאפליקציה הזאת, בדיוק כמו decodeExam.
     בלי הסינון buildQ מחזיר null על נושא זר, והמסך נופל על
     q.topic של null. עדיף לדלג בשקט מאשר להתרסק. */
  var pairs=(spec.q||[]).filter(function(x){return !!topicById(x[0])});
  /* מבחן שנבנה עם זרע לכל משבצת נבנה משבצת אחרי משבצת, וכל
     שאלה תלויה בזרע שלה בלבד — כך המורה יכול להחליף אחת מהן.
     מבחן ישן, בלי זרעים, חייב להיבנות בדיוק כפי שנבנה ביום
     שנשלח: אחרת הציון של מי שכבר נבחן משתנה למפרע. */
  if(pairs.length&&pairs.every(function(x){return typeof x[2]==="number"}))
    return pairs.map(function(p){return exBuildSlot(p)})
                .filter(function(q){return !!q});
  return withSeed(spec.s,function(){
    return pairs.map(function(pair){return buildQ(pair[0],pair[1])})
                .filter(function(q){return !!q});
  });
}
/* --- בחירת השאלות בידי המורה ---------------------------------
   עד כאן המורה בחר נושאים, רמה ומספר שאלות — והשאלות עצמן הוגרלו
   מאחורי גבו. הוא ראה אותן לראשונה רק אחרי שהמבחן כבר היה אצל
   התלמידים. מעכשיו כל שאלה היא משבצת נפרדת עם זרע משלה: המורה
   רואה אותה לפני השליחה, מחליף אותה בשאלה אחרת מאותו נושא,
   מסיר אותה, או מוסיף שאלה מנושא שחסר לו.

   הזרע הנפרד לכל משבצת הוא מה שמאפשר את זה. בזרם אקראי אחד
   ומשותף, כפי שהיה עד כאן, החלפה של השאלה השלישית הייתה משנה
   גם את הרביעית ואת החמישית — כלומר לא "החלפה" אלא הגרלה מחדש
   של כל מה שאחריה.

   24 ביט ולא 32: הזרע נוסע בתוך הקישור שנשלח בוואטסאפ, וזרע
   קצר יותר הוא קישור קצר יותר. שישה־עשר מיליון אפשרויות למשבצת
   הן הרבה מעבר למה שהמחולל עצמו יודע לייצר. */
function exNewSeed(){return (Math.random()*16777215)>>>0}
function exSlot(topicId,level){return [topicId,level,exNewSeed()]}
/* אותו זרע → אותה שאלה בדיוק: אצל המורה כשהוא בוחר, ואצל
   התלמיד כשהוא נבחן. */
function exBuildSlot(slot){
  if(!slot||!topicById(slot[0]))return null;
  return withSeed(slot[2],function(){return buildQ(slot[0],slot[1])})||null;
}
/* מסך הבנייה מצייר את עצמו מחדש אחרי כל לחיצה, ובניית עשרים
   וחמש שאלות בכל ציור מיותרת. המטמון הוא לתצוגה בלבד — מי
   שנבחן בונה את שאלותיו מחדש, כדי שאיש לא יערוך בטעות אובייקט
   שגם מסך אחר מחזיק בו. */
var EXQCACHE={};

   הוא שגיאה בעיני הבודקים — רעש שמסתיר שגיאה אמיתית. */
function exLangKey(){
  try{
    var g=(typeof window!=="undefined")?window:{};
    if(typeof g.xlg==="function")return g.xlg();
    if(typeof g.LG==="string")return g.LG;

function exPreviewQ(slot){

       מטמון שרק גדל הוא דליפה; מרוקנים אותו ומתחילים מחדש. */
    if(Object.keys(EXQCACHE).length>400)EXQCACHE={};

/* הציון מחושב כאן מחדש מתוך התשובות. מה שהתלמיד שלח הוא מה
   שסימן, לא כמה הוא קיבל. */
function gradeResult(spec,res){
  var qs=examQuestions(spec),per=[],ok=0,i,q,a;
  for(i=0;i<qs.length;i++){
    q=qs[i]; a=res.a[i];
    var right=(a>=0&&q.options[a]&&q.options[a].ok)?1:0;
    if(right)ok++;

              picked:(a>=0&&q.options[a])?q.options[a].t:"—",
              answer:(q.options.filter(function(o){return o.ok})[0]||{}).t||""});

function viewExamSlots(){
  var ls=exSlots(),h="",tops=EB.topics.filter(function(x){return topicById(x)});
  h+='<div style="margin-top:18px"><b>'+esc(xt("exQs"))+'</b>'+
     '<p class="sub" style="margin:4px 0 8px">'+esc(xt("exQsNote"))+'</p>';
  h+='<div class="row" style="margin:0 0 10px">'+
     '<button class="xq-b" data-a="exqans" aria-pressed="'+(EB.ans?"true":"false")+'">'+
     (EB.ans?esc(xt("exQsHide")):esc(xt("exQsShow")))+'</button>'+
     '<button class="xq-b" data-a="exqreset">'+esc(xt("exQsReset"))+'</button></div>';
  h+='<ol class="xq-list">';
  ls.forEach(function(sl,i){
    var q=exPreviewQ(sl),ok=exRightAnswer(q);
    h+='<li class="xq"><div class="xq-top">'+
       '<span class="xq-n">'+(i+1)+'</span>'+
       '<span class="xq-tp">'+esc(q&&q.topicName?q.topicName:exTopicName(sl[0]))+'</span>'+
       '<span class="xq-acts">'+
       '<button class="xq-b" data-a="exqroll" data-i="'+i+'">'+esc(xt("exQsSwap"))+'</button>'+
       /* המבחן חייב להישאר עם שאלה אחת לפחות, ולכן הכפתור נעלם
          ולא מוצג כבוי: כפתור שאי אפשר ללחוץ עליו מבלבל. */
       (ls.length>1?'<button class="xq-b" data-a="exqdel" data-i="'+i+'">'+esc(xt("exQsDrop"))+'</button>':"")+
       '</span></div>';

/* ------------------------------------------------------------
   ייצוא CSV של ההגשות.
   העתקת הטבלה נותנת טקסט מופרד בטאבים — נוח להדבקה, אבל לא קובץ.
   מורה שרוצה למיין, לסנן או לחשב ממוצע צריך גיליון. שורה לכל תלמיד,
   ועמודה לכל שאלה, כדי שאפשר יהיה לראות מיד באיזו שאלה נפלה הכיתה.
   ה-BOM בהתחלה הוא מה שגורם לאקסל לקרוא עברית, ערבית ורוסית נכון
   במקום ג׳יבריש — בלעדיו הקובץ נפתח שבור בדיוק אצל מי שצריך אותו.
   ------------------------------------------------------------ */
function csvCell(v){
  var s=(v===undefined||v===null)?"":String(v);
  return /[",\n\r;\t]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function csvRow(a){ return a.map(csvCell).join(",") }
/* ============================================================
   מצב מורה.
   בונה המבחן ומסך הציונים נועדו למורה. על טאבלט כיתתי, או על
   טלפון שהילד לוקח לעצמו, אין סיבה שהם יהיו במרחק הקשה אחת:
   ילד יכול למחוק מבחן, לראות ציונים של חברים, או לפתוח מבחן
   ולראות מראש את השאלות.
   זו אינה אבטחה, ואסור להציג אותה ככזאת: מי שיודע לפתוח כלי
   פיתוח יעקוף אותה בשנייה. זו נעילה מפני יד סקרנית — בדיוק מה
   שצריך כאן, ולא יותר.
   כל עוד לא נבחר קוד, שום דבר לא משתנה והמסכים גלויים כתמיד.
   ============================================================ */
var TE={ask:false,mode:"",msg:"",busy:false};
function teRead(){try{return JSON.parse(localStorage.getItem("hebrew-arab-teacher")||"null")}catch(e){return null}}
function teWrite(o){try{o===null?localStorage.removeItem("hebrew-arab-teacher"):localStorage.setItem("hebrew-arab-teacher",JSON.stringify(o))}catch(e){}}
function teHas(){var r=teRead();return !!(r&&r.h)}
function teOpen(){
  if(!teHas())return true;
  try{if(sessionStorage.getItem("hebrew-arab-teacher"+"-open")==="1")return true}catch(e){}
  try{if(localStorage.getItem("hebrew-arab-teacher"+"-open")==="1")return true}catch(e){}
  return false;
}
function teSetOpen(on,remember){
  try{sessionStorage.removeItem("hebrew-arab-teacher"+"-open")}catch(e){}
  try{localStorage.removeItem("hebrew-arab-teacher"+"-open")}catch(e){}
  if(!on)return;
  try{(remember?localStorage:sessionStorage).setItem("hebrew-arab-teacher"+"-open","1")}catch(e){}
}
/* גיבוב חלש כגיבוי בלבד. SubtleCrypto קיים בכל דפדפן מודרני
   בהקשר מאובטח, ו-GitHub Pages הוא כזה. */
function teWeak(s){var h=5381,i;for(i=0;i<s.length;i++)h=((h*33)^s.charCodeAt(i))>>>0;return "w"+h.toString(16)}
function teHash(pin,salt,cb){
  var msg=salt+"|"+pin;
  try{
    if(window.crypto&&crypto.subtle&&crypto.subtle.digest&&window.TextEncoder){
      crypto.subtle.digest("SHA-256",new TextEncoder().encode(msg)).then(function(d){
        var a=Array.prototype.slice.call(new Uint8Array(d));
        cb(a.map(function(b){return ("0"+b.toString(16)).slice(-2)}).join(""));
      },function(){cb(teWeak(msg))});
      return;
    }
  }catch(e){}
  cb(teWeak(msg));
}
function teSalt(){
  var s="";
  try{
    var a=new Uint8Array(8);crypto.getRandomValues(a);
    s=Array.prototype.slice.call(a).map(function(b){return ("0"+b.toString(16)).slice(-2)}).join("");
  }catch(e){ s=String(Date.now())+Math.random().toString(36).slice(2) }
  return s;
}
/* השהיה אחרי ניסיונות כושלים. ארבע ספרות הן עשרת אלפים
   אפשרויות, וילד סבלני יכול לנסות הרבה. */
function teWait(){
  var r=teRead();if(!r||!r.bad||r.bad<3)return 0;
  var pen=Math.min(300,Math.pow(2,r.bad-3)*5)*1000;
  var left=Math.ceil(((r.badAt||0)+pen-Date.now())/1000);
  return left>0?left:0;
}
function teDialog(){

  var wait=teWait();

    (TE.msg?'<p class="te-msg" role="alert">'+esc(TE.msg)+'</p>':'')+
    (wait?'<p class="te-msg" role="alert">'+esc(xf("teWaitN",wait))+'</p>':'')+
    '<div class="te-row">'+
      '<button class="te-btn pri" id="te-ok"'+(wait?' disabled':'')+'>'+esc(xt("teOk"))+'</button>'+
      '<button class="te-btn" id="te-no">'+esc(xt("teCancel"))+'</button>'+
    '</div>'+
    (!setting&&teHas()?'<button class="te-btn link" id="te-forgot">'+esc(xt("teForgot"))+'</button>':'')+
    '</div>';
  document.body.appendChild(w);
  var box=w.firstChild, pin=document.getElementById("te-pin");
  box.focus(); if(pin&&!wait)pin.focus();
  /* מלכודת פוקוס, כמו בשער התנאים */
  w.addEventListener("keydown",function(e){
    if(e.key==="Escape"){teClose();return}

function teClose(){ TE.ask=false; TE.mode=""; TE.msg=""; teDialog(); }
function teSubmit(){
  if(TE.busy)return;
  var setting=(TE.mode==="set"||TE.mode==="change"||!teHas());
  var pin=(document.getElementById("te-pin")||{}).value||"";
  var rem=!!(document.getElementById("te-rem")||{}).checked;
  if(!/^[0-9]{4,8}$/.test(pin)){TE.msg=xt("teShort");teDialog();return}
  if(setting){
    var p2=(document.getElementById("te-pin2")||{}).value||"";
    if(pin!==p2){TE.msg=xt("teMismatch");teDialog();return}
    var salt=teSalt();
    TE.busy=true;
    teHash(pin,salt,function(h){
      TE.busy=false;
      teWrite({h:h,s:salt,bad:0,badAt:0});
      teSetOpen(true,rem);
      TE.ask=false;TE.mode="";TE.msg="";
      teDialog(); render();
    });
    return;
  }
  if(teWait()){teDialog();return}
  var rec=teRead(); if(!rec){teClose();return}
  TE.busy=true;
  teHash(pin,rec.s,function(h){
    TE.busy=false;
    if(h===rec.h){
      rec.bad=0;rec.badAt=0;teWrite(rec);
      teSetOpen(true,rem);
      TE.ask=false;TE.mode="";TE.msg="";
      teDialog(); render();
    }else{

/* נעילה אוטומטית אחרי שהאפליקציה הייתה מוסתרת זמן־מה.
   מורה שבנה מבחן ומסר את הטאבלט בלי ללחוץ "יציאה" השאיר אותו
   פתוח, וזה בדיוק המצב שהתכונה אמורה למנוע. שתי דקות מספיקות
   כדי לא להפריע לעבודה רצופה, ולנעול כשהמכשיר עבר יד.
   נעילה שנשמרה כ"לזכור במכשיר הזה" היא בחירה מפורשת ולא נוגעים בה. */
var TE_HID=0;
try{
  document.addEventListener("visibilitychange",function(){
    if(document.hidden){ TE_HID=Date.now(); return }
    if(!TE_HID||!teHas())return;
    var away=Date.now()-TE_HID; TE_HID=0;
    if(away<120000)return;
    var kept=false;
    try{ kept=localStorage.getItem("hebrew-arab-teacher"+"-open")==="1" }catch(e){}
    if(kept)return;

/* ?teacher=1 פותח את החלון, והפרמטר מוסר מיד מהכתובת כדי שלא
   יישאר בקישור ששותף או בהיסטוריה. */
(function(){
  try{
    var u=new URL(location.href);
    if(u.searchParams.get("teacher")==="1"){
      u.searchParams.delete("teacher");
      history.replaceState(null,"",u.pathname+(u.searchParams.toString()?"?"+u.searchParams:"")+u.hash);
      /* שער התנאים יושב מעל הכול, וכך צריך להיות: אי־אפשר להשתמש
         באפליקציה לפני שהוסכם עליהם. חלון הקוד ממתין לו במקום
         להיפתח מתחתיו ולהיראות תקוע. */
      var tries=0;
      (function waitLegal(){
        if(tries++>=600){ teAsk(teHas()?"":"set"); return }
        /* LEGAL.accepted נוצר רק כש-protect.js מאותחל. עד אז אין
           עדיין מה לבדוק, ובדיקה של ".lg-wrap" לבדה מחזירה "אין
           שער" בדיוק ברגע שלפני שהוא נבנה. */
        var ready=false;
        try{ ready=!!(window.LEGAL&&window.LEGAL.accepted) }catch(e){}
        if(!ready){ setTimeout(waitLegal,200); return }
        var ok=true;
        try{ ok=!!window.LEGAL.accepted() }catch(e){ ok=true }
        if(!ok){ setTimeout(waitLegal,200); return }
        teAsk(teHas()?"":"set");
      })();
    }
  }catch(e){}
})();

function marksCsv(ex){
  var subs=(ex.subs||[]).slice().sort(function(a,b){return b.pct-a.pct});
  var n=ex.spec.q.length,i;
  var head=[xt("mkCsvName"),xt("mkCsvPct"),xt("mkCsvOk"),xt("mkCsvTotal"),
            xt("mkCsvDate"),xt("mkCsvValid")];
  for(i=0;i<n;i++)head.push(xf("mkCsvQ",i+1));
  var rows=[csvRow(head)];
  subs.forEach(function(s){
    var r=[s.name||xt("mkNoName"),s.pct,s.ok,s.n,s.date||"",
           s.valid?xt("mkCsvYes"):xt("mkCsvNo")];
    for(i=0;i<n;i++){
      var p=s.per&&s.per[i];
      r.push(p?(p.ok?xt("mkCsvYes"):xt("mkCsvNo")):"");
    }
    rows.push(csvRow(r));
  });
  return "\ufeff"+rows.join("\r\n")+"\r\n";
}
/* כרום מוחק את שם הקובץ כולו ברגע שיש בו תו אחד שאינו ASCII —
   לא רק עברית: גם é או מקף ארוך. מה שיורד נקרא "download", בלי
   סיומת, ואקסל לא יודע לפתוח אותו. מורה שקרא למבחן שלו בעברית
   קיבל קובץ בלי שם ובלי סוג. לכן השם מתועתק ללטינית. */
var TRLIT={
  "א":"a","ב":"b","ג":"g","ד":"d","ה":"h","ו":"v","ז":"z","ח":"ch","ט":"t","י":"y",
  "כ":"k","ך":"k","ל":"l","מ":"m","ם":"m","נ":"n","ן":"n","ס":"s","ע":"","פ":"f",
  "ף":"f","צ":"tz","ץ":"tz","ק":"k","ר":"r","ש":"sh","ת":"t",
  "ا":"a","ب":"b","ت":"t","ث":"th","ج":"j","ح":"h","خ":"kh","د":"d","ذ":"dh","ر":"r",
  "ز":"z","س":"s","ش":"sh","ص":"s","ض":"d","ط":"t","ظ":"z","ع":"","غ":"gh","ف":"f",
  "ق":"q","ك":"k","ل":"l","م":"m","ن":"n","ه":"h","و":"w","ي":"y","ة":"h","ى":"a","ء":"",
  "أ":"a","إ":"i","آ":"a","ؤ":"w","ئ":"y",
  "а":"a","б":"b","в":"v","г":"g","д":"d","е":"e","ё":"e","ж":"zh","з":"z","и":"i",
  "й":"y","к":"k","л":"l","м":"m","н":"n","о":"o","п":"p","р":"r","с":"s","т":"t",
  "у":"u","ф":"f","х":"kh","ц":"ts","ч":"ch","ш":"sh","щ":"sch","ъ":"","ы":"y","ь":"",
  "э":"e","ю":"yu","я":"ya"
};
function asciiName(s){
  var i,c,out="";
  /* é ו-ü הם אות לטינית ועוד סימן מצורף. פירוק והסרת הסימן משאיר e ו-u. */
  try{ s=s.normalize("NFD").replace(/[\u0300-\u036f]/g,"") }catch(e){}
  for(i=0;i<s.length;i++){
    c=s.charAt(i);
    if(/[A-Za-z0-9]/.test(c)){ out+=c; continue }
    var lower=c.toLowerCase();
    if(TRLIT[lower]!==undefined){ out+=TRLIT[lower]; continue }
    out+=" ";                     /* כל השאר — רווח, שיתכווץ בהמשך */
  }
  return out.replace(/\s+/g," ").trim();
}
function csvFileName(ex){
  var t=asciiName(String(ex.spec.t||"")).slice(0,60).trim();
  var d=String(ex.date||todayIso()).replace(/[^0-9-]/g,"");
  /* כשלא נשאר כלום קריא, מזהה המבחן הוא מה שמבדיל בין שני קבצים
     שירדו באותו יום. */
  if(!t) t="exam "+String(ex.id||"").slice(0,6);
  return (t+" "+d).trim()+".csv";
}
function downloadCsv(ex){
  var txt=marksCsv(ex),url=null,a=document.createElement("a");
  try{
    url=URL.createObjectURL(new Blob([txt],{type:"text/csv;charset=utf-8"}));
  }catch(e){
    url="data:text/csv;charset=utf-8,"+encodeURIComponent(txt);
  }
  a.href=url; a.download=csvFileName(ex);
  a.style.cssText="position:fixed;inset-inline-start:-9999px";
  document.body.appendChild(a); a.click();
  setTimeout(function(){
    if(a.parentNode)a.parentNode.removeChild(a);
    if(url&&url.indexOf("blob:")===0){try{URL.revokeObjectURL(url)}catch(e){}}
  },400);
}
function marksTable(ex){
  var out=(ex.spec.t||xt("exam"))+"\n";
  out+=xt("mkTblHead")+"\n";
  (ex.subs||[]).slice().sort(function(a,b){return b.pct-a.pct}).forEach(function(s){
    var wrong=uniq(s.per.filter(function(p){return !p.ok}).map(function(p){return p.topicName}));
    out+=(s.name||xt("mkNoName"))+"\t"+s.pct+"\t"+s.ok+"/"+s.n+"\t"+wrong.join(", ")+"\n";
  });
  return out;
}

/* ------------------------------------------------------------
   מסך התלמיד — מבחן מתוך קישור
   ------------------------------------------------------------ */
var SIT={spec:null,id:"",qs:[],i:0,name:"",answers:[],flags:[],
         t0:0,tick:null,phase:"intro",code:"",copied:false};

/* ------------------------------------------------------------
   מבחן שנפתח מחדש — ריענון, שיחה נכנסת, נעילת מסך
   ------------------------------------------------------------
   תלמיד שדפדפן שלו רענן באמצע מבחן איבד עד כה את הכול. התשובות
   נשמרות עכשיו במכשיר, לפי מזהה המבחן, יחד עם שעת ההתחלה — כדי
   שגם טיימר לא יתאפס ויעניק זמן נוסף. השמירה מקומית בלבד.
   ------------------------------------------------------------ */
function sitKey(){return EKEY+"-run-"+SIT.id}
function sitSave(){
  if(!SIT.id)return;
  try{localStorage.setItem(sitKey(),JSON.stringify({
    n:SIT.name,a:SIT.answers,f:SIT.flags,t:SIT.t0,i:SIT.i,p:SIT.phase}))}catch(e){}
}
function sitKeyOld(){return EKEY_OLD+"-run-"+SIT.id}
function sitDrop(){try{localStorage.removeItem(sitKey());localStorage.removeItem(sitKeyOld())}catch(e){}}
function sitRestore(){
  if(!SIT.id)return false;
  try{
    /* מבחן שהתחיל לפני פיצול המפתחות נשמר תחת המפתח הישן. */
    var o=JSON.parse(localStorage.getItem(sitKey())||localStorage.getItem(sitKeyOld())||"null");
    if(!o||!o.a||!o.a.length)return false;
    SIT.qs=examQuestions(SIT.spec);
    if(o.a.length!==SIT.qs.length)return false;   /* מבחן אחר תחת אותו מזהה */
    SIT.name=o.n||""; SIT.answers=o.a;
    SIT.flags=o.f&&o.f.length===o.a.length?o.f:SIT.qs.map(function(){return false});
    SIT.t0=o.t||0; SIT.i=Math.min(Math.max(0,o.i|0),SIT.qs.length-1);
    SIT.phase=o.p==="done"?"done":"ask";
    if(SIT.phase==="done")SIT.code=encodeResult(SIT.id,SIT.name,SIT.answers);
    return true;
  }catch(e){return false}
}
/* שניות שנותרו, או null כשלא הוגדרה הגבלת זמן */
function sitLeft(){
  var m=SIT.spec&&SIT.spec.m;
  if(!m||!SIT.t0)return null;
  return Math.max(0,Math.round((SIT.t0+m*60000-Date.now())/1000));
}
function sitClock(){
  var l=sitLeft(); if(l===null)return "";
  var mm=Math.floor(l/60),ss=l%60;
  return mm+":"+(ss<10?"0":"")+ss;
}
/* הזמן נגמר — מגישים. לא מבקשים אישור: אישור שאיש לא לוחץ עליו
   פירושו מבחן שנשאר פתוח לנצח. */
function sitTimerOn(){
  sitTimerOff();
  if(sitLeft()===null)return;
  SIT.tick=setInterval(function(){
    if(SIT.phase!=="ask"){sitTimerOff();return}
    if(sitLeft()<=0){sitTimerOff();sitFinish();return}
    var el=$("#sitclock"); if(el)el.textContent=sitClock();
  },1000);
}
function sitTimerOff(){if(SIT.tick){clearInterval(SIT.tick);SIT.tick=null}}

function sitStart(){
  var nm=$("#sitName"); SIT.name=nm?nm.value.trim():"";
  SIT.qs=examQuestions(SIT.spec);
  /* אם לא נותרה אף שאלה שאפשר לבנות (למשל מבחן של אפליקציה אחרת),
     מציגים את מסך המבחן השבור במקום ליפול על שאלה שאינה קיימת. */
  if(!SIT.qs.length){view="badexam"; render(); return}
  SIT.answers=SIT.qs.map(function(){return -1});
  SIT.flags=SIT.qs.map(function(){return false});
  SIT.i=0; SIT.phase="ask"; SIT.t0=Date.now();
  sitSave(); sitTimerOn();
  window.scrollTo(0,0); render();
}
function sitAnswer(i){
  if(SIT.phase!=="ask")return;
  SIT.answers[SIT.i]=i;
  sitSave();
  sitNext();
}
/* סימון לחזרה אינו תשובה ואינו משנה אותה — הוא רק מסמן. */
function sitFlag(){
  if(SIT.phase!=="ask")return;
  SIT.flags[SIT.i]=!SIT.flags[SIT.i];
  sitSave(); render();
}
function sitNext(){
  if(SIT.i+1<SIT.qs.length){SIT.i++;window.scrollTo(0,0);render();return}
  /* לא מגישים בלחיצה על תשובה. לחיצה בטעות על האפשרות האחרונה
     אינה אמורה לסיים מבחן. */
  SIT.phase="review"; stopSpeak(); window.scrollTo(0,0); render();
}
function sitGo(i){
  SIT.i=clamp(i,0,SIT.qs.length-1); SIT.phase="ask";
  window.scrollTo(0,0); render();
}
function sitFinish(){
  SIT.phase="done";
  sitTimerOff();
  SIT.code=encodeResult(SIT.id,SIT.name,SIT.answers);

      var corr=(q.options.filter(function(o){return o.ok})[0]||{}).h||"";
      h3+='<div class="tog" style="align-items:flex-start"><span class="tt">'+
        '<b>'+(i+1)+'. '+esc(q.topicName)+'</b>'+
        '<span>'+(right?esc(xt("stOk")):esc(xt("stCorrect"))+" "+corr)+'</span></span>'+
        '<span class="chip '+(right?"ok":"bad")+'">'+(right?"✓":"✗")+'</span></div>';
    });
    h3+='</div>';
  }
  h3+='<div class="row" style="margin-top:16px"><a class="btn btn-g" href="'+
      esc(location.origin+location.pathname)+'">'+esc(xt("stToApp"))+'</a></div>';
  return h3+'</div>';
}

function copyText(txt,done){
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(done,function(){fallbackCopy(txt,done)});
      return;
    }
  }catch(e){}
  fallbackCopy(txt,done);
}
function fallbackCopy(txt,done){
  try{
    var ta=document.createElement("textarea");
    ta.value=txt; ta.setAttribute("readonly","");
    ta.style.position="fixed"; ta.style.top="-1000px";
    document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); document.body.removeChild(ta);
    done();
  }catch(e){}
}
function examAction(a,el){
  /* --- בניית מבחן --- */
  if(a==="exlvl"){EB.level=parseInt(el.getAttribute("data-l"),10)||2;EB.q=null;EB.built=null;render();return true}
  if(a==="extopic"){
    var id=el.getAttribute("data-t"),k=EB.topics.indexOf(id);
    if(k>=0)EB.topics.splice(k,1);else EB.topics.push(id);
    EB.q=null;EB.built=null;render();return true;
  }
  if(a==="exflag"){var f=el.getAttribute("data-f");EB[f]=!EB[f];EB.built=null;render();return true}
  /* --- בחירת השאלות --- */
  if(a==="exqans"){EB.ans=!EB.ans;render();return true}
  if(a==="exqreset"){EB.q=null;EB.built=null;render();return true}
  if(a==="exqroll"){
    var qi=parseInt(el.getAttribute("data-i"),10),ql=exSlots();
    /* משבצת חדשה ולא רק זרע חדש, כדי שהמערך יישאר בן שלושה
       איברים גם אם מישהו יוסיף שדה בעתיד. */
    if(ql[qi])
      {ql[qi]=exSlot(ql[qi][0],ql[qi][1]);EB.built=null}
    render();return true;
  }
  if(a==="exqdel"){
    var di=parseInt(el.getAttribute("data-i"),10),dl=exSlots();
    /* מבחן בלי שאלות אינו מבחן. משאירים אחת. */
    if(dl.length>1&&di>=0&&di<dl.length){dl.splice(di,1);EB.n=dl.length;EB.built=null}
    render();return true;
  }
  if(a==="exqadd"){
    var at=el.getAttribute("data-t"),al=exSlots();
    /* עשרים וחמש — גם הגבול של המחוון, וגם מבחן ארוך דיו. */
    if(topicById(at)&&al.length<25){al.push(exSlot(at,EB.level));EB.n=al.length;EB.built=null}
    render();return true;
  }
  if(a==="exbuild"){
    var ti=$("#exTitle"),ph=$("#exPhone");
    EB.title=ti?ti.value.trim():""; EB.phone=ph?ph.value.trim():"";
    /* המבחן נארז מהמשבצות שעל המסך — אותן שאלות ואותו סדר
       שהמורה אישר. ערבוב כאן היה מסדר מחדש מבחן שכבר נבדק. */
    var q=exSlots().slice();
    var spec={v:GENV,t:EB.title||xt("exam"),s:(Math.random()*4294967295)>>>0,l:EB.level,
              q:q,r:!!EB.tts,f:!!EB.formulas,w:true,m:EB.mins||0};
    if(EB.phone)spec.p=EB.phone.replace(/[^0-9]/g,"");
    EB.built=spec; EB.copied="";
    var id=examId(spec);
    if(!exFind(id)){EX.list.unshift({id:id,spec:spec,date:todayIso(),subs:[]});exSave()}
    render(); return true;
  }
  if(a==="excopy"){var u=el.getAttribute("data-v");copyText(u,function(){EB.copied="url";render()});return true}

  /* --- ציונים --- */
  if(a==="mkopen"){var i2=el.getAttribute("data-i");MK.open=MK.open===i2?"":i2;MK.msg=null;render();return true}
  /* מחיקה מוחקת גם את כל ההגשות. שאלה אחת לפני זה היא לא נימוס —
     היא ההבדל בין טעות לבין אובדן של כיתה שלמה. */
  if(a==="mkdel"){MK.del=el.getAttribute("data-i");render();return true}
  if(a==="mkdelno"){MK.del="";render();return true}
  if(a==="mkdelyes"){
    var id3=el.getAttribute("data-i");
    EX.list=EX.list.filter(function(x){return x.id!==id3});
    exSave(); MK.open=""; MK.del=""; render(); return true;
  }
  if(a==="teask"){ teAsk(teHas()?"":"set"); return true }
  if(a==="techange"){ teAsk("change"); return true }
  if(a==="telock"){ teLock(); return true }
  if(a==="teremove"){ teRemove(); return true }
  if(a==="mkcsv"){
    var exc=exFind(el.getAttribute("data-i")); if(!exc)return true;
    downloadCsv(exc);
    MK.msg={id:exc.id,ok:true,m:xt("mkCsvDone")}; render();
    return true;
  }
  if(a==="mkcopy"){
    var ex4=exFind(el.getAttribute("data-i")); if(!ex4)return true;
    copyText(marksTable(ex4),function(){MK.msg={id:ex4.id,ok:true,m:xt("mkTblCopied")};render()});
    return true;
  }
  if(a==="mkadd"){
    var ex=exFind(el.getAttribute("data-i")); if(!ex)return true;
    var ta=$("#mkPaste"),raw=ta?ta.value:"";
    var res=decodeResult(raw);
    if(!res){MK.msg={id:ex.id,ok:false,m:xt("mkErrRead")};render();return true}
    if(res.i!==ex.id){
      var other=exFind(res.i);
      MK.msg={id:ex.id,ok:false,m:other?xf("mkErrOther",other.spec.t||xt("exam")):xt("mkErrUnknown")};
      render(); return true;
    }
    if(res.a.length!==ex.spec.q.length){
      MK.msg={id:ex.id,ok:false,m:xt("mkErrCount")};render();return true}
    var g=gradeResult(ex.spec,res);
    var sub={name:res.n||"",date:res.d||todayIso(),ok:g.ok,n:g.n,pct:g.pct,per:g.per,valid:!!res.ok};
    /* הגשה חוזרת של אותו תלמיד מחליפה את הקודמת ולא מצטברת לידה */
    /* הגשה חדשה מחליפה קודמת רק כששני השמות זהים אחרי נירמול, והשם
       אינו ריק. בלי זה כל ההגשות בלי שם נראו כאותו תלמיד ודרסו זו את
       זו בשקט, וגם "דני" מול "דני  " (רווח כפול פנימי) נחשבו לשניים. */
    var nrm=function(x){return String(x==null?"":x).replace(/\s+/g," ").trim()};
    var sn=nrm(sub.name);
    var k2=sn?(ex.subs||[]).findIndex(function(s){return nrm(s.name)===sn}):-1;
    if(!ex.subs)ex.subs=[];
    if(k2>=0)ex.subs[k2]=sub; else ex.subs.push(sub);
    exSave();
    MK.msg={id:ex.id,ok:true,m:(sub.name||xt("student"))+" "+xt("mkTaken")+" · "+g.pct+" ("+g.ok+"/"+g.n+")"+
      (sub.valid?"":" · "+xt("mkNoteBad"))};
    if(ta)ta.value="";
    render(); return true;
  }

  /* --- התלמיד --- */
  if(a==="sitstart"){sitStart();return true}
  if(a==="sitans"){sitAnswer(parseInt(el.getAttribute("data-i"),10));return true}
  if(a==="sitskip"){SIT.answers[SIT.i]=-1;sitSave();sitNext();return true}
  if(a==="sitflag"){sitFlag();return true}
  if(a==="sitprev"){sitGo(SIT.i-1);return true}
  if(a==="sitfwd"){sitNext();return true}
  if(a==="sitgo"){sitGo(parseInt(el.getAttribute("data-i"),10));return true}
  if(a==="sitfinish"){sitFinish();return true}
  /* בלי שפה מפורשת speak נופל ל-"en", ושאלת מבחן בעברית, בערבית
     או ברוסית הוקראה בקול אנגלי. כאן החומר עצמו בשפת הממשק. */
  /* say נבנה במפורש כ"השאלה והתשובה עליה" ונועד להישמע *אחרי*
     המענה. במבחן הכפתור זמין *לפני*, ולכן הוא הקריא לתלמיד את
     התשובה. כאן מוקרא מה שעל המסך — הכותרת והמקור — והאפשרויות
     ממילא אינן חלק ממנו. */
  if(a==="sitread"){var q2=SIT.qs[SIT.i];
    if(q2)speak(saySpell(plainOf(q2.ask||"")+" "+plainOf(q2.expr||"")),state.lang);
    return true}
  if(a==="sitform"){view="formulas";render();window.scrollTo(0,0);return true}
  if(a==="sitcopy"){copyText(SIT.code,function(){SIT.copied=true;render()});return true}
  if(a==="sitback"){view="sit";render();window.scrollTo(0,0);return true}
  return false;
}

function newQuestion(){
  var prev=P.q?P.q.idx:undefined;
  if(state.challenge){
    /* אתגר: שאלה מנושא ורמה אקראיים, בלי רמז. ההקראה נשארת. */
    var tp=pick(TOPICS),lv=1+Math.floor(Math.random()*3);
    P.q=buildQuestion(tp.id,lv,prev);
  }else{
    P.q=buildQuestion(state.topic,state.level,prev);
  }
  P.picked=-1; P.done=false; P.ok=false; P.hint=false; P.timeUp=false;
  render();
  chArm();
}
function chArm(){
  if(window.__chT){clearInterval(window.__chT);window.__chT=null}
  if(!state.challenge||!state.chSecs)return;
  var left=state.chSecs;
  window.__chT=setInterval(function(){
    if(P.done||!state.challenge){clearInterval(window.__chT);window.__chT=null;return}
    left--;
    var el=document.getElementById("chtimer");
    if(el)el.textContent=left;
    if(left<=0){
      clearInterval(window.__chT);window.__chT=null;
      if(!P.done&&P.q){P.timeUp=true;P.done=true;P.ok=false;P.picked=-1;record(false);render();
        setTimeout(function(){speak(saySpell(P.q.say),state.lang)},260)}
    }
  },1000);
}
/* רישום תשובה אחת: סטטיסטיקה, חזרה מרווחת ובנק הטעויות.
   נקרא גם מהתרגול וגם מהגשת המבחן המדומה, ולכן הוא מקבל את
   הפריט במפורש ואינו קורא ל-P. */
function recordItem(tid,lv,id,ok){
  var st=stOf(tid,lv); st.seen++; ok?st.ok++:st.bad++;
  var r=itemRec(id); r.n++; if(ok)r.ok++;
  if(!state.bad)state.bad={};
  if(!ok)state.bad[id]=0;
  else if(state.bad[id]!==undefined){
    state.bad[id]=(state.bad[id]||0)+1;
    if(state.bad[id]>=2)delete state.bad[id];
  }
  touchDay(); state.day.n=(state.day.n||0)+1;
  state.totalAsk++; if(ok)state.totalOk++;
}
function record(ok){
  var q=P.q; if(!q)return;
  recordItem(q.tid,q.lv,q.id,ok);
  save();
}
/* מזהה פריט → הפריט עצמו. הבנק שומר מזהים בלבד, כדי שהוא
   ישרוד שינוי בתוכן ולא יחזיק עותק של שאלה שכבר נערכה. */
function itemAt(id){
  var a=String(id||"").split("|");
  var tp=topicOf(a[0]); if(!tp)return null;
  var lv=parseInt(a[1],10), idx=parseInt(a[2],10);
  var pool=poolOf(tp,lv);
  return (pool&&pool[idx])?{tp:tp,lv:lv,idx:idx,it:pool[idx]}:null;
}
function badList(){
  var out=[],k;
  if(!state.bad)return out;
  for(k in state.bad){
    if(!Object.prototype.hasOwnProperty.call(state.bad,k))continue;
    var r=itemAt(k); if(r)out.push({id:k,tp:r.tp,lv:r.lv,idx:r.idx,it:r.it,s:state.bad[k]||0});
  }
  return out;
}
/* שאלה מפריט מסוים, ולא מהגרלה. משמש את בנק הטעויות. */
function questionAt(id){
  var r=itemAt(id); if(!r)return null;
  var q=buildFromItem(r.it);
  q.tid=r.tp.id; q.lv=r.lv; q.idx=r.idx; q.id=id; q.hint=gl(r.it.hint);
  return q;
}
function answer(i){
  if(P.done)return;
  var q=P.q,o=q.opts[i];
  P.picked=i; P.done=true; P.ok=!!(o&&o.ok);
  record(P.ok);
  render();
  announce(P.ok?t("correct"):t("wrong")+". "+t("answerIs")+" "+q.answer);
  /* המשפט המלא נשמע מיד, גם כשטעו — במיוחד כשטעו. שמיעה של
     המשפט השלם היא מה שקושר את התאריך לסיפור. */
  setTimeout(function(){speak(saySpell(q.say),state.lang)},P.ok?200:420);
}

       התשובה. מי שמנחש לומד פחות ממי שמודה. */
    var q=P.q; if(!q)return;
    P.done=true; P.ok=false; P.picked=-1; record(false); render();
    setTimeout(function(){speak(saySpell(q.say),state.lang)},260);
    return;
  }
  if(a==="lang"){state.lang=LANGS[v]?v:"he";save();render();return}
  if(a==="vmode"){state.voiceMode=v==="gem"?"gem":"device";save();render();return}
  if(a==="vcheck"){voiceCheck();return}
  if(a==="devvoice"||a==="devsample"){
    var lg=el.getAttribute("data-l")||state.lang;
    var code=lg==="en"?EN_TTS:LANGS[lg].tts;
    var uri=el.getAttribute("data-u")||"";
    if(a==="devvoice"){
      if(!state.devVoice)state.devVoice={};
      if(uri)state.devVoice[code]=uri; else delete state.devVoice[code];
      save(); render();
    }
    /* משמיעים תמיד — בחירה בלי לשמוע אינה בחירה. */
    speak(t("heroT"),lg);
    return;
  }
  if(a==="gvoice"){state.gemVoice=gvOf(v).id;save();render();return}
  if(a==="gsample"){
    if(!hasKey()){gkMsg={ok:false,m:t("vNeed")};render();return}
    var vid=gvOf(el.getAttribute("data-v")).id, old=state.gemVoice;
    state.gemVoice=vid; state.voiceMode="gem";
    speak(t("heroT"),state.lang);
    state.gemVoice=old; save(); return;
  }
  if(a==="gkshow"){var inp=$("#gk");var val=inp?inp.value:GKEY;gkShow=!gkShow;render();
    var i2=$("#gk"); if(i2){i2.value=val;i2.focus()} return}
  if(a==="gsave"){testKey();return}
  if(a==="tog"){state[v]=!state[v];save();render();return}
  if(a==="theme"){state.theme=v;save();render();return}
  if(a==="askreset"){askReset=true;render();return}
  if(a==="noreset"){askReset=false;render();return}
  if(a==="doreset"){
    var lg2=state.lang; state=blankState(); state.lang=lg2;
    try{localStorage.removeItem(SKEY)}catch(e){}
    askReset=false; save(); render(); return;
  }
});
document.addEventListener("change",function(e){
  var xs=e.target;
  if(xs&&xs.getAttribute&&xs.getAttribute("data-slide")==="exn"){
    EB.n=clamp(parseInt(xs.value,10)||10,5,25);
    EB.q=null;EB.built=null;render();
  }
});
document.addEventListener("input",function(e){
  /* מחווני בונה המבחן. מעדכנים תווית בלבד ולא מציירים מסך —
     ציור מחדש בונה את המחוון מאפס ומנתק את הגרירה באמצע. */
  var sl=e.target.closest("[data-slide]");
  if(sl){
    var k=sl.getAttribute("data-slide");
    if(k==="exn"){
      EB.n=clamp(parseInt(sl.value,10)||10,5,25);
      var ln=$("#exNlab"); if(ln)ln.textContent=EB.n;
      /* הרשימה מתבטלת כאן ונבנית מחדש רק כשהגרירה נגמרת: ציור
         מחדש באמצע גרירה מנתק אותה. */
      EB.q=null;EB.built=null; return;
    }
    if(k==="exm"){
      EB.mins=clamp(parseInt(sl.value,10)||0,0,90);
      var lm=$("#exMlab"); if(lm)lm.textContent=EB.mins?EB.mins+" "+xt("minutes"):xt("none");
      EB.built=null; return;
    }
  }
  var el=e.target.closest("[data-a='rate']"); if(!el)return;
  state.rate=clamp(parseFloat(el.value)||0.95,0.6,1.3); save();
});
/* Enter ורווח על כרטיס קול — הוא div ולכן המקלדת אינה מקבלת אותו בחינם */
document.addEventListener("keydown",function(e){
  if(e.key!=="Enter"&&e.key!==" ")return;
  var el=e.target.closest("[data-a='gvoice']"); if(!el)return;
  e.preventDefault(); el.click();
});
/* קיצורי מקלדת בתרגול, כמו באפליקציות המתמטיקה: מי שהעכבר קשה לו,
   או שהוא עובד עם מקלדת בלבד, לא אמור להיות תלוי בלחיצה מדויקת.
   1–4 עונה, רווח מקריא שוב, Enter עובר לשאלה הבאה. */
document.addEventListener("keydown",function(e){
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.target&&e.target.closest("input,textarea,select,[contenteditable]"))return;
  if(state.screen!=="prac"||!P.q)return;
  /* רווח או Enter על כפתור ממוקד הם הפעלה שלו — הדפדפן כבר יורה
     click — ולא הקראה חוזרת ולא מעבר לשאלה הבאה. בלי זה, רמקול של
     תא תשובה שהגיעו אליו בטאב הקריא ברווח את השאלה במקום את התא,
     ואחרי שעונים Enter עליו דילג לשאלה הבאה במקום להקריא. */
  if((e.key===" "||e.key==="Enter")&&e.target&&e.target.closest("button,[role='button'],a[href]"))return;
  if(!P.done&&P.q.opts&&/^[1-4]$/.test(e.key)){
    var i=parseInt(e.key,10)-1;
    if(P.q.opts[i]){e.preventDefault();answer(i)}
    return;
  }
  if(e.key===" "){e.preventDefault();speak(saySpell(P.done?P.q.say:(P.q.lead||"")),state.lang);return}
  if(e.key==="Enter"&&P.done){e.preventDefault();newQuestion();return}
});
/* רשימת הקולות של הדפדפן מגיעה מאוחר. בלי הרינדור הזה סרגל מצב
   הקול מכריז "אין קול אנגלי" על מכשיר שיש בו אחד. */
if(window.speechSynthesis){
  try{speechSynthesis.getVoices()}catch(e){}
  speechSynthesis.onvoiceschanged=function(){
    /* הרשימה יכולה להגיע לפני שהמצב נטען. רינדור אז מצייר מסך של
       אפליקציה שעדיין לא קיימת. */
    if(booted)render();
  };
}
window.addEventListener("pagehide",stopSpeak);

/* ============================================================
   11. הפעלה
   ============================================================ */
loadKey();
load();
/* מצב האתגר נולד מאחורי שער פנימי — בלי השער אין כפתור שמכבה אותו.
   מצב שנשמר מפתיחה קודמת היה נשאר דלוק: שאלות מנושא אחר מזה שבכותרת,
   בלי רמז, ועם שעון שמפיל את השאלה — ובלי מתג על המסך. */
if(!CH_GATE)state.challenge=false;
touchDay();
booted=true;
applyModes();
/* חוזרים לאפליקציה באמצע תרגול: השאלה עצמה אינה נשמרת, רק
   המסך. בלי שורה זו המסך נפתח עם כותרת בלבד, בלי שאלה ובלי
   דרך להתחיל — מי שסגר את הדפדפן באמצע תרגול חזר למסך מת. */
if(state.screen==="prac"&&!P.q){
  if(!state.topic||!topicOf(state.topic))state.topic=TOPICS[0].id;
  newQuestion();
}else render();
</script>

<script>
/* ״עזרה מהמורה״ — לימור. התשתית ב-/tutor/tutor.js, ההוראות בשרת
   (tutor-api/worker.js, תפקיד civics). mount מחזיר false כשאין
   כתובת שרת, ואז הכפתור אינו נבנה. */
if(window.TUTOR){
  /* הניסוח שעל המסך מגיע כ-HTML; לשרת נשלח טקסט בלבד. */
  var txt=TUTOR.plain;
  TUTOR.mount({
    app:"hebrew-arab",
    lang:function(){return (typeof state!=="undefined"&&state.lang)||"he"},
    q:function(){
      /* השאלה כאן היא ממשפחת החידון: lead / opts[].h,ok / answer. */
      var x=(typeof P!=="undefined")?P.q:null; if(!x)return null;
      var tp=x.tid?topicOf(x.tid):null;
      return {expr:txt(x.lead||"").trim()||null,
              ans:x.answer?txt(x.answer):null,
              topic:tp?txt(tName(tp)):null,
              level:x.lv!=null?t("lv"+x.lv):null};
    },
    stopHost:function(){try{stopSpeak()}catch(e){}}
  });
  /* חזרה מאמצע תרגול: הרנדר הראשון קודם ל-mount, אז מרנדרים שוב כדי
     שכפתור לימור יופיע גם במסך שאלה משוחזר. */
  if(state.screen==="prac"&&P.q)render();
  /* ---- מנוע המורה — המתאם של האפליקציה ----
     getScreenContext מחזיר מה שמוצג עכשיו, ו-actions הן מה שהמורה
     רשאית לעשות כאן; כל אחת מחזירה true רק כשבאמת קרה משהו. */
  var TUTORENG=window.BARAK||window.LIMOR;
  if(TUTORENG)TUTORENG.register({
    app:"hebrew-arab",
    getScreenContext:function(){
      var x=(typeof P!=="undefined"&&P)?P.q:null;
      if(!x||view!==""||state.screen!=="prac")return null;
      var o=x.opts||[],ok=null,st=null,i;
      var tp=x.tid?topicOf(x.tid):null,tr=tp?trackOf(tp.trk):null;
      for(i=0;i<o.length;i++)if(o[i].ok)ok=txt(o[i].h);
      /* הבחירה השגויה של הלומד — רק אחרי שענה. */
      if(P.done&&!P.ok&&P.picked>=0&&o[P.picked])st=txt(o[P.picked].h);
      return {id:"q"+x.id, type:P.done?"reveal":"mcq",
        q:txt(x.lead), options:o.map(function(p){return txt(p.h)}),
        correct:ok, student:st, topic:tp?txt(tName(tp)):null,
        level:x.lv!=null?t("lv"+x.lv):null,
        curriculum:"ספרות לבגרות"+(tr?" — "+txt(t(tr.nk)):"")+(tp?" — "+txt(tName(tp)):"")};
    },
    actions:{
      next_question:{desc:"עובר לשאלה הבאה; באמצע שאלה — מחליף אותה בשאלה אחרת באותו נושא ורמה",
        run:function(){
          if(view!==""||state.screen!=="prac"||!P.q)return false;
          newQuestion();stopSpeak();window.scrollTo(0,0);return true;
        }},
      show_hint:{desc:"מציג את הרמז לשאלה שעל המסך ומקריא אותו",
        run:function(){
          if(view!==""||state.screen!=="prac"||!P.q||P.done||!P.q.hint)return false;
          if(!P.hint){P.hint=true;render()}
          speak(saySpell(P.q.hint),state.lang);
          return TUTORENG.highlight(document.querySelector(".qhint"));
        }},
      read_aloud:{desc:"מקריא את השאלה והאפשרויות בקול",
        run:function(){
          if(view!==""||state.screen!=="prac"||!P.q||P.done)return false;
          var x=P.q,s2=x.lead+". "+x.opts.map(function(p,i){return (i+1)+". "+txt(p.h)}).join(". ");
          speak(saySpell(s2),state.lang);return true;
        }},
      repeat_question:{desc:"מקריא את השאלה עוד פעם",
        run:function(){
          if(view!==""||state.screen!=="prac"||!P.q)return false;
          speak(saySpell(P.q.lead),state.lang);return true;
        }},
      highlight_option:{desc:"מדגיש במסך אחת מהאפשרויות, לפי מקומה (0 עד 3)",
        params:{index:{type:"integer",min:0,max:3,required:true}},
        run:function(a){
          if(view!==""||state.screen!=="prac"||!P.q||P.done||a.index>=P.q.opts.length)return false;
          return TUTORENG.highlight(document.querySelector('[data-a="pick"][data-i="'+a.index+'"]'));
        }},
      explain_again:{desc:"מקריא שוב את ההסבר המלא, אחרי שהשאלה נענתה",
        run:function(){
          if(view!==""||state.screen!=="prac"||!P.q||!P.done)return false;
          speak(saySpell(P.q.say),state.lang);
          return TUTORENG.highlight(document.querySelector(".fb"));
        }},
      go_screen:{desc:"עובר למסך אחר של האפליקציה",
        params:{name:{type:"string",enum:["home","practice","concepts","progress","settings"],required:true}},
        run:function(a){
          /* במבחן (view אינו ריק) אין מעבר מסכים — המבחן נשלט
             על ידי התלמיד בלבד. */
          if(view!=="")return false;
          var map={home:"home",practice:"prac",concepts:"form",progress:"prog",settings:"set"};
          state.screen=map[a.name]||"home";
          if(state.screen==="prac"&&!state.topic)state.topic=TOPICS[0].id;
          if(state.screen==="prac"&&!P.q)newQuestion();else{stopSpeak();render()}
          window.scrollTo(0,0);return true;
        }},
      concept_sheet:{desc:"פותח את דף המושגים",
        run:function(){
          if(view!=="")return false;
          state.screen="form";stopSpeak();render();window.scrollTo(0,0);return true;
        }}
    }
  });
}
</script>
