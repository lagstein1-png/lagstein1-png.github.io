<style>
/* ============================================================
   עברית לדוברי ערבית — עברית לבגרות
   קהל היעד הוא תלמידי החינוך הערבי הלומדים עברית. הוא נכשל בה שוב
   ושוב, מפני
   שהמקצוע כולו טקסט ומושגים — ולכן כל החלטה כאן נמדדת בשאלה
   אחת: האם היא מורידה עומס, או מוסיפה.
   · כל שאלה נושאת רמז שאינו התשובה, והסבר שנפתח גם כשצדקו.
   · שום טקסט לא מוצג בלי שאפשר לשמוע אותו.
   · שפת האם אינה קישוט: מושג נלמד קודם בשפה שחושבים בה.
   כל המידות ב-rem, כדי שהגדלת טקסט תגדיל את הכול יחד.
   ============================================================ */
:root{
  --font:"Heebo","Rubik",system-ui,"Segoe UI",Arial,sans-serif;
  --en:"Lexend","Heebo",system-ui,"Segoe UI",Arial,sans-serif;
  --ar:"Noto Sans Arabic",system-ui,"Segoe UI",Arial,sans-serif;
  --ru:"Noto Sans","Heebo",system-ui,"Segoe UI",Arial,sans-serif;   /* קירילית — Heebo אינו מכיל אותה */
  --bg:#f5f7fb; --surface:#ffffff; --surface2:#e8ecf6;
  --ink:#101828; --muted:#55607a; --faint:#6f7a95; --line:#dde3f0;
  --accent:#1d4ed8; --accent-ink:#ffffff; --accent-soft:#dbe4fe;
  --gold:#a16207; --gold-soft:#fbf0d5; --hit:#f5c451; --hit-ink:#1a1300;
  --ok:#15803d; --ok-soft:#dcfce7; --bad:#be123c; --bad-soft:#ffe4e9;
  --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px -12px rgba(16,24,40,.2);
  --r:14px;
  /* צבע לכל מסלול. לא קישוט: ארבעה סוגי לימוד שונים לגמרי, וצבע
     קבוע לכל אחד חוסך למי שמתקשה להתמצא את השאלה "איפה אני". */
  --c-sound:#0369a1; --cs-sound:#dbeefc;   /* צליל ואות   */
  --c-words:#15803d; --cs-words:#dcfce7;   /* מילים       */
  --c-talk:#b43a0a;  --cs-talk:#fde5d8;    /* מדוברת — #c2410c היה 4.28:1 על ה-cs (30.9) */
  --c-read:#6d28d9;  --cs-read:#eae2fd;    /* ספרותית     */
}
:root[data-theme="dark"]{
  --bg:#0e1425; --surface:#17203a; --surface2:#202c4d;
  --ink:#e8edf8; --muted:#9aa5c0; --faint:#78829e; --line:#2a3762;
  --accent:#93c5fd; --accent-ink:#0e1425; --accent-soft:#1b2a5c;
  --gold:#fbbf24; --gold-soft:#33270f; --hit:#ffd24d; --hit-ink:#241a00;
  --ok:#4ade80; --ok-soft:#132a1c; --bad:#fb7185; --bad-soft:#33161f;
  --warn:#fbbf24; --warn-soft:#33260f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  --c-sound:#7dd3fc; --cs-sound:#0b2a3d;
  --c-words:#86efac; --cs-words:#0f2a1a;
  --c-talk:#fdba74;  --cs-talk:#3a2113;
  --c-read:#c4b5fd;  --cs-read:#261a45;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1425; --surface:#17203a; --surface2:#202c4d;
    --ink:#e8edf8; --muted:#9aa5c0; --faint:#78829e; --line:#2a3762;
    --accent:#93c5fd; --accent-ink:#0e1425; --accent-soft:#1b2a5c;
    --gold:#fbbf24; --gold-soft:#33270f; --hit:#ffd24d; --hit-ink:#241a00;
    --ok:#4ade80; --ok-soft:#132a1c; --bad:#fb7185; --bad-soft:#33161f;
    --warn:#fbbf24; --warn-soft:#33260f;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
    --c-sound:#7dd3fc; --cs-sound:#0b2a3d;
    --c-words:#86efac; --cs-words:#0f2a1a;
    --c-talk:#fdba74;  --cs-talk:#3a2113;
    --c-read:#c4b5fd;  --cs-read:#261a45;
  }
}
/* ניגודיות גבוהה — שחור על לבן, מסגרות מלאות, בלי גוונים רכים */
:root.hc{
  --bg:#ffffff; --surface:#ffffff; --surface2:#ffffff;
  --ink:#000000; --muted:#1a1a1a; --faint:#333333; --line:#000000;
  --accent:#00434b; --accent-ink:#ffffff; --accent-soft:#e6f2f3;
  --gold:#5c3d00; --gold-soft:#f7efdf; --hit:#ffe600; --hit-ink:#000000;
  --ok:#0a5c2a; --ok-soft:#e6f4ea; --bad:#8c0f2c; --bad-soft:#fbe9ed;
  --warn:#6b3d00; --warn-soft:#f7efdf; --shadow:none;
  --c-sound:#00305c; --cs-sound:#e8eef7;
  --c-words:#0a5c2a; --cs-words:#e6f4ea;
  --c-talk:#7a2c00;  --cs-talk:#f9ece4;
  --c-read:#3d1a75;  --cs-read:#eee8f9;
}
:root.hc *{box-shadow:none!important}
:root.hc .card,:root.hc .btn,:root.hc .opt{border-width:2px!important}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs,17px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  font-size:1rem;line-height:1.65;-webkit-text-size-adjust:100%}
:root.clear body{font-family:"Verdana","Tahoma","Heebo",sans-serif;letter-spacing:.012em}
:root.spaced body{word-spacing:.22em;line-height:1.95}
:root.rm *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
h1,h2,h3{margin:0;line-height:1.3;font-weight:800}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}
/* כרטיס ״מבנה הבגרות״ (--gold-soft): הקישור לאתר משרד החינוך בלי צבע נפל לכחול ברירת המחדל — 1.55:1 בכהה (30.9) */
.gcard a{color:var(--accent)}
.skip{position:absolute;inset-inline-start:-9999px}
.skip:focus{position:static;display:inline-flex;align-items:center;min-height:44px;
  margin:8px;padding:8px 14px;background:#0b7c71;color:#fff;
  border-radius:8px;font-weight:700;text-decoration:none;z-index:100}

/* כל טקסט אנגלי — כיוון, גופן ומרווח משלו. unicode-bidi:isolate מונע
   מהמשפט האנגלי לגרור אחריו את סימני הפיסוק של המשפט העברי. */
.en{font-family:var(--en);direction:ltr;unicode-bidi:isolate;text-align:start}
.en-b{font-family:var(--en);direction:ltr;unicode-bidi:isolate;display:inline-block}

.wrap{max-width:56rem;margin:0 auto;padding:0 clamp(.9rem,3vw,1.5rem)}
.hbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-block:.6rem}
:root.hc .hbar{background:var(--bg);backdrop-filter:none}
.hrow{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
.brand{font-size:1.35rem;font-weight:800;letter-spacing:-.01em;display:flex;
  align-items:baseline;gap:.5rem;margin-inline-end:auto}
.brand small{font-size:.72rem;font-weight:600;color:var(--muted);letter-spacing:.06em}
.gbtn{display:inline-flex;align-items:center;gap:.4rem;background:var(--surface);
  border:1px solid var(--line);border-radius:999px;padding:.42rem .8rem;cursor:pointer;
  font-size:.86rem;font-weight:600;box-shadow:var(--shadow);min-height:44px}
.gbtn:hover{border-color:var(--accent)}
.gbtn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:1.1rem}
.grid{display:grid;gap:.85rem}
@media(min-width:640px){.g2{grid-template-columns:1fr 1fr}}
@media(min-width:900px){.g3{grid-template-columns:repeat(3,1fr)}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;
  border:1px solid var(--line);background:var(--surface);border-radius:12px;
  padding:.72rem 1.1rem;font-weight:700;cursor:pointer;box-shadow:var(--shadow);
  min-height:2.9rem;font-size:1rem}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;box-shadow:none}
.btn[disabled]{opacity:.45;cursor:default}
.btn.wide{width:100%}

.chip{display:inline-flex;align-items:center;gap:.35rem;border-radius:999px;
  padding:.22rem .6rem;font-size:.78rem;font-weight:700;background:var(--surface2);color:var(--muted)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}

/* גופני שפה: Heebo אינו מכיל ערבית וקירילית, ולכן שפת הממשק
   מחליפה גופן ולא רק כיוון. */
html[lang="ar"] body,html[lang="ar"] input,html[lang="ar"] button,
html[lang="ar"] textarea,html[lang="ar"] select{font-family:var(--ar)}
html[lang="ru"] body,html[lang="ru"] input,html[lang="ru"] button,
html[lang="ru"] textarea,html[lang="ru"] select{font-family:var(--ru)}
button[data-a="lang"][lang="ar"]{font-family:var(--ar)}
button[data-a="lang"][lang="ru"]{font-family:var(--ru)}

/* ===== מסלולים: הצבע נכנס ככרטיס, לא כרקע של טקסט ===== */
.trk{--c:var(--accent);--cs:var(--accent-soft)}
.t-sound{--c:var(--c-sound);--cs:var(--cs-sound)}
.t-words{--c:var(--c-words);--cs:var(--cs-words)}
.t-talk{--c:var(--c-talk); --cs:var(--cs-talk)}
.t-read{--c:var(--c-read); --cs:var(--cs-read)}
.tcard{border-inline-start:5px solid var(--c);cursor:pointer;text-align:start;width:100%;
  display:flex;flex-direction:column;gap:.4rem;align-items:stretch}
.tcard:hover{border-color:var(--c)}
.tcard h3{font-size:1.05rem}
.tcard .sub{font-size:.85rem;color:var(--muted)}
.tdot{width:.62rem;height:.62rem;border-radius:50%;background:var(--c);flex:none}
.thead{display:flex;align-items:center;gap:.5rem}
.tpill{background:var(--cs);color:var(--c);border-radius:999px;padding:.15rem .55rem;
  font-size:.72rem;font-weight:800}

/* ===== סרגל שליטה ברמות ===== */
.lvls{display:flex;gap:.4rem;flex-wrap:wrap}
.lvl{border:1px solid var(--line);background:var(--surface);border-radius:10px;
  padding:.4rem .7rem;font-size:.82rem;font-weight:700;cursor:pointer;
  display:inline-flex;align-items:center;gap:.4rem}
.lvl.on{background:var(--c,var(--accent));color:var(--accent-ink);border-color:var(--c,var(--accent))}
.bar{height:.42rem;border-radius:999px;background:var(--surface2);overflow:hidden;flex:1;min-width:3rem}
.bar i{display:block;height:100%;background:var(--c,var(--accent))}
.bar.b0 i{background:var(--bad)} .bar.b1 i{background:var(--warn)} .bar.b2 i{background:var(--ok)}

/* ===== תרגול ===== */
.qcard{border-top:5px solid var(--c,var(--accent))}
.qtop{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.7rem}
.qtext{font-size:1.12rem;font-weight:600;margin:.2rem 0 .3rem}
.qhint{color:var(--muted);font-size:.9rem}
/* המילה או המשפט שנלמדים. גדול, מרווח, ותמיד לצד כפתור השמעה. */
.subject{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;
  background:var(--surface2);border-radius:12px;padding:.85rem 1rem;margin:.5rem 0}
.subject .word{font-family:var(--en);direction:ltr;unicode-bidi:isolate;
  font-size:1.7rem;font-weight:700;letter-spacing:.01em;line-height:1.25}
.subject .ipa{font-family:var(--en);direction:ltr;unicode-bidi:isolate;
  color:var(--muted);font-size:.95rem}
.spk{border:1px solid var(--line);background:var(--surface);border-radius:999px;
  width:2.7rem;height:2.7rem;display:inline-flex;align-items:center;justify-content:center;
  cursor:pointer;flex:none;box-shadow:var(--shadow)}
.spk:hover{border-color:var(--accent);color:var(--accent)}
.spk.sm{width:2.1rem;height:2.1rem;background:#0b7c71;border-color:#0b7c71;color:#fff}
/* הרמקול הקטן — אותו ירוק של כפתור ההקראה הגדול, התקן המשותף */
.spk.sm:hover{background:#0b7c71;border-color:#0b7c71;color:#fff}
.spk.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.opts{display:grid;gap:.6rem;margin-top:.9rem}
.orow{display:flex;gap:.45rem;align-items:center;min-width:0}
/* min-width:0 — פריט grid נולד עם min-width:auto, ולכן משפט ארוך
   באפשרות היה מרחיב את השורה מעבר למכל ודוחף את הרמקול מחוץ למסך. */
.orow .opt{flex:1;min-width:0}
@media(min-width:560px){.opts.two{grid-template-columns:1fr 1fr}}
.opt{display:flex;align-items:center;gap:.6rem;text-align:start;width:100%;
  border:2px solid var(--line);background:var(--surface);border-radius:12px;
  padding:.8rem .9rem;cursor:pointer;font-size:1.02rem;font-weight:600;min-height:3.1rem}
.opt:hover{border-color:var(--accent)}
.opt .k{width:1.9rem;height:1.9rem;border-radius:8px;background:var(--surface2);
  display:inline-flex;align-items:center;justify-content:center;font-size:.85rem;
  font-weight:800;color:var(--muted);flex:none}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .k{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .k{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.55}
/* בחירה במבחן היא בחירה, לא תשובה נכונה. במסכי התרגול הצבע
   הירוק אומר "צדקת", ובמבחן אסור לו להופיע כלל — הוא נותן
   משוב שגוי לכל בחירה. ניטרלי, ורק מסמן מה סומן. */
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);margin-inline-start:3px}
.dot.ok{background:var(--ok);border-color:var(--ok)}
.dot.no{background:var(--bad);border-color:var(--bad)}
.dot.flag{box-shadow:0 0 0 2px var(--accent)}

/* אריחי בניית משפט. הסדר הוא התרגיל, ולכן האריח חייב להיראות כמשהו
   שאפשר להרים — מסגרת מלאה ורקע משלו, לא טקסט על רקע הכרטיס. */
.tiles{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:.7rem}
.tile{font-family:var(--en);direction:ltr;border:2px solid var(--line);
  background:var(--surface);border-radius:10px;padding:.5rem .8rem;font-weight:600;
  cursor:pointer;font-size:1.02rem;min-height:2.7rem}
.tile:hover{border-color:var(--accent)}
.slot{min-height:3.2rem;border:2px dashed var(--line);border-radius:12px;
  background:var(--surface2);padding:.5rem;display:flex;flex-wrap:wrap;gap:.45rem;
  align-items:center;direction:ltr}
.slot.ok{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.slot.bad{border-style:solid;border-color:var(--bad);background:var(--bad-soft)}
.slot .tile{background:var(--surface)}

/* ===== משוב ===== */
.fb{margin-top:.9rem;border-radius:12px;padding:.85rem 1rem;border:1px solid transparent}
.fb.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.fb.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.fb b{display:block;font-size:1.02rem;margin-bottom:.2rem}
.fb .body{color:var(--ink);font-weight:500;font-size:.95rem}
.why{margin-top:.55rem;padding-top:.55rem;border-top:1px dashed currentColor;color:var(--ink);
  font-weight:500;font-size:.93rem}

/* ===== קטע קריאה ===== */
/* איור בתוך כרטיס שאלה. הצבע יורש מ-color, ולכן אותו SVG נראה
   נכון גם בערכה הבהירה וגם בכהה בלי גרסה שנייה. */
.figure{margin:.7rem 0;padding:.6rem;border:1px solid var(--line);border-radius:12px;
  background:var(--surface2);color:var(--ink);overflow-x:auto}
.figure svg{display:block;max-width:100%}
/* המבחן המדומה: השאלות זו אחר זו, כמו חוברת בחינה. */
.simq{border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;margin:.8rem 0;
  background:var(--surface)}
.simq.miss{border-color:var(--warn)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.simn{font-weight:800;color:var(--muted);font-size:.86rem}
.simbar{position:sticky;top:0;z-index:5;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:.6rem .8rem;margin:.8rem 0;display:flex;gap:.6rem;
  align-items:center;flex-wrap:wrap;box-shadow:var(--shadow)}
.clock{font-weight:800;font-variant-numeric:tabular-nums;font-size:1.1rem}
.clock.low{color:var(--bad)}
.passage{background:var(--surface2);border-radius:12px;padding:1rem 1.1rem;margin:.6rem 0;
  font-family:var(--en);direction:ltr;unicode-bidi:isolate;font-size:1.08rem;line-height:2}
.passage .s{border-radius:5px;padding:.05em .12em;cursor:pointer}
.passage .s:hover{background:var(--accent-soft)}
.passage .s.now{background:var(--accent-soft);box-shadow:0 2px 0 var(--accent)}
.wd{border-radius:5px;padding:1px 3px}
.wd.hit{background:var(--hit);color:var(--hit-ink);font-weight:600}

   באנדרואיד — אין מה להדגיש מילה־מילה, ואז מודגש כל האיבר. הכלל
   שקיים כאן מכוון למשפט בתוך קטע קריאה בלבד, ולכן ההדגשה החלופית
   על איבר אחר לא נראתה כלל. */
.wd.now,p.now,div.now,span.now,b.now{background:var(--hit);color:var(--hit-ink);
  border-radius:8px;box-shadow:0 0 0 4px var(--hit)}
.gloss{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.5rem}
.gword{border:1px solid var(--line);background:var(--surface);border-radius:999px;

/* ===== סרגל מצב הקול ===== */
.vstrip{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;border-radius:10px;
  padding:.45rem .7rem;font-size:.85rem;font-weight:600;margin-bottom:.7rem}
.vstrip.ok{background:var(--ok-soft);color:var(--ok)}

.row{display:flex;align-items:center;justify-content:space-between;gap:.8rem;
  padding:.7rem 0;border-bottom:1px solid var(--line);flex-wrap:wrap}

.row .lab{font-weight:700}
.row .desc{font-size:.85rem;color:var(--muted);font-weight:500}
.sw{width:3.2rem;height:1.8rem;border-radius:999px;background:var(--surface2);
  border:1px solid var(--line);position:relative;cursor:pointer;flex:none}
.sw i{position:absolute;top:.18rem;inset-inline-start:.2rem;width:1.3rem;height:1.3rem;
  border-radius:50%;background:var(--faint);transition:.15s}
.sw.on{background:var(--accent);border-color:var(--accent)}
.sw.on i{inset-inline-start:1.5rem;background:#fff}

.vopt{display:flex;align-items:center;gap:.6rem;border:2px solid var(--line);

.vopt .nm{font-weight:700}

input[type=range]{width:100%;accent-color:var(--accent)}

.fbar{border-top:1px solid var(--line);margin-top:2rem;padding-block:1rem;
  color:var(--muted);font-size:.82rem}   /* --faint יצא 2.96:1 */
.hidden{display:none!important}

/* ---------- שדה קלט של המבחן ----------
   מודול המבחן הועתק לכאן מאפליקציה שבה .field כבר היה מוגדר.
   בלי הכלל הזה שדה השם של הנבחן נשאר תיבת ברירת המחדל של
   הדפדפן — 21 פיקסלים גובה, הרבה מתחת ליעד המגע של 44. */
.field{width:100%;box-sizing:border-box;font:inherit;font-size:1rem;
  min-height:48px;padding:12px 14px;border-radius:11px;outline:none;background:var(--surface2);color:inherit;border:1px solid var(--line)}
.field:focus{border-color:var(--accent)}

/* ---------- שורות המבחן ----------
   .tog הגיע ממודול המבחן שהועתק לכאן, ולא היה לו עיצוב כלל: השם
   והמידע שמתחתיו נדבקו לשורה אחת בלי רווח. */
.tog{display:flex;align-items:center;gap:13px;width:100%;text-align:start;
  background:var(--surface2);border:1px solid transparent;border-radius:12px;
  padding:13px 15px;min-width:0}

.tog .tt{flex:1;min-width:0}

/* יעד מגע לקישור התחתית. קישור טקסט בשורה יוצא בגובה הטקסט —
   15 פיקסלים — וזה קטן מדי לאצבע, גם כשהוא רק לתנאי השימוש. */
.lg-foot a{display:inline-flex;align-items:center;min-height:44px;padding-inline:6px}

/* ---------- יעדי מגע ----------
   .lvl יצא 39 פיקסלים ומתג ה-.sw רק 31, שניהם מתחת ל-44 שהפרויקט
   מחייב את עצמו בהם. במתג לא מגדילים את המסילה — היא תיראה מגושמת —
   אלא מרחיבים את שטח הלחיצה סביבה. */
.lvl{min-height:44px}
.sw{position:relative}

/* ---------- מסך בניית המבחן ----------
   .seg ו-.tpc הגיעו עם מודול המבחן שהועתק לכאן, ולא היה להם עיצוב:
   כפתורי הבחירה יצאו 34 פיקסלים, וכרטיסי הנושאים 6 פיקסלים בלבד —
   כלומר המורה לא יכול היה לבחור נושאים בכלל. */
.seg{display:flex;gap:6px;flex-wrap:wrap}

.tpc{position:relative;display:flex;flex-direction:column;gap:9px;text-align:start;
  background:var(--surface);border:1px solid var(--line);
  border-inline-start:4px solid var(--c,var(--accent));border-radius:12px;padding:14px;
  box-shadow:var(--shadow);min-width:0;min-height:44px;cursor:pointer;font:inherit;color:inherit}
.tpc.on{border-color:var(--accent);background:var(--accent-soft)}
.tpc .tn{font-weight:700;font-size:.98rem;overflow-wrap:anywhere;color:var(--c,var(--ink))}
.tpc .td{color:var(--muted);font-size:.8rem;overflow-wrap:anywhere}

/* טקסט על רקע ההדגשה: --accent-ink ולא לבן קבוע. במצב כהה
   ההדגשה בהירה, ולבן עליה יצא 1.5–2.0:1 — כמעט בלתי קריא. */
/* ---------- מצב מורה ---------- */

/* --- מנוע ההדגמה. הקוד כאן זהה בכל האפליקציות; רק DEMO_SCRIPT משתנה. --- */
var DEMO={on:false,i:0,timer:null,extra:[],bar:null,txt:null,step:null,fill:null,btn:null};

/* עוזרים לתסריט. כולם מחזירים false כשהאיבר אינו על המסך, כדי
   שצעד שלא מצא את מה שחיפש ידלג ולא יפיל את ההדגמה כולה. */
function demoEl(s){return typeof s==="string"?document.querySelector(s):s}
function demoShow(s){
  var e=demoEl(s); if(!e)return false;
  try{e.scrollIntoView({behavior:"smooth",block:"center"})}catch(err){try{e.scrollIntoView()}catch(err2){}}
  return true;
}
/* מדגיש את האיבר, ורק אז לוחץ — צופה שלא ראה לאן נלחץ לא הבין
   מה קרה. לכן אין צעד קצר מ-1200 אלפיות בתסריטים. */
function demoTap(s){
  var e=demoEl(s); if(!e||e.disabled)return false;
  demoShow(e);
  e.classList.add("demo-tap");
  DEMO.extra.push(setTimeout(function(){
    e.classList.remove("demo-tap");
    /* המסך מצטייר מחדש כל הזמן. אם האיבר שסומן כבר אינו במסמך,
       מחפשים אותו שוב לפי אותו בורר — לחיצה על איבר מת אינה
       עושה דבר, וזה בדיוק צעד שנראה כאילו נתקע. */
    var live=(typeof s==="string"&&!document.contains(e))?demoEl(s):e;
    if(DEMO.on&&live&&!live.disabled&&document.contains(live))try{live.click()}catch(err){}
  },430));
  return true;
}
function demoClick(s){
  var e=demoEl(s); if(!e||e.disabled)return false;
  try{e.click()}catch(err){return false}
  return true;
}
/* הקלדה אות אחר אות, עם אירוע input אמיתי — שדה חיפוש שמאזין
   ל-input לא היה מגיב להשמה ישירה ל-value. */
function demoType(s,text){
  var e=demoEl(s); if(!e)return false;
  demoShow(e); try{e.focus()}catch(err){}
  e.value=""; var i=0;
  var t=setInterval(function(){
    if(!DEMO.on||!e.parentNode){clearInterval(t);return}
    e.value=String(text).slice(0,++i);
    e.dispatchEvent(new Event("input",{bubbles:true}));
    if(i>=String(text).length)clearInterval(t);
  },85);
  DEMO.extra.push(t);
  return true;
}
function demoQuiet(){
  try{if(window.speechSynthesis)speechSynthesis.cancel()}catch(e){}
  try{if(typeof stopSpeak==="function")stopSpeak()}catch(e){}
}

function demoMountUI(){
  var st=document.createElement("style");
  st.id="demo-style"; st.textContent=DEMO_CSS;
  (document.head||document.documentElement).appendChild(st);

  var b=document.createElement("button");
  b.id="demo-start"; b.type="button";
  b.innerHTML='<span aria-hidden="true">▶</span><span>התחל הדגמה</span>';
  b.addEventListener("click",demoStart);
  document.body.appendChild(b);

  var bar=document.createElement("div");
  bar.id="demo-bar"; bar.hidden=true;
  bar.setAttribute("role","status");
  bar.setAttribute("aria-live","polite");
  bar.innerHTML='<div id="demo-sub"><p id="demo-txt"></p>'+
    '<div id="demo-meta"><span id="demo-step"></span>'+
    '<button id="demo-exit" type="button">יציאה · ESC</button></div>'+
    '<div id="demo-prog"><i></i></div></div>';
  document.body.appendChild(bar);

  DEMO.btn=b; DEMO.bar=bar;
  DEMO.txt=document.getElementById("demo-txt");
  DEMO.step=document.getElementById("demo-step");
  DEMO.fill=bar.querySelector("#demo-prog i");
  document.getElementById("demo-exit").addEventListener("click",function(){demoStop()});
  document.addEventListener("keydown",demoKey,true);
}

/* ESC יוצא. הקשבה בשלב הלכידה, כדי שמסך שכבר מטפל ב-Escape
   לא יבלע את המקש לפני שההדגמה ראתה אותו. */
function demoKey(e){
  if(!DEMO.on)return;
  if(e.key==="Escape"||e.keyCode===27){
    e.preventDefault(); e.stopPropagation();
    demoStop();
  }
}

function demoStart(){
  if(DEMO.on)return;
  DEMO.on=true; DEMO.i=0;
  DEMO.btn.hidden=true; DEMO.bar.hidden=false;
  document.documentElement.classList.add("demo-running");
  demoNext();
}

function demoNext(){
  if(!DEMO.on)return;
  if(DEMO.i>=DEMO_SCRIPT.length){demoStop();return}
  var it=DEMO_SCRIPT[DEMO.i++]||{};
  var d=Math.max(600,it.duration||3000);
  DEMO.txt.textContent=it.subtitle||"";
  DEMO.step.textContent=DEMO.i+" / "+DEMO_SCRIPT.length;
  DEMO.fill.style.transition="none"; DEMO.fill.style.width="0";
  void DEMO.fill.offsetWidth;
  DEMO.fill.style.transition="width "+d+"ms linear";
  DEMO.fill.style.width="100%";
  if(typeof it.action==="function"){
    try{it.action()}catch(err){if(window.console)console.warn("demo:",err)}
  }
  DEMO.timer=setTimeout(demoNext,d);
}

function demoStop(){
  DEMO.on=false;
  if(DEMO.timer){clearTimeout(DEMO.timer);DEMO.timer=null}
  DEMO.extra.forEach(function(t){clearTimeout(t);clearInterval(t)});
  DEMO.extra=[];
  var m=document.querySelectorAll(".demo-tap"),i;
  for(i=0;i<m.length;i++)m[i].classList.remove("demo-tap");
  if(DEMO.bar)DEMO.bar.hidden=true;
  if(DEMO.btn)DEMO.btn.hidden=false;
  document.documentElement.classList.remove("demo-running");
  demoQuiet();
}

}

   ברוסית לא אמור להיתקל קודם במסך בעברית שאינו יכול לקרוא. */
/* אנגלית אינה סימן. טלפון בישראל מדווח אנגלית כברירת מחדל של
   המכשיר, לא כבחירה, והאפליקציה נפתחה באנגלית למי שבא ללמוד
   בעברית. ערבית ורוסית כן נחשבות — שם זו שפת אם של ממש. מי
   שרוצה אנגלית בוחר אותה, והבחירה נשמרת. */
function guessLang(){
  var ls=(navigator.languages||[navigator.language||"he"]).map(function(x){
    return String(x).toLowerCase().split("-")[0]});
  for(var i=0;i<ls.length;i++){

    if(c==="en")continue;
    if(LANGS[c])return c;
  }
  return "he";
}
function touchDay(){
  var d=todayIso();

    var y=new Date(Date.now()-86400000);
    var yi=y.getFullYear()+"-"+String(y.getMonth()+1).padStart(2,"0")+"-"+String(y.getDate()).padStart(2,"0");
    state.streak=(state.lastDay===yi)?(state.streak||0)+1:1;
    state.lastDay=d; state.day={d:d,n:0};
  }
}
function stKey(tid,lv){return tid+"|"+lv}

function mastery(tid,lv){
  var s=state.stats[stKey(tid,lv)];

function allVoices(){try{return window.speechSynthesis?(speechSynthesis.getVoices()||[]):[]}catch(e){return[]}}
/* הקולות נטענים אסינכרונית, ורק אז נורה voiceschanged. מי שמקריא
   לפני כן מקבל את ברירת המחדל של הדפדפן — לרוב קול אנגלי, גם כשמותקן
   קול עברי טוב. onvoiceschanged לבדו אינו פתרון: הוא מרענן תפריט,
   הוא לא מעכב את האמירה הראשונה. */
var _voicesP=null;
function voicesReady(){
  if(_voicesP)return _voicesP;
  _voicesP=new Promise(function(done){
    if(!("speechSynthesis" in window)){done();return}
    if(allVoices().length){done();return}
    var poll=null,cap=null,fired=false;
    function finish(){
      if(fired)return; fired=true;
      clearInterval(poll); clearTimeout(cap);
      try{speechSynthesis.removeEventListener("voiceschanged",finish)}catch(e){}
      done();
    }
    try{speechSynthesis.addEventListener("voiceschanged",finish)}catch(e){}
    /* Safari לא תמיד יורה את האירוע — לכן גם דגימה */
    poll=setInterval(function(){if(allVoices().length)finish()},120);
    /* תקרה: יש מכשירים שמחזירים רשימה ריקה לצמיתות ומדברים מצוין.
       עדיף לדבר בקול ברירת מחדל מאשר לשתוק לנצח. */
    cap=setTimeout(finish,4000);
  });
  return _voicesP;
}
var LANG_HINT={he:/עברית|hebrew|ivrit/i,ar:/العربية|arabic/i,ru:/русский|russian/i,en:/english/i};
/* שמות שהמערכות באמת מתקינות. חסרו כאן קולות ערביים ורוסיים,

   וההכרעה נפלה על התאמת אזור מדויקת. כך נבחר קול גברי כשקיים
   קול נשי באותה שפה. */
var V_F=/(הילה|כרמית|زارية|سلمى|أمينة|امينة|هدى|فاطمة|ليلى|نورا|светлана|дарья|ирина|екатерина|татьяна|елена|female|woman|#female|\bfem\b|carmit|hila|\bmiri\b|\bdana\b|shira|samantha|karen|moira|tessa|serena|victoria|\bava\b|allison|susan|vicki|nicky|\bzoe\b|fiona|\bkate\b|shelley|zira|hazel|aria|jenny|michelle|\bana\b|\beva\b|emma|libby|sonia|natasha|clara|\bamber\b|ashley|\bcora\b|elizabeth|monica|\bsara\b|\bsarah\b|\bjane\b|\bnancy\b|\bluna\b|\bmolly\b|irina|milena|svetlana|dariya|\belena\b|katja|ekaterina|\bkatya\b|tatyana|\balena\b|hoda|salma|zariyah|amina|\bhala\b|noura|laila|layla|fatima|zeina|\biman\b|\brana\b|\bsana\b|maryam|asma|heera|raveena|swara|neerja)/
var V_M=/(google[^a-z]{0,15}(arabic|العربية)|אברי|אסף|حامد|ماجد|طارق|ناصر|بسام|дмитрий|павел|юрий|максим|николай|\bmale\b|\bman\b|#male|asaf|avri|yoni|moshe|\balex\b|daniel|\bfred\b|\btom\b|aaron|arthur|oliver|rishi|gordon|\blee\b|ralph|bruce|david|\bmark\b|\bguy\b|ryan|christopher|\beric\b|brian|andrew|roger|steffan|liam|william|george|james|\bthomas\b|benjamin|brandon|\bjason\b|\btony\b|dmitry|pavel|\byuri\b|artemi|maxim|nikolai|maged|tarik|naayf|hamed|shakir|\bomar\b|tarek|\bali\b|bassel|\bmoaz\b|hamdan|saleh|abdullah|\btaim\b|fahed|rakan|yasser|hemant|madhur|prabhat)/

  return V_F.test(n)?"f":V_M.test(n)?"m":"?"}
function voicesFor(code){

/* אין קול נשי בשפה שמוצגת? femLift מרים את הגובה, וזה כל מה
   שדפדפן יכול לעשות בלי הקלטות ובלי שירות חיצוני. ההודעה מסבירה
   את זה ומצרפת את ההוראות למערכת ההפעלה שהמשתמש נמצא בה — קול
   נשי שמותקן נבחר מיד, בלי שינוי הגובה ובלי הודעה. */
function femNote(pool){
  if(!pool||!pool.length)return "";
  for(var i=0;i<pool.length;i++)if(vGender(pool[i])==="f")return "";
  /* המסלול נכתב למערכת שהמשתמש נמצא בה עכשיו. אנדרואיד של גוגל
     מחזיק את ההגדרה תחת "נגישות" — "ניהול כללי" הוא מסלול של
     סמסונג בלבד; אייפד מדווח מאז iPadOS 13 כמו מק ונבדל ממנו רק
     במסך מגע; ומשתמש מק קיבל עד כה הוראות של ווינדוס, כי כל מה
     שאינו אנדרואיד או אייפון נפל לשם. */
  var ua=navigator.userAgent||"";
  var how=/Android/i.test(ua)?"femAndroid"
         :(/iPhone|iPad|iPod/i.test(ua)||(/Macintosh/i.test(ua)&&navigator.maxTouchPoints>1))?"femIos"
         :/Mac OS X|Macintosh/i.test(ua)?"femMac":"femWin";
  return t("femNone")+" "+t(how);
}

      out+='<p class="chip bad" style="margin:.4rem 0">'+esc(t("vNoneLang"))+"</p>";

       הזה הקול הגברי נראה כמו בחירה של האפליקציה ולא כמו מה שיש
       במכשיר, ואין שום רמז שאפשר להתקין קול נשי ולקבל אותו מיד. */
    var fnote=femNote(pool);

function vchkT(){ var g=state.lang||"he"; return VCHKMSG[g]||VCHKMSG.he }
function voiceCheck(){
  var M=vchkT();
  VCHK=M.sent; render();
  function show(m){ VCHK=m; render() }
  if(!("speechSynthesis" in window)){ show(M.noSup); return }
  var list=[]; try{ list=speechSynthesis.getVoices()||[] }catch(e){}
  try{ speechSynthesis.cancel() }catch(e){}
  var u;
  try{ u=new SpeechSynthesisUtterance(M.say) }
  catch(e){ show(M.mkFail+e.message); return }
  u.lang=(LANGS[state.lang||"he"]||LANGS.he).tts; u.volume=1; u.rate=1; u.pitch=1;
  var done=false;
  u.onstart=function(){ done=true; show(M.okN[0]+list.length+M.okN[1]) };
  u.onerror=function(e){ done=true;
    var er=(e&&e.error)||M.unk;
    if(er==="interrupted"||er==="canceled"){ show(M.ok); return }
    show(M.engine[0]+er+" · "+list.length+M.engine[1]); };
  try{ speechSynthesis.speak(u) }
  catch(e){ show(M.spFail+e.message); return }
  setTimeout(function(){ if(!done)
    show(M.timeout[0]+list.length+M.timeout[1]) },2000);
}

/* ------------------------------------------------------------
   דור ההקראה. speechSynthesis.cancel() אינו מבטל setTimeout:
   כרום יורה onend על האמירה שבוטלה, המקטע הבא נרשם בכל זאת,
   וכעבור SEG_GAP ההקראה הישנה חוזרת מעל החדשה — שני קולות
   במקביל. מונה אחד פותר את זה: כל הקראה מקבלת מספר, stopSpeak
   מקדם אותו, ומקטע מדור ישן פשוט אינו מדבר.
   ------------------------------------------------------------ */
var _sayGen=0;
function speakDevice(text,code,rate){
  if(!("speechSynthesis" in window))return false;
  try{speechSynthesis.cancel()}catch(e){}
  var my=++_sayGen;
  /* האמירה יוצאת מיד, בתוך הלחיצה. קודם היא נעטפה ב-voicesReady,
     שממתין לרשימת הקולות ועד ארבע שניות אם היא לא מגיעה — ואמירה
     שיוצאת ארבע שניות אחרי המגע נזרקת בשקט באנדרואיד ובספארי.
     כשהרשימה כבר כאן, בוחרים קול ומדברים. כשהיא ריקה — מדברים
     בכל זאת, עם u.lang בלבד: קול ברירת מחדל בשפה הנכונה עדיף על
     שתיקה, ויש מכשירים שמחזירים רשימה ריקה לצמיתות ומדברים היטב.
     voicesReady נשאר בשימוש למסך בחירת הקול, שם ההמתנה במקומה. */
  (function(){
    try{
      var v=bestVoice(code), lang=(v&&v.lang)||code;
      var segs=segments(String(text)), rt=tuneRate(lang,clamp(rate,0.55,1.4));
      var pit=femLift(v);
      (function sayseg(k){
        if(my!==_sayGen)return;   /* ההקראה הזאת בוטלה — המקטע הבא לא יוצא */
        if(k>=segs.length){ hlClear(); ttsOK(); return }
        var seg=segs[k];
        var u=new SpeechSynthesisUtterance(seg.text);
        u.lang=lang;
        if(v){ try{ u.voice=v }catch(e2){} }
        u.rate=rt; u.pitch=pit; u.volume=1;
        u.onboundary=function(e){if(!e.name||e.name==="word")hlAt(seg.start+e.charIndex)};
        u.onend=function(){
          if(k+1<segs.length) setTimeout(function(){sayseg(k+1)},SEG_GAP);
          else { hlClear(); ttsOK() }
        };
        u.onerror=function(e){ttsFail(e&&e.error)};
        speechSynthesis.speak(u);
      })(0);
    }catch(e){}
  })();
  return true;
}
/* lang: "en" לחומר הנלמד, או קוד שפת האם להוראה. */
function speak(text,lang,rateMul){
  /* כל טקסט שמגיע להקראה מנוקה מתגיות. חלק מהקריאות כבר מנקות
     לבד, וניקוי חוזר אינו משנה דבר — אבל בלעדיו כל מחרוזת שנשארה
     עם <sub> או <span class="frac"> הוקראה בקול כתגית: הסטודנט
     שמע "span class frac" באמצע השאלה. */
  text=plainOf(String(text||"")).trim().replace(/_{2,}/g,"\u2026"); if(!text)return;
  lang=lang||"en";
  var code=lang==="en"?EN_TTS:LANGS[lang].tts;
  var rate=clamp(state.rate*(rateMul||1),0.55,1.4);
  stopSpeak();
  var my=_sayGen;   /* גם תשובת רשת שמגיעה אחרי עצירה לא תושמע */
  /* שכבה 1 - קובץ מוקלט (המנוע של תאוריה מדברת). יש קובץ:
     מנגנים וזהו; אין: קול המכשיר כרגיל. מבדק חוסרים 30.9 סעיף 4. */
  if(typeof RECORDED!=="undefined"&&RECORDED.play(text,lang,{rate:state.rate,
      onError:function(){ if(my===_sayGen)speakDevice(text,code,rate) }})){
    return;
  }
  if(gemOn()){
    var vid=gvOf(state.gemVoice).id;
    var ck=lang+"|"+vid+"|"+rate.toFixed(2)+"|"+text;
    if(gCache[ck]){playUrl(gCache[ck],text,code,rate);return}
    gBusy=true; renderSpeakState();
    gSynth(text,vid,rate,lang).then(function(u){
      if(my!==_sayGen)return;
      gCache[ck]=u; gBusy=false; renderSpeakState(); playUrl(u,text,code,rate);
    }).catch(function(){
      gBusy=false; renderSpeakState(); speakDevice(text,code,rate);
    });
    return;
  }
  speakDevice(text,code,rate);
}
function playUrl(url,text,code,rate){
  gStop();
  /* משתמשים באלמנט ששוחרר במגע ולא יוצרים חדש. */
  if(!GEL)GEL=new Audio();
  gAudio=GEL; gAudio.src=url;
  gAudio.play().catch(function(){speakDevice(text,code,rate)});
}
function stopSpeak(){_sayGen++;gStop();if(typeof RECORDED!=="undefined")RECORDED.stop();hlClear();try{if(window.speechSynthesis)speechSynthesis.cancel()}catch(e){}}
/* עוזבים את הדף — הקול נעצר. בלעדיו הוא ממשיך ברקע אחרי מעבר לטאב
   אחר, ולפעמים נתקע עד סגירת הדפדפן. */
try{document.addEventListener("visibilitychange",function(){
  if(document.hidden)stopSpeak();
});}catch(e){}
/* iOS לא ישמיע כלום עד שאמירה אחת יצאה מתוך handler של מגע אמיתי.
   אמירה אוטומטית בטעינת הדף נבלעת בשקט — בלי חריגה, בלי לוג, בלי
   דרך לדעת. משחררים פעם אחת עם אמירה ריקה.
   חשוב: קריאה ישירה, בלי voicesReady — הבטחה שוברת את שרשרת המגע
   ו-Safari כבר לא יזהה את האמירה כיוזמת משתמש. */
try{document.addEventListener("pointerdown",function(){
  try{speechSynthesis.speak(new SpeechSynthesisUtterance(""))}catch(e){}
  /* ואותו דבר לאלמנט השמע: מקור שקט, play בתוך המגע עצמו. */
  try{
    if(!GEL)GEL=new Audio();
    GEL.src=SILENT_WAV;
    var pr=GEL.play();
    if(pr&&pr.then)pr.then(function(){try{GEL.pause();GEL.currentTime=0}catch(e){}},function(){});
  }catch(e){}
},{once:true});}catch(e){}
function renderSpeakState(){
  var b=document.querySelectorAll(".spk");
  for(var i=0;i<b.length;i++)b[i].classList.toggle("on",gBusy);

/* ============================================================
   7. תוכן
   ------------------------------------------------------------
   בנק שאלות כתוב, ולא מחולל. באזרחות אין נוסחה שממנה נגזרת
   שאלה: הניסוח המדויק הוא החומר הנלמד, ומסיח שנבנה אוטומטית
   מנוסח אחר היה יוצא או מופרך מדי או נכון בעצמו.

   Q(id, q, opts, ok, hint, ex, fig)
     id   — מזהה יציב לפריט. הוא נכנס לסטטיסטיקה של הלומד, ולכן
            אסור לו להשתנות כשמוסיפים פריט לפניו.
     q    — נוסח השאלה, בארבע שפות.
     opts — ארבע תשובות, כל אחת בארבע שפות. תמיד ארבע: שלוש
            אפשרויות הן ניחוש של אחד משלושה.
     ok   — אינדקס התשובה הנכונה במערך opts (0..3). הסדר על
            המסך מעורבב בכל הצגה, ולכן האינדקס אינו רמז.
     hint — רמז שמכוון לחשיבה ואינו מוסר את התשובה.
     ex   — ההסבר שנפתח אחרי המענה, גם כשענו נכון.
     fig  — מפתח איור מתוך FIGS, או null. אופציונלי בהגדרה:
            רוב השאלות באזרחות הן טקסט בלבד.

   כל שדה קיים בארבע השפות. אזרחות נלמדת בשפת האם — מי שקורא
   בקושי בעברית לא ילמד ממנה מדרג נורמות, ולכן התוכן עצמו
   מתורגם ולא רק הממשק.

   מקור: תוכנית הלימודים בעברית לחינוך הערבי של משרד החינוך (014381, 014281), meyda.education.gov.il. הניסוח מקורי של בקול, עם קרדיט וקישור למשרד החינוך.
   השאלות נכתבו לאפליקציה הזאת ואינן העתק של בחינה.
   ============================================================ */
function Q(id,q,opts,ok,hint,ex,fig,wrong){
  return {id:id,q:q,o:opts,ok:ok,hint:hint,ex:ex,fig:fig||null,wrong:wrong||null};
}

    'font-size="10" font-weight="700" fill="currentColor">'+esc(label)+'</text>'+

topic("ha-read","014381",{"he": "הבנת הנקרא: טקסטים קצרים", "ar": "فهم المقروء: نصوص قصيرة", "ru": "Понимание прочитанного: короткие тексты", "en": "Reading comprehension: short texts"},{"he": "קטעים שימושיים, עיוניים ומדעת, ושאלות כמו בבגרות", "ar": "نصوص تطبيقية ومعرفية وصحفية، وأسئلة كما في البجروت", "ru": "Практические, информационные и публицистические отрывки с вопросами в стиле багрута", "en": "Practical, informational and opinion passages with bagrut-style questions"}, [
  [
   Q("ha-read-1-1",{"he": "קראו את הקטע וענו על השאלה.<br>הודעה לתלמידים: החל מיום ראשון הקרוב, ספריית בית הספר תהיה פתוחה גם בשעות אחר הצהריים, עד השעה שבע בערב. ההחלטה התקבלה בעקבות בקשות רבות של תלמידים המתכוננים לבחינות הבגרות. במהלך שעות הערב יעבוד בספרייה מדריך שיסייע בחיפוש מקורות ובכתיבת עבודות. כדי לשמור על סביבת לימוד שקטה, לא יהיה ניתן להשתמש בטלפונים ניידים בתוך אולם הקריאה.<br>עד באיזו שעה תהיה הספרייה פתוחה בשעות אחר הצהריים?", "ar": "اقرأوا القطعة وأجيبوا عن السؤال.<br>إعلان للطلاب: ابتداءً من يوم الأحد القريب، ستكون مكتبة المدرسة مفتوحة أيضًا في ساعات ما بعد الظهر، حتى الساعة السابعة مساءً. اتُّخذ القرار إثر طلبات كثيرة من طلاب يستعدون لامتحانات البجروت. خلال ساعات المساء سيعمل في المكتبة مرشد يساعد في البحث عن مصادر وفي كتابة الوظائف. وللحفاظ على بيئة تعلّم هادئة، لن يكون بالإمكان استخدام الهواتف الخليوية داخل قاعة المطالعة.<br>حتى أي ساعة ستكون المكتبة مفتوحة في ساعات ما بعد الظهر؟", "ru": "Прочитайте отрывок и ответьте на вопрос.<br>Объявление для учеников: с ближайшего воскресенья школьная библиотека будет открыта также во второй половине дня, до семи часов вечера. Решение принято по многочисленным просьбам учеников, готовящихся к экзаменам на аттестат зрелости. В вечерние часы в библиотеке будет работать инструктор, который поможет искать источники и писать работы. Чтобы сохранить тихую учебную обстановку, пользоваться мобильными телефонами в читальном зале будет нельзя.<br>До какого часа библиотека будет открыта во второй половине дня?", "en": "Read the passage and answer the question.<br>Notice to students: starting this Sunday, the school library will also be open in the afternoon, until seven in the evening. The decision was made following many requests from students preparing for the matriculation exams. During the evening hours an instructor will work in the library, helping with finding sources and writing papers. To keep a quiet study environment, mobile phones may not be used inside the reading hall.<br>Until what time will the library be open in the afternoon?"},[{"he": "שבע בערב", "ar": "السابعة مساءً", "ru": "семь вечера", "en": "seven in the evening"}, {"he": "שש בערב", "ar": "السادسة مساءً", "ru": "шесть вечера", "en": "six in the evening"}, {"he": "שמונה בבוקר", "ar": "الثامنة صباحًا", "ru": "восемь утра", "en": "eight in the morning"}, {"he": "חמש בצהריים", "ar": "الخامسة ظهرًا", "ru": "пять дня", "en": "five in the afternoon"}],0,{"he": "חפשו את השעה הרשומה בהודעה.", "ar": "ابحثوا عن الساعة المذكورة في الإعلان.", "ru": "Найдите час, указанный в объявлении.", "en": "Look for the time written in the notice."},{"he": "ההודעה קובעת במפורש: עד השעה שבע בערב. שימו לב למילה גם: היא מלמדת ששעות הבוקר נשארות כרגיל, והחידוש הוא רק אחר הצהריים. כך למשל, תלמיד שמסיים את הלימודים בארבע יכול להישאר בספרייה עד שבע.", "ar": "ينصّ الإعلان صراحةً: حتى الساعة السابعة مساءً. لاحظوا كلمة أيضًا: فهي تدل على أن ساعات الصباح تبقى كالمعتاد، والجديد هو فترة ما بعد الظهر فقط. مثلًا، طالب ينهي دراسته في الرابعة يمكنه البقاء في المكتبة حتى السابعة.", "ru": "В объявлении прямо сказано: до семи часов вечера. Обратите внимание на слово также: оно показывает, что утренние часы не меняются, а новшество касается только второй половины дня. Например, ученик, заканчивающий занятия в четыре, может оставаться в библиотеке до семи.", "en": "The notice states explicitly: until seven in the evening. Note the word also: it shows morning hours stay the same and only the afternoon is new. For example, a student finishing classes at four can stay in the library until seven."},null,[null, {"he": "השעה שש אינה מוזכרת בהודעה.", "ar": "الساعة السادسة غير مذكورة في الإعلان.", "ru": "Шесть часов в объявлении не упоминается.", "en": "Six o'clock is not mentioned in the notice."}, {"he": "שמונה בבוקר היא שעת הפתיחה הרגילה, לא סוף יום הפתיחה החדש.", "ar": "الثامنة صباحًا هي ساعة الافتتاح المعتادة، لا نهاية دوام الافتتاح الجديد.", "ru": "Восемь утра - обычное время открытия, а не конец нового вечернего графика.", "en": "Eight in the morning is the regular opening time, not the end of the new afternoon hours."}, {"he": "חמש בצהריים אינה מוזכרת; ההודעה אומרת שבע.", "ar": "الخامسة ظهرًا غير مذكورة؛ الإعلان يقول السابعة.", "ru": "Пять часов не упоминается; в объявлении сказано семь.", "en": "Five is not mentioned; the notice says seven."}]),
   Q("ha-read-1-2",{"he": "קראו את הקטע וענו על השאלה.<br>הודעה לתלמידים: החל מיום ראשון הקרוב, ספריית בית הספר תהיה פתוחה גם בשעות אחר הצהריים, עד השעה שבע בערב. ההחלטה התקבלה בעקבות בקשות רבות של תלמידים המתכוננים לבחינות הבגרות. במהלך שעות הערב יעבוד בספרייה מדריך שיסייע בחיפוש מקורות ובכתיבת עבודות. כדי לשמור על סביבת לימוד שקטה, לא יהיה ניתן להשתמש בטלפונים ניידים בתוך אולם הקריאה.<br>מדוע הוחלט להאריך את שעות הפתיחה של הספרייה?", "ar": "اقرأوا القطعة وأجيبوا عن السؤال.<br>إعلان للطلاب: ابتداءً من يوم الأحد القريب، ستكون مكتبة المدرسة مفتوحة أيضًا في ساعات ما بعد الظهر، حتى الساعة السابعة مساءً. اتُّخذ القرار إثر طلبات كثيرة من طلاب يستعدون لامتحانات البجروت. خلال ساعات المساء سيعمل في المكتبة مرشد يساعد في البحث عن مصادر وفي كتابة الوظائف. وللحفاظ على بيئة تعلّم هادئة، لن يكون بالإمكان استخدام الهواتف الخليوية داخل قاعة المطالعة.<br>لماذا تقرر تمديد ساعات فتح المكتبة؟", "ru": "Прочитайте отрывок и ответьте на вопрос.<br>Объявление для учеников: с ближайшего воскресенья школьная библиотека будет открыта также во второй половине дня, до семи часов вечера. Решение принято по многочисленным просьбам учеников, готовящихся к экзаменам на аттестат зрелости. В вечерние часы в библиотеке будет работать инструктор, который поможет искать источники и писать работы. Чтобы сохранить тихую учебную обстановку, пользоваться мобильными телефонами в читальном зале будет нельзя.<br>Почему решили продлить часы работы библиотеки?", "en": "Read the passage and answer the question.<br>Notice to students: starting this Sunday, the school library will also be open in the afternoon, until seven in the evening. The decision was made following many requests from students preparing for the matriculation exams. During the evening hours an instructor will work in the library, helping with finding sources and writing papers. To keep a quiet study environment, mobile phones may not be used inside the reading hall.<br>Why was it decided to extend the library's opening hours?"},[{"he": "כי המדריך ביקש לעבוד שעות נוספות", "ar": "لأن المرشد طلب العمل ساعات إضافية", "ru": "потому что инструктор попросил дополнительные часы", "en": "because the instructor asked for extra hours"}, {"he": "כי נסגרה ספרייה אחרת בעיר", "ar": "لأن مكتبة أخرى في المدينة أُغلقت", "ru": "потому что другая библиотека в городе закрылась", "en": "because another library in town closed"}, {"he": "בעקבות בקשות רבות של תלמידים המתכוננים לבגרות", "ar": "إثر طلبات كثيرة من طلاب يستعدون للبجروت", "ru": "из-за многочисленных просьб учеников, готовящихся к багруту", "en": "following many requests from students preparing for matriculation"}, {"he": "כי בוטלו שיעורי אחר הצהריים בבית הספר", "ar": "لأن حصص ما بعد الظهر في المدرسة أُلغيت", "ru": "потому что послеобеденные уроки в школе отменили", "en": "because afternoon classes at school were cancelled"}],2,{"he": "ההודעה מסבירה את הסיבה מיד אחרי שמבשרת על השינוי.", "ar": "الإعلان يشرح السبب مباشرةً بعد الإخبار عن التغيير.", "ru": "В объявлении причина объясняется сразу после сообщения об изменении.", "en": "The notice explains the reason right after announcing the change."},{"he": "הביטוי בעקבות מסמן סיבה: ההחלטה באה אחרי בקשות רבות של תלמידים המתכוננים לבחינות הבגרות. המדריך הוא חלק מהפתרון, לא הסיבה לו. למשל, אילו כתוב היה בעקבות גשמים כבדים, הסיבה הייתה מזג האוויר.", "ar": "تدل كلمة إثر على السبب: القرار جاء بعد طلبات كثيرة من طلاب يستعدون للبجروت. المرشد جزء من الحل، لا سبب له. مثلًا، لو كان مكتوبًا إثر أمطار غزيرة، لكان السبب الطقس.", "ru": "Выражение вследствие обозначает причину: решение последовало за многочисленными просьбами учеников, готовящихся к экзаменам. Инструктор - часть решения, а не его причина. Например, если бы было написано вследствие сильных дождей, причиной была бы погода.", "en": "The word following marks a cause: the decision came after many requests from students preparing for the exams. The instructor is part of the solution, not its reason. For example, if it said following heavy rains, the cause would be the weather."},null,[{"he": "המדריך יעבוד בערב, אבל הוא אינו הסיבה להארכת השעות.", "ar": "المرشد سيعمل مساءً، لكنه ليس سبب تمديد الساعات.", "ru": "Инструктор будет работать вечером, но он не причина продления часов.", "en": "The instructor will work evenings, but he is not the reason for the extension."}, {"he": "לא מוזכרת בספרייה אחרת בעיר.", "ar": "لا تُذكر مكتبة أخرى في المدينة.", "ru": "Другая библиотека в городе не упоминается.", "en": "No other library in town is mentioned."}, null, {"he": "ביטול שיעורים אינו מוזכר; ההחלטה נוגעת לספרייה בלבד.", "ar": "إلغاء الحصص غير مذكور؛ القرار يخص المكتبة فقط.", "ru": "Отмена уроков не упоминается; решение касается только библиотеки.", "en": "Cancelled classes are not mentioned; the decision concerns the library only."}]),
   Q("ha-read-1-3",{"he": "קראו את הקטע וענו על השאלה.<br>הודעה לתלמידים: החל מיום ראשון הקרוב, ספריית בית הספר תהיה פתוחה גם בשעות אחר הצהריים, עד השעה שבע בערב. ההחלטה התקבלה בעקבות בקשות רבות של תלמידים המתכוננים לבחינות הבגרות. במהלך שעות הערב יעבוד בספרייה מדריך שיסייע בחיפוש מקורות ובכתיבת עבודות. כדי לשמור על סביבת לימוד שקטה, לא יהיה ניתן להשתמש בטלפונים ניידים בתוך אולם הקריאה.<br>מה מטרת האיסור להשתמש בטלפונים ניידים באולם הקריאה?", "ar": "اقرأوا القطعة وأجيبوا عن السؤال.<br>إعلان للطلاب: ابتداءً من يوم الأحد القريب، ستكون مكتبة المدرسة مفتوحة أيضًا في ساعات ما بعد الظهر، حتى الساعة السابعة مساءً. اتُّخذ القرار إثر طلبات كثيرة من طلاب يستعدون لامتحانات البجروت. خلال ساعات المساء سيعمل في المكتبة مرشد يساعد في البحث عن مصادر وفي كتابة الوظائف. وللحفاظ على بيئة تعلّم هادئة، لن يكون بالإمكان استخدام الهواتف الخليوية داخل قاعة المطالعة.<br>ما هدف حظر استخدام الهواتف الخليوية في قاعة المطالعة؟", "ru": "Прочитайте отрывок и ответьте на вопрос.<br>Объявление для учеников: с ближайшего воскресенья школьная библиотека будет открыта также во второй половине дня, до семи часов вечера. Решение принято по многочисленным просьбам учеников, готовящихся к экзаменам на аттестат зрелости. В вечерние часы в библиотеке будет работать инструктор, который поможет искать источники и писать работы. Чтобы сохранить тихую учебную обстановку, пользоваться мобильными телефонами в читальном зале будет нельзя.<br>Какова цель запрета пользоваться телефонами в читальном зале?", "en": "Read the passage and answer the question.<br>Notice to students: starting this Sunday, the school library will also be open in the afternoon, until seven in the evening. The decision was made following many requests from students preparing for the matriculation exams. During the evening hours an instructor will work in the library, helping with finding sources and writing papers. To keep a quiet study environment, mobile phones may not be used inside the reading hall.<br>What is the purpose of banning mobile phones in the reading hall?"},[{"he": "למנוע גניבה של טלפונים", "ar": "لمنع سرقة الهواتف", "ru": "чтобы предотвратить кражу телефонов", "en": "to prevent phone theft"}, {"he": "לשמור על סביבה שקטה", "ar": "للحفاظ على بيئة هادئة", "ru": "чтобы сохранить тихую обстановку", "en": "to keep a quiet environment"}, {"he": "לחסוך בחשמל", "ar": "لتوفير الكهرباء", "ru": "чтобы экономить электричество", "en": "to save electricity"}, {"he": "לאפשר למדריך לנוח", "ar": "لإتاحة الراحة للمرشد", "ru": "чтобы инструктор мог отдохнуть", "en": "to let the instructor rest"}],1,{"he": "המילה כדי פותחת משפט מטרה.", "ar": "كلمة لكي تفتتح جملة الهدف.", "ru": "Слово чтобы открывает предложение цели.", "en": "The words in order to open a purpose clause."},{"he": "ההודעה אומרת במפורש: כדי לשמור על סביבת לימוד שקטה. המילה כדי מכוונת אותנו למטרה. שאלו את עצמכם: מה רוצה כותב ההודעה להשיג? לא חיסכון ולא נוחות, אלא שקט ללומדים. למשל, תלמיד שמתקשר באולם מפריע לכל מי שקורא.", "ar": "يقول الإعلان صراحةً: للحفاظ على بيئة تعلّم هادئة. كلمة لكي توجهنا إلى الهدف. اسألوا أنفسكم: ماذا يريد كاتب الإعلان أن يحقق؟ لا توفيرًا ولا راحة، بل الهدوء للمتعلمين. مثلًا، طالب يجري مكالمة في القاعة يزعج كل من يقرأ.", "ru": "В объявлении прямо сказано: чтобы сохранить тихую учебную обстановку. Слово чтобы указывает на цель. Спросите себя: чего хочет добиться автор объявления? Не экономии и не отдыха, а тишины для занимающихся. Например, ученик, разговаривающий по телефону в зале, мешает всем читающим.", "en": "The notice says explicitly: to keep a quiet study environment. The words in order to point us to the purpose. Ask yourself: what does the writer want to achieve? Not savings or rest, but quiet for the learners. For example, a student taking a call in the hall disturbs everyone reading."},null,[{"he": "גניבה אינה מוזכרת בהודעה.", "ar": "السرقة غير مذكورة في الإعلان.", "ru": "Кража в объявлении не упоминается.", "en": "Theft is not mentioned in the notice."}, null, {"he": "חיסכון בחשמל אינו קשור לאיסור ואינו מוזכר.   [
   Q("ha-read-2-1",{"he": "קראו את הקטע וענו על השאלה.<br>הדבורים ממלאות תפקיד מרכזי בטבע ובחקלאות: הן מעבירות אבקה מפרח לפרח, ובכך מאפשרות לצמחים רבים להתרבות. בלי דבורים, יבולים רבים, כמו תפוחים, שקדים ואבטיחים, היו מצטמצמים מאוד. בשנים האחרונות נרשמה ירידה במספר הדבורים בעולם, בין השאר בגלל שימוש נרחב בחומרי הדברה. חוקרים מציעים כמה דרכים לסייע לדבורים: לנטוע צמחים פורחים בגינות, להפחית בריסוס ולהקים כוורות בישובים. גם פעולות קטנות של אנשים פרטיים יכולות לתרום להצלת הדבורים.<br>מהו התפקיד המרכזי של הדבורים לפי הקטע?", "ar": "اقرأوا القطعة وأجيبوا عن السؤال.<br>تلعب النحلات دورًا مركزيًا في الطبيعة والزراعة: فهي تنقل حبوب اللقاح من زهرة إلى زهرة، وبذلك تتيح لكثير من النباتات أن تتكاثر. لولا النحل، لتقلّصت كثير من المحاصيل، مثل التفاح واللوز والبطيخ. في السنوات الأخيرة سُجّل انخفاض في عدد النحل في العالم، من جملة الأسباب بسبب استخدام واسع لمواد الرش. يقترح الباحثون عدة طرق لمساعدة النحل: غرس نباتات مزهرة في الحدائق، والتقليل من الرش، وإقامة مناحل في البلدات. حتى الأعمال الصغيرة من أشخاص عاديين يمكن أن تسهم في إنقاذ النحل.<br>ما الدور المركزي للنحلات بحسب القطعة؟", "ru": "Прочитайте отрывок и ответьте на вопрос.<br>Пчёлы играют центральную роль в природе и сельском хозяйстве: они переносят пыльцу с цветка на цветок и тем самым позволяют многим растениям размножаться. Без пчёл многие культуры, такие как яблоки, миндаль и арбузы, сильно сократились бы. В последние годы в мире отмечается снижение числа пчёл, в частности из-за широкого применения пестицидов. Исследователи предлагают несколько способов помочь пчёлам: высаживать цветущие растения в садах, уменьшить опрыскивание и ставить ульи в поселениях. Даже небольшие действия отдельных людей могут внести вклад в спасение пчёл.<br>Какова центральная роль пчёл по тексту?", "en": "Read the passage and answer the question.<br>Bees play a central role in nature and agriculture: they carry pollen from flower to flower, allowing many plants to reproduce. Without bees, many crops, such as apples, almonds and watermelons, would shrink greatly. In recent years a decline in the number of bees worldwide has been recorded, partly because of widespread use of pesticides. Researchers suggest several ways to help bees: plant flowering plants in gardens, reduce spraying, and set up hives in communities. Even small actions by private people can contribute to saving the bees.<br>What is the bees' central role according to the passage?"},[{"he": "ייצור דבש למכירה", "ar": "إنتاج العسل للبيع", "ru": "производство мёда на продажу", "en": "producing honey for sale"}, {"he": "העברת אבקה מפרח לפרח", "ar": "نقل حبوب اللقاح من زهرة إلى زهرة", "ru": "перенос пыльцы с цветка на цветок", "en": "carrying pollen from flower to flower"}, {"he": "הגנה על הכוורת מפני אויבים", "ar": "حماية الخلية من الأعداء", "ru": "защита улья от врагов", "en": "defending the hive from enemies"}, {"he": "פיזור זרעים בעזרת הרוח", "ar": "نشر البذور بمساعدة الريح", "ru": "разнесение семян ветром", "en": "scattering seeds with the wind"}],1,{"he": "הקטע פותח בתפקיד, לפני שמספר על הבעיה.", "ar": "القطعة تفتتح بالدور قبل أن تتحدث عن المشكلة.", "ru": "Текст начинается с роли, прежде чем рассказать о проблеме.", "en": "The passage opens with the role before describing the problem."},{"he": "המשפט הראשון קובע: הן מעבירות אבקה מפרח לפרח. הפעולה הזאת נקראת האבקה, ובזכותה צמחים מתרבים. הדבש מוזכר? לא בקטע הזה. למשל, בלי האבקה לא היו מתפתחים פירות כמו תפוחים.", "ar": "الجملة الأولى تنص: فهي تنقل حبوب اللقاح من زهرة إلى زهرة. هذه العملية تسمى التلقيح، وبفضلها تتكاثر النباتات. هل ذُكر العسل؟ ليس في هذه القطعة. مثلًا، لولا التلقيح لما تطورت ثمار كالتفاح.", "ru": "В первом предложении сказано: они переносят пыльцу с цветка на цветок. Это действие называется опылением, и благодаря ему растения размножаются. Упоминается ли мёд? Не в этом тексте. Например, без опыления не развивались бы плоды вроде яблок.", "en": "The first sentence states: they carry pollen from flower to flower. This action is called pollination, and thanks to it plants reproduce. monds and watermelons, would shrink greatly. In recent years a decline in the number of bees worldwide has been recorded, partly because of widespread use of pesticides. Researchers suggest several ways to help bees: plant flowering plants in gardens, reduce spraying, and set up hives in communities. Even small actions by private people can contribute to saving the bees.<br>What is one reason for the decline in bees, according to the passage?"},[{"he": "גשמים מרובים בחורף", "ar": "أمطار غزيرة في الشتاء", "ru": "обильные дожди зимой", "en": "heavy winter rains"}, {"he": "מחסור בפרחים ברים", "ar": "نقص في الأزهار البرية", "ru": "нехватка диких цветов", "en": "a shortage of wild flowers"}, {"he": "התחממות המים בנהרות", "ar": "ارتفاع حرارة مياه الأنهار", "ru": "потепление воды в реках", "en": "warming of river water"}, {"he": "שימוש נרחב בחומרי הדברה", "ar": "استخدام واسع لمواد الرش", "ru": "широкое применение пестицидов", "en": "widespread use of pesticides"}],3,{"he": "הביטוי בין השאר בגלל מצביע על סיבה.", "ar": "تعبير من جملة الأسباب بسبب يشير إلى السبب.", "ru": "Выражение в частности из-за указывает на причину.", "en": "The phrase partly because of points to a cause."},{"he": "כתוב בקטע: בין השאר בגלל שימוש נרחב בחומרי הדברה. המילים בין השאר מלמדות שיש סיבות נוספות שלא פורטו, אבל זו הסיבה שצוינה. למשל, חקלאי המרסס שדה עלול לפגוע גם בדבורים המבקרות בו.", "ar": "مكتوب في القطعة: من جملة الأسباب بسبب استخدام واسع لمواد الرش. كلمتا من جملة تدلان على وجود أسباب أخرى لم تُفصّل، لكن هذا هو السبب المذكور. مثلًا، مزارع يرش حقله قد يضر أيضًا بالنحل الزائر له.", "ru": "В тексте сказано: в частности из-за широкого применения пестицидов. Слова в частности показывают, что есть и другие причины, но названа именно эта. Например, фермер, опрыскивающий поле, может навредить и посещающим его пчёлам.", "en": "The text says: partly because of widespread use of pesticides. The words partly show there are other unlisted reasons, but this is the one named. For example, a farmer spraying a    Q("ha-read-2-3",{"he": "קראו את הקטע וענו על השאלה.<br>הדבורים ממלאות תפקיד מרכזי בטבע ובחקלאות: הן מעבירות אבקה מפרח לפרח, ובכך מאפשרות לצמחים רבים להתרבות. בלי דבורים, יבולים רבים, כמו תפוחים, שקדים ואבטיחים, היו מצטמצמים מאוד. בשנים האחרונות נרשמה ירידה במספר הדבורים בעולם, בין השאר בגלל שימוש נרחב בחומרי הדברה. חוקרים מציעים כמה דרכים לסייע לדבורים: לנטוע צמחים פורחים בגינות, להפחית בריסוס ולהקים כוורות בישובים. גם פעולות קטנות של אנשים פרטיים יכולות לתרום להצלת הדבורים.<br>מהי מסקנת הקטע לגבי אנשים פרטיים?", "ar": "اقرأوا القطعة وأجيبوا عن السؤال.<br>تلعب النحلات دورًا مركزيًا في الطبيعة والزراعة: فهي تنقل حبوب اللقاح من زهرة إلى زهرة، وبذلك تتيح لكثير من النباتات أن تتكاثر. لولا النحل، لتقلّصت كثير من المحاصيل، مثل التفاح واللوز والبطيخ. في السنوات الأخيرة سُجّل انخفاض في عدد النحل في العالم، من جملة الأسباب بسبب استخدام واسع لمواد الرش. يقترح الباحثون عدة طرق لمساعدة النحل: غرس نباتات مزهرة في الحدائق، والتقليل من الرش، وإقامة مناحل في البلدات. حتى الأعمال الصغيرة من أشخاص عاديين يمكن أن تسهم في إنقاذ النحل.<br>ما خلاصة القطعة بشأن الأشخاص العاديين؟", "ru": "Прочитайте отрывок и ответьте на вопрос.<br>Пчёлы играют центральную роль в природе и сельском хозяйстве: они переносят пыльцу с цветка на цветок и тем самым позволяют многим растениям размножаться. Без пчёл многие культуры, такие как яблоки, миндаль и арбузы, сильно сократились бы. В последние годы в мире отмечается снижение числа пчёл, в частности из-за широкого применения пестицидов. Исследователи предлагают несколько способов помочь пчёлам: высаживать цветущие растения в садах, уменьшить опрыскивание и ставить ульи в поселениях. Даже небольшие действия отдельных людей могут внести вклад в спасение пчёл.<br>Каков вывод текста об отдельных людях?", "en": "Read the passage and answer the question.<br>Bees play a central role in nature and agriculture: they carry pollen from flower to flower, allowing many plants to reproduce. Without bees, many crops, such as apples, almonds and watermelons, would shrink greatly. In recent years a decline in the number of bees worldwide has been recorded, partly because of widespread use of pesticides. Researchers suggest several ways to help bees: plant flowering plants in gardens, reduce spraying, and set up hives in communities. Even small actions by private people can contribute to saving the bees.<br>What is the passage's conclusion about private individuals?"},[{"he": "פעולות קטנות מסייעות להצלת הדבורים", "ar": "أعمال صغيرة تساعد في إنقاذ النحل", "ru": "небольшие действия помогают спасти пчёл", "en": "small actions help save the bees"}, {"he": "אין ביכולתם להשפיע על המצב", "ar": "لا يستطيعون التأثير في الوضع", "ru": "они не могут повлиять на ситуацию", "en": "they cannot influence the situation"}, {"he": "עליהם להפסיק לגדל צמחים בגינה", "ar": "عليهم التوقف عن زراعة النباتات في الحديقة", "ru": "им следует прекратить выращивать растения в саду", "en": "they should stop growing garden plants"}, {"he": "עליהם להקים חברות גדולות לייצור דבש", "ar": "عليهم إقامة شركات كبيرة لإنتاج العسل", "ru": "им следует создавать крупные компании по производству мёда", "en": "they should found large honey production companies"}],0,{"he": "המסקנה נמצאת במשפט האחרון של הקטע.", "ar": "الخلاصة في الجملة الأخيرة من القطعة.", "ru": "Вывод находится в последнем предложении текста.", "en": "The conclusion is in the passage's last sentence."},{"he": "המשפט האחרון אומר במפורש: גם פעולות קטנות של אנשים פרטיים יכולות לתרום. המילה גם מדגישה שאין צורך בפעולה גדולה. למשל, נטיעת עציץ פורח במרפסת היא כבר תרומה.", "ar": "الجملة الأخيرة تنص صراحة: حتى الأعمال الصغيرة من أشخاص عاديين يمكن أن تسهم. كلمة حتى تؤكد أنه لا حاجة لعمل كبير. مثلًا، غرس نبتة مزهرة في الشرفة هو إسهام بحد ذاته.", "ru": "Последнее предложение прямо говорит: даже небольшие действия отдельных людей могут внести вклад. Слово даже подчёркивает, что большое дело не требуется. Например, посадка цветущего растения на балконе - уже вклад.", "en": "The last sentence says explicitly: even small actions by private people can contribute. The word even stresses that no big action is needed. For example, planting a flowering pot on a balcony is already a contribution."},null,[null, {"he": "הקטע אומר ההפך: יש ביכולתם לתרום.", "ar": "القطعة تقول العكس: بإمكانهم الإسهام.", "ru": "Текст говорит обратное: они могут внести вклад.", "en": "The passage says the opposite: they can contribute."}, {"he": "הקטע דווקא ממליץ לנטוע צמחים פורחים.", "ar": "القطعة بالذات توصي بغرس نباتات مزهرة.", "ru": "Текст как раз рекомендует высаживать цветущие растения.", "en": "The passage actually recommends planting flowering plants."}, {"he": "הקמת חברות אינה מוזכרת בקטע.", "ar": "إقامة الشركات غير مذكورة في القطعة.", "ru": "Создание компаний в тексте не упоминается.", "en": "Founding companies is not mentioned in the passage."}])

   Q("ha-read-3-1",{"he": "קראו את הקטע וענו על השאלה.<br>קוראים כותבים: בכל בוקר אני ממתין כתשעים דקות לאוטובוס שאמור להגיע כל עשרים דקות. החברה מפרסמת לוחות זמנים מסודרים, אבל המציאות רחוקה מהם. אם רוצים שאנשים ישאירו את המכונית בבית, חייבים קודם לתת להם תחבורה ציבורית שאפשר לסמוך עליה.<br>מהי טענתו המרכזית של הכותב?", "ar": "اقرأوا القطعة وأجيبوا عن السؤال.<br>قرّاء يكتبون: في كل صباح أنتظر نحو تسعين دقيقة حافلة يُفترض أن تصل كل عشرين دقيقة. الشركة تنشر جداول مواعيد مرتبة، لكن الواقع بعيد عنها. إذا أردنا أن يترك الناس السيارة في البيت، علينا أولًا أن نعطيهم مواصلات عامة يمكن الاعتماد عليها.<br>ما حجة الكاتب المركزية؟", "ru": "Прочитайте отрывок и ответьте на вопрос.<br>Читатели пишут: каждое утро я жду около девяноста минут автобус, который должен приходить каждые двадцать минут. Компания публикует аккуратные расписания, но реальность далека от них. Если хотят, чтобы люди оставили машину дома, нужно сначала дать им общественный транспорт, на который можно положиться.<br>Каков главный тезис автора?", "en": "Read the passage and answer the question.<br>Readers write: every morning I wait about ninety minutes for a bus that is supposed to come every twenty minutes. The company publishes orderly timetables, but reality is far from them. If we want people to leave the car at home, we must first give them public transport they can rely on.<br>What is the writer's main claim?"},[{"he": "לוחות הזמנים בתחנות צריכים עיצוב ברור יותר", "ar": "جداول المواعيد في المحطات تحتاج تصميمًا أوضح", "ru": "расписаниям на остановках нужен более ясный дизайн", "en": "the stop timetables need a clearer design"}, {"he": "מחירי הנסיעה גבוהים מדי", "ar": "أسعار السفر مرتفعة جدًا", "ru": "цены на проезд слишком высоки", "en": "fares are too high"}, {"he": "אנשים יעזבו את המכונית רק עם תחבורה אמינה", "ar": "الناس سيتركون السيارة فقط مع مواصلات يمكن الاعتماد عليها", "ru": "люди оставят машину только с надёжным транспортом", "en": "people will leave the car only with reliable transport"}, {"he": "יש להוסיף נהגים חדשים לחברה", "ar": "يجب إضافة سائقين جدد للشركة", "ru": "компании нужно нанять новых водителей", "en": "the company must hire new drivers"}],2,{"he": "הטענה המרכזית מופיעה במשפט התנאי שבסוף הקטע.", "ar": "الحجة المركزية تظهر في جملة الشرط في نهاية القطعة.", "ru": "Главный тезис находится в условном предложении в конце текста.", "en": "The main claim appears in the conditional sentence at the end of the passage."},{"he": "המשפט אם רוצים שאנשים ישאירו את המכונית בבית, חייבים קודם... מציב תנאי: קודם תחבורה אמינה, ורק אז אנשים יוותרו על המכונית. זו הטענה. שאר המשפטים מביאים דוגמה מהחיים שמחזקת אותה.", "ar": "جملة إذا أردنا أن يترك الناس السيارة في البيت، علينا أولًا... تضع شرطًا: أولًا مواصلات يمكن الاعتماد عليها، وبعدها فقط سيستغني الناس عن السيارة. هذه هي الحجة. باقي الجمل تقدم مثالًا من الحياة يدعمها.", "ru": "Предложение если хотят, чтобы люди оставили машину дома, нужно сначала... ставит условие: сначала надёжный транспорт, и только тогда люди откажутся от машины. Это и есть тезис. Остальные предложения приводят жизненный пример, который его поддерживает.", "en": "The sentence if we want people to leave the car at home, we must first... sets a condition: reliable transport first, and only then will people give up the car. That is the claim. The other sentences give a life example that supports it."},null,[{"he": "עיצוב הלוחות אינו הטענה; הבעיה היא שהאוטובוסים לא מגיעים בזמן.", "ar": "تصميم الجداول ليس الحجة؛ المشكلة أن الحافلات لا تصل في وقتها.", "ru": "Дизайн расписаний не тезис; проблема в том, что автобусы не приходят вовремя.", "en": "The timetable design is not the claim; the problem is buses not arriving on time."}, {"he": "מחירים אינם מוזכרים בקטע.", "ar": "الأسعار غير مذكورة في القطعة.", "ru": "Цены в тексте не упоминаются.", "en": "Prices are not mentioned in the passage."}, null, {"he": "נהגים אינם מוזכרים בקטע.", "ar": "السائقون غير مذكورين في القطعة.", "ru": "Водители в тексте не упоминаются.", "en": "Drivers are not mentioned in the    Q("ha-read-3-2",{"he": "קראו את הקטע וענו על השאלה.<br>קוראים כותבים: בכל בוקר אני ממתין כתשעים דקות לאוטובוס שאמור להגיע כל עשרים דקות. החברה מפרסמת לוחות זמנים מסודרים, אבל המציאות רחוקה מהם. אם רוצים שאנשים ישאירו את המכונית בבית, חייבים קודם לתת להם תחבורה ציבורית שאפשר לסמוך עליה.<br>מה משמעות הדברים המציאות רחוקה מהם?", "ar": "اقرأوا القطعة وأجيبوا عن السؤال.<br>قرّاء يكتبون: في كل صباح أنتظر نحو تسعين دقيقة حافلة يُفترض أن تصل كل عشرين دقيقة. الشركة تنشر جداول مواعيد مرتبة، لكن الواقع بعيد عنها. إذا أردنا أن يترك الناس السيارة في البيت، علينا أولًا أن نعطيهم مواصلات عامة يمكن الاعتماد عليها.<br>ما معنى عبارة الواقع بعيد عنها؟", "ru": "Прочитайте отрывок и ответьте на вопрос.<br>Читатели пишут: каждое утро я жду около девяноста минут автобус, который должен приходить каждые двадцать минут. Компания публикует аккуратные расписания, но реальность далека от них. Если хотят, чтобы люди оставили машину дома, нужно сначала дать им общественный транспорт, на который можно положиться.<br>Что означает выражение реальность далека от них?", "en": "Read the passage and answer the question.<br>Readers write: every morning I wait about ninety minutes for a bus that is supposed to come every twenty minutes. The company publishes orderly timetables, but reality is far from them. If we want people to leave the car at home, we must first give them public transport they can rely on.<br>What does the phrase reality is far from them mean?"},[{"he": "האוטובוסים אינם מגיעים בזמן", "ar": "الحافلات لا تصل في المواعيد", "ru": "автобусы не приходят вовремя", "en": "the buses do not arrive on time"}, {"he": "התחנות בעיר רחוקות מאוד זו מזו", "ar": "محطات المدينة بعيدة جدًا بعضها عن بعض", "ru": "остановки в городе очень далеки друг от друга", "en": "the city stops are very far apart"}, {"he": "הלוחות תלויים גבוה מדי", "ar": "الجداول معلقة عاليًا جدًا", "ru": "расписания висят слишком высоко", "en": "the timetables hang too high"}, {"he": "הנסיעות ארוכות מדי", "ar": "الرحلات طويلة جدًا", "ru": "поездки слишком длинные", "en": "the rides are too long"}],0,{"he": "קראו שוב את המשפט שמתאר את ההמתנה בבוקר.", "ar": "أعيدوا قراءة الجملة التي تصف الانتظار في الصباح.", "ru": "Перечитайте предложение, описывающее утреннее ожидание.", "en": "Reread the sentence describing the morning wait."},{"he": "הכותב ממתין תשעים דקות לאוטובוס שאמור להגיע כל עשרים דקות. מכאן שהמציאות, כלומר זמני ההגעה בפועל, רחוקה מהלוחות המפורסמים. זו דוגמה לסתירה בין נאמר לנעשה.", "ar": "الكاتب ينتظر تسعين دقيقة حافلة يُفترض أن تصل كل عشرين دقيقة. من هنا أن الواقع، أي مواعيد الوصول الفعلية، بعيد عن الجداول المنشورة. هذا مثال على تناقض بين القول والفعل.", "ru": "Автор ждёт девяносто минут автобус, который должен приходить каждые двадцать. Значит, реальность, то есть фактическое время прихода, далека от опубликованных расписаний. Это пример противоречия между словом и делом.", "en": "The writer waits ninety minutes for a bus that should come every twenty. Hence reality, meaning actual arrival times, is far from the published timetables. This is an example of a gap between word and deed."},null,[null, {"he": "מרחק התחנות אינו מוזכר בקטע.", "ar": "بعد المحطات غير مذكور في القطعة.", "ru": "Расстояние между остановками в тексте не упоминается.", "en": "The distance between stops is not mentioned."}, {"he": "גובה התלייה אינו מוזכר; הנושא הוא דיוק הזמנים.", "ar": "ارتفاع التعليق غير مذكور؛ الموضوع هو دقة المواعيد.", "ru": "Высота подвешивания не упоминается; речь о точности времени.", "en": "Hanging height is not mentioned; the issue is time accuracy."}, {"he": "אורך הנסיעה אינו הנושא; ההמתנה היא הבעיה.", "ar": "طول الرحلة ليس الموضوع؛ الانتظار هو المشكلة.", "ru": "Длительность поездки не тема; проблема в ожидании.", "en": "Ride length is not the issue; the waiting is the problem."}]),
   Q("ha-read-3-3",{"he": "קראו את הקטע וענו על השאלה.<br>קוראים כותבים: בכל בוקר אני ממתין כתשעים דקות לאוטובוס שאמור להגיע כל עשרים דקות. החברה מפרסמת לוחות זמנים מסודרים, אבל המציאות רחוקה מהם. אם רוצים שאנשים ישאירו את המכונית בבית, חייבים קודם לתת להם תחבורה ציבורית שאפשר לסמוך עליה.<br>מה תפקיד המילה קודם במשפט האחרון?", "ar": "اقرأوا القطعة وأجيبوا عن السؤال.<br>قرّاء يكتبون: في كل صباح أنتظر نحو تسعين دقيقة حافلة يُفترض أن تصل كل عشرين دقيقة. الشركة تنشر جداول مواعيد مرتبة، لكن الواقع بعيد عنها. إذا أردنا أن يترك الناس السيارة في البيت، علينا أولًا أن نعطيهم مواصلات عامة يمكن الاعتماد عليها.<br>ما وظيفة كلمة أولًا في الجملة الأخيرة؟", "ru": "Прочитайте отрывок и ответьте на вопрос.<br>Читатели пишут: каждое утро я жду около девяноста минут автобус, который должен приходить каждые двадцать минут. Компания публикует аккуратные расписания, но реальность далека от них. Если хотят, чтобы люди оставили машину дома, нужно сначала дать им общественный транспорт, на который можно положиться.<br>Какова роль слова сначала в последнем предложении?", "en": "Read the passage and answer the question.<br>Readers write: every morning I wait about ninety minutes for a bus that is supposed to come every twenty minutes. The company publishes orderly timetables, but reality is far from them. If we want people to leave the car at home, we must first give them public transport they can rely on.<br>What is the role of the word first in the last sentence?"},[{"he": "מציינת שהאירוע כבר התרחש בעבר", "ar": "تدل على أن الحدث وقع في الماضي", "ru": "указывает, что событие уже произошло в прошлом", "en": "marks that the event already happened in the past"}, {"he": "מחברת בין שני אירועים המתרחשים במקביל", "ar": "تربط بين حدثين يقعان في آن واحد", "ru": "связывает два события, происходящих одновременно", "en": "connects two events happening at the same time"}, {"he": "מסמנת סיבה שכבר אינה בתוקף", "ar": "تشير إلى سبب لم يعد ساريًا", "ru": "обозначает причину, которая уже не действует", "en": "marks a reason that is no longer valid"}, {"he": "מציינת תנאי שצריך להתקיים לפני התוצאה", "ar": "تدل على شرط يجب تحققه قبل النتيجة", "ru": "указывает на условие, которое должно выполниться до результата", "en": "marks a condition that must be met before the result"}],3,{"he": "חפשו מה חייב לקרות לפני שאנשים משנים את התנהגותם.", "ar": "ابحثوا عما يجب أن يحدث قبل أن يغيّر الناس سلوكهم.", "ru": "Найдите, что должно произойти до того, как люди изменят поведение.", "en": "Look for what must happen before people change their behavior."},{"he": "המילה קודם במשפט חייבים קודם לתת להם תחבורה... קושרת בין תנאי לתוצאה: קודם נותנים תחבורה אמינה, ורק אחר כך אפשר לצפות שאנשים ישאירו את המכונית. מבנה זה מופיע גם במשפטים כמו קודם לומדים, אחר כך ניגשים לבחינה.", "ar": "كلمة أولًا في جملة علينا أولًا أن نعطيهم مواصلات... تربط بين شرط ونتيجة: أولًا نعطي مواصلات يمكن الاعتماد عليها، وبعدها فقط يمكن توقع أن يترك الناس السيارة. هذا البناء يظهر أيضًا في جمل مثل أولًا نتعلم، ثم نتقدم للامتحان.", "ru": "Слово сначала в предложении нужно сначала дать им транспорт... связывает условие и результат: сначала даём надёжный транспорт, и только потом можно ожидать, что люди оставят машину. Такая конструкция встречается и в предложениях вроде сначала учимся, потом сдаём экзамен.", "en": "The word first in the sentence we must first give them transport... links a condition to a result: first we provide reliable transport, and only then can we expect people to leave the car. This structure also appears in sentences like first we study, then we take the exam."},null,[{"he": "הכותב מדבר על העתיד הרצוי, לא על אירוע שהתרחש.", "ar": "الكاتب يتحدث عن المستقبل المرغوب، لا عن حدث وقع.", "ru": "Автор говорит о желаемом будущем, а не о произошедшем событии.", "en": "The writer speaks about a desired future, not a past event."}, {"he": "האירועים אינם במקביל: האחד קודם לשני.", "ar": "الحدثان ليسا متزامنين: أحدهما يسبق الآخر.", "ru": "События не одновременны: одно предшествует другому.", "en": "The events are not simultaneous: one precedes the other."}, {"he": "הסיבה דווקא בתוקף; היא התנאי לשינוי.", "ar": "السبب ما زال ساريًا؛ فهو شرط التغيير.", "ru": "Причина как раз действует; она и есть условие изменения.", "en": "The reason is very much in force; it is the condition for change."}, null])
  ]
]);

topic("ha-derive","014381",{"he": "דרכי גזירה: שורש, בניין והלחם", "ar": "طرق الاشتقاق: الجذر والوزن والدمج", "ru": "Словообразование: корень, биньян и слияние", "en": "Derivation: root, binyan, and blends"},{"he": "איך מילים עבריות נבנות, ואיך מפרקים מילה לחלקיה", "ar": "كيف تُبنى الكلمات العبرية، وكيف نفكك الكلمة إلى أجزائها", "ru": "Как устроены слова в иврите и как разложить слово на части", "en": "How Hebrew words are built and how to break a word into parts"}, [
  [
   Q("ha-derive-1-1",{"he": "מהו השורש של המילה \"הסתברות\"?", "ar": "ما جذر كلمة «הסתברות»؟", "ru": "Каков корень слова «הסתברות»?", "en": "What is the root of the word \"הסתברות\"?"},[{"he": "ה־ס־ב־ר", "ar": "هـ־س־ب־ر", "ru": "ה־ס־ב־ר", "en": "ה־ס־ב־ר"}, {"he": "ס־ב־ר", "ar": "س־ب־ر", "ru": "ס־ב־ר", "en": "ס־ב־ר"}, {"he": "ס־ת־ב־ר", "ar": "س־ت־ب־ر", "ru": "ס־ת־ב־ר", "en": "ס־ת־ב־ר"}, {"he": "ב־ר־ו־ת", "ar": "ب־ر־و־ت", "ru": "ב־ר־ו־ת", "en": "ב־ר־ו־ת"}],1,{"he": "הורידו את האותיות המשפחתיות: ה תחילית וו והאותיות ת בסוף.", "ar": "احذفوا الحروف الزائدة: الهاء في البداية والواو والتاء في النهاية.", "ru": "Уберите служебные буквы: ה в начале и ו, ת в конце.", "en": "Remove the added letters: ה at the start and ו, ת at the end."},{"he": "במילה הסתברות האות ה היא אות תחילית, ו והאות ת בסוף אינן חלק מהשורש. נשארות ס ב ר, שורש המילים סברה והסבר. למשל גם במילה מסביר נמצא אותו שורש.", "ar": "في كلمة הסתברות حرف الهاء زائد في البداية، والواو والتاء في النهاية ليستا من الجذر. تبقى س ب ر، جذر كلمتي סברה وהסבר. مثلًا في كلمة מסביר نجد الجذر نفسه.", "ru": "В слове הסתברות буква ה - приставка, а ו и ת в конце не входят в корень. Остаются ס ב ר, корень слов סברה и הסבר. Например, в слове מסביר тот же корень.", "en": "In הסתברות the letter ה is a prefix, and ו and ת at the end are not part of the root. What remains is ס ב ר, the root of סברה and הסבר. For example, מסביר has the same root."},null,[{"he": "ה האותית אינה חלק מהשורש; היא אות תחילית.", "ar": "الهاء ليست من الجذر؛ فهي حرف زائد في البداية.", "ru": "Буква ה не входит в корень; это приставка.", "en": "The ה is not part of the root; it is a prefix letter."}, null, {"he": "האות ת אינה בשורש; היא נוספה בבניין התפעל.", "ar": "التاء ليست في الجذر؛ أُضيفت في وزن התפעל.", "ru": "Буква ת не в корне; она добавлена в биньяне התפעל.", "en": "The ת is not in the root; it is added in the התפעל pattern."}, {"he": "ו ות אינן אותיות שורש; הן סיומת השם העצם.", "ar": "الواو والتاء ليستا حرفي جذر؛ فهما لاحقة الاسم.", "ru": "В и ת не корневые буквы; это окончание существительного.", "en": "ו and ת are not root letters; they are the noun ending."}]),
   Q("ha-derive-1-2",{"he": "באיזה בניין נטולה המילה \"נִשְׁבַּר\"?", "ar": "في أي وزن جاءت كلمة «נִשְׁבַּר»؟", "ru": "В каком биньяне стоит слово «נִשְׁבַּר»?", "en": "Which binyan is the word \"נִשְׁבַּר\" in?"},[{"he": "פָּעַל", "ar": "פָּעַל", "ru": "פָּעַל", "en": "פָּעַל (pa'al)"}, {"he": "פִּעֵל", "ar": "פִּעֵל", "ru": "פִּעֵל", "en": "פִּעֵל (pi'el)"}, {"he": "נִפְעַל", "ar": "נִפְעַל", "ru": "נִפְעַל", "en": "נִפְעַל (nif'al)"}, {"he": "הִפְעִיל", "ar": "הִפְעִיל", "ru": "הִפְעִיל", "en": "הִפְעִיל (hif'il)"}],2,{"he": "חפשו אות נוספת לפני אותיות השורש.", "ar": "ابحثوا عن حرف زائد قبل حروف الجذر.", "ru": "Ищите добавочную букву перед буквами корня.", "en": "Look for an added letter before the root letters."},{"he": "במילה נשבר מופיעה האות נ לפני אותיות השורש ש ב ר, וזה סימן ההיכר של בניין נפעל בעבר. למשל: נכנס, נשמע ונבנה בנויים באותו דגם.", "ar": "في كلمة נשבר يظهر حرف النون قبل حروف الجذر ش ب ر، وهذه علامة وزن נפעל في الماضي. مثلًا: נכנס وנשמע وנבנה مبنية على النمط نفسه.", "ru": "В слове נשבר перед буквами корня ש ב ר стоит буква נ - признак биньяна נפעל в прошедшем времени. Например: נכנס, נשמע и נבנה построены по той же модели.", "en": "In נשבר the letter נ appears before the root letters ש ב ר - the sign of the נפעל binyan in past tense. For example: נכנס, נשמע and נבנה are built on the same pattern."},null,[{"he": "בפעל אין אות נוספת לפני השורש, וכאן יש נ.", "ar": "في פעל لا يوجد حرف زائد قبل الجذر، وهنا توجد نون.", "ru": "В פעל нет добавочной буквы перед корнем, а здесь есть נ.", "en": "In פעל there is no added letter before the root, and here there is a נ."}, {"he": "בפיעל אין נ תחילית; למשל דיבר, סיפר.", "ar": "في פיעל لا توجد نون في البداية؛ مثل דיבר וסיפר.", "ru": "В פיעל нет начальной נ; например דיבר, סיפר.", "en": "In פיעל there is no initial נ; for example דיבר, סיפר."}, null, {"he": "בהפעיל פותחים בה, לא בנ; למשל הדליק.", "ar": "في הִפְעִיל نبدأ بالهاء لا بالنون؛ مثل הדליק.", "ru": "В הִפְעִיל начинается с ה, не с נ; например הדליק.", "en": "In הִפְעִיל the word opens with ה, not נ; for example הדליק."}]),
   Q("ha-derive-1-3",{"he": "איזו מילה שייכת למשפחת המילים של השורש כ־ת־ב?", "ar": "أي كلمة تنتمي إلى عائلة الجذر ك־ت־ب؟", "ru": "Какое слово принадлежит семье корня כ־ת־ב?", "en": "Which word belongs to the family of the root כ־ת־ב?"},[{"he": "מִכְתָּבָה", "ar": "מִכְתָּבָה (מִכְתָּב + ה)", "ru": "מִכְתָּבָה", "en": "מִכְתָּבָה (letter/correspondence)"}, {"he": "סִפְרִיָּה", "ar": "סִפְרִיָּה (ס־פ־ר)", "ru": "סִפְרִיָּה", "en": "סִפְרִיָּה (library)"}, {"he": "קְרִיאָה", "ar": "קְרִיאָה (ק־ר־א)", "ru": "קְרִיאָה", "en": "קְרִיאָה (reading)"}, {"he": "דִּבּוּר", "ar": "דִּבּוּר (ד־ב־ר)", "ru": "דִּבּוּר", "en": "דִּבּוּר (speech)"}],0,{"he": "חפשו מילה שאותיות השורש כ ת ב מופיעות בה.", "ar": "ابحثوا عن كلمة تظهر فيها حروف الجذر כ ת ב.", "ru": "Ищите слово, в котором встречаются буквы корня כ ת ב.", "en": "Look for a word containing the root letters כ ת ב."},{"he": "מכתבה בנויה מהשורש כ ת ב: מכתב הוא מסמך כתוב, והסיומת ה יוצרת שם עצם חדש. שאר המילים ממשפחות אחרות: ספרייה מן השורש ס פ ר, קריאה מן ק ר א ודיבור מן ד ב ר.", "ar": "كلمة מכתבה مبنية من الجذر כ ת ב: מכתב هو مستند مكتوب، واللاحقة ה تُنشئ اسمًا جديدًا. بقية الكلمات من عائلات أخرى: ספרייה من الجذر ס פ ר، وקריאה من ק ר א، وדיבור من ד ב ר.", "ru": "Слово מכתבה построено от корня כ ת ב: מכתב - написанный документ, а окончание ה образует новое существительное. Остальные слова из других семей: ספרייה от корня ס פ ר, קריאה от ק ר א и דיבור от ד ב ר.", "en": "מכתבה is built from the root כ ת ב: מכתב is a written document, and the ה ending forms a new noun. The other words belong to other families: ספרייה from ס פ ר, קריאה from ק ר א, and דיבור from ד ב ר."},null,[null, {"he": "שורש המילה ספרייה הוא ס פ ר, לא כ ת ב.", "ar": "جذر كلمة ספרייה هو ס פ ר، وليس כ ת ב.", "ru": "Корень слова ספרייה - ס פ ר, а не כ ת ב.", "en": "The root of ספרייה is ס פ ר, not כ ת ב."}, {"he": "שורש המילה קריאה הוא ק ר א.", "ar": "جذر كلمة קריאה هو ק ר א.", "ru": "Корень слова קריאה - ק ר א.", "en": "The root of קריאה is ק ר א."}, {"he": "שור
