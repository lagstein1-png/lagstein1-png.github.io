Q("ha-syntax-2-1",{"he": "מהו האוגד במשפט \"רחל היא תלמידה מצטיינת\"?", "ar": "ما الرابطة في جملة «רחל היא תלמידה מצטיינת»؟", "ru": "Что является связкой в «רחל היא תלמידה מצטיינת»?", "en": "What is the copula in \"רחל היא תלמידה מצטיינת\"?"},[{"he": "רחל", "ar": "רחל", "ru": "רחל", "en": "רחל"}, {"he": "תלמידה", "ar": "תלמידה", "ru": "תלמידה", "en": "תלמידה"}, {"he": "היא", "ar": "היא", "ru": "היא", "en": "היא"}, {"he": "מצטיינת", "ar": "מצטיינת", "ru": "מצטיינת", "en": "מצטיינת"}],2,{"he": "חפשו את המילה המחברת בין הנושא לבין הנשוא השמני.", "ar": "ابحثوا عن الكلمة التي تصل المبتدأ بالخبر الاسمي.", "ru": "Найдите слово, связывающее подлежащее с именным сказуемым.", "en": "Find the word linking the subject with the nominal predicate."},{"he": "\"היא\" מחברת בין \"רחל\" לבין הנשוא השמני \"תלמידה מצטיינת\". למשל: \"אורי הוא רופא\".", "ar": "«היא» تصل «רחל» بالخبر الاسمي «תלמידה מצטיינת». ومثلها «أوري طبيب» وفي العبرية «אורי הוא רופא».", "ru": "«היא» связывает «רחל» с именным сказуемым «תלמידה מצטיינת». Например: «אורי הוא רופא».", "en": "\"היא\" links \"רחל\" to the nominal predicate \"תלמידה מצטיינת\". Compare \"אורי הוא רופא\"."},null,[{"he": "זהו הנושא, לא מילת הקישור.", "ar": "هذا هو المبتدأ لا الرابطة.", "ru": "Это подлежащее, не связка.", "en": "That is the subject, not the linking word."}, {"he": "זהו חלק מן הנשוא השמני, לא האוגד.", "ar": "هذا جزء من الخبر الاسمي لا الرابطة.", "ru": "Это часть именного сказуемого, не связка.", "en": "This is part of the nominal predicate, not the copula."}, null, {"he": "זהו תואר המתאר את התלמידה, לא האוגד.", "ar": "هذه صفة تصف الطالبة، لا الرابطة.", "ru": "Это прилагательное, описывающее ученицу, не связка.", "en": "This adjective describes the student; it is not the copula."}]),
Q("ha-syntax-2-2",{"he": "השלימו בלשון תקינה: \"מחר אני ___ לבית הספר מוקדם\".", "ar": "أكملوا بالعبرية الصحيحة: «מחר אני ___ לבית הספר מוקדם».", "ru": "Дополните на правильном иврите: «מחר אני ___ לבית הספר מוקדם».", "en": "Complete in correct Hebrew: \"מחר אני ___ לבית הספר מוקדם.\""},[{"he": "יבוא", "ar": "יבוא", "ru": "יבוא", "en": "יבוא"}, {"he": "אבוא", "ar": "אבוא", "ru": "אבוא", "en": "אבוא"}, {"he": "בא", "ar": "בא", "ru": "בא", "en": "בא"}, {"he": "באתם", "ar": "באתם", "ru": "באתם", "en": "באתם"}],1,{"he": "בדקו את הגוף והזמן של הפועל, לא רק את משמעותו.", "ar": "افحصوا الضمير والزمن، لا المعنى فقط.", "ru": "Проверьте лицо и время глагола, не только значение.", "en": "Check the verb’s person and tense, not just its meaning."},{"he": "\"אני אבוא\" היא צורת עתיד של גוף ראשון יחיד. למשל: \"מחר אני אלמד\".", "ar": "«אני אבוא» صيغة المستقبل للمتكلم المفرد. مثلًا: «غدًا سأدرس».", "ru": "«אני אבוא» - будущее время первого лица единственного числа. Например: «Завтра я буду учиться».", "en": "\"אני אבוא\" is first-person singular future. Compare \"מחר אני אלמד\"."},null,[{"he": "זו צורת עתיד של גוף שלישי יחיד, שאינה מתאימה ל\"אני\".", "ar": "هذه صيغة مستقبل للغائب المفرد ولا توافق «أنا».", "ru": "Это будущее время третьего лица единственного числа, не для «я».", "en": "This is third-person singular future, not for \"I\"."}, null, {"he": "זו צורת הווה ואינה תואמת את \"מחר\".", "ar": "هذه صيغة الحاضر ولا توافق «غدًا».", "ru": "Это форма настоящего времени, не соответствует «завтра».", "en": "This is present tense and does not match \"tomorrow\"."}, {"he": "זו צורת עבר של גוף שני רבים.", "ar": "هذه صيغة الماضي للمخاطبين.", "ru": "Это прошедшее время второго лица множественного числа.", "en": "This is second-person plural past."}]),
Q("ha-syntax-2-3",{"he": "מהו הנשוא במשפט השמני \"הדרך ארוכה\"?", "ar": "ما الخبر في الجملة الاسمية «הדרך ארוכה»؟", "ru": "Что является сказуемым в именном предложении «הדרך ארוכה»?", "en": "What is the predicate in the nominal sentence \"הדרך ארוכה\"?"},[{"he": "הדרך", "ar": "הדרך", "ru": "הדרך", "en": "הדרך"}, {"he": "הדרך ארוכה", "ar": "הדרך ארוכה", "ru": "הדרך ארוכה", "en": "הדרך ארוכה"}, {"he": "דרך", "ar": "דרך", "ru": "דרך", "en": "דרך"}, {"he": "ארוכה", "ar": "ארוכה", "ru": "ארוכה", "en": "ארוכה"}],3,{"he": "שאלו מה נאמר על הנושא.", "ar": "اسألوا ماذا قيل عن المبتدأ.", "ru": "Спросите, что сообщается о подлежащем.", "en": "Ask what is said about the subject."},{"he": "\"ארוכה\" הוא הנשוא: הוא מוסר תכונה של \"הדרך\". למשל: ב\"החדר שקט\" הנשוא הוא \"שקט\".", "ar": "«ארוכה» هو الخبر، فهو يصف «הדרך». ومثلًا خبر «الغرفة هادئة» هو «هادئة».", "ru": "«ארוכה» - сказуемое: оно сообщает признак слова «הדרך». Например, в «החדר שקט» сказуемое - «שקט».", "en": "\"ארוכה\" is the predicate, giving a quality of \"הדרך\". In \"החדר שקט\", the predicate is \"שקט\"."},null,[{"he": "זהו הנושא, שעליו נאמרת התכונה.", "ar": "هذا هو المبتدأ الذي تُذكر صفته.", "ru": "Это подлежащее, о котором сообщается признак.", "en": "That is the subject whose quality is described."}, {"he": "הצירוף כולל גם נושא וגם נשוא, ולא נשוא בלבד.", "ar": "يشمل التركيب المبتدأ والخبر، لا الخبر وحده.", "ru": "Фраза включает и подлежащее, и сказуемое, а не только сказуемое.", "en": "This includes both subject and predicate, not just predicate."}, {"he": "זו צורת שם ללא יידוע; במשפט מופיע הנושא המיודע.", "ar": "هذا اسم غير معرّف؛ في الجملة المبتدأ معرّف.", "ru": "Это существительное без артикля; в предложении подлежащее определённое.", "en": "That is an indefinite noun form; the sentence has a definite subject."}, null]),
Q("sx-2-01",{"he": "במשפט \"בגלל הגשם, המשחק נדחה\", מה התפקיד של \"בגלל הגשם\"?", "ar": "في جملة «בגלל הגשם, המשחק נדחה»، ما وظيفة «בגלל הגשם»؟", "ru": "Какова роль «בגלל הגשם» в предложении «בגלל הגשם, המשחק נדחה»?", "en": "In \"בגלל הגשם, המשחק נדחה\", what is the role of \"בגלל הגשם\"?"},[{"he": "תיאור סיבה", "ar": "تكملة السبب", "ru": "обстоятельство причины", "en": "adverbial of cause"}, {"he": "תיאור זמן", "ar": "ظرف زمان", "ru": "обстоятельство времени", "en": "time adverbial"}, {"he": "נושא", "ar": "المسند إليه", "ru": "подлежащее", "en": "subject"}, {"he": "מושא עקיף של \"נדחה\"", "ar": "مفعول به غير مباشر للفعل «נדחה»", "ru": "косвенное дополнение к «נדחה»", "en": "indirect object of \"נדחה\""}],0,{"he": "חשבו מה הצירוף מסביר על הדחייה.", "ar": "فكّروا: ماذا تفسّر العبارة بشأن التأجيل؟", "ru": "Подумайте, что это сочетание объясняет про перенос игры.", "en": "Think about what the phrase explains about the delay."},{"he": "\"בגלל הגשם\" עונה על השאלה למה המשחק נדחה. צירוף שעונה על \"למה?\" הוא תיאור סיבה. למשל: \"מפני החום נשארנו בבית\".", "ar": "«בגלל הגשם» (بسبب المطر) يجيب عن السؤال لماذا تأجّلت المباراة. العبارة التي تجيب عن «لماذا؟» هي تكملة السبب. مثلًا: «מפני החום נשארנו בבית».", "ru": "«בגלל הגשם» (из-за дождя) отвечает на вопрос, почему игру отложили. Сочетание, отвечающее на «почему?», - обстоятельство причины. Например: «מפני החום נשארנו בבית».", "en": "\"בגלל הגשם\" (because of the rain) answers why the game was postponed. A phrase that answers \"why?\" is an adverbial of cause. For example: \"מפני החום נשארנו בבית\"."},null,[null, {"he": "\"בגלל הגשם\" אינו אומר מתי, אלא למה.", "ar": "«בגלל הגשם» لا يقول متى، بل لماذا.", "ru": "«בגלל הגשם» говорит не «когда», а «почему».", "en": "\"בגלל הגשם\" says why, not when."}, {"he": "הנושא הוא \"המשחק\", כי עליו מספרים שנדחה.", "ar": "المسند إليه هو «המשחק»، فهو الذي تأجّل.", "ru": "Подлежащее - «המשחק»: именно игру отложили.", "en": "The subject is \"המשחק\": it is the game that was postponed."}, {"he": "הפועל \"נדחה\" אינו דורש את \"בגלל\". המילה הזאת מסבירה סיבה.", "ar": "الفعل «נדחה» لا يتطلّب «בגלל»، فهذه الكلمة تشرح السبب.", "ru": "Глагол «נדחה» не требует «בגלל»: это слово вводит причину.", "en": "The verb \"נדחה\" does not require \"בגלל\"; that word gives a reason."}]),
Q("sx-2-02",{"he": "מהו הנושא במשפט \"בחצר שיחקו שלושה ילדים\"?", "ar": "ما المسند إليه في جملة «בחצר שיחקו שלושה ילדים»؟", "ru": "Какое подлежащее в предложении «בחצר שיחקו שלושה ילדים»?", "en": "What is the subject of \"בחצר שיחקו שלושה ילדים\"?"},[{"he": "בחצר", "ar": "בחצר", "ru": "בחצר", "en": "בחצר"}, {"he": "שיחקו", "ar": "שיחקו", "ru": "שיחקו", "en": "שיחקו"}, {"he": "שלושה ילדים", "ar": "שלושה ילדים", "ru": "שלושה ילדים", "en": "שלושה ילדים"}, {"he": "אין נושא, זה משפט סתמי", "ar": "لا مسند إليه، فهي جملة بلا فاعل محدّد", "ru": "подлежащего нет, это неопределённо-личное предложение", "en": "there is no subject; it is an impersonal sentence"}],2,{"he": "הנושא לא תמיד בא בתחילת המשפט.", "ar": "المسند إليه لا يأتي دائمًا في بداية الجملة.", "ru": "Подлежащее не всегда стоит в начале предложения.", "en": "The subject does not always come first."},{"he": "שאלו: מי שיחקו? שלושה ילדים. הנושא בא כאן אחרי הנשוא, וזה תקין בעברית. הפועל ברבים מתאים לו.", "ar": "اسألوا: من لعب؟ «שלושה ילדים» (ثلاثة أولاد). جاء المسند إليه هنا بعد المسند، وهذا صحيح في العبرية. والفعل بصيغة الجمع يطابقه.", "ru": "Спросите: кто играл? «שלושה ילדים» (трое детей). Здесь подлежащее стоит после сказуемого, и в иврите это правильно. Глагол во множественном числе согласуется с ним.", "en": "Ask: who played? \"שלושה ילדים\" (three children). Here the subject comes after the predicate, which is correct in Hebrew. The plural verb agrees with it."},null,[{"he": "\"בחצר\" עונה על השאלה איפה, ולכן הוא תיאור מקום.", "ar": "«בחצר» يجيب عن السؤال أين، لذلك هو ظرف مكان.", "ru": "«בחצר» отвечает на вопрос «где?», это обстоятельство места.", "en": "\"בחצר\" answers \"where?\", so it is a place adverbial."}, {"he": "\"שיחקו\" היא הפעולה, ולכן היא הנשוא.", "ar": "«שיחקו» هي الفعل، لذلك هي المسند.", "ru": "«שיחקו» - это действие, поэтому это сказуемое.", "en": "\"שיחקו\" is the action, so it is the predicate."}, null, {"he": "יש כאן נושא מפורש. הוא פשוט בא אחרי הפועל.", "ar": "يوجد هنا مسند إليه صريح، لكنه جاء بعد الفعل.", "ru": "Здесь есть явное подлежащее, оно просто стоит после глагола.", "en": "There is an explicit subject; it simply comes after the verb."}]),
Q("sx-2-03",{"he": "השלימו את מילת הקישור המתאימה: \"התאמנו כל השבוע, ___ הפסדנו במשחק.\"", "ar": "أكملوا بأداة الربط المناسبة: «התאמנו כל השבוע, ___ הפסדנו במשחק».", "ru": "Вставьте подходящий союз: «התאמנו כל השבוע, ___ הפסדנו במשחק».", "en": "Fill in the right connector: \"התאמנו כל השבוע, ___ הפסדנו במשחק.\""},[{"he": "לכן", "ar": "לכן", "ru": "לכן", "en": "לכן"}, {"he": "כי", "ar": "כי", "ru": "כי", "en": "כי"}, {"he": "כתוצאה מכך", "ar": "כתוצאה מכך", "ru": "כתוצאה מכך", "en": "כתוצאה מכך"}, {"he": "אך", "ar": "אך", "ru": "אך", "en": "אך"}],3,{"he": "האם ההפסד הוא מה שציפינו לו אחרי אימון?", "ar": "هل الخسارة هي ما توقّعناه بعد التدريب؟", "ru": "Ожидали ли мы проигрыша после тренировок?", "en": "Is losing what we expected after training?"},{"he": "ציפינו שהאימון יוביל לניצחון, אבל קרה ההפך. לכן צריך מילת ניגוד: \"אך\".", "ar": "توقّعنا أن يؤدي التدريب إلى الفوز، لكن حدث العكس. لذلك نحتاج إلى أداة تناقض: «אך» (لكن).", "ru": "Мы ожидали, что тренировки приведут к победе, но вышло наоборот. Поэтому нужен союз противопоставления: «אך» (но).", "en": "We expected training to lead to a win, but the opposite happened. So we need a contrast word: \"אך\" (but)."},null,[{"he": "\"לכן\" מביעה תוצאה, אבל ההפסד אינו תוצאה של האימון.", "ar": "«לכן» تعبّر عن نتيجة، لكن الخسارة ليست نتيجة للتدريب.", "ru": "«לכן» выражает следствие, но проигрыш - не следствие тренировок.", "en": "\"לכן\" shows result, but losing is not a result of training."}, {"he": "\"כי\" מביעה סיבה, אבל ההפסד אינו הסיבה לאימון.", "ar": "«כי» تعبّر عن سبب، لكن الخسارة ليست سبب التدريب.", "ru": "«כי» выражает причину, но проигрыш - не причина тренировок.", "en": "\"כי\" shows cause, but losing is not the reason for training."}, {"he": "\"כתוצאה מכך\" מביעה תוצאה, וזה לא מתאים כאן.", "ar": "«כתוצאה מכך» تعبّر عن نتيجة، وهذا لا يناسب هنا.", "ru": "«כתוצאה מכך» выражает следствие, а здесь это не подходит.", "en": "\"כתוצאה מכך\" shows result, which does not fit here."}, null]),
Q("sx-2-04",{"he": "איזה קשר לוגי מביעה המילה \"לפיכך\" במשפט \"הכביש נחסם, לפיכך נסענו בדרך אחרת\"?", "ar": "أي علاقة منطقية تعبّر عنها «לפיכך» في جملة «הכביש נחסם, לפיכך נסענו בדרך אחרת»؟", "ru": "Какую логическую связь выражает «לפיכך» в предложении «הכביש נחסם, לפיכך נסענו בדרך אחרת»?", "en": "What logical relation does \"לפיכך\" express in \"הכביש נחסם, לפיכך נסענו בדרך אחרת\"?"},[{"he": "ניגוד", "ar": "تناقض", "ru": "противопоставление", "en": "contrast"}, {"he": "תוצאה", "ar": "نتيجة", "ru": "следствие", "en": "result"}, {"he": "סיבה", "ar": "سبب", "ru": "причина", "en": "cause"}, {"he": "תכלית (מטרה)", "ar": "غاية (هدف)", "ru": "цель (назначение)", "en": "purpose (aim)"}],1,{"he": "מה קרה קודם: החסימה או הבחירה בדרך אחרת?", "ar": "ماذا حدث أولًا: الإغلاق أم اختيار طريق آخر؟", "ru": "Что случилось раньше: перекрытие или выбор другой дороги?", "en": "What came first: the closure or choosing another road?"},{"he": "החסימה קרתה קודם, והנסיעה בדרך אחרת באה בעקבותיה. \"לפיכך\" מציגה את מה שנובע מהדבר הקודם. מילים דומות: \"לכן\", \"על כן\".", "ar": "حدث الإغلاق أولًا، ثم جاء السفر في طريق آخر نتيجةً له. «לפיכך» (لذلك) تقدّم ما ينتج عمّا قبله. كلمات مشابهة: «לכן»، «על כן».", "ru": "Сначала перекрыли дорогу, а объезд стал следствием этого. «לפיכך» (поэтому) вводит то, что вытекает из предыдущего. Похожие слова: «לכן», «על כן».", "en": "The closure came first, and the detour followed from it. \"לפיכך\" (therefore) introduces what follows from the previous fact. Similar words: \"לכן\", \"על כן\"."},null,[{"he": "אין כאן שני רעיונות הפוכים. הנסיעה בדרך אחרת נובעת מהחסימה.", "ar": "لا توجد هنا فكرتان متعاكستان. السفر في طريق آخر ناتج عن الإغلاق.", "ru": "Здесь нет противоположных мыслей: объезд вызван перекрытием дороги.", "en": "There are no opposite ideas here; the detour follows from the closure."}, null, {"he": "הסיבה היא החסימה. \"לפיכך\" מציגה את מה שקרה בגללה.", "ar": "السبب هو الإغلاق، و«לפיכך» تقدّم ما حدث بسببه.", "ru": "Причина - перекрытие дороги, а «לפיכך» вводит то, что из-за него случилось.", "en": "The cause is the closure; \"לפיכך\" introduces what happened because of it."}, {"he": "\"לפיכך\" אינה אומרת לשם מה נסענו, אלא מה קרה בעקבות החסימה.", "ar": "«לפיכך» لا تقول لأي هدف سافرنا، بل ماذا حدث بعد الإغلاق.", "ru": "«לפיכך» говорит не о цели поездки, а о том, что случилось после перекрытия.", "en": "\"לפיכך\" does not tell why we drove; it tells what followed the closure."}]),
Q("sx-2-05",{"he": "איזה סוג משפט הוא \"כשהגענו הביתה, התחיל לרדת גשם\"?", "ar": "ما نوع الجملة «כשהגענו הביתה, התחיל לרדת גשם»؟", "ru": "Какой это тип предложения: «כשהגענו הביתה, התחיל לרדת גשם»?", "en": "What type of sentence is \"כשהגענו הביתה, התחיל לרדת גשם\"?"},[{"he": "משפט פשוט", "ar": "جملة بسيطة", "ru": "простое", "en": "simple sentence"}, {"he": "משפט מאוחה", "ar": "جملة معطوفة", "ru": "сложносочинённое", "en": "compound sentence"}, {"he": "משפט מורכב", "ar": "جملة مركّبة", "ru": "сложноподчинённое", "en": "complex sentence"}, {"he": "משפט שמני ללא פועל", "ar": "جملة اسمية بلا فعل", "ru": "именное, без всякого глагола", "en": "nominal sentence with no verb"}],2,{"he": "בדקו אם כל חלק יכול לעמוד לבד כמשפט שלם.", "ar": "افحصوا: هل يستطيع كل جزء أن يقف وحده جملةً كاملة؟", "ru": "Проверьте, может ли каждая часть стоять отдельно как целое предложение.", "en": "Check whether each part can stand alone as a full sentence."},{"he": "\"כשהגענו הביתה\" היא פסוקית זמן, והיא תלויה במשפט העיקרי. משפט שיש בו משפט עיקרי ופסוקית הוא משפט מורכב.", "ar": "«כשהגענו הביתה» (عندما وصلنا إلى البيت) جملة ثانوية للزمان، وهي تابعة للجملة الرئيسية. الجملة التي فيها جملة رئيسية وجملة ثانوية هي جملة مركّبة.", "ru": "«כשהגענו הביתה» (когда мы пришли домой) - придаточное времени, оно зависит от главного. Предложение с главной и придаточной частью - сложноподчинённое.", "en": "\"כשהגענו הביתה\" (when we got home) is a time clause that depends on the main clause. A sentence with a main clause and a subordinate clause is complex."},null,[{"he": "יש כאן שני נשואים: \"הגענו\" ו\"התחיל\". לכן המשפט אינו פשוט.", "ar": "يوجد هنا مسندان: «הגענו» و«התחיל». لذلك الجملة ليست بسيطة.", "ru": "Здесь два сказуемых: «הגענו» и «התחיל», поэтому предложение не простое.", "en": "There are two predicates, \"הגענו\" and \"התחיל\", so it is not simple."}, {"he": "\"כשהגענו הביתה\" אינו יכול לעמוד לבד. לכן אין כאן שני משפטים שווי מעמד.", "ar": "«כשהגענו הביתה» لا تستطيع أن تقف وحدها، فلا توجد هنا جملتان متساويتان.", "ru": "«כשהגענו הביתה» не может стоять отдельно, значит, равноправных частей нет.", "en": "\"כשהגענו הביתה\" cannot stand alone, so there are no two equal clauses."}, null, {"he": "יש במשפט פעלים נטויים, ולכן הוא אינו משפט שמני.", "ar": "في الجملة أفعال مصرّفة، لذلك ليست جملة اسمية.", "ru": "В предложении есть спрягаемые глаголы, поэтому оно не именное.", "en": "The sentence has conjugated verbs, so it is not nominal."}]),
Q("sx-2-06",{"he": "במשפט \"המורה עזרה לתלמידה החדשה\", מה התפקיד של \"לתלמידה החדשה\"?", "ar": "في جملة «המורה עזרה לתלמידה החדשה»، ما وظيفة «לתלמידה החדשה»؟", "ru": "Какова роль «לתלמידה החדשה» в предложении «המורה עזרה לתלמידה החדשה»?", "en": "In \"המורה עזרה לתלמידה החדשה\", what is the role of \"לתלמידה החדשה\"?"},[{"he": "מושא עקיף", "ar": "مفعول به غير مباشر", "ru": "косвенное дополнение", "en": "indirect object"}, {"he": "תיאור מקום", "ar": "ظرف مكان", "ru": "обстоятельство места", "en": "place adverbial"}, {"he": "נושא", "ar": "المسند إليه", "ru": "подлежащее", "en": "subject"}, {"he": "לוואי של \"המורה\"", "ar": "نعت يصف كلمة «המורה» نفسها", "ru": "определение к слову «המורה»", "en": "attribute of \"המורה\""}],0,{"he": "בדקו איזו מילת יחס הפועל \"עזר\" דורש.", "ar": "افحصوا أي حرف جرّ يتطلّبه الفعل «עזר».", "ru": "Проверьте, какой предлог требует глагол «עזר».", "en": "Check which preposition the verb \"עזר\" requires."},{"he": "הפועל \"עזר\" דורש את מילת היחס \"ל\". צירוף שמתחיל במילת יחס שהפועל דורש הוא מושא עקיף. למשל: \"חיכיתי לחבר\".", "ar": "الفعل «עזר» (ساعد) يتطلّب حرف الجرّ «ל». العبارة التي تبدأ بحرف جرّ يتطلّبه الفعل هي مفعول به غير مباشر. مثلًا: «חיכיתי לחבר».", "ru": "Глагол «עזר» (помог) требует предлог «ל». Сочетание с предлогом, который требует глагол, - косвенное дополнение. Например: «חיכיתי לחבר».", "en": "The verb \"עזר\" (helped) requires the preposition \"ל\". A phrase starting with a preposition the verb requires is an indirect object. For example: \"חיכיתי לחבר\"."},null,[null, {"he": "\"לתלמידה\" אינה מציינת מקום. היא האדם שקיבל את העזרה.", "ar": "«לתלמידה» لا تدلّ على مكان، بل على الشخص الذي تلقّى المساعدة.", "ru": "«לתלמידה» не обозначает место: это человек, которому помогли.", "en": "\"לתלמידה\" is not a place; it is the person who got help."}, {"he": "הנושא הוא \"המורה\", כי היא זו שעזרה.", "ar": "المسند إليه هو «המורה»، فهي التي ساعدت.", "ru": "Подлежащее - «המורה»: именно она помогла.", "en": "The subject is \"המורה\": she is the one who helped."}, {"he": "\"לתלמידה החדשה\" אינו מתאר את המורה. הוא משלים את הפועל.", "ar": "«לתלמידה החדשה» لا تصف المعلّمة، بل تكمل الفعل.", "ru": "«לתלמידה החדשה» не описывает учительницу, а дополняет глагол.", "en": "\"לתלמידה החדשה\" does not describe the teacher; it completes the verb."}]),

Q("ha-syntax-3-1",{"he": "במשפט \"התלמידים היו עייפים אחרי הבחינה\", מה תפקיד \"היו\"?", "ar": "في جملة «התלמידים היו עייפים אחרי הבחינה»، ما وظيفة «היו»؟", "ru": "Какова роль «היו» в «התלמידים היו עייפים אחרי הבחינה»?", "en": "What is the role of \"היו\" in \"The students were tired after the exam\"?"},[{"he": "אוגד", "ar": "رابطة", "ru": "связка", "en": "copula"}, {"he": "נושא", "ar": "مبتدأ", "ru": "подлежащее", "en": "subject"}, {"he": "מושא", "ar": "مفعول به", "ru": "дополнение", "en": "object"}, {"he": "תיאור זמן", "ar": "ظرف زمان", "ru": "обстоятельство времени", "en": "time adverbial"}],0,{"he": "בדקו מה מחבר את הנושא לתכונה המיוחסת לו.", "ar": "افحصوا ما يصل الفاعل بالصفة المنسوبة إليه.", "ru": "Проверьте, что связывает подлежащее с его признаком.", "en": "Check what links the subject to the quality attributed to it."},{"he": "\"היו\" משמש אוגד המחבר את \"התלמידים\" ל\"עייפים\" בעבר. למשל: \"הדרך הייתה ארוכה\".", "ar": "«היו» رابطة تصل «התלמידים» بالخبر «עייפים» في الماضي. ومثلها «كانت الطريق طويلة».", "ru": "«היו» - связка, соединяющая «התלמידים» и «עייפים» в прошедшем времени. Например: «הדרך הייתה ארוכה».", "en": "\"היו\" is a copula linking \"התלמידים\" to \"עייפים\" in the past. Compare \"הדרך הייתה ארוכה\"."},null,[null, {"he": "\"התלמידים\" הם מי שעליהם נמסר המידע.", "ar": "«התלמידים» هم من يُخبر عنهم.", "ru": "«התלמידים» - те, о ком говорится.", "en": "\"התלמידים\" are the ones being described."}, {"he": "אין כאן מושא שהפעולה נעשית עליו.", "ar": "لا يوجد مفعول يقع عليه فعل.", "ru": "Здесь нет дополнения, на которое направлено действие.", "en": "There is no object receiving an action."}, {"he": "\"אחרי הבחינה\" מציין את הזמן, לא המילה שנשאלה.", "ar": "«אחרי הבחינה» يحدّد الزمن، لا الكلمة المطلوبة.", "ru": "«אחרי הבחינה» указывает время, а не данное слово.", "en": "\"אחרי הבחינה\" indicates time, not the target word."}]),
Q("ha-syntax-3-2",{"he": "איזה משפט כתוב לפי כללי ההתאם?", "ar": "أي جملة صحيحة وفق قواعد التوافق؟", "ru": "Какое предложение написано с правильным согласованием?", "en": "Which sentence has correct agreement?"},[{"he": "ההודעות נשלח אתמול.", "ar": "ההודעות נשלח אתמול.", "ru": "ההודעות נשלח אתמול.", "en": "ההודעות נשלח אתמול."}, {"he": "ההודעות נשלחו אתמול.", "ar": "ההודעות נשלחו אתמול.", "ru": "ההודעות נשלחו אתמול.", "en": "ההודעות נשלחו אתמול."}, {"he": "ההודעה נשלחו אתמול.", "ar": "ההודעה נשלחו אתמול.", "ru": "ההודעה נשלחו אתמול.", "en": "ההודעה נשלחו אתמול."}, {"he": "ההודעות נשלחה אתמול.", "ar": "ההודעות נשלחה אתמול.", "ru": "ההודעות נשלחה אתמול.", "en": "ההודעות נשלחה אתמול."}],1,{"he": "השוו את מספר הנושא למספר הפועל בעבר.", "ar": "قارنوا عدد الفاعل بعدد الفعل في الماضي.", "ru": "Сравните число подлежащего и глагола в прошедшем времени.", "en": "Compare the number of the subject and past-tense verb."},{"he": "\"ההודעות\" ברבות ו\"נשלחו\" ברבים. בעבר צורת הרבים הזאת מתאימה לזכר ולנקבה. למשל: \"המכתבים נשלחו אתמול\".", "ar": "«ההודעות» جمع و«נשלחו» جمع. في الماضي هذه الصيغة تلائم المذكر والمؤنث. مثلًا: «أُرسلت الرسائل أمس».", "ru": "«ההודעות» - множественное число, как и «נשלחו». В прошедшем времени эта форма подходит обоим родам. Например: «המכתבים נשלחו אתמול».", "en": "\"ההודעות\" is plural and so is \"נשלחו\". This past plural form works for both genders. Compare \"המכתבים נשלחו אתמול\"."},null,[{"he": "\"נשלח\" ביחיד זכר, אך הנושא ברבים.", "ar": "«נשלח» مفرد مذكر، والفاعل جمع.", "ru": "«נשלח» - мужской род единственного числа, подлежащее множественного.", "en": "\"נשלח\" is masculine singular, but the subject is plural."}, null, {"he": "\"ההודעה\" ביחידה, אך הפועל ברבים.", "ar": "«ההודעה» مفرد مؤنث، والفعل جمع.", "ru": "«ההודעה» - единственное число, а глагол множественного.", "en": "\"ההודעה\" is singular, but the verb is plural."}, {"he": "\"נשלחה\" ביחידה נקבה, אך הנושא ברבות.", "ar": "«נשלחה» مفرد مؤنث، والفاعل جمع.", "ru": "«נשלחה» - женский род единственного числа, подлежащее множественного.", "en": "\"נשלחה\" is feminine singular, but the subject is plural."}]),
Q("ha-syntax-3-3",{"he": "במשפט \"הספרים החדשים הגיעו לספרייה\", מהו הנשוא?", "ar": "ما المسند الفعلي في جملة «הספרים החדשים הגיעו לספרייה»؟", "ru": "Какое сказуемое в «הספרים החדשים הגיעו לספרייה»?", "en": "What is the predicate of \"הספרים החדשים הגיעו לספרייה\"?"},[{"he": "הספרים", "ar": "הספרים", "ru": "הספרים", "en": "הספרים"}, {"he": "החדשים", "ar": "החדשים", "ru": "החדשים", "en": "החדשים"}, {"he": "הגיעו", "ar": "הגיעו", "ru": "הגיעו", "en": "הגיעו"}, {"he": "לספרייה", "ar": "לספרייה", "ru": "לספרייה", "en": "לספרייה"}],2,{"he": "הבחינו בין תואר של השם לבין הפועל המתאר את ההתרחשות.", "ar": "ميّزوا بين صفة الاسم والفعل الذي يصف الحدث.", "ru": "Отличите определение существительного от глагола, описывающего событие.", "en": "Distinguish the noun’s adjective from the verb describing the event."},{"he": "\"הגיעו\" הוא הנשוא הפועלי, ו\"הספרים החדשים\" הם הנושא. למשל: ב\"התלמידים הצעירים יצאו\" הנשוא הוא \"יצאו\".", "ar": "«הגיעו» هو الخبر الفعلي و«הספרים החדשים» الفاعل. ومثلًا في «خرج الطلاب الصغار» الخبر «יצאו».", "ru": "«הגיעו» - глагольное сказуемое, «הספרים החדשים» - подлежащее. Например, в «התלמידים הצעירים יצאו» сказуемое - «יצאו».", "en": "\"הגיעו\" is the verb predicate; \"הספרים החדשים\" is the subject. In \"התלמידים הצעירים יצאו\", the predicate is \"יצאו\"."},null,[{"he": "זהו חלק מן הנושא, לא הפעולה שנאמרת עליו.", "ar": "هذا جزء من الفاعل، لا الفعل الذي يصفه.", "ru": "Это часть подлежащего, не действие, которое о нём сообщается.", "en": "This is part of the subject, not its action."}, {"he": "זו מילה המתארת את הספרים, לא נשוא המשפט.", "ar": "هذه كلمة تصف الكتب وليست خبر الجملة.", "ru": "Это определение слова «книги», не сказуемое.", "en": "This word describes the books; it is not the predicate."}, null, {"he": "הצירוף מציין יעד, לא את הפעולה המרכזית.", "ar": "يشير التركيب إلى الوجهة لا إلى الفعل الأساسي.", "ru": "Эта фраза обозначает направление, не основное действие.", "en": "This phrase indicates a destination, not the main action."}]),
Q("sx-3-01",{"he": "במשפט \"הספר שקיבלתי מסבתא מרתק\", מהו הנשוא של המשפט העיקרי?", "ar": "في جملة «הספר שקיבלתי מסבתא מרתק»، ما المسند في الجملة الرئيسية؟", "ru": "Какое сказуемое главного предложения в «הספר שקיבלתי מסבתא מרתק»?", "en": "In \"הספר שקיבלתי מסבתא מרתק\", what is the predicate of the main clause?"},[{"he": "קיבלתי", "ar": "קיבלתי", "ru": "קיבלתי", "en": "קיבלתי"}, {"he": "מסבתא", "ar": "מסבתא", "ru": "מסבתא", "en": "מסבתא"}, {"he": "הספר שקיבלתי", "ar": "הספר שקיבלתי", "ru": "הספר שקיבלתי", "en": "הספר שקיבלתי"}, {"he": "מרתק", "ar": "מרתק", "ru": "מרתק", "en": "מרתק"}],3,{"he": "הוציאו את הפסוקית שמתחילה ב\"ש\" ובדקו מה נשאר.", "ar": "احذفوا الجملة الثانوية التي تبدأ بـ«ש» وانظروا ماذا يبقى.", "ru": "Уберите придаточное, которое начинается с «ש», и посмотрите, что останется.", "en": "Remove the clause that starts with \"ש\" and see what is left."},{"he": "בלי הפסוקית \"שקיבלתי מסבתא\" נשאר המשפט \"הספר מרתק\". זה משפט שמני, והנשוא בו הוא \"מרתק\".", "ar": "بدون الجملة الثانوية «שקיבלתי מסבתא» تبقى جملة «הספר מרתק» (الكتاب مشوّق). إنها جملة اسمية، والمسند فيها «מרתק».", "ru": "Без придаточного «שקיבלתי מסבתא» остаётся «הספר מרתק» (книга увлекательная). Это именное предложение, и сказуемое в нём - «מרתק».", "en": "Without the clause \"שקיבלתי מסבתא\" we get \"הספר מרתק\" (the book is fascinating). It is a nominal sentence, and its predicate is \"מרתק\"."},null,[{"he": "\"קיבלתי\" הוא הנשוא של הפסוקית, ולא של המשפט העיקרי.", "ar": "«קיבלתי» مسند الجملة الثانوية، لا الجملة الرئيسية.", "ru": "«קיבלתי» - сказуемое придаточного, а не главного предложения.", "en": "\"קיבלתי\" is the predicate of the clause, not of the main sentence."}, {"he": "\"מסבתא\" שייך לפסוקית ומשלים את \"קיבלתי\". הוא אינו נשוא.", "ar": "«מסבתא» جزء من الجملة الثانوية ويكمل «קיבלתי»، وليس مسندًا.", "ru": "«מסבתא» входит в придаточное и дополняет «קיבלתי»; это не сказуемое.", "en": "\"מסבתא\" belongs to the clause and completes \"קיבלתי\"; it is not a predicate."}, {"he": "זה הנושא ותחילת הפסוקית. עליו נאמר משהו, והוא אינו הנשוא.", "ar": "هذا هو المسند إليه وبداية الجملة الثانوية، وليس المسند.", "ru": "Это подлежащее и начало придаточного, а не сказуемое.", "en": "This is the subject and the start of the clause, not the predicate."}, null]),
Q("sx-3-02",{"he": "באיזה משפט יש שגיאת התאם בין הנושא לנשוא?", "ar": "في أي جملة يوجد خطأ في التوافق بين المسند إليه والمسند؟", "ru": "В каком предложении подлежащее и сказуемое не согласованы?", "en": "In which sentence do the subject and predicate fail to agree?"},[{"he": "המורה והתלמידים יצאו לטיול.", "ar": "המורה והתלמידים יצאו לטיול.", "ru": "המורה והתלמידים יצאו לטיול.", "en": "המורה והתלמידים יצאו לטיול."}, {"he": "רשימת המשתתפים פורסמו אתמול.", "ar": "רשימת המשתתפים פורסמו אתמול.", "ru": "רשימת המשתתפים פורסמו אתמול.", "en": "רשימת המשתתפים פורסמו אתמול."}, {"he": "הילדות שיחקו בחצר.", "ar": "הילדות שיחקו בחצר.", "ru": "הילדות שיחקו בחצר.", "en": "הילדות שיחקו בחצר."}, {"he": "השולחן והכיסאות החדשים הגיעו הבוקר.", "ar": "השולחן והכיסאות החדשים הגיעו הבוקר.", "ru": "השולחן והכיסאות החדשים הגיעו הבוקר.", "en": "השולחן והכיסאות החדשים הגיעו הבוקר."}],1,{"he": "בדקו מהי המילה המרכזית בכל נושא.", "ar": "افحصوا ما هي الكلمة الأساسية في كل مسند إليه.", "ru": "Найдите главное слово в каждом подлежащем.", "en": "Find the main word in each subject."},{"he": "הנושא הוא \"רשימת המשתתפים\", והמילה המרכזית בו היא \"רשימת\". היא נקבה יחידה, ולכן צריך \"פורסמה\". בצירוף סמיכות, הנשוא מתאים למילה הראשונה.", "ar": "المسند إليه هو «רשימת המשתתפים» (قائمة المشاركين)، وكلمته الأساسية «רשימת». هي مؤنّث مفرد، لذلك يجب «פורסמה». في الإضافة يطابق المسندُ الكلمةَ الأولى.", "ru": "Подлежащее - «רשימת המשתתפים» (список участников), главное слово - «רשימת». Оно женского рода, единственного числа, поэтому нужно «פורסמה». В сопряжённом сочетании сказуемое согласуется с первым словом.", "en": "The subject is \"רשימת המשתתפים\" (the list of participants); its main word is \"רשימת\". It is feminine singular, so it needs \"פורסמה\". In a construct phrase, the predicate agrees with the first word."},null,[{"he": "שני נושאים שמחוברים ב\"ו\" מקבלים נשוא ברבים, ולכן \"יצאו\" תקין.", "ar": "مسندان إليهما معطوفان بـ«ו» يأخذان مسندًا بصيغة الجمع، فـ«יצאו» صحيح.", "ru": "Два подлежащих, соединённых «ו», требуют множественного числа, так что «יצאו» верно.", "en": "Two subjects joined by \"ו\" take a plural predicate, so \"יצאו\" is correct."}, null, {"he": "\"שיחקו\" בעבר מתאים גם לרבות, ולכן המשפט תקין.", "ar": "«שיחקו» في الماضي يناسب جمع المؤنّث أيضًا، فالجملة صحيحة.", "ru": "Форма прошедшего «שיחקו» подходит и для женского рода, предложение верное.", "en": "Past-tense \"שיחקו\" also fits feminine plural, so the sentence is correct."}, {"he": "יש כאן שני נושאים, ולכן הנשוא \"הגיעו\" ברבים תקין.", "ar": "هنا مسندان إليهما، لذلك المسند «הגיעו» بصيغة الجمع صحيح.", "ru": "Здесь два подлежащих, поэтому «הגיעו» во множественном числе верно.", "en": "There are two subjects here, so plural \"הגיעו\" is correct."}]),
Q("sx-3-03",{"he": "\"לא למדתי למבחן, ולכן קיבלתי ציון נמוך.\" איזו מילה יכולה להחליף את \"ולכן\" בלי לשנות את הקשר הלוגי?", "ar": "«לא למדתי למבחן, ולכן קיבלתי ציון נמוך». أي كلمة يمكن أن تحلّ محلّ «ולכן» دون تغيير العلاقة المنطقية؟", "ru": "«לא למדתי למבחן, ולכן קיבלתי ציון נמוך». Каким словом можно заменить «ולכן», не меняя логической связи?", "en": "\"לא למדתי למבחן, ולכן קיבלתי ציון נמוך.\" Which word can replace \"ולכן\" without changing the logical relation?"},[{"he": "ולמרות זאת", "ar": "ולמרות זאת", "ru": "ולמרות זאת", "en": "ולמרות זאת"}, {"he": "כי", "ar": "כי", "ru": "כי", "en": "כי"}, {"he": "ולפיכך", "ar": "ולפיכך", "ru": "ולפיכך", "en": "ולפיכך"}, {"he": "אף על פי ש", "ar": "אף על פי ש", "ru": "אף על פי ש", "en": "אף על פי ש"}],2,{"he": "שאלו: הציון הנמוך הוא סיבה או תוצאה?", "ar": "اسألوا: هل العلامة المنخفضة سبب أم نتيجة؟", "ru": "Спросите себя: низкая оценка - причина или следствие?", "en": "Ask: is the low grade a cause or a result?"},{"he": "הציון הנמוך הוא תוצאה של כך שלא למדתי. \"ולכן\" ו\"ולפיכך\" מביעות שתיהן תוצאה. לכן אפשר להחליף אחת בשנייה.", "ar": "العلامة المنخفضة نتيجة لعدم الدراسة. «ולכן» و«ולפיכך» تعبّران كلتاهما عن النتيجة، لذلك يمكن أن تحلّ إحداهما محلّ الأخرى.", "ru": "Низкая оценка - следствие того, что я не учился. И «ולכן», и «ולפיכך» выражают следствие, поэтому одно можно заменить другим.", "en": "The low grade is a result of not studying. Both \"ולכן\" and \"ולפיכך\" express result, so one can replace the other."},null,[{"he": "\"ולמרות זאת\" מביעה ניגוד, והמשפט יקבל משמעות אחרת.", "ar": "«ולמרות זאת» تعبّر عن تناقض، فيتغيّر معنى الجملة.", "ru": "«ולמרות זאת» выражает противопоставление, и смысл изменится.", "en": "\"ולמרות זאת\" expresses contrast, so the meaning would change."}, {"he": "\"כי\" מביעה סיבה, אבל הציון הנמוך לא גרם לכך שלא למדתי.", "ar": "«כי» تعبّر عن سبب، لكن العلامة المنخفضة لم تكن سبب عدم دراستي.", "ru": "«כי» выражает причину, но низкая оценка не была причиной того, что я не учился.", "en": "\"כי\" expresses cause, but the low grade did not cause my not studying."}, null, {"he": "\"אף על פי ש\" מביעה ויתור: דבר שקרה למרות משהו אחר.", "ar": "«אף על פי ש» تعبّر عن تنازل: شيء حدث رغم شيء آخر.", "ru": "«אף על פי ש» выражает уступку: что-то случилось вопреки другому.", "en": "\"אף על פי ש\" expresses concession: something happened despite something else."}]),
Q("sx-3-04",{"he": "במשפט \"יוסי נשאר בבית מפני שהיה חולה\", מה התפקיד של הפסוקית \"מפני שהיה חולה\"?", "ar": "في جملة «יוסי נשאר בבית מפני שהיה חולה»، ما وظيفة الجملة الثانوية «מפני שהיה חולה»؟", "ru": "Какова роль придаточного «מפני שהיה חולה» в предложении «יוסי נשאר בבית מפני שהיה חולה»?", "en": "In \"יוסי נשאר בבית מפני שהיה חולה\", what is the role of the clause \"מפני שהיה חולה\"?"},[{"he": "תיאור סיבה", "ar": "تكملة السبب", "ru": "обстоятельство причины", "en": "adverbial of cause"}, {"he": "תיאור תוצאה", "ar": "تكملة النتيجة", "ru": "обстоятельство следствия", "en": "adverbial of result"}, {"he": "מושא", "ar": "مفعول به", "ru": "дополнение", "en": "object"}, {"he": "לוואי של שם העצם \"בית\"", "ar": "نعت للاسم «בית»", "ru": "определение к существительному «בית»", "en": "attribute of the noun \"בית\""}],0,{"he": "שימו לב למילה שפותחת את הפסוקית.", "ar": "انتبهوا إلى الكلمة التي تفتتح الجملة الثانوية.", "ru": "Обратите внимание на слово, с которого начинается придаточное.", "en": "Notice the word that opens the clause."},{"he": "\"מפני ש\" פותחת פסוקית שעונה על השאלה למה. לכן זו פסוקית תיאור סיבה. כך גם \"כי\" ו\"בגלל ש\".", "ar": "«מפני ש» (لأنّ) تفتتح جملة ثانوية تجيب عن السؤال لماذا. لذلك هي جملة ثانوية تؤدي وظيفة تكملة السبب. ومثلها «כי» و«בגלל ש».", "ru": "«מפני ש» (потому что) открывает придаточное, отвечающее на вопрос «почему?». Значит, это придаточное причины. Так же работают «כי» и «בגלל ש».", "en": "\"מפני ש\" (because) opens a clause that answers \"why?\". So it is a clause of cause. \"כי\" and \"בגלל ש\" work the same way."},null,[null, {"he": "המחלה אינה נובעת מהישיבה בבית. היא הסיבה לה.", "ar": "المرض ليس ناتجًا عن البقاء في البيت، بل هو سببه.", "ru": "Болезнь не вытекает из того, что он остался дома, а служит причиной.", "en": "The illness does not follow from staying home; it causes it."}, {"he": "הפועל \"נשאר\" אינו דורש מושא. הפסוקית מסבירה למה.", "ar": "الفعل «נשאר» لا يتطلّب مفعولًا به، والجملة الثانوية تشرح لماذا.", "ru": "Глагол «נשאר» не требует дополнения; придаточное объясняет «почему».", "en": "The verb \"נשאר\" takes no object; the clause explains why."}, {"he": "הפסוקית אינה מתארת את הבית. היא מסבירה את הפעולה.", "ar": "الجملة الثانوية لا تصف البيت، بل تشرح الفعل.", "ru": "Придаточное не описывает дом, а объясняет действие.", "en": "The clause does not describe the house; it explains the action."}]),
Q("sx-3-05",{"he": "איזה משפט הוא משפט פשוט?", "ar": "أي جملة هي جملة بسيطة؟", "ru": "Какое предложение простое?", "en": "Which sentence is a simple sentence?"},[{"he": "הלכנו לים בבוקר המוקדם מאוד, אבל המים היו קרים מדי ולא נכנסנו לשחות.", "ar": "הלכנו לים בבוקר המוקדם מאוד, אבל המים היו קרים מדי ולא נכנסנו לשחות.", "ru": "הלכנו לים בבוקר המוקדם מאוד, אבל המים היו קרים מדי ולא נכנסנו לשחות.", "en": "הלכנו לים בבוקר המוקדם מאוד, אבל המים היו קרים מדי ולא נכנסנו לשחות."}, {"he": "התלמיד ששאל שאלה קיבל תשובה.", "ar": "התלמיד ששאל שאלה קיבל תשובה.", "ru": "התלמיד ששאל שאלה קיבל תשובה.", "en": "התלמיד ששאל שאלה קיבל תשובה."}, {"he": "ירד גשם, ולכן נשארנו בבית.", "ar": "ירד גשם, ולכן נשארנו בבית.", "ru": "ירד גשם, ולכן נשארנו בבית.", "en": "ירד גשם, ולכן נשארנו בבית."}, {"he": "בשבוע שעבר, אחרי הלימודים, טיילנו עם המדריך החדש בשמורת הטבע.", "ar": "בשבוע שעבר, אחרי הלימודים, טיילנו עם המדריך החדש בשמורת הטבע.", "ru": "בשבוע שעבר, אחרי הלימודים, טיילנו עם המדריך החדש בשמורת הטבע.", "en": "בשבוע שעבר, אחרי הלימודים, טיילנו עם המדריך החדש בשמורת הטבע."}],3,{"he": "ספרו כמה נשואים יש בכל משפט. האורך אינו קובע.", "ar": "عدّوا المسندات في كل جملة. الطول لا يحسم.", "ru": "Посчитайте сказуемые в каждом предложении. Длина не важна.", "en": "Count the predicates in each sentence. Length does not decide."},{"he": "במשפט על הטיול יש נשוא אחד בלבד: \"טיילנו\". כל שאר המילים מוסיפות פרטים לנשוא הזה. משפט ארוך יכול להיות משפט פשוט.", "ar": "في الجملة عن الرحلة مسند واحد فقط: «טיילנו» (تنزّهنا). وباقي الكلمات تضيف تفاصيل إلى هذا المسند. الجملة الطويلة قد تكون بسيطة.", "ru": "В предложении о прогулке одно сказуемое: «טיילנו» (мы гуляли). Остальные слова добавляют к нему подробности. Длинное предложение может быть простым.", "en": "The trip sentence has only one predicate: \"טיילנו\" (we hiked). The other words add details to it. A long sentence can be simple."},null,[{"he": "יש כאן משפטים שמחוברים ב\"אבל\" וב\"ו\", ולכן זה משפט מאוחה.", "ar": "هنا جمل مربوطة بـ«אבל» وبـ«ו»، لذلك هي جملة معطوفة.", "ru": "Здесь части соединены «אבל» и «ו», поэтому это сложносочинённое.", "en": "Clauses here are joined by \"אבל\" and \"ו\", so it is compound."}, {"he": "\"ששאל שאלה\" היא פסוקית, ולכן זה משפט מורכב.", "ar": "«ששאל שאלה» جملة ثانوية، لذلك هي جملة مركّبة.", "ru": "«ששאל שאלה» - придаточное, поэтому это сложноподчинённое.", "en": "\"ששאל שאלה\" is a subordinate clause, so it is complex."}, {"he": "יש כאן שני משפטים שמחוברים ב\"ולכן\", ולכן זה משפט מאוחה.", "ar": "هنا جملتان مربوطتان بـ«ולכן»، لذلك هي جملة معطوفة.", "ru": "Здесь две части, соединённые «ולכן», поэтому это сложносочинённое.", "en": "Two clauses are joined by \"ולכן\", so it is compound."}, null]),
Q("sx-3-06",{"he": "באיזה משפט המילה \"חדש\" היא נשוא, ולא לוואי?", "ar": "في أي جملة تكون كلمة «חדש» مسندًا لا نعتًا؟", "ru": "В каком предложении слово «חדש» - сказуемое, а не определение?", "en": "In which sentence is \"חדש\" a predicate, not an attribute?"},[{"he": "המחשב החדש נמצא בכיתה.", "ar": "המחשב החדש נמצא בכיתה.", "ru": "המחשב החדש נמצא בכיתה.", "en": "המחשב החדש נמצא בכיתה."}, {"he": "קנינו מחשב חדש לכיתה.", "ar": "קנינו מחשב חדש לכיתה.", "ru": "קנינו מחשב חדש לכיתה.", "en": "קנינו מחשב חדש לכיתה."}, {"he": "המחשב שקנינו לכיתה חדש.", "ar": "המחשב שקנינו לכיתה חדש.", "ru": "המחשב שקנינו לכיתה חדש.", "en": "המחשב שקנינו לכיתה חדש."}, {"he": "המורה הביאה מחשב חדש וגדול לכיתה שלנו.", "ar": "המורה הביאה מחשב חדש וגדול לכיתה שלנו.", "ru": "המורה הביאה מחשב חדש וגדול לכיתה שלנו.", "en": "המורה הביאה מחשב חדש וגדול לכיתה שלנו."}],2,{"he": "לוואי מתאר שם עצם בתוך צירוף. נשוא אומר משהו על הנושא.", "ar": "النعت يصف اسمًا داخل عبارة، أما المسند فيخبر عن المسند إليه.", "ru": "Определение описывает существительное внутри сочетания. Сказуемое сообщает что-то о подлежащем.", "en": "An attribute describes a noun within a phrase. A predicate says something about the subject."},{"he": "במשפט \"המחשב שקנינו לכיתה חדש\" הנושא הוא \"המחשב\", ועליו נאמר שהוא חדש. זה משפט שמני, ו\"חדש\" הוא הנשוא. השוו: \"המחשב החדש\" (לוואי), \"המחשב חדש\" (נשוא).", "ar": "في «המחשב שקנינו לכיתה חדש» المسند إليه «המחשב»، ونُخبر عنه أنه جديد. هذه جملة اسمية، و«חדש» هو المسند. قارنوا: «המחשב החדש» (نعت) و«המחשב חדש» (مسند).", "ru": "В «המחשב שקנינו לכיתה חדש» подлежащее - «המחשב», и о нём сказано, что он новый. Это именное предложение, «חדש» - сказуемое. Сравните: «המחשב החדש» (определение) и «המחשב חדש» (сказуемое).", "en": "In \"המחשב שקנינו לכיתה חדש\" the subject is \"המחשב\", and we say it is new. It is a nominal sentence, and \"חדש\" is the predicate. Compare \"המחשב החדש\" (attribute) with \"המחשב חדש\" (predicate)."},null,[{"he": "\"החדש\" בא עם ה\"א הידיעה, כמו \"המחשב\", ומתאר אותו. לכן הוא לוואי.", "ar": "«החדש» معرّف مثل «המחשב» ويصفه، لذلك هو نعت.", "ru": "«החדש» с артиклем, как «המחשב», и описывает его, значит, это определение.", "en": "\"החדש\" has the article like \"המחשב\" and describes it, so it is an attribute."}, {"he": "\"חדש\" צמוד לשם העצם \"מחשב\" ומתאר אותו. לכן הוא לוואי.", "ar": "«חדש» ملاصق للاسم «מחשב» ويصفه، لذلك هو نعت.", "ru": "«חדש» стоит при существительном «מחשב» и описывает его - это определение.", "en": "\"חדש\" sits next to the noun \"מחשב\" and describes it, so it is an attribute."}, null, {"he": "\"חדש\" מתאר את \"מחשב\" יחד עם \"גדול\". שניהם לוואים.", "ar": "«חדש» يصف «מחשב» مع «גדול»، وكلاهما نعت.", "ru": "«חדש» вместе с «גדול» описывает «מחשב»; оба - определения.", "en": "\"חדש\" describes \"מחשב\" along with \"גדול\"; both are attributes."}]),
],
]);

Q("ha-lexicon-1-1",{"he": "איזו מילה נרדפת ל\"שמח\" במשפט \"הילד שמח לקבל את ההזמנה\"?", "ar": "أي كلمة مرادفة لـ«שמח» في جملة «فرح الطفل بتلقّي الدعوة»؟", "ru": "Какой синоним у «שמח» в предложении «Ребёнок рад приглашению»?", "en": "Which word is a synonym of \"שמח\" in \"The boy was happy to receive the invitation\"?"},[{"he": "עייף", "ar": "متعب", "ru": "усталый", "en": "tired"}, {"he": "מודאג", "ar": "قلق", "ru": "обеспокоенный", "en": "worried"}, {"he": "כועס", "ar": "غاضب", "ru": "сердитый", "en": "angry"}, {"he": "מרוצה", "ar": "مسرور", "ru": "довольный", "en": "pleased"}],3,{"he": "חפשו מילה שמביעה רגש חיובי דומה בהקשר הזה.", "ar": "ابحثوا عن كلمة تعبّر عن شعور إيجابي قريب في هذا السياق.", "ru": "Ищите слово с близким положительным чувством в этом контексте.", "en": "Look for a similar positive feeling in this context."},{"he": "\"מרוצה\" קרוב במשמעותו ל\"שמח\" כאן. למשל: \"היא הייתה מרוצה מן הבשורה\".", "ar": "«מרוצה» قريبة المعنى من «שמח» هنا. مثلًا: «كانت مسرورة بالخبر».", "ru": "«מרוצה» здесь близко по значению к «שמח». Например: «Она была довольна новостью».", "en": "\"מרוצה\" is close in meaning to \"שמח\" here. For example: \"She was pleased by the news.\""},null,[{"he": "עייפות מתארת חוסר אנרגיה, לא שמחה.", "ar": "التعب يصف نقص الطاقة لا الفرح.", "ru": "Усталость означает нехватку сил, не радость.", "en": "Tiredness describes low energy, not happiness."}, {"he": "דאגה היא רגש של חשש, לא של שמחה.", "ar": "القلق شعور بالخوف لا بالفرح.", "ru": "Тревога - это беспокойство, не радость.", "en": "Worry is a feeling of concern, not joy."}, {"he": "כעס הוא רגש שונה מן הרגש שבמשפט.", "ar": "الغضب شعور مختلف عن الشعور في الجملة.", "ru": "Гнев отличается от чувства в предложении.", "en": "Anger is different from the feeling in the sentence."}, null]),
Q("ha-lexicon-1-2",{"he": "מה ההפך של \"רחב\" כשמתארים רחוב?", "ar": "ما عكس «רחב» عند وصف شارع؟", "ru": "Что противоположно слову «רחב» при описании улицы?", "en": "What is the opposite of \"רחב\" when describing a street?"},[{"he": "צר", "ar": "ضيّق", "ru": "узкий", "en": "narrow"}, {"he": "ארוך", "ar": "طويل", "ru": "длинный", "en": "long"}, {"he": "קרוב", "ar": "قريب", "ru": "близкий", "en": "nearby"}, {"he": "ישר", "ar": "مستقيم", "ru": "прямой", "en": "straight"}],0,{"he": "חשבו על המידה מצד לצד, לא על האורך.", "ar": "فكّروا في القياس من جانب إلى آخر لا في الطول.", "ru": "Подумайте о размере поперёк, а не о длине.", "en": "Think about width, not length."},{"he": "רחוב \"צר\" הוא ההפך מרחוב \"רחב\". למשל: \"המעבר צר מאוד\".", "ar": "الشارع «צר» عكس الشارع «רחב». مثلًا: «الممر ضيّق جدًا».", "ru": "«צר» противоположно «רחב» для улицы. Например: «Проход очень узкий».", "en": "A \"צר\" street is the opposite of a \"רחב\" street. For example: \"The passage is very narrow.\""},null,[null, {"he": "\"ארוך\" מתאר אורך, לא את ההפך מרוחב.", "ar": "«ארוך» يصف الطول، وليس عكس السعة.", "ru": "«ארוך» описывает длину, а не противоположность ширине.", "en": "\"ארוך\" describes length, not the opposite of wide."}, {"he": "\"קרוב\" מתאר מרחק מנקודת ייחוס.", "ar": "«קרוב» يصف المسافة من نقطة ما.", "ru": "«קרוב» описывает расстояние до чего-либо.", "en": "\"קרוב\" describes distance from a reference point."}, {"he": "\"ישר\" מתאר כיוון או צורה, לא רוחב.", "ar": "«ישר» يصف الاتجاه أو الشكل لا العرض.", "ru": "«ישר» описывает направление или форму, не ширину.", "en": "\"ישר\" describes direction or shape, not width."}]),
Q("ha-lexicon-1-3",{"he": "מה פירוש הביטוי \"בלי סוף\" במשפט \"הם שאלו שאלות בלי סוף\"?", "ar": "ماذا تعني عبارة «בלי סוף» في جملة «طرحوا أسئلة بلا نهاية»؟", "ru": "Что означает «בלי סוף» в предложении «Они задавали вопросы без конца»?", "en": "What does \"בלי סוף\" mean in \"They asked questions בלי סוף\"?"},[{"he": "בלי תשובה", "ar": "دون إجابة", "ru": "без ответа", "en": "without answers"}, {"he": "בלי תור", "ar": "دون دور", "ru": "без очереди", "en": "without taking turns"}, {"he": "הרבה מאוד", "ar": "بكثرة جدًا", "ru": "очень много", "en": "a great many"}, {"he": "רק בהתחלה", "ar": "في البداية فقط", "ru": "только вначале", "en": "only at first"}],2,{"he": "קראו את הביטוי כולו בהקשר של כמות השאלות.", "ar": "اقرؤوا العبارة كاملة في سياق عدد الأسئلة.", "ru": "Прочитайте всё выражение в контексте количества вопросов.", "en": "Read the whole expression in the context of the number of questions."},{"he": "\"בלי סוף\" מציין ריבוי גדול או משהו שנמשך מאוד. למשל: \"חיכינו בלי סוף\" פירושו שחיכינו זמן רב.", "ar": "«בלי סוף» يدل على كثرة أو امتداد طويل. مثلًا: «انتظرنا بلا نهاية» أي انتظرنا طويلًا.", "ru": "«בלי סוף» означает очень большое количество или долгую длительность. Например, «חיכינו בלי סוף» значит, что мы долго ждали.", "en": "\"בלי סוף\" means a very large amount or a long duration. \"חיכינו בלי סוף\" means we waited a long time."},null,[{"he": "הביטוי מתייחס לכמות, ולא לשאלה אם ניתנו תשובות.", "ar": "تتعلق العبارة بالكمية، لا بوجود إجابات.", "ru": "Выражение относится к количеству, не к наличию ответов.", "en": "The expression concerns quantity, not whether there were answers."}, {"he": "הביטוי אינו מתאר סדר דיבור.", "ar": "العبارة لا تصف ترتيب الكلام.", "ru": "Выражение не описывает порядок выступлений.", "en": "The expression does not describe turn-taking."}, null, {"he": "הביטוי מדגיש ריבוי או משך, לא רק התחלה.", "ar": "تؤكد العبارة الكثرة أو المدّة، لا البداية فقط.", "ru": "Выражение подчёркивает количество или длительность, не только начало.", "en": "The expression stresses amount or duration, not just the beginning."}]),
Q("lx-1-01",{"he": "מה ההפך של \"עשיר\"?", "ar": "ما عكس «עשיר»؟", "ru": "Какое слово противоположно по смыслу слову «עשיר»?", "en": "What is the opposite of \"עשיר\"?"},[{"he": "עני", "ar": "עני", "ru": "עני", "en": "עני"}, {"he": "חכם", "ar": "חכם", "ru": "חכם", "en": "חכם"}, {"he": "שמח", "ar": "שמח", "ru": "שמח", "en": "שמח"}, {"he": "בעל רכוש רב", "ar": "בעל רכוש רב", "ru": "בעל רכוש רב", "en": "בעל רכוש רב"}],0,{"he": "חשבו על כמות הכסף שיש לאדם.", "ar": "فكّروا في كمية المال التي يملكها الشخص.", "ru": "Подумайте о том, сколько денег у человека.", "en": "Think about how much money a person has."},{"he": "\"עשיר\" הוא מי שיש לו הרבה כסף. \"עני\" הוא מי שיש לו מעט מאוד. לכן הן מילים הפוכות. למשל: \"משפחה ענייה\".", "ar": "«עשיר» تعني غنيّ، و«עני» تعني فقير. لذلك هما كلمتان متضادّتان. مثلًا: «משפחה ענייה» (عائلة فقيرة).", "ru": "«עשיר» значит «богатый», а «עני» - «бедный». Поэтому это антонимы. Например: «משפחה ענייה» (бедная семья).", "en": "\"עשיר\" means rich and \"עני\" means poor. So they are opposites. For example: \"משפחה ענייה\" (a poor family)."},null,[null, {"he": "\"חכם\" פירושו בעל שכל, ולא ההפך של \"עשיר\".", "ar": "«חכם» معناها حكيم، وليست عكس «עשיר».", "ru": "«חכם» значит «умный», это не противоположность «עשיר».", "en": "\"חכם\" means wise; it is not the opposite of \"עשיר\"."}, {"he": "\"שמח\" מתאר רגש, ולא כמות של כסף.", "ar": "«שמח» تصف شعورًا، لا كمية المال.", "ru": "«שמח» описывает чувство, а не количество денег.", "en": "\"שמח\" describes a feeling, not an amount of money."}, {"he": "\"בעל רכוש רב\" פירושו כמעט כמו \"עשיר\". זה ביטוי נרדף, לא הפך.", "ar": "«בעל רכוש רב» معناها تقريبًا مثل «עשיר»، فهي مرادفة لا عكس.", "ru": "«בעל רכוש רב» значит почти то же, что «עשיר»: это синоним.", "en": "\"בעל רכוש רב\" means almost the same as \"עשיר\"; it is a synonym."}]),
Q("lx-1-02",{"he": "איזו מילה נרדפת ל\"יפה\"?", "ar": "أي كلمة مرادفة لـ«יפה»؟", "ru": "Какое слово - синоним слова «יפה»?", "en": "Which word is a synonym of \"יפה\"?"},[{"he": "נאמן", "ar": "נאמן", "ru": "נאמן", "en": "נאמן"}, {"he": "נקי", "ar": "נקי", "ru": "נקי", "en": "נקי"}, {"he": "נאה", "ar": "נאה", "ru": "נאה", "en": "נאה"}, {"he": "נמוך קומה", "ar": "נמוך קומה", "ru": "נמוך קומה", "en": "נמוך קומה"}],2,{"he": "חפשו מילה שמתארת מראה טוב.", "ar": "ابحثوا عن كلمة تصف منظرًا حسنًا.", "ru": "Ищите слово, которое описывает приятную внешность.", "en": "Look for a word that describes a pleasant look."},{"he": "\"נאה\" פירושה יפה. משתמשים בה בעיקר בלשון כתובה או רשמית. למשל: \"הוא לבש חליפה נאה\".", "ar": "«נאה» معناها جميل، وتُستعمل غالبًا في اللغة المكتوبة أو الرسمية. مثلًا: «הוא לבש חליפה נאה» (لبس بدلة أنيقة).", "ru": "«נאה» значит «красивый». Это слово чаще встречается в письменной или официальной речи. Например: «הוא לבש חליפה נאה» (он надел красивый костюм).", "en": "\"נאה\" means good-looking. It is used mostly in written or formal language. For example: \"הוא לבש חליפה נאה\" (he wore a fine suit)."},null,[{"he": "\"נאמן\" פירושו מי שאפשר לסמוך עליו. המילה רק נשמעת דומה.", "ar": "«נאמן» معناها مخلص، والكلمة تشبهها في اللفظ فقط.", "ru": "«נאמן» значит «верный»; слово только похоже по звучанию.", "en": "\"נאמן\" means loyal; it only sounds similar."}, {"he": "\"נקי\" פירושו בלי לכלוך, ולא יפה.", "ar": "«נקי» معناها نظيف، لا جميل.", "ru": "«נקי» значит «чистый», а не «красивый».", "en": "\"נקי\" means clean, not beautiful."}, null, {"he": "\"נמוך קומה\" מתאר גובה, ולא יופי.", "ar": "«נמוך קומה» تصف قِصر القامة، لا الجمال.", "ru": "«נמוך קומה» описывает рост, а не красоту.", "en": "\"נמוך קומה\" describes height, not beauty."}]),
Q("lx-1-03",{"he": "איזו מילה שייכת ללשון הדיבור, ולא ללשון הכתובה הרשמית?", "ar": "أي كلمة تنتمي إلى اللغة المحكيّة، لا إلى اللغة المكتوبة الرسمية؟", "ru": "Какое слово относится к разговорной речи, а не к официальной письменной?", "en": "Which word belongs to everyday speech, not to formal writing?"},[{"he": "בסדר גמור", "ar": "בסדר גמור", "ru": "בסדר גמור", "en": "בסדר גמור"}, {"he": "סבבה", "ar": "סבבה", "ru": "סבבה", "en": "סבבה"}, {"he": "מצוין", "ar": "מצוין", "ru": "מצוין", "en": "מצוין"}, {"he": "על הצד הטוב ביותר", "ar": "על הצד הטוב ביותר", "ru": "על הצד הטוב ביותר", "en": "על הצד הטוב ביותר"}],1,{"he": "חפשו מילה שאומרים לחברים, אבל לא כותבים במכתב רשמי.", "ar": "ابحثوا عن كلمة نقولها للأصدقاء، لكن لا نكتبها في رسالة رسمية.", "ru": "Ищите слово, которое говорят друзьям, но не пишут в официальном письме.", "en": "Look for a word you say to friends but would not write in a formal letter."},{"he": "\"סבבה\" היא מילת סלנג שפירושה \"בסדר\". אומרים אותה בשיחה עם חברים. במכתב רשמי כותבים \"בסדר\" או \"מצוין\".", "ar": "«סבבה» كلمة عامّية معناها «حسنًا، تمام». نقولها في الحديث مع الأصدقاء. وفي الرسالة الرسمية نكتب «בסדר» أو «מצוין».", "ru": "«סבבה» - сленговое слово, значит «ладно, отлично». Его говорят в разговоре с друзьями. В официальном письме пишут «בסדר» или «מצוין».", "en": "\"סבבה\" is slang for \"okay\". People say it when talking with friends. In a formal letter you write \"בסדר\" or \"מצוין\"."},null,[{"he": "\"בסדר גמור\" מתאים גם לדיבור וגם לכתיבה.", "ar": "«בסדר גמור» تناسب الكلام والكتابة معًا.", "ru": "«בסדר גמור» подходит и для речи, и для письма.", "en": "\"בסדר גמור\" fits both speech and writing."}, null, {"he": "\"מצוין\" היא מילה תקנית שמתאימה גם לכתיבה רשמית.", "ar": "«מצוין» كلمة فصيحة تناسب الكتابة الرسمية أيضًا.", "ru": "«מצוין» - литературное слово, оно подходит и для официального письма.", "en": "\"מצוין\" is a standard word that fits formal writing too."}, {"he": "\"על הצד הטוב ביותר\" הוא ביטוי גבוה ורשמי, ולא סלנג.", "ar": "«על הצד הטוב ביותר» تعبير راقٍ ورسمي، لا عامّي.", "ru": "«על הצד הטוב ביותר» - книжное, официальное выражение, а не сленг.", "en": "\"על הצד הטוב ביותר\" is a high, formal phrase, not slang."}]),
Q("lx-1-04",{"he": "איזו מילה היא מילה שאולה, שהגיעה לעברית משפה זרה?", "ar": "أي كلمة هي كلمة دخيلة جاءت إلى العبرية من لغة أجنبية؟", "ru": "Какое слово заимствовано в иврит из другого языка?", "en": "Which word is a loanword that came into Hebrew from a foreign language?"},[{"he": "ספר", "ar": "ספר", "ru": "ספר", "en": "ספר"}, {"he": "שמש", "ar": "שמש", "ru": "שמש", "en": "שמש"}, {"he": "התכתבויות", "ar": "התכתבויות", "ru": "התכתבויות", "en": "התכתבויות"}, {"he": "רדיו", "ar": "רדיו", "ru": "רדיו", "en": "רדיו"}],3,{"he": "חפשו מילה שנשמעת דומה בהרבה שפות בעולם.", "ar": "ابحثوا عن كلمة تُلفظ بشكل متشابه في لغات كثيرة.", "ru": "Ищите слово, которое звучит похоже во многих языках мира.", "en": "Look for a word that sounds similar in many languages."},{"he": "\"רדיו\" הגיעה לעברית משפה זרה, ואין לה שורש עברי. היא נשמעת דומה בהרבה שפות. גם \"טלפון\" ו\"אוטובוס\" הן מילים שאולות.", "ar": "«רדיו» جاءت إلى العبرية من لغة أجنبية، وليس لها جذر عبري. وهي تشبه «راديو» في العربية. و«טלפון» و«אוטובוס» أيضًا كلمتان دخيلتان.", "ru": "«רדיו» пришло в иврит из другого языка, у него нет ивритского корня. Оно звучит похоже во многих языках. «טלפון» и «אוטובוס» тоже заимствования.", "en": "\"רדיו\" came into Hebrew from another language and has no Hebrew root. It sounds similar in many languages. \"טלפון\" and \"אוטובוס\" are loanwords too."},null,[{"he": "\"ספר\" היא מילה עברית עתיקה.", "ar": "«ספר» كلمة عبرية قديمة.", "ru": "«ספר» - древнее ивритское слово.", "en": "\"ספר\" is an ancient Hebrew word."}, {"he": "\"שמש\" היא מילה עברית עתיקה. היא מופיעה כבר בתנ״ך.", "ar": "«שמש» كلمة عبرية قديمة، وهي ترد في التناخ.", "ru": "«שמש» - древнее ивритское слово, оно есть уже в Танахе.", "en": "\"שמש\" is an ancient Hebrew word; it already appears in the Bible."}, {"he": "\"התכתבויות\" בנויה מן השורש העברי כ־ת־ב.", "ar": "«התכתבויות» مبنيّة من الجذر العبري כ־ת־ב.", "ru": "«התכתבויות» образовано от ивритского корня כ־ת־ב.", "en": "\"התכתבויות\" is built from the Hebrew root כ־ת־ב."}, null]),
Q("lx-1-05",{"he": "\"הוא הגיע באיחור, כי האוטובוס התעכב.\" מה פירוש \"התעכב\"?", "ar": "«הוא הגיע באיחור, כי האוטובוס התעכב». ما معنى «התעכב»؟", "ru": "«הוא הגיע באיחור, כי האוטובוס התעכב». Что значит «התעכב»?", "en": "\"הוא הגיע באיחור, כי האוטובוס התעכב.\" What does \"התעכב\" mean?"},[{"he": "הגיע מאוחר מהצפוי", "ar": "وصل متأخرًا عن المتوقّع", "ru": "пришёл позже, чем ожидалось", "en": "arrived later than expected"}, {"he": "הגיע מוקדם", "ar": "وصل مبكرًا", "ru": "пришёл раньше", "en": "arrived early"}, {"he": "היה מלא", "ar": "كان ممتلئًا", "ru": "был переполнен", "en": "was full"}, {"he": "נסע מהר מהרגיל ועקף את כולם", "ar": "سار أسرع من المعتاد وتجاوز الجميع", "ru": "ехал быстрее обычного и всех обгонял", "en": "drove faster than usual and passed everyone"}],0,{"he": "חשבו מה גרם לו להגיע באיחור.", "ar": "فكّروا: ما الذي جعله يصل متأخرًا؟", "ru": "Подумайте, из-за чего он опоздал.", "en": "Think about what made him late."},{"he": "\"התעכב\" פירושו הגיע מאוחר יותר מהזמן הרגיל. המילה \"באיחור\" עוזרת להבין את זה. למשל: \"הטיסה התעכבה בשעה\".", "ar": "«התעכב» معناها تأخّر عن الموعد المعتاد. كلمة «באיחור» (متأخّرًا) تساعد على الفهم. مثلًا: «הטיסה התעכבה בשעה» (تأخّرت الرحلة ساعة).", "ru": "«התעכב» значит «задержался, пришёл позже обычного». Понять помогает слово «באיחור» (с опозданием). Например: «הטיסה התעכבה בשעה» (рейс задержался на час).", "en": "\"התעכב\" means was delayed, came later than usual. The word \"באיחור\" (late) helps. For example: \"הטיסה התעכבה בשעה\" (the flight was delayed by an hour)."},null,[null, {"he": "אם האוטובוס היה מגיע מוקדם, הנוסע לא היה מאחר.", "ar": "لو وصلت الحافلة مبكرًا لما تأخّر الراكب.", "ru": "Если бы автобус пришёл раньше, пассажир бы не опоздал.", "en": "If the bus had come early, he would not have been late."}, {"he": "המשפט מדבר על זמן, ולא על מספר הנוסעים.", "ar": "الجملة تتحدّث عن الوقت، لا عن عدد الركّاب.", "ru": "Предложение говорит о времени, а не о числе пассажиров.", "en": "The sentence is about time, not about the number of passengers."}, {"he": "נסיעה מהירה לא הייתה גורמת לאיחור.", "ar": "السير السريع لا يسبّب التأخير.", "ru": "Быстрая езда не привела бы к опозданию.", "en": "Driving fast would not make anyone late."}]),
Q("lx-1-06",{"he": "מה פירוש הביטוי \"לשבור את הראש\"?", "ar": "ما معنى التعبير «לשבור את הראש»؟", "ru": "Что значит выражение «לשבור את הראש»?", "en": "What does the expression \"לשבור את הראש\" mean?"},[{"he": "להיפצע בראש בזמן משחק בחצר", "ar": "أن يُصاب في رأسه أثناء اللعب في الساحة", "ru": "пораниться в голову во время игры во дворе", "en": "to get hurt on the head while playing outside"}, {"he": "לכעוס מאוד", "ar": "أن يغضب كثيرًا", "ru": "сильно рассердиться", "en": "to get very angry"}, {"he": "לחשוב קשה על בעיה", "ar": "أن يفكّر بجهد في مشكلة", "ru": "напряжённо думать над задачей", "en": "to think hard about a problem"}, {"he": "לצחוק", "ar": "أن يضحك", "ru": "смеяться", "en": "to laugh"}],2,{"he": "ביטוי קבוע אינו מתכוון למילים כפשוטן.", "ar": "التعبير الثابت لا يقصد الكلمات بمعناها الحرفي.", "ru": "Устойчивое выражение не понимают буквально.", "en": "A fixed expression does not mean its words literally."},{"he": "\"לשבור את הראש\" פירושו לחשוב הרבה כדי למצוא פתרון. אין בו שבירה אמיתית. למשל: \"שברתי את הראש על החידה\".", "ar": "«לשבור את הראש» معناه أن تفكّر كثيرًا لتجد حلًّا، وليس فيه كسر حقيقي. مثلًا: «שברתי את הראש על החידה» (أتعبت رأسي في حلّ اللغز).", "ru": "«לשבור את הראש» значит долго думать, чтобы найти решение, как русское «ломать голову». Ничего на самом деле не ломают. Например: «שברתי את הראש על החידה» (я ломал голову над загадкой).", "en": "\"לשבור את הראש\" means to think a lot to find a solution. Nothing is really broken. For example: \"שברתי את הראש על החידה\" (I racked my brain over the riddle)."},null,[{"he": "זו המשמעות המילולית. בביטוי אין פציעה אמיתית.", "ar": "هذا هو المعنى الحرفي، وليس في التعبير إصابة حقيقية.", "ru": "Это буквальное значение; в выражении нет настоящей травмы.", "en": "That is the literal meaning; the expression involves no real injury."}, {"he": "הביטוי אינו מתאר כעס, אלא מאמץ של מחשבה.", "ar": "التعبير لا يصف الغضب، بل جهد التفكير.", "ru": "Выражение описывает не гнев, а умственное усилие.", "en": "The expression describes mental effort, not anger."}, null, {"he": "הביטוי אינו קשור לצחוק.", "ar": "التعبير لا علاقة له بالضحك.", "ru": "Выражение не связано со смехом.", "en": "The expression has nothing to do with laughing."}]),
],

Q("ha-lexicon-2-1",{"he": "במילון חד-לשוני עברי, באיזה ערך תחפשו את המילה \"מחברות\" במשפט \"קניתי מחברות חדשות\"?", "ar": "في قاموس عبري أحادي اللغة، تحت أي مدخل تبحثون عن «מחברות» في جملة «اشتريت دفاتر جديدة»؟", "ru": "По какой статье искать «מחברות» из предложения «Я купил(а) новые тетради» в одноязычном словаре иврита?", "en": "Under which entry should you look up \"מחברות\" from \"I bought new notebooks\" in a monolingual Hebrew dictionary?"},[{"he": "מחברות", "ar": "دفاتر (جمع)", "ru": "тетради (мн. ч.)", "en": "notebooks (plural)"}, {"he": "מחברת", "ar": "دفتر", "ru": "тетрадь", "en": "notebook"}, {"he": "חבר", "ar": "صديق", "ru": "друг", "en": "friend"}, {"he": "כתיבה", "ar": "كتابة", "ru": "письмо", "en": "writing"}],1,{"he": "נסו להחזיר את שם העצם לצורת היחיד שלו.", "ar": "أعيدوا الاسم إلى صيغة المفرد.", "ru": "Верните существительное в единственное число.", "en": "Return the noun to its singular form."},{"he": "\"מחברות\" היא צורת הרבים של \"מחברת\", ולכן מחפשים את ערך היחיד. למשל: \"תמונות\" מחפשים תחת \"תמונה\".", "ar": "«מחברות» جمع «מחברת»، لذا نبحث عن المدخل المفرد. ومثلًا «תמונות» تحت «תמונה».", "ru": "«מחברות» - множественное число от «מחברת», поэтому ищут статью в единственном числе. Например, «תמונות» ищут по «תמונה».", "en": "\"מחברות\" is the plural of \"מחברת\", so look for the singular entry. Likewise, look up \"תמונות\" under \"תמונה\"."},null,[{"he": "רבים הוא הצורה שנתקלה בקריאה, אך ערך היסוד הוא יחיד.", "ar": "الجمع هو الصيغة في النص، لكن مدخل الأساس مفرد.", "ru": "Множественное число встречается в тексте, но основная словарная форма - единственное.", "en": "The plural is the encountered form; the headword is singular."}, null, {"he": "זו מילה אחרת, גם אם יש אותיות דומות.", "ar": "هذه كلمة أخرى رغم تشابه بعض الحروف.", "ru": "Это другое слово, хотя буквы похожи.", "en": "That is another word despite similar letters."}, {"he": "זו מילה כללית הקשורה לפעולה, לא ערך השם המבוקש.", "ar": "هذه كلمة مرتبطة بالكتابة، لا المدخل المطلوب.", "ru": "Это связанное по теме слово, не нужная словарная статья.", "en": "That is a related activity, not the target noun entry."}]),
Q("ha-lexicon-2-2",{"he": "איזו מילה נרדפת ל\"מהירה\" במשפט \"ניתנה תגובה מהירה לבקשה\"?", "ar": "ما مرادف «מהירה» في جملة «قُدّم رد سريع على الطلب»؟", "ru": "Какой синоним у «מהירה» в «На просьбу быстро ответили»?", "en": "Which word is a synonym of \"מהירה\" in \"A quick response was given to the request\"?"},[{"he": "זריזה", "ar": "سريعة", "ru": "быстрая", "en": "swift"}, {"he": "מדויקת", "ar": "دقيقة", "ru": "точная", "en": "precise"}, {"he": "יקרה", "ar": "غالية", "ru": "дорогая", "en": "expensive"}, {"he": "פשוטה", "ar": "بسيطة", "ru": "простая", "en": "simple"}],0,{"he": "התמקדו במשך הזמן שחלף עד לתגובה.", "ar": "ركّزوا على المدة التي انقضت قبل الرد.", "ru": "Сосредоточьтесь на времени до ответа.", "en": "Focus on how long it took to respond."},{"he": "\"זריזה\" קרובה במשמעותה ל\"מהירה\" בהקשר של תגובה. למשל: \"הצוות השיב תשובה זריזה\".", "ar": "«זריזה» قريبة من «מהירה» في وصف الرد. مثلًا: «قدّم الفريق إجابة سريعة».", "ru": "«זריזה» близко к «מהירה», когда речь об ответе. Например: «Команда быстро ответила».", "en": "\"זריזה\" is close to \"מהירה\" for a response. For example: \"The team gave a swift reply.\""},null,[null, {"he": "דיוק נוגע לנכונות, לא למשך הזמן.", "ar": "الدقة تتعلّق بصحّة الحل لا بسرعته.", "ru": "Точность касается правильности, не времени.", "en": "Precision concerns correctness, not speed."}, {"he": "מחיר נוגע לעלות, לא למהירות.", "ar": "السعر يتعلق بالكلفة لا بالسرعة.", "ru": "Цена касается стоимости, не скорости.", "en": "Price concerns cost, not speed."}, {"he": "פשטות נוגעת למורכבות, לא בהכרח לזמן.", "ar": "البساطة تتعلّق بالتعقيد، لا بالوقت بالضرورة.", "ru": "Простота касается сложности, не обязательно времени.", "en": "Simplicity concerns complexity, not necessarily time."}]),
Q("ha-lexicon-2-3",{"he": "מה פירוש \"לקחת בחשבון\" במשפט \"צריך לקחת בחשבון את מזג האוויר\"?", "ar": "ماذا تعني «לקחת בחשבון» في جملة «يجب أخذ الطقس في الحسبان»؟", "ru": "Что означает «לקחת בחשבון» в «Нужно учесть погоду»?", "en": "What does \"לקחת בחשבון\" mean in \"We should take the weather into account\"?"},[{"he": "לשכוח", "ar": "أن ننسى", "ru": "забыть", "en": "forget"}, {"he": "למדוד במספרים", "ar": "أن نقيس بالأرقام", "ru": "измерить числами", "en": "measure in numbers"}, {"he": "להביא בחשבון", "ar": "أن نأخذ بالحسبان", "ru": "учесть", "en": "consider"}, {"he": "לדחות לאחר כך", "ar": "أن نؤجّل", "ru": "отложить", "en": "postpone"}],2,{"he": "חשבו כיצד המידע על מזג האוויר משפיע על התכנון.", "ar": "فكّروا كيف تؤثر معلومات الطقس في التخطيط.", "ru": "Подумайте, как сведения о погоде влияют на план.", "en": "Think about how weather information affects the plan."},{"he": "\"לקחת בחשבון\" פירושו להתחשב בגורם בעת החלטה. למשל: \"לקחנו בחשבון את זמן הנסיעה\".", "ar": "«לקחת בחשבון» تعني مراعاة عامل عند اتخاذ قرار. مثلًا: «أخذنا وقت السفر في الحسبان».", "ru": "«לקחת בחשבון» значит учитывать обстоятельство при решении. Например: «Мы учли время поездки».", "en": "\"לקחת בחשבון\" means to consider a factor in a decision. For example: \"We took travel time into account.\""},null,[{"he": "שכחה משמעה שלא משתמשים במידע הדרוש לתכנון.", "ar": "النسيان يعني عدم استخدام المعلومات اللازمة للتخطيط.", "ru": "Забыть значит не использовать информацию для планирования.", "en": "Forgetting means not using the information needed for planning."}, {"he": "הביטוי אינו מחייב חישוב מספרי.", "ar": "لا تشترط العبارة حسابًا عدديًا.", "ru": "Выражение не требует числового подсчёта.", "en": "The phrase does not require a numerical calculation."}, null, {"he": "דחייה אינה משמעות הביטוי במשפט הזה.", "ar": "التأجيل ليس معنى العبارة في هذه الجملة.", "ru": "Откладывание не является значением выражения здесь.", "en": "Postponement is not the meaning of the phrase here."}]),
Q("lx-2-01",{"he": "מה פירוש \"שעון\" במשפט \"הילד עמד שעון על הקיר\"?", "ar": "ما معنى «שעון» في جملة «הילד עמד שעון על הקיר»؟", "ru": "Что значит «שעון» в предложении «הילד עמד שעון על הקיר»?", "en": "What does \"שעון\" mean in \"הילד עמד שעון על הקיר\"?"},[{"he": "מכשיר שמראה את השעה", "ar": "ساعة، أي جهاز يبيّن الوقت", "ru": "прибор, который показывает время", "en": "a device that shows the time"}, {"he": "נשען עליו", "ar": "مستندًا إليه", "ru": "прислонившись к ней", "en": "leaning against it"}, {"he": "תלוי כמו תמונה", "ar": "معلّق مثل صورة", "ru": "висел, как картина", "en": "hanging like a picture"}, {"he": "צבוע בלבן", "ar": "مدهون بالأبيض", "ru": "покрашен в белый", "en": "painted white"}],1,{"he": "שימו לב לפועל \"עמד\" ולמילים \"על הקיר\".", "ar": "انتبهوا إلى الفعل «עמד» وإلى الكلمتين «על הקיר».", "ru": "Обратите внимание на глагол «עמד» и слова «על הקיר».", "en": "Notice the verb \"עמד\" and the words \"על הקיר\"."},{"he": "למילה \"שעון\" יש שתי משמעויות: מכשיר שמראה את השעה, וגם נשען על משהו. כאן הילד עמד ונשען על הקיר. המילים \"עמד\" ו\"על הקיר\" מכריעות.", "ar": "لكلمة «שעון» معنيان: ساعة تبيّن الوقت، ومستند إلى شيء. هنا وقف الولد مستندًا إلى الحائط. الكلمتان «עמד» و«על הקיר» تحسمان المعنى.", "ru": "У слова «שעון» два значения: часы и «прислонившийся к чему-то». Здесь мальчик стоял, прислонившись к стене. Это решают слова «עמד» и «על הקיר».", "en": "\"שעון\" has two meanings: a clock, and leaning on something. Here the boy stood leaning on the wall. The words \"עמד\" and \"על הקיר\" decide it."},null,[{"he": "זו משמעות אחרת של \"שעון\". כאן המילה מתארת איך הילד עמד.", "ar": "هذا معنى آخر لـ«שעון». هنا تصف الكلمة كيف وقف الولد.", "ru": "Это другое значение «שעון». Здесь слово описывает, как стоял мальчик.", "en": "That is another meaning of \"שעון\". Here it describes how the boy stood."}, null, {"he": "ילד אינו תלוי על הקיר. הוא נשען עליו.", "ar": "الولد ليس معلّقًا على الحائط، بل يستند إليه.", "ru": "Мальчик не висит на стене, а опирается на неё.", "en": "The boy is not hanging on the wall; he is resting against it."}, {"he": "אין במשפט שום רמז לצבע.", "ar": "لا توجد في الجملة أي إشارة إلى لون.", "ru": "В предложении нет никакого намёка на цвет.", "en": "Nothing in the sentence hints at a color."}]),
Q("lx-2-02",{"he": "איזה משפט כתוב בלשון רשמית?", "ar": "أي جملة مكتوبة بلغة رسمية؟", "ru": "Какое предложение написано официальным языком?", "en": "Which sentence is written in formal language?"},[{"he": "תגישו את הטפסים עד חמישי, סבבה?", "ar": "תגישו את הטפסים עד חמישי, סבבה?", "ru": "תגישו את הטפסים עד חמישי, סבבה?", "en": "תגישו את הטפסים עד חמישי, סבבה?"}, {"he": "יאללה, תביאו כבר את הטפסים.", "ar": "יאללה, תביאו כבר את הטפסים.", "ru": "יאללה, תביאו כבר את הטפסים.", "en": "יאללה, תביאו כבר את הטפסים."}, {"he": "תביאו לי את הניירות האלה עד חמישי בבקשה, טוב?", "ar": "תביאו לי את הניירות האלה עד חמישי בבקשה, טוב?", "ru": "תביאו לי את הניירות האלה עד חמישי בבקשה, טוב?", "en": "תביאו לי את הניירות האלה עד חמישי בבקשה, טוב?"}, {"he": "נבקשכם להגיש את הטפסים עד יום חמישי.", "ar": "נבקשכם להגיש את הטפסים עד יום חמישי.", "ru": "נבקשכם להגיש את הטפסים עד יום חמישי.", "en": "נבקשכם להגיש את הטפסים עד יום חמישי."}],3,{"he": "חפשו משפט שמתאים למכתב של מוסד, ולא להודעה לחבר.", "ar": "ابحثوا عن جملة تناسب رسالة من مؤسسة، لا رسالة إلى صديق.", "ru": "Ищите фразу для письма от учреждения, а не для сообщения другу.", "en": "Look for a sentence that fits a letter from an institution, not a text to a friend."},{"he": "\"נבקשכם\" היא צורה גבוהה של \"אנחנו מבקשים מכם\". אין במשפט מילות סלנג. לכן הוא מתאים למכתב רשמי.", "ar": "«נבקשכם» صيغة راقية لـ«نحن نطلب منكم». لا توجد في الجملة كلمات عامّية، لذلك تناسب رسالة رسمية.", "ru": "«נבקשכם» - книжная форма фразы «мы просим вас». В предложении нет сленга, поэтому оно подходит для официального письма.", "en": "\"נבקשכם\" is a high form of \"we ask you\". There is no slang in the sentence. So it fits a formal letter."},null,[{"he": "\"סבבה\" היא מילת סלנג, ולכן המשפט שייך ללשון הדיבור.", "ar": "«סבבה» كلمة عامّية، لذلك تنتمي الجملة إلى اللغة المحكيّة.", "ru": "«סבבה» - сленг, поэтому предложение относится к разговорной речи.", "en": "\"סבבה\" is slang, so the sentence belongs to spoken language."}, {"he": "\"יאללה\" ו\"כבר\" שייכות לשיחה יומיומית, ולא לכתיבה רשמית.", "ar": "«יאללה» و«כבר» من الحديث اليومي، لا من الكتابة الرسمية.", "ru": "«יאללה» и «כבר» - из повседневной речи, а не из официального письма.", "en": "\"יאללה\" and \"כבר\" belong to daily talk, not formal writing."}, {"he": "\"טוב?\" בסוף המשפט היא דרך דיבור, ולא כתיבה רשמית.", "ar": "«טוב?» في آخر الجملة أسلوب كلام، لا كتابة رسمية.", "ru": "«טוב?» в конце фразы - разговорный оборот, а не официальный стиль.", "en": "\"טוב?\" at the end is a spoken habit, not formal writing."}, null]),
Q("lx-2-03",{"he": "\"הרופא בדק את החולה ביסודיות.\" מה פירוש \"ביסודיות\"?", "ar": "«הרופא בדק את החולה ביסודיות». ما معنى «ביסודיות»؟", "ru": "«הרופא בדק את החולה ביסודיות». Что значит «ביסודיות»?", "en": "\"הרופא בדק את החולה ביסודיות.\" What does \"ביסודיות\" mean?"},[{"he": "בקפידה, בלי לדלג על דבר", "ar": "بدقّة، دون إغفال أي شيء", "ru": "тщательно, ничего не пропуская", "en": "carefully, without skipping anything"}, {"he": "במהירות רבה", "ar": "بسرعة كبيرة", "ru": "очень быстро", "en": "very quickly"}, {"he": "רק את החלקים הבסיסיים ביותר בגוף", "ar": "فقط الأجزاء الأساسية جدًا في الجسم", "ru": "только самые основные части тела человека", "en": "only the most basic parts of the human body"}, {"he": "בקלות ובשמחה", "ar": "بسهولة وفرح", "ru": "легко и с радостью", "en": "easily and happily"}],0,{"he": "חשבו איך רופא טוב בודק חולה.", "ar": "فكّروا كيف يفحص الطبيب الجيّد المريض.", "ru": "Подумайте, как хороший врач осматривает больного.", "en": "Think about how a good doctor examines a patient."},{"he": "\"ביסודיות\" פירושו בצורה מלאה ומדויקת, בלי לדלג על שום דבר. למשל: \"קראתי את החוזה ביסודיות\".", "ar": "«ביסודיות» معناها بشكل كامل ودقيق، دون إغفال أي شيء. مثلًا: «קראתי את החוזה ביסודיות» (قرأت العقد بدقّة).", "ru": "«ביסודיות» значит полно и точно, ничего не пропуская. Например: «קראתי את החוזה ביסודיות» (я тщательно прочитал договор).", "en": "\"ביסודיות\" means fully and precisely, skipping nothing. For example: \"קראתי את החוזה ביסודיות\" (I read the contract thoroughly)."},null,[null, {"he": "\"ביסודיות\" מתארת דיוק, ולא מהירות.", "ar": "«ביסודיות» تصف الدقّة، لا السرعة.", "ru": "«ביסודיות» описывает тщательность, а не скорость.", "en": "\"ביסודיות\" describes thoroughness, not speed."}, {"he": "המילה קשורה ל\"יסוד\", אבל פירושה בדיקה מלאה, ולא בדיקה של חלקים בסיסיים.", "ar": "الكلمة مرتبطة بـ«יסוד» (أساس)، لكن معناها فحص كامل، لا فحص الأجزاء الأساسية.", "ru": "Слово связано с «יסוד» (основа), но значит полную проверку, а не осмотр основных частей.", "en": "The word is related to \"יסוד\" (basis), but it means a full check, not checking basic parts."}, {"he": "\"ביסודיות\" אינה מתארת רגש או קלות.", "ar": "«ביסודיות» لا تصف شعورًا أو سهولة.", "ru": "«ביסודיות» не описывает ни чувства, ни лёгкость.", "en": "\"ביסודיות\" describes neither a feeling nor ease."}]),
Q("lx-2-04",{"he": "\"בחורף המים במעיין צלולים.\" מהו ההפך של \"צלולים\" במשפט הזה?", "ar": "«בחורף המים במעיין צלולים». ما عكس «צלולים» في هذه الجملة؟", "ru": "«בחורף המים במעיין צלולים». Какое слово противоположно «צלולים» в этом предложении?", "en": "\"בחורף המים במעיין צלולים.\" What is the opposite of \"צלולים\" in this sentence?"},[{"he": "קרים", "ar": "קרים", "ru": "קרים", "en": "קרים"}, {"he": "שקופים", "ar": "שקופים", "ru": "שקופים", "en": "שקופים"}, {"he": "עכורים", "ar": "עכורים", "ru": "עכורים", "en": "עכורים"}, {"he": "חמים ונעימים", "ar": "חמים ונעימים", "ru": "חמים ונעימים", "en": "חמים ונעימים"}],2,{"he": "חשבו מה רואים כשמסתכלים לתוך המים.", "ar": "فكّروا: ماذا نرى عندما ننظر داخل الماء؟", "ru": "Подумайте, что видно, когда смотришь в воду.", "en": "Think about what you see when you look into the water."},{"he": "מים \"צלולים\" הם נקיים ושקופים. מים \"עכורים\" הם מלוכלכים, ואי אפשר לראות דרכם. לכן אלה מילים הפוכות.", "ar": "الماء «צלולים» صافٍ وشفّاف. والماء «עכורים» عَكِر، ولا يمكن الرؤية من خلاله. لذلك هما كلمتان متضادّتان.", "ru": "Вода «צלולים» - чистая и прозрачная. Вода «עכורים» - мутная, сквозь неё ничего не видно. Поэтому это антонимы.", "en": "\"צלולים\" water is clean and clear. \"עכורים\" water is murky, and you cannot see through it. So they are opposites."},null,[{"he": "\"קרים\" מתאר טמפרטורה, ולא כמה המים שקופים.", "ar": "«קרים» تصف درجة الحرارة، لا مدى صفاء الماء.", "ru": "«קרים» описывает температуру, а не прозрачность воды.", "en": "\"קרים\" describes temperature, not how clear the water is."}, {"he": "\"שקופים\" קרוב במשמעותו ל\"צלולים\". זו מילה נרדפת, ולא הפך.", "ar": "«שקופים» قريبة في معناها من «צלולים»، فهي مرادفة لا عكس.", "ru": "«שקופים» близко по смыслу к «צלולים»: это синоним, а не антоним.", "en": "\"שקופים\" is close in meaning to \"צלולים\"; it is a synonym, not an opposite."}, null, {"he": "\"חמים\" הוא ההפך של \"קרים\", ולא של \"צלולים\".", "ar": "«חמים» عكس «קרים»، لا عكس «צלולים».", "ru": "«חמים» - антоним к «קרים», а не к «צלולים».", "en": "\"חמים\" is the opposite of \"קרים\", not of \"צלולים\"."}]),
Q("lx-2-05",{"he": "האקדמיה ללשון העברית קבעה מילה עברית במקום המילה הלועזית \"מייל\". מהי?", "ar": "حدّد مجمع اللغة العبرية كلمة عبرية بدل الكلمة الأجنبية «מייל» (إيميل). ما هي؟", "ru": "Академия иврита предложила ивритское слово вместо иностранного «מייל» (имейл). Какое?", "en": "The Academy of the Hebrew Language set a Hebrew word instead of the foreign word \"מייל\" (email). Which one?"},[{"he": "מכתב", "ar": "מכתב", "ru": "מכתב", "en": "מכתב"}, {"he": "מברק", "ar": "מברק", "ru": "מברק", "en": "מברק"}, {"he": "הודעה קולית", "ar": "הודעה קולית", "ru": "הודעה קולית", "en": "הודעה קולית"}, {"he": "דוא״ל", "ar": "דוא״ל", "ru": "דוא״ל", "en": "דוא״ל"}],3,{"he": "המילה היא קיצור של שתי מילים.", "ar": "الكلمة اختصار لكلمتين.", "ru": "Это слово - сокращение из двух слов.", "en": "The word is a shortening of two words."},{"he": "\"דוא״ל\" הוא קיצור של \"דואר אלקטרוני\". האקדמיה קבעה אותו במקום המילה הלועזית. בדיבור רוב האנשים עדיין אומרים \"מייל\".", "ar": "«דוא״ל» اختصار لـ«דואר אלקטרוני» (بريد إلكتروني). حدّده المجمع بدل الكلمة الأجنبية. وفي الكلام اليومي ما زال معظم الناس يقولون «מייל».", "ru": "«דוא״ל» - сокращение от «דואר אלקטרוני» (электронная почта). Академия ввела его вместо иностранного слова. В речи большинство людей всё ещё говорят «מייל».", "en": "\"דוא״ל\" is short for \"דואר אלקטרוני\" (electronic mail). The Academy set it instead of the foreign word. In speech most people still say \"מייל\"."},null,[{"he": "\"מכתב\" הוא כל מסר כתוב, גם על נייר. זו אינה המילה שנקבעה ל\"מייל\".", "ar": "«מכתב» أي رسالة مكتوبة، حتى على الورق، وليست الكلمة المحدّدة لـ«מייל».", "ru": "«מכתב» - любое письмо, даже бумажное; это не слово для «מייל».", "en": "\"מכתב\" is any written letter, even on paper; it is not the word set for \"מייל\"."}, {"he": "\"מברק\" הוא הודעה ישנה שנשלחה בטלגרף.", "ar": "«מברק» برقية قديمة كانت تُرسل بالتلغراف.", "ru": "«מברק» - старое сообщение, которое посылали по телеграфу.", "en": "\"מברק\" is an old message sent by telegraph."}, {"he": "\"הודעה קולית\" היא הקלטה של קול, ולא מכתב במחשב.", "ar": "«הודעה קולית» تسجيل صوتي، لا رسالة في الحاسوب.", "ru": "«הודעה קולית» - голосовая запись, а не письмо в компьютере.", "en": "\"הודעה קולית\" is a voice recording, not a computer letter."}, null]),
Q("lx-2-06",{"he": "\"כשאבא שלי חלה, השכנים נתנו כתף.\" מה פירוש \"נתנו כתף\"?", "ar": "«כשאבא שלי חלה, השכנים נתנו כתף». ما معنى «נתנו כתף»؟", "ru": "«כשאבא שלי חלה, השכנים נתנו כתף». Что значит «נתנו כתף»?", "en": "\"כשאבא שלי חלה, השכנים נתנו כתף.\" What does \"נתנו כתף\" mean?"},[{"he": "העבירו משא כבד ממקום למקום", "ar": "نقلوا حملًا ثقيلًا من مكان إلى آخر", "ru": "перенесли тяжёлый груз с места на место", "en": "carried a heavy load from place to place"}, {"he": "עזרו ותמכו", "ar": "ساعدوا ودعموا", "ru": "помогли и поддержали", "en": "helped and supported"}, {"he": "התעלמו", "ar": "تجاهلوا", "ru": "не обратили внимания", "en": "ignored"}, {"he": "כעסו", "ar": "غضبوا", "ru": "рассердились", "en": "got angry"}],1,{"he": "חשבו מה שכנים טובים עושים כשמישהו חולה.", "ar": "فكّروا: ماذا يفعل الجيران الطيّبون عندما يمرض أحد؟", "ru": "Подумайте, что делают хорошие соседи, когда кто-то болеет.", "en": "Think about what good neighbors do when someone is sick."},{"he": "\"לתת כתף\" פירושו לעזור למישהו בזמן קשה. אין כאן כתף אמיתית. למשל: \"כל הכיתה נתנה כתף בהכנת המסיבה\".", "ar": "«לתת כתף» معناه أن تساعد شخصًا في وقت صعب، وليس المقصود كتفًا حقيقيًا. مثلًا: «כל הכיתה נתנה כתף בהכנת המסיבה» (ساعد الصف كله في تحضير الحفلة).", "ru": "«לתת כתף» значит помочь кому-то в трудное время, как русское «подставить плечо». Например: «כל הכיתה נתנה כתף בהכנת המסיבה» (весь класс помог готовить праздник).", "en": "\"לתת כתף\" means to help someone in a hard time. It is not a real shoulder. For example: \"כל הכיתה נתנה כתף בהכנת המסיבה\" (the whole class pitched in to prepare the party)."},null,[{"he": "זו המשמעות המילולית. בביטוי אין משא אמיתי.", "ar": "هذا هو المعنى الحرفي، وليس في التعبير حمل حقيقي.", "ru": "Это буквальное значение; настоящего груза в выражении нет.", "en": "That is the literal meaning; there is no real load in the expression."}, null, {"he": "התעלמות היא ההפך ממה שהביטוי מתאר.", "ar": "التجاهل عكس ما يصفه التعبير.", "ru": "Игнорировать - противоположность тому, что описывает выражение.", "en": "Ignoring is the opposite of what the expression describes."}, {"he": "אין בביטוי שום סימן לכעס.", "ar": "لا توجد في التعبير أي علامة على الغضب.", "ru": "В выражении нет никакого намёка на гнев.", "en": "Nothing in the expression suggests anger."}]),
],
