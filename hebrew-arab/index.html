   Q("ha-derive-3-1",{"he": "מהו שורש המילה \"וּבְהִתְרַגְּשׁוּתָם\" (בהתרגשותם)?", "ar": "ما جذر كلمة «וּבְהִתְרַגְּשׁוּתָם» (في انفعالهم)؟", "ru": "Каков корень слова «וּבְהִתְרַגְּשׁוּתָם» (в их волнении)?", "en": "What is the root of the word \"וּבְהִתְרַגְּשׁוּתָם\" (in their excitement)?"},[{"he": "ה־ת־ר־ג־ש", "ar": "ה־ת־ר־ג־ש", "ru": "ה־ת־ר־ג־ש", "en": "ה־ת־ר־ג־ש"}, {"he": "ת־ר־ג", "ar": "ת־ר־ג", "ru": "ת־ר־ג", "en": "ת־ר־ג"}, {"he": "ב־ה־ר", "ar": "ב־ה־ר", "ru": "ב־ה־ר", "en": "ב־ה־ר"}, {"he": "ר־ג־ש", "ar": "ר־ג־ש", "ru": "ר־ג־ש", "en": "ר־ג־ש"}],3,{"he": "הורידו את ו בתחילת המילה, את ב, את ה ת של הבניין ואת ו ת ם בסוף.", "ar": "احذفوا و في البداية، و ب، و هـ ت الخاصة بالوزن، و و ת ם في النهاية.", "ru": "Уберите ו в начале, ב, ה и ת биньяна и ו ת ם в конце.", "en": "Remove the initial ו and ב, the ה and ת of the binyan, and the final ו ת ם."},{"he": "במילה ובהתרגשותם האותיות ו ו ב הן אותיות תחילית, ה ות שייכות לבניין התפעל, ו ות ם בסוף הן סיומת. נשארות ר ג ש, שורש הרגש והתרגשות. למשל גם במילה מרגש נמצא אותו שורש.", "ar": "في كلمة ובהתרגשותם الحروف و و ב زائدة في البداية، و ה ות تخص وزن התפעל، و ות ם في النهاية لاحقة. تبقى ר ג ש، جذر רגש وהתרגשות. مثلًا في كلمة מרגש نجد الجذر نفسه.", "ru": "В слове ובהתרגשותם буквы ו и ב - приставки, ה и ת принадлежат биньяну התפעל, а ו ת ם в конце - окончание. Остаются ר ג ש, корень слов רגש и התרגשות. Например, в слове מרגש тот же корень.", "en": "In ובהתרגשותם the letters ו and ב are prefixes, ה and ת belong to the התפעל binyan, and ו ת ם at the end are a suffix. What remains is ר ג ש, the root of רגש and התרגשות. For example, מרגש has the same root."},null,[{"he": "ה ת הן אותיות הבניין התפעל, לא אותיות שורש.", "ar": "هـ ت هما حرفا وزن התפעל، وليسا من الجذر.", "ru": "ה и ת - буквы биньяна התפעל, а не корня.", "en": "ה and ת are letters of the התפעל binyan, not root letters."}, {"he": "השורש אינו ת־ר־ג: הת שייכת לבניין התפעל, והאותיות שנשארות הן ר ג ש.", "ar": "الجذر ليس ت־ر־ج: فالتاء تخص وزن התפעל، والحروف المتبقية هي ر ג ש.", "ru": "Корень не ת־ר־ג: буква ת принадлежит биньяну התפעל, а остающиеся буквы - ר ג ש.", "en": "The root is not ת־ר־ג: the ת belongs to the התפעל binyan, and the remaining letters are ר ג ש."}, {"he": "ב ו ה הן אותיות תחילית, לא חלק מהשורש.", "ar": "ب و هـ حروف زائدة في البداية، وليست من الجذر.", "ru": "ב и ה - приставочные буквы, не часть корня.", "en": "ב and ה are prefix letters, not part of the root."}, null]),
   Q("ha-derive-3-2",{"he": "איזו מילה נוצרה באותה דרך שבה נוצרה המילה \"רמזור\" (הלחם בסיסים)?", "ar": "أي كلمة نشأت بنفس طريقة نشوء كلمة «רמזור» (دمج الأساسات)؟", "ru": "Какое слово образовано тем же способом, что и «רמזור» (слияние)?", "en": "Which word was formed the same way as \"רמזור\" (a blend)?"},[{"he": "מַדְרֵכָה", "ar": "מַדְרֵכָה", "ru": "מַדְרֵכָה", "en": "מַדְרֵכָה (sidewalk)"}, {"he": "מִגְדָּלוֹר", "ar": "מִגְדָּלוֹר", "ru": "מִגְדָּלוֹר", "en": "מִגְדָּלוֹר (lighthouse)"}, {"he": "חַלּוֹן", "ar": "חַלּוֹן", "ru": "חַלּוֹן", "en": "חַלּוֹן (window)"}, {"he": "סְפּוֹרְט", "ar": "סְפּוֹרְט", "ru": "סְפּוֹרְט", "en": "סְפּוֹרְט (sport)"}],1,{"he": "חפשו מילה שגם היא חיבור של שתי מילים: מבנה גבוה ומשהו זוהר.", "ar": "ابحثوا عن كلمة هي أيضًا دمج كلمتين: بناء عالٍ وشيء مضيء.", "ru": "Ищите слово, тоже соединяющее два слова: высокое строение и нечто светящееся.", "en": "Look for a word that also joins two words: a tall structure and something glowing."},{"he": "מגדלור הוא הלחם של מגדל ואור, בדיוק כמו שרמזור הוא הלחם של רמז ואור. מדרכה נגזרה מן השורש ד ר כ, חלון הוא שם עצם בסיסי, וספורט היא מילה שאולה.", "ar": "מגדלור هو دمج מגדל ואור، تمامًا كما أن רמזור هو دمج רמז ואור. أما מדרכה فاشتُقت من الجذر ד ר כ، وחלון اسم أصلي، וספורט كلمة دخيلة.", "ru": "מגדלור - слияние מגדל и אור, точно как רמזור - слияние רמז и אור. מדרכה образовано от корня ד ר כ, חלון - исходное существительное, а ספורט - заимствование.", "en": "מגדלור blends מגדל and אור, exactly as רמזור blends רמז and אור. מדרכה derives from the root ד ר כ, חלון is a basic noun, and ספורט is a loanword."},null,[{"he": "מדרכה נגזרה מן השורש ד ר כ בגזירה קווית, לא בהלחם.", "ar": "מדרכה اشتُقت من الجذر ד ר כ بالاشتقاق الخطي، لا بالدمج.", "ru": "מדרכה образовано от корня ד ר כ линейно, не слиянием.", "en": "מדרכה derives from the root ד ר כ linearly, not by blending."}, null, {"he": "חלון הוא שם עצם בסיסי בעברית, לא הלחם של שתי מילים.", "ar": "חלון اسم أصلي في العبرية، وليس دمج كلمتين.", "ru": "חלון - исходное существительное, не слияние двух слов.", "en": "חלון is a basic Hebrew noun, not a blend of two words."}, {"he": "ספורט היא מילה שאולה משפה זרה, לא הלחם.", "ar": "ספורט كلمة دخيلة من لغة أجنبية، وليست دمجًا.", "ru": "ספורט - заимствование из иностранного языка, не слияние.", "en": "ספורט is a loanword from a foreign language, not a blend."}]),
   Q("ha-derive-3-3",{"he": "מהו שורש המילה \"מִשְׁתָּלָה\" (מקום שמטפחים בו צמחים)?", "ar": "ما جذر كلمة «מִשְׁתָּלָה» (مكان تُرعى فيه النباتات)؟", "ru": "Каков корень слова «מִשְׁתָּלָה» (место, где выращивают растения)?", "en": "What is the root of \"מִשְׁתָּלָה\" (a place where plants are grown)?"},[{"he": "מ־ש־ת־ל", "ar": "מ־ש־ת־ל", "ru": "מ־ש־ת־ל", "en": "מ־ש־ת־ל"}, {"he": "ס־ת־ל", "ar": "ס־ת־ל", "ru": "ס־ת־ל", "en": "ס־ת־ל"}, {"he": "ש־ת־ל", "ar": "ש־ת־ל", "ru": "ש־ת־ל", "en": "ש־ת־ל"}, {"he": "ש־ט־ל", "ar": "ש־ט־ל", "ru": "ש־ט־ל", "en": "ש־ט־ל"}],2,{"he": "המילה קרובה לפועל שמתאר מה עושים בצמח צעיר כשמכניסים אותו לאדמה.", "ar": "الكلمة قريبة من الفعل الذي يصف ما يفعلونه بالنبتة الصغيرة في الأرض.", "ru": "Слово близко к глаголу, описывающему то, что делают с саженцем в земле.", "en": "The word is close to the verb describing what one does with a seedling in the soil."},{"he": "האות מ בתחילת המילה היא אות תחילית, והאות ה בסוף היא סיומת. נשארות ש ת ל, שורש השתילה: שותלים צמח באדמה. למשל גם המילה שתיל, צמח שניטע, היא מאותה משפחה.", "ar": "حرف מ في البداية زائد، وحرف ה في النهاية لاحقة. تبقى ש ת ל، جذر השתילה: שותלים نبتة في الأرض. مثلًا كلمة שתיל، نبتة تُغرس، من العائلة نفسها.", "ru": "Буква מ в начале - приставка, а ה в конце - окончание. Остаются ש ת ל, корень посадки: שותלים - сажают растение в землю. Например, слово שתיל, саженец, из той же семьи.", "en": "The letter מ at the start is a prefix and the final ה is a suffix. What remains is ש ת ל, the root of planting: שותלים means planting a plant in the soil. For example, שתיל, a seedling, is from the same family."},null,[{"he": "האות מ היא אות תחילית, לא חלק מהשורש.", "ar": "حرف מ زائد في البداية، وليس من الجذر.", "ru": "Буква מ - приставка, не часть корня.", "en": "The letter מ is a prefix, not part of the root."}, {"he": "האות הראשונה היא ש, לא ס.", "ar": "الحرف الأول هو ש وليس س.", "ru": "Первая буква - ש, а не ס.", "en": "The first letter is ש, not ס."}, null, {"he": "האות האמצעית היא ת, לא ט.", "ar": "الحرف الأوسط هو ת وليس ט.", "ru": "Средняя буква - ת, а не ט.", "en": "The middle letter is ת, not ט."}]),
   Q("dv-3-01",{"he": "בכל משפט יש פועל שפותח באות נ. באיזה משפט הפועל בבניין נִפְעַל?", "ar": "في كل جملة فعل يبدأ بحرف נ. في أي جملة الفعل في وزن נִפְעַל؟", "ru": "В каждом предложении есть глагол на букву נ. В каком предложении глагол в биньяне נִפְעַל?", "en": "Each sentence has a verb starting with נ. In which sentence is the verb in the nif'al binyan?"},[{"he": "הספר נִשְׁמַר בארון", "ar": "الكتاب נִשְׁמַר (حُفظ) في الخزانة", "ru": "Книга נִשְׁמַר («сохранилась») в шкафу", "en": "The book נִשְׁמַר (was kept) in the closet"}, {"he": "הילד נָפַל בחצר", "ar": "الولد נָפַל (وقع) في الساحة", "ru": "Мальчик נָפַל («упал») во дворе", "en": "The boy נָפַל (fell) in the yard"}, {"he": "דנה נִסְּתָה שוב ושוב לפתוח את הדלת", "ar": "دانا נִסְּתָה (حاولت) مرة بعد مرة أن تفتح الباب", "ru": "Дана נִסְּתָה («пыталась») снова и снова открыть дверь", "en": "Dana נִסְּתָה (tried) again and again to open the door"}, {"he": "הוא נִגֵּן בגיטרה", "ar": "هو נִגֵּן (عزف) على الغيتار", "ru": "Он נִגֵּן («играл») на гитаре", "en": "He נִגֵּן (played) the guitar"}],0,{"he": "אם הנ היא אות שורש, הפועל אינו בבניין הזה. חפשו פועל שבו הנ נוספה.", "ar": "إذا كانت الـנ من حروف الجذر، فالفعل ليس في هذا الوزن. ابحثوا عن فعل أُضيفت فيه الـנ.", "ru": "Если נ - буква корня, глагол не в этом биньяне. Найдите глагол, где נ добавлена.", "en": "If the נ is a root letter, the verb is not in this binyan. Find a verb where the נ was added."},{"he": "בנִשְׁמַר השורש הוא ש־מ־ר, והנ נוספה לפניו. זה סימן של בניין נפעל. בנָפַל, בנִסְּתָה ובנִגֵּן הנ היא אות שורש: נ־פ־ל, נ־ס־י, נ־ג־נ.", "ar": "في נִשְׁמַר الجذر هو ש־מ־ר، والـנ أُضيفت قبله. هذه علامة وزن נפעל. في נָפַל وנִסְּתָה وנִגֵּן الـנ من حروف الجذر: נ־פ־ל، נ־ס־י، נ־ג־נ.", "ru": "В נִשְׁמַר корень ש־מ־ר, а נ добавлена перед ним. Это признак биньяна נפעל. В נָפַל, נִסְּתָה и נִגֵּן буква נ - корневая: נ־פ־ל, נ־ס־י, נ־ג־נ.", "en": "In נִשְׁמַר the root is ש־מ־ר and the נ was added before it. That is the sign of nif'al. In נָפַל, נִסְּתָה and נִגֵּן the נ is a root letter: נ־פ־ל, נ־ס־י, נ־ג־נ."},null,[null, {"he": "בנָפַל הנ היא אות שורש: נ־פ־ל, והבניין הוא פעל.", "ar": "في נָפַל الـנ من الجذر: נ־פ־ל، والوزن هو פעל.", "ru": "В נָפַל נ - корневая: נ־פ־ל, а биньян - פעל.", "en": "In נָפַל the נ is a root letter: נ־פ־ל, and the binyan is pa'al."}, {"he": "בנִסְּתָה הנ היא אות שורש: נ־ס־י, והבניין הוא פיעל.", "ar": "في נִסְּתָה الـנ من الجذر: נ־ס־י، والوزن هو פיעל.", "ru": "В נִסְּתָה נ - корневая: נ־ס־י, а биньян - פיעל.", "en": "In נִסְּתָה the נ is a root letter: נ־ס־י, and the binyan is pi'el."}, {"he": "בנִגֵּן הנ היא אות שורש: נ־ג־נ, והבניין הוא פיעל.", "ar": "في נִגֵּן الـנ من الجذر: נ־ג־נ، والوزن هو פיעל.", "ru": "В נִגֵּן נ - корневая: נ־ג־נ, а биньян - פיעל.", "en": "In נִגֵּן the נ is a root letter: נ־ג־נ, and the binyan is pi'el."}]),
   Q("dv-3-02",{"he": "מהו השורש של המילה \"וּכְשֶׁהִתְכַּתַּבְנוּ\"?", "ar": "ما جذر كلمة «וּכְשֶׁהִתְכַּתַּבְנוּ» (وعندما تراسلنا)؟", "ru": "Какой корень у слова «וּכְשֶׁהִתְכַּתַּבְנוּ» («и когда мы переписывались»)?", "en": "What is the root of the word \"וּכְשֶׁהִתְכַּתַּבְנוּ\" (and when we corresponded)?"},[{"he": "כ־ש־ה", "ar": "כ־ש־ה", "ru": "כ־ש־ה", "en": "כ־ש־ה"}, {"he": "ת־כ־ת", "ar": "ת־כ־ת", "ru": "ת־כ־ת", "en": "ת־כ־ת"}, {"he": "כ־ת־ב", "ar": "כ־ת־ב", "ru": "כ־ת־ב", "en": "כ־ת־ב"}, {"he": "ה־ת־כ־ת־ב", "ar": "ה־ת־כ־ת־ב", "ru": "ה־ת־כ־ת־ב", "en": "ה־ת־כ־ת־ב"}],2,{"he": "הורידו את המילים הקטנות בהתחלה, את התוספת של הבניין ואת הסיומת.", "ar": "احذفوا الكلمات الصغيرة في البداية، وزيادة الوزن، واللاحقة.", "ru": "Уберите маленькие слова в начале, добавку биньяна и окончание.", "en": "Remove the small words at the start, the binyan prefix and the ending."},{"he": "ו, כְּ ו־שֶׁ הן מילים קטנות שהתחברו לפועל. הת היא תוספת של בניין התפעל, ו־נו בסוף מסמנת אנחנו. נשארות כ ת ב, כמו במכתב ובכתיבה.", "ar": "ו وכְּ وשֶׁ كلمات صغيرة التصقت بالفعل. הת زيادة وزن התפעל، وנו في الآخر تدل على نحن. تبقى כ ת ב، كما في מכתב وכתיבה.", "ru": "ו, כְּ и שֶׁ - маленькие слова, присоединённые к глаголу. הת - добавка биньяна התפעל, а נו в конце означает «мы». Остаются כ ת ב, как в מכתב и כתיבה.", "en": "ו, כְּ and שֶׁ are small words attached to the verb. הת is the hitpa'el prefix, and נו at the end means we. What remains is כ ת ב, as in מכתב and כתיבה."},null,[{"he": "כ ו־ש הן מילים קטנות שהתחברו לפועל, וה שייכת לבניין.", "ar": "כ وש كلمات صغيرة ملتصقة بالفعل، وה تابعة للوزن.", "ru": "כ и ש - маленькие присоединённые слова, а ה относится к биньяну.", "en": "כ and ש are attached small words, and ה belongs to the binyan."}, {"he": "ת הראשונה שייכת לבניין התפעל, וחסרה האות ב.", "ar": "الـת الأولى تابعة لوزن התפעל، وينقص حرف ב.", "ru": "Первая ת относится к биньяну התפעל, и не хватает буквы ב.", "en": "The first ת belongs to hitpa'el, and the letter ב is missing."}, null, {"he": "הת שייכת לבניין התפעל, ואינה חלק מהשורש.", "ar": "הת تابعة لوزن התפעל، وليست جزءًا من الجذر.", "ru": "הת относится к биньяну התפעל и не входит в корень.", "en": "הת belongs to the hitpa'el binyan and is not part of the root."}]),
   Q("dv-3-03",{"he": "מהו השורש של הפועל \"הִצְטַלֵּם\"?", "ar": "ما جذر الفعل «הִצְטַלֵּם» (تصوّر)؟", "ru": "Какой корень у глагола «הִצְטַלֵּם» («сфотографировался»)?", "en": "What is the root of the verb \"הִצְטַלֵּם\" (had a photo taken)?"},[{"he": "צ־ט־ל", "ar": "צ־ט־ל", "ru": "צ־ט־ל", "en": "צ־ט־ל"}, {"he": "ה־צ־ל", "ar": "ה־צ־ל", "ru": "ה־צ־ל", "en": "ה־צ־ל"}, {"he": "צ־ט־ל־מ: כל האותיות אחרי ה", "ar": "צ־ט־ל־מ: كل الحروف بعد ה", "ru": "צ־ט־ל־מ: все буквы после ה", "en": "צ־ט־ל־מ: all the letters after ה"}, {"he": "צ־ל־מ", "ar": "צ־ל־מ", "ru": "צ־ל־מ", "en": "צ־ל־מ"}],3,{"he": "בבניין התפעל, כשהשורש פותח באות צ, האות ת משנה את מקומה ואת צורתה.", "ar": "في وزن התפעל، عندما يبدأ الجذر بحرف צ، يغيّر حرف ת مكانه وشكله.", "ru": "В биньяне התפעל, когда корень начинается на צ, буква ת меняет место и форму.", "en": "In hitpa'el, when the root starts with צ, the letter ת changes its place and form."},{"he": "הפועל בבניין התפעל. כשהשורש פותח בצ, הת עוברת אחרי הצ והופכת לט: הִתְצַלֵּם הפך להִצְטַלֵּם. נשארות צ ל מ, כמו בצילום ובמצלמה.", "ar": "الفعل في وزن התפעל. عندما يبدأ الجذر بـ צ، تنتقل الـת إلى ما بعد الـצ وتتحوّل إلى ט: הִתְצַלֵּם صارت הִצְטַלֵּם. تبقى צ ל מ، كما في צילום وמצלמה.", "ru": "Глагол в биньяне התפעל. Когда корень начинается на צ, ת переходит за צ и становится ט: הִתְצַלֵּם превратилось в הִצְטַלֵּם. Остаются צ ל מ, как в צילום и מצלמה.", "en": "The verb is hitpa'el. When the root starts with צ, the ת moves after the צ and becomes ט: הִתְצַלֵּם became הִצְטַלֵּם. What remains is צ ל מ, as in צילום and מצלמה."},null,[{"he": "ט היא הת של הבניין ששינתה צורה, וחסרה כאן מ.", "ar": "ט هي ת الوزن بعد أن تغيّر شكلها، وينقص هنا מ.", "ru": "ט - это ת биньяна, изменившая форму, и не хватает מ.", "en": "ט is the binyan's ת in a new form, and מ is missing here."}, {"he": "ה היא תוספת של בניין התפעל, ולא אות שורש.", "ar": "ה زائدة من وزن התפעל، وليست من الجذر.", "ru": "ה - добавка биньяна התפעל, а не буква корня.", "en": "ה is added by the hitpa'el binyan; it is not a root letter."}, {"he": "ט היא הת של הבניין ששינתה צורה, ולא אות שורש.", "ar": "ט هي ת الوزن بعد أن تغيّر شكلها، وليست من الجذر.", "ru": "ט - это ת биньяна, изменившая форму, а не буква корня.", "en": "ט is the binyan's ת in a new form, not a root letter."}, null]),
   Q("dv-3-04",{"he": "בכל המשפטים יש פועל מן השורש ל־ב־ש. באיזה משפט מישהו גורם למישהו אחר לעשות את הפעולה?", "ar": "في كل الجمل فعل من الجذر ל־ב־ש. في أي جملة يجعل شخصٌ شخصًا آخر يقوم بالفعل؟", "ru": "Во всех предложениях есть глагол от корня ל־ב־ש. В каком предложении кто-то заставляет другого совершить действие?", "en": "Every sentence has a verb from the root ל־ב־ש. In which sentence does someone cause someone else to do the action?"},[{"he": "התינוק לָבַשׁ חולצה כחולה", "ar": "الطفل לָבַשׁ (لبس) قميصًا أزرق", "ru": "Малыш לָבַשׁ («надел») синюю рубашку", "en": "The baby לָבַשׁ (wore) a blue shirt"}, {"he": "אמא הִלְבִּישָׁה את התינוק", "ar": "الأم הִלְבִּישָׁה (ألبست) الطفل", "ru": "Мама הִלְבִּישָׁה («одела») малыша", "en": "Mom הִלְבִּישָׁה (dressed) the baby"}, {"he": "הילד הִתְלַבֵּשׁ לבד בבוקר", "ar": "الولد הִתְלַבֵּשׁ (ارتدى ملابسه) وحده في الصباح", "ru": "Мальчик הִתְלַבֵּשׁ («оделся») сам утром", "en": "The boy הִתְלַבֵּשׁ (got dressed) by himself in the morning"}, {"he": "השמלה נִלְבְּשָׁה רק פעם אחת בחתונה", "ar": "الفستان נִלְבְּשָׁה (لُبس) مرة واحدة فقط في العرس", "ru": "Платье נִלְבְּשָׁה («было надето») только раз, на свадьбе", "en": "The dress נִלְבְּשָׁה (was worn) only once, at the wedding"}],1,{"he": "חפשו משפט שיש בו שתי דמויות: אחת עושה, ואחת מקבלת את הפעולה.", "ar": "ابحثوا عن جملة فيها شخصيتان: واحدة تفعل، وأخرى تتلقّى الفعل.", "ru": "Найдите предложение с двумя участниками: один действует, другой получает действие.", "en": "Find a sentence with two characters: one acts, and the other receives the action."},{"he": "הִלְבִּישָׁה היא בבניין הפעיל, שמבטא לעיתים קרובות גרימה. אמא גורמת לתינוק להיות לבוש. בלָבַשׁ התינוק עושה בעצמו, בהִתְלַבֵּשׁ הילד עושה לעצמו, ובנִלְבְּשָׁה הפעולה נעשית על השמלה.", "ar": "הִלְבִּישָׁה في وزن הפעיל، الذي يعبّر غالبًا عن التسبيب. الأم تجعل الطفل لابسًا. في לָבַשׁ الطفل يفعل بنفسه، وفي הִתְלַבֵּשׁ الولد يفعل لنفسه، وفي נִלְבְּשָׁה يقع الفعل على الفستان.", "ru": "הִלְבִּישָׁה - биньян הפעיל, который часто выражает побуждение. Мама делает так, что малыш одет. В לָבַשׁ малыш действует сам, в הִתְלַבֵּשׁ мальчик действует на себя, а в נִלְבְּשָׁה действие совершается над платьем.", "en": "הִלְבִּישָׁה is in hif'il, which often expresses causing. Mom causes the baby to be dressed. In לָבַשׁ the baby acts himself, in הִתְלַבֵּשׁ the boy acts on himself, and in נִלְבְּשָׁה the action is done to the dress."},null,[{"he": "לָבַשׁ הוא בבניין פעל: התינוק עושה את הפעולה בעצמו.", "ar": "לָבַשׁ في وزن פעל: الطفل يقوم بالفعل بنفسه.", "ru": "לָבַשׁ - биньян פעל: малыш сам совершает действие.", "en": "לָבַשׁ is pa'al: the baby does the action himself."}, null, {"he": "הִתְלַבֵּשׁ הוא בבניין התפעל: הילד עושה את הפעולה לעצמו.", "ar": "הִתְלַבֵּשׁ في وزن התפעל: الولد يقوم بالفعل لنفسه.", "ru": "הִתְלַבֵּשׁ - биньян התפעל: мальчик совершает действие над собой.", "en": "הִתְלַבֵּשׁ is hitpa'el: the boy does the action to himself."}, {"he": "נִלְבְּשָׁה היא בבניין נפעל: הפעולה נעשתה על השמלה.", "ar": "נִלְבְּשָׁה في وزن נפעל: الفعل وقع على الفستان.", "ru": "נִלְבְּשָׁה - биньян נפעל: действие совершено над платьем.", "en": "נִלְבְּשָׁה is nif'al: the action was done to the dress."}]),
   Q("dv-3-05",{"he": "איזו מילה אינה הלחם של שתי מילים?", "ar": "أي كلمة ليست دمجًا لكلمتين؟", "ru": "Какое слово не является слиянием двух слов?", "en": "Which word is not a blend of two words?"},[{"he": "מַזְלֵג", "ar": "מַזְלֵג", "ru": "מַזְלֵג", "en": "מַזְלֵג"}, {"he": "מִדְרְחוֹב", "ar": "מִדְרְחוֹב", "ru": "מִדְרְחוֹב", "en": "מִדְרְחוֹב"}, {"he": "אוֹפַנּוֹעַ", "ar": "אוֹפַנּוֹעַ", "ru": "אוֹפַנּוֹעַ", "en": "אוֹפַנּוֹעַ"}, {"he": "כַּדּוּרֶגֶל", "ar": "כַּדּוּרֶגֶל", "ru": "כַּדּוּרֶגֶל", "en": "כַּדּוּרֶגֶל"}],0,{"he": "נסו לפרק כל מילה לשתי מילים מוכרות.", "ar": "حاولوا تفكيك كل كلمة إلى كلمتين معروفتين.", "ru": "Попробуйте разложить каждое слово на два знакомых слова.", "en": "Try to split each word into two familiar words."},{"he": "מַזְלֵג נוצר מן השורש ז־ל־ג במשקל מַקְטֵל, כמו מַפְתֵּחַ. אי אפשר לפרק אותו לשתי מילים. מדרחוב הוא מדרכה ורחוב, אופנוע הוא אופן ונוע, וכדורגל הוא כדור ורגל.", "ar": "מַזְלֵג (شوكة) نشأت من الجذر ז־ל־ג على وزن מַקְטֵל، مثل מַפְתֵּחַ (مفتاح). لا يمكن تفكيكها إلى كلمتين. מדרחוב هي מדרכה وרחוב، وאופנוע هي אופן وנוע، وכדורגל هي כדור وרגל.", "ru": "מַזְלֵג («вилка») образовано от корня ז־ל־ג по модели מַקְטֵל, как מַפְתֵּחַ («ключ»). Его нельзя разложить на два слова. מדרחוב - это מדרכה и רחוב, אופנוע - אופן и נוע, а כדורגל - כדור и רגל.", "en": "מַזְלֵג (fork) comes from the root ז־ל־ג in the מַקְטֵל pattern, like מַפְתֵּחַ (key). It cannot be split into two words. מדרחוב is מדרכה and רחוב, אופנוע is אופן and נוע, and כדורגל is כדור and רגל."},null,[null, {"he": "מִדְרְחוֹב הוא הלחם של מדרכה ורחוב.", "ar": "מִדְרְחוֹב (شارع للمشاة) دمج لـ מדרכה وרחוב.", "ru": "מִדְרְחוֹב («пешеходная улица») - слияние מדרכה и רחוב.", "en": "מִדְרְחוֹב (pedestrian street) blends מדרכה and רחוב."}, {"he": "אוֹפַנּוֹעַ הוא הלחם של אופן ונוע.", "ar": "אוֹפַנּוֹעַ (درّاجة نارية) دمج لـ אופן وנוע.", "ru": "אוֹפַנּוֹעַ («мотоцикл») - слияние אופן и נוע.", "en": "אוֹפַנּוֹעַ (motorcycle) blends אופן and נוע."}, {"he": "כַּדּוּרֶגֶל הוא הלחם של כדור ורגל.", "ar": "כַּדּוּרֶגֶל (كرة القدم) دمج لـ כדור وרגל.", "ru": "כַּדּוּרֶגֶל («футбол») - слияние כדור и רגל.", "en": "כַּדּוּרֶגֶל (football) blends כדור and רגל."}]),
   Q("dv-3-06",{"he": "מהו השורש של המילה \"תְּשׁוּבָה\"?", "ar": "ما جذر كلمة «תְּשׁוּבָה» (جواب)؟", "ru": "Какой корень у слова «תְּשׁוּבָה» («ответ»)?", "en": "What is the root of the word \"תְּשׁוּבָה\" (answer)?"},[{"he": "ת־ש־ב: בלי ו ובלי ה", "ar": "ת־ש־ב: بدون ו وبدون ה", "ru": "ת־ש־ב: без ו и без ה", "en": "ת־ש־ב: without ו and without ה"}, {"he": "ש־ו־ב", "ar": "ש־ו־ב", "ru": "ש־ו־ב", "en": "ש־ו־ב"}, {"he": "י־ש־ב", "ar": "י־ש־ב", "ru": "י־ש־ב", "en": "י־ש־ב"}, {"he": "ש־ב־ה", "ar": "ש־ב־ה", "ru": "ש־ב־ה", "en": "ש־ב־ה"}],1,{"he": "המשקל תְּקוּלָה מוסיף ת בהתחלה ו־ה בסוף.", "ar": "الوزن תְּקוּלָה يضيف ת في البداية وה في النهاية.", "ru": "Модель תְּקוּלָה добавляет ת в начале и ה в конце.", "en": "The תְּקוּלָה pattern adds ת at the start and ה at the end."},{"he": "תשובה בנויה בדגם תְּקוּלָה: ת בהתחלה ו־ה בסוף. נשארות ש ו ב, השורש של שָׁב ושל הֵשִׁיב. י־ש־ב הוא שורש אחר, של ישיבה ושל תושב.", "ar": "תשובה مبنية على نمط תְּקוּלָה: ת في البداية وה في النهاية. تبقى ש ו ב، جذر שָׁב (عاد) وהֵשִׁיב (أجاب). י־ש־ב جذر آخر، جذر ישיבה (جلوس) وתושב (ساكن).", "ru": "תשובה построено по модели תְּקוּלָה: ת в начале и ה в конце. Остаются ש ו ב - корень שָׁב («вернулся») и הֵשִׁיב («ответил»). י־ש־ב - другой корень, корень ישיבה («сидение») и תושב («житель»).", "en": "תשובה follows the תְּקוּלָה pattern: ת at the start and ה at the end. What remains is ש ו ב, the root of שָׁב (returned) and הֵשִׁיב (answered). י־ש־ב is a different root, of ישיבה (sitting) and תושב (resident)."},null,[{"he": "ת היא תוספת של המשקל, ו־ו היא כאן אות שורש.", "ar": "ת زائدة من الوزن، وו هنا حرف من الجذر.", "ru": "ת - добавка модели, а ו здесь - буква корня.", "en": "ת is added by the pattern, and ו here is a root letter."}, null, {"he": "י־ש־ב הוא שורש של ישיבה ושל תושב, ולא של תשובה.", "ar": "י־ש־ב جذر ישיבה وתושב، لا جذر תשובה.", "ru": "י־ש־ב - корень ישיבה и תושב, а не תשובה.", "en": "י־ש־ב is the root of ישיבה and תושב, not of תשובה."}, {"he": "ה בסוף היא סיומת, ו־ו היא אות שורש.", "ar": "ה في الآخر لاحقة، وו حرف من الجذر.", "ru": "ה в конце - окончание, а ו - буква корня.", "en": "The final ה is a suffix, and ו is a root letter."}])
  ]
]);

topic("ha-verb","014381",{"he": "נטיית הפועל", "ar": "تصريف الفعل", "ru": "Спряжение глагола", "en": "Verb inflection"},{"he": "בניינים, זמנים, גופים ושורשים שלמים וגרוניים", "ar": "الأوزان والأزمنة والضمائر والجذور الصحيحة والحلقية", "ru": "Биньяны, времена, лица, правильные и гортанные корни", "en": "Binyanim, tenses, persons, regular and guttural roots"}, [
[
Q("ha-verb-1-1",{"he": "איזה זמן מביע הפועל \"כתבה\" במשפט \"אתמול דנה כתבה מכתב\"?", "ar": "ما الزمن الذي يدل عليه الفعل «כתבה» في الجملة «אתמול דנה כתבה מכתב»؟", "ru": "Какое время выражает глагол «כתבה» в предложении «אתמול דנה כתבה מכתב»?", "en": "What tense does \"כתבה\" express in \"אתמול דנה כתבה מכתב\"?"},[{"he": "עבר", "ar": "الماضي", "ru": "прошедшее", "en": "past"}, {"he": "הווה", "ar": "المضارع", "ru": "настоящее", "en": "present"}, {"he": "עתיד", "ar": "المستقبل", "ru": "будущее", "en": "future"}, {"he": "ציווי", "ar": "الأمر", "ru": "повелительное", "en": "imperative"}],0,{"he": "שימו לב למילת הזמן במשפט ולצורת הפועל.", "ar": "انتبهوا إلى كلمة الزمن وصيغة الفعل.", "ru": "Обратите внимание на слово времени и форму глагола.", "en": "Notice the time word and the verb form."},{"he": "\"כתבה\" מתאר פעולה שהסתיימה. למשל: \"אתמול היא שרה\" הוא משפט בזמן עבר.", "ar": "«כתבה» تصف فعلًا انتهى. مثلًا: «غنّت أمس» في الماضي.", "ru": "«כתבה» описывает завершённое действие. Например, «Вчера она пела» стоит в прошедшем времени.", "en": "\"כתבה\" describes a completed action. For example, \"Yesterday she sang\" is in the past tense."},null,[null, {"he": "הצורה אינה מתארת פעולה המתרחשת עכשיו.", "ar": "هذه الصيغة لا تصف فعلًا يحدث الآن.", "ru": "Эта форма не описывает действие сейчас.", "en": "This form does not describe an action happening now."}, {"he": "אין כאן פעולה שטרם התרחשה.", "ar": "لا يدل الفعل على حدث لم يقع بعد.", "ru": "Здесь нет действия, которое ещё не произошло.", "en": "This is not an action yet to happen."}, {"he": "אין כאן הוראה למישהו לבצע פעולה.", "ar": "لا يوجد هنا أمر لشخص بفعل شيء.", "ru": "Здесь никому не велят что-либо сделать.", "en": "No one is being told to do something."}]),
Q("ha-verb-1-2",{"he": "איזה זמן מביע \"יקראו\" במשפט \"מחר הילדים יקראו סיפור\"?", "ar": "ما الزمن الذي تدل عليه «יקראו» في جملة «سيقرأ الأطفال قصة غدًا»؟", "ru": "Какое время у «יקראו» в предложении «Завтра дети прочитают рассказ»?", "en": "What tense does \"יקראו\" express in \"Tomorrow the children will read a story\"?"},[{"he": "עבר", "ar": "الماضي", "ru": "прошедшее", "en": "past"}, {"he": "עתיד", "ar": "المستقبل", "ru": "будущее", "en": "future"}, {"he": "הווה", "ar": "المضارع", "ru": "настоящее", "en": "present"}, {"he": "ציווי", "ar": "الأمر", "ru": "повелительное", "en": "imperative"}],1,{"he": "בדקו אם הפעולה כבר קרתה או עוד תקרה.", "ar": "تحقّقوا هل وقع الفعل أم سيقع لاحقًا.", "ru": "Проверьте, произошло ли действие или ещё произойдёт.", "en": "Check whether the action has happened or is yet to happen."},{"he": "\"יקראו\" מציין פעולה שעדיין לא התרחשה. למשל: \"בשבוע הבא הם ילמדו\" מציין עתיד.", "ar": "«יקראו» يدل على فعل لم يقع بعد. مثلًا: «سيدرسون الأسبوع القادم» يدل على المستقبل.", "ru": "«יקראו» обозначает действие, которое ещё не произошло. Например: «На следующей неделе они будут учиться» - будущее.", "en": "\"יקראו\" names an action that has not happened yet. For example, \"They will study next week\" is future tense."},null,[{"he": "הפעולה אינה מוצגת כפעולה שהסתיימה.", "ar": "لا يُعرض الفعل على أنه حدث وانتهى.", "ru": "Действие не представлено как завершённое.", "en": "The action is not presented as completed."}, null, {"he": "הפעולה אינה מתרחשת בזמן הדיבור.", "ar": "لا يحدث الفعل وقت الكلام.", "ru": "Действие не происходит в момент речи.", "en": "The action is not happening at the time of speaking."}, {"he": "המשפט מוסר מידע ואינו נותן הוראה.", "ar": "الجملة تخبر ولا تأمر.", "ru": "Предложение сообщает, а не приказывает.", "en": "The sentence informs rather than commands."}]),
Q("ha-verb-1-3",{"he": "לאיזה גוף מתייחס הפועל \"לומדים\" במשפט \"אנחנו לומדים עברית\"?", "ar": "إلى أي ضمير يعود الفعل «לומדים» في جملة «نحن نتعلّم العبرية»؟", "ru": "К какому лицу относится «לומדים» в «Мы учим иврит»?", "en": "Which person does \"לומדים\" refer to in \"We are learning Hebrew\"?"},[{"he": "הוא", "ar": "هو", "ru": "он", "en": "he"}, {"he": "הם", "ar": "هم", "ru": "они", "en": "they"}, {"he": "אנחנו", "ar": "نحن", "ru": "мы", "en": "we"}, {"he": "אתם", "ar": "أنتم", "ru": "вы (множ.)", "en": "you (plural)"}],2,{"he": "אתרו את כינוי הגוף שמופיע לפני הפועל.", "ar": "حدّدوا الضمير الذي يسبق الفعل.", "ru": "Найдите местоимение перед глаголом.", "en": "Find the pronoun before the verb."},{"he": "\"אנחנו\" הוא גוף ראשון רבים, והפועל מתאים לו. למשל: \"אנחנו כותבים במחברת\".", "ar": "«אנחנו» ضمير المتكلم الجمع، والفعل يوافقه. مثلًا: «نحن نكتب في الدفتر».", "ru": "«אנחנו» - первое лицо множественного числа; глагол согласуется с ним. Например: «Мы пишем в тетради».", "en": "\"אנחנו\" is first-person plural and the verb agrees with it. For example: \"We write in the notebook.\""},null,[{"he": "זהו גוף שלישי יחיד, שאינו כינוי הגוף במשפט.", "ar": "هذا ضمير الغائب المفرد، وليس الضمير في الجملة.", "ru": "Это третье лицо единственного числа, не местоимение в предложении.", "en": "That is third-person singular, not the pronoun in the sentence."}, {"he": "זהו גוף שלישי רבים; במשפט הדוברים מדברים על עצמם.", "ar": "هذا ضمير الغائب الجمع، لكن المتكلمين يتحدثون عن أنفسهم.", "ru": "Это третье лицо множественного числа; здесь говорящие говорят о себе.", "en": "That is third-person plural; here the speakers refer to themselves."}, null, {"he": "זהו גוף שני רבים, הפונה לנמענים ולא לדוברים.", "ar": "هذا ضمير المخاطبين، لا المتكلمين.", "ru": "Это второе лицо множественного числа, обращение к другим людям.", "en": "That is second-person plural, addressing others rather than the speakers."}]),
Q("vb-1-01",{"he": "באיזו צורה בא הפועל \"סגרי\" במשפט \"רינה, סגרי את החלון!\"?", "ar": "بأي صيغة جاء الفعل «סגרי» في الجملة «רינה, סגרי את החלון!» (رينا، أغلقي النافذة!)؟", "ru": "В какой форме стоит глагол «סגרי» в предложении «רינה, סגרי את החלון!» (Рина, закрой окно!)?", "en": "What form is the verb \"סגרי\" in the sentence \"רינה, סגרי את החלון!\" (Rina, close the window!)?"},[{"he": "עבר", "ar": "الماضي", "ru": "прошедшее время", "en": "past"}, {"he": "ציווי", "ar": "الأمر", "ru": "повелительное наклонение", "en": "imperative"}, {"he": "עתיד בגוף שני", "ar": "المستقبل للمخاطَب", "ru": "будущее время для второго лица", "en": "future, second person"}, {"he": "שם הפועל", "ar": "المصدر (שם הפועל)", "ru": "инфинитив", "en": "infinitive"}],1,{"he": "המשפט פונה ישירות לרינה ומבקש ממנה משהו.", "ar": "الجملة تتوجّه إلى رينا مباشرة وتطلب منها شيئًا.", "ru": "Фраза прямо обращается к Рине и о чём-то её просит.", "en": "The sentence speaks directly to Rina and asks her for something."},{"he": "\"סגרי\" היא צורת ציווי לנקבה יחידה. הדובר מבקש מרינה לעשות פעולה עכשיו. לזכר אומרים \"סגור\".", "ar": "«סגרי» صيغة أمر للمؤنث المفرد. المتكلم يطلب من رينا فعلًا الآن. وللمذكر نقول «סגור».", "ru": "«סגרי» - повелительное наклонение для женского рода ед. числа. Говорящий просит Рину сделать что-то сейчас. Мужчине говорят «סגור».", "en": "\"סגרי\" is the imperative for one female. The speaker asks Rina to act now. For a male we say \"סגור\"."},null,[{"he": "בעבר היה כתוב \"סגרת\", והמשפט אינו מספר על מה שכבר קרה.", "ar": "في الماضي نقول «סגרת»، والجملة لا تحكي عمّا حدث.", "ru": "В прошедшем было бы «סגרת», а фраза не рассказывает о прошлом.", "en": "The past would be \"סגרת\", and the sentence does not tell what already happened."}, null, {"he": "בעתיד יש ת בהתחלה: \"תסגרי\".", "ar": "في المستقبل تأتي ת في البداية: «תסגרי».", "ru": "В будущем времени в начале есть ת: «תסגרי».", "en": "The future starts with ת: \"תסגרי\"."}, {"he": "שם הפועל מתחיל ב־ל: \"לסגור\".", "ar": "المصدر يبدأ بـ ל: «לסגור».", "ru": "Инфинитив начинается с ל: «לסגור».", "en": "The infinitive starts with ל: \"לסגור\"."}]),
Q("vb-1-02",{"he": "באיזה משפט יש שם פועל?", "ar": "في أي جملة يوجد مصدر (שם פועל)؟", "ru": "В каком предложении есть инфинитив?", "en": "Which sentence contains an infinitive?"},[{"he": "נחתי שעה אחרי העבודה", "ar": "נחתי שעה אחרי העבודה", "ru": "נחתי שעה אחרי העבודה", "en": "נחתי שעה אחרי העבודה"}, {"he": "תנוחי קצת", "ar": "תנוחי קצת", "ru": "תנוחי קצת", "en": "תנוחי קצת"}, {"he": "אני רוצה לנוח", "ar": "אני רוצה לנוח", "ru": "אני רוצה לנוח", "en": "אני רוצה לנוח"}, {"he": "הוא נח בצהריים", "ar": "הוא נח בצהריים", "ru": "הוא נח בצהריים", "en": "הוא נח בצהריים"}],2,{"he": "חפשו צורה שאינה מראה זמן ואינה מראה גוף.", "ar": "ابحثوا عن صيغة لا تدل على زمن ولا على ضمير.", "ru": "Ищите форму, которая не показывает ни времени, ни лица.", "en": "Look for a form that shows neither tense nor person."},{"he": "\"לנוח\" הוא שם הפועל של השורש נ־ו־ח. שם הפועל מתחיל ב־ל. הוא לא מראה זמן או גוף.", "ar": "«לנוח» هو مصدر الجذر נ־ו־ח. المصدر يبدأ بـ ל، ولا يدل على زمن أو ضمير.", "ru": "«לנוח» - инфинитив корня נ־ו־ח. Инфинитив начинается с ל. Он не показывает времени и лица.", "en": "\"לנוח\" is the infinitive of the root נ־ו־ח. The infinitive starts with ל. It shows no tense or person."},null,[{"he": "\"נחתי\" הוא פועל בעבר, בגוף ראשון יחיד.", "ar": "«נחתי» فعل ماضٍ للمتكلم المفرد.", "ru": "«נחתי» - глагол прошедшего времени, 1-е лицо ед. числа.", "en": "\"נחתי\" is a past-tense verb, first person singular."}, {"he": "\"תנוחי\" הוא פועל בעתיד, בגוף שני נקבה.", "ar": "«תנוחי» فعل مستقبل للمخاطَبة.", "ru": "«תנוחי» - глагол будущего времени, 2-е лицо ж. рода.", "en": "\"תנוחי\" is a future-tense verb, second person feminine."}, null, {"he": "\"נח\" מראה גוף: גוף שלישי יחיד, בעבר או בהווה.", "ar": "«נח» يدل على الضمير: الغائب المفرد، في الماضي أو المضارع.", "ru": "«נח» показывает лицо: 3-е лицо ед. числа, в прошедшем или настоящем времени.", "en": "\"נח\" shows person: third person singular, in the past or the present."}]),
Q("vb-1-03",{"he": "איזה בניין מביע בדרך כלל פעולה שאדם עושה לעצמו, כמו \"התרחץ\"?", "ar": "أي وزن يدل عادةً على فعل يقوم به الشخص لنفسه، مثل «התרחץ» (اغتسل)؟", "ru": "Какой биньян обычно выражает действие, которое человек делает сам с собой, как «התרחץ» (помылся)?", "en": "Which binyan usually expresses an action a person does to himself, like \"התרחץ\" (washed himself)?"},[{"he": "התפעל", "ar": "وزن התפעל", "ru": "хитпаэль", "en": "Hitpa’el"}, {"he": "פיעל", "ar": "وزن פיעל", "ru": "пиэль", "en": "Pi’el"}, {"he": "הפעיל, כמו \"הלביש\"", "ar": "وزن הפעיל، مثل «הלביש» (ألبَسَ)", "ru": "хифиль, как «הלביש» (одел кого-то)", "en": "Hif’il, like \"הלביש\" (dressed someone)"}, {"he": "נפעל", "ar": "وزن נפעל", "ru": "нифаль", "en": "Nif’al"}],0,{"he": "שימו לב לאותיות שבתחילת \"התרחץ\".", "ar": "انتبهوا إلى الحروف في بداية «התרחץ».", "ru": "Обратите внимание на буквы в начале «התרחץ».", "en": "Notice the letters at the start of \"התרחץ\"."},{"he": "בניין התפעל מביע לרוב פעולה חוזרת: האדם עושה אותה לעצמו. למשל \"התלבש\" ו\"התרחץ\". הצורה מתחילה ב־הת.", "ar": "وزن התפעל يدل غالبًا على فعل منعكس: يفعله الشخص لنفسه، مثل «התלבש» و«התרחץ». تبدأ الصيغة بـ הת.", "ru": "Хитпаэль чаще выражает возвратное действие: человек делает его сам с собой, как «התלבש» и «התרחץ». Форма начинается с הת.", "en": "Hitpa’el usually expresses a reflexive action, done to oneself, like \"התלבש\" and \"התרחץ\". The form starts with הת."},null,[null, {"he": "בפיעל אין ה ו־ת בהתחלה, למשל \"דיבר\".", "ar": "في פיעל لا توجد ה و ת في البداية، مثل «דיבר».", "ru": "В пиэль нет начальных ה и ת, например «דיבר».", "en": "Pi’el has no initial ה and ת, for example \"דיבר\"."}, {"he": "הפעיל מביע בדרך כלל פעולה שעושים למישהו אחר.", "ar": "وزن הפעיל يدل عادةً على فعل يُعمل لشخص آخر.", "ru": "Хифиль обычно выражает действие, которое делают с другим.", "en": "Hif’il usually expresses an action done to someone else."}, {"he": "נפעל מביע לרוב פעולה שנעשתה לנושא, למשל \"נסגר\".", "ar": "وزن נפעל يدل غالبًا على فعل وقع على الفاعل، مثل «נסגר».", "ru": "Нифаль чаще выражает действие над субъектом, например «נסגר».", "en": "Nif’al usually expresses an action done to the subject, like \"נסגר\"."}]),
Q("vb-1-04",{"he": "איזה כינוי גוף מתאים לפועל \"תכתבו\"?", "ar": "أي ضمير يناسب الفعل «תכתבו»؟", "ru": "Какое местоимение подходит к глаголу «תכתבו»?", "en": "Which pronoun fits the verb \"תכתבו\"?"},[{"he": "הם", "ar": "هم", "ru": "они", "en": "they"}, {"he": "אנחנו", "ar": "نحن", "ru": "мы", "en": "we"}, {"he": "הוא ואני", "ar": "هو وأنا معًا", "ru": "он и я вместе", "en": "he and I together"}, {"he": "אתם", "ar": "أنتم", "ru": "вы", "en": "you (plural)"}],3,{"he": "בדקו את האות בתחילת הפועל ואת הסיומת שלו.", "ar": "افحصوا الحرف في بداية الفعل ونهايته.", "ru": "Проверьте букву в начале глагола и его окончание.", "en": "Check the letter at the start of the verb and its ending."},{"he": "ת בהתחלה ו־ו בסוף מסמנות עתיד בגוף שני רבים. לכן \"אתם תכתבו\". לגוף שלישי רבים אומרים \"הם יכתבו\".", "ar": "حرف ת في البداية و ו في النهاية يدلان على المستقبل للمخاطَبين. لذلك «אתם תכתבו». وللغائبين نقول «הם יכתבו».", "ru": "ת в начале и ו в конце обозначают будущее время 2-го лица мн. числа: «אתם תכתבו». Для «они» - «הם יכתבו».", "en": "Initial ת and final ו mark the future, second person plural: \"אתם תכתבו\". For \"they\" we say \"הם יכתבו\"."},null,[{"he": "לגוף \"הם\" אומרים בעתיד \"יכתבו\", עם י בהתחלה.", "ar": "مع «هم» نقول في المستقبل «יכתבו» بحرف י في البداية.", "ru": "Для «они» в будущем говорят «יכתבו», с י в начале.", "en": "For \"they\" the future is \"יכתבו\", starting with י."}, {"he": "לגוף \"אנחנו\" אומרים בעתיד \"נכתוב\", עם נ בהתחלה.", "ar": "مع «نحن» نقول في المستقبل «נכתוב» بحرف נ.", "ru": "Для «мы» в будущем говорят «נכתוב», с נ в начале.", "en": "For \"we\" the future is \"נכתוב\", starting with נ."}, {"he": "\"הוא ואני\" הם \"אנחנו\", ולכן הפועל הוא \"נכתוב\".", "ar": "«هو وأنا» تعني «نحن»، فالفعل هو «נכתוב».", "ru": "«Он и я» - это «мы», поэтому глагол «נכתוב».", "en": "\"He and I\" means \"we\", so the verb is \"נכתוב\"."}, null]),
Q("vb-1-05",{"he": "לאיזו גזרה שייך השורש ק־ו־ם (קם, לקום)?", "ar": "إلى أي مجموعة جذور ينتمي الجذر ק־ו־ם (קם, לקום)؟", "ru": "К какой группе корней относится корень ק־ו־ם (קם, לקום)?", "en": "Which root group does ק־ו־ם (קם, לקום) belong to?"},[{"he": "שלמים", "ar": "الجذور الصحيحة", "ru": "правильные (полные) корни", "en": "regular (whole) roots"}, {"he": "נחי ע\"ו", "ar": "الجذور الجوفاء (ע\"ו)", "ru": "пустые корни (ע\"ו)", "en": "hollow roots (ע\"ו)"}, {"he": "נחי ל\"ה", "ar": "الجذور المنتهية بـ ה (ל\"ה)", "ru": "корни с конечной ה (ל\"ה)", "en": "roots ending in ה (ל\"ה)"}, {"he": "חסרי פ\"נ, כמו נ־פ־ל", "ar": "الجذور الناقصة الفاء נ، مثل נ־פ־ל", "ru": "корни с начальной נ, как נ־פ־ל", "en": "roots starting with נ, like נ־פ־ל"}],1,{"he": "בדקו איזו אות מהשורש לא נשמעת בצורה \"קם\".", "ar": "افحصوا أي حرف من الجذر لا يُسمع في «קם».", "ru": "Проверьте, какая буква корня не слышна в форме «קם».", "en": "Check which root letter is not heard in \"קם\"."},{"he": "בשורש ק־ו־ם האות האמצעית היא ו. היא נעלמת בצורות כמו \"קם\" ו\"קמנו\". לכן זהו שורש נחי ע\"ו, כמו ש־ו־ב ו־ר־ו־ץ.", "ar": "في الجذر ק־ו־ם الحرف الأوسط ו، ويختفي في صيغ مثل «קם» و«קמנו». لذلك هو جذر أجوف، مثل ש־ו־ב و ר־ו־ץ.", "ru": "В корне ק־ו־ם средняя буква ו. Она исчезает в формах «קם» и «קמנו». Это корень ע\"ו, как ש־ו־ב и ר־ו־ץ.", "en": "In ק־ו־ם the middle letter is ו. It disappears in forms like \"קם\" and \"קמנו\". So it is a hollow root, like ש־ו־ב and ר־ו־ץ."},null,[{"he": "בשורש שלם כל האותיות נשמעות, וכאן ה־ו נעלמת ב\"קם\".", "ar": "في الجذر الصحيح تُسمع كل الحروف، وهنا تختفي ו في «קם».", "ru": "В правильном корне слышны все буквы, а здесь ו исчезает в «קם».", "en": "In a regular root all letters are heard, but ו disappears in \"קם\"."}, null, {"he": "השורש מסתיים ב־ם, ולא ב־ה.", "ar": "الجذر ينتهي بـ ם لا بـ ה.", "ru": "Корень оканчивается на ם, а не на ה.", "en": "The root ends in ם, not in ה."}, {"he": "השורש מתחיל ב־ק, ולא ב־נ.", "ar": "الجذر يبدأ بـ ק لا بـ נ.", "ru": "Корень начинается с ק, а не с נ.", "en": "The root starts with ק, not with נ."}]),
Q("vb-1-06",{"he": "איזה בניין הוא הסביל של בניין הפעיל? (למשל: \"האור ___ על ידי השומר\")", "ar": "أي وزن هو المبني للمجهول من وزن הפעיל؟ (مثلًا: «האור ___ על ידי השומר»)", "ru": "Какой биньян - пассив биньяна хифиль? (например: «האור ___ על ידי השומר»)", "en": "Which binyan is the passive of Hif’il? (for example: \"האור ___ על ידי השומר\")"},[{"he": "הופעל", "ar": "وزن הופעל", "ru": "хуфаль", "en": "Huf’al"}, {"he": "נפעל", "ar": "وزن נפעל", "ru": "нифаль", "en": "Nif’al"}, {"he": "פועל, כמו \"סופר\"", "ar": "وزن פועל، مثل «סופר»", "ru": "пуаль, как «סופר»", "en": "Pu’al, like \"סופר\""}, {"he": "התפעל", "ar": "وزن התפעל", "ru": "хитпаэль", "en": "Hitpa’el"}],0,{"he": "חשבו איך נשמע \"הדליק\" כשהפעולה נעשית לאור.", "ar": "فكّروا كيف تصبح «הדליק» حين يقع الفعل على الضوء.", "ru": "Подумайте, как звучит «הדליק», когда действие совершают над светом.", "en": "Think how \"הדליק\" sounds when the action is done to the light."},{"he": "לכל בניין פעיל בדגם פיעל או הפעיל יש בניין סביל. הסביל של הפעיל הוא הופעל: \"הדליק\" הופך ל\"הודלק\".", "ar": "للوزنين פיעל و הפעיל وزن مبني للمجهول. مجهول הפעיל هو הופעל: «הדליק» يصبح «הודלק».", "ru": "У биньянов пиэль и хифиль есть пассивная пара. Пассив хифиль - хуфаль: «הדליק» становится «הודלק».", "en": "Pi’el and Hif’il each have a passive partner. The passive of Hif’il is Huf’al: \"הדליק\" becomes \"הודלק\"."},null,[null, {"he": "נפעל משמש בדרך כלל כסביל של בניין קל, למשל \"נכתב\".", "ar": "وزن נפעל يكون عادةً مجهول وزن קל، مثل «נכתב».", "ru": "Нифаль обычно служит пассивом к каль, например «נכתב».", "en": "Nif’al usually serves as the passive of Kal, like \"נכתב\"."}, {"he": "פועל הוא הסביל של פיעל: \"סיפר\" הופך ל\"סופר\".", "ar": "وزن פועל هو مجهول פיעל: «סיפר» يصبح «סופר».", "ru": "Пуаль - пассив пиэль: «סיפר» становится «סופר».", "en": "Pu’al is the passive of Pi’el: \"סיפר\" becomes \"סופר\"."}, {"he": "התפעל מביע לרוב פעולה חוזרת, ולא סביל של הפעיל.", "ar": "وزن התפעל يدل غالبًا على فعل منعكس، لا على مجهول הפעיל.", "ru": "Хитпаэль обычно возвратный, а не пассив хифиль.", "en": "Hitpa’el is usually reflexive, not the passive of Hif’il."}]),

Q("ha-verb-2-1",{"he": "לאיזה בניין שייך הפועל \"סיפר\"?", "ar": "إلى أي وزن عبري ينتمي الفعل «סיפר»؟", "ru": "К какому биньяну относится глагол «סיפר»?", "en": "Which binyan does the verb \"סיפר\" belong to?"},[{"he": "קל", "ar": "קל", "ru": "пааль (каль)", "en": "Pa’al (Kal)"}, {"he": "נפעל", "ar": "נפעל", "ru": "нифаль", "en": "Nif’al"}, {"he": "הפעיל", "ar": "הפעיל", "ru": "hифиль", "en": "Hif’il"}, {"he": "פיעל", "ar": "פיעל", "ru": "пиэль", "en": "Pi’el"}],3,{"he": "השוו את צורת העבר של הפועל לדגם של כל בניין.", "ar": "قارنوا صيغة الماضي بنمط كل وزن.", "ru": "Сравните форму прошедшего времени с образцом каждого биньяна.", "en": "Compare the past-tense form with each binyan pattern."},{"he": "\"סיפר\" בנוי בדגם פיעל, כמו \"דיבר\" ו\"לימד\". השורש ס־פ־ר מופיע גם ב\"סיפור\".", "ar": "«סיפר» على وزن פיעל، مثل «דיבר» و«לימד». ويظهر الجذر ס־פ־ר أيضًا في «סיפור».", "ru": "«סיפר» относится к пиэль, как «דיבר» и «לימד». Корень ס־פ־ר есть и в «סיפור».", "en": "\"סיפר\" follows Pi’el, like \"דיבר\" and \"לימד\". Its root ס־פ־ר also appears in \"סיפור\"."},null,[{"he": "דגם קל שונה מדגם הפועל הנתון.", "ar": "نمط קל يختلف عن صيغة الفعل المعطى.", "ru": "Модель каль отличается от формы данного глагола.", "en": "The Kal pattern differs from this verb form."}, {"he": "בצורת העבר של נפעל מופיעה בדרך כלל נ תחילית.", "ar": "في ماضي נפעל تظهر عادة نون في البداية.", "ru": "У нифаль в прошедшем времени обычно есть начальная נ.", "en": "Nif’al past forms usually have an initial נ."}, {"he": "דגם הפעיל נראה למשל ב\"הדליק\"; כאן אין ה תחילית.", "ar": "نمط הפעיל يظهر مثلًا في «הדליק»؛ هنا لا توجد ה في البداية.", "ru": "Модель хифиль видна, например, в «הדליק»; здесь нет начальной ה.", "en": "Hif’il appears in \"הדליק\"; this form has no initial ה."}, null]),
Q("ha-verb-2-2",{"he": "לאיזה בניין שייך \"הדליק\" במשפט \"השומר הדליק את האור\"?", "ar": "إلى أي وزن ينتمي «הדליק» في جملة «أشعل الحارس الضوء»؟", "ru": "К какому биньяну относится «הדליק» в предложении «Охранник включил свет»?", "en": "Which binyan does \"הדליק\" belong to in \"The guard turned on the light\"?"},[{"he": "הפעיל", "ar": "هِفعيل", "ru": "хифиль", "en": "Hif’il"}, {"he": "פיעל", "ar": "پيعل", "ru": "пиэль", "en": "Pi’el"}, {"he": "נפעל", "ar": "نِفعال", "ru": "нифаль", "en": "Nif’al"}, {"he": "התפעל", "ar": "هِتْپَعِل", "ru": "хитпаэль", "en": "Hitpa’el"}],0,{"he": "בחנו את תחילת הפועל ואת הדגם של צורת העבר.", "ar": "افحصوا بداية الفعل ونمط صيغة الماضي.", "ru": "Проверьте начало глагола и модель прошедшего времени.", "en": "Check the verb’s beginning and past-tense pattern."},{"he": "\"הדליק\" הוא עבר, גוף שלישי יחיד, בבניין הפעיל. למשל: \"הכניס\" בנוי באותו דגם.", "ar": "«הדליק» فعل ماضٍ للغائب المفرد في وزن הפעיל. مثلًا: «הכניס» على النمط نفسه.", "ru": "«הדליק» - прошедшее время, третье лицо единственного числа, биньян хифиль. Например, «הכניס» имеет ту же модель.", "en": "\"הדליק\" is past tense, third-person singular, in Hif’il. For example, \"הכניס\" has the same pattern."},null,[null, {"he": "דגם פיעל אינו כולל ה תחילית כזאת.", "ar": "نمط פיעל لا يتضمن هذه الـה في البداية.", "ru": "У модели пиэль нет такой начальной ה.", "en": "Pi’el does not have this initial ה pattern."}, {"he": "דגם נפעל כולל בדרך כלל נ בתחילת צורת העבר.", "ar": "تبدأ صيغة الماضي في נפעל عادة بحرف נ.", "ru": "Нифаль обычно имеет начальную נ в прошедшем времени.", "en": "Nif’al past forms usually begin with נ."}, {"he": "דגם התפעל כולל את הרצף הת בתחילת צורת העבר.", "ar": "يبدأ ماضي התפעל عادة بالمقطع הת.", "ru": "Хитпаэль обычно начинается с הת в прошедшем времени.", "en": "Hitpa’el past forms begin with הת."}]),
Q("ha-verb-2-3",{"he": "לאיזה בניין שייך \"נכנס\" במשפט \"האורח נכנס לחדר\"?", "ar": "إلى أي وزن ينتمي «נכנס» في جملة «دخل الضيف الغرفة»؟", "ru": "К какому биньяну относится «נכנס» в предложении «Гость вошёл в комнату»?", "en": "Which binyan does \"נכנס\" belong to in \"The guest entered the room\"?"},[{"he": "קל", "ar": "קל", "ru": "каль", "en": "Kal"}, {"he": "נפעל", "ar": "נפעל", "ru": "нифаль", "en": "Nif’al"}, {"he": "פיעל", "ar": "פיעל", "ru": "пиэль", "en": "Pi’el"}, {"he": "הפעיל", "ar": "הפעיל", "ru": "хифиль", "en": "Hif’il"}],1,{"he": "שימו לב לאות שמופיעה לפני אותיות השורש כ־נ־ס.", "ar": "انتبهوا للحرف الذي يسبق حروف الجذر כ־נ־ס.", "ru": "Обратите внимание на букву перед корнем כ־נ־ס.", "en": "Notice the letter before the root כ־נ־ס."},{"he": "שורש הפועל הוא כ־נ־ס, והנון התחילית היא חלק מדגם נפעל בעבר. למשל: \"נשמר\" הוא גם פועל בבניין נפעל.", "ar": "جذر الفعل ك־ن־س، والنون الأولى من وزن נפעל في الماضي. مثلًا «נשמר» من الوزن نفسه.", "ru": "Корень כ־נ־ס; начальная נ принадлежит модели нифаль в прошедшем времени. Например, «נשמר» тоже нифаль.", "en": "The root is כ־נ־ס; the initial נ belongs to the Nif’al past pattern. For example, \"נשמר\" is also Nif’al."},null,[{"he": "בדגם קל אין נ תחילית לפני השורש הזה.", "ar": "في وزن קל لا تسبق الجذر هنا נ زائدة.", "ru": "В модели каль перед этим корнем нет добавочной נ.", "en": "Kal does not add an initial נ before this root."}, null, {"he": "הדגם של פיעל אינו מתחיל בנון הזאת.", "ar": "نمط פיעל لا يبدأ بهذه النون.", "ru": "Модель пиэль не начинается с такой נ.", "en": "Pi’el does not begin with this נ."}, {"he": "הפעיל מאופיין בדגם אחר, כמו \"הכניס\".", "ar": "وزن הפעיל له نمط آخر، مثل «הכניס».", "ru": "У хифиль другая модель, например «הכניס».", "en": "Hif’il has a different pattern, as in \"הכניס\"."}]),
Q("vb-2-01",{"he": "איזה משפט נכון?", "ar": "أي جملة صحيحة؟", "ru": "Какое предложение правильное?", "en": "Which sentence is correct?"},[{"he": "הילדות משחקים כדורגל", "ar": "הילדות משחקים כדורגל", "ru": "הילדות משחקים כדורגל", "en": "הילדות משחקים כדורגל"}, {"he": "הילדות משחקת כדורגל", "ar": "הילדות משחקת כדורגל", "ru": "הילדות משחקת כדורגל", "en": "הילדות משחקת כדורגל"}, {"he": "הילדות משחקות כדורגל", "ar": "הילדות משחקות כדורגל", "ru": "הילדות משחקות כדורגל", "en": "הילדות משחקות כדורגל"}, {"he": "הילדות שלנו בכיתה משחק כדורגל", "ar": "הילדות שלנו בכיתה משחק כדורגל", "ru": "הילדות שלנו בכיתה משחק כדורגל", "en": "הילדות שלנו בכיתה משחק כדורגל"}],2,{"he": "בדקו התאמה במין ובמספר בין הנושא לפועל.", "ar": "افحصوا التطابق في الجنس والعدد بين الفاعل والفعل.", "ru": "Проверьте согласование подлежащего и глагола в роде и числе.", "en": "Check gender and number agreement between subject and verb."},{"he": "בהווה הפועל מתאים לנושא במין ובמספר. \"הילדות\" הן נקבה רבות, ולכן \"משחקות\". לבנים אומרים \"משחקים\".", "ar": "في المضارع يتطابق الفعل مع الفاعل جنسًا وعددًا. «הילדות» جمع مؤنث، لذلك «משחקות». وللأولاد نقول «משחקים».", "ru": "В настоящем времени глагол согласуется с подлежащим в роде и числе. «הילדות» - ж. род мн. числа, поэтому «משחקות». О мальчиках - «משחקים».", "en": "In the present, the verb agrees with the subject in gender and number. \"הילדות\" is feminine plural, so \"משחקות\". For boys: \"משחקים\"."},null,[{"he": "\"הילדות\" הן נקבה, ו\"משחקים\" היא צורת זכר.", "ar": "«הילדות» مؤنث، و«משחקים» صيغة مذكر.", "ru": "«הילדות» - женский род, а «משחקים» - форма мужского рода.", "en": "\"הילדות\" is feminine, but \"משחקים\" is a masculine form."}, {"he": "\"משחקת\" היא צורת יחידה, והנושא ברבים.", "ar": "«משחקת» صيغة مفرد، والفاعل جمع.", "ru": "«משחקת» - форма ед. числа, а подлежащее во мн. числе.", "en": "\"משחקת\" is singular, but the subject is plural."}, null, {"he": "\"משחק\" היא צורת זכר יחיד, והנושא נקבה רבות.", "ar": "«משחק» صيغة مفرد مذكر، والفاعل جمع مؤنث.", "ru": "«משחק» - мужской род ед. числа, а подлежащее - женский род мн. числа.", "en": "\"משחק\" is masculine singular, but the subject is feminine plural."}]),
Q("vb-2-02",{"he": "לאיזה בניין שייך \"מתכונן\" במשפט \"דן מתכונן למבחן\"?", "ar": "إلى أي وزن ينتمي «מתכונן» في الجملة «דן מתכונן למבחן» (دان يستعد للامتحان)؟", "ru": "К какому биньяну относится «מתכונן» в предложении «דן מתכונן למבחן» (Дан готовится к экзамену)?", "en": "Which binyan does \"מתכונן\" belong to in \"דן מתכונן למבחן\" (Dan is preparing for the test)?"},[{"he": "פיעל, כמו \"מדבר\"", "ar": "وزن פיעל، مثل «מדבר»", "ru": "пиэль, как «מדבר»", "en": "Pi’el, like \"מדבר\""}, {"he": "נפעל", "ar": "وزن נפעל", "ru": "нифаль", "en": "Nif’al"}, {"he": "הפעיל", "ar": "وزن הפעיל", "ru": "хифиль", "en": "Hif’il"}, {"he": "התפעל", "ar": "وزن התפעל", "ru": "хитпаэль", "en": "Hitpa’el"}],3,{"he": "שימו לב לשתי האותיות שבתחילת הפועל.", "ar": "انتبهوا إلى الحرفين في بداية الفعل.", "ru": "Обратите внимание на две буквы в начале глагола.", "en": "Notice the two letters at the start of the verb."},{"he": "בהווה של התפעל הפועל מתחיל ב־מת, למשל \"מתלבש\". \"מתכונן\" בא מהשורש כ־ו־ן. בעבר אומרים \"התכונן\".", "ar": "مضارع התפעל يبدأ بـ מת، مثل «מתלבש». «מתכונן» من الجذر כ־ו־ן، وفي الماضي نقول «התכונן».", "ru": "Настоящее время хитпаэль начинается с מת, например «מתלבש». «מתכונן» - от корня כ־ו־ן, в прошедшем «התכונן».", "en": "Hitpa’el present starts with מת, like \"מתלבש\". \"מתכונן\" comes from the root כ־ו־ן; its past is \"התכונן\"."},null,[{"he": "בהווה של פיעל אין ת אחרי ה־מ, למשל \"מדבר\".", "ar": "في مضارع פיעל لا تأتي ת بعد מ، مثل «מדבר».", "ru": "В настоящем времени пиэль нет ת после מ, например «מדבר».", "en": "Pi’el present has no ת after מ, for example \"מדבר\"."}, {"he": "בהווה של נפעל יש נ בהתחלה, למשל \"נכנס\".", "ar": "مضارع נפעל يبدأ بـ נ، مثل «נכנס».", "ru": "Настоящее время нифаль начинается с נ, например «נכנס».", "en": "Nif’al present starts with נ, for example \"נכנס\"."}, {"he": "בהווה של הפעיל אין ת אחרי ה־מ, למשל \"מדליק\".", "ar": "في مضارع הפעיל لا تأتي ת بعد מ، مثل «מדליק».", "ru": "В настоящем времени хифиль нет ת после מ, например «מדליק».", "en": "Hif’il present has no ת after מ, for example \"מדליק\"."}, null]),
Q("vb-2-03",{"he": "הפכו לסביל: \"הטכנאי תיקן את המחשב\". איזה משפט נכון?", "ar": "حوّلوا إلى المبني للمجهول: «הטכנאי תיקן את המחשב» (الفني أصلح الحاسوب). أي جملة صحيحة؟", "ru": "Переведите в пассив: «הטכנאי תיקן את המחשב» (техник починил компьютер). Какое предложение верно?", "en": "Make it passive: \"הטכנאי תיקן את המחשב\" (the technician fixed the computer). Which sentence is correct?"},[{"he": "המחשב תוקן על ידי הטכנאי", "ar": "המחשב תוקן על ידי הטכנאי", "ru": "המחשב תוקן על ידי הטכנאי", "en": "המחשב תוקן על ידי הטכנאי"}, {"he": "המחשב יתוקן מחר על ידי הטכנאי", "ar": "המחשב יתוקן מחר על ידי הטכנאי", "ru": "המחשב יתוקן מחר על ידי הטכנאי", "en": "המחשב יתוקן מחר על ידי הטכנאי"}, {"he": "המחשב תיקן את הטכנאי", "ar": "המחשב תיקן את הטכנאי", "ru": "המחשב תיקן את הטכנאי", "en": "המחשב תיקן את הטכנאי"}, {"he": "המחשב התקין על ידי הטכנאי", "ar": "המחשב התקין על ידי הטכנאי", "ru": "המחשב התקין על ידי הטכנאי", "en": "המחשב התקין על ידי הטכנאי"}],0,{"he": "\"תיקן\" הוא בבניין פיעל. חשבו מה הבניין הסביל שלו.", "ar": "«תיקן» في وزن פיעל. فكّروا ما وزنه المبني للمجهول.", "ru": "«תיקן» - в биньяне пиэль. Подумайте, какой у него пассивный биньян.", "en": "\"תיקן\" is in Pi’el. Think which binyan is its passive."},{"he": "הסביל של פיעל הוא פועל: \"תיקן\" הופך ל\"תוקן\". המושא \"המחשב\" הופך לנושא. הזמן נשאר עבר.", "ar": "مجهول פיעל هو פועל: «תיקן» يصبح «תוקן». المفعول «המחשב» يصبح فاعلًا، ويبقى الزمن ماضيًا.", "ru": "Пассив пиэль - пуаль: «תיקן» становится «תוקן». Дополнение «המחשב» становится подлежащим. Время остаётся прошедшим.", "en": "The passive of Pi’el is Pu’al: \"תיקן\" becomes \"תוקן\". The object \"המחשב\" becomes the subject. The tense stays past."},null,[null, {"he": "הפועל כאן בעתיד, ובמשפט המקורי הוא בעבר.", "ar": "الفعل هنا في المستقبل، وفي الجملة الأصلية في الماضي.", "ru": "Здесь глагол в будущем, а в исходной фразе - в прошедшем.", "en": "This verb is future, but the original is past."}, {"he": "זה משפט פעיל, והתפקידים בו התהפכו.", "ar": "هذه جملة مبنية للمعلوم، وانقلبت فيها الأدوار.", "ru": "Это активная фраза, и роли в ней поменялись.", "en": "This is still active, and the roles are reversed."}, {"he": "\"התקין\" הוא פועל פעיל בהפעיל, ולא סביל של \"תיקן\".", "ar": "«התקין» فعل مبني للمعلوم في הפעיל، لا مجهول «תיקן».", "ru": "«התקין» - активный глагол хифиль, а не пассив от «תיקן».", "en": "\"התקין\" is an active Hif’il verb, not the passive of \"תיקן\"."}]),
Q("vb-2-04",{"he": "השלימו: \"בשבוע הבא אני ___ את הספר\". השורש הוא ג־מ־ר.", "ar": "أكملوا: «בשבוע הבא אני ___ את הספר» (في الأسبوع القادم أنا ___ الكتاب). الجذر ג־מ־ר.", "ru": "Дополните: «בשבוע הבא אני ___ את הספר» (на следующей неделе я ___ книгу). Корень ג־מ־ר.", "en": "Complete: \"בשבוע הבא אני ___ את הספר\" (next week I ___ the book). The root is ג־מ־ר."},[{"he": "יגמור", "ar": "יגמור", "ru": "יגמור", "en": "יגמור"}, {"he": "אגמור", "ar": "אגמור", "ru": "אגמור", "en": "אגמור"}, {"he": "גמרתי", "ar": "גמרתי", "ru": "גמרתי", "en": "גמרתי"}, {"he": "תגמרו ביחד", "ar": "תגמרו ביחד", "ru": "תגמרו ביחד", "en": "תגמרו ביחד"}],1,{"he": "בדקו גם את מילת הזמן וגם את כינוי הגוף.", "ar": "افحصوا كلمة الزمن والضمير معًا.", "ru": "Проверьте и слово времени, и местоимение.", "en": "Check both the time word and the pronoun."},{"he": "\"בשבוע הבא\" מצביע על עתיד. בעתיד, הפועל של \"אני\" מתחיל ב־א. לכן \"אני אגמור\", כמו \"אני אכתוב\".", "ar": "«בשבוע הבא» يدل على المستقبل. في المستقبل يبدأ فعل «أنا» بـ א. لذلك «אני אגמור» مثل «אני אכתוב».", "ru": "«בשבוע הבא» указывает на будущее. В будущем глагол для «я» начинается с א. Поэтому «אני אגמור», как «אני אכתוב».", "en": "\"Next week\" points to the future. In the future, the verb for \"I\" starts with א. So \"אני אגמור\", like \"אני אכתוב\"."},null,[{"he": "\"יגמור\" מתאים לגוף \"הוא\", ולא ל\"אני\".", "ar": "«יגמור» يناسب «هو» لا «أنا».", "ru": "«יגמור» подходит к «он», а не к «я».", "en": "\"יגמור\" fits \"he\", not \"I\"."}, null, {"he": "\"גמרתי\" הוא עבר, ו\"בשבוע הבא\" מצביע על עתיד.", "ar": "«גמרתי» ماضٍ، و«בשבוע הבא» يدل على المستقبل.", "ru": "«גמרתי» - прошедшее, а «בשבוע הבא» указывает на будущее.", "en": "\"גמרתי\" is past, but \"next week\" points to the future."}, {"he": "\"תגמרו\" מתאים לגוף \"אתם\", ולא ל\"אני\".", "ar": "«תגמרו» يناسب «أنتم» لا «أنا».", "ru": "«תגמרו» подходит к «вы», а не к «я».", "en": "\"תגמרו\" fits \"you (plural)\", not \"I\"."}]),
Q("vb-2-05",{"he": "מה צורת הציווי לזכר יחיד של \"לשמור\"?", "ar": "ما صيغة الأمر للمذكر المفرد من «לשמור» (يحفظ)؟", "ru": "Какая форма повелительного наклонения для мужского рода ед. числа от «לשמור» (хранить)?", "en": "What is the masculine singular imperative of \"לשמור\" (to keep)?"},[{"he": "שמרי", "ar": "שמרי", "ru": "שמרי", "en": "שמרי"}, {"he": "שמרו יחד", "ar": "שמרו יחד", "ru": "שמרו יחד", "en": "שמרו יחד"}, {"he": "שמור", "ar": "שמור", "ru": "שמור", "en": "שמור"}, {"he": "ישמור", "ar": "ישמור", "ru": "ישמור", "en": "ישמור"}],2,{"he": "התחילו מהעתיד \"תשמור\" וחשבו מה יורד ממנו.", "ar": "ابدأوا من المستقبل «תשמור» وفكّروا ماذا يُحذف منه.", "ru": "Начните с будущего «תשמור» и подумайте, что от него отпадает.", "en": "Start from the future \"תשמור\" and think what drops off."},{"he": "הציווי נבנה מהעתיד בלי ה־ת: \"תשמור\" הופך ל\"שמור\". לנקבה אומרים \"שמרי\", ולרבים \"שמרו\".", "ar": "يُبنى الأمر من المستقبل بلا ת: «תשמור» يصبح «שמור». وللمؤنث «שמרי» وللجمع «שמרו».", "ru": "Повеление строится от будущего без ת: «תשמור» становится «שמור». Женщине - «שמרי», многим - «שמרו».", "en": "The imperative is built from the future without ת: \"תשמור\" becomes \"שמור\". For a female \"שמרי\", for plural \"שמרו\"."},null,[{"he": "\"שמרי\" היא צורת ציווי לנקבה יחידה.", "ar": "«שמרי» صيغة أمر للمؤنث المفرد.", "ru": "«שמרי» - повелительная форма для женского рода.", "en": "\"שמרי\" is the imperative for one female."}, {"he": "\"שמרו\" היא צורת ציווי לרבים.", "ar": "«שמרו» صيغة أمر للجمع.", "ru": "«שמרו» - повелительная форма для мн. числа.", "en": "\"שמרו\" is the plural imperative."}, null, {"he": "\"ישמור\" הוא עתיד בגוף שלישי, ולא ציווי.", "ar": "«ישמור» مستقبل للغائب، وليس أمرًا.", "ru": "«ישמור» - будущее время 3-го лица, а не повеление.", "en": "\"ישמור\" is third person future, not an imperative."}]),
Q("vb-2-06",{"he": "מה שם הפועל של \"נפגש\" (בניין נפעל)?", "ar": "ما مصدر الفعل «נפגש» (التقى) في وزن נפעל؟", "ru": "Какой инфинитив у «נפגש» (встретился), биньян нифаль?", "en": "What is the infinitive of \"נפגש\" (met), binyan Nif’al?"},[{"he": "לפגוש", "ar": "לפגוש", "ru": "לפגוש", "en": "לפגוש"}, {"he": "לנפגש", "ar": "לנפגש", "ru": "לנפגש", "en": "לנפגש"}, {"he": "להפגיש בין חברים", "ar": "להפגיש בין חברים", "ru": "להפגיש בין חברים", "en": "להפגיש בין חברים"}, {"he": "להיפגש", "ar": "להיפגש", "ru": "להיפגש", "en": "להיפגש"}],3,{"he": "חשבו על \"נכנס\" ועל שם הפועל שלו.", "ar": "فكّروا في «נכנס» وفي مصدره.", "ru": "Вспомните «נכנס» и его инфинитив.", "en": "Think of \"נכנס\" and its infinitive."},{"he": "בשם הפועל של נפעל אין נ בהתחלה. במקומה באות האותיות להי. לכן \"נפגש\" הופך ל\"להיפגש\", כמו \"נכנס\" ו\"להיכנס\".", "ar": "في مصدر נפעל لا تأتي נ في البداية، بل تأتي להי. لذلك «נפגש» يصبح «להיפגש»، مثل «נכנס» و«להיכנס».", "ru": "В инфинитиве нифаль нет начальной נ. Вместо неё стоит להי. Поэтому «נפגש» - «להיפגש», как «נכנס» - «להיכנס».", "en": "The Nif’al infinitive has no initial נ. Instead it has להי. So \"נפגש\" becomes \"להיפגש\", like \"נכנס\" and \"להיכנס\"."},null,[{"he": "\"לפגוש\" הוא שם הפועל בבניין קל, ולא בנפעל.", "ar": "«לפגוש» مصدر وزن קל لا נפעל.", "ru": "«לפגוש» - инфинитив биньяна каль, а не нифаль.", "en": "\"לפגוש\" is the Kal infinitive, not Nif’al."}, {"he": "אין צורה כזו: בשם הפועל של נפעל ה־נ מתחלפת ב־הי.", "ar": "لا توجد هذه الصيغة: في مصدر נפעל تُستبدل נ بـ הי.", "ru": "Такой формы нет: в инфинитиве нифаль נ заменяется на הי.", "en": "No such form: in the Nif’al infinitive, נ is replaced by הי."}, {"he": "\"להפגיש\" הוא בבניין הפעיל, ופירושו לגרום לאחרים להיפגש.", "ar": "«להפגיש» من وزن הפעיל، ومعناه جعل الآخرين يلتقون.", "ru": "«להפגיש» - хифиль, это «свести других вместе».", "en": "\"להפגיש\" is Hif’il and means to bring others together."}, null]),

Q("ha-verb-3-1",{"he": "השורש של \"עמד\" הוא ע־מ־ד. לאיזו קבוצת שורשים הוא שייך?", "ar": "جذر «עמד» هو ע־מ־ד. إلى أي مجموعة جذور ينتمي؟", "ru": "Корень «עמד» - ע־מ־ד. К какой группе корней он относится?", "en": "The root of \"עמד\" is ע־מ־ד. Which root group does it belong to?"},[{"he": "נחי ע״ו", "ar": "الأجوفة (ع״و)", "ru": "корни со слабой средней (ע״ו)", "en": "hollow roots (middle-weak)"}, {"he": "נחי ל\"ה", "ar": "المعتلة باللام ה", "ru": "корни с конечной ה", "en": "roots ending in ה"}, {"he": "גרוניות", "ar": "الحلقية", "ru": "гортанные корни", "en": "guttural roots"}, {"he": "כפולים", "ar": "المضاعفة", "ru": "удвоенные корни", "en": "geminate roots"}],2,{"he": "בדקו את אותיות השורש והשוו אותן למאפיינים של קבוצות השורשים.", "ar": "افحصوا حروف الجذر وقارنوها بخصائص مجموعات الجذور.", "ru": "Проверьте буквы корня и сравните их с признаками групп корней.", "en": "Check the root letters against the defining features of root groups."},{"he": "האות ע היא אות גרונית, ולכן ע־מ־ד נמנה עם שורשים גרוניים. למשל גם שורש א־כ־ל מכיל אות גרונית.", "ar": "الحرف ע حرف حلقي، لذا الجذر ע־מ־ד من الجذور الحلقية. وكذلك الجذر א־כ־ל يحوي حرفًا حلقيًا.", "ru": "Буква ע гортанная, поэтому ע־מ־ד - гортанный корень. Корень א־כ־ל тоже содержит гортанную букву.", "en": "The letter ע is guttural, so ע־מ־ד is a guttural root. The root א־כ־ל also contains a guttural letter."},null,[{"he": "בשורש נח ע״ו האות האמצעית חלשה, למשל ק־ו־ם. בע־מ־ד כל שלוש האותיות נשמעות.", "ar": "في الجذر الأجوف الحرف الأوسط ضعيف، مثل ق־و־م. في ע־מ־ד تُسمع الأحرف الثلاثة كلها.", "ru": "В корне ע״ו средняя буква слабая, как в ק־ו־ם. В ע־מ־ד слышны все три буквы.", "en": "A hollow root has a weak middle letter, like ק־ו־ם. In ע־מ־ד all three letters are sounded."}, {"he": "שורש זה מסתיים בדל\"ת, לא בה\"א.", "ar": "ينتهي الجذر بحرف ד لا بحرف ה.", "ru": "Этот корень оканчивается на ד, а не на ה.", "en": "This root ends in ד, not ה."}, null, {"he": "שתי האותיות האחרונות בשורש שונות זו מזו.", "ar": "آخر حرفين من الجذر مختلفان.", "ru": "Последние две буквы корня различны.", "en": "The final two root letters are different."}]),
Q("ha-verb-3-2",{"he": "השלימו את המשפט: \"אתמול אני ___ את ההודעה למורה\".", "ar": "أكملوا الجملة: «אתמול אני ___ את ההודעה למורה».", "ru": "Дополните: «אתמול אני ___ את ההודעה למורה».", "en": "Complete: \"אתמול אני ___ את ההודעה למורה.\""},[{"he": "כתב", "ar": "כתב", "ru": "כתב", "en": "כתב"}, {"he": "כותב", "ar": "כותב", "ru": "כותב", "en": "כותב"}, {"he": "אכתוב", "ar": "אכתוב", "ru": "אכתוב", "en": "אכתוב"}, {"he": "כתבתי", "ar": "כתבתי", "ru": "כתבתי", "en": "כתבתי"}],3,{"he": "התאימו גם את הזמן וגם את הגוף למילים שכבר כתובות במשפט.", "ar": "طابقوا الزمن والضمير مع الكلمات الموجودة في الجملة.", "ru": "Согласуйте и время, и лицо с уже данными словами.", "en": "Match both tense and person to the words already in the sentence."},{"he": "\"אתמול\" מכוון לעבר, ו\"אני\" דורש גוף ראשון יחיד: \"כתבתי\". למשל: \"אתמול אני שלחתי מכתב\".", "ar": "«أمس» يدل على الماضي، و«أنا» تتطلب المتكلم المفرد: «כתבתי». مثلًا: «أرسلت رسالة أمس».", "ru": "«Вчера» указывает на прошлое, а «я» требует первого лица единственного числа: «כתבתי». Например: «Вчера я отправил(а) письмо».", "en": "\"Yesterday\" calls for past tense, and \"I\" for first-person singular: \"כתבתי\". For example: \"Yesterday I sent a letter.\""},null,[{"he": "צורה זו היא עבר של גוף שלישי יחיד, לא של \"אני\".", "ar": "هذه صيغة الماضي للغائب المفرد لا للمتكلم.", "ru": "Это прошедшее время третьего лица, не форма для «я».", "en": "That is third-person singular past, not the form for \"I\"."}, {"he": "זו צורת הווה ואינה מתאימה לציון הזמן.", "ar": "هذه صيغة المضارع ولا تناسب ظرف الزمن.", "ru": "Это настоящее время, оно не соответствует указанию времени.", "en": "That is present tense and does not match the time word."}, {"he": "זו צורת עתיד ואינה מתאימה לציון הזמן.", "ar": "هذه صيغة المستقبل ولا تناسب ظرف الزمن.", "ru": "Это будущее время, оно не соответствует указанию времени.", "en": "That is future tense and does not match the time word."}, null]),
Q("ha-verb-3-3",{"he": "השלימו: \"מחר אתם ___ ליד שער בית הספר\". השורש הוא ע־מ־ד.", "ar": "أكملوا: «מחר אתם ___ ליד שער בית הספר». الجذر ע־מ־ד.", "ru": "Дополните: «מחר אתם ___ ליד שער בית הספר». Корень ע־מ־ד.", "en": "Complete: \"מחר אתם ___ ליד שער בית הספר.\" The root is ע־מ־ד."},[{"he": "תעמדו", "ar": "תעמדו", "ru": "תעמדו", "en": "תעמדו"}, {"he": "יעמדו", "ar": "יעמדו", "ru": "יעמדו", "en": "יעמדו"}, {"he": "עמדתם", "ar": "עמדתם", "ru": "עמדתם", "en": "עמדתם"}, {"he": "עומדים", "ar": "עומדים", "ru": "עומדים", "en": "עומדים"}],0,{"he": "השוו בין גוף שני רבים לגוף שלישי רבים ובין עבר לעתיד.", "ar": "قارنوا بين المخاطبين والغائبين وبين الماضي والمستقبل.", "ru": "Сравните второе и третье лицо множественного числа, прошлое и будущее.", "en": "Compare second- and third-person plural, and past and future."},{"he": "\"תעמדו\" מתאים ל\"אתם\" ולעתיד. למשל: \"מחר אתם תעבדו יחד\" בנוי באותו גוף וזמן.", "ar": "«תעמדו» يوافق «أنتم» والمستقبل. مثلًا: «غدًا ستعملون معًا» بنفس الشخص والزمن.", "ru": "«תעמדו» согласуется с «אתם» и стоит в будущем времени. Например: «Завтра вы будете работать вместе» - то же лицо и время.", "en": "\"תעמדו\" agrees with \"אתם\" and is future tense. For example, \"Tomorrow you will work together\" has the same person and tense."},null,[null, {"he": "זו צורת עתיד של גוף שלישי רבים, המתאימה ל\"הם\".", "ar": "هذه صيغة المستقبل للغائب الجمع، وتوافق «هم».", "ru": "Это будущее время третьего лица множественного числа, для «они».", "en": "This is third-person plural future, matching \"they\"."}, {"he": "זו צורת עבר של גוף שני רבים.", "ar": "هذه صيغة الماضي للمخاطبين.", "ru": "Это прошедшее время второго лица множественного числа.", "en": "This is second-person plural past."}, {"he": "זו צורת הווה של רבים, לא עתיד.", "ar": "هذه صيغة المضارع للجمع لا المستقبل.", "ru": "Это настоящее время множественного числа, не будущее.", "en": "This is plural present, not future."}]),
Q("vb-3-01",{"he": "מה השורש של הפועל \"השתמש\"?", "ar": "ما جذر الفعل «השתמש» (استخدم)؟", "ru": "Каков корень глагола «השתמש» (использовал)?", "en": "What is the root of the verb \"השתמש\" (used)?"},[{"he": "ש־ת־מ", "ar": "ש־ת־מ", "ru": "ש־ת־מ", "en": "ש־ת־מ"}, {"he": "ת־מ־ש", "ar": "ת־מ־ש", "ru": "ת־מ־ש", "en": "ת־מ־ש"}, {"he": "ש־מ־ש", "ar": "ש־מ־ש", "ru": "ש־מ־ש", "en": "ש־מ־ש"}, {"he": "ה־ש־ת־מ (ארבע אותיות)", "ar": "ה־ש־ת־מ (أربعة حروف)", "ru": "ה־ש־ת־מ (четыре буквы)", "en": "ה־ש־ת־מ (four letters)"}],2,{"he": "בדקו מה קורה ל־ת של התפעל כשהשורש מתחיל ב־ש.", "ar": "افحصوا ماذا يحدث لـ ת في התפעל حين يبدأ الجذر بـ ש.", "ru": "Проверьте, что происходит с ת хитпаэль, если корень начинается с ש.", "en": "Check what happens to the Hitpa’el ת when the root starts with ש."},{"he": "בהתפעל, כשהשורש מתחיל ב־ש או ב־ס, ה־ת עוברת אחרי האות הראשונה. לכן \"השתמש\" בא מ־ש־מ־ש. כך גם \"הסתכל\" בא מ־ס־כ־ל.", "ar": "في התפעל، إذا بدأ الجذر بـ ש أو ס، تنتقل ת إلى ما بعد الحرف الأول. لذلك «השתמש» من ש־מ־ש، و«הסתכל» من ס־כ־ל.", "ru": "В хитпаэль, если корень начинается с ש или ס, ת переходит за первую букву. Поэтому «השתמש» - от ש־מ־ש, а «הסתכל» - от ס־כ־ל.", "en": "In Hitpa’el, when the root starts with ש or ס, the ת moves after the first letter. So \"השתמש\" is from ש־מ־ש, and \"הסתכל\" from ס־כ־ל."},null,[{"he": "ה־ת שייכת לבניין ולא לשורש.", "ar": "حرف ת جزء من الوزن لا من الجذر.", "ru": "Буква ת принадлежит биньяну, а не корню.", "en": "The ת belongs to the binyan, not to the root."}, {"he": "ה־ת אינה מהשורש, וה־ש הראשונה כן.", "ar": "حرف ת ليس من الجذر، أما ש الأولى فمنه.", "ru": "ת не входит в корень, а первая ש входит.", "en": "The ת is not part of the root, but the first ש is."}, null, {"he": "ה ו־ת הן אותיות הבניין, ולא אותיות השורש.", "ar": "ה و ת من حروف الوزن لا من حروف الجذر.", "ru": "ה и ת - буквы биньяна, а не корня.", "en": "ה and ת are binyan letters, not root letters."}]),
Q("vb-3-02",{"he": "השלימו בסביל: \"ההודעה ___ לכל התלמידים אתמול\". השורש הוא ע־ב־ר.", "ar": "أكملوا بالمبني للمجهول: «ההודעה ___ לכל התלמידים אתמול» (الرسالة ___ لكل الطلاب أمس). الجذر ע־ב־ר.", "ru": "Дополните пассивом: «ההודעה ___ לכל התלמידים אתמול» (сообщение ___ всем ученикам вчера). Корень ע־ב־ר.", "en": "Complete in the passive: \"ההודעה ___ לכל התלמידים אתמול\" (the message ___ to all students yesterday). The root is ע־ב־ר."},[{"he": "הועבר", "ar": "הועבר", "ru": "הועבר", "en": "הועבר"}, {"he": "העבירה", "ar": "העבירה", "ru": "העבירה", "en": "העבירה"}, {"he": "תועבר מחר בבוקר", "ar": "תועבר מחר בבוקר", "ru": "תועבר מחר בבוקר", "en": "תועבר מחר בבוקר"}, {"he": "הועברה", "ar": "הועברה", "ru": "הועברה", "en": "הועברה"}],3,{"he": "בדקו שלושה דברים: סביל או פעיל, זמן, ומין הנושא.", "ar": "افحصوا ثلاثة أمور: المجهول أو المعلوم، الزمن، وجنس الفاعل.", "ru": "Проверьте три вещи: пассив или актив, время и род подлежащего.", "en": "Check three things: passive or active, tense, and the subject’s gender."},{"he": "\"העביר\" הוא בבניין הפעיל, והסביל שלו בהופעל: \"הועבר\". הנושא \"ההודעה\" הוא נקבה, ו\"אתמול\" מצביע על עבר. לכן \"הועברה\".", "ar": "«העביר» في وزن הפעיל، ومجهوله في הופעל: «הועבר». الفاعل «ההודעה» مؤنث، و«אתמול» يدل على الماضي. لذلك «הועברה».", "ru": "«העביר» - хифиль, его пассив в хуфаль: «הועבר». Подлежащее «ההודעה» женского рода, «אתמול» - прошлое. Поэтому «הועברה».", "en": "\"העביר\" is Hif’il; its passive is Huf’al: \"הועבר\". The subject \"ההודעה\" is feminine, and \"yesterday\" means past. So \"הועברה\"."},null,[{"he": "\"הודעה\" היא נקבה, ו\"הועבר\" היא צורת זכר.", "ar": "«הודעה» مؤنث، و«הועבר» صيغة مذكر.", "ru": "«הודעה» - женский род, а «הועבר» - мужской.", "en": "\"הודעה\" is feminine, but \"הועבר\" is masculine."}, {"he": "\"העבירה\" היא צורה פעילה, וההודעה לא העבירה דבר.", "ar": "«העבירה» مبني للمعلوم، والرسالة لم تنقل شيئًا.", "ru": "«העבירה» - активная форма, а сообщение само ничего не передавало.", "en": "\"העבירה\" is active, and the message did not pass anything on."}, {"he": "\"תועבר\" היא עתיד, והמשפט מסתיים ב\"אתמול\".", "ar": "«תועבר» مستقبل، والجملة تنتهي بـ «אתמול».", "ru": "«תועבר» - будущее время, а во фразе стоит «אתמול».", "en": "\"תועבר\" is future, but the sentence says \"yesterday\"."}, null]),
Q("vb-3-03",{"he": "באיזו קבוצה כל הפעלים שייכים לאותו בניין?", "ar": "في أي مجموعة تنتمي كل الأفعال إلى الوزن نفسه؟", "ru": "В какой группе все глаголы относятся к одному биньяну?", "en": "In which group do all the verbs belong to the same binyan?"},[{"he": "דיבר, סיפר, לימד", "ar": "דיבר, סיפר, לימד", "ru": "דיבר, סיפר, לימד", "en": "דיבר, סיפר, לימד"}, {"he": "נכנס, נפל, נשאר", "ar": "נכנס, נפל, נשאר", "ru": "נכנס, נפל, נשאר", "en": "נכנס, נפל, נשאר"}, {"he": "הדליק, הלך, הרגיש, הזמין", "ar": "הדליק, הלך, הרגיש, הזמין", "ru": "הדליק, הלך, הרגיש, הזמין", "en": "הדליק, הלך, הרגיש, הזמין"}, {"he": "התלבש, התחיל, התרחץ", "ar": "התלבש, התחיל, התרחץ", "ru": "התלבש, התחיל, התרחץ", "en": "התלבש, התחיל, התרחץ"}],0,{"he": "אל תסתפקו באות הראשונה. מצאו את השורש של כל פועל.", "ar": "لا تكتفوا بالحرف الأول. جدوا جذر كل فعل.", "ru": "Не ограничивайтесь первой буквой. Найдите корень каждого глагола.", "en": "Do not rely on the first letter. Find the root of each verb."},{"he": "\"דיבר\", \"סיפר\" ו\"לימד\" בנויים כולם בדגם פיעל. בשאר הקבוצות יש פועל שאות השורש שלו נראית כמו אות בניין, כמו \"נפל\" ו\"הלך\".", "ar": "«דיבר» و«סיפר» و«לימד» كلها على وزن פיעל. في المجموعات الأخرى فعل حرف جذره يشبه حرف الوزن، مثل «נפל» و«הלך».", "ru": "«דיבר», «סיפר» и «לימד» построены по модели пиэль. В других группах есть глагол, где буква корня похожа на букву биньяна, как «נפל» и «הלך».", "en": "\"דיבר\", \"סיפר\" and \"לימד\" all follow Pi’el. Each other group has a verb whose root letter looks like a binyan letter, like \"נפל\" and \"הלך\"."},null,[null, {"he": "\"נפל\" שייך לבניין קל: ה־נ היא חלק מהשורש נ־פ־ל.", "ar": "«נפל» من وزن קל: حرف נ جزء من الجذر נ־פ־ל.", "ru": "«נפל» - биньян каль: נ входит в корень נ־פ־ל.", "en": "\"נפל\" is Kal: the נ is part of the root נ־פ־ל."}, {"he": "\"הלך\" שייך לבניין קל: ה־ה היא חלק מהשורש ה־ל־ך.", "ar": "«הלך» من وزن קל: حرف ה جزء من الجذر ה־ל־ך.", "ru": "«הלך» - биньян каль: ה входит в корень ה־ל־ך.", "en": "\"הלך\" is Kal: the ה is part of the root ה־ל־ך."}, {"he": "\"התחיל\" שייך להפעיל: השורש הוא ת־ח־ל.", "ar": "«התחיל» من وزن הפעיל: جذره ת־ח־ל.", "ru": "«התחיל» - хифиль: корень ת־ח־ל.", "en": "\"התחיל\" is Hif’il: its root is ת־ח־ל."}]),
Q("vb-3-04",{"he": "מה השורש של \"יפול\" במשפט \"הספר יפול מהמדף\"?", "ar": "ما جذر «יפול» في الجملة «הספר יפול מהמדף» (سيسقط الكتاب عن الرف)؟", "ru": "Каков корень «יפול» в предложении «הספר יפול מהמדף» (книга упадёт с полки)?", "en": "What is the root of \"יפול\" in \"הספר יפול מהמדף\" (the book will fall off the shelf)?"},[{"he": "י־פ־ל, כמו י־ש־ב", "ar": "י־פ־ל, כמו י־ש־ב", "ru": "י־פ־ל, כמו י־ש־ב", "en": "י־פ־ל, כמו י־ש־ב"}, {"he": "נ־פ־ל", "ar": "נ־פ־ל", "ru": "נ־פ־ל", "en": "נ־פ־ל"}, {"he": "פ־ו־ל", "ar": "פ־ו־ל", "ru": "פ־ו־ל", "en": "פ־ו־ל"}, {"he": "פ־ל־ל", "ar": "פ־ל־ל", "ru": "פ־ל־ל", "en": "פ־ל־ל"}],1,{"he": "חשבו איך אומרים את הפועל הזה בעבר.", "ar": "فكّروا كيف يُقال هذا الفعل في الماضي.", "ru": "Подумайте, как этот глагол звучит в прошедшем времени.", "en": "Think how this verb sounds in the past tense."},{"he": "בעבר אומרים \"נפל\", ולכן השורש הוא נ־פ־ל. בעתיד ה־נ נופלת: \"יפול\" ולא \"ינפול\". זו גזרת חסרי פ\"נ.", "ar": "في الماضي نقول «נפל»، فالجذر נ־פ־ל. في المستقبل تسقط נ: «יפול» لا «ינפול». هذه مجموعة الناقص الفاء נ.", "ru": "В прошедшем - «נפל», значит корень נ־פ־ל. В будущем נ выпадает: «יפול», а не «ינפול». Это группа с выпадающей начальной נ.", "en": "The past is \"נפל\", so the root is נ־פ־ל. In the future the נ drops: \"יפול\", not \"ינפול\". This is the initial-נ root group."},null,[{"he": "ה־י היא סימן העתיד בגוף שלישי, ולא אות שורש.", "ar": "حرف י علامة المستقبل للغائب، لا حرف جذر.", "ru": "י - признак будущего времени 3-го лица, а не буква корня.", "en": "The י marks third person future; it is not a root letter."}, null, {"he": "ה־ו כאן היא תנועה, ולא אות שורש.", "ar": "حرف ו هنا حركة لا حرف جذر.", "ru": "ו здесь - гласная, а не буква корня.", "en": "The ו here is a vowel, not a root letter."}, {"he": "אין בשורש אות כפולה, והצורה בעבר היא \"נפל\".", "ar": "لا يوجد حرف مضعّف في الجذر، والماضي هو «נפל».", "ru": "В корне нет удвоенной буквы, прошедшее - «נפל».", "en": "The root has no doubled letter; the past is \"נפל\"."}]),
Q("vb-3-05",{"he": "מה צורת העבר של \"לבנות\" בגוף ראשון יחיד (אני)?", "ar": "ما صيغة الماضي من «לבנות» (يبني) للمتكلم المفرد (أنا)؟", "ru": "Какая форма прошедшего времени от «לבנות» (строить) для 1-го лица ед. числа (я)?", "en": "What is the past tense of \"לבנות\" (to build) for first person singular (I)?"},[{"he": "בנהתי", "ar": "בנהתי", "ru": "בנהתי", "en": "בנהתי"}, {"he": "בנינו", "ar": "בנינו", "ru": "בנינו", "en": "בנינו"}, {"he": "בניתי", "ar": "בניתי", "ru": "בניתי", "en": "בניתי"}, {"he": "אבנה בקרוב", "ar": "אבנה בקרוב", "ru": "אבנה בקרוב", "en": "אבנה בקרוב"}],2,{"he": "השורש הוא ב־נ־ה. חשבו על \"קניתי\" מהשורש ק־נ־ה.", "ar": "الجذر ב־נ־ה. فكّروا في «קניתי» من الجذر ק־נ־ה.", "ru": "Корень ב־נ־ה. Вспомните «קניתי» от корня ק־נ־ה.", "en": "The root is ב־נ־ה. Think of \"קניתי\" from the root ק־נ־ה."},{"he": "בשורשי ל\"ה, לפני סיומת כמו ־תי, ה־ה מתחלפת ב־י. לכן \"בנה\" הופך ל\"בניתי\", כמו \"קנה\" ו\"קניתי\".", "ar": "في جذور ל\"ה، قبل لاحقة مثل ־תי، تُستبدل ה بـ י. لذلك «בנה» يصبح «בניתי»، مثل «קנה» و«קניתי».", "ru": "В корнях ל\"ה перед окончанием вроде ־תי буква ה заменяется на י. Поэтому «בנה» - «בניתי», как «קנה» - «קניתי».", "en": "In ל\"ה roots, before an ending like ־תי, the ה becomes י. So \"בנה\" becomes \"בניתי\", like \"קנה\" and \"קניתי\"."},null,[{"he": "בשורש ל\"ה ה־ה לא נשארת לפני סיומת הגוף.", "ar": "في جذر ל\"ה لا تبقى ה قبل لاحقة الضمير.", "ru": "В корнях ל\"ה буква ה не сохраняется перед окончанием лица.", "en": "In ל\"ה roots the ה does not stay before the person ending."}, {"he": "\"בנינו\" מתאים לגוף \"אנחנו\", ולא ל\"אני\".", "ar": "«בנינו» يناسب «نحن» لا «أنا».", "ru": "«בנינו» подходит к «мы», а не к «я».", "en": "\"בנינו\" fits \"we\", not \"I\"."}, null, {"he": "\"אבנה\" היא צורת עתיד, והשאלה שואלת על עבר.", "ar": "«אבנה» صيغة مستقبل، والسؤال عن الماضي.", "ru": "«אבנה» - будущее время, а вопрос о прошедшем.", "en": "\"אבנה\" is future, but the question asks for the past."}]),
Q("vb-3-06",{"he": "מה נכון לגבי הפועל במשפט \"הספרים סודרו על המדף\"?", "ar": "ما الصحيح بشأن الفعل في الجملة «הספרים סודרו על המדף» (رُتّبت الكتب على الرف)؟", "ru": "Что верно о глаголе в предложении «הספרים סודרו על המדף» (книги были расставлены на полке)?", "en": "What is true about the verb in \"הספרים סודרו על המדף\" (the books were arranged on the shelf)?"},[{"he": "פועל פעיל בבניין פיעל", "ar": "فعل مبني للمعلوم في وزن פיעל", "ru": "активный глагол в биньяне пиэль", "en": "an active verb in Pi’el"}, {"he": "פועל סביל בבניין נפעל", "ar": "فعل مبني للمجهول في وزن נפעל", "ru": "пассивный глагол в биньяне нифаль", "en": "a passive verb in Nif’al"}, {"he": "פועל פעיל בבניין התפעל, כי זו פעולה חוזרת", "ar": "فعل مبني للمعلوم في وزن התפעל لأنه فعل منعكس", "ru": "активный глагол хитпаэль, потому что действие возвратное", "en": "an active Hitpa’el verb, because the action is reflexive"}, {"he": "פועל סביל בבניין פועל", "ar": "فعل مبني للمجهول في وزن פועל", "ru": "пассивный глагол в биньяне пуаль", "en": "a passive verb in Pu’al"}],3,{"he": "שאלו: האם הספרים עשו את הפעולה, או שמישהו עשה אותה להם?", "ar": "اسألوا: هل قامت الكتب بالفعل، أم قام به أحد عليها؟", "ru": "Спросите: книги сами сделали действие или его сделали с ними?", "en": "Ask: did the books do the action, or did someone do it to them?"},{"he": "הספרים לא עשו את הפעולה. מישהו סידר אותם, ולכן הפועל סביל. \"סודרו\" הוא הסביל של \"סידרו\", בבניין פועל.", "ar": "الكتب لم تقم بالفعل، بل رتّبها أحد، فالفعل مبني للمجهول. «סודרו» مجهول «סידרו» في وزن פועל.", "ru": "Книги ничего не делали: их кто-то расставил, поэтому глагол пассивный. «סודרו» - пассив от «סידרו», биньян пуаль.", "en": "The books did not act; someone arranged them, so the verb is passive. \"סודרו\" is the passive of \"סידרו\", in Pu’al."},null,[{"he": "בפיעל היה כתוב \"סידרו\", והספרים לא סידרו דבר.", "ar": "في פיעל نقول «סידרו»، والكتب لم ترتّب شيئًا.", "ru": "В пиэль было бы «סידרו», а книги ничего не расставляли.", "en": "Pi’el would be \"סידרו\", and the books did not arrange anything."}, {"he": "בפועל אין נ בהתחלה, ולכן הוא לא בנפעל.", "ar": "لا توجد נ في بداية الفعل، فهو ليس من נפעל.", "ru": "У глагола нет начальной נ, значит это не нифаль.", "en": "The verb has no initial נ, so it is not Nif’al."}, {"he": "אין בפועל הת, והספרים לא סידרו את עצמם.", "ar": "لا توجد הת في الفعل، والكتب لم ترتّب نفسها.", "ru": "В глаголе нет הת, и книги не расставляли себя сами.", "en": "The verb has no הת, and the books did not arrange themselves."}, null]),
],
