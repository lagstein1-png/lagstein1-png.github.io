  [
   Q("ha-read-3-1",{"he": "קראו את הקטע וענו על השאלה.<br>קוראים כותבים: בכל בוקר אני ממתין כתשעים דקות לאוטובוס שאמור להגיע כל עשרים דקות. החברה מפרסמת לוחות זמנים מסודרים, אבל המציאות רחוקה מהם. אם רוצים שאנשים ישאירו את המכונית בבית, חייבים קודם לתת להם תחבורה ציבורית שאפשר לסמוך עליה.<br>מהי טענתו המרכזית של הכותב?", "ar": "اقرأوا القطعة وأجيبوا عن السؤال.<br>قرّاء يكتبون: في كل صباح أنتظر نحو تسعين دقيقة حافلة يُفترض أن تصل كل عشرين دقيقة. الشركة تنشر جداول مواعيد مرتبة، لكن الواقع بعيد عنها. إذا أردنا أن يترك الناس السيارة في البيت، علينا أولًا أن نعطيهم مواصلات عامة يمكن الاعتماد عليها.<br>ما حجة الكاتب المركزية؟", "ru": "Прочитайте отрывок и ответьте на вопрос.<br>Читатели пишут: каждое утро я жду около девяноста минут автобус, который должен приходить каждые двадцать минут. Компания публикует аккуратные расписания, но реальность далека от них. Если хотят, чтобы люди оставили машину дома, нужно сначала дать им общественный транспорт, на который можно положиться.<br>Каков главный тезис автора?", "en": "Read the passage and answer the question.<br>Readers write: every morning I wait about ninety minutes for a bus that is supposed to come every twenty minutes. The company publishes orderly timetables, but reality is far from them. If we want people to leave the car at home, we must first give them public transport they can rely on.<br>What is the writer's main claim?"},[{"he": "לוחות הזמנים בתחנות צריכים עיצוב ברור יותר", "ar": "جداول المواعيد في المحطات تحتاج تصميمًا أوضح", "ru": "расписаниям на остановках нужен более ясный дизайн", "en": "the stop timetables need a clearer design"}, {"he": "מחירי הנסיעה גבוהים מדי", "ar": "أسعار السفر مرتفعة جدًا", "ru": "цены на проезд слишком высоки", "en": "fares are too high"}, {"he": "אנשים יעזבו את המכונית רק עם תחבורה אמינה", "ar": "الناس سيتركون السيارة فقط مع مواصلات يمكن الاعتماد عليها", "ru": "люди оставят машину только с надёжным транспортом", "en": "people will leave the car only with reliable transport"}, {"he": "יש להוסיף נהגים חדשים לחברה", "ar": "يجب إضافة سائقين جدد للشركة", "ru": "компании нужно нанять новых водителей", "en": "the company must hire new drivers"}],2,{"he": "הטענה המרכזית מופיעה במשפט התנאי שבסוף הקטע.", "ar": "الحجة المركزية تظهر في جملة الشرط في نهاية القطعة.", "ru": "Главный тезис находится в условном предложении в конце текста.", "en": "The main claim appears in the conditional sentence at the end of the passage."},{"he": "המשפט אם רוצים שאנשים ישאירו את המכונית בבית, חייבים קודם... מציב תנאי: קודם תחבורה אמינה, ורק אז אנשים יוותרו על המכונית. זו הטענה. שאר המשפטים מביאים דוגמה מהחיים שמחזקת אותה.", "ar": "جملة إذا أردنا أن يترك الناس السيارة في البيت، علينا أولًا... تضع شرطًا: أولًا مواصلات يمكن الاعتماد عليها، وبعدها فقط سيستغني الناس عن السيارة. هذه هي الحجة. باقي الجمل تقدم مثالًا من الحياة يدعمها.", "ru": "Предложение если хотят, чтобы люди оставили машину дома, нужно сначала... ставит условие: сначала надёжный транспорт, и только тогда люди откажутся от машины. Это и есть тезис. Остальные предложения приводят жизненный пример, который его поддерживает.", "en": "The sentence if we want people to leave the car at home, we must first... sets a condition: reliable transport first, and only then will people give up the car. That is the claim. The other sentences give a life example that supports it."},null,[{"he": "עיצוב הלוחות אינו הטענה; הבעיה היא שהאוטובוסים לא מגיעים בזמן.", "ar": "تصميم الجداول ليس الحجة؛ المشكلة أن الحافلات لا تصل في وقتها.", "ru": "Дизайн расписаний не тезис; проблема в том, что автобусы не приходят вовремя.", "en": "The timetable design is not the claim; the problem is buses not arriving on time."}, {"he": "מחירים אינם מוזכרים בקטע.", "ar": "الأسعار غير مذكورة في القطعة.", "ru": "Цены в тексте не упоминаются.", "en": "Prices are not mentioned in the passage."}, null, {"he": "נהגים אינם מוזכרים בקטע.", "ar": "السائقون غير مذكورين في القطعة.", "ru": "Водители в тексте не упоминаются.", "en": "Drivers are not mentioned in the passage."}]),
   Q("ha-read-3-2",{"he": "קראו את הקטע וענו על השאלה.<br>קוראים כותבים: בכל בוקר אני ממתין כתשעים דקות לאוטובוס שאמור להגיע כל עשרים דקות. החברה מפרסמת לוחות זמנים מסודרים, אבל המציאות רחוקה מהם. אם רוצים שאנשים ישאירו את המכונית בבית, חייבים קודם לתת להם תחבורה ציבורית שאפשר לסמוך עליה.<br>מה משמעות הדברים המציאות רחוקה מהם?", "ar": "اقرأوا القطعة وأجيبوا عن السؤال.<br>قرّاء يكتبون: في كل صباح أنتظر نحو تسعين دقيقة حافلة يُفترض أن تصل كل عشرين دقيقة. الشركة تنشر جداول مواعيد مرتبة، لكن الواقع بعيد عنها. إذا أردنا أن يترك الناس السيارة في البيت، علينا أولًا أن نعطيهم مواصلات عامة يمكن الاعتماد عليها.<br>ما معنى عبارة الواقع بعيد عنها؟", "ru": "Прочитайте отрывок и ответьте на вопрос.<br>Читатели пишут: каждое утро я жду около девяноста минут автобус, который должен приходить каждые двадцать минут. Компания публикует аккуратные расписания, но реальность далека от них. Если хотят, чтобы люди оставили машину дома, нужно сначала дать им общественный транспорт, на который можно положиться.<br>Что означает выражение реальность далека от них?", "en": "Read the passage and answer the question.<br>Readers write: every morning I wait about ninety minutes for a bus that is supposed to come every twenty minutes. The company publishes orderly timetables, but reality is far from them. If we want people to leave the car at home, we must first give them public transport they can rely on.<br>What does the phrase reality is far from them mean?"},[{"he": "האוטובוסים אינם מגיעים בזמן", "ar": "الحافلات لا تصل في المواعيد", "ru": "автобусы не приходят вовремя", "en": "the buses do not arrive on time"}, {"he": "התחנות בעיר רחוקות מאוד זו מזו", "ar": "محطات المدينة بعيدة جدًا بعضها عن بعض", "ru": "остановки в городе очень далеки друг от друга", "en": "the city stops are very far apart"}, {"he": "הלוחות תלויים גבוה מדי", "ar": "الجداول معلقة عاليًا جدًا", "ru": "расписания висят слишком высоко", "en": "the timetables hang too high"}, {"he": "הנסיעות ארוכות מדי", "ar": "الرحلات طويلة جدًا", "ru": "поездки слишком длинные", "en": "the rides are too long"}],0,{"he": "קראו שוב את המשפט שמתאר את ההמתנה בבוקר.", "ar": "أعيدوا قراءة الجملة التي تصف الانتظار في الصباح.", "ru": "Перечитайте предложение, описывающее утреннее ожидание.", "en": "Reread the sentence describing the morning wait."},{"he": "הכותב ממתין תשעים דקות לאוטובוס שאמור להגיע כל עשרים דקות. מכאן שהמציאות, כלומר זמני ההגעה בפועל, רחוקה מהלוחות המפורסמים. זו דוגמה לסתירה בין נאמר לנעשה.", "ar": "الكاتب ينتظر تسعين دقيقة حافلة يُفترض أن تصل كل عشرين دقيقة. من هنا أن الواقع، أي مواعيد الوصول الفعلية، بعيد عن الجداول المنشورة. هذا مثال على تناقض بين القول والفعل.", "ru": "Автор ждёт девяносто минут автобус, который должен приходить каждые двадцать. Значит, реальность, то есть фактическое время прихода, далека от опубликованных расписаний. Это пример противоречия между словом и делом.", "en": "The writer waits ninety minutes for a bus that should come every twenty. Hence reality, meaning actual arrival times, is far from the published timetables. This is an example of a gap between word and deed."},null,[null, {"he": "מרחק התחנות אינו מוזכר בקטע.", "ar": "بعد المحطات غير مذكور في القطعة.", "ru": "Расстояние между остановками в тексте не упоминается.", "en": "The distance between stops is not mentioned."}, {"he": "גובה התלייה אינו מוזכר; הנושא הוא דיוק הזמנים.", "ar": "ارتفاع التعليق غير مذكور؛ الموضوع هو دقة المواعيد.", "ru": "Высота подвешивания не упоминается; речь о точности времени.", "en": "Hanging height is not mentioned; the issue is time accuracy."}, {"he": "אורך הנסיעה אינו הנושא; ההמתנה היא הבעיה.", "ar": "طول الرحلة ليس الموضوع؛ الانتظار هو المشكلة.", "ru": "Длительность поездки не тема; проблема в ожидании.", "en": "Ride length is not the issue; the waiting is the problem."}]),
   Q("ha-read-3-3",{"he": "קראו את הקטע וענו על השאלה.<br>קוראים כותבים: בכל בוקר אני ממתין כתשעים דקות לאוטובוס שאמור להגיע כל עשרים דקות. החברה מפרסמת לוחות זמנים מסודרים, אבל המציאות רחוקה מהם. אם רוצים שאנשים ישאירו את המכונית בבית, חייבים קודם לתת להם תחבורה ציבורית שאפשר לסמוך עליה.<br>מה תפקיד המילה קודם במשפט האחרון?", "ar": "اقرأوا القطعة وأجيبوا عن السؤال.<br>قرّاء يكتبون: في كل صباح أنتظر نحو تسعين دقيقة حافلة يُفترض أن تصل كل عشرين دقيقة. الشركة تنشر جداول مواعيد مرتبة، لكن الواقع بعيد عنها. إذا أردنا أن يترك الناس السيارة في البيت، علينا أولًا أن نعطيهم مواصلات عامة يمكن الاعتماد عليها.<br>ما وظيفة كلمة أولًا في الجملة الأخيرة؟", "ru": "Прочитайте отрывок и ответьте на вопрос.<br>Читатели пишут: каждое утро я жду около девяноста минут автобус, который должен приходить каждые двадцать минут. Компания публикует аккуратные расписания, но реальность далека от них. Если хотят, чтобы люди оставили машину дома, нужно сначала дать им общественный транспорт, на который можно положиться.<br>Какова роль слова сначала в последнем предложении?", "en": "Read the passage and answer the question.<br>Readers write: every morning I wait about ninety minutes for a bus that is supposed to come every twenty minutes. The company publishes orderly timetables, but reality is far from them. If we want people to leave the car at home, we must first give them public transport they can rely on.<br>What is the role of the word first in the last sentence?"},[{"he": "מציינת שהאירוע כבר התרחש בעבר", "ar": "تدل على أن الحدث وقع في الماضي", "ru": "указывает, что событие уже произошло в прошлом", "en": "marks that the event already happened in the past"}, {"he": "מחברת בין שני אירועים המתרחשים במקביל", "ar": "تربط بين حدثين يقعان في آن واحد", "ru": "связывает два события, происходящих одновременно", "en": "connects two events happening at the same time"}, {"he": "מסמנת סיבה שכבר אינה בתוקף", "ar": "تشير إلى سبب لم يعد ساريًا", "ru": "обозначает причину, которая уже не действует", "en": "marks a reason that is no longer valid"}, {"he": "מציינת תנאי שצריך להתקיים לפני התוצאה", "ar": "تدل على شرط يجب تحققه قبل النتيجة", "ru": "указывает на условие, которое должно выполниться до результата", "en": "marks a condition that must be met before the result"}],3,{"he": "חפשו מה חייב לקרות לפני שאנשים משנים את התנהגותם.", "ar": "ابحثوا عما يجب أن يحدث قبل أن يغيّر الناس سلوكهم.", "ru": "Найдите, что должно произойти до того, как люди изменят поведение.", "en": "Look for what must happen before people change their behavior."},{"he": "המילה קודם במשפט חייבים קודם לתת להם תחבורה... קושרת בין תנאי לתוצאה: קודם נותנים תחבורה אמינה, ורק אחר כך אפשר לצפות שאנשים ישאירו את המכונית. מבנה זה מופיע גם במשפטים כמו קודם לומדים, אחר כך ניגשים לבחינה.", "ar": "كلمة أولًا في جملة علينا أولًا أن نعطيهم مواصلات... تربط بين شرط ونتيجة: أولًا نعطي مواصلات يمكن الاعتماد عليها، وبعدها فقط يمكن توقع أن يترك الناس السيارة. هذا البناء يظهر أيضًا في جمل مثل أولًا نتعلم، ثم نتقدم للامتحان.", "ru": "Слово сначала в предложении нужно сначала дать им транспорт... связывает условие и результат: сначала даём надёжный транспорт, и только потом можно ожидать, что люди оставят машину. Такая конструкция встречается и в предложениях вроде сначала учимся, потом сдаём экзамен.", "en": "The word first in the sentence we must first give them transport... links a condition to a result: first we provide reliable transport, and only then can we expect people to leave the car. This structure also appears in sentences like first we study, then we take the exam."},null,[{"he": "הכותב מדבר על העתיד הרצוי, לא על אירוע שהתרחש.", "ar": "الكاتب يتحدث عن المستقبل المرغوب، لا عن حدث وقع.", "ru": "Автор говорит о желаемом будущем, а не о произошедшем событии.", "en": "The writer speaks about a desired future, not a past event."}, {"he": "האירועים אינם במקביל: האחד קודם לשני.", "ar": "الحدثان ليسا متزامنين: أحدهما يسبق الآخر.", "ru": "События не одновременны: одно предшествует другому.", "en": "The events are not simultaneous: one precedes the other."}, {"he": "הסיבה דווקא בתוקף; היא התנאי לשינוי.", "ar": "السبب ما زال ساريًا؛ فهو شرط التغيير.", "ru": "Причина как раз действует; она и есть условие изменения.", "en": "The reason is very much in force; it is the condition for change."}, null]),
   Q("rd-3-01",{"he": "קראו את הקטע וענו על השאלה.<br>יש בתי ספר שאסרו על התלמידים להשתמש בטלפון בהפסקות. התומכים בהחלטה אומרים שבזכותה התלמידים משחקים יותר בחצר ומדברים יותר זה עם זה. המתנגדים טוענים שהטלפון הוא כלי חשוב, ושצריך ללמוד להשתמש בו בתבונה. לדעתי, איסור מלא אינו הפתרון. עדיף ללמד את התלמידים מתי להניח את הטלפון בצד, כי את ההרגל הזה הם ייקחו איתם גם אל מחוץ לבית הספר.<br>מהי עמדת הכותב?", "ar": "اقرأوا القطعة وأجيبوا عن السؤال.<br>هناك مدارس منعت الطلاب من استخدام الهاتف في الاستراحات. المؤيدون للقرار يقولون إن الطلاب بفضله يلعبون أكثر في الساحة ويتحدّثون أكثر بعضهم مع بعض. المعارضون يدّعون أن الهاتف أداة مهمة، وأنه يجب تعلّم استخدامه بحكمة. برأيي، المنع الكامل ليس هو الحل. الأفضل أن نعلّم الطلاب متى يضعون الهاتف جانبًا، لأنهم سيأخذون هذه العادة معهم أيضًا إلى خارج المدرسة.<br>ما موقف الكاتب؟", "ru": "Прочитайте отрывок и ответьте на вопрос.<br>Некоторые школы запретили ученикам пользоваться телефоном на переменах. Сторонники решения говорят, что благодаря ему ученики больше играют во дворе и больше разговаривают друг с другом. Противники утверждают, что телефон - важный инструмент и нужно учиться пользоваться им разумно. По-моему, полный запрет - не решение. Лучше учить учеников, когда откладывать телефон, потому что эту привычку они возьмут с собой и за пределы школы.<br>Какова позиция автора?", "en": "Read the passage and answer the question.<br>Some schools have banned students from using phones during breaks. Supporters of the decision say that because of it students play more in the yard and talk to each other more. Opponents argue that the phone is an important tool and that students must learn to use it wisely. In my opinion, a total ban is not the solution. It is better to teach students when to put the phone aside, because they will take this habit with them outside school too.<br>What is the writer's position?"},[{"he": "יש לאסור את הטלפון בכל שעות היום בבית הספר", "ar": "يجب منع الهاتف منعًا تامًا في كل ساعات اليوم في المدرسة", "ru": "телефон надо запретить в школе на весь день", "en": "phones should be banned at school all day long"}, {"he": "עדיף ללמד שימוש נבון מאשר לאסור לגמרי", "ar": "الأفضل تعليم الاستخدام الحكيم بدل المنع الكامل", "ru": "лучше учить разумному использованию", "en": "teaching wise use is better than a total ban"}, {"he": "הטלפון אינו מפריע לתלמידים בכלל", "ar": "الهاتف لا يزعج الطلاب أبدًا", "ru": "телефон вообще не мешает ученикам", "en": "the phone does not bother students at all"}, {"he": "אין לו דעה, והוא רק מציג את שני הצדדים", "ar": "ليس له رأي، وهو يعرض الطرفين فقط", "ru": "у него нет мнения, он лишь показывает обе стороны", "en": "he has no opinion of his own and only presents both sides"}],1,{"he": "חפשו את המשפט שבו הכותב מדבר על עצמו.", "ar": "ابحثوا عن الجملة التي يتحدّث فيها الكاتب عن نفسه.", "ru": "Найдите предложение, где автор говорит от себя.", "en": "Find the sentence where the writer speaks for himself."},{"he": "המילה לדעתי מסמנת את עמדת הכותב: איסור מלא אינו הפתרון. מיד אחר כך הוא מציע דרך אחרת: ללמד מתי להניח את הטלפון בצד.", "ar": "كلمة برأيي تدل على موقف الكاتب: المنع الكامل ليس هو الحل. وبعدها مباشرة يقترح طريقًا آخر: تعليم متى نضع الهاتف جانبًا.", "ru": "Слова «по-моему» показывают позицию автора: полный запрет - не решение. Сразу после этого он предлагает другой путь: учить, когда откладывать телефон.", "en": "The words in my opinion mark the writer's position: a total ban is not the solution. Right after that he suggests another way: teaching when to put the phone aside."},null,[{"he": "הכותב אומר במפורש שאיסור מלא אינו הפתרון.", "ar": "الكاتب يقول صراحة إن المنع الكامل ليس هو الحل.", "ru": "Автор прямо говорит, что полный запрет - не решение.", "en": "The writer says clearly that a total ban is not the solution."}, null, {"he": "הכותב אינו טוען זאת; הוא רוצה ללמד מתי להניח את הטלפון.", "ar": "الكاتب لا يدّعي ذلك؛ يريد تعليم متى نضع الهاتف جانبًا.", "ru": "Автор так не утверждает; он хочет учить, когда откладывать телефон.", "en": "The writer does not claim this; he wants to teach when to put the phone down."}, {"he": "הוא מציג את שני הצדדים, ואחר כך כותב את דעתו.", "ar": "هو يعرض الطرفين، ثم يكتب رأيه.", "ru": "Он показывает обе стороны, а потом пишет своё мнение.", "en": "He presents both sides and then writes his own opinion."}]),
   Q("rd-3-02",{"he": "קראו את הקטע וענו על השאלה.<br>יש בתי ספר שאסרו על התלמידים להשתמש בטלפון בהפסקות. התומכים בהחלטה אומרים שבזכותה התלמידים משחקים יותר בחצר ומדברים יותר זה עם זה. המתנגדים טוענים שהטלפון הוא כלי חשוב, ושצריך ללמוד להשתמש בו בתבונה. לדעתי, איסור מלא אינו הפתרון. עדיף ללמד את התלמידים מתי להניח את הטלפון בצד, כי את ההרגל הזה הם ייקחו איתם גם אל מחוץ לבית הספר.<br>מה עושה הכותב לפני שהוא מציג את דעתו?", "ar": "اقرأوا القطعة وأجيبوا عن السؤال.<br>هناك مدارس منعت الطلاب من استخدام الهاتف في الاستراحات. المؤيدون للقرار يقولون إن الطلاب بفضله يلعبون أكثر في الساحة ويتحدّثون أكثر بعضهم مع بعض. المعارضون يدّعون أن الهاتف أداة مهمة، وأنه يجب تعلّم استخدامه بحكمة. برأيي، المنع الكامل ليس هو الحل. الأفضل أن نعلّم الطلاب متى يضعون الهاتف جانبًا، لأنهم سيأخذون هذه العادة معهم أيضًا إلى خارج المدرسة.<br>ماذا يفعل الكاتب قبل أن يعرض رأيه؟", "ru": "Прочитайте отрывок и ответьте на вопрос.<br>Некоторые школы запретили ученикам пользоваться телефоном на переменах. Сторонники решения говорят, что благодаря ему ученики больше играют во дворе и больше разговаривают друг с другом. Противники утверждают, что телефон - важный инструмент и нужно учиться пользоваться им разумно. По-моему, полный запрет - не решение. Лучше учить учеников, когда откладывать телефон, потому что эту привычку они возьмут с собой и за пределы школы.<br>Что делает автор, прежде чем высказать своё мнение?", "en": "Read the passage and answer the question.<br>Some schools have banned students from using phones during breaks. Supporters of the decision say that because of it students play more in the yard and talk to each other more. Opponents argue that the phone is an important tool and that students must learn to use it wisely. In my opinion, a total ban is not the solution. It is better to teach students when to put the phone aside, because they will take this habit with them outside school too.<br>What does the writer do before presenting his opinion?"},[{"he": "מספר סיפור אישי מבית הספר שלו", "ar": "يروي قصة شخصية من مدرسته", "ru": "рассказывает личную историю из своей школы", "en": "tells a personal story from his school"}, {"he": "מביא נתונים ממחקר על טלפונים", "ar": "يقدّم معطيات من بحث عن الهواتف", "ru": "приводит данные исследования о телефонах", "en": "gives data from a study about phones"}, {"he": "מתאר את ההיסטוריה של הטלפון הנייד", "ar": "يصف تاريخ الهاتف المحمول", "ru": "описывает историю мобильного телефона", "en": "describes the history of the mobile phone"}, {"he": "מציג את טענות שני הצדדים", "ar": "يعرض ادعاءات الطرفين", "ru": "излагает доводы обеих сторон", "en": "presents the arguments of both sides"}],3,{"he": "קראו שוב את המשפטים שלפני המילה לדעתי.", "ar": "اقرأوا مرة أخرى الجمل التي قبل كلمة برأيي.", "ru": "Перечитайте предложения перед словами «по-моему».", "en": "Reread the sentences before the words in my opinion."},{"he": "לפני המילה לדעתי מופיעים שני משפטים: אחד של התומכים ואחד של המתנגדים. רק אחר כך הכותב אומר מה הוא חושב. זה מבנה נפוץ בכתיבת טיעון.", "ar": "قبل كلمة برأيي تظهر جملتان: واحدة للمؤيدين وواحدة للمعارضين. بعد ذلك فقط يقول الكاتب ما يفكّر. هذا مبنى شائع في كتابة الحجج.", "ru": "Перед словами «по-моему» стоят два предложения: одно о сторонниках, другое о противниках. Только потом автор говорит, что думает сам. Это частая схема аргументативного текста.", "en": "Before in my opinion there are two sentences: one for the supporters and one for the opponents. Only then does the writer say what he thinks. This is a common structure in argument writing."},null,[{"he": "אין בקטע סיפור אישי של הכותב.", "ar": "لا توجد في القطعة قصة شخصية للكاتب.", "ru": "В отрывке нет личной истории автора.", "en": "There is no personal story of the writer in the passage."}, {"he": "אין בקטע נתונים או מחקר.", "ar": "لا توجد في القطعة معطيات أو بحث.", "ru": "В отрывке нет данных или исследований.", "en": "There is no data or study in the passage."}, {"he": "ההיסטוריה של הטלפון אינה מוזכרת בקטע.", "ar": "تاريخ الهاتف غير مذكور في القطعة.", "ru": "История телефона в отрывке не упоминается.", "en": "The history of the phone is not mentioned in the passage."}, null]),
   Q("rd-3-03",{"he": "קראו את הקטע וענו על השאלה.<br>יש בתי ספר שאסרו על התלמידים להשתמש בטלפון בהפסקות. התומכים בהחלטה אומרים שבזכותה התלמידים משחקים יותר בחצר ומדברים יותר זה עם זה. המתנגדים טוענים שהטלפון הוא כלי חשוב, ושצריך ללמוד להשתמש בו בתבונה. לדעתי, איסור מלא אינו הפתרון. עדיף ללמד את התלמידים מתי להניח את הטלפון בצד, כי את ההרגל הזה הם ייקחו איתם גם אל מחוץ לבית הספר.<br>מה תפקיד המילה \"כי\" במשפט האחרון?", "ar": "اقرأوا القطعة وأجيبوا عن السؤال.<br>هناك مدارس منعت الطلاب من استخدام الهاتف في الاستراحات. المؤيدون للقرار يقولون إن الطلاب بفضله يلعبون أكثر في الساحة ويتحدّثون أكثر بعضهم مع بعض. المعارضون يدّعون أن الهاتف أداة مهمة، وأنه يجب تعلّم استخدامه بحكمة. برأيي، المنع الكامل ليس هو الحل. الأفضل أن نعلّم الطلاب متى يضعون الهاتف جانبًا، لأنهم سيأخذون هذه العادة معهم أيضًا إلى خارج المدرسة.<br>ما وظيفة كلمة «כי» (لأنّ) في الجملة الأخيرة؟", "ru": "Прочитайте отрывок и ответьте на вопрос.<br>Некоторые школы запретили ученикам пользоваться телефоном на переменах. Сторонники решения говорят, что благодаря ему ученики больше играют во дворе и больше разговаривают друг с другом. Противники утверждают, что телефон - важный инструмент и нужно учиться пользоваться им разумно. По-моему, полный запрет - не решение. Лучше учить учеников, когда откладывать телефон, потому что эту привычку они возьмут с собой и за пределы школы.<br>Какую роль играет слово «כי» («потому что») в последнем предложении?", "en": "Read the passage and answer the question.<br>Some schools have banned students from using phones during breaks. Supporters of the decision say that because of it students play more in the yard and talk to each other more. Opponents argue that the phone is an important tool and that students must learn to use it wisely. In my opinion, a total ban is not the solution. It is better to teach students when to put the phone aside, because they will take this habit with them outside school too.<br>What is the role of the word \"כי\" (because) in the last sentence?"},[{"he": "פותחת נימוק לדעת הכותב", "ar": "تفتح تعليلًا لرأي الكاتب", "ru": "вводит довод в пользу мнения автора", "en": "opens a reason for the writer's opinion"}, {"he": "פותחת דוגמה מחיי התלמידים בהפסקה", "ar": "تفتح مثالًا من حياة الطلاب في الاستراحة", "ru": "вводит пример из жизни учеников на перемене", "en": "opens an example from students' life during the break"}, {"he": "פותחת ניגוד לדעת המתנגדים", "ar": "تفتح تناقضًا مع رأي المعارضين", "ru": "вводит противопоставление мнению противников", "en": "opens a contrast with the opponents' view"}, {"he": "פותחת תנאי להחלטה של בית הספר", "ar": "تفتح شرطًا لقرار المدرسة", "ru": "вводит условие для решения школы", "en": "opens a condition for the school's decision"}],0,{"he": "שאלו את עצמכם: למה ההצעה בסוף הקטע עדיפה, לפי מי שכתב אותו?", "ar": "اسألوا أنفسكم: لماذا الاقتراح في آخر القطعة أفضل، حسب من كتبها؟", "ru": "Спросите себя: почему предложение в конце отрывка лучше, по мнению того, кто его написал?", "en": "Ask yourselves: why is the suggestion at the end better, according to the person who wrote it?"},{"he": "אחרי המילה כי הכותב מסביר למה ההצעה שלו טובה: התלמידים ייקחו את ההרגל גם מחוץ לבית הספר. כלומר, כי פותחת את ההסבר שתומך בדעה שלו.", "ar": "بعد كلمة כי يشرح الكاتب لماذا اقتراحه جيد: سيأخذ الطلاب العادة أيضًا خارج المدرسة. أي أن כי تفتح الشرح الذي يدعم رأيه.", "ru": "После слова כי автор объясняет, почему его предложение хорошее: ученики возьмут привычку и за пределы школы. То есть כי вводит объяснение, которое поддерживает его мнение.", "en": "After the word כי the writer explains why his idea is good: students will take the habit outside school too. So כי opens the explanation that supports his opinion."},null,[null, {"he": "אחרי כי אין דוגמה מן ההפסקה, אלא הסבר.", "ar": "بعد כי لا يوجد مثال من الاستراحة، بل شرح.", "ru": "После כי идёт не пример с перемены, а объяснение.", "en": "After כי there is no example from the break, but an explanation."}, {"he": "המשפט אינו מתנגד לאיש; הוא מחזק את דעת הכותב.", "ar": "الجملة لا تعارض أحدًا؛ بل تقوّي رأي الكاتب.", "ru": "Предложение ни с кем не спорит; оно усиливает мнение автора.", "en": "The sentence opposes no one; it supports the writer's view."}, {"he": "לתנאי מתאימה המילה אם, ולא המילה כי.", "ar": "للشرط تناسب كلمة אם (إذا)، لا كلمة כי.", "ru": "Для условия подходит слово אם («если»), а не כי.", "en": "For a condition the word אם (if) fits, not כי."}]),
   Q("rd-3-04",{"he": "קראו את הקטע וענו על השאלה.<br>רנא עמדה בתחנה וחיכתה לאוטובוס. היא הסתכלה שוב ושוב בשעון ונשמה עמוק. בתיק שלה היו הדפים שהכינה כל השבוע. \"עוד שעה אני עומדת מול כל הכיתה\", לחשה לעצמה. כשהאוטובוס הגיע, היא התיישבה ליד החלון. כל הנסיעה היא קראה שוב את הדפים, ורק השפתיים שלה זזו.<br>מה רנא עומדת לעשות, ככל הנראה?", "ar": "اقرأوا القطعة وأجيبوا عن السؤال.<br>وقفت رنا في المحطة وانتظرت الحافلة. نظرت إلى الساعة مرة بعد مرة وتنفّست بعمق. في حقيبتها كانت الأوراق التي حضّرتها طوال الأسبوع. «بعد ساعة سأقف أمام الصف كله»، همست لنفسها. عندما وصلت الحافلة، جلست بجانب النافذة. طوال الطريق قرأت الأوراق مرة أخرى، وكانت شفتاها فقط تتحرّكان.<br>ماذا ستفعل رنا على الأرجح؟", "ru": "Прочитайте отрывок и ответьте на вопрос.<br>Рана стояла на остановке и ждала автобус. Она снова и снова смотрела на часы и глубоко дышала. В сумке у неё были листы, которые она готовила всю неделю. «Через час я стою перед всем классом», - прошептала она себе. Когда пришёл автобус, она села у окна. Всю дорогу она перечитывала листы, и только губы её шевелились.<br>Что, скорее всего, собирается сделать Рана?", "en": "Read the passage and answer the question.<br>Rana stood at the stop and waited for the bus. She looked at her watch again and again and took deep breaths. In her bag were the pages she had prepared all week. \"In an hour I'm standing in front of the whole class,\" she whispered to herself. When the bus came, she sat by the window. The whole ride she read the pages again, and only her lips moved.<br>What is Rana most likely about to do?"},[{"he": "לפגוש חברה ותיקה בבית קפה במרכז העיר", "ar": "أن تلتقي صديقة قديمة في مقهى وسط المدينة", "ru": "встретиться со старой подругой в кафе в центре города", "en": "meet an old friend at a café in the city center"}, {"he": "לנסוע לחופשה עם המשפחה", "ar": "أن تسافر في عطلة مع العائلة", "ru": "поехать в отпуск с семьёй", "en": "go on a vacation with her family"}, {"he": "להציג לפני הכיתה עבודה שהכינה", "ar": "أن تعرض أمام الصف عملًا حضّرته", "ru": "представить классу работу, которую подготовила", "en": "present work she prepared to the class"}, {"he": "לקנות דפים חדשים לתיק", "ar": "أن تشتري أوراقًا جديدة للحقيبة", "ru": "купить новые листы для сумки", "en": "buy new pages for her bag"}],2,{"he": "חברו בין הדפים שבתיק לבין מה שרנא לוחשת.", "ar": "اربطوا بين الأوراق في الحقيبة وما تهمس به رنا.", "ru": "Свяжите листы в сумке с тем, что шепчет Рана.", "en": "Connect the pages in the bag with what Rana whispers."},{"he": "רנא אומרת שבעוד שעה היא תעמוד מול כל הכיתה. בתיק יש דפים שהכינה כל השבוע, והיא קוראת אותם שוב. לכן סביר שהיא עומדת להציג עבודה.", "ar": "رنا تقول إنها بعد ساعة ستقف أمام الصف كله. في الحقيبة أوراق حضّرتها طوال الأسبوع، وهي تقرأها مرة أخرى. لذلك من المرجّح أنها ستعرض عملًا.", "ru": "Рана говорит, что через час будет стоять перед всем классом. В сумке листы, которые она готовила всю неделю, и она их перечитывает. Поэтому вероятно, что она будет представлять работу.", "en": "Rana says that in an hour she will stand in front of the whole class. Her bag holds pages she prepared all week, and she rereads them. So she is probably about to present her work."},null,[{"he": "בית קפה וחברה אינם מוזכרים בקטע.", "ar": "المقهى والصديقة غير مذكورين في القطعة.", "ru": "Кафе и подруга в отрывке не упоминаются.", "en": "A café and a friend are not mentioned in the passage."}, {"he": "אין בקטע רמז לחופשה; היא תעמוד מול הכיתה.", "ar": "لا يوجد في القطعة تلميح لعطلة؛ ستقف أمام الصف.", "ru": "В отрывке нет намёка на отпуск; она будет стоять перед классом.", "en": "There is no hint of a vacation; she will stand before the class."}, null, {"he": "הדפים כבר בתיק, והיא הכינה אותם כל השבוע.", "ar": "الأوراق موجودة في الحقيبة، وقد حضّرتها طوال الأسبوع.", "ru": "Листы уже в сумке, она готовила их всю неделю.", "en": "The pages are already in her bag; she prepared them all week."}]),
   Q("rd-3-05",{"he": "קראו את הקטע וענו על השאלה.<br>רנא עמדה בתחנה וחיכתה לאוטובוס. היא הסתכלה שוב ושוב בשעון ונשמה עמוק. בתיק שלה היו הדפים שהכינה כל השבוע. \"עוד שעה אני עומדת מול כל הכיתה\", לחשה לעצמה. כשהאוטובוס הגיע, היא התיישבה ליד החלון. כל הנסיעה היא קראה שוב את הדפים, ורק השפתיים שלה זזו.<br>איזו הרגשה מראה ההתנהגות של רנא בתחנה?", "ar": "اقرأوا القطعة وأجيبوا عن السؤال.<br>وقفت رنا في المحطة وانتظرت الحافلة. نظرت إلى الساعة مرة بعد مرة وتنفّست بعمق. في حقيبتها كانت الأوراق التي حضّرتها طوال الأسبوع. «بعد ساعة سأقف أمام الصف كله»، همست لنفسها. عندما وصلت الحافلة، جلست بجانب النافذة. طوال الطريق قرأت الأوراق مرة أخرى، وكانت شفتاها فقط تتحرّكان.<br>أي شعور يُظهره سلوك رنا في المحطة؟", "ru": "Прочитайте отрывок и ответьте на вопрос.<br>Рана стояла на остановке и ждала автобус. Она снова и снова смотрела на часы и глубоко дышала. В сумке у неё были листы, которые она готовила всю неделю. «Через час я стою перед всем классом», - прошептала она себе. Когда пришёл автобус, она села у окна. Всю дорогу она перечитывала листы, и только губы её шевелились.<br>Какое чувство показывает поведение Раны на остановке?", "en": "Read the passage and answer the question.<br>Rana stood at the stop and waited for the bus. She looked at her watch again and again and took deep breaths. In her bag were the pages she had prepared all week. \"In an hour I'm standing in front of the whole class,\" she whispered to herself. When the bus came, she sat by the window. The whole ride she read the pages again, and only her lips moved.<br>What feeling does Rana's behavior at the stop show?"},[{"he": "מתח לפני משהו חשוב", "ar": "توتّر قبل أمر مهم", "ru": "волнение перед чем-то важным", "en": "tension before something important"}, {"he": "שעמום מההמתנה הארוכה בתחנה", "ar": "ملل من الانتظار الطويل في المحطة", "ru": "скука от долгого ожидания на остановке", "en": "boredom from the long wait at the stop"}, {"he": "כעס על הנהג שאיחר", "ar": "غضب على السائق الذي تأخّر", "ru": "злость на опоздавшего водителя", "en": "anger at the driver who was late"}, {"he": "עצב על משהו שקרה בבית", "ar": "حزن على شيء حدث في البيت", "ru": "грусть из-за чего-то дома", "en": "sadness about something at home"}],0,{"he": "חשבו מה מרגיש אדם שמסתכל כל רגע בשעון ונושם עמוק.", "ar": "فكّروا بماذا يشعر شخص ينظر إلى الساعة كل لحظة ويتنفّس بعمق.", "ru": "Подумайте, что чувствует человек, который всё время смотрит на часы и глубоко дышит.", "en": "Think about how a person feels who keeps looking at the watch and breathing deeply."},{"he": "רנא מסתכלת שוב ושוב בשעון ונושמת עמוק. אלה סימנים של מתח. היא גם חוזרת על הדפים, כי חשוב לה להצליח.", "ar": "رنا تنظر إلى الساعة مرة بعد مرة وتتنفّس بعمق. هذه علامات توتّر. وهي أيضًا تراجع الأوراق، لأن النجاح مهم لها.", "ru": "Рана снова и снова смотрит на часы и глубоко дышит. Это признаки волнения. Она также повторяет листы, потому что ей важно преуспеть.", "en": "Rana keeps looking at her watch and breathing deeply. These are signs of tension. She also goes over the pages because success matters to her."},null,[null, {"he": "אדם משועמם אינו חוזר בריכוז על דפים שהכין.", "ar": "الشخص الملول لا يراجع بتركيز أوراقًا حضّرها.", "ru": "Скучающий человек не повторяет сосредоточенно свои листы.", "en": "A bored person does not carefully go over pages they prepared."}, {"he": "הקטע אינו אומר שהנהג איחר.", "ar": "القطعة لا تقول إن السائق تأخّر.", "ru": "В отрывке не сказано, что водитель опоздал.", "en": "The passage does not say the driver was late."}, {"he": "שום דבר בקטע אינו מספר על עצב או על הבית.", "ar": "لا شيء في القطعة يتحدّث عن حزن أو عن البيت.", "ru": "В отрывке ничего не сказано о грусти или о доме.", "en": "Nothing in the passage mentions sadness or home."}]),
   Q("rd-3-06",{"he": "קראו את הקטע וענו על השאלה.<br>רנא עמדה בתחנה וחיכתה לאוטובוס. היא הסתכלה שוב ושוב בשעון ונשמה עמוק. בתיק שלה היו הדפים שהכינה כל השבוע. \"עוד שעה אני עומדת מול כל הכיתה\", לחשה לעצמה. כשהאוטובוס הגיע, היא התיישבה ליד החלון. כל הנסיעה היא קראה שוב את הדפים, ורק השפתיים שלה זזו.<br>איזו כותרת מתאימה ביותר לסיפור?", "ar": "اقرأوا القطعة وأجيبوا عن السؤال.<br>وقفت رنا في المحطة وانتظرت الحافلة. نظرت إلى الساعة مرة بعد مرة وتنفّست بعمق. في حقيبتها كانت الأوراق التي حضّرتها طوال الأسبوع. «بعد ساعة سأقف أمام الصف كله»، همست لنفسها. عندما وصلت الحافلة، جلست بجانب النافذة. طوال الطريق قرأت الأوراق مرة أخرى، وكانت شفتاها فقط تتحرّكان.<br>أي عنوان هو الأنسب للقصة؟", "ru": "Прочитайте отрывок и ответьте на вопрос.<br>Рана стояла на остановке и ждала автобус. Она снова и снова смотрела на часы и глубоко дышала. В сумке у неё были листы, которые она готовила всю неделю. «Через час я стою перед всем классом», - прошептала она себе. Когда пришёл автобус, она села у окна. Всю дорогу она перечитывала листы, и только губы её шевелились.<br>Какой заголовок больше всего подходит к рассказу?", "en": "Read the passage and answer the question.<br>Rana stood at the stop and waited for the bus. She looked at her watch again and again and took deep breaths. In her bag were the pages she had prepared all week. \"In an hour I'm standing in front of the whole class,\" she whispered to herself. When the bus came, she sat by the window. The whole ride she read the pages again, and only her lips moved.<br>Which title fits the story best?"},[{"he": "האוטובוס שלא הגיע לתחנה", "ar": "الحافلة التي لم تصل أبدًا إلى المحطة", "ru": "автобус, который так и не пришёл на остановку", "en": "The bus that never came to the stop"}, {"he": "בדרך לרגע החשוב", "ar": "في الطريق إلى اللحظة المهمة", "ru": "по дороге к важному моменту", "en": "On the way to the big moment"}, {"he": "חופשה ליד החלון", "ar": "عطلة بجانب النافذة", "ru": "отпуск у окна", "en": "A vacation by the window"}, {"he": "יום משעמם בתחנה", "ar": "يوم ممل في المحطة", "ru": "скучный день на остановке", "en": "A boring day at the stop"}],1,{"he": "בחרו כותרת שמתאימה למה שמעסיק את רנא לאורך כל הסיפור.", "ar": "اختاروا عنوانًا يناسب ما يشغل رنا طوال القصة.", "ru": "Выберите заголовок о том, что занимает Рану на протяжении всего рассказа.", "en": "Choose a title that fits what occupies Rana throughout the story."},{"he": "כל הסיפור מתאר את רנא בדרך למשהו שחשוב לה: היא בודקת את השעה ומתכוננת. האוטובוס דווקא הגיע, ואין בסיפור חופשה.", "ar": "القصة كلها تصف رنا في طريقها إلى أمر مهم لها: تفحص الساعة وتستعدّ. الحافلة وصلت فعلًا، ولا توجد في القصة عطلة.", "ru": "Весь рассказ описывает Рану на пути к чему-то важному: она смотрит на часы и готовится. Автобус как раз пришёл, а отпуска в рассказе нет.", "en": "The whole story shows Rana on her way to something important: she checks the time and prepares. The bus did come, and there is no vacation in the story."},null,[{"he": "האוטובוס הגיע, ורנא התיישבה בו ליד החלון.", "ar": "الحافلة وصلت، وجلست فيها رنا بجانب النافذة.", "ru": "Автобус пришёл, и Рана села в нём у окна.", "en": "The bus came, and Rana sat in it by the window."}, null, {"he": "רנא אינה בחופשה; היא מתכוננת לעמוד מול הכיתה.", "ar": "رنا ليست في عطلة؛ إنها تستعدّ للوقوف أمام الصف.", "ru": "Рана не в отпуске; она готовится выступать перед классом.", "en": "Rana is not on vacation; she is preparing to face the class."}, {"he": "רנא אינה משועממת; היא מתוחה ומתכוננת.", "ar": "رنا ليست مملولة؛ إنها متوتّرة وتستعدّ.", "ru": "Ране не скучно; она волнуется и готовится.", "en": "Rana is not bored; she is tense and preparing."}])
  ]
]);

topic("ha-derive","014381",{"he": "דרכי גזירה: שורש, בניין והלחם", "ar": "طرق الاشتقاق: الجذر والوزن والدمج", "ru": "Словообразование: корень, биньян и слияние", "en": "Derivation: root, binyan, and blends"},{"he": "איך מילים עבריות נבנות, ואיך מפרקים מילה לחלקיה", "ar": "كيف تُبنى الكلمات العبرية، وكيف نفكك الكلمة إلى أجزائها", "ru": "Как устроены слова в иврите и как разложить слово на части", "en": "How Hebrew words are built and how to break a word into parts"}, [
  [
   Q("ha-derive-1-1",{"he": "מהו השורש של המילה \"הסתברות\"?", "ar": "ما جذر كلمة «הסתברות»؟", "ru": "Каков корень слова «הסתברות»?", "en": "What is the root of the word \"הסתברות\"?"},[{"he": "ה־ס־ב־ר", "ar": "ה־ס־ב־ר", "ru": "ה־ס־ב־ר", "en": "ה־ס־ב־ר"}, {"he": "ס־ב־ר", "ar": "ס־ב־ר", "ru": "ס־ב־ר", "en": "ס־ב־ר"}, {"he": "ס־ת־ב־ר", "ar": "ס־ת־ב־ר", "ru": "ס־ת־ב־ר", "en": "ס־ת־ב־ר"}, {"he": "ב־ר־ו־ת", "ar": "ב־ר־ו־ת", "ru": "ב־ר־ו־ת", "en": "ב־ר־ו־ת"}],1,{"he": "הורידו את האותיות המשפחתיות: ה תחילית וו והאותיות ת בסוף.", "ar": "احذفوا الحروف الزائدة: الهاء في البداية والواو والتاء في النهاية.", "ru": "Уберите служебные буквы: ה в начале и ו, ת в конце.", "en": "Remove the added letters: ה at the start and ו, ת at the end."},{"he": "במילה הסתברות האות ה היא אות תחילית, ו והאות ת בסוף אינן חלק מהשורש. נשארות ס ב ר, שורש המילים סברה והסבר. למשל גם במילה מסביר נמצא אותו שורש.", "ar": "في كلمة הסתברות حرف الهاء زائد في البداية، والواو والتاء في النهاية ليستا من الجذر. تبقى س ب ر، جذر كلمتي סברה وהסבר. مثلًا في كلمة מסביר نجد الجذر نفسه.", "ru": "В слове הסתברות буква ה - приставка, а ו и ת в конце не входят в корень. Остаются ס ב ר, корень слов סברה и הסבר. Например, в слове מסביר тот же корень.", "en": "In הסתברות the letter ה is a prefix, and ו and ת at the end are not part of the root. What remains is ס ב ר, the root of סברה and הסבר. For example, מסביר has the same root."},null,[{"he": "ה האותית אינה חלק מהשורש; היא אות תחילית.", "ar": "الهاء ليست من الجذر؛ فهي حرف زائد في البداية.", "ru": "Буква ה не входит в корень; это приставка.", "en": "The ה is not part of the root; it is a prefix letter."}, null, {"he": "האות ת אינה בשורש; היא נוספה בבניין התפעל.", "ar": "التاء ليست في الجذر؛ أُضيفت في وزن התפעל.", "ru": "Буква ת не в корне; она добавлена в биньяне התפעל.", "en": "The ת is not in the root; it is added in the התפעל pattern."}, {"he": "ו ות אינן אותיות שורש; הן סיומת השם העצם.", "ar": "الواو والتاء ليستا حرفي جذر؛ فهما لاحقة الاسم.", "ru": "В и ת не корневые буквы; это окончание существительного.", "en": "ו and ת are not root letters; they are the noun ending."}]),
   Q("ha-derive-1-2",{"he": "באיזה בניין נטולה המילה \"נִשְׁבַּר\"?", "ar": "في أي وزن جاءت كلمة «נִשְׁבַּר»؟", "ru": "В каком биньяне стоит слово «נִשְׁבַּר»?", "en": "Which binyan is the word \"נִשְׁבַּר\" in?"},[{"he": "פָּעַל", "ar": "פָּעַל", "ru": "פָּעַל", "en": "פָּעַל (pa'al)"}, {"he": "פִּעֵל", "ar": "פִּעֵל", "ru": "פִּעֵל", "en": "פִּעֵל (pi'el)"}, {"he": "נִפְעַל", "ar": "נִפְעַל", "ru": "נִפְעַל", "en": "נִפְעַל (nif'al)"}, {"he": "הִפְעִיל", "ar": "הִפְעִיל", "ru": "הִפְעִיל", "en": "הִפְעִיל (hif'il)"}],2,{"he": "חפשו אות נוספת לפני אותיות השורש.", "ar": "ابحثوا عن حرف زائد قبل حروف الجذر.", "ru": "Ищите добавочную букву перед буквами корня.", "en": "Look for an added letter before the root letters."},{"he": "במילה נשבר מופיעה האות נ לפני אותיות השורש ש ב ר, וזה סימן ההיכר של בניין נפעל בעבר. למשל: נכנס, נשמע ונבנה בנויים באותו דגם.", "ar": "في كلمة נשבר يظهر حرف النون قبل حروف الجذر ش ب ر، وهذه علامة وزن נפעל في الماضي. مثلًا: נכנס وנשמע وנבנה مبنية على النمط نفسه.", "ru": "В слове נשבר перед буквами корня ש ב ר стоит буква נ - признак биньяна נפעל в прошедшем времени. Например: נכנס, נשמע и נבנה построены по той же модели.", "en": "In נשבר the letter נ appears before the root letters ש ב ר - the sign of the נפעל binyan in past tense. For example: נכנס, נשמע and נבנה are built on the same pattern."},null,[{"he": "בפעל אין אות נוספת לפני השורש, וכאן יש נ.", "ar": "في פעל لا يوجد حرف زائد قبل الجذر، وهنا توجد نون.", "ru": "В פעל нет добавочной буквы перед корнем, а здесь есть נ.", "en": "In פעל there is no added letter before the root, and here there is a נ."}, {"he": "בפיעל אין נ תחילית; למשל דיבר, סיפר.", "ar": "في פיעל لا توجد نون في البداية؛ مثل דיבר וסיפר.", "ru": "В פיעל нет начальной נ; например דיבר, סיפר.", "en": "In פיעל there is no initial נ; for example דיבר, סיפר."}, null, {"he": "בהפעיל פותחים בה, לא בנ; למשל הדליק.", "ar": "في הִפְעִיל نبدأ بالهاء لا بالنون؛ مثل הדליק.", "ru": "В הִפְעִיל начинается с ה, не с נ; например הדליק.", "en": "In הִפְעִיל the word opens with ה, not נ; for example הדליק."}]),
   Q("ha-derive-1-3",{"he": "איזו מילה שייכת למשפחת המילים של השורש כ־ת־ב?", "ar": "أي كلمة تنتمي إلى عائلة الجذر ك־ت־ب؟", "ru": "Какое слово принадлежит семье корня כ־ת־ב?", "en": "Which word belongs to the family of the root כ־ת־ב?"},[{"he": "מִכְתָּבָה", "ar": "מִכְתָּבָה (מִכְתָּב + ה)", "ru": "מִכְתָּבָה", "en": "מִכְתָּבָה (letter/correspondence)"}, {"he": "סִפְרִיָּה", "ar": "סִפְרִיָּה (ס־פ־ר)", "ru": "סִפְרִיָּה", "en": "סִפְרִיָּה (library)"}, {"he": "קְרִיאָה", "ar": "קְרִיאָה (ק־ר־א)", "ru": "קְרִיאָה", "en": "קְרִיאָה (reading)"}, {"he": "דִּבּוּר", "ar": "דִּבּוּר (ד־ב־ר)", "ru": "דִּבּוּר", "en": "דִּבּוּר (speech)"}],0,{"he": "חפשו מילה שאותיות השורש כ ת ב מופיעות בה.", "ar": "ابحثوا عن كلمة تظهر فيها حروف الجذر כ ת ב.", "ru": "Ищите слово, в котором встречаются буквы корня כ ת ב.", "en": "Look for a word containing the root letters כ ת ב."},{"he": "מכתבה בנויה מהשורש כ ת ב: מכתב הוא מסמך כתוב, והסיומת ה יוצרת שם עצם חדש. שאר המילים ממשפחות אחרות: ספרייה מן השורש ס פ ר, קריאה מן ק ר א ודיבור מן ד ב ר.", "ar": "كلمة מכתבה مبنية من الجذر כ ת ב: מכתב هو مستند مكتوب، واللاحقة ה تُنشئ اسمًا جديدًا. بقية الكلمات من عائلات أخرى: ספרייה من الجذر ס פ ר، وקריאה من ק ר א، وדיבור من ד ב ר.", "ru": "Слово מכתבה построено от корня כ ת ב: מכתב - написанный документ, а окончание ה образует новое существительное. Остальные слова из других семей: ספרייה от корня ס פ ר, קריאה от ק ר א и דיבור от ד ב ר.", "en": "מכתבה is built from the root כ ת ב: מכתב is a written document, and the ה ending forms a new noun. The other words belong to other families: ספרייה from ס פ ר, קריאה from ק ר א, and דיבור from ד ב ר."},null,[null, {"he": "שורש המילה ספרייה הוא ס פ ר, לא כ ת ב.", "ar": "جذر كلمة ספרייה هو ס פ ר، وليس כ ת ב.", "ru": "Корень слова ספרייה - ס פ ר, а не כ ת ב.", "en": "The root of ספרייה is ס פ ר, not כ ת ב."}, {"he": "שורש המילה קריאה הוא ק ר א.", "ar": "جذر كلمة קריאה هو ק ר א.", "ru": "Корень слова קריאה - ק ר א.", "en": "The root of קריאה is ק ר א."}, {"he": "שורש המילה דיבור הוא ד ב ר.", "ar": "جذر كلمة דיבור هو ד ב ר.", "ru": "Корень слова דיבור - ד ב ר.", "en": "The root of דיבור is ד ב ר."}]),
   Q("dv-1-01",{"he": "מהו השורש של המילה \"מִשְׂחָק\"?", "ar": "ما جذر كلمة «מִשְׂחָק»؟", "ru": "Какой корень у слова «מִשְׂחָק»?", "en": "What is the root of the word \"מִשְׂחָק\"?"},[{"he": "מ־ש־ח", "ar": "מ־ש־ח", "ru": "מ־ש־ח", "en": "מ־ש־ח"}, {"he": "צ־ח־ק", "ar": "צ־ח־ק", "ru": "צ־ח־ק", "en": "צ־ח־ק"}, {"he": "ש־ח־ק", "ar": "ש־ח־ק", "ru": "ש־ח־ק", "en": "ש־ח־ק"}, {"he": "מ־ש־ח־ק: כל אותיות המילה", "ar": "מ־ש־ח־ק: كل حروف الكلمة", "ru": "מ־ש־ח־ק: все буквы слова", "en": "מ־ש־ח־ק: all the letters of the word"}],2,{"he": "האות מ בתחילת שם עצם היא לעיתים קרובות תוספת.", "ar": "حرف מ في بداية الاسم يكون غالبًا حرفًا زائدًا.", "ru": "Буква מ в начале существительного часто бывает добавочной.", "en": "The letter מ at the start of a noun is often an added letter."},{"he": "האות מ בתחילת מִשְׂחָק היא תוספת של המשקל. נשארות ש ח ק, כמו במילים שַׂחְקָן ומְשַׂחֵק. צ־ח־ק נשמע דומה, אבל זה שורש אחר.", "ar": "حرف מ في بداية מִשְׂחָק زائد من الوزن. تبقى ש ח ק، كما في كلمتي שַׂחְקָן وמְשַׂחֵק. الجذر צ־ח־ק يبدو مشابهًا، لكنه جذر آخر.", "ru": "Буква מ в начале מִשְׂחָק - добавка модели. Остаются ש ח ק, как в словах שַׂחְקָן и מְשַׂחֵק. צ־ח־ק звучит похоже, но это другой корень.", "en": "The מ at the start of מִשְׂחָק is added by the pattern. What remains is ש ח ק, as in שַׂחְקָן and מְשַׂחֵק. צ־ח־ק sounds similar, but it is a different root."},null,[{"he": "מ היא תוספת של המשקל, וחסרה כאן האות ק.", "ar": "מ حرف زائد من الوزن، وينقص هنا حرف ק.", "ru": "מ - добавка модели, и здесь не хватает буквы ק.", "en": "מ is added by the pattern, and the letter ק is missing here."}, {"he": "צ־ח־ק הוא שורש אחר, של צחוק; במילה יש ש ולא צ.", "ar": "צ־ח־ק جذر آخر، جذر الضحك؛ في الكلمة ש لا צ.", "ru": "צ־ח־ק - другой корень, корень смеха; в слове ש, а не צ.", "en": "צ־ח־ק is a different root, of laughter; the word has ש, not צ."}, null, {"he": "לא כל אותיות המילה הן שורש; מ היא תוספת.", "ar": "ليست كل حروف الكلمة جذرًا؛ מ حرف زائد.", "ru": "Не все буквы слова - корень; מ добавочная.", "en": "Not all the letters are root letters; מ is added."}]),
   Q("dv-1-02",{"he": "באיזה בניין נמצא הפועל \"שִׁלֵּם\"?", "ar": "في أي وزن (بنيان) يأتي الفعل «שִׁלֵּם»؟", "ru": "В каком биньяне стоит глагол «שִׁלֵּם»?", "en": "Which binyan is the verb \"שִׁלֵּם\" in?"},[{"he": "פָּעַל", "ar": "פָּעַל", "ru": "פָּעַל", "en": "פָּעַל (pa'al)"}, {"he": "פִּעֵל", "ar": "פִּעֵל", "ru": "פִּעֵל", "en": "פִּעֵל (pi'el)"}, {"he": "הִתְפַּעֵל", "ar": "הִתְפַּעֵל", "ru": "הִתְפַּעֵל", "en": "הִתְפַּעֵל (hitpa'el)"}, {"he": "הִפְעִיל", "ar": "הִפְעִיל", "ru": "הִפְעִיל", "en": "הִפְעִיל (hif'il)"}],1,{"he": "שימו לב לתנועה מתחת לאות הראשונה ולדגש באות האמצעית.", "ar": "انتبهوا إلى الحركة تحت الحرف الأول وإلى الشدّة (דגש) في الحرف الأوسط.", "ru": "Обратите внимание на огласовку под первой буквой и на дагеш в средней букве.", "en": "Notice the vowel under the first letter and the dagesh in the middle letter."},{"he": "בבניין פִּעֵל יש חיריק באות הראשונה, צירה באות השנייה ודגש באמצעית, כמו דִּבֵּר וסִפֵּר. כך גם שִׁלֵּם, מן השורש ש־ל־מ. אין לפני השורש תוספת כמו הת או ה.", "ar": "في وزن פִּעֵל تكون كسرة (חיריק) تحت الحرف الأول وצירה تحت الثاني وشدّة في الأوسط، مثل דִּבֵּר وסִפֵּר. وهكذا שִׁלֵּם من الجذر ש־ל־מ. لا توجد قبل الجذر زيادة مثل הת أو ה.", "ru": "В биньяне פִּעֵל под первой буквой хирик, под второй цере, а в средней дагеш, как в דִּבֵּר и סִפֵּר. Так и שִׁלֵּם от корня ש־ל־מ. Перед корнем нет добавки вроде הת или ה.", "en": "In pi'el the first letter has hiriq, the second has tsere, and the middle letter has a dagesh, as in דִּבֵּר and סִפֵּר. So does שִׁלֵּם, from the root ש־ל־מ. There is no prefix like הת or ה."},null,[{"he": "בפָּעַל יש קמץ ופתח, כמו שָׁמַר; כאן יש חיריק וצירה.", "ar": "في פָּעַל قمص وفتحة مثل שָׁמַר؛ وهنا كسرة وצירה.", "ru": "В פָּעַל камац и патах, как שָׁמַר; здесь хирик и цере.", "en": "Pa'al has qamats and patah, like שָׁמַר; here there are hiriq and tsere."}, null, {"he": "בהִתְפַּעֵל המילה פותחת בהת, כמו הִתְלַבֵּשׁ.", "ar": "في הִתְפַּעֵל تبدأ الكلمة بـ הת، مثل הִתְלַבֵּשׁ.", "ru": "В הִתְפַּעֵל слово начинается с הת, как הִתְלַבֵּשׁ.", "en": "In hitpa'el the word begins with הת, like הִתְלַבֵּשׁ."}, {"he": "בהִפְעִיל המילה פותחת בה, כמו הִדְלִיק.", "ar": "في הִפְעִיל تبدأ الكلمة بـ ה، مثل הִדְלִיק.", "ru": "В הִפְעִיל слово начинается с ה, как הִדְלִיק.", "en": "In hif'il the word begins with ה, like הִדְלִיק."}]),
   Q("dv-1-03",{"he": "איזו מילה שייכת למשפחת השורש ל־מ־ד?", "ar": "أي كلمة تنتمي إلى عائلة الجذر ל־מ־ד؟", "ru": "Какое слово относится к семье корня ל־מ־ד?", "en": "Which word belongs to the family of the root ל־מ־ד?"},[{"he": "תַּלְמִיד", "ar": "תַּלְמִיד", "ru": "תַּלְמִיד", "en": "תַּלְמִיד"}, {"he": "מְדִינָה", "ar": "מְדִינָה", "ru": "מְדִינָה", "en": "מְדִינָה"}, {"he": "הִתְמוֹדְדוּת", "ar": "הִתְמוֹדְדוּת", "ru": "הִתְמוֹדְדוּת", "en": "הִתְמוֹדְדוּת"}, {"he": "מַלְכָּה", "ar": "מַלְכָּה", "ru": "מַלְכָּה", "en": "מַלְכָּה"}],0,{"he": "חפשו מילה שבה האותיות ל, מ, ד מופיעות בסדר הזה.", "ar": "ابحثوا عن كلمة تظهر فيها الحروف ל، מ، ד بهذا الترتيب.", "ru": "Найдите слово, где буквы ל, מ, ד идут именно в этом порядке.", "en": "Find a word in which the letters ל, מ, ד appear in this order."},{"he": "בתַּלְמִיד מופיעות ל, מ, ד בסדר של השורש, ומסביבן תוספות של המשקל. בשאר המילים יש רק חלק מהאותיות. השורש צריך להופיע כולו ובאותו סדר.", "ar": "في תַּלְמִיד تظهر ל، מ، ד بترتيب الجذر، وحولها زوائد الوزن. في باقي الكلمات يوجد جزء من الحروف فقط. يجب أن يظهر الجذر كله وبالترتيب نفسه.", "ru": "В תַּלְמִיד буквы ל, מ, ד стоят в порядке корня, а вокруг них добавки модели. В остальных словах есть только часть букв. Корень должен быть целиком и в том же порядке.", "en": "In תַּלְמִיד the letters ל, מ, ד appear in root order, with pattern letters around them. The other words contain only some of the letters. The whole root must appear, in the same order."},null,[null, {"he": "מְדִינָה היא מן השורש ד־י־נ; אין בה ל.", "ar": "מְדִינָה من الجذر ד־י־נ؛ ليس فيها ל.", "ru": "מְדִינָה - от корня ד־י־נ; в ней нет ל.", "en": "מְדִינָה comes from the root ד־י־נ; it has no ל."}, {"he": "הִתְמוֹדְדוּת היא מן השורש מ־ד־ד; אין בה ל.", "ar": "הִתְמוֹדְדוּת من الجذر מ־ד־ד؛ ليس فيها ל.", "ru": "הִתְמוֹדְדוּת - от корня מ־ד־ד; в ней нет ל.", "en": "הִתְמוֹדְדוּת comes from the root מ־ד־ד; it has no ל."}, {"he": "מַלְכָּה היא מן השורש מ־ל־כ; אין בה ד.", "ar": "מַלְכָּה من الجذر מ־ל־כ؛ ليس فيها ד.", "ru": "מַלְכָּה - от корня מ־ל־כ; в ней нет ד.", "en": "מַלְכָּה comes from the root מ־ל־כ; it has no ד."}]),
   Q("dv-1-04",{"he": "המילה \"דּוּ״חַ\" היא ראשי תיבות. מה הצירוף המלא?", "ar": "كلمة «דּוּ״חַ» مختصرة من الحروف الأولى. ما العبارة الكاملة؟", "ru": "Слово «דּוּ״חַ» - аббревиатура. Как звучит полное выражение?", "en": "The word \"דּוּ״חַ\" is an acronym. What is the full phrase?"},[{"he": "דבר חשוב", "ar": "דבר חשוב (أمر مهم)", "ru": "דבר חשוב (важное дело)", "en": "דבר חשוב (an important thing)"}, {"he": "דואר חוזר לשולח", "ar": "דואר חוזר לשולח (بريد يعود للمرسل)", "ru": "דואר חוזר לשולח (почта возвращается отправителю)", "en": "דואר חוזר לשולח (mail returned to sender)"}, {"he": "דף חדש", "ar": "דף חדש (صفحة جديدة)", "ru": "דף חדש (новая страница)", "en": "דף חדש (a new page)"}, {"he": "דין וחשבון", "ar": "דין וחשבון (تقرير وحساب)", "ru": "דין וחשבון (отчёт)", "en": "דין וחשבון (report, account)"}],3,{"he": "זה מסמך שבו מסבירים מה קרה, למשל אחרי בדיקה או תאונה.", "ar": "هذه وثيقة يشرحون فيها ما حدث، مثلًا بعد فحص أو حادث.", "ru": "Это документ, в котором объясняют, что произошло, например после проверки или аварии.", "en": "It is a document that explains what happened, for example after an inspection or an accident."},{"he": "דו״ח הוא קיצור של דין וחשבון: ד מן דין, ו החיבור, ח מן חשבון. הגרשיים לפני האות האחרונה מסמנים ראשי תיבות. למשל גם ד״ש הוא קיצור של דרישת שלום.", "ar": "דו״ח اختصار لـ דין וחשבון: ד من דין، وו العطف، وח من חשבון. علامة الاقتباس قبل الحرف الأخير تدل على اختصار. مثلًا ד״ש أيضًا اختصار لـ דרישת שלום (تحيّة).", "ru": "דו״ח - сокращение от דין וחשבון: ד от דין, союз ו и ח от חשבון. Двойной штрих перед последней буквой обозначает аббревиатуру. Например, ד״ש - это דרישת שלום («привет»).", "en": "דו״ח is short for דין וחשבון: ד from דין, the conjunction ו, and ח from חשבון. The double mark before the last letter shows an acronym. For example, ד״ש is short for דרישת שלום (regards)."},null,[{"he": "בצירוף הזה אין ו באמצע, ובדו״ח יש.", "ar": "في هذه العبارة لا توجد ו في الوسط، وفي דו״ח توجد.", "ru": "В этом выражении нет ו посередине, а в דו״ח есть.", "en": "This phrase has no ו in the middle, but דו״ח does."}, {"he": "דו״ח אינו קשור לדואר; ו שבו היא ו החיבור.", "ar": "דו״ח لا علاقة له بالبريد؛ الـו فيه حرف عطف.", "ru": "דו״ח не связан с почтой; ו в нём - союз «и».", "en": "דו״ח has nothing to do with mail; its ו is the conjunction and."}, {"he": "בצירוף הזה יש שתי מילים בלבד, בלי ו החיבור.", "ar": "في هذه العبارة كلمتان فقط، بدون ו العطف.", "ru": "В этом выражении только два слова, без союза ו.", "en": "This phrase has only two words, without the conjunction ו."}, null]),
   Q("dv-1-05",{"he": "המילה \"שְׁמַרְטַף\" נוצרה בהלחם בסיסים. מאילו שתי מילים?", "ar": "كلمة «שְׁמַרְטַף» نشأت بدمج كلمتين. من أي كلمتين؟", "ru": "Слово «שְׁמַרְטַף» образовано слиянием. Из каких двух слов?", "en": "The word \"שְׁמַרְטַף\" is a blend. Which two words form it?"},[{"he": "שׁוֹמֵר + טַף", "ar": "שׁוֹמֵר + טַף (حارس + أطفال صغار)", "ru": "שׁוֹמֵר + טַף (сторож + малые дети)", "en": "שׁוֹמֵר + טַף (guard + little children)"}, {"he": "שָׁמַיִם + טַף", "ar": "שָׁמַיִם + טַף (سماء + أطفال صغار)", "ru": "שָׁמַיִם + טַף (небо + малые дети)", "en": "שָׁמַיִם + טַף (sky + little children)"}, {"he": "שׁוֹמֵר + מִטְפַּחַת", "ar": "שׁוֹמֵר + מִטְפַּחַת (حارس + منديل للرأس)", "ru": "שׁוֹמֵר + מִטְפַּחַת (сторож + головной платок)", "en": "שׁוֹמֵר + מִטְפַּחַת (guard + headscarf or handkerchief)"}, {"he": "שֶׁמֶשׁ + טֶפַח", "ar": "שֶׁמֶשׁ + טֶפַח (شمس + شبر)", "ru": "שֶׁמֶשׁ + טֶפַח (солнце + ладонь)", "en": "שֶׁמֶשׁ + טֶפַח (sun + handbreadth)"}],0,{"he": "חשבו מה עושה האדם הזה, ובשביל מי הוא עושה את זה.", "ar": "فكّروا ماذا يفعل هذا الشخص، ومن أجل من يفعل ذلك.", "ru": "Подумайте, что делает этот человек и для кого.", "en": "Think about what this person does, and for whom."},{"he": "שמרטף שומר על ילדים קטנים, ומילה ישנה לילדים קטנים היא טַף. מן שׁוֹמֵר נלקח שמר, ומן טַף נלקח טף. יחד נוצרה מילה אחת: שמרטף.", "ar": "שמרטף يحرس الأطفال الصغار، والكلمة القديمة للأطفال الصغار هي טַף. من שׁוֹמֵר أُخذ שמר، ومن טַף أُخذ טף. ومعًا نشأت كلمة واحدة: שמרטף (جليس أطفال).", "ru": "שמרטף присматривает за малышами, а старое слово для малых детей - טַף. Из שׁוֹמֵר взято שמר, из טַף - טף. Вместе получилось одно слово: שמרטף («няня»).", "en": "A שמרטף watches small children, and an old word for small children is טַף. From שׁוֹמֵר came שמר, and from טַף came טף. Together they made one word: שמרטף (babysitter)."},null,[null, {"he": "שמרטף אינו קשור לשמיים; הוא שומר על ילדים.", "ar": "שמרטף لا علاقة له بالسماء؛ إنه يحرس الأطفال.", "ru": "שמרטף не связан с небом; он присматривает за детьми.", "en": "A שמרטף has nothing to do with the sky; he watches children."}, {"he": "החלק טף בא מן טַף, ילדים קטנים, ולא ממטפחת.", "ar": "الجزء טף جاء من טַף أي الأطفال الصغار، لا من מטפחת.", "ru": "Часть טף взята из טַף («малые дети»), а не из מטפחת.", "en": "The part טף comes from טַף, little children, not from מטפחת."}, {"he": "שמש וטפח אינם קשורים לשמירה על ילדים.", "ar": "الشمس والشبر لا علاقة لهما بحراسة الأطفال.", "ru": "Солнце и ладонь не связаны с присмотром за детьми.", "en": "Sun and handbreadth have nothing to do with watching children."}]),
   Q("dv-1-06",{"he": "המילה \"נַגָּר\" בנויה במשקל של בעלי מקצוע. איזו מילה בנויה באותו משקל?", "ar": "كلمة «נַגָּר» (نجّار) مبنية على وزن أصحاب المهن. أي كلمة مبنية على الوزن نفسه؟", "ru": "Слово «נַגָּר» («столяр») построено по модели названий профессий. Какое слово построено по той же модели?", "en": "The word \"נַגָּר\" (carpenter) follows the pattern for professions. Which word follows the same pattern?"},[{"he": "סֵפֶר", "ar": "סֵפֶר", "ru": "סֵפֶר", "en": "סֵפֶר"}, {"he": "סִפּוּר", "ar": "סִפּוּר", "ru": "סִפּוּר", "en": "סִפּוּר"}, {"he": "סַפָּר", "ar": "סַפָּר", "ru": "סַפָּר", "en": "סַפָּר"}, {"he": "מִסְפָּרַיִם", "ar": "מִסְפָּרַיִם", "ru": "מִסְפָּרַיִם", "en": "מִסְפָּרַיִם"}],2,{"he": "שימו לב לתנועות ולדגש: פתח, דגש באות האמצעית וקמץ.", "ar": "انتبهوا إلى الحركات وإلى الشدّة: فتحة، ثم شدّة في الحرف الأوسط، ثم قمص.", "ru": "Обратите внимание на огласовки и дагеш: патах, дагеш в средней букве и камац.", "en": "Look at the vowels and the dagesh: patah, a dagesh in the middle letter, then qamats."},{"he": "סַפָּר הוא אדם שמספר שיער, כמו שנַגָּר עובד בעץ. שתי המילים בנויות בדגם קַטָּל: פתח, דגש באות האמצעית וקמץ. כך גם טַבָּח וצַבָּע.", "ar": "סַפָּר هو الحلّاق الذي يقصّ الشعر، كما أن נַגָּר يعمل بالخشب. الكلمتان مبنيتان على نمط קַטָּל: فتحة، وشدّة في الحرف الأوسط، وقمص. وكذلك טַבָּח (طبّاخ) وצַבָּע (دهّان).", "ru": "סַפָּר - парикмахер, так же как נַגָּר работает с деревом. Оба слова построены по модели קַטָּל: патах, дагеш в средней букве и камац. Так же טַבָּח («повар») и צַבָּע («маляр»).", "en": "A סַפָּר cuts hair, just as a נַגָּר works with wood. Both words follow the קַטָּל pattern: patah, a dagesh in the middle letter, and qamats. So do טַבָּח (cook) and צַבָּע (painter)."},null,[{"he": "סֵפֶר הוא חפץ ולא בעל מקצוע, והוא בנוי בדגם אחר.", "ar": "סֵפֶר (كتاب) شيء وليس صاحب مهنة، وهو مبني على نمط آخر.", "ru": "סֵפֶר («книга») - предмет, а не профессия, и модель у него другая.", "en": "סֵפֶר (book) is an object, not a profession, and has another pattern."}, {"he": "סִפּוּר הוא שם פעולה, בדגם קִטּוּל.", "ar": "סִפּוּר (قصة) اسم فعل على نمط קִטּוּל.", "ru": "סִפּוּר («рассказ») - имя действия по модели קִטּוּל.", "en": "סִפּוּר (story) is an action noun in the קִטּוּל pattern."}, null, {"he": "מִסְפָּרַיִם הן כלי לגזירה, ולא בעל מקצוע.", "ar": "מִסְפָּרַיִם (مقص) أداة للقصّ، وليست صاحب مهنة.", "ru": "מִסְפָּרַיִם («ножницы») - инструмент, а не профессия.", "en": "מִסְפָּרַיִם (scissors) is a cutting tool, not a profession."}])

  [
   Q("ha-derive-2-1",{"he": "המילה \"רַמְזוֹר\" נוצרה בהלחם בסיסים. מאילו שתי מילים הולחמה?", "ar": "كلمة «רַמְזוֹר» نشأت بدمج كلمتين. من أي كلمتين دُمجت؟", "ru": "Слово «רַמְזוֹר» образовано слиянием. Из каких двух слов?", "en": "The word \"רַמְזוֹר\" is a blend. Which two words form it?"},[{"he": "רֶמֶז + אוֹר", "ar": "רֶמֶז + אוֹר (רמז ואור)", "ru": "רֶמֶז + אוֹר", "en": "רֶמֶז + אוֹר (sign + light)"}, {"he": "רֶמֶז + זוֹרֵם", "ar": "רֶמֶז + זוֹרֵם", "ru": "רֶמֶז + זוֹרֵם", "en": "רֶמֶז + זוֹרֵם"}, {"he": "רָמָה + זוֹר", "ar": "רָמָה + זוֹר", "ru": "רָמָה + זוֹר", "en": "רָמָה + זוֹר"}, {"he": "רֶמֶז + זֵר", "ar": "רֶמֶז + זֵר", "ru": "רֶמֶז + זֵר", "en": "רֶמֶז + זֵר"}],0,{"he": "הרמזור נותן אותות באמצעות משהו זוהר.", "ar": "الرامزور يعطي إشارات بواسطة شيء مضيء.", "ru": "Рамзор подаёт сигналы с помощью чего-то светящегося.", "en": "The traffic light gives signals by means of something glowing."},{"he": "הלחם בסיסים לוקח חלק מכל מילה: רמז נתן את רמז, ואור נתן את ור, ויחד נוצר רמזור, מתקן המאיר ונותן רמזים לנהגים. דוגמה נוספת: מגדלור הוא הלחם של מגדל ואור.", "ar": "دمج الكلمات يأخذ جزءًا من كل كلمة: רמז أعطت רמז، وאור أعطت ור، ومعًا نشأ רמזור، جهاز يضيء ويعطي إشارات للسائقين. مثال آخر: מגדלור هو دمج מגדל وאור.", "ru": "Слияние берёт часть каждого слова: רמז дало רמז, а אור дало ור, и вместе получился רמזור - прибор, который светит и подаёт сигналы водителям. Другой пример: מגדלור - слияние מגדל и אור.", "en": "A blend takes part of each word: רמז gave רמז and אור gave ור, forming רמזור, a device that lights up and gives drivers signals. Another example: מגדלור blends מגדל and אור."},null,[null, {"he": "החלק השני ברמזור בא מן אור, ולא מן זורם; לרמזור אין קשר לזרימה.", "ar": "الجزء الثاني من רמזור جاء من אור وليس من זורם؛ الرامزور لا علاقة له بالجريان.", "ru": "Вторая часть רמזור происходит от אור, а не от זורם; светофор не связан с течением.", "en": "The second part of רמזור comes from אור, not from זורם; a traffic light has nothing to do with flowing."}, {"he": "רמה פירושה מקום גבוה; אין בה קשר לאותות דרך.", "ar": "רָמָה تعني مكانًا مرتفعًا؛ لا علاقة لها بإشارات الطريق.", "ru": "רָמָה значит возвышенность; нет связи с дорожными сигналами.", "en": "רָמָה means a high place; no connection to road signals."}, {"he": "זֵר פירושו זר פרחים; אינו קשור לרמזור.", "ar": "זֵר تعني باقة زهور؛ لا علاقة لها بالرامزور.", "ru": "זֵר значит букет цветов; не связан со светофором.", "en": "זֵר means a bouquet; unrelated to the traffic light."}]),
   Q("ha-derive-2-2",{"he": "המילה \"עִיתּוֹנַאי\" נוצרה מן המילה עיתון בגזירה קווית. מהי גזירה קווית?", "ar": "كلمة «עִיתּוֹנַאי» نشأت من كلمة עיתון بالاشتقاق الخطي. ما هو الاشتقاق الخطي؟", "ru": "Слово «עִיתּוֹנַאי» образовано от слова עיתון линейным способом. Что такое линейное словообразование?", "en": "The word \"עִיתּוֹנַאי\" was formed from the word עיתון by linear derivation. What is linear derivation?"},[{"he": "חיבור של שתי מילים קיימות ליצירת מילה חדשה אחת", "ar": "دمج كلمتين موجودتين لإنشاء كلمة جديدة واحدة", "ru": "соединение двух существующих слов для создания одного нового", "en": "joining two existing words to create one new word"}, {"he": "קיצור של מילה ארוכה לצורה קצרה יותר", "ar": "اختصار كلمة طويلة إلى صيغة أقصر", "ru": "сокращение длинного слова до более короткой формы", "en": "shortening a long word to a shorter form"}, {"he": "שאילת מילה שלמה משפה אחרת", "ar": "اقتراض كلمة كاملة من لغة أخرى", "ru": "заимствование целого слова из другого языка", "en": "borrowing a whole word from another language"}, {"he": "הוספת צורן בתחילת מילה קיימת או בסופה", "ar": "إضافة سابقة أو لاحقة إلى كلمة موجودة", "ru": "добавление приставки или суффикса к готовому слову", "en": "adding a prefix or suffix to an existing word"}],3,{"he": "בגזירה קווית המילה הקיימת נשארת שלמה, ומצרפים לה חלק קטן.", "ar": "في الاشتقاق الخطي تبقى الكلمة الموجودة كاملة، ويُضاف إليها جزء صغير.", "ru": "При линейном способе исходное слово остаётся целым, и к нему присоединяют небольшую часть.", "en": "In linear derivation the existing word stays whole, and a small part is attached to it."},{"he": "במילה עיתונאי המילה עיתון נשארה שלמה, ובסופה נוסף הצורן אי, שמציין בעל מקצוע. כך נוצרות מילים רבות: למשל מטבחון מן מטבח, וספרן מן ספר. לעומת זאת, בגזירה מסורגת משבצים את אותיות השורש בתבנית, כמו תחבורה מן ח ב ר, והלחם בסיסים מחבר שתי מילים, כמו רמזור.", "ar": "في كلمة עיתונאי بقيت كلمة עיתון كاملة، وأُضيفت في آخرها اللاحقة אי التي تدل على صاحب المهنة. هكذا تُنشأ كلمات كثيرة: مثل מטבחון من מטבח، وספרן من ספר. في المقابل، في الاشتقاق غير الخطي تُصبّ حروف الجذر في وزن، مثل תחבורה من ח ב ר، ودمج الكلمات يجمع كلمتين، مثل רמזור.", "ru": "В слове עיתונאי слово עיתון осталось целым, а в конце добавлен суффикс אי, обозначающий профессию. Так образуется много слов: например מטבחון от מטבח и ספרן от ספר. В отличие от этого, при нелинейном способе буквы корня вставляют в модель, как תחבורה от ח ב ר, а слияние соединяет два слова, как רמזור.", "en": "In עיתונאי the word עיתון stayed whole, and the suffix אי, which marks a profession, was added at its end. Many words form this way: for example מטבחון from מטבח and ספרן from ספר. By contrast, in non-linear derivation the root letters are set into a pattern, like תחבורה from ח ב ר, and a blend joins two words, like רמזור."},null,[{"he": "חיבור שתי מילים הוא הלחם בסיסים, לא גזירה קווית.", "ar": "دمج كلمتين هو دمج الأساسات، وليس اشتقاقًا خطيًا.", "ru": "Соединение двух слов - это слияние, а не линейное словообразование.", "en": "Joining two words is blending, not linear derivation."}, {"he": "קיצור מילה הוא דרך אחרת: למשל הפיכת שם משרד לראשי תיבות.", "ar": "اختصار الكلمة طريقة أخرى: مثل تحويل اسم المكتب إلى حروف أولية.", "ru": "Сокращение слова - другой способ, например превращение названия в аббревиатуру.", "en": "Shortening a word is a different way, like turning a name into an acronym."}, {"he": "שאילה היא לקיחת מילה מוכנה משפה זרה, כמו טלפון.", "ar": "الاقتراض هو أخذ كلمة جاهزة من لغة أجنبية، مثل טלפון.", "ru": "Заимствование - взятие готового слова из иностранного языка, как טלפון.", "en": "Borrowing is taking a ready word from a foreign language, like טלפון."}, null]),
   Q("ha-derive-2-3",{"he": "איזו מהמילים הבאות היא מילה שאולה בעברית?", "ar": "أي من الكلمات التالية كلمة دخيلة في العبرية؟", "ru": "Какое из следующих слов является заимствованным в иврите?", "en": "Which of the following words is a loanword in Hebrew?"},[{"he": "סִפְרִיָּה", "ar": "סִפְרִיָּה", "ru": "סִפְרִיָּה", "en": "סִפְרִיָּה (library)"}, {"he": "כִּתָּה", "ar": "כִּתָּה", "ru": "כִּתָּה", "en": "כִּתָּה (classroom)"}, {"he": "אוּנִיבֶרְסִיטָה", "ar": "אוּנִיבֶרְסִיטָה", "ru": "אוּנִיבֶרְסִיטָה", "en": "אוּנִיבֶרְסִיטָה (university)"}, {"he": "מִבְחָן", "ar": "מִבְחָן", "ru": "מִבְחָן", "en": "מִבְחָן (test)"}],2,{"he": "איזו מילה נשמעת דומה במילים ממנה בשפות אחרות של העולם?", "ar": "أي كلمة تبدو مشابهة لمقابلها في لغات العالم الأخرى؟", "ru": "Какое слово звучит похоже на его аналоги в других языках мира?", "en": "Which word sounds similar to its counterparts in other world languages?"},{"he": "אוניברסיטה נשאלה מלטינית דרך שפות אירופה, ולכן היא דומה לצורות שלה בשפות רבות. שאר המילים עבריות מקוריות: ספרייה מן השורש ס פ ר, כיתה מן כ ת ת ומבחן מן ב ח נ. מילים שאולות נוספות: טלפון, אקדמיה וטלוויזיה.", "ar": "كلمة אוניברסיטה اقترضت من اللاتينية عبر لغات أوروبية، ولذلك تشبه صيغها في لغات كثيرة. بقية الكلمات عبرية أصلية: ספרייה من الجذر ס פ ר، وכיתה من כ ת ת، ומבחן من ב ח נ. كلمات دخيلة أخرى: טלפון وאקדמיה וטלוויזיה.", "ru": "Слово אוניברסיטה заимствовано из латыни через европейские языки, поэтому звучит похоже во многих языках. Остальные слова исконно ивритские: ספרייה от корня ס פ ר, כיתה от כ ת ת и מבחן от ב ח נ. Другие заимствования: טלפון, אקדמיה и טלוויזיה.", "en": "אוניברסיטה was borrowed from Latin through European languages, so it sounds similar in many languages. The other words are native Hebrew: ספרייה from the root ס פ ר, כיתה from כ ת ת, and מבחן from ב ח נ. Other loanwords: טלפון, אקדמיה and טלוויזיה."},null,[{"he": "ספרייה עברית מקורית, מן השורש ס פ ר.", "ar": "ספרייה عبرية أصلية، من الجذر ס פ ר.", "ru": "ספרייה - исконно ивритское, от корня ס פ ר.", "en": "ספרייה is native Hebrew, from the root ס פ ר."}, {"he": "כיתה עברית מקורית, מן השורש כ ת ת.", "ar": "כיתה עברית מקורית, מן השורש כ ת ת.", "ru": "כיתה - исконно ивритское, от корня כ ת ת.", "en": "כיתה is native Hebrew, from the root כ ת ת."}, null, {"he": "מבחן עברי מקורי, מן השורש ב ח נ.", "ar": "מבחן עברי מקורי, מן השורש ב ח נ.", "ru": "מבחן - исконно ивритское, от корня ב ח נ.", "en": "מבחן is native Hebrew, from the root ב ח נ."}]),
   Q("dv-2-01",{"he": "מהו השורש של הפועל \"הִכִּיר\"?", "ar": "ما جذر الفعل «הִכִּיר» (عرَف)؟", "ru": "Какой корень у глагола «הִכִּיר» («узнал»)?", "en": "What is the root of the verb \"הִכִּיר\" (recognized)?"},[{"he": "ה־כ־ר", "ar": "ה־כ־ר", "ru": "ה־כ־ר", "en": "ה־כ־ר"}, {"he": "נ־כ־ר", "ar": "נ־כ־ר", "ru": "נ־כ־ר", "en": "נ־כ־ר"}, {"he": "כ־ר־ה", "ar": "כ־ר־ה", "ru": "כ־ר־ה", "en": "כ־ר־ה"}, {"he": "כ־י־ר: הפועל בלי האות ה", "ar": "כ־י־ר: الفعل بدون حرف ה", "ru": "כ־י־ר: глагол без буквы ה", "en": "כ־י־ר: the verb without the letter ה"}],1,{"he": "הדגש באות כ מסמן שאות שורש נעלמה לפניה.", "ar": "الشدّة في حرف כ تدل على أن حرفًا من الجذر اختفى قبله.", "ru": "Дагеш в букве כ показывает, что перед ней исчезла буква корня.", "en": "The dagesh in כ shows that a root letter disappeared before it."},{"he": "בבניין הפעיל, האות נ של השורש נבלעת ומשאירה דגש: הִנְכִּיר הפך להִכִּיר. כך גם הִפִּיל מן נ־פ־ל. את הנ רואים בפועל הִתְנַכֵּר, מאותו שורש.", "ar": "في وزن הפעיל، يُدغم حرف נ من الجذر ويترك شدّة: הִנְכִּיר صارت הִכִּיר. وكذلك הִפִּיל من נ־פ־ל. ونرى الـנ في الفعل הִתְנַכֵּר من الجذر نفسه.", "ru": "В биньяне הפעיל буква נ корня ассимилируется и оставляет дагеш: הִנְכִּיר стало הִכִּיר. Так же הִפִּיל от נ־פ־ל. Букву נ видно в глаголе הִתְנַכֵּר от того же корня.", "en": "In hif'il the root letter נ assimilates and leaves a dagesh: הִנְכִּיר became הִכִּיר. Likewise הִפִּיל from נ־פ־ל. You can see the נ in הִתְנַכֵּר, from the same root."},null,[{"he": "ה היא תוספת של בניין הפעיל, ולא אות שורש.", "ar": "ה زائدة من وزن הפעיל، وليست حرفًا من الجذر.", "ru": "ה - добавка биньяна הפעיל, а не буква корня.", "en": "ה is added by the hif'il binyan; it is not a root letter."}, null, {"he": "אין ה בסוף השורש; האות האחרונה היא ר.", "ar": "لا توجد ה في آخر الجذر؛ الحرف الأخير هو ר.", "ru": "В конце корня нет ה; последняя буква - ר.", "en": "There is no ה at the end of the root; the last letter is ר."}, {"he": "י היא חלק מדגם הפעיל, כמו בהִדְלִיק, ולא אות שורש.", "ar": "י جزء من نمط הפעיל، كما في הִדְלִיק، وليست من الجذر.", "ru": "י - часть модели הפעיל, как в הִדְלִיק, а не буква корня.", "en": "י is part of the hif'il pattern, as in הִדְלִיק, not a root letter."}]),
   Q("dv-2-02",{"he": "מהו השורש של המילה \"מוֹשָׁב\"?", "ar": "ما جذر كلمة «מוֹשָׁב» (مقعد)؟", "ru": "Какой корень у слова «מוֹשָׁב» («сиденье»)?", "en": "What is the root of the word \"מוֹשָׁב\" (seat)?"},[{"he": "מ־ו־ש", "ar": "מ־ו־ש", "ru": "מ־ו־ש", "en": "מ־ו־ש"}, {"he": "ש־ו־ב, כמו בפועל שָׁב", "ar": "ש־ו־ב، كما في الفعل שָׁב (عاد)", "ru": "ש־ו־ב, как в глаголе שָׁב («вернулся»)", "en": "ש־ו־ב, as in the verb שָׁב (returned)"}, {"he": "נ־ש־ב", "ar": "נ־ש־ב", "ru": "נ־ש־ב", "en": "נ־ש־ב"}, {"he": "י־ש־ב", "ar": "י־ש־ב", "ru": "י־ש־ב", "en": "י־ש־ב"}],3,{"he": "חשבו על מה שעושים כשמתיישבים על כיסא.", "ar": "فكّروا فيما نفعله حين نجلس على كرسي.", "ru": "Подумайте, что делают, когда садятся на стул.", "en": "Think about what you do when you take a chair."},{"he": "מושב הוא מקום שיושבים עליו. השורש הוא י־ש־ב: אחרי האות מ, הי של השורש הפכה ל־ו. כך גם מוֹלֶדֶת מן י־ל־ד.", "ar": "מושב مكان نجلس عليه. الجذر هو י־ש־ב: بعد حرف מ تحوّلت الـי من الجذر إلى ו. وكذلك מוֹלֶדֶת (وطن) من י־ל־ד.", "ru": "מושב - место, на котором сидят. Корень י־ש־ב: после буквы מ корневая י превратилась в ו. Так же מוֹלֶדֶת («родина») от י־ל־ד.", "en": "A מושב is a place you sit on. The root is י־ש־ב: after the letter מ, the root's י turned into ו. Likewise מוֹלֶדֶת (homeland) from י־ל־ד."},null,[{"he": "מ היא תוספת של המשקל, ולא אות שורש.", "ar": "מ زائدة من الوزن، وليست من الجذر.", "ru": "מ - добавка модели, а не буква корня.", "en": "מ is added by the pattern; it is not a root letter."}, {"he": "ש־ו־ב הוא שורש של חזרה, ולא של ישיבה.", "ar": "ש־ו־ב جذر العودة، لا جذر الجلوس.", "ru": "ש־ו־ב - корень возвращения, а не сидения.", "en": "ש־ו־ב is the root of returning, not of sitting."}, {"he": "נ־ש־ב הוא שורש של נשיבת רוח.", "ar": "נ־ש־ב جذر هبوب الريح.", "ru": "נ־ש־ב - корень дуновения ветра.", "en": "נ־ש־ב is the root of wind blowing."}, null]),
   Q("dv-2-03",{"he": "איזו מילה אינה שייכת למשפחת השורש ש־מ־ר?", "ar": "أي كلمة لا تنتمي إلى عائلة الجذر ש־מ־ר؟", "ru": "Какое слово не относится к семье корня ש־מ־ר?", "en": "Which word does not belong to the family of the root ש־מ־ר?"},[{"he": "שׁוֹמֵר", "ar": "שׁוֹמֵר", "ru": "שׁוֹמֵר", "en": "שׁוֹמֵר"}, {"he": "מִשְׁמֶרֶת", "ar": "מִשְׁמֶרֶת", "ru": "מִשְׁמֶרֶת", "en": "מִשְׁמֶרֶת"}, {"he": "שֶׁמֶשׁ", "ar": "שֶׁמֶשׁ", "ru": "שֶׁמֶשׁ", "en": "שֶׁמֶשׁ"}, {"he": "שִׁמּוּרִים", "ar": "שִׁמּוּרִים", "ru": "שִׁמּוּרִים", "en": "שִׁמּוּרִים"}],2,{"he": "בדקו באילו מילים מופיעות כל שלוש אותיות השורש.", "ar": "افحصوا في أي كلمات تظهر حروف الجذر الثلاثة كلها.", "ru": "Проверьте, в каких словах есть все три буквы корня.", "en": "Check which words contain all three root letters."},{"he": "בשֶׁמֶשׁ יש ש ו־מ, אבל אין ר. שומר, משמרת ושימורים קשורות כולן לשמירה: שימורים הם מזון שנשמר בקופסה. לכן רק שמש אינה מן המשפחה.", "ar": "في שֶׁמֶשׁ يوجد ש وמ، لكن لا يوجد ר. שומר وמשמרת وשימורים كلها مرتبطة بالحفظ: שימורים طعام محفوظ في علبة. لذلك فقط שמש ليست من العائلة.", "ru": "В שֶׁמֶשׁ есть ש и מ, но нет ר. שומר, משמרת и שימורים связаны с сохранением: שימורים - консервы, еда, сохранённая в банке. Поэтому только שמש не из этой семьи.", "en": "שֶׁמֶשׁ has ש and מ but no ר. שומר, משמרת and שימורים all relate to keeping: שימורים are canned food kept in a tin. So only שמש is not in the family."},null,[{"he": "שׁוֹמֵר הוא מי ששומר, מן השורש ש־מ־ר.", "ar": "שׁוֹמֵר هو الحارس، من الجذر ש־מ־ר.", "ru": "שׁוֹמֵר - сторож, от корня ש־מ־ר.", "en": "שׁוֹמֵר is a guard, from the root ש־מ־ר."}, {"he": "מִשְׁמֶרֶת היא זמן של שמירה, מן השורש ש־מ־ר.", "ar": "מִשְׁמֶרֶת مناوبة حراسة، من الجذر ש־מ־ר.", "ru": "מִשְׁמֶרֶת - смена дежурства, от корня ש־מ־ר.", "en": "מִשְׁמֶרֶת is a shift of guarding, from the root ש־מ־ר."}, null, {"he": "שִׁמּוּרִים הם מזון שנשמר, מן השורש ש־מ־ר.", "ar": "שִׁמּוּרִים طعام محفوظ، من الجذر ש־מ־ר.", "ru": "שִׁמּוּרִים - сохранённая еда, от корня ש־מ־ר.", "en": "שִׁמּוּרִים are preserved food, from the root ש־מ־ר."}]),
   Q("dv-2-04",{"he": "המילה \"דַּחְפּוֹר\" היא הלחם של שתי מילים. מהן?", "ar": "كلمة «דַּחְפּוֹר» (جرّافة) دمج لكلمتين. ما هما؟", "ru": "Слово «דַּחְפּוֹר» («бульдозер») - слияние двух слов. Каких?", "en": "The word \"דַּחְפּוֹר\" (bulldozer) blends two words. Which?"},[{"he": "דָּחַף + חָפַר", "ar": "דָּחַף + חָפַר (دفع + حفر)", "ru": "דָּחַף + חָפַר (толкнул + копал)", "en": "דָּחַף + חָפַר (pushed + dug)"}, {"he": "דָּחוּף + בּוֹר", "ar": "דָּחוּף + בּוֹר (عاجل + حفرة)", "ru": "דָּחוּף + בּוֹר (срочный + яма)", "en": "דָּחוּף + בּוֹר (urgent + pit)"}, {"he": "דֶּרֶךְ + פּוֹרֶצֶת", "ar": "דֶּרֶךְ + פּוֹרֶצֶת (طريق + شاقّة الطريق)", "ru": "דֶּרֶךְ + פּוֹרֶצֶת (дорога + прорывающая)", "en": "דֶּרֶךְ + פּוֹרֶצֶת (road + breaking through)"}, {"he": "דָּחַס + פַּר", "ar": "דָּחַס + פַּר (ضغط + ثور)", "ru": "דָּחַס + פַּר (сжал + бык)", "en": "דָּחַס + פַּר (pressed + bull)"}],0,{"he": "חשבו על שתי הפעולות שהמכונה הזאת עושה באדמה.", "ar": "فكّروا في العمليتين اللتين تقوم بهما هذه الآلة في الأرض.", "ru": "Подумайте о двух действиях, которые эта машина делает с землёй.", "en": "Think of the two actions this machine does to the ground."},{"he": "דחפור דוחף עפר וחופר באדמה. מן דָּחַף נלקח דחף, ומן חָפַר נלקח פר, והאות ח משותפת לשתיהן. יחד נוצרה מילה אחת: דחפור.", "ar": "الجرّافة تدفع التراب وتحفر الأرض. من דָּחַף أُخذ דחף، ومن חָפַר أُخذ פר، وحرف ח مشترك بينهما. ومعًا نشأت كلمة واحدة: דחפור.", "ru": "Бульдозер толкает землю и копает. Из דָּחַף взято דחף, из חָפַר - פר, а буква ח общая для обоих. Вместе получилось одно слово: דחפור.", "en": "A bulldozer pushes earth and digs. From דָּחַף came דחף, from חָפַר came פר, and the letter ח is shared. Together they made one word: דחפור."},null,[null, {"he": "דחפור אינו קשור לבור או לדחיפות; הוא דוחף וחופר.", "ar": "الجرّافة لا علاقة لها بالحفرة أو بالاستعجال؛ إنها تدفع وتحفر.", "ru": "Бульдозер не связан с ямой или срочностью; он толкает и копает.", "en": "A bulldozer is not about a pit or urgency; it pushes and digs."}, {"he": "דחפור אינו קשור לדרך או לפריצה, אלא לדחיפה ולחפירה.", "ar": "الجرّافة لا علاقة لها بالطريق أو بالشقّ، بل بالدفع والحفر.", "ru": "Бульдозер связан не с дорогой и прорывом, а с толканием и копанием.", "en": "A bulldozer is not about roads or breaking through, but pushing and digging."}, {"he": "דחפור אינו דוחס ואינו קשור לפר; הוא דוחף וחופר.", "ar": "الجرّافة لا تضغط ولا علاقة لها بالثور؛ إنها تدفع وتحفر.", "ru": "Бульдозер не сжимает и не связан с быком; он толкает и копает.", "en": "A bulldozer does not press and has nothing to do with a bull; it pushes and digs."}]),
   Q("dv-2-05",{"he": "מה משותף למילים מִסְפָּרָה, מִכְבָּסָה ומִסְעָדָה?", "ar": "ما المشترك بين الكلمات מִסְפָּרָה (صالون حلاقة) وמִכְבָּסָה (مغسلة) وמִסְעָדָה (مطعم)؟", "ru": "Что общего у слов מִסְפָּרָה («парикмахерская»), מִכְבָּסָה («прачечная») и מִסְעָדָה («ресторан»)?", "en": "What do the words מִסְפָּרָה (barbershop), מִכְבָּסָה (laundry) and מִסְעָדָה (restaurant) have in common?"},[{"he": "כולן מאותו שורש", "ar": "كلها من الجذر نفسه", "ru": "у них один корень", "en": "they all have the same root"}, {"he": "כולן פעלים בבניין פִּעֵל", "ar": "كلها أفعال في وزن פִּעֵל", "ru": "все они глаголы в биньяне פִּעֵל", "en": "they are all verbs in the pi'el binyan"}, {"he": "כולן הלחם של שתי מילים קיימות", "ar": "كلها دمج لكلمتين موجودتين في اللغة", "ru": "все они слияния двух существующих слов", "en": "they are all blends of two existing words"}, {"he": "שמות מקום באותו משקל", "ar": "أسماء أماكن على الوزن نفسه", "ru": "названия мест по одной модели", "en": "place names in the same pattern"}],3,{"he": "שימו לב לאות הראשונה ולאות האחרונה בשלוש המילים.", "ar": "انتبهوا إلى الحرف الأول والحرف الأخير في الكلمات الثلاث.", "ru": "Обратите внимание на первую и последнюю буквы в трёх словах.", "en": "Notice the first and last letters of the three words."},{"he": "שלוש המילים בנויות בדגם מִקְטָלָה: מ בהתחלה, ה בסוף ושורש באמצע. מספרה מן ס־פ־ר, מכבסה מן כ־ב־ס ומסעדה מן ס־ע־ד. בדגם הזה יש שמות רבים של מקומות.", "ar": "الكلمات الثلاث مبنية على نمط מִקְטָלָה: מ في البداية، وה في النهاية، والجذر في الوسط. מספרה من ס־פ־ר، وמכבסה من כ־ב־ס، وמסעדה من ס־ע־ד. في هذا النمط أسماء كثيرة لأماكن.", "ru": "Все три слова построены по модели מִקְטָלָה: מ в начале, ה в конце и корень посередине. מספרה от ס־פ־ר, מכבסה от כ־ב־ס, מסעדה от ס־ע־ד. По этой модели образовано много названий мест.", "en": "All three follow the מִקְטָלָה pattern: מ at the start, ה at the end, and the root in the middle. מספרה is from ס־פ־ר, מכבסה from כ־ב־ס, מסעדה from ס־ע־ד. Many place names use this pattern."},null,[{"he": "לכל מילה שורש אחר: ס־פ־ר, כ־ב־ס, ס־ע־ד.", "ar": "لكل كلمة جذر مختلف: ס־פ־ר، כ־ב־ס، ס־ע־ד.", "ru": "У каждого слова свой корень: ס־פ־ר, כ־ב־ס, ס־ע־ד.", "en": "Each word has a different root: ס־פ־ר, כ־ב־ס, ס־ע־ד."}, {"he": "אלה שמות עצם, ולא פעלים.", "ar": "هذه أسماء، وليست أفعالًا.", "ru": "Это существительные, а не глаголы.", "en": "These are nouns, not verbs."}, {"he": "כל מילה נוצרה משורש ומשקל, ולא משתי מילים.", "ar": "كل كلمة نشأت من جذر ووزن، لا من كلمتين.", "ru": "Каждое слово образовано из корня и модели, а не из двух слов.", "en": "Each word comes from a root and a pattern, not from two words."}, null]),
   Q("dv-2-06",{"he": "איזו מילה נוצרה בגזירה קווית, כלומר מילה קיימת ועוד סופית?", "ar": "أي كلمة نشأت بالاشتقاق الخطّي، أي كلمة موجودة ولاحقة؟", "ru": "Какое слово образовано линейно, то есть из готового слова и суффикса?", "en": "Which word was formed by linear derivation, that is, an existing word plus a suffix?"},[{"he": "מִכְתָּב", "ar": "מִכְתָּב", "ru": "מִכְתָּב", "en": "מִכְתָּב"}, {"he": "עִתּוֹנַאי", "ar": "עִתּוֹנַאי", "ru": "עִתּוֹנַאי", "en": "עִתּוֹנַאי"}, {"he": "מִגְדַּלּוֹר", "ar": "מִגְדַּלּוֹר", "ru": "מִגְדַּלּוֹר", "en": "מִגְדַּלּוֹר"}, {"he": "אוּנִיבֶרְסִיטָה", "ar": "אוּנִיבֶרְסִיטָה", "ru": "אוּנִיבֶרְסִיטָה", "en": "אוּנִיבֶרְסִיטָה"}],1,{"he": "חפשו מילה שלמה ואחריה סיומת קצרה, שמופיעה גם בסוף מילים רבות אחרות.", "ar": "ابحثوا عن كلمة كاملة بعدها لاحقة قصيرة تظهر أيضًا في آخر كلمات كثيرة أخرى.", "ru": "Найдите целое слово с коротким суффиксом, который встречается в конце многих других слов.", "en": "Find a whole word followed by a short ending that also appears at the end of many other words."},{"he": "עיתונאי בנוי מן המילה עִתּוֹן ועוד הסופית אי, בשורה אחת. כך נוצרו גם חַשְׁמַלַּאי וכּוֹכָבִית. מכתב נוצר משורש ומשקל, מגדלור בהלחם, ואוניברסיטה שאולה.", "ar": "עיתונאי مبنية من كلمة עִתּוֹן (صحيفة) ولاحقة אי، في خط واحد. وهكذا نشأت חַשְׁמַלַּאי (كهربائي) وכּוֹכָבִית (نجمة صغيرة). מכתב نشأت من جذر ووزن، وמגדלור بالدمج، وאוניברסיטה مستعارة.", "ru": "עיתונאי построено из слова עִתּוֹן («газета») и суффикса אי, в одну линию. Так же образованы חַשְׁמַלַּאי («электрик») и כּוֹכָבִית («звёздочка»). מכתב - из корня и модели, מגדלור - слияние, а אוניברסיטה - заимствование.", "en": "עיתונאי is built from the word עִתּוֹן (newspaper) plus the suffix אי, in one line. חַשְׁמַלַּאי (electrician) and כּוֹכָבִית (asterisk) were formed the same way. מכתב comes from a root and pattern, מגדלור is a blend, and אוניברסיטה is borrowed."},null,[{"he": "מִכְתָּב נוצר מן השורש כ־ת־ב ומשקל, ולא ממילה וסופית.", "ar": "מִכְתָּב نشأت من الجذر כ־ת־ב ووزن، لا من كلمة ولاحقة.", "ru": "מִכְתָּב образовано из корня כ־ת־ב и модели, а не из слова и суффикса.", "en": "מִכְתָּב comes from the root כ־ת־ב and a pattern, not a word plus suffix."}, null, {"he": "מִגְדַּלּוֹר הוא הלחם של מגדל ואור, ולא מילה וסופית.", "ar": "מִגְדַּלּוֹר دمج لـ מגדל وאור، لا كلمة ولاحقة.", "ru": "מִגְדַּלּוֹר - слияние מגדל и אור, а не слово с суффиксом.", "en": "מִגְדַּלּוֹר blends מגדל and אור; it is not a word plus suffix."}, {"he": "אוּנִיבֶרְסִיטָה היא מילה שאולה משפה אחרת.", "ar": "אוּנִיבֶרְסִיטָה كلمة مستعارة من لغة أخرى.", "ru": "אוּנִיבֶרְסִיטָה - слово, заимствованное из другого языка.", "en": "אוּנִיבֶרְסִיטָה is a word borrowed from another language."}])
