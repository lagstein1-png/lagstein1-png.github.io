Q("ha-noun-1-1",{"he": "מה מינה הדקדוקי של \"מחברת\"?", "ar": "ما الجنس النحوي لكلمة «מחברת»؟", "ru": "Какого грамматического рода слово «מחברת»?", "en": "What is the grammatical gender of \"מחברת\"?"},[{"he": "זכר", "ar": "مذكر", "ru": "мужской", "en": "masculine"}, {"he": "נקבה", "ar": "مؤنث", "ru": "женский", "en": "feminine"}, {"he": "זכר ונקבה יחד", "ar": "مذكر ومؤنث معًا", "ru": "оба рода одновременно", "en": "both genders at once"}, {"he": "אין מין דקדוקי", "ar": "لا جنس نحوي لها", "ru": "нет грамматического рода", "en": "no grammatical gender"}],1,{"he": "בדקו איזו צורת תואר מתאימה לשם.", "ar": "افحصوا صيغة الصفة التي توافق الاسم.", "ru": "Проверьте, какая форма прилагательного согласуется с существительным.", "en": "Check which adjective form agrees with the noun."},{"he": "אומרים \"מחברת חדשה\", ולכן השם נקבי. למשל גם \"מפה חדשה\" היא נקבה.", "ar": "نقول «מחברת חדשה» (دفتر جديد بصيغة المؤنث)، فالاسم مؤنث. وكذلك «מפה חדשה».", "ru": "Говорят «מחברת חדשה» (новая тетрадь), значит, слово женского рода. Так же «מפה חדשה».", "en": "We say \"מחברת חדשה\" (a new notebook), so the noun is feminine. \"מפה חדשה\" is feminine too."},null,[{"he": "התואר המתאים הוא \"חדשה\", לא \"חדש\".", "ar": "الصفة الموافقة هي «חדשה» لا «חדש».", "ru": "Подходит «חדשה», а не «חדש».", "en": "The agreeing adjective is \"חדשה\", not \"חדש\"."}, null, {"he": "שם עצם מסוים זה אינו משמש בשני המינים באותו הקשר.", "ar": "هذا الاسم المحدّد لا يُستعمل بالجنسين في السياق نفسه.", "ru": "Это существительное не употребляется сразу в двух родах в данном значении.", "en": "This noun is not used in both genders in this context."}, {"he": "לשמות עצם בעברית יש מין דקדוקי.", "ar": "للأسماء في العبرية جنس نحوي.", "ru": "У существительных в иврите есть грамматический род.", "en": "Hebrew nouns have grammatical gender."}]),
Q("ha-noun-1-2",{"he": "מה צורת הרבים של \"ספר\"?", "ar": "ما صيغة جمع «ספר» (كتاب)؟", "ru": "Какое множественное число у «ספר» (книга)?", "en": "What is the plural of \"ספר\" (book)?"},[{"he": "ספרות", "ar": "ספרות", "ru": "ספרות", "en": "ספרות"}, {"he": "ספרים", "ar": "ספרים", "ru": "ספרים", "en": "ספרים"}, {"he": "ספריהם", "ar": "ספריהם", "ru": "ספריהם", "en": "ספריהם"}, {"he": "ספרי", "ar": "ספרי", "ru": "ספרי", "en": "ספרי"}],1,{"he": "הבחינו בין צורת רבים לבין צורת שייכות.", "ar": "ميّزوا بين الجمع والملكية.", "ru": "Отличайте множественное число от притяжательной формы.", "en": "Distinguish plural from possession."},{"he": "\"ספרים\" הוא הרבים של \"ספר\": \"בספרייה יש ספרים רבים\". לעומתו \"ספריהם\" מציין שייכות.", "ar": "«ספרים» جمع «ספר»: «في المكتبة كتب كثيرة». أما «ספריהם» فيدل على الملكية.", "ru": "«ספרים» - множественное число от «ספר»: «В библиотеке много книг». «ספריהם» выражает принадлежность.", "en": "\"ספרים\" is the plural of \"ספר\": \"There are many books in the library.\" \"ספריהם\" indicates possession."},null,[{"he": "\"ספרות\" היא מילה אחרת, למשל שם התחום העוסק ביצירות כתובות.", "ar": "«ספרות» كلمة أخرى، مثل اسم مجال الأدب.", "ru": "«ספרות» - другое слово, например «литература».", "en": "\"ספרות\" is another word, for example \"literature\"."}, null, {"he": "זו צורת רבים עם כינוי שייכות, ולא רבים בלבד.", "ar": "هذه صيغة جمع مع ضمير ملكية، وليست جمعًا فقط.", "ru": "Это множественное число с притяжательным суффиксом, не просто множественное число.", "en": "This is plural with a possessive suffix, not plain plural."}, {"he": "זו צורה המציינת שייכות לדובר, לא צורת רבים רגילה.", "ar": "تدل هذه الصيغة على ملكية المتكلم، لا على جمع عادي.", "ru": "Эта форма указывает на принадлежность говорящему, а не на обычное множественное число.", "en": "This indicates possession by the speaker, not an ordinary plural."}]),
Q("ha-noun-1-3",{"he": "איזה שם עצם מתאים לצירוף \"שלוש ___\"?", "ar": "أي اسم يناسب التركيب «שלוש ___» (ثلاث)؟", "ru": "Какое существительное подходит к «שלוש ___» (три)?", "en": "Which noun fits \"שלוש ___\" (three)?"},[{"he": "ספרים", "ar": "ספרים", "ru": "ספרים", "en": "ספרים"}, {"he": "שולחנות", "ar": "שולחנות", "ru": "שולחנות", "en": "שולחנות"}, {"he": "מחברות", "ar": "מחברות", "ru": "מחברות", "en": "מחברות"}, {"he": "חלונות", "ar": "חלונות", "ru": "חלונות", "en": "חלונות"}],2,{"he": "בדקו את המין הדקדוקי של כל שם ברבים.", "ar": "افحصوا الجنس النحوي لكل اسم في الجمع.", "ru": "Проверьте род каждого существительного во множественном числе.", "en": "Check the gender of each plural noun."},{"he": "\"מחברת\" היא נקבה, ולכן אומרים \"שלוש מחברות\". למשל: \"שלוש מפות\".", "ar": "«מחברת» مؤنث، لذا نقول «שלוש מחברות». ومثل ذلك «שלוש מפות».", "ru": "«מחברת» женского рода, поэтому говорят «שלוש מחברות». Например: «שלוש מפות».", "en": "\"מחברת\" is feminine, so we say \"שלוש מחברות\". Likewise, \"שלוש מפות\"."},null,[{"he": "\"ספר\" הוא זכר; המספר המתאים הוא \"שלושה\".", "ar": "«ספר» مذكر؛ العدد المناسب هو «שלושה».", "ru": "«ספר» мужского рода; нужно «שלושה».", "en": "\"ספר\" is masculine; use \"שלושה\"."}, {"he": "\"שולחן\" הוא זכר אף שצורת הרבים מסתיימת ב־ות.", "ar": "«שולחן» مذكر رغم أن جمعه ينتهي بـות.", "ru": "«שולחן» мужского рода, хотя множественное число оканчивается на ות.", "en": "\"שולחן\" is masculine although its plural ends in ות."}, null, {"he": "\"חלון\" הוא זכר; המספר המתאים הוא \"שלושה\".", "ar": "«חלון» مذكر؛ العدد المناسب هو «שלושה».", "ru": "«חלון» мужского рода; нужно «שלושה».", "en": "\"חלון\" is masculine; use \"שלושה\"."}]),
Q("nn-1-01",{"he": "איזה שם עצם הוא ממין נקבה, אף שאין בסופו ־ה או ־ת?", "ar": "أي اسم مؤنّث، مع أنه لا ينتهي بـ ־ה أو ־ת؟", "ru": "Какое существительное женского рода, хотя оно не оканчивается на ־ה или ־ת?", "en": "Which noun is feminine, even though it does not end in ־ה or ־ת?"},[{"he": "בית ספר", "ar": "בית ספר", "ru": "בית ספר", "en": "בית ספר"}, {"he": "עיר", "ar": "עיר", "ru": "עיר", "en": "עיר"}, {"he": "יום", "ar": "יום", "ru": "יום", "en": "יום"}, {"he": "שולחן", "ar": "שולחן", "ru": "שולחן", "en": "שולחן"}],1,{"he": "הוסיפו לכל שם את התואר \"גדול\" או \"גדולה\", ובדקו מה נשמע נכון.", "ar": "أضيفوا إلى كل اسم الصفة «גדול» أو «גדולה»، وافحصوا ما يبدو صحيحًا.", "ru": "Добавьте к каждому слову «גדול» или «גדולה» и проверьте, что звучит правильно.", "en": "Add \"גדול\" or \"גדולה\" to each noun and check what sounds right."},{"he": "אומרים \"עיר גדולה\", ולכן \"עיר\" היא נקבה. יש שמות נקבה בלי סיומת, כמו \"ארץ\" ו\"אבן\". התואר מגלה את המין.", "ar": "نقول «עיר גדולה»، لذلك «עיר» مؤنّث. توجد أسماء مؤنّثة بلا لاحقة، مثل «ארץ» و«אבן». الصفة تكشف الجنس.", "ru": "Говорят «עיר גדולה», поэтому «עיר» - женский род. Есть слова женского рода без окончания, как «ארץ» и «אבן». Род видно по прилагательному.", "en": "We say \"עיר גדולה\", so \"עיר\" is feminine. Some feminine nouns have no ending, like \"ארץ\" and \"אבן\". The adjective reveals the gender."},null,[{"he": "\"בית ספר\" הוא זכר: אומרים \"בית ספר גדול\".", "ar": "«בית ספר» مذكّر: نقول «בית ספר גדול».", "ru": "«בית ספר» - мужской род: говорят «בית ספר גדול».", "en": "\"בית ספר\" is masculine: we say \"בית ספר גדול\"."}, null, {"he": "\"יום\" הוא זכר: אומרים \"יום ארוך\".", "ar": "«יום» مذكّر: نقول «יום ארוך».", "ru": "«יום» - мужской род: говорят «יום ארוך».", "en": "\"יום\" is masculine: we say \"יום ארוך\"."}, {"he": "\"שולחן\" הוא זכר: אומרים \"שולחן חדש\".", "ar": "«שולחן» مذكّر: نقول «שולחן חדש».", "ru": "«שולחן» - мужской род: говорят «שולחן חדש».", "en": "\"שולחן\" is masculine: we say \"שולחן חדש\"."}]),
Q("nn-1-02",{"he": "מה צורת הרבים של \"מילה\"?", "ar": "ما صيغة الجمع من «מילה» (كلمة)؟", "ru": "Какая форма множественного числа у «מילה» (слово)?", "en": "What is the plural of \"מילה\" (word)?"},[{"he": "מילים", "ar": "מילים", "ru": "מילים", "en": "מילים"}, {"he": "מילות", "ar": "מילות", "ru": "מילות", "en": "מילות"}, {"he": "מילהים", "ar": "מילהים", "ru": "מילהים", "en": "מילהים"}, {"he": "מילה ומילה", "ar": "מילה ומילה", "ru": "מילה ומילה", "en": "מילה ומילה"}],0,{"he": "יש שמות נקבה שמקבלים ברבים סיומת של זכר.", "ar": "بعض الأسماء المؤنّثة تأخذ في الجمع لاحقة المذكّر.", "ru": "Некоторые слова женского рода получают во мн. числе мужское окончание.", "en": "Some feminine nouns take a masculine ending in the plural."},{"he": "\"מילה\" היא נקבה, אבל ברבים היא מקבלת ־ים: \"מילים\". המין לא משתנה: אומרים \"מילים קשות\". כך גם \"שנה\" ו\"שנים\".", "ar": "«מילה» مؤنّث، لكنها تأخذ في الجمع ־ים: «מילים». الجنس لا يتغيّر: نقول «מילים קשות». ومثلها «שנה» و«שנים».", "ru": "«מילה» - женский род, но во мн. числе получает ־ים: «מילים». Род не меняется: «מילים קשות». Так же «שנה» - «שנים».", "en": "\"מילה\" is feminine, but its plural takes ־ים: \"מילים\". The gender stays: \"מילים קשות\". The same goes for \"שנה\" and \"שנים\"."},null,[null, {"he": "\"מילות\" היא צורת סמיכות, למשל \"מילות השיר\".", "ar": "«מילות» صيغة إضافة، مثل «מילות השיר».", "ru": "«מילות» - сопряжённая форма, например «מילות השיר».", "en": "\"מילות\" is the construct form, as in \"מילות השיר\"."}, {"he": "אין צורה כזו: ה־ה בסוף נעלמת לפני סיומת הרבים.", "ar": "لا توجد هذه الصيغة: تسقط ה الأخيرة قبل لاحقة الجمع.", "ru": "Такой формы нет: конечная ה исчезает перед окончанием мн. числа.", "en": "No such form: the final ה drops before the plural ending."}, {"he": "זו חזרה על היחיד, ולא צורת רבים.", "ar": "هذا تكرار للمفرد، وليس صيغة جمع.", "ru": "Это повтор единственного числа, а не множественное.", "en": "This repeats the singular; it is not a plural form."}]),
Q("nn-1-03",{"he": "באיזה צירוף יש סמיכות?", "ar": "في أي تركيب توجد إضافة (סמיכות)؟", "ru": "В каком сочетании есть сопряжённая форма (смихут)?", "en": "Which phrase is a construct phrase (smichut)?"},[{"he": "חדר גדול", "ar": "חדר גדול", "ru": "חדר גדול", "en": "חדר גדול"}, {"he": "החדר שלנו", "ar": "החדר שלנו", "ru": "החדר שלנו", "en": "החדר שלנו"}, {"he": "חדר נקי ומסודר מאוד", "ar": "חדר נקי ומסודר מאוד", "ru": "חדר נקי ומסודר מאוד", "en": "חדר נקי ומסודר מאוד"}, {"he": "חדר אוכל", "ar": "חדר אוכל", "ru": "חדר אוכל", "en": "חדר אוכל"}],3,{"he": "חפשו שני שמות עצם שבאים זה אחר זה בלי מילת קישור.", "ar": "ابحثوا عن اسمين متتاليين بلا كلمة ربط.", "ru": "Ищите два существительных подряд без связующего слова.", "en": "Look for two nouns in a row with no linking word."},{"he": "בסמיכות שני שמות עצם צמודים, והשני מפרט את הראשון. \"חדר אוכל\" הוא חדר שאוכלים בו. כך גם \"כוס תה\".", "ar": "في الإضافة اسمان متلاصقان، والثاني يحدّد الأول. «חדר אוכל» غرفة يُؤكل فيها. ومثلها «כוס תה».", "ru": "В смихуте два существительных стоят рядом, второе уточняет первое. «חדר אוכל» - комната, где едят. Так же «כוס תה».", "en": "In smichut two nouns stand together, and the second defines the first. \"חדר אוכל\" is a room for eating. So is \"כוס תה\"."},null,[{"he": "\"גדול\" הוא שם תואר, ולא שם עצם שני.", "ar": "«גדול» صفة، وليس اسمًا ثانيًا.", "ru": "«גדול» - прилагательное, а не второе существительное.", "en": "\"גדול\" is an adjective, not a second noun."}, {"he": "זה צירוף עם \"של\", ולא סמיכות.", "ar": "هذا تركيب مع «של»، وليس إضافة.", "ru": "Это сочетание с «של», а не смихут.", "en": "This uses \"של\"; it is not a construct phrase."}, {"he": "אחרי \"חדר\" באים שמות תואר, ולא שם עצם.", "ar": "بعد «חדר» تأتي صفات، لا اسم.", "ru": "После «חדר» идут прилагательные, а не существительное.", "en": "After \"חדר\" come adjectives, not a noun."}, null]),
Q("nn-1-04",{"he": "מה המשמעות של \"מחברתי\"?", "ar": "ما معنى «מחברתי»؟", "ru": "Что означает «מחברתי»?", "en": "What does \"מחברתי\" mean?"},[{"he": "המחברת שלך", "ar": "دفترك", "ru": "твоя тетрадь", "en": "your notebook"}, {"he": "המחברת של המורה", "ar": "دفتر المعلّم", "ru": "тетрадь учителя", "en": "the teacher’s notebook"}, {"he": "המחברת שלי", "ar": "دفتري", "ru": "моя тетрадь", "en": "my notebook"}, {"he": "המחברות שלו", "ar": "دفاتره", "ru": "его тетради", "en": "his notebooks"}],2,{"he": "הסתכלו על האות האחרונה, אחרי ה־ת.", "ar": "انظروا إلى الحرف الأخير بعد ת.", "ru": "Посмотрите на последнюю букву после ת.", "en": "Look at the last letter, after the ת."},{"he": "\"מחברתי\" בנויה מ\"מחברת\" ועוד הסיומת ־י, שפירושה \"שלי\". כך גם \"עבודתי\" היא העבודה שלי.", "ar": "«מחברתי» مكوّنة من «מחברת» واللاحقة ־י التي تعني «لي». ومثلها «עבודתי».", "ru": "«מחברתי» - это «מחברת» плюс окончание ־י со значением «мой». Так же «עבודתי» - моя работа.", "en": "\"מחברתי\" is \"מחברת\" plus the ending ־י, meaning \"my\". Likewise \"עבודתי\" means my work."},null,[{"he": "לגוף \"אתה\" הסיומת היא ־ך: \"מחברתך\".", "ar": "للمخاطَب اللاحقة ־ך: «מחברתך».", "ru": "Для «ты» окончание ־ך: «מחברתך».", "en": "For \"you\" the ending is ־ך: \"מחברתך\"."}, {"he": "הסיומת ־י מציינת \"שלי\", ולא אדם אחר.", "ar": "اللاحقة ־י تعني «لي»، لا شخصًا آخر.", "ru": "Окончание ־י означает «мой», а не другого человека.", "en": "The ending ־י means \"mine\", not someone else’s."}, null, {"he": "לגוף \"הוא\" ברבים אומרים \"מחברותיו\".", "ar": "لـ «هو» في الجمع نقول «מחברותיו».", "ru": "Для «он» во мн. числе говорят «מחברותיו».", "en": "For \"he\" with a plural noun we say \"מחברותיו\"."}]),
Q("nn-1-05",{"he": "השלימו: \"___ כלה\" (השם הוא \"שמלה\").", "ar": "أكملوا: «___ כלה» (فستان عروس). الاسم هو «שמלה».", "ru": "Дополните: «___ כלה» (платье невесты). Слово - «שמלה».", "en": "Complete: \"___ כלה\" (a bride’s dress). The noun is \"שמלה\"."},[{"he": "שמלת", "ar": "שמלת", "ru": "שמלת", "en": "שמלת"}, {"he": "שמלה", "ar": "שמלה", "ru": "שמלה", "en": "שמלה"}, {"he": "שמלות", "ar": "שמלות", "ru": "שמלות", "en": "שמלות"}, {"he": "השמלה של", "ar": "השמלה של", "ru": "השמלה של", "en": "השמלה של"}],0,{"he": "חשבו על \"שנה\" בצירוף \"___ לימודים\".", "ar": "فكّروا في «שנה» في التركيب «___ לימודים».", "ru": "Вспомните «שנה» в сочетании «___ לימודים».", "en": "Think of \"שנה\" in \"___ לימודים\"."},{"he": "שם נקבה שמסתיים ב־ה מקבל ־ת בסמיכות. לכן \"שמלה\" הופכת ל\"שמלת כלה\". כך גם \"שנת לימודים\".", "ar": "الاسم المؤنّث المنتهي بـ ה يأخذ ת في الإضافة. لذلك «שמלה» تصبح «שמלת כלה». ومثلها «שנת לימודים».", "ru": "Слово женского рода на ־ה в смихуте получает ־ת. Поэтому «שמלה» - «שמלת כלה». Так же «שנת לימודים».", "en": "A feminine noun ending in ־ה takes ־ת in smichut. So \"שמלה\" becomes \"שמלת כלה\". Likewise \"שנת לימודים\"."},null,[null, {"he": "בסמיכות ה־ה בסוף שם נקבה הופכת ל־ת.", "ar": "في الإضافة تتحوّل ה في آخر الاسم المؤنّث إلى ת.", "ru": "В смихуте конечная ה женского рода переходит в ת.", "en": "In smichut, a feminine final ה turns into ת."}, {"he": "זו צורת רבים, והצירוף מדבר על שמלה אחת.", "ar": "هذه صيغة جمع، والتركيب عن فستان واحد.", "ru": "Это мн. число, а речь об одном платье.", "en": "This is plural, but the phrase is about one dress."}, {"he": "זה צירוף עם \"של\", ולא צורת סמיכות.", "ar": "هذا تركيب مع «של»، لا صيغة إضافة.", "ru": "Это сочетание с «של», а не сопряжённая форма.", "en": "This uses \"של\", not the construct form."}]),
Q("nn-1-06",{"he": "מה המין הדקדוקי של \"שולחנות\"?", "ar": "ما الجنس النحوي لـ «שולחנות» (طاولات)؟", "ru": "Какой грамматический род у «שולחנות» (столы)?", "en": "What is the grammatical gender of \"שולחנות\" (tables)?"},[{"he": "נקבה, בגלל הסיומת ־ות", "ar": "مؤنّث بسبب اللاحقة ־ות", "ru": "женский, из-за окончания ־ות", "en": "feminine, because of the ־ות ending"}, {"he": "זכר", "ar": "مذكّر", "ru": "мужской род", "en": "masculine"}, {"he": "זכר ונקבה", "ar": "مذكّر ومؤنّث", "ru": "оба рода", "en": "both genders"}, {"he": "תלוי במספר", "ar": "يتعلّق بالعدد", "ru": "зависит от числа", "en": "depends on the number"}],1,{"he": "בדקו איזה תואר מתאים: \"חדשים\" או \"חדשות\".", "ar": "افحصوا أي صفة تناسب: «חדשים» أم «חדשות».", "ru": "Проверьте, какое прилагательное подходит: «חדשים» или «חדשות».", "en": "Check which adjective fits: \"חדשים\" or \"חדשות\"."},{"he": "\"שולחן\" הוא זכר, וגם ברבים הוא נשאר זכר. אומרים \"שולחנות חדשים\". כך גם \"חלונות\" ו\"קירות\".", "ar": "«שולחן» مذكّر، ويبقى مذكّرًا في الجمع. نقول «שולחנות חדשים». ومثله «חלונות» و«קירות».", "ru": "«שולחן» - мужской род и во мн. числе тоже. Говорят «שולחנות חדשים». Так же «חלונות» и «קירות».", "en": "\"שולחן\" is masculine and stays masculine in the plural: \"שולחנות חדשים\". So do \"חלונות\" and \"קירות\"."},null,[{"he": "הסיומת לא קובעת את המין: אומרים \"שולחנות חדשים\".", "ar": "اللاحقة لا تحدّد الجنس: نقول «שולחנות חדשים».", "ru": "Окончание не определяет род: говорят «שולחנות חדשים».", "en": "The ending does not set the gender: we say \"שולחנות חדשים\"."}, null, {"he": "לכל שם עצם יש מין אחד, ו\"שולחן\" הוא זכר.", "ar": "لكل اسم جنس واحد، و«שולחן» مذكّر.", "ru": "У существительного один род, и «שולחן» - мужской.", "en": "Each noun has one gender, and \"שולחן\" is masculine."}, {"he": "המין לא משתנה בין יחיד לרבים.", "ar": "الجنس لا يتغيّر بين المفرد والجمع.", "ru": "Род не меняется от единственного к множественному.", "en": "Gender does not change between singular and plural."}]),

Q("ha-noun-2-1",{"he": "מהי צורת הסמיכות של \"בית\" ו\"ספר\"?", "ar": "ما صيغة الإضافة العبرية لكلمتي «בית» و«ספר»؟", "ru": "Какая форма сопряжённого сочетания для «בית» и «ספר»?", "en": "What is the construct form of \"בית\" and \"ספר\"?"},[{"he": "בית הספר", "ar": "בית הספר", "ru": "בית הספר", "en": "בית הספר"}, {"he": "הבית של ספר", "ar": "הבית של ספר", "ru": "הבית של ספר", "en": "הבית של ספר"}, {"he": "בתים ספר", "ar": "בתים ספר", "ru": "בתים ספר", "en": "בתים ספר"}, {"he": "בית וספר", "ar": "בית וספר", "ru": "בית וספר", "en": "בית וספר"}],0,{"he": "חפשו צירוף שבו השם הראשון קשור ישירות לשם השני.", "ar": "ابحثوا عن تركيب يتصل فيه الاسم الأول مباشرة بالثاني.", "ru": "Ищите сочетание, где первое существительное непосредственно связано со вторым.", "en": "Look for a phrase in which the first noun directly links to the second."},{"he": "\"בית הספר\" הוא צירוף סמיכות: \"בית\" נסמך ל\"ספר\". למשל: \"חדר המורים\" הוא צירוף סמיכות נוסף.", "ar": "«בית הספר» تركيب إضافة: «בית» مضاف إلى «ספר». ومثله «חדר המורים».", "ru": "«בית הספר» - сопряжённое сочетание: «בית» связано с «ספר». Например, «חדר המורים» - ещё одно такое сочетание.", "en": "\"בית הספר\" is a construct phrase: \"בית\" is linked to \"ספר\". \"חדר המורים\" is another example."},null,[null, {"he": "זה אינו הצירוף המקובל לשני השמות האלה.", "ar": "هذا ليس التركيب المعتاد لهذين الاسمين.", "ru": "Это не принятое сочетание этих двух существительных.", "en": "This is not the established phrase for these nouns."}, {"he": "כאן שם העצם הראשון ברבים, והצירוף אינו תקין.", "ar": "الاسم الأول هنا جمع والتركيب غير سليم.", "ru": "Первое существительное здесь во множественном числе, а сочетание неверно.", "en": "The first noun is plural here, and the phrase is incorrect."}, {"he": "ו החיבור מחברת שתי מילים, אך אינה יוצרת סמיכות.", "ar": "واو العطف تصل كلمتين لكنها لا تصنع إضافة.", "ru": "Союз «и» соединяет слова, но не образует сопряжённую конструкцию.", "en": "The conjunction \"and\" joins words but does not make a construct phrase."}]),
Q("ha-noun-2-2",{"he": "השלימו: \"קראתי שני ___ חדשים\".", "ar": "أكملوا: «קראתי שני ___ חדשים».", "ru": "Дополните: «קראתי שני ___ חדשים».", "en": "Complete: \"קראתי שני ___ חדשים.\""},[{"he": "ספרות", "ar": "ספרות", "ru": "ספרות", "en": "ספרות"}, {"he": "ספר", "ar": "ספר", "ru": "ספר", "en": "ספר"}, {"he": "ספרים", "ar": "ספרים", "ru": "ספרים", "en": "ספרים"}, {"he": "ספריהם", "ar": "ספריהם", "ru": "ספריהם", "en": "ספריהם"}],2,{"he": "בדקו התאמה בין המספר, השם והתואר.", "ar": "افحصوا التوافق بين العدد والاسم والصفة.", "ru": "Проверьте согласование числительного, существительного и прилагательного.", "en": "Check agreement among numeral, noun, and adjective."},{"he": "\"שני ספרים חדשים\" מתאים לריבוי ולמין הזכר. למשל: \"שני תלמידים חרוצים\".", "ar": "«שני ספרים חדשים» يوافق الجمع المذكر. ومثله «שני תלמידים חרוצים».", "ru": "«שני ספרים חדשים» согласуется по мужскому роду и множественному числу. Например: «שני תלמידים חרוצים».", "en": "\"שני ספרים חדשים\" agrees in masculine plural. Compare \"שני תלמידים חרוצים\"."},null,[{"he": "\"ספרות\" היא שם תחום, ולא הרבים של \"ספר\".", "ar": "«ספרות» اسم مجال الأدب وليس جمع «ספר».", "ru": "«ספרות» означает литературу, а не множественное число слова «ספר».", "en": "\"ספרות\" names literature, not the plural of \"ספר\"."}, {"he": "שם יחיד אינו מתאים ל\"שני\" ול\"חדשים\".", "ar": "الاسم المفرد لا يوافق «שני» ولا «חדשים».", "ru": "Единственное число не согласуется с «שני» и «חדשים».", "en": "A singular noun does not agree with \"שני\" and \"חדשים\"."}, null, {"he": "כינוי השייכות מוסיף משמעות של בעלות שאינה נדרשת במשפט.", "ar": "ضمير الملكية يضيف معنى لا يحتاج إليه السياق.", "ru": "Притяжательный суффикс добавляет ненужное значение принадлежности.", "en": "The possessive suffix adds ownership that the sentence does not call for."}]),
Q("ha-noun-2-3",{"he": "השלימו: \"המורה חילקה את הדפים ל___ התלמידות\".", "ar": "أكملوا: «המורה חילקה את הדפים ל___ התלמידות».", "ru": "Дополните: «המורה חילקה את הדפים ל___ התלמידות».", "en": "Complete: \"המורה חילקה את הדפים ל___ התלמידות.\""},[{"he": "שלושה", "ar": "שלושה", "ru": "שלושה", "en": "שלושה"}, {"he": "שלוש", "ar": "שלוש", "ru": "שלוש", "en": "שלוש"}, {"he": "שלישי", "ar": "שלישי", "ru": "שלישי", "en": "שלישי"}, {"he": "שלישית", "ar": "שלישית", "ru": "שלישית", "en": "שלישית"}],1,{"he": "האם צריך מספר מונה או סודר, ומה מינו של השם?", "ar": "هل المطلوب عدد أصلي أم ترتيبي، وما جنس الاسم؟", "ru": "Нужно количественное или порядковое числительное? Каков род существительного?", "en": "Is a cardinal or ordinal numeral needed, and what is the noun’s gender?"},{"he": "\"שלוש\" הוא מספר מונה המתאים לנקבה: \"שלוש התלמידות\". למשל \"ארבע הבנות\".", "ar": "«שלוש» عدد أصلي للمؤنث: «שלוש התלמידות». ومثل ذلك «ארבע הבנות».", "ru": "«שלוש» - количественное числительное для женского рода: «שלוש התלמידות». Например: «ארבע הבנות».", "en": "\"שלוש\" is a feminine cardinal numeral: \"שלוש התלמידות\". Compare \"ארבע הבנות\"."},null,[{"he": "זו צורת מנייה לזכר, ואילו \"תלמידות\" היא נקבה.", "ar": "هذه صيغة العدّ للمذكر، و«תלמידות» مؤنث.", "ru": "Это форма для мужского рода, а «תלמידות» - женского.", "en": "That counts masculine nouns, while \"תלמידות\" is feminine."}, null, {"he": "זהו מספר סודר לזכר, המציין מקום בסדר ולא כמות.", "ar": "هذا عدد ترتيبي مذكر يدل على الترتيب لا الكمية.", "ru": "Это порядковое числительное мужского рода, оно обозначает место, а не количество.", "en": "That is a masculine ordinal, indicating position rather than quantity."}, {"he": "זהו מספר סודר המציין מיקום בסדר ולא כמות של תלמידות.", "ar": "هذا عدد ترتيبي يدل على الترتيب لا عدد الطالبات.", "ru": "Это порядковое числительное: оно обозначает порядок, а не число учениц.", "en": "That is an ordinal, indicating position rather than the number of students."}]),
Q("nn-2-01",{"he": "מה הצורה המחוברת של \"ההורים שלהם\"?", "ar": "ما الصيغة المتصلة لـ «ההורים שלהם» (والداهم)؟", "ru": "Какая слитная форма у «ההורים שלהם» (их родители)?", "en": "What is the suffixed form of \"ההורים שלהם\" (their parents)?"},[{"he": "הורהם", "ar": "הורהם", "ru": "הורהם", "en": "הורהם"}, {"he": "הוריהם", "ar": "הוריהם", "ru": "הוריהם", "en": "הוריהם"}, {"he": "הורינו", "ar": "הורינו", "ru": "הורינו", "en": "הורינו"}, {"he": "הוריהם שלהם", "ar": "הוריהם שלהם", "ru": "הוריהם שלהם", "en": "הוריהם שלהם"}],1,{"he": "הסיומת צריכה להראות גם רבים וגם \"שלהם\".", "ar": "يجب أن تُظهر اللاحقة الجمع و«لهم» معًا.", "ru": "Окончание должно показать и мн. число, и «их».", "en": "The ending must show both plural and \"their\"."},{"he": "לשם זכר ברבים מוסיפים ־יהם: \"הורים\" הופך ל\"הוריהם\". כך גם \"ספריהם\" ו\"ילדיהם\".", "ar": "للاسم المذكّر الجمع نضيف ־יהם: «הורים» يصبح «הוריהם». ومثلها «ספריהם» و«ילדיהם».", "ru": "К мужскому мн. числу прибавляют ־יהם: «הורים» - «הוריהם». Так же «ספריהם» и «ילדיהם».", "en": "A masculine plural noun takes ־יהם: \"הורים\" becomes \"הוריהם\". So do \"ספריהם\" and \"ילדיהם\"."},null,[{"he": "בשם ברבים יש י לפני הסיומת: ־יהם.", "ar": "في الاسم الجمع تأتي י قبل اللاحقة: ־יהם.", "ru": "У существительного во мн. числе перед окончанием есть י: ־יהם.", "en": "A plural noun keeps a י before the ending: ־יהם."}, null, {"he": "\"הורינו\" פירושו ההורים שלנו.", "ar": "«הורינו» معناها والدانا.", "ru": "«הורינו» значит «наши родители».", "en": "\"הורינו\" means our parents."}, {"he": "הסיומת כבר אומרת \"שלהם\", ואין צורך לחזור.", "ar": "اللاحقة تعني «لهم»، ولا حاجة للتكرار.", "ru": "Окончание уже значит «их», повторять не нужно.", "en": "The ending already means \"their\"; no need to repeat it."}]),
Q("nn-2-02",{"he": "מה צורת הרבים של \"מכונית\"?", "ar": "ما صيغة الجمع من «מכונית» (سيارة)؟", "ru": "Какая форма множественного числа у «מכונית» (машина)?", "en": "What is the plural of \"מכונית\" (car)?"},[{"he": "מכונות", "ar": "מכונות", "ru": "מכונות", "en": "מכונות"}, {"he": "מכונים", "ar": "מכונים", "ru": "מכונים", "en": "מכונים"}, {"he": "מכוניתות רבות", "ar": "מכוניתות רבות", "ru": "מכוניתות רבות", "en": "מכוניתות רבות"}, {"he": "מכוניות", "ar": "מכוניות", "ru": "מכוניות", "en": "מכוניות"}],3,{"he": "חשבו על \"תוכנית\" ועל צורת הרבים שלה.", "ar": "فكّروا في «תוכנית» وصيغة جمعها.", "ru": "Вспомните «תוכנית» и её множественное число.", "en": "Think of \"תוכנית\" and its plural."},{"he": "בשמות נקבה שמסתיימים בסיומת ־ית, ה־ת בסוף מתחלפת ב־ות. לכן \"מכונית\" הופכת ל\"מכוניות\". כך גם \"תוכנית\" ו\"תוכניות\".", "ar": "في الأسماء المؤنّثة المنتهية باللاحقة ־ית تُستبدل ת الأخيرة بـ ־ות. لذلك «מכונית» تصبح «מכוניות». ومثلها «תוכנית» و«תוכניות».", "ru": "У существительных женского рода с суффиксом ־ית конечная ת заменяется на ־ות: «מכונית» - «מכוניות». Так же «תוכנית» - «תוכניות».", "en": "In feminine nouns with the suffix ־ית, the final ת is replaced by ־ות: \"מכונית\" becomes \"מכוניות\". Likewise \"תוכנית\" and \"תוכניות\"."},null,[{"he": "\"מכונות\" הוא הרבים של \"מכונה\", מילה אחרת.", "ar": "«מכונות» جمع «מכונה»، وهي كلمة أخرى.", "ru": "«מכונות» - мн. число от «מכונה», это другое слово.", "en": "\"מכונות\" is the plural of \"מכונה\", a different word."}, {"he": "\"מכונית\" היא נקבה, וסיומת ־ים לא מתאימה לה.", "ar": "«מכונית» مؤنّث، واللاحقة ־ים لا تناسبها.", "ru": "«מכונית» - женский род, окончание ־ים не подходит.", "en": "\"מכונית\" is feminine, and ־ים does not fit it."}, {"he": "ה־ת של היחיד לא נשארת לפני ־ות.", "ar": "ת المفرد لا تبقى قبل ־ות.", "ru": "ת единственного числа не остаётся перед ־ות.", "en": "The singular ת does not stay before ־ות."}, null]),
Q("nn-2-03",{"he": "השלימו בסמיכות: \"___ הכיתה יצאו לטיול\". השם הוא \"התלמידות\".", "ar": "أكملوا بالإضافة: «___ הכיתה יצאו לטיול» (___ الصف خرجن في رحلة). الاسم «התלמידות».", "ru": "Дополните смихутом: «___ הכיתה יצאו לטיול» (___ класса отправились на экскурсию). Слово - «התלמידות».", "en": "Complete with smichut: \"___ הכיתה יצאו לטיול\" (the ___ of the class went on a trip). The noun is \"התלמידות\"."},[{"he": "התלמידות", "ar": "התלמידות", "ru": "התלמידות", "en": "התלמידות"}, {"he": "תלמידותי", "ar": "תלמידותי", "ru": "תלמידותי", "en": "תלמידותי"}, {"he": "תלמידות", "ar": "תלמידות", "ru": "תלמידות", "en": "תלמידות"}, {"he": "התלמידות של", "ar": "התלמידות של", "ru": "התלמידות של", "en": "התלמידות של"}],2,{"he": "בדקו איפה באה ה הידיעה ואם הסיומת ־ות משתנה.", "ar": "افحصوا موضع ה التعريف وهل تتغيّر اللاحقة ־ות.", "ru": "Проверьте, где стоит артикль и меняется ли окончание ־ות.", "en": "Check where the article goes and whether ־ות changes."},{"he": "בסמיכות של נקבה רבות הסיומת ־ות לא משתנה. ה הידיעה עוברת לשם השני: \"תלמידות הכיתה\". כך גם \"בנות הכיתה\".", "ar": "في إضافة الجمع المؤنّث لا تتغيّر اللاحقة ־ות. وتنتقل ה التعريف إلى الاسم الثاني: «תלמידות הכיתה». ومثلها «בנות הכיתה».", "ru": "В смихуте женского мн. числа окончание ־ות не меняется. Артикль переходит ко второму слову: «תלמידות הכיתה». Так же «בנות הכיתה».", "en": "In a feminine plural smichut, ־ות does not change. The article moves to the second noun: \"תלמידות הכיתה\". So does \"בנות הכיתה\"."},null,[{"he": "בסמיכות ה הידיעה באה רק לפני השם השני.", "ar": "في الإضافة تأتي ה التعريف قبل الاسم الثاني فقط.", "ru": "В смихуте артикль ה стоит только перед вторым словом.", "en": "In smichut, the article ה goes only on the second noun."}, {"he": "שם נקבה ברבים לא מקבל ־י בסמיכות.", "ar": "الاسم المؤنّث الجمع لا يأخذ ־י في الإضافة.", "ru": "Женское мн. число в смихуте не получает ־י.", "en": "A feminine plural does not take ־י in smichut."}, null, {"he": "זה צירוף עם \"של\", ולא סמיכות.", "ar": "هذا تركيب مع «של»، لا إضافة.", "ru": "Это сочетание с «של», а не смихут.", "en": "This uses \"של\", not smichut."}]),
Q("nn-2-04",{"he": "מה הצורה המחוברת של \"העבודה שלנו\"?", "ar": "ما الصيغة المتصلة لـ «העבודה שלנו» (عملنا)؟", "ru": "Какая слитная форма у «העבודה שלנו» (наша работа)?", "en": "What is the suffixed form of \"העבודה שלנו\" (our work)?"},[{"he": "עבודתנו", "ar": "עבודתנו", "ru": "עבודתנו", "en": "עבודתנו"}, {"he": "עבודנו", "ar": "עבודנו", "ru": "עבודנו", "en": "עבודנו"}, {"he": "עבודתם", "ar": "עבודתם", "ru": "עבודתם", "en": "עבודתם"}, {"he": "עבודותינו הרבות", "ar": "עבודותינו הרבות", "ru": "עבודותינו הרבות", "en": "עבודותינו הרבות"}],0,{"he": "זכרו מה קורה ל־ה בסוף שם נקבה כשמוסיפים לו סיומת.", "ar": "تذكّروا ماذا يحدث لـ ה في آخر الاسم المؤنّث عند إضافة لاحقة.", "ru": "Вспомните, что происходит с конечной ה, когда добавляют окончание.", "en": "Recall what happens to a final ה when an ending is added."},{"he": "לפני סיומת שייכות, ה־ה בסוף \"עבודה\" הופכת ל־ת. אחר כך באה הסיומת ־נו, שפירושה \"שלנו\". כך גם \"משפחתנו\".", "ar": "قبل لاحقة الملكية تتحوّل ה في آخر «עבודה» إلى ת، ثم تأتي ־נו بمعنى «لنا». ومثلها «משפחתנו».", "ru": "Перед притяжательным окончанием ה в «עבודה» переходит в ת. Затем идёт ־נו - «наш». Так же «משפחתנו».", "en": "Before a possessive ending, the final ה of \"עבודה\" becomes ת. Then comes ־נו, meaning \"our\". Likewise \"משפחתנו\"."},null,[null, {"he": "ה־ה של \"עבודה\" הופכת ל־ת לפני הסיומת.", "ar": "ה في «עבודה» تتحوّل إلى ת قبل اللاحقة.", "ru": "ה в «עבודה» перед окончанием переходит в ת.", "en": "The ה of \"עבודה\" turns into ת before the ending."}, {"he": "הסיומת ־ם פירושה \"שלהם\", ולא \"שלנו\".", "ar": "اللاحقة ־ם تعني «لهم» لا «لنا».", "ru": "Окончание ־ם значит «их», а не «наш».", "en": "The ending ־ם means \"their\", not \"our\"."}, {"he": "\"עבודותינו\" היא צורת רבים: העבודות שלנו.", "ar": "«עבודותינו» صيغة جمع: أعمالنا.", "ru": "«עבודותינו» - мн. число: наши работы.", "en": "\"עבודותינו\" is plural: our works."}]),
Q("nn-2-05",{"he": "השלימו: \"בחצר יש שלושה ___ גבוהים\". השם הוא \"עץ\".", "ar": "أكملوا: «בחצר יש שלושה ___ גבוהים» (في الساحة ثلاث ___ عالية). الاسم «עץ».", "ru": "Дополните: «בחצר יש שלושה ___ גבוהים» (во дворе три высоких ___). Слово - «עץ».", "en": "Complete: \"בחצר יש שלושה ___ גבוהים\" (in the yard there are three tall ___). The noun is \"עץ\"."},[{"he": "עץ", "ar": "עץ", "ru": "עץ", "en": "עץ"}, {"he": "עצים", "ar": "עצים", "ru": "עצים", "en": "עצים"}, {"he": "עצות טובות", "ar": "עצות טובות", "ru": "עצות טובות", "en": "עצות טובות"}, {"he": "עצי", "ar": "עצי", "ru": "עצי", "en": "עצי"}],1,{"he": "בדקו את המין של \"שלושה\" ושל \"גבוהים\".", "ar": "افحصوا جنس «שלושה» و«גבוהים».", "ru": "Проверьте род слов «שלושה» и «גבוהים».", "en": "Check the gender of \"שלושה\" and \"גבוהים\"."},{"he": "\"עץ\" הוא זכר, ולכן הרבים הוא \"עצים\". \"שלושה\" ו\"גבוהים\" הם צורות זכר שמתאימות לו.", "ar": "«עץ» مذكّر، لذلك جمعه «עצים». و«שלושה» و«גבוהים» صيغتا مذكّر تناسبانه.", "ru": "«עץ» - мужской род, поэтому мн. число - «עצים». «שלושה» и «גבוהים» - формы мужского рода, они подходят.", "en": "\"עץ\" is masculine, so its plural is \"עצים\". \"שלושה\" and \"גבוהים\" are masculine forms that match it."},null,[{"he": "אחרי \"שלושה\" צריך צורת רבים.", "ar": "بعد «שלושה» نحتاج صيغة الجمع.", "ru": "После «שלושה» нужно мн. число.", "en": "After \"שלושה\" a plural is needed."}, null, {"he": "\"עצות\" הן הרבים של \"עצה\", מילה אחרת, והיא נקבה.", "ar": "«עצות» جمع «עצה» (نصيحة)، كلمة أخرى ومؤنّثة.", "ru": "«עצות» - мн. число от «עצה» (совет), это другое слово женского рода.", "en": "\"עצות\" is the plural of \"עצה\" (advice), a different feminine word."}, {"he": "\"עצי\" היא צורת סמיכות, והיא צריכה שם אחריה.", "ar": "«עצי» صيغة إضافة وتحتاج اسمًا بعدها.", "ru": "«עצי» - сопряжённая форма, после неё нужно слово.", "en": "\"עצי\" is a construct form and needs a noun after it."}]),
Q("nn-2-06",{"he": "השלימו: \"___ הכפר עשויים מאבן\". השם הוא \"בתים\".", "ar": "أكملوا: «___ הכפר עשויים מאבן» (___ القرية مصنوعة من الحجر). الاسم «בתים».", "ru": "Дополните: «___ הכפר עשויים מאבן» (___ деревни сделаны из камня). Слово - «בתים».", "en": "Complete: \"___ הכפר עשויים מאבן\" (the ___ of the village are made of stone). The noun is \"בתים\"."},[{"he": "ביתים", "ar": "ביתים", "ru": "ביתים", "en": "ביתים"}, {"he": "בתים", "ar": "בתים", "ru": "בתים", "en": "בתים"}, {"he": "בתי", "ar": "בתי", "ru": "בתי", "en": "בתי"}, {"he": "הבתים של", "ar": "הבתים של", "ru": "הבתים של", "en": "הבתים של"}],2,{"he": "חשבו על \"ספרים\" בצירוף \"___ לימוד\".", "ar": "فكّروا في «ספרים» في التركيب «___ לימוד».", "ru": "Вспомните «ספרים» в сочетании «___ לימוד».", "en": "Think of \"ספרים\" in \"___ לימוד\"."},{"he": "בסמיכות, שם זכר ברבים מאבד את ה־ם ונשאר עם ־י. לכן \"בתים\" הופך ל\"בתי הכפר\". כך גם \"בתי ספר\".", "ar": "في الإضافة يفقد الاسم المذكّر الجمع حرف ם ويبقى بـ ־י. لذلك «בתים» تصبح «בתי הכפר». ومثلها «בתי ספר».", "ru": "В смихуте мужское мн. число теряет ם и остаётся с ־י. Поэтому «בתים» - «בתי הכפר». Так же «בתי ספר».", "en": "In smichut, a masculine plural loses its ם and keeps ־י. So \"בתים\" becomes \"בתי הכפר\". Likewise \"בתי ספר\"."},null,[{"he": "אין צורה כזו: הרבים של \"בית\" הוא \"בתים\".", "ar": "لا توجد هذه الصيغة: جمع «בית» هو «בתים».", "ru": "Такой формы нет: мн. число от «בית» - «בתים».", "en": "No such form: the plural of \"בית\" is \"בתים\"."}, {"he": "בסמיכות הסיומת ־ים של הנסמך הופכת ל־י.", "ar": "في الإضافة تتحوّل اللاحقة ־ים في المضاف إلى ־י.", "ru": "В смихуте окончание ־ים первого слова переходит в ־י.", "en": "In smichut, the ־ים of the first noun becomes ־י."}, null, {"he": "זה צירוף עם \"של\", ולא סמיכות.", "ar": "هذا تركيب مع «של»، لا إضافة.", "ru": "Это сочетание с «של», а не смихут.", "en": "This uses \"של\", not smichut."}]),

Q("ha-noun-3-1",{"he": "איזה צירוף סמיכות מיודע כראוי?", "ar": "أي تركيب إضافة معرّف بصورة صحيحة؟", "ru": "Какое сопряжённое словосочетание правильно определено?", "en": "Which construct phrase is correctly definite?"},[{"he": "החדר המורים", "ar": "החדר המורים", "ru": "החדר המורים", "en": "החדר המורים"}, {"he": "החדר של המורים", "ar": "החדר של המורים", "ru": "החדר של המורים", "en": "החדר של המורים"}, {"he": "חדר מורים", "ar": "חדר מורים", "ru": "חדר מורים", "en": "חדר מורים"}, {"he": "חדר המורים", "ar": "חדר המורים", "ru": "חדר המורים", "en": "חדר המורים"}],3,{"he": "בסמיכות, בדקו היכן מופיעה ה הידיעה.", "ar": "في الإضافة، افحصوا موضع أداة التعريف ה.", "ru": "В сопряжённом сочетании проверьте, где стоит определённый артикль ה.", "en": "In a construct phrase, check where the definite article ה appears."},{"he": "בצירוף סמיכות מיודע ה הידיעה באה לפני הסומך: \"חדר המורים\". למשל: \"תיק התלמיד\".", "ar": "في الإضافة المعرّفة تأتي ה قبل المضاف إليه: «חדר המורים». ومثله «תיק התלמיד».", "ru": "В определённом сопряжённом сочетании артикль ה стоит при втором слове: «חדר המורים». Например: «תיק התלמיד».", "en": "In a definite construct phrase, ה attaches to the second noun: \"חדר המורים\". Compare \"תיק התלמיד\"."},null,[{"he": "ה הידיעה אינה באה לפני הנסמך בצירוף סמיכות רגיל.", "ar": "لا تأتي ה التعريف قبل المضاف في تركيب الإضافة المعتاد.", "ru": "В обычном сопряжённом сочетании артикль не ставят перед первым словом.", "en": "The article does not go on the first noun of an ordinary construct phrase."}, {"he": "זהו צירוף עם \"של\", ולא צורת סמיכות.", "ar": "هذا تركيب مع «של» وليس إضافة مباشرة.", "ru": "Это конструкция с «של», а не сопряжённая форма.", "en": "This uses \"של\", not the construct form."}, {"he": "ללא ה הידיעה הצירוף אינו מיודע.", "ar": "بلا أداة التعريف ה لا يكون التركيب معرّفًا.", "ru": "Без артикля ה сочетание не является определённым.", "en": "Without ה, this phrase is not definite."}, null]),
Q("ha-noun-3-2",{"he": "השלימו: \"נועה סיימה במקום ה___ בתחרות\".", "ar": "أكملوا: «נועה סיימה במקום ה___ בתחרות».", "ru": "Дополните: «נועה סיימה במקום ה___ בתחרות».", "en": "Complete: \"נועה סיימה במקום ה___ בתחרות.\""},[{"he": "שלוש", "ar": "שלוש", "ru": "שלוש", "en": "שלוש"}, {"he": "שלישי", "ar": "שלישי", "ru": "שלישי", "en": "שלישי"}, {"he": "שלישית", "ar": "שלישית", "ru": "שלישית", "en": "שלישית"}, {"he": "שלושה", "ar": "שלושה", "ru": "שלושה", "en": "שלושה"}],1,{"he": "שימו לב לשם שאחרי \"במקום\" ולמשמעות של דירוג.", "ar": "انتبهوا لاسم «מקום» ومعنى الترتيب.", "ru": "Обратите внимание на слово «מקום» и смысл места в соревновании.", "en": "Notice the noun \"מקום\" and the meaning of rank."},{"he": "\"מקום\" הוא זכר, ודירוג מביעים במספר סודר: \"במקום השלישי\". למשל: \"הוא הגיע למקום השני\".", "ar": "«מקום» مذكر، ويُعبّر عن المرتبة بعدد ترتيبي: «במקום השלישי». مثلًا: «وصل إلى المرتبة الثانية».", "ru": "«מקום» мужского рода; место выражают порядковым числительным: «במקום השלישי». Например: «Он занял второе место».", "en": "\"מקום\" is masculine, and rank uses an ordinal: \"במקום השלישי\". For example: \"He came in second place.\""},null,[{"he": "זהו מספר מונה לנקבה, לא דירוג.", "ar": "هذا عدد أصلي للمؤنث، لا ترتيب.", "ru": "Это количественное числительное женского рода, а не номер места.", "en": "That is a feminine cardinal, not a rank."}, null, {"he": "זו צורת סודר לנקבה, אך \"מקום\" הוא זכר.", "ar": "هذا عدد ترتيبي مؤنث، لكن «מקום» مذكر.", "ru": "Это порядковое числительное женского рода, а «מקום» мужского.", "en": "That is a feminine ordinal, but \"מקום\" is masculine."}, {"he": "זהו מספר מונה לזכר, לא מספר סודר.", "ar": "هذا عدد أصلي للمذكر لا ترتيبي.", "ru": "Это количественное числительное мужского рода, не порядковое.", "en": "That is a masculine cardinal, not an ordinal."}]),
Q("ha-noun-3-3",{"he": "מהי צורת הסמיכות של \"ספרים\" ו\"לימוד\" בצירוף שמשמעותו ספרים ללימוד?", "ar": "ما صيغة الإضافة لـ«ספרים» و«לימוד» بمعنى كتب للدراسة؟", "ru": "Какова сопряжённая форма «ספרים» и «לימוד» в значении учебных книг?", "en": "What is the construct form of \"ספרים\" and \"לימוד\" meaning study books?"},[{"he": "ספרי לימוד", "ar": "ספרי לימוד", "ru": "ספרי לימוד", "en": "ספרי לימוד"}, {"he": "ספרים לימוד", "ar": "ספרים לימוד", "ru": "ספרים לימוד", "en": "ספרים לימוד"}, {"he": "הספרים לימוד", "ar": "הספרים לימוד", "ru": "הספרים לימוד", "en": "הספרים לימוד"}, {"he": "ספרים של לימוד", "ar": "ספרים של לימוד", "ru": "ספרים של לימוד", "en": "ספרים של לימוד"}],0,{"he": "בדקו איך משתנה סיומת רבים בזכר כשהשם בא ראשון בסמיכות.", "ar": "افحصوا كيف تتغيّر نهاية جمع المذكر حين يأتي الاسم أولًا في الإضافة.", "ru": "Проверьте, как меняется окончание множественного числа мужского рода у первого слова.", "en": "Check how the masculine plural ending changes on the first noun."},{"he": "בנסמך ברבים הסיומת \"־ים\" משתנה ל\"־י\": \"ספרי לימוד\". למשל: \"תלמידי הכיתה\".", "ar": "في المضاف جمع المذكر تتحوّل النهاية «־ים» إلى «־י»: «ספרי לימוד». ومثلها «תלמידי הכיתה».", "ru": "У первого слова мужского рода во множественном числе окончание «־ים» меняется на «־י»: «ספרי לימוד». Например: «תלמידי הכיתה».", "en": "In a masculine plural construct, ־ים becomes ־י: \"ספרי לימוד\". Compare \"תלמידי הכיתה\"."},null,[null, {"he": "שם הרבים הראשון לא הועבר לצורת הנסמך.", "ar": "لم يتحوّل الاسم الأول الجمع إلى صيغة المضاف.", "ru": "Первое слово во множественном числе не переведено в сопряжённую форму.", "en": "The first plural noun has not taken its construct form."}, {"he": "ה הידיעה והסיומת נשארו בצורתם הרגילה; זו אינה סמיכות תקינה.", "ar": "بقيت أداة التعريف ونهاية الجمع بصيغتهما العادية؛ هذه ليست إضافة صحيحة.", "ru": "Артикль и окончание остались в обычной форме; это не верная сопряжённая конструкция.", "en": "The article and ending remain in ordinary form; this is not a valid construct."}, {"he": "זהו צירוף עם \"של\", ולא צורת הסמיכות המבוקשת.", "ar": "هذا تركيب مع «של» لا صيغة الإضافة المطلوبة.", "ru": "Это конструкция с «של», а не требуемая сопряжённая форма.", "en": "This uses \"של\", not the requested construct form."}]),
Q("nn-3-01",{"he": "השלימו: \"כיתת המדעים ___ נפתחה השנה\".", "ar": "أكملوا: «כיתת המדעים ___ נפתחה השנה» (صف العلوم ___ افتُتح هذه السنة).", "ru": "Дополните: «כיתת המדעים ___ נפתחה השנה» (кабинет естествознания ___ открылся в этом году).", "en": "Complete: \"כיתת המדעים ___ נפתחה השנה\" (the ___ science classroom opened this year)."},[{"he": "החדשים והיפים", "ar": "החדשים והיפים", "ru": "החדשים והיפים", "en": "החדשים והיפים"}, {"he": "חדשה", "ar": "חדשה", "ru": "חדשה", "en": "חדשה"}, {"he": "החדש", "ar": "החדש", "ru": "החדש", "en": "החדש"}, {"he": "החדשה", "ar": "החדשה", "ru": "החדשה", "en": "החדשה"}],3,{"he": "שאלו: מה חדש, הכיתה או המדעים?", "ar": "اسألوا: ما الجديد، الصف أم العلوم؟", "ru": "Спросите: что новое - класс или науки?", "en": "Ask: what is new, the classroom or the sciences?"},{"he": "התואר מתאר את השם הראשון, \"כיתה\", שהיא נקבה יחידה. הצירוף מיודע בגלל \"המדעים\", ולכן גם התואר מיודע: \"החדשה\".", "ar": "الصفة تصف الاسم الأول «כיתה»، وهو مؤنّث مفرد. التركيب معرّف بسبب «המדעים»، لذلك الصفة معرّفة: «החדשה».", "ru": "Прилагательное описывает первое слово, «כיתה», - ж. род ед. числа. Сочетание определённое из-за «המדעים», поэтому и прилагательное с артиклем: «החדשה».", "en": "The adjective describes the first noun, \"כיתה\", feminine singular. The phrase is definite through \"המדעים\", so the adjective is too: \"החדשה\"."},null,[{"he": "התואר מתאים ל\"כיתה\", ולא ל\"מדעים\" שבאים אחריה.", "ar": "الصفة تطابق «כיתה» لا «מדעים» التي بعدها.", "ru": "Прилагательное согласуется с «כיתה», а не с «מדעים».", "en": "The adjective agrees with \"כיתה\", not with \"מדעים\"."}, {"he": "הצירוף מיודע, ולכן גם התואר צריך ה הידיעה.", "ar": "التركيب معرّف، فتحتاج الصفة أيضًا ה التعريف.", "ru": "Сочетание определённое, поэтому и прилагательному нужен артикль.", "en": "The phrase is definite, so the adjective needs ה too."}, {"he": "\"כיתה\" היא נקבה, ו\"החדש\" היא צורת זכר.", "ar": "«כיתה» مؤنّث، و«החדש» صيغة مذكّر.", "ru": "«כיתה» - женский род, а «החדש» - мужской.", "en": "\"כיתה\" is feminine, but \"החדש\" is masculine."}, null]),
Q("nn-3-02",{"he": "מה המשמעות של \"בנותיה\"?", "ar": "ما معنى «בנותיה»؟", "ru": "Что означает «בנותיה»?", "en": "What does \"בנותיה\" mean?"},[{"he": "הבנות שלה", "ar": "بناتها", "ru": "её дочери", "en": "her daughters"}, {"he": "הבת שלה", "ar": "ابنتها", "ru": "её дочь", "en": "her daughter"}, {"he": "הבנות שלו", "ar": "بناته", "ru": "его дочери", "en": "his daughters"}, {"he": "הבת שלה ושל בעלה", "ar": "ابنتها هي وزوجها", "ru": "дочь её и её мужа", "en": "the daughter of her and her husband"}],0,{"he": "פרקו את המילה לשלושה חלקים: השם, סימן הרבים והסיומת.", "ar": "فكّكوا الكلمة إلى ثلاثة أجزاء: الاسم وعلامة الجمع واللاحقة.", "ru": "Разделите слово на три части: основа, признак мн. числа и окончание.", "en": "Split the word into three parts: the noun, the plural mark and the ending."},{"he": "\"בנות\" הן הרבים של \"בת\". הסיומת ־יה פירושה \"שלה\". לכן \"בנותיה\" הן הבנות שלה, כמו \"שמלותיה\".", "ar": "«בנות» جمع «בת». اللاحقة ־יה تعني «لها». لذلك «בנותיה» بناتها، مثل «שמלותיה».", "ru": "«בנות» - мн. число от «בת». Окончание ־יה значит «её». Поэтому «בנותיה» - её дочери, как «שמלותיה».", "en": "\"בנות\" is the plural of \"בת\". The ending ־יה means \"her\". So \"בנותיה\" means her daughters, like \"שמלותיה\"."},null,[null, {"he": "הסיומת ־יה אחרי ־ות מראה רבים, ולא בת אחת.", "ar": "اللاحقة ־יה بعد ־ות تدل على الجمع، لا على بنت واحدة.", "ru": "־יה после ־ות указывает на мн. число, а не на одну дочь.", "en": "The ending ־יה after ־ות shows plural, not one daughter."}, {"he": "לגוף \"הוא\" אומרים \"בנותיו\", עם ־יו.", "ar": "لـ «هو» نقول «בנותיו» بـ ־יו.", "ru": "Для «он» говорят «בנותיו», с ־יו.", "en": "For \"he\" we say \"בנותיו\", with ־יו."}, {"he": "יש כאן כמה בנות, והסיומת מציינת רק \"שלה\".", "ar": "هنا عدة بنات، واللاحقة تعني «لها» فقط.", "ru": "Здесь несколько дочерей, и окончание значит только «её».", "en": "There are several daughters, and the ending means only \"her\"."}]),
Q("nn-3-03",{"he": "איזה צירוף שגוי?", "ar": "أي تركيب خاطئ؟", "ru": "Какое сочетание ошибочно?", "en": "Which phrase is incorrect?"},[{"he": "ההורים של דני", "ar": "ההורים של דני", "ru": "ההורים של דני", "en": "ההורים של דני"}, {"he": "ההורי של דני", "ar": "ההורי של דני", "ru": "ההורי של דני", "en": "ההורי של דני"}, {"he": "הוריו של דני הצעיר", "ar": "הוריו של דני הצעיר", "ru": "הוריו של דני הצעיר", "en": "הוריו של דני הצעיר"}, {"he": "הורי דני", "ar": "הורי דני", "ru": "הורי דני", "en": "הורי דני"}],1,{"he": "בדקו אם צורת הסמיכות באה עם ה הידיעה או עם \"של\".", "ar": "افحصوا هل جاءت صيغة الإضافة مع ה التعريف أو مع «של».", "ru": "Проверьте, стоит ли сопряжённая форма с артиклем или с «של».", "en": "Check whether a construct form appears with the article or with \"של\"."},{"he": "\"הורי\" היא צורת סמיכות, והיא צריכה שם צמוד אחריה. אי אפשר להוסיף לה ה הידיעה או \"של\". אומרים \"הורי דני\" או \"ההורים של דני\".", "ar": "«הורי» صيغة إضافة وتحتاج اسمًا ملاصقًا بعدها. لا نضيف إليها ה التعريف أو «של». نقول «הורי דני» أو «ההורים של דני».", "ru": "«הורי» - сопряжённая форма, после неё нужно слово. К ней не добавляют артикль или «של». Говорят «הורי דני» или «ההורים של דני».", "en": "\"הורי\" is a construct form and needs a noun right after it. It cannot take the article or \"של\". We say \"הורי דני\" or \"ההורים של דני\"."},null,[{"he": "זה צירוף תקין עם \"של\".", "ar": "هذا تركيب صحيح مع «של».", "ru": "Это правильное сочетание с «של».", "en": "This is a correct phrase with \"של\"."}, null, {"he": "זה צירוף תקין: סיומת שייכות ואחריה \"של\".", "ar": "هذا تركيب صحيح: لاحقة ملكية ثم «של».", "ru": "Это правильно: притяжательное окончание, затем «של».", "en": "This is correct: a possessive ending followed by \"של\"."}, {"he": "זו סמיכות תקינה: \"הורים\" הופך ל\"הורי\".", "ar": "هذه إضافة صحيحة: «הורים» تصبح «הורי».", "ru": "Это правильный смихут: «הורים» - «הורי».", "en": "This is a correct smichut: \"הורים\" becomes \"הורי\"."}]),
Q("nn-3-04",{"he": "במשפט \"מכוניות המורים חונות בחניה\", עם איזו מילה מתאים הפועל \"חונות\"?", "ar": "في الجملة «מכוניות המורים חונות בחניה» (سيارات المعلّمين متوقفة في الموقف)، مع أي كلمة يتطابق الفعل «חונות»؟", "ru": "В предложении «מכוניות המורים חונות בחניה» (машины учителей стоят на стоянке) с каким словом согласуется глагол «חונות»?", "en": "In \"מכוניות המורים חונות בחניה\" (the teachers’ cars are parked in the lot), which word does \"חונות\" agree with?"},[{"he": "המורים", "ar": "המורים", "ru": "המורים", "en": "המורים"}, {"he": "בחניה", "ar": "בחניה", "ru": "בחניה", "en": "בחניה"}, {"he": "מכוניות", "ar": "מכוניות", "ru": "מכוניות", "en": "מכוניות"}, {"he": "המורים, כי הם קרובים לפועל", "ar": "המורים، لأنها الأقرب إلى الفعل", "ru": "המורים, потому что оно ближе к глаголу", "en": "המורים, because it is closer to the verb"}],2,{"he": "שאלו: מה חונה בחניה?", "ar": "اسألوا: ما الذي يتوقف في الموقف؟", "ru": "Спросите: что стоит на стоянке?", "en": "Ask: what is parked in the lot?"},{"he": "בסמיכות השם הראשון הוא העיקר. המכוניות חונות, ולא המורים. לכן הפועל בנקבה רבות: \"חונות\".", "ar": "في الإضافة الاسم الأول هو الأساس. السيارات هي المتوقفة لا المعلّمون. لذلك الفعل جمع مؤنّث: «חונות».", "ru": "В смихуте главное - первое слово. Стоят машины, а не учителя. Поэтому глагол в ж. роде мн. числа: «חונות».", "en": "In smichut the first noun is the head. The cars are parked, not the teachers. So the verb is feminine plural: \"חונות\"."},null,[{"he": "\"המורים\" הם זכר, ו\"חונות\" היא צורת נקבה.", "ar": "«המורים» مذكّر، و«חונות» صيغة مؤنّث.", "ru": "«המורים» - мужской род, а «חונות» - женский.", "en": "\"המורים\" is masculine, but \"חונות\" is feminine."}, {"he": "\"בחניה\" מציינת מקום, והיא לא הנושא.", "ar": "«בחניה» تدل على المكان، وليست الفاعل.", "ru": "«בחניה» обозначает место и не является подлежащим.", "en": "\"בחניה\" names a place; it is not the subject."}, null, {"he": "הפועל מתאים לשם הראשון בסמיכות, גם אם הוא רחוק.", "ar": "الفعل يطابق الاسم الأول في الإضافة حتى لو كان بعيدًا.", "ru": "Глагол согласуется с первым словом смихута, даже если оно дальше.", "en": "The verb agrees with the first noun of the smichut, even if farther away."}]),
Q("nn-3-05",{"he": "מה הצורה המחוברת של \"החברים שלך\" (פונים לזכר)?", "ar": "ما الصيغة المتصلة لـ «החברים שלך» (أصدقاؤك، لمذكّر)؟", "ru": "Какая слитная форма у «החברים שלך» (твои друзья, обращение к мужчине)?", "en": "What is the suffixed form of \"החברים שלך\" (your friends, addressing a male)?"},[{"he": "חברך", "ar": "חברך", "ru": "חברך", "en": "חברך"}, {"he": "חבריכם", "ar": "חבריכם", "ru": "חבריכם", "en": "חבריכם"}, {"he": "חבריך שלך", "ar": "חבריך שלך", "ru": "חבריך שלך", "en": "חבריך שלך"}, {"he": "חבריך", "ar": "חבריך", "ru": "חבריך", "en": "חבריך"}],3,{"he": "הצורה צריכה להראות גם רבים וגם פנייה לאדם אחד.", "ar": "يجب أن تُظهر الصيغة الجمع والخطاب لشخص واحد.", "ru": "Форма должна показать и мн. число, и обращение к одному.", "en": "The form must show both plural and addressing one person."},{"he": "\"חברים\" מאבד את ה־ם ומקבל ־יך. ה־י מראה שיש כמה חברים, וה־ך מראה \"שלך\". כך גם \"ספריך\".", "ar": "«חברים» تفقد ם وتأخذ ־יך. حرف י يدل على عدة أصدقاء، و ך تعني «لك». ومثلها «ספריך».", "ru": "«חברים» теряет ם и получает ־יך. י показывает, что друзей несколько, а ך - «твои». Так же «ספריך».", "en": "\"חברים\" loses its ם and takes ־יך. The י shows several friends, and ך means \"your\". Likewise \"ספריך\"."},null,[{"he": "\"חברך\" פירושו חבר אחד שלך, ולא כמה חברים.", "ar": "«חברך» تعني صديقًا واحدًا لك، لا عدة أصدقاء.", "ru": "«חברך» - это один твой друг, а не несколько.", "en": "\"חברך\" means one friend of yours, not several."}, {"he": "\"חבריכם\" פונה לכמה אנשים: החברים שלכם.", "ar": "«חבריכם» خطاب لعدة أشخاص: أصدقاؤكم.", "ru": "«חבריכם» - обращение к нескольким: ваши друзья.", "en": "\"חבריכם\" addresses several people: your (plural) friends."}, {"he": "הסיומת כבר אומרת \"שלך\", ואין צורך לחזור.", "ar": "اللاحقة تعني «لك»، ولا حاجة للتكرار.", "ru": "Окончание уже значит «твои», повторять не нужно.", "en": "The ending already means \"your\"; no need to repeat it."}, null]),
Q("nn-3-06",{"he": "מה הצורה המחוברת של \"המחברות שלה\"?", "ar": "ما الصيغة المتصلة لـ «המחברות שלה» (دفاترها)؟", "ru": "Какая слитная форма у «המחברות שלה» (её тетради)?", "en": "What is the suffixed form of \"המחברות שלה\" (her notebooks)?"},[{"he": "מחברותיה", "ar": "מחברותיה", "ru": "מחברותיה", "en": "מחברותיה"}, {"he": "מחברתה", "ar": "מחברתה", "ru": "מחברתה", "en": "מחברתה"}, {"he": "מחברותיהן הרבות", "ar": "מחברותיהן הרבות", "ru": "מחברותיהן הרבות", "en": "מחברותיהן הרבות"}, {"he": "מחברותה", "ar": "מחברותה", "ru": "מחברותה", "en": "מחברותה"}],0,{"he": "הצורה צריכה להראות גם רבים וגם \"שלה\".", "ar": "يجب أن تُظهر الصيغة الجمع و«لها» معًا.", "ru": "Форма должна показать и мн. число, и «её».", "en": "The form must show both plural and \"her\"."},{"he": "לשם נקבה ברבים מוסיפים אחרי ־ות את הסיומת ־יה. לכן \"מחברות\" הופכת ל\"מחברותיה\". כך גם \"בנותיה\".", "ar": "للاسم المؤنّث الجمع نضيف بعد ־ות اللاحقة ־יה. لذلك «מחברות» تصبح «מחברותיה». ومثلها «בנותיה».", "ru": "К женскому мн. числу после ־ות прибавляют ־יה. Поэтому «מחברות» - «מחברותיה». Так же «בנותיה».", "en": "A feminine plural adds ־יה after ־ות. So \"מחברות\" becomes \"מחברותיה\". Likewise \"בנותיה\"."},null,[null, {"he": "\"מחברתה\" פירושו מחברת אחת שלה.", "ar": "«מחברתה» تعني دفترًا واحدًا لها.", "ru": "«מחברתה» - это одна её тетрадь.", "en": "\"מחברתה\" means one notebook of hers."}, {"he": "הסיומת ־יהן פירושה \"שלהן\", כמה נשים ולא אחת.", "ar": "اللاحقة ־יהן تعني «لهنّ»، لعدة نساء لا لواحدة.", "ru": "Окончание ־יהן значит «их» (ж. р.), а не «её».", "en": "The ending ־יהן means \"their (feminine)\", not \"her\"."}, {"he": "לפני ־ה של \"שלה\" ברבים צריך י: ־יה.", "ar": "قبل ה بمعنى «لها» في الجمع نحتاج י: ־יה.", "ru": "Перед ה со значением «её» во мн. числе нужна י: ־יה.", "en": "Before the ה meaning \"her\", a plural needs י: ־יה."}]),
],
]);

Q("ha-syntax-1-1",{"he": "איזה משפט הוא משפט פועלי?", "ar": "أي جملة هي جملة فعلية؟", "ru": "Какое предложение является глагольным?", "en": "Which sentence is verbal?"},[{"he": "הספר על המדף.", "ar": "הספר על המדף.", "ru": "הספר על המדף.", "en": "הספר על המדף."}, {"he": "הילדה קוראת סיפור.", "ar": "הילדה קוראת סיפור.", "ru": "הילדה קוראת סיפור.", "en": "הילדה קוראת סיפור."}, {"he": "החצר רחבה.", "ar": "החצר רחבה.", "ru": "החצר רחבה.", "en": "החצר רחבה."}, {"he": "אחי תלמיד בתיכון.", "ar": "אחי תלמיד בתיכון.", "ru": "אחי תלמיד בתיכון.", "en": "אחי תלמיד בתיכון."}],1,{"he": "בדקו אם הנשוא הוא פועל נטוי.", "ar": "افحصوا هل الخبر فعل مصرّف.", "ru": "Проверьте, является ли сказуемое личной формой глагола.", "en": "Check whether the predicate is a conjugated verb."},{"he": "ב\"הילדה קוראת סיפור\" הנשוא \"קוראת\" הוא פועל. למשל: \"הילד כותב מכתב\" הוא משפט פועלי.", "ar": "في «הילדה קוראת סיפור» الخبر «קוראת» فعل. ومثلها «الولد يكتب رسالة».", "ru": "В «הילדה קוראת סיפור» сказуемое «קוראת» - глагол. Например, «Мальчик пишет письмо» - глагольное предложение.", "en": "In \"הילדה קוראת סיפור\", \"קוראת\" is a verb predicate. \"The boy writes a letter\" is also verbal."},null,[{"he": "הנשוא כאן אינו פועל נטוי.", "ar": "الخبر هنا ليس فعلًا مصرّفًا.", "ru": "Сказуемое здесь не личная форма глагола.", "en": "The predicate here is not a conjugated verb."}, null, {"he": "\"רחבה\" הוא תואר, לא פועל נטוי.", "ar": "«רחבה» صفة لا فعل مصرّف.", "ru": "«רחבה» - прилагательное, не личная форма глагола.", "en": "\"רחבה\" is an adjective, not a conjugated verb."}, {"he": "\"תלמיד\" הוא שם עצם, לא פועל נטוי.", "ar": "«תלמיד» اسم لا فعل مصرّف.", "ru": "«תלמיד» - существительное, не личная форма глагола.", "en": "\"תלמיד\" is a noun, not a conjugated verb."}]),
Q("ha-syntax-1-2",{"he": "מהו הנושא במשפט \"התלמידים פתרו את התרגיל\"?", "ar": "ما المسند إليه (الفاعل) في جملة «התלמידים פתרו את התרגיל»؟", "ru": "Что является подлежащим в «התלמידים פתרו את התרגיל»?", "en": "What is the subject of \"התלמידים פתרו את התרגיל\"?"},[{"he": "התלמידים", "ar": "התלמידים", "ru": "התלמידים", "en": "התלמידים"}, {"he": "פתרו", "ar": "פתרו", "ru": "פתרו", "en": "פתרו"}, {"he": "את התרגיל", "ar": "את התרגיל", "ru": "את התרגיל", "en": "את התרגיל"}, {"he": "התרגיל", "ar": "התרגיל", "ru": "התרגיל", "en": "התרגיל"}],0,{"he": "שאלו מי ביצע את הפעולה.", "ar": "اسألوا من قام بالفعل.", "ru": "Спросите, кто совершил действие.", "en": "Ask who performed the action."},{"he": "\"התלמידים\" הם המבצעים את הפעולה ולכן הם הנושא. למשל: ב\"המורה הסבירה\" הנושא הוא \"המורה\".", "ar": "«التلاميذ» هم من قاموا بالفعل، لذا هم الفاعل. ومثلًا فاعل «شرحت المعلمة» هو «المعلمة».", "ru": "«התלמידים» выполняют действие и являются подлежащим. Например, в «המורה הסבירה» подлежащее - «המורה».", "en": "\"התלמידים\" perform the action and are the subject. In \"המורה הסבירה\", the subject is \"המורה\"."},null,[null, {"he": "זהו הנשוא הפועלי: הפעולה שנעשתה.", "ar": "هذا هو الفعل الذي يبيّن الحدث.", "ru": "Это глагольное сказуемое, обозначающее действие.", "en": "This is the verb predicate, the action performed."}, {"he": "זהו המושא של הפועל, לא מבצע הפעולה.", "ar": "هذا مفعول به لا فاعل.", "ru": "Это дополнение, а не исполнитель действия.", "en": "This is the object, not the actor."}, {"he": "השם מציין את מה שפתרו, לא את מי שפתר.", "ar": "يدل الاسم على ما حُلّ لا من حلّه.", "ru": "Слово обозначает то, что решили, а не того, кто решил.", "en": "The noun names what was solved, not who solved it."}]),
Q("ha-syntax-1-3",{"he": "איזה משפט תקין מבחינת התאם מין ומספר?", "ar": "أي جملة صحيحة من حيث توافق الجنس والعدد؟", "ru": "Какое предложение правильно по согласованию рода и числа?", "en": "Which sentence has correct gender and number agreement?"},[{"he": "הילדות משחק.", "ar": "הילדות משחק.", "ru": "הילדות משחק.", "en": "הילדות משחק."}, {"he": "הילדות משחקת.", "ar": "הילדות משחקת.", "ru": "הילדות משחקת.", "en": "הילדות משחקת."}, {"he": "הילדות משחקים.", "ar": "הילדות משחקים.", "ru": "הילדות משחקים.", "en": "הילדות משחקים."}, {"he": "הילדות משחקות.", "ar": "הילדות משחקות.", "ru": "הילדות משחקות.", "en": "הילדות משחקות."}],3,{"he": "התאימו את הפועל לנושא גם במין וגם במספר.", "ar": "طابقوا الفعل مع الفاعل في الجنس والعدد.", "ru": "Согласуйте глагол с подлежащим по роду и числу.", "en": "Match the verb to the subject in both gender and number."},{"he": "\"הילדות\" הן נקבה רבות, ולכן הפועל בהווה הוא \"משחקות\". למשל: \"התלמידות לומדות\".", "ar": "«הילדות» جمع مؤنث، لذلك الفعل المضارع «משחקות». مثلًا: «الطالبات يدرسن».", "ru": "«הילדות» - женский род множественного числа, поэтому глагол в настоящем времени - «משחקות». Например: «התלמידות לומדות».", "en": "\"הילדות\" is feminine plural, so the present verb is \"משחקות\". Compare \"התלמידות לומדות\"."},null,[{"he": "הפועל כאן ביחיד זכר, והנושא ברבות נקבה.", "ar": "الفعل مفرد مذكر والفاعل جمع مؤنث.", "ru": "Глагол мужского рода единственного числа, подлежащее женского рода множественного.", "en": "The verb is masculine singular; the subject is feminine plural."}, {"he": "הפועל כאן ביחידה נקבה, והנושא ברבות.", "ar": "الفعل مفرد مؤنث والفاعل جمع.", "ru": "Глагол женского рода единственного числа, подлежащее множественного.", "en": "The verb is feminine singular; the subject is plural."}, {"he": "הפועל כאן ברבים זכר, והנושא ברבות נקבה.", "ar": "الفعل جمع مذكر والفاعل جمع مؤنث.", "ru": "Глагол мужского рода множественного числа, подлежащее женского рода множественного.", "en": "The verb is masculine plural; the subject is feminine plural."}, null]),
Q("sx-1-01",{"he": "מהו המושא במשפט \"דנה קנתה עגבניות בשוק השכונתי\"?", "ar": "ما المفعول به في جملة «דנה קנתה עגבניות בשוק השכונתי»؟", "ru": "Какое слово - дополнение в предложении «דנה קנתה עגבניות בשוק השכונתי»?", "en": "What is the object in the sentence \"דנה קנתה עגבניות בשוק השכונתי\"?"},[{"he": "דנה", "ar": "דנה", "ru": "דנה", "en": "דנה"}, {"he": "קנתה", "ar": "קנתה", "ru": "קנתה", "en": "קנתה"}, {"he": "בשוק השכונתי", "ar": "בשוק השכונתי", "ru": "בשוק השכונתי", "en": "בשוק השכונתי"}, {"he": "עגבניות", "ar": "עגבניות", "ru": "עגבניות", "en": "עגבניות"}],3,{"he": "שאלו על מה עברה הפעולה.", "ar": "اسألوا: على ماذا وقع الفعل؟", "ru": "Спросите, на что направлено действие.", "en": "Ask what the action was done to."},{"he": "המושא הוא מה שהפעולה עוברת עליו. מה דנה קנתה? עגבניות. לכן \"עגבניות\" הוא המושא.", "ar": "المفعول به هو ما يقع عليه الفعل. ماذا اشترت دانا؟ «עגבניות» (طماطم). لذلك هي المفعول به.", "ru": "Дополнение - то, на что направлено действие. Что купила Дана? «עגבניות» (помидоры). Значит, это дополнение.", "en": "The object is what the action is done to. What did Dana buy? \"עגבניות\" (tomatoes). So it is the object."},null,[{"he": "דנה היא מי שקנתה, ולכן היא הנושא.", "ar": "«דנה» هي التي اشترت، لذلك هي المسند إليه.", "ru": "«דנה» - та, кто купила, поэтому это подлежащее.", "en": "\"דנה\" is the one who bought, so it is the subject."}, {"he": "\"קנתה\" היא הפעולה, ולכן היא הנשוא.", "ar": "«קנתה» هي الفعل، لذلك هي المسند.", "ru": "«קנתה» - это действие, поэтому это сказуемое.", "en": "\"קנתה\" is the action, so it is the predicate."}, {"he": "\"בשוק השכונתי\" עונה על השאלה איפה, ולכן הוא תיאור מקום.", "ar": "«בשוק השכונתי» يجيب عن السؤال أين، لذلك هو ظرف مكان.", "ru": "«בשוק השכונתי» отвечает на вопрос «где?», это обстоятельство места.", "en": "\"בשוק השכונתי\" answers \"where?\", so it is a place adverbial."}, null]),
Q("sx-1-02",{"he": "איזו מילת קישור מביעה ניגוד?", "ar": "أي أداة ربط تعبّر عن التناقض؟", "ru": "Какой союз выражает противопоставление?", "en": "Which connector expresses contrast?"},[{"he": "לכן", "ar": "לכן", "ru": "לכן", "en": "לכן"}, {"he": "אולם", "ar": "אולם", "ru": "אולם", "en": "אולם"}, {"he": "מפני ש", "ar": "מפני ש", "ru": "מפני ש", "en": "מפני ש"}, {"he": "כתוצאה מכך", "ar": "כתוצאה מכך", "ru": "כתוצאה מכך", "en": "כתוצאה מכך"}],1,{"he": "חפשו מילה שמציגה שני רעיונות הפוכים.", "ar": "ابحثوا عن كلمة تعرض فكرتين متعاكستين.", "ru": "Ищите слово, которое сталкивает две противоположные мысли.", "en": "Look for a word that sets two opposite ideas against each other."},{"he": "\"אולם\" פירושה \"אבל\". היא מחברת בין שני רעיונות שעומדים זה מול זה. למשל: \"רציתי לבוא, אולם חליתי\".", "ar": "«אולם» معناها «لكنّ». تربط بين فكرتين متعارضتين. مثلًا: «רציתי לבוא, אולם חליתי» (أردت أن آتي، لكنني مرضت).", "ru": "«אולם» значит «однако». Это слово связывает две противоположные мысли. Например: «רציתי לבוא, אולם חליתי» (я хотел прийти, однако заболел).", "en": "\"אולם\" means \"however\". It links two opposing ideas. For example: \"רציתי לבוא, אולם חליתי\" (I wanted to come, however I got sick)."},null,[{"he": "\"לכן\" מביעה תוצאה, לא ניגוד.", "ar": "«לכן» تعبّر عن النتيجة، لا عن التناقض.", "ru": "«לכן» выражает следствие, а не противопоставление.", "en": "\"לכן\" expresses result, not contrast."}, null, {"he": "\"מפני ש\" מביעה סיבה, לא ניגוד.", "ar": "«מפני ש» تعبّر عن السبب، لا عن التناقض.", "ru": "«מפני ש» выражает причину, а не противопоставление.", "en": "\"מפני ש\" expresses cause, not contrast."}, {"he": "\"כתוצאה מכך\" מביעה תוצאה, לא ניגוד.", "ar": "«כתוצאה מכך» تعبّر عن النتيجة، لا عن التناقض.", "ru": "«כתוצאה מכך» выражает следствие, а не противопоставление.", "en": "\"כתוצאה מכך\" expresses result, not contrast."}]),
Q("sx-1-03",{"he": "במשפט \"הכלב הגדול נבח\", מה התפקיד של \"הגדול\"?", "ar": "في جملة «הכלב הגדול נבח»، ما وظيفة «הגדול»؟", "ru": "Какова роль слова «הגדול» в предложении «הכלב הגדול נבח»?", "en": "What is the role of \"הגדול\" in \"הכלב הגדול נבח\"?"},[{"he": "לוואי", "ar": "نعت", "ru": "определение", "en": "attribute"}, {"he": "נושא", "ar": "المسند إليه", "ru": "подлежащее", "en": "subject"}, {"he": "נשוא", "ar": "المسند", "ru": "сказуемое", "en": "predicate"}, {"he": "תיאור אופן", "ar": "حال يصف طريقة الفعل", "ru": "обстоятельство образа действия", "en": "adverbial of manner"}],0,{"he": "בדקו אם המילה מוסיפה פרט על פעולה או על שם עצם.", "ar": "افحصوا: هل تضيف الكلمة تفصيلًا إلى فعل أم إلى اسم؟", "ru": "Проверьте, к чему слово добавляет деталь: к действию или к существительному.", "en": "Check whether the word adds detail to an action or to a noun."},{"he": "\"הגדול\" מתאר את שם העצם \"הכלב\" ובא מיד אחריו, ולכן הוא לוואי. הוא מתאים לו במין, במספר ובידיעה.", "ar": "«הגדול» يصف الاسم «הכלב» ويأتي بعده مباشرة، لذلك هو نعت. وهو يطابقه في الجنس والعدد والتعريف.", "ru": "«הגדול» описывает существительное «הכלב» и стоит сразу после него, поэтому это определение. Оно согласуется с ним в роде, числе и определённости.", "en": "\"הגדול\" describes the noun \"הכלב\" and comes right after it, so it is an attribute. It agrees with it in gender, number and definiteness."},null,[null, {"he": "הנושא הוא \"הכלב\". \"הגדול\" רק מתאר אותו.", "ar": "المسند إليه هو «הכלב»، و«הגדול» يصفه فقط.", "ru": "Подлежащее - «הכלב», а «הגדול» только описывает его.", "en": "The subject is \"הכלב\"; \"הגדול\" only describes it."}, {"he": "הנשוא הוא הפועל \"נבח\".", "ar": "المسند هو الفعل «נבח».", "ru": "Сказуемое - глагол «נבח».", "en": "The predicate is the verb \"נבח\"."}, {"he": "\"הגדול\" מתאר את הכלב, ולא את האופן שבו נבח.", "ar": "«הגדול» يصف الكلب، لا طريقة النباح.", "ru": "«הגדול» описывает собаку, а не то, как она лаяла.", "en": "\"הגדול\" describes the dog, not how it barked."}]),
Q("sx-1-04",{"he": "במשפט \"יצאנו לטיול בבוקר\", איזה תיאור הוא \"בבוקר\"?", "ar": "في جملة «יצאנו לטיול בבוקר»، أي نوع من الظروف هو «בבוקר»؟", "ru": "Каким обстоятельством является «בבוקר» в предложении «יצאנו לטיול בבוקר»?", "en": "In \"יצאנו לטיול בבוקר\", what kind of adverbial is \"בבוקר\"?"},[{"he": "תיאור מקום", "ar": "ظرف مكان", "ru": "обстоятельство места", "en": "place adverbial"}, {"he": "תיאור תכלית (מטרה)", "ar": "تكملة الغاية (الهدف)", "ru": "обстоятельство цели (назначения)", "en": "purpose adverbial (aim)"}, {"he": "תיאור זמן", "ar": "ظرف زمان", "ru": "обстоятельство времени", "en": "time adverbial"}, {"he": "מושא עקיף", "ar": "مفعول به غير مباشر", "ru": "косвенное дополнение", "en": "indirect object"}],2,{"he": "חשבו על איזו שאלה עונה המילה.", "ar": "فكّروا: عن أي سؤال تجيب الكلمة؟", "ru": "Подумайте, на какой вопрос отвечает слово.", "en": "Think about which question the word answers."},{"he": "\"בבוקר\" עונה על השאלה מתי יצאנו. מילה שעונה על \"מתי?\" היא תיאור זמן. למשל: \"נפגשנו אתמול\".", "ar": "«בבוקר» (في الصباح) يجيب عن السؤال متى خرجنا. الكلمة التي تجيب عن «متى؟» هي ظرف زمان. مثلًا: «נפגשנו אתמול» (التقينا أمس).", "ru": "«בבוקר» (утром) отвечает на вопрос, когда мы вышли. Слово, отвечающее на «когда?», - обстоятельство времени. Например: «נפגשנו אתמול» (мы встретились вчера).", "en": "\"בבוקר\" (in the morning) answers when we left. A word that answers \"when?\" is a time adverbial. For example: \"נפגשנו אתמול\" (we met yesterday)."},null,[{"he": "\"בבוקר\" עונה על השאלה מתי, ולא על השאלה איפה.", "ar": "«בבוקר» يجيب عن «متى؟» لا عن «أين؟».", "ru": "«בבוקר» отвечает на вопрос «когда?», а не «где?».", "en": "\"בבוקר\" answers \"when?\", not \"where?\"."}, {"he": "\"בבוקר\" אינו מסביר לשם מה יצאנו.", "ar": "«בבוקר» لا يشرح لأي هدف خرجنا.", "ru": "«בבוקר» не объясняет, зачем мы вышли.", "en": "\"בבוקר\" does not explain what we went out for."}, null, {"he": "\"בבוקר\" אינו מושא. הוא מוסר את זמן הפעולה.", "ar": "«בבוקר» ليس مفعولًا به، بل يحدّد زمن الفعل.", "ru": "«בבוקר» не дополнение: он указывает время действия.", "en": "\"בבוקר\" is not an object; it gives the time of the action."}]),
Q("sx-1-05",{"he": "איזה משפט הוא משפט מאוחה?", "ar": "أي جملة هي جملة معطوفة (משפט מאוחה)؟", "ru": "Какое предложение сложносочинённое (משפט מאוחה)?", "en": "Which sentence is a compound sentence (משפט מאוחה)?"},[{"he": "התלמיד שישב לידי עזר לי.", "ar": "התלמיד שישב לידי עזר לי.", "ru": "התלמיד שישב לידי עזר לי.", "en": "התלמיד שישב לידי עזר לי."}, {"he": "בבוקר שתיתי כוס תה חם.", "ar": "בבוקר שתיתי כוס תה חם.", "ru": "בבוקר שתיתי כוס תה חם.", "en": "בבוקר שתיתי כוס תה חם."}, {"he": "אמרתי לחברים שלי שהשיעור בוטל בגלל השביתה.", "ar": "אמרתי לחברים שלי שהשיעור בוטל בגלל השביתה.", "ru": "אמרתי לחברים שלי שהשיעור בוטל בגלל השביתה.", "en": "אמרתי לחברים שלי שהשיעור בוטל בגלל השביתה."}, {"he": "הלכתי לחנות, אבל היא הייתה סגורה.", "ar": "הלכתי לחנות, אבל היא הייתה סגורה.", "ru": "הלכתי לחנות, אבל היא הייתה סגורה.", "en": "הלכתי לחנות, אבל היא הייתה סגורה."}],3,{"he": "חפשו שני משפטים שווי מעמד שמחוברים במילת קישור.", "ar": "ابحثوا عن جملتين متساويتين تربط بينهما أداة ربط.", "ru": "Ищите два равноправных предложения, соединённых союзом.", "en": "Look for two equal clauses joined by a connector."},{"he": "משפט מאוחה בנוי משני משפטים שווי מעמד. כל אחד מהם יכול לעמוד לבד. כאן המילה \"אבל\" מחברת ביניהם.", "ar": "الجملة المعطوفة مكوّنة من جملتين متساويتين. كل واحدة منهما تستطيع أن تقف وحدها. وهنا تربط بينهما «אבל» (لكن).", "ru": "Сложносочинённое предложение состоит из двух равноправных частей. Каждая может стоять отдельно. Здесь их соединяет «אבל» (но).", "en": "A compound sentence has two equal clauses. Each one can stand alone. Here \"אבל\" (but) joins them."},null,[{"he": "זה משפט מורכב: \"שישב לידי\" היא פסוקית.", "ar": "هذه جملة مركّبة: «שישב לידי» جملة ثانوية.", "ru": "Это сложноподчинённое предложение: «שישב לידי» - придаточное.", "en": "This is a complex sentence: \"שישב לידי\" is a subordinate clause."}, {"he": "זה משפט פשוט, עם נשוא אחד בלבד.", "ar": "هذه جملة بسيطة فيها مسند واحد فقط.", "ru": "Это простое предложение с одним сказуемым.", "en": "This is a simple sentence with only one predicate."}, {"he": "זה משפט מורכב: \"שהשיעור בוטל\" היא פסוקית מושא.", "ar": "هذه جملة مركّبة: «שהשיעור בוטל» جملة ثانوية في موقع المفعول به.", "ru": "Это сложноподчинённое: «שהשיעור בוטל» - придаточное дополнения.", "en": "This is a complex sentence: \"שהשיעור בוטל\" is an object clause."}, null]),
Q("sx-1-06",{"he": "באיזה משפט יש התאם נכון בין כל חלקי המשפט?", "ar": "في أي جملة يوجد توافق صحيح بين كل أجزاء الجملة؟", "ru": "В каком предложении все части правильно согласованы?", "en": "In which sentence do all the parts agree correctly?"},[{"he": "הספרייה החדשה נפתח בשבוע שעבר.", "ar": "הספרייה החדשה נפתח בשבוע שעבר.", "ru": "הספרייה החדשה נפתח בשבוע שעבר.", "en": "הספרייה החדשה נפתח בשבוע שעבר."}, {"he": "הספרייה החדשה נפתחה בשבוע שעבר.", "ar": "הספרייה החדשה נפתחה בשבוע שעבר.", "ru": "הספרייה החדשה נפתחה בשבוע שעבר.", "en": "הספרייה החדשה נפתחה בשבוע שעבר."}, {"he": "הספרייה החדש נפתחה בשבוע שעבר.", "ar": "הספרייה החדש נפתחה בשבוע שעבר.", "ru": "הספרייה החדש נפתחה בשבוע שעבר.", "en": "הספרייה החדש נפתחה בשבוע שעבר."}, {"he": "הספריות החדשות נפתחה בשבוע שעבר בעיר.", "ar": "הספריות החדשות נפתחה בשבוע שעבר בעיר.", "ru": "הספריות החדשות נפתחה בשבוע שעבר בעיר.", "en": "הספריות החדשות נפתחה בשבוע שעבר בעיר."}],1,{"he": "בדקו מין ומספר גם בפועל וגם בתואר.", "ar": "افحصوا الجنس والعدد في الفعل وفي الصفة معًا.", "ru": "Проверьте род и число и у глагола, и у прилагательного.", "en": "Check gender and number in both the verb and the adjective."},{"he": "\"הספרייה\" היא נקבה יחידה. לכן גם הלוואי \"החדשה\" וגם הנשוא \"נפתחה\" בנקבה יחידה.", "ar": "«הספרייה» (المكتبة) مؤنّث مفرد. لذلك يأتي النعت «החדשה» والمسند «נפתחה» بصيغة المؤنّث المفرد أيضًا.", "ru": "«הספרייה» (библиотека) - женский род, единственное число. Поэтому и определение «החדשה», и сказуемое «נפתחה» стоят в женском роде единственного числа.", "en": "\"הספרייה\" (the library) is feminine singular. So the attribute \"החדשה\" and the predicate \"נפתחה\" are feminine singular too."},null,[{"he": "\"נפתח\" בזכר, אבל \"הספרייה\" בנקבה.", "ar": "«נפתח» بصيغة المذكّر، و«הספרייה» مؤنّثة.", "ru": "«נפתח» в мужском роде, а «הספרייה» - женского рода.", "en": "\"נפתח\" is masculine, but \"הספרייה\" is feminine."}, null, {"he": "הלוואי \"החדש\" בזכר, אבל \"הספרייה\" בנקבה.", "ar": "النعت «החדש» مذكّر، و«הספרייה» مؤنّثة.", "ru": "Определение «החדש» в мужском роде, а «הספרייה» - женского.", "en": "The attribute \"החדש\" is masculine, but \"הספרייה\" is feminine."}, {"he": "\"הספריות\" ברבות, אבל \"נפתחה\" ביחידה.", "ar": "«הספריות» جمع، أما «נפתחה» فمفرد.", "ru": "«הספריות» - множественное число, а «נפתחה» - единственное.", "en": "\"הספריות\" is plural, but \"נפתחה\" is singular."}]),
],
