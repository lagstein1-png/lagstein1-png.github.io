   Q("ha-read-2-1",{"he": "קראו את הקטע וענו על השאלה.<br>הדבורים ממלאות תפקיד מרכזי בטבע ובחקלאות: הן מעבירות אבקה מפרח לפרח, ובכך מאפשרות לצמחים רבים להתרבות. בלי דבורים, יבולים רבים, כמו תפוחים, שקדים ואבטיחים, היו מצטמצמים מאוד. בשנים האחרונות נרשמה ירידה במספר הדבורים בעולם, בין השאר בגלל שימוש נרחב בחומרי הדברה. חוקרים מציעים כמה דרכים לסייע לדבורים: לנטוע צמחים פורחים בגינות, להפחית בריסוס ולהקים כוורות בישובים. גם פעולות קטנות של אנשים פרטיים יכולות לתרום להצלת הדבורים.<br>מהו התפקיד המרכזי של הדבורים לפי הקטע?", "ar": "اقرأوا القطعة وأجيبوا عن السؤال.<br>تلعب النحلات دورًا مركزيًا في الطبيعة والزراعة: فهي تنقل حبوب اللقاح من زهرة إلى زهرة، وبذلك تتيح لكثير من النباتات أن تتكاثر. لولا النحل، لتقلّصت كثير من المحاصيل، مثل التفاح واللوز والبطيخ. في السنوات الأخيرة سُجّل انخفاض في عدد النحل في العالم، من جملة الأسباب بسبب استخدام واسع لمواد الرش. يقترح الباحثون عدة طرق لمساعدة النحل: غرس نباتات مزهرة في الحدائق، والتقليل من الرش، وإقامة مناحل في البلدات. حتى الأعمال الصغيرة من أشخاص عاديين يمكن أن تسهم في إنقاذ النحل.<br>ما الدور المركزي للنحلات بحسب القطعة؟", "ru": "Прочитайте отрывок и ответьте на вопрос.<br>Пчёлы играют центральную роль в природе и сельском хозяйстве: они переносят пыльцу с цветка на цветок и тем самым позволяют многим растениям размножаться. Без пчёл многие культуры, такие как яблоки, миндаль и арбузы, сильно сократились бы. В последние годы в мире отмечается снижение числа пчёл, в частности из-за широкого применения пестицидов. Исследователи предлагают несколько способов помочь пчёлам: высаживать цветущие растения в садах, уменьшить опрыскивание и ставить ульи в поселениях. Даже небольшие действия отдельных людей могут внести вклад в спасение пчёл.<br>Какова центральная роль пчёл по тексту?", "en": "Read the passage and answer the question.<br>Bees play a central role in nature and agriculture: they carry pollen from flower to flower, allowing many plants to reproduce. Without bees, many crops, such as apples, almonds and watermelons, would shrink greatly. In recent years a decline in the number of bees worldwide has been recorded, partly because of widespread use of pesticides. Researchers suggest several ways to help bees: plant flowering plants in gardens, reduce spraying, and set up hives in communities. Even small actions by private people can contribute to saving the bees.<br>What is the bees' central role according to the passage?"},[{"he": "ייצור דבש למכירה", "ar": "إنتاج العسل للبيع", "ru": "производство мёда на продажу", "en": "producing honey for sale"}, {"he": "העברת אבקה מפרח לפרח", "ar": "نقل حبوب اللقاح من زهرة إلى زهرة", "ru": "перенос пыльцы с цветка на цветок", "en": "carrying pollen from flower to flower"}, {"he": "הגנה על הכוורת מפני אויבים", "ar": "حماية الخلية من الأعداء", "ru": "защита улья от врагов", "en": "defending the hive from enemies"}, {"he": "פיזור זרעים בעזרת הרוח", "ar": "نشر البذور بمساعدة الريح", "ru": "разнесение семян ветром", "en": "scattering seeds with the wind"}],1,{"he": "הקטע פותח בתפקיד, לפני שמספר על הבעיה.", "ar": "القطعة تفتتح بالدور قبل أن تتحدث عن المشكلة.", "ru": "Текст начинается с роли, прежде чем рассказать о проблеме.", "en": "The passage opens with the role before describing the problem."},{"he": "המשפט הראשון קובע: הן מעבירות אבקה מפרח לפרח. הפעולה הזאת נקראת האבקה, ובזכותה צמחים מתרבים. הדבש מוזכר? לא בקטע הזה. למשל, בלי האבקה לא היו מתפתחים פירות כמו תפוחים.", "ar": "الجملة الأولى تنص: فهي تنقل حبوب اللقاح من زهرة إلى زهرة. هذه العملية تسمى التلقيح، وبفضلها تتكاثر النباتات. هل ذُكر العسل؟ ليس في هذه القطعة. مثلًا، لولا التلقيح لما تطورت ثمار كالتفاح.", "ru": "В первом предложении сказано: они переносят пыльцу с цветка на цветок. Это действие называется опылением, и благодаря ему растения размножаются. Упоминается ли мёд? Не в этом тексте. Например, без опыления не развивались бы плоды вроде яблок.", "en": "The first sentence states: they carry pollen from flower to flower. This action is called pollination, and thanks to it plants reproduce. Is honey mentioned? Not in this passage. For example, without pollination fruits like apples would not develop."},null,[{"he": "ייצור דבש אינו מוזכר בקטע כלל.", "ar": "إنتاج العسل غير مذكور في القطعة إطلاقًا.", "ru": "Производство мёда в тексте вообще не упоминается.", "en": "Honey production is not mentioned in the passage at all."}, null, {"he": "הגנה על הכוורת אינה מוזכרת בקטע.", "ar": "حماية الخلية غير مذكورة في القطعة.", "ru": "Защита улья в тексте не упоминается.", "en": "Defending the hive is not mentioned in the passage."}, {"he": "הרוח אינה מוזכרת; הדבורים עצמן מעבירות את האבקה.", "ar": "الريح غير مذكورة؛ النحل نفسه ينقل حبوب اللقاح.", "ru": "Ветер не упоминается; пчёлы сами переносят пыльцу.", "en": "Wind is not mentioned; the bees themselves carry the pollen."}]),
   Q("ha-read-2-2",{"he": "קראו את הקטע וענו על השאלה.<br>הדבורים ממלאות תפקיד מרכזי בטבע ובחקלאות: הן מעבירות אבקה מפרח לפרח, ובכך מאפשרות לצמחים רבים להתרבות. בלי דבורים, יבולים רבים, כמו תפוחים, שקדים ואבטיחים, היו מצטמצמים מאוד. בשנים האחרונות נרשמה ירידה במספר הדבורים בעולם, בין השאר בגלל שימוש נרחב בחומרי הדברה. חוקרים מציעים כמה דרכים לסייע לדבורים: לנטוע צמחים פורחים בגינות, להפחית בריסוס ולהקים כוורות בישובים. גם פעולות קטנות של אנשים פרטיים יכולות לתרום להצלת הדבורים.<br>מהי אחת הסיבות לירידה במספר הדבורים, לפי הקטע?", "ar": "اقرأوا القطعة وأجيبوا عن السؤال.<br>تلعب النحلات دورًا مركزيًا في الطبيعة والزراعة: فهي تنقل حبوب اللقاح من زهرة إلى زهرة، وبذلك تتيح لكثير من النباتات أن تتكاثر. لولا النحل، لتقلّصت كثير من المحاصيل، مثل التفاح واللوز والبطيخ. في السنوات الأخيرة سُجّل انخفاض في عدد النحل في العالم، من جملة الأسباب بسبب استخدام واسع لمواد الرش. يقترح الباحثون عدة طرق لمساعدة النحل: غرس نباتات مزهرة في الحدائق، والتقليل من الرش، وإقامة مناحل في البلدات. حتى الأعمال الصغيرة من أشخاص عاديين يمكن أن تسهم في إنقاذ النحل.<br>ما أحد أسباب انخفاض عدد النحل، بحسب القطعة؟", "ru": "Прочитайте отрывок и ответьте на вопрос.<br>Пчёлы играют центральную роль в природе и сельском хозяйстве: они переносят пыльцу с цветка на цветок и тем самым позволяют многим растениям размножаться. Без пчёл многие культуры, такие как яблоки, миндаль и арбузы, сильно сократились бы. В последние годы в мире отмечается снижение числа пчёл, в частности из-за широкого применения пестицидов. Исследователи предлагают несколько способов помочь пчёлам: высаживать цветущие растения в садах, уменьшить опрыскивание и ставить ульи в поселениях. Даже небольшие действия отдельных людей могут внести вклад в спасение пчёл.<br>Какова одна из причин снижения числа пчёл по тексту?", "en": "Read the passage and answer the question.<br>Bees play a central role in nature and agriculture: they carry pollen from flower to flower, allowing many plants to reproduce. Without bees, many crops, such as apples, almonds and watermelons, would shrink greatly. In recent years a decline in the number of bees worldwide has been recorded, partly because of widespread use of pesticides. Researchers suggest several ways to help bees: plant flowering plants in gardens, reduce spraying, and set up hives in communities. Even small actions by private people can contribute to saving the bees.<br>What is one reason for the decline in bees, according to the passage?"},[{"he": "גשמים מרובים בחורף", "ar": "أمطار غزيرة في الشتاء", "ru": "обильные дожди зимой", "en": "heavy winter rains"}, {"he": "מחסור בפרחים ברים", "ar": "نقص في الأزهار البرية", "ru": "нехватка диких цветов", "en": "a shortage of wild flowers"}, {"he": "התחממות המים בנהרות", "ar": "ارتفاع حرارة مياه الأنهار", "ru": "потепление воды в реках", "en": "warming of river water"}, {"he": "שימוש נרחב בחומרי הדברה", "ar": "استخدام واسع لمواد الرش", "ru": "широкое применение пестицидов", "en": "widespread use of pesticides"}],3,{"he": "הביטוי בין השאר בגלל מצביע על סיבה.", "ar": "تعبير من جملة الأسباب بسبب يشير إلى السبب.", "ru": "Выражение в частности из-за указывает на причину.", "en": "The phrase partly because of points to a cause."},{"he": "כתוב בקטע: בין השאר בגלל שימוש נרחב בחומרי הדברה. המילים בין השאר מלמדות שיש סיבות נוספות שלא פורטו, אבל זו הסיבה שצוינה. למשל, חקלאי המרסס שדה עלול לפגוע גם בדבורים המבקרות בו.", "ar": "مكتوب في القطعة: من جملة الأسباب بسبب استخدام واسع لمواد الرش. كلمتا من جملة تدلان على وجود أسباب أخرى لم تُفصّل، لكن هذا هو السبب المذكور. مثلًا، مزارع يرش حقله قد يضر أيضًا بالنحل الزائر له.", "ru": "В тексте сказано: в частности из-за широкого применения пестицидов. Слова в частности показывают, что есть и другие причины, но названа именно эта. Например, фермер, опрыскивающий поле, может навредить и посещающим его пчёлам.", "en": "The text says: partly because of widespread use of pesticides. The words partly show there are other unlisted reasons, but this is the one named. For example, a farmer spraying a field may also harm the bees visiting it."},null,[{"he": "גשמים אינם מוזכרים כסיבה בקטע.", "ar": "الأمطار غير مذكورة كسبب في القطعة.", "ru": "Дожди не названы причиной в тексте.", "en": "Rains are not mentioned as a reason in the passage."}, {"he": "מחסור בפרחים אינו מוזכר בקטע.", "ar": "نقص الأزهار غير مذكور في القطعة.", "ru": "Нехватка цветов в тексте не упоминается.", "en": "A flower shortage is not mentioned in the passage."}, {"he": "נהרות אינם מוזכרים בקטע כלל.", "ar": "الأنهار غير مذكورة في القطعة إطلاقًا.", "ru": "Реки в тексте вообще не упоминаются.", "en": "Rivers are not mentioned in the passage at all."}, null]),
   Q("ha-read-2-3",{"he": "קראו את הקטע וענו על השאלה.<br>הדבורים ממלאות תפקיד מרכזי בטבע ובחקלאות: הן מעבירות אבקה מפרח לפרח, ובכך מאפשרות לצמחים רבים להתרבות. בלי דבורים, יבולים רבים, כמו תפוחים, שקדים ואבטיחים, היו מצטמצמים מאוד. בשנים האחרונות נרשמה ירידה במספר הדבורים בעולם, בין השאר בגלל שימוש נרחב בחומרי הדברה. חוקרים מציעים כמה דרכים לסייע לדבורים: לנטוע צמחים פורחים בגינות, להפחית בריסוס ולהקים כוורות בישובים. גם פעולות קטנות של אנשים פרטיים יכולות לתרום להצלת הדבורים.<br>מהי מסקנת הקטע לגבי אנשים פרטיים?", "ar": "اقرأوا القطعة وأجيبوا عن السؤال.<br>تلعب النحلات دورًا مركزيًا في الطبيعة والزراعة: فهي تنقل حبوب اللقاح من زهرة إلى زهرة، وبذلك تتيح لكثير من النباتات أن تتكاثر. لولا النحل، لتقلّصت كثير من المحاصيل، مثل التفاح واللوز والبطيخ. في السنوات الأخيرة سُجّل انخفاض في عدد النحل في العالم، من جملة الأسباب بسبب استخدام واسع لمواد الرش. يقترح الباحثون عدة طرق لمساعدة النحل: غرس نباتات مزهرة في الحدائق، والتقليل من الرش، وإقامة مناحل في البلدات. حتى الأعمال الصغيرة من أشخاص عاديين يمكن أن تسهم في إنقاذ النحل.<br>ما خلاصة القطعة بشأن الأشخاص العاديين؟", "ru": "Прочитайте отрывок и ответьте на вопрос.<br>Пчёлы играют центральную роль в природе и сельском хозяйстве: они переносят пыльцу с цветка на цветок и тем самым позволяют многим растениям размножаться. Без пчёл многие культуры, такие как яблоки, миндаль и арбузы, сильно сократились бы. В последние годы в мире отмечается снижение числа пчёл, в частности из-за широкого применения пестицидов. Исследователи предлагают несколько способов помочь пчёлам: высаживать цветущие растения в садах, уменьшить опрыскивание и ставить ульи в поселениях. Даже небольшие действия отдельных людей могут внести вклад в спасение пчёл.<br>Каков вывод текста об отдельных людях?", "en": "Read the passage and answer the question.<br>Bees play a central role in nature and agriculture: they carry pollen from flower to flower, allowing many plants to reproduce. Without bees, many crops, such as apples, almonds and watermelons, would shrink greatly. In recent years a decline in the number of bees worldwide has been recorded, partly because of widespread use of pesticides. Researchers suggest several ways to help bees: plant flowering plants in gardens, reduce spraying, and set up hives in communities. Even small actions by private people can contribute to saving the bees.<br>What is the passage's conclusion about private individuals?"},[{"he": "פעולות קטנות מסייעות להצלת הדבורים", "ar": "أعمال صغيرة تساعد في إنقاذ النحل", "ru": "небольшие действия помогают спасти пчёл", "en": "small actions help save the bees"}, {"he": "אין ביכולתם להשפיע על המצב", "ar": "لا يستطيعون التأثير في الوضع", "ru": "они не могут повлиять на ситуацию", "en": "they cannot influence the situation"}, {"he": "עליהם להפסיק לגדל צמחים בגינה", "ar": "عليهم التوقف عن زراعة النباتات في الحديقة", "ru": "им следует прекратить выращивать растения в саду", "en": "they should stop growing garden plants"}, {"he": "עליהם להקים חברות גדולות לייצור דבש", "ar": "عليهم إقامة شركات كبيرة لإنتاج العسل", "ru": "им следует создавать крупные компании по производству мёда", "en": "they should found large honey production companies"}],0,{"he": "המסקנה נמצאת במשפט האחרון של הקטע.", "ar": "الخلاصة في الجملة الأخيرة من القطعة.", "ru": "Вывод находится в последнем предложении текста.", "en": "The conclusion is in the passage's last sentence."},{"he": "המשפט האחרון אומר במפורש: גם פעולות קטנות של אנשים פרטיים יכולות לתרום. המילה גם מדגישה שאין צורך בפעולה גדולה. למשל, נטיעת עציץ פורח במרפסת היא כבר תרומה.", "ar": "الجملة الأخيرة تنص صراحة: حتى الأعمال الصغيرة من أشخاص عاديين يمكن أن تسهم. كلمة حتى تؤكد أنه لا حاجة لعمل كبير. مثلًا، غرس نبتة مزهرة في الشرفة هو إسهام بحد ذاته.", "ru": "Последнее предложение прямо говорит: даже небольшие действия отдельных людей могут внести вклад. Слово даже подчёркивает, что большое дело не требуется. Например, посадка цветущего растения на балконе - уже вклад.", "en": "The last sentence says explicitly: even small actions by private people can contribute. The word even stresses that no big action is needed. For example, planting a flowering pot on a balcony is already a contribution."},null,[null, {"he": "הקטע אומר ההפך: יש ביכולתם לתרום.", "ar": "القطعة تقول العكس: بإمكانهم الإسهام.", "ru": "Текст говорит обратное: они могут внести вклад.", "en": "The passage says the opposite: they can contribute."}, {"he": "הקטע דווקא ממליץ לנטוע צמחים פורחים.", "ar": "القطعة بالذات توصي بغرس نباتات مزهرة.", "ru": "Текст как раз рекомендует высаживать цветущие растения.", "en": "The passage actually recommends planting flowering plants."}, {"he": "הקמת חברות אינה מוזכרת בקטע.", "ar": "إقامة الشركات غير مذكورة في القطعة.", "ru": "Создание компаний в тексте не упоминается.", "en": "Founding companies is not mentioned in the passage."}]),
   Q("rd-2-01",{"he": "קראו את הקטע וענו על השאלה.<br>בני נוער רבים הולכים לישון מאוחר, ולכן הם מתעוררים עייפים. מומחים ממליצים לבני נוער לישון 8 עד 10 שעות בלילה. שינה טובה עוזרת לזיכרון ולריכוז בשיעורים. לעומת זאת, מסך של טלפון לפני השינה מקשה על ההירדמות. לכן כדאי להניח את הטלפון בצד חצי שעה לפני השינה.<br>מה תפקיד הביטוי \"לעומת זאת\" בקטע?", "ar": "اقرأوا القطعة وأجيبوا عن السؤال.<br>كثير من المراهقين ينامون متأخرين، ولذلك يستيقظون متعبين. يوصي الخبراء بأن ينام المراهقون من 8 إلى 10 ساعات في الليلة. النوم الجيد يساعد الذاكرة والتركيز في الدروس. في المقابل، شاشة الهاتف قبل النوم تُصعّب الدخول في النوم. لذلك يُستحسن وضع الهاتف جانبًا نصف ساعة قبل النوم.<br>ما وظيفة التعبير «לעומת זאת» (في المقابل) في القطعة؟", "ru": "Прочитайте отрывок и ответьте на вопрос.<br>Многие подростки ложатся спать поздно, и поэтому просыпаются уставшими. Специалисты советуют подросткам спать от 8 до 10 часов в сутки. Хороший сон помогает памяти и вниманию на уроках. Напротив, экран телефона перед сном мешает заснуть. Поэтому стоит отложить телефон за полчаса до сна.<br>Какую роль играет выражение «לעומת זאת» («напротив») в отрывке?", "en": "Read the passage and answer the question.<br>Many teenagers go to bed late, so they wake up tired. Experts recommend that teenagers sleep 8 to 10 hours a night. Good sleep helps memory and concentration in class. In contrast, a phone screen before bed makes it harder to fall asleep. So it is a good idea to put the phone aside half an hour before sleep.<br>What is the role of the phrase \"לעומת זאת\" (in contrast) in the passage?"},[{"he": "מוסיף דוגמה לרעיון שבא לפניו", "ar": "يضيف مثالًا على الفكرة التي قبله", "ru": "добавляет пример к мысли перед ним", "en": "adds an example to the idea before it"}, {"he": "מסביר את הסיבה לדבר שנאמר קודם", "ar": "يشرح سبب ما قيل قبله", "ru": "объясняет причину сказанного раньше", "en": "explains the reason for what was said earlier"}, {"he": "מציין מתי קרה הדבר", "ar": "يحدّد متى حدث الأمر", "ru": "указывает, когда это случилось", "en": "tells when the thing happened"}, {"he": "מציג ניגוד בין שני רעיונות", "ar": "يعرض تناقضًا بين فكرتين", "ru": "противопоставляет две мысли", "en": "shows a contrast between two ideas"}],3,{"he": "השוו מה הקטע אומר על השינה ומה על המסך.", "ar": "قارنوا ما تقوله القطعة عن النوم وما تقوله عن الشاشة.", "ru": "Сравните, что сказано о сне и что об экране.", "en": "Compare what the passage says about sleep and about the screen."},{"he": "לפני הביטוי כתוב מה עוזר ללמידה, ואחריו כתוב מה מפריע לשינה. כך הביטוי מציג שני דברים הפוכים. מילים דומות: אבל, אולם.", "ar": "قبل التعبير مكتوب ما يساعد التعلّم، وبعده مكتوب ما يعيق النوم. هكذا يعرض التعبير أمرين متعاكسين. كلمات مشابهة: אבל، אולם (لكن).", "ru": "До выражения сказано, что помогает учёбе, а после - что мешает сну. Так выражение показывает две противоположные вещи. Похожие слова: אבל, אולם («но»).", "en": "Before the phrase it says what helps learning; after it, what disturbs sleep. So the phrase presents two opposite things. Similar words: אבל, אולם (but)."},null,[{"he": "המסך אינו דוגמה לשינה טובה; הוא מפריע לה.", "ar": "الشاشة ليست مثالًا على النوم الجيد؛ بل تعيقه.", "ru": "Экран - не пример хорошего сна; он ему мешает.", "en": "The screen is not an example of good sleep; it disturbs it."}, {"he": "לסיבה מתאימות מילים כמו כי או בגלל.", "ar": "للسبب تناسب كلمات مثل כי أو בגלל (لأن، بسبب).", "ru": "Для причины подходят слова כי или בגלל («потому что»).", "en": "For a reason, words like כי or בגלל (because) fit."}, {"he": "לזמן מתאימות מילים כמו כאשר או אחרי.", "ar": "للزمن تناسب كلمات مثل כאשר أو אחרי (عندما، بعد).", "ru": "Для времени подходят слова כאשר или אחרי («когда», «после»).", "en": "For time, words like כאשר or אחרי (when, after) fit."}, null]),
   Q("rd-2-02",{"he": "קראו את הקטע וענו על השאלה.<br>בני נוער רבים הולכים לישון מאוחר, ולכן הם מתעוררים עייפים. מומחים ממליצים לבני נוער לישון 8 עד 10 שעות בלילה. שינה טובה עוזרת לזיכרון ולריכוז בשיעורים. לעומת זאת, מסך של טלפון לפני השינה מקשה על ההירדמות. לכן כדאי להניח את הטלפון בצד חצי שעה לפני השינה.<br>איזו כותרת מתאימה ביותר לקטע?", "ar": "اقرأوا القطعة وأجيبوا عن السؤال.<br>كثير من المراهقين ينامون متأخرين، ولذلك يستيقظون متعبين. يوصي الخبراء بأن ينام المراهقون من 8 إلى 10 ساعات في الليلة. النوم الجيد يساعد الذاكرة والتركيز في الدروس. في المقابل، شاشة الهاتف قبل النوم تُصعّب الدخول في النوم. لذلك يُستحسن وضع الهاتف جانبًا نصف ساعة قبل النوم.<br>أي عنوان هو الأنسب للقطعة؟", "ru": "Прочитайте отрывок и ответьте на вопрос.<br>Многие подростки ложатся спать поздно, и поэтому просыпаются уставшими. Специалисты советуют подросткам спать от 8 до 10 часов в сутки. Хороший сон помогает памяти и вниманию на уроках. Напротив, экран телефона перед сном мешает заснуть. Поэтому стоит отложить телефон за полчаса до сна.<br>Какой заголовок больше всего подходит к отрывку?", "en": "Read the passage and answer the question.<br>Many teenagers go to bed late, so they wake up tired. Experts recommend that teenagers sleep 8 to 10 hours a night. Good sleep helps memory and concentration in class. In contrast, a phone screen before bed makes it harder to fall asleep. So it is a good idea to put the phone aside half an hour before sleep.<br>Which title fits the passage best?"},[{"he": "שינה טובה ללמידה טובה", "ar": "نوم جيد لتعلّم جيد", "ru": "хороший сон для хорошей учёбы", "en": "Good sleep for good learning"}, {"he": "הטלפון החדש של בני הנוער", "ar": "الهاتف الجديد للمراهقين", "ru": "новый телефон подростков", "en": "The teenagers' new phone"}, {"he": "איך בוחרים מיטה נוחה לחדר השינה", "ar": "كيف نختار سريرًا مريحًا لغرفة النوم", "ru": "как выбрать удобную кровать для спальни", "en": "How to choose a comfortable bed for the bedroom"}, {"he": "שעות הלימודים בבית הספר", "ar": "ساعات الدراسة في المدرسة", "ru": "часы занятий в школе", "en": "School hours"}],0,{"he": "כותרת מוצלחת מתאימה לכל הקטע, ולא רק למשפט אחד.", "ar": "العنوان الجيد يناسب القطعة كلها، لا جملة واحدة فقط.", "ru": "Хороший заголовок подходит ко всему отрывку, а не к одному предложению.", "en": "A good title fits the whole passage, not just one sentence."},{"he": "הקטע כולו עוסק בשינה של בני נוער ובהשפעה שלה על הלימודים. הטלפון מוזכר רק כדבר שמפריע לשינה. לכן הכותרת צריכה לחבר בין שינה ללמידה.", "ar": "القطعة كلها تتناول نوم المراهقين وتأثيره على الدراسة. الهاتف مذكور فقط كشيء يعيق النوم. لذلك يجب أن يربط العنوان بين النوم والتعلّم.", "ru": "Весь отрывок - о сне подростков и его влиянии на учёбу. Телефон упомянут только как помеха сну. Поэтому заголовок должен связывать сон и учёбу.", "en": "The whole passage is about teenagers' sleep and its effect on learning. The phone is mentioned only as something that disturbs sleep. So the title should link sleep and learning."},null,[null, {"he": "הקטע אינו מספר על טלפון חדש; הטלפון רק מפריע לשינה.", "ar": "القطعة لا تتحدث عن هاتف جديد؛ الهاتف فقط يعيق النوم.", "ru": "В отрывке нет речи о новом телефоне; телефон лишь мешает сну.", "en": "The passage is not about a new phone; the phone only disturbs sleep."}, {"he": "מיטות אינן מוזכרות בקטע.", "ar": "الأسرّة غير مذكورة في القطعة.", "ru": "Кровати в отрывке не упоминаются.", "en": "Beds are not mentioned in the passage."}, {"he": "שעות הלימודים אינן מוזכרות בקטע.", "ar": "ساعات الدراسة غير مذكورة في القطعة.", "ru": "Часы занятий в отрывке не упоминаются.", "en": "School hours are not mentioned in the passage."}]),
   Q("rd-2-03",{"he": "קראו את הקטע וענו על השאלה.<br>בני נוער רבים הולכים לישון מאוחר, ולכן הם מתעוררים עייפים. מומחים ממליצים לבני נוער לישון 8 עד 10 שעות בלילה. שינה טובה עוזרת לזיכרון ולריכוז בשיעורים. לעומת זאת, מסך של טלפון לפני השינה מקשה על ההירדמות. לכן כדאי להניח את הטלפון בצד חצי שעה לפני השינה.<br>מה אפשר להסיק מהקטע על תלמיד שמשתמש בטלפון עד מאוחר בלילה?", "ar": "اقرأوا القطعة وأجيبوا عن السؤال.<br>كثير من المراهقين ينامون متأخرين، ولذلك يستيقظون متعبين. يوصي الخبراء بأن ينام المراهقون من 8 إلى 10 ساعات في الليلة. النوم الجيد يساعد الذاكرة والتركيز في الدروس. في المقابل، شاشة الهاتف قبل النوم تُصعّب الدخول في النوم. لذلك يُستحسن وضع الهاتف جانبًا نصف ساعة قبل النوم.<br>ماذا يمكن أن نستنتج من القطعة عن طالب يستخدم الهاتف حتى وقت متأخر من الليل؟", "ru": "Прочитайте отрывок и ответьте на вопрос.<br>Многие подростки ложатся спать поздно, и поэтому просыпаются уставшими. Специалисты советуют подросткам спать от 8 до 10 часов в сутки. Хороший сон помогает памяти и вниманию на уроках. Напротив, экран телефона перед сном мешает заснуть. Поэтому стоит отложить телефон за полчаса до сна.<br>Какой вывод можно сделать из отрывка об ученике, который сидит в телефоне до поздней ночи?", "en": "Read the passage and answer the question.<br>Many teenagers go to bed late, so they wake up tired. Experts recommend that teenagers sleep 8 to 10 hours a night. Good sleep helps memory and concentration in class. In contrast, a phone screen before bed makes it harder to fall asleep. So it is a good idea to put the phone aside half an hour before sleep.<br>What can we infer from the passage about a student who uses the phone until late at night?"},[{"he": "הוא יירדם מהר יותר מחבריו", "ar": "سينام أسرع من أصدقائه", "ru": "он заснёт быстрее друзей", "en": "he will fall asleep faster than his friends"}, {"he": "הוא יזכור טוב יותר את החומר שלמד", "ar": "سيتذكّر المادة التي تعلّمها بشكل أفضل", "ru": "он гораздо лучше запомнит весь выученный материал", "en": "he will remember the material he studied better"}, {"he": "ייתכן שיתקשה להתרכז בשיעורים", "ar": "قد يصعب عليه التركيز في الدروس", "ru": "ему может быть трудно сосредоточиться", "en": "he may find it hard to focus in class"}, {"he": "הוא צריך פחות שעות שינה מאחרים", "ar": "يحتاج إلى ساعات نوم أقل من غيره", "ru": "ему нужно меньше часов сна, чем другим", "en": "he needs fewer hours of sleep than others"}],2,{"he": "חברו בין המשפט על המסך לבין המשפט על הזיכרון.", "ar": "اربطوا بين الجملة عن الشاشة والجملة عن الذاكرة.", "ru": "Свяжите предложение об экране с предложением о памяти.", "en": "Connect the sentence about the screen with the sentence about memory."},{"he": "המסך מקשה על ההירדמות, ולכן התלמיד ישן פחות. הקטע אומר ששינה טובה עוזרת לריכוז. מכאן שבלי שינה טובה הריכוז עלול להיפגע.", "ar": "الشاشة تُصعّب النوم، ولذلك ينام الطالب أقل. القطعة تقول إن النوم الجيد يساعد التركيز. ومن هنا، بدون نوم جيد قد يتضرّر التركيز.", "ru": "Экран мешает заснуть, поэтому ученик спит меньше. В отрывке сказано, что хороший сон помогает вниманию. Значит, без хорошего сна внимание может пострадать.", "en": "The screen makes falling asleep harder, so the student sleeps less. The passage says good sleep helps concentration. So without good sleep, concentration may suffer."},null,[{"he": "הקטע אומר ההפך: המסך מקשה על ההירדמות.", "ar": "القطعة تقول العكس: الشاشة تُصعّب النوم.", "ru": "В отрывке сказано обратное: экран мешает заснуть.", "en": "The passage says the opposite: the screen makes falling asleep harder."}, {"he": "שינה טובה עוזרת לזיכרון, והוא ישן פחות.", "ar": "النوم الجيد يساعد الذاكرة، وهو ينام أقل.", "ru": "Хороший сон помогает памяти, а он спит меньше.", "en": "Good sleep helps memory, and he sleeps less."}, null, {"he": "ההמלצה של 8 עד 10 שעות שינה נכונה לכל בני הנוער.", "ar": "التوصية بالنوم من 8 إلى 10 ساعات تنطبق على كل المراهقين.", "ru": "Совет спать от 8 до 10 часов относится ко всем подросткам.", "en": "The advice of 8 to 10 hours of sleep applies to all teenagers."}]),
   Q("rd-2-04",{"he": "קראו את הקטע וענו על השאלה.<br>בשכונה שלנו נפתחה ספריית חפצים. בספרייה הזאת לא שואלים ספרים, אלא כלים: מקדחה, סולם, אוהל ואפילו מכונה להכנת גלידה. רוב האנשים צריכים מקדחה רק כמה פעמים בשנה. לכן אין טעם שכל משפחה תקנה מקדחה משלה. בזכות הספרייה, השכנים חוסכים כסף ומקום בבית. נוסף על כך, הם מכירים זה את זה טוב יותר.<br>מהו הרעיון המרכזי של הקטע?", "ar": "اقرأوا القطعة وأجيبوا عن السؤال.<br>في حيّنا افتُتحت مكتبة أغراض. في هذه المكتبة لا يستعيرون كتبًا، بل أدوات: مثقاب، وسلّم، وخيمة، وحتى آلة لصنع البوظة. معظم الناس يحتاجون المثقاب بضع مرات فقط في السنة. لذلك لا معنى لأن تشتري كل عائلة مثقابًا خاصًا بها. بفضل المكتبة، يوفّر الجيران المال والمكان في البيت. إضافة إلى ذلك، يتعرّفون بعضهم على بعض أكثر.<br>ما الفكرة المركزية في القطعة؟", "ru": "Прочитайте отрывок и ответьте на вопрос.<br>В нашем районе открылась библиотека вещей. Здесь берут не книги, а инструменты: дрель, лестницу, палатку и даже мороженицу. Большинству людей дрель нужна лишь несколько раз в год. Поэтому нет смысла, чтобы каждая семья покупала свою дрель. Благодаря библиотеке соседи экономят деньги и место в доме. Кроме того, они лучше узнают друг друга.<br>Какова главная мысль отрывка?", "en": "Read the passage and answer the question.<br>A library of things has opened in our neighborhood. Here people borrow not books but tools: a drill, a ladder, a tent and even an ice-cream maker. Most people need a drill only a few times a year. So there is no point in every family buying its own drill. Thanks to the library, neighbors save money and space at home. In addition, they get to know each other better.<br>What is the main idea of the passage?"},[{"he": "כדאי לכל משפחה לקנות מקדחה משלה", "ar": "يُستحسن أن تشتري كل عائلة مثقابًا خاصًا بها", "ru": "каждой семье стоит купить свою дрель", "en": "every family should buy its own drill"}, {"he": "ספריית חפצים עוזרת לשכנים בכמה דרכים", "ar": "مكتبة الأغراض تساعد الجيران بعدّة طرق", "ru": "библиотека вещей полезна соседям", "en": "a library of things helps neighbors in several ways"}, {"he": "בספריית השכונה יש הרבה ספרים חדשים לקריאה", "ar": "في مكتبة الحي كتب جديدة كثيرة", "ru": "в районной библиотеке много новых книг", "en": "the neighborhood library has a lot of new books for reading"}, {"he": "קשה למצוא בחנויות מכונה להכנת גלידה", "ar": "من الصعب أن نجد في المحلات آلة لصنع البوظة", "ru": "в магазинах трудно найти мороженицу", "en": "it is hard to find an ice-cream maker in the shops"}],1,{"he": "חפשו מה הקטע אומר שהשכנים מקבלים.", "ar": "ابحثوا عمّا تقول القطعة إن الجيران يحصلون عليه.", "ru": "Найдите, что, по словам отрывка, получают соседи.", "en": "Look for what the passage says the neighbors gain."},{"he": "הקטע מציג את ספריית החפצים ומונה את היתרונות שלה: חיסכון בכסף, חיסכון במקום והיכרות בין שכנים. לכן הרעיון המרכזי הוא התועלת שהספרייה מביאה.", "ar": "القطعة تعرض مكتبة الأغراض وتعدّد فوائدها: توفير المال، وتوفير المكان، والتعارف بين الجيران. لذلك الفكرة المركزية هي الفائدة التي تجلبها المكتبة.", "ru": "Отрывок представляет библиотеку вещей и перечисляет её плюсы: экономия денег, экономия места и знакомство соседей. Поэтому главная мысль - польза библиотеки.", "en": "The passage presents the library of things and lists its benefits: saving money, saving space and neighbors getting to know each other. So the main idea is the benefit it brings."},null,[{"he": "הקטע אומר ההפך: אין טעם שכל משפחה תקנה מקדחה.", "ar": "القطعة تقول العكس: لا معنى لأن تشتري كل عائلة مثقابًا.", "ru": "В отрывке сказано обратное: нет смысла каждой семье покупать дрель.", "en": "The passage says the opposite: there is no point in every family buying a drill."}, null, {"he": "בספרייה הזאת לא שואלים ספרים, אלא כלים.", "ar": "في هذه المكتبة لا يستعيرون كتبًا، بل أدوات.", "ru": "В этой библиотеке берут не книги, а инструменты.", "en": "In this library people borrow tools, not books."}, {"he": "מכונת הגלידה היא רק דוגמה לחפץ שאפשר לשאול.", "ar": "آلة البوظة مجرد مثال على غرض يمكن استعارته.", "ru": "Мороженица - лишь пример вещи, которую можно взять.", "en": "The ice-cream maker is only an example of something you can borrow."}]),
   Q("rd-2-05",{"he": "קראו את הקטע וענו על השאלה.<br>בשכונה שלנו נפתחה ספריית חפצים. בספרייה הזאת לא שואלים ספרים, אלא כלים: מקדחה, סולם, אוהל ואפילו מכונה להכנת גלידה. רוב האנשים צריכים מקדחה רק כמה פעמים בשנה. לכן אין טעם שכל משפחה תקנה מקדחה משלה. בזכות הספרייה, השכנים חוסכים כסף ומקום בבית. נוסף על כך, הם מכירים זה את זה טוב יותר.<br>מה תפקיד הביטוי \"נוסף על כך\" במשפט האחרון?", "ar": "اقرأوا القطعة وأجيبوا عن السؤال.<br>في حيّنا افتُتحت مكتبة أغراض. في هذه المكتبة لا يستعيرون كتبًا، بل أدوات: مثقاب، وسلّم، وخيمة، وحتى آلة لصنع البوظة. معظم الناس يحتاجون المثقاب بضع مرات فقط في السنة. لذلك لا معنى لأن تشتري كل عائلة مثقابًا خاصًا بها. بفضل المكتبة، يوفّر الجيران المال والمكان في البيت. إضافة إلى ذلك، يتعرّفون بعضهم على بعض أكثر.<br>ما وظيفة التعبير «נוסף על כך» (إضافة إلى ذلك) في الجملة الأخيرة؟", "ru": "Прочитайте отрывок и ответьте на вопрос.<br>В нашем районе открылась библиотека вещей. Здесь берут не книги, а инструменты: дрель, лестницу, палатку и даже мороженицу. Большинству людей дрель нужна лишь несколько раз в год. Поэтому нет смысла, чтобы каждая семья покупала свою дрель. Благодаря библиотеке соседи экономят деньги и место в доме. Кроме того, они лучше узнают друг друга.<br>Какую роль играет выражение «נוסף על כך» («кроме того») в последнем предложении?", "en": "Read the passage and answer the question.<br>A library of things has opened in our neighborhood. Here people borrow not books but tools: a drill, a ladder, a tent and even an ice-cream maker. Most people need a drill only a few times a year. So there is no point in every family buying its own drill. Thanks to the library, neighbors save money and space at home. In addition, they get to know each other better.<br>What is the role of the phrase \"נוסף על כך\" (in addition) in the last sentence?"},[{"he": "מציג תוצאה של מה שנאמר לפניו", "ar": "يعرض نتيجة لما قيل قبله", "ru": "показывает следствие сказанного перед ним", "en": "shows a result of what was said before it"}, {"he": "מציג ניגוד למה שנאמר לפניו", "ar": "يعرض تناقضًا مع ما قيل قبله", "ru": "показывает противопоставление сказанному", "en": "shows a contrast with what was said before it"}, {"he": "מציג תנאי שבלעדיו הספרייה לא תפעל", "ar": "يعرض شرطًا لن تعمل المكتبة بدونه", "ru": "ставит условие, без которого библиотека не будет работать", "en": "sets a condition without which the library will not work"}, {"he": "מוסיף עוד יתרון של הספרייה", "ar": "يضيف فائدة أخرى للمكتبة", "ru": "добавляет ещё один плюс библиотеки", "en": "adds another benefit of the library"}],3,{"he": "שאלו: האם המשפט האחרון ממשיך את הקודם, או מתנגד לו?", "ar": "اسألوا: هل الجملة الأخيرة تكمل السابقة أم تعارضها؟", "ru": "Спросите себя: последнее предложение продолжает предыдущее или спорит с ним?", "en": "Ask: does the last sentence continue the previous one or oppose it?"},{"he": "לפני הביטוי כתוב שהשכנים חוסכים כסף ומקום. אחריו מופיע עוד דבר טוב: הם מכירים זה את זה. הביטוי מוסיף רעיון באותו כיוון, כמו המילה גם.", "ar": "قبل التعبير مكتوب أن الجيران يوفّرون المال والمكان. بعده يظهر أمر جيد آخر: يتعرّفون بعضهم على بعض. التعبير يضيف فكرة في الاتجاه نفسه، مثل كلمة גם (أيضًا).", "ru": "До выражения сказано, что соседи экономят деньги и место. После него - ещё одна хорошая вещь: они знакомятся. Выражение добавляет мысль в том же направлении, как слово גם («тоже»).", "en": "Before the phrase it says neighbors save money and space. After it comes another good thing: they get to know each other. The phrase adds an idea in the same direction, like the word גם (also)."},null,[{"he": "ההיכרות אינה נובעת מהחיסכון; זה יתרון נפרד.", "ar": "التعارف لا ينتج عن التوفير؛ إنه فائدة منفصلة.", "ru": "Знакомство не вытекает из экономии; это отдельный плюс.", "en": "Getting acquainted does not result from saving; it is a separate benefit."}, {"he": "שני המשפטים מתארים דברים טובים, ואין ביניהם ניגוד.", "ar": "الجملتان تصفان أمورًا جيدة، ولا تناقض بينهما.", "ru": "Оба предложения описывают хорошее, противопоставления нет.", "en": "Both sentences describe good things; there is no contrast between them."}, {"he": "אין במשפט תנאי; לתנאי מתאימה המילה אם.", "ar": "لا يوجد شرط في الجملة؛ للشرط تناسب كلمة אם (إذا).", "ru": "В предложении нет условия; для условия подходит слово אם («если»).", "en": "There is no condition here; for a condition the word אם (if) fits."}, null]),
   Q("rd-2-06",{"he": "קראו את הקטע וענו על השאלה.<br>בשכונה שלנו נפתחה ספריית חפצים. בספרייה הזאת לא שואלים ספרים, אלא כלים: מקדחה, סולם, אוהל ואפילו מכונה להכנת גלידה. רוב האנשים צריכים מקדחה רק כמה פעמים בשנה. לכן אין טעם שכל משפחה תקנה מקדחה משלה. בזכות הספרייה, השכנים חוסכים כסף ומקום בבית. נוסף על כך, הם מכירים זה את זה טוב יותר.<br>לפי הקטע, למה אין טעם שכל משפחה תקנה מקדחה?", "ar": "اقرأوا القطعة وأجيبوا عن السؤال.<br>في حيّنا افتُتحت مكتبة أغراض. في هذه المكتبة لا يستعيرون كتبًا، بل أدوات: مثقاب، وسلّم، وخيمة، وحتى آلة لصنع البوظة. معظم الناس يحتاجون المثقاب بضع مرات فقط في السنة. لذلك لا معنى لأن تشتري كل عائلة مثقابًا خاصًا بها. بفضل المكتبة، يوفّر الجيران المال والمكان في البيت. إضافة إلى ذلك، يتعرّفون بعضهم على بعض أكثر.<br>حسب القطعة، لماذا لا معنى لأن تشتري كل عائلة مثقابًا؟", "ru": "Прочитайте отрывок и ответьте на вопрос.<br>В нашем районе открылась библиотека вещей. Здесь берут не книги, а инструменты: дрель, лестницу, палатку и даже мороженицу. Большинству людей дрель нужна лишь несколько раз в год. Поэтому нет смысла, чтобы каждая семья покупала свою дрель. Благодаря библиотеке соседи экономят деньги и место в доме. Кроме того, они лучше узнают друг друга.<br>Почему, по словам отрывка, нет смысла каждой семье покупать дрель?", "en": "Read the passage and answer the question.<br>A library of things has opened in our neighborhood. Here people borrow not books but tools: a drill, a ladder, a tent and even an ice-cream maker. Most people need a drill only a few times a year. So there is no point in every family buying its own drill. Thanks to the library, neighbors save money and space at home. In addition, they get to know each other better.<br>According to the passage, why is there no point in every family buying a drill?"},[{"he": "כי מקדחה היא כלי מסוכן לילדים", "ar": "لأن المثقاب أداة خطيرة على الأطفال", "ru": "потому что дрель опасна для детей", "en": "because a drill is dangerous for children"}, {"he": "כי בחנויות של השכונה אין מקדחות טובות במיוחד", "ar": "لأنه لا توجد في محلات الحي مثاقب جيدة بشكل خاص", "ru": "потому что в магазинах района нет особенно хороших дрелей", "en": "because the neighborhood shops have no especially good drills"}, {"he": "כי משתמשים בה רק כמה פעמים בשנה", "ar": "لأنهم يستخدمونه بضع مرات فقط في السنة", "ru": "потому что ею пользуются лишь несколько раз в год", "en": "because people use it only a few times a year"}, {"he": "כי אסור להשתמש בה בבית", "ar": "لأنه ممنوع استخدامه في البيت", "ru": "потому что ею запрещено пользоваться дома", "en": "because it is forbidden to use it at home"}],2,{"he": "המילה לכן מחברת בין סיבה לתוצאה. קראו את המשפט שלפניה.", "ar": "كلمة לכן (لذلك) تربط بين سبب ونتيجة. اقرأوا الجملة التي قبلها.", "ru": "Слово לכן («поэтому») связывает причину и следствие. Прочитайте предложение перед ним.", "en": "The word לכן (so) links a cause and a result. Read the sentence before it."},{"he": "המשפט שלפני לכן אומר: רוב האנשים צריכים מקדחה רק כמה פעמים בשנה. זו הסיבה, ואחריה בא המשפט על המשפחות.", "ar": "الجملة التي قبل לכן تقول: معظم الناس يحتاجون المثقاب بضع مرات فقط في السنة. هذا هو السبب، وبعده تأتي الجملة عن العائلات.", "ru": "Предложение перед לכן говорит: большинству людей дрель нужна лишь несколько раз в год. Это причина, а после неё идёт предложение о семьях.", "en": "The sentence before לכן says: most people need a drill only a few times a year. That is the reason, and the sentence about families follows it."},null,[{"he": "סכנה לילדים אינה מוזכרת בקטע.", "ar": "الخطر على الأطفال غير مذكور في القطعة.", "ru": "Опасность для детей в отрывке не упоминается.", "en": "Danger to children is not mentioned in the passage."}, {"he": "חנויות אינן מוזכרות בקטע.", "ar": "المحلات غير مذكورة في القطعة.", "ru": "Магазины в отрывке не упоминаются.", "en": "Shops are not mentioned in the passage."}, null, {"he": "הקטע אינו אוסר להשתמש במקדחה.", "ar": "القطعة لا تمنع استخدام المثقاب.", "ru": "Отрывок не запрещает пользоваться дрелью.", "en": "The passage does not forbid using a drill."}])
