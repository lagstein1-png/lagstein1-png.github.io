<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ניב — אנגלית מדוברת וספרותית</title>
<meta name="description" content="לימוד אנגלית למי שלומד אחרת: כל מילה נשמעת לפני שהיא נקראת, זוגות צלילים קרובים, מצבים מהחיים וקטעי קריאה. בעברית, ערבית, רוסית ואנגלית." />
<meta name="theme-color" content="#0d1b1a" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   ניב — אנגלית מדוברת וספרותית
   קהל היעד לא "לא יודע אנגלית". הוא נכשל בה שוב ושוב, ולכן כל
   החלטה כאן נמדדת בשאלה אחת: האם היא מורידה עומס, או מוסיפה.
   · האנגלית תמיד ב-Lexend ובכיוון LTR, גם כשהממשק בעברית.
   · שום מילה אנגלית לא מוצגת בלי שאפשר לשמוע אותה.
   · שפת האם היא פיגום, לא קביים — היא נסוגה עם העלייה ברמה.
   כל המידות ב-rem, כדי שהגדלת טקסט תגדיל את הכול יחד.
   ============================================================ */
:root{
  --font:"Heebo","Rubik",system-ui,"Segoe UI",Arial,sans-serif;
  --en:"Lexend","Heebo",system-ui,"Segoe UI",Arial,sans-serif;
  --bg:#f4f7f6; --surface:#ffffff; --surface2:#e9efee;
  --ink:#0f1f1d; --muted:#54655f; --faint:#83948e; --line:#dde6e3;
  --accent:#0f766e; --accent-ink:#ffffff; --accent-soft:#d6f0eb;
  --gold:#a16207; --gold-soft:#fbf0d5; --hit:#f5c451; --hit-ink:#1a1300;
  --ok:#15803d; --ok-soft:#dcfce7; --bad:#be123c; --bad-soft:#ffe4e9;
  --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(15,31,29,.05),0 8px 24px -12px rgba(15,31,29,.2);
  --r:14px;
  /* צבע לכל מסלול. לא קישוט: ארבעה סוגי לימוד שונים לגמרי, וצבע
     קבוע לכל אחד חוסך למי שמתקשה להתמצא את השאלה "איפה אני". */
  --c-sound:#0369a1; --cs-sound:#dbeefc;   /* צליל ואות   */
  --c-words:#15803d; --cs-words:#dcfce7;   /* מילים       */
  --c-talk:#c2410c;  --cs-talk:#fde5d8;    /* מדוברת      */
  --c-read:#6d28d9;  --cs-read:#eae2fd;    /* ספרותית     */
}
:root[data-theme="dark"]{
  --bg:#0d1b1a; --surface:#142624; --surface2:#1c3230;
  --ink:#e6f0ee; --muted:#9ab0aa; --faint:#6f8781; --line:#264240;
  --accent:#5eead4; --accent-ink:#0d1b1a; --accent-soft:#123c37;
  --gold:#fbbf24; --gold-soft:#33270f; --hit:#ffd24d; --hit-ink:#241a00;
  --ok:#4ade80; --ok-soft:#132a1c; --bad:#fb7185; --bad-soft:#33161f;
  --warn:#fbbf24; --warn-soft:#33260f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  --c-sound:#7dd3fc; --cs-sound:#0b2a3d;
  --c-words:#86efac; --cs-words:#0f2a1a;
  --c-talk:#fdba74;  --cs-talk:#3a2113;
  --c-read:#c4b5fd;  --cs-read:#261a45;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d1b1a; --surface:#142624; --surface2:#1c3230;
    --ink:#e6f0ee; --muted:#9ab0aa; --faint:#6f8781; --line:#264240;
    --accent:#5eead4; --accent-ink:#0d1b1a; --accent-soft:#123c37;
    --gold:#fbbf24; --gold-soft:#33270f; --hit:#ffd24d; --hit-ink:#241a00;
    --ok:#4ade80; --ok-soft:#132a1c; --bad:#fb7185; --bad-soft:#33161f;
    --warn:#fbbf24; --warn-soft:#33260f;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
    --c-sound:#7dd3fc; --cs-sound:#0b2a3d;
    --c-words:#86efac; --cs-words:#0f2a1a;
    --c-talk:#fdba74;  --cs-talk:#3a2113;
    --c-read:#c4b5fd;  --cs-read:#261a45;
  }
}
/* ניגודיות גבוהה — שחור על לבן, מסגרות מלאות, בלי גוונים רכים */
:root.hc{
  --bg:#ffffff; --surface:#ffffff; --surface2:#ffffff;
  --ink:#000000; --muted:#1a1a1a; --faint:#333333; --line:#000000;
  --accent:#00434b; --accent-ink:#ffffff; --accent-soft:#e6f2f3;
  --gold:#5c3d00; --gold-soft:#f7efdf; --hit:#ffe600; --hit-ink:#000000;
  --ok:#0a5c2a; --ok-soft:#e6f4ea; --bad:#8c0f2c; --bad-soft:#fbe9ed;
  --warn:#6b3d00; --warn-soft:#f7efdf; --shadow:none;
  --c-sound:#00305c; --cs-sound:#e8eef7;
  --c-words:#0a5c2a; --cs-words:#e6f4ea;
  --c-talk:#7a2c00;  --cs-talk:#f9ece4;
  --c-read:#3d1a75;  --cs-read:#eee8f9;
}
:root.hc *{box-shadow:none!important}
:root.hc .card,:root.hc .btn,:root.hc .opt{border-width:2px!important}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs,17px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  font-size:1rem;line-height:1.65;-webkit-text-size-adjust:100%}
:root.clear body{font-family:"Verdana","Tahoma","Heebo",sans-serif;letter-spacing:.012em}
:root.spaced body{word-spacing:.22em;line-height:1.95}
:root.rm *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
h1,h2,h3{margin:0;line-height:1.3;font-weight:800}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* כל טקסט אנגלי — כיוון, גופן ומרווח משלו. unicode-bidi:isolate מונע
   מהמשפט האנגלי לגרור אחריו את סימני הפיסוק של המשפט העברי. */
.en{font-family:var(--en);direction:ltr;unicode-bidi:isolate;text-align:start}
.en-b{font-family:var(--en);direction:ltr;unicode-bidi:isolate;display:inline-block}

.wrap{max-width:56rem;margin:0 auto;padding:0 clamp(.9rem,3vw,1.5rem)}
.hbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-block:.6rem}
:root.hc .hbar{background:var(--bg);backdrop-filter:none}
.hrow{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
.brand{font-size:1.35rem;font-weight:800;letter-spacing:-.01em;display:flex;
  align-items:baseline;gap:.5rem;margin-inline-end:auto}
.brand small{font-size:.72rem;font-weight:600;color:var(--muted);letter-spacing:.06em}
.gbtn{display:inline-flex;align-items:center;gap:.4rem;background:var(--surface);
  border:1px solid var(--line);border-radius:999px;padding:.42rem .8rem;cursor:pointer;
  font-size:.86rem;font-weight:600;box-shadow:var(--shadow);min-height:44px}
.gbtn:hover{border-color:var(--accent)}
.gbtn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:1.1rem}
.grid{display:grid;gap:.85rem}
@media(min-width:640px){.g2{grid-template-columns:1fr 1fr}}
@media(min-width:900px){.g3{grid-template-columns:repeat(3,1fr)}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;
  border:1px solid var(--line);background:var(--surface);border-radius:12px;
  padding:.72rem 1.1rem;font-weight:700;cursor:pointer;box-shadow:var(--shadow);
  min-height:2.9rem;font-size:1rem}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;box-shadow:none}
.btn[disabled]{opacity:.45;cursor:default}
.btn.wide{width:100%}

.chip{display:inline-flex;align-items:center;gap:.35rem;border-radius:999px;
  padding:.22rem .6rem;font-size:.78rem;font-weight:700;background:var(--surface2);color:var(--muted)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}

/* ===== מסלולים: הצבע נכנס ככרטיס, לא כרקע של טקסט ===== */
.trk{--c:var(--accent);--cs:var(--accent-soft)}
.t-sound{--c:var(--c-sound);--cs:var(--cs-sound)}
.t-words{--c:var(--c-words);--cs:var(--cs-words)}
.t-talk{--c:var(--c-talk); --cs:var(--cs-talk)}
.t-read{--c:var(--c-read); --cs:var(--cs-read)}
.tcard{border-inline-start:5px solid var(--c);cursor:pointer;text-align:start;width:100%;
  display:flex;flex-direction:column;gap:.4rem;align-items:stretch}
.tcard:hover{border-color:var(--c)}
.tcard h3{font-size:1.05rem}
.tcard .sub{font-size:.85rem;color:var(--muted)}
.tdot{width:.62rem;height:.62rem;border-radius:50%;background:var(--c);flex:none}
.thead{display:flex;align-items:center;gap:.5rem}
.tpill{background:var(--cs);color:var(--c);border-radius:999px;padding:.15rem .55rem;
  font-size:.72rem;font-weight:800}

/* ===== סרגל שליטה ברמות ===== */
.lvls{display:flex;gap:.4rem;flex-wrap:wrap}
.lvl{border:1px solid var(--line);background:var(--surface);border-radius:10px;
  padding:.4rem .7rem;font-size:.82rem;font-weight:700;cursor:pointer;
  display:inline-flex;align-items:center;gap:.4rem}
.lvl.on{background:var(--c,var(--accent));color:#fff;border-color:var(--c,var(--accent))}
.bar{height:.42rem;border-radius:999px;background:var(--surface2);overflow:hidden;flex:1;min-width:3rem}
.bar i{display:block;height:100%;background:var(--c,var(--accent))}
.bar.b0 i{background:var(--bad)} .bar.b1 i{background:var(--warn)} .bar.b2 i{background:var(--ok)}

/* ===== תרגול ===== */
.qcard{border-top:5px solid var(--c,var(--accent))}
.qtop{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.7rem}
.qtext{font-size:1.12rem;font-weight:600;margin:.2rem 0 .3rem}
.qhint{color:var(--muted);font-size:.9rem}
/* המילה או המשפט שנלמדים. גדול, מרווח, ותמיד לצד כפתור השמעה. */
.subject{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;
  background:var(--surface2);border-radius:12px;padding:.85rem 1rem;margin:.5rem 0}
.subject .word{font-family:var(--en);direction:ltr;unicode-bidi:isolate;
  font-size:1.7rem;font-weight:700;letter-spacing:.01em;line-height:1.25}
.subject .ipa{font-family:var(--en);direction:ltr;unicode-bidi:isolate;
  color:var(--muted);font-size:.95rem}
.spk{border:1px solid var(--line);background:var(--surface);border-radius:999px;
  width:2.7rem;height:2.7rem;display:inline-flex;align-items:center;justify-content:center;
  cursor:pointer;flex:none;box-shadow:var(--shadow)}
.spk:hover{border-color:var(--accent);color:var(--accent)}
.spk.sm{width:2.1rem;height:2.1rem}
.spk.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.opts{display:grid;gap:.6rem;margin-top:.9rem}
@media(min-width:560px){.opts.two{grid-template-columns:1fr 1fr}}
.opt{display:flex;align-items:center;gap:.6rem;text-align:start;width:100%;
  border:2px solid var(--line);background:var(--surface);border-radius:12px;
  padding:.8rem .9rem;cursor:pointer;font-size:1.02rem;font-weight:600;min-height:3.1rem}
.opt:hover{border-color:var(--accent)}
.opt .k{width:1.9rem;height:1.9rem;border-radius:8px;background:var(--surface2);
  display:inline-flex;align-items:center;justify-content:center;font-size:.85rem;
  font-weight:800;color:var(--muted);flex:none}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .k{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .k{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.55}

/* אריחי בניית משפט. הסדר הוא התרגיל, ולכן האריח חייב להיראות כמשהו
   שאפשר להרים — מסגרת מלאה ורקע משלו, לא טקסט על רקע הכרטיס. */
.tiles{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:.7rem}
.tile{font-family:var(--en);direction:ltr;border:2px solid var(--line);
  background:var(--surface);border-radius:10px;padding:.5rem .8rem;font-weight:600;
  cursor:pointer;font-size:1.02rem;min-height:2.7rem}
.tile:hover{border-color:var(--accent)}
.slot{min-height:3.2rem;border:2px dashed var(--line);border-radius:12px;
  background:var(--surface2);padding:.5rem;display:flex;flex-wrap:wrap;gap:.45rem;
  align-items:center;direction:ltr}
.slot.ok{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.slot.bad{border-style:solid;border-color:var(--bad);background:var(--bad-soft)}
.slot .tile{background:var(--surface)}

/* ===== משוב ===== */
.fb{margin-top:.9rem;border-radius:12px;padding:.85rem 1rem;border:1px solid transparent}
.fb.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.fb.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.fb b{display:block;font-size:1.02rem;margin-bottom:.2rem}
.fb .body{color:var(--ink);font-weight:500;font-size:.95rem}
.why{margin-top:.55rem;padding-top:.55rem;border-top:1px dashed currentColor;color:var(--ink);
  font-weight:500;font-size:.93rem}

/* ===== קטע קריאה ===== */
.passage{background:var(--surface2);border-radius:12px;padding:1rem 1.1rem;margin:.6rem 0;
  font-family:var(--en);direction:ltr;unicode-bidi:isolate;font-size:1.08rem;line-height:2}
.passage .s{border-radius:5px;padding:.05em .12em;cursor:pointer}
.passage .s:hover{background:var(--accent-soft)}
.passage .s.now{background:var(--accent-soft);box-shadow:0 2px 0 var(--accent)}
.wd{border-radius:5px;padding:1px 3px}
.wd.hit{background:var(--hit);color:var(--hit-ink);font-weight:600}
.gloss{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.5rem}
.gword{border:1px solid var(--line);background:var(--surface);border-radius:999px;
  padding:.25rem .6rem;font-size:.85rem;cursor:pointer}
.gword b{font-family:var(--en);direction:ltr;unicode-bidi:isolate}

/* ===== סרגל מצב הקול ===== */
.vstrip{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;border-radius:10px;
  padding:.45rem .7rem;font-size:.85rem;font-weight:600;margin-bottom:.7rem}
.vstrip.ok{background:var(--ok-soft);color:var(--ok)}
.vstrip.warn{background:var(--warn-soft);color:var(--warn)}
.vstrip.bad{background:var(--bad-soft);color:var(--bad)}
.vstrip .btn{padding:.3rem .7rem;min-height:44px;font-size:.82rem}  /* 2.1rem היו 36 פיקסלים — מתחת ליעד המגע */

/* ===== הגדרות ===== */
.row{display:flex;align-items:center;justify-content:space-between;gap:.8rem;
  padding:.7rem 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row:last-child{border-bottom:0}
.row .lab{font-weight:700}
.row .desc{font-size:.85rem;color:var(--muted);font-weight:500}
.sw{width:3.2rem;height:1.8rem;border-radius:999px;background:var(--surface2);
  border:1px solid var(--line);position:relative;cursor:pointer;flex:none}
.sw i{position:absolute;top:.18rem;inset-inline-start:.2rem;width:1.3rem;height:1.3rem;
  border-radius:50%;background:var(--faint);transition:.15s}
.sw.on{background:var(--accent);border-color:var(--accent)}
.sw.on i{inset-inline-start:1.5rem;background:#fff}
.vgrid{display:grid;gap:.5rem;grid-template-columns:1fr}
@media(min-width:560px){.vgrid{grid-template-columns:1fr 1fr}}
.vopt{display:flex;align-items:center;gap:.6rem;border:2px solid var(--line);
  background:var(--surface);border-radius:12px;padding:.6rem .75rem;cursor:pointer;text-align:start}
.vopt.on{border-color:var(--accent);background:var(--accent-soft)}
.vopt .nm{font-weight:700}
.vopt .ds{font-size:.8rem;color:var(--muted)}
input[type=password],input[type=text]{font:inherit;background:var(--surface);color:var(--ink);
  border:1px solid var(--line);border-radius:10px;padding:.6rem .7rem;min-width:0;flex:1;
  direction:ltr;text-align:left}
input[type=range]{width:100%;accent-color:var(--accent)}

.fbar{border-top:1px solid var(--line);margin-top:2rem;padding-block:1rem;
  color:var(--faint);font-size:.82rem}
.hidden{display:none!important}

/* ---------- שדה קלט של המבחן ----------
   מודול המבחן הועתק לכאן מאפליקציה שבה .field כבר היה מוגדר.
   בלי הכלל הזה שדה השם של הנבחן נשאר תיבת ברירת המחדל של
   הדפדפן — 21 פיקסלים גובה, הרבה מתחת ליעד המגע של 44. */
.field{width:100%;box-sizing:border-box;font:inherit;font-size:1rem;
  min-height:48px;padding:12px 14px;border-radius:11px;outline:none;background:var(--surface2);color:inherit;border:1px solid var(--line)}
.field:focus{border-color:var(--accent)}
textarea.field{min-height:96px;resize:vertical}

/* ---------- שורות המבחן ----------
   .tog הגיע ממודול המבחן שהועתק לכאן, ולא היה לו עיצוב כלל: השם
   והמידע שמתחתיו נדבקו לשורה אחת בלי רווח. */
.tog{display:flex;align-items:center;gap:13px;width:100%;text-align:start;
  background:var(--surface2);border:1px solid transparent;border-radius:12px;
  padding:13px 15px;min-width:0}
.tog:hover{border-color:var(--line)}
.tog+.tog{margin-top:9px}
.tog .tt{flex:1;min-width:0}
.tog .tt b{display:block;font-size:.97rem;overflow-wrap:anywhere}
.tog .tt span{display:block;color:var(--muted);font-size:.85rem;overflow-wrap:anywhere;margin-top:2px}

/* יעד מגע לקישור התחתית. קישור טקסט בשורה יוצא בגובה הטקסט —
   15 פיקסלים — וזה קטן מדי לאצבע, גם כשהוא רק לתנאי השימוש. */
.lg-foot a{display:inline-flex;align-items:center;min-height:44px;padding-inline:6px}

/* ---------- יעדי מגע ----------
   .lvl יצא 39 פיקסלים ומתג ה-.sw רק 31, שניהם מתחת ל-44 שהפרויקט
   מחייב את עצמו בהם. במתג לא מגדילים את המסילה — היא תיראה מגושמת —
   אלא מרחיבים את שטח הלחיצה סביבה. */
.lvl{min-height:44px}
.sw{position:relative}
.sw::after{content:"";position:absolute;inset-block:-7px;inset-inline:-4px}

/* ---------- מסך בניית המבחן ----------
   .seg ו-.tpc הגיעו עם מודול המבחן שהועתק לכאן, ולא היה להם עיצוב:
   כפתורי הבחירה יצאו 34 פיקסלים, וכרטיסי הנושאים 6 פיקסלים בלבד —

    function ws(o,s){for(var j=0;j<s.length;j++)v.setUint8(o+j,s.charCodeAt(j))}
    ws(0,"RIFF");v.setUint32(4,36+dl,true);ws(8,"WAVE");ws(12,"fmt ");
    v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,ch,true);
    v.setUint32(24,sr,true);v.setUint32(28,sr*ch*bits/8,true);
    v.setUint16(32,ch*bits/8,true);v.setUint16(34,bits,true);
    ws(36,"data");v.setUint32(40,dl,true);
    new Uint8Array(hdr,44).set(buf);
    var bytes=new Uint8Array(hdr),out="";
    for(var k=0;k<bytes.length;k+=8192)out+=String.fromCharCode.apply(null,bytes.subarray(k,k+8192));

function gSynth(text,voiceName,rate,lang){
  var L=GEM_LEAD[lang]||GEM_LEAD.en;
  var lead=rate<=0.7?L.slow:rate<=0.9?L.soft:rate>=1.15?L.fast:L.norm;
  var body={contents:[{parts:[{text:lead+text}]}],
    generationConfig:{responseModalities:["AUDIO"],
      speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:voiceName}}}}};
  return fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key="+
      encodeURIComponent(GKEY),
    {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})
  .then(function(r){
    if(r.ok)return r.json();
    return r.text().then(function(tx){
      var m="";try{var j=JSON.parse(tx);m=(j.error&&j.error.message)||""}catch(e){m=String(tx).slice(0,140)}
      throw new Error(r.status+(m?" — "+m:""));
    });
  })
  .then(function(d){
    var parts=(d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts)||[];
    for(var i=0;i<parts.length;i++){
      var pd=parts[i].inlineData;
      if(pd&&pd.data){
        var mt=pd.mimeType||"";
        if(mt.indexOf("wav")>=0||mt.indexOf("pcm")>=0||mt.indexOf("L16")>=0)
          return pcmToWav(pd.data)||("data:audio/wav;base64,"+pd.data);
        return "data:audio/mp3;base64,"+pd.data;
      }
    }
    throw new Error("no-audio");
  });

/* ============================================================

   ------------------------------------------------------------
   עובד רק כשהטקסט הנאמר הוא הטקסט המוצג. כאן זה המצב — כפתור
   ההשמעה נושא את אותה מחרוזת שמופיעה לידו על המסך.

   charIndex מתאפס בכל אמירה, ולכן המפה נבנית מהמחרוזת שנמסרה
   למנוע ולא מה-DOM. אנדרואיד, ולעתים ספארי, לא שולחים דיווח על
   מילים כלל — ואז הדגשה שלא זזה נראית כמו תקלה, ולכן אחרי שנייה
   וחצי בלי דיווח מודגש כל הטקסט במקום מילה בודדת.
   ============================================================ */
var HL={el:null,raw:"",spans:[],map:[],timer:null,got:false,added:false};
function hlClear(){
  if(HL.timer){clearTimeout(HL.timer);HL.timer=null}
  if(HL.el){try{HL.el.innerHTML=HL.raw;HL.el.classList.remove("now")}catch(e){}}
  HL={el:null,raw:"",spans:[],map:[],timer:null,got:false,added:false};
}
/* האיבר שמציג בדיוק את המחרוזת הזאת. מדלגים על איברים שמכילים
   כפתור — החלפת ה-HTML שלהם הייתה מוחקת את כפתור ההשמעה עצמו. */
function hlFind(btn,text){
  var want=String(text||"").replace(/\s+/g," ").trim();
  if(!want||!btn)return null;
  var box=(btn.closest&&btn.closest(".subject,.qcard,.fb,.passage,.card"))||document.body;
  var cand=box.querySelectorAll(".word,.s,span,p,b");
  for(var i=0;i<cand.length;i++){
    if(cand[i].querySelector("button"))continue;
    if((cand[i].textContent||"").replace(/\s+/g," ").trim()===want)return cand[i];
  }
  return null;
}
/* כשאין איבר יחיד שמציג בדיוק את המחרוזת — למשל משפט שמורכב
   מכותרת ומתיאור בשני איברים — אי אפשר למפות מילים. מדגישים את
   הכרטיס כולו, כדי שיהיה משוב במקום שום דבר. */
function hlWhole(el){
  hlClear();
  if(!el)return;
  HL.el=el; HL.raw=el.innerHTML; HL.added=true;
  el.classList.add("now");
}
function hlPrep(el,text){
  hlClear();
  if(!el||!text)return;
  HL.el=el; HL.raw=el.innerHTML;
  var parts=String(text).split(/(\s+)/),html="",pos=0,idx=0;
  HL.map=[];
  for(var i=0;i<parts.length;i++){
    var pt=parts[i];
    if(!pt.length)continue;
    if(/^\s+$/.test(pt)){html+=pt;pos+=pt.length;continue}
    HL.map.push({from:pos,to:pos+pt.length,i:idx});
    html+='<span class="wd" data-i="'+idx+'">'+esc(pt)+'</span>';
    pos+=pt.length; idx++;
  }
  if(!HL.map.length){hlClear();return}
  el.innerHTML=html;
  HL.spans=el.querySelectorAll(".wd");
  HL.timer=setTimeout(function(){if(!HL.got&&HL.el){HL.added=true;HL.el.classList.add("now")}},1500);
}
function hlAt(c){
  if(!HL.el||!HL.map.length)return;
  HL.got=true;
  if(HL.timer){clearTimeout(HL.timer);HL.timer=null}
  if(HL.added){HL.el.classList.remove("now");HL.added=false}
  for(var k=0;k<HL.map.length;k++){
    if(c>=HL.map[k].from&&c<HL.map[k].to){
      for(var j=0;j<HL.spans.length;j++)HL.spans[j].classList.toggle("hit",j===HL.map[k].i);
      return;
    }
  }
}

/* ------------------------------------------------------------
   כשמנוע הדיבור של המכשיר נכשל — לומר את זה.
   עד כאן onerror רק ניקה הדגשה, והמשתמש קיבל שקט בלי הסבר:
   "אין קול" נראה כמו תקלה באפליקציה בזמן ש-synthesis-failed
   הגיע מהמערכת. שגיאה שנבלעת עולה יום של חיפוש.
   ------------------------------------------------------------ */
var _ttsBar=null;
function ttsFail(err){
  try{ hlClear() }catch(e){}
  /* "interrupted" ו-"canceled" אינן תקלות: זה מה שהמנוע מדווח על
     אמירה שבוטלה כדי לפנות מקום לאמירה הבאה — כלומר מהלך תקין
     לגמרי, שקורה בכל לחיצה שנייה. הצגתן כשגיאה הבהילה משתמש
     ואמרה לו שהמכשיר שלו שבור בזמן שהוא עבד. */
  if(err==="interrupted"||err==="canceled")return;
  if(_ttsBar)return;
  var m=document.createElement("div");
  m.setAttribute("role","alert");
  m.id="tts-fail";
  m.dir="rtl";
  m.style.cssText="position:fixed;inset-inline:10px;bottom:10px;z-index:99999;"+
    "background:#7f1d1d;color:#fff;padding:13px 15px;border-radius:12px;"+
    "font:600 15px/1.55 system-ui,Arial,sans-serif;box-shadow:0 10px 34px rgba(0,0,0,.45);"+
    "display:flex;gap:10px;align-items:flex-start";
  var t=document.createElement("div");
  t.style.cssText="flex:1;min-width:0";
  t.innerHTML="מנוע הדיבור של המכשיר לא הצליח להקריא"+
    (err?" <span dir=ltr>("+String(err)+")</span>":"")+
    ". זו תקלה במכשיר, לא באפליקציה. "+
    '<a href="/voice/" style="color:#fff">בדיקה והוראות תיקון</a>';
  var x=document.createElement("button");
  x.type="button"; x.textContent="✕"; x.setAttribute("aria-label","סגירה");
  x.style.cssText="min-width:44px;min-height:44px;border:0;border-radius:9px;"+
    "background:rgba(255,255,255,.16);color:#fff;font-size:16px;cursor:pointer";
  x.onclick=function(){ if(_ttsBar&&_ttsBar.parentNode)_ttsBar.parentNode.removeChild(_ttsBar); _ttsBar=null };
  m.appendChild(t); m.appendChild(x);
  document.body.appendChild(m); _ttsBar=m;
}
/* הקראה שהצליחה מסירה את ההודעה — המצב השתנה */
function ttsOK(){ if(_ttsBar&&_ttsBar.parentNode){_ttsBar.parentNode.removeChild(_ttsBar);_ttsBar=null} }

function speakDevice(text,code,rate){
  if(!("speechSynthesis" in window))return false;
  try{speechSynthesis.cancel()}catch(e){}
  /* האמירה יוצאת מיד, בתוך הלחיצה. קודם היא נעטפה ב-voicesReady,
     שממתין לרשימת הקולות ועד ארבע שניות אם היא לא מגיעה — ואמירה
     שיוצאת ארבע שניות אחרי המגע נזרקת בשקט באנדרואיד ובספארי.
     כשהרשימה כבר כאן, בוחרים קול ומדברים. כשהיא ריקה — מדברים
     בכל זאת, עם u.lang בלבד: קול ברירת מחדל בשפה הנכונה עדיף על
     שתיקה, ויש מכשירים שמחזירים רשימה ריקה לצמיתות ומדברים היטב.
     voicesReady נשאר בשימוש למסך בחירת הקול, שם ההמתנה במקומה. */
  (function(){
    try{
      var u=new SpeechSynthesisUtterance(text);
      var v=bestVoice(code);
      u.lang=(v&&v.lang)||code;
      if(v)u.voice=v;
      u.rate=clamp(rate,0.55,1.4); u.pitch=1;
      u.onboundary=function(e){if(!e.name||e.name==="word")hlAt(e.charIndex)};
      u.onend=function(){hlClear();ttsOK()};
      u.onerror=function(e){ttsFail(e&&e.error)};
      speechSynthesis.speak(u);
    }catch(e){}
  })();
  return true;
}
/* lang: "en" לחומר הנלמד, או קוד שפת האם להוראה. */
function speak(text,lang,rateMul){
  /* כל טקסט שמגיע להקראה מנוקה מתגיות. חלק מהקריאות כבר מנקות
     לבד, וניקוי חוזר אינו משנה דבר — אבל בלעדיו כל מחרוזת שנשארה
     עם <sub> או <span class="frac"> הוקראה בקול כתגית: הסטודנט
     שמע "span class frac" באמצע השאלה. */
  text=plainOf(String(text||"")).trim(); if(!text)return;
  lang=lang||"en";
  var code=lang==="en"?EN_TTS:LANGS[lang].tts;
  var rate=clamp(state.rate*(rateMul||1),0.55,1.4);
  stopSpeak();
  if(gemOn()){
    var vid=gvOf(state.gemVoice).id;
    var ck=lang+"|"+vid+"|"+rate.toFixed(2)+"|"+text;
    if(gCache[ck]){playUrl(gCache[ck],text,code,rate);return}
    gBusy=true; renderSpeakState();
    gSynth(text,vid,rate,lang).then(function(u){
      gCache[ck]=u; gBusy=false; renderSpeakState(); playUrl(u,text,code,rate);
    }).catch(function(){
      gBusy=false; renderSpeakState(); speakDevice(text,code,rate);
    });
    return;
  }
  speakDevice(text,code,rate);
}
function playUrl(url,text,code,rate){
  gStop();

  if(!GEL)GEL=new Audio();

    if(pr&&pr.then)pr.then(function(){try{GEL.pause();GEL.currentTime=0}catch(e){}},function(){});
  }catch(e){}
},{once:true});}catch(e){}

topic("shop","talk",

 ],
 [

/* ============================================================
   8. מנוע התרגילים
   ------------------------------------------------------------
   כלל אחד מנחה את כל הבנייה כאן: מסיח חייב להיות מסיח *סביר*.
   ארבע אפשרויות אקראיות מלמדות לנחש לפי אורך המילה. ארבע
   אפשרויות קרובות מכריחות באמת להבחין, וזו כל התועלת.
   ============================================================ */
function itemId(tid,lv,i){return tid+"|"+lv+"|"+i}
function itemRec(id){
  if(!state.item[id])state.item[id]={n:0,ok:0};
  return state.item[id];
}
/* בחירת פריט: קודם מה שעוד לא נראה, אחר כך מה שנכשל, ורק בסוף
   מה שכבר נשלט. חזרה מרווחת פשוטה, בלי שעון ובלי נוסחה. */
function chooseIndex(tid,lv,pool,avoid){
  var cand=[],i,w;
  for(i=0;i<pool.length;i++){
    if(avoid!==undefined&&i===avoid&&pool.length>1)continue;
    var r=state.item[itemId(tid,lv,i)];
    if(!r||!r.n)w=6;                       /* חדש */
    else if(r.ok<r.n)w=1+Math.min(4,r.n-r.ok);  /* נכשל בעבר */
    else w=1;                               /* נשלט */
    for(var j=0;j<w;j++)cand.push(i);
  }
  if(!cand.length)return 0;
  return pick(cand);
}
function poolOf(tp,lv){return (tp.L[lv-1]||tp.L[0]||[])}
function kindsIn(pool){
  var k={w:[],s:[],p:[]},i;
  for(i=0;i<pool.length;i++)if(k[pool[i].k])k[pool[i].k].push(i);
  return k;
}
/* מילים דומות מכל התוכן, לא רק מהרמה הזאת — כדי שמסיח יוכל להיות
   מילה שנלמדה קודם, וזה בעצמו תרגול חזרה. */
var ALL_WORDS=null;
function allWords(){
  if(ALL_WORDS)return ALL_WORDS;
  ALL_WORDS=[];
  TOPICS.forEach(function(tp){tp.L.forEach(function(lvl){
    lvl.forEach(function(it){if(it.k==="w")ALL_WORDS.push(it)})})});
  return ALL_WORDS;
}
function wordByText(txt){
  var a=allWords();
  for(var i=0;i<a.length;i++)if(a[i].w.toLowerCase()===String(txt).toLowerCase())return a[i];
  return null;
}
/* מסיחים למילה: קודם ה-near שלה, ואז מילים מאותו נושא. */
/* needGloss: בתרגיל משמעות האפשרויות *הן* המשמעויות, ולכן מסיח בלי
   תרגום אינו מסיח אלא שורה ריקה. חלק מה-near הם צורות ("record
   (verb)") שאין להן ערך משלהן, והם נופלים בדיוק כאן. */
function wordDistract(it,pool,n,needGloss){
  var out=[],i,seen={};
  function add(x){
    var k=x.w.toLowerCase();
    if(seen[k])return false;
    if(needGloss&&!x.g)return false;
    seen[k]=1; out.push(x); return true;
  }
  seen[it.w.toLowerCase()]=1;
  (it.near||[]).forEach(function(nw){
    add(wordByText(nw)||{k:"w",w:nw,ipa:"",g:null,near:[]});
  });
  var rest=shuffle(pool.filter(function(x){return x.k==="w"}));
  for(i=0;i<rest.length&&out.length<n;i++)add(rest[i]);
  rest=shuffle(allWords());
  for(i=0;i<rest.length&&out.length<n;i++)add(rest[i]);
  return out.slice(0,n);
}
function O(html,ok,why){return {h:html,ok:!!ok,why:why||""}}

/* --- צורה 1: מילה נשמעת ונראית → מה המשמעות --- */
function formMean(tp,lv,pool,idx){
  var it=pool[idx];
  var ds=wordDistract(it,pool,3,true);
  var seen={},opts=[O(esc(gl(it.g)),true)];
  seen[gl(it.g)]=1;
  ds.forEach(function(d){
    var g=gl(d.g);
    /* שתי מילים שונות יכולות לחלוק תרגום. שתי אפשרויות זהות הן
       שאלה בלי תשובה יחידה. */
    if(!g||seen[g])return; seen[g]=1;
    opts.push(O(esc(g),false,d.w+" = "+g));
  });
  return {type:"mean",prompt:t("qMean"),subject:it,opts:shuffle(opts),
    answer:gl(it.g),say:it.w};
}
/* --- צורה 2: המשמעות בשפת האם → איזו מילה באנגלית --- */
function formBack(tp,lv,pool,idx){
  var it=pool[idx];
  var ds=wordDistract(it,pool,3);
  var opts=[O('<span class="en-b">'+esc(it.w)+"</span>",true)];
  ds.slice(0,3).forEach(function(d){opts.push(O('<span class="en-b">'+esc(d.w)+"</span>",false,
    d.g?(d.w+" = "+gl(d.g)):""))});
  return {type:"back",prompt:t("qSay"),lead:gl(it.g),subject:null,
    opts:shuffle(opts),answer:it.w,say:it.w,reveal:it};
}
/* --- צורה 3: רק אוזן. המילה אינה מוצגת עד שעונים --- */
function formHear(tp,lv,pool,idx){
  var it=pool[idx];
  var ds=wordDistract(it,pool,3);
  var opts=[O('<span class="en-b">'+esc(it.w)+"</span>",true)];
  ds.slice(0,2).forEach(function(d){opts.push(O('<span class="en-b">'+esc(d.w)+"</span>",false,
    d.g?(d.w+" = "+gl(d.g)):""))});
  return {type:"hear",prompt:t("qHear"),subject:null,hidden:it,
    opts:shuffle(opts),answer:it.w,say:it.w,reveal:it,auto:true};
}
/* --- צורה 4: המצב בשפת האם → איזה משפט אומרים --- */
function formUse(tp,lv,pool,idx){
  var it=pool[idx];
  var others=shuffle(pool.filter(function(x){return x.k==="s"&&x!==it}));
  var opts=[O('<span class="en-b">'+esc(it.s)+"</span>",true)];
  others.slice(0,2).forEach(function(d){opts.push(O('<span class="en-b">'+esc(d.s)+"</span>",false,
    gl(d.g)))});
  return {type:"use",prompt:t("qUse"),lead:it.u?gl(it.u):gl(it.g),subject:null,
    opts:shuffle(opts),answer:it.s,say:it.s,reveal:it};
}
/* --- צורה 5: משפט עם חסר --- */
var STOP_GAP=/^(a|an|the|to|of|is|are|was|were|be|i|you|he|she|it|we|they|my|your)$/i;
function formGap(tp,lv,pool,idx){
  var it=pool[idx];
  var parts=it.s.split(" ");
  var cand=[];
  for(var i=0;i<parts.length;i++){
    var bare=parts[i].replace(/[^A-Za-z']/g,"");
    if(bare.length>=3&&!STOP_GAP.test(bare))cand.push(i);
  }
  if(!cand.length)return formUse(tp,lv,pool,idx);
  var gi=pick(cand),gone=parts[gi].replace(/[^A-Za-z']/g,"");
  var shown=parts.slice();
  shown[gi]=parts[gi].replace(gone,"_____");
  var others=[],seen={};seen[gone.toLowerCase()]=1;
  pool.forEach(function(x){
    var src=x.k==="s"?x.s:(x.k==="w"?x.w:"");
    src.split(" ").forEach(function(p){
      var b=p.replace(/[^A-Za-z']/g,"");
      if(b.length>=3&&!STOP_GAP.test(b)&&!seen[b.toLowerCase()]){seen[b.toLowerCase()]=1;others.push(b)}
    });
  });
  var opts=[O('<span class="en-b">'+esc(gone)+"</span>",true)];
  shuffle(others).slice(0,3).forEach(function(w){
    opts.push(O('<span class="en-b">'+esc(w)+"</span>",false))});
  return {type:"gap",prompt:t("qGap"),gapHtml:'<span class="en-b">'+esc(shown.join(" "))+"</span>",
    lead:gl(it.g),subject:null,opts:shuffle(opts),answer:gone,say:it.s,reveal:it};
}
/* --- צורה 6: בניית משפט מאריחים --- */
function formOrder(tp,lv,pool,idx){
  var it=pool[idx];
  var words=it.s.split(" ");
  if(words.length<3||words.length>9)return formUse(tp,lv,pool,idx);
  var tiles=shuffle(words.slice());
  /* ערבוב שיצא זהה למקור אינו תרגיל */
  if(tiles.join(" ")===words.join(" ")&&words.length>2)tiles=shuffle(tiles.reverse());
  return {type:"order",prompt:t("qOrder"),lead:gl(it.g),tiles:tiles,target:words,
    say:it.s,reveal:it,subject:null};
}
/* --- צורה 7: הבנת הנקרא --- */
function formComp(tp,lv,pool,idx){
  var it=pool[idx];
  var qq=pick(it.qs);
  var opts=[O(esc(gl(qq.a)),true)];
  qq.w.forEach(function(x){opts.push(O(esc(gl(x)),false))});
  return {type:"comp",prompt:t("qRead"),passage:it,qtext:gl(qq.q),
    opts:shuffle(opts),answer:gl(qq.a),say:it.lines.join(" "),subject:null};
}

/* בוחר את צורת התרגיל. הרמה קובעת כמה פיגום נשאר: ברמה 1 שפת האם
   נוכחת תמיד, ברמה 3 היא נעלמת וגם האוזן לבדה נדרשת. */
function buildQuestion(tid,lv,avoid){
  var tp=topicOf(tid); if(!tp)return null;
  var pool=poolOf(tp,lv), k=kindsIn(pool);
  var idx=chooseIndex(tid,lv,pool,avoid);
  var it=pool[idx];
  var q;
  if(it.k==="p")q=formComp(tp,lv,pool,idx);
  else if(it.k==="s"){
    var sForms=lv===1?["use","gap"]:lv===2?["use","gap","order"]:["gap","order","use"];
    var f=pick(sForms);
    q=f==="gap"?formGap(tp,lv,pool,idx):f==="order"?formOrder(tp,lv,pool,idx):formUse(tp,lv,pool,idx);
  } else {
    var wForms=lv===1?["mean","mean","hear"]:lv===2?["mean","back","hear"]:["back","hear","hear","mean"];
    var f2=pick(wForms);
    q=f2==="back"?formBack(tp,lv,pool,idx):f2==="hear"?formHear(tp,lv,pool,idx):formMean(tp,lv,pool,idx);
  }
  q.tid=tid; q.lv=lv; q.idx=idx; q.id=itemId(tid,lv,idx);
  return q;
}

/* ============================================================
   18. מבחן כיתתי — פרסום בוואטסאפ, קבלת תשובות וציונים
   ------------------------------------------------------------
   אין שרת, ואין כוונה שיהיה. לכן המבחן אינו נשלח לשום מקום:
   הוא *נארז לתוך הקישור*. המורה מקבל קישור, שולח אותו בוואטסאפ,
   והמכשיר של התלמיד בונה מהקישור בדיוק את אותן שאלות.

   מה שהופך את זה לאפשרי הוא שכל מחולל שאלות כאן משתמש ב-
   Math.random בלבד. אם מזרעים אותו, אותו זרע מייצר את אותן
   שאלות ואת אותו סדר תשובות — אצל המורה ואצל התלמיד. הקישור
   נושא זרע ורשימת נושאים, לא עשרים שאלות מלאות, ולכן הוא נשאר
   קצר מספיק לוואטסאפ.

   שלוש מגבלות שנאמרות כאן במפורש כי הן חלק מהתכנון:
   · אין איסוף אוטומטי. התלמיד שולח קוד תשובות בוואטסאפ, והמורה
     מדביק אותו. זה המחיר של אפס שרת ואפס עלות.
   · אפשר לזייף קוד. הציון מחושב מחדש אצל המורה מתוך התשובות
     ולא נלקח מהתלמיד, אבל אין כאן הגנה קריפטוגרפית — זה מבחן
     כיתתי מעצב, לא בגרות.
   · שמות התלמידים נשארים במכשיר של המורה. הם לא עוברים דרך
     שום שרת, כי אין שרת.
   ============================================================ */
var GENV=1;                 /* גרסת המחוללים. מבחן שנוצר בגרסה אחרת
                               אינו נפתח — עדיף הודעה ברורה מאשר
                               עשרים שאלות אחרות בשקט. */

/* --- מחולל מזורע. mulberry32: קצר, מהיר, ופיזור טוב דיו --- */
function withSeed(seed,fn){
  var real=Math.random,s=(seed>>>0)||1;
  Math.random=function(){
    s|=0; s=s+0x6D2B79F5|0;
    var t=Math.imul(s^s>>>15,1|s);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
  try{return fn()}finally{Math.random=real}
}
function hash32(str){
  var h=0x811c9dc5,i;
  for(i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193)}
  return (h>>>0);
}
/* base64url. הניקוי בפענוח אינו קוסמטי: וואטסאפ שובר מחרוזות
   ארוכות בשורות, ורווח אחד הורס את כל הקוד. */
function b64e(str){
  var bytes=new TextEncoder().encode(str),bin="",i;
  for(i=0;i<bytes.length;i+=8192)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));
  return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function b64d(s){
  s=String(s||"").replace(/[^A-Za-z0-9\-_]/g,"").replace(/-/g,"+").replace(/_/g,"/");
  while(s.length%4)s+="=";
  var bin=atob(s),bytes=new Uint8Array(bin.length),i;
  for(i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function examId(spec){return hash32(spec.s+"|"+spec.q.map(function(x){return x[0]+x[1]}).join(",")).toString(36)}
function encodeExam(spec){return b64e(JSON.stringify(spec))}
function decodeExam(code){
  try{
    var o=JSON.parse(b64d(code));
    if(!o||!o.q||!o.q.length||typeof o.s!=="number")return null;
    o.q=o.q.filter(function(x){return topicById(x[0])});
    return o.q.length?o:null;
  }catch(e){return null}
}
/* בונה את שאלות המבחן. אותו זרע → אותן שאלות, גם אצל המורה
   כשהוא בודק וגם אצל התלמיד כשהוא נבחן. */
function examQuestions(spec){
  return withSeed(spec.s,function(){
    return spec.q.map(function(pair){return buildQ(pair[0],pair[1])});
  });
}
function examUrl(spec){
  var base=location.origin+location.pathname;
  return base+"#x="+encodeExam(spec);
}
function waLink(text,phone){
  var p=String(phone||"").replace(/[^0-9]/g,"");
  return "https://wa.me/"+p+"?text="+encodeURIComponent(text);
}

/* --- קוד ההגשה של התלמיד --- */
function encodeResult(id,name,answers){
  var body={i:id,n:String(name||"").slice(0,40),a:answers,d:todayIso()};
  body.c=hash32(JSON.stringify([body.i,body.n,body.a])).toString(36);
  return b64e(JSON.stringify(body));
}
function decodeResult(code){
  try{
    var o=JSON.parse(b64d(code));
    if(!o||!o.i||!o.a||!o.a.length)return null;
    o.ok=(o.c===hash32(JSON.stringify([o.i,o.n,o.a])).toString(36));
    return o;
  }catch(e){return null}
}
/* הציון מחושב כאן מחדש מתוך התשובות. מה שהתלמיד שלח הוא מה
   שסימן, לא כמה הוא קיבל. */
function gradeResult(spec,res){
  var qs=examQuestions(spec),per=[],ok=0,i,q,a;
  for(i=0;i<qs.length;i++){
    q=qs[i]; a=res.a[i];
    var right=(a>=0&&q.options[a]&&q.options[a].ok)?1:0;
    if(right)ok++;
    per.push({topic:q.topic,topicName:q.topicName,ok:right,
              picked:(a>=0&&q.options[a])?q.options[a].t:"—",
              answer:(q.options.filter(function(o){return o.ok})[0]||{}).t||""});
  }
  return {ok:ok,n:qs.length,pct:Math.round(100*ok/qs.length),per:per};
}

function xt(k){var d=XT[xlg()];var v=d&&d[k];return v===undefined?(XK[k]===undefined?k:XK[k]):v}
/* {0} ו-{1} — סדר המילים משתנה בין השפות, ולכן מספרים ולא רצף */
function xf(k){var s=xt(k),a=arguments,i;
  for(i=1;i<a.length;i++)s=s.split("{"+(i-1)+"}").join(String(a[i]));

var MK={open:"",paste:"",msg:null,del:""};
function viewMarks(){
  var h='<div class="wrap" style="padding-block:22px">';
  h+='<h1 class="h1">'+esc(xt("mkTitle"))+'</h1>'+
     '<p class="sub">'+esc(xt("mkLead"))+'</p>';
  h+='<div class="row" style="margin-top:14px"><button class="btn btn-p" data-a="go" data-v="exam">'+
     ic("plus",17)+' '+esc(xt("mkNew"))+'</button></div>';

  if(!EX.list.length){
    h+='<div class="card pad" style="margin-top:16px"><p class="sub" style="margin:0">'+
       esc(xt("mkEmpty"))+'</p></div>';
    return h+'</div>';
  }
  EX.list.forEach(function(ex){
    var open=MK.open===ex.id;
    var subs=ex.subs||[];
    var avg=subs.length?Math.round(subs.reduce(function(a,b){return a+b.pct},0)/subs.length):0;
    h+='<div class="card pad" style="margin-top:14px">';
    h+='<button class="row" data-a="mkopen" data-i="'+esc(ex.id)+'" style="width:100%;background:none;border:0;text-align:start;cursor:pointer">'+
       '<span style="flex:1;min-width:0"><b>'+esc(ex.spec.t||xt("exam"))+'</b>'+
       '<span class="sub" style="display:block">'+ex.spec.q.length+' '+esc(xt("qs"))+' · '+esc(ex.date)+
       ' · '+subs.length+' '+esc(xt("mkSubs"))+(subs.length?' · '+esc(xt("mkAvg"))+' '+avg:'')+'</span></span>'+
       '<span class="chip'+(subs.length?(avg>=70?" ok":avg>=55?" warn":" bad"):"")+'">'+
       (subs.length?avg+"%":"—")+'</span></button>';
    if(!open){h+='</div>';return}

    h+='<div style="margin-top:14px"><label class="tt"><b>'+esc(xt("mkPaste"))+'</b></label>'+
       '<textarea class="field" id="mkPaste" rows="3" placeholder="'+esc(xt("mkPastePh"))+'"></textarea>'+
       '<div class="row" style="margin-top:8px">'+
       '<button class="btn btn-p" data-a="mkadd" data-i="'+esc(ex.id)+'">'+ic("check",17)+' '+esc(xt("mkTake"))+'</button>'+
       '<a class="btn" href="'+esc(waLink((ex.spec.t||xt("exam"))+"\n"+examUrl(ex.spec),""))+'" target="_blank" rel="noopener">'+
       ic("share",17)+' '+esc(xt("mkResend"))+'</a>'+
       (subs.length?'<button class="btn btn-g" data-a="mkcopy" data-i="'+esc(ex.id)+'">'+ic("copy",17)+' '+esc(xt("mkCopyTbl"))+'</button>':"")+
       (MK.del===ex.id?
         '<span class="row" style="gap:6px"><span class="chip bad">'+esc(xf("mkDelQ",subs.length||0))+'</span>'+
         '<button class="btn btn-d" data-a="mkdelyes" data-i="'+esc(ex.id)+'">'+esc(xt("mkDelYes"))+'</button>'+
         '<button class="btn btn-g" data-a="mkdelno">'+esc(xt("mkCancel"))+'</button></span>':
         '<button class="btn btn-g" data-a="mkdel" data-i="'+esc(ex.id)+'">'+esc(xt("mkDel"))+'</button>')+
       '</div>';
    if(MK.msg&&MK.msg.id===ex.id)
      h+='<p class="chip '+(MK.msg.ok?"ok":"bad")+'" style="margin-top:10px">'+esc(MK.msg.m)+'</p>';
    h+='</div>';

    if(subs.length){
      /* לפי תלמיד */
      h+='<div style="margin-top:16px"><b>'+esc(xt("mkByStudent"))+'</b>';
      subs.slice().sort(function(a,b){return b.pct-a.pct}).forEach(function(s){
        var wrong=s.per.filter(function(p){return !p.ok});
        h+='<div class="tog" style="align-items:flex-start"><span class="tt"><b>'+esc(s.name||xt("mkNoName"))+'</b>'+
          '<span>'+s.ok+' '+esc(xt("outOf"))+' '+s.n+
          (wrong.length?' · '+esc(xt("mkFell"))+' '+esc(uniq(wrong.map(function(p){return p.topicName})).join(", ")):' · '+esc(xt("mkAllOk")))+
          (s.valid?"":' · <b style="color:var(--bad)">'+esc(xt("mkBadCode"))+'</b>')+'</span></span>'+
          '<span class="chip '+(s.pct>=70?"ok":s.pct>=55?"warn":"bad")+'">'+s.pct+'%</span></div>';
      });
      h+='</div>';
      /* לפי נושא — זה מה שמורה באמת צריך: לא מי נכשל, אלא מה ללמד שוב */
      var byT={};
      subs.forEach(function(s){s.per.forEach(function(p){
        if(!byT[p.topic])byT[p.topic]={n:0,ok:0,name:p.topicName};
        byT[p.topic].n++; byT[p.topic].ok+=p.ok;
      })});
      h+='<div style="margin-top:16px"><b>'+esc(xt("mkByTopic"))+'</b>'+
         '<p class="sub" style="margin:4px 0 8px">'+esc(xt("mkByTopicNote"))+'</p>';
      Object.keys(byT).map(function(k){var o=byT[k];o.pct=Math.round(100*o.ok/o.n);return o})
        .sort(function(a,b){return a.pct-b.pct}).forEach(function(o){
        h+='<div class="tog"><span class="tt"><b>'+esc(o.name)+'</b>'+
          '<span>'+o.ok+' '+esc(xt("mkRight"))+' '+o.n+'</span></span>'+
          '<span class="bar '+(o.pct>=70?"ok":o.pct>=40?"mid":"low")+'" style="width:90px;flex:none">'+
          '<i style="width:'+o.pct+'%"></i></span>'+
          '<span class="chip">'+o.pct+'%</span></div>';
      });
      h+='</div>';
    }
    h+='</div>';
  });
  return h+'</div>';
}
function marksTable(ex){
  var out=(ex.spec.t||xt("exam"))+"\n";
  out+=xt("mkTblHead")+"\n";
  (ex.subs||[]).slice().sort(function(a,b){return b.pct-a.pct}).forEach(function(s){
    var wrong=uniq(s.per.filter(function(p){return !p.ok}).map(function(p){return p.topicName}));
    out+=(s.name||xt("mkNoName"))+"\t"+s.pct+"\t"+s.ok+"/"+s.n+"\t"+wrong.join(", ")+"\n";
  });
  return out;
}

var SIT={spec:null,id:"",qs:[],i:0,name:"",answers:[],phase:"intro",code:"",copied:false};

function sitStart(){
  var nm=$("#sitName"); SIT.name=nm?nm.value.trim():"";
  SIT.qs=examQuestions(SIT.spec);
  SIT.answers=SIT.qs.map(function(){return -1});
  SIT.i=0; SIT.phase="ask";
  window.scrollTo(0,0); render();
}
function sitAnswer(i){
  if(SIT.phase!=="ask")return;
  SIT.answers[SIT.i]=i;
  sitNext();
}
function sitNext(){
  if(SIT.i+1<SIT.qs.length){SIT.i++;window.scrollTo(0,0);render();return}
  /* לא מגישים בלחיצה על תשובה. לחיצה בטעות על האפשרות האחרונה
     אינה אמורה לסיים מבחן. */
  SIT.phase="review"; stopSpeak(); window.scrollTo(0,0); render();
}
function sitGo(i){
  SIT.i=clamp(i,0,SIT.qs.length-1); SIT.phase="ask";
  window.scrollTo(0,0); render();
}
function sitFinish(){
  SIT.phase="done";
  SIT.code=encodeResult(SIT.id,SIT.name,SIT.answers);
  stopSpeak(); window.scrollTo(0,0); render();
}
function sitGrade(){
  var ok=0,i;
  for(i=0;i<SIT.qs.length;i++){
    var a=SIT.answers[i];
    if(a>=0&&SIT.qs[i].options[a]&&SIT.qs[i].options[a].ok)ok++;
  }
  return {ok:ok,n:SIT.qs.length,pct:Math.round(100*ok/SIT.qs.length)};
}

        '</div>';
    h2+='</div></main>';
    return h2;
  }
  if(SIT.phase==="review"){
    var notYet=SIT.answers.filter(function(a){return a<0}).length;
    var hr='<div class="wrap" style="padding-block:24px;max-width:640px"><div class="card pad">'+
      '<h1 class="h1">'+esc(xt("stReview"))+'</h1>'+
      '<p class="sub">'+esc(xt("stReviewNote"))+'</p>'+
      (notYet?'<p class="chip warn" style="margin-top:10px">'+esc(xf("stUnanswered",notYet))+'</p>':
              '<p class="chip ok" style="margin-top:10px">'+esc(xt("stAllAnswered"))+'</p>');
    SIT.qs.forEach(function(q,i){
      var a=SIT.answers[i];
      hr+='<button class="tog" data-a="sitgo" data-i="'+i+'" style="align-items:flex-start">'+
        '<span class="tt"><b>'+(i+1)+'. '+esc(q.topicName)+'</b>'+
        '<span>'+(a>=0?esc(xt("stPicked"))+" "+q.options[a].h:"<b>"+esc(xt("stNotYet"))+"</b>")+'</span></span>'+
        '<span class="chip'+(a>=0?"":" warn")+'">'+esc(a>=0?xt("stChange"):xt("stFill"))+'</span></button>';
    });
    hr+='<button class="btn btn-p w" style="margin-top:16px" data-a="sitfinish">'+
        ic("check",18)+' '+esc(xt("stDone"))+'</button>';
    return hr+'</div></div>';
  }
  /* סיום */
  var g=sitGrade(),msg;
  msg=(SIT.name||xt("student"))+" — "+esc(sp.t||xt("exam"))+"\n"+xt("stGrade")+" "+g.pct+
      " ("+g.ok+"/"+g.n+")\n"+xt("stCode")+"\n"+SIT.code;
  var h3='<div class="wrap" style="padding-block:26px;max-width:640px">';
  h3+='<div class="card pad"><h1 class="h1">'+esc(xt("stFinished"))+'</h1>'+
      '<p class="sub">'+esc(sp.t||xt("exam"))+'</p>'+
      '<div class="row" style="margin-top:12px"><span class="chip '+(g.pct>=70?"ok":g.pct>=55?"warn":"bad")+
      '" style="font-size:1.4rem;padding:10px 18px">'+g.pct+'</span>'+
      '<span class="sub">'+esc(xf("stScoreLine",g.ok,g.n))+'</span></div>';
  h3+='<p class="sub" style="margin-top:16px"><b>'+esc(xt("stSendNow"))+'</b> '+
      esc(xt("stSendNote"))+'</p>';
  h3+='<div class="row" style="margin-top:12px">'+
      '<a class="btn btn-p" href="'+esc(waLink(msg,sp.p||""))+'" target="_blank" rel="noopener">'+
      ic("share",17)+' '+esc(xt("exWa"))+(sp.p?' '+esc(xt("stToTeacher")):'')+'</a>'+
      '<button class="btn" data-a="sitcopy">'+ic("copy",17)+' '+esc(xt("stCopyCode"))+'</button></div>';
  if(SIT.copied)h3+='<p class="chip ok" style="margin-top:10px">'+esc(xt("stCodeCopied"))+'</p>';
  h3+='<p class="sub" style="margin-top:12px;word-break:break-all;direction:ltr;text-align:left;'+
      'background:var(--surface2);border-radius:10px;padding:10px">'+esc(SIT.code)+'</p>';
  h3+='</div>';

  if(sp.w!==false){
    h3+='<div class="card pad" style="margin-top:16px"><h2 class="h2">'+esc(xt("stWhatRight"))+'</h2>'+
        '<p class="sub">'+esc(xt("stWhatRightNote"))+'</p>';
    SIT.qs.forEach(function(q,i){
      var a=SIT.answers[i],right=(a>=0&&q.options[a]&&q.options[a].ok);
      var corr=(q.options.filter(function(o){return o.ok})[0]||{}).h||"";

        '<b>'+(i+1)+'. '+esc(q.topicName)+'</b>'+

    });
    h3+='</div>';

  h3+='<div class="row" style="margin-top:16px"><a class="btn btn-g" href="'+
      esc(location.origin+location.pathname)+'">'+esc(xt("stToApp"))+'</a></div>';
  return h3+'</div>';

function copyText(txt,done){
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(done,function(){fallbackCopy(txt,done)});
      return;
    }
  }catch(e){}
  fallbackCopy(txt,done);
}
function fallbackCopy(txt,done){
  try{
    var ta=document.createElement("textarea");
    ta.value=txt; ta.setAttribute("readonly","");
    ta.style.position="fixed"; ta.style.top="-1000px";
    document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); document.body.removeChild(ta);
    done();
  }catch(e){}
}
function examAction(a,el){
  /* --- בניית מבחן --- */
  if(a==="exlvl"){EB.level=parseInt(el.getAttribute("data-l"),10)||2;EB.built=null;render();return true}
  if(a==="extopic"){
    var id=el.getAttribute("data-t"),k=EB.topics.indexOf(id);
    if(k>=0)EB.topics.splice(k,1);else EB.topics.push(id);
    EB.built=null;render();return true;
  }
  if(a==="exflag"){var f=el.getAttribute("data-f");EB[f]=!EB[f];EB.built=null;render();return true}
  if(a==="exbuild"){
    var ti=$("#exTitle"),ph=$("#exPhone");
    EB.title=ti?ti.value.trim():""; EB.phone=ph?ph.value.trim():"";
    var tops=EB.topics.filter(function(x){return topicById(x)});
    if(!tops.length)tops=topicsForTrack(state.track).slice(0,3).map(function(t){return t.id});
    /* חלוקה שווה בין הנושאים, ואז ערבוב — כדי שלא יגיעו בגושים */
    var q=[],i;
    for(i=0;i<EB.n;i++)q.push([tops[i%tops.length],EB.level]);
    var spec={v:GENV,t:EB.title||xt("exam"),s:(Math.random()*4294967295)>>>0,l:EB.level,
              q:shuffle(q),r:!!EB.tts,f:!!EB.formulas,w:true};
    if(EB.phone)spec.p=EB.phone.replace(/[^0-9]/g,"");
    EB.built=spec; EB.copied="";
    var id=examId(spec);
    if(!exFind(id)){EX.list.unshift({id:id,spec:spec,date:todayIso(),subs:[]});exSave()}
    render(); return true;
  }
  if(a==="excopy"){var u=el.getAttribute("data-v");copyText(u,function(){EB.copied="url";render()});return true}

  /* --- ציונים --- */
  if(a==="mkopen"){var i2=el.getAttribute("data-i");MK.open=MK.open===i2?"":i2;MK.msg=null;render();return true}
  /* מחיקה מוחקת גם את כל ההגשות. שאלה אחת לפני זה היא לא נימוס —
     היא ההבדל בין טעות לבין אובדן של כיתה שלמה. */
  if(a==="mkdel"){MK.del=el.getAttribute("data-i");render();return true}
  if(a==="mkdelno"){MK.del="";render();return true}
  if(a==="mkdelyes"){
    var id3=el.getAttribute("data-i");
    EX.list=EX.list.filter(function(x){return x.id!==id3});
    exSave(); MK.open=""; MK.del=""; render(); return true;
  }
  if(a==="mkcopy"){
    var ex4=exFind(el.getAttribute("data-i")); if(!ex4)return true;
    copyText(marksTable(ex4),function(){MK.msg={id:ex4.id,ok:true,m:xt("mkTblCopied")};render()});
    return true;
  }
  if(a==="mkadd"){
    var ex=exFind(el.getAttribute("data-i")); if(!ex)return true;
    var ta=$("#mkPaste"),raw=ta?ta.value:"";
    var res=decodeResult(raw);
    if(!res){MK.msg={id:ex.id,ok:false,m:xt("mkErrRead")};render();return true}
    if(res.i!==ex.id){
      var other=exFind(res.i);
      MK.msg={id:ex.id,ok:false,m:other?xf("mkErrOther",other.spec.t||xt("exam")):xt("mkErrUnknown")};
      render(); return true;
    }
    if(res.a.length!==ex.spec.q.length){
      MK.msg={id:ex.id,ok:false,m:xt("mkErrCount")};render();return true}
    var g=gradeResult(ex.spec,res);
    var sub={name:res.n||"",date:res.d||todayIso(),ok:g.ok,n:g.n,pct:g.pct,per:g.per,valid:!!res.ok};
    /* הגשה חוזרת של אותו תלמיד מחליפה את הקודמת ולא מצטברת לידה */
    var k2=(ex.subs||[]).findIndex(function(s){return s.name===sub.name});
    if(!ex.subs)ex.subs=[];
    if(k2>=0)ex.subs[k2]=sub; else ex.subs.push(sub);
    exSave();
    MK.msg={id:ex.id,ok:true,m:(sub.name||xt("student"))+" "+xt("mkTaken")+" · "+g.pct+" ("+g.ok+"/"+g.n+")"+
      (sub.valid?"":" · "+xt("mkNoteBad"))};
    if(ta)ta.value="";
    render(); return true;
  }

  /* --- התלמיד --- */
  if(a==="sitstart"){sitStart();return true}
  if(a==="sitans"){sitAnswer(parseInt(el.getAttribute("data-i"),10));return true}
  if(a==="sitskip"){SIT.answers[SIT.i]=-1;sitNext();return true}
  if(a==="sitprev"){sitGo(SIT.i-1);return true}
  if(a==="sitfwd"){sitNext();return true}
  if(a==="sitgo"){sitGo(parseInt(el.getAttribute("data-i"),10));return true}
  if(a==="sitfinish"){sitFinish();return true}
  if(a==="sitread"){var q2=SIT.qs[SIT.i];if(q2)speak(q2.say);return true}
  if(a==="sitform"){view="formulas";render();window.scrollTo(0,0);return true}
  if(a==="sitcopy"){copyText(SIT.code,function(){SIT.copied=true;render()});return true}
  if(a==="sitback"){view="sit";render();window.scrollTo(0,0);return true}
  return false;
}

/* קליטת מבחן מהכתובת. עושים את זה לפני ה-render הראשון, אחרת
   התלמיד רואה לרגע את מסך הבית של אפליקציה שהוא לא מכיר. */
function examFromUrl(){
  var m=String(location.hash||"").match(/^#x=(.+)$/);
  if(!m)return false;
  var sp=decodeExam(m[1]);
  if(!sp){
    view="badexam"; return true;
  }
  if(sp.v!==GENV){view="oldexam";return true}
  SIT.spec=sp; SIT.id=examId(sp); SIT.phase="intro";
  view="sit"; return true;
}

  return '<div class="wrap" style="padding-block:40px;max-width:520px"><div class="card pad">'+
    '<h1 class="h1">'+esc(xt("badLink"))+'</h1><p class="sub">'+esc(msg)+'</p>'+
    '<a class="btn btn-p" style="margin-top:14px" href="'+esc(location.origin+location.pathname)+
    '">'+esc(xt("toApp"))+'</a></div></div>';
}

/* ============================================================

/* ============================================================
   10. אירועים
   ============================================================ */
function newQuestion(){
  var prev=P.q?P.q.idx:undefined;
  P.q=buildQuestion(state.topic,state.level,prev);
  P.picked=-1; P.done=false; P.ok=false; P.slot=[]; P.used=[];
  render();
  /* בתרגיל האזנה המילה אינה מוצגת, ולכן שמיעה אחת אוטומטית היא
     לא נוחות אלא תנאי לכך שיש בכלל שאלה. */
  if(P.q&&P.q.auto)setTimeout(function(){speak(P.q.say,"en")},260);
}
function record(ok){
  var q=P.q; if(!q)return;
  var s=stOf(q.tid,q.lv); s.seen++; ok?s.ok++:s.bad++;
  var r=itemRec(q.id); r.n++; if(ok)r.ok++;
  touchDay(); state.day.n=(state.day.n||0)+1;
  state.totalAsk++; if(ok)state.totalOk++;
  save();
}
function answer(i){
  if(P.done)return;
  var q=P.q,o=q.opts[i];
  P.picked=i; P.done=true; P.ok=!!(o&&o.ok);
  record(P.ok);
  render();
  announce(P.ok?t("correct"):t("wrong")+". "+t("answerIs")+" "+q.answer);
  /* התשובה הנכונה נשמעת מיד, גם כשטעו — במיוחד כשטעו. הצליל הוא
     החומר, ותיקון שקט אינו תיקון. */
  setTimeout(function(){speak(q.say,"en")},P.ok?200:420);
}
function checkOrder(){
  var q=P.q; if(!q||P.done)return;
  P.ok=P.slot.join(" ")===q.target.join(" ");
  P.done=true; record(P.ok); render();
  announce(P.ok?t("correct"):t("wrong"));
  setTimeout(function(){speak(q.say,"en")},P.ok?200:420);
}
function testKey(){
  var inp=$("#gk"); var k=inp?inp.value.trim():"";
  saveKey(k);
  if(!k){gkMsg={ok:true,m:t("vRemoved")};render();return}
  gkMsg=null;
  var b=$("#gsave"); if(b){b.textContent=t("vChecking");b.disabled=true}
  gSynth("Hello.",gvOf(state.gemVoice).id,state.rate,"en")
    .then(function(){gkMsg={ok:true,m:t("vOk")};render();speak("Hello. This is how I sound.","en")})
    .catch(function(){gkMsg={ok:false,m:t("vErr")};render()});
}
exLoad();
examFromUrl();
window.addEventListener("hashchange",function(){
  if(examFromUrl()){stopSpeak();window.scrollTo(0,0);render()}
  else if(view==="sit"||view==="badexam"||view==="oldexam"){view="";render()}
});
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-a]"); if(!el)return;
  var a=el.getAttribute("data-a"),v=el.getAttribute("data-v");
  if(examAction(a,el))return;
  if(a==="go"){view=(v==="exam"||v==="marks"||v==="sit")?v:"";if(!view)state.screen="home";stopSpeak();render();window.scrollTo(0,0);return}
  if(a==="marks"){view="marks";stopSpeak();render();window.scrollTo(0,0);return}
  if(a==="track"){state.track=el.getAttribute("data-t")||"";render();return}
  if(a==="say"||a==="sayline"){
    var txt=el.getAttribute("data-say")||"";
    var lg=el.getAttribute("data-lang")||"en";
    var slow=el.getAttribute("data-slow")==="1";
    /* לחיצה על משפט בקטע מסמנת אותו — הקורא צריך לדעת מה מדבר */
    if(a==="sayline"){
      var all=document.querySelectorAll(".passage .s");
      for(var z=0;z<all.length;z++)all[z].classList.remove("now");
      el.classList.add("now");
    }
    speak(txt,lg,slow?0.7:1);
    /* מכינים אחרי speak, כי הוא קורא ל-stopSpeak שמנקה הדגשה קודמת.
       האמירה נוצרת אסינכרונית אחרי שרשימת הקולות עולה, ולכן ההכנה
       כאן תמיד מקדימה אותה. */
    var tgt=a==="sayline"?el:hlFind(el,txt);
    if(tgt)hlPrep(tgt,txt);
    else hlWhole(el.closest&&el.closest(".fb,.qcard,.card"));
    return;
  }
  if(a==="home"){view="";state.screen="home";P.q=null;stopSpeak();save();render();window.scrollTo(0,0);return}
  if(a==="prog"){view="";state.screen="prog";stopSpeak();render();window.scrollTo(0,0);return}
  if(a==="set"){view="";state.screen="set";stopSpeak();gkMsg=null;render();window.scrollTo(0,0);return}
  if(a==="open"){
    state.topic=el.getAttribute("data-t"); state.screen="prac";
    save(); newQuestion(); window.scrollTo(0,0); return;
  }
  if(a==="lvl"){state.level=clamp(parseInt(v,10)||1,1,3);save();newQuestion();return}
  if(a==="pick"){answer(parseInt(el.getAttribute("data-i"),10));return}
  if(a==="next"){newQuestion();return}
  if(a==="dunno"){
    /* "לא יודע" אינו דילוג: הוא נספר כטעות, ומיד מראה ומשמיע את
       התשובה. מי שמנחש לומד פחות ממי שמודה. */
    var q=P.q; if(!q)return;
    P.done=true; P.ok=false; P.picked=-1; record(false); render();
    setTimeout(function(){speak(q.say,"en")},260);
    return;
  }
  if(a==="slot"){var i=parseInt(el.getAttribute("data-i"),10);
    if(P.used.indexOf(i)<0){P.used.push(i);P.slot.push(P.q.tiles[i]);render()}return}
  if(a==="unslot"){var j=parseInt(el.getAttribute("data-i"),10);
    var w=P.slot[j]; P.slot.splice(j,1);
    var pos=P.q.tiles.indexOf(w),k;
    for(k=0;k<P.used.length;k++)if(P.q.tiles[P.used[k]]===w){P.used.splice(k,1);break}
    render(); return}
  if(a==="clear"){P.slot=[];P.used=[];render();return}
  if(a==="checkorder"){checkOrder();return}
  if(a==="lang"){state.lang=LANGS[v]?v:"he";save();render();return}
  if(a==="vmode"){state.voiceMode=v==="gem"?"gem":"device";save();render();return}
  if(a==="devvoice"||a==="devsample"){
    var lg=el.getAttribute("data-l")||state.lang;
    var code=lg==="en"?EN_TTS:LANGS[lg].tts;
    var uri=el.getAttribute("data-u")||"";
    if(a==="devvoice"){
      if(!state.devVoice)state.devVoice={};
      if(uri)state.devVoice[code]=uri; else delete state.devVoice[code];
      save(); render();
    }
    /* משמיעים תמיד — בחירה בלי לשמוע אינה בחירה. */
    speak(lg==="en"?'Hello. This is the reading voice.':t("heroT"),lg);
    return;
  }
  if(a==="gvoice"){state.gemVoice=gvOf(v).id;save();render();return}
  if(a==="gsample"){
    if(!hasKey()){gkMsg={ok:false,m:t("vNeed")};render();return}
    var vid=gvOf(el.getAttribute("data-v")).id, old=state.gemVoice;
    state.gemVoice=vid; state.voiceMode="gem";
    speak("Hello. This is how I sound.","en");
    state.gemVoice=old; save(); return;
  }
  if(a==="gkshow"){var inp=$("#gk");var val=inp?inp.value:GKEY;gkShow=!gkShow;render();
    var i2=$("#gk"); if(i2){i2.value=val;i2.focus()} return}
  if(a==="gsave"){testKey();return}
  if(a==="tog"){state[v]=!state[v];save();render();return}
  if(a==="theme"){state.theme=v;save();render();return}
  if(a==="askreset"){askReset=true;render();return}
  if(a==="noreset"){askReset=false;render();return}
  if(a==="doreset"){
    var lg2=state.lang; state=blankState(); state.lang=lg2;
    try{localStorage.removeItem(SKEY)}catch(e){}
    askReset=false; save(); render(); return;
  }
});
