:root{
  --ar:"Noto Sans Arabic",system-ui,"Segoe UI",Arial,sans-serif;
  --ru:"Noto Sans",system-ui,"Segoe UI",Arial,sans-serif;   /* קירילית — Heebo אינו מכיל אותה, נמדד 7.9 */
  /* **Heebo, כמו בעשר האפליקציות האחרות — 14.9.2026.**

     עד כאן זו הייתה היחידה ב-Fredoka, גופן תצוגה מעוגל־ילדותי,
     ו-Rubik לגוף. הבעלים ביקש במפורש שהאתר ייראה **מקצועי ולא
     ילדותי**, וזו הייתה החריגה הבולטת ביותר: אחת מול עשר.

     ההפרדה בין תצוגה לגוף נשמרת — היא עוברת למשקל ולא למשפחה,
     וזה נכון טיפוגרפית ממילא. ובדרך יורדות שתי משפחות מבקשת
     הגופנים. */
  --font-display:"Heebo",system-ui,"Segoe UI",Arial,sans-serif;
  --font-body:"Heebo",system-ui,"Segoe UI",Arial,sans-serif;
  --paper:#f3f8f4; --card:#ffffff; --ink:#17333c; --ink-soft:#4c666e; --ink-faint:#5a7178;
  --teal:#0e9c8d; --teal-deep:#0b7568; --teal-soft:#d9f2ec; --teal-ink:#fff;
  --amber:#ffc531; --amber-deep:#8a6100; --amber-soft:#fff3ce;
  --coral:#ff6f61; --coral-deep:#ba3826; --coral-soft:#ffe3de;
  --sky:#58b7e0; --sky-deep:#246c8c; --sky-soft:#dff1fa;
  --violet:#8a63d2; --violet-deep:#6a45b0; --violet-soft:#ece4fa;
  --hit:#ffc531; --hit-ink:#1a1300;
  /* **כינוי, ולא צבע חדש — 15.9.2026.**

     `legal/protect.js` מוזרק לכאן ומצייר את טבעת המיקוד שלו
     ב-`var(--accent, currentColor)`. עשר האפליקציות מגדירות
     `--accent`; זו קוראת לאותו צבע `--teal`, ולכן נפלה לצבע
     הטקסט — **ונמדד שהוא לבן**, כלומר טבעת שעלולה להיעלם.

     הכינוי מצביע ל-`--teal`, ולכן הוא עובר מאליו לשלוש ערכות
     הצבע, למצב הכהה ולניגודיות הגבוהה — בלי ערך נוסף לתחזק. */
  --accent:var(--teal);
}

/* Heebo אינו מכיל גליפים ערביים. בלי
   המשפחה הזאת הממשק הערבי נופל לגופן ברירת המחדל של המערכת —
   נמדד ב-7.9: הוא הוצג בגופן אחר לגמרי. Noto Sans Arabic נטען מאותה בקשת
   גופנים שכבר קיימת, ולכן אין כאן תלות חיצונית חדשה, וקובצי
   הגופן נמשכים רק כשבאמת מוצג טקסט ערבי. */
html[lang="ar"] body,html[lang="ar"] input,html[lang="ar"] button,
html[lang="ar"] textarea,html[lang="ar"] select{font-family:var(--ar)}
html[lang="ru"] body,html[lang="ru"] input,html[lang="ru"] button,
html[lang="ru"] textarea,html[lang="ru"] select{font-family:var(--ru)}
/* לכל פעולת חשבון יש צבע קבוע. ילד לומד את הצבע לפני שהוא
   קורא את המילה, וזה עוזר במיוחד למי שהקריאה עצמה מאמצת אותו. */
.op-maps{--op:var(--teal);--op-d:var(--teal-deep);--op-s:var(--teal-soft)}
.op-med{--op:var(--coral);--op-d:var(--coral-deep);--op-s:var(--coral-soft)}
.op-regions{--op:var(--amber);--op-d:var(--amber-deep);--op-s:var(--amber-soft)}
.op-jeru{--op:var(--sky);--op-d:var(--sky-deep);--op-s:var(--sky-soft)}
.opdot{display:inline-block;width:13px;height:13px;border-radius:5px;background:var(--op);
  border:2px solid var(--op-d);flex-shrink:0;vertical-align:-2px}
.opchip{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:.88rem;
  color:var(--op-d);background:var(--op-s);border:2px solid var(--op);border-radius:99px;padding:5px 16px}
/* פס צבע בראש כרטיס השאלה, בצבע הפעולה */
.card.opcard{box-shadow:0 12px 0 rgba(23,51,60,.12),inset 0 10px 0 var(--op)}
html[data-theme="grape"]{ --paper:#f7f4fc; --teal:#8a63d2; --teal-deep:#6a45b0; --teal-soft:#ece4fa; --teal-ink:#fff; --sky:#4db8a4; --sky-deep:#358d7c; --sky-soft:#dff4ee; }
html[data-theme="berry"]{ --paper:#fdf2f5; --teal:#d94f70; --teal-deep:#b03a57; --teal-soft:#fbdde6; --teal-ink:#fff; --sky:#4fb3c9; --sky-deep:#35899d; --sky-soft:#ddf1f6; }
*{box-sizing:border-box;margin:0}
body{font-family:var(--font-body);background:var(--paper);color:var(--ink);overflow-x:hidden;line-height:1.6}
::selection{background:var(--amber);color:var(--ink)}
/* המילה שנאמרת ברגע זה. שאר האפליקציות מדגישות אותה כבר, וכאן
   לא היה שום סימון — ילד שמאזין איבד את המקום בטקסט. */
.wd{border-radius:5px;padding:1px 3px}
.wd.hit{background:var(--hit);color:var(--hit-ink);font-weight:600}
/* כשהמנוע אינו מדווח על גבולות מילים, או כשהמחרוזת הנאמרת אינה
   מתלכדת עם המוצגת — מודגש כל האיבר במקום מילה בודדת. */
.now{background:var(--hit);color:var(--hit-ink);border-radius:10px;
  box-shadow:0 0 0 5px var(--hit)}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font-family:inherit;color:var(--ink)}
html.large-text{font-size:118%}
html.spaced body{letter-spacing:.015em;word-spacing:.12em;line-height:1.85}
/* ===== נגישות ===== */
/* שלושה גדלי טקסט. משנים את גודל הבסיס, וכל האפליקציה גדלה יחד איתו,
   כי כל המידות בנויות ב-rem. */
html.ts2{font-size:113%}
html.ts3{font-size:128%}
/* פונט ברור לקריאה. Tahoma ו-Verdana קיימים בכל מחשב וכוללים
   עברית, ערבית, רוסית ואנגלית — בניגוד לפונטים ייעודיים לקריאה
   נגישה שקיימים באותיות לטיניות בלבד. */

/* ================= מצב כהה — נוסף 14.9.2026 =================

   **math-app הייתה היחידה מבין שלוש־עשרה בלי מצב כהה בכלל.**
   נמדד: מופע יחיד של `prefers-color-scheme` בכל הקובץ, והוא
   מכסה אך ורק את מודול המבחן הכיתתי שהועתק מ-math-uni. **גוף
   האפליקציה נשאר קרם בהיר גם בטלפון בלילה**, בזמן שתשע
   אפליקציות אחרות עוברות.

   **ושלוש ערכות הצבע חייבות לעבור איתה.** `data-theme` כאן אינו
   בהיר/כהה אלא ערכת מותג — ocean, grape, berry — ולכן
   `html[data-theme]` גובר על `:root` גם בתוך שאילתת מדיה. בלי
   שתי השורות האחרונות, מי שבחר ענבים או פטל היה נשאר בבהיר
   ולא היה מבין למה.

   **הבלוק יושב לפני `html.hi-contrast` בכוונה:** בסלקטיביות שווה
   מנצח האחרון, וניגודיות גבוהה היא בחירה מפורשת של הלומד שחייבת
   לגבור על העדפת המערכת.

   כל ערך נמדד מול הרקע ומול הכרטיס. הנמוך ביותר הוא 5.86
   (`--ink-faint` על הכרטיס), והרוב מעל 7. */
@media (prefers-color-scheme:dark){
  :root{
    --paper:#101a1c; --card:#17262a; --ink:#e8f1f2; --ink-soft:#a9c0c5; --ink-faint:#8aa3a9;
    --teal:#5fd9c8; --teal-deep:#3fbfae; --teal-soft:#123833; --teal-ink:#000;
    --amber:#ffd45e; --amber-deep:#ffc531; --amber-soft:#3a2e0c;
    --coral:#ff9186; --coral-deep:#ff6f61; --coral-soft:#3d1a16;
    --sky:#7fcbea; --sky-deep:#58b7e0; --sky-soft:#12303d;
    --violet:#b49aef; --violet-deep:#8a63d2; --violet-soft:#241a3a;
    --hit:#ffd45e; --hit-ink:#1a1300;
  }
  /* שתי הערכות שומרות על הגוון שלהן, ומקבלות רקע כהה תואם. */
  html[data-theme="grape"]{ --paper:#161228; --card:#1f1836;
    --teal:#b49aef; --teal-deep:#8a63d2; --teal-soft:#241a3a; --teal-ink:#000;
    --sky:#5fd9c8; --sky-deep:#3fbfae; --sky-soft:#123833; }
  html[data-theme="berry"]{ --paper:#241218; --card:#331a22;
    --teal:#f59db1; --teal-deep:#d94f70; --teal-soft:#3d1a24; --teal-ink:#000;
    --sky:#7fcbea; --sky-deep:#58b7e0; --sky-soft:#12303d; }
}
html.clear-font{--font-display:Tahoma,Verdana,Arial,sans-serif;--font-body:Tahoma,Verdana,Arial,sans-serif}
/* ניגודיות גבוהה: שחור על לבן, בלי גוונים רכים, עם מסגרות ברורות. */
html.hi-contrast{
  --paper:#ffffff;--card:#ffffff;--ink:#000000;--ink-soft:#161616;--ink-faint:#333333;
  --teal:#00584e;--teal-deep:#00352e;--teal-soft:#e8f2f0;--teal-ink:#fff;
  --amber:#7a5500;--amber-deep:#523900;--amber-soft:#fbf3e2;
  --coral:#9c1f16;--coral-deep:#73160f;--coral-soft:#fbe8e6;
  --sky:#00517a;--sky-deep:#003651;--sky-soft:#e7f0f6;
  --hit:#ffe600;--hit-ink:#000000;
}
html.hi-contrast .bg{display:none}
html.hi-contrast .op-maps,html.hi-contrast .op-med,html.hi-contrast .op-regions,html.hi-contrast .op-jeru{
  --op:#000;--op-d:#000;--op-s:#fff}
html.hi-contrast .lvl{--lv:#000}
html.hi-contrast .lvl .n{background:#000;color:#fff}
html.hi-contrast .card.opcard{box-shadow:none}
html.hi-contrast .card,html.hi-contrast .opt,html.hi-contrast .tog,
html.hi-contrast .chip,html.hi-contrast .pick,html.hi-contrast .tile{border:2px solid #000}
html.hi-contrast .btn{border:2px solid #000}
/* טבלת מקשי הקיצור בהגדרות */
.keys{display:grid;gap:8px;margin-top:12px}
.keys div{display:flex;align-items:center;gap:10px;color:var(--ink-soft);font-size:.95rem}
.keys kbd{font-family:var(--font-display);font-weight:700;background:var(--paper);border:2px solid rgba(23,51,60,.18);
  border-radius:8px;padding:4px 11px;min-width:38px;text-align:center;color:var(--ink);font-size:.9rem}
.fd{font-family:var(--font-display)}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
/* ambient graph paper */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background-image:linear-gradient(to left,rgba(14,156,141,.07) 1px,transparent 1px),linear-gradient(to bottom,rgba(14,156,141,.07) 1px,transparent 1px);background-size:28px 28px}
.bg .blob{position:absolute;border-radius:50%}
.bg .b1{top:-96px;inset-inline-end:-96px;width:380px;height:380px;background:radial-gradient(circle,rgba(255,197,49,.28),transparent 70%);opacity:.5}
.bg .b2{bottom:-120px;inset-inline-start:-96px;width:430px;height:430px;background:radial-gradient(circle,rgba(14,156,141,.22),transparent 70%);opacity:.5}
.bg .b3{top:33%;inset-inline-start:24%;width:290px;height:290px;background:radial-gradient(circle,rgba(255,111,97,.15),transparent 70%);opacity:.45}
.fl{position:absolute;font-family:var(--font-display);font-weight:700;color:var(--ink);opacity:.06;user-select:none;animation:floaty var(--d,16s) ease-in-out var(--dl,0s) infinite alternate}
@keyframes floaty{from{transform:translateY(0) rotate(var(--r,0deg))}to{transform:translateY(-22px) rotate(calc(var(--r,0deg) + 7deg))}}
#app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}
/* בלי זה כרום מותח כל מסך לרוחב המינימלי של התוכן שלו,
   ואז כל העמוד גולש הצידה בטלפון. */
#app>*{min-width:0;width:100%}
/* header */
header{background:color-mix(in srgb,var(--paper) 85%,transparent);backdrop-filter:blur(6px);border-bottom:3px solid rgba(23,51,60,.08);position:sticky;top:0;z-index:30}
.hbar{display:flex;align-items:center;gap:14px;padding-block:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:12px}
.logo .mark{width:44px;height:44px;border-radius:16px;background:var(--ink);color:var(--amber);display:grid;place-items:center;box-shadow:0 6px 0 rgba(23,51,60,.15);transition:transform .2s}
.logo:hover .mark{transform:rotate(8deg) scale(1.05)}
.logo b{display:block;font-size:1.05rem;line-height:1.1}
.logo small{color:var(--teal-deep);font-weight:600;font-size:.78rem}
nav{display:flex;gap:6px;margin-inline-start:auto;flex-wrap:wrap}
.nb{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:9px 15px;font-family:var(--font-display);font-weight:600;font-size:.95rem;border:2px solid rgba(23,51,60,.1);background:var(--card);color:var(--ink-soft);transition:all .15s}
.nb:hover{border-color:rgba(23,51,60,.35);transform:translateY(-1px)}
.nb.on{background:var(--ink);color:var(--paper);box-shadow:0 5px 0 rgba(23,51,60,.2);transform:rotate(-1deg)}
.chip{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:8px 14px;font-weight:600;font-size:.85rem;border:2px solid rgba(23,51,60,.12);background:var(--card);color:var(--ink-soft);transition:all .15s}
.chip:hover{border-color:var(--teal);color:var(--teal-deep);transform:translateY(-1px)}
.chip.ok{background:var(--teal-deep);color:#fff;border-color:var(--teal-deep)}
.xpchip{display:inline-flex;align-items:center;gap:10px;background:var(--card);border:2px solid rgba(23,51,60,.1);border-radius:999px;padding:5px 16px 5px 6px}
[dir="ltr"] .xpchip{padding:5px 6px 5px 16px}
.xpchip svg{display:block}
/* buttons & cards */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-family:var(--font-display);font-weight:700;border-radius:18px;transition:transform .15s,box-shadow .15s,background .2s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(3px)!important;box-shadow:0 1px 0 rgba(23,51,60,.15)!important}
.btn-teal{background:var(--teal-deep);color:var(--teal-ink);box-shadow:0 6px 0 var(--teal-deep)}
.btn-teal:hover{filter:brightness(1.12)}
.btn-amber{background:var(--amber);color:var(--ink);box-shadow:0 6px 0 var(--amber-deep)}
.btn-amber:hover{background:var(--amber-deep);color:#fff}
.btn-ink{background:var(--ink);color:var(--paper);box-shadow:0 6px 0 rgba(23,51,60,.35)}
.btn-ghost{background:var(--card);border:2px solid rgba(23,51,60,.15);box-shadow:0 5px 0 rgba(23,51,60,.1)}
.btn-coral{background:var(--coral);color:#fff;box-shadow:0 6px 0 var(--coral-deep)}
/* מודול המבחן הכיתתי הועתק ממשפחת math-uni, ושם .btn-p ו-.btn.w
   מוגדרים. כאן הם לא היו, ולכן "מבחן חדש", "צרו את המבחן", "התחלת
   מבחן" וכפתורי הוואטסאפ נראו ככפתור ריק בלי צבע — טקסט קטן עם פלוס.
   כחול, ולא טורקיז: זה כפתור של המורה, ובולט מכל שאר המסך. */
.btn-p{background:#2563eb;color:#fff;box-shadow:0 6px 0 #1e40af}
.btn-p:hover{filter:brightness(1.1)}
/* במצב ניגודיות גבוהה הכחול אינו החלטה אלא שריד:
   כל המסך עובר לפלטת ה-hc, והכפתור הראשי נשאר לבדו. נוסף
   14.9.2026 — ארבע אפליקציות המתמטיקה כבר החזיקו את זה. */
:root.hc .btn-p{background:var(--teal);border-color:var(--teal);box-shadow:none}
.btn.w{width:100%}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none!important}
.card{background:var(--card);border:3px solid var(--ink);border-radius:30px;box-shadow:0 12px 0 rgba(23,51,60,.12)}
/* animations */
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.06);opacity:.85}}
@keyframes bulb{0%,100%{filter:drop-shadow(0 0 0 rgba(255,197,49,0))}50%{filter:drop-shadow(0 0 9px rgba(255,197,49,.95))}}
@keyframes caret{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
.bob{animation:bob 3.2s ease-in-out infinite}
.wig{animation:wiggle .55s ease-in-out}
.pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.shake{animation:shake .45s ease-in-out}
.rise{animation:rise .55s cubic-bezier(.2,.9,.3,1) both}
.pulse{animation:pulse 2.6s ease-in-out infinite}
.bulb{animation:bulb 1.8s ease-in-out infinite}
.caret{display:inline-block;width:3px;height:1.05em;background:var(--teal);border-radius:3px;margin-inline-start:4px;vertical-align:middle;animation:caret .9s step-end infinite}
.spin{animation:spin .9s linear infinite}
html.reduce-motion *{animation:none!important;transition:none!important}
/* העדפת מערכת ההפעלה מקבלת בדיוק מה שהמתג הפנימי נותן. קודם היא
   קיבלה רשימה חלקית, ו-.spin ,.brc ו-.sm-d.p המשיכו לזוז. */
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* טבעת פוקוס — שמונה האפליקציות האחרות מגדירות אותה, זו לא. */
:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:6px}
/* קישור דילוג לתוכן: מוסתר עד שמגיעים אליו ב-Tab, ואז נראה ככפתור.
   היעד הוא <main id="main"> שכל מסך נעטף בו ב-render. */
.skip{position:absolute;inset-inline-start:-9999px}
.skip:focus{position:static;display:inline-flex;align-items:center;min-height:44px;
  margin:8px;padding:8px 14px;background:var(--teal-deep);color:var(--teal-ink);
  border-radius:8px;font-weight:700;text-decoration:none;z-index:100}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
/* practice */
.lvlbar{display:flex;gap:8px;overflow-x:auto;padding:6px 2px;scrollbar-width:thin}
/* **ברוחב שאינו מכיל את שבע הרמות הן עוטפות, ולא גוללות.**
   נמדד ב-400px: `scrollWidth` 738 מול `clientWidth` 360 — ארבע
   רמות (בינוני, מתקדם, אתגר, אלופים) ישבו מחוץ למסך, במיקומים
   ‎-31, ‎-144, ‎-245 ו-‎-356. הפס אמנם גליל, אבל `scrollbar-width:thin`
   **אינו מצייר דבר במגע**, ולכן בטלפון לא היה שום רמז שקיימות
   עוד רמות. זו גילוּיוּת, וגילוּיוּת לא נפתרת בחץ קטן יותר —
   נפתרת בכך שהכול נראה. 48rem = 768px, מעל 738 שהפס דורש. */
@media (max-width:48rem){.lvlbar{flex-wrap:wrap;overflow-x:visible}}
.lvl{display:inline-flex;align-items:center;gap:7px;flex-shrink:0;font-family:var(--font-display);font-weight:600;font-size:.88rem;border-radius:999px;border:2.5px solid rgba(23,51,60,.15);background:var(--card);color:var(--ink-soft);padding:7px 14px;transition:all .15s}
.lvl:hover{border-color:var(--amber);color:var(--amber-deep)}
.lvl.on{border-color:var(--ink);background:var(--amber);color:var(--ink);box-shadow:0 4px 0 var(--amber-deep);transform:rotate(-1deg)}
.lvl .n{width:20px;height:20px;border-radius:50%;background:var(--lv,rgba(23,51,60,.08));
  color:#fff;display:grid;place-items:center;font-size:.72rem;font-weight:700}
/* צבעי הרמות קבועים ולא נגזרים מהערכה, כי ערכת ״ענבים״ מחליפה
   את הטורקיז בסגול — ואז שתי רמות היו מקבלות אותו צבע בדיוק.
   חוץ מזה, ״רמה 5 היא סגולה״ עדיף שיישאר נכון בכל ערכה. */
.lvl.l1{--lv:#2e86ad}
.lvl.l2{--lv:#0b7568}
.lvl.l3{--lv:#d99a00}
.lvl.l4{--lv:#d94f42}
.lvl.l5{--lv:#6a45b0}
.lvl.l6{--lv:#17333c}
.lvl.l6 .n{color:var(--amber)}
.lvl.on .n{background:var(--ink);color:var(--amber)}
/* גם הטבעת סביב הכפתור מקבלת את צבע הרמה, כדי שרואים את הסולם
   גם בלי לקרוא את המספרים */
.lvl{border-color:var(--lv,rgba(23,51,60,.15))!important}
.lvl.on{border-color:var(--ink)!important}
.dots{display:flex;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid rgba(23,51,60,.2);background:transparent}
.dot.ok{background:var(--teal);border-color:var(--teal-deep)}
.dot.no{background:var(--coral);border-color:var(--coral-deep)}
.dot.sk{background:var(--sky);opacity:.6}
.opt{font-family:var(--font-display);font-weight:700;font-size:2.1rem;border-radius:18px;border:3px solid rgba(23,51,60,.15);background:var(--paper);padding:22px 10px;transition:all .15s;box-shadow:0 6px 0 rgba(23,51,60,.12)}
.opt:hover:not([disabled]){border-color:var(--op,var(--teal));background:var(--op-s,var(--teal-soft));transform:translateY(-2px)}
.opt.right{border-color:var(--teal-deep);background:var(--teal-deep);color:#fff;box-shadow:0 6px 0 var(--teal-deep)}
.opt.wrong{border-color:rgba(255,111,97,.4);background:var(--coral-soft);color:rgba(217,79,66,.5);text-decoration:line-through;cursor:not-allowed}
.opt.flash{border-color:var(--coral);background:var(--coral-soft);color:var(--coral-deep)}
/* מצב המבחן הכיתתי בלבד. הכפתור שם נושא תג מספר (.k) לצד הערך
   (.m), ולא רק ערך כמו בתרגול — ולכן הוא שורה, לא הריבוע הענק
   שלמעלה. בלי הכלל הזה .k נופל לטקסט inline רגיל ונדבק ל-.m:
   התשובה 18 בכפתור הראשון מוצגת "118", וארבעה כפתורים נפרשים
   בשורה אחת כי ל-.opts אין display. הסימון הועתק לכאן ממשפחת
   החידון, וה-CSS שלו לא בא איתו. */
.opts{display:grid;gap:12px;margin-top:18px}
@media(min-width:520px){.opts{grid-template-columns:1fr 1fr}}
.opts .opt{display:flex;align-items:center;gap:12px;text-align:start;width:100%;font-size:1.5rem;padding:14px 16px;min-height:3.4rem}
.opts .opt .k{flex:none;width:2rem;height:2rem;border-radius:10px;background:var(--teal-soft);color:var(--teal-deep);display:inline-flex;align-items:center;justify-content:center;font-size:.9rem;font-weight:800}
.opts .opt .m{direction:ltr}
.opts .opt.right .k{background:var(--paper);color:var(--teal-deep)}
.hintpill{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:12px;background:var(--amber);color:var(--ink);font-family:var(--font-display);font-weight:700;font-size:1.15rem;border-radius:18px;padding:15px 24px;box-shadow:0 6px 0 var(--amber-deep);transition:all .15s}
.hintpill:hover{background:var(--amber-deep);color:#fff;transform:translateY(-2px)}
.hintpill .cnt{position:absolute;top:-9px;inset-inline-start:-9px;background:var(--coral);color:#fff;font-size:.72rem;width:27px;height:27px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--card)}
.bubble{position:relative;background:var(--card);border:3px solid var(--ink);border-radius:22px;padding:16px 20px;box-shadow:0 7px 0 rgba(23,51,60,.13);font-size:1.05rem;font-weight:500;line-height:1.65}
.bubble::after{content:"";position:absolute;bottom:-10px;inset-inline-start:40px;width:16px;height:16px;background:var(--card);border-inline-start:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(-45deg)}
[dir="ltr"] .bubble::after{transform:rotate(45deg);border:none;border-inline-end:3px solid var(--ink);border-bottom:3px solid var(--ink)}
.shelf{display:flex;flex-wrap:wrap;gap:6px}
.stk{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:1.15rem;border:2px solid rgba(23,51,60,.08);background:var(--paper)}
.stk.got{background:var(--amber-soft);border-color:rgba(255,197,49,.55)}
.stk.miss{opacity:.38;filter:grayscale(1)}
.bar{height:10px;background:rgba(23,51,60,.08);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--teal);transition:width .6s cubic-bezier(.2,.9,.3,1)}
/* breathing overlay */
.overlay{position:fixed;inset:0;background:rgba(23,51,60,.55);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:60;padding:20px}
.brc{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,var(--teal-soft),var(--teal) 75%);display:grid;place-items:center;color:var(--ink);font-family:var(--font-display);font-weight:700;font-size:1.1rem;text-align:center;animation:br 8s ease-in-out infinite;box-shadow:0 0 0 12px rgba(255,255,255,.15)}
@keyframes br{0%,100%{transform:scale(.8)}45%,55%{transform:scale(1.12)}}
/* settings */
.tog{display:flex;align-items:center;gap:16px;text-align:start;width:100%;background:var(--paper);border:2px solid rgba(23,51,60,.1);border-radius:18px;padding:15px 18px;transition:background .2s}
.tog:hover{background:var(--teal-soft)}
.tog+.tog{margin-top:12px}
.sw{position:relative;width:56px;height:32px;border-radius:99px;background:rgba(23,51,60,.12);border:2px solid rgba(23,51,60,.15);flex-shrink:0;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.tog[aria-checked="true"] .sw{background:var(--teal);border-color:var(--teal-deep)}
.tog[aria-checked="true"] .sw::after{transform:translateX(-24px)}
[dir="ltr"] .tog[aria-checked="true"] .sw::after{transform:translateX(24px)}
.swb{display:inline-block;font-size:.62rem;font-weight:700;background:var(--amber);color:var(--ink);border-radius:99px;padding:2px 9px;margin-inline-start:8px;vertical-align:middle}
input[type=range]{width:100%;accent-color:var(--teal)}
.vrow{display:flex;align-items:center;gap:12px;margin-top:9px;padding:12px 16px;border-radius:16px;border:2.5px solid rgba(23,51,60,.1);background:var(--paper);cursor:pointer;transition:all .15s}
.vrow:hover{border-color:rgba(23,51,60,.3)}
.vrow.on{border-color:var(--teal);background:var(--teal-soft);box-shadow:0 5px 0 rgba(14,156,141,.25)}
.vrow .rd{width:20px;height:20px;border-radius:50%;border:2.5px solid rgba(23,51,60,.25);display:grid;place-items:center;flex-shrink:0}
.vrow.on .rd{border-color:var(--teal)}
.vrow.on .rd::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--teal)}
/* מדליית הדירוג ותג ״זה אתה״ — שניהם היו אמוג׳י עד 14.9.2026. */
.mdl{display:inline-flex;align-items:center;justify-content:center;
  inline-size:2rem;block-size:2rem;border-radius:50%;font-weight:800;
  font-size:1.05rem;color:var(--paper);flex:0 0 auto}
.you{display:inline-block;margin-inline-start:.4rem;padding:1px 7px;
  border-radius:99px;background:var(--teal-soft);color:var(--teal-deep);
  font-size:.68rem;font-weight:700;white-space:nowrap}
.stk svg{inline-size:1.6rem;block-size:1.6rem}
.badge{font-size:.68rem;font-weight:700;border-radius:99px;padding:2.5px 10px;white-space:nowrap}
.b-gold{background:var(--amber-soft);color:var(--amber-deep);border:1px solid rgba(255,197,49,.6)}
.b-teal{background:var(--teal-soft);color:var(--teal-deep);border:1px solid rgba(14,156,141,.35)}
.b-mut{background:rgba(23,51,60,.07);color:var(--ink-soft)}
.b-coral{background:var(--coral-soft);color:var(--coral-deep);border:1px solid rgba(255,111,97,.4)}
.b-sky{background:var(--sky-soft);color:var(--sky-deep);border:1px solid rgba(88,183,224,.4)}
.pick{display:flex;align-items:center;gap:14px;text-align:start;border-radius:20px;border:3px solid rgba(23,51,60,.15);background:var(--paper);padding:16px;transition:all .15s}
.pick:hover{border-color:rgba(23,51,60,.4);background:var(--teal-soft);transform:translateY(-2px)}
.pick.on{border-color:var(--ink);background:var(--amber-soft);box-shadow:0 7px 0 rgba(23,51,60,.14);transform:rotate(-1.5deg)}
.thsw{display:flex;gap:5px}
.thsw i{width:16px;height:16px;border-radius:6px;display:block}
/* records */
.pod{display:flex;align-items:flex-end;justify-content:center;gap:14px;margin-top:26px}
.pcol{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--card);border:3px solid var(--ink);border-radius:24px;padding:18px 14px 14px;box-shadow:0 9px 0 rgba(23,51,60,.12);width:130px}
.pcol.p1{transform:translateY(-16px);background:var(--amber-soft)}
/* בטלפון שלוש עמודות של 130px רחבות מהמסך — מצמצמים אותן
   ומקטינים איתן את החיה, במקום לדחוף את העמוד הצידה. */
@media(max-width:520px){
  .pod{gap:8px}
  .pcol{width:auto;flex:1 1 0;min-width:0;padding:14px 8px 10px}
  .pcol>svg{width:100%;height:auto;max-width:64px}
  .pcol b{font-size:.95rem;overflow-wrap:anywhere}
}
.tbl{width:100%;border-collapse:collapse;margin-top:22px}
.tbl th{font-family:var(--font-display);font-size:.85rem;color:var(--ink-faint);text-align:start;padding:10px 12px;border-bottom:3px solid rgba(23,51,60,.12)}
.tbl td{padding:12px;border-bottom:2px solid rgba(23,51,60,.07);font-weight:500}
.tbl tr.me td{background:var(--teal-soft);font-weight:700}
.tbl tr.me td:first-child{border-inline-start:5px solid var(--teal)}
/* בטלפון צר ארבע העמודות לא נכנסות — מצמצמים ריווח כדי
   שלא יצטרכו לגלול את הטבלה הצידה. */
@media(max-width:520px){
  .tbl th,.tbl td{padding:9px 6px}
  .tbl th{font-size:.78rem}
  .tbl td{font-size:.9rem}
  .tbl td svg{width:26px;height:26px}
}
/* progress */
.tile{background:var(--card);border:3px solid var(--ink);border-radius:22px;padding:16px;text-align:center;box-shadow:0 7px 0 rgba(23,51,60,.12)}
.tile b{display:block;font-family:var(--font-display);font-size:1.9rem;margin-top:8px}
.tile span{color:var(--ink-soft);font-size:.85rem;font-weight:500}
.ic{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:13px}
.wk{display:flex;justify-content:space-between;gap:8px}
.wkd{flex:1;max-width:52px;aspect-ratio:1;border-radius:15px;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;border:2.5px solid rgba(23,51,60,.1);background:var(--paper);color:var(--ink-faint)}
.wkd.on{background:var(--teal-deep);color:#fff;border-color:var(--teal-deep);box-shadow:0 4px 0 var(--teal-deep)}
.wkd.td{background:var(--amber-soft);color:var(--amber-deep);border-color:var(--amber)}
.cols{display:grid;gap:18px}
@media(min-width:860px){.cols{grid-template-columns:1fr 1fr}.cols3{grid-template-columns:repeat(3,1fr)}.cols4{grid-template-columns:repeat(4,1fr)}.cols.ob-hero{grid-template-columns:1.05fr 1fr}.cols.pr-cols{grid-template-columns:1.6fr 1fr}}
/* עמודות גריד לא נותנות לילדים שלהן להצטמצם כברירת מחדל,
   וזה מה שדוחף את העמוד מעבר לרוחב המסך בטלפון. */
.cols>*{min-width:0}
/* כותרת עמוד: אייקון + כותרת. בטלפון צר הכותרת חייבת להתכווץ,
   אחרת היא לבדה רחבה מהמסך וגוררת איתה את כל העמוד. */
.phead{display:flex;align-items:center;gap:16px}
.phead>span:last-child{min-width:0}
.phead h1{font-size:clamp(1.55rem,7.5vw,2.4rem);overflow-wrap:anywhere}
.phead p{overflow-wrap:anywhere}
.cols4{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.hbar2{display:flex;align-items:flex-end;gap:8px;height:130px;direction:ltr}
.hbar2 .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.hbar2 .c i{width:100%;border-radius:8px 8px 0 0;display:block;transition:height .7s cubic-bezier(.2,.9,.3,1)}
.hbar2 .c span{font-size:.62rem;font-family:var(--font-display);font-weight:700;color:var(--ink-soft)}
/* misc */
.note{border-radius:16px;padding:13px 17px;font-size:.9rem;font-weight:500;border:2px solid;line-height:1.6}
.note.ok{background:var(--teal-soft);color:var(--teal-deep);border-color:rgba(14,156,141,.3)}
.note.err{background:var(--coral-soft);color:var(--coral-deep);border-color:rgba(255,111,97,.35)}
.note.warn{background:var(--amber-soft);color:var(--amber-deep);border-color:rgba(255,197,49,.5)}
.kbd{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;word-break:break-all;direction:ltr;text-align:left;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.18);border-radius:14px;padding:12px 16px;color:#fff}
footer{border-top:3px solid rgba(23,51,60,.08);background:color-mix(in srgb,var(--paper) 80%,transparent);margin-top:auto}
.fbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding-block:16px;font-size:.86rem;color:var(--ink-soft)}
.floatlink{position:fixed;bottom:20px;inset-inline-start:20px;z-index:40}
.visdot{width:15px;height:15px;border-radius:50%;background:var(--sky);display:inline-block;margin:3px;opacity:.85}
.visdot.x{background:var(--coral);position:relative}
.visgrid{display:flex;flex-wrap:wrap;max-width:340px;gap:2px;align-items:center;justify-content:center}
.qask{font-family:var(--font-display);font-weight:600;font-size:1.35rem;text-align:center;color:var(--ink-soft);margin-top:28px}
.qbig{font-family:var(--font-display);font-weight:700;font-size:3rem;text-align:center;margin-top:6px;direction:ltr;unicode-bidi:isolate;letter-spacing:3px}
@media(max-width:640px){.qask{font-size:1.1rem}.qbig{font-size:2.3rem}.opt{font-size:1.6rem;padding:16px 8px}}
.qbig.qtext{font-size:1.3rem;letter-spacing:0;line-height:1.5;font-weight:600;unicode-bidi:plaintext;text-align:start}
@media(max-width:640px){.qbig.qtext{font-size:1.1rem}}
/* ===== בורר שפה במסך הפתיחה ===== */
.oblang{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:99px;border:2px solid rgba(23,51,60,.12);background:var(--card);font-family:var(--font-display);font-weight:600;font-size:.95rem;color:var(--ink-soft);transition:all .15s}
.oblang:hover{border-color:#2f5fd8;color:var(--ink)}
.oblang.on{background:#2f5fd8;border-color:#2f5fd8;color:#fff;box-shadow:0 5px 14px rgba(47,95,216,.3)}
/* מסך הפתיחה בטלפון: העמודות חייבות להיות מסוגלות להצטמצם,
   אחרת שלוש חיות ברוחב קבוע דוחפות את כל העמוד מעבר לרוחב המסך. */
.wrap.rise,.wrap.rise>div,.cols.ob-hero,.cols.ob-hero>*{min-width:0}
.ob-pets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:18px}
.ob-pets .pick{min-width:0;justify-content:center}
.ob-pets .pick>span{display:block;width:100%}
.ob-pets svg{width:100%;height:auto;max-width:104px;margin:0 auto;display:block}

/* ===== מצב "למידה איטית" — עיצוב ===== */
.sm-btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:14px;border-radius:18px;font-family:var(--font-display);font-weight:600;font-size:1.05rem;color:var(--teal-ink);background:linear-gradient(135deg,var(--teal-deep),var(--sky-deep));box-shadow:0 6px 16px rgba(14,156,141,.3);transition:transform .15s}
.sm-btn:hover:not(:disabled){transform:translateY(-2px)}
.sm-btn:disabled{opacity:.35;cursor:default}
.sm-ov{position:fixed;inset:0;z-index:120;background:rgba(23,51,60,.6);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px}
.sm-box{background:var(--card);border-radius:26px;width:100%;max-width:540px;max-height:94vh;overflow-y:auto;padding:22px 20px 18px;box-shadow:0 24px 60px rgba(23,51,60,.4)}
.sm-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sm-x{width:40px;height:40px;border-radius:50%;background:var(--paper);font-size:1.2rem;font-weight:700;color:var(--ink-soft);flex:0 0 auto}
.sm-ex{direction:ltr;text-align:center;font-family:var(--font-display);font-weight:700;font-size:2rem;color:var(--teal-deep);margin:12px 0 2px;letter-spacing:2px}
.sm-cap{text-align:center;font-family:var(--font-display);font-weight:600;font-size:1.4rem;min-height:60px;display:flex;align-items:center;justify-content:center;padding:8px 6px;line-height:1.4}
.sm-dots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:12px 8px;min-height:70px;direction:ltr}
.sm-d{width:28px;height:28px;border-radius:50%;background:var(--teal);transition:opacity .25s,transform .2s}
.sm-d.n{background:var(--sky)}
.sm-d.g{background:rgba(23,51,60,.18);opacity:.45;transform:scale(.68)}
.sm-d.p{animation:smpop .45s ease}
/* קבוצות — לכפל ולחילוק */
.sm-grp{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;direction:ltr}
.sm-g{border:2px dashed rgba(23,51,60,.22);border-radius:14px;padding:7px;display:flex;flex-wrap:wrap;gap:5px;justify-content:center;align-content:flex-start;min-width:46px;min-height:44px;transition:all .2s}
.sm-g.fresh{border-color:var(--teal);border-style:solid;background:var(--teal-soft)}
.sm-g .sm-d{width:19px;height:19px}
/* מוטות של עשר — לספירה בקפיצות. כל מוט מחולק ל-10 מקטעים,
   כדי שרואים בעין שהוא באמת שווה עשר עיגולים. */
.sm-b10{display:flex;flex-wrap:wrap;gap:7px;align-items:flex-end;justify-content:center;direction:ltr;padding:10px 6px;min-height:88px}
.sm-rod{width:17px;height:78px;border-radius:5px;flex:0 0 auto;background:var(--teal);
  background-image:repeating-linear-gradient(to bottom,rgba(255,255,255,0) 0 6.8px,rgba(255,255,255,.55) 6.8px 7.8px)}
.sm-b10 .sm-d{width:17px;height:17px;background:var(--sky)}
.sm-rod.p{animation:smpop .45s ease}
.sm-pile{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;max-width:330px;margin:0 auto 12px;padding-bottom:12px;border-bottom:2px dashed rgba(23,51,60,.12)}
.sm-pile .sm-d{width:19px;height:19px;background:var(--ink-faint)}
.sm-stack{display:flex;flex-direction:column;gap:0}
@keyframes smpop{0%{transform:scale(.2);opacity:0}60%{transform:scale(1.35)}100%{transform:scale(1);opacity:1}}
.sm-line{display:flex;gap:5px;overflow-x:auto;padding:10px 4px;direction:ltr}
.sm-t{min-width:34px;padding:6px 0;border-radius:10px;text-align:center;font-weight:600;color:var(--ink-faint);background:var(--paper);flex:0 0 auto;transition:all .2s}
.sm-t.pv{background:var(--teal-soft);color:var(--teal-deep)}
.sm-t.on{background:var(--teal-deep);color:var(--teal-ink);transform:scale(1.2);box-shadow:0 4px 12px rgba(14,156,141,.4)}
.sm-pb{height:8px;background:var(--paper);border-radius:99px;overflow:hidden;margin:10px 4px 4px}
.sm-pb>i{display:block;height:100%;width:0;background:var(--teal);transition:width .25s}
.sm-ctl{display:flex;gap:9px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.sm-ctl button{font-family:var(--font-display);font-weight:600;font-size:1.02rem;padding:12px 18px;border-radius:14px;border:2px solid rgba(23,51,60,.12);background:var(--paper);color:var(--ink);min-width:92px}
.sm-ctl button:disabled{opacity:.3}
.sm-ctl .go{background:var(--teal-deep);color:var(--teal-ink);border-color:transparent}
@media(max-width:430px){.sm-ex{font-size:1.6rem}.sm-cap{font-size:1.15rem}.sm-d{width:23px;height:23px}.sm-ctl button{font-size:.92rem;padding:11px 13px;min-width:78px}}


/* ---------- שדה קלט של המבחן ----------
   מודול המבחן הועתק לכאן מאפליקציה שבה .field כבר היה מוגדר.
   בלי הכלל הזה שדה השם של הנבחן נשאר תיבת ברירת המחדל של
   הדפדפן — 21 פיקסלים גובה, הרבה מתחת ליעד המגע של 44. */
.field{width:100%;box-sizing:border-box;font:inherit;font-size:1rem;
  min-height:48px;padding:12px 14px;border-radius:11px;outline:none;background:var(--paper);color:var(--ink);border:1px solid var(--ink-faint)}
.field:focus{border-color:var(--teal)}
textarea.field{min-height:96px;resize:vertical}

/* ---------- שורות המבחן ----------
   .tog הגיע ממודול המבחן שהועתק לכאן. בלי הכללים האלה השם והמידע
   שמתחתיו נדבקים לשורה אחת בלי רווח: "1. חיבורהתשובה הנכונה: 24".
   */
.tog .tt{flex:1;min-width:0}
.tog .tt b{display:block;font-size:.97rem;overflow-wrap:anywhere}
.tog .tt span{display:block;font-size:.85rem;opacity:.78;overflow-wrap:anywhere;margin-top:2px}

/* יעד מגע לקישור התחתית. קישור טקסט בשורה יוצא בגובה הטקסט —
   15 פיקסלים — וזה קטן מדי לאצבע, גם כשהוא רק לתנאי השימוש. */
.lg-foot a{display:inline-flex;align-items:center;min-height:44px;padding-inline:6px}

/* ---------- מסך בניית המבחן ויעדי מגע ----------
   .seg ו-.tpc הגיעו עם מודול המבחן שהועתק לכאן ולא היה להם עיצוב:
   כפתורי הבחירה יצאו 17 פיקסלים וכרטיסי הנושאים לא נראו כלל.
   בנוסף מוצמד גובה 44 לכל מה שנלחץ — המידה שהפרויקט מחייב את עצמו בה. */
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 auto;min-width:0;min-height:44px;border:2px solid rgba(23,51,60,.12);
  background:var(--paper);color:var(--ink-soft);border-radius:12px;padding:10px 12px;
  font:inherit;font-weight:700;font-size:.9rem;cursor:pointer}
.seg button.on{background:var(--teal-deep);color:#fff;border-color:var(--teal-deep)}
.tpc{position:relative;display:flex;flex-direction:column;gap:8px;text-align:start;
  background:var(--paper);border:2px solid rgba(23,51,60,.12);
  border-inline-start:5px solid var(--c,var(--teal));border-radius:16px;padding:14px;
  min-width:0;min-height:44px;cursor:pointer;font:inherit;color:inherit}
.tpc.on{border-color:var(--teal);background:var(--teal-soft)}
.tpc .tn{font-weight:800;font-size:.98rem;overflow-wrap:anywhere}
.tpc .td{color:var(--ink-soft);font-size:.8rem;overflow-wrap:anywhere}
.btn,.lvl,.nb,button.chip{min-height:44px}

/* טקסט לבן על --teal יוצא 3.41:1 — מתחת ל-4.5 שנדרש. --teal-deep
   מגיע ל-5.4 באותה משפחת צבע, ולכן כל רקע שיש עליו טקסט לבן
   משתמש בו. --teal נשאר לקישוט: פסים, נקודות, סמן. */
/* ---------- מצב מורה ---------- */
.te-wrap{position:fixed;inset:0;z-index:2147482500;background:rgba(8,12,20,.72);
  display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto;
  font-family:system-ui,"Heebo",Arial,sans-serif}
.te-box{background:#fff;color:#111827;max-width:26rem;width:100%;border-radius:18px;
  box-shadow:0 24px 70px -20px rgba(0,0,0,.6);padding:clamp(18px,4vw,26px);
  max-height:92vh;overflow-y:auto;font-size:16px;line-height:1.6}
.te-box h2{margin:0 0 6px;font-size:1.35rem;font-weight:800;line-height:1.25}
.te-lead{margin:0 0 10px;color:#374151}
.te-warn{margin:0 0 12px;font-size:.88rem;color:#7c2d12;background:#fef3c7;
  border-radius:10px;padding:9px 11px}
.te-lab{display:block;margin:10px 0 4px;font-weight:700;font-size:.92rem}
.te-in{width:100%;box-sizing:border-box;font:inherit;letter-spacing:.3em;
  border:1px solid #d1d5db;border-radius:11px;padding:.7rem .8rem;min-height:48px;
  background:#fff;color:#111827}
.te-in:focus-visible{outline:3px solid var(--teal);outline-offset:1px}
.te-chk{display:flex;align-items:center;gap:.5rem;margin-top:14px;min-height:44px;
  font-size:.94rem;cursor:pointer}
.te-chk input{width:20px;height:20px}
.te-note{margin:2px 0 0;font-size:.82rem;color:#6b7280}
.te-msg{margin:10px 0 0;font-size:.92rem;font-weight:700;color:#7f1d1d;
  background:#fee2e2;border-radius:10px;padding:9px 11px}
.te-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.te-btn{font:inherit;font-weight:700;border-radius:12px;padding:.75rem 1.2rem;
  cursor:pointer;border:1px solid #d1d5db;background:#fff;color:#111827;min-height:48px}
.te-btn.pri{background:#111827;color:#fff;border-color:#111827;flex:1 1 9rem}
.te-btn.pri[disabled]{opacity:.5;cursor:default}
.te-btn.link{border:0;background:none;text-decoration:underline;padding:.6rem .2rem;
  color:#374151;margin-top:8px;min-height:44px}
.te-btn:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
@media (prefers-color-scheme:dark){
  .te-box{background:#141a24;color:#e8ecf4}
  .te-lead,.te-note{color:#b9c2d4}
  .te-warn{background:#3a2a10;color:#fcd9a5}
  .te-in{background:#1d2531;color:#e8ecf4;border-color:#2c3648}
  .te-msg{background:#4a1717;color:#ffd7d7}
  .te-btn{background:#1d2531;color:#e8ecf4;border-color:#2c3648}
  .te-btn.pri{background:#e8ecf4;color:#141a24;border-color:#e8ecf4}
  .te-btn.link{color:#b9c2d4}
}

/* ---------- רשימת השאלות במסך בניית המבחן ---------- */
.xq-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.xq{border:1px solid rgba(23,51,60,.15);border-radius:12px;padding:10px 12px;background:var(--card)}
.xq-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.xq-n{flex:0 0 auto;min-width:27px;height:27px;border-radius:8px;display:inline-flex;
  align-items:center;justify-content:center;font-weight:800;font-size:.85rem;background:rgba(23,51,60,.15)}
.xq-tp{font-weight:700;font-size:.88rem;color:var(--ink-soft);overflow-wrap:anywhere}
.xq-acts{margin-inline-start:auto;display:flex;gap:6px;flex-wrap:wrap}
/* 44 פיקסלים גם כאן. כפתור קטן בתוך רשימה ארוכה הוא בדיוק
   הכפתור שנהג מבוגר או ילד עם ADHD לא מצליח לפגוע בו. */
.xq-b{padding:8px 13px;font-size:.88rem;font-weight:700;border-radius:10px;min-height:44px;
  border:1px solid rgba(23,51,60,.15);background:transparent;color:inherit;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:inherit}
.xq-b:hover{background:rgba(23,51,60,.15)}
.xq-b[aria-pressed="true"]{background:rgba(23,51,60,.15)}
.xq-q{margin-top:8px;line-height:1.5;overflow-wrap:anywhere}
.xq-e{margin-top:5px;font-weight:700;overflow-wrap:anywhere}
/* התרגיל לבד — "29 − 7" — הוא רצף של שני מספרים וסימן ניטרלי. בפסקה
   עברית האלגוריתם הדו־כיווני הופך את סדר המספרים, והתלמיד ראה
   "7 − 29" במבחן. מסך התרגול נמנע מזה עם .qbig; מסך המבחן, שהועתק
   ממשפחת math-uni, לא הגדיר את .mline כלל. יישור לימין נשמר בכוונה:
   הביטוי יושב מתחת לשאלה העברית, לא בקצה השמאלי. */
[dir="rtl"] .mline,[dir="rtl"] .xq-e{direction:ltr;unicode-bidi:isolate;text-align:right}
.xq-a{margin-top:7px;font-size:.92rem;color:var(--teal-deep);overflow-wrap:anywhere}
.xq-add{margin-top:12px;gap:8px}
.xq-add .sub{margin:0}
/* שאלת מקור נושאת קטע שלם. בלי תקרה הוא דוחף את שאר הרשימה
   אל מחוץ למסך. */
.xq .passage{max-height:11rem;overflow:auto}

/* ------------------------------------------------------------
   מחלקות עזר שהסימון כאן משתמש בהן, והוגדרו רק במשפחת math-uni
   שממנה הוא הועתק. בלי הכלל, האלמנט נופל לברירת המחדל של
   הדפדפן ואין שום סימן לכך: אין שגיאת JS ואף בדיקה לא רואה זאת.
   נמדד בכרומיום מול math-uni כקבוצת ביקורת. */
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.pad{padding:clamp(14px,3.4vw,22px)}
/* בורר השפה מציג ״العربية״ ו-״Русский״ גם כשהממשק עברי — זה כל
   תפקידו — ולכן `html[lang]` אינו חל עליהם והם יורשים את `--font`,
   שאין בו לא ערבית ולא קירילית. הגופן נקבע לפי השפה שהכפתור מציע,
   ולא לפי שפת הממשק. הסימון אינו אחיד בין האפליקציות (`data-v`,
   `data-n`, `data-l`, ולעיתים גם `lang`), ולכן הכלל מונה את כולם —
   בלוק זהה בתשע האפליקציות, כדי שלא ייסחף ביניהן. */
button[data-a="lang"][data-v="ar"],button[data-a="lang"][data-n="ar"],
button[data-a="lang"][data-l="ar"],button[data-a="lang"][data-l="ar"] .fd,
button[data-a="lang"][lang="ar"]{font-family:var(--ar)}
button[data-a="lang"][data-v="ru"],button[data-a="lang"][data-n="ru"],
button[data-a="lang"][data-l="ru"],button[data-a="lang"][data-l="ru"] .fd,
button[data-a="lang"][lang="ru"]{font-family:var(--ru)}

/* ---------- יעדי מגע ≥44px — 1.10.2026 ----------
   נמדד בדפדפן ב-390px וב-360px, בדף הפתיחה ובשני צעדי לחיצה ממנו.
   הבלוק אחרון ב-style כדי לגבור על ההגדרות שמעליו. מגדילים בריפוד
   ובגובה מינימלי, לא בגובה קשיח — ערבית ורוסית ארוכות יותר. */
input[type=range]{min-height:44px}
.btn.btn-g{min-width:44px}
.fbar a,a[href*="education.gov.il"]{display:inline-flex;align-items:center;min-height:44px}

/* ---------- קישור בתוך טקסט — אזור נגיעה ≥44px · 2.10.2026 (O-110) ----------
   שני מקרים, ונמדדו שניהם ב-390px וב-360px:
   - קישור בתוך שורת טקסט רצה: ריפוד אנכי בלבד. ב-inline הוא מגדיל את
     אזור הנגיעה ואינו נכנס לגובה השורה — אף אלמנט לא זז.
   - קישורים זה מתחת לזה (<br>), וקישור בתוך פס ההקראה הקבוע: שם הריפוד
     חרג מהשורה וכיסה את הקישור או הכפתור שלידו, ולכן inline-flex
     בגובה 44 — כמו `.lg-foot a`. השורה גדלה, ואין חפיפה.
   לא `a` כללי: `.lg-foot a` ודומיו כבר 44px בבנייה אחרת. */
#tts-fail a{display:inline-flex;align-items:center;min-height:44px}
</style>

<style>
/* כפתורי הקראה גדולים וצבעוניים — התקן המשותף (ירוק הקראה, אדום עצירה) */
.spk:not(.sm){border-radius:12px;background:#0b7c71;border-color:#0b7c71;color:#fff;font-weight:700;min-height:46px;width:auto;height:auto;padding:8px 18px;font-size:1.02rem;gap:.4rem}
.spk:not(.sm):hover{background:#0b7c71;color:#fff}
.spkStop{background:#bf4426!important;border-color:#a03a20!important;color:#fff!important}
.spkStop:hover{background:#a03a20!important;color:#fff!important}
/* כפתורי העזר הצבעוניים — התקן המשותף המלא (26.9.2026). ירוק הקראה, אדום עצירה,
   כתום רמז, סגול לימור, כחול פתרון מודרך, אפור־כחלחל נוסחה — אותם
   צבעים בדיוק בכל האפליקציות (מקור האמת: math-teen, docs/STYLE-STANDARD.md). */
.btn[data-a="read"],.btn[data-a="readsteps"]{background:#0b7c71!important;border-color:#0b7c71!important;color:#fff!important;font-weight:700;min-height:46px;padding:10px 16px!important;font-size:1rem!important}
.btn[data-a="read"]:hover,.btn[data-a="readsteps"]:hover{background:#0b7c71!important;color:#fff!important}
.btn[data-a="hush"],.btn[data-a="stop"]{background:#bf4426!important;border-color:#a03a20!important;color:#fff!important;font-weight:700;min-height:46px;padding:10px 16px!important;font-size:1rem!important}
.btn[data-a="hush"]:hover,.btn[data-a="stop"]:hover{background:#a03a20!important;color:#fff!important}
.btn[data-a="hint"]{background:#b45309!important;border-color:#92400e!important;color:#fff!important;font-weight:700;min-height:46px;padding:10px 16px!important;font-size:1rem!important}
.btn[data-a="hint"]:hover{background:#92400e!important;color:#fff!important}
.btn[data-a="tutor"],.btn[data-a="tutor"].ghost{background:#6d28d9!important;border-color:#5b21b6!important;color:#fff!important;font-weight:700;min-height:46px;padding:10px 16px!important;font-size:1rem!important}
.btn[data-a="tutor"]:hover,.btn[data-a="tutor"].ghost:hover{background:#5b21b6!important;color:#fff!important}
.btn[data-a="guide"]{background:#1d4ed8!important;border-color:#1e40af!important;color:#fff!important;font-weight:700;min-height:46px;padding:10px 16px!important;font-size:1rem!important}
.btn[data-a="guide"]:hover{background:#1e40af!important;color:#fff!important}
.btn[data-a="rule"]{background:#334155!important;border-color:#1e293b!important;color:#fff!important;font-weight:700;min-height:46px;padding:10px 16px!important;font-size:1rem!important}
.btn[data-a="rule"]:hover{background:#1e293b!important;color:#fff!important}
/* רמקול לכל תשובה — מי שקורא בקושי בוחר באוזן (אותו תקן של history) */

/* ============================================================

   ------------------------------------------------------------
   התסריט הוא נתון, לא קוד שפזור במסכים: כל פריט אומר מה נכתב
   בכתוביות (subtitle), מה נעשה על המסך (action) וכמה זמן הצופה
   נשאר עם המסך הזה (duration, באלפיות שנייה).

   ההדגמה מפעילה את האפליקציה האמיתית — היא לוחצת על אותם
   כפתורים שהמשתמש לוחץ עליהם. אין כאן מסך מזויף ואין תוכן
   שנכתב במיוחד להדגמה, ולכן היא גם לא יכולה להראות משהו
   שהאפליקציה לא באמת עושה.

   בלי ?demo=1 שום שורה כאן אינה רצה: המשתנים מוגדרים ונשארים
   בלי שימוש, לא נרשם אף מאזין אירועים, ולא נוסף דבר למסך.
   ============================================================ */
var DEMO_ON=/(^|[?&])demo=1(&|$)/.test(location.search||"");

/* בוחר אפשרות לפי נכונותה. התסריט לא מקודד תשובה: הוא שואל את
   השאלה שעל המסך עכשיו, ולכן הוא עובד גם כשההגרלה שינתה אותה. */
function demoAns(right){
  var q=(typeof P!=="undefined"&&P.ses)?P.ses[P.qi]:null;
  if(!q||!q.options)return false;
  for(var i=0;i<q.options.length;i++){
    var o=q.options[i];
    if((o===q.answer)===!!right)return demoTap('[data-a="ans"][data-o="'+o+'"]');
  }
  return false;
}


var DEMO_SCRIPT=[
  {subtitle:"גאוגרפיה ליסודי — שיעורי גאוגרפיה, צעד אחר צעד, בלי טיימר ובלי לחץ.",
   action:function(){if(typeof view!=="undefined"){view="onboarding";P.selPet=null;render();window.scrollTo(0,0)}}, duration:4400},

  /* בלי בורר: הכרטיס מציג את לימור בלי לשנות את התזמון. */
  {subtitle:"לימור היא החברה ללמידה. היא מלווה את הלומד לאורך כל הסבב, מעודדת ומסבירה.",
   action:function(){var c=document.querySelector('.ob-hero .card');if(c)c.scrollIntoView({behavior:'smooth',block:'center'});return true}, duration:4200},

  {subtitle:"אפשר לתת לה שם משלכם, או לקחת את השם המוצע.",
   action:function(){demoTap('[data-a="takesugg"]')}, duration:3600},

  {subtitle:"ומתחילים.",
   action:function(){demoTap('[data-a="startpet"]')}, duration:3400},

   action:function(){demoTap('[data-a="listen"]')}, duration:4600},

  {subtitle:"רמז ראשון מכוון, ולא פותר.",
   action:function(){demoTap('[data-a="hint"]')}, duration:4200},

   action:function(){demoTap('[data-a="hint"]')}, duration:4800},

  {subtitle:"תשובה נכונה — קונפטי, נקודות, והשאלה הבאה מגיעה מעצמה.",
   action:function(){demoAns(true)}, duration:4800},

  {subtitle:"וכשטועים: במצב הרגוע, שהוא ברירת המחדל, התשובה וההסבר מגיעים מיד — בלי אדום ובלי ניסיון שני שנכשל.",
   action:function(){demoAns(false)}, duration:6000},

  {subtitle:"לשאלה הבאה.",
   action:function(){demoTap('[data-a="next"]')}, duration:3400},

  {subtitle:"שש רמות. אפשר להשאיר על ״אוטומטי״, ואפשר לקבוע רמה ביד.",
   action:function(){demoTap('[data-a="lvl"][data-l="4"]')}, duration:4400},

  {subtitle:"מסך ההתקדמות: מה כבר נלמד, ובאיזו פעולה עוד קשה.",
   action:function(){demoTap('[data-a="go"][data-v="progress"]')}, duration:4800},

  {subtitle:"השיאים והמדבקות שנאספו — מסך שנעים להראות בבית.",
   action:function(){demoTap('[data-a="go"][data-v="records"]')}, duration:4400},

  {subtitle:"הגדרות: שפת ממשק, בחירת קול, מצב רגוע למי שהאנימציות מציפות אותו, ומצב מורה.",
   action:function(){demoTap('[data-a="go"][data-v="settings"]')}, duration:5200},

  {subtitle:"וחזרה לתרגול. בלי פרסומות, וכל ההתקדמות נשמרת במכשיר הזה בלבד.",
   action:function(){demoTap('[data-a="go"][data-v="practice"]')}, duration:4600}
];

/* --- מנוע ההדגמה. הקוד כאן זהה בכל האפליקציות; רק DEMO_SCRIPT משתנה. --- */
var DEMO={on:false,i:0,timer:null,extra:[],bar:null,txt:null,step:null,fill:null,btn:null};

/* עוזרים לתסריט. כולם מחזירים false כשהאיבר אינו על המסך, כדי
   שצעד שלא מצא את מה שחיפש ידלג ולא יפיל את ההדגמה כולה. */
function demoEl(s){return typeof s==="string"?document.querySelector(s):s}
function demoShow(s){
  var e=demoEl(s); if(!e)return false;
  try{e.scrollIntoView({behavior:"smooth",block:"center"})}catch(err){try{e.scrollIntoView()}catch(err2){}}
  return true;
}
/* מדגיש את האיבר, ורק אז לוחץ — צופה שלא ראה לאן נלחץ לא הבין
   מה קרה. לכן אין צעד קצר מ-1200 אלפיות בתסריטים. */
function demoTap(s){
  var e=demoEl(s); if(!e||e.disabled)return false;
  demoShow(e);
  e.classList.add("demo-tap");
  DEMO.extra.push(setTimeout(function(){
    e.classList.remove("demo-tap");
    /* המסך מצטייר מחדש כל הזמן. אם האיבר שסומן כבר אינו במסמך,
       מחפשים אותו שוב לפי אותו בורר — לחיצה על איבר מת אינה
       עושה דבר, וזה בדיוק צעד שנראה כאילו נתקע. */
    var live=(typeof s==="string"&&!document.contains(e))?demoEl(s):e;
    if(DEMO.on&&live&&!live.disabled&&document.contains(live))try{live.click()}catch(err){}
  },430));
  return true;
}
function demoClick(s){
  var e=demoEl(s); if(!e||e.disabled)return false;
  try{e.click()}catch(err){return false}
  return true;
}
/* הקלדה אות אחר אות, עם אירוע input אמיתי — שדה חיפוש שמאזין
   ל-input לא היה מגיב להשמה ישירה ל-value. */
function demoType(s,text){
  var e=demoEl(s); if(!e)return false;
  demoShow(e); try{e.focus()}catch(err){}
  e.value=""; var i=0;
  var t=setInterval(function(){
    if(!DEMO.on||!e.parentNode){clearInterval(t);return}
    e.value=String(text).slice(0,++i);
    e.dispatchEvent(new Event("input",{bubbles:true}));
    if(i>=String(text).length)clearInterval(t);
  },85);
  DEMO.extra.push(t);
  return true;
}
function demoQuiet(){
  try{if(window.speechSynthesis)speechSynthesis.cancel()}catch(e){}
  try{if(typeof stopSpeak==="function")stopSpeak()}catch(e){}
}

function demoMountUI(){
  var st=document.createElement("style");
  st.id="demo-style"; st.textContent=DEMO_CSS;
  (document.head||document.documentElement).appendChild(st);

  var b=document.createElement("button");
  b.id="demo-start"; b.type="button";
  b.innerHTML='<span aria-hidden="true">▶</span><span>התחל הדגמה</span>';
  b.addEventListener("click",demoStart);
  document.body.appendChild(b);

  var bar=document.createElement("div");
  bar.id="demo-bar"; bar.hidden=true;
  bar.setAttribute("role","status");
  bar.setAttribute("aria-live","polite");
  bar.innerHTML='<div id="demo-sub"><p id="demo-txt"></p>'+
    '<div id="demo-meta"><span id="demo-step"></span>'+
    '<button id="demo-exit" type="button">יציאה · ESC</button></div>'+
    '<div id="demo-prog"><i></i></div></div>';
  document.body.appendChild(bar);

  DEMO.btn=b; DEMO.bar=bar;
  DEMO.txt=document.getElementById("demo-txt");
  DEMO.step=document.getElementById("demo-step");
  DEMO.fill=bar.querySelector("#demo-prog i");
  document.getElementById("demo-exit").addEventListener("click",function(){demoStop()});
  document.addEventListener("keydown",demoKey,true);
}

/* ESC יוצא. הקשבה בשלב הלכידה, כדי שמסך שכבר מטפל ב-Escape
   לא יבלע את המקש לפני שההדגמה ראתה אותו. */
function demoKey(e){
  if(!DEMO.on)return;
  if(e.key==="Escape"||e.keyCode===27){
    e.preventDefault(); e.stopPropagation();
    demoStop();
  }
}

function demoStart(){
  if(DEMO.on)return;
  DEMO.on=true; DEMO.i=0;
  DEMO.btn.hidden=true; DEMO.bar.hidden=false;
  document.documentElement.classList.add("demo-running");
  demoNext();
}

function demoNext(){
  if(!DEMO.on)return;
  if(DEMO.i>=DEMO_SCRIPT.length){demoStop();return}
  var it=DEMO_SCRIPT[DEMO.i++]||{};
  var d=Math.max(600,it.duration||3000);
  DEMO.txt.textContent=it.subtitle||"";
  DEMO.step.textContent=DEMO.i+" / "+DEMO_SCRIPT.length;
  DEMO.fill.style.transition="none"; DEMO.fill.style.width="0";
  void DEMO.fill.offsetWidth;
  DEMO.fill.style.transition="width "+d+"ms linear";
  DEMO.fill.style.width="100%";
  if(typeof it.action==="function"){
    try{it.action()}catch(err){if(window.console)console.warn("demo:",err)}
  }
  DEMO.timer=setTimeout(demoNext,d);
}

function demoStop(){
  DEMO.on=false;
  if(DEMO.timer){clearTimeout(DEMO.timer);DEMO.timer=null}
  DEMO.extra.forEach(function(t){clearTimeout(t);clearInterval(t)});
  DEMO.extra=[];
  var m=document.querySelectorAll(".demo-tap"),i;
  for(i=0;i<m.length;i++)m[i].classList.remove("demo-tap");
  if(DEMO.bar)DEMO.bar.hidden=true;
  if(DEMO.btn)DEMO.btn.hidden=false;
  document.documentElement.classList.remove("demo-running");
  demoQuiet();
}

/* שער התנאים הוא חלון מודאלי מעל הכול. כפתור הדגמה מתחתיו היה
   מפעיל אפליקציה שאי אפשר לראות, ולכן ממתינים שייסגר. */
function demoMount(){
  if(document.querySelector(".lg-wrap")){setTimeout(demoMount,500);return}
  if(!document.getElementById("demo-start"))demoMountUI();
}

if(DEMO_ON){
  if(document.readyState==="complete")setTimeout(demoMount,0);
  else window.addEventListener("load",function(){setTimeout(demoMount,0)});
}

["maps",1,{"he":["דנה פתחה מפה של העיר שלה. מהי מפה?","ציור של מקום כפי שהוא נראה מלמעלה","ספר סיפורים על מקומות רחוקים בעולם","תמונה שצולמה מתוך בית, דרך החלון","רשימה של שמות רחובות בלבד, בלי ציור","חשבו: איך נראית העיר לציפור שעפה מעליה? מה המפה מנסה להראות לנו?","על המפה רואים רחובות וגני משחקים כאילו אנחנו מסתכלים עליהם מהשמיים.","מפה היא ציור מיוחד של מקום כפי שהוא נראה מלמעלה. בעזרתה מוצאים דרכים ומקומות."],"en":["Dana opened a map of her city. What is a map?","A drawing of a place as it looks from above","A storybook about faraway places in the world","A photo taken inside a house, out the window","Just a list of street names, with no drawing","Think: how does the city look to a bird flying over it? What is the map trying to show us?","On the map we see streets and playgrounds as if we are looking at them from the sky.","A map is a special drawing of a place as it looks from above. It helps us find ways and places."],"ru":["Дана открыла карту своего города. Что такое карта?","Рисунок места так, как оно выглядит сверху","Книга рассказов о далёких местах мира","Фотография, сделанная изнутри дома, из окна","Только список названий улиц, без рисунка","Подумайте: как город выглядит для птицы, летящей над ним? Что карта пытается нам показать?","На карте мы видим улицы и детские площадки так, словно смотрим на них с неба.","Карта: это особый рисунок места так, как оно выглядит сверху. С её помощью находят дороги и места."],"ar":["فتحت دانا خريطة لمدينتها. ما الخريطة؟","رسم لمكان كما يبدو من الأعلى","كتاب قصص عن أماكن بعيدة جدًا","صورة التقطت من داخل البيت","قائمة بأسماء الشوارع فقط","فكروا: كيف تبدو المدينة لطائر يحلق فوقها؟ ماذا تحاول الخريطة أن تريانا؟","على الخريطة نرى الشوارع وساحات الألعاب كأننا ننظر إليها من السماء.","الخريطة هي رسم خاص لمكان كما يبدو من الأعلى. بمساعدتها نجد الطرق والأماكن."]}],

["maps",1,{"he":["מה מראה לנו המצפן שעל המפה?","את כיווני השמיים: צפון, דרום, מזרח ומערב","את מזג האוויר בעיר: שמש, גשם, רוח ושלג","את מספר התושבים בעיר ובשכונות שלה","את שעות הפתיחה של החנויות והקניונים","בלי כיוונים אי אפשר לדעת מה ימין ומה שמאל על מפה. מה נותן לנו את הכיוונים?","האות נ' מסמנת צפון. איזו קבוצת מילים מדברת על כיוונים כמו צפון?","המצפן על המפה מראה את כיווני השמיים. בעזרתו אנחנו יודעים באיזה צד נמצא כל מקום."],"en":["What does the compass on the map show us?","The directions: north, south, east and west","The weather in the city: sun, rain and wind","How many people live in the city and its areas","The opening hours of the shops and malls","Without directions we cannot tell right from left on a map. What gives us the directions?","The letter N marks north. Which group of words talks about directions like north?","The compass on the map shows the directions. With it we know on which side every place is."],"ru":["Что показывает нам компас на карте?","Стороны света: север, юг, восток и запад","Погоду в городе: солнце, дождь, ветер и снег","Сколько жителей в городе и его районах","Часы работы магазинов и торговых центров","Без направлений нельзя понять, где право и где лево на карте. Что даёт нам направления?","Буква С обозначает север. Какая группа слов говорит о направлениях вроде севера?","Компас на карте показывает стороны света. С ним мы знаем, с какой стороны находится каждое место."],"ar":["ماذا تريانا البوصلة على الخريطة؟","الاتجاهات: الشمال والجنوب والشرق والغرب","حالة الطقس في المدينة: شمس ومطر ورياح وثلج","عدد سكان المدينة وأحيائها كلها","ساعات فتح المحلات والمراكز التجارية","من دون اتجاهات لا نعرف اليمين من اليسار على الخريطة. ما الذي يعطينا الاتجاهات؟","حرف ن يدل على الشمال. أي مجموعة كلمات تتحدث عن اتجاهات مثل الشمال؟","البوصلة على الخريطة تُظهر الاتجاهات. بمساعدتها نعرف في أي جهة يقع كل مكان."]}],
["maps",1,{"he":["מה מספרת לנו הכותרת של המפה?","מה המפה מראה ואיזה מקום היא מתארת","מי צייר את המפה ובאיזו שנה בדיוק","כמה עמודים יש בספר המפות כולו","מה מזג האוויר היום במקום שעל המפה","לפני שקוראים ספר מסתכלים על השם שלו. איפה אותו רעיון במפה?","כותרת כמו מפת ירושלים אומרת מיד איזו עיר נראה על הדף.","הכותרת אומרת בקצרה מה רואים במפה: איזה מקום ואיזה סוג מידע."],"en":["What does the title of the map tell us?","What the map shows and which place it describes","Who drew the map and in exactly which year","How many pages there are in the whole atlas","What the weather is like today in that place","Before reading a book we look at its name. Where is the same idea on a map?","A title like Map of Jerusalem says right away which city we will see on the page.","The title says briefly what the map shows: which place and which kind of information."],"ru":["Что рассказывает нам заголовок карты?","Что показывает карта и какое место она описывает","Кто нарисовал карту и в каком именно году","Сколько всего страниц в книге с картами","Какая сегодня погода в том месте на карте","Перед чтением книги мы смотрим на её название. Где та же идея на карте?","Заголовок вроде Карта Иерусалима сразу говорит, какой город мы увидим на странице.","Заголовок кратко говорит, что показывает карта: какое место и какой вид сведений."],"ar":["ماذا يخبرنا عنوان الخريطة؟","ماذا تعرض الخريطة وأي مكان تصف","من رسم الخريطة وفي أي سنة بالضبط","كم صفحة في كتاب الخرائط كله","ما حالة الطقس اليوم في ذلك المكان","قبل قراءة كتاب ننظر إلى اسمه. أين الفكرة نفسها في الخريطة؟","عنوان مثل خريطة القدس يقول فورًا أي مدينة سنرى على الصفحة.","العنوان يقول باختصار ماذا تعرض الخريطة: أي مكان وأي نوع من المعلومات."]}],
["maps",1,{"he":["על המפה כתוב: סנטימטר אחד במפה שווה לקילומטר אחד במציאות. איזה חלק של המפה אומר לנו את זה?","קנה מידה","מקרא","מסגרת המפה","שם העיר","איזה חלק מחבר בין גודל קטן על הנייר לבין גודל גדול במציאות?","חשבו על סרגל: איזה חלק במפה עובד בערך כמו סרגל?","קנה המידה מתרגם מרחקים: הוא אומר כמה במציאות שווה כל סנטימטר על הנייר."],"en":["The map says: one centimeter on the map equals one kilometer in reality. Which part of the map tells us that?","The scale","The legend","The map frame","The city name","Which part connects a small size on paper with a big size in reality?","Think about a ruler: which part of the map works a bit like a ruler?","The scale translates distances: it says how much in reality every centimeter on the paper is worth."],"ru":["На карте написано: один сантиметр на карте равен одному километру в реальности. Какая часть карты говорит нам это?","Масштаб","Легенда","Рамка карты","Название города","Какая часть связывает маленький размер на бумаге с большим размером в реальности?","Подумайте о линейке: какая часть карты работает примерно как линейка?","Масштаб переводит расстояния: он говорит, сколько в реальности стоит каждый сантиметр на бумаге."],"ar":["مكتوب على الخريطة: سنتيمتر واحد على الخريطة يساوي كيلومترًا واحدًا في الواقع. أي جزء من الخريطة يخبرنا بذلك؟","مقياس الرسم","مفتاح الخريطة","إطار الخريطة","اسم المدينة","أي جزء يربط بين حجم صغير على الورق وحجم كبير في الواقع؟","فكروا في المسطرة: أي جزء من الخريطة يعمل تقريبًا مثل المسطرة؟","مقياس الرسم يترجم المسافات: يقول كم يساوي في الواقع كل سنتيمتر على الورق."]}],
["maps",1,{"he":["ברוב המפות, לאיזה צד של המפה מסמן הכיוון צפון?","לראש המפה, למעלה","לתחתית המפה, למטה","תמיד לצד שמאל","תמיד לצד ימין","זכרו את הכלל שמורים מלמדים: למעלה במפה זה איזה כיוון?","האות נ' על המצפן מצביעה לצד מסוים של הדף. בדקו לאיזה צד.","מוסכמה של מפות: צפון נמצא בראש המפה. לכן מסתכלים קודם על המצפן ואז קוראים את המפה."],"en":["On most maps, which side of the map does north point to?","The top of the map, upward","The bottom of the map, down","Always to the left side","Always to the right side","Remember the rule teachers teach: up on a map is which direction?","The letter N on the compass points to a certain side of the page. Check which side.","A map convention: north is at the top of the map. So we look at the compass first and then read the map."],"ru":["На большинстве карт на какую сторону карты указывает север?","На верх карты, вверх","На низ карты, вниз","Всегда к левому краю","Всегда к правому краю","Вспомните правило, которому учат учителя: вверх на карте это какое направление?","Буква С на компасе указывает на определённую сторону страницы. Проверьте на какую.","Соглашение карт: север находится вверху карты. Поэтому сначала смотрим на компас, а потом читаем карту."],"ar":["في معظم الخرائط، إلى أي جهة من الخريطة يشير اتجاه الشمال؟","إلى رأس الخريطة، إلى الأعلى","إلى أسفل الخريطة، إلى الأسفل","دائمًا إلى جهة اليسار","دائمًا إلى جهة اليمين","تذكروا القاعدة التي يعلمها المعلمون: الأعلى في الخريطة هو أي اتجاه؟","حرف ن على البوصلة يشير إلى جهة معينة من الصفحة. تحققوا إلى أي جهة.","قاعدة متفق عليها في الخرائط: الشمال في رأس الخريطة. لذلك ننظر أولًا إلى البوصلة ثم نقرأ الخريطة."]}],
["maps",1,{"he":["יוסי רואה על המפה סימן קטן בצורת עץ. איך הוא ידע מה הסימן אומר?","יסתכל במקרא שעל המפה","ינחש לפי הצבע האהוב עליו","ישאל את הכותרת של המפה","יספור כמה עצים יש על המפה","במפה יש מילון קטן שמסביר סימנים. איפה הוא נמצא?","אותו חלק שמראה סימן ליד הסבר עונה בדיוק על השאלה של יוסי.","את הסימנים על המפה מבינים בעזרת המקרא: מוצאים בו את הסימן וקוראים את ההסבר."],"en":["Yossi sees a small tree-shaped symbol on the map. How will he know what the symbol says?","He will look at the map legend","He will guess by his favorite color","He will ask the map's title","He will count how many trees are on the map","The map has a small dictionary that explains symbols. Where is it?","The same part that shows a symbol next to an explanation answers Yossi's question exactly.","Map symbols are understood with the legend: find the symbol in it and read the explanation."],"ru":["Йосси видит на карте маленький знак в виде дерева. Как он узнает, что знак говорит?","Посмотрит в легенду карты","Угадает по любимому цвету","Спросит у заголовка карты","Посчитает, сколько деревьев на карте","У карты есть маленький словарь, объясняющий знаки. Где он находится?","Та самая часть, что показывает знак рядом с объяснением, отвечает ровно на вопрос Йосси.","Знаки на карте понимают с помощью легенды: находят в ней знак и читают объяснение."],"ar":["يرى يوسي علامة صغيرة على شكل شجرة على الخريطة. كيف سيعرف ماذا تقول العلامة؟","سينظر في مفتاح الخريطة","سيخمن حسب لونه المفضل","سيسأل عنوان الخريطة","سيعد كم شجرة على الخريطة","في الخريطة قاموس صغير يشرح العلامات. أين يوجد؟","الجزء نفسه الذي يعرض علامة بجانب شرح يجيب تمامًا عن سؤال يوسي.","تُفهم علامات الخريطة بمساعدة مفتاحها: نجد فيه العلامة ونقرأ الشرح."]}],
["maps",1,{"he":["על שושנת הרוחות כתוב צפון למעלה. איזה כיוון נמצא בדיוק מולו, למטה?","דרום","מזרח","מערב","צפון־מערב","דמיינו קו ישר מלמעלה עד למטה בשושנת הרוחות. מה כתוב בקצה השני?","יש ארבעה כיוונים ראשיים. כל כיוון עומד מול כיוון אחד אחר.","דרום נמצא מול צפון. מזרח נמצא מול מערב."],"en":["On the compass rose, north is at the top. Which direction is exactly opposite it, at the bottom?","South","East","West","Northwest","Imagine a straight line from the top to the bottom of the compass rose. What is written at the other end?","There are 4 main directions. Each direction faces one other direction.","South is opposite north. East is opposite west."],"ru":["На розе ветров север находится наверху. Какое направление точно напротив него, внизу?","Юг","Восток","Запад","Северо-запад","Представьте прямую линию сверху вниз на розе ветров. Что написано на другом конце?","Есть 4 главных направления. Каждое направление смотрит на одно другое.","Юг находится напротив севера. Восток находится напротив запада."],"ar":["على وردة الرياح الشمال في الأعلى. أي اتجاه يقع مقابله تمامًا، في الأسفل؟","الجنوب","الشرق","الغرب","الشمال الغربي","تخيلوا خطًا مستقيمًا من أعلى وردة الرياح إلى أسفلها. ماذا مكتوب في الطرف الآخر؟","هناك 4 اتجاهات رئيسية. كل اتجاه يقابل اتجاهًا واحدًا آخر.","الجنوب يقع مقابل الشمال. الشرق يقع مقابل الغرب."]}],
["maps",1,{"he":["ברוב המפות, באיזה צבע מסמנים ים, אגם ונהר?","כחול","ירוק","חום","צהוב","חשבו על צבע המים בבריכה או בים ביום שמש.","זה גם הצבע של השמיים ביום בהיר.","במפות מסמנים מים בצבע כחול. כך קל למצוא ים, אגם ונהר."],"en":["On most maps, what color shows a sea, a lake and a river?","Blue","Green","Brown","Yellow","Think about the color of the water in a pool or the sea on a sunny day.","It is also the color of the sky on a clear day.","Maps show water in blue. This makes it easy to find a sea, a lake and a river."],"ru":["На большинстве карт каким цветом обозначают море, озеро и реку?","Синим","Зелёным","Коричневым","Жёлтым","Подумайте о цвете воды в бассейне или в море в солнечный день.","Это также цвет неба в ясный день.","На картах воду обозначают синим цветом. Так легко найти море, озеро и реку."],"ar":["في معظم الخرائط، بأي لون نرسم البحر والبحيرة والنهر؟","الأزرق","الأخضر","البني","الأصفر","فكروا في لون الماء في البركة أو في البحر في يوم مشمس.","هذا أيضًا لون السماء في يوم صافٍ.","في الخرائط نرسم الماء باللون الأزرق. هكذا يسهل إيجاد البحر والبحيرة والنهر."]}],
["maps",1,{"he":["בכיתה יש כדור שמסתובב, ועליו ציור של כל העולם. איך קוראים לו?","גלובוס","אטלס","מצפן","מקרא","הוא עגול, בדיוק כמו כדור הארץ, אבל קטן מאוד.","זה דגם של העולם, ואפשר לסובב אותו ביד.","גלובוס הוא דגם קטן ועגול של כדור הארץ. הוא מראה את כל היבשות והימים."],"en":["In class there is a ball that spins, with a drawing of the whole world on it. What is it called?","A globe","An atlas","A compass","A legend","It is round, just like the Earth, but very small.","It is a model of the world, and you can spin it by hand.","A globe is a small round model of the Earth. It shows all the continents and seas."],"ru":["В классе есть шар, который крутится, а на нём нарисован весь мир. Как он называется?","Глобус","Атлас","Компас","Легенда карты","Он круглый, как Земля, но очень маленький.","Это модель мира, и её можно крутить рукой.","Глобус: это маленькая круглая модель Земли. Он показывает все материки и моря."],"ar":["في الصف كرة تدور، وعليها رسم للعالم كله. ما اسمها؟","مجسم الكرة الأرضية","أطلس","بوصلة","مفتاح الخريطة","إنها مستديرة تمامًا مثل الأرض، لكنها صغيرة جدًا.","إنها نموذج للعالم، ويمكن تدويرها باليد.","مجسم الكرة الأرضية نموذج صغير ومستدير للأرض. يعرض كل القارات والبحار."]}],
["maps",1,{"he":["בבוקר השמש עולה. מאיזה כיוון היא עולה?","מהמזרח","מהמערב","מהצפון","מהדרום","חשבו על הצד שבו השמש שוקעת בערב. היא עולה בצד ההפוך.","בישראל השמש שוקעת מעל הים התיכון.","השמש עולה במזרח ושוקעת במערב. כך אפשר לדעת כיוונים גם בלי מצפן."],"en":["In the morning the sun rises. From which direction does it rise?","From the east","From the west","From the north","From the south","Think about the side where the sun sets in the evening. It rises on the opposite side.","In Israel the sun sets over the Mediterranean Sea.","The sun rises in the east and sets in the west. This way you can know directions even without a compass."],"ru":["Утром солнце встаёт. С какой стороны оно встаёт?","С востока","С запада","С севера","С юга","Подумайте, с какой стороны солнце садится вечером. Встаёт оно с противоположной стороны.","В Израиле солнце садится над Средиземным морем.","Солнце встаёт на востоке и садится на западе. Так можно узнать стороны света даже без компаса."],"ar":["في الصباح تشرق الشمس. من أي اتجاه تشرق؟","من الشرق","من الغرب","من الشمال","من الجنوب","فكروا في الجهة التي تغرب فيها الشمس في المساء. هي تشرق في الجهة المعاكسة.","في إسرائيل تغرب الشمس فوق البحر المتوسط.","الشمس تشرق في الشرق وتغرب في الغرب. هكذا يمكن معرفة الاتجاهات حتى بدون بوصلة."]}],
["maps",1,{"he":["בספרייה יש ספר גדול, ובתוכו הרבה מפות של ארצות ושל העולם. איך קוראים לספר כזה?","אטלס","מילון","יומן","גלובוס","זה לא ספר של מילים או של סיפורים. כל עמוד בו מראה מקום אחר.","השם שלו בא מדמות מסיפור יווני עתיק, שהחזיקה את העולם.","אטלס הוא ספר של מפות. בעזרתו מוצאים ארצות, ערים, הרים וימים."],"en":["In the library there is a big book with many maps of countries and of the world. What is such a book called?","An atlas","A dictionary","A diary","A globe","It is not a book of words or of stories. Each page shows a different place.","Its name comes from a figure in an old Greek story who held up the world.","An atlas is a book of maps. With it we find countries, cities, mountains and seas."],"ru":["В библиотеке есть большая книга, а в ней много карт стран и всего мира. Как называется такая книга?","Атлас","Словарь","Дневник","Глобус","Это не книга слов и не книга рассказов. Каждая страница показывает другое место.","Её название пришло от героя древнегреческой легенды, который держал мир.","Атлас: это книга карт. С его помощью находят страны, города, горы и моря."],"ar":["في المكتبة كتاب كبير، وفيه خرائط كثيرة للدول وللعالم. ما اسم هذا الكتاب؟","أطلس","قاموس","مذكرة يومية","مجسم الكرة الأرضية","ليس كتاب كلمات ولا كتاب قصص. كل صفحة فيه تعرض مكانًا آخر.","اسمه جاء من شخصية في قصة يونانية قديمة، كانت تحمل العالم.","الأطلس كتاب خرائط. بمساعدته نجد الدول والمدن والجبال والبحار."]}],
["maps",1,{"he":["עומר פותח בטלפון אפליקציה ורואה מפה של השכונה. איזו מפה זו?","מפה דיגיטלית","מפה מצוירת ביד","מפה מנייר מקופל","מפה בספר אטלס","איפה עומר רואה את המפה: על דף או על מסך?","במפה כזו אפשר להגדיל ולהקטין עם האצבעות.","מפה דיגיטלית מופיעה על מסך של טלפון או מחשב. אפשר להגדיל אותה ולחפש בה מקומות."],"en":["Omer opens an app on his phone and sees a map of the neighborhood. What kind of map is it?","A digital map","A hand-drawn map","A folded paper map","A map in an atlas","Where does Omer see the map: on paper or on a screen?","On this kind of map you can zoom in and out with your fingers.","A digital map appears on a phone or computer screen. You can zoom in and search for places on it."],"ru":["Омер открывает приложение в телефоне и видит карту района. Какая это карта?","Цифровая карта","Карта, нарисованная рукой","Сложенная бумажная карта","Карта в атласе","Где Омер видит карту: на бумаге или на экране?","На такой карте можно увеличивать и уменьшать пальцами.","Цифровая карта показана на экране телефона или компьютера. Её можно увеличить и искать на ней места."],"ar":["يفتح عومر تطبيقًا في الهاتف ويرى خريطة للحي. أي خريطة هذه؟","خريطة رقمية","خريطة مرسومة باليد","خريطة ورقية مطوية","خريطة في أطلس","أين يرى عومر الخريطة: على ورقة أم على شاشة؟","في خريطة كهذه يمكن التكبير والتصغير بالأصابع.","الخريطة الرقمية تظهر على شاشة هاتف أو حاسوب. يمكن تكبيرها والبحث فيها عن أماكن."]}],
["maps",2,{"he":["משפחה מתכננת נסיעה ברכב מחיפה לבאר שבע. איזו מפה תעזור לה ביותר?","מפת דרכים, שמראה כבישים בין ערים","מפת מזג אוויר, שמראה גשם ושמש בערים","מפת אוכלוסייה, שמראה כמה אנשים גרים","מפת אוצרות מפורסמים מתקופות עתיקות","חשבו מה המשפחה צריכה לדעת בדרך: אילו כבישים ואילו ערים. איזו מפה מראה את זה?","לכל שאלה יש מפה אחרת. שאלה של נסיעה ברכב צריכה מפה של נסיעות.","יש סוגים שונים של מפות. לנסיעה ברכב בוחרים מפת דרכים, כי היא מראה כבישים וערים."],"en":["A family is planning a car trip from Haifa to Be'er Sheva. Which map will help it most?","A road map, which shows roads between cities","A weather map, showing rain and sun in cities","A population map, showing how many people live","A map of famous treasures hidden long ago","Think about what the family needs to know on the way: which roads and which cities. Which map shows that?","Every question has a different map. A car-trip question needs a travel map.","There are different kinds of maps. For a car trip we choose a road map, because it shows roads and cities."],"ru":["Семья планирует поездку на машине из Хайфы в Беэр-Шеву. Какая карта поможет ей больше всего?","Дорожная карта, показывающая дороги между городами","Карта погоды, показывающая дождь и солнце в городах","Карта населения, показывающая, сколько где живёт людей","Карта знаменитых сокровищ, спрятанных давным-давно","Подумайте, что семье нужно знать в пути: какие дороги и какие города. Какая карта это показывает?","Для каждого вопроса своя карта. Вопросу о поездке на машине нужна карта поездок.","Есть разные виды карт. Для поездки на машине выбирают дорожную карту, потому что она показывает дороги и города."],"ar":["عائلة تخطط لرحلة بالسيارة من حيفا إلى بئر السبع. أي خريطة ستساعدها أكثر؟","خريطة طرق، تعرض الشوارع بين المدن","خريطة طقس، تعرض المطر في المدن","خريطة سكان، تعرض عدد الناس","خريطة كنوز مشهورة دُفنت منذ زمن بعيد","فكروا ماذا تحتاج العائلة أن تعرف في الطريق: أي شوارع وأي مدن. أي خريطة تعرض ذلك؟","لكل سؤال خريطة أخرى. سؤال عن رحلة بالسيارة يحتاج خريطة سفر.","هناك أنواع مختلفة من الخرائط. لرحلة بالسيارة نختار خريطة طرق، لأنها تعرض الشوارع والمدن."]}],
["maps",2,{"he":["בשיעור קיבלתם מפה שקוראים לה מפה פיזית. מה היא תראה בעיקר?","הרים, נחלים ומדבריות, את צורת פני השטח","גבולות בין מדינות בלבד, בלי שום דבר אחר","קניונים וחנויות, את המקומות לקניות בעיר","כבישים ומספרי בתים, את הדרך לכל בית","המילה פיזית מזכירה גוף וטבע. מה הטבע של הארץ: ההרים והעמקים או הגבולות?","חשבו על טיול בטבע: אילו דברים רואים בלי שבני אדם בנו אותם?","מפה פיזית מראה את פני השטח: הרים, עמקים, נחלים ומדבריות. מפה מדינית מראה גבולות וערים."],"en":["In class you got a map called a physical map. What will it mainly show?","Mountains, streams and deserts, the shape of the land","Only borders between countries, and nothing else","Malls and shops, the places for shopping in town","Roads and house numbers, the way to every house","The word physical reminds us of body and nature. What is the nature of the land: mountains and valleys, or borders?","Think about a hike in nature: which things do we see that people did not build?","A physical map shows the surface: mountains, valleys, streams and deserts. A political map shows borders and cities."],"ru":["На уроке вы получили карту под названием физическая карта. Что она в основном покажет?","Горы, ручьи и пустыни, форму поверхности земли","Только границы между странами, и больше ничего","Торговые центры и магазины, места для покупок","Дороги и номера домов, путь к каждому дому","Слово физическая напоминает тело и природу. Что является природой страны: горы и долины или границы?","Подумайте о походе на природу: какие вещи мы видим, что их не строили люди?","Физическая карта показывает поверхность: горы, долины, ручьи и пустыни. Политическая карта показывает границы и города."],"ar":["في الدرس حصلتم على خريطة تسمى خريطة طبيعية. ماذا ستعرض أساسًا؟","جبالًا ووديانًا وصحاري، شكل سطح الأرض","حدودًا بين الدول فقط، ولا شيء غيرها","مراكز تسوق ومحلات، أماكن الشراء","شوارع وأرقام بيوت، الطريق إلى كل بيت","كلمة طبيعية تذكرنا بالجسم والطبيعة. ما طبيعة الأرض: الجبال والوديان أم الحدود؟","فكروا في رحلة في الطبيعة: أي أشياء نراها لم يبنها الناس؟","الخريطة الطبيعية تعرض سطح الأرض: جبال ووديان ومجاري مياه وصحاري. الخريطة السياسية تعرض الحدود والمدن."]}],
["maps",2,{"he":["איזו מפה מראה את הגבולות בין המדינות ואת הערים הגדולות?","מפה מדינית","מפה פיזית","מפת שבילים לטיולים","מפת כוכבים","חשבו: גבול בין מדינות הוא דבר של הטבע או דבר שבני אדם החליטו עליו?","לכל מפה יש שם שמתאים לתוכן שלה. איזה שם מתאים למפה שעוסקת במדינות?","המפה המדינית מראה גבולות בין מדינות ואת הערים. המפה הפיזית מראה הרים ונחלים."],"en":["Which map shows the borders between countries and the big cities?","A political map","A physical map","A hiking trail map","A star map","Think: is a border between countries something from nature, or something people decided on?","Every map has a name that fits its content. Which name fits a map about states?","The political map shows borders between countries and the cities. The physical map shows mountains and streams."],"ru":["Какая карта показывает границы между странами и большие города?","Политическая карта","Физическая карта","Карта туристических троп","Карта звёзд","Подумайте: граница между странами это что-то от природы или что-то, о чём решили люди?","У каждой карты есть имя, подходящее её содержанию. Какое имя подходит карте о государствах?","Политическая карта показывает границы между странами и города. Физическая карта показывает горы и ручьи."],"ar":["أي خريطة تعرض الحدود بين الدول والمدن الكبيرة؟","خريطة سياسية","خريطة طبيعية","خريطة مسارات للرحلات","خريطة نجوم","فكروا: الحدود بين الدول شيء من الطبيعة أم شيء قرره الناس؟","لكل خريطة اسم يناسب محتواها. أي اسم يناسب خريطة عن الدول؟","الخريطة السياسية تعرض الحدود بين الدول والمدن. الخريطة الطبيعية تعرض الجبال ومجاري المياه."]}],
