["jeru",3,{"he":["בירושלים יש כלל: גם בניין חדש צריך להיות מצופה באבן. מה המטרה של הכלל?","לשמור על המראה המיוחד והאחיד של העיר","כדי שהבניינים יהיו זולים יותר, כי אבן מקומית עולה פחות מבטון","כדי שלא ירד שלג על הגגות","כדי שאפשר יהיה לבנות מהר יותר","חשבו איך העיר נראית מרחוק כשכל הבתים באותו צבע.","הכלל קשור ליופי ולהיסטוריה, ולא לכסף או לזמן.","הכלל נקבע לפני יותר מ־100 שנה. בזכותו גם השכונות החדשות דומות לעיר העתיקה, וירושלים נראית כמו עיר אחת."],"en":["Jerusalem has a rule: even a new building must be covered with stone. What is the goal of this rule?","To keep the special, uniform look of the city","So that buildings will be cheaper, because local stone costs less than concrete","So that snow will not fall on the roofs","So that building can be done faster","Think about how the city looks from far away when all the houses are the same color.","The rule is about beauty and history, not about money or time.","The rule was set more than 100 years ago. Thanks to it, the new neighborhoods also look like the Old City, and Jerusalem looks like one city."],"ru":["В Иерусалиме есть правило: даже новое здание должно быть облицовано камнем. Какова цель этого правила?","Сохранить особый облик города","Чтобы здания стоили намного дешевле, потому что местный камень стоит меньше бетона","Чтобы на крыши зимой не падал снег","Чтобы строить дома гораздо быстрее","Подумайте, как выглядит город издалека, когда все дома одного цвета.","Правило связано с красотой и историей, а не с деньгами или временем.","Это правило ввели более 100 лет назад. Благодаря ему новые кварталы похожи на Старый город, и Иерусалим выглядит как один город."],"ar":["في القدس قاعدة: حتى المبنى الجديد يجب أن يُكسى بالحجر. ما هدف هذه القاعدة؟","الحفاظ على المظهر الخاص والموحد للمدينة","لكي تكون المباني أرخص، لأن الحجر المحلي أقل ثمنًا من الباطون","لكي لا يتساقط الثلج على الأسطح","لكي يكون البناء أسرع","فكروا كيف تبدو المدينة من بعيد عندما تكون كل البيوت بلون واحد.","القاعدة مرتبطة بالجمال والتاريخ، وليس بالمال أو الوقت.","وُضعت القاعدة قبل أكثر من 100 سنة. بفضلها تشبه الأحياء الجديدة البلدة القديمة أيضًا، وتبدو القدس كمدينة واحدة."]}],
["jeru",3,{"he":["בפסח, בחג הפסחא ובחודש הרמדאן מגיעים לירושלים הרבה מאוד מבקרים. למה דווקא בזמנים האלה?","כי אלה חגים של שלוש הדתות","כי בזמנים האלה הכי חם וכיף לשחות","כי אז פותחים בעיר את כל הקניונים","כי אז יורד בעיר הכי הרבה שלג","בדקו לאיזו דת שייך כל אחד מהזמנים שבשאלה.","חשבו על המקומות בעיר שמושכים אנשים מאמינים.","פסח הוא חג יהודי, פסחא חג נוצרי ורמדאן חודש קדוש למוסלמים. בזמנים האלה מאמינים רבים באים להתפלל במקומות הקדושים להם בירושלים."],"en":["At Passover, at Easter and during the month of Ramadan, very many visitors come to Jerusalem. Why exactly at these times?","Because these are holidays of the three religions","Because at these times it is hottest and best for swimming","Because then all the malls in the city open","Because then the most snow falls in the city","Check which religion each of the times in the question belongs to.","Think about the places in the city that attract believers.","Passover is a Jewish holiday, Easter is a Christian holiday and Ramadan is a holy month for Muslims. At these times many believers come to pray at their holy places in Jerusalem."],"ru":["На Песах, на Пасху и в месяц Рамадан в Иерусалим приезжает очень много гостей. Почему именно в это время?","Это праздники трёх религий","В это время жарче всего и лучше всего купаться","Тогда в городе открываются все торговые центры","Тогда в городе выпадает больше всего снега","Проверьте, к какой религии относится каждое время из вопроса.","Подумайте о местах в городе, которые притягивают верующих.","Песах это еврейский праздник, Пасха христианский, а Рамадан святой месяц для мусульман. В это время многие верующие приезжают молиться у своих святых мест в Иерусалиме."],"ar":["في عيد الفصح اليهودي، وعيد الفصح المسيحي وشهر رمضان، يأتي إلى القدس زوار كثيرون جدًا. لماذا في هذه الأوقات تحديدًا؟","لأنها أعياد الديانات الثلاث","لأن الجو في هذه الأوقات هو الأحر والأجمل للسباحة","لأنه حينها تُفتح كل المراكز التجارية في المدينة","لأنه حينها يتساقط أكثر ثلج في المدينة","تحققوا لأي ديانة ينتمي كل وقت من الأوقات في السؤال.","فكروا في الأماكن في المدينة التي تجذب المؤمنين.","الفصح اليهودي عيد يهودي، وعيد الفصح عيد مسيحي، ورمضان شهر مقدس للمسلمين. في هذه الأوقات يأتي مؤمنون كثيرون للصلاة في أماكنهم المقدسة في القدس."]}],
["jeru",3,{"he":["הכבישים הישנים שעולים לירושלים מתפתלים הרבה, ולא עוברים בקו ישר. למה?","כי קשה לנסוע בקו ישר במעלה הר תלול","כי רצו שהנסיעה תהיה ארוכה ומשעממת","כי בקו ישר יש יותר מדי ים","כי מכוניות לא יכולות לנסוע ישר","דמיינו שביל שעולה על הר. האם הוא עולה ישר לפסגה?","דרך ארוכה ומפותלת עולה לאט יותר בכל מטר.","ירושלים בהרים, והשיפוע בדרך אליה תלול. לכן הכבישים מתפתלים: כך העלייה מתונה יותר ובטוחה יותר."],"en":["The old roads that climb to Jerusalem wind a lot and do not go in a straight line. Why?","Because it is hard to drive straight up a steep hill","Because they wanted the drive to be long and boring","Because a straight line would go through too much sea","Because cars cannot drive straight","Imagine a path that goes up a mountain. Does it go right to the top?","A long, winding road rises more slowly with each meter.","Jerusalem is in the hills, and the slope on the way there is steep. So the roads wind: this way the climb is gentler and safer."],"ru":["Старые дороги, ведущие в Иерусалим, сильно петляют, а не идут прямо. Почему?","Потому что трудно ехать прямо вверх по крутой горе","Потому что хотели, чтобы поездка была долгой и скучной","Потому что на прямой линии слишком много моря","Потому что машины не умеют ехать прямо","Представьте тропу, которая ведёт на гору. Она идёт к вершине напрямик?","Длинная извилистая дорога с каждым метром поднимается медленнее.","Иерусалим в горах, и склон по дороге к нему крутой. Поэтому дороги петляют: так подъём становится более пологим и безопасным."],"ar":["الشوارع القديمة الصاعدة إلى القدس متعرجة كثيرًا، ولا تسير في خط مستقيم. لماذا؟","لأن الصعود مستقيمًا على جبل حاد صعب","لأنهم أرادوا أن تكون الرحلة طويلة ومملة","لأن الخط المستقيم يمر في بحر كثير","لأن السيارات لا تستطيع السير مستقيمًا","تخيلوا دربًا يصعد على جبل. هل يصل إلى القمة مباشرة؟","الطريق الطويلة الملتوية ترتفع ببطء أكثر مع كل متر.","القدس في الجبال، والمنحدر في الطريق إليها حاد. لذلك الشوارع متعرجة: هكذا يكون الصعود ألطف وأكثر أمانًا."]}],
["jeru",3,{"he":["נוסעים מירושלים מזרחה, לים המלח. בדרך נהיה חם ויבש יותר. למה?","כי הדרך יורדת נמוך מאוד, ומזרח ההרים מקבל מעט גשם","כי ים המלח מחמם את האוויר בקיץ ובחורף","כי במזרח השמש גדולה יותר מאשר במערב","כי בדרך יש הרבה עצים שמייבשים את האוויר","השוו את הגובה של ירושלים לגובה של ים המלח.","העננים מגיעים מהים שבמערב. מה נשאר בהם אחרי שעברו את רכס ההר?","ירושלים גבוהה, וים המלח הוא המקום הנמוך ביותר ביבשה. העננים באים מהמערב ומורידים את רוב הגשם לפני ההרים, ולכן במזרח יש מדבר."],"en":["Driving from Jerusalem east to the Dead Sea, it gets hotter and drier on the way. Why?","The road goes far down, and little rain falls east of the hills","Because the Dead Sea heats the air in summer and in winter","Because in the east the sun is bigger than in the west","Because there are many trees on the way that dry the air","Compare the height of Jerusalem with the height of the Dead Sea.","The clouds come from the sea in the west. What is left in them after they cross the ridge?","Jerusalem is high, and the Dead Sea is the lowest place on land. Clouds come from the west and drop most of their rain before the hills, so in the east there is desert."],"ru":["Если ехать из Иерусалима на восток, к Мёртвому морю, по дороге становится жарче и суше. Почему?","Дорога идёт вниз, а к востоку от гор мало дождей","Потому что Мёртвое море греет воздух летом и зимой","Потому что на востоке солнце больше, чем на западе","Потому что по дороге много деревьев, которые сушат воздух","Сравните высоту Иерусалима и высоту Мёртвого моря.","Тучи приходят с моря на западе. Что в них остаётся, когда они перейдут хребет?","Иерусалим высоко, а Мёртвое море это самое низкое место на суше. Тучи идут с запада и проливают почти весь дождь до гор, поэтому на востоке пустыня."],"ar":["نسافر من القدس شرقًا إلى البحر الميت. في الطريق يصبح الجو أحر وأجف. لماذا؟","لأن الطريق تنزل كثيرًا، وشرق الجبال قليل المطر","لأن البحر الميت يسخن الهواء في الصيف والشتاء","لأن الشمس في الشرق أكبر منها في الغرب","لأن في الطريق أشجارًا كثيرة تجفف الهواء","قارنوا ارتفاع القدس بارتفاع البحر الميت.","الغيوم تأتي من البحر في الغرب. ماذا يبقى فيها بعد أن تعبر سلسلة الجبل؟","القدس مرتفعة، والبحر الميت هو أخفض مكان على اليابسة. الغيوم تأتي من الغرب وتُنزل معظم مطرها قبل الجبال، لذلك في الشرق صحراء."]}],
["jeru",3,{"he":["במוזיאון ישראל, המגילות הגנוזות מוצגות באולם חשוך וקריר. למה?","כי אור וחום עלולים להרוס אותן","כי המבקרים מעדיפים לראות בחושך","כי כך חוסכים בחשמל של המוזיאון","כי המגילות זוהרות בחושך כמו כוכבים","המגילות כתובות על קלף, והן בנות כ־2,000 שנה.","חשבו מה קורה לנייר ישן שעומד הרבה זמן בשמש.","המגילות עדינות מאוד. אור חזק וחום עלולים לפגוע בהן, ולכן שומרים עליהן באולם חשוך וקריר."],"en":["At the Israel Museum, the Dead Sea Scrolls are shown in a dark, cool hall. Why?","They are very old, and light and heat could ruin them","Because visitors prefer to look in the dark","Because this saves the museum electricity","Because the scrolls glow in the dark like stars","The scrolls are written on parchment, and they are about 2,000 years old.","Think about what happens to old paper that stays in the sun for a long time.","The scrolls are very delicate. Strong light and heat could damage them, so they are kept in a dark, cool hall."],"ru":["В Музее Израиля Кумранские рукописи показывают в тёмном прохладном зале. Почему?","Они очень древние, и свет и жара могут их испортить","Потому что посетители любят смотреть в темноте","Потому что так музей экономит электричество","Потому что рукописи светятся в темноте, как звёзды","Рукописи написаны на пергаменте, и им около 2000 лет.","Подумайте, что бывает со старой бумагой, которая долго лежит на солнце.","Рукописи очень хрупкие. Яркий свет и жара могут их повредить, поэтому их хранят в тёмном прохладном зале."],"ar":["في متحف إسرائيل، تُعرض مخطوطات البحر الميت في قاعة مظلمة وباردة. لماذا؟","لأنها قديمة جدًا، والضوء والحرارة قد يتلفانها","لأن الزوار يفضلون المشاهدة في الظلام","لأنه هكذا يوفر المتحف الكهرباء","لأن المخطوطات تضيء في الظلام مثل النجوم","المخطوطات مكتوبة على رقّ، وعمرها نحو 2000 سنة.","فكروا ماذا يحدث لورق قديم يبقى وقتًا طويلًا في الشمس.","المخطوطات حساسة جدًا. الضوء القوي والحرارة قد يضران بها، لذلك تُحفظ في قاعة مظلمة وباردة."]}],
["jeru",3,{"he":["בכניסה לכותל, לכנסיות ולמסגדים בירושלים מבקשים מהמבקרים להתלבש בצניעות. למה?","מתוך כבוד למקום הקדוש ולאנשים שמתפללים בו","כי בתוך המקומות האלה קר מאוד","כי אסור להיכנס עם בגדים צבעוניים","כי כך קל יותר לספור את המבקרים, ולדעת כמה אנשים נכנסו בכל שעה","חשבו איך מתנהגים כשנכנסים לבית של מישהו אחר.","בכל שלוש הדתות יש כללי לבוש במקום תפילה.","המקומות האלה קדושים למאמינים. כשמתלבשים בצניעות, מכבדים את המקום ואת המתפללים, בלי קשר לדת של המבקר."],"en":["At the entrance to the Western Wall, the churches and the mosques in Jerusalem, visitors are asked to dress modestly. Why?","Out of respect for the holy place and the people who pray there","Because it is very cold inside these places","Because you may not enter in colorful clothes","Because this makes it easier to count the visitors and to know how many came in each hour","Think about how you behave when you enter someone else's home.","All three religions have dress rules in a place of prayer.","These places are holy to believers. Dressing modestly shows respect for the place and for the worshippers, whatever the visitor's own religion."],"ru":["У входа к Западной стене, в церкви и в мечети Иерусалима посетителей просят одеваться скромно. Почему?","Из уважения к святому месту и к молящимся","Потому что внутри этих мест очень холодно","Потому что нельзя входить в цветной одежде","Потому что так легче считать посетителей и знать, сколько людей вошло за каждый час","Подумайте, как вы ведёте себя, когда входите в чужой дом.","Во всех трёх религиях есть правила одежды в месте молитвы.","Эти места святы для верующих. Скромная одежда показывает уважение к месту и к молящимся, какой бы ни была религия посетителя."],"ar":["عند مدخل الحائط الغربي والكنائس والمساجد في القدس، يُطلب من الزوار أن يلبسوا ملابس محتشمة. لماذا؟","احترامًا للمكان المقدس وللناس الذين يصلون فيه","لأن الجو داخل هذه الأماكن بارد جدًا","لأنه ممنوع الدخول بملابس ملونة","لأنه هكذا يسهل عدّ الزوار ومعرفة كم شخصًا دخل في كل ساعة","فكروا كيف تتصرفون عندما تدخلون بيت شخص آخر.","في الديانات الثلاث توجد قواعد للباس في مكان الصلاة.","هذه الأماكن مقدسة للمؤمنين. عندما نلبس ملابس محتشمة نحترم المكان والمصلين، مهما كانت ديانة الزائر."]}],
["jeru",3,{"he":["חיפה ויפו גדלו כערי נמל. למה ירושלים לא הפכה לעיר נמל?","כי היא רחוקה מהים ובנויה גבוה בהרים","כי תושבי ירושלים לא אהבו ספינות","כי בירושלים אסור לבנות בניינים גדולים","כי הים ליד ירושלים קפוא כל השנה","חשבו מה צריך להיות ליד עיר כדי שספינות יגיעו אליה.","הסתכלו במפה: איפה ירושלים לעומת קו החוף?","עיר נמל צריכה להיות על חוף הים. ירושלים נמצאת בהרים, רחוק מהחוף, ולכן גדלה כעיר של קדושה, שלטון ותיירות."],"en":["Haifa and Jaffa grew as port cities. Why did Jerusalem not become a port city?","Because it is far from the sea, high in the hills","Because the people of Jerusalem did not like ships","Because large buildings may not be built in Jerusalem","Because the sea near Jerusalem is frozen all year","Think about what must be near a city for ships to reach it.","Look at a map: where is Jerusalem compared with the coastline?","A port city must be on the seashore. Jerusalem is in the hills, far from the coast, so it grew as a city of holiness, government and tourism."],"ru":["Хайфа и Яффо выросли как портовые города. Почему Иерусалим не стал портовым городом?","Потому что он далеко от моря и стоит высоко в горах","Потому что жители Иерусалима не любили корабли","Потому что в Иерусалиме нельзя строить большие здания","Потому что море у Иерусалима замёрзшее круглый год","Подумайте, что должно быть рядом с городом, чтобы туда приходили корабли.","Посмотрите на карту: где Иерусалим по сравнению с береговой линией?","Портовый город должен стоять на берегу моря. Иерусалим в горах, далеко от берега, поэтому он вырос как город святынь, власти и туризма."],"ar":["حيفا ويافا نمتا كمدينتي ميناء. لماذا لم تصبح القدس مدينة ميناء؟","لأنها بعيدة عن البحر ومبنية عاليًا في الجبال","لأن سكان القدس لم يحبوا السفن","لأنه ممنوع بناء مبانٍ كبيرة في القدس","لأن البحر قرب القدس متجمد طوال السنة","فكروا ماذا يجب أن يكون قرب المدينة لكي تصل إليها السفن.","انظروا إلى الخريطة: أين القدس مقارنة بخط الشاطئ؟","مدينة الميناء يجب أن تكون على شاطئ البحر. القدس في الجبال، بعيدًا عن الشاطئ، لذلك نمت كمدينة قداسة وحكم وسياحة."]}]
]

   רושמים את התוצאות של השאלות האחרונות בכל פעולה (חלון נע),
   ולא את כל ההיסטוריה. ילד ששלט בחיבור לפני חודש ומתקשה בו היום
   צריך לקבל עזרה היום — ולהפך, קושי ישן לא צריך לרדוף אחריו.
   ===================================================== */
var WEAK_WINDOW=8;    /* כמה שאלות אחרונות זוכרים לכל פעולה */
var WEAK_TRIGGER=3;   /* כמה טעויות בתוך החלון מפעילות הצעת תרגול */
var WEAK_NEAR=2;      /* טעות במרחק כזה מהתשובה נחשבת "קרובה" */

/* רושם תוצאה של שאלה אחת. dist = כמה רחוקה הייתה התשובה השגויה. */
function noteResult(kind,ok,dist){
  var w=state.weak&&state.weak[kind];
  if(!w)return;
  w.r.push(ok?1:0);
  if(w.r.length>WEAK_WINDOW)w.r.shift();
  if(!ok){ if(dist<=WEAK_NEAR)w.near++; else w.far++; }
  save();
}
/* כמה טעויות יש בחלון הנוכחי של פעולה מסוימת */
function weakMisses(kind){
  var w=state.weak&&state.weak[kind];
  if(!w)return 0;
  var n=0;for(var i=0;i<w.r.length;i++)if(!w.r[i])n++;
  return n;
}
/* הפעולה שהכי מתקשים בה כרגע — או null אם הכול בסדר */
function weakestOp(){
  var best=null,bestN=WEAK_TRIGGER-1;
  ["add","sub","mul","div"].forEach(function(k){
    var n=weakMisses(k);
    if(n>bestN){bestN=n;best=k}
  });
  return best;
}
/* האם רוב הטעויות בפעולה הזאת היו "קרובות"?
   קרוב = כנראה החלקה בספירה. רחוק = כנראה לא הבינו את הפעולה. */
function weakIsNear(kind){
  var w=state.weak&&state.weak[kind];
  return !!(w&&w.near>w.far);
}

  var el=null,steps=[],idx=0,timer=null,lineTo=10,isOn=false;

  /* מעל המספר הזה עוברים מספירה של אחד־אחד לקפיצות של עשר.
     56 צעדים זה לא עזרה — זה עונש. */
  var JUMP_MIN=12;

  /* ספירה בקפיצות: 18 + 56 הופך לחמש קפיצות של עשר ואז שש של אחד.
     המספרים מוצגים כמוטות של עשר ועיגולים בודדים, וכשמצטברים
     עשרה עיגולים הם נאספים לבד למוט — בדיוק הרעיון של יחידות ועשרות. */
  function planJump(t,a,b,isAdd){
    var out=[],i,v=a,sign=isAdd?1:-1;
    var tens=Math.floor(b/10),ones=b%10;
    function blk(val,cap,pulse,end){
      return {j:1,t10:Math.floor(val/10),o1:val%10,v:val,cap:cap,pulse:pulse,end:end};
    }
    out.push(blk(a,fmt(t.slowHave,{a:a})));
    out.push(blk(a,fmt(isAdd?t.slowPlus:t.slowMinus,{b:b})));
    if(tens){
      out.push(blk(v,fmt(t.slowByTens,{n:tens})));
      for(i=0;i<tens;i++){v+=sign*10;out.push(blk(v,String(v),1))}
    }
    if(ones){
      out.push(blk(v,fmt(t.slowByOnes,{n:ones})));
      for(i=0;i<ones;i++){v+=sign;out.push(blk(v,String(v),1))}
    }
    out.push(blk(v,fmt(isAdd?t.slowGotAdd:t.slowGotSub,{r:v}),0,1));
    return out;
  }

  /* --- בונה את רשימת הצעדים מתוך השאלה --- */
  function plan(q){
    var t=T(),out=[],i,v,a=q.a,b=q.b;
    /* מספר שני גדול? עוברים לקפיצות של עשר במקום ספירה אחד־אחד */
    if((q.kind==="add"||q.kind==="sub")&&b>JUMP_MIN)return planJump(t,a,b,q.kind==="add");
    if(q.kind==="add"){
      out.push({d:a,base:a,gone:0,v:a,cap:fmt(t.slowHave,{a:a})});          /* יש לנו a */
      out.push({d:a,base:a,gone:0,v:a,cap:fmt(t.slowPlus,{b:b})});          /* נוסיף b  */
      for(i=1;i<=b;i++){v=a+i;out.push({d:v,base:a,gone:0,v:v,cap:String(v),pulse:1})}
      v=a+b;out.push({d:v,base:a,gone:0,v:v,cap:fmt(t.slowGotAdd,{r:v}),end:1});
    }else if(q.kind==="sub"){
      out.push({d:a,base:a,gone:0,v:a,cap:fmt(t.slowHave,{a:a})});
      out.push({d:a,base:a,gone:0,v:a,cap:fmt(t.slowMinus,{b:b})});
      for(i=1;i<=b;i++){v=a-i;out.push({d:a,base:a,gone:i,v:v,cap:String(v),pulse:1})}
      v=a-b;out.push({d:a,base:a,gone:b,v:v,cap:fmt(t.slowGotSub,{r:v}),end:1});

    }else if(q.kind==="mul"){
      /* כפל = {a} קבוצות, ובכל אחת {b}.
         ממלאים קבוצה שלמה בכל צעד, והמספר קופץ בקפיצות של {b}: 8, 16, 24, 32 ... */
      var g=[];for(i=0;i<a;i++)g.push(0);
      out.push({g:g.slice(),cap:fmt(t.slowGroups,{a:a})});
      out.push({g:g.slice(),cap:fmt(t.slowEach,{b:b})});
      for(i=0;i<a;i++){
        g[i]=b;
        out.push({g:g.slice(),gf:i,per:b,cap:String((i+1)*b),pulse:1});
      }
      out.push({g:g.slice(),cap:fmt(t.slowGotMul,{a:a,b:b,r:a*b}),end:1});

    }else{
      /* חילוק = מחלקים {a} ל-{b} קבוצות שוות.
         בכל צעד נותנים עיגול אחד לכל קבוצה — חלוקה הוגנת אמיתית.
         כך התשובה מתגלה לילד לבד, במקום להינתן לו מוכנה. */
      var ansv=q.answer!=null?q.answer:Math.round(a/b);
      var gd=[];for(i=0;i<b;i++)gd.push(0);
      out.push({g:gd.slice(),pile:a,cap:fmt(t.slowHave,{a:a})});
      out.push({g:gd.slice(),pile:a,cap:fmt(t.slowSplit,{a:a,b:b})});
      for(i=1;i<=ansv;i++){
        for(var j=0;j<b;j++)gd[j]=i;
        out.push({g:gd.slice(),pile:a-i*b,gf:-1,per:1,cap:fmt(t.slowRound,{n:i}),pulse:1});
      }
      out.push({g:gd.slice(),pile:0,cap:fmt(t.slowGotDiv,{r:ansv}),end:1});
    }
    return out;
  }

  /* --- בונה את החלון פעם אחת בלבד --- */
  function make(){
    var ov=document.createElement("div");
    ov.className="sm-ov";ov.style.display="none";
    ov.innerHTML='<div class="sm-box" role="dialog" aria-modal="true"><div class="sm-head"><h2 class="fd" style="font-size:1.25rem"></h2><button class="sm-x" aria-label="'+esc(((TTSMSG[(state.settings&&state.settings.lang)||"he"]||TTSMSG.he).close))+'">&#10005;</button></div><div class="sm-ex"></div><div class="sm-cap" aria-live="polite"></div><div class="sm-dots"></div><div class="sm-line"></div><div class="sm-pb"><i></i></div><div class="sm-ctl"><button class="bk"></button><button class="pl"></button><button class="go nx"></button></div></div>';
    document.body.appendChild(ov);
    el={ov:ov,box:ov.querySelector(".sm-box"),ttl:ov.querySelector("h2"),ex:ov.querySelector(".sm-ex"),
        cap:ov.querySelector(".sm-cap"),dots:ov.querySelector(".sm-dots"),line:ov.querySelector(".sm-line"),
        pb:ov.querySelector(".sm-pb>i"),bk:ov.querySelector(".bk"),pl:ov.querySelector(".pl"),
        nx:ov.querySelector(".nx"),x:ov.querySelector(".sm-x")};
    el.nx.onclick=function(){stop();go(idx+1)};
    el.bk.onclick=function(){stop();go(idx-1)};
    el.pl.onclick=function(){timer?stop():play()};
    el.x.onclick=close;
    ov.onclick=function(e){if(e.target===ov)close()};
    document.addEventListener("keydown",function(e){
      if(!isOn)return;
      if(e.key==="Escape"){close()}
      else if(e.key===" "||e.key==="ArrowRight"||e.key==="ArrowDown"){e.preventDefault();stop();go(idx+1)}
      else if(e.key==="ArrowLeft"||e.key==="ArrowUp"){e.preventDefault();stop();go(idx-1)}
    });
  }

  /* --- מצייר צעד אחד --- */
  function draw(){
    var s=steps[idx],t=T(),i,n,d,tk;
    if(!s)return;
    el.cap.textContent=s.cap;

    /* --- מצב קפיצות של עשר (חיבור וחיסור עם מספרים גדולים) --- */
    if(s.j){
      el.line.innerHTML="";
      var hb='<div class="sm-b10">';
      for(i=0;i<s.t10;i++)hb+='<span class="sm-rod'+((s.pulse&&s.o1===0&&i===s.t10-1)?" p":"")+'"></span>';
      for(i=0;i<s.o1;i++)hb+='<span class="sm-d'+((s.pulse&&i===s.o1-1)?" p":"")+'"></span>';
      el.dots.innerHTML=hb+'</div>';
      el.pb.style.width=Math.round(idx/(steps.length-1)*100)+"%";
      el.bk.disabled=(idx===0);
      el.bk.textContent=t.slowBack;
      el.nx.textContent=s.end?t.slowAgain:t.slowNext;
      speak(s.cap);
      if(s.end&&state.settings.soundFx)sfxCorrect();
      return;
    }

    /* --- מצב קבוצות (כפל וחילוק) --- */
    if(s.g){
      el.line.innerHTML="";
      var html="";
      /* הערימה שעוד לא חולקה */
      if(s.pile>0){
        html+='<div class="sm-pile">';
        for(i=0;i<s.pile;i++)html+='<span class="sm-d"></span>';
        html+='</div>';
      }
      html+='<div class="sm-grp">';
      for(i=0;i<s.g.length;i++){
        var isFresh=!!(s.pulse&&(s.gf===-1||s.gf===i));
        html+='<div class="sm-g'+(isFresh?" fresh":"")+'">';
        for(n=0;n<s.g[i];n++){
          var isNew=isFresh&&n>=s.g[i]-(s.per||1);
          html+='<span class="sm-d n'+(isNew?" p":"")+'"></span>';
        }
        html+='</div>';
      }
      html+='</div>';
      el.dots.innerHTML=html;
      el.pb.style.width=Math.round(idx/(steps.length-1)*100)+"%";
      el.bk.disabled=(idx===0);
      el.bk.textContent=t.slowBack;
      el.nx.textContent=s.end?t.slowAgain:t.slowNext;
      speak(s.cap);
      if(s.end&&state.settings.soundFx)sfxCorrect();
      return;
    }

    /* --- מצב עיגולים בשורה (חיבור וחיסור) --- */
    el.dots.innerHTML="";
    var last=s.gone?s.d-s.gone:s.d-1;
    for(i=0;i<s.d;i++){
      d=document.createElement("span");
      d.className="sm-d"+(i>=s.base?" n":"")+(s.gone&&i>=s.d-s.gone?" g":"")+(s.pulse&&i===last?" p":"");
      el.dots.appendChild(d);
    }
    /* ציר המספרים */
    el.line.innerHTML="";
    var from=0,to=lineTo;
    if(lineTo>18){from=Math.max(0,s.v-7);to=Math.min(lineTo,from+15)}
    for(n=from;n<=to;n++){
      tk=document.createElement("span");
      tk.className="sm-t"+(n===s.v?" on":(n<s.v?" pv":""));
      tk.textContent=n;el.line.appendChild(tk);
    }
    var cur=el.line.querySelector(".sm-t.on");
    if(cur&&cur.scrollIntoView)cur.scrollIntoView({block:"nearest",inline:"center"});
    /* פס התקדמות + כפתורים */
    el.pb.style.width=Math.round(idx/(steps.length-1)*100)+"%";
    el.bk.disabled=(idx===0);
    el.bk.textContent=t.slowBack;
    el.nx.textContent=s.end?t.slowAgain:t.slowNext;
    /* הקראה — משתמש במנוע ההקראה הקיים של האפליקציה */
    speak(s.cap);
    if(s.end&&state.settings.soundFx)sfxCorrect();
  }

  function go(n){
    if(n<0)return;
    if(n>=steps.length){go(0);return}
    idx=n;draw();
  }
  /* מצב "הפעלה" — מתקדם לבד. 2100 = 2.1 שניות בין צעד לצעד */
  function play(){el.pl.textContent=T().slowStop;timer=setInterval(function(){
    if(idx>=steps.length-1){stop();return}go(idx+1)},2100)}
  function stop(){if(timer){clearInterval(timer);timer=null}if(el)el.pl.textContent=T().slowPlay}

  /* האם אפשר לפרק את השאלה הזאת? נשמר ציבורי כדי שמסך התרגול
     ידע אם להציג את הכפתור בכלל. */
  function can(q){
    if(!q)return false;
    var a=q.a,b=q.b;
    if(q.kind==="add"||q.kind==="sub")return b>=0&&b<=99;   /* מעל 12 עוברים לקפיצות של עשר */
    if(q.kind==="mul")return a>=1&&a<=12&&b>=1&&b<=12;
    if(q.kind==="div"){var v=q.answer!=null?q.answer:Math.round(a/b);return b>=1&&b<=12&&v>=1&&v<=12}
    return false;
  }

  function open(q){
    if(!can(q))return false;
    if(!el)make();
    var t=T();
    steps=plan(q);
    lineTo=Math.max(10,q.kind==="add"?q.a+q.b:q.a);
    el.box.setAttribute("dir",LANGS[state.settings.lang||"he"].dir);
    el.ttl.textContent={add:t.slowAdd,sub:t.slowSub,mul:t.slowMul,div:t.slowDiv}[q.kind];
    el.ex.textContent=(q.expr||(q.a+" ? "+q.b))+" = ?";
    el.pl.textContent=t.slowPlay;
    idx=0;isOn=true;el.ov.style.display="grid";
    draw();
    return true;
  }
  function close(){stop();isOn=false;stopSpeak();if(el)el.ov.style.display="none"}

  return {open:open,close:close,can:can,isOpen:function(){return isOn}};
})();

  return x[0]+x[1]+(x.length>2?"@"+x[2]:"")}).join(",")).toString(36)}

/* בונה את שאלות המבחן. אותו זרע → אותן שאלות, גם אצל המורה
   כשהוא בודק וגם אצל התלמיד כשהוא נבחן. */
function examQuestions(spec){
  /* מסננים נושאים שאינם מוכרים לאפליקציה הזאת, בדיוק כמו decodeExam.
     בלי הסינון buildQ מחזיר null על נושא זר, והמסך נופל על
     q.topic של null. עדיף לדלג בשקט מאשר להתרסק. */
  var pairs=(spec.q||[]).filter(function(x){return !!topicById(x[0])});
  /* מבחן שנבנה עם זרע לכל משבצת נבנה משבצת אחרי משבצת, וכל
     שאלה תלויה בזרע שלה בלבד — כך המורה יכול להחליף אחת מהן.
     מבחן ישן, בלי זרעים, חייב להיבנות בדיוק כפי שנבנה ביום
     שנשלח: אחרת הציון של מי שכבר נבחן משתנה למפרע. */

    return pairs.map(function(p){return exBuildSlot(p)})
                .filter(function(q){return !!q});

    return pairs.map(function(pair){return buildQ(pair[0],pair[1])})

}
/* --- בחירת השאלות בידי המורה ---------------------------------
   עד כאן המורה בחר נושאים, רמה ומספר שאלות — והשאלות עצמן הוגרלו
   מאחורי גבו. הוא ראה אותן לראשונה רק אחרי שהמבחן כבר היה אצל
   התלמידים. מעכשיו כל שאלה היא משבצת נפרדת עם זרע משלה: המורה
   רואה אותה לפני השליחה, מחליף אותה בשאלה אחרת מאותו נושא,
   מסיר אותה, או מוסיף שאלה מנושא שחסר לו.

   הזרע הנפרד לכל משבצת הוא מה שמאפשר את זה. בזרם אקראי אחד
   ומשותף, כפי שהיה עד כאן, החלפה של השאלה השלישית הייתה משנה
   גם את הרביעית ואת החמישית — כלומר לא "החלפה" אלא הגרלה מחדש
   של כל מה שאחריה.

   24 ביט ולא 32: הזרע נוסע בתוך הקישור שנשלח בוואטסאפ, וזרע
   קצר יותר הוא קישור קצר יותר. שישה־עשר מיליון אפשרויות למשבצת
   הן הרבה מעבר למה שהמחולל עצמו יודע לייצר. */
function exNewSeed(){return (Math.random()*16777215)>>>0}
function exSlot(topicId,level){return [topicId,level,exNewSeed()]}
/* אותו זרע → אותה שאלה בדיוק: אצל המורה כשהוא בוחר, ואצל
   התלמיד כשהוא נבחן. */
function exBuildSlot(slot){
  if(!slot||!topicById(slot[0]))return null;
  return withSeed(slot[2],function(){return buildQ(slot[0],slot[1])})||null;
}
/* מסך הבנייה מצייר את עצמו מחדש אחרי כל לחיצה, ובניית עשרים
   וחמש שאלות בכל ציור מיותרת. המטמון הוא לתצוגה בלבד — מי
   שנבחן בונה את שאלותיו מחדש, כדי שאיש לא יערוך בטעות אובייקט
   שגם מסך אחר מחזיק בו. */
var EXQCACHE={};
/* לכל אפליקציה מנגנון שפה משלה, ולא לכולן אותם שמות. הפנייה
   דרך window ולא בשם ישיר, כי שם שאינו קיים באפליקציה מסוימת
   הוא שגיאה בעיני הבודקים — רעש שמסתיר שגיאה אמיתית. */
function exLangKey(){
  try{
    var g=(typeof window!=="undefined")?window:{};
    if(typeof g.xlg==="function")return g.xlg();
    if(typeof g.LG==="string")return g.LG;

}
function exPreviewQ(slot){
  if(!slot)return null;

  if(!(k in EXQCACHE)){
    /* מורה שמחליף שאלות שוב ושוב מייצר מפתח חדש בכל לחיצה.
       מטמון שרק גדל הוא דליפה; מרוקנים אותו ומתחילים מחדש. */
    if(Object.keys(EXQCACHE).length>400)EXQCACHE={};
    EXQCACHE[k]=exBuildSlot(slot);
  }
  return EXQCACHE[k];
}
function exTopicName(id){
  var t=topicById(id); if(!t)return "";
  var g=(typeof window!=="undefined")?window:{};

function exRightAnswer(q){
  var i; if(!q||!q.options)return null;
  for(i=0;i<q.options.length;i++)if(q.options[i].ok)return q.options[i];
  return null;
}
/* המשבצות שהמורה עורך. נבנות מחדש רק כשנושא, רמה או מספר
   השאלות משתנים; עריכה של משבצת בודדת נשמרת. */
function exSlots(){
  if(EB.q&&EB.q.length)return EB.q;
  var tops=EB.topics.filter(function(x){return topicById(x)});
  if(!tops.length)tops=topicsForTrack(state.track).slice(0,3).map(function(t){return t.id});
  /* אותה שאלה פעמיים באותו מבחן היא שאלה מבוזבזת, והיא ודאית כשברמה
     ארבעה פריטים והמורה ביקש עשר שאלות: הזרע נבחר באקראי ובלי זיכרון,
     ונמדד מבחן שבו אותו מושג הופיע ארבע פעמים מתוך עשר. מגלגלים מחדש
     עד שתים־עשרה פעמים, ואם כל השאלות האפשריות כבר נלקחו — משאירים
     כפילות במקום להיתקע. */
  var q=[],seen={},i,tries,sl,pq,key;
  for(i=0;i<EB.n;i++){
    for(tries=0;tries<12;tries++){
      sl=exSlot(tops[i%tops.length],EB.level);
      pq=exPreviewQ(sl); key=pq&&pq.ask?plainOf(pq.ask):"";
      if(!key||!seen[key])break;
    }
    if(key)seen[key]=1;
    q.push(sl);
  }
  /* מערבבים כאן ולא בשליחה: המורה רואה את הסדר הסופי ומאשר אותו. */

/* wa.me מקבל רק מספר בינלאומי בלי אפס מוביל. מורה שהקליד 050-8554380
   כמו שמקלידים בטלפון קיבל אצל התלמיד "לא ניתן לבדוק את מספר הטלפון…
   חסרה קידומת חיוג", והתשובות לא נשלחו. אפס מוביל הוא מספר ישראלי
   מקומי ומקבל 972; "00" בהתחלה הוא קידומת בינלאומית ונופל; מספר

   מועתקות מהמפתח הישן רק רשומות שכל נושאיהן מוכרים כאן.

    var old=JSON.parse(raw); if(!old||!old.list||!old.list.length)return;

    for(i=0;i<EX.list.length;i++)have[EX.list[i].id]=1;

/* הציון מחושב כאן מחדש מתוך התשובות. מה שהתלמיד שלח הוא מה
   שסימן, לא כמה הוא קיבל. */

/* ------------------------------------------------------------
   ייצוא CSV של ההגשות.
   העתקת הטבלה נותנת טקסט מופרד בטאבים — נוח להדבקה, אבל לא קובץ.
   מורה שרוצה למיין, לסנן או לחשב ממוצע צריך גיליון. שורה לכל תלמיד,
   ועמודה לכל שאלה, כדי שאפשר יהיה לראות מיד באיזו שאלה נפלה הכיתה.
   ה-BOM בהתחלה הוא מה שגורם לאקסל לקרוא עברית, ערבית ורוסית נכון
   במקום ג׳יבריש — בלעדיו הקובץ נפתח שבור בדיוק אצל מי שצריך אותו.
   ------------------------------------------------------------ */
function csvCell(v){
  var s=(v===undefined||v===null)?"":String(v);
  return /[",\n\r;\t]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function csvRow(a){ return a.map(csvCell).join(",") }
/* ============================================================
   מצב מורה.

   ילד יכול למחוק מבחן, לראות ציונים של חברים, או לפתוח מבחן
   ולראות מראש את השאלות.
   זו אינה אבטחה, ואסור להציג אותה ככזאת: מי שיודע לפתוח כלי
   פיתוח יעקוף אותה בשנייה. זו נעילה מפני יד סקרנית — בדיוק מה
   שצריך כאן, ולא יותר.
   כל עוד לא נבחר קוד, שום דבר לא משתנה והמסכים גלויים כתמיד.

/* גיבוב חלש כגיבוי בלבד. SubtleCrypto קיים בכל דפדפן מודרני
   בהקשר מאובטח, ו-GitHub Pages הוא כזה. */
function teWeak(s){var h=5381,i;for(i=0;i<s.length;i++)h=((h*33)^s.charCodeAt(i))>>>0;return "w"+h.toString(16)}
function teHash(pin,salt,cb){
  var msg=salt+"|"+pin;
  try{
    if(window.crypto&&crypto.subtle&&crypto.subtle.digest&&window.TextEncoder){
      crypto.subtle.digest("SHA-256",new TextEncoder().encode(msg)).then(function(d){
        var a=Array.prototype.slice.call(new Uint8Array(d));
        cb(a.map(function(b){return ("0"+b.toString(16)).slice(-2)}).join(""));
      },function(){cb(teWeak(msg))});
      return;
    }
  }catch(e){}
  cb(teWeak(msg));
}
function teSalt(){
  var s="";
  try{
    var a=new Uint8Array(8);crypto.getRandomValues(a);
    s=Array.prototype.slice.call(a).map(function(b){return ("0"+b.toString(16)).slice(-2)}).join("");
  }catch(e){ s=String(Date.now())+Math.random().toString(36).slice(2) }
  return s;
}
/* השהיה אחרי ניסיונות כושלים. ארבע ספרות הן עשרת אלפים
   אפשרויות, וילד סבלני יכול לנסות הרבה. */
function teWait(){
  var r=teRead();if(!r||!r.bad||r.bad<3)return 0;
  var pen=Math.min(300,Math.pow(2,r.bad-3)*5)*1000;
  var left=Math.ceil(((r.badAt||0)+pen-Date.now())/1000);
  return left>0?left:0;
}

    (!setting&&teHas()?'<button class="te-btn link" id="te-forgot">'+esc(xt("teForgot"))+'</button>':'')+

  document.body.appendChild(w);

  /* מלכודת פוקוס, כמו בשער התנאים */
  w.addEventListener("keydown",function(e){
    if(e.key==="Escape"){teClose();return}
    if(e.key==="Enter"){e.preventDefault();teSubmit();return}
    if(e.key!=="Tab")return;
    var f=box.querySelectorAll("button:not([disabled]),input");
    if(!f.length)return;
    var a=f[0],z=f[f.length-1];

    else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}
  });

  var fg=document.getElementById("te-forgot");
  if(fg)fg.onclick=function(){ TE.msg=xt("teForgotHow"); teDialog() };

function teClose(){ TE.ask=false; TE.mode=""; TE.msg=""; teDialog(); }
function teSubmit(){
  if(TE.busy)return;
  var setting=(TE.mode==="set"||TE.mode==="change"||!teHas());
  var pin=(document.getElementById("te-pin")||{}).value||"";
  var rem=!!(document.getElementById("te-rem")||{}).checked;
  if(!/^[0-9]{4,8}$/.test(pin)){TE.msg=xt("teShort");teDialog();return}
  if(setting){
    var p2=(document.getElementById("te-pin2")||{}).value||"";
    if(pin!==p2){TE.msg=xt("teMismatch");teDialog();return}
    var salt=teSalt();
    TE.busy=true;
    teHash(pin,salt,function(h){
      TE.busy=false;
      teWrite({h:h,s:salt,bad:0,badAt:0});
      teSetOpen(true,rem);
      TE.ask=false;TE.mode="";TE.msg="";
      teDialog(); render();
    });
    return;
  }
  if(teWait()){teDialog();return}
  var rec=teRead(); if(!rec){teClose();return}
  TE.busy=true;
  teHash(pin,rec.s,function(h){
    TE.busy=false;
    if(h===rec.h){
      rec.bad=0;rec.badAt=0;teWrite(rec);
      teSetOpen(true,rem);
      TE.ask=false;TE.mode="";TE.msg="";
      teDialog(); render();
    }else{
      rec.bad=(rec.bad||0)+1;rec.badAt=Date.now();teWrite(rec);
      TE.msg=xt("teBad"); teDialog();
    }
  });
}
function teAsk(mode){ TE.ask=true; TE.mode=mode||""; TE.msg=""; teDialog() }
function teLock(){ teSetOpen(false); render() }
function teRemove(){ teWrite(null); teSetOpen(false); render() }
/* נעילה אוטומטית אחרי שהאפליקציה הייתה מוסתרת זמן־מה.
   מורה שבנה מבחן ומסר את הטאבלט בלי ללחוץ "יציאה" השאיר אותו
   פתוח, וזה בדיוק המצב שהתכונה אמורה למנוע. שתי דקות מספיקות
   כדי לא להפריע לעבודה רצופה, ולנעול כשהמכשיר עבר יד.
   נעילה שנשמרה כ"לזכור במכשיר הזה" היא בחירה מפורשת ולא נוגעים בה. */
var TE_HID=0;
try{
  document.addEventListener("visibilitychange",function(){
    if(document.hidden){ TE_HID=Date.now(); return }
    if(!TE_HID||!teHas())return;
    var away=Date.now()-TE_HID; TE_HID=0;
    if(away<120000)return;
    var kept=false;
    try{ kept=localStorage.getItem("geo-elem-teacher"+"-open")==="1" }catch(e){}
    if(kept)return;
    try{ if(sessionStorage.getItem("geo-elem-teacher"+"-open")!=="1")return }catch(e){ return }
    teSetOpen(false); render();
  });
}catch(e){}

/* ?teacher=1 פותח את החלון, והפרמטר מוסר מיד מהכתובת כדי שלא
   יישאר בקישור ששותף או בהיסטוריה. */
(function(){
  try{
    var u=new URL(location.href);
    if(u.searchParams.get("teacher")==="1"){
      u.searchParams.delete("teacher");
      history.replaceState(null,"",u.pathname+(u.searchParams.toString()?"?"+u.searchParams:"")+u.hash);
      /* שער התנאים יושב מעל הכול, וכך צריך להיות: אי־אפשר להשתמש
         באפליקציה לפני שהוסכם עליהם. חלון הקוד ממתין לו במקום
         להיפתח מתחתיו ולהיראות תקוע. */
      var tries=0;
      (function waitLegal(){
        if(tries++>=600){ teAsk(teHas()?"":"set"); return }
        /* LEGAL.accepted נוצר רק כש-protect.js מאותחל. עד אז אין
           עדיין מה לבדוק, ובדיקה של ".lg-wrap" לבדה מחזירה "אין
           שער" בדיוק ברגע שלפני שהוא נבנה. */
        var ready=false;
        try{ ready=!!(window.LEGAL&&window.LEGAL.accepted) }catch(e){}
        if(!ready){ setTimeout(waitLegal,200); return }
        var ok=true;
        try{ ok=!!window.LEGAL.accepted() }catch(e){ ok=true }
        if(!ok){ setTimeout(waitLegal,200); return }
        teAsk(teHas()?"":"set");
      })();
    }
  }catch(e){}
})();

function marksCsv(ex){
  var subs=(ex.subs||[]).slice().sort(function(a,b){return b.pct-a.pct});
  var n=ex.spec.q.length,i;
  var head=[xt("mkCsvName"),xt("mkCsvPct"),xt("mkCsvOk"),xt("mkCsvTotal"),
            xt("mkCsvDate"),xt("mkCsvValid")];
  for(i=0;i<n;i++)head.push(xf("mkCsvQ",i+1));
  var rows=[csvRow(head)];
  subs.forEach(function(s){
    var r=[s.name||xt("mkNoName"),s.pct,s.ok,s.n,s.date||"",
           s.valid?xt("mkCsvYes"):xt("mkCsvNo")];
    for(i=0;i<n;i++){
      var p=s.per&&s.per[i];
      r.push(p?(p.ok?xt("mkCsvYes"):xt("mkCsvNo")):"");
    }
    rows.push(csvRow(r));
  });
  return "\ufeff"+rows.join("\r\n")+"\r\n";
}
/* כרום מוחק את שם הקובץ כולו ברגע שיש בו תו אחד שאינו ASCII —
   לא רק עברית: גם é או מקף ארוך. מה שיורד נקרא "download", בלי
   סיומת, ואקסל לא יודע לפתוח אותו. מורה שקרא למבחן שלו בעברית
   קיבל קובץ בלי שם ובלי סוג. לכן השם מתועתק ללטינית. */
var TRLIT={
  "א":"a","ב":"b","ג":"g","ד":"d","ה":"h","ו":"v","ז":"z","ח":"ch","ט":"t","י":"y",
  "כ":"k","ך":"k","ל":"l","מ":"m","ם":"m","נ":"n","ן":"n","ס":"s","ע":"","פ":"f",
  "ף":"f","צ":"tz","ץ":"tz","ק":"k","ר":"r","ש":"sh","ת":"t",
  "ا":"a","ب":"b","ت":"t","ث":"th","ج":"j","ح":"h","خ":"kh","د":"d","ذ":"dh","ر":"r",
  "ز":"z","س":"s","ش":"sh","ص":"s","ض":"d","ط":"t","ظ":"z","ع":"","غ":"gh","ف":"f",
  "ق":"q","ك":"k","ل":"l","م":"m","ن":"n","ه":"h","و":"w","ي":"y","ة":"h","ى":"a","ء":"",
  "أ":"a","إ":"i","آ":"a","ؤ":"w","ئ":"y",
  "а":"a","б":"b","в":"v","г":"g","д":"d","е":"e","ё":"e","ж":"zh","з":"z","и":"i",
  "й":"y","к":"k","л":"l","м":"m","н":"n","о":"o","п":"p","р":"r","с":"s","т":"t",
  "у":"u","ф":"f","х":"kh","ц":"ts","ч":"ch","ш":"sh","щ":"sch","ъ":"","ы":"y","ь":"",
  "э":"e","ю":"yu","я":"ya"
};
function asciiName(s){
  var i,c,out="";
  /* é ו-ü הם אות לטינית ועוד סימן מצורף. פירוק והסרת הסימן משאיר e ו-u. */
  try{ s=s.normalize("NFD").replace(/[\u0300-\u036f]/g,"") }catch(e){}
  for(i=0;i<s.length;i++){
    c=s.charAt(i);
    if(/[A-Za-z0-9]/.test(c)){ out+=c; continue }
    var lower=c.toLowerCase();
    if(TRLIT[lower]!==undefined){ out+=TRLIT[lower]; continue }
    out+=" ";                     /* כל השאר — רווח, שיתכווץ בהמשך */
  }
  return out.replace(/\s+/g," ").trim();
}
function csvFileName(ex){
  var t=asciiName(String(ex.spec.t||"")).slice(0,60).trim();
  var d=String(ex.date||todayIso()).replace(/[^0-9-]/g,"");
  /* כשלא נשאר כלום קריא, מזהה המבחן הוא מה שמבדיל בין שני קבצים
     שירדו באותו יום. */
  if(!t) t="exam "+String(ex.id||"").slice(0,6);
  return (t+" "+d).trim()+".csv";
}
function downloadCsv(ex){
  var txt=marksCsv(ex),url=null,a=document.createElement("a");
  try{
    url=URL.createObjectURL(new Blob([txt],{type:"text/csv;charset=utf-8"}));
  }catch(e){
    url="data:text/csv;charset=utf-8,"+encodeURIComponent(txt);
  }
  a.href=url; a.download=csvFileName(ex);
  a.style.cssText="position:fixed;inset-inline-start:-9999px";
  document.body.appendChild(a); a.click();
  setTimeout(function(){
    if(a.parentNode)a.parentNode.removeChild(a);
    if(url&&url.indexOf("blob:")===0){try{URL.revokeObjectURL(url)}catch(e){}}
  },400);
}
function marksTable(ex){
  var out=(ex.spec.t||xt("exam"))+"\n";
  out+=xt("mkTblHead")+"\n";
  (ex.subs||[]).slice().sort(function(a,b){return b.pct-a.pct}).forEach(function(s){
    var wrong=uniq(s.per.filter(function(p){return !p.ok}).map(function(p){return p.topicName}));
    out+=(s.name||xt("mkNoName"))+"\t"+s.pct+"\t"+s.ok+"/"+s.n+"\t"+wrong.join(", ")+"\n";
  });
  return out;
}

var SIT={spec:null,id:"",qs:[],i:0,name:"",answers:[],phase:"intro",code:"",copied:false};

function sitStart(){
  var nm=$("#sitName"); SIT.name=nm?nm.value.trim():"";
  SIT.qs=examQuestions(SIT.spec);
  /* אם לא נותרה אף שאלה שאפשר לבנות (למשל מבחן של אפליקציה אחרת),
     מציגים את מסך המבחן השבור במקום ליפול על שאלה שאינה קיימת. */
  if(!SIT.qs.length){view="badexam"; render(); return}
  SIT.answers=SIT.qs.map(function(){return -1});
  SIT.i=0; SIT.phase="ask";
  window.scrollTo(0,0); render();
}
function sitAnswer(i){
  if(SIT.phase!=="ask")return;
  SIT.answers[SIT.i]=i;
  sitNext();
}
function sitNext(){
  if(SIT.i+1<SIT.qs.length){SIT.i++;window.scrollTo(0,0);render();return}
  /* לא מגישים בלחיצה על תשובה. לחיצה בטעות על האפשרות האחרונה
     אינה אמורה לסיים מבחן. */
  SIT.phase="review"; stopSpeak(); window.scrollTo(0,0); render();
}
function sitGo(i){
  SIT.i=clamp(i,0,SIT.qs.length-1); SIT.phase="ask";
  window.scrollTo(0,0); render();
}
/* התוצאה נשלחת כקישור ולא כקוד: המורה לוחץ, האפליקציה נפתחת אצלו
   וקולטת. הקוד עצמו יושב אחרי #r=, ולכן גם הדבקה של הקישור השלם
   בתיבת הקוד עובדת — codeOf מחלץ אותו משם. */
function resultUrl(code){return location.origin+location.pathname+"#r="+code}
function codeOf(raw){
  var m=String(raw||"").match(/#r=([A-Za-z0-9\-_]+)/);
  return (m?m[1]:String(raw||"")).trim();
}
function sitFinish(){
  SIT.phase="done";
  SIT.code=encodeResult(SIT.id,SIT.name,SIT.answers);
  stopSpeak(); window.scrollTo(0,0); render();
}
function sitGrade(){
  var ok=0,i;
  for(i=0;i<SIT.qs.length;i++){
    var a=SIT.answers[i];
    if(a>=0&&SIT.qs[i].options[a]&&SIT.qs[i].options[a].ok)ok++;
  }
  return {ok:ok,n:SIT.qs.length,pct:Math.round(100*ok/SIT.qs.length)};
}

function copyText(txt,done){
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(done,function(){fallbackCopy(txt,done)});
      return;
    }
  }catch(e){}
  fallbackCopy(txt,done);
}
function fallbackCopy(txt,done){
  try{
    var ta=document.createElement("textarea");
    ta.value=txt; ta.setAttribute("readonly","");
    ta.style.position="fixed"; ta.style.top="-1000px";
    document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); document.body.removeChild(ta);
    done();
  }catch(e){}
}

  if(a==="exqroll"){
    var qi=parseInt(el.getAttribute("data-i"),10),ql=exSlots();

       איברים גם אם מישהו יוסיף שדה בעתיד. */

       שהמורה אישר. ערבוב כאן היה מסדר מחדש מבחן שכבר נבדק. */

              q:q,r:!!EB.tts,f:!!EB.formulas,w:true};
    if(EB.phone)spec.p=EB.phone.replace(/[^0-9]/g,"");
    EB.built=spec; EB.copied="";
    var id=examId(spec);
    if(!exFind(id)){EX.list.unshift({id:id,spec:spec,date:todayIso(),subs:[]});exSave()}
    render(); return true;
  }
  if(a==="excopy"){var u=el.getAttribute("data-v");copyText(u,function(){EB.copied="url";render()});return true}

  /* --- ציונים --- */
  if(a==="mkopen"){var i2=el.getAttribute("data-i");MK.open=MK.open===i2?"":i2;MK.msg=null;render();return true}
  /* מחיקה מוחקת גם את כל ההגשות. שאלה אחת לפני זה היא לא נימוס —
     היא ההבדל בין טעות לבין אובדן של כיתה שלמה. */

    var ex=exFind(el.getAttribute("data-i")); if(!ex)return true;

    if(mkImport(ex,res)&&ta)ta.value="";

  if(a==="sitstart"){sitStart();return true}
  if(a==="sitans"){sitAnswer(parseInt(el.getAttribute("data-i"),10));return true}
  if(a==="sitskip"){SIT.answers[SIT.i]=-1;sitNext();return true}

  if(a==="sitfinish"){sitFinish();return true}
  if(a==="sitread"){var q2=SIT.qs[SIT.i];if(q2)speak(q2.say);return true}
  if(a==="sitform"){view="formulas";render();window.scrollTo(0,0);return true}
  if(a==="sitcopy"){copyText(SIT.code,function(){SIT.copied=true;render()});return true}
  if(a==="sitback"){view="sit";render();window.scrollTo(0,0);return true}
  return false;
}

/* קליטת מבחן מהכתובת. עושים את זה לפני ה-render הראשון, אחרת
   התלמיד רואה לרגע את מסך הבית של אפליקציה שהוא לא מכיר. */
/* קולט תוצאה אחת למבחן. מחזיר true כשנשמרה; בכל מקרה משאיר הודעה
   ב-MK.msg למסך הציונים. משמש גם את תיבת ההדבקה וגם את הקישור. */
function mkImport(ex,res){
    if(res.i!==ex.id){
      var other=exFind(res.i);
      MK.msg={id:ex.id,ok:false,m:other?xf("mkErrOther",other.spec.t||xt("exam")):xt("mkErrUnknown")};
      return false;
    }
    if(res.a.length!==ex.spec.q.length){
      MK.msg={id:ex.id,ok:false,m:xt("mkErrCount")};return false}
    var g=gradeResult(ex.spec,res);
    var sub={name:res.n||"",date:res.d||todayIso(),ok:g.ok,n:g.n,pct:g.pct,per:g.per,valid:!!res.ok};
    /* הגשה חוזרת של אותו תלמיד מחליפה את הקודמת ולא מצטברת לידה */
    /* הגשה חדשה מחליפה קודמת רק כששני השמות זהים אחרי נירמול, והשם
       אינו ריק. בלי זה כל ההגשות בלי שם נראו כאותו תלמיד ודרסו זו את
       זו בשקט, וגם "דני" מול "דני  " (רווח כפול פנימי) נחשבו לשניים. */
    var nrm=function(x){return String(x==null?"":x).replace(/\s+/g," ").trim()};
    var sn=nrm(sub.name);
    var k2=sn?(ex.subs||[]).findIndex(function(s){return nrm(s.name)===sn}):-1;
    if(!ex.subs)ex.subs=[];
    if(k2>=0)ex.subs[k2]=sub; else ex.subs.push(sub);
    exSave();
    MK.msg={id:ex.id,ok:true,m:(sub.name||xt("student"))+" "+xt("mkTaken")+" · "+g.pct+" ("+g.ok+"/"+g.n+")"+
      (sub.valid?"":" · "+xt("mkNoteBad"))};
    return true;
}

   לא יקלוט שוב; קליטה חוזרת של אותו תלמיד הייתה מחליפה ולא מכפילה,
   אבל אין סיבה להשאיר קוד בשורת הכתובת. */

function wrapMain(h){return '<main id="main" tabindex="-1">'+(h||"")+'</main>'}

/* המסכים שבהם הגלאי כבוי. **המבחן הכיתתי אסור בגלאי** — ההנחיה
   מפורשת, והנימוק מבני: בונה המבחן אורז זרע והתלמיד בונה ממנו את
   אותן שאלות אצלו, ולכן כל דבר שמשתנה מלומד ללומד מפצל את המבחן
   לשניים. זה כבר קרה כאן דרך `chooseIndex` — 39 שאלות מתוך 200
   יצאו שונות בין המורה לתלמיד, ושני המסכים היו תקינים.

/* השרת של המורה חותך כל שדה הקשר ל-400 תווים (tutor-api/worker.js,
   LIM.ctx) — באמצע מילה, ובלי לדעת מה חשוב. כאן חותכים לפני, בגבול
   משפט, מתחת ל-400. משפט ראשון ארוך מהתקרה נחתך בגבול מילה עם ״…״. */
function tutorCut(t,max){t=String(t||"").replace(/\s+/g," ").trim();max=max||380;if(t.length<=max)return t;
  var s=t.match(/[^.!?]+[.!?]+["״”'’)]*\s*/g)||[],o="";
  for(var i=0;i<s.length;i++){if((o+s[i]).trim().length>max)break;o+=s[i]}
  o=o.trim();if(!o){o=t.slice(0,max-1);var k=o.lastIndexOf(" ");if(k>max*0.6)o=o.slice(0,k);o+="…"}
  return o}

       במצב רגוע הטעות הראשונה פותחת רמז לבד, ובלעדיו רק מעודדים.

function lt(k){var d=LSTR[state.settings.lang||"he"]||LSTR.he;var v=d[k];return v===undefined?(LSTR.en[k]||k):v}
var LSN={step:0,split:false,picked:-1,ok:false,p1:-1,p2:-1};
function fmt0(s,v){return s.replace("{0}",v)}
function lsBar(parts,shaded){
  var w=300,h=56,cw=w/parts,h2='';
  for(var i=0;i<parts;i++){
    h2+='<rect x="'+(i*cw+1)+'" y="1" width="'+(cw-2)+'" height="'+(h-2)+'" rx="6" fill="'+(i<shaded?'#1d4ed8':'#fff')+'" stroke="#334155" stroke-width="2"/>';
  }
  return '<svg viewBox="0 0 '+w+' '+h+'" role="img" width="100%" style="max-width:340px;display:block;margin:0 auto" aria-label="'+shaded+'/'+parts+'">'+h2+'</svg>';
}
function lsBtn(a,label,style){return '<button class="btn" data-a="'+a+'" style="min-height:46px;font-size:1.05rem;padding:12px 22px;'+(style||'')+'">'+esc(label)+'</button>'}
function lsHearBtn(text){return '<button class="btn btn-g" data-a="lshear" data-say="'+esc(text)+'" style="min-height:46px;padding:10px 16px">🔊 '+esc(lt("lsHear"))+'</button>'}
function lsOpts(list,answered,correctIdx,act){
  return '<div style="display:grid;gap:10px;margin-top:12px">'+list.map(function(o,i){
    var bg='#fff',bd='#334155',fg='#0f172a';
    if(answered>=0){
      if(i===correctIdx){bg='#0e9c8d';bd='#0e9c8d';fg='#fff'}
      else if(i===answered){bg='#bf4426';bd='#bf4426';fg='#fff'}
    }
    return '<div style="display:flex;gap:8px;align-items:stretch"><button class="btn" data-a="'+act+'" data-i="'+i+'" style="flex:1;min-height:46px;font-weight:700;font-size:1.05rem;background:'+bg+';border:2px solid '+bd+';color:'+fg+'">'+esc(o)+'</button>'+(state.settings.tts?'<button type="button" class="optspk" data-a="sayopt" data-o="'+esc(o)+'" aria-label="hear option">'+ic("speaker",15)+'</button>':"")+'</div>';
  }).join("")+'</div>';
}
function lessonView(){
  var st=LSN,h='<div class="card" style="max-width:640px;margin:18px auto;padding:22px">';

    h+='<div style="margin:10px 0">'+lsBar(4,2)+'</div>';
    h+=lsOpts(["1/4","2/4","4/4"],st.picked,1,"lspick");
    if(st.picked>=0){
      var why=st.picked===1?"":lt({0:"lsWhy0",2:"lsWhy4"}[st.picked]);
      h+='<p style="margin-top:12px;font-weight:700;color:'+(st.picked===1?'#0e9c8d':'#bf4426')+'">'+esc(st.picked===1?lt("lsCorrect"):lt("lsWrong"))+' '+esc(why)+'</p>';
      if(st.picked===1)h+='<div style="margin-top:10px">'+lsBtn("lsnext",lt("lsNext"),'background:#1d4ed8;color:#fff;font-weight:700')+'</div>';
    }
  }else if(st.step===3){

    h+='<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px">'+lsBtn("lsnext",lt("lsNext"),'background:#1d4ed8;color:#fff;font-weight:700')+lsHearBtn(lt("lsRule")+" "+lt("lsRuleEx"))+'</div>';
  }else if(st.step===4){
    h+='<p style="font-size:1.08rem;line-height:1.7">'+esc(lt("lsP1"))+'</p>';

      h+='<p style="margin-top:14px;font-size:1.08rem;line-height:1.7">'+esc(lt("lsP2"))+'</p>';
      h+=lsOpts(["10","12","15"],st.p2,2,"lsans2");

    if(st.p1>=0&&st.p1!==1)h+='<p style="margin-top:12px;font-weight:700;color:#bf4426">'+esc(lt("lsWrong"))+'</p>';
    if(st.p2>=0&&st.p2!==2)h+='<p style="margin-top:12px;font-weight:700;color:#bf4426">'+esc(lt("lsWrong"))+'</p>';
    if(st.p1===1&&st.p2===2)h+='<p style="margin-top:12px;font-weight:700;color:#0e9c8d">'+esc(lt("lsCorrect"))+'</p><div style="margin-top:10px">'+lsBtn("lsnext",lt("lsNext"),'background:#1d4ed8;color:#fff;font-weight:700')+'</div>';
  }else{
    h+='<p style="font-size:1.12rem;line-height:1.75">'+esc(lt("lsSum"))+'</p>';
    h+='<div style="margin:12px 0">'+lsBar(4,2)+'</div>';
    h+='<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px">'+lsBtn("lsagain",lt("lsAgain"),'background:#0b7c71;color:#fff;font-weight:700')+lsHearBtn(lt("lsSum"))+'</div>';
  }
  if(st.step>0&&st.step<5)h+='<div style="margin-top:14px">'+lsBtn("lsback",lt("lsBack"),'color:#475569')+'</div>';
  return h+'</div>';
}
function lessonAction(a,el){
  var st=LSN;
  if(a==="lsnext"){st.step=Math.min(st.step+1,5);st.picked=-1;render();window.scrollTo(0,0)}
  else if(a==="lsback"){st.step=Math.max(st.step-1,0);render()}
  else if(a==="lssplit"){st.split=true;render();speak(lt("lsV2"))}
  else if(a==="lspick"){st.picked=parseInt(el.getAttribute("data-i"),10);render()}
  else if(a==="lsans1"){var i1=parseInt(el.getAttribute("data-i"),10);if(st.p1!==1)st.p1=i1;render()}
  else if(a==="lsans2"){var i2=parseInt(el.getAttribute("data-i"),10);if(st.p2!==2)st.p2=i2;render()}
  else if(a==="lsagain"){LSN={step:0,split:false,picked:-1,ok:false,p1:-1,p2:-1};render()}
  else if(a==="lshear"){speak(el.getAttribute("data-say"))}
}

function geo3LessonAction(a,el){
  var st=G3SN;
  if(a==="g3next"){st.step=Math.min(st.step+1,5);st.picked=-1;render();window.scrollTo(0,0)}
  else if(a==="g3reveal"){st.revealed=true;render();speak(g3t("g3V2"))}
  else if(a==="g3pick"){st.picked=parseInt(el.getAttribute("data-i"),10);render()}
  else if(a==="g3p1"){st.p1=parseInt(el.getAttribute("data-i"),10);render()}
  else if(a==="g3p2"){st.p2=parseInt(el.getAttribute("data-i"),10);render()}
  else if(a==="g3again"){G3SN={step:0,revealed:false,picked:-1,p1:-1,p2:-1};render()}
  else if(a==="g3hear"){speak(el.getAttribute("data-say"))}
}

      var t=T(),kind=tName({id:q.kind})||q.kind;
      return {id:"r"+P.qi+"-"+(q.expr||q.text).slice(0,24), type:P.phase==="ask"?"mcq":"reveal",
        q:q.expr?q.text+" ("+q.expr+")":q.text, options:q.options.map(String),
        correct:String(q.answer), student:P.wrong.length?String(P.wrong[P.wrong.length-1]):null,
        topic:kind, level:"רמה "+activeLevel()+" מתוך 6",
        curriculum:"גאוגרפיה - אדם וסביבה ליסודי, כיתות ה׳–ו׳: "+kind};
    },
    actions:{
      next_question:{desc:"עובר לשאלה הבאה; באמצע שאלה — מדלג עליה",
        run:function(){
          if(view!=="practice"||P.phase==="done")return false;
          if(P.phase==="reveal"){advance();return true}
          onAction("skip",null);return true;
        }},
      show_hint:{desc:"מציג את הרמז הבא לשאלה שעל המסך",
        run:function(){
          if(view!=="practice"||P.phase!=="ask"||P.hints>=3)return false;
          var n=P.hints;onAction("hint",null);return P.hints>n;
        }},
      read_aloud:{desc:"מקריא את השאלה בקול",
        run:function(){
          if(view!=="practice"||!P.ses[P.qi]||P.phase==="done")return false;
          onAction("listen",null);return true;
        }},
      highlight_option:{desc:"מדגיש במסך אחת מארבע האפשרויות, לפי מקומה (0 עד 3)",
        params:{index:{type:"integer",min:0,max:3,required:true}},
        run:function(a){
          var q=P.ses[P.qi];if(!q||P.phase!=="ask")return false;
          return BARAK.highlight(document.querySelector('[data-o="'+q.options[a.index]+'"]'));
        }},
      explain_again:{desc:"מציג ומקריא שוב את ההסבר, אחרי שהשאלה נענתה",
        run:function(){
          var q=P.ses[P.qi];if(!q||P.phase!=="reveal")return false;
          setBubble(q.explain,"think");speak(q.explain);return true;
        }},
      go_screen:{desc:"עובר למסך אחר של האפליקציה",
        params:{name:{type:"string",enum:["practice","progress","records","settings"],required:true}},
        run:function(a){
          if(!state.pet||P.brk)return false;
          stopSpeak();view=a.name;
          if(view!=="practice")startRound(activeLevel());
          render();window.scrollTo(0,0);return view===a.name;
        }},
      slow_mode:{desc:"פותח את המצב האיטי: אותה שאלה צעד אחר צעד, עם עיגולים",
        run:function(){
          var q=P.ses[P.qi];if(!q||P.phase!=="ask"||!SlowMode.can(q))return false;
          if(state.settings.soundFx)sfxHint();SlowMode.open(q);return true;
        }}
    }
  });
  try{render()}catch(e){}
}
</script>
