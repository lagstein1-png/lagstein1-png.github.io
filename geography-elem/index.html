["regions",3,{"he":["למה בנו בישראל את המוביל הארצי?","כי רוב המים בצפון, וצריך אותם גם בדרום","כי בצפון אין בכלל מים לשתייה","כי מי הכנרת מלוחים מדי לשתייה","כי בדרום יורד יותר גשם מאשר בצפון, והמוביל מעביר את המים העודפים צפונה","חשבו איפה יורד הרבה גשם, ואיפה יש הרבה שדות ואנשים.","צינור ארוך פותר בעיה של מרחק בין מקור המים לבין מי שצריך אותם.","רוב מקורות המים בישראל נמצאים בצפון. המוביל הארצי מעביר מים למרכז ולדרום, שם המים חסרים."],"en":["Why did Israel build the National Water Carrier?","Because most water is in the north, but the south needs it too","Because the north has no drinking water at all","Because the Sea of Galilee water is too salty to drink","Because more rain falls in the south than in the north, and the carrier moves the extra water up north","Think about where a lot of rain falls, and where there are many fields and people.","A long pipe solves a problem of distance between the water source and those who need it.","Most of Israel's water sources are in the north. The National Water Carrier moves water to the center and the south, where water is missing."],"ru":["Зачем в Израиле построили Национальный водовод?","Потому что больше всего воды на севере, а нужна она и на юге","Потому что на севере совсем нет питьевой воды","Потому что вода Кинерета слишком солёная для питья","Потому что на юге выпадает больше дождя, чем на севере, и водовод подаёт лишнюю воду на север","Подумайте, где выпадает много дождя, а где много полей и людей.","Длинная труба решает проблему расстояния между источником воды и теми, кому она нужна.","Большинство источников воды в Израиле находится на севере. Национальный водовод переносит воду в центр и на юг, где воды не хватает."],"ar":["لماذا بنوا في إسرائيل الناقل القطري للمياه؟","لأن معظم الماء في الشمال، والجنوب يحتاجه أيضًا","لأن الشمال ليس فيه ماء للشرب أبدًا","لأن مياه بحيرة طبريا مالحة جدًا للشرب","لأن الجنوب ينزل فيه مطر أكثر من الشمال، والناقل ينقل الماء الزائد إلى الشمال","فكروا أين ينزل مطر كثير، وأين توجد حقول وناس كثيرون.","أنبوب طويل يحل مشكلة المسافة بين مصدر الماء ومن يحتاجه.","معظم مصادر الماء في إسرائيل موجودة في الشمال. الناقل القطري ينقل الماء إلى الوسط والجنوب، حيث ينقص الماء."]}],
["regions",3,{"he":["היום ישראל מתפילה הרבה מי ים, כלומר הופכת אותם למים מתוקים. למה?","כי מי הגשם לא מספיקים לכל התושבים","כי מי הים מתוקים יותר ממי הכנרת","כי בישראל יורד גשם כל השנה","כי אסור לשתות בכלל מים מהכנרת","חשבו כמה אנשים גרים בארץ, וכמה גשם יורד בה.","ים יש לנו הרבה. השאלה היא אם מהשמיים מגיע מספיק.","בישראל יורד גשם רק בחורף, ולא תמיד מספיק. התפלה נותנת עוד מים מתוקים מהים, גם בשנים יבשות."],"en":["Today Israel desalinates a lot of sea water, which means it turns it into fresh water. Why?","Because rainwater is not enough for all the people","Because sea water is fresher than the Sea of Galilee","Because in Israel it rains all year long","Because drinking Sea of Galilee water is forbidden","Think about how many people live in the country, and how much rain falls there.","We have plenty of sea. The question is whether enough comes from the sky.","In Israel, rain falls only in winter, and it is not always enough. Desalination gives more fresh water from the sea, even in dry years."],"ru":["Сегодня Израиль опресняет много морской воды, то есть делает её пресной. Почему?","Потому что дождевой воды не хватает всем жителям","Потому что морская вода преснее, чем в Кинерете","Потому что в Израиле дождь идёт круглый год","Потому что пить воду из Кинерета запрещено","Подумайте, сколько людей живёт в стране и сколько там выпадает дождя.","Моря у нас много. Вопрос в том, достаточно ли воды приходит с неба.","В Израиле дождь идёт только зимой, и его не всегда хватает. Опреснение даёт больше пресной воды из моря, даже в сухие годы."],"ar":["اليوم تحلّي إسرائيل كثيرًا من مياه البحر، أي تحوّلها إلى ماء عذب. لماذا؟","لأن مياه المطر لا تكفي جميع السكان","لأن مياه البحر أعذب من مياه بحيرة طبريا","لأن المطر ينزل في إسرائيل طوال السنة","لأنه يُمنع شرب الماء من بحيرة طبريا","فكروا كم شخصًا يسكن في البلاد، وكم مطرًا ينزل فيها.","البحر عندنا كبير. السؤال هو هل يأتي ما يكفي من السماء.","في إسرائيل ينزل المطر في الشتاء فقط، ولا يكفي دائمًا. التحلية تعطي ماءً عذبًا إضافيًا من البحر، حتى في السنوات الجافة."]}],
["regions",3,{"he":["חקלאים בערבה מגדלים ירקות בחורף ושולחים אותם לאירופה. מה היתרון של הערבה?","בחורף חם בה, וירקות גדלים כשבאירופה קר","בחורף יורד בה הרבה גשם על השדות","האדמה בה מלאה במים מתוקים מתחת","הערבה קרובה מאוד לאירופה בדרך הים, ולכן הירקות מגיעים לשם באותו יום","השוו את מזג האוויר בדרום הארץ בינואר למזג האוויר בארצות קרות.","חשבו מתי קשה לגדל ירקות בשדה פתוח בארץ מושלגת.","בערבה חם גם בחורף, ולכן ירקות גדלים שם. באותו זמן באירופה קר, וקשה לגדל בה ירקות בשדה."],"en":["Farmers in the Arava grow vegetables in winter and send them to Europe. What is the Arava's advantage?","Warm winters, so crops grow while Europe is cold","A lot of rain falls on its fields every winter","Its soil is full of fresh water underneath","The Arava is very close to Europe by sea, so the vegetables reach Europe on the same day","Compare the weather in the south of Israel in January to the weather in cold countries.","Think about when it is hard to grow vegetables in an open field in a snowy country.","In the Arava it is warm even in winter, so vegetables grow there. At the same time it is cold in Europe, and it is hard to grow vegetables in its fields."],"ru":["Фермеры в Араве выращивают овощи зимой и отправляют их в Европу. В чём преимущество Аравы?","Зимой там тепло, и овощи растут, когда в Европе холодно","Зимой на её поля выпадает много дождя","Её земля полна пресной воды под поверхностью","Арава очень близко к Европе по морю, поэтому овощи попадают туда в тот же день","Сравните погоду на юге Израиля в январе с погодой в холодных странах.","Подумайте, когда трудно выращивать овощи в открытом поле в снежной стране.","В Араве тепло даже зимой, поэтому там растут овощи. В это же время в Европе холодно, и там трудно выращивать овощи в поле."],"ar":["مزارعون في وادي عربة يزرعون الخضار في الشتاء ويرسلونها إلى أوروبا. ما ميزة وادي عربة؟","الشتاء فيه دافئ، فتنمو الخضار حين يكون البرد في أوروبا","ينزل على حقوله مطر كثير في الشتاء","تربته مليئة بالماء العذب من تحتها","وادي عربة قريب جدًا من أوروبا عن طريق البحر، لذلك تصل الخضار إلى هناك في اليوم نفسه","قارنوا الطقس في جنوب إسرائيل في كانون الثاني بالطقس في البلدان الباردة.","فكروا متى يصعب زرع الخضار في حقل مفتوح في بلد مغطى بالثلج.","في وادي عربة الجو دافئ حتى في الشتاء، لذلك تنمو الخضار هناك. وفي الوقت نفسه يكون الجو باردًا في أوروبا، ويصعب زرع الخضار في حقولها."]}],
["regions",3,{"he":["מדבר יהודה קרוב מאוד לירושלים, ובכל זאת יורד בו מעט גשם. למה?","העננים מורידים את רוב הגשם על ההרים, ומזרחה נשאר מעט","כי מדבר יהודה קרוב יותר לים התיכון מירושלים","כי מדבר יהודה גבוה הרבה יותר מירושלים","כי בחורף אין מעל מדבר יהודה עננים בכלל","העננים מגיעים מהים שבמערב ונעים מזרחה. מה הם פוגשים בדרך?","דמיינו ספוג רטוב שנסחט על פסגת ההר. כמה מים נשארים בו אחר כך?","העננים באים מהים ומורידים גשם כשהם עולים על הרים. מצד מזרח של ההרים כבר נשאר בהם מעט גשם, ולכן שם מדבר."],"en":["The Judean Desert is very close to Jerusalem, yet little rain falls there. Why?","The clouds drop most rain on the mountains, and little is left eastward","Because the Judean Desert is closer to the Mediterranean than Jerusalem","Because the Judean Desert is much higher than Jerusalem","Because in winter there are no clouds over the Judean Desert at all","Clouds come from the sea in the west and move east. What do they meet on the way?","Imagine a wet sponge squeezed on a mountain top. How much water is left in it afterwards?","The clouds come from the sea and drop rain when they rise over mountains. On the east side of the mountains little rain is left in them, so there is a desert there."],"ru":["Иудейская пустыня очень близко к Иерусалиму, и всё же дождя там мало. Почему?","Тучи отдают большую часть дождя горам, и к востоку остаётся мало","Потому что Иудейская пустыня ближе к Средиземному морю, чем Иерусалим","Потому что Иудейская пустыня намного выше Иерусалима","Потому что зимой над Иудейской пустыней вообще нет туч","Тучи приходят с моря на западе и движутся на восток. Что они встречают по пути?","Представьте мокрую губку, которую выжали на вершине горы. Сколько воды в ней осталось потом?","Тучи приходят с моря и проливают дождь, когда поднимаются над горами. На восточной стороне гор в них остаётся мало дождя, поэтому там пустыня."],"ar":["صحراء يهودا قريبة جدًا من القدس، ومع ذلك ينزل فيها مطر قليل. لماذا؟","الغيوم تُسقط معظم المطر على الجبال، ويبقى القليل للشرق","لأن صحراء يهودا أقرب إلى البحر المتوسط من القدس","لأن صحراء يهودا أعلى بكثير من القدس","لأنه في الشتاء لا توجد غيوم فوق صحراء يهودا أبدًا","الغيوم تأتي من البحر في الغرب وتتحرك نحو الشرق. ماذا تصادف في الطريق؟","تخيلوا إسفنجة مبللة عُصرت على قمة جبل. كم ماءً يبقى فيها بعد ذلك؟","الغيوم تأتي من البحر وتُسقط المطر عندما تصعد فوق الجبال. في الجهة الشرقية من الجبال يبقى فيها مطر قليل، لذلك توجد هناك صحراء."]}],
["regions",3,{"he":["בצפון יש נחלים שזורמים כל השנה, כמו הדן והבניאס. בנגב כמעט אין כאלה. למה?","בצפון יש יותר גשם, שלג ומעיינות שמזינים אותם","כי בצפון אין קיץ, ולכן המים לא מתייבשים","כי בנגב מכסים את הנחלים בחול כדי לשמור עליהם","כי בצפון שואבים מים מהים אל תוך הנחלים","חשבו מאיפה נחל מקבל מים גם באוגוסט, כשאין גשם בכלל.","דמיינו את השלג על ההר הגבוה בצפון, שנמס לאט ונכנס לאדמה.","בצפון יורד הרבה גשם, ועל החרמון יורד גם שלג. המים נכנסים לאדמה ויוצאים במעיינות, ולכן הנחלים שם זורמים כל השנה."],"en":["In the north there are streams that flow all year, like the Dan and the Banias. The Negev has almost none. Why?","The north has more rain, snow and springs that feed them","Because there is no summer in the north, so water does not dry up","Because in the Negev they cover streams with sand to protect them","Because in the north they pump sea water into the streams","Think about where a stream gets water even in August, when there is no rain at all.","Imagine the snow on the high mountain in the north, slowly melting into the ground.","A lot of rain falls in the north, and snow also falls on the Hermon. The water goes into the ground and comes out in springs, so the streams there flow all year."],"ru":["На севере есть ручьи, которые текут круглый год, например Дан и Баниас. В Негеве таких почти нет. Почему?","На севере больше дождя, снега и родников, которые их питают","Потому что на севере нет лета, и вода не высыхает","Потому что в Негеве ручьи засыпают песком, чтобы сберечь их","Потому что на севере в ручьи качают воду из моря","Подумайте, откуда ручей получает воду даже в августе, когда дождя нет совсем.","Представьте снег на высокой горе на севере, который медленно тает и уходит в землю.","На севере выпадает много дождя, а на Хермоне ещё и снег. Вода уходит в землю и выходит в родниках, поэтому ручьи там текут круглый год."],"ar":["في الشمال مجاري مياه تجري طوال السنة، مثل الدان وبانياس. في النقب لا يكاد يوجد مثلها. لماذا؟","في الشمال مطر وثلج وينابيع أكثر تغذيها","لأنه لا صيف في الشمال، فلا يجف الماء","لأن الوديان في النقب تُغطى بالرمل لحمايتها","لأنهم في الشمال يضخون ماء البحر إلى المجاري","فكروا من أين يحصل المجرى على الماء حتى في آب، حين لا يوجد مطر أبدًا.","تخيلوا الثلج على الجبل العالي في الشمال، يذوب ببطء ويدخل إلى الأرض.","في الشمال ينزل مطر كثير، وعلى جبل الشيخ ينزل الثلج أيضًا. الماء يدخل إلى الأرض ويخرج في ينابيع، لذلك تجري المجاري هناك طوال السنة."]}],
["regions",3,{"he":["בעבר, ישובים רבים בארץ נבנו ליד מעיין או נחל. למה?","כי אנשים צריכים מים לשתייה ולחקלאות","כי ליד מעיין תמיד יש פחות שמש","כי ליד נחל אי אפשר לבנות דרכים","כי מעיינות נמצאים רק על פסגות הרים","דמיינו שאין ברז ואין צינורות. מה הדבר הראשון שתחפשו כשתבחרו איפה לגור?","חשבו מה צריכים כל יום אדם, צמח ובהמה.","פעם לא היו צינורות. אנשים גרו ליד מקור מים, כדי לשתות, להשקות שדות ולתת לבהמות."],"en":["In the past, many settlements in the land were built near a spring or a stream. Why?","Because people need water for drinking and farming","Because near a spring there is always less sun","Because near a stream it is impossible to build roads","Because springs are found only on mountain tops","Imagine there are no taps and no pipes. What is the first thing you would look for when choosing where to live?","Think about what a person, a plant and an animal need every day.","In the past there were no pipes. People lived near a water source, to drink, water fields and give water to animals."],"ru":["В прошлом многие поселения в стране строили возле родника или ручья. Почему?","Потому что людям нужна вода для питья и сельского хозяйства","Потому что у родника всегда меньше солнца","Потому что у ручья нельзя строить дороги","Потому что родники бывают только на вершинах гор","Представьте, что нет кранов и нет труб. Что вы будете искать первым, когда выбираете, где жить?","Подумайте, что каждый день нужно человеку, растению и животному.","Раньше не было труб. Люди жили возле источника воды, чтобы пить, поливать поля и поить животных."],"ar":["في الماضي، بُنيت بلدات كثيرة في البلاد بجانب نبع أو مجرى ماء. لماذا؟","لأن الناس يحتاجون الماء للشرب والزراعة","لأن الشمس أقل دائمًا بجانب النبع","لأنه لا يمكن بناء طرق بجانب المجرى","لأن الينابيع توجد فقط على قمم الجبال","تخيلوا أنه لا توجد حنفيات ولا أنابيب. ما أول شيء ستبحثون عنه عندما تختارون أين تسكنون؟","فكروا فيما يحتاجه كل يوم الإنسان والنبتة والحيوان.","في الماضي لم تكن هناك أنابيب. الناس سكنوا بجانب مصدر ماء، ليشربوا ويسقوا الحقول ويعطوا الماء للحيوانات."]}],
["regions",3,{"he":["בישראל מנקים מי ביוב ומשקים בהם שדות. למה זה חשוב?","כך חוסכים מים מתוקים בארץ שיש בה מעט מים","כי מי ביוב טעימים יותר לצמחים ממי גשם","כי אסור להשקות שדות במים ממקור אחר","כי כך מכניסים יותר מלח לאדמה של השדות","חשבו על מים שכבר השתמשו בהם בבית. האם אפשר לתת להם עוד תפקיד?","כל טיפה שהשדה מקבל ממקור אחר נשארת לשתייה.","מים מטוהרים טובים להשקיה, אבל לא לשתייה. כשמשקים בהם, נשארים יותר מים מתוקים לאנשים."],"en":["In Israel, sewage water is cleaned and used to water fields. Why is this important?","It saves fresh water in a land with little water","Because sewage water tastes better to plants than rain","Because watering fields from any other source is forbidden","Because it puts more salt into the soil of the fields","Think about water that was already used at home. Can it be given another job?","Every drop the field gets from another source is left for drinking.","Cleaned water is good for watering, but not for drinking. When fields are watered with it, more fresh water is left for people."],"ru":["В Израиле очищают сточные воды и поливают ими поля. Почему это важно?","Так экономят пресную воду в стране, где воды мало","Потому что сточная вода вкуснее для растений, чем дождь","Потому что поливать поля из других источников запрещено","Потому что так в землю полей попадает больше соли","Подумайте о воде, которой уже пользовались дома. Можно ли дать ей ещё одну работу?","Каждая капля, которую поле получает из другого источника, остаётся для питья.","Очищенная вода хороша для полива, но не для питья. Когда поля поливают ею, людям остаётся больше пресной воды."],"ar":["في إسرائيل تُنظَّف مياه الصرف ويُسقى بها الحقول. لماذا هذا مهم؟","هكذا يُوفَّر الماء العذب في بلد ماؤه قليل","لأن مياه الصرف ألذ للنباتات من مياه المطر","لأنه يُمنع سقي الحقول من أي مصدر آخر","لأنه هكذا يدخل ملح أكثر إلى تربة الحقول","فكروا في ماء استُعمل في البيت. هل يمكن إعطاؤه مهمة أخرى؟","كل قطرة يحصل عليها الحقل من مصدر آخر تبقى للشرب.","الماء المنقّى جيد للري، لكن ليس للشرب. عندما تُسقى به الحقول، يبقى ماء عذب أكثر للناس."]}],
["regions",3,{"he":["למה תיירים רבים מגיעים לאילת דווקא בחורף?","כי גם בחורף שם חם ושמשי","כי בחורף יורד שם הרבה שלג","כי בקיץ הים שם קופא לגמרי","כי בחורף יש שם הכי הרבה גשם","השוו את אילת בינואר לעיר בצפון אירופה בינואר.","אילת נמצאת בקצה הדרומי של הארץ, ליד המדבר.","אילת נמצאת בדרום, במדבר. בחורף מזג האוויר שם נעים, ואפשר לשחות בים כשבמקומות אחרים קר."],"en":["Why do many tourists come to Eilat especially in winter?","Because even in winter it is warm and sunny there","Because a lot of snow falls there in winter","Because in summer the sea there freezes completely","Because there is the most rain there in winter","Compare Eilat in January to a city in northern Europe in January.","Eilat is at the southern tip of the country, next to the desert.","Eilat is in the south, in the desert. In winter the weather there is pleasant, and you can swim in the sea while it is cold elsewhere."],"ru":["Почему многие туристы приезжают в Эйлат именно зимой?","Потому что даже зимой там тепло и солнечно","Потому что зимой там выпадает много снега","Потому что летом море там полностью замерзает","Потому что зимой там больше всего дождей","Сравните Эйлат в январе с городом на севере Европы в январе.","Эйлат находится на южном краю страны, рядом с пустыней.","Эйлат на юге, в пустыне. Зимой погода там приятная, и можно купаться в море, когда в других местах холодно."],"ar":["لماذا يأتي سياح كثيرون إلى إيلات في الشتاء بالذات؟","لأن الجو هناك دافئ ومشمس حتى في الشتاء","لأنه ينزل هناك ثلج كثير في الشتاء","لأن البحر هناك يتجمد كليًا في الصيف","لأن هناك أكثر مطر في الشتاء","قارنوا إيلات في كانون الثاني بمدينة في شمال أوروبا في كانون الثاني.","إيلات تقع في الطرف الجنوبي من البلاد، بجانب الصحراء.","إيلات في الجنوب، في الصحراء. في الشتاء يكون الطقس هناك لطيفًا، ويمكن السباحة في البحر حين يكون الجو باردًا في أماكن أخرى."]}],
["regions",3,{"he":["גובה המים בים המלח יורד משנה לשנה. מה אחת הסיבות?","פחות מים מגיעים אליו מהירדן, והשמש מאדה אותם","כי דגים רבים שותים את המים שלו","כי בחורף יורד עליו יותר מדי גשם","כי המים שלו זורמים החוצה לים התיכון, ובכל שנה יוצאים ממנו עוד מים","חשבו מה נכנס לים המלח, ומה יוצא ממנו.","אנשים משתמשים במים של הכנרת ושל הנהר שמזרים מצפון לדרום.","אנשים משתמשים בהרבה מהמים שהיו זורמים לים המלח. החום מאדה מים כל הזמן, ולכן הים הולך וקטן."],"en":["The water level of the Dead Sea drops every year. What is one reason?","Less Jordan water reaches it, and the sun evaporates it","Because many fish drink its water","Because too much rain falls on it in winter","Because its water flows out to the Mediterranean, and more of it flows out every year","Think about what goes into the Dead Sea, and what goes out of it.","People use the water of the Sea of Galilee and of the river that flows from north to south.","People use much of the water that used to flow into the Dead Sea. The heat keeps evaporating water, so the sea keeps shrinking."],"ru":["Уровень воды в Мёртвом море падает из года в год. Какая одна из причин?","К нему доходит меньше воды из Иордана, а солнце её испаряет","Потому что много рыб пьют его воду","Потому что зимой на него выпадает слишком много дождя","Потому что его вода вытекает в Средиземное море, и каждый год из него уходит всё больше воды","Подумайте, что втекает в Мёртвое море и что из него уходит.","Люди используют воду Кинерета и реки, которая течёт с севера на юг.","Люди используют много воды, которая раньше текла в Мёртвое море. Жара всё время испаряет воду, поэтому море уменьшается."],"ar":["مستوى الماء في البحر الميت ينخفض من سنة إلى سنة. ما أحد الأسباب؟","ماء أقل يصله من نهر الأردن، والشمس تبخّره","لأن أسماكًا كثيرة تشرب ماءه","لأنه ينزل عليه مطر كثير جدًا في الشتاء","لأن ماءه يجري إلى الخارج نحو البحر المتوسط، ويخرج منه كل سنة ماء أكثر","فكروا فيما يدخل إلى البحر الميت، وما يخرج منه.","الناس يستعملون مياه بحيرة طبريا ومياه النهر الذي يجري من الشمال إلى الجنوب.","الناس يستعملون كثيرًا من الماء الذي كان يجري إلى البحر الميت. الحرارة تبخّر الماء طوال الوقت، لذلك البحر يصغر."]}],
["regions",3,{"he":["מטיילים בנחל יבש בנגב, והשמיים מעליהם כחולים. פתאום מגיע שיטפון. איך זה ייתכן?","גשם ירד רחוק, במעלה הנחל, והמים זרמו עד לכאן","המים עלו מהים דרך האדמה אל הנחל","השמש החזקה המיסה את החול והפכה אותו למים, ולכן שיטפונות קורים בימים הכי חמים","רוח חזקה דחפה לכאן מים מהכנרת","נחל הוא כמו מגלשה ארוכה. מים שנכנסים בראש שלה מגיעים לסוף שלה.","חשבו: האם העננים חייבים להיות בדיוק מעל המקום שבו אתם עומדים?","שיטפון יכול להגיע מגשם שירד הרבה קילומטרים משם. לכן בודקים את התחזית לכל האזור לפני טיול בנחל."],"en":["Hikers walk in a dry stream in the Negev, and the sky above them is blue. Suddenly a flash flood arrives. How can this be?","Rain fell far away, upstream, and the water flowed down to here","The water rose from the sea through the ground into the stream","The strong sun melted the sand and turned it into water, so floods happen on the hottest days","A strong wind pushed water here from the Sea of Galilee","A stream is like a long slide. Water that goes in at the top reaches the bottom.","Think: do the clouds have to be exactly above the place where you stand?","A flash flood can come from rain that fell many kilometers away. That is why we check the forecast for the whole area before hiking in a stream."],"ru":["Туристы идут по сухому руслу в Негеве, и небо над ними голубое. Вдруг приходит паводок. Как это возможно?","Дождь прошёл далеко, выше по руслу, и вода дотекла сюда","Вода поднялась из моря через землю в ручей","Сильное солнце растопило песок и превратило его в воду, поэтому паводки бывают в самые жаркие дни","Сильный ветер пригнал сюда воду из Кинерета","Русло похоже на длинную горку. Вода, которая попала наверх, доходит до низа.","Подумайте: обязательно ли тучи должны быть прямо над тем местом, где вы стоите?","Паводок может прийти от дождя, который прошёл за много километров. Поэтому перед походом по руслу проверяют прогноз для всего района."],"ar":["متنزهون يمشون في وادٍ جاف في النقب، والسماء فوقهم زرقاء. فجأة يصل سيل. كيف يمكن هذا؟","نزل مطر بعيدًا، في أعلى الوادي، وجرى الماء حتى هنا","صعد الماء من البحر عبر الأرض إلى الوادي","الشمس القوية أذابت الرمل وحوّلته إلى ماء، لذلك تحدث السيول في أشد الأيام حرًا","ريح قوية دفعت إلى هنا ماءً من بحيرة طبريا","الوادي مثل زلاجة طويلة. الماء الذي يدخل في أعلاها يصل إلى أسفلها.","فكروا: هل يجب أن تكون الغيوم فوق المكان الذي تقفون فيه بالضبط؟","السيل يمكن أن يأتي من مطر نزل على بعد كيلومترات كثيرة. لذلك نفحص توقعات الطقس للمنطقة كلها قبل التنزه في الوادي."]}],
["jeru",1,{"he":["מהי בירת ישראל?","ירושלים","תל אביב","חיפה","באר שבע","חשבו איפה יושבת הכנסת, בית הנבחרים של המדינה.","שמה של העיר מופיע בהמנון, בתפילות ובחדשות על הממשלה.","ירושלים היא בירת ישראל: בה יושבים הכנסת, משכן הנשיא ומשרדי הממשלה."],"en":["What is the capital of Israel?","Jerusalem","Tel Aviv","Haifa","Be'er Sheva","Think about where the Knesset sits, the parliament of the state.","The city's name appears in the anthem, in prayers and in the news about the government.","Jerusalem is the capital of Israel: the Knesset, the President's Residence and the government offices sit there."],"ru":["Что является столицей Израиля?","Иерусалим","Тель-Авив","Хайфа","Беэр-Шева","Подумайте, где заседает Кнессет, парламент государства.","Название города встречается в гимне, в молитвах и в новостях о правительстве.","Иерусалим это столица Израиля: там находятся Кнессет, резиденция президента и правительственные учреждения."],"ar":["ما عاصمة إسرائيل؟","القدس","تل أبيب","حيفا","بئر السبع","فكروا أين تقع الكنيست، برلمان الدولة.","اسم المدينة يظهر في النشيد، وفي الصلوات وفي أخبار الحكومة.","القدس هي عاصمة إسرائيل: فيها الكنيست ومقر الرئيس ومكاتب الحكومة."]}],
["jeru",1,{"he":["איזה אתר בעיר העתיקה קדוש במיוחד ליהודים, ואליו באים להתפלל?","הכותל המערבי","שוק מחנה יהודה","גן החיות התנכי","מגדל דוד","חשבו על המקום הקדוש ביותר ליהודים, שקשור לבית המקדש העתיק.","בדקו איזו מהאפשרויות היא חומה עתיקה, ולא שוק, גן חיות או מגדל.","הכותל המערבי הוא שריד החומה של הר הבית. הוא המקום הקדוש ביותר שבו יהודים מתפללים."],"en":["Which site in the Old City is especially holy to Jews, and people come to it to pray?","The Western Wall","Mahane Yehuda market","The Biblical Zoo","The Tower of David","Think about the holiest place for Jews, connected to the ancient Temple.","Check which of the options is an ancient wall, and not a market, a zoo or a tower.","The Western Wall is a remnant of the Temple Mount wall. It is the holiest place where Jews pray."],"ru":["Какое место в Старом городе особенно свято для евреев, и к нему приходят молиться?","Западная стена","Рынок Махане Иегуда","Библейский зоопарк","Башня Давида","Подумайте о самом святом месте для евреев, связанном с древним Храмом.","Проверьте, какой из вариантов является древней стеной, а не рынком, зоопарком или башней.","Западная стена это остаток стены Храмовой горы. Это самое святое место, где евреи молятся."],"ar":["أي موقع في البلدة القديمة مقدس بشكل خاص لليهود، ويأتون إليه للصلاة؟","حائط المبكى (الحائط الغربي)","سوق محانيه يهودا","حديقة الحيوانات التوراتية","برج داود","فكروا في المكان الأقدس لليهود، المرتبط بالهيكل القديم.","تحققوا أي من الخيارات هو سور قديم، وليس سوقًا أو حديقة حيوانات أو برجًا.","الحائط الغربي هو بقية سور جبل الهيكل. هو أقدس مكان يصلي فيه اليهود."]}],
["jeru",1,{"he":["מה מקיף את העיר העתיקה של ירושלים עד היום?","חומת אבן עתיקה עם שערים","גדר תיל מודרנית עם מצלמות","נהר עמוק עם גשרים קטנים","קיר ענק מזכוכית שקופה","חשבו איך הגנו על עיר לפני מאות שנים: מה בונים סביבה?","נכנסים לעיר העתיקה דרך שערים מפורסמים כמו שער יפו. דרך מה עוברים בשער?","העיר העתיקה מוקפת חומת אבן שנבנתה לפני מאות שנים. נכנסים אליה דרך שערים, כמו שער יפו ושער האשפות."],"en":["What surrounds the Old City of Jerusalem to this day?","An ancient stone wall with gates","A modern wire fence with cameras","A deep river with small bridges","A giant wall made of clear glass","Think about how a city was defended hundreds of years ago: what do you build around it?","People enter the Old City through famous gates like Jaffa Gate. What does a gate pass through?","The Old City is surrounded by a stone wall built hundreds of years ago. People enter it through gates, like Jaffa Gate and Damascus Gate."],"ru":["Что окружает Старый город Иерусалима до сегодняшнего дня?","Древняя каменная стена с воротами","Новый проволочный забор с камерами","Глубокая река с маленькими мостами","Огромная стена из прозрачного стекла","Подумайте, как защищали город сотни лет назад: что строят вокруг него?","В Старый город входят через знаменитые ворота вроде Яффских ворот. Через что проходит ворота?","Старый город окружён каменной стеной, построенной сотни лет назад. Входят в него через ворота, как Яффские ворота и Дамасские ворота."],"ar":["ما الذي يحيط بالبلدة القديمة في القدس حتى اليوم؟","سور حجري قديم له بوابات","سياج سلكي حديث مع كاميرات","نهر عميق عليه جسور صغيرة","جدار ضخم من زجاج شفاف","فكروا كيف كانت تُحمى المدينة قبل مئات السنين: ماذا يُبنى حولها؟","يدخل الناس البلدة القديمة عبر بوابات مشهورة مثل باب الخليل (يافا). عبر ماذا تمر البوابة؟","البلدة القديمة محاطة بسور حجري بُني قبل مئات السنين. يدخل إليها الناس عبر بوابات، مثل باب الخليل وباب العامود."]}],
["jeru",1,{"he":["איזה שוק מפורסם בירושלים מלא בפירות, תבלינים ומאפים?","שוק מחנה יהודה","הבורסה ליהלומים","הקניון הגדול","שוק הדגים של אילת","חשבו איפה קונים פירות טריים, חלה ותבלינים בשישי בבוקר בירושלים.","בדקו איזו אפשרות היא שוק אוכל ירושלמי, ולא בורסה, קניון או שוק דגים.","שוק מחנה יהודה הוא השוק המפורסם של ירושלים, מלא דוכני פירות, תבלינים ומאפים טריים."],"en":["Which famous market in Jerusalem is full of fruits, spices and pastries?","Mahane Yehuda market","The diamond exchange","The big mall","The fish market of Eilat","Think about where people buy fresh fruit, challah and spices on Friday morning in Jerusalem.","Check which option is a Jerusalem food market, and not an exchange, a mall or a fish market.","Mahane Yehuda is Jerusalem's famous market, full of fruit stalls, spices and fresh pastries."],"ru":["Какой знаменитый рынок в Иерусалиме полон фруктов, специй и выпечки?","Рынок Махане Иегуда","Алмазная биржа","Большой торговый центр","Рыбный рынок Эйлата","Подумайте, где покупают свежие фрукты, халу и специи в пятницу утром в Иерусалиме.","Проверьте, какой вариант является иерусалимским продовольственным рынком, а не биржей, торговым центром или рыбным рынком.","Махане Иегуда это знаменитый рынок Иерусалима, полный прилавков с фруктами, специями и свежей выпечкой."],"ar":["أي سوق مشهور في القدس مليء بالفواكه والتوابل والمخبوزات؟","سوق محانيه يهودا","بورصة الألماس","المركز التجاري الكبير","سوق السمك في إيلات","فكروا أين يشترون فواكه طازجة وخبزًا وتوابل صباح الجمعة في القدس.","تحققوا أي خيار هو سوق طعام مقدسي، وليس بورصة أو مركزًا تجاريًا أو سوق سمك.","سوق محانيه يهودا هو السوق المشهور في القدس، مليء بأكشاك الفواكه والتوابل والمخبوزات الطازجة."]}],
["jeru",1,{"he":["מהי הכנסת?","בית הנבחרים של ישראל, שם עושים את החוקים","תחנת משטרה גדולה, שם עוצרים את הגנבים","בית החולים של העיר, שם מטפלים בחולים","מוזיאון למטוסים, שם רואים מטוסים ישנים","חשבו מי מחליט על חוקי המדינה ואיפה הם מתכנסים.","בדקו איזו אפשרות קשורה לחוקים ולהצבעות, ולא למשטרה, לרפואה או למטוסים.","הכנסת היא בית הנבחרים: מאה ועשרים חברי כנסת שנבחרו על ידי העם מחוקקים בה את חוקי המדינה."],"en":["What is the Knesset?","Israel's parliament, where the laws are made","A big police station, where thieves are caught","The city's hospital, where sick people get care","A museum of airplanes, showing old planes","Think about who decides on the state's laws and where they gather.","Check which option is connected to laws and votes, and not to police, medicine or airplanes.","The Knesset is the parliament: one hundred and twenty elected members make the state's laws there."],"ru":["Что такое Кнессет?","Парламент Израиля, где принимают законы","Большой участок полиции, где ловят воров","Городская больница, где лечат больных","Музей, где показывают старые самолёты","Подумайте, кто решает законы государства и где они собираются.","Проверьте, какой вариант связан с законами и голосованиями, а не с полицией, медициной или самолётами.","Кнессет это парламент: сто двадцать избранных народом депутатов принимают в нём законы государства."],"ar":["ما هي الكنيست؟","برلمان إسرائيل، حيث تُصنع القوانين","مركز شرطة كبير، حيث يُقبض على اللصوص","مستشفى المدينة، حيث يُعالج المرضى","متحف للطائرات، حيث تُعرض طائرات قديمة","فكروا من يقرر قوانين الدولة وأين يجتمعون.","تحققوا أي خيار مرتبط بالقوانين والتصويت، وليس بالشرطة أو الطب أو الطائرات.","الكنيست هي البرلمان: مئة وعشرون عضوًا منتخبون من الشعب يسنّون فيها قوانين الدولة."]}],
["jeru",1,{"he":["בירושלים יש רכבת שנוסעת על פסים ברחובות העיר. איך קוראים לה?","הרכבת הקלה","רכבת הים המהירה","הרכבת התת קרקעית","הרכבת המעופפת","חשבו על רכבת שנוסעת על פסים ברחוב, לא תחת האדמה.","בדקו איזו אפשרות אמיתית: בירושלים אין רכבת תת קרקעית, ובטח לא מעופפת.","הרכבת הקלה של ירושלים נוסעת על פסים ברחובות העיר ומחברת שכונות למרכז."],"en":["Jerusalem has a train that runs on tracks in the city streets. What is it called?","The light rail","The fast sea train","The subway","The flying train","Think about a train that runs on tracks in the street, not under the ground.","Check which option is real: Jerusalem has no subway, and certainly no flying train.","Jerusalem's light rail runs on tracks in the city streets and connects neighborhoods to the center."],"ru":["В Иерусалиме есть поезд, который ездит на рельсах по улицам города. Как он называется?","Лёгкий трамвай","Быстрый морской поезд","Метро","Летающий поезд","Подумайте о поезде, который едет на рельсах по улице, а не под землёй.","Проверьте, какой вариант настоящий: в Иерусалиме нет метро, и уж точно нет летающего поезда.","Лёгкий трамвай Иерусалима ездит на рельсах по улицам города и соединяет кварталы с центром."],"ar":["في القدس قطار يسير على قضبان في شوارع المدينة. ما اسمه؟","القطار الخفيف","قطار البحر السريع","القطار تحت الأرضي","القطار الطائر","فكروا في قطار يسير على قضبان في الشارع، ليس تحت الأرض.","تحققوا أي خيار حقيقي: في القدس لا يوجد قطار تحت أرضي، وبالتأكيد لا يوجد طائر.","القطار الخفيف في القدس يسير على قضبان في شوارع المدينة ويربط الأحياء بالمركز."]}],
["jeru",1,{"he":["ירושלים נמצאת על הרים. איך קוראים להרים האלה?","הרי יהודה","רמת הגולן","הר הכרמל","הרי אילת","חשבו על ההרים שבמרכז הארץ, ולא בצפון או בדרום הרחוק.","לאזור הזה קוראים גם בשם של אחד משבטי ישראל.","ירושלים בנויה בהרי יהודה, במרכז הארץ. לכן יש בה עליות וירידות רבות."],"en":["Jerusalem is built on mountains. What are these mountains called?","The Judean Hills","The Golan Heights","Mount Carmel","The Eilat Mountains","Think of the mountains in the middle of the country, not in the far north or south.","This area is also called by the name of one of the tribes of Israel.","Jerusalem is built in the Judean Hills, in the middle of the country. That is why it has many ups and downs."],"ru":["Иерусалим стоит на горах. Как называются эти горы?","Иудейские горы","Голанские высоты","Гора Кармель","Эйлатские горы","Подумайте о горах в центре страны, а не на дальнем севере или юге.","Этот район называют также по имени одного из колен Израиля.","Иерусалим построен в Иудейских горах, в центре страны. Поэтому в нём много подъёмов и спусков."],"ar":["القدس مبنية على جبال. ما اسم هذه الجبال؟","جبال يهودا","هضبة الجولان","جبل الكرمل","جبال إيلات","فكروا في الجبال التي في وسط البلاد، وليس في الشمال أو الجنوب البعيد.","هذه المنطقة تُسمى أيضًا باسم أحد أسباط إسرائيل.","القدس مبنية في جبال يهودا، في وسط البلاد. لذلك فيها صعود ونزول كثير."]}],
["jeru",1,{"he":["מאיזה חומר עשויים הקירות החיצוניים של רוב הבתים בירושלים?","אבן בהירה","לבנים אדומות","לוחות עץ","קירות זכוכית","חשבו על הצבע של הבתים כשהשמש שוקעת על העיר.","החומר הזה נחצב מההרים שמסביב לעיר.","רוב הבתים בירושלים מצופים באבן בהירה, שנקראת אבן ירושלמית. בשקיעה היא נראית זהובה."],"en":["What are the outer walls of most houses in Jerusalem made of?","Light-colored stone","Red bricks","Wooden boards","Glass walls","Think about the color of the houses when the sun sets over the city.","This material is cut from the hills around the city.","Most houses in Jerusalem are covered with light stone, called Jerusalem stone. At sunset it looks golden."],"ru":["Из чего сделаны наружные стены большинства домов в Иерусалиме?","Из светлого камня","Из красного кирпича","Из деревянных досок","Из стекла","Подумайте о цвете домов, когда над городом заходит солнце.","Этот материал добывают в горах вокруг города.","Большинство домов в Иерусалиме облицованы светлым камнем, который называют иерусалимским. На закате он кажется золотым."],"ar":["من أي مادة صُنعت الجدران الخارجية لمعظم البيوت في القدس؟","حجر فاتح اللون","طوب أحمر","ألواح خشب","جدران زجاج","فكروا في لون البيوت عندما تغرب الشمس فوق المدينة.","هذه المادة تُقطع من الجبال حول المدينة.","معظم البيوت في القدس مكسوة بحجر فاتح يُسمى الحجر المقدسي. عند الغروب يبدو ذهبيًا."]}],
["jeru",1,{"he":["איך קוראים למקום בירושלים שבו זוכרים את הנספים בשואה?","יד ושם","מוזיאון ישראל","גן החיות התנכי","מוזיאון המדע","השם של המקום לקוח מפסוק בתנ\"ך, ופירושו זיכרון שלא נשכח.","זה מקום של זיכרון, ולא מקום של בעלי חיים או ניסויים.","יד ושם הוא המקום הלאומי לזכר השואה. מגיעים אליו תלמידים ומבקרים מכל העולם."],"en":["What is the name of the place in Jerusalem where people remember the victims of the Holocaust?","Yad Vashem","The Israel Museum","The Biblical Zoo","The Science Museum","The name of the place comes from a verse in the Bible and means a memory that is not forgotten.","It is a place of memory, not a place of animals or experiments.","Yad Vashem is the national place of Holocaust remembrance. Students and visitors come to it from all over the world."],"ru":["Как называется место в Иерусалиме, где вспоминают жертв Холокоста?","Яд ва-Шем","Музей Израиля","Библейский зоопарк","Музей науки","Название места взято из стиха Библии и означает память, которая не забывается.","Это место памяти, а не место с животными или опытами.","Яд ва-Шем это национальный центр памяти о Холокосте. Туда приезжают школьники и гости со всего мира."],"ar":["ما اسم المكان في القدس الذي يُحيى فيه ذكرى ضحايا المحرقة؟","ياد فاشيم","متحف إسرائيل","حديقة الحيوانات التوراتية","متحف العلوم","اسم المكان مأخوذ من آية في التوراة، ومعناه ذكرى لا تُنسى.","هذا مكان للذكرى، وليس مكانًا للحيوانات أو للتجارب.","ياد فاشيم هو المكان الوطني لذكرى المحرقة. يأتي إليه طلاب وزوار من كل العالم."]}],
["jeru",1,{"he":["מה יורד לפעמים בירושלים בחורף, וכמעט אף פעם לא בתל אביב?","שלג","גשם חם","אבק ירח","גשם של חול ים","חשבו על משהו לבן וקר שילדים משחקים בו.","זה קורה רק כשקר מאוד, בדרך כלל במקומות גבוהים.","ירושלים גבוהה וקרה יותר מתל אביב. לכן לפעמים יורד בה שלג בחורף."],"en":["What sometimes falls in Jerusalem in winter, but almost never in Tel Aviv?","Snow","Warm rain","Moon dust","Rain of beach sand","Think of something white and cold that children play with.","It happens only when it is very cold, usually in high places.","Jerusalem is higher and colder than Tel Aviv. That is why it sometimes snows there in winter."],"ru":["Что иногда выпадает зимой в Иерусалиме, но почти никогда в Тель-Авиве?","Снег","Тёплый дождь","Лунная пыль","Дождь из морского песка","Подумайте о чём-то белом и холодном, с чем играют дети.","Это бывает только в сильный холод, обычно в высоких местах.","Иерусалим выше и холоднее Тель-Авива. Поэтому зимой там иногда идёт снег."],"ar":["ما الذي يتساقط أحيانًا في القدس في الشتاء، ولا يتساقط تقريبًا أبدًا في تل أبيب؟","الثلج","مطر دافئ","غبار القمر","مطر من رمل البحر","فكروا في شيء أبيض وبارد يلعب به الأطفال.","هذا يحدث فقط عندما يكون البرد شديدًا، عادة في الأماكن المرتفعة.","القدس أعلى وأبرد من تل أبيب. لذلك يتساقط فيها الثلج أحيانًا في الشتاء."]}],
["jeru",1,{"he":["מה שמו של המעיין העתיק שליד עיר דוד, החלק הקדום של ירושלים?","מעיין הגיחון","מעיין עין גדי","מעיין חרוד","מעיין עין פשחה","המעיין נמצא בעמק קטן ליד העיר העתיקה, ולא ליד ים המלח או בעמק יזרעאל.","השם שלו מופיע בתנ\"ך כשם של אחד מארבעת הנהרות שיצאו מגן עדן.","מעיין הגיחון נתן מים לירושלים הקדומה. בזכותו אנשים יכלו לגור במקום כבר לפני אלפי שנים."],"en":["What is the name of the ancient spring next to the City of David, the oldest part of Jerusalem?","The Gihon Spring","The Ein Gedi Spring","The Harod Spring","The Ein Feshkha Spring","The spring is in a small valley near the Old City, not near the Dead Sea or in the Jezreel Valley.","In the Bible, its name is the name of one of the four rivers that flowed out of the Garden of Eden.","The Gihon Spring gave water to ancient Jerusalem. Thanks to it, people could live there thousands of years ago."],"ru":["Как называется древний источник рядом с Городом Давида, самой старой частью Иерусалима?","Источник Гихон","Источник Эйн-Геди","Источник Харод","Источник Эйн-Фешха","Источник находится в небольшой долине у Старого города, а не у Мёртвого моря и не в Изреельской долине.","В Библии так называется одна из четырёх рек, вытекавших из Эдемского сада.","Источник Гихон давал воду древнему Иерусалиму. Благодаря ему люди могли жить здесь уже тысячи лет назад."],"ar":["ما اسم النبع القديم بجانب مدينة داود، الجزء الأقدم من القدس؟","نبع جيحون","نبع عين جدي","نبع عين حرود","نبع عين الفشخة","النبع موجود في وادٍ صغير قرب البلدة القديمة، وليس قرب البحر الميت أو في مرج ابن عامر.","في التوراة، اسمه هو اسم أحد الأنهار الأربعة التي خرجت من جنة عدن.","نبع جيحون أعطى الماء للقدس القديمة. بفضله استطاع الناس أن يسكنوا المكان قبل آلاف السنين."]}],
["jeru",1,{"he":["איזה מוסד בירושלים הוא בית המשפט הגבוה ביותר בישראל?","בית המשפט העליון","משכן הנשיא","בנק ישראל","משרד החינוך","חשבו על המקום שבו יושבים השופטים הבכירים ביותר במדינה.","הבניין נמצא ליד הכנסת. חפשו מוסד שעוסק בחוק ובצדק.","בית המשפט העליון יושב בירושלים, לא רחוק מהכנסת. הוא בית המשפט הגבוה ביותר בישראל."],"en":["Which institution in Jerusalem is the highest court in Israel?","The Supreme Court","The President's Residence","The Bank of Israel","The Ministry of Education","Think of the place where the most senior judges in the country sit.","The building is near the Knesset. Look for an institution that deals with law and justice.","The Supreme Court sits in Jerusalem, not far from the Knesset. It is the highest court in Israel."],"ru":["Какое учреждение в Иерусалиме является высшим судом Израиля?","Верховный суд","Резиденция президента","Банк Израиля","Министерство образования","Подумайте о месте, где заседают самые главные судьи страны.","Здание находится рядом с Кнессетом. Ищите учреждение, которое занимается законом и справедливостью.","Верховный суд находится в Иерусалиме, недалеко от Кнессета. Это высший суд Израиля."],"ar":["أي مؤسسة في القدس هي أعلى محكمة في إسرائيل؟","المحكمة العليا","مقر الرئيس","بنك إسرائيل","وزارة التربية والتعليم","فكروا في المكان الذي يجلس فيه أكبر القضاة في الدولة.","المبنى قريب من الكنيست. ابحثوا عن مؤسسة تهتم بالقانون والعدل.","المحكمة العليا موجودة في القدس، غير بعيد عن الكنيست. هي أعلى محكمة في إسرائيل."]}],
["jeru",1,{"he":["איזו אוניברסיטה נוסדה על הר הצופים בירושלים?","האוניברסיטה העברית","אוניברסיטת תל אביב","הטכניון","אוניברסיטת בן גוריון","הטכניון נמצא בחיפה. חשבו מי מהשאר יושבת בירושלים.","בשם שלה מופיעה השפה שבה מדברים במדינה.","האוניברסיטה העברית נוסדה על הר הצופים לפני יותר מ־100 שנה. אלברט איינשטיין היה מהתומכים שלה."],"en":["Which university was founded on Mount Scopus in Jerusalem?","The Hebrew University","Tel Aviv University","The Technion","Ben-Gurion University","The Technion is in Haifa. Think which of the others sits in Jerusalem.","Its name includes the language spoken in the country.","The Hebrew University was founded on Mount Scopus more than 100 years ago. Albert Einstein was one of its supporters."],"ru":["Какой университет был основан на горе Скопус в Иерусалиме?","Еврейский университет","Тель-Авивский университет","Технион","Университет имени Бен-Гуриона","Технион находится в Хайфе. Подумайте, какой из остальных находится в Иерусалиме.","В его названии есть язык, на котором говорят в стране.","Еврейский университет был основан на горе Скопус более 100 лет назад. Альберт Эйнштейн был одним из его сторонников."],"ar":["أي جامعة تأسست على جبل المشارف (جبل سكوبس) في القدس؟","الجامعة العبرية","جامعة تل أبيب","التخنيون","جامعة بن غوريون","التخنيون موجود في حيفا. فكروا أي من الباقيات موجودة في القدس.","في اسمها تظهر اللغة التي يتحدثون بها في الدولة.","الجامعة العبرية تأسست على جبل المشارف قبل أكثر من 100 سنة. ألبرت أينشتاين كان من داعميها."]}],
["jeru",2,{"he":["לשלוש דתות יש מקומות קדושים בירושלים. אילו שלוש דתות?","יהדות, נצרות ואסלאם","יהדות, בודהיזם ואסלאם","נצרות, הינדואיזם ויהדות","אסלאם, שינטו ונצרות","חשבו על הכותל, על כנסיית הקבר ועל מסגד אל אקצא. לאילו דתות הם שייכים?","שתיים מהדתות נולדו כאן בארץ, ואחת הגיעה מחצי האי ערב.","בירושלים קדושים ליהודים הכותל והר הבית, לנוצרים כנסיית הקבר, ולמוסלמים אל אקצא וכיפת הסלע."],"en":["Three religions have holy places in Jerusalem. Which three?","Judaism, Christianity and Islam","Judaism, Buddhism and Islam","Christianity, Hinduism and Judaism","Islam, Shinto and Christianity","Think about the Western Wall, the Church of the Holy Sepulchre and the Al-Aqsa Mosque. Which religions do they belong to?","Two of the religions were born here in this land, and one came from the Arabian Peninsula.","In Jerusalem the Western Wall and Temple Mount are holy to Jews, the Church of the Holy Sepulchre to Christians, and Al-Aqsa and the Dome of the Rock to Muslims."],"ru":["У трёх религий есть святые места в Иерусалиме. Какие три религии?","Иудаизм, христианство и ислам","Иудаизм, буддизм и ислам","Христианство, индуизм и иудаизм","Ислам, синтоизм и христианство","Подумайте о Западной стене, о храме Гроба Господня и о мечети Аль-Акса. Каким религиям они принадлежат?","Две из религий родились здесь, в этой стране, а одна пришла с Аравийского полуострова.","В Иерусалиме евреям святы Западная стена и Храмовая гора, христианам храм Гроба Господня, а мусульманам Аль-Акса и Купол Скалы."],"ar":["لثلاث ديانات أماكن مقدسة في القدس. أي ثلاث ديانات؟","اليهودية والمسيحية والإسلام","اليهودية والبوذية والإسلام","المسيحية والهندوسية واليهودية","الإسلام والشنتو والمسيحية","فكروا في الحائط الغربي وكنيسة القيامة ومسجد الأقصى. لأي ديانات ينتمون؟","ديانة ولدتا هنا في هذه البلاد، وواحدة جاءت من شبه الجزيرة العربية.","في القدس تُقدس لليهود الحائط الغربي وجبل الهيكل، وللمسيحيين كنيسة القيامة، وللمسلمين الأقصى وقبة الصخرة."]}],
["jeru",2,{"he":["לעיר העתיקה ארבעה רובעים. איזה רובע לא קיים בה?","הרובע הסיני","הרובע היהודי","הרובע המוסלמי","הרובע הנוצרי","זכרו את ארבעת הרובעים: יהודי, מוסלמי, נוצרי ועוד אחד קטן. מי נשאר בחוץ?","הרובע הרביעי והקטן הוא הארמני. עכשיו בדקו מי לא ברשימה.","העיר העתיקה מחולקת לארבעה רובעים: יהודי, מוסלמי, נוצרי וארמני. רובע סיני אין בה."],"en":["The Old City has four quarters. Which quarter does not exist in it?","The Chinese Quarter","The Jewish Quarter","The Muslim Quarter","The Christian Quarter","Remember the four quarters: Jewish, Muslim, Christian and one more small one. Who is left out?","The fourth and smallest quarter is the Armenian one. Now check who is not on the list.","The Old City is divided into four quarters: Jewish, Muslim, Christian and Armenian. There is no Chinese quarter in it."],"ru":["В Старом городе четыре квартала. Какого квартала в нём не существует?","Китайский квартал","Еврейский квартал","Мусульманский квартал","Христианский квартал","Вспомните четыре квартала: еврейский, мусульманский, христианский и ещё один маленький. Кто остался за бортом?","Четвёртый и самый маленький квартал это армянский. Теперь проверьте, кого нет в списке.","Старый город делится на четыре квартала: еврейский, мусульманский, христианский и армянский. Китайского квартала в нём нет."],"ar":["للبلدة القديمة أربعة أحياء. أي حي لا يوجد فيها؟","الحي الصيني","حي اليهود","حي المسلمين","حي النصارى","تذكروا الأحياء الأربعة: اليهودي والإسلامي والمسيحي وواحد صغير آخر. من بقي خارجًا؟","الحي الرابع والأصغر هو الأرمني. الآن تحققوا من ليس في القائمة.","البلدة القديمة مقسمة إلى أربعة أحياء: اليهودي والإسلامي والمسيحي والأرمني. لا يوجد فيها حي صيني."]}],
["jeru",2,{"he":["למה אנשים מכל העולם מתפללים ומטיילים דווקא בירושלים?","כי יש בה מקומות קדושים לשלוש דתות שונות","כי יש בה את הים הכי כחול","כי יש בה את הקניון הכי גדול בעולם","כי בה נמצאת העיר הכי קרה","חשבו מה מיוחד בעיר הזאת לעומת ערים אחרות בארץ.","חשבו על הכותל, על כנסיית הקבר ועל כיפת הסלע: מה משותף לשלושתם?","ירושלים קדושה ליהדות, לנצרות ולאסלאם. מיליוני אנשים מגיעים להתפלל ולראות את המקומות הקדושים להם."],"en":["Why do people from all over the world pray and tour in Jerusalem of all places?","Because it has holy places for three different religions","Because it has the bluest sea","Because it has the biggest mall in the world","Because the coldest city is in it","Think about what is special about this city compared with other cities in the country.","Think about the Western Wall, the Church of the Holy Sepulchre and the Dome of the Rock: what do all three share?","Jerusalem is holy to Judaism, Christianity and Islam. Millions of people come to pray and see the places holy to them."],"ru":["Почему люди со всего мира молятся и путешествуют именно в Иерусалиме?","Потому что в нём есть святые места для трёх разных религий","Потому что в нём самое синее море","Потому что в нём самый большой торговый центр в мире","Потому что в нём находится самый холодный город","Подумайте, что особенного в этом городе по сравнению с другими городами страны.","Подумайте о Западной стене, о храме Гроба Господня и о Куполе Скалы: что общего у всех троих?","Иерусалим свят для иудаизма, христианства и ислама. Миллионы людей приезжают молиться и видеть святые для них места."],"ar":["لماذا يصلي ويتجول أناس من كل العالم في القدس تحديدًا؟","لأن فيها أماكن مقدسة لثلاث ديانات مختلفة","لأن فيها أكثر بحر زرقة","لأن فيها أكبر مركز تجاري في العالم","لأن فيها أكثر مدينة برودة","فكروا ما المميز في هذه المدينة مقارنة بمدن أخرى في البلاد.","فكروا في الحائط الغربي وكنيسة القيامة وقبة الصخرة: ما المشترك بين الثلاثة؟","القدس مقدسة لليهودية والمسيحية والإسلام. ملايين الناس يأتون للصلاة ورؤية الأماكن المقدسة لديهم."]}],
["jeru",2,{"he":["מהם הר הזיתים ומגדל דוד?","מקומות מפורסמים בירושלים: הר עם בתי עלמין עתיק, ומצודה ליד העיר העתיקה","שני איים בים התיכון: אחד עם נמל דייגים, ואחד עם מגדלור ישן","הרים בצפון הארץ הרחוק: אחד עם יער גדול, ואחד עם מעיין קר","קניונים בדרום הארץ: אחד ליד אילת, ואחד במרכז העיר באר שבע","חשבו על מקומות שתיירים מצלמים כשהם מסתכלים על העיר העתיקה.","בדקו על המפה: שני המקומות האלה נמצאים ממש ליד חומות העיר העתיקה.","הר הזיתים הוא הר עתיק ממזרח לעיר העתיקה, ומגדל דוד הוא מצודה עתיקה ליד שער יפו. שניהם סמלים של ירושלים."],"en":["What are the Mount of Olives and the Tower of David?","Famous places in Jerusalem: a mountain with an ancient cemetery, and a citadel next to the Old City","Two islands in the Mediterranean: one with a fishing port, and one with an old lighthouse","Mountains in the far north of the country: one with a big forest, one with a cold spring","Shopping malls in the south of the country: one near Eilat, and one in the center of Beersheba","Think about places tourists photograph when they look at the Old City.","Check on the map: both these places are right next to the walls of the Old City.","The Mount of Olives is an ancient mountain east of the Old City, and the Tower of David is an ancient citadel next to Jaffa Gate. Both are symbols of Jerusalem."],"ru":["Что такое Елеонская гора и Башня Давида?","Знаменитые места в Иерусалиме: гора с древним кладбищем и крепость рядом со Старым городом","Два острова в Средиземном море: один с рыбацким портом, другой со старым маяком","Горы на далёком севере страны: одна с большим лесом, другая с холодным родником","Торговые центры на юге страны: один возле Эйлата, другой в центре Беэр-Шевы","Подумайте о местах, которые туристы фотографируют, глядя на Старый город.","Проверьте на карте: оба эти места находятся прямо у стен Старого города.","Елеонская гора это древняя гора к востоку от Старого города, а Башня Давида древняя крепость у Яффских ворот. Обе являются символами Иерусалима."],"ar":["ما هما جبل الزيتون وبرج داود؟","مكانان مشهوران في القدس: جبل فيه مقبرة قديمة، وقلعة بجانب البلدة القديمة","جزيرتان في البحر المتوسط: واحدة فيها ميناء صيد، وأخرى فيها منارة قديمة","جبال في شمال البلاد البعيد: واحد فيه غابة كبيرة، وآخر فيه نبع بارد","مراكز تسوق في الجنوب: واحد قرب إيلات، وآخر في وسط بئر السبع","فكروا في أماكن يصورها السياح عندما ينظرون إلى البلدة القديمة.","تحققوا على الخريطة: كلا المكانين يقعان مباشرة بجانب أسوار البلدة القديمة.","جبل الزيتون هو جبل قديم شرق البلدة القديمة، وبرج داود قلعة قديمة بجانب باب الخليل. كلاهما رمزان للقدس."]}],
["jeru",2,{"he":["כיתה רוצה לראות את המגילות הגנוזות, ספרים עתיקים שנמצאו במערות. לאן ייסעו בירושלים?","למוזיאון ישראל","ליד ושם","לגן החיות התנכי","לשוק מחנה יהודה","המגילות שמורות בבניין לבן שנראה כמו מכסה של כד.","חפשו מקום שמציג אוצרות של כל המדינה, ולא מקום זיכרון או שוק.","המגילות הגנוזות מוצגות במוזיאון ישראל, בבניין שנקרא היכל הספר. הגג הלבן שלו דומה למכסה של כד שבו נמצאו המגילות."],"en":["A class wants to see the Dead Sea Scrolls, ancient books found in caves. Where will they go in Jerusalem?","To the Israel Museum","To Yad Vashem","To the Biblical Zoo","To the Mahane Yehuda Market","The scrolls are kept in a white building that looks like the lid of a jar.","Look for a place that shows treasures of the whole country, not a place of memory or a market.","The Dead Sea Scrolls are shown in the Israel Museum, in a building called the Shrine of the Book. Its white roof looks like the lid of a jar in which scrolls were found."],"ru":["Класс хочет увидеть Кумранские рукописи, древние книги, найденные в пещерах. Куда они поедут в Иерусалиме?","В Музей Израиля","В Яд ва-Шем","В Библейский зоопарк","На рынок Махане Иегуда","Рукописи хранятся в белом здании, похожем на крышку кувшина.","Ищите место, где показывают сокровища всей страны, а не место памяти и не рынок.","Кумранские рукописи показывают в Музее Израиля, в здании под названием Храм Книги. Его белая крыша похожа на крышку кувшина, в котором нашли рукописи."],"ar":["يريد صف أن يرى مخطوطات البحر الميت، وهي كتب قديمة وُجدت في كهوف. إلى أين سيذهبون في القدس؟","إلى متحف إسرائيل","إلى ياد فاشيم","إلى حديقة الحيوانات التوراتية","إلى سوق محانيه يهودا","المخطوطات محفوظة في مبنى أبيض يشبه غطاء جرة.","ابحثوا عن مكان يعرض كنوز البلاد كلها، وليس مكانًا للذكرى أو سوقًا.","مخطوطات البحر الميت معروضة في متحف إسرائيل، في مبنى اسمه مقام الكتاب. سقفه الأبيض يشبه غطاء جرة وُجدت فيها مخطوطات."]}],
["jeru",2,{"he":["קבוצה של נוצרים באה לעיר העתיקה, לכנסייה הקדושה ביותר להם בירושלים. לאן הם ילכו?","לכנסיית הקבר","לכנסיית הבשורה בנצרת","לכנסיית הלחם והדגים בכנרת","למנזר סטלה מאריס בחיפה","שימו לב: הקבוצה נמצאת בירושלים. מה מהאפשרויות לא נמצא בעיר אחרת?","לפי האמונה הנוצרית, כאן קרו הימים האחרונים של ישו.","כנסיית הקבר נמצאת ברובע הנוצרי בעיר העתיקה. לפי האמונה הנוצרית, שם ישו נצלב, נקבר וקם לתחייה."],"en":["A group of Christians comes to the Old City, to the church that is holiest to them in Jerusalem. Where will they go?","To the Church of the Holy Sepulchre","To the Church of the Annunciation in Nazareth","To the Church of the Loaves and Fishes by the Sea of Galilee","To the Stella Maris Monastery in Haifa","Notice: the group is in Jerusalem. Which option is not in another city?","According to Christian belief, the last days of Jesus happened here.","The Church of the Holy Sepulchre is in the Christian Quarter of the Old City. According to Christian belief, Jesus was crucified, buried and rose there."],"ru":["Группа христиан приходит в Старый город, в самую святую для них церковь в Иерусалиме. Куда они пойдут?","В храм Гроба Господня","В церковь Благовещения в Назарете","В церковь Умножения хлебов у Кинерета","В монастырь Стелла Марис в Хайфе","Обратите внимание: группа находится в Иерусалиме. Что из вариантов не находится в другом городе?","По христианской вере, здесь прошли последние дни Иисуса.","Храм Гроба Господня находится в Христианском квартале Старого города. По христианской вере, там Иисус был распят, погребён и воскрес."],"ar":["مجموعة من المسيحيين تأتي إلى البلدة القديمة، إلى الكنيسة الأقدس لهم في القدس. إلى أين سيذهبون؟","إلى كنيسة القيامة","إلى كنيسة البشارة في الناصرة","إلى كنيسة الخبز والسمك عند بحيرة طبريا","إلى دير ستيلا ماريس في حيفا","انتبهوا: المجموعة موجودة في القدس. أي خيار ليس في مدينة أخرى؟","حسب الإيمان المسيحي، هنا كانت الأيام الأخيرة ليسوع.","كنيسة القيامة موجودة في حي النصارى في البلدة القديمة. حسب الإيمان المسيحي، هناك صُلب يسوع ودُفن وقام."]}],
["jeru",2,{"he":["משפחה מוסלמית באה להתפלל בירושלים, במסגד הקדוש לה בעיר העתיקה. לאיזה מסגד היא תלך?","למסגד אל אקצא","למסגד אל ג'זאר בעכו","למסגד חסן בק ביפו","למסגד הלבן ברמלה","המשפחה נמצאת בירושלים. אילו מסגדים נמצאים בערים אחרות?","השם מופיע בקוראן, ופירושו הרחוק ביותר.","מסגד אל אקצא נמצא בעיר העתיקה בירושלים. זה אחד המקומות הקדושים ביותר לאסלאם, ומוסלמים מכל העולם באים להתפלל בו."],"en":["A Muslim family comes to pray in Jerusalem, at the mosque that is holy to them in the Old City. Which mosque will they go to?","To the Al-Aqsa Mosque","To the Al-Jazzar Mosque in Acre","To the Hassan Bek Mosque in Jaffa","To the White Mosque in Ramla","The family is in Jerusalem. Which mosques are in other cities?","Its name appears in the Quran and means the farthest one.","The Al-Aqsa Mosque is in the Old City of Jerusalem. It is one of the holiest places in Islam, and Muslims from all over the world come to pray there."],"ru":["Мусульманская семья приходит молиться в Иерусалим, в святую для неё мечеть в Старом городе. В какую мечеть она пойдёт?","В мечеть Аль-Акса","В мечеть Аль-Джаззар в Акко","В мечеть Хасан-Бек в Яффо","В Белую мечеть в Рамле","Семья находится в Иерусалиме. Какие мечети находятся в других городах?","Её название упоминается в Коране и означает «самая дальняя».","Мечеть Аль-Акса находится в Старом городе Иерусалима. Это одно из самых святых мест ислама, и мусульмане со всего мира приходят туда молиться."],"ar":["عائلة مسلمة تأتي للصلاة في القدس، في المسجد المقدس لها في البلدة القديمة. إلى أي مسجد ستذهب؟","إلى المسجد الأقصى","إلى مسجد الجزار في عكا","إلى مسجد حسن بيك في يافا","إلى المسجد الأبيض في الرملة","العائلة موجودة في القدس. أي مساجد موجودة في مدن أخرى؟","اسمه مذكور في القرآن، ومعناه البعيد جدًا.","المسجد الأقصى موجود في البلدة القديمة في القدس. هو من أقدس الأماكن في الإسلام، ويأتي المسلمون من كل العالم للصلاة فيه."]}],
["jeru",2,{"he":["מהר הזיתים רואים מבנה עם כיפה זהובה גדולה בעיר העתיקה. מהו המבנה?","כיפת הסלע","הכנסת","מגדל דוד","בית הכנסת הגדול","המבנה הזה נמצא בעיר העתיקה, והוא מקום קדוש למוסלמים.","בתוך המבנה יש אבן גדולה, ומכאן בא שמו.","כיפת הסלע היא מבנה קדוש לאסלאם בעיר העתיקה. הכיפה הזהובה שלה היא אחד הסמלים המוכרים של ירושלים."],"en":["From the Mount of Olives you can see a building with a big golden dome in the Old City. What is it?","The Dome of the Rock","The Knesset","The Tower of David","The Great Synagogue","This building is in the Old City, and it is a holy place for Muslims.","Inside the building there is a large stone, and that is where its name comes from.","The Dome of the Rock is a holy Islamic building in the Old City. Its golden dome is one of the best-known symbols of Jerusalem."],"ru":["С Масличной горы видно здание с большим золотым куполом в Старом городе. Что это?","Купол Скалы","Кнессет","Башня Давида","Большая синагога","Это здание находится в Старом городе, и это святое место для мусульман.","Внутри здания есть большой камень, отсюда и его название.","Купол Скалы это святое для ислама здание в Старом городе. Его золотой купол один из самых известных символов Иерусалима."],"ar":["من جبل الزيتون يُرى مبنى له قبة ذهبية كبيرة في البلدة القديمة. ما هو المبنى؟","قبة الصخرة","الكنيست","برج داود","الكنيس الكبير","هذا المبنى موجود في البلدة القديمة، وهو مكان مقدس للمسلمين.","داخل المبنى يوجد حجر كبير، ومن هنا جاء اسمه.","قبة الصخرة مبنى مقدس في الإسلام في البلدة القديمة. قبتها الذهبية من أشهر رموز القدس."]}],
["jeru",2,{"he":["פעם הדרך מירושלים לעיר הנמל על חוף הים התחילה בשער מערבי בחומה. איזה שער?","שער יפו","שער שכם","שער האריות","שער ציון","חשבו על עיר נמל עתיקה על חוף הים התיכון, ממערב לירושלים.","שער שכם פונה צפונה ושער האריות פונה מזרחה. מה נשאר?","שער יפו נמצא בצד המערבי של החומה. ממנו יצאה הדרך לנמל יפו, ולכן נקרא כך."],"en":["In the past, the road from Jerusalem to the port city on the coast started at a western gate in the wall. Which gate?","Jaffa Gate","Damascus Gate","Lions' Gate","Zion Gate","Think of an ancient port city on the Mediterranean coast, west of Jerusalem.","Damascus Gate faces north and Lions' Gate faces east. What is left?","Jaffa Gate is on the western side of the wall. The road to the port of Jaffa went out from it, so it got this name."],"ru":["Раньше дорога из Иерусалима в портовый город на побережье начиналась у западных ворот стены. Какие это ворота?","Яффские ворота","Дамасские ворота","Львиные ворота","Сионские ворота","Подумайте о древнем портовом городе на берегу Средиземного моря, к западу от Иерусалима.","Дамасские ворота смотрят на север, а Львиные на восток. Что осталось?","Яффские ворота находятся на западной стороне стены. От них начиналась дорога в порт Яффо, поэтому их так назвали."],"ar":["في الماضي، كانت الطريق من القدس إلى مدينة الميناء على الساحل تبدأ من بوابة غربية في السور. أي بوابة؟","باب الخليل (باب يافا)","باب العامود (باب نابلس)","باب الأسباط (باب الأسود)","باب النبي داود (باب صهيون)","فكروا في مدينة ميناء قديمة على ساحل البحر المتوسط، غرب القدس.","باب العامود يتجه شمالًا وباب الأسباط يتجه شرقًا. ماذا بقي؟","باب الخليل، ويُسمى بالعبرية باب يافا، موجود في الجهة الغربية من السور. منه خرجت الطريق إلى ميناء يافا."]}],
["jeru",2,{"he":["משפחה מאילת נוסעת לירושלים בינואר. מה הכי חשוב לארוז?","מעיל חם וכובע","בגד ים וכפכפים","מאוורר קטן ליד","כובע שמש ומשקפי שחייה","חשבו איך מרגיש החורף בעיר שגבוהה מאוד מעל הים.","באילת חם גם בחורף. בירושלים, בגלל הגובה, המצב שונה.","ירושלים גבוהה, ובחורף קר בה, לפעמים יש גשם ואפילו שלג. לכן צריך בגדים חמים."],"en":["A family from Eilat travels to Jerusalem in January. What is most important to pack?","A warm coat and a hat","A swimsuit and flip-flops","A small hand fan","A sun hat and swim goggles","Think about how winter feels in a city that is very high above the sea.","In Eilat it is warm even in winter. In Jerusalem, because of the height, things are different.","Jerusalem is high, and in winter it is cold there, sometimes with rain and even snow. So you need warm clothes."],"ru":["Семья из Эйлата едет в Иерусалим в январе. Что важнее всего взять с собой?","Тёплое пальто и шапку","Купальник и шлёпанцы","Маленький ручной веер","Панаму и очки для плавания","Подумайте, какая зима в городе, который стоит очень высоко над морем.","В Эйлате тепло даже зимой. В Иерусалиме из-за высоты всё иначе.","Иерусалим находится высоко, и зимой там холодно, бывает дождь и даже снег. Поэтому нужна тёплая одежда."],"ar":["عائلة من إيلات تسافر إلى القدس في كانون الثاني. ما أهم شيء تحزمه؟","معطف دافئ وقبعة","ملابس سباحة وشبشب","مروحة يد صغيرة","قبعة شمس ونظارات سباحة","فكروا كيف يكون الشتاء في مدينة مرتفعة جدًا عن البحر.","في إيلات الجو دافئ حتى في الشتاء. في القدس، بسبب الارتفاع، الوضع مختلف.","القدس مرتفعة، وفي الشتاء يكون فيها برد، وأحيانًا مطر وحتى ثلج. لذلك يجب أخذ ملابس دافئة."]}],
["jeru",2,{"he":["נוסעים ברכב מתל אביב לירושלים. מה קורה לכביש בדרך?","הכביש עולה למעלה בין הרים","הכביש יורד מתחת לגובה הים","הכביש שטוח לאורך החוף","הכביש חוצה נהר רחב","תל אביב שוכנת על חוף הים. איפה שוכנת ירושלים?","חשבו על האוזניים שנסתמות לפעמים כשמשנים גובה.","תל אביב נמצאת ליד הים, וירושלים בהרים. לכן הכביש לירושלים עולה ועולה בין ההרים."],"en":["You drive from Tel Aviv to Jerusalem. What happens to the road on the way?","The road climbs up between hills","The road goes down below sea level","The road is flat along the coast","The road crosses a wide river","Tel Aviv lies on the seashore. Where does Jerusalem lie?","Think about your ears that sometimes get blocked when the height changes.","Tel Aviv is by the sea, and Jerusalem is in the hills. So the road to Jerusalem keeps going up between the hills."],"ru":["Едем на машине из Тель-Авива в Иерусалим. Что происходит с дорогой в пути?","Дорога поднимается в гору между холмами","Дорога спускается ниже уровня моря","Дорога идёт ровно вдоль берега","Дорога пересекает широкую реку","Тель-Авив стоит на берегу моря. А где стоит Иерусалим?","Вспомните, как иногда закладывает уши, когда меняется высота.","Тель-Авив у моря, а Иерусалим в горах. Поэтому дорога в Иерусалим всё время поднимается между холмами."],"ar":["نسافر بالسيارة من تل أبيب إلى القدس. ماذا يحدث للشارع في الطريق؟","الشارع يصعد إلى أعلى بين التلال","الشارع ينزل تحت مستوى سطح البحر","الشارع مستوٍ على طول الشاطئ","الشارع يعبر نهرًا عريضًا","تل أبيب تقع على شاطئ البحر. أين تقع القدس؟","فكروا في الأذنين اللتين تُسدان أحيانًا عندما يتغير الارتفاع.","تل أبيب قرب البحر، والقدس في الجبال. لذلك الشارع إلى القدس يصعد ويصعد بين الجبال."]}],
["jeru",2,{"he":["פעם כולם בירושלים גרו בתוך החומות. איך נקראת השכונה היהודית הראשונה שנבנתה מחוץ להן?","משכנות שאננים","נחלת שבעה","מאה שערים","בית הכרם","ליד השכונה הזאת עומדת טחנת רוח עתיקה, מול חומות העיר.","השם שלה לקוח מפסוק בספר ישעיהו על מקום מנוחה בשקט.","משכנות שאננים נבנתה לפני כ־160 שנה, מול חומת העיר העתיקה. אחריה נבנו עוד ועוד שכונות, וכך נוצרה העיר החדשה."],"en":["In the past, everyone in Jerusalem lived inside the walls. What is the name of the first Jewish neighborhood built outside them?","Mishkenot Sha'ananim","Nahalat Shiv'a","Mea She'arim","Beit HaKerem","An old windmill stands next to this neighborhood, facing the city walls.","Its name comes from a verse in the Book of Isaiah about a quiet place to rest.","Mishkenot Sha'ananim was built about 160 years ago, facing the Old City wall. After it, more and more neighborhoods were built, and so the new city grew."],"ru":["Раньше все в Иерусалиме жили внутри стен. Как называется первый еврейский квартал, построенный за ними?","Мишкенот-Шаананим","Нахалат-Шива","Меа-Шеарим","Бейт-а-Керем","Рядом с этим кварталом стоит старая ветряная мельница, напротив городских стен.","Его название взято из стиха книги Исаии о тихом месте отдыха.","Мишкенот-Шаананим построили около 160 лет назад, напротив стены Старого города. После него строили всё новые кварталы, и так вырос новый город."],"ar":["في الماضي، كان كل سكان القدس يعيشون داخل الأسوار. ما اسم أول حي يهودي بُني خارجها؟","مشكنوت شأننيم","نحلات شيفع","ميا شعاريم","بيت هكيرم","بجانب هذا الحي تقف طاحونة هواء قديمة، مقابل أسوار المدينة.","اسمه مأخوذ من آية في سفر إشعياء عن مكان راحة هادئ.","مشكنوت شأننيم بُني قبل نحو 160 سنة، مقابل سور البلدة القديمة. بعده بُنيت أحياء أكثر فأكثر، وهكذا نشأت المدينة الجديدة."]}],
["jeru",2,{"he":["אדם עומד על הר הזיתים ומסתכל על העיר העתיקה. הר הזיתים נמצא ממזרח לה. לאיזה כיוון הוא מסתכל?","מערב","מזרח","צפון","דרום","אם ההר ממזרח לעיר, איך מגיעים ממנו אל העיר?","הכיוון ההפוך למזרח הוא הכיוון שבו השמש שוקעת.","הר הזיתים נמצא ממזרח לעיר העתיקה. לכן מי שעומד עליו ומסתכל על העיר, מסתכל מערבה."],"en":["A person stands on the Mount of Olives and looks at the Old City. The Mount of Olives is east of it. Which direction is he looking?","West","East","North","South","If the mountain is east of the city, how do you get from it to the city?","The direction opposite to east is where the sun sets.","The Mount of Olives is east of the Old City. So someone standing on it and looking at the city is looking west."],"ru":["Человек стоит на Масличной горе и смотрит на Старый город. Масличная гора находится к востоку от него. В какую сторону он смотрит?","На запад","На восток","На север","На юг","Если гора к востоку от города, то как с неё попасть в город?","Направление, противоположное востоку, это там, где садится солнце.","Масличная гора находится к востоку от Старого города. Поэтому тот, кто стоит на ней и смотрит на город, смотрит на запад."],"ar":["شخص يقف على جبل الزيتون وينظر إلى البلدة القديمة. جبل الزيتون يقع شرقها. إلى أي اتجاه ينظر؟","الغرب","الشرق","الشمال","الجنوب","إذا كان الجبل شرق المدينة، كيف نصل منه إلى المدينة؟","الاتجاه المعاكس للشرق هو الاتجاه الذي تغرب فيه الشمس.","جبل الزيتون يقع شرق البلدة القديمة. لذلك من يقف عليه وينظر إلى المدينة ينظر نحو الغرب."]}],
["jeru",3,{"he":["למה דווקא על ההרים נבנתה ירושלים העתיקה, ולא במישור?","כי על ההר היה קל יותר להגן על העיר, ולידה היה מעיין מים","כי על ההרים יש יותר חנויות, ואנשים רצו לקנות בהן בלי לרדת למישור","כי במישור אסור היה לבנות, ולכן כולם עלו להרים","כי ההרים קרובים יותר לשמש, ושם חם ונעים יותר","חשבו על שני דברים שעיר עתיקה חייבת: הגנה מפני אויבים, ומים לשתייה.","מי עומד גבוה רואה רחוק. מה זה נותן לשומרי עיר?","ערים עתיקות נבנו על גבעות כדי לראות את האויב מרחוק ולהגן על עצמן. מעיין הגיחון נתן לירושלים מים."],"en":["Why was ancient Jerusalem built on the mountains, and not on the plain?","Because on the hill it was easier to defend the city, and next to it was a water spring","Because the mountains have more shops, and people wanted to buy there without going down to the plain","Because building on the plain was forbidden, so everyone moved up the hills","Because the mountains are closer to the sun, so it is warmer and nicer there","Think about two things an ancient city must have: defense from enemies, and water to drink.","Whoever stands high sees far. What does that give the city guards?","Ancient cities were built on hills to see the enemy from afar and defend themselves. The Gihon Spring gave Jerusalem water."],"ru":["Почему древний Иерусалим был построен именно на горах, а не на равнине?","Потому что на холме было легче защищать город, и рядом был источник воды","Потому что в горах больше магазинов, и люди хотели покупать там, не спускаясь на равнину","Потому что на равнине строить было запрещено, и все ушли в горы","Потому что горы ближе к солнцу, и поэтому там теплее и приятнее","Подумайте о двух вещах, которые нужны древнему городу: защита от врагов и вода для питья.","Кто стоит высоко, видит далеко. Что это даёт стражам города?","Древние города строились на холмах, чтобы видеть врага издалека и защищаться. Источник Гихон давал Иерусалиму воду."],"ar":["لماذا بُنيت القدس القديمة على الجبال تحديدًا، وليس في السهل؟","لأنه على التل كان أسهل الدفاع عن المدينة، وبجانبها كان نبع ماء","لأن في الجبال محلات أكثر، والناس أرادوا الشراء منها من دون النزول إلى السهل","لأنه كان يُمنع البناء في السهل، فصعد الجميع إلى الجبال","لأن الجبال أقرب إلى الشمس، فالجو هناك أدفأ وألطف","فكروا في شيئين تحتاجهما مدينة قديمة: الدفاع عن الأعداء وماء للشرب.","من يقف عاليًا يرى بعيدًا. ماذا يعطي ذلك لحراس المدينة؟","بُنيت المدن القديمة على التلال لترى العدو من بعيد وتدافع عن نفسها. نبع الجيحون أعطى القدس الماء."]}],
["jeru",3,{"he":["מה ההבדל בין העיר העתיקה לבין ירושלים החדשה?","העתיקה עתיקה ומוקפת חומה עם מקומות קדושים, והחדשה נבנתה מחוץ לחומה עם שכונות, כנסת ומוזיאונים","אין שום הבדל, זו אותה עיר בדיוק: אותם רחובות, אותם בתים ואותה חומה עתיקה מסביב","העתיקה גדולה יותר מהחדשה, ויש בה יותר שכונות, יותר תושבים ויותר מוזיאונים","החדשה מוקפת חומה גבוהה עם מקומות קדושים, והעתיקה נבנתה מחוץ לחומה עם שכונות","חשבו על משפחה שגדלה: הבית הישן נשאר, וסביבו בונים חדרים חדשים.","חפשו במפה את החומה: מה בתוכה עתיק, ומה בחוץ נבנה אחר כך?","העיר העתיקה היא הלב העתיק בין החומות. ירושלים החדשה גדלה מחוץ לחומה במאה וחמישים השנים האחרונות, עם שכונות, הכנסת ומוזיאונים."],"en":["What is the difference between the Old City and the new Jerusalem?","The old one is ancient and walled with holy places, and the new one was built outside the wall with neighborhoods, the Knesset and museums","There is no difference, it is exactly the same city: the same streets, the same houses and the same old wall around it","The old one is bigger than the new one, and it has more neighborhoods, more people and more museums than the new one","The new one is surrounded by a high wall with holy places, and the old one was built outside the wall with neighborhoods","Think about a family that grows: the old house stays, and new rooms are built around it.","Look for the wall on the map: what inside it is ancient, and what outside was built later?","The Old City is the ancient heart inside the walls. The new Jerusalem grew outside the wall in the last hundred and fifty years, with neighborhoods, the Knesset and museums."],"ru":["В чём разница между Старым городом и новым Иерусалимом?","Старый древний и окружён стеной со святыми местами, а новый построен вне стены с кварталами, Кнессетом и музеями","Нет никакой разницы, это ровно тот же город: те же улицы, те же дома и та же древняя стена вокруг","Старый больше нового, и в нём больше кварталов, больше жителей и больше музеев, чем в новом","Новый окружён высокой стеной со святыми местами, а старый построен вне стены с кварталами","Подумайте о семье, которая растёт: старый дом остаётся, а вокруг строят новые комнаты.","Поищите на карте стену: что внутри неё древнее, а что снаружи построено позже?","Старый город это древнее сердце внутри стен. Новый Иерусалим вырос вне стены за последние сто пятьдесят лет, с кварталами, Кнессетом и музеями."],"ar":["ما الفرق بين البلدة القديمة والقدس الجديدة؟","القديمة عتيقة ومحاطة بسور مع أماكن مقدسة، والجديدة بُنيت خارج السور مع أحياء وكنيست ومتاحف","لا يوجد أي فرق، هي المدينة نفسها تمامًا: الشوارع نفسها والبيوت نفسها والسور القديم نفسه","القديمة أكبر من الجديدة، وفيها أحياء أكثر وسكان أكثر ومتاحف أكثر من الجديدة","الجديدة محاطة بسور عالٍ مع أماكن مقدسة، والقديمة بُنيت خارج السور مع أحياء","فكروا في عائلة تكبر: البيت القديم يبقى، وحوله تُبنى غرف جديدة.","ابحثوا في الخريطة عن السور: ما داخله قديم، وما خارجه بُني لاحقًا؟","البلدة القديمة هي القلب القديم داخل الأسوار. القدس الجديدة نمت خارج السور في المئة والخمسين سنة الأخيرة، مع أحياء والكنيست ومتاحف."]}],
["jeru",3,{"he":["מבקר רוצה לראות ביום אחד מקום קדוש ליהודים, למוסלמים ולנוצרים. למה דווקא ירושלים מאפשרת את זה?","כי המקומות הקדושים לשלוש הדתות קרובים אחד לשני בעיר העתיקה ובסביבתה","כי בירושלים יש הכי הרבה מטוסים, ואפשר לטוס בין המקומות הקדושים","כי בערים אחרות בעולם אין מקומות קדושים בכלל, רק בירושלים בנו מקומות כאלה","כי בירושלים יום אחד ארוך יותר, ויש בו הרבה יותר שעות לטייל","חשבו כמה רחוק הכותל מכנסיית הקבר ומכיפת הסלע.","בדקו על מפת העיר העתיקה: כמה זמן הליכה יש בין שלושת המקומות?","בירושלים המקומות הקדושים לשלוש הדתות צפופים וקרובים: אפשר ללכת ברגל מהכותל לכנסיית הקבר ולכיפת הסלע ביום אחד."],"en":["A visitor wants to see in one day a place holy to Jews, to Muslims and to Christians. Why does Jerusalem of all places make that possible?","Because the holy places of the three religions are close to each other in the Old City and around it","Because Jerusalem has the most airplanes, so you can fly between the holy places","Because other cities in the world have no holy places at all, and only in Jerusalem were such places built","Because in Jerusalem one day is longer, so there are many more hours to walk around","Think about how far the Western Wall is from the Church of the Holy Sepulchre and the Dome of the Rock.","Check the Old City map: how much walking time is there between the three places?","In Jerusalem the holy places of the three religions are dense and close: you can walk from the Western Wall to the Church of the Holy Sepulchre and the Dome of the Rock in one day."],"ru":["Посетитель хочет за один день увидеть место, святое для евреев, для мусульман и для христиан. Почему именно Иерусалим делает это возможным?","Потому что святые места трёх религий близки друг к другу в Старом городе и его окрестностях","Потому что в Иерусалиме больше всего самолётов, и можно летать между святыми местами","Потому что в других городах мира вообще нет святых мест, и только в Иерусалиме такие места построили","Потому что в Иерусалиме один день длиннее, и в нём намного больше часов для прогулок","Подумайте, как далеко Западная стена от храма Гроба Господня и от Купола Скалы.","Проверьте на карте Старого города: сколько времени пешком между тремя местами?","В Иерусалиме святые места трёх религий плотные и близкие: можно пройти пешком от Западной стены к храму Гроба Господня и Куполу Скалы за один день."],"ar":["زائر يريد أن يرى في يوم واحد مكانًا مقدسًا لليهود وللمسلمين وللمسيحيين. لماذا القدس تحديدًا تتيح ذلك؟","لأن الأماكن المقدسة للديانات الثلاث قريبة بعضها من بعض في البلدة القديمة وما حولها","لأن في القدس أكثر طائرات في البلاد، ويمكن الطيران بها بين الأماكن المقدسة","لأن في مدن العالم الأخرى لا توجد أماكن مقدسة إطلاقًا، وفي القدس وحدها بُنيت مثل هذه الأماكن","لأن في القدس اليوم الواحد أطول من غيره، وفيه ساعات أكثر بكثير للتجول","فكروا كم بعيد الحائط الغربي عن كنيسة القيامة وعن قبة الصخرة.","تحققوا على خريطة البلدة القديمة: كم وقت المشي بين الأماكن الثلاثة؟","في القدس الأماكن المقدسة للديانات الثلاث متقاربة: يمكن المشي من الحائط الغربي إلى كنيسة القيامة وقبة الصخرة في يوم واحد."]}],
["jeru",3,{"he":["בעיר דוד יש מנהרה עתיקה שחצבו בסלע, ומים זורמים בה עד היום. למה חצבו אותה?","כדי להביא מים מהמעיין אל תוך העיר","כדי להסתיר בה את האוצרות של המלך","כדי שתעבור בה רכבת אל תוך העיר","כדי להוביל את מי הגשם מהעיר אל הים","המעיין היה מחוץ לחומה. מה קורה לעיר כשאויב מקיף אותה?","חשבו מה הכי חשוב לאנשים שסגורים בעיר הרבה ימים.","המנהרה מוליכה את מי מעיין הגיחון אל תוך העיר. כך היו לתושבים מים גם כשאויב הקיף את העיר."],"en":["In the City of David there is an ancient tunnel cut in the rock, and water still flows in it today. Why was it cut?","To bring water from the spring into the city","To hide the king's treasures deep inside it","So that a train could go through it into the city","To carry rainwater from the city down to the sea","The spring was outside the wall. What happens to a city when an enemy surrounds it?","Think about what matters most to people who are shut inside a city for many days.","The tunnel carries the water of the Gihon Spring into the city. This way the people had water even when an enemy surrounded the city."],"ru":["В Городе Давида есть древний туннель, высеченный в скале, и вода течёт в нём до сих пор. Зачем его высекли?","Чтобы провести воду из источника в город","Чтобы спрятать в нём сокровища царя от врагов","Чтобы по нему в город мог ходить поезд","Чтобы отводить дождевую воду из города в море","Источник был за стеной. Что происходит с городом, когда его окружает враг?","Подумайте, что важнее всего людям, запертым в городе много дней.","Туннель приводит воду источника Гихон внутрь города. Так у жителей была вода, даже когда город окружал враг."],"ar":["في مدينة داود نفق قديم محفور في الصخر، وما زالت المياه تجري فيه حتى اليوم. لماذا حفروه؟","لإيصال الماء من النبع إلى داخل المدينة","لإخفاء كنوز الملك فيه بعيدًا عن الأعداء","لكي يمر فيه قطار إلى داخل المدينة","لتصريف مياه المطر من المدينة إلى البحر","كان النبع خارج السور. ماذا يحدث لمدينة عندما يحاصرها عدو؟","فكروا ما هو الأهم لناس محبوسين في مدينة أيامًا كثيرة.","النفق يوصل مياه نبع جيحون إلى داخل المدينة. هكذا كان للسكان ماء حتى عندما حاصر العدو المدينة."]}],
["jeru",3,{"he":["בבתים עתיקים בירושלים חצבו בורות גדולים מתחת לחצר. למה הם היו חשובים?","כי אספו בהם מי גשם בחורף לשימוש בקיץ","כי שמרו בהם שלג כדי לשחק בקיץ","כי הם הגנו על הבית מפני רעידות","כי גידלו בהם דגים למכירה בשוק, והדגים היו המזון העיקרי של העיר","בירושלים אין נהר, וגשם יורד רק בחלק מהשנה.","חשבו מה קורה לשתייה בחודשים החמים בלי ברז בבית.","בירושלים יורד גשם רק בחורף, ואין לידה נהר. לכן אספו את מי הגשם בבורות, ושתו מהם גם בקיץ."],"en":["In old houses in Jerusalem, people cut large pits under the courtyard. Why were they important?","They collected rainwater in winter for use in summer","They kept snow in them to play with in summer","They protected the house from earthquakes","They raised fish in them to sell at the market, and the fish were the city's main food","Jerusalem has no river, and rain falls only in part of the year.","Think about drinking water in the hot months without a tap at home.","In Jerusalem rain falls only in winter, and there is no river nearby. So people collected rainwater in pits and drank from them in summer too."],"ru":["В старых домах Иерусалима под двором вырубали большие ямы. Почему они были важны?","В них собирали зимний дождь, чтобы пить летом","В них хранили снег, чтобы играть с ним летом","Они защищали весь дом от землетрясений","В них разводили рыбу на продажу на рынке, и эта рыба была главной едой города","В Иерусалиме нет реки, а дождь идёт только часть года.","Подумайте, как быть с питьём в жаркие месяцы, если дома нет крана.","В Иерусалиме дождь идёт только зимой, и рядом нет реки. Поэтому дождевую воду собирали в ямы и пили её и летом."],"ar":["في البيوت القديمة في القدس حُفرت آبار كبيرة تحت الساحة. لماذا كانت مهمة؟","لأنهم جمعوا فيها مطر الشتاء ليشربوا منه في الصيف","لأنهم حفظوا فيها الثلج ليلعبوا به في الصيف","لأنها حمت البيت كله من الزلازل القوية","لأنهم ربّوا فيها أسماكًا لبيعها في السوق، وكان السمك الطعام الرئيسي للمدينة","في القدس لا يوجد نهر، والمطر ينزل فقط في جزء من السنة.","فكروا في الشرب في الأشهر الحارة بدون حنفية في البيت.","في القدس ينزل المطر في الشتاء فقط، ولا يوجد قربها نهر. لذلك جمعوا مياه المطر في الآبار وشربوا منها في الصيف أيضًا."]}],
["jeru",3,{"he":["באותו יום בקיץ, בירושלים בדרך כלל קריר יותר מאשר בתל אביב. מה הסיבה העיקרית?","כי ירושלים נמצאת גבוה בהרים","כי בירושלים יש יותר עצים","כי ירושלים קרובה יותר לים","כי בירושלים הבתים לבנים","חשבו מה קורה לטמפרטורה כשמטפסים על הר.","תל אביב שוכנת על חוף הים. מה שונה במקום של ירושלים?","ככל שעולים גבוה יותר, האוויר קר יותר. ירושלים גבוהה בהרבה מתל אביב, ולכן קרירה יותר."],"en":["On the same summer day, Jerusalem is usually cooler than Tel Aviv. What is the main reason?","Because Jerusalem is high up in the hills","Because Jerusalem has more trees","Because Jerusalem is closer to the sea","Because the houses in Jerusalem are white","Think about what happens to the temperature when you climb a mountain.","Tel Aviv lies on the seashore. What is different about where Jerusalem lies?","The higher you go, the colder the air. Jerusalem is much higher than Tel Aviv, so it is cooler."],"ru":["В один и тот же летний день в Иерусалиме обычно прохладнее, чем в Тель-Авиве. Какова главная причина?","Иерусалим расположен высоко в горах","В Иерусалиме больше деревьев","Иерусалим ближе к морю","В Иерусалиме белые дома","Подумайте, что происходит с температурой, когда поднимаешься в гору.","Тель-Авив стоит на берегу моря. Чем отличается место, где стоит Иерусалим?","Чем выше, тем холоднее воздух. Иерусалим намного выше Тель-Авива, поэтому там прохладнее."],"ar":["في اليوم نفسه في الصيف، تكون القدس عادة ألطف حرارة من تل أبيب. ما السبب الرئيسي؟","لأن القدس تقع عاليًا في الجبال","لأن في القدس أشجارًا أكثر","لأن القدس أقرب إلى البحر","لأن البيوت في القدس بيضاء","فكروا ماذا يحدث لدرجة الحرارة عندما نصعد جبلًا.","تل أبيب تقع على شاطئ البحر. ما المختلف في مكان القدس؟","كلما صعدنا أعلى يصبح الهواء أبرد. القدس أعلى بكثير من تل أبيب، لذلك هي ألطف حرارة."]}],
