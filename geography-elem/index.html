["med",3,{"he":["איך עזר הים התיכון לעמים שונים להכיר אחד את השני?","סוחרים הפליגו בין חופים, ואיתם עברו סחורות, רעיונות וסיפורים","הם שלחו אחד לשני יוני דואר מעל הים","הם בנו גשר עץ מצד לצד","הם דיברו בטלפון ימי עתיק","לפני המטוס והרכבת, מה הייתה הדרך הכי מהירה לנסוע בין ארצות?","חשבו מה נוסע בספינת סוחר חוץ מסחורות: אנשים, ומה יש לאנשים בראש.","הספינה הייתה הכביש המהיר של העולם העתיק. סוחרים הביאו לא רק סחורות אלא גם שפות, אוכל ורעיונות, וכך העמים השפיעו אחד על השני."],"en":["How did the Mediterranean Sea help different peoples get to know each other?","Traders sailed between shores, and with them moved goods, ideas and stories","They sent each other carrier pigeons over the sea","They built a wooden bridge from side to side","They talked on an ancient sea telephone","Before the plane and the train, what was the fastest way to travel between lands?","Think about what travels on a trading ship besides goods: people, and what people have in their heads.","The ship was the highway of the ancient world. Traders brought not only goods but also languages, food and ideas, and so the peoples influenced each other."],"ru":["Как Средиземное море помогло разным народам узнать друг друга?","Купцы плавали между берегами, и вместе с ними переходили товары, идеи и рассказы","Они посылали друг другу почтовых голубей над морем","Они построили деревянный мост с одной стороны на другую","Они разговаривали по древнему морскому телефону","До самолёта и поезда, какой был самый быстрый способ путешествовать между странами?","Подумайте, что путешествует на торговом корабле кроме товаров: люди, и что есть у людей в голове.","Корабль был скоростной дорогой древнего мира. Купцы привозили не только товары, но и языки, еду и идеи, и так народы влияли друг на друга."],"ar":["كيف ساعد البحر المتوسط شعوبًا مختلفة على التعارف؟","أبحار التجار بين الشواطئ، ومعهم انتقلت البضائع والأفكار والقصص","أرسلوا بعضهم لبعض حمامًا زاجلًا فوق البحر","بنوا جسرًا خشبيًا من طرف إلى طرف","تحدثوا عبر هاتف بحري قديم","قبل الطائرة والقطار، ما أسرع طريقة للسفر بين البلدان؟","فكروا ماذا يسافر في سفينة تاجر غير البضائع: الناس، وماذا في رؤوس الناس.","كانت السفينة الطريق السريع للعالم القديم. جلب التجار ليس فقط البضائع بل أيضًا اللغات والطعام والأفكار، وهكذا أثرت الشعوب بعضها في بعض."]}],
["med",3,{"he":["באגן הים התיכון יש מקומות עם מעט מים, כמו אצלנו בארץ. מה עוזר לישראל לחיות בנוחות בלי הרבה גשם?","חיסכון במים, השקיה חכמה והתפלת מי ים","העברת הכנרת לתוך הים","יבוא שלג מחו\"ל","בניית סכרים על ים המלח","חשבו על שלוש דרכים: לבזבז פחות, להשקות בדיוק, ולייצר מים מתוקים ממים מלוחים.","איזה דבר יש לנו הרבה ממנו ליד הבית, אבל הוא מלוח מדי לשתייה?","ישראל מתמודדת עם מחסור במים בחוכמה: חיסכון, השקיה בטפטוף והתפלה שהופכת מי ים למי שתייה."],"en":["In the Mediterranean basin there are places with little water, like our country. What helps Israel live comfortably without much rain?","Saving water, smart irrigation and desalination of sea water","Moving the Sea of Galilee into the sea","Importing snow from abroad","Building dams on the Dead Sea","Think about three ways: waste less, water exactly, and make fresh water from salty water.","What do we have a lot of next to our home, but it is too salty to drink?","Israel deals with water shortage cleverly: saving, drip irrigation and desalination that turns sea water into drinking water."],"ru":["В Средиземноморье есть места с малым количеством воды, как в нашей стране. Что помогает Израилю жить удобно без большого количества дождя?","Экономия воды, умное орошение и опреснение морской воды","Перемещение Кинерета в море","Импорт снега из-за границы","Строительство дамб на Мёртвом море","Подумайте о трёх путях: тратить меньше, поливать точно, и делать пресную воду из солёной.","Чего у нас много рядом с домом, но это слишком солёное, чтобы пить?","Израиль справляется с нехваткой воды с умом: экономия, капельное орошение и опреснение, превращающее морскую воду в питьевую."],"ar":["في حوض البحر المتوسط أماكن قليلة الماء، مثل بلدنا. ما الذي يساعد إسرائيل على العيش براحة من دون مطر كثير؟","توفير الماء والري الذكي وتحلية ماء البحر","نقل بحيرة طبريا إلى داخل البحر","استيراد الثلج من الخارج","بناء سدود على البحر الميت","فكروا في ثلاث طرق: هدر أقل، وسقي بدقة، وصناعة ماء عذب من ماء مالح.","أي شيء لدينا منه الكثير قرب البيت، لكنه مالح أكثر من اللازم للشرب؟","تواجه إسرائيل نقص الماء بذكاء: توفير، وري بالتنقيط، وتحلية تحول ماء البحر إلى ماء شرب."]}],
["regions",1,{"he":["איזה אזור גדול ויבש משתרע בדרום ישראל?","הנגב","הגליל","מישור החוף","בקעת הירדן","חשבו על מפת ישראל: הצפון ירוק והדרום צהוב ויבש. איך קוראים לדרום היבש?","זכרו: איפה יורד מעט גשם, בצפון או בדרום? האזור היבש נמצא שם.","הנגב הוא אזור מדברי גדול בדרום הארץ. הוא מכסה יותר ממחצית שטח ישראל, וגרים בו יחסית מעט אנשים."],"en":["Which big dry region stretches across the south of Israel?","The Negev","The Galilee","The coastal plain","The Jordan Valley","Think about the map of Israel: the north is green and the south is yellow and dry. What is the dry south called?","Remember: where does little rain fall, in the north or in the south? The dry region is there.","The Negev is a big desert region in the south of the country. It covers more than half of Israel, and relatively few people live in it."],"ru":["Какой большой сухой район раскинулся на юге Израиля?","Негев","Галилея","Прибрежная равнина","Иорданская долина","Подумайте о карте Израиля: север зелёный, а юг жёлтый и сухой. Как называется сухой юг?","Вспомните: где выпадает мало дождя, на севере или на юге? Сухой район находится там.","Негев это большой пустынный район на юге страны. Он покрывает больше половины площади Израиля, а живёт в нём относительно мало людей."],"ar":["أي منطقة كبيرة وجافة تمتد في جنوب إسرائيل؟","النقب","الجليل","السهل الساحلي","غور الأردن","فكروا في خريطة إسرائيل: الشمال أخضر والجنوب أصفر جاف. ما اسم الجنوب الجاف؟","تذكروا: أين ينزل مطر قليل، في الشمال أم في الجنوب؟ المنطقة الجافة موجودة هناك.","النقب منطقة صحراوية كبيرة في جنوب البلاد. يغطي أكثر من نصف مساحة إسرائيل، ويسكن فيه قليل من الناس نسبيًا."]}],
["regions",1,{"he":["מהו המקום הנמוך ביותר בעולם, והוא נמצא בארץ שלנו?","ים המלח וחופו","פסגת החרמון","עמק יזרעאל","חופי אילת","נמוך ביותר פירושו הכי מתחת לפני הים. המים זורמים לשם ונאספים, כי אין להם לאן להמשיך.","בדקו על המפה איזה גוף מים בארץ יושב בשקע עמוק, עמוק מכולם.","ים המלח נמצא כארבע מאות ושלושים מטרים מתחת לפני הים, והוא המקום הנמוך ביותר בעולם. המים שלו מלוחים מאוד."],"en":["What is the lowest place in the world, and it is in our country?","The Dead Sea and its shore","The peak of Mount Hermon","The Jezreel Valley","The beaches of Eilat","Lowest means the farthest below sea level. Water flows there and collects, because it has nowhere to go on.","Check on the map which body of water in the country sits in a deep hollow, the deepest of all.","The Dead Sea lies about four hundred and thirty meters below sea level, and it is the lowest place in the world. Its water is very salty."],"ru":["Какое самое низкое место в мире, и оно находится в нашей стране?","Мёртвое море и его берег","Вершина Хермона","Изреельская долина","Пляжи Эйлата","Самое низкое значит самое далёкое ниже уровня моря. Вода течёт туда и собирается, потому что ей некуда идти дальше.","Проверьте на карте, какой водоём в стране лежит в глубокой впадине, глубже всех.","Мёртвое море находится примерно на четыреста тридцать метров ниже уровня моря, и это самое низкое место в мире. Его вода очень солёная."],"ar":["ما أكثر مكان انخفاضًا في العالم، وهو موجود في بلادنا؟","البحر الميت وشاطئه","قمة جبل الشيخ","مرج ابن عامر","شواطئ إيلات","الأكثر انخفاضًا يعني الأكثر تحت مستوى البحر. المياه تجري إلى هناك وتتجمع، لأنه لا مكان لها لتواصل.","تحققوا على الخريطة أي مسطح مائي في البلاد يقع في منخفض عميق، الأعمق بين الكل.","البحر الميت يقع نحو أربعمئة وثلاثين مترًا تحت مستوى البحر، وهو أكثر مكان منخفضًا في العالم. مياهه شديدة الملوحة."]}],
["regions",1,{"he":["איזה אזור בישראל ירוק במיוחד, עם הרבה גשמים בחורף ונחלים?","הגליל שבצפון","הנגב שבדרום","מדבר יהודה","בקעת ים המלח","חשבו על גשם: איפה יורד הרבה גשם, בצפון או בדרום?","ירוק צריך מים. איזה אזור בארץ מקבל יותר מים מהשמיים?","הצפון, ובמיוחד הגליל, מקבל הרבה גשם בחורף. לכן הוא ירוק, מלא נחלים ופרדסים."],"en":["Which region in Israel is especially green, with lots of winter rain and streams?","The Galilee in the north","The Negev in the south","The Judean Desert","The Dead Sea valley","Think about rain: where does a lot of rain fall, in the north or in the south?","Green needs water. Which region in the country gets more water from the sky?","The north, and especially the Galilee, gets a lot of winter rain. That is why it is green, full of streams and orchards."],"ru":["Какой район в Израиле особенно зелёный, с большим количеством зимних дождей и ручьёв?","Галилея на севере","Негев на юге","Иудейская пустыня","Долина Мёртвого моря","Подумайте о дожде: где выпадает много дождя, на севере или на юге?","Зелени нужна вода. Какой район в стране получает больше воды с неба?","Север, и особенно Галилея, получает много зимнего дождя. Поэтому он зелёный, полный ручьёв и садов."],"ar":["أي منطقة في إسرائيل خضراء بشكل خاص، مع أمطار شتوية كثيرة ومجاري مياه؟","الجليل في الشمال","النقب في الجنوب","صحراء يهودا","غور البحر الميت","فكروا في المطر: أين ينزل مطر كثير، في الشمال أم في الجنوب؟","الخضرة تحتاج ماء. أي منطقة في البلاد تحصل على ماء أكثر من السماء؟","الشمال، وخاصة الجليل، يحصل على مطر شتوي كثير. لذلك هو أخضر، مليء بمجاري المياه والبساتين."]}],
["regions",1,{"he":["מה שמו של האגם הגדול בצפון ישראל, שמימיו מתוקים וחשובים לשתייה?","הכנרת","ים המלח","הים התיכון","מפרץ אילת","חשבו על מים מתוקים בצפון: מהם שותים, ולא מתרחצים במלח.","האגם הזה נראה על המפה כמו טיפה כחולה גדולה מעל בקעת הירדן.","הכנרת היא האגם המתוק הגדול של ישראל. היא בצפון, ומימיה חשובים לשתייה ולחקלאות."],"en":["What is the name of the big lake in the north of Israel, whose fresh water is important for drinking?","The Sea of Galilee","The Dead Sea","The Mediterranean Sea","The Gulf of Eilat","Think about fresh water in the north: people drink it, not bathe in salt.","This lake looks on the map like a big blue drop above the Jordan Valley.","The Sea of Galilee is Israel's big freshwater lake. It is in the north, and its water is important for drinking and farming."],"ru":["Как называется большое озеро на севере Израиля, чья пресная вода важна для питья?","Кинерет","Мёртвое море","Средиземное море","Эйлатский залив","Подумайте о пресной воде на севере: её пьют, а не купаются в соли.","Это озеро выглядит на карте как большая синяя капля над Иорданской долиной.","Кинерет это большое пресное озеро Израиля. Оно на севере, и его вода важна для питья и сельского хозяйства."],"ar":["ما اسم البحيرة الكبيرة في شمال إسرائيل، التي مياهها العذبة مهمة للشرب؟","بحيرة طبريا","البحر الميت","البحر المتوسط","خليج إيلات","فكروا في ماء عذب في الشمال: يُشرب ولا يُستحم في ملح.","هذه البحيرة تبدو على الخريطة كنقطة زرقاء كبيرة فوق غور الأردن.","بحيرة طبريا هي البحيرة العذبة الكبيرة في إسرائيل. هي في الشمال، ومياهها مهمة للشرب والزراعة."]}],
["regions",1,{"he":["איפה גרים רוב תושבי ישראל?","במישור החוף, ליד הים התיכון","בנגב הדרומי","ברמת הגולן","במדבר יהודה","חשבו איפה נמצאות רוב הערים הגדולות שאתם מכירים, כמו תל אביב ונתניה.","מצאו על המפה את תל אביב ואת נתניה, ובדקו איך קוראים לרצועה שביניהן לבין הים.","מישור החוף לאורך הים התיכון הוא האזור המאוכלס ביותר בישראל: הוא שטוח, נוח לבנייה וקרוב לנמלים."],"en":["Where do most of Israel's people live?","In the coastal plain, next to the Mediterranean Sea","In the southern Negev","In the Golan Heights","In the Judean Desert","Think about where most of the big cities you know are, like Tel Aviv and Netanya.","Find Tel Aviv and Netanya on the map, and check what the strip between them and the sea is called.","The coastal plain along the Mediterranean is the most crowded region in Israel: it is flat, easy to build on and close to ports."],"ru":["Где живёт большинство жителей Израиля?","На прибрежной равнине, рядом со Средиземным морем","В южном Негеве","На Голанских высотах","В Иудейской пустыне","Подумайте, где находятся большинство больших городов, которые вы знаете, вроде Тель-Авива и Нетании.","Найдите на карте Тель-Авив и Нетанию и проверьте, как называется полоса между ними и морем.","Прибрежная равнина вдоль Средиземного моря это самый населённый район Израиля: она плоская, удобная для строительства и близкая к портам."],"ar":["أين يسكن معظم سكان إسرائيل؟","في السهل الساحلي، بجانب البحر المتوسط","في النقب الجنوبي","في هضبة الجولان","في صحراء يهودا","فكروا أين توجد معظم المدن الكبيرة التي تعرفونها، مثل تل أبيب ونتانيا.","جدوا على الخريطة تل أبيب ونتانيا، وتحققوا ما اسم الشريط بينهما وبين البحر.","السهل الساحلي على طول البحر المتوسط هو أكثر مناطق إسرائيل سكانًا: هو مستوٍ، ومريح للبناء وقريب من الموانئ."]}],
["regions",1,{"he":["על אילו הרים יושבת ירושלים?","הרי יהודה","הרי הגליל","הרי הגולן","הרי הנגב","חשבו איפה ירושלים על המפה: במרכז הארץ, בצפונה או בדרומה?","מצאו את ירושלים על מפה פיזית ובדקו מה שם רכס ההרים סביבה.","ירושלים יושבת על הרי יהודה, כשמונה מאות מטרים מעל פני הים. הגובה נותן לה אוויר קריר יותר מאשר בחוף."],"en":["On which mountains does Jerusalem sit?","The Judean Mountains","The Galilee mountains","The Golan heights","The Negev mountains","Think about where Jerusalem is on the map: in the center of the country, in its north or in its south?","Find Jerusalem on a physical map and check the name of the mountain ridge around it.","Jerusalem sits on the Judean Mountains, about eight hundred meters above sea level. The height gives it cooler air than the coast."],"ru":["На каких горах стоит Иерусалим?","Иудейские горы","Галилейские горы","Голанские высоты","Горы Негева","Подумайте, где Иерусалим на карте: в центре страны, на севере или на юге?","Найдите Иерусалим на физической карте и проверьте название горного хребта вокруг него.","Иерусалим стоит на Иудейских горах, примерно восемьсот метров над уровнем моря. Высота даёт ему более прохладный воздух, чем на побережье."],"ar":["على أي جبال تقع القدس؟","جبال يهودا","جبال الجليل","هضبة الجولان","جبال النقب","فكروا أين القدس على الخريطة: في وسط البلاد، في شمالها أم في جنوبها؟","جدوا القدس على خريطة طبيعية وتحققوا ما اسم سلسلة الجبال حولها.","تقع القدس على جبال يهودا، نحو ثمانمئة متر فوق مستوى البحر. الارتفاع يعطيها هواء أبرد من الساحل."]}],
["regions",2,{"he":["למה צפון הארץ ירוק יותר מדרומה?","כי בצפון יורד הרבה יותר גשם מאשר בדרום","כי בדרום אסור לשתול עצים","כי הצפון קרוב יותר לירח","כי בדרום השמש לא זורחת","חשבו מה צמחים צריכים כדי להיות ירוקים, ומאיפה זה מגיע.","השוו כמות גשם בחורף בין מטולה בצפון לבאר שבע בדרום.","כמות הגשם יורדת מצפון לדרום. בגליל יורדים מאות מילימטרים בשנה, ובנגב רק מעט. לכן הצבע משתנה על המפה."],"en":["Why is the north of the country greener than its south?","Because much more rain falls in the north than in the south","Because planting trees is forbidden in the south","Because the north is closer to the moon","Because the sun does not rise in the south","Think about what plants need to be green, and where it comes from.","Compare the amount of winter rain between Metula in the north and Be'er Sheva in the south.","The amount of rain drops from north to south. In the Galilee hundreds of millimeters fall each year, and in the Negev only a little. That is why the color changes on the map."],"ru":["Почему север страны зеленее её юга?","Потому что на севере выпадает намного больше дождя, чем на юге","Потому что на юге запрещено сажать деревья","Потому что север ближе к луне","Потому что на юге солнце не восходит","Подумайте, что нужно растениям, чтобы быть зелёными, и откуда это приходит.","Сравните количество зимнего дождя между Метулой на севере и Беэр-Шевой на юге.","Количество дождя уменьшается с севера на юг. В Галилее выпадают сотни миллиметров в год, а в Негеве лишь немного. Поэтому цвет меняется на карте."],"ar":["لماذا شمال البلاد أكثر خضرة من جنوبها؟","لأن في الشمال ينزل مطر أكثر بكثير مما في الجنوب","لأن في الجنوب يُمنع غرس الأشجار","لأن الشمال أقرب إلى القمر","لأن في الجنوب الشمس لا تشرق","فكروا ماذا تحتاج النباتات لتكون خضراء، ومن أين يأتي ذلك.","قارنوا كمية مطر الشتاء بين المطلة في الشمال وبئر السبع في الجنوب.","كمية المطر تقل من الشمال إلى الجنوب. في الجليل تنزل مئات المليمترات في السنة، وفي النقب القليل فقط. لذلك يتغير اللون على الخريطة."]}],
["regions",2,{"he":["אילו שני גופי מים מחבר נהר הירדן?","את הכנרת ואת ים המלח","את הים התיכון ואת הים האדום","את הכנרת ואת הים התיכון","את ים המלח ואת מפרץ אילת","חשבו על מסלול של נהר: מהמקור בצפון, דרך אגם, ועד השפך בדרום.","עקבו על המפה אחרי הקו הכחול של הירדן מצפון לדרום.","הירדן זורם מהחרמון, נכנס לכנרת ויוצא ממנה דרומה אל ים המלח."],"en":["Which two bodies of water does the Jordan River connect?","The Sea of Galilee and the Dead Sea","The Mediterranean and the Red Sea","The Sea of Galilee and the Mediterranean","The Dead Sea and the Gulf of Eilat","Think about a river's path: from the source in the north, through a lake, to the mouth in the south.","Follow the blue line of the Jordan on the map from north to south.","The Jordan flows from the Hermon, enters the Sea of Galilee and leaves it southward to the Dead Sea."],"ru":["Какие два водоёма соединяет река Иордан?","Кинерет и Мёртвое море","Средиземное и Красное моря","Кинерет и Средиземное море","Мёртвое море и Эйлатский залив","Подумайте о пути реки: от истока на севере, через озеро, до устья на юге.","Проследите на карте синюю линию Иордана с севера на юг.","Иордан течёт от Хермона, входит в Кинерет и выходит из него на юг к Мёртвому морю."],"ar":["أي مسطحين مائيين يربط نهر الأردن؟","بحيرة طبريا والبحر الميت","البحر المتوسط والبحر الأحمر","بحيرة طبريا والبحر المتوسط","البحر الميت وخليج إيلات","فكروا في مسار النهر: من المنبع في الشمال، عبر بحيرة، إلى المصب في الجنوب.","تتبعوا على الخريطة الخط الأزرق لنهر الأردن من الشمال إلى الجنوب.","يجري الأردن من جبل الشيخ، يدخل بحيرة طبريا ويخرج منها جنوبًا إلى البحر الميت."]}],
["regions",2,{"he":["למה בנגב גרים פחות אנשים מאשר במרכז הארץ?","כי שם יבש ומעט מים, וקשה יותר לגור ולעבוד","כי שם קר מדי כל השנה","כי אסור לבנות שם בתים","כי אין שם שמש","חשבו על הצרכים הבסיסיים של עיר: מים, עבודה ואוכל. מה קשה למצוא במדבר?","מה משותף לכל עיר גדולה שאתם מכירים, ומה חסר לאזור יבש?","המדבר יפה אבל קשה למגורים: מעט מים, מעט גשם וחום גדול. לכן רוב האנשים מתרכזים במרכז ובצפון."],"en":["Why do fewer people live in the Negev than in the center of the country?","Because it is dry with little water, and living and working are harder","Because it is too cold there all year","Because building houses there is forbidden","Because there is no sun there","Think about the basic needs of a city: water, work and food. What is hard to find in a desert?","What do all the big cities you know share, and what is a dry region missing?","The desert is beautiful but hard to live in: little water, little rain and great heat. That is why most people gather in the center and the north."],"ru":["Почему в Негеве живёт меньше людей, чем в центре страны?","Потому что там сухо и мало воды, и жить и работать труднее","Потому что там слишком холодно весь год","Потому что строить там дома запрещено","Потому что там нет солнца","Подумайте об основных нуждах города: вода, работа и еда. Что трудно найти в пустыне?","Что общего у всех больших городов, которые вы знаете, и чего не хватает сухому району?","Пустыня красива, но жить в ней трудно: мало воды, мало дождя и сильная жара. Поэтому большинство людей собирается в центре и на севере."],"ar":["لماذا يسكن في النقب أشخاص أقل مما في وسط البلاد؟","لأنه جاف وقليل الماء، والسكن والعمل أصعب","لأنه بارد أكثر من اللازم كل السنة","لأنه يُمنع بناء بيوت هناك","لأنه لا توجد فيه شمس","فكروا في الاحتياجات الأساسية لمدينة: ماء وعمل وطعام. ما الصعب إيجاده في الصحراء؟","ما المشترك بين كل مدينة كبيرة تعرفونها، وما الناقص في منطقة جافة؟","الصحراء جميلة لكن السكن فيها صعب: ماء قليل ومطر قليل وحر شديد. لذلك يتجمع معظم الناس في الوسط والشمال."]}],
["regions",2,{"he":["מהם הגולן והחרמון?","רמה והר גבוהים בצפון מזרח הארץ","שני איים בים התיכון","ערי נמל בדרום","מדבריות במערב הארץ","חשבו על מקום גבוה וקריר, שבו יורד שלג בחורף ואפשר לגלוש.","חפשו על המפה את הפינה הצפון מזרחית של ישראל.","רמת הגולן היא רמה גבוהה בצפון מזרח הארץ, והחרמון הוא ההר הגבוה ביותר בישראל, עם שלג בחורף."],"en":["What are the Golan and the Hermon?","A high plateau and mountain in the northeast of the country","Two islands in the Mediterranean","Port cities in the south","Deserts in the west of the country","Think about a high cool place, where snow falls in winter and people can ski.","Look on the map for the northeastern corner of Israel.","The Golan Heights is a high plateau in the northeast, and the Hermon is the highest mountain in Israel, with snow in winter."],"ru":["Что такое Голан и Хермон?","Высокое плато и гора на северо-востоке страны","Два острова в Средиземном море","Портовые города на юге","Пустыни на западе страны","Подумайте о высоком прохладном месте, где зимой выпадает снег и можно кататься на лыжах.","Поищите на карте северо-восточный угол Израиля.","Голанские высоты это высокое плато на северо-востоке, а Хермон самая высокая гора в Израиле, со снегом зимой."],"ar":["ما هما الجولان وجبل الشيخ؟","هضبة وجبل مرتفعان في شمال شرق البلاد","جزيرتان في البحر المتوسط","مدن موانئ في الجنوب","صحاري في غرب البلاد","فكروا في مكان مرتفع وبارد، ينزل فيه الثلج شتاء ويمكن التزلج.","ابحثوا على الخريطة عن الزاوية الشمالية الشرقية لإسرائيل.","هضبة الجولان هي هضبة مرتفعة في الشمال الشرقي، وجبل الشيخ هو أعلى جبل في إسرائيل، وفيه ثلج في الشتاء."]}],
["regions",3,{"he":["ישראל ארץ קטנה, אבל יש בה מדבר, הרים ירוקים ובקעה חמה. איך זה שבארץ אחת קטנה יש אקלימים כל כך שונים?","כי הארץ ארוכה מצפון לדרום, הגשם פוחת דרומה והגבהים משתנים","כי כל עיר בוחרת לה אקלים משלה","כי הים מתחלק לשלושה ימים","כי ככה זה בכל ארץ קטנה","חשבו על שני דברים שמשתנים מצפון לדרום: כמה גשם יורד, וכמה גבוה המקום מעל הים.","השוו שלושה מקומות על המפה: הגליל, מישור החוף והנגב. מה משתנה ביניהם?","גשם וגובה יוצרים אקלים: הצפון הגבוה מקבל הרבה גשם, החוף מתון ליד הים, והדרום הופך מדברי."],"en":["Israel is a small country, but it has a desert, green mountains and a hot valley. How can one small country have such different climates?","Because the country is long from north to south, the rain lessens southward and the heights change","Because every city chooses its own climate","Because the sea splits into three seas","Because that is how it is in every small country","Think about two things that change from north to south: how much rain falls, and how high the place is above the sea.","Compare three places on the map: the Galilee, the coastal plain and the Negev. What changes between them?","Rain and height create climate: the high north gets lots of rain, the coast is mild next to the sea, and the south becomes desert."],"ru":["Израиль маленькая страна, но в ней есть пустыня, зелёные горы и жаркая долина. Как в одной маленькой стране могут быть такие разные климаты?","Потому что страна длинная с севера на юг, дождь уменьшается к югу и высоты меняются","Потому что каждый город выбирает себе свой климат","Потому что море делится на три моря","Потому что так в любой маленькой стране","Подумайте о двух вещах, которые меняются с севера на юг: сколько дождя выпадает и как высоко место над морем.","Сравните три места на карте: Галилею, прибрежную равнину и Негев. Что меняется между ними?","Дождь и высота создают климат: высокий север получает много дождя, побережье мягкое рядом с морем, а юг становится пустыней."],"ar":["إسرائيل بلد صغير، لكن فيها صحراء وجبال خضراء وغور حار. كيف يكون في بلد واحد صغير مناخات مختلفة جدًا هكذا؟","لأن البلاد طويلة من الشمال إلى الجنوب، والمطر يقل جنوبًا والارتفاعات تتغير","لأن كل مدينة تختار لنفسها مناخها","لأن البحر ينقسم إلى ثلاثة بحار","لأن هكذا الأمر في كل بلد صغير","فكروا في شيئين يتغيران من الشمال إلى الجنوب: كم مطر ينزل، وكم ارتفاع المكان فوق البحر.","قارنوا ثلاثة أماكن على الخريطة: الجليل والسهل الساحلي والنقب. ما الذي يتغير بينها؟","المطر والارتفاع يصنعان المناخ: الشمال المرتفع يحصل على مطر كثير، والساحل معتدل بجانب البحر، والجنوب يصبح صحراويًا."]}],
["regions",3,{"he":["למה המים של ים המלח כל כך מלוחים?","כי מים נכנסים אליו ולא יוצאים, האדים עפים לשמיים והמלח נשאר","כי ספינות שופכות שם מלח","כי החרמון עשוי מלח","כי ככה נוצר כל ים","חשבו על סיר מים מלוחים על האש: המים מתאדים, ומה נשאר בתחתית?","לים המלח יש רק כניסת מים, בלי יציאה. לאן המים נעלמים?","ים המלח הוא שקע סגור: הירדן מזרים מים פנימה, השמש מאדה אותם, והמלח נשאר ומצטבר. לכן קל לצוף בו."],"en":["Why is the water of the Dead Sea so salty?","Because water flows in and does not flow out, the vapor flies to the sky and the salt stays","Because ships dump salt there","Because the Hermon is made of salt","Because that is how every sea is made","Think about a pot of salty water on the flame: the water evaporates, and what stays at the bottom?","The Dead Sea has only a water entrance, with no exit. Where does the water disappear to?","The Dead Sea is a closed hollow: the Jordan pours water in, the sun evaporates it, and the salt stays and collects. That is why floating in it is easy."],"ru":["Почему вода Мёртвого моря такая солёная?","Потому что вода втекает в него и не вытекает, пар улетает в небо, а соль остаётся","Потому что корабли высыпают там соль","Потому что Хермон сделан из соли","Потому что так создаётся каждое море","Подумайте о кастрюле с солёной водой на огне: вода испаряется, и что остаётся на дне?","У Мёртвого моря есть только вход воды, без выхода. Куда вода исчезает?","Мёртвое море это закрытая впадина: Иордан вливает воду внутрь, солнце испаряет её, а соль остаётся и накапливается. Поэтому плавать в нём легко."],"ar":["لماذا مياه البحر الميت مالحة جدًا؟","لأن الماء يدخل إليه ولا يخرج، والبخار يطير إلى السماء والملح يبقى","لأن السفن تفرغ هناك الملح","لأن جبل الشيخ مصنوع من الملح","لأن هكذا يتكون كل بحر","فكروا في قدر ماء مالح على النار: الماء يتبخر، وماذا يبقى في القاع؟","للبحر الميت مدخل ماء فقط، بلا مخرج. إلى أين يختفي الماء؟","البحر الميت هو منخفض مغلق: الأردن يضخ الماء إلى الداخل، والشمس تبخره، والملح يبقى ويتراكم. لذلك الطفو فيه سهل."]}],
["regions",3,{"he":["חקלאי רוצה לגדל תפוזים, שצריכים הרבה מים. איזה אזור ידרוש הכי הרבה השקיה?","הנגב, כי שם יורד הכי מעט גשם","הגליל, כי שם יש הרבה גשם","מישור החוף, כי שם קרוב לים","בקעת הכנרת, כי שם יש אגם","חשבו מה השמיים נותנים בחינם ומה החקלאי חייב להוסיף לבד במקום יבש.","ככל שיורד פחות גשם, צריך יותר השקיה. איזה אזור הכי יבש?","תפוזים צמאים למים. בגליל הגשם עוזר, אבל בנגב היבש כמעט כל המים חייבים לבוא מהשקיה."],"en":["A farmer wants to grow oranges, which need a lot of water. Which region will need the most irrigation?","The Negev, because the least rain falls there","The Galilee, because there is a lot of rain there","The coastal plain, because it is close to the sea","The Sea of Galilee valley, because there is a lake there","Think about what the sky gives for free and what the farmer must add alone in a dry place.","The less rain falls, the more irrigation is needed. Which region is the driest?","Oranges are thirsty for water. In the Galilee the rain helps, but in the dry Negev almost all the water must come from irrigation."],"ru":["Фермер хочет выращивать апельсины, которым нужно много воды. Какой район потребует больше всего орошения?","Негев, потому что там выпадает меньше всего дождя","Галилея, потому что там много дождя","Прибрежная равнина, потому что она близко к морю","Долина Кинерета, потому что там есть озеро","Подумайте, что небо даёт бесплатно, а что фермер должен добавить сам в сухом месте.","Чем меньше дождя выпадает, тем больше нужно орошения. Какой район самый сухой?","Апельсины жаждут воды. В Галилее дождь помогает, но в сухом Негеве почти вся вода должна прийти из орошения."],"ar":["مزارع يريد زراعة البرتقال، الذي يحتاج ماء كثيرًا. أي منطقة ستحتاج أكثر ري؟","النقب، لأن فيه ينزل أقل مطر","الجليل، لأن فيه مطر كثير","السهل الساحلي، لأنه قريب من البحر","غور طبريا، لأن فيه بحيرة","فكروا ماذا تعطي السماء مجانًا وماذا يجب على المزارع أن يضيف وحده في مكان جاف.","كلما نزل مطر أقل، احتجنا ريًا أكثر. أي منطقة هي الأكثر جفافًا؟","البرتقال عطشان للماء. في الجليل المطر يساعد، لكن في النقب الجاف كل الماء تقريبًا يجب أن يأتي من الري."]}],
["jeru",1,{"he":["מהי בירת ישראל?","ירושלים","תל אביב","חיפה","באר שבע","חשבו איפה יושבת הכנסת, בית הנבחרים של המדינה.","שמה של העיר מופיע בהמנון, בתפילות ובחדשות על הממשלה.","ירושלים היא בירת ישראל: בה יושבים הכנסת, משכן הנשיא ומשרדי הממשלה."],"en":["What is the capital of Israel?","Jerusalem","Tel Aviv","Haifa","Be'er Sheva","Think about where the Knesset sits, the parliament of the state.","The city's name appears in the anthem, in prayers and in the news about the government.","Jerusalem is the capital of Israel: the Knesset, the President's Residence and the government offices sit there."],"ru":["Что является столицей Израиля?","Иерусалим","Тель-Авив","Хайфа","Беэр-Шева","Подумайте, где заседает Кнессет, парламент государства.","Название города встречается в гимне, в молитвах и в новостях о правительстве.","Иерусалим это столица Израиля: там находятся Кнессет, резиденция президента и правительственные учреждения."],"ar":["ما عاصمة إسرائيل؟","القدس","تل أبيب","حيفا","بئر السبع","فكروا أين تقع الكنيست، برلمان الدولة.","اسم المدينة يظهر في النشيد، وفي الصلوات وفي أخبار الحكومة.","القدس هي عاصمة إسرائيل: فيها الكنيست ومقر الرئيس ومكاتب الحكومة."]}],
["jeru",1,{"he":["איזה אתר בעיר העתיקה קדוש במיוחד ליהודים, ואליו באים להתפלל?","הכותל המערבי","שוק מחנה יהודה","גן החיות התנכי","מגדל דוד","חשבו על המקום הקדוש ביותר ליהודים, שקשור לבית המקדש העתיק.","בדקו איזו מהאפשרויות היא חומה עתיקה, ולא שוק, גן חיות או מגדל.","הכותל המערבי הוא שריד החומה של הר הבית. הוא המקום הקדוש ביותר שבו יהודים מתפללים."],"en":["Which site in the Old City is especially holy to Jews, and people come to it to pray?","The Western Wall","Mahane Yehuda market","The Biblical Zoo","The Tower of David","Think about the holiest place for Jews, connected to the ancient Temple.","Check which of the options is an ancient wall, and not a market, a zoo or a tower.","The Western Wall is a remnant of the Temple Mount wall. It is the holiest place where Jews pray."],"ru":["Какое место в Старом городе особенно свято для евреев, и к нему приходят молиться?","Западная стена","Рынок Махане Иегуда","Библейский зоопарк","Башня Давида","Подумайте о самом святом месте для евреев, связанном с древним Храмом.","Проверьте, какой из вариантов является древней стеной, а не рынком, зоопарком или башней.","Западная стена это остаток стены Храмовой горы. Это самое святое место, где евреи молятся."],"ar":["أي موقع في البلدة القديمة مقدس بشكل خاص لليهود، ويأتون إليه للصلاة؟","حائط المبكى (الحائط الغربي)","سوق محانيه يهودا","حديقة الحيوانات التوراتية","برج داود","فكروا في المكان الأقدس لليهود، المرتبط بالهيكل القديم.","تحققوا أي من الخيارات هو سور قديم، وليس سوقًا أو حديقة حيوانات أو برجًا.","الحائط الغربي هو بقية سور جبل الهيكل. هو أقدس مكان يصلي فيه اليهود."]}],
["jeru",1,{"he":["מה מקיף את העיר העתיקה של ירושלים עד היום?","חומת אבן עתיקה עם שערים","גדר תיל מודרנית","נהר עמוק","קיר ענק מזכוכית","חשבו איך הגנו על עיר לפני מאות שנים: מה בונים סביבה?","נכנסים לעיר העתיקה דרך שערים מפורסמים כמו שער יפו. דרך מה עוברים בשער?","העיר העתיקה מוקפת חומת אבן שנבנתה לפני מאות שנים. נכנסים אליה דרך שערים, כמו שער יפו ושער האשפות."],"en":["What surrounds the Old City of Jerusalem to this day?","An ancient stone wall with gates","A modern wire fence","A deep river","A giant glass wall","Think about how a city was defended hundreds of years ago: what do you build around it?","People enter the Old City through famous gates like Jaffa Gate. What does a gate pass through?","The Old City is surrounded by a stone wall built hundreds of years ago. People enter it through gates, like Jaffa Gate and Damascus Gate."],"ru":["Что окружает Старый город Иерусалима до сегодняшнего дня?","Древняя каменная стена с воротами","Современный проволочный забор","Глубокая река","Гигантская стеклянная стена","Подумайте, как защищали город сотни лет назад: что строят вокруг него?","В Старый город входят через знаменитые ворота вроде Яффских ворот. Через что проходит ворота?","Старый город окружён каменной стеной, построенной сотни лет назад. Входят в него через ворота, как Яффские ворота и Дамасские ворота."],"ar":["ما الذي يحيط بالبلدة القديمة في القدس حتى اليوم؟","سور حجري قديم له بوابات","سياج سلكي حديث","نهر عميق","جدار زجاجي ضخم","فكروا كيف كانت تُحمى المدينة قبل مئات السنين: ماذا يُبنى حولها؟","يدخل الناس البلدة القديمة عبر بوابات مشهورة مثل باب الخليل (يافا). عبر ماذا تمر البوابة؟","البلدة القديمة محاطة بسور حجري بُني قبل مئات السنين. يدخل إليها الناس عبر بوابات، مثل باب الخليل وباب العامود."]}],
["jeru",1,{"he":["איזה שוק מפורסם בירושלים מלא בפירות, תבלינים ומאפים?","שוק מחנה יהודה","הבורסה ליהלומים","הקניון הגדול","שוק הדגים של אילת","חשבו איפה קונים פירות טריים, חלה ותבלינים בשישי בבוקר בירושלים.","בדקו איזו אפשרות היא שוק אוכל ירושלמי, ולא בורסה, קניון או שוק דגים.","שוק מחנה יהודה הוא השוק המפורסם של ירושלים, מלא דוכני פירות, תבלינים ומאפים טריים."],"en":["Which famous market in Jerusalem is full of fruits, spices and pastries?","Mahane Yehuda market","The diamond exchange","The big mall","The fish market of Eilat","Think about where people buy fresh fruit, challah and spices on Friday morning in Jerusalem.","Check which option is a Jerusalem food market, and not an exchange, a mall or a fish market.","Mahane Yehuda is Jerusalem's famous market, full of fruit stalls, spices and fresh pastries."],"ru":["Какой знаменитый рынок в Иерусалиме полон фруктов, специй и выпечки?","Рынок Махане Иегуда","Алмазная биржа","Большой торговый центр","Рыбный рынок Эйлата","Подумайте, где покупают свежие фрукты, халу и специи в пятницу утром в Иерусалиме.","Проверьте, какой вариант является иерусалимским продовольственным рынком, а не биржей, торговым центром или рыбным рынком.","Махане Иегуда это знаменитый рынок Иерусалима, полный прилавков с фруктами, специями и свежей выпечкой."],"ar":["أي سوق مشهور في القدس مليء بالفواكه والتوابل والمخبوزات؟","سوق محانيه يهودا","بورصة الألماس","المركز التجاري الكبير","سوق السمك في إيلات","فكروا أين يشترون فواكه طازجة وخبزًا وتوابل صباح الجمعة في القدس.","تحققوا أي خيار هو سوق طعام مقدسي، وليس بورصة أو مركزًا تجاريًا أو سوق سمك.","سوق محانيه يهودا هو السوق المشهور في القدس، مليء بأكشاك الفواكه والتوابل والمخبوزات الطازجة."]}],
["jeru",1,{"he":["מהי הכנסת?","בית הנבחרים של ישראל, שם עושים את החוקים","תחנת משטרה גדולה","בית החולים של העיר","מוזיאון למטוסים","חשבו מי מחליט על חוקי המדינה ואיפה הם מתכנסים.","בדקו איזו אפשרות קשורה לחוקים ולהצבעות, ולא למשטרה, לרפואה או למטוסים.","הכנסת היא בית הנבחרים: מאה ועשרים חברי כנסת שנבחרו על ידי העם מחוקקים בה את חוקי המדינה."],"en":["What is the Knesset?","Israel's parliament, where the laws are made","A big police station","The city's hospital","A museum of airplanes","Think about who decides on the state's laws and where they gather.","Check which option is connected to laws and votes, and not to police, medicine or airplanes.","The Knesset is the parliament: one hundred and twenty elected members make the state's laws there."],"ru":["Что такое Кнессет?","Парламент Израиля, где принимают законы","Большой полицейский участок","Городская больница","Музей самолётов","Подумайте, кто решает законы государства и где они собираются.","Проверьте, какой вариант связан с законами и голосованиями, а не с полицией, медициной или самолётами.","Кнессет это парламент: сто двадцать избранных народом депутатов принимают в нём законы государства."],"ar":["ما هي الكنيست؟","برلمان إسرائيل، حيث تُصنع القوانين","مركز شرطة كبير","مستشفى المدينة","متحف للطائرات","فكروا من يقرر قوانين الدولة وأين يجتمعون.","تحققوا أي خيار مرتبط بالقوانين والتصويت، وليس بالشرطة أو الطب أو الطائرات.","الكنيست هي البرلمان: مئة وعشرون عضوًا منتخبون من الشعب يسنّون فيها قوانين الدولة."]}],
["jeru",1,{"he":["בירושלים יש רכבת שנוסעת על פסים ברחובות העיר. איך קוראים לה?","הרכבת הקלה","רכבת הים המהירה","הרכבת התת קרקעית","הרכבת המעופפת","חשבו על רכבת שנוסעת על פסים ברחוב, לא תחת האדמה.","בדקו איזו אפשרות אמיתית: בירושלים אין רכבת תת קרקעית, ובטח לא מעופפת.","הרכבת הקלה של ירושלים נוסעת על פסים ברחובות העיר ומחברת שכונות למרכז."],"en":["Jerusalem has a train that runs on tracks in the city streets. What is it called?","The light rail","The fast sea train","The subway","The flying train","Think about a train that runs on tracks in the street, not under the ground.","Check which option is real: Jerusalem has no subway, and certainly no flying train.","Jerusalem's light rail runs on tracks in the city streets and connects neighborhoods to the center."],"ru":["В Иерусалиме есть поезд, который ездит на рельсах по улицам города. Как он называется?","Лёгкий трамвай","Быстрый морской поезд","Метро","Летающий поезд","Подумайте о поезде, который едет на рельсах по улице, а не под землёй.","Проверьте, какой вариант настоящий: в Иерусалиме нет метро, и уж точно нет летающего поезда.","Лёгкий трамвай Иерусалима ездит на рельсах по улицам города и соединяет кварталы с центром."],"ar":["في القدس قطار يسير على قضبان في شوارع المدينة. ما اسمه؟","القطار الخفيف","قطار البحر السريع","القطار تحت الأرضي","القطار الطائر","فكروا في قطار يسير على قضبان في الشارع، ليس تحت الأرض.","تحققوا أي خيار حقيقي: في القدس لا يوجد قطار تحت أرضي، وبالتأكيد لا يوجد طائر.","القطار الخفيف في القدس يسير على قضبان في شوارع المدينة ويربط الأحياء بالمركز."]}],
["jeru",2,{"he":["לשלוש דתות יש מקומות קדושים בירושלים. אילו שלוש דתות?","יהדות, נצרות ואסלאם","יהדות, בודהיזם ואסלאם","נצרות, הינדואיזם ויהדות","אסלאם, שינטו ונצרות","חשבו על הכותל, על כנסיית הקבר ועל מסגד אל אקצא. לאילו דתות הם שייכים?","שתיים מהדתות נולדו כאן בארץ, ואחת הגיעה מחצי האי ערב.","בירושלים קדושים ליהודים הכותל והר הבית, לנוצרים כנסיית הקבר, ולמוסלמים אל אקצא וכיפת הסלע."],"en":["Three religions have holy places in Jerusalem. Which three?","Judaism, Christianity and Islam","Judaism, Buddhism and Islam","Christianity, Hinduism and Judaism","Islam, Shinto and Christianity","Think about the Western Wall, the Church of the Holy Sepulchre and the Al-Aqsa Mosque. Which religions do they belong to?","Two of the religions were born here in this land, and one came from the Arabian Peninsula.","In Jerusalem the Western Wall and Temple Mount are holy to Jews, the Church of the Holy Sepulchre to Christians, and Al-Aqsa and the Dome of the Rock to Muslims."],"ru":["У трёх религий есть святые места в Иерусалиме. Какие три религии?","Иудаизм, христианство и ислам","Иудаизм, буддизм и ислам","Христианство, индуизм и иудаизм","Ислам, синтоизм и христианство","Подумайте о Западной стене, о храме Гроба Господня и о мечети Аль-Акса. Каким религиям они принадлежат?","Две из религий родились здесь, в этой стране, а одна пришла с Аравийского полуострова.","В Иерусалиме евреям святы Западная стена и Храмовая гора, христианам храм Гроба Господня, а мусульманам Аль-Акса и Купол Скалы."],"ar":["لثلاث ديانات أماكن مقدسة في القدس. أي ثلاث ديانات؟","اليهودية والمسيحية والإسلام","اليهودية والبوذية والإسلام","المسيحية والهندوسية واليهودية","الإسلام والشنتو والمسيحية","فكروا في الحائط الغربي وكنيسة القيامة ومسجد الأقصى. لأي ديانات ينتمون؟","ديانة ولدتا هنا في هذه البلاد، وواحدة جاءت من شبه الجزيرة العربية.","في القدس تُقدس لليهود الحائط الغربي وجبل الهيكل، وللمسيحيين كنيسة القيامة، وللمسلمين الأقصى وقبة الصخرة."]}],
["jeru",2,{"he":["לעיר העתיקה ארבעה רובעים. איזה רובע לא קיים בה?","הרובע הסיני","הרובע היהודי","הרובע המוסלמי","הרובע הנוצרי","זכרו את ארבעת הרובעים: יהודי, מוסלמי, נוצרי ועוד אחד קטן. מי נשאר בחוץ?","הרובע הרביעי והקטן הוא הארמני. עכשיו בדקו מי לא ברשימה.","העיר העתיקה מחולקת לארבעה רובעים: יהודי, מוסלמי, נוצרי וארמני. רובע סיני אין בה."],"en":["The Old City has four quarters. Which quarter does not exist in it?","The Chinese Quarter","The Jewish Quarter","The Muslim Quarter","The Christian Quarter","Remember the four quarters: Jewish, Muslim, Christian and one more small one. Who is left out?","The fourth and smallest quarter is the Armenian one. Now check who is not on the list.","The Old City is divided into four quarters: Jewish, Muslim, Christian and Armenian. There is no Chinese quarter in it."],"ru":["В Старом городе четыре квартала. Какого квартала в нём не существует?","Китайский квартал","Еврейский квартал","Мусульманский квартал","Христианский квартал","Вспомните четыре квартала: еврейский, мусульманский, христианский и ещё один маленький. Кто остался за бортом?","Четвёртый и самый маленький квартал это армянский. Теперь проверьте, кого нет в списке.","Старый город делится на четыре квартала: еврейский, мусульманский, христианский и армянский. Китайского квартала в нём нет."],"ar":["للبلدة القديمة أربعة أحياء. أي حي لا يوجد فيها؟","الحي الصيني","حي اليهود","حي المسلمين","حي النصارى","تذكروا الأحياء الأربعة: اليهودي والإسلامي والمسيحي وواحد صغير آخر. من بقي خارجًا؟","الحي الرابع والأصغر هو الأرمني. الآن تحققوا من ليس في القائمة.","البلدة القديمة مقسمة إلى أربعة أحياء: اليهودي والإسلامي والمسيحي والأرمني. لا يوجد فيها حي صيني."]}],
["jeru",2,{"he":["למה אנשים מכל העולם מתפללים ומטיילים דווקא בירושלים?","כי יש בה מקומות קדושים לשלוש דתות שונות","כי יש בה את הים הכי כחול","כי יש בה את הקניון הכי גדול בעולם","כי בה נמצאת העיר הכי קרה","חשבו מה מיוחד בעיר הזאת לעומת ערים אחרות בארץ.","חשבו על הכותל, על כנסיית הקבר ועל כיפת הסלע: מה משותף לשלושתם?","ירושלים קדושה ליהדות, לנצרות ולאסלאם. מיליוני אנשים מגיעים להתפלל ולראות את המקומות הקדושים להם."],"en":["Why do people from all over the world pray and tour in Jerusalem of all places?","Because it has holy places for three different religions","Because it has the bluest sea","Because it has the biggest mall in the world","Because the coldest city is in it","Think about what is special about this city compared with other cities in the country.","Think about the Western Wall, the Church of the Holy Sepulchre and the Dome of the Rock: what do all three share?","Jerusalem is holy to Judaism, Christianity and Islam. Millions of people come to pray and see the places holy to them."],"ru":["Почему люди со всего мира молятся и путешествуют именно в Иерусалиме?","Потому что в нём есть святые места для трёх разных религий","Потому что в нём самое синее море","Потому что в нём самый большой торговый центр в мире","Потому что в нём находится самый холодный город","Подумайте, что особенного в этом городе по сравнению с другими городами страны.","Подумайте о Западной стене, о храме Гроба Господня и о Куполе Скалы: что общего у всех троих?","Иерусалим свят для иудаизма, христианства и ислама. Миллионы людей приезжают молиться и видеть святые для них места."],"ar":["لماذا يصلي ويتجول أناس من كل العالم في القدس تحديدًا؟","لأن فيها أماكن مقدسة لثلاث ديانات مختلفة","لأن فيها أكثر بحر زرقة","لأن فيها أكبر مركز تجاري في العالم","لأن فيها أكثر مدينة برودة","فكروا ما المميز في هذه المدينة مقارنة بمدن أخرى في البلاد.","فكروا في الحائط الغربي وكنيسة القيامة وقبة الصخرة: ما المشترك بين الثلاثة؟","القدس مقدسة لليهودية والمسيحية والإسلام. ملايين الناس يأتون للصلاة ورؤية الأماكن المقدسة لديهم."]}],
["jeru",2,{"he":["מהם הר הזיתים ומגדל דוד?","מקומות מפורסמים בירושלים: הר עם בתי עלמין עתיק, ומצודה ליד העיר העתיקה","שני איים בים התיכון","הרים בצפון הארץ הרחוק","קניונים בדרום","חשבו על מקומות שתיירים מצלמים כשהם מסתכלים על העיר העתיקה.","בדקו על המפה: שני המקומות האלה נמצאים ממש ליד חומות העיר העתיקה.","הר הזיתים הוא הר עתיק ממזרח לעיר העתיקה, ומגדל דוד הוא מצודה עתיקה ליד שער יפו. שניהם סמלים של ירושלים."],"en":["What are the Mount of Olives and the Tower of David?","Famous places in Jerusalem: a mountain with an ancient cemetery, and a citadel next to the Old City","Two islands in the Mediterranean","Mountains in the far north of the country","Malls in the south","Think about places tourists photograph when they look at the Old City.","Check on the map: both these places are right next to the walls of the Old City.","The Mount of Olives is an ancient mountain east of the Old City, and the Tower of David is an ancient citadel next to Jaffa Gate. Both are symbols of Jerusalem."],"ru":["Что такое Елеонская гора и Башня Давида?","Знаменитые места в Иерусалиме: гора с древним кладбищем и крепость рядом со Старым городом","Два острова в Средиземном море","Горы на далёком севере страны","Торговые центры на юге","Подумайте о местах, которые туристы фотографируют, глядя на Старый город.","Проверьте на карте: оба эти места находятся прямо у стен Старого города.","Елеонская гора это древняя гора к востоку от Старого города, а Башня Давида древняя крепость у Яффских ворот. Обе являются символами Иерусалима."],"ar":["ما هما جبل الزيتون وبرج داود؟","مكانان مشهوران في القدس: جبل فيه مقبرة قديمة، وقلعة بجانب البلدة القديمة","جزيرتان في البحر المتوسط","جبال في شمال البلاد البعيد","مراكز تسوق في الجنوب","فكروا في أماكن يصورها السياح عندما ينظرون إلى البلدة القديمة.","تحققوا على الخريطة: كلا المكانين يقعان مباشرة بجانب أسوار البلدة القديمة.","جبل الزيتون هو جبل قديم شرق البلدة القديمة، وبرج داود قلعة قديمة بجانب باب الخليل. كلاهما رمزان للقدس."]}],
["jeru",3,{"he":["למה דווקא על ההרים נבנתה ירושלים העתיקה, ולא במישור?","כי על ההר היה קל יותר להגן על העיר, ולידה היה מעיין מים","כי על ההרים יש יותר חנויות","כי במישור אסור היה לבנות","כי ההרים קרובים יותר לשמש","חשבו על שני דברים שעיר עתיקה חייבת: הגנה מפני אויבים, ומים לשתייה.","מי עומד גבוה רואה רחוק. מה זה נותן לשומרי עיר?","ערים עתיקות נבנו על גבעות כדי לראות את האויב מרחוק ולהגן על עצמן. מעיין הגיחון נתן לירושלים מים."],"en":["Why was ancient Jerusalem built on the mountains, and not on the plain?","Because on the hill it was easier to defend the city, and next to it was a water spring","Because the mountains have more shops","Because building on the plain was forbidden","Because the mountains are closer to the sun","Think about two things an ancient city must have: defense from enemies, and water to drink.","Whoever stands high sees far. What does that give the city guards?","Ancient cities were built on hills to see the enemy from afar and defend themselves. The Gihon Spring gave Jerusalem water."],"ru":["Почему древний Иерусалим был построен именно на горах, а не на равнине?","Потому что на холме было легче защищать город, и рядом был источник воды","Потому что в горах больше магазинов","Потому что на равнине строить было запрещено","Потому что горы ближе к солнцу","Подумайте о двух вещах, которые нужны древнему городу: защита от врагов и вода для питья.","Кто стоит высоко, видит далеко. Что это даёт стражам города?","Древние города строились на холмах, чтобы видеть врага издалека и защищаться. Источник Гихон давал Иерусалиму воду."],"ar":["لماذا بُنيت القدس القديمة على الجبال تحديدًا، وليس في السهل؟","لأنه على التل كان أسهل الدفاع عن المدينة، وبجانبها كان نبع ماء","لأن في الجبال محلات أكثر","لأنه كان يُمنع البناء في السهل","لأن الجبال أقرب إلى الشمس","فكروا في شيئين تحتاجهما مدينة قديمة: الدفاع عن الأعداء وماء للشرب.","من يقف عاليًا يرى بعيدًا. ماذا يعطي ذلك لحراس المدينة؟","بُنيت المدن القديمة على التلال لترى العدو من بعيد وتدافع عن نفسها. نبع الجيحون أ ["jeru",3,{"he":["מה ההבדל בין העיר העתיקה לבין ירושלים החדשה?","העתיקה עתיקה ומוקפת חומה עם מקומות קדושים, והחדשה נבנתה מחוץ לחומה עם שכונות, כנסת ומוזיאונים","אין שום הבדל, זו אותה עיר בדיוק","העתיקה גדולה יותר מהחדשה","החדשה מוקפת חומה והעתיקה לא","חשבו על משפחה שגדלה: הבית הישן נשאר, וסביבו בונים חדרים חדשים.","חפשו במפה את החומה: מה בתוכה עתיק, ומה בחוץ נבנה אחר כך?","העיר העתיקה היא הלב העתיק בין החומות. ירושלים החדשה גדלה מחוץ לחומה במאה וחמישים השנים האחרונות, עם שכונות, הכנסת ומוזיאונים."],"en":["What is the difference between the Old City and the new Jerusalem?","The old one is ancient and walled with holy places, and the new one was built outside the wall with neighborhoods, the Knesset and museums","There is no difference, it is exactly the same city","The old one is bigger than the new one","The new one is walled and the old one is not","Think about a family that grows: the old house stays, and new rooms are built around it.","Look for the wall on the map: what inside it is ancient, and what outside was built later?","The Old City is the ancient heart inside the walls. The new Jerusalem grew outside the wall in the last hundred and fifty years, with neighborhoods, the Knesset and museums."],"ru":["В чём разница между Старым городом и новым Иерусалимом?","Старый древний и окружён стеной со святыми местами, а новый построен вне стены с кварталами, Кнессетом и музеями","Нет никакой разницы, это ровно тот же город","Старый больше нового","Новый окружён стеной, а старый нет","Подумайте о семье, которая растёт: старый дом остаётся, а вокруг строят новые комнаты.","Поищите на карте стену: что внутри неё древнее, а что снаружи построено позже?","Старый город это древнее сердце внутри стен. Новый Иерусалим вырос вне стены за последние сто пятьдесят лет, с кварталами, Кнессетом и музеями."],"ar":["ما الفرق بين البلدة القديمة والقدس الجديدة؟","القديمة عتيقة ومحاطة بسور مع أماكن مقدسة، والجديدة بُنيت خارج السور مع أحياء وكنيست ومتاحف","لا يوجد أي فرق، هي المدينة نفسها تمامًا","القديمة أكبر من الجديدة","الجديدة محاطة بسور والقديمة لا","فكروا في عائلة تكبر: البيت القديم يبقى، وحوله تُبنى غرف جديدة.","ابحثوا في الخريطة عن السور: ما داخله قديم، وما خارجه بُني لاحقًا؟","البلدة القديمة هي القلب القديم داخل الأسوار. القدس الجديدة نمت خارج السور في المئة والخمسين سنة الأخيرة، مع أحياء والكنيست ومتاحف."]}],
["jeru",3,{"he":["מבקר רוצה לראות ביום אחד מקום קדוש ליהודים, למוסלמים ולנוצרים. למה דווקא ירושלים מאפשרת את זה?","כי המקומות הקדושים לשלוש הדתות קרובים אחד לשני בעיר העתיקה ובסביבתה","כי בירושלים יש הכי הרבה מטוסים","כי בערים אחרות אין מקומות קדושים בכלל בעולם","כי בירושלים יום אחד ארוך יותר","חשבו כמה רחוק הכותל מכנסיית הקבר ומכיפת הסלע.","בדקו על מפת העיר העתיקה: כמה זמן הליכה יש בין שלושת המקומות?","בירושלים המקומות הקדושים לשלוש הדתות צפופים וקרובים: אפשר ללכת ברגל מהכותל לכנסיית הקבר ולכיפת הסלע ביום אחד."],"en":["A visitor wants to see in one day a place holy to Jews, to Muslims and to Christians. Why does Jerusalem of all places make that possible?","Because the holy places of the three religions are close to each other in the Old City and around it","Because Jerusalem has the most airplanes","Because other cities have no holy places at all in the world","Because in Jerusalem one day is longer","Think about how far the Western Wall is from the Church of the Holy Sepulchre and the Dome of the Rock.","Check the Old City map: how much walking time is there between the three places?","In Jerusalem the holy places of the three religions are dense and close: you can walk from the Western Wall to the Church of the Holy Sepulchre and the Dome of the Rock in one day."],"ru":["Посетитель хочет за один день увидеть место, святое для евреев, для мусульман и для христиан. Почему именно Иерусалим делает это возможным?","Потому что святые места трёх религий близки друг к другу в Старом городе и его окрестностях","Потому что в Иерусалиме больше всего самолётов","Потому что в других городах мира вообще нет святых мест","Потому что в Иерусалиме один день длиннее","Подумайте, как далеко Западная стена от храма Гроба Господня и от Купола Скалы.","Проверьте на карте Старого города: сколько времени пешком между тремя местами?","В Иерусалиме святые места трёх религий плотные и близкие: можно пройти пешком от Западной стены к храму Гроба Господня и Куполу Скалы за один день."],"ar"    ולא את כל ההיסטוריה. ילד ששלט בחיבור לפני חודש ומתקשה בו היום
   צריך לקבל עזרה היום — ולהפך, קושי ישן לא צריך לרדוף אחריו.
   ===================================================== */
var WEAK_WINDOW=8;    /* כמה שאלות אחרונות זוכרים לכל פעולה */
var WEAK_TRIGGER=3;   /* כמה טעויות בתוך החלון מפעילות הצעת תרגול */
var WEAK_NEAR=2;      /* טעות במרחק כזה מהתשובה נחשבת "קרובה" */

/* רושם תוצאה של שאלה אחת. dist = כמה רחוקה הייתה התשובה השגויה. */
function noteResult(kind,ok,dist){
  var w=state.weak&&state.weak[kind];
  if(!w)return;
  w.r.push(ok?1:0);
  if(w.r.length>WEAK_WINDOW)w.r.shift();
  if(!ok){ if(dist<=WEAK_NEAR)w.near++; else w.far++; }
  save();
}
/* כמה טעויות יש בחלון הנוכחי של פעולה מסוימת */
function weakMisses(kind){
  var w=state.weak&&state.weak[kind];
  if(!w)return 0;
  var n=0;for(var i=0;i<w.r.length;i++)if(!w.r[i])n++;
  return n;
}
/* הפעולה שהכי מתקשים בה כרגע — או null אם הכול בסדר */
function weakestOp(){
  var best=null,bestN=WEAK_TRIGGER-1;
  ["add","sub","mul","div"].forEach(function(k){
    var n=weakMisses(k);
    if(n>bestN){bestN=n;best=k}
  });
  return best;
}
/* האם רוב הטעויות בפעולה הזאת היו "קרובות"?
   קרוב = כנראה החלקה בספירה. רחוק = כנראה לא הבינו את הפעולה. */
function weakIsNear(kind){
  var w=state.weak&&state.weak[kind];
  return !!(w&&w.near>w.far);
}
/* מתחיל סבב תרגול ממוקד: 5 שאלות מאותה פעולה, שתי רמות קלות יותר */
function startFocus(kind){
  var lvl=Math.max(1,activeLevel()-2);
  P.ses=[];
  for(var i=0;i<5;i++)P.ses.push(genQ(i,lvl,state.settings.lang||"he",kind));
  P.qi=0;P.phase="ask";P.wrong=[];P.flash=null;P.hints=0;P.results=[];P.ok=0;P.visual=false;
  P.focus=kind;P.t0=Date.now();
  /* מאפסים את החלון — הסבב הזה עצמו יהיה העדות החדשה */
  if(state.weak[kind])state.weak[kind].r=[];
  save();
}

/* ================= מצב "למידה איטית" =================
   מפרק תרגיל לצעדים קטנים, עם ספירה מונפשת ועיגולים.
   פתיחה:  SlowMode.open(q)   — q היא שאלה שנוצרה ב-genQ
   כרגע: חיבור (add) וחיסור (sub) בלבד. כפל וחילוק יתווספו בשלב הבא.
   ===================================================== */
var SlowMode=(function(){
  var el=null,steps=[],idx=0,timer=null,lineTo=10,isOn=false;

  /* מעל המספר הזה עוברים מספירה של אחד־אחד לקפיצות של עשר.
     56 צעדים זה לא עזרה — זה עונש. */
  var JUMP_MIN=12;

  /* ספירה בקפיצות: 18 + 56 הופך לחמש קפיצות של עשר ואז שש של אחד.
     המספרים מוצגים כמוטות של עשר ועיגולים בודדים, וכשמצטברים
     עשרה עיגולים הם נאספים לבד למוט — בדיוק הרעיון של יחידות ועשרות. */
  function planJump(t,a,b,isAdd){
    var out=[],i,v=a,sign=isAdd?1:-1;
    var tens=Math.floor(b/10),ones=b%10;
    function blk(val,cap,pulse,end){
      return {j:1,t10:Math.floor(val/10),o1:val%10,v:val,cap:cap,pulse:pulse,end:end};
    }
    out.push(blk(a,fmt(t.slowHave,{a:a})));
    out.push(blk(a,fmt(isAdd?t.slowPlus:t.slowMinus,{b:b})));
    if(tens){
      out.push(blk(v,fmt(t.slowByTens,{n:tens})));
      for(i=0;i<tens;i++){v+=sign*10;out.push(blk(v,String(v),1))}
    }
    if(ones){
      out.push(blk(v,fmt(t.slowByOnes,{n:ones})));
      for(i=0;i<ones;i++){v+=sign;out.push(blk(v,String(v),1))}
    }
    out.push(blk(v,fmt(isAdd?t.slowGotAdd:t.slowGotSub,{r:v}),0,1));
    return out;
  }

  /* --- בונה את רשימת הצעדים מתוך השאלה --- */
  function plan(q){
    var t=T(),out=[],i,v,a=q.a,b=q.b;
    /* מספר שני גדול? עוברים לקפיצות של עשר במקום ספירה אחד־אחד */
    if((q.kind==="add"||q.kind==="sub")&&b>JUMP_MIN)return planJump(t,a,b,q.kind==="add");
    if(q.kind==="add"){
      out.push({d:a,base:a,gone:0,v:a,cap:fmt(t.slowHave,{a:a})});          /* יש לנו a */
      out.push({d:a,base:a,gone:0,v:a,cap:fmt(t.slowPlus,{b:b})});          /* נוסיף b  */
      for(i=1;i<=b;i++){v=a+i;out.push({d:v,base:a,gone:0,v:v,cap:String(v),pulse:1})}
      v=a+b;out.push({d:v,base:a,gone:0,v:v,cap:fmt(t.slowGotAdd,{r:v}),end:1});
    }else if(q.kind==="sub"){
      out.push({d:a,base:a,gone:0,v:a,cap:fmt(t.slowHave,{a:a})});
      out.push({d:a,base:a,gone:0,v:a,cap:fmt(t.slowMinus,{b:b})});
      for(i=1;i<=b;i++){v=a-i;out.push({d:a,base:a,gone:i,v:v,cap:String(v),pulse:1})}
      v=a-b;out.push({d:a,base:a,gone:b,v:v,cap:fmt(t.slowGotSub,{r:v}),end:1});

    }else if(q.kind==="mul"){
      /* כפל = {a} קבוצות, ובכל אחת {b}.
         ממלאים קבוצה שלמה בכל צעד, והמספר קופץ בקפיצות של {b}: 8, 16, 24, 32 ... */
      var g=[];for(i=0;i<a;i++)g.push(0);
      out.push({g:g.slice(),cap:fmt(t.slowGroups,{a:a})});
      out.push({g:g.slice(),cap:fmt(t.slowEach,{b:b})});
      for(i=0;i<a;i++){
        g[i]=b;
        out.push({g:g.slice(),gf:i,per:b,cap:String((i+1)*b),pulse:1});
      }
      out.push({g:g.slice(),cap:fmt(t.slowGotMul,{a:a,b:b,r:a*b}),end:1});

    }else{
      /* חילוק = מחלקים {a} ל-{b} קבוצות שוות.
         בכל צעד נותנים עיגול אחד לכל קבוצה — חלוקה הוגנת אמיתית.
         כך התשובה מתגלה לילד לבד, במקום להינתן לו מוכנה. */
      var ansv=q.answer!=null?q.answer:Math.round(a/b);
      var gd=[];for(i=0;i<b;i++)gd.push(0);
      out.push({g:gd.slice(),pile:a,cap:fmt(t.slowHave,{a:a})});
      out.push({g:gd.slice(),pile:a,cap:fmt(t.slowSplit,{a:a,b:b})});
      for(i=1;i<=ansv;i++){
        for(var j=0;j<b;j++)gd[j]=i;
        out.push({g:gd.slice(),pile:a-i*b,gf:-1,per:1,cap:fmt(t.slowRound,{n:i}),pulse:1});
      }
      out.push({g:gd.slice(),pile:0,cap:fmt(t.slowGotDiv,{r:ansv}),end:1});
    }
    return out;
  }

  /* --- בונה את החלון פעם אחת בלבד --- */
  function make(){
    var ov=document.createElement("div");
    ov.className="sm-ov";ov.style.display="none";
    ov.innerHTML='<div class="sm-box" role="dialog" aria-modal="true"><div class="sm-head"><h2 class="fd" style="font-size:1.25rem"></h2><button class="sm-x" aria-label="'+esc(((TTSMSG[(state.settings&&state.settings.lang)||"he"]||TTSMSG.he).close))+'">&#10005;</button></div><div class="sm-ex"></div><div class="sm-cap" aria-live="polite"></div><div class="sm-dots"></div><div class="sm-line"></div><div class="sm-pb"><i></i></div><div class="sm-ctl"><button class="bk"></button><button class="pl"></button><button class="go nx"></button></div></div>';
    document.body.appendChild(ov);
    el={ov:ov,box:ov.querySelector(".sm-box"),ttl:ov.querySelector("h2"),ex:ov.querySelector(".sm-ex"),
        cap:ov.querySelector(".sm-cap"),dots:ov.querySelector(".sm-dots"),line:ov.querySelector(".sm-line"),
        pb:ov.querySelector(".sm-pb>i"),bk:ov.querySelector(".bk"),pl:ov.querySelector(".pl"),
        nx:ov.querySelector(".nx"),x:ov.querySelector(".sm-x")};
    el.nx.onclick=function(){stop();go(idx+1)};
    el.bk.onclick=function(){stop();go(idx-1)};
    el.pl.onclick=function(){timer?stop():play()};
    el.x.onclick=close;
    ov.onclick=function(e){if(e.target===ov)close()};
    document.addEventListener("keydown",function(e){
      if(!isOn)return;
      if(e.key==="Escape"){close()}
      else if(e.key===" "||e.key==="ArrowRight"||e.key==="ArrowDown"){e.preventDefault();stop();go(idx+1)}
      else if(e.key==="ArrowLeft"||e.key==="ArrowUp"){e.preventDefault();stop();go(idx-1)}
    });
  }

  /* --- מצייר צעד אחד --- */
  function draw(){
    var s=steps[idx],t=T(),i,n,d,tk;
    if(!s)return;
    el.cap.textContent=s.cap;

    /* --- מצב קפיצות של עשר (חיבור וחיסור עם מספרים גדולים) --- */
    if(s.j){
      el.line.innerHTML="";
      var hb='<div class="sm-b10">';
      for(i=0;i<s.t10;i++)hb+='<span class="sm-rod'+((s.pulse&&s.o1===0&&i===s.t10-1)?" p":"")+'"></span>';
      for(i=0;i<s.o1;i++)hb+='<span class="sm-d'+((s.pulse&&i===s.o1-1)?" p":"")+'"></span>';
      el.dots.innerHTML=hb+'</div>';
      el.pb.style.width=Math.round(idx/(steps.length-1)*100)+"%";
      el.bk.disabled=(idx===0);
      el.bk.textContent=t.slowBack;
      el.nx.textContent=s.end?t.slowAgain:t.slowNext;
      speak(s.cap);
      if(s.end&&state.settings.soundFx)sfxCorrect();
      return;
    }

    /* --- מצב קבוצות (כפל וחילוק) --- */
    if(s.g){
      el.line.innerHTML="";
      var html="";
      /* הערימה שעוד לא חולקה */
      if(s.pile>0){
        html+='<div class="sm-pile">';
        for(i=0;i<s.pile;i++)html+='<span class="sm-d"></span>';
        html+='</div>';
      }
      html+='<div class="sm-grp">';
      for(i=0;i<s.g.length;i++){
        var isFresh=!!(s.pulse&&(s.gf===-1||s.gf===i));
        html+='<div class="sm-g'+(isFresh?" fresh":"")+'">';
        for(n=0;n<s.g[i];n++){
          var isNew=isFresh&&n>=s.g[i]-(s.per||1);
          html+='<span class="sm-d n'+(isNew?" p":"")+'"></span>';
        }
        html+='</div>';
      }
      html+='</div>';
      el.dots.innerHTML=html;
      el.pb.style.width=Math.round(idx/(steps.length-1)*100)+"%";
      el.bk.disabled=(idx===0);
      el.bk.textContent=t.slowBack;
      el.nx.textContent=s.end?t.slowAgain:t.slowNext;
      speak(s.cap);
      if(s.end&&state.settings.soundFx)sfxCorrect();
      return;
    }

    /* --- מצב עיגולים בשורה (חיבור וחיסור) --- */
    el.dots.innerHTML="";
    var last=s.gone?s.d-s.gone:s.d-1;
    for(i=0;i<s.d;i++){
      d=document.createElement("span");
      d.className="sm-d"+(i>=s.base?" n":"")+(s.gone&&i>=s.d-s.gone?" g":"")+(s.pulse&&i===last?" p":"");
      el.dots.appendChild(d);
    }
    /* ציר המספרים */
    el.line.innerHTML="";
    var from=0,to=lineTo;
    if(lineTo>18){from=Math.max(0,s.v-7);to=Math.min(lineTo,from+15)}
    for(n=from;n<=to;n++){
      tk=document.createElement("span");
      tk.className="sm-t"+(n===s.v?" on":(n<s.v?" pv":""));
      tk.textContent=n;el.line.appendChild(tk);
    }
    var cur=el.line.querySelector(".sm-t.on");
    if(cur&&cur.scrollIntoView)cur.scrollIntoView({block:"nearest",inline:"center"});
    /* פס התקדמות + כפתורים */
    el.pb.style.width=Math.round(idx/(steps.length-1)*100)+"%";
    el.bk.disabled=(idx===0);
    el.bk.textContent=t.slowBack;
    el.nx.textContent=s.end?t.slowAgain:t.slowNext;
    /* הקראה — משתמש במנוע ההקראה הקיים של האפליקציה */
    speak(s.cap);
    if(s.end&&state.settings.soundFx)sfxCorrect();
  }

  function go(n){
    if(n<0)return;
    if(n>=steps.length){go(0);return}
    idx=n;draw();
  }
  /* מצב "הפעלה" — מתקדם לבד. 2100 = 2.1 שניות בין צעד לצעד */
  function play(){el.pl.textContent=T().slowStop;timer=setInterval(function(){
    if(idx>=steps.length-1){stop();return}go(idx+1)},2100)}
  function stop(){if(timer){clearInterval(timer);timer=null}if(el)el.pl.textContent=T().slowPlay}

  /* האם אפשר לפרק את השאלה הזאת? נשמר ציבורי כדי שמסך התרגול
     ידע אם להציג את הכפתור בכלל. */
  function can(q){
    if(!q)return false;
    var a=q.a,b=q.b;
    if(q.kind==="add"||q.kind==="sub")return b>=0&&b<=99;   /* מעל 12 עוברים לקפיצות של עשר */
    if(q.kind==="mul")return a>=1&&a<=12&&b>=1&&b<=12;
    if(q.kind==="div"){var v=q.answer!=null?q.answer:Math.round(a/b);return b>=1&&b<=12&&v>=1&&v<=12}
    return false;
  }

  function open(q){
    if(!can(q))return false;
    if(!el)make();
    var t=T();
    steps=plan(q);
    lineTo=Math.max(10,q.kind==="add"?q.a+q.b:q.a);
    el.box.setAttribute("dir",LANGS[state.settings.lang||"he"].dir);
    el.ttl.textContent={add:t.slowAdd,sub:t.slowSub,mul:t.slowMul,div:t.slowDiv}[q.kind];
    el.ex.textContent=(q.expr||(q.a+" ? "+q.b))+" = ?";
    el.pl.textContent=t.slowPlay;
    idx=0;isOn=true;el.ov.style.display="grid";
    draw();
    return true;
  }
  function close(){stop();isOn=false;stopSpeak();if(el)el.ov.style.display="none"}

  return {open:open,close:close,can:can,isOpen:function(){return isOn}};
})();

  /* המורה הוא שכבה שלישית: אחרי הרמזים, לא במקומם. בלי כתובת שרת אין כפתור. */

/* בוחרת כותרת, משפט וכוכבים לפי התוצאה בפועל.
   מחושב באחוזים ולא במספרים, כי סבב רגיל הוא 8 שאלות
   וסבב תרגול ממוקד הוא 5 — ובשניהם 100% צריך להיות 3 כוכבים. */
function doneLines(){
  var t=T(),n=P.ses.length||1,ratio=P.ok/n;
  var tier=ratio<0.3?"Low":(ratio<0.75?"Mid":"High");
  return {
    tier:tier,
    stars:ratio>=0.75?3:(ratio>=0.5?2:1),
    title:t["done"+tier]||t.doneTitle,
    sub:fmt(t["sub"+tier]||t.doneSub,{a:P.ok,b:n})
  };
}

function doneScreen(){
  var t=T(),DL=doneLines(),stars=DL.stars;
  var extra="";

   קצר מספיק לוואטסאפ.

   שלוש מגבלות שנאמרות כאן במפורש כי הן חלק מהתכנון:
   · אין איסוף אוטומטי. התלמיד שולח קוד תשובות בוואטסאפ, והמורה
     מדביק אותו. זה המחיר של אפס שרת ואפס עלות.

     ולא נלקח מהתלמיד, אבל אין כאן הגנה קריפטוגרפית — זה מבחן
     כיתתי מעצב, לא בגרות.
   · שמות התלמידים נשארים במכשיר של המורה. הם לא עוברים דרך

var GENV=2;                 /* גרסת המחוללים. מבחן שנוצר בגרסה אחרת

/* --- מחולל מזורע. mulberry32: קצר, מהיר, ופיזור טוב דיו --- */
function withSeed(seed,fn){
  var real=Math.random,s=(seed>>>0)||1;
  Math.random=function(){
    s|=0; s=s+0x6D2B79F5|0;
    var t=Math.imul(s^s>>>15,1|s);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
  try{return fn()}finally{Math.random=real}
}
function hash32(str){
  var h=0x811c9dc5,i;
  for(i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193)}
  return (h>>>0);
}
/* base64url. הניקוי בפענוח אינו קוסמטי: וואטסאפ שובר מחרוזות
   ארוכות בשורות, ורווח אחד הורס את כל הקוד. */
function b64e(str){
  var bytes=new TextEncoder().encode(str),bin="",i;
  for(i=0;i<bytes.length;i+=8192)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));
  return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function b64d(s){
  s=String(s||"").replace(/[^A-Za-z0-9\-_]/g,"").replace(/-/g,"+").replace(/_/g,"/");
  while(s.length%4)s+="=";
  var bin=atob(s),bytes=new Uint8Array(bin.length),i;
  for(i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
/* הזרע של המשבצת נכנס למזהה: שני מבחנים באותם נושאים ובאותה

   שאין לו זרעים מקבל בדיוק את המזהה שקיבל תמיד — אחרת ההגשות
   שכבר נקלטו אליו מתייתמות. */
function examId(spec){return hash32(spec.s+"|"+spec.q.map(function(x){
  return x[0]+x[1]+(x.length>2?"@"+x[2]:"")}).join(",")).toString(36)}
function encodeExam(spec){return b64e(JSON.stringify(spec))}
function decodeExam(code){
  try{
    var o=JSON.parse(b64d(code));
    if(!o||!o.q||!o.q.length||typeof o.s!=="number")return null;
    o.q=o.q.filter(function(x){return topicById(x[0])});
    return o.q.length?o:null;

}
/* בונה את שאלות המבחן. אותו זרע → אותן שאלות, גם אצל המורה
   כשהוא בודק וגם אצל התלמיד כשהוא נבחן. */
function examQuestions(spec){
  /* מסננים נושאים שאינם מוכרים לאפליקציה הזאת, בדיוק כמו decodeExam.
     בלי הסינון buildQ מחזיר null על נושא זר, והמסך נופל על
     q.topic של null. עדיף לדלג בשקט מאשר להתרסק. */
  var pairs=(spec.q||[]).filter(function(x){return !!topicById(x[0])});
  /* מבחן שנבנה עם זרע לכל משבצת נבנה משבצת אחרי משבצת, וכל
     שאלה תלויה בזרע שלה בלבד — כך המורה יכול להחליף אחת מהן.
     מבחן ישן, בלי זרעים, חייב להיבנות בדיוק כפי שנבנה ביום
     שנשלח: אחרת הציון של מי שכבר נבחן משתנה למפרע. */
  if(pairs.length&&pairs.every(function(x){return typeof x[2]==="number"}))
    return pairs.map(function(p){return exBuildSlot(p)})
                .filter(function(q){return !!q});

                .filter(function(q){return !!q});

/* --- בחירת השאלות בידי המורה ---------------------------------
   עד כאן המורה בחר נושאים, רמה ומספר שאלות — והשאלות עצמן הוגרלו
   מאחורי גבו. הוא ראה אותן לראשונה רק אחרי שהמבחן כבר היה אצל
   התלמידים. מעכשיו כל שאלה היא משבצת נפרדת עם זרע משלה: המורה
   רואה אותה לפני השליחה, מחליף אותה בשאלה אחרת מאותו נושא,
   מסיר אותה, או מוסיף שאלה מנושא שחסר לו.

   הזרע הנפרד לכל משבצת הוא מה שמאפשר את זה. בזרם אקראי אחד
   ומשותף, כפי שהיה עד כאן, החלפה של השאלה השלישית הייתה משנה
   גם את הרביעית ואת החמישית — כלומר לא "החלפה" אלא הגרלה מחדש
   של כל מה שאחריה.

function exSlots(){
  if(EB.q&&EB.q.length)return EB.q;
  var tops=EB.topics.filter(function(x){return topicById(x)});
  if(!tops.length)tops=topicsForTrack(state.track).slice(0,3).map(function(t){return t.id});
  /* אותה שאלה פעמיים באותו מבחן היא שאלה מבוזבזת, והיא ודאית כשברמה
     ארבעה פריטים והמורה ביקש עשר שאלות: הזרע נבחר באקראי ובלי זיכרון,
     ונמדד מבחן שבו אותו מושג הופיע ארבע פעמים מתוך עשר. מגלגלים מחדש
     עד שתים־עשרה פעמים, ואם כל השאלות האפשריות כבר נלקחו — משאירים
     כפילות במקום להיתקע. */
  var q=[],seen={},i,tries,sl,pq,key;
  for(i=0;i<EB.n;i++){
    for(tries=0;tries<12;tries++){

      pq=exPreviewQ(sl); key=pq&&pq.ask?plainOf(pq.ask):"";

/* הציון מחושב כאן מחדש מתוך התשובות. מה שהתלמיד שלח הוא מה

function xlg(){return state.settings.lang||"he"}
function xt(k){var d=XT[xlg()];var v=d&&d[k];return v===undefined?(XK[k]===undefined?k:XK[k]):v}
/* {0} ו-{1} — סדר המילים משתנה בין השפות, ולכן מספרים ולא רצף */
function xf(k){var s=xt(k),a=arguments,i;
  for(i=1;i<a.length;i++)s=s.split("{"+(i-1)+"}").join(String(a[i]));
  return s}

function viewLocked(){
  return '<div class="wrap" style="padding-block:40px;max-width:32rem">'+
    '<div class="card pad"><h1 class="h1">'+esc(xt("teTitle"))+'</h1>'+
    '<p class="sub">'+esc(xt("teLocked"))+'</p>'+
    '<div class="row" style="margin-top:14px">'+
    '<button class="btn btn-p" data-a="teask">'+esc(xt("teUnlock"))+'</button></div></div></div>';
}
/* השאלות עצמן, על המסך של המורה, לפני שהמבחן נשלח. */
function viewExamSlots(){
  var ls=exSlots(),h="",tops=EB.topics.filter(function(x){return topicById(x)});
  h+='<div style="margin-top:18px"><b>'+esc(xt("exQs"))+'</b>'+
     '<p class="sub" style="margin:4px 0 8px">'+esc(xt("exQsNote"))+'</p>';
  h+='<div class="row" style="margin:0 0 10px">'+
     '<button class="xq-b" data-a="exqans" aria-pressed="'+(EB.ans?"true":"false")+'">'+
     (EB.ans?esc(xt("exQsHide")):esc(xt("exQsShow")))+'</button>'+
     '<button class="xq-b" data-a="exqreset">'+esc(xt("exQsReset"))+'</button></div>';
  h+='<ol class="xq-list">';
  ls.forEach(function(sl,i){
    var q=exPreviewQ(sl),ok=exRightAnswer(q);
    h+='<li class="xq"><div class="xq-top">'+
       '<span class="xq-n">'+(i+1)+'</span>'+
       '<span class="xq-tp">'+esc(q&&q.topicName?q.topicName:exTopicName(sl[0]))+'</span>'+
       '<span class="xq-acts">'+
       '<button class="xq-b" data-a="exqroll" data-i="'+i+'">'+esc(xt("exQsSwap"))+'</button>'+
       /* המבחן חייב להישאר עם שאלה אחת לפחות, ולכן הכפתור נעלם
          ולא מוצג כבוי: כפתור שאי אפשר ללחוץ עליו מבלבל. */
       (ls.length>1?'<button class="xq-b" data-a="exqdel" data-i="'+i+'">'+esc(xt("exQsDrop"))+'</button>':"")+
       '</span></div>';
    if(q){
      h+='<div class="xq-q">'+q.ask+(q.expr?'<div class="xq-e">'+q.expr+'</div>':"")+'</div>';
      if(EB.ans&&ok)h+='<div class="xq-a"><b>'+esc(xt("exQsAns"))+'</b> '+ok.h+'</div>';
    }else h+='<div class="xq-q sub">'+esc(xt("exQsFail"))+'</div>';
    h+='</li>';
  });
  h+='</ol>';
  /* כפתור לכל נושא שנבחר, כדי שהמורה יוסיף בדיוק את מה שחסר לו
     ולא שאלה אקראית מנושא כלשהו. */
  if(tops.length){
    h+='<div class="row xq-add"><span class="sub">'+esc(xt("exQsAdd"))+'</span>';
    tops.forEach(function(id){
      h+='<button class="xq-b" data-a="exqadd" data-t="'+esc(id)+'">'+
         '<b aria-hidden="true">+</b> <span>'+esc(exTopicName(id))+'</span></button>';
    });
    h+='</div>';
  }
  return h+'</div>';
}
function viewExamNew(){
  var tops=topicsForTrack(state.track);
  if(!EB.topics.length)EB.topics=tops.slice(0,4).map(function(t){return t.id});
  var h='<div class="wrap" style="padding-block:22px">';
  h+='<h1 class="h1">'+esc(xt("exTitle"))+'</h1>'+
     '<p class="sub">'+esc(xt("exLead"))+'</p>';

  h+='<div class="card pad" style="margin-top:16px">';
  h+='<label class="tt"><b>'+esc(xt("exName"))+'</b></label>'+
     '<input class="field" id="exTitle" value="'+esc(EB.title)+'" placeholder="'+esc(xt("exNamePh"))+'" maxlength="60">';

  /* שורת יחידות הלימוד הגיעה עם מודול המבחן ממשפחת math-uni. באפליקציה
     עם מסלול אחד — math-app, ארבע פעולות החשבון — אין 3/4/5 יח״ל, והשורה
     רק בלבלה. מציגים אותה רק כשיש באמת יותר ממסלול אחד. */
  if(TRACKS.length>1)h+='<div style="margin-top:16px"><b>'+esc(xt("exUnits"))+'</b>'+
     '<div class="seg" style="margin-top:7px">'+[3,4,5].map(function(tr){
       return '<button class="'+(state.track===tr?"on":"")+'" data-a="track" data-t="'+tr+'">'+tr+' '+esc(xt("exUnitSuf"))+'</button>'
     }).join("")+'</div></div>';

  h+='<div style="margin-top:16px"><b>'+esc(xt("exLevel"))+'</b><div class="seg" style="margin-top:7px">'+
     LVL.map(function(l,i){
