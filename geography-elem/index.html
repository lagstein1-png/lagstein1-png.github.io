["med",2,{"he":["ספינה יוצאת מישראל ושטה ליוון ולאיטליה. לאיזה כיוון היא שטה?","צפון־מערב","דרום־מזרח","דרום","מזרח","פתחו את המפה: ישראל נמצאת בפינה המזרחית של הים.","אירופה נמצאת למעלה במפה, והים נפתח לצד שמאל.","יוון ואיטליה נמצאות מצפון־מערב לישראל. הספינה שטה למעלה ושמאלה על המפה."],"en":["A ship leaves Israel and sails to Greece and Italy. Which direction does it sail?","Northwest","Southeast","South","East","Open the map: Israel is in the eastern corner of the sea.","Europe is at the top of the map, and the sea opens to the left.","Greece and Italy are northwest of Israel. The ship sails up and to the left on the map."],"ru":["Корабль выходит из Израиля и плывёт в Грецию и Италию. В каком направлении он плывёт?","На северо-запад","На юго-восток","На юг","На восток","Откройте карту: Израиль находится в восточном углу моря.","Европа наверху карты, а море открывается влево.","Греция и Италия находятся к северо-западу от Израиля. Корабль плывёт вверх и влево по карте."],"ar":["سفينة تخرج من إسرائيل وتبحر إلى اليونان وإيطاليا. في أي اتجاه تبحر؟","الشمال الغربي","الجنوب الشرقي","الجنوب","الشرق","افتحوا الخريطة: إسرائيل في الزاوية الشرقية من البحر.","أوروبا في أعلى الخريطة، والبحر ينفتح نحو اليسار.","تقع اليونان وإيطاليا شمال غرب إسرائيل. السفينة تبحر إلى الأعلى ونحو اليسار على الخريطة."]}],
["med",2,{"he":["משפחה רוצה לראות את הבציר, קטיף הענבים בכרם. מתי כדאי לה לבוא?","בסוף הקיץ","באמצע החורף","בתחילת האביב","בכל חודש בשנה","הענבים מבשילים אחרי חודשים ארוכים של שמש.","בחורף הגפן עומדת בלי עלים ובלי פירות.","באקלים הים תיכוני הענבים מבשילים בחום. לכן הבציר נעשה בדרך כלל בסוף הקיץ."],"en":["A family wants to see the grape harvest in a vineyard. When should they come?","At the end of summer","In the middle of winter","At the start of spring","In any month of the year","Grapes ripen after long months of sunshine.","In winter the vine stands with no leaves and no fruit.","In a Mediterranean climate grapes ripen in the heat. So the harvest usually takes place at the end of summer."],"ru":["Семья хочет увидеть сбор винограда в винограднике. Когда им лучше приехать?","В конце лета","В середине зимы","В начале весны","В любой месяц года","Виноград созревает после долгих месяцев солнца.","Зимой лоза стоит без листьев и без плодов.","В средиземноморском климате виноград созревает в жару. Поэтому его обычно собирают в конце лета."],"ar":["عائلة تريد أن ترى قطف العنب في الكرم. متى يجب أن تأتي؟","في نهاية الصيف","في منتصف الشتاء","في بداية الربيع","في أي شهر من السنة","ينضج العنب بعد شهور طويلة من الشمس.","في الشتاء تقف الدالية بلا أوراق وبلا ثمار.","في المناخ المتوسطي ينضج العنب في الحر. لذلك يُقطف عادة في نهاية الصيف."]}],
["med",3,{"he":["השם ים תיכון מסביר שהים נמצא בתוך ארצות. למה העובדה הזאת הייתה טובה לעמים העתיקים?","כי ספינות יכלו להפליג בין ארצות רבות בלי לצאת לאוקיינוס הפתוח","כי אי אפשר היה לטבוע בו אף פעם, גם מי שלא ידע לשחות","כי בו מצאו דגי זהב, ואנשים התעשרו כשמכרו אותם בשוק, ולכן כל העמים באו לדוג בו","כי הוא היה קפוא ואפשר היה ללכת עליו ברגל מארץ לארץ","דמיינו ספינה קטנה ועתיקה: מה בטוח לה יותר, ים מוקף ארצות או אוקיינוס ענק?","חשבו על בריכה מוקפת גדר לעומת ים פתוח. איפה קל יותר להפליג?","הים התיכון כמעט סגור בארצות מכל צד. ספינות עתיקות הפליגו בין חופים בבטחה יחסית, וכך עברו סחורות ורעיונות בין עמים."],"en":["The name Mediterranean Sea says the sea sits inside lands. Why was that fact good for the ancient peoples?","Because ships could sail between many lands without going out to the open ocean","Because nobody could ever drown in it, even people who could not swim","Because goldfish were found in it, people got rich selling them, and so all the peoples came to fish in it","Because it was frozen and people could walk on it from land to land","Imagine a small ancient ship: what is safer for it, a sea ringed by lands or a giant ocean?","Think about a pool with a fence around it versus an open sea. Where is it easier to sail?","The Mediterranean is almost closed in by lands on every side. Ancient ships sailed between shores in relative safety, and so goods and ideas moved between peoples."],"ru":["Название Средиземное море говорит, что море находится внутри земель. Почему этот факт был хорош для древних народов?","Потому что корабли могли плыть между многими землями, не выходя в открытый океан","Потому что в нём никогда нельзя было утонуть, даже тем, кто не умел плавать","Потому что в нём находили золотых рыбок и богатели, продавая их, поэтому все народы приходили туда ловить рыбу","Потому что оно было замёрзшим и по нему ходили пешком из страны в страну","Представьте маленький древний корабль: что для него безопаснее, море, окружённое землями, или гигантский океан?","Подумайте о бассейне с оградой по сравнению с открытым морем. Где легче плавать?","Средиземное море почти закрыто землями со всех сторон. Древние корабли плавали между берегами в относительной безопасности, и так товары и идеи переходили между народами."],"ar":["اسم البحر المتوسط يشرح أن البحر يقع داخل أراضٍ. لماذا كانت هذه الحقيقة جيدة للشعوب القديمة؟","لأن السفن استطاعت الإبحار بين أراضٍ كثيرة من دون الخروج إلى المحيط المفتوح","لأنه لم يكن ممكنًا الغرق فيه أبدًا، حتى لمن لا يعرف السباحة","لأنه وُجدت فيه أسماك ذهبية، وأصبح الناس أغنياء من بيعها في الأسواق، لذلك جاءت كل الشعوب للصيد فيه","لأنه كان متجمدًا، ويمكن المشي عليه على الأقدام من بلد إلى بلد","تخيلوا سفينة صغيرة قديمة: ما الأكثر أمانًا لها، بحر تحيط به الأراضي أم محيط هائل؟","فكروا في بركة محاطة بسور مقابل بحر مفتوح. أين الإبحار أسهل؟","البحر المتوسط شبه مغلق بالأراضي من كل جهة. السفن القديمة أبحرت بين الشواطئ بأمان نسبي، وهكذا انتقلت البضائع والأفكار بين الشعوب."]}],
["med",3,{"he":["איך עזר הים התיכון לעמים שונים להכיר אחד את השני?","סוחרים הפליגו בין חופים, ואיתם עברו סחורות, רעיונות וסיפורים","הם שלחו אחד לשני יוני דואר מעל הים, עם מכתבים ותמונות, ולא יצאו מהחוף שלהם אף פעם","הם בנו גשר עץ ארוך מצד לצד, וכולם הלכו עליו ברגל","הם דיברו בטלפון ימי עתיק, שעבר מתחת למים בין החופים","לפני המטוס והרכבת, מה הייתה הדרך הכי מהירה לנסוע בין ארצות?","חשבו מה נוסע בספינת סוחר חוץ מסחורות: אנשים, ומה יש לאנשים בראש.","הספינה הייתה הכביש המהיר של העולם העתיק. סוחרים הביאו לא רק סחורות אלא גם שפות, אוכל ורעיונות, וכך העמים השפיעו אחד על השני."],"en":["How did the Mediterranean Sea help different peoples get to know each other?","Traders sailed between shores, and with them moved goods, ideas and stories","They sent each other carrier pigeons over the sea with letters and pictures, and never left their own shore","They built a long wooden bridge from side to side and walked across it","They talked on an ancient sea telephone that ran under the water","Before the plane and the train, what was the fastest way to travel between lands?","Think about what travels on a trading ship besides goods: people, and what people have in their heads.","The ship was the highway of the ancient world. Traders brought not only goods but also languages, food and ideas, and so the peoples influenced each other."],"ru":["Как Средиземное море помогло разным народам узнать друг друга?","Купцы плавали между берегами, и вместе с ними переходили товары, идеи и рассказы","Они посылали друг другу почтовых голубей над морем с письмами и рисунками и никогда не покидали свой берег","Они построили длинный деревянный мост через море и ходили по нему пешком","Они разговаривали по древнему морскому телефону, проложенному под водой","До самолёта и поезда, какой был самый быстрый способ путешествовать между странами?","Подумайте, что путешествует на торговом корабле кроме товаров: люди, и что есть у людей в голове.","Корабль был скоростной дорогой древнего мира. Купцы привозили не только товары, но и языки, еду и идеи, и так народы влияли друг на друга."],"ar":["كيف ساعد البحر المتوسط شعوبًا مختلفة على التعارف؟","أبحار التجار بين الشواطئ، ومعهم انتقلت البضائع والأفكار والقصص","أرسلوا بعضهم لبعض حمامًا زاجلًا فوق البحر مع رسائل وصور، ولم يغادروا شاطئهم أبدًا","بنوا جسرًا خشبيًا طويلًا من طرف إلى طرف ومشوا عليه","تحدثوا عبر هاتف بحري قديم يمر تحت الماء بين الشواطئ","قبل الطائرة والقطار، ما أسرع طريقة للسفر بين البلدان؟","فكروا ماذا يسافر في سفينة تاجر غير البضائع: الناس، وماذا في رؤوس الناس.","كانت السفينة الطريق السريع للعالم القديم. جلب التجار ليس فقط البضائع بل أيضًا اللغات والطعام والأفكار، وهكذا أثرت الشعوب بعضها في بعض."]}],
["med",3,{"he":["באגן הים התיכון יש מקומות עם מעט מים, כמו אצלנו בארץ. מה עוזר לישראל לחיות בנוחות בלי הרבה גשם?","חיסכון במים, השקיה חכמה והתפלת מי ים","העברת הכנרת כולה לתוך הים התיכון","יבוא שלג מחו\"ל במטוסים ובאוניות","בניית סכרים גדולים על מי ים המלח","חשבו על שלוש דרכים: לבזבז פחות, להשקות בדיוק, ולייצר מים מתוקים ממים מלוחים.","איזה דבר יש לנו הרבה ממנו ליד הבית, אבל הוא מלוח מדי לשתייה?","ישראל מתמודדת עם מחסור במים בחוכמה: חיסכון, השקיה בטפטוף והתפלה שהופכת מי ים למי שתייה."],"en":["In the Mediterranean basin there are places with little water, like our country. What helps Israel live comfortably without much rain?","Saving water, smart irrigation and desalination of sea water","Moving the whole Sea of Galilee into the Mediterranean","Bringing snow from abroad on planes and big ships","Building big dams on the salty water of the Dead Sea","Think about three ways: waste less, water exactly, and make fresh water from salty water.","What do we have a lot of next to our home, but it is too salty to drink?","Israel deals with water shortage cleverly: saving, drip irrigation and desalination that turns sea water into drinking water."],"ru":["В Средиземноморье есть места с малым количеством воды, как в нашей стране. Что помогает Израилю жить удобно без большого количества дождя?","Экономия воды, умное орошение и опреснение морской воды","Перемещение всего Кинерета в Средиземное море","Ввоз снега из-за границы на самолётах и кораблях","Строительство больших дамб на солёной воде Мёртвого моря","Подумайте о трёх путях: тратить меньше, поливать точно, и делать пресную воду из солёной.","Чего у нас много рядом с домом, но это слишком солёное, чтобы пить?","Израиль справляется с нехваткой воды с умом: экономия, капельное орошение и опреснение, превращающее морскую воду в питьевую."],"ar":["في حوض البحر المتوسط أماكن قليلة الماء، مثل بلدنا. ما الذي يساعد إسرائيل على العيش براحة من دون مطر كثير؟","توفير الماء والري الذكي وتحلية ماء البحر","نقل بحيرة طبريا كلها إلى داخل البحر المتوسط","استيراد الثلج من الخارج بالطائرات والسفن","بناء سدود كبيرة على مياه البحر الميت المالحة","فكروا في ثلاث طرق: هدر أقل، وسقي بدقة، وصناعة ماء عذب من ماء مالح.","أي شيء لدينا منه الكثير قرب البيت، لكنه مالح أكثر من اللازم للشرب؟","تواجه إسرائيل نقص الماء بذكاء: توفير، وري بالتنقيط، وتحلية تحول ماء البحر إلى ماء شرب."]}],
["med",3,{"he":["דייג תפס דגים קטנים וצעירים. למה כדאי לו להחזיר אותם לים?","כדי שיגדלו ויטילו ביצים","כי דגים קטנים מסוכנים לאכילה","כי הם יכעסו עליו אחר כך","כי הם כבדים מדי לסירה","חשבו מה יקרה לדגים בשנה הבאה אם לא יישארו צעירים בים.","דג צעיר עוד לא הספיק להביא דגים חדשים לעולם.","דג קטן שחוזר לים יגדל וירבה. כך הדגים לא ייגמרו, ויהיה מה לדוג גם בעתיד."],"en":["A fisher caught small, young fish. Why is it wise to return them to the sea?","So they grow and lay eggs","Small fish are dangerous to eat","They will be angry at him later","They are too heavy for the boat","Think about what happens next year if no young fish stay in the sea.","A young fish has not yet had the chance to have babies.","A small fish that goes back to the sea will grow and breed. That way fish do not run out, and there is still fishing in the future."],"ru":["Рыбак поймал маленьких молодых рыб. Почему разумно вернуть их в море?","Чтобы они выросли и отложили икру","Маленьких рыб опасно есть","Они потом на него рассердятся","Они слишком тяжёлые для лодки","Подумайте, что будет через год, если в море не останется молодых рыб.","Молодая рыба ещё не успела дать потомство.","Маленькая рыба, вернувшись в море, вырастет и размножится. Так рыба не закончится, и ловить можно будет и в будущем."],"ar":["صياد اصطاد أسماكًا صغيرة السن. لماذا من الحكمة أن يعيدها إلى البحر؟","كي تكبر وتضع البيض","لأن الأسماك الصغيرة خطرة للأكل","لأنها ستغضب منه لاحقًا","لأنها ثقيلة جدًا على القارب","فكروا ماذا يحدث في السنة القادمة إذا لم تبقَ أسماك صغيرة في البحر.","السمكة الصغيرة لم تنجب أسماكًا جديدة بعد.","السمكة الصغيرة التي تعود إلى البحر تكبر وتتكاثر. هكذا لا تنفد الأسماك، ويبقى صيد في المستقبل."]}],
["med",3,{"he":["מי הים התיכון מלוחים יותר ממי האוקיינוס. מה הסיבה?","החום מאדה מים, והמלח נשאר","דגים מוסיפים מלח למים","אנשים שופכים בו מלח מהמטבח","יורד בו שלג מלוח בחורף","חשבו מה קורה לכוס מים מלוחים שעומדת בשמש כמה ימים.","באגן הזה השמש חזקה, ונהרות מעטים מביאים אליו מים מתוקים.","השמש החזקה מאדה הרבה מים מהים. המים עולים לאוויר, אבל המלח נשאר בים ולכן הוא מלוח יותר."],"en":["Mediterranean water is saltier than ocean water. What is the reason?","Heat evaporates water and the salt stays","Fish add salt to the water","People pour kitchen salt into it","Salty snow falls on it in winter","Think about a glass of salty water left in the sun for a few days.","In this basin the sun is strong, and few rivers bring fresh water into it.","The strong sun evaporates a lot of seawater. The water rises into the air, but the salt stays behind, so the sea is saltier."],"ru":["Вода Средиземного моря солонее океанской. В чём причина?","Жара испаряет воду, а соль остаётся","Рыбы добавляют соль в воду","Люди сыплют туда кухонную соль","Зимой на него падает солёный снег","Подумайте о стакане солёной воды, который несколько дней стоит на солнце.","В этом бассейне сильное солнце, и мало рек приносит в него пресную воду.","Сильное солнце испаряет много морской воды. Вода уходит в воздух, а соль остаётся, поэтому море солонее."],"ar":["مياه البحر المتوسط أكثر ملوحة من مياه المحيط. ما السبب؟","الحر يبخر الماء ويبقى الملح","الأسماك تضيف الملح إلى الماء","الناس يرمون فيه ملح المطبخ","يتساقط عليه ثلج مالح في الشتاء","فكروا في كوب ماء مالح بقي في الشمس عدة أيام.","في هذا الحوض الشمس قوية، وأنهار قليلة تجلب إليه ماءً عذبًا.","الشمس القوية تبخر كثيرًا من ماء البحر. يصعد الماء إلى الهواء ويبقى الملح، لذلك يكون البحر أكثر ملوحة."]}],
["med",3,{"he":["למה תעלת סואץ חשובה כל כך לסחר בין אירופה לאסיה?","היא מקצרת מאוד את הדרך בים","היא הדרך היחידה לאמריקה, וכל הסחורות לאסיה עוברות דרך אמריקה","רק בה מותר לשוט בלילה","המים בה מתוקים לשתייה","השוו שתי דרכים מאירופה להודו: אחת מקיפה יבשת שלמה, ואחת חוצה את מצרים.","לספינה דרך ארוכה עולה יותר דלק ויותר ימים.","בלי התעלה ספינות צריכות להקיף את כל אפריקה. התעלה חוסכת זמן ודלק, ולכן סחורות רבות עוברות בה."],"en":["Why is the Suez Canal so important for trade between Europe and Asia?","It makes the sea route much shorter","It is the only way to America, and all goods for Asia pass through America","Only there may ships sail at night","Its water is fresh to drink","Compare two routes from Europe to India: one goes around a whole continent, the other crosses Egypt.","A long route costs a ship more fuel and more days.","Without the canal, ships must sail around all of Africa. The canal saves time and fuel, so many goods pass through it."],"ru":["Почему Суэцкий канал так важен для торговли между Европой и Азией?","Он сильно сокращает морской путь","Это единственный путь в Америку, и все товары для Азии идут через Америку","Только там можно плавать ночью","Вода в нём пресная для питья","Сравните два пути из Европы в Индию: один огибает целый материк, другой пересекает Египет.","Длинный путь стоит кораблю больше топлива и больше дней.","Без канала кораблям пришлось бы обходить всю Африку. Канал экономит время и топливо, поэтому через него идёт много товаров."],"ar":["لماذا قناة السويس مهمة جدًا للتجارة بين أوروبا وآسيا؟","لأنها تقصّر الطريق البحري كثيرًا","لأنها الطريق الوحيد إلى أمريكا، وكل البضائع إلى آسيا تمر عبر أمريكا","لأن الإبحار ليلًا مسموح فيها فقط","لأن ماءها عذب للشرب","قارنوا بين طريقين من أوروبا إلى الهند: واحد يدور حول قارة كاملة، وآخر يعبر مصر.","الطريق الطويل يكلف السفينة وقودًا أكثر وأيامًا أكثر.","بدون القناة على السفن أن تدور حول أفريقيا كلها. القناة توفر الوقت والوقود، لذلك تمر بها بضائع كثيرة."]}],
["med",3,{"he":["למה שקית ניילון בים מסוכנת במיוחד לצבי ים?","הצב חושב שהיא מדוזה ובולע אותה","השקית מחממת את המים סביבו","הצב משתמש בה לבנות קן","השקית מושכת אליו כרישים, והם רודפים אחרי הצב עד החוף","דמיינו משהו שקוף ורך שצף במים. למה הוא דומה?","חשבו מה צבי ים אוהבים לאכול.","בתוך המים שקית שקופה נראית כמו מדוזה, שהיא אוכל של צבי ים. הצב בולע את השקית ונפגע."],"en":["Why is a plastic bag in the sea especially dangerous for sea turtles?","The turtle takes it for a jellyfish","The bag warms the water around it","The turtle uses it to build a nest","The bag draws sharks to it, and they chase the turtle all the way to the shore","Picture something clear and soft floating in the water. What does it look like?","Think about what sea turtles like to eat.","In the water, a clear bag looks like a jellyfish, which is food for sea turtles. The turtle swallows the bag and gets hurt."],"ru":["Почему пластиковый пакет в море особенно опасен для морских черепах?","Черепаха принимает его за медузу","Пакет нагревает воду вокруг неё","Черепаха строит из него гнездо","Пакет приманивает к ней акул, и они гонятся за черепахой до самого берега","Представьте что-то прозрачное и мягкое, что плавает в воде. На что это похоже?","Подумайте, что любят есть морские черепахи.","В воде прозрачный пакет похож на медузу, а медузы — еда черепах. Черепаха глотает пакет и страдает."],"ar":["لماذا كيس النايلون في البحر خطير بشكل خاص على السلاحف البحرية؟","السلحفاة تظنه قنديل بحر فتبتلعه","الكيس يسخن الماء من حولها","السلحفاة تبني منه عشها","الكيس يجذب إليها أسماك القرش، وهي تطارد السلحفاة حتى الشاطئ","تخيلوا شيئًا شفافًا وطريًا يطفو في الماء. بماذا يذكركم؟","فكروا ماذا تحب السلاحف البحرية أن تأكل.","في الماء يبدو الكيس الشفاف مثل قنديل البحر، وهو طعام السلاحف. تبتلع السلحفاة الكيس فتتأذى."]}],
["med",3,{"he":["לצמחים ים תיכוניים רבים יש עלים קטנים וקשים. איך זה עוזר להם?","הם מאבדים פחות מים בקיץ","הם גדלים מהר יותר בשלג","חיות לא רואות אותם בלילה","הם מושכים יותר גשם","חשבו על הקיץ הארוך: מה הכי חסר לצמח בתקופה הזאת?","עלה גדול ודק הוא כמו בגד רטוב שמתייבש מהר בשמש.","עלה קטן וקשה מאדה פחות מים. כך הצמח שורד את הקיץ היבש בלי גשם."],"en":["Many Mediterranean plants have small, tough leaves. How does this help them?","They lose less water in summer","They grow faster in snow","Animals cannot see them at night","They attract more rain","Think about the long summer: what does a plant lack most at that time?","A big thin leaf is like a wet shirt that dries fast in the sun.","A small, tough leaf lets out less water. This way the plant survives the dry summer without rain."],"ru":["У многих средиземноморских растений маленькие жёсткие листья. Чем это им помогает?","Летом они теряют меньше воды","Они быстрее растут в снегу","Ночью звери их не видят","Они притягивают больше дождя","Подумайте о долгом лете: чего растению тогда не хватает больше всего?","Большой тонкий лист похож на мокрую рубашку, которая быстро сохнет на солнце.","Маленький жёсткий лист испаряет меньше воды. Так растение переживает сухое лето без дождя."],"ar":["كثير من النباتات المتوسطية لها أوراق صغيرة وقاسية. كيف يساعدها ذلك؟","تفقد ماءً أقل في الصيف","تنمو أسرع في الثلج","الحيوانات لا تراها ليلًا","تجذب مطرًا أكثر","فكروا في الصيف الطويل: ما أكثر ما ينقص النبتة في هذا الوقت؟","الورقة الكبيرة الرقيقة مثل قميص مبلول يجف بسرعة في الشمس.","الورقة الصغيرة القاسية تبخر ماءً أقل. هكذا تعيش النبتة الصيف الجاف بلا مطر."]}],
["med",3,{"he":["למה קוראים למצר גיברלטר ״השער של הים התיכון״?","זה המעבר הטבעי היחיד לאוקיינוס","יש בו שער ברזל שנסגר בלילה","שם נמצא הנמל הגדול בעולם","דרכו נכנסים לים המלח","חשבו: בכמה מקומות הים התיכון פתוח בדרך טבעית אל האוקיינוס?","תעלת סואץ נחפרה בידי אנשים, ולכן היא לא נחשבת כאן.","הים התיכון כמעט סגור ביבשה. רק במצר גיברלטר הוא נפתח בדרך טבעית אל האוקיינוס האטלנטי."],"en":["Why is the Strait of Gibraltar called \"the gate of the Mediterranean\"?","It is the only natural way to the ocean","It has an iron gate that shuts at night","The world's biggest port is there","It leads into the Dead Sea","Think: in how many places does the Mediterranean open naturally to the ocean?","The Suez Canal was dug by people, so it does not count here.","The Mediterranean is almost closed in by land. Only at the Strait of Gibraltar does it open naturally to the Atlantic Ocean."],"ru":["Почему Гибралтарский пролив называют «воротами Средиземного моря»?","Это единственный природный выход в океан","В нём есть железные ворота на ночь","Там самый большой порт в мире","Через него попадают в Мёртвое море","Подумайте: в скольких местах Средиземное море природно открыто в океан?","Суэцкий канал выкопали люди, поэтому здесь он не считается.","Средиземное море почти окружено сушей. Только в Гибралтарском проливе оно природно открывается в Атлантический океан."],"ar":["لماذا يُسمّى مضيق جبل طارق «بوابة البحر المتوسط»؟","لأنه الممر الطبيعي الوحيد إلى المحيط","لأن فيه بوابة حديدية تُغلق ليلًا","لأن فيه أكبر ميناء في العالم","لأنه يقود إلى البحر الميت","فكروا: في كم مكانًا ينفتح البحر المتوسط بشكل طبيعي على المحيط؟","قناة السويس حفرها الناس، لذلك لا تُحسب هنا.","البحر المتوسط شبه مغلق باليابسة. فقط عند مضيق جبل طارق ينفتح بشكل طبيعي على المحيط الأطلسي."]}],
["med",3,{"he":["תיירות רבה מגיעה לחופי הים התיכון. מה נכון לגבי ההשפעה שלה?","נותנת עבודה, אבל מביאה זבל ובנייה","היא רק טובה ואין לה שום נזק לחוף","היא רק מזיקה ואין לה שום תועלת","היא לא משנה שום דבר בחוף ובים","חשבו על מלון חדש ליד הים: מי מרוויח ממנו, ומה קורה לחוף?","לרוב הדברים יש צד טוב וגם צד פחות טוב.","תיירים מביאים פרנסה למלונות ולמסעדות. אבל המון אנשים משאירים זבל, ובנייה על החוף מצמצמת את הטבע."],"en":["Many tourists come to Mediterranean beaches. What is true about their effect?","Jobs, but also litter and building","It is only good and does no harm","It is only harmful and has no benefit","It changes nothing on the beach or sea","Think about a new hotel by the sea: who gains from it, and what happens to the beach?","Most things have a good side and a less good side.","Tourists bring income to hotels and restaurants. But crowds leave litter, and building on the beach shrinks nature."],"ru":["К берегам Средиземного моря приезжает много туристов. Что верно об их влиянии?","Он даёт работу, но приносит мусор и стройки","Он только полезен и не вредит","Он только вредит и не приносит пользы","Он ничего не меняет на берегу","Подумайте о новой гостинице у моря: кто от неё выигрывает и что происходит с пляжем?","У большинства вещей есть хорошая сторона и менее хорошая.","Туристы приносят доход гостиницам и ресторанам. Но толпы оставляют мусор, а стройки на берегу уменьшают природу."],"ar":["تصل سياحة كثيرة إلى شواطئ البحر المتوسط. ما الصحيح بشأن تأثيرها؟","توفر عملًا لكن تجلب نفايات وبناءً","هي مفيدة فقط ولا ضرر لها","هي ضارة فقط ولا فائدة منها","لا تغيّر شيئًا على الشاطئ ولا في البحر","فكروا في فندق جديد قرب البحر: من يستفيد منه، وماذا يحدث للشاطئ؟","لمعظم الأشياء جانب جيد وجانب أقل جودة.","السياح يجلبون الرزق للفنادق والمطاعم. لكن الحشود تترك النفايات، والبناء على الشاطئ يقلص الطبيعة."]}],
["med",3,{"he":["למה רוב תושבי ישראל גרים במישור החוף, ולא בנגב?","יש שם יותר גשם, אקלים נוח ונמלים","בנגב אסור לבנות בתים בכלל","בנגב יש שלג כל החורף","במישור החוף אין קיץ חם","השוו את שני האזורים: איפה יורד יותר גשם, ואיפה הים קרוב?","אנשים מעדיפים לגור ליד מים, עבודה ודרכי מסחר.","במישור החוף יורד יותר גשם, החום מתון בזכות הים, ויש נמלים ועבודה. לכן ערים רבות קמו שם."],"en":["Why do most people in Israel live in the coastal plain and not in the Negev?","More rain, a mild climate and ports","Building houses in the Negev is banned","The Negev has snow all winter","The coastal plain has no hot summer","Compare the two areas: where does more rain fall, and where is the sea close?","People prefer to live near water, jobs and trade routes.","The coastal plain gets more rain, the sea keeps the heat mild, and there are ports and jobs. So many cities grew there."],"ru":["Почему большинство жителей Израиля живёт на прибрежной равнине, а не в Негеве?","Там больше дождей, мягкий климат и порты","В Негеве вообще запрещено строить дома","В Негеве всю зиму лежит снег","На прибрежной равнине не бывает жаркого лета","Сравните два района: где выпадает больше дождя и где близко море?","Люди предпочитают жить рядом с водой, работой и торговыми путями.","На прибрежной равнине больше дождей, море смягчает жару, и есть порты и работа. Поэтому там выросло много городов."],"ar":["لماذا يسكن معظم سكان إسرائيل في السهل الساحلي وليس في النقب؟","فيه مطر أكثر ومناخ معتدل وموانئ","البناء في النقب ممنوع تمامًا","في النقب ثلج طوال الشتاء","في السهل الساحلي لا يوجد صيف حار","قارنوا بين المنطقتين: أين يهطل مطر أكثر، وأين البحر قريب؟","يفضّل الناس السكن قرب الماء والعمل وطرق التجارة.","في السهل الساحلي مطر أكثر، والبحر يلطّف الحر، وهناك موانئ وعمل. لذلك نشأت هناك مدن كثيرة."]}],
["med",3,{"he":["באוכל של ארצות הים התיכון יש הרבה דגים ושמן זית. למה?","כי הים קרוב והזיתים גדלים שם","כי אסור לאכול שם בשר","כי מביאים אותם מהקוטב הצפוני","כי רק אותם אפשר לבשל","אנשים אוכלים בעיקר מה שיש סביבם. מה יש סביב הים הזה?","חשבו מה נותן הים, ואיזה עץ אוהב את האקלים הזה.","אנשים בישלו ממה שהיה קרוב: דגים מהים ושמן מעצי הזית שגדלים באקלים הים תיכוני."],"en":["The food of Mediterranean countries has a lot of fish and olive oil. Why?","The sea is close and olives grow there","Eating meat is forbidden there","They are brought from the North Pole","They are the only foods you can cook","People mostly eat what is around them. What is around this sea?","Think about what the sea gives, and which tree loves this climate.","People cooked with what was nearby: fish from the sea and oil from olive trees that grow in the Mediterranean climate."],"ru":["В еде средиземноморских стран много рыбы и оливкового масла. Почему?","Море рядом, и там растут оливки","Там запрещено есть мясо","Их привозят с Северного полюса","Только их можно готовить","Люди едят в основном то, что есть вокруг. Что есть вокруг этого моря?","Подумайте, что даёт море и какое дерево любит этот климат.","Люди готовили из того, что было рядом: рыбу из моря и масло из оливковых деревьев, которые растут в средиземноморском климате."],"ar":["في طعام دول البحر المتوسط كثير من السمك وزيت الزيتون. لماذا؟","لأن البحر قريب والزيتون ينمو هناك","لأن أكل اللحم ممنوع هناك","لأنهم يجلبونها من القطب الشمالي","لأنها الأطعمة الوحيدة التي تُطبخ","الناس يأكلون غالبًا ما يوجد حولهم. ماذا يوجد حول هذا البحر؟","فكروا فيما يعطيه البحر، وأي شجرة تحب هذا المناخ.","طبخ الناس مما كان قريبًا: السمك من البحر والزيت من أشجار الزيتون التي تنمو في المناخ المتوسطي."]}],
["med",3,{"he":["למה זיהום בים התיכון נשאר בו זמן רב יותר מאשר באוקיינוס פתוח?","הים כמעט סגור, והמים בו מתחלפים לאט","המים בו קפואים ולא זזים","אין בו גלים בכלל","הדגים בו אוכלים את כל הלכלוך, ואחר כך פולטים אותו שוב למים","השוו אמבטיה עם פתח קטן לבין נהר זורם. איפה לכלוך נשאר יותר זמן?","בדקו על המפה כמה רחב החיבור של הים הזה לאוקיינוס.","הים התיכון מחובר לאוקיינוס רק במעבר צר. המים מתחלפים לאט, ולכן לכלוך שנכנס נשאר הרבה זמן."],"en":["Why does pollution stay longer in the Mediterranean than in an open ocean?","The sea is almost closed, so water changes slowly","Its water is frozen and never moves at all","It has no waves or currents at all","Its fish eat up all of the dirt quickly, and then they let it out into the water again","Compare a bathtub with a small drain to a flowing river. Where does dirt stay longer?","Check on the map how wide this sea's link to the ocean is.","The Mediterranean joins the ocean only through a narrow passage. Its water changes slowly, so dirt that gets in stays a long time."],"ru":["Почему загрязнение держится в Средиземном море дольше, чем в открытом океане?","Море почти закрыто, и вода в нём меняется медленно","Вода в нём замёрзла и совсем не движется","В нём совсем нет ни волн, ни течений","Рыбы в нём быстро съедают всю грязь, а потом снова выпускают её в воду","Сравните ванну с маленьким сливом и текущую реку. Где грязь задержится дольше?","Посмотрите на карте, насколько широка связь этого моря с океаном.","Средиземное море соединено с океаном только узким проходом. Вода меняется медленно, поэтому попавшая грязь остаётся надолго."],"ar":["لماذا يبقى التلوث في البحر المتوسط مدة أطول منه في محيط مفتوح؟","البحر شبه مغلق، وماؤه يتجدد ببطء","ماؤه متجمد ولا يتحرك أبدًا","لا توجد فيه أمواج ولا تيارات","أسماكه تأكل كل الأوساخ بسرعة، ثم تطلقها مرة أخرى إلى الماء","قارنوا بين حوض استحمام بفتحة صغيرة ونهر جارٍ. أين تبقى الأوساخ مدة أطول؟","انظروا في الخريطة كم هو عريض اتصال هذا البحر بالمحيط.","البحر المتوسط متصل بالمحيط بممر ضيق فقط. يتجدد ماؤه ببطء، لذلك تبقى الأوساخ التي تدخله وقتًا طويلًا."]}],
["regions",1,{"he":["איזה אזור גדול ויבש משתרע בדרום ישראל?","הנגב","הגליל","מישור החוף","בקעת הירדן","חשבו על מפת ישראל: הצפון ירוק והדרום צהוב ויבש. איך קוראים לדרום היבש?","זכרו: איפה יורד מעט גשם, בצפון או בדרום? האזור היבש נמצא שם.","הנגב הוא אזור מדברי גדול בדרום הארץ. הוא מכסה יותר ממחצית שטח ישראל, וגרים בו יחסית מעט אנשים."],"en":["Which big dry region stretches across the south of Israel?","The Negev","The Galilee","The coastal plain","The Jordan Valley","Think about the map of Israel: the north is green and the south is yellow and dry. What is the dry south called?","Remember: where does little rain fall, in the north or in the south? The dry region is there.","The Negev is a big desert region in the south of the country. It covers more than half of Israel, and relatively few people live in it."],"ru":["Какой большой сухой район раскинулся на юге Израиля?","Негев","Галилея","Прибрежная равнина","Иорданская долина","Подумайте о карте Израиля: север зелёный, а юг жёлтый и сухой. Как называется сухой юг?","Вспомните: где выпадает мало дождя, на севере или на юге? Сухой район находится там.","Негев это большой пустынный район на юге страны. Он покрывает больше половины площади Израиля, а живёт в нём относительно мало людей."],"ar":["أي منطقة كبيرة وجافة تمتد في جنوب إسرائيل؟","النقب","الجليل","السهل الساحلي","غور الأردن","فكروا في خريطة إسرائيل: الشمال أخضر والجنوب أصفر جاف. ما اسم الجنوب الجاف؟","تذكروا: أين ينزل مطر قليل، في الشمال أم في الجنوب؟ المنطقة الجافة موجودة هناك.","النقب منطقة صحراوية كبيرة في جنوب البلاد. يغطي أكثر من نصف مساحة إسرائيل، ويسكن فيه قليل من الناس نسبيًا."]}],
["regions",1,{"he":["מהו המקום הנמוך ביותר בעולם, והוא נמצא בארץ שלנו?","ים המלח וחופו","פסגת החרמון","עמק יזרעאל","חופי אילת","נמוך ביותר פירושו הכי מתחת לפני הים. המים זורמים לשם ונאספים, כי אין להם לאן להמשיך.","בדקו על המפה איזה גוף מים בארץ יושב בשקע עמוק, עמוק מכולם.","ים המלח נמצא כארבע מאות ושלושים מטרים מתחת לפני הים, והוא המקום הנמוך ביותר בעולם. המים שלו מלוחים מאוד."],"en":["What is the lowest place in the world, and it is in our country?","The Dead Sea and its shore","The peak of Mount Hermon","The Jezreel Valley","The beaches of Eilat","Lowest means the farthest below sea level. Water flows there and collects, because it has nowhere to go on.","Check on the map which body of water in the country sits in a deep hollow, the deepest of all.","The Dead Sea lies about four hundred and thirty meters below sea level, and it is the lowest place in the world. Its water is very salty."],"ru":["Какое самое низкое место в мире, и оно находится в нашей стране?","Мёртвое море и его берег","Вершина Хермона","Изреельская долина","Пляжи Эйлата","Самое низкое значит самое далёкое ниже уровня моря. Вода течёт туда и собирается, потому что ей некуда идти дальше.","Проверьте на карте, какой водоём в стране лежит в глубокой впадине, глубже всех.","Мёртвое море находится примерно на четыреста тридцать метров ниже уровня моря, и это самое низкое место в мире. Его вода очень солёная."],"ar":["ما أكثر مكان انخفاضًا في العالم، وهو موجود في بلادنا؟","البحر الميت وشاطئه","قمة جبل الشيخ","مرج ابن عامر","شواطئ إيلات","الأكثر انخفاضًا يعني الأكثر تحت مستوى البحر. المياه تجري إلى هناك وتتجمع، لأنه لا مكان لها لتواصل.","تحققوا على الخريطة أي مسطح مائي في البلاد يقع في منخفض عميق، الأعمق بين الكل.","البحر الميت يقع نحو أربعمئة وثلاثين مترًا تحت مستوى البحر، وهو أكثر مكان منخفضًا في العالم. مياهه شديدة الملوحة."]}],
["regions",1,{"he":["איזה אזור בישראל ירוק במיוחד, עם הרבה גשמים בחורף ונחלים?","הגליל שבצפון","הנגב שבדרום","מדבר יהודה","בקעת ים המלח","חשבו על גשם: איפה יורד הרבה גשם, בצפון או בדרום?","ירוק צריך מים. איזה אזור בארץ מקבל יותר מים מהשמיים?","הצפון, ובמיוחד הגליל, מקבל הרבה גשם בחורף. לכן הוא ירוק, מלא נחלים ופרדסים."],"en":["Which region in Israel is especially green, with lots of winter rain and streams?","The Galilee in the north","The Negev in the south","The Judean Desert","The Dead Sea valley","Think about rain: where does a lot of rain fall, in the north or in the south?","Green needs water. Which region in the country gets more water from the sky?","The north, and especially the Galilee, gets a lot of winter rain. That is why it is green, full of streams and orchards."],"ru":["Какой район в Израиле особенно зелёный, с большим количеством зимних дождей и ручьёв?","Галилея на севере","Негев на юге","Иудейская пустыня","Долина Мёртвого моря","Подумайте о дожде: где выпадает много дождя, на севере или на юге?","Зелени нужна вода. Какой район в стране получает больше воды с неба?","Север, и особенно Галилея, получает много зимнего дождя. Поэтому он зелёный, полный ручьёв и садов."],"ar":["أي منطقة في إسرائيل خضراء بشكل خاص، مع أمطار شتوية كثيرة ومجاري مياه؟","الجليل في الشمال","النقب في الجنوب","صحراء يهودا","غور البحر الميت","فكروا في المطر: أين ينزل مطر كثير، في الشمال أم في الجنوب؟","الخضرة تحتاج ماء. أي منطقة في البلاد تحصل على ماء أكثر من السماء؟","الشمال، وخاصة الجليل، يحصل على مطر شتوي كثير. لذلك هو أخضر، مليء بمجاري المياه والبساتين."]}],
["regions",1,{"he":["מה שמו של האגם הגדול בצפון ישראל, שמימיו מתוקים וחשובים לשתייה?","הכנרת","ים המלח","הים התיכון","מפרץ אילת","חשבו על מים מתוקים בצפון: מהם שותים, ולא מתרחצים במלח.","האגם הזה נראה על המפה כמו טיפה כחולה גדולה מעל בקעת הירדן.","הכנרת היא האגם המתוק הגדול של ישראל. היא בצפון, ומימיה חשובים לשתייה ולחקלאות."],"en":["What is the name of the big lake in the north of Israel, whose fresh water is important for drinking?","The Sea of Galilee","The Dead Sea","The Mediterranean Sea","The Gulf of Eilat","Think about fresh water in the north: people drink it, not bathe in salt.","This lake looks on the map like a big blue drop above the Jordan Valley.","The Sea of Galilee is Israel's big freshwater lake. It is in the north, and its water is important for drinking and farming."],"ru":["Как называется большое озеро на севере Израиля, чья пресная вода важна для питья?","Кинерет","Мёртвое море","Средиземное море","Эйлатский залив","Подумайте о пресной воде на севере: её пьют, а не купаются в соли.","Это озеро выглядит на карте как большая синяя капля над Иорданской долиной.","Кинерет это большое пресное озеро Израиля. Оно на севере, и его вода важна для питья и сельского хозяйства."],"ar":["ما اسم البحيرة الكبيرة في شمال إسرائيل، التي مياهها العذبة مهمة للشرب؟","بحيرة طبريا","البحر الميت","البحر المتوسط","خليج إيلات","فكروا في ماء عذب في الشمال: يُشرب ولا يُستحم في ملح.","هذه البحيرة تبدو على الخريطة كنقطة زرقاء كبيرة فوق غور الأردن.","بحيرة طبريا هي البحيرة العذبة الكبيرة في إسرائيل. هي في الشمال، ومياهها مهمة للشرب والزراعة."]}],
["regions",1,{"he":["איפה גרים רוב תושבי ישראל?","במישור החוף, ליד הים התיכון","בנגב הדרומי, ליד העיר אילת","ברמת הגולן, ליד הר החרמון","במדבר יהודה, ליד ים המלח","חשבו איפה נמצאות רוב הערים הגדולות שאתם מכירים, כמו תל אביב ונתניה.","מצאו על המפה את תל אביב ואת נתניה, ובדקו איך קוראים לרצועה שביניהן לבין הים.","מישור החוף לאורך הים התיכון הוא האזור המאוכלס ביותר בישראל: הוא שטוח, נוח לבנייה וקרוב לנמלים."],"en":["Where do most of Israel's people live?","In the coastal plain, next to the Mediterranean Sea","In the southern Negev, next to the city of Eilat","In the Golan Heights, next to Mount Hermon","In the Judean Desert, next to the Dead Sea","Think about where most of the big cities you know are, like Tel Aviv and Netanya.","Find Tel Aviv and Netanya on the map, and check what the strip between them and the sea is called.","The coastal plain along the Mediterranean is the most crowded region in Israel: it is flat, easy to build on and close to ports."],"ru":["Где живёт большинство жителей Израиля?","На прибрежной равнине, рядом со Средиземным морем","В южной части Негева, рядом с городом Эйлат","На Голанских высотах, рядом с горой Хермон","В Иудейской пустыне, рядом с Мёртвым морем","Подумайте, где находятся большинство больших городов, которые вы знаете, вроде Тель-Авива и Нетании.","Найдите на карте Тель-Авив и Нетанию и проверьте, как называется полоса между ними и морем.","Прибрежная равнина вдоль Средиземного моря это самый населённый район Израиля: она плоская, удобная для строительства и близкая к портам."],"ar":["أين يسكن معظم سكان إسرائيل؟","في السهل الساحلي، بجانب البحر المتوسط","في النقب الجنوبي، بجانب مدينة إيلات","في هضبة الجولان، بجانب جبل الشيخ","في صحراء يهودا، بجانب البحر الميت","فكروا أين توجد معظم المدن الكبيرة التي تعرفونها، مثل تل أبيب ونتانيا.","جدوا على الخريطة تل أبيب ونتانيا، وتحققوا ما اسم الشريط بينهما وبين البحر.","السهل الساحلي على طول البحر المتوسط هو أكثر مناطق إسرائيل سكانًا: هو مستوٍ، ومريح للبناء وقريب من الموانئ."]}],
["regions",1,{"he":["על אילו הרים יושבת ירושלים?","הרי יהודה","הרי הגליל","הרי הגולן","הרי הנגב","חשבו איפה ירושלים על המפה: במרכז הארץ, בצפונה או בדרומה?","מצאו את ירושלים על מפה פיזית ובדקו מה שם רכס ההרים סביבה.","ירושלים יושבת על הרי יהודה, כשמונה מאות מטרים מעל פני הים. הגובה נותן לה אוויר קריר יותר מאשר בחוף."],"en":["On which mountains does Jerusalem sit?","The Judean Mountains","The Galilee mountains","The Golan heights","The Negev mountains","Think about where Jerusalem is on the map: in the center of the country, in its north or in its south?","Find Jerusalem on a physical map and check the name of the mountain ridge around it.","Jerusalem sits on the Judean Mountains, about eight hundred meters above sea level. The height gives it cooler air than the coast."],"ru":["На каких горах стоит Иерусалим?","Иудейские горы","Галилейские горы","Голанские высоты","Горы Негева","Подумайте, где Иерусалим на карте: в центре страны, на севере или на юге?","Найдите Иерусалим на физической карте и проверьте название горного хребта вокруг него.","Иерусалим стоит на Иудейских горах, примерно восемьсот метров над уровнем моря. Высота даёт ему более прохладный воздух, чем на побережье."],"ar":["على أي جبال تقع القدس؟","جبال يهودا","جبال الجليل","هضبة الجولان","جبال النقب","فكروا أين القدس على الخريطة: في وسط البلاد، في شمالها أم في جنوبها؟","جدوا القدس على خريطة طبيعية وتحققوا ما اسم سلسلة الجبال حولها.","تقع القدس على جبال يهودا، نحو ثمانمئة متر فوق مستوى البحر. الارتفاع يعطيها هواء أبرد من الساحل."]}],
["regions",1,{"he":["איזו עיר גדולה נקראת ״בירת הנגב״?","באר שבע","חיפה","טבריה","נצרת","חשבו על עיר גדולה שיושבת בלב המדבר שבדרום.","שם העיר מזכיר בור מים עתיק ומספר.","באר שבע היא העיר הגדולה ביותר בנגב. לכן קוראים לה ״בירת הנגב״."],"en":["Which big city is called \"the capital of the Negev\"?","Beersheba","Haifa","Tiberias","Nazareth","Think of a big city that sits in the middle of the southern desert.","In Hebrew, its name hints at an old well and a number.","Beersheba is the biggest city in the Negev. That is why it is called \"the capital of the Negev\"."],"ru":["Какой большой город называют «столицей Негева»?","Беэр-Шева","Хайфа","Тверия","Назарет","Подумайте о большом городе, который стоит посреди южной пустыни.","На иврите его название напоминает о старом колодце и о числе.","Беэр-Шева самый большой город в Негеве. Поэтому его называют «столицей Негева»."],"ar":["أي مدينة كبيرة تُسمى «عاصمة النقب»؟","بئر السبع","حيفا","طبريا","الناصرة","فكروا في مدينة كبيرة تقع في وسط الصحراء الجنوبية.","اسم المدينة يذكّر ببئر ماء قديمة وبعدد.","بئر السبع هي أكبر مدينة في النقب. لذلك تُسمى «عاصمة النقب»."]}],
["regions",1,{"he":["מהו המוביל הארצי?","צינורות ותעלות שמובילים מים מצפון לדרום","ספינה גדולה שמביאה מים מעבר לים","סכר גדול שעוצר את מי הנחלים בנגב","נהר שזורם מאילת עד הגבול בצפון","דמיינו צינור ענק שעובר לאורך כל הארץ.","חשבו: איפה יש הרבה מים, ואיפה חסרים מים?","המוביל הארצי לוקח מים מהצפון, שם יש יותר מים. הוא מביא אותם למרכז ולדרום."],"en":["What is the National Water Carrier?","Pipes and canals that carry water from north to south","A big ship that brings water from across the sea","A big dam that holds the stream water in the Negev","A river that flows from Eilat to the northern border","Imagine a huge pipe that runs along the whole country.","Think: where is there a lot of water, and where is water missing?","The National Water Carrier takes water from the north, where there is more water. It brings it to the center and the south."],"ru":["Что такое Национальный водовод?","Трубы и каналы, которые несут воду с севера на юг","Большой корабль, который привозит воду из-за моря","Большая плотина, которая держит воду ручьёв в Негеве","Река, которая течёт от Эйлата до северной границы","Представьте огромную трубу, которая идёт через всю страну.","Подумайте: где много воды, а где её не хватает?","Национальный водовод берёт воду на севере, где воды больше. Он доставляет её в центр и на юг."],"ar":["ما هو الناقل القطري للمياه؟","أنابيب وقنوات تنقل الماء من الشمال إلى الجنوب","سفينة كبيرة تجلب الماء من وراء البحر","سد كبير يحجز مياه الوديان في النقب","نهر يجري من إيلات حتى الحدود الشمالية","تخيلوا أنبوبًا ضخمًا يمر على طول البلاد كلها.","فكروا: أين يوجد ماء كثير، وأين ينقص الماء؟","الناقل القطري يأخذ الماء من الشمال، حيث يوجد ماء أكثر. وهو يوصله إلى الوسط والجنوب."]}],
["regions",1,{"he":["איזה עמק רחב, מלא שדות, נמצא בין הרי הגליל להרי שומרון?","עמק יזרעאל","בקעת הערבה","מדבר יהודה","רמת הגולן","דמיינו שטח שטוח וירוק, כמו שטיח של שדות, בין שני אזורי הרים.","בעמק הזה יש קיבוצים ומושבים רבים, והעיר עפולה.","עמק יזרעאל הוא עמק רחב ושטוח בצפון הארץ. האדמה שם טובה, ויש בו הרבה שדות."],"en":["Which wide valley, full of fields, lies between the Galilee mountains and the Samarian hills?","The Jezreel Valley","The Arava","The Judean Desert","The Golan Heights","Imagine a flat, green area, like a carpet of fields, between two hilly regions.","This valley has many kibbutzim and moshavim, and the town of Afula.","The Jezreel Valley is a wide, flat valley in the north of the country. The soil there is good, and it has many fields."],"ru":["Какая широкая долина, полная полей, лежит между Галилейскими горами и горами Самарии?","Изреельская долина","Арава","Иудейская пустыня","Голанские высоты","Представьте ровное зелёное место, как ковёр из полей, между двумя горными районами.","В этой долине много кибуцев и мошавов, и есть город Афула.","Изреельская долина это широкая ровная долина на севере страны. Земля там хорошая, и в ней много полей."],"ar":["أي سهل واسع مليء بالحقول يقع بين جبال الجليل وجبال السامرة؟","مرج ابن عامر","وادي عربة","صحراء يهودا","هضبة الجولان","تخيلوا منطقة مستوية وخضراء، مثل سجادة من الحقول، بين منطقتين جبليتين.","في هذا السهل كيبوتسات وموشافات كثيرة، ومدينة العفولة.","مرج ابن عامر سهل واسع ومستوٍ في شمال البلاد. التربة هناك جيدة، وفيه حقول كثيرة."]}],
["regions",1,{"he":["איזה ים נמצא ממערב לישראל?","הים התיכון","ים המלח","הים האדום","ים כנרת","דמיינו שאתם עומדים על החוף של תל אביב ומסתכלים אל השקיעה.","זה הים הגדול ביותר שנוגע בחופי ישראל.","הים התיכון נמצא במערב הארץ. לאורכו יושבות ערים כמו חיפה, תל אביב ואשדוד."],"en":["Which sea lies to the west of Israel?","The Mediterranean Sea","The Dead Sea","The Red Sea","The Sea of Galilee","Imagine you are standing on the beach in Tel Aviv, looking at the sunset.","It is the biggest sea that touches Israel's shores.","The Mediterranean Sea is in the west of the country. Cities like Haifa, Tel Aviv and Ashdod lie along it."],"ru":["Какое море находится к западу от Израиля?","Средиземное море","Мёртвое море","Красное море","Кинерет","Представьте, что вы стоите на пляже в Тель-Авиве и смотрите на закат.","Это самое большое море, которое касается берегов Израиля.","Средиземное море находится на западе страны. Вдоль него стоят города Хайфа, Тель-Авив и Ашдод."],"ar":["أي بحر يقع غرب إسرائيل؟","البحر المتوسط","البحر الميت","البحر الأحمر","بحيرة طبريا","تخيلوا أنكم تقفون على شاطئ تل أبيب وتنظرون إلى غروب الشمس.","هذا أكبر بحر يلمس شواطئ إسرائيل.","البحر المتوسط يقع في غرب البلاد. على طوله تقع مدن مثل حيفا وتل أبيب وأسدود."]}],
["regions",1,{"he":["איך קוראים לנחל שזורם רק אחרי גשם, ובקיץ הוא יבש?","נחל אכזב","נחל איתן","מעיין","באר","דמיינו ערוץ של אבנים יבשות, שמתמלא במים רק אחרי סערה.","בנחל כזה יש מים רק בחלק מהשנה, ואחר כך הם נעלמים.","נחל אכזב זורם רק אחרי גשם, ואחר כך מתייבש. בנגב ובמדבר יהודה רוב הנחלים הם כאלה."],"en":["What do we call a stream that flows only after rain and is dry in summer?","A seasonal stream","A year-round stream","A spring","A well","Imagine a channel of dry stones that fills with water only after a storm.","This kind of stream only shows up at certain times of the year.","A seasonal stream flows only after rain, and then dries up. Most streams in the Negev and the Judean Desert are like this."],"ru":["Как называют ручей, который течёт только после дождя, а летом сухой?","Пересыхающий ручей","Постоянный ручей","Родник","Колодец","Представьте русло из сухих камней, которое наполняется водой только после бури.","Вода в таком ручье бывает не всегда, а потом исчезает.","Пересыхающий ручей течёт только после дождя, а потом высыхает. Большинство ручьёв в Негеве и Иудейской пустыне такие."],"ar":["ماذا نسمي مجرى ماء يجري فقط بعد المطر، ويكون جافًا في الصيف؟","وادٍ موسمي","نهر دائم","نبع","بئر","تخيلوا مجرى من الحجارة الجافة، يمتلئ بالماء فقط بعد عاصفة.","هذا المجرى يظهر فيه الماء في وقت معين من السنة فقط.","الوادي الموسمي يجري فقط بعد المطر، ثم يجف. معظم الوديان في النقب وصحراء يهودا هكذا."]}],
["regions",1,{"he":["איך קוראים לבקעה הארוכה, החמה והיבשה, שבין ים המלח לאילת?","הערבה","עמק יזרעאל","עמק החולה","השרון","דמיינו נסיעה ארוכה בכביש ישר, עם הרים אדומים בצד ומדבר מסביב.","באזור הזה יש מושבים שמגדלים ירקות בחממות, אף שכמעט אין גשם.","הערבה היא בקעה ארוכה ויבשה בדרום מזרח הארץ. היא מתחילה ליד ים המלח ומגיעה עד אילת."],"en":["What is the name of the long, hot, dry valley between the Dead Sea and Eilat?","The Arava","The Jezreel Valley","The Hula Valley","The Sharon","Imagine a long drive on a straight road, with red mountains on the side and desert all around.","This area has moshavim that grow vegetables in greenhouses, even though there is almost no rain.","The Arava is a long, dry valley in the southeast of the country. It starts near the Dead Sea and reaches Eilat."],"ru":["Как называется длинная, жаркая и сухая долина между Мёртвым морем и Эйлатом?","Арава","Изреельская долина","Долина Хула","Шарон","Представьте долгую поездку по прямой дороге, с красными горами сбоку и пустыней вокруг.","Здесь есть мошавы, которые выращивают овощи в теплицах, хотя дождя почти нет.","Арава это длинная сухая долина на юго-востоке страны. Она начинается у Мёртвого моря и доходит до Эйлата."],"ar":["ما اسم الوادي الطويل والحار والجاف بين البحر الميت وإيلات؟","وادي عربة","مرج ابن عامر","سهل الحولة","سهل الشارون","تخيلوا رحلة طويلة على طريق مستقيم، مع جبال حمراء على الجانب وصحراء حولكم.","في هذه المنطقة موشافات تزرع الخضار في دفيئات، مع أنه لا يكاد ينزل مطر.","وادي عربة وادٍ طويل وجاف في جنوب شرق البلاد. يبدأ قرب البحر الميت ويصل حتى إيلات."]}],
["regions",1,{"he":["איזה מדבר נמצא ממזרח לירושלים, ויורד עד ים המלח?","מדבר יהודה","הנגב המערבי","הערבה","מישור החוף","דמיינו שאתם יוצאים מירושלים לכיוון הזריחה, והכול נהיה חום ויבש.","למדבר הזה יש אותו שם כמו להרים שעליהם יושבת ירושלים.","מדבר יהודה נמצא בין הרי ירושלים לבין ים המלח. יש בו צוקים, נחלים יבשים ומעט גשם."],"en":["Which desert lies east of Jerusalem and goes down to the Dead Sea?","The Judean Desert","The western Negev","The Arava","The coastal plain","Imagine leaving Jerusalem toward the sunrise, and everything turns brown and dry.","This desert has the same name as the mountains Jerusalem sits on.","The Judean Desert lies between the Jerusalem mountains and the Dead Sea. It has cliffs, dry streams and little rain."],"ru":["Какая пустыня находится к востоку от Иерусалима и спускается к Мёртвому морю?","Иудейская пустыня","Западный Негев","Арава","Прибрежная равнина","Представьте, что вы выезжаете из Иерусалима в сторону восхода, и всё становится коричневым и сухим.","У этой пустыни такое же название, как у гор, на которых стоит Иерусалим.","Иудейская пустыня лежит между Иерусалимскими горами и Мёртвым морем. В ней есть скалы, сухие русла и мало дождя."],"ar":["أي صحراء تقع شرق القدس، وتنحدر حتى البحر الميت؟","صحراء يهودا","النقب الغربي","وادي عربة","السهل الساحلي","تخيلوا أنكم تخرجون من القدس باتجاه شروق الشمس، فيصبح كل شيء بنيًا وجافًا.","لهذه الصحراء نفس اسم الجبال التي تقع عليها القدس.","صحراء يهودا تقع بين جبال القدس والبحر الميت. فيها منحدرات صخرية ووديان جافة ومطر قليل."]}],
["regions",2,{"he":["למה צפון הארץ ירוק יותר מדרומה?","כי בצפון יורד הרבה יותר גשם מאשר בדרום","כי בדרום אסור לשתול עצים ושיחים בכלל","כי הצפון קרוב יותר לירח ומקבל ממנו אור","כי בדרום השמש לא זורחת, והצמחים לא גדלים","חשבו מה צמחים צריכים כדי להיות ירוקים, ומאיפה זה מגיע.","השוו כמות גשם בחורף בין מטולה בצפון לבאר שבע בדרום.","כמות הגשם יורדת מצפון לדרום. בגליל יורדים מאות מילימטרים בשנה, ובנגב רק מעט. לכן הצבע משתנה על המפה."],"en":["Why is the north of the country greener than its south?","Because much more rain falls in the north than in the south","Because planting trees and bushes is forbidden in the south","Because the north is closer to the moon and gets its light","Because the sun never rises in the south, so plants can't grow","Think about what plants need to be green, and where it comes from.","Compare the amount of winter rain between Metula in the north and Be'er Sheva in the south.","The amount of rain drops from north to south. In the Galilee hundreds of millimeters fall each year, and in the Negev only a little. That is why the color changes on the map."],"ru":["Почему север страны зеленее её юга?","Потому что на севере выпадает намного больше дождя, чем на юге","Потому что на юге запрещено сажать деревья и кусты","Потому что север ближе к луне и получает от неё свет","Потому что на юге солнце не восходит, и растения не растут","Подумайте, что нужно растениям, чтобы быть зелёными, и откуда это приходит.","Сравните количество зимнего дождя между Метулой на севере и Беэр-Шевой на юге.","Количество дождя уменьшается с севера на юг. В Галилее выпадают сотни миллиметров в год, а в Негеве лишь немного. Поэтому цвет меняется на карте."],"ar":["لماذا شمال البلاد أكثر خضرة من جنوبها؟","لأن في الشمال ينزل مطر أكثر بكثير مما في الجنوب","لأن في الجنوب يُمنع غرس الأشجار والشجيرات","لأن الشمال أقرب إلى القمر ويأخذ منه الضوء","لأن في الجنوب الشمس لا تشرق، فلا تنمو النباتات","فكروا ماذا تحتاج النباتات لتكون خضراء، ومن أين يأتي ذلك.","قارنوا كمية مطر الشتاء بين المطلة في الشمال وبئر السبع في الجنوب.","كمية المطر تقل من الشمال إلى الجنوب. في الجليل تنزل مئات المليمترات في السنة، وفي النقب القليل فقط. لذلك يتغير اللون على الخريطة."]}],
["regions",2,{"he":["אילו שני גופי מים מחבר נהר הירדן?","את הכנרת ואת ים המלח","את הים התיכון ואת הים האדום","את הכנרת ואת הים התיכון","את ים המלח ואת מפרץ אילת","חשבו על מסלול של נהר: מהמקור בצפון, דרך אגם, ועד השפך בדרום.","עקבו על המפה אחרי הקו הכחול של הירדן מצפון לדרום.","הירדן זורם מהחרמון, נכנס לכנרת ויוצא ממנה דרומה אל ים המלח."],"en":["Which two bodies of water does the Jordan River connect?","The Sea of Galilee and the Dead Sea","The Mediterranean and the Red Sea","The Sea of Galilee and the Mediterranean","The Dead Sea and the Gulf of Eilat","Think about a river's path: from the source in the north, through a lake, to the mouth in the south.","Follow the blue line of the Jordan on the map from north to south.","The Jordan flows from the Hermon, enters the Sea of Galilee and leaves it southward to the Dead Sea."],"ru":["Какие два водоёма соединяет река Иордан?","Кинерет и Мёртвое море","Средиземное и Красное моря","Кинерет и Средиземное море","Мёртвое море и Эйлатский залив","Подумайте о пути реки: от истока на севере, через озеро, до устья на юге.","Проследите на карте синюю линию Иордана с севера на юг.","Иордан течёт от Хермона, входит в Кинерет и выходит из него на юг к Мёртвому морю."],"ar":["أي مسطحين مائيين يربط نهر الأردن؟","بحيرة طبريا والبحر الميت","البحر المتوسط والبحر الأحمر","بحيرة طبريا والبحر المتوسط","البحر الميت وخليج إيلات","فكروا في مسار النهر: من المنبع في الشمال، عبر بحيرة، إلى المصب في الجنوب.","تتبعوا على الخريطة الخط الأزرق لنهر الأردن من الشمال إلى الجنوب.","يجري الأردن من جبل الشيخ، يدخل بحيرة طبريا ويخرج منها جنوبًا إلى البحر الميت."]}],
["regions",2,{"he":["למה בנגב גרים פחות אנשים מאשר במרכז הארץ?","כי שם יבש ומעט מים, וקשה יותר לגור ולעבוד","כי שם קר מדי כל השנה, ויורד שלג כמעט כל יום","כי אסור לבנות שם בתים חדשים ושכונות","כי אין שם שמש, ולכן חשוך שם רוב היום","חשבו על הצרכים הבסיסיים של עיר: מים, עבודה ואוכל. מה קשה למצוא במדבר?","מה משותף לכל עיר גדולה שאתם מכירים, ומה חסר לאזור יבש?","המדבר יפה אבל קשה למגורים: מעט מים, מעט גשם וחום גדול. לכן רוב האנשים מתרכזים במרכז ובצפון."],"en":["Why do fewer people live in the Negev than in the center of the country?","Because it is dry with little water, and living and working are harder","Because it is too cold there all year, and it snows almost every day","Because building houses and neighborhoods there is forbidden","Because there is no sun there, so it is dark most of the day","Think about the basic needs of a city: water, work and food. What is hard to find in a desert?","What do all the big cities you know share, and what is a dry region missing?","The desert is beautiful but hard to live in: little water, little rain and great heat. That is why most people gather in the center and the north."],"ru":["Почему в Негеве живёт меньше людей, чем в центре страны?","Потому что там сухо и мало воды, и жить и работать труднее","Потому что там слишком холодно весь год и почти каждый день снег","Потому что строить там дома и кварталы запрещено","Потому что там нет солнца и почти весь день темно","Подумайте об основных нуждах города: вода, работа и еда. Что трудно найти в пустыне?","Что общего у всех больших городов, которые вы знаете, и чего не хватает сухому району?","Пустыня красива, но жить в ней трудно: мало воды, мало дождя и сильная жара. Поэтому большинство людей собирается в центре и на севере."],"ar":["لماذا يسكن في النقب أشخاص أقل مما في وسط البلاد؟","لأنه جاف وقليل الماء، والسكن والعمل أصعب","لأنه بارد جدًا كل السنة، والثلج يتساقط كثيرًا","لأنه يُمنع بناء بيوت وأحياء هناك","لأنه لا توجد فيه شمس، فهو مظلم معظم اليوم","فكروا في الاحتياجات الأساسية لمدينة: ماء وعمل وطعام. ما الصعب إيجاده في الصحراء؟","ما المشترك بين كل مدينة كبيرة تعرفونها، وما الناقص في منطقة جافة؟","الصحراء جميلة لكن السكن فيها صعب: ماء قليل ومطر قليل وحر شديد. لذلك يتجمع معظم الناس في الوسط والشمال."]}],
["regions",2,{"he":["מהם הגולן והחרמון?","רמה והר גבוהים בצפון מזרח הארץ","שני איים קטנים בים התיכון","ערי נמל גדולות בדרום הארץ","מדבריות חמים במערב הארץ","חשבו על מקום גבוה וקריר, שבו יורד שלג בחורף ואפשר לגלוש.","חפשו על המפה את הפינה הצפון מזרחית של ישראל.","רמת הגולן היא רמה גבוהה בצפון מזרח הארץ, והחרמון הוא ההר הגבוה ביותר בישראל, עם שלג בחורף."],"en":["What are the Golan and the Hermon?","A high plateau and mountain in the northeast of the country","Two small islands far out in the Mediterranean Sea","Big port cities on the coast in the south of the country","Hot and dry sandy deserts in the west of the country","Think about a high cool place, where snow falls in winter and people can ski.","Look on the map for the northeastern corner of Israel.","The Golan Heights is a high plateau in the northeast, and the Hermon is the highest mountain in Israel, with snow in winter."],"ru":["Что такое Голан и Хермон?","Высокое плато и гора на северо-востоке страны","Два маленьких острова в Средиземном море","Большие портовые города на юге страны","Жаркие сухие пустыни на западе страны","Подумайте о высоком прохладном месте, где зимой выпадает снег и можно кататься на лыжах.","Поищите на карте северо-восточный угол Израиля.","Голанские высоты это высокое плато на северо-востоке, а Хермон самая высокая гора в Израиле, со снегом зимой."],"ar":["ما هما الجولان وجبل الشيخ؟","هضبة وجبل مرتفعان في شمال شرق البلاد","جزيرتان صغيرتان في البحر المتوسط","مدن موانئ كبيرة في جنوب البلاد","صحارٍ حارة وجافة في غرب البلاد","فكروا في مكان مرتفع وبارد، ينزل فيه الثلج شتاء ويمكن التزلج.","ابحثوا على الخريطة عن الزاوية الشمالية الشرقية لإسرائيل.","هضبة الجولان هي هضبة مرتفعة في الشمال الشرقي، وجبل الشيخ هو أعلى جبل في إسرائيل، وفيه ثلج في الشتاء."]}],
["regions",2,{"he":["משפחה רוצה לראות שלג ולגלוש בסקי בישראל. לאן כדאי לה לנסוע?","להר החרמון","לחוף אילת","לים המלח","לבקעת הערבה","שלג יורד במקום גבוה וקר מאוד.","חפשו את ההר הגבוה ביותר, בקצה הצפוני של הארץ.","החרמון הוא ההר הגבוה ביותר בצפון הארץ. בחורף יורד עליו שלג, ויש בו אתר סקי."],"en":["A family wants to see snow and go skiing in Israel. Where should they go?","To Mount Hermon","To the Eilat beach","To the Dead Sea","To the Arava valley","Snow falls in a very high and cold place.","Look for the highest mountain, at the northern tip of the country.","The Hermon is the highest mountain in the north of the country. Snow falls on it in winter, and it has a ski site."],"ru":["Семья хочет увидеть снег и покататься на лыжах в Израиле. Куда ей ехать?","На гору Хермон","На пляж Эйлата","К Мёртвому морю","В долину Арава","Снег выпадает в очень высоком и холодном месте.","Ищите самую высокую гору, на северном краю страны.","Хермон это самая высокая гора на севере страны. Зимой на нём выпадает снег, и там есть лыжный курорт."],"ar":["عائلة تريد أن ترى الثلج وتتزلج في إسرائيل. إلى أين يجب أن تذهب؟","إلى جبل الشيخ","إلى شاطئ إيلات","إلى البحر الميت","إلى وادي عربة","الثلج ينزل في مكان مرتفع وبارد جدًا.","ابحثوا عن أعلى جبل، في الطرف الشمالي من البلاد.","جبل الشيخ هو أعلى جبل في شمال البلاد. في الشتاء ينزل عليه الثلج، وفيه موقع للتزلج."]}],
["regions",2,{"he":["דנה גרה באילת, ויוסי גר בגליל. ביום רגיל בינואר, מי צריך מטרייה יותר?","יוסי, שגר בגליל","דנה, שגרה באילת","שניהם באותה מידה","אף אחד, כי בינואר אין גשם","דמיינו את מפת הארץ: איפה ירוק, ואיפה צהוב?","ככל שנוסעים דרומה, יורד פחות ופחות גשם.","בגליל יורד הרבה גשם בחורף. באילת, בקצה הדרומי, יורד מעט מאוד גשם."],"en":["Dana lives in Eilat, and Yossi lives in the Galilee. On a normal day in January, who needs an umbrella more?","Yossi, who lives in the Galilee","Dana, who lives in Eilat","Both of them equally","Neither, because there is no rain in January","Imagine the map of the country: where is it green, and where is it yellow?","The farther south you travel, the less rain falls.","A lot of rain falls in the Galilee in winter. In Eilat, at the southern tip, very little rain falls."],"ru":["Дана живёт в Эйлате, а Йоси живёт в Галилее. Кому в обычный январский день больше нужен зонт?","Йоси, который живёт в Галилее","Дане, которая живёт в Эйлате","Обоим одинаково","Никому, ведь в январе дождя нет","Представьте карту страны: где она зелёная, а где жёлтая?","Чем дальше на юг, тем меньше выпадает дождя.","В Галилее зимой выпадает много дождя. В Эйлате, на южном краю, дождя выпадает очень мало."],"ar":["دانا تسكن في إيلات، ويوسي يسكن في الجليل. في يوم عادي من كانون الثاني، من يحتاج المظلة أكثر؟","يوسي، الذي يسكن في الجليل","دانا، التي تسكن في إيلات","كلاهما بنفس القدر","لا أحد، لأنه لا مطر في كانون الثاني","تخيلوا خريطة البلاد: أين هي خضراء، وأين هي صفراء؟","كلما اتجهنا جنوبًا، ينزل مطر أقل فأقل.","في الجليل ينزل مطر كثير في الشتاء. في إيلات، في الطرف الجنوبي، ينزل مطر قليل جدًا."]}],
["regions",2,{"he":["חקלאי בערבה מגדל ירקות במדבר. איזו דרך תעזור לו לחסוך הכי הרבה מים?","טפטפות שנותנות מים ישר לשורש","להציף את השדה במים כל בוקר","להשקות בצהריים עם ממטרות גדולות","לשתול צמחים שצריכים מים רבים","דמיינו צינור דק שנותן לכל צמח רק טיפה אחרי טיפה.","חשבו: איך מגיעים המים לצמח בלי שהשמש תייבש אותם בדרך?","טפטפות נותנות מים ישר ליד השורש, ולכן כמעט לא מתבזבזים מים. ההמצאה הזאת עוזרת לגדל ירקות גם במדבר."],"en":["A farmer in the Arava grows vegetables in the desert. Which method will help him save the most water?","Drip lines that give water straight to the roots","Flooding the field with water every morning","Watering at noon with big sprinklers","Planting crops that need a lot of water","Imagine a thin tube that gives each plant only drop after drop.","Think: how does water reach the plant without the sun drying it on the way?","Drip lines give water right next to the roots, so almost no water is wasted. This invention helps grow vegetables even in the desert."],"ru":["Фермер в Араве выращивает овощи в пустыне. Какой способ поможет ему больше всего сберечь воду?","Капельницы, которые дают воду прямо к корням","Заливать поле водой каждое утро","Поливать в полдень большими дождевателями","Сажать растения, которым нужно много воды","Представьте тонкую трубку, которая даёт каждому растению воду капля за каплей.","Подумайте: как вода доходит до растения, чтобы солнце не высушило её по дороге?","Капельницы дают воду прямо рядом с корнями, поэтому вода почти не теряется. Это изобретение помогает выращивать овощи даже в пустыне."],"ar":["مزارع في وادي عربة يزرع الخضار في الصحراء. أي طريقة ستساعده على توفير أكبر كمية من الماء؟","التنقيط الذي يعطي الماء مباشرة للجذور","إغراق الحقل بالماء كل صباح","الري وقت الظهيرة برشاشات كبيرة","زراعة نباتات تحتاج ماء كثيرًا","تخيلوا أنبوبًا رفيعًا يعطي كل نبتة قطرة بعد قطرة فقط.","فكروا: كيف يصل الماء إلى النبتة دون أن تجففه الشمس في الطريق؟","التنقيط يعطي الماء بجانب الجذور مباشرة، لذلك لا يضيع ماء تقريبًا. هذا الاختراع يساعد على زراعة الخضار حتى في الصحراء."]}],
["regions",2,{"he":["תייר רוצה לצלול ולראות שונית אלמוגים ודגים צבעוניים. לאן הוא ייסע?","לאילת","לטבריה","לים המלח","לעמק יזרעאל","אלמוגים חיים בים חם ומלוח, לא באגם ולא בשדה.","חפשו את העיר בקצה הדרומי של הארץ, שיושבת על הים האדום.","באילת יש ים חם ושקוף, ובו שונית אלמוגים. לכן הרבה תיירים באים לשם לצלול."],"en":["A tourist wants to dive and see a coral reef and colorful fish. Where will he go?","To Eilat","To Tiberias","To the Dead Sea","To the Jezreel Valley","Corals live in a warm, salty sea, not in a lake and not in a field.","Look for the city at the southern tip of the country, on the Red Sea.","Eilat has a warm, clear sea with a coral reef. That is why many tourists come there to dive."],"ru":["Турист хочет понырять и увидеть коралловый риф и цветных рыб. Куда он поедет?","В Эйлат","В Тверию","На Мёртвое море","В Изреельскую долину","Кораллы живут в тёплом солёном море, а не в озере и не в поле.","Ищите город на южном краю страны, на берегу Красного моря.","В Эйлате тёплое и прозрачное море с коралловым рифом. Поэтому туда приезжает много туристов нырять."],"ar":["سائح يريد أن يغوص ويرى شعابًا مرجانية وأسماكًا ملونة. إلى أين سيذهب؟","إلى إيلات","إلى طبريا","إلى البحر الميت","إلى مرج ابن عامر","المرجان يعيش في بحر دافئ ومالح، لا في بحيرة ولا في حقل.","ابحثوا عن المدينة في الطرف الجنوبي من البلاد، على البحر الأحمر.","في إيلات بحر دافئ وصافٍ فيه شعاب مرجانية. لذلك يأتي سياح كثيرون إلى هناك للغوص."]}],
["regions",2,{"he":["נוסעים ברכב מירושלים אל ים המלח. מה קורה בדרך?","יורדים למטה, הרבה מאוד","עולים למעלה, הרבה מאוד","נשארים כל הזמן באותו גובה","עולים לפסגה ונשארים בה","שימו לב לאוזניים: הן נאטמות כשהגובה משתנה מהר.","ירושלים יושבת על הרים, וים המלח הוא המקום הנמוך ביותר ביבשה.","ירושלים נמצאת גבוה בהרים. ים המלח נמצא נמוך מאוד, ולכן כל הדרך אליו היא ירידה."],"en":["You drive by car from Jerusalem to the Dead Sea. What happens on the way?","You go down, a very long way","You go up, a very long way","You stay at the same height all the time","You climb to a peak and stay there","Pay attention to your ears: they get blocked when the height changes fast.","Jerusalem sits on mountains, and the Dead Sea is the lowest place on land.","Jerusalem is high in the mountains. The Dead Sea is very low, so the whole way there is downhill."],"ru":["Едем на машине из Иерусалима к Мёртвому морю. Что происходит по дороге?","Спускаемся вниз, очень сильно","Поднимаемся вверх, очень сильно","Всё время остаёмся на одной высоте","Поднимаемся на вершину и остаёмся там","Обратите внимание на уши: их закладывает, когда высота быстро меняется.","Иерусалим стоит на горах, а Мёртвое море самое низкое место на суше.","Иерусалим находится высоко в горах. Мёртвое море лежит очень низко, поэтому вся дорога к нему идёт вниз."],"ar":["نسافر بالسيارة من القدس إلى البحر الميت. ماذا يحدث في الطريق؟","ننزل إلى الأسفل كثيرًا جدًا","نصعد إلى الأعلى كثيرًا جدًا","نبقى طوال الوقت على نفس الارتفاع","نصعد إلى قمة ونبقى فيها","انتبهوا إلى الأذنين: تنسدّان عندما يتغير الارتفاع بسرعة.","القدس تقع على جبال، والبحر الميت هو أخفض مكان على اليابسة.","القدس تقع عاليًا في الجبال. البحر الميت منخفض جدًا، لذلك الطريق إليه كلها نزول."]}],
["regions",2,{"he":["חקלאי בעמק יזרעאל יוצא בבוקר לעבודה. מה הוא כנראה מגדל?","חיטה וירקות בשדות רחבים","אלמוגים בתוך מים עמוקים","מלח שמפיקים ממי הים","דגים בשונית בים האדום","דמיינו עמק שטוח, אדמה כהה וגשם בחורף.","חשבו מה צומח טוב באדמה פורייה, בשטח ישר וגדול.","בעמק יזרעאל יש אדמה טובה, שטח שטוח וגשם בחורף. לכן מגדלים שם הרבה גידולי שדה, כמו חיטה, וגם ירקות."],"en":["A farmer in the Jezreel Valley goes to work in the morning. What does he probably grow?","Wheat and vegetables in wide fields","Corals in deep water","Salt taken from sea water","Fish on a reef in the Red Sea","Imagine a flat valley, dark soil and rain in winter.","Think about what grows well in rich soil, on a big flat area.","The Jezreel Valley has good soil, flat land and winter rain. That is why many field crops, like wheat, and also vegetables are grown there."],"ru":["Фермер в Изреельской долине утром выходит на работу. Что он, скорее всего, выращивает?","Пшеницу и овощи на широких полях","Кораллы в глубокой воде","Соль из морской воды","Рыбу на рифе в Красном море","Представьте ровную долину, тёмную землю и дождь зимой.","Подумайте, что хорошо растёт на плодородной земле, на большом ровном месте.","В Изреельской долине хорошая земля, ровные участки и зимний дождь. Поэтому там выращивают много полевых культур, например пшеницу, а также овощи."],"ar":["مزارع في مرج ابن عامر يخرج إلى العمل في الصباح. ماذا يزرع على الأرجح؟","القمح والخضار في حقول واسعة","المرجان في مياه عميقة","الملح المستخرج من مياه البحر","الأسماك في الشعاب بالبحر الأحمر","تخيلوا سهلًا مستويًا، وتربة داكنة، ومطرًا في الشتاء.","فكروا فيما ينمو جيدًا في تربة خصبة، على أرض مستوية وكبيرة.","في مرج ابن عامر تربة جيدة وأرض مستوية ومطر في الشتاء. لذلك تُزرع هناك محاصيل حقلية كثيرة مثل القمح، وكذلك الخضار."]}],
["regions",2,{"he":["ליד ים המלח יש מפעלים גדולים. מה הם מפיקים מהמים?","מלחים ומינרלים","מים מתוקים לשתייה","דגים לשוק","עצים לבנייה","חשבו מה נשאר על העור אחרי שטובלים בים המלח ומתייבשים.","המים שם כבדים ומלאים בחומרים שהשמש משאירה מאחור.","מי ים המלח מלאים במלחים ובמינרלים. המפעלים מפיקים אותם, ומהם מכינים למשל דשן לצמחים."],"en":["There are big factories next to the Dead Sea. What do they take out of the water?","Salts and minerals","Fresh drinking water","Fish for the market","Wood for building","Think about what stays on your skin after you dip in the Dead Sea and dry off.","The water there is heavy and full of materials that the sun leaves behind.","The Dead Sea water is full of salts and minerals. The factories take them out, and they are used, for example, to make fertilizer for plants."],"ru":["Возле Мёртвого моря есть большие заводы. Что они добывают из воды?","Соли и минералы","Пресную питьевую воду","Рыбу для рынка","Дерево для стройки","Подумайте, что остаётся на коже, когда окунёшься в Мёртвое море и высохнешь.","Вода там тяжёлая и полна веществ, которые оставляет солнце.","Вода Мёртвого моря полна солей и минералов. Заводы добывают их, и из них делают, например, удобрения для растений."],"ar":["قرب البحر الميت توجد مصانع كبيرة. ماذا تستخرج من الماء؟","أملاحًا ومعادن","ماء عذبًا للشرب","أسماكًا للسوق","خشبًا للبناء","فكروا فيما يبقى على الجلد بعد الغطس في البحر الميت والجفاف.","الماء هناك ثقيل ومليء بمواد تتركها الشمس خلفها.","مياه البحر الميت مليئة بالأملاح والمعادن. المصانع تستخرجها، ويُصنع منها مثلًا سماد للنباتات."]}],
["regions",2,{"he":["תפוחים ודובדבנים צריכים חורף קר. איפה כדאי לחקלאי לשתול אותם?","ברמת הגולן","בערבה","בחוף ים המלח","באילת","חפשו אזור גבוה בצפון, שבו החורף קר ולפעמים יורד שלג.","ככל שהמקום גבוה יותר וצפוני יותר, כך החורף קר יותר.","רמת הגולן גבוהה ונמצאת בצפון, ולכן החורף שם קר. זה מתאים לתפוחים ולדובדבנים."],"en":["Apples and cherries need a cold winter. Where should a farmer plant them?","In the Golan Heights","In the Arava","On the Dead Sea shore","In Eilat","Look for a high area in the north, where winter is cold and sometimes it snows.","The higher and more northern a place is, the colder its winter.","The Golan is high and in the north, so winter there is cold. This suits apples and cherries."],"ru":["Яблокам и вишням нужна холодная зима. Где фермеру лучше их посадить?","На Голанских высотах","В Араве","На берегу Мёртвого моря","В Эйлате","Ищите высокий район на севере, где зима холодная и иногда идёт снег.","Чем выше и севернее место, тем холоднее там зима.","Голаны высокие и находятся на севере, поэтому зима там холодная. Это подходит для яблок и вишен."],"ar":["التفاح والكرز يحتاجان شتاءً باردًا. أين يجب على المزارع أن يزرعهما؟","في هضبة الجولان","في وادي عربة","على شاطئ البحر الميت","في إيلات","ابحثوا عن منطقة مرتفعة في الشمال، الشتاء فيها بارد وأحيانًا ينزل الثلج.","كلما كان المكان أعلى وأكثر شمالًا، كان شتاؤه أبرد.","الجولان مرتفع ويقع في الشمال، لذلك الشتاء هناك بارد. هذا يناسب التفاح والكرز."]}],
["regions",2,{"he":["אחרי גשם חזק, נחל יבש בנגב מתמלא פתאום במים שזורמים מהר. איך קוראים לזה?","שיטפון","בצורת","סופת חול","גאות","דמיינו נהר חום וגועש שמופיע פתאום במקום שהיה בו רק חול ואבנים.","המילה מתארת הרבה מים ששוטפים הכול בדרכם.","שיטפון הוא זרם חזק של מים בנחל, אחרי גשם. הוא מסוכן, ולכן לא נכנסים לנחל כשהוא זורם."],"en":["After a heavy rain, a dry stream in the Negev suddenly fills with fast-flowing water. What is this called?","A flash flood","A drought","A sandstorm","A high tide","Imagine a brown, wild river that suddenly appears where there were only sand and stones.","The word describes a lot of water rushing and washing everything away.","A flash flood is a strong rush of water in a stream after rain. It is dangerous, so we do not go into a stream when it is flowing."],"ru":["После сильного дождя сухой ручей в Негеве вдруг наполняется быстрой водой. Как это называется?","Паводок","Засуха","Песчаная буря","Прилив","Представьте бурую бурную реку, которая вдруг появляется там, где были только песок и камни.","Это слово описывает много воды, которая смывает всё на своём пути.","Паводок это сильный поток воды в ручье после дождя. Он опасен, поэтому нельзя заходить в ручей, когда он течёт."],"ar":["بعد مطر قوي، يمتلئ وادٍ جاف في النقب فجأة بماء يجري بسرعة. ماذا نسمي هذا؟","سيل","جفاف","عاصفة رملية","مدّ البحر","تخيلوا نهرًا بنيًا هائجًا يظهر فجأة في مكان لم يكن فيه إلا رمل وحجارة.","الكلمة تصف ماءً كثيرًا يجرف كل شيء في طريقه.","السيل تيار قوي من الماء في الوادي بعد المطر. إنه خطير، لذلك لا ندخل الوادي عندما يجري."]}],
["regions",3,{"he":["ישראל ארץ קטנה, אבל יש בה מדבר, הרים ירוקים ובקעה חמה. איך זה שבארץ אחת קטנה יש אקלימים כל כך שונים?","כי הארץ ארוכה מצפון לדרום, הגשם פוחת דרומה והגבהים משתנים","כי כל עיר בוחרת לה אקלים משלה, וכך כל מקום שונה, והמדינה מחליפה את האקלימים כל כמה שנים","כי הים מתחלק לשלושה ימים, ולכל ים יש אקלים אחר","כי ככה זה בכל ארץ קטנה, בלי שום סיבה מיוחדת","חשבו על שני דברים שמשתנים מצפון לדרום: כמה גשם יורד, וכמה גבוה המקום מעל הים.","השוו שלושה מקומות על המפה: הגליל, מישור החוף והנגב. מה משתנה ביניהם?","גשם וגובה יוצרים אקלים: הצפון הגבוה מקבל הרבה גשם, החוף מתון ליד הים, והדרום הופך מדברי."],"en":["Israel is a small country, but it has a desert, green mountains and a hot valley. How can one small country have such different climates?","Because the country is long from north to south, the rain lessens southward and the heights change","Because every city chooses its own climate, so each place differs, and the state swaps the climates every few years","Because the sea splits into three seas, and each sea makes a different climate","Because that is how it is in every small country, with no special reason at all","Think about two things that change from north to south: how much rain falls, and how high the place is above the sea.","Compare three places on the map: the Galilee, the coastal plain and the Negev. What changes between them?","Rain and height create climate: the high north gets lots of rain, the coast is mild next to the sea, and the south becomes desert."],"ru":["Израиль маленькая страна, но в ней есть пустыня, зелёные горы и жаркая долина. Как в одной маленькой стране могут быть такие разные климаты?","Потому что страна длинная с севера на юг, дождь уменьшается к югу и высоты меняются","Потому что каждый город сам выбирает себе климат, все места разные, и государство меняет климаты каждые несколько лет","Потому что море делится на три разных моря, и у каждого из них свой климат","Потому что так бывает в любой маленькой стране, и особой причины для этого нет","Подумайте о двух вещах, которые меняются с севера на юг: сколько дождя выпадает и как высоко место над морем.","Сравните три места на карте: Галилею, прибрежную равнину и Негев. Что меняется между ними?","Дождь и высота создают климат: высокий север получает много дождя, побережье мягкое рядом с морем, а юг становится пустыней."],"ar":["إسرائيل بلد صغير، لكن فيها صحراء وجبال خضراء وغور حار. كيف يكون في بلد واحد صغير مناخات مختلفة جدًا هكذا؟","لأن البلاد طويلة من الشمال إلى الجنوب، والمطر يقل جنوبًا والارتفاعات تتغير","لأن كل مدينة تختار لنفسها مناخها، فكل مكان مختلف، والدولة تبدّل المناخات بين المناطق كل بضع سنوات","لأن البحر ينقسم إلى ثلاثة بحار، ولكل بحر منها مناخ مختلف","لأن هكذا الأمر في كل بلد صغير في العالم، من دون أي سبب خاص","فكروا في شيئين يتغيران من الشمال إلى الجنوب: كم مطر ينزل، وكم ارتفاع المكان فوق البحر.","قارنوا ثلاثة أماكن على الخريطة: الجليل والسهل الساحلي والنقب. ما الذي يتغير بينها؟","المطر والارتفاع يصنعان المناخ: الشمال المرتفع يحصل على مطر كثير، والساحل معتدل بجانب البحر، والجنوب يصبح صحراويًا."]}],
["regions",3,{"he":["למה המים של ים המלח כל כך מלוחים?","כי מים נכנסים אליו ולא יוצאים, האדים עפים לשמיים והמלח נשאר","כי ספינות גדולות שופכות שם מלח, שקים על שקים בכל יום, וגם מפעלים על החוף שופכים לתוכו מלח","כי החרמון עשוי מלח, והגשם שוטף את המלח אל הים","כי ככה נוצר כל ים בעולם, וכל הימים מלוחים באותה מידה","חשבו על סיר מים מלוחים על האש: המים מתאדים, ומה נשאר בתחתית?","לים המלח יש רק כניסת מים, בלי יציאה. לאן המים נעלמים?","ים המלח הוא שקע סגור: הירדן מזרים מים פנימה, השמש מאדה אותם, והמלח נשאר ומצטבר. לכן קל לצוף בו."],"en":["Why is the water of the Dead Sea so salty?","Because water flows in and does not flow out, the vapor flies to the sky and the salt stays","Because big ships come and dump bags and bags of salt into it every single day, and shore factories pour in more salt","Because the Hermon is made of salt, and the rain washes the salt into the sea","Because that is how every sea in the world is made, and all seas are equally salty","Think about a pot of salty water on the flame: the water evaporates, and what stays at the bottom?","The Dead Sea has only a water entrance, with no exit. Where does the water disappear to?","The Dead Sea is a closed hollow: the Jordan pours water in, the sun evaporates it, and the salt stays and collects. That is why floating in it is easy."],"ru":["Почему вода Мёртвого моря такая солёная?","Потому что вода втекает в него и не вытекает, пар улетает в небо, а соль остаётся","Потому что большие корабли каждый день высыпают туда мешки соли, и заводы на берегу тоже сыплют в него соль","Потому что гора Хермон сделана из соли, и дожди смывают эту соль в море","Потому что так создаётся каждое море, и все моря одинаково солёные","Подумайте о кастрюле с солёной водой на огне: вода испаряется, и что остаётся на дне?","У Мёртвого моря есть только вход воды, без выхода. Куда вода исчезает?","Мёртвое море это закрытая впадина: Иордан вливает воду внутрь, солнце испаряет её, а соль остаётся и накапливается. Поэтому плавать в нём легко."],"ar":["لماذا مياه البحر الميت مالحة جدًا؟","لأن الماء يدخل إليه ولا يخرج، والبخار يطير إلى السماء والملح يبقى","لأن السفن الكبيرة تفرغ هناك أكياسًا من الملح كل يوم، ومصانع على الشاطئ تسكب فيه ملحًا أيضًا","لأن جبل الشيخ مصنوع من الملح، والمطر يجرف الملح إلى البحر","لأن هكذا يتكون كل بحر، وكل البحار مالحة بالقدر نفسه","فكروا في قدر ماء مالح على النار: الماء يتبخر، وماذا يبقى في القاع؟","للبحر الميت مدخل ماء فقط، بلا مخرج. إلى أين يختفي الماء؟","البحر الميت هو منخفض مغلق: الأردن يضخ الماء إلى الداخل، والشمس تبخره، والملح يبقى ويتراكم. لذلك الطفو فيه سهل."]}],
["regions",3,{"he":["חקלאי רוצה לגדל תפוזים, שצריכים הרבה מים. איזה אזור ידרוש הכי הרבה השקיה?","הנגב, כי שם יורד הכי מעט גשם","הגליל, כי שם יש הרבה גשם","מישור החוף, כי שם קרוב לים","בקעת הכנרת, כי שם יש אגם","חשבו מה השמיים נותנים בחינם ומה החקלאי חייב להוסיף לבד במקום יבש.","ככל שיורד פחות גשם, צריך יותר השקיה. איזה אזור הכי יבש?","תפוזים צמאים למים. בגליל הגשם עוזר, אבל בנגב היבש כמעט כל המים חייבים לבוא מהשקיה."],"en":["A farmer wants to grow oranges, which need a lot of water. Which region will need the most irrigation?","The Negev, because the least rain falls there","The Galilee, because there is a lot of rain there","The coastal plain, because it is close to the sea","The Sea of Galilee valley, because there is a lake there","Think about what the sky gives for free and what the farmer must add alone in a dry place.","The less rain falls, the more irrigation is needed. Which region is the driest?","Oranges are thirsty for water. In the Galilee the rain helps, but in the dry Negev almost all the water must come from irrigation."],"ru":["Фермер хочет выращивать апельсины, которым нужно много воды. Какой район потребует больше всего орошения?","Негев, потому что там выпадает меньше всего дождя","Галилея, потому что там много дождя","Прибрежная равнина, потому что она близко к морю","Долина Кинерета, потому что там есть озеро","Подумайте, что небо даёт бесплатно, а что фермер должен добавить сам в сухом месте.","Чем меньше дождя выпадает, тем больше нужно орошения. Какой район самый сухой?","Апельсины жаждут воды. В Галилее дождь помогает, но в сухом Негеве почти вся вода должна прийти из орошения."],"ar":["مزارع يريد زراعة البرتقال، الذي يحتاج ماء كثيرًا. أي منطقة ستحتاج أكثر ري؟","النقب، لأن فيه ينزل أقل مطر","الجليل، لأن فيه مطر كثير","السهل الساحلي، لأنه قريب من البحر","غور طبريا، لأن فيه بحيرة","فكروا ماذا تعطي السماء مجانًا وماذا يجب على المزارع أن يضيف وحده في مكان جاف.","كلما نزل مطر أقل، احتجنا ريًا أكثر. أي منطقة هي الأكثر جفافًا؟","البرتقال عطشان للماء. في الجليل المطر يساعد، لكن في النقب الجاف كل الماء تقريبًا يجب أن يأتي من الري."]}],
