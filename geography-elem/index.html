["maps",2,{"he":["במפה הצפון למעלה. בית הספר מצויר מעל הפארק. נועה הולכת מהפארק לבית הספר. לאיזה כיוון היא הולכת?","צפונה","דרומה","מזרחה","מערבה","נועה זזה על המפה מלמטה למעלה. מה כתוב בראש המפה?","בדקו על שושנת הרוחות איזה כיוון מצביע לראש הדף.","כשהצפון בראש המפה, ללכת למעלה במפה זה ללכת צפונה."],"en":["On the map, north is at the top. The school is drawn above the park. Noa walks from the park to the school. Which way is she going?","North","South","East","West","Noa moves on the map from bottom to top. What is at the top of the map?","Check on the compass rose which direction points to the top of the page.","When north is at the top of the map, going up on the map means going north."],"ru":["На карте север наверху. Школа нарисована над парком. Ноа идёт из парка в школу. В какую сторону она идёт?","На север","На юг","На восток","На запад","Ноа движется по карте снизу вверх. Что находится в верхней части карты?","Проверьте на розе ветров, какое направление указывает на верх страницы.","Когда север наверху карты, идти вверх по карте значит идти на север."],"ar":["الشمال في أعلى الخريطة. المدرسة مرسومة فوق الحديقة. تمشي نوعا من الحديقة إلى المدرسة. إلى أي اتجاه تمشي؟","نحو الشمال","نحو الجنوب","نحو الشرق","نحو الغرب","نوعا تتحرك على الخريطة من الأسفل إلى الأعلى. ماذا يوجد في أعلى الخريطة؟","افحصوا في وردة الرياح أي اتجاه يشير إلى أعلى الصفحة.","عندما يكون الشمال في أعلى الخريطة، المشي إلى الأعلى على الخريطة يعني المشي نحو الشمال."]}],
["maps",2,{"he":["במקרא של מפה פיזית: ירוק הוא שטח נמוך, וחום כהה הוא שטח גבוה. החרמון צבוע בחום כהה. מה זה אומר?","שהחרמון הוא אזור גבוה","שבחרמון יש הרבה עצים","שהחרמון נמצא ליד הים","שבחרמון יש מדבר חם","בדקו במקרא: מה הצבע החום הכהה מספר על המקום?","במפה כזו הצבעים לא מראים צמחים. הם מראים כמה המקום מעל הים.","במפה פיזית הצבע מראה את הגובה. חום כהה פירושו אזור גבוה, ולכן החרמון גבוה."],"en":["In the legend of a physical map, green is low land and dark brown is high land. Mount Hermon is colored dark brown. What does this mean?","That the Hermon is a high area","That the Hermon has many trees","That the Hermon is near the sea","That the Hermon has a hot desert","Check the legend: what does dark brown tell us about the place?","On this kind of map, colors do not show plants. They show how far the place is above the sea.","On a physical map, color shows height. Dark brown means a high area, so the Hermon is high."],"ru":["В легенде физической карты: зелёный цвет означает низкую местность, а тёмно-коричневый означает высокую. Хермон окрашен в тёмно-коричневый. Что это значит?","Что Хермон находится высоко","Что на Хермоне много деревьев","Что Хермон рядом с морем","Что на Хермоне жаркая пустыня","Посмотрите в легенду: что тёмно-коричневый цвет говорит о месте?","На такой карте цвета не показывают растения. Они показывают, насколько место выше моря.","На физической карте цвет показывает высоту. Тёмно-коричневый означает высокий район, поэтому Хермон высокий."],"ar":["في مفتاح خريطة طبيعية: الأخضر أرض منخفضة، والبني الغامق أرض مرتفعة. جبل الشيخ ملوَّن بالبني الغامق. ماذا يعني ذلك؟","أن جبل الشيخ منطقة مرتفعة","أن في جبل الشيخ أشجارًا كثيرة","أن جبل الشيخ قرب البحر","أن في جبل الشيخ صحراء حارة","افحصوا في المفتاح: ماذا يقول اللون البني الغامق عن المكان؟","في خريطة كهذه الألوان لا تعرض النباتات. هي تعرض كم المكان فوق البحر.","في الخريطة الطبيعية اللون يعرض الارتفاع. البني الغامق يعني منطقة مرتفعة، لذلك جبل الشيخ مرتفع."]}],
["maps",2,{"he":["על מפת העיר יש רשת של ריבועים. ליד המפה כתוב: הספרייה בריבוע C4. איפה מחפשים אותה?","במפגש של טור C ושורה 4","בבית מספר 4 ברחוב C","4 קילומטרים ממרכז העיר","בשורה מספר 4 של המקרא","לאורך שוליים אחד של המפה יש אותיות, ולאורך שוליים אחר יש מספרים.","עקבו עם אצבע אחת מהאות ועם אצבע שנייה מהמספר.","ברשת של מפה, האות מראה טור והמספר מראה שורה. הספרייה נמצאת בריבוע שבו הם נפגשים."],"en":["The city map has a grid of squares. Next to the map it says: the library is in square C4. Where do you look for it?","Where column C meets row 4","At house number 4 on C Street","4 kilometers from the center","In row 4 of the legend","Along one edge of the map there are letters, and along another edge there are numbers.","Follow the letter with one finger and the number with a second finger.","In a map grid, the letter shows a column and the number shows a row. The library is in the square where they meet."],"ru":["На карте города есть сетка из квадратов. Рядом с картой написано: библиотека в квадрате C4. Где её искать?","Где столбец C встречает строку 4","В доме номер 4 на улице C","В 4 километрах от центра","В строке 4 легенды карты","Вдоль одного края карты стоят буквы, а вдоль другого края стоят числа.","Ведите одним пальцем от буквы, а другим пальцем от числа.","В сетке карты буква показывает столбец, а число показывает строку. Библиотека в квадрате, где они встречаются."],"ar":["على خريطة المدينة شبكة من المربعات. بجانب الخريطة مكتوب: المكتبة في المربع C4. أين نبحث عنها؟","حيث يلتقي العمود C بالصف 4","في البيت رقم 4 في شارع C","على بعد 4 كيلومترات من المركز","في السطر 4 من مفتاح الخريطة","على طول طرف واحد من الخريطة توجد حروف، وعلى طول طرف آخر توجد أرقام.","تتبعوا بإصبع واحد من الحرف وبإصبع ثانٍ من الرقم.","في شبكة الخريطة الحرف يدل على عمود والرقم يدل على صف. المكتبة في المربع الذي يلتقيان فيه."]}],
["maps",2,{"he":["רותי רוצה לראות את הגגות והעצים בשכונה בצבעים האמיתיים שלהם, כפי שהם נראים מהשמיים. מה כדאי לה לפתוח?","תצלום לוויין","מפה מדינית","שושנת רוחות","מפת גבהים","רותי לא רוצה ציור עם סימנים. היא רוצה לראות את המקום כמו שהוא.","חשבו על מצלמה שנמצאת גבוה מאוד, מעל כדור הארץ.","תצלום לוויין הוא תמונה אמיתית מהחלל. במפה רואים ציור עם סימנים וצבעים מוסכמים."],"en":["Ruti wants to see the roofs and trees in her neighborhood in their real colors, as they look from the sky. What should she open?","A satellite image","A political map","A compass rose","A height map","Ruti does not want a drawing with symbols. She wants to see the place as it is.","Think about a camera that is very high up, above the Earth.","A satellite image is a real picture from space. On a map we see a drawing with agreed symbols and colors."],"ru":["Рути хочет увидеть крыши и деревья своего района в настоящих цветах, как они выглядят с неба. Что ей лучше открыть?","Спутниковый снимок","Политическую карту","Розу ветров","Карту высот","Рути не нужен рисунок со значками. Она хочет увидеть место таким, какое оно есть.","Подумайте о камере, которая находится очень высоко над Землёй.","Спутниковый снимок: это настоящая фотография из космоса. На карте мы видим рисунок с условными знаками и цветами."],"ar":["تريد روتي أن ترى أسطح البيوت والأشجار في حيها بألوانها الحقيقية، كما تبدو من السماء. ماذا يُفضَّل أن تفتح؟","صورة قمر صناعي","خريطة سياسية","وردة الرياح","خريطة ارتفاعات","روتي لا تريد رسمًا بالعلامات. هي تريد أن ترى المكان كما هو.","فكروا في كاميرا موجودة عاليًا جدًا، فوق الأرض.","صورة القمر الصناعي صورة حقيقية من الفضاء. في الخريطة نرى رسمًا بعلامات وألوان متفق عليها."]}],
["maps",2,{"he":["תמר עומדת בחוף של תל אביב ומסתכלת על הים התיכון. באיזה כיוון מתל אביב נמצא הים?","במערב","במזרח","בצפון","בדרום","בערב, השמש שוקעת לתוך הים מול תמר.","במפת ישראל הים מצויר בצד שמאל של הארץ.","הים התיכון נמצא ממערב לתל אביב. לכן השמש שוקעת שם בערב."],"en":["Tamar stands on the beach in Tel Aviv and looks at the Mediterranean Sea. In which direction from Tel Aviv is the sea?","In the west","In the east","In the north","In the south","In the evening, the sun sets into the sea in front of Tamar.","On a map of Israel, the sea is drawn on the left side of the country.","The Mediterranean Sea is to the west of Tel Aviv. That is why the sun sets there in the evening."],"ru":["Тамар стоит на пляже в Тель-Авиве и смотрит на Средиземное море. В какой стороне от Тель-Авива находится море?","На западе","На востоке","На севере","На юге","Вечером солнце садится в море прямо перед Тамар.","На карте Израиля море нарисовано с левой стороны страны.","Средиземное море находится к западу от Тель-Авива. Поэтому вечером солнце садится там."],"ar":["تقف تمار على شاطئ تل أبيب وتنظر إلى البحر المتوسط. في أي اتجاه من تل أبيب يقع البحر؟","في الغرب","في الشرق","في الشمال","في الجنوب","في المساء تغرب الشمس في البحر أمام تمار.","في خريطة إسرائيل البحر مرسوم في الجهة اليسرى من البلاد.","البحر المتوسط يقع غرب تل أبيب. لذلك تغرب الشمس هناك في المساء."]}],
["maps",2,{"he":["על מפת ישראל, אילת נמצאת בקצה התחתון, וירושלים גבוה ממנה. באיזה כיוון מירושלים נמצאת אילת?","בדרום","בצפון","במזרח","במערב","בדקו איזה כיוון נמצא בתחתית המפה.","כדי להגיע לאילת נוסעים דרך הנגב והערבה.","אילת נמצאת בקצה הדרומי של ישראל. לכן מירושלים נוסעים אליה דרומה."],"en":["On the map of Israel, Eilat is at the bottom edge, and Jerusalem is higher up. In which direction from Jerusalem is Eilat?","In the south","In the north","In the east","In the west","Check which direction is at the bottom of the map.","To get to Eilat you drive through the Negev and the Arava.","Eilat is at the southern tip of Israel. So from Jerusalem you travel south to reach it."],"ru":["На карте Израиля Эйлат находится у нижнего края, а Иерусалим выше. В какой стороне от Иерусалима находится Эйлат?","На юге","На севере","На востоке","На западе","Проверьте, какое направление внизу карты.","Чтобы доехать до Эйлата, едут через Негев и Араву.","Эйлат находится на южном краю Израиля. Поэтому из Иерусалима к нему едут на юг."],"ar":["على خريطة إسرائيل تقع إيلات في الطرف السفلي، والقدس أعلى منها. في أي اتجاه من القدس تقع إيلات؟","في الجنوب","في الشمال","في الشرق","في الغرب","افحصوا أي اتجاه يوجد في أسفل الخريطة.","للوصول إلى إيلات نسافر عبر النقب والعربة.","إيلات تقع في الطرف الجنوبي من إسرائيل. لذلك نسافر إليها من القدس نحو الجنوب."]}],
["maps",2,{"he":["במפת טיולים יש סימן של אוהל קטן. במקרא כתוב ליד האוהל: חניון לילה. מה יש במקום הזה?","מקום לישון בו בשטח","חנות שמוכרת אוהלים","תחנה של אוטובוס","בית ספר שדה סגור","קראו שוב את המילים שבמקרא ליד הסימן.","חשבו מה עושים בלילה בטיול של כמה ימים.","המקרא מסביר כל סימן. חניון לילה הוא מקום שבו מטיילים לנים בלילה, לרוב באוהל."],"en":["On a hiking map there is a small tent symbol. In the legend, next to the tent, it says: night campsite. What is at this place?","A place to sleep outdoors","A shop that sells tents","A bus stop","A closed field school","Read again the words in the legend next to the symbol.","Think about what you do at night on a trip of several days.","The legend explains each symbol. A night campsite is a place where hikers sleep at night, usually in a tent."],"ru":["На туристической карте есть значок маленькой палатки. В легенде рядом с палаткой написано: ночная стоянка. Что находится в этом месте?","Место для ночлега на природе","Магазин, где продают палатки","Автобусная остановка","Закрытая полевая школа","Прочитайте ещё раз слова в легенде рядом со значком.","Подумайте, что делают ночью в походе на несколько дней.","Легенда объясняет каждый значок. Ночная стоянка: это место, где туристы ночуют, обычно в палатке."],"ar":["في خريطة رحلات توجد علامة خيمة صغيرة. في المفتاح مكتوب بجانب الخيمة: موقع مبيت. ماذا يوجد في هذا المكان؟","مكان للنوم في الطبيعة","محل يبيع الخيام","محطة حافلات","مدرسة ميدانية مغلقة","اقرؤوا مرة أخرى الكلمات التي في المفتاح بجانب العلامة.","فكروا ماذا نفعل في الليل في رحلة لعدة أيام.","المفتاح يشرح كل علامة. موقع المبيت مكان ينام فيه المتنزهون في الليل، غالبًا في خيمة."]}],
["maps",2,{"he":["מאיה רוצה ללכת לבית של חברה חדשה. יש לה מפה של השכונה. מה היא עושה קודם?","מוצאת במפה את שני הבתים","סופרת את כל הסימנים במקרא","קוראת רק את כותרת המפה","מחפשת במפה את קו המשווה","כדי לתכנן דרך צריך לדעת מאיפה יוצאים ולאן מגיעים.","רק אחר כך בוחרים באילו רחובות ללכת.","קודם מסמנים במפה את נקודת היציאה ואת היעד. אחר כך בוחרים דרך ביניהם."],"en":["Maya wants to walk to a new friend's house. She has a map of the neighborhood. What does she do first?","Finds both houses on the map","Counts all symbols in the legend","Reads only the map's title","Looks for the equator on the map","To plan a route, you need to know where you start and where you arrive.","Only after that do you choose which streets to walk on.","First you mark the starting point and the destination on the map. Then you choose a route between them."],"ru":["Майя хочет пойти домой к новой подруге. У неё есть карта района. Что она делает сначала?","Находит на карте оба дома","Считает все значки в легенде","Читает только название карты","Ищет на карте экватор","Чтобы спланировать путь, нужно знать, откуда выходишь и куда приходишь.","Только потом выбирают, по каким улицам идти.","Сначала отмечают на карте место выхода и цель. Потом выбирают путь между ними."],"ar":["تريد مايا أن تمشي إلى بيت صديقة جديدة. معها خريطة للحي. ماذا تفعل أولًا؟","تجد البيتين على الخريطة","تعد كل العلامات في المفتاح","تقرأ عنوان الخريطة فقط","تبحث عن خط الاستواء في الخريطة","لتخطيط طريق يجب أن نعرف من أين نخرج وإلى أين نصل.","فقط بعد ذلك نختار أي شوارع نمشي فيها.","أولًا نحدد على الخريطة نقطة الانطلاق والهدف. بعد ذلك نختار طريقًا بينهما."]}],
["maps",2,{"he":["בשושנת הרוחות יש כיוון שנמצא בדיוק באמצע, בין צפון לבין מזרח. איך קוראים לו?","צפון־מזרח","דרום־מזרח","צפון־מערב","דרום־מערב","השם של כיוון ביניים בנוי משני הכיוונים שלידו.","שם של כיוון ביניים תמיד מתחיל בצפון או בדרום.","בין צפון למזרח נמצא צפון־מזרח. כך גם דרום־מערב נמצא בין דרום למערב."],"en":["On the compass rose there is a direction exactly halfway between north and east. What is it called?","Northeast","Southeast","Northwest","Southwest","The name of an in-between direction is made of the two directions next to it.","The name of an in-between direction always starts with north or south.","Between north and east is northeast. In the same way, southwest is between south and west."],"ru":["На розе ветров есть направление ровно посередине между севером и востоком. Как оно называется?","Северо-восток","Юго-восток","Северо-запад","Юго-запад","Название промежуточного направления состоит из двух направлений рядом с ним.","Название промежуточного направления всегда начинается с севера или юга.","Между севером и востоком находится северо-восток. Так же юго-запад находится между югом и западом."],"ar":["في وردة الرياح يوجد اتجاه في المنتصف تمامًا بين الشمال والشرق. ما اسمه؟","الشمال الشرقي","الجنوب الشرقي","الشمال الغربي","الجنوب الغربي","اسم الاتجاه الفرعي مكون من الاتجاهين اللذين بجانبه.","اسم الاتجاه الفرعي يبدأ دائمًا بالشمال أو بالجنوب.","بين الشمال والشرق يقع الشمال الشرقي. وكذلك الجنوب الغربي يقع بين الجنوب والغرب."]}],
["maps",2,{"he":["יש שתי מפות בגודל של אותו דף. אחת של השכונה, ואחת של כל ישראל. באיזו מפה רואים את שמות הרחובות הקטנים?","במפה של השכונה","במפה של כל ישראל","בשתי המפות באותה מידה","באף אחת מהמפות","חשבו: על איזה דף צריך לדחוס שטח ענק, ועל איזה דף רק כמה רחובות?","ככל שהשטח במפה קטן יותר, יש יותר מקום לכל רחוב.","מפה של שטח קטן מראה הרבה פרטים, כמו רחובות. מפה של שטח גדול מראה רק דברים גדולים, כמו ערים."],"en":["There are 2 maps, each the size of the same page. One is of the neighborhood, and one is of all of Israel. On which map can you see the names of small streets?","On the neighborhood map","On the map of all of Israel","On both maps equally","On neither of the maps","Think: on which page do you need to squeeze a huge area, and on which only a few streets?","The smaller the area on the map, the more room there is for each street.","A map of a small area shows many details, like streets. A map of a large area shows only big things, like cities."],"ru":["Есть 2 карты размером с одну и ту же страницу. Одна карта района, а другая карта всего Израиля. На какой карте видны названия маленьких улиц?","На карте района","На карте всего Израиля","На обеих картах одинаково","Ни на одной из карт","Подумайте: на какой странице нужно уместить огромную территорию, а на какой только несколько улиц?","Чем меньше территория на карте, тем больше места для каждой улицы.","Карта маленькой территории показывает много деталей, например улицы. Карта большой территории показывает только крупные объекты, например города."],"ar":["هناك خريطتان بحجم الصفحة نفسها. واحدة للحي، وواحدة لكل إسرائيل. في أي خريطة نرى أسماء الشوارع الصغيرة؟","في خريطة الحي","في خريطة كل إسرائيل","في الخريطتين بالقدر نفسه","في ولا واحدة من الخريطتين","فكروا: في أي صفحة يجب ضغط مساحة ضخمة، وفي أي صفحة بضعة شوارع فقط؟","كلما كانت المساحة في الخريطة أصغر، يكون هناك مكان أكبر لكل شارع.","خريطة مساحة صغيرة تعرض تفاصيل كثيرة، مثل الشوارع. خريطة مساحة كبيرة تعرض الأشياء الكبيرة فقط، مثل المدن."]}],
["maps",3,{"he":["על המפה כתוב שסנטימטר אחד שווה עשרה קילומטרים במציאות. המרחק על המפה בין שתי ערים הוא שלושה סנטימטרים. מה המרחק במציאות?","שלושים קילומטרים","שלושה קילומטרים","עשרה קילומטרים","שלוש מאות קילומטרים","חשבו: כל סנטימטר אחד על הנייר שווה עשרה. כמה שוות שלוש פעמים סנטימטר?","כפל קטן: שלוש כפול עשר.","קנה המידה אומר שכל סנטימטר במפה שווה עשרה קילומטרים. שלושה סנטימטרים הם שלוש פעמים עשרה, כלומר שלושים."],"en":["The map says one centimeter equals ten kilometers in reality. The distance on the map between two cities is three centimeters. What is the distance in reality?","Thirty kilometers","Three kilometers","Ten kilometers","Three hundred kilometers","Think: every one centimeter on paper is worth ten. How much are three times a centimeter worth?","A small multiplication: three times ten.","The scale says every centimeter on the map equals ten kilometers. Three centimeters are three times ten, that is thirty."],"ru":["На карте написано, что один сантиметр равен десяти километрам в реальности. Расстояние на карте между двумя городами три сантиметра. Каково расстояние в реальности?","Тридцать километров","Три километра","Десять километров","Триста километров","Подумайте: каждый сантиметр на бумаге стоит десять. Сколько стоят три раза по сантиметру?","Маленькое умножение: трижды десять.","Масштаб говорит, что каждый сантиметр на карте равен десяти километрам. Три сантиметра это трижды десять, то есть тридцать."],"ar":["مكتوب على الخريطة أن سنتيمترًا واحدًا يساوي عشرة كيلومترات في الواقع. المسافة على الخريطة بين مدينتين هي ثلاثة سنتيمترات. ما المسافة في الواقع؟","ثلاثون كيلومترًا","ثلاثة كيلومترات","عشرة كيلومترات","ثلاثمئة كيلومتر","فكروا: كل سنتيمتر واحد على الورق يساوي عشرة. كم تساوي ثلاث مرات سنتيمتر؟","ضرب صغير: ثلاثة ضرب عشرة.","مقياس الرسم يقول إن كل سنتيمتر على الخريطة يساوي عشرة كيلومترات. ثلاثة سنتيمترات هي ثلاث مرات عشرة، أي ثلاثون."]}],
["maps",3,{"he":["קווי הרוחב על הגלובוס נמתחים ממזרח למערב. מה הם מודדים?","כמה רחוק אנחנו צפונה או דרומה מקו המשווה","כמה רחוק אנחנו מים המלח ומהכנרת","את מספר המדינות בעולם ובכל יבשת","את הגובה של ההרים בכל מדינה בעולם","קו הרוחב הכי מפורסם הוא קו המשווה. שאר הקווים מודדים מרחק ממנו. לאיזה כיוון?","חשבו על סרגל שמודד למעלה ולמטה על הגלובוס, ולא לצדדים.","קווי הרוחב מודדים כמה אנחנו צפונית או דרומית לקו המשווה. קווי האורך מודדים מזרחה ומערבה."],"en":["The lines of latitude on the globe stretch from east to west. What do they measure?","How far we are north or south of the equator","How far we are from the Dead Sea in Israel","The number of countries on each continent","The height of the mountains in every country","The most famous latitude line is the equator. The other lines measure distance from it. In which direction?","Think of a ruler that measures up and down on the globe, not sideways.","Lines of latitude measure how far we are north or south of the equator. Lines of longitude measure east and west."],"ru":["Линии широты на глобусе тянутся с востока на запад. Что они измеряют?","Как далеко мы к северу или к югу от экватора","Как далеко мы от Мёртвого моря в Израиле","Число стран в мире и на каждом материке","Высоту гор в каждой стране мира","Самая известная линия широты это экватор. Остальные линии измеряют расстояние от него. В каком направлении?","Подумайте о линейке, которая измеряет вверх и вниз на глобусе, а не в стороны.","Линии широты измеряют, как далеко мы к северу или к югу от экватора. Линии долготы измеряют к востоку и к западу."],"ar":["خطوط العرض على الكرة الأرضية تمتد من الشرق إلى الغرب. ماذا تقيس؟","كم نحن بعيدون شمالًا أو جنوبًا عن خط الاستواء","كم نحن بعيدون عن البحر الميت في البلاد","عدد دول العالم في كل قارة من القارات","ارتفاع الجبال في كل دولة في العالم","أشهر خط عرض هو خط الاستواء. باقي الخطوط تقيس المسافة منه. بأي اتجاه؟","فكروا في مسطرة تقيس إلى الأعلى والأسفل على الكرة، وليس إلى الجانبين.","خطوط العرض تقيس كم نحن شمال أو جنوب خط الاستواء. خطوط الطول تقيس شرقًا وغربًا."]}],
["maps",3,{"he":["למה על מפה משתמשים בסימנים קטנים במקום לצייר את הדברים האמיתיים?","כי אי אפשר לצייר עיר שלמה על דף אחד, והסימנים שומרים על מפה ברורה","כי ציירי מפות לא יודעים לצייר, ולכן הם מסתפקים בסימנים קטנים","כי ילדים אוהבים רק ציורים קטנים, וכל מפה נועדה רק לילדים","כי אסור לצייר בתים אמיתיים, והחוק מחייב לשים במקומם סימנים","דמיינו שמציירים את כל בתי העיר בגודל אמיתי על דף. מה יקרה לדף?","מה קורה כששמים אלף ציורים זה על זה בדף אחד? מה הסימנים הקטנים פותרים?","מפה מכווצת עולם גדול לדף קטן. סימנים קטנים ומוסכמים שומרים על סדר, והמקרא מסביר כל אחד מהם."],"en":["Why does a map use small symbols instead of drawing the real things?","Because you cannot draw a whole city on one page, and the symbols keep the map clear","Because map makers do not know how to draw, so they just use small signs","Because children only like small drawings, and every map is made just for children","Because it is forbidden to draw real houses, and the law says to use signs instead","Imagine drawing all the city's houses at real size on a page. What will happen to the page?","What happens when a thousand drawings are piled on one page? What do the small symbols solve?","A map shrinks a big world onto a small page. Small agreed symbols keep order, and the legend explains each one."],"ru":["Почему на карте используют маленькие знаки вместо того, чтобы рисовать настоящие вещи?","Потому что нельзя нарисовать целый город на одной странице, и знаки сохраняют карту понятной","Потому что картографы не умеют рисовать, и поэтому они просто ставят маленькие знаки","Потому что дети любят только маленькие рисунки, а все карты делают только для детей","Потому что запрещено рисовать настоящие дома, и закон велит ставить вместо них знаки","Представьте, что все дома города рисуют в настоящий размер на странице. Что будет со страницей?","Что происходит, когда тысячу рисунков кладут друг на друга на одной странице? Что решают маленькие знаки?","Карта сжимает большой мир на маленькой странице. Маленькие условные знаки сохраняют порядок, а легенда объясняет каждый из них."],"ar":["لماذا تستخدم الخريطة علامات صغيرة بدل رسم الأشياء الحقيقية؟","لأنه لا يمكن رسم مدينة كاملة على صفحة واحدة، والعلامات تحافظ على خريطة واضحة","لأن رسامي الخرائط لا يعرفون الرسم، لذلك يكتفون بعلامات صغيرة","لأن الأولاد يحبون فقط الرسومات الصغيرة، وكل خريطة تُصنع للأولاد فقط","لأنه يُمنع رسم بيوت حقيقية، والقانون يطلب وضع علامات مكانها","تخيلوا أننا نرسم كل بيوت المدينة بالحجم الحقيقي على صفحة. ماذا سيحدث للصفحة؟","ماذا يحدث عندما توضع ألف رسمة فوق بعضها على صفحة واحدة؟ ماذا تحل العلامات الصغيرة؟","الخريطة تضغط عالمًا كبيرًا على صفحة صغيرة. علامات صغيرة متفق عليها تحافظ على النظام، ومفتاح الخريطة يشرح كل واحدة منها."]}],
["maps",3,{"he":["בקנה המידה של מפה כתוב: סנטימטר 1 במפה הוא 5 קילומטרים במציאות. בין שני כפרים יש 20 קילומטרים. כמה סנטימטרים יהיו ביניהם במפה?","4 סנטימטרים","5 סנטימטרים","20 סנטימטרים","100 סנטימטרים","כאן הולכים הפוך: מהמציאות אל המפה.","כמה פעמים נכנס 5 בתוך 20?","כל 5 קילומטרים הם סנטימטר אחד במפה. ב־20 קילומטרים יש 4 פעמים 5, ולכן במפה יש 4 סנטימטרים."],"en":["The map scale says: 1 centimeter on the map is 5 kilometers in reality. Two villages are 20 kilometers apart. How many centimeters apart will they be on the map?","4 centimeters","5 centimeters","20 centimeters","100 centimeters","Here we go the other way: from reality to the map.","How many times does 5 fit into 20?","Every 5 kilometers are 1 centimeter on the map. 20 kilometers is 4 times 5, so on the map it is 4 centimeters."],"ru":["В масштабе карты написано: 1 сантиметр на карте это 5 километров в реальности. Между двумя деревнями 20 километров. Сколько сантиметров будет между ними на карте?","4 сантиметра","5 сантиметров","20 сантиметров","100 сантиметров","Здесь идём наоборот: от реальности к карте.","Сколько раз 5 помещается в 20?","Каждые 5 километров: это 1 сантиметр на карте. 20 километров: это 4 раза по 5, поэтому на карте 4 сантиметра."],"ar":["مكتوب في مقياس رسم خريطة: سنتيمتر 1 على الخريطة هو 5 كيلومترات في الواقع. بين قريتين 20 كيلومترًا. كم سنتيمترًا سيكون بينهما على الخريطة؟","4 سنتيمترات","5 سنتيمترات","20 سنتيمترًا","100 سنتيمتر","هنا نسير بالعكس: من الواقع إلى الخريطة.","كم مرة يدخل 5 في 20؟","كل 5 كيلومترات هي سنتيمتر واحد على الخريطة. 20 كيلومترًا هي 4 مرات 5، لذلك على الخريطة 4 سنتيمترات."]}],
["maps",3,{"he":["במפה, כל סנטימטר הוא קילומטר 1 במציאות. דרך א׳ ארוכה 3 סנטימטרים במפה, ודרך ב׳ ארוכה 5 סנטימטרים. בכמה דרך ב׳ ארוכה יותר במציאות?","ב־2 קילומטרים","ב־5 קילומטרים","ב־8 קילומטרים","ב־3 קילומטרים","קודם מצאו את ההפרש בין שתי הדרכים על המפה.","אחר כך הפכו את ההפרש מסנטימטרים לקילומטרים לפי קנה המידה.","ההפרש במפה הוא 5 פחות 3, כלומר 2 סנטימטרים. כל סנטימטר הוא קילומטר 1, ולכן ההפרש הוא 2 קילומטרים."],"en":["On the map, every centimeter is 1 kilometer in reality. Route A is 3 centimeters long on the map, and route B is 5 centimeters long. How much longer is route B in reality?","By 2 kilometers","By 5 kilometers","By 8 kilometers","By 3 kilometers","First find the difference between the two routes on the map.","Then change the difference from centimeters to kilometers using the scale.","The difference on the map is 5 minus 3, that is 2 centimeters. Each centimeter is 1 kilometer, so the difference is 2 kilometers."],"ru":["На карте каждый сантиметр: это 1 километр в реальности. Путь А на карте длиной 3 сантиметра, а путь Б длиной 5 сантиметров. На сколько путь Б длиннее в реальности?","На 2 километра","На 5 километров","На 8 километров","На 3 километра","Сначала найдите разницу между двумя путями на карте.","Потом переведите разницу из сантиметров в километры по масштабу.","Разница на карте: 5 минус 3, то есть 2 сантиметра. Каждый сантиметр: это 1 километр, поэтому разница 2 километра."],"ar":["على الخريطة كل سنتيمتر هو كيلومتر 1 في الواقع. الطريق أ طوله 3 سنتيمترات على الخريطة، والطريق ب طوله 5 سنتيمترات. بكم الطريق ب أطول في الواقع؟","بـ 2 كيلومتر","بـ 5 كيلومترات","بـ 8 كيلومترات","بـ 3 كيلومترات","أولًا جدوا الفرق بين الطريقين على الخريطة.","بعد ذلك حوِّلوا الفرق من سنتيمترات إلى كيلومترات حسب مقياس الرسم.","الفرق على الخريطة هو 5 ناقص 3، أي 2 سنتيمتر. كل سنتيمتر هو كيلومتر 1، لذلك الفرق 2 كيلومتر."]}],
["maps",3,{"he":["למה הגלובוס מראה את צורת היבשות נכון יותר ממפת עולם שטוחה?","כי הוא עגול כמו כדור הארץ","כי הוא תמיד חדש יותר","כי יש עליו יותר צבעים","כי הוא גדול יותר מכל מפה","נסו לעטוף כדור בדף נייר שטוח. מה קורה לדף?","כשמורחים צורה עגולה על דף, חלקים ממנה נמתחים.","לגלובוס ולכדור הארץ יש אותה צורה. במפה שטוחה חייבים למתוח חלקים, ולכן חלק מהיבשות נראות גדולות מדי."],"en":["Why does a globe show the shape of the continents more correctly than a flat world map?","Because it is round like the Earth","Because it is always newer","Because it has more colors","Because it is bigger than any map","Try to wrap a ball in a flat sheet of paper. What happens to the sheet?","When you spread a round shape onto a page, parts of it get stretched.","A globe and the Earth have the same shape. On a flat map some parts must be stretched, so some continents look too big."],"ru":["Почему глобус показывает форму материков точнее, чем плоская карта мира?","Потому что он круглый, как Земля","Потому что он всегда новее","Потому что на нём больше цветов","Потому что он больше любой карты","Попробуйте завернуть мяч в плоский лист бумаги. Что происходит с листом?","Когда круглую форму раскладывают на странице, части её растягиваются.","У глобуса и у Земли одинаковая форма. На плоской карте приходится растягивать части, поэтому некоторые материки выглядят слишком большими."],"ar":["لماذا يعرض مجسم الكرة الأرضية شكل القارات بدقة أكبر من خريطة العالم المسطحة؟","لأنه مستدير مثل الأرض","لأنه دائمًا أحدث","لأن عليه ألوانًا أكثر","لأنه أكبر من أي خريطة","حاولوا لف كرة بورقة مسطحة. ماذا يحدث للورقة؟","عندما نفرد شكلًا مستديرًا على صفحة، تتمدد أجزاء منه.","للمجسم وللأرض الشكل نفسه. في الخريطة المسطحة يجب مد أجزاء، لذلك تبدو بعض القارات كبيرة جدًا."]}],
["maps",3,{"he":["משפחה יוצאת לטיול של יום במדבר. למה כדאי לקחת גם מפה מנייר, ולא רק טלפון?","כי במדבר אין תמיד קליטה","כי בטלפון אין מפות של מדבר","כי מפה מנייר מראה גם מזג אוויר","כי בטיול אסור להשתמש בטלפון","חשבו מה טלפון צריך כדי להראות מפה, ומה מפה מנייר לא צריכה.","מה יכול לקרות לטלפון אחרי יום שלם בשטח רחוק מעיר?","טלפון צריך קליטה וסוללה, ובמדבר הם יכולים להיגמר. מפה מנייר עובדת תמיד."],"en":["A family goes on a day trip in the desert. Why should they also take a paper map, and not only a phone?","Because the desert may have no signal","Because phones have no desert maps","Because a paper map also shows weather","Because phones are not allowed on trips","Think about what a phone needs to show a map, and what a paper map does not need.","What can happen to a phone after a whole day far from a city?","A phone needs reception and battery, and in the desert they can run out. A paper map always works."],"ru":["Семья едет на однодневную прогулку в пустыню. Почему стоит взять и бумажную карту, а не только телефон?","Потому что в пустыне не всегда есть связь","Потому что в телефоне нет карт пустыни","Потому что бумажная карта показывает и погоду","Потому что в походе нельзя пользоваться телефоном","Подумайте, что нужно телефону, чтобы показать карту, и что не нужно бумажной карте.","Что может случиться с телефоном после целого дня вдали от города?","Телефону нужны связь и батарея, а в пустыне они могут закончиться. Бумажная карта работает всегда."],"ar":["عائلة تخرج في رحلة ليوم واحد في الصحراء. لماذا يُفضَّل أن تأخذ أيضًا خريطة ورقية، وليس هاتفًا فقط؟","لأنه لا توجد تغطية دائمًا في الصحراء","لأن الهاتف ليس فيه خرائط للصحراء","لأن الخريطة الورقية تعرض الطقس أيضًا","لأنه ممنوع استعمال الهاتف في الرحلة","فكروا ماذا يحتاج الهاتف ليعرض خريطة، وماذا لا تحتاج الخريطة الورقية.","ماذا يمكن أن يحدث للهاتف بعد يوم كامل بعيدًا عن المدينة؟","الهاتف يحتاج إلى تغطية وبطارية، وفي الصحراء قد تنفدان. الخريطة الورقية تعمل دائمًا."]}],
["maps",3,{"he":["במפת טיולים יש קווי גובה. כל קו מחבר מקומות באותו גובה. במקום אחד הקווים צפופים מאוד. מה יש שם?","מדרון תלול מאוד","שטח שטוח לגמרי","אגם גדול ועמוק","כביש רחב וישר","קווים צפופים אומרים שהגובה משתנה הרבה בדרך קצרה.","דמיינו שאתם הולכים שם. האם קל או קשה לטפס?","כשקווי הגובה קרובים זה לזה, הגובה עולה מהר. זה אומר שהשטח שם תלול."],"en":["A hiking map has contour lines. Each line connects places at the same height. In one place the lines are very close together. What is there?","A very steep slope","Completely flat land","A big deep lake","A wide straight road","Lines close together mean the height changes a lot over a short way.","Imagine you are walking there. Is it easy or hard to climb?","When contour lines are close to each other, the height rises fast. This means the land there is steep."],"ru":["На туристической карте есть горизонтали. Каждая линия соединяет места на одной высоте. В одном месте линии очень близко друг к другу. Что там?","Очень крутой склон","Совсем ровная местность","Большое глубокое озеро","Широкая прямая дорога","Частые линии значат, что высота сильно меняется на коротком пути.","Представьте, что вы идёте там. Легко или трудно подниматься?","Когда горизонтали близко друг к другу, высота растёт быстро. Значит, местность там крутая."],"ar":["في خريطة رحلات توجد خطوط كنتور. كل خط يصل بين أماكن على الارتفاع نفسه. في مكان واحد الخطوط متقاربة جدًا. ماذا يوجد هناك؟","منحدر شديد جدًا","أرض مستوية تمامًا","بحيرة كبيرة وعميقة","شارع عريض ومستقيم","الخطوط المتقاربة تعني أن الارتفاع يتغير كثيرًا في مسافة قصيرة.","تخيلوا أنكم تمشون هناك. هل الصعود سهل أم صعب؟","عندما تكون خطوط الكنتور قريبة من بعضها، يرتفع المكان بسرعة. هذا يعني أن الأرض هناك شديدة الانحدار."]}],
["maps",3,{"he":["למה במפה של כל ישראל לא רואים את הרחוב שלכם?","כי השטח גדול, ואין מקום לפרטים קטנים","כי הרחוב שלכם חדש מדי בשביל מפות","כי רחובות מופיעים רק על גלובוס","כי אסור לצייר רחובות במפה של מדינה","חשבו כמה פעמים צריך להקטין את כל הארץ כדי שתיכנס לדף אחד.","מה קורה לדבר צר, כמו רחוב, כשמקטינים אותו מאוד?","מפה של מדינה מקטינה שטח ענק לדף אחד. דברים קטנים כמו רחובות נעלמים, ונשארות רק ערים וכבישים ראשיים."],"en":["Why can't you see your street on a map of all of Israel?","The area is big, with no room for small details","Your street is too new for maps","Streets appear only on a globe","Drawing streets on a country map is forbidden","Think how many times you must shrink the whole country so it fits on one page.","What happens to something narrow, like a street, when you shrink it a lot?","A country map shrinks a huge area onto one page. Small things like streets disappear, and only cities and main roads remain."],"ru":["Почему на карте всего Израиля не видно вашей улицы?","Территория большая, и нет места для мелочей","Ваша улица слишком новая для карт","Улицы бывают только на глобусе","Рисовать улицы на карте страны запрещено","Подумайте, во сколько раз нужно уменьшить всю страну, чтобы она поместилась на одной странице.","Что происходит с чем-то узким, например с улицей, когда его сильно уменьшают?","Карта страны уменьшает огромную территорию до одной страницы. Мелкие объекты, такие как улицы, исчезают, и остаются только города и главные дороги."],"ar":["لماذا لا نرى شارعكم على خريطة كل إسرائيل؟","لأن المساحة كبيرة، ولا مكان للتفاصيل الصغيرة","لأن شارعكم جديد جدًا على الخرائط","لأن الشوارع تظهر فقط على المجسم","لأنه ممنوع رسم الشوارع في خريطة دولة","فكروا كم مرة يجب تصغير البلاد كلها لكي تدخل في صفحة واحدة.","ماذا يحدث لشيء ضيق، مثل الشارع، عندما نصغره كثيرًا؟","خريطة الدولة تصغر مساحة ضخمة إلى صفحة واحدة. الأشياء الصغيرة مثل الشوارع تختفي، وتبقى فقط المدن والطرق الرئيسية."]}],
["maps",3,{"he":["אתם עומדים בחוף של תל אביב, והפנים שלכם אל הים, כלומר מערבה. לאיזה צד שלכם נמצא הצפון?","לימין","לשמאל","מאחוריכם","ממש מולכם","ציירו שושנת רוחות וסובבו אותה כך שהמערב יהיה מולכם.","המזרח נמצא מאחוריכם. עכשיו בדקו איפה שני הכיוונים האחרים.","כשהפנים למערב, המזרח מאחור. הצפון בצד ימין, והדרום בצד שמאל."],"en":["You stand on the beach in Tel Aviv, facing the sea, that is, facing west. On which side of you is north?","On your right","On your left","Behind you","Straight ahead","Draw a compass rose and turn it so that west is in front of you.","East is behind you. Now check where the 2 other directions are.","When you face west, east is behind you. North is on the right side, and south is on the left side."],"ru":["Вы стоите на пляже в Тель-Авиве лицом к морю, то есть на запад. С какой стороны от вас север?","Справа","Слева","Позади вас","Прямо перед вами","Нарисуйте розу ветров и поверните её так, чтобы запад был перед вами.","Восток у вас за спиной. Теперь проверьте, где 2 других направления.","Когда вы смотрите на запад, восток сзади. Север с правой стороны, а юг с левой."],"ar":["أنتم تقفون على شاطئ تل أبيب ووجوهكم نحو البحر، أي نحو الغرب. في أي جهة منكم يقع الشمال؟","على اليمين","على اليسار","خلفكم","أمامكم تمامًا","ارسموا وردة الرياح وأديروها بحيث يكون الغرب أمامكم.","الشرق خلفكم. الآن افحصوا أين الاتجاهان الآخران.","عندما تنظرون نحو الغرب، يكون الشرق خلفكم. الشمال في الجهة اليمنى، والجنوب في الجهة اليسرى."]}],
["maps",3,{"he":["בתצלום לוויין רואים את העיר, אבל לא רואים את שמות הרחובות. במפה הם כתובים. למה?","כי שמות לא רואים מהשמיים","כי המצלמה בלוויין מקולקלת","כי הלוויין עף מהר מדי","כי שמות הרחובות כתובים רק בלילה","האם על הכביש עצמו כתוב בגדול השם של הרחוב?","חשבו מה ההבדל בין צילום של מה שיש לבין ציור שאדם הכין.","תצלום מראה רק מה שיש בשטח באמת. מפה מכינים אנשים, והם מוסיפים לה שמות, סימנים ומקרא."],"en":["In a satellite image you see the city, but not the street names. On a map they are written. Why?","Names can't be seen from the sky","The satellite camera is broken","The satellite flies too fast","Street names are written only at night","Is the name of the street written in big letters on the road itself?","Think about the difference between a photo of what is there and a drawing a person made.","A photo shows only what is really on the ground. People make maps, and they add names, symbols and a legend."],"ru":["На спутниковом снимке виден город, но не видны названия улиц. На карте они написаны. Почему?","Названия не видны с неба","Камера на спутнике сломана","Спутник летит слишком быстро","Названия улиц пишут только ночью","Написано ли на самой дороге крупными буквами название улицы?","Подумайте о разнице между фотографией того, что есть, и рисунком, который сделал человек.","Фотография показывает только то, что действительно есть на земле. Карты делают люди, и они добавляют названия, значки и легенду."],"ar":["في صورة القمر الصناعي نرى المدينة، لكن لا نرى أسماء الشوارع. في الخريطة هي مكتوبة. لماذا؟","لأن الأسماء لا تُرى من السماء","لأن كاميرا القمر الصناعي معطلة","لأن القمر الصناعي يطير بسرعة كبيرة","لأن أسماء الشوارع تُكتب في الليل فقط","هل اسم الشارع مكتوب بخط كبير على الشارع نفسه؟","فكروا في الفرق بين صورة لما هو موجود وبين رسم صنعه إنسان.","الصورة تعرض فقط ما هو موجود حقًا على الأرض. الخرائط يصنعها الناس، وهم يضيفون إليها أسماء وعلامات ومفتاحًا."]}],
["maps",3,{"he":["סבתא מצאה מפה של ישראל משנת 1950. למה היא לא תעזור לנו לנסוע היום?","כי מאז נבנו ערים וכבישים חדשים","כי הצבעים במפה ישנה תמיד שגויים","כי פעם הצפון היה בצד אחר","כי מאז ההרים זזו למקום אחר","חשבו מה השתנה בארץ מאז שסבתא הייתה ילדה.","אילו דברים בונים אנשים כל הזמן, ואילו דברים בטבע כמעט לא משתנים?","המפה מראה את המקום כפי שהיה כשהכינו אותה. מאז נוספו יישובים וכבישים, ולכן צריך מפה מעודכנת."],"en":["Grandma found a map of Israel from 1950. Why won't it help us travel today?","New cities and roads were built since then","Colors on old maps are always wrong","Long ago north was on a different side","The mountains have moved since then","Think about what changed in the country since Grandma was a child.","Which things do people build all the time, and which things in nature hardly change?","A map shows the place as it was when it was made. Since then towns and roads were added, so we need an updated map."],"ru":["Бабушка нашла карту Израиля 1950 года. Почему она не поможет нам ездить сегодня?","С тех пор построили новые города и дороги","Цвета на старой карте всегда неверные","Раньше север был с другой стороны","С тех пор горы сдвинулись в другое место","Подумайте, что изменилось в стране с тех пор, как бабушка была ребёнком.","Что люди строят всё время, а что в природе почти не меняется?","Карта показывает место таким, каким оно было, когда её сделали. С тех пор появились поселения и дороги, поэтому нужна новая карта."],"ar":["وجدت الجدة خريطة لإسرائيل من سنة 1950. لماذا لن تساعدنا على السفر اليوم؟","لأنه بُنيت منذ ذلك الحين مدن وطرق جديدة","لأن الألوان في الخريطة القديمة خاطئة دائمًا","لأن الشمال كان في الماضي في جهة أخرى","لأن الجبال انتقلت منذ ذلك الحين إلى مكان آخر","فكروا ماذا تغير في البلاد منذ أن كانت الجدة طفلة.","أي أشياء يبنيها الناس طوال الوقت، وأي أشياء في الطبيعة لا تكاد تتغير؟","الخريطة تعرض المكان كما كان عندما صُنعت. منذ ذلك الحين أضيفت بلدات وطرق، لذلك نحتاج خريطة محدثة."]}],
["maps",3,{"he":["בישראל, בשעה 12 בצהריים, השמש נמצאת בדרום. לאיזה כיוון יפנה הצל שלכם?","לצפון","לדרום","למזרח","למערב","הצל תמיד נופל בצד שרחוק מהשמש.","עמדו כשהגב שלכם אל השמש. לאן אתם מסתכלים עכשיו?","הצל נופל בצד ההפוך מהשמש. השמש בדרום, ולכן הצל מצביע לצפון. כך אפשר למצוא כיוון בלי מצפן."],"en":["In Israel, at 12 noon, the sun is in the south. Which way will your shadow point?","To the north","To the south","To the east","To the west","A shadow always falls on the side away from the sun.","Stand with your back to the sun. Where are you looking now?","A shadow falls on the side opposite the sun. The sun is in the south, so the shadow points north. This way you can find a direction without a compass."],"ru":["В Израиле в 12 часов дня солнце находится на юге. Куда будет указывать ваша тень?","На север","На юг","На восток","На запад","Тень всегда падает на сторону, дальнюю от солнца.","Встаньте спиной к солнцу. Куда вы смотрите теперь?","Тень падает на сторону, противоположную солнцу. Солнце на юге, поэтому тень указывает на север. Так можно найти направление без компаса."],"ar":["في إسرائيل، في الساعة 12 ظهرًا، تكون الشمس في الجنوب. إلى أي اتجاه سيشير ظلكم؟","إلى الشمال","إلى الجنوب","إلى الشرق","إلى الغرب","الظل يقع دائمًا في الجهة البعيدة عن الشمس.","قفوا وظهركم إلى الشمس. إلى أين تنظرون الآن؟","الظل يقع في الجهة المعاكسة للشمس. الشمس في الجنوب، لذلك يشير الظل إلى الشمال. هكذا يمكن إيجاد الاتجاه بدون بوصلة."]}],
["med",1,{"he":["איזה ים גדול נמצא מערבית לישראל, ואליו יוצאים לרחוץ בקיץ?","הים התיכון","ים המלח","הכנרת","הים האדום","חשבו על מפת ישראל: איזה גוף מים גדול נמצא בצד מערב, ליד תל אביב?","ים המלח והכנרת נמצאים במזרח הארץ. איפה נשאר לחפש?","הים התיכון גובל בישראל ממערב. ערים גדולות כמו תל אביב וחיפה יושבות על חופו."],"en":["Which big sea lies west of Israel, where people go swimming in summer?","The Mediterranean Sea","The Dead Sea","The Sea of Galilee","The Red Sea","Think about the map of Israel: which big body of water is on the western side, next to Tel Aviv?","The Dead Sea and the Sea of Galilee are in the east of the country. Where is left to look?","The Mediterranean Sea borders Israel on the west. Big cities like Tel Aviv and Haifa sit on its shore."],"ru":["Какое большое море находится к западу от Израиля, и в нём купаются летом?","Средиземное море","Мёртвое море","Кинерет","Красное море","Подумайте о карте Израиля: какой большой водоём находится на западной стороне, рядом с Тель-Авивом?","Мёртвое море и Кинерет находятся на востоке страны. Где осталось искать?","Средиземное море граничит с Израилем на западе. Большие города вроде Тель-Авива и Хайфы стоят на его берегу."],"ar":["أي بحر كبير يقع غرب إسرائيل، ويخرج الناس للسباحة فيه صيفًا؟","البحر المتوسط","البحر الميت","بحيرة طبريا","البحر الأحمر","فكروا في خريطة إسرائيل: أي مسطح مائي كبير يقع في الجهة الغربية، بجانب تل أبيب؟","البحر الميت وبحيرة طبريا في شرق البلاد. أين يبقى البحث؟","البحر المتوسط يحد إسرائيل غربًا. مدن كبيرة مثل تل أبيب وحيفا تقع على شاطئه."]}],
["med",1,{"he":["איך נראה הקיץ בארצות הים התיכון, גם בישראל?","חם ויבש, כמעט בלי גשם","קר ומושלג רוב הזמן","גשום כל יום","חם וגשום ביחד כל בוקר","זכרו קיץ אחד בישראל: כמה פעמים ירד גשם ביולי ובאוגוסט?","חשבו על חופשת הקיץ: שמש, חום וים. איפה הגשם נכנס לתמונה?","באקלים הים תיכוני הקיץ חם ויבש. הגשמים מחכים לחורף."],"en":["What does summer look like in the Mediterranean lands, including Israel?","Hot and dry, almost no rain","Cold and snowy most of the time","Rainy every day","Hot and rainy together every morning","Remember one summer in Israel: how many times did it rain in July and August?","Think about summer vacation: sun, heat and the sea. Where does rain fit into the picture?","In the Mediterranean climate summer is hot and dry. The rains wait for winter."],"ru":["Как выглядит лето в странах Средиземноморья, в том числе в Израиле?","Жаркое и сухое, почти без дождя","Холодное и снежное большую часть времени","Дождливое каждый день","Жаркое и дождливое вместе каждое утро","Вспомните одно лето в Израиле: сколько раз шёл дождь в июле и августе?","Подумайте о летних каникулах: солнце, жара и море. Куда дождь входит в картину?","В средиземноморском климате лето жаркое и сухое. Дожди ждут зимы."],"ar":["كيف يبدو الصيف في بلدان البحر المتوسط، ومنها إسرائيل؟","حار وجاف، تقريبًا بلا مطر","بارد ومثلج معظم الوقت","ممطر كل يوم","حار وممطر معًا كل صباح","تذكروا صيفًا واحدًا في إسرائيل: كم مرة نزل المطر في يوليو وأغسطس؟","فكروا في العطلة الصيفية: شمس وحر وبحر. أين يدخل المطر في الصورة؟","في المناخ المتوسطي الصيف حار وجاف. الأمطار تنتظر الشتاء."]}],
["med",1,{"he":["מה מיוחד בחורף הים תיכוני?","הוא מתון וגשום, לא קפוא","הוא החורף הקר ביותר בעולם","בחורף יורד שלג כל יום","אין בו גשם בכלל","השוו לחורף במקומות קרים מאוד: האם אצלנו הכול קופא?","חשבו על חורף בישראל: יש גשמים, אבל לא צריך את המעיל הכי עבה בארון.","החורף הים תיכוני מתון: קריר וגשום אבל בלי קור קיצוני. לכן אפשר לגדל פירות כמעט כל השנה."],"en":["What is special about the Mediterranean winter?","It is mild and rainy, not freezing","It is the coldest winter in the world","In winter it snows every day","It has no rain at all","Compare it with winter in very cold places: does everything freeze here?","Think about winter in Israel: there are rains, but you do not need the thickest coat in the closet.","The Mediterranean winter is mild: cool and rainy but without extreme cold. That is why fruit can grow almost all year."],"ru":["Что особенного в средиземноморской зиме?","Она мягкая и дождливая, не ледяная","Это самая холодная зима в мире","Зимой снег идёт каждый день","В ней вообще нет дождя","Сравните с зимой в очень холодных местах: у нас всё замерзает?","Подумайте о зиме в Израиле: есть дожди, но не нужно самое толстое пальто из шкафа.","Средиземноморская зима мягкая: прохладная и дождливая, но без сильного мороза. Поэтому фрукты можно выращивать почти весь год."],"ar":["ما المميز في الشتاء المتوسطي؟","هو معتدل وممطر، ليس متجمدًا","هو أبرد شتاء في العالم","في الشتاء تتساقط الثلوج كل يوم","لا مطر فيه إطلاقًا","قارنوه بالشتاء في أماكن شديدة البرودة: هل كل شيء يتجمد عندنا؟","فكروا في الشتاء في إسرائيل: توجد أمطار، لكن لا حاجة لأسمك معطف في الخزانة.","الشتاء المتوسطي معتدل: بارد وممطر لكن بلا برد شديد. لذلك يمكن زراعة الفواكه معظم السنة."]}],
["med",1,{"he":["איזה עץ הוא סמל של אגן הים התיכון, ועושים מן הפירות שלו שמן?","הזית","הדקל","האלון","האקליפטוס","חשבו על שמן שמטגנים בו ומדליקים איתו נרות בחג החנוכה.","אותו שמן נמצא גם בסלט וגם בסיפור על הנס של המנורה.","עץ הזית אוהב את האקלים הים תיכוני: הרבה שמש ומעט גשם בקיץ. מן הפירות שלו מפיקים שמן זית."],"en":["Which tree is a symbol of the Mediterranean basin, and oil is made from its fruits?","The olive","The date palm","The oak","The eucalyptus","Think about an oil used for frying and for lighting candles on Hanukkah.","The same oil is in the salad and in the story of the menorah miracle.","The olive tree loves the Mediterranean climate: lots of sun and little summer rain. Olive oil is made from its fruits."],"ru":["Какое дерево является символом Средиземноморья, и из его плодов делают масло?","Маслина","Финиковая пальма","Дуб","Эвкалипт","Подумайте о масле, на котором жарят и которым зажигают свечи на Хануку.","То же масло есть и в салате, и в рассказе о чуде меноры.","Оливковое дерево любит средиземноморский климат: много солнца и мало летнего дождя. Из его плодов получают оливковое масло."],"ar":["أي شجرة هي رمز لحوض البحر المتوسط، ويُصنع من ثمارها الزيت؟","الزيتون","النخيل","البلوط","الكينا","فكروا في زيت يُقلى به وتُشعل به الشموع في عيد الحانوكا.","الزيت نفسه موجود في السلطة وفي قصة معجزة الشمعدان.","شجرة الزيتون تحب المناخ المتوسطي: كثير من الشمس وقليل من مطر الصيف. من ثمارها يُستخرج زيت الزيتون."]}],
["med",1,{"he":["למה הרבה ערים עתיקות קמו ליד חוף הים התיכון?","כי הים נתן דגים, מסחר בספינות ודרך לנסוע בין עמים","כי שם היו הכי הרבה הרים גבוהים לבנות עליהם בתים","כי אסור היה לבנות בתוך הארץ, רק על שפת הים","כי ליד הים תמיד קר וקריר, גם באמצע הקיץ החם","חשבו מה הים נותן לאנשים: אוכל מהמים, ודרך להפליג למקומות אחרים.","בעולם העתיק לא היו משאיות ומטוסים. איך הובילו סחורות בין ערים?","הים היה כביש של ספינות: הוא נתן דגים לאוכל ודרך לסחור ולהיפגש עם עמים אחרים. לכן פרחו ערי נמל."],"en":["Why did many ancient cities rise near the Mediterranean shore?","Because the sea gave fish, trade by ships and a way to travel between peoples","Because there were the most high mountains there to build houses on","Because it was forbidden to build inland, only on the seashore","Because near the sea it is always cold and chilly, even in hot summer","Think about what the sea gives people: food from the water, and a way to sail to other places.","In the ancient world there were no trucks and no planes. How were goods carried between cities?","The sea was a road for ships: it gave fish for food and a way to trade and meet other peoples. That is why port cities bloomed."],"ru":["Почему многие древние города возникли у берега Средиземного моря?","Потому что море давало рыбу, торговлю на кораблях и путь путешествовать между народами","Потому что там было больше всего высоких гор, на которых строили дома","Потому что строить внутри страны было запрещено, только на берегу моря","Потому что у моря всегда холодно и прохладно, даже в самый жаркий летний день","Подумайте, что море даёт людям: еду из воды и путь уплыть в другие места.","В древнем мире не было грузовиков и самолётов. Как перевозили товары между городами?","Море было дорогой для кораблей: оно давало рыбу в еду и путь торговать и встречаться с другими народами. Поэтому расцветали портовые города."],"ar":["لماذا قامت مدن قديمة كثيرة قرب شاطئ البحر المتوسط؟","لأن البحر أعطى سمكًا وتجارة بالسفن وطريقًا للسفر بين الشعوب","لأن هناك كانت أكثر الجبال العالية لبناء البيوت عليها","لأنه كان ممنوعًا البناء داخل البلاد، فقط على شاطئ البحر","لأن قرب البحر الجو بارد دائمًا، حتى في الصيف الحار","فكروا ماذا يعطي البحر للناس: طعامًا من الماء، وطريقًا للإبحار إلى أماكن أخرى.","في العالم القديم لم تكن شاحنات ولا طائرات. كيف كانت تُنقل البضائع بين المدن؟","كان البحر طريقًا للسفن: أعطى سمكًا للطعام وطريقًا للتجارة ولقاء شعوب أخرى. لذلك ازدهرت مدن الموانئ."]}],
["med",1,{"he":["איזו עיר ישראלית גדולה היא עיר נמל חשובה על הים התיכון, וגם יושבת על הר הכרמל?","חיפה","באר שבע","ירושלים","אילת","חפשו על המפה עיר גדולה בצפון, על החוף, ליד הר ירוק.","אילת נמצאת על ים אחר, ובאר שבע במדבר. איזו עיר נשארה על הים התיכון?","חיפה היא עיר הנמל הגדולה של צפון הארץ. הנמל שלה על הים התיכון, והשכונות מטפסות על הר הכרמל."],"en":["Which big Israeli city is an important port on the Mediterranean, and also sits on Mount Carmel?","Haifa","Be'er Sheva","Jerusalem","Eilat","Look on the map for a big city in the north, on the shore, next to a green mountain.","Eilat is on a different sea, and Be'er Sheva is in the desert. Which city is left on the Mediterranean?","Haifa is the big port city of the north. Its port is on the Mediterranean, and its neighborhoods climb Mount Carmel."],"ru":["Какой большой израильский город является важным портом на Средиземном море и также стоит на горе Кармель?","Хайфа","Беэр-Шева","Иерусалим","Эйлат","Поищите на карте большой город на севере, на берегу, рядом с зелёной горой.","Эйлат находится на другом море, а Беэр-Шева в пустыне. Какой город остался на Средиземном море?","Хайфа это большой портовый город севера страны. Её порт на Средиземном море, а кварталы поднимаются на гору Кармель."],"ar":["أي مدينة إسرائيلية كبيرة هي ميناء مهم على البحر المتوسط، وتقع أيضًا على جبل الكرمل؟","حيفا","بئر السبع","القدس","إيلات","ابحثوا على الخريطة عن مدينة كبيرة في الشمال، على الشاطئ، بجانب جبل أخضر.","إيلات على بحر آخر، وبئر السبع في الصحراء. أي مدينة بقيت على البحر المتوسط؟","حيفا هي مدينة الميناء الكبيرة في شمال البلاد. ميناؤها على البحر المتوسط، وأحياؤها تصعد على جبل الكرمل."]}],
["med",1,{"he":["מה האקלים הים תיכוני נותן לאנשים החיים בו?","אפשרות לגדל פירות וירקות כמעט כל השנה ולדוג בים","שלג לכל המשפחה בכל חורף, ומזחלות על ההרים","קרח על הנהרות בכל בוקר, ואפשר להחליק עליו","זהב שצף על פני הים, ואפשר לאסוף אותו בסירות","חשבו אילו דברים טובים מקבלים משמש רבה, מחורף מתון ומים קרוב.","מה אפשר לעשות בחוץ כמעט כל ימות השנה כשאין קור קיצוני?","אקלים נוח הוא משאב: שמש רבה וחורף מתון מאפשרים חקלאות כמעט כל השנה, והים הקרוב נותן דגים ונמלים."],"en":["What does the Mediterranean climate give the people living in it?","The chance to grow fruits and vegetables almost all year and to fish in the sea","Snow for the whole family every winter, and sledding down the mountains","Ice on the rivers every single morning, so people can skate on it","Gold floating on the sea, which people can collect in their boats","Think about what good things come from lots of sun, a mild winter and a nearby sea.","What can you do outside almost every day of the year when there is no extreme cold?","A comfortable climate is a resource: lots of sun and a mild winter allow farming almost all year, and the nearby sea gives fish and ports."],"ru":["Что средиземноморский климат даёт людям, живущим в нём?","Возможность выращивать фрукты и овощи почти весь год и ловить рыбу в море","Снег для всей семьи каждую зиму и катание на санках с высоких гор","Лёд на реках каждое утро, по которому можно кататься на коньках","Золото, плавающее по морю, которое люди собирают со своих лодок","Подумайте, какие хорошие вещи получают от большого количества солнца, мягкой зимы и близкого моря.","Что можно делать на улице почти каждый день года, когда нет сильного холода?","Удобный климат это ресурс: много солнца и мягкая зима позволяют заниматься сельским хозяйством почти весь год, а близкое море даёт рыбу и порты."],"ar":["ماذا يعطي المناخ المتوسطي للناس الذين يعيشون فيه؟","إمكانية زراعة الفواكه والخضروات معظم السنة وصيد السمك في البحر","ثلج لكل العائلة في كل شتاء، والتزلج على الجبال العالية","جليد على الأنهار في كل صباح، ويمكن التزحلق عليه بسهولة","ذهب يطفو على وجه البحر، ويجمعه الناس بقواربهم كل يوم","فكروا أي أشياء جيدة نحصل عليها من شمس كثيرة وشتاء معتدل وبحر قريب.","ماذا يمكن فعله في الخارج تقريبًا كل أيام السنة عندما لا يوجد برد شديد؟","المناخ المريح هو مورد: شمس كثيرة وشتاء معتدل يسمحان بالزراعة معظم السنة، والبحر القريب يعطي سمكًا وموانئ."]}],
["med",1,{"he":["איזו יבשת נמצאת מדרום לים התיכון?","אפריקה","אירופה","אוסטרליה","אמריקה הדרומית","דמיינו את המפה: מצרים ולוב נמצאות על החוף הזה.","צפונה לים יש את איטליה ויוון. מה יש בצד השני?","מדרום לים התיכון נמצאת אפריקה. מצפון נמצאת אירופה, וממזרח אסיה."],"en":["Which continent lies south of the Mediterranean Sea?","Africa","Europe","Australia","South America","Picture the map: Egypt and Libya are on this shore.","Italy and Greece are north of the sea. What is on the other side?","Africa lies south of the Mediterranean. Europe is to the north, and Asia is to the east."],"ru":["Какой материк находится к югу от Средиземного моря?","Африка","Европа","Австралия","Южная Америка","Представьте карту: Египет и Ливия лежат на этом берегу.","К северу от моря находятся Италия и Греция. А что на другой стороне?","К югу от Средиземного моря лежит Африка. На севере находится Европа, а на востоке Азия."],"ar":["أي قارة تقع جنوب البحر المتوسط؟","أفريقيا","أوروبا","أستراليا","أمريكا الجنوبية","تخيلوا الخريطة: مصر وليبيا تقعان على هذا الشاطئ.","شمال البحر توجد إيطاليا واليونان. ماذا يوجد في الجهة الأخرى؟","تقع أفريقيا جنوب البحر المتوسط. وتقع أوروبا في الشمال، وآسيا في الشرق."]}],
["med",1,{"he":["איך נקרא המעבר הצר בין הים התיכון לאוקיינוס האטלנטי?","מצר גיברלטר","תעלת סואץ","מצר הבוספורוס","תעלת פנמה","חפשו בקצה המערבי של הים, בין ספרד למרוקו.","המעבר הזה טבעי. אנשים לא חפרו אותו.","מצר גיברלטר נמצא בין ספרד למרוקו. דרכו ספינות יוצאות מהים התיכון אל האוקיינוס האטלנטי."],"en":["What is the narrow passage between the Mediterranean Sea and the Atlantic Ocean called?","The Strait of Gibraltar","The Suez Canal","The Bosphorus Strait","The Panama Canal","Look at the western end of the sea, between Spain and Morocco.","This passage is natural. People did not dig it.","The Strait of Gibraltar lies between Spain and Morocco. Ships pass through it from the Mediterranean to the Atlantic Ocean."],"ru":["Как называется узкий проход между Средиземным морем и Атлантическим океаном?","Гибралтарский пролив","Суэцкий канал","Пролив Босфор","Панамский канал","Ищите на западном краю моря, между Испанией и Марокко.","Этот проход природный. Люди его не копали.","Гибралтарский пролив находится между Испанией и Марокко. Через него корабли выходят из Средиземного моря в Атлантический океан."],"ar":["ما اسم الممر الضيق بين البحر المتوسط والمحيط الأطلسي؟","مضيق جبل طارق","قناة السويس","مضيق البوسفور","قناة بنما","ابحثوا في الطرف الغربي للبحر، بين إسبانيا والمغرب.","هذا الممر طبيعي. الناس لم يحفروه.","يقع مضيق جبل طارق بين إسبانيا والمغرب. تمر منه السفن من البحر المتوسط إلى المحيط الأطلسي."]}],
["med",1,{"he":["תעלת סואץ מחברת את הים התיכון לאיזה ים?","הים האדום","הים השחור","ים המלח","הים הצפוני","התעלה עוברת במצרים, ויורדת מצפון לדרום.","בקצה הצפוני של הים הזה יושבת העיר אילת.","תעלת סואץ נחפרה במצרים. היא מחברת את הים התיכון לים האדום, וכך ספינות מגיעות מהר לאסיה."],"en":["The Suez Canal connects the Mediterranean Sea to which sea?","The Red Sea","The Black Sea","The Dead Sea","The North Sea","The canal runs through Egypt, from north to south.","The city of Eilat sits at the northern tip of this sea.","The Suez Canal was dug in Egypt. It links the Mediterranean to the Red Sea, so ships reach Asia quickly."],"ru":["С каким морем Суэцкий канал соединяет Средиземное море?","С Красным морем","С Чёрным морем","С Мёртвым морем","С Северным морем","Канал проходит через Египет, с севера на юг.","На северном краю этого моря стоит город Эйлат.","Суэцкий канал прокопали в Египте. Он соединяет Средиземное море с Красным, и корабли быстро доходят до Азии."],"ar":["قناة السويس تربط البحر المتوسط بأي بحر؟","البحر الأحمر","البحر الأسود","البحر الميت","بحر الشمال","تمر القناة في مصر، من الشمال إلى الجنوب.","على الطرف الشمالي لهذا البحر تقع مدينة إيلات.","حُفرت قناة السويس في مصر. وهي تربط البحر المتوسط بالبحر الأحمر، فتصل السفن إلى آسيا بسرعة."]}],
["med",1,{"he":["איזה מהאיים האלה נמצא בים התיכון?","קפריסין","מדגסקר","איסלנד","גרינלנד","חפשו את האי שהכי קרוב לחוף של ישראל.","שלושה מהאיים נמצאים באוקיינוסים רחוקים. אחד קרוב אלינו.","קפריסין היא אי גדול בים התיכון, מצפון־מערב לישראל. אפשר להגיע אליה בטיסה קצרה."],"en":["Which of these islands is in the Mediterranean Sea?","Cyprus","Madagascar","Iceland","Greenland","Look for the island closest to Israel's coast.","Three of the islands are in faraway oceans. One is near us.","Cyprus is a large island in the Mediterranean, northwest of Israel. A short flight takes you there."],"ru":["Какой из этих островов находится в Средиземном море?","Кипр","Мадагаскар","Исландия","Гренландия","Ищите остров, который ближе всех к берегу Израиля.","Три острова лежат в далёких океанах. Один близко к нам.","Кипр — большой остров в Средиземном море, к северо-западу от Израиля. Туда можно долететь за короткое время."],"ar":["أي من هذه الجزر تقع في البحر المتوسط؟","قبرص","مدغشقر","آيسلندا","غرينلاند","ابحثوا عن الجزيرة الأقرب إلى شاطئ إسرائيل.","ثلاث من الجزر في محيطات بعيدة. واحدة قريبة منا.","قبرص جزيرة كبيرة في البحر المتوسط، شمال غرب إسرائيل. يمكن الوصول إليها برحلة جوية قصيرة."]}],
["med",1,{"he":["איזה פרי הדר גדל הרבה במישור החוף של ישראל?","תפוז","אננס","קוקוס","בננה","פרי הדר הוא פרי עם קליפה עבה וריח חזק, כמו לימון.","מהפרי הזה סוחטים מיץ כתום בבוקר.","התפוז הוא פרי הדר. הוא גדל טוב באקלים הים תיכוני, ופרדסים רבים נטעו במישור החוף."],"en":["Which citrus fruit grows a lot in Israel's coastal plain?","Orange","Pineapple","Coconut","Banana","A citrus fruit has a thick peel and a strong smell, like a lemon.","People squeeze this fruit into a bright juice in the morning.","The orange is a citrus fruit. It grows well in a Mediterranean climate, and many orchards were planted in the coastal plain."],"ru":["Какой цитрусовый фрукт много выращивают на прибрежной равнине Израиля?","Апельсин","Ананас","Кокос","Банан","У цитрусовых толстая кожура и сильный запах, как у лимона.","Из этого фрукта утром выжимают яркий сок.","Апельсин — цитрусовый фрукт. Он хорошо растёт в средиземноморском климате, и на прибрежной равнине посадили много садов."],"ar":["أي فاكهة حمضيات تُزرع كثيرًا في السهل الساحلي لإسرائيل؟","البرتقال","الأناناس","جوز الهند","الموز","فاكهة الحمضيات لها قشرة سميكة ورائحة قوية، مثل الليمون.","من هذه الفاكهة يعصرون في الصباح عصيرًا ملونًا.","البرتقال من الحمضيات. ينمو جيدًا في المناخ المتوسطي، وزُرعت بساتين كثيرة في السهل الساحلي."]}],
["med",1,{"he":["איזו מהארצות האלה נמצאת על חוף הים התיכון?","איטליה","שווייץ","אוסטריה","הונגריה","חפשו ארץ שנראית על המפה כמו מגף, שנכנס לתוך הים.","לשלוש מהארצות אין חוף ים בכלל.","איטליה היא חצי אי שנכנס לים התיכון. שווייץ, אוסטריה והונגריה מוקפות ביבשה מכל הצדדים."],"en":["Which of these countries is on the Mediterranean coast?","Italy","Switzerland","Austria","Hungary","Look for a country shaped like a boot that sticks into the sea.","Three of these countries have no sea coast at all.","Italy is a peninsula that reaches into the Mediterranean. Switzerland, Austria and Hungary are surrounded by land."],"ru":["Какая из этих стран находится на берегу Средиземного моря?","Италия","Швейцария","Австрия","Венгрия","Ищите страну, которая на карте похожа на сапог в море.","У трёх из этих стран вообще нет морского берега.","Италия — полуостров, который выходит в Средиземное море. Швейцария, Австрия и Венгрия окружены сушей со всех сторон."],"ar":["أي من هذه الدول تقع على ساحل البحر المتوسط؟","إيطاليا","سويسرا","النمسا","المجر","ابحثوا عن دولة تبدو على الخريطة مثل حذاء طويل داخل البحر.","ثلاث من هذه الدول ليس لها ساحل بحري أبدًا.","إيطاليا شبه جزيرة تمتد داخل البحر المتوسط. أما سويسرا والنمسا والمجر فتحيط بها اليابسة من كل الجهات."]}],
["med",2,{"he":["למה עצי הזית והגפן מצליחים כל כך טוב באגן הים התיכון?","כי הם אוהבים שמש רבה ומסתדרים עם מעט גשם בקיץ","כי הם צריכים שלג כדי לגדול, ויש שם שלג כל חורף","כי הם גדלים רק בתוך מים, כמו צמחים של ביצה","כי אין שם חיות בכלל שיאכלו את העלים והפירות","חשבו על קיץ יבש וארוך: אילו צמחים שורדים בלי הרבה מים?","בדקו מה משותף לזית ולגפן: שורשים עמוקים ועלים ששומרים על מים.","זית וגפן הם צמחים ים תיכוניים קלאסיים: הם חזקים בקיץ היבש ונותנים פירות טובים."],"en":["Why do olive trees and grapevines do so well in the Mediterranean basin?","Because they love lots of sun and manage with little summer rain","Because they need snow to grow, and it snows there every winter","Because they grow only inside water, like plants in a swamp","Because there are no animals at all there to eat their fruit","Think about a long dry summer: which plants survive without much water?","Check what the olive and the vine share: deep roots and leaves that keep water in.","Olive and vine are classic Mediterranean plants: they are strong in the dry summer and give good fruit."],"ru":["Почему оливковые деревья и виноградная лоза так хорошо растут в Средиземноморье?","Потому что они любят много солнца и обходятся малым летним дождём","Потому что им нужен снег, чтобы расти, а там снег каждую зиму","Потому что они растут только внутри воды, как болотные растения","Потому что там вообще нет животных, которые едят их плоды","Подумайте о длинном сухом лете: какие растения выживают без большого количества воды?","Проверьте, что общего у маслины и лозы: глубокие корни и листья, сохраняющие воду.","Маслина и лоза это классические средиземноморские растения: они сильны в сухое лето и дают хорошие плоды."],"ar":["لماذا تنجح أشجار الزيتون وكروم العنب كثيرًا في حوض البحر المتوسط؟","لأنها تحب كثرة الشمس وتدبر أمرها مع قليل من مطر الصيف","لأنها تحتاج الثلج لتنمو، وهناك ثلج كل شتاء","لأنها تنمو فقط داخل الماء، مثل نباتات المستنقع","لأنه لا توجد هناك حيوانات إطلاقًا تأكل ثمارها","فكروا في صيف جاف وطويل: أي نباتات تصمد بلا ماء كثير؟","تحققوا مما هو مشترك بين الزيتون والكرمة: جذور عميقة وأوراق تحفظ الماء.","الزيتون والكرمة نباتات متوسطية كلاسيكية: قوية في الصيف الجاف وتعطي ثمارًا جيدة."]}],
["med",2,{"he":["איך הים התיכון משפיע על מזג האוויר של הערים שעל חופו?","הוא ממתין: מקרר מעט בקיץ ומחמם מעט בחורף","הוא גורם לסופות שלג יומיות, בקיץ ובחורף","הוא מייבש את האוויר: יבש כמו במדבר כל השנה","אין לו שום השפעה, מזג האוויר נקבע רק בשמיים","מים מתחממים ומתקררים לאט. מה שכנות כזאת עושה לעיר?","חשבו על סיר מים על אש קטנה: לוקח זמן עד שהוא רותח, וזמן עד שהוא מתקרר.","הים הוא כמו שמיכה גדולה: הוא אוגר חום ומשחרר אותו לאט. לכן ערי החוף פחות קיצוניות מערי המדבר."],"en":["How does the Mediterranean Sea affect the weather of the cities on its shore?","It softens it: cools a little in summer and warms a little in winter","It causes snow storms every single day, both in summer and in winter","It dries out the air, so it is dry like a desert all year long","It has no effect at all: the weather comes only from the sky","Water heats up and cools down slowly. What does such a neighbor do to a city?","Think about a pot of water on a small flame: it takes time to boil, and time to cool.","The sea is like a big blanket: it stores heat and releases it slowly. That is why shore cities are less extreme than desert cities."],"ru":["Как Средиземное море влияет на погоду городов на его берегу?","Оно смягчает: немного охлаждает летом и немного согревает зимой","Оно вызывает снежные бури каждый день, и летом, и зимой","Оно сушит воздух, и там сухо, как в пустыне, круглый год","Оно вообще не влияет: погода приходит только с неба","Вода нагревается и остывает медленно. Что такое соседство делает с городом?","Подумайте о кастрюле с водой на маленьком огне: нужно время, чтобы закипеть, и время, чтобы остыть.","Море как большое одеяло: оно запасает тепло и отдаёт его медленно. Поэтому прибрежные города менее экстремальны, чем города пустыни."],"ar":["كيف يؤثر البحر المتوسط في طقس المدن الواقعة على شاطئه؟","يُلطفه: يبرّد قليلًا في الصيف ويدفئ قليلًا في الشتاء","يسبب عواصف ثلجية كل يوم، في الصيف وفي الشتاء","يجفف الهواء، فيصبح جافًا كالصحراء طوال السنة","ليس له أي تأثير، فالطقس يأتي من السماء فقط","الماء يسخن ويبرد ببطء. ماذا تفعل جيرة كهذه بالمدينة؟","فكروا في قدر ماء على نار صغيرة: يحتاج وقتًا ليغلي، ووقتًا ليبرد.","البحر كبطانية كبيرة: يخزن الحرارة ويطلقها ببطء. لذلك مدن الشاطئ أقل تطرفًا من مدن الصحراء."]}],
["med",2,{"he":["שתי ערים נמצאות באותה ארץ: אחת על חוף הים ואחת עמוק במדבר. איפה הקיץ יהיה בדרך כלל נוח יותר בערב?","בעיר שעל חוף הים, כי הים ממתין את החום","בעיר המדברית, כי שם יש יותר חול","בשתיהן בדיוק אותו דבר תמיד","אי אפשר לדעת בלי לבקר בשתיהן","זכרו מה הים עושה לערים שלידו בקיץ ובחורף.","חשבו איפה נושבת בערב רוח ים נעימה.","הים ממתין את מזג האוויר. ערי חוף נהנות מקיץ פחות חריף ומחורף פחות קר מערי המדבר."],"en":["Two cities are in the same country: one on the seashore and one deep in the desert. Where will summer usually be more pleasant in the evening?","In the city on the seashore, because the sea softens the heat","In the desert city, because there is more sand there","In both, exactly the same, always","There is no way to know without visiting both","Remember what the sea does to the cities next to it in summer and in winter.","Think about where a pleasant sea breeze blows in the evening.","The sea softens the weather. Shore cities enjoy a less harsh summer and a less cold winter than desert cities."],"ru":["Два города находятся в одной стране: один на берегу моря, а другой глубоко в пустыне. Где лето обычно приятнее вечером?","В городе на берегу моря, потому что море смягчает жару","В городе пустыни, потому что там больше песка","В обоих ровно одинаково, всегда","Нельзя узнать, не побывав в обоих","Вспомните, что море делает с городами рядом с ним летом и зимой.","Подумайте, где вечером дует приятный морской бриз.","Море смягчает погоду. Прибрежные города наслаждаются менее суровым летом и менее холодной зимой, чем города пустыни."],"ar":["مدينتان في البلد نفسه: واحدة على شاطئ البحر وواحدة في عمق الصحراء. أين يكون الصيف عادة ألطف في المساء؟","في المدينة التي على شاطئ البحر، لأن البحر يلطف الحر","في المدينة الصحراوية، لأن هناك رمالًا أكثر","في كلتيهما الشيء نفسه تمامًا دائمًا","لا يمكن المعرفة من دون زيارة كلتيهما","تذكروا ماذا يفعل البحر بالمدن المجاورة له في الصيف والشتاء.","فكروا أين تهب نسمة بحر لطيفة في المساء.","البحر يلطف الطقس. مدن الشاطئ تتمتع بصيف أقل حدة وشتاء أقل بردًا من مدن الصحراء."]}],
["med",2,{"he":["ספינה יוצאת מחיפה ורוצה להגיע להודו בדרך הקצרה. דרך איפה היא תשוט?","דרך תעלת סואץ","דרך מצר גיברלטר","דרך מצר הבוספורוס","דרך נהר הירדן","הודו נמצאת בדרום אסיה. חפשו את המעבר בדרום־מזרח הים התיכון.","המעבר הזה עובר במצרים, ואנשים חפרו אותו.","התעלה במצרים מובילה מהים התיכון לים האדום, ומשם לאוקיינוס ההודי. כך לא צריך להקיף את כל אפריקה."],"en":["A ship leaves Haifa and wants to reach India the short way. Which way will it sail?","Through the Suez Canal","Through the Strait of Gibraltar","Through the Bosphorus Strait","Along the Jordan River","India is in southern Asia. Look for the passage in the southeast of the Mediterranean.","This passage goes through Egypt, and people dug it.","The canal in Egypt leads from the Mediterranean to the Red Sea, and from there to the Indian Ocean. So ships do not need to sail around Africa."],"ru":["Корабль выходит из Хайфы и хочет добраться до Индии коротким путём. Где он поплывёт?","Через Суэцкий канал","Через Гибралтарский пролив","Через пролив Босфор","По реке Иордан","Индия находится на юге Азии. Ищите проход на юго-востоке Средиземного моря.","Этот проход идёт через Египет, и его выкопали люди.","Канал в Египте ведёт из Средиземного моря в Красное, а оттуда в Индийский океан. Так не нужно обходить всю Африку."],"ar":["سفينة تخرج من حيفا وتريد الوصول إلى الهند بالطريق القصير. من أين ستبحر؟","عبر قناة السويس","عبر مضيق جبل طارق","عبر مضيق البوسفور","عبر نهر الأردن","تقع الهند في جنوب آسيا. ابحثوا عن الممر في جنوب شرق البحر المتوسط.","هذا الممر يمر في مصر، والناس حفروه.","القناة في مصر تقود من البحر المتوسط إلى البحر الأحمر، ومنه إلى المحيط الهندي. هكذا لا تحتاج السفن إلى الدوران حول أفريقيا."]}],
["med",2,{"he":["דנה רוצה לשתול בגינה צמח שלא צריך הרבה מים בקיץ. מה כדאי לה לשתול?","רוזמרין","אורז","פפירוס","שושן מים","חפשו צמח תבלין ריחני שגדל בטבע באזור הים התיכון.","שלושה מהצמחים אוהבים לעמוד בתוך מים או בבוץ.","הרוזמרין הוא צמח ים תיכוני. הוא שורד קיץ יבש עם מעט השקיה."],"en":["Dana wants to plant something in her garden that needs little water in summer. What should she plant?","Rosemary","Rice","Papyrus","Water lily","Look for a fragrant herb that grows wild around the Mediterranean.","Three of the plants like to stand in water or mud.","Rosemary is a Mediterranean plant. It survives a dry summer with little watering."],"ru":["Дана хочет посадить в саду растение, которому летом нужно мало воды. Что ей лучше посадить?","Розмарин","Рис","Папирус","Кувшинку","Ищите душистую пряную траву, которая растёт в природе у Средиземного моря.","Три растения любят стоять в воде или в грязи.","Розмарин — средиземноморское растение. Он переживает сухое лето при малом поливе."],"ar":["دانا تريد أن تزرع في حديقتها نبتة لا تحتاج إلى ماء كثير في الصيف. ماذا تزرع؟","إكليل الجبل","الأرز","البردي","زنبق الماء","ابحثوا عن عشبة عطرية تنمو في الطبيعة حول البحر المتوسط.","ثلاث من النباتات تحب أن تقف في الماء أو الطين.","إكليل الجبل نبتة متوسطية. وهي تتحمل الصيف الجاف مع قليل من الري."]}],
["med",2,{"he":["ראיתם שקית ניילון על החוף, קרוב למים. מה הכי נכון לעשות?","להרים ולזרוק לפח","לקבור אותה בחול","לדחוף אותה לים","להשאיר אותה במקום","חשבו לאן השקית תגיע אם הגלים ייקחו אותה.","רק תשובה אחת מוציאה את השקית מהחוף ומהים לגמרי.","שקית שנשארת על החוף תגיע בסוף לים ותפגע בדגים ובצבים. הכי טוב לאסוף אותה לפח."],"en":["You see a plastic bag on the beach, close to the water. What is the right thing to do?","Pick it up and bin it","Bury it in the sand","Push it into the sea","Leave it where it is","Think about where the bag will end up if the waves take it.","Only one answer takes the bag away from the beach and the sea for good.","A bag left on the beach will end up in the sea and harm fish and turtles. It is best to put it in a bin."],"ru":["Вы видите на пляже, у самой воды, пластиковый пакет. Как правильно поступить?","Поднять и выбросить в урну","Закопать его в песок","Столкнуть его в море","Оставить его на месте","Подумайте, куда попадёт пакет, если его унесут волны.","Только один ответ убирает пакет и с пляжа, и из моря навсегда.","Пакет на пляже в итоге попадёт в море и навредит рыбам и черепахам. Лучше всего выбросить его в урну."],"ar":["رأيتم كيس نايلون على الشاطئ، قريبًا من الماء. ما التصرف الصحيح؟","نرفعه ونرميه في السلة","ندفنه في الرمل","ندفعه إلى البحر","نتركه في مكانه","فكروا إلى أين سيصل الكيس إذا أخذته الأمواج.","إجابة واحدة فقط تُبعد الكيس عن الشاطئ والبحر نهائيًا.","الكيس الذي يبقى على الشاطئ يصل في النهاية إلى البحر ويؤذي الأسماك والسلاحف. الأفضل أن نضعه في سلة المهملات."]}],
["med",2,{"he":["בחוף הים מצאתם גדר קטנה ושלט: ״קן של צב ים״. מה עושים?","שומרים מרחק ולא נוגעים","חופרים כדי לראות ביצים","לוקחים ביצה הביתה","מזיזים את הגדר הצידה","בתוך החול יש ביצים שצריכות שקט כדי לבקוע.","הגדר והשלט הוצבו כדי להגן. מה הם מבקשים מכם?","צבי ים מטילים ביצים בחול של חופי ישראל בקיץ. הם בסכנה, ולכן שומרים על הקן ולא נוגעים בו."],"en":["On the beach you find a small fence and a sign: \"Sea turtle nest\". What do you do?","Keep away and do not touch","Dig to see the eggs","Take an egg home","Move the fence aside","Inside the sand there are eggs that need quiet to hatch.","The fence and the sign were put there to protect. What do they ask of you?","Sea turtles lay eggs in the sand of Israel's beaches in summer. They are in danger, so people guard the nest and leave it alone."],"ru":["На пляже вы нашли маленький забор и табличку: «Гнездо морской черепахи». Что делать?","Держаться подальше и не трогать","Раскопать, чтобы увидеть яйца","Забрать яйцо домой","Отодвинуть забор в сторону","В песке лежат яйца, которым нужен покой, чтобы вылупиться.","Забор и табличку поставили для защиты. О чём они вас просят?","Морские черепахи летом откладывают яйца в песок на пляжах Израиля. Они в опасности, поэтому гнездо охраняют и не трогают."],"ar":["وجدتم على الشاطئ سياجًا صغيرًا ولافتة: «عش سلحفاة بحرية». ماذا تفعلون؟","نبتعد ولا نلمس شيئًا","نحفر لنرى البيض","نأخذ بيضة إلى البيت","نزيح السياج جانبًا","داخل الرمل بيض يحتاج إلى الهدوء كي يفقس.","وُضع السياج واللافتة للحماية. ماذا يطلبان منكم؟","السلاحف البحرية تضع بيضها في رمال شواطئ إسرائيل صيفًا. هي في خطر، لذلك نحمي العش ولا نلمسه."]}],
["med",2,{"he":["חקלאי בישראל זורע חיטה בלי להשקות. מתי כדאי לו לזרוע?","בסתיו, עם הגשמים הראשונים","באמצע הקיץ, בשיא החום","בסוף האביב, כשהגשם נגמר","ביום שרב, כשחם ויבש מאוד","החיטה הזאת מקבלת מים רק מהשמיים.","חשבו באיזו עונה בישראל מתחיל לרדת גשם.","באקלים הים תיכוני הגשם יורד בחורף. זורעים בסתיו, והגשמים משקים את החיטה כשהיא גדלה."],"en":["A farmer in Israel sows wheat without watering it. When should he sow?","In autumn, with the first rains","In mid-summer, at the peak of the heat","At the end of spring, when the rain stops","On a heatwave day, when it is very hot and dry","This wheat gets water only from the sky.","Think about which season in Israel the rain starts to fall.","In a Mediterranean climate the rain falls in winter. Farmers sow in autumn, and the rains water the wheat as it grows."],"ru":["Фермер в Израиле сеет пшеницу без полива. Когда ему лучше сеять?","Осенью, с первыми дождями","В середине лета, в самую жару","В конце весны, когда дожди кончились","В день хамсина, когда очень жарко и сухо","Эта пшеница получает воду только с неба.","Подумайте, в какое время года в Израиле начинаются дожди.","В средиземноморском климате дожди идут зимой. Сеют осенью, и дожди поливают пшеницу, пока она растёт."],"ar":["مزارع في إسرائيل يزرع القمح دون ري. متى يجب أن يزرع؟","في الخريف، مع الأمطار الأولى","في منتصف الصيف، في ذروة الحر","في نهاية الربيع، حين يتوقف المطر","في يوم حار جدًا وجاف","هذا القمح يحصل على الماء من السماء فقط.","فكروا في أي فصل يبدأ المطر بالهطول في إسرائيل.","في المناخ المتوسطي يهطل المطر في الشتاء. يزرعون في الخريف، والأمطار تسقي القمح وهو ينمو."]}],
["med",2,{"he":["אוניה מאירופה מביאה מכוניות לנמל על הים התיכון, בדרום ישראל. לאיזה נמל היא מגיעה?","אשדוד","אילת","חיפה","טבריה","חפשו עיר נמל על הים התיכון, בין תל אביב לאשקלון.","זה הנמל הגדול ביותר בדרום מישור החוף.","אשדוד היא עיר נמל גדולה בדרום החוף. דרך הנמל שלה מגיעות סחורות רבות מאירופה."],"en":["A ship from Europe brings cars to a Mediterranean port in southern Israel. Which port does it reach?","Ashdod","Eilat","Haifa","Tiberias","Look for a port city on the Mediterranean, between Tel Aviv and Ashkelon.","It is the biggest port in the south of the coastal plain.","Ashdod is a big port city in the south of the coast. Many goods from Europe arrive through its port."],"ru":["Судно из Европы везёт машины в порт на Средиземном море, на юге Израиля. В какой порт оно придёт?","Ашдод","Эйлат","Хайфа","Тверия","Ищите портовый город на Средиземном море, между Тель-Авивом и Ашкелоном.","Это самый большой порт на юге прибрежной равнины.","Ашдод — большой портовый город на юге побережья. Через его порт приходит много товаров из Европы."],"ar":["سفينة من أوروبا تجلب سيارات إلى ميناء على البحر المتوسط في جنوب إسرائيل. إلى أي ميناء تصل؟","أسدود","إيلات","حيفا","طبريا","ابحثوا عن مدينة ميناء على البحر المتوسط، بين تل أبيب وعسقلان.","إنه أكبر ميناء في جنوب السهل الساحلي.","أسدود مدينة ميناء كبيرة في جنوب الساحل. تصل عبر مينائها بضائع كثيرة من أوروبا."]}],
["med",2,{"he":["מפעל ליד החוף שופך מים מלוכלכים לים. מי ייפגע מזה?","הדגים, הצמחים בים והמתרחצים","רק העובדים במפעל","אף אחד, הים מנקה הכול","רק הציפורים במדבר","חשבו מי חי בתוך מי הים, ומי נכנס אליהם בקיץ.","הזרמים מפזרים את הלכלוך לאורך החוף.","מים מלוכלכים פוגעים בכל מי שחי בים או נכנס אליו. לכן אסור לשפוך שפכים לים בלי לנקות אותם."],"en":["A factory near the coast pours dirty water into the sea. Who will be harmed?","Fish, sea plants and swimmers","Only the factory workers","Nobody, the sea cleans it all","Only birds in the desert","Think about who lives in the seawater, and who goes into it in summer.","Currents spread the dirt along the coast.","Dirty water harms everything that lives in the sea or swims in it. That is why sewage must be cleaned before it reaches the sea."],"ru":["Завод у берега сливает грязную воду в море. Кто от этого пострадает?","Рыбы, морские растения и купающиеся","Только рабочие на самом заводе","Никто, море всё очистит","Только птицы далеко в пустыне","Подумайте, кто живёт в морской воде и кто заходит в неё летом.","Течения разносят грязь вдоль берега.","Грязная вода вредит всем, кто живёт в море или купается в нём. Поэтому сточные воды нельзя сливать в море без очистки."],"ar":["مصنع قرب الشاطئ يصب مياهًا ملوثة في البحر. من سيتضرر من ذلك؟","الأسماك ونباتات البحر والسباحون","عمال المصنع فقط","لا أحد، البحر ينظف كل شيء","الطيور في الصحراء فقط","فكروا في من يعيش داخل مياه البحر، ومن يدخلها في الصيف.","التيارات تنشر الأوساخ على طول الشاطئ.","المياه الملوثة تؤذي كل من يعيش في البحر أو يسبح فيه. لذلك يُمنع صب مياه الصرف في البحر دون تنظيفها."]}],
["med",2,{"he":["תייר מגיע לחוף תל אביב באוגוסט. מה הכי חשוב לו לארוז?","כובע, קרם הגנה ובגדים קלים","מעיל חורף וכפפות","מגפי גשם ומטרייה גדולה","מגלשיים ומזחלת","זכרו איך נראים השמיים בישראל באמצע הקיץ.","בחודש הזה כמעט אין עננים, והשמש חזקה.","באוגוסט חם ויבש בחוף. צריך להגן מפני השמש ולהתלבש קל."],"en":["A tourist arrives at the Tel Aviv beach in August. What is most important to pack?","A hat, sunscreen and light clothes","A winter coat and gloves","Rain boots and a big umbrella","Skis and a sled","Remember what the sky in Israel looks like in mid-summer.","This month there are almost no clouds, and the sun is strong.","In August the coast is hot and dry. You need protection from the sun and light clothes."],"ru":["Турист приезжает на пляж Тель-Авива в августе. Что важнее всего взять?","Шляпу, крем от солнца и лёгкую одежду","Зимнее пальто и перчатки","Резиновые сапоги и большой зонт","Лыжи и санки","Вспомните, как выглядит небо в Израиле в середине лета.","В этом месяце почти нет облаков, и солнце очень сильное.","В августе на побережье жарко и сухо. Нужно защищаться от солнца и одеваться легко."],"ar":["سائح يصل إلى شاطئ تل أبيب في آب. ما أهم شيء يحزمه؟","قبعة وواقٍ من الشمس وملابس خفيفة","معطف شتوي ثقيل وقفازات صوف","أحذية مطر ومظلة كبيرة","زلاجات للتزلج ومزلجة ثلج","تذكروا كيف تبدو السماء في إسرائيل في منتصف الصيف.","في هذا الشهر لا توجد غيوم تقريبًا، والشمس قوية.","في آب يكون الساحل حارًا وجافًا. يجب الاحتماء من الشمس ولبس ملابس خفيفة."]}],
