<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>אולפן — עברית מעשית לעולים חדשים</title>
<meta name="description" content="עברית מעשית לעולים חדשים: כל מילה נשמעת לפני שהיא נקראת, אותיות שקל להחליף, מצבים מהחיים, ושלטים וטפסים אמיתיים. בעברית, ערבית, רוסית ואנגלית." />
<meta name="theme-color" content="#17120d" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   אולפן — עברית מעשית לעולים חדשים
   קהל היעד אינו "לא יודע עברית". הוא חי בעברית כל יום ונכשל בה
   כל יום — בקופת חולים, בטופס, מול פקיד — ולכן כל החלטה כאן
   נמדדת בשאלה אחת: האם היא מורידה עומס, או מוסיפה.
   · שום מילה עברית לא מוצגת בלי שאפשר לשמוע אותה.
   · לצד כל מילה יש ניקוד. מי שקורא לאט קורא אותיות, לא מילים,
     ובלי ניקוד הוא מנחש תנועה ומקבל מילה אחרת.
   · שפת האם היא פיגום, לא קביים — היא נסוגה עם העלייה ברמה.
   · Noto Sans Arabic נטען לצד Heebo: Heebo אינו מכיל גליפים
     ערביים, ובלעדיו הממשק הערבי נופל לגופן ברירת המחדל.
   כל המידות ב-rem, כדי שהגדלת טקסט תגדיל את הכול יחד.
   ============================================================ */
:root{
  --font:"Heebo","Rubik",system-ui,"Segoe UI",Arial,sans-serif;
  --ar:"Noto Sans Arabic","Heebo",system-ui,"Segoe UI",Arial,sans-serif;
  --lrn:"Heebo","Rubik",system-ui,"Segoe UI",Arial,sans-serif;
  --bg:#faf7f2; --surface:#ffffff; --surface2:#f0e9df;
  --ink:#1f1a14; --muted:#5c5147; --faint:#7f6a52; --line:#e5dbcc;
  --accent:#8a5a2b; --accent-ink:#ffffff; --accent-soft:#f3e3d1;
  --gold:#a16207; --gold-soft:#fbf0d5; --hit:#f5c451; --hit-ink:#1a1300;
  --ok:#15803d; --ok-soft:#dcfce7; --bad:#be123c; --bad-soft:#ffe4e9;
  --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(31,26,20,.05),0 8px 24px -12px rgba(31,26,20,.2);
  --r:14px;
  /* צבע לכל מסלול. לא קישוט: ארבעה סוגי לימוד שונים לגמרי, וצבע
     קבוע לכל אחד חוסך למי שמתקשה להתמצא את השאלה "איפה אני". */
  --c-sound:#0369a1; --cs-sound:#dbeefc;   /* אות וצליל      */
  --c-words:#15803d; --cs-words:#dcfce7;   /* מילים          */
  --c-talk:#c2410c;  --cs-talk:#fde5d8;    /* מדוברת         */
  --c-read:#6d28d9;  --cs-read:#eae2fd;    /* שלטים וטפסים   */
}
:root[data-theme="dark"]{
  --bg:#17120d; --surface:#221b14; --surface2:#2e251b;
  --ink:#f2ece3; --muted:#b3a595; --faint:#8a7c6c; --line:#3a2f23;
  --accent:#e8c9a0; --accent-ink:#17120d; --accent-soft:#3a2c1c;
  --gold:#fbbf24; --gold-soft:#33270f; --hit:#ffd24d; --hit-ink:#241a00;
  --ok:#4ade80; --ok-soft:#132a1c; --bad:#fb7185; --bad-soft:#33161f;
  --warn:#fbbf24; --warn-soft:#33260f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  --c-sound:#7dd3fc; --cs-sound:#0b2a3d;
  --c-words:#86efac; --cs-words:#0f2a1a;
  --c-talk:#fdba74;  --cs-talk:#3a2113;
  --c-read:#c4b5fd;  --cs-read:#261a45;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d1b1a; --surface:#142624; --surface2:#1c3230;
    --ink:#e6f0ee; --muted:#9ab0aa; --faint:#6f8781; --line:#264240;
    --accent:#5eead4; --accent-ink:#0d1b1a; --accent-soft:#123c37;
    --gold:#fbbf24; --gold-soft:#33270f; --hit:#ffd24d; --hit-ink:#241a00;
    --ok:#4ade80; --ok-soft:#132a1c; --bad:#fb7185; --bad-soft:#33161f;
    --warn:#fbbf24; --warn-soft:#33260f;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
    --c-sound:#7dd3fc; --cs-sound:#0b2a3d;
    --c-words:#86efac; --cs-words:#0f2a1a;
    --c-talk:#fdba74;  --cs-talk:#3a2113;
    --c-read:#c4b5fd;  --cs-read:#261a45;
  }
}
/* ניגודיות גבוהה — שחור על לבן, מסגרות מלאות, בלי גוונים רכים */
:root.hc{
  --bg:#ffffff; --surface:#ffffff; --surface2:#ffffff;
  --ink:#000000; --muted:#1a1a1a; --faint:#333333; --line:#000000;
  --accent:#00434b; --accent-ink:#ffffff; --accent-soft:#e6f2f3;
  --gold:#5c3d00; --gold-soft:#f7efdf; --hit:#ffe600; --hit-ink:#000000;
  --ok:#0a5c2a; --ok-soft:#e6f4ea; --bad:#8c0f2c; --bad-soft:#fbe9ed;
  --warn:#6b3d00; --warn-soft:#f7efdf; --shadow:none;
  --c-sound:#00305c; --cs-sound:#e8eef7;
  --c-words:#0a5c2a; --cs-words:#e6f4ea;
  --c-talk:#7a2c00;  --cs-talk:#f9ece4;
  --c-read:#3d1a75;  --cs-read:#eee8f9;
}
:root.hc *{box-shadow:none!important}
:root.hc .card,:root.hc .btn,:root.hc .opt{border-width:2px!important}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs,17px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  font-size:1rem;line-height:1.65;-webkit-text-size-adjust:100%}
:root.clear body{font-family:"Verdana","Tahoma","Heebo",sans-serif;letter-spacing:.012em}
:root.spaced body{word-spacing:.22em;line-height:1.95}
:root.rm *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
h1,h2,h3{margin:0;line-height:1.3;font-weight:800}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* החומר הנלמד — עברית — בכיוון, בגופן ובמרווח משלו. unicode-bidi:isolate
   מונע מהמשפט העברי לגרור אחריו את סימני הפיסוק של המשפט הרוסי או האנגלי
   שלצידו, וזה קורה בדיוק במקום שבו הלומד קורא לאט וזקוק ליציבות. */
html[lang="ar"] body{font-family:var(--ar)}
.lrn{font-family:var(--lrn);direction:rtl;unicode-bidi:isolate;text-align:start}
.lrn-b{font-family:var(--lrn);direction:rtl;unicode-bidi:isolate;display:inline-block}
.tr-b{font-family:system-ui,"Segoe UI",Arial,sans-serif;direction:ltr;
  unicode-bidi:isolate;display:inline-block;color:var(--muted)}

.wrap{max-width:56rem;margin:0 auto;padding:0 clamp(.9rem,3vw,1.5rem)}
.hbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-block:.6rem}
:root.hc .hbar{background:var(--bg);backdrop-filter:none}
.hrow{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
.brand{font-size:1.35rem;font-weight:800;letter-spacing:-.01em;display:flex;
  align-items:baseline;gap:.5rem;margin-inline-end:auto}
.brand small{font-size:.72rem;font-weight:600;color:var(--muted);letter-spacing:.06em}
.gbtn{display:inline-flex;align-items:center;gap:.4rem;background:var(--surface);
  border:1px solid var(--line);border-radius:999px;padding:.42rem .8rem;cursor:pointer;
  font-size:.86rem;font-weight:600;box-shadow:var(--shadow);min-height:44px}
.gbtn:hover{border-color:var(--accent)}
.gbtn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:1.1rem}
.grid{display:grid;gap:.85rem}
@media(min-width:640px){.g2{grid-template-columns:1fr 1fr}}
@media(min-width:900px){.g3{grid-template-columns:repeat(3,1fr)}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;
  border:1px solid var(--line);background:var(--surface);border-radius:12px;
  padding:.72rem 1.1rem;font-weight:700;cursor:pointer;box-shadow:var(--shadow);
  min-height:2.9rem;font-size:1rem}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;box-shadow:none}
.btn[disabled]{opacity:.45;cursor:default}
.btn.wide{width:100%}

.chip{display:inline-flex;align-items:center;gap:.35rem;border-radius:999px;
  padding:.22rem .6rem;font-size:.78rem;font-weight:700;background:var(--surface2);color:var(--muted)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}

/* ===== מסלולים: הצבע נכנס ככרטיס, לא כרקע של טקסט ===== */
.trk{--c:var(--accent);--cs:var(--accent-soft)}
.t-sound{--c:var(--c-sound);--cs:var(--cs-sound)}
.t-words{--c:var(--c-words);--cs:var(--cs-words)}
.t-talk{--c:var(--c-talk); --cs:var(--cs-talk)}
.t-read{--c:var(--c-read); --cs:var(--cs-read)}
.tcard{border-inline-start:5px solid var(--c);cursor:pointer;text-align:start;width:100%;
  display:flex;flex-direction:column;gap:.4rem;align-items:stretch}
.tcard:hover{border-color:var(--c)}
.tcard h3{font-size:1.05rem}
.tcard .sub{font-size:.85rem;color:var(--muted)}
.tdot{width:.62rem;height:.62rem;border-radius:50%;background:var(--c);flex:none}
.thead{display:flex;align-items:center;gap:.5rem}
.tpill{background:var(--cs);color:var(--c);border-radius:999px;padding:.15rem .55rem;
  font-size:.72rem;font-weight:800}

/* ===== סרגל שליטה ברמות ===== */
.lvls{display:flex;gap:.4rem;flex-wrap:wrap}
.lvl{border:1px solid var(--line);background:var(--surface);border-radius:10px;
  padding:.4rem .7rem;font-size:.82rem;font-weight:700;cursor:pointer;
  display:inline-flex;align-items:center;gap:.4rem}
.lvl.on{background:var(--c,var(--accent));color:var(--accent-ink);border-color:var(--c,var(--accent))}
.bar{height:.42rem;border-radius:999px;background:var(--surface2);overflow:hidden;flex:1;min-width:3rem}
.bar i{display:block;height:100%;background:var(--c,var(--accent))}
.bar.b0 i{background:var(--bad)} .bar.b1 i{background:var(--warn)} .bar.b2 i{background:var(--ok)}

/* ===== תרגול ===== */
.qcard{border-top:5px solid var(--c,var(--accent))}
.qtop{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.7rem}
.qtext{font-size:1.12rem;font-weight:600;margin:.2rem 0 .3rem}
.qhint{color:var(--muted);font-size:.9rem}
/* המילה או המשפט שנלמדים. גדול, מרווח, ותמיד לצד כפתור השמעה. */
.subject{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;
  background:var(--surface2);border-radius:12px;padding:.85rem 1rem;margin:.5rem 0}
.subject .word{font-family:var(--lrn);direction:rtl;unicode-bidi:isolate;
  font-size:1.7rem;font-weight:700;letter-spacing:.01em;line-height:1.25}
/* התעתיק הוא לטיני ולכן LTR — הוא נועד למי שעדיין אינו קורא אות
   עברית בכלל, ובלעדיו רמה 1 חסומה בפניו לגמרי. */
.subject .ipa{font-family:system-ui,"Segoe UI",Arial,sans-serif;direction:ltr;
  unicode-bidi:isolate;color:var(--muted);font-size:.95rem;letter-spacing:.02em}
.spk{border:1px solid var(--line);background:var(--surface);border-radius:999px;
  width:2.7rem;height:2.7rem;display:inline-flex;align-items:center;justify-content:center;
  cursor:pointer;flex:none;box-shadow:var(--shadow)}
.spk:hover{border-color:var(--accent);color:var(--accent)}
.spk.sm{width:2.1rem;height:2.1rem}
.spk.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.opts{display:grid;gap:.6rem;margin-top:.9rem}
@media(min-width:560px){.opts.two{grid-template-columns:1fr 1fr}}
.opt{display:flex;align-items:center;gap:.6rem;text-align:start;width:100%;
  border:2px solid var(--line);background:var(--surface);border-radius:12px;
  padding:.8rem .9rem;cursor:pointer;font-size:1.02rem;font-weight:600;min-height:3.1rem}
.opt:hover{border-color:var(--accent)}
.opt .k{width:1.9rem;height:1.9rem;border-radius:8px;background:var(--surface2);
  display:inline-flex;align-items:center;justify-content:center;font-size:.85rem;
  font-weight:800;color:var(--muted);flex:none}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .k{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .k{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.55}

/* אריחי בניית משפט. הסדר הוא התרגיל, ולכן האריח חייב להיראות כמשהו
   שאפשר להרים — מסגרת מלאה ורקע משלו, לא טקסט על רקע הכרטיס. */
.tiles{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:.7rem}
.tile{font-family:var(--lrn);direction:rtl;border:2px solid var(--line);
  background:var(--surface);border-radius:10px;padding:.5rem .8rem;font-weight:600;
  cursor:pointer;font-size:1.02rem;min-height:2.7rem}
.tile:hover{border-color:var(--accent)}
.slot{min-height:3.2rem;border:2px dashed var(--line);border-radius:12px;
  background:var(--surface2);padding:.5rem;display:flex;flex-wrap:wrap;gap:.45rem;
  align-items:center;direction:ltr}
.slot.ok{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.slot.bad{border-style:solid;border-color:var(--bad);background:var(--bad-soft)}
.slot .tile{background:var(--surface)}

/* ===== משוב ===== */
.fb{margin-top:.9rem;border-radius:12px;padding:.85rem 1rem;border:1px solid transparent}
.fb.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.fb.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.fb b{display:block;font-size:1.02rem;margin-bottom:.2rem}
.fb .body{color:var(--ink);font-weight:500;font-size:.95rem}
.why{margin-top:.55rem;padding-top:.55rem;border-top:1px dashed currentColor;color:var(--ink);
  font-weight:500;font-size:.93rem}

/* ===== קטע קריאה ===== */
.passage{background:var(--surface2);border-radius:12px;padding:1rem 1.1rem;margin:.6rem 0;
  font-family:var(--lrn);direction:rtl;unicode-bidi:isolate;font-size:1.08rem;line-height:2}
.passage .s{border-radius:5px;padding:.05em .12em;cursor:pointer}
.passage .s:hover{background:var(--accent-soft)}
.passage .s.now{background:var(--accent-soft);box-shadow:0 2px 0 var(--accent)}
.wd{border-radius:5px;padding:1px 3px}
.wd.hit{background:var(--hit);color:var(--hit-ink);font-weight:600}
/* כשמנוע הדיבור אינו מדווח על גבולות מילים — קורה הרבה בעברית
   באנדרואיד — אין מה להדגיש מילה־מילה, ואז מודגש כל האיבר. הכלל
   שקיים כאן מכוון למשפט בתוך קטע קריאה בלבד, ולכן ההדגשה החלופית
   על איבר אחר לא נראתה כלל. */
.wd.now,p.now,div.now,span.now,b.now{background:var(--hit);color:var(--hit-ink);
  border-radius:8px;box-shadow:0 0 0 4px var(--hit)}
.gloss{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.5rem}
.gword{border:1px solid var(--line);background:var(--surface);border-radius:999px;
  padding:.25rem .6rem;font-size:.85rem;cursor:pointer}
.gword b{font-family:var(--lrn);direction:rtl;unicode-bidi:isolate}

/* ===== סרגל מצב הקול ===== */
.vstrip{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;border-radius:10px;
  padding:.45rem .7rem;font-size:.85rem;font-weight:600;margin-bottom:.7rem}
.vstrip.ok{background:var(--ok-soft);color:var(--ok)}
.vstrip.warn{background:var(--warn-soft);color:var(--warn)}
.vstrip.bad{background:var(--bad-soft);color:var(--bad)}
.vstrip .btn{padding:.3rem .7rem;min-height:44px;font-size:.82rem}  /* 2.1rem היו 36 פיקסלים — מתחת ליעד המגע */

/* ===== הגדרות ===== */
.row{display:flex;align-items:center;justify-content:space-between;gap:.8rem;
  padding:.7rem 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row:last-child{border-bottom:0}
.row .lab{font-weight:700}
.row .desc{font-size:.85rem;color:var(--muted);font-weight:500}
.sw{width:3.2rem;height:1.8rem;border-radius:999px;background:var(--surface2);
  border:1px solid var(--line);position:relative;cursor:pointer;flex:none}
.sw i{position:absolute;top:.18rem;inset-inline-start:.2rem;width:1.3rem;height:1.3rem;
  border-radius:50%;background:var(--faint);transition:.15s}
.sw.on{background:var(--accent);border-color:var(--accent)}
.sw.on i{inset-inline-start:1.5rem;background:#fff}
.vgrid{display:grid;gap:.5rem;grid-template-columns:1fr}
@media(min-width:560px){.vgrid{grid-template-columns:1fr 1fr}}
.vopt{display:flex;align-items:center;gap:.6rem;border:2px solid var(--line);
  background:var(--surface);border-radius:12px;padding:.6rem .75rem;cursor:pointer;text-align:start}
.vopt.on{border-color:var(--accent);background:var(--accent-soft)}
.vopt .nm{font-weight:700}
.vopt .ds{font-size:.8rem;color:var(--muted)}
input[type=password],input[type=text]{font:inherit;background:var(--surface);color:var(--ink);
  border:1px solid var(--line);border-radius:10px;padding:.6rem .7rem;min-width:0;flex:1;
  direction:ltr;text-align:left}
input[type=range]{width:100%;accent-color:var(--accent)}

.fbar{border-top:1px solid var(--line);margin-top:2rem;padding-block:1rem;
  color:var(--muted);font-size:.82rem}   /* --faint יצא 2.96:1 */
.hidden{display:none!important}

/* ---------- שדה קלט של המבחן ----------
   מודול המבחן הועתק לכאן מאפליקציה שבה .field כבר היה מוגדר.
   בלי הכלל הזה שדה השם של הנבחן נשאר תיבת ברירת המחדל של
   הדפדפן — 21 פיקסלים גובה, הרבה מתחת ליעד המגע של 44. */
.field{width:100%;box-sizing:border-box;font:inherit;font-size:1rem;
  min-height:48px;padding:12px 14px;border-radius:11px;outline:none;background:var(--surface2);color:inherit;border:1px solid var(--line)}
.field:focus{border-color:var(--accent)}
textarea.field{min-height:96px;resize:vertical}

/* ---------- שורות המבחן ----------

   כפתורי הבחירה יצאו 34 פיקסלים, וכרטיסי הנושאים 6 פיקסלים בלבד —

   כפתורים שהמשתמש לוחץ עליהם. אין כאן מסך מזויף ואין תוכן
   שנכתב במיוחד להדגמה, ולכן היא גם לא יכולה להראות משהו
   שהאפליקציה לא באמת עושה.

   בלי ?demo=1 שום שורה כאן אינה רצה: המשתנים מוגדרים ונשארים
   בלי שימוש, לא נרשם אף מאזין אירועים, ולא נוסף דבר למסך.

var DEMO_ON=/(^|[?&])demo=1(&|$)/.test(location.search||"");

/* בוחר אפשרות לפי נכונותה, ויודע גם לסדר משפט מאריחים — שתי
   צורות השאלה שיש כאן. התסריט לא מקודד תשובה: הוא שואל את
   השאלה שעל המסך עכשיו. */
/* יש צורת שאלה אחת שאין בה מה להשמיע לפני שעונים. מגרילים
   שאלה אחרת במקום לדלג על הצעד: ההקראה היא כל העניין כאן. */
function demoHear(){
  for(var n=0;n<8&&!document.querySelector('[data-a="say"]');n++){
    try{newQuestion()}catch(e){break}
  }
  return demoTap('[data-a="say"]');
}
function demoOrder(){
  var q=(typeof P!=="undefined")?P.q:null;
  if(!q||!q.target)return false;
  q.target.forEach(function(w,k){
    DEMO.extra.push(setTimeout(function(){
      if(!DEMO.on)return;
      var b=document.querySelectorAll('[data-a="slot"]'),j;
      for(j=0;j<b.length;j++)if((b[j].textContent||"").trim()===w){b[j].click();return}
    },300*k));
  });
  DEMO.extra.push(setTimeout(function(){
    if(DEMO.on)demoClick('[data-a="checkorder"]');
  },300*q.target.length+400));
  return true;
}
function demoPick(right){
  var q=(typeof P!=="undefined")?P.q:null;
  if(!q)return false;
  if(q.type==="order")return demoOrder();
  if(!q.opts)return false;
  for(var i=0;i<q.opts.length;i++)
    if(!!q.opts[i].ok===!!right)return demoTap('[data-a="pick"][data-i="'+i+'"]');
  return false;
}

var DEMO_SCRIPT=[
  {subtitle:"אולפן — עברית מעשית לעולים חדשים. כל מילה נשמעת לפני שהיא נקראת.",

/* --- מנוע ההדגמה. הקוד כאן זהה בכל האפליקציות; רק DEMO_SCRIPT משתנה. --- */
var DEMO={on:false,i:0,timer:null,extra:[],bar:null,txt:null,step:null,fill:null,btn:null};

/* עוזרים לתסריט. כולם מחזירים false כשהאיבר אינו על המסך, כדי
   שצעד שלא מצא את מה שחיפש ידלג ולא יפיל את ההדגמה כולה. */
function demoEl(s){return typeof s==="string"?document.querySelector(s):s}
function demoShow(s){
  var e=demoEl(s); if(!e)return false;
  try{e.scrollIntoView({behavior:"smooth",block:"center"})}catch(err){try{e.scrollIntoView()}catch(err2){}}
  return true;
}
/* מדגיש את האיבר, ורק אז לוחץ — צופה שלא ראה לאן נלחץ לא הבין
   מה קרה. לכן אין צעד קצר מ-1200 אלפיות בתסריטים. */
function demoTap(s){
  var e=demoEl(s); if(!e||e.disabled)return false;
  demoShow(e);
  e.classList.add("demo-tap");
  DEMO.extra.push(setTimeout(function(){
    e.classList.remove("demo-tap");
    /* המסך מצטייר מחדש כל הזמן. אם האיבר שסומן כבר אינו במסמך,
       מחפשים אותו שוב לפי אותו בורר — לחיצה על איבר מת אינה
       עושה דבר, וזה בדיוק צעד שנראה כאילו נתקע. */
    var live=(typeof s==="string"&&!document.contains(e))?demoEl(s):e;
    if(DEMO.on&&live&&!live.disabled&&document.contains(live))try{live.click()}catch(err){}
  },430));
  return true;
}
function demoClick(s){
  var e=demoEl(s); if(!e||e.disabled)return false;
  try{e.click()}catch(err){return false}
  return true;
}
/* הקלדה אות אחר אות, עם אירוע input אמיתי — שדה חיפוש שמאזין
   ל-input לא היה מגיב להשמה ישירה ל-value. */
function demoType(s,text){
  var e=demoEl(s); if(!e)return false;
  demoShow(e); try{e.focus()}catch(err){}
  e.value=""; var i=0;
  var t=setInterval(function(){
    if(!DEMO.on||!e.parentNode){clearInterval(t);return}
    e.value=String(text).slice(0,++i);
    e.dispatchEvent(new Event("input",{bubbles:true}));
    if(i>=String(text).length)clearInterval(t);
  },85);
  DEMO.extra.push(t);
  return true;
}
function demoQuiet(){

}

function demoKey(e){
  if(!DEMO.on)return;
  if(e.key==="Escape"||e.keyCode===27){
    e.preventDefault(); e.stopPropagation();
    demoStop();
  }
}

function demoStart(){
  if(DEMO.on)return;
  DEMO.on=true; DEMO.i=0;
  DEMO.btn.hidden=true; DEMO.bar.hidden=false;
  document.documentElement.classList.add("demo-running");
  demoNext();
}

function demoNext(){
  if(!DEMO.on)return;
  if(DEMO.i>=DEMO_SCRIPT.length){demoStop();return}
  var it=DEMO_SCRIPT[DEMO.i++]||{};
  var d=Math.max(600,it.duration||3000);
  DEMO.txt.textContent=it.subtitle||"";
  DEMO.step.textContent=DEMO.i+" / "+DEMO_SCRIPT.length;
  DEMO.fill.style.transition="none"; DEMO.fill.style.width="0";
  void DEMO.fill.offsetWidth;
  DEMO.fill.style.transition="width "+d+"ms linear";
  DEMO.fill.style.width="100%";
  if(typeof it.action==="function"){
    try{it.action()}catch(err){if(window.console)console.warn("demo:",err)}
  }
  DEMO.timer=setTimeout(demoNext,d);
}

function demoStop(){
  DEMO.on=false;
  if(DEMO.timer){clearTimeout(DEMO.timer);DEMO.timer=null}
  DEMO.extra.forEach(function(t){clearTimeout(t);clearInterval(t)});
  DEMO.extra=[];
  var m=document.querySelectorAll(".demo-tap"),i;
  for(i=0;i<m.length;i++)m[i].classList.remove("demo-tap");
  if(DEMO.bar)DEMO.bar.hidden=true;
  if(DEMO.btn)DEMO.btn.hidden=false;
  document.documentElement.classList.remove("demo-running");
  demoQuiet();
}

/* שער התנאים הוא חלון מודאלי מעל הכול. כפתור הדגמה מתחתיו היה
   מפעיל אפליקציה שאי אפשר לראות, ולכן ממתינים שייסגר. */
function demoMount(){
  if(document.querySelector(".lg-wrap")){setTimeout(demoMount,500);return}
  if(!document.getElementById("demo-start"))demoMountUI();
}

if(DEMO_ON){
  if(document.readyState==="complete")setTimeout(demoMount,0);
  else window.addEventListener("load",function(){setTimeout(demoMount,0)});
}

function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
  .replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){var i,j,t;for(i=a.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));
  t=a[i];a[i]=a[j];a[j]=t}return a}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function uniq(a){return a.filter(function(v,i){return a.indexOf(v)===i})}
function todayIso(){var d=new Date();return d.getFullYear()+"-"+
  String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}

   המכשיר, לא כבחירה, והאפליקציה נפתחה באנגלית למי שבא ללמוד
   בעברית. ערבית ורוסית כן נחשבות — שם זו שפת אם של ממש. מי

function guessLang(){
  var ls=(navigator.languages||[navigator.language||"he"]).map(function(x){
    return String(x).toLowerCase().split("-")[0]});
  for(var i=0;i<ls.length;i++){

    if(c==="en")continue;
    if(LANGS[c])return c;
  }
  return "he";
}
function touchDay(){
  var d=todayIso();

    var y=new Date(Date.now()-86400000);
    var yi=y.getFullYear()+"-"+String(y.getMonth()+1).padStart(2,"0")+"-"+String(y.getDate()).padStart(2,"0");
    state.streak=(state.lastDay===yi)?(state.streak||0)+1:1;
    state.lastDay=d; state.day={d:d,n:0};
  }
}

}
function mastery(tid,lv){
  var s=state.stats[stKey(tid,lv)];
  if(!s||!s.seen)return 0;
  return clamp(s.ok/Math.max(6,s.seen),0,1);

   לפני כן מקבל את ברירת המחדל של הדפדפן — לרוב קול אנגלי, גם כשמותקן
   קול עברי טוב. onvoiceschanged לבדו אינו פתרון: הוא מרענן תפריט,
   הוא לא מעכב את האמירה הראשונה. */
var _voicesP=null;
function voicesReady(){
  if(_voicesP)return _voicesP;
  _voicesP=new Promise(function(done){
    if(!("speechSynthesis" in window)){done();return}
    if(allVoices().length){done();return}
    var poll=null,cap=null,fired=false;
    function finish(){
      if(fired)return; fired=true;
      clearInterval(poll); clearTimeout(cap);
      try{speechSynthesis.removeEventListener("voiceschanged",finish)}catch(e){}
      done();
    }
    try{speechSynthesis.addEventListener("voiceschanged",finish)}catch(e){}
    /* Safari לא תמיד יורה את האירוע — לכן גם דגימה */
    poll=setInterval(function(){if(allVoices().length)finish()},120);
    /* תקרה: יש מכשירים שמחזירים רשימה ריקה לצמיתות ומדברים מצוין.
       עדיף לדבר בקול ברירת מחדל מאשר לשתוק לנצח. */
    cap=setTimeout(finish,4000);
  });
  return _voicesP;
}

/* אין קול נשי בשפה שמוצגת? femLift מרים את הגובה, וזה כל מה
   שדפדפן יכול לעשות בלי הקלטות ובלי שירות חיצוני. ההודעה מסבירה
   את זה ומצרפת את ההוראות למערכת ההפעלה שהמשתמש נמצא בה — קול
   נשי שמותקן נבחר מיד, בלי שינוי הגובה ובלי הודעה. */
function femNote(pool){
  if(!pool||!pool.length)return "";
  for(var i=0;i<pool.length;i++)if(vGender(pool[i])==="f")return "";
  /* המסלול נכתב למערכת שהמשתמש נמצא בה עכשיו. אנדרואיד של גוגל
     מחזיק את ההגדרה תחת "נגישות" — "ניהול כללי" הוא מסלול של
     סמסונג בלבד; אייפד מדווח מאז iPadOS 13 כמו מק ונבדל ממנו רק
     במסך מגע; ומשתמש מק קיבל עד כה הוראות של ווינדוס, כי כל מה
     שאינו אנדרואיד או אייפון נפל לשם. */
  var ua=navigator.userAgent||"";
  var how=/Android/i.test(ua)?"femAndroid"
         :(/iPhone|iPad|iPod/i.test(ua)||(/Macintosh/i.test(ua)&&navigator.maxTouchPoints>1))?"femIos"
         :/Mac OS X|Macintosh/i.test(ua)?"femMac":"femWin";
  return t("femNone")+" "+t(how);
}
function devPicker(lgs){
  var out="";
  lgs.forEach(function(lg){
    var code=LANGS[lg].tts;
    var pool=voicesFor(code);
    if(lgs.length>1)out+='<p style="font-weight:700;margin:.9rem 0 .3rem">'+esc(LANGS[lg]?LANGS[lg].name:code)+"</p>";
    if(!pool.length){
      /* אומרים את זה במפורש. רשימה ריקה בלי הסבר נראית כמו תקלה. */
      out+='<p class="chip bad" style="margin:.4rem 0">'+esc(t("vNoneLang"))+"</p>";
      return;
    }
    /* אין קול נשי בשפה הזאת? הגובה מורם — וגם נאמר למה. בלי המשפט
       הזה הקול הגברי נראה כמו בחירה של האפליקציה ולא כמו מה שיש
       במכשיר, ואין שום רמז שאפשר להתקין קול נשי ולקבל אותו מיד. */
    var fnote=femNote(pool);
    if(fnote)out+='<p class="sub" style="margin:.4rem 0;line-height:1.5">'+esc(fnote)+"</p>";
    var cur=(state.devVoice||{})[code]||"";
    function row(v){
      var on=v?cur===v.voiceURI:!cur;
      var uri=v?v.voiceURI:"";
      return '<div class="vopt'+(on?" on":"")+'" data-a="devvoice" data-l="'+lg+'" data-u="'+esc(uri)+
        '" role="button" tabindex="0" aria-pressed="'+(on?"true":"false")+'">'+
        '<span style="flex:1"><span class="nm">'+esc(v?v.name:t("vAuto"))+'</span><br>'+
        '<span class="ds">'+esc(v?v.lang:t("vDevD"))+"</span></span>"+
        (v?'<button class="btn ghost" data-a="devsample" data-l="'+lg+'" data-u="'+esc(uri)+
           '" style="padding:.35rem .7rem;min-height:2.2rem;font-size:.82rem">'+
           ic("play",14)+" "+esc(t("vSample"))+"</button>":"")+"</div>";
    }
    out+='<div class="vgrid">'+row(null)+"</div>";
    /* שלוש קבוצות. מי שלא זוהה מקבל קבוצה משלו ולא מנוחש: אין שדה
       מגדר ב-Web Speech API, ואנדרואיד מדווח שמות שאינם נושאים מגדר. */
    [["f",t("vFemale")],["m",t("vMale")],["?",t("vDevList")]].forEach(function(grp){
      var gv=pool.filter(function(v){return vGender(v)===grp[0]});
      if(!gv.length)return;
      out+='<p style="font-weight:700;margin:.9rem 0 .3rem">'+esc(grp[1])+"</p>"+
           '<div class="vgrid">'+gv.slice(0,20).map(row).join("")+"</div>";
    });
  });
  return out;
}
function bestVoice(code){
  var pool=voicesFor(code); if(!pool.length)return null;
  /* בחירה ידנית גוברת על הניקוד. היא נשמרת לכל שפה בנפרד:
     קול שנבחר לרוסית אינו רלוונטי כשמקריאים עברית. */
  var want0=(state.devVoice||{})[code];
  if(want0){var hit=pool.filter(function(v){return v.voiceURI===want0})[0]; if(hit)return hit}
  var want=String(code).toLowerCase();
  var pref=state.gemVoice&&gvOf(state.gemVoice).g==="m"?"m":"f";
  function score(v){
    var s=0,n=((v.name||"")+" "+(v.lang||"")).toLowerCase();
    if(String(v.lang||"").replace("_","-").toLowerCase()===want)s+=12;
    if(/\b(google|microsoft|apple)\b/.test(n))s+=30;
    if(/natural|neural|enhanced|premium|wavenet|siri/.test(n))s+=22;
    if(/espeak|compact|pico/.test(n))s-=40;
    if(v.default)s+=4;
    return s;
  }
  /* המגדר אינו עוד סעיף בתוך הניקוד אלא המיון הראשון. עשר נקודות
     נבלעו מול שלושים על שם יצרן, וקול גברי ממותג ניצח קול נשי
     שקיים באותו מכשיר — בדיוק מה שהעדפת המגדר הייתה אמורה למנוע.
     קודם הקולות במגדר המבוקש, אחריהם מי שלא זוהה, ורק אז ההפוך;
     ובתוך כל קבוצה מכריעה האיכות. */
  function grank(v){var g=vGender(v);return g===pref?2:g==="?"?1:0}
  return pool.slice().sort(function(a,b){
    var d=grank(b)-grank(a); return d||score(b)-score(a);
  })[0];
}

function pcmToWav(b64){
  try{
    var bin=atob(b64),len=bin.length,buf=new Uint8Array(len),i;
    for(i=0;i<len;i++)buf[i]=bin.charCodeAt(i);
    var sr=24000,ch=1,bits=16,dl=len,hdr=new ArrayBuffer(44+dl),v=new DataView(hdr);
    function ws(o,s){for(var j=0;j<s.length;j++)v.setUint8(o+j,s.charCodeAt(j))}
    ws(0,"RIFF");v.setUint32(4,36+dl,true);ws(8,"WAVE");ws(12,"fmt ");
    v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,ch,true);
    v.setUint32(24,sr,true);v.setUint32(28,sr*ch*bits/8,true);
    v.setUint16(32,ch*bits/8,true);v.setUint16(34,bits,true);
    ws(36,"data");v.setUint32(40,dl,true);
    new Uint8Array(hdr,44).set(buf);
    var bytes=new Uint8Array(hdr),out="";
    for(var k=0;k<bytes.length;k+=8192)out+=String.fromCharCode.apply(null,bytes.subarray(k,k+8192));
    return "data:audio/wav;base64,"+btoa(out);
  }catch(e){return null}
}

function gSynth(text,voiceName,rate,lang){
  var L=GEM_LEAD[lang]||GEM_LEAD[LEARN];
  var lead=rate<=0.7?L.slow:rate<=0.9?L.soft:rate>=1.15?L.fast:L.norm;
  var body={contents:[{parts:[{text:lead+text}]}],
    generationConfig:{responseModalities:["AUDIO"],
      speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:voiceName}}}}};
  return fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key="+
      encodeURIComponent(GKEY),
    {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})
  .then(function(r){
    if(r.ok)return r.json();
    return r.text().then(function(tx){
      var m="";try{var j=JSON.parse(tx);m=(j.error&&j.error.message)||""}catch(e){m=String(tx).slice(0,140)}
      throw new Error(r.status+(m?" — "+m:""));
    });
  })
  .then(function(d){
    var parts=(d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts)||[];
    for(var i=0;i<parts.length;i++){
      var pd=parts[i].inlineData;
      if(pd&&pd.data){
        var mt=pd.mimeType||"";
        if(mt.indexOf("wav")>=0||mt.indexOf("pcm")>=0||mt.indexOf("L16")>=0)
          return pcmToWav(pd.data)||("data:audio/wav;base64,"+pd.data);
        return "data:audio/mp3;base64,"+pd.data;
      }
    }
    throw new Error("no-audio");
  });
}
/* ============================================================
   מעקב הקראה: הדגשת המילה הנאמרת
   ------------------------------------------------------------
   עובד רק כשהטקסט הנאמר הוא הטקסט המוצג. כאן זה המצב — כפתור
   ההשמעה נושא את אותה מחרוזת שמופיעה לידו על המסך.

   charIndex מתאפס בכל אמירה, ולכן המפה נבנית מהמחרוזת שנמסרה
   למנוע ולא מה-DOM. אנדרואיד, ולעתים ספארי, לא שולחים דיווח על
   מילים כלל — ואז הדגשה שלא זזה נראית כמו תקלה, ולכן אחרי שנייה
   וחצי בלי דיווח מודגש כל הטקסט במקום מילה בודדת.
   ============================================================ */
var HL={el:null,raw:"",spans:[],map:[],timer:null,got:false,added:false};
function hlClear(){
  if(HL.timer){clearTimeout(HL.timer);HL.timer=null}
  if(HL.el){try{HL.el.innerHTML=HL.raw;HL.el.classList.remove("now")}catch(e){}}
  HL={el:null,raw:"",spans:[],map:[],timer:null,got:false,added:false};
}
/* האיבר שמציג בדיוק את המחרוזת הזאת. מדלגים על איברים שמכילים
   כפתור — החלפת ה-HTML שלהם הייתה מוחקת את כפתור ההשמעה עצמו. */
function hlFind(btn,text){
  var want=String(text||"").replace(/\s+/g," ").trim();
  if(!want||!btn)return null;
  var box=(btn.closest&&btn.closest(".subject,.qcard,.fb,.passage,.card"))||document.body;
  var cand=box.querySelectorAll(".word,.s,span,p,b");
  for(var i=0;i<cand.length;i++){
    if(cand[i].querySelector("button"))continue;
    if((cand[i].textContent||"").replace(/\s+/g," ").trim()===want)return cand[i];
  }
  return null;
}
/* כשאין איבר יחיד שמציג בדיוק את המחרוזת — למשל משפט שמורכב
   מכותרת ומתיאור בשני איברים — אי אפשר למפות מילים. מדגישים את
   הכרטיס כולו, כדי שיהיה משוב במקום שום דבר. */
function hlWhole(el){
  hlClear();
  if(!el)return;
  HL.el=el; HL.raw=el.innerHTML; HL.added=true;
  el.classList.add("now");
}
function hlPrep(el,text){
  hlClear();
  if(!el||!text)return;
  HL.el=el; HL.raw=el.innerHTML;
  var parts=String(text).split(/(\s+)/),html="",pos=0,idx=0;
  HL.map=[];
  for(var i=0;i<parts.length;i++){
    var pt=parts[i];
    if(!pt.length)continue;
    if(/^\s+$/.test(pt)){html+=pt;pos+=pt.length;continue}
    HL.map.push({from:pos,to:pos+pt.length,i:idx});
    html+='<span class="wd" data-i="'+idx+'">'+esc(pt)+'</span>';
    pos+=pt.length; idx++;
  }
  if(!HL.map.length){hlClear();return}
  el.innerHTML=html;
  HL.spans=el.querySelectorAll(".wd");
  HL.timer=setTimeout(function(){if(!HL.got&&HL.el){HL.added=true;HL.el.classList.add("now")}},1500);
}
function hlAt(c){
  if(!HL.el||!HL.map.length)return;
  HL.got=true;
  if(HL.timer){clearTimeout(HL.timer);HL.timer=null}
  if(HL.added){HL.el.classList.remove("now");HL.added=false}
  for(var k=0;k<HL.map.length;k++){
    if(c>=HL.map[k].from&&c<HL.map[k].to){
      for(var j=0;j<HL.spans.length;j++)HL.spans[j].classList.toggle("hit",j===HL.map[k].i);
      return;
    }
  }
}

function ttsFail(err){
  /* "interrupted" ו-"canceled" אינן תקלות: זה מה שהמנוע מדווח על
     אמירה שבוטלה כדי לפנות מקום לאמירה הבאה — כלומר מהלך תקין
     לגמרי, שקורה בכל לחיצה שנייה. הצגתן כשגיאה הבהילה משתמש
     ואמרה לו שהמכשיר שלו שבור בזמן שהוא עבד.
     גם ניקוי ההדגשה חייב לבוא אחרי היציאה הזאת ולא לפניה: הביטול
     של האמירה הקודמת מגיע אחרי שהאמירה החדשה כבר הכינה את ההדגשה
     שלה, וניקוי כאן מחק אותה מיד. */

  try{ hlClear() }catch(e){}
  if(_ttsBar)return;
  var _g="he"; try{_g=state.lang||"he"}catch(e){} if(!TTSMSG[_g])_g="he";

  m.dir=TT.dir;
  m.style.cssText="position:fixed;inset-inline:10px;bottom:10px;z-index:99999;"+
    "background:#7f1d1d;color:#fff;padding:13px 15px;border-radius:12px;"+
    "font:600 15px/1.55 system-ui,Arial,sans-serif;box-shadow:0 10px 34px rgba(0,0,0,.45);"+
    "display:flex;gap:10px;align-items:flex-start";
  var t=document.createElement("div");
  t.style.cssText="flex:1;min-width:0";
  t.innerHTML=TT.msg+
    (err?" <span dir=ltr>("+String(err)+")</span>":"")+
    TT.tail+
    '<a href="/voice/" style="color:#fff">'+TT.link+'</a>';
  var x=document.createElement("button");
  x.type="button"; x.textContent="✕"; x.setAttribute("aria-label",TT.close);
  x.style.cssText="min-width:44px;min-height:44px;border:0;border-radius:9px;"+

  x.onclick=function(){ if(_ttsBar&&_ttsBar.parentNode)_ttsBar.parentNode.removeChild(_ttsBar); _ttsBar=null };
  m.appendChild(t); m.appendChild(x);

}

/* ------------------------------------------------------------
   פיצול לאמירות קצרות — הועתק מ"תאוריה מדברת", שם ההקראה נשמעת
   הכי טוב. מנועי מכשיר מאיצים ובולעים סופי מילים במשפט ארוך;
   כאן נשלחה שאלה שלמה באמירה אחת, לפעמים 300 תווים.
   כל מקטע נושא את ההיסט שלו במחרוזת המלאה, כי charIndex מתאפס
   בכל אמירה ובלעדיו ההדגשה קופצת לתחילת המשפט בכל מקטע.
   ------------------------------------------------------------ */
var SEG_MAX=90, SEG_GAP=260;
/* סימן פיסוק בין שתי ספרות הוא חלק מהמספר ולא מקום לחתוך בו:
   בלי הבדיקה הזאת "3,500" נשבר והמנוע קורא "שלוש, חמש מאות". */
function insideNumber(str,i){
  return i>0&&i+1<str.length&&/[0-9]/.test(str[i-1])&&/[0-9]/.test(str[i+1]);
}
function segments(spoken){
  var out=[],parts=[],from=0,i,j;
  function push(t,start){ if(String(t).trim())out.push({text:t,start:start}) }
  for(i=0;i<spoken.length;i++){
    if(".!?:;".indexOf(spoken[i])<0)continue;
    if(insideNumber(spoken,i))continue;
    j=i+1; while(j<spoken.length&&/\s/.test(spoken[j]))j++;
    parts.push({text:spoken.slice(from,j),start:from});
    from=j; i=j-1;
  }
  if(from<spoken.length)parts.push({text:spoken.slice(from),start:from});
  for(var k=0;k<parts.length;k++){
    var p=parts[k];
    if(p.text.length<=SEG_MAX){ push(p.text,p.start); continue }
    var rest=p.text,base=p.start;
    while(rest.length>SEG_MAX){
      var cut=rest.lastIndexOf(",",SEG_MAX);
      while(cut>0&&insideNumber(rest,cut))cut=rest.lastIndexOf(",",cut-1);
      if(cut<SEG_MAX*0.4)cut=rest.lastIndexOf(" ",SEG_MAX);
      if(cut<=0)break;
      push(rest.slice(0,cut+1),base);
      base+=cut+1; rest=rest.slice(cut+1);
    }
    push(rest,base);
  }
  /* מקטע זעיר — "12." או ")" — עם הפסקה של רבע שנייה אחריו נשמע
     כמו גמגום. מאחדים אותו לזה שאחריו. */
  var merged=[];
  for(i=0;i<out.length;i++){
    if(merged.length&&out[i].text.trim().length<12&&
       merged[merged.length-1].text.length+out[i].text.length<=SEG_MAX*1.4){
      merged[merged.length-1].text+=out[i].text; continue;
    }
    if(out[i].text.trim().length<12&&i+1<out.length){
      out[i+1]={text:out[i].text+out[i+1].text,start:out[i].start}; continue;
    }
    merged.push(out[i]);

var VOICE_TUNE={he:0.82,ar:0.85,en:0.90,ru:0.88};
function tuneRate(lang,rate){
  var t=VOICE_TUNE[String(lang||"he").split("-")[0].toLowerCase()]||0.88;
  var r=t*(rate||1);
  return Math.max(0.5,Math.min(1.6,Math.round(r*100)/100));
}

  u.lang="he-IL"; u.volume=1; u.rate=1; u.pitch=1;

  u.onstart=function(){ done=true; show("✓ הקול פועל — "+list.length+" קולות במכשיר") };
  u.onerror=function(e){ done=true;
    var er=(e&&e.error)||"לא ידוע";
    if(er==="interrupted"||er==="canceled"){ show("✓ הקול פועל"); return }
    show("✗ המנוע החזיר "+er+" · "+list.length+" קולות · זו תקלה במכשיר, לא באפליקציה"); };
  try{ speechSynthesis.speak(u) }

  setTimeout(function(){ if(!done)
    show("✗ שתי שניות ואין תגובה מהמנוע · "+list.length+" קולות במכשיר") },2000);

function speakDevice(text,code,rate){
  if(!("speechSynthesis" in window))return false;
  try{speechSynthesis.cancel()}catch(e){}
  /* האמירה יוצאת מיד, בתוך הלחיצה. קודם היא נעטפה ב-voicesReady,
     שממתין לרשימת הקולות ועד ארבע שניות אם היא לא מגיעה — ואמירה
     שיוצאת ארבע שניות אחרי המגע נזרקת בשקט באנדרואיד ובספארי.
     כשהרשימה כבר כאן, בוחרים קול ומדברים. כשהיא ריקה — מדברים
     בכל זאת, עם u.lang בלבד: קול ברירת מחדל בשפה הנכונה עדיף על
     שתיקה, ויש מכשירים שמחזירים רשימה ריקה לצמיתות ומדברים היטב.
     voicesReady נשאר בשימוש למסך בחירת הקול, שם ההמתנה במקומה. */
  (function(){
    try{
      var v=bestVoice(code), lang=(v&&v.lang)||code;
      var segs=segments(String(text)), rt=tuneRate(lang,clamp(rate,0.55,1.4));
      var pit=femLift(v);
      (function sayseg(k){
        if(k>=segs.length){ hlClear(); ttsOK(); return }
        var seg=segs[k];
        var u=new SpeechSynthesisUtterance(seg.text);
        u.lang=lang;
        if(v){ try{ u.voice=v }catch(e2){} }
        u.rate=rt; u.pitch=pit; u.volume=1;
        u.onboundary=function(e){if(!e.name||e.name==="word")hlAt(seg.start+e.charIndex)};
        u.onend=function(){
          if(k+1<segs.length) setTimeout(function(){sayseg(k+1)},SEG_GAP);
          else { hlClear(); ttsOK() }
        };
        u.onerror=function(e){ttsFail(e&&e.error)};
        speechSynthesis.speak(u);
      })(0);
    }catch(e){}
  })();
  return true;
}

     לבד, וניקוי חוזר אינו משנה דבר — אבל בלעדיו כל מחרוזת שנשארה
     עם <sub> או <span class="frac"> הוקראה בקול כתגית: הסטודנט
     שמע "span class frac" באמצע השאלה. */
  text=plainOf(String(text||"")).trim(); if(!text)return;
  lang=lang||LEARN;
  var code=LANGS[lang].tts;
  var rate=clamp(state.rate*(rateMul||1),0.55,1.4);
  stopSpeak();
  if(gemOn()){
    var vid=gvOf(state.gemVoice).id;
    var ck=lang+"|"+vid+"|"+rate.toFixed(2)+"|"+text;
    if(gCache[ck]){playUrl(gCache[ck],text,code,rate);return}

function topicOf(id){for(var i=0;i<TOPICS.length;i++)if(TOPICS[i].id===id)return TOPICS[i];return null}
function trackOf(id){for(var i=0;i<TRACKS.length;i++)if(TRACKS[i].id===id)return TRACKS[i];return TRACKS[0]}
function tName(tp){return tp.n[state.lang]||tp.n.en}

/* ============================================================
   8. מנוע התרגילים
   ------------------------------------------------------------
   כלל אחד מנחה את כל הבנייה כאן: מסיח חייב להיות מסיח *סביר*.
   ארבע אפשרויות אקראיות מלמדות לנחש לפי אורך המילה. ארבע
   אפשרויות קרובות מכריחות באמת להבחין, וזו כל התועלת.
   ============================================================ */
function itemId(tid,lv,i){return tid+"|"+lv+"|"+i}
function itemRec(id){
  if(!state.item[id])state.item[id]={n:0,ok:0};
  return state.item[id];
}
/* בחירת פריט: קודם מה שעוד לא נראה, אחר כך מה שנכשל, ורק בסוף
   מה שכבר נשלט. חזרה מרווחת פשוטה, בלי שעון ובלי נוסחה. */
function chooseIndex(tid,lv,pool,avoid){
  var cand=[],i,w;
  for(i=0;i<pool.length;i++){
    if(avoid!==undefined&&i===avoid&&pool.length>1)continue;
    var r=state.item[itemId(tid,lv,i)];
    if(!r||!r.n)w=6;                       /* חדש */
    else if(r.ok<r.n)w=1+Math.min(4,r.n-r.ok);  /* נכשל בעבר */
    else w=1;                               /* נשלט */
    for(var j=0;j<w;j++)cand.push(i);
  }
  if(!cand.length)return 0;
  return pick(cand);
}
function poolOf(tp,lv){return (tp.L[lv-1]||tp.L[0]||[])}
function kindsIn(pool){
  var k={w:[],s:[],p:[]},i;
  for(i=0;i<pool.length;i++)if(k[pool[i].k])k[pool[i].k].push(i);
  return k;
}
/* מילים דומות מכל התוכן, לא רק מהרמה הזאת — כדי שמסיח יוכל להיות
   מילה שנלמדה קודם, וזה בעצמו תרגול חזרה. */
var ALL_WORDS=null;
function allWords(){
  if(ALL_WORDS)return ALL_WORDS;
  ALL_WORDS=[];
  TOPICS.forEach(function(tp){tp.L.forEach(function(lvl){
    lvl.forEach(function(it){if(it.k==="w")ALL_WORDS.push(it)})})});
  return ALL_WORDS;
}
/* משפטים מכל התוכן. מסיח למשפט חייב להיות משפט אמיתי שאומרים
   באנגלית, ולכן הרשימה הרחבה נלקחת מהתוכן ולא מורכבת בזמן ריצה. */
var ALL_SENTS=null;
function allSents(){
  if(ALL_SENTS)return ALL_SENTS;
  ALL_SENTS=[];
  TOPICS.forEach(function(tp){tp.L.forEach(function(lvl){
    lvl.forEach(function(it){if(it.k==="s")ALL_SENTS.push(it)})})});
  return ALL_SENTS;
}
function wordByText(txt){
  var a=allWords();
  for(var i=0;i<a.length;i++)if(a[i].w.toLowerCase()===String(txt).toLowerCase())return a[i];
  return null;
}
/* מסיחים למילה: קודם ה-near שלה, ואז מילים מאותו נושא. */
/* needGloss: בתרגיל משמעות האפשרויות *הן* המשמעויות, ולכן מסיח בלי
   תרגום אינו מסיח אלא שורה ריקה. חלק מה-near הם צורות ("record
   (verb)") שאין להן ערך משלהן, והם נופלים בדיוק כאן. */
function wordDistract(it,pool,n,needGloss){
  var out=[],i,seen={};
  function add(x){
    var k=x.w.toLowerCase();
    if(seen[k])return false;
    if(needGloss&&!x.g)return false;
    seen[k]=1; out.push(x); return true;
  }
  seen[it.w.toLowerCase()]=1;
  (it.near||[]).forEach(function(nw){
    add(wordByText(nw)||{k:"w",w:nw,ipa:"",g:null,near:[]});
  });
  var rest=shuffle(pool.filter(function(x){return x.k==="w"}));
  for(i=0;i<rest.length&&out.length<n;i++)add(rest[i]);
  rest=shuffle(allWords());
  for(i=0;i<rest.length&&out.length<n;i++)add(rest[i]);
  return out.slice(0,n);
}
function O(html,ok,why){return {h:html,ok:!!ok,why:why||""}}

/* בורר מסיחים.
   ------------------------------------------------------------
   מסיח שיוצא במקרה זהה לתשובה או למסיח קודם *אינו* נזרק כדי
   להשאיר שלוש אפשרויות — אז השאלה נעשית ניחוש של אחד משלושה
   במקום אחד מארבעה, בשקט ובלי שאיש רואה. במקום זה מקבלים כאן
   רשימת מועמדים רחבה מהדרוש, דוחים כל מועמד מתנגש וממשיכים
   הלאה עד שיש בדיוק ארבע.
   keyOf מחזיר את מה שהתלמיד באמת רואה — שתי אפשרויות שנראות
   זהות הן שאלה בלי תשובה יחידה גם אם הפריטים שמאחוריהן שונים. */
function fillOpts(opts,cands,need,keyOf,mkOpt,ownKey){
  var seen={},i,k;
  if(ownKey)seen[ownKey]=1;
  for(i=0;i<cands.length&&opts.length<need;i++){
    k=keyOf(cands[i]);
    if(!k||seen[k])continue;
    seen[k]=1;
    opts.push(mkOpt(cands[i]));
  }
  return opts;
}

/* המשמעות כפי שהיא מוצגת בשאלה. ברמה 3 היא ניתנת באנגלית — זה מה
   ש"אנגלית בלבד" אומר, וזה גם ההבדל בפועל בין רמה 3 לרמה 1 על אותה
   מילה: בלעדיו התרגיל זהה בשתיהן והרמה מדורגת רק בשם. התרגום בשפת
   האם חוזר בהסבר שאחרי התשובה, כך שאיש אינו נשאר תקוע.
   הסינון של כפילויות נשאר על התרגום בשפת האם ולא על התצוגה, כדי
   שמספר האפשרויות וסדר ההגרלה יישארו זהים — המבחן הכיתתי נבנה
   מזרע, ושינוי במספר קריאות ה-random היה משנה מבחנים קיימים. */
function ml(lv,g){ return (lv>=3&&g&&g.en)?g.en:gl(g) }

/* --- צורה 1: מילה נשמעת ונראית → מה המשמעות --- */
function formMean(tp,lv,pool,idx){
  var it=pool[idx];
  /* מבקשים הרבה יותר משלושה מועמדים: שתי מילים שונות יכולות
     לחלוק תרגום, והמועמד שנפסל בגלל זה מוחלף ולא מנוכה. */
  var ds=wordDistract(it,pool,14,true);
  /* המפתח הוא מה שנראה על המסך ולא התרגום בשפת האם: ברמה 3
     מוצג ההסבר האנגלי, ושתי מילים שהסברן האנגלי זהה היו נראות
     לתלמיד כשתי אפשרויות זהות. */
  var opts=fillOpts([O(esc(ml(lv,it.g)),true)],ds,4,
    function(d){return ml(lv,d.g)},
    function(d){return O(esc(ml(lv,d.g)),false,d.w+" = "+gl(d.g))},
    ml(lv,it.g));
  return {type:"mean",prompt:t("qMean"),subject:it,opts:shuffle(opts),
    answer:ml(lv,it.g),say:it.w};
}
/* --- צורה 2: המשמעות בשפת האם → איזו מילה באנגלית --- */
function formBack(tp,lv,pool,idx){
  var it=pool[idx];
  var ds=wordDistract(it,pool,14);
  var opts=fillOpts([O('<span class="lrn-b">'+esc(it.w)+"</span>",true)],ds,4,
    function(d){return d.w.toLowerCase()},
    function(d){return O('<span class="lrn-b">'+esc(d.w)+"</span>",false,
      d.g?(d.w+" = "+gl(d.g)):"")},
    it.w.toLowerCase());
  return {type:"back",prompt:t("qSay"),lead:ml(lv,it.g),subject:null,
    opts:shuffle(opts),answer:it.w,say:it.w,reveal:it};
}
/* --- צורה 3: רק אוזן. המילה אינה מוצגת עד שעונים --- */
function formHear(tp,lv,pool,idx){
  var it=pool[idx];
  /* שלושה מסיחים ולא שניים. שאלת האזנה עם שלוש אפשרויות היא
     ניחוש של אחד משלושה, וזה בדיוק ההבדל שהתרגיל נועד לאמן.
     הסדר ב-wordDistract הוא הסדר החינוכי: קודם זוגות המינימום
     של המילה עצמה, ורק אחריהן מילים אחרות מאותה רמה. */
  var ds=wordDistract(it,pool,14);
  var opts=fillOpts([O('<span class="lrn-b">'+esc(it.w)+"</span>",true)],ds,4,
    function(d){return d.w.toLowerCase()},
    function(d){return O('<span class="lrn-b">'+esc(d.w)+"</span>",false,
      d.g?(d.w+" = "+gl(d.g)):"")},
    it.w.toLowerCase());
  return {type:"hear",prompt:t("qHear"),subject:null,hidden:it,
    opts:shuffle(opts),answer:it.w,say:it.w,reveal:it,auto:true};
}
/* --- צורה 4: המצב בשפת האם → איזה משפט אומרים --- */
function formUse(tp,lv,pool,idx){
  var it=pool[idx];
  /* קודם משפטי אותו מצב באותה רמה — הם המסיחים הקרובים, כי כולם
     שייכים לאותו הקשר וההבדל ביניהם הוא בדיוק מה שנשאל. אם הבנק
     של הרמה דל, ממשיכים לשאר המשפטים באפליקציה במקום להסתפק
     בשלוש אפשרויות. */
  var others=shuffle(pool.filter(function(x){return x.k==="s"&&x!==it}))
    .concat(shuffle(allSents().filter(function(x){return x!==it})));
  var opts=fillOpts([O('<span class="lrn-b">'+esc(it.s)+"</span>",true)],others,4,
    function(d){return d.s},
    function(d){return O('<span class="lrn-b">'+esc(d.s)+"</span>",false,gl(d.g))},
    it.s);
  return {type:"use",prompt:t("qUse"),lead:it.u?gl(it.u):gl(it.g),subject:null,
    opts:shuffle(opts),answer:it.s,say:it.s,reveal:it};
}
/* --- צורה 5: משפט עם חסר --- */
var STOP_GAP=/^(a|an|the|to|of|is|are|was|were|be|i|you|he|she|it|we|they|my|your)$/i;
function formGap(tp,lv,pool,idx){
  var it=pool[idx];
  var parts=it.s.split(" ");
  /* הרמז שמוצג מעל התרגיל הוא gl(it.g). כשהממשק באנגלית זהו תיאור
     באנגלית, והוא עלול להכיל בדיוק את המילה שהוסרה — "Ask for the
     menu" מול המשפט שממנו נגרע menu. מילה שכבר כתובה ברמז אינה
     חסר אלא מתנה, ולכן היא נבחרת רק אם לא נשארה אחרת.
     נבדק תמיד מול g.en ולא מול gl(it.g): רק בו יש מילים אנגליות,
     והבדיקה חייבת לצאת זהה בכל שפת ממשק — המבחן הכיתתי נבנה מזרע
     אצל המורה ואצל התלמיד, ואלה לא בהכרח באותה שפה. */
  var leadTxt=String((it.g&&it.g.en)||"").toLowerCase();
  /* גם נוסח השאלה עצמו, ולא רק הרמז. הפרומפט האנגלי הוא "What is
     missing?", ולכן כשהמילה שנגרעה מהמשפט הייתה What היא הופיעה
     בשורה שמעל התרגיל. נלקח תמיד מהאנגלית ולא מ-t(), כדי שההגרלה
     תצא זהה בכל שפת ממשק. */
  var promptTxt=String((T.en&&T.en.qGap)||"").toLowerCase();
  var leadW={},lw=(leadTxt+" "+promptTxt).match(/[a-z']+/g)||[];
  lw.forEach(function(w){leadW[w]=1});
  var cand=[],free=[];
  for(var i=0;i<parts.length;i++){
    var bare=parts[i].replace(/[^A-Za-z']/g,"");
    if(bare.length>=3&&!STOP_GAP.test(bare)){
      cand.push(i);
      /* לא רק מילה שלמה אלא גם הכלה: הרמז "first meeting" נושא
         בתוכו את meet, "to have this meaning" את mean, ו-"unwell"
         את well. מילה שאפשר לקרוא אותה מתוך הרמז אינה חסר. */
      var bl=bare.toLowerCase();
      if(!leadW[bl]&&(leadTxt+" "+promptTxt).indexOf(bl)<0)free.push(i);
    }
  }
  if(free.length)cand=free;
  /* המילה הפותחת אינה מוסתרת כשיש חלופה.
     שתי סיבות, ושתיהן מדודות:
     · האות הגדולה מסגירה. התלמיד רואה "_____ to meet you." ויודע
       שהתשובה מתחילה באות גדולה; ב-10% משאלות ההשלמה היא הייתה
       האפשרות היחידה כזאת, כלומר סימון נכון בלי לקרוא מילה.
     · המילה הפותחת כאן היא לרוב מודאל של בקשה, ו-"Can I have the
       menu" נכון בדיוק כמו "Could I have the menu" — מסיח שהוא
       תשובה שנייה. */
  var inner=cand.filter(function(i){return i>0});
  if(inner.length)cand=inner;
  if(!cand.length)return formUse(tp,lv,pool,idx);
  var gi=pick(cand),gone=parts[gi].replace(/[^A-Za-z']/g,"");
  var shown=parts.slice();
  shown[gi]=parts[gi].replace(gone,"_____");
  /* מסיחים: מילים מהמשפטים והמילים של אותה רמה, ואם הבנק דל —
     מילים שנלמדו באפליקציה. מועמד שכבר הופיע נדחה וממשיכים
     הלאה, כדי שיישארו ארבע אפשרויות ולא שלוש. */
  var others=[],seen={};seen[gone.toLowerCase()]=1;
  pool.forEach(function(x){
    var src=x.k==="s"?x.s:(x.k==="w"?x.w:"");
    src.split(" ").forEach(function(p){
      var b=p.replace(/[^A-Za-z']/g,"");
      if(b.length>=3&&!STOP_GAP.test(b)&&!seen[b.toLowerCase()]){seen[b.toLowerCase()]=1;others.push(b)}
    });
  });
  var backup=shuffle(allWords()).map(function(x){return x.w.replace(/[^A-Za-z']/g,"")})
    .filter(function(b){return b.length>=3&&!STOP_GAP.test(b)});
  var cands=shuffle(others).concat(backup);
  var opts=fillOpts([O('<span class="lrn-b">'+esc(gone)+"</span>",true)],cands,4,
    function(w){return w.toLowerCase()},
    function(w){return O('<span class="lrn-b">'+esc(w)+"</span>",false)},
    gone.toLowerCase());
  return {type:"gap",prompt:t("qGap"),gapHtml:'<span class="lrn-b">'+esc(shown.join(" "))+"</span>",
    lead:gl(it.g),subject:null,opts:shuffle(opts),answer:gone,say:it.s,reveal:it};
}
/* --- צורה 6: בניית משפט מאריחים --- */
function formOrder(tp,lv,pool,idx){
  var it=pool[idx];
  var words=it.s.split(" ");
  if(words.length<3||words.length>9)return formUse(tp,lv,pool,idx);
  var tiles=shuffle(words.slice());
  /* ערבוב שיצא זהה למקור אינו תרגיל */
  if(tiles.join(" ")===words.join(" ")&&words.length>2)tiles=shuffle(tiles.reverse());
  return {type:"order",prompt:t("qOrder"),lead:gl(it.g),tiles:tiles,target:words,
    say:it.s,reveal:it,subject:null};
}
/* --- צורה 7: הבנת הנקרא --- */
function formComp(tp,lv,pool,idx){
  var it=pool[idx];
  var qq=pick(it.qs);
  var opts=[O(esc(gl(qq.a)),true)];
  qq.w.forEach(function(x){opts.push(O(esc(gl(x)),false))});
  return {type:"comp",prompt:t("qRead"),passage:it,qtext:gl(qq.q),
    opts:shuffle(opts),answer:gl(qq.a),say:it.lines.join(" "),subject:null};
}

/* בוחר את צורת התרגיל. הרמה קובעת כמה פיגום נשאר: ברמה 1 שפת האם
   נוכחת תמיד, ברמה 3 היא נעלמת וגם האוזן לבדה נדרשת. */
function buildQuestion(tid,lv,avoid){
  var tp=topicOf(tid); if(!tp)return null;
  var pool=poolOf(tp,lv), k=kindsIn(pool);
  var idx=chooseIndex(tid,lv,pool,avoid);
  var it=pool[idx];
  var q;
  if(it.k==="p")q=formComp(tp,lv,pool,idx);
  else if(it.k==="s"){
    var sForms=lv===1?["use","gap"]:lv===2?["use","gap","order"]:["gap","order","use"];
    var f=pick(sForms);
    q=f==="gap"?formGap(tp,lv,pool,idx):f==="order"?formOrder(tp,lv,pool,idx):formUse(tp,lv,pool,idx);
  } else {
    var wForms=lv===1?["mean","mean","hear"]:lv===2?["mean","back","hear"]:["back","hear","hear","mean"];
    var f2=pick(wForms);
    q=f2==="back"?formBack(tp,lv,pool,idx):f2==="hear"?formHear(tp,lv,pool,idx):formMean(tp,lv,pool,idx);
  }
  q.tid=tid; q.lv=lv; q.idx=idx; q.id=itemId(tid,lv,idx);
  return q;
}

function buildQ(tid,lv){
  var q=buildQuestion(tid,lv,undefined); if(!q)return null;
  var tp=topicOf(tid);
  /* תרגיל סידור המשפט נבנה מאריחים ואין לו אפשרויות בחירה. במבחן
     הכיתתי יש רק בחירה מרובה, ולכן שאלה כזאת הגיעה לתלמיד בלי שום
     תשובה לסמן — בערך שליש משאלות המשפטים ברמות 2 ו-3. מגרילים
     צורה אחרת. ההגרלה זהה אצל המורה ואצל התלמיד כי שניהם מזרעים
     את אותו זרע, ולכן שניהם מקבלים בדיוק את אותה שאלה. */
  for(var tryN=0;tryN<16&&(!q.opts||!q.opts.length);tryN++)
    q=buildQuestion(tid,lv,undefined)||q;
  if(!q.opts||!q.opts.length){
    /* מוצא אחרון דטרמיניסטי, בלי הגרלה: המשפט הראשון בבנק של הרמה. */
    var pool0=poolOf(tp,lv),si=0;
    for(var pi=0;pi<pool0.length;pi++)if(pool0[pi].k==="s"){si=pi;break}
    if(pool0.length&&pool0[si]&&pool0[si].k==="s")q=formUse(tp,lv,pool0,si);
  }
  if(!q.opts||!q.opts.length)return null;
  /* שאלת האזנה: המילה מוסתרת בכוונה והשמע הוא השאלה עצמה, לא
     סיוע. אסור לחשוף אותה בטקסט, וגם אסור לכבות לה את ההקראה —
     בלעדיה אין דרך לענות. */
  var audioOnly=(q.type==="hear");
  /* בתרגיל "מה המשמעות" מוצגת המילה והאפשרויות הן המשמעויות. כאן
     נלקחה קודם gl(subject.g) — כלומר המשמעות עצמה — וכל שאלה כזאת
     במבחן נשאה את תשובתה בגוף השאלה. הנושא הוא המילה. */
  /* שאלת הבנת הנקרא נושאת את שאלתה ב-qtext ולא ב-lead; בלעדיו
     הופיע רק "לפי הקטע:" בלי מה שנשאל. */
  var lead=q.type==="comp"?(q.qtext||""):
           (q.lead||(q.subject?(q.subject.w||q.subject.s||""):""));
  var ask=esc(q.prompt||"")+(lead&&!audioOnly?' <b>'+esc(lead)+"</b>":"");
  var expr="";
  /* "p" הוא סוג הפריט בבנק, לא סוג השאלה. השאלה שנבנית מקטע קריאה
     חוזרת כ-"comp", ולכן הקטע לא צורף מעולם — ובלי הקטע אין על מה
     לענות. */
  if(q.type==="comp"&&q.passage){

      return '<div class="s">'+esc(l)+"</div>"}).join("")+"</div>";
  }
  return {topic:tid, topicName:tp?tName(tp):"", ask:ask, expr:expr, fig:"",
          audioOnly:audioOnly, say:q.say||q.answer||"",
          options:(q.opts||[]).map(function(o){
            return {h:o.h,t:plainOf(o.h),ok:!!o.ok,why:o.why||""}})};
}


/* ============================================================
   18. מבחן כיתתי — פרסום בוואטסאפ, קבלת תשובות וציונים
   ------------------------------------------------------------
   אין שרת, ואין כוונה שיהיה. לכן המבחן אינו נשלח לשום מקום:
   הוא *נארז לתוך הקישור*. המורה מקבל קישור, שולח אותו בוואטסאפ,
   והמכשיר של התלמיד בונה מהקישור בדיוק את אותן שאלות.

   מה שהופך את זה לאפשרי הוא שכל מחולל שאלות כאן משתמש ב-
   Math.random בלבד. אם מזרעים אותו, אותו זרע מייצר את אותן
   שאלות ואת אותו סדר תשובות — אצל המורה ואצל התלמיד. הקישור
   נושא זרע ורשימת נושאים, לא עשרים שאלות מלאות, ולכן הוא נשאר
   קצר מספיק לוואטסאפ.

   שלוש מגבלות שנאמרות כאן במפורש כי הן חלק מהתכנון:
   · אין איסוף אוטומטי. התלמיד שולח קוד תשובות בוואטסאפ, והמורה
     מדביק אותו. זה המחיר של אפס שרת ואפס עלות.
   · אפשר לזייף קוד. הציון מחושב מחדש אצל המורה מתוך התשובות
     ולא נלקח מהתלמיד, אבל אין כאן הגנה קריפטוגרפית — זה מבחן
     כיתתי מעצב, לא בגרות.
   · שמות התלמידים נשארים במכשיר של המורה. הם לא עוברים דרך
     שום שרת, כי אין שרת.
   ============================================================ */
var GENV=3;                 /* גרסת המחוללים. מבחן שנוצר בגרסה אחרת
                               אינו נפתח — עדיף הודעה ברורה מאשר

/* --- מחולל מזורע. mulberry32: קצר, מהיר, ופיזור טוב דיו --- */
function withSeed(seed,fn){
  var real=Math.random,s=(seed>>>0)||1;
  Math.random=function(){
    s|=0; s=s+0x6D2B79F5|0;
    var t=Math.imul(s^s>>>15,1|s);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
  try{return fn()}finally{Math.random=real}
}
function hash32(str){
  var h=0x811c9dc5,i;
  for(i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193)}
  return (h>>>0);
}
/* base64url. הניקוי בפענוח אינו קוסמטי: וואטסאפ שובר מחרוזות
   ארוכות בשורות, ורווח אחד הורס את כל הקוד. */
function b64e(str){
  var bytes=new TextEncoder().encode(str),bin="",i;
  for(i=0;i<bytes.length;i+=8192)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));
  return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function b64d(s){
  s=String(s||"").replace(/[^A-Za-z0-9\-_]/g,"").replace(/-/g,"+").replace(/_/g,"/");
  while(s.length%4)s+="=";
  var bin=atob(s),bytes=new Uint8Array(bin.length),i;
  for(i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
/* הזרע של המשבצת נכנס למזהה: שני מבחנים באותם נושאים ובאותה
   רמה, שהמורה החליף באחד מהם שאלה, אינם אותו מבחן. מבחן ישן
   שאין לו זרעים מקבל בדיוק את המזהה שקיבל תמיד — אחרת ההגשות
   שכבר נקלטו אליו מתייתמות. */
function examId(spec){return hash32(spec.s+"|"+spec.q.map(function(x){
  return x[0]+x[1]+(x.length>2?"@"+x[2]:"")}).join(",")).toString(36)}
function encodeExam(spec){return b64e(JSON.stringify(spec))}
function decodeExam(code){
  try{
    var o=JSON.parse(b64d(code));
    if(!o||!o.q||!o.q.length||typeof o.s!=="number")return null;
    o.q=o.q.filter(function(x){return topicById(x[0])});
    return o.q.length?o:null;
  }catch(e){return null}
}
/* בונה את שאלות המבחן. אותו זרע → אותן שאלות, גם אצל המורה
   כשהוא בודק וגם אצל התלמיד כשהוא נבחן. */
function examQuestions(spec){
  /* מסננים נושאים שאינם מוכרים לאפליקציה הזאת, בדיוק כמו decodeExam.
     בלי הסינון buildQ מחזיר null על נושא זר, והמסך נופל על
     q.topic של null. עדיף לדלג בשקט מאשר להתרסק. */
  var pairs=(spec.q||[]).filter(function(x){return !!topicById(x[0])});
  /* מבחן שנבנה עם זרע לכל משבצת נבנה משבצת אחרי משבצת, וכל
     שאלה תלויה בזרע שלה בלבד — כך המורה יכול להחליף אחת מהן.
     מבחן ישן, בלי זרעים, חייב להיבנות בדיוק כפי שנבנה ביום
     שנשלח: אחרת הציון של מי שכבר נבחן משתנה למפרע. */
  if(pairs.length&&pairs.every(function(x){return typeof x[2]==="number"}))
    return pairs.map(function(p){return exBuildSlot(p)})
                .filter(function(q){return !!q});
  return withSeed(spec.s,function(){
    return pairs.map(function(pair){return buildQ(pair[0],pair[1])})
                .filter(function(q){return !!q});
  });
}
/* --- בחירת השאלות בידי המורה ---------------------------------
   עד כאן המורה בחר נושאים, רמה ומספר שאלות — והשאלות עצמן הוגרלו
   מאחורי גבו. הוא ראה אותן לראשונה רק אחרי שהמבחן כבר היה אצל
   התלמידים. מעכשיו כל שאלה היא משבצת נפרדת עם זרע משלה: המורה
   רואה אותה לפני השליחה, מחליף אותה בשאלה אחרת מאותו נושא,
   מסיר אותה, או מוסיף שאלה מנושא שחסר לו.

   הזרע הנפרד לכל משבצת הוא מה שמאפשר את זה. בזרם אקראי אחד
   ומשותף, כפי שהיה עד כאן, החלפה של השאלה השלישית הייתה משנה
   גם את הרביעית ואת החמישית — כלומר לא "החלפה" אלא הגרלה מחדש
   של כל מה שאחריה.

   24 ביט ולא 32: הזרע נוסע בתוך הקישור שנשלח בוואטסאפ, וזרע
   קצר יותר הוא קישור קצר יותר. שישה־עשר מיליון אפשרויות למשבצת
   הן הרבה מעבר למה שהמחולל עצמו יודע לייצר. */
function exNewSeed(){return (Math.random()*16777215)>>>0}
function exSlot(topicId,level){return [topicId,level,exNewSeed()]}
/* אותו זרע → אותה שאלה בדיוק: אצל המורה כשהוא בוחר, ואצל
   התלמיד כשהוא נבחן. */
function exBuildSlot(slot){
  if(!slot||!topicById(slot[0]))return null;
  return withSeed(slot[2],function(){return buildQ(slot[0],slot[1])})||null;
}
/* מסך הבנייה מצייר את עצמו מחדש אחרי כל לחיצה, ובניית עשרים
   וחמש שאלות בכל ציור מיותרת. המטמון הוא לתצוגה בלבד — מי
   שנבחן בונה את שאלותיו מחדש, כדי שאיש לא יערוך בטעות אובייקט
   שגם מסך אחר מחזיק בו. */
var EXQCACHE={};
/* לכל אפליקציה מנגנון שפה משלה, ולא לכולן אותם שמות. הפנייה
   דרך window ולא בשם ישיר, כי שם שאינו קיים באפליקציה מסוימת
   הוא שגיאה בעיני הבודקים — רעש שמסתיר שגיאה אמיתית. */
function exLangKey(){
  try{
    var g=(typeof window!=="undefined")?window:{};
    if(typeof g.xlg==="function")return g.xlg();
    if(typeof g.LG==="string")return g.LG;
    return (state&&state.settings&&state.settings.lang)||"he";
  }catch(e){return "he"}
}
function exPreviewQ(slot){
  if(!slot)return null;
  var k=slot[0]+"|"+slot[1]+"|"+slot[2]+"|"+exLangKey();
  if(!(k in EXQCACHE)){
    /* מורה שמחליף שאלות שוב ושוב מייצר מפתח חדש בכל לחיצה.
       מטמון שרק גדל הוא דליפה; מרוקנים אותו ומתחילים מחדש. */
    if(Object.keys(EXQCACHE).length>400)EXQCACHE={};
    EXQCACHE[k]=exBuildSlot(slot);
  }
  return EXQCACHE[k];
}
function exTopicName(id){
  var t=topicById(id); if(!t)return "";

function exRightAnswer(q){
  var i; if(!q||!q.options)return null;

/* המשבצות שהמורה עורך. נבנות מחדש רק כשנושא, רמה או מספר
   השאלות משתנים; עריכה של משבצת בודדת נשמרת. */
function exSlots(){
  if(EB.q&&EB.q.length)return EB.q;
  var tops=EB.topics.filter(function(x){return topicById(x)});
  if(!tops.length)tops=topicsForTrack(state.track).slice(0,3).map(function(t){return t.id});
  var q=[],i;
  for(i=0;i<EB.n;i++)q.push(exSlot(tops[i%tops.length],EB.level));
  /* מערבבים כאן ולא בשליחה: המורה רואה את הסדר הסופי ומאשר אותו. */
  EB.q=shuffle(q);

/* --- אחסון מבחנים והגשות, בנפרד מהתקדמות התלמיד --- */
var EX={list:[]};
/* --- הגירה מהמפתח המשותף הישן ---------------------------------

   ובאותו origin, ולכן מבחן שנבנה במתמטיקה הופיע ברשימת המבחנים של
   אנגלית והפיל את המסך. מעכשיו לכל אפליקציה מפתח משלה, ובטעינה
   מועתקות מהמפתח הישן רק רשומות שכל נושאיהן מוכרים כאן.
   המפתח הישן נשאר על כנו ואינו נמחק, כדי שגם אפליקציה אחרת תוכל
   לקלוט ממנו את המבחנים ששייכים לה. --------------------------- */
function exSpecKnown(spec){
  if(!spec||!spec.q||!spec.q.length)return false;
  for(var i=0;i<spec.q.length;i++){
    var pair=spec.q[i];
    if(!pair||!topicById(pair[0]))return false;

function exAdoptLegacy(){

    var raw=localStorage.getItem(EKEY_OLD); if(!raw)return;
    var old=JSON.parse(raw); if(!old||!old.list||!old.list.length)return;
    var have={},i,ex;
    for(i=0;i<EX.list.length;i++)have[EX.list[i].id]=1;
    for(i=0;i<old.list.length;i++){
      ex=old.list[i];

      if(!exSpecKnown(ex.spec))continue;

function exLoad(){

/* ------------------------------------------------------------
   ייצוא CSV של ההגשות.
   העתקת הטבלה נותנת טקסט מופרד בטאבים — נוח להדבקה, אבל לא קובץ.
   מורה שרוצה למיין, לסנן או לחשב ממוצע צריך גיליון. שורה לכל תלמיד,
   ועמודה לכל שאלה, כדי שאפשר יהיה לראות מיד באיזו שאלה נפלה הכיתה.
   ה-BOM בהתחלה הוא מה שגורם לאקסל לקרוא עברית, ערבית ורוסית נכון
   במקום ג׳יבריש — בלעדיו הקובץ נפתח שבור בדיוק אצל מי שצריך אותו.
   ------------------------------------------------------------ */
function csvCell(v){
  var s=(v===undefined||v===null)?"":String(v);
  return /[",\n\r;\t]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function csvRow(a){ return a.map(csvCell).join(",") }
/* ============================================================
   מצב מורה.
   בונה המבחן ומסך הציונים נועדו למורה. על טאבלט כיתתי, או על
   טלפון שהילד לוקח לעצמו, אין סיבה שהם יהיו במרחק הקשה אחת:
   ילד יכול למחוק מבחן, לראות ציונים של חברים, או לפתוח מבחן
   ולראות מראש את השאלות.
   זו אינה אבטחה, ואסור להציג אותה ככזאת: מי שיודע לפתוח כלי
   פיתוח יעקוף אותה בשנייה. זו נעילה מפני יד סקרנית — בדיוק מה
   שצריך כאן, ולא יותר.
   כל עוד לא נבחר קוד, שום דבר לא משתנה והמסכים גלויים כתמיד.
   ============================================================ */

function teWrite(o){try{o===null?localStorage.removeItem("niv-teacher"):localStorage.setItem("niv-teacher",JSON.stringify(o))}catch(e){}}

/* גיבוב חלש כגיבוי בלבד. SubtleCrypto קיים בכל דפדפן מודרני
   בהקשר מאובטח, ו-GitHub Pages הוא כזה. */
function teWeak(s){var h=5381,i;for(i=0;i<s.length;i++)h=((h*33)^s.charCodeAt(i))>>>0;return "w"+h.toString(16)}
function teHash(pin,salt,cb){
  var msg=salt+"|"+pin;
  try{
    if(window.crypto&&crypto.subtle&&crypto.subtle.digest&&window.TextEncoder){
      crypto.subtle.digest("SHA-256",new TextEncoder().encode(msg)).then(function(d){
        var a=Array.prototype.slice.call(new Uint8Array(d));
        cb(a.map(function(b){return ("0"+b.toString(16)).slice(-2)}).join(""));
      },function(){cb(teWeak(msg))});
      return;
    }
  }catch(e){}
  cb(teWeak(msg));
}
function teSalt(){
  var s="";
  try{
    var a=new Uint8Array(8);crypto.getRandomValues(a);
    s=Array.prototype.slice.call(a).map(function(b){return ("0"+b.toString(16)).slice(-2)}).join("");
  }catch(e){ s=String(Date.now())+Math.random().toString(36).slice(2) }
  return s;
}
/* השהיה אחרי ניסיונות כושלים. ארבע ספרות הן עשרת אלפים
   אפשרויות, וילד סבלני יכול לנסות הרבה. */
function teWait(){
  var r=teRead();if(!r||!r.bad||r.bad<3)return 0;
  var pen=Math.min(300,Math.pow(2,r.bad-3)*5)*1000;
  var left=Math.ceil(((r.badAt||0)+pen-Date.now())/1000);
  return left>0?left:0;
}

    var f=box.querySelectorAll("button:not([disabled]),input");
    if(!f.length)return;
    var a=f[0],z=f[f.length-1];
    if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}
    else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}
  });
  document.getElementById("te-no").onclick=teClose;
  document.getElementById("te-ok").onclick=teSubmit;
  var fg=document.getElementById("te-forgot");
  if(fg)fg.onclick=function(){ TE.msg=xt("teForgotHow"); teDialog() };
}
function teClose(){ TE.ask=false; TE.mode=""; TE.msg=""; teDialog(); }
function teSubmit(){
  if(TE.busy)return;
  var setting=(TE.mode==="set"||TE.mode==="change"||!teHas());
  var pin=(document.getElementById("te-pin")||{}).value||"";
  var rem=!!(document.getElementById("te-rem")||{}).checked;
  if(!/^[0-9]{4,8}$/.test(pin)){TE.msg=xt("teShort");teDialog();return}
  if(setting){
    var p2=(document.getElementById("te-pin2")||{}).value||"";
    if(pin!==p2){TE.msg=xt("teMismatch");teDialog();return}
    var salt=teSalt();
    TE.busy=true;
    teHash(pin,salt,function(h){
      TE.busy=false;
      teWrite({h:h,s:salt,bad:0,badAt:0});
      teSetOpen(true,rem);
      TE.ask=false;TE.mode="";TE.msg="";
      teDialog(); render();
    });
    return;
  }
  if(teWait()){teDialog();return}
  var rec=teRead(); if(!rec){teClose();return}
  TE.busy=true;
  teHash(pin,rec.s,function(h){
    TE.busy=false;
    if(h===rec.h){
      rec.bad=0;rec.badAt=0;teWrite(rec);
      teSetOpen(true,rem);
      TE.ask=false;TE.mode="";TE.msg="";
      teDialog(); render();
    }else{
      rec.bad=(rec.bad||0)+1;rec.badAt=Date.now();teWrite(rec);
      TE.msg=xt("teBad"); teDialog();
    }
  });
}
function teAsk(mode){ TE.ask=true; TE.mode=mode||""; TE.msg=""; teDialog() }
function teLock(){ teSetOpen(false); render() }
function teRemove(){ teWrite(null); teSetOpen(false); render() }
/* נעילה אוטומטית אחרי שהאפליקציה הייתה מוסתרת זמן־מה.
   מורה שבנה מבחן ומסר את הטאבלט בלי ללחוץ "יציאה" השאיר אותו
   פתוח, וזה בדיוק המצב שהתכונה אמורה למנוע. שתי דקות מספיקות
   כדי לא להפריע לעבודה רצופה, ולנעול כשהמכשיר עבר יד.
   נעילה שנשמרה כ"לזכור במכשיר הזה" היא בחירה מפורשת ולא נוגעים בה. */
var TE_HID=0;
try{
  document.addEventListener("visibilitychange",function(){
    if(document.hidden){ TE_HID=Date.now(); return }
    if(!TE_HID||!teHas())return;
    var away=Date.now()-TE_HID; TE_HID=0;
    if(away<120000)return;
    var kept=false;
    try{ kept=localStorage.getItem("niv-teacher"+"-open")==="1" }catch(e){}
    if(kept)return;
    try{ if(sessionStorage.getItem("niv-teacher"+"-open")!=="1")return }catch(e){ return }
    teSetOpen(false); render();
  });
}catch(e){}

/* ?teacher=1 פותח את החלון, והפרמטר מוסר מיד מהכתובת כדי שלא
   יישאר בקישור ששותף או בהיסטוריה. */
(function(){
  try{
    var u=new URL(location.href);
    if(u.searchParams.get("teacher")==="1"){
      u.searchParams.delete("teacher");
      history.replaceState(null,"",u.pathname+(u.searchParams.toString()?"?"+u.searchParams:"")+u.hash);
      /* שער התנאים יושב מעל הכול, וכך צריך להיות: אי־אפשר להשתמש
         באפליקציה לפני שהוסכם עליהם. חלון הקוד ממתין לו במקום
         להיפתח מתחתיו ולהיראות תקוע. */
      var tries=0;
      (function waitLegal(){
        if(tries++>=600){ teAsk(teHas()?"":"set"); return }
        /* LEGAL.accepted נוצר רק כש-protect.js מאותחל. עד אז אין
           עדיין מה לבדוק, ובדיקה של ".lg-wrap" לבדה מחזירה "אין
           שער" בדיוק ברגע שלפני שהוא נבנה. */
        var ready=false;
        try{ ready=!!(window.LEGAL&&window.LEGAL.accepted) }catch(e){}
        if(!ready){ setTimeout(waitLegal,200); return }
        var ok=true;
        try{ ok=!!window.LEGAL.accepted() }catch(e){ ok=true }
        if(!ok){ setTimeout(waitLegal,200); return }
        teAsk(teHas()?"":"set");
      })();
    }
  }catch(e){}
})();

function marksCsv(ex){
  var subs=(ex.subs||[]).slice().sort(function(a,b){return b.pct-a.pct});
  var n=ex.spec.q.length,i;
  var head=[xt("mkCsvName"),xt("mkCsvPct"),xt("mkCsvOk"),xt("mkCsvTotal"),
            xt("mkCsvDate"),xt("mkCsvValid")];
  for(i=0;i<n;i++)head.push(xf("mkCsvQ",i+1));
  var rows=[csvRow(head)];
  subs.forEach(function(s){
    var r=[s.name||xt("mkNoName"),s.pct,s.ok,s.n,s.date||"",
           s.valid?xt("mkCsvYes"):xt("mkCsvNo")];
    for(i=0;i<n;i++){
      var p=s.per&&s.per[i];
      r.push(p?(p.ok?xt("mkCsvYes"):xt("mkCsvNo")):"");
    }
    rows.push(csvRow(r));
  });
  return "\ufeff"+rows.join("\r\n")+"\r\n";
}
/* כרום מוחק את שם הקובץ כולו ברגע שיש בו תו אחד שאינו ASCII —
   לא רק עברית: גם é או מקף ארוך. מה שיורד נקרא "download", בלי
   סיומת, ואקסל לא יודע לפתוח אותו. מורה שקרא למבחן שלו בעברית
   קיבל קובץ בלי שם ובלי סוג. לכן השם מתועתק ללטינית. */
var TRLIT={
  "א":"a","ב":"b","ג":"g","ד":"d","ה":"h","ו":"v","ז":"z","ח":"ch","ט":"t","י":"y",
  "כ":"k","ך":"k","ל":"l","מ":"m","ם":"m","נ":"n","ן":"n","ס":"s","ע":"","פ":"f",
  "ף":"f","צ":"tz","ץ":"tz","ק":"k","ר":"r","ש":"sh","ת":"t",
  "ا":"a","ب":"b","ت":"t","ث":"th","ج":"j","ح":"h","خ":"kh","د":"d","ذ":"dh","ر":"r",
  "ز":"z","س":"s","ش":"sh","ص":"s","ض":"d","ط":"t","ظ":"z","ع":"","غ":"gh","ف":"f",
  "ق":"q","ك":"k","ل":"l","م":"m","ن":"n","ه":"h","و":"w","ي":"y","ة":"h","ى":"a","ء":"",
  "أ":"a","إ":"i","آ":"a","ؤ":"w","ئ":"y",
  "а":"a","б":"b","в":"v","г":"g","д":"d","е":"e","ё":"e","ж":"zh","з":"z","и":"i",
  "й":"y","к":"k","л":"l","м":"m","н":"n","о":"o","п":"p","р":"r","с":"s","т":"t",
  "у":"u","ф":"f","х":"kh","ц":"ts","ч":"ch","ш":"sh","щ":"sch","ъ":"","ы":"y","ь":"",
  "э":"e","ю":"yu","я":"ya"
};
function asciiName(s){
  var i,c,out="";
  /* é ו-ü הם אות לטינית ועוד סימן מצורף. פירוק והסרת הסימן משאיר e ו-u. */
  try{ s=s.normalize("NFD").replace(/[\u0300-\u036f]/g,"") }catch(e){}
  for(i=0;i<s.length;i++){
    c=s.charAt(i);
    if(/[A-Za-z0-9]/.test(c)){ out+=c; continue }
    var lower=c.toLowerCase();
    if(TRLIT[lower]!==undefined){ out+=TRLIT[lower]; continue }
    out+=" ";                     /* כל השאר — רווח, שיתכווץ בהמשך */
  }
  return out.replace(/\s+/g," ").trim();
}
function csvFileName(ex){
  var t=asciiName(String(ex.spec.t||"")).slice(0,60).trim();
  var d=String(ex.date||todayIso()).replace(/[^0-9-]/g,"");
  /* כשלא נשאר כלום קריא, מזהה המבחן הוא מה שמבדיל בין שני קבצים
     שירדו באותו יום. */
  if(!t) t="exam "+String(ex.id||"").slice(0,6);
  return (t+" "+d).trim()+".csv";
}
function downloadCsv(ex){
  var txt=marksCsv(ex),url=null,a=document.createElement("a");
  try{
    url=URL.createObjectURL(new Blob([txt],{type:"text/csv;charset=utf-8"}));
  }catch(e){
    url="data:text/csv;charset=utf-8,"+encodeURIComponent(txt);
  }
  a.href=url; a.download=csvFileName(ex);
  a.style.cssText="position:fixed;inset-inline-start:-9999px";
  document.body.appendChild(a); a.click();
  setTimeout(function(){
    if(a.parentNode)a.parentNode.removeChild(a);
    if(url&&url.indexOf("blob:")===0){try{URL.revokeObjectURL(url)}catch(e){}}
  },400);
}
function marksTable(ex){
  var out=(ex.spec.t||xt("exam"))+"\n";
  out+=xt("mkTblHead")+"\n";
  (ex.subs||[]).slice().sort(function(a,b){return b.pct-a.pct}).forEach(function(s){
    var wrong=uniq(s.per.filter(function(p){return !p.ok}).map(function(p){return p.topicName}));
    out+=(s.name||xt("mkNoName"))+"\t"+s.pct+"\t"+s.ok+"/"+s.n+"\t"+wrong.join(", ")+"\n";
  });
  return out;
}

var SIT={spec:null,id:"",qs:[],i:0,name:"",answers:[],phase:"intro",code:"",copied:false};

function sitStart(){
  var nm=$("#sitName"); SIT.name=nm?nm.value.trim():"";
  SIT.qs=examQuestions(SIT.spec);
  /* אם לא נותרה אף שאלה שאפשר לבנות (למשל מבחן של אפליקציה אחרת),
     מציגים את מסך המבחן השבור במקום ליפול על שאלה שאינה קיימת. */
  if(!SIT.qs.length){view="badexam"; render(); return}
  SIT.answers=SIT.qs.map(function(){return -1});

  window.scrollTo(0,0); render();

function sitAnswer(i){
  if(SIT.phase!=="ask")return;
  SIT.answers[SIT.i]=i;

}
function sitNext(){
  if(SIT.i+1<SIT.qs.length){SIT.i++;window.scrollTo(0,0);render();return}

     אינה אמורה לסיים מבחן. */
  SIT.phase="review"; stopSpeak(); window.scrollTo(0,0); render();
}
function sitGo(i){
  SIT.i=clamp(i,0,SIT.qs.length-1); SIT.phase="ask";
  window.scrollTo(0,0); render();

function sitFinish(){
  SIT.phase="done";
  SIT.code=encodeResult(SIT.id,SIT.name,SIT.answers);

function sitGrade(){
  var ok=0,i;
