LESSONS.cbond=[
  ST_("אטומים נקשרים כדי להשלים שמונה אלקטרוני ערכיות, כמו הגזים האצילים.","ترتبط الذرات لتكمل ثمانية إلكترونات تكافؤ، مثل الغازات النبيلة.","Атомы связываются, чтобы достроить восемь валентных электронов, как благородные газы.","Atoms bond to complete eight valence electrons, like the noble gases."),
  ST_("בקישור יוני מתכת מעבירה אלקטרונים ללא-מתכת. נוצרים יונים שנמשכים זה לזה.","في الرابطة الأيونية يعطي الفلز إلكترونات للا فلز. تتكون أيونات تتجاذب.","В ионной связи металл отдаёт электроны неметаллу. Образуются притягивающиеся ионы.","In an ionic bond a metal gives electrons to a nonmetal. Ions form and attract."),
  ST_("בקישור קוולנטי שני לא-מתכתים חולקים זוגות אלקטרונים.","في الرابطة التساهمية يتشارك لا فلزان أزواج الإلكترونات.","В ковалентной связи два неметалла делятся электронными парами.","In a covalent bond two nonmetals share electron pairs."),
  ST_("בנוסחת תרכובת יונית המטענים מאוזנים: Mg2+ עם שני Cl- נותן MgCl2.","في صيغة المركب الأيوني تتوازن الشحنات: Mg2+ مع Cl- مرتين يعطي MgCl2.","В формуле ионного соединения заряды уравновешены: Mg2+ с двумя Cl- даёт MgCl2.","In an ionic formula the charges balance: Mg2+ with two Cl- gives MgCl2.")];
LESSONS.cstoi=[
  ST_("מול הוא יחידת ספירה של כימאים: 6.02×10^23 חלקיקים, כמו תריסר רק ענק.","المول هو وحدة عدّ الكيميائيين: 6.02×10^23 جسيماً، مثل الدزينة لكن ضخمة.","Моль — счётная единица химиков: 6.02×10^23 частиц, как дюжина, только огромная.","A mole is the chemist's counting unit: 6.02×10^23 particles, like a giant dozen."),
  ST_("המסה המולרית היא מסת מול אחד בגרמים: M של מים היא 18 גרם למול.","الكتلة المولية هي كتلة مول واحد بالغرام: M للماء هي 18 غراماً للمول.","Молярная масса — масса одного моля в граммах: M воды равна 18 г/моль.","Molar mass is the mass of one mole in grams: M of water is 18 g/mol."),
  ST_("מספר המולים שווה למסה חלקי מסה מולרית: n = m / M.","عدد المولات يساوي الكتلة مقسومة على الكتلة المولية: n = m / M.","Число молей равно массе делить на молярную массу: n = m / M.","Moles equal mass divided by molar mass: n = m / M."),
  ST_("ריכוז אומר כמה מול מומס יש בליטר תמיסה אחד: c = n / V.","التركيز يعني كم مول مذاب في لتر واحد: c = n / V.","Концентрация — сколько моль растворено в одном литре: c = n / V.","Concentration tells how many moles are in one liter: c = n / V.")];
LESSONS.credox=[
  ST_("חמצון הוא אובדן אלקטרונים, וחיזור הוא קבלת אלקטרונים. הם תמיד באים ביחד.","الأكسدة هي فقدان إلكترونات، والاختزال هو كسبها. هما يحدثان دائماً معاً.","Окисление — потеря электронов, восстановление — приобретение. Они всегда идут вместе.","Oxidation is losing electrons, reduction is gaining them. They always happen together."),
  ST_("מספר החמצון הוא המטען שהיה לאטום אם כל הקשרים היו יוניים. חמצן הוא בדרך כלל 2-.","عدد الأكسدة هو الشحنة التي كانت للذرة لو كانت كل الروابط أيونية. الأكسجين عادة 2-.","Степень окисления — заряд атома, если бы все связи были ионными. Кислород обычно 2-.","The oxidation number is the charge an atom would have if all bonds were ionic. Oxygen is usually 2-."),
  ST_("מי שהתחמצן הוא החומר המחזר, ומי שהתחזר הוא החומר המחמצן.","ما تأكسد هو العامل المختزِل، وما اختُزل هو العامل المؤكسِد.","Что окислилось — восстановитель, что восстановилось — окислитель.","What is oxidized is the reducing agent; what is reduced is the oxidizing agent."),
  ST_("באיזון תגובה סופרים אטומים מכל יסוד בשני האגפים ומשלימים מקדמים.","عند موازنة التفاعل نعد ذرات كل عنصر في الطرفين ونكمل المعاملات.","При уравнивании считают атомы каждого элемента с обеих сторон и подбирают коэффициенты.","To balance a reaction, count each element on both sides and fill in coefficients.")];
LESSONS.cacid=[
  ST_("חומצה תורמת H+ לתמיסה, ובסיס תורם OH-.","الحمض يمنح H+ للمحلول، والقاعدة تمنح OH-.","Кислота отдаёт H+ в раствор, а основание — OH-.","An acid donates H+ to the solution, and a base donates OH-."),
  ST_("סולם ה-pH נע מ-0 עד 14: מתחת ל-7 חומצתי, 7 נייטרלי, מעל 7 בסיסי.","مقياس pH يتراوح من 0 إلى 14: أقل من 7 حمضي، 7 متعادل، أكثر من 7 قاعدي.","Шкала pH идёт от 0 до 14: меньше 7 — кисло, 7 — нейтрально, больше 7 — щёлочно.","The pH scale runs 0 to 14: below 7 acidic, 7 neutral, above 7 basic."),
  ST_("ככל שה-pH נמוך יותר התמיסה חומצתית יותר. כל יחידה היא פי עשרה בחומצתיות.","كلما انخفض pH زادت الحموضة. كل وحدة تعني عشرة أضعاف.","Чем ниже pH, тем кислее. Каждая единица — в десять раз.","The lower the pH, the more acidic. Each unit is a factor of ten."),
  ST_("בתגובת סתירה חומצה ובסיס מנטרלים זה את זה ונוצרים מלח ומים.","في التعادل يتحيّد الحمض والقاعدة ويتكون ملح وماء.","При нейтрализации кислота и основание гасят друг друга, образуя соль и воду.","In neutralization an acid and a base cancel out, forming salt and water.")];
LESSONS.cenergy=[
  ST_("בתגובה אקזותרמית משתחרר חום החוצה, ובתגובה אנדותרמית החום נספג פנימה.","في التفاعل الطارد تخرج الحرارة، وفي الماص تُمتص الحرارة.","В экзотермической реакции тепло выделяется, в эндотермической — поглощается.","An exothermic reaction lets heat out; an endothermic one takes heat in."),
  ST_("דלתא H שלילי בתגובה אקזותרמית וחיובי בתגובה אנדותרמית.","دلتا H سالب في التفاعل الطارد وموجب في الماص.","Дельта H отрицательна в экзотермической и положительна в эндотермической.","Delta H is negative for exothermic and positive for endothermic."),
  ST_("הקצב עולה כשמחממים, כשהחלקיקים קטנים, כשהריכוז גבוה וכשיש זרז.","تزداد السرعة بالتسخين، وصغر الجسيمات، وارتفاع التركيز، ووجود محفز.","Скорость растёт с нагревом, мелкими частицами, высокой концентрацией и катализатором.","Rate rises with heating, small particles, high concentration, and a catalyst."),
  ST_("זרז מוריד את אנרגיית השפעול, מאיץ את התגובה, ונשאר בלי שינוי בסוף.","المحفز يخفض طاقة التنشيط، يسرّع التفاعل، ويبقى بلا تغيير في النهاية.","Катализатор снижает энергию активации, ускоряет реакцию и остаётся неизменным.","A catalyst lowers activation energy, speeds the reaction, and stays unchanged.")];
LESSONS.cfood=[
  ST_("ויטמינים ומינרלים הם רכיבי מזון שהגוף צריך בכמויות קטנות, בלי אנרגיה.","الفيتامينات والمعادن مكونات غذائية يحتاجها الجسم بكميات صغيرة، بلا طاقة.","Витамины и минералы — вещества, нужные телу в малых количествах, без энергии.","Vitamins and minerals are nutrients the body needs in small amounts, with no energy."),
  ST_("ויטמינים C ו-B מסיסים במים ואינם נאגרים. ויטמינים A, D, E, K מסיסים בשומן.","فيتامينا C وB ذائبان في الماء ولا يُخزنان. A وD وE وK ذائبة في الدهون.","Витамины C и B растворимы в воде и не запасаются. A, D, E, K — в жирах.","Vitamins C and B dissolve in water and are not stored. A, D, E, K dissolve in fat."),
  ST_("חומצת שומן רוויה בנויה מקשרים בודדים בלבד. בלתי רוויה מכילה קשר כפול אחד לפחות.","الحمض الدهني المشبع مبني من روابط أحادية فقط. غير المشبع يحوي رابطة مزدوجة على الأقل.","Насыщенная жирная кислота состоит только из одинарных связей. Ненасыщенная имеет двойную.","A saturated fatty acid has only single bonds. An unsaturated one has at least one double bond."),
  ST_("טריגליצריד הוא מולקולת שומן: גליצרול מחובר לשלוש חומצות שומן.","الدهون الثلاثية جزيء دهني: غليسرول مرتبط بثلاثة أحماض دهنية.","Триглицерид — молекула жира: глицерин, связанный с тремя жирными кислотами.","A triglyceride is a fat molecule: glycerol joined to three fatty acids.")];
