   שהמעבר ביניהם לא ירגיש כמו מעבר לאתר אחר. כל המידות לוגיות —
   הדף מתחלף בין ארבע שפות, ושתיים מהן נכתבות לשמאל.

  --bg:#f6f7fb; --bg-elev:#ffffff; --text:#14181f; --text-soft:#4a5464;
  --line:#e2e6ef; --brand:#2f5fd8; --brand-ink:#ffffff; --brand-soft:#eaf0ff; --radius:18px;
  --ok:#1a7f4b; --ok-soft:#e3f5ea;

}
:root[data-theme="dark"]{
  --bg:#0b0f17; --bg-elev:#131926; --text:#eef2f9; --text-soft:#aab4c6;
  --line:#222c3d; --brand:#7ba2ff; --brand-ink:#0b0f17; --brand-soft:#18233a;
  --ok:#6ee7a8; --ok-soft:#14301f;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 34px -20px rgba(0,0,0,.8);
  --shadow-lg:0 2px 4px rgba(0,0,0,.55),0 26px 54px -26px rgba(0,0,0,.9);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b0f17; --bg-elev:#131926; --text:#eef2f9; --text-soft:#aab4c6;
    --line:#222c3d; --brand:#7ba2ff; --brand-ink:#0b0f17; --brand-soft:#18233a;
    --ok:#6ee7a8; --ok-soft:#14301f;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 34px -20px rgba(0,0,0,.8);
    --shadow-lg:0 2px 4px rgba(0,0,0,.55),0 26px 54px -26px rgba(0,0,0,.9);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--text);
  font:400 18px/1.65 Heebo,"Segoe UI",system-ui,Arial,sans-serif;
  -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased;
}
/* Heebo אינו מכיל גליפים ערביים ולא קיריליים. שתי המשפחות נטענות
   מאותה בקשה, וקובצי הפונט נמשכים רק כשבאמת מוצג טקסט בכתב הזה. */
html[lang="ar"] body,html[lang="ar"] button,html[lang="ar"] .btn{
  font-family:"Noto Sans Arabic",Heebo,"Segoe UI",system-ui,Arial,sans-serif;
}
html[lang="ru"] body,html[lang="ru"] button,html[lang="ru"] .btn{
  font-family:"Noto Sans",Heebo,"Segoe UI",system-ui,Arial,sans-serif;
}
.wrap{max-width:1080px; margin-inline:auto; padding-inline:clamp(14px,4vw,26px)}
.skip{
  position:absolute; inset-block-start:-100px; inset-inline-start:12px; z-index:9;
  background:var(--brand); color:var(--brand-ink); padding:12px 18px; border-radius:12px;
  text-decoration:none; font-weight:700;
}
.skip:focus{inset-block-start:12px}
:focus-visible{outline:3px solid var(--brand); outline-offset:2px}

/* --- סרגל עליון --- */
.topbar{
  position:sticky; inset-block-start:0; z-index:8;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px); border-block-end:1px solid var(--line);
}
.topbar .wrap{display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px; min-block-size:64px; padding-block:8px}
.logo{
  display:inline-flex; align-items:center; gap:11px; text-decoration:none; color:inherit;
  font-weight:800; font-size:1.05rem; line-height:1.15; min-block-size:44px; margin-inline-end:auto;
}
.mark{
  inline-size:38px; block-size:38px; border-radius:12px; flex:none; display:grid; place-items:center;
  color:var(--brand-ink); background:linear-gradient(145deg,var(--brand),color-mix(in srgb,var(--brand) 72%,#000));
}
.mark svg{inline-size:22px; block-size:22px}
@media (max-width:560px){#me{display:none}}
.home{
  display:inline-flex; align-items:center; min-block-size:44px; padding-inline:12px; border-radius:12px;
  color:var(--text-soft); text-decoration:none; font-weight:600;
}
.home:hover{color:var(--text); background:var(--brand-soft)}
.lang{display:flex; gap:4px}
.lang button{
  min-block-size:44px; min-inline-size:44px; padding-inline:10px; border:1px solid var(--line); border-radius:12px;
  background:var(--bg-elev); color:var(--text-soft); cursor:pointer; font:700 .9rem/1 Heebo,system-ui,sans-serif;
}
.lang button[aria-pressed="true"]{background:var(--brand); color:var(--brand-ink); border-color:var(--brand)}

/* --- כותרת --- */
.hero{text-align:center; padding-block:clamp(30px,6vw,64px) clamp(14px,3vw,24px)}
h1{margin:0 0 12px; font-size:clamp(1.8rem,4.6vw,2.7rem); font-weight:800; line-height:1.18; letter-spacing:-.01em}
.lead{margin:0 auto; max-inline-size:640px; color:var(--text-soft); font-size:1.08rem}
.free-line{
  display:inline-flex; flex-wrap:wrap; justify-content:center; gap:6px 10px; margin:20px auto 0;
  padding:12px 18px; border-radius:14px; background:var(--ok-soft); color:var(--ok); font-weight:700;
}

/* --- כרטיסי המסלולים --- */
.plans{display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); padding-block:18px 8px}
.plan{
  position:relative; display:flex; flex-direction:column; gap:12px;
  background:var(--bg-elev); border:1px solid var(--line); border-radius:var(--radius);
  padding:24px 22px; box-shadow:var(--shadow);
}
.plan.hot{border-color:var(--brand); box-shadow:var(--shadow-lg)}
.plan .tag{
  position:absolute; inset-block-start:-13px; inset-inline-start:20px;
  background:var(--brand); color:var(--brand-ink); font-weight:800; font-size:.8rem;
  padding:5px 12px; border-radius:999px;
}
.plan h2{margin:0; font-size:1.3rem; font-weight:800}
.plan .who{margin:0; color:var(--text-soft); font-size:.96rem; min-block-size:3.1em}
.price{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap}
.price .amt{font-size:2.3rem; font-weight:800; line-height:1; letter-spacing:-.02em; direction:ltr; unicode-bidi:isolate}
.price .per{color:var(--text-soft); font-weight:500}
.plan ul{margin:0; padding:0; list-style:none; display:grid; gap:8px; color:var(--text-soft); font-size:.96rem}
.plan li{display:flex; gap:9px; align-items:flex-start}
.plan li::before{content:"✓"; color:var(--ok); font-weight:800; flex:none}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px; min-block-size:48px;
  padding-inline:20px; border-radius:14px; border:1px solid var(--brand); background:var(--brand);
  color:var(--brand-ink); font-weight:700; font-size:1rem; text-decoration:none; cursor:pointer;
  margin-block-start:auto;
}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:var(--bg-elev); color:var(--text); border-color:var(--line)}

/* --- קטעים --- */
.blk{padding-block:clamp(26px,5vw,44px); border-block-start:1px solid var(--line)}
.h2{margin:0 0 6px; font-size:clamp(1.4rem,3.6vw,1.9rem); font-weight:800; letter-spacing:-.01em}
.h2s{margin:0 0 16px; color:var(--text-soft)}

/* --- טבלת האפליקציות --- */
.tbl{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); background:var(--bg-elev)}
/* בלי רוחב מינימלי: בטלפון הטבלה נכנסת לרוחב המסך ותא ״חינם לתמיד״ נשבר לשתי שורות במקום להיחתך */
table{border-collapse:collapse; inline-size:100%}
th,td{padding:12px 16px; text-align:start; border-block-start:1px solid var(--line); vertical-align:top}
thead th{border-block-start:0; background:var(--brand-soft); font-size:.9rem; color:var(--text-soft)}
td.p{white-space:nowrap; font-weight:800; direction:ltr; unicode-bidi:isolate; text-align:end}
html[dir="ltr"] td.p{text-align:start}
td.p.free{color:var(--ok); white-space:normal}
td .sm{display:block; color:var(--text-soft); font-size:.86rem; font-weight:500}

/* --- מוסדות --- */
.duo{display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.box{background:var(--bg-elev); border:1px solid var(--line); border-radius:var(--radius); padding:20px 22px; display:flex; flex-direction:column; gap:8px}
.box h3{margin:0; font-size:1.12rem}
.box p{margin:0; color:var(--text-soft)}
.box .price{margin-block:4px}

/* --- שאלות נפוצות --- */
.faq{display:grid; gap:10px}
.faq details{background:var(--bg-elev); border:1px solid var(--line); border-radius:14px; padding:0 18px}
.faq summary{cursor:pointer; font-weight:700; padding-block:14px; min-block-size:44px; list-style:none; display:flex; justify-content:space-between; gap:12px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+"; color:var(--brand); font-weight:800; font-size:1.3rem; line-height:1}
.faq details[open] summary::after{content:"−"}
.faq p{margin:0 0 16px; color:var(--text-soft)}

footer.site{padding-block:26px 40px; color:var(--text-soft); font-size:.9rem; display:flex; flex-wrap:wrap; gap:8px 18px; border-block-start:1px solid var(--line)}
footer.site a{color:var(--brand)}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}

var $=function(s){return document.querySelector(s)};
var esc=function(x){return String(x).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
/* אותו מפתח שפה כמו בדף הבית — site-lang — כדי שמי שבחר שפה שם
   ינחת כאן באותה שפה. זה מפתח של האתר, לא של אפליקציה. */
var LKEY="site-lang", LANGS=[["he","עברית"],["ar","العربية"],["ru","Русский"],["en","English"]];
function savedLang(){try{return localStorage.getItem(LKEY)||""}catch(e){return""}}
function guessLang(){
  var l=(navigator.language||"").toLowerCase().split("-")[0];
  return {he:1,iw:1}[l]?"he":{ar:1,ru:1,en:1}[l]?l:"he";
}
var LG=savedLang()||guessLang(); if(!TR[LG])LG="he";
/* מצב כהה: אותה דריסה ידנית שדף הבית שומר ב-site-theme, נקראת בלבד */
try{var th=localStorage.getItem("site-theme"); if(th)document.documentElement.setAttribute("data-theme",th)}catch(e){}

function mail(plan,S){
  return "mailto:"+EMAIL+"?subject="+encodeURIComponent(S.mailSubject.replace("{plan}",plan));
}
function priceHtml(amt,per,S){
  return '<div class="price"><span class="amt">'+esc(amt)+' ₪</span><span class="per">'+esc(per||S.perMonth)+'</span></div>';
}
function paint(){
  var S=TR[LG], r=document.documentElement;
  r.setAttribute("lang",LG); r.setAttribute("dir",S.dir);
  document.title=S.title;
  $("#me").textContent=S.me; $(".logo").setAttribute("aria-label",S.me);
  $("#home").textContent=S.home; $("#skip").textContent=S.skip;
  $("#h1").textContent=S.h1; $("#lead").textContent=S.lead; $("#freeLine").textContent=S.freeLine;
  $("#plansT").textContent=S.plansT; $("#plansS").textContent=S.plansS;
  $("#planGrid").innerHTML=PLANS.map(function(p){
    var name=S.names[p.id];
    return '<article class="plan'+(p.hot?' hot':'')+'">'+
      (p.hot?'<span class="tag">'+esc(S.popular)+'</span>':'')+
      '<h2>'+esc(name)+'</h2><p class="who">'+esc(S.who[p.id])+'</p>'+
      (p.from!==undefined
        ? '<div class="price"><span class="per">'+esc(S.from)+'</span><span class="amt">'+p.from+' ₪</span><span class="per">'+esc(S.perMonth)+'</span></div>'
        : priceHtml(p.price,"",S))+
      '<ul>'+S.feats[p.id].map(function(f){return '<li>'+esc(f)+'</li>'}).join("")+'</ul>'+
      '<a class="btn" href="'+mail(name,S)+'">'+esc(S.start)+'</a>'+
    '</article>';
  }).join("");
  $("#appsT").textContent=S.appsT; $("#appsS").textContent=S.appsS;
  $("#appTbl").innerHTML='<thead><tr><th>'+esc(S.colApp)+'</th><th>'+esc(S.colPrice)+'</th></tr></thead><tbody>'+
    APPS.map(function(a){
      var cell=a.price===0?'<td class="p free">'+esc(S.free)+'</td>'
        :'<td class="p">'+a.price+' ₪'+(a.once?'<span class="sm">'+esc(S.once)+'</span>':'<span class="sm">'+esc(S.perMonth)+'</span>')+'</td>';
      return '<tr><td>'+esc(a.n[LG])+'</td>'+cell+'</tr>';
    }).join("")+'</tbody>';
  $("#orgT").textContent=S.orgT; $("#orgS").textContent=S.orgS;
  $("#orgGrid").innerHTML=
    '<div class="box"><h3>'+esc(S.teacherT)+'</h3>'+priceHtml(TEACHER,"",S)+'<p>'+esc(S.teacherP)+'</p>'+
      '<a class="btn ghost" href="'+mail(S.teacherT,S)+'">'+esc(S.contact)+'</a></div>'+
    '<div class="box"><h3>'+esc(S.schoolT)+'</h3>'+priceHtml(SCHOOL," ",S)+'<p>'+esc(S.schoolP)+'</p>'+
      '<a class="btn ghost" href="'+mail(S.schoolT,S)+'">'+esc(S.contact)+'</a></div>';
  $("#faqT").textContent=S.faqT;
  $("#faqList").innerHTML=S.faq.map(function(q){
    return '<details><summary>'+esc(q[0])+'</summary><p>'+esc(q[1])+'</p></details>'}).join("");
  $("#foot").textContent=S.foot; $("#backHome").textContent=S.back; $("#terms").textContent=S.terms;
  $("#lang").setAttribute("aria-label",S.home);
  $("#lang").innerHTML=LANGS.map(function(x){
    return '<button type="button" data-l="'+x[0]+'" aria-pressed="'+(x[0]===LG)+'" lang="'+x[0]+'">'+esc(x[1])+"</button>"}).join("");
}
document.addEventListener("click",function(e){
  var l=e.target.closest("#lang [data-l]"); if(!l)return;
  LG=l.getAttribute("data-l"); try{localStorage.setItem(LKEY,LG)}catch(err){}
  paint();
});
window.addEventListener("legal:lang",function(e){
  var k=e&&e.detail; if(!k||!TR[k]||k===LG)return;
  LG=k; try{localStorage.setItem(LKEY,LG)}catch(err){}
  paint();
});
paint();
</script>
