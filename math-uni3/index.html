   מחוללי השאלות — אלגברה מופשטת
   ============================================================ */

/* ---------- 9. אריתמטיקה מודולרית ---------- */
function genModAr(L){
  var a,b,n,k;
  if(L===1){
    var r,atry=0;
    do{ n=ri(5,12);a=ri(20,99); r=a%n; }
    while(atry++<80&&(r===0||r===1||new Set([r,Math.floor(a/n),n-r,a-n]).size<4));
    return {ask:_f("מהו {0} מודולו {1}?", num(a), num(n)),
      expr:num(a)+" mod "+num(n)+" = ?",
      ans:W(num(r)),
      wrong:[
        W(num(Math.floor(a/n)),_("זו המנה השלמה, לא השארית. מודולו מחזיר את מה שנשאר.")),
        W(num(n-r),_("זו השארית המשלימה. מחסרים כפולות של n עד שנשארים בין 0 ל-n פחות 1.")),
        W(num(a-n),_("חיסרתם פעם אחת בלבד. ממשיכים עד שהתוצאה קטנה מ-n."))
      ],
      steps:[
        S(_("כמה פעמים n נכנס"),"",num(n)+" · "+num(Math.floor(a/n))+" = "+num(n*Math.floor(a/n))),
        S(_("מה נשאר"),"",num(a)+" − "+num(n*Math.floor(a/n))+" = "+num(r)),
        S(_("בודקים תחום"),_("השארית תמיד בין 0 ל-n פחות 1."),"0 ≤ "+num(r)+" < "+num(n))
      ],rule:"mod",hint:_("מודולו הוא מה שנשאר אחרי שמורידים את כל הכפולות של n.")};
  }
  if(L===2){
    /* a שהוא כפולה של n היה מאפס כל מכפלה, ולכן מגרילים את שניהם מחדש */
    var pr,ptry=0;
    do{ n=ri(5,11);a=ri(4,20);b=ri(4,20); pr=(a*b)%n; }
    while(ptry++<80&&(pr===0||new Set([pr,(a%n)*(b%n),(a+b)%n,a*b]).size<4));
    return {ask:_f("חשבו {0} · {1} מודולו {2}", num(a), num(b), num(n)),
      expr:num(a)+" · "+num(b)+" (mod "+num(n)+")",
      ans:W(num(pr)),
      wrong:[
        W(num((a%n)*(b%n)),_("צמצמתם כל גורם, אבל שכחתם לצמצם את המכפלה שהתקבלה.")),
        W(num((a+b)%n),_("חיברתם במקום להכפיל.")),
        W(num(a*b),_("זו המכפלה עצמה, בלי לקחת מודולו."))
      ],
      steps:[
        S(_("מצמצמים כל גורם"),_("אפשר לצמצם לפני ההכפלה — זה מקצר את החשבון."),
          num(a)+" ≡ "+num(a%n)+"   ,   "+num(b)+" ≡ "+num(b%n)),
        S(_("מכפילים"),"",num(a%n)+" · "+num(b%n)+" = "+num((a%n)*(b%n))),
        S(_("מצמצמים שוב"),_("זה השלב שהכי הרבה שוכחים."),num((a%n)*(b%n))+" ≡ "+num(pr))
      ],rule:"mod",hint:_("אפשר לצמצם לפני ההכפלה, אבל חייבים לצמצם גם אחריה.")};
  }
  /* רמה 4 — המעריך גדול מכדי לחשב בריבועים חוזרים, ולכן צריך
     משפט ולא סבלנות. השאלה אינה אומרת איזה. */
  if(L>=4){
    var p4=pick([7,11,13,17,19]),a4,k4,e4,r4,q1,q2,q3,i4,t4=0;
    do{
      a4=ri(2,p4-1);k4=ri(40,300);e4=k4%(p4-1);
      r4=1;for(i4=0;i4<e4;i4++)r4=(r4*a4)%p4;
      q1=1;for(i4=0;i4<k4%p4;i4++)q1=(q1*a4)%p4;
      q2=(a4*k4)%p4;q3=k4%p4;
    }while(t4++<160&&(e4===0||new Set([r4,q1,q2,q3]).size<4));
    return {ask:_f("חשבו {0} בחזקת {1} מודולו {2}", num(a4), num(k4), num(p4)),
      expr:num(a4)+"<sup>"+num(k4)+"</sup> (mod "+num(p4)+")",
      ans:W(num(r4)),
      wrong:[
        W(num(q1),_f("צמצמתם את המעריך מודולו {0} במקום מודולו {1}. פרמה נותן חזקה שווה ל-p פחות 1, ולכן המעריך מצטמצם מודולו p פחות 1.", num(p4), num(p4-1))),
        W(num(q2),_("הכפלתם במעריך במקום להעלות בחזקה.")),
        W(num(q3),_("זה המעריך מודולו p, ולא ערכה של החזקה."))
      ],
      steps:[
        S(_("המעריך גדול מדי לחישוב ישיר"),_("ריבועים חוזרים יעבדו, אבל יש דרך קצרה בהרבה."),num(a4)+"<sup>"+num(k4)+"</sup>"),
        S(_("בודקים שהמשפט חל"),_f("{0} ראשוני, והוא אינו מחלק את {1}. שני התנאים של משפט פרמה הקטן מתקיימים.", num(p4), num(a4)),
          num(a4)+"<sup>"+num(p4-1)+"</sup> ≡ 1 (mod "+num(p4)+")"),
        S(_("מצמצמים את המעריך"),_f("מחלקים את {0} ב-{1} ולוקחים את השארית.", num(k4), num(p4-1)),
          num(k4)+" ≡ "+num(e4)+" (mod "+num(p4-1)+")"),
        S(_("נשארת חזקה קטנה"),"",num(a4)+"<sup>"+num(e4)+"</sup> ≡ "+num(r4)+" (mod "+num(p4)+")")
      ],rule:"modpow",hint:_("משפט פרמה הקטן מצמצם את המעריך מודולו p פחות 1. קודם בודקים שהוא חל.")};
  }
  /* L3 — חזקה מודולרית */
  var pw,w1,w2,w3,i,mtry=0;
  do{
    n=pick([5,7,11,13]);a=ri(2,n-1);k=ri(3,12);
    pw=1;for(i=0;i<k;i++)pw=(pw*a)%n;
    w1=(a*k)%n; w2=(a+k)%n; w3=(pw+1)%n;
  }while(mtry++<60&&(new Set([pw,w1,w2,w3]).size<4));
  return {ask:_f("חשבו {0} בחזקת {1} מודולו {2}", num(a), num(k), num(n)),
    expr:num(a)+"<sup>"+num(k)+"</sup> (mod "+num(n)+")",
    ans:W(num(pw)),
    wrong:[
      W(num(w1),_("הכפלתם בחזקה במקום להעלות בה.")),
      W(num(w2),_("חיבור אינו קשור כאן. מעלים בחזקה ומצמצמים בכל שלב.")),
      W(num(w3),_("טעות של אחד. כדאי לחשב בריבועים חוזרים ולבדוק כל שלב."))
    ],
    steps:[
      S(_("מצמצמים בכל שלב"),_("לא מחשבים את החזקה השלמה — היא ענקית. מצמצמים תוך כדי."),
        num(a)+"² ≡ "+num((a*a)%n)),
      S(_("ריבועים חוזרים"),_("כל הכפלה מלווה בצמצום, ולכן המספרים נשארים קטנים."),
        num(a)+"<sup>4</sup> ≡ "+num((((a*a)%n)*((a*a)%n))%n)),
      S(_("התוצאה"),_("משפט פרמה הקטן מקצר עוד: a בחזקת p פחות 1 שקול ל-1."),num(pw))
    ],rule:"modpow",hint:_("מצמצמים אחרי כל הכפלה. אחרת המספרים גדלים בלי צורך.")};
}

/* ---------- 10. חבורות וסדר של איבר ---------- */
function genGroup(L){
  var n,k;
  if(L===1){
    /* n חייב להיות פריק: בחבורה מסדר ראשוני לכל איבר שאינו אפס הסדר הוא n */
    n=pick([6,8,10,12,14,15,16,18]);   /* ב-9 אין איבר שסדרו נותן ארבע אפשרויות שונות */
    var cand=[],ci,oi,gi;
    for(ci=2;ci<n;ci++){
      gi=gcd(n,ci);oi=n/gi;
      if(oi>1&&oi<n&&new Set([oi,n,ci,gi]).size===4)cand.push(ci);
    }
    if(!cand.length)cand=[2];
    k=pick(cand);
    var g=gcd(n,k), ordv=n/g;
    return {ask:_f("מהו הסדר של האיבר {0} בחבורה (Z<sub>{1}</sub> , +)?", num(k), num(n)),
      expr:"ord("+num(k)+_(") ב-Z<sub>")+num(n)+"</sub>",
      ans:W(num(ordv)),
      wrong:[
        W(num(n),_("זה סדר החבורה כולה. הוא הסדר של יוצר, ולא של כל איבר.")),
        W(num(k),_("הסדר אינו האיבר עצמו. הוא מספר הפעמים שצריך לחבר אותו לעצמו כדי לקבל אפס.")),
        W(num(g),_("זה המחלק המשותף המרבי. הסדר הוא n מחולק בו, ולא הוא עצמו."))
      ],
      steps:[
        S(_("מה זה סדר"),_("המספר הקטן ביותר של פעמים שצריך לחבר את האיבר לעצמו כדי להגיע לאפס."),
          "m·"+num(k)+" ≡ 0 (mod "+num(n)+")"),
        S(_("הנוסחה"),_("הסדר הוא n חלקי המחלק המשותף המרבי של n ושל האיבר."),
          "gcd("+num(n)+" , "+num(k)+") = "+num(g)),
        S(_("מחשבים"),"",frac(num(n),num(g))+" = "+num(ordv))
      ],rule:"order",hint:_("הסדר של k ב-Z_n הוא n חלקי gcd(n , k).")};
  }
  if(L===2){
    var ph,ftry=0;
    do{ n=ri(6,18); ph=phi(n); }
    while(ftry++<60&&new Set([ph,n,1,divisors(n).length]).size<4);
    return {ask:_f("כמה יוצרים יש לחבורה הציקלית Z<sub>{0}</sub>?", num(n)),
      expr:"Z<sub>"+num(n)+"</sub>",
      ans:W(num(ph)),
      wrong:[
        W(num(n),_("לא כל איבר הוא יוצר. יוצר הוא איבר שסדרו שווה לסדר החבורה.")),
        W("1",_("היוצר אינו יחיד. גם 1 וגם n פחות 1 הם יוצרים, ולרוב יש עוד.")),
        W(num(divisors(n).length),_("זה מספר תת־החבורות, לא מספר היוצרים."))
      ],
      steps:[
        S(_("מי הוא יוצר"),_("איבר k הוא יוצר אם ורק אם הוא זר ל-n."),"gcd(k , "+num(n)+") = 1"),
        S(_("סופרים"),_("זו בדיוק פונקציית אוילר."),"φ("+num(n)+")"),
        S(_("התוצאה"),"","φ("+num(n)+") = "+num(ph))
      ],rule:"cyclic",hint:_("מספר היוצרים של Z_n הוא φ(n) — כמה מספרים קטנים מ-n זרים לו.")};
  }
  /* רמה 4 — מכפלה ישרה. סדר בכל רכיב (רמה 1) ואז כפולה משותפת
     מינימלית (שנלמדה בתמורות) — שני רעיונות שנלמדו בנפרד. */
  if(L>=4){
    var m4,n4,u4,v4,o1,o2,od,w1,w2,w3,t4=0;
    do{
      m4=ri(4,15);n4=ri(4,15);
      u4=ri(1,m4-1);v4=ri(1,n4-1);
      o1=m4/gcd(m4,u4);o2=n4/gcd(n4,v4);
      od=lcm(o1,o2);w1=o1*o2;w2=Math.max(o1,o2);w3=o1+o2;
    }while(t4++<200&&new Set([od,w1,w2,w3]).size<4);
    return {ask:_f("מהו הסדר של האיבר ({0} , {1}) בחבורה Z<sub>{2}</sub> × Z<sub>{3}</sub>?", num(u4), num(v4), num(m4), num(n4)),
      expr:"|G| = "+num(m4)+" · "+num(n4)+" = "+num(m4*n4),
      ans:W(num(od)),
      wrong:[
        W(num(w1),_("מכפלת הסדרים נכונה רק כאשר הם זרים זה לזה. בכלל לוקחים כפולה משותפת מינימלית.")),
        W(num(w2),_("הרכיב בעל הסדר הגדול אינו מספיק — גם הרכיב השני חייב לחזור לאפס באותו צעד.")),
        W(num(w3),_("חיברתם את הסדרים. חיבור אינו קשור כאן — צריך צעד משותף לשניהם."))
      ],
      steps:[
        S(_("החיבור נעשה רכיב־רכיב"),_("במכפלה ישרה כל רכיב מתנהג בחבורה שלו בלבד."),""),
        S(_("הסדר בכל רכיב"),_("הסדר של k ב-Z_n הוא n חלקי gcd(n , k)."),
          "ord("+num(u4)+") = "+num(o1)+"   ,   ord("+num(v4)+") = "+num(o2)),
        S(_("מאחדים"),_("דרוש מספר צעדים שמאפס את שני הרכיבים יחד."),"lcm("+num(o1)+" , "+num(o2)+") = "+num(od)),
        S(_("בדיקה בעזרת לגראנז׳"),_f("הסדר חייב לחלק את |G| = {0}.", num(m4*n4)),num(m4*n4)+" ÷ "+num(od)+" = "+num(m4*n4/od))
      ],rule:"order",hint:_("סדר בכל רכיב לחוד, ואז כפולה משותפת מינימלית של השניים.")};
  }
  /* L3 — סדר של איבר בחבורת ההפיכים */
  /* בונים מראש את כל האיברים ההפיכים שסדרם נותן ארבע אפשרויות שונות */
  var a,ord3,cur,ok3,ai,pool3=[];
  n=pick([7,9,11,13,14]);
  for(ai=2;ai<n;ai++){
    if(gcd(ai,n)!==1)continue;
    cur=ai%n;ok3=1;
    while(cur!==1&&ok3<200){cur=(cur*ai)%n;ok3++}
    if(ok3>1&&new Set([ok3,phi(n),n,ai]).size===4)pool3.push([ai,ok3]);
  }
  if(!pool3.length)pool3=[[n-1,2]];
  var pair3=pick(pool3);
  a=pair3[0];ord3=pair3[1];
  return {ask:_f("מהו הסדר של האיבר {0} בחבורת ההפיכים U({1})?", num(a), num(n)),
    expr:"ord("+num(a)+_(") ב-U(")+num(n)+")",
    ans:W(num(ord3)),
    wrong:[
      W(num(phi(n)),_("זה סדר החבורה כולה. סדר האיבר מחלק אותו, אבל אינו חייב להיות שווה לו.")),
      W(num(n),_("סדר U(n) הוא φ(n) ולא n. רק ההפיכים נספרים.")),
      W(num(a),_("הסדר אינו האיבר עצמו."))
    ],
    steps:[
      S(_("מעלים בחזקות"),_("מחשבים חזקות עוקבות מודולו n עד שמגיעים ל-1."),
        num(a)+"² ≡ "+num((a*a)%n)),
      S(_("עוצרים ב-1"),_("החזקה הראשונה שנותנת 1 היא הסדר."),num(a)+"<sup>"+num(ord3)+"</sup> ≡ 1"),
      S(_("בדיקה"),_f("לפי לגראנז׳ הסדר חייב לחלק את |U({0})| = {1}.", num(n), num(phi(n))),
        num(phi(n))+" ÷ "+num(ord3)+" = "+num(phi(n)/ord3))
    ],rule:"order",hint:_("מעלים בחזקות מודולו n עד שמתקבל 1. מספר הצעדים הוא הסדר.")};
}

/* ---------- 11. משפט לגראנז׳ ותת־חבורות ---------- */
function genLagr3(L){
  var n,d;
  if(L===1){
    n=pick([12,18,20,24,30]);
    /* d היה תמיד מספר שאינו מחלק, ולכן התשובה הייתה "לא" בכל שאלה —
       אפשר היה לצבור מאה אחוז בלי לבדוק חלוקה. החבורה מוגדרת עכשיו
       כציקלית, ושם ההפך של לגראנז׳ נכון: לכל מחלק יש תת־חבורה אחת. */
    /* קודם הייתה החבורה ציקלית תמיד, ולכן ההכרעה הייתה מלאה ו"אי אפשר
       לקבוע" לא היה התשובה אף פעם. המצב השלישי: חבורה כלשהי שסדרה
       מתחלק ב-d, ושידוע ששני הכיוונים מתקיימים בה — Z<sub>n</sub> יש
       לה תת־חבורה כזאת, ולחבורה אחרת מאותו סדר אין. שלושת הזוגות
       שלהלן מאומתים: A₄ מסדר 12 בלי תת־חבורה מסדר 6, SL(2,3) מסדר 24
       בלי תת־חבורה מסדר 12, ו-A₅ מסדר 60 בלי תת־חבורה מסדר 30. */
    var cs1L=pick(["yes","no","dep"]);
    if(cs1L==="dep"){
      var dp=pick([[12,6,"A<sub>4</sub>"],[24,12,"SL(2,3)"],[60,30,"A<sub>5</sub>"]]);
      n=dp[0];d=dp[1];
      var whyD=_f("{0} אכן מחלק את {1}, אבל בחבורה שאינה ציקלית זה אינו מבטיח קיום: ל-Z<sub>{1}</sub> יש תת־חבורה כזאת, ול-{2} אין.", num(d), num(n), dp[2]);
      return {ask:_f("|G| = {0}, והחבורה אינה בהכרח ציקלית. האם יש ל-G תת־חבורה מסדר {1}?", num(n), num(d)),
        expr:"|G| = "+num(n)+"   ,   |H| = "+num(d)+" ?",
        ans:W(_("אי אפשר לקבוע")),
        wrong:[
          W(_("כן"),whyD),
          W(_("לא"),whyD),
          W(_("רק אם G אבלית"),_("משפט לגראנז׳ אינו דורש חילופיות. הוא נכון בכל חבורה סופית."))
        ],
        steps:[
          S(_("משפט לגראנז׳"),_("סדר תת־חבורה מחלק תמיד את סדר החבורה."),"|H| ∣ |G|"),
          S(_("בודקים חלוקה"),"",num(n)+" ÷ "+num(d)+" = "+num(r2(n/d))),
          S(_("החלוקה שלמה — ומה מזה"),_("לגראנז׳ שולל בלבד. הכיוון ההפוך נכון בחבורה ציקלית, ולא בחבורה כללית."),""),
          S(_("מסקנה"),whyD,_("אי אפשר לקבוע"))
        ],rule:"lagrange3",hint:_("לגראנז׳ שולל מיד כל סדר שאינו מחלק. הוא אינו מבטיח קיום בכיוון השני.")};
    }
    var yes=(cs1L==="yes"),cand=[];
    for(var i=2;i<n;i++)if(yes?(n%i===0):(n%i!==0))cand.push(i);
    d=pick(cand);
    return {ask:_f("|G| = {0} והחבורה ציקלית. האם יש ל-G תת־חבורה מסדר {1}?", num(n), num(d)),
      expr:"|G| = "+num(n)+"   ,   |H| = "+num(d)+" ?",
      ans:W(yes?_("כן"):_("לא")),
      wrong:[
        W(yes?_("לא"):_("כן"),
          yes?_f("{0} מחלק את {1}, ובחבורה ציקלית יש בדיוק תת־חבורה אחת לכל מחלק.", num(d), num(n))
             :_f("{0} אינו מחלק את {1}, ולכן לפי לגראנז׳ אין תת־חבורה כזאת.", num(d), num(n))),
        W(_("אי אפשר לקבוע"),_("החבורה נתונה כציקלית, ובה לכל מחלק של הסדר יש תת־חבורה — ולכן ההכרעה מלאה.")),
        W(_("רק אם G אבלית"),_("משפט לגראנז׳ אינו דורש חילופיות. הוא נכון בכל חבורה סופית."))
      ],
      steps:[
        S(_("משפט לגראנז׳"),_("סדר תת־חבורה מחלק תמיד את סדר החבורה."),"|H| ∣ |G|"),
        S(_("בודקים חלוקה"),"",num(n)+" ÷ "+num(d)+" = "+num(r2(n/d))),
        S(_("מסקנה"),
          yes?_("החלוקה שלמה, ובחבורה ציקלית קיימת תת־חבורה לכל מחלק.")
             :_("החלוקה אינה שלמה, ולכן תת־חבורה כזאת אינה יכולה להתקיים."),
          yes?_("כן"):_("לא"))
      ],rule:"lagrange3",hint:_("לגראנז׳ שולל מיד כל סדר שאינו מחלק. הוא אינו מבטיח קיום בכיוון השני.")};
  }
  if(L===2){
    n=pick([12,18,20,24,30,36]);
    var ds=divisors(n).filter(function(x){
      return x>1&&x<n&&new Set([n/x,x,n,n-x]).size===4;
    });
    if(!ds.length)ds=[2];
    d=pick(ds);
    return {ask:_f("|G| = {0} ו-|H| = {1}. מהו האינדקס [G:H]?", num(n), num(d)),
      expr:"[G : H] = ?",
      ans:W(num(n/d)),
      wrong:[
        W(num(d),_("זה סדר תת־החבורה. האינדקס הוא כמה מחלקות שמאליות יש.")),
        W(num(n),_("זה סדר החבורה. מחלקים אותו בסדר תת־החבורה.")),
        W(num(n-d),_("האינדקס הוא מנה ולא הפרש."))
      ],
      steps:[
        S(_("מה זה אינדקס"),_("מספר המחלקות השמאליות של H ב-G. הן מכסות את G בלי חפיפה."),"[G:H]"),
        S(_("הנוסחה"),"","[G:H] = "+frac("|G|","|H|")),
        S(_("מציבים"),_("זה בדיוק ניסוח אחר של משפט לגראנז׳."),frac(num(n),num(d))+" = "+num(n/d))
      ],rule:"lagrange3",hint:_("אינדקס = סדר החבורה חלקי סדר תת־החבורה.")};
  }
  /* רמה 4 — ההפך של לגראנז׳. בחבורה ציקלית הוא נכון (רמה 1 ורמה 3),
     ובחבורה כללית אינו נכון. ל-A₄ מסדר 12 אין תת־חבורה מסדר 6,
     ול-A₅ מסדר 60 אין תת־חבורה מסדר 15, 20 או 30. שני הכיוונים
     מוגרלים, ולכן אי אפשר לענות "לא" תמיד. */
  if(L>=4){
    var LG4=[
      [12,2,"cauchy"],[12,3,"cauchy"],[12,4,"sylow"],
      [18,2,"cauchy"],[18,3,"cauchy"],[18,9,"sylow"],
      [20,2,"cauchy"],[20,5,"cauchy"],[20,4,"sylow"],
      [60,2,"cauchy"],[60,3,"cauchy"],[60,5,"cauchy"],[60,4,"sylow"],
      [12,6,"no"],[12,6,"no"],[12,6,"no"],[12,6,"no"],
      [60,15,"no"],[60,15,"no"],[60,15,"no"],
      [60,20,"no"],[60,20,"no"],[60,20,"no"],
      [60,30,"no"],[60,30,"no"],[60,30,"no"]
    ];
    /* d חילק תמיד את n, ולכן "בוודאות אין תת־חבורה מסדר זה" ו"השאלה
       ריקה" לא היו התשובה אף פעם. עכשיו מוגרל גם סדר שאינו מחלק:
       שם לגראנז׳ שולל בוודאות, וזו בדיוק התשובה השלישית. שתי
       האפשרויות האחרונות אינן מוצגות יחד — כשהסדר אינו מחלק,
       "השאלה ריקה" הייתה נכונה גם היא, ולכן היא מוחלפת. */
    var noDiv=Math.random()<0.25;
    var g4=pick(LG4),n4=g4[0],d4=g4[1],kd=g4[2];
    if(noDiv){
      kd="nodiv";
      d4=ri(2,n4-1);
      while(n4%d4===0)d4=ri(2,n4-1);
    }
    var cex=n4===12?_("ל-A₄, חבורת התמורות הזוגיות על ארבעה איברים, יש 12 איברים ואין לה תת־חבורה מסדר 6.")
                   :_f("ל-A₅, שסדרה 60, אין תת־חבורה מסדר {0}.", num(d4));
    var jus=kd==="cauchy"?_f("{0} ראשוני, ולכן משפט קושי מבטיח איבר מסדר {0} — והוא יוצר תת־חבורה כזאת.", num(d4))
           :kd==="sylow"?_f("{0} היא החזקה המרבית של ראשוני שמחלקת את {1}, ולכן משפט סילו מבטיח תת־חבורה מסדר {0}.", num(d4), num(n4))
           :kd==="nodiv"?_f("{0} אינו מחלק את {1}, ולכן לפי לגראנז׳ אין ולא יכולה להיות תת־חבורה כזאת באף חבורה מסדר {1}.", num(d4), num(n4))
           :_f("אין משפט שמבטיח זאת, ויש דוגמה נגדית: {0}", cex);
    var O1=_("בהכרח קיימת תת־חבורה מסדר זה"),
        O2=_("לא בהכרח — ההפך של משפט לגראנז׳ אינו נכון בחבורה כללית"),
        O3=_("בוודאות אין תת־חבורה מסדר זה"),
        O4=_("השאלה ריקה: הסדר אינו מחלק את סדר החבורה"),
        O5=_("לא — משפט לגראנז׳ חל רק על חבורות אבליות");
    var A4=kd==="no"?O2:kd==="nodiv"?O3:O1;
    var trap4=(kd==="nodiv")?O5:pick([O4,O5]);
    var whyTrap=(trap4===O5)?_("משפט לגראנז׳ נכון בכל חבורה סופית, אבלית או לא. חילופיות אינה תנאי שלו.")
                            :_f("{0} דווקא מחלק את {1}. לגראנז׳ שולל רק סדרים שאינם מחלקים.", num(d4), num(n4));
    return {ask:_f("G חבורה כלשהי מסדר {0}, לא בהכרח ציקלית. האם בהכרח יש לה תת־חבורה מסדר {1}?", num(n4), num(d4)),
      expr:"|G| = "+num(n4)+"   ,   |H| = "+num(d4)+" ?",
      ans:W(A4),
      wrong:[O1,O2,O3].filter(function(v){return v!==A4}).map(function(v){
          return W(v, (kd==="nodiv")?jus
            :(v===O3?_f("יש חבורות מסדר {0} שכן יש להן תת־חבורה מסדר {1} — למשל החבורה הציקלית Z<sub>{0}</sub>.", num(n4), num(d4))
              :(kd==="no"?_f("ההפך של לגראנז׳ אינו נכון. {0}", cex):jus)))})
        .concat([W(trap4,whyTrap)]),
      steps:[
        S(_("מה לגראנז׳ אומר בכלל"),_("סדר תת־חבורה מחלק את סדר החבורה. זהו תנאי הכרחי בלבד, ולא מבטיח קיום."),"|H| ∣ |G|"),
        S(_("בודקים חלוקה"),"",num(n4)+" ÷ "+num(d4)+" = "+num(r2(n4/d4))),
        S(_("האם יש משפט שמבטיח קיום"),jus,""),
        S(_("מסקנה"),kd==="no"?_("החלוקה שלמה, אבל זה לבדו אינו מספיק בחבורה כללית.")
          :kd==="nodiv"?_("החלוקה אינה שלמה, ולגראנז׳ שולל את הקיום בוודאות — בכל חבורה מהסדר הזה.")
          :_("כאן יש משפט שמבטיח את הקיום, ולכן התשובה חיובית."),A4)
      ],rule:"lagrange3",hint:_("לגראנז׳ שולל ואינו מבטיח. הכיוון ההפוך נכון בחבורה ציקלית, אבל לא בכל חבורה.")};
  }
  /* L3. קודם הסדר היה תמיד ראשוני, ולכן התשובה הייתה 2 בכל 500
     ההגרלות — אפשר היה לענות בלי לספור מחלקים אפילו פעם אחת. עכשיו
     הסדר מוגרל גם מבין מספרים פריקים, והתשובה היא מספר המחלקים.
     המקרה הראשוני נשאר בפנים, ובו התשובה עדיין 2. */
  var p=pick([5,7,11,13,17,19,12,16,18,20,24,30,36]);
  var dv=divisors(p),dc=dv.length;
  return {ask:_f("|G| = {0} והחבורה ציקלית. כמה תת־חבורות יש ל-G?", num(p)),
    expr:"|G| = "+num(p),
    ans:W(num(dc)),
    wrong:[
      W(num(p),_("מספר תת־החבורות נקבע לפי המחלקים של הסדר, ולא לפי הסדר עצמו.")),
      W("1",_("יש תמיד לפחות שתיים: תת־החבורה הטריוויאלית והחבורה כולה.")),
      W(num(dc-2),_("שכחתם לספור את שתי הטריוויאליות: גם 1 וגם החבורה כולה הן תת־חבורות."))
    ],
    steps:[
      S(_("לגראנז׳ מגביל"),_("סדר כל תת־חבורה מחלק את סדר החבורה."),"|H| ∣ "+num(p)),
      S(_("בחבורה ציקלית ההפך גם נכון"),_("לכל מחלק של הסדר יש בדיוק תת־חבורה אחת, ולכן מספיק לספור מחלקים."),
        dv.join(" , ")),
      S(_("מסקנה"),dc===2?_("למספר ראשוני יש בדיוק שני מחלקים, ולכן שתי תת־חבורות בלבד.")
        :_("סופרים את המחלקים, ומקבלים את מספר תת־החבורות."),num(dc))
    ],rule:"lagrange3",hint:_("בחבורה ציקלית מספר תת־החבורות שווה למספר המחלקים של הסדר.")};
}

/* ---------- 12. תמורות ---------- */
function genPerm(L){
  var k,p,q;
  if(L===1){
    k=ri(4,7);   /* באורך 3 היה k−1 שווה למסיח ״2״ */
    var cyc="(1 2";for(var i=3;i<=k;i++)cyc+=" "+i;cyc+=")";
    return {ask:_f("מהו הסדר של המחזור באורך {0}?", num(k)),
      expr:"σ = "+cyc,
      ans:W(num(k)),
      wrong:[
        W(num(k-1),_("אורך המחזור נספר לפי מספר האיברים בו, לא לפי מספר החילופים.")),
        W("2",_("סדר 2 יש לחילוף בלבד — מחזור באורך שתיים.")),
        W(num(fact(k)),_("זה גודל חבורת התמורות כולה, לא הסדר של התמורה הזאת."))
      ],
      steps:[
        S(_("מה עושה המחזור"),_("כל הפעלה מזיזה כל איבר צעד אחד קדימה בתוך המחזור."),""),
        S(_("מתי חוזרים להתחלה"),_f("אחרי {0} הפעלות כל איבר השלים סיבוב שלם.", num(k)),
          "σ<sup>"+num(k)+"</sup> = id"),
        S(_("מסקנה"),"","ord(σ) = "+num(k))
      ],rule:"perm",hint:_("הסדר של מחזור שווה לאורכו.")};
  }
  if(L===2){
    /* אורכים זרים היו נותנים lcm = מכפלה, ואורך שמחלק את השני היה נותן
       lcm = המקסימום. בשני המקרים אחד המסיחים הופך לתשובה. */
    var lp=pick([[4,6],[6,4],[6,8],[8,6],[6,9],[9,6],[4,10],[10,4],[6,10],[10,6]]);
    p=lp[0];q=lp[1];
    var c1="(1 2";for(var j=3;j<=p;j++)c1+=" "+j;c1+=")";
    var c2="("+(p+1)+" "+(p+2);for(var m=3;m<=q;m++)c2+=" "+(p+m);c2+=")";
    return {ask:_("מהו הסדר של התמורה?"),
      expr:"σ = "+c1+c2,
      ans:W(num(lcm(p,q))),
      wrong:[
        W(num(p*q),_("מכפלה נכונה רק כשהאורכים זרים. בכלל לוקחים כפולה משותפת מינימלית.")),
        W(num(p+q),_("סכום האורכים אינו קשור. שני המחזורים פועלים במקביל.")),
        W(num(Math.max(p,q)),_("המחזור הארוך לבדו אינו מספיק — גם הקצר חייב לחזור להתחלה."))
      ],
      steps:[
        S(_("מחזורים זרים"),_("הם פועלים על איברים שונים, ולכן אינם מפריעים זה לזה."),
          _("אורכים")+": "+num(p)+" , "+num(q)),
        S(_("מתי שניהם באפס"),_("צריך מספר הפעלות שמתחלק בשני האורכים."),
          "lcm("+num(p)+" , "+num(q)+")"),
        S(_("מחשבים"),"",num(lcm(p,q)))
      ],rule:"perm",hint:_("סדר של מכפלת מחזורים זרים הוא הכפולה המשותפת המינימלית של אורכיהם.")};
  }
  /* רמה 4 — התמורה ניתנת כהעתקה ולא כמכפלת מחזורים, ולכן צריך
     קודם לפרק בעצמך. אחר כך שני רעיונות יחד: כפולה משותפת
     מינימלית לסדר, וסכום k פחות 1 לזוגיות. */
  if(L>=4){
    var TY=[[2,2,3],[2,3,3],[2,2,5],[2,3,4],[2,2,2,3]];
    var ty=pick(TY),N4=0,i4,j4,pos=0;
    for(i4=0;i4<ty.length;i4++)N4+=ty[i4];
    var el=[];for(i4=1;i4<=N4;i4++)el.push(i4);
    shuffle(el);
    var mp=new Array(N4+1),cyc4="",dsp=[];
    for(i4=0;i4<ty.length;i4++){
      cyc4+="(";
      for(j4=0;j4<ty[i4];j4++){
        mp[el[pos+j4]]=el[pos+((j4+1)%ty[i4])];
        cyc4+=(j4?" ":"")+el[pos+j4];
      }
      cyc4+=")";pos+=ty[i4];
    }
    for(i4=1;i4<=N4;i4++)dsp.push(num(i4)+" ↦ "+num(mp[i4]));
    var od=1,pr=1,mx=0,tr=0,tl=[];
    for(i4=0;i4<ty.length;i4++){od=lcm(od,ty[i4]);pr*=ty[i4];mx=Math.max(mx,ty[i4]);tr+=ty[i4]-1;tl.push(num(ty[i4]-1));}
    var ev=tr%2===0,PE=ev?_("זוגית"):_("אי־זוגית"),PO=ev?_("אי־זוגית"):_("זוגית");
    return {ask:_("מהו הסדר של התמורה, ומהי זוגיותה?"),
      expr:"σ :   "+dsp.join("  ,  "),
      ans:W(_f("סדר {0} , {1}", num(od), PE)),
      wrong:[
        W(_f("סדר {0} , {1}", num(pr), PE),_("הכפלתם את אורכי המחזורים. מכפלה נכונה רק כשהאורכים זרים; בכלל לוקחים כפולה משותפת מינימלית.")),
        W(_f("סדר {0} , {1}", num(od), PO),_("הסדר נכון והזוגיות לא. כל מחזור באורך k תורם k פחות 1 חילופים, ומחברים על פני כל המחזורים.")),
        W(_f("סדר {0} , {1}", num(mx), PE),_("המחזור הארוך ביותר לבדו אינו מספיק — כל המחזורים חייבים לחזור להתחלה יחד."))
      ],
      steps:[
        S(_("מפרקים למחזורים זרים"),_("עוקבים אחרי כל איבר עד שחוזרים אליו, וממשיכים לאיבר שטרם נכלל."),"σ = "+cyc4),
        S(_("הסדר"),_("כפולה משותפת מינימלית של אורכי המחזורים."),"lcm( "+ty.join(" , ")+" ) = "+num(od)),
        S(_("הזוגיות"),_("מחזור באורך k הוא k פחות 1 חילופים, ומחברים את כולם."),tl.join(" + ")+" = "+num(tr)+"   ⇒   sgn = "+(ev?"+1":"−1")),
        S(_("מסקנה"),_("שני הנתונים מתקבלים מאותו פירוק, אבל בשני חישובים שונים."),_f("סדר {0} , {1}", num(od), PE))
      ],rule:"perm",hint:_("קודם מפרקים למחזורים זרים. אחר כך lcm לסדר, וסכום k פחות 1 לזוגיות.")};
  }
  /* L3 — סימן התמורה */
  /* קודם הייתה כאן שאלת זוגי/אי־זוגי בלבד, ולכן שני מסיחי התפיסה לא
     היו התשובה אף פעם. עכשיו בחלק מההגרלות אורך המחזור עצמו אינו
     נתון — ואז אי אפשר לקבוע. זה גם מעמיד זה מול זה את הדבר שכן
     קובע (האורך) מול הדבר שאינו קובע (זהות האיברים). ובכל הגרלה
     מוצג רק אחד משני מסיחי התפיסה, ולא שניהם. */
  k=ri(3,7);
  var unkK=Math.random()<0.3;
  var even=(k-1)%2===0;
  var uniP=[_("זוגית"),_("אי־זוגית"),_("אי אפשר לקבוע")];
  var ansP3=unkK?uniP[2]:(even?uniP[0]:uniP[1]);
  var whyK=_("הזוגיות נקבעת לפי k פחות 1: לאורך אי־זוגי התמורה זוגית, ולאורך זוגי היא אי־זוגית. בלי לדעת את k אי אפשר להכריע.");
  var trapP=pick([[_("תלוי באיברים"),_("הזוגיות תלויה רק באורך המחזור, ולא בזהות האיברים שבו.")],
                  [_("אין לה זוגיות"),_("לכל תמורה יש סימן מוגדר היטב, פלוס או מינוס אחד.")]]);
  return {ask:unkK?_("מהי הזוגיות של מחזור באורך k, כאשר k אינו נתון?")
                 :_f("מהי הזוגיות של מחזור באורך {0}?", num(k)),
    expr:"σ = "+_("מחזור באורך")+" "+(unkK?"k":num(k)),
    ans:W(ansP3),
    wrong:uniP.filter(function(v){return v!==ansP3}).map(function(v){
        return W(v, unkK?whyK
          :(v===uniP[2]?_("אורך המחזור נתון, ולכן הזוגיות נקבעת לגמרי.")
                       :_("מחזור באורך k מתפרק ל-k פחות 1 חילופים. הזוגיות נקבעת לפי המספר הזה.")))})
      .concat([W(trapP[0],trapP[1])]),
    steps:[
      S(_("מפרקים לחילופים"),_("מחזור באורך k הוא מכפלה של k פחות 1 חילופים."),
        unkK?"k − 1":(num(k)+" − 1 = "+num(k-1))),
      S(_("סופרים"),_("סימן התמורה הוא מינוס אחד בחזקת מספר החילופים."),
        unkK?"sgn = (−1)<sup>k−1</sup>":("sgn = (−1)<sup>"+num(k-1)+"</sup> = "+(even?"+1":"−1"))),
      S(_("מסקנה"),unkK?whyK:_("מחזור באורך אי־זוגי הוא תמורה זוגית — וזה הפוך ממה שנדמה."),ansP3)
    ],rule:"sign",hint:_("מחזור באורך k מתפרק ל-k−1 חילופים, והזוגיות נקבעת לפי המספר הזה.")};
}

/* ============================================================
   מחוללי השאלות — אנליזה נומרית
   ============================================================ */

/* ---------- 13. שגיאה מוחלטת ויחסית ---------- */
function genErr(L){
  var ex,ap,k;
  if(L===1){
    ex=ri(20,200);ap=ex+ri(1,9);   /* קירוב גדול מהמדויק, כדי שההפרש בלי ערך מוחלט יהיה שלילי */
    return {ask:_f("הערך המדויק הוא {0} והקירוב הוא {1}. מהי השגיאה המוחלטת?", num(ex), num(ap)),
      expr:"|"+_("מדויק")+" − "+_("קירוב")+"| = ?",
      ans:W(num(Math.abs(ex-ap))),
      wrong:[
        W(num(ex-ap),_("השגיאה המוחלטת אינה שלילית. לוקחים ערך מוחלט.")),
        W(num(r2(Math.abs(ex-ap)/ex)),_("זו השגיאה היחסית. המוחלטת היא ההפרש עצמו.")),
        W(num(ex+ap),_("מחסרים, לא מחברים."))
      ],
      steps:[
        S(_("ההגדרה"),_("כמה רחוק הקירוב מהערך האמיתי, ביחידות של הגודל עצמו."),"E = |x − x̃|"),
        S(_("מציבים"),"","|"+num(ex)+" − "+num(ap)+"|"),
        S(_("ערך מוחלט"),_("הכיוון אינו מעניין — רק המרחק."),num(Math.abs(ex-ap)))
      ],rule:"err",hint:_("שגיאה מוחלטת היא ההפרש בערך מוחלט, ביחידות של הגודל עצמו.")};
  }
  if(L===2){
    var dd,rel,etry=0;
    do{
      ex=pick([20,25,40,50,80,200]);   /* 100 היה נותן שגיאה יחסית ששווה למוחלטת */
      dd=pick([1,2,4,5]);
      ap=ex+pick([1,-1])*dd;
      rel=r2(100*dd/ex);
    }while(etry++<60&&new Set([rel,dd,r2(100*dd/ap),r2(dd/ex)]).size<4);
    return {ask:_f("הערך המדויק הוא {0} והקירוב הוא {1}. מהי השגיאה היחסית באחוזים?", num(ex), num(ap)),
      expr:frac("|x − x̃|","|x|")+" · 100% = ?",
      ans:W(num(rel)+"%"),
      wrong:[
        W(num(dd)+"%",_("זו השגיאה המוחלטת. היחסית מחלקת אותה בערך המדויק.")),
        W(num(r2(100*dd/ap))+"%",_("חילקתם בקירוב במקום בערך המדויק. זו טעות קטנה, אבל היא טעות.")),
        W(num(r2(dd/ex))+"%",_("שכחתם להכפיל ב-100. זה השבר ולא האחוז."))
      ],
      steps:[
        S(_("השגיאה המוחלטת"),"","|"+num(ex)+" − "+num(ap)+"| = "+num(dd)),
        S(_("מחלקים בערך המדויק"),_("כך השגיאה נמדדת ביחס לגודל, וניתן להשוות בין גדלים שונים."),
          frac(num(dd),num(ex))),
        S(_("לאחוזים"),"",num(rel)+"%")
      ],rule:"err",hint:_("שגיאה יחסית = מוחלטת חלקי הערך המדויק. היא חסרת יחידות.")};
  }
  /* רמה 4 — שלושה רעיונות בשאלה אחת: חסם עיגול (רמה 3), הצטברות
     שגיאות בחיסור, ושגיאה יחסית (רמה 2). הנקודה היא שההפרש קטן,
     ולכן אותה שגיאה מוחלטת נעשית ענקית באחוזים. */
  if(L>=4){
    var bc=ri(320,900),dc=pick([4,5,8,10,20,25]);
    var A4=bc/100,B4=(bc-dc)/100;
    var rv=r2(100/dc),w1=r2(50/dc),w2=r2(1/A4),w3=1;
    return {ask:_f("x̃ = {0} ו-ỹ = {1}, ושניהם מעוגלים לשתי ספרות אחרי הנקודה. מהו החסם לשגיאה היחסית של ההפרש x̃ − ỹ?", num(A4), num(B4)),
      expr:frac("E( x − y )","| x − y |")+" ≤ ?",
      ans:W(num(rv)+"%"),
      wrong:[
        W(num(w1)+"%",_("שתי השגיאות מצטברות. חסם השגיאה של הפרש הוא סכום שני החסמים, ולא אחד מהם.")),
        W(num(w2)+"%",_("חילקתם בגודל עצמו ולא בהפרש. כל העניין כאן הוא שההפרש קטן בהרבה מהגדלים.")),
        W(num(w3)+"%",_("זה החסם המוחלט 0.01 שהוצג כאחוז. שגיאה יחסית מחלקים בהפרש עצמו."))
      ],
      steps:[
        S(_("חסם עיגול לכל נתון"),_("שתי ספרות אחרי הנקודה: חצי מרווח, כלומר 0.005."),"E ≤ 0.005"),
        S(_("בחיסור השגיאות מצטברות"),_("החסם של הפרש הוא סכום החסמים, ולא ההפרש שלהם."),"E( x − y ) ≤ 0.005 + 0.005 = 0.01"),
        S(_("ההפרש עצמו קטן"),"",num(A4)+" − "+num(B4)+" = "+num(dc/100)),
        S(_("מחלקים"),_("זו תופעת ביטול הספרות: חיסור של שני מספרים קרובים מנפח את השגיאה היחסית."),
          frac("0.01",num(dc/100))+" = "+num(rv)+"%")
      ],rule:"err",hint:_("שלושה צעדים: חסם עיגול, הצטברות שגיאות בחיסור, ורק אז חלוקה בהפרש.")};
  }
  /* L3 — חסם שגיאת עיגול */
  k=ri(1,5);
  var bound=Math.pow(10,-k)/2;
  return {ask:_f("מעגלים מספר ל-{0} ספרות אחרי הנקודה. מהו חסם שגיאת העיגול?", num(k)),
    expr:"|x − x̃| ≤ ?",
    ans:W(num(r2(bound*1000000)/1000000)),
    wrong:[
      W(num(Math.pow(10,-k)),_("זהו המרווח בין שני ערכים אפשריים. העיגול מקרב לקרוב, ולכן החסם הוא חצי ממנו.")),
      W(num(Math.pow(10,-k)*2),_("הכפלתם במקום לחלק. עיגול מקטין שגיאה, לא מגדיל.")),
      W(num(k),_("זה מספר הספרות, לא החסם."))
    ],
    steps:[
      S(_("המרווח בין ערכים"),_f("עם {0} ספרות אחרי הנקודה המרווח הוא 10 בחזקת מינוס {0}.", num(k)),
        "Δ = 10<sup>−"+num(k)+"</sup>"),
      S(_("עיגול לקרוב"),_("מספר לעולם אינו רחוק יותר מחצי מרווח מהערך המעוגל הקרוב אליו."),"E ≤ Δ ÷ 2"),
      S(_("החסם"),"","0.5 · 10<sup>−"+num(k)+"</sup> = "+num(r2(bound*1000000)/1000000))
    ],rule:"round",hint:_("חסם שגיאת עיגול הוא חצי מהמרווח בין שני ערכים סמוכים.")};
}

/* ---------- 14. חצייה וניוטון ---------- */
function genNewton(L){
  var a,b,c,x0;
  if(L===1){
    var btry=0;
    do{ a=ri(0,4);b=a+pick([2,4,6]); }
    while(btry++<40&&new Set([(a+b)/2,a,b,b-a]).size<4);
    return {ask:_("בשיטת החצייה, מהי נקודת האמצע הראשונה?"),
      expr:"f("+num(a)+") < 0 < f("+num(b)+")   ,   ["+num(a)+" , "+num(b)+"]",
      ans:W(num((a+b)/2)),
      wrong:[
        W(num(a),_("זה קצה שמאלי, לא אמצע.")),
        W(num(b),_("זה הקצה הימני.")),
        W(num(b-a),_("זה אורך הקטע, לא נקודה בתוכו."))
      ],
      steps:[
        S(_("למה זה עובד"),_("הפונקציה מחליפה סימן בין הקצוות, ולכן לפי משפט ערך הביניים יש שורש בפנים."),""),
        S(_("חוצים"),"",frac(num(a)+" + "+num(b),"2")+" = "+num((a+b)/2)),
        S(_("ממשיכים"),_("בודקים את סימן הפונקציה באמצע, ובוחרים את החצי שבו הסימן עדיין מתחלף."),"")
      ],rule:"bisect",hint:_("חצייה: לוקחים אמצע, בודקים סימן, וממשיכים בחצי שבו יש חילוף סימן.")};
  }
  if(L===2){
    c=pick([2,3,5,7,10]);x0=ri(1,4);
    /* ניוטון על x² − c: x₁ = (x₀² + c) ÷ (2x₀) */
    var x1=fr(x0*x0+c,2*x0);
    return {ask:_f("שיטת ניוטון עבור f(x) = x² − {0} עם x₀ = {1}. מהו x₁?", num(c), num(x0)),
      expr:"x<sub>1</sub> = x<sub>0</sub> − "+frac("f(x<sub>0</sub>)","f′(x<sub>0</sub>)"),
      ans:W(x1.html()),
      wrong:[
        W(fr(x0*x0-c,2*x0).html(),_("טעות סימן. מחסרים את f חלקי f תג, ו-f עצמו הוא x בריבוע פחות c.")),
        W(fr(x0*x0+c,x0).html(),_("שכחתם את ה-2 בנגזרת. הנגזרת של x בריבוע היא 2x.")),
        W(num(x0),_("זו נקודת ההתחלה. אחרי צעד אחד היא משתנה."))
      ],
      steps:[
        S(_("הנגזרת"),"","f′(x) = 2x   ⇒   f′("+num(x0)+") = "+num(2*x0)),
        S(_("מציבים בנוסחה"),"",num(x0)+" − "+frac(num(x0*x0-c),num(2*x0))),
        S(_("מפשטים"),_("זו בדיוק שיטת הרון לחישוב שורש: ממוצע של x ושל c חלקי x."),x1.html())
      ],rule:"newton",hint:_("x₁ = x₀ פחות f(x₀) חלקי f′(x₀). מחשבים קודם את הנגזרת.")};
  }
  /* רמה 4 — לא "חשבו צעד" אלא "מה בכלל מובטח כאן". שני תנאים
     למבחן הסימנים, רציפות וחילוף סימן, ובכל הגרלה אחד מהם
     נשבר או שניהם מתקיימים. */
  if(L>=4){
    var cs4=pick(["sign","nosign","pole"]),ia,ib,fx,fav,fbv,neg,cont,cnc,cp,cc;
    if(cs4==="sign"){
      cc=pick([2,3,5,6,7,8]);ia=0;ib=ri(3,5);
      fx="f(x) = x² − "+num(cc);fav=num(-cc);fbv=num(ib*ib-cc);neg=true;
      cont=_("f פולינום, ולכן היא רציפה בכל הישר.");
      cnc=_f("f רציפה ומחליפה סימן, ולכן לפי משפט ערך הביניים יש בקטע לפחות שורש אחד — כאן √{0}.", num(cc));
    }else if(cs4==="nosign"){
      cc=pick([1,4,9]);ia=-ri(4,6);ib=-ia;
      fx="f(x) = x² − "+num(cc);fav=num(ia*ia-cc);fbv=num(ib*ib-cc);neg=false;
      cont=_("f פולינום, ולכן היא רציפה בכל הישר.");
      cnc=_f("בקטע יש דווקא שני שורשים, {0} ו-−{0}, אבל מבחן הסימנים אינו מזהה אותם כלל.", num(Math.round(Math.sqrt(cc))));
    }else{
      cp=ri(2,5);ia=cp-ri(1,2);ib=cp+ri(1,2);
      fx="f(x) = "+frac("1","x − "+num(cp));fav=fr(1,ia-cp).html();fbv=fr(1,ib-cp).html();neg=true;
      cont=_f("ל-f יש קוטב ב-x = {0}, והוא נמצא בתוך הקטע. הפונקציה אינה רציפה שם.", num(cp));
      cnc=_f("אין ל-f שורש כלל. חילוף הסימן נובע מהקוטב ב-x = {0}, ולא משורש.", num(cp));
    }
    var O1=_("בוודאות יש שורש בקטע — משפט ערך הביניים חל"),
        O2=_("אין חילוף סימן, ולכן אי אפשר להסיק דבר — חילוף סימן הוא תנאי מספיק ולא הכרחי"),
        O3=_("המבחן אינו חל: f אינה רציפה בכל הקטע"),
        O4=_("המבחן מבטיח שורש יחיד בקטע");
    var A4=cs4==="sign"?O1:cs4==="nosign"?O2:O3;
    var WR4=[];
    if(cs4!=="sign")WR4.push(W(O1,cs4==="nosign"?_("אין כאן חילוף סימן, ולכן משפט ערך הביניים אינו נותן דבר."):_("משפט ערך הביניים דורש רציפות על כל הקטע, והיא נשברת כאן.")));
    if(cs4!=="nosign")WR4.push(W(O2,_("יש כאן דווקא חילוף סימן, ולכן הטענה על היעדרו אינה נכונה.")));
    if(cs4!=="pole")WR4.push(W(O3,_("f פולינום, והוא רציף בכל הישר.")));
    WR4.push(W(O4,_("משפט ערך הביניים מבטיח לפחות שורש אחד, ולא יחידות. ייתכנו כמה שורשים בקטע.")));
    return {ask:_f("מה מבטיח מבחן הסימנים של שיטת החצייה על הקטע [{0} , {1}]?", num(ia), num(ib)),
      expr:fx+"   ,   f("+num(ia)+") = "+fav+"   ,   f("+num(ib)+") = "+fbv,
      ans:W(A4),
      wrong:WR4.slice(0,3),
      steps:[
        S(_("שני תנאים, לא אחד"),_("f רציפה על כל הקטע, וגם f(a)·f(b) קטן מאפס. שניהם נדרשים."),""),
        S(_("בודקים רציפות"),cont,""),
        S(_("בודקים חילוף סימן"),"","f("+num(ia)+")·f("+num(ib)+") "+(neg?"< 0":"> 0")),
        S(_("מסקנה"),cnc,A4)
      ],rule:"bisect",hint:_("בודקים את שני התנאים בנפרד. די באחד שנשבר כדי שהמבחן לא יבטיח דבר.")};
  }
  /* L3 — ניוטון על שורש שלישי */
  c=pick([2,3,5,7]);x0=ri(1,3);
  var x1b=fr(2*x0*x0*x0+c,3*x0*x0);
  return {ask:_f("שיטת ניוטון עבור f(x) = x³ − {0} עם x₀ = {1}. מהו x₁?", num(c), num(x0)),
    expr:"x<sub>1</sub> = x<sub>0</sub> − "+frac("x<sub>0</sub>³ − "+num(c),"3x<sub>0</sub>²"),
    ans:W(x1b.html()),
    wrong:[
      W(fr(x0*x0*x0+c,3*x0*x0).html(),_("שכחתם שהחיסור משאיר 2x₀³ במונה, ולא x₀³.")),
      W(fr(2*x0*x0*x0-c,3*x0*x0).html(),_("טעות סימן. מינוס כפול מינוס c נותן פלוס c.")),
      W(fr(2*x0*x0*x0+c,x0*x0).html(),_("שכחתם את ה-3 בנגזרת. הנגזרת של x בשלישית היא 3x בריבוע."))
    ],
    steps:[
      S(_("הנגזרת"),"","f′(x) = 3x²   ⇒   f′("+num(x0)+") = "+num(3*x0*x0)),
      S(_("מציבים"),"",num(x0)+" − "+frac(num(x0*x0*x0-c),num(3*x0*x0))),
      S(_("מאחדים למכנה אחד"),_("המונה הופך ל-2x₀³ ועוד c — זו הצורה הכללית לשורש מסדר שלישי."),x1b.html())
    ],rule:"newton",hint:_("אותה נוסחה כמו קודם, רק שהנגזרת היא 3x בריבוע.")};
}

/* ---------- 15. אינטרפולציה ---------- */
function genInterp(L){
  var x0,x1,y0,y1,xq;
  if(L===1){
    var yq,itry=0;
    do{
      x0=ri(0,4);x1=x0+pick([2,4]);
      y0=ri(1,9);y1=y0+pick([2,4,6,8]);
      xq=(x0+x1)/2;yq=(y0+y1)/2;
    }while(itry++<40&&new Set([yq,y0,y1,y1-y0]).size<4);
    return {ask:_f("אינטרפולציה לינארית בין הנקודות. מהו הערך ב-x = {0}?", num(xq)),
      expr:"("+num(x0)+" , "+num(y0)+")   ,   ("+num(x1)+" , "+num(y1)+")",
      ans:W(num(yq)),
      wrong:[
        W(num(y0),_("זה הערך בקצה השמאלי. הנקודה המבוקשת באמצע.")),
        W(num(y1),_("זה הערך בקצה הימני.")),
        W(num(y1-y0),_("זה הפרש ערכי ה-y, לא ערך הפונקציה."))
      ],
      steps:[
        S(_("השיפוע"),"",frac(num(y1)+" − "+num(y0),num(x1)+" − "+num(x0))+" = "+num(r2((y1-y0)/(x1-x0)))),
        S(_("הישר"),"","y = "+num(y0)+" + "+num(r2((y1-y0)/(x1-x0)))+"(x − "+num(x0)+")"),
        S(_("מציבים"),_("באמצע הקטע מתקבל בדיוק ממוצע הערכים."),num(yq))
      ],rule:"interp",hint:_("אינטרפולציה לינארית היא פשוט הישר שעובר בשתי הנקודות.")};
  }
  if(L===2){
    var m,yq2,jtry=0;
    do{
      x0=ri(0,3);x1=x0+pick([2,5]);
      y0=ri(1,9);y1=y0+pick([3,6,9]);
      xq=x1+pick([1,2]);
      m=(y1-y0)/(x1-x0); yq2=y0+m*(xq-x0);
    }while(jtry++<40&&new Set([r2(yq2),y1,r2(y0+m*xq),r2((y0+y1)/2)]).size<4);
    return {ask:_f("מהו הערך שהישר נותן ב-x = {0}?", num(xq)),
      expr:"("+num(x0)+" , "+num(y0)+")   ,   ("+num(x1)+" , "+num(y1)+")",
      ans:W(num(r2(yq2))),
      wrong:[
        W(num(y1),_("זה הערך בנקודה האחרונה. הנקודה המבוקשת נמצאת מחוצה לה.")),
        W(num(r2(y0+m*xq)),_("שכחתם להחסיר את x₀. הישר נמדד מהנקודה הראשונה.")),
        W(num(r2((y0+y1)/2)),_("ממוצע מתאים רק לאמצע הקטע, וכאן הנקודה מחוץ לו."))
      ],
      steps:[
        S(_("השיפוע"),"","m = "+num(r2(m))),
        S(_("מציבים בישר"),"",num(y0)+" + "+num(r2(m))+"("+num(xq)+" − "+num(x0)+")"),
        S(_("שימו לב"),_("הנקודה מחוץ לקטע הנתון, ולכן זו אקסטרפולציה — והיא פחות אמינה."),num(r2(yq2)))
      ],rule:"interp",hint:_("אותו ישר, אבל מחוץ לקטע. זו אקסטרפולציה, והיא רגישה הרבה יותר.")};
  }
  /* רמה 4 — ההנחה שנשכחת: ערכי x שונים זה מזה. בלעדיה הפולינום
     אינו קיים או אינו יחיד, והמעלה עשויה גם לרדת. */
  if(L>=4){
    var kk=pick([3,4]),cs4=pick(["gen","line","dup","dupsame"]);
    var xs=[],ys=[],i4,mm,bb,t4=0,xsTxt;
    if(cs4==="gen"){
      do{
        xs=[];ys=[];
        for(i4=0;i4<kk;i4++){xs.push(i4===0?ri(-2,1):xs[i4-1]+ri(1,3));ys.push(ri(-6,9));}
      }while(t4++<200&&Math.abs(ddLead(xs,ys))<1e-9);
    }else if(cs4==="line"){
      mm=rnz(-3,3);bb=ri(-4,6);
      for(i4=0;i4<kk;i4++){xs.push(i4===0?ri(-2,1):xs[i4-1]+ri(1,3));ys.push(mm*xs[i4]+bb);}
    }else{
      for(i4=0;i4<kk-1;i4++)xs.push(i4===0?ri(-2,1):xs[i4-1]+ri(1,3));
      for(i4=0;i4<kk-1;i4++)ys.push(ri(-6,9));
      var rp=ri(0,kk-2);
      xs.push(xs[rp]);ys.push(cs4==="dupsame"?ys[rp]:ys[rp]+rnz(1,4));
    }
    var pts=[];for(i4=0;i4<kk;i4++)pts.push("("+num(xs[i4])+" , "+num(ys[i4])+")");
    xsTxt=(cs4==="dup"||cs4==="dupsame")?_f("הערך x = {0} חוזר פעמיים, ולכן אין {1} ערכי x שונים.", num(xs[kk-1]), num(kk))
                                        :_("כל ערכי x שונים זה מזה, ולכן משפט האינטרפולציה חל.");
    var O1=_f("קיים ויחיד, ומעלתו בדיוק {0}", num(kk-1)),
        O2=_("קיים ויחיד, ומעלתו 1"),
        O3=_("לא קיים פולינום כזה כלל"),
        O4=_("קיימים אינסוף פולינומים כאלה");
    var A4=cs4==="gen"?O1:cs4==="line"?O2:cs4==="dup"?O3:O4;
    var wDup=_f("לאותו x = {0} מותאמים שני ערכי y שונים, ולכן אין פונקציה כזאת כלל — ובוודאי לא פולינום.", num(xs[kk-1])),
        wSame=_f("הנקודה החוזרת אינה תנאי נוסף, ולכן נשארו {0} תנאים בלבד והפתרון אינו יחיד.", num(kk-1));
    var WR4=[];
    if(cs4!=="gen")WR4.push(W(O1,cs4==="line"?_("כל הנקודות על ישר אחד, ולכן המקדם המוביל מתאפס והמעלה יורדת ל-1."):cs4==="dup"?wDup:wSame));
    if(cs4!=="line")WR4.push(W(O2,cs4==="gen"?_("הנקודות אינן על ישר אחד, ולכן ישר אינו יכול לעבור בכולן."):cs4==="dup"?wDup:wSame));
    if(cs4!=="dup")WR4.push(W(O3,cs4==="dupsame"?_("הנקודה החוזרת זהה לחלוטין, ואין כאן שום סתירה — פולינומים כאלה בהחלט קיימים."):_("כשכל ערכי x שונים, פולינום כזה קיים תמיד.")));
    if(cs4!=="dupsame")WR4.push(W(O4,cs4==="dup"?_("אין אף פולינום שעובר בכל הנקודות, ולכן בוודאי לא אינסוף."):_("כשכל ערכי x שונים, הפולינום הזה יחיד.")));
    return {ask:_f("נתונות {0} נקודות. מה נכון על פולינום ממעלה קטנה או שווה ל-{1} שעובר בכולן?", num(kk), num(kk-1)),
      expr:pts.join("   ,   "),
      ans:W(A4),
      wrong:WR4.slice(0,3),
      steps:[
        S(_("ההנחה שנשכחת"),_("משפט האינטרפולציה דורש שכל ערכי x יהיו שונים זה מזה. זו ההנחה שקובעת."),""),
        S(_("בודקים את ערכי x"),xsTxt,"x = "+xs.map(function(z){return num(z)}).join(" , ")),
        S(_("סופרים תנאים מול מקדמים"),_f("פולינום ממעלה קטנה או שווה ל-{0} נקבע על ידי {1} מקדמים.", num(kk-1), num(kk)),""),
        S(_("מסקנה"),cs4==="gen"?_("המקדם המוביל אינו מתאפס, ולכן המעלה היא בדיוק המקסימלית."):cs4==="line"?_("המקדם המוביל מתאפס, ולכן המעלה נמוכה מהמקסימום."):cs4==="dup"?_("שני תנאים סותרים באותה נקודה, ולכן אין פתרון."):_("תנאי אחד חוזר על עצמו, ולכן יש דרגת חופש אחת."),A4)
      ],rule:"interp",hint:_("קודם בודקים אם כל ערכי x שונים, ורק אז שואלים על המעלה.")};
  }
  /* L3 — מעלת פולינום האינטרפולציה */
  var np=ri(3,7);
  return {ask:_f("דרך {0} נקודות עם ערכי x שונים עובר פולינום אינטרפולציה יחיד. מהי מעלתו לכל היותר?", num(np)),
    expr:num(np)+" "+_("נקודות"),
    ans:W(num(np-1)),
    wrong:[
      W(num(np),_("מעלה n הייתה דורשת n ועוד 1 מקדמים, ואין מספיק משוואות.")),
      W(num(np+1),_("ככל שהמעלה גבוהה יותר צריך יותר נקודות, לא פחות.")),
      W("1",_("מעלה 1 מספיקה רק לשתי נקודות."))
    ],
    steps:[
      S(_("סופרים מקדמים"),_("פולינום ממעלה d נקבע על ידי d ועוד 1 מקדמים."),"d + 1"),
      S(_("סופרים משוואות"),_("כל נקודה נותנת משוואה אחת."),num(np)),
      S(_("משווים"),_("הפולינום יחיד, ומעלתו עשויה להיות נמוכה יותר אם הנקודות על ישר."),
        "d + 1 = "+num(np)+"   ⇒   d = "+num(np-1))
    ],rule:"interp",hint:_("n נקודות קובעות פולינום יחיד ממעלה n פחות 1 לכל היותר.")};
}

/* ---------- 16. אינטגרציה נומרית ---------- */
function genQuad(L){
  var a,b,f0,f1,f2,h;
  if(L===1){
    var tr,ttry=0;
    do{
      a=ri(0,3);b=a+pick([2,4]);
      f0=ri(1,9);f1=ri(1,9);
      tr=(b-a)*(f0+f1)/2;
    }while(ttry++<60&&(f0===f1||new Set([tr,(b-a)*(f0+f1),(f0+f1)/2,(b-a)*f0]).size<4));
    return {ask:_("חשבו את האינטגרל בשיטת הטרפז"),
      expr:"a = "+num(a)+" , b = "+num(b)+"   ,   f(a) = "+num(f0)+" , f(b) = "+num(f1),
      ans:W(num(tr)),
      wrong:[
        W(num((b-a)*(f0+f1)),_("שכחתם לחלק ב-2. שטח טרפז הוא סכום הבסיסים כפול הגובה חלקי שתיים.")),
        W(num((f0+f1)/2),_("שכחתם להכפיל ברוחב הקטע. זה רק הגובה הממוצע.")),
        W(num((b-a)*f0),_("השתמשתם רק בערך אחד. הטרפז לוקח את שני הקצוות."))
      ],
      steps:[
        S(_("מה מקרבים"),_("מחליפים את הגרף בקו ישר בין שני הקצוות, ומחשבים שטח טרפז."),""),
        S(_("הנוסחה"),"","(b − a) · "+frac("f(a) + f(b)","2")),
        S(_("מציבים"),"",num(b-a)+" · "+frac(num(f0+f1),"2")+" = "+num(tr))
      ],rule:"trap",hint:_("טרפז: רוחב הקטע כפול ממוצע ערכי הקצוות.")};
  }
  if(L===2){
    h=pick([1,2]);a=ri(0,3);
    f0=ri(1,9);f1=ri(1,9);f2=ri(1,9);
    var ct=h*(f0+2*f1+f2)/2;
    var wrongA=h*(f0+f1+f2)/2, wrongB=h*(f0+2*f1+f2), wrongC=h*(f0+4*f1+f2)/3;
    var qtry=0;
    while(qtry++<40&&new Set([ct,wrongA,wrongB,wrongC]).size<4){
      f0=ri(1,9);f1=ri(1,9);f2=ri(1,9);
      ct=h*(f0+2*f1+f2)/2;wrongA=h*(f0+f1+f2)/2;wrongB=h*(f0+2*f1+f2);wrongC=h*(f0+4*f1+f2)/3;
    }
    return {ask:_f("טרפז מורכב עם שני תת־קטעים ברוחב h = {0}. מהו הקירוב?", num(h)),
      expr:"f<sub>0</sub> = "+num(f0)+" , f<sub>1</sub> = "+num(f1)+" , f<sub>2</sub> = "+num(f2),
      ans:W(num(r2(ct))),
      wrong:[
        W(num(r2(wrongA)),_("הנקודה הפנימית נספרת פעמיים, כי היא קצה של שני טרפזים.")),
        W(num(r2(wrongB)),_("שכחתם לחלק ב-2.")),
        W(num(r2(wrongC)),_("זו נוסחת סימפסון, עם מקדם 4 וחלוקה ב-3."))
      ],
      steps:[
        S(_("מחברים שני טרפזים"),_("הקצה המשותף שייך לשניהם, ולכן מקדמו 2."),
          frac("h","2")+"( f<sub>0</sub> + 2f<sub>1</sub> + f<sub>2</sub> )"),
        S(_("מציבים"),"",frac(num(h),"2")+"( "+num(f0)+" + 2·"+num(f1)+" + "+num(f2)+" )"),
        S(_("מחשבים"),"",num(r2(ct)))
      ],rule:"trap",hint:_("בטרפז מורכב הנקודות הפנימיות מקבלות מקדם 2, והקצוות מקדם 1.")};
  }
  /* רמה 4 — לא "חשבו קירוב" אלא "האם הקירוב הזה בכלל מדויק".
     לכל נוסחה מעלת דיוק, והשאלה מצרפת אותה למעלת האינטגרנד. */
  if(L>=4){
    var mt=pick(["trap","simp"]),dg=ri(1,5),kx=mt==="trap"?1:3,ox=mt==="trap"?3:1;
    var ex4=dg<=kx,eo=dg<=ox;
    var Y=_("מדויק"),Nn=_("אינו מדויק");
    var TT=function(k,e){return _f("הנוסחה מדויקת עד מעלה {0}, ולכן כאן הקירוב {1}", num(k), e?Y:Nn)};
    var A4=TT(kx,ex4);
    return {ask:_f("מקרבים את האינטגרל של פולינום ממעלה {0} בשיטת {1}. האם הקירוב מדויק?", num(dg), mt==="trap"?_("הטרפז"):_("סימפסון")),
      expr:mt==="trap"?"(b − a) · "+frac("f(a) + f(b)","2"):frac("h","3")+"( f<sub>0</sub> + 4f<sub>1</sub> + f<sub>2</sub> )",
      ans:W(A4),
      wrong:[
        W(TT(ox,eo),_("זו מעלת הדיוק של הנוסחה השנייה. טרפז מדויק עד מעלה 1, וסימפסון עד מעלה 3.")),
        W(TT(kx,!ex4),_("מעלת הדיוק נכונה, אבל ההשוואה למעלת הפולינום הפוכה.")),
        W(TT(ox,!eo),_("גם מעלת הדיוק וגם ההכרעה אינן נכונות כאן."))
      ],
      steps:[
        S(_("מה הנוסחה מחליפה"),mt==="trap"?_("הטרפז מחליף את הגרף בישר, ולכן הוא משחזר במדויק כל פולינום ממעלה 1 לכל היותר."):_("סימפסון מעביר פרבולה דרך שלוש נקודות, אבל בפועל הוא מדויק גם למעלה 3 — שגיאת המעלה השלישית מתבטלת בסימטריה."),""),
        S(_("מעלת הדיוק"),_("המעלה הגבוהה ביותר שעבורה השגיאה מתאפסת לחלוטין, בלי שום תלות ב-h."),"d ≤ "+num(kx)),
        S(_("משווים למעלת האינטגרנד"),"",num(dg)+(ex4?" ≤ ":" > ")+num(kx)),
        S(_("מסקנה"),ex4?_("השגיאה מתאפסת, והקירוב שווה בדיוק לאינטגרל."):_("השגיאה אינה מתאפסת, ולכן הקירוב אינו מדויק — גם אם h קטן."),A4)
      ],rule:"simpson",hint:_("לכל נוסחה נומרית יש מעלת דיוק. משווים אותה למעלת הפולינום, בלי קשר ל-h.")};
  }
  /* L3 — סימפסון */
  h=pick([1,2,3]);
  f0=ri(1,9);f1=ri(1,9);f2=ri(1,9);
  var si=h*(f0+4*f1+f2)/3;
  var s1=h*(f0+2*f1+f2)/2, s2=h*(f0+4*f1+f2), s3=h*(f0+4*f1+f2)/6;
  var stry=0;
  while(stry++<40&&new Set([si,s1,s2,s3]).size<4){
    f0=ri(1,9);f1=ri(1,9);f2=ri(1,9);
    si=h*(f0+4*f1+f2)/3;s1=h*(f0+2*f1+f2)/2;s2=h*(f0+4*f1+f2);s3=h*(f0+4*f1+f2)/6;
  }
  return {ask:_f("נוסחת סימפסון עם h = {0}. מהו הקירוב?", num(h)),
    expr:"f<sub>0</sub> = "+num(f0)+" , f<sub>1</sub> = "+num(f1)+" , f<sub>2</sub> = "+num(f2),
    ans:W(num(r2(si))),
    wrong:[
      W(num(r2(s1)),_("זו נוסחת הטרפז המורכב. סימפסון נותן מקדם 4 לנקודה האמצעית.")),
      W(num(r2(s2)),_("שכחתם לחלק ב-3.")),
      W(num(r2(s3)),_("חילקתם ב-6 במקום ב-3. סכום המקדמים הוא 6, והמכנה הוא 3."))
    ],
    steps:[
      S(_("מה מקרבים"),_("במקום ישר, מעבירים פרבולה דרך שלוש הנקודות."),""),
      S(_("הנוסחה"),_("סכום המקדמים הוא 6, וההכפלה ב-h חלקי 3 מחזירה את רוחב הקטע."),
        frac("h","3")+"( f<sub>0</sub> + 4f<sub>1</sub> + f<sub>2</sub> )"),
      S(_("מציבים"),_("סימפסון מדויק לחלוטין לכל פולינום עד מעלה שלישית."),
        frac(num(h),"3")+"( "+num(f0)+" + 4·"+num(f1)+" + "+num(f2)+" ) = "+num(r2(si)))
    ],rule:"simpson",hint:_("סימפסון: h חלקי 3, ומקדמים 1 , 4 , 1.")};
}

function lazyTr(obj,fields){
  fields.forEach(function(k){
    var raw=obj[k];
    if(typeof raw!=="string")return;

      get:function(){return _(raw)}});
  });
}

/* ============================================================
   12. בניית שאלה
   מנרמל את מה שהמחולל החזיר: מסנן מסיחים כפולים או פגומים,
   מערבב, ומכין גם טקסט להקראה.
   ============================================================ */
function badStr(s){return !s||/NaN|Infinity|undefined|null/.test(s)}

function buildQ(topicId,level){
  var t=topicById(topicId);
  if(!t)t=TOPICS[0];
  var raw=null,tries=0,opts=null,i,p,seen,ansP,best=null;
  /* מגרילים עד שיוצאות ארבע אפשרויות שונות. מסיח שיצא במקרה שווה
     לתשובה נעלם בסינון, והשאלה הייתה מציגה שלוש — קל מדי בלי סיבה.
     אם אחרי כמה ניסיונות עדיין לא, לוקחים את ההגרלה העשירה ביותר. */
  while(tries<12){
    tries++;
    try{raw=t.gen(level)}catch(e){raw=null}
    if(!raw||!raw.ans||badStr(plainOf(raw.ans.h)))continue;
    ansP=plainOf(raw.ans.h);
    seen={};seen[ansP]=1;
    opts=[{h:raw.ans.h,t:ansP,ok:true,why:""}];
    for(i=0;i<(raw.wrong||[]).length;i++){
      p=plainOf(raw.wrong[i].h);
      if(badStr(p)||seen[p])continue;
      seen[p]=1;
      opts.push({h:raw.wrong[i].h,t:p,ok:false,why:raw.wrong[i].why||""});
    }
    if(!best||opts.length>best.opts.length)best={raw:raw,opts:opts};
    if(opts.length>=4)break;
  }
  if(best){raw=best.raw;opts=best.opts}
  if(!raw)raw={ask:_("חשבו"),expr:"1 + 1",ans:W("2"),wrong:[W("1"),W("3"),W("11")],steps:[S(_("חיבור"),"","1 + 1 = 2")],hint:"",rule:"order"};
  if(!opts||opts.length<2){
    ansP=plainOf(raw.ans.h);
    opts=[{h:raw.ans.h,t:ansP,ok:true,why:""}];
  }
  shuffle(opts);
  var sayTxt=raw.ask+(raw.expr?". "+speakMath(plainOf(raw.expr)):"");
  return {
    topic:t.id,topicName:t.name,level:level,
    ask:raw.ask,expr:raw.expr||"",fig:raw.fig||"",
    options:opts,steps:raw.steps||[],hint:raw.hint||"",rule:raw.rule||"",
    say:sayTxt
  };
}

   ============================================================ */
var P={list:[],i:0,q:null,phase:"ask",picked:[],hints:0,steps:0,usedHelp:false,results:[],startedAt:0};

function mastery(id){
  var m=state.mastery[id];
  if(!m){m={seen:0,ok:0,help:0,m:0};state.mastery[id]=m}
  return m;
}
function activeTopics(){
  var chosen=state.topics.filter(function(id){return !!topicById(id)});
  if(chosen.length)return chosen;
  return topicsForTrack(state.track).map(function(t){return t.id});
}
/* בחירת הנושא הבא: מי שחלש יותר מקבל יותר תורות, ומדי כמה
   שאלות חוזר נושא שנפלו בו קודם. ככה החזרה קורית לבד. */
function nextTopic(idx){
  var pool=activeTopics();
  if(idx>0&&idx%3===2&&state.wrongBank.length){
    var w=state.wrongBank[state.wrongBank.length-1-Math.floor(Math.random()*Math.min(5,state.wrongBank.length))];
    if(w&&pool.indexOf(w.topic)>=0)return w.topic;
  }
  var weights=pool.map(function(id){return 110-mastery(id).m}),total=0,i;
  for(i=0;i<weights.length;i++)total+=weights[i];
  var r=Math.random()*total;
  for(i=0;i<pool.length;i++){r-=weights[i];if(r<=0)return pool[i]}
  return pool[pool.length-1];
}
function startRound(forceTopic){
  var n=state.settings.roundLen,i;
  P.list=[];
  for(i=0;i<n;i++)P.list.push(forceTopic||nextTopic(i));
  P.i=0;P.results=[];P.startedAt=Date.now();
  loadQ();
}
function loadQ(){
  P.q=buildQ(P.list[P.i],state.level);
  P.phase="ask";P.picked=[];P.hints=0;P.steps=0;P.usedHelp=false;
  if(state.settings.autoSteps)P.steps=1;
}
function roundDone(){return P.i>=P.list.length}

/* השליטה בנושא נמדדת כממוצע נע של הביצועים האחרונים, ולא
   כמונה שמטפס לאט. תלמיד שענה נכון צריך לראות מספר שמשקף
   את זה מיד — אחרת המדד מתסכל במקום לעזור. */
function scoreAnswer(ok){
  var m=mastery(P.q.topic),d=dayRec(),score;
  m.seen++;d.a++;state.stats.answered++;
  touchDay();
  if(ok&&!P.usedHelp&&P.picked.length===1){
    m.ok++;d.c++;state.stats.correct++;state.stats.xp+=10;
    score=1;P.results.push("ok");
  }else if(ok&&!P.usedHelp){
    m.ok++;d.c++;state.stats.correct++;state.stats.xp+=4;
    score=0.7;P.results.push("ok");
  }else if(P.usedHelp){
    m.help++;state.stats.helped++;state.stats.xp+=2;
    score=0.35;P.results.push("hp");
  }else{
    score=0;P.results.push("no");
  }
  m.m=m.seen===1?Math.round(score*100):Math.round(m.m*0.6+score*40);
  if(!ok||P.usedHelp){
    state.wrongBank.push({topic:P.q.topic,ts:Date.now()});
    if(state.wrongBank.length>40)state.wrongBank.shift();
  }
  save();
}

/* ---------- תרגול ---------- */
/* מצב הקול חייב להיות במסך התרגול עצמו. הודעה שמסבירה למה
   הקול לא מה שביקשת חסרת ערך אם היא מוסתרת בהגדרות. */
function voiceStrip(){
  var s=state.settings;
  if(!s.tts)return "";
  /* מפתח שנדחה לצמיתות: אין מה להציע ואין על מה להתריע. ההקראה
     עובדת בקול המכשיר, וההסבר ממתין במסך ההגדרות. */
  if(gDead)return "";
  if(s.engine==="gemini"&&hasKey()&&ttsState!=="err"){
    if(ttsState!=="ok")return "";      /* עוד לא הושמע דבר — אין מה להודיע */
    return _f("{0}{1}<span>קול טבעי · {2}</span>", '<div class="vstrip ok">', ic("speaker",15), gvName(s.gvoice).t)+
      '<button class="btn btn-g" data-a="go" data-v="settings">'+_('להחליף')+'</button></div>';
  }
  if(ttsState==="err")
    return _f("{0}{1}<span>הקול הטבעי לא הגיב, ההקראה עברה לקול המכשיר</span>", '<div class="vstrip bad">', ic("speaker",15))+
      '<button class="btn btn-g" data-a="go" data-v="settings">'+_('לבדוק')+'</button></div>';
  return _f("{0}{1}<span>ההקראה בקול המכשיר. יש קול טבעי שנשמע כמו אדם</span>", '<div class="vstrip warn">', ic("speaker",15))+
    '<button class="btn btn-g" data-a="go" data-v="settings">'+_('להפעיל')+'</button></div>';
}
function viewPractice(){
  if(!P.q)startRound();
  if(P.phase==="done")return viewSummary();
  var q=P.q,calm=state.settings.calm;
  var h='<main id="main" class="wrap" style="padding-top:18px;padding-bottom:44px">';
  /* שורת מצב */
  h+='<div class="spread">'+
      '<div class="row"><span class="chip area '+topicCls(q.topic)+'">'+q.topicName+'</span>'+
_f("{0}{1} מתוך {2}</span></div>", '<span class="chip">'+_('שאלה')+' ', (P.i+1), P.list.length)+
      '<div class="row"><span class="dots">'+
        P.list.map(function(ignored,i){
          var c=i<P.results.length?(P.results[i]==="ok"?"ok":P.results[i]==="hp"?"hp":"no"):"";
          return '<span class="dot '+c+'"></span>';
        }).join("")+'</span>'+
_f("{0}{1} עצירה</button></div>", '<button class="btn btn-g" style="padding:8px 12px;font-size:.85rem" data-a="stop">', ic("pause",15))+

  h+='<div class="card pad rise '+topicCls(q.topic)+'" style="border-top:3px solid var(--c)">';
  h+='<p style="font-size:clamp(1rem,3.6vw,1.15rem);font-weight:600">'+q.ask+'</p>';
  if(q.expr)h+='<p class="mline" style="margin-top:14px">'+q.expr+'</p>';

  /* כפתורי עזר */
  h+='<div class="row" style="margin-top:16px;gap:8px">'+
     (state.settings.tts?_f("{0}{1} הקראה</button>", '<button class="btn btn-g" style="padding:9px 13px;font-size:.88rem" data-a="read">', ic("speaker",16)):"")+
_f("{0}{1}>{2} רמז</button>", '<button class="btn btn-g" style="padding:9px 13px;font-size:.88rem" data-a="hint"', (P.hints>0?" disabled":""), ic("bulb",16))+
_f("{0}{1}>{2} פתרון מודרך</button>", '<button class="btn btn-g" style="padding:9px 13px;font-size:.88rem" data-a="guide"', (P.steps>0?" disabled":""), ic("steps",16))+
     (q.rule?_f("{0}{1}{2}{3} הנוסחה</button>", '<button class="btn btn-g" style="padding:9px 13px;font-size:.88rem" data-a="rule" data-r="', q.rule, '">', ic("book",16)):"")+
     '</div>';
  if(P.hints>0&&q.hint)h+='<div class="hintbox rise"><b>'+_('רמז')+'</b><div class="sm hintxt" style="margin-top:3px">'+q.hint+'</div></div>';
  /* תשובות */
  var keys=["1","2","3","4"];
  h+='<div class="opts">'+q.options.map(function(o,i){
    var cls="opt",dis="";
    var wasPicked=P.picked.indexOf(i)>=0;
    if(P.phase==="reveal"){
      dis=" disabled";
      if(o.ok)cls+=" right";
      else if(wasPicked)cls+=calm?" gone":" wrong";
      else cls+=" dim";
    }else if(wasPicked){cls+=calm?" gone":" wrong";dis=" disabled"}
    return '<button class="'+cls+'"'+dis+' data-a="ans" data-i="'+i+'">'+
      '<span class="k">'+keys[i]+'</span><span class="m">'+o.h+'</span></button>';
  }).join("")+'</div>';
  /* אבחון הטעות האחרונה */
  if(P.lastWhy&&P.phase!=="reveal"){
    h+='<div class="diag rise"><b>'+_('מה קרה כאן')+'</b><div class="sm" style="margin-top:3px">'+P.lastWhy+'</div></div>';
  }
  h+='</div>';
  /* פתרון מודרך */
  if(P.steps>0||P.phase==="reveal"){
    var showAll=P.phase==="reveal";
    var shown=showAll?q.steps.length:Math.min(P.steps,q.steps.length);
    h+=_f("{0}{1}{2}{3} הפתרון, צעד אחר צעד</div>", '<div class="card pad rise ', topicCls(q.topic), '"><div class="spread"><div class="h2" style="color:var(--c)">', ic("steps",18))+
       (state.settings.tts?_f("{0}{1} הקראה</button>", '<button class="btn btn-g" style="padding:8px 12px;font-size:.85rem" data-a="readsteps">', ic("speaker",15)):"")+'</div>';
    h+='<div class="steps">'+q.steps.map(function(s,i){
      if(i>=shown)return "";
      return '<div class="step'+(i===q.steps.length-1?" last":"")+'"><div class="st"><span class="num">'+(i+1)+'</span>'+s.t+'</div>'+
        (s.d?'<div class="sd">'+s.d+'</div>':"")+
        (s.m?'<div class="mstep">'+s.m+'</div>':"")+'</div>';
    }).join("")+'</div>';
    if(!showAll&&shown<q.steps.length){
      h+='<button class="btn btn-p w" style="margin-top:12px" data-a="nextstep">'+_('הצעד הבא')+' '+ic("arrow",17)+'</button>';
      h+='<p class="sub xs" style="text-align:center;margin-top:8px">'+_('אפשר לעצור בכל שלב ולנסות להמשיך לבד.')+'</p>';
    }
    h+='</div>';
  }
  /* פס תחתון אחרי מענה */
  if(P.phase==="reveal"){
    var kind=P.results[P.results.length-1];
    h+='<div class="card pad rise" style="border-inline-start:4px solid var(--'+(kind==="ok"?"ok":kind==="hp"?"accent":"bad")+')">'+
       '<div class="row">'+ic(kind==="ok"?"check":"bulb",19)+'<b>'+lineFor(kind)+'</b></div>'+
       '<button class="btn btn-p w" style="margin-top:12px;padding:14px" data-a="next">'+
         (P.i+1>=P.list.length?_("לסיכום הסבב"):_("לשאלה הבאה"))+' '+ic("arrow",18)+'</button>'+
       (state.settings.keys?'<p class="sub xs" style="text-align:center;margin-top:8px">'+_('אפשר גם ללחוץ Enter')+'</p>':"")+
       '</div>';
  }
  h+='</div>';
  if(state.settings.keys&&P.phase==="ask")
    h+='<p class="sub xs" style="margin-top:14px;text-align:center">'+_('מקלדת: 1–4 תשובה · רווח הקראה · H רמז · S פתרון')+'</p>';
  return h+'</main>';
}

function viewSummary(){
  var ok=P.results.filter(function(r){return r==="ok"}).length;
  var hp=P.results.filter(function(r){return r==="hp"}).length;
  var no=P.results.length-ok-hp;
  var pct=Math.round(ok/Math.max(1,P.results.length)*100);
  var byTopic={},i;
  for(i=0;i<P.list.length&&i<P.results.length;i++){
    var id=P.list[i];
    if(!byTopic[id])byTopic[id]={ok:0,n:0};
    byTopic[id].n++;if(P.results[i]==="ok")byTopic[id].ok++;
  }
  var worst=null;
  for(var k in byTopic)if(byTopic[k].n>=2&&(!worst||byTopic[k].ok/byTopic[k].n<byTopic[worst].ok/byTopic[worst].n))worst=k;
  var title=pct>=85?_("סבב חזק."):pct>=60?_("סבב טוב."):pct>=35?_("סבב עם עבודה."):_("סבב קשה — וזה בסדר.");
  var sub=pct>=85?_("אתם שולטים ברוב מה שתרגלתם כאן.")
       :pct>=60?_("רוב הדברים במקום. יש נקודה אחת או שתיים שכדאי לחדד.")
       :pct>=35?_("חלק מהחומר עוד לא יושב. זה בדיוק מה שמדידה כזאת נועדה להראות.")
       :_("סבב כזה לא אומר עליכם כלום חוץ מזה שהחומר הזה חדש. שווה לרדת רמה ולבנות מלמטה.");
  var h='<main id="main" class="wrap" style="padding-top:26px;padding-bottom:44px;max-width:760px">';
  h+='<div class="card pad rise"><h1 class="h1">'+title+'</h1><p class="sub">'+sub+'</p>'+
     '<div class="grid g4" style="margin-top:18px">'+
_f("{0}{1}</b><span>נכון לבד</span></div>", '<div class="tile" style="--c:var(--ok)"><b>', ok)+
_f("{0}{1}</b><span>עם פתרון מודרך</span></div>", '<div class="tile" style="--c:var(--c-alg)"><b>', hp)+
_f("{0}{1}</b><span>לא נפתרו</span></div>", '<div class="tile" style="--c:var(--bad)"><b>', no)+
_f("{0}{1}%</b><span>דיוק</span></div>", '<div class="tile" style="--c:var(--c-geo)"><b>', pct)+
     '</div>';
  h+='<hr class="sep"><div class="h2">'+_('לפי נושא')+'</div><div class="grid" style="margin-top:10px">'+
     Object.keys(byTopic).map(function(id){
       var b=byTopic[id],tp=topicById(id);
       return '<div class="spread '+topicCls(id)+'" style="gap:8px"><span class="arh">'+tp.name+'</span>'+
_f("{0}{1}{2}{3} מתוך {4}</span></div>", '<span class="chip ', (b.ok===b.n?"ok":b.ok===0?"bad":"warn"), '">', b.ok, b.n);
     }).join("")+'</div>';
  if(worst&&byTopic[worst].ok<byTopic[worst].n){
    var wt=topicById(worst);
    h+='<div class="card pad" style="margin-top:16px;background:var(--surface2)">'+
_f("{0}{1}<b>מה לקחת מכאן</b></div>", '<div class="row">', ic("target",17))+
_f("{0}{1} היה הנושא שהכי הפריע בסבב הזה. סבב ממוקד אחד בו יעשה יותר מעוד עשר שאלות מעורבות.</p>", '<p class="sub sm">', wt.name)+
_f("{0}{1}{2}{3} סבב ממוקד ב{4}</button></div>", '<button class="btn btn-p" style="margin-top:10px" data-a="starttopic" data-t="', worst, '">', ic("pencil",16), wt.name);
  }
  h+='<div class="row" style="margin-top:18px">'+
_f("{0}{1} סבב נוסף</button>", '<button class="btn btn-p" data-a="start">', ic("refresh",17))+
_f("{0}{1} לדף הבית</button>", '<button class="btn btn-g" data-a="go" data-v="home">', ic("home",17))+
_f("{0}{1} להתקדמות</button></div>", '<button class="btn btn-g" data-a="go" data-v="progress">', ic("chart",17));
  return h+'</div></main>';
}

function viewProgress(){
  var st=state.stats;

  var days=[],i,d=new Date();
  for(i=13;i>=0;i--){
    var dd=new Date(d.getTime()-i*86400000);
    var key=dd.getFullYear()+"-"+String(dd.getMonth()+1).padStart(2,"0")+"-"+String(dd.getDate()).padStart(2,"0");
    days.push({k:key,r:state.days[key]||{a:0,c:0},lbl:_("אבגדהוש").charAt(dd.getDay())});
  }
  var maxA=Math.max.apply(null,days.map(function(x){return x.r.a}).concat([1]));
  var seen=TOPICS.filter(function(t){return mastery(t.id).seen>0});
  var h='<main id="main" class="wrap" style="padding-top:22px;padding-bottom:44px">';
  h+='<h1 class="h1">'+_('התקדמות')+'</h1><p class="sub">'+_('המספרים כאן הם כלי עבודה, לא ציון.')+'</p>';
  h+='<div class="grid g4" style="margin-top:16px">'+
_f("{0}{1}</b><span>שאלות שנפתרו</span></div>", '<div class="tile" style="--c:var(--c-base)"><b>', st.answered)+
_f("{0}{1}%</b><span>דיוק כולל</span></div>", '<div class="tile" style="--c:var(--ok)"><b>', acc)+
_f("{0}{1}</b><span>עם פתרון מודרך</span></div>", '<div class="tile" style="--c:var(--c-alg)"><b>', st.helped)+

/* ============================================================
   18. מבחן כיתתי — פרסום בוואטסאפ, קבלת תשובות וציונים
   ------------------------------------------------------------
   אין שרת, ואין כוונה שיהיה. לכן המבחן אינו נשלח לשום מקום:
   הוא *נארז לתוך הקישור*. המורה מקבל קישור, שולח אותו בוואטסאפ,
   והמכשיר של התלמיד בונה מהקישור בדיוק את אותן שאלות.

   מה שהופך את זה לאפשרי הוא שכל מחולל שאלות כאן משתמש ב-
   Math.random בלבד. אם מזרעים אותו, אותו זרע מייצר את אותן
   שאלות ואת אותו סדר תשובות — אצל המורה ואצל התלמיד. הקישור
   נושא זרע ורשימת נושאים, לא עשרים שאלות מלאות, ולכן הוא נשאר
   קצר מספיק לוואטסאפ.

   שלוש מגבלות שנאמרות כאן במפורש כי הן חלק מהתכנון:
   · אין איסוף אוטומטי. התלמיד שולח קוד תשובות בוואטסאפ, והמורה
     מדביק אותו. זה המחיר של אפס שרת ואפס עלות.
   · אפשר לזייף קוד. הציון מחושב מחדש אצל המורה מתוך התשובות
     ולא נלקח מהתלמיד, אבל אין כאן הגנה קריפטוגרפית — זה מבחן
     כיתתי מעצב, לא בגרות.
   · שמות התלמידים נשארים במכשיר של המורה. הם לא עוברים דרך
     שום שרת, כי אין שרת.
   ============================================================ */
var GENV=5;                 /* גרסת המחוללים. מבחן שנוצר בגרסה אחרת
                               אינו נפתח — עדיף הודעה ברורה מאשר
                               עשרים שאלות אחרות בשקט. */
var EKEY="shlav-exams-math-uni3-v1";   /* מפתח לאפליקציה הזאת בלבד */
var EKEY_OLD="shlav-exams-v1";  /* המפתח המשותף הישן. לקריאה בלבד, לא נמחק. */

/* --- מחולל מזורע. mulberry32: קצר, מהיר, ופיזור טוב דיו --- */
function withSeed(seed,fn){
  var real=Math.random,s=(seed>>>0)||1;
  Math.random=function(){
    s|=0; s=s+0x6D2B79F5|0;
    var t=Math.imul(s^s>>>15,1|s);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
  try{return fn()}finally{Math.random=real}
}
function hash32(str){
  var h=0x811c9dc5,i;
  for(i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193)}
  return (h>>>0);
}
/* base64url. הניקוי בפענוח אינו קוסמטי: וואטסאפ שובר מחרוזות
   ארוכות בשורות, ורווח אחד הורס את כל הקוד. */
function b64e(str){
  var bytes=new TextEncoder().encode(str),bin="",i;
  for(i=0;i<bytes.length;i+=8192)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));
  return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function b64d(s){
  s=String(s||"").replace(/[^A-Za-z0-9\-_]/g,"").replace(/-/g,"+").replace(/_/g,"/");
  while(s.length%4)s+="=";
  var bin=atob(s),bytes=new Uint8Array(bin.length),i;
  for(i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
/* הזרע של המשבצת נכנס למזהה: שני מבחנים באותם נושאים ובאותה
   רמה, שהמורה החליף באחד מהם שאלה, אינם אותו מבחן. מבחן ישן
   שאין לו זרעים מקבל בדיוק את המזהה שקיבל תמיד — אחרת ההגשות
   שכבר נקלטו אליו מתייתמות. */
function examId(spec){return hash32(spec.s+"|"+spec.q.map(function(x){
  return x[0]+x[1]+(x.length>2?"@"+x[2]:"")}).join(",")).toString(36)}
function encodeExam(spec){return b64e(JSON.stringify(spec))}
function decodeExam(code){
  try{
    var o=JSON.parse(b64d(code));
    if(!o||!o.q||!o.q.length||typeof o.s!=="number")return null;
    o.q=o.q.filter(function(x){return topicById(x[0])});
    return o.q.length?o:null;
  }catch(e){return null}
}
/* בונה את שאלות המבחן. אותו זרע → אותן שאלות, גם אצל המורה
   כשהוא בודק וגם אצל התלמיד כשהוא נבחן. */
function examQuestions(spec){
  /* מסננים נושאים שאינם מוכרים לאפליקציה הזאת, בדיוק כמו decodeExam.
     בלי הסינון buildQ מחזיר null על נושא זר, והמסך נופל על
     q.topic של null. עדיף לדלג בשקט מאשר להתרסק. */
  var pairs=(spec.q||[]).filter(function(x){return !!topicById(x[0])});
  /* מבחן שנבנה עם זרע לכל משבצת נבנה משבצת אחרי משבצת, וכל
     שאלה תלויה בזרע שלה בלבד — כך המורה יכול להחליף אחת מהן.
     מבחן ישן, בלי זרעים, חייב להיבנות בדיוק כפי שנבנה ביום
     שנשלח: אחרת הציון של מי שכבר נבחן משתנה למפרע. */
  if(pairs.length&&pairs.every(function(x){return typeof x[2]==="number"}))
    return pairs.map(function(p){return exBuildSlot(p)})
                .filter(function(q){return !!q});
  return withSeed(spec.s,function(){
    return pairs.map(function(pair){return buildQ(pair[0],pair[1])})
                .filter(function(q){return !!q});
  });
}
/* --- בחירת השאלות בידי המורה ---------------------------------
   עד כאן המורה בחר נושאים, רמה ומספר שאלות — והשאלות עצמן הוגרלו
   מאחורי גבו. הוא ראה אותן לראשונה רק אחרי שהמבחן כבר היה אצל
   התלמידים. מעכשיו כל שאלה היא משבצת נפרדת עם זרע משלה: המורה
   רואה אותה לפני השליחה, מחליף אותה בשאלה אחרת מאותו נושא,
   מסיר אותה, או מוסיף שאלה מנושא שחסר לו.

   הזרע הנפרד לכל משבצת הוא מה שמאפשר את זה. בזרם אקראי אחד
   ומשותף, כפי שהיה עד כאן, החלפה של השאלה השלישית הייתה משנה
   גם את הרביעית ואת החמישית — כלומר לא "החלפה" אלא הגרלה מחדש
   של כל מה שאחריה.

   24 ביט ולא 32: הזרע נוסע בתוך הקישור שנשלח בוואטסאפ, וזרע
   קצר יותר הוא קישור קצר יותר. שישה־עשר מיליון אפשרויות למשבצת
   הן הרבה מעבר למה שהמחולל עצמו יודע לייצר. */
function exNewSeed(){return (Math.random()*16777215)>>>0}
function exSlot(topicId,level){return [topicId,level,exNewSeed()]}
/* אותו זרע → אותה שאלה בדיוק: אצל המורה כשהוא בוחר, ואצל
   התלמיד כשהוא נבחן. */
function exBuildSlot(slot){
  if(!slot||!topicById(slot[0]))return null;
  return withSeed(slot[2],function(){return buildQ(slot[0],slot[1])})||null;
}
/* מסך הבנייה מצייר את עצמו מחדש אחרי כל לחיצה, ובניית עשרים
   וחמש שאלות בכל ציור מיותרת. המטמון הוא לתצוגה בלבד — מי
   שנבחן בונה את שאלותיו מחדש, כדי שאיש לא יערוך בטעות אובייקט
   שגם מסך אחר מחזיק בו. */
var EXQCACHE={};
/* לכל אפליקציה מנגנון שפה משלה, ולא לכולן אותם שמות. הפנייה
   דרך window ולא בשם ישיר, כי שם שאינו קיים באפליקציה מסוימת
   הוא שגיאה בעיני הבודקים — רעש שמסתיר שגיאה אמיתית. */
function exLangKey(){
  try{
    var g=(typeof window!=="undefined")?window:{};
    if(typeof g.xlg==="function")return g.xlg();
    if(typeof g.LG==="string")return g.LG;
    return (state&&state.settings&&state.settings.lang)||"he";
  }catch(e){return "he"}
}
function exPreviewQ(slot){
  if(!slot)return null;
  var k=slot[0]+"|"+slot[1]+"|"+slot[2]+"|"+exLangKey();
  if(!(k in EXQCACHE)){
    /* מורה שמחליף שאלות שוב ושוב מייצר מפתח חדש בכל לחיצה.
       מטמון שרק גדל הוא דליפה; מרוקנים אותו ומתחילים מחדש. */
    if(Object.keys(EXQCACHE).length>400)EXQCACHE={};
    EXQCACHE[k]=exBuildSlot(slot);
  }
  return EXQCACHE[k];
}
function exTopicName(id){
  var t=topicById(id); if(!t)return "";
  var g=(typeof window!=="undefined")?window:{};
  return (typeof g.tName==="function"?g.tName(t):t.name)||"";
}
function exRightAnswer(q){
  var i; if(!q||!q.options)return null;
  for(i=0;i<q.options.length;i++)if(q.options[i].ok)return q.options[i];
  return null;
}
/* המשבצות שהמורה עורך. נבנות מחדש רק כשנושא, רמה או מספר
   השאלות משתנים; עריכה של משבצת בודדת נשמרת. */
function exSlots(){
  if(EB.q&&EB.q.length)return EB.q;
  var tops=EB.topics.filter(function(x){return topicById(x)});
  if(!tops.length)tops=topicsForTrack(state.track).slice(0,3).map(function(t){return t.id});
  var q=[],i;
  for(i=0;i<EB.n;i++)q.push(exSlot(tops[i%tops.length],EB.level));
  /* מערבבים כאן ולא בשליחה: המורה רואה את הסדר הסופי ומאשר אותו. */
  EB.q=shuffle(q);
  return EB.q;
}
function examUrl(spec){
  var base=location.origin+location.pathname;
  return base+"#x="+encodeExam(spec);
}
function waLink(text,phone){
  var p=String(phone||"").replace(/[^0-9]/g,"");
  return "https://wa.me/"+p+"?text="+encodeURIComponent(text);
}

var EX={list:[]};
/* --- הגירה מהמפתח המשותף הישן ---------------------------------
   עד הגרסה הזאת כל האפליקציות כתבו מבחנים לאותו מפתח localStorage
   ובאותו origin, ולכן מבחן שנבנה במתמטיקה הופיע ברשימת המבחנים של
   אנגלית והפיל את המסך. מעכשיו לכל אפליקציה מפתח משלה, ובטעינה
   מועתקות מהמפתח הישן רק רשומות שכל נושאיהן מוכרים כאן.
   המפתח הישן נשאר על כנו ואינו נמחק, כדי שגם אפליקציה אחרת תוכל
   לקלוט ממנו את המבחנים ששייכים לה. --------------------------- */
function exSpecKnown(spec){
  if(!spec||!spec.q||!spec.q.length)return false;
  for(var i=0;i<spec.q.length;i++){
    var pair=spec.q[i];
    if(!pair||!topicById(pair[0]))return false;
  }
  return true;
}
function exAdoptLegacy(){
  var added=0;
  try{
    var raw=localStorage.getItem(EKEY_OLD); if(!raw)return;
    var old=JSON.parse(raw); if(!old||!old.list||!old.list.length)return;
    var have={},i,ex;
    for(i=0;i<EX.list.length;i++)have[EX.list[i].id]=1;
    for(i=0;i<old.list.length;i++){
      ex=old.list[i];
      if(!ex||!ex.id||have[ex.id])continue;
      if(!exSpecKnown(ex.spec))continue;
      EX.list.push(ex); have[ex.id]=1; added++;
    }
  }catch(e){return}
  if(added)exSave();
}
function exLoad(){
  try{var r=localStorage.getItem(EKEY);if(r){var o=JSON.parse(r);if(o&&o.list)EX=o}}catch(e){}
  if(!EX.list)EX.list=[];
  exAdoptLegacy();
}
function exSave(){try{localStorage.setItem(EKEY,JSON.stringify(EX))}catch(e){}}
function exFind(id){for(var i=0;i<EX.list.length;i++)if(EX.list[i].id===id)return EX.list[i];return null}

/* --- קוד ההגשה של התלמיד --- */
function encodeResult(id,name,answers){
  var body={i:id,n:String(name||"").slice(0,40),a:answers,d:todayIso()};
  body.c=hash32(JSON.stringify([body.i,body.n,body.a])).toString(36);
  return b64e(JSON.stringify(body));
}
function decodeResult(code){
  try{
    var o=JSON.parse(b64d(code));
    if(!o||!o.i||!o.a||!o.a.length)return null;
    o.ok=(o.c===hash32(JSON.stringify([o.i,o.n,o.a])).toString(36));
    return o;
  }catch(e){return null}
}
/* הציון מחושב כאן מחדש מתוך התשובות. מה שהתלמיד שלח הוא מה
   שסימן, לא כמה הוא קיבל. */
function gradeResult(spec,res){
  var qs=examQuestions(spec),per=[],ok=0,i,q,a;
  for(i=0;i<qs.length;i++){
    q=qs[i]; a=res.a[i];
    var right=(a>=0&&q.options[a]&&q.options[a].ok)?1:0;
    if(right)ok++;
    per.push({topic:q.topic,topicName:q.topicName,ok:right,
              picked:(a>=0&&q.options[a])?q.options[a].t:"—",
              answer:(q.options.filter(function(o){return o.ok})[0]||{}).t||""});
  }
  return {ok:ok,n:qs.length,pct:Math.round(100*ok/qs.length),per:per};
}

function xlg(){return LG}
function xt(k){var d=XT[xlg()];var v=d&&d[k];return v===undefined?(XK[k]===undefined?k:XK[k]):v}
/* {0} ו-{1} — סדר המילים משתנה בין השפות, ולכן מספרים ולא רצף */
function xf(k){var s=xt(k),a=arguments,i;
  for(i=1;i<a.length;i++)s=s.split("{"+(i-1)+"}").join(String(a[i]));
  return s}

function viewLocked(){
  return '<div class="wrap" style="padding-block:40px;max-width:32rem">'+
    '<div class="card pad"><h1 class="h1">'+esc(xt("teTitle"))+'</h1>'+
    '<p class="sub">'+esc(xt("teLocked"))+'</p>'+
    '<div class="row" style="margin-top:14px">'+
    '<button class="btn btn-p" data-a="teask">'+esc(xt("teUnlock"))+'</button></div></div></div>';
}
/* השאלות עצמן, על המסך של המורה, לפני שהמבחן נשלח. */
function viewExamSlots(){
  var ls=exSlots(),h="",tops=EB.topics.filter(function(x){return topicById(x)});
  h+='<div style="margin-top:18px"><b>'+esc(xt("exQs"))+'</b>'+
     '<p class="sub" style="margin:4px 0 8px">'+esc(xt("exQsNote"))+'</p>';
  h+='<div class="row" style="margin:0 0 10px">'+
     '<button class="xq-b" data-a="exqans" aria-pressed="'+(EB.ans?"true":"false")+'">'+
     (EB.ans?esc(xt("exQsHide")):esc(xt("exQsShow")))+'</button>'+
     '<button class="xq-b" data-a="exqreset">'+esc(xt("exQsReset"))+'</button></div>';
  h+='<ol class="xq-list">';
  ls.forEach(function(sl,i){
    var q=exPreviewQ(sl),ok=exRightAnswer(q);
    h+='<li class="xq"><div class="xq-top">'+
       '<span class="xq-n">'+(i+1)+'</span>'+
       '<span class="xq-tp">'+esc(q&&q.topicName?q.topicName:exTopicName(sl[0]))+'</span>'+
       '<span class="xq-acts">'+
       '<button class="xq-b" data-a="exqroll" data-i="'+i+'">'+esc(xt("exQsSwap"))+'</button>'+
       /* המבחן חייב להישאר עם שאלה אחת לפחות, ולכן הכפתור נעלם
          ולא מוצג כבוי: כפתור שאי אפשר ללחוץ עליו מבלבל. */
       (ls.length>1?'<button class="xq-b" data-a="exqdel" data-i="'+i+'">'+esc(xt("exQsDrop"))+'</button>':"")+
       '</span></div>';
    if(q){
      h+='<div class="xq-q">'+q.ask+(q.expr?'<div class="xq-e">'+q.expr+'</div>':"")+'</div>';
      if(EB.ans&&ok)h+='<div class="xq-a"><b>'+esc(xt("exQsAns"))+'</b> '+ok.h+'</div>';
    }else h+='<div class="xq-q sub">'+esc(xt("exQsFail"))+'</div>';
    h+='</li>';
  });
  h+='</ol>';
  /* כפתור לכל נושא שנבחר, כדי שהמורה יוסיף בדיוק את מה שחסר לו
     ולא שאלה אקראית מנושא כלשהו. */
  if(tops.length){
    h+='<div class="row xq-add"><span class="sub">'+esc(xt("exQsAdd"))+'</span>';
    tops.forEach(function(id){
      h+='<button class="xq-b" data-a="exqadd" data-t="'+esc(id)+'">'+
         '<b aria-hidden="true">+</b> <span>'+esc(exTopicName(id))+'</span></button>';
    });
    h+='</div>';
  }
  return h+'</div>';
}
function viewExamNew(){
  var tops=topicsForTrack(state.track);
  if(!EB.topics.length)EB.topics=tops.slice(0,4).map(function(t){return t.id});
  var h='<div class="wrap" style="padding-block:22px">';
  h+='<h1 class="h1">'+esc(xt("exTitle"))+'</h1>'+
     '<p class="sub">'+esc(xt("exLead"))+'</p>';

  h+='<div class="card pad" style="margin-top:16px">';
  h+='<label class="tt"><b>'+esc(xt("exName"))+'</b></label>'+
     '<input class="field" id="exTitle" value="'+esc(EB.title)+'" placeholder="'+esc(xt("exNamePh"))+'" maxlength="60">';

  h+='<div style="margin-top:16px"><b>'+esc(xt("exUnits"))+'</b>'+
     '<div class="seg" style="margin-top:7px">'+[3,4,5].map(function(tr){
       return '<button class="'+(state.track===tr?"on":"")+'" data-a="track" data-t="'+tr+'">'+tr+' '+esc(xt("exUnitSuf"))+'</button>'
     }).join("")+'</div></div>';

  h+='<div style="margin-top:16px"><b>'+esc(xt("exLevel"))+'</b><div class="seg" style="margin-top:7px">'+
     LVL.map(function(l,i){
       return '<button class="'+(EB.level===i+1?"on":"")+'" style="--c:'+LVL_C[i]+'" data-a="exlvl" data-l="'+(i+1)+'">'+l+'</button>'
     }).join("")+'</div></div>';

  h+='<div style="margin-top:16px"><b>'+esc(xt("exCount"))+': <span id="exNlab">'+EB.n+'</span></b>'+
     '<input type="range" min="5" max="25" step="1" value="'+EB.n+'" data-slide="exn" style="margin-top:6px"></div>';
  h+='<div style="margin-top:16px"><b>'+esc(xt("exTime"))+': <span id="exMlab">'+
     esc(EB.mins?EB.mins+' '+xt("minutes"):xt("none"))+'</span></b>'+
     '<p class="sub sm" style="margin:2px 0 0">'+esc(xt("exTimeNote"))+'</p>'+
     '<input type="range" min="0" max="90" step="5" value="'+EB.mins+'" data-slide="exm" style="margin-top:6px"></div>';

  h+='<div style="margin-top:18px"><b>'+esc(xt("exTopics"))+'</b>'+
