<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>אקסיומה ג׳ — שנה שלישית, צעד אחר צעד</title>
<meta name="description" content="תרגול מתמטיקה לשנה ג׳ באוניברסיטה: אנליזה, פונקציות מרוכבות, אלגברה מופשטת ושיטות נומריות. כל שאלה עם פתרון מודרך צעד־צעד, זיהוי הטעות, דף נוסחאות והקראה בקול טבעי." />
<meta name="theme-color" content="#f5f7fb" media="(prefers-color-scheme:light)" />
<meta name="theme-color" content="#0e1117" media="(prefers-color-scheme:dark)" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   אקסיומה ג׳ — מתמטיקה לשנה ג׳
   השנה שמסיימת את התואר: אנליזה, אנליזה מרוכבת, אלגברה מופשטת
   ואנליזה נומרית. החומר מופשט יותר, ולכן כל שאלה כאן נפתחת
   לצעדים — כי בהפשטה קל במיוחד לאבד את החוט.
   ============================================================ */
:root{
  --ar:"Noto Sans Arabic",system-ui,"Segoe UI",Arial,sans-serif;
  --font:"Heebo","Rubik",system-ui,"Segoe UI",Arial,sans-serif;
  --bg:#f5f7fb; --surface:#ffffff; --surface2:#eef1f7;
  --ink:#101828; --muted:#5b6478; --faint:#687080; --line:#e0e4ee;
  --accent:#4f46e5; --accent-ink:#ffffff; --accent-soft:#e9e8fd;
  /* צהוב ההדגשה — אותו צהוב של מקריא קולי, כדי שמעקב ההקראה
     ייראה אותו דבר בכל האתר. */
  --hit:#f5c451; --hit-ink:#1a1300;
  --cyan:#0e7490; --cyan-soft:#dcf3f8;
  --ok:#15803d; --ok-soft:#dcfce7; --bad:#be123c; --bad-soft:#ffe4e9;
  --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px -12px rgba(16,24,40,.18);
  --r:14px;
  /* צבע לכל תחום לימוד. זה לא קישוט — זה עוזר לזהות מיד באיזה
     סוג חומר מדובר, וזה בדיוק מה שעוזר למי שמתקשה להתמצא. */
  --c-base:#0a6f66; --cs-base:#d2f4ef;
  --c-alg:#4a45c9;  --cs-alg:#e6e5fe;
  --c-geo:#9a4708;  --cs-geo:#fbecd3;
  --c-data:#be185d; --cs-data:#fbdfeb;
}

/* Heebo, Fredoka ו-Assistant אינם מכילים גליפים ערביים. בלי
   המשפחה הזאת הממשק הערבי נופל לגופן ברירת המחדל של המערכת —
   נמדד: הוא הוצג כאן ב-Heebo. Noto Sans Arabic נטען מאותה בקשת
   גופנים שכבר קיימת, ולכן אין כאן תלות חיצונית חדשה, וקובצי
   הגופן נמשכים רק כשבאמת מוצג טקסט ערבי. */
html[lang="ar"] body,html[lang="ar"] input,html[lang="ar"] button,
html[lang="ar"] textarea,html[lang="ar"] select{font-family:var(--ar)}
:root[data-theme="dark"]{
  --bg:#0e1117; --surface:#161b26; --surface2:#1e2532;
  --ink:#e8ecf4; --muted:#9aa4ba; --faint:#8f99ae; --line:#28313f;
  --accent:#818cf8; --accent-ink:#0e1117; --accent-soft:#232842;
  --hit:#ffd24d; --hit-ink:#241a00;
  --cyan:#22d3ee; --cyan-soft:#132b33;
  --ok:#4ade80; --ok-soft:#132a1c; --bad:#fb7185; --bad-soft:#33161f;
  --warn:#fbbf24; --warn-soft:#33260f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  --c-base:#2dd4bf; --cs-base:#0f2e2b;
  --c-alg:#a5b4fc;  --cs-alg:#1e2140;
  --c-geo:#fbbf24;  --cs-geo:#33270f;
  --c-data:#f472b6; --cs-data:#33162a;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1117; --surface:#161b26; --surface2:#1e2532;
    --ink:#e8ecf4; --muted:#9aa4ba; --faint:#8f99ae; --line:#28313f;
    --accent:#818cf8; --accent-ink:#0e1117; --accent-soft:#232842;
    --hit:#ffd24d; --hit-ink:#241a00;
    --cyan:#22d3ee; --cyan-soft:#132b33;
    --ok:#4ade80; --ok-soft:#132a1c; --bad:#fb7185; --bad-soft:#33161f;
    --warn:#fbbf24; --warn-soft:#33260f;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  --c-base:#2dd4bf; --cs-base:#0f2e2b;
  --c-alg:#a5b4fc;  --cs-alg:#1e2140;
  --c-geo:#fbbf24;  --cs-geo:#33270f;
  --c-data:#f472b6; --cs-data:#33162a;
  }
}
/* ניגודיות גבוהה — שחור על לבן, מסגרות מלאות, בלי גוונים רכים */
:root.hc{
  --bg:#ffffff; --surface:#ffffff; --surface2:#ffffff;
  --ink:#000000; --muted:#1a1a1a; --faint:#333333; --line:#000000;
  --accent:#00308f; --accent-ink:#ffffff; --accent-soft:#e8edf8;
  --hit:#ffe600; --hit-ink:#000000;
  --cyan:#004b57; --cyan-soft:#e6f2f4;
  --ok:#0a5c2a; --ok-soft:#e6f4ea; --bad:#8c0f2c; --bad-soft:#fbe9ed;
  --warn:#6b3d00; --warn-soft:#f7efdf; --shadow:none;
  --c-base:#00308f; --cs-base:#e8edf8; --c-alg:#00308f; --cs-alg:#e8edf8;
  --c-geo:#00308f;  --cs-geo:#e8edf8;  --c-data:#00308f; --cs-data:#e8edf8;
}
:root.hc .card,:root.hc .opt,:root.hc .btn,:root.hc .chip,:root.hc .tile{border:2px solid #000}
:root.hc .deco{display:none}

*{box-sizing:border-box;margin:0}
html{font-size:100%}
html.ts2{font-size:112%}
html.ts3{font-size:126%}
/* פונט ברור לקריאה: Tahoma ו-Verdana קיימים כמעט בכל מכשיר וכוללים עברית */
html.clearfont{--font:Tahoma,Verdana,Arial,sans-serif}
/* ריווח מוגדל — עוזר למי שקשה לו לעקוב אחרי השורה */
html.spaced body{letter-spacing:.03em;word-spacing:.16em;line-height:1.95}
html.rm *,html.rm *::before,html.rm *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.65;
  -webkit-text-size-adjust:100%;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:inherit}
input,select,textarea{font:inherit;color:var(--ink)}
a{color:var(--accent)}
::selection{background:var(--accent);color:var(--accent-ink)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---------- שלד ---------- */
#app{min-height:100vh;display:flex;flex-direction:column}
/* בלי זה כרום מותח כל מסך לרוחב המינימלי של התוכן שלו והעמוד גולש בטלפון */
#app>*{min-width:0;width:100%}
.wrap{max-width:1120px;margin:0 auto;padding:0 clamp(12px,4vw,22px)}
.deco{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.85;
  background:
    radial-gradient(760px 380px at 92% -6%,var(--cs-alg),transparent 62%),
    radial-gradient(620px 340px at 2% 18%,var(--cs-data),transparent 58%),
    radial-gradient(700px 380px at 10% 102%,var(--cs-base),transparent 60%),
    radial-gradient(520px 300px at 96% 78%,var(--cs-geo),transparent 58%)}
#app{position:relative;z-index:1}

/* ---------- כותרת עליונה ---------- */
header{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:10px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand .mk{width:38px;height:38px;border-radius:11px;
  background:linear-gradient(140deg,var(--c-alg),var(--c-data) 55%,var(--c-geo));color:#fff;
  display:grid;place-items:center;font-weight:800;font-size:1.05rem;flex-shrink:0}
:root.hc .brand .mk{background:var(--ink)}
.brand b{display:block;font-size:1rem;line-height:1.15;font-weight:800}
.brand small{display:block;color:var(--muted);font-size:.72rem;font-weight:500}
nav{display:flex;gap:4px;margin-inline-start:auto;flex-wrap:wrap}
.nb{display:inline-flex;align-items:center;gap:6px;border-radius:10px;padding:8px 12px;
  font-size:.9rem;font-weight:600;color:var(--muted);border:1px solid transparent;transition:.15s}
.nb:hover{background:var(--surface2);color:var(--ink)}
.nb.on{background:var(--accent);color:var(--accent-ink)}
:root.hc .nb.on{background:var(--ink);color:var(--bg)}
.nb svg{flex-shrink:0}
@media(max-width:560px){.nb span{display:none}.nb{padding:9px 11px}}

/* ---------- רכיבי בסיס ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:clamp(14px,3.4vw,22px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:11px;
  font-weight:700;padding:12px 18px;transition:.15s;border:1px solid transparent;line-height:1.3}
.btn-p{background:linear-gradient(135deg,var(--accent),var(--c-data));color:#fff}
.btn-p:hover{filter:brightness(1.1)}
:root.hc .btn-p{background:var(--accent)}
.btn-d{background:var(--ink);color:var(--bg)}
.btn-g{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-g:hover{background:var(--surface2)}
.btn[disabled]{opacity:.42;cursor:not-allowed}
.btn.w{width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;
  font-size:.82rem;font-weight:600;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.chip.a{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.h1{font-size:clamp(1.5rem,5.2vw,2.05rem);font-weight:800;line-height:1.2;overflow-wrap:anywhere}
.h2{font-size:clamp(1.1rem,3.6vw,1.3rem);font-weight:700;overflow-wrap:anywhere}
.sub{color:var(--muted);margin-top:5px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.sm{font-size:.85rem}
.xs{font-size:.76rem}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
/* רשימת הקולות: שתי עמודות רק כשבאמת יש מקום, אחרת השמות נקטעים */
.vgrid{grid-template-columns:repeat(auto-fit,minmax(min(100%,215px),1fr));gap:8px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
hr.sep{border:none;border-top:1px solid var(--line);margin:16px 0}

/* ---------- מתמטיקה: תמיד משמאל לימין, מבודד מהעברית ---------- */
.m{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums}
.mline{direction:ltr;unicode-bidi:isolate;text-align:center;font-weight:700;
  font-size:clamp(1.55rem,7vw,2.5rem);letter-spacing:.01em;line-height:1.35;overflow-wrap:anywhere}
.mstep{direction:ltr;unicode-bidi:isolate;text-align:center;font-weight:700;
  font-size:clamp(1.05rem,4.6vw,1.35rem);background:var(--surface2);border-radius:10px;
  padding:9px 12px;margin-top:8px;overflow-wrap:anywhere}
sup{font-size:.62em;vertical-align:super;line-height:0}
sub{font-size:.62em;vertical-align:sub;line-height:0}
/* ---------- מטריצה ווקטור ---------- */
.mtx{display:inline-flex;align-items:stretch;gap:7px;vertical-align:middle;
  padding:3px 10px;margin:0 .2em;position:relative;direction:ltr}
.mtx::before,.mtx::after{content:"";position:absolute;top:0;bottom:0;width:7px;
  border-top:2px solid currentColor;border-bottom:2px solid currentColor}
.mtx::before{inset-inline-start:0;border-inline-start:2px solid currentColor}
.mtx::after{inset-inline-end:0;border-inline-end:2px solid currentColor}
.mtx .mcol{display:flex;flex-direction:column;gap:3px;text-align:center;min-width:1.5em}
.mtx .mcol>span{padding:1px 4px;font-variant-numeric:tabular-nums}
.vec{display:inline-flex;gap:9px;padding:2px 11px;margin:0 .16em;direction:ltr;
  border-inline-start:2px solid currentColor;border-inline-end:2px solid currentColor;border-radius:9px}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;
  line-height:1.05;margin:0 .18em;font-size:.86em}
.frac>span:first-child{border-bottom:.09em solid currentColor;padding:0 .22em}
.frac>span:last-child{padding:0 .22em}

/* ---------- תשובות ---------- */
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
@media(max-width:430px){.opts{grid-template-columns:minmax(0,1fr)}}
.opt{position:relative;border:2px solid var(--line);background:var(--surface);border-radius:12px;
  padding:15px 14px 15px 44px;font-weight:700;font-size:clamp(1rem,4vw,1.2rem);transition:.14s;min-height:58px;
  display:flex;align-items:center;gap:10px}
[dir="rtl"] .opt{padding:15px 44px 15px 14px}
.opt:hover:not([disabled]){border-color:var(--c,var(--accent));background:var(--cs,var(--accent-soft))}
.opt .k{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);
  width:24px;height:24px;border-radius:7px;background:var(--cs,var(--surface2));color:var(--c,var(--faint));
  display:grid;place-items:center;font-size:.76rem;font-weight:700}
/* currentColor כאן היה נפתר לצבע שנקבע באותה הצהרה עצמה,
   ולכן הרקע והטקסט יצאו זהים והספרה נעלמה. */
.opt.right .k{background:var(--ok);color:var(--surface)}
.opt.wrong .k{background:var(--bad);color:var(--surface)}
.opt.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
/* בחירה במבחן היא בחירה, לא תשובה נכונה. במסכי התרגול הצבע
   הירוק אומר "צדקת", ובמבחן אסור לו להופיע כלל — הוא נותן
   משוב שגוי לכל בחירה. ניטרלי, ורק מסמן מה סומן. */
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.opt.dim{opacity:.4}
.opt.gone{opacity:.35;text-decoration:line-through}

/* ---------- פתרון מודרך ---------- */
.steps{margin-top:16px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.step{padding:13px 15px;border-top:1px solid var(--line);background:var(--surface)}
.step:first-child{border-top:none}
.step.future{display:none}
.step .st{display:flex;align-items:center;gap:9px;font-weight:700;font-size:.95rem}
.step .num{width:23px;height:23px;border-radius:50%;background:var(--c,var(--accent));color:var(--accent-ink);
  display:grid;place-items:center;font-size:.76rem;flex-shrink:0;font-weight:700}
.step .sd{color:var(--muted);font-size:.92rem;margin-top:4px;overflow-wrap:anywhere}
.step.last{background:var(--ok-soft)}
.step.last .num{background:var(--ok);color:var(--surface)}

/* ---------- פירוט טעות ---------- */
.diag{margin-top:14px;border-inline-start:4px solid var(--bad);background:var(--bad-soft);
  border-radius:0 10px 10px 0;padding:12px 15px}
[dir="rtl"] .diag{border-radius:10px 0 0 10px}
.diag b{color:var(--bad)}
.hintbox{margin-top:14px;border-inline-start:4px solid var(--warn);background:var(--warn-soft);
  border-radius:0 10px 10px 0;padding:12px 15px}
.wd{border-radius:5px;padding:1px 3px}
.wd.hit{background:var(--hit);color:var(--hit-ink);font-weight:600}
/* כשמנוע הדיבור אינו מדווח על גבולות מילים — קורה הרבה בעברית
   באנדרואיד — אין מה להדגיש מילה־מילה, ואז מודגש כל האיבר. הכלל
   הזה חסר, ולכן ההדגשה החלופית לא נראתה כלל: מי שהמנוע שלו שקט
   קיבל טקסט בלי שום סימון והמשיך לחפש את המקום בעיניים. */
.now{background:var(--hit);color:var(--hit-ink);border-radius:8px;
  box-shadow:0 0 0 4px var(--hit)}
[dir="rtl"] .hintbox{border-radius:10px 0 0 10px}

/* ---------- מדדים ---------- */
.bar{height:7px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s,background .3s}
.bar.ok>i{background:var(--ok)}
.bar.mid>i{background:var(--warn)}
.bar.low>i{background:var(--bad)}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--surface2);border:1px solid var(--line)}
.dot.ok{background:var(--ok);border-color:var(--ok)}
.dot.no{background:var(--bad);border-color:var(--bad)}
.dot.flag{box-shadow:0 0 0 2px var(--accent)}
.dot.hp{background:var(--warn);border-color:var(--warn)}
.tile{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--c,var(--accent));
  border-radius:12px;padding:14px;box-shadow:var(--shadow)}
.tile b{display:block;font-size:1.7rem;font-weight:800;line-height:1.2;color:var(--c,var(--ink))}
.tile span{color:var(--muted);font-size:.82rem}

/* ---------- כרטיס נושא ---------- */
.tpc{position:relative;display:flex;flex-direction:column;gap:9px;text-align:start;background:var(--surface);
  border:1px solid var(--line);border-inline-start:4px solid var(--c,var(--accent));
  border-radius:12px;padding:14px;transition:.15s;box-shadow:var(--shadow);min-width:0}
.tpc:hover{border-color:var(--c,var(--accent));transform:translateY(-2px);box-shadow:0 8px 22px -12px var(--c)}
.tpc:hover{border-inline-start-color:var(--c,var(--accent))}
.tpc.on{border-color:var(--c,var(--accent));background:var(--cs,var(--accent-soft))}
.tpc .tn{color:var(--c,var(--ink))}
.tpc .tn{font-weight:700;font-size:.98rem;overflow-wrap:anywhere}
.tpc .td{color:var(--muted);font-size:.8rem;overflow-wrap:anywhere}
.tpc .tm{display:flex;align-items:center;gap:7px;font-size:.74rem;color:var(--faint)}
.tpc .tm .bar{flex:1;min-width:0}

/* ---------- מתגים והגדרות ---------- */
.tog{display:flex;align-items:center;gap:13px;width:100%;text-align:start;background:var(--surface2);
  border:1px solid transparent;border-radius:12px;padding:13px 15px;transition:.15s;min-width:0}
.tog:hover{border-color:var(--line)}
.tog+.tog{margin-top:9px}
.tog .tt{flex:1;min-width:0}
.tog .tt b{display:block;font-size:.97rem;overflow-wrap:anywhere}
.tog .tt span{display:block;color:var(--muted);font-size:.82rem;overflow-wrap:anywhere}

    '<div id="demo-prog"><i></i></div></div>';

/* ESC יוצא. הקשבה בשלב הלכידה, כדי שמסך שכבר מטפל ב-Escape
   לא יבלע את המקש לפני שההדגמה ראתה אותו. */
function demoKey(e){
  if(!DEMO.on)return;
  if(e.key==="Escape"||e.keyCode===27){
    e.preventDefault(); e.stopPropagation();
    demoStop();
  }
}

function demoStart(){
  if(DEMO.on)return;
  DEMO.on=true; DEMO.i=0;
  DEMO.btn.hidden=true; DEMO.bar.hidden=false;
  document.documentElement.classList.add("demo-running");
  demoNext();
}

function demoNext(){
  if(!DEMO.on)return;
  if(DEMO.i>=DEMO_SCRIPT.length){demoStop();return}
  var it=DEMO_SCRIPT[DEMO.i++]||{};
  var d=Math.max(600,it.duration||3000);
  DEMO.txt.textContent=it.subtitle||"";
  DEMO.step.textContent=DEMO.i+" / "+DEMO_SCRIPT.length;
  DEMO.fill.style.transition="none"; DEMO.fill.style.width="0";
  void DEMO.fill.offsetWidth;
  DEMO.fill.style.transition="width "+d+"ms linear";
  DEMO.fill.style.width="100%";
  if(typeof it.action==="function"){
    try{it.action()}catch(err){if(window.console)console.warn("demo:",err)}
  }
  DEMO.timer=setTimeout(demoNext,d);
}

function demoStop(){
  DEMO.on=false;
  if(DEMO.timer){clearTimeout(DEMO.timer);DEMO.timer=null}
  DEMO.extra.forEach(function(t){clearTimeout(t);clearInterval(t)});
  DEMO.extra=[];
  var m=document.querySelectorAll(".demo-tap"),i;
  for(i=0;i<m.length;i++)m[i].classList.remove("demo-tap");
  if(DEMO.bar)DEMO.bar.hidden=true;
  if(DEMO.btn)DEMO.btn.hidden=false;
  document.documentElement.classList.remove("demo-running");
  demoQuiet();
}

function mat(rows){

/* פולינום ממערך מקדמים מהחזקה הגבוהה לנמוכה: poly([2,0,-5,1]) */
function poly(cs,v){
  v=v||"x";

var LANGS={

var LG="he";
var TR={};
function _(h){
  if(LG==="he")return h;

}
/* תבנית עם ערכים מוצבים. סדר החלקים אינו זהה בכל שפה, ולכן משפט
   שמשולב בו מספר נשמר כתבנית שלמה ולא כשני חלקים מודבקים. */
function _f(h){
  var t=_(h),i,args=arguments;
  for(i=1;i<args.length;i++)t=t.split("{"+(i-1)+"}").join(String(args[i]));
  return t;
}
/* אנגלית אינה סימן. טלפון בישראל מדווח אנגלית כברירת מחדל של
   המכשיר, לא כבחירה, והאפליקציה נפתחה באנגלית למי שבא ללמוד
   בעברית. ערבית ורוסית כן נחשבות — שם זו שפת אם של ממש. מי
   שרוצה אנגלית בוחר אותה, והבחירה נשמרת. */
function guessLang(){
  var ls=(navigator.languages||[navigator.language||"he"]);
  for(var i=0;i<ls.length;i++){
    var c=String(ls[i]).toLowerCase().split("-")[0];
    if(c==="iw")c="he";
    if(c==="en")continue;
    if(LANGS[c])return c;
  }
  return "he";
}

/* ------------------------------------------------------------
   פיצול לאמירות קצרות — הועתק מ"תאוריה מדברת", שם ההקראה נשמעת
   הכי טוב. מנועי מכשיר מאיצים ובולעים סופי מילים במשפט ארוך;
   כאן נשלחה שאלה שלמה באמירה אחת, לפעמים 300 תווים.
   כל מקטע נושא את ההיסט שלו במחרוזת המלאה, כי charIndex מתאפס
   בכל אמירה ובלעדיו ההדגשה קופצת לתחילת המשפט בכל מקטע.
   ------------------------------------------------------------ */
var SEG_MAX=90, SEG_GAP=260;
/* סימן פיסוק בין שתי ספרות הוא חלק מהמספר ולא מקום לחתוך בו:
   בלי הבדיקה הזאת "3,500" נשבר והמנוע קורא "שלוש, חמש מאות". */
function insideNumber(str,i){
  return i>0&&i+1<str.length&&/[0-9]/.test(str[i-1])&&/[0-9]/.test(str[i+1]);
}
function segments(spoken){
  var out=[],parts=[],from=0,i,j;
  function push(t,start){ if(String(t).trim())out.push({text:t,start:start}) }
  for(i=0;i<spoken.length;i++){
    if(".!?:;".indexOf(spoken[i])<0)continue;
    if(insideNumber(spoken,i))continue;
    j=i+1; while(j<spoken.length&&/\s/.test(spoken[j]))j++;
    parts.push({text:spoken.slice(from,j),start:from});
    from=j; i=j-1;
  }
  if(from<spoken.length)parts.push({text:spoken.slice(from),start:from});
  for(var k=0;k<parts.length;k++){
    var p=parts[k];
    if(p.text.length<=SEG_MAX){ push(p.text,p.start); continue }
    var rest=p.text,base=p.start;
    while(rest.length>SEG_MAX){
      var cut=rest.lastIndexOf(",",SEG_MAX);
      while(cut>0&&insideNumber(rest,cut))cut=rest.lastIndexOf(",",cut-1);
      if(cut<SEG_MAX*0.4)cut=rest.lastIndexOf(" ",SEG_MAX);
      if(cut<=0)break;
      push(rest.slice(0,cut+1),base);
      base+=cut+1; rest=rest.slice(cut+1);
    }
    push(rest,base);
  }
  /* מקטע זעיר — "12." או ")" — עם הפסקה של רבע שנייה אחריו נשמע
     כמו גמגום. מאחדים אותו לזה שאחריו. */
  var merged=[];
  for(i=0;i<out.length;i++){
    if(merged.length&&out[i].text.trim().length<12&&
       merged[merged.length-1].text.length+out[i].text.length<=SEG_MAX*1.4){
      merged[merged.length-1].text+=out[i].text; continue;
    }
    if(out[i].text.trim().length<12&&i+1<out.length){
      out[i+1]={text:out[i].text+out[i+1].text,start:out[i].start}; continue;
    }
    merged.push(out[i]);
  }
  out=merged;
  return out.length?out:[{text:spoken,start:0}];
}
/* קצב לפי שפה — אותם ערכים שנבחרו בתאוריה מדברת אחרי האזנה */
var VOICE_TUNE={he:0.82,ar:0.85,en:0.90,ru:0.88};
function tuneRate(lang,rate){
  var t=VOICE_TUNE[String(lang||"he").split("-")[0].toLowerCase()]||0.88;
  var r=t*(rate||1);
  return Math.max(0.5,Math.min(1.6,Math.round(r*100)/100));
}

/* הודעה כשאין קול נשי בשפה — עם ההוראות למערכת ההפעלה שהמשתמש

     באנדרואיד של גוגל ההגדרה יושבת תחת "נגישות" ולא תחת "ניהול כללי" —

    : /Mac OS X|Macintosh/i.test(ua)

    : _("בווינדוס: הגדרות ← שעה ושפה ← דיבור ← ניהול קולות ← הוספת קולות.");
  return _("במכשיר הזה אין קול נשי בשפה הנוכחית, ולכן גובה הקול הורם. זה לא קול נשי אמיתי — כדי לקבל אחד צריך להתקין אותו.")+" "+how;

/* ------------------------------------------------------------

   כרום יורה onend על האמירה שבוטלה, המקטע הבא נרשם בכל זאת,
   וכעבור SEG_GAP ההקראה הישנה חוזרת מעל החדשה — שני קולות
   במקביל. מונה אחד פותר את זה: כל הקראה מקבלת מספר, stopSpeak
   מקדם אותו, ומקטע מדור ישן פשוט אינו מדבר.

var _sayGen=0;

     שיוצאת ארבע שניות אחרי המגע נזרקת בשקט באנדרואיד ובספארי.
     כשהרשימה כבר כאן, בוחרים קול ומדברים. כשהיא ריקה — מדברים
     בכל זאת, עם u.lang בלבד: קול ברירת מחדל בשפה הנכונה עדיף על
     שתיקה, ויש מכשירים שמחזירים רשימה ריקה לצמיתות ומדברים היטב.
     voicesReady נשאר בשימוש למסך בחירת הקול, שם ההמתנה במקומה. */

     כשרשימת הקולות התיישנה אחרי שהמערכת החליפה מנוע — עדיף להקריא
     בשפה הנכונה בקול ברירת המחדל מאשר לשתוק לגמרי. */

  (function sayseg(k){
    if(my!==_sayGen)return;   /* ההקראה הזאת בוטלה — המקטע הבא לא יוצא */

function speak(text){

     לבד, וניקוי חוזר אינו משנה דבר — אבל בלעדיו כל מחרוזת שנשארה
     עם <sub> או <span class="frac"> הוקראה בקול כתגית: הסטודנט
     שמע "span class frac" באמצע השאלה. */

      /* מפתח שנדחה לצמיתות אינו תקלה שחוזרת על עצמה — הוא הכרעה.

         שאלה. ההסבר נשאר במסך ההגדרות, שם הוא רלוונטי. */

    if(ty4!=="sup")WR4.push(W(T2,ty4==="max"?_("הסופרמום כאן דווקא מתקבל בקבוצה, ולכן הוא גם מקסימום."):_("אין סופרמום כלל, כי הקבוצה אינה חסומה מלמעלה.")));
    if(ty4!=="none")WR4.push(W(T3,_("A דווקא חסומה מלמעלה, ולכן שאלת הקיום נסגרת מיד.")));
    WR4.push(W(T4,_("זה בדיוק מה שאקסיומת השלמות שוללת: לכל קבוצה לא ריקה וחסומה מלמעלה יש סופרמום.")));
    return {ask:_("מה נכון עבור הקבוצה A?"),
      expr:e4,
      ans:W(A4),
      wrong:WR4.slice(0,3),
      steps:[
        S(_("קודם: האם A חסומה מלמעלה"),bnd4,""),
        S(_("אקסיומת השלמות"),_("לקבוצה לא ריקה וחסומה מלמעלה יש תמיד סופרמום, גם כשאין לה איבר גדול ביותר."),
          ty4==="none"?_("אינה חלה כאן"):"sup A = "+num(v4)),
        S(_("ורק אז: האם הוא מתקבל"),why4,A4)
      ],rule:"sup",hint:_("שתי שאלות נפרדות: קודם האם יש סופרמום, ורק אחר כך האם הוא איבר בקבוצה.")};
  }
  /* L3 — קודם הוגרלה רק הקבוצה a + 1/n, ולכן "0" ו"אין אינפימום"
     היו שני מסיחים שלעולם אינם התשובה. עכשיו מוגרלת גם הקבוצה
     1/n — שהאינפימום שלה הוא בדיוק 0 — וגם קבוצה שאינה חסומה
     מלמטה, ואז "אין אינפימום" הוא הנכון. */
  var sh3=pick(["shift","shift","zero","unb"]);
  if(sh3==="zero"){
    return {ask:_("מהו האינפימום של הקבוצה?"),
      expr:"A = { "+frac("1","n")+"   :   n ∈ ℕ }",
      ans:W("0"),
      wrong:[
        W(num(1),_("זה האיבר הגדול ביותר, שמתקבל ב-n = 1. הוא המקסימום ולא האינפימום.")),
        W(num(-1),_("כל איברי הקבוצה חיוביים, ולכן מספר שלילי אכן חסם אותם מלמטה — אבל האינפימום הוא הגדול שבחסמים, לא כל חסם.")),
        W(_("אין אינפימום"),_("הקבוצה חסומה מלמטה, ולכן האינפימום קיים — גם אם אינו מתקבל."))
      ],
      steps:[
        S(_("מה קורה כאשר n גדל"),_("1 חלקי n יורד והולך, ומתקרב לאפס מלמעלה."),
          frac("1","n")+" → 0"),
        S(_("האם הוא מתקבל"),_("אין n שעבורו 1 חלקי n שווה אפס, ולכן האיבר עצמו אינו בקבוצה."),""),
        S(_("מסקנה"),_("זו בדיוק הסיבה שמדברים על אינפימום ולא על מינימום."),"inf A = 0")
      ],rule:"sup",hint:_("אינפימום הוא הגדול שבחסמים מלמטה. הוא לא חייב להיות איבר בקבוצה.")};
  }
  if(sh3==="unb"){
    a=pick([-4,-3,-2,-1,1,2,3,4]);
    return {ask:_("מהו האינפימום של הקבוצה?"),
      expr:"A = { "+num(a)+" − n   :   n ∈ ℕ }",
      ans:W(_("אין אינפימום")),
      wrong:[
        W(num(a-1),_("זה האיבר הגדול ביותר, שמתקבל ב-n = 1 — כלומר המקסימום, ולא חסם מלמטה.")),
        W("0",_("אפס אינו חסם מלמטה כאן: האיברים יורדים מתחת לכל מספר.")),
        W(num(a),_("זה הקבוע שבביטוי, אבל ממנו מחסרים n שגדל בלי גבול."))
      ],
      steps:[
        S(_("מה קורה כאשר n גדל"),_("n גדל בלי גבול, ולכן האיברים יורדים בלי גבול."),
          num(a)+" − n → −∞"),
        S(_("האם יש חסם מלמטה"),_("לכל מספר M שנבחר יש n גדול מספיק שהאיבר קטן ממנו, ולכן M אינו חסם."),""),
        S(_("מסקנה"),_("אקסיומת השלמות מבטיחה אינפימום לקבוצה חסומה מלמטה בלבד, וכאן אין חסימות."),_("אין אינפימום"))
      ],rule:"sup",hint:_("אינפימום הוא הגדול שבחסמים מלמטה. קודם בודקים שיש חסם בכלל.")};
  }
  /* קבוצה אינסופית: a + 1/n */
  a=pick([-4,-3,-2,1,2,3,4]);   /* 0 ו-−1 היו מזהים מסיח עם התשובה */
  return {ask:_("מהו האינפימום של הקבוצה?"),
    expr:"A = { "+num(a)+" + "+frac("1","n")+"   :   n ∈ ℕ }",
    ans:W(num(a)),
    wrong:[
      W(num(a+1),_("זה האיבר הגדול ביותר, שמתקבל ב-n = 1. הוא המקסימום ולא האינפימום.")),
      W("0",_("אפס אינו קשור כאן. הקבוצה כולה נמצאת סביב הקבוע שבביטוי.")),
      W(_("אין אינפימום"),_("הקבוצה חסומה מלמטה, ולכן האינפימום קיים — גם אם אינו מתקבל."))
    ],
    steps:[
      S(_("מה קורה כאשר n גדל"),_("החלק 1 חלקי n שואף לאפס, והאיברים יורדים אל הקבוע."),
        num(a)+" + "+frac("1","n")+" → "+num(a)),
      S(_("האם הוא מתקבל"),_("אין n שעבורו 1 חלקי n שווה אפס, ולכן האיבר עצמו אינו בקבוצה."),""),
      S(_("מסקנה"),_("זו בדיוק הסיבה שמדברים על אינפימום ולא על מינימום."),"inf A = "+num(a))
    ],rule:"sup",hint:_("אינפימום הוא הגדול שבחסמים מלמטה. הוא לא חייב להיות איבר בקבוצה.")};
}

/* ---------- 2. סדרות פונקציות והתכנסות במידה שווה ---------- */
function genPwUnif(L){
  var a,k;
  if(L===1){
    /* קודם עמדה כאן סדרה אחת, x חלקי n, ולכן הגבול היה f(x) = 0 בכל
       הגרלה, והמקרים שבהם הגבול אינו האפס לא הופיעו מעולם. */
    a=ri(2,6);
    var cs1=pick(["over","plus","const"]),c1=ri(2,5),ex1,lim1;
    if(cs1==="over"){ex1=frac("x","n");lim1="f(x) = 0"}
    else if(cs1==="plus"){ex1="x + "+frac("1","n");lim1="f(x) = x"}
    else{ex1=frac("x + "+num(c1)+"n","n");lim1="f(x) = "+num(c1)}
    return {ask:_("לאיזו פונקציה מתכנסת סדרת הפונקציות נקודתית?"),
      expr:"f<sub>n</sub>(x) = "+ex1+"   ,   x ∈ [0 , "+num(a)+"]",
      ans:W(lim1),
      wrong:(cs1==="over"?[
        W("f(x) = x",_("x נשאר קבוע, אבל המכנה גדל בלי גבול. המנה שואפת לאפס.")),
        W("f(x) = "+num(a),_("קצה הקטע אינו הגבול. מציבים x קבוע ומגדילים את n."))
      ]:cs1==="plus"?[
        W("f(x) = 0",_("רק התוספת 1 חלקי n נעלמת בגבול. האיבר x אינו תלוי ב-n ונשאר כמות שהוא.")),
        W("f(x) = x + 1",_("1 חלקי n שואף לאפס, לא ל-1."))
      ]:[
        W("f(x) = 0",_("רק האיבר x חלקי n נעלם. האיבר השני אינו תלוי ב-n כלל.")),
        W("f(x) = x + "+num(c1),_("x חלקי n שואף לאפס, ולכן x אינו נשאר בגבול."))
      ]).concat([W(_("אינה מתכנסת"),_("לכל x קבוע זו סדרה מספרית פשוטה שיש לה גבול."))]),
      steps:[
        S(_("מקבעים x"),_("התכנסות נקודתית נבדקת עבור כל x בנפרד, כאילו הוא מספר."),"x = const"),
        S(_("לוקחים גבול ב-n"),"","lim<sub>n→∞</sub> "+ex1+" = "+lim1.replace("f(x) = ","")),
        S(_("הפונקציה הגבולית"),_("מה שתלוי ב-n נעלם, ומה שאינו תלוי בו נשאר."),lim1)
      ],rule:"pw",hint:_("בהתכנסות נקודתית מקבעים x ומגדילים רק את n.")};
  }
  if(L===2){
    /* קודם עמדה כאן סדרה אחת, xⁿ על [0,1), ולכן התשובה הייתה "לא" בכל
       הגרלה — והצד השני של ההגדרה, סדרה שכן מתכנסת במידה שווה, לא
       הודגם אף פעם. עכשיו מוגרלים ארבעה מקרים, שניים לכל כיוון. */
    /* קודם היו כאן שני מצבים בלבד, ולכן "אי אפשר לקבוע" לא היה התשובה
       אף פעם. המצב החמישי משאיר את קצה הקטע כפרמטר c: ל-c קטן מ-1
       ההתכנסות במידה שווה, ול-c = 1 היא אינה — ובלי c אין הכרעה. */
    a=ri(2,6);
    var cs2=pick(["over","pow","sin","peak","param"]),ex2,uni,sup2,why2,st2;
    if(cs2==="over"){
      ex2="f<sub>n</sub>(x) = "+frac("x","n")+"   ,   x ∈ [0 , "+num(a)+"]";
      uni=true;sup2=frac(num(a),"n");
      why2=_f("סופרמום ההפרש הוא {0} חלקי n, והוא שואף לאפס — ולכן ההתכנסות אכן במידה שווה.", num(a));
      st2=_("הסופרמום מתקבל בקצה הימני של הקטע, והוא שואף לאפס.");
    }else if(cs2==="pow"){
      ex2="f<sub>n</sub>(x) = x<sup>n</sup>   ,   x ∈ [0 , 1)";
      uni=false;sup2="1";
      why2=_("הגבול הנקודתי הוא אפס, אבל הסופרמום של ההפרש נשאר 1 לכל n. זה בדיוק ההבדל.");
      st2=_("הסופרמום אינו שואף לאפס — הוא שווה 1 לכל n.");
    }else if(cs2==="sin"){
      ex2="f<sub>n</sub>(x) = "+frac("sin(nx)","n")+"   ,   x ∈ ℝ";
      uni=true;sup2=frac("1","n");
      why2=_("הסינוס חסום ב-1, ולכן הסופרמום הוא 1 חלקי n בלי תלות ב-x — והוא שואף לאפס.");
      st2=_("החסם אינו תלוי ב-x כלל, ולכן אותו n מספיק לכל הנקודות יחד.");
    }else if(cs2==="peak"){
      ex2="f<sub>n</sub>(x) = n·x·e<sup>−nx</sup>   ,   x ∈ [0 , 1]";
      uni=false;sup2=frac("1","e");
      why2=_("הגבול הנקודתי הוא אפס, אבל בנקודה x = 1 חלקי n הפונקציה שווה 1 חלקי e לכל n.");
      st2=_("הפסגה נודדת שמאלה אבל אינה מתנמכת, ולכן הסופרמום קבוע.");
    }else{
      ex2="f<sub>n</sub>(x) = x<sup>n</sup>   ,   x ∈ [0 , c]   ,   0 < c ≤ 1   ,   c "+_("אינו נתון");
      uni=false;sup2="c<sup>n</sup>";
      why2=_("ל-c קטן מ-1 הסופרמום הוא c בחזקת n והוא שואף לאפס, ולכן ההתכנסות במידה שווה. ל-c = 1 הסופרמום נשאר 1 לכל n. בלי לדעת את c אי אפשר להכריע.");
      st2=why2;
    }
    var uniU=[_("כן"),_("לא"),_("אי אפשר לקבוע")];
    var ansU=(cs2==="param")?uniU[2]:(uni?uniU[0]:uniU[1]);
    return {ask:_("האם ההתכנסות במידה שווה על הקטע?"),
      expr:ex2,
      ans:W(ansU),
      wrong:uniU.filter(function(v){return v!==ansU}).map(function(v){
          return W(v, (cs2==="param")?why2
            :(v===uniU[2]?_("יש כאן מבחן מלא: מחשבים סופרמום של ההפרש ובודקים אם הוא שואף לאפס."):why2))})
        .concat([W(_("רק על קטע סגור"),_("סגירות הקטע אינה הקריטריון. מה שקובע הוא אם סופרמום ההפרש שואף לאפס."))]),
      steps:[
        S(_("הגבול הנקודתי"),_("מקבעים x ומגדילים את n."),"f(x) = 0"),
        S(_("מודדים את ההפרש"),_("במידה שווה בודקים את הסופרמום של ההפרש על כל הקטע, ולא נקודה נקודה."),
          "sup |f<sub>n</sub> − 0| = "+sup2),
        S(_("מסקנה"),st2,ansU)
      ],rule:"unif",hint:_("במידה שווה נמדד סופרמום ההפרש על כל הקטע, והוא חייב לשאוף לאפס.")};
  }
  /* רמה 4 — לא "האם" אלא "למה". אותה סדרה מתכנסת במידה שווה על
     תת־קטע ולא על הקטע כולו, והשאלה היא מה הנימוק הנכון. */
  if(L>=4){
    var u4=pick(["pow","peak","atan"]),c4,ex4,I4,J4,ansW,swW,sI,sJ,lim4;
    if(u4==="pow"){
      c4=pick(["0.5","0.6","0.75","0.8"]);
      ex4="f<sub>n</sub>(x) = x<sup>n</sup>";I4="[0 , 1)";J4="[0 , "+c4+"]";lim4="f(x) = 0";
      sI="sup = 1";sJ="sup = "+c4+"<sup>n</sup> → 0";
      ansW=_f("על I סופרמום ההפרש שווה 1 לכל n, ואילו על J הוא {0} בחזקת n ולכן שואף לאפס.", c4);
      swW=_f("על J סופרמום ההפרש שווה 1 לכל n, ואילו על I הוא {0} בחזקת n ולכן שואף לאפס.", c4);
    }else if(u4==="peak"){
      c4=pick(["0.1","0.2","0.25","0.5"]);
      ex4="f<sub>n</sub>(x) = n x e<sup>−nx</sup>";I4="[0 , 1]";J4="["+c4+" , 1]";lim4="f(x) = 0";
      sI="sup = "+frac("1","e");sJ="sup = n·"+c4+"·e<sup>−n·"+c4+"</sup> → 0";
      ansW=_f("הפסגה יושבת ב-x = 1 חלקי n. היא נשארת בתוך I לכל n, אבל יוצאת מ-J ברגע ש-1 חלקי n קטן מ-{0}.", c4);
      swW=_f("הפסגה יושבת ב-x = 1 חלקי n. היא נשארת בתוך J לכל n, אבל יוצאת מ-I ברגע ש-1 חלקי n קטן מ-{0}.", c4);
    }else{
      c4=pick(["0.1","0.2","0.25","0.5"]);
      ex4="f<sub>n</sub>(x) = arctan(nx)";I4="(0 , 1]";J4="["+c4+" , 1]";lim4="f(x) = π/2";
      sI="sup = π/2";sJ="sup = π/2 − arctan(n·"+c4+") → 0";
      ansW=_("הנקודה שבה ההתכנסות איטית היא x = 0. היא שפת I ואינה שייכת ל-J, ולכן על J הסופרמום שואף לאפס.");
      swW=_("הנקודה שבה ההתכנסות איטית היא x = 0. היא שפת J ואינה שייכת ל-I, ולכן על I הסופרמום שואף לאפס.");
    }
    return {ask:_f("ההתכנסות אינה במידה שווה על I = {0}, אבל כן על J = {1}. מה הנימוק?", I4, J4),
      expr:ex4,
      ans:W(ansW),
      /* שלושת מסיחי הכלל־הכללי הופיעו קודם בכל הגרלה בלי להיות
         נכונים אף פעם, ולכן התשובה הייתה מזוהה לפי הצורה בלבד:
         היא היחידה שדיברה על סופרמום ההפרש. עכשיו הצטרפו לבריכה
         שני מסיחים שנראים בדיוק כמו התשובה — אחד מהפך את התפקידים
         של I ו-J, והשני טוען שהסופרמום שואף לאפס על שניהם — ומכל
         חמשת המסיחים מוגרלים שלושה. */
      wrong:shuffle([
        W(_("כי J סגור ו-I אינו — סגירות הקטע היא שמבטיחה התכנסות במידה שווה."),
          _("סגירות אינה מספיקה. על הקטע הסגור [0 , 1] הסדרה n·x·e בחזקת מינוס nx מתכנסת נקודתית ולא במידה שווה.")),
        W(_("כי הפונקציה הגבולית רציפה על J ואינה רציפה על I."),
          _("הפונקציה הגבולית כאן רציפה על שני הקטעים. אי־רציפות של הגבול אכן שוללת התכנסות במידה שווה, אבל אין כאן אי־רציפות.")),
        W(_("כי J קצר מ-I, וקטע קצר יותר תמיד נותן התכנסות במידה שווה."),
          _("אורך הקטע אינו הקריטריון. סופרמום ההפרש הוא שקובע, והוא יכול להישאר גדול גם על קטע קצר מאוד.")),
        W(swW,_("התפקידים הפוכים. הקטע שעליו הסופרמום נשאר גדול הוא I, והקטע שעליו הוא שואף לאפס הוא J.")),
        W(_("כי סופרמום ההפרש שואף לאפס על שני הקטעים, אלא שעל I הוא עושה זאת לאט יותר."),
          _("על I הסופרמום אינו שואף לאפס כלל — הוא נשאר קבוע. מהירות אינה הקריטריון: או שהסופרמום שואף לאפס או שלא."))
      ]).slice(0,3),
      steps:[
        S(_("הגבול הנקודתי"),_("מקבעים x ומגדילים רק את n. הוא זהה על שני הקטעים."),lim4),
        S(_("סופרמום ההפרש על I"),_("מודדים על כל I יחד."),sI),
        S(_("סופרמום ההפרש על J"),_("אותו חישוב, על תת־הקטע."),sJ),
        S(_("מסקנה"),ansW,J4)
      ],rule:"unif",hint:_("מחשבים את סופרמום ההפרש על כל אחד מהקטעים בנפרד, ובודקים איזה מהם שואף לאפס.")};
  }
  /* L3 — חישוב נורמת הסופרמום */
  var utry=0;
  do{ a=ri(2,6);k=ri(2,8); }
  while(utry++<60&&(k===a||new Set([fr(a,k).txt(),fr(k,a).txt(),"0",String(a)]).size<4));
  return {ask:_f("f<sub>n</sub>(x) = x חלקי n על [0 , {0}]. מהו sup|f<sub>n</sub> − f| עבור n = {1}?", num(a), num(k)),
    expr:"sup<sub>x ∈ [0 , "+num(a)+"]</sub> | "+frac("x",num(k))+" − 0 |",
    ans:W(fr(a,k).html()),
    wrong:[
      W(fr(k,a).html(),_("הפכתם את השבר. מחלקים באינדקס, לא להפך.")),
      W("0",_("זהו הגבול כאשר n שואף לאינסוף, ולא הערך עבור n מסוים.")),
      W(num(a),_("שכחתם לחלק ב-n. זה סופרמום של x עצמו."))
    ],
    steps:[
      S(_("הפונקציה הגבולית"),"","f(x) = 0"),
      S(_("איפה ההפרש מרבי"),_("הביטוי עולה עם x, ולכן המקסימום בקצה הימני של הקטע."),"x = "+num(a)),
      S(_("מציבים"),_("זהו המרחק בין הפונקציה ה-n־ית לגבול, במידה שווה."),frac(num(a),num(k))+" = "+fr(a,k).html())
    ],rule:"unif",hint:_("מחפשים את הנקודה שבה ההפרש מרבי, ומציבים אותה.")};
}

/* ---------- 3. טורי חזקות ורדיוס התכנסות ---------- */
function genPowerS(L){
  var a;
  if(L===1){
    a=ri(2,6);
    return {ask:_("מהו רדיוס ההתכנסות של טור החזקות?"),
      expr:"Σ<sub>n=0</sub><sup>∞</sup> "+frac("x<sup>n</sup>",num(a)+"<sup>n</sup>"),
      ans:W("R = "+num(a)),
      wrong:[
        W("R = "+fr(1,a).html(),_("הפכתם. כשהמכנה הוא a בחזקת n, הרדיוס הוא a עצמו.")),
        W("R = "+num(a*a),_("העליתם בריבוע. מבחן המנה נותן את a עצמו.")),
        W("R = 1",_("רדיוס 1 מתאים לטור Σxⁿ בלי מקדמים."))
      ],
      steps:[
        S(_("מבחן המנה"),_("מחשבים את גבול היחס בין איבר לקודמו, בערך מוחלט."),
          "| "+frac("x<sup>n+1</sup> · "+num(a)+"<sup>n</sup>",num(a)+"<sup>n+1</sup> · x<sup>n</sup>")+" | = "+frac("|x|",num(a))),
        S(_("דורשים קטן מ-1"),"",frac("|x|",num(a))+" < 1   ⇒   |x| < "+num(a)),
        S(_("הרדיוס"),_("הרדיוס הוא בדיוק הגבול שממנו והלאה הטור מתבדר."),"R = "+num(a))
      ],rule:"radius",hint:_("רדיוס ההתכנסות הוא הגבול שעד אליו מבחן המנה נותן פחות מ-1.")};
  }
  if(L===2){
    /* קודם הוגרל כאן רק Σ aⁿxⁿ, ולכן "R = 0" ו-"R = 1" היו שני מסיחים
       שלעולם אינם התשובה. עכשיו מוגרלים גם מכנה פולינומי (רדיוס 1),
       עצרת במונה (רדיוס 0) ועצרת במכנה (רדיוס אינסופי) — שלושת
       המקרים שהמסיחים האלה מתארים. */
    a=ri(2,6);
    var kd2=pick(["geo","geo","poly","fact","exp"]);
    var ex2,ans2,wr2,st2;
    if(kd2==="poly"){
      var kp=pick([2,3]);
      ex2="Σ<sub>n=1</sub><sup>∞</sup> "+frac("x<sup>n</sup>","n<sup>"+num(kp)+"</sup>");
      ans2="R = 1";
      wr2=[
        W("R = "+num(kp),_f("החזקה שבמכנה אינה משנה את הרדיוס: השורש ה-n־י של n בחזקת {0} שואף ל-1, ולכן הרדיוס נשאר 1.", num(kp))),
        W("R = 0",_("רדיוס אפס מתאים לטור כמו Σ n! xⁿ, שמתכנס רק באפס.")),
        W("R = ∞",_("רדיוס אינסופי מתאים למקדמים שקטנים מהר מאוד, כמו 1 חלקי n עצרת. מכנה פולינומי אינו מספיק."))
      ];
      st2=[
        S(_("מבחן המנה"),_("מחשבים את גבול היחס בין איבר לקודמו, בערך מוחלט."),
          "| "+frac("n<sup>"+num(kp)+"</sup>","(n+1)<sup>"+num(kp)+"</sup>")+" · x | → |x|"),
        S(_("דורשים קטן מ-1"),_("היחס בין החזקות שואף ל-1, ולכן נשאר |x| בלבד."),"|x| < 1"),
        S(_("הרדיוס"),_("מכנה פולינומי משפיע על הקצוות בלבד, לא על הרדיוס."),"R = 1")
      ];
    }else if(kd2==="fact"){
      ex2="Σ<sub>n=0</sub><sup>∞</sup> n! · "+num(a)+"<sup>n</sup> x<sup>n</sup>";
      ans2="R = 0";
      wr2=[
        W("R = "+fr(1,a).html(),_f("התעלמתם מהעצרת. בלעדיה הרדיוס היה 1 חלקי {0}, אבל n עצרת גדלה מהר מכל חזקה.", num(a))),
        W("R = 1",_("מקדם קבוע בחזקת n משנה את הרדיוס. רדיוס 1 מתאים למקדם 1.")),
        W("R = ∞",_("זה הרדיוס של Σ xⁿ חלקי n עצרת — שם העצרת יושבת במכנה, וכאן היא במונה."))
      ];
      st2=[
        S(_("מבחן המנה"),_("מחשבים את גבול היחס בין איבר לקודמו, בערך מוחלט."),
          "| (n+1) · "+num(a)+" · x | → ∞"),
        S(_("מתי קטן מ-1"),_("הביטוי גדל בלי גבול לכל x שאינו אפס, ולכן התנאי אינו מתקיים בשום מקום מלבד אפס."),"x = 0"),
        S(_("הרדיוס"),_("n עצרת גדלה מהר מכל חזקה, ולכן הטור מתכנס בנקודה אחת בלבד."),"R = 0")
      ];
    }else if(kd2==="exp"){
      ex2="Σ<sub>n=0</sub><sup>∞</sup> "+frac(num(a)+"<sup>n</sup> x<sup>n</sup>","n!");
      ans2="R = ∞";
      wr2=[
        W("R = "+fr(1,a).html(),_f("התעלמתם מהעצרת שבמכנה. בלעדיה הרדיוס היה 1 חלקי {0}, אבל 1 חלקי n עצרת קטן מהר מכל חזקה.", num(a))),
        W("R = 1",_("מקדם קבוע בחזקת n משנה את הרדיוס. רדיוס 1 מתאים למקדם 1.")),
        W("R = 0",_("רדיוס אפס מתאים לטור כמו Σ n! xⁿ, שמתכנס רק באפס."))
      ];
      st2=[
        S(_("מבחן המנה"),_("מחשבים את גבול היחס בין איבר לקודמו, בערך מוחלט."),
          "| "+frac(num(a)+"x","n+1")+" | → 0"),
        S(_("מתי קטן מ-1"),_("הגבול הוא אפס לכל x, ולכן התנאי מתקיים בכל הישר."),"0 < 1   "+_("לכל")+" x"),
        S(_("הרדיוס"),_("העצרת במכנה מנצחת כל חזקה, ולכן הטור מתכנס בכל מקום."),"R = ∞")
      ];
    }else{
      ex2="Σ<sub>n=0</sub><sup>∞</sup> "+num(a)+"<sup>n</sup> x<sup>n</sup>";
      ans2="R = "+fr(1,a).html();
      wr2=[
        W("R = "+num(a),_("כאן a יושב במונה, ולכן הרדיוס הוא ההופכי שלו.")),
        W("R = 1",_("מקדם קבוע בחזקת n משנה את הרדיוס. רדיוס 1 מתאים למקדם 1.")),
        W("R = 0",_("רדיוס אפס מתאים לטור כמו Σ n! xⁿ, שמתכנס רק באפס."))
      ];
      st2=[
        S(_("מבחן המנה"),"","| "+num(a)+"x | < 1"),
        S(_("מבודדים"),_("מחלקים בשני האגפים במקדם."),"|x| < "+frac("1",num(a))),
        S(_("הרדיוס"),_("מקדם גדול מכווץ את תחום ההתכנסות — וזה הגיוני."),"R = "+fr(1,a).html())
      ];
    }
    return {ask:_("מהו רדיוס ההתכנסות של טור החזקות?"),
      expr:ex2,
      ans:W(ans2),
      wrong:wr2,
      steps:st2,
      rule:"radius",hint:_("מקדם בחזקת n במונה מקטין את הרדיוס, ובמכנה מגדיל אותו. עצרת מקפיצה את הרדיוס לאפס או לאינסוף.")};
  }
  /* רמה 4 — הרדיוס לבדו אינו התשובה. אחריו צריך לבדוק כל קצה
     בנפרד, ובשני הקצוות מתקבלים טורים מספריים שונים לגמרי. */
  if(L>=4){
    var cc4=rnz(-4,4),aa4=ri(2,4),tp4=pick(["n","n2","none"]);
    var lo4=cc4-aa4,hi4=cc4+aa4,pw4="(x "+sgn(-cc4)+")<sup>n</sup>";
    var sX4=tp4==="n"?frac(pw4,"n · "+num(aa4)+"<sup>n</sup>")
           :tp4==="n2"?frac(pw4,"n<sup>2</sup> · "+num(aa4)+"<sup>n</sup>")
           :frac(pw4,num(aa4)+"<sup>n</sup>");
    var IC="[ "+num(lo4)+" , "+num(hi4)+" ]",IO="( "+num(lo4)+" , "+num(hi4)+" )",
        IH="[ "+num(lo4)+" , "+num(hi4)+" )",
        IZ=(tp4==="none"?"( ":"[ ")+num(-aa4)+" , "+num(aa4)+(tp4==="n"?" )":tp4==="n2"?" ]":" )");
    var A4=tp4==="n"?IH:tp4==="n2"?IC:IO;
    var wLeft=_f("בקצה השמאלי x = {0} מתקבל הטור המתחלף Σ(−1)ⁿ חלקי n, והוא מתכנס — ולכן הקצה כן נכלל.", num(lo4)),
        wRight=_f("בקצה הימני x = {0} מתקבל הטור ההרמוני Σ1 חלקי n, והוא מתבדר — ולכן הקצה אינו נכלל.", num(hi4)),
        wBoth2=_("בשני הקצוות מתקבל טור שמתכנס בהחלט, כי Σ1 חלקי n² מתכנס. שניהם נכללים."),
        wBoth0=_("בשני הקצוות האיבר הכללי אינו שואף לאפס, ולכן הטור מתבדר בשניהם."),
        wCent=_f("שכחתם את מרכז הפיתוח. הטור מפותח סביב x = {0}, ולכן הקטע נע איתו.", num(cc4));
    var WR4=tp4==="n"?[W(IO,wLeft),W(IC,wRight),W(IZ,wCent)]
           :tp4==="n2"?[W(IO,wBoth2),W(IH,wBoth2),W(IZ,wCent)]
           :[W(IC,wBoth0),W(IH,wBoth0),W(IZ,wCent)];
    return {ask:_("מהו תחום ההתכנסות המלא של הטור, כולל הקצוות?"),
      expr:"Σ<sub>n=1</sub><sup>∞</sup> "+sX4,
      ans:W(A4),
      wrong:WR4,
      steps:[
        S(_("רדיוס במבחן המנה"),_("גורם פולינומי אינו משנה את הרדיוס; רק המקדם המעריכי קובע."),"R = "+num(aa4)),
        S(_("הקטע לפני בדיקת הקצוות"),_f("הטור מפותח סביב x = {0}, ולכן הקטע נמדד ממנו לשני הכיוונים.", num(cc4)),IO),
        S(_("בודקים כל קצה בנפרד"),tp4==="n"?_("בקצה אחד מתקבל הטור ההרמוני שמתבדר, ובשני הטור המתחלף שמתכנס."):tp4==="n2"?_("בשני הקצוות מתקבל טור בהחלט מתכנס."):_("בשני הקצוות האיבר הכללי אינו שואף לאפס."),
          "x = "+num(lo4)+"   ,   x = "+num(hi4)),
        S(_("מסקנה"),_("הרדיוס אינו מכריע בקצוות. שם צריך מבחן אחר."),A4)
      ],rule:"radius",hint:_("הרדיוס אינו מספיק: מציבים כל אחד משני הקצוות ובודקים את הטור המספרי שמתקבל.")};
  }
  /* L3. קודם עמד כאן טור אחד, xⁿ חלקי n!, ולכן התשובה הייתה R = ∞ בכל
     500 ההגרלות. עכשיו מוגרל אחד משלושה טורים — עצרת במכנה, עצרת
     במונה, וגורם פולינומי — וזו בדיוק שאלת הרמה: אילו גורמים משנים
     את הרדיוס ואילו לא. */
  a=ri(2,5);
  var rc=pick(["fdown","fup","poly"]),k=pick([1,2]),rExpr,rAns;
  if(rc==="fdown"){rExpr=frac("x<sup>n</sup>","n!");rAns="R = ∞"}
  else if(rc==="fup"){rExpr="n! · x<sup>n</sup>";rAns="R = 0"}
  else{rExpr=frac((k===1?"n":"n<sup>2</sup>")+" · x<sup>n</sup>",num(a)+"<sup>n</sup>");rAns="R = "+num(a)}
  return {ask:_("מהו רדיוס ההתכנסות של טור החזקות?"),
    expr:"Σ<sub>n=1</sub><sup>∞</sup> "+rExpr,
    ans:W(rAns),
    wrong:[
      W("R = ∞",rc==="fdown"?"":rc==="fup"
        ?_("העצרת במונה גדלה מהר מכל חזקה, ולכן המנה שואפת לאינסוף והטור מתכנס רק ב-0.")
        :_f("גורם פולינומי אינו משנה את הרדיוס, אבל {0} בחזקת n כן — הוא קובע אותו.", num(a))),
      W("R = 0",rc==="fup"?"":rc==="fdown"
        ?_("רדיוס אפס היה מתקבל אילו העצרת הייתה במונה.")
        :_f("רדיוס אפס מתאים לטור עם עצרת במונה. כאן המקדם הוא {0} בחזקת n בלבד.", num(a))),
      W("R = "+num(a),rc==="poly"?"":_f("{0} אינו מופיע בטור הזה. הרדיוס נקבע מהגבול של יחס המקדמים.", num(a))),
      W("R = 1",rc==="fdown"
        ?_("העצרת גדלה מהר יותר מכל חזקה, ולכן אין כאן גבול סופי לרדיוס.")
        :rc==="fup"?_("רדיוס 1 מתאים למקדם שגבולו 1. עצרת אינה כזאת.")
        :_f("הגורם n אכן אינו משנה את הרדיוס, אבל {0} בחזקת n משנה אותו.", num(a)))
    ].filter(function(o){return o.why!==""}),
    steps:[
      S(_("מבחן המנה"),_("מחשבים את גבול היחס בין איבר לקודמו, בערך מוחלט."),
        rc==="fdown"?"| "+frac("x","n+1")+" | → 0"
        :rc==="fup"?"| (n+1)·x | → ∞"
        :"| "+frac("x",num(a))+" |·"+frac((k===1?"(n+1)":"(n+1)²"),(k===1?"n":"n<sup>2</sup>"))+" → "+frac("|x|",num(a))),
      S(_("דורשים קטן מ-1"),
        rc==="poly"?_("הגורם הפולינומי שואף ל-1 ואינו משפיע. רק המקדם המעריכי קובע.")
        :_("כאן הגבול אינו תלוי ב-x באותו אופן, ולכן ההכרעה מיידית."),
        rc==="fdown"?"0 < 1   ∀x":rc==="fup"?"∞ < 1   "+_("רק כאשר")+" x = 0":frac("|x|",num(a))+" < 1   ⇒   |x| < "+num(a)),
      S(_("מסקנה"),
        rc==="fdown"?_("זה בדיוק הטור של eˣ, והוא מתכנס בכל הישר.")
        :rc==="fup"?_("הטור מתכנס בנקודה אחת בלבד, ולכן הרדיוס אפס.")
        :_("גורם פולינומי אינו משנה את הרדיוס — רק המקדם המעריכי קובע."),rAns)
    ],rule:"radius",hint:_("עצרת במכנה נותנת רדיוס אינסופי, עצרת במונה רדיוס אפס, וגורם פולינומי אינו משנה דבר.")};
}

/* ---------- 4. מרחבים מטריים ---------- */
function genMetric(L){
  var a,b,c,d;
  if(L===1){
    /* שלשות פיתגוריות כדי שהמרחק יהיה שלם */
    var tri=pick([[3,4,5],[6,8,10],[5,12,13],[8,15,17],[9,12,15]]);
    a=ri(-3,3);b=ri(-3,3);c=a+tri[0];d=b+tri[1];
    return {ask:_("מהו המרחק האוקלידי בין הנקודות?"),
      expr:"P = ("+num(a)+" , "+num(b)+")   ,   Q = ("+num(c)+" , "+num(d)+")",
      ans:W(num(tri[2])),
      wrong:[
        W(num(tri[0]+tri[1]),_("זה מרחק המונית — סכום ההפרשים. האוקלידי לוקח שורש של סכום ריבועים.")),
        W(num(Math.max(tri[0],tri[1])),_("זה מרחק המקסימום. גם הוא מטריקה, אבל לא זו שנשאלה.")),
        W(num(tri[0]*tri[0]+tri[1]*tri[1]),_("שכחתם להוציא שורש. זה ריבוע המרחק."))
      ],
      steps:[
        S(_("הפרשי הקואורדינטות"),"","Δx = "+num(tri[0])+"   ,   Δy = "+num(tri[1])),
        S(_("סכום ריבועים"),"",num(tri[0])+"² + "+num(tri[1])+"² = "+num(tri[0]*tri[0]+tri[1]*tri[1])),
        S(_("שורש"),_("זו המטריקה הרגילה במישור, d₂."),"√"+num(tri[0]*tri[0]+tri[1]*tri[1])+" = "+num(tri[2]))
      ],rule:"metric",hint:_("d₂ הוא שורש סכום ריבועי ההפרשים — משפט פיתגורס.")};
  }
  if(L===2){
    var dx=ri(2,7),dy=ri(2,7);
    while(dy===dx)dy=ri(2,7);
    a=ri(-3,3);b=ri(-3,3);
    return {ask:_("מהו מרחק המונית (d₁) בין הנקודות?"),
      expr:"P = ("+num(a)+" , "+num(b)+")   ,   Q = ("+num(a+dx)+" , "+num(b+dy)+")",
      ans:W(num(dx+dy)),
      wrong:[
        W(num(Math.max(dx,dy)),_("זה d∞ — מרחק המקסימום, ולא סכום ההפרשים.")),
        W(num(r2(Math.sqrt(dx*dx+dy*dy))),_("זה המרחק האוקלידי. במטריקת המונית אין שורש.")),
        W(num(dx*dy),_("מכפילים? לא. במטריקת המונית מחברים את ההפרשים."))
      ],
      steps:[
        S(_("ההפרשים בערך מוחלט"),"","|Δx| = "+num(dx)+"   ,   |Δy| = "+num(dy)),
        S(_("מחברים"),_("שם המטריקה בא ממונית שנוסעת רק לאורך רחובות, בלי לחתוך באלכסון."),
          num(dx)+" + "+num(dy)+" = "+num(dx+dy)),
        S(_("להשוואה"),_("שלוש המטריקות הללו נותנות מספרים שונים, אבל מגדירות אותן קבוצות פתוחות."),
          "d∞ = "+num(Math.max(dx,dy)))
      ],rule:"metric",hint:_("d₁ מחבר את ההפרשים, d∞ לוקח את הגדול שבהם, ו-d₂ הוא פיתגורס.")};
  }
  /* רמה 4 — לא "חשבו מרחק" אלא "האם זו בכלל מטריקה, ואיזו
     אקסיומה נשברת". התשובה היא ההצדקה, לא מספר. */
  if(L>=4){
    var kk4=ri(2,5);
    var MC=[
      {d:"( x − y )<sup>2</sup>",k:"tri",n:_("d(0 , 2) = 4, אבל d(0 , 1) + d(1 , 2) = 1 + 1 = 2.")},
      {d:"| x − y |<sup>3</sup>",k:"tri",n:_("d(0 , 2) = 8, אבל d(0 , 1) + d(1 , 2) = 1 + 1 = 2.")},
      {d:"| x<sup>2</sup> − y<sup>2</sup> |",k:"id",n:_("d(−1 , 1) = 0 למרות ש-−1 ≠ 1.")},
      {d:"| |x| − |y| |",k:"id",n:_("d(−3 , 3) = 0 למרות ש-−3 ≠ 3.")},
      {d:"min( | x − y | , 1 )",k:"ok",n:_("חיתוך ב-1 שומר על כל ארבע התכונות. זו מטריקה חסומה מוכרת.")},
      {d:frac("| x − y |","1 + | x − y |"),k:"ok",n:_("t חלקי 1 ועוד t היא פונקציה עולה וקעורה שמתאפסת באפס, ולכן אי־שוויון המשולש נשמר.")},
      {d:"√| x − y |",k:"ok",n:_("שורש הוא פונקציה קעורה שמתאפסת באפס, ולכן √(a + b) ≤ √a + √b.")},
      {d:num(kk4)+"| x − y |",k:"ok",n:_f("כפל בקבוע חיובי {0} אינו פוגע באף אחת מארבע התכונות.", num(kk4))}
    ];
    var mc=pick(MC);
    var O1=_("d היא מטריקה על ℝ"),
        O2=_("אינה מטריקה: אי־שוויון המשולש נשבר"),
        O3=_("אינה מטריקה: יש x ≠ y שעבורם d(x , y) = 0"),
        O4=_("אינה מטריקה: d מקבלת גם ערכים שליליים");
    var A4=mc.k==="ok"?O1:mc.k==="tri"?O2:O3;
    var WR4=[];
    if(mc.k!=="ok")WR4.push(W(O1,mc.n));
    if(mc.k!=="tri")WR4.push(W(O2,_("אי־שוויון המשולש דווקא מתקיים כאן.")));
    if(mc.k!=="id")WR4.push(W(O3,_("כאן d(x , y) = 0 גורר x = y, ולכן דווקא התכונה הזאת מתקיימת.")));
    WR4.push(W(O4,_("הביטוי הוא ערך מוחלט, שורש או ריבוע, ולכן אינו יכול לקבל ערך שלילי.")));
    return {ask:_("האם d היא מטריקה על ℝ? ואם לא — איזו תכונה נשברת?"),
      expr:"d(x , y) = "+mc.d,
      ans:W(A4),
      wrong:WR4.slice(0,3),
      steps:[
        S(_("ארבע התכונות"),_("אי־שליליות; d(x , y) = 0 אם ורק אם x = y; סימטריה; ואי־שוויון המשולש."),""),
        S(_("שלוש הראשונות"),_("אי־שליליות וסימטריה מתקיימות כאן מיד, כי הביטוי תלוי רק בערך מוחלט."),""),
        S(_("מחפשים דוגמה נגדית"),mc.n,""),
        S(_("מסקנה"),_("די בתכונה אחת שנשברת כדי ש-d לא תהיה מטריקה."),A4)
      ],rule:"metric",hint:_("עוברים על ארבע התכונות ומחפשים דוגמה נגדית קונקרטית לאחת מהן.")};
  }
  /* L3 — כדור פתוח על הישר */
  c=ri(-6,6);var r=ri(2,5);   /* ברדיוס 1 הריבוע שווה לרדיוס */
  return {ask:_f("מהו הכדור הפתוח B({0} , {1}) בישר הממשי עם המטריקה הרגילה?", num(c), num(r)),
    expr:"B(c , r) = { x : |x − c| < r }",
    ans:W("( "+num(c-r)+" , "+num(c+r)+" )"),
    wrong:[
      W("[ "+num(c-r)+" , "+num(c+r)+" ]",_("הכדור פתוח, ולכן הקצוות אינם שייכים. שם אי־השוויון הוא שוויון.")),
      W("( "+num(c)+" , "+num(c+r)+" )",_("הכדור סימטרי סביב המרכז — גם שמאלה וגם ימינה.")),
      W("( "+num(c-r*r)+" , "+num(c+r*r)+" )",_("הרדיוס אינו מועלה בריבוע. הוא מרחק, כמו שהוא."))
    ],
    steps:[
      S(_("מפרקים את הערך המוחלט"),"","−"+num(r)+" < x − "+num(c)+" < "+num(r)),
      S(_("מעבירים אגף"),"",num(c-r)+" < x < "+num(c+r)),
      S(_("קבוצה פתוחה"),_("בישר הממשי כדור פתוח הוא בדיוק קטע פתוח סביב המרכז."),
        "( "+num(c-r)+" , "+num(c+r)+" )")
    ],rule:"ball",hint:_("כדור פתוח בישר הוא קטע פתוח: מרכז פחות רדיוס עד מרכז ועוד רדיוס.")};
}

/* ============================================================
   מחוללי השאלות — אנליזה מרוכבת
   ============================================================ */

/* ---------- 5. אריתמטיקה מרוכבת ---------- */
function genCArith(L){
  var a,b,c,d;
  if(L===1){
    a=rnz(-5,5);b=rnz(-5,5);c=rnz(-5,5);d=rnz(-5,5);
    var re=a*c-b*d, im=a*d+b*c;
    var ctry=0;
    while(ctry++<40&&(im===0||re===0||re===a*c+b*d||im===re))
      {a=rnz(-5,5);b=rnz(-5,5);c=rnz(-5,5);d=rnz(-5,5);re=a*c-b*d;im=a*d+b*c}
    return {ask:_("חשבו את המכפלה"),
      expr:"("+cnum(a,b)+")("+cnum(c,d)+")",
      ans:W(cnum(re,im)),
      wrong:[
        W(cnum(a*c+b*d,im),_("i בריבוע הוא מינוס אחד, ולכן החלק הממשי מחסר ולא מחבר.")),
        W(cnum(a*c,b*d),_("הכפלתם ממשי בממשי ומדומה במדומה. צריך לפתוח סוגריים במלואן.")),
        W(cnum(im,re),_("החלפתם בין החלק הממשי למדומה."))
      ],
      steps:[
        S(_("פותחים סוגריים"),_("בדיוק כמו בשני בינומים."),
          num(a*c)+term(a*d,"i")+term(b*c,"i")+term(b*d,"i²")),
        S(_("מציבים i² = −1"),_("זה כל ההבדל בין מרוכבים לפולינומים."),
          num(a*c)+" − "+pn(b*d)+" = "+num(re)),
        S(_("אוספים"),"",cnum(re,im))
      ],rule:"cmul",hint:_("פותחים סוגריים כרגיל, ואז מציבים i בריבוע שווה מינוס אחד.")};
  }
  if(L===2){
    var tri=pick([[3,4,5],[6,8,10],[5,12,13],[8,15,17]]);
    a=pick([1,-1])*tri[0];b=pick([1,-1])*tri[1];
    return {ask:_("מהו הערך המוחלט של המספר המרוכב?"),
      expr:"z = "+cnum(a,b),
      ans:W(num(tri[2])),
      wrong:[
        W(num(Math.abs(a)+Math.abs(b)),_("חיברתם את החלקים. הערך המוחלט הוא שורש סכום הריבועים.")),
        W(num(a*a+b*b),_("שכחתם להוציא שורש. זה |z| בריבוע.")),
        W(num(Math.abs(a)),_("זה החלק הממשי בלבד. הערך המוחלט מודד את המרחק מהראשית."))
      ],
      steps:[
        S(_("מה זה ערך מוחלט"),_("המרחק מהראשית במישור המרוכב — בדיוק אורך של וקטור."),"|z| = √(a² + b²)"),
        S(_("מציבים"),"",num(a*a)+" + "+num(b*b)+" = "+num(a*a+b*b)),
        S(_("שורש"),"","√"+num(a*a+b*b)+" = "+num(tri[2]))
      ],rule:"cabs",hint:_("|z| הוא המרחק מהראשית: שורש של ריבוע הממשי ועוד ריבוע המדומה.")};
  }
  /* רמה 4 — מנה. זה בדיוק חיבור של רמה 1 (כפל, פתיחת סוגריים) עם
     רמה 3 (הכפלה במצומד), ולא נאמר באיזה סדר לעשות אותם. */
  if(L>=4){
    var a4,b4,c4,d4,dn4,nr4,ni4,mr4,mi4,S1,S2,S3,S4,t4=0;
    do{
      a4=rnz(-6,6);b4=rnz(-6,6);c4=rnz(-5,5);d4=rnz(-5,5);
      dn4=c4*c4+d4*d4;nr4=a4*c4+b4*d4;ni4=b4*c4-a4*d4;
      mr4=a4*c4-b4*d4;mi4=a4*d4+b4*c4;
      S1=cxq(nr4,ni4,dn4);S2=cxq(mr4,mi4,dn4);
      var S3i=fr(Math.abs(b4),Math.abs(d4));
      S3=fr(a4,c4).html()+(b4*d4<0?" − ":" + ")+((S3i.n===1&&S3i.d===1)?"":S3i.html())+"i";
      S4=cxq(nr4,ni4,1);
    }while(t4++<120&&(nr4===0||ni4===0||mr4===0||mi4===0||new Set([S1,S2,S3,S4]).size<4));
    return {ask:_("חשבו את המנה והציגו אותה בצורה a + bi"),
      expr:frac(cnum(a4,b4),cnum(c4,d4)),
      ans:W(S1),
      wrong:[
        W(S2,_("הכפלתם את המונה ואת המכנה במכנה עצמו ולא במצומד שלו. רק המצומד הופך את המכנה לממשי.")),
        W(S3,_("אי אפשר לחלק חלק בחלק. הכלל הזה אינו קיים במרוכבים.")),
        W(S4,_("עצרתם אחרי המונה. עוד צריך לחלק ב-|z| בריבוע של המכנה."))
      ],
      steps:[
        S(_("בוחרים סדר פעולות"),_("מכפילים מונה ומכנה במצומד המכנה — ורק אז פותחים סוגריים."),
          frac("("+num(a4)+sgn(b4)+"i)("+num(c4)+" "+(d4>0?"−":"+")+" "+num(Math.abs(d4))+"i)",
               "("+num(c4)+sgn(d4)+"i)("+num(c4)+" "+(d4>0?"−":"+")+" "+num(Math.abs(d4))+"i)")),
        S(_("המכנה נעשה ממשי"),_("מכפלת מספר בצמוד שלו היא |z| בריבוע."),num(c4*c4)+" + "+num(d4*d4)+" = "+num(dn4)),
        S(_("המונה"),_("פותחים סוגריים ומציבים i בריבוע שווה מינוס אחד."),cnum(nr4,ni4)),
        S(_("מחלקים ומצמצמים"),"",S1)
      ],rule:"cinv",hint:_("מנה של מרוכבים היא שני צעדים: הכפלה במצומד המכנה, ואז חלוקה ב-|z| בריבוע.")};
  }
  /* L3 — הופכי. |a| או |b| ששווים 1 היו מזהים את ״הפכתם כל חלק בנפרד״ עם המצומד */
  a=pick([-4,-3,-2,2,3,4]);b=pick([-4,-3,-2,2,3,4]);
  var den=a*a+b*b;
  return {ask:_("מהו ההופכי של המספר המרוכב?"),
    expr:frac("1",cnum(a,b)),
    ans:W(fr(a,den).html()+" "+(b>0?"−":"+")+" "+fr(Math.abs(b),den).html()+"i"),
    wrong:[
      W(fr(a,den).html()+" "+(b>0?"+":"−")+" "+fr(Math.abs(b),den).html()+"i",
        _("שכחתם להפוך את סימן החלק המדומה. הכפלנו במצומד, ולכן הסימן מתהפך.")),
      W(fr(1,a).html()+" "+(b>0?"−":"+")+" "+fr(1,Math.abs(b)).html()+"i",_("אי אפשר להפוך כל חלק בנפרד. מכפילים במצומד ומחלקים בערך המוחלט בריבוע.")),
      W(num(a)+" "+(b>0?"−":"+")+" "+num(Math.abs(b))+"i",_("זה המצומד עצמו. עוד צריך לחלק בסכום הריבועים."))
    ],
    steps:[
      S(_("מכפילים במצומד"),_("המצומד הוא אותו מספר עם סימן הפוך בחלק המדומה."),
        frac("1 · ("+num(a)+" "+(b>0?"−":"+")+" "+num(Math.abs(b))+"i)","("+num(a)+sgn(b)+"i)("+num(a)+" "+(b>0?"−":"+")+" "+num(Math.abs(b))+"i)")),
      S(_("המכנה נעשה ממשי"),_("מכפלת מספר בצמוד שלו היא תמיד |z| בריבוע."),
        num(a*a)+" + "+num(b*b)+" = "+num(den)),
      S(_("מחלקים"),"",fr(a,den).html()+" "+(b>0?"−":"+")+" "+fr(Math.abs(b),den).html()+"i")
    ],rule:"cinv",hint:_("מכפילים מונה ומכנה במצומד. המכנה הופך ל-|z| בריבוע, שהוא ממשי.")};
}

/* ---------- 6. צורה קוטבית ודה־מואבר ---------- */
var CPOL=[
  {z:"1 + i",      r:"√2", rv:Math.SQRT2, th:45},
  {z:"−1 + i",     r:"√2", rv:Math.SQRT2, th:135},
  {z:"−1 − i",     r:"√2", rv:Math.SQRT2, th:225},
  {z:"1 − i",      r:"√2", rv:Math.SQRT2, th:315},
  {z:"i",          r:"1",  rv:1,          th:90},
  {z:"−1",         r:"1",  rv:1,          th:180},
  {z:"√3 + i",     r:"2",  rv:2,          th:30},
  {z:"1 + √3i",    r:"2",  rv:2,          th:60}
];
/* ל-L1 רק מספרים שמודולם אינו 1: אחרת ״שכחתם שורש״ נותן שוב 1 */
var CPOL1=CPOL.filter(function(x){return x.rv!==1});
function genCPolar(L){
  var p,n;
  if(L===1){
    p=pick(CPOL1);
    return {ask:_("מהם המודול והארגומנט של המספר?"),
      expr:"z = "+p.z,
      ans:W("|z| = "+p.r+"   ,   arg z = "+num(p.th)+"°"),
      wrong:[
        W("|z| = "+p.r+"   ,   arg z = "+num((360-p.th)%360)+"°",
          _("זה הארגומנט של המצומד. הסימן של החלק המדומה קובע את חצי המישור.")),
        W("|z| = "+num(Math.round(p.rv*p.rv))+"   ,   arg z = "+num(p.th)+"°",
          _("שכחתם להוציא שורש. המודול הוא שורש סכום הריבועים.")),
        W("|z| = "+p.r+"   ,   arg z = "+num((360-p.th)%360===(p.th+90)%360?(p.th+180)%360:(p.th+90)%360)+"°",
          _("הזזתם ברבע סיבוב. כדאי לצייר את הנקודה ולראות באיזה רביע היא."))
      ],
      steps:[
        S(_("מציירים את הנקודה"),_("החלק הממשי הוא הציר האופקי, המדומה הוא האנכי."),""),
        S(_("המודול"),_("המרחק מהראשית."),"|z| = "+p.r),
        S(_("הארגומנט"),_("הזווית מהכיוון החיובי של ציר x, נגד כיוון השעון."),"arg z = "+num(p.th)+"°")
      ],rule:"cpolar",hint:_("מודול הוא המרחק מהראשית, וארגומנט הוא הזווית מציר x.")};
  }
  if(L===2){
    var th2,ctry=0;
    do{ p=pick(CPOL);n=ri(2,4); th2=((p.th*n)%360+360)%360; }
    while(ctry++<60&&new Set([th2,p.th,((p.th+n)%360+360)%360,((p.th*n*n)%360+360)%360]).size<4);
    return {ask:_f("z = {0}. מהו הארגומנט של z בחזקת {1}?", p.z, num(n)),
      expr:"arg( z<sup>"+num(n)+"</sup> ) = ?",
      ans:W(num(th2)+"°"),
      wrong:[
        W(num(p.th)+"°",_("החזקה מכפילה את הזווית. הארגומנט אינו נשאר כמו שהוא.")),
        W(num(((p.th+n)%360+360)%360)+"°",_("חיברתם את החזקה לזווית. דה־מואבר מכפיל, לא מחבר.")),
        W(num(((p.th*n*n)%360+360)%360)+"°",_("הכפלתם פעמיים. הזווית מוכפלת בחזקה פעם אחת."))
      ],
      steps:[
        S(_("משפט דה־מואבר"),_("בחזקה: המודול עולה בחזקה, והזווית מוכפלת בה."),
          "z<sup>n</sup> = r<sup>n</sup>( cos nθ + i sin nθ )"),
        S(_("מכפילים את הזווית"),"",num(p.th)+"° · "+num(n)+" = "+num(p.th*n)+"°"),
        S(_("מצמצמים לסיבוב אחד"),_("מחסרים כפולות של 360 מעלות עד שנשארים בתחום."),num(th2)+"°")
      ],rule:"demoivre",hint:_("דה־מואבר: המודול בחזקה, הזווית כפול החזקה.")};
  }
  /* רמה 4 — שלושה מעברים בשאלה אחת: לצורה קוטבית, דה־מואבר, וחזרה
     לצורה האלגברית. אף אחד מהם אינו נאמר בשאלה. */
  if(L>=4){
    var ZS=[["1 + i",1,1,45],["−1 + i",-1,1,135],["−1 − i",-1,-1,225],["1 − i",1,-1,315]];
    var zz,nn,re4,im4,tt,i4,S1,S2,S3,S4,t4=0;
    do{
      zz=pick(ZS);nn=ri(3,7);re4=1;im4=0;
      for(i4=0;i4<nn;i4++){tt=re4*zz[1]-im4*zz[2];im4=re4*zz[2]+im4*zz[1];re4=tt;}
      S1=cnum(re4,im4);
      S2=cnum(Math.pow(zz[1],nn),Math.pow(zz[2],nn));
      S3=cnum(re4,-im4);S4=cnum(im4,re4);
    }while(t4++<120&&new Set([S1,S2,S3,S4]).size<4);
    var th4=((zz[3]*nn)%360+360)%360;
    var rp=nn%2===0?num(Math.pow(2,nn/2)):(Math.pow(2,(nn-1)/2)===1?"√2":num(Math.pow(2,(nn-1)/2))+"√2");
    return {ask:_f("z = {0}. חשבו את z בחזקת {1} והציגו את התוצאה בצורה a + bi.", zz[0], num(nn)),
      expr:"z<sup>"+num(nn)+"</sup> = ?",
      ans:W(S1),
      wrong:[
        W(S2,_("אי אפשר להעלות כל חלק בחזקה בנפרד. עוברים לצורה קוטבית, או פותחים סוגריים עד הסוף.")),
        W(S3,_("טעות בכיוון הזווית. הארגומנט מוכפל בחזקה, ומהזווית שהתקבלה נקבע הרביע.")),
        W(S4,_("החלפתם בין החלק הממשי למדומה. הקוסינוס נותן את הממשי והסינוס את המדומה."))
      ],
      steps:[
        S(_("קודם לצורה קוטבית"),_("מודול וארגומנט, ורק אחר כך החזקה."),"|z| = √2   ,   arg z = "+num(zz[3])+"°"),
        S(_("דה־מואבר"),_("המודול עולה בחזקה, והזווית מוכפלת בה."),
          "|z<sup>"+num(nn)+"</sup>| = "+rp+"   ,   arg = "+num(zz[3]*nn)+"° ≡ "+num(th4)+"°"),
        S(_("וחזרה לצורה אלגברית"),_("מציבים את הקוסינוס והסינוס של הזווית שהתקבלה, ומכפילים במודול."),S1)
      ],rule:"demoivre",hint:_("שלושה מעברים: לקוטבי, דה־מואבר, וחזרה ל-a + bi.")};
  }
  /* L3 — שורשי היחידה */
  n=ri(3,8);
  return {ask:_f("מהי הזווית בין שני שורשים סמוכים מסדר {0} של היחידה?", num(n)),
    expr:"z<sup>"+num(n)+"</sup> = 1",
    ans:W(num(r2(360/n))+"°"),
    wrong:[
      W(num(n)+"°",_("זה מספר השורשים, לא הזווית ביניהם.")),
      W(num(r2(180/n))+"°",_("חילקתם חצי סיבוב. השורשים פרושים על מעגל שלם.")),
      W("360°",_("זה סיבוב מלא. הוא מתחלק שווה בשווה בין כל השורשים."))
    ],
    steps:[
      S(_("כמה שורשים"),_f("למספר מרוכב שונה מאפס יש בדיוק {0} שורשים מסדר {0}.", num(n)),"n = "+num(n)),
      S(_("איפה הם"),_("כולם על מעגל היחידה, במרחקים שווים זה מזה."),"|z| = 1"),
      S(_("הזווית"),_("מחלקים סיבוב מלא במספר השורשים."),frac("360°",num(n))+" = "+num(r2(360/n))+"°")
    ],rule:"croot",hint:_("שורשי היחידה יושבים על מעגל, במרווחים של 360 מעלות חלקי n.")};
}

/* ---------- 7. קושי־רימן ואנליטיות ---------- */
var CRCASE=[
  {u:"x² − y²", v:"2xy",  ok:true,  f:"z²",  ux:"2x",  vy:"2x",  uy:"−2y", nvx:"−2y"},
  {u:"x",       v:"−y",   ok:false, f:"z̄",  ux:"1",   vy:"−1",  uy:"0",   nvx:"0"},
  {u:"x",       v:"y",    ok:true,  f:"z",   ux:"1",   vy:"1",   uy:"0",   nvx:"0"},
  {u:"x² + y²", v:"0",    ok:false, f:"|z|²",ux:"2x",  vy:"0",   uy:"2y",  nvx:"0"}
];
function genCR(L){
  var c;
  if(L===1){
    /* קודם היו כאן שני מצבים בלבד, ולכן "אי אפשר לקבוע" לא היה התשובה
       אף פעם. עכשיו בחלק מההגרלות v נושא מקדם a שאינו נתון: המשוואות
       מתקיימות בדיוק לערך אחד שלו, ובלי לדעת אותו אין הכרעה. */
    var prm=Math.random()<0.3,mC=ri(1,3);
    var uniC=[_("אנליטית"),_("אינה אנליטית"),_("אי אפשר לקבוע")];
    c=pick(CRCASE);
    var ansC=prm?uniC[2]:(c.ok?uniC[0]:uniC[1]);
    var whyC=prm?_f("קושי־רימן מתקיימות בדיוק כאשר a = {0}, ולכל ערך אחר של a הפונקציה אינה אנליטית. בלי לדעת את a אי אפשר להכריע.", num(2*mC))
                :_("שתי משוואות קושי־רימן חייבות להתקיים יחד. די באחת שנופלת.");
    return {ask:_("האם הפונקציה אנליטית?"),
      expr:prm?("f = u + iv   ,   u = "+coef(mC,"x²")+" − "+coef(mC,"y²")+"   ,   v = a·xy")
              :("f = u + iv   ,   u = "+c.u+"   ,   v = "+c.v),
      ans:W(ansC),
      wrong:uniC.filter(function(v){return v!==ansC}).map(function(v){
          return W(v, prm?whyC
            :(v===uniC[2]?_("שתי הנגזרות החלקיות קיימות כאן, ולכן המבחן מכריע."):whyC))})
        .concat([W(_("אנליטית רק בראשית"),_("קושי־רימן נבדקות כזהות בין פונקציות, ולא בנקודה בודדת."))]),
      steps:prm?[
        S(_("משוואה ראשונה"),_("u לפי x שווה ל-v לפי y."),"u<sub>x</sub> = "+coef(2*mC,"x")+"   ,   v<sub>y</sub> = a·x"),
        S(_("משוואה שנייה"),_("u לפי y שווה למינוס v לפי x."),"u<sub>y</sub> = "+coef(-2*mC,"y")+"   ,   −v<sub>x</sub> = −a·y"),
        S(_("מסקנה"),whyC,uniC[2])
      ]:[
        S(_("משוואה ראשונה"),_("u לפי x שווה ל-v לפי y."),"u<sub>x</sub> = "+c.ux+"   ,   v<sub>y</sub> = "+c.vy),
        S(_("משוואה שנייה"),_("u לפי y שווה למינוס v לפי x."),"u<sub>y</sub> = "+c.uy+"   ,   −v<sub>x</sub> = "+c.nvx),
        S(_("מסקנה"),_f("זו הפונקציה {0}.", c.f),c.ok?_("אנליטית"):_("אינה אנליטית"))
      ],rule:"cr",hint:_("שתי משוואות קושי־רימן: u_x = v_y וגם u_y = −v_x. שתיהן יחד.")};
  }
  if(L===2){
    /* קודם עמדה כאן u אחת בלבד, x² − y², ולכן התשובה הייתה v = 2xy + C
       בכל הגרלה. עכשיו המקדם מוגרל, וגם המשפחה השנייה — u = 2a·xy —
       מופיעה, ובה הצמודה יוצאת הפרש ריבועים ולא מכפלה. */
    var m=ri(1,3);
    if(Math.random()<0.5){
      return {ask:_("מהי הצמודה ההרמונית v?"),
        expr:"u(x , y) = "+coef(m,"x²")+" − "+coef(m,"y²"),
        ans:W("v = "+coef(2*m,"xy")+" + C"),
        wrong:[
          W("v = "+coef(m,"x²")+" + "+coef(m,"y²")+" + C",_("v אינה עוד פונקציה הרמונית כלשהי — היא נקבעת מ-u דרך קושי־רימן.")),
          W("v = "+coef(-2*m,"xy")+" + C",_f("טעות סימן. מהמשוואה הראשונה v לפי y שווה ל-u לפי x, שהוא {0} חיובי.", coef(2*m,"x"))),
          W("v = "+coef(2*m,"x")+" − "+coef(2*m,"y")+" + C",_f("איבדתם את האינטגרציה. אינטגרל של {0} לפי y הוא {1}.", coef(2*m,"x"), coef(2*m,"xy")))
        ],
        steps:[
          S(_("משוואה ראשונה"),"","v<sub>y</sub> = u<sub>x</sub> = "+coef(2*m,"x")),
          S(_("מאנטגרלים לפי y"),_("x מתנהג כקבוע, ולכן ״הקבוע״ שנוסף עשוי להיות פונקציה של x."),"v = "+coef(2*m,"xy")+" + g(x)"),
          S(_("בודקים מול המשוואה השנייה"),_("v לפי x שווה למינוס u לפי y, ושני הצדדים יוצאים זהים — ולכן g קבועה."),"v = "+coef(2*m,"xy")+" + C")
        ],rule:"cr",hint:_("מאנטגרלים משוואה אחת, ובודקים את התוצאה מול השנייה כדי לקבוע את הקבוע.")};
    }
    /* u = 2m·xy  →  v_y = u_x = 2my  →  v = m·y² + g(x) ;  v_x = −u_y = −2mx  →  v = m·y² − m·x² + C */
    return {ask:_("מהי הצמודה ההרמונית v?"),
      expr:"u(x , y) = "+coef(2*m,"xy"),
      ans:W("v = "+coef(m,"y²")+" − "+coef(m,"x²")+" + C"),
      wrong:[
        W("v = "+coef(m,"x²")+" − "+coef(m,"y²")+" + C",_("טעות סימן. המשוואה השנייה נותנת v לפי x שווה למינוס u לפי y, ולכן x² מופיע עם מינוס.")),
        W("v = "+coef(2*m,"xy")+" + C",_("זו u עצמה. הצמודה היא פונקציה אחרת, שנקבעת ממנה דרך קושי־רימן.")),
        W("v = "+coef(m,"y²")+" + "+coef(m,"x²")+" + C",_("סכום ריבועים אינו הרמוני — הלפלסיאן שלו אינו מתאפס, ולכן הוא אינו יכול להיות צמודה."))
      ],
      steps:[
        S(_("משוואה ראשונה"),"","v<sub>y</sub> = u<sub>x</sub> = "+coef(2*m,"y")),
        S(_("מאנטגרלים לפי y"),_("y הוא משתנה האינטגרציה, ולכן החזקה עולה באחת ומחלקים בה."),"v = "+coef(m,"y²")+" + g(x)"),
        S(_("בודקים מול המשוואה השנייה"),_("v לפי x שווה למינוס u לפי y, ומכאן נקבע g."),"v = "+coef(m,"y²")+" − "+coef(m,"x²")+" + C")
      ],rule:"cr",hint:_("מאנטגרלים משוואה אחת, ובודקים את התוצאה מול השנייה כדי לקבוע את הקבוע.")};
  }
  /* רמה 4 — ההבחנה שנופלים בה במבחן: קושי־רימן בנקודה אינן
     אנליטיות. אנליטיות דורשת סביבה שלמה, ונקודה בודדת או ישר
     אינם מכילים סביבה. */
  if(L>=4){
    var CC=[
      {u:"x² − y²",v:"2xy",ux:"2x",vy:"2x",uy:"−2y",nvx:"−2y",k:"all",c:_("שתי המשוואות מתקיימות זהותית.")},
      {u:"2xy",v:"y² − x²",ux:"2y",vy:"2y",uy:"2x",nvx:"2x",k:"all",c:_("שתי המשוואות מתקיימות זהותית.")},
      {u:"x",v:"y",ux:"1",vy:"1",uy:"0",nvx:"0",k:"all",c:_("שתי המשוואות מתקיימות זהותית.")},
      {u:"x² + y²",v:"0",ux:"2x",vy:"0",uy:"2y",nvx:"0",k:"orig",c:"2x = 0   ,   2y = 0"},
      {u:"x²",v:"y²",ux:"2x",vy:"2y",uy:"0",nvx:"0",k:"line",L:"y = x",c:"2x = 2y"},
      {u:"x² + y²",v:"2xy",ux:"2x",vy:"2x",uy:"2y",nvx:"−2y",k:"line",L:"y = 0",c:"2y = −2y"},
      {u:"x² + y²",v:"−2xy",ux:"2x",vy:"−2x",uy:"2y",nvx:"2y",k:"line",L:"x = 0",c:"2x = −2x"},
      {u:"x",v:"−y",ux:"1",vy:"−1",uy:"0",nvx:"0",k:"none",c:_("1 = −1 — לעולם אינו מתקיים.")},
      {u:"x + y",v:"0",ux:"1",vy:"0",uy:"1",nvx:"0",k:"none",c:_("1 = 0 — לעולם אינו מתקיים.")}
    ];
    var cc=pick(CC),ln=cc.L||"y = x";
    var O1=_("אנליטית בכל המישור"),
        O2=_("גזירה רק בראשית, ואינה אנליטית באף נקודה"),
        O3=_f("גזירה רק על הישר {0}, ואינה אנליטית באף נקודה", ln),
        O4=_("אינה גזירה באף נקודה");
    var A4=cc.k==="all"?O1:cc.k==="orig"?O2:cc.k==="line"?O3:O4;
    var WR4=[];
    if(cc.k!=="all")WR4.push(W(O1,_("קושי־רימן אינן מתקיימות בכל נקודה, ולכן אין סביבה שלמה שבה f גזירה.")));
    if(cc.k!=="orig")WR4.push(W(O2,cc.k==="all"?_("f גזירה בכל נקודה, ולא רק בראשית."):cc.k==="line"?_f("המשוואות מתקיימות על כל הישר {0}, ולא רק בראשית.", ln):_("המשוואות אינן מתקיימות אף בראשית.")));
    if(cc.k!=="line")WR4.push(W(O3,cc.k==="all"?_("f גזירה בכל המישור, ולא רק על ישר."):cc.k==="orig"?_("המשוואות מתקיימות בנקודה אחת בלבד, לא על ישר שלם."):_("אין אף נקודה שבה שתי המשוואות מתקיימות.")));
    if(cc.k!=="none")WR4.push(W(O4,cc.k==="all"?_("שתי המשוואות מתקיימות זהותית, ולכן f גזירה בכל נקודה."):cc.k==="orig"?_("בראשית שתי המשוואות כן מתקיימות, ולכן שם f גזירה."):_f("על הישר {0} שתי המשוואות מתקיימות, ולכן שם f גזירה.", ln)));
    return {ask:_("באילו נקודות f גזירה, והאם היא אנליטית שם?"),
      expr:"f = u + iv   ,   u = "+cc.u+"   ,   v = "+cc.v,
      ans:W(A4),
      wrong:WR4.slice(0,3),
      steps:[
        S(_("הנגזרות החלקיות"),"","u<sub>x</sub> = "+cc.ux+"   ,   v<sub>y</sub> = "+cc.vy+"   ,   u<sub>y</sub> = "+cc.uy+"   ,   −v<sub>x</sub> = "+cc.nvx),
        S(_("איפה שתיהן מתקיימות"),_("פותרים את שתי המשוואות יחד, ומקבלים קבוצת נקודות."),cc.c),
        S(_("גזירות אינה אנליטיות"),_("אנליטיות דורשת גזירות בכל סביבה של הנקודה. נקודה בודדת או ישר אינם מכילים סביבה, ולכן אין שם אנליטיות."),A4)
      ],rule:"cr",hint:_("קודם מוצאים היכן קושי־רימן מתקיימות, ורק אז שואלים אם יש שם סביבה שלמה.")};
  }
  /* L3. קודם עמדה כאן פונקציה אחת, ולכן התשובה הייתה a = −1 בכל 500
     ההגרלות. עכשיו מוגרלת אחת משתי משפחות, ובכל אחת מקדם משתנה —
     ולכן a האמיתי משתנה גם הוא. */
  /* שתי המשפחות הראשונות תמיד קבעו ערך יחיד ושונה מאפס, ולכן
     "a = 0" ו-"לכל a" היו שני מסיחים שלעולם אינם נכונים. נוספו כאן
     שתי משפחות: באחת המשוואה השנייה נותנת a = −a ולכן a = 0 ממש,
     ובשנייה שתי המשוואות מתקיימות זהותית ולכן כל a מתאים. */
  var kk=ri(1,4),aAns,fExpr,eq1,eq2,crAll=false,wrC,lastD;
  var crKind=pick(["sqA","sqB","zero","all"]);
  if(crKind==="sqA"){
    /* u = kk·x² + a·y² , v = 2·kk·xy  →  u_y = 2ay , −v_x = −2·kk·y  →  a = −kk */
    aAns=-kk;
    fExpr="f = ( "+coef(kk,"x²")+" + a y² ) + i · "+coef(2*kk,"xy");
    eq1="u<sub>x</sub> = "+coef(2*kk,"x")+" = v<sub>y</sub>";
    eq2="u<sub>y</sub> = 2ay   ,   −v<sub>x</sub> = "+coef(-2*kk,"y");
  }else if(crKind==="sqB"){
    /* u = kk·x² − kk·y² , v = a·xy  →  u_x = 2·kk·x = v_y = a·x  →  a = 2·kk */
    aAns=2*kk;
    fExpr="f = ( "+coef(kk,"x²")+" − "+coef(kk,"y²")+" ) + i · a xy";
    eq1="u<sub>x</sub> = "+coef(2*kk,"x")+"   ,   v<sub>y</sub> = a x";
    eq2="u<sub>y</sub> = "+coef(-2*kk,"y")+"   ,   −v<sub>x</sub> = −a y";
  }else if(crKind==="zero"){
    /* u = kk·x + a·y , v = a·x + kk·y  →  u_y = a , −v_x = −a  →  a = −a  →  a = 0 */
    aAns=0;
    fExpr="f = ( "+coef(kk,"x")+" + a y ) + i · ( a x + "+coef(kk,"y")+" )";
    eq1="u<sub>x</sub> = "+num(kk)+"   ,   v<sub>y</sub> = "+num(kk);
    eq2="u<sub>y</sub> = a   ,   −v<sub>x</sub> = −a   ⇒   a = −a";
    wrC=[
      W("a = "+num(kk),_("זה המקדם שמופיע במשוואה הראשונה, וזו מתקיימת מאליה. המשוואה השנייה היא שקובעת את a.")),
      W("a = "+num(-kk),_("זה המקדם שמופיע במשוואה הראשונה, וזו מתקיימת מאליה. המשוואה השנייה היא שקובעת את a.")),
      W(_("לכל a"),_("המשוואה הראשונה אכן מתקיימת לכל a, אבל השנייה נותנת a = −a. המספר היחיד ששווה למינוס עצמו הוא אפס."))
    ];
    lastD=_("שתי המשוואות חייבות להתקיים יחד, וזו שקובעת נותנת ערך יחיד.");
  }else{
    /* u = kk·x² − kk·y² + a·x , v = 2·kk·xy + a·y  →  שתי המשוואות
       מתקיימות זהותית, כי f = kk·z² + a·z לכל a */
    crAll=true;
    fExpr="f = ( "+coef(kk,"x²")+" − "+coef(kk,"y²")+" + a x ) + i · ( "+coef(2*kk,"xy")+" + a y )";
    eq1="u<sub>x</sub> = "+coef(2*kk,"x")+" + a   ,   v<sub>y</sub> = "+coef(2*kk,"x")+" + a";
    eq2="u<sub>y</sub> = "+coef(-2*kk,"y")+"   ,   −v<sub>x</sub> = "+coef(-2*kk,"y");
    wrC=[
      W("a = "+num(kk),_("כאן שתי משוואות קושי־רימן מתקיימות זהותית, בלי שום תנאי על a. אין ערך אחד שצריך לבחור.")),
      W("a = "+num(-kk),_("כאן שתי משוואות קושי־רימן מתקיימות זהותית, בלי שום תנאי על a. אין ערך אחד שצריך לבחור.")),
      W("a = "+num(2*kk),_("כאן שתי משוואות קושי־רימן מתקיימות זהותית, בלי שום תנאי על a. אין ערך אחד שצריך לבחור."))
    ];
    lastD=_f("שתי המשוואות מתקיימות זהותית, ולכן אין תנאי על a כלל. למעשה f = {0}z² + az, וזו פונקציה שלמה לכל a.", num(kk));
  }
  if(!wrC){
    wrC=[
      W("a = "+num(-aAns),_("טעות סימן. במשוואה השנייה של קושי־רימן u לפי y שווה למינוס v לפי x — המינוס הוא כל ההבדל.")),
      W("a = 0",_("עם a = 0 האיבר נעלם, והשוויון מתקיים רק על ציר אחד ולא בכל המישור.")),
      W(_("לכל a"),_("משוואה אחת אכן מתקיימת לכל a, אבל השנייה קובעת את a באופן יחיד."))
    ];
    lastD=_("שתי המשוואות חייבות להתקיים יחד, וזו שקובעת נותנת ערך יחיד.");
  }
  return {ask:_("עבור איזה a הפונקציה אנליטית בכל המישור?"),
    expr:fExpr,
    ans:W(crAll?_("לכל a"):("a = "+num(aAns))),
    wrong:wrC,
    steps:[
      S(_("משוואה ראשונה"),"",eq1),
      S(_("משוואה שנייה"),"",eq2),
      S(_("משווים"),lastD,crAll?_("לכל a"):("a = "+num(aAns)))
    ],rule:"cr",hint:_("כותבים את שתי משוואות קושי־רימן, ומשווים מקדמים — אחת מהן קובעת את a, ולפעמים שתיהן מתקיימות מאליהן.")};
}

/* ---------- 8. קטבים ושאריות ---------- */
function genResidue(L){
  var a,b,k;
  if(L===1){
    k=pick([-6,-5,-4,-3,-2,2,3,4,5,6]);a=rnz(-5,5);
    while(a===k||a===k*k)a=rnz(-5,5);
    return {ask:_f("מהי השארית של f בקוטב z = {0}?", num(a)),
      expr:"f(z) = "+frac(num(k),"z"+sgn(-a)),
      ans:W(num(k)),
      wrong:[
        W(num(a),_("זה מיקום הקוטב, לא השארית. השארית היא המקדם שמעליו.")),
        W("0",_("שארית אפס מתקבלת רק כשאין קוטב, או כשהמקדם עצמו אפס.")),
        W(num(k*k),_("השארית אינה מועלית בריבוע. היא המונה עצמו, כפי שהוא."))
      ],
      steps:[
        S(_("מזהים את סוג הקוטב"),_("המכנה מתאפס בחזקה ראשונה, ולכן זה קוטב פשוט."),"z = "+num(a)),
        S(_("שארית בקוטב פשוט"),_("מכפילים ב-(z − a) ומציבים את a."),
          "Res = lim<sub>z→"+num(a)+"</sub> (z "+(a<0?"+":"−")+" "+num(Math.abs(a))+")f(z)"),
        S(_("מצמצמים"),_("הגורם מצטמצם ונשאר המונה בלבד."),"Res = "+num(k))
      ],rule:"res",hint:_("בקוטב פשוט: מכפילים ב-(z − a), מצמצמים ומציבים.")};
  }
  if(L===2){
    var rtry=0;
    do{ a=rnz(-5,5);b=rnz(-5,5); }
    while(rtry++<60&&(a===b||new Set([fr(1,a-b).txt(),fr(1,b-a).txt(),fr(1,a*b).txt(),String(a-b)]).size<4));
    return {ask:_f("מהי השארית של f בקוטב z = {0}?", num(a)),
      expr:"f(z) = "+frac("1","(z"+sgn(-a)+")(z"+sgn(-b)+")"),
      ans:W(fr(1,a-b).html()),
      wrong:[
        W(fr(1,b-a).html(),_("טעות סימן. מציבים את הקוטב שנשאל, ומחסרים ממנו את השני.")),
        W(fr(1,a*b).html(),_("הכפלתם את הקטבים. אחרי הצמצום נשאר ההפרש, לא המכפלה.")),
        W(num(a-b),_("שכחתם שזה מכנה. השארית היא ההופכי של ההפרש."))
      ],
      steps:[
        S(_("שני קטבים פשוטים"),"","z = "+num(a)+"   ,   z = "+num(b)),
        S(_("מכפילים בגורם ומצמצמים"),_("נשאר רק הגורם השני במכנה."),
          "Res = "+frac("1",num(a)+" "+(b<0?"+":"−")+" "+num(Math.abs(b)))),
        S(_("מציבים"),"",fr(1,a-b).html())
      ],rule:"res",hint:_("מוחקים את הגורם של הקוטב הנשאל, ומציבים בו את שאר הביטוי.")};
  }
  /* רמה 4 — שלושה צעדים בלי הכוונה: לאתר קטבים, להכריע מי בפנים,
     ולסכום רק אותם. המקרה שבו שני הקטבים בפנים נותן אפס, וזה
     בדיוק הרעיון ששווה לראות. */
  if(L>=4){
    /* הרדיוס נבחר לפי המקרה המבוקש ולא באקראי, אחרת ב-R גדול שני
       הקטבים תמיד בפנים והתשובה "0" הייתה חוזרת ברוב ההגרלות. */
    var a4,b4,R4,t4=0,inA,inB,lo,hi,cs4=pick(["one","one","both","none"]);
    do{
      a4=rnz(-6,6);b4=rnz(-6,6);
      lo=Math.min(Math.abs(a4),Math.abs(b4));hi=Math.max(Math.abs(a4),Math.abs(b4));
      R4=cs4==="one"?(hi-lo>=2?ri(lo+1,hi-1):0):cs4==="both"?hi+ri(1,3):(lo>=2?ri(1,lo-1):0);
    }while(t4++<200&&(Math.abs(a4-b4)<2||R4===0||Math.abs(a4)===R4||Math.abs(b4)===R4));
    if(R4===0)R4=hi+1;
    inA=Math.abs(a4)<R4;inB=Math.abs(b4)<R4;
    var V0="0",V1=piI(fr(2,a4-b4)),V2=piI(fr(2,b4-a4)),V3=piI(fr(4,a4-b4));
    var A4=(inA===inB)?V0:(inA?V1:V2);
    var W0=_("סכום השאריות מתאפס רק כאשר שני הקטבים בתוך המסלול. כאן רק אחד מהם בפנים."),
        WA=_f("זו השארית בקוטב z = {0} בלבד. קודם בודקים אילו קטבים נמצאים בתוך המסלול, ומסכמים רק אותם.", num(a4)),
        WB=_f("זו השארית בקוטב z = {0} בלבד. קודם בודקים אילו קטבים נמצאים בתוך המסלול, ומסכמים רק אותם.", num(b4)),
        WD=_("סכמתם את שתי השאריות באותו סימן. השארית באחד הקטבים היא 1 חלקי (a − b) ובשני 1 חלקי (b − a) — הן הופכיות בסימן.");
    var WR4=[];
    if(A4!==V0)WR4.push(W(V0,W0));
    if(A4!==V1)WR4.push(W(V1,WA));
    if(A4!==V2)WR4.push(W(V2,WB));
    WR4.push(W(V3,WD));
    return {ask:_f("חשבו את האינטגרל על המעגל |z| = {0}", num(R4)),
      expr:"∮ "+frac("dz","(z"+sgn(-a4)+")(z"+sgn(-b4)+")"),
      ans:W(A4),
      wrong:WR4.slice(0,3),
      steps:[
        S(_("מאתרים את הקטבים"),_("שני גורמים לינאריים במכנה, ולכן שני קטבים פשוטים."),"z = "+num(a4)+"   ,   z = "+num(b4)),
        S(_("מי מהם בתוך המסלול"),_f("משווים את המרחק מהראשית לרדיוס {0}.", num(R4)),
          num(Math.abs(a4))+(inA?" < ":" > ")+num(R4)+"   ,   "+num(Math.abs(b4))+(inB?" < ":" > ")+num(R4)),
        S(_("השאריות"),_("מוחקים את הגורם של הקוטב ומציבים בו את השאר."),
          "Res = "+fr(1,a4-b4).html()+"   ,   Res = "+fr(1,b4-a4).html()),
        S(_("משפט השאריות"),(inA&&inB)?_("שתי השאריות הופכיות בסימן וסכומן אפס, ולכן האינטגרל מתאפס."):(!inA&&!inB)?_("אין קטבים בתוך המסלול, ולכן הסכום ריק."):_("מכפילים ב-2πi את השארית היחידה שבתוך המסלול."),A4)
      ],rule:"restheo",hint:_("קודם מאתרים את הקטבים ומכריעים מי מהם בפנים, ורק אז מחשבים שאריות ומסכמים.")};
  }
  /* L3 — משפט השאריות על מסלול סגור */
  /* המונה היה תמיד dz, ולכן התוצאה הייתה תמיד 2πi או 0 ושני המסיחים
     האחרים לא היו התשובה אף פעם. עכשיו מוגרל מקדם בפני האינטגרל,
     והשארית היא המקדם עצמו — כך ש-πi ו-4πi הן תוצאות אמיתיות. */
  a=rnz(-6,6);var R=ri(1,7);
  /* |a| = R מציב את הקוטב על המסלול עצמו, ואז האינטגרל אינו מוגדר
     כלל — לא 0 ולא 2πi. הרמה הרביעית כבר שומרת על כך; כאן זה חסר,
     ובערך אחד מכל שבעה יצאה שאלה בלי תשובה נכונה. */
  while(Math.abs(a)===R)R=ri(1,7);
  var inside=Math.abs(a)<R;
  var cn=pick([1,1,2,"half"]);
  var den3="z"+sgn(-a);
  var valTxt=(cn===1)?"2πi":(cn===2)?"4πi":"πi";
  var resTxt=(cn===1)?"1":(cn===2)?"2":fr(1,2).html();
  var ex3r=(cn===1)?frac("dz",den3):(cn===2)?frac("2 dz",den3):frac("dz","2("+den3+")");
  var ansR=inside?valTxt:"0";
  var others=["2πi","4πi","πi"].filter(function(v){return v!==valTxt});
  return {ask:_f("חשבו את האינטגרל על המעגל |z| = {0}", num(R)),
    expr:"∮ "+ex3r,
    ans:W(ansR),
    wrong:[
      W(inside?"0":valTxt,
        _f("הקוטב נמצא ב-{0}, והמרחק שלו מהראשית הוא {1}. משווים אותו לרדיוס.", num(a), num(Math.abs(a)))),
      W("2π",_("חסר ה-i. משפט השאריות נותן 2πi כפול סכום השאריות.")),
      W(pick(others),_("המקדם הקבוע שבמונה הוא בדיוק השארית, והוא מוכפל ב-2πi. בדקו אותו שוב."))
    ],
    steps:[
      S(_("איפה הקוטב"),"","z = "+num(a)+"   ,   |z| = "+num(Math.abs(a))),
      S(_("האם הוא בפנים"),_("משווים את מרחקו מהראשית לרדיוס המסלול."),
        num(Math.abs(a))+(inside?" < ":" > ")+num(R)),
      S(_("מהי השארית בקוטב"),_("הקוטב פשוט, והמונה קבוע — ולכן השארית היא המקדם עצמו."),"Res = "+resTxt),
      S(_("משפט השאריות"),_("2πi כפול סכום השאריות שבתוך המסלול. קוטב מחוץ למסלול אינו נספר."),
        inside?("2πi · "+resTxt+" = "+valTxt):("2πi · 0 = 0"))
    ],rule:"restheo",hint:_("סופרים רק קטבים שבתוך המסלול, ומכפילים את סכום השאריות ב-2πi.")};
}
