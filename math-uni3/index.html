/* ---------- 9. אריתמטיקה מודולרית ---------- */
function genModAr(L){
  var a,b,n,k;
  if(L===1){
    var r,atry=0;
    do{ n=ri(5,12);a=ri(20,99); r=a%n; }
    while(atry++<80&&(r===0||r===1||new Set([r,Math.floor(a/n),n-r,a-n]).size<4));
    return {ask:_f("מהו {0} מודולו {1}?", num(a), num(n)),
      expr:num(a)+" mod "+num(n)+" = ?",
      ans:W(num(r)),
      wrong:[
        W(num(Math.floor(a/n)),_("זו המנה השלמה, לא השארית. מודולו מחזיר את מה שנשאר.")),
        W(num(n-r),_("זו השארית המשלימה. מחסרים כפולות של n עד שנשארים בין 0 ל-n פחות 1.")),
        W(num(a-n),_("חיסרתם פעם אחת בלבד. ממשיכים עד שהתוצאה קטנה מ-n."))
      ],
      steps:[
        S(_("כמה פעמים n נכנס"),"",num(n)+" · "+num(Math.floor(a/n))+" = "+num(n*Math.floor(a/n))),
        S(_("מה נשאר"),"",num(a)+" − "+num(n*Math.floor(a/n))+" = "+num(r)),
        S(_("בודקים תחום"),_("השארית תמיד בין 0 ל-n פחות 1."),"0 ≤ "+num(r)+" < "+num(n))
      ],rule:"mod",hint:_("מודולו הוא מה שנשאר אחרי שמורידים את כל הכפולות של n.")};
  }
  if(L===2){
    /* a שהוא כפולה של n היה מאפס כל מכפלה, ולכן מגרילים את שניהם מחדש */
    var pr,ptry=0;
    do{ n=ri(5,11);a=ri(4,20);b=ri(4,20); pr=(a*b)%n; }
    while(ptry++<80&&(pr===0||new Set([pr,(a%n)*(b%n),(a+b)%n,a*b]).size<4));
    return {ask:_f("חשבו {0} · {1} מודולו {2}", num(a), num(b), num(n)),
      expr:num(a)+" · "+num(b)+" (mod "+num(n)+")",
      ans:W(num(pr)),
      wrong:[
        W(num((a%n)*(b%n)),_("צמצמתם כל גורם, אבל שכחתם לצמצם את המכפלה שהתקבלה.")),
        W(num((a+b)%n),_("חיברתם במקום להכפיל.")),
        W(num(a*b),_("זו המכפלה עצמה, בלי לקחת מודולו."))
      ],
      steps:[
        S(_("מצמצמים כל גורם"),_("אפשר לצמצם לפני ההכפלה — זה מקצר את החשבון."),
          num(a)+" ≡ "+num(a%n)+"   ,   "+num(b)+" ≡ "+num(b%n)),
        S(_("מכפילים"),"",num(a%n)+" · "+num(b%n)+" = "+num((a%n)*(b%n))),
        S(_("מצמצמים שוב"),_("זה השלב שהכי הרבה שוכחים."),num((a%n)*(b%n))+" ≡ "+num(pr))
      ],rule:"mod",hint:_("אפשר לצמצם לפני ההכפלה, אבל חייבים לצמצם גם אחריה.")};
  }
  /* L3 — חזקה מודולרית */
  var pw,w1,w2,w3,i,mtry=0;
  do{
    n=pick([5,7,11,13]);a=ri(2,n-1);k=ri(3,12);
    pw=1;for(i=0;i<k;i++)pw=(pw*a)%n;
    w1=(a*k)%n; w2=(a+k)%n; w3=(pw+1)%n;
  }while(mtry++<60&&(new Set([pw,w1,w2,w3]).size<4));
  return {ask:_f("חשבו {0} בחזקת {1} מודולו {2}", num(a), num(k), num(n)),
    expr:num(a)+"<sup>"+num(k)+"</sup> (mod "+num(n)+")",
    ans:W(num(pw)),
    wrong:[
      W(num(w1),_("הכפלתם בחזקה במקום להעלות בה.")),
      W(num(w2),_("חיבור אינו קשור כאן. מעלים בחזקה ומצמצמים בכל שלב.")),
      W(num(w3),_("טעות של אחד. כדאי לחשב בריבועים חוזרים ולבדוק כל שלב."))
    ],
    steps:[
      S(_("מצמצמים בכל שלב"),_("לא מחשבים את החזקה השלמה — היא ענקית. מצמצמים תוך כדי."),
        num(a)+"² ≡ "+num((a*a)%n)),
      S(_("ריבועים חוזרים"),_("כל הכפלה מלווה בצמצום, ולכן המספרים נשארים קטנים."),
        num(a)+"<sup>4</sup> ≡ "+num((((a*a)%n)*((a*a)%n))%n)),
      S(_("התוצאה"),_("משפט פרמה הקטן מקצר עוד: a בחזקת p פחות 1 שקול ל-1."),num(pw))
    ],rule:"modpow",hint:_("מצמצמים אחרי כל הכפלה. אחרת המספרים גדלים בלי צורך.")};
}

/* ---------- 10. חבורות וסדר של איבר ---------- */
function genGroup(L){
  var n,k;
  if(L===1){
    /* n חייב להיות פריק: בחבורה מסדר ראשוני לכל איבר שאינו אפס הסדר הוא n */
    n=pick([6,8,10,12,14,15,16,18]);   /* ב-9 אין איבר שסדרו נותן ארבע אפשרויות שונות */
    var cand=[],ci,oi,gi;
    for(ci=2;ci<n;ci++){
      gi=gcd(n,ci);oi=n/gi;
      if(oi>1&&oi<n&&new Set([oi,n,ci,gi]).size===4)cand.push(ci);
    }
    if(!cand.length)cand=[2];
    k=pick(cand);
    var g=gcd(n,k), ordv=n/g;
    return {ask:_f("מהו הסדר של האיבר {0} בחבורה (Z<sub>{1}</sub> , +)?", num(k), num(n)),
      expr:"ord("+num(k)+") ב-Z<sub>"+num(n)+"</sub>",
      ans:W(num(ordv)),
      wrong:[
        W(num(n),_("זה סדר החבורה כולה. הוא הסדר של יוצר, ולא של כל איבר.")),
        W(num(k),_("הסדר אינו האיבר עצמו. הוא מספר הפעמים שצריך לחבר אותו לעצמו כדי לקבל אפס.")),
        W(num(g),_("זה המחלק המשותף המרבי. הסדר הוא n מחולק בו, ולא הוא עצמו."))
      ],
      steps:[
        S(_("מה זה סדר"),_("המספר הקטן ביותר של פעמים שצריך לחבר את האיבר לעצמו כדי להגיע לאפס."),
          "m·"+num(k)+" ≡ 0 (mod "+num(n)+")"),
        S(_("הנוסחה"),_("הסדר הוא n חלקי המחלק המשותף המרבי של n ושל האיבר."),
          "gcd("+num(n)+" , "+num(k)+") = "+num(g)),
        S(_("מחשבים"),"",frac(num(n),num(g))+" = "+num(ordv))
      ],rule:"order",hint:_("הסדר של k ב-Z_n הוא n חלקי gcd(n , k).")};
  }
  if(L===2){
    var ph,ftry=0;
    do{ n=ri(6,18); ph=phi(n); }
    while(ftry++<60&&new Set([ph,n,1,divisors(n).length]).size<4);
    return {ask:_f("כמה יוצרים יש לחבורה הציקלית Z<sub>{0}</sub>?", num(n)),
      expr:"Z<sub>"+num(n)+"</sub>",
      ans:W(num(ph)),
      wrong:[
        W(num(n),_("לא כל איבר הוא יוצר. יוצר הוא איבר שסדרו שווה לסדר החבורה.")),
        W("1",_("היוצר אינו יחיד. גם 1 וגם n פחות 1 הם יוצרים, ולרוב יש עוד.")),
        W(num(divisors(n).length),_("זה מספר תת־החבורות, לא מספר היוצרים."))
      ],
      steps:[
        S(_("מי הוא יוצר"),_("איבר k הוא יוצר אם ורק אם הוא זר ל-n."),"gcd(k , "+num(n)+") = 1"),
        S(_("סופרים"),_("זו בדיוק פונקציית אוילר."),"φ("+num(n)+")"),
        S(_("התוצאה"),"","φ("+num(n)+") = "+num(ph))
      ],rule:"cyclic",hint:_("מספר היוצרים של Z_n הוא φ(n) — כמה מספרים קטנים מ-n זרים לו.")};
  }
  /* L3 — סדר של איבר בחבורת ההפיכים */
  /* בונים מראש את כל האיברים ההפיכים שסדרם נותן ארבע אפשרויות שונות */
  var a,ord3,cur,ok3,ai,pool3=[];
  n=pick([7,9,11,13,14]);
  for(ai=2;ai<n;ai++){
    if(gcd(ai,n)!==1)continue;
    cur=ai%n;ok3=1;
    while(cur!==1&&ok3<200){cur=(cur*ai)%n;ok3++}
    if(ok3>1&&new Set([ok3,phi(n),n,ai]).size===4)pool3.push([ai,ok3]);
  }
  if(!pool3.length)pool3=[[n-1,2]];
  var pair3=pick(pool3);
  a=pair3[0];ord3=pair3[1];
  return {ask:_f("מהו הסדר של האיבר {0} בחבורת ההפיכים U({1})?", num(a), num(n)),
    expr:"ord("+num(a)+") ב-U("+num(n)+")",
    ans:W(num(ord3)),
    wrong:[
      W(num(phi(n)),_("זה סדר החבורה כולה. סדר האיבר מחלק אותו, אבל אינו חייב להיות שווה לו.")),
      W(num(n),_("סדר U(n) הוא φ(n) ולא n. רק ההפיכים נספרים.")),
      W(num(a),_("הסדר אינו האיבר עצמו."))
    ],
    steps:[
      S(_("מעלים בחזקות"),_("מחשבים חזקות עוקבות מודולו n עד שמגיעים ל-1."),
        num(a)+"² ≡ "+num((a*a)%n)),
      S(_("עוצרים ב-1"),_("החזקה הראשונה שנותנת 1 היא הסדר."),num(a)+"<sup>"+num(ord3)+"</sup> ≡ 1"),
      S(_("בדיקה"),_f("לפי לגראנז׳ הסדר חייב לחלק את |U({0})| = {1}.", num(n), num(phi(n))),
        num(phi(n))+" ÷ "+num(ord3)+" = "+num(phi(n)/ord3))
    ],rule:"order",hint:_("מעלים בחזקות מודולו n עד שמתקבל 1. מספר הצעדים הוא הסדר.")};
}

/* ---------- 11. משפט לגראנז׳ ותת־חבורות ---------- */
function genLagr3(L){
  var n,d;
  if(L===1){
    n=pick([12,18,20,24,30]);
    var notd=[];
    for(var i=2;i<n;i++)if(n%i!==0)notd.push(i);
    d=pick(notd);
    return {ask:_f("|G| = {0}. האם יכולה להיות ל-G תת־חבורה מסדר {1}?", num(n), num(d)),
      expr:"|G| = "+num(n)+"   ,   |H| = "+num(d)+" ?",
      ans:W(_("לא")),
      wrong:[
        W(_("כן"),_f("{0} אינו מחלק את {1}, ולכן לפי לגראנז׳ אין תת־חבורה כזאת.", num(d), num(n))),
        W(_("רק אם G אבלית"),_("משפט לגראנז׳ אינו דורש חילופיות. הוא נכון בכל חבורה סופית.")),
        W(_("אי אפשר לקבוע"),_("אפשר בהחלט: בודקים חלוקה, וזה מכריע לשלילה."))
      ],
      steps:[
        S(_("משפט לגראנז׳"),_("סדר תת־חבורה מחלק תמיד את סדר החבורה."),"|H| ∣ |G|"),
        S(_("בודקים חלוקה"),"",num(n)+" ÷ "+num(d)+" = "+num(r2(n/d))),
        S(_("מסקנה"),_("החלוקה אינה שלמה, ולכן תת־חבורה כזאת אינה יכולה להתקיים."),_("לא"))
      ],rule:"lagrange3",hint:_("לגראנז׳ שולל מיד כל סדר שאינו מחלק. הוא אינו מבטיח קיום בכיוון השני.")};
  }
  if(L===2){
    n=pick([12,18,20,24,30,36]);
    var ds=divisors(n).filter(function(x){
      return x>1&&x<n&&new Set([n/x,x,n,n-x]).size===4;
    });
    if(!ds.length)ds=[2];
    d=pick(ds);
    return {ask:_f("|G| = {0} ו-|H| = {1}. מהו האינדקס [G:H]?", num(n), num(d)),
      expr:"[G : H] = ?",
      ans:W(num(n/d)),
      wrong:[
        W(num(d),_("זה סדר תת־החבורה. האינדקס הוא כמה מחלקות שמאליות יש.")),
        W(num(n),_("זה סדר החבורה. מחלקים אותו בסדר תת־החבורה.")),
        W(num(n-d),_("האינדקס הוא מנה ולא הפרש."))
      ],
      steps:[
        S(_("מה זה אינדקס"),_("מספר המחלקות השמאליות של H ב-G. הן מכסות את G בלי חפיפה."),"[G:H]"),
        S(_("הנוסחה"),"","[G:H] = "+frac("|G|","|H|")),
        S(_("מציבים"),_("זה בדיוק ניסוח אחר של משפט לגראנז׳."),frac(num(n),num(d))+" = "+num(n/d))
      ],rule:"lagrange3",hint:_("אינדקס = סדר החבורה חלקי סדר תת־החבורה.")};
  }
  /* L3 — חבורה מסדר ראשוני */
  var p=pick([5,7,11,13,17,19]);
  return {ask:_f("|G| = {0}, מספר ראשוני. כמה תת־חבורות יש ל-G?", num(p)),
    expr:"|G| = "+num(p)+"   ,   "+num(p)+" "+_("ראשוני"),
    ans:W("2"),
    wrong:[
      W(num(p),_("מספר תת־החבורות נקבע לפי המחלקים של הסדר, ולא לפי הסדר עצמו.")),
      W("1",_("יש תמיד לפחות שתיים: תת־החבורה הטריוויאלית והחבורה כולה.")),
      W(num(p+1),_("סופרים מחלקים: לראשוני יש בדיוק שניים, 1 והוא עצמו."))
    ],
    steps:[
      S(_("לגראנז׳ מגביל"),_("סדר כל תת־חבורה מחלק את סדר החבורה."),"|H| ∣ "+num(p)),
      S(_("מחלקי ראשוני"),_("למספר ראשוני יש בדיוק שני מחלקים."),"1 , "+num(p)),
      S(_("מסקנה"),_("מכאן גם נובע שכל חבורה מסדר ראשוני היא ציקלית."),"2")
    ],rule:"lagrange3",hint:_("לחבורה מסדר ראשוני יש רק את שתי תת־החבורות הטריוויאליות.")};
}

/* ---------- 12. תמורות ---------- */
function genPerm(L){
  var k,p,q;
  if(L===1){
    k=ri(4,7);   /* באורך 3 היה k−1 שווה למסיח ״2״ */
    var cyc="(1 2";for(var i=3;i<=k;i++)cyc+=" "+i;cyc+=")";
    return {ask:_f("מהו הסדר של המחזור באורך {0}?", num(k)),
      expr:"σ = "+cyc,
      ans:W(num(k)),
      wrong:[
        W(num(k-1),_("אורך המחזור נספר לפי מספר האיברים בו, לא לפי מספר החילופים.")),
        W("2",_("סדר 2 יש לחילוף בלבד — מחזור באורך שתיים.")),
        W(num(fact(k)),_("זה גודל חבורת התמורות כולה, לא הסדר של התמורה הזאת."))
      ],
      steps:[
        S(_("מה עושה המחזור"),_("כל הפעלה מזיזה כל איבר צעד אחד קדימה בתוך המחזור."),""),
        S(_("מתי חוזרים להתחלה"),_f("אחרי {0} הפעלות כל איבר השלים סיבוב שלם.", num(k)),
          "σ<sup>"+num(k)+"</sup> = id"),
        S(_("מסקנה"),"","ord(σ) = "+num(k))
      ],rule:"perm",hint:_("הסדר של מחזור שווה לאורכו.")};
  }
  if(L===2){
    /* אורכים זרים היו נותנים lcm = מכפלה, ואורך שמחלק את השני היה נותן
       lcm = המקסימום. בשני המקרים אחד המסיחים הופך לתשובה. */
    var lp=pick([[4,6],[6,4],[6,8],[8,6],[6,9],[9,6],[4,10],[10,4],[6,10],[10,6]]);
    p=lp[0];q=lp[1];
    var c1="(1 2";for(var j=3;j<=p;j++)c1+=" "+j;c1+=")";
    var c2="("+(p+1)+" "+(p+2);for(var m=3;m<=q;m++)c2+=" "+(p+m);c2+=")";
    return {ask:_("מהו הסדר של התמורה?"),
      expr:"σ = "+c1+c2,
      ans:W(num(lcm(p,q))),
      wrong:[
        W(num(p*q),_("מכפלה נכונה רק כשהאורכים זרים. בכלל לוקחים כפולה משותפת מינימלית.")),
        W(num(p+q),_("סכום האורכים אינו קשור. שני המחזורים פועלים במקביל.")),
        W(num(Math.max(p,q)),_("המחזור הארוך לבדו אינו מספיק — גם הקצר חייב לחזור להתחלה."))
      ],
      steps:[
        S(_("מחזורים זרים"),_("הם פועלים על איברים שונים, ולכן אינם מפריעים זה לזה."),
          _("אורכים")+": "+num(p)+" , "+num(q)),
        S(_("מתי שניהם באפס"),_("צריך מספר הפעלות שמתחלק בשני האורכים."),
          "lcm("+num(p)+" , "+num(q)+")"),
        S(_("מחשבים"),"",num(lcm(p,q)))
      ],rule:"perm",hint:_("סדר של מכפלת מחזורים זרים הוא הכפולה המשותפת המינימלית של אורכיהם.")};
  }
  /* L3 — סימן התמורה */
  k=ri(3,7);
  var even=(k-1)%2===0;
  return {ask:_f("מהי הזוגיות של מחזור באורך {0}?", num(k)),
    expr:"σ = "+_("מחזור באורך")+" "+num(k),
    ans:W(even?_("זוגית"):_("אי־זוגית")),
    wrong:[
      W(even?_("אי־זוגית"):_("זוגית"),
        _("מחזור באורך k מתפרק ל-k פחות 1 חילופים. הזוגיות נקבעת לפי המספר הזה.")),
      W(_("תלוי באיברים"),_("הזוגיות תלויה רק באורך המחזור, ולא בזהות האיברים שבו.")),
      W(_("אין לה זוגיות"),_("לכל תמורה יש סימן מוגדר היטב, פלוס או מינוס אחד."))
    ],
    steps:[
      S(_("מפרקים לחילופים"),_("מחזור באורך k הוא מכפלה של k פחות 1 חילופים."),
        num(k)+" − 1 = "+num(k-1)),
      S(_("סופרים"),_("סימן התמורה הוא מינוס אחד בחזקת מספר החילופים."),
        "sgn = (−1)<sup>"+num(k-1)+"</sup> = "+(even?"+1":"−1")),
      S(_("מסקנה"),_("מחזור באורך אי־זוגי הוא תמורה זוגית — וזה הפוך ממה שנדמה."),
        even?_("זוגית"):_("אי־זוגית"))
    ],rule:"sign",hint:_("מחזור באורך k מתפרק ל-k−1 חילופים, והזוגיות נקבעת לפי המספר הזה.")};
}

/* ============================================================
   מחוללי השאלות — אנליזה נומרית
   ============================================================ */

/* ---------- 13. שגיאה מוחלטת ויחסית ---------- */
function genErr(L){
  var ex,ap,k;
  if(L===1){
    ex=ri(20,200);ap=ex+ri(1,9);   /* קירוב גדול מהמדויק, כדי שההפרש בלי ערך מוחלט יהיה שלילי */
    return {ask:_f("הערך המדויק הוא {0} והקירוב הוא {1}. מהי השגיאה המוחלטת?", num(ex), num(ap)),
      expr:"|"+_("מדויק")+" − "+_("קירוב")+"| = ?",
      ans:W(num(Math.abs(ex-ap))),
      wrong:[
        W(num(ex-ap),_("השגיאה המוחלטת אינה שלילית. לוקחים ערך מוחלט.")),
        W(num(r2(Math.abs(ex-ap)/ex)),_("זו השגיאה היחסית. המוחלטת היא ההפרש עצמו.")),
        W(num(ex+ap),_("מחסרים, לא מחברים."))
      ],
      steps:[
        S(_("ההגדרה"),_("כמה רחוק הקירוב מהערך האמיתי, ביחידות של הגודל עצמו."),"E = |x − x̃|"),
        S(_("מציבים"),"","|"+num(ex)+" − "+num(ap)+"|"),
        S(_("ערך מוחלט"),_("הכיוון אינו מעניין — רק המרחק."),num(Math.abs(ex-ap)))
      ],rule:"err",hint:_("שגיאה מוחלטת היא ההפרש בערך מוחלט, ביחידות של הגודל עצמו.")};
  }
  if(L===2){
    var dd,rel,etry=0;
    do{
      ex=pick([20,25,40,50,80,200]);   /* 100 היה נותן שגיאה יחסית ששווה למוחלטת */
      dd=pick([1,2,4,5]);
      ap=ex+pick([1,-1])*dd;
      rel=r2(100*dd/ex);
    }while(etry++<60&&new Set([rel,dd,r2(100*dd/ap),r2(dd/ex)]).size<4);
    return {ask:_f("הערך המדויק הוא {0} והקירוב הוא {1}. מהי השגיאה היחסית באחוזים?", num(ex), num(ap)),
      expr:frac("|x − x̃|","|x|")+" · 100% = ?",
      ans:W(num(rel)+"%"),
      wrong:[
        W(num(dd)+"%",_("זו השגיאה המוחלטת. היחסית מחלקת אותה בערך המדויק.")),
        W(num(r2(100*dd/ap))+"%",_("חילקתם בקירוב במקום בערך המדויק. זו טעות קטנה, אבל היא טעות.")),
        W(num(r2(dd/ex))+"%",_("שכחתם להכפיל ב-100. זה השבר ולא האחוז."))
      ],
      steps:[
        S(_("השגיאה המוחלטת"),"","|"+num(ex)+" − "+num(ap)+"| = "+num(dd)),
        S(_("מחלקים בערך המדויק"),_("כך השגיאה נמדדת ביחס לגודל, וניתן להשוות בין גדלים שונים."),
          frac(num(dd),num(ex))),
        S(_("לאחוזים"),"",num(rel)+"%")
      ],rule:"err",hint:_("שגיאה יחסית = מוחלטת חלקי הערך המדויק. היא חסרת יחידות.")};
  }
  /* L3 — חסם שגיאת עיגול */
  k=ri(1,5);
  var bound=Math.pow(10,-k)/2;
  return {ask:_f("מעגלים מספר ל-{0} ספרות אחרי הנקודה. מהו חסם שגיאת העיגול?", num(k)),
    expr:"|x − x̃| ≤ ?",
    ans:W(num(r2(bound*1000000)/1000000)),
    wrong:[
      W(num(Math.pow(10,-k)),_("זהו המרווח בין שני ערכים אפשריים. העיגול מקרב לקרוב, ולכן החסם הוא חצי ממנו.")),
      W(num(Math.pow(10,-k)*2),_("הכפלתם במקום לחלק. עיגול מקטין שגיאה, לא מגדיל.")),
      W(num(k),_("זה מספר הספרות, לא החסם."))
    ],
    steps:[
      S(_("המרווח בין ערכים"),_f("עם {0} ספרות אחרי הנקודה המרווח הוא 10 בחזקת מינוס {0}.", num(k)),
        "Δ = 10<sup>−"+num(k)+"</sup>"),
      S(_("עיגול לקרוב"),_("מספר לעולם אינו רחוק יותר מחצי מרווח מהערך המעוגל הקרוב אליו."),"E ≤ Δ ÷ 2"),
      S(_("החסם"),"","0.5 · 10<sup>−"+num(k)+"</sup> = "+num(r2(bound*1000000)/1000000))
    ],rule:"round",hint:_("חסם שגיאת עיגול הוא חצי מהמרווח בין שני ערכים סמוכים.")};
}

/* ---------- 14. חצייה וניוטון ---------- */
function genNewton(L){
  var a,b,c,x0;
  if(L===1){
    var btry=0;
    do{ a=ri(0,4);b=a+pick([2,4,6]); }
    while(btry++<40&&new Set([(a+b)/2,a,b,b-a]).size<4);
    return {ask:_("בשיטת החצייה, מהי נקודת האמצע הראשונה?"),
      expr:"f("+num(a)+") < 0 < f("+num(b)+")   ,   ["+num(a)+" , "+num(b)+"]",
      ans:W(num((a+b)/2)),
      wrong:[
        W(num(a),_("זה קצה שמאלי, לא אמצע.")),
        W(num(b),_("זה הקצה הימני.")),
        W(num(b-a),_("זה אורך הקטע, לא נקודה בתוכו."))
      ],
      steps:[
        S(_("למה זה עובד"),_("הפונקציה מחליפה סימן בין הקצוות, ולכן לפי משפט ערך הביניים יש שורש בפנים."),""),
        S(_("חוצים"),"",frac(num(a)+" + "+num(b),"2")+" = "+num((a+b)/2)),
        S(_("ממשיכים"),_("בודקים את סימן הפונקציה באמצע, ובוחרים את החצי שבו הסימן עדיין מתחלף."),"")
      ],rule:"bisect",hint:_("חצייה: לוקחים אמצע, בודקים סימן, וממשיכים בחצי שבו יש חילוף סימן.")};
  }
  if(L===2){
    c=pick([2,3,5,7,10]);x0=ri(1,4);
    /* ניוטון על x² − c: x₁ = (x₀² + c) ÷ (2x₀) */
    var x1=fr(x0*x0+c,2*x0);
    return {ask:_f("שיטת ניוטון עבור f(x) = x² − {0} עם x₀ = {1}. מהו x₁?", num(c), num(x0)),
      expr:"x<sub>1</sub> = x<sub>0</sub> − "+frac("f(x<sub>0</sub>)","f′(x<sub>0</sub>)"),
      ans:W(x1.html()),
      wrong:[
        W(fr(x0*x0-c,2*x0).html(),_("טעות סימן. מחסרים את f חלקי f תג, ו-f עצמו הוא x בריבוע פחות c.")),
        W(fr(x0*x0+c,x0).html(),_("שכחתם את ה-2 בנגזרת. הנגזרת של x בריבוע היא 2x.")),
        W(num(x0),_("זו נקודת ההתחלה. אחרי צעד אחד היא משתנה."))
      ],
      steps:[
        S(_("הנגזרת"),"","f′(x) = 2x   ⇒   f′("+num(x0)+") = "+num(2*x0)),
        S(_("מציבים בנוסחה"),"",num(x0)+" − "+frac(num(x0*x0-c),num(2*x0))),
        S(_("מפשטים"),_("זו בדיוק שיטת הרון לחישוב שורש: ממוצע של x ושל c חלקי x."),x1.html())
      ],rule:"newton",hint:_("x₁ = x₀ פחות f(x₀) חלקי f′(x₀). מחשבים קודם את הנגזרת.")};
  }
  /* L3 — ניוטון על שורש שלישי */
  c=pick([2,3,5,7]);x0=ri(1,3);
  var x1b=fr(2*x0*x0*x0+c,3*x0*x0);
  return {ask:_f("שיטת ניוטון עבור f(x) = x³ − {0} עם x₀ = {1}. מהו x₁?", num(c), num(x0)),
    expr:"x<sub>1</sub> = x<sub>0</sub> − "+frac("x<sub>0</sub>³ − "+num(c),"3x<sub>0</sub>²"),
    ans:W(x1b.html()),
    wrong:[
      W(fr(x0*x0*x0+c,3*x0*x0).html(),_("שכחתם שהחיסור משאיר 2x₀³ במונה, ולא x₀³.")),
      W(fr(2*x0*x0*x0-c,3*x0*x0).html(),_("טעות סימן. מינוס כפול מינוס c נותן פלוס c.")),
      W(fr(2*x0*x0*x0+c,x0*x0).html(),_("שכחתם את ה-3 בנגזרת. הנגזרת של x בשלישית היא 3x בריבוע."))
    ],
    steps:[
      S(_("הנגזרת"),"","f′(x) = 3x²   ⇒   f′("+num(x0)+") = "+num(3*x0*x0)),
      S(_("מציבים"),"",num(x0)+" − "+frac(num(x0*x0*x0-c),num(3*x0*x0))),
      S(_("מאחדים למכנה אחד"),_("המונה הופך ל-2x₀³ ועוד c — זו הצורה הכללית לשורש מסדר שלישי."),x1b.html())
    ],rule:"newton",hint:_("אותה נוסחה כמו קודם, רק שהנגזרת היא 3x בריבוע.")};
}

/* ---------- 15. אינטרפולציה ---------- */
function genInterp(L){
  var x0,x1,y0,y1,xq;
  if(L===1){
    var yq,itry=0;
    do{
      x0=ri(0,4);x1=x0+pick([2,4]);
      y0=ri(1,9);y1=y0+pick([2,4,6,8]);
      xq=(x0+x1)/2;yq=(y0+y1)/2;
    }while(itry++<40&&new Set([yq,y0,y1,y1-y0]).size<4);
    return {ask:_f("אינטרפולציה לינארית בין הנקודות. מהו הערך ב-x = {0}?", num(xq)),
      expr:"("+num(x0)+" , "+num(y0)+")   ,   ("+num(x1)+" , "+num(y1)+")",
      ans:W(num(yq)),
      wrong:[
        W(num(y0),_("זה הערך בקצה השמאלי. הנקודה המבוקשת באמצע.")),
        W(num(y1),_("זה הערך בקצה הימני.")),
        W(num(y1-y0),_("זה הפרש ערכי ה-y, לא ערך הפונקציה."))
      ],
      steps:[
        S(_("השיפוע"),"",frac(num(y1)+" − "+num(y0),num(x1)+" − "+num(x0))+" = "+num(r2((y1-y0)/(x1-x0)))),
        S(_("הישר"),"","y = "+num(y0)+" + "+num(r2((y1-y0)/(x1-x0)))+"(x − "+num(x0)+")"),
        S(_("מציבים"),_("באמצע הקטע מתקבל בדיוק ממוצע הערכים."),num(yq))
      ],rule:"interp",hint:_("אינטרפולציה לינארית היא פשוט הישר שעובר בשתי הנקודות.")};
  }
  if(L===2){
    var m,yq2,jtry=0;
    do{
      x0=ri(0,3);x1=x0+pick([2,5]);
      y0=ri(1,9);y1=y0+pick([3,6,9]);
      xq=x1+pick([1,2]);
      m=(y1-y0)/(x1-x0); yq2=y0+m*(xq-x0);
    }while(jtry++<40&&new Set([r2(yq2),y1,r2(y0+m*xq),r2((y0+y1)/2)]).size<4);
    return {ask:_f("מהו הערך שהישר נותן ב-x = {0}?", num(xq)),
      expr:"("+num(x0)+" , "+num(y0)+")   ,   ("+num(x1)+" , "+num(y1)+")",
      ans:W(num(r2(yq2))),
      wrong:[
        W(num(y1),_("זה הערך בנקודה האחרונה. הנקודה המבוקשת נמצאת מחוצה לה.")),
        W(num(r2(y0+m*xq)),_("שכחתם להחסיר את x₀. הישר נמדד מהנקודה הראשונה.")),
        W(num(r2((y0+y1)/2)),_("ממוצע מתאים רק לאמצע הקטע, וכאן הנקודה מחוץ לו."))
      ],
      steps:[
        S(_("השיפוע"),"","m = "+num(r2(m))),
        S(_("מציבים בישר"),"",num(y0)+" + "+num(r2(m))+"("+num(xq)+" − "+num(x0)+")"),
        S(_("שימו לב"),_("הנקודה מחוץ לקטע הנתון, ולכן זו אקסטרפולציה — והיא פחות אמינה."),num(r2(yq2)))
      ],rule:"interp",hint:_("אותו ישר, אבל מחוץ לקטע. זו אקסטרפולציה, והיא רגישה הרבה יותר.")};
  }
  /* L3 — מעלת פולינום האינטרפולציה */
  var np=ri(3,7);
  return {ask:_f("דרך {0} נקודות עם ערכי x שונים עובר פולינום אינטרפולציה יחיד. מהי מעלתו לכל היותר?", num(np)),
    expr:num(np)+" "+_("נקודות"),
    ans:W(num(np-1)),
    wrong:[
      W(num(np),_("מעלה n הייתה דורשת n ועוד 1 מקדמים, ואין מספיק משוואות.")),
      W(num(np+1),_("ככל שהמעלה גבוהה יותר צריך יותר נקודות, לא פחות.")),
      W("1",_("מעלה 1 מספיקה רק לשתי נקודות."))
    ],
    steps:[
      S(_("סופרים מקדמים"),_("פולינום ממעלה d נקבע על ידי d ועוד 1 מקדמים."),"d + 1"),
      S(_("סופרים משוואות"),_("כל נקודה נותנת משוואה אחת."),num(np)),
      S(_("משווים"),_("הפולינום יחיד, ומעלתו עשויה להיות נמוכה יותר אם הנקודות על ישר."),
        "d + 1 = "+num(np)+"   ⇒   d = "+num(np-1))
    ],rule:"interp",hint:_("n נקודות קובעות פולינום יחיד ממעלה n פחות 1 לכל היותר.")};
}

/* ---------- 16. אינטגרציה נומרית ---------- */
function genQuad(L){
  var a,b,f0,f1,f2,h;
  if(L===1){
    var tr,ttry=0;
    do{
      a=ri(0,3);b=a+pick([2,4]);
      f0=ri(1,9);f1=ri(1,9);
      tr=(b-a)*(f0+f1)/2;
    }while(ttry++<60&&(f0===f1||new Set([tr,(b-a)*(f0+f1),(f0+f1)/2,(b-a)*f0]).size<4));
    return {ask:_("חשבו את האינטגרל בשיטת הטרפז"),
      expr:"a = "+num(a)+" , b = "+num(b)+"   ,   f(a) = "+num(f0)+" , f(b) = "+num(f1),
      ans:W(num(tr)),
      wrong:[
        W(num((b-a)*(f0+f1)),_("שכחתם לחלק ב-2. שטח טרפז הוא סכום הבסיסים כפול הגובה חלקי שתיים.")),
        W(num((f0+f1)/2),_("שכחתם להכפיל ברוחב הקטע. זה רק הגובה הממוצע.")),
        W(num((b-a)*f0),_("השתמשתם רק בערך אחד. הטרפז לוקח את שני הקצוות."))
      ],
      steps:[
        S(_("מה מקרבים"),_("מחליפים את הגרף בקו ישר בין שני הקצוות, ומחשבים שטח טרפז."),""),
        S(_("הנוסחה"),"","(b − a) · "+frac("f(a) + f(b)","2")),
        S(_("מציבים"),"",num(b-a)+" · "+frac(num(f0+f1),"2")+" = "+num(tr))
      ],rule:"trap",hint:_("טרפז: רוחב הקטע כפול ממוצע ערכי הקצוות.")};
  }
  if(L===2){
    h=pick([1,2]);a=ri(0,3);
    f0=ri(1,9);f1=ri(1,9);f2=ri(1,9);
    var ct=h*(f0+2*f1+f2)/2;
    var wrongA=h*(f0+f1+f2)/2, wrongB=h*(f0+2*f1+f2), wrongC=h*(f0+4*f1+f2)/3;
    var qtry=0;
    while(qtry++<40&&new Set([ct,wrongA,wrongB,wrongC]).size<4){
      f0=ri(1,9);f1=ri(1,9);f2=ri(1,9);
      ct=h*(f0+2*f1+f2)/2;wrongA=h*(f0+f1+f2)/2;wrongB=h*(f0+2*f1+f2);wrongC=h*(f0+4*f1+f2)/3;
    }
    return {ask:_f("טרפז מורכב עם שני תת־קטעים ברוחב h = {0}. מהו הקירוב?", num(h)),
      expr:"f<sub>0</sub> = "+num(f0)+" , f<sub>1</sub> = "+num(f1)+" , f<sub>2</sub> = "+num(f2),
      ans:W(num(r2(ct))),
      wrong:[
        W(num(r2(wrongA)),_("הנקודה הפנימית נספרת פעמיים, כי היא קצה של שני טרפזים.")),
        W(num(r2(wrongB)),_("שכחתם לחלק ב-2.")),
        W(num(r2(wrongC)),_("זו נוסחת סימפסון, עם מקדם 4 וחלוקה ב-3."))
      ],
      steps:[
        S(_("מחברים שני טרפזים"),_("הקצה המשותף שייך לשניהם, ולכן מקדמו 2."),
          frac("h","2")+"( f<sub>0</sub> + 2f<sub>1</sub> + f<sub>2</sub> )"),
        S(_("מציבים"),"",frac(num(h),"2")+"( "+num(f0)+" + 2·"+num(f1)+" + "+num(f2)+" )"),
        S(_("מחשבים"),"",num(r2(ct)))
      ],rule:"trap",hint:_("בטרפז מורכב הנקודות הפנימיות מקבלות מקדם 2, והקצוות מקדם 1.")};
  }
  /* L3 — סימפסון */
  h=pick([1,2,3]);
  f0=ri(1,9);f1=ri(1,9);f2=ri(1,9);
  var si=h*(f0+4*f1+f2)/3;
  var s1=h*(f0+2*f1+f2)/2, s2=h*(f0+4*f1+f2), s3=h*(f0+4*f1+f2)/6;
  var stry=0;
  while(stry++<40&&new Set([si,s1,s2,s3]).size<4){
    f0=ri(1,9);f1=ri(1,9);f2=ri(1,9);
    si=h*(f0+4*f1+f2)/3;s1=h*(f0+2*f1+f2)/2;s2=h*(f0+4*f1+f2);s3=h*(f0+4*f1+f2)/6;
  }
  return {ask:_f("נוסחת סימפסון עם h = {0}. מהו הקירוב?", num(h)),
    expr:"f<sub>0</sub> = "+num(f0)+" , f<sub>1</sub> = "+num(f1)+" , f<sub>2</sub> = "+num(f2),
    ans:W(num(r2(si))),
    wrong:[
      W(num(r2(s1)),_("זו נוסחת הטרפז המורכב. סימפסון נותן מקדם 4 לנקודה האמצעית.")),
      W(num(r2(s2)),_("שכחתם לחלק ב-3.")),
      W(num(r2(s3)),_("חילקתם ב-6 במקום ב-3. סכום המקדמים הוא 6, והמכנה הוא 3."))
    ],
    steps:[
      S(_("מה מקרבים"),_("במקום ישר, מעבירים פרבולה דרך שלוש הנקודות."),""),
      S(_("הנוסחה"),_("סכום המקדמים הוא 6, וההכפלה ב-h חלקי 3 מחזירה את רוחב הקטע."),
        frac("h","3")+"( f<sub>0</sub> + 4f<sub>1</sub> + f<sub>2</sub> )"),
      S(_("מציבים"),_("סימפסון מדויק לחלוטין לכל פולינום עד מעלה שלישית."),
        frac(num(h),"3")+"( "+num(f0)+" + 4·"+num(f1)+" + "+num(f2)+" ) = "+num(r2(si)))
    ],rule:"simpson",hint:_("סימפסון: h חלקי 3, ומקדמים 1 , 4 , 1.")};
}

/* ============================================================
   12. בניית שאלה
   מנרמל את מה שהמחולל החזיר: מסנן מסיחים כפולים או פגומים,
   מערבב, ומכין גם טקסט להקראה.
   ============================================================ */
function badStr(s){return !s||/NaN|Infinity|undefined|null/.test(s)}

function buildQ(topicId,level){
  var t=topicById(topicId);
  if(!t)t=TOPICS[0];
  var raw=null,tries=0,opts=null,i,p,seen,ansP,best=null;
  /* מגרילים עד שיוצאות ארבע אפשרויות שונות. מסיח שיצא במקרה שווה
     לתשובה נעלם בסינון, והשאלה הייתה מציגה שלוש — קל מדי בלי סיבה.
     אם אחרי כמה ניסיונות עדיין לא, לוקחים את ההגרלה העשירה ביותר. */
  while(tries<12){
    tries++;
    try{raw=t.gen(level)}catch(e){raw=null}
    if(!raw||!raw.ans||badStr(plainOf(raw.ans.h)))continue;
    ansP=plainOf(raw.ans.h);
    seen={};seen[ansP]=1;
    opts=[{h:raw.ans.h,t:ansP,ok:true,why:""}];
    for(i=0;i<(raw.wrong||[]).length;i++){
      p=plainOf(raw.wrong[i].h);
      if(badStr(p)||seen[p])continue;
      seen[p]=1;
      opts.push({h:raw.wrong[i].h,t:p,ok:false,why:raw.wrong[i].why||""});
    }
    if(!best||opts.length>best.opts.length)best={raw:raw,opts:opts};
    if(opts.length>=4)break;
  }
  if(best){raw=best.raw;opts=best.opts}
  if(!raw)raw={ask:_("חשבו"),expr:"1 + 1",ans:W("2"),wrong:[W("1"),W("3"),W("11")],steps:[S(_("חיבור"),"","1 + 1 = 2")],hint:"",rule:"order"};
  if(!opts||opts.length<2){
    ansP=plainOf(raw.ans.h);
    opts=[{h:raw.ans.h,t:ansP,ok:true,why:""}];
  }
  shuffle(opts);
  var sayTxt=raw.ask+(raw.expr?". "+speakMath(plainOf(raw.expr)):"");
  return {
    topic:t.id,topicName:t.name,level:level,
    ask:raw.ask,expr:raw.expr||"",fig:raw.fig||"",
    options:opts,steps:raw.steps||[],hint:raw.hint||"",rule:raw.rule||"",
    say:sayTxt
  };
}

var P={list:[],i:0,q:null,phase:"ask",picked:[],hints:0,steps:0,usedHelp:false,results:[],startedAt:0};

function mastery(id){
  var m=state.mastery[id];
  if(!m){m={seen:0,ok:0,help:0,m:0};state.mastery[id]=m}
  return m;
}
function activeTopics(){
  var chosen=state.topics.filter(function(id){return !!topicById(id)});
  if(chosen.length)return chosen;
  return topicsForTrack(state.track).map(function(t){return t.id});
}
/* בחירת הנושא הבא: מי שחלש יותר מקבל יותר תורות, ומדי כמה
   שאלות חוזר נושא שנפלו בו קודם. ככה החזרה קורית לבד. */
function nextTopic(idx){
  var pool=activeTopics();
  if(idx>0&&idx%3===2&&state.wrongBank.length){
    var w=state.wrongBank[state.wrongBank.length-1-Math.floor(Math.random()*Math.min(5,state.wrongBank.length))];
    if(w&&pool.indexOf(w.topic)>=0)return w.topic;
  }
  var weights=pool.map(function(id){return 110-mastery(id).m}),total=0,i;
  for(i=0;i<weights.length;i++)total+=weights[i];
  var r=Math.random()*total;
  for(i=0;i<pool.length;i++){r-=weights[i];if(r<=0)return pool[i]}
  return pool[pool.length-1];
}
function startRound(forceTopic){
  var n=state.settings.roundLen,i;
  P.list=[];
  for(i=0;i<n;i++)P.list.push(forceTopic||nextTopic(i));
  P.i=0;P.results=[];P.startedAt=Date.now();
  loadQ();
}
function loadQ(){
  P.q=buildQ(P.list[P.i],state.level);
  P.phase="ask";P.picked=[];P.hints=0;P.steps=0;P.usedHelp=false;
  if(state.settings.autoSteps)P.steps=1;
}
function roundDone(){return P.i>=P.list.length}

/* השליטה בנושא נמדדת כממוצע נע של הביצועים האחרונים, ולא
   כמונה שמטפס לאט. תלמיד שענה נכון צריך לראות מספר שמשקף
   את זה מיד — אחרת המדד מתסכל במקום לעזור. */
function scoreAnswer(ok){
  var m=mastery(P.q.topic),d=dayRec(),score;
  m.seen++;d.a++;state.stats.answered++;
  touchDay();
  if(ok&&!P.usedHelp&&P.picked.length===1){
    m.ok++;d.c++;state.stats.correct++;state.stats.xp+=10;
    score=1;P.results.push("ok");
  }else if(ok&&!P.usedHelp){
    m.ok++;d.c++;state.stats.correct++;state.stats.xp+=4;
    score=0.7;P.results.push("ok");
  }else if(P.usedHelp){
    m.help++;state.stats.helped++;state.stats.xp+=2;
    score=0.35;P.results.push("hp");
  }else{
    score=0;P.results.push("no");
  }
  m.m=m.seen===1?Math.round(score*100):Math.round(m.m*0.6+score*40);
  if(!ok||P.usedHelp){
    state.wrongBank.push({topic:P.q.topic,ts:Date.now()});
    if(state.wrongBank.length>40)state.wrongBank.shift();
  }
  save();
}

    var shown=showAll?q.steps.length:Math.min(P.steps,q.steps.length);
    h+=_f("{0}{1}{2}{3} הפתרון, צעד אחר צעד</div>", '<div class="card pad rise ', topicCls(q.topic), '"><div class="spread"><div class="h2" style="color:var(--c)">', ic("steps",18))+
       (state.settings.tts?_f("{0}{1} הקראה</button>", '<button class="btn btn-g" style="padding:8px 12px;font-size:.85rem" data-a="readsteps">', ic("speaker",15)):"")+'</div>';
    h+='<div class="steps">'+q.steps.map(function(s,i){
      if(i>=shown)return "";
      return '<div class="step'+(i===q.steps.length-1?" last":"")+'"><div class="st"><span class="num">'+(i+1)+'</span>'+s.t+'</div>'+
        (s.d?'<div class="sd">'+s.d+'</div>':"")+
        (s.m?'<div class="mstep">'+s.m+'</div>':"")+'</div>';
    }).join("")+'</div>';
    if(!showAll&&shown<q.steps.length){
      h+='<button class="btn btn-p w" style="margin-top:12px" data-a="nextstep">'+_('הצעד הבא')+' '+ic("arrow",17)+'</button>';
      h+='<p class="sub xs" style="text-align:center;margin-top:8px">'+_('אפשר לעצור בכל שלב ולנסות להמשיך לבד.')+'</p>';
    }
    h+='</div>';
  }
  /* פס תחתון אחרי מענה */
  if(P.phase==="reveal"){
    var kind=P.results[P.results.length-1];
    h+='<div class="card pad rise" style="border-inline-start:4px solid var(--'+(kind==="ok"?"ok":kind==="hp"?"accent":"bad")+')">'+
       '<div class="row">'+ic(kind==="ok"?"check":"bulb",19)+'<b>'+lineFor(kind)+'</b></div>'+
       '<button class="btn btn-p w" style="margin-top:12px;padding:14px" data-a="next">'+
         (P.i+1>=P.list.length?_("לסיכום הסבב"):_("לשאלה הבאה"))+' '+ic("arrow",18)+'</button>'+
       (state.settings.keys?'<p class="sub xs" style="text-align:center;margin-top:8px">'+_('אפשר גם ללחוץ Enter')+'</p>':"")+
       '</div>';
  }
  h+='</div>';
  if(state.settings.keys&&P.phase==="ask")
    h+='<p class="sub xs" style="margin-top:14px;text-align:center">'+_('מקלדת: 1–4 תשובה · רווח הקראה · H רמז · S פתרון')+'</p>';
  return h+'</main>';
}

/* ---------- סיכום סבב ---------- */
function viewSummary(){
  var ok=P.results.filter(function(r){return r==="ok"}).length;
  var hp=P.results.filter(function(r){return r==="hp"}).length;
  var no=P.results.length-ok-hp;
  var pct=Math.round(ok/Math.max(1,P.results.length)*100);
  var byTopic={},i;
  for(i=0;i<P.list.length&&i<P.results.length;i++){
    var id=P.list[i];
    if(!byTopic[id])byTopic[id]={ok:0,n:0};
    byTopic[id].n++;if(P.results[i]==="ok")byTopic[id].ok++;
  }
  var worst=null;
  for(var k in byTopic)if(byTopic[k].n>=2&&(!worst||byTopic[k].ok/byTopic[k].n<byTopic[worst].ok/byTopic[worst].n))worst=k;
  var title=pct>=85?_("סבב חזק."):pct>=60?_("סבב טוב."):pct>=35?_("סבב עם עבודה."):_("סבב קשה — וזה בסדר.");
  var sub=pct>=85?_("אתם שולטים ברוב מה שתרגלתם כאן.")
       :pct>=60?_("רוב הדברים במקום. יש נקודה אחת או שתיים שכדאי לחדד.")
       :pct>=35?_("חלק מהחומר עוד לא יושב. זה בדיוק מה שמדידה כזאת נועדה להראות.")
       :_("סבב כזה לא אומר עליכם כלום חוץ מזה שהחומר הזה חדש. שווה לרדת רמה ולבנות מלמטה.");
  var h='<main id="main" class="wrap" style="padding-top:26px;padding-bottom:44px;max-width:760px">';
  h+='<div class="card pad rise"><h1 class="h1">'+title+'</h1><p class="sub">'+sub+'</p>'+
     '<div class="grid g4" style="margin-top:18px">'+
_f("{0}{1}</b><span>נכון לבד</span></div>", '<div class="tile" style="--c:var(--ok)"><b>', ok)+
_f("{0}{1}</b><span>עם פתרון מודרך</span></div>", '<div class="tile" style="--c:var(--c-alg)"><b>', hp)+
_f("{0}{1}</b><span>לא נפתרו</span></div>", '<div class="tile" style="--c:var(--bad)"><b>', no)+
_f("{0}{1}%</b><span>דיוק</span></div>", '<div class="tile" style="--c:var(--c-geo)"><b>', pct)+
     '</div>';
  h+='<hr class="sep"><div class="h2">'+_('לפי נושא')+'</div><div class="grid" style="margin-top:10px">'+
     Object.keys(byTopic).map(function(id){
       var b=byTopic[id],tp=topicById(id);
       return '<div class="spread '+topicCls(id)+'" style="gap:8px"><span class="arh">'+tp.name+'</span>'+
_f("{0}{1}{2}{3} מתוך {4}</span></div>", '<span class="chip ', (b.ok===b.n?"ok":b.ok===0?"bad":"warn"), '">', b.ok, b.n);
     }).join("")+'</div>';
  if(worst&&byTopic[worst].ok<byTopic[worst].n){
    var wt=topicById(worst);
    h+='<div class="card pad" style="margin-top:16px;background:var(--surface2)">'+
_f("{0}{1}<b>מה לקחת מכאן</b></div>", '<div class="row">', ic("target",17))+
_f("{0}{1} היה הנושא שהכי הפריע בסבב הזה. סבב ממוקד אחד בו יעשה יותר מעוד עשר שאלות מעורבות.</p>", '<p class="sub sm">', wt.name)+
_f("{0}{1}{2}{3} סבב ממוקד ב{4}</button></div>", '<button class="btn btn-p" style="margin-top:10px" data-a="starttopic" data-t="', worst, '">', ic("pencil",16), wt.name);
  }
  h+='<div class="row" style="margin-top:18px">'+
_f("{0}{1} סבב נוסף</button>", '<button class="btn btn-p" data-a="start">', ic("refresh",17))+
_f("{0}{1} לדף הבית</button>", '<button class="btn btn-g" data-a="go" data-v="home">', ic("home",17))+
_f("{0}{1} להתקדמות</button></div>", '<button class="btn btn-g" data-a="go" data-v="progress">', ic("chart",17));
  return h+'</div></main>';
}

/* ---------- התקדמות ---------- */
function viewProgress(){
  var st=state.stats;
  var acc=st.answered?Math.round(st.correct/st.answered*100):0;
  var days=[],i,d=new Date();
  for(i=13;i>=0;i--){
    var dd=new Date(d.getTime()-i*86400000);
    var key=dd.getFullYear()+"-"+String(dd.getMonth()+1).padStart(2,"0")+"-"+String(dd.getDate()).padStart(2,"0");
    days.push({k:key,r:state.days[key]||{a:0,c:0},lbl:_("אבגדהוש").charAt(dd.getDay())});
  }
  var maxA=Math.max.apply(null,days.map(function(x){return x.r.a}).concat([1]));
  var seen=TOPICS.filter(function(t){return mastery(t.id).seen>0});
  var h='<main id="main" class="wrap" style="padding-top:22px;padding-bottom:44px">';
  h+='<h1 class="h1">'+_('התקדמות')+'</h1><p class="sub">'+_('המספרים כאן הם כלי עבודה, לא ציון.')+'</p>';
  h+='<div class="grid g4" style="margin-top:16px">'+
_f("{0}{1}</b><span>שאלות שנפתרו</span></div>", '<div class="tile" style="--c:var(--c-base)"><b>', st.answered)+
_f("{0}{1}%</b><span>דיוק כולל</span></div>", '<div class="tile" style="--c:var(--ok)"><b>', acc)+
_f("{0}{1}</b><span>עם פתרון מודרך</span></div>", '<div class="tile" style="--c:var(--c-alg)"><b>', st.helped)+
_f("{0}{1}</b><span>נקודות</span></div></div>", '<div class="tile" style="--c:var(--c-geo)"><b>', st.xp);
  h+='<div class="card pad" style="margin-top:16px"><div class="h2">'+_('שבועיים אחרונים')+'</div>'+
     '<div style="display:flex;gap:5px;align-items:flex-end;height:120px;margin-top:14px;direction:ltr">'+
     days.map(function(x){
       var hh=Math.round(x.r.a/maxA*88);
       return '<div style="flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%">'+
         '<i style="display:block;width:100%;border-radius:5px 5px 0 0;background:'+(x.r.a?"linear-gradient(180deg,var(--c-alg),var(--c-data))":"var(--surface2)")+';height:'+Math.max(hh,4)+'px" title="'+x.r.a+' '+_('שאלות">')+'</i>'+
         '<span class="xs faint">'+x.lbl+'</span></div>';
     }).join("")+'</div></div>';
  h+='<div class="card pad" style="margin-top:16px"><div class="h2">'+_('שליטה לפי נושא')+'</div>';
  if(!seen.length)h+='<p class="sub sm">'+_('עוד לא תרגלתם נושאים. אחרי הסבב הראשון תופיע כאן תמונה.')+'</p>';
  else h+='<div class="grid" style="margin-top:12px;gap:11px">'+seen.sort(function(a,b){return mastery(a.id).m-mastery(b.id).m}).map(function(tp){
    var m=mastery(tp.id);
    return '<div class="'+areaCls(tp.area)+'"><div class="spread" style="gap:8px"><span class="arh" style="font-weight:600">'+tp.name+'</span>'+
_f("{0}{1} מתוך {2}{3}</span></div>", '<span class="xs faint">', m.ok, m.seen, (m.help?_f(" · {0} עם עזרה", m.help):""))+
      '<div class="bar '+barCls(m)+'" style="margin-top:5px"><i style="width:'+m.m+'%"></i></div></div>';
  }).join("")+'</div>';
  h+='</div>';
  return h+'</main>';
}

    h+='<p class="sub sm" style="margin-top:16px">'+_('מהירות דיבור —')+' <span id="ratev">'+s.rate.toFixed(2)+'</span></p>'+

  }

     '<p class="sub sm">'+_('מוחק את ההתקדמות, ההגדרות והנושאים שנבחרו במכשיר הזה. אין דרך לשחזר.')+'</p>'+

var pendingScroll=null;
function render(){
  var html="";
  if(!state.onboarded){
    html=viewOnboard();
  }else{
    html=header();
    if(view==="home")html+=viewHome();
    else if(view==="practice")html+=viewPractice();
    else if(view==="topics")html+=viewTopics();
    else if(view==="formulas")html+=viewFormulas();
    else if(view==="progress")html+=viewProgress();
    else if(view==="settings")html+=viewSettings();
    html+='<footer><div class="wrap fbar">'+
      _f("<span>אקסיומה ג׳ · מתמטיקה לשנה ג׳, צעד אחר צעד</span>")+
      '<span class="faint">'+_('הכול נשמר במכשיר הזה ·')+' '+BUILD+'</span></div></footer>';
  }
  $("#app").innerHTML=html;
  afterRender();
}
function afterRender(){
  if(pendingScroll){
    var el=document.getElementById(pendingScroll);
    if(el){
      el.scrollIntoView({block:"center",behavior:state.settings.rm?"auto":"smooth"});
      el.style.outline="3px solid var(--accent)";el.style.outlineOffset="3px";
      setTimeout(function(){el.style.outline="";},2600);
    }
    pendingScroll=null;
  }
}

/* ============================================================
   17. פעולות
   ============================================================ */
function goto(v){
  if(view===v)return;
  view=v;stopSpeak();
  window.scrollTo(0,0);
  render();
}
function readQuestion(){
  if(!P.q)return;
  var body=P.q.expr;
  if(body&&body.indexOf("<br>")>=0){
    var eqs=body.split("<br>");
    body=eqs.map(function(e,i){return (i===0?_("משוואה ראשונה: "):_("משוואה שנייה: "))+speakMath(plainOf(e))}).join(". ");
  }else body=body?speakMath(plainOf(body)):"";
  var head=speakProse(plainOf(P.q.ask)).replace(/\s+$/,"");
  var sep=/[.?!]$/.test(head)?" ":". ";
  var txt=head+(body?sep+body:"")+
    _f(". האפשרויות: {0}", P.q.options.map(function(o,i){return _f("אפשרות {0}. {1}", (i+1), speakMath(o.t))}).join(", "));
  speak(txt);
}
function readSteps(){
  if(!P.q)return;
  var shown=P.phase==="reveal"?P.q.steps.length:Math.min(P.steps,P.q.steps.length);
  var txt=P.q.steps.slice(0,shown).map(function(s){
    return s.t+". "+speakProse(s.d||"")+" "+(s.m?speakMath(plainOf(s.m)):"");
  }).join(". ");
  speak(txt);
}
function onAnswer(i){
  if(P.phase!=="ask"||!P.q)return;
  if(P.picked.indexOf(i)>=0)return;
  var o=P.q.options[i];
  P.picked.push(i);
  if(o.ok){
    P.lastWhy="";
    P.phase="reveal";
    scoreAnswer(true);
    announce(_("נכון"));
    if(state.settings.tts)speak(lineFor(P.results[P.results.length-1]));
  }else{
    P.lastWhy=o.why||_("התשובה הזו לא נכונה. שווה לפתוח את הפתרון המודרך ולראות איפה הדרך מתפצלת.");
    announce(_f("לא נכון. {0}", P.lastWhy));
    if(state.settings.tts)speak(P.lastWhy);
    /* אם נגמרו האפשרויות — עוברים לחשיפה ולא משאירים תקועים */
    if(P.picked.length>=P.q.options.length-1){
      P.phase="reveal";
      scoreAnswer(false);
    }
  }
  render();
}
function advance(){
  P.i++;
  P.lastWhy="";
  if(roundDone()){P.phase="done";state.stats.rounds++;save();render();return}
  loadQ();
  window.scrollTo(0,0);
  render();
}
var VOICE_SAMPLE="פותרים את המשוואה: שלוש איקס ועוד חמש שווה עשרים. מעבירים את החמש לצד השני, ומחלקים בשלוש.";
function onAction(a,el){
  var s=state.settings;
  if(a==="go"){goto(el.getAttribute("data-v"));return}
  if(a==="lvl"){state.level=parseInt(el.getAttribute("data-l"),10);save();if(view==="practice"&&P.phase==="ask")loadQ();render();return}
  if(a==="track"){state.track=parseInt(el.getAttribute("data-t"),10);
    state.topics=state.topics.filter(function(id){var t=topicById(id);return t&&t.tracks.indexOf(state.track)>=0});
    save();render();return}
  if(a==="start"){startRound();view="practice";window.scrollTo(0,0);render();return}
  if(a==="starttopic"){var tid=el.getAttribute("data-t");startRound(tid);view="practice";window.scrollTo(0,0);render();return}
  if(a==="ans"){onAnswer(parseInt(el.getAttribute("data-i"),10));return}
  if(a==="next"){advance();return}
  if(a==="stop"){
    if(P.results.length===0){goto("home");return}
    P.list=P.list.slice(0,P.results.length);P.phase="done";save();window.scrollTo(0,0);render();return}
  if(a==="hint"){P.hints=1;render();if(s.tts&&P.q.hint)speak(P.q.hint);return}
  if(a==="guide"){
    P.steps=1;P.usedHelp=true;
    render();if(s.tts)readSteps();return}
  if(a==="nextstep"){
    P.steps++;P.usedHelp=true;
    if(P.steps>=P.q.steps.length&&P.phase==="ask"){P.phase="reveal";scoreAnswer(false)}
    render();
    if(s.tts&&P.q.steps[P.steps-1]){
      var st=P.q.steps[P.steps-1];
      speak(st.t+". "+speakProse(st.d||"")+" "+(st.m?speakMath(plainOf(st.m)):""));
    }
    return}
  if(a==="read"){readQuestion();return}
  if(a==="readsteps"){readSteps();return}
  if(a==="rule"){fq="";view="formulas";pendingScroll="f-"+el.getAttribute("data-r");window.scrollTo(0,0);render();return}
  if(a==="tog"){var k=el.getAttribute("data-k");s[k]=!s[k];save();applyModes();render();return}
  if(a==="lang"){
    var lg=el.getAttribute("data-n");
    if(LANGS[lg]&&lg!==s.lang){
      s.lang=lg;save();applyModes();stopSpeak();
      /* שאלה נבנית פעם אחת, וכל הטקסט שלה — השאלה, הרמז, הצעדים
         ואבחון הטעות — נקבע בשפה שהייתה פעילה אז. החלפת שפה באמצע
         שאלה הייתה משאירה מסך חצי מתורגם, ולכן נבנית שאלה חדשה. */
      if(P.q&&!roundDone()){P.lastWhy="";loadQ()}
      render();window.scrollTo(0,0);
    }
    return}
  if(a==="ts"){s.ts=parseInt(el.getAttribute("data-n"),10);save();applyModes();render();return}
  if(a==="theme"){s.theme=el.getAttribute("data-n");save();applyModes();render();return}
  if(a==="rlen"){s.roundLen=parseInt(el.getAttribute("data-n"),10);save();render();return}
  if(a==="engine"){s.engine=el.getAttribute("data-n");ttsErr="";ttsState="";save();render();speak(_(VOICE_SAMPLE));return}
  if(a==="gvoice"){s.gvoice=el.getAttribute("data-n");ttsErr="";ttsState="";save();render();speak(_(VOICE_SAMPLE));return}
  if(a==="clearkey"){saveKey("");ttsErr="";render();return}
  if(a==="voice"){
    var uri=el.getAttribute("data-u");
    s.voice=uri;
    if(!s.voiceByLang)s.voiceByLang={};
    s.voiceByLang[LG]=uri;
    s.engine="device";save();render();speak(_(VOICE_SAMPLE));return}
  if(a==="test"){speak(_(VOICE_SAMPLE));return}
  if(a==="pick"){
    var id=el.getAttribute("data-t"),ix=state.topics.indexOf(id);
    if(ix>=0)state.topics.splice(ix,1);else state.topics.push(id);
    save();render();return}
  if(a==="selall"){state.topics=topicsForTrack(state.track).map(function(t){return t.id});save();render();return}
  if(a==="selnone"){state.topics=[];save();render();return}
  if(a==="fclear"){fq="";render();return}
  if(a==="obnext"){
    P.obStep=(P.obStep||1)+1;
    if(P.obStep>3){state.onboarded=true;save();applyModes();view="home";window.scrollTo(0,0)}
    save();render();return}
  if(a==="obback"){P.obStep=Math.max(1,(P.obStep||1)-1);render();return}
  if(a==="reset"){
    if(!P.confirmReset){P.confirmReset=true;el.textContent=_("לוחצים שוב כדי למחוק סופית");return}
    try{localStorage.removeItem(KEY)}catch(e){}
    state=blankState();P=({list:[],i:0,q:null,phase:"ask",picked:[],hints:0,steps:0,usedHelp:false,results:[]});
    applyModes();view="home";render();return}
}

document.addEventListener("click",function(e){
  var el=e.target.closest("[data-a]");
  if(el&&!el.disabled)onAction(el.getAttribute("data-a"),el);
});
document.addEventListener("input",function(e){
  var el=e.target;
  if(!el.dataset)return;
  if(el.dataset.bind==="name"){state.name=el.value;save();return}
  if(el.dataset.bind==="gkey"){
    var k=String(el.value||"").trim();
    /* מציירים מחדש רק כשהמפתח נראה שלם, אחרת הפוקוס קופץ בכל תו */
    if(/^AIza[\w-]{25,}$/.test(k)){saveKey(k);ttsErr="";render();speak(_(VOICE_SAMPLE))}
    return}
  if(el.dataset.bind==="fq"){fq=el.value;
    var pos=el.selectionStart;render();
    var again=document.querySelector('[data-bind="fq"]');
    if(again){again.focus();try{again.setSelectionRange(pos,pos)}catch(x){}}
    return}
  if(el.dataset.slide==="rate"){
    state.settings.rate=parseFloat(el.value);save();
    var lab=$("#ratev");if(lab)lab.textContent=state.settings.rate.toFixed(2);
    return}
});
document.addEventListener("keydown",function(e){
  if(!state.settings.keys)return;
  if(e.target.closest("input,textarea,select"))return;
  if(!state.onboarded||view!=="practice"||!P.q)return;
  if(P.phase==="ask"&&/^[1-4]$/.test(e.key)){
    var i=parseInt(e.key,10)-1;
    if(P.q.options[i]){e.preventDefault();onAnswer(i)}
    return;
  }
  if(e.key===" "){e.preventDefault();readQuestion();return}
  if(e.key==="h"||e.key==="H"){e.preventDefault();if(P.phase==="ask"&&!P.hints)onAction("hint",document.body);return}
  if(e.key==="s"||e.key==="S"){e.preventDefault();if(!P.steps)onAction("guide",document.body);else onAction("nextstep",document.body);return}
  if(e.key==="Enter"&&P.phase==="reveal"){e.preventDefault();advance();return}
});

function trAt(lang,start,arr){
  (TR_PARTS[lang]=TR_PARTS[lang]||[]).push([start,arr]);

function trBuild(){
  Object.keys(TR_PARTS).forEach(function(lang){

      if(start+arr.length>TR_KEYS.length){bad++;return}

function trMissing(lang){

  return n;
}
