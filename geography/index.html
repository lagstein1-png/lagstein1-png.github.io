<style>
/* ============================================================
   אזרח — אזרחות לבגרות
   קהל היעד לא "לא יודע אזרחות". הוא נכשל בה שוב ושוב, מפני
   שהמקצוע כולו טקסט ומושגים — ולכן כל החלטה כאן נמדדת בשאלה
   אחת: האם היא מורידה עומס, או מוסיפה.
   · כל שאלה נושאת רמז שאינו התשובה, והסבר שנפתח גם כשצדקו.
   · שום טקסט לא מוצג בלי שאפשר לשמוע אותו.
   · שפת האם אינה קישוט: מושג באזרחות נלמד קודם בשפה שחושבים בה.
   כל המידות ב-rem, כדי שהגדלת טקסט תגדיל את הכול יחד.
   ============================================================ */
:root{
  --font:"Heebo","Rubik",system-ui,"Segoe UI",Arial,sans-serif;
  --en:"Lexend","Heebo",system-ui,"Segoe UI",Arial,sans-serif;
  --ar:"Noto Sans Arabic",system-ui,"Segoe UI",Arial,sans-serif;
  --ru:"Noto Sans","Heebo",system-ui,"Segoe UI",Arial,sans-serif;   /* קירילית — Heebo אינו מכיל אותה */
  --bg:#f5f7fb; --surface:#ffffff; --surface2:#e8ecf6;
  --ink:#101828; --muted:#55607a; --faint:#6f7a95; --line:#dde3f0;
  --accent:#1d4ed8; --accent-ink:#ffffff; --accent-soft:#dbe4fe;
  --gold:#a16207; --gold-soft:#fbf0d5; --hit:#f5c451; --hit-ink:#1a1300;
  --ok:#15803d; --ok-soft:#dcfce7; --bad:#be123c; --bad-soft:#ffe4e9;
  --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px -12px rgba(16,24,40,.2);
  --r:14px;
  /* צבע לכל מסלול. לא קישוט: ארבעה סוגי לימוד שונים לגמרי, וצבע
     קבוע לכל אחד חוסך למי שמתקשה להתמצא את השאלה "איפה אני". */
  --c-sound:#0369a1; --cs-sound:#dbeefc;   /* צליל ואות   */
  --c-words:#15803d; --cs-words:#dcfce7;   /* מילים       */
  --c-talk:#b43a0a;  --cs-talk:#fde5d8;    /* מדוברת — #c2410c היה 4.28:1 על ה-cs (30.9) */
  --c-read:#6d28d9;  --cs-read:#eae2fd;    /* ספרותית     */
}
:root[data-theme="dark"]{
  --bg:#0e1425; --surface:#17203a; --surface2:#202c4d;
  --ink:#e8edf8; --muted:#9aa5c0; --faint:#78829e; --line:#2a3762;
  --accent:#93c5fd; --accent-ink:#0e1425; --accent-soft:#1b2a5c;
  --gold:#fbbf24; --gold-soft:#33270f; --hit:#ffd24d; --hit-ink:#241a00;
  --ok:#4ade80; --ok-soft:#132a1c; --bad:#fb7185; --bad-soft:#33161f;
  --warn:#fbbf24; --warn-soft:#33260f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  --c-sound:#7dd3fc; --cs-sound:#0b2a3d;
  --c-words:#86efac; --cs-words:#0f2a1a;
  --c-talk:#fdba74;  --cs-talk:#3a2113;
  --c-read:#c4b5fd;  --cs-read:#261a45;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1425; --surface:#17203a; --surface2:#202c4d;
    --ink:#e8edf8; --muted:#9aa5c0; --faint:#78829e; --line:#2a3762;
    --accent:#93c5fd; --accent-ink:#0e1425; --accent-soft:#1b2a5c;
    --gold:#fbbf24; --gold-soft:#33270f; --hit:#ffd24d; --hit-ink:#241a00;
    --ok:#4ade80; --ok-soft:#132a1c; --bad:#fb7185; --bad-soft:#33161f;
    --warn:#fbbf24; --warn-soft:#33260f;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
    --c-sound:#7dd3fc; --cs-sound:#0b2a3d;
    --c-words:#86efac; --cs-words:#0f2a1a;
    --c-talk:#fdba74;  --cs-talk:#3a2113;
    --c-read:#c4b5fd;  --cs-read:#261a45;
  }
}
/* ניגודיות גבוהה — שחור על לבן, מסגרות מלאות, בלי גוונים רכים */
:root.hc{
  --bg:#ffffff; --surface:#ffffff; --surface2:#ffffff;
  --ink:#000000; --muted:#1a1a1a; --faint:#333333; --line:#000000;
  --accent:#00434b; --accent-ink:#ffffff; --accent-soft:#e6f2f3;
  --gold:#5c3d00; --gold-soft:#f7efdf; --hit:#ffe600; --hit-ink:#000000;
  --ok:#0a5c2a; --ok-soft:#e6f4ea; --bad:#8c0f2c; --bad-soft:#fbe9ed;
  --warn:#6b3d00; --warn-soft:#f7efdf; --shadow:none;
  --c-sound:#00305c; --cs-sound:#e8eef7;
  --c-words:#0a5c2a; --cs-words:#e6f4ea;
  --c-talk:#7a2c00;  --cs-talk:#f9ece4;
  --c-read:#3d1a75;  --cs-read:#eee8f9;
}
:root.hc *{box-shadow:none!important}
:root.hc .card,:root.hc .btn,:root.hc .opt{border-width:2px!important}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs,17px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  font-size:1rem;line-height:1.65;-webkit-text-size-adjust:100%}
:root.clear body{font-family:"Verdana","Tahoma","Heebo",sans-serif;letter-spacing:.012em}
:root.spaced body{word-spacing:.22em;line-height:1.95}
:root.rm *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
h1,h2,h3{margin:0;line-height:1.3;font-weight:800}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* כל טקסט אנגלי — כיוון, גופן ומרווח משלו. unicode-bidi:isolate מונע
   מהמשפט האנגלי לגרור אחריו את סימני הפיסוק של המשפט העברי. */
.en{font-family:var(--en);direction:ltr;unicode-bidi:isolate;text-align:start}
.en-b{font-family:var(--en);direction:ltr;unicode-bidi:isolate;display:inline-block}

.wrap{max-width:56rem;margin:0 auto;padding:0 clamp(.9rem,3vw,1.5rem)}
.hbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-block:.6rem}
:root.hc .hbar{background:var(--bg);backdrop-filter:none}
.hrow{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
.brand{font-size:1.35rem;font-weight:800;letter-spacing:-.01em;display:flex;
  align-items:baseline;gap:.5rem;margin-inline-end:auto}
.brand small{font-size:.72rem;font-weight:600;color:var(--muted);letter-spacing:.06em}
.gbtn{display:inline-flex;align-items:center;gap:.4rem;background:var(--surface);
  border:1px solid var(--line);border-radius:999px;padding:.42rem .8rem;cursor:pointer;
  font-size:.86rem;font-weight:600;box-shadow:var(--shadow);min-height:44px}
.gbtn:hover{border-color:var(--accent)}
.gbtn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:1.1rem}
.grid{display:grid;gap:.85rem}
@media(min-width:640px){.g2{grid-template-columns:1fr 1fr}}
@media(min-width:900px){.g3{grid-template-columns:repeat(3,1fr)}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;
  border:1px solid var(--line);background:var(--surface);border-radius:12px;
  padding:.72rem 1.1rem;font-weight:700;cursor:pointer;box-shadow:var(--shadow);
  min-height:2.9rem;font-size:1rem}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;box-shadow:none}
.btn[disabled]{opacity:.45;cursor:default}
.btn.wide{width:100%}

.chip{display:inline-flex;align-items:center;gap:.35rem;border-radius:999px;
  padding:.22rem .6rem;font-size:.78rem;font-weight:700;background:var(--surface2);color:var(--muted)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}

/* גופני שפה: Heebo אינו מכיל ערבית וקירילית, ולכן שפת הממשק
   מחליפה גופן ולא רק כיוון. */
html[lang="ar"] body,html[lang="ar"] input,html[lang="ar"] button,
html[lang="ar"] textarea,html[lang="ar"] select{font-family:var(--ar)}
html[lang="ru"] body,html[lang="ru"] input,html[lang="ru"] button,
html[lang="ru"] textarea,html[lang="ru"] select{font-family:var(--ru)}
button[data-a="lang"][lang="ar"]{font-family:var(--ar)}
button[data-a="lang"][lang="ru"]{font-family:var(--ru)}

/* ===== מסלולים: הצבע נכנס ככרטיס, לא כרקע של טקסט ===== */
.trk{--c:var(--accent);--cs:var(--accent-soft)}
.t-sound{--c:var(--c-sound);--cs:var(--cs-sound)}
.t-words{--c:var(--c-words);--cs:var(--cs-words)}
.t-talk{--c:var(--c-talk); --cs:var(--cs-talk)}
.t-read{--c:var(--c-read); --cs:var(--cs-read)}
.tcard{border-inline-start:5px solid var(--c);cursor:pointer;text-align:start;width:100%;
  display:flex;flex-direction:column;gap:.4rem;align-items:stretch}
.tcard:hover{border-color:var(--c)}
.tcard h3{font-size:1.05rem}
.tcard .sub{font-size:.85rem;color:var(--muted)}
.tdot{width:.62rem;height:.62rem;border-radius:50%;background:var(--c);flex:none}
.thead{display:flex;align-items:center;gap:.5rem}
.tpill{background:var(--cs);color:var(--c);border-radius:999px;padding:.15rem .55rem;
  font-size:.72rem;font-weight:800}

/* ===== סרגל שליטה ברמות ===== */
.lvls{display:flex;gap:.4rem;flex-wrap:wrap}
.lvl{border:1px solid var(--line);background:var(--surface);border-radius:10px;
  padding:.4rem .7rem;font-size:.82rem;font-weight:700;cursor:pointer;
  display:inline-flex;align-items:center;gap:.4rem}
.lvl.on{background:var(--c,var(--accent));color:var(--accent-ink);border-color:var(--c,var(--accent))}
.bar{height:.42rem;border-radius:999px;background:var(--surface2);overflow:hidden;flex:1;min-width:3rem}
.bar i{display:block;height:100%;background:var(--c,var(--accent))}
.bar.b0 i{background:var(--bad)} .bar.b1 i{background:var(--warn)} .bar.b2 i{background:var(--ok)}

/* ===== תרגול ===== */
.qcard{border-top:5px solid var(--c,var(--accent))}
.qtop{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.7rem}
.qtext{font-size:1.12rem;font-weight:600;margin:.2rem 0 .3rem}
.qhint{color:var(--muted);font-size:.9rem}
/* המילה או המשפט שנלמדים. גדול, מרווח, ותמיד לצד כפתור השמעה. */
.subject{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;
  background:var(--surface2);border-radius:12px;padding:.85rem 1rem;margin:.5rem 0}
.subject .word{font-family:var(--en);direction:ltr;unicode-bidi:isolate;
  font-size:1.7rem;font-weight:700;letter-spacing:.01em;line-height:1.25}
.subject .ipa{font-family:var(--en);direction:ltr;unicode-bidi:isolate;
  color:var(--muted);font-size:.95rem}
.spk{border:1px solid var(--line);background:var(--surface);border-radius:999px;
  width:2.7rem;height:2.7rem;display:inline-flex;align-items:center;justify-content:center;
  cursor:pointer;flex:none;box-shadow:var(--shadow)}
.spk:hover{border-color:var(--accent);color:var(--accent)}
.spk.sm{width:2.1rem;height:2.1rem;background:#0b7c71;border-color:#0b7c71;color:#fff}
/* הרמקול הקטן — אותו ירוק של כפתור ההקראה הגדול, התקן המשותף */
.spk.sm:hover{background:#0b7c71;border-color:#0b7c71;color:#fff}
.spk.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.opts{display:grid;gap:.6rem;margin-top:.9rem}
.orow{display:flex;gap:.45rem;align-items:center;min-width:0}
/* min-width:0 — פריט grid נולד עם min-width:auto, ולכן משפט ארוך
   באפשרות היה מרחיב את השורה מעבר למכל ודוחף את הרמקול מחוץ למסך. */
.orow .opt{flex:1;min-width:0}
@media(min-width:560px){.opts.two{grid-template-columns:1fr 1fr}}
.opt{display:flex;align-items:center;gap:.6rem;text-align:start;width:100%;
  border:2px solid var(--line);background:var(--surface);border-radius:12px;
  padding:.8rem .9rem;cursor:pointer;font-size:1.02rem;font-weight:600;min-height:3.1rem}
.opt:hover{border-color:var(--accent)}
.opt .k{width:1.9rem;height:1.9rem;border-radius:8px;background:var(--surface2);
  display:inline-flex;align-items:center;justify-content:center;font-size:.85rem;
  font-weight:800;color:var(--muted);flex:none}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .k{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .k{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.55}
/* בחירה במבחן היא בחירה, לא תשובה נכונה. במסכי התרגול הצבע
   הירוק אומר "צדקת", ובמבחן אסור לו להופיע כלל — הוא נותן
   משוב שגוי לכל בחירה. ניטרלי, ורק מסמן מה סומן. */
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);margin-inline-start:3px}
.dot.ok{background:var(--ok);border-color:var(--ok)}
.dot.no{background:var(--bad);border-color:var(--bad)}
.dot.flag{box-shadow:0 0 0 2px var(--accent)}

/* אריחי בניית משפט. הסדר הוא התרגיל, ולכן האריח חייב להיראות כמשהו
   שאפשר להרים — מסגרת מלאה ורקע משלו, לא טקסט על רקע הכרטיס. */
.tiles{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:.7rem}
.tile{font-family:var(--en);direction:ltr;border:2px solid var(--line);
  background:var(--surface);border-radius:10px;padding:.5rem .8rem;font-weight:600;
  cursor:pointer;font-size:1.02rem;min-height:2.7rem}
.tile:hover{border-color:var(--accent)}
.slot{min-height:3.2rem;border:2px dashed var(--line);border-radius:12px;
  background:var(--surface2);padding:.5rem;display:flex;flex-wrap:wrap;gap:.45rem;
  align-items:center;direction:ltr}
.slot.ok{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.slot.bad{border-style:solid;border-color:var(--bad);background:var(--bad-soft)}
.slot .tile{background:var(--surface)}

/* ===== משוב ===== */
.fb{margin-top:.9rem;border-radius:12px;padding:.85rem 1rem;border:1px solid transparent}
.fb.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.fb.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.fb b{display:block;font-size:1.02rem;margin-bottom:.2rem}
.fb .body{color:var(--ink);font-weight:500;font-size:.95rem}
.why{margin-top:.55rem;padding-top:.55rem;border-top:1px dashed currentColor;color:var(--ink);
  font-weight:500;font-size:.93rem}

/* ===== קטע קריאה ===== */
/* איור בתוך כרטיס שאלה. הצבע יורש מ-color, ולכן אותו SVG נראה
   נכון גם בערכה הבהירה וגם בכהה בלי גרסה שנייה. */
.figure{margin:.7rem 0;padding:.6rem;border:1px solid var(--line);border-radius:12px;
  background:var(--surface2);color:var(--ink);overflow-x:auto}
.figure svg{display:block;max-width:100%}
/* המבחן המדומה: השאלות זו אחר זו, כמו חוברת בחינה. */
.simq{border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;margin:.8rem 0;
  background:var(--surface)}
.simq.miss{border-color:var(--warn)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.simn{font-weight:800;color:var(--muted);font-size:.86rem}
.simbar{position:sticky;top:0;z-index:5;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:.6rem .8rem;margin:.8rem 0;display:flex;gap:.6rem;
  align-items:center;flex-wrap:wrap;box-shadow:var(--shadow)}
.clock{font-weight:800;font-variant-numeric:tabular-nums;font-size:1.1rem}
.clock.low{color:var(--bad)}
.passage{background:var(--surface2);border-radius:12px;padding:1rem 1.1rem;margin:.6rem 0;
  font-family:var(--en);direction:ltr;unicode-bidi:isolate;font-size:1.08rem;line-height:2}
.passage .s{border-radius:5px;padding:.05em .12em;cursor:pointer}
.passage .s:hover{background:var(--accent-soft)}
.passage .s.now{background:var(--accent-soft);box-shadow:0 2px 0 var(--accent)}
.wd{border-radius:5px;padding:1px 3px}
.wd.hit{background:var(--hit);color:var(--hit-ink);font-weight:600}
/* כשמנוע הדיבור אינו מדווח על גבולות מילים — קורה הרבה בעברית
   באנדרואיד — אין מה להדגיש מילה־מילה, ואז מודגש כל האיבר. הכלל
   שקיים כאן מכוון למשפט בתוך קטע קריאה בלבד, ולכן ההדגשה החלופית
   על איבר אחר לא נראתה כלל. */
.wd.now,p.now,div.now,span.now,b.now{background:var(--hit);color:var(--hit-ink);
  border-radius:8px;box-shadow:0 0 0 4px var(--hit)}
.gloss{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.5rem}
.gword{border:1px solid var(--line);background:var(--surface);border-radius:999px;
  padding:.25rem .6rem;font-size:.85rem;cursor:pointer}
.gword b{font-family:var(--en);direction:ltr;unicode-bidi:isolate}

/* ===== סרגל מצב הקול ===== */
.vstrip{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;border-radius:10px;
  padding:.45rem .7rem;font-size:.85rem;font-weight:600;margin-bottom:.7rem}
.vstrip.ok{background:var(--ok-soft);color:var(--ok)}
.vstrip.warn{background:var(--warn-soft);color:var(--warn)}
.vstrip.bad{background:var(--bad-soft);color:var(--bad)}
.vstrip .btn{padding:.3rem .7rem;min-height:44px;font-size:.82rem}  /* 2.1rem היו 36 פיקסלים — מתחת ליעד המגע */

/* ===== הגדרות ===== */
.row{display:flex;align-items:center;justify-content:space-between;gap:.8rem;
  padding:.7rem 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row:last-child{border-bottom:0}
.row .lab{font-weight:700}
.row .desc{font-size:.85rem;color:var(--muted);font-weight:500}
.sw{width:3.2rem;height:1.8rem;border-radius:999px;background:var(--surface2);
  border:1px solid var(--line);position:relative;cursor:pointer;flex:none}
.sw i{position:absolute;top:.18rem;inset-inline-start:.2rem;width:1.3rem;height:1.3rem;
  border-radius:50%;background:var(--faint);transition:.15s}
.sw.on{background:var(--accent);border-color:var(--accent)}
.sw.on i{inset-inline-start:1.5rem;background:#fff}
.vgrid{display:grid;gap:.5rem;grid-template-columns:1fr}
@media(min-width:560px){.vgrid{grid-template-columns:1fr 1fr}}
.vopt{display:flex;align-items:center;gap:.6rem;border:2px solid var(--line);
  background:var(--surface);border-radius:12px;padding:.6rem .75rem;cursor:pointer;text-align:start}
.vopt.on{border-color:var(--accent);background:var(--accent-soft)}
.vopt .nm{font-weight:700}
.vopt .ds{font-size:.8rem;color:var(--muted)}
input[type=password],input[type=text]{font:inherit;background:var(--surface);color:var(--ink);
  border:1px solid var(--line);border-radius:10px;padding:.6rem .7rem;min-width:0;flex:1;
  direction:ltr;text-align:left}
input[type=range]{width:100%;accent-color:var(--accent)}

.fbar{border-top:1px solid var(--line);margin-top:2rem;padding-block:1rem;
  color:var(--muted);font-size:.82rem}   /* --faint יצא 2.96:1 */
.hidden{display:none!important}

/* ---------- שדה קלט של המבחן ----------
   מודול המבחן הועתק לכאן מאפליקציה שבה .field כבר היה מוגדר.
   בלי הכלל הזה שדה השם של הנבחן נשאר תיבת ברירת המחדל של
   הדפדפן — 21 פיקסלים גובה, הרבה מתחת ליעד המגע של 44. */
.field{width:100%;box-sizing:border-box;font:inherit;font-size:1rem;
  min-height:48px;padding:12px 14px;border-radius:11px;outline:none;background:var(--surface2);color:inherit;border:1px solid var(--line)}
.field:focus{border-color:var(--accent)}
/* outline:none שבשורה שמעליה גובר על :focus-visible הכללי — אותה
   דרגת סגוליות, והוא מאוחר ממנו בקובץ. בלי הכלל הזה שדה השם של
   הנבחן ותיבת הדבקת הקוד מסמנים מיקוד בשינוי צבע מסגרת של פיקסל
   אחד בלבד, ומי שעובד במקלדת אינו רואה איפה הוא עומד. */
.field:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
textarea.field{min-height:96px;resize:vertical}

/* ---------- שורות המבחן ----------
   .tog הגיע ממודול המבחן שהועתק לכאן, ולא היה לו עיצוב כלל: השם
   והמידע שמתחתיו נדבקו לשורה אחת בלי רווח. */
.tog{display:flex;align-items:center;gap:13px;width:100%;text-align:start;
  background:var(--surface2);border:1px solid transparent;border-radius:12px;
  padding:13px 15px;min-width:0}
.tog:hover{border-color:var(--line)}
.tog+.tog{margin-top:9px}
.tog .tt{flex:1;min-width:0}
.tog .tt b{display:block;font-size:.97rem;overflow-wrap:anywhere}
.tog .tt span{display:block;color:var(--muted);font-size:.85rem;overflow-wrap:anywhere;margin-top:2px}

/* יעד מגע לקישור התחתית. קישור טקסט בשורה יוצא בגובה הטקסט —
   15 פיקסלים — וזה קטן מדי לאצבע, גם כשהוא רק לתנאי השימוש. */
.lg-foot a{display:inline-flex;align-items:center;min-height:44px;padding-inline:6px}

/* ---------- יעדי מגע ----------
   .lvl יצא 39 פיקסלים ומתג ה-.sw רק 31, שניהם מתחת ל-44 שהפרויקט
   מחייב את עצמו בהם. במתג לא מגדילים את המסילה — היא תיראה מגושמת —
   אלא מרחיבים את שטח הלחיצה סביבה. */
.lvl{min-height:44px}
.sw{position:relative}
.sw::after{content:"";position:absolute;inset-block:-7px;inset-inline:-4px}

/* ---------- מסך בניית המבחן ----------
   .seg ו-.tpc הגיעו עם מודול המבחן שהועתק לכאן, ולא היה להם עיצוב:
   כפתורי הבחירה יצאו 34 פיקסלים, וכרטיסי הנושאים 6 פיקסלים בלבד —
   כלומר המורה לא יכול היה לבחור נושאים בכלל. */
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 auto;min-width:0;min-height:44px;border:1px solid var(--line);
  background:var(--surface);border-radius:10px;padding:10px 12px;font:inherit;
  font-weight:600;font-size:.9rem;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.tpc{position:relative;display:flex;flex-direction:column;gap:9px;text-align:start;
  background:var(--surface);border:1px solid var(--line);
  border-inline-start:4px solid var(--c,var(--accent));border-radius:12px;padding:14px;
  box-shadow:var(--shadow);min-width:0;min-height:44px;cursor:pointer;font:inherit;color:inherit}
.tpc.on{border-color:var(--accent);background:var(--accent-soft)}
.tpc .tn{font-weight:700;font-size:.98rem;overflow-wrap:anywhere;color:var(--c,var(--ink))}
.tpc .td{color:var(--muted);font-size:.8rem;overflow-wrap:anywhere}

/* טקסט על רקע ההדגשה: --accent-ink ולא לבן קבוע. במצב כהה
   ההדגשה בהירה, ולבן עליה יצא 1.5–2.0:1 — כמעט בלתי קריא. */
/* ---------- מצב מורה ---------- */
.te-wrap{position:fixed;inset:0;z-index:2147482500;background:rgba(8,12,20,.72);
  display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto;
  font-family:system-ui,"Heebo","Rubik",Arial,sans-serif}
.te-box{background:#fff;color:#111827;max-width:26rem;width:100%;border-radius:18px;
  box-shadow:0 24px 70px -20px rgba(0,0,0,.6);padding:clamp(18px,4vw,26px);
  max-height:92vh;overflow-y:auto;font-size:16px;line-height:1.6}
.te-box h2{margin:0 0 6px;font-size:1.35rem;font-weight:800;line-height:1.25}
.te-lead{margin:0 0 10px;color:#374151}
.te-warn{margin:0 0 12px;font-size:.88rem;color:#7c2d12;background:#fef3c7;
  border-radius:10px;padding:9px 11px}
.te-lab{display:block;margin:10px 0 4px;font-weight:700;font-size:.92rem}
.te-in{width:100%;box-sizing:border-box;font:inherit;letter-spacing:.3em;
  border:1px solid #d1d5db;border-radius:11px;padding:.7rem .8rem;min-height:48px;
  background:#fff;color:#111827}
.te-in:focus-visible{outline:3px solid #2563eb;outline-offset:1px}
.te-chk{display:flex;align-items:center;gap:.5rem;margin-top:14px;min-height:44px;
  font-size:.94rem;cursor:pointer}
.te-chk input{width:20px;height:20px}
.te-note{margin:2px 0 0;font-size:.82rem;color:#6b7280}
.te-msg{margin:10px 0 0;font-size:.92rem;font-weight:700;color:#7f1d1d;
  background:#fee2e2;border-radius:10px;padding:9px 11px}
.te-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.te-btn{font:inherit;font-weight:700;border-radius:12px;padding:.75rem 1.2rem;
  cursor:pointer;border:1px solid #d1d5db;background:#fff;color:#111827;min-height:48px}
.te-btn.pri{background:#111827;color:#fff;border-color:#111827;flex:1 1 9rem}
.te-btn.pri[disabled]{opacity:.5;cursor:default}
.te-btn.link{border:0;background:none;text-decoration:underline;padding:.6rem .2rem;
  color:#374151;margin-top:8px;min-height:44px}
.te-btn:focus-visible{outline:3px solid #2563eb;outline-offset:2px}
@media (prefers-color-scheme:dark){
  .te-box{background:#141a24;color:#e8ecf4}
  .te-lead,.te-note{color:#b9c2d4}
  .te-warn{background:#3a2a10;color:#fcd9a5}
  .te-in{background:#1d2531;color:#e8ecf4;border-color:#2c3648}
  .te-msg{background:#4a1717;color:#ffd7d7}
  .te-btn{background:#1d2531;color:#e8ecf4;border-color:#2c3648}
  .te-btn.pri{background:#e8ecf4;color:#141a24;border-color:#e8ecf4}
  .te-btn.link{color:#b9c2d4}
}

/* ---------- רשימת השאלות במסך בניית המבחן ---------- */
.xq-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.xq{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface2)}
.xq-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.xq-n{flex:0 0 auto;min-width:27px;height:27px;border-radius:8px;display:inline-flex;
  align-items:center;justify-content:center;font-weight:800;font-size:.85rem;background:var(--line)}
.xq-tp{font-weight:700;font-size:.88rem;color:var(--muted);overflow-wrap:anywhere}
.xq-acts{margin-inline-start:auto;display:flex;gap:6px;flex-wrap:wrap}
/* 44 פיקסלים גם כאן. כפתור קטן בתוך רשימה ארוכה הוא בדיוק
   הכפתור שנהג מבוגר או ילד עם ADHD לא מצליח לפגוע בו. */
.xq-b{padding:8px 13px;font-size:.88rem;font-weight:700;border-radius:10px;min-height:44px;
  border:1px solid var(--line);background:transparent;color:inherit;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:inherit}
.xq-b:hover{background:var(--line)}
.xq-b[aria-pressed="true"]{background:var(--line)}
.xq-q{margin-top:8px;line-height:1.5;overflow-wrap:anywhere}
.xq-e{margin-top:5px;font-weight:700;overflow-wrap:anywhere}
.xq-a{margin-top:7px;font-size:.92rem;color:var(--ok);overflow-wrap:anywhere}
.xq-add{margin-top:12px;gap:8px}
.xq-add .sub{margin:0}
/* שאלת מקור נושאת קטע שלם. בלי תקרה הוא דוחף את שאר הרשימה
   אל מחוץ למסך. */
.xq .passage{max-height:11rem;overflow:auto}
.hlang{display:flex;gap:4px;flex:none;align-items:center;flex-wrap:wrap}
.hlang button{border:1px solid #d4dbe7;background:transparent;color:inherit;border-radius:10px;padding:3px 9px;font:inherit;font-size:.82rem;cursor:pointer;min-height:36px}
.hlang button.on{border-color:#2f5fd8;color:#fff;background:#2f5fd8;font-weight:700}
@keyframes calmGlow{0%{box-shadow:0 0 0 0 rgba(180,140,40,0)}35%{box-shadow:0 0 26px 6px rgba(180,140,40,.45)}100%{box-shadow:0 0 0 0 rgba(180,140,40,0)}}
.card.calm-glow{animation:calmGlow 2.6s ease-out 1}
.calm-praise{text-align:center;font-weight:600;color:#7c5e10;margin:16px 0 0}
@media (prefers-reduced-motion:reduce){.card.calm-glow{animation:none}}

/* ---------- יעדי מגע ≥44px — 1.10.2026 (O-105) ----------
   אותו בלוק כמו בשאר האפליקציות. נמדד בדפדפן ב-390px וב-360px.
   הבלוק אחרון ב-style כדי לגבור על ההגדרות שמעליו. מגדילים בריפוד
   ובגובה מינימלי, לא בגובה קשיח — ערבית ורוסית ארוכות יותר. */
.hlang button{min-height:44px;padding-block:6px}
input[type=range]{min-height:44px}
.spk.sm{min-width:44px;min-height:44px}
.lvl{min-width:44px}

/* ---------- קישור בתוך טקסט — אזור נגיעה ≥44px · 2.10.2026 (O-110) ----------
   שני מקרים, ונמדדו שניהם ב-390px וב-360px:
   - קישור בתוך שורת טקסט רצה: ריפוד אנכי בלבד. ב-inline הוא מגדיל את
     אזור הנגיעה ואינו נכנס לגובה השורה — אף אלמנט לא זז.
   - קישורים זה מתחת לזה (<br>), וקישור בתוך פס ההקראה הקבוע: שם הריפוד
     חרג מהשורה וכיסה את הקישור או הכפתור שלידו, ולכן inline-flex
     בגובה 44 — כמו `.lg-foot a`. השורה גדלה, ואין חפיפה.
   לא `a` כללי: `.lg-foot a` ודומיו כבר 44px בבנייה אחרת. */
#tts-fail a,a[href*="education.gov.il"]{display:inline-flex;align-items:center;min-height:44px}
</style>

<style>#gate[hidden]{display:none!important}
/* קישור דילוג לתוכן — התקן המשותף, מוסתר עד מוקד מקלדת */
/* כרטיס ״מבנה הבגרות״ (--gold-soft): הקישור לאתר משרד החינוך בלי צבע נפל לכחול ברירת המחדל — 1.55:1 בכהה (30.9) */
.gcard a{color:var(--accent)}
.skip{position:absolute;inset-inline-start:-9999px}
.skip:focus{position:static;display:inline-flex;align-items:center;min-height:44px;
  margin:8px;padding:8px 14px;background:#0b7c71;color:#fff;border-radius:10px;font-weight:700}
/* כפתורי הקראה גדולים וצבעוניים — התקן המשותף (ירוק הקראה, אדום עצירה) */
.spk:not(.sm){border-radius:12px;background:#0b7c71;border-color:#0b7c71;color:#fff;font-weight:700;min-height:46px;width:auto;height:auto;padding:8px 18px;font-size:1.02rem;gap:.4rem}
.spk:not(.sm):hover{background:#0b7c71;color:#fff}
.spkStop{background:#bf4426!important;border-color:#a03a20!important;color:#fff!important}
.spkStop:hover{background:#a03a20!important;color:#fff!important}
/* כפתורי העזר הצבעוניים — התקן המשותף המלא (26.9.2026, דיווח הבעלים:
   ״הכפתורים רמז הקראה וכו קטנים יש להסיף צבע״). ירוק הקראה, אדום עצירה,
   כתום רמז, סגול לימור, כחול פתרון מודרך, אפור־כחלחל נוסחה — אותם
   צבעים בדיוק בכל האפליקציות, והסריקה הרוחבית בודקת את זה. */
.btn[data-a="read"],.btn[data-a="readsteps"]{background:#0b7c71!important;border-color:#0b7c71!important;color:#fff!important;font-weight:700;min-height:46px;padding:10px 16px!important;font-size:1rem!important}
.btn[data-a="read"]:hover,.btn[data-a="readsteps"]:hover{background:#0b7c71!important;color:#fff!important}
.btn[data-a="hush"],.btn[data-a="stop"]{background:#bf4426!important;border-color:#a03a20!important;color:#fff!important;font-weight:700;min-height:46px;padding:10px 16px!important;font-size:1rem!important}
.btn[data-a="hush"]:hover,.btn[data-a="stop"]:hover{background:#a03a20!important;color:#fff!important}
.btn[data-a="hint"]{background:#b45309!important;border-color:#92400e!important;color:#fff!important;font-weight:700;min-height:46px;padding:10px 16px!important;font-size:1rem!important}
.btn[data-a="hint"]:hover{background:#92400e!important;color:#fff!important}
.btn[data-a="tutor"],.btn[data-a="tutor"].ghost{background:#6d28d9!important;border-color:#5b21b6!important;color:#fff!important;font-weight:700;min-height:46px;padding:10px 16px!important;font-size:1rem!important}
.btn[data-a="tutor"]:hover,.btn[data-a="tutor"].ghost:hover{background:#5b21b6!important;color:#fff!important}
.btn[data-a="guide"]{background:#1d4ed8!important;border-color:#1e40af!important;color:#fff!important;font-weight:700;min-height:46px;padding:10px 16px!important;font-size:1rem!important}
.btn[data-a="guide"]:hover{background:#1e40af!important;color:#fff!important}
.btn[data-a="rule"]{background:#334155!important;border-color:#1e293b!important;color:#fff!important;font-weight:700;min-height:46px;padding:10px 16px!important;font-size:1rem!important}
.btn[data-a="rule"]:hover{background:#1e293b!important;color:#fff!important}
/* רמקול לכל תשובה — מי שקורא בקושי בוחר באוזן (אותו תקן של history) */
.opts .orow{display:flex;gap:6px;align-items:stretch}
.opts .orow .opt{flex:1 1 auto}
.optspk{flex:0 0 auto;min-width:46px;min-height:46px;border:2px solid #0b7c71;border-radius:12px;background:#0b7c71;color:#fff;font:inherit;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:8px 10px}
.optspk:hover{background:#0b7c71}
</style>

<script>
/* ============================================================
   מצב הדגמה — נכנס אך ורק דרך ?demo=1 בכתובת.
   ------------------------------------------------------------
   התסריט הוא נתון, לא קוד שפזור במסכים: כל פריט אומר מה נכתב
   בכתוביות (subtitle), מה נעשה על המסך (action) וכמה זמן הצופה
   נשאר עם המסך הזה (duration, באלפיות שנייה).

   ההדגמה מפעילה את האפליקציה האמיתית — היא לוחצת על אותם

var DEMO={on:false,i:0,timer:null,extra:[],bar:null,txt:null,step:null,fill:null,btn:null};

/* עוזרים לתסריט. כולם מחזירים false כשהאיבר אינו על המסך, כדי
   שצעד שלא מצא את מה שחיפש ידלג ולא יפיל את ההדגמה כולה. */
function demoEl(s){return typeof s==="string"?document.querySelector(s):s}
function demoShow(s){
  var e=demoEl(s); if(!e)return false;
  try{e.scrollIntoView({behavior:"smooth",block:"center"})}catch(err){try{e.scrollIntoView()}catch(err2){}}
  return true;
}
/* מדגיש את האיבר, ורק אז לוחץ — צופה שלא ראה לאן נלחץ לא הבין
   מה קרה. לכן אין צעד קצר מ-1200 אלפיות בתסריטים. */
function demoTap(s){
  var e=demoEl(s); if(!e||e.disabled)return false;
  demoShow(e);
  e.classList.add("demo-tap");
  DEMO.extra.push(setTimeout(function(){
    e.classList.remove("demo-tap");
    /* המסך מצטייר מחדש כל הזמן. אם האיבר שסומן כבר אינו במסמך,
       מחפשים אותו שוב לפי אותו בורר — לחיצה על איבר מת אינה
       עושה דבר, וזה בדיוק צעד שנראה כאילו נתקע. */
    var live=(typeof s==="string"&&!document.contains(e))?demoEl(s):e;
    if(DEMO.on&&live&&!live.disabled&&document.contains(live))try{live.click()}catch(err){}
  },430));
  return true;
}
function demoClick(s){
  var e=demoEl(s); if(!e||e.disabled)return false;
  try{e.click()}catch(err){return false}
  return true;
}
/* הקלדה אות אחר אות, עם אירוע input אמיתי — שדה חיפוש שמאזין
   ל-input לא היה מגיב להשמה ישירה ל-value. */
function demoType(s,text){
  var e=demoEl(s); if(!e)return false;
  demoShow(e); try{e.focus()}catch(err){}
  e.value=""; var i=0;
  var t=setInterval(function(){
    if(!DEMO.on||!e.parentNode){clearInterval(t);return}
    e.value=String(text).slice(0,++i);
    e.dispatchEvent(new Event("input",{bubbles:true}));
    if(i>=String(text).length)clearInterval(t);
  },85);
  DEMO.extra.push(t);
  return true;
}
function demoQuiet(){
  try{if(window.speechSynthesis)speechSynthesis.cancel()}catch(e){}
  try{if(typeof stopSpeak==="function")stopSpeak()}catch(e){}
}

/* ESC יוצא. הקשבה בשלב הלכידה, כדי שמסך שכבר מטפל ב-Escape
   לא יבלע את המקש לפני שההדגמה ראתה אותו. */
function demoKey(e){
  if(!DEMO.on)return;
  if(e.key==="Escape"||e.keyCode===27){
    e.preventDefault(); e.stopPropagation();
    demoStop();
  }
}

function demoStart(){
  if(DEMO.on)return;
  DEMO.on=true; DEMO.i=0;
  DEMO.btn.hidden=true; DEMO.bar.hidden=false;
  document.documentElement.classList.add("demo-running");
  demoNext();
}

function demoNext(){
  if(!DEMO.on)return;
  if(DEMO.i>=DEMO_SCRIPT.length){demoStop();return}
  var it=DEMO_SCRIPT[DEMO.i++]||{};
  var d=Math.max(600,it.duration||3000);
  DEMO.txt.textContent=it.subtitle||"";
  DEMO.step.textContent=DEMO.i+" / "+DEMO_SCRIPT.length;
  DEMO.fill.style.transition="none"; DEMO.fill.style.width="0";
  void DEMO.fill.offsetWidth;
  DEMO.fill.style.transition="width "+d+"ms linear";
  DEMO.fill.style.width="100%";
  if(typeof it.action==="function"){
    try{it.action()}catch(err){if(window.console)console.warn("demo:",err)}
  }
  DEMO.timer=setTimeout(demoNext,d);
}

function demoStop(){
  DEMO.on=false;
  if(DEMO.timer){clearTimeout(DEMO.timer);DEMO.timer=null}
  DEMO.extra.forEach(function(t){clearTimeout(t);clearInterval(t)});
  DEMO.extra=[];
  var m=document.querySelectorAll(".demo-tap"),i;
  for(i=0;i<m.length;i++)m[i].classList.remove("demo-tap");
  if(DEMO.bar)DEMO.bar.hidden=true;
  if(DEMO.btn)DEMO.btn.hidden=false;
  document.documentElement.classList.remove("demo-running");
  demoQuiet();
}

  if(!NEEDS_KEEPALIVE||!("speechSynthesis" in window)||_kaTimer)return;
  _kaTimer=setInterval(function(){
    try{
      if(!speechSynthesis.speaking){stopKeepAlive();return}
      if(speechSynthesis.paused)return;   /* עצירה מכוונת — לא נוגעים */
      speechSynthesis.pause();speechSynthesis.resume();
    }catch(e){stopKeepAlive()}
  },9000);
}
function stopKeepAlive(){if(_kaTimer){clearInterval(_kaTimer);_kaTimer=null}}
/* עוצרים רק כששום דבר כבר לא מדבר — אחרת מקטע שהתחיל זה עתה מאבד
   את השמירה שלו כשהמקטע הקודם מסיים להתנקות. */
function maybeStopKeepAlive(){
  try{if(speechSynthesis.speaking||speechSynthesis.pending)return}catch(e){}
  stopKeepAlive();

/* 2 · הפניה חיה ל-utterance. Chrome אוסף אובייקט שאין אליו הפניה,
   ואיתו נעלמים onend ו-onboundary: ההקראה נתקעת באמצע, ההדגשה
   קופאת על מילה אחת, והמקטע הבא לא יוצא לעולם. */

/* 3 · קול רשת שנכשל. הקולות הנוירליים של Edge הם קולות רשת, והם
   שותקים בלי אינטרנט. הדגל נכבה ברגע שאחד מהם נכשל, ומאותו רגע
   הדירוג מעדיף קול מקומי לשארית הסשן. */
var _netVoiceOK=true;

/* קול רשת שאי אפשר להשתמש בו עכשיו — אין אינטרנט, או שאחד כבר
   נכשל בסשן הזה — אינו "פחות טוב", הוא פשוט לא יעבוד. לכן זה מיון
   ראשון ולא עוד סעיף בתוך הניקוד: קנס בניקוד לא הספיק, מפני שקול
   נוירלי של Microsoft צובר על שם היצרן ועל "Natural" יותר ממה שכל
   קנס סביר מוריד — והוא נבחר שוב ושוב אחרי שכבר נכשל.
   כשהוא הקול היחיד שיש הוא עדיין נבחר: מיון של רשימה בת אחד
   מחזיר אותה כמו שהיא. */

/* 4 · שומר זמן. יש מכשירים שבהם onend פשוט לא נורה. בלי השומר הזה
   התור נתקע: הכפתור נשאר על "עצירה" וההקראה לא ממשיכה לעולם. ארבע
   שניות שבהן המנוע לא מדבר ולא ממתין נחשבות סוף.
   מחזיר פונקציית ביטול — מי שסיים בדרך הרגילה מכבה את השומר. */
function ttsWatchdog(alive,onSilent){
  var idle=0,dog=setInterval(function(){
    if(!alive()){clearInterval(dog);return}
    var busy=false;
    try{busy=!!(speechSynthesis.speaking||speechSynthesis.pending)}catch(e){}
    if(busy){idle=0;return}
    if(++idle>=4){clearInterval(dog);onSilent()}

var SEG_MAX=90, SEG_GAP=260;
/* סימן פיסוק בין שתי ספרות הוא חלק מהמספר ולא מקום לחתוך בו:
   בלי הבדיקה הזאת "3,500" נשבר והמנוע קורא "שלוש, חמש מאות". */
function insideNumber(str,i){
  return i>0&&i+1<str.length&&/[0-9]/.test(str[i-1])&&/[0-9]/.test(str[i+1]);
}
function segments(spoken){
  var out=[],parts=[],from=0,i,j;
  function push(t,start){ if(String(t).trim())out.push({text:t,start:start}) }
  for(i=0;i<spoken.length;i++){
    if(".!?:;".indexOf(spoken[i])<0)continue;
    if(insideNumber(spoken,i))continue;
    j=i+1; while(j<spoken.length&&/\s/.test(spoken[j]))j++;
    parts.push({text:spoken.slice(from,j),start:from});
    from=j; i=j-1;
  }
  if(from<spoken.length)parts.push({text:spoken.slice(from),start:from});
  for(var k=0;k<parts.length;k++){
    var p=parts[k];
    if(p.text.length<=SEG_MAX){ push(p.text,p.start); continue }
    var rest=p.text,base=p.start;
    while(rest.length>SEG_MAX){
      var cut=rest.lastIndexOf(",",SEG_MAX);
      while(cut>0&&insideNumber(rest,cut))cut=rest.lastIndexOf(",",cut-1);
      if(cut<SEG_MAX*0.4)cut=rest.lastIndexOf(" ",SEG_MAX);
      if(cut<=0)break;
      push(rest.slice(0,cut+1),base);
      base+=cut+1; rest=rest.slice(cut+1);
    }
    push(rest,base);
  }
  /* מקטע זעיר — "12." או ")" — עם הפסקה של רבע שנייה אחריו נשמע
     כמו גמגום. מאחדים אותו לזה שאחריו. */
  var merged=[];
  for(i=0;i<out.length;i++){
    if(merged.length&&out[i].text.trim().length<12&&
       merged[merged.length-1].text.length+out[i].text.length<=SEG_MAX*1.4){
      merged[merged.length-1].text+=out[i].text; continue;
    }
    if(out[i].text.trim().length<12&&i+1<out.length){
      out[i+1]={text:out[i].text+out[i+1].text,start:out[i].start}; continue;
    }
    merged.push(out[i]);
  }
  out=merged;
  return out.length?out:[{text:spoken,start:0}];
}
/* קצב לפי שפה — אותם ערכים שנבחרו בתאוריה מדברת אחרי האזנה */
var VOICE_TUNE={he:0.82,ar:0.85,en:0.90,ru:0.88};
function tuneRate(lang,rate){
  var t=VOICE_TUNE[String(lang||"he").split("-")[0].toLowerCase()]||0.88;
  var r=t*(rate||1);
  return Math.max(0.5,Math.min(1.6,Math.round(r*100)/100));
}

  if(!("speechSynthesis" in window)){ show(M.noSup); return }
  var list=[]; try{ list=speechSynthesis.getVoices()||[] }catch(e){}
  try{ speechSynthesis.cancel() }catch(e){}

  catch(e){ show(M.mkFail+e.message); return }
  u.lang=(LANGS[state.lang||"he"]||LANGS.he).tts; u.volume=1; u.rate=1; u.pitch=1;

/* ------------------------------------------------------------

   כרום יורה onend על האמירה שבוטלה, המקטע הבא נרשם בכל זאת,
   וכעבור SEG_GAP ההקראה הישנה חוזרת מעל החדשה — שני קולות
   במקביל. מונה אחד פותר את זה: כל הקראה מקבלת מספר, stopSpeak
   מקדם אותו, ומקטע מדור ישן פשוט אינו מדבר.

var _sayGen=0;

   **עברית בלבד**, בהוראת הבעלים. ערבית, רוסית ואנגלית עוברות
   כמות שהן. הקובץ לא נטען — הטקסט חוזר כמות שהוא, ואין שגיאה. */

  var l=code?String(code).slice(0,2):(typeof LG!=="undefined"?LG:"he");

     שיוצאת ארבע שניות אחרי המגע נזרקת בשקט באנדרואיד ובספארי.
     כשהרשימה כבר כאן, בוחרים קול ומדברים. כשהיא ריקה — מדברים
     בכל זאת, עם u.lang בלבד: קול ברירת מחדל בשפה הנכונה עדיף על
     שתיקה, ויש מכשירים שמחזירים רשימה ריקה לצמיתות ומדברים היטב.
     voicesReady נשאר בשימוש למסך בחירת הקול, שם ההמתנה במקומה. */

        u.onend=next;

             מקומי וחוזרים על אותו מקטע, פעם אחת, כדי שההקראה לא
             תישבר בשקט באמצע שאלה. */

/* lang: "en" לחומר הנלמד, או קוד שפת האם להוראה. */
function speak(text,lang,rateMul){

     לבד, וניקוי חוזר אינו משנה דבר — אבל בלעדיו כל מחרוזת שנשארה
     עם <sub> או <span class="frac"> הוקראה בקול כתגית: הסטודנט
     שמע "span class frac" באמצע השאלה. */
  text=plainOf(String(text||"")).trim(); if(!text)return;
  lang=lang||"en";
  var code=lang==="en"?EN_TTS:LANGS[lang].tts;
  var rate=clamp(state.rate*(rateMul||1),0.55,1.4);
  stopSpeak();
  var my=_sayGen;   /* גם תשובת רשת שמגיעה אחרי עצירה לא תושמע */
  /* שכבה 1 - קובץ מוקלט (המנוע של תאוריה מדברת). יש קובץ:
     מנגנים וזהו; אין: קול המכשיר כרגיל. הבעלים, 2.10.2026. */
  if(typeof RECORDED!=="undefined"&&RECORDED.play(text,lang,{rate:state.rate,
      onError:function(){ if(my===_sayGen)speakDevice(text,code,rate) }})){
    return;
  }
  if(gemOn()){
    var vid=gvOf(state.gemVoice).id;
    var ck=lang+"|"+vid+"|"+rate.toFixed(2)+"|"+text;
    if(gCache[ck]){playUrl(gCache[ck],text,code,rate);return}
    gBusy=true; renderSpeakState();
    gSynth(text,vid,rate,lang).then(function(u){
      if(my!==_sayGen)return;
      gCache[ck]=u; gBusy=false; renderSpeakState(); playUrl(u,text,code,rate);
    }).catch(function(){
      gBusy=false; renderSpeakState(); speakDevice(text,code,rate);
    });
    return;
  }
  speakDevice(text,code,rate);
}
function playUrl(url,text,code,rate){
  gStop();

  if(!GEL)GEL=new Audio();
  gAudio=GEL; gAudio.src=url;
  gAudio.play().catch(function(){speakDevice(text,code,rate)});
}

  }catch(e){}
},{once:true});}catch(e){}

   ------------------------------------------------------------
   בנק שאלות כתוב, ולא מחולל. באזרחות אין נוסחה שממנה נגזרת
   שאלה: הניסוח המדויק הוא החומר הנלמד, ומסיח שנבנה אוטומטית
   מנוסח אחר היה יוצא או מופרך מדי או נכון בעצמו.

   Q(id, q, opts, ok, hint, ex, fig)
     id   — מזהה יציב לפריט. הוא נכנס לסטטיסטיקה של הלומד, ולכן
            אסור לו להשתנות כשמוסיפים פריט לפניו.
     q    — נוסח השאלה, בארבע שפות.
     opts — ארבע תשובות, כל אחת בארבע שפות. תמיד ארבע: שלוש
            אפשרויות הן ניחוש של אחד משלושה.
     ok   — אינדקס התשובה הנכונה במערך opts (0..3). הסדר על
            המסך מעורבב בכל הצגה, ולכן האינדקס אינו רמז.
     hint — רמז שמכוון לחשיבה ואינו מוסר את התשובה.
     ex   — ההסבר שנפתח אחרי המענה, גם כשענו נכון.
     fig  — מפתח איור מתוך FIGS, או null. אופציונלי בהגדרה:
            רוב השאלות באזרחות הן טקסט בלבד.

   כל שדה קיים בארבע השפות. אזרחות נלמדת בשפת האם — מי שקורא
   בקושי בעברית לא ילמד ממנה מדרג נורמות, ולכן התוכן עצמו
   מתורגם ולא רק הממשק.

   מקור: תוכנית הלימודים בגיאוגרפיה (אדם וסביבה) של משרד החינוך, יחידת חובה 2 — הגיאוגרפיה של המזרח התיכון, ומבנה שאלון 57381. הניסוח מקורי של בקול, עם קרדיט וקישור למשרד החינוך. הערת המקור המקורית של אזרח: "להיות אזרחים
   בישראל". השאלות נכתבו לאפליקציה הזאת ואינן העתק של בחינה.
   ============================================================ */
function Q(id,q,opts,ok,hint,ex,fig){
  return {id:id,q:q,o:opts,ok:ok,hint:hint,ex:ex,fig:fig||null};
}

/* ------------------------------------------------------------
   איורים. SVG בקוד ולא קובץ תמונה: אין בקשת רשת, הם עובדים
   אופליין מהרגע הראשון, והם מקבלים את צבעי הערכה — כולל הכהה.
   הטקסט שבתוכם עובר דרך gl(), ולכן איור נקרא בשפת הלומד.
   ------------------------------------------------------------ */
function figBox(x,y,w,h,label,sub){
  return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="6" '+
    'fill="var(--surface2)" stroke="currentColor" stroke-width="1.2"/>'+
    '<text x="'+(x+w/2)+'" y="'+(y+(sub?h/2-2:h/2+4))+'" text-anchor="middle" '+
    'font-size="10" font-weight="700" fill="currentColor">'+esc(label)+'</text>'+
    (sub?'<text x="'+(x+w/2)+'" y="'+(y+h/2+11)+'" text-anchor="middle" '+
      'font-size="8" fill="currentColor" opacity=".75">'+esc(sub)+'</text>':"");
}

  /* אחוז החסימה: קו אחד, וכל מה שמתחתיו אינו נכנס לכנסת */

    var bars=[["A",7.4],["B",5.1],["C",3.9],["D",2.8],["E",1.6]],h="",i,x,ht;

      en:"Bar chart, the electoral threshold is 3.25 percent"})+": "+
      bars.map(function(b){return b[0]+" "+b[1]+"%"}).join(", ");
    return '<svg viewBox="0 0 300 100" role="img" aria-label="'+esc(alt)+'" width="100%" height="100" dir="ltr">'+h+'</svg>';
  }
};

function figHtml(k){

     השפות של מפת המזרח התיכון לא נאמר לאיש. יש שאלה אחת שהניסוח
     שלה הוא "הציצו במפה — מי נוגע בישראל מכל עבר?": מי שאינו רואה
     את המפה לא יכול היה לענות עליה כלל. כל איור כאן נושא שם נגיש

}

   [{he:"מחיר המשאב בעולם משתנה, וירידה חדה בו פוגעת בתקציב המדינה ובכלכלה כולה",ar:"سعر المورد عالميًا متقلب، وهبوطه الحاد يضرّ بميزانية الدولة واقتصادها كله",ru:"Мировая цена ресурса колеблется, и резкое падение бьет по бюджету и всей экономике",en:"The resource's world price fluctuates, and a sharp drop hurts the budget and the whole economy"},

function itemId(tid,lv,i){return tid+"|"+lv+"|"+i}
function itemRec(id){
  if(!state.item[id])state.item[id]={n:0,ok:0};
  return state.item[id];
}
function poolOf(tp,lv){return (tp.L[lv-1]||tp.L[0]||[])}

/* בחירת פריט לתרגול. משקל גבוה לחדש, בינוני לנכשל, נמוך לנשלט. */
function chooseIndex(tid,lv,pool,avoid){
  var cand=[],i,w;
  for(i=0;i<pool.length;i++){
    if(avoid!==undefined&&i===avoid&&pool.length>1)continue;
    var r=state.item[itemId(tid,lv,i)];
    if(!r||!r.n)w=6;                            /* חדש */
    else if(r.ok<r.n)w=1+Math.min(4,r.n-r.ok);  /* נכשל בעבר */
    else w=1;                                   /* נשלט */
    for(var j=0;j<w;j++)cand.push(i);
  }
  if(!cand.length)return 0;
  return pick(cand);
}
/* בחירת פריט למבחן. אחידה, ואינה נוגעת ב-state כלל. */
function pureIndex(pool,avoid){
  var cand=[],i;
  for(i=0;i<pool.length;i++){
    if(avoid!==undefined&&i===avoid&&pool.length>1)continue;
    cand.push(i);
  }
  return cand.length?pick(cand):0;
}


/* ------------------------------------------------------------
   ניקוי להקראה בלבד. המסך אינו משתנה ממנו.

   הגרשיים העבריים משמשים לשני דברים: ראשי תיבות (חוק־יסוד,
   בג״ץ) ומירכאות (״מדינה יהודית״). המנוע מכיר רק את הראשון.
   הכלל שמפריד: בראשי תיבות באה אחרי הגרשיים אות עברית אחת
   בדיוק וסוף מילה. הסיכון א־סימטרי — מירכאה שהוסרה אינה
   יכולה להזיק, מירכאה שנשארה כן.

   המירכאות המסולסלות (“ ”) משמשות כאן לציטוט מונחים בלבד,
   ולכן הן נופלות תמיד. הקו המפריד הופך לפסיק, כדי שהקול
   ייעצר במקום לרוץ הלאה.
   ------------------------------------------------------------ */
function saySpell(x){
  return String(x==null?"":x)
    .replace(/[“”‘’]/g,"")
    .replace(/״/g,function(m,i,str){
      return /^[א-ת](?![א-ת])/.test(str.slice(i+1))?m:"";
    })
    .replace(/\s—\s/g,", ");
}

function O(html,ok,why){return {h:html,ok:!!ok,why:why||""}}

/* בונה שאלה מפריט אחד. סדר האפשרויות מעורבב בכל בנייה, ולכן
   האינדקס ok שבתוכן אינו מגיע למסך לעולם. */
function buildFromItem(it){
  var opts=it.o.map(function(o,i){return O(esc(gl(o)),i===it.ok,"")});
  var ans=gl(it.o[it.ok]);
  return {
    type:"mcq",
    prompt:t("qPick"),
    lead:gl(it.q),
    fig:figHtml(it.fig),
    opts:shuffle(opts),
    answer:ans,
    /* מה שנאמר אחרי המענה: השאלה, התשובה הנכונה, וההסבר.
       תשובה בלי ההסבר נשמעת כמו עובדה לשינון, וזה בדיוק מה
       שהאפליקציה הזאת קיימת כדי להחליף. */
    say:gl(it.q)+" "+ans+". "+gl(it.ex),
    reveal:it
  };
}
function buildQuestion(tid,lv,avoid,pure){
  var tp=topicOf(tid); if(!tp)return null;
  var pool=poolOf(tp,lv);
  if(!pool.length)return null;
  var idx=pure?pureIndex(pool,avoid):chooseIndex(tid,lv,pool,avoid);
  var it=pool[idx];
  if(!it)return null;
  var q=buildFromItem(it);
  q.tid=tid; q.lv=lv; q.idx=idx; q.id=itemId(tid,lv,idx);
  q.hint=gl(it.hint);
  return q;
}

  d:{he:"הצטברות מלח בקרקע אחרי השקיה חוזרת באזור חם, והיא מוציאה את השדה מכלל שימוש.",ar:"تراكم الملح في التربة بعد ريّ متكرّر في منطقة حارّة، وهو يُخرج الحقل من الخدمة.",ru:"Накопление соли в почве после многократного полива в жарком районе; поле выходит из строя.",en:"Salt building up in the soil after repeated irrigation in a hot area, putting the field out of use."}},
 {trk:"mid",
  t:{he:"הגירה פנימית",ar:"الهجرة الداخلية",ru:"Внутренняя миграция",en:"Internal migration"},
  d:{he:"מעבר תושבים בתוך המדינה, בדרך כלל מן הכפר אל העיר, לחפש עבודה ולימודים.",ar:"انتقال السكان داخل الدولة، غالبًا من القرية إلى المدينة، بحثًا عن عمل ودراسة.",ru:"Переселение жителей внутри страны, обычно из деревни в город, ради работы и учёбы.",en:"People moving within a country, usually village to city, in search of work and study."}},
 {trk:"mid",
  t:{he:"מהגרי עבודה",ar:"العمال المهاجرون",ru:"Трудовые мигранты",en:"Migrant workers"},
  d:{he:"עובדים שהגיעו ממדינה אחרת לעבוד, לרוב בלי אזרחות ובלי זכות להישאר לתמיד.",ar:"عمّال قدِموا من دولة أخرى للعمل، غالبًا بلا جنسية وبلا حقّ البقاء الدائم.",ru:"Работники, приехавшие из другой страны ради заработка, обычно без гражданства и права остаться навсегда.",en:"Workers who came from another country to work, usually without citizenship or the right to stay."}},
 {trk:"mid",
  t:{he:"עיור",ar:"التمدّن",ru:"Урбанизация",en:"Urbanisation"},
  d:{he:"גידול חלקם של תושבי הערים מתוך כלל האוכלוסייה, והתפשטות הערים אל סביבתן.",ar:"ازدياد نسبة سكان المدن من مجمل السكان، وتوسّع المدن نحو محيطها.",ru:"Рост доли городских жителей в населении и расширение городов в окружающее пространство.",en:"The share of city dwellers rising within the population, and cities spreading into their surroundings."}},
 {trk:"mid",
  t:{he:"פליטים",ar:"اللاجئون",ru:"Беженцы",en:"Refugees"},
  d:{he:"אנשים שנמלטו מבתיהם מפני מלחמה או רדיפה, ואינם יכולים לחזור אליהם בבטחה.",ar:"أشخاص فرّوا من بيوتهم بسبب حرب أو اضطهاد، ولا يستطيعون العودة إليها بأمان.",ru:"Люди, бежавшие из своих домов от войны или преследования и не могущие вернуться безопасно.",en:"People who fled their homes from war or persecution and cannot safely return to them."}},
 {trk:"mid",
  t:{he:"מבנה גילים",ar:"التركيب العمري",ru:"Возрастная структура",en:"Age structure"},
  d:{he:"חלוקת האוכלוסייה לקבוצות גיל. אוכלוסייה צעירה דורשת בתי ספר ומקומות עבודה מהר.",ar:"توزيع السكان على فئات العمر. السكان الشباب يحتاجون مدارس وأماكن عمل بسرعة.",ru:"Распределение населения по возрастным группам. Молодое население быстро требует школ и рабочих мест.",en:"How a population splits by age group. A young population needs schools and jobs fast."}},
 {trk:"mid",
  t:{he:"תוצר לנפש",ar:"الناتج للفرد",ru:"ВВП на душу населения",en:"GDP per capita"},
  d:{he:"ערך כל מה שהמדינה מייצרת בשנה, מחולק במספר תושביה. הוא מודד רמה, לא חלוקה.",ar:"قيمة ما تنتجه الدولة في السنة مقسومة على عدد سكانها. يقيس المستوى لا التوزيع.",ru:"Стоимость произведённого страной за год, делённая на число жителей. Он измеряет уровень, а не распределение.",en:"The value of all a country produces in a year, divided by its people. It measures level, not sharing."}},
 {trk:"mid",
  t:{he:"גיוון כלכלי",ar:"التنويع الاقتصادي",ru:"Диверсификация экономики",en:"Economic diversification"},
  d:{he:"פיתוח ענפים נוספים לצד המשאב העיקרי, כדי שהכלכלה לא תיפול יחד איתו.",ar:"تطوير فروع إضافية إلى جانب المورد الرئيسي، كي لا يسقط الاقتصاد معه.",ru:"Развитие других отраслей рядом с главным ресурсом, чтобы экономика не упала вместе с ним.",en:"Growing other branches alongside the main resource, so the economy does not fall with it."}},
 {trk:"mid",
  t:{he:"קרן לדורות הבאים",ar:"صندوق الأجيال القادمة",ru:"Фонд будущих поколений",en:"Sovereign wealth fund"},
  d:{he:"קרן ממשלתית שצוברת את רווחי הנפט ומשקיעה אותם, כדי לממן את המדינה גם אחריו.",ar:"صندوق حكومي يراكم أرباح النفط ويستثمرها، لتمويل الدولة حتى بعد نفاده.",ru:"Государственный фонд, накапливающий и вкладывающий нефтяные доходы, чтобы содержать страну и после нефти.",en:"A state fund that saves and invests oil profits, to fund the country after the oil is gone."}},
 {trk:"mid",
  t:{he:"משאב מתכלה",ar:"مورد ناضب",ru:"Исчерпаемый ресурс",en:"Finite resource"},
  d:{he:"משאב טבע שכמותו בקרקע סופית, וכל שאיבה ממנו מקרבת את היום שבו ייגמר.",ar:"مورد طبيعي كمّيته في الأرض محدودة، وكل استخراج منه يقرّب يوم نفاده.",ru:"Природный ресурс с конечным запасом в земле: каждая добыча приближает его исчерпание.",en:"A natural resource with a finite stock in the ground: every extraction brings its end closer."}},
 {trk:"mid",
  t:{he:"גאופוליטיקה",ar:"الجيوبوليتيك",ru:"Геополитика",en:"Geopolitics"},
  d:{he:"חקר הקשר בין המרחב — מיקום, משאבים ומעברים — ובין כוחן ומדיניותן של מדינות.",ar:"دراسة العلاقة بين المجال — الموقع والموارد والممرّات — وبين قوة الدول وسياستها.",ru:"Изучение связи между пространством — положением, ресурсами, проходами — и силой и политикой государств.",en:"The study of how space — location, resources and passages — shapes states' power and policy."}},
 {trk:"mid",
  t:{he:"צוואר בקבוק (מצר ים)",ar:"عنق الزجاجة (مضيق بحري)",ru:"Бутылочное горлышко (пролив)",en:"Chokepoint (strait)"},
  d:{he:"מעבר ימי צר שדרכו עובר סחר רב, ולכן מי ששולט בו משפיע על מדינות רחוקות.",ar:"ممرّ بحري ضيّق تمرّ عبره تجارة كثيرة، فمن يسيطر عليه يؤثّر في دول بعيدة.",ru:"Узкий морской проход, через который идёт большая торговля: кто им владеет, влияет на далёкие страны.",en:"A narrow sea passage carrying heavy trade, so whoever controls it sways distant countries."}},
 {trk:"mid",
  t:{he:"הליגה הערבית",ar:"جامعة الدول العربية",ru:"Лига арабских государств",en:"The Arab League"},
  d:{he:"ארגון אזורי של מדינות ערב לשיתוף פעולה מדיני, כלכלי ותרבותי. החלטותיו אינן מחייבות.",ar:"منظمة إقليمية لدول عربية للتعاون السياسي والاقتصادي والثقافي. قراراتها غير مُلزِمة.",ru:"Региональная организация арабских государств для политического, экономического и культурного сотрудничества; решения необязательны.",en:"A regional organisation of Arab states for political, economic and cultural cooperation; its decisions do not bind."}},
 {trk:"eretz",
  t:{he:"מישור החוף",ar:"سهل الساحل",ru:"Прибрежная равнина",en:"The coastal plain"},
  d:{he:"הרצועה המישורית לאורך הים התיכון. היא נוחה לבנייה ולתחבורה, ובה רוב תושבי ישראל.",ar:"الشريط السهلي على طول البحر المتوسط. سهل البناء والمواصلات، وفيه معظم سكان إسرائيل.",ru:"Равнинная полоса вдоль Средиземного моря: удобна для застройки и транспорта, здесь живёт большинство израильтян.",en:"The flat strip along the Mediterranean: easy to build on and travel across, home to most Israelis."}},
 {trk:"eretz",
  t:{he:"רצועת ההר",ar:"المنطقة الجبلية",ru:"Горная полоса",en:"The mountain belt"},
  d:{he:"רכס ההרים שבמרכז הארץ, מן הגליל ועד הנגב. הבנייה בו יקרה, והמעיינות קרובים.",ar:"سلسلة الجبال في وسط البلاد، من الجليل حتى النقب. البناء فيها مكلف والينابيع قريبة.",ru:"Горный хребет в центре страны, от Галилеи до Негева: строить дорого, зато родники рядом.",en:"The mountain ridge through the country's centre, Galilee to the Negev: costly to build on, springs close by."}},
 {trk:"eretz",
  t:{he:"הבקע הסורי-אפריקני",ar:"الأخدود السوري الإفريقي",ru:"Сирийско-Африканский разлом",en:"The Syrian-African rift"},
  d:{he:"שבר ענק בקרום כדור הארץ, ולאורכו צנחה הקרקע ונוצרו בקעת הירדן, ים המלח והערבה.",ar:"صدع هائل في قشرة الأرض، هبطت على امتداده الأرض فنشأت غور الأردن والبحر الميت والعربة.",ru:"Огромный разлом земной коры: вдоль него земля опустилась, образовав Иорданскую долину, Мёртвое море и Араву.",en:"A vast crack in the earth's crust along which the ground sank, forming the Jordan Valley, the Dead Sea and the Arava."}},
 {trk:"eretz",
  t:{he:"הערבה",ar:"العربة",ru:"Арава",en:"The Arava"},
  d:{he:"בקעה מדברית וצחיחה בין ים המלח לאילת, בקצה הדרומי של הבקע.",ar:"غور صحراوي قاحل بين البحر الميت وإيلات، في الطرف الجنوبي من الصدع.",ru:"Пустынная засушливая долина между Мёртвым морем и Эйлатом, в южной части разлома.",en:"A dry desert valley between the Dead Sea and Eilat, at the rift's southern end."}},
 {trk:"eretz",
  t:{he:"קו פרשת המים",ar:"خط تقسيم المياه",ru:"Водораздел",en:"The watershed line"},
  d:{he:"הקו שלאורך פסגות ההר, שממנו זורמים המים לצד אחד או לצד האחר. עליו עברה דרך האורך.",ar:"الخط على قمم الجبال، ومنه تجري المياه إلى هذا الجانب أو ذاك. وعليه مرّ طريق الطول.",ru:"Линия по вершинам хребта, от которой воды стекают на одну или другую сторону; по ней шла продольная дорога.",en:"The line along the ridge crests from which water runs to one side or the other; the long road ran along it."}},
 {trk:"eretz",
  t:{he:"אקלים ים-תיכוני",ar:"المناخ المتوسطي",ru:"Средиземноморский климат",en:"Mediterranean climate"},
  d:{he:"אקלים שבו כל הגשם יורד בחורף הקר, והקיץ ארוך, חם ויבש לגמרי.",ar:"مناخ يسقط فيه كل المطر في الشتاء البارد، والصيف فيه طويل حارّ وجافّ تمامًا.",ru:"Климат, в котором весь дождь выпадает холодной зимой, а лето длинное, жаркое и совершенно сухое.",en:"A climate where all the rain falls in the cold winter, and summer is long, hot and wholly dry."}},
 {trk:"eretz",
  t:{he:"צל גשם",ar:"ظلّ المطر",ru:"Дождевая тень",en:"Rain shadow"},
  d:{he:"האזור שמעבר לרכס, בצד המזרחי. העננים הורידו את גשמם במערב, ולכאן נשאר מעט.",ar:"المنطقة خلف السلسلة في جانبها الشرقي. أنزلت الغيوم مطرها في الغرب، فلم يبقَ هنا إلا القليل.",ru:"Район за хребтом, с восточной стороны: облака пролили дождь на западе, сюда осталось мало.",en:"The area beyond the ridge, on its eastern side: the clouds dropped their rain in the west, little is left here."}},
 {trk:"eretz",
  t:{he:"משקעים",ar:"الهطول",ru:"Осадки",en:"Precipitation"},
  d:{he:"כל המים שיורדים מן השמים — גשם, שלג וברד — ונמדדים במילימטרים בשנה.",ar:"كل الماء النازل من السماء — مطر وثلج وبَرَد — ويُقاس بالمليمترات في السنة.",ru:"Вся вода, падающая с неба — дождь, снег, град, — измеряется в миллиметрах за год.",en:"All the water that falls from the sky — rain, snow and hail — measured in millimetres a year."}},
 {trk:"eretz",
  t:{he:"לחות יחסית",ar:"الرطوبة النسبية",ru:"Относительная влажность",en:"Relative humidity"},
  d:{he:"כמות אדי המים באוויר. לחות גבוהה מונעת מן הזיעה להתאדות, ולכן החום מעיק יותר.",ar:"كمية بخار الماء في الهواء. الرطوبة العالية تمنع تبخّر العرق، فيصير الحرّ أثقل.",ru:"Количество водяного пара в воздухе: высокая влажность мешает поту испаряться, и жара переносится тяжелее.",en:"How much water vapour the air holds: high humidity stops sweat evaporating, so the heat feels heavier."}},
 {trk:"eretz",
  t:{he:"חקלאות בעל",ar:"الزراعة البعلية",ru:"Богарное земледелие",en:"Rain-fed farming"},
  d:{he:"גידול שחי ממי הגשם בלבד, בלי השקיה. הוא אפשרי רק היכן שהגשם די סדיר.",ar:"زراعة تعيش على ماء المطر وحده بلا ريّ. ولا تمكن إلا حيث المطر منتظم بما يكفي.",ru:"Земледелие, живущее только дождевой водой, без полива: возможно лишь там, где дождь достаточно регулярен.",en:"Farming that lives on rainwater alone, without irrigation: possible only where rain is regular enough."}},
 {trk:"eretz",
  t:{he:"חקלאות שלחין",ar:"الزراعة المرويّة",ru:"Поливное земледелие",en:"Irrigated farming"},
  d:{he:"גידול בהשקיה. הוא אינו תלוי בגשם, אך הוא תלוי במקור מים ובעלות ההולכה.",ar:"زراعة بالريّ. لا تعتمد على المطر، لكنها تعتمد على مصدر ماء وعلى كلفة نقله.",ru:"Земледелие на поливе: не зависит от дождя, но зависит от источника воды и стоимости её доставки.",en:"Irrigated farming: free of the rain, but tied to a water source and the cost of carrying it."}},
 {trk:"eretz",
  t:{he:"המוביל הארצי",ar:"الناقل القطري",ru:"Всеизраильский водовод",en:"The National Water Carrier"},
  d:{he:"מערכת צינורות שמוליכה מים מצפון הארץ אל המרכז ואל הדרום הצחיח.",ar:"شبكة أنابيب تنقل المياه من شمال البلاد إلى الوسط وإلى الجنوب القاحل.",ru:"Система труб, ведущая воду с севера страны в центр и в засушливый юг.",en:"A pipeline system carrying water from the country's north to the centre and the arid south."}},
 {trk:"eretz",
  t:{he:"שנה שחונה",ar:"سنة جافة",ru:"Засушливый год",en:"A drought year"},
  d:{he:"שנה שבה ירד הרבה פחות גשם מן הרגיל. בנגב היא פוגעת יותר, כי הבסיס שם נמוך.",ar:"سنة سقط فيها مطر أقلّ بكثير من المعتاد. وهي تضرّ النقب أكثر، لأن الأساس هناك منخفض.",ru:"Год, когда дождя выпало куда меньше обычного: в Негеве он бьёт сильнее, ведь база там низкая.",en:"A year with far less rain than usual: it hurts the Negev more, because the baseline there is low."}},
 {trk:"eretz",
  t:{he:"אידוי",ar:"التبخّر",ru:"Испарение",en:"Evaporation"},
  d:{he:"מעבר מים מנוזל לאדים באוויר. בחום המדברי האידוי גדול, ולכן המאגרים מאבדים מים.",ar:"تحوّل الماء من سائل إلى بخار في الهواء. في حرّ الصحراء التبخّر كبير، فتفقد الخزّانات ماءها.",ru:"Переход воды из жидкости в пар: в пустынной жаре испарение велико, и водоёмы теряют воду.",en:"Water turning from liquid into vapour: in desert heat evaporation is high, so reservoirs lose water."}},
 {trk:"eretz",
  t:{he:"מפלס",ar:"المنسوب",ru:"Уровень воды",en:"Water level"},
  d:{he:"גובה פני המים של ים או אגם. מפלס ים המלח יורד בכל שנה.",ar:"ارتفاع سطح الماء في بحر أو بحيرة. ومنسوب البحر الميت ينخفض كل سنة.",ru:"Высота водной поверхности моря или озера: уровень Мёртвого моря падает каждый год.",en:"The height of a sea's or lake's water surface: the Dead Sea's level drops every year."}},
 {trk:"eretz",
  t:{he:"גובה מעל פני הים",ar:"الارتفاع عن سطح البحر",ru:"Высота над уровнем моря",en:"Height above sea level"},
  d:{he:"מרחק נקודה בשטח מעל מפלס הים. בבקע הוא שלילי — הקרקע נמוכה מפני הים.",ar:"ارتفاع نقطة عن منسوب البحر. وفي الصدع يكون سالبًا — الأرض أخفض من سطح البحر.",ru:"Высота точки над уровнем моря: в разломе она отрицательна — земля ниже уровня моря.",en:"A point's height above sea level: in the rift it is negative, the ground lying below the sea."}},
 {trk:"nativ",
  t:{he:"קנה מידה",ar:"مقياس الرسم",ru:"Масштаб",en:"Map scale"},
  d:{he:"היחס בין מרחק על המפה ובין המרחק באותו קו בשטח.",ar:"النسبة بين مسافة على الخريطة والمسافة نفسها في الواقع.",ru:"Отношение расстояния на карте к тому же расстоянию на местности.",en:"The ratio between a distance on the map and the same distance on the ground."}},
 {trk:"nativ",
  t:{he:"קנה מידה גדול וקטן",ar:"مقياس كبير وصغير",ru:"Крупный и мелкий масштаб",en:"Large and small scale"},
  d:{he:"קנה מידה גדול מראה שטח קטן בפירוט רב, וקנה מידה קטן מראה שטח רחב בפירוט מועט.",ar:"المقياس الكبير يُظهر مساحة صغيرة بتفصيل كثير، والصغير مساحة واسعة بتفصيل قليل.",ru:"Крупный масштаб показывает малую площадь подробно, мелкий — широкую площадь скупо.",en:"A large scale shows a small area in great detail; a small scale a wide area with little."}},

function viewFormulas(){
  var h='<div class="wrap" style="padding-top:22px;padding-bottom:44px">';
  h+='<h2 style="font-size:1.5rem">'+esc(t("cfT"))+'</h2>'+
     '<p style="color:var(--muted);margin:.5rem 0 0">'+esc(t("cfP"))+'</p>';
  TRACKS.forEach(function(tr){
    var items=CONCEPTS.filter(function(c){return c.trk===tr.id});
    if(!items.length)return;
    h+='<div class="trk '+tr.cls+'" style="margin:1.4rem 0 .6rem">'+
       '<div class="thead"><span class="tdot"></span><h2 style="font-size:1.15rem">'+
       esc(t(tr.nk))+'</h2><span class="tpill">'+items.length+'</span></div></div>';
    h+='<div class="grid g2">';
    items.forEach(function(c){
      var term=gl(c.t),def=gl(c.d);
      h+='<div class="card tcard trk '+tr.cls+'" style="cursor:default;text-align:start">'+
        '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:.5rem">'+
        '<h3 style="margin:0">'+esc(term)+'</h3>'+
        spkBtn(term+". "+def,state.lang,false,t("hear"))+'</div>'+
        '<div class="sub">'+esc(def)+'</div></div>';
    });
    h+='</div>';
  });
  return h+'</div>'+fbar();
}

var CH_GATE=/[?&]internal=/.test(location.search||"");
var P={q:null,picked:-1,done:false,slot:[],used:[],ok:false,hint:false};

function hdr(){
  var s=state.screen;
  return '<div class="hbar"><div class="wrap hrow">'+
    '<h1 class="brand">'+esc(t("app"))+'<small>'+esc(t("tagline"))+'</small></h1>'+
    (s==="home"?"":'<button class="gbtn" data-a="home">'+ic("home",16)+" "+esc(t("navHome"))+"</button>")+
    '<button class="gbtn'+(s==="sim"?" on":"")+'" aria-pressed="'+(s==="sim"?"true":"false")+'" data-a="sim">'+ic("play",16)+" "+esc(t("navSim"))+"</button>"+
    /* בנק הטעויות מופיע רק כשיש בו משהו. כפתור שמוביל תמיד
       למסך ריק מלמד להתעלם ממנו. */
    (badList().length?'<button class="gbtn'+(s==="bad"?" on":"")+'" aria-pressed="'+(s==="bad"?"true":"false")+'" data-a="bad">'+ic("redo",16)+" "+
      esc(t("navBad"))+" ("+badList().length+")</button>":"")+
    '<button class="gbtn'+(s==="form"?" on":"")+'" aria-pressed="'+(s==="form"?"true":"false")+'" data-a="form">'+ic("book",16)+" "+esc(t("navForm"))+"</button>"+
    '<button class="gbtn'+(s==="prog"?" on":"")+'" aria-pressed="'+(s==="prog"?"true":"false")+'" data-a="prog">'+ic("chart",16)+" "+esc(t("navProg"))+"</button>"+
    /* מסך המורה נעלם מהכותרת כשנבחר קוד והמכשיר נעול. */
    (teOpen()?'<button class="gbtn'+(view==="marks"?" on":"")+'" aria-pressed="'+(view==="marks"?"true":"false")+'" data-a="marks">'+ic("share",16)+" "+esc(t("navExam"))+"</button>":"")+
    '<button class="gbtn'+(s==="set"?" on":"")+'" aria-pressed="'+(s==="set"?"true":"false")+'" data-a="set">'+ic("gear",16)+" "+esc(t("navSet"))+"</button>"+
    '<span class="hlang" role="group">'+Object.keys(LANGS).map(function(k){
      return '<button class="'+(state.lang===k?"on":"")+'" aria-pressed="'+(state.lang===k?"true":"false")+'" data-a="lang" data-v="'+k+
        '" lang="'+k+'" dir="'+LANGS[k].dir+'">'+esc(LANGS[k].name)+'</button>';
    }).join("")+'</span>'+
  "</div></div>"}

function fbar(){
  return '<div class="fbar"><div class="wrap">'+esc(t("savedNote"))+" · "+BUILD+"</div></div>"}

function vstrip(){
  var st=voiceStatus();
  if(st==="ok")return '<div class="vstrip ok">'+ic("spark",15)+" "+esc(t("vsOk"))+"</div>";
  if(st==="dev")return '<div class="vstrip warn">'+ic("play",15)+" "+esc(t("vsDev"))+
    ' <button class="btn ghost" data-a="set">'+esc(t("vGem"))+"</button></div>";
  return '<div class="vstrip bad">'+ic("x",15)+" <b>"+esc(t("vsNoEn"))+"</b> "+esc(t("vsNoEnD"))+
    ' <button class="btn ghost" data-a="set">'+esc(t("setVoice"))+"</button></div>";
}

function screenHome(){
  var h='<div class="wrap">';
  h+='<div class="card" style="margin:1.1rem 0"><h2 style="font-size:1.5rem">'+esc(t("heroT"))+"</h2>"+
     '<p style="color:var(--muted);margin:.5rem 0 0">'+esc(t("heroP"))+"</p></div>";
  h+=vstrip();
  h+='<div class="card gcard" style="margin:1.1rem 0;background:var(--gold-soft);border-inline-start:5px solid #aa6c0c"><h2 style="font-size:1.1rem">'+esc(t("bgT"))+'</h2>'+
     '<p style="color:var(--muted);margin:.4rem 0;font-size:.95rem">'+esc(t("bgP"))+'</p>'+
     '<p style="margin:.3rem 0 0;font-size:.9rem"><a href="https://pop.education.gov.il/tchumey_daat/geography_adam_sviva/chativa-elyona/" target="_blank" rel="noopener">'+esc(t("bgL1"))+'</a><br>'+
     '<a href="https://pop.education.gov.il/sherutey-tiksuv-bachinuch/focus-matriculation-exams/" target="_blank" rel="noopener">'+esc(t("bgL2"))+'</a></p></div>';
  TRACKS.forEach(function(tr){
    var tops=TOPICS.filter(function(x){return x.trk===tr.id});
    if(!tops.length)return;
    h+='<div class="trk '+tr.cls+'" style="margin:1.4rem 0 .6rem">'+
       '<div class="thead"><span class="tdot"></span><h2 style="font-size:1.15rem">'+
       esc(t(tr.nk))+'</h2><span class="tpill">'+tops.length+"</span></div>"+
       '<p style="color:var(--muted);font-size:.9rem;margin:.25rem 0 0">'+esc(t(tr.dk))+"</p></div>";
    h+='<div class="grid g2">';
    tops.forEach(function(tp){
      var best=0,li;
      for(li=1;li<=3;li++)best=Math.max(best,mastery(tp.id,li));
      h+='<button class="card tcard trk '+tr.cls+'" data-a="open" data-t="'+esc(tp.id)+'">'+
        "<h3>"+esc(tName(tp))+"</h3>"+
        '<div class="sub">'+esc(tDesc(tp))+"</div>"+
        '<div style="display:flex;align-items:center;gap:.5rem;margin-top:.35rem">'+
        '<span class="bar '+barCls(best)+'"><i style="width:'+Math.round(best*100)+'%"></i></span>'+
        '<span class="chip">'+Math.round(best*100)+"%</span></div></button>";
    });
    h+="</div>";
  });
  return h+"</div>"+fbar();
}

function levelBar(tp){
  var h='<div class="lvls">',i;
  for(i=1;i<=3;i++){
    var m=mastery(tp.id,i);
    h+='<button class="lvl'+(state.level===i&&!state.challenge?" on":"")+'" aria-pressed="'+(state.level===i&&!state.challenge?"true":"false")+'" data-a="lvl" data-v="'+i+'">'+
      esc(t("lv"+i))+' <span class="bar '+barCls(m)+'" style="width:2.6rem;flex:none">'+
      '<i style="width:'+Math.round(m*100)+'%"></i></span></button>';
  }
  if(CH_GATE){
    h+='<button class="lvl'+(state.challenge?" on":"")+'" aria-pressed="'+(state.challenge?"true":"false")+'" data-a="chal"'+(state.challenge?' style="background:#6d28d9;color:#fff;border-color:#6d28d9;font-weight:700"':"")+'>'+esc(t("lvC"))+'</button>';
  }
  h+="</div>";
  if(CH_GATE&&state.challenge){
    h+='<div style="display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin:.4rem 0">'+
       '<span style="font-size:.88rem;color:var(--muted)">'+esc(t("chMixed"))+'</span>'+
       '<span style="font-size:.88rem;color:var(--muted)">· '+esc(t("chTimer"))+':</span>'+
       [0,30,60].map(function(s){
         return '<button class="lvl'+(state.chSecs===s?" on":"")+'" aria-pressed="'+(state.chSecs===s?"true":"false")+'" data-a="chsec" data-v="'+s+'" style="min-height:46px">'+(s===0?esc(t("chOff")):esc(t("chSec").replace("{0}",s)))+'</button>';
       }).join("")+'</div>';
  }
  return h;
}

function spkBtn(text,lang,slow,label){
  return '<button class="spk'+(slow?" sm":"")+'" data-a="say" data-say="'+esc(text)+
    '" data-lang="'+esc(lang)+'"'+(slow?' data-slow="1"':"")+
    ' aria-label="'+esc(label||t("hear"))+'">'+(slow?ic("slow",15):'\u266b '+esc(label||t("hear")))+"</button>";
}
function spkStop(){
  return '<button class="spk spkStop" data-a="stop" aria-label="'+esc(t("stopB"))+'">'+esc(t("stopB"))+"</button>";
}

/* כרטיס הנושא: מה שמוצג מעל האפשרויות. בהיסטוריה זו כותרת
   האירוע או המושג, ולצידה כפתורי השמעה בשפת הממשק. */
function leadBox(txt,sub){
  if(!txt)return "";
  return '<div class="subject"><span class="word" style="font-size:1.15rem">'+esc(txt)+"</span>"+
    (sub?'<span class="ipa">'+esc(sub)+"</span>":"")+
    '<span style="margin-inline-start:auto;display:flex;gap:.4rem">'+
    spkBtn(txt,state.lang,false,t("hearWord"))+spkBtn(txt,state.lang,true,t("hearSlow"))+spkStop()+"</span></div>";
}

/* נוסח השאלה, ולצידו כפתורי השמעה. באזרחות השאלה היא משפט שלם
   ולא מילה בודדת, ולכן היא יושבת בשורה משלה ולא בתוך שורת נושא. */
function askBox(txt){
  if(!txt)return "";
  return '<div class="subject" style="align-items:flex-start">'+
    '<span class="qtext" style="flex:1;margin:0">'+esc(txt)+"</span>"+
    '<span style="display:flex;gap:.4rem;flex:none">'+
    spkBtn(txt,state.lang,false,t("hearWord"))+spkBtn(txt,state.lang,true,t("hearSlow"))+spkStop()+"</span></div>";
}

function screenPractice(){
  var tp=topicOf(state.topic); if(!tp){state.screen="home";return screenHome()}
  var tr=trackOf(tp.trk), q=P.q;
  var h='<div class="wrap"><div class="trk '+tr.cls+'">';
  h+='<div style="display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin:1rem 0 .6rem">'+
     '<span class="tdot"></span><h2 style="font-size:1.2rem">'+esc(tName(tp))+"</h2>"+
     '<span class="tpill">'+esc(t(tr.nk))+"</span></div>";
  h+=levelBar(tp);
  h+='<p style="color:var(--muted);font-size:.88rem;margin:.5rem 0 .8rem">'+esc(t("lv"+state.level+"D"))+"</p>";
  h+=vstrip();
  if(!q)return h+"</div></div>"+fbar();

  h+='<div class="card qcard">';
  h+='<div class="qtop"><span class="chip">'+esc(q.prompt)+"</span>"+
     '<span class="chip" style="margin-inline-start:auto">'+esc(t("todayL"))+" "+(state.day.n||0)+"</span></div>";

  h+=askBox(q.lead||"");
  /* האיור, כשיש. הוא אינו נדרש לפתרון — הוא מראה במבט אחד את
     מה שהטקסט מתאר במילים, ולכן הוא עוזר בדיוק למי שהטקסט
     מכביד עליו. */
  if(q.fig)h+=q.fig;

  {
    h+='<div class="opts'+(q.opts.length>3?"":" two")+'" id="opts">';
    /* רמקול לכל אפשרות, כמו באנגלית: מי שאינו יודע לקרוא את הניסוח
       לא יכול לבחור בו. הקראת אפשרות אינה הסגרת תשובה — היא זמינה
       על כל ארבע במידה שווה, והמעקב הצהוב עובד כמו בנוסח השאלה. */
    q.opts.forEach(function(o,i){
      var cls="opt";
      if(P.done){
        if(o.ok)cls+=" ok";
        else if(i===P.picked)cls+=" bad";
        else cls+=" dim";
      }
      var ob='<button class="'+cls+'" data-a="pick" data-i="'+i+'"'+(P.done?" disabled":"")+'>'+
        '<span class="k">'+String.fromCharCode(65+i)+"</span><span>"+o.h+"</span></button>";
      h+='<div class="orow">'+ob+
        '<button class="spk sm" data-a="say" data-say="'+esc(plainOf(o.h))+'" data-lang="'+esc(state.lang)+
        '" aria-label="'+esc(t("hearOpt"))+'">'+ic("play",15)+"</button></div>";
    });
    h+="</div>";
  }

  if(P.done){
    var it=q.reveal;
    h+='<div class="fb '+(P.ok?"ok":"bad")+'"><b>'+(P.ok?esc(t("correct")):esc(t("wrong")))+"</b>";
    if(!P.ok){h+='<div class="body">'+esc(t("answerIs"))+" <b>"+esc(q.answer)+"</b></div>"+
      (P.timeUp?'<div class="body" style="color:#b45309;font-weight:700">'+esc(t("chTimeUp"))+'</div>':"");}
    /* ההסבר נפתח גם כשצדקו. תשובה נכונה שנוחשה נראית בדיוק כמו

/* ============================================================
   מבחן מדומה
   ------------------------------------------------------------
   עשרים שאלות מכל הנושאים ומכל הרמות, בחוברת אחת שגוללים בה —
   ולא שאלה־שאלה. מי שקורא לאט צריך לראות כמה נשאר, לחזור אחורה
   ולשנות תשובה; ניווט שמסתיר את שאר השאלות לוקח ממנו בדיוק את זה.

   המבחן אינו נשמר. הוא מצב זמני בזיכרון בלבד, ורענון הדף מתחיל
   אותו מחדש — זו הצהרה ולא פער: שעון שממשיך לרוץ בין ביקורים
   הוא בדיוק המקום שבו נולדים באגים שקשה לשחזר.
   ============================================================ */
var SIM_N=20, SIM_MIN=30;
var SIM={on:false,done:false,q:[],ans:[],end:0,tick:null};

function simStop(){if(SIM.tick){clearInterval(SIM.tick);SIM.tick=null}}
function simFmt(ms){
  if(ms<0)ms=0;
  var sec=Math.round(ms/1000),m=Math.floor(sec/60),c=sec%60;
  return m+":"+(c<10?"0":"")+c;
}
function simLeftN(){
  var n=0,i;
  for(i=0;i<SIM.ans.length;i++)if(SIM.ans[i]<0)n++;
  return n;
}
function simRight(){
  var n=0,i;
  for(i=0;i<SIM.q.length;i++)if(SIM.ans[i]>=0&&SIM.q[i].opts[SIM.ans[i]].ok)n++;
  return n;
}
/* שתי שאלות זהות במבחן אחד אינן "חזרה" אלא תקלה. הבדיקה הייתה
   על q.id, שהוא נושא|רמה|אינדקס — ולכן אותו פריט שהוגש גם ברמה 2
   וגם ברמה 3 נספר כשתי שאלות שונות. ההשוואה כאן היא על הפריט
   עצמו (q.reveal), ולכן היא נכונה גם כשלרמות יש מאגרים נפרדים. */
function simSeen(qs,q){
  for(var k=0;k<qs.length;k++)if(qs[k].reveal===q.reveal)return true;
  return false;
}
function simStart(){
  var pairs=[],qs=[],i,q;
  TOPICS.forEach(function(tp){for(var l=1;l<=3;l++)pairs.push([tp.id,l])});
  shuffle(pairs);
  for(i=0;i<pairs.length&&qs.length<SIM_N;i++){
    q=buildQuestion(pairs[i][0],pairs[i][1],undefined,true);
    if(q&&!simSeen(qs,q))qs.push(q);
  }
  /* פחות צמדי נושא-רמה מ-SIM_N: סבב נוסף, בלי לחזור על אותו פריט. */
  var guard=0;
  while(qs.length<SIM_N&&guard<400){
    var pr=pairs[guard%pairs.length]; guard++;
    q=buildQuestion(pr[0],pr[1],undefined,true);
    if(!q)continue;
    if(!simSeen(qs,q))qs.push(q);
  }
  SIM.q=qs;
  SIM.ans=qs.map(function(){return -1});
  SIM.on=true; SIM.done=false; SIM.end=Date.now()+SIM_MIN*60000;
  simArm();
}
function simArm(){
  simStop();
  if(SIM.on&&!SIM.done)SIM.tick=setInterval(simClock,1000);
}
function simClock(){
  var el=$("#simclock");
  /* המסך הוחלף — אין מה לעדכן, והשעון נעצר מעצמו. */
  if(!el){simStop();return}
  var left=SIM.end-Date.now();
  el.textContent=simFmt(left);
  if(left<=60000)el.classList.add("low");
  if(left<=0){simStop();simSubmit()}
}
/* ההגשה היא גם רגע הרישום: עד כאן לא נספרה אף תשובה, כדי
   שהמבחן לא ידחוף לבנק הטעויות שאלה שהנבחן עוד עמד לשנות. */
function simSubmit(){
  if(!SIM.on||SIM.done)return;
  simStop();
  var i;
  for(i=0;i<SIM.q.length;i++){
    var q=SIM.q[i],pk=SIM.ans[i];
    recordItem(q.tid,q.lv,q.id,pk>=0&&!!q.opts[pk].ok);
  }
  SIM.done=true; save(); render(); window.scrollTo(0,0);
}

function screenSim(){
  var h='<div class="wrap"><h2 style="margin:1.1rem 0 .3rem;font-size:1.4rem">'+esc(t("simT"))+"</h2>";
  if(!SIM.on){

    return h+"</div>"+fbar();

  if(SIM.done){
    var right=simRight(),pc=Math.round(100*right/Math.max(1,SIM.q.length));

      h+='<div class="simq"><div class="simn">'+esc(t("simQ"))+" "+(i+1)+" · "+

         '<div class="body">'+esc(t("simYours"))+": <b>"+
         esc(pk>=0?plainOf(q.opts[pk].h):t("simNone"))+"</b><br>"+
         esc(t("answerIs"))+" <b>"+esc(q.answer)+"</b></div>";
      if(q.reveal&&q.reveal.ex)
        h+='<div class="why"><b>'+esc(t("whyT"))+":</b> "+esc(gl(q.reveal.ex))+"</div>";
      h+="</div>";

         spkBtn(saySpell(q.say),state.lang,true,t("hearSlow"))+spkStop()+"</div>";
      h+="</div>";
    });
    return h+"</div>"+fbar();
  }
  /* המבחן עצמו. השעון נדרך אחרי הציור, כי הוא מעדכן אלמנט
     שעדיין לא קיים בזמן שבניית ה-HTML רצה. */
  setTimeout(simArm,0);
  h+='<div class="simbar"><span class="clock" id="simclock">'+esc(simFmt(SIM.end-Date.now()))+"</span>"+
     '<span class="chip"><span id="simleft">'+simLeftN()+"</span> "+esc(t("simLeft"))+"</span>"+
     '<button class="btn pri" data-a="simsubmit" style="margin-inline-start:auto">'+
     esc(t("simSubmit"))+"</button></div>";
  SIM.q.forEach(function(q,i){
    h+='<div class="simq"><div class="simn">'+esc(t("simQ"))+" "+(i+1)+" / "+SIM.q.length+"</div>";
    h+=askBox(q.lead||"");
    if(q.fig)h+=q.fig;
    h+='<div class="opts">';
    q.opts.forEach(function(o,j){
      h+='<button class="opt'+(SIM.ans[i]===j?" sel":"")+'" data-a="simpick" data-i="'+i+
        '" data-j="'+j+'"><span class="k">'+String.fromCharCode(65+j)+"</span><span>"+o.h+"</span></button>";
    });
    h+="</div></div>";
  });
  h+='<div style="margin:1rem 0"><button class="btn pri" data-a="simsubmit">'+
     esc(t("simSubmit"))+"</button></div>";
  return h+"</div>"+fbar();
}
