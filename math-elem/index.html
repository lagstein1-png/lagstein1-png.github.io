body{margin:0;background:var(--paper);color:var(--ink);font-family:"Heebo",system-ui,"Segoe UI",Arial,sans-serif;line-height:1.5;-webkit-text-size-adjust:100%}

button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:12px 14px 120px}
.top{display:flex;align-items:center;gap:6px;margin-bottom:10px}

.langs{display:flex;gap:4px}

.langs button[aria-pressed=true]{background:var(--teal-deep);color:#fff}
.gear{min-width:46px;padding:0;min-height:50px;border-radius:14px;border:2px solid var(--violet);background:var(--card)}
h1{font-size:1.6rem;margin:.2em 0 .1em;line-height:1.25}
h2{font-size:1.25rem;margin:.2em 0}
.sub{color:var(--ink-soft);margin:0 0 12px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:10px 20px;border-radius:16px;border:0;font-weight:800;font-size:1rem;color:#fff;background:var(--teal-deep);box-shadow:0 3px 0 rgba(0,0,0,.18)}

.btn.stop,.btn.slow{padding:10px 14px}

.btn.slow{background:var(--sky-deep)}
.btn.hint{background:var(--amber);color:#1a1300}
.btn.ex{background:var(--violet)}
.btn.next{background:var(--teal-deep);font-size:1.15rem;min-height:62px}
.btn.tut{background:var(--card);color:var(--violet-deep);border:3px solid var(--violet);width:100%;box-shadow:none;justify-content:flex-start}

.qtext{font-size:1.45rem;font-weight:700;line-height:1.4;margin:6px 0 8px}

.opt.good .mk{color:var(--green-deep)}

.ok-box{background:#e4f7ea;border:3px solid var(--green);border-radius:18px;padding:12px 14px;margin:12px 0;font-size:1.15rem;font-weight:700}

.credit{font-size:.8rem;color:var(--ink-soft);text-align:center;margin-top:20px}
.credit a{color:var(--sky-deep)}
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:50}
.stepcard svg text{font-family:inherit}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.nl{direction:ltr}
.srOnly{position:absolute;inset-inline-start:-9999px}

  {t:L("כדי לדעת בכמה אחד ארוך מהשני, מסתכלים כמה נשאר אחרי שהקצר נגמר.","لنعرف بكم يزيد أحدهما على الآخر ننظر كم بقي بعد نهاية الأقصر.","Чтобы узнать, на сколько один длиннее, смотрим, сколько остаётся после конца короткого.","To see how much longer one is, look at what is left after the short one ends."),v:function(){return twoBars(9,5)}}],
 time:[{t:L("בשעון יש שני מחוגים. המחוג הקצר מראה שעות. המחוג הארוך מראה דקות.","للساعة عقربان. القصير للساعات والطويل للدقائق.","У часов две стрелки. Короткая показывает часы, длинная — минуты.","A clock has two hands. The short hand shows hours. The long hand shows minutes."),v:function(){return clockVis(3,0)}},
  {t:L("כשהמחוג הארוך על 12, זו שעה עגולה. כשהוא על 6, עברה חצי שעה: 30 דקות.","عندما يكون العقرب الطويل على 12 فالساعة تامة. وعلى 6 مرّت نصف ساعة: 30 دقيقة.","Длинная стрелка на 12 — ровно час. На 6 — половина часа: 30 минут.","Long hand on 12 means o'clock. On 6 means half past: 30 minutes."),v:function(){return clockVis(7,30)}},
  {t:L("שבעה ימים בשבוע: ראשון, שני, שלישי, רביעי, חמישי, שישי, שבת.","سبعة أيام في الأسبوع: الأحد، الاثنين، الثلاثاء، الأربعاء، الخميس، الجمعة، السبت.","В неделе семь дней: воскресенье, понедельник, вторник, среда, четверг, пятница, суббота.","Seven days in a week: Sunday, Monday, Tuesday, Wednesday, Thursday, Friday, Saturday."),v:function(){return ""}},
  {t:L("רבע שעה הם 15 דקות. המחוג הארוך על 3 הוא רבע אחרי. על 9 הוא רבע לפני.","ربع الساعة 15 دقيقة. العقرب الطويل عند 3 يعني والربع. وعند 9 يعني إلا ربعًا.","Четверть часа — 15 минут. Длинная стрелка на 3 — четверть после. На 9 — без четверти.","A quarter hour is 15 minutes. Long hand on 3 is quarter past. On 9 it is quarter to."),v:function(){return clockVis(4,15)}}],
 money:[{t:L("בישראל משלמים בשקלים. יש מטבעות של 1, 2, 5 ו-10 שקלים, ושטרות של 20, 50 ו-100.","في إسرائيل ندفع بالشيكل. هناك قطع من 1 و2 و5 و10 شيكل وأوراق من 20 و50 و100.","В Израиле платят шекелями. Есть монеты 1, 2, 5 и 10 шекелей и купюры 20, 50 и 100.","In Israel we pay in shekels. There are coins of 1, 2, 5 and 10, and notes of 20, 50 and 100."),v:function(){return moneyVis([10,5,2,1,20])}},
  {t:L("כדי לספור כסף, מתחילים מהערך הגדול ומוסיפים עוד ועוד. 10, 15, 17, 18.","لنعدّ النقود نبدأ بالأكبر ونضيف. 10، 15، 17، 18.","Чтобы посчитать деньги, начни с большего и прибавляй. 10, 15, 17, 18.","To count money, start with the biggest and keep adding. 10, 15, 17, 18."),v:function(){return moneyVis([10,5,2,1])}},
  {t:L("עודף הוא מה ששילמנו פחות המחיר. שילמת 10 על מחיר 6? העודף הוא 4.","الباقي هو ما دفعناه ناقص الثمن. دفعت 10 والثمن 6؟ الباقي 4.","Сдача — это то, что заплатили, минус цена. Заплатил 10, цена 6? Сдача 4.","Change is what you pay minus the price. Paid 10 for a price of 6? The change is 4."),v:function(){return moneyVis([10])}}],
 pattern:[{t:L("חוקיות היא משהו שחוזר על עצמו. אדום, כחול, אדום, כחול... ואחריו בא אדום.","النمط شيء يتكرر. أحمر، أزرق، أحمر، أزرق... وبعده يأتي الأحمر.","Закономерность — это то, что повторяется. Красный, синий, красный, синий... дальше красный.","A pattern is something that repeats. Red, blue, red, blue... and then comes red."),v:function(){return seqVis([{k:"circle",c:COL.red},{k:"circle",c:COL.blue},{k:"circle",c:COL.red},{k:"circle",c:COL.blue},null])}},
  {t:L("גם מספרים יכולים להיות חוקיות. 2, 4, 6, 8: עולים ב-2 כל פעם.","حتى الأعداد قد تكوّن نمطًا. 2، 4، 6، 8: يزيد 2 كل مرة.","Числа тоже бывают закономерностью. 2, 4, 6, 8: каждый раз плюс 2.","Numbers can make a pattern too. 2, 4, 6, 8: it goes up by 2 each time."),v:function(){return numLine(0,10,1,8,false)}},
  {t:L("כדי למצוא את החוק, בודקים בכמה כל מספר שונה מהקודם.","لنجد القاعدة نفحص بكم يختلف كل عدد عن السابق.","Чтобы найти правило, проверь, на сколько каждое число отличается от предыдущего.","To find the rule, check how much each number differs from the one before."),v:function(){return ""}}],
 frac:[{t:L("חצי הוא אחד משני חלקים שווים. רבע הוא אחד מארבעה חלקים שווים.","النصف جزء من جزأين متساويين. الربع جزء من أربعة أجزاء متساوية.","Половина — одна из двух равных частей. Четверть — одна из четырёх равных частей.","A half is one of two equal parts. A quarter is one of four equal parts."),v:function(){return fracVis("circle",2,1)+fracVis("circle",4,1)}},
  {t:L("חצי מכמות: מחלקים לשתי קבוצות שוות. חצי מ-8 הוא 4.","نصف كمية: نقسم إلى مجموعتين متساويتين. نصف 8 هو 4.","Половина количества: раздели на две равные группы. Половина от 8 — это 4.","Half of an amount: split into two equal groups. Half of 8 is 4."),v:function(){return dotsVis(8)}},
  {t:L("שני חצאים הם שלם אחד. ארבעה רבעים הם שלם אחד.","نصفان يساويان واحدًا صحيحًا. أربعة أرباع تساوي واحدًا صحيحًا.","Две половины — это целое. Четыре четверти — это целое.","Two halves make one whole. Four quarters make one whole."),v:function(){return fracVis("rect",2,2)+fracVis("rect",4,4)}},
  {t:L("רבע מכמות: מחלקים לארבע קבוצות שוות. רבע מ-12 הוא 3.","ربع كمية: نقسم إلى أربع مجموعات متساوية. ربع 12 هو 3.","Четверть количества: раздели на четыре равные группы. Четверть от 12 — это 3.","A quarter of an amount: split into four equal groups. A quarter of 12 is 3."),v:function(){return dotsVis(12)}}],
 data:[{t:L("תרשים תמונות מראה כמויות בעזרת סימנים. כל כוכב הוא פריט אחד, ואפשר לספור אותם.","الرسم بالصور يعرض الكميات برموز. كل نجمة قطعة واحدة ويمكن عدّها.","Картинная диаграмма показывает количества значками. Одна звёздочка — один предмет, их можно считать.","A picture chart shows amounts with symbols. Each star is one item and you can count them."),v:function(){return pictoVis([FRU[0].he,FRU[1].he,FRU[2].he],[3,5,2])}},
  {t:L("השורה הארוכה ביותר היא הכמות הגדולה ביותר.","أطول صف هو أكبر كمية.","Самый длинный ряд — самое большое количество.","The longest row is the biggest amount."),v:function(){return ""}},
  {t:L("כדי לדעת בכמה יש יותר, מחסרים. כדי לדעת כמה בסך הכול, מחברים.","لنعرف بكم أكثر نطرح. ولنعرف المجموع نجمع.","Чтобы узнать, на сколько больше, вычитаем. Чтобы узнать, сколько всего, складываем.","To find how many more, subtract. To find the total, add."),v:function(){return ""}},
  {t:L("סימני ספירה: ארבעה קווים וקו אלכסוני על ארבעתם הם חבילה של 5.","علامات العدّ: أربعة خطوط وخط مائل عليها تساوي حزمة من 5.","Палочки: четыре чёрточки и одна косая поперёк — это пучок из 5.","Tally marks: four lines with a slanted line across make a bundle of 5."),v:function(){return tallyVis(8)}}],
 words:[{t:L("קוראים את הסיפור לאט. שואלים: מה יש? מה קורה? מה שואלים?","نقرأ القصة ببطء. نسأل: ماذا عندنا؟ ماذا يحدث؟ ماذا المطلوب؟","Читаем историю медленно. Спрашиваем: что есть? что происходит? что спрашивают?","Read the story slowly. Ask: what do we have? what happens? what is asked?"),v:function(){return ""}},
  {t:L("אם מקבלים עוד, מחברים. אם נותנים או נשאר פחות, מחסרים.","إذا حصلنا على المزيد نجمع. وإذا أعطينا أو بقي أقل نطرح.","Если прибавилось — складываем. Если отдали или стало меньше — вычитаем.","If we get more, we add. If we give away or have less, we subtract."),v:function(){return ""}},
  {t:L("כשיש שני צעדים, פותרים אחד־אחד. קודם הצעד הראשון, אחר כך השני.","عندما تكون الخطوات اثنتين نحلّ واحدة بعد الأخرى. الأولى ثم الثانية.","Если шагов два, решаем по очереди: сначала первый, потом второй.","With two steps, solve one at a time. First step first, then the second."),v:function(){return ""}}]

LESSONS.big=[{t:L("בכל מספר יש מקומות: אחדות, עשרות, מאות ואלפים. במספר 4,236 יש 4 אלפים, 2 מאות, 3 עשרות ו-6 אחדות.","في كل عدد منازل: آحاد وعشرات ومئات وآلاف. في 4,236: 4 آلاف و2 مئات و3 عشرات و6 آحاد.","В числе есть разряды: единицы, десятки, сотни и тысячи. В числе 4 236: 4 тысячи, 2 сотни, 3 десятка и 6 единиц.","Every number has places: ones, tens, hundreds and thousands. In 4,236 there are 4 thousands, 2 hundreds, 3 tens and 6 ones."),v:function(){return ""}},
 {t:L("להשוות: קודם כמה ספרות יש, ואחר כך משווים מהספרה השמאלית. 5,200 גדול מ-4,999.","للمقارنة: نعدّ الأرقام أولًا ثم نقارن من اليسار. 5,200 أكبر من 4,999.","Сравнение: сначала число цифр, потом слева направо. 5 200 больше, чем 4 999.","To compare: count the digits first, then compare from the left. 5,200 is bigger than 4,999."),v:function(){return ""}},
 {t:L("עיגול: מסתכלים על הספרה שאחרי. 5 ומעלה, עולים. 4 ומטה, נשארים. 47 מעוגל לעשרות הוא 50.","التقريب: انظر إلى الرقم التالي. 5 فأكثر نقرّب لأعلى. 4 فأقل نبقى. 47 إلى أقرب عشرة هو 50.","Округление: смотрим на следующую цифру. 5 и больше — вверх, 4 и меньше — остаёмся. 47 до десятков — 50.","Rounding: look at the next digit. 5 or more goes up, 4 or less stays. 47 rounded to tens is 50."),v:function(){return numLine(40,50,1,47,false)}}];
LESSONS.mult=[{t:L("כפל הוא חיבור של קבוצות שוות. 4 קופסאות עם 3 עוגיות: 3 + 3 + 3 + 3 = 12, וגם 4 × 3 = 12.","الضرب جمع مجموعات متساوية. 4 علب في كل منها 3 كعكات: 3+3+3+3 = 12 وأيضًا 4 × 3 = 12.","Умножение — это сложение равных групп. 4 коробки по 3 печенья: 3+3+3+3 = 12, то есть 4 × 3 = 12.","Multiplication is adding equal groups. 4 boxes with 3 cookies: 3+3+3+3 = 12, and 4 × 3 = 12."),v:function(){return dotsVis(12)}},
 {t:L("חילוק הוא חלוקה שווה. 12 עוגיות ל-4 ילדים: לכל ילד 3, כי 12 ÷ 4 = 3.","القسمة توزيع بالتساوي. 12 كعكة على 4 أطفال: لكل طفل 3 لأن 12 ÷ 4 = 3.","Деление — это равный раздел. 12 печений на 4 детей: каждому по 3, ведь 12 ÷ 4 = 3.","Division is sharing equally. 12 cookies for 4 children: 3 each, because 12 ÷ 4 = 3."),v:function(){return ""}},
 {t:L("כפל וחילוק הם זוג: אם 4 × 3 = 12, אז 12 ÷ 3 = 4.","الضرب والقسمة زوج: إذا كان 4 × 3 = 12 فإن 12 ÷ 3 = 4.","Умножение и деление — пара: если 4 × 3 = 12, то 12 ÷ 3 = 4.","Multiplication and division are partners: if 4 × 3 = 12, then 12 ÷ 3 = 4."),v:function(){return ""}}];
LESSONS.frac2=[{t:L("כשמחלקים לעוד חלקים, כל חלק קטן יותר. לכן שליש גדול מחמישית.","كلما زادت الأجزاء صغر كل جزء. لذلك الثلث أكبر من الخمس.","Чем больше частей, тем меньше каждая. Поэтому треть больше пятой части.","The more parts, the smaller each one. So a third is bigger than a fifth."),v:function(){return fracBars(1,3,1,5)}},
 {t:L("שברים שווים: חצי הוא 2 חלקים מתוך 4. 1/2 = 2/4.","كسور متكافئة: النصف هو جزءان من 4. 1/2 = 2/4.","Равные дроби: половина — это 2 части из 4. 1/2 = 2/4.","Equal fractions: a half is 2 parts out of 4. 1/2 = 2/4."),v:function(){return fracBars(1,2,2,4)}},
 {t:L("שבר של כמות: מחלקים במכנה וכופלים במונה. 3/4 מ-12: 12 ÷ 4 = 3, ו-3 × 3 = 9.","كسر من كمية: نقسم على المقام ونضرب في البسط. 3/4 من 12: 12 ÷ 4 = 3 ثم 3 × 3 = 9.","Дробь от числа: делим на знаменатель и умножаем на числитель. 3/4 от 12: 12 ÷ 4 = 3, 3 × 3 = 9.","Fraction of an amount: divide by the bottom, multiply by the top. 3/4 of 12: 12 ÷ 4 = 3, 3 × 3 = 9."),v:function(){return dotsVis(12)}}];
LESSONS.area=[{t:L("שטח הוא כמה ריבועי יחידה ממלאים את הצורה. מלבן 4 על 3 מכיל 12 ריבועים.","المساحة هي عدد مربعات الوحدة التي تملأ الشكل. مستطيل 4 في 3 فيه 12 مربعًا.","Площадь — сколько единичных квадратов заполняет фигуру. В прямоугольнике 4 на 3 — 12 квадратов.","Area is how many unit squares fill the shape. A 4 by 3 rectangle holds 12 squares."),v:function(){return gridVis(4,3,true)}},
 {t:L("היקף הוא הדרך מסביב: מחברים את כל הצלעות. מלבן 4 על 3: 4 + 3 + 4 + 3 = 14.","المحيط هو الطريق حول الشكل: نجمع كل الأضلاع. مستطيل 4 في 3: 4+3+4+3 = 14.","Периметр — путь вокруг: складываем все стороны. Прямоугольник 4 на 3: 4+3+4+3 = 14.","Perimeter is the way around: add all the sides. A 4 by 3 rectangle: 4+3+4+3 = 14."),v:function(){return rectLab(4,3)}},
 {t:L("שטח = אורך × רוחב. היקף = חיבור כל הצלעות. בריבוע כל הצלעות שוות.","المساحة = الطول × العرض. المحيط = مجموع الأضلاع. في المربع كل الأضلاع متساوية.","Площадь = длина × ширина. Периметр = сумма сторон. У квадрата все стороны равны.","Area = length × width. Perimeter = sum of the sides. In a square all sides are equal."),v:function(){return rectLab(5,5)}}];
LESSONS.angles=[{t:L("זווית נוצרת כששני קווים נפגשים בנקודה. זווית ישרה היא כמו פינה של דף: 90 מעלות.","تتكوّن الزاوية عندما يلتقي خطان في نقطة. الزاوية القائمة مثل زاوية الورقة: 90 درجة.","Угол образуется, когда две линии встречаются в точке. Прямой угол — как угол листа: 90 градусов.","An angle forms when two lines meet at a point. A right angle is like the corner of a page: 90 degrees."),v:function(){return angleVis(90)}},
 {t:L("זווית חדה קטנה מ-90 מעלות.","الزاوية الحادة أصغر من 90 درجة.","Острый угол меньше 90 градусов.","An acute angle is smaller than 90 degrees."),v:function(){return angleVis(45)}},
 {t:L("זווית קהה גדולה מ-90 מעלות.","الزاوية المنفرجة أكبر من 90 درجة.","Тупой угол больше 90 градусов.","An obtuse angle is bigger than 90 degrees."),v:function(){return angleVis(130)}}];
LESSONS.units2=[{t:L("1 מטר הוא 100 סנטימטרים. 1 קילוגרם הוא 1000 גרם. 1 ליטר הוא 1000 מיליליטרים.","1 متر = 100 سنتيمتر. 1 كيلوغرام = 1000 غرام. 1 لتر = 1000 ملليلتر.","1 метр = 100 сантиметров. 1 килограмм = 1000 граммов. 1 литр = 1000 миллилитров.","1 meter is 100 centimeters. 1 kilogram is 1000 grams. 1 liter is 1000 milliliters."),v:function(){return barRuler(0,10,12)}},
 {t:L("כדי לדעת מתי משהו נגמר, מוסיפים דקות. 2:30 ועוד 45 דקות: 3:15.","لنعرف متى ينتهي شيء نضيف الدقائق. 2:30 + 45 دقيقة = 3:15.","Чтобы узнать, когда всё закончится, прибавляем минуты. 2:30 плюс 45 минут — 3:15.","To know when something ends, add the minutes. 2:30 plus 45 minutes is 3:15."),v:function(){return clockVis(3,15)}},
 {t:L("כשיש שתי יחידות, הופכים הכול ליחידה הקטנה ומחברים. 2 ק״ג ו-500 גרם = 2500 גרם.","عندما توجد وحدتان نحوّل الكل إلى الأصغر ونجمع. 2 كغ و500 غرام = 2500 غرام.","Если две единицы, переведи всё в меньшую и сложи. 2 кг и 500 г = 2500 г.","With two units, turn everything into the smaller one and add. 2 kg and 500 g = 2500 g."),v:function(){return ""}}];
LESSONS.bars=[{t:L("בתרשים עמודות כל עמודה מראה כמות. גובה העמודה הוא הכמות, ואת המספרים רואים בצד.","في الرسم بالأعمدة يعرض كل عمود كمية. ارتفاع العمود هو الكمية والأعداد على الجانب.","В столбчатой диаграмме каждый столбик показывает количество. Высота — это количество, числа сбоку.","In a bar chart each bar shows an amount. The height is the amount, and the numbers are on the side."),v:function(){return barChart([FRU[0].he,FRU[1].he,FRU[2].he,FRU[3].he],[4,7,3,6],10)}},
 {t:L("העמודה הגבוהה ביותר היא הכמות הגדולה ביותר.","أعلى عمود هو أكبر كمية.","Самый высокий столбик — самое большое количество.","The tallest bar is the biggest amount."),v:function(){return ""}},
 {t:L("כדי לדעת בכמה יש יותר, מחסרים. בסך הכול מחברים את כל העמודות.","لنعرف بكم أكثر نطرح. وللمجموع نجمع كل الأعمدة.","Чтобы узнать, на сколько больше, вычитаем. Для общего числа складываем все столбики.","To see how many more, subtract. For the total, add all the bars."),v:function(){return ""}}];

LESSONS.dec=[{t:L("עשירית היא חלק אחד מעשרה. כותבים אותה 0.1. שלוש עשיריות הן 0.3.","العُشر جزء من عشرة. نكتبه 0.1. ثلاثة أعشار هي 0.3.","Одна десятая — это одна часть из десяти. Пишем 0.1. Три десятых — это 0.3.","A tenth is one part out of ten. We write 0.1. Three tenths is 0.3."),v:function(){return tenthsBar(3)}},
 {t:L("על ציר המספרים בין 0 ל-1 יש עשרה צעדים. כל צעד הוא 0.1.","على خط الأعداد بين 0 و1 عشر خطوات. كل خطوة 0.1.","На числовой прямой между 0 и 1 десять шагов. Каждый шаг — 0.1.","On the number line between 0 and 1 there are ten steps. Each step is 0.1."),v:function(){return decLine(0.4)}},
 {t:L("מחברים ומחסרים עשיריות כמו מספרים שלמים: 0.3 + 0.4 זה 3 + 4 = 7 עשיריות, כלומר 0.7.","نجمع ونطرح الأعشار كالأعداد الصحيحة: 0.3 + 0.4 يعني 3 + 4 = 7 أعشار، أي 0.7.","Десятые складываем как целые числа: 0.3 + 0.4 — это 3 + 4 = 7 десятых, то есть 0.7.","Add tenths like whole numbers: 0.3 + 0.4 is 3 + 4 = 7 tenths, so 0.7."),v:function(){return tenthsBar(7)}}];
LESSONS.coord=[{t:L("כדי למצוא נקודה על הרשת: קודם הולכים ימינה, ואחר כך עולים. כותבים (ימינה, למעלה).","لإيجاد نقطة على الشبكة: نمشي يمينًا ثم نصعد. نكتب (يمينًا، للأعلى).","Чтобы найти точку на сетке: сначала вправо, потом вверх. Пишем (вправо, вверх).","To find a point on the grid: go right first, then up. We write (right, up)."),v:function(){return coordVis([[4,3]])}},
 {t:L("שתי נקודות עם שמות: כל אחת יש לה שני מספרים.","نقطتان باسمين: لكل واحدة عددان.","Две точки с именами: у каждой по два числа.","Two named points: each one has two numbers."),v:function(){return coordVis([[2,5,"A"],[5,2,"B","#2f7fd8"]])}},
 {t:L("קו סימטריה הוא קו קיפול: שני החלקים זהים. לריבוע יש ארבעה כאלה.","محور التماثل خط طي: الجزآن متطابقان. للمربع أربعة محاور.","Ось симметрии — линия сгиба: две части одинаковы. У квадрата их четыре.","A line of symmetry is a fold line: both parts match. A square has four of them."),v:function(){return svg(120,120,'<rect x="20" y="20" width="80" height="80" fill="#ffe3de" stroke="#17333c" stroke-width="3"/><line x1="60" y1="10" x2="60" y2="110" stroke="#e8453c" stroke-width="3" stroke-dasharray="7 5"/>',"")}}];
LESSONS.mon2=[{t:L("בבעיה בשני צעדים עושים צעד אחד, ואז צעד שני עם התוצאה.","في المسألة بخطوتين نفعل خطوة ثم خطوة ثانية بالنتيجة.","В задаче в два шага делаем один шаг, потом второй с результатом.","In a two-step problem you do one step, then a second step with the result."),v:function(){return ""}},
 {t:L("כשקונים כמה דברים שווים, קודם כופלים: מחיר אחד כפול כמות.","عند شراء عدة أشياء متساوية نضرب أولًا: السعر × العدد.","Если покупаем несколько одинаковых вещей, сначала умножаем: цена × количество.","When you buy several equal things, multiply first: price × amount."),v:function(){return ""}},
 {t:L("עודף הוא מה ששילמנו פחות המחיר. מחסרים את המחיר מהתשלום.","الباقي هو ما دفعناه ناقص الثمن. نطرح الثمن من المبلغ المدفوع.","Сдача — это то, что заплатили, минус цена. Вычитаем цену из суммы.","Change is what you paid minus the price. Subtract the price from the payment."),v:function(){return ""}}];
LESSONS.pct=[{t:L("אחוז הוא חלק אחד מתוך 100. בלוח של 100 ריבועים, 30 ריבועים צבועים הם 30%.","النسبة المئوية جزء واحد من 100. في لوح من 100 مربع، 30 مربعًا ملوّنًا تساوي 30%.","Процент — это одна часть из 100. Если из 100 квадратиков закрашено 30, это 30%.","A percent is one part out of 100. If 30 of 100 squares are shaded, that is 30%."),v:function(){return pctGrid(30)}},
 {t:L("50% הם חצי, 25% הם רבע ו-10% הם עשירית. 50% מ-80 הם 40, ו-10% מ-80 הם 8.","50% نصف، و25% ربع، و10% عُشر. 50% من 80 هي 40، و10% من 80 هي 8.","50% — это половина, 25% — четверть, 10% — одна десятая. 50% от 80 — это 40, а 10% от 80 — это 8.","50% is half, 25% is a quarter and 10% is a tenth. 50% of 80 is 40, and 10% of 80 is 8."),v:function(){return pctGrid(50)}},
 {t:L("אחוז אפשר לכתוב גם כשבר וגם כמספר עשרוני. 25% הם 25/100, כלומר 1/4, וגם 0.25.","يمكن كتابة النسبة المئوية كسرًا أو عددًا عشريًا. 25% هي 25/100، أي 1/4، وأيضًا 0.25.","Процент можно записать обычной или десятичной дробью. 25% — это 25/100, то есть 1/4, или 0.25.","A percent can be written as a fraction or a decimal. 25% is 25/100, which is 1/4, or 0.25."),v:function(){return pctGrid(25)}},
 {t:L("בהנחה מחשבים קודם כמה שקלים היא ההנחה, ואז מחסרים אותה מהמחיר. הנחה של 10% על 50 שקלים היא 5 שקלים, ומשלמים 45.","في الخصم نحسب أولًا كم شيكلًا هو الخصم ثم نطرحه من السعر. خصم 10% على 50 شيكل هو 5 شواكل، فندفع 45.","При скидке сначала считаем, сколько шекелей она составляет, потом вычитаем её из цены. Скидка 10% на 50 ₪ — это 5 ₪, и цена со скидкой — 45 ₪.","With a discount, first work out how many shekels it is, then take it off the price. 10% off 50 shekels is 5 shekels, so you pay 45."),v:function(){return ""}}];
/* שיעורי שכבה ג׳. מספר הצעד = השדה step של השאלה, כדי ש״דוגמה״ בתרגול תראה את הצעד שלה */
LESSONS.fracop=[{t:L("כשהמכנה זהה, מחברים או מחסרים רק את המונים, והמכנה נשאר. 2/7 ועוד 3/7 הם 5/7.","عندما يتساوى المقام نجمع البسطين أو نطرحهما فقط، ويبقى المقام. 2/7 + 3/7 = 5/7.","Если знаменатели равны, складываем или вычитаем только числители, а знаменатель остаётся. 2/7 + 3/7 = 5/7.","With the same bottom, add or subtract only the tops, and the bottom stays. 2/7 plus 3/7 is 5/7."),v:function(){return fracBars(2,7,3,7)}},
 {t:L("כשהמכנים שונים, קודם מביאים למכנה משותף. 1/2 הוא כמו 2/4, ולכן 1/2 ועוד 1/4 הם 3/4.","عندما يختلف المقامان نوحّدهما أولًا. 1/2 مثل 2/4، لذلك 1/2 + 1/4 = 3/4.","Если знаменатели разные, сначала приводим к общему. 1/2 — это 2/4, поэтому 1/2 + 1/4 = 3/4.","With different bottoms, first find a common one. 1/2 is the same as 2/4, so 1/2 plus 1/4 is 3/4."),v:function(){return fracBars(1,2,1,4)}},
 {t:L("כופלים שברים: מונה כפול מונה, ומכנה כפול מכנה. 1/2 כפול 1/3 הם 1/6, כלומר חצי משליש.","نضرب الكسور: البسط في البسط والمقام في المقام. 1/2 × 1/3 = 1/6، أي نصف الثلث.","Умножаем дроби: числитель на числитель, знаменатель на знаменатель. 1/2 × 1/3 = 1/6, то есть половина трети.","To multiply fractions: top times top, bottom times bottom. 1/2 times 1/3 is 1/6, which is half of a third."),v:function(){return fracBars(1,3,1,6)}},
 {t:L("בסוף מצמצמים: מחלקים את המונה ואת המכנה באותו מספר. 2/4 הם 1/2, כי מחלקים את שניהם ב-2.","في النهاية نختزل: نقسم البسط والمقام على العدد نفسه. 2/4 = 1/2 لأننا نقسم الاثنين على 2.","В конце сокращаем: делим числитель и знаменатель на одно и то же число. 2/4 = 1/2, потому что делим оба на 2.","At the end, simplify: divide the top and the bottom by the same number. 2/4 is 1/2, because you divide both by 2."),v:function(){return fracBars(2,4,1,2)}}];
LESSONS.dec3=[{t:L("משווים מספרים עשרוניים לפי הספרה הראשונה אחרי הנקודה, ואחר כך לפי השנייה. 0.5 גדול מ-0.45, כי 5 עשיריות הן יותר מ-4 עשיריות.","نقارن الأعداد العشرية بالرقم الأول بعد الفاصلة ثم بالثاني. 0.5 أكبر من 0.45 لأن 5 أعشار أكثر من 4 أعشار.","Десятичные дроби сравниваем по первой цифре после точки, потом по второй. 0.5 больше 0.45, потому что 5 десятых больше 4 десятых.","Compare decimals by the first digit after the point, then the second. 0.5 is bigger than 0.45, because 5 tenths are more than 4 tenths."),v:function(){return tenthsBar(5)}},
 {t:L("בחיבור ובחיסור כותבים את הנקודה מתחת לנקודה. 3.5 ועוד 1.25: כותבים 3.50 ועוד 1.25, ומקבלים 4.75.","في الجمع والطرح نكتب الفاصلة تحت الفاصلة. 3.5 + 1.25: نكتب 3.50 + 1.25 فنحصل على 4.75.","При сложении и вычитании пишем точку под точкой. 3.5 + 1.25: пишем 3.50 + 1.25 и получаем 4.75.","To add or subtract, write the point under the point. 3.5 plus 1.25: write 3.50 plus 1.25 and get 4.75."),v:function(){return ""}},
 {t:L("כשכופלים ב-10 הנקודה זזה מקום אחד ימינה, ב-100 שני מקומות, וב-1000 שלושה. 0.35 כפול 100 הם 35.","عند الضرب في 10 تتحرك الفاصلة منزلة واحدة إلى اليمين، وفي 100 منزلتين، وفي 1000 ثلاث منازل. 0.35 × 100 = 35.","При умножении на 10 точка сдвигается на один знак вправо, на 100 — на два, на 1000 — на три. 0.35 × 100 = 35.","Times 10 moves the point one place right, times 100 two places, times 1000 three. 0.35 times 100 is 35."),v:function(){return ""}},
 {t:L("כשכופלים עשרוני במספר שלם, כופלים בלי הנקודה ומחזירים אותה בסוף. 1.5 כפול 3: 15 כפול 3 הם 45, ולכן 4.5.","عند ضرب عدد عشري في عدد صحيح نضرب دون الفاصلة ثم نعيدها. 1.5 × 3: 15 × 3 = 45، إذن 4.5.","Умножая десятичную дробь на целое, умножаем без точки и потом ставим её. 1.5 × 3: 15 × 3 = 45, значит 4.5.","To multiply a decimal by a whole number, multiply without the point, then put it back. 1.5 times 3: 15 times 3 is 45, so 4.5."),v:function(){return ""}}];
LESSONS.ratio=[{t:L("יחס משווה בין שתי כמויות. 6 אדומים ו-4 כחולים הם יחס 6:4. מחלקים את שני המספרים ב-2 ומקבלים את הצורה הפשוטה 3:2.","النسبة تقارن بين كميتين. 6 حمراء و4 زرقاء نسبتها 6:4. نقسم العددين على 2 فنحصل على أبسط صورة 3:2.","Отношение сравнивает две величины. 6 красных и 4 синих — это 6:4. Делим оба числа на 2 и получаем простейший вид 3:2.","A ratio compares two amounts. 6 red and 4 blue is 6:4. Divide both numbers by 2 to get the simplest form, 3:2."),v:function(){return bagVis([6,4],["#e8453c","#2f7fd8"])}},
 {t:L("כשמגדילים מתכון, כופלים את כל הכמויות באותו מספר. 2 כוסות קמח על כל 3 כוסות מים: ל-6 כוסות קמח, פי 3, צריך 9 כוסות מים.","عند تكبير الوصفة نضرب كل الكميات في العدد نفسه. كوبان من الطحين لكل 3 أكواب ماء: لـ6 أكواب طحين، أي 3 أضعاف، نحتاج 9 أكواب ماء.","Увеличивая рецепт, умножаем все количества на одно число. 2 стакана муки на 3 стакана воды: на 6 стаканов муки, в 3 раза больше, нужно 9 стаканов воды.","To scale a recipe, multiply every amount by the same number. 2 cups of flour for every 3 cups of water: for 6 cups of flour, 3 times as much, you need 9 cups of water."),v:function(){return ""}},
 {t:L("ממוצע: מחברים את כל המספרים ומחלקים בכמה מספרים יש. הממוצע של 4, 6 ו-8: הסכום הוא 18, ו-18 חלקי 3 הם 6.","المتوسط: نجمع كل الأعداد ونقسم على عددها. متوسط 4 و6 و8: المجموع 18، و18 ÷ 3 = 6.","Среднее: складываем все числа и делим на их количество. Среднее 4, 6 и 8: сумма 18, а 18 ÷ 3 = 6.","Average: add all the numbers and divide by how many there are. The average of 4, 6 and 8: the sum is 18, and 18 divided by 3 is 6."),v:function(){return ""}},
 {t:L("מהממוצע אפשר למצוא את הסכום: ממוצע 5 של 4 מספרים פירושו שהסכום של כולם הוא 4 כפול 5, כלומר 20.","من المتوسط نجد المجموع: متوسط 5 لـ4 أعداد يعني أن مجموعها 4 × 5، أي 20.","По среднему можно найти сумму: среднее 5 у четырёх чисел значит, что их сумма 4 × 5, то есть 20.","From the average you can find the total: an average of 5 for 4 numbers means they add up to 4 times 5, which is 20."),v:function(){return ""}}];
LESSONS.tri=[{t:L("סכום שלוש הזוויות בכל משולש הוא 180°. אם שתי זוויות הן 60° ו-70°, השלישית היא 50°.","مجموع زوايا أي مثلث 180°. إذا كانت زاويتان 60° و70° فالثالثة 50°.","Сумма трёх углов любого треугольника — 180°. Если два угла 60° и 70°, третий — 50°.","The three angles of any triangle add up to 180°. If two angles are 60° and 70°, the third is 50°."),v:function(){return ""}},
 {t:L("סכום ארבע הזוויות בכל מרובע הוא 360°. במלבן כל זווית היא 90°, ו-4 כפול 90 הם 360.","مجموع زوايا أي شكل رباعي 360°. في المستطيل كل زاوية 90°، و4 × 90 = 360.","Сумма четырёх углов любого четырёхугольника — 360°. В прямоугольнике каждый угол 90°, а 4 × 90 = 360.","The four angles of any quadrilateral add up to 360°. In a rectangle each angle is 90°, and 4 times 90 is 360."),v:function(){return angleVis(90)}},
 {t:L("שטח משולש הוא חצי ממלבן עם אותו בסיס ואותו גובה: בסיס כפול גובה, חלקי 2. בסיס 6 וגובה 4 נותנים 12.","مساحة المثلث نصف مستطيل له القاعدة والارتفاع نفسهما: القاعدة × الارتفاع ÷ 2. قاعدة 6 وارتفاع 4 تعطي 12.","Площадь треугольника — половина прямоугольника с тем же основанием и высотой: основание × высота ÷ 2. Основание 6 и высота 4 дают 12.","A triangle's area is half a rectangle with the same base and height: base times height, divided by 2. Base 6 and height 4 give 12."),v:function(){return triVis(6,4)}},
 {t:L("במשולש שווה צלעות כל הזוויות שוות, 60° כל אחת. במשולש שווה שוקיים שתי זוויות הבסיס שוות זו לזו.","في المثلث متساوي الأضلاع كل الزوايا متساوية، 60° لكل منها. وفي المثلث متساوي الساقين زاويتا القاعدة متساويتان.","В равностороннем треугольнике все углы равны, по 60°. В равнобедренном треугольнике равны два угла при основании.","In an equilateral triangle all angles are equal, 60° each. In an isosceles triangle the two base angles are equal."),v:function(){return ""}}];
LESSONS.vol=[{t:L("נפח הוא כמה קוביות של סנטימטר אחד ממלאות את הגוף. בקובייה שהצלע שלה 2 ס״מ יש 2 כפול 2 כפול 2, כלומר 8 קוביות.","الحجم هو عدد مكعبات السنتيمتر التي تملأ الجسم. في مكعب ضلعه 2 سم يوجد 2 × 2 × 2، أي 8 مكعبات.","Объём — сколько кубиков по одному сантиметру заполняют тело. В кубе с ребром 2 см помещается 2 × 2 × 2, то есть 8 кубиков.","Volume is how many one-centimeter cubes fill a shape. A cube with 2 cm edges holds 2 times 2 times 2, which is 8 cubes."),v:function(){return boxVis(2,2,2)}},
 {t:L("נפח תיבה הוא אורך כפול רוחב כפול גובה. בתיבה של 4 על 3 יש 12 קוביות בשכבה, ובגובה 2 יש שתי שכבות: 24.","حجم الصندوق = الطول × العرض × الارتفاع. في صندوق 4 في 3 توجد 12 مكعبًا في الطبقة، وبارتفاع 2 طبقتان: 24.","Объём коробки = длина × ширина × высота. В коробке 4 на 3 в слое 12 кубиков, а при высоте 2 — два слоя: 24.","A box's volume is length times width times height. A 4 by 3 box has 12 cubes in a layer, and with height 2 there are two layers: 24."),v:function(){return boxVis(4,3,2)}},
 {t:L("אם יודעים את הנפח ואת שטח הבסיס, מחלקים ומוצאים את הגובה. נפח 24 ובסיס 4 על 3, כלומר 12: הגובה הוא 2.","إذا عرفنا الحجم ومساحة القاعدة نقسم فنجد الارتفاع. حجم 24 وقاعدة 4 في 3، أي 12: الارتفاع 2.","Зная объём и площадь основания, делим и находим высоту. Объём 24, основание 4 на 3, то есть 12: высота 2.","If you know the volume and the base, divide to find the height. Volume 24 and a 4 by 3 base, which is 12: the height is 2."),v:function(){return ""}},
 {t:L("ליטר אחד הוא 1000 סנטימטרים מעוקבים. קופסה של 10 על 10 על 10 ס״מ מחזיקה בדיוק ליטר אחד.","اللتر الواحد = 1000 سنتيمتر مكعب. صندوق 10 في 10 في 10 سم يتسع لتر واحد بالضبط.","Один литр — это 1000 кубических сантиметров. Коробка 10 на 10 на 10 см вмещает ровно один литр.","One liter is 1000 cubic centimeters. A 10 by 10 by 10 cm box holds exactly one liter."),v:function(){return boxVis(10,10,10)}}];
LESSONS.neg=[{t:L("מספרים שליליים נמצאים משמאל לאפס על ציר המספרים. מינוס 3 נמצא שלושה צעדים משמאל לאפס, וכותבים אותו -3.","الأعداد السالبة على يسار الصفر على خط الأعداد. سالب 3 على بعد ثلاث خطوات يسار الصفر، ونكتبه -3.","Отрицательные числа стоят левее нуля на числовой прямой. Минус 3 — на три шага левее нуля, пишем -3.","Negative numbers are left of zero on the number line. Minus 3 is three steps left of zero, and we write -3."),v:function(){return negLine(-3)}},
 {t:L("מספר שנמצא יותר שמאלה על הציר הוא קטן יותר. לכן מינוס 8 קטן ממינוס 2, אף ש-8 גדול מ-2.","العدد الأبعد إلى اليسار أصغر. لذلك سالب 8 أصغر من سالب 2، مع أن 8 أكبر من 2.","Чем левее число на прямой, тем оно меньше. Поэтому минус 8 меньше минус 2, хотя 8 больше 2.","A number further left on the line is smaller. So minus 8 is smaller than minus 2, even though 8 is bigger than 2."),v:function(){return negLine(-8)}},
 {t:L("כשהטמפרטורה יורדת, זזים שמאלה על הציר. מ-2 מעלות, ירידה של 5 מעלות מביאה למינוס 3 מעלות.","عندما تنخفض درجة الحرارة نتحرك يسارًا. من 2 درجة، انخفاض 5 درجات يوصلنا إلى سالب 3.","Когда температура падает, двигаемся влево. От 2 градусов падение на 5 градусов приводит к минус 3.","When the temperature drops, move left on the line. From 2 degrees, a drop of 5 degrees takes you to minus 3."),v:function(){return negLine(2)}},
 {t:L("במערכת צירים המספר הראשון אומר כמה ימינה או שמאלה, והשני כמה למעלה או למטה. בשיקוף מעבר לציר האנכי, המספר הראשון מחליף סימן.","في المحاور العدد الأول يقول كم يمينًا أو يسارًا، والثاني كم للأعلى أو للأسفل. في الانعكاس حول المحور العمودي تتغير إشارة العدد الأول.","На координатной плоскости первое число — сколько вправо или влево, второе — сколько вверх или вниз. При отражении через вертикальную ось первое число меняет знак.","On the grid the first number says how far right or left, the second how far up or down. Reflecting across the vertical axis changes the sign of the first number."),v:function(){return coord4([[-3,2]])}}];
LESSONS.prob=[{t:L("כשמוציאים בלי להסתכל, הצבע שיש ממנו הכי הרבה הוא הסביר ביותר. אם יש מכל צבע אותו מספר, הסיכוי שווה.","عند السحب دون النظر، اللون الأكثر عددًا هو الأكثر احتمالًا. وإذا تساوت الأعداد فالفرص متساوية.","Если достаём не глядя, вероятнее всего цвет, которого больше всего. Если всех цветов поровну, шансы равны.","When you pick without looking, the color with the most is the most likely. If every color has the same number, the chances are equal."),v:function(){return bagVis([5,2,1],["#e8453c","#2f7fd8","#2eaa5b"])}},
 {t:L("הסתברות היא מספר הכדורים המתאימים חלקי כל הכדורים. 3 אדומים מתוך 8 כדורים: ההסתברות להוציא אדום היא 3/8.","الاحتمال هو عدد الكرات المناسبة على عدد كل الكرات. 3 حمراء من بين 8: احتمال سحب حمراء هو 3/8.","Вероятность — это подходящие шары, делённые на все шары. 3 красных из 8: вероятность достать красный — 3/8.","Chance is the matching balls divided by all the balls. 3 red out of 8: the chance of red is 3/8."),v:function(){return bagVis([3,5],["#e8453c","#2f7fd8"])}},
 {t:L("בקובייה יש 6 תוצאות שוות. יש 3 מספרים זוגיים, 2, 4 ו-6, ולכן ההסתברות לזוגי היא 3/6, כלומר 1/2.","للنرد 6 نتائج متساوية. فيه 3 أعداد زوجية، 2 و4 و6، لذلك احتمال الزوجي 3/6، أي 1/2.","У кубика 6 равных исходов. Чётных чисел три: 2, 4 и 6, поэтому вероятность чётного — 3/6, то есть 1/2.","A die has 6 equal outcomes. There are 3 even numbers, 2, 4 and 6, so the chance of even is 3/6, which is 1/2."),v:function(){return ""}},
 {t:L("בטוח: קורה תמיד. בלתי אפשרי: לא קורה אף פעם. אפשרי: לפעמים כן ולפעמים לא. בקובייה רגילה, 7 הוא בלתי אפשרי.","مؤكد: يحدث دائمًا. مستحيل: لا يحدث أبدًا. ممكن: أحيانًا نعم وأحيانًا لا. على النرد العادي، 7 مستحيل.","Точно — бывает всегда. Невозможно — не бывает никогда. Возможно — иногда да, иногда нет. На обычном кубике 7 — невозможно.","Certain: always happens. Impossible: never happens. Possible: sometimes yes, sometimes no. On a normal die, 7 is impossible."),v:function(){return ""}}];
