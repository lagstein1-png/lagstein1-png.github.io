дела. Возникает тургорное давление, и клетка остаётся целой и упругой.", "en": "Water enters a plant cell by osmosis just as it does an animal cell, but the stiff wall outside the membrane does not let the cell expand without limit. Turgor pressure builds up, and the cell stays whole and firm."},null,[null, {"he": "קרום התא הצמחי חדיר למים, והמים אכן נכנסים אליו.", "ar": "غشاء الخلية النباتية نفوذ للماء، والماء يدخلها فعلًا.", "ru": "Мембрана растительной клетки проницаема для воды, и вода в неё действительно входит.", "en": "A plant cell's membrane is permeable to water, and water really does enter."}, {"he": "תפקיד הכלורופלסט הוא פוטוסינתזה, ולא ספיחת מים.", "ar": "وظيفة البلاستيدة الخضراء هي التمثيل الضوئي، لا امتصاص الماء.", "ru": "Задача хлоропласта — фотосинтез, а не впитывание воды.", "en": "The chloroplast's job is photosynthesis, not soaking up water."}, {"he": "אין בתא משאבת מים, ומים נעים רק לפי הפרשי ריכוז.", "ar": "لا توجد في الخلية مضخّة ماء، والماء يتحرّك حسب فرق التركيز فقط.", "ru": "В клетке нет водяного насоса, вода движется только по разнице концентраций.", "en": "There is no water pump in the cell; water moves only by concentration differences."}]),
    Q("cell-2-7",{"he": "מה הכוונה בכך שקרום התא חדיר בררנית?", "ar": "ما المقصود بأن غشاء الخلية نفوذ بشكل انتقائي؟", "ru": "Что означает, что клеточная мембрана проницаема избирательно?", "en": "What does it mean that the cell membrane is selectively permeable?"},[{"he": "שכל חומר עובר דרכו בחופשיות", "ar": "أن كل مادة تمرّ عبره بحرّية", "ru": "Что любое вещество проходит через неё свободно", "en": "That every substance passes through it freely"}, {"he": "שאף חומר אינו עובר דרכו", "ar": "أنه لا تمرّ عبره أي مادة", "ru": "Что через неё не проходит никакое вещество", "en": "That no substance passes through it at all"}, {"he": "שחומרים מסוימים עוברים דרכו ואחרים נעצרים", "ar": "أن موادّ معيّنة تمرّ عبره وأخرى تُمنَع", "ru": "Что одни вещества проходят через неё, а другие задерживаются", "en": "That some substances pass through it and others are held back"}, {"he": "שהוא מעביר חומרים רק כשיש בתא ATP", "ar": "أنه ينقل المواد فقط عندما يوجد ATP في الخلية", "ru": "Что она переносит вещества только при наличии АТФ в клетке", "en": "That it moves substances only when the cell has ATP"}],2,{"he": "חשבו על דלת עם שומר, ולא על קיר ולא על חור.", "ar": "فكّروا ببابٍ له حارس، لا بحائط ولا بفتحة.", "ru": "Подумайте о двери с охранником, а не о стене и не о дырке.", "en": "Think of a door with a guard, not a wall and not a hole."},{"he": "הקרום בנוי משכבת שומנים וחלבונים, ולכן חומרים קטנים ושומניים עוברים בקלות, ואחרים צריכים חלבון מעבר. כך חמצן נכנס בחופשיות, אבל יוני נתרן עוברים רק דרך חלבון מתאים.", "ar": "الغشاء مبني من طبقة دهون وبروتينات، لذلك تمرّ المواد الصغيرة والدهنية بسهولة، وتحتاج غيرها بروتين نقل. هكذا يدخل الأكسجين بحرّية، أما أيونات الصوديوم فتمرّ عبر بروتين مناسب فقط.", "ru": "Мембрана состоит из слоя жиров и белков, поэтому мелкие и жирорастворимые вещества проходят легко, а другим нужен транспортный белок. Так кислород входит свободно, а ионы натрия проходят только через подходящий белок.", "en": "The membrane is built of a fat layer with proteins, so small and fat-soluble substances pass easily while others need a transport protein. Oxygen enters freely, but sodium ions pass only through a suitable protein."},null,[{"he": "אם הכול היה עובר, לא היה לתא שליטה על ההרכב הפנימי שלו.", "ar": "لو مرّ كل شيء، لما كانت للخلية سيطرة على مكوّناتها الداخلية.", "ru": "Если бы проходило всё, клетка не управляла бы своим внутренним составом.", "en": "If everything passed, the cell would have no control over its inner contents."}, {"he": "אם דבר לא היה עובר, התא לא היה מקבל חמצן ומזון והיה מת.", "ar": "لو لم تمرّ أي مادة، لما وصل الخلية أكسجين وغذاء ولماتت.", "ru": "Если бы ничего не проходило, клетка не получала бы кислород и пищу и погибла.", "en": "If nothing passed, the cell would get no oxygen or food and would die."}, null, {"he": "חלק מהמעבר דורש ATP, אבל דיפוזיה ואוסמוזה קורות גם בלעדיו.", "ar": "جزء من النقل يحتاج ATP، لكن الانتشار والتناضح يحدثان بدونه أيضًا.", "ru": "Часть переноса требует АТФ, но диффузия и осмос идут и без него.", "en": "Some transport needs ATP, but diffusion and osmosis happen without it."}]),
    Q("cell-2-8",{"he": "תא דם לבן בלע חיידק. איזה אברון יפרק את החיידק בתוך התא?", "ar": "خلية دم بيضاء بلعت بكتيريا. أي عُضيّة ستفكّك البكتيريا داخل الخلية؟", "ru": "Лейкоцит поглотил бактерию. Какая органелла расщепит бактерию внутри клетки?", "en": "A white blood cell has swallowed a bacterium. Which organelle will break the bacterium down inside the cell?"},[{"he": "הגרעין", "ar": "النواة", "ru": "Ядро", "en": "The nucleus"}, {"he": "הליזוזום", "ar": "الليزوزوم", "ru": "Лизосома", "en": "The lysosome"}, {"he": "המיטוכונדריון", "ar": "الميتوكوندريا", "ru": "Митохондрия", "en": "The mitochondrion"}, {"he": "הריבוזום", "ar": "الريبوسوم", "ru": "Рибосома", "en": "The ribosome"}],1,{"he": "חפשו את האברון שמחזיק אנזימי פירוק.", "ar": "ابحثوا عن العُضيّة التي تحمل إنزيمات التفكيك.", "ru": "Найдите органеллу, которая держит расщепляющие ферменты.", "en": "Look for the organelle that holds digestive enzymes."},{"he": "הליזוזום הוא שלפוחית עם אנזימי פירוק. הוא מתאחה עם השלפוחית שבה נמצא החיידק, והאנזימים מפרקים אותו לחומרים קטנים. כך תאי הדם הלבנים מנקים זיהום.", "ar": "الليزوزوم حويصلة فيها إنزيمات تفكيك. يلتحم مع الحويصلة التي تحتوي البكتيريا، فتفكّكها الإنزيمات إلى موادّ صغيرة. هكذا تنظّف خلايا الدم البيضاء العدوى.", "ru": "Лизосома — пузырёк с расщепляющими ферментами. Он сливается с пузырьком, в котором находится бактерия, и ферменты разбирают её на мелкие вещества. Так лейкоциты убирают инфекцию.", "en": "A lysosome is a vesicle full of digestive enzymes. It fuses with the vesicle holding the bacterium, and the enzymes break it into small substances. This is how white blood cells clear an infection."},null,[{"he": "הגרעין שומר את ה-DNA של התא, ואינו מפרק חומרים.", "ar": "النواة تحفظ DNA الخلية، ولا تفكّك المواد.", "ru": "Ядро хранит ДНК клетки и веществ не расщепляет.", "en": "The nucleus keeps the cell's DNA and does not break substances down."}, null, {"he": "המיטוכונדריון מפרק סוכר לאנרגיה, ואינו מפרק חיידקים.", "ar": "الميتوكوندريا تفكّك السكر لإنتاج الطاقة، ولا تفكّك البكتيريا.", "ru": "Митохондрия расщепляет сахар для энергии, а не бактерий.", "en": "The mitochondrion breaks sugar down for energy, not bacteria."}, {"he": "הריבוזום בונה חלבונים, והוא עושה את ההפך מפירוק.", "ar": "الريبوسوم يبني البروتينات، وهو يفعل عكس التفكيك.", "ru": "Рибосома строит белки — она делает обратное расщеплению.", "en": "The ribosome builds proteins; it does the opposite of breaking down."}]),
    Q("cell-2-9",{"he": "תאי הדופן של המעי הדק מכוסים בקפלים זעירים. מה היתרון בכך?", "ar": "خلايا جدار المعي الدقيق مغطّاة بثنيات دقيقة. ما الفائدة من ذلك؟", "ru": "Клетки стенки тонкой кишки покрыты крошечными выростами. В чём преимущество?", "en": "The cells lining the small intestine are covered with tiny folds. What is the advantage?"},[{"he": "הקפלים מגדילים את נפח התא", "ar": "الثنيات تزيد حجم الخلية", "ru": "Выросты увеличивают объём клетки", "en": "The folds increase the cell's volume"}, {"he": "הקפלים מונעים כניסת מזון לתא", "ar": "الثنيات تمنع دخول الغذاء إلى الخلية", "ru": "Выросты не дают пище войти в клетку", "en": "The folds keep food from entering the cell"}, {"he": "הקפלים מגדילים את שטח הפנים לספיגה", "ar": "الثنيات تزيد مساحة السطح للامتصاص", "ru": "Выросты увеличивают площадь поверхности для всасывания", "en": "The folds increase the surface area for absorption"}, {"he": "הקפלים מייצרים ATP לתא", "ar": "الثنيات تنتج ATP للخلية", "ru": "Выросты производят АТФ для клетки", "en": "The folds produce ATP for the cell"}],2,{"he": "חשבו מה קורה לשטח כשמקפלים דף גדול לתוך קופסה קטנה.", "ar": "فكّروا بما يحدث للمساحة عند ثني ورقة كبيرة داخل علبة صغيرة.", "ru": "Подумайте, что происходит с площадью, когда большой лист складывают в маленькую коробку.", "en": "Think what happens to the area when a big sheet is folded into a small box."},{"he": "ספיגה נעשית דרך הקרום, ולכן יותר שטח קרום פירושו יותר מזון שנכנס בזמן נתון. הקפלים מגדילים את השטח בעשרות מונים בלי להגדיל את התא. אותו עיקרון מסביר את מבנה האלוויאולות בריאה.", "ar": "الامتصاص يحدث عبر الغشاء، لذلك مساحة غشاء أكبر تعني غذاءً أكثر يدخل في زمن معيّن. الثنيات تكبّر المساحة أضعافًا كثيرة دون تكبير الخلية. المبدأ نفسه يفسّر بنية الحويصلات الهوائية في الرئة.", "ru": "Всасывание идёт через мембрану, поэтому большая площадь мембраны означает больше пищи, входящей за то же время. Выросты увеличивают площадь в десятки раз, не увеличивая клетку. Тот же принцип объясняет строение альвеол в лёгком.", "en": "Absorption happens across the membrane, so more membrane area means more food taken in per unit of time. The folds multiply the area many times over without making the cell bigger. The same principle explains the structure of the alveoli in the lung."},null,[{"he": "קיפול מוסיף שטח ולא נפח, והספיגה תלויה בשטח.", "ar": "الثني يضيف مساحة لا حجمًا، والامتصاص يعتمد على المساحة.", "ru": "Складка добавляет площадь, а не объём, и всасывание зависит от площади.", "en": "A fold adds area, not volume, and absorption depends on area."}, {"he": "תפקיד תאי המעי הוא לספוג מזון, ולא למנוע את כניסתו.", "ar": "وظيفة خلايا المعي امتصاص الغذاء، لا منع دخوله.", "ru": "Задача клеток кишки — всасывать пищу, а не мешать её входу.", "en": "The job of gut cells is to absorb food, not to block it."}, null, {"he": "ATP מופק במיטוכונדריון, וקפל בקרום אינו מייצר אנרגיה.", "ar": "ATP يُنتَج في الميتوكوندريا، وثنية في الغشاء لا تنتج طاقة.", "ru": "АТФ образуется в митохондрии, а складка мембраны энергию не производит.", "en": "ATP is made in the mitochondrion; a fold in the membrane produces no energy."}]),
 ],
 [
    Q("cell-3-1",{"he": "תא בלוטה בלבלב מייצר ומפריש כמות גדולה של חלבונים. באילו אברונים צפוי למצוא בו הרבה?", "ar": "خلية غدية في البنكرياس تُنتج وتُفرز كمية كبيرة من البروتينات. ما العُضيّات التي نتوقع وجودها فيها بكثرة؟", "ru": "Клетка железы поджелудочной железы производит и выделяет много белков. Каких органелл в ней ожидается много?", "en": "A gland cell in the pancreas makes and secretes a large amount of protein. Which organelles would you expect it to have in large numbers?"},[{"he": "ריבוזומים, רשת אנדופלזמית וגולג'י", "ar": "ريبوسومات وشبكة إندوبلازمية وجهاز غولجي", "ru": "Рибосомы, эндоплазматическая сеть и аппарат Гольджи", "en": "Ribosomes, endoplasmic reticulum and Golgi apparatus"}, {"he": "כלורופלסטים וחלולית מרכזית גדולה לאגירת חומרים", "ar": "بلاستيدات خضراء وفجوة مركزية كبيرة لتخزين المواد", "ru": "Хлоропласты и крупная центральная вакуоль для запаса веществ", "en": "Chloroplasts and a large central vacuole for storing materials"}, {"he": "דופן תא עבה ושוטונים", "ar": "جدار خلية سميك وأسواط", "ru": "Толстая клеточная стенка и жгутики", "en": "A thick cell wall and flagella"}, {"he": "רק גרעינים רבים, שבונים את החלבון בעצמם", "ar": "نوى كثيرة فقط، تبني البروتين بنفسها", "ru": "Только много ядер, которые сами строят белок", "en": "Only many nuclei, which build the protein themselves"}],0,{"he": "חלבון נבנה, נארז ויוצא מהתא. מי עושה כל שלב?", "ar": "البروتين يُبنى ويُعبَّأ ويخرج من الخلية. من يقوم بكل مرحلة؟", "ru": "Белок строится, упаковывается и выходит из клетки. Кто выполняет каждый этап?", "en": "A protein is built, packaged and sent out of the cell. Which organelle does each step?"},{"he": "הריבוזומים בונים את החלבון, הרשת האנדופלזמית מעבירה אותו, וגולג'י אורז ומפריש אותו. תא שמייצר הרבה חלבון יכיל הרבה מכל אלה.", "ar": "الريبوسومات تبني البروتين، والشبكة الإندوبلازمية تنقله، وجهاز غولجي يعبّئه ويفرزه. الخلية التي تنتج بروتينًا كثيرًا تحتوي على الكثير من كل هذه.", "ru": "Рибосомы строят белок, эндоплазматическая сеть переносит его, а аппарат Гольджи упаковывает и выводит. Клетка, производящая много белка, содержит много всего этого.", "en": "Ribosomes build the protein, the endoplasmic reticulum carries it, and the Golgi apparatus packages and releases it. A cell that makes a lot of protein will have many of all of these."},null,[null, {"he": "כלורופלסטים וחלולית מרכזית הם אברונים של תא צמחי, ולא של תא לבלב.", "ar": "البلاستيدات الخضراء والفجوة المركزية عُضيّات خلية نباتية، لا خلية بنكرياس.", "ru": "Хлоропласты и вакуоль — органеллы растительной клетки, а не поджелудочной.", "en": "Chloroplasts and a central vacuole are plant-cell organelles, not pancreas ones."}, {"he": "לתא אנושי אין דופן תא, ושוטון משמש לתנועה ולא להפרשת חלבון.", "ar": "ليس لخلية الإنسان جدار خلوي، والسوط يُستعمل للحركة لا لإفراز البروتين.", "ru": "У клетки человека нет стенки, а жгутик служит движению, не секреции белка.", "en": "A human cell has no cell wall, and a flagellum serves movement, not secretion."}, {"he": "הגרעין מחזיק את ההוראות, אבל החלבון עצמו נבנה ונארז מחוץ לו.", "ar": "النواة تحفظ التعليمات، أمّا البروتين نفسه فيُبنى ويُغلَّف خارجها.", "ru": "Ядро хранит инструкции, но сам белок собирается и упаковывается вне его.", "en": "The nucleus holds the instructions, but the protein is built and packed outside it."}]),
    Q("cell-3-2",{"he": "תא א' קטן מתא ב' פי שניים בכל מימד. מה נכון לגבי יחס שטח הפנים לנפח?", "ar": "الخلية أ أصغر من الخلية ب بمرّتين في كل بُعد. ما الصحيح بشأن نسبة مساحة السطح إلى الحجم؟", "ru": "Клетка А вдвое меньше клетки Б по каждому измерению. Что верно об отношении площади поверхности к объёму?", "en": "Cell A is half the size of cell B in every dimension. What is true about the surface area to volume ratio?"},[{"he": "היחס בתא א' גדול יותר", "ar": "النسبة في الخلية أ أكبر", "ru": "Отношение в клетке А больше", "en": "The ratio is larger in cell A"}, {"he": "היחס זהה בשני התאים", "ar": "النسبة نفسها في الخليتين", "ru": "Отношение одинаково в обеих клетках", "en": "The ratio is the same in both cells"}, {"he": "היחס בתא ב' גדול יותר", "ar": "النسبة في الخلية ب أكبر", "ru": "Отношение в клетке Б больше", "en": "The ratio is larger in cell B"}, {"he": "אי אפשר לדעת בלי למדוד את הגרעין", "ar": "لا يمكن المعرفة دون قياس النواة", "ru": "Нельзя узнать, не измерив ядро", "en": "It cannot be known without measuring the nucleus"}],0,{"he": "נסו קובייה בצלע 1 מול קובייה בצלע 2: חשבו שטח פנים ונפח.", "ar": "جرّبوا مكعبًا ضلعه 1 ومكعبًا ضلعه 2: احسبوا مساحة السطح والحجم.", "ru": "Попробуйте куб со стороной 1 и куб со стороной 2: найдите площадь поверхности и объём.", "en": "Try a cube with side 1 and a cube with side 2: calculate surface area and volume."},{"he": "בקובייה בצלע 1 שטח הפנים 6 והנפח 1, והיחס 6. בקובייה בצלע 2 שטח הפנים 24 והנפח 8, והיחס 3. כלומר ככל שהתא קטן יותר, היחס גדול יותר.", "ar": "في مكعب ضلعه 1 مساحة السطح 6 والحجم 1 والنسبة 6. وفي مكعب ضلعه 2 مساحة السطح 24 والحجم 8 والنسبة 3. أي كلما صغرت الخلية كبرت النسبة.", "ru": "У куба со стороной 1 площадь поверхности 6, объём 1, отношение 6. У куба со стороной 2 площадь 24, объём 8, отношение 3. Чем меньше клетка, тем больше отношение.", "en": "A cube with side 1 has surface area 6 and volume 1, so the ratio is 6. A cube with side 2 has surface area 24 and volume 8, so the ratio is 3. The smaller the cell, the larger the ratio."},null,[null, {"he": "היחס משתנה עם הגודל: קובייה בצלע 1 נותנת 6, ובצלע 2 נותנת 3.", "ar": "النسبة تتغيّر مع الحجم: مكعّب ضلعه 1 يعطي 6، وضلعه 2 يعطي 3.", "ru": "Отношение меняется с размером: куб с ребром 1 даёт 6, а с ребром 2 даёт 3.", "en": "The ratio changes with size: a cube of side 1 gives 6, one of side 2 gives 3."}, {"he": "תא ב' גדול יותר, ולכן היחס שלו קטן יותר, לא גדול יותר.", "ar": "الخلية ب أكبر، لذلك نسبتها أصغر لا أكبر.", "ru": "Клетка Б больше, поэтому её отношение меньше, а не больше.", "en": "Cell B is larger, so its ratio is smaller, not larger."}, {"he": "אפשר לדעת בלי מדידה: היחס נגזר מהצורה ומהצלע, ולא מהגרעין.", "ar": "يمكن معرفة ذلك بلا قياس: النسبة تُشتقّ من الشكل والضلع، لا من النواة.", "ru": "Это можно узнать без измерений: отношение зависит от формы и ребра, не от ядра.", "en": "You can tell without measuring: the ratio follows from the shape, not the nucleus."}]),
    Q("cell-3-3",{"he": "קוביות תפוח אדמה נשקלו והושמו בתמיסות מלח. הקוביות בתמיסה המרוכזת ירדו במשקל. מה ההסבר?", "ar": "وُزنت مكعّبات بطاطا ووُضعت في محاليل ملح. المكعّبات في المحلول المركّز نقص وزنها. ما التفسير؟", "ru": "Кубики картофеля взвесили и поместили в солевые растворы. Кубики в концентрированном растворе потеряли вес. Каково объяснение?", "en": "Potato cubes were weighed and placed in salt solutions. The cubes in the concentrated solution lost weight. What is the explanation?"},[{"he": "המלח פירק את תאי התפוח ולכן המשקל ירד", "ar": "الملح فكّك خلايا البطاطا فنقص الوزن", "ru": "Соль разрушила клетки картофеля, поэтому вес упал", "en": "The salt broke the potato cells down, so the weight dropped"}, {"he": "מים יצאו מהתאים אל התמיסה המרוכזת באוסמוזה", "ar": "خرج الماء من الخلايا إلى المحلول المركّز بالتناضح", "ru": "Вода вышла из клеток в концентрированный раствор путём осмоса", "en": "Water left the cells for the concentrated solution by osmosis"}, {"he": "התאים השתמשו ב-ATP כדי לפלוט מים", "ar": "استخدمت الخلايا ATP لتطرد الماء", "ru": "Клетки использовали АТФ, чтобы вытолкнуть воду", "en": "The cells used ATP to expel water"}, {"he": "מלח נכנס לתאים והחליף את המים שבהם", "ar": "دخل الملح إلى الخلايا وأبدل الماء الذي فيها", "ru": "Соль вошла в клетки и заместила в них воду", "en": "Salt entered the cells and replaced the water in them"}],1,{"he": "שאלו לאיזה צד נעים מים כשבחוץ יש פחות מים מאשר בפנים.", "ar": "اسألوا إلى أي جهة يتحرّك الماء عندما يكون الماء خارجًا أقل منه داخلًا.", "ru": "Спросите, куда движется вода, когда снаружи её меньше, чем внутри.", "en": "Ask which way water moves when there is less water outside than inside."},{"he": "בתמיסת מלח מרוכזת ריכוז המים נמוך מזה שבתאי התפוח. מים יצאו מהתאים דרך הקרום לכיוון הריכוז הנמוך, והקוביות איבדו משקל. בתמיסה מדוללת היה קורה ההפך, והמשקל היה עולה.", "ar": "في محلول ملح مركّز يكون تركيز الماء أقل منه في خلايا البطاطا. خرج الماء من الخلايا عبر الغشاء نحو التركيز الأقل، فنقص وزن المكعّبات. في محلول مخفّف يحدث العكس ويزيد الوزن.", "ru": "В концентрированном солевом растворе концентрация воды ниже, чем в клетках картофеля. Вода вышла из клеток через мембрану в сторону меньшей концентрации, и кубики потеряли вес. В разбавленном растворе было бы наоборот, и вес вырос бы.", "en": "In a concentrated salt solution the water concentration is lower than inside the potato cells. Water left the cells through the membrane towards the lower concentration, so the cubes lost weight. In a dilute solution the opposite would happen and the weight would rise."},null,[{"he": "מלח אינו מפרק תאים, והירידה נובעת מאיבוד מים בלבד.", "ar": "الملح لا يفكّك الخلايا، والنقص ناتج عن فقدان الماء فقط.", "ru": "Соль клетки не разрушает, потеря веса объясняется только уходом воды.", "en": "Salt does not break cells down; the loss comes only from water leaving."}, null, {"he": "אוסמוזה אינה צורכת אנרגיה, ואין בתא משאבה שפולטת מים.", "ar": "التناضح لا يستهلك طاقة، ولا توجد في الخلية مضخّة تطرد الماء.", "ru": "Осмос энергии не требует, и насоса, выбрасывающего воду, в клетке нет.", "en": "Osmosis needs no energy, and the cell has no pump that expels water."}, {"he": "אם מלח היה נכנס במקום המים, המשקל היה נשאר דומה ולא יורד.", "ar": "لو دخل الملح بدل الماء، لبقي الوزن مشابهًا ولم ينقص.", "ru": "Если бы соль вошла вместо воды, вес остался бы примерно таким же, а не упал.", "en": "If salt replaced the water, the weight would stay about the same, not fall."}]),
    Q("cell-3-4",{"he": "קצב כניסת גלוקוז לתא עולה עם הריכוז מחוץ לתא, ומריכוז מסוים ואילך נשאר קבוע. מה מסביר את הקביעות?", "ar": "يزيد معدّل دخول الغلوكوز إلى الخلية مع التركيز خارجها، ومن تركيز معيّن يبقى ثابتًا. ما يفسّر الثبات؟", "ru": "Скорость входа глюкозы в клетку растёт с концентрацией снаружи, а с некоторой концентрации остаётся постоянной. Что объясняет это постоянство?", "en": "The rate at which glucose enters a cell rises with the outside concentration, and from a certain concentration on it stays constant. What explains the plateau?"},[{"he": "הגלוקוז מפסיק להיות מסיס במים בריכוז גבוה", "ar": "يتوقّف الغلوكوز عن الذوبان في الماء عند تركيز عالٍ", "ru": "При высокой концентрации глюкоза перестаёт растворяться в воде", "en": "Glucose stops dissolving in water at high concentration"}, {"he": "קרום התא נקרע ולכן הקצב אינו עולה", "ar": "يتمزّق غشاء الخلية فلا يزيد المعدّل", "ru": "Мембрана клетки разрывается, поэтому скорость не растёт", "en": "The membrane tears, so the rate does not rise"}, {"he": "התא מפסיק לנשום ולכן אין לו ATP להובלה", "ar": "تتوقّف الخلية عن التنفّس فلا يتوفّر لها ATP للنقل", "ru": "Клетка перестаёт дышать, и АТФ для переноса не хватает", "en": "The cell stops respiring, so it has no ATP for transport"}, {"he": "כל חלבוני המעבר בקרום תפוסים, ואין יותר דרכי כניסה", "ar": "كل بروتينات النقل في الغشاء مشغولة، ولا مزيد من مسالك الدخول", "ru": "Все транспортные белки мембраны заняты, и других путей входа нет", "en": "All the transport proteins in the membrane are busy, and there is no further way in"}],3,{"he": "חשבו על חמישה קופות בסופר ועל תור שהולך וגדל.", "ar": "فكّروا بخمسة صناديق دفع في السوق وبصفّ يطول أكثر وأكثر.", "ru": "Подумайте о пяти кассах в магазине и об очереди, которая всё растёт.", "en": "Think of five checkout tills in a shop and a queue that keeps growing."},{"he": "גלוקוז עובר את הקרום דרך חלבוני מעבר, ומספרם בקרום מוגבל. כל עוד יש חלבונים פנויים, ריכוז גבוה יותר בחוץ מזרז את הכניסה. כשכולם תפוסים הקצב מגיע לרוויה, והוספת גלוקוז בחוץ אינה משנה דבר.", "ar": "يمرّ الغلوكوز عبر الغشاء بواسطة بروتينات نقل، وعددها في الغشاء محدود. ما دامت هناك بروتينات متاحة، يسرّع التركيز الأعلى خارجًا الدخول. وعندما تُشغَل كلها يصل المعدّل إلى التشبّع، ولا تغيّر إضافة الغلوكوز خارجًا شيئًا.", "ru": "Глюкоза проходит через мембрану с помощью транспортных белков, и число их в мембране ограничено. Пока есть свободные белки, более высокая концентрация снаружи ускоряет вход. Когда все они заняты, скорость выходит на насыщение, и добавление глюкозы снаружи ничего не меняет.", "en": "Glucose crosses the membrane through transport proteins, and their number in the membrane is limited. While free proteins remain, a higher outside concentration speeds entry up. Once they are all busy the rate saturates, and adding more glucose outside changes nothing."},null,[{"he": "גלוקוז מסיס מאוד במים, והגרף אינו עוסק במסיסות.", "ar": "الغلوكوز شديد الذوبان في الماء، والرسم لا يتحدّث عن الذوبان.", "ru": "Глюкоза очень хорошо растворима в воде, и график не о растворимости.", "en": "Glucose dissolves very well in water, and the graph is not about solubility."}, {"he": "קרום קרוע היה מפסיק את התא כליל, והקצב דווקא נשאר גבוה וקבוע.", "ar": "الغشاء الممزّق كان سيوقف الخلية تمامًا، والمعدّل بقي عاليًا وثابتًا.", "ru": "Разорванная мембрана остановила бы клетку совсем, а скорость как раз осталась высокой и постоянной.", "en": "A torn membrane would stop the cell altogether, yet the rate stayed high and steady."}, {"he": "כניסת גלוקוז לתא אינה דורשת ATP, ולכן נשימה אינה הגורם המגביל כאן.", "ar": "دخول الغلوكوز إلى الخلية لا يحتاج ATP، لذلك التنفّس ليس العامل المحدّد هنا.", "ru": "Вход глюкозы в клетку не требует АТФ, поэтому дыхание здесь не ограничивающий фактор.", "en": "Glucose entry does not require ATP, so respiration is not the limiting factor here."}, null]),
    Q("cell-3-5",{"he": "חומר שמשתק מיטוכונדריות הוסף לתא. איזה תהליך ייפגע ראשון?", "ar": "أُضيفت إلى خلية مادة تعطّل الميتوكوندريا. أي عملية ستتضرّر أولًا؟", "ru": "В клетку добавили вещество, которое блокирует митохондрии. Какой процесс пострадает первым?", "en": "A substance that shuts down mitochondria was added to a cell. Which process will be harmed first?"},[{"he": "הובלה פעילה של יונים נגד מפל הריכוזים", "ar": "النقل النشط للأيونات عكس فرق التركيز", "ru": "Активный транспорт ионов против градиента", "en": "Active transport of ions against the gradient"}, {"he": "דיפוזיה של חמצן לתוך התא", "ar": "انتشار الأكسجين إلى داخل الخلية", "ru": "Диффузия кислорода внутрь клетки", "en": "Diffusion of oxygen into the cell"}, {"he": "אוסמוזה של מים דרך הקרום", "ar": "تناضح الماء عبر الغشاء", "ru": "Осмос воды через мембрану", "en": "Osmosis of water through the membrane"}, {"he": "שקיעת חומרים כבדים בציטופלסמה", "ar": "ترسّب المواد الثقيلة في السيتوبلازما", "ru": "Осаждение тяжёлых веществ в цитоплазме", "en": "Heavy substances settling in the cytoplasm"}],0,{"he": "שאלו איזה מהתהליכים משלם מחיר של אנרגיה.", "ar": "اسألوا أيّ العمليات تدفع ثمنًا من الطاقة.", "ru": "Спросите, какой из процессов платит ценой энергии.", "en": "Ask which of these processes pays an energy price."},{"he": "מיטוכונדריות משותקות פירושן אספקת ATP שנעצרת. דיפוזיה ואוסמוזה נעות לפי מפל ריכוזים ואינן תלויות ב-ATP, ולכן הן נמשכות. הובלה פעילה דוחפת נגד המפל, ובלי ATP היא נעצרת מיד.", "ar": "تعطّل الميتوكوندريا يعني توقّف تزويد ATP. الانتشار والتناضح يتحرّكان حسب فرق التركيز ولا يعتمدان على ATP، فيستمرّان. أما النقل النشط فيدفع عكس الفرق، وبدون ATP يتوقّف فورًا.", "ru": "Отключённые митохондрии означают прекращение поставки АТФ. Диффузия и осмос идут по градиенту и от АТФ не зависят, поэтому продолжаются. Активный транспорт толкает против градиента, и без АТФ он останавливается сразу.", "en": "Shut-down mitochondria mean the ATP supply stops. Diffusion and osmosis follow the concentration gradient and do not depend on ATP, so they carry on. Active transport pushes against the gradient, and without ATP it stops at once."},null,[null, {"he": "דיפוזיה אינה דורשת ATP, ולכן היא נמשכת גם בלי מיטוכונדריות.", "ar": "الانتشار لا يحتاج ATP، فيستمرّ حتى بدون ميتوكوندريا.", "ru": "Диффузия не требует АТФ, поэтому она идёт и без митохондрий.", "en": "Diffusion needs no ATP, so it continues even without mitochondria."}, {"he": "אוסמוזה היא תנועה ספונטנית של מים, והיא קורית גם בתא מת.", "ar": "التناضح حركة تلقائية للماء، ويحدث حتى في خلية ميتة.", "ru": "Осмос — самопроизвольное движение воды, он идёт даже в мёртвой клетке.", "en": "Osmosis is a spontaneous movement of water and happens even in a dead cell."}, {"he": "שקיעה אינה תהליך ביולוגי בתא, ואינה תלויה באנרגיה שלו.", "ar": "الترسّب ليس عملية بيولوجية في الخلية، ولا يعتمد على طاقتها.", "ru": "Осаждение — не биологический процесс клетки и от её энергии не зависит.", "en": "Settling is not a biological process of the cell and does not depend on its energy."}]),
    Q("cell-3-6",{"he": "אנזים הסיר את דופן התא מתא צמחי. התא הושם במים ומיד התפוצץ. מה אפשר להסיק?", "ar": "أزال إنزيم جدار الخلية من خلية نباتية. وُضعت الخلية في ماء فانفجرت فورًا. ما يمكن استنتاجه؟", "ru": "Фермент удалил клеточную стенку у растительной клетки. Клетку поместили в воду, и она сразу лопнула. Что можно заключить?", "en": "An enzyme removed the cell wall from a plant cell. The cell was placed in water and burst at once. What can be concluded?"},[{"he": "שהאנזים עצמו הרג את התא", "ar": "أن الإنزيم نفسه قتل الخلية", "ru": "Что сам фермент убил клетку", "en": "That the enzyme itself killed the cell"}, {"he": "שתא צמחי אינו סופג מים כלל", "ar": "أن الخلية النباتية لا تمتصّ الماء أبدًا", "ru": "Что растительная клетка воду вовсе не поглощает", "en": "That a plant cell does not take in water at all"}, {"he": "שהדופן היא שמנעה מהתא להתפוצץ במים", "ar": "أن الجدار هو ما منع الخلية من الانفجار في الماء", "ru": "Что именно стенка не давала клетке лопнуть в воде", "en": "That the wall was what kept the cell from bursting in water"}, {"he": "שקרום התא נעשה חדיר יותר אחרי הסרת הדופן", "ar": "أن غشاء الخلية صار أكثر نفوذية بعد إزالة الجدار", "ru": "Что мембрана стала более проницаемой после удаления стенки", "en": "That the membrane became more permeable after the wall was removed"}],2,{"he": "השוו את מה שקרה כאן למה שקורה לתא צמחי שלם באותם מים.", "ar": "قارنوا ما حدث هنا بما يحدث لخلية نباتية كاملة في الماء نفسه.", "ru": "Сравните это с тем, что происходит с целой растительной клеткой в той же воде.", "en": "Compare this with what happens to an intact plant cell in the same water."},{"he": "תא צמחי שלם באותם מים מתמלא ונעצר, כי הדופן עומדת בלחץ. כאן השתנה משתנה אחד בלבד, הדופן, והתוצאה השתנתה. לכן ההסבר תולה את העמידות בדופן ולא בקרום.", "ar": "الخلية النباتية الكاملة في الماء نفسه تمتلئ وتتوقّف، لأن الجدار يتحمّل الضغط. هنا تغيّر متغيّر واحد فقط، وهو الجدار، فتغيّرت النتيجة. لذلك يُعلّق التفسير المقاومة على الجدار لا على الغشاء.", "ru": "Целая растительная клетка в той же воде наполняется и останавливается, потому что стенка выдерживает давление. Здесь изменили лишь одну переменную — стенку, и результат изменился. Значит, устойчивость объясняется стенкой, а не мембраной.", "en": "An intact plant cell in the same water fills up and stops, because the wall withstands the pressure. Here only one variable changed, the wall, and the result changed. So the resistance is explained by the wall and not by the membrane."},null,[{"he": "אם האנזים הרג את התא, הוא היה מתפוצץ גם בלי מים.", "ar": "لو قتل الإنزيم الخلية، لانفجرت حتى بدون ماء.", "ru": "Если бы фермент убил клетку, она лопнула бы и без воды.", "en": "If the enzyme had killed the cell, it would have burst without water too."}, {"he": "התא התפוצץ בגלל מים שנכנסו, ולכן הוא בוודאי סופג מים.", "ar": "انفجرت الخلية بسبب ماء دخلها، فهي بالتأكيد تمتصّ الماء.", "ru": "Клетка лопнула из-за вошедшей воды, значит воду она как раз поглощает.", "en": "The cell burst because water entered, so it certainly does take water in."}, null, {"he": "הקרום לא שונה בניסוי, ולכן אין בסיס לטענה על חדירות שהשתנתה.", "ar": "لم يُغيَّر الغشاء في التجربة، فلا أساس لادّعاء تغيّر النفوذية.", "ru": "Мембрану в опыте не меняли, поэтому утверждать об изменении проницаемости нет оснований.", "en": "The membrane was not changed in the experiment, so there is no basis for a claim about permeability."}]),
    Q("cell-3-7",{"he": "נמדדה צריכת החמצן של שתי רקמות. רקמה א' צרכה פי חמישה מרקמה ב'. מה ההסקה הסבירה?", "ar": "قيس استهلاك الأكسجين في نسيجين. النسيج أ استهلك خمسة أضعاف النسيج ب. ما الاستنتاج المعقول؟", "ru": "Измерили потребление кислорода двумя тканями. Ткань А потребила в пять раз больше, чем ткань Б. Какой вывод разумен?", "en": "Oxygen use was measured in two tissues. Tissue A used five times as much as tissue B. What is the reasonable conclusion?"},[{"he": "בתאי רקמה א' יש יותר כלורופלסטים", "ar": "في خلايا النسيج أ بلاستيدات خضراء أكثر", "ru": "В клетках ткани А больше хлоропластов", "en": "The cells of tissue A have more chloroplasts"}, {"he": "בתאי רקמה א' יש יותר מיטוכונדריות ודרישת אנרגיה גבוהה", "ar": "في خلايا النسيج أ ميتوكوندريا أكثر وحاجة أعلى للطاقة", "ru": "В клетках ткани А больше митохондрий и выше потребность в энергии", "en": "Tissue A's cells have more mitochondria and a higher energy demand"}, {"he": "תאי רקמה א' גדולים פי חמישה מתאי רקמה ב'", "ar": "خلايا النسيج أ أكبر خمس مرّات من خلايا النسيج ب", "ru": "Клетки ткани А в пять раз больше клеток ткани Б", "en": "Tissue A's cells are five times bigger than tissue B's"}, {"he": "רקמה ב' אינה מבצעת נשימה תאית בכלל", "ar": "النسيج ب لا يقوم بالتنفّس الخلوي أبدًا", "ru": "Ткань Б вовсе не ведёт клеточного дыхания", "en": "Tissue B does not carry out cellular respiration at all"}],1,{"he": "שאלו באיזה אברון נצרך החמצן בתא.", "ar": "اسألوا في أي عُضيّة يُستهلك الأكسجين في الخلية.", "ru": "Спросите, в какой органелле клетка расходует кислород.", "en": "Ask in which organelle the cell uses up oxygen."},{"he": "חמצן נצרך בנשימה התאית שבמיטוכונדריון, ולכן צריכת חמצן גבוהה מעידה על נשימה תאית ערה ועל הרבה מיטוכונדריות. למשל, רקמת שריר הלב צורכת חמצן יותר מרקמת שומן. הניסוי אינו מודד גודל תא, ולכן אין להסיק עליו.", "ar": "يُستهلك الأكسجين في التنفّس الخلوي داخل الميتوكوندريا، لذلك استهلاك الأكسجين العالي يدلّ على تنفّس خلوي نشط وعلى ميتوكوندريا كثيرة. مثلًا، نسيج عضلة القلب يستهلك أكسجين أكثر من النسيج الدهني. التجربة لا تقيس حجم الخلية، فلا يصحّ الاستنتاج عنه.", "ru": "Кислород расходуется в клеточном дыхании внутри митохондрий, поэтому высокое потребление кислорода говорит об активном дыхании и большом числе митохондрий. Например, ткань сердечной мышцы потребляет больше кислорода, чем жировая. Опыт не измеряет размер клетки, так что о нём выводов делать нельзя.", "en": "Oxygen is consumed in cellular respiration inside the mitochondria, so high oxygen use points to active respiration and many mitochondria. For example, heart muscle tissue uses more oxygen than fat tissue. The experiment does not measure cell size, so no conclusion about it is possible."},null,[{"he": "כלורופלסטים משתתפים בפוטוסינתזה ואינם צורכים חמצן בנשימה.", "ar": "البلاستيدات الخضراء تشارك في التمثيل الضوئي ولا تستهلك الأكسجين في التنفّس.", "ru": "Хлоропласты участвуют в фотосинтезе и кислород в дыхании не расходуют.", "en": "Chloroplasts take part in photosynthesis and do not use oxygen in respiration."}, null, {"he": "הניסוי מדד צריכת חמצן ולא גודל תא, ולכן אין ממה להסיק על גודל.", "ar": "قاست التجربة استهلاك الأكسجين لا حجم الخلية، فلا مجال للاستنتاج عن الحجم.", "ru": "Опыт измерял потребление кислорода, а не размер клетки, вывода о размере сделать нельзя.", "en": "The experiment measured oxygen use, not cell size, so size cannot be concluded."}, {"he": "רקמה ב' צרכה חמצן, רק פחות, ולכן היא כן נושמת.", "ar": "النسيج ب استهلك أكسجين، لكن أقلّ، فهو يتنفّس فعلًا.", "ru": "Ткань Б кислород потребляла, только меньше, значит дыхание в ней есть.", "en": "Tissue B did use oxygen, just less, so it does respire."}]),
    Q("cell-3-8",{"he": "תרופה חוסמת את פעולת הריבוזומים בתא חיידק. מה הפגיעה הישירה הראשונה?", "ar": "دواء يمنع عمل الريبوسومات في خلية بكتيريا. ما أوّل تأثير مباشر؟", "ru": "Лекарство блокирует работу рибосом в клетке бактерии. Каково первое прямое действие?", "en": "A drug blocks the ribosomes in a bacterial cell. What is the first direct effect?"},[{"he": "ה-DNA של החיידק מתפרק מיד", "ar": "يتفكّك DNA البكتيريا فورًا", "ru": "ДНК бактерии сразу распадается", "en": "The bacterium's DNA breaks down at once"}, {"he": "הקרום של החיידק נעשה בלתי חדיר", "ar": "يصبح غشاء البكتيريا غير نفوذ", "ru": "Мембрана бактерии становится непроницаемой", "en": "The bacterium's membrane becomes impermeable"}, {"he": "ייצור חלבונים חדשים נפסק", "ar": "يتوقّف إنتاج البروتينات الجديدة", "ru": "Производство новых белков прекращается", "en": "The production of new proteins stops"}, {"he": "הסוכר שבתוך החיידק מתפרק מהר יותר", "ar": "يتفكّك السكر داخل البكتيريا أسرع", "ru": "Сахар внутри бактерии расщепляется быстрее", "en": "The sugar inside the bacterium breaks down faster"}],2,{"he": "חזרו לתפקיד האחד של הריבוזום, ושאלו מה נעצר כשהוא נעצר.", "ar": "عودوا إلى وظيفة الريبوسوم الواحدة، واسألوا ما يتوقّف عند توقّفه.", "ru": "Вернитесь к единственной функции рибосомы и спросите, что встанет вместе с ней.", "en": "Go back to the ribosome's one job, and ask what stops when it stops."},{"he": "הריבוזום מרכיב חלבונים, ולכן חסימתו עוצרת ראשית את ייצור החלבון. אנזימים וחלבוני מבנה אינם מתחדשים, ובהמשך החיידק מפסיק לגדול ולהתחלק. כמה אנטיביוטיקות עובדות בדיוק כך.", "ar": "الريبوسوم يبني البروتينات، لذلك يوقف تعطيله إنتاج البروتين أولًا. لا تتجدّد الإنزيمات ولا بروتينات البناء، ثم تتوقّف البكتيريا عن النموّ والانقسام. بعض المضادّات الحيوية تعمل بهذه الطريقة بالضبط.", "ru": "Рибосома собирает белки, поэтому её блокировка в первую очередь останавливает производство белка. Ферменты и структурные белки не обновляются, и затем бактерия перестаёт расти и делиться. Некоторые антибиотики действуют именно так.", "en": "The ribosome assembles proteins, so blocking it first stops protein production. Enzymes and structural proteins are not renewed, and the bacterium then stops growing and dividing. Some antibiotics work in exactly this way."},null,[{"he": "ה-DNA אינו תלוי בריבוזום לקיומו, והוא נשאר שלם.", "ar": "DNA لا يعتمد على الريبوسوم في بقائه، ويبقى سليمًا.", "ru": "ДНК не зависит от рибосомы для своего существования и остаётся целой.", "en": "DNA does not depend on the ribosome to exist, and it stays intact."}, {"he": "חדירות הקרום נקבעת בחלבונים שכבר בו, ולא נחסמת ברגע אחד.", "ar": "نفوذية الغشاء تحدّدها بروتينات موجودة فيه، ولا تُمنَع في لحظة واحدة.", "ru": "Проницаемость мембраны определяют уже имеющиеся в ней белки, и мгновенно она не исчезает.", "en": "Membrane permeability is set by proteins already in place and does not vanish in one moment."}, null, {"he": "פירוק סוכר נעשה באנזימים קיימים, והוא אינו מואץ בגלל החסימה.", "ar": "تفكيك السكر يحدث بإنزيمات موجودة، ولا يتسارع بسبب التعطيل.", "ru": "Расщепление сахара идёт имеющимися ферментами и от блокировки не ускоряется.", "en": "Sugar breakdown uses existing enzymes and is not sped up by the block."}]),
    Q("cell-3-9",{"he": "תאים נחשפו לחום קצר, ואחריו צבע שאינו נכנס לתא תקין חדר לכולם. מה ההסבר הטוב?", "ar": "تعرّضت خلايا لحرارة قصيرة، وبعدها نفذ إليها كلها صبغة لا تدخل خلية سليمة. ما التفسير الجيّد؟", "ru": "Клетки подвергли короткому нагреву, после чего краска, которая не входит в здоровую клетку, проникла во все. Каково хорошее объяснение?", "en": "Cells were briefly heated, after which a dye that does not enter a healthy cell got into all of them. What is the good explanation?"},[{"he": "החום הגדיל את התאים ולכן נכנס יותר צבע", "ar": "الحرارة كبّرت الخلايا فدخلت صبغة أكثر", "ru": "Нагрев увеличил клетки, поэтому краски вошло больше", "en": "The heat made the cells bigger, so more dye entered"}, {"he": "הצבע הפך למסיס יותר בגלל החום", "ar": "صارت الصبغة أكثر ذوبانًا بسبب الحرارة", "ru": "Краска стала растворимее из-за нагрева", "en": "The dye became more soluble because of the heat"}, {"he": "התאים התחילו לשאוב את הצבע פנימה בעזרת ATP", "ar": "بدأت الخلايا تضخّ الصبغة إلى الداخل بمساعدة ATP", "ru": "Клетки начали закачивать краску внутрь с помощью АТФ", "en": "The cells started pumping the dye in using ATP"}, {"he": "החום פגע בקרום, והוא איבד את החדירות הבררנית", "ar": "أضرّت الحرارة بالغشاء، فخسر النفوذية الانتقائية", "ru": "Нагрев повредил мембрану, и она утратила избирательную проницаемость", "en": "The heat damaged the membrane, and it lost its selective permeability"}],3,{"he": "שאלו מי בתא אחראי לכך שחומר מסוים אינו נכנס.", "ar": "اسألوا من في الخلية مسؤول عن منع دخول مادة معيّنة.", "ru": "Спросите, кто в клетке отвечает за то, что данное вещество не входит.", "en": "Ask what in the cell is responsible for keeping a given substance out."},{"he": "הקרום בנוי מחלבונים ומשומנים, וחום מעוות את צורת החלבונים. קרום פגוע אינו מסנן עוד, וצבע שנעצר קודם עובר בחופשיות. כניסת צבע לכל התאים היא לכן סימן מובהק לפגיעה בקרום.", "ar": "الغشاء مبني من بروتينات ودهون، والحرارة تشوّه شكل البروتينات. الغشاء المتضرّر لا يفلتر بعد ذلك، فتمرّ الصبغة التي كانت تُمنَع بحرّية. دخول الصبغة إلى كل الخلايا علامة واضحة على ضرر في الغشاء.", "ru": "Мембрана состоит из белков и жиров, а нагрев искажает форму белков. Повреждённая мембрана больше не фильтрует, и краска, которая прежде задерживалась, проходит свободно. Поэтому вход краски во все клетки — явный признак повреждения мембраны.", "en": "The membrane is built of proteins and fats, and heat distorts the shape of proteins. A damaged membrane no longer filters, and a dye that was kept out passes freely. Dye entering every cell is therefore a clear sign of membrane damage."},null,[{"he": "גודל התא אינו קובע מה עובר את הקרום, אלא הקרום עצמו.", "ar": "حجم الخلية لا يحدّد ما يعبر الغشاء، بل الغشاء نفسه.", "ru": "Размер клетки не определяет, что проходит через мембрану, — это делает сама мембрана.", "en": "Cell size does not decide what crosses the membrane; the membrane itself does."}, {"he": "אם המסיסות היתה הגורם, הצבע היה נכנס גם לתאים שלא חוממו.", "ar": "لو كان الذوبان هو السبب، لدخلت الصبغة أيضًا خلايا لم تُسخَّن.", "ru": "Если бы дело было в растворимости, краска вошла бы и в ненагретые клетки.", "en": "If solubility were the cause, the dye would also enter cells that were not heated."}, {"he": "תא פגוע מחום מאבד אנרגיה, ולכן אינו מתחיל לשאוב חומר פנימה.", "ar": "الخلية المتضرّرة من الحرارة تفقد الطاقة، فلا تبدأ بضخّ مادة إلى الداخل.", "ru": "Повреждённая нагревом клетка теряет энергию и закачивать вещество внутрь не начинает.", "en": "A heat-damaged cell loses energy, so it does not start pumping a substance inwards."}, null]),
 ]
]);

topic("bio-gene","043381",
  {"he": "מהגן לתפקוד", "ar": "من الجين إلى الوظيفة", "ru": "От гена к функции", "en": "From gene to function"},
  {"he": "DNA, חלבונים ואנזימים", "ar": "DNA والبروتينات والإنزيمات", "ru": "ДНК, белки и ферменты", "en": "DNA, proteins and enzymes"},
[
 [
    Q("gene-1-1",{"he": "איזו מולקולה נושאת את המידע התורשתי בתא?", "ar": "أي جزيء يحمل المعلومات الوراثية في الخلية؟", "ru": "Какая молекула хранит наследственную информацию в клетке?", "en": "Which molecule carries the hereditary information in the cell?"},[{"he": "DNA", "ar": "DNA", "ru": "ДНК", "en": "DNA"}, {"he": "ATP", "ar": "ATP", "ru": "АТФ", "en": "ATP"}, {"he": "גלוקוז", "ar": "الغلوكوز", "ru": "Глюкоза", "en": "Glucose"}, {"he": "שומן", "ar": "الدهن", "ru": "Жир", "en": "Fat"}],0,{"he": "היא נמצאת בכרומוזומים בגרעין.", "ar": "توجد في الكروموسومات داخل النواة.", "ru": "Она находится в хромосомах в ядре.", "en": "It is found in the chromosomes in the nucleus."},{"he": "ה-DNA הוא ״ספר ההוראות״ של התא. הוא בנוי מרצף של בסיסים, וגן הוא קטע ב-DNA שמכתיב בניית חלבון.", "ar": "الـDNA هو «كتاب التعليمات» للخلية. يتكوّن من تسلسل قواعد، والجين مقطع من الـDNA يحدد بناء بروتين.", "ru": "ДНК — это «книга инструкций» клетки. Она состоит из последовательности оснований, а ген — участок ДНК, определяющий построение белка.", "en": "DNA is the cell's instruction book. It is made of a sequence of bases, and a gene is a section of DNA that directs the building of a protein."},null,[null, {"he": "ATP הוא מטבע האנרגיה של התא, והוא אינו נושא מידע תורשתי.", "ar": "الـATP عملة الطاقة في الخلية، وهو لا يحمل معلومات وراثية.", "ru": "АТФ — энергетическая валюта клетки, и он не несёт наследственной информации.", "en": "ATP is the cell's energy currency, and it does not carry hereditary information."}, {"he": "גלוקוז הוא סוכר שממנו מפיקים אנרגיה, ואין בו הוראות לבניית חלבון.", "ar": "الغلوكوز سكّر يُستخرج منه الطاقة، وليس فيه تعليمات لبناء بروتين.", "ru": "Глюкоза — сахар, из которого получают энергию, в ней нет инструкций для белка.", "en": "Glucose is a sugar used for energy, and it holds no instructions for proteins."}, {"he": "שומן משמש לאגירת אנרגיה ולבניית ממברנות, ולא לשמירת מידע.", "ar": "الدهن يُستعمل لتخزين الطاقة وبناء الأغشية، لا لحفظ المعلومات.", "ru": "Жир служит для запаса энергии и построения мембран, а не для хранения данных.", "en": "Fat stores energy and builds membranes; it does not store information."}]),
    Q("gene-1-2",{"he": "מהו אנזים?", "ar": "ما الإنزيم؟", "ru": "Что такое фермент?", "en": "What is an enzyme?"},[{"he": "חלבון שמאיץ תגובה כימית בתא", "ar": "بروتين يُسرّع تفاعلًا كيميائيًا في الخلية", "ru": "Белок, который ускоряет химическую реакцию в клетке", "en": "A protein that speeds up a chemical reaction in the cell"}, {"he": "סוכר שנצרך כדי לקבל אנרגיה", "ar": "سكر يُستهلك للحصول على الطاقة", "ru": "Сахар, который расходуется для получения энергии", "en": "A sugar that is used up for energy"}, {"he": "חלק מהממברנה שמונע כניסת חומרים מזיקים לתא", "ar": "جزء من الغشاء يمنع دخول المواد الضارّة إلى الخلية", "ru": "Часть мембраны, не пропускающая вредные вещества в клетку", "en": "A part of the membrane that stops harmful materials entering the cell"}, {"he": "קטע ב-DNA שאינו פעיל", "ar": "مقطع في DNA غير نشط", "ru": "Неактивный участок ДНК", "en": "An inactive section of DNA"}],0,{"he": "המילה ״זרז״ מתאימה כאן.", "ar": "كلمة «محفّز» تناسب هنا.", "ru": "Подходит слово «катализатор».", "en": "The word catalyst fits here."},{"he": "אנזים הוא זרז ביולוגי מסוג חלבון. הוא מקטין את האנרגיה הדרושה להתחלת התגובה, ולכן התגובה מהירה יותר, והאנזים עצמו אינו נצרך.", "ar": "الإنزيم محفّز حيوي من نوع البروتين. يقلّل الطاقة اللازمة لبدء التفاعل فيصبح أسرع، والإنزيم نفسه لا يُستهلك.", "ru": "Фермент — биологический катализатор белковой природы. Он уменьшает энергию, нужную для начала реакции, поэтому реакция идёт быстрее, а сам фермент не расходуется.", "en": "An enzyme is a biological catalyst made of protein. It lowers the energy needed to start the reaction, so the reaction is faster, and the enzyme itself is not used up."},null,[null, {"he": "סוכר הוא מקור אנרגיה, והוא חומר שנצרך בתגובה ולא זרז שלה.", "ar": "السكّر مصدر طاقة، وهو مادة تُستهلك في التفاعل لا محفّز له.", "ru": "Сахар — источник энергии; он расходуется в реакции, а не ускоряет её.", "en": "Sugar is an energy source; it is used up in the reaction rather than speeding it."}, {"he": "הממברנה אמנם בוררת מה נכנס לתא, אבל אנזים אינו חלק ממנה.", "ar": "الغشاء يختار ما يدخل الخلية، لكنّ الإنزيم ليس جزءًا منه.", "ru": "Мембрана отбирает, что входит в клетку, но фермент не является её частью.", "en": "The membrane does select what enters the cell, but an enzyme is not part of it."}, {"he": "קטע ב-DNA הוא מידע, ואילו אנזים הוא החלבון שנבנה לפי המידע.", "ar": "القطعة في الـDNA معلومات، أمّا الإنزيم فهو البروتين المبني وفقها.", "ru": "Участок ДНК — это информация, а фермент — белок, построенный по ней.", "en": "A stretch of DNA is information, while an enzyme is the protein built from it."}]),
    Q("gene-1-3",{"he": "מה שם יחידות הבנייה שמהן בנוי ה-DNA?", "ar": "ما اسم وحدات البناء التي يتكوّن منها DNA؟", "ru": "Как называются строительные единицы, из которых состоит ДНК?", "en": "What are the building units that make up DNA called?"},[{"he": "חומצות אמינו", "ar": "أحماض أمينية", "ru": "Аминокислоты", "en": "Amino acids"}, {"he": "נוקלאוטידים", "ar": "نيوكليوتيدات", "ru": "Нуклеотиды", "en": "Nucleotides"}, {"he": "חומצות שומן", "ar": "أحماض دهنية", "ru": "Жирные кислоты", "en": "Fatty acids"}, {"he": "מולקולות סוכר פשוט", "ar": "جزيئات سكر بسيط", "ru": "Молекулы простого сахара", "en": "Simple sugar molecules"}],1,{"he": "חשבו על החוליות בשרשרת ה-DNA, ולא על חוליות בחלבון.", "ar": "فكّروا بحلقات سلسلة DNA، لا بحلقات البروتين.", "ru": "Подумайте о звеньях цепи ДНК, а не о звеньях белка.", "en": "Think of the links in the DNA chain, not the links in a protein."},{"he": "כל נוקלאוטיד בנוי מסוכר, מקבוצת זרחה ומבסיס חנקני אחד: A, T, G או C. סדר הבסיסים הוא המידע עצמו. חלבון, לעומת זאת, בנוי מחומצות אמינו.", "ar": "كل نيوكليوتيد مبني من سكر ومجموعة فوسفات وقاعدة نيتروجينية واحدة: A أو T أو G أو C. ترتيب القواعد هو المعلومة نفسها. أما البروتين فمبني من أحماض أمينية.", "ru": "Каждый нуклеотид состоит из сахара, фосфатной группы и одного азотистого основания: A, T, G или C. Порядок оснований и есть сама информация. Белок же построен из аминокислот.", "en": "Each nucleotide is built from a sugar, a phosphate group and one nitrogen base: A, T, G or C. The order of the bases is the information itself. A protein, by contrast, is built from amino acids."},null,[{"he": "חומצות אמינו הן יחידות הבנייה של חלבון, ולא של DNA.", "ar": "الأحماض الأمينية وحدات بناء البروتين، لا DNA.", "ru": "Аминокислоты — строительные единицы белка, а не ДНК.", "en": "Amino acids are the building units of protein, not of DNA."}, null, {"he": "חומצות שומן בונות שומנים, ובהם קרום התא, ולא את ה-DNA.", "ar": "الأحماض الدهنية تبني الدهون، ومنها غشاء الخلية، لا DNA.", "ru": "Жирные кислоты строят жиры, в том числе мембрану клетки, а не ДНК.", "en": "Fatty acids build fats, including the cell membrane, not DNA."}, {"he": "סוכר הוא רק חלק אחד מנוקלאוטיד, ולא יחידת הבנייה כולה.", "ar": "السكر جزء واحد فقط من النيوكليوتيد، لا وحدة البناء كاملة.", "ru": "Сахар — лишь одна часть нуклеотида, а не вся строительная единица.", "en": "Sugar is only one part of a nucleotide, not the whole building unit."}]),
    Q("gene-1-4",{"he": "אילו בסיסים מזדווגים זה עם זה בין שתי גדילי ה-DNA?", "ar": "أي القواعد تتزاوج مع بعضها بين شريطَي DNA؟", "ru": "Какие основания соединяются друг с другом между двумя цепями ДНК?", "en": "Which bases pair with each other between the two DNA strands?"},[{"he": "A עם G, וגם T עם C", "ar": "A مع G، وكذلك T مع C", "ru": "A с G, а также T с C", "en": "A with G, and T with C"}, {"he": "A עם A, וגם T עם T", "ar": "A مع A، وكذلك T مع T", "ru": "A с A, а также T с T", "en": "A with A, and T with T"}, {"he": "A עם T, וגם G עם C", "ar": "A مع T، وكذلك G مع C", "ru": "A с T, а также G с C", "en": "A with T, and G with C"}, {"he": "A עם C, וגם T עם G", "ar": "A مع C، وكذلك T مع G", "ru": "A с C, а также T с G", "en": "A with C, and T with G"}],2,{"he": "שני הבסיסים שאותיותיהם בולטות בשם אדנין ותימין נצמדים זה לזה.", "ar": "القاعدتان أدينين وثايمين تلتصقان إحداهما بالأخرى.", "ru": "Основания аденин и тимин прилегают друг к другу.", "en": "The bases adenine and thymine stick to each other."},{"he": "הזדווגות הבסיסים קבועה: A מול T, ו-G מול C. בגלל זה אפשר לשחזר גדיל אחד מהגדיל השני, וזה הבסיס לשכפול ה-DNA. אם בגדיל אחד יש AGGC, בשני יהיה TCCG.", "ar": "تزاوج القواعد ثابت: A مقابل T، وG مقابل C. لهذا يمكن استرجاع شريط من الشريط الآخر، وهذا أساس تضاعف DNA. إذا كان في شريط AGGC، فسيكون في الآخر TCCG.", "ru": "Спаривание оснований постоянно: A напротив T, а G напротив C. Поэтому одну цепь можно восстановить по другой, и это основа удвоения ДНК. Если в одной цепи AGGC, то в другой будет TCCG.", "en": "Base pairing is fixed: A opposite T, and G opposite C. This is why one strand can be rebuilt from the other, and it is the basis of DNA replication. If one strand reads AGGC, the other reads TCCG."},null,[{"he": "A ו-G הם שניהם בסיסים גדולים, ואינם מזדווגים זה עם זה.", "ar": "A وG قاعدتان كبيرتان، ولا تتزاوجان إحداهما مع الأخرى.", "ru": "A и G — оба крупные основания и друг с другом не спариваются.", "en": "A and G are both large bases and do not pair with each other."}, {"he": "בסיס אינו מזדווג עם בסיס מאותו סוג, אחרת לא היה כאן מידע.", "ar": "القاعدة لا تتزاوج مع قاعدة من النوع نفسه، وإلا لم تكن هنا معلومة.", "ru": "Основание не спаривается с таким же основанием, иначе информации здесь не было бы.", "en": "A base does not pair with the same kind of base; otherwise there would be no information here."}, null, {"he": "הצירופים האלה אינם מתאימים בצורתם, ולכן אינם נוצרים ב-DNA.", "ar": "هذه الأزواج غير متلائمة في شكلها، لذلك لا تتكوّن في DNA.", "ru": "Эти пары не совпадают по форме, поэтому в ДНК не образуются.", "en": "These combinations do not fit in shape, so they do not form in DNA."}]),
    Q("gene-1-5",{"he": "מהו גן?", "ar": "ما الجين؟", "ru": "Что такое ген?", "en": "What is a gene?"},[{"he": "חלבון שמבצע תפקיד בתא", "ar": "بروتين يقوم بوظيفة في الخلية", "ru": "Белок, выполняющий работу в клетке", "en": "A protein that does a job in the cell"}, {"he": "כרומוזום שלם בתוך הגרעין", "ar": "كروموسوم كامل داخل النواة", "ru": "Целая хромосома внутри ядра", "en": "A whole chromosome inside the nucleus"}, {"he": "אברון שמרכיב חומצות אמינו", "ar": "عُضيّة تبني الأحماض الأمينية", "ru": "Органелла, собирающая аминокислоты", "en": "An organelle that assembles amino acids"}, {"he": "קטע DNA שנושא מידע למוצר אחד", "ar": "مقطع DNA يحمل معلومة لمنتج واحد", "ru": "Участок ДНК, несущий информацию об одном продукте", "en": "A DNA segment that carries the information for one product"}],3,{"he": "חשבו על פרק אחד בתוך ספר ארוך מאוד.", "ar": "فكّروا بفصل واحد داخل كتاب طويل جدًّا.", "ru": "Подумайте об одной главе внутри очень длинной книги.", "en": "Think of one chapter inside a very long book."},{"he": "גן הוא קטע מוגדר על ה-DNA, ובו סדר בסיסים שקובע מוצר אחד, בדרך כלל חלבון. כרומוזום אחד מחזיק אלפי גנים. למשל, הגן לאינסולין קובע את החלבון אינסולין.", "ar": "الجين مقطع محدّد على DNA، فيه ترتيب قواعد يحدّد منتجًا واحدًا، غالبًا بروتينًا. الكروموسوم الواحد يحمل آلاف الجينات. مثلًا، جين الإنسولين يحدّد بروتين الإنسولين.", "ru": "Ген — это определённый участок ДНК, порядок оснований в котором задаёт один продукт, чаще всего белок. Одна хромосома несёт тысячи генов. Например, ген инсулина задаёт белок инсулин.", "en": "A gene is a defined stretch of DNA whose base order specifies one product, usually a protein. A single chromosome carries thousands of genes. For example, the insulin gene specifies the insulin protein."},null,[{"he": "החלבון הוא התוצר של הגן, ולא הגן עצמו.", "ar": "البروتين هو ناتج الجين، لا الجين نفسه.", "ru": "Белок — это продукт гена, а не сам ген.", "en": "The protein is the product of the gene, not the gene itself."}, {"he": "כרומוזום מחזיק אלפי גנים, ולכן הוא גדול מגן אחד.", "ar": "الكروموسوم يحمل آلاف الجينات، فهو أكبر من جين واحد.", "ru": "Хромосома несёт тысячи генов, поэтому она больше одного гена.", "en": "A chromosome carries thousands of genes, so it is bigger than one gene."}, {"he": "האברון שמרכיב חומצות אמינו הוא הריבוזום, והוא אינו מידע.", "ar": "العُضيّة التي تبني الأحماض الأمينية هي الريبوسوم، وهي ليست معلومة.", "ru": "Органелла, собирающая аминокислоты, — рибосома, и она не информация.", "en": "The organelle that assembles amino acids is the ribosome, and it is not information."}, null]),
    Q("gene-1-6",{"he": "מהו קודון?", "ar": "ما الكودون؟", "ru": "Что такое кодон?", "en": "What is a codon?"},[{"he": "שלושה בסיסים שמקודדים חומצת אמינו אחת", "ar": "ثلاث قواعد تشفّر حمضًا أمينيًّا واحدًا", "ru": "Три основания, кодирующие одну аминокислоту", "en": "Three bases that code for one amino acid"}, {"he": "חומצת אמינו אחת בשרשרת החלבון", "ar": "حمض أميني واحد في سلسلة البروتين", "ru": "Одна аминокислота в цепи белка", "en": "One amino acid in the protein chain"}, {"he": "גן שלם על הכרומוזום", "ar": "جين كامل على الكروموسوم", "ru": "Целый ген на хромосоме", "en": "A whole gene on the chromosome"}, {"he": "החלק של הריבוזום שקורא את ה-mRNA", "ar": "جزء الريبوسوم الذي يقرأ mRNA", "ru": "Часть рибосомы, читающая иРНК", "en": "The part of the ribosome that reads the mRNA"}],0,{"he": "חשבו על מילה בת שלוש אותיות בשפת התא.", "ar": "فكّروا بكلمة من ثلاثة أحرف في لغة الخلية.", "ru": "Подумайте о слове из трёх букв на языке клетки.", "en": "Think of a three-letter word in the cell's language."},{"he": "הריבוזום קורא את ה-mRNA בשלשות. כל שלשה היא קודון, והיא מציינת חומצת אמינו אחת או סוף. למשל, AUG מציין את תחילת החלבון ואת החומצה מתיונין.", "ar": "يقرأ الريبوسوم mRNA ثلاثة أحرف في كل مرة. كل ثلاثية هي كودون، وتدلّ على حمض أميني واحد أو على نهاية. مثلًا AUG يدلّ على بداية البروتين وعلى الميثيونين.", "ru": "Рибосома читает иРНК тройками. Каждая тройка — кодон, и она указывает одну аминокислоту или конец. Например, AUG обозначает начало белка и аминокислоту метионин.", "en": "The ribosome reads the mRNA three letters at a time. Each triplet is a codon, and it marks one amino acid or a stop. For example, AUG marks the start of the protein and the amino acid methionine."},null,[null, {"he": "חומצת האמינו היא מה שהקודון מציין, ואינה הקודון עצמו.", "ar": "الحمض الأميني هو ما يدلّ عليه الكودون، وليس الكودون نفسه.", "ru": "Аминокислота — это то, на что указывает кодон, а не сам кодон.", "en": "The amino acid is what the codon points to, not the codon itself."}, {"he": "גן מכיל מאות קודונים, ולכן הוא ארוך בהרבה משלושה בסיסים.", "ar": "الجين يحتوي مئات الكودونات، فهو أطول بكثير من ثلاث قواعد.", "ru": "Ген содержит сотни кодонов, поэтому он гораздо длиннее трёх оснований.", "en": "A gene holds hundreds of codons, so it is far longer than three bases."}, {"he": "הקודון נמצא על ה-mRNA עצמו, והוא אינו חלק מהריבוזום.", "ar": "الكودون موجود على mRNA نفسه، وليس جزءًا من الريبوسوم.", "ru": "Кодон находится на самой иРНК и частью рибосомы не является.", "en": "The codon sits on the mRNA itself and is not part of the ribosome."}]),
    Q("gene-1-7",{"he": "ממה בנוי חלבון?", "ar": "من أي شيء يُبنى البروتين؟", "ru": "Из чего построен белок?", "en": "What is a protein built from?"},[{"he": "מנוקלאוטידים", "ar": "من نيوكليوتيدات", "ru": "Из нуклеотидов", "en": "From nucleotides"}, {"he": "ממולקולות גלוקוז", "ar": "من جزيئات غلوكوز", "ru": "Из молекул глюкозы", "en": "From glucose molecules"}, {"he": "מחומצות אמינו", "ar": "من أحماض أمينية", "ru": "Из аминокислот", "en": "From amino acids"}, {"he": "מחומצות שומן", "ar": "من أحماض دهنية", "ru": "Из жирных кислот", "en": "From fatty acids"}],2,{"he": "חשבו מה הריבוזום מחבר בשרשרת כשהוא קורא mRNA.", "ar": "فكّروا بما يربطه الريبوسوم في سلسلة عندما يقرأ mRNA.", "ru": "Подумайте, что рибосома соединяет в цепь, читая иРНК.", "en": "Think what the ribosome links into a chain as it reads mRNA."},{"he": "חלבון הוא שרשרת של חומצות אמינו, ויש עשרים סוגים שלהן. סדר החומצות קובע את צורת החלבון, והצורה קובעת את תפקידו. למשל, אנזים מתפקד רק בצורה הנכונה.", "ar": "البروتين سلسلة من الأحماض الأمينية، ولها عشرون نوعًا. ترتيب الأحماض يحدّد شكل البروتين، والشكل يحدّد وظيفته. مثلًا، الإنزيم يعمل بشكله الصحيح فقط.", "ru": "Белок — цепь аминокислот, и их двадцать видов. Порядок аминокислот задаёт форму белка, а форма задаёт его работу. Например, фермент работает только в правильной форме.", "en": "A protein is a chain of amino acids, and there are twenty kinds of them. The order of the amino acids sets the protein's shape, and the shape sets its job. An enzyme, for example, only works in the right shape."},null,[{"he": "נוקלאוטידים בונים DNA ו-RNA, ולא חלבון.", "ar": "النيوكليوتيدات تبني DNA وRNA، لا البروتين.", "ru": "Нуклеотиды строят ДНК и РНК, а не белок.", "en": "Nucleotides build DNA and RNA, not protein."}, {"he": "גלוקוז הוא סוכר ומשמש לאנרגיה, ואינו יחידת בנייה של חלבון.", "ar": "الغلوكوز سكر يُستخدم للطاقة، وليس وحدة بناء للبروتين.", "ru": "Глюкоза — сахар для энергии, а не строительная единица белка.", "en": "Glucose is a sugar used for energy, not a building unit of protein."}, null, {"he": "חומצות שומן בונות שומנים, כמו אלה שבקרום התא.", "ar": "الأحماض الدهنية تبني الدهون، كتلك الموجودة في غشاء الخلية.", "ru": "Жирные кислоты строят жиры, например те, что в мембране клетки.", "en": "Fatty acids build fats, such as those in the cell membrane."}]),
    Q("gene-1-8",{"he": "מה תפקידה של מולקולת ה-mRNA?", "ar": "ما وظيفة جزيء mRNA؟", "ru": "Какова роль молекулы иРНК?", "en": "What is the role of the mRNA molecule?"},[{"he": "לאחסן את המידע התורשתי לדורות", "ar": "تخزين المعلومة الوراثية للأجيال", "ru": "Хранить наследственную информацию для поколений", "en": "To store the genetic information for generations"}, {"he": "להעביר את המידע מהגרעין לריבוזום", "ar": "نقل المعلومة من النواة إلى الريبوسوم", "ru": "Переносить информацию из ядра к рибосоме", "en": "To carry the information from the nucleus to the ribosome"}, {"he": "לפרק חלבונים שאינם נחוצים לתא", "ar": "تفكيك البروتينات غير اللازمة للخلية", "ru": "Расщеплять ненужные клетке белки", "en": "To break down proteins the cell does not need"}, {"he": "לחבר בין שני גדילי ה-DNA", "ar": "ربط شريطَي DNA ببعضهما", "ru": "Соединять две цепи ДНК", "en": "To join the two DNA strands together"}],1,{"he": "שאלו מי מוציא עותק של ההוראה אל מחוץ לגרעין.", "ar": "اسألوا من يخرج بنسخة عن التعليمة إلى خارج النواة.", "ru": "Спросите, кто выносит копию указания за пределы ядра.", "en": "Ask who takes a copy of the instruction out of the nucleus."},{"he": "ה-DNA נשאר בגרעין, ולכן נדרש שליח. ה-mRNA נוצר בשעתוק לפי הגן, יוצא מהגרעין ומגיע לריבוזום, ושם הוא מתורגם לחלבון. כך המידע עובר בלי שה-DNA יעזוב את הגרעין.", "ar": "يبقى DNA في النواة، لذلك يلزم ناقل. يتكوّن mRNA في النسخ حسب الجين، ويخرج من النواة إلى الريبوسوم، وهناك يُترجَم إلى بروتين. هكذا تنتقل المعلومة دون أن يترك DNA النواة.", "ru": "ДНК остаётся в ядре, поэтому нужен посредник. иРНК образуется при транскрипции по гену, выходит из ядра к рибосоме, и там переводится в белок. Так информация передаётся, а ДНК ядро не покидает.", "en": "The DNA stays in the nucleus, so a messenger is needed. mRNA is made by transcription from the gene, leaves the nucleus and reaches the ribosome, where it is translated into protein. The information travels without the DNA ever leaving the nucleus."},null,[{"he": "אחסון לדורות הוא תפקיד ה-DNA, וה-mRNA מתפרק אחרי שימוש.", "ar": "التخزين للأجيال وظيفة DNA، وmRNA يتفكّك بعد الاستخدام.", "ru": "Хранение для поколений — задача ДНК, а иРНК после использования распадается.", "en": "Storing for generations is DNA's job; mRNA is broken down after use."}, null, {"he": "פירוק חלבונים נעשה באנזימים ובליזוזום, ולא ב-mRNA.", "ar": "تفكيك البروتينات يحدث بالإنزيمات وفي الليزوزوم، لا بـmRNA.", "ru": "Расщепление белков идёт ферментами и в лизосоме, а не иРНК.", "en": "Proteins are broken down by enzymes and in the lysosome, not by mRNA."}, {"he": "שני גדילי ה-DNA מחוברים בזוגות בסיסים, ואין ל-mRNA חלק בכך.", "ar": "شريطا DNA مرتبطان بأزواج القواعد، ولا دور لـmRNA في ذلك.", "ru": "Две цепи ДНК связаны парами оснований, и иРНК к этому отношения не имеет.", "en": "The two DNA strands are joined by base pairs, and mRNA plays no part in that."}]),
    Q("gene-1-9",{"he": "מהי מוטציה?", "ar": "ما الطفرة؟", "ru": "Что такое мутация?", "en": "What is a mutation?"},[{"he": "שינוי בצורת החלבון בגלל חום", "ar": "تغيّر في شكل البروتين بسبب الحرارة", "ru": "Изменение формы белка из-за нагрева", "en": "A change in a protein's shape because of heat"}, {"he": "מחלה שעוברת מאדם לאדם", "ar": "مرض ينتقل من شخص إلى آخر", "ru": "Болезнь, передающаяся от человека к человеку", "en": "A disease passed from person to person"}, {"he": "תהליך שבו תא מתחלק לשני תאים", "ar": "عملية ينقسم فيها خلية إلى خليتين", "ru": "Процесс, в котором клетка делится на две", "en": "A process in which a cell divides into two"}, {"he": "שינוי ברצף הבסיסים של ה-DNA", "ar": "تغيّر في ترتيب قواعد DNA", "ru": "Изменение в последовательности оснований ДНК", "en": "A change in the base sequence of the DNA"}],3,{"he": "חשבו על טעות דפוס בתוך ההוראה הכתובה.", "ar": "فكّروا بخطأ مطبعي داخل التعليمة المكتوبة.", "ru": "Подумайте об опечатке внутри написанного указания.", "en": "Think of a typo inside the written instruction."},{"he": "מוטציה היא שינוי במידע עצמו: בסיס שהוחלף, נוסף או נחסר. לפעמים אין לה שום השפעה, ולפעמים החלבון יוצא שונה. מוטציה בתא מין עוברת לצאצאים, ומוטציה בתא גוף אינה עוברת.", "ar": "الطفرة تغيّر في المعلومة نفسها: قاعدة أُبدلت أو أُضيفت أو حُذفت. أحيانًا لا أثر لها، وأحيانًا يخرج البروتين مختلفًا. الطفرة في خلية جنسية تنتقل إلى الأبناء، وفي خلية جسدية لا تنتقل.", "ru": "Мутация — это изменение самой информации: основание заменено, добавлено или удалено. Иногда она не даёт никакого эффекта, а иногда белок получается другим. Мутация в половой клетке передаётся потомству, а в клетке тела — нет.", "en": "A mutation is a change in the information itself: a base swapped, added or lost. Sometimes it has no effect at all, and sometimes the protein comes out different. A mutation in a sex cell is passed to offspring; one in a body cell is not."},null,[{"he": "שינוי צורה מחום הוא דנטורציה, והמידע ב-DNA נשאר כשהיה.", "ar": "تغيّر الشكل بسبب الحرارة هو دنترة، والمعلومة في DNA تبقى كما هي.", "ru": "Изменение формы от нагрева — это денатурация, а информация в ДНК остаётся прежней.", "en": "A shape change from heat is denaturation, and the information in the DNA stays the same."}, {"he": "מוטציה אינה מידבקת, והיא נמצאת ב-DNA של התא עצמו.", "ar": "الطفرة غير معدية، وهي موجودة في DNA الخلية نفسها.", "ru": "Мутация не заразна, она находится в ДНК самой клетки.", "en": "A mutation is not contagious; it sits in the cell's own DNA."}, {"he": "חלוקת תא היא התרבות התא, ואין בה שינוי ברצף הבסיסים.", "ar": "انقسام الخلية هو تكاثرها، ولا يوجد فيه تغيّر في ترتيب القواعد.", "ru": "Деление клетки — это её размножение, изменения последовательности оснований в нём нет.", "en": "Cell division is how a cell reproduces, with no change to the base sequence."}, null]),
