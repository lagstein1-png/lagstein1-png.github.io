    Q("evol-1-5",{"he": "כמה כרומוזומים יש בתא גוף של אדם?", "ar": "كم كروموسومًا في خلية جسدية عند الإنسان؟", "ru": "Сколько хромосом в клетке тела человека?", "en": "How many chromosomes are there in a human body cell?"},[{"he": "23", "ar": "23", "ru": "23", "en": "23"}, {"he": "24", "ar": "24", "ru": "24", "en": "24"}, {"he": "48", "ar": "48", "ru": "48", "en": "48"}, {"he": "46", "ar": "46", "ru": "46", "en": "46"}],3,{"he": "תא רבייה נושא 23, ותא גוף נושא זוגות.", "ar": "الخلية التناسلية تحمل 23، وخلية الجسم تحمل أزواجًا.", "ru": "Половая клетка несёт 23, а клетка тела — пары.", "en": "A sex cell carries 23, and a body cell carries pairs."},{"he": "בתא גוף של אדם יש 23 זוגות כרומוזומים, כלומר 46. מכל זוג אחד מהאם ואחד מהאב. בתא זרע ובביצית יש 23 בלבד, ולכן בהפריה נוצר שוב 46.", "ar": "في خلية جسدية عند الإنسان 23 زوجًا من الكروموسومات، أي 46. من كل زوج واحد من الأم وواحد من الأب. وفي الخلية المنوية والبويضة 23 فقط، لذلك ينشأ 46 من جديد عند الإلقاح.", "ru": "В клетке тела человека 23 пары хромосом, то есть 46. Из каждой пары одна от матери и одна от отца. В спермии и в яйцеклетке только 23, поэтому при оплодотворении снова получается 46.", "en": "A human body cell has 23 pairs of chromosomes, that is 46. From each pair, one comes from the mother and one from the father. A sperm and an egg have only 23, so fertilisation restores 46."},null,[{"he": "23 הוא מספר הכרומוזומים בתא רבייה, ולא בתא גוף.", "ar": "23 عدد الكروموسومات في الخلية التناسلية، لا في خلية الجسم.", "ru": "23 — это число хромосом в половой клетке, а не в клетке тела.", "en": "23 is the chromosome number in a sex cell, not in a body cell."}, {"he": "24 אינו מספר הכרומוזומים באדם, והוא אינו מספר זוגי של זוגות.", "ar": "24 ليس عدد الكروموسومات عند الإنسان، وليس عددًا من الأزواج هنا.", "ru": "24 — не число хромосом у человека и не укладывается в пары здесь.", "en": "24 is not the human chromosome number and does not fit the pairs here."}, {"he": "48 הוא מספר הכרומוזומים בשימפנזה ובגורילה, ולא באדם.", "ar": "48 عدد الكروموسومات عند الشمبانزي والغوريلا، لا عند الإنسان.", "ru": "48 — число хромосом у шимпанзе и гориллы, а не у человека.", "en": "48 is the chromosome number in chimpanzees and gorillas, not in humans."}, null]),
    Q("evol-1-6",{"he": "מהו מין (ספיישס) בביולוגיה?", "ar": "ما النوع (الـspecies) في علم الأحياء؟", "ru": "Что такое вид в биологии?", "en": "What is a species in biology?"},[{"he": "כל היצורים שחיים באותו שטח", "ar": "كل الكائنات التي تعيش في المنطقة نفسها", "ru": "Все организмы, живущие на одной территории", "en": "All the organisms living in the same area"}, {"he": "קבוצת פרטים שיכולים להעמיד יחד צאצאים פוריים", "ar": "مجموعة أفراد يمكنها أن تُنتج معًا نسلًا خصيبًا", "ru": "Группа особей, способных вместе давать плодовитое потомство", "en": "A group of individuals that can together produce fertile offspring"}, {"he": "כל הפרטים שיש להם אותו מספר כרומוזומים", "ar": "كل الأفراد الذين لهم العدد نفسه من الكروموسومات", "ru": "Все особи с одинаковым числом хромосом", "en": "All individuals that have the same chromosome number"}, {"he": "קבוצת פרטים שנראים דומים זה לזה", "ar": "مجموعة أفراد يبدون متشابهين", "ru": "Группа особей, которые выглядят похоже", "en": "A group of individuals that look alike"}],1,{"he": "המבחן אינו איך הם נראים, אלא מה קורה לצאצאים שלהם.", "ar": "المعيار ليس كيف يبدون، بل ما يحدث لنسلهم.", "ru": "Критерий не в том, как они выглядят, а в том, что происходит с их потомством.", "en": "The test is not how they look, but what happens to their offspring."},{"he": "בני אותו מין מתרבים זה עם זה וצאצאיהם פוריים. סוס וחמור הם שני מינים, כי הפרד שנולד להם אינו פורה. דמיון חיצוני לבדו אינו מספיק, ויש מינים שונים שנראים כמעט זהים.", "ar": "أفراد النوع الواحد يتزاوجون ونسلهم خصيب. الفرس والحمار نوعان، لأن البغل المولود منهما غير خصيب. والتشابه الخارجي وحده لا يكفي، وهناك أنواع مختلفة تبدو متماثلة تقريبًا.", "ru": "Особи одного вида скрещиваются между собой, и их потомство плодовито. Лошадь и осёл — два вида, потому что рождённый от них мул бесплоден. Внешнего сходства одного недостаточно: есть разные виды, выглядящие почти одинаково.", "en": "Members of one species breed together and their offspring are fertile. A horse and a donkey are two species, because the mule they produce is not fertile. Outward likeness alone is not enough, and some different species look almost identical."},null,[{"he": "באותו שטח חיים מינים רבים יחד, ולכן המקום אינו קובע מין.", "ar": "في المنطقة نفسها تعيش أنواع كثيرة معًا، فالمكان لا يحدّد النوع.", "ru": "На одной территории живёт много видов вместе, поэтому место вид не определяет.", "en": "Many species live together in the same area, so place does not define a species."}, null, {"he": "יש מינים שונים עם אותו מספר כרומוזומים, ולכן המספר אינו מבחן.", "ar": "هناك أنواع مختلفة لها العدد نفسه من الكروموسومات، فالعدد ليس معيارًا.", "ru": "Есть разные виды с одинаковым числом хромосом, поэтому число — не критерий.", "en": "Different species can share a chromosome number, so the number is not a test."}, {"he": "דמיון יכול להטעות, ושני מינים דומים אינם מעמידים צאצאים פוריים.", "ar": "التشابه قد يُضلّل، ونوعان متشابهان لا يُنتجان نسلًا خصيبًا.", "ru": "Сходство может обманывать: два похожих вида плодовитого потомства не дают.", "en": "Likeness can mislead: two similar species do not produce fertile offspring."}]),
    Q("evol-1-7",{"he": "מה נוצר בתהליך המיוזה (חלוקת הפחתה)?", "ar": "ماذا ينتج في عملية الانقسام المنصّف؟", "ru": "Что образуется в процессе мейоза?", "en": "What is produced in meiosis, the reduction division?"},[{"he": "שני תאי גוף זהים לתא המקורי", "ar": "خليتان جسديّتان متماثلتان للخلية الأصلية", "ru": "Две клетки тела, одинаковые с исходной", "en": "Two body cells identical to the original cell"}, {"he": "תא אחד עם מספר כרומוזומים כפול", "ar": "خلية واحدة بعدد كروموسومات مضاعف", "ru": "Одна клетка с удвоенным числом хромосом", "en": "One cell with a doubled chromosome number"}, {"he": "תאי רבייה עם מחצית ממספר הכרומוזומים", "ar": "خلايا تناسلية بنصف عدد الكروموسومات", "ru": "Половые клетки с половинным числом хромосом", "en": "Sex cells with half the chromosome number"}, {"he": "תאי דם אדומים בלי גרעין", "ar": "كريّات دم حمراء بلا نواة", "ru": "Эритроциты без ядра", "en": "Red blood cells without a nucleus"}],2,{"he": "חשבו למה לביצית ולתא הזרע יש 23 ולא 46.", "ar": "فكّروا لماذا في البويضة والخلية المنوية 23 لا 46.", "ru": "Подумайте, почему в яйцеклетке и спермии 23, а не 46.", "en": "Think why an egg and a sperm have 23 and not 46."},{"he": "במיוזה כל זוג כרומוזומים נפרד, ולכן כל תא רבייה מקבל אחד מכל זוג. מ-46 נוצרים תאים עם 23, ובהפריה המספר חוזר ל-46. המיוזה גם מערבבת אללים, ולכן האחים אינם זהים.", "ar": "في الانقسام المنصّف يفترق كل زوج من الكروموسومات، فتحصل كل خلية تناسلية على واحد من كل زوج. من 46 تتكوّن خلايا فيها 23، وعند الإلقاح يعود العدد إلى 46. والانقسام المنصّف يخلط الأليلات أيضًا، لذلك الأشقّاء غير متماثلين.", "ru": "В мейозе каждая пара хромосом расходится, поэтому каждая половая клетка получает по одной из каждой пары. Из 46 получаются клетки с 23, а при оплодотворении число возвращается к 46. Мейоз также перемешивает аллели, поэтому братья и сёстры не одинаковы.", "en": "In meiosis each chromosome pair separates, so every sex cell gets one from each pair. From 46 come cells with 23, and fertilisation returns the number to 46. Meiosis also reshuffles alleles, which is why siblings are not identical."},null,[{"he": "שני תאים זהים נוצרים במיטוזה, חלוקה רגילה, ולא במיוזה.", "ar": "خليتان متماثلتان تنتجان في الانقسام المتساوي العادي، لا في المنصّف.", "ru": "Две одинаковые клетки получаются при митозе, обычном делении, а не при мейозе.", "en": "Two identical cells come from mitosis, ordinary division, not from meiosis."}, {"he": "הכפלת מספר הכרומוזומים היא ההפך מחלוקת הפחתה.", "ar": "مضاعفة عدد الكروموسومات عكس الانقسام المنصّف.", "ru": "Удвоение числа хромосом — противоположность редукционному делению.", "en": "Doubling the chromosome number is the opposite of a reduction division."}, null, {"he": "תאי דם אדומים נוצרים בחלוקה רגילה במח העצם, ולא במיוזה.", "ar": "كريّات الدم الحمراء تتكوّن بانقسام عادي في نقيّ العظم، لا بالمنصّف.", "ru": "Эритроциты образуются обычным делением в костном мозге, а не мейозом.", "en": "Red blood cells are made by ordinary division in the bone marrow, not by meiosis."}]),
    Q("evol-1-8",{"he": "איזה צירוף כרומוזומי מין מופיע בגבר?", "ar": "أي تركيب لكروموسومات الجنس يوجد عند الرجل؟", "ru": "Какое сочетание половых хромосом бывает у мужчины?", "en": "Which sex chromosome combination is found in a man?"},[{"he": "XY", "ar": "XY", "ru": "XY", "en": "XY"}, {"he": "XX", "ar": "XX", "ru": "XX", "en": "XX"}, {"he": "YY", "ar": "YY", "ru": "YY", "en": "YY"}, {"he": "X בלבד", "ar": "X فقط", "ru": "Только X", "en": "X only"}],0,{"he": "האם תורמת תמיד X, ולכן המין נקבע מהצד השני.", "ar": "الأمّ تعطي X دائمًا، لذلك يُحدَّد الجنس من الجهة الأخرى.", "ru": "Мать всегда даёт X, поэтому пол определяется с другой стороны.", "en": "The mother always gives an X, so the sex is decided by the other side."},{"he": "באדם 22 זוגות כרומוזומים דומים ועוד זוג כרומוזומי מין. באישה הזוג הוא XX, ובגבר XY. הביצית תורמת X תמיד, ולכן תא הזרע הוא שקובע אם ייוולד בן או בת.", "ar": "عند الإنسان 22 زوجًا من الكروموسومات المتشابهة وزوج من كروموسومات الجنس. عند المرأة الزوج XX، وعند الرجل XY. البويضة تعطي X دائمًا، لذلك الخلية المنوية هي التي تحدّد إن كان المولود ذكرًا أو أنثى.", "ru": "У человека 22 пары схожих хромосом и ещё пара половых хромосом. У женщины это XX, у мужчины XY. Яйцеклетка всегда даёт X, поэтому именно спермий решает, родится мальчик или девочка.", "en": "A human has 22 pairs of matching chromosomes plus one pair of sex chromosomes. In a woman the pair is XX, and in a man XY. The egg always gives an X, so it is the sperm that decides whether a boy or a girl is born."},null,[null, {"he": "XX הוא הצירוף של אישה, ולא של גבר.", "ar": "XX تركيب المرأة، لا الرجل.", "ru": "XX — сочетание женщины, а не мужчины.", "en": "XX is a woman's combination, not a man's."}, {"he": "YY אינו קיים, כי האם תורמת X לכל צאצא.", "ar": "YY غير موجود، لأن الأمّ تعطي X لكل نسل.", "ru": "YY не бывает, потому что мать даёт X каждому потомку.", "en": "YY does not exist, because the mother gives an X to every offspring."}, {"he": "X בלבד הוא מצב חריג ולא הצירוף הרגיל של גבר.", "ar": "X فقط حالة شاذّة وليست التركيب المعتاد للرجل.", "ru": "Только X — редкое отклонение, а не обычное сочетание мужчины.", "en": "X only is a rare condition, not a man's usual combination."}]),
    Q("evol-1-9",{"he": "מהו מאובן?", "ar": "ما الأحفورة (الحفرية)؟", "ru": "Что такое окаменелость?", "en": "What is a fossil?"},[{"he": "יצור חי שלא השתנה מאז ימי קדם", "ar": "كائن حيّ لم يتغيّر منذ القِدَم", "ru": "Живой организм, не менявшийся с древних времён", "en": "A living organism unchanged since ancient times"}, {"he": "שריד של יצור מהעבר שנשמר בסלע", "ar": "بقايا كائن من الماضي حُفظت في الصخر", "ru": "Остаток организма прошлого, сохранившийся в породе", "en": "A remnant of a past organism preserved in rock"}, {"he": "תא שנשמר במקפיא במעבדה", "ar": "خلية حُفظت في مجمّدة في المختبر", "ru": "Клетка, сохранённая в морозильнике лаборатории", "en": "A cell kept in a laboratory freezer"}, {"he": "ציור קדום של בעלי חיים על קיר מערה", "ar": "رسم قديم لحيوانات على جدار مغارة", "ru": "Древний рисунок животных на стене пещеры", "en": "An ancient drawing of animals on a cave wall"}],1,{"he": "חשבו מה חופרים ארכיאולוגים ופליאונטולוגים מתוך שכבות אדמה.", "ar": "فكّروا بما يحفره الباحثون من طبقات الأرض.", "ru": "Подумайте, что исследователи выкапывают из слоёв земли.", "en": "Think what researchers dig out of layers of earth."},{"he": "מאובן הוא עצם, שן, קונכייה או טביעה שהשתמרו בסלע במשך זמן רב. סדר השכבות מאפשר לדעת מה קדם למה, ולכן מאובנים הם עדות מרכזית לאבולוציה. למשל, מאובני סוסים מראים שינוי הדרגתי במבנה הרגל.", "ar": "الأحفورة عظم أو سنّ أو صدفة أو أثر حُفظ في الصخر زمنًا طويلًا. ترتيب الطبقات يسمح بمعرفة ما سبق ما، لذلك الأحافير دليل مركزي على التطوّر. مثلًا، أحافير الخيول تُظهر تغيّرًا تدريجيًّا في بنية الساق.", "ru": "Окаменелость — это кость, зуб, раковина или отпечаток, сохранившиеся в породе долгое время. Порядок слоёв позволяет узнать, что было раньше, поэтому окаменелости — ключевое свидетельство эволюции. Например, окаменелости лошадей показывают постепенное изменение строения ноги.", "en": "A fossil is a bone, tooth, shell or imprint preserved in rock over a long time. The order of the layers shows what came before what, so fossils are key evidence for evolution. Horse fossils, for example, show a gradual change in the structure of the leg."},null,[{"he": "יצור חי אינו מאובן, גם אם מינו קיים זמן רב מאוד.", "ar": "الكائن الحيّ ليس أحفورة، حتى لو بقي نوعه زمنًا طويلًا جدًّا.", "ru": "Живой организм не окаменелость, даже если его вид существует очень долго.", "en": "A living organism is not a fossil, even if its species has lasted a very long time."}, null, {"he": "שימור במעבדה הוא דגימה מודרנית, ואינו שריד שנוצר בסלע.", "ar": "الحفظ في المختبر عيّنة حديثة، وليس بقايا تكوّنت في الصخر.", "ru": "Хранение в лаборатории — современный образец, а не остаток, возникший в породе.", "en": "Laboratory storage is a modern sample, not a remnant formed in rock."}, {"he": "ציור מערה הוא עדות אנושית לתרבות, ואינו שריד של גוף היצור.", "ar": "رسم المغارة شاهد بشري على الثقافة، وليس بقايا جسم الكائن.", "ru": "Наскальный рисунок — человеческое свидетельство о культуре, а не остаток тела организма.", "en": "A cave painting is human evidence about culture, not a remnant of the creature's body."}]),

    Q("evol-2-1",{"he": "מצליבים שני הורים הטרוזיגוטיים Aa × Aa. מה ההסתברות לצאצא aa?", "ar": "نزاوج أبوين غير نقيّين Aa × Aa. ما احتمال أن يكون النسل aa؟", "ru": "Скрещивают две гетерозиготы Aa × Aa. Какова вероятность потомка aa?", "en": "Two heterozygous parents Aa × Aa are crossed. What is the probability of an aa offspring?"},[{"he": "25%", "ar": "25%", "ru": "25%", "en": "25%"}, {"he": "50%", "ar": "50%", "ru": "50%", "en": "50%"}, {"he": "75%", "ar": "75%", "ru": "75%", "en": "75%"}, {"he": "100%", "ar": "100%", "ru": "100%", "en": "100%"}],0,{"he": "כל הורה נותן A או a בהסתברות שווה. בנו טבלת פונט.", "ar": "كل والد يعطي A أو a باحتمال متساوٍ. ارسموا جدول بونيت.", "ru": "Каждый родитель передаёт A или a с равной вероятностью. Постройте решётку Пеннета.", "en": "Each parent passes on A or a with equal probability. Draw a Punnett square."},{"he": "הצאצאים האפשריים: AA, Aa, Aa, aa. אחד מארבעה הוא aa, כלומר 25%.", "ar": "النسل الممكن: AA وAa وAa وaa. واحد من أربعة هو aa أي 25%.", "ru": "Возможное потомство: AA, Aa, Aa, aa. Один из четырёх — aa, то есть 25%.", "en": "The possible offspring are AA, Aa, Aa and aa. One in four is aa, which is 25%."},null,[null, {"he": "50% הוא שיעור הצאצאים מסוג Aa, ולא שיעור הצאצאים מסוג aa.", "ar": "50% هي نسبة الأبناء من طراز Aa، لا نسبة الأبناء من طراز aa.", "ru": "50% — это доля потомков Aa, а не доля потомков aa.", "en": "50% is the share of Aa offspring, not the share of aa offspring."}, {"he": "75% הוא שיעור הצאצאים שמראים את התכונה השלטת A.", "ar": "75% هي نسبة الأبناء الذين تظهر لديهم الصفة السائدة A.", "ru": "75% — доля потомков, у которых проявляется доминантный признак A.", "en": "75% is the share of offspring showing the dominant trait A."}, {"he": "100% היה מתקבל רק אילו שני ההורים היו aa, ולא Aa.", "ar": "100% تتحقّق فقط لو كان الوالدان aa، لا Aa.", "ru": "100% получилось бы, только если бы оба родителя были aa, а не Aa.", "en": "100% would occur only if both parents were aa, not Aa."}]),
    Q("evol-2-2",{"he": "מה מקור השוני התורשתי בין פרטים באוכלוסייה?", "ar": "ما مصدر الاختلاف الوراثي بين أفراد المجموعة؟", "ru": "Что является источником наследственных различий между особями популяции?", "en": "What is the source of hereditary differences between individuals in a population?"},[{"he": "מוטציות ורבייה מינית, כולל חלוקת מיוזה", "ar": "الطفرات والتكاثر الجنسي بما فيه الانقسام الاختزالي", "ru": "Мутации и половое размножение, включая мейоз", "en": "Mutations and sexual reproduction, including meiosis"}, {"he": "תכונות שההורים רכשו בחייהם, כמו שרירים מאימון", "ar": "صفات اكتسبها الوالدان في حياتهما، مثل عضلات من التمرين", "ru": "Признаки, приобретённые родителями при жизни, например мышцы от тренировок", "en": "Traits the parents acquired in life, such as muscles from training"}, {"he": "הבדלים בתזונה בין פרטים באותה אוכלוסייה", "ar": "فروق في التغذية بين أفراد الوسط السكّاني نفسه", "ru": "Различия в питании между особями одной популяции", "en": "Differences in diet between individuals of the same population"}, {"he": "שינויים שהפרט מחולל בגופו כתגובה לסביבה", "ar": "تغييرات يُحدثها الفرد في جسمه استجابةً للبيئة", "ru": "Изменения, которые особь производит в своём теле в ответ на среду", "en": "Changes the individual makes in its body in response to the environment"}],0,{"he": "השוני חייב להיות כתוב ב-DNA כדי לעבור לצאצאים.", "ar": "الاختلاف يجب أن يكون مكتوبًا في الـDNA ليُنقل إلى النسل.", "ru": "Различие должно быть записано в ДНК, чтобы передаться потомству.", "en": "The difference must be written in DNA to pass to offspring."},{"he": "מוטציות יוצרות אללים חדשים. ברבייה מינית מיוזה מערבבת אללים, והמפגש בין תאי רבייה יוצר צירופים חדשים. תכונות שנרכשו בחיים, כמו שרירים, אינן עוברות בתורשה.", "ar": "الطفرات تُنتج أليلات جديدة. وفي التكاثر الجنسي يخلط الانقسام الاختزالي الأليلات، ويكوّن لقاء الأمشاج تركيبات جديدة. الصفات المكتسبة في الحياة مثل العضلات لا تُورَّث.", "ru": "Мутации создают новые аллели. При половом размножении мейоз перемешивает аллели, а слияние гамет создаёт новые сочетания. Признаки, приобретённые в жизни, например мышцы, не наследуются.", "en": "Mutations create new alleles. In sexual reproduction meiosis mixes alleles, and the meeting of gametes makes new combinations. Traits acquired during life, such as muscles, are not inherited."},null,[null, {"he": "שריר שנבנה באימון אינו משנה את ה-DNA בתאי הרבייה, ולכן אינו עובר.", "ar": "العضلة التي تُبنى بالتمرين لا تغيّر الـDNA في الخلايا التناسلية، فلا تنتقل.", "ru": "Мышца от тренировок не меняет ДНК половых клеток и потому не передаётся.", "en": "Muscle built by training does not change DNA in sex cells, so it is not passed."}, {"he": "תזונה משפיעה על מראה הפרט, אבל אינה יוצרת אללים חדשים.", "ar": "التغذية تؤثّر في مظهر الفرد، لكنها لا تُنتج أليلات جديدة.", "ru": "Питание влияет на облик особи, но не создаёт новых аллелей.", "en": "Diet affects how an individual looks, but it does not create new alleles."}, {"he": "שינוי שהפרט מחולל בגופו אינו נכתב בגנים, ולכן אינו מקור לשוני תורשתי.", "ar": "التغيير الذي يُحدثه الفرد في جسمه لا يُكتب في الجينات، فليس مصدرًا وراثيًّا.", "ru": "Изменение, сделанное самой особью, не пишется в гены и не даёт наследования.", "en": "A change the individual makes is not written into genes, so it is not inherited."}]),
    Q("evol-2-3",{"he": "מצליבים הורה הטרוזיגוטי Aa עם הורה הומוזיגוטי aa. איזה חלק מהצאצאים יראה את התכונה הרצסיבית?", "ar": "نزاوج أبًا غير نقيّ Aa مع أبٍ نقيّ aa. أي نسبة من النسل ستُظهر الصفة المتنحّية؟", "ru": "Скрещивают гетерозиготного родителя Aa с гомозиготным aa. Какая доля потомства покажет рецессивный признак?", "en": "A heterozygous parent Aa is crossed with a homozygous aa parent. What share of the offspring will show the recessive trait?"},[{"he": "25 אחוז", "ar": "25 بالمئة", "ru": "25 процентов", "en": "25 percent"}, {"he": "50 אחוז", "ar": "50 بالمئة", "ru": "50 процентов", "en": "50 percent"}, {"he": "75 אחוז", "ar": "75 بالمئة", "ru": "75 процентов", "en": "75 percent"}, {"he": "אפס אחוז", "ar": "صفر بالمئة", "ru": "Ноль процентов", "en": "Zero percent"}],1,{"he": "ההורה aa תורם a בכל מקרה, ולכן ההכרעה היא אצל ההורה השני.", "ar": "الأب aa يعطي a في كل الحالات، فالحسم عند الأب الآخر.", "ru": "Родитель aa всегда даёт a, значит решает другой родитель.", "en": "The aa parent always gives an a, so the other parent decides."},{"he": "ההורה aa תורם a בכל תא רבייה. ההורה Aa תורם A בחצי מהמקרים ו-a בחצי. לכן מחצית הצאצאים הם Aa ומראים את התכונה הדומיננטית, ומחציתם aa ומראים את הרצסיבית.", "ar": "الأب aa يعطي a في كل خلية تناسلية. والأب Aa يعطي A في نصف الحالات وa في النصف. لذلك نصف النسل Aa ويُظهر الصفة السائدة، ونصفه aa ويُظهر المتنحّية.", "ru": "Родитель aa даёт a в каждой половой клетке. Родитель Aa даёт A в половине случаев и a в половине. Поэтому половина потомства — Aa и показывает доминантный признак, а половина — aa и показывает рецессивный.", "en": "The aa parent gives an a in every sex cell. The Aa parent gives A half the time and a half the time. So half the offspring are Aa and show the dominant trait, and half are aa and show the recessive one."},null,[{"he": "25 אחוז מתקבלים בהצלבת שני הטרוזיגוטים, ולא בהצלבה הזאת.", "ar": "25 بالمئة تنتج من تزاوج اثنين غير نقيّين، لا من هذا التزاوج.", "ru": "25 процентов получаются при скрещивании двух гетерозигот, а не в этом случае.", "en": "25 percent comes from crossing two heterozygotes, not from this cross."}, null, {"he": "75 אחוז הם חלק הדומיננטיים בהצלבת Aa עם Aa, ולא כאן.", "ar": "75 بالمئة نسبة السائدين في تزاوج Aa مع Aa، لا هنا.", "ru": "75 процентов — доля доминантных при скрещивании Aa с Aa, а не здесь.", "en": "75 percent is the dominant share when Aa is crossed with Aa, not here."}, {"he": "ההורה aa תורם a, ולכן חלק מהצאצאים בהכרח aa ומראים את התכונה.", "ar": "الأب aa يعطي a، لذلك جزء من النسل aa بالضرورة ويُظهر الصفة.", "ru": "Родитель aa даёт a, поэтому часть потомства непременно aa и признак показывает.", "en": "The aa parent gives an a, so some offspring must be aa and show the trait."}]),
    Q("evol-2-4",{"he": "למה שני אחים מאותם הורים אינם זהים זה לזה?", "ar": "لماذا لا يكون شقيقان من الوالدين نفسهما متماثلين؟", "ru": "Почему два ребёнка от одних родителей не одинаковы?", "en": "Why are two siblings from the same parents not identical?"},[{"he": "כי לכל אחד מספר כרומוזומים אחר", "ar": "لأن لكل واحد عددًا مختلفًا من الكروموسومات", "ru": "Потому что у каждого своё число хромосом", "en": "Because each has a different number of chromosomes"}, {"he": "כי ההורים השתנו בין הלידות", "ar": "لأن الوالدين تغيّرا بين الولادتين", "ru": "Потому что родители изменились между родами", "en": "Because the parents changed between the births"}, {"he": "כי מוטציות חדשות קורות בכל צאצא באותם גנים", "ar": "لأن طفرات جديدة تحدث في كل نسل في الجينات نفسها", "ru": "Потому что у каждого потомка новые мутации в тех же генах", "en": "Because new mutations occur in every offspring in the same genes"}, {"he": "כי כל תא רבייה נושא צירוף אללים אחר", "ar": "لأن كل خلية تناسلية تحمل تركيب أليلات مختلفًا", "ru": "Потому что каждая половая клетка несёт иное сочетание аллелей", "en": "Because each sex cell carries a different combination of alleles"}],3,{"he": "חשבו מה קורה לזוגות הכרומוזומים בזמן יצירת תאי הרבייה.", "ar": "فكّروا بما يحدث لأزواج الكروموسومات أثناء تكوين الخلايا التناسلية.", "ru": "Подумайте, что происходит с парами хромосом при образовании половых клеток.", "en": "Think what happens to the chromosome pairs when sex cells are formed."},{"he": "במיוזה כל זוג כרומוזומים נפרד באופן מקרי, ולכן מספר הצירופים האפשריים עצום. בהפריה נפגשים שני תאי רבייה מתוך מיליונים, וכך כל צאצא מקבל ערבוב אחר. תאומים זהים הם היוצא מן הכלל, כי הם נוצרו מאותו תא מופרה.", "ar": "في الانقسام المنصّف يفترق كل زوج كروموسومات بشكل عشوائي، فيكون عدد التراكيب الممكنة هائلًا. وعند الإلقاح تتلاقى خليّتان تناسليّتان من ملايين، فيحصل كل نسل على خلط مختلف. والتوأمان المتماثلان استثناء، لأنهما نشأا من البيضة الملقّحة نفسها.", "ru": "В мейозе каждая пара хромосом расходится случайно, поэтому число возможных сочетаний огромно. При оплодотворении встречаются две половые клетки из миллионов, и каждый потомок получает другое перемешивание. Однояйцевые близнецы — исключение, ведь они возникли из одной оплодотворённой клетки.", "en": "In meiosis each chromosome pair separates at random, so the number of possible combinations is vast. At fertilisation two sex cells out of millions meet, and so every offspring gets a different shuffle. Identical twins are the exception, because they came from the same fertilised cell."},null,[{"he": "לכל בני אותו מין אותו מספר כרומוזומים, 46 באדם.", "ar": "لكل أفراد النوع العدد نفسه من الكروموسومات، 46 عند الإنسان.", "ru": "У всех особей вида одно число хромосом — 46 у человека.", "en": "All members of a species share the chromosome number, 46 in humans."}, {"he": "ה-DNA של ההורים נשאר אותו DNA, וההבדל נוצר בערבוב האללים.", "ar": "DNA الوالدين يبقى نفسه، والفرق ينشأ في خلط الأليلات.", "ru": "ДНК родителей остаётся той же, различие возникает при перемешивании аллелей.", "en": "The parents' DNA stays the same DNA; the difference comes from shuffling alleles."}, {"he": "מוטציות חדשות נדירות, ואינן מסבירות את ההבדלים הרגילים בין אחים.", "ar": "الطفرات الجديدة نادرة، ولا تفسّر الفروق المعتادة بين الأشقّاء.", "ru": "Новые мутации редки и обычных различий между детьми не объясняют.", "en": "New mutations are rare and do not explain the ordinary differences between siblings."}, null]),
    Q("evol-2-5",{"he": "למה אומרים שאוכלוסייה מתפתחת באבולוציה, ולא פרט בודד?", "ar": "لماذا يُقال إن المجموعة يتطوّر، لا الفرد الواحد؟", "ru": "Почему говорят, что эволюционирует популяция, а не отдельная особь?", "en": "Why is it said that a population evolves, and not a single individual?"},[{"he": "כי פרט בודד אינו נושא אללים כלל", "ar": "لأن الفرد الواحد لا يحمل أليلات أبدًا", "ru": "Потому что отдельная особь аллелей вовсе не несёт", "en": "Because a single individual carries no alleles at all"}, {"he": "כי פרט בודד אינו יכול למות", "ar": "لأن الفرد الواحد لا يمكن أن يموت", "ru": "Потому что отдельная особь не может умереть", "en": "Because a single individual cannot die"}, {"he": "כי אבולוציה היא שינוי בשכיחות האללים לאורך דורות", "ar": "لأن التطوّر تغيّر في تواتر الأليلات على مدى أجيال", "ru": "Потому что эволюция — изменение частоты аллелей на протяжении поколений", "en": "Because evolution is a change in allele frequencies across generations"}, {"he": "כי פרט בודד משנה את הגנים שלו בכל שנה", "ar": "لأن الفرد الواحد يغيّر جيناته كل سنة", "ru": "Потому что отдельная особь каждый год меняет свои гены", "en": "Because a single individual changes its genes every year"}],2,{"he": "שאלו מה בדיוק נמדד כשאומרים שהתרחשה אבולוציה.", "ar": "اسألوا ما الذي يُقاس بالضبط عند القول إن تطوّرًا حدث.", "ru": "Спросите, что именно измеряют, когда говорят, что произошла эволюция.", "en": "Ask what exactly is measured when we say evolution has happened."},{"he": "האללים של פרט נקבעים בהפריה ואינם משתנים בחייו. מה שכן משתנה הוא היחס בין האללים באוכלוסייה: אלל שמיטיב עם ההישרדות נעשה שכיח יותר בדור הבא. לכן היחידה המתפתחת היא האוכלוסייה.", "ar": "أليلات الفرد تُحدَّد عند الإلقاح ولا تتغيّر في حياته. أما ما يتغيّر فهو النسبة بين الأليلات في المجموعة: الأليل الذي يُحسّن البقاء يصبح أكثر شيوعًا في الجيل التالي. لذلك الوحدة المتطوّرة هي المجموعة.", "ru": "Аллели особи задаются при оплодотворении и в течение жизни не меняются. Меняется же соотношение аллелей в популяции: аллель, улучшающий выживание, становится более частым в следующем поколении. Поэтому эволюционирует именно популяция.", "en": "An individual's alleles are set at fertilisation and do not change during its life. What does change is the ratio between alleles in the population: an allele that improves survival becomes more common in the next generation. So the unit that evolves is the population."},null,[{"he": "לכל פרט יש אללים, והנקודה היא שהם אינם משתנים במהלך חייו.", "ar": "لكل فرد أليلات، والمقصود أنها لا تتغيّر خلال حياته.", "ru": "У каждой особи аллели есть; суть в том, что в течение её жизни они не меняются.", "en": "Every individual has alleles; the point is that they do not change during its life."}, {"he": "פרט בודד בהחלט מת, וזה בדיוק מה שמשנה את השכיחות באוכלוסייה.", "ar": "الفرد الواحد يموت بالتأكيد، وهذا بالضبط ما يغيّر التواتر في المجموعة.", "ru": "Отдельная особь, конечно, умирает, и это как раз меняет частоты в популяции.", "en": "A single individual certainly dies, and that is exactly what changes the frequencies in the population."}, null, {"he": "גנים אינם מתחלפים בגוף במהלך החיים, מלבד מוטציות מקריות.", "ar": "الجينات لا تُستبدل في الجسم خلال الحياة، إلا بطفرات عشوائية.", "ru": "Гены в теле за время жизни не заменяются, кроме случайных мутаций.", "en": "Genes are not swapped in the body during life, apart from random mutations."}]),
    Q("evol-2-6",{"he": "למה ההסבר ״הג'ירפה מתחה את צווארה והעבירה את הצוואר הארוך לצאצאים״ אינו נכון?", "ar": "لماذا التفسير «الزرافة مدّت رقبتها فأورثت الرقبة الطويلة لنسلها» غير صحيح؟", "ru": "Почему объяснение «жираф вытягивал шею и передал длинную шею потомству» неверно?", "en": "Why is the explanation that the giraffe stretched its neck and passed the long neck on to its offspring wrong?"},[{"he": "כי תכונה שנרכשת בחיים אינה נכנסת לתאי הרבייה", "ar": "لأن صفة تُكتسَب في الحياة لا تدخل الخلايا التناسلية", "ru": "Потому что приобретённый в жизни признак в половые клетки не попадает", "en": "Because a trait gained during life does not enter the sex cells"}, {"he": "כי אורך הצוואר אינו תכונה תורשתית בכלל", "ar": "لأن طول الرقبة ليس صفة وراثية أبدًا", "ru": "Потому что длина шеи вовсе не наследственный признак", "en": "Because neck length is not a hereditary trait at all"}, {"he": "כי לג'ירפות אין אללים שונים לאורך הצוואר", "ar": "لأن الزرافات لا تملك أليلات مختلفة لطول الرقبة", "ru": "Потому что у жирафов нет разных аллелей длины шеи", "en": "Because giraffes have no different alleles for neck length"}, {"he": "כי ברירה טבעית פועלת רק על צמחים", "ar": "لأن الانتقاء الطبيعي يعمل على النباتات فقط", "ru": "Потому что естественный отбор действует только на растения", "en": "Because natural selection acts only on plants"}],0,{"he": "שאלו איפה בדיוק צריך השינוי להיות כדי לעבור לדור הבא.", "ar": "اسألوا أين يجب أن يكون التغيّر بالضبط كي ينتقل إلى الجيل التالي.", "ru": "Спросите, где именно должно быть изменение, чтобы перейти в следующее поколение.", "en": "Ask where exactly the change must be in order to pass to the next generation."},{"he": "מתיחת שרירים משנה את הגוף ולא את ה-DNA שבתאי הרבייה, ולכן היא אינה עוברת. ההסבר הנכון הוא שבאוכלוסייה היו ג'ירפות עם צוואר ארוך יותר מסיבות תורשתיות, הן הגיעו למזון גבוה, שרדו והותירו יותר צאצאים. כך שכיחות האלל לצוואר ארוך עלתה.", "ar": "مدّ العضلات يغيّر الجسم لا DNA في الخلايا التناسلية، فلا ينتقل. والتفسير الصحيح أن في المجموعة كانت زرافات برقبة أطول لأسباب وراثية، فوصلت إلى طعام عالٍ وبقيت وأنجبت نسلًا أكثر. هكذا ارتفع تواتر الأليل للرقبة الطويلة.", "ru": "Растягивание мышц меняет тело, а не ДНК половых клеток, поэтому оно не передаётся. Верное объяснение: в популяции были жирафы с более длинной шеей по наследственным причинам, они доставали высокий корм, выживали и оставляли больше потомства. Так частота аллеля длинной шеи выросла.", "en": "Stretching muscles changes the body, not the DNA in the sex cells, so it is not passed on. The correct explanation is that the population already held giraffes with longer necks for hereditary reasons; they reached high food, survived and left more offspring. So the frequency of the long-neck allele rose."},null,[null, {"he": "אורך הצוואר כן תורשתי, ולכן ברירה טבעית יכולה לפעול עליו.", "ar": "طول الرقبة وراثي فعلًا، لذلك يستطيع الانتقاء الطبيعي أن يعمل عليه.", "ru": "Длина шеи наследуется, поэтому естественный отбор может на неё действовать.", "en": "Neck length is hereditary, which is why natural selection can act on it."}, {"he": "באוכלוסייה יש שוני תורשתי באורך הצוואר, וזה התנאי לברירה.", "ar": "في المجموعة تنوّع وراثي في طول الرقبة، وهذا شرط الانتقاء.", "ru": "В популяции есть наследственное разнообразие длины шеи, и это условие отбора.", "en": "The population does hold hereditary variation in neck length, and that is the condition for selection."}, {"he": "ברירה טבעית פועלת על כל היצורים, צמחים ובעלי חיים כאחד.", "ar": "الانتقاء الطبيعي يعمل على كل الكائنات، نباتات وحيوانات على حدّ سواء.", "ru": "Естественный отбор действует на все организмы — и растения, и животных.", "en": "Natural selection acts on all organisms, plants and animals alike."}]),
    Q("evol-2-7",{"he": "שני הורים בריאים, ולהם ילד עם מחלה תורשתית רצסיבית. איך זה ייתכן?", "ar": "والدان سليمان، ولهما طفل بمرض وراثي متنحٍّ. كيف يُمكن ذلك؟", "ru": "Двое здоровых родителей, а у них ребёнок с рецессивным наследственным заболеванием. Как это возможно?", "en": "Two healthy parents have a child with a recessive hereditary disease. How can that be?"},[{"he": "המחלה עברה אל הילד מהסביבה ולא מההורים", "ar": "انتقل المرض إلى الطفل من البيئة لا من الوالدين", "ru": "Болезнь перешла к ребёнку от среды, а не от родителей", "en": "The disease came to the child from the environment and not from the parents"}, {"he": "שני ההורים הטרוזיגוטיים, כלומר נשאים בריאים", "ar": "الوالدان غير نقيّين، أي حاملان سليمان", "ru": "Оба родителя гетерозиготны, то есть здоровые носители", "en": "Both parents are heterozygous, that is, healthy carriers"}, {"he": "אחד ההורים חולה בלי לדעת על כך", "ar": "أحد الوالدين مريض دون أن يدري", "ru": "Один из родителей болен и не знает об этом", "en": "One parent is ill without knowing it"}, {"he": "המחלה נוצרה בילד בגלל תזונה לא נכונה", "ar": "نشأ المرض عند الطفل بسبب تغذية غير سليمة", "ru": "Болезнь возникла у ребёнка из-за неправильного питания", "en": "The disease arose in the child because of poor nutrition"}],1,{"he": "אלל רצסיבי מתבטא רק כשהוא מופיע פעמיים.", "ar": "الأليل المتنحّي يتجلّى فقط عند ظهوره مرّتين.", "ru": "Рецессивный аллель проявляется только тогда, когда он представлен дважды.", "en": "A recessive allele shows only when it appears twice."},{"he": "הורה Aa בריא, כי האלל הדומיננטי A מכסה על a. כששני הורים Aa מצליבים, יש סיכוי של 25 אחוז לצאצא aa שיחלה. כך מחלות כמו סיסטיק פיברוזיס מופיעות במשפחות בריאות.", "ar": "الأب Aa سليم، لأن الأليل السائد A يغطّي على a. وعندما يتزاوج والدان Aa، يكون احتمال نسل aa مريض 25 بالمئة. هكذا تظهر أمراض كالتليّف الكيسي في عائلات سليمة.", "ru": "Родитель Aa здоров, потому что доминантный аллель A прикрывает a. Когда скрещиваются два родителя Aa, вероятность потомка aa и больного равна 25 процентам. Так болезни вроде кистозного фиброза появляются в здоровых семьях.", "en": "An Aa parent is healthy, because the dominant allele A masks the a. When two Aa parents have children, the chance of an aa affected child is 25 percent. This is how diseases such as cystic fibrosis appear in healthy families."},null,[{"he": "מחלה תורשתית אינה נקנית מהסביבה, והיא נמצאת ב-DNA שהתקבל מההורים.", "ar": "المرض الوراثي لا يُكتسَب من البيئة، وهو في DNA الذي جاء من الوالدين.", "ru": "Наследственная болезнь из среды не приобретается; она в ДНК, полученной от родителей.", "en": "A hereditary disease is not picked up from the environment; it sits in the DNA received from the parents."}, null, {"he": "הורה aa היה חולה בפועל, והשאלה אומרת ששניהם בריאים.", "ar": "الأب aa كان سيكون مريضًا فعلًا، والسؤال يقول إن كليهما سليم.", "ru": "Родитель aa был бы болен на деле, а в вопросе сказано, что оба здоровы.", "en": "An aa parent would actually be ill, and the question says both are healthy."}, {"he": "תזונה אינה יוצרת אללים, ומחלה רצסיבית נובעת מצירוף האללים.", "ar": "التغذية لا تُنشئ أليلات، والمرض المتنحّي ناتج عن تركيب الأليلات.", "ru": "Питание аллелей не создаёт, а рецессивная болезнь следует из сочетания аллелей.", "en": "Nutrition does not create alleles, and a recessive disease follows from the allele combination."}]),
    Q("evol-2-8",{"he": "למה תכונה רצסיבית שהגן שלה על כרומוזום X שכיחה יותר בגברים?", "ar": "لماذا تكون الصفة المتنحّية التي جينها على كروموسوم X أكثر شيوعًا عند الرجال؟", "ru": "Почему рецессивный признак, ген которого на хромосоме X, чаще встречается у мужчин?", "en": "Why is a recessive trait whose gene lies on the X chromosome more common in men?"},[{"he": "כי גברים נושאים יותר מוטציות מנשים", "ar": "لأن الرجال يحملون طفرات أكثر من النساء", "ru": "Потому что мужчины несут больше мутаций, чем женщины", "en": "Because men carry more mutations than women"}, {"he": "כי כרומוזום Y נושא עוד עותק של אותו גן", "ar": "لأن كروموسوم Y يحمل نسخة أخرى من الجين نفسه", "ru": "Потому что хромосома Y несёт ещё одну копию того же гена", "en": "Because the Y chromosome carries another copy of the same gene"}, {"he": "כי לגבר X אחד, ולכן אלל רצסיבי אחד מספיק", "ar": "لأن للرجل X واحد، فيكفي أليل متنحٍّ واحد", "ru": "Потому что у мужчины одна X, и одного рецессивного аллеля достаточно", "en": "Because a man has one X, so a single recessive allele is enough"}, {"he": "כי אצל נשים הגן הזה אינו קיים כלל", "ar": "لأن هذا الجين غير موجود عند النساء أبدًا", "ru": "Потому что у женщин этого гена вовсе нет", "en": "Because women do not have this gene at all"}],2,{"he": "ספרו כמה עותקים של הגן יש לגבר וכמה לאישה.", "ar": "عُدّوا كم نسخة من الجين للرجل وكم للمرأة.", "ru": "Посчитайте, сколько копий гена у мужчины и сколько у женщины.", "en": "Count how many copies of the gene a man has and how many a woman has."},{"he": "לאישה שני כרומוזומי X, ולכן אלל רצסיבי אחד מוסתר על ידי האלל התקין שבעותק השני. לגבר יש X אחד בלבד, ואין לו עותק שני שיסתיר, ולכן האלל מתבטא מיד. בגלל זה עיוורון צבעים והמופיליה שכיחים יותר בגברים.", "ar": "للمرأة كروموسوما X، لذلك يُحجَب أليل متنحٍّ واحد بالأليل السليم في النسخة الثانية. وللرجل X واحد فقط، ولا نسخة ثانية تحجبه، فيتجلّى الأليل فورًا. لهذا يشيع عمى الألوان والهيموفيليا أكثر عند الرجال.", "ru": "У женщины две хромосомы X, поэтому один рецессивный аллель прикрывается нормальным аллелем второй копии. У мужчины только одна X, второй копии для прикрытия нет, и аллель проявляется сразу. Поэтому дальтонизм и гемофилия чаще у мужчин.", "en": "A woman has two X chromosomes, so one recessive allele is masked by the normal allele on the second copy. A man has only one X and no second copy to mask it, so the allele shows at once. This is why colour blindness and haemophilia are more common in men."},null,[{"he": "שיעור המוטציות דומה, וההסבר הוא במספר העותקים של הגן.", "ar": "معدّل الطفرات متشابه، والتفسير في عدد نسخ الجين.", "ru": "Частота мутаций сходна, а объяснение — в числе копий гена.", "en": "The mutation rate is similar; the explanation lies in the number of gene copies."}, {"he": "כרומוזום Y קטן ואינו נושא את הגנים שעל X, ולכן אין עותק מכסה.", "ar": "كروموسوم Y صغير ولا يحمل جينات X، فلا توجد نسخة حاجبة.", "ru": "Хромосома Y мала и генов X не несёт, поэтому прикрывающей копии нет.", "en": "The Y chromosome is small and does not carry the X genes, so there is no masking copy."}, null, {"he": "הגן קיים גם אצל נשים, והן נושאות שני עותקים שלו.", "ar": "الجين موجود عند النساء أيضًا، وهنّ يحملن نسختين منه.", "ru": "Ген есть и у женщин, и они несут две его копии.", "en": "The gene exists in women too, and they carry two copies of it."}]),
    Q("evol-2-9",{"he": "שני מינים נמצאו דומים מאוד ברצף ה-DNA שלהם. מה זה מרמז?", "ar": "وُجد نوعان متشابهان جدًّا في تسلسل DNA. على ماذا يدلّ ذلك؟", "ru": "Два вида оказались очень похожи по последовательности ДНК. На что это указывает?", "en": "Two species were found to be very similar in their DNA sequence. What does this suggest?"},[{"he": "שהם חיים בוודאות באותה סביבה", "ar": "أنهما يعيشان بالتأكيد في البيئة نفسها", "ru": "Что они наверняка живут в одной среде", "en": "That they certainly live in the same environment"}, {"he": "שהם יכולים להתרבות זה עם זה", "ar": "أنهما يستطيعان التزاوج معًا", "ru": "Что они могут размножаться друг с другом", "en": "That they can breed with each other"}, {"he": "שאחד מהם התפתח ישירות מהשני", "ar": "أن أحدهما تطوّر مباشرةً من الآخر", "ru": "Что один из них произошёл прямо от другого", "en": "That one of them evolved directly from the other"}, {"he": "שיש להם אב קדמון משותף קרוב יחסית", "ar": "أن لهما سلفًا مشتركًا قريبًا نسبيًّا", "ru": "Что у них относительно близкий общий предок", "en": "That they share a relatively recent common ancestor"}],3,{"he": "חשבו על שתי משפחות שיש להן אותו סבא רבא.", "ar": "فكّروا بعائلتين لهما الجدّ الأكبر نفسه.", "ru": "Подумайте о двух семьях с одним общим прадедом.", "en": "Think of two families that share the same great-grandparent."},{"he": "רצף ה-DNA משתנה בהדרגה לאורך דורות, ולכן דמיון רב פירושו שהזמן מההיפרדות קצר יחסית. דמיון של 98 אחוזים בין אדם לשימפנזה מעיד על אב קדמון משותף קרוב. דמיון אינו אומר שאפשר להתרבות או שאחד צאצא של השני.", "ar": "تسلسل DNA يتغيّر تدريجيًّا على مدى الأجيال، فالتشابه الكبير يعني أن الزمن منذ الافتراق قصير نسبيًّا. والتشابه بنسبة 98 بالمئة بين الإنسان والشمبانزي يدلّ على سلف مشترك قريب. التشابه لا يعني إمكان التزاوج ولا أن أحدهما نسل الآخر.", "ru": "Последовательность ДНК меняется постепенно за поколения, поэтому большое сходство означает, что времени с момента расхождения прошло относительно мало. Сходство в 98 процентов между человеком и шимпанзе говорит о близком общем предке. Сходство не значит, что возможно скрещивание или что один — потомок другого.", "en": "A DNA sequence changes gradually over generations, so a high similarity means relatively little time has passed since they split. The 98 percent similarity between humans and chimpanzees points to a recent common ancestor. Similarity does not mean they can interbreed or that one descends from the other."},null,[{"he": "קרובים גנטית יכולים לחיות בסביבות שונות לגמרי, כמו דוב קוטב ודוב חום.", "ar": "الأقارب جينيًّا قد يعيشون في بيئات مختلفة تمامًا، كالدبّ القطبي والدبّ البنّي.", "ru": "Генетически близкие могут жить в совершенно разных средах, как белый и бурый медведь.", "en": "Genetically close species can live in wholly different environments, like the polar bear and the brown bear."}, {"he": "מינים נפרדים אינם מעמידים צאצאים פוריים גם כשה-DNA שלהם דומה.", "ar": "الأنواع المنفصلة لا تُنتج نسلًا خصيبًا حتى لو تشابه DNA.", "ru": "Отдельные виды плодовитого потомства не дают, даже если их ДНК похожа.", "en": "Separate species do not produce fertile offspring even when their DNA is similar."}, {"he": "דמיון מצביע על אב משותף, ולא על כך שמין אחד הוא אבי השני.", "ar": "التشابه يدلّ على سلف مشترك، لا على أن نوعًا هو أبو الآخر.", "ru": "Сходство указывает на общего предка, а не на то, что один вид — родитель другого.", "en": "Similarity points to a shared ancestor, not to one species being the parent of the other."}, null]),
 ],
 [
    Q("evol-3-1",{"he": "אחרי טיפול באנטיביוטיקה נשארו בחולה בעיקר חיידקים עמידים. איזה הסבר מתאים?", "ar": "بعد العلاج بالمضاد الحيوي بقيت في المريض بكتيريا مقاوِمة في الأساس. أي تفسير يناسب؟", "ru": "После лечения антибиотиком у больного остались в основном устойчивые бактерии. Какое объяснение подходит?", "en": "After antibiotic treatment the patient was left mainly with resistant bacteria. Which explanation fits?"},[{"he": "בין החיידקים היו כאלה עם מוטציה מקרית שהעניקה עמידות, והם שרדו והתרבו", "ar": "كان بين البكتيريا ما لديها طفرة عشوائية منحتها مقاومة، فنجت وتكاثرت", "ru": "Среди бактерий были такие со случайной мутацией, давшей устойчивость; они выжили и размножились", "en": "Some bacteria already had a chance mutation that gave resistance, and they survived and multiplied"}, {"he": "החיידקים פיתחו עמידות במהלך הטיפול כתגובה לתרופה", "ar": "البكتيريا طوّرت مقاومة أثناء العلاج استجابةً للدواء", "ru": "Бактерии выработали устойчивость во время лечения в ответ на лекарство", "en": "The bacteria developed resistance during treatment in response to the drug"}, {"he": "האנטיביוטיקה גרמה למוטציה של עמידות בכל החיידקים שנחשפו אליה בגוף", "ar": "المضادّ الحيوي سبّب طفرة مقاومة في كل البكتيريا التي تعرّضت له في الجسم", "ru": "Антибиотик вызвал мутацию устойчивости у всех бактерий, встретивших его", "en": "The antibiotic caused a resistance mutation in every bacterium exposed to it"}, {"he": "החיידקים העמידים הגיעו מבחוץ אחרי הטיפול ולא היו באוכלוסייה שבגוף קודם", "ar": "البكتيريا المقاومة وصلت من الخارج بعد العلاج ولم تكن في الوسط داخل الجسم من قبل", "ru": "Устойчивые бактерии пришли извне уже после лечения, а раньше их в организме этого больного не было", "en": "The resistant bacteria arrived from outside after the treatment and were not in this patient before"}],0,{"he": "האם העמידות נוצרה בגלל התרופה או היתה קיימת קודם בחלק מהחיידקים?", "ar": "هل نشأت المقاومة بسبب الدواء أم كانت موجودة سابقًا لدى بعض البكتيريا؟", "ru": "Устойчивость появилась из-за лекарства или уже была у части бактерий?", "en": "Did the resistance appear because of the drug, or did some bacteria already have it?"},{"he": "הברירה הטבעית פועלת על שוני שכבר קיים. האנטיביוטיקה השמידה את החיידקים הרגישים, והעמידים, שהיו מעטים, שרדו והתרבו. התרופה אינה גורמת למוטציה הזאת.", "ar": "الانتخاب الطبيعي يعمل على اختلاف موجود أصلًا. قضى المضاد الحيوي على البكتيريا الحسّاسة، وبقيت المقاوِمة، وكانت قليلة، فتكاثرت. الدواء لا يسبّب هذه الطفرة.", "ru": "Естественный отбор действует на уже существующие различия. Антибиотик уничтожил чувствительные бактерии, а устойчивые, которых было мало, выжили и размножились. Лекарство не вызывает эту мутацию.", "en": "Natural selection acts on variation that already exists. The antibiotic killed the sensitive bacteria, and the few resistant ones survived and multiplied. The drug does not cause that mutation."},null,[null, {"he": "חיידק אינו מפתח עמידות לפי הצורך: המוטציה מקרית וקודמת לתרופה.", "ar": "البكتيريا لا تطوّر مقاومة حسب الحاجة: الطفرة عشوائية وتسبق الدواء.", "ru": "Бактерия не вырабатывает устойчивость по нужде: мутация случайна и ранняя.", "en": "Bacteria do not develop resistance on demand: the mutation is random and earlier."}, {"he": "האנטיביוטיקה בוררת מי ישרוד, והיא אינה יוצרת את המוטציה עצמה.", "ar": "المضادّ الحيوي ينتقي مَن ينجو، وهو لا يصنع الطفرة نفسها.", "ru": "Антибиотик отбирает выживших, но саму мутацию он не создаёт.", "en": "The antibiotic selects who survives; it does not create the mutation itself."}, {"he": "ייתכן שיגיעו חיידקים מבחוץ, אבל כאן העמידים כבר היו בחולה מראש.", "ar": "قد تصل بكتيريا من الخارج، لكن هنا كانت المقاومة موجودة في المريض مسبقًا.", "ru": "Бактерии могут прийти извне, но здесь устойчивые уже были у больного.", "en": "Bacteria can come from outside, but here the resistant ones were already there."}]),
    Q("evol-3-2",{"he": "גבר עיוור צבעים (תכונה רצסיבית בכרומוזום X) ואישה בעלת ראייה תקינה שאינה נשאית מקבלים ילדים. מה צפוי?", "ar": "رجل مصاب بعمى الألوان (صفة متنحية على الكروموسوم X) وامرأة ذات رؤية سليمة غير حاملة ينجبان أطفالًا. ماذا نتوقع؟", "ru": "Мужчина с дальтонизмом (рецессивный признак в X-хромосоме) и женщина с нормальным зрением, не носительница, имеют детей. Чего ожидать?", "en": "A colorblind man (a recessive trait on the X chromosome) and a woman with normal vision who is not a carrier have children. What is expected?"},[{"he": "כל הבנות נשאיות וכל הבנים בריאים", "ar": "كل البنات حاملات وكل الأبناء سليمون", "ru": "Все дочери носительницы, все сыновья здоровы", "en": "All daughters are carriers and all sons are unaffected"}, {"he": "כל הבנים עיוורי צבעים וכל הבנות בריאות", "ar": "كل الأبناء عميان ألوان وكل البنات سليمات", "ru": "Все сыновья — дальтоники, а все дочери здоровы", "en": "All the sons are colorblind and all the daughters are healthy"}, {"he": "חצי מהבנות עיוורות צבעים", "ar": "نصف البنات مصابات بعمى الألوان", "ru": "Половина дочерей дальтоники", "en": "Half of the daughters are colorblind"}, {"he": "כל הילדים בריאים ואינם נשאים", "ar": "كل الأطفال سليمون وغير حاملين", "ru": "Все дети здоровы и не носители", "en": "All children are healthy and not carriers"}],0,{"he": "בן מקבל כרומוזום X מאמו וכרומוזום Y מאביו. בת מקבלת X מכל הורה.", "ar": "الابن يأخذ X من أمه وY من أبيه. والابنة تأخذ X من كل والد.", "ru": "Сын получает X от матери и Y от отца. Дочь получает X от каждого родителя.", "en": "A son gets an X from his mother and a Y from his father. A daughter gets an X from each parent."},{"he": "הבנים מקבלים X תקין מהאם ולכן בריאים. הבנות מקבלות X פגוע מהאב ו-X תקין מהאם, ולכן הן נשאיות בריאות, אבל יעבירו את האלל הלאה.", "ar": "الأبناء يأخذون X سليمًا من الأم فيكونون أصحاء. والبنات يأخذن X متأثرًا من الأب وX سليمًا من الأم فيكنّ حاملات سليمات، لكنهن ينقلن الأليل.", "ru": "Сыновья получают здоровую X от матери и здоровы. Дочери получают X с аллелем от отца и здоровую X от матери, поэтому они здоровые носительницы и передадут аллель дальше.", "en": "Sons get a normal X from the mother, so they are unaffected. Daughters get an affected X from the father and a normal X from the mother, so they are healthy carriers who can pass the allele on."},null,[null, {"he": "הבן מקבל X מהאם בלבד, והאם כאן אינה נשאית, ולכן הבנים בריאים.", "ar": "الابن يأخذ X من الأمّ فقط، والأمّ هنا ليست حاملة، لذلك الأبناء سليمون.", "ru": "Сын получает X только от матери, а она не носительница, поэтому он здоров.", "en": "A son gets his X only from the mother, who is not a carrier, so sons are healthy."}, {"he": "בת עיוורת צבעים צריכה שני אללים פגועים, ומהאם היא מקבלת אלל תקין.", "ar": "لكي تكون البنت عمياء ألوان تحتاج أليلَين معطوبَين، وهي تأخذ سليمًا من الأمّ.", "ru": "Дочери-дальтонику нужны два дефектных аллеля, а от матери идёт нормальный.", "en": "A colorblind daughter needs two faulty alleles, and the mother gives a normal one."}, {"he": "הבנים אכן בריאים, אבל כל בת מקבלת מהאב X פגוע ולכן היא נשאית.", "ar": "الأبناء سليمون فعلًا، لكن كل بنت تأخذ X معطوبًا من الأب فتكون حاملة.", "ru": "Сыновья здоровы, но каждая дочь получает дефектный X от отца и носит его.", "en": "Sons are healthy, but every daughter gets a faulty X from the father and carries it."}]),
    Q("evol-3-3",{"he": "באיים שונים נמצאו ציפורים מאותה קבוצה, ולכל אי מקור בצורה שמתאימה לזרעים שבו. מה ההסבר המתאים?", "ar": "في جزر مختلفة وُجدت طيور من المجموعة نفسها، ولكل جزيرة منقار بشكل يلائم بذورها. ما التفسير الملائم؟", "ru": "На разных островах нашли птиц одной группы, и на каждом острове клюв по форме подходит к его семенам. Каково подходящее объяснение?", "en": "Birds of the same group were found on different islands, each island's birds having a beak shape suited to its seeds. What is the fitting explanation?"},[{"he": "כל ציפור שינתה את צורת מקורה בהתאם לזרעים שאכלה", "ar": "كل طير غيّر شكل منقاره وفق البذور التي أكلها", "ru": "Каждая птица изменила форму клюва в соответствии с съеденными семенами", "en": "Each bird changed its beak shape to match the seeds it ate"}, {"he": "הזרעים השתנו כדי להתאים למקורים שהיו באי", "ar": "تغيّرت البذور لتلائم المناقير الموجودة في الجزيرة", "ru": "Семена изменились, чтобы подойти к имевшимся на острове клювам", "en": "The seeds changed to match the beaks present on the island"}, {"he": "בכל אי שרדו טוב יותר הפרטים שמקורם התאים לזרעים שבו", "ar": "في كل جزيرة بقيت أفضل الأفرادُ التي لاءم منقارها بذورها", "ru": "На каждом острове лучше выживали особи, чей клюв подходил его семенам", "en": "On each island the individuals whose beak suited its seeds survived better"}, {"he": "הציפורים נדדו לאי שבו המקור שלהן התאים מראש", "ar": "هاجرت الطيور إلى الجزيرة التي لاءم منقارها بذورها مسبقًا", "ru": "Птицы перелетели на остров, где их клюв заранее подходил", "en": "The birds migrated to the island where their beak already fitted"}],2,{"he": "שאלו מה בא קודם: השוני במקורים או הסביבה שבררה ביניהם.", "ar": "اسألوا ما جاء أوّلًا: التنوّع في المناقير أم البيئة التي انتقت بينها.", "ru": "Спросите, что было раньше: разнообразие клювов или среда, которая между ними отбирала.", "en": "Ask which came first: the variation in beaks or the environment that selected among them."},{"he": "באוכלוסייה המקורית היה שוני תורשתי בצורת המקור. בכל אי הזרעים שונים, ולכן הפרטים שמקורם התאים אכלו טוב יותר, שרדו והותירו יותר צאצאים. לאורך דורות עלתה שכיחות האללים המתאימים בכל אי בנפרד.", "ar": "في المجموعة الأصلي كان تنوّع وراثي في شكل المنقار. وفي كل جزيرة بذور مختلفة، فالأفراد التي لاءم منقارها أكلت أفضل وبقيت وأنجبت نسلًا أكثر. وعلى مدى أجيال ارتفع تواتر الأليلات الملائمة في كل جزيرة على حدة.", "ru": "В исходной популяции было наследственное разнообразие формы клюва. На каждом острове семена разные, поэтому особи с подходящим клювом питались лучше, выживали и оставляли больше потомства. За поколения частота подходящих аллелей выросла на каждом острове отдельно.", "en": "The original population held hereditary variation in beak shape. On each island the seeds differ, so individuals whose beak fitted fed better, survived and left more offspring. Over generations the frequency of the fitting alleles rose on each island separately."},null,[{"he": "צורת מקור נקבעת בגנים ואינה משתנה בחיי הפרט לפי מה שאכל.", "ar": "شكل المنقار تحدّده الجينات ولا يتغيّر في حياة الفرد وفق ما أكل.", "ru": "Форма клюва задана генами и в течение жизни особи по съеденному не меняется.", "en": "Beak shape is set by the genes and does not change during an individual's life according to its food."}, {"he": "הזרעים אינם משתנים כדי לשרת את הציפורים, והברירה פועלת על הציפורים.", "ar": "البذور لا تتغيّر لخدمة الطيور، والانتقاء يعمل على الطيور.", "ru": "Семена не меняются ради птиц; отбор действует на птиц.", "en": "The seeds do not change to serve the birds; selection acts on the birds."}, null, {"he": "נדידה מכוונת לפי צורת מקור אינה אפשרית, כי ציפור אינה בודקת זרעים מרחוק.", "ar": "الهجرة المقصودة وفق شكل المنقار غير ممكنة، فالطير لا يفحص البذور من بعيد.", "ru": "Целенаправленный перелёт по форме клюва невозможен: птица не проверяет семена издалека.", "en": "A purposeful migration by beak shape is impossible; a bird cannot check seeds from afar."}]),
    Q("evol-3-4",{"he": "זרוע אדם, סנפיר לווייתן וכנף עטלף בנויים מאותם עצמות באותו סדר, אף שתפקידם שונה. מה ההסבר הטוב?", "ar": "ذراع الإنسان وزعنفة الحوت وجناح الخفّاش مبنيّة من العظام نفسها بالترتيب نفسه، مع اختلاف وظائفها. ما التفسير الجيّد؟", "ru": "Рука человека, плавник кита и крыло летучей мыши построены из тех же костей в том же порядке, хотя их работа разная. Каково хорошее объяснение?", "en": "A human arm, a whale flipper and a bat wing are built from the same bones in the same order, though their jobs differ. What is the good explanation?"},[{"he": "זה צירוף מקרים, כי אין קשר בין שלושת היצורים", "ar": "هذه مصادفة، فلا صلة بين الكائنات الثلاثة", "ru": "Это совпадение, ведь между тремя организмами связи нет", "en": "It is a coincidence, since the three creatures are unrelated"}, {"he": "שלושתם מבצעים בפועל אותה פעולה בדיוק", "ar": "الثلاثة يقومون فعلًا بالعمل نفسه بالضبط", "ru": "Все трое на деле выполняют в точности одно действие", "en": "All three in fact do exactly the same action"}, {"he": "העצמות דומות כי כולם חיים באותה סביבה", "ar": "العظام متشابهة لأن كلهم يعيشون في البيئة نفسها", "ru": "Кости похожи, потому что все живут в одной среде", "en": "The bones are alike because they all live in the same environment"}, {"he": "שלושתם ירשו את מבנה הגפה מאב קדמון משותף", "ar": "الثلاثة ورثوا بنية الطرف من سلف مشترك", "ru": "Все трое унаследовали строение конечности от общего предка", "en": "All three inherited the limb structure from a common ancestor"}],3,{"he": "שאלו למה דווקא הסדר של העצמות זהה, ולא התפקיד.", "ar": "اسألوا لماذا ترتيب العظام هو المتماثل، لا الوظيفة.", "ru": "Спросите, почему одинаков именно порядок костей, а не функция.", "en": "Ask why it is the order of the bones that matches, and not the function."},{"he": "אברים כאלה נקראים הומולוגיים: מבנה משותף ותפקיד שונה. ההסבר הוא ירושה מאב קדמון אחד, ושינוי הדרגתי של אותו מבנה לתפקידים שונים. לעומת זאת כנף של חרק וכנף של עטלף דומות בתפקיד ולא במבנה, ולכן הן אינן הומולוגיות.", "ar": "تُسمّى هذه الأعضاء متماثلة التركيب: بنية مشتركة ووظيفة مختلفة. والتفسير هو الوراثة من سلف واحد، وتغيّر تدريجي للبنية نفسها لوظائف مختلفة. أما جناح الحشرة وجناح الخفّاش فمتشابهان في الوظيفة لا في البنية، فليسا متماثلي التركيب.", "ru": "Такие органы называют гомологичными: общее строение и разная функция. Объяснение — наследование от одного предка и постепенное изменение той же структуры под разные задачи. Напротив, крыло насекомого и крыло летучей мыши схожи по функции, а не по строению, и гомологичными не являются.", "en": "Such organs are called homologous: shared structure and different function. The explanation is inheritance from one ancestor, with gradual modification of the same structure for different jobs. By contrast an insect wing and a bat wing are alike in function but not in structure, so they are not homologous."},null,[{"he": "אותו סדר עצמות בשלושה יצורים אינו מקרי, והוא דורש הסבר של מוצא.", "ar": "ترتيب العظام نفسه في ثلاثة كائنات ليس مصادفة، ويحتاج تفسيرًا بالأصل.", "ru": "Один порядок костей у трёх организмов не случаен и требует объяснения через происхождение.", "en": "The same bone order in three creatures is not accidental and calls for an explanation by descent."}, {"he": "שחייה, תעופה ואחיזה הן פעולות שונות, והדמיון הוא במבנה בלבד.", "ar": "السباحة والطيران والقبض أعمال مختلفة، والتشابه في البنية فقط.", "ru": "Плавание, полёт и хватание — разные действия, сходство только в строении.", "en": "Swimming, flying and grasping are different actions; the likeness is in structure only."}, {"he": "לווייתן, עטלף ואדם חיים בסביבות שונות מאוד, ובכל זאת המבנה זהה.", "ar": "الحوت والخفّاش والإنسان يعيشون في بيئات مختلفة جدًّا، ومع ذلك البنية متماثلة.", "ru": "Кит, летучая мышь и человек живут в очень разных средах, и всё же строение одно.", "en": "A whale, a bat and a human live in very different environments, yet the structure is the same."}, null]),
    Q("evol-3-5",{"he": "במשפחה שני הורים בריאים וארבעה ילדים, ואחד מהם חולה. שני ההורים אינם קרובי משפחה. איזה אופן תורשה סביר?", "ar": "في عائلة والدان سليمان وأربعة أولاد، وأحدهم مريض. والوالدان ليسا من الأقارب. أي نمط وراثة معقول؟", "ru": "В семье двое здоровых родителей и четверо детей, один из них болен. Родители не родственники. Какой тип наследования вероятен?", "en": "A family has two healthy parents and four children, one of whom is affected. The parents are not relatives. Which mode of inheritance is likely?"},[{"he": "תורשה רצסיבית, ושני ההורים נשאים", "ar": "وراثة متنحّية، والوالدان حاملان", "ru": "Рецессивное наследование, и оба родителя — носители", "en": "Recessive inheritance, with both parents carriers"}, {"he": "תורשה דומיננטית מהאב בלבד", "ar": "وراثة سائدة من الأب فقط", "ru": "Доминантное наследование только от отца", "en": "Dominant inheritance from the father only"}, {"he": "תורשה דומיננטית מהאם בלבד", "ar": "وراثة سائدة من الأمّ فقط", "ru": "Доминантное наследование только от матери", "en": "Dominant inheritance from the mother only"}, {"he": "המחלה אינה תורשתית כלל", "ar": "المرض ليس وراثيًّا أبدًا", "ru": "Болезнь вовсе не наследственная", "en": "The disease is not hereditary at all"}],0,{"he": "שאלו מה היה קורה אם האלל היה דומיננטי, ואם הורה היה נושא אותו.", "ar": "اسألوا ماذا كان سيحدث لو كان الأليل سائدًا، ولو حمله أحد الوالدين.", "ru": "Спросите, что было бы, если аллель доминантный и его несёт один из родителей.", "en": "Ask what would happen if the allele were dominant and a parent carried it."},{"he": "באלל דומיננטי כל הורה שנושא אותו היה חולה בעצמו, וכאן שני ההורים בריאים. לכן האלל רצסיבי, שני ההורים הטרוזיגוטיים, ולכל ילד סיכוי של 25 אחוז לחלות. ילד חולה אחד מתוך ארבעה מתאים בדיוק לציפייה הזאת.", "ar": "في الأليل السائد كان كل والد يحمله مريضًا بنفسه، وهنا الوالدان سليمان. لذلك الأليل متنحٍّ، والوالدان غير نقيّين، ولكل طفل احتمال 25 بالمئة أن يمرض. وطفل مريض واحد من أربعة يلائم هذا التوقّع تمامًا.", "ru": "При доминантном аллеле каждый несущий его родитель был бы болен сам, а здесь оба родителя здоровы. Значит, аллель рецессивный, оба родителя гетерозиготны, и у каждого ребёнка 25 процентов вероятности заболеть. Один больной из четырёх точно отвечает этому ожиданию.", "en": "With a dominant allele, any parent carrying it would be ill themselves, yet here both parents are healthy. So the allele is recessive, both parents are heterozygous, and each child has a 25 percent chance of being affected. One affected child out of four fits that expectation exactly."},null,[null, {"he": "אלל דומיננטי שהאב נושא היה הופך אותו לחולה, והוא בריא.", "ar": "أليل سائد يحمله الأب كان سيجعله مريضًا، وهو سليم.", "ru": "Доминантный аллель у отца сделал бы его больным, а он здоров.", "en": "A dominant allele in the father would make him ill, and he is healthy."}, {"he": "אלל דומיננטי שהאם נושאת היה הופך אותה לחולה, והיא בריאה.", "ar": "أليل سائد تحمله الأمّ كان سيجعلها مريضة، وهي سليمة.", "ru": "Доминантный аллель у матери сделал бы её больной, а она здорова.", "en": "A dominant allele in the mother would make her ill, and she is healthy."}, {"he": "הופעת המחלה בילד אחד מתוך ארבעה מתאימה בדיוק לתורשה רצסיבית.", "ar": "ظهور المرض في طفل واحد من أربعة يلائم تمامًا الوراثة المتنحّية.", "ru": "Появление болезни у одного из четырёх как раз отвечает рецессивному наследованию.", "en": "One affected child out of four is exactly what recessive inheritance predicts."}]),
    Q("evol-3-6",{"he": "גזעי העצים ביישוב תעשייתי הושחרו מפיח, ושיעור העשים הכהים באוכלוסייה עלה. מה אפשר להסיק?", "ar": "اسودّت جذوع الأشجار في بلدة صناعية من السُخام، وارتفعت نسبة العُثّ الغامق في المجموعة. ما يمكن استنتاجه؟", "ru": "Стволы деревьев в промышленном городке почернели от копоти, и доля тёмных мотыльков в популяции выросла. Что можно заключить?", "en": "Tree trunks in an industrial town were blackened by soot, and the share of dark moths in the population rose. What can be concluded?"},[{"he": "הפיח צבע את כנפי העשים בשחור", "ar": "السُخام صبغ أجنحة العُثّ بالأسود", "ru": "Копоть окрасила крылья мотыльков в чёрный", "en": "The soot stained the moths' wings black"}, {"he": "עש כהה על גזע כהה נראה פחות לטורפים ולכן שרד", "ar": "العُثّ الغامق على جذع غامق أقلّ ظهورًا للمفترسات فبقي", "ru": "Тёмный мотылёк на тёмном стволе менее заметен хищникам и потому выжил", "en": "A dark moth on a dark trunk is less visible to predators and so survived"}, {"he": "העשים הכהים התחילו להתרבות מהר יותר בגלל הפיח", "ar": "بدأ العُثّ الغامق يتكاثر أسرع بسبب السُخام", "ru": "Тёмные мотыльки стали быстрее размножаться из-за копоти", "en": "The dark moths began reproducing faster because of the soot"}, {"he": "העשים הבהירים עברו לאיים אחרים", "ar": "انتقل العُثّ الفاتح إلى جزر أخرى", "ru": "Светлые мотыльки перебрались на другие острова", "en": "The pale moths moved to other islands"}],1,{"he": "שאלו מי אוכל את העשים, ואיך הוא מוצא אותם.", "ar": "اسألوا من يأكل العُثّ، وكيف يجده.", "ru": "Спросите, кто поедает мотыльков и как он их находит.", "en": "Ask who eats the moths, and how it finds them."},{"he": "ציפורים מוצאות עש בעיניהן, ולכן הסוואה היא יתרון הישרדות. על גזע מפויח העש הכהה בולט פחות, הוא נאכל פחות, ומותיר יותר צאצאים כהים. שכיחות האלל הכהה עלתה בלי שפרט אחד שינה את צבעו.", "ar": "الطيور تجد العُثّ بعيونها، فالتخفّي ميزة بقاء. وعلى جذع مُسوَّد بالسُخام يكون العُثّ الغامق أقلّ بروزًا، فيُؤكَل أقلّ ويترك نسلًا غامقًا أكثر. ارتفع تواتر الأليل الغامق دون أن يغيّر أي فرد لونه.", "ru": "Птицы находят мотыльков глазами, поэтому маскировка — преимущество для выживания. На закопчённом стволе тёмный мотылёк заметен меньше, его реже съедают, и он оставляет больше тёмного потомства. Частота тёмного аллеля выросла, и ни одна особь при этом цвет не меняла.", "en": "Birds find moths by sight, so camouflage is a survival advantage. On a sooty trunk a dark moth stands out less, is eaten less, and leaves more dark offspring. The frequency of the dark allele rose without any individual changing its colour."},null,[{"he": "צבע הכנף נקבע בגנים, והפיח אינו צובע את העשים עצמם.", "ar": "لون الجناح تحدّده الجينات، والسُخام لا يصبغ العُثّ نفسه.", "ru": "Цвет крыла задан генами, и копоть самих мотыльков не окрашивает.", "en": "Wing colour is set by the genes, and soot does not stain the moths themselves."}, null, {"he": "הפיח אינו מזרז רבייה, והיתרון הוא בהישרדות מול טורפים.", "ar": "السُخام لا يسرّع التكاثر، والميزة في البقاء أمام المفترسات.", "ru": "Копоть размножение не ускоряет; преимущество — в выживании перед хищниками.", "en": "Soot does not speed reproduction; the advantage lies in surviving predators."}, {"he": "אין בנתונים נדידה, והשינוי נמדד באותה אוכלוסייה עצמה.", "ar": "لا هجرة في البيانات، والتغيّر قيس في المجموعة نفسه.", "ru": "В данных миграции нет; изменение измерено в той же популяции.", "en": "There is no migration in the data; the change was measured in the same population."}]),
    Q("evol-3-7",{"he": "נהר חדש חצה שטח ופיצל אוכלוסייה אחת לשתיים. אחרי דורות רבים הפרטים משני הצדדים אינם מעמידים צאצאים פוריים. מה קרה?", "ar": "شقّ نهر جديد منطقةً فقسم مجموعةً واحدةً إلى اثنتين. وبعد أجيال كثيرة لم يُنتج أفراد الجهتين نسلًا خصيبًا. ما الذي حدث؟", "ru": "Новая река пересекла местность и разделила одну популяцию на две. Через много поколений особи с двух сторон не дают плодовитого потомства. Что произошло?", "en": "A new river cut across an area and split one population into two. After many generations, individuals from the two sides no longer produce fertile offspring. What happened?"},[{"he": "הפרטים שכחו להתרבות זה עם זה", "ar": "نسي الأفراد أن يتزاوجوا معًا", "ru": "Особи забыли, как размножаться друг с другом", "en": "The individuals forgot how to breed with each other"}, {"he": "הנהר שינה את מספר הכרומוזומים בשתי הקבוצות", "ar": "النهر غيّر عدد الكروموسومات في المجموعتين", "ru": "Река изменила число хромосом в обеих группах", "en": "The river changed the chromosome number in both groups"}, {"he": "נוצרו שני מינים נפרדים, כי ההפרדה מנעה חילופי אללים", "ar": "نشأ نوعان منفصلان، لأن الفصل منع تبادل الأليلات", "ru": "Образовались два отдельных вида, потому что разделение прекратило обмен аллелями", "en": "Two separate species formed, because the separation stopped allele exchange"}, {"he": "שתי הקבוצות חזרו למצבן המקורי בדיוק", "ar": "عادت المجموعتان إلى حالتهما الأصلية بالضبط", "ru": "Обе группы вернулись точно к исходному состоянию", "en": "Both groups returned exactly to their original state"}],2,{"he": "שאלו מה מחזיק אוכלוסייה אחת כמין אחד, וקרה לו משהו.", "ar": "اسألوا ما يحفظ مجموعةً واحدةً كنوع واحد، وقد أصابها شيء.", "ru": "Спросите, что держит одну популяцию одним видом, и с этим что-то случилось.", "en": "Ask what holds a population together as one species, because something happened to it."},{"he": "כל עוד פרטים מתרבים זה עם זה, האללים מתערבבים והאוכלוסייה נשארת מין אחד. הנהר מנע את הערבוב, ובכל צד הצטברו מוטציות אחרות ופעלה ברירה אחרת. כשההבדלים הגיעו לכך שאין צאצאים פוריים, נוצרו שני מינים.", "ar": "ما دام الأفراد يتزاوجون معًا، تختلط الأليلات ويبقى المجموعة نوعًا واحدًا. النهر منع الاختلاط، وتجمّعت في كل جهة طفرات أخرى وعمل انتقاء آخر. وعندما بلغت الفروق حدّ انعدام النسل الخصيب، نشأ نوعان.", "ru": "Пока особи скрещиваются между собой, аллели перемешиваются и популяция остаётся одним видом. Река прекратила перемешивание, и на каждой стороне накапливались иные мутации и действовал иной отбор. Когда различия дошли до отсутствия плодовитого потомства, возникли два вида.", "en": "As long as individuals breed with one another, alleles mix and the population stays one species. The river stopped the mixing, and on each side different mutations accumulated and different selection acted. When the differences reached the point of no fertile offspring, two species had formed."},null,[{"he": "רבייה אינה התנהגות נלמדת שנשכחת, והמחסום הוא ביולוגי.", "ar": "التكاثر ليس سلوكًا مُتعلَّمًا يُنسى، والحاجز بيولوجي.", "ru": "Размножение — не выученное поведение, которое забывают; барьер биологический.", "en": "Breeding is not a learned behaviour that is forgotten; the barrier is biological."}, {"he": "נהר אינו משנה כרומוזומים, והוא רק מונע מפגש בין הקבוצות.", "ar": "النهر لا يغيّر الكروموسومات، وهو يمنع لقاء المجموعتين فقط.", "ru": "Река хромосом не меняет, она лишь мешает группам встречаться.", "en": "A river does not change chromosomes; it only keeps the groups from meeting."}, null, {"he": "שינוי תורשתי מצטבר אינו מתהפך מעצמו, ולכן אין חזרה למצב המקורי.", "ar": "التغيّر الوراثي المتراكم لا يتراجع وحده، فلا عودة إلى الحالة الأصلية.", "ru": "Накопленные наследственные изменения сами не отменяются, поэтому возврата к исходному нет.", "en": "Accumulated hereditary change does not reverse by itself, so there is no return to the original state."}]),
    Q("evol-3-8",{"he": "גרף מראה שבעשר שנות ריסוס עלתה שכיחות אלל העמידות בחרקים מ-2 אחוזים ל-60 אחוזים. מה הגרף מראה?", "ar": "يُظهر رسم أن تواتر أليل المقاومة في الحشرات ارتفع في عشر سنوات من الرشّ من 2 بالمئة إلى 60 بالمئة. على ماذا يدلّ الرسم؟", "ru": "График показывает, что за десять лет опрыскивания частота аллеля устойчивости у насекомых выросла с 2 до 60 процентов. Что показывает график?", "en": "A graph shows that over ten years of spraying the frequency of the resistance allele in insects rose from 2 percent to 60 percent. What does the graph show?"},[{"he": "החרקים למדו להתגונן מפני הריסוס", "ar": "تعلّمت الحشرات أن تحمي نفسها من الرشّ", "ru": "Насекомые научились защищаться от опрыскивания", "en": "The insects learned to protect themselves from the spray"}, {"he": "הריסוס יצר את אלל העמידות בחרקים", "ar": "الرشّ أنشأ أليل المقاومة في الحشرات", "ru": "Опрыскивание создало у насекомых аллель устойчивости", "en": "The spray created the resistance allele in the insects"}, {"he": "העמידות עברה מחרק לחרק כמו מחלה מידבקת", "ar": "انتقلت المقاومة من حشرة إلى حشرة كمرض معدٍ", "ru": "Устойчивость перешла от насекомого к насекомому, как заразная болезнь", "en": "Resistance passed from insect to insect like a contagious disease"}, {"he": "שכיחות האללים באוכלוסייה השתנתה, כלומר התרחשה אבולוציה", "ar": "تغيّر تواتر الأليلات في المجموعة، أي حدث تطوّر", "ru": "Частота аллелей в популяции изменилась, то есть произошла эволюция", "en": "The allele frequencies in the population changed, that is, evolution happened"}],3,{"he": "שימו לב מה בדיוק מודד הגרף: שכיחות של אלל באוכלוסייה.", "ar": "انتبهوا إلى ما يقيسه الرسم بالضبط: تواتر أليل في المجموعة.", "ru": "Обратите внимание, что именно измеряет график: частоту аллеля в популяции.", "en": "Note exactly what the graph measures: the frequency of an allele in a population."},{"he": "אלל העמידות היה באוכלוסייה עוד לפני הריסוס, בשיעור של 2 אחוזים. הריסוס הרג את הרגישים, ולכן בעלי האלל הותירו יותר צאצאים. שכיחות האלל עלתה, וזו ההגדרה המדויקת של אבולוציה באוכלוסייה.", "ar": "كان أليل المقاومة في المجموعة قبل الرشّ، بنسبة 2 بالمئة. الرشّ قتل الحسّاسة، فترك حاملو الأليل نسلًا أكثر. ارتفع تواتر الأليل، وهذا هو التعريف الدقيق للتطوّر في المجموعة.", "ru": "Аллель устойчивости был в популяции ещё до опрыскивания, с частотой 2 процента. Опрыскивание убило чувствительных, поэтому носители аллеля оставили больше потомства. Частота аллеля выросла, и это и есть точное определение эволюции в популяции.", "en": "The resistance allele was already in the population before the spraying, at 2 percent. The spray killed the susceptible insects, so carriers of the allele left more offspring. The allele frequency rose, and that is the precise definition of evolution in a population."},null,[{"he": "עמידות היא תכונה תורשתית, ולא התנהגות נלמדת.", "ar": "المقاومة صفة وراثية، لا سلوكًا مُتعلَّمًا.", "ru": "Устойчивость — наследственный признак, а не выученное поведение.", "en": "Resistance is a hereditary trait, not a learned behaviour."}, {"he": "האלל היה קיים כבר ב-2 אחוזים לפני הריסוס, ולכן הריסוס לא יצר אותו.", "ar": "الأليل كان موجودًا بنسبة 2 بالمئة قبل الرشّ، فالرشّ لم يُنشئه.", "ru": "Аллель уже был при 2 процентах до опрыскивания, значит опрыскивание его не создало.", "en": "The allele already stood at 2 percent before the spraying, so the spray did not create it."}, {"he": "עמידות עוברת רק לצאצאים דרך הגנים, ואינה מידבקת בין פרטים.", "ar": "المقاومة تنتقل إلى النسل عبر الجينات فقط، وليست معدية بين الأفراد.", "ru": "Устойчивость переходит только потомству через гены и между особями не заразна.", "en": "Resistance passes only to offspring through the genes and is not contagious between individuals."}, null]),
    Q("evol-3-9",{"he": "אישה נשאית של המופיליה (תכונה רצסיבית בכרומוזום X) נשואה לגבר בריא. מה הסיכוי שבן שייוולד להם יהיה חולה?", "ar": "امرأة حاملة للهيموفيليا (صفة متنحّية على كروموسوم X) زوجها رجل سليم. ما احتمال أن يكون الابن المولود لهما مريضًا؟", "ru": "Женщина — носительница гемофилии (рецессивный признак на хромосоме X), её муж здоров. Какова вероятность, что рождённый у них сын будет болен?", "en": "A woman who carries haemophilia (a recessive trait on the X chromosome) is married to a healthy man. What is the chance that a son born to them will be affected?"},[{"he": "אפס אחוז", "ar": "صفر بالمئة", "ru": "Ноль процентов", "en": "Zero percent"}, {"he": "50 אחוז", "ar": "50 بالمئة", "ru": "50 процентов", "en": "50 percent"}, {"he": "75 אחוז", "ar": "75 بالمئة", "ru": "75 процентов", "en": "75 percent"}, {"he": "100 אחוז", "ar": "100 بالمئة", "ru": "100 процентов", "en": "100 percent"}],1,{"he": "בן מקבל את ה-X שלו מהאם בלבד, ולאם שני X שונים.", "ar": "الابن يأخذ X من الأمّ فقط، وللأمّ كروموسوما X مختلفان.", "ru": "Сын получает свою X только от матери, а у матери две разные X.", "en": "A son gets his X from the mother only, and the mother has two different X chromosomes."},{"he": "האם היא נשאית, כלומר X תקין ו-X עם האלל לחולי. בן מקבל מהאב את Y ומהאם אחד משני ה-X בהסתברות שווה. לכן מחצית הבנים יהיו חולים ומחציתם בריאים, והבנות לא יחלו כי האב תורם X תקין.", "ar": "الأمّ حاملة، أي لها X سليم وX يحمل أليل المرض. والابن يأخذ من الأب Y ومن الأمّ أحد الكروموسومين X باحتمال متساوٍ. لذلك نصف الأبناء مرضى ونصفهم سليمون، والبنات لا يمرضن لأن الأب يعطي X سليمًا.", "ru": "Мать — носительница, то есть у неё нормальная X и X с аллелем болезни. Сын получает от отца Y, а от матери одну из двух X с равной вероятностью. Поэтому половина сыновей будут больны, а половина здоровы, и дочери не заболеют, ведь отец даёт нормальную X.", "en": "The mother is a carrier, meaning one normal X and one X with the disease allele. A son gets a Y from the father and one of the two X chromosomes from the mother with equal probability. So half the sons will be affected and half healthy, and no daughter will be affected because the father gives a normal X."},null,[{"he": "לאם יש X עם האלל, ולכן חלק מהבנים כן עלולים לחלות.", "ar": "للأمّ X يحمل الأليل، فبعض الأبناء قد يمرضون فعلًا.", "ru": "У матери есть X с аллелем, поэтому часть сыновей всё же может заболеть.", "en": "The mother does carry an X with the allele, so some sons can indeed be affected."}, null, {"he": "75 אחוז אינו מתקבל כאן, כי לבן יש רק שתי אפשרויות ל-X מהאם.", "ar": "75 بالمئة لا تنتج هنا، لأن للابن احتمالين فقط للـX من الأمّ.", "ru": "75 процентов здесь не получается: у сына лишь два варианта X от матери.", "en": "75 percent cannot arise here, since a son has only two possible X chromosomes from the mother."}, {"he": "100 אחוז היה נכון אם האם עצמה היתה חולה, ושני ה-X שלה נושאים את האלל.", "ar": "100 بالمئة كانت صحيحة لو كانت الأمّ مريضة نفسها، وكلا الـX يحملان الأليل.", "ru": "100 процентов было бы верно, если бы мать сама была больна и обе её X несли аллель.", "en": "100 percent would be right if the mother herself were affected, with the allele on both her X chromosomes."}]),
 ]
]);

topic("bio-eco","043381",
  {"he": "אקולוגיה וסביבות חיים", "ar": "البيئة والموائل", "ru": "Экология и среды обитания", "en": "Ecology and habitats"},
  {"he": "שרשראות מזון, התאמות ואוכלוסיות", "ar": "السلاسل الغذائية والتكيّفات والمجموعات", "ru": "Пищевые цепи, приспособления и популяции", "en": "Food chains, adaptations and populations"},
[
 [
    Q("eco-1-1",{"he": "מי היצרנים בשרשרת מזון?", "ar": "من المُنتِجون في السلسلة الغذائية؟", "ru": "Кто такие продуценты в пищевой цепи?", "en": "Who are the producers in a food chain?"},[{"he": "צמחים ואצות שעושים פוטוסינתזה", "ar": "النباتات والطحالب التي تقوم بالتمثيل الضوئي", "ru": "Растения и водоросли, осуществляющие фотосинтез", "en": "Plants and algae that carry out photosynthesis"}, {"he": "בעלי חיים אוכלי עשב שאוכלים את הצמחים בשדה", "ar": "حيوانات آكلة للعشب تأكل النباتات في الحقل والمرعى", "ru": "Травоядные животные, которые поедают растения на лугу", "en": "Herbivorous animals that eat the plants in the field"}, {"he": "חיידקים שמפרקים גופות", "ar": "البكتيريا التي تفكّك الجثث", "ru": "Бактерии, разлагающие останки", "en": "Bacteria that break down dead bodies"}, {"he": "טורפים בראש השרשרת", "ar": "المفترسات في رأس السلسلة", "ru": "Хищники на вершине цепи", "en": "Predators at the top of the chain"}],0,{"he": "הם ״מייצרים״ חומר אורגני מחומרים אי־אורגניים ואור.", "ar": "هم «ينتجون» مادة عضوية من مواد غير عضوية وضوء.", "ru": "Они «производят» органическое вещество из неорганических веществ и света.", "en": "They make organic matter from inorganic materials and light."},{"he": "יצרנים מייצרים סוכר בפוטוסינתזה, ובכך מכניסים לאקוסיסטמה אנרגיה מהשמש. כל שאר היצורים, הצרכנים, תלויים בהם למזון.", "ar": "المنتجون يصنعون السكر بالتمثيل الضوئي، فيُدخلون إلى النظام البيئي طاقة من الشمس. وكل الكائنات الأخرى، المستهلكات، تعتمد عليهم في غذائها.", "ru": "Продуценты создают сахар при фотосинтезе и тем самым вводят в экосистему энергию Солнца. Все остальные организмы, консументы, зависят от них в питании.", "en": "Producers make sugar by photosynthesis and so bring the sun's energy into the ecosystem. All other organisms, the consumers, depend on them for food."},null,[null, {"he": "אוכלי עשב הם צרכנים ראשוניים: הם אוכלים את היצרנים ואינם מייצרים.", "ar": "آكلات العشب مستهلكات أوّلية: تأكل المنتِجات ولا تنتج بنفسها.", "ru": "Травоядные — первичные потребители: они едят продуцентов, но не производят.", "en": "Herbivores are primary consumers: they eat producers and do not produce."}, {"he": "חיידקים שמפרקים גופות הם מפרקים, והם מחזירים חומרים לקרקע.", "ar": "البكتيريا التي تُحلّل الجثث هي مُحلِّلات، وهي تعيد المواد إلى التربة.", "ru": "Бактерии, разлагающие останки, — редуценты; они возвращают вещества в почву.", "en": "Bacteria that break down remains are decomposers; they return matter to the soil."}, {"he": "טורף בראש השרשרת הוא צרכן, והוא תלוי בכל מי שמתחתיו למזון.", "ar": "المفترس في رأس السلسلة مستهلك، وهو يعتمد على مَن دونه في الغذاء.", "ru": "Хищник на вершине цепи — потребитель, зависящий от всех, кто ниже.", "en": "A top predator is a consumer and depends on everything below it for food."}]),
    Q("eco-1-2",{"he": "מהי אקוסיסטמה (מערכת אקולוגית)?", "ar": "ما النظام البيئي؟", "ru": "Что такое экосистема?", "en": "What is an ecosystem?"},[{"he": "יצורים חיים וסביבתם הדוממת והיחסים ביניהם", "ar": "الكائنات الحية وبيئتها غير الحية والعلاقات بينها", "ru": "Живые организмы, их неживая среда и связи между ними", "en": "Living organisms, their non-living environment and the relationships between them"}, {"he": "כל בעלי החיים שחיים באזור מסוים, בלי הסביבה הדוממת שסביבם", "ar": "كل الحيوانات التي تعيش في منطقة معيّنة، دون البيئة غير الحيّة المحيطة بها", "ru": "Все животные, живущие в данном районе, без окружающей неживой среды", "en": "All the animals that live in a certain area, without the non-living surroundings around them"}, {"he": "רק האדמה והמים באזור", "ar": "التربة والماء فقط في منطقة", "ru": "Только почва и вода региона", "en": "Only the soil and water of an area"}, {"he": "מין אחד של צמח והשטח שבו הוא גדל", "ar": "نوع واحد من النبات والمساحة التي ينمو فيها", "ru": "Один вид растения и участок, где он растёт", "en": "One plant species and the patch where it grows"}],0,{"he": "המילה כוללת גם חי וגם דומם.", "ar": "الكلمة تشمل الحي وغير الحي.", "ru": "Понятие включает и живое, и неживое.", "en": "The term includes both living and non-living parts."},{"he": "באקוסיסטמה יש גורמים חיים, כמו צמחים ובעלי חיים, וגורמים דוממים, כמו אור, מים וטמפרטורה. הם משפיעים זה על זה, למשל אגם או חורש.", "ar": "في النظام البيئي عوامل حية مثل النباتات والحيوانات، وعوامل غير حية مثل الضوء والماء والحرارة. وهي تؤثر في بعضها، مثل بحيرة أو حرش.", "ru": "В экосистеме есть живые факторы, такие как растения и животные, и неживые, такие как свет, вода и температура. Они влияют друг на друга, например озеро или лесок.", "en": "An ecosystem has living factors, such as plants and animals, and non-living factors, such as light, water and temperature. They affect each other, for example a lake or a woodland."},null,[null, {"he": "בלי אור, מים וקרקע אין אקוסיסטמה, ולכן החי לבדו אינו מספיק."
