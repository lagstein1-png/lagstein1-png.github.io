 [
    Q("gene-2-1",{"he": "בתהליך השעתוק נוצרת מולקולה ממידע ב-DNA. איזו מולקולה?", "ar": "في عملية النسخ تتكوّن جزيء من معلومات الـDNA. أي جزيء؟", "ru": "В процессе транскрипции по информации ДНК образуется молекула. Какая?", "en": "In transcription, a molecule is made from the information in DNA. Which molecule?"},[{"he": "mRNA", "ar": "mRNA", "ru": "иРНК", "en": "mRNA"}, {"he": "חלבון", "ar": "بروتين", "ru": "Белок", "en": "A protein"}, {"he": "ATP", "ar": "ATP", "ru": "АТФ", "en": "ATP"}, {"he": "DNA חדש שלם", "ar": "DNA جديد كامل", "ru": "Полная новая ДНК", "en": "A whole new DNA"}],0,{"he": "המולקולה הזאת יוצאת מהגרעין אל הריבוזום.", "ar": "هذا الجزيء يخرج من النواة إلى الريبوسوم.", "ru": "Эта молекула выходит из ядра к рибосоме.", "en": "This molecule leaves the nucleus and goes to the ribosome."},{"he": "בשעתוק, קטע מה-DNA (גן) משמש תבנית ליצירת mRNA. ה-mRNA יוצא מהגרעין אל הריבוזום, ושם יתרגמו אותו לחלבון.", "ar": "في النسخ يُستخدم مقطع من الـDNA (جين) قالبًا لصنع mRNA. يخرج الـmRNA من النواة إلى الريبوسوم وهناك يُترجَم إلى بروتين.", "ru": "При транскрипции участок ДНК (ген) служит матрицей для синтеза иРНК. Она выходит из ядра к рибосоме, где переводится в белок.", "en": "In transcription, a section of DNA (a gene) is the template for making mRNA. The mRNA leaves the nucleus for the ribosome, where it is translated into a protein."},null,[null, {"he": "החלבון נוצר בשלב התרגום בריבוזום, ולא בשעתוק שבגרעין.", "ar": "البروتين يتكوّن في مرحلة الترجمة في الريبوسوم، لا في النسخ داخل النواة.", "ru": "Белок образуется при трансляции в рибосоме, а не при транскрипции в ядре.", "en": "Protein is made during translation in the ribosome, not during transcription."}, {"he": "ATP מספק אנרגיה לתהליך, אבל הוא אינו עותק של המידע שבגן.", "ar": "الـATP يزوّد الطاقة للعملية، لكنه ليس نسخة من المعلومات في الجين.", "ru": "АТФ даёт энергию для процесса, но он не копия информации гена.", "en": "ATP supplies energy for the process, but it is not a copy of the gene."}, {"he": "העתקת DNA שלם היא שכפול לפני חלוקת תא, וזה תהליך אחר משעתוק.", "ar": "نسخ الـDNA كاملًا هو التضاعف قبل انقسام الخلية، وهو عملية غير النسخ.", "ru": "Копирование всей ДНК — это репликация перед делением, другой процесс.", "en": "Copying whole DNA is replication before cell division, a different process."}]),
    Q("gene-2-2",{"he": "איפה בתא מתרחשת הרכבת החלבון (תרגום)?", "ar": "أين في الخلية يحدث بناء البروتين (الترجمة)؟", "ru": "Где в клетке происходит сборка белка (трансляция)?", "en": "Where in the cell does protein assembly (translation) take place?"},[{"he": "בריבוזום", "ar": "في الريبوسوم", "ru": "На рибосоме", "en": "On the ribosome"}, {"he": "בגרעין, בתוך ה-DNA", "ar": "في النواة داخل الـDNA", "ru": "В ядре, внутри ДНК", "en": "In the nucleus, inside the DNA"}, {"he": "בדופן התא", "ar": "في جدار الخلية", "ru": "В клеточной стенке", "en": "In the cell wall"}, {"he": "במיטוכונדריה בלבד", "ar": "في الميتوكوندريا فقط", "ru": "Только в митохондрии", "en": "In the mitochondrion only"}],0,{"he": "הוא מקבל mRNA ומרכיב שרשרת של חומצות אמיניות.", "ar": "يستقبل mRNA ويركّب سلسلة من الأحماض الأمينية.", "ru": "Она получает иРНК и собирает цепь аминокислот.", "en": "It receives mRNA and builds a chain of amino acids."},{"he": "הריבוזום קורא את ה-mRNA שלוש אותיות בכל פעם. מולקולות tRNA מביאות את חומצות האמינו המתאימות, והן מתחברות לשרשרת של חלבון.", "ar": "يقرأ الريبوسوم الـmRNA ثلاثة حروف في كل مرة. وتجلب جزيئات tRNA الأحماض الأمينية المناسبة فتتصل في سلسلة بروتين.", "ru": "Рибосома читает иРНК по три буквы. Молекулы тРНК приносят нужные аминокислоты, и они соединяются в белковую цепь.", "en": "The ribosome reads the mRNA three letters at a time. tRNA molecules bring the matching amino acids, which join into a protein chain."},null,[null, {"he": "בגרעין נעשה השעתוק בלבד, והחלבון מורכב אחר כך מחוץ לגרעין.", "ar": "في النواة يجري النسخ فقط، ويُركَّب البروتين بعد ذلك خارج النواة.", "ru": "В ядре идёт только транскрипция, а белок собирается потом вне ядра.", "en": "Only transcription happens in the nucleus; the protein is assembled outside."}, {"he": "דופן התא היא שכבה חיצונית קשיחה בצמחים, ואינה מרכיבה חלבונים.", "ar": "جدار الخلية طبقة خارجية صلبة في النباتات، وهو لا يركّب البروتينات.", "ru": "Клеточная стенка — жёсткий наружный слой у растений, она не строит белки.", "en": "The cell wall is a rigid outer layer in plants, and it assembles no proteins."}, {"he": "למיטוכונדריה יש ריבוזומים משלה, אבל רוב החלבונים נבנים בציטופלזמה.", "ar": "للميتوكوندريا ريبوسومات خاصة بها، لكن معظم البروتينات تُبنى في السيتوبلازم.", "ru": "У митохондрии есть свои рибосомы, но большинство белков строится в цитоплазме.", "en": "Mitochondria have their own ribosomes, but most proteins are built outside."}]),
    Q("gene-2-3",{"he": "תא עצב ותא עור באותו גוף נושאים אותו DNA, ובכל זאת הם שונים מאוד. איך זה ייתכן?", "ar": "خلية عصب وخلية جلد في الجسم نفسه تحملان DNA نفسه، ومع ذلك تختلفان كثيرًا. كيف يُمكن ذلك؟", "ru": "Нервная клетка и клетка кожи в одном теле несут одну и ту же ДНК, и всё же они очень разные. Как это возможно?", "en": "A nerve cell and a skin cell in the same body carry the same DNA, yet they are very different. How can that be?"},[{"he": "תא עצב קיבל DNA אחר מההורים", "ar": "خلية العصب تلقّت DNA مختلفًا من الوالدين", "ru": "Нервная клетка получила от родителей другую ДНК", "en": "The nerve cell got different DNA from the parents"}, {"he": "ה-DNA בתא העור השתנה במוטציות רבות", "ar": "تغيّر DNA في خلية الجلد بطفرات كثيرة", "ru": "ДНК в клетке кожи изменилась множеством мутаций", "en": "The DNA in the skin cell was changed by many mutations"}, {"he": "בכל תא מבוטאים גנים אחרים מתוך אותו DNA", "ar": "في كل خلية تُعبَّر جينات مختلفة من DNA نفسه", "ru": "В каждой клетке из одной и той же ДНК работают разные гены", "en": "Different genes are expressed in each cell out of the same DNA"}, {"he": "לתא העצב יש יותר כרומוזומים מלתא העור", "ar": "لخلية العصب كروموسومات أكثر من خلية الجلد", "ru": "У нервной клетки больше хромосом, чем у клетки кожи", "en": "The nerve cell has more chromosomes than the skin cell"}],2,{"he": "חשבו על ספר מתכונים אחד ששני טבחים פותחים בעמודים שונים.", "ar": "فكّروا بكتاب طبخ واحد يفتحه طبّاخان في صفحتين مختلفتين.", "ru": "Подумайте об одной книге рецептов, которую два повара открывают на разных страницах.", "en": "Think of one recipe book that two cooks open at different pages."},{"he": "כל תא בגוף מחזיק את אותו מאגר גנים, אבל מפעיל רק חלק ממנו. בתא עצב מבוטאים גנים לחלבוני העברת אותות, ובתא עור גנים לחלבוני קרטין. ההבדל הוא בביטוי הגנים ולא במידע עצמו.", "ar": "كل خلية في الجسم تحمل مجموعة الجينات نفسها، لكنها تُشغّل جزءًا منها فقط. في خلية العصب تُعبَّر جينات لبروتينات نقل الإشارات، وفي خلية الجلد جينات لبروتينات الكيراتين. الفرق في التعبير الجيني لا في المعلومة نفسها.", "ru": "Каждая клетка тела держит один и тот же набор генов, но включает лишь часть его. В нервной клетке работают гены белков передачи сигналов, а в клетке кожи — гены белков кератина. Различие в экспрессии генов, а не в самой информации.", "en": "Every cell in the body holds the same set of genes but switches on only part of it. In a nerve cell the genes for signal-carrying proteins are expressed, and in a skin cell the genes for keratin. The difference is in gene expression, not in the information itself."},null,[{"he": "כל תאי הגוף נוצרו מאותו תא מופרה, ולכן ה-DNA בהם זהה.", "ar": "كل خلايا الجسم نشأت من البيضة الملقّحة نفسها، لذلك DNA فيها متماثل.", "ru": "Все клетки тела произошли от одной оплодотворённой клетки, поэтому ДНК в них одинакова.", "en": "All body cells came from the same fertilised cell, so their DNA is identical."}, {"he": "מוטציות מקריות אינן יוצרות הבדל מסודר ואחיד בין סוגי תאים.", "ar": "الطفرات العشوائية لا تُنشئ فرقًا منظّمًا وموحّدًا بين أنواع الخلايا.", "ru": "Случайные мутации не создают упорядоченного и одинакового различия между типами клеток.", "en": "Random mutations do not create an orderly, uniform difference between cell types."}, null, {"he": "לכל תאי הגוף אותו מספר כרומוזומים, 46 באדם.", "ar": "لكل خلايا الجسم العدد نفسه من الكروموسومات، 46 عند الإنسان.", "ru": "У всех клеток тела одно и то же число хромосом — 46 у человека.", "en": "All body cells have the same number of chromosomes, 46 in humans."}]),
    Q("gene-2-4",{"he": "למה אנזים פועל בדרך כלל על חומר אחד בלבד?", "ar": "لماذا يعمل الإنزيم عادةً على مادة واحدة فقط؟", "ru": "Почему фермент обычно действует только на одно вещество?", "en": "Why does an enzyme usually act on only one substance?"},[{"he": "כי צורת האתר הפעיל מתאימה רק לאותו חומר", "ar": "لأن شكل الموقع النشط يلائم تلك المادة فقط", "ru": "Потому что форма активного центра подходит только этому веществу", "en": "Because the shape of the active site fits only that substance"}, {"he": "כי האנזים נצרך בתגובה ואינו יכול לחזור", "ar": "لأن الإنزيم يُستهلك في التفاعل ولا يمكنه العودة", "ru": "Потому что фермент расходуется в реакции и вернуться не может", "en": "Because the enzyme is used up in the reaction and cannot return"}, {"he": "כי לכל אנזים יש DNA משלו שבוחר את החומר", "ar": "لأن لكل إنزيم DNA خاصًّا يختار المادة", "ru": "Потому что у каждого фермента своя ДНК, которая выбирает вещество", "en": "Because each enzyme has its own DNA that picks the substance"}, {"he": "כי אנזימים פועלים רק בטמפרטורה של 37 מעלות", "ar": "لأن الإنزيمات تعمل فقط في حرارة 37 درجة", "ru": "Потому что ферменты работают только при 37 градусах", "en": "Because enzymes work only at 37 degrees"}],0,{"he": "חשבו על מנעול ועל מפתח אחד שנכנס בו.", "ar": "فكّروا بقفل ومفتاح واحد يدخل فيه.", "ru": "Подумайте о замке и одном ключе, который в него входит.", "en": "Think of a lock and the one key that fits it."},{"he": "לאנזים יש שקע מוגדר, האתר הפעיל, וצורתו משתלבת עם החומר שעליו הוא פועל. חומר בצורה אחרת אינו נכנס, ולכן אין תגובה. למשל, עמילאז מפרק עמילן ואינו מפרק חלבון.", "ar": "للإنزيم تجويف محدّد هو الموقع النشط، وشكله يتلاءم مع المادة التي يعمل عليها. مادة بشكل آخر لا تدخل، فلا يحدث تفاعل. مثلًا، الأميلاز يفكّك النشا ولا يفكّك البروتين.", "ru": "У фермента есть определённая выемка — активный центр, и её форма совпадает с веществом, на которое он действует. Вещество другой формы в неё не входит, и реакции нет. Например, амилаза расщепляет крахмал и не расщепляет белок.", "en": "An enzyme has a defined pocket, the active site, whose shape matches the substance it acts on. A substance of another shape does not fit in, so no reaction happens. Amylase, for example, breaks down starch and not protein."},null,[null, {"he": "אנזים אינו נצרך בתגובה, והוא חוזר ופועל שוב ושוב.", "ar": "الإنزيم لا يُستهلك في التفاعل، ويعود ليعمل مرّة بعد مرّة.", "ru": "Фермент в реакции не расходуется и работает снова и снова.", "en": "An enzyme is not used up in the reaction and works again and again."}, {"he": "אנזים הוא חלבון ואין בו DNA, ובחירת החומר נובעת מצורתו.", "ar": "الإنزيم بروتين ولا DNA فيه، واختيار المادة ناتج عن شكله.", "ru": "Фермент — белок, ДНК в нём нет, а выбор вещества следует из его формы.", "en": "An enzyme is a protein with no DNA in it; the choice of substance follows from its shape."}, {"he": "יש אנזימים שפועלים בחום גבוה או נמוך, וזה אינו קשור לבררנות.", "ar": "هناك إنزيمات تعمل في حرارة عالية أو منخفضة، وهذا لا علاقة له بالانتقائية.", "ru": "Есть ферменты, работающие при высокой или низкой температуре, и к избирательности это не относится.", "en": "Some enzymes work at high or low temperatures, and this has nothing to do with selectivity."}]),
    Q("gene-2-5",{"he": "מה צפוי לקרות לאנזים של הקיבה אם נעביר אותו לסביבה בסיסית?", "ar": "ما المتوقّع أن يحدث لإنزيم المعدة إذا نقلناه إلى بيئة قاعدية؟", "ru": "Что произойдёт с ферментом желудка, если перенести его в щелочную среду?", "en": "What is expected to happen to a stomach enzyme if it is moved to a basic environment?"},[{"he": "הוא יפעל מהר יותר מבדרך כלל", "ar": "سيعمل أسرع من المعتاد", "ru": "Он будет работать быстрее обычного", "en": "It will work faster than usual"}, {"he": "הוא יהפוך לאנזים אחר עם תפקיד חדש", "ar": "سيتحوّل إلى إنزيم آخر بوظيفة جديدة", "ru": "Он превратится в другой фермент с новой работой", "en": "It will turn into a different enzyme with a new job"}, {"he": "שום דבר לא ישתנה בפעילות שלו", "ar": "لن يتغيّر شيء في نشاطه", "ru": "В его работе ничего не изменится", "en": "Nothing in its activity will change"}, {"he": "צורתו תשתנה ופעילותו תרד מאוד", "ar": "سيتغيّر شكله وينخفض نشاطه كثيرًا", "ru": "Его форма изменится, и активность сильно упадёт", "en": "Its shape will change and its activity will drop sharply"}],3,{"he": "חשבו מה קורה לאתר הפעיל כשצורת החלבון מתעוותת.", "ar": "فكّروا بما يحدث للموقع النشط عندما يتشوّه شكل البروتين.", "ru": "Подумайте, что происходит с активным центром, когда форма белка искажается.", "en": "Think what happens to the active site when the protein's shape is distorted."},{"he": "לכל אנזים יש תחום חומציות שבו הוא פועל הכי טוב. אנזים הקיבה בנוי לסביבה חומצית מאוד, וב-pH בסיסי הקשרים שמחזיקים את צורתו משתנים. האתר הפעיל אינו מתאים יותר לחומר, והפעילות צונחת.", "ar": "لكل إنزيم مجال حموضة يعمل فيه على أفضل وجه. إنزيم المعدة مبني لبيئة حامضية جدًّا، وفي pH قاعدي تتغيّر الروابط التي تحفظ شكله. لا يعود الموقع النشط ملائمًا للمادة، فيهبط النشاط.", "ru": "У каждого фермента есть диапазон кислотности, в котором он работает лучше всего. Фермент желудка устроен для очень кислой среды, и при щелочном pH связи, держащие его форму, меняются. Активный центр больше не подходит веществу, и активность падает.", "en": "Every enzyme has a pH range in which it works best. The stomach enzyme is built for a very acidic setting, and at a basic pH the bonds that hold its shape change. The active site no longer matches the substance, and activity collapses."},null,[{"he": "מחוץ לתחום החומציות המתאים הפעילות יורדת, ואינה עולה.", "ar": "خارج مجال الحموضة الملائم ينخفض النشاط ولا يزيد.", "ru": "Вне подходящего диапазона кислотности активность падает, а не растёт.", "en": "Outside its proper pH range activity falls, it does not rise."}, {"he": "אנזים אינו מחליף תפקיד, כי תפקידו נקבע ברצף שלו ובצורתו.", "ar": "الإنزيم لا يبدّل وظيفته، لأن وظيفته محدّدة بتسلسله وشكله.", "ru": "Фермент не меняет работу, ведь она задана его последовательностью и формой.", "en": "An enzyme does not swap jobs; its job is set by its sequence and shape."}, {"he": "חומציות היא תנאי מרכזי לפעילות אנזים, ולכן שינוי בה כן משנה.", "ar": "الحموضة شرط مركزي لنشاط الإنزيم، لذلك تغيّرها يؤثّر فعلًا.", "ru": "Кислотность — ключевое условие работы фермента, поэтому её изменение влияет.", "en": "pH is a key condition for enzyme activity, so changing it does matter."}, null]),
    Q("gene-2-6",{"he": "מה קובע סדר הבסיסים במולקולת ה-mRNA?", "ar": "ماذا يحدّد ترتيب القواعد في جزيء mRNA؟", "ru": "Что определяет порядок оснований в молекуле иРНК?", "en": "What does the order of bases in the mRNA molecule determine?"},[{"he": "את מספר הכרומוזומים בתא", "ar": "عدد الكروموسومات في الخلية", "ru": "Число хромосом в клетке", "en": "The number of chromosomes in the cell"}, {"he": "את סדר חומצות האמינו בחלבון", "ar": "ترتيب الأحماض الأمينية في البروتين", "ru": "Порядок аминокислот в белке", "en": "The order of the amino acids in the protein"}, {"he": "את כמות ה-ATP שהתא מפיק בשעה", "ar": "كمية ATP التي تنتجها الخلية في الساعة", "ru": "Количество АТФ, которое клетка производит в час", "en": "How much ATP the cell produces per hour"}, {"he": "את גודל הגרעין של התא", "ar": "حجم نواة الخلية", "ru": "Размер ядра клетки", "en": "The size of the cell's nucleus"}],1,{"he": "שאלו מה הריבוזום בונה בזמן שהוא קורא את השלשות.", "ar": "اسألوا ما يبنيه الريبوسوم أثناء قراءته الثلاثيات.", "ru": "Спросите, что строит рибосома, читая тройки.", "en": "Ask what the ribosome builds while it reads the triplets."},{"he": "הריבוזום קורא את ה-mRNA בשלשות, וכל שלשה מביאה חומצת אמינו אחת. לכן סדר הבסיסים קובע את סדר החומצות, הסדר קובע את הצורה, והצורה קובעת את התפקיד. שינוי בסדר הבסיסים עשוי לשנות חלבון שלם.", "ar": "يقرأ الريبوسوم mRNA ثلاثيات، وكل ثلاثية تجلب حمضًا أمينيًّا واحدًا. لذلك يحدّد ترتيب القواعد ترتيب الأحماض، والترتيب يحدّد الشكل، والشكل يحدّد الوظيفة. تغيّر في ترتيب القواعد قد يغيّر بروتينًا كاملًا.", "ru": "Рибосома читает иРНК тройками, и каждая тройка приносит одну аминокислоту. Поэтому порядок оснований задаёт порядок аминокислот, порядок задаёт форму, а форма задаёт работу. Изменение порядка оснований может изменить весь белок.", "en": "The ribosome reads the mRNA in triplets, and each triplet brings one amino acid. So the base order sets the amino acid order, the order sets the shape, and the shape sets the job. A change in the base order can change a whole protein."},null,[{"he": "מספר הכרומוזומים נקבע לפי המין ואינו תלוי ב-mRNA.", "ar": "عدد الكروموسومات يحدّده النوع ولا يعتمد على mRNA.", "ru": "Число хромосом определяется видом и от иРНК не зависит.", "en": "The number of chromosomes is set by the species and does not depend on mRNA."}, null, {"he": "כמות ה-ATP נקבעת בנשימה התאית, ולא ברצף של mRNA יחיד.", "ar": "كمية ATP تحدّدها عملية التنفّس الخلوي، لا تسلسل mRNA واحد.", "ru": "Количество АТФ определяется клеточным дыханием, а не последовательностью одной иРНК.", "en": "The amount of ATP is set by cellular respiration, not by a single mRNA sequence."}, {"he": "גודל הגרעין אינו תוצר של רצף בסיסים אחד.", "ar": "حجم النواة ليس ناتجًا عن تسلسل قواعد واحد.", "ru": "Размер ядра не является следствием одной последовательности оснований.", "en": "The size of the nucleus is not the product of one base sequence."}]),
    Q("gene-2-7",{"he": "אדם נושא מוטציה בגן של אנזים, והאנזים אינו פעיל. איך זה גורם למחלה?", "ar": "شخص يحمل طفرة في جين إنزيم، والإنزيم غير نشط. كيف يسبّب ذلك مرضًا؟", "ru": "У человека мутация в гене фермента, и фермент не работает. Как это вызывает болезнь?", "en": "A person carries a mutation in an enzyme's gene, and the enzyme is not active. How does this cause disease?"},[{"he": "המוטציה פוגעת ישירות בקרום של כל תאי הגוף", "ar": "الطفرة تضرّ مباشرةً بغشاء كل خلايا الجسم", "ru": "Мутация прямо повреждает мембрану всех клеток тела", "en": "The mutation directly damages the membrane of all body cells"}, {"he": "המוטציה מדביקה גנים נוספים ומשתיקה אותם", "ar": "الطفرة تُعدي جينات أخرى وتُسكتها", "ru": "Мутация заражает другие гены и выключает их", "en": "The mutation infects other genes and silences them"}, {"he": "התגובה שהאנזים מזרז אינה מתרחשת, והחומר נערם או חסר", "ar": "التفاعل الذي يسرّعه الإنزيم لا يحدث، فتتكدّس المادة أو تنقص", "ru": "Реакция, которую ускорял фермент, не идёт, и вещество накапливается или его не хватает", "en": "The reaction the enzyme sped up does not happen, so a substance piles up or is missing"}, {"he": "האנזים הפגום הופך לרעל שהורג את התא", "ar": "الإنزيم المعطوب يتحوّل إلى سمّ يقتل الخلية", "ru": "Повреждённый фермент превращается в яд, убивающий клетку", "en": "The faulty enzyme turns into a poison that kills the cell"}],2,{"he": "חשבו על פס ייצור שבו עובד אחד נעדר.", "ar": "فكّروا بخطّ إنتاج يغيب فيه عامل واحد.", "ru": "Подумайте о конвейере, с которого ушёл один рабочий.", "en": "Think of a production line where one worker is missing."},{"he": "המוטציה משנה את רצף חומצות האמינו, הצורה משתנה, והאתר הפעיל אינו קושר עוד את החומר. התגובה נעצרת: החומר שלפניה נערם, והתוצר שאחריה חסר. כך נוצרת מחלה מטבולית, למשל פנילקטונוריה.", "ar": "تغيّر الطفرة تسلسل الأحماض الأمينية، فيتغيّر الشكل ولا يعود الموقع النشط يربط المادة. يتوقّف التفاعل: تتكدّس المادة التي قبله، وينقص الناتج الذي بعده. هكذا ينشأ مرض استقلابي، مثل بيلة الفينيل كيتون.", "ru": "Мутация меняет последовательность аминокислот, форма меняется, и активный центр больше не связывает вещество. Реакция останавливается: вещество до неё накапливается, а продукт после неё отсутствует. Так возникает болезнь обмена, например фенилкетонурия.", "en": "The mutation changes the amino acid sequence, the shape changes, and the active site no longer binds the substance. The reaction stops: the substance before it piles up and the product after it is missing. This is how a metabolic disease such as phenylketonuria arises."},null,[{"he": "מוטציה בגן אחד משנה חלבון אחד, ואינה פוגעת בכל הקרומים.", "ar": "طفرة في جين واحد تغيّر بروتينًا واحدًا، ولا تضرّ بكل الأغشية.", "ru": "Мутация в одном гене меняет один белок и все мембраны не повреждает.", "en": "A mutation in one gene changes one protein and does not damage every membrane."}, {"he": "מוטציה אינה עוברת מגן לגן, והיא יושבת במקום אחד ב-DNA.", "ar": "الطفرة لا تنتقل من جين إلى جين، وهي في موضع واحد في DNA.", "ru": "Мутация не переходит от гена к гену, она сидит в одном месте ДНК.", "en": "A mutation does not pass from gene to gene; it sits in one place in the DNA."}, null, {"he": "אנזים שאינו פעיל פשוט אינו עובד, והוא אינו נעשה רעיל.", "ar": "الإنزيم غير النشط لا يعمل فحسب، ولا يصبح سامًّا.", "ru": "Неактивный фермент просто не работает и токсичным не становится.", "en": "An inactive enzyme simply does not work; it does not become poisonous."}]),
    Q("gene-2-8",{"he": "למה אומרים שהקוד הגנטי הוא אוניברסלי?", "ar": "لماذا يُقال إن الشيفرة الوراثية عامّة لكل الكائنات؟", "ru": "Почему говорят, что генетический код универсален?", "en": "Why is the genetic code said to be universal?"},[{"he": "כי לכל היצורים אותו מספר גנים", "ar": "لأن لكل الكائنات العدد نفسه من الجينات", "ru": "Потому что у всех организмов одинаковое число генов", "en": "Because all organisms have the same number of genes"}, {"he": "כי לכל היצורים אותם חלבונים בדיוק", "ar": "لأن لكل الكائنات البروتينات نفسها تمامًا", "ru": "Потому что у всех организмов в точности одни и те же белки", "en": "Because all organisms have exactly the same proteins"}, {"he": "כי כל היצורים חיים באותה סביבה", "ar": "لأن كل الكائنات تعيش في البيئة نفسها", "ru": "Потому что все организмы живут в одной среде", "en": "Because all organisms live in the same environment"}, {"he": "כי אותו קודון מציין אותה חומצת אמינו כמעט בכל יצור", "ar": "لأن الكودون نفسه يدلّ على الحمض الأميني نفسه في كل الكائنات تقريبًا", "ru": "Потому что один и тот же кодон означает одну и ту же аминокислоту почти у всех организмов", "en": "Because the same codon means the same amino acid in nearly every organism"}],3,{"he": "חשבו על שפה אחת שכולם קוראים באותן מילים.", "ar": "فكّروا بلغة واحدة يقرأها الجميع بالكلمات نفسها.", "ru": "Подумайте об одном языке, который все читают теми же словами.", "en": "Think of one language that everyone reads with the same words."},{"he": "הקודון AAA מציין ליזין בחיידק, בשמרים ובאדם. בגלל זה אפשר להכניס גן אנושי לחיידק, והחיידק ייצר את החלבון האנושי. כך מייצרים אינסולין בתעשייה.", "ar": "الكودون AAA يدلّ على الليزين في البكتيريا والخميرة والإنسان. لهذا يمكن إدخال جين بشري إلى بكتيريا، فتنتج البكتيريا البروتين البشري. هكذا يُنتَج الإنسولين صناعيًّا.", "ru": "Кодон AAA означает лизин у бактерии, у дрожжей и у человека. Поэтому человеческий ген можно ввести в бактерию, и бактерия произведёт человеческий белок. Так в промышленности получают инсулин.", "en": "The codon AAA means lysine in a bacterium, in yeast and in a human. This is why a human gene can be put into a bacterium, and the bacterium will make the human protein. Insulin is produced industrially in just this way."},null,[{"he": "מספר הגנים שונה מאוד בין יצורים, וזו אינה המשמעות של אוניברסלי.", "ar": "عدد الجينات يختلف كثيرًا بين الكائنات، وليس هذا معنى العمومية.", "ru": "Число генов у организмов очень разное, и универсальность означает не это.", "en": "The number of genes differs greatly between organisms, and this is not what universal means."}, {"he": "לכל יצור חלבונים משלו, והקוד המשותף הוא דרך הקריאה בלבד.", "ar": "لكل كائن بروتيناته، والشيفرة المشتركة هي طريقة القراءة فقط.", "ru": "У каждого организма свои белки, а общий код — это лишь способ чтения.", "en": "Each organism has its own proteins; the shared code is only the way of reading."}, {"he": "יצורים חיים בסביבות שונות מאוד, וזה אינו קשור לקוד הגנטי.", "ar": "الكائنات تعيش في بيئات مختلفة جدًّا، ولا علاقة لذلك بالشيفرة الوراثية.", "ru": "Организмы живут в очень разных средах, и к генетическому коду это не относится.", "en": "Organisms live in very different environments, and this has nothing to do with the code."}, null]),
    Q("gene-2-9",{"he": "למה תוספת של בסיס אחד באמצע גן מזיקה בדרך כלל יותר מהחלפת בסיס אחד?", "ar": "لماذا تكون إضافة قاعدة واحدة في وسط الجين أشدّ ضررًا عادةً من إبدال قاعدة واحدة؟", "ru": "Почему вставка одного основания в середине гена обычно вреднее замены одного основания?", "en": "Why is adding one base in the middle of a gene usually more harmful than swapping one base?"},[{"he": "כי כל השלשות שאחרי התוספת נקראות בחלוקה חדשה", "ar": "لأن كل الثلاثيات بعد الإضافة تُقرأ بتقسيم جديد", "ru": "Потому что все тройки после вставки читаются с новым разбиением", "en": "Because every triplet after the insertion is read in a new grouping"}, {"he": "כי תוספת של בסיס מאריכה את הכרומוזום פי שניים", "ar": "لأن إضافة قاعدة تضاعف طول الكروموسوم", "ru": "Потому что вставка основания удваивает длину хромосомы", "en": "Because adding a base doubles the chromosome's length"}, {"he": "כי בסיס נוסף מונע מה-DNA להישאר בגרעין", "ar": "لأن القاعدة الزائدة تمنع DNA من البقاء في النواة", "ru": "Потому что лишнее основание не даёт ДНК остаться в ядре", "en": "Because an extra base stops the DNA staying in the nucleus"}, {"he": "כי החלפת בסיס אינה משנה דבר בשום מקרה", "ar": "لأن إبدال القاعدة لا يغيّر شيئًا في أي حال", "ru": "Потому что замена основания вообще ничего не меняет", "en": "Because swapping a base never changes anything"}],0,{"he": "נסו למחוק רווח אחד במשפט, וקראו את המילים מחדש.", "ar": "جرّبوا حذف مسافة واحدة من جملة، ثم اقرأوا الكلمات من جديد.", "ru": "Попробуйте убрать один пробел в предложении и прочитать слова заново.", "en": "Try deleting one space in a sentence and reading the words again."},{"he": "הריבוזום קורא בשלשות רצופות מנקודת ההתחלה. בסיס שנוסף מזיז את כל החלוקה, ולכן כל הקודונים שאחריו משתנים, ואיתם רוב חומצות האמינו. החלפת בסיס אחד משנה לרוב קודון אחד בלבד.", "ar": "يقرأ الريبوسوم ثلاثيات متتابعة من نقطة البداية. القاعدة المضافة تزيح كل التقسيم، فتتغيّر كل الكودونات بعدها ومعها معظم الأحماض الأمينية. أما إبدال قاعدة واحدة فيغيّر عادةً كودونًا واحدًا فقط.", "ru": "Рибосома читает последовательные тройки от точки начала. Вставленное основание сдвигает всё разбиение, поэтому меняются все кодоны после него, а с ними и большинство аминокислот. Замена одного основания меняет обычно только один кодон.", "en": "The ribosome reads consecutive triplets from the start point. An added base shifts the whole grouping, so every codon after it changes, and with it most of the amino acids. Swapping one base usually changes only a single codon."},null,[null, {"he": "בסיס אחד מוסיף אורך זניח, והנזק נובע מהזזת הקריאה.", "ar": "قاعدة واحدة تضيف طولًا ضئيلًا، والضرر ناتج عن إزاحة القراءة.", "ru": "Одно основание добавляет ничтожную длину, вред идёт от сдвига чтения.", "en": "One base adds negligible length; the harm comes from the shift in reading."}, {"he": "ה-DNA נשאר בגרעין בכל מקרה, ובסיס נוסף אינו מוציא אותו.", "ar": "يبقى DNA في النواة في كل حال، والقاعدة الزائدة لا تخرجه منها.", "ru": "ДНК остаётся в ядре в любом случае, лишнее основание её оттуда не выводит.", "en": "The DNA stays in the nucleus in any case; an extra base does not take it out."}, {"he": "החלפת בסיס לפעמים כן משנה חומצת אמינו ואף פוגעת בחלבון.", "ar": "إبدال القاعدة يغيّر أحيانًا حمضًا أمينيًّا بل يضرّ بالبروتين.", "ru": "Замена основания иногда всё же меняет аминокислоту и даже портит белок.", "en": "Swapping a base does sometimes change an amino acid and even damage the protein."}]),
 ],
 [
    Q("gene-3-1",{"he": "מוטציה החליפה בסיס אחד בגן, אך החלבון נשאר זהה. איך זה אפשר?", "ar": "طفرة استبدلت قاعدة واحدة في الجين لكن البروتين بقي نفسه. كيف يمكن ذلك؟", "ru": "Мутация заменила одно основание в гене, но белок остался прежним. Как это возможно?", "en": "A mutation replaced one base in a gene, yet the protein stayed the same. How is this possible?"},[{"he": "כמה שלשות שונות יכולות לקודד לאותה חומצה אמינית", "ar": "عدة ثلاثيات مختلفة يمكن أن تشفّر للحمض الأميني نفسه", "ru": "Несколько разных триплетов могут кодировать одну аминокислоту", "en": "Several different triplets can code for the same amino acid"}, {"he": "בתא יש עותק שני ותקין של אותו גן, והוא זה שנקרא בפועל", "ar": "في الخلية نسخة ثانية سليمة من الجين نفسه، وهي التي تُقرأ فعليًّا", "ru": "В клетке есть вторая исправная копия того же гена, и читается именно она", "en": "The cell has a second intact copy of the same gene, and that is what is read"}, {"he": "הריבוזום מתקן כל שגיאה לפני שהוא קורא", "ar": "الريبوسوم يصحّح كل خطأ قبل أن يقرأ", "ru": "Рибосома исправляет любую ошибку до чтения", "en": "The ribosome corrects every error before reading"}, {"he": "רצף החלבון נקבע בציטופלזמה ואינו תלוי ברצף הבסיסים", "ar": "تسلسل البروتين يُحدَّد في السيتوبلازم ولا يعتمد على تسلسل القواعد", "ru": "Последовательность белка задаётся в цитоплазме и не зависит от оснований", "en": "The protein sequence is set in the cytoplasm and does not depend on the bases"}],0,{"he": "שלוש אותיות ב-mRNA הן ״מילה״ אחת. כמה מילים שונות יכולות לשמור על אותה משמעות?", "ar": "ثلاثة حروف في mRNA هي «كلمة» واحدة. هل يمكن لعدة كلمات أن تحمل المعنى نفسه؟", "ru": "Три буквы иРНК — одно «слово». Могут ли разные слова означать одно и то же?", "en": "Three letters in mRNA are one word. Can several different words have the same meaning?"},{"he": "בקוד הגנטי יש עודף: יש 64 שלשות אפשריות ורק 20 חומצות אמינו. לכן שינוי בבסיס אחד לפעמים נותן שלשה אחרת שמקודדת לאותה חומצה, ואין שינוי בחלבון.", "ar": "في الشيفرة الوراثية فائض: هناك 64 ثلاثية ممكنة و20 حمضًا أمينيًا فقط. لذلك قد يعطي تغيير قاعدة واحدة ثلاثية أخرى تشفّر للحمض نفسه فلا يتغيّر البروتين.", "ru": "Генетический код вырожден: возможны 64 триплета и всего 20 аминокислот. Поэтому замена одного основания иногда даёт другой триплет для той же аминокислоты, и белок не меняется.", "en": "The genetic code is redundant: there are 64 possible triplets and only 20 amino acids. So changing one base sometimes gives another triplet for the same amino acid, and the protein does not change."},null,[null, {"he": "גם אם יש עותק שני, החלבון מהעותק שהשתנה היה אמור להשתנות.", "ar": "حتى لو وُجدت نسخة ثانية، كان من المفترض أن يتغيّر البروتين من النسخة المتغيّرة.", "ru": "Даже при второй копии белок с изменённой копии должен был бы измениться.", "en": "Even with a second copy, the protein from the changed copy should still differ."}, {"he": "הריבוזום קורא את מה שכתוב ואינו מתקן שגיאות ברצף.", "ar": "الريبوسوم يقرأ ما هو مكتوب ولا يصحّح الأخطاء في التسلسل.", "ru": "Рибосома читает то, что написано, и не исправляет ошибки в последовательности.", "en": "The ribosome reads what is written and does not correct errors in the sequence."}, {"he": "רצף החלבון נקבע ברצף הבסיסים שבגן, ולא בציטופלזמה.", "ar": "تسلسل البروتين يحدّده تسلسل القواعد في الجين، لا السيتوبلازم.", "ru": "Последовательность белка задаётся порядком оснований в гене, а не цитоплазмой.", "en": "The protein's sequence is set by the bases in the gene, not by the cytoplasm."}]),
    Q("gene-3-2",{"he": "פעילות אנזים יורדת כמעט לאפס בטמפרטורה גבוהה מאוד, ולא חוזרת כשמצננים. מה ההסבר?", "ar": "يهبط نشاط إنزيم إلى الصفر تقريبًا عند حرارة عالية جدًا ولا يعود عند التبريد. ما التفسير؟", "ru": "Активность фермента падает почти до нуля при очень высокой температуре и не возвращается при охлаждении. Почему?", "en": "An enzyme's activity drops almost to zero at a very high temperature and does not return when it cools. Why?"},[{"he": "מבנה החלבון השתנה (דנטורציה) והאתר הפעיל איבד את צורתו", "ar": "تغيّرت بنية البروتين (مسخ) وفقد الموقع الفعّال شكله", "ru": "Структура белка изменилась (денатурация), активный центр потерял форму", "en": "The protein structure changed (denaturation) and the active site lost its shape"}, {"he": "האנזים נצרך בתגובה עצמה, ולכן כמותו הולכת ואוזלת", "ar": "الإنزيم يُستهلك في التفاعل نفسه، لذلك تتناقص كميّته حتى تنفد", "ru": "Фермент расходуется в самой реакции, поэтому его количество иссякает", "en": "The enzyme is used up in the reaction itself, so its amount runs out"}, {"he": "החום הוסיף לתגובה מגיבים חדשים", "ar": "الحرارة أضافت متفاعلات جديدة للتفاعل", "ru": "Тепло добавило в реакцию новые реагенты", "en": "The heat added new reactants to the reaction"}, {"he": "הצינון הרס את ה-DNA שממנו נבנה האנזים, ולכן אין ייצור חדש", "ar": "التبريد أتلف الـDNA الذي بُني منه الإنزيم، لذلك لا يوجد إنتاج جديد", "ru": "Охлаждение разрушило ДНК, из которой строится фермент, поэтому нового синтеза нет", "en": "Cooling destroyed the DNA that the enzyme is built from, so no new enzyme is made"}],0,{"he": "מה קורה לצורה של חלבון כשמחממים אותו חזק, כמו חלבון של ביצה?", "ar": "ماذا يحدث لشكل البروتين عند تسخينه بقوة، مثل بروتين البيضة؟", "ru": "Что происходит с формой белка при сильном нагреве, как у белка яйца?", "en": "What happens to the shape of a protein when it is heated strongly, like egg white?"},{"he": "אנזים הוא חלבון, והאתר הפעיל שלו מתאים לחומר המגיב רק בצורה מסוימת. חום גבוה משנה את הצורה לצמיתות, והאנזים כבר לא קושר את החומר. אנזים אינו נצרך בתגובה.", "ar": "الإنزيم بروتين، وموقعه الفعّال يناسب المادة المتفاعلة بشكل معيّن فقط. الحرارة العالية تغيّر الشكل نهائيًا فلا يعود الإنزيم يرتبط بالمادة. والإنزيم لا يُستهلك في التفاعل.", "ru": "Фермент — белок, и его активный центр подходит к веществу только при определённой форме. Высокая температура необратимо меняет форму, и фермент больше не связывает вещество. Фермент в реакции не расходуется.", "en": "An enzyme is a protein, and its active site fits the substrate only in a certain shape. High heat changes the shape permanently, so the enzyme no longer binds the substrate. An enzyme is not used up in the reaction."},null,[null, {"he": "אנזים יוצא מהתגובה כמו שנכנס אליה, ולכן הוא אינו נגמר.", "ar": "الإنزيم يخرج من التفاعل كما دخل إليه، لذلك لا ينفد.", "ru": "Фермент выходит из реакции таким же, каким вошёл, поэтому он не кончается.", "en": "An enzyme leaves a reaction as it entered it, so it is not used up."}, {"he": "חום אינו יוצר מגיבים חדשים, ומגיבים נוספים היו מגבירים את הפעילות.", "ar": "الحرارة لا تُنتج موادّ متفاعلة جديدة، وزيادة المتفاعلات كانت سترفع النشاط.", "ru": "Тепло не создаёт новых реагентов, а их избыток только усилил бы активность.", "en": "Heat does not create new reactants, and more reactants would raise activity."}, {"he": "האנזים עצמו הוא חלבון, והצינון אינו הורס DNA במבחנה.", "ar": "الإنزيم نفسه بروتين، والتبريد لا يُتلف الـDNA داخل أنبوب الاختبار.", "ru": "Сам фермент — белок, и охлаждение не разрушает ДНК в пробирке.", "en": "The enzyme itself is a protein, and cooling does not destroy DNA in a tube."}]),
    Q("gene-3-3",{"he": "קצב תגובה של אנזים עולה עם ריכוז החומר, ומריכוז מסוים ואילך אינו עולה יותר. מה הגורם המגביל?", "ar": "معدّل تفاعل الإنزيم يزيد مع تركيز المادة، ومن تركيز معيّن لا يزيد أكثر. ما العامل المحدّد؟", "ru": "Скорость реакции фермента растёт с концентрацией вещества, а с некоторой концентрации больше не растёт. Что её ограничивает?", "en": "An enzyme's reaction rate rises with the concentration of the substance, and beyond a certain concentration it rises no further. What is the limiting factor?"},[{"he": "החומר נגמר בתמיסה", "ar": "المادة نفدت في المحلول", "ru": "Вещество в растворе закончилось", "en": "The substance has run out in the solution"}, {"he": "האנזים נצרך בתגובה ואינו זמין עוד", "ar": "الإنزيم استُهلك في التفاعل ولم يبق متاحًا", "ru": "Фермент израсходовался в реакции и больше недоступен", "en": "The enzyme was used up in the reaction and is no longer available"}, {"he": "כל האתרים הפעילים תפוסים, וכמות האנזים מגבילה", "ar": "كل المواقع النشطة مشغولة، وكمية الإنزيم هي المحدّد", "ru": "Все активные центры заняты, и количество фермента ограничивает", "en": "Every active site is occupied, and the amount of enzyme is the limit"}, {"he": "החומציות בתמיסה עלתה ופגעה באנזים", "ar": "زادت الحموضة في المحلول وأضرّت بالإنزيم", "ru": "Кислотность раствора выросла и повредила фермент", "en": "The pH of the solution rose and damaged the enzyme"}],2,{"he": "שאלו מה היה קורה לגרף אם היו מכפילים את כמות האנזים.", "ar": "اسألوا ماذا كان سيحدث للرسم لو تضاعفت كمية الإنزيم.", "ru": "Спросите, что было бы с графиком, если удвоить количество фермента.", "en": "Ask what would happen to the graph if the amount of enzyme were doubled."},{"he": "בריכוז נמוך יש אתרים פעילים פנויים, ולכן תוספת חומר מזרזת את התגובה. ברוויה כל האנזימים עסוקים, ותוספת חומר רק מאריכה את התור. הוכחה לכך: הכפלת כמות האנזים מעלה את רמת הרוויה, והכפלת החומר אינה מעלה אותה.", "ar": "في التركيز المنخفض توجد مواقع نشطة متاحة، فتسرّع إضافة المادة التفاعل. وعند التشبّع تكون كل الإنزيمات مشغولة، وإضافة المادة تطيل الصفّ فقط. الدليل: مضاعفة كمية الإنزيم ترفع مستوى التشبّع، ومضاعفة المادة لا ترفعه.", "ru": "При низкой концентрации свободные активные центры есть, поэтому добавление вещества ускоряет реакцию. При насыщении все ферменты заняты, и добавление вещества лишь удлиняет очередь. Доказательство: удвоение количества фермента поднимает уровень насыщения, а удвоение вещества — нет.", "en": "At low concentration free active sites remain, so adding substance speeds the reaction up. At saturation every enzyme is busy, and adding substance only lengthens the queue. The proof: doubling the enzyme raises the plateau, while doubling the substance does not."},null,[{"he": "אם החומר היה נגמר, הקצב היה יורד לאפס ולא נשאר קבוע.", "ar": "لو نفدت المادة، لانخفض المعدّل إلى الصفر ولم يبق ثابتًا.", "ru": "Если бы вещество кончилось, скорость упала бы до нуля, а не осталась постоянной.", "en": "If the substance had run out, the rate would drop to zero, not stay constant."}, {"he": "אנזים אינו נצרך בתגובה, והוא חוזר לעבוד מיד אחריה.", "ar": "الإنزيم لا يُستهلك في التفاعل، ويعود للعمل بعده فورًا.", "ru": "Фермент в реакции не расходуется и сразу после неё снова работает.", "en": "An enzyme is not used up in the reaction and gets back to work right after it."}, null, {"he": "הניסוי שינה רק את ריכוז החומר, ואין נתון על שינוי בחומציות.", "ar": "التجربة غيّرت تركيز المادة فقط، ولا بيانات عن تغيّر في الحموضة.", "ru": "В опыте меняли только концентрацию вещества, данных об изменении кислотности нет.", "en": "The experiment changed only the substance's concentration; there is no data on a pH change."}]),
    Q("gene-3-4",{"he": "הוכנס גן אנושי לחיידק, והחיידק ייצר את החלבון האנושי. מה זה מלמד?", "ar": "أُدخل جين بشري إلى بكتيريا، فأنتجت البكتيريا البروتين البشري. على ماذا يدلّ ذلك؟", "ru": "Человеческий ген ввели в бактерию, и бактерия произвела человеческий белок. О чём это говорит?", "en": "A human gene was put into a bacterium, and the bacterium made the human protein. What does this show?"},[{"he": "שהחיידק הפך לתא אנושי", "ar": "أن البكتيريا تحوّلت إلى خلية بشرية", "ru": "Что бактерия превратилась в человеческую клетку", "en": "That the bacterium turned into a human cell"}, {"he": "שהגן האנושי השתנה והותאם לחיידק", "ar": "أن الجين البشري تغيّر وتلاءم مع البكتيريا", "ru": "Что человеческий ген изменился и подстроился под бактерию", "en": "That the human gene changed and adapted to the bacterium"}, {"he": "שחיידקים מייצרים חלבונים בלי ריבוזומים", "ar": "أن البكتيريا تنتج بروتينات بلا ريبوسومات", "ru": "Что бактерии производят белки без рибосом", "en": "That bacteria make proteins without ribosomes"}, {"he": "שהחיידק קורא את הקוד הגנטי באותה דרך", "ar": "أن البكتيريا تقرأ الشيفرة الوراثية بالطريقة نفسها", "ru": "Что бактерия читает генетический код тем же способом", "en": "That the bacterium reads the genetic code in the same way"}],3,{"he": "שאלו מה היה צריך להיות משותף לשני היצורים כדי שזה יעבוד.", "ar": "اسألوا ما كان يجب أن يكون مشتركًا بين الكائنين حتى ينجح ذلك.", "ru": "Спросите, что должно быть общим у двух организмов, чтобы это сработало.", "en": "Ask what the two organisms needed to share for this to work."},{"he": "הריבוזום של החיידק קיבל mRNA שנוצר מגן אנושי, וקרא אותו באותן שלשות. התוצאה היא חלבון אנושי תקין, והיא ראיה ישירה לכך שהקוד הגנטי משותף. כך מייצרים אינסולין לחולי סוכרת.", "ar": "استقبل ريبوسوم البكتيريا mRNA نتج عن جين بشري، فقرأه بالثلاثيات نفسها. والنتيجة بروتين بشري سليم، وهي دليل مباشر على أن الشيفرة الوراثية مشتركة. هكذا يُنتَج الإنسولين لمرضى السكّري.", "ru": "Рибосома бактерии получила иРНК, сделанную по человеческому гену, и прочла её теми же тройками. Результат — нормальный человеческий белок, и это прямое доказательство общности генетического кода. Так производят инсулин для больных диабетом.", "en": "The bacterium's ribosome received mRNA made from a human gene and read it with the same triplets. The result is a working human protein, direct evidence that the genetic code is shared. This is how insulin for people with diabetes is produced."},null,[{"he": "החיידק נשאר חיידק, והוא רק הפעיל גן אחד נוסף.", "ar": "بقيت البكتيريا بكتيريا، وقد شغّلت جينًا إضافيًّا واحدًا فقط.", "ru": "Бактерия осталась бактерией, она лишь включила один дополнительный ген.", "en": "The bacterium stayed a bacterium; it merely switched on one extra gene."}, {"he": "החלבון שנוצר היה אנושי, ולכן הגן לא השתנה בדרך.", "ar": "البروتين الناتج كان بشريًّا، لذلك لم يتغيّر الجين في الطريق.", "ru": "Полученный белок был человеческим, значит ген по пути не изменился.", "en": "The protein produced was human, so the gene did not change on the way."}, {"he": "לחיידקים יש ריבוזומים, ובהם נבנה החלבון בניסוי הזה.", "ar": "للبكتيريا ريبوسومات، وفيها بُني البروتين في هذه التجربة.", "ru": "У бактерий есть рибосомы, и именно в них в этом опыте строился белок.", "en": "Bacteria do have ribosomes, and that is where the protein was built in this experiment."}, null]),
    Q("gene-3-5",{"he": "מוטציה נמצאה מחוץ לאזור המקודד של גן. רצף החלבון לא השתנה, אך כמותו בתא ירדה בחצי. מה ההסבר?", "ar": "وُجدت طفرة خارج المنطقة المشفّرة للجين. لم يتغيّر تسلسل البروتين، لكن كميته في الخلية نقصت إلى النصف. ما التفسير؟", "ru": "Мутацию нашли вне кодирующей области гена. Последовательность белка не изменилась, но его количество в клетке упало вдвое. Каково объяснение?", "en": "A mutation was found outside a gene's coding region. The protein's sequence did not change, but its amount in the cell halved. What is the explanation?"},[{"he": "החלבון מתפרק מהר יותר בגלל המוטציה בקוד", "ar": "يتفكّك البروتين أسرع بسبب الطفرة في الشيفرة", "ru": "Белок быстрее распадается из-за мутации в коде", "en": "The protein breaks down faster because of the mutation in the code"}, {"he": "המוטציה פגעה באזור הבקרה, ולכן הגן משועתק פחות", "ar": "أضرّت الطفرة بمنطقة التحكّم، فيُنسَخ الجين أقلّ", "ru": "Мутация повредила регуляторную область, поэтому ген транскрибируется меньше", "en": "The mutation hit the control region, so the gene is transcribed less"}, {"he": "אזור שאינו מקודד אינו משפיע על התא בשום דרך", "ar": "المنطقة غير المشفّرة لا تؤثّر على الخلية بأي شكل", "ru": "Некодирующая область никак не влияет на клетку", "en": "A non-coding region does not affect the cell in any way"}, {"he": "הריבוזום קורא את הגן בשלשות אחרות עכשיו", "ar": "الريبوسوم يقرأ الجين الآن بثلاثيات أخرى", "ru": "Рибосома теперь читает ген другими тройками", "en": "The ribosome now reads the gene in different triplets"}],1,{"he": "הפרידו בין השאלה איזה חלבון נבנה ובין השאלה כמה ממנו נבנה.", "ar": "افصلوا بين سؤال أيّ بروتين يُبنى وسؤال كم يُبنى منه.", "ru": "Разделите вопрос, какой белок строится, и вопрос, сколько его строится.", "en": "Separate the question of which protein is built from the question of how much is built."},{"he": "רצף שלא השתנה פירושו שהאזור המקודד שלם. ליד הגן יש אזורי בקרה שקובעים כמה פעמים הוא משועתק, ופגיעה בהם מורידה את כמות ה-mRNA ואיתה את כמות החלבון. זה בדיוק מה שנמדד כאן.", "ar": "التسلسل الذي لم يتغيّر يعني أن المنطقة المشفّرة سليمة. وإلى جانب الجين مناطق تحكّم تحدّد كم مرّة يُنسَخ، والضرر فيها يخفّض كمية mRNA ومعها كمية البروتين. وهذا بالضبط ما قيس هنا.", "ru": "Неизменённая последовательность означает, что кодирующая область цела. Рядом с геном есть регуляторные области, задающие, сколько раз он транскрибируется, и их повреждение снижает количество иРНК, а с ним и количество белка. Именно это здесь и измерено.", "en": "An unchanged sequence means the coding region is intact. Next to the gene are control regions that set how often it is transcribed, and damage there lowers the amount of mRNA and with it the amount of protein. That is exactly what was measured here."},null,[{"he": "המוטציה אינה בקוד עצמו, ולכן החלבון שנבנה זהה ועמיד כמקודם.", "ar": "الطفرة ليست في الشيفرة نفسها، فالبروتين المبني متماثل وثابت كما كان.", "ru": "Мутация не в самом коде, поэтому построенный белок тот же и столь же устойчив.", "en": "The mutation is not in the code itself, so the protein built is identical and as stable as before."}, null, {"he": "הנתון מראה שינוי בכמות, ולכן האזור הזה כן משפיע.", "ar": "البيانات تُظهر تغيّرًا في الكمية، فهذه المنطقة تؤثّر فعلًا.", "ru": "Данные показывают изменение количества, значит эта область всё же влияет.", "en": "The data show a change in amount, so this region does have an effect."}, {"he": "הזזת מסגרת קריאה היתה משנה את רצף החלבון, והוא נשאר זהה.", "ar": "إزاحة إطار القراءة كانت ستغيّر تسلسل البروتين، وقد بقي كما هو.", "ru": "Сдвиг рамки чтения изменил бы последовательность белка, а она осталась прежней.", "en": "A reading-frame shift would change the protein's sequence, and it stayed the same."}]),
    Q("gene-3-6",{"he": "אותו אנזים נבדק בשתי מבחנות: אחת ב-10 מעלות, ואחת ב-37 מעלות. במבחנה הקרה הקצב היה נמוך, וכשחוממה הקצב עלה. מה ההסבר?", "ar": "فُحص الإنزيم نفسه في أنبوبين، في 10 درجات وفي 37. في الأنبوب البارد كان المعدّل منخفضًا، وعند تسخينه ارتفع. ما التفسير؟", "ru": "Один и тот же фермент проверили в двух пробирках, при 10 и при 37 градусах. В холодной пробирке скорость была низкой, а при нагревании выросла. Каково объяснение?", "en": "The same enzyme was tested in two tubes, at 10 and at 37 degrees. In the cold tube the rate was low, and when it was warmed the rate rose. What is the explanation?"},[{"he": "בקור יש פחות מפגשים בין האנזים לחומר, והאנזים עצמו לא נפגע", "ar": "في البرد تقلّ اللقاءات بين الإنزيم والمادة، والإنزيم نفسه لم يتضرّر", "ru": "В холоде встреч фермента с веществом меньше, а сам фермент не повреждён", "en": "In the cold there are fewer meetings between enzyme and substance, and the enzyme itself is not damaged"}, {"he": "הקור הרס את צורת האנזים לבלי חזור", "ar": "البرد دمّر شكل الإنزيم بلا رجعة", "ru": "Холод необратимо разрушил форму фермента", "en": "The cold destroyed the enzyme's shape for good"}, {"he": "בקור נוצר אנזים נוסף שמאט את התגובה", "ar": "في البرد نشأ إنزيم آخر يُبطئ التفاعل", "ru": "В холоде появился ещё один фермент, замедляющий реакцию", "en": "In the cold another enzyme appeared that slows the reaction"}, {"he": "הקור שינה את החומר עצמו לחומר אחר", "ar": "البرد غيّر المادة نفسها إلى مادة أخرى", "ru": "Холод превратил само вещество в другое вещество", "en": "The cold changed the substance itself into another substance"}],0,{"he": "העובדה המכריעה היא שהקצב חזר לעלות אחרי החימום.", "ar": "الحقيقة الحاسمة أن المعدّل عاد وارتفع بعد التسخين.", "ru": "Решающий факт: после нагрева скорость снова выросла.", "en": "The decisive fact is that the rate rose again after warming."},{"he": "בטמפרטורה נמוכה המולקולות נעות לאט, ולכן יש פחות מפגשים מוצלחים ופחות תוצר. הצורה נשארת שלמה, ולכן חימום מחזיר את הקצב. בחום גבוה מדי, לעומת זאת, הצורה נהרסת והקצב אינו חוזר גם אחרי קירור.", "ar": "في حرارة منخفضة تتحرّك الجزيئات ببطء، فتقلّ اللقاءات الناجحة ويقلّ الناتج. يبقى الشكل سليمًا، لذلك يُعيد التسخين المعدّل. أما في حرارة عالية جدًّا فيتهدّم الشكل ولا يعود المعدّل حتى بعد التبريد.", "ru": "При низкой температуре молекулы двигаются медленно, поэтому успешных встреч меньше и продукта меньше. Форма остаётся целой, поэтому нагрев возвращает скорость. А при слишком высокой температуре форма разрушается, и скорость не возвращается даже после охлаждения.", "en": "At low temperature the molecules move slowly, so there are fewer successful meetings and less product. The shape stays intact, so warming restores the rate. At too high a temperature, by contrast, the shape is destroyed and the rate does not come back even after cooling."},null,[null, {"he": "אם הקור היה הורס את הצורה, הקצב לא היה עולה אחרי החימום.", "ar": "لو دمّر البرد الشكل، لما ارتفع المعدّل بعد التسخين.", "ru": "Если бы холод разрушил форму, скорость после нагрева не выросла бы.", "en": "If the cold had destroyed the shape, the rate would not rise after warming."}, {"he": "אנזים אינו נוצר מעצמו במבחנה, כי בנייתו דורשת תא שלם.", "ar": "الإنزيم لا ينشأ من تلقاء نفسه في الأنبوب، لأن بناءه يحتاج خلية كاملة.", "ru": "Фермент не возникает сам в пробирке: для его построения нужна целая клетка.", "en": "An enzyme does not appear by itself in a tube; building one needs a whole cell."}, {"he": "קור אינו הופך חומר לחומר אחר, והוא רק מאט את התנועה.", "ar": "البرد لا يحوّل مادة إلى أخرى، وهو يُبطئ الحركة فقط.", "ru": "Холод не превращает вещество в другое, он лишь замедляет движение.", "en": "Cold does not turn one substance into another; it only slows movement down."}]),
    Q("gene-3-7",{"he": "מוטציה יצרה קודון עצירה בתחילת גן. מה צפוי לחלבון?", "ar": "طفرة أنشأت كودون توقّف في بداية الجين. ما المتوقّع للبروتين؟", "ru": "Мутация создала стоп-кодон в начале гена. Что ожидается с белком?", "en": "A mutation created a stop codon near the start of a gene. What is expected of the protein?"},[{"he": "החלבון יהיה ארוך מהרגיל", "ar": "سيكون البروتين أطول من المعتاد", "ru": "Белок будет длиннее обычного", "en": "The protein will be longer than usual"}, {"he": "החלבון ייבנה כרגיל אך יישאר בגרעין", "ar": "سيُبنى البروتين كالمعتاد لكنه سيبقى في النواة", "ru": "Белок построится как обычно, но останется в ядре", "en": "The protein will be built as usual but stay in the nucleus"}, {"he": "ייבנה חלבון קצר מאוד שלא יתפקד", "ar": "سيُبنى بروتين قصير جدًّا لا يعمل", "ru": "Построится очень короткий белок, который работать не будет", "en": "A very short protein will be built and will not function"}, {"he": "ייבנו שני חלבונים נפרדים מאותו גן", "ar": "سيُبنى بروتينان منفصلان من الجين نفسه", "ru": "Из одного гена построятся два отдельных белка", "en": "Two separate proteins will be built from the same gene"}],2,{"he": "חשבו מה עושה הריבוזום בדיוק כשהוא מגיע לקודון עצירה.", "ar": "فكّروا بما يفعله الريبوسوم تمامًا عند وصوله إلى كودون التوقّف.", "ru": "Подумайте, что именно делает рибосома, дойдя до стоп-кодона.", "en": "Think what the ribosome does exactly when it reaches a stop codon."},{"he": "קודון עצירה מסיים את התרגום. אם הוא מופיע בתחילת הגן, הריבוזום משתחרר אחרי חומצות אמינו מעטות, והשרשרת הקצרה אינה מתקפלת לצורה הדרושה. חלבון כזה אינו ממלא את תפקידו, ולכן התוצאה דומה להיעדר הגן.", "ar": "كودون التوقّف يُنهي الترجمة. وإذا ظهر في بداية الجين، يتحرّر الريبوسوم بعد أحماض أمينية قليلة، ولا تنثني السلسلة القصيرة إلى الشكل المطلوب. بروتين كهذا لا يقوم بوظيفته، فتشبه النتيجة غياب الجين.", "ru": "Стоп-кодон завершает трансляцию. Если он появляется в начале гена, рибосома освобождается после немногих аминокислот, и короткая цепь не складывается в нужную форму. Такой белок свою работу не выполняет, поэтому результат похож на отсутствие гена.", "en": "A stop codon ends translation. If it appears near the start of the gene, the ribosome is released after only a few amino acids, and the short chain does not fold into the shape required. Such a protein does not do its job, so the result resembles having no gene at all."},null,[{"he": "קודון עצירה מקצר את התרגום, ולכן החלבון אינו מתארך.", "ar": "كودون التوقّف يقصّر الترجمة، فلا يطول البروتين.", "ru": "Стоп-кодон укорачивает трансляцию, поэтому белок не удлиняется.", "en": "A stop codon shortens translation, so the protein does not get longer."}, {"he": "התרגום נעצר ואין חלבון שלם, ולכן השאלה איפה הוא נמצא אינה רלוונטית.", "ar": "الترجمة تتوقّف ولا يوجد بروتين كامل، فسؤال موضعه غير ذي صلة.", "ru": "Трансляция останавливается, целого белка нет, поэтому вопрос, где он, не относится к делу.", "en": "Translation stops and there is no whole protein, so where it sits is beside the point."}, null, {"he": "קודון עצירה אינו מתחיל שרשרת חדשה, אלא מסיים את הקיימת.", "ar": "كودون التوقّف لا يبدأ سلسلة جديدة، بل يُنهي القائمة.", "ru": "Стоп-кодон не начинает новую цепь, а завершает имеющуюся.", "en": "A stop codon does not start a new chain; it ends the existing one."}]),
    Q("gene-3-8",{"he": "לתאים הוסף חומר שחוסם שעתוק בלבד. מה צפוי לייצור החלבונים בשעות שאחרי כן?", "ar": "أُضيفت للخلايا مادة تمنع النسخ فقط. ما المتوقّع لإنتاج البروتينات في الساعات التالية؟", "ru": "В клетки добавили вещество, которое блокирует только транскрипцию. Что ожидается с производством белков в следующие часы?", "en": "A substance that blocks transcription only was added to cells. What is expected of protein production in the hours that follow?"},[{"he": "ייצור החלבונים ייפסק מיד לחלוטין", "ar": "سيتوقّف إنتاج البروتينات فورًا تمامًا", "ru": "Производство белков прекратится сразу и полностью", "en": "Protein production will stop immediately and completely"}, {"he": "הייצור יימשך זמן מה ואז ידעך", "ar": "سيستمرّ الإنتاج فترةً ثم يتلاشى", "ru": "Производство продолжится какое-то время, а затем сойдёт на нет", "en": "Production will carry on for a while and then fade away"}, {"he": "הייצור יגדל, כי התא יפצה על החסימה", "ar": "سيزيد الإنتاج، لأن الخلية ستعوّض عن المنع", "ru": "Производство вырастет, ведь клетка восполнит блокировку", "en": "Production will grow, since the cell compensates for the block"}, {"he": "הייצור לא ישתנה כלל, כי שעתוק אינו נחוץ לו", "ar": "لن يتغيّر الإنتاج أبدًا، لأن النسخ غير لازم له", "ru": "Производство не изменится вовсе, ведь транскрипция ему не нужна", "en": "Production will not change at all, since transcription is not needed for it"}],1,{"he": "שאלו מה כבר נמצא בציטופלסמה ברגע שהחסימה התחילה.", "ar": "اسألوا ما هو موجود أصلًا في السيتوبلازما لحظة بدء المنع.", "ru": "Спросите, что уже находится в цитоплазме в момент начала блокировки.", "en": "Ask what is already in the cytoplasm the moment the block begins."},{"he": "החסימה עוצרת יצירת mRNA חדש, אבל ה-mRNA שכבר יצא מהגרעין ממשיך להיות מתורגם בריבוזומים. מולקולות ה-mRNA מתפרקות בהדרגה, ולכן הייצור דועך ואינו נפסק ברגע. זה מראה שהתרגום והשעתוק הם שני שלבים נפרדים.", "ar": "المنع يوقف تكوين mRNA جديد، لكنّ الـmRNA الذي خرج من النواة يستمرّ في الترجمة في الريبوسومات. تتفكّك جزيئات mRNA تدريجيًّا، فيتلاشى الإنتاج ولا يتوقّف في لحظة. وهذا يبيّن أن الترجمة والنسخ مرحلتان منفصلتان.", "ru": "Блокировка останавливает образование новой иРНК, но та иРНК, что уже вышла из ядра, продолжает переводиться на рибосомах. Молекулы иРНК постепенно распадаются, поэтому производство затухает, а не прекращается мгновенно. Это показывает, что трансляция и транскрипция — два отдельных этапа.", "en": "The block stops new mRNA from being made, but the mRNA that has already left the nucleus goes on being translated on the ribosomes. The mRNA molecules break down gradually, so production fades rather than stopping at once. This shows that translation and transcription are two separate stages."},null,[{"he": "ה-mRNA שכבר קיים אינו נעלם בבת אחת, ולכן אין עצירה מיידית.", "ar": "الـmRNA الموجود أصلًا لا يزول دفعةً واحدة، فلا يوجد توقّف فوري.", "ru": "Уже имеющаяся иРНК не исчезает мгновенно, поэтому мгновенной остановки нет.", "en": "The mRNA already present does not vanish in one go, so there is no instant stop."}, null, {"he": "בלי שעתוק אין mRNA חדש, ולכן התא אינו יכול להגדיל ייצור.", "ar": "بلا نسخ لا يوجد mRNA جديد، فلا تستطيع الخلية زيادة الإنتاج.", "ru": "Без транскрипции новой иРНК нет, поэтому клетка увеличить производство не может.", "en": "Without transcription there is no new mRNA, so the cell cannot raise production."}, {"he": "שעתוק הוא השלב שמספק את ה-mRNA, ולכן הוא הכרחי לייצור מתמשך.", "ar": "النسخ هو المرحلة التي توفّر mRNA، فهو ضروري للإنتاج المستمرّ.", "ru": "Транскрипция — этап, который поставляет иРНК, поэтому она необходима для продолжающегося производства.", "en": "Transcription is the stage that supplies the mRNA, so it is essential for ongoing production."}]),
    Q("gene-3-9",{"he": "mRNA מתא שריר הוחדר לתא עור. התא ייצר את חלבון השריר. מה אפשר להסיק?", "ar": "أُدخل mRNA من خلية عضلة إلى خلية جلد. فأنتجت الخلية بروتين العضلة. ما يمكن استنتاجه؟", "ru": "иРНК из мышечной клетки ввели в клетку кожи. Клетка произвела мышечный белок. Что можно заключить?", "en": "mRNA from a muscle cell was put into a skin cell. The cell made the muscle protein. What can be concluded?"},[{"he": "תא העור הפך לתא שריר", "ar": "تحوّلت خلية الجلد إلى خلية عضلة", "ru": "Клетка кожи превратилась в мышечную", "en": "The skin cell turned into a muscle cell"}, {"he": "ה-DNA של תא העור השתנה בניסוי", "ar": "تغيّر DNA خلية الجلد في التجربة", "ru": "ДНК клетки кожи изменилась в опыте", "en": "The skin cell's DNA was changed in the experiment"}, {"he": "ריבוזומים של תא עור קוראים רק mRNA של עור", "ar": "ريبوسومات خلية الجلد تقرأ mRNA الجلد فقط", "ru": "Рибосомы клетки кожи читают только иРНК кожи", "en": "A skin cell's ribosomes read only skin mRNA"}, {"he": "ה-mRNA נושא את ההוראה, והריבוזום מתרגם כל mRNA שמגיע אליו", "ar": "الـmRNA يحمل التعليمة، والريبوسوم يترجم كل mRNA يصل إليه", "ru": "иРНК несёт указание, и рибосома переводит любую поступившую иРНК", "en": "The mRNA carries the instruction, and the ribosome translates any mRNA that reaches it"}],3,{"he": "שאלו מה בדיוק הוחדר לתא, ומה לא הוחדר.", "ar": "اسألوا ما أُدخل إلى الخلية بالضبط، وما لم يُدخَل.", "ru": "Спросите, что именно ввели в клетку, а что — нет.", "en": "Ask what exactly was put into the cell, and what was not."},{"he": "בניסוי הוחדר mRNA ולא DNA, והחלבון שנוצר היה חלבון השריר. לכן ההוראה הגיעה מה-mRNA, והריבוזום אינו בורר לפי מקור המולקולה. זהו גם הבסיס לחיסוני mRNA, שבהם מוחדר mRNA אחד בלבד.", "ar": "في التجربة أُدخل mRNA لا DNA، والبروتين الناتج كان بروتين العضلة. لذلك جاءت التعليمة من mRNA، والريبوسوم لا يختار حسب مصدر الجزيء. وهذا أيضًا أساس تطعيمات mRNA، التي يُدخَل فيها mRNA واحد فقط.", "ru": "В опыте ввели иРНК, а не ДНК, и полученный белок был мышечным. Значит, указание пришло от иРНК, и рибосома не отбирает по источнику молекулы. На этом же основаны иРНК-вакцины, в которых вводят лишь одну иРНК.", "en": "In the experiment mRNA was introduced, not DNA, and the protein made was the muscle protein. So the instruction came from the mRNA, and the ribosome does not sort by where the molecule came from. This is also the basis of mRNA vaccines, in which a single mRNA is introduced."},null,[{"he": "חלבון אחד אינו הופך תא לסוג אחר, כי לזה דרושים גנים רבים.", "ar": "بروتين واحد لا يحوّل الخلية إلى نوع آخر، فذلك يحتاج جينات كثيرة.", "ru": "Один белок не превращает клетку в другой тип: для этого нужны многие гены.", "en": "One protein does not turn a cell into another type; that would take many genes."}, {"he": "לא הוחדר DNA בניסוי, ולכן אין בסיס לטענה על שינוי ב-DNA.", "ar": "لم يُدخَل DNA في التجربة، فلا أساس لادّعاء تغيّر في DNA.", "ru": "ДНК в опыте не вводили, поэтому утверждать об изменении ДНК нет оснований.", "en": "No DNA was introduced in the experiment, so there is no basis for a claim about DNA change."}, {"he": "הניסוי מראה את ההפך: הריבוזום תרגם mRNA ממקור אחר.", "ar": "التجربة تبيّن العكس: الريبوسوم ترجم mRNA من مصدر آخر.", "ru": "Опыт показывает обратное: рибосома перевела иРНК из другого источника.", "en": "The experiment shows the opposite: the ribosome translated mRNA from another source."}, null]),
 ]
]);

topic("bio-homeo","043381",
  {"he": "הומאוסטזיס ובקרה", "ar": "الاتزان الداخلي والتنظيم", "ru": "Гомеостаз и регуляция", "en": "Homeostasis and regulation"},
  {"he": "איך הגוף שומר על סביבה פנימית יציבה", "ar": "كيف يحافظ الجسم على بيئة داخلية ثابتة", "ru": "Как организм сохраняет стабильную внутреннюю среду", "en": "How the body keeps its internal environment stable"},
[
 [
    Q("homeo-1-1",{"he": "מהו הומאוסטזיס?", "ar": "ما الاتزان الداخلي (الهوميوستاسيس)؟", "ru": "Что такое гомеостаз?", "en": "What is homeostasis?"},[{"he": "שמירה על תנאים פנימיים יציבים בגוף", "ar": "المحافظة على ظروف داخلية ثابتة في الجسم", "ru": "Поддержание стабильных условий внутри организма", "en": "Keeping stable conditions inside the body"}, {"he": "גדילה מהירה של הגוף", "ar": "نمو سريع للجسم", "ru": "Быстрый рост организма", "en": "Fast growth of the body"}, {"he": "העברת תכונות תורשתיות מההורים אל הצאצאים", "ar": "نقل الصفات الوراثية من الوالدين إلى الأبناء", "ru": "Передача наследственных признаков от родителей потомству", "en": "Passing hereditary traits from the parents to the offspring"}, {"he": "יצירת תאים חדשים בלבד", "ar": "تكوين خلايا جديدة فقط", "ru": "Только образование новых клеток", "en": "Only making new cells"}],0,{"he": "חשבו על טמפרטורת הגוף וסוכר בדם שנשארים כמעט קבועים.", "ar": "فكّروا بحرارة الجسم والسكر في الدم اللذين يبقيان ثابتين تقريبًا.", "ru": "Подумайте о температуре тела и сахаре в крови, которые почти постоянны.", "en": "Think of body temperature and blood sugar, which stay almost constant."},{"he": "הגוף מתמודד עם שינויים בסביבה, אבל הערכים הפנימיים שלו, כמו טמפרטורה, רמת הסוכר ומאזן המים, נשארים בטווח צר. זה הומאוסטזיס.", "ar": "يواجه الجسم تغيّرات في البيئة، لكن قيمه الداخلية مثل الحرارة ومستوى السكر وتوازن الماء تبقى ضمن مدى ضيّق. هذا هو الاتزان الداخلي.", "ru": "Организм сталкивается с изменениями среды, но его внутренние показатели — температура, уровень сахара, водный баланс — остаются в узком диапазоне. Это и есть гомеостаз.", "en": "The body faces changes in its environment, but its internal values, such as temperature, sugar level and water balance, stay within a narrow range. That is homeostasis."},null,[null, {"he": "גדילה היא שינוי לאורך זמן, ואילו הומאוסטזיס שומר על יציבות.", "ar": "النموّ تغيّر عبر الزمن، أمّا الاتّزان الداخلي فيحافظ على الثبات.", "ru": "Рост — это изменение со временем, а гомеостаз поддерживает постоянство.", "en": "Growth is change over time, while homeostasis keeps conditions steady."}, {"he": "העברת תכונות לצאצאים היא תורשה, ואינה שמירה על תנאים בגוף.", "ar": "نقل الصفات إلى الأبناء هو الوراثة، وليس حفظ الظروف داخل الجسم.", "ru": "Передача признаков потомству — это наследственность, а не стабильность внутри.", "en": "Passing traits to offspring is heredity, not keeping internal conditions steady."}, {"he": "יצירת תאים חדשים היא חלק מגדילה ומריפוי, ולא ההגדרה של הומאוסטזיס.", "ar": "إنتاج خلايا جديدة جزء من النموّ والشفاء، وليس تعريف الاتّزان الداخلي.", "ru": "Образование новых клеток — часть роста и заживления, а не гомеостаз.", "en": "Making new cells is part of growth and healing, not homeostasis itself."}]),
    Q("homeo-1-2",{"he": "איזה הורמון מוריד את רמת הסוכר בדם?", "ar": "أي هرمون يخفّض مستوى السكر في الدم؟", "ru": "Какой гормон снижает уровень сахара в крови?", "en": "Which hormone lowers the blood sugar level?"},[{"he": "אינסולין", "ar": "الإنسولين", "ru": "Инсулин", "en": "Insulin"}, {"he": "גלוקגון", "ar": "الغلوكاغون", "ru": "Глюкагон", "en": "Glucagon"}, {"he": "אדרנלין (אפינפרין)", "ar": "الأدرينالين (الإبينفرين)", "ru": "Адреналин (эпинефрин)", "en": "Adrenaline (epinephrine)"}, {"he": "אסטרוגן", "ar": "الإستروجين", "ru": "Эстроген", "en": "Estrogen"}],0,{"he": "הוא מופרש מהלבלב אחרי ארוחה.", "ar": "يُفرَز من البنكرياس بعد الوجبة.", "ru": "Он выделяется поджелудочной железой после еды.", "en": "It is released by the pancreas after a meal."},{"he": "אחרי ארוחה רמת הסוכר עולה, והלבלב מפריש אינסולין. האינסולין גורם לתאים לקלוט גלוקוז מהדם, והרמה יורדת. גלוקגון עושה את ההפך ומעלה את רמת הסוכר.", "ar": "بعد الوجبة يرتفع السكر فيفرز البنكرياس الإنسولين. يجعل الإنسولين الخلايا تمتص الغلوكوز من الدم فينخفض المستوى. أما الغلوكاغون فيفعل العكس ويرفع مستوى السكر.", "ru": "После еды уровень сахара растёт, и поджелудочная железа выделяет инсулин. Инсулин заставляет клетки поглощать глюкозу из крови, и уровень снижается. Глюкагон действует наоборот и повышает уровень сахара.", "en": "After a meal the sugar level rises and the pancreas releases insulin. Insulin makes cells take up glucose from the blood, so the level falls. Glucagon does the opposite and raises the sugar level."},null,[null, {"he": "גלוקגון עושה את ההפך: הוא מעלה את רמת הסוכר כשהיא נמוכה.", "ar": "الغلوكاغون يفعل العكس: يرفع مستوى السكّر حين يكون منخفضًا.", "ru": "Глюкагон делает обратное: он повышает уровень сахара, когда тот низкий.", "en": "Glucagon does the opposite: it raises blood sugar when it is low."}, {"he": "אדרנלין מכין את הגוף למאמץ, והוא דווקא מעלה את רמת הסוכר.", "ar": "الأدرينالين يهيّئ الجسم للمجهود، وهو يرفع مستوى السكّر لا يخفضه.", "ru": "Адреналин готовит тело к нагрузке и, наоборот,     Q("homeo-1-3",{"he": "מהו הורמון?", "ar": "ما الهرمون؟", "ru": "Что такое гормон?", "en": "What is a hormone?"},[{"he": "תא עצב שמעביר אות חשמלי", "ar": "خلية عصب تنقل إشارة كهربائية", "ru": "Нервная клетка, передающая электрический сигнал", "en": "A nerve cell that carries an electrical signal"}, {"he": "חומר מזון שהגוף שורף לאנרגיה", "ar": "مادة غذائية يحرقها الجسم للطاقة", "ru": "Питательное вещество, которое тело сжигает для энергии", "en": "A food substance the body burns for energy"}, {"he": "חלבון שמאיץ תגובות כימיות בתא", "ar": "بروتين يسرّع تفاعلات كيميائية في الخلية", "ru": "Белок, ускоряющий химические реакции в клетке", "en": "A protein that speeds up chemical reactions in the cell"}, {"he": "חומר שנושא מסר בדם אל איבר מטרה", "ar": "مادة تحمل رسالة في الدم إلى عضو هدف", "ru": "Вещество, которое несёт сообщение по крови к органу-цели", "en": "A substance that carries a message in the blood to a target organ"}],3,{"he": "חשבו על הודעה שנשלחת מרחוק, ולא על חוט שמחבר.", "ar": "فكّروا برسالة تُرسَل من بعيد، لا بسلك يربط.", "ru": "Подумайте о сообщении, посланном издалека, а не о соединяющем проводе.", "en": "Think of a message sent from a distance, not a wire that connects."},{"he": "הורמון מופרש מבלוטה אל הדם, נע בכל הגוף, ומשפיע רק על תאים שיש להם קולטן מתאים. ההשפעה איטית מזו של העצבים אבל נמשכת זמן רב. למשל, אינסולין מהלבלב משפיע על תאי שריר ושומן.", "ar": "يُفرَز الهرمون من غدّة إلى الدم، ويسري في الجسم كلّه، ويؤثّر فقط على خلايا لها مستقبل ملائم. تأثيره أبطأ من تأثير الأعصاب لكنه يدوم أطول. مثلًا، الإنسولين من البنكرياس يؤثّر على خلايا العضلات والدهن.", "ru": "Гормон выделяется железой в кровь, разносится по всему телу и действует только на клетки с подходящим рецептором. Его действие медленнее нервного, но длится дольше. Например, инсулин из поджелудочной железы действует на мышечные и жировые клетки.", "en": "A hormone is released by a gland into the blood, travels all over the body, and affects only cells that carry a matching receptor. Its effect is slower than a nerve's but lasts much longer. For example, insulin from the pancreas acts on muscle and fat cells."},null,[{"he": "תא עצב מעביר אות דרך סיב, והורמון נע בדם ואינו תא.", "ar": "خلية العصب تنقل الإشارة عبر ليف، والهرمون يسري في الدم وليس خلية.", "ru": "Нервная клетка передаёт сигнал по волокну, а гормон идёт по крови и клеткой не является.", "en": "A nerve cell carries a signal along a fibre; a hormone travels in the blood and is not a cell."}, {"he": "חומר מזון מספק אנרגיה, והורמון מעביר מסר ואינו נשרף.", "ar": "المادة الغذائية توفّر طاقة، والهرمون ينقل رسالة ولا يُحرَق.", "ru": "Питательное вещество даёт энергию, а гормон несёт сообщение и не сжигается.", "en": "A food substance supplies energy; a hormone carries a message and is not burned."}, {"he": "זרז התגובות בתא הוא אנזים, והוא פועל במקום שבו נוצר.", "ar": "محفّز التفاعلات في الخلية هو الإنزيم، ويعمل في المكان الذي نشأ فيه.", "ru": "Ускоритель реакций в клетке — фермент, и он действует там, где возник.", "en": "The accelerator of reactions in the cell is an enzyme, and it works where it was made."}, null]),
    Q("homeo-1-4",{"he": "מהי טמפרטורת הגוף התקינה של אדם בריא?", "ar": "ما حرارة الجسم الطبيعية لشخص سليم؟", "ru": "Какова нормальная температура тела здорового человека?", "en": "What is the normal body temperature of a healthy person?"},[{"he": "כ-30 מעלות צלזיוס", "ar": "نحو 30 درجة مئوية", "ru": "Около 30 градусов Цельсия", "en": "About 30 degrees Celsius"}, {"he": "כ-37 מעלות צלזיוס", "ar": "نحو 37 درجة مئوية", "ru": "Около 37 градусов Цельсия", "en": "About 37 degrees Celsius"}, {"he": "כ-42 מעלות צלזיוס", "ar": "نحو 42 درجة مئوية", "ru": "Около 42 градусов Цельсия", "en": "About 42 degrees Celsius"}, {"he": "היא משתנה עם טמפרטורת האוויר", "ar": "تتغيّر مع حرارة الهواء", "ru": "Она меняется вместе с температурой воздуха", "en": "It changes with the air temperature"}],1,{"he": "נזכרו במה שמדחום מראה כשאין חום.", "ar": "تذكّروا ما يُظهره مقياس الحرارة عند عدم وجود حمّى.", "ru": "Вспомните, что показывает термометр, когда жара нет.", "en": "Recall what a thermometer shows when there is no fever."},{"he": "גוף האדם נשמר סביב 37 מעלות, בקור ובחום. סטייה של שתי מעלות מעלה היא חום, וסטייה גדולה מטה מסכנת חיים. היציבות הזאת היא דוגמה מרכזית להומאוסטזיס.", "ar": "يُحافَظ على جسم الإنسان قرب 37 درجة، في البرد وفي الحرّ. انحراف درجتين إلى الأعلى هو حمّى، وانحراف كبير إلى الأسفل يهدّد الحياة. هذا الثبات مثال مركزي على الاتزان الداخلي.", "ru": "Тело человека держится около 37 градусов и в холод, и в жару. Отклонение на два градуса вверх — это жар, а большое отклонение вниз опасно для жизни. Такая устойчивость — ключевой пример гомеостаза.", "en": "The human body is held near 37 degrees, in cold and in heat alike. A two-degree rise is a fever, and a large drop is life-threatening. This stability is a central example of homeostasis."},null,[{"he": "30 מעלות הן תת-חום מסוכן, והגוף מגיע לשם רק בפגיעה חמורה.", "ar": "30 درجة هبوط حرارة خطير، ولا يصل الجسم إليه إلا بإصابة شديدة.", "ru": "30 градусов — опасное переохлаждение, тело доходит до него только при тяжёлом поражении.", "en": "30 degrees is dangerous hypothermia; the body reaches it only in severe harm."}, null, {"he": "42 מעלות הן חום גבוה מאוד שמסכן חלבונים בגוף.", "ar": "42 درجة حمّى عالية جدًّا تهدّد بروتينات الجسم.", "ru": "42 градуса — очень высокая температура, угрожающая белкам тела.", "en": "42 degrees is a very high fever that puts the body's proteins at risk."}, {"he": "באדם הטמפרטורה נשמרת קבועה, וזה בדיוק מה שהומאוסטזיס עושה.", "ar": "عند الإنسان تبقى الحرارة ثابتة، وهذا بالضبط ما يفعله الاتزان الداخلي.", "ru": "У человека температура держится постоянной, и это как раз то, что делает гомеостаз.", "en": "In a human the temperature is held steady, and that is exactly what homeostasis does."}]),
    Q("homeo-1-5",{"he": "מה עושה אדרנלין בגוף בזמן פחד או מאמץ?", "ar": "ماذا يفعل الأدرينالين في الجسم عند الخوف أو المجهود؟", "ru": "Что делает адреналин в теле при страхе или нагрузке?", "en": "What does adrenaline do in the body during fear or effort?"},[{"he": "מאיץ את הלב ומעלה את הסוכר בדם", "ar": "يسرّع القلب ويرفع السكّر في الدم", "ru": "Ускоряет сердце и повышает сахар в крови", "en": "It speeds the heart up and raises the blood sugar"}, {"he": "מאט את הלב ומרגיע את הנשימה", "ar": "يُبطئ القلب ويهدّئ التنفّس", "ru": "Замедляет сердце и успокаивает дыхание", "en": "It slows the heart down and calms the breathing"}, {"he": "מוריד את הסוכר בדם במקום אינסולין", "ar": "يخفّض السكّر في الدم بدل الإنسولين", "ru": "Снижает сахар в крови вместо инсулина", "en": "It lowers the blood sugar instead of insulin"}, {"he": "מעכל חלבונים בקיבה", "ar": "يهضم البروتينات في المعدة", "ru": "Переваривает белки в желудке", "en": "It digests proteins in the stomach"}],0,{"he": "חשבו מה הגוף צריך כדי לרוץ מהר בשנייה אחת.", "ar": "فكّروا بما يحتاجه الجسم ليركض بسرعة في ثانية واحدة.", "ru": "Подумайте, что телу нужно, чтобы побежать быстро через секунду.", "en": "Think what the body needs in order to run fast within a second."},{"he": "אדרנלין מופרש מבלוטת יותרת הכליה ומכין את הגוף לפעולה. הלב פועם מהר יותר, הנשימה מתגברת, וגלוקוז משתחרר מהכבד אל הדם. כך השרירים מקבלים חמצן וסוכר במהירות.", "ar": "يُفرَز الأدرينالين من الغدّة الكُظرية ويهيّئ الجسم للعمل. ينبض القلب أسرع، ويزداد التنفّس، ويتحرّر الغلوكوز من الكبد إلى الدم. هكذا تحصل العضلات على الأكسجين والسكّر بسرعة.", "ru": "Адреналин выделяется надпочечниками и готовит тело к действию. Сердце бьётся быстрее, дыхание усиливается, а глюкоза выходит из печени в кровь. Так мышцы быстро получают кислород и сахар.", "en": "Adrenaline is released by the adrenal gland and prepares the body for action. The heart beats faster, breathing deepens, and glucose is released from the liver into the blood. The muscles get oxygen and sugar quickly."},null,[null, {"he": "הרגעה היא ההפך ממה שאדרנלין עושה, והוא מאיץ ולא מאט.", "ar": "التهدئة عكس ما يفعله الأدرينالين، فهو يسرّع لا يُبطئ.", "ru": "Успокоение — противоположность действию адреналина: он ускоряет, а не замедляет.", "en": "Calming is the opposite of what adrenaline does; it speeds up, not slows down."}, {"he": "ההורמון שמוריד סוכר הוא אינסולין, ואדרנלין דווקא מעלה אותו.", "ar": "الهرمون الذي يخفّض السكّر هو الإنسولين، والأدرينالين يرفعه.", "ru": "Снижает сахар инсулин, а адреналин его как раз повышает.", "en": "The hormone that lowers sugar is insulin; adrenaline actually raises it."}, {"he": "עיכול חלבונים נעשה באנזימים בקיבה, ולא בהורמון הזה.", "ar": "هضم البروتينات يحدث بإنزيمات في المعدة، لا بهذا الهرمون.", "ru": "Белки переваривают ферменты в желудке, а не этот гормон.", "en": "Proteins are digested by enzymes in the stomach, not by this hormone."}]),
    Q("homeo-1-6",{"he": "באיזו דרך מגיע הורמון מהבלוטה שהפרישה אותו אל איבר המטרה?", "ar": "بأي طريق يصل الهرمون من الغدّة التي أفرزته إلى عضو الهدف؟", "ru": "Каким путём гормон попадает от выделившей его железы к органу-цели?", "en": "By what route does a hormone travel from the gland that released it to the target organ?"},[{"he": "דרך סיבי העצבים", "ar": "عبر ألياف الأعصاب", "ru": "По нервным волокнам", "en": "Along the nerve fibres"}, {"he": "דרך צינורות מערכת העיכול", "ar": "عبر أنابيب الجهاز الهضمي", "ru": "По трубкам системы пищеварения", "en": "Through the tubes of the digestive system"}, {"he": "דרך מחזור הדם", "ar": "عبر الدورة الدموية", "ru": "По кровеносной системе", "en": "Through the bloodstream"}, {"he": "דרך נוזל הנשימה בריאות", "ar": "عبر سائل التنفّس في الرئتين", "ru": "По дыхательной жидкости в лёгких", "en": "Through the breathing fluid in the lungs"}],2,{"he": "חשבו מה מגיע כמעט לכל תא בגוף בתוך דקה.", "ar": "فكّروا بما يصل إلى كل خلية في الجسم تقريبًا في دقيقة.", "ru": "Подумайте, что за минуту доходит почти до каждой клетки тела.", "en": "Think what reaches nearly every cell in the body within a minute."},{"he": "בלוטות ההפרשה הפנימית מפרישות ישר אל הדם, ולכן ההורמון מגיע לכל הגוף. רק תאים שיש להם קולטן מתאים מגיבים, ושאר התאים אינם מושפעים. כך הורמון אחד יכול לשלוט באיבר מרוחק.", "ar": "غدد الإفراز الداخلي تُفرز مباشرةً إلى الدم، فيصل الهرمون إلى الجسم كلّه. وتستجيب فقط الخلايا التي لها مستقبل ملائم، وبقيّة الخلايا لا تتأثّر. هكذا يستطيع هرمون واحد التحكّم بعضو بعيد.", "ru": "Железы внутренней секреции выделяют прямо в кровь, поэтому гормон доходит до всего тела. Отвечают только клетки с подходящим рецептором, остальные не затрагиваются. Так один гормон может управлять далёким органом.", "en": "Endocrine glands release straight into the blood, so the hormone reaches the whole body. Only cells with a matching receptor respond, and the rest are unaffected. In this way one hormone can control a distant organ."},null,[{"he": "העצבים מעבירים אותות חשמליים, ואינם נושאים הורמונים.", "ar": "الأعصاب تنقل إشارات كهربائية، ولا تحمل هرمونات.", "ru": "Нервы передают электрические сигналы и гормонов не переносят.", "en": "Nerves carry electrical signals and do not transport hormones."}, {"he": "מערכת העיכול מעבירה מזון, והורמון אינו עובר בה אל איבר מטרה.", "ar": "الجهاز الهضمي ينقل الغذاء، والهرمون لا يعبر فيه إلى عضو هدف.", "ru": "Система пищеварения перемещает пищу, и гормон по ней к органу-цели не идёт.", "en": "The digestive system moves food; a hormone does not travel through it to a target organ."}, null, {"he": "הריאות מחליפות גזים, ואין בהן נוזל שמוביל הורמונים בגוף.", "ar": "الرئتان تبادلان الغازات، ولا سائل فيهما ينقل الهرمونات في الجسم.", "ru": "Лёгкие обменивают газы, и жидкости, разносящей гормоны по телу, в них нет.", "en": "The lungs exchange gases; they hold no fluid that carries hormones around the body."}]),
    Q("homeo-1-7",{"he": "איזו פסולת מפירוק חלבונים מסולקת בשתן?", "ar": "أي نفاية من تفكيك البروتينات تُطرَح في البول؟", "ru": "Какой продукт распада белков выводится с мочой?", "en": "Which waste product from protein breakdown is removed in the urine?"},[{"he": "פחמן דו-חמצני", "ar": "ثاني أكسيد الكربون", "ru": "Углекислый газ", "en": "Carbon dioxide"}, {"he": "שתנן (אוריאה)", "ar": "اليوريا (البولة)", "ru": "Мочевина", "en": "Urea"}, {"he": "גלוקוז", "ar": "الغلوكوز", "ru": "Глюкоза", "en": "Glucose"}, {"he": "חומצות אמינו", "ar": "الأحماض الأمينية", "ru": "Аминокислоты", "en": "Amino acids"}],1,{"he": "חשבו על חומר שיש בו חנקן, כמו בחלבון עצמו.", "ar": "فكّروا بمادة فيها نيتروجين، كما في البروتين نفسه.", "ru": "Подумайте о веществе с азотом, как в самом белке.", "en": "Think of a substance that contains nitrogen, as the protein itself does."},{"he": "בפירוק חומצות אמינו משתחרר חנקן, והכבד הופך אותו לשתנן. השתנן נע בדם אל הכליות, והן מסלקות אותו בשתן. פחמן דו-חמצני, לעומת זאת, יוצא דרך הריאות.", "ar": "في تفكيك الأحماض الأمينية يتحرّر النيتروجين، ويحوّله الكبد إلى يوريا. تسري اليوريا في الدم إلى الكليتين، وهما تطرحانها في البول. أما ثاني أكسيد الكربون فيخرج عبر الرئتين.", "ru": "При распаде аминокислот освобождается азот, и печень превращает его в мочевину. Мочевина по крови идёт в почки, и они выводят её с мочой. Углекислый газ, напротив, выходит через лёгкие.", "en": "When amino acids are broken down, nitrogen is released, and the liver turns it into urea. The urea travels in the blood to the kidneys, which remove it in the urine. Carbon dioxide, by contrast, leaves through the lungs."},null,[{"he": "פחמן דו-חמצני הוא תוצר נשימה תאית, והוא יוצא דרך הריאות.", "ar": "ثاني أكسيد الكربون ناتج التنفّس الخلوي، ويخرج عبر الرئتين.", "ru": "Углекислый газ — продукт клеточного дыхания и выходит через лёгкие.", "en": "Carbon dioxide is a product of cellular respiration and leaves through the lungs."}, null, {"he": "גלוקוז הוא מזון חשוב, והכליות דווקא מחזירות אותו לדם.", "ar": "الغلوكوز غذاء مهمّ، والكليتان تُعيدانه إلى الدم.", "ru": "Глюкоза — важная пища, и почки как раз возвращают её в кровь.", "en": "Glucose is important food, and the kidneys actually return it to the blood."}, {"he": "חומצות אמינו משמשות לבניית חלבונים, והגוף אינו מוציא אותן בשתן.", "ar": "الأحماض الأمينية تُستخدم لبناء البروتينات، ولا يطرحها الجسم في البول.", "ru": "Аминокислоты идут на построение белков, и с мочой тело их не выводит.", "en": "Amino acids are used to build proteins, and the body does not pass them out in the urine."}]),
