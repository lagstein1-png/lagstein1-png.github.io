<style>
/* ============================================================
   ביולוגיה — ביולוגיה לבגרות
   קהל היעד לא "לא יודע ביולוגיה". הוא נכשל בה שוב ושוב, מפני
   שהמקצוע כולו טקסט ומושגים — ולכן כל החלטה כאן נמדדת בשאלה
   אחת: האם היא מורידה עומס, או מוסיפה.
   · כל שאלה נושאת רמז שאינו התשובה, והסבר שנפתח גם כשצדקו.
   · שום טקסט לא מוצג בלי שאפשר לשמוע אותו.
   · שפת האם אינה קישוט: מושג באזרחות נלמד קודם בשפה שחושבים בה.
   כל המידות ב-rem, כדי שהגדלת טקסט תגדיל את הכול יחד.
   ============================================================ */
:root{
  --font:"Heebo","Rubik",system-ui,"Segoe UI",Arial,sans-serif;
  --en:"Lexend","Heebo",system-ui,"Segoe UI",Arial,sans-serif;
  --ar:"Noto Sans Arabic",system-ui,"Segoe UI",Arial,sans-serif;
  --ru:"Noto Sans","Heebo",system-ui,"Segoe UI",Arial,sans-serif;   /* קירילית — Heebo אינו מכיל אותה */
  --bg:#f5f7fb; --surface:#ffffff; --surface2:#e8ecf6;
  --ink:#101828; --muted:#55607a; --faint:#6f7a95; --line:#dde3f0;
  --accent:#1d4ed8; --accent-ink:#ffffff; --accent-soft:#dbe4fe;
  --gold:#a16207; --gold-soft:#fbf0d5; --hit:#f5c451; --hit-ink:#1a1300;
  --ok:#15803d; --ok-soft:#dcfce7; --bad:#be123c; --bad-soft:#ffe4e9;
  --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px -12px rgba(16,24,40,.2);
  --r:14px;
  /* צבע לכל מסלול. לא קישוט: ארבעה סוגי לימוד שונים לגמרי, וצבע
     קבוע לכל אחד חוסך למי שמתקשה להתמצא את השאלה "איפה אני". */
  --c-sound:#0369a1; --cs-sound:#dbeefc;   /* צליל ואות   */
  --c-words:#15803d; --cs-words:#dcfce7;   /* מילים       */
  --c-talk:#b43a0a;  --cs-talk:#fde5d8;    /* מדוברת — #c2410c היה 4.28:1 על ה-cs (30.9) */
  --c-read:#6d28d9;  --cs-read:#eae2fd;    /* ספרותית     */
}
:root[data-theme="dark"]{
  --bg:#0e1425; --surface:#17203a; --surface2:#202c4d;
  --ink:#e8edf8; --muted:#9aa5c0; --faint:#78829e; --line:#2a3762;
  --accent:#93c5fd; --accent-ink:#0e1425; --accent-soft:#1b2a5c;
  --gold:#fbbf24; --gold-soft:#33270f; --hit:#ffd24d; --hit-ink:#241a00;
  --ok:#4ade80; --ok-soft:#132a1c; --bad:#fb7185; --bad-soft:#33161f;
  --warn:#fbbf24; --warn-soft:#33260f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  --c-sound:#7dd3fc; --cs-sound:#0b2a3d;
  --c-words:#86efac; --cs-words:#0f2a1a;
  --c-talk:#fdba74;  --cs-talk:#3a2113;
  --c-read:#c4b5fd;  --cs-read:#261a45;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1425; --surface:#17203a; --surface2:#202c4d;
    --ink:#e8edf8; --muted:#9aa5c0; --faint:#78829e; --line:#2a3762;
    --accent:#93c5fd; --accent-ink:#0e1425; --accent-soft:#1b2a5c;
    --gold:#fbbf24; --gold-soft:#33270f; --hit:#ffd24d; --hit-ink:#241a00;
    --ok:#4ade80; --ok-soft:#132a1c; --bad:#fb7185; --bad-soft:#33161f;
    --warn:#fbbf24; --warn-soft:#33260f;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
    --c-sound:#7dd3fc; --cs-sound:#0b2a3d;
    --c-words:#86efac; --cs-words:#0f2a1a;
    --c-talk:#fdba74;  --cs-talk:#3a2113;
    --c-read:#c4b5fd;  --cs-read:#261a45;
  }
}
/* ניגודיות גבוהה — שחור על לבן, מסגרות מלאות, בלי גוונים רכים */
:root.hc{
  --bg:#ffffff; --surface:#ffffff; --surface2:#ffffff;
  --ink:#000000; --muted:#1a1a1a; --faint:#333333; --line:#000000;
  --accent:#00434b; --accent-ink:#ffffff; --accent-soft:#e6f2f3;
  --gold:#5c3d00; --gold-soft:#f7efdf; --hit:#ffe600; --hit-ink:#000000;
  --ok:#0a5c2a; --ok-soft:#e6f4ea; --bad:#8c0f2c; --bad-soft:#fbe9ed;
  --warn:#6b3d00; --warn-soft:#f7efdf; --shadow:none;
  --c-sound:#00305c; --cs-sound:#e8eef7;
  --c-words:#0a5c2a; --cs-words:#e6f4ea;
  --c-talk:#7a2c00;  --cs-talk:#f9ece4;
  --c-read:#3d1a75;  --cs-read:#eee8f9;
}
:root.hc *{box-shadow:none!important}
:root.hc .card,:root.hc .btn,:root.hc .opt{border-width:2px!important}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs,17px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  font-size:1rem;line-height:1.65;-webkit-text-size-adjust:100%}
:root.clear body{font-family:"Verdana","Tahoma","Heebo",sans-serif;letter-spacing:.012em}
:root.spaced body{word-spacing:.22em;line-height:1.95}
:root.rm *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
h1,h2,h3{margin:0;line-height:1.3;font-weight:800}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}
/* כרטיס ״מבנה הבגרות״ (--gold-soft): הקישור לאתר משרד החינוך בלי צבע נפל לכחול ברירת המחדל — 1.55:1 בכהה (30.9) */
.gcard a{color:var(--accent)}
.skip{position:absolute;inset-inline-start:-9999px}
.skip:focus{position:static;display:inline-flex;align-items:center;min-height:44px;
  margin:8px;padding:8px 14px;background:#0b7c71;color:#fff;
  border-radius:8px;font-weight:700;text-decoration:none;z-index:100}

/* כל טקסט אנגלי — כיוון, גופן ומרווח משלו. unicode-bidi:isolate מונע
   מהמשפט האנגלי לגרור אחריו את סימני הפיסוק של המשפט העברי. */
.en{font-family:var(--en);direction:ltr;unicode-bidi:isolate;text-align:start}
.en-b{font-family:var(--en);direction:ltr;unicode-bidi:isolate;display:inline-block}

.wrap{max-width:56rem;margin:0 auto;padding:0 clamp(.9rem,3vw,1.5rem)}
.hbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-block:.6rem}
:root.hc .hbar{background:var(--bg);backdrop-filter:none}
.hrow{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
.brand{font-size:1.35rem;font-weight:800;letter-spacing:-.01em;display:flex;
  align-items:baseline;gap:.5rem;margin-inline-end:auto}
.brand small{font-size:.72rem;font-weight:600;color:var(--muted);letter-spacing:.06em}
.gbtn{display:inline-flex;align-items:center;gap:.4rem;background:var(--surface);
  border:1px solid var(--line);border-radius:999px;padding:.42rem .8rem;cursor:pointer;
  font-size:.86rem;font-weight:600;box-shadow:var(--shadow);min-height:44px}
.gbtn:hover{border-color:var(--accent)}
.gbtn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:1.1rem}
.grid{display:grid;gap:.85rem}
@media(min-width:640px){.g2{grid-template-columns:1fr 1fr}}
@media(min-width:900px){.g3{grid-template-columns:repeat(3,1fr)}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;
  border:1px solid var(--line);background:var(--surface);border-radius:12px;
  padding:.72rem 1.1rem;font-weight:700;cursor:pointer;box-shadow:var(--shadow);
  min-height:2.9rem;font-size:1rem}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;box-shadow:none}
.btn[disabled]{opacity:.45;cursor:default}
.btn.wide{width:100%}

.chip{display:inline-flex;align-items:center;gap:.35rem;border-radius:999px;
  padding:.22rem .6rem;font-size:.78rem;font-weight:700;background:var(--surface2);color:var(--muted)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}

/* גופני שפה: Heebo אינו מכיל ערבית וקירילית, ולכן שפת הממשק
   מחליפה גופן ולא רק כיוון. */
html[lang="ar"] body,html[lang="ar"] input,html[lang="ar"] button,
html[lang="ar"] textarea,html[lang="ar"] select{font-family:var(--ar)}
html[lang="ru"] body,html[lang="ru"] input,html[lang="ru"] button,
html[lang="ru"] textarea,html[lang="ru"] select{font-family:var(--ru)}
button[data-a="lang"][lang="ar"]{font-family:var(--ar)}
button[data-a="lang"][lang="ru"]{font-family:var(--ru)}

/* ===== מסלולים: הצבע נכנס ככרטיס, לא כרקע של טקסט ===== */
.trk{--c:var(--accent);--cs:var(--accent-soft)}
.t-sound{--c:var(--c-sound);--cs:var(--cs-sound)}
.t-words{--c:var(--c-words);--cs:var(--cs-words)}
.t-talk{--c:var(--c-talk); --cs:var(--cs-talk)}
.t-read{--c:var(--c-read); --cs:var(--cs-read)}
.tcard{border-inline-start:5px solid var(--c);cursor:pointer;text-align:start;width:100%;
  display:flex;flex-direction:column;gap:.4rem;align-items:stretch}
.tcard:hover{border-color:var(--c)}
.tcard h3{font-size:1.05rem}
.tcard .sub{font-size:.85rem;color:var(--muted)}
.tdot{width:.62rem;height:.62rem;border-radius:50%;background:var(--c);flex:none}
.thead{display:flex;align-items:center;gap:.5rem}
.tpill{background:var(--cs);color:var(--c);border-radius:999px;padding:.15rem .55rem;
  font-size:.72rem;font-weight:800}

/* ===== סרגל שליטה ברמות ===== */
.lvls{display:flex;gap:.4rem;flex-wrap:wrap}
.lvl{border:1px solid var(--line);background:var(--surface);border-radius:10px;
  padding:.4rem .7rem;font-size:.82rem;font-weight:700;cursor:pointer;
  display:inline-flex;align-items:center;gap:.4rem}
.lvl.on{background:var(--c,var(--accent));color:var(--accent-ink);border-color:var(--c,var(--accent))}
.bar{height:.42rem;border-radius:999px;background:var(--surface2);overflow:hidden;flex:1;min-width:3rem}
.bar i{display:block;height:100%;background:var(--c,var(--accent))}
.bar.b0 i{background:var(--bad)} .bar.b1 i{background:var(--warn)} .bar.b2 i{background:var(--ok)}

/* ===== תרגול ===== */
.qcard{border-top:5px solid var(--c,var(--accent))}
.qtop{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.7rem}
.qtext{font-size:1.12rem;font-weight:600;margin:.2rem 0 .3rem}
.qhint{color:var(--muted);font-size:.9rem}
/* המילה או המשפט שנלמדים. גדול, מרווח, ותמיד לצד כפתור השמעה. */
.subject{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;
  background:var(--surface2);border-radius:12px;padding:.85rem 1rem;margin:.5rem 0}
.subject .word{font-family:var(--en);direction:ltr;unicode-bidi:isolate;
  font-size:1.7rem;font-weight:700;letter-spacing:.01em;line-height:1.25}
.subject .ipa{font-family:var(--en);direction:ltr;unicode-bidi:isolate;
  color:var(--muted);font-size:.95rem}
.spk{border:1px solid var(--line);background:var(--surface);border-radius:999px;
  width:2.7rem;height:2.7rem;display:inline-flex;align-items:center;justify-content:center;
  cursor:pointer;flex:none;box-shadow:var(--shadow)}
.spk:hover{border-color:var(--accent);color:var(--accent)}
.spk.sm{width:2.1rem;height:2.1rem;background:#0b7c71;border-color:#0b7c71;color:#fff}
/* הרמקול הקטן — אותו ירוק של כפתור ההקראה הגדול, התקן המשותף */
.spk.sm:hover{background:#0b7c71;border-color:#0b7c71;color:#fff}
.spk.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.opts{display:grid;gap:.6rem;margin-top:.9rem}
.orow{display:flex;gap:.45rem;align-items:center;min-width:0}
/* min-width:0 — פריט grid נולד עם min-width:auto, ולכן משפט ארוך
   באפשרות היה מרחיב את השורה מעבר למכל ודוחף את הרמקול מחוץ למסך. */
.orow .opt{flex:1;min-width:0}
@media(min-width:560px){.opts.two{grid-template-columns:1fr 1fr}}
.opt{display:flex;align-items:center;gap:.6rem;text-align:start;width:100%;
  border:2px solid var(--line);background:var(--surface);border-radius:12px;
  padding:.8rem .9rem;cursor:pointer;font-size:1.02rem;font-weight:600;min-height:3.1rem}
.opt:hover{border-color:var(--accent)}
.opt .k{width:1.9rem;height:1.9rem;border-radius:8px;background:var(--surface2);
  display:inline-flex;align-items:center;justify-content:center;font-size:.85rem;
  font-weight:800;color:var(--muted);flex:none}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .k{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .k{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.55}
/* בחירה במבחן היא בחירה, לא תשובה נכונה. במסכי התרגול הצבע
   הירוק אומר "צדקת", ובמבחן אסור לו להופיע כלל — הוא נותן
   משוב שגוי לכל בחירה. ניטרלי, ורק מסמן מה סומן. */
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);margin-inline-start:3px}
.dot.ok{background:var(--ok);border-color:var(--ok)}
.dot.no{background:var(--bad);border-color:var(--bad)}
.dot.flag{box-shadow:0 0 0 2px var(--accent)}

/* אריחי בניית משפט. הסדר הוא התרגיל, ולכן האריח חייב להיראות כמשהו
   שאפשר להרים — מסגרת מלאה ורקע משלו, לא טקסט על רקע הכרטיס. */
.tiles{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:.7rem}
.tile{font-family:var(--en);direction:ltr;border:2px solid var(--line);
  background:var(--surface);border-radius:10px;padding:.5rem .8rem;font-weight:600;
  cursor:pointer;font-size:1.02rem;min-height:2.7rem}
.tile:hover{border-color:var(--accent)}
.slot{min-height:3.2rem;border:2px dashed var(--line);border-radius:12px;
  background:var(--surface2);padding:.5rem;display:flex;flex-wrap:wrap;gap:.45rem;
  align-items:center;direction:ltr}
.slot.ok{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.slot.bad{border-style:solid;border-color:var(--bad);background:var(--bad-soft)}
.slot .tile{background:var(--surface)}

/* ===== משוב ===== */
.fb{margin-top:.9rem;border-radius:12px;padding:.85rem 1rem;border:1px solid transparent}
.fb.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.fb.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.fb b{display:block;font-size:1.02rem;margin-bottom:.2rem}
.fb .body{color:var(--ink);font-weight:500;font-size:.95rem}
.why{margin-top:.55rem;padding-top:.55rem;border-top:1px dashed currentColor;color:var(--ink);
  font-weight:500;font-size:.93rem}

/* ===== קטע קריאה ===== */
/* איור בתוך כרטיס שאלה. הצבע יורש מ-color, ולכן אותו SVG נראה
   נכון גם בערכה הבהירה וגם בכהה בלי גרסה שנייה. */
.figure{margin:.7rem 0;padding:.6rem;border:1px solid var(--line);border-radius:12px;
  background:var(--surface2);color:var(--ink);overflow-x:auto}
.figure svg{display:block;max-width:100%}
/* המבחן המדומה: השאלות זו אחר זו, כמו חוברת בחינה. */
.simq{border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;margin:.8rem 0;
  background:var(--surface)}
.simq.miss{border-color:var(--warn)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.simn{font-weight:800;color:var(--muted);font-size:.86rem}
.simbar{position:sticky;top:0;z-index:5;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:.6rem .8rem;margin:.8rem 0;display:flex;gap:.6rem;
  align-items:center;flex-wrap:wrap;box-shadow:var(--shadow)}
.clock{font-weight:800;font-variant-numeric:tabular-nums;font-size:1.1rem}
.clock.low{color:var(--bad)}
.passage{background:var(--surface2);border-radius:12px;padding:1rem 1.1rem;margin:.6rem 0;
  font-family:var(--en);direction:ltr;unicode-bidi:isolate;font-size:1.08rem;line-height:2}
.passage .s{border-radius:5px;padding:.05em .12em;cursor:pointer}
.passage .s:hover{background:var(--accent-soft)}
.passage .s.now{background:var(--accent-soft);box-shadow:0 2px 0 var(--accent)}
.wd{border-radius:5px;padding:1px 3px}
.wd.hit{background:var(--hit);color:var(--hit-ink);font-weight:600}
/* כשמנוע הדיבור אינו מדווח על גבולות מילים — קורה הרבה בעברית
   באנדרואיד — אין מה להדגיש מילה־מילה, ואז מודגש כל האיבר. הכלל
   שקיים כאן מכוון למשפט בתוך קטע קריאה בלבד, ולכן ההדגשה החלופית
   על איבר אחר לא נראתה כלל. */
.wd.now,p.now,div.now,span.now,b.now{background:var(--hit);color:var(--hit-ink);
  border-radius:8px;box-shadow:0 0 0 4px var(--hit)}
.gloss{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.5rem}
.gword{border:1px solid var(--line);background:var(--surface);border-radius:999px;
  padding:.25rem .6rem;font-size:.85rem;cursor:pointer}
.gword b{font-family:var(--en);direction:ltr;unicode-bidi:isolate}

/* ===== סרגל מצב הקול ===== */
.vstrip{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;border-radius:10px;
  padding:.45rem .7rem;font-size:.85rem;font-weight:600;margin-bottom:.7rem}
.vstrip.ok{background:var(--ok-soft);color:var(--ok)}
.vstrip.warn{background:var(--warn-soft);color:var(--warn)}
.vstrip.bad{background:var(--bad-soft);color:var(--bad)}
.vstrip .btn{padding:.3rem .7rem;min-height:44px;font-size:.82rem}  /* 2.1rem היו 36 פיקסלים — מתחת ליעד המגע */

/* ===== הגדרות ===== */
.row{display:flex;align-items:center;justify-content:space-between;gap:.8rem;
  padding:.7rem 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row:last-child{border-bottom:0}
.row .lab{font-weight:700}
.row .desc{font-size:.85rem;color:var(--muted);font-weight:500}
.sw{width:3.2rem;height:1.8rem;border-radius:999px;background:var(--surface2);
  border:1px solid var(--line);position:relative;cursor:pointer;flex:none}
.sw i{position:absolute;top:.18rem;inset-inline-start:.2rem;width:1.3rem;height:1.3rem;
  border-radius:50%;background:var(--faint);transition:.15s}
.sw.on{background:var(--accent);border-color:var(--accent)}
.sw.on i{inset-inline-start:1.5rem;background:#fff}
.vgrid{display:grid;gap:.5rem;grid-template-columns:1fr}
@media(min-width:560px){.vgrid{grid-template-columns:1fr 1fr}}
.vopt{display:flex;align-items:center;gap:.6rem;border:2px solid var(--line);
  background:var(--surface);border-radius:12px;padding:.6rem .75rem;cursor:pointer;text-align:start}
.vopt.on{border-color:var(--accent);background:var(--accent-soft)}
.vopt .nm{font-weight:700}
.vopt .ds{font-size:.8rem;color:var(--muted)}
input[type=password],input[type=text]{font:inherit;background:var(--surface);color:var(--ink);
  border:1px solid var(--line);border-radius:10px;padding:.6rem .7rem;min-width:0;flex:1;
  direction:ltr;text-align:left}
input[type=range]{width:100%;accent-color:var(--accent)}

.fbar{border-top:1px solid var(--line);margin-top:2rem;padding-block:1rem;
  color:var(--muted);font-size:.82rem}   /* --faint יצא 2.96:1 */
.hidden{display:none!important}

/* ---------- שדה קלט של המבחן ----------
   מודול המבחן הועתק לכאן מאפליקציה שבה .field כבר היה מוגדר.
   בלי הכלל הזה שדה השם של הנבחן נשאר תיבת ברירת המחדל של
   הדפדפן — 21 פיקסלים גובה, הרבה מתחת ליעד המגע של 44. */
.field{width:100%;box-sizing:border-box;font:inherit;font-size:1rem;
  min-height:48px;padding:12px 14px;border-radius:11px;outline:none;background:var(--surface2);color:inherit;border:1px solid var(--line)}
.field:focus{border-color:var(--accent)}
/* `:focus-visible` הגלובלי (שורה 118) נושא בדיוק את אותה סגוליות כמו `.field`,
   ו-`.field` כתוב אחריו — ולכן ה-`outline:none` שלו ניצח וטבעת המיקוד נעלמה
   משדה השם של הנבחן. מחזירים אותה כאן ולא מוחקים את `outline:none`, כדי
   שהטבעת תופיע במקלדת בלבד, כמו בכל שאר האפליקציה. */
.field:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
textarea.field{min-height:96px;resize:vertical}

/* ---------- שורות המבחן ----------
   .tog הגיע ממודול המבחן שהועתק לכאן, ולא היה לו עיצוב כלל: השם
   והמידע שמתחתיו נדבקו לשורה אחת בלי רווח. */
.tog{display:flex;align-items:center;gap:13px;width:100%;text-align:start;
  background:var(--surface2);border:1px solid transparent;border-radius:12px;
  padding:13px 15px;min-width:0}
.tog:hover{border-color:var(--line)}
.tog+.tog{margin-top:9px}
.tog .tt{flex:1;min-width:0}
.tog .tt b{display:block;font-size:.97rem;overflow-wrap:anywhere}
.tog .tt span{display:block;color:var(--muted);font-size:.85rem;overflow-wrap:anywhere;margin-top:2px}

/* יעד מגע לקישור התחתית. קישור טקסט בשורה יוצא בגובה הטקסט —
   15 פיקסלים — וזה קטן מדי לאצבע, גם כשהוא רק לתנאי השימוש. */
.lg-foot a{display:inline-flex;align-items:center;min-height:44px;padding-inline:6px}

/* ---------- יעדי מגע ----------
   .lvl יצא 39 פיקסלים ומתג ה-.sw רק 31, שניהם מתחת ל-44 שהפרויקט
   מחייב את עצמו בהם. במתג לא מגדילים את המסילה — היא תיראה מגושמת —
   אלא מרחיבים את שטח הלחיצה סביבה. */
.lvl{min-height:44px}
.sw{position:relative}
.sw::after{content:"";position:absolute;inset-block:-7px;inset-inline:-4px}

/* ---------- מסך בניית המבחן ----------
   .seg ו-.tpc הגיעו עם מודול המבחן שהועתק לכאן, ולא היה להם עיצוב:
   כפתורי הבחירה יצאו 34 פיקסלים, וכרטיסי הנושאים 6 פיקסלים בלבד —
   כלומר המורה לא יכול היה לבחור נושאים בכלל. */
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 auto;min-width:0;min-height:44px;border:1px solid var(--line);
  background:var(--surface);border-radius:10px;padding:10px 12px;font:inherit;
  font-weight:600;font-size:.9rem;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.tpc{position:relative;display:flex;flex-direction:column;gap:9px;text-align:start;
  background:var(--surface);border:1px solid var(--line);
  border-inline-start:4px solid var(--c,var(--accent));border-radius:12px;padding:14px;
  box-shadow:var(--shadow);min-width:0;min-height:44px;cursor:pointer;font:inherit;color:inherit}
.tpc.on{border-color:var(--accent);background:var(--accent-soft)}
.tpc .tn{font-weight:700;font-size:.98rem;overflow-wrap:anywhere;color:var(--c,var(--ink))}
.tpc .td{color:var(--muted);font-size:.8rem;overflow-wrap:anywhere}

/* טקסט על רקע ההדגשה: --accent-ink ולא לבן קבוע. במצב כהה
   ההדגשה בהירה, ולבן עליה יצא 1.5–2.0:1 — כמעט בלתי קריא. */
/* ---------- מצב מורה ---------- */
.te-wrap{position:fixed;inset:0;z-index:2147482500;background:rgba(8,12,20,.72);
  display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto;
  font-family:system-ui,"Heebo","Rubik",Arial,sans-serif}
.te-box{background:#fff;color:#111827;max-width:26rem;width:100%;border-radius:18px;
  box-shadow:0 24px 70px -20px rgba(0,0,0,.6);padding:clamp(18px,4vw,26px);
  max-height:92vh;overflow-y:auto;font-size:16px;line-height:1.6}
.te-box h2{margin:0 0 6px;font-size:1.35rem;font-weight:800;line-height:1.25}
.te-lead{margin:0 0 10px;color:#374151}
.te-warn{margin:0 0 12px;font-size:.88rem;color:#7c2d12;background:#fef3c7;
  border-radius:10px;padding:9px 11px}
.te-lab{display:block;margin:10px 0 4px;font-weight:700;font-size:.92rem}
.te-in{width:100%;box-sizing:border-box;font:inherit;letter-spacing:.3em;
  border:1px solid #d1d5db;border-radius:11px;padding:.7rem .8rem;min-height:48px;
  background:#fff;color:#111827}
.te-in:focus-visible{outline:3px solid #2563eb;outline-offset:1px}
.te-chk{display:flex;align-items:center;gap:.5rem;margin-top:14px;min-height:44px;
  font-size:.94rem;cursor:pointer}
.te-chk input{width:20px;height:20px}
.te-note{margin:2px 0 0;font-size:.82rem;color:#6b7280}
.te-msg{margin:10px 0 0;font-size:.92rem;font-weight:700;color:#7f1d1d;
  background:#fee2e2;border-radius:10px;padding:9px 11px}
.te-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.te-btn{font:inherit;font-weight:700;border-radius:12px;padding:.75rem 1.2rem;
  cursor:pointer;border:1px solid #d1d5db;background:#fff;color:#111827;min-height:48px}
.te-btn.pri{background:#111827;color:#fff;border-color:#111827;flex:1 1 9rem}
.te-btn.pri[disabled]{opacity:.5;cursor:default}
.te-btn.link{border:0;background:none;text-decoration:underline;padding:.6rem .2rem;
  color:#374151;margin-top:8px;min-height:44px}
.te-btn:focus-visible{outline:3px solid #2563eb;outline-offset:2px}
@media (prefers-color-scheme:dark){
  .te-box{background:#141a24;color:#e8ecf4}
  .te-lead,.te-note{color:#b9c2d4}
  .te-warn{background:#3a2a10;color:#fcd9a5}
  .te-in{background:#1d2531;color:#e8ecf4;border-color:#2c3648}
  .te-msg{background:#4a1717;color:#ffd7d7}
  .te-btn{background:#1d2531;color:#e8ecf4;border-color:#2c3648}
  .te-btn.pri{background:#e8ecf4;color:#141a24;border-color:#e8ecf4}
  .te-btn.link{color:#b9c2d4}
}

/* ---------- רשימת השאלות במסך בניית המבחן ---------- */
.xq-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.xq{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface2)}
.xq-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.xq-n{flex:0 0 auto;min-width:27px;height:27px;border-radius:8px;display:inline-flex;
  align-items:center;justify-content:center;font-weight:800;font-size:.85rem;background:var(--line)}
.xq-tp{font-weight:700;font-size:.88rem;color:var(--muted);overflow-wrap:anywhere}
.xq-acts{margin-inline-start:auto;display:flex;gap:6px;flex-wrap:wrap}
/* 44 פיקסלים גם כאן. כפתור קטן בתוך רשימה ארוכה הוא בדיוק
   הכפתור שנהג מבוגר או ילד עם ADHD לא מצליח לפגוע בו. */
.xq-b{padding:8px 13px;font-size:.88rem;font-weight:700;border-radius:10px;min-height:44px;
  border:1px solid var(--line);background:transparent;color:inherit;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:inherit}
.xq-b:hover{background:var(--line)}
.xq-b[aria-pressed="true"]{background:var(--line)}
.xq-q{margin-top:8px;line-height:1.5;overflow-wrap:anywhere}
.xq-e{margin-top:5px;font-weight:700;overflow-wrap:anywhere}
.xq-a{margin-top:7px;font-size:.92rem;color:var(--ok);overflow-wrap:anywhere}
.xq-add{margin-top:12px;gap:8px}
.xq-add .sub{margin:0}
/* שאלת מקור נושאת קטע שלם. בלי תקרה הוא דוחף את שאר הרשימה
   אל מחוץ למסך. */
.xq .passage{max-height:11rem;overflow:auto}
.hlang{display:flex;gap:4px;flex:none;align-items:center;flex-wrap:wrap}
.hlang button{border:1px solid #d4dbe7;background:transparent;color:inherit;border-radius:10px;padding:3px 9px;font:inherit;font-size:.82rem;cursor:pointer;min-height:36px}
.hlang button.on{border-color:#2f5fd8;color:#fff;background:#2f5fd8;font-weight:700}

/* ---------- יעדי מגע ≥44px — 1.10.2026 ----------
   נמדד בדפדפן ב-390px וב-360px, בדף הפתיחה ובשני צעדי לחיצה ממנו.
   הבלוק אחרון ב-style כדי לגבור על ההגדרות שמעליו. מגדילים בריפוד
   ובגובה מינימלי, לא בגובה קשיח — ערבית ורוסית ארוכות יותר. */
.hlang button{min-height:44px;padding-block:6px}
input[type=range]{min-height:44px}
.spk.sm{min-width:44px;min-height:44px}
.lvl{min-width:44px}
a[href*="education.gov.il"]{display:inline-flex;align-items:center;min-height:44px}

/* ---------- קישור בתוך טקסט — אזור נגיעה ≥44px · 2.10.2026 (O-110) ----------
   שני מקרים, ונמדדו שניהם ב-390px וב-360px:
   - קישור בתוך שורת טקסט רצה: ריפוד אנכי בלבד. ב-inline הוא מגדיל את
     אזור הנגיעה ואינו נכנס לגובה השורה — אף אלמנט לא זז.
   - קישורים זה מתחת לזה (<br>), וקישור בתוך פס ההקראה הקבוע: שם הריפוד
     חרג מהשורה וכיסה את הקישור או הכפתור שלידו, ולכן inline-flex
     בגובה 44 — כמו `.lg-foot a`. השורה גדלה, ואין חפיפה.
   לא `a` כללי: `.lg-foot a` ודומיו כבר 44px בבנייה אחרת. */
#tts-fail a{display:inline-flex;align-items:center;min-height:44px}
</style>

/* רמקול לכל תשובה — מי שקורא בקושי בוחר באוזן (אותו תקן של history) */

/* ============================================================

   ------------------------------------------------------------
   התסריט הוא נתון, לא קוד שפזור במסכים: כל פריט אומר מה נכתב

/* עוזרים לתסריט. כולם מחזירים false כשהאיבר אינו על המסך, כדי
   שצעד שלא מצא את מה שחיפש ידלג ולא יפיל את ההדגמה כולה. */
function demoEl(s){return typeof s==="string"?document.querySelector(s):s}
function demoShow(s){
  var e=demoEl(s); if(!e)return false;
  try{e.scrollIntoView({behavior:"smooth",block:"center"})}catch(err){try{e.scrollIntoView()}catch(err2){}}
  return true;
}
/* מדגיש את האיבר, ורק אז לוחץ — צופה שלא ראה לאן נלחץ לא הבין
   מה קרה. לכן אין צעד קצר מ-1200 אלפיות בתסריטים. */
function demoTap(s){
  var e=demoEl(s); if(!e||e.disabled)return false;
  demoShow(e);
  e.classList.add("demo-tap");
  DEMO.extra.push(setTimeout(function(){
    e.classList.remove("demo-tap");
    /* המסך מצטייר מחדש כל הזמן. אם האיבר שסומן כבר אינו במסמך,
       מחפשים אותו שוב לפי אותו בורר — לחיצה על איבר מת אינה
       עושה דבר, וזה בדיוק צעד שנראה כאילו נתקע. */
    var live=(typeof s==="string"&&!document.contains(e))?demoEl(s):e;
    if(DEMO.on&&live&&!live.disabled&&document.contains(live))try{live.click()}catch(err){}
  },430));
  return true;
}
function demoClick(s){
  var e=demoEl(s); if(!e||e.disabled)return false;
  try{e.click()}catch(err){return false}
  return true;
}
/* הקלדה אות אחר אות, עם אירוע input אמיתי — שדה חיפוש שמאזין
   ל-input לא היה מגיב להשמה ישירה ל-value. */
function demoType(s,text){
  var e=demoEl(s); if(!e)return false;
  demoShow(e); try{e.focus()}catch(err){}
  e.value=""; var i=0;
  var t=setInterval(function(){
    if(!DEMO.on||!e.parentNode){clearInterval(t);return}
    e.value=String(text).slice(0,++i);
    e.dispatchEvent(new Event("input",{bubbles:true}));
    if(i>=String(text).length)clearInterval(t);
  },85);
  DEMO.extra.push(t);
  return true;
}

/* ESC יוצא. הקשבה בשלב הלכידה, כדי שמסך שכבר מטפל ב-Escape
   לא יבלע את המקש לפני שההדגמה ראתה אותו. */
function demoKey(e){
  if(!DEMO.on)return;
  if(e.key==="Escape"||e.keyCode===27){
    e.preventDefault(); e.stopPropagation();
    demoStop();
  }
}

function demoStart(){
  if(DEMO.on)return;
  DEMO.on=true; DEMO.i=0;
  DEMO.btn.hidden=true; DEMO.bar.hidden=false;
  document.documentElement.classList.add("demo-running");
  demoNext();
}

function demoNext(){
  if(!DEMO.on)return;
  if(DEMO.i>=DEMO_SCRIPT.length){demoStop();return}
  var it=DEMO_SCRIPT[DEMO.i++]||{};
  var d=Math.max(600,it.duration||3000);
  DEMO.txt.textContent=it.subtitle||"";
  DEMO.step.textContent=DEMO.i+" / "+DEMO_SCRIPT.length;
  DEMO.fill.style.transition="none"; DEMO.fill.style.width="0";
  void DEMO.fill.offsetWidth;
  DEMO.fill.style.transition="width "+d+"ms linear";
  DEMO.fill.style.width="100%";
  if(typeof it.action==="function"){
    try{it.action()}catch(err){if(window.console)console.warn("demo:",err)}
  }
  DEMO.timer=setTimeout(demoNext,d);
}

function demoStop(){
  DEMO.on=false;
  if(DEMO.timer){clearTimeout(DEMO.timer);DEMO.timer=null}
  DEMO.extra.forEach(function(t){clearTimeout(t);clearInterval(t)});
  DEMO.extra=[];
  var m=document.querySelectorAll(".demo-tap"),i;
  for(i=0;i<m.length;i++)m[i].classList.remove("demo-tap");
  if(DEMO.bar)DEMO.bar.hidden=true;
  if(DEMO.btn)DEMO.btn.hidden=false;
  document.documentElement.classList.remove("demo-running");
  demoQuiet();
}

   נחתכת אחרי כ-15 שניות, באמצע מילה. pause+resume תקופתי מחזיק את
   המנוע ער. במובייל אין את הבאג ופעולה כזאת דווקא מקרטעת שם, ולכן
   מפעילים רק היכן שבאמת צריך. */
var NEEDS_KEEPALIVE=/Chrome|Chromium|Edg\//.test(navigator.userAgent)

var _kaTimer=null;
function startKeepAlive(){
  if(!NEEDS_KEEPALIVE||!("speechSynthesis" in window)||_kaTimer)return;
  _kaTimer=setInterval(function(){
    try{
      if(!speechSynthesis.speaking){stopKeepAlive();return}
      if(speechSynthesis.paused)return;   /* עצירה מכוונת — לא נוגעים */
      speechSynthesis.pause();speechSynthesis.resume();
    }catch(e){stopKeepAlive()}
  },9000);
}
function stopKeepAlive(){if(_kaTimer){clearInterval(_kaTimer);_kaTimer=null}}
/* עוצרים רק כששום דבר כבר לא מדבר — אחרת מקטע שהתחיל זה עתה מאבד
   את השמירה שלו כשהמקטע הקודם מסיים להתנקות. */
function maybeStopKeepAlive(){
  try{if(speechSynthesis.speaking||speechSynthesis.pending)return}catch(e){}
  stopKeepAlive();

/* 2 · הפניה חיה ל-utterance. Chrome אוסף אובייקט שאין אליו הפניה,
   ואיתו נעלמים onend ו-onboundary: ההקראה נתקעת באמצע, ההדגשה
   קופאת על מילה אחת, והמקטע הבא לא יוצא לעולם. */

/* 3 · קול רשת שנכשל. הקולות הנוירליים של Edge הם קולות רשת, והם
   שותקים בלי אינטרנט. הדגל נכבה ברגע שאחד מהם נכשל, ומאותו רגע
   הדירוג מעדיף קול מקומי לשארית הסשן. */
var _netVoiceOK=true;

/* קול רשת שאי אפשר להשתמש בו עכשיו — אין אינטרנט, או שאחד כבר
   נכשל בסשן הזה — אינו "פחות טוב", הוא פשוט לא יעבוד. לכן זה מיון
   ראשון ולא עוד סעיף בתוך הניקוד: קנס בניקוד לא הספיק, מפני שקול
   נוירלי של Microsoft צובר על שם היצרן ועל "Natural" יותר ממה שכל
   קנס סביר מוריד — והוא נבחר שוב ושוב אחרי שכבר נכשל.
   כשהוא הקול היחיד שיש הוא עדיין נבחר: מיון של רשימה בת אחד
   מחזיר אותה כמו שהיא. */
function voiceUsable(v){

/* 4 · שומר זמן. יש מכשירים שבהם onend פשוט לא נורה. בלי השומר הזה
   התור נתקע: הכפתור נשאר על "עצירה" וההקראה לא ממשיכה לעולם. ארבע
   שניות שבהן המנוע לא מדבר ולא ממתין נחשבות סוף.
   מחזיר פונקציית ביטול — מי שסיים בדרך הרגילה מכבה את השומר. */
function ttsWatchdog(alive,onSilent){

    if(!alive()){clearInterval(dog);return}

    try{busy=!!(speechSynthesis.speaking||speechSynthesis.pending)}catch(e){}
    if(busy){idle=0;return}

var SEG_MAX=90, SEG_GAP=260;
/* סימן פיסוק בין שתי ספרות הוא חלק מהמספר ולא מקום לחתוך בו:
   בלי הבדיקה הזאת "3,500" נשבר והמנוע קורא "שלוש, חמש מאות". */
function insideNumber(str,i){
  return i>0&&i+1<str.length&&/[0-9]/.test(str[i-1])&&/[0-9]/.test(str[i+1]);
}
function segments(spoken){
  var out=[],parts=[],from=0,i,j;
  function push(t,start){ if(String(t).trim())out.push({text:t,start:start}) }
  for(i=0;i<spoken.length;i++){
    if(".!?:;".indexOf(spoken[i])<0)continue;
    if(insideNumber(spoken,i))continue;
    j=i+1; while(j<spoken.length&&/\s/.test(spoken[j]))j++;
    parts.push({text:spoken.slice(from,j),start:from});
    from=j; i=j-1;
  }
  if(from<spoken.length)parts.push({text:spoken.slice(from),start:from});
  for(var k=0;k<parts.length;k++){
    var p=parts[k];
    if(p.text.length<=SEG_MAX){ push(p.text,p.start); continue }
    var rest=p.text,base=p.start;
    while(rest.length>SEG_MAX){
      var cut=rest.lastIndexOf(",",SEG_MAX);
      while(cut>0&&insideNumber(rest,cut))cut=rest.lastIndexOf(",",cut-1);
      if(cut<SEG_MAX*0.4)cut=rest.lastIndexOf(" ",SEG_MAX);
      if(cut<=0)break;
      push(rest.slice(0,cut+1),base);
      base+=cut+1; rest=rest.slice(cut+1);
    }
    push(rest,base);
  }
  /* מקטע זעיר — "12." או ")" — עם הפסקה של רבע שנייה אחריו נשמע
     כמו גמגום. מאחדים אותו לזה שאחריו. */
  var merged=[];
  for(i=0;i<out.length;i++){
    if(merged.length&&out[i].text.trim().length<12&&
       merged[merged.length-1].text.length+out[i].text.length<=SEG_MAX*1.4){
      merged[merged.length-1].text+=out[i].text; continue;
    }
    if(out[i].text.trim().length<12&&i+1<out.length){
      out[i+1]={text:out[i].text+out[i+1].text,start:out[i].start}; continue;
    }
    merged.push(out[i]);
  }
  out=merged;
  return out.length?out:[{text:spoken,start:0}];
}
/* קצב לפי שפה — אותם ערכים שנבחרו בתאוריה מדברת אחרי האזנה */
var VOICE_TUNE={he:0.82,ar:0.85,en:0.90,ru:0.88};
function tuneRate(lang,rate){
  var t=VOICE_TUNE[String(lang||"he").split("-")[0].toLowerCase()]||0.88;
  var r=t*(rate||1);
  return Math.max(0.5,Math.min(1.6,Math.round(r*100)/100));
}

/* ------------------------------------------------------------

   כרום יורה onend על האמירה שבוטלה, המקטע הבא נרשם בכל זאת,

   במקביל. מונה אחד פותר את זה: כל הקראה מקבלת מספר, stopSpeak

     שיוצאת ארבע שניות אחרי המגע נזרקת בשקט באנדרואיד ובספארי.
     כשהרשימה כבר כאן, בוחרים קול ומדברים. כשהיא ריקה — מדברים
     בכל זאת, עם u.lang בלבד: קול ברירת מחדל בשפה הנכונה עדיף על
     שתיקה, ויש מכשירים שמחזירים רשימה ריקה לצמיתות ומדברים היטב.

             מקומי וחוזרים על אותו מקטע, פעם אחת, כדי שההקראה לא
             תישבר בשקט באמצע שאלה. */

            v=bestVoice(code); lang=(v&&v.lang)||code; pit=femLift(v);

/* lang: "en" לחומר הנלמד, או קוד שפת האם להוראה. */
function speak(text,lang,rateMul){

     לבד, וניקוי חוזר אינו משנה דבר — אבל בלעדיו כל מחרוזת שנשארה
     עם <sub> או <span class="frac"> הוקראה בקול כתגית: הסטודנט
     שמע "span class frac" באמצע השאלה. */
  text=plainOf(String(text||"")).trim(); if(!text)return;
  lang=lang||"en";
  var code=lang==="en"?EN_TTS:LANGS[lang].tts;
  var rate=clamp(state.rate*(rateMul||1),0.55,1.4);
  stopSpeak();
  var my=_sayGen;   /* גם תשובת רשת שמגיעה אחרי עצירה לא תושמע */
  /* שכבה 1 - קובץ מוקלט (המנוע של תאוריה מדברת). יש קובץ:
     מנגנים וזהו; אין: קול המכשיר כרגיל. הבעלים, 2.10.2026. */
  if(typeof RECORDED!=="undefined"&&RECORDED.play(text,lang,{rate:state.rate,
      onError:function(){ if(my===_sayGen)speakDevice(text,code,rate) }})){
    return;
  }
  if(gemOn()){
    var vid=gvOf(state.gemVoice).id;
    var ck=lang+"|"+vid+"|"+rate.toFixed(2)+"|"+text;
    if(gCache[ck]){playUrl(gCache[ck],text,code,rate);return}
    gBusy=true; renderSpeakState();
    gSynth(text,vid,rate,lang).then(function(u){
      if(my!==_sayGen)return;
      gCache[ck]=u; gBusy=false; renderSpeakState(); playUrl(u,text,code,rate);
    }).catch(function(){
      gBusy=false; renderSpeakState(); speakDevice(text,code,rate);
    });
    return;
  }

}
function playUrl(url,text,code,rate){

  if(!GEL)GEL=new Audio();

    if(pr&&pr.then)pr.then(function(){try{GEL.pause();GEL.currentTime=0}catch(e){}},function(){});
  }catch(e){}
},{once:true});}catch(e){}

   בנק שאלות כתוב, ולא מחולל. באזרחות אין נוסחה שממנה נגזרת
   שאלה: הניסוח המדויק הוא החומר הנלמד, ומסיח שנבנה אוטומטית
   מנוסח אחר היה יוצא או מופרך מדי או נכון בעצמו.

   Q(id, q, opts, ok, hint, ex, fig)
     id   — מזהה יציב לפריט. הוא נכנס לסטטיסטיקה של הלומד, ולכן
            אסור לו להשתנות כשמוסיפים פריט לפניו.
     q    — נוסח השאלה, בארבע שפות.
     opts — ארבע תשובות, כל אחת בארבע שפות. תמיד ארבע: שלוש
            אפשרויות הן ניחוש של אחד משלושה.
     ok   — אינדקס התשובה הנכונה במערך opts (0..3). הסדר על
            המסך מעורבב בכל הצגה, ולכן האינדקס אינו רמז.
     hint — רמז שמכוון לחשיבה ואינו מוסר את התשובה.
     ex   — ההסבר שנפתח אחרי המענה, גם כשענו נכון.
     fig  — מפתח איור מתוך FIGS, או null. אופציונלי בהגדרה:
            רוב השאלות באזרחות הן טקסט בלבד.

   כל שדה קיים בארבע השפות. אזרחות נלמדת בשפת האם — מי שקורא
   בקושי בעברית לא ילמד ממנה מדרג נורמות, ולכן התוכן עצמו
   מתורגם ולא רק הממשק.

   מקור: תוכנית הלימודים של משרד החינוך בביולוגיה (5 יח״ל, נושאי ליבה) ומבנה שאלון 043381. הניסוח מקורי של בקול, עם קרדיט וקישור למשרד החינוך.
   השאלות נכתבו לאפליקציה הזאת ואינן העתק של בחינה.
   ============================================================ */
function Q(id,q,opts,ok,hint,ex,fig,wrong){
  return {id:id,q:q,o:opts,ok:ok,hint:hint,ex:ex,fig:fig||null,wrong:wrong||null};
}

function figBox(x,y,w,h,label,sub){
  return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="6" '+
    'fill="var(--surface2)" stroke="currentColor" stroke-width="1.2"/>'+
    '<text x="'+(x+w/2)+'" y="'+(y+(sub?h/2-2:h/2+4))+'" text-anchor="middle" '+
    'font-size="10" font-weight="700" fill="currentColor">'+esc(label)+'</text>'+
    (sub?'<text x="'+(x+w/2)+'" y="'+(y+h/2+11)+'" text-anchor="middle" '+
      'font-size="8" fill="currentColor" opacity=".75">'+esc(sub)+'</text>':"");
}

topic("bio-cell","043381",
  {"he": "תא ורמות ארגון", "ar": "الخلية ومستويات التنظيم", "ru": "Клетка и уровни организации", "en": "The cell and levels of organization"},
  {"he": "מהתא ועד האורגניזם", "ar": "من الخلية إلى الكائن الحي", "ru": "От клетки до организма", "en": "From the cell to the whole organism"},
[
 [
    Q("cell-1-1",{"he": "מהי יחידת המבנה והתפקוד הבסיסית של כל היצורים החיים?", "ar": "ما وحدة البناء والوظيفة الأساسية لكل الكائنات الحية؟", "ru": "Что является основной единицей строения и функции всех живых организмов?", "en": "What is the basic unit of structure and function in all living things?"},[{"he": "התא", "ar": "الخلية", "ru": "Клетка", "en": "The cell"}, {"he": "הגן", "ar": "الجين", "ru": "Ген", "en": "The gene"}, {"he": "האיבר", "ar": "العضو", "ru": "Орган", "en": "The organ"}, {"he": "המולקולה", "ar": "الجزيء", "ru": "Молекула", "en": "The molecule"}],0,{"he": "חשבו על מה שיש גם בחיידק וגם בפיל.", "ar": "فكّروا بما هو موجود في البكتيريا وفي الفيل معًا.", "ru": "Подумайте о том, что есть и у бактерии, и у слона.", "en": "Think about what a bacterium and an elephant both have."},{"he": "כל יצור חי בנוי מתא אחד או מהרבה תאים. התא הוא היחידה הקטנה ביותר שיכולה לבצע את כל פעולות החיים. למשל, חיידק הוא תא אחד, וגוף האדם בנוי מטריליוני תאים.", "ar": "كل كائن حي مبني من خلية واحدة أو من خلايا كثيرة. الخلية أصغر وحدة تقوم بكل أعمال الحياة. مثلًا البكتيريا خلية واحدة، وجسم الإنسان مبني من تريليونات الخلايا.", "ru": "Каждый живой организм состоит из одной или многих клеток. Клетка — наименьшая единица, способная выполнять все процессы жизни. Например, бактерия — одна клетка, а тело человека состоит из триллионов клеток.", "en": "Every living thing is made of one cell or many cells. The cell is the smallest unit that can carry out all the activities of life. For example, a bacterium is one cell, and the human body is made of trillions of cells."},null,[null, {"he": "הגן הוא קטע מידע בתוך התא, ולא היחידה שממנה בנוי הגוף.", "ar": "الجين قطعة معلومات داخل الخلية، وليس الوحدة التي يُبنى منها الجسم.", "ru": "Ген — это участок информации внутри клетки, а не единица, из которой построено тело.", "en": "A gene is a piece of information inside the cell, not the unit the body is built from."}, {"he": "איבר בנוי מרקמות, והרקמות בנויות מתאים, ולכן התא קטן ממנו.", "ar": "العضو مبني من أنسجة، والأنسجة مبنية من خلايا، فالخلية أصغر منه.", "ru": "Орган состоит из тканей, а ткани — из клеток, поэтому клетка меньше него.", "en": "An organ is made of tissues and tissues are made of cells, so the cell is smaller."}, {"he": "מולקולה קטנה מתא ואינה חיה בפני עצמה, ולכן אינה יחידת החיים.", "ar": "الجزيء أصغر من الخلية ولا يحيا وحده، لذلك ليس وحدة الحياة.", "ru": "Молекула меньше клетки и сама по себе не живёт, поэтому она не единица жизни.", "en": "A molecule is smaller than a cell and is not alive on its own, so it is not the unit of life."}]),
    Q("cell-1-2",{"he": "באיזה אברון בתא מופקת רוב האנרגיה בצורת ATP?", "ar": "في أي عُضيّة في الخلية يُنتَج معظم الطاقة على شكل ATP؟", "ru": "В какой органелле клетки образуется большая часть энергии в виде АТФ?", "en": "In which organelle is most of the cell's energy produced as ATP?"},[{"he": "במיטוכונדריה", "ar": "في الميتوكوندريا", "ru": "В митохондрии", "en": "In the mitochondrion"}, {"he": "בגרעין, שבו נשמר ה-DNA של התא", "ar": "في النواة، حيث يُحفَظ الـDNA الخاصّ بالخلية", "ru": "В ядре, где хранится ДНК клетки", "en": "In the nucleus, where the cell's DNA is stored"}, {"he": "בריבוזום", "ar": "في الريبوسوم", "ru": "В рибосоме", "en": "In the ribosome"}, {"he": "בדופן התא, בשכבת התאית שעוטפת אותו", "ar": "في جدار الخلية، في طبقة السليلوز التي تحيط بها", "ru": "В клеточной стенке, в слое целлюлозы вокруг клетки", "en": "In the cell wall, in the cellulose layer around it"}],0,{"he": "זה האברון שנקרא לפעמים תחנת הכוח של התא.", "ar": "هذه العُضيّة تُسمّى أحيانًا محطة الطاقة في الخلية.", "ru": "Эту органеллу иногда называют электростанцией клетки.", "en": "This organelle is sometimes called the power station of the cell."},{"he": "במיטוכונדריה מתרחשת נשימה תאית, ובה מפרקים סוכר בעזרת חמצן ומפיקים ATP. לכן תאי שריר, שצריכים הרבה אנרגיה, מכילים הרבה מיטוכונדריות.", "ar": "في الميتوكوندريا تحدث عملية التنفس الخلوي، فيُفكَّك السكر بمساعدة الأكسجين ويُنتَج ATP. لذلك تحتوي خلايا العضلات، التي تحتاج طاقة كثيرة، على ميتوكوندريا كثيرة.", "ru": "В митохондриях идёт клеточное дыхание: сахар расщепляется с помощью кислорода и образуется АТФ. Поэтому в мышечных клетках, которым нужно много энергии, много митохондрий.", "en": "Cellular respiration takes place in the mitochondrion: sugar is broken down using oxygen and ATP is produced. That is why muscle cells, which need a lot of energy, contain many mitochondria."},null,[null, {"he": "בגרעין נשמר המידע התורשתי, אבל ה-ATP אינו מופק שם.", "ar": "في النواة تُحفَظ المعلومات الوراثية، لكنّ الـATP لا يُنتَج هناك.", "ru": "В ядре хранится наследственная информация, но АТФ там не производится.", "en": "The nucleus stores the hereditary information, but ATP is not produced there."}, {"he": "הריבוזום מרכיב חלבונים, והוא צורך אנרגיה במקום לייצר אותה.", "ar": "الريبوسوم يركّب البروتينات، وهو يستهلك الطاقة بدل أن يُنتجها.", "ru": "Рибосома собирает белки и потребляет энергию, а не производит её.", "en": "The ribosome builds proteins; it uses energy instead of producing it."}, {"he": "דופן התא היא שכבת תמיכה בצמחים, ואין בה ייצור אנרגיה.", "ar": "جدار الخلية طبقة دعم في النباتات، ولا يجري فيه إنتاج طاقة.", "ru": "Клеточная стенка — опорный слой у растений, и энергия в ней не вырабатывается.", "en": "The cell wall is a support layer in plants, and no energy is produced in it."}]),
    Q("cell-1-3",{"he": "באיזה אברון נמצא החומר התורשתי בתא של צמח או של בעל חיים?", "ar": "في أي عُضيّة توجد المادة الوراثية في خلية نبات أو حيوان؟", "ru": "В какой органелле находится наследственный материал в клетке растения или животного?", "en": "In which organelle is the genetic material found in a plant or animal cell?"},[{"he": "בריבוזום", "ar": "في الريبوسوم", "ru": "В рибосоме", "en": "In the ribosome"}, {"he": "בקרום התא", "ar": "في غشاء الخلية", "ru": "В клеточной мембране", "en": "In the cell membrane"}, {"he": "בגרעין", "ar": "في النواة", "ru": "В ядре", "en": "In the nucleus"}, {"he": "בליזוזום", "ar": "في الليزوزوم", "ru": "В лизосоме", "en": "In the lysosome"}],2,{"he": "חפשו את החלק ששומר על תוכניות הבנייה של התא.", "ar": "ابحثوا عن الجزء الذي يحفظ مخططات بناء الخلية.", "ru": "Ищите часть, которая хранит чертежи построения клетки.", "en": "Look for the part that keeps the cell's building plans."},{"he": "הגרעין עטוף בקרום, ובתוכו שמור ה-DNA. ממנו יוצאות ההוראות לבניית חלבונים. בחיידק אין גרעין, וה-DNA שלו נמצא בציטופלסמה.", "ar": "النواة محيطة بغشاء، وداخلها محفوظ DNA. منها تخرج التعليمات لبناء البروتينات. البكتيريا بلا نواة، وDNA فيها موجود في السيتوبلازما.", "ru": "Ядро окружено мембраной, и внутри него хранится ДНК. Из него выходят указания для построения белков. У бактерии ядра нет, и её ДНК находится в цитоплазме.", "en": "The nucleus is wrapped in a membrane and the DNA is kept inside it. The instructions for building proteins come from there. A bacterium has no nucleus, and its DNA sits in the cytoplasm."},null,[{"he": "הריבוזום מרכיב חלבונים לפי הוראות, ואינו מאחסן את ה-DNA.", "ar": "الريبوسوم يبني البروتينات حسب التعليمات، ولا يخزّن DNA.", "ru": "Рибосома собирает белки по указаниям и не хранит ДНК.", "en": "The ribosome assembles proteins from instructions and does not store the DNA."}, {"he": "קרום התא שולט במעבר חומרים, ואינו מחזיק את החומר התורשתי.", "ar": "غشاء الخلية يتحكّم بمرور المواد، ولا يحمل المادة الوراثية.", "ru": "Клеточная мембрана управляет переходом веществ и не содержит наследственный материал.", "en": "The cell membrane controls what passes through and does not hold the genetic material."}, null, {"he": "הליזוזום מפרק חומרים בעזרת אנזימים, ואין בו חומר תורשתי.", "ar": "الليزوزوم يفكّك المواد بمساعدة الإنزيمات، ولا توجد فيه مادة وراثية.", "ru": "Лизосома расщепляет вещества с помощью ферментов, и наследственного материала в ней нет.", "en": "The lysosome breaks substances down with enzymes and holds no genetic material."}]),
    Q("cell-1-4",{"he": "מה התפקיד העיקרי של קרום התא?", "ar": "ما الوظيفة الأساسية لغشاء الخلية؟", "ru": "Какова главная функция клеточной мембраны?", "en": "What is the main role of the cell membrane?"},[{"he": "לייצר אנרגיה בצורת ATP", "ar": "إنتاج الطاقة على شكل ATP", "ru": "Производить энергию в виде АТФ", "en": "To produce energy as ATP"}, {"he": "לבקר מה נכנס לתא ומה יוצא ממנו", "ar": "التحكّم بما يدخل الخلية وما يخرج منها", "ru": "Управлять тем, что входит в клетку и выходит из неё", "en": "To control what enters and leaves the cell"}, {"he": "לפרק חומרי פסולת ולהוציא אותם מהגרעין", "ar": "تفكيك مواد النفايات وإخراجها من النواة", "ru": "Расщеплять отходы и выводить их из ядра", "en": "To break down waste and remove it from the nucleus"}, {"he": "לאחסן את החומר התורשתי", "ar": "تخزين المادة الوراثية", "ru": "Хранить наследственный материал", "en": "To store the genetic material"}],1,{"he": "חשבו מה עומד בין פנים התא לסביבה שמחוצה לו.", "ar": "فكّروا بما يفصل داخل الخلية عن محيطها الخارجي.", "ru": "Подумайте, что стоит между внутренней частью клетки и внешней средой.", "en": "Think about what stands between the inside of the cell and its surroundings."},{"he": "קרום התא חדיר בררנית. הוא מכניס חומרים שהתא צריך ועוצר אחרים. למשל, גלוקוז עובר דרך חלבוני מעבר שיושבים בקרום.", "ar": "غشاء الخلية نفوذ بشكل انتقائي. يُدخل المواد التي تحتاجها الخلية ويمنع غيرها. مثلًا، الغلوكوز يمرّ عبر بروتينات نقل موجودة في الغشاء.", "ru": "Клеточная мембрана проницаема избирательно. Она пропускает нужные клетке вещества и задерживает другие. Например, глюкоза проходит через транспортные белки в мембране.", "en": "The cell membrane is selectively permeable. It lets in what the cell needs and keeps other things out. For example, glucose passes through transport proteins in the membrane."},null,[{"he": "ATP מופק במיטוכונדריון, ולא בקרום התא.", "ar": "ATP يُنتَج في الميتوكوندريا، لا في غشاء الخلية.", "ru": "АТФ образуется в митохондрии, а не в клеточной мембране.", "en": "ATP is produced in the mitochondrion, not in the cell membrane."}, null, {"he": "פירוק חומרים נעשה בליזוזום, ולא בקרום התא.", "ar": "تفكيك المواد يحدث في الليزوزوم، لا في غشاء الخلية.", "ru": "Расщепление веществ идёт в лизосоме, а не в клеточной мембране.", "en": "Breaking substances down happens in the lysosome, not in the cell membrane."}, {"he": "החומר התורשתי שמור בגרעין, והקרום רק עוטף את התא.", "ar": "المادة الوراثية محفوظة في النواة، والغشاء يحيط بالخلية فقط.", "ru": "Наследственный материал хранится в ядре, а мембрана лишь окружает клетку.", "en": "The genetic material is kept in the nucleus; the membrane only wraps the cell."}]),
    Q("cell-1-5",{"he": "באיזה אברון מתרחשת הפוטוסינתזה?", "ar": "في أي عُضيّة يحدث التمثيل الضوئي؟", "ru": "В какой органелле происходит фотосинтез?", "en": "In which organelle does photosynthesis take place?"},[{"he": "בכלורופלסט", "ar": "في البلاستيدة الخضراء", "ru": "В хлоропласте", "en": "In the chloroplast"}, {"he": "במיטוכונדריון", "ar": "في الميتوكوندريا", "ru": "В митохондрии", "en": "In the mitochondrion"}, {"he": "בגרעין", "ar": "في النواة", "ru": "В ядре", "en": "In the nucleus"}, {"he": "בריבוזום", "ar": "في الريبوسوم", "ru": "В рибосоме", "en": "In the ribosome"}],0,{"he": "חשבו מה נותן לעלה את הצבע הירוק.", "ar": "فكّروا بما يمنح الورقة لونها الأخضر.", "ru": "Подумайте, что придаёт листу зелёный цвет.", "en": "Think about what gives a leaf its green colour."},{"he": "בכלורופלסט יש כלורופיל, שקולט אור. מהאור, מהמים ומפחמן דו-חמצני נבנה שם סוכר. כלורופלסטים יש בתאי צמח, ואין בתאי בעלי חיים.", "ar": "في البلاستيدة الخضراء يوجد كلوروفيل يمتصّ الضوء. من الضوء والماء وثاني أكسيد الكربون يُبنى هناك سكر. البلاستيدات الخضراء موجودة في خلايا النبات ولا توجد في خلايا الحيوان.", "ru": "В хлоропласте есть хлорофилл, который поглощает свет. Из света, воды и углекислого газа там строится сахар. Хлоропласты есть в клетках растений и отсутствуют в клетках животных.", "en": "The chloroplast holds chlorophyll, which absorbs light. From light, water and carbon dioxide it builds sugar. Chloroplasts are found in plant cells and not in animal cells."},null,[null, {"he": "המיטוכונדריון מפרק סוכר ומפיק ATP, ואינו בונה סוכר מאור.", "ar": "الميتوكوندريا تفكّك السكر وتنتج ATP، ولا تبني سكرًا من الضوء.", "ru": "Митохондрия расщепляет сахар и производит АТФ, а не строит сахар из света.", "en": "The mitochondrion breaks sugar down to make ATP; it does not build sugar from light."}, {"he": "הגרעין שומר את ה-DNA, ואין בו קליטת אור.", "ar": "النواة تحفظ DNA، ولا يحدث فيها امتصاص للضوء.", "ru": "Ядро хранит ДНК, и света оно не поглощает.", "en": "The nucleus keeps the DNA and does not absorb light."}, {"he": "הריבוזום מרכיב חלבונים, ואינו קולט אור.", "ar": "الريبوسوم يبني البروتينات، ولا يمتصّ الضوء.", "ru": "Рибосома собирает белки и света не поглощает.", "en": "The ribosome assembles proteins and does not absorb light."}]),
    Q("cell-1-6",{"he": "מה הסדר הנכון של רמות הארגון בגוף, מהקטן לגדול?", "ar": "ما الترتيب الصحيح لمستويات التنظيم في الجسم، من الأصغر إلى الأكبر؟", "ru": "Каков правильный порядок уровней организации в организме, от меньшего к большему?", "en": "What is the correct order of the levels of organization in the body, from small to large?"},[{"he": "תא, איבר, רקמה, מערכת, אורגניזם", "ar": "خلية، عضو، نسيج، جهاز، كائن حي", "ru": "Клетка, орган, ткань, система органов, организм", "en": "Cell, organ, tissue, system, organism"}, {"he": "רקמה, תא, איבר, מערכת, אורגניזם", "ar": "نسيج، خلية، عضو، جهاز، كائن حي", "ru": "Ткань, клетка, орган, система органов, организм", "en": "Tissue, cell, organ, system, organism"}, {"he": "איבר, מערכת, רקמה, תא, אורגניזם", "ar": "عضو، جهاز، نسيج، خلية، كائن حي", "ru": "Орган, система органов, ткань, клетка, организм", "en": "Organ, system, tissue, cell, organism"}, {"he": "תא, רקמה, איבר, מערכת, אורגניזם", "ar": "خلية، نسيج، عضو، جهاز، كائن حي", "ru": "Клетка, ткань, орган, система органов, организм", "en": "Cell, tissue, organ, system, organism"}],3,{"he": "התחילו מהיחידה הקטנה ביותר שיכולה לבצע את פעולות החיים.", "ar": "ابدأوا من أصغر وحدة تقوم بأعمال الحياة.", "ru": "Начните с наименьшей единицы, которая выполняет процессы жизни.", "en": "Start with the smallest unit that can carry out the activities of life."},{"he": "תאים דומים מרכיבים רקמה, רקמות מרכיבות איבר, איברים עובדים יחד במערכת, והמערכות יחד הן האורגניזם. למשל, תאי שריר הלב הם רקמה, הלב הוא איבר, והוא חלק ממערכת הדם.", "ar": "الخلايا المتشابهة تبني نسيجًا، والأنسجة تبني عضوًا، والأعضاء تعمل معًا في جهاز، والأجهزة معًا هي الكائن الحي. مثلًا، خلايا عضلة القلب نسيج، والقلب عضو، وهو جزء من جهاز الدوران.", "ru": "Похожие клетки образуют ткань, ткани образуют орган, органы работают вместе в системе, а системы вместе составляют организм. Например, клетки сердечной мышцы — это ткань, сердце — орган, и оно часть системы кровообращения.", "en": "Similar cells make a tissue, tissues make an organ, organs work together in a system, and the systems together are the organism. For example, heart muscle cells are a tissue, the heart is an organ, and it is part of the circulatory system."},null,[{"he": "איבר בנוי מרקמות, ולכן הרקמה באה לפניו ולא אחריו.", "ar": "العضو مبني من أنسجة، لذلك النسيج يأتي قبله لا بعده.", "ru": "Орган состоит из тканей, поэтому ткань идёт до него, а не после.", "en": "An organ is made of tissues, so the tissue comes before it, not after."}, {"he": "רקמה בנויה מתאים, ולכן התא קטן ממנה ובא ראשון.", "ar": "النسيج مبني من خلايا، لذلك الخلية أصغر منه وتأتي أولًا.", "ru": "Ткань состоит из клеток, поэтому клетка меньше неё и идёт первой.", "en": "A tissue is made of cells, so the cell is smaller and comes first."}, {"he": "הסדר הזה הפוך: הוא מתחיל באיבר ומסיים בתא, הקטן מכולם.", "ar": "هذا الترتيب معكوس: يبدأ بالعضو وينتهي بالخلية، وهي الأصغر.", "ru": "Этот порядок перевёрнут: он начинается с органа и кончается клеткой, самой маленькой.", "en": "This order is reversed: it starts with the organ and ends with the cell, the smallest of all."}, null]),
    Q("cell-1-7",{"he": "מה תפקידו של הריבוזום בתא?", "ar": "ما وظيفة الريبوسوم في الخلية؟", "ru": "Какова функция рибосомы в клетке?", "en": "What is the ribosome's job in the cell?"},[{"he": "לפרק סוכר ולהפיק ממנו אנרגיה", "ar": "تفكيك السكر وإنتاج الطاقة منه", "ru": "Расщеплять сахар и получать из него энергию", "en": "To break down sugar and get energy from it"}, {"he": "להרכיב חלבונים", "ar": "بناء البروتينات", "ru": "Собирать белки", "en": "To assemble proteins"}, {"he": "לאחסן את החומר התורשתי בגרעין", "ar": "تخزين المادة الوراثية في النواة", "ru": "Хранить наследственный материал в ядре", "en": "To store the genetic material in the nucleus"}, {"he": "לקלוט אור ולבנות ממנו סוכר", "ar": "امتصاص الضوء وبناء السكر منه", "ru": "Поглощать свет и строить из него сахар", "en": "To absorb light and build sugar from it"}],1,{"he": "חשבו מי בונה את המכונות שהתא עובד איתן.", "ar": "فكّروا بمن يبني الآلات التي تعمل بها الخلية.", "ru": "Подумайте, кто строит те машины, которыми работает клетка.", "en": "Think about who builds the machines the cell works with."},{"he": "הריבוזום קורא את ההוראות מה-mRNA ומחבר חומצות אמינו לשרשרת, וכך נוצר חלבון. בתא שמייצר הרבה חלבון יש הרבה ריבוזומים.", "ar": "الريبوسوم يقرأ التعليمات من mRNA ويربط الأحماض الأمينية في سلسلة، فينتج بروتين. في الخلية التي تنتج بروتينًا كثيرًا توجد ريبوسومات كثيرة.", "ru": "Рибосома читает указания с иРНК и соединяет аминокислоты в цепь, так получается белок. В клетке, которая производит много белка, много рибосом.", "en": "The ribosome reads the instructions from the mRNA and links amino acids into a chain, making a protein. A cell that makes a lot of protein has many ribosomes."},null,[{"he": "פירוק סוכר לאנרגיה נעשה במיטוכונדריון, ולא בריבוזום.", "ar": "تفكيك السكر لإنتاج الطاقة يحدث في الميتوكوندريا، لا في الريبوسوم.", "ru": "Расщепление сахара для энергии идёт в митохондрии, а не в рибосоме.", "en": "Breaking sugar down for energy happens in the mitochondrion, not the ribosome."}, null, {"he": "אחסון ה-DNA הוא תפקיד הגרעין, והריבוסום רק קורא עותק שלו.", "ar": "تخزين DNA وظيفة النواة، والريبوسوم يقرأ نسخة عنه فقط.", "ru": "Хранение ДНК — задача ядра, а рибосома лишь читает его копию.", "en": "Storing the DNA is the nucleus's job; the ribosome only reads a copy of it."}, {"he": "קליטת אור נעשית בכלורופלסט, שאינו קיים בכלל בתאי בעלי חיים.", "ar": "امتصاص الضوء يحدث في البلاستيدة الخضراء، وهي غير موجودة في خلايا الحيوان.", "ru": "Поглощение света идёт в хлоропласте, которого в клетках животных вовсе нет.", "en": "Light is absorbed in the chloroplast, which animal cells do not have at all."}]),
    Q("cell-1-8",{"he": "לאיזה סוג תא אין גרעין?", "ar": "أي نوع من الخلايا لا تحتوي على نواة؟", "ru": "У какого типа клеток нет ядра?", "en": "Which type of cell has no nucleus?"},[{"he": "תא עצב באדם", "ar": "خلية عصب عند الإنسان", "ru": "Нервная клетка человека", "en": "A human nerve cell"}, {"he": "תא בעלה של צמח", "ar": "خلية في ورقة نبات", "ru": "Клетка в листе растения", "en": "A cell in a plant leaf"}, {"he": "תא חיידק", "ar": "خلية بكتيريا", "ru": "Клетка бактерии", "en": "A bacterial cell"}, {"he": "תא שמרים", "ar": "خلية خميرة", "ru": "Клетка дрожжей", "en": "A yeast cell"}],2,{"he": "חשבו על היצורים הפשוטים והקטנים ביותר.", "ar": "فكّروا بالكائنات الأبسط والأصغر.", "ru": "Подумайте о самых простых и мелких организмах.", "en": "Think about the simplest and smallest living things."},{"he": "חיידקים הם פרוקריוטים: אין להם גרעין, וה-DNA שלהם נמצא בציטופלסמה. בתא של צמח, של בעל חיים ושל שמרים יש גרעין עטוף בקרום.", "ar": "البكتيريا بدائية النوى: لا نواة لها، وDNA فيها موجود في السيتوبلازما. في خلية النبات والحيوان والخميرة توجد نواة محيطة بغشاء.", "ru": "Бактерии — прокариоты: ядра у них нет, и их ДНК находится в цитоплазме. В клетке растения, животного и дрожжей есть ядро, окружённое мембраной.", "en": "Bacteria are prokaryotes: they have no nucleus, and their DNA sits in the cytoplasm. Plant, animal and yeast cells all have a nucleus wrapped in a membrane."},null,[{"he": "תא עצב הוא תא אאוקריוטי, ויש בו גרעין עם DNA.", "ar": "خلية العصب خلية حقيقية النوى، وفيها نواة تحتوي DNA.", "ru": "Нервная клетка — эукариотическая, в ней есть ядро с ДНК.", "en": "A nerve cell is a eukaryotic cell and has a nucleus with DNA."}, {"he": "בתא של צמח יש גרעין, וגם כלורופלסטים ודופן.", "ar": "في خلية النبات توجد نواة، وكذلك بلاستيدات خضراء وجدار.", "ru": "В клетке растения есть ядро, а также хлоропласты и стенка.", "en": "A plant cell has a nucleus, and also chloroplasts and a wall."}, null, {"he": "שמרים הם פטריות חד-תאיות אאוקריוטיות, ויש להן גרעין.", "ar": "الخميرة فطر وحيد الخلية حقيقي النوى، ولها نواة.", "ru": "Дрожжи — одноклеточные грибы-эукариоты, и ядро у них есть.", "en": "Yeast are single-celled eukaryotic fungi, and they do have a nucleus."}]),
    Q("cell-1-9",{"he": "מהי רקמה?", "ar": "ما النسيج؟", "ru": "Что такое ткань?", "en": "What is a tissue?"},[{"he": "קבוצת תאים דומים שעושים יחד אותו תפקיד", "ar": "مجموعة خلايا متشابهة تقوم معًا بالوظيفة نفسها", "ru": "Группа похожих клеток, которые вместе выполняют одну задачу", "en": "A group of similar cells that together do the same job"}, {"he": "מולקולה גדולה שנמצאת בתוך התא", "ar": "جزيء كبير موجود داخل الخلية", "ru": "Большая молекула внутри клетки", "en": "A large molecule found inside the cell"}, {"he": "אוסף איברים שעובדים יחד בגוף", "ar": "مجموعة أعضاء تعمل معًا في الجسم", "ru": "Набор органов, работающих вместе в организме", "en": "A set of organs working together in the body"}, {"he": "הקרום שעוטף את התא מבחוץ", "ar": "الغشاء الذي يحيط بالخلية من الخارج", "ru": "Мембрана, которая окружает клетку снаружи", "en": "The membrane that wraps the cell from outside"}],0,{"he": "חשבו מה נמצא בין התא ובין האיבר.", "ar": "فكّروا بما يوجد بين الخلية والعضو.", "ru": "Подумайте, что находится между клеткой и органом.", "en": "Think about what lies between the cell and the organ."},{"he": "רקמה היא קבוצת תאים דומים עם תפקיד משותף. רקמת שריר מתכווצת, ורקמת עצב מעבירה אותות. כמה רקמות יחד מרכיבות איבר, כמו הלב.", "ar": "النسيج مجموعة خلايا متشابهة لها وظيفة مشتركة. النسيج العضلي ينقبض، والنسيج العصبي ينقل إشارات. عدة أنسجة معًا تبني عضوًا، كالقلب.", "ru": "Ткань — это группа похожих клеток с общей задачей. Мышечная ткань сокращается, а нервная передаёт сигналы. Несколько тканей вместе образуют орган, например сердце.", "en": "A tissue is a group of similar cells with a shared job. Muscle tissue contracts and nerve tissue carries signals. Several tissues together make an organ, such as the heart."},null,[null, {"he": "מולקולה קטנה מתא, ורקמה גדולה מתא, ולכן זה הכיוון ההפוך.", "ar": "الجزيء أصغر من الخلية، والنسيج أكبر منها، فهذا الاتجاه المعاكس.", "ru": "Молекула меньше клетки, а ткань больше неё, значит направление обратное.", "en": "A molecule is smaller than a cell and a tissue is larger, so this is the wrong direction."}, {"he": "אוסף איברים הוא מערכת, והיא רמה אחת מעל האיבר ולא רקמה.", "ar": "مجموعة الأعضاء هي جهاز، وهو مستوى أعلى من العضو وليس نسيجًا.", "ru": "Набор органов — это система, уровень выше органа, а не ткань.", "en": "A set of organs is a system, one level above the organ, not a tissue."}, {"he": "קרום התא הוא חלק מתא אחד, ורקמה בנויה מהרבה תאים.", "ar": "غشاء الخلية جزء من خلية واحدة، والنسيج مبني من خلايا كثيرة.", "ru": "Клеточная мембрана — часть одной клетки, а ткань состоит из многих клеток.", "en": "The cell membrane is part of a single cell, while a tissue is made of many cells."}]),
 ],
 [
    Q("cell-2-1",{"he": "מה מהבאים נמצא בתא צמחי ואינו נמצא בתא של בעל חיים?", "ar": "أي مما يلي موجود في الخلية النباتية وغير موجود في خلية الحيوان؟", "ru": "Что из перечисленного есть в растительной клетке, но нет в клетке животного?", "en": "Which of the following is found in a plant cell but not in an animal cell?"},[{"he": "כלורופלסטים ודופן תא מתאית", "ar": "بلاستيدات خضراء وجدار خلية من السليلوز", "ru": "Хлоропласты и клеточная стенка из целлюлозы", "en": "Chloroplasts and a cellulose cell wall"}, {"he": "גרעין תאי וממברנה שעוטפת את התא ומבקרת מה נכנס", "ar": "نواة الخلية وغشاء يحيط بالخلية ويتحكّم بما يدخل إليها", "ru": "Клеточное ядро и мембрана, окружающая клетку и регулирующая вход", "en": "A cell nucleus and a membrane that surrounds the cell and controls entry"}, {"he": "ריבוזומים ומיטוכונדריות", "ar": "ريبوسومات وميتوكوندريا", "ru": "Рибосомы и митохондрии", "en": "Ribosomes and mitochondria"}, {"he": "ציטופלזמה ו-DNA", "ar": "سيتوبلازم وDNA", "ru": "Цитоплазма и ДНК", "en": "Cytoplasm and DNA"}],0,{"he": "איזה אברון קשור לפוטוסינתזה?", "ar": "أي عُضيّة مرتبطة بالتمثيل الضوئي؟", "ru": "Какая органелла связана с фотосинтезом?", "en": "Which organelle is connected to photosynthesis?"},{"he": "כלורופלסטים מבצעים פוטוסינתזה, ודופן התא מעניקה לצמח צורה יציבה. לתאי בעלי חיים אין אף אחד מהשניים, אבל כל שאר האפשרויות קיימות בשני סוגי התאים.", "ar": "البلاستيدات الخضراء تقوم بالتمثيل الضوئي، وجدار الخلية يعطي النبات شكلًا ثابتًا. خلايا الحيوان لا تملك أيًّا منهما، أما الخيارات الأخرى فموجودة في النوعين.", "ru": "Хлоропласты осуществляют фотосинтез, а клеточная стенка придаёт растению устойчивую форму. В клетках животных нет ни того, ни другого, а остальное есть в обоих типах клеток.", "en": "Chloroplasts carry out photosynthesis, and the cell wall gives the plant a stable shape. Animal cells have neither, but all the other options exist in both cell types."},null,[null, {"he": "גרעין וממברנה קיימים גם בתא צמחי וגם בתא של בעל חיים.", "ar": "النواة والغشاء موجودان في الخلية النباتية وفي خلية الحيوان معًا.", "ru": "Ядро и мембрана есть и в растительной, и в животной клетке.", "en": "A nucleus and a membrane are found in both plant and animal cells."}, {"he": "ריבוזומים ומיטוכונדריות נמצאים בשני סוגי התאים, ולכן אינם מבדילים.", "ar": "الريبوسومات والميتوكوندريا موجودة في نوعَي الخلايا، فهي لا تميّز بينهما.", "ru": "Рибосомы и митохондрии есть в обоих типах клеток, поэтому они их не различают.", "en": "Ribosomes and mitochondria are in both cell types, so they do not tell them apart."}, {"he": "ציטופלזמה ו-DNA יש בכל תא חי, גם בתא של בעל חיים.", "ar": "السيتوبلازم والـDNA موجودان في كل خلية حية، وأيضًا في خلية الحيوان.", "ru": "Цитоплазма и ДНК есть в каждой живой клетке, в том числе в животной.", "en": "Cytoplasm and DNA are in every living cell, including animal cells."}]),
    Q("cell-2-2",{"he": "למה תאים הם בדרך כלל קטנים מאוד?", "ar": "لماذا تكون الخلايا عادةً صغيرة جدًا؟", "ru": "Почему клетки обычно очень малы?", "en": "Why are cells usually very small?"},[{"he": "כדי שיחס שטח הפנים לנפח יישאר גדול ויאפשר חילוף חומרים יעיל", "ar": "ليبقى نسبة مساحة السطح إلى الحجم كبيرة فيسهل تبادل المواد", "ru": "Чтобы отношение площади поверхности к объёму оставалось большим и обмен веществ был эффективным", "en": "So the surface area to volume ratio stays large and exchange of materials is efficient"}, {"he": "כי כמות ה-DNA שבגרעין אינה מספיקה כדי לנהל נפח גדול של ציטופלזמה ואברונים", "ar": "لأنّ كمية الـDNA في النواة لا تكفي لإدارة حجم كبير من السيتوبلازم والعُضيّات", "ru": "Потому что количества ДНК в ядре не хватает, чтобы управлять большим объёмом цитоплазмы и органелл", "en": "Because the amount of DNA in the nucleus cannot manage a large volume of cytoplasm and organelles"}, {"he": "כי תא גדול מתחלק מהר יותר ואינו מספיק להגיע לגודל רב", "ar": "لأنّ الخلية الكبيرة تنقسم أسرع ولا تلحق أن تصل إلى حجم كبير", "ru": "Потому что крупная клетка делится быстрее и не успевает сильно вырасти", "en": "Because a large cell divides faster and never gets to grow much"}, {"he": "כי הממברנה נקרעת מעצמה כשהתא עובר גודל מסוים", "ar": "لأنّ الغشاء يتمزّق من تلقاء نفسه حين تتجاوز الخلية حجمًا معيّنًا", "ru": "Потому что мембрана сама рвётся, когда клетка превышает определённый размер", "en": "Because the membrane tears by itself once the cell passes a certain size"}],0,{"he": "חומרים נכנסים ויוצאים דרך שטח הפנים, אבל התא כולו צריך לקבל אותם.", "ar": "المواد تدخل وتخرج عبر سطح الخلية، لكن الخلية كلها تحتاجها.", "ru": "Вещества входят и выходят через поверхность, а нужны они всему объёму клетки.", "en": "Materials enter and leave through the surface, but the whole cell volume needs them."},{"he": "כשתא גדל, הנפח שלו גדל מהר יותר משטח הפנים. אם התא גדול מדי, הממברנה לא מספיקה להעביר חומרים לכל הנפח, ולכן תאים קטנים מחליפים חומרים ביעילות רבה יותר.", "ar": "عندما تكبر الخلية يزداد حجمها أسرع من مساحة سطحها. إذا كانت الخلية كبيرة جدًا لا يكفي الغشاء لنقل المواد إلى كل الحجم، لذلك تتبادل الخلايا الصغيرة المواد بكفاءة أكبر.", "ru": "Когда клетка растёт, её объём увеличивается быстрее, чем площадь поверхности. В слишком большой клетке мембрана не успевает снабжать весь объём, поэтому мелкие клетки обмениваются веществами эффективнее.", "en": "When a cell grows, its volume increases faster than its surface area. In a very large cell the membrane cannot supply the whole volume, so small cells exchange materials more efficiently."},null,[null, {"he": "כמות ה-DNA אינה הגורם המגביל: יש תאים ענקיים עם גרעין אחד.", "ar": "كمية الـDNA ليست العامل المحدِّد: هناك خلايا ضخمة بنواة واحدة.", "ru": "Количество ДНК не ограничивает размер: есть огромные клетки с одним ядром.", "en": "The amount of DNA is not the limit: some huge cells have a single nucleus."}, {"he": "רוב התאים בגוף כמעט אינם מתחלקים, והם נשארים קטנים בכל זאת.", "ar": "معظم خلايا الجسم لا تنقسم تقريبًا، ومع ذلك تبقى صغيرة.", "ru": "Большинство клеток тела почти не делятся, и всё же остаются малыми.", "en": "Most body cells hardly divide at all, yet they still stay small."}, {"he": "הממברנה גמישה ואינה נקרעת מעצמה, ולכן זו אינה הסיבה.", "ar": "الغشاء مرن ولا يتمزّق من تلقاء نفسه، لذلك ليس هذا هو السبب.", "ru": "Мембрана эластична и сама по себе не рвётся, поэтому причина не в этом.", "en": "The membrane is flexible and does not tear by itself, so that is not the reason."}]),
    Q("cell-2-3",{"he": "תא זרע שוחה מרחק ארוך עד הביצית. למה צפוי שיהיו בו הרבה מיטוכונדריות?", "ar": "خلية منوية تسبح مسافة طويلة حتى البويضة. لماذا يُتوقّع أن تكون فيها ميتوكوندريا كثيرة؟", "ru": "Спермий плывёт долгий путь к яйцеклетке. Почему в нём ожидается много митохондрий?", "en": "A sperm cell swims a long way to the egg. Why would it have many mitochondria?"},[{"he": "כי הוא צריך לאחסן הרבה חומר תורשתי לדרך", "ar": "لأنه يحتاج تخزين مادة وراثية كثيرة للطريق", "ru": "Потому что ему нужно запасти много наследственного материала в дорогу", "en": "Because it needs to store a lot of genetic material for the trip"}, {"he": "כי תנועה דורשת הרבה ATP", "ar": "لأن الحركة تستهلك ATP كثيرًا", "ru": "Потому что движение требует много АТФ", "en": "Because movement needs a lot of ATP"}, {"he": "כי הוא צריך להרכיב חלבונים במהירות בדרך", "ar": "لأنه يحتاج بناء بروتينات بسرعة في الطريق", "ru": "Потому что ему надо быстро собирать белки по дороге", "en": "Because it has to assemble proteins quickly on the way"}, {"he": "כי מיטוכונדריות מגדילות את נפח התא", "ar": "لأن الميتوكوندريا تزيد حجم الخلية", "ru": "Потому что митохондрии увеличивают объём клетки", "en": "Because mitochondria make the cell bigger"}],1,{"he": "שאלו מה משותף לתא זרע ולתא שריר שרץ.", "ar": "اسألوا ما المشترك بين خلية منوية وخلية عضلة تركض.", "ru": "Спросите, что общего у спермия и у работающей мышечной клетки.", "en": "Ask what a sperm cell and a working muscle cell have in common."},{"he": "השוט של תא הזרע מתנועע ללא הפסקה, והתנועה הזאת צורכת ATP. המיטוכונדריות מפיקות את ה-ATP, ולכן בתא שעובד קשה יש הרבה מהן. אותו היגיון מסביר מיטוכונדריות רבות בתא שריר.", "ar": "سوط الخلية المنوية يتحرّك بلا توقّف، وهذه الحركة تستهلك ATP. الميتوكوندريا تنتج ATP، لذلك توجد منها كثير في الخلية التي تعمل بجهد. المنطق نفسه يفسّر كثرة الميتوكوندريا في خلية العضلة.", "ru": "Хвост спермия двигается без остановки, и это движение расходует АТФ. Митохондрии производят АТФ, поэтому в тяжело работающей клетке их много. Та же логика объясняет множество митохондрий в мышечной клетке.", "en": "The sperm's tail moves nonstop, and that movement uses up ATP. Mitochondria produce the ATP, so a hard-working cell has many of them. The same logic explains the many mitochondria in a muscle cell."},null,[{"he": "החומר התורשתי שמור בגרעין, ומיטוכונדריות אינן מאחסנות אותו.", "ar": "المادة الوراثية محفوظة في النواة، والميتوكوندريا لا تخزّنها.", "ru": "Наследственный материал хранится в ядре, митохондрии его не хранят.", "en": "The genetic material is kept in the nucleus; mitochondria do not store it."}, null, {"he": "הרכבת חלבונים נעשית בריבוזומים, ותא זרע כמעט אינו בונה חלבון בדרך.", "ar": "بناء البروتينات يحدث في الريبوسومات، والخلية المنوية لا تبني بروتينًا في الطريق تقريبًا.", "ru": "Белки собираются на рибосомах, и спермий в пути почти не строит белок.", "en": "Proteins are assembled on ribosomes, and a sperm cell hardly builds protein on the way."}, {"he": "תא זרע קטן דווקא כדי לשחות מהר, ואברון אינו נוסף כדי להגדיל נפח.", "ar": "الخلية المنوية صغيرة كي تسبح بسرعة، والعُضيّة لا تُضاف لزيادة الحجم.", "ru": "Спермий как раз мал, чтобы быстро плыть, и органеллы не добавляются ради объёма.", "en": "A sperm cell is small precisely so it can swim fast; organelles are not added to add volume."}]),
    Q("cell-2-4",{"he": "כדורית דם אדומה הושמה במים מזוקקים, התנפחה והתפוצצה. מה ההסבר?", "ar": "وُضعت كريّة دم حمراء في ماء مقطّر فانتفخت وانفجرت. ما التفسير؟", "ru": "Эритроцит поместили в дистиллированную воду, он раздулся и лопнул. Каково объяснение?", "en": "A red blood cell was put in distilled water, swelled and burst. What is the explanation?"},[{"he": "מלח יצא מהתא אל המים ולכן התא התנפח", "ar": "خرج الملح من الخلية إلى الماء فانتفخت الخلية", "ru": "Соль вышла из клетки в воду, поэтому клетка раздулась", "en": "Salt left the cell for the water, so the cell swelled"}, {"he": "התא השתמש ב-ATP כדי לשאוב מים פנימה", "ar": "استخدمت الخلية ATP لتضخّ الماء إلى داخلها", "ru": "Клетка использовала АТФ, чтобы закачать воду внутрь", "en": "The cell used ATP to pump water inside"}, {"he": "מים נכנסו לתא בתהליך אוסמוזה", "ar": "دخل الماء إلى الخلية بعملية التناضح", "ru": "Вода вошла в клетку путём осмоса", "en": "Water entered the cell by osmosis"}, {"he": "קרום התא נמס במים ולכן התא נפתח", "ar": "ذاب غشاء الخلية في الماء فانفتحت الخلية", "ru": "Мембрана клетки растворилась в воде, поэтому клетка раскрылась", "en": "The cell membrane dissolved in the water, so the cell opened"}],2,{"he": "השוו את ריכוז המים בתוך התא ומחוצה לו.", "ar": "قارنوا تركيز الماء داخل الخلية وخارجها.", "ru": "Сравните концентрацию воды внутри клетки и снаружи.", "en": "Compare the water concentration inside the cell and outside it."},{"he": "במים מזוקקים ריכוז המים גבוה יותר מאשר בתוך התא. מים עוברים דרך הקרום לכיוון הריכוז הנמוך, התא מתמלא, והלחץ קורע אותו. בתא צמחי זה לא קורה, כי הדופן עומדת בלחץ.", "ar": "في الماء المقطّر تركيز الماء أعلى منه داخل الخلية. يمرّ الماء عبر الغشاء نحو التركيز الأقل، فتمتلئ الخلية ويمزّقها الضغط. في الخلية النباتية لا يحدث ذلك، لأن الجدار يتحمّل الضغط.", "ru": "В дистиллированной воде концентрация воды выше, чем внутри клетки. Вода проходит через мембрану в сторону меньшей концентрации, клетка наполняется, и давление её разрывает. В растительной клетке этого не происходит, потому что стенка выдерживает давление.", "en": "In distilled water the water concentration is higher than inside the cell. Water crosses the membrane towards the lower concentration, the cell fills up, and the pressure tears it. This does not happen in a plant cell, because the wall withstands the pressure."},null,[{"he": "יציאת מלח מקטינה את התא, והוא דווקא התנפח.", "ar": "خروج الملح يصغّر الخلية، وهي قد انتفخت فعلًا.", "ru": "Выход соли уменьшил бы клетку, а она как раз раздулась.", "en": "Salt leaving would shrink the cell, yet the cell swelled."}, {"he": "אוסמוזה היא תנועה ללא השקעת אנרגיה, ואין בה שאיבה.", "ar": "التناضح حركة بلا استهلاك طاقة، ولا ضخّ فيها.", "ru": "Осмос — движение без затраты энергии, никакой откачки в нём нет.", "en": "Osmosis is movement without energy use; there is no pumping in it."}, null, {"he": "קרום התא אינו נמס במים, והוא נקרע מהלחץ שנוצר בפנים.", "ar": "غشاء الخلية لا يذوب في الماء، بل يتمزّق من الضغط الداخلي.", "ru": "Мембрана не растворяется в воде, она разрывается от внутреннего давления.", "en": "The membrane does not dissolve in water; it tears from the pressure built up inside."}]),
    Q("cell-2-5",{"he": "איזה תהליך הובלה בקרום התא דורש השקעת ATP?", "ar": "أي عملية نقل في غشاء الخلية تستهلك ATP؟", "ru": "Какой процесс переноса через мембрану требует затраты АТФ?", "en": "Which transport process across the cell membrane requires ATP?"},[{"he": "דיפוזיה של חמצן לתוך התא", "ar": "انتشار الأكسجين إلى داخل الخلية", "ru": "Диффузия кислорода внутрь клетки", "en": "Diffusion of oxygen into the cell"}, {"he": "אוסמוזה של מים דרך הקרום", "ar": "تناضح الماء عبر الغشاء", "ru": "Осмос воды через мембрану", "en": "Osmosis of water through the membrane"}, {"he": "יציאת פחמן דו-חמצני לפי מפל ריכוזים", "ar": "خروج ثاني أكسيد الكربون حسب فرق التركيز", "ru": "Выход углекислого газа по градиенту концентрации", "en": "Carbon dioxide leaving down the concentration gradient"}, {"he": "הובלה פעילה נגד מפל הריכוזים", "ar": "النقل النشط عكس فرق التركيز", "ru": "Активный транспорт против градиента концентрации", "en": "Active transport against the concentration gradient"}],3,{"he": "חשבו מתי התא דוחף חומר למקום שבו יש ממנו כבר יותר.", "ar": "فكّروا متى تدفع الخلية مادة إلى مكان يوجد فيه منها أكثر.", "ru": "Подумайте, когда клетка толкает вещество туда, где его уже больше.", "en": "Think about when the cell pushes a substance to where there is already more of it."},{"he": "דיפוזיה ואוסמוזה הן תנועה מריכוז גבוה לנמוך, והן אינן צורכות אנרגיה. הובלה פעילה דוחפת חומר לכיוון ההפוך, ולכן היא צורכת ATP. למשל, שאיבת יוני אשלגן אל תוך תא עצב.", "ar": "الانتشار والتناضح حركة من تركيز عالٍ إلى منخفض، ولا تستهلك طاقة. النقل النشط يدفع المادة في الاتجاه المعاكس، لذلك يستهلك ATP. مثلًا، ضخّ أيونات البوتاسيوم إلى داخل خلية العصب.", "ru": "Диффузия и осмос — движение от высокой концентрации к низкой, и энергии они не требуют. Активный транспорт толкает вещество в обратную сторону и поэтому расходует АТФ. Например, закачивание ионов калия в нервную клетку.", "en": "Diffusion and osmosis move substances from high to low concentration and need no energy. Active transport pushes a substance the other way, so it uses ATP. For example, pumping potassium ions into a nerve cell."},null,[{"he": "דיפוזיה היא תנועה לפי מפל הריכוזים, ולכן אינה צורכת אנרגיה.", "ar": "الانتشار حركة حسب فرق التركيز، لذلك لا يستهلك طاقة.", "ru": "Диффузия идёт по градиенту концентрации, поэтому энергии не требует.", "en": "Diffusion follows the concentration gradient, so it needs no energy."}, {"he": "אוסמוזה היא דיפוזיה של מים, והיא קורית גם בתא מת.", "ar": "التناضح انتشار للماء، ويحدث حتى في خلية ميتة.", "ru": "Осмос — это диффузия воды, и он идёт даже в мёртвой клетке.", "en": "Osmosis is the diffusion of water, and it happens even in a dead cell."}, {"he": "פחמן דו-חמצני יוצא לפי מפל הריכוזים, בלי שהתא ישלם על כך.", "ar": "ثاني أكسيد الكربون يخرج حسب فرق التركيز، دون أن تدفع الخلية ثمنًا.", "ru": "Углекислый газ выходит по градиенту, и клетка за это не платит.", "en": "Carbon dioxide leaves down the gradient, with no cost to the cell."}, null]),
    Q("cell-2-6",{"he": "למה תא צמחי אינו מתפוצץ כשמניחים אותו במים מזוקקים?", "ar": "لماذا لا تنفجر الخلية النباتية عند وضعها في ماء مقطّر؟", "ru": "Почему растительная клетка не лопается, если поместить её в дистиллированную воду?", "en": "Why does a plant cell not burst when it is placed in distilled water?"},[{"he": "דופן התא הקשה עומדת בלחץ שנוצר בפנים", "ar": "جدار الخلية الصلب يتحمّل الضغط الناتج في الداخل", "ru": "Жёсткая клеточная стенка выдерживает возникшее внутри давление", "en": "The stiff cell wall withstands the pressure built up inside"}, {"he": "קרום התא של צמח אינו חדיר למים", "ar": "غشاء الخلية النباتية غير نفوذ للماء", "ru": "Мембрана растительной клетки непроницаема для воды", "en": "A plant cell's membrane is not permeable to water"}, {"he": "הכלורופלסטים סופחים את כל המים הנכנסים", "ar": "البلاستيدات الخضراء تمتصّ كل الماء الداخل", "ru": "Хлоропласты впитывают всю входящую воду", "en": "The chloroplasts soak up all the water that enters"}, {"he": "תא צמחי שואב את המים חזרה בעזרת ATP", "ar": "الخلية النباتية تضخّ الماء خارجًا بمساعدة ATP", "ru": "Растительная клетка откачивает воду назад с помощью АТФ", "en": "The plant cell pumps the water back out using ATP"}],0,{"he": "חפשו את החלק שיש בתא צמחי ואין בתא של בעל חיים.", "ar": "ابحثوا عن الجزء الموجود في الخلية النباتية وغير موجود في خلية الحيوان.", "ru": "Найдите часть, которая есть в растительной клетке и отсутствует в животной.", "en": "Look for the part a plant cell has and an animal cell does not."},{"he": "מים נכנסים לתא הצמחי באוסמוזה בדיוק כמו בתא בעל חיים, אבל הדופן הקשה שמחוץ לקרום אינה מאפשרת לתא להתרחב בלי גבול. נוצר לחץ תורגור, והתא נשאר שלם ואף זקוף.", "ar": "يدخل الماء إلى الخلية النباتية بالتناضح كما في خلية الحيوان، لكن الجدار الصلب خارج الغشاء لا يسمح للخلية بالتوسّع بلا حدّ. يتكوّن ضغط الامتلاء، فتبقى الخلية سليمة ومنتصبة.", "ru": "Вода входит в растительную клетку путём осмоса точно так же, как в животную, но жёсткая стенка снаружи мембраны не даёт клетке расширяться без пре
