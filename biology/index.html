, "ar": "بلا ضوء وماء وتربة لا يوجد نظام بيئي، فالكائنات وحدها لا تكفي.", "ru": "Без света, воды и почвы экосистемы нет, поэтому одних животных мало.", "en": "Without light, water and soil there is no ecosystem, so animals alone are not enough."}, {"he": "אדמה ומים הם החלק הדומם בלבד, ובלי יצורים חיים אין מערכת.", "ar": "التربة والماء هما الجزء غير الحيّ فقط، وبلا كائنات حيّة لا يوجد نظام.", "ru": "Почва и вода — только неживая часть; без живых организмов системы нет.", "en": "Soil and water are only the non-living part; with no organisms there is no system."}, {"he": "מין אחד והשטח שלו אינם מערכת: חסרים כאן היחסים עם שאר היצורים.", "ar": "نوع واحد ومساحته ليسا نظامًا: تنقص هنا العلاقات مع سائر الكائنات.", "ru": "Один вид и его участок — не система: нет связей с остальными организмами.", "en": "One species and its patch are not a system: the links with others are missing."}]),
    Q("eco-1-3",{"he": "מה תפקידם של המפרקים באקוסיסטמה?", "ar": "ما وظيفة المُحلِّلات في النظام البيئي؟", "ru": "Какова роль редуцентов в экосистеме?", "en": "What is the role of decomposers in an ecosystem?"},[{"he": "הם מייצרים סוכר מאור השמש", "ar": "هي تنتج السكر من ضوء الشمس", "ru": "Они производят сахар из солнечного света", "en": "They make sugar from sunlight"}, {"he": "הם טורפים את הצרכנים בראש השרשרת", "ar": "هي تفترس المستهلكات في رأس السلسلة", "ru": "Они поедают консументов на вершине цепи", "en": "They prey on the consumers at the top of the chain"}, {"he": "הם מפרקים חומר מת ומחזירים חומרים לקרקע", "ar": "هي تفكّك المادة الميتة وتعيد المواد إلى التربة", "ru": "Они разлагают мёртвое вещество и возвращают вещества в почву", "en": "They break down dead matter and return substances to the soil"}, {"he": "הם מעבירים אנרגיה מהשמש אל הצמחים", "ar": "هي تنقل الطاقة من الشمس إلى النباتات", "ru": "Они переносят энергию от Солнца к растениям", "en": "They carry energy from the sun to the plants"}],2,{"he": "חשבו מה היה קורה לעלים שנושרים ביערות בלעדיהם.", "ar": "فكّروا بما كان سيحدث للأوراق المتساقطة في الغابات بدونها.", "ru": "Подумайте, что было бы с опавшими листьями в лесах без них.", "en": "Think what would happen to fallen leaves in forests without them."},{"he": "מפרקים הם בעיקר חיידקים ופטריות. הם מפרקים גופות, צואה ועלים נושרים, ומשחררים חנקן, זרחן ומינרלים לקרקע. הצמחים סופגים אותם שוב, ולכן בלי מפרקים מחזור החומרים נעצר.", "ar": "المُحلِّلات هي بالأساس بكتيريا وفطريات. تفكّك الجثث والفضلات والأوراق المتساقطة، وتُحرّر النيتروجين والفوسفور والمعادن إلى التربة. وتمتصّها النباتات من جديد، فبلا مُحلِّلات تتوقّف دورة المواد.", "ru": "Редуценты — это в основном бактерии и грибы. Они разлагают останки, помёт и опавшие листья и высвобождают в почву азот, фосфор и минералы. Растения снова их впитывают, поэтому без редуцентов круговорот веществ останавливается.", "en": "Decomposers are mainly bacteria and fungi. They break down dead bodies, droppings and fallen leaves, releasing nitrogen, phosphorus and minerals into the soil. Plants take these up again, so without decomposers the cycle of matter stops."},null,[{"he": "ייצור סוכר מאור הוא תפקיד היצרנים, ולא של המפרקים.", "ar": "إنتاج السكر من الضوء وظيفة المنتِجين، لا المُحلِّلات.", "ru": "Производство сахара из света — задача продуцентов, а не редуцентов.", "en": "Making sugar from light is the producers' job, not the decomposers'."}, {"he": "מפרקים עובדים על חומר מת, והם אינם טורפים יצורים חיים.", "ar": "المُحلِّلات تعمل على المادة الميتة، ولا تفترس كائنات حيّة.", "ru": "Редуценты работают с мёртвым веществом и живых организмов не поедают.", "en": "Decomposers work on dead matter and do not prey on living creatures."}, null, {"he": "אנרגיית השמש נכנסת לאקוסיסטמה דרך הצמחים עצמם, בפוטוסינתזה.", "ar": "طاقة الشمس تدخل النظام البيئي عبر النباتات نفسها، بالتمثيل الضوئي.", "ru": "Энергия Солнца входит в экосистему через сами растения, при фотосинтезе.", "en": "The sun's energy enters the ecosystem through the plants themselves, by photosynthesis."}]),
    Q("eco-1-4",{"he": "מהי אוכלוסייה בביולוגיה?", "ar": "ما المجموعة في علم الأحياء؟", "ru": "Что такое популяция в биологии?", "en": "What is a population in biology?"},[{"he": "כל הפרטים מאותו מין שחיים בשטח מסוים", "ar": "كل أفراد النوع نفسه الذين يعيشون في منطقة معيّنة", "ru": "Все особи одного вида, живущие на определённой территории", "en": "All the individuals of one species living in a given area"}, {"he": "כל היצורים מכל המינים בשטח מסוים", "ar": "كل الكائنات من كل الأنواع في منطقة معيّنة", "ru": "Все организмы всех видов на определённой территории", "en": "All the organisms of every species in a given area"}, {"he": "החי, הצומח והתנאים הדוממים יחד", "ar": "الحيوان والنبات والظروف غير الحيّة معًا", "ru": "Животные, растения и неживые условия вместе", "en": "The animals, plants and non-living conditions together"}, {"he": "שרשרת של יצורים שאוכלים זה את זה", "ar": "سلسلة كائنات يأكل بعضها بعضًا", "ru": "Цепь организмов, которые едят друг друга", "en": "A chain of organisms that eat one another"}],0,{"he": "שימו לב שהמפתח הוא מין אחד, ולא כל מה שחי במקום.", "ar": "انتبهوا أن المفتاح نوع واحد، لا كل ما يعيش في المكان.", "ru": "Обратите внимание: ключ — один вид, а не всё живое в месте.", "en": "Note that the key is one species, not everything living in the place."},{"he": "אוכלוסייה היא פרטים מאותו מין באותו מקום ובאותו זמן, למשל כל הדגים מסוג אמנון בכנרת. כל האוכלוסיות יחד הן חברה, ועם התנאים הדוממים הן אקוסיסטמה. אוכלוסייה נמדדת בגודל, בצפיפות ובקצב הגדילה.", "ar": "المجموعة هي أفراد من النوع نفسه في المكان نفسه والزمن نفسه، مثل كل أسماك المشط في بحيرة طبريا. وكل المجموعات معًا هي المجتمع الحيوي، ومع الظروف غير الحيّة تكون نظامًا بيئيًّا. وتُقاس المجموعة بالحجم والكثافة ومعدّل النموّ.", "ru": "Популяция — это особи одного вида в одном месте и в одно время, например все рыбы-тиляпии в Галилейском море. Все популяции вместе образуют сообщество, а вместе с неживыми условиями — экосистему. Популяцию измеряют размером, плотностью и скоростью роста.", "en": "A population is the individuals of one species in the same place at the same time, for example all the tilapia in the Sea of Galilee. All the populations together form a community, and with the non-living conditions they form an ecosystem. A population is measured by its size, density and growth rate."},null,[null, {"he": "כל המינים יחד הם חברה, ואוכלוסייה היא מין אחד בלבד.", "ar": "كل الأنواع معًا هي المجتمع الحيوي، والمجموعة نوع واحد فقط.", "ru": "Все виды вместе — это сообщество, а популяция — только один вид.", "en": "All the species together form a community; a population is one species only."}, {"he": "חי, צומח ותנאים דוממים יחד הם אקוסיסטמה, והיא רחבה מאוכלוסייה.", "ar": "الحيوان والنبات والظروف غير الحيّة معًا نظام بيئي، وهو أوسع من المجموعة.", "ru": "Животные, растения и неживые условия вместе — экосистема, она шире популяции.", "en": "Animals, plants and non-living conditions together are an ecosystem, broader than a population."}, {"he": "שרשרת אכילה מתארת מי אוכל את מי, ואינה הגדרה של אוכלוסייה.", "ar": "السلسلة الغذائية تصف مَن يأكل مَن، وليست تعريفًا للمجموعة.", "ru": "Пищевая цепь описывает, кто кого ест, и определением популяции не является.", "en": "A food chain describes who eats whom and is not a definition of a population."}]),
    Q("eco-1-5",{"he": "מהו צרכן ראשוני בשרשרת מזון?", "ar": "ما المستهلك الأوّلي في السلسلة الغذائية؟", "ru": "Кто такой первичный потребитель в пищевой цепи?", "en": "What is a primary consumer in a food chain?"},[{"he": "יצור שמייצר את מזונו מאור השמש", "ar": "كائن ينتج غذاءه من ضوء الشمس", "ru": "Организм, производящий себе пищу из солнечного света", "en": "An organism that makes its food from sunlight"}, {"he": "טורף שניזון מצרכנים אחרים", "ar": "مفترس يتغذّى على مستهلكات أخرى", "ru": "Хищник, питающийся другими потребителями", "en": "A predator that feeds on other consumers"}, {"he": "יצור שמפרק חומר מת בקרקע", "ar": "كائن يفكّك المادة الميتة في التربة", "ru": "Организм, разлагающий мёртвое вещество в почве", "en": "An organism that breaks down dead matter in the soil"}, {"he": "יצור שניזון ישירות מהיצרנים", "ar": "كائن يتغذّى مباشرةً على المنتِجين", "ru": "Организм, питающийся непосредственно продуцентами", "en": "An organism that feeds directly on the producers"}],3,{"he": "שאלו מי בא מיד אחרי הצמחים בשרשרת.", "ar": "اسألوا من يأتي مباشرةً بعد النباتات في السلسلة.", "ru": "Спросите, кто идёт сразу после растений в цепи.", "en": "Ask who comes immediately after the plants in the chain."},{"he": "צרכן ראשוני אוכל יצרנים, ולכן הוא בדרך כלל אוכל עשב. למשל: ארנב שאוכל עשב, או זחל שאוכל עלה. מי שאוכל את הארנב הוא צרכן שניוני, והטורף שאוכל אותו הוא שלישוני.", "ar": "المستهلك الأوّلي يأكل المنتِجين، فهو عادةً آكل عشب. مثلًا: أرنب يأكل العشب، أو دودة تأكل ورقة. ومن يأكل الأرنب مستهلك ثانوي، والمفترس الذي يأكله ثالثي.", "ru": "Первичный потребитель ест продуцентов, поэтому обычно он травояден. Например: заяц, поедающий траву, или гусеница, поедающая лист. Тот, кто съедает зайца, — вторичный потребитель, а хищник, съедающий его, — третичный.", "en": "A primary consumer eats producers, so it is usually a herbivore. For example a rabbit eating grass, or a caterpillar eating a leaf. Whoever eats the rabbit is a secondary consumer, and the predator that eats it is tertiary."},null,[{"he": "יצור שמייצר מזון מאור הוא יצרן, ואינו צרכן כלל.", "ar": "الكائن الذي ينتج غذاءه من الضوء منتِج، وليس مستهلكًا أبدًا.", "ru": "Организм, производящий пищу из света, — продуцент, а не потребитель.", "en": "An organism that makes food from light is a producer, not a consumer at all."}, {"he": "טורף שניזון מצרכנים הוא צרכן שניוני או שלישוני, ולא ראשוני.", "ar": "المفترس الذي يتغذّى على المستهلكات ثانوي أو ثالثي، لا أوّلي.", "ru": "Хищник, питающийся потребителями, — вторичный или третичный, а не первичный.", "en": "A predator feeding on consumers is a secondary or tertiary consumer, not primary."}, {"he": "מי שמפרק חומר מת הוא מפרק, והוא אינו אוכל יצרנים חיים.", "ar": "من يفكّك المادة الميتة مُحلِّل، وهو لا يأكل منتِجين أحياء.", "ru": "Тот, кто разлагает мёртвое вещество, — редуцент, живых продуцентов он не ест.", "en": "Whoever breaks down dead matter is a decomposer and does not eat living producers."}, null]),
    Q("eco-1-6",{"he": "מהו מקור האנרגיה של כמעט כל אקוסיסטמה על פני כדור הארץ?", "ar": "ما مصدر الطاقة لكل نظام بيئي تقريبًا على سطح الأرض؟", "ru": "Каков источник энергии почти для любой экосистемы на Земле?", "en": "What is the energy source of almost every ecosystem on Earth?"},[{"he": "חום פנים כדור הארץ", "ar": "حرارة باطن الأرض", "ru": "Тепло недр Земли", "en": "The heat inside the Earth"}, {"he": "אור השמש", "ar": "ضوء الشمس", "ru": "Солнечный свет", "en": "Sunlight"}, {"he": "מינרלים שבקרקע", "ar": "معادن في التربة", "ru": "Минералы в почве", "en": "Minerals in the soil"}, {"he": "מים בנחלים ובאגמים", "ar": "الماء في الجداول والبحيرات", "ru": "Вода в ручьях и озёрах", "en": "Water in streams and lakes"}],1,{"he": "חשבו מה היצרנים קולטים כדי לבנות סוכר.", "ar": "فكّروا بما يمتصّه المنتِجون لبناء السكر.", "ru": "Подумайте, что продуценты поглощают, чтобы построить сахар.", "en": "Think what the producers absorb in order to build sugar."},{"he": "היצרנים קולטים אור וממירים אותו לאנרגיה כימית בסוכר. משם האנרגיה עוברת לצרכנים ולמפרקים, ובכל שלב חלק ממנה אובד כחום. מינרלים ומים חיוניים לחיים אבל אינם מספקים את האנרגיה הזאת.", "ar": "المنتِجون يمتصّون الضوء ويحوّلونه إلى طاقة كيميائية في السكر. ومن هناك تنتقل الطاقة إلى المستهلكات والمُحلِّلات، وفي كل مرحلة يُفقَد جزء منها كحرارة. المعادن والماء ضروريان للحياة لكنهما لا يوفّران هذه الطاقة.", "ru": "Продуценты поглощают свет и превращают его в химическую энергию сахара. Оттуда энергия переходит к потребителям и редуцентам, и на каждом этапе часть её теряется как тепло. Минералы и вода жизненно необходимы, но этой энергии они не дают.", "en": "Producers absorb light and convert it into chemical energy in sugar. From there the energy passes to consumers and decomposers, and at each step part of it is lost as heat. Minerals and water are vital for life but do not supply this energy."},null,[{"he": "חום פנים הארץ מזין רק מערכות נדירות, כמו מעיינות בקרקעית הים.", "ar": "حرارة باطن الأرض تغذّي أنظمة نادرة فقط، كالفوّارات في قاع البحر.", "ru": "Тепло недр питает лишь редкие системы, как источники на дне океана.", "en": "The Earth's inner heat feeds only rare systems, such as vents on the ocean floor."}, null, {"he": "מינרלים הם חומרי בניין לצמח, ואינם נושאים אנרגיה לשרשרת.", "ar": "المعادن مواد بناء للنبات، ولا تحمل طاقة للسلسلة.", "ru": "Минералы — строительный материал для растения и энергии в цепь не вносят.", "en": "Minerals are building material for the plant and bring no energy into the chain."}, {"he": "מים נחוצים לפוטוסינתזה, אבל האנרגיה עצמה באה מהאור.", "ar": "الماء لازم للتمثيل الضوئي، لكن الطاقة نفسها تأتي من الضوء.", "ru": "Вода нужна для фотосинтеза, но сама энергия приходит от света.", "en": "Water is needed for photosynthesis, but the energy itself comes from the light."}]),
    Q("eco-1-7",{"he": "איזה גז קולט הצמח מהאוויר לצורך פוטוסינתזה?", "ar": "أي غاز يأخذه النبات من الهواء للتمثيل الضوئي؟", "ru": "Какой газ растение берёт из воздуха для фотосинтеза?", "en": "Which gas does a plant take from the air for photosynthesis?"},[{"he": "חמצן", "ar": "الأكسجين", "ru": "Кислород", "en": "Oxygen"}, {"he": "חנקן", "ar": "النيتروجين", "ru": "Азот", "en": "Nitrogen"}, {"he": "פחמן דו-חמצני", "ar": "ثاني أكسيد الكربون", "ru": "Углекислый газ", "en": "Carbon dioxide"}, {"he": "מתאן", "ar": "الميثان", "ru": "Метан", "en": "Methane"}],2,{"he": "זהו הגז שאנחנו נושפים, והצמח דווקא צריך אותו.", "ar": "هذا الغاز الذي نُخرجه بالتنفّس، والنبات يحتاجه فعلًا.", "ru": "Это тот газ, который мы выдыхаем, а растению он как раз нужен.", "en": "This is the gas we breathe out, and the plant actually needs it."},{"he": "בפוטוסינתזה הצמח קולט פחמן דו-חמצני דרך פיוניות בעלה, ומים מהשורש. מהם ומאור נבנה סוכר, וחמצן משתחרר לאוויר. לכן ביום יער מעשיר את האוויר בחמצן.", "ar": "في التمثيل الضوئي يأخذ النبات ثاني أكسيد الكربون عبر الثغور في الورقة، والماء من الجذر. ومنهما ومن الضوء يُبنى السكر، ويتحرّر الأكسجين إلى الهواء. لذلك تُغني الغابة الهواء بالأكسجين في النهار.", "ru": "При фотосинтезе растение берёт углекислый газ через устьица листа, а воду — из корня. Из них и из света строится сахар, а кислород выделяется в воздух. Поэтому днём лес обогащает воздух кислородом.", "en": "In photosynthesis the plant takes carbon dioxide in through the pores of the leaf, and water from the root. From these and from light it builds sugar, releasing oxygen into the air. This is why a forest enriches the air with oxygen by day."},null,[{"he": "חמצן הוא התוצר של הפוטוסינתזה, ולא חומר המוצא שלה.", "ar": "الأكسجين ناتج التمثيل الضوئي، لا مادته الأوّلية.", "ru": "Кислород — продукт фотосинтеза, а не его исходное вещество.", "en": "Oxygen is the product of photosynthesis, not its raw material."}, {"he": "חנקן מהאוויר אינו נקלט ישר בצמח, והוא מגיע אליו מהקרקע.", "ar": "النيتروجين من الهواء لا يُمتَصّ مباشرةً في النبات، ويصله من التربة.", "ru": "Азот из воздуха растение прямо не поглощает; он приходит к нему из почвы.", "en": "Nitrogen from the air is not taken straight into the plant; it reaches it from the soil."}, null, {"he": "מתאן אינו משתתף בפוטוסינתזה, והוא גז חממה ממקור אחר.", "ar": "الميثان لا يشارك في التمثيل الضوئي، وهو غاز دفيئة من مصدر آخر.", "ru": "Метан в фотосинтезе не участвует; это парниковый газ другого происхождения.", "en": "Methane plays no part in photosynthesis; it is a greenhouse gas from another source."}]),
    Q("eco-1-8",{"he": "מהו מגוון ביולוגי?", "ar": "ما التنوّع الحيوي؟", "ru": "Что такое биологическое разнообразие?", "en": "What is biodiversity?"},[{"he": "עושר המינים והשוני התורשתי בשטח מסוים", "ar": "ثراء الأنواع والتنوّع الوراثي في منطقة معيّنة", "ru": "Богатство видов и наследственное разнообразие на территории", "en": "The richness of species and the genetic variety in an area"}, {"he": "מספר הפרטים של מין אחד בשטח", "ar": "عدد أفراد نوع واحد في المنطقة", "ru": "Число особей одного вида на территории", "en": "The number of individuals of one species in an area"}, {"he": "כמות המזון שהאקוסיסטמה מספקת בשנה", "ar": "كمية الغذاء التي يوفّرها النظام البيئي في السنة", "ru": "Количество пищи, которое экосистема даёт за год", "en": "The amount of food the ecosystem supplies in a year"}, {"he": "ההפרש בין מספר הלידות למספר מקרי המוות", "ar": "الفرق بين عدد الولادات وعدد الوفيات", "ru": "Разница между числом рождений и числом смертей", "en": "The difference between births and deaths"}],0,{"he": "שאלו אם מדובר במין אחד או בכמה מינים שונים.", "ar": "اسألوا إن كان الحديث عن نوع واحد أم عن أنواع مختلفة.", "ru": "Спросите, речь об одном виде или о разных видах.", "en": "Ask whether this is about one species or about several different ones."},{"he": "מגוון ביולוגי כולל כמה מינים יש, וגם כמה שוני יש בתוך כל מין. מגוון גבוה מייצב את האקוסיסטמה, כי אם מין אחד נפגע אחרים ממלאים את תפקידו. פגיעה בבית הגידול היא הגורם המרכזי לירידה במגוון.", "ar": "التنوّع الحيوي يشمل كم نوعًا يوجد، وكذلك كم تنوّعًا داخل كل نوع. التنوّع العالي يثبّت النظام البيئي، لأنه إذا تضرّر نوع واحد تملأ أنواع أخرى دوره. والإضرار بالموطن هو العامل الرئيسي لانخفاض التنوّع.", "ru": "Биоразнообразие включает и то, сколько видов есть, и то, сколько различий внутри каждого вида. Высокое разнообразие делает экосистему устойчивее: если один вид пострадал, его роль берут другие. Разрушение местообитаний — главная причина падения разнообразия.", "en": "Biodiversity covers how many species there are, and also how much variation there is within each species. High diversity stabilises an ecosystem, because if one species is harmed others fill its role. Habitat damage is the main cause of falling diversity."},null,[null, {"he": "מספר הפרטים של מין אחד הוא גודל אוכלוסייה, ואינו מגוון.", "ar": "عدد أفراد نوع واحد هو حجم المجموعة، وليس تنوّعًا.", "ru": "Число особей одного вида — это размер популяции, а не разнообразие.", "en": "The number of individuals of one species is population size, not diversity."}, {"he": "כמות המזון היא תפוקה של המערכת, ולא מדד למספר המינים בה.", "ar": "كمية الغذاء إنتاجية النظام، وليست مقياسًا لعدد أنواعه.", "ru": "Количество пищи — продуктивность системы, а не мера числа её видов.", "en": "The amount of food is the system's output, not a measure of how many species it holds."}, {"he": "ההפרש בין לידות למקרי מוות קובע אם אוכלוסייה גדלה, ואינו מגוון.", "ar": "الفرق بين الولادات والوفيات يحدّد إن كانت المجموعة تنمو، وليس تنوّعًا.", "ru": "Разница между рождениями и смертями определяет, растёт ли популяция, а не разнообразие.", "en": "The gap between births and deaths tells whether a population is growing, not its diversity."}]),
    Q("eco-1-9",{"he": "מהו מרקם מזון (קורי מזון)?", "ar": "ما الشبكة الغذائية؟", "ru": "Что такое пищевая сеть?", "en": "What is a food web?"},[{"he": "שרשרת אחת ארוכה במיוחד של אוכלים ונאכלים", "ar": "سلسلة واحدة طويلة جدًّا من آكلين ومأكولين", "ru": "Одна особенно длинная цепь поедающих и поедаемых", "en": "One especially long chain of eaters and eaten"}, {"he": "רשימת כל המינים שחיים בשטח מסוים", "ar": "قائمة كل الأنواع التي تعيش في منطقة معيّنة", "ru": "Список всех видов, живущих на территории", "en": "A list of all the species living in an area"}, {"he": "מפה של כמות המזון בכל עונה בשנה", "ar": "خريطة لكمية الغذاء في كل فصل من السنة", "ru": "Карта количества пищи в каждый сезон года", "en": "A map of how much food there is in each season"}, {"he": "הרבה שרשראות מזון שמצטלבות זו בזו", "ar": "سلاسل غذائية كثيرة تتقاطع إحداها مع الأخرى", "ru": "Множество пищевых цепей, пересекающихся друг с другом", "en": "Many food chains that cross one another"}],3,{"he": "חשבו על חיה שאוכלת כמה סוגי מזון ונאכלת בידי כמה טורפים.", "ar": "فكّروا بحيوان يأكل أنواع غذاء عدّة ويأكله عدّة مفترسات.", "ru": "Подумайте о животном, которое ест несколько видов пищи и которого едят несколько хищников.", "en": "Think of an animal that eats several kinds of food and is eaten by several predators."},{"he": "בטבע מעט יצורים ניזונים ממקור אחד בלבד, ולכן השרשראות מצטלבות למרקם. למשל, עכבר אוכל זרעים וחרקים, ואוכלים אותו נחש, ינשוף ושועל. מרקם מורכב יציב יותר, כי פגיעה בחוליה אחת אינה מנתקת את כל האספקה.", "ar": "في الطبيعة قليل من الكائنات تتغذّى من مصدر واحد فقط، لذلك تتقاطع السلاسل في شبكة. مثلًا، الفأر يأكل البذور والحشرات، ويأكله الأفعى والبومة والثعلب. والشبكة المركّبة أكثر ثباتًا، لأن الإضرار بحلقة واحدة لا يقطع التزويد كلّه.", "ru": "В природе мало организмов питается лишь из одного источника, поэтому цепи пересекаются в сеть. Например, мышь ест семена и насекомых, а её едят змея, сова и лиса. Сложная сеть устойчивее, ведь урон одному звену не обрывает всё снабжение.", "en": "In nature few organisms feed from a single source, so the chains cross into a web. A mouse, for example, eats seeds and insects, and is eaten by a snake, an owl and a fox. A complex web is more stable, because harm to one link does not cut off the whole supply."},null,[{"he": "שרשרת אחת ארוכה היא עדיין שרשרת, ומרקם בנוי מכמה שרשראות.", "ar": "السلسلة الطويلة الواحدة لا تزال سلسلة، والشبكة مبنيّة من سلاسل عدّة.", "ru": "Одна длинная цепь — всё ещё цепь, а сеть состоит из нескольких цепей.", "en": "One long chain is still a chain; a web is made of several chains."}, {"he": "רשימת מינים אינה אומרת מי אוכל את מי, וזה עיקר המרקם.", "ar": "قائمة الأنواع لا تقول مَن يأكل مَن، وهذا جوهر الشبكة.", "ru": "Список видов не говорит, кто кого ест, а в этом суть сети.", "en": "A species list does not say who eats whom, and that is the heart of a web."}, {"he": "כמות מזון לפי עונות היא נתון אחר, ואינה מתארת יחסי תזונה.", "ar": "كمية الغذاء حسب الفصول بيان آخر، ولا تصف علاقات التغذية.", "ru": "Количество пищи по сезонам — другой показатель, пищевых связей он не описывает.", "en": "Food quantity by season is a different measure and does not describe feeding relations."}, null]),
 ],
 [
    Q("eco-2-1",{"he": "למה שרשראות מזון קצרות בדרך כלל, עם מעט חוליות?", "ar": "لماذا تكون السلاسل الغذائية قصيرة عادةً بعدد قليل من الحلقات؟", "ru": "Почему пищевые цепи обычно короткие, с малым числом звеньев?", "en": "Why are food chains usually short, with few links?"},[{"he": "כי בכל מעבר לרמה הבאה אובדת רוב האנרגיה, בעיקר כחום", "ar": "لأن معظم الطاقة تضيع عند كل انتقال إلى المستوى التالي، خصوصًا على شكل حرارة", "ru": "Потому что при каждом переходе на следующий уровень теряется большая часть энергии, главным образом в виде тепла", "en": "Because most of the energy is lost at each step to the next level, mainly as heat"}, {"he": "כי הטורפים שבראש השרשרת אוכלים גם את הצמחים וגם את הצרכנים שמתחתיהם", "ar": "لأنّ المفترسات التي في رأس السلسلة تأكل النباتات والمستهلكات التي تحتها معًا", "ru": "Потому что хищники на вершине цепи поедают и все растения, и всех потребителей, которые находятся ниже них в этой цепи", "en": "Because the predators at the top eat both the plants and all the consumers below them"}, {"he": "כי אין מספיק שמש", "ar": "لأنه لا توجد شمس كافية", "ru": "Потому что не хватает Солнца", "en": "Because there is not enough sunshine"}, {"he": "כי מספר הפרטים בכל רמה קבוע ואינו משתנה בין הרמות", "ar": "لأنّ عدد الأفراد في كل مستوى ثابت ولا يتغيّر بين المستويات", "ru": "Потому что число особей на каждом уровне одинаково и не меняется", "en": "Because the number of individuals at each level is fixed and does not change"}],0,{"he": "רק כעשירית מהאנרגיה עוברת לרמה הבאה.", "ar": "ما يقارب عُشر الطاقة فقط ينتقل إلى المستوى التالي.", "ru": "Лишь около десятой части энергии переходит на следующий уровень.", "en": "Only about a tenth of the energy passes to the next level."},{"he": "היצורים משתמשים בחלק גדול מהאנרגיה לחיים, כמו תנועה ונשימה, ומאבדים חום. רק כעשירית נשארת בגוף וזמינה למי שאוכל אותם, ולכן לא נשארת אנרגיה לשרשרת ארוכה מאוד.", "ar": "تستخدم الكائنات جزءًا كبيرًا من الطاقة في الحياة مثل الحركة والتنفس وتفقد حرارة. يبقى نحو العُشر فقط في الجسم ومتاحًا لمن يأكلها، فلا تتبقى طاقة لسلسلة طويلة جدًا.", "ru": "Организмы тратят большую часть энергии на жизнь, например на движение и дыхание, и теряют тепло. В теле остаётся лишь около десятой части, доступной тому, кто их ест, поэтому для очень длинной цепи энергии не хватает.", "en": "Organisms use much of the energy for living, such as moving and breathing, and lose heat. Only about a tenth stays in the body and is available to whoever eats them, so there is no energy left for a very long chain."},null,[null, {"he": "גם אילו הטורפים אכלו הכול, זה לא היה מסביר את אובדן האנרגיה.", "ar": "حتى لو أكلت المفترسات كل شيء، لم يُفسّر ذلك فقدان الطاقة بين المستويات.", "ru": "Даже если бы хищники ели всё, это не объяснило бы потерю энергии.", "en": "Even if predators ate everything, that would not explain the energy lost."}, {"he": "השמש מספקת אנרגיה בשפע, והמגבלה היא באיבוד האנרגיה בכל מעבר.", "ar": "الشمس توفّر طاقة وفيرة، والقيد هو فقدان الطاقة في كل انتقال.", "ru": "Солнце даёт энергии с избытком; предел — её потеря на каждом переходе.", "en": "The sun supplies ample energy; the limit is the energy lost at each transfer."}, {"he": "מספר הפרטים דווקא קטן מרמה לרמה, בדיוק מפני שהאנרגיה אובדת.", "ar": "عدد الأفراد يقلّ من مستوى إلى مستوى بالذات لأنّ الطاقة تُفقد.", "ru": "Число особей как раз убывает от уровня к уровню из-за потери энергии.", "en": "Numbers actually drop from level to level, precisely because energy is lost."}]),
    Q("eco-2-2",{"he": "איזו התאמה מסייעת לבעל חיים במדבר לשמור על מים?", "ar": "أي تكيّف يساعد حيوانًا في الصحراء على الحفاظ على الماء؟", "ru": "Какое приспособление помогает пустынному животному сохранять воду?", "en": "Which adaptation helps a desert animal save water?"},[{"he": "ייצור שתן מרוכז מאוד וצואה יבשה", "ar": "إنتاج بول مركّز جدًا وبراز جاف", "ru": "Выработка очень концентрированной мочи и сухого кала", "en": "Making very concentrated urine and dry feces"}, {"he": "הזעה רבה כדי להתקרר", "ar": "التعرّق الكثير للتبريد", "ru": "Сильное потоотделение для охлаждения", "en": "Sweating a lot to cool down"}, {"he": "עור דק ולח שמאפשר אידוי מהיר של מים מהגוף", "ar": "جلد رقيق ورطب يسمح بتبخّر سريع للماء من الجسم", "ru": "Тонкая влажная кожа, позволяющая воде быстро испаряться с тела", "en": "Thin, moist skin that lets water evaporate quickly from the body"}, {"he": "שתייה רצופה כל היום", "ar": "الشرب المتواصل طوال اليوم", "ru": "Постоянное питьё в течение дня", "en": "Drinking constantly all day"}],0,{"he": "אם מים חסרים, צריך להוציא כמה שפחות מים מהגוף.", "ar": "إذا كان الماء قليلًا فيجب أن يخرج أقل ماء من الجسم.", "ru": "Если воды мало, нужно терять как можно меньше воды.", "en": "If water is scarce, the body must lose as little water as possible."},{"he": "התאמות כמו שתן מרוכז, פעילות בלילה ועור עבה מקטינות איבוד מים. התאמה היא תכונה תורשתית שנבחרה בברירה טבעית לאורך דורות, לא משהו שבעל החיים בחר לעצמו.", "ar": "تكيّفات مثل البول المركّز والنشاط في الليل والجلد السميك تقلّل فقدان الماء. التكيّف صفة وراثية انتُخبت عبر أجيال، وليس شيئًا اختاره الحيوان لنفسه.", "ru": "Приспособления, такие как концентрированная моча, ночная активность и толстая кожа, уменьшают потерю воды. Приспособление — наследственный признак, отобранный за много поколений, а не то, что животное выбрало себе.", "en": "Adaptations such as concentrated urine, night activity and thick skin reduce water loss. An adaptation is a hereditary trait that was selected over many generations, not something the animal chose for itself."},null,[null, {"he": "הזעה אמנם מקררת, אבל היא מוציאה מים, וזה בדיוק מה שחסר במדבר.", "ar": "التعرّق يبرّد فعلًا، لكنه يُخرج الماء، وهذا بالذات ما ينقص في الصحراء.", "ru": "Пот охлаждает, но выводит воду, а её-то в пустыне и не хватает.", "en": "Sweating does cool, but it loses water, which is just what a desert lacks."}, {"he": "עור דק ולח מגביר אידוי, ולכן הוא מאבד מים במקום לשמור עליהם.", "ar": "الجلد الرقيق الرطب يزيد التبخّر، فيفقد الماء بدل أن يحفظه.", "ru": "Тонкая влажная кожа усиливает испарение и теряет воду, а не сберегает.", "en": "Thin, moist skin increases evaporation and loses water instead of saving it."}, {"he": "במדבר אין מים זמינים כל היום, ולכן שתייה רצופה אינה התאמה אפשרית.", "ar": "في الصحراء لا يتوفّر الماء طوال اليوم، فالشرب المتواصل ليس تكيّفًا ممكنًا.", "ru": "В пустыне вода доступна не весь день, поэтому постоянное питьё невозможно.", "en": "In a desert water is not available all day, so constant drinking is no adaptation."}]),
    Q("eco-2-3",{"he": "מאקוסיסטמה הוסר הטורף שבראש השרשרת. מה צפוי לקרות בשנים שאחרי כן?", "ar": "أُزيل من نظام بيئي المفترسُ الذي في رأس السلسلة. ما المتوقّع في السنوات التالية؟", "ru": "Из экосистемы убрали хищника с вершины цепи. Что ожидается в последующие годы?", "en": "The predator at the top of the chain was removed from an ecosystem. What is expected in the years that follow?"},[{"he": "אוכלוסיית אוכלי העשב תקטן בגלל מחסור במזון", "ar": "ستصغر مجموعة آكلات العشب بسبب نقص الغذاء", "ru": "Популяция травоядных уменьшится из-за нехватки корма", "en": "The herbivore population will shrink from lack of food"}, {"he": "הצמחים יגדלו יותר, כי יש פחות טורפים", "ar": "ستنمو النباتات أكثر، لأن المفترسات أقلّ", "ru": "Растения вырастут сильнее, ведь хищников меньше", "en": "The plants will grow more, since there are fewer predators"}, {"he": "אוכלוסיית אוכלי העשב תגדל, ועל כן הצמחייה תידלדל", "ar": "ستكبر مجموعة آكلات العشب، فتتراجع النباتات", "ru": "Популяция травоядных вырастет, и растительность истощится", "en": "The herbivore population will grow, and so the vegetation will be depleted"}, {"he": "לא יהיה שינוי, כי הטורף אינו משפיע על הצמחים", "ar": "لن يكون تغيير، لأن المفترس لا يؤثّر على النباتات", "ru": "Изменений не будет, ведь хищник на растения не влияет", "en": "There will be no change, since the predator does not affect the plants"}],2,{"he": "עקבו אחרי השרשרת שלב אחד למטה, ואז עוד שלב למטה.", "ar": "تابعوا السلسلة درجةً إلى الأسفل، ثم درجةً أخرى.", "ru": "Проследите цепь на одну ступень вниз, а затем ещё на одну.", "en": "Follow the chain one step down, and then one more step down."},{"he": "הטורף מרסן את מספר אוכלי העשב. בלעדיו הם מתרבים, אוכלים יותר צמחים, והצמחייה נפגעת. הדלדול פוגע בסוף גם באוכלי העשב עצמם, וזו שרשרת השפעות שמכונה מפל טרופי.", "ar": "المفترس يكبح عدد آكلات العشب. وبدونه تتكاثر وتأكل نباتات أكثر، فتتضرّر النباتات. والتراجع يضرّ في النهاية آكلات العشب نفسها، وهذه سلسلة تأثيرات تُسمّى الشلّال الغذائي.", "ru": "Хищник сдерживает численность травоядных. Без него они размножаются, едят больше растений, и растительность страдает. В конце истощение бьёт и по самим травоядным — эту цепочку последствий называют трофическим каскадом.", "en": "The predator holds the number of herbivores down. Without it they multiply, eat more plants, and the vegetation suffers. In the end the depletion harms the herbivores themselves, and this chain of effects is called a trophic cascade."},null,[{"he": "הסרת הטורף מסירה לחץ מאוכלי העשב, ולכן מספרם עולה ולא יורד.", "ar": "إزالة المفترس تُزيل الضغط عن آكلات العشب، فيرتفع عددها لا ينخفض.", "ru": "Удаление хищника снимает давление с травоядных, поэтому их число растёт, а не падает.", "en": "Removing the predator lifts the pressure off the herbivores, so their number rises, not falls."}, {"he": "הטורף אינו אוכל צמחים, ולכן הסרתו אינה מיטיבה עם הצמחייה.", "ar": "المفترس لا يأكل النباتات، فإزالته لا تُفيد النباتات.", "ru": "Хищник растений не ест, поэтому его удаление растительности не помогает.", "en": "The predator does not eat plants, so removing it does not benefit the vegetation."}, null, {"he": "הטורף משפיע על הצמחים דרך אוכלי העשב, ולכן יש השפעה עקיפה.", "ar": "المفترس يؤثّر على النباتات عبر آكلات العشب، فهناك تأثير غير مباشر.", "ru": "Хищник влияет на растения через травоядных, значит косвенное влияние есть.", "en": "The predator affects the plants through the herbivores, so there is an indirect effect."}]),
    Q("eco-2-4",{"he": "למה כמות האנרגיה קטנה בכל מעבר לדרגה גבוהה יותר בשרשרת המזון?", "ar": "لماذا تقلّ كمية الطاقة عند كل انتقال إلى درجة أعلى في السلسلة الغذائية؟", "ru": "Почему количество энергии уменьшается при каждом переходе на более высокий уровень пищевой цепи?", "en": "Why does the amount of energy fall at each step up the food chain?"},[{"he": "רוב האנרגיה מנוצלת לפעולות חיים ואובדת כחום", "ar": "معظم الطاقة تُستخدَم لأعمال الحياة وتُفقَد كحرارة", "ru": "Большая часть энергии идёт на процессы жизни и теряется как тепло", "en": "Most of the energy is used for life processes and lost as heat"}, {"he": "האנרגיה נשארת בקרקע ואינה עולה כלל בשרשרת המזון", "ar": "تبقى الطاقة في التربة ولا ترتفع أبدًا في السلسلة الغذائية", "ru": "Энергия остаётся в почве и по пищевой цепи вовсе не поднимается", "en": "The energy stays in the soil and does not go up the food chain at all"}, {"he": "הצרכנים אוכלים פחות מדי כדי לקבל אנרגיה", "ar": "المستهلكات تأكل قليلًا جدًّا للحصول على طاقة", "ru": "Потребители едят слишком мало, чтобы получить энергию", "en": "The consumers eat too little to get energy"}, {"he": "האנרגיה נהרסת לגמרי בכל מעבר", "ar": "تُدمَّر الطاقة تمامًا في كل انتقال", "ru": "Энергия полностью уничтожается при каждом переходе", "en": "The energy is destroyed completely at each step"}],0,{"he": "חשבו לאן הולכת האנרגיה שאדם צורך בארוחה, מלבד לגדילה.", "ar": "فكّروا إلى أين تذهب الطاقة التي يستهلكها الإنسان في وجبة، غير النموّ.", "ru": "Подумайте, куда уходит энергия съеденного обеда, помимо роста.", "en": "Think where the energy from a meal goes, besides growth."},{"he": "יצור משתמש ברוב האנרגיה שאכל לנשימה, לתנועה ולשמירה על חום, וכל אלה משתחררים כחום לסביבה. רק כעשירית נאגרת בגוף ועוברת לדרגה הבאה. בגלל זה פירמידת האנרגיה צרה למעלה, ושרשראות קצרות.", "ar": "الكائن يستخدم معظم الطاقة التي أكلها للتنفّس والحركة وحفظ الحرارة، وكلها تتحرّر كحرارة إلى المحيط. ونحو العشر فقط يُخزَّن في الجسم وينتقل إلى الدرجة التالية. لهذا هرم الطاقة ضيّق في أعلاه، والسلاسل قصيرة.", "ru": "Организм расходует большую часть съеденной энергии на дыхание, движение и поддержание тепла, и всё это уходит теплом в среду. Лишь около десятой части запасается в теле и переходит на следующий уровень. Поэтому пирамида энергии узка сверху, а цепи коротки.", "en": "An organism spends most of the energy it eats on respiration, movement and keeping warm, and all of this leaves as heat. Only about a tenth is stored in the body and passes to the next level. This is why the energy pyramid is narrow at the top and chains are short."},null,[null, {"he": "אנרגיה כן עוברת בשרשרת כשחיה אוכלת חיה, והאובדן הוא כחום.", "ar": "الطاقة تنتقل في السلسلة عندما يأكل حيوان حيوانًا، والفقد يكون كحرارة.", "ru": "Энергия по цепи передаётся, когда животное ест животное, а потеря идёт теплом.", "en": "Energy does pass along the chain when an animal eats an animal; the loss is as heat."}, {"he": "צרכנים אוכלים הרבה, ובכל זאת רוב האנרגיה אינה נאגרת בגופם.", "ar": "المستهلكات تأكل كثيرًا، ومع ذلك لا يُخزَّن معظم الطاقة في أجسامها.", "ru": "Потребители едят много, и всё же большая часть энергии в их телах не запасается.", "en": "Consumers eat plenty, yet most of the energy is still not stored in their bodies."}, {"he": "אנרגיה אינה נהרסת, והיא עוברת לצורה אחרת, בעיקר חום.", "ar": "الطاقة لا تُدمَّر، بل تتحوّل إلى شكل آخر، وبالأساس حرارة.", "ru": "Энергия не уничтожается, она переходит в другую форму, в основном в тепло.", "en": "Energy is not destroyed; it changes form, mostly into heat."}]),
    Q("eco-2-5",{"he": "מה היה קורה לאקוסיסטמה אילו כל המפרקים נעלמו ממנה?", "ar": "ماذا كان سيحدث لنظام بيئي لو اختفت منه كل المُحلِّلات؟", "ru": "Что произошло бы с экосистемой, если бы из неё исчезли все редуценты?", "en": "What would happen to an ecosystem if all its decomposers disappeared?"},[{"he": "הצמחים היו גדלים טוב יותר בלי תחרות", "ar": "كانت النباتات تنمو أفضل بلا منافسة", "ru": "Растения росли бы лучше без конкуренции", "en": "The plants would grow better without competition"}, {"he": "חומר מת היה נערם, והמינרלים לא היו חוזרים לקרקע", "ar": "كانت المادة الميتة تتكدّس، ولا تعود المعادن إلى التربة", "ru": "Мёртвое вещество накапливалось бы, а минералы в почву не возвращались", "en": "Dead matter would pile up, and the minerals would not return to the soil"}, {"he": "הטורפים היו נעלמים ראשונים מהמערכת", "ar": "كانت المفترسات تختفي أوّلًا من النظام", "ru": "Хищники исчезли бы из системы первыми", "en": "The predators would be the first to vanish from the system"}, {"he": "שום דבר לא היה משתנה, כי הם אינם חלק מהשרשרת", "ar": "لم يكن شيء يتغيّر، لأنها ليست جزءًا من السلسلة", "ru": "Ничего не изменилось бы, ведь они не часть цепи", "en": "Nothing would change, since they are not part of the chain"}],1,{"he": "שאלו מאיפה הצמח מקבל חנקן וזרחן.", "ar": "اسألوا من أين يحصل النبات على النيتروجين والفوسفور.", "ru": "Спросите, откуда растение берёт азот и фосфор.", "en": "Ask where a plant gets its nitrogen and phosphorus."},{"he": "מפרקים הם החוליה שסוגרת את מחזור החומרים. בלעדיהם גופות ועלים היו מצטברים, והחנקן והזרחן היו נשארים כבולים בחומר המת. הצמחים היו נותרים בלי מינרלים, וכל השרשרת שמעליהם היתה נפגעת.", "ar": "المُحلِّلات هي الحلقة التي تُغلق دورة المواد. بدونها كانت الجثث والأوراق تتراكم، ويبقى النيتروجين والفوسفور محبوسين في المادة الميتة. وكانت النباتات تبقى بلا معادن، فتتضرّر كل السلسلة التي فوقها.", "ru": "Редуценты — звено, замыкающее круговорот веществ. Без них останки и листья накапливались бы, а азот и фосфор оставались бы запертыми в мёртвом веществе. Растения остались бы без минералов, и вся цепь над ними пострадала бы.", "en": "Decomposers are the link that closes the cycle of matter. Without them bodies and leaves would pile up, and the nitrogen and phosphorus would stay locked in dead matter. The plants would be left without minerals, and the whole chain above them would suffer."},null,[{"he": "מפרקים אינם מתחרים בצמחים, ואף מספקים להם מינרלים.", "ar": "المُحلِّلات لا تنافس النباتات، بل توفّر لها المعادن.", "ru": "Редуценты с растениями не конкурируют, а даже снабжают их минералами.", "en": "Decomposers do not compete with plants; they even supply them with minerals."}, null, {"he": "הפגיעה מתחילה בצמחים, שבסיס המזון שלהם נפגע, ולא בטורפים.", "ar": "الضرر يبدأ بالنباتات، التي يتضرّر أساس غذائها، لا بالمفترسات.", "ru": "Урон начинается с растений, чья питательная база страдает, а не с хищников.", "en": "The damage starts with the plants, whose nutrient base is hit, not with the predators."}, {"he": "מפרקים הם חוליה הכרחית בשרשרת, והם סוגרים את מחזור החומרים.", "ar": "المُحلِّلات حلقة ضرورية في السلسلة، وهي تُغلق دورة المواد.", "ru": "Редуценты — необходимое звено цепи, они замыкают круговорот веществ.", "en": "Decomposers are an essential link in the chain; they close the cycle of matter."}]),
    Q("eco-2-6",{"he": "למה שני מינים שמתחרים על אותו מזון בדיוק מתקשים להתקיים יחד לאורך זמן?", "ar": "لماذا يصعب على نوعين يتنافسان على الغذاء نفسه بالضبط أن يتعايشا مدّة طويلة؟", "ru": "Почему двум видам, конкурирующим за точно тот же корм, трудно долго существовать вместе?", "en": "Why do two species competing for exactly the same food struggle to coexist for long?"},[{"he": "כי מינים אינם יכולים לחיות באותו שטח כלל", "ar": "لأن الأنواع لا تستطيع العيش في المنطقة نفسها أبدًا", "ru": "Потому что виды вовсе не могут жить на одной территории", "en": "Because species cannot live in the same area at all"}, {"he": "כי תחרות גורמת לשני המינים להיעלם יחד", "ar": "لأن المنافسة تجعل النوعين يختفيان معًا", "ru": "Потому что конкуренция приводит к исчезновению обоих видов", "en": "Because competition makes both species disappear together"}, {"he": "כי מינים מתחרים מתאחדים למין אחד", "ar": "لأن الأنواع المتنافسة تتّحد في نوع واحد", "ru": "Потому что конкурирующие виды сливаются в один вид", "en": "Because competing species merge into one species"}, {"he": "כי מי שמנצל את המשאב טוב יותר משאיר לאחר פחות מזון", "ar": "لأن من يستغلّ المورد أفضل يترك للآخر غذاءً أقلّ", "ru": "Потому что тот, кто лучше использует ресурс, оставляет другому меньше корма", "en": "Because whoever uses the resource better leaves the other less food"}],3,{"he": "חשבו על שתי חנויות שמוכרות אותו דבר באותו רחוב.", "ar": "فكّروا بدكّانين يبيعان الشيء نفسه في الشارع نفسه.", "ru": "Подумайте о двух магазинах, продающих одно и то же на одной улице.", "en": "Think of two shops selling the same thing on the same street."},{"he": "כשהמשאב מוגבל, המין היעיל יותר משיג יותר מזון, גדל מהר יותר ומשאיר למין השני פחות. אוכלוסיית המין החלש מצטמצמת, ולפעמים הוא נדחק מהשטח. בטבע מינים דומים לרוב מתמחים אחרת, למשל נזונים בשעות שונות או בגבהים שונים.", "ar": "عندما يكون المورد محدودًا، يحصل النوع الأكفأ على غذاء أكثر وينمو أسرع ويترك للنوع الآخر أقلّ. تتقلّص مجموعة النوع الأضعف، وأحيانًا يُدفَع خارج المنطقة. وفي الطبيعة تتخصّص الأنواع المتشابهة عادةً بشكل مختلف، كالتغذية في ساعات مختلفة أو بارتفاعات مختلفة.", "ru": "Когда ресурс ограничен, более эффективный вид получает больше корма, растёт быстрее и оставляет другому меньше. Популяция слабого вида сокращается, а иногда он вытесняется с территории. В природе похожие виды обычно специализируются иначе, например кормятся в разное время или на разной высоте.", "en": "When the resource is limited, the more efficient species gets more food, grows faster and leaves the other less. The weaker species' population shrinks, and sometimes it is pushed out of the area. In nature similar species usually specialise differently, feeding at different hours or at different heights."},null,[{"he": "מינים רבים חיים יחד באותו שטח, כל עוד הם אינם מתחרים על אותו משאב.", "ar": "أنواع كثيرة تعيش معًا في المنطقة نفسها، ما لم تتنافس على المورد نفسه.", "ru": "Многие виды живут вместе на одной территории, пока не конкурируют за один ресурс.", "en": "Many species live together in one area, as long as they do not compete for the same resource."}, {"he": "בתחרות בדרך כלל אחד נדחק, ואין סיבה ששניהם ייעלמו.", "ar": "في المنافسة يُدفَع أحدهما عادةً، ولا سبب لاختفاء كليهما.", "ru": "В конкуренции обычно вытесняется один; обоим исчезать нет причины.", "en": "In competition one is usually pushed out; there is no reason for both to vanish."}, {"he": "מינים נפרדים אינם מתאחדים, כי אין ביניהם צאצאים פוריים.", "ar": "الأنواع المنفصلة لا تتّحد، لأنه لا نسل خصيب بينها.", "ru": "Отдельные виды не сливаются, ведь плодовитого потомства между ними нет.", "en": "Separate species do not merge, because there is no fertile offspring between them."}, null]),
    Q("eco-2-7",{"he": "חומר הדברה נמצא בריכוז גבוה בעיקר בדגים הגדולים שבראש השרשרת. למה?", "ar": "وُجدت مادة مكافحة بتركيز عالٍ بالأساس في الأسماك الكبيرة التي في رأس السلسلة. لماذا؟", "ru": "Пестицид обнаружили в высокой концентрации главным образом у крупных рыб на вершине цепи. Почему?", "en": "A pesticide was found in high concentration mainly in the large fish at the top of the chain. Why?"},[{"he": "דגים גדולים סופחים את החומר ישר מהמים ולא מהמזון", "ar": "الأسماك الكبيرة تمتصّ المادة من الماء مباشرةً لا من الغذاء", "ru": "Крупные рыбы впитывают вещество прямо из воды, а не из пищи", "en": "Large fish absorb the substance straight from the water and not from food"}, {"he": "החומר נוצר בגוף הדגים הגדולים בלבד", "ar": "المادة تتكوّن في أجسام الأسماك الكبيرة فقط", "ru": "Вещество образуется только в телах крупных рыб", "en": "The substance is made only inside the large fish"}, {"he": "החומר אינו מתפרק, וטורף אוכל פרטים רבים שכל אחד נושא מעט", "ar": "المادة لا تتفكّك، والمفترس يأكل أفرادًا كثيرة يحمل كل منها قليلًا", "ru": "Вещество не распадается, а хищник съедает множество особей, каждая с малой дозой", "en": "The substance is not broken down, and a predator eats many prey, each carrying a little"}, {"he": "דגים גדולים חיים זמן קצר ולכן הריכוז בהם גבוה", "ar": "الأسماك الكبيرة تعيش زمنًا قصيرًا فيكون التركيز فيها عاليًا", "ru": "Крупные рыбы живут недолго, поэтому концентрация в них высокая", "en": "Large fish live only a short time, so the concentration in them is high"}],2,{"he": "חשבו כמה דגים קטנים דג גדול אוכל במהלך חייו.", "ar": "فكّروا كم سمكة صغيرة يأكل سمكٌ كبير في حياته.", "ru": "Подумайте, сколько мелких рыб крупная рыба съедает за жизнь.", "en": "Think how many small fish a large fish eats in its lifetime."},{"he": "חומר שאינו מתפרק ואינו מופרש נשאר בגוף. דג גדול אוכל מאות דגים קטנים, ולכן הוא אוסף את כל המטען שלהם. התהליך נקרא הגדלה ביולוגית, והוא הסיבה שהריכוז עולה מדרגה לדרגה.", "ar": "المادة التي لا تتفكّك ولا تُطرَح تبقى في الجسم. والسمك الكبير يأكل مئات الأسماك الصغيرة، فيجمع حملها كلّه. وتُسمّى هذه العملية التضخيم الحيوي، وهي سبب ارتفاع التركيز من درجة إلى درجة.", "ru": "Вещество, которое не распадается и не выводится, остаётся в теле. Крупная рыба съедает сотни мелких рыб и потому собирает весь их груз. Процесс называют биологическим накоплением, и он объясняет рост концентрации от уровня к уровню.", "en": "A substance that is neither broken down nor excreted stays in the body. A large fish eats hundreds of small fish, and so collects all of their load. The process is called biomagnification, and it is why the concentration climbs from level to level."},null,[{"he": "גם דגים קטנים חיים באותם מים, והריכוז הגבוה מופיע דווקא למעלה.", "ar": "الأسماك الصغيرة تعيش في الماء نفسه، والتركيز العالي يظهر في الأعلى تحديدًا.", "ru": "Мелкие рыбы живут в той же воде, а высокая концентрация появляется именно наверху.", "en": "Small fish live in the same water, yet the high concentration appears specifically at the top."}, {"he": "חומר הדברה בא מבחוץ, ואין יצור שמייצר אותו בגופו.", "ar": "مادة المكافحة تأتي من الخارج، ولا كائن ينتجها في جسمه.", "ru": "Пестицид приходит извне, и организм, который его производит, не существует.", "en": "A pesticide comes from outside; no organism makes it in its body."}, null, {"he": "דגים גדולים חיים דווקא זמן ארוך, ולכן הם מצטברים לאורך שנים.", "ar": "الأسماك الكبيرة تعيش زمنًا طويلًا، لذلك تتراكم فيها المادة سنين.", "ru": "Крупные рыбы живут как раз долго, поэтому вещество накапливается в них годами.", "en": "Large fish in fact live a long time, which is why the substance builds up in them over years."}]),
    Q("eco-2-8",{"he": "למה לצמחים שגדלים בצל קרקעית היער עלים רחבים ודקים?", "ar": "لماذا للنباتات التي تنمو في ظلّ أرضية الغابة أوراق عريضة ورقيقة؟", "ru": "Почему у растений, растущих в тени лесной подстилки, листья широкие и тонкие?", "en": "Why do plants growing in the shade of the forest floor have broad, thin leaves?"},[{"he": "עלה רחב קולט יותר אור מהמעט שמגיע למטה", "ar": "الورقة العريضة تمتصّ ضوءًا أكثر من القليل الذي يصل للأسفل", "ru": "Широкий лист ловит больше того малого света, что доходит вниз", "en": "A broad leaf catches more of the little light that reaches down there"}, {"he": "עלה רחב מקטין את אובדן המים בצל", "ar": "الورقة العريضة تقلّل فقدان الماء في الظلّ", "ru": "Широкий лист уменьшает потерю воды в тени", "en": "A broad leaf reduces water loss in the shade"}, {"he": "עלה דק אינו צריך פוטוסינתזה בכלל", "ar": "الورقة الرقيقة لا تحتاج التمثيل الضوئي أبدًا", "ru": "Тонкому листу фотосинтез вовсе не нужен", "en": "A thin leaf does not need photosynthesis at all"}, {"he": "עלה רחב מגן על הצמח מפני טורפים ומפני מזיקים", "ar": "الورقة العريضة تحمي النبات من المفترسات ومن الآفات", "ru": "Широкий лист защищает растение от поедателей и от вредителей", "en": "A broad leaf protects the plant from grazers and from pests"}],0,{"he": "חשבו מה המשאב הנדיר ביותר מתחת לצמרות היער.", "ar": "فكّروا بأندر مورد تحت قمم الغابة.", "ru": "Подумайте, какой ресурс самый редкий под кронами леса.", "en": "Think which resource is scarcest under the forest canopy."},{"he": "בצל האור הוא הגורם המגביל, ולכן עלה גדול ושטוח הוא התאמה שמגדילה את שטח הקליטה. בשמש הפתוחה המגבלה היא דווקא מים, ולכן צמחי מדבר מפתחים עלים קטנים או קוצים. אותה תכונה יכולה להועיל בסביבה אחת ולהזיק באחרת.", "ar": "في الظلّ يكون الضوء العامل المحدّد، فالورقة الكبيرة المسطّحة تكيّف يُكبّر مساحة الامتصاص. وفي الشمس المكشوفة يكون الماء هو المحدّد، لذلك تُطوّر نباتات الصحراء أوراقًا صغيرة أو أشواكًا. والصفة نفسها قد تفيد في بيئة وتضرّ في أخرى.", "ru": "В тени свет — ограничивающий фактор, поэтому крупный плоский лист — приспособление, увеличивающее площадь поглощения. На открытом солнце ограничивает как раз вода, поэтому растения пустыни отращивают мелкие листья или колючки. Один и тот же признак может быть полезен в одной среде и вреден в другой.", "en": "In shade, light is the limiting factor, so a large flat leaf is an adaptation that increases the collecting area. In open sun it is water that limits, which is why desert plants develop small leaves or spines. The same trait can help in one environment and harm in another."},null,[null, {"he": "שטח עלה גדול מגדיל אובדן מים, ולכן זה אינו היתרון כאן.", "ar": "مساحة الورقة الكبيرة تزيد فقدان الماء، فليست هذه الفائدة هنا.", "ru": "Большая площадь листа увеличивает потерю воды, значит выгода не в этом.", "en": "A large leaf area increases water loss, so that is not the advantage here."}, {"he": "כל צמח ירוק צריך פוטוסינתזה, וגם בצל הוא מייצר סוכר.", "ar": "كل نبات أخضر يحتاج التمثيل الضوئي، وهو ينتج السكر حتى في الظلّ.", "ru": "Любому зелёному растению фотосинтез нужен, и в тени оно тоже делает сахар.", "en": "Every green plant needs photosynthesis and makes sugar in the shade too."}, {"he": "עלה רחב אינו הגנה מטורפים או ממזיקים, ואף נוח יותר לאכילה.", "ar": "الورقة العريضة ليست حمايةً من المفترسات ولا من الآفات، بل أسهل للأكل.", "ru": "Широкий лист не защита ни от поедателей, ни от вредителей — его даже легче съесть.", "en": "A broad leaf is no defence against grazers or pests; it is in fact easier to eat."}]),
    Q("eco-2-9",{"he": "למה חיידקים מקבעי חנקן חשובים לצמחים?", "ar": "لماذا بكتيريا تثبيت النيتروجين مهمّة للنباتات؟", "ru": "Почему азотфиксирующие бактерии важны для растений?", "en": "Why are nitrogen-fixing bacteria important to plants?"},[{"he": "הם מספקים לצמח סוכר ואנרגיה שהוא אינו מייצר לבדו", "ar": "هي توفّر للنبات سكرًا وطاقة لا ينتجهما وحده", "ru": "Они дают растению сахар и энергию, которые оно само не производит", "en": "They supply the plant with sugar and energy it cannot make alone"}, {"he": "הם הופכים חנקן מהאוויר לצורה שהצמח יכול לספוג", "ar": "هي تحوّل نيتروجين الهواء إلى صورة يستطيع النبات امتصاصها", "ru": "Они переводят азот воздуха в форму, которую растение может впитать", "en": "They turn nitrogen from the air into a form the plant can absorb"}, {"he": "הם מגנים על שורשי הצמח מפני טורפים", "ar": "هي تحمي جذور النبات من المفترسات", "ru": "Они защищают корни растения от поедателей", "en": "They protect the plant's roots from grazers"}, {"he": "הם מעבירים אור אל השורשים שבקרקע", "ar": "هي تنقل الضوء إلى الجذور في التربة", "ru": "Они проводят свет к корням в почве", "en": "They carry light down to the roots in the soil"}],1,{"he": "חנקן יש באוויר בשפע, אבל הצמח אינו יכול לקחת אותו משם.", "ar": "النيتروجين متوفّر بكثرة في الهواء، لكن النبات لا يستطيع أخذه من هناك.", "ru": "Азота в воздухе много, но растение взять его оттуда не может.", "en": "Nitrogen is plentiful in the air, but the plant cannot take it from there."},{"he": "חנקן חיוני לחלבונים ול-DNA, אבל הצמח אינו יכול להשתמש בגז החנקן שבאוויר. חיידקים מקבעי חנקן, שחיים בקרקע או בפקעיות על שורשי קטניות, הופכים אותו לתרכובות שהצמח סופח. בגלל זה קטניות מעשירות את הקרקע.", "ar": "النيتروجين ضروري للبروتينات وDNA، لكن النبات لا يستطيع استخدام غاز النيتروجين في الهواء. وبكتيريا تثبيت النيتروجين، التي تعيش في التربة أو في عُقيدات على جذور البقوليات، تحوّله إلى مركّبات يمتصّها النبات. لهذا تُغني البقوليات التربة.", "ru": "Азот необходим для белков и ДНК, но газообразный азот воздуха растение использовать не может. Азотфиксирующие бактерии, живущие в почве или в клубеньках на корнях бобовых, превращают его в соединения, которые растение впитывает. Поэтому бобовые обогащают почву.", "en": "Nitrogen is essential for proteins and DNA, but a plant cannot use the nitrogen gas in the air. Nitrogen-fixing bacteria, living in the soil or in nodules on the roots of legumes, turn it into compounds the plant can absorb. This is why legumes enrich the soil."},null,[{"he": "הצמח מייצר את הסוכר שלו בפוטוסינתזה, ואף נותן ממנו לחיידקים.", "ar": "النبات ينتج سكره بالتمثيل الضوئي، بل يعطي منه للبكتيريا.", "ru": "Растение производит свой сахар при фотосинтезе и даже делится им с бактериями.", "en": "The plant makes its own sugar by photosynthesis and even shares it with the bacteria."}, null, {"he": "הגנה מפני טורפים אינה תפקידם, והקשר נוגע לאספקת חנקן.", "ar": "الحماية من المفترسات ليست وظيفتها، والعلاقة تتعلّق بتزويد النيتروجين.", "ru": "Защита от поедателей — не их задача; связь касается снабжения азотом.", "en": "Protection from grazers is not their job; the relationship is about supplying nitrogen."}, {"he": "אור אינו מועבר בקרקע, ושורשים אינם מבצעים פוטוסינתזה.", "ar": "الضوء لا يُنقَل في التربة، والجذور لا تقوم بالتمثيل الضوئي.", "ru": "Свет в почве не передаётся, и корни фотосинтеза не ведут.", "en": "Light is not carried through soil, and roots do not photosynthesise."}]),
 ],
 [
    Q("eco-3-1",{"he": "מינים פולשים הוכנסו לאגם וצמצמו את אוכלוסיית הדגים המקומיים. מה הסיבה הסבירה?", "ar": "أُدخلت أنواع غازية إلى بحيرة وقلّلت مجموعة الأسماك المحلية. ما السبب المرجّح؟", "ru": "В озеро завезли инвазивные виды, и популяция местных рыб сократилась. Какова вероятная причина?", "en": "Invasive species were introduced into a lake and the local fish population shrank. What is the likely reason?"},[{"he": "תחרות על מזון ומקום, או טריפה של המין המקומי", "ar": "منافسة على الغذاء والمكان أو افتراس النوع المحلي", "ru": "Конкуренция за пищу и место либо хищничество по отношению к местному виду", "en": "Competition for food and space, or preying on the local species"}, {"he": "המין הפולש העשיר את האגם בחומרי מזון והגדיל את כמות המזון", "ar": "النوع الغازي أثرى البحيرة بالموادّ الغذائية وزاد كمّية الغذاء", "ru": "Чужой вид обогатил озеро питательными веществами и увеличил количество корма", "en": "The invasive species enriched the lake with nutrients and increased the food"}, {"he": "הדגים המקומיים נעשים טורפים", "ar": "الأسماك المحلية تصبح مفترسة", "ru": "Местные рыбы становятся хищниками", "en": "The local fish become predators"}, {"he": "ההשפעה נובעת מזיהום המים ולא מהמין הפולש", "ar": "التأثير ناتج عن تلوّث الماء لا عن النوع الغازي", "ru": "Влияние вызвано загрязнением воды, а не чужим видом", "en": "The effect comes from water pollution, not from the invasive species"}],0,{"he": "משאבים כמו מזון ומחסה מוגבלים, ובאגם יש עכשיו יותר יצורים שצריכים אותם.", "ar": "الموارد مثل الغذاء والمأوى محدودة، وفي البحيرة الآن كائنات أكثر تحتاجها.", "ru": "Ресурсы, такие как пища и укрытие, ограничены, а теперь в озере больше организмов, которым они нужны.", "en": "Resources such as food and shelter are limited, and the lake now has more organisms that need them."},{"he": "מין זר שלא נתקל בטורפים ובמחלות מהמקום עלול להתרבות מהר ולתפוס את המשאבים. כך הוא מקטין את אוכלוסיית המין המקומי ופוגע במאזן המערכת כולה.", "ar": "نوع غريب لم يواجه المفترسات والأمراض المحلية قد يتكاثر بسرعة ويستحوذ على الموارد. هكذا يقلّل مجموعة النوع المحلي ويضرّ بتوازن النظام كله.", "ru": "Чужой вид, не встретивший местных хищников и болезней, может быстро размножиться и занять ресурсы. Так он сокращает популяцию местного вида и нарушает равновесие всей системы.", "en": "A foreign species that meets no local predators or diseases can multiply fast and take over resources. This shrinks the local species' population and upsets the balance of the whole system."},null,[null, {"he": "יותר מזון היה מגדיל את אוכלוסיית הדגים, ולא מצמצם אותה.", "ar": "زيادة الغذاء كانت ستُكبِر أعداد الأسماك لا تُقلّلها.", "ru": "Больше корма увеличило бы, а не уменьшило популяцию рыб.", "en": "More food would have increased the fish population, not reduced it."}, {"he": "הדגים המקומיים לא שינו את אורח חייהם: הם אלה שנפגעו.", "ar": "الأسماك المحلّية لم تغيّر نمط حياتها: هي التي تضرّرت.", "ru": "Местные рыбы не изменили образ жизни: именно они пострадали.", "en": "The native fish did not change their way of life: they are the ones harmed."}, {"he": "הנתון בשאלה מצביע על הכנסת המין הפולש, ולא על זיהום מים.", "ar": "المعطى في السؤال يشير إلى إدخال النوع الغازي، لا إلى تلوّث الماء.", "ru": "Данные в вопросе указывают на вселение чужого вида, а не на загрязнение.", "en": "The information in the question points to the invasive species, not pollution."}]),
    Q("eco-3-2",{"he": "גרף גדילה של אוכלוסייה עולה במהירות ואז נעשה כמעט אופקי. מה מסביר את השלב האופקי?", "ar": "منحنى نمو مجموعة يرتفع بسرعة ثم يصبح شبه أفقي. ما الذي يفسّر المرحلة الأفقية؟", "ru": "График роста популяции быстро растёт, а затем становится почти горизонтальным. Что объясняет горизонтальный участок?", "en": "A population growth graph rises quickly and then becomes almost flat. What explains the flat stage?"},[{"he": "הגעה ליכולת הנשיאה של הסביבה, כי המשאבים מוגבלים", "ar": "الوصول إلى السعة الاستيعابية للبيئة لأن الموارد محدودة", "ru": "Достижение ёмкости среды, так как ресурсы ограничены", "en": "Reaching the carrying capacity of the environment, because resources are limited"}, {"he": "מספר הלידות ומספר מקרי המוות ירדו שניהם לאפס בדיוק באותו זמן", "ar": "عدد الولادات وعدد الوفيات انخفضا كلاهما إلى الصفر في الوقت نفسه بالضبط", "ru": "Число рождений и число смертей одновременно упали ровно до нуля", "en": "Both the number of births and the number of deaths dropped to zero at exactly the same time"}, {"he": "הפסקת הרבייה אחרי שכל הפרטים הגיעו לגיל מבוגר", "ar": "توقّف التكاثر بعد أن بلغ كل الأفراد سنّ الكبر", "ru": "Прекращение размножения после того, как все особи стали взрослыми", "en": "Reproduction stopping after all the individuals reached old age"}, {"he": "טעות במדידה שנמשכה לאורך כל תקופת המעקב", "ar": "خطأ في القياس استمرّ طوال فترة المتابعة", "ru": "Ошибка измерения, длившаяся весь период наблюдения", "en": "A measurement error that lasted through the whole monitoring period"}],0,{"he": "מה מגביל אוכלוסייה שגדלה בלי הפסקה, מזון ומקום?", "ar": "ما الذي يحدّ مجموعة تنمو بلا توقف، الغذاء والمكان؟", "ru": "Что ограничивает постоянно растущую популяцию — пища и место?", "en": "What limits a population that keeps growing — food and space?"},{"he": "כשהאוכלוסייה גדלה, המשאבים כמו מזון ומקום הולכים ומתמעטים, ושיעור הלידה יורד או שיעור המוות עולה. האוכלוסייה מתייצבת סביב מה שהסביבה מסוגלת לשאת, וזה נקרא יכולת נשיאה.", "ar": "عندما تكبر المجموعة تقلّ الموارد كالغذاء والمكان، فينخفض معدل الولادة أو يرتفع معدل الموت. تستقر المجموعة حول ما تستطيع البيئة تحمّله، ويسمى السعة الاستيعابية.", "ru": "Когда популяция растёт, ресурсов — пищи и места — становится меньше, рождаемость падает или смертность растёт. Популяция стабилизируется около того, что способна выдержать среда, — это ёмкость среды.", "en": "As a population grows, resources such as food and space run short, and the birth rate falls or the death rate rises. The population levels off around what the environment can support, called the carrying capacity."},null,[null, {"he": "לידות ומוות נמשכים גם בשלב האופקי, והם פשוט מאזנים זה את זה.", "ar": "الولادات والوفيات تستمرّ في المرحلة الأفقية، وهي ببساطة توازن بعضها بعضًا.", "ru": "Рождения и смерти продолжаются и на плато; они просто уравновешивают друг друга.", "en": "Births and deaths continue on the flat part; they simply balance each other out."}, {"he": "באוכלוסייה יש פרטים בכל הגילים, ולכן הרבייה אינה נפסקת בבת אחת.", "ar": "في الوسط السكّاني أفراد من كل الأعمار، فالتكاثر لا يتوقّف دفعة واحدة.", "ru": "В популяции есть особи всех возрастов, поэтому размножение не прекращается.", "en": "A population has individuals of all ages, so reproduction does not stop at once."}, {"he": "העקומה הזאת חוזרת באוכלוסיות רבות, ולכן אינה טעות מדידה אלא תופעה.", "ar": "هذا المنحنى يتكرّر في أوساط سكّانية كثيرة، فهو ليس خطأ قياس بل ظاهرة.", "ru": "Такая кривая повторяется у многих популяций, значит это не ошибка, а явление.", "en": "This curve repeats in many populations, so it is not an error but a phenomenon."}]),
    Q("eco-3-3",{"he": "דשן מהשדות נשטף לאגם. אצות פרחו, וכמה שבועות אחר כך הדגים מתו. מה ההסבר?", "ar": "جُرف سماد من الحقول إلى بحيرة. ازدهرت الطحالب، وبعد أسابيع ماتت الأسماك. ما التفسير؟", "ru": "Удобрение с полей смыло в озеро. Водоросли разрослись, а через несколько недель рыба погибла. Каково объяснение?", "en": "Fertiliser from the fields washed into a lake. Algae bloomed, and a few weeks later the fish died. What is the explanation?"},[{"he": "הדשן עצמו רעיל לדגים ברמה שנמדדה", "ar": "السماد نفسه سامّ للأسماك بالمستوى المقيس", "ru": "Удобрение само по себе токсично для рыбы в измеренной концентрации", "en": "The fertiliser itself is toxic to fish at the level measured"}, {"he": "האצות אכלו את הדגים הקטנים שבאגם", "ar": "الطحالب أكلت الأسماك الصغيرة في البحيرة", "ru": "Водоросли съели мелкую рыбу в озере", "en": "The algae ate the small fish in the lake"}, {"he": "האצות מתו, מפרקים התרבו וצרכו את החמצן שבמים", "ar": "ماتت الطحالب، فتكاثرت المُحلِّلات واستهلكت الأكسجين في الماء", "ru": "Водоросли погибли, редуценты размножились и израсходовали кислород воды", "en": "The algae died, decomposers multiplied and used up the water's oxygen"}, {"he": "האצות חסמו את הדגים מלהגיע אל קרקעית האגם", "ar": "الطحالب منعت الأسماك من الوصول إلى قاع البحيرة", "ru": "Водоросли преградили рыбе путь ко дну озера", "en": "The algae blocked the fish from reaching the lake bed"}],2,{"he": "שאלו מה קורה במים כשכמות עצומה של חומר אורגני מתחילה להתפרק.", "ar": "اسألوا ما يحدث في الماء عندما تبدأ كمية هائلة من المادة العضوية بالتفكّك.", "ru": "Спросите, что происходит в воде, когда огромная масса органики начинает разлагаться.", "en": "Ask what happens in water when a huge mass of organic matter starts to break down."},{"he": "הדשן הוסיף חנקן וזרחן, ולכן האצות התרבו במהירות. אחרי שהן מתו, חיידקי הפירוק התרבו גם הם, והנשימה שלהם צרכה את החמצן המומס. הדגים נחנקו מחוסר חמצן, וזה התהליך שנקרא איוטרופיקציה.", "ar": "أضاف السماد نيتروجينًا وفوسفورًا، فتكاثرت الطحالب بسرعة. وبعد موتها تكاثرت بكتيريا التفكيك أيضًا، واستهلك تنفّسها الأكسجين المذاب. فخُنقت الأسماك من نقص الأكسجين، وهذه العملية تُسمّى الإثراء الغذائي.", "ru": "Удобрение добавило азот и фосфор, поэтому водоросли быстро размножились. После их гибели размножились и бактерии-разрушители, а их дыхание израсходовало растворённый кислород. Рыба задохнулась от недостатка кислорода — этот процесс называют эвтрофикацией.", "en": "The fertiliser added nitrogen and phosphorus, so the algae multiplied fast. After they died the decomposing bacteria multiplied too, and their respiration used up the dissolved oxygen. The fish suffocated from lack of oxygen, and this process is called eutrophication."},null,[{"he": "הדשן מזין ואינו רעל, והנזק נגרם דרך שרשרת של תהליכים.", "ar": "السماد مُغذٍّ وليس سمًّا، والضرر حدث عبر سلسلة من العمليات.", "ru": "Удобрение питательно, а не ядовито; вред возник через цепочку процессов.", "en": "Fertiliser is a nutrient and not a poison; the harm came through a chain of processes."}, {"he": "אצות הן יצרנים ואינן אוכלות דגים, ולכן אינן טורפות.", "ar": "الطحالب منتِجات ولا تأكل الأسماك، فهي ليست مفترسة.", "ru": "Водоросли — продуценты, рыбу они не едят и хищниками не являются.", "en": "Algae are producers and do not eat fish, so they are not predators."}, null, {"he": "הדגים מתו מחוסר חמצן, ולא ממחסום פיזי בדרך לקרקעית.", "ar": "ماتت الأسماك من نقص الأكسجين، لا من حائل مادّي في الطريق إلى القاع.", "ru": "Рыба погибла от недостатка кислорода, а не от физической преграды к дну.", "en": "The fish died of oxygen shortage, not from a physical barrier on the way down."}]),
    Q("eco-3-4",{"he": "בגרף של שתי אוכלוסיות, שיא הטורפים מופיע תמיד זמן קצר אחרי שיא הנטרפים. מה זה מראה?", "ar": "في رسم لمجموعتين، تظهر قمّة المفترسات دائمًا بعد قمّة الفرائس بقليل. على ماذا يدلّ ذلك؟", "ru": "На графике двух популяций пик хищников всегда появляется вскоре после пика жертв. Что это показывает?", "en": "In a graph of two populations, the predator peak always appears shortly after the prey peak. What does this show?"},[{"he": "מספר הטורפים תלוי בכמות המזון שהיתה זמינה", "ar": "عدد المفترسات يعتمد على كمية الغذاء التي كانت متاحة", "ru": "Число хищников зависит от того, сколько корма было доступно", "en": "The number of predators depends on how much food was available"}, {"he": "הטורפים קובעים מתי הנטרפים יתרבו", "ar": "المفترسات تحدّد متى تتكاثر الفرائس", "ru": "Хищники определяют, когда жертвы будут размножаться", "en": "The predators decide when the prey will breed"}, {"he": "שתי האוכלוסיות אינן קשורות זו לזו", "ar": "المجموعتان غير مرتبطتين إحداهما بالأخرى", "ru": "Две популяции между собой не связаны", "en": "The two populations are unrelated"}, {"he": "הנטרפים אוכלים את הטורפים בעונה אחרת", "ar": "الفرائس تأكل المفترسات في فصل آخر", "ru": "Жертвы поедают хищников в другой сезон", "en": "The prey eat the predators in another season"}],0,{"he": "שאלו מה בא קודם בזמן: המזון או מי שאוכל אותו.", "ar": "اسألوا ما يأتي أوّلًا في الزمن: الغذاء أم من يأكله.", "ru": "Спросите, что раньше во времени: корм или тот, кто его ест.", "en": "Ask which comes first in time: the food or the one that eats it."},{"he": "כשיש הרבה נטרפים, הטורפים מוצאים מזון בשפע, שורדים טוב יותר ומתרבים, ולכן מספרם עולה בפיגור של זמן. אחר כך הלחץ על הנטרפים גובר, מספרם יורד, ובעקבותיו יורד גם מספר הטורפים. זהו מחזור חוזר של עליות וירידות.", "ar": "عندما تكثر الفرائس تجد المفترسات غذاءً وفيرًا، فتبقى أفضل وتتكاثر، فيرتفع عددها بتأخّر زمني. ثم يزداد الضغط على الفرائس فينخفض عددها، ويتبعه انخفاض عدد المفترسات. وهذه دورة متكرّرة من ارتفاعات وانخفاضات.", "ru": "Когда жертв много, хищники находят корм в изобилии, лучше выживают и размножаются, поэтому их число растёт с задержкой. Затем давление на жертв усиливается, их число падает, а за ним падает и число хищников. Это повторяющийся цикл подъёмов и спадов.", "en": "When prey are plentiful the predators find abundant food, survive better and breed, so their numbers rise with a time lag. Then the pressure on the prey grows, their numbers fall, and the predator numbers fall after them. This is a repeating cycle of rises and falls."},null,[null, {"he": "הפיגור בזמן מראה שהנטרפים משפיעים על הטורפים, ולא ההפך בסדר הזה.", "ar": "التأخّر الزمني يبيّن أن الفرائس تؤثّر على المفترسات، لا العكس بهذا الترتيب.", "ru": "Временная задержка показывает, что жертвы влияют на хищников, а не наоборот в этом порядке.", "en": "The time lag shows the prey affect the predators, not the other way round in this order."}, {"he": "הקשר הקבוע בין שני השיאים אינו מקרי, ומראה תלות ברורה.", "ar": "الصلة الثابتة بين القمّتين ليست مصادفة، وتبيّن ارتباطًا واضحًا.", "ru": "Постоянная связь между двумя пиками не случайна и показывает явную зависимость.", "en": "The consistent link between the two peaks is not accidental and shows a clear dependence."}, {"he": "נטרפים אינם אוכלים את הטורפים שלהם, והגרף אינו מראה זאת.", "ar": "الفرائس لا تأكل مفترساتها، والرسم لا يُظهر ذلك.", "ru": "Жертвы своих хищников не едят, и график этого не показывает.", "en": "Prey do not eat their predators, and the graph does not show that."}]),
    Q("eco-3-5",{"he": "בשני מטעים זהים כוסה אחד ברשת שמנעה כניסת חרקים. בסוף העונה היבול בו היה נמוך בהרבה. מה ההסבר?", "ar": "في بستانين متماثلين غُطّي أحدهما بشبكة منعت دخول الحشرات. في نهاية الموسم كان محصوله أقلّ بكثير. ما التفسير؟", "ru": "Из двух одинаковых садов один накрыли сеткой, не пускавшей насекомых. К концу сезона урожай в нём был намного ниже. Каково объяснение?", "en": "Of two identical orchards, one was covered with a net that kept insects out. By the end of the season its yield was far lower. What is the explanation?"},[{"he": "הרשת חסמה את אור השמש והפחיתה פוטוסינתזה", "ar": "الشبكة حجبت ضوء الشمس فقلّلت التمثيل الضوئي", "ru": "Сетка загородила солнечный свет и снизила фотосинтез", "en": "The net blocked sunlight and reduced photosynthesis"}, {"he": "החרקים היו מזיקים, ולכן היבול היה צריך לעלות", "ar": "الحشرات كانت ضارّة، فكان المحصول يجب أن يرتفع", "ru": "Насекомые были вредителями, значит урожай должен был вырасти", "en": "The insects were pests, so the yield should have risen"}, {"he": "הרשת מנעה מהעצים לקבל מים מהגשם", "ar": "الشبكة منعت الأشجار من الحصول على ماء المطر", "ru": "Сетка не дала деревьям получить воду от дождя", "en": "The net stopped the trees getting water from the rain"}, {"he": "בלי חרקים לא היתה האבקה, ולכן נוצרו פחות פירות", "ar": "بلا حشرات لم يحدث تلقيح، فنتجت ثمار أقلّ", "ru": "Без насекомых не было опыления, поэтому плодов образовалось меньше", "en": "Without insects there was no pollination, so fewer fruits formed"}],3,{"he": "שאלו איזה שירות חרקים נותנים לעץ פרי, מלבד נזק.", "ar": "اسألوا أي خدمة تقدّمها الحشرات لشجرة الفاكهة، إلى جانب الضرر.", "ru": "Спросите, какую услугу насекомые оказывают плодовому дереву, помимо вреда.", "en": "Ask what service insects give a fruit tree, besides damage."},{"he": "פרי נוצר רק אחרי שהאבקה הגיעה מפרח לפרח, ודבורים וחרקים אחרים עושים את ההעברה. הרשת מנעה אותם, ולכן פרחים רבים לא הואבקו ונשרו. הניסוי מראה שהחרקים האלה הם שירות אקולוגי ולא רק מזיקים.", "ar": "تتكوّن الثمرة فقط بعد وصول حبوب اللقاح من زهرة إلى زهرة، والنحل وحشرات أخرى تقوم بالنقل. الشبكة منعتها، فلم تُلقَّح أزهار كثيرة وتساقطت. تُظهر التجربة أن هذه الحشرات خدمة بيئية لا مجرّد آفات.", "ru": "Плод образуется только после того, как пыльца попала с цветка на цветок, а переносят её пчёлы и другие насекомые. Сетка их не пускала, поэтому многие цветки не опылились и опали. Опыт показывает, что эти насекомые — экологическая услуга, а не только вредители.", "en": "A fruit forms only after pollen has travelled from flower to flower, and bees and other insects do the carrying. The net kept them out, so many flowers were never pollinated and fell. The experiment shows these insects are an ecological service and not merely pests."},null,[{"he": "רשת מצלה במעט, וירידה חדה ביבול אינה מוסברת בכך.", "ar": "الشبكة تُظلّل قليلًا، والانخفاض الحادّ في المحصول لا يُفسَّر بذلك.", "ru": "Сетка затеняет слегка, и резкое падение урожая этим не объяснить.", "en": "A net shades a little, and a sharp drop in yield is not explained by that."}, {"he": "אילו היו רק מזיקים, היבול תחת הרשת היה עולה, והוא ירד.", "ar": "لو كانت آفات فقط، لارتفع المحصول تحت الشبكة، وقد انخفض.", "ru": "Если бы они были только вредителями, урожай под сеткой вырос бы, а он упал.", "en": "If they were only pests, the yield under the net would rise, and it fell."}, {"he": "רשת מעבירה מים, והשקיה והגשם הגיעו לשני המטעים.", "ar": "الشبكة تمرّر الماء، والسقاية والمطر وصلا البستانين.", "ru": "Сетка воду пропускает, и полив с дождём дошли до обоих садов.", "en": "A net lets water through, and irrigation and rain reached both orchards."}, null]),
    Q("eco-3-6",{"he": "במדרון שעליו נכרת היער נשטפה האדמה בגשם הראשון, ובמדרון השכן לא. מה ההסבר?", "ar": "في منحدر قُطعت غابته جُرفت التربة في أوّل مطر، وفي المنحدر المجاور لم تُجرَف. ما التفسير؟", "ru": "На склоне, где вырубили лес, почву смыло первым дождём, а на соседнем склоне — нет. Каково объяснение?", "en": "On a slope where the forest was felled, the soil washed away in the first rain, while on the neighbouring slope it did not. What is the explanation?"},[{"he": "הגשם היה חזק יותר דווקא במדרון שנכרת", "ar": "كان المطر أقوى في المنحدر الذي قُطع تحديدًا", "ru": "Дождь был сильнее именно на вырубленном склоне", "en": "The rain happened to be heavier on the felled slope"}, {"he": "שורשי העצים החזיקו את הקרקע, והצמרות ריככו את מכת הגשם", "ar": "جذور الأشجار كانت تُثبّت التربة، والقمم تخفّف وقع المطر", "ru": "Корни деревьев держали почву, а кроны смягчали удар дождя", "en": "The tree roots held the soil, and the canopy softened the rain's impact"}, {"he": "כריתת עצים מוסיפה מלח לאדמה ומפוררת אותה", "ar": "قطع الأشجار يضيف ملحًا إلى التربة ويفتّتها", "ru": "Вырубка добавляет в почву соль и рассыпает её", "en": "Felling trees adds salt to the soil and crumbles it"}, {"he": "בלי עצים הקרקע סופחת יותר מים ולכן נשארת במקום", "ar": "بلا أشجار تمتصّ التربة ماءً أكثر فتبقى في مكانها", "ru": "Без деревьев почва впитывает больше воды и потому остаётся на месте", "en": "Without trees the soil absorbs more water and so stays in place"}],1,{"he": "חשבו מה מחזיק גרגרי אדמה במקומם במדרון תלול.", "ar": "فكّروا بما يُثبّت حبيبات التربة في مكانها على منحدر شديد.", "ru": "Подумайте, что держит частицы почвы на месте на крутом склоне.", "en": "Think what holds soil grains in place on a steep slope."},{"he": "שורשים יוצרים רשת שמחזיקה את הקרקע, והצמרות קולטות את עוצמת הטיפות לפני שהן פוגעות באדמה. אחרי כריתה אין רשת ואין מגן, ולכן מי הגשם סוחפים את השכבה הפורייה. אובדן הקרקע מקשה על צמחייה לחזור, וזה מחזור שמחמיר את עצמו.", "ar": "الجذور تُنشئ شبكة تُثبّت التربة، والقمم تمتصّ قوّة القطرات قبل ارتطامها بالأرض. وبعد القطع لا شبكة ولا واقي، فتجرف مياه المطر الطبقة الخصبة. وفقدان التربة يُصعّب عودة النباتات، وهذه دورة تُفاقم نفسها.", "ru": "Корни образуют сеть, которая держит почву, а кроны гасят силу капель до удара о землю. После вырубки нет ни сети, ни защиты, поэтому дождевая вода уносит плодородный слой. Потеря почвы затрудняет возвращение растительности — это цикл, усугубляющий сам себя.", "en": "Roots form a mesh that holds the soil, and the canopy absorbs the force of the drops before they hit the ground. After felling there is neither mesh nor shield, so rainwater carries the fertile layer away. Losing the soil makes it harder for vegetation to return, a cycle that worsens itself."},null,[{"he": "שני המדרונות שכנים וקיבלו גשם דומה, ולכן ההבדל אינו בגשם.", "ar": "المنحدران متجاوران ونالا مطرًا مشابهًا، فالفرق ليس في المطر.", "ru": "Склоны соседние и получили похожий дождь, значит разница не в дожде.", "en": "The slopes are neighbours and got similar rain, so the difference is not the rain."}, null, {"he": "כריתה אינה מוסיפה מלח, והנזק הוא סחיפה מכנית של הקרקע.", "ar": "القطع لا يضيف ملحًا، والضرر جرف ميكانيكي للتربة.", "ru": "Вырубка соли не добавляет; вред — механический смыв почвы.", "en": "Felling adds no salt; the damage is a mechanical washing away of soil."}, {"he": "בלי עצים הקרקע סופחת פחות מים, כי השורשים והחומר האורגני חסרים.", "ar": "بلا أشجار تمتصّ التربة ماءً أقلّ، لأن الجذور والمادة العضوية ناقصة.", "ru": "Без деревьев почва впитывает меньше воды, ведь корней и органики не хватает.", "en": "Without trees the soil absorbs less water, because the roots and organic matter are missing."}]),
    Q("eco-3-7",{"he": "באקוסיסטמה היצרנים אגרו 10,000 יחידות אנרגיה, אוכלי העשב 1,000, והטורפים 100. מה אפשר לומר על המעבר בין הדרגות?", "ar": "في نظام بيئي خزّن المنتِجون 10,000 وحدة طاقة، وآكلات العشب 1,000، والمفترسات 100. ما يمكن قوله عن الانتقال بين الدرجات؟", "ru": "В экосистеме продуценты запасли 10 000 единиц энергии, травоядные — 1000, хищники — 100. Что можно сказать о переходе между уровнями?", "en": "In an ecosystem the producers stored 10,000 energy units, the herbivores 1,000 and the predators 100. What can be said about the transfer between levels?"},[{"he": "כמחצית האנרגיה עוברת בכל שלב", "ar": "نحو نصف الطاقة ينتقل في كل مرحلة", "ru": "Около половины энергии переходит на каждом шаге", "en": "About half the energy passes at each step"}, {"he": "כל האנרגיה עוברת, רק בצורה אחרת", "ar": "كل الطاقة تنتقل، لكن بصورة أخرى", "ru": "Вся энергия переходит, только в другой форме", "en": "All the energy passes, only in another form"}, {"he": "כעשירית בלבד עוברת, והשאר אובדת בעיקר כחום", "ar": "العُشر فقط ينتقل، والباقي يُفقَد بالأساس كحرارة", "ru": "Переходит лишь около десятой части, остальное теряется в основном теплом", "en": "Only about a tenth passes, and the rest is lost mainly as heat"}, {"he": "האנרגיה גדלה בכל דרגה כי הטורפים גדולים יותר", "ar": "الطاقة تزيد في كل درجة لأن المفترسات أكبر", "ru": "Энергия растёт на каждом уровне, ведь хищники крупнее", "en": "The energy grows at each level because the predators are bigger"}],2,{"he": "חשבו ביחס בין המספרים, ולא בהפרש שביניהם.", "ar": "فكّروا في النسبة بين الأرقام، لا في الفرق بينها.", "ru": "Думайте об отношении между числами, а не о разнице.", "en": "Think about the ratio between the numbers, not the difference."},{"he": "מ-10,000 ל-1,000 ומ-1,000 ל-100 הירידה היא פי עשר בכל שלב, כלומר מעבר של כעשרה אחוזים. רוב האנרגיה מנוצלת לנשימה, לתנועה ולחום, וחלקה אינו נאכל כלל. בגלל זה אין בטבע שרשראות של שמונה חוליות.", "ar": "من 10,000 إلى 1,000 ومن 1,000 إلى 100 يكون الهبوط عشرة أضعاف في كل مرحلة، أي انتقال نحو عشرة بالمئة. معظم الطاقة تُستخدَم للتنفّس والحركة والحرارة، وجزء منها لا يُؤكَل أبدًا. لهذا لا توجد في الطبيعة سلاسل من ثماني حلقات.", "ru": "С 10 000 до 1000 и с 1000 до 100 падение десятикратное на каждом шаге, то есть переходит около десяти процентов. Большая часть энергии идёт на дыхание, движение и тепло, а часть вовсе не съедается. Поэтому в природе нет цепей из восьми звеньев.", "en": "From 10,000 to 1,000 and from 1,000 to 100 the drop is tenfold at each step, that is a transfer of about ten percent. Most of the energy goes to respiration, movement and heat, and some is never eaten at all. This is why nature holds no chains of eight links."},null,[{"he": "מחצית פירושה ירידה מ-10,000 ל-5,000, והמספרים מראים ירידה חדה בהרבה.", "ar": "النصف يعني هبوطًا من 10,000 إلى 5,000، والأرقام تُظهر هبوطًا أشدّ بكثير.", "ru": "Половина означала бы спад с 10 000 до 5000, а числа показывают куда более резкий спад.", "en": "Half would mean a drop from 10,000 to 5,000, and the numbers show a far sharper drop."}, {"he": "הדרגה הבאה אוגרת עשירית בלבד, ולכן אי אפשר לומר שהכול עבר אליה.", "ar": "الدرجة التالية تخزّن العُشر فقط، فلا يصحّ القول إن كل شيء انتقل إليها.", "ru": "Следующий уровень запасает лишь десятую часть, поэтому сказать, что всё перешло, нельзя.", "en": "The next level stores only a tenth, so it cannot be said that everything passed to it."}, null, {"he": "המספרים יורדים ולא עולים, וגודל הגוף אינו מוסיף אנרגיה למערכת.", "ar": "الأرقام تنخفض ولا ترتفع، وحجم الجسم لا يضيف طاقة للنظام.", "ru": "Числа падают, а не растут, и размер тела энергии системе не добавляет.", "en": "The numbers fall rather than rise, and body size adds no energy to the system."}]),
    Q("eco-3-8",{"he": "לאגם הוכנסו דגים שאוכלים זחלי יתושים. היתושים התמעטו, אך גם אוכלוסיית הצפרדעים ירדה. מה ההסבר הסביר?", "ar": "أُدخلت إلى بحيرة أسماك تأكل يرقات البعوض. قلّ البعوض، لكن قلّت أيضًا مجموعة الضفادع. ما التفسير المعقول؟", "ru": "В озеро запустили рыб, поедающих комариных личинок. Комаров стало меньше, но и популяция лягушек сократилась. Каково разумное объяснение?", "en": "Fish that eat mosquito larvae were introduced to a lake. The mosquitoes declined, but the frog population fell too. What is the reasonable explanation?"},[{"he": "הצפרדעים ניזונו מהדגים החדשים ולכן נפגעו", "ar": "كانت الضفادع تتغذّى على الأسماك الجديدة فتضرّرت", "ru": "Жабы питались новыми рыбами и потому пострадали", "en": "The frogs fed on the new fish and so were harmed"}, {"he": "הצפרדעים נדדו לאגם אחר בגלל רעש הדגים", "ar": "هاجرت الضفادع إلى بحيرة أخرى بسبب ضجيج الأسماك", "ru": "Жабы ушли в другое озеро из-за шума рыб", "en": "The frogs moved to another lake because of the fish's noise"}, {"he": "אין קשר בין הדגים ובין הצפרדעים באגם", "ar": "لا صلة بين الأسماك والضفادع في البحيرة", "ru": "Между рыбами и лягушками в озере связи нет", "en": "There is no link between the fish and the frogs in the lake"}, {"he": "הדגים פגעו ביותר מחוליה אחת: הם אכלו ראשנים או התחרו על אותו מזון", "ar": "أضرّت الأسماك بأكثر من حلقة: أكلت الشراغيف أو نافست على الغذاء نفسه", "ru": "Рыбы задели не одно звено: они ели лягушачьих личинок или конкурировали за тот же корм", "en": "The fish hit more than one link: they ate tadpoles or competed for the same food"}],3,{"he": "שאלו מה עוד הדגים עשויים לאכול באגם, מלבד זחלי יתושים.", "ar": "اسألوا ما قد تأكله الأسماك في البحيرة أيضًا، غير يرقات البعوض.", "ru": "Спросите, что ещё рыбы могут есть в озере, кроме комариных личинок.", "en": "Ask what else the fish might eat in the lake, besides mosquito larvae."},{"he": "מין שמוכנס לאקוסיסטמה אינו נשאר על חוליה אחת. הדגים אכלו גם ראשנים וביצי צפרדע, וגם התחרו עם הראשנים על אותו מזון. בגלל הקשרים הרבים במרקם המז
