    Q("homeo-1-8",{"he": "איזה חלק במוח הוא מרכז הבקרה על טמפרטורת הגוף?", "ar": "أي جزء في الدماغ هو مركز التحكّم بحرارة الجسم؟", "ru": "Какая часть мозга является центром контроля температуры тела?", "en": "Which part of the brain is the control centre for body temperature?"},[{"he": "המוח הקטן", "ar": "المخيخ", "ru": "Мозжечок", "en": "The cerebellum"}, {"he": "גזע המוח", "ar": "جذع الدماغ", "ru": "Ствол мозга", "en": "The brain stem"}, {"he": "קרום המוח", "ar": "غشاء الدماغ", "ru": "Оболочка мозга", "en": "The brain membrane"}, {"he": "ההיפותלמוס", "ar": "تحت المهاد (الهيبوثلاموس)", "ru": "Гипоталамус", "en": "The hypothalamus"}],3,{"he": "חפשו את החלק שמחבר בין המוח ובין בלוטות ההפרשה.", "ar": "ابحثوا عن الجزء الذي يربط الدماغ بغدد الإفراز.", "ru": "Ищите часть, которая связывает мозг с железами.", "en": "Look for the part that links the brain to the glands."},{"he": "ההיפותלמוס מודד את טמפרטורת הדם ומשווה אותה לערך המבוקש, כ-37 מעלות. אם חם מדי הוא מפעיל הזעה והרחבת כלי דם בעור, ואם קר מדי הוא מפעיל רעד וכיווץ. הוא גם מקשר בין מערכת העצבים ובין ההורמונים.", "ar": "تحت المهاد يقيس حرارة الدم ويقارنها بالقيمة المطلوبة، نحو 37 درجة. فإذا كانت الحرارة عالية شغّل التعرّق وتوسيع الأوعية في الجلد، وإذا كانت منخفضة شغّل الرجفان والتضيّق. وهو يربط أيضًا بين الجهاز العصبي والهرمونات.", "ru": "Гипоталамус измеряет температуру крови и сравнивает её с заданным значением, около 37 градусов. Если слишком жарко, он включает потоотделение и расширение сосудов кожи, а если слишком холодно — дрожь и сужение. Он же связывает нервную систему с гормонами.", "en": "The hypothalamus measures the blood's temperature and compares it with the set point, about 37 degrees. If it is too hot it triggers sweating and widening of skin blood vessels; if too cold, shivering and narrowing. It also links the nervous system to the hormones."},null,[{"he": "המוח הקטן אחראי לשיווי משקל ולתנועה מדויקת, ולא לטמפרטורה.", "ar": "المخيخ مسؤول عن التوازن والحركة الدقيقة، لا عن الحرارة.", "ru": "Мозжечок отвечает за равновесие и точные движения, а не за температуру.", "en": "The cerebellum handles balance and fine movement, not temperature."}, {"he": "גזע המוח מנהל נשימה ודופק, ומרכז הטמפרטורה נמצא מעליו.", "ar": "جذع الدماغ يدير التنفّس والنبض، ومركز الحرارة يقع فوقه.", "ru": "Ствол мозга управляет дыханием и пульсом, а центр температуры находится выше.", "en": "The brain stem runs breathing and heart rate; the temperature centre lies above it."}, {"he": "קרום המוח הוא עטיפה מגנה, ואין בו מרכז בקרה.", "ar": "غشاء الدماغ غلاف واقٍ، ولا يوجد فيه مركز تحكّم.", "ru": "Оболочка мозга — защитный покров, центра управления в ней нет.", "en": "The brain membrane is a protective cover and holds no control centre."}, null]),
    Q("homeo-1-9",{"he": "איזה איבר אוגר גלוקוז בצורת גליקוגן ומשחרר אותו בעת הצורך?", "ar": "أي عضو يخزّن الغلوكوز على شكل غلايكوجين ويطلقه عند الحاجة؟", "ru": "Какой орган запасает глюкозу в виде гликогена и выделяет её при необходимости?", "en": "Which organ stores glucose as glycogen and releases it when needed?"},[{"he": "הכליה", "ar": "الكلية", "ru": "Почка", "en": "The kidney"}, {"he": "הקיבה", "ar": "المعدة", "ru": "Желудок", "en": "The stomach"}, {"he": "הכבד", "ar": "الكبد", "ru": "Печень", "en": "The liver"}, {"he": "הטחול", "ar": "الطحال", "ru": "Селезёнка", "en": "The spleen"}],2,{"he": "חשבו על האיבר הגדול שמימין בבטן העליונה, מתחת לצלעות.", "ar": "فكّروا بالعضو الكبير في أعلى البطن إلى اليمين، تحت الأضلاع.", "ru": "Подумайте о большом органе справа в верхней части живота, под ребрами.", "en": "Think of the large organ on the right of the upper abdomen, under the ribs."},{"he": "אחרי ארוחה אינסולין מורה לכבד לאגור גלוקוז כגליקוגן. בצום או במאמץ גלוקגון מורה לכבד לפרק גליקוגן ולשחרר גלוקוז לדם. כך רמת הסוכר נשמרת גם בלי אוכל.", "ar": "بعد الوجبة يوجّه الإنسولين الكبد لتخزين الغلوكوز كغلايكوجين. وفي الصيام أو المجهود يوجّه الغلوكاغون الكبد لتفكيك الغلايكوجين وإطلاق الغلوكوز إلى الدم. هكذا يُحافَظ على مستوى السكّر حتى بلا طعام.", "ru": "После еды инсулин велит печени запасать глюкозу в виде гликогена. При голоде или нагрузке глюкагон велит печени расщеплять гликоген и выделять глюкозу в кровь. Так уровень сахара держится и без еды.", "en": "After a meal insulin tells the liver to store glucose as glycogen. During fasting or exercise glucagon tells the liver to break the glycogen down and release glucose into the blood. This keeps the sugar level steady even without food."},null,[{"he": "הכליה מסננת את הדם ומסלקת פסולת, ואינה אוגרת גליקוגן.", "ar": "الكلية تُرشّح الدم وتطرح النفايات، ولا تخزّن غلايكوجين.", "ru": "Почка фильтрует кровь и выводит отходы, гликоген она не запасает.", "en": "The kidney filters the blood and removes waste; it does not store glycogen."}, {"he": "הקיבה מעכלת מזון, והיא אינה מאגר סוכר של הגוף.", "ar": "المعدة تهضم الغذاء، وليست مخزن السكّر في الجسم.", "ru": "Желудок переваривает пищу и запасом сахара в теле не является.", "en": "The stomach digests food and is not the body's sugar store."}, null, {"he": "הטחול מטפל בדם ובמערכת החיסון, ואין לו תפקיד באגירת סוכר.", "ar": "الطحال يتعامل مع الدم وجهاز المناعة، ولا دور له في تخزين السكّر.", "ru": "Селезёнка занимается кровью и иммунитетом, запасание сахара не её дело.", "en": "The spleen deals with blood and immunity and has no role in storing sugar."}]),
 ],
 [
    Q("homeo-2-1",{"he": "מהו משוב שלילי במערכת בקרה?", "ar": "ما التغذية الراجعة السالبة في نظام التنظيم؟", "ru": "Что такое отрицательная обратная связь в системе регуляции?", "en": "What is negative feedback in a control system?"},[{"he": "שינוי בערך מפעיל תגובה שמחזירה אותו לערך התקין", "ar": "تغيّر في القيمة يُفعّل استجابة تعيدها إلى القيمة الطبيعية", "ru": "Изменение показателя запускает реакцию, возвращающую его к норме", "en": "A change in a value triggers a response that returns it to normal"}, {"he": "שינוי בערך מגביר את עצמו עוד יותר", "ar": "تغيّر في القيمة يزداد أكثر فأكثر", "ru": "Изменение показателя усиливает само себя", "en": "A change in a value strengthens itself even more"}, {"he": "תגובה שלילית של הגוף לתרופה", "ar": "رد فعل سلبي للجسم تجاه دواء", "ru": "Негативная реакция организма на лекарство", "en": "The body's bad reaction to a medicine"}, {"he": "הפסקה מוחלטת של פעילות האיבר עד שהערך חוזר לתקנו מעצמו", "ar": "توقّف تامّ لنشاط العضو حتى تعود القيمة إلى طبيعتها من تلقاء نفسها", "ru": "Полная остановка работы органа, пока значение само не вернётся к норме", "en": "A complete halt of the organ's activity until the value returns to normal by itself"}],0,{"he": "כמו מזגן עם תרמוסטט: הוא נדלק כשחם מדי ונכבה כשמגיעים לטמפרטורה הרצויה.", "ar": "مثل مكيّف بمنظّم حرارة: يعمل عندما تكون الحرارة عالية ويتوقف عند بلوغ الحرارة المطلوبة.", "ru": "Как кондиционер с термостатом: включается, когда жарко, и выключается при нужной температуре.", "en": "Like an air conditioner with a thermostat: it turns on when it is too hot and off when the target is reached."},{"he": "במשוב שלילי התגובה מקטינה את השינוי שהפעיל אותה. כך הגוף שומר על ערכים יציבים, למשל סוכר בדם וטמפרטורה.", "ar": "في التغذية الراجعة السالبة تقلّل الاستجابة التغيّر الذي أطلقها. هكذا يحافظ الجسم على قيم ثابتة مثل السكر في الدم والحرارة.", "ru": "При отрицательной обратной связи реакция уменьшает изменение, которое её вызвало. Так организм сохраняет стабильные значения, например сахар в крови и температуру.", "en": "In negative feedback the response reduces the change that triggered it. This is how the body keeps values stable, for example blood sugar and temperature."},null,[null, {"he": "תגובה שמגבירה את השינוי היא משוב חיובי, וזה ההפך ממשוב שלילי.", "ar": "الاستجابة التي تضخّم التغيّر هي تغذية راجعة إيجابية، وهي عكس السلبية.", "ru": "Реакция, усиливающая изменение, — положительная обратная связь, не отрицательная.", "en": "A response that amplifies the change is positive feedback, not negative."}, {"he": "המילה שלילי כאן מתארת את כיוון התגובה, ולא תופעת לוואי של תרופה.", "ar": "كلمة سلبي هنا تصف اتجاه الاستجابة، لا عَرَضًا جانبيًّا لدواء.", "ru": "Слово отрицательная здесь описывает направление реакции, а не побочное действие.", "en": "Here negative describes the direction of the response, not a drug side effect."}, {"he": "המערכת אינה נעצרת: היא פועלת בכיוון ההפוך עד שהערך חוזר לתקנו.", "ar": "الجهاز لا يتوقّف: بل يعمل في الاتجاه المعاكس حتى تعود القيمة إلى طبيعتها.", "ru": "Система не останавливается: она работает в обратную сторону до возврата к норме.", "en": "The system does not stop: it works the other way until the value is normal."}]),
    Q("homeo-2-2",{"he": "מה התפקיד העיקרי של הכליות בהומאוסטזיס?", "ar": "ما الدور الرئيسي للكليتين في الاتزان الداخلي؟", "ru": "Какова главная роль почек в гомеостазе?", "en": "What is the kidneys' main role in homeostasis?"},[{"he": "סינון הדם, הוצאת פסולת כמו אוריאה ושמירה על מאזן המים והמלחים", "ar": "ترشيح الدم وإخراج الفضلات مثل اليوريا والحفاظ على توازن الماء والأملاح", "ru": "Фильтрация крови, удаление отходов, например мочевины, и поддержание водно-солевого баланса", "en": "Filtering the blood, removing waste such as urea and keeping the balance of water and salts"}, {"he": "הפרשת אינסולין וגלוקגון לדם כדי לשמור על רמת סוכר יציבה אחרי ארוחה", "ar": "إفراز الأنسولين والغلوكاغون إلى الدم للحفاظ على مستوى سكّر ثابت بعد الوجبة", "ru": "Выделение инсулина и глюкагона в кровь для стабильного сахара после еды", "en": "Secreting insulin and glucagon into the blood to keep sugar steady after a meal"}, {"he": "פירוק חלבונים במערכת העיכול וספיגת חומצות האמינו בדופן המעי הדק", "ar": "تفكيك البروتينات في الجهاز الهضمي وامتصاص الأحماض الأمينية في جدار الأمعاء الدقيقة", "ru": "Расщепление белков в пищеварительной системе и всасывание аминокислот в стенке тонкого кишечника", "en": "Breaking down proteins in the digestive system and absorbing amino acids in the small intestine wall"}, {"he": "קשירת חמצן בריאות והעברתו בדם אל כל תאי הגוף", "ar": "ربط الأكسجين في الرئتين ونقله بالدم إلى كل خلايا الجسم", "ru": "Связывание кислорода в лёгких и перенос его кровью ко всем клеткам тела", "en": "Binding oxygen in the lungs and carrying it in the blood to all the body cells"}],0,{"he": "הכליה מייצרת שתן.", "ar": "الكلية تُنتج البول.", "ru": "Почка вырабатывает мочу.", "en": "The kidney produces urine."},{"he": "הכליות מסננות את הדם, מוציאות פסולת בשתן ומווסתות כמה מים ומלחים נשארים בגוף. כשהגוף מאבד מים, הכליות מרכזות את השתן ושומרות מים. את שאר התפקידים עושים איברים אחרים: אינסולין מופרש מהלבלב, חלבונים מתפרקים במערכת העיכול, והחמצן נקשר בריאות ונישא בדם.", "ar": "تُرشّح الكليتان الدم وتُخرجان الفضلات في البول وتنظّمان كمية الماء والأملاح في الجسم. عندما يفقد الجسم الماء تركّزان البول وتحافظان على الماء. أما الأدوار الأخرى فتقوم بها أعضاء أخرى: الإنسولين يُفرَز من البنكرياس، والبروتينات تتفكك في الجهاز الهضمي، والأكسجين يُربط في الرئتين ويُنقل بالدم.", "ru": "Почки фильтруют кровь, выводят отходы с мочой и регулируют количество воды и солей. Когда организм теряет воду, почки концентрируют мочу и сохраняют воду. Остальные задачи выполняют другие органы: инсулин выделяет поджелудочная железа, белки расщепляются в пищеварительной системе, а кислород связывается в лёгких и переносится кровью.", "en": "The kidneys filter the blood, remove waste in urine and regulate how much water and salt stay in the body. When the body loses water, the kidneys concentrate the urine and save water. The other jobs belong to other organs: insulin is secreted by the pancreas, proteins are broken down in the digestive system, and oxygen is bound in the lungs and carried in the blood."},null,[null, {"he": "אינסולין וגלוקגון מופרשים מהלבלב, ולא מהכליות.", "ar": "الأنسولين والغلوكاغون يُفرزان من البنكرياس، لا من الكليتين.", "ru": "Инсулин и глюкагон выделяет поджелудочная железа, а не почки.", "en": "Insulin and glucagon are secreted by the pancreas, not by the kidneys."}, {"he": "פירוק החלבונים וספיגתם נעשים במערכת העיכול, ולא בכליה.", "ar": "تفكيك البروتينات وامتصاصها يجريان في الجهاز الهضمي، لا في الكلية.", "ru": "Расщепление и всасывание белков идут в пищеварительной системе, не в почке.", "en": "Proteins are broken down and absorbed in the digestive system, not the kidney."}, {"he": "החמצן נקשר להמוגלובין בריאות, והכליה אינה משתתפת בכך.", "ar": "الأكسجين يرتبط بالهيموغلوبين في الرئتين، والكلية لا تشارك في ذلك.", "ru": "Кислород связывается с гемоглобином в лёгких, и почка в этом не участвует.", "en": "Oxygen binds to haemoglobin in the lungs, and the kidney plays no part in it."}]),
    Q("homeo-2-3",{"he": "למה הזעה מקררת את הגוף?", "ar": "لماذا يبرّد التعرّق الجسم؟", "ru": "Почему потоотделение охлаждает тело?", "en": "Why does sweating cool the body?"},[{"he": "כי הזיעה קרה יותר מהעור", "ar": "لأن العرق أبرد من الجلد", "ru": "Потому что пот холоднее кожи", "en": "Because sweat is colder than the skin"}, {"he": "כי הזיעה מוציאה מהגוף מלח מיותר", "ar": "لأن العرق يُخرج من الجسم ملحًا زائدًا", "ru": "Потому что пот выводит из тела лишнюю соль", "en": "Because sweat removes excess salt from the body"}, {"he": "כי התאדות המים מהעור לוקחת איתה חום", "ar": "لأن تبخّر الماء من الجلد يأخذ معه حرارة", "ru": "Потому что испарение воды с кожи забирает с собой тепло", "en": "Because water evaporating from the skin takes heat with it"}, {"he": "כי הזיעה חוסמת את חדירת החום מבחוץ", "ar": "لأن العرق يمنع دخول الحرارة من الخارج", "ru": "Потому что пот преграждает тепло снаружи", "en": "Because sweat blocks heat from entering from outside"}],2,{"he": "חשבו למה קר אחרי שיוצאים רטובים מהמקלחת.", "ar": "فكّروا لماذا نشعر بالبرد عند الخروج مبلّلين من الحمّام.", "ru": "Подумайте, почему холодно, когда выходишь мокрым из душа.", "en": "Think why you feel cold when you step out of the shower wet."},{"he": "כדי שמים יהפכו לאדים דרושה אנרגיה, והיא נלקחת מחום העור. לכן עור רטוב שמתאדה מתקרר, והדם שעובר בו מתקרר גם הוא. ביום לח ההתאדות איטית, ולכן הקירור פחות יעיל.", "ar": "لتحويل الماء إلى بخار تلزم طاقة، وتُؤخَذ من حرارة الجلد. لذلك يبرد الجلد المبلّل عند تبخّره، ويبرد معه الدم المارّ فيه. وفي يوم رطب يكون التبخّر بطيئًا، فيصبح التبريد أقلّ فعّالية.", "ru": "Чтобы вода превратилась в пар, нужна энергия, и она берётся из тепла кожи. Поэтому мокрая кожа при испарении остывает, и проходящая через неё кровь тоже остывает. Во влажный день испарение идёт медленно, и охлаждение менее действенно.", "en": "Turning water into vapour takes energy, and it is taken from the skin's heat. So wet skin cools as it dries, and the blood passing through it cools too. On a humid day evaporation is slow, so the cooling works less well."},null,[{"he": "הזיעה יוצאת בטמפרטורת הגוף, והקירור בא מההתאדות ולא מקור.", "ar": "يخرج العرق بحرارة الجسم، والتبريد يأتي من التبخّر لا من البرودة.", "ru": "Пот выходит при температуре тела, а охлаждение даёт испарение, а не холод.", "en": "Sweat comes out at body temperature; the cooling comes from evaporation, not from cold."}, {"he": "מלח אכן יוצא בזיעה, אבל זה אינו מה שמוריד את הטמפרטורה.", "ar": "الملح يخرج فعلًا في العرق، لكن هذا ليس ما يخفّض الحرارة.", "ru": "Соль с потом действительно выходит, но температуру понижает не это.", "en": "Salt does leave in sweat, but that is not what lowers the temperature."}, null, {"he": "שכבת מים אינה חוסמת חום, והקירור נובע מהתאדות ולא מחסימה.", "ar": "طبقة الماء لا تحجب الحرارة، والتبريد ناتج عن التبخّر لا عن الحجب.", "ru": "Слой воды тепло не преграждает; охлаждение даёт испарение, а не экран.", "en": "A layer of water does not block heat; the cooling comes from evaporation, not shielding."}]),
    Q("homeo-2-4",{"he": "למה כלי הדם בעור מצטמצמים ביום קר?", "ar": "لماذا تتضيّق الأوعية الدموية في الجلد في يوم بارد؟", "ru": "Почему кровеносные сосуды кожи сужаются в холодный день?", "en": "Why do the blood vessels in the skin narrow on a cold day?"},[{"he": "כדי שפחות דם יגיע לעור ויאבד פחות חום", "ar": "لكي يصل دم أقلّ إلى الجلد فتُفقَد حرارة أقلّ", "ru": "Чтобы к коже шло меньше крови и терялось меньше тепла", "en": "So that less blood reaches the skin and less heat is lost"}, {"he": "כדי שהעור ייצר יותר זיעה בקור", "ar": "لكي يُنتج الجلد عرقًا أكثر في البرد", "ru": "Чтобы кожа вырабатывала больше пота в холоде", "en": "So the skin makes more sweat in the cold"}, {"he": "כדי שהדם יזרום מהר יותר אל העור", "ar": "لكي يتدفّق الدم أسرع إلى الجلد", "ru": "Чтобы кровь быстрее текла к коже", "en": "So the blood flows faster to the skin"}, {"he": "כדי להוריד את לחץ הדם בכל הגוף", "ar": "لتخفيض ضغط الدم في الجسم كلّه", "ru": "Чтобы снизить давление крови во всём теле", "en": "To lower the blood pressure in the whole body"}],0,{"he": "חשבו מאיפה הגוף מאבד חום לאוויר הקר.", "ar": "فكّروا من أين يفقد الجسم حرارة إلى الهواء البارد.", "ru": "Подумайте, откуда тело теряет тепло в холодный воздух.", "en": "Think where the body loses heat to the cold air."},{"he": "דם חם שעובר ליד פני העור מאבד חום לאוויר. בקור ההיפותלמוס מצמצם את כלי הדם בעור, פחות דם מגיע לפנים השטח, והחום נשמר בפנים הגוף. בגלל זה הידיים נראות חיוורות בקור.", "ar": "الدم الساخن المارّ قرب سطح الجلد يفقد حرارة إلى الهواء. وفي البرد يضيّق تحت المهاد أوعية الجلد، فيصل دم أقلّ إلى السطح وتُحفَظ الحرارة داخل الجسم. لهذا تبدو اليدان شاحبتين في البرد.", "ru": "Горячая кровь, проходящая у поверхности кожи, теряет тепло в воздух. В холоде гипоталамус сужает сосуды кожи, к поверхности идёт меньше крови, и тепло сохраняется внутри тела. Поэтому руки на холоде выглядят бледными.", "en": "Warm blood passing near the skin's surface loses heat to the air. In the cold the hypothalamus narrows the skin's vessels, less blood reaches the surface, and the heat stays inside the body. This is why hands look pale in the cold."},null,[null, {"he": "בקור ההזעה דווקא פוחתת, כי הגוף מנסה לשמור על חום.", "ar": "في البرد يقلّ التعرّق، لأن الجسم يحاول حفظ الحرارة.", "ru": "В холоде потоотделение как раз уменьшается, ведь тело старается сохранить тепло.", "en": "In the cold sweating actually decreases, because the body is trying to keep heat in."}, {"he": "זרימה מוגברת לעור מגדילה אובדן חום, וזה ההפך ממה שצריך בקור.", "ar": "زيادة التدفّق إلى الجلد تزيد فقدان الحرارة، وهذا عكس المطلوب في البرد.", "ru": "Усиленный поток к коже увеличивает потерю тепла — обратное тому, что нужно в холоде.", "en": "More flow to the skin increases heat loss, the opposite of what is needed in the cold."}, {"he": "צמצום כלי דם מעלה את לחץ הדם ואינו מוריד אותו.", "ar": "تضيّق الأوعية يرفع ضغط الدم ولا يخفضه.", "ru": "Сужение сосудов повышает давление крови, а не понижает его.", "en": "Narrowing vessels raises blood pressure rather than lowering it."}]),
    Q("homeo-2-5",{"he": "למה חשוב שרמת הגלוקוז בדם תישאר בתחום צר?", "ar": "لماذا من المهم أن يبقى مستوى الغلوكوز في الدم في مجال ضيّق؟", "ru": "Почему важно, чтобы уровень глюкозы в крови оставался в узких пределах?", "en": "Why must the blood glucose level stay within a narrow range?"},[{"he": "כי גלוקוז הוא ההורמון שמווסת את הגוף", "ar": "لأن الغلوكوز هو الهرمون الذي ينظّم الجسم", "ru": "Потому что глюкоза — гормон, регулирующий тело", "en": "Because glucose is the hormone that regulates the body"}, {"he": "כי הגלוקוז קובע את טמפרטורת הגוף", "ar": "لأن الغلوكوز يحدّد حرارة الجسم", "ru": "Потому что глюкоза задаёт температуру тела", "en": "Because glucose sets the body temperature"}, {"he": "כי גלוקוז נחוץ רק לתאי השריר", "ar": "لأن الغلوكوز لازم لخلايا العضلات فقط", "ru": "Потому что глюкоза нужна только мышечным клеткам", "en": "Because glucose is needed only by muscle cells"}, {"he": "כי המוח תלוי באספקה קבועה, ועודף מזיק לכלי הדם", "ar": "لأن الدماغ يعتمد على تزويد ثابت، والزيادة تضرّ الأوعية", "ru": "Потому что мозг зависит от постоянного снабжения, а избыток вредит сосудам", "en": "Because the brain depends on a steady supply, and excess harms the blood vessels"}],3,{"he": "שאלו מה קורה לאדם שרמת הסוכר שלו צונחת פתאום.", "ar": "اسألوا ما يحدث لشخص يهبط سكّره فجأةً.", "ru": "Спросите, что происходит с человеком, у которого сахар резко падает.", "en": "Ask what happens to a person whose sugar suddenly drops."},{"he": "תאי המוח כמעט אינם אוגרים סוכר, ולכן ירידה חדה גורמת לבלבול ואף לאובדן הכרה. מצד שני רמה גבוהה לאורך זמן פוגעת בכלי דם קטנים, בכליות ובעיניים. בגלל זה אינסולין וגלוקגון עובדים זה נגד זה ושומרים על האיזון.", "ar": "خلايا الدماغ لا تخزّن السكّر تقريبًا، لذلك يسبّب الهبوط الحادّ تشوّشًا بل فقدان وعي. ومن جهة أخرى، المستوى المرتفع لفترة طويلة يضرّ الأوعية الصغيرة والكليتين والعينين. لهذا يعمل الإنسولين والغلوكاغون أحدهما بعكس الآخر ويحفظان التوازن.", "ru": "Клетки мозга почти не запасают сахар, поэтому резкое падение вызывает спутанность и даже потерю сознания. С другой стороны, долго высокий уровень повреждает мелкие сосуды, почки и глаза. Поэтому инсулин и глюкагон работают друг против друга и держат равновесие.", "en": "Brain cells store almost no sugar, so a sharp drop brings confusion and even loss of consciousness. On the other hand, a high level over time damages small blood vessels, the kidneys and the eyes. This is why insulin and glucagon work against each other to hold the balance."},null,[{"he": "גלוקוז הוא סוכר ומקור אנרגיה, והמווסתים הם אינסולין וגלוקגון.", "ar": "الغلوكوز سكّر ومصدر طاقة، والمنظّمان هما الإنسولين والغلوكاغون.", "ru": "Глюкоза — сахар и источник энергии, а регуляторы — инсулин и глюкагон.", "en": "Glucose is a sugar and energy source; the regulators are insulin and glucagon."}, {"he": "טמפרטורת הגוף נשלטת בהיפותלמוס, ולא ברמת הסוכר בדם.", "ar": "حرارة الجسم يتحكّم بها تحت المهاد، لا مستوى السكّر في الدم.", "ru": "Температурой тела управляет гипоталамус, а не уровень сахара в крови.", "en": "Body temperature is controlled by the hypothalamus, not by the blood sugar level."}, {"he": "כל תאי הגוף צורכים גלוקוז, והמוח תלוי בו במיוחד.", "ar": "كل خلايا الجسم تستهلك الغلوكوز، والدماغ يعتمد عليه بشكل خاصّ.", "ru": "Глюкозу расходуют все клетки тела, а мозг зависит от неё особенно.", "en": "Every cell in the body uses glucose, and the brain depends on it especially."}, null]),
    Q("homeo-2-6",{"he": "אדם שתה ליטר מים בבת אחת. מה צפוי לקרות לשתן שלו בשעה שאחרי כן?", "ar": "شرب شخص لترًا من الماء مرّةً واحدة. ما المتوقّع لبوله في الساعة التالية؟", "ru": "Человек выпил литр воды сразу. Что ожидается с его мочой в следующий час?", "en": "A person drank a litre of water at once. What is expected of their urine in the next hour?"},[{"he": "כמות קטנה של שתן כהה ומרוכז", "ar": "كمية قليلة من بول غامق مركّز", "ru": "Небольшое количество тёмной концентрированной мочи", "en": "A small amount of dark, concentrated urine"}, {"he": "כמות גדולה של שתן בהיר ומדולל", "ar": "كمية كبيرة من بول فاتح مخفّف", "ru": "Большое количество светлой разбавленной мочи", "en": "A large amount of pale, dilute urine"}, {"he": "אותה כמות שתן בדיוק, בלי שינוי", "ar": "كمية البول نفسها بالضبط، بلا تغيير", "ru": "Точно то же количество мочи, без изменений", "en": "Exactly the same amount of urine, with no change"}, {"he": "שתן עם הרבה גלוקוז", "ar": "بول فيه غلوكوز كثير", "ru": "Моча с большим количеством глюкозы", "en": "Urine with a lot of glucose in it"}],1,{"he": "שאלו מה הגוף עושה כשיש בו יותר מים מהנדרש.", "ar": "اسألوا ما يفعله الجسم عندما يكون فيه ماء أكثر من اللازم.", "ru": "Спросите, что делает тело, когда воды в нём больше нужного.", "en": "Ask what the body does when it holds more water than it needs."},{"he": "שתייה מרובה מדללת את הדם, והגוף מזהה זאת ומפחית את הפרשת ההורמון שמחזיר מים בכליות. הכליות מחזירות פחות מים, ולכן נוצר שתן רב ובהיר. במחסור במים קורה ההפך, והשתן מתמעט ומתכהה.", "ar": "الشرب الكثير يخفّف الدم، فيلاحظ الجسم ذلك ويقلّل إفراز الهرمون الذي يُعيد الماء في الكليتين. تُعيد الكليتان ماءً أقلّ، فيتكوّن بول كثير وفاتح. وفي نقص الماء يحدث العكس، فيقلّ البول ويغمق.", "ru": "Обильное питьё разбавляет кровь, тело это замечает и уменьшает выделение гормона, возвращающего воду в почках. Почки возвращают меньше воды, и образуется много светлой мочи. При недостатке воды происходит обратное: мочи меньше и она темнее.", "en": "Drinking a lot dilutes the blood, the body senses this and reduces the hormone that returns water in the kidneys. The kidneys return less water, so a lot of pale urine is formed. When water is short the opposite happens, and the urine becomes scant and dark."},null,[{"he": "שתן כהה ומרוכז הוא סימן למחסור במים, ולא לעודף.", "ar": "البول الغامق المركّز علامة نقص ماء، لا زيادته.", "ru": "Тёмная концентрированная моча — признак нехватки воды, а не её избытка.", "en": "Dark, concentrated urine is a sign of water shortage, not of surplus."}, null, {"he": "אם הכמות לא היתה משתנה, המים היו נשארים בגוף ומדללים את הדם.", "ar": "لو لم تتغيّر الكمية، لبقي الماء في الجسم وخفّف الدم.", "ru": "Если бы количество не менялось, вода осталась бы в теле и разбавила кровь.", "en": "If the amount did not change, the water would stay in the body and dilute the blood."}, {"he": "גלוקוז בשתן הוא סימן לסוכרת, ואינו תוצאה של שתיית מים.", "ar": "الغلوكوز في البول علامة سكّري، وليس نتيجة شرب الماء.", "ru": "Глюкоза в моче — признак диабета, а не следствие питья воды.", "en": "Glucose in the urine is a sign of diabetes, not a result of drinking water."}]),
    Q("homeo-2-7",{"he": "למה אינסולין ניתן בזריקה ולא בכמוסה לבליעה?", "ar": "لماذا يُعطى الإنسولين بالحقن وليس بكبسولة تُبلَع؟", "ru": "Почему инсулин вводят инъекцией, а не дают в капсуле для приёма внутрь?", "en": "Why is insulin given by injection and not in a capsule to swallow?"},[{"he": "כי אינסולין אינו מסיס במים כלל", "ar": "لأن الإنسولين غير قابل للذوبان في الماء أبدًا", "ru": "Потому что инсулин вовсе не растворяется в воде", "en": "Because insulin does not dissolve in water at all"}, {"he": "כי זריקה מגיעה ישר אל הלבלב", "ar": "لأن الحقنة تصل مباشرةً إلى البنكرياس", "ru": "Потому что инъекция попадает прямо в поджелудочную железу", "en": "Because an injection goes straight to the pancreas"}, {"he": "כי אינסולין הוא חלבון, ואנזימי העיכול יפרקו אותו", "ar": "لأن الإنسولين بروتين، وإنزيمات الهضم ستفكّكه", "ru": "Потому что инсулин — белок, и пищеварительные ферменты его расщепят", "en": "Because insulin is a protein, and digestive enzymes would break it down"}, {"he": "כי אינסולין פועל רק על העור ולא בתוך הגוף", "ar": "لأن الإنسولين يعمل على الجلد فقط لا داخل الجسم", "ru": "Потому что инсулин действует только на кожу, а не внутри тела", "en": "Because insulin acts only on the skin and not inside the body"}],2,{"he": "שאלו ממה בנוי אינסולין, ומה קורה לחומר כזה בקיבה.", "ar": "اسألوا من أي شيء يُبنى الإنسولين، وما يحدث لمادة كهذه في المعدة.", "ru": "Спросите, из чего построен инсулин и что бывает с таким веществом в желудке.", "en": "Ask what insulin is built from, and what happens to such a substance in the stomach."},{"he": "אינסולין הוא חלבון קטן. בקיבה ובמעי יש אנזימים שמפרקים חלבונים לחומצות אמינו, ולכן כמוסה שנבלעת לא תגיע לדם במצב פעיל. זריקה תת-עורית עוקפת את מערכת העיכול ומכניסה את ההורמון שלם לדם.", "ar": "الإنسولين بروتين صغير. وفي المعدة والمعي إنزيمات تفكّك البروتينات إلى أحماض أمينية، لذلك لن تصل كبسولة مبلوعة إلى الدم بحالة نشطة. الحقنة تحت الجلد تتجاوز الجهاز الهضمي وتُدخل الهرمون سليمًا إلى الدم.", "ru": "Инсулин — небольшой белок. В желудке и кишечнике есть ферменты, расщепляющие белки на аминокислоты, поэтому проглоченная капсула не дойдёт до крови в рабочем виде. Подкожная инъекция обходит пищеварение и вводит гормон в кровь целым.", "en": "Insulin is a small protein. The stomach and intestine hold enzymes that break proteins into amino acids, so a swallowed capsule would never reach the blood in working form. An injection under the skin bypasses digestion and puts the hormone into the blood intact."},null,[{"he": "אינסולין מסיס בדם, והבעיה היא פירוק במערכת העיכול.", "ar": "الإنسولين قابل للذوبان في الدم، والمشكلة هي التفكيك في الجهاز الهضمي.", "ru": "Инсулин в крови растворим, проблема — расщепление в пищеварении.", "en": "Insulin does dissolve in blood; the problem is breakdown in the digestive system."}, {"he": "הזריקה נכנסת לדם ולא ללבלב, והלבלב אינו מטרת ההורמון.", "ar": "الحقنة تدخل الدم لا البنكرياس، والبنكرياس ليس هدف الهرمون.", "ru": "Инъекция попадает в кровь, а не в поджелудочную железу, и она не цель гормона.", "en": "The injection enters the blood, not the pancreas, and the pancreas is not the hormone's target."}, null, {"he": "אינסולין פועל על תאי שריר, שומן וכבד, ולא על העור.", "ar": "الإنسولين يعمل على خلايا العضلات والدهن والكبد، لا على الجلد.", "ru": "Инсулин действует на мышечные, жировые и печёночные клетки, а не на кожу.", "en": "Insulin acts on muscle, fat and liver cells, not on the skin."}]),
    Q("homeo-2-8",{"he": "למה אדם שהזיע הרבה מרגיש צמא חזק?", "ar": "لماذا يشعر من تعرّق كثيرًا بعطش شديد؟", "ru": "Почему человек, который много потел, чувствует сильную жажду?", "en": "Why does a person who has sweated a lot feel very thirsty?"},[{"he": "כי הזיעה מוציאה סוכר, והגוף מבקש להשיב אותו", "ar": "لأن العرق يُخرج سكّرًا، فيطلب الجسم استعادته", "ru": "Потому что пот выводит сахар, и тело просит его вернуть", "en": "Because sweat removes sugar and the body asks for it back"}, {"he": "כי טמפרטורת הגוף עלתה, והצמא מוריד אותה ישירות", "ar": "لأن حرارة الجسم ارتفعت، والعطش يخفّضها مباشرةً", "ru": "Потому что температура тела поднялась, и жажда снижает её напрямую", "en": "Because the body temperature rose, and thirst lowers it directly"}, {"he": "כי הכליות הפסיקו לעבוד בזמן ההזעה", "ar": "لأن الكليتين توقّفتا عن العمل أثناء التعرّق", "ru": "Потому что почки во время потоотделения перестали работать", "en": "Because the kidneys stopped working during the sweating"}, {"he": "כי איבוד מים העלה את ריכוז הדם, והצמא מחזיר אותו לאיזון", "ar": "لأن فقدان الماء رفع تركيز الدم، والعطش يُعيده إلى التوازن", "ru": "Потому что потеря воды повысила концентрацию крови, и жажда возвращает равновесие", "en": "Because losing water raised the blood's concentration, and thirst restores the balance"}],3,{"he": "חשבו מה קורה לריכוז המלח בדם כשמים יוצאים ממנו.", "ar": "فكّروا بما يحدث لتركيز الملح في الدم عند خروج الماء منه.", "ru": "Подумайте, что происходит с концентрацией соли в крови, когда вода из неё уходит.", "en": "Think what happens to the salt concentration in the blood when water leaves it."},{"he": "בהזעה יוצאים מים, ולכן הדם נעשה מרוכז יותר. חיישנים בהיפותלמוס מזהים את הריכוז הגבוה, ומעוררים תחושת צמא וגם הפרשת הורמון ששומר מים בכליות. שתייה מחזירה את הריכוז לנורמה, וזו לולאת משוב שלילי.", "ar": "في التعرّق يخرج الماء، فيصبح الدم أكثر تركيزًا. مستقبلات في تحت المهاد تلاحظ التركيز العالي، فتُثير الإحساس بالعطش وإفراز هرمون يحفظ الماء في الكليتين. الشرب يُعيد التركيز إلى طبيعته، وهذه حلقة تغذية راجعة سالبة.", "ru": "При потоотделении уходит вода, и кровь становится более концентрированной. Датчики в гипоталамусе замечают высокую концентрацию и вызывают чувство жажды, а также выделение гормона, задерживающего воду в почках. Питьё возвращает концентрацию к норме — это петля отрицательной обратной связи.", "en": "Sweating loses water, so the blood becomes more concentrated. Sensors in the hypothalamus detect the high concentration and trigger thirst as well as a hormone that keeps water in the kidneys. Drinking brings the concentration back to normal, and this is a negative feedback loop."},null,[{"he": "הזיעה כמעט אינה מכילה סוכר, והצמא מגיב למים ולמלח.", "ar": "العرق لا يحتوي سكّرًا تقريبًا، والعطش يستجيب للماء والملح.", "ru": "В поте сахара почти нет, а жажда отвечает на воду и соль.", "en": "Sweat contains almost no sugar, and thirst responds to water and salt."}, {"he": "שתייה אינה מורידה חום ישירות, והקירור נעשה בהזעה ובכלי הדם.", "ar": "الشرب لا يخفّض الحرارة مباشرةً، والتبريد يحدث بالتعرّق وبالأوعية.", "ru": "Питьё напрямую температуру не снижает; охлаждение идёт потом и сосудами.", "en": "Drinking does not lower temperature directly; cooling is done by sweat and blood vessels."}, {"he": "הכליות ממשיכות לעבוד בהזעה, ואף שומרות מים ביתר שאת.", "ar": "تواصل الكليتان العمل أثناء التعرّق، بل تحفظان الماء أكثر.", "ru": "Почки во время потоотделения продолжают работать и даже сильнее берегут воду.", "en": "The kidneys keep working during sweating and in fact conserve water harder."}, null]),
    Q("homeo-2-9",{"he": "איך רעד בקור מסייע לשמור על טמפרטורת הגוף?", "ar": "كيف يساعد الرجفان في البرد على حفظ حرارة الجسم؟", "ru": "Как дрожь на холоде помогает сохранить температуру тела?", "en": "How does shivering in the cold help keep the body's temperature?"},[{"he": "התכווצויות שריר מהירות משחררות חום בגוף", "ar": "انقباضات العضلات السريعة تُحرّر حرارة في الجسم", "ru": "Быстрые сокращения мышц выделяют тепло в теле", "en": "Rapid muscle contractions release heat in the body"}, {"he": "הרעד מצמצם את כלי הדם בעור", "ar": "الرجفان يضيّق أوعية الدم في الجلد", "ru": "Дрожь сужает кровеносные сосуды кожи", "en": "Shivering narrows the skin's blood vessels"}, {"he": "הרעד מונע מהעור לגעת באוויר הקר", "ar": "الرجفان يمنع الجلد من ملامسة الهواء البارد", "ru": "Дрожь не даёт коже касаться холодного воздуха", "en": "Shivering keeps the skin from touching the cold air"}, {"he": "הרעד מעלה את כמות ההורמונים בדם בלבד", "ar": "الرجفان يرفع كمية الهرمونات في الدم فقط", "ru": "Дрожь лишь повышает количество гормонов в крови", "en": "Shivering only raises the amount of hormones in the blood"}],0,{"he": "חשבו למה מתחמם מי שרץ במקום בחורף.", "ar": "فكّروا لماذا يسخن من يركض في مكانه في الشتاء.", "ru": "Подумайте, почему согревается тот, кто бежит на месте зимой.", "en": "Think why someone running in place in winter warms up."},{"he": "שריר שמתכווץ צורך ATP, וחלק מהאנרגיה משתחרר כחום. ברעד השרירים מתכווצים ומשתחררים במהירות בלי תנועה מכוונת, ולכן נוצר חום בלי עבודה חיצונית. ההיפותלמוס מפעיל את הרעד כשחיישני הקור מדווחים על ירידה.", "ar": "العضلة المنقبضة تستهلك ATP، ويتحرّر جزء من الطاقة كحرارة. في الرجفان تنقبض العضلات وتنبسط بسرعة بلا حركة مقصودة، فتتكوّن حرارة بلا عمل خارجي. ويشغّل تحت المهاد الرجفان عندما تبلّغ مستقبلات البرد عن هبوط.", "ru": "Сокращающаяся мышца расходует АТФ, и часть энергии выделяется как тепло. При дрожи мышцы быстро сокращаются и расслабляются без осмысленного движения, поэтому тепло возникает без внешней работы. Гипоталамус включает дрожь, когда холодовые датчики сообщают о падении.", "en": "A contracting muscle uses ATP, and part of the energy is released as heat. In shivering the muscles contract and relax quickly with no purposeful movement, so heat is produced without any outside work. The hypothalamus triggers shivering when cold sensors report a drop."},null,[null, {"he": "צמצום כלי הדם הוא מנגנון נפרד, והרעד מייצר חום ואינו מצמצם.", "ar": "تضيّق الأوعية آلية منفصلة، والرجفان يُنتج حرارة ولا يضيّق.", "ru": "Сужение сосудов — отдельный механизм; дрожь производит тепло, а не сужает.", "en": "Narrowing the vessels is a separate mechanism; shivering makes heat, it does not narrow."}, {"he": "העור ממשיך לגעת באוויר גם ברעד, והיתרון הוא בחום שנוצר.", "ar": "يبقى الجلد ملامسًا للهواء أثناء الرجفان، والفائدة في الحرارة المتكوّنة.", "ru": "Кожа и при дрожи соприкасается с воздухом, а польза — в возникающем тепле.", "en": "The skin still touches the air while shivering; the benefit is the heat produced."}, {"he": "הורמונים אכן מעורבים, אבל הרעד עצמו מחמם דרך עבודת השרירים.", "ar": "الهرمونات مشاركة فعلًا، لكن الرجفان نفسه يسخّن عبر عمل العضلات.", "ru": "Гормоны действительно участвуют, но сама дрожь греет работой мышц.", "en": "Hormones are indeed involved, but shivering itself warms through muscle work."}]),
 ],
 [
    Q("homeo-3-1",{"he": "אדם עם סוכרת מסוג 1 אינו מייצר אינסולין. מה צפוי אחרי ארוחה עשירה בפחמימות?", "ar": "شخص مصاب بالسكري من النوع 1 لا يُنتج الإنسولين. ماذا نتوقع بعد وجبة غنية بالكربوهيدرات؟", "ru": "Человек с диабетом 1 типа не вырабатывает инсулин. Что ожидается после еды, богатой углеводами?", "en": "A person with type 1 diabetes does not make insulin. What is expected after a meal rich in carbohydrates?"},[{"he": "רמת הסוכר בדם תישאר גבוהה זמן רב", "ar": "سيبقى مستوى السكر في الدم مرتفعًا وقتًا طويلًا", "ru": "Уровень сахара в крови долго останется высоким", "en": "The blood sugar level will stay high for a long time"}, {"he": "רמת הסוכר תרד במהירות לאפס", "ar": "سينخفض السكر بسرعة إلى الصفر", "ru": "Уровень сахара быстро упадёт до нуля", "en": "Blood sugar will quickly fall to zero"}, {"he": "הגלוקוז יהפוך מיד לאינסולין", "ar": "سيتحوّل الغلوكوز فورًا إلى إنسولين", "ru": "Глюкоза сразу превратится в инсулин", "en": "Glucose will immediately turn into insulin"}, {"he": "לא יקרה כלום, כי הכבד מחליף את הלבלב ומפריש אינסולין", "ar": "لن يحدث شيء لأن الكبد يحلّ محل البنكرياس ويفرز الأنسولين", "ru": "Ничего не произойдёт: печень заменит поджелудочную и выделит инсулин", "en": "Nothing will happen, because the liver replaces the pancreas and secretes insulin"}],0,{"he": "מה קורה לגלוקוז בדם כשאין הורמון שמכניס אותו לתאים?", "ar": "ماذا يحدث للغلوكوز في الدم عندما لا يوجد هرمون يُدخله إلى الخلايا؟", "ru": "Что происходит с глюкозой в крови, если нет гормона, вводящего её в клетки?", "en": "What happens to glucose in the blood when no hormone moves it into the cells?"},{"he": "בלי אינסולין התאים אינם קולטים גלוקוז, ולכן הוא נשאר בדם. הרמה הגבוהה לאורך זמן פוגעת בגוף, ולכן חולים מקבלים אינסולין בהזרקה.", "ar": "بدون إنسولين لا تمتص الخلايا الغلوكوز فيبقى في الدم. والمستوى المرتفع لفترة طويلة يضرّ بالجسم، لذلك يتلقى المرضى الإنسولين بالحقن.", "ru": "Без инсулина клетки не поглощают глюкозу, и она остаётся в крови. Долго высокий уровень вредит организму, поэтому больные получают инсулин в инъекциях.", "en": "Without insulin the cells do not take up glucose, so it stays in the blood. A high level for a long time harms the body, which is why patients get insulin by injection."},null,[null, {"he": "בלי אינסולין הסוכר אינו נכנס לתאים, ולכן הרמה אינה יורדת.", "ar": "بلا أنسولين لا يدخل السكّر إلى الخلايا، لذلك لا ينخفض مستواه.", "ru": "Без инсулина сахар не входит в клетки, поэтому его уровень не падает.", "en": "Without insulin sugar does not enter the cells, so the level does not fall."}, {"he": "גלוקוז הוא סוכר ואינסולין הוא חלבון, וסוכר אינו הופך להורמון.", "ar": "الغلوكوز سكّر والأنسولين بروتين، والسكّر لا يتحوّل إلى هرمون.", "ru": "Глюкоза — сахар, а инсулин — белок; сахар не превращается в гормон.", "en": "Glucose is a sugar and insulin is a protein; sugar does not become a hormone."}, {"he": "הכבד אוגר גלוקוז, אבל הוא אינו מייצר אינסולין במקום הלבלב.", "ar": "الكبد يخزّن الغلوكوز، لكنه لا يُنتج الأنسولين بدلًا من البنكرياس.", "ru": "Печень запасает глюкозу, но не вырабатывает инсулин вместо поджелудочной.", "en": "The liver stores glucose, but it does not make insulin for the pancreas."}]),
    Q("homeo-3-2",{"he": "ביום חם מאוד אדם מזיע והעור שלו מאדים. איך זה קשור להומאוסטזיס?", "ar": "في يوم حارّ جدًا يتعرّق الإنسان ويحمرّ جلده. كيف يرتبط ذلك بالاتزان الداخلي؟", "ru": "В очень жаркий день человек потеет и кожа краснеет. Как это связано с гомеостазом?", "en": "On a very hot day a person sweats and the skin turns red. How is this related to homeostasis?"},[{"he": "התגובות מסייעות לאבד חום ולהחזיר את הטמפרטורה לערך התקין", "ar": "الاستجابات تساعد على فقدان الحرارة وإعادة الحرارة إلى القيمة الطبيعية", "ru": "Эти реакции помогают терять тепло и возвращают температуру к норме", "en": "The responses help lose heat and return the temperature to its normal value"}, {"he": "הן מעלות את טמפרטורת הגוף כדי שיתרגל בהדרגה לחום של היום החם", "ar": "إنها ترفع حرارة الجسم كي يتأقلم تدريجيًّا مع حرارة البيئة المحيطة في اليوم الحارّ", "ru": "Они повышают температуру тела, чтобы оно постепенно привыкло к жаре дня", "en": "They raise body temperature so that the body gradually adapts to the heat of the day"}, {"he": "הן סימן לכך שמנגנון ויסות החום בגוף הפסיק לפעול", "ar": "إنها علامة على أنّ آلية تنظيم الحرارة في الجسم توقّفت", "ru": "Они признак того, что механизм терморегуляции перестал работать", "en": "They are a sign that the body's heat-regulation mechanism has stopped"}, {"he": "הן אינן קשורות לטמפרטורה", "ar": "لا علاقة لها بالحرارة", "ru": "Они не связаны с температурой", "en": "They are not related to temperature"}],0,{"he": "זיעה מתאדה מהעור. מה קורה לחום כשנוזל מתאדה?", "ar": "العرق يتبخّر عن الجلد. ماذا يحدث للحرارة عندما يتبخّر سائل؟", "ru": "Пот испаряется с кожи. Что происходит с теплом при испарении жидкости?", "en": "Sweat evaporates from the skin. What happens to heat when a liquid evaporates?"},{"he": "כשהטמפרטורה בגוף עולה, כלי דם בעור מתרחבים והעור מאדים, והזיעה מתאדה ולוקחת חום. התגובות מקטינות את השינוי, וזה משוב שלילי.", "ar": "عندما ترتفع حرارة الجسم تتسع الأوعية الدموية في الجلد فيحمرّ، ويتبخّر العرق آخذًا الحرارة معه. الاستجابات تقلّل التغيّر، وهذه تغذية راجعة سالبة.", "ru": "Когда температура тела растёт, сосуды кожи расширяются, кожа краснеет, а пот испаряется и уносит тепло. Реакции уменьшают изменение — это отрицательная обратная связь.", "en": "When body temperature rises, blood vessels in the skin widen so the skin reddens, and sweat evaporates and takes heat away. The responses reduce the change, which is negative feedback."},null,[null, {"he": "הזעה והאדמה מורידות חום, והגוף אינו מעלה את חומו כדי להתרגל.", "ar": "التعرّق واحمرار الجلد يفقدان الحرارة، والجسم لا يرفع حرارته ليتأقلم.", "ru": "Пот и покраснение отдают тепло; тело не повышает температуру ради привычки.", "en": "Sweating and flushing lose heat; the body does not raise its temperature."}, {"he": "דווקא ההפך: הזעה והאדמה הן סימן שמנגנון ויסות החום עובד.", "ar": "العكس تمامًا: التعرّق واحمرار الجلد علامة على أن تنظيم الحرارة يعمل.", "ru": "Наоборот: пот и покраснение — признак того, что терморегуляция работает.", "en": "The opposite: sweating and flushing show that heat regulation is working."}, {"he": "שתי התגובות מופעלות בדיוק בגלל עליית הטמפרטורה בגוף.", "ar": "كلتا الاستجابتين تُفعَّلان بالضبط بسبب ارتفاع حرارة الجسم.", "ru": "Обе реакции запускаются именно из-за повышения температуры тела.", "en": "Both responses are triggered precisely by the rise in body temperature."}]),
    Q("homeo-3-3",{"he": "אדם בריא שתה משקה ממותק. רמת הסוכר בדמו עלתה, וכשעתיים אחר כך חזרה לערך ההתחלתי. מה מסביר את הירידה?", "ar": "شرب شخص سليم شرابًا محلّى. ارتفع السكّر في دمه، وبعد نحو ساعتين عاد إلى القيمة الأولى. ما يفسّر الهبوط؟", "ru": "Здоровый человек выпил сладкий напиток. Сахар в его крови поднялся, а через два часа вернулся к исходному значению. Что объясняет спад?", "en": "A healthy person drank a sweet drink. Their blood sugar rose and about two hours later returned to the starting value. What explains the fall?"},[{"he": "הסוכר התפרק מעצמו בדם בלי מעורבות הורמון", "ar": "تفكّك السكّر وحده في الدم بلا تدخّل هرمون", "ru": "Сахар сам распался в крови без участия гормона", "en": "The sugar broke down by itself in the blood with no hormone involved"}, {"he": "הכליות סילקו את כל עודף הסוכר בשתן", "ar": "طرحت الكليتان كل السكّر الزائد في البول", "ru": "Почки вывели весь избыток сахара с мочой", "en": "The kidneys removed all the excess sugar in the urine"}, {"he": "גלוקגון הופרש והוריד את רמת הסוכר", "ar": "أُفرِز الغلوكاغون فخفّض مستوى السكّر", "ru": "Выделился глюкагон и снизил уровень сахара", "en": "Glucagon was released and lowered the sugar level"}, {"he": "אינסולין הופרש, והסוכר נכנס לתאים ונאגר בכבד", "ar": "أُفرِز الإنسولين، فدخل السكّر الخلايا وخُزّن في الكبد", "ru": "Выделился инсулин, сахар вошёл в клетки и запасся в печени", "en": "Insulin was released, the sugar entered the cells and was stored in the liver"}],3,{"he": "שאלו איזה הורמון מופרש מהלבלב דווקא כשהסוכר גבוה.", "ar": "اسألوا أي هرمون يُفرَز من البنكرياس عندما يكون السكّر مرتفعًا.", "ru": "Спросите, какой гормон выделяется поджелудочной железой именно при высоком сахаре.", "en": "Ask which hormone the pancreas releases precisely when the sugar is high."},{"he": "העלייה בסוכר מזוהה בלבלב, והוא מפריש אינסולין. האינסולין פותח כניסה לגלוקוז בתאי שריר ושומן ומורה לכבד לאגור גליקוגן, ולכן הרמה בדם יורדת. כשהרמה חוזרת לנורמה ההפרשה פוחתת, וזהו משוב שלילי.", "ar": "يُلاحَظ ارتفاع السكّر في البنكرياس، فيُفرِز الإنسولين. يفتح الإنسولين دخول الغلوكوز إلى خلايا العضلات والدهن ويوجّه الكبد لتخزين الغلايكوجين، فينخفض المستوى في الدم. وعندما يعود المستوى إلى طبيعته يقلّ الإفراز، وهذه تغذية راجعة سالبة.", "ru": "Подъём сахара замечается поджелудочной железой, и она выделяет инсулин. Инсулин открывает вход глюкозе в мышечные и жировые клетки и велит печени запасать гликоген, поэтому уровень в крови падает. Когда уровень возвращается к норме, выделение уменьшается — это отрицательная обратная связь.", "en": "The rise in sugar is detected by the pancreas, which releases insulin. Insulin opens the way for glucose into muscle and fat cells and tells the liver to store glycogen, so the blood level falls. Once the level is back to normal the release eases off, and this is negative feedback."},null,[{"he": "גלוקוז אינו מתפרק מעצמו בדם, והירידה דורשת הורמון שמפנה אותו.", "ar": "الغلوكوز لا يتفكّك وحده في الدم، والهبوط يحتاج هرمونًا يُخرجه منه.", "ru": "Глюкоза сама в крови не распадается, и для спада нужен гормон, убирающий её.", "en": "Glucose does not break down by itself in the blood; the fall needs a hormone to clear it."}, {"he": "באדם בריא כמעט אין סוכר בשתן, כי הכליות מחזירות אותו לדם.", "ar": "عند الشخص السليم لا يكاد يوجد سكّر في البول، لأن الكليتين تُعيدانه إلى الدم.", "ru": "У здорового человека сахара в моче почти нет, потому что почки возвращают его в кровь.", "en": "In a healthy person there is almost no sugar in the urine, because the kidneys return it to the blood."}, {"he": "גלוקגון מעלה את רמת הסוכר, ולכן הוא אינו מסביר ירידה.", "ar": "الغلوكاغون يرفع مستوى السكّر، فلا يفسّر هبوطًا.", "ru": "Глюкагон повышает уровень сахара, поэтому спада он не объясняет.", "en": "Glucagon raises the sugar level, so it does not explain a fall."}, null]),
    Q("homeo-3-4",{"he": "אדם התאמן שעתיים בחום בלי לשתות. כמות השתן שלו ירדה והוא נעשה כהה. מה ההסבר?", "ar": "تمرّن شخص ساعتين في الحرّ دون أن يشرب. قلّت كمية بوله وصار غامقًا. ما التفسير؟", "ru": "Человек два часа тренировался в жару и не пил. Количество его мочи уменьшилось, и она стала тёмной. Каково объяснение?", "en": "A person trained for two hours in the heat without drinking. Their urine volume dropped and it turned dark. What is the explanation?"},[{"he": "הגוף שומר מים, והכליות מחזירות יותר מים לדם", "ar": "الجسم يحفظ الماء، والكليتان تُعيدان ماءً أكثر إلى الدم", "ru": "Тело берёжет воду, и почки возвращают в кровь больше воды", "en": "The body conserves water, and the kidneys return more water to the blood"}, {"he": "הכליות נפגעו מהחום והפסיקו לסנן", "ar": "تضرّرت الكليتان من الحرّ وتوقّفتا عن الترشيح", "ru": "Почки пострадали от жары и перестали фильтровать", "en": "The kidneys were damaged by the heat and stopped filtering"}, {"he": "שתנן הפסיק להיווצר בכבד בזמן המאמץ", "ar": "توقّف تكوّن اليوريا في الكبد أثناء المجهود", "ru": "Мочевина перестала образовываться в печени во время нагрузки", "en": "Urea stopped being made in the liver during the effort"}, {"he": "הגוף הפריש פחות הורמון ששומר מים", "ar": "أفرز الجسم كمية أقلّ من الهرمون الذي يحفظ الماء", "ru": "Тело выделило меньше гормона, сохраняющего воду", "en": "The body released less of the water-conserving hormone"}],0,{"he": "שאלו מה הגוף מנסה להציל כשהוא מאבד מים בהזעה.", "ar": "اسألوا ما يحاول الجسم إنقاذه عندما يفقد الماء بالتعرّق.", "ru": "Спросите, что тело пытается спасти, теряя воду с потом.", "en": "Ask what the body is trying to save when it loses water through sweat."},{"he": "הזעה ממושכת מוציאה מים, והדם נעשה מרוכז. ההיפותלמוס מגביר את הפרשת ההורמון ששומר מים, והכליות מחזירות מים רבים לדם. לכן נוצר מעט שתן, והוא מרוכז וכהה. הפסולת נשארת באותה כמות אך בפחות מים.", "ar": "التعرّق الطويل يُخرج الماء، فيصبح الدم مركّزًا. يزيد تحت المهاد إفراز الهرمون الذي يحفظ الماء، فتُعيد الكليتان ماءً كثيرًا إلى الدم. لذلك يتكوّن بول قليل مركّز وغامق. تبقى النفايات بالكمية نفسها لكن في ماء أقلّ.", "ru": "Длительное потоотделение уводит воду, и кровь становится концентрированной. Гипоталамус усиливает выделение водосберегающего гормона, и почки возвращают в кровь много воды. Поэтому мочи мало, она концентрированная и тёмная. Отходов столько же, но воды в них меньше.", "en": "Prolonged sweating removes water, and the blood becomes concentrated. The hypothalamus increases the water-conserving hormone, and the kidneys return a lot of water to the blood. So little urine is formed, and it is concentrated and dark. The waste amount is the same but there is less water with it."},null,[null, {"he": "שתן מרוכז מעיד שהכליות עובדות היטב ושומרות מים.", "ar": "البول المركّز يدلّ على أن الكليتين تعملان جيّدًا وتحفظان الماء.", "ru": "Концентрированная моча говорит, что почки работают хорошо и берегут воду.", "en": "Concentrated urine shows the kidneys are working well and conserving water."}, {"he": "שתנן ממשיך להיווצר, והוא בדיוק מה שמכהה את השתן המרוכז.", "ar": "تكوّن اليوريا مستمرّ، وهي بالضبط ما يُغمّق البول المركّز.", "ru": "Мочевина продолжает образовываться, и именно она делает концентрированную мочу тёмной.", "en": "Urea keeps being made, and it is exactly what darkens the concentrated urine."}, {"he": "פחות הורמון ששומר מים היה מגדיל את כמות השתן, לא מקטין.", "ar": "هرمون أقلّ لحفظ الماء كان سيزيد كمية البول لا يقلّلها.", "ru": "Меньше водосберегающего гормона увеличило бы объём мочи, а не уменьшило.", "en": "Less water-conserving hormone would raise the urine volume, not lower it."}]),
    Q("homeo-3-5",{"he": "תרופה חוסמת את הקולטן לאינסולין על תאי השריר. רמת האינסולין בדם תקינה. מה צפוי לרמת הסוכר?", "ar": "دواء يمنع مستقبل الإنسولين على خلايا العضلات. مستوى الإنسولين في الدم طبيعي. ما المتوقّع لمستوى السكّر؟", "ru": "Лекарство блокирует рецептор инсулина на мышечных клетках. Уровень инсулина в крови нормальный. Что ожидается с уровнем сахара?", "en": "A drug blocks the insulin receptor on muscle cells. The blood insulin level is normal. What is expected of the sugar level?"},[{"he": "הסוכר יירד מתחת לנורמה", "ar": "سينخفض السكّر تحت الطبيعي", "ru": "Сахар упадёт ниже нормы", "en": "The sugar will fall below normal"}, {"he": "הסוכר יישאר תקין, כי יש אינסולין בדם", "ar": "سيبقى السكّر طبيعيًّا، لأن في الدم إنسولين", "ru": "Сахар останется нормальным, ведь инсулин в крови есть", "en": "The sugar will stay normal, since there is insulin in the blood"}, {"he": "הסוכר יישאר גבוה למרות האינסולין", "ar": "سيبقى السكّر مرتفعًا رغم وجود الإنسولين", "ru": "Сахар останется высоким несмотря на инсулин", "en": "The sugar will stay high despite the insulin"}, {"he": "הלבלב יפסיק להפריש אינסולין לגמרי", "ar": "سيتوقّف البنكرياس عن إفراز الإنسولين تمامًا", "ru": "Поджелудочная железа совсем перестанет выделять инсулин", "en": "The pancreas will stop releasing insulin altogether"}],2,{"he": "שאלו מה צריך לקרות בתא כדי שההורמון יעשה את עבודתו.", "ar": "اسألوا ما يجب أن يحدث في الخلية كي يقوم الهرمون بعمله.", "ru": "Спросите, что должно произойти в клетке, чтобы гормон сделал свою работу.", "en": "Ask what has to happen in the cell for the hormone to do its work."},{"he": "הורמון פועל רק אחרי שהוא נקשר לקולטן. קולטן חסום פירושו שהתא אינו מקבל את ההוראה, ולכן גלוקוז אינו נכנס אליו והוא נשאר בדם. זה בדיוק המצב בסוכרת מסוג 2, שבה יש אינסולין אך התאים אינם מגיבים לו.", "ar": "الهرمون يعمل فقط بعد ارتباطه بمستقبل. المستقبل الممنوع يعني أن الخلية لا تتلقّى التعليمة، فلا يدخلها الغلوكوز ويبقى في الدم. وهذا بالضبط حال السكّري من النوع 2، حيث يوجد إنسولين لكن الخلايا لا تستجيب له.", "ru": "Гормон действует только после связывания с рецептором. Заблокированный рецептор означает, что клетка не получает указания, поэтому глюкоза в неё не входит и остаётся в крови. Именно так обстоит дело при диабете 2 типа: инсулин есть, но клетки на него не отвечают.", "en": "A hormone acts only once it binds a receptor. A blocked receptor means the cell never gets the instruction, so glucose does not enter it and stays in the blood. This is exactly the situation in type 2 diabetes, where insulin is present but the cells do not respond to it."},null,[{"he": "ירידה בסוכר דורשת כניסתו לתאים, והקולטן החסום מונע בדיוק את זה.", "ar": "انخفاض السكّر يحتاج دخوله إلى الخلايا، والمستقبل الممنوع يمنع ذلك بالضبط.", "ru": "Падение сахара требует его входа в клетки, а заблокированный рецептор именно это и запрещает.", "en": "A drop in sugar requires it entering the cells, and the blocked receptor prevents exactly that."}, {"he": "הורמון בדם אינו מועיל בלי קולטן פעיל שיקבל אותו.", "ar": "الهرمون في الدم لا يفيد بلا مستقبل نشط يتلقّاه.", "ru": "Гормон в крови бесполезен без работающего рецептора, который его примет.", "en": "A hormone in the blood is of no use without a working receptor to receive it."}, null, {"he": "סוכר גבוה דווקא מגביר הפרשת אינסולין, והלבלב ממשיך לעבוד.", "ar": "السكّر المرتفع يزيد إفراز الإنسولين، ويواصل البنكرياس عمله.", "ru": "Высокий сахар как раз усиливает выделение инсулина, и поджелудочная продолжает работать.", "en": "High sugar actually increases insulin release, and the pancreas keeps working."}]),
    Q("homeo-3-6",{"he": "אדם עם סוכרת הזריק אינסולין ואז דילג על הארוחה. מה הסיכון המיידי?", "ar": "شخص مصاب بالسكّري حقن إنسولينًا ثم تخطّى الوجبة. ما الخطر الفوري؟", "ru": "Человек с диабетом сделал инъекцию инсулина и затем пропустил приём пищи. В чём непосредственная опасность?", "en": "A person with diabetes injected insulin and then skipped the meal. What is the immediate danger?"},[{"he": "רמת הסוכר תעלה מאוד ותגרום לצמא", "ar": "سيرتفع السكّر كثيرًا ويسبّب عطشًا", "ru": "Уровень сахара сильно поднимется и вызовет жажду", "en": "The sugar level will rise sharply and cause thirst"}, {"he": "רמת הסוכר תצנח, והמוח יישאר בלי מקור אנרגיה", "ar": "سيهبط السكّر، ويبقى الدماغ بلا مصدر طاقة", "ru": "Уровень сахара упадёт, и мозг останется без источника энергии", "en": "The sugar level will crash, and the brain will be left without fuel"}, {"he": "הכליות יפסיקו לסנן את הדם בתוך דקות", "ar": "ستتوقّف الكليتان عن ترشيح الدم في دقائق", "ru": "Почки в считаные минуты перестанут фильтровать кровь", "en": "The kidneys will stop filtering the blood within minutes"}, {"he": "טמפרטורת הגוף תעלה מעל 40 מעלות", "ar": "ستتجاوز حرارة الجسم 40 درجة", "ru": "Температура тела поднимется выше 40 градусов", "en": "The body temperature will rise above 40 degrees"}],1,{"he": "שאלו מה האינסולין עושה לסוכר שבדם, וכמה סוכר נכנס לדם בלי ארוחה.", "ar": "اسألوا ما يفعله الإنسولين بالسكّر في الدم، وكم سكّرًا يدخل الدم بلا وجبة.", "ru": "Спросите, что инсулин делает с сахаром крови и сколько сахара поступает без еды.", "en": "Ask what insulin does to the blood sugar, and how much sugar enters the blood with no meal."},{"he": "האינסולין מכניס גלוקוז לתאים, אבל בלי ארוחה אין גלוקוז חדש שיחליף אותו. הרמה בדם צונחת מתחת לנורמה, ומכיוון שהמוח אינו אוגר סוכר מופיעים רעד, בלבול ואף אובדן הכרה. הטיפול המיידי הוא סוכר מהיר לפה.", "ar": "الإنسولين يُدخل الغلوكوز إلى الخلايا، لكن بلا وجبة لا يوجد غلوكوز جديد يحلّ مكانه. يهبط المستوى في الدم تحت الطبيعي، ولأن الدماغ لا يخزّن السكّر تظهر رجفة وتشوّش بل فقدان وعي. والعلاج الفوري سكّر سريع عن طريق الفم.", "ru": "Инсулин загоняет глюкозу в клетки, но без еды новой глюкозы, которая её заменит, нет. Уровень в крови падает ниже нормы, и, поскольку мозг сахар не запасает, появляются дрожь, спутанность и даже потеря сознания. Немедленная помощь — быстрый сахар внутрь.", "en": "Insulin drives glucose into the cells, but with no meal there is no new glucose to replace it. The blood level crashes below normal, and since the brain stores no sugar there is trembling, confusion and even loss of consciousness. The immediate treatment is fast sugar by mouth."},null,[{"he": "עלייה בסוכר קורית כשחסר אינסולין, וכאן הוא דווקא ניתן.", "ar": "ارتفاع السكّر يحدث عند نقص الإنسولين، وهنا قد أُعطي فعلًا.", "ru": "Подъём сахара бывает при нехватке инсулина, а здесь его как раз ввели.", "en": "A rise in sugar happens when insulin is lacking, and here it was actually given."}, null, {"he": "הכליות אינן נעצרות מירידת סוכר, והסכנה היא למוח.", "ar": "الكليتان لا تتوقّفان من هبوط السكّر، والخطر على الدماغ.", "ru": "Почки от падения сахара не останавливаются; опасность — для мозга.", "en": "The kidneys do not stop because sugar falls; the danger is to the brain."}, {"he": "רמת סוכר אינה קובעת את טמפרטורת הגוף, וחום אינו הסכנה כאן.", "ar": "مستوى السكّر لا يحدّد حرارة الجسم، والحمّى ليست الخطر هنا.", "ru": "Уровень сахара температуру тела не задаёт, и жар здесь не опасность.", "en": "The sugar level does not set the body temperature, and fever is not the danger here."}]),
    Q("homeo-3-7",{"he": "נמדדה טמפרטורת הגוף של אדם בחדר שהתחמם מ-10 ל-35 מעלות. היא נשארה סביב 37. מה המדידה מראה?", "ar": "قيست حرارة جسم شخص في غرفة سخنت من 10 إلى 35 درجة. بقيت نحو 37. على ماذا يدلّ القياس؟", "ru": "Измеряли температуру тела человека в комнате, которая прогревалась с 10 до 35 градусов. Она осталась около 37. Что показывает измерение?", "en": "A person's body temperature was measured in a room warming from 10 to 35 degrees. It stayed around 37. What does the measurement show?"},[{"he": "שהמדחום לא היה מכויל נכון", "ar": "أن مقياس الحرارة لم يكن معيّرًا جيّدًا", "ru": "Что термометр был плохо откалиброван", "en": "That the thermometer was not calibrated properly"}, {"he": "שטמפרטורת החדר אינה משפיעה על הגוף בכלל", "ar": "أن حرارة الغرفة لا تؤثّر على الجسم أبدًا", "ru": "Что температура комнаты на тело вовсе не влияет", "en": "That room temperature has no effect on the body at all"}, {"he": "שהאדם היה חולה בחום לאורך כל המדידה", "ar": "أن الشخص كان محمومًا طوال القياس", "ru": "Что человек всё время измерения был с жаром", "en": "That the person had a fever throughout the measurement"}, {"he": "שמנגנוני בקרה שמרו על טמפרטורה קבועה בכל התנאים", "ar": "أن آليات تحكّم حفظت حرارة ثابتة في كل الظروف", "ru": "Что механизмы регуляции держали постоянную температуру при всех условиях", "en": "That control mechanisms held a steady temperature under all conditions"}],3,{"he": "שאלו מה היה קורה לאותה מדידה בלטאה במקום באדם.", "ar": "اسألوا ماذا كان سيحدث للقياس نفسه عند سحلية بدلًا من إنسان.", "ru": "Спросите, что дало бы то же измерение у ящерицы вместо человека.", "en": "Ask what the same measurement would give in a lizard instead of a human."},{"he": "טמפרטורת פנים הגוף נשמרה קבועה בזמן שהסביבה השתנתה ב-25 מעלות. זה בדיוק הומאוסטזיס: ההיפותלמוס הפעיל הזעה והרחבת כלי דם בחום, ורעד וצמצום בקור. בלטאה, שאינה מווסתת כך, הטמפרטורה היתה עולה עם החדר.", "ar": "بقيت حرارة داخل الجسم ثابتة في حين تغيّرت البيئة 25 درجة. وهذا بالضبط الاتزان الداخلي: شغّل تحت المهاد التعرّق وتوسيع الأوعية في الحرّ، والرجفان والتضيّق في البرد. وعند السحلية، التي لا تنظّم هكذا، كانت الحرارة ترتفع مع الغرفة.", "ru": "Внутренняя температура тела держалась постоянной, пока среда менялась на 25 градусов. Это и есть гомеостаз: гипоталамус включал потоотделение и расширение сосудов в жару, дрожь и сужение в холод. У ящерицы, которая так не регулирует, температура росла бы вместе с комнатой.", "en": "The body's core temperature stayed steady while the surroundings changed by 25 degrees. That is precisely homeostasis: the hypothalamus triggered sweating and vessel widening in the heat, shivering and narrowing in the cold. In a lizard, which does not regulate this way, the temperature would rise with the room."},null,[{"he": "מדחום תקין הוא מה שמראה 37 בגוף בריא, ואין כאן סימן לתקלה.", "ar": "مقياس الحرارة السليم هو ما يُظهر 37 في جسم سليم، ولا دليل على خلل.", "ru": "Исправный термометр как раз и показывает 37 у здорового тела, признаков сбоя нет.", "en": "A working thermometer is what shows 37 in a healthy body, and there is no sign of a fault."}, {"he": "הסביבה כן משפיעה, ולכן הגוף נדרש להפעיל מנגנונים כדי לפצות.", "ar": "البيئة تؤثّر فعلًا، لذلك يحتاج الجسم لتشغيل آليات للتعويض.", "ru": "Среда влияет, поэтому телу и приходится включать механизмы, чтобы компенсировать.", "en": "The environment does have an effect, which is why the body must run mechanisms to compensate."}, {"he": "37 מעלות הן הערך התקין, ולא חום.", "ar": "37 درجة هي القيمة الطبيعية، وليست حمّى.", "ru": "37 градусов — это норма, а не жар.", "en": "37 degrees is the normal value, not a fever."}, null]),
    Q("homeo-3-8",{"he": "בניסוי על הפרשת שתן, קבוצה אחת שותה ליטר מים וקבוצה שנייה אינה שותה. איזה תנאי חייב להיות זהה בשתי הקבוצות?", "ar": "في تجربة على طرح البول، مجموعة تشرب لترًا من الماء ومجموعة لا تشرب. أي شرط يجب أن يكون متماثلًا في المجموعتين؟", "ru": "В опыте по выделению мочи одна группа пьёт литр воды, а другая не пьёт. Какое условие должно быть одинаковым в обеих группах?", "en": "In an experiment on urine output, one group drinks a litre of water and the other drinks none. Which condition must be the same in both groups?"},[{"he": "כמות המים שהם שותים", "ar": "كمية الماء التي يشربونها", "ru": "Количество воды, которое они пьют", "en": "The amount of water they drink"}, {"he": "כמות השתן שהם מפרישים", "ar": "كمية البول التي يطرحونها", "ru": "Количество мочи, которое они выделяют", "en": "The amount of urine they produce"}, {"he": "טמפרטורת החדר וכמות המלח במזון", "ar": "حرارة الغرفة وكمية الملح في الطعام", "ru": "Температура помещения и количество соли в пище", "en": "The room temperature and the amount of salt in their food"}, {"he": "ריכוז השתן בסוף הניסוי", "ar": "تركيز البول في نهاية التجربة", "ru": "Концентрация мочи в конце опыта", "en": "The concentration of the urine at the end"}],2,{"he": "הפרידו בין מה שהנסיין משנה, מה שהוא מודד, ומה שהוא משאיר קבוע.", "ar": "افصلوا بين ما يغيّره الباحث، وما يقيسه، وما يُبقيه ثابتًا.", "ru": "Разделите то, что исследователь меняет, что измеряет и что оставляет постоянным.", "en": "Separate what the researcher changes, what they measure, and what they keep constant."},{"he": "בניסוי טוב משנים משתנה אחד בלבד: כאן כמות השתייה. כמות השתן וריכוזו הם מה שנמדד, ולכן אסור לקבוע אותם מראש. חום החדר וכמות המלח משפיעים על אובדן מים, ולכן הם חייבים להיות שווים כדי שההבדל ייוחס לשתייה.", "ar": "في التجربة الجيّدة يُغيَّر متغيّر واحد فقط: هنا كمية الشرب. كمية البول وتركيزه هما ما يُقاس، فلا يصحّ تحديدهما مسبقًا. حرارة الغرفة وكمية الملح تؤثّران على فقدان الماء، لذلك يجب أن تكونا متساويتين كي يُنسَب الفرق إلى الشرب.", "ru": "В хорошем опыте меняют только одну переменную: здесь это количество питья. Количество мочи и её концентрация — это то, что измеряют, поэтому задавать их заранее нельзя. Температура помещения и количество соли влияют на потерю воды, поэтому они должны быть равны, чтобы разницу можно было отнести к питью.", "en": "In a sound experiment only one variable is changed: here, the amount drunk. The urine volume and its concentration are what is measured, so they must not be fixed in advance. Room temperature and salt intake affect water loss, so they must be equal for the difference to be credited to the drinking."},null,[{"he": "כמות השתייה היא המשתנה שהניסוי משנה בכוונה, ולכן אינה זהה.", "ar": "كمية الشرب هي المتغيّر الذي تغيّره التجربة بقصد، فهي ليست متماثلة.", "ru": "Количество питья — переменная, которую опыт меняет намеренно, поэтому одинаковой она не бывает.", "en": "The amount drunk is the variable the experiment changes on purpose, so it is not the same."}, {"he": "כמות השתן היא התוצאה שנמדדת, ואי אפשר לדרוש שתהיה זהה.", "ar": "كمية البول هي النتيجة المقيسة، ولا يصحّ طلب تماثلها.", "ru": "Количество мочи — измеряемый результат, требовать его одинаковости нельзя.", "en": "The urine volume is the measured outcome; it cannot be required to be the same."}, null, {"he": "ריכוז השתן הוא גם תוצאה, והוא בדיוק מה שמצפים שיהיה שונה.", "ar": "تركيز البول نتيجة أيضًا، وهو بالضبط ما يُتوقَّع أن يختلف.", "ru": "Концентрация мочи — тоже результат, и именно её ожидают разной.", "en": "Urine concentration is an outcome too, and it is precisely what is expected to differ."}]),
    Q("homeo-3-9",{"he": "לאדם עם חום של 39 מעלות קר והוא רועד. איך זה מתיישב עם בקרת הטמפרטורה?", "ar": "شخص حرارته 39 درجة يشعر بالبرد ويرتجف. كيف يتّفق ذلك مع التحكّم بالحرارة؟", "ru": "Человеку с температурой 39 холодно, и он дрожит. Как это согласуется с регуляцией температуры?", "en": "A person with a fever of 39 feels cold and is shivering. How does this fit with temperature control?"},[{"he": "מרכז הבקרה העלה את הערך המבוקש, והגוף פועל להגיע אליו", "ar": "مركز التحكّم رفع القيمة المطلوبة، والجسم يعمل للوصول إليها", "ru": "Центр регуляции поднял заданное значение, и тело работает, чтобы его достичь", "en": "The control centre raised the set point, and the body is working to reach it"}, {"he": "בקרת הטמפרטורה מפסיקה לפעול בזמן מחלה", "ar": "التحكّم بالحرارة يتوقّف أثناء المرض", "ru": "Регуляция температуры во время болезни прекращает работать", "en": "Temperature control shuts down during illness"}, {"he": "הרעד מוריד את החום, ולכן הגוף רועד בכל חום", "ar": "الرجفان يخفّض الحمّى، لذلك يرتجف الجسم في كل حمّى", "ru": "Дрожь снижает жар, поэтому тело дрожит при любом жаре", "en": "Shivering lowers a fever, so the body shivers in every fever"}, {"he": "המדחום מדד את טמפרטורת העור ולא את פנים הגוף", "ar": "قاس مقياس الحرارة حرارة الجلد لا داخل الجسم", "ru": "Термометр измерил температуру кожи, а не внутренней части тела", "en": "The thermometer measured skin temperature and not the body's core"}],0,{"he": "חשבו על מזגן שמישהו שינה בו את הטמפרטורה המבוקשת.", "ar": "فكّروا بمكيّف غيّر أحدهم درجة الحرارة المطلوبة فيه.", "ru": "Подумайте о кондиционере, в котором кто-то изменил заданную температуру.", "en": "Think of an air conditioner whose set temperature someone has changed."},{"he": "בזמן זיהום חומרים מהמערכת החיסונית מעלים את הערך המבוקש בהיפותלמוס, למשל ל-39. מול הערך החדש 37 נחשב נמוך, ולכן הגוף מפעיל רעד וצמצום כלי דם ומרגיש קר. כשהחום שובר, הערך המבוקש חוזר ל-37 והאדם מזיע.", "ar": "أثناء العدوى ترفع موادّ من جهاز المناعة القيمة المطلوبة في تحت المهاد، إلى 39 مثلًا. وبمقابل القيمة الجديدة تُعدّ 37 منخفضة، فيشغّل الجسم الرجفان وتضيّق الأوعية ويشعر بالبرد. وعندما تنكسر الحمّى تعود القيمة المطلوبة إلى 37 فيتعرّق الشخص.", "ru": "При инфекции вещества иммунной системы поднимают заданное значение в гипоталамусе, например до 39. По сравнению с новым значением 37 считается низким, поэтому тело включает дрожь и сужение сосудов и чувствует холод. Когда жар спадает, заданное значение возвращается к 37, и человек потеет.", "en": "During an infection, substances from the immune system raise the set point in the hypothalamus, to 39 for example. Against the new set point 37 counts as low, so the body triggers shivering and vessel narrowing and feels cold. When the fever breaks, the set point returns to 37 and the person sweats."},null,[null, {"he": "הבקרה דווקא עובדת בחום, ורק הערך שאליו היא מכוונת השתנה.", "ar": "التحكّم يعمل أثناء الحمّى، وما تغيّر هو القيمة التي يستهدفها فقط.", "ru": "Регуляция при жаре как раз работает, изменилось лишь целевое значение.", "en": "Control is in fact working during fever; only the value it aims at has changed."}, {"he": "רעד מייצר חום ומעלה את הטמפרטורה, ואינו מוריד אותה.", "ar": "الرجفان يُنتج حرارة ويرفعها، ولا يخفّضها.", "ru": "Дрожь производит тепло и температуру повышает, а не снижает.", "en": "Shivering produces heat and raises the temperature; it does not lower it."}, {"he": "39 מעלות נמדדות בפנים הגוף, ותחושת הקור היא בעור ואינה טעות מדידה.", "ar": "39 درجة تُقاس داخل الجسم، والإحساس بالبرد في الجلد وليس خطأ قياس.", "ru": "39 градусов измеряют внутри тела, а ощущение холода — в коже и ошибкой измерения не является.", "en": "The 39 is measured in the core, and the feeling of cold is in the skin, not a measuring error."}]),
 ]
]);

topic("bio-evol","043381",
  {"he": "תורשה ואבולוציה", "ar": "الوراثة والتطور", "ru": "Наследственность и эволюция", "en": "Heredity and evolution"},
  {"he": "אללים, הצלבות וברירה טבעית", "ar": "الأليلات والتزاوجات والانتخاب الطبيعي", "ru": "Аллели, скрещивания и естественный отбор", "en": "Alleles, crosses and natural selection"},
[
 [
    Q("evol-1-1",{"he": "מהו אלל?", "ar": "ما الأليل؟", "ru": "Что такое аллель?", "en": "What is an allele?"},[{"he": "צורה אחת של גן מסוים", "ar": "شكل واحد من جين معيّن", "ru": "Одна из форм определённого гена", "en": "One form of a particular gene"}, {"he": "כרומוזום שלם שעליו יושבים גנים רבים", "ar": "كروموسوم كامل تقع عليه جينات كثيرة", "ru": "Целая хромосома, на которой расположено много генов", "en": "A whole chromosome carrying many genes"}, {"he": "חלבון שמאיץ תגובה", "ar": "بروتين يُسرّع تفاعلًا", "ru": "Белок, ускоряющий реакцию", "en": "A protein that speeds up a reaction"}, {"he": "תא רבייה שנושא מחצית ממספר הכרומוזומים", "ar": "خلية تناسلية تحمل نصف عدد الكروموسومات", "ru": "Половая клетка, несущая половину числа хромосом", "en": "A sex cell carrying half the number of chromosomes"}],0,{"he": "לגן של צבע עיניים יש כמה גרסאות.", "ar": "لجين لون العينين عدة نسخ.", "ru": "У гена цвета глаз есть несколько вариантов.", "en": "The gene for eye color has several versions."},{"he": "לכל גן יכולות להיות כמה גרסאות, והן נקראות אללים. לכל אדם יש שני אללים לכל גן, אחד מכל הורה.", "ar": "يمكن أن يكون لكل جين عدة نسخ تسمى أليلات. لكل إنسان أليلان لكل جين، واحد من كل والد.", "ru": "У каждого гена может быть несколько вариантов — аллелей. У каждого человека по два аллеля каждого гена, по одному от каждого родителя.", "en": "Each gene can have several versions, called alleles. Each person has two alleles for each gene, one from each parent."},null,[null, {"he": "כרומוזום נושא גנים רבים, ואילו אלל הוא גרסה של גן אחד.", "ar": "الكروموسوم يحمل جينات كثيرة، أمّا الأليل فهو نسخة من جين واحد.", "ru": "Хромосома несёт много генов, а аллель — вариант одного гена.", "en": "A chromosome carries many genes, while an allele is one version of a gene."}, {"he": "חלבון שמאיץ תגובה הוא אנזים, והוא תוצר של הגן ולא גרסה שלו.", "ar": "البروتين الذي يسرّع التفاعل هو إنزيم، وهو ناتج الجين لا نسخة منه.", "ru": "Белок, ускоряющий реакцию, — фермент, продукт гена, а не его вариант.", "en": "A protein that speeds a reaction is an enzyme, a product of the gene."}, {"he": "תא רבייה הוא תא שלם שנושא אללים, והוא עצמו אינו אלל.", "ar": "الخلية التناسلية خلية كاملة تحمل أليلات، وهي نفسها ليست أليلًا.", "ru": "Половая клетка — целая клетка, несущая аллели, но сама она не аллель.", "en": "A sex cell is a whole cell that carries alleles; it is not itself an allele."}]),
    Q("evol-1-2",{"he": "מה אומרת ברירה טבעית?", "ar": "ماذا يقول الانتخاب الطبيعي؟", "ru": "О чём говорит естественный отбор?", "en": "What does natural selection say?"},[{"he": "יצורים עם תכונות מתאימות לסביבה שורדים ומתרבים יותר", "ar": "الكائنات ذات الصفات الملائمة للبيئة تبقى وتتكاثر أكثر", "ru": "Организмы с признаками, подходящими к среде, выживают и размножаются больше", "en": "Organisms with traits suited to the environment survive and reproduce more"}, {"he": "יצורים מפתחים בחייהם תכונות שמתאימות לסביבה ומעבירים אותן לצאצאיהם", "ar": "الكائنات تطوّر في حياتها صفات تلائم البيئة وتنقلها إلى أبنائها بعد ذلك", "ru": "Организмы при жизни вырабатывают подходящие среде признаки и передают их детям", "en": "Organisms develop traits suited to the environment during life and pass them on"}, {"he": "החזקים והגדולים ביותר הם ששורדים, בלי קשר לסביבה", "ar": "الأقوى والأكبر هم الذين ينجون، بلا علاقة بالبيئة", "ru": "Выживают самые сильные и крупные, независимо от среды", "en": "The strongest and largest survive, regardless of the environment"}, {"he": "כל היצורים זהים זה לזה", "ar": "كل الكائنات متطابقة", "ru": "Все организмы одинаковы", "en": "All organisms are identical"}],0,{"he": "לא החזק ביותר אלא המתאים ביותר לסביבה שלו.", "ar": "ليس الأقوى بل الأكثر ملاءمة لبيئته.", "ru": "Не самый сильный, а самый подходящий к своей среде.", "en": "Not the strongest but the one best suited to its environment."},{"he": "באוכלוסייה יש שוני בין פרטים. מי שהתכונות שלו מתאימות לסביבה מצליח יותר להשאיר צאצאים, ולכן התכונות האלה נעשות נפוצות יותר לאורך הדורות.", "ar": "في المجموعة اختلافات بين الأفراد. من تلائم صفاته البيئة ينجح أكثر في ترك ذرية، فتصبح هذه الصفات أكثر انتشارًا عبر الأجيال.", "ru": "В популяции особи различаются. Тот, чьи признаки подходят к среде, чаще оставляет потомство, и эти признаки становятся всё более распространёнными в поколениях.", "en": "A population has differences between individuals. Those whose traits suit the environment leave more offspring, so these traits become more common over the generations."},null,[null, {"he": "תכונה שנרכשת בחיי הפרט אינה נכתבת ב-DNA, ולכן אינה עוברת לצאצאים.", "ar": "الصفة المكتسبة في حياة الفرد لا تُكتب في الـDNA، لذلك لا تنتقل إلى الأبناء.", "ru": "Признак, приобретённый при жизни, не пишется в ДНК и не передаётся детям.", "en": "A trait acquired during life is not written into DNA, so it is not passed on."}, {"he": "לא הכוח קובע אלא ההתאמה: לפעמים דווקא הקטן והמוסווה שורד.", "ar": "ليست القوّة هي الفيصل بل الملاءمة: أحيانًا ينجو الصغير المموَّه بالذات.", "ru": "Решает не сила, а приспособленность: иногда выживает мелкий и незаметный.", "en": "Fitness decides, not strength: sometimes the small, camouflaged one survives."}, {"he": "ברירה טבעית פועלת דווקא על השוני, ובלי שוני אין לה על מה לפעול.", "ar": "الانتخاب الطبيعي يعمل على الاختلاف بالذات، وبلا اختلاف لا شيء يعمل عليه.", "ru": "Отбор действует именно на различия; без них ему не на что действовать.", "en": "Natural selection acts on variation; without it there is nothing to act on."}]),
    Q("evol-1-3",{"he": "מהו פנוטיפ?", "ar": "ما الطراز الظاهري (الفينوتيب)؟", "ru": "Что такое фенотип?", "en": "What is a phenotype?"},[{"he": "צירוף האללים שיש לפרט", "ar": "تركيب الأليلات التي يملكها الفرد", "ru": "Сочетание аллелей, которые есть у особи", "en": "The combination of alleles an individual has"}, {"he": "מספר הכרומוזומים בתא גוף", "ar": "عدد الكروموسومات في خلية جسدية", "ru": "Число хромосом в клетке тела", "en": "The number of chromosomes in a body cell"}, {"he": "התכונה שנראית בפרט בפועל", "ar": "الصفة التي تظهر في الفرد فعلًا", "ru": "Признак, который у особи виден на деле", "en": "The trait that actually shows in the individual"}, {"he": "מוטציה שעברה מההורים", "ar": "طفرة انتقلت من الوالدين", "ru": "Мутация, перешедшая от родителей", "en": "A mutation passed on from the parents"}],2,{"he": "שאלו מה אפשר לראות בעין, בלי בדיקת מעבדה.", "ar": "اسألوا ما يمكن رؤيته بالعين، دون فحص مخبري.", "ru": "Спросите, что можно увидеть глазом, без лабораторного анализа.", "en": "Ask what can be seen with the eye, without a lab test."},{"he": "הגנוטיפ הוא צירוף האללים, והפנוטיפ הוא מה שמתבטא בפועל: צבע עיניים, גובה, סוג דם. לפעמים שני גנוטיפים שונים נותנים אותו פנוטיפ, למשל AA ו-Aa בתכונה דומיננטית. הסביבה משפיעה גם היא על הפנוטיפ.", "ar": "الطراز الوراثي هو تركيب الأليلات، والطراز الظاهري هو ما يتجلّى فعلًا: لون العينين، الطول، زمرة الدم. وأحيانًا يعطي طرازان وراثيان مختلفان الطراز الظاهري نفسه، مثل AA وAa في صفة سائدة. والبيئة تؤثّر أيضًا على الطراز الظاهري.", "ru": "Генотип — это сочетание аллелей, а фенотип — то, что проявляется на деле: цвет глаз, рост, группа крови. Иногда два разных генотипа дают один фенотип, например AA и Aa при доминантном признаке. Среда тоже влияет на фенотип.", "en": "The genotype is the combination of alleles, and the phenotype is what actually shows: eye colour, height, blood group. Sometimes two different genotypes give the same phenotype, such as AA and Aa for a dominant trait. The environment affects the phenotype too."},null,[{"he": "צירוף האללים הוא הגנוטיפ, והפנוטיפ הוא מה שרואים.", "ar": "تركيب الأليلات هو الطراز الوراثي، والطراز الظاهري هو ما نراه.", "ru": "Сочетание аллелей — это генотип, а фенотип — то, что видно.", "en": "The combination of alleles is the genotype; the phenotype is what is seen."}, {"he": "מספר הכרומוזומים זהה בכל בני אותו מין, ואינו התכונה הנראית.", "ar": "عدد الكروموسومات متماثل في كل أفراد النوع، وليس الصفة الظاهرة.", "ru": "Число хромосом одинаково у всех особей вида и видимым признаком не является.", "en": "The chromosome number is the same in all members of a species and is not the visible trait."}, null, {"he": "מוטציה היא שינוי במידע, ואילו הפנוטיפ הוא התכונה שמתבטאת.", "ar": "الطفرة تغيّر في المعلومة، أما الطراز الظاهري فهو الصفة المتجلّية.", "ru": "Мутация — изменение информации, а фенотип — проявившийся признак.", "en": "A mutation is a change in the information, while the phenotype is the trait expressed."}]),
    Q("evol-1-4",{"he": "מה פירוש הומוזיגוט לתכונה מסוימת?", "ar": "ما معنى أن الفرد نقيّ لصفة معيّنة؟", "ru": "Что значит быть гомозиготой по определённому признаку?", "en": "What does it mean to be homozygous for a given trait?"},[{"he": "שני האללים של הפרט לאותו גן זהים", "ar": "أليلا الفرد للجين نفسه متماثلان", "ru": "Два аллеля особи для этого гена одинаковы", "en": "The individual's two alleles for that gene are identical"}, {"he": "לפרט יש אלל אחד בלבד לאותו גן", "ar": "للفرد أليل واحد فقط لهذا الجين", "ru": "У особи только один аллель для этого гена", "en": "The individual has only one allele for that gene"}, {"he": "לפרט יש שלושה אללים לאותו גן", "ar": "للفرد ثلاثة أليلات لهذا الجين", "ru": "У особи три аллеля для этого гена", "en": "The individual has three alleles for that gene"}, {"he": "האלל של הפרט נוצר במוטציה חדשה", "ar": "أليل الفرد نشأ بطفرة جديدة", "ru": "Аллель особи возник в новой мутации", "en": "The individual's allele arose in a new mutation"}],0,{"he": "שימו לב למשמעות של ״הומו״, שפירושה זהה.", "ar": "انتبهوا لمعنى «هومو»، أي متماثل.", "ru": "Обратите внимание на значение «гомо» — одинаковый.", "en": "Note the meaning of homo, which is same."},{"he": "לכל גן בתא גוף יש שני אללים, אחד מכל הורה. הומוזיגוט פירושו ששניהם זהים, למשל AA או aa. בהטרוזיגוט הם שונים, Aa, ואז האלל הדומיננטי הוא שמתבטא.", "ar": "لكل جين في خلية جسدية أليلان، واحد من كل والد. والنقيّ يعني أنهما متماثلان، مثل AA أو aa. أما غير النقيّ فهما مختلفان، Aa، وحينها يتجلّى الأليل السائد.", "ru": "У каждого гена в клетке тела два аллеля, по одному от каждого родителя. Гомозигота означает, что они одинаковы, например AA или aa. У гетерозиготы они разные, Aa, и тогда проявляется доминантный аллель.", "en": "Every gene in a body cell has two alleles, one from each parent. Homozygous means both are identical, such as AA or aa. In a heterozygote they differ, Aa, and then the dominant allele is the one expressed."},null,[null, {"he": "תא גוף נושא שני אללים לכל גן, ואלל יחיד יש רק בתא רבייה.", "ar": "خلية الجسم تحمل أليلين لكل جين، والأليل الواحد في الخلية التناسلية فقط.", "ru": "Клетка тела несёт два аллеля на ген, один аллель бывает только в половой клетке.", "en": "A body cell carries two alleles per gene; a single allele exists only in a sex cell."}, {"he": "שלושה אללים אינם אפשריים בפרט אחד, גם כשבאוכלוסייה יש יותר משניים.", "ar": "ثلاثة أليلات غير ممكنة في فرد واحد، حتى لو وُجد في المجموعة أكثر من اثنين.", "ru": "Три аллеля у одной особи невозможны, даже если в популяции их больше двух.", "en": "Three alleles are impossible in one individual, even when a population has more than two."}, {"he": "מוטציה חדשה אינה חלק מההגדרה, והשאלה היא רק אם האללים זהים.", "ar": "الطفرة الجديدة ليست جزءًا من التعريف، والسؤال فقط إن كان الأليلان متماثلين.", "ru": "Новая мутация в определение не входит; вопрос лишь в том, одинаковы ли аллели.", "en": "A new mutation is not part of the definition; the question is only whether the alleles match."}]),
