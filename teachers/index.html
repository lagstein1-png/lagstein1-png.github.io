.steps li b{color:var(--ink);font-weight:700}

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
var SPK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3z"/><path d="M16.5 12a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/><path d="M14 3.2v2.1a6.8 6.8 0 0 1 0 13.4v2.1a8.8 8.8 0 0 0 0-17.6z"/></svg>';
var cur="he";
function T(){return S[cur]}
var speakingBtn=null;
function stopSpeak(){
  if(window.speechSynthesis)speechSynthesis.cancel();
  if(speakingBtn){speakingBtn.setAttribute("aria-pressed","false");speakingBtn=null}
}
function speak(txt,btn){
  if(!window.speechSynthesis)return;
  if(speakingBtn===btn){stopSpeak();return}
  stopSpeak();
  var langMap={he:"he-IL",ar:"ar-SA",ru:"ru-RU",en:"en-US"};
  var u=new SpeechSynthesisUtterance(txt);
  u.lang=langMap[cur]||"he-IL";
  var vs=speechSynthesis.getVoices();
  for(var i=0;i<vs.length;i++){
    if(vs[i].lang&&vs[i].lang.toLowerCase().indexOf(u.lang.slice(0,2))===0){u.voice=vs[i];break}
  }
  u.rate=0.95;
  u.onend=function(){if(speakingBtn===btn){btn.setAttribute("aria-pressed","false");speakingBtn=null}};
  speakingBtn=btn;
  btn.setAttribute("aria-pressed","true");
  speechSynthesis.speak(u);
}
function sayBtn(txt){
  return '<button class="say" type="button" data-say="'+esc(txt)+'" aria-label="'+esc(T().say)+'" aria-pressed="false">'+SPK+'</button>';
}
function lk(o){
  var txt=o.t+". "+o.d;
  return '<a class="lk" href="'+U[o.u]+'"><b>'+esc(o.t)+'</b><span>'+esc(o.d)+'</span></a>'+sayBtn(txt);
}
function draw(){
  stopSpeak();
  var t=T();
  document.documentElement.lang=cur;
  document.documentElement.dir=t.dir;
  document.title=t.title+" | bekol.co.il";
  document.getElementById("ttl").innerHTML=esc(t.title)+sayBtn(t.title);
  document.getElementById("intro").innerHTML=esc(t.intro)+sayBtn(t.intro);
  var g=document.getElementById("guide");
  g.innerHTML='<h2>'+esc(t.guideH)+sayBtn(t.guideH)+'</h2>'+
    '<p>'+esc(t.guideLead)+sayBtn(t.guideLead)+'</p>'+
    '<ol class="steps">'+t.steps.map(function(s){
      return '<li>'+esc(s)+sayBtn(s)+'</li>';
    }).join("")+'</ol>'+
    '<a class="vchk" href="'+U.voice+'">'+esc(t.vchk)+'</a>'+sayBtn(t.vchk);
  var r=document.getElementById("rama");
  r.innerHTML='<h2>'+esc(t.ramaH)+sayBtn(t.ramaH)+'</h2>'+
    '<p>'+esc(t.ramaLead)+'</p>'+
    '<div class="lks">'+t.grades.map(lk).join("")+'</div>'+
    '<p class="note">'+esc(t.ramaNote)+sayBtn(t.ramaNote)+'</p>';
  var m=document.getElementById("moe");
  m.innerHTML='<h2>'+esc(t.moeH)+sayBtn(t.moeH)+'</h2>'+
    '<div class="lks">'+t.links.map(lk).join("")+'</div>';
  document.getElementById("credit").innerHTML=esc(t.credit)+sayBtn(t.credit);
  document.getElementById("meta").innerHTML=esc(t.mt)+'<br>'+
    '<a href="'+U.home+'">'+esc(t.back)+'</a> · <a href="'+U.legal+'">'+esc(t.terms)+'</a>';
  var lg=document.getElementById("langs");
  lg.innerHTML=[["he","עברית"],["ar","العربية"],["ru","Русский"],["en","English"]].map(function(x){
    return '<button type="button" data-l="'+x[0]+'" lang="'+x[0]+'" aria-pressed="'+(x[0]===cur)+'">'+x[1]+'</button>';
  }).join("");
}
document.addEventListener("click",function(e){
  var b=e.target.closest("button"); if(!b)return;
  if(b.dataset.l){cur=b.dataset.l;try{localStorage.setItem("bekol-teachers-lang",cur)}catch(_){} draw();return}
  if(b.classList.contains("say")){speak(b.dataset.say||"",b)}
});
if(window.speechSynthesis)speechSynthesis.getVoices();
try{
  var saved=localStorage.getItem("bekol-teachers-lang");
  if(saved&&S[saved])cur=saved;
  else{
    /* שפת הדפדפן קודם, כדי שמי שאינו קורא עברית לא ייתקל בעברית */
    var pref=(navigator.languages||[navigator.language||"he"]);
    for(var i=0;i<pref.length;i++){
      var c=String(pref[i]).toLowerCase().split("-")[0];
      if(c==="iw")c="he";
      if(S[c]){cur=c;break}
    }
  }
}catch(_){}
draw();
})();
</script>
