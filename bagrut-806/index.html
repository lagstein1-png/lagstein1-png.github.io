<title>בגרות 806 — מתמטיקה 5 יחידות</title>
<meta name="description" content="הכנה לבגרות במתמטיקה 5 יחידות, שאלון 806: סימולציה מתוזמנת ותרגול מודרך, וכל טקסט וכל נוסחה נשמעים לפני שקוראים אותם." />
<meta name="theme-color" content="#12213a" />
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">

<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
/* ============================================================
   בגרות 806 — כל ה-CSS של האפליקציה
   ------------------------------------------------------------
   קהל היעד מתקשה בקריאה, בריכוז או בעברית, ולכן:
   · טקסט גדול כברירת מחדל, וכל המידות ב-rem — הגדלת גופן
     בדפדפן מגדילה את הכול יחד ולא שוברת את הפריסה.
   · אזור נגיעה מינימלי 48px בכל דבר שלוחצים עליו.
   · אין גופן חיצוני. הדרישה היא אפס בקשות רשת בזמן ריצה, וגופן
     מ-Google Fonts הוא בדיוק בקשה כזאת — ובלעדיה הדף היה נטען
     בגופן ברירת מחדל אחרי הבהוב. גופן המערכת נכון יותר כאן.
   · ניגודיות: הצבעים נבדקו מול AA. מצב כהה לפי העדפת המערכת.
   ============================================================ */
:root{
  --font:system-ui,-apple-system,"Segoe UI","Noto Sans Hebrew",Arial,sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --bg:#f7f6f3; --surface:#ffffff; --surface2:#eceff4;
  --ink:#141a24; --muted:#4b5563; --line:#d9dee6;
  --accent:#1d4ed8; --accent-ink:#ffffff; --accent-soft:#e3ebfd;
  --ok:#15803d; --warn:#b45309; --warn-soft:#fef3c7; --bad:#be123c; --bad-soft:#ffe4e9;
  --shadow:0 1px 2px rgba(20,26,36,.06),0 10px 26px -14px rgba(20,26,36,.28);
  --r:14px;
  --hit:48px;              /* אזור נגיעה מינימלי */
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0e141f; --surface:#161e2c; --surface2:#1e2839;
    --ink:#eef2f8; --muted:#a8b3c4; --line:#2c3648;
    --accent:#93b4fd; --accent-ink:#0e141f; --accent-soft:#1b2a47;
    --ok:#4ade80; --warn:#fbbf24; --warn-soft:#33270f; --bad:#fb7185; --bad-soft:#33161f;
    --shadow:0 1px 2px rgba(0,0,0,.45),0 12px 30px -16px rgba(0,0,0,.75);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:500 1.125rem/1.7 var(--font);
}
.wrap{max-width:46rem;margin:0 auto;padding:1.25rem 1rem 3rem}
h1{font-size:clamp(1.6rem,6vw,2.2rem);line-height:1.25;margin:.2em 0 .3em}
h2{font-size:clamp(1.15rem,4.4vw,1.4rem);line-height:1.3;margin:0 0 .4em}
p{margin:.5em 0}
.lead{color:var(--muted);font-size:1.0625rem}
.sub{color:var(--muted);font-size:.95rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

header{background:var(--surface);border-bottom:1px solid var(--line)}
header .wrap{padding-block:.75rem;display:flex;align-items:center;gap:.6rem}
.mark{
  width:2.25rem;height:2.25rem;flex:0 0 auto;border-radius:11px;
  background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;font-weight:800;font-size:1rem;
}
header b{font-size:1.05rem}
header small{display:block;color:var(--muted);font-weight:500;font-size:.85rem;line-height:1.3}

.btn{
  font:inherit;font-weight:700;cursor:pointer;
  min-height:var(--hit);padding:.6rem 1.1rem;border-radius:12px;
  border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);
}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.danger{background:var(--surface);color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.back{margin-bottom:.75rem}
.btn.spk{min-width:var(--hit);padding:.5rem .7rem;font-size:1.15rem;margin-inline-start:auto}

.grid{display:grid;gap:.9rem;margin:1.25rem 0}
@media (min-width:34rem){.grid{grid-template-columns:1fr 1fr}}
.tile{
  display:flex;flex-direction:column;gap:.35rem;text-align:start;
  font:inherit;cursor:pointer;min-height:var(--hit);
  padding:1.1rem;border-radius:var(--r);border:1px solid var(--line);
  background:var(--surface);color:var(--ink);box-shadow:var(--shadow);
}
.tile:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.tile .tn{font-weight:800;font-size:1.2rem}
.tile .td{color:var(--muted);font-size:.95rem;font-weight:500;line-height:1.55}

.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:1.1rem;margin:1rem 0;box-shadow:var(--shadow);
}
.card.todo{border-inline-start:5px solid var(--warn);background:var(--warn-soft)}
.card.todo h2{font-size:1.05rem}
.row{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.4rem}
.chip{
  font-size:.85rem;font-weight:700;padding:.25rem .6rem;border-radius:999px;
  background:var(--accent-soft);color:var(--ink);
}
.chip.warn{background:var(--warn-soft);color:var(--ink)}
.pts{font-size:.9rem;color:var(--muted);font-weight:700}

.stages{margin:.5rem 0 0;padding-inline-start:1.3rem;line-height:1.9}
.stages li{color:var(--muted)}
.stages li.done{color:var(--ink);font-weight:700}
.stages li.done::marker{color:var(--ok)}

.subs{list-style:none;margin:1rem 0 0;padding:0}
.sub-q{border-top:1px solid var(--line);padding-top:.9rem;margin-top:.9rem}

/* נוסחה. `.raw` היא המצב שבו KaTeX עוד לא הותקן — מסומן במפורש
   כדי שלא ייראה כמו נוסחה מעובדת. */
.tex{display:block;margin:.7rem 0;padding:.7rem .9rem;border-radius:10px;background:var(--surface2);overflow-x:auto}
.tex code{font-family:var(--mono);font-size:1rem;direction:ltr;display:block;text-align:left}
.tex em{display:block;margin-top:.4rem;font-size:.82rem;color:var(--muted);font-style:normal}

/* ---------- הקראה ----------
   הבלוק המוקרא מסומן בשוליים, והמשפט שנקרא כרגע מודגש. ההדגשה
   היא רקע ולא צבע טקסט: מי שקורא לאט מאבד את המקום, וקו הרקע
   מחזיר אותו — בלי לפגוע בניגותיות של האותיות עצמן. */
.say{position:relative;padding-inline-end:3.6rem}
.say .spk{position:absolute;inset-block-start:0;inset-inline-end:0}
.say.reading{
  border-inline-start:4px solid var(--accent);
  padding-inline-start:.7rem;border-radius:6px;
}
.sn{border-radius:5px;padding:1px 0}
/* גם הנוסחה מודגשת כשקוראים את שדה ה-speech שלה. בלי זה ההדגשה
   "נעלמת" בדיוק ברגע שבו הקול אומר את הנוסחה, והמשתמש מאבד
   את המקום במקום שבו הוא הכי צריך אותו. */
.sn.now,.tex.now{background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent-soft)}
.spk.live{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.rate{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;margin:.6rem 0 1rem}
.rate .btn{min-height:var(--hit);padding:.5rem .9rem;font-size:1rem}
.rate .btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.warn-line{background:var(--warn-soft);border-inline-start:4px solid var(--warn);
  padding:.6rem .8rem;border-radius:8px;margin:.6rem 0 1rem}
.bad-line{background:var(--bad-soft);border-inline-start:4px solid var(--bad);
  padding:.6rem .8rem;border-radius:8px;margin:.4rem 0 1rem}

/* ניגודיות מוגברת: רקע ההדגשה לבדו חלש שם, ולכן גם מסגרת. */
@media (prefers-contrast:more){
  .sn.now,.tex.now{outline:2px solid var(--accent);outline-offset:1px}
}

/* ---------- תיבת התשובה ---------- */
.answer{margin-top:1rem}
.answer label{display:block;font-weight:700;margin-bottom:.2rem}
.field{
  font:inherit;flex:1 1 10rem;min-width:0;min-height:var(--hit);
  padding:.6rem .8rem;border-radius:12px;border:2px solid var(--line);
  background:var(--surface);color:var(--ink);
}
.field:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-color:var(--accent)}
.msg{min-height:1.6em;margin:.5rem 0 0;font-weight:700}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
.ask{font-weight:700;font-size:1.15rem}
.ask-block{background:var(--surface2);border-radius:10px;padding:.8rem .9rem;margin-top:.9rem}

/* ---------- רמזים ופתרון ----------
   רמז ופתרון נראים שונה בכוונה. רמז הוא שאלה שמכוונת, ופתרון הוא
   התשובה — ומי שמחפש רמז לא אמור למצוא פתרון בטעות. */
.hints{margin-top:1.1rem}
.hint-block{background:var(--warn-soft);border-inline-start:4px solid var(--warn);
  border-radius:10px;padding:.75rem .9rem;margin-bottom:.6rem}
.hint b{display:block;font-size:.85rem;color:var(--muted);margin-bottom:.15rem}
.solution{margin-top:1rem;border-top:2px dashed var(--line);padding-top:.9rem}
.solution h3{font-size:1.05rem;margin:0 0 .6rem}
.step-block{background:var(--accent-soft);border-radius:10px;padding:.7rem .9rem;margin-bottom:.55rem}
.step-block b{display:block;font-size:.85rem;color:var(--muted);margin-bottom:.15rem}
.final{margin-top:.8rem;padding:.7rem .9rem;border-radius:10px;
  background:var(--surface2);font-size:1.1rem}
.btn.w{width:100%;margin-top:.5rem}
.btn.big{padding:.9rem;font-size:1.15rem;margin-top:1.2rem}
.nav-row{margin-top:1.2rem;gap:.6rem}

/* ---------- סימולציה ---------- */
.simbar{
  position:sticky;inset-block-start:0;z-index:5;
  display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:.6rem .8rem;margin-bottom:1rem;box-shadow:var(--shadow);
}
#clock{font-variant-numeric:tabular-nums;font-size:1.25rem;font-weight:800;
  background:var(--accent-soft);padding:.35rem .8rem}
#clock.low{background:var(--bad-soft);color:var(--bad)}
.score{display:flex;align-items:center;gap:.8rem;margin:1rem 0}
.big-num{font-size:3rem;font-weight:800;line-height:1}
.big-num.ok{color:var(--ok)} .big-num.warn{color:var(--warn)} .big-num.bad{color:var(--bad)}
.hist{display:flex;align-items:center;gap:.6rem;padding:.6rem 0;border-top:1px solid var(--line)}
.hist:first-of-type{border-top:0}
.hist.wide{width:100%;text-align:start;font:inherit;background:none;border:0;
  border-top:1px solid var(--line);cursor:pointer;min-height:var(--hit);color:inherit}
.hist.wide:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hist .tt{flex:1;min-width:0;display:flex;flex-direction:column}
.hist .tt span{color:var(--muted);font-size:.9rem;font-weight:500}
.chip.ok{background:#dcfce7;color:#14532d}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
@media (prefers-color-scheme:dark){.chip.ok{background:#123c24;color:#86efac}}
.bar{display:block;height:6px;width:5rem;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}

.schema-errs{
  background:var(--bad-soft);color:var(--ink);border-bottom:3px solid var(--bad);
  padding:1rem;font-size:.95rem;
}
.schema-errs ul{margin:.4rem 0 0;padding-inline-start:1.2rem}

footer{border-top:1px solid var(--line);margin-top:2rem}
footer .wrap{padding-block:1rem;color:var(--muted);font-size:.85rem;display:flex;
  gap:.5rem;flex-wrap:wrap;justify-content:space-between}
footer a{color:inherit}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
