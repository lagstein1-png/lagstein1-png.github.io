     en:"The Ottoman empire broke up after the war, and the victors divided its territories among themselves as temporary trusteeships."},
    {he:"ההבטחה לבית לאומי קיבלה מעמד בינלאומי מחייב, ובאותה שנה הופרד עבר הירדן משטח המנדט.",
     ar:"نال وعد البيت القومي مكانة دولية ملزمة، وفي السنة ذاتها فُصل شرق الأردن عن أرض الانتداب.",
     ru:"Обещание национального очага получило обязывающий международный статус, и в том же году Заиорданье было отделено от подмандатной территории.",
     en:"The promise of a national home gained binding international standing, and in the same year Transjordan was separated from the mandate territory."}),
  C({he:"ציונות",ar:"الصهيونية",ru:"Сионизм",en:"Zionism"},
    {he:"התנועה הלאומית היהודית, שחתרה להקים לעם היהודי בית לאומי מוכר בארץ ישראל.",
     ar:"الحركة القومية اليهودية، التي سعت إلى إقامة بيت قومي معترف به للشعب اليهودي في أرض إسرائيل.",
     ru:"Еврейское национальное движение, стремившееся создать признанный национальный очаг для еврейского народа в Земле Израиля.",
     en:"The Jewish national movement, which worked to establish a recognised national home for the Jewish people in the Land of Israel."}),
  C({he:"תחיית הלשון העברית",ar:"إحياء اللغة العبرية",ru:"Возрождение языка иврит",en:"The revival of the Hebrew language"},
    {he:"הפיכת העברית משפת תפילה וספר לשפת דיבור יומיומית, עם מילים חדשות לחפצים שלא היו בה קודם.",
     ar:"تحويل العبرية من لغة صلاة وكتاب إلى لغة حديث يومي، بكلمات جديدة لأشياء لم تكن فيها من قبل.",
     ru:"Превращение иврита из языка молитвы и книги в язык повседневной речи, с новыми словами для вещей, которых в нём прежде не было.",
     en:"The turning of Hebrew from a language of prayer and books into a language of daily speech, with new words for things it had not named before."}),
  Sc({he:["הציונות שואפת להקים לעם היהודי בית מולדת בארץ ישראל, מובטח לפי משפט העמים.",
          "לשם השגת מטרה זו רואה הקונגרס לפניו את האמצעים האלה:",
          "יישוב שיטתי של הארץ באיכרים, בפועלים ובבעלי מלאכה יהודים;",
          "חיזוק ההרגשה הלאומית היהודית והכרת העם את עצמו.",
          "מתוך תוכנית באזל, הקונגרס הציוני הראשון, 1897."],
      ar:["تسعى الصهيونية إلى إقامة وطن للشعب اليهودي في أرض إسرائيل، مضمون بموجب القانون العامّ.",
          "ولبلوغ هذه الغاية يرى المؤتمر أمامه هذه الوسائل:",
          "استيطان منهجي للبلاد بفلّاحين وعمّال وحرفيّين يهود؛",
          "وتقوية الشعور القومي اليهودي ووعي الشعب بذاته.",
          "من برنامج بازل، المؤتمر الصهيوني الأوّل، 1897."],
      ru:["Сионизм стремится создать для еврейского народа родину в Земле Израиля, обеспеченную публичным правом.",
          "Для достижения этой цели конгресс видит перед собой следующие средства:",
          "планомерное заселение страны еврейскими земледельцами, рабочими и ремесленниками;",
          "укрепление еврейского национального чувства и самосознания народа.",
          "Из Базельской программы, Первый сионистский конгресс, 1897."],
      en:["Zionism seeks to establish for the Jewish people a home in the Land of Israel, secured under public law.",
          "To attain this end the Congress sets before itself the following means:",
          "the systematic settlement of the country with Jewish farmers, labourers and craftsmen;",
          "the strengthening of Jewish national feeling and of the people's awareness of itself.",
          "From the Basel Programme, the First Zionist Congress, 1897."]},
     [Q({he:"מה מבקשת התוכנית להשיג מעבר להתיישבות בפועל?",ar:"ما الذي يسعى إليه البرنامج إلى جانب الاستيطان الفعلي؟",ru:"Чего программа хочет добиться помимо самого заселения?",en:"What does the programme seek beyond actual settlement?"},
        {he:"הכרה משפטית בינלאומית בבית הלאומי, ולא רק עובדות בשטח.",ar:"اعترافًا قانونيًّا دوليًّا بالبيت القومي، لا وقائع على الأرض فحسب.",ru:"Международного правового признания национального очага, а не только фактов на земле.",en:"International legal recognition of the national home, and not facts on the ground alone."},
        [{he:"הקמת צבא יהודי שיילחם בשלטון העות׳מאני.",ar:"إقامة جيش يهودي يقاتل الحكم العثماني.",ru:"Создания еврейского войска для борьбы с османской властью.",en:"The founding of a Jewish army to fight the Ottoman government."},
         {he:"פתיחת בתי ספר יהודיים בכל מדינות אירופה.",ar:"فتح مدارس يهودية في كلّ دول أوروبا.",ru:"Открытия еврейских школ во всех странах Европы.",en:"The opening of Jewish schools in every country in Europe."},
         {he:"קבלת סיוע כספי מן הממשלות שבהן חיו היהודים.",ar:"نيل دعم مالي من الحكومات التي عاش فيها اليهود.",ru:"Денежной поддержки от правительств стран, где жили евреи.",en:"Financial aid from the governments of the countries where the Jews lived."}]),
      Q({he:"למי מיועד היישוב לפי התוכנית?",ar:"لمن يُوجَّه الاستيطان بحسب البرنامج؟",ru:"Кому предназначено заселение по программе?",en:"Who is the settlement meant for, according to the programme?"},
        {he:"לאיכרים, לפועלים ולבעלי מלאכה — כלומר לעובדי כפיים ולא רק לסוחרים או למשקיעים.",ar:"للفلّاحين والعمّال والحرفيّين — أي لأصحاب العمل اليدوي لا للتجّار والمستثمرين فقط.",ru:"Земледельцам, рабочим и ремесленникам — то есть людям физического труда, а не только торговцам и вкладчикам.",en:"To farmers, labourers and craftsmen — that is, to people who work with their hands, not only merchants or investors."},
        [{he:"לרבנים ולתלמידי ישיבות בלבד.",ar:"للحاخامات وطلبة المدارس الدينية فقط.",ru:"Только раввинам и учащимся религиозных школ.",en:"To rabbis and yeshiva students only."},
         {he:"למשפחות עשירות שיוכלו לרכוש קרקע בעצמן.",ar:"للعائلات الغنية القادرة على شراء الأرض بنفسها.",ru:"Богатым семьям, способным самим купить землю.",en:"To wealthy families able to buy land on their own."},
         {he:"לחיילים משוחררים מצבאות אירופה.",ar:"للجنود المسرّحين من جيوش أوروبا.",ru:"Отставным солдатам европейских армий.",en:"To soldiers discharged from the armies of Europe."}])])
]);

more("ww1",1,[
  E(1882,
    {he:"כריתת הברית המשולשת",ar:"عقد التحالف الثلاثي",ru:"Заключение Тройственного союза",en:"The making of the Triple Alliance"},
    {he:"גרמניה, אוסטריה-הונגריה ואיטליה חתמו על ברית הגנה, ומולה התגבשה עם השנים ברית של צרפת, רוסיה ובריטניה.",
     ar:"وقّعت ألمانيا والنمسا-المجر وإيطاليا حلف دفاع، وتشكّل مقابله مع السنين حلف بين فرنسا وروسيا وبريطانيا.",
     ru:"Германия, Австро-Венгрия и Италия подписали оборонительный союз, а против него с годами сложился союз Франции, России и Британии.",
     en:"Germany, Austria-Hungary and Italy signed a defensive alliance, and against it there formed over the years an alliance of France, Russia and Britain."},
    {he:"גרמניה המאוחדת חששה ממלחמה בשתי חזיתות, וביקשה לבודד את צרפת שלא השלימה עם תבוסתה.",
     ar:"خشيت ألمانيا الموحّدة من حرب على جبهتين، وسعت إلى عزل فرنسا التي لم تتقبّل هزيمتها.",
     ru:"Объединённая Германия боялась войны на два фронта и стремилась изолировать Францию, не смирившуюся с поражением.",
     en:"A united Germany feared a war on two fronts and sought to isolate France, which had not accepted its defeat."},
    {he:"אירופה נחלקה לשני מחנות קשורים בהתחייבויות, וסכסוך מקומי היה עלול לגרור את כולם למלחמה.",
     ar:"انقسمت أوروبا إلى معسكرين مرتبطين بالتزامات، وصار نزاع محلّي قادرًا على جرّ الجميع إلى الحرب.",
     ru:"Европа разделилась на два лагеря, связанных обязательствами, и местный спор мог втянуть в войну всех.",
     en:"Europe divided into two camps bound by commitments, and a local quarrel could drag them all into war."}),
  E(1915,
    {he:"הגז הרעיל באיפר",ar:"الغاز السامّ في إيبر",ru:"Отравляющий газ под Ипром",en:"Poison gas at Ypres"},
    {he:"הצבא הגרמני שחרר ענן כלור על החפירות הצרפתיות, וזו הפעם הראשונה שנשק כימי שימש בקנה מידה גדול.",
     ar:"أطلق الجيش الألماني سحابة كلور على خنادق الفرنسيين، وكانت أوّل مرّة يُستخدم فيها سلاح كيميائي على نطاق واسع.",
     ru:"Германская армия выпустила облако хлора на французские окопы — впервые химическое оружие применили в большом масштабе.",
     en:"The German army released a cloud of chlorine over the French trenches, the first time a chemical weapon was used on a large scale."},
    {he:"החזית קפאה בקו חפירות שאיש לא הצליח לפרוץ, וכל צד חיפש נשק שיכריע את הקיפאון.",
     ar:"تجمّدت الجبهة على خطّ خنادق لم يفلح أحد في اختراقه، وبحث كلّ طرف عن سلاح يحسم الجمود.",
     ru:"Фронт застыл на линии окопов, которую никто не мог прорвать, и каждая сторона искала оружие, способное сломать тупик.",
     en:"The front had frozen into a line of trenches that neither side could break, and each looked for a weapon to end the deadlock."},
    {he:"המלחמה נעשתה אכזרית עוד יותר בלי שהחזית זזה, ואחריה נאסר השימוש בנשק כימי באמנה בינלאומית.",
     ar:"صارت الحرب أشدّ قسوة دون أن تتحرّك الجبهة، وحُظر بعدها استخدام السلاح الكيميائي باتّفاقية دولية.",
     ru:"Война стала ещё более жестокой, а фронт не сдвинулся, и после неё международный договор запретил химическое оружие.",
     en:"The war grew crueller still without the front moving, and after it an international convention banned chemical weapons."}),
  E(1917,
    {he:"ארצות הברית נכנסת למלחמה",ar:"الولايات المتّحدة تدخل الحرب",ru:"США вступают в войну",en:"The United States enters the war"},
    {he:"אמריקה הכריזה מלחמה על גרמניה ושלחה לאירופה מאות אלפי חיילים רעננים ואספקה בלתי נדלית.",
     ar:"أعلنت أمريكا الحرب على ألمانيا وأرسلت إلى أوروبا مئات آلاف الجنود الجدد وإمدادًا لا ينضب.",
     ru:"Америка объявила войну Германии и послала в Европу сотни тысяч свежих солдат и неиссякаемое снабжение.",
     en:"America declared war on Germany and sent to Europe hundreds of thousands of fresh soldiers and unending supply."},
    {he:"צוללות גרמניות הטביעו ספינות אמריקאיות, ומברק גרמני הציע למקסיקו ברית נגד ארצות הברית.",
     ar:"أغرقت الغوّاصات الألمانية سفنًا أمريكية، وعرضت برقية ألمانية على المكسيك حلفًا ضدّ الولايات المتّحدة.",
     ru:"Германские подлодки топили американские суда, а германская телеграмма предложила Мексике союз против США.",
     en:"German submarines sank American ships, and a German telegram offered Mexico an alliance against the United States."},
    {he:"מאזן הכוחות הוכרע לטובת בעלות הברית, ואמריקה יצאה מבידודה ונעשתה שחקנית מרכזית בעולם.",
     ar:"حُسم ميزان القوى لصالح الحلفاء، وخرجت أمريكا من عزلتها وصارت لاعبًا مركزيًّا في العالم.",
     ru:"Соотношение сил склонилось в пользу Антанты, а Америка вышла из изоляции и стала главным игроком в мире.",
     en:"The balance of forces tipped to the Allies, and America came out of its isolation and became a leading power in the world."}),
  C({he:"מלחמה כוללת",ar:"الحرب الشاملة",ru:"Тотальная война",en:"Total war"},
    {he:"מלחמה שבה כל משאבי המדינה ואוכלוסייתה מגויסים למאמץ, והגבול בין חזית לעורף כמעט נמחק.",
     ar:"حرب تُجنَّد فيها كلّ موارد الدولة وسكانها للمجهود، ويكاد يُمحى الحدّ بين الجبهة والداخل.",
     ru:"Война, в которой все средства государства и всё его население поставлены на службу усилию, а грань между фронтом и тылом почти стирается.",
     en:"A war in which all the state's resources and its whole population are harnessed to the effort, and the line between front and home almost disappears."})
]);
more("ww1",2,[
  E(1915,
    {he:"רצח העם הארמני",ar:"الإبادة الأرمنية",ru:"Геноцид армян",en:"The Armenian genocide"},
    {he:"השלטון העות׳מאני גירש את הארמנים מבתיהם לצעדות מוות במדבר, ומאות אלפים מהם נספו.",
     ar:"طرد الحكم العثماني الأرمن من بيوتهم إلى مسيرات موت في الصحراء، فهلك مئات الآلاف منهم.",
     ru:"Османская власть изгнала армян из домов на смертные переходы в пустыню, и сотни тысяч из них погибли.",
     en:"The Ottoman government drove the Armenians from their homes on death marches into the desert, and hundreds of thousands of them perished."},
    {he:"השלטון חשד שהארמנים הנוצרים תומכים ברוסיה האויבת, והמלחמה סיפקה כיסוי לפעולה נגד אוכלוסייה שלמה.",
     ar:"اشتبهت السلطة بأن الأرمن المسيحيين يساندون روسيا العدوّة، ووفّرت الحرب غطاءً لعمل ضدّ سكان بأكملهم.",
     ru:"Власть подозревала, что армяне-христиане поддерживают враждебную Россию, и война дала прикрытие для действий против целого населения.",
     en:"The government suspected that the Christian Armenians favoured the enemy Russia, and the war gave cover for action against an entire population."},
    {he:"זו הפעם הראשונה שמדינה מודרנית השמידה בשיטתיות אוכלוסייה משלה, ומכאן צמח מאוחר יותר המושג רצח עם.",
     ar:"هذه أوّل مرّة تُبيد فيها دولة حديثة بشكل منهجي سكانًا من رعاياها، ومن هنا نشأ لاحقًا مفهوم الإبادة الجماعية.",
     ru:"Впервые современное государство систематически уничтожало собственное население, и отсюда позже выросло понятие геноцида.",
     en:"It was the first time a modern state systematically destroyed a population of its own, and from it the concept of genocide later grew."}),
  E(1916,
    {he:"הסכם סייקס-פיקו",ar:"اتفاقية سايكس-بيكو",ru:"Соглашение Сайкса — Пико",en:"The Sykes-Picot agreement"},
    {he:"בריטניה וצרפת חילקו ביניהן בסתר את שטחי האימפריה העות׳מאנית במזרח התיכון, עוד לפני שנוצחה.",
     ar:"اقتسمت بريطانيا وفرنسا سرًّا أراضي الإمبراطورية العثمانية في الشرق الأوسط، قبل أن تُهزم أصلًا.",
     ru:"Британия и Франция тайно поделили между собой земли Османской империи на Ближнем Востоке ещё до её поражения.",
     en:"Britain and France secretly divided between them the Ottoman territories of the Middle East, before it had even been defeated."},
    {he:"שתי המעצמות רצו להבטיח מראש את חלקן בשלל, ובד בבד הבטיחו לערבים עצמאות תמורת מרד בעות׳מאנים.",
     ar:"أرادت القوّتان ضمان حصّتهما من الغنيمة مسبقًا، ووعدتا في الوقت نفسه العرب بالاستقلال مقابل ثورة على العثمانيين.",
     ru:"Обе державы хотели заранее закрепить свою долю добычи, а одновременно обещали арабам независимость в обмен на восстание против османов.",
     en:"Both powers wanted their share of the spoils settled in advance, while at the same time promising the Arabs independence in return for a revolt against the Ottomans."},
    {he:"גבולות המזרח התיכון נקבעו בקווים שרטטו זרים, ולא לפי שבטים, עדות או שפות — וזה מקור סכסוכים עד היום.",
     ar:"رُسمت حدود الشرق الأوسط بخطوط خطّها أجانب، لا وفق قبائل أو طوائف أو لغات — وهذا مصدر نزاعات حتى اليوم.",
     ru:"Границы Ближнего Востока провели чужие руки, не по племенам, общинам или языкам, — и это источник конфликтов до сего дня.",
     en:"The borders of the Middle East were drawn in lines by outsiders, not by tribe, community or language — and this is a source of conflict to this day."}),
  E(1923,
    {he:"האינפלציה הגדולה בגרמניה",ar:"التضخّم الكبير في ألمانيا",ru:"Гиперинфляция в Германии",en:"The great inflation in Germany"},
    {he:"המחירים בגרמניה הוכפלו מדי יום, וכיכר לחם עלתה מיליארדי מארק — חסכונות של חיים נמחקו בשבועות.",
     ar:"تضاعفت الأسعار في ألمانيا يوميًّا، وبلغ ثمن رغيف مليارات الماركات — ومُحيت مدّخرات العمر في أسابيع.",
     ru:"Цены в Германии удваивались каждый день, и буханка хлеба стоила миллиарды марок — сбережения целой жизни исчезали за недели.",
     en:"Prices in Germany doubled by the day, and a loaf of bread cost billions of marks — the savings of a lifetime were wiped out in weeks."},
    {he:"גרמניה הדפיסה כסף כדי לשלם את פיצויי המלחמה, וצרפת כבשה את אזור התעשייה שלה כשהתשלום התעכב.",
     ar:"طبعت ألمانيا النقود لدفع تعويضات الحرب، واحتلّت فرنسا منطقتها الصناعية حين تأخّر الدفع.",
     ru:"Германия печатала деньги, чтобы платить репарации, а Франция заняла её промышленный район, когда платежи задержались.",
     en:"Germany printed money to pay the war reparations, and France occupied its industrial region when payment fell behind."},
    {he:"מעמד הביניים הגרמני ירד מנכסיו ואיבד את אמונו בדמוקרטיה, וזה הקרקע שממנה צמחו מפלגות הקצה.",
     ar:"أفلست الطبقة الوسطى الألمانية وفقدت ثقتها بالديمقراطية، وهذه التربة التي نمت منها أحزاب التطرّف.",
     ru:"Немецкий средний класс разорился и потерял доверие к демократии — это и была почва, на которой выросли крайние партии.",
     en:"The German middle class was ruined and lost its trust in democracy, and this was the ground from which the extreme parties grew."}),
  C({he:"רפובליקת ויימאר",ar:"جمهورية فايمار",ru:"Веймарская республика",en:"The Weimar Republic"},
    {he:"המשטר הדמוקרטי בגרמניה שבין שתי מלחמות העולם, שנשא באחריות לתבוסה ולפיצויים ולכן היה שנוא על רבים.",
     ar:"النظام الديمقراطي في ألمانيا بين الحربين العالميتين، الذي حمل مسؤولية الهزيمة والتعويضات فكرهه كثيرون.",
     ru:"Демократический строй в Германии между двумя мировыми войнами, на который легла ответственность за поражение и репарации и потому многим ненавистный.",
     en:"The democratic government of Germany between the two world wars, which carried the blame for the defeat and the reparations and was therefore hated by many."})
]);
more("ww1",3,[
  E(1925,
    {he:"הסכמי לוקרנו",ar:"معاهدات لوكارنو",ru:"Локарнские договоры",en:"The Locarno treaties"},
    {he:"גרמניה, צרפת ובלגיה הכירו הדדית בגבולותיהן במערב והתחייבו לא לתקוף זו את זו.",
     ar:"اعترفت ألمانيا وفرنسا وبلجيكا متبادلًا بحدودها في الغرب، والتزمت بألّا يهاجم بعضها بعضًا.",
     ru:"Германия, Франция и Бельгия взаимно признали свои западные границы и обязались не нападать друг на друга.",
     en:"Germany, France and Belgium mutually recognised their western borders and undertook not to attack one another."},
    {he:"אירופה התעייפה מן העוינות שאחרי ורסאי, וגרמניה ביקשה לשוב ולהתקבל כמדינה שווה בין המדינות.",
     ar:"سئمت أوروبا العداء الذي أعقب فرساي، وأرادت ألمانيا العودة لتُقبل دولةً متساوية بين الدول.",
     ru:"Европа устала от вражды после Версаля, а Германия хотела вновь быть принятой как равное государство среди государств.",
     en:"Europe had grown weary of the hostility that followed Versailles, and Germany wanted to be accepted again as an equal among states."},
    {he:"גרמניה התקבלה לחבר הלאומים ונדמה שהשלום התייצב, אך גבולותיה במזרח לא הובטחו — ושם פרצה המלחמה הבאה.",
     ar:"قُبلت ألمانيا في عصبة الأمم وبدا أن السلام استقرّ، لكن حدودها في الشرق لم تُضمن — وهناك اندلعت الحرب التالية.",
     ru:"Германию приняли в Лигу Наций и казалось, что мир упрочился, но её восточные границы гарантированы не были — там и вспыхнула следующая война.",
     en:"Germany was admitted to the League of Nations and the peace seemed settled, but its eastern borders were not guaranteed — and there the next war broke out."}),
  C({he:"אינפלציה",ar:"التضخّم",ru:"Инфляция",en:"Inflation"},
    {he:"עלייה מתמשכת במחירים שבה אותו סכום כסף קונה פחות ופחות, עד שהחיסכון מאבד את ערכו.",
     ar:"ارتفاع متواصل في الأسعار يشتري فيه المبلغ ذاته أقلّ فأقلّ، حتى يفقد الادّخار قيمته.",
     ru:"Непрерывный рост цен, при котором та же сумма покупает всё меньше, пока сбережения не теряют ценность.",
     en:"A continuing rise in prices in which the same sum of money buys less and less, until savings lose their worth."}),
  C({he:"ביטחון קולקטיבי",ar:"الأمن الجماعي",ru:"Коллективная безопасность",en:"Collective security"},
    {he:"הרעיון שתקיפה על מדינה אחת תיתפס כתקיפה על כולן, וכל החברות יפעלו יחד נגד התוקף.",
     ar:"الفكرة القاضية بأن الاعتداء على دولة واحدة يُعدّ اعتداءً على الجميع، وتعمل كلّ الأعضاء معًا ضدّ المعتدي.",
     ru:"Мысль, что нападение на одно государство считается нападением на все, и все участники действуют сообща против нападающего.",
     en:"The idea that an attack on one state counts as an attack on all, and that every member acts together against the aggressor."}),
  Sc({he:["הממשלות בעלות הברית מצהירות, וגרמניה מקבלת,",
          "על אחריותה של גרמניה ושל בעלות בריתה",
          "לכל האובדן והנזק שנגרמו לממשלות בעלות הברית ולאזרחיהן",
          "כתוצאה מן המלחמה שנכפתה עליהן בתוקפנותן של גרמניה ובעלות בריתה.",
          "סעיף 231 בחוזה ורסאי, 1919."],
      ar:["تعلن الحكومات الحليفة، وتقبل ألمانيا،",
          "مسؤولية ألمانيا وحلفائها",
          "عن كلّ الخسارة والضرر اللذين لحقا بالحكومات الحليفة ومواطنيها",
          "نتيجة الحرب التي فُرضت عليها بعدوان ألمانيا وحلفائها.",
          "المادة ٢٣١ من معاهدة فرساي، 1919."],
      ru:["Союзные правительства заявляют, а Германия признаёт,",
          "ответственность Германии и её союзников",
          "за все потери и убытки, понесённые союзными правительствами и их гражданами",
          "вследствие войны, навязанной им агрессией Германии и её союзников.",
          "Статья 231 Версальского договора, 1919 год."],
      en:["The Allied governments affirm, and Germany accepts,",
          "the responsibility of Germany and her allies",
          "for all the loss and damage caused to the Allied governments and their nationals",
          "as a consequence of the war imposed upon them by the aggression of Germany and her allies.",
          "Article 231 of the Treaty of Versailles, 1919."]},
     [Q({he:"מה קובע הסעיף מעבר לחיוב בתשלום?",ar:"ماذا يقرّر البند إلى جانب إلزام الدفع؟",ru:"Что устанавливает статья помимо обязанности платить?",en:"What does the article establish beyond the duty to pay?"},
        {he:"שגרמניה אשמה בפרוץ המלחמה — הכרה באשמה ולא רק בחוב.",ar:"أن ألمانيا مذنبة باندلاع الحرب — اعتراف بالذنب لا بالدَّين فقط.",ru:"Что Германия виновна в развязывании войны — признание вины, а не только долга.",en:"That Germany was guilty of starting the war — an admission of guilt and not merely of debt."},
        [{he:"שגרמניה מוותרת על כל מושבותיה מעבר לים.",ar:"أن ألمانيا تتنازل عن كلّ مستعمراتها وراء البحار.",ru:"Что Германия отказывается от всех своих заморских колоний.",en:"That Germany gives up all its overseas colonies."},
         {he:"שגרמניה מתחייבת לצמצם את צבאה למאה אלף חיילים.",ar:"أن ألمانيا تلتزم بتقليص جيشها إلى مئة ألف جندي.",ru:"Что Германия обязуется сократить армию до ста тысяч солдат.",en:"That Germany undertakes to reduce its army to a hundred thousand men."},
         {he:"שגרמניה תתקבל מיד לחבר הלאומים כחברה שווה.",ar:"أن ألمانيا ستُقبل فورًا في عصبة الأمم عضوًا متساويًا.",ru:"Что Германия немедленно будет принята в Лигу Наций как равный член.",en:"That Germany will at once be admitted to the League of Nations as an equal member."}]),
      Q({he:"מדוע היה הסעיף הזה שנוא כל כך בגרמניה?",ar:"لماذا كان هذا البند مكروهًا إلى هذا الحدّ في ألمانيا؟",ru:"Почему эта статья была так ненавистна в Германии?",en:"Why was this article so hated in Germany?"},
        {he:"מפני שהטיל את מלוא האשמה על גרמניה לבדה, והפך את התשלום לעונש מוסרי ולא רק כספי.",ar:"لأنه ألقى الذنب كلّه على ألمانيا وحدها، وحوّل الدفع إلى عقاب أخلاقي لا مالي فحسب.",ru:"Потому что она возлагала всю вину на одну Германию и обращала платёж в нравственную кару, а не только в денежную.",en:"Because it placed the whole blame on Germany alone, and turned the payment into a moral punishment and not only a financial one."},
        [{he:"מפני שחייב את גרמניה למסור את צי הסוחר שלה.",ar:"لأنه ألزم ألمانيا بتسليم أسطولها التجاري.",ru:"Потому что она обязывала Германию отдать торговый флот.",en:"Because it required Germany to hand over its merchant fleet."},
         {he:"מפני שאסר על גרמניה לקיים בחירות דמוקרטיות.",ar:"لأنه منع ألمانيا من إجراء انتخابات ديمقراطية.",ru:"Потому что она запрещала Германии проводить демократические выборы.",en:"Because it forbade Germany to hold democratic elections."},
         {he:"מפני שהעביר את בירת גרמניה מברלין לוויימאר.",ar:"لأنه نقل عاصمة ألمانيا من برلين إلى فايمار.",ru:"Потому что она переносила столицу Германии из Берлина в Веймар.",en:"Because it moved Germany's capital from Berlin to Weimar."}])])
]);

more("ww2",1,[
  E(1936,
    {he:"כניסת הצבא הגרמני לחבל הריין",ar:"دخول الجيش الألماني إلى الراينلاند",ru:"Ввод германских войск в Рейнскую область",en:"The German army enters the Rhineland"},
    {he:"היטלר שלח חיילים לאזור שחוזה ורסאי אסר להחזיק בו צבא, ובריטניה וצרפת לא הגיבו.",
     ar:"أرسل هتلر جنودًا إلى منطقة حظرت معاهدة فرساي وجود جيش فيها، ولم تردّ بريطانيا وفرنسا.",
     ru:"Гитлер послал войска в область, где Версальский договор запрещал держать армию, а Британия и Франция не откликнулись.",
     en:"Hitler sent troops into an area where the Treaty of Versailles forbade any army, and Britain and France did not respond."},
    {he:"היטלר הימר שהמעצמות לא ילחמו על סעיף בחוזה, וצבאו היה קטן מכדי לעמוד בעימות אילו הגיבו.",
     ar:"راهن هتلر على أن القوى لن تحارب من أجل بند في معاهدة، وكان جيشه أصغر من أن يصمد لو ردّت.",
     ru:"Гитлер сделал ставку на то, что державы не станут воевать из-за пункта договора, а его армия была слишком мала, чтобы выдержать столкновение.",
     en:"Hitler gambled that the powers would not fight over a clause in a treaty, and his army was too small to withstand a confrontation had they acted."},
    {he:"היטלר למד שאפשר להפר הסכמים בלי לשלם מחיר, וכל צעד שבא אחר כך היה נועז מקודמו.",
     ar:"تعلّم هتلر أن بالإمكان خرق الاتفاقات دون ثمن، وكانت كلّ خطوة تالية أجرأ ممّا سبقها.",
     ru:"Гитлер усвоил, что соглашения можно нарушать безнаказанно, и каждый следующий шаг был смелее предыдущего.",
     en:"Hitler learned that agreements could be broken without cost, and every step that followed was bolder than the one before."}),
  E(1938,
    {he:"ליל הבדולח",ar:"ليلة الكريستال",ru:"Хрустальная ночь",en:"Kristallnacht"},
    {he:"בלילה אחד נשרפו מאות בתי כנסת בגרמניה, נופצו חלונות של אלפי חנויות יהודיות ונעצרו עשרות אלפי גברים.",
     ar:"في ليلة واحدة أُحرقت مئات الكنس في ألمانيا، وحُطّمت واجهات آلاف المتاجر اليهودية، واعتُقل عشرات آلاف الرجال.",
     ru:"За одну ночь в Германии сожгли сотни синагог, разбили витрины тысяч еврейских лавок и арестовали десятки тысяч мужчин.",
     en:"In a single night hundreds of synagogues in Germany were burned, the windows of thousands of Jewish shops were smashed and tens of thousands of men were arrested."},
    {he:"רצח דיפלומט גרמני בפריז שימש עילה לפרעות שאורגנו מלמעלה והוצגו כזעם ספונטני של העם.",
     ar:"استُخدم اغتيال دبلوماسي ألماني في باريس ذريعةً لمذابح نُظّمت من فوق وقُدّمت كغضب شعبي عفوي.",
     ru:"Убийство немецкого дипломата в Париже послужило предлогом для погромов, устроенных сверху и выданных за стихийный народный гнев.",
     en:"The killing of a German diplomat in Paris was used as a pretext for pogroms organised from above and presented as the people's spontaneous anger."},
    {he:"הרדיפה עברה מחוקים לאלימות גלויה, ורבים הבינו שאין עוד עתיד ליהודים בגרמניה — אך מדינות רבות סגרו את שעריהן.",
     ar:"انتقل الاضطهاد من القوانين إلى العنف العلني، وفهم كثيرون ألّا مستقبل لليهود في ألمانيا — لكن دولًا كثيرة أغلقت أبوابها.",
     ru:"Преследование перешло от законов к открытому насилию, и многие поняли, что у евреев в Германии нет будущего, — но многие страны закрыли свои двери.",
     en:"Persecution moved from laws to open violence, and many understood there was no future for Jews in Germany — but many countries closed their gates."}),
  E(1940,
    {he:"נפילת צרפת והקרב על בריטניה",ar:"سقوط فرنسا ومعركة بريطانيا",ru:"Падение Франции и битва за Британию",en:"The fall of France and the Battle of Britain"},
    {he:"גרמניה כבשה את צרפת בשישה שבועות, ואז ניסתה להכניע את בריטניה בהפצצות אוויר ונכשלה.",
     ar:"احتلّت ألمانيا فرنسا في ستّة أسابيع، ثمّ حاولت إخضاع بريطانيا بالقصف الجوّي وفشلت.",
     ru:"Германия заняла Францию за шесть недель, а затем пыталась сломить Британию бомбардировками с воздуха и потерпела неудачу.",
     en:"Germany overran France in six weeks, and then tried to force Britain to surrender by bombing from the air, and failed."},
    {he:"צרפת ביצרה קו הגנה ארוך אך הגרמנים עקפו אותו דרך היערות, וחיל השריון שלהם היה מהיר ומרוכז.",
     ar:"حصّنت فرنسا خطّ دفاع طويلًا لكن الألمان التفّوا عليه عبر الغابات، وكان سلاح مدرّعاتهم سريعًا مركّزًا.",
     ru:"Франция укрепила длинную оборонительную линию, но немцы обошли её через леса, а их танковые силы были быстры и собраны в кулак.",
     en:"France had fortified a long defensive line, but the Germans went round it through the forests, and their armour was fast and concentrated."},
    {he:"בריטניה נשארה לבדה במערב אך לא נכבשה, והיטלר הפנה את מבטו מזרחה אל ברית המועצות.",
     ar:"بقيت بريطانيا وحدها في الغرب لكنها لم تُحتلّ، ووجّه هتلر نظره شرقًا نحو الاتحاد السوفيتي.",
     ru:"Британия осталась на Западе одна, но не была захвачена, и Гитлер обратил взгляд на восток, к Советскому Союзу.",
     en:"Britain was left alone in the west but was not conquered, and Hitler turned his eyes east towards the Soviet Union."}),
  C({he:"מרחב מחיה",ar:"المجال الحيوي",ru:"Жизненное пространство",en:"Lebensraum — living space"},
    {he:"הטענה הנאצית שהעם הגרמני זכאי לכבוש שטחים במזרח ולגרש מהם את יושביהם, כדי שיהיה לו מקום לגדול.",
     ar:"الدعوى النازية بأن للشعب الألماني حقًّا في احتلال أراضٍ في الشرق وطرد سكانها، ليكون له مكان ينمو فيه.",
     ru:"Нацистское притязание, будто немецкий народ вправе захватить земли на востоке и изгнать оттуда жителей, чтобы иметь место для роста.",
     en:"The Nazi claim that the German people were entitled to seize lands in the east and drive out those living there, so as to have room to grow."})
]);
more("ww2",2,[
  E(1938,
    {he:"הסכם מינכן",ar:"اتفاقية ميونخ",ru:"Мюнхенское соглашение",en:"The Munich agreement"},
    {he:"בריטניה וצרפת הסכימו שגרמניה תספח חבל מצ׳כוסלובקיה, בלי שנציג צ׳כי נכח בשולחן.",
     ar:"وافقت بريطانيا وفرنسا على أن تضمّ ألمانيا إقليمًا من تشيكوسلوفاكيا، دون حضور ممثّل تشيكي إلى الطاولة.",
     ru:"Британия и Франция согласились, что Германия присоединит область Чехословакии, а чешского представителя за столом не было.",
     en:"Britain and France agreed that Germany would annex a region of Czechoslovakia, with no Czech representative at the table."},
    {he:"זכר מלחמת העולם הראשונה היה טרי, ומנהיגי המערב האמינו שאפשר לקנות שלום בוויתור אחרון.",
     ar:"كانت ذكرى الحرب العالمية الأولى طريّة، وآمن قادة الغرب بإمكان شراء السلام بتنازل أخير.",
     ru:"Память о Первой мировой была свежа, и вожди Запада верили, что мир можно купить последней уступкой.",
     en:"The memory of the First World War was fresh, and the leaders of the West believed peace could be bought with one last concession."},
    {he:"בתוך חצי שנה כבשה גרמניה את שאר צ׳כוסלובקיה, והתברר שהוויתור רק חיזק את התוקפן.",
     ar:"خلال نصف سنة احتلّت ألمانيا بقيّة تشيكوسلوفاكيا، وتبيّن أن التنازل لم يزد المعتدي إلا قوّة.",
     ru:"За полгода Германия заняла остальную Чехословакию, и стало ясно, что уступка лишь усилила агрессора.",
     en:"Within half a year Germany seized the rest of Czechoslovakia, and it became clear that the concession had only strengthened the aggressor."}),
  E(1944,
    {he:"הנחיתה בנורמנדי",ar:"إنزال النورماندي",ru:"Высадка в Нормандии",en:"The Normandy landings"},
    {he:"בעלות הברית נחתו על חופי צרפת בפעולה הימית הגדולה בהיסטוריה, ופתחו חזית שנייה במערב אירופה.",
     ar:"نزل الحلفاء على سواحل فرنسا في أكبر عملية بحرية في التاريخ، وفتحوا جبهة ثانية في غرب أوروبا.",
     ru:"Союзники высадились на побережье Франции в крупнейшей морской операции в истории и открыли второй фронт в Западной Европе.",
     en:"The Allies landed on the coast of France in the largest sea operation in history, and opened a second front in Western Europe."},
    {he:"ברית המועצות נשאה לבדה את עיקר הלחימה במזרח שלוש שנים, ותבעה שוב ושוב חזית נוספת שתקל עליה.",
     ar:"حملت الاتحاد السوفيتي وحده عبء القتال في الشرق ثلاث سنوات، وطالب مرارًا بجبهة أخرى تخفّف عنه.",
     ru:"Советский Союз три года один нёс основную тяжесть боёв на востоке и настойчиво требовал второго фронта.",
     en:"The Soviet Union had borne the main fighting in the east alone for three years, and pressed again and again for another front to relieve it."},
    {he:"גרמניה נלכדה בין שתי חזיתות מתקרבות, ובתוך פחות משנה הסתיימה המלחמה באירופה.",
     ar:"حُوصرت ألمانيا بين جبهتين تقتربان، وانتهت الحرب في أوروبا خلال أقلّ من سنة.",
     ru:"Германия оказалась зажата между двумя наступающими фронтами, и меньше чем через год война в Европе закончилась.",
     en:"Germany was caught between two closing fronts, and in less than a year the war in Europe was over."}),
  E(1946,
    {he:"משפטי נירנברג",ar:"محاكمات نورمبرغ",ru:"Нюрнбергский процесс",en:"The Nuremberg trials"},
    {he:"בית דין בינלאומי שפט את מנהיגי גרמניה הנאצית, ודחה את טענתם שפעלו על פי פקודה ועל פי חוקי מדינתם.",
     ar:"حاكمت محكمة دولية قادة ألمانيا النازية، ورفضت دعواهم أنهم نفّذوا أوامر وعملوا وفق قوانين دولتهم.",
     ru:"Международный трибунал судил вождей нацистской Германии и отверг их довод, что они действовали по приказу и по законам своего государства.",
     en:"An international tribunal tried the leaders of Nazi Germany, and rejected their plea that they had acted on orders and under the laws of their own state."},
    {he:"היקף הפשעים היה גדול מכל מה שהמשפט הכיר, ובעלות הברית סירבו להוציא להורג בלי משפט כפי שהוצע.",
     ar:"فاق حجم الجرائم كلّ ما عرفه القانون، ورفض الحلفاء الإعدام بلا محاكمة كما اقتُرح.",
     ru:"Размах преступлений превосходил всё, что знало право, и союзники отвергли предложение казнить без суда.",
     en:"The scale of the crimes went beyond anything the law had known, and the Allies refused to execute without trial as had been proposed."},
    {he:"נקבע שאדם אחראי אישית לפשעיו גם כשמדינתו ציוותה עליהם, וזה יסודו של המשפט הבינלאומי הפלילי.",
     ar:"تقرّر أن الإنسان مسؤول شخصيًّا عن جرائمه حتى إن أمرت بها دولته، وهذا أساس القانون الجنائي الدولي.",
     ru:"Было установлено, что человек лично отвечает за свои преступления, даже если их приказало государство, — это основа международного уголовного права.",
     en:"It was laid down that a person is personally answerable for his crimes even when his state ordered them, and this is the foundation of international criminal law."}),
  C({he:"מדיניות הפיוס",ar:"سياسة الاسترضاء",ru:"Политика умиротворения",en:"Appeasement"},
    {he:"הדרך שבה נקטו בריטניה וצרפת בשנות השלושים: לוותר לתוקפן על תביעותיו בתקווה שיסתפק בהן וימנע מלחמה.",
     ar:"النهج الذي سلكته بريطانيا وفرنسا في الثلاثينيات: التنازل للمعتدي عن مطالبه أملًا أن يكتفي بها ويتجنّب الحرب.",
     ru:"Путь, которым шли Британия и Франция в тридцатые годы: уступать агрессору его требования в надежде, что он ими удовольствуется и войны не будет.",
     en:"The course Britain and France took in the nineteen-thirties: giving an aggressor his demands in the hope that he would be satisfied and war avoided."})
]);
more("ww2",3,[
  E(1948,
    {he:"האמנה למניעת רצח עם",ar:"اتفاقية منع الإبادة الجماعية",ru:"Конвенция о предупреждении геноцида",en:"The Genocide Convention"},
    {he:"האו״ם אימץ אמנה שהגדירה רצח עם כפשע בינלאומי וחייבה את המדינות למנוע אותו ולהעניש עליו.",
     ar:"اعتمدت الأمم المتّحدة اتفاقية عرّفت الإبادة الجماعية جريمة دولية وألزمت الدول بمنعها والمعاقبة عليها.",
     ru:"ООН приняла конвенцию, определившую геноцид как международное преступление и обязавшую государства предупреждать его и карать за него.",
     en:"The United Nations adopted a convention defining genocide as an international crime and obliging states to prevent it and to punish it."},
    {he:"אחרי השואה התברר שאין בחוק הקיים מושג שמתאר השמדת עם שלם, ומשפטן יהודי-פולני טבע אותו ופעל להכרה בו.",
     ar:"بعد المحرقة تبيّن أن القانون القائم يخلو من مفهوم يصف إبادة شعب بأكمله، فصكّه حقوقي يهودي بولندي وسعى للاعتراف به.",
     ru:"После Холокоста выяснилось, что в существующем праве нет понятия, описывающего истребление целого народа, и польско-еврейский юрист ввёл его и добился признания.",
     en:"After the Holocaust it emerged that existing law had no term for the destruction of a whole people, and a Polish-Jewish jurist coined one and worked for its recognition."},
    {he:"נוצר כלי משפטי בינלאומי לתביעת אחראים, אך המדינות התקשו ליישמו — ורצח עם התרחש גם אחריו.",
     ar:"نشأت أداة قانونية دولية لملاحقة المسؤولين، لكن الدول تعثّرت في تطبيقها — ووقعت إبادات بعدها أيضًا.",
     ru:"Появился международный правовой инструмент для преследования виновных, но государствам было трудно его применять — и геноцид случался и после него.",
     en:"An international legal instrument for prosecuting those responsible came into being, but states found it hard to apply — and genocide happened after it too."}),
  C({he:"רצח עם",ar:"الإبادة الجماعية",ru:"Геноцид",en:"Genocide"},
    {he:"מעשים שנעשים בכוונה להשמיד קבוצה לאומית, אתנית, גזעית או דתית, כולה או חלקה.",
     ar:"أفعال تُرتكب بنيّة إهلاك جماعة قومية أو إثنية أو عرقية أو دينية، كلّها أو بعضها.",
     ru:"Действия, совершаемые с намерением уничтожить национальную, этническую, расовую или религиозную группу целиком или частично.",
     en:"Acts committed with the intent to destroy, in whole or in part, a national, ethnic, racial or religious group."}),
  C({he:"פרטיזנים",ar:"المقاومة الحزبية",ru:"Партизаны",en:"Partisans"},
    {he:"לוחמים שפעלו מן היערות מאחורי קווי האויב, חיבלו ברכבות ובמחסנים והצילו נמלטים.",
     ar:"مقاتلون عملوا من الغابات خلف خطوط العدوّ، فخرّبوا القطارات والمخازن وأنقذوا الهاربين.",
     ru:"Бойцы, действовавшие из лесов в тылу врага: они подрывали поезда и склады и спасали беглецов.",
     en:"Fighters who operated from the forests behind enemy lines, wrecking trains and stores and saving those who had fled."}),
  Sc({he:["פשעים נגד המשפט הבינלאומי מבוצעים בידי בני אדם, ולא בידי ישויות מופשטות,",
          "ורק בענישת היחידים המבצעים אותם אפשר לאכוף את הוראות המשפט הבינלאומי.",
          "הטענה שאדם פעל לפי פקודת ממשלתו או של ממונה עליו",
          "אינה משחררת אותו מאחריות, אף שאפשר להתחשב בה בקביעת העונש.",
          "מתוך פסק הדין ומגילת בית הדין הצבאי הבינלאומי בנירנברג."],
      ar:["الجرائم ضدّ القانون الدولي يرتكبها بشر، لا كيانات مجرّدة،",
          "ولا يمكن إنفاذ أحكام القانون الدولي إلا بمعاقبة الأفراد الذين يرتكبونها.",
          "والدعوى بأن المرء تصرّف بأمر حكومته أو رئيسه",
          "لا تعفيه من المسؤولية، وإن جاز أخذها بالحسبان عند تحديد العقوبة.",
          "من حكم وميثاق المحكمة العسكرية الدولية في نورمبرغ."],
      ru:["Преступления против международного права совершают люди, а не отвлечённые образования,",
          "и лишь наказанием отдельных лиц, их совершающих, можно обеспечить соблюдение международного права.",
          "Ссылка на то, что человек действовал по приказу правительства или начальника,",
          "не освобождает его от ответственности, хотя может быть учтена при назначении наказания.",
          "Из приговора и устава Международного военного трибунала в Нюрнберге."],
      en:["Crimes against international law are committed by men, not by abstract entities,",
          "and only by punishing the individuals who commit them can the provisions of international law be enforced.",
          "The plea that a person acted on the order of his government or of a superior",
          "does not free him from responsibility, though it may be considered in fixing the punishment.",
          "From the judgment and charter of the International Military Tribunal at Nuremberg."]},
     [Q({he:"מה קובע המקור לגבי הטענה שאדם רק מילא פקודות?",ar:"ماذا يقرّر المصدر بشأن دعوى أن المرء نفّذ أوامر فقط؟",ru:"Что источник устанавливает о доводе, что человек лишь выполнял приказы?",en:"What does the source lay down about the plea that a person only followed orders?"},
        {he:"שהיא אינה פוטרת מאחריות, אך אפשר להתחשב בה כשקובעים את חומרת העונש.",ar:"أنها لا تعفي من المسؤولية، لكن يمكن أخذها بالحسبان عند تحديد شدّة العقوبة.",ru:"Что он не освобождает от ответственности, но может быть учтён при определении тяжести наказания.",en:"That it does not free a person from responsibility, but may be taken into account in fixing the severity of the punishment."},
        [{he:"שהיא פוטרת לגמרי מאחריות, שכן האחריות היא של המפקד.",ar:"أنها تعفي تمامًا من المسؤولية، لأن المسؤولية على الآمر.",ru:"Что он полностью освобождает от ответственности, ибо отвечает командир.",en:"That it frees a person entirely from responsibility, since the commander is the one answerable."},
         {he:"שהיא אינה נבחנת כלל, והמשפט מתעלם ממנה.",ar:"أنها لا تُبحث البتّة، وتتجاهلها المحاكمة.",ru:"Что он вовсе не рассматривается и суд его игнорирует.",en:"That it is not examined at all, and the trial disregards it."},
         {he:"שהיא תקפה רק כאשר החוק במדינה התיר את המעשה.",ar:"أنها صالحة فقط إذا أباح قانون الدولة الفعل.",ru:"Что он действителен лишь тогда, когда закон государства дозволял это деяние.",en:"That it holds only where the law of the state permitted the act."}]),
      Q({he:"מדוע מדגיש המקור שפשעים מבוצעים בידי בני אדם?",ar:"لماذا يشدّد المصدر على أن الجرائم يرتكبها بشر؟",ru:"Почему источник подчёркивает, что преступления совершают люди?",en:"Why does the source stress that crimes are committed by men?"},
        {he:"כדי שאי אפשר יהיה להסתתר מאחורי המדינה — אדם, ולא מוסד, עומד לדין.",ar:"كي لا يمكن الاختباء خلف الدولة — فالإنسان لا المؤسّسة هو من يُحاكَم.",ru:"Чтобы нельзя было укрыться за государством: судят человека, а не учреждение.",en:"So that no one can hide behind the state — a person, not an institution, stands trial."},
        [{he:"כדי לקבוע שרק חיילים בשדה הקרב אחראים למעשיהם.",ar:"لتقرير أن الجنود في الميدان وحدهم مسؤولون عن أفعالهم.",ru:"Чтобы установить, что за свои действия отвечают лишь солдаты на поле боя.",en:"To establish that only soldiers in the field are answerable for what they do."},
         {he:"כדי להטיל את מלוא האחריות על העם הגרמני כולו.",ar:"لتحميل الشعب الألماني كلّه المسؤولية كاملة.",ru:"Чтобы возложить всю ответственность на весь немецкий народ.",en:"To place the whole responsibility on the German people as a whole."},
         {he:"כדי לקבוע שמדינות בלבד יכולות לעמוד לדין בינלאומי.",ar:"لتقرير أن الدول وحدها يمكن أن تُحاكَم دوليًّا.",ru:"Чтобы установить, что перед международным судом могут отвечать только государства.",en:"To establish that only states can be brought before an international court."}])])
]);

more("israel",1,[
  E(1936,
    {he:"המרד הערבי הגדול",ar:"الثورة العربية الكبرى في فلسطين",ru:"Арабское восстание в Палестине",en:"The Arab Revolt in Palestine"},
    {he:"ערביי הארץ פתחו בשביתה כללית ובמרד מזוין נגד השלטון הבריטי ונגד ההתיישבות היהודית, שנמשך שלוש שנים.",
     ar:"بدأ عرب البلاد إضرابًا عامًّا وثورة مسلّحة ضدّ الحكم البريطاني والاستيطان اليهودي، دامت ثلاث سنوات.",
     ru:"Арабы страны начали всеобщую забастовку и вооружённое восстание против британской власти и еврейского заселения, длившееся три года.",
     en:"The Arabs of the country began a general strike and an armed revolt against British rule and Jewish settlement, which lasted three years."},
    {he:"העלייה היהודית גדלה מאוד בעקבות עליית הנאצים, וערביי הארץ חששו לאבד את הרוב ואת אדמותיהם.",
     ar:"تعاظمت الهجرة اليهودية إثر صعود النازيين، وخشي عرب البلاد فقدان الأكثرية وأراضيهم.",
     ru:"Еврейская репатриация резко выросла после прихода нацистов к власти, и арабы страны боялись потерять большинство и свои земли.",
     en:"Jewish immigration had grown sharply after the Nazis came to power, and the Arabs of the country feared losing their majority and their lands."},
    {he:"בריטניה דיכאה את המרד אך פרסמה את הספר הלבן שהגביל את העלייה, והיישוב היהודי חיזק את כוחו המזוין.",
     ar:"قمعت بريطانيا الثورة لكنها أصدرت الكتاب الأبيض الذي قيّد الهجرة، وعزّز اليشوف اليهودي قوّته المسلّحة.",
     ru:"Британия подавила восстание, но издала Белую книгу, ограничившую репатриацию, а еврейский ишув усилил свои вооружённые силы.",
     en:"Britain put down the revolt but issued the White Paper restricting immigration, and the Jewish Yishuv built up its armed strength."}),
  E(1945,
    {he:"תנועת המרי העברי",ar:"حركة التمرّد العبري",ru:"Движение еврейского сопротивления",en:"The Jewish Resistance Movement"},
    {he:"ההגנה, האצ״ל והלח״י פעלו יחד נגד השלטון הבריטי, פוצצו גשרים ומסילות ופרצו למחנות מעצר.",
     ar:"عملت الهاغاناه والإتسل والليحي معًا ضدّ الحكم البريطاني، ففجّروا جسورًا وسككًا واقتحموا معسكرات اعتقال.",
     ru:"«Хагана», ЭЦЕЛ и ЛЕХИ действовали вместе против британской власти: взрывали мосты и пути и врывались в лагеря для задержанных.",
     en:"The Haganah, the Irgun and Lehi acted together against British rule, blowing up bridges and railways and breaking into detention camps."},
    {he:"המלחמה הסתיימה והשואה נודעה, אך בריטניה סירבה לבטל את הגבלות העלייה וניצולים הוחזרו מן הנמלים.",
     ar:"انتهت الحرب وعُرفت المحرقة، لكن بريطانيا رفضت إلغاء قيود الهجرة وأُعيد ناجون من الموانئ.",
     ru:"Война кончилась и о Холокосте стало известно, но Британия отказалась отменить ограничения на въезд, и уцелевших разворачивали из портов.",
     en:"The war had ended and the Holocaust was known, but Britain refused to lift the immigration limits and survivors were turned back from the ports."},
    {he:"בריטניה הבינה שהחזקת הארץ יקרה ובלתי אפשרית, והעבירה את שאלת ארץ ישראל לאו״ם.",
     ar:"أدركت بريطانيا أن الاحتفاظ بالبلاد مكلف ومستحيل، فأحالت مسألة فلسطين إلى الأمم المتّحدة.",
     ru:"Британия поняла, что удерживать страну дорого и невозможно, и передала вопрос о Земле Израиля в ООН.",
     en:"Britain saw that holding the country was costly and impossible, and referred the question of Palestine to the United Nations."}),
  E(1949,
    {he:"הסכמי שביתת הנשק",ar:"اتفاقيات الهدنة",ru:"Соглашения о перемирии",en:"The armistice agreements"},
    {he:"ישראל חתמה על הסכמי הפסקת אש עם מצרים, ירדן, סוריה ולבנון, ובהם נקבעו קווי הגבול בפועל.",
     ar:"وقّعت إسرائيل اتفاقيات وقف إطلاق نار مع مصر والأردن وسوريا ولبنان، حُدّدت فيها خطوط الحدود فعليًّا.",
     ru:"Израиль подписал соглашения о прекращении огня с Египтом, Иорданией, Сирией и Ливаном, в которых были определены фактические линии границ.",
     en:"Israel signed ceasefire agreements with Egypt, Jordan, Syria and Lebanon, which set the lines of the border in practice."},
    {he:"מלחמת העצמאות נמשכה כשנה והתישה את כל הצדדים, ואיש מהם לא היה מסוגל להמשיך להילחם.",
     ar:"دامت حرب الاستقلال نحو سنة وأنهكت كلّ الأطراف، ولم يعد أيّ منها قادرًا على مواصلة القتال.",
     ru:"Война за независимость длилась около года и истощила все стороны, и никто уже не мог продолжать бои.",
     en:"The War of Independence had gone on for about a year and exhausted every side, and none of them could keep fighting."},

    {he:"ארגון ההגנה המחתרתי של היישוב היהודי בארץ ישראל, שהיה לגרעין שממנו הוקם צבא ההגנה לישראל.",
     ar:"منظّمة الدفاع السرّية لليشوف اليهودي في أرض إسرائيل، وكانت النواة التي أُقيم منها جيش الدفاع الإسرائيلي.",
     ru:"Подпольная оборонная организация еврейского ишува в Земле Израиля, ставшая ядром, из которого была создана израильская армия.",

more("israel",2,[
  E(1952,
    {he:"הסכם השילומים עם גרמניה",ar:"اتفاقية التعويضات مع ألمانيا",ru:"Соглашение о репарациях с Германией",en:"The reparations agreement with Germany"},

     ar:"وقّعت إسرائيل وألمانيا الغربية اتفاقية تدفع بموجبها ألمانيا بضائع وأموالًا بقيمة مليار دولار.",
     ru:"Израиль и Западная Германия подписали соглашение, по которому Германия выплатит товарами и деньгами на миллиард долларов.",

     ru:"Израиль занял Синай в согласии с Британией и Францией и через несколько месяцев ушёл оттуда под американским и советским давлением.",
     en:"Israel took the Sinai in coordination with Britain and France, and withdrew from it months later under American and Soviet pressure."},

     ar:"أمّمت مصر قناة السويس، وأغلقت مضائق تيران أمام الملاحة الإسرائيلية، وهاجمت خلايا الفدائيين من غزّة.",
     ru:"Египет национализировал Суэцкий канал, закрыл Тиранский пролив для израильского судоходства, и отряды федаинов нападали из Газы.",

    {he:"נפתחו מיצרי טיראן והוצב כוח או״ם בגבול, אך התברר שהמעצמות הגדולות קובעות את גבולות הפעולה.",

    {he:"מצרים וסוריה תקפו בהפתעה ביום הצום, ואחרי נסיגה קשה בימים הראשונים הצליחה ישראל להתאושש ולהתקדם.",
     ar:"هاجمت مصر وسوريا مباغتةً في يوم الصوم، وبعد تراجع صعب في الأيّام الأولى تمكّنت إسرائيل من الإفاقة والتقدّم.",
     ru:"Египет и Сирия ударили внезапно в день поста, и после тяжёлого отступления в первые дни Израилю удалось оправиться и перейти в наступление.",
     en:"Egypt and Syria attacked by surprise on the fast day, and after a hard retreat in the first days Israel managed to recover and advance."},
    {he:"ישראל בטחה בעליונותה אחרי הניצחון של 1967 ולא האמינה שהערבים יתקפו, והתעלמה מסימני האזהרה.",
     ar:"وثقت إسرائيل بتفوّقها بعد نصر 1967 ولم تصدّق أن العرب سيهاجمون، وتجاهلت إشارات التحذير.",
     ru:"Израиль полагался на своё превосходство после победы 1967 года, не верил, что арабы нападут, и пренебрёг признаками угрозы.",
     en:"Israel trusted in its superiority after the victory of 1967, did not believe the Arabs would attack, and ignored the warning signs."},
    {he:"המלחמה גבתה אלפי הרוגים וזעזעה את הביטחון העצמי, אך פתחה את הדרך למשא ומתן ולשלום עם מצרים.",
     ar:"حصدت الحرب آلاف القتلى وهزّت الثقة بالنفس، لكنها فتحت الطريق للمفاوضات وللسلام مع مصر.",
     ru:"Война унесла тысячи жизней и подорвала самоуверенность, но открыла путь к переговорам и к миру с Египтом.",
     en:"The war cost thousands of lives and shook the country's confidence, but it opened the way to negotiations and to peace with Egypt."}),
  C({he:"כור היתוך",ar:"بوتقة الصهر",ru:"«Плавильный котёл»",en:"The melting pot"},
    {he:"התפיסה שלפיה על העולים מכל הארצות לוותר על תרבותם ולהתמזג בזהות ישראלית אחידה ומשותפת.",
     ar:"التصوّر القاضي بأن على المهاجرين من كلّ البلدان التخلّي عن ثقافتهم والانصهار في هويّة إسرائيلية موحّدة.",
     ru:"Представление, по которому репатрианты из всех стран должны отказаться от своей культуры и слиться в единую израильскую идентичность.",
     en:"The view that immigrants from every country should give up their own culture and merge into one shared Israeli identity."})
]);
more("israel",3,[

     ru:"Была создана Палестинская автономия, но вопросы границ, Иерусалима и беженцев отложили — и процесс остановился волной терактов и убийством премьер-министра.",
     en:"The Palestinian Authority was set up, but the questions of borders, Jerusalem and the refugees were deferred — and the process halted in a wave of terror and the murder of the prime minister."}),
  C({he:"הכנסת",ar:"الكنيست",ru:"Кнессет",en:"The Knesset"},
    {he:"בית הנבחרים של ישראל, מאה ועשרים חברים הנבחרים ברשימות מפלגתיות לכל הארץ כמחוז בחירה אחד.",
     ar:"مجلس نوّاب إسرائيل، مئة وعشرون عضوًا يُنتخبون بقوائم حزبية والبلاد كلّها دائرة انتخابية واحدة.",
     ru:"Парламент Израиля: сто двадцать депутатов, избираемых по партийным спискам, при этом вся страна — один избирательный округ.",
     en:"Israel's parliament: a hundred and twenty members elected on party lists, with the whole country as a single constituency."}),
  C({he:"מדינה יהודית ודמוקרטית",ar:"دولة يهودية وديمقراطية",ru:"Еврейское и демократическое государство",en:"A Jewish and democratic state"},
    {he:"ההגדרה שישראל נתנה לעצמה בחוקי היסוד, ובה מתקיים מתח מתמיד בין אופייה הלאומי לבין שוויון כל אזרחיה.",
     ar:"التعريف الذي أعطته إسرائيل لنفسها في قوانين الأساس، وفيه توتّر دائم بين طابعها القومي ومساواة كلّ مواطنيها.",
     ru:"Определение, которое Израиль дал себе в основных законах, где постоянно сохраняется напряжение между национальным характером и равенством всех граждан.",
     en:"The definition Israel gave itself in its basic laws, in which there is a constant tension between its national character and the equality of all its citizens."}),
  Sc({he:["המנדט על ארץ ישראל יסתיים במועד המוקדם ביותר האפשרי;",
          "ארץ ישראל תחולק למדינה יהודית, למדינה ערבית ולמשטר בינלאומי מיוחד לעיר ירושלים.",
          "מדינות אלה יקומו חודשיים אחרי סיום פינוי הכוחות הבריטיים.",
          "לא תיעשה כל אפליה בין התושבים מטעמי גזע, דת, לשון או מין.",
          "מתוך החלטה 181 של עצרת האו״ם, כ״ט בנובמבר 1947."],
      ar:["ينتهي الانتداب على فلسطين في أقرب موعد ممكن؛",

          "وتقوم هذه الدول بعد شهرين من إتمام جلاء القوّات البريطانية.",
          "ولا يجوز أيّ تمييز بين السكّان بسبب العرق أو الدين أو اللغة أو الجنس.",
          "من القرار ١٨١ للجمعية العامة للأمم المتّحدة، 29 تشرين الثاني 1947."],
      ru:["Мандат на Палестину прекращается в возможно кратчайший срок;",
          "Палестина делится на еврейское государство, арабское государство и особый международный режим для города Иерусалима.",
          "Эти государства возникнут через два месяца после завершения вывода британских войск.",
          "Не допускается никакой дискриминации между жителями по признаку расы, религии, языка или пола.",
          "Из резолюции 181 Генеральной Ассамблеи ООН, 29 ноября 1947 года."],
      en:["The Mandate for Palestine shall terminate as soon as possible;",
          "Palestine shall be divided into a Jewish State, an Arab State and a special international regime for the City of Jerusalem.",
          "These States shall come into existence two months after the withdrawal of the British forces is completed.",
          "No discrimination of any kind shall be made between the inhabitants on the ground of race, religion, language or sex.",
          "From resolution 181 of the UN General Assembly, 29 November 1947."]},
     [Q({he:"לכמה חלקים חילקה ההחלטה את הארץ?",ar:"إلى كم قسم قسّم القرار البلاد؟",ru:"На сколько частей резолюция разделила страну?",en:"Into how many parts did the resolution divide the country?"},
        {he:"לשלושה: מדינה יהודית, מדינה ערבית, וירושלים תחת משטר בינלאומי נפרד.",ar:"إلى ثلاثة: دولة يهودية ودولة عربية والقدس تحت نظام دولي منفصل.",ru:"На три: еврейское государство, арабское государство и Иерусалим под отдельным международным режимом.",en:"Into three: a Jewish state, an Arab state, and Jerusalem under a separate international regime."},
        [{he:"לשניים: מדינה יהודית ומדינה ערבית, וירושלים בתוך אחת מהן.",ar:"إلى اثنين: دولة يهودية ودولة عربية، والقدس داخل إحداهما.",ru:"На две: еврейское и арабское государства, а Иерусалим внутри одного из них.",en:"Into two: a Jewish state and an Arab state, with Jerusalem inside one of them."},
         {he:"לארבעה, כולל אזור נפרד לחוף הים ולנמלים.",ar:"إلى أربعة، بما فيها منطقة منفصلة للساحل والموانئ.",ru:"На четыре, включая отдельную область для побережья и портов.",en:"Into four, including a separate zone for the coast and the ports."},
         {he:"לא חילקה כלל, אלא הותירה את הארץ תחת מנדט בריטי.",ar:"لم يقسّمها البتّة، بل أبقى البلاد تحت الانتداب البريطاني.",ru:"Не делила вовсе, а оставляла страну под британским мандатом.",en:"It did not divide it at all, but left the country under the British Mandate."}]),
      Q({he:"מה דורשת ההחלטה משתי המדינות כלפי תושביהן?",ar:"ماذا يطلب القرار من الدولتين تجاه سكّانهما؟",ru:"Чего резолюция требует от обоих государств по отношению к жителям?",en:"What does the resolution require of both states towards their inhabitants?"},
        {he:"לא להפלות בין תושבים על רקע גזע, דת, לשון או מין.",ar:"عدم التمييز بين السكّان على أساس العرق أو الدين أو اللغة أو الجنس.",ru:"Не допускать различия между жителями по расе, религии, языку или полу.",en:"Not to discriminate between inhabitants on grounds of race, religion, language or sex."},
        [{he:"להעניק אזרחות רק לבני הלאום שעל שמו קרויה המדינה.",ar:"منح المواطنة لأبناء القومية التي تحمل الدولة اسمها فقط.",ru:"Давать гражданство только тем, чьим именем названо государство.",en:"To grant citizenship only to members of the nation the state is named for."},
         {he:"להעביר את כל התושבים למדינה שבה בני עמם הם הרוב.",ar:"نقل كلّ السكّان إلى الدولة التي يشكّل فيها بنو قومهم أكثرية.",ru:"Переселить всех жителей в государство, где их народ составляет большинство.",en:"To move all inhabitants to the state where their own people are the majority."},
         {he:"לקבוע שפה רשמית אחת בלבד בכל אחת מן המדינות.",ar:"تحديد لغة رسمية واحدة فقط في كلّ من الدولتين.",ru:"Установить только один государственный язык в каждом из государств.",en:"To set only one official language in each of the states."}])])
]);

more("egypt",1,[
  E(-2670,
    {he:"פירמידת המדרגות של ג׳וסר",ar:"هرم زوسر المدرّج",ru:"Ступенчатая пирамида Джосера",en:"The step pyramid of Djoser"},

     ru:"До того царские гробницы строили из глиняного кирпича, и они рассыпались за несколько поколений, что не подобало правителю, которого считали богом.",
     en:"Until then royal tombs were built of mud brick and crumbled within a few generations, which did not befit a ruler held to be a god."},
    {he:"נפתח עידן בניית הפירמידות במצרים, ואימחותפ נזכר מאות שנים אחר כך כחכם וכמרפא.",
     ar:"انفتح عصر بناء الأهرامات في مصر، وذُكر إمحوتب بعد مئات السنين حكيمًا وطبيبًا.",
     ru:"Начался век строительства пирамид в Египте, а Имхотепа спустя столетия вспоминали как мудреца и целителя.",
     en:"The age of pyramid building in Egypt began, and Imhotep was remembered centuries later as a sage and a healer."}),
  E(-1479,
    {he:"חתשפסות עולה לשלטון",ar:"حتشبسوت تتولّى الحكم",ru:"Хатшепсут приходит к власти",en:"Hatshepsut comes to power"},
    {he:"חתשפסות מלכה במצרים כשני עשורים, שלחה משלחת מסחר לארץ פונט ובנתה מקדש מדורג בדיר אל-בחרי.",
     ar:"حكمت حتشبسوت مصر نحو عقدين، وأرسلت بعثة تجارية إلى بلاد بونت، وبنت معبدًا مدرّجًا في الدير البحري.",
     ru:"Хатшепсут правила Египтом около двух десятилетий, послала торговую экспедицию в страну Пунт и построила ступенчатый храм в Дейр-эль-Бахри.",
     en:"Hatshepsut ruled Egypt for about two decades, sent a trading expedition to the land of Punt and built a terraced temple at Deir el-Bahari."},
    {he:"יורש העצר היה ילד קטן, וחתשפסות שלטה תחילה בשמו ואחר כך הכריזה על עצמה כפרעה לכל דבר.",
     ar:"كان وليّ العهد طفلًا صغيرًا، فحكمت حتشبسوت باسمه أوّلًا ثمّ أعلنت نفسها فرعونًا كاملًا.",
     ru:"Наследник был малым ребёнком, и Хатшепсут правила сначала от его имени, а затем объявила себя полноправным фараоном.",
     en:"The heir was a small child, and Hatshepsut ruled at first in his name and then declared herself pharaoh in full."},
    {he:"מצרים ידעה עשרים שנות שגשוג בלי מלחמות, אך יורשה ניסה למחוק את שמה מן האנדרטאות.",
     ar:"عرفت مصر عشرين سنة ازدهار بلا حروب، لكن خليفتها حاول محو اسمها من الآثار.",
     ru:"Египет знал двадцать лет расцвета без войн, но её преемник пытался стереть её имя с памятников.",
     en:"Egypt knew twenty years of prosperity without wars, but her successor tried to erase her name from the monuments."}),
  E(-1279,
    {he:"רעמסס השני עולה לשלטון",ar:"رمسيس الثاني يتولّى الحكم",ru:"Рамсес II восходит на престол",en:"Ramesses II comes to the throne"},
    {he:"רעמסס השני מלך שישים ושש שנה, בנה ערים ומקדשי סלע ענקיים והציב את פסליו בכל רחבי מצרים.",
     ar:"حكم رمسيس الثاني ستًّا وستّين سنة، وبنى مدنًا ومعابد صخرية هائلة، ونصب تماثيله في أنحاء مصر.",
     ru:"Рамсес II правил шестьдесят шесть лет, строил города и огромные скальные храмы и ставил свои статуи по всему Египту.",
     en:"Ramesses II reigned for sixty-six years, built cities and vast rock temples, and set up his statues throughout Egypt."},
    {he:"אחרי הרפורמה שזעזעה את מצרים ביקשו הפרעונים לשקם את סמכות המלוכה ואת אמון הכוהנים.",
     ar:"بعد الإصلاح الذي هزّ مصر سعى الفراعنة إلى ترميم سلطة الملكية وثقة الكهنة.",
     ru:"После реформы, потрясшей Египет, фараоны стремились восстановить власть престола и доверие жречества.",
     en:"After the reform that had shaken Egypt, the pharaohs sought to restore the authority of the throne and the trust of the priests."},
    {he:"מצרים הגיעה לשיא כוחה וזוהי התקופה שאליה מקובל לקשור את סיפור יציאת מצרים.",
     ar:"بلغت مصر ذروة قوّتها، وهذه الحقبة التي جرت العادة أن تُنسب إليها قصّة الخروج.",
     ru:"Египет достиг вершины могущества, и именно с этой эпохой принято связывать рассказ об Исходе.",
     en:"Egypt reached the height of its power, and this is the period to which the story of the Exodus is usually linked."}),
  C({he:"מומיה",ar:"المومياء",ru:"Мумия",en:"Mummy"},
    {he:"גופה שנשמרה בחניטה, בהוצאת האיברים ובייבוש במלח, כדי שהנפש תמצא אליה את דרכה בעולם הבא.",
     ar:"جثّة حُفظت بالتحنيط، بنزع الأحشاء والتجفيف بالملح، كي تجد الروح طريقها إليها في العالم الآخر.",
     ru:"Тело, сохранённое бальзамированием — с изъятием внутренностей и высушиванием солью, — чтобы душа нашла к нему путь в загробном мире.",
     en:"A body preserved by embalming — the organs removed and the flesh dried in salt — so that the soul could find its way back to it in the next world."})
]);
more("egypt",2,[
  E(-1650,
    {he:"ההיקסוס משתלטים על מצרים התחתונה",ar:"الهكسوس يسيطرون على مصر السفلى",ru:"Гиксосы захватывают Нижний Египет",en:"The Hyksos take Lower Egypt"},
    {he:"שבטים שבאו מכנען השתלטו על צפון מצרים והקימו בה ממלכה משלהם שהחזיקה כמאה שנה.",
     ar:"سيطرت قبائل قادمة من كنعان على شمال مصر وأقامت فيه مملكة خاصّة دامت نحو مئة سنة.",
     ru:"Племена, пришедшие из Ханаана, овладели северным Египтом и создали там своё царство, продержавшееся около ста лет.",
     en:"Tribes who came from Canaan took over northern Egypt and set up a kingdom of their own there that lasted about a hundred years."},
    {he:"מצרים היתה מפולגת בין שליטים מקומיים, ולהיקסוס היו מרכבות סוסים וקשתות מורכבות שלא היו למצרים.",
     ar:"كانت مصر منقسمة بين حكّام محلّيين، وكان للهكسوس عربات خيل وأقواس مركّبة لم تكن لدى المصريين.",
     ru:"Египет был расколот между местными правителями, а у гиксосов были конные колесницы и составные луки, которых у египтян не было.",
     en:"Egypt was split among local rulers, and the Hyksos had horse chariots and composite bows that the Egyptians did not."},
    {he:"מצרים למדה מאויביה את המרכבה ואת הקשת, ובכלים האלה יצאה מאוחר יותר לכבוש את כנען.",
     ar:"تعلّمت مصر من أعدائها العربة والقوس، وبهما خرجت لاحقًا لفتح كنعان.",
     ru:"Египет перенял у врагов колесницу и лук и позже с этим оружием пошёл завоёвывать Ханаан.",
     en:"Egypt learned the chariot and the bow from its enemies, and with these later went out to conquer Canaan."}),
  E(-1550,
    {he:"גירוש ההיקסוס ותחילת הממלכה החדשה",ar:"طرد الهكسوس وبداية الدولة الحديثة",ru:"Изгнание гиксосов и начало Нового царства",en:"The expulsion of the Hyksos and the New Kingdom"},
    {he:"נסיכי תבי גירשו את ההיקסוס ממצרים, איחדו אותה מחדש והחלו לכבוש שטחים מעבר לגבולותיה.",
     ar:"طرد أمراء طيبة الهكسوس من مصر، ووحّدوها من جديد، وبدأوا فتح أراضٍ خارج حدودها.",
     ru:"Правители Фив изгнали гиксосов из Египта, вновь его объединили и начали завоёвывать земли за его пределами.",
     en:"The princes of Thebes drove the Hyksos out of Egypt, reunited it and began conquering lands beyond its borders."},
    {he:"שלטון זרים במשך דורות היה השפלה, והמצרים הבינו שגבול פתוח בצפון יזמין פלישה נוספת.",
     ar:"كان حكم الغرباء أجيالًا إذلالًا، وأدرك المصريون أن حدًّا مفتوحًا في الشمال يدعو إلى غزو آخر.",
     ru:"Владычество чужаков в течение поколений было унижением, и египтяне поняли, что открытая граница на севере зовёт новое вторжение.",
     en:"Generations of foreign rule had been a humiliation, and the Egyptians saw that an open frontier in the north invited another invasion."},
    {he:"מצרים הפכה מממלכה מסוגרת לאימפריה ששלטה בכנען ובנוביה, וזהו שיא עושרה וכוחה.",
     ar:"تحوّلت مصر من مملكة منغلقة إلى إمبراطورية حكمت كنعان والنوبة، وهذه ذروة ثرائها وقوّتها.",
     ru:"Египет из замкнутого царства стал державой, правившей Ханааном и Нубией, — это вершина его богатства и мощи.",
     en:"Egypt turned from a closed kingdom into an empire ruling Canaan and Nubia, and this is the height of its wealth and power."}),
  E(-1595,
    {he:"החתים בוזזים את בבל",ar:"الحثّيون ينهبون بابل",ru:"Хетты разоряют Вавилон",en:"The Hittites sack Babylon"},
    {he:"צבא החתים ירד מאנטוליה, בזז את בבל והפיל את השושלת שחמורבי ייסד, ואז שב לארצו.",
     ar:"نزل جيش الحثّيين من الأناضول، ونهب بابل، وأسقط السلالة التي أسّسها حمورابي، ثمّ عاد إلى بلاده.",
     ru:"Хеттское войско спустилось из Анатолии, разграбило Вавилон, свергло династию, основанную Хаммурапи, и ушло назад.",
     en:"The Hittite army came down from Anatolia, plundered Babylon, brought down the dynasty Hammurabi had founded, and then went home."},
    {he:"בבל נחלשה אחרי מות חמורבי ואיבדה שליטה בערי הדרום, ולא היה בכוחה לעצור פשיטה רחוקה.",
     ar:"ضعفت بابل بعد موت حمورابي وفقدت السيطرة على مدن الجنوب، ولم تقوَ على صدّ غارة بعيدة.",
     ru:"Вавилон ослаб после смерти Хаммурапи и потерял власть над южными городами, и не мог отразить дальний набег.",
     en:"Babylon had weakened after Hammurabi's death and lost its hold on the southern cities, and could not stop a distant raid."},
    {he:"החתים עלו כמעצמה שלישית לצד מצרים ובבל, ובמאות הבאות התחרו השלוש על השליטה בכנען ובסוריה.",
     ar:"صعد الحثّيون قوّة ثالثة إلى جانب مصر وبابل، وتنافست الثلاث في القرون التالية على السيطرة في كنعان وسوريا.",
     ru:"Хетты поднялись как третья держава рядом с Египтом и Вавилоном, и в следующие века все три соперничали за Ханаан и Сирию.",
     en:"The Hittites rose as a third power beside Egypt and Babylon, and in the centuries that followed the three contended for Canaan and Syria."}),
  C({he:"הירוגליפים",ar:"الكتابة الهيروغليفية",ru:"Иероглифы",en:"Hieroglyphs"},
    {he:"כתב מצרי שסימניו ציורים של חפצים ובעלי חיים, ושימש בעיקר לכתובות במקדשים ובקברים.",
     ar:"كتابة مصرية علاماتها رسوم أشياء وحيوانات، استُعملت خاصّة لنقوش المعابد والقبور.",
     ru:"Египетское письмо, знаки которого — изображения предметов и животных; его применяли главным образом для надписей в храмах и гробницах.",
     en:"Egyptian writing whose signs are pictures of objects and animals, used chiefly for inscriptions in temples and tombs."})
]);
more("egypt",3,[
  E(-1274,
    {he:"קרב קדש",ar:"معركة قادش",ru:"Битва при Кадеше",en:"The battle of Kadesh"},
    {he:"אלפי מרכבות של מצרים ושל החתים נפגשו בצפון סוריה בקרב המרכבות הגדול הידוע, ואיש לא ניצח בו.",
     ar:"التقت آلاف العربات المصرية والحثّية في شمال سوريا في أكبر معركة عربات معروفة، ولم ينتصر فيها أحد.",
     ru:"Тысячи египетских и хеттских колесниц сошлись в северной Сирии в крупнейшей известной битве колесниц, и никто в ней не победил.",
     en:"Thousands of Egyptian and Hittite chariots met in northern Syria in the largest chariot battle known, and neither side won."},
    {he:"שתי המעצמות תבעו לעצמן את השליטה בסוריה, שהיתה צומת דרכי המסחר בין אסיה לאפריקה.",
     ar:"طالبت القوّتان بالسيطرة على سوريا، ملتقى طرق التجارة بين آسيا وأفريقيا.",
     ru:"Обе державы притязали на власть над Сирией — узлом торговых путей между Азией и Африкой.",
     en:"Both powers claimed control of Syria, the junction of the trade routes between Asia and Africa."},
    {he:"רעמסס תיאר את הקרב על קירות מקדשיו כניצחון מזהיר, וזו אחת התעמולות הקדומות שנשמרו בכתב.",
     ar:"وصف رمسيس المعركة على جدران معابده نصرًا باهرًا، وهذه من أقدم الدعايات المحفوظة كتابةً.",
     ru:"Рамсес изобразил битву на стенах своих храмов как блистательную победу — один из древнейших сохранившихся образцов пропаганды.",
     en:"Ramesses described the battle on the walls of his temples as a brilliant victory, one of the oldest surviving pieces of propaganda in writing."}),
  C({he:"ספר המתים",ar:"كتاب الموتى",ru:"Книга мёртвых",en:"The Book of the Dead"},
    {he:"אוסף לחשים והוראות שהונח בקבר המצרי, ובו הסבר כיצד לעבור את משפט הנפש ולהגיע לעולם הבא.",
     ar:"مجموعة تعاويذ وتعليمات وُضعت في القبر المصري، فيها بيان كيف يُجتاز حساب الروح ويُبلغ العالم الآخر.",
     ru:"Собрание заклинаний и наставлений, которое клали в египетскую гробницу, с указаниями, как пройти суд души и достичь загробного мира.",
     en:"A collection of spells and instructions placed in an Egyptian tomb, telling how to pass the judgement of the soul and reach the next world."}),
  C({he:"אבן רוזטה",ar:"حجر رشيد",ru:"Розеттский камень",en:"The Rosetta Stone"},
    {he:"לוח אבן שנמצא במצרים ועליו אותו טקסט בשלושה כתבים, ובעזרתו פוענחו ההירוגליפים אחרי אלף וחמש מאות שנה.",
     ar:"لوح حجري وُجد في مصر عليه النصّ ذاته بثلاث كتابات، وبه فُكّت رموز الهيروغليفية بعد ألف وخمسمئة سنة.",
     ru:"Каменная плита, найденная в Египте, с одним и тем же текстом в трёх видах письма; с её помощью иероглифы были прочтены спустя полторы тысячи лет.",
     en:"A stone slab found in Egypt bearing the same text in three scripts, by which the hieroglyphs were deciphered after fifteen hundred years."}),
  Sc({he:["שלום לך, אל גדול, אדון הצדק והאמת.",
          "לא עשקתי עני, לא הרעבתי איש ולא הבכיתי איש.",
          "לא רצחתי ולא ציוויתי לרצוח.",
          "לא הסטתי את משקל המאזניים ולא גזלתי חלב מפי התינוק.",
          "מתוך ספר המתים המצרי, וידוי הניקיון לפני משפט הנפש."],
      ar:["السلام لك، أيّها الإله العظيم، ربّ العدل والحقّ.",
          "لم أظلم فقيرًا، ولم أُجِع أحدًا، ولم أُبكِ أحدًا.",
          "لم أقتل ولم آمر بالقتل.",
          "لم أُمِل كفّة الميزان، ولم أنتزع اللبن من فم الرضيع.",
          "من كتاب الموتى المصري، اعتراف الطهارة أمام حساب الروح."],
      ru:["Привет тебе, великий бог, владыка правды и истины.",
          "Я не притеснял бедного, не морил никого голодом и никого не доводил до слёз.",
          "Я не убивал и не приказывал убивать.",
          "Я не склонял чаши весов и не отнимал молока от уст младенца.",
          "Из египетской Книги мёртвых, исповедь чистоты перед судом души."],
      en:["Hail to you, great god, lord of justice and truth.",
          "I have not oppressed the poor, I have not starved anyone, I have not made anyone weep.",
          "I have not killed, nor ordered killing.",
          "I have not tipped the scales, nor taken the milk from the mouth of an infant.",
          "From the Egyptian Book of the Dead, the declaration of purity before the judgement of the soul."]},
     [Q({he:"מה נדרש מן המת כדי לעבור את המשפט, לפי המקור?",ar:"ماذا يُطلب من الميت لاجتياز الحساب، بحسب المصدر؟",ru:"Что требуется от умершего, чтобы пройти суд, согласно источнику?",en:"What is required of the dead to pass the judgement, according to the source?"},
        {he:"להצהיר שנהג בצדק כלפי החלשים ולא פגע בהם בחייו.",ar:"أن يعلن أنه عدل مع الضعفاء ولم يؤذهم في حياته.",ru:"Объявить, что он поступал справедливо со слабыми и не причинял им зла при жизни.",en:"To declare that he dealt justly with the weak and did them no harm in his life."},
        [{he:"להביא מנחות עשירות ולהוכיח שהיה אדם אמיד.",ar:"أن يقدّم قرابين غنيّة ويثبت أنه كان موسرًا.",ru:"Принести богатые дары и доказать, что он был состоятелен.",en:"To bring rich offerings and to prove that he was a wealthy man."},
         {he:"להוכיח שהיה קרוב משפחה של הפרעה.",ar:"أن يثبت أنه من أقرباء الفرعون.",ru:"Доказать, что он был родственником фараона.",en:"To prove that he was a relative of the pharaoh."},
         {he:"להוכיח שנלחם באויבי מצרים ושב מנצח.",ar:"أن يثبت أنه قاتل أعداء مصر وعاد منتصرًا.",ru:"Доказать, что он воевал с врагами Египта и вернулся с победой.",en:"To prove that he fought Egypt's enemies and came back victorious."}]),
