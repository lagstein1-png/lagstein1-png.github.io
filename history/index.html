     ru:"Покровительствуемый: христианин или еврей в мусульманском государстве, получавший защиту и свободу культа и плативший особый налог.",
     en:"A protected subject: a Christian or Jew in a Muslim state, who received protection and freedom of worship and paid a special tax."})
 ],
 [
  E(1258,
    {he:"המונגולים כובשים את בגדאד",ar:"المغول يجتاحون بغداد",ru:"Монголы берут Багдад",en:"The Mongols take Baghdad"},
    {he:"צבא מונגולי הרס את בגדאד והרג את הח׳ליף האחרון לבית עבאס.",
     ar:"دمّر جيش مغولي بغداد وقتل آخر الخلفاء العباسيين.",
     ru:"Монгольское войско разрушило Багдад и убило последнего аббасидского халифа.",

    {he:"התפשטות האימפריה המונגולית מערבה, ואי־יכולתה של ח׳ליפות מפורדת להתגונן.",
     ar:"توسّع الإمبراطورية المغولية غربًا، وعجز خلافة مفكّكة عن الدفاع.",
     ru:"Расширение Монгольской империи на запад и неспособность раздробленного халифата защититься.",
     en:"The Mongol empire's expansion westwards, and the inability of a fragmented caliphate to defend itself."},
    {he:"מרכז הכובד של העולם המוסלמי עבר למצרים, ומאוחר יותר לאימפריה העות׳מאנית.",
     ar:"انتقل مركز ثقل العالم الإسلامي إلى مصر، ثم لاحقًا إلى الدولة العثمانية.",
     ru:"Центр тяжести мусульманского мира переместился в Египет, а позже — в Османскую империю.",
     en:"The centre of gravity of the Muslim world moved to Egypt, and later to the Ottoman empire."}),
  C({he:"שריעה",ar:"الشريعة",ru:"Шариат",en:"Sharia"},
    {he:"מכלול ההלכה המוסלמית, הנשענת על הקוראן, על מסורת הנביא ועל פרשנות החכמים.",
     ar:"مجموع الأحكام الإسلامية، المستندة إلى القرآن وسنّة النبي واجتهاد العلماء.",
     ru:"Совокупность мусульманского права, опирающегося на Коран, предание о Пророке и толкования учёных.",
     en:"The body of Muslim law, resting on the Quran, the tradition of the Prophet and the interpretation of the scholars."}),
  C({he:"בית החכמה",ar:"بيت الحكمة",ru:"Дом мудрости",en:"The House of Wisdom"},
    {he:"מרכז לימוד ותרגום בבגדאד, שבו הועברו לערבית כתבים מיוונית, מפרסית ומהודית.",
     ar:"مركز للعلم والترجمة في بغداد، نُقلت فيه إلى العربية كتب من اليونانية والفارسية والهندية.",
     ru:"Центр учёности и перевода в Багдаде, где на арабский переводили сочинения с греческого, персидского и индийского.",
     en:"A centre of study and translation in Baghdad, where works were rendered into Arabic from Greek, Persian and Indian."}),
  Sc({he:["בבגדאד הוקם בית החכמה, ובו תורגמו ספרים מיוונית, מפרסית ומהודית.",
          "מלומדים מוסלמים, נוצרים ויהודים עבדו בו זה לצד זה.",
          "אלח׳ואריזמי כתב שם ספר על פתרון משוואות, ומשמו נגזרה המילה אלגוריתם.",
          "הספרות שהגיעו מהודו קיבלו את הצורה שאירופה תאמץ מאות שנים אחר כך."],
      ar:["أُنشئ في بغداد بيت الحكمة، وتُرجمت فيه كتب من اليونانية والفارسية والهندية.",
          "عمل فيه علماء مسلمون ومسيحيون ويهود جنبًا إلى جنب.",
          "كتب الخوارزمي هناك كتابًا في حلّ المعادلات، ومن اسمه اشتُقّت كلمة خوارزمية.",
          "والأرقام التي جاءت من الهند أخذت الشكل الذي ستتبنّاه أوروبا بعد قرون."],
      ru:["В Багдаде был основан Дом мудрости, где переводили книги с греческого, персидского и индийского.",
          "В нём работали бок о бок мусульманские, христианские и еврейские учёные.",
          "Аль-Хорезми написал там книгу о решении уравнений, и от его имени произошло слово «алгоритм».",
          "А цифры, пришедшие из Индии, приняли тот вид, который Европа переймёт столетия спустя."],
      en:["In Baghdad the House of Wisdom was founded, where books were translated from Greek, Persian and Indian.",
          "Muslim, Christian and Jewish scholars worked in it side by side.",
          "Al-Khwarizmi wrote there a book on solving equations, and from his name came the word algorithm.",
          "And the numerals that came from India took the form Europe would adopt centuries later."]},
     [Q({he:"מה מלמד המקור על הידע באותה תקופה?",ar:"ماذا يعلّمنا المصدر عن المعرفة في تلك الحقبة؟",ru:"Что источник говорит о знании в ту эпоху?",en:"What does the source show about knowledge in that period?"},
        {he:"ידע עבר בין תרבויות ושפות, ונשמר ופותח בבגדאד.",ar:"أن المعرفة انتقلت بين الثقافات واللغات، وحُفظت وطُوّرت في بغداد.",ru:"Что знание переходило между культурами и языками и сохранялось и развивалось в Багдаде.",en:"That knowledge moved between cultures and languages, and was preserved and developed in Baghdad."},
        [{he:"כל תרבות פיתחה מדע לעצמה, בנפרד מן התרבויות האחרות.",ar:"كل ثقافة طوّرت العلم لنفسها، بمعزل عن الثقافات الأخرى.",ru:"Каждая культура развивала науку сама по себе, отдельно от других культур.",en:"Each culture developed its own science, apart from the other cultures."},
         {he:"כל הידע היווני אבד בלי שריד ולא הועבר לדורות שאחריו.",ar:"كل المعرفة اليونانية ضاعت دون أثر ولم تُنقل إلى الأجيال التي تلتها.",ru:"Всё греческое знание пропало без следа и не перешло ни к каким следующим поколениям после него.",en:"All of the Greek knowledge was lost without trace and was not passed on to the later generations."},
         {he:"רק מוסלמים הורשו לעסוק במדע בעיר בגדאד.",ar:"المسلمون وحدهم سُمح لهم بالاشتغال بالعلم في مدينة بغداد.",ru:"Заниматься наукой в городе Багдаде позволялось одним лишь мусульманам.",en:"Only Muslims were permitted to take part in any science in the city of Baghdad."}],
        [{he:"המקור מתאר תרגום מיוונית, מפרסית ומהודית.",ar:"المصدر يصف ترجمة من اليونانية والفارسية والهندية.",ru:"Источник описывает переводы с греческого, персидского и индийского.",en:"The source describes translation from Greek, Persian and Indian."},
         {he:"המקור אומר שספרים יווניים תורגמו בבית החכמה.",ar:"المصدر يقول إن كتبًا يونانية تُرجمت في بيت الحكمة.",ru:"Источник говорит, что греческие книги переводили в Доме мудрости.",en:"The source says Greek books were translated in the House of Wisdom."},
         {he:"בבית החכמה עבדו יחד מוסלמים, נוצרים ויהודים.",ar:"في بيت الحكمة عمل معًا مسلمون ومسيحيون ويهود.",ru:"В Доме мудрости вместе работали мусульмане, христиане и иудеи.",en:"In the House of Wisdom Muslims, Christians and Jews worked together."}]),
      Q({he:"מהיכן הגיעה המילה ״אלגוריתם״?",ar:"من أين جاءت كلمة «خوارزمية»؟",ru:"Откуда пришло слово «алгоритм»?",en:"Where does the word \"algorithm\" come from?"},
        {he:"משמו של מלומד שפעל בבגדאד וכתב על פתרון משוואות.",ar:"من اسم عالم عمل في بغداد وكتب في حلّ المعادلات.",ru:"От имени учёного, работавшего в Багдаде и писавшего о решении уравнений.",en:"From the name of a scholar who worked in Baghdad and wrote on solving equations."},
        [{he:"מהשפה היוונית העתיקה, מהמילה ״מספר״ שבפי המתמטיקאים.",ar:"من اللغة اليونانية القديمة، من كلمة «عدد» عند الرياضيين.",ru:"Из древнегреческого языка, от слова «число», которое было в устах математиков.",en:"From the ancient Greek language, from the word number that was used by mathematicians."},
         {he:"מלטינית של ימי הביניים, משם של ספר לימוד אחד ישן מאוד.",ar:"من لاتينية العصور الوسطى، من اسم كتاب تعليمي قديم جدًا.",ru:"Из средневековой латыни, от названия одного очень старого школьного учебника.",en:"From medieval Latin, taken from the title of one very old school textbook of the time."},
         {he:"משמו של מתמטיקאי אירופי שפעל במאה ה-19.",ar:"من اسم عالم رياضيات أوروبي من القرن الـ19.",ru:"От имени европейского математика, который жил и работал в 19 веке.",en:"From the name of a European mathematician who worked in the 19th century."}],
        [{he:"המקור אומר במפורש שהמילה נגזרה משם של אדם.",ar:"المصدر يقول صراحةً إن الكلمة اشتُقّت من اسم شخص.",ru:"Источник прямо говорит, что слово произошло от имени человека.",en:"The source says plainly that the word came from a person's name."},
         {he:"הצורה הלטינית באה אחר כך, והיא אינה המקור.",ar:"الصيغة اللاتينية جاءت لاحقًا، وليست هي الأصل.",ru:"Латинская форма появилась позже и не является источником.",en:"The Latin form came later, and it is not the origin."},
         {he:"המילה עתיקה בהרבה, ומקורה בבגדאד של המאה ה-9.",ar:"الكلمة أقدم بكثير، وأصلها في بغداد القرن التاسع.",ru:"Слово намного древнее, и родом оно из Багдада 9 века.",en:"The word is far older, and comes from 9th century Baghdad."}])])
 ]
]);

topic("jewsmid","mid",
  {he:"יהודי אירופה בימי הביניים",ar:"يهود أوروبا في العصور الوسطى",ru:"Евреи Европы в Средние века",en:"The Jews of medieval Europe"},
  {he:"קהילה, חסות מלכותית, עלילות וגירושים — ומה שהתחלף ביניהם",
   ar:"جماعة وحماية ملكية وافتراءات وطرد — وما تبدّل بينها",
   ru:"Община, королевская защита, наветы и изгнания — и что между ними менялось",
   en:"Community, royal protection, blood libels and expulsions — and what shifted between them"},
[
 [ /* רמה 1 */
  E(1096,
    {he:"פרעות תתנ״ו בקהילות הריין",ar:"مذابح جماعات الراين",ru:"Погромы в общинах Рейна",en:"The Rhineland massacres"},
    {he:"המונים שיצאו למסע הצלב הראשון תקפו בדרכם את קהילות וורמס, מגנצא וקלן, והרגו אלפי יהודים.",
     ar:"هاجمت جموع خرجت في الحملة الصليبية الأولى في طريقها جماعات فورمس وماينتس وكولونيا، وقتلت آلاف اليهود.",
     ru:"Толпы, отправившиеся в первый крестовый поход, по дороге напали на общины Вормса, Майнца и Кёльна и убили тысячи евреев.",
     en:"Mobs setting out on the First Crusade attacked the communities of Worms, Mainz and Cologne on their way, and killed thousands of Jews."},
    {he:"ההטפה למלחמה בכופרים במרחק הופנתה אל מי שנחשב כופר קרוב, והשלטונות המקומיים לא עצרו את ההמון בזמן.",
     ar:"وُجّهت الدعوة لقتال الكفّار البعيدين نحو من عُدّ كافرًا قريبًا، ولم توقف السلطات المحلية الجموع في حينها.",
     ru:"Призыв воевать с иноверцами вдали обратился против тех, кого сочли иноверцами рядом, а местные власти не остановили толпу вовремя.",
     en:"The call to fight unbelievers far away was turned against those seen as unbelievers close by, and the local authorities did not stop the mob in time."},
    {he:"התברר שחסות המלך והבישוף אינה מגינה כשההמון קם, והמרכז היהודי החל לנוע מזרחה לפולין.",
     ar:"تبيّن أن حماية الملك والأسقف لا تحمي حين تهبّ الجموع، وبدأ المركز اليهودي ينتقل شرقًا إلى بولندا.",
     ru:"Стало ясно, что защита короля и епископа не спасает, когда поднимается толпа, и еврейский центр начал смещаться на восток, в Польшу.",
     en:"It became clear that the protection of king and bishop did not hold when the mob rose, and the Jewish centre began moving east into Poland."}),
  E(1144,
    {he:"עלילת הדם בנוריץ׳",ar:"افتراء الدم في نورويتش",ru:"Кровавый навет в Норидже",en:"The blood libel at Norwich"},
    {he:"נער נמצא מת בעיר האנגלית נוריץ׳, ולראשונה הועלתה הטענה שיהודים רצחו ילד נוצרי לצורכי פולחן.",
     ar:"وُجد صبيّ ميتًا في مدينة نورويتش الإنجليزية، ولأوّل مرّة أُثيرت دعوى أن اليهود قتلوا طفلًا مسيحيًّا لطقوسهم.",
     ru:"В английском городе Норидж нашли мёртвого мальчика, и впервые прозвучало обвинение, будто евреи убили христианского ребёнка для обряда.",
     en:"A boy was found dead in the English town of Norwich, and for the first time the claim was raised that Jews had killed a Christian child for a ritual."},
    {he:"היהודים חיו נפרדים ומנהגיהם לא היו מוכרים לשכניהם, וכל מוות בלתי מוסבר קיבל פירוש עוין.",
     ar:"عاش اليهود منفصلين ولم تكن عاداتهم معروفة لجيرانهم، فنال كلّ موت غامض تفسيرًا عدائيًّا.",
     ru:"Евреи жили обособленно, и их обычаи были неизвестны соседям, так что всякая необъяснённая смерть получала враждебное толкование.",
     en:"The Jews lived apart and their customs were unknown to their neighbours, so any unexplained death was given a hostile reading."},
    {he:"האשמה חזרה ונשנתה במאות הבאות בכל אירופה, והיא הצדיקה מעצרים, שריפות וגירושים.",
     ar:"تكرّرت التهمة في القرون التالية في أنحاء أوروبا، وبرّرت اعتقالات وحرقًا وطردًا.",
     ru:"Обвинение повторялось в следующие века по всей Европе и служило оправданием арестам, казням на костре и изгнаниям.",
     en:"The accusation was repeated across Europe in the centuries that followed, and it served to justify arrests, burnings and expulsions."}),
  E(1215,
    {he:"ועידת לטראן הרביעית",ar:"مجمع لاتران الرابع",ru:"Четвёртый Латеранский собор",en:"The Fourth Lateran Council"},
    {he:"הוועידה הכנסייתית הגדולה חייבה יהודים ומוסלמים לשאת סימן בבגדם, ואסרה עליהם לשאת משרות ציבוריות.",
     ar:"ألزم المجمع الكنسي الكبير اليهود والمسلمين بحمل علامة في لباسهم، ومنعهم من تولّي الوظائف العامة.",
     ru:"Большой церковный собор обязал евреев и мусульман носить знак на одежде и запретил им занимать государственные должности.",
     en:"The great church council required Jews and Muslims to wear a mark on their clothing, and barred them from public office."},
    {he:"הכנסייה ביקשה לחסום מגע יומיומי בין נוצרים לשאינם נוצרים, וטענה שאי אפשר להבחין ביניהם ברחוב.",
     ar:"أرادت الكنيسة سدّ الاختلاط اليومي بين المسيحيين وغيرهم، وادّعت أنه لا يمكن تمييزهم في الشارع.",
     ru:"Церковь стремилась пресечь повседневное общение христиан с нехристианами, утверждая, что на улице их не отличить.",
     en:"The Church sought to block everyday contact between Christians and non-Christians, arguing that they could not be told apart in the street."},
    {he:"ההפרדה נעשתה חוק גלוי ולא מנהג מקומי, וסימן הבגד חזר בגרמניה הנאצית שבע מאות שנה אחר כך.",
     ar:"صارت الفصل قانونًا معلنًا لا عرفًا محلّيًّا، وعادت علامة اللباس في ألمانيا النازية بعد سبعمئة سنة.",
     ru:"Разделение стало открытым законом, а не местным обычаем, и знак на одежде вернулся в нацистской Германии семьсот лет спустя.",
     en:"Separation became open law rather than local custom, and the clothing mark returned in Nazi Germany seven hundred years later."}),
  C({he:"קהילה",ar:"الجماعة اليهودية",ru:"Кегила — еврейская община",en:"Kehilla — the Jewish community"},
    {he:"ארגון היהודים בעיר אחת, שגבה מיסים משלו וניהל בית כנסת, בית דין, בית ספר וקופת צדקה.",
     ar:"تنظيم اليهود في مدينة واحدة، يجبي ضرائبه الخاصة ويدير كنيسًا ومحكمة ومدرسة وصندوق صدقة.",
     ru:"Организация евреев одного города, которая собирала собственные налоги и содержала синагогу, суд, школу и кассу помощи.",
     en:"The organisation of the Jews of one town, which raised its own taxes and ran a synagogue, a court, a school and a charity fund."})
 ],
 [ /* רמה 2 */
  E(1242,
    {he:"שריפת התלמוד בפריז",ar:"إحراق التلمود في باريس",ru:"Сожжение Талмуда в Париже",en:"The burning of the Talmud in Paris"},
    {he:"אחרי ויכוח פומבי שנכפה על חכמי צרפת, הוצאו עשרות עגלות של כתבי יד תלמודיים לכיכר ונשרפו.",
     ar:"بعد مناظرة علنية فُرضت على حكماء فرنسا، أُخرجت عشرات العربات من مخطوطات التلمود إلى الساحة وأُحرقت.",
     ru:"После публичного диспута, навязанного мудрецам Франции, десятки телег с талмудическими рукописями вывезли на площадь и сожгли.",
     en:"After a public disputation forced on the sages of France, dozens of cartloads of Talmud manuscripts were taken to the square and burned."},
    {he:"מומר האשים שהתלמוד מכיל דברי גידוף על הנצרות, והמלך קיבל את הטענה ומינה ועדת שופטים.",
     ar:"اتّهم مرتدّ التلمود بأنه يحوي سبابًا للمسيحية، فقبل الملك الدعوى وعيّن لجنة قضاة.",
     ru:"Выкрест обвинил Талмуд в хуле на христианство, король принял обвинение и назначил судейскую комиссию.",
     en:"A convert charged that the Talmud contained abuse of Christianity, the king accepted the charge and appointed a panel of judges."},
    {he:"לראשונה הועמד ספר לדין ולא אדם, ולימוד התורה באירופה נפגע לדורות בשל אובדן כתבי היד.",
     ar:"لأوّل مرّة حوكم كتاب لا إنسان، وتضرّر تعليم التوراة في أوروبا أجيالًا بسبب ضياع المخطوطات.",
     ru:"Впервые судили книгу, а не человека, и изучение Торы в Европе пострадало на поколения из-за утраты рукописей.",
     en:"For the first time a book rather than a person was put on trial, and Torah study in Europe suffered for generations from the loss of the manuscripts."}),
  E(1290,
    {he:"גירוש יהודי אנגליה",ar:"طرد يهود إنجلترا",ru:"Изгнание евреев из Англии",en:"The expulsion of the Jews from England"},
    {he:"המלך אדוארד הראשון הורה לכל יהודי אנגליה לעזוב בתוך חודשים, ורכושם ושטרות החוב שבידיהם עברו לכתר.",
     ar:"أمر الملك إدوارد الأول كلّ يهود إنجلترا بالمغادرة خلال أشهر، وانتقلت أملاكهم وسندات ديونهم إلى التاج.",
     ru:"Король Эдуард I приказал всем евреям Англии уехать в считаные месяцы, а их имущество и долговые расписки перешли короне.",
     en:"King Edward I ordered every Jew in England to leave within months, and their property and the debts owed to them passed to the crown."},
    {he:"המלך היה שקוע בחובות, וגביית מיסים מהיהודים כבר מיצתה את עצמה — גירושם היה זול יותר מהגנתם.",
     ar:"كان الملك غارقًا في الديون، وكانت جباية الضرائب من اليهود قد استُنفدت — فصار طردهم أرخص من حمايتهم.",
     ru:"Король был в долгах, а налоги с евреев уже были выжаты до предела — изгнать их оказалось дешевле, чем защищать.",
     en:"The king was deep in debt, and taxing the Jews had already been pushed to its limit — expelling them was cheaper than protecting them."},
    {he:"אנגליה נותרה בלי קהילה יהודית כשלוש מאות ושישים שנה, וזה היה הגירוש הארצי הראשון באירופה.",
     ar:"بقيت إنجلترا بلا جماعة يهودية نحو ثلاثمئة وستين سنة، وكان ذلك أوّل طرد على مستوى دولة في أوروبا.",
     ru:"Англия осталась без еврейской общины около трёхсот шестидесяти лет, и это было первое изгнание в масштабе целой страны в Европе.",
     en:"England was left without a Jewish community for some three hundred and sixty years, and it was the first country-wide expulsion in Europe."}),
  E(1349,
    {he:"פרעות בעקבות המגפה",ar:"مذابح في أعقاب الطاعون",ru:"Погромы вслед за чумой",en:"The pogroms that followed the plague"},
    {he:"בעשרות ערים בגרמניה ובשווייץ הואשמו יהודים בהרעלת בארות, נעצרו תחת עינויים ונשרפו קהילות שלמות.",
     ar:"في عشرات المدن في ألمانيا وسويسرا اتُّهم اليهود بتسميم الآبار، واعتُقلوا تحت التعذيب وأُحرقت جماعات بأكملها.",
     ru:"В десятках городов Германии и Швейцарии евреев обвинили в отравлении колодцев, арестовывали под пытками и сжигали целые общины.",
     en:"In dozens of towns in Germany and Switzerland Jews were accused of poisoning wells, arrested under torture, and whole communities were burned."},
    {he:"המגפה קטלה שליש מאירופה בלי שאיש הבין את סיבתה, ואנשים חיפשו אשם שאפשר להצביע עליו.",
     ar:"أهلك الطاعون ثلث أوروبا دون أن يفهم أحد سببه، فبحث الناس عن مذنب يمكن الإشارة إليه.",
     ru:"Чума выкосила треть Европы, а причины никто не понимал, и люди искали виновного, на которого можно указать.",
     en:"The plague killed a third of Europe with no one understanding its cause, and people looked for a culprit they could point at."},
    {he:"למעלה ממאה קהילות נמחקו, והניצולים נמלטו מזרחה — כך נעשתה פולין למרכז היהודי הגדול באירופה.",
     ar:"مُحيت أكثر من مئة جماعة، وفرّ الناجون شرقًا — وهكذا صارت بولندا المركز اليهودي الأكبر في أوروبا.",
     ru:"Более ста общин были стёрты, а уцелевшие бежали на восток — так Польша стала крупнейшим еврейским центром Европы.",
     en:"More than a hundred communities were wiped out, and the survivors fled east — and so Poland became the largest Jewish centre in Europe."}),
  C({he:"אות מבדל",ar:"شارة التمييز",ru:"Отличительный знак",en:"The distinguishing badge"},
    {he:"סימן בצבע או בצורה שיהודים חויבו לתפור על בגדם, כדי שיהיו ניכרים למרחוק ברחוב.",
     ar:"علامة بلون أو شكل أُلزم اليهود بخياطتها على لباسهم، ليُعرفوا من بعيد في الشارع.",
     ru:"Метка цветом или формой, которую евреев обязывали нашивать на одежду, чтобы их узнавали издалека на улице.",
     en:"A mark of colour or shape that Jews were required to sew onto their clothes, so that they could be told from a distance in the street."})
 ],
 [ /* רמה 3 */
  E(1516,
    {he:"הקמת גטו ונציה",ar:"إنشاء غيتو البندقية",ru:"Создание венецианского гетто",en:"The founding of the Venice ghetto"},
    {he:"מועצת ונציה ריכזה את יהודי העיר באי אחד, סגרה את שעריו בלילה והציבה עליהם שומרים ששכרם שולם בידי היהודים.",
     ar:"جمع مجلس البندقية يهود المدينة في جزيرة واحدة، وأغلق بواباتها ليلًا، ووضع عليها حرّاسًا يدفع اليهود أجرهم.",
     ru:"Совет Венеции собрал евреев города на одном островке, запирал его ворота на ночь и поставил стражу, которой платили сами евреи.",
     en:"The council of Venice gathered the city's Jews onto a single island, locked its gates at night and posted guards whose wages the Jews themselves paid."},
    {he:"העיר רצתה את הסוחרים והמלווים היהודים ואת המס שגבתה מהם, אך לא רצתה שיגורו בין הנוצרים.",
     ar:"أرادت المدينة التجّار والمقرضين اليهود والضريبة التي تجبيها منهم، لكنها لم ترد أن يسكنوا بين المسيحيين.",
     ru:"Город хотел еврейских купцов и заимодавцев и налог с них, но не хотел, чтобы они жили среди христиан.",
     en:"The city wanted the Jewish merchants and lenders and the tax it drew from them, but did not want them living among Christians."},
    {he:"נולד הדגם של רובע יהודי סגור בחוק, והמילה גטו יצאה מוונציה לכל אירופה.",
     ar:"وُلد نموذج الحيّ اليهودي المغلق بالقانون، وخرجت كلمة غيتو من البندقية إلى أوروبا كلّها.",
     ru:"Родился образец еврейского квартала, запертого по закону, и слово «гетто» ушло из Венеции по всей Европе.",
     en:"The model of a Jewish quarter closed by law was born, and the word ghetto went out from Venice to all of Europe."}),
  C({he:"גטו",ar:"غيتو",ru:"Гетто",en:"Ghetto"},
    {he:"רובע נפרד שהיהודים חויבו לגור בו ולא הורשו לצאת ממנו בלילה, בגבולות שנקבעו בחוק.",
     ar:"حيّ منفصل أُلزم اليهود بالسكن فيه ومُنعوا من الخروج منه ليلًا، بحدود حدّدها القانون.",
     ru:"Отдельный квартал, в котором евреи были обязаны жить и откуда не могли выходить ночью, с границами, установленными законом.",
     en:"A separate quarter that Jews were required to live in and could not leave at night, with boundaries fixed by law."}),
  C({he:"אנוסים",ar:"المتحوّلون قسرًا",ru:"Анусим — насильно крещённые",en:"Anusim — the forcibly converted"},
    {he:"יהודים שהוטבלו לנצרות בכפייה או מפחד מוות, ורבים מהם המשיכו לקיים מצוות בסתר.",
     ar:"يهود عُمّدوا إلى المسيحية قسرًا أو خوف الموت، وواصل كثير منهم أداء الفرائض سرًّا.",
     ru:"Евреи, крещённые силой или под страхом смерти, многие из которых продолжали тайно соблюдать заповеди.",
     en:"Jews baptised into Christianity by force or under fear of death, many of whom went on keeping the commandments in secret."}),
  Sc({he:["ידוע לנו שבממלכתנו יש נוצרים רעים אשר התייהדו ופרשו מאמונתנו הקדושה,",
          "והסיבה לכך היא המגע בין היהודים לנוצרים.",
          "על כן אנו מצווים על כל היהודים, גברים ונשים, לצאת מכל ממלכותינו",
          "עד סוף חודש יולי הבא, ולא לשוב אליהן לעולם.",
          "מתוך צו הגירוש של פרדיננד ואיזבלה, ספרד, 1492."],
      ar:["نعلم أن في مملكتنا مسيحيين سيّئين تهوّدوا وارتدّوا عن إيماننا المقدّس،",
          "وسبب ذلك هو الاختلاط بين اليهود والمسيحيين.",
          "لذلك نأمر كلّ اليهود، رجالًا ونساءً، بالخروج من جميع ممالكنا",
          "حتى نهاية شهر تموز القادم، وألّا يعودوا إليها أبدًا.",
          "من مرسوم الطرد لفرديناند وإيزابيلا، إسبانيا، 1492."],
      ru:["Нам известно, что в нашем королевстве есть дурные христиане, которые обратились в иудейство и отпали от нашей святой веры,",
          "и причина тому — общение между евреями и христианами.",
          "Посему мы повелеваем всем евреям, мужчинам и женщинам, покинуть все наши королевства",
          "до конца будущего июля и никогда в них не возвращаться.",
          "Из указа об изгнании Фердинанда и Изабеллы, Испания, 1492 год."],
      en:["We are informed that in our kingdom there are bad Christians who have judaised and fallen away from our holy faith,",
          "and the cause of this is the contact between Jews and Christians.",
          "We therefore command all Jews, men and women, to depart from all our kingdoms",
          "by the end of this coming July, and never to return to them.",
          "From the edict of expulsion of Ferdinand and Isabella, Spain, 1492."]},
     [Q({he:"מה הנימוק שהצו עצמו נותן לגירוש?",ar:"ما التعليل الذي يقدّمه المرسوم نفسه للطرد؟",ru:"Какое обоснование изгнания даёт сам указ?",en:"What reason does the edict itself give for the expulsion?"},
        {he:"שהמגע בין יהודים לנוצרים מחזיר מומרים ליהדות, ולכן יש להרחיק את היהודים.",ar:"أن الاختلاط بين اليهود والمسيحيين يعيد المتحوّلين إلى اليهودية، فوجب إبعاد اليهود.",ru:"Что общение евреев с христианами возвращает выкрестов в иудейство, а потому евреев надо удалить.",en:"That contact between Jews and Christians draws converts back to Judaism, and so the Jews must be removed."},
        [{he:"שהיהודים סירבו לשלם את המס שהוטל עליהם.",ar:"أن اليهود رفضوا دفع الضريبة المفروضة عليهم.",ru:"Что евреи отказались платить наложенный на них налог.",en:"That the Jews refused to pay the tax laid upon them."},
         {he:"שהיהודים תמכו באויב שנלחם בממלכה.",ar:"أن اليهود ساندوا عدوًّا يحارب المملكة.",ru:"Что евреи поддержали врага, воевавшего с королевством.",en:"That the Jews supported an enemy at war with the kingdom."},
         {he:"שהיהודים ביקשו בעצמם לעזוב את ספרד.",ar:"أن اليهود أنفسهم طلبوا مغادرة إسبانيا.",ru:"Что евреи сами просили покинуть Испанию.",en:"That the Jews themselves asked to leave Spain."}]),
      Q({he:"במי מכוון הצו לטפל, לפי ניסוחו?",ar:"بمن يقصد المرسوم أن يعالج، بحسب صياغته؟",ru:"На кого, судя по формулировке, направлен указ?",en:"Whom is the edict, by its own wording, trying to deal with?"},
        {he:"בנוצרים החדשים ששבו ליהדות — והיהודים מגורשים כדי לנתקם מהם.",ar:"بالمسيحيين الجدد الذين عادوا إلى اليهودية — ويُطرد اليهود لقطع الصلة بهم.",ru:"На новых христиан, вернувшихся в иудейство, — а евреев изгоняют, чтобы отрезать их от них.",en:"With the new Christians who had returned to Judaism — and the Jews are expelled in order to cut them off from them."},
        [{he:"במוסלמים שנשארו בגרנדה אחרי כיבושה.",ar:"بالمسلمين الذين بقوا في غرناطة بعد فتحها.",ru:"На мусульман, оставшихся в Гранаде после её взятия.",en:"With the Muslims who remained in Granada after its capture."},
         {he:"בסוחרים זרים שהתחרו בסוחרי ספרד.",ar:"بالتجّار الأجانب الذين نافسوا تجّار إسبانيا.",ru:"На иностранных купцов, соперничавших с испанскими.",en:"With foreign merchants who competed with the traders of Spain."},
         {he:"בכמרים שהתנגדו לשלטון המלוכה.",ar:"بالقساوسة الذين عارضوا حكم الملكية.",ru:"На священников, противившихся королевской власти.",en:"With priests who opposed the rule of the crown."}])])
 ]
]);

topic("renaissance","mid",
  {he:"רנסאנס וגילויים",ar:"النهضة والاكتشافات",ru:"Возрождение и открытия",en:"Renaissance and discovery"},
  {he:"דפוס, עולם חדש, רפורמציה ותחילת המדע",
   ar:"الطباعة والعالم الجديد والإصلاح وبداية العلم",
   ru:"Книгопечатание, Новый Свет, Реформация и начало науки",
   en:"Printing, a new world, the Reformation and the start of science"},
[
 [
  E(1440,
    {he:"המצאת הדפוס",ar:"اختراع الطباعة",ru:"Изобретение книгопечатания",en:"The invention of printing"},
    {he:"יוהנס גוטנברג פיתח בית דפוס עם אותיות מתכת נעות, והדפיס בו ספרים שלמים.",
     ar:"طوّر يوهانس غوتنبرغ مطبعة بحروف معدنية متحركة، وطبع بها كتبًا كاملة.",
     ru:"Иоганн Гутенберг создал печатный станок с подвижными металлическими литерами и напечатал на нём целые книги.",
     en:"Johannes Gutenberg developed a press with movable metal type, and printed whole books with it."},
    {he:"הביקוש לספרים גדל באוניברסיטאות ובערי הסחר, והעתקה ביד הייתה איטית ויקרה מאוד.",

    {he:"ספר חדל להיות נדיר; רעיונות התפשטו במהירות, והאוריינות הלכה וגדלה.",

     en:"A book stopped being rare; ideas spread quickly, and literacy grew."}),
  E(1492,
    {he:"קולומבוס מגיע לאמריקה",ar:"وصول كولومبوس إلى أمريكا",ru:"Колумб достигает Америки",en:"Columbus reaches America"},
    {he:"משלחת בפיקוד קולומבוס הפליגה מספרד מערבה והגיעה לאיים בים הקריבי.",

     ru:"Экспедиция под началом Колумба отплыла из Испании на запад и достигла островов в Карибском море.",

    {he:"החיפוש אחר דרך ים להודו אחרי שנחסמה הדרך היבשתית, ותמיכתם של מלכי ספרד.",
     ar:"البحث عن طريق بحري إلى الهند بعد انسداد الطريق البرّي، ودعم ملكَي إسبانيا.",

    {he:"נפתח ״העולם החדש״ לאירופה — ואיתו כיבוש, מחלות והרס של תרבויות הילידים.",

     en:"The \"New World\" opened to Europe — and with it conquest, disease and the destruction of native cultures."}),
  E(1517,
    {he:"לותר ותחילת הרפורמציה",ar:"لوثر وبداية الإصلاح",ru:"Лютер и начало Реформации",en:"Luther and the start of the Reformation"},
    {he:"מרטין לותר פרסם רשימת טענות נגד מכירת כתבי מחילה בכנסייה.",
     ar:"نشر مارتن لوثر قائمة اعتراضات على بيع صكوك الغفران في الكنيسة.",

    {he:"ביקורת רחבה על שחיתות בכנסייה, ורצון להחזיר את הסמכות לכתבי הקודש עצמם.",

    {he:"הנצרות במערב נחלקה לקתולים ולפרוטסטנטים, ואירופה נגררה למאה שנות מלחמות דת.",

  C({he:"רנסאנס",ar:"النهضة",ru:"Возрождение",en:"Renaissance"},
    {he:"״לידה מחדש״: תנועה תרבותית שהחזירה למרכז את האדם ואת מורשת יוון ורומא.",
     ar:"«ولادة جديدة»: حركة ثقافية أعادت الإنسان وتراث اليونان وروما إلى المركز.",
     ru:"«Возрождение»: культурное движение, вернувшее в центр человека и наследие Греции и Рима.",

 ],
 [
  E(1492,
    {he:"גירוש יהודי ספרד",ar:"طرد يهود إسبانيا",ru:"Изгнание евреев из Испании",en:"The expulsion of the Jews from Spain"},
    {he:"מלכי ספרד ציוו על היהודים להתנצר או לעזוב את הממלכה בתוך חודשים.",
     ar:"أمر ملكا إسبانيا اليهود بالتنصّر أو مغادرة المملكة خلال أشهر.",
     ru:"Испанские монархи приказали евреям креститься или покинуть королевство в течение нескольких месяцев.",
     en:"The Spanish monarchs ordered the Jews to convert or leave the kingdom within months."},
    {he:"איחוד ספרד תחת שלטון קתולי, לחץ האינקוויזיציה, וחשד מתמשך כלפי מומרים.",
     ar:"توحيد إسبانيا تحت حكم كاثوليكي، وضغط محاكم التفتيش، وشكّ متواصل تجاه المتنصّرين.",

    {he:"עשרות אלפי יהודים גורשו והתפזרו לצפון אפריקה, לאימפריה העות׳מאנית ולהולנד.",
     ar:"طُرد عشرات آلاف اليهود وتفرّقوا إلى شمال إفريقيا والدولة العثمانية وهولندا.",

     en:"Tens of thousands of Jews were expelled and scattered to North Africa, the Ottoman empire and Holland."}),
  E(1543,
    {he:"קופרניקוס והמהפכה המדעית",ar:"كوبرنيكوس والثورة العلمية",ru:"Коперник и научная революция",en:"Copernicus and the scientific revolution"},
    {he:"קופרניקוס פרסם ספר שבו כדור הארץ מסתובב סביב השמש, ולא להפך.",

    {he:"מדידות אסטרונומיות שלא התאימו למודל הישן, וחשיבה שהעדיפה תצפית על סמכות.",

    {he:"נפתח עידן שבו טענה נבחנת בניסוי ובמדידה — ומכאן צמח המדע המודרני.",

     ru:"Началась эпоха, когда утверждение проверяют опытом и измерением, — отсюда выросла современная наука.",
     en:"An age began in which a claim is tested by experiment and measurement — and from this modern science grew."}),
  E(1648,
    {he:"שלום וסטפליה",ar:"صلح وستفاليا",ru:"Вестфальский мир",en:"The Peace of Westphalia"},
    {he:"הסכם שסיים את מלחמת שלושים השנה וקבע שכל שליט יקבע את דת מדינתו.",

    {he:"מלחמות דת ארוכות שהחריבו את מרכז אירופה ולא הכריעו דבר.",
     ar:"حروب دينية طويلة خرّبت وسط أوروبا ولم تحسم شيئًا.",
     ru:"Долгие религиозные войны, разорившие центр Европы и ничего не решившие.",
     en:"Long religious wars that devastated central Europe and settled nothing."},
    {he:"נולד רעיון המדינה הריבונית שאין להתערב בענייניה — הבסיס ליחסים הבינלאומיים עד היום.",
     ar:"وُلدت فكرة الدولة ذات السيادة التي لا يجوز التدخّل في شؤونها — أساس العلاقات الدولية حتى اليوم.",
     ru:"Родилась идея суверенного государства, во внутренние дела которого нельзя вмешиваться, — основа международных отношений по сей день.",
     en:"The idea of the sovereign state, whose affairs may not be interfered with, was born — the basis of international relations to this day."}),
  C({he:"הומניזם",ar:"الإنسانية",ru:"Гуманизм",en:"Humanism"},
    {he:"גישה שמעמידה במרכז את האדם, את יכולתו ואת חינוכו, ולומדת מכתבי העת העתיקה.",
     ar:"نهج يضع الإنسان وقدرته وتربيته في المركز، ويتعلّم من كتابات العصر القديم.",
     ru:"Подход, ставящий в центр человека, его способности и образование, и учащийся у сочинений древности.",
     en:"An outlook that puts the human being, his ability and his education at the centre, and learns from the writings of antiquity."})
 ],
 [
  E(1602,
    {he:"חברת הודו המזרחית ההולנדית",ar:"شركة الهند الشرقية الهولندية",ru:"Голландская Ост-Индская компания",en:"The Dutch East India Company"},
    {he:"סוחרים הולנדים הקימו חברה שגייסה כסף ממשקיעים רבים וסחרה במזרח.",

     ru:"Голландские купцы основали компанию, собравшую деньги у множества вкладчиков и торговавшую на Востоке.",

    {he:"הסחר הימי היה יקר ומסוכן מכדי שאדם יחיד יממן אותו לבדו.",

  C({he:"מרקנטיליזם",ar:"المذهب التجاري",ru:"Меркантилизм",en:"Mercantilism"},
    {he:"מדיניות כלכלית שראתה בזהב ובעודף ייצוא על יבוא את מקור עוצמתה של המדינה.",

  C({he:"קולוניה",ar:"مستعمرة",ru:"Колония",en:"Colony"},

     ru:"Заморская территория, управляемая европейским государством и используемая в интересах его хозяйства.",
     en:"A territory overseas ruled by a European state and exploited for the benefit of its economy."}),
  Sc({he:["ציווינו על כל היהודים היושבים בממלכותינו לצאת מהן,",
          "עם בניהם ובנותיהם, עבדיהם ושפחותיהם,",
          "עד סוף חודש יולי של השנה הזאת,",
          "ולא ישובו אליהן, לא כדי לגור ולא כדי לעבור בהן.",
          "ומי שיקבל עליו את הדת הקתולית — יישאר."],
      ar:["أمرنا كل اليهود الساكنين في ممالكنا بالخروج منها،",
          "مع أبنائهم وبناتهم وعبيدهم وإمائهم،",
          "حتى نهاية شهر تموز من هذه السنة،",
          "وألّا يعودوا إليها، لا للسكن ولا للمرور.",
          "ومن يقبل الدين الكاثوليكي — يبقى."],
      ru:["Мы повелели всем евреям, живущим в наших королевствах, выйти из них,",
          "с их сыновьями и дочерьми, рабами и рабынями,",
          "до конца июля этого года,",
          "и не возвращаться в них ни для жительства, ни для проезда.",
          "А кто примет католическую веру — останется."],
      en:["We have commanded all the Jews dwelling in our kingdoms to depart from them,",
          "with their sons and daughters, their menservants and maidservants,",
          "by the end of the month of July of this year,",
          "and not to return to them, neither to live nor to pass through.",
          "And whoever accepts the Catholic faith — shall remain."]},
     [Q({he:"איזו ברירה מציב הצו?",ar:"ما الخيار الذي يضعه المرسوم؟",ru:"Какой выбор ставит указ?",en:"What choice does the decree set out?"},
        {he:"להתנצר ולהישאר, או לצאת מהממלכה עד תאריך שנקבע.",ar:"التنصّر والبقاء، أو الخروج من المملكة حتى تاريخ محدّد.",ru:"Креститься и остаться либо покинуть королевство к назначенному сроку.",en:"To convert and stay, or to leave the kingdom by a set date."},
        [{he:"לשלם מס מיוחד ולהישאר לגור כרגיל בכל רחבי הממלכה.",ar:"دفع ضريبة خاصة والبقاء للعيش كالمعتاد في كل أنحاء المملكة.",ru:"Заплатить особый налог и остаться жить как прежде по всему королевству.",en:"To pay a special tax and stay living as before across the kingdom."},
         {he:"לעבור לגור בעיר אחת בלבד, תחת פיקוח הכנסייה המקומית.",ar:"الانتقال للسكن في مدينة واحدة فقط، تحت إشراف الكنيسة المحلية.",ru:"Переселиться только в один единственный город, под надзором местной церкви.",en:"To move into one single town only, under the local church's watch."},
         {he:"לצאת ולחזור אחרי שנה, כשהמצב בממלכה יירגע.",ar:"الخروج والعودة بعد سنة، حين تهدأ الأوضاع في المملكة.",ru:"Уехать и вернуться через год, когда в королевстве всё утихнет.",en:"To leave and return after a year, once things calm down."}],
        [{he:"הצו אינו מציע תשלום. הברירה היא דת או יציאה.",ar:"المرسوم لا يعرض دفعًا. الخيار دين أو خروج.",ru:"Указ не предлагает платы. Выбор — вера или выезд.",en:"The decree offers no payment. The choice is faith or leaving."},
         {he:"אין בצו הגבלה לעיר. יש בו גירוש מכל הממלכות.",ar:"لا حصر في مدينة في المرسوم. فيه طرد من كل الممالك.",ru:"В указе нет ограничения городом. В нём изгнание из всех королевств.",en:"The decree names no town limit. It orders exile from all the kingdoms."},
         {he:"הצו אוסר לשוב — לא לגור ואף לא לעבור.",ar:"المرسوم يمنع العودة — لا للسكن ولا حتى للمرور.",ru:"Указ запрещает возвращаться — ни жить, ни даже проезжать.",en:"The decree forbids returning, neither to live nor even to pass."}]),
      Q({he:"מה מלמד הצו על מדיניות ספרד באותה שנה?",ar:"ماذا يبيّن المرسوم عن سياسة إسبانيا في تلك السنة؟",ru:"Что указ говорит о политике Испании в том году?",en:"What does the decree show about Spain's policy that year?"},
        {he:"שהממלכה ביקשה אחידות דתית מלאה בשטחה.",ar:"أن المملكة أرادت وحدة دينية كاملة في أراضيها.",ru:"Что королевство добивалось полного религиозного единообразия на своей земле.",en:"That the kingdom sought complete religious uniformity in its territory."},
        [{he:"שהיא ביקשה למשוך אליה מהגרים חדשים.",ar:"أنها سعت لاجتذاب مهاجرين جدد إلى أراضيها.",ru:"Что королевство стремилось привлечь к себе новых переселенцев.",en:"That the kingdom sought to draw new immigrants to itself."},
         {he:"שהיא ויתרה על מעורבות הכנסייה.",ar:"أنها تخلّت عن تدخّل الكنيسة في الحكم.",ru:"Что королевство отказалось от участия церкви в делах правления.",en:"That the kingdom gave up church involvement in its government."},
         {he:"שהיא הרחיבה את חופש הפולחן לכל הדתות בשטחה.",ar:"أنها وسّعت حرية العبادة لكل الأديان في كل أراضيها.",ru:"Что королевство расширило свободу веры для людей всех религий на своих землях.",en:"That the kingdom widened freedom of worship for all religions in its lands."}],

      Q({he:"כיצד מגדיר המקור את גבול החירות?",ar:"كيف يحدّ المصدر الحرية؟",ru:"Как источник определяет предел свободы?",en:"How does the source define the limit of liberty?"},

        [{he:"חופשי לעשות כל דבר, גם אם הוא מזיק לאדם אחר.",ar:"حرّ في فعل كل شيء، حتى لو أضرّ بإنسان آخر.",ru:"Свободен делать всё, даже если это вредит другому человеку.",en:"Free to do anything, even if it does harm to another person."},
         {he:"חופשי רק במה שהחוק מונה ומתיר בצורה ברורה.",ar:"حرّ فقط فيما يعدّده القانون ويجيزه بوضوح.",ru:"Свободен лишь в том, что закон прямо перечисляет и разрешает.",en:"Free only in what the law expressly lists and clearly allows."},
         {he:"חופשי כל עוד השלטון נותן לו רשות לעשות זאת.",ar:"حرّ ما دام الحكم يمنحه الإذن بفعل هذا الأمر.",ru:"Свободен до тех пор, пока власть даёт ему на это разрешение.",en:"Free for as long as the government gives him permission to do it."}],
        [{he:"המקור מציב גבול ברור: הנזק לזולת.",ar:"المصدر يضع حدًّا واضحًا: الضرر بالغير.",ru:"Источник ставит ясную границу: вред другому.",en:"The source sets a clear limit: harm to another."},
         {he:"ההגדרה הפוכה: מותר הכול, חוץ ממה שמזיק.",ar:"التعريف معكوس: كل شيء مباح إلا ما يضرّ.",ru:"Определение обратное: разрешено всё, кроме вредящего.",en:"The definition runs the other way: all is allowed except what harms."},
         {he:"לפי המקור החירות טבעית, ואינה מתנה מהשלטון.",ar:"وفق المصدر الحرية طبيعية، وليست هبة من الحكم.",ru:"По источнику свобода естественна, а не дар власти.",en:"In the source liberty is natural, not a gift from the government."}])])
 ]

topic("industry","mod",
  {he:"המהפכה התעשייתית",ar:"الثورة الصناعية",ru:"Промышленная революция",en:"The Industrial Revolution"},
  {he:"קיטור, מפעל ורכבת — ומה זה עשה לאנשים",
   ar:"البخار والمصنع والقطار — وما فعله ذلك بالناس",
   ru:"Пар, фабрика и железная дорога — и что это сделало с людьми",
   en:"Steam, the factory and the railway — and what it did to people"},
[
 [
  E(1769,
    {he:"מכונת הקיטור של ואט",ar:"محرّك واط البخاري",ru:"Паровая машина Уатта",en:"Watt's steam engine"},
    {he:"ג׳יימס ואט שיפר את מנוע הקיטור והפך אותו ליעיל דיו לשימוש בתעשייה.",
     ar:"حسّن جيمس واط المحرّك البخاري وجعله كفؤًا بما يكفي للاستخدام الصناعي.",
     ru:"Джеймс Уатт усовершенствовал паровую машину и сделал её достаточно эффективной для промышленности.",
     en:"James Watt improved the steam engine and made it efficient enough for industrial use."},
    {he:"מכרות הפחם נזקקו למשאבות חזקות, והמנוע הקודם בזבז דלק רב מדי.",

     en:"The coal mines needed powerful pumps, and the earlier engine wasted far too much fuel."},
    {he:"אפשר היה להקים מפעל בכל מקום ולא רק ליד נהר, והתיעוש התפשט במהירות.",

     ru:"Фабрику стало можно ставить где угодно, а не только у реки, и индустриализация быстро распространилась.",
     en:"A factory could now be built anywhere, not only beside a river, and industry spread fast."}),
  E(1825,
    {he:"מסילת הרכבת הראשונה לנוסעים",ar:"أول سكة حديد للركاب",ru:"Первая пассажирская железная дорога",en:"The first passenger railway"},
    {he:"בבריטניה נפתח קו רכבת שהסיע נוסעים וסחורות בקטר קיטור.",

     en:"In Britain a railway line opened that carried passengers and goods behind a steam locomotive."},
    {he:"היה צורך להוביל פחם וברזל במהירות ובזול בין המכרות למפעלים.",

     en:"Coal and iron had to be moved quickly and cheaply between the mines and the factories."},
    {he:"מרחקים התקצרו, שווקים התאחדו, ואנשים החלו לנוע בין ערים בקנה מידה חדש.",
     ar:"قصرت المسافات، واتّحدت الأسواق، وبدأ الناس ينتقلون بين المدن على نطاق جديد.",
     ru:"Расстояния сократились, рынки соединились, и люди стали перемещаться между городами в новых масштабах.",
     en:"Distances shrank, markets joined up, and people began moving between cities on a new scale."}),
  E(1833,
    {he:"חוק המפעלים בבריטניה",ar:"قانون المصانع في بريطانيا",ru:"Фабричный закон в Британии",en:"The Factory Act in Britain"},
    {he:"החוק אסר להעסיק ילדים מתחת לגיל תשע והגביל את שעות העבודה של הצעירים.",

    {he:"נקבע לראשונה שהמדינה מתערבת בתנאי העבודה — ומכאן צמח משפט העבודה.",

  C({he:"תיעוש",ar:"التصنيع",ru:"Индустриализация",en:"Industrialisation"},

     ru:"Переход от ручного производства в доме и деревне к машинному производству на фабриках и в городах.",

 ],
 [

    {he:"מרקס ואנגלס פרסמו חוברת שטענה שההיסטוריה כולה היא מאבק בין מעמדות.",

    {he:"הצורך לקצר את הדרך בין אירופה לאסיה, שעברה עד אז סביב כל יבשת אפריקה.",

 ],
 [

        {he:"ילדים עבדו יום עבודה ארוך מאוד, בתנאים קשים ובלי הגנה.",ar:"أن الأطفال عملوا يومًا طويلًا جدًا، في ظروف قاسية وبلا حماية.",ru:"Что дети работали очень долгий день, в тяжёлых условиях и без защиты.",en:"That children worked a very long day, in harsh conditions and with no protection."},
        [{he:"ילדים הועסקו רק בעונות מסוימות, בעיקר בקציר.",ar:"شُغّل الأطفال في مواسم معيّنة فقط، خاصة في الحصاد.",ru:"Детей нанимали лишь в определённые сезоны, в основном на жатву.",en:"Children were hired only in certain seasons, mainly at the harvest."},
         {he:"עבודת ילדים הייתה אסורה בכל אירופה באותה תקופה.",ar:"كان عمل الأطفال ممنوعًا في كل أوروبا في تلك الحقبة.",ru:"Детский труд был запрещён по всей Европе в ту самую эпоху.",en:"Child labour was forbidden across all of Europe at that very time."},
         {he:"הילדים עבדו רק בשעות אחר הצהריים, אחרי הלימודים.",ar:"عمل الأطفال في ساعات بعد الظهر فقط، بعد انتهاء الدراسة.",ru:"Дети работали только в послеобеденные часы, после уроков.",en:"The children worked only in the afternoon hours, after their school."}],
        [{he:"העדות מתארת יום עבודה קבוע במפעל, ולא עונה.",ar:"الشهادة تصف يوم عمل ثابتًا في المصنع، لا موسمًا.",ru:"Показания описывают постоянный рабочий день на фабрике, не сезон.",en:"The testimony describes a fixed working day in a factory, not a season."},
         {he:"ועדת חקירה שומעת עדות כזאת רק אם זה עדיין קורה.",ar:"لجنة تحقيق تسمع شهادة كهذه فقط إن كان الأمر ما زال يحدث.",ru:"Комиссия слушает такие показания, только если это ещё происходит.",en:"An inquiry hears such testimony only if it is still happening."},
         {he:"בעדות העבודה מתחילה בחמש בבוקר ונגמרת בתשע.",ar:"في الشهادة يبدأ العمل الخامسة صباحًا وينتهي التاسعة.",ru:"В показаниях работа начинается в пять утра и кончается в девять.",en:"In the testimony work starts at five in the morning and ends at nine."}]),
      Q({he:"מדוע עדות אישית חשובה להיסטוריון?",ar:"لماذا تهمّ الشهادة الشخصية المؤرّخ؟",ru:"Почему личное свидетельство важно историку?",en:"Why does a personal testimony matter to a historian?"},
        {he:"היא מראה את חוויית היום־יום, שמספרים ונתונים לבדם אינם מספרים.",ar:"لأنها تُظهر تجربة اليوم العادي، وهو ما لا ترويه الأرقام وحدها.",ru:"Оно показывает повседневный опыт, о котором одни цифры не расскажут.",en:"It shows the daily experience, which figures alone do not tell."},
        [{he:"היא תמיד מדויקת יותר ממסמכים רשמיים ומהנתונים שאספו בעלי המפעלים.",ar:"هي دائمًا أدقّ من الوثائق الرسمية ومن البيانات التي جمعها أصحاب المصانع.",ru:"Оно всегда точнее официальных документов и данных, собранных владельцами фабрик.",en:"It is always more exact than official papers and the owners' own figures."},
         {he:"היא מייצגת בהכרח את כל העובדים בכל המפעלים שפעלו באנגליה באותה תקופה.",ar:"هي تمثّل بالضرورة كل العمال في كل المصانع التي عملت في إنجلترا آنذاك.",ru:"Оно непременно представляет всех рабочих всех фабрик Англии той эпохи.",en:"It represents all the workers in every factory that ran in England then."},
         {he:"היא אינה דורשת בדיקה מול מקורות אחרים, כי היא עדות ראייה ישירה.",ar:"لا تحتاج إلى فحص أمام مصادر أخرى، لأنها شهادة عيان مباشرة من صاحبها.",ru:"Оно не требует сверки с другими источниками, ведь это прямое свидетельство.",en:"It needs no checking against other sources, as it is a direct eyewitness account."}],
        [{he:"גם עדות אישית חלקית, וצריך לבדוק אותה כמו כל מקור.",ar:"الشهادة الشخصية جزئية أيضًا، ويجب فحصها كأي مصدر.",ru:"Личное свидетельство тоже неполно, и его проверяют, как любой источник.",en:"A personal account is partial too, and is checked like any source."},
         {he:"עדות אחת מספרת סיפור אחד, ולא את סיפורם של כולם.",ar:"شهادة واحدة تروي قصة واحدة، لا قصة الجميع.",ru:"Одно свидетельство рассказывает одну историю, а не историю всех.",en:"One account tells one story, not the story of everyone."},
         {he:"כל מקור נבדק מול מקורות אחרים, גם עדות ראייה.",ar:"كل مصدر يُفحص أمام مصادر أخرى، حتى شهادة العيان.",ru:"Любой источник сверяют с другими, даже свидетельство очевидца.",en:"Every source is checked against others, even an eyewitness account."}])])
 ]
]);

topic("emancip","mod",
  {he:"אמנציפציה ואנטישמיות",ar:"المساواة الحقوقية ومعاداة السامية",ru:"Эмансипация и антисемитизм",en:"Emancipation and antisemitism"},
  {he:"שוויון זכויות ליהודי אירופה — ומה שקם נגדו",
   ar:"مساواة في الحقوق ليهود أوروبا — وما قام ضدّها",
   ru:"Равноправие для евреев Европы — и то, что поднялось против него",
   en:"Equal rights for the Jews of Europe — and what rose against them"},
[
 [ /* רמה 1 */
  E(1791,
    {he:"האמנציפציה ליהודי צרפת",ar:"منح يهود فرنسا المساواة",ru:"Эмансипация евреев Франции",en:"The emancipation of the Jews of France"},
    {he:"האספה הלאומית הצרפתית העניקה ליהודים אזרחות מלאה ושווה, וצרפת היתה המדינה הראשונה באירופה שעשתה זאת.",
     ar:"منحت الجمعية الوطنية الفرنسية اليهود مواطنة كاملة ومتساوية، وكانت فرنسا أوّل دولة في أوروبا تفعل ذلك.",
     ru:"Французское Национальное собрание дало евреям полное и равное гражданство, и Франция стала первой страной Европы, сделавшей это.",
     en:"The French National Assembly granted the Jews full and equal citizenship, and France was the first country in Europe to do so."},
    {he:"הצהרת זכויות האדם קבעה שכל בני האדם נולדים שווים, ומעמד נפרד ליהודים סתר אותה בגלוי.",
     ar:"نصّ إعلان حقوق الإنسان على أن الناس يولدون متساوين، وناقض وضعٌ منفصل لليهود ذلك علنًا.",
     ru:"Декларация прав человека провозгласила, что люди рождаются равными, и особый статус для евреев ей открыто противоречил.",
     en:"The Declaration of the Rights of Man held that all people are born equal, and a separate status for Jews openly contradicted it."},
    {he:"היהודים חדלו להיות קהילה נפרדת בעלת בית דין משלה ונעשו אזרחים יחידים — הרווח היה בזכויות, והמחיר בעצמאות הקהילה.",
     ar:"كفّ اليهود عن كونهم جماعة منفصلة لها محكمتها وصاروا مواطنين أفرادًا — فالربح في الحقوق والثمن في استقلال الجماعة.",
     ru:"Евреи перестали быть отдельной общиной со своим судом и стали отдельными гражданами — выигрыш был в правах, а цена — в самостоятельности общины.",
     en:"The Jews ceased to be a separate community with its own court and became individual citizens — the gain was in rights, and the price was the community's autonomy."}),
  E(1812,
    {he:"צו האמנציפציה בפרוסיה",ar:"مرسوم المساواة في بروسيا",ru:"Эдикт об эмансипации в Пруссии",en:"The Prussian emancipation edict"},
    {he:"פרוסיה הכריזה על יהודיה כאזרחי המדינה, פתחה בפניהם ערים ומקצועות, אך סגרה בפניהם משרות ממשלה.",
     ar:"أعلنت بروسيا يهودها مواطنين في الدولة، وفتحت أمامهم المدن والمهن، لكنها أغلقت دونهم وظائف الحكومة.",
     ru:"Пруссия объявила своих евреев гражданами государства, открыла им города и ремёсла, но закрыла государственные должности.",
     en:"Prussia declared its Jews citizens of the state and opened towns and trades to them, but kept government posts closed."},
    {he:"אחרי התבוסה לנפוליאון ביקשה פרוסיה לחזק את עצמה, ורפורמות שיגייסו את כל תושביה נראו הכרחיות.",
     ar:"بعد الهزيمة أمام نابليون سعت بروسيا إلى تقوية نفسها، وبدت إصلاحات تجنّد كلّ سكانها ضرورية.",
     ru:"После поражения от Наполеона Пруссия искала, как усилиться, и реформы, вовлекающие всех жителей, казались необходимыми.",
     en:"After its defeat by Napoleon, Prussia sought to strengthen itself, and reforms that would draw in all its inhabitants looked necessary."},
    {he:"האמנציפציה התבררה כחלקית ומותנית, ורבים הבינו שיצטרכו להוכיח את עצמם שוב ושוב כדי לזכות בשאר.",
     ar:"تبيّن أن المساواة جزئية ومشروطة، وفهم كثيرون أن عليهم إثبات أنفسهم مرارًا لنيل الباقي.",
     ru:"Эмансипация оказалась частичной и условной, и многие поняли, что придётся доказывать себя снова и снова, чтобы получить остальное.",
     en:"The emancipation proved partial and conditional, and many understood they would have to prove themselves again and again to win the rest."}),
  E(1858,
    {he:"יהודי נכנס לפרלמנט הבריטי",ar:"يهودي يدخل البرلمان البريطاني",ru:"Еврей входит в британский парламент",en:"A Jew takes his seat in the British Parliament"},
    {he:"אחרי אחת עשרה שנים שבהן נבחר ולא הורשה להישבע, שינה הפרלמנט את נוסח השבועה וליונל דה רוטשילד הושב מקומו.",
     ar:"بعد إحدى عشرة سنة انتُخب فيها ولم يُسمح له بأداء اليمين، غيّر البرلمان صيغة اليمين وجلس ليونيل دي روتشيلد في مقعده.",
     ru:"После одиннадцати лет, в течение которых его избирали, но не давали принести присягу, парламент изменил её текст, и Лайонел де Ротшильд занял своё место.",
     en:"After eleven years in which he was elected but not allowed to take the oath, Parliament changed its wording and Lionel de Rothschild took his seat."},
    {he:"נוסח השבועה חייב להישבע על אמונתו של נוצרי, וכל יהודי נבחר נחסם בכך בלי שנקבע איסור מפורש.",
     ar:"ألزمت صيغة اليمين الحلف على إيمان مسيحي، فانسدّ بذلك الطريق أمام كلّ يهودي منتخَب دون منع صريح.",
     ru:"Формула присяги требовала клясться христианской верой, и это перекрывало путь любому избранному еврею без прямого запрета.",
     en:"The wording of the oath required swearing on a Christian's faith, which blocked any elected Jew without any explicit ban."},
    {he:"הוכח שהמכשול היה בנוסח ולא בעיקרון, ובריטניה השלימה את האמנציפציה בלי מהפכה ובלי חוקה כתובה.",
     ar:"ثبت أن العائق كان في الصياغة لا في المبدأ، وأتمّت بريطانيا المساواة بلا ثورة وبلا دستور مكتوب.",
     ru:"Оказалось, что преграда была в формулировке, а не в принципе, и Британия завершила эмансипацию без революции и без писаной конституции.",
     en:"It turned out the obstacle lay in the wording and not in the principle, and Britain completed emancipation with no revolution and no written constitution."}),
  C({he:"אמנציפציה",ar:"الإعتاق ومساواة الحقوق",ru:"Эмансипация",en:"Emancipation"},
    {he:"ביטול ההגבלות המיוחדות על היהודים והפיכתם לאזרחים שווי זכויות וחובות ככל תושבי המדינה.",
     ar:"إلغاء القيود الخاصة على اليهود وجعلهم مواطنين متساوين في الحقوق والواجبات كسائر سكان الدولة.",
     ru:"Отмена особых ограничений для евреев и превращение их в граждан, равных в правах и обязанностях со всеми жителями страны.",
     en:"The lifting of the special restrictions on Jews and their becoming citizens equal in rights and duties to everyone else in the state."})
 ],
 [ /* רמה 2 */
  E(1782,
    {he:"כתב הסובלנות של יוזף השני",ar:"براءة التسامح ليوسف الثاني",ru:"Патент о веротерпимости Иосифа II",en:"The Edict of Tolerance of Joseph II"},
    {he:"קיסר אוסטריה פתח בפני היהודים בתי ספר כלליים, אוניברסיטאות ומלאכות, וביטל את חובת האות המבדל.",
     ar:"فتح إمبراطور النمسا أمام اليهود المدارس العامة والجامعات والحرف، وألغى وجوب شارة التمييز.",
     ru:"Император Австрии открыл евреям общие школы, университеты и ремёсла и отменил обязательный отличительный знак.",
     en:"The emperor of Austria opened general schools, universities and crafts to the Jews, and abolished the compulsory distinguishing badge."},
    {he:"הקיסר ביקש נתינים מועילים למדינה ולצבאה, ולא ראה טעם להשאיר קבוצה שלמה מחוץ לכלכלה.",
     ar:"أراد الإمبراطور رعايا نافعين للدولة وجيشها، ولم ير معنى لإبقاء فئة كاملة خارج الاقتصاد.",
     ru:"Император хотел подданных, полезных государству и его армии, и не видел смысла держать целую группу вне хозяйства.",
     en:"The emperor wanted subjects useful to the state and its army, and saw no point in keeping a whole group outside the economy."},
    {he:"נפתחה הדרך ליהודים משכילים בשפת המדינה, אך הכתב גם חייב שמות משפחה גרמניים וצמצם את סמכות הרבנים.",
     ar:"انفتح الطريق ليهود متعلّمين بلغة الدولة، لكن البراءة ألزمت أيضًا بأسماء عائلة ألمانية وقلّصت سلطة الحاخامات.",
     ru:"Открылся путь к образованию на языке страны, но патент также обязал брать немецкие фамилии и урезал власть раввинов.",
     en:"A path opened to schooling in the language of the state, but the edict also imposed German surnames and cut back the authority of the rabbis."}),
  E(1879,
    {he:"טביעת המונח אנטישמיות",ar:"صكّ مصطلح معاداة السامية",ru:"Появление слова «антисемитизм»",en:"The coining of the word antisemitism"},
    {he:"העיתונאי הגרמני וילהלם מאר הקים ליגה נגד היהודים והשתמש במונח שהציג את השנאה כמדע גזעי ולא כעניין דתי.",
     ar:"أسّس الصحفي الألماني فيلهلم مار عصبة ضدّ اليهود واستخدم مصطلحًا قدّم الكراهية كعلم عرقي لا كشأن ديني.",
     ru:"Немецкий журналист Вильгельм Марр основал лигу против евреев и пустил в ход слово, представившее ненависть как расовую науку, а не религиозное дело.",
     en:"The German journalist Wilhelm Marr founded a league against the Jews and used a term that dressed the hatred as racial science rather than a religious matter."},
    {he:"אחרי האמנציפציה כבר אי אפשר היה לתקוף יהודים על אמונתם, שכן המרת דת היתה פותרת את הטענה.",
     ar:"بعد المساواة لم يعد ممكنًا مهاجمة اليهود على إيمانهم، إذ كان تغيير الدين يحلّ الدعوى.",
     ru:"После эмансипации нападать на евреев за веру стало нельзя: крещение снимало обвинение.",
     en:"After emancipation the Jews could no longer be attacked for their faith, since conversion would have answered the charge."},
    {he:"השנאה קיבלה נימוק שאין ממנו מוצא — מי שנולד יהודי נשאר כזה לתמיד — וזה הבסיס שהנאצים בנו עליו.",
     ar:"نال البغض تعليلًا لا مخرج منه — من وُلد يهوديًّا يبقى كذلك أبدًا — وهذا الأساس الذي بنى عليه النازيون.",
     ru:"Ненависть получила обоснование, из которого нет выхода: рождённый евреем остаётся им навсегда — на этом и построили нацисты.",
     en:"The hatred gained a reason with no way out — whoever is born a Jew stays one forever — and this is the ground the Nazis built on."}),
  E(1882,
    {he:"חוקי מאי ברוסיה",ar:"قوانين أيّار في روسيا",ru:"Майские законы в России",en:"The May Laws in Russia"},
    {he:"רוסיה אסרה על יהודים להתיישב בכפרים, לסחור בימי ראשון ולקנות אדמה, והגבילה במכסה את קבלתם לבתי ספר תיכוניים.",
     ar:"منعت روسيا اليهود من السكن في القرى والتجارة أيام الأحد وشراء الأرض، وحدّدت حصّة لقبولهم في المدارس الثانوية.",
     ru:"Россия запретила евреям селиться в сёлах, торговать по воскресеньям и покупать землю и ввела процентную норму приёма в гимназии.",
     en:"Russia barred Jews from settling in villages, from trading on Sundays and from buying land, and set a quota on their admission to secondary schools."},
    {he:"אחרי רצח הצאר האשים השלטון את היהודים בתסיסה, והעדיף להסיט את הזעם העממי אליהם.",
     ar:"بعد اغتيال القيصر اتّهمت السلطة اليهود بالتحريض، وفضّلت تحويل الغضب الشعبي نحوهم.",
     ru:"После убийства царя власть обвинила евреев в брожении и предпочла направить народный гнев на них.",
     en:"After the murder of the tsar the government blamed the Jews for unrest, and preferred to turn popular anger towards them."},
    {he:"מיליוני יהודים ירדו לעוני והחלה הגירה עצומה — רובה לאמריקה, ומיעוטה לארץ ישראל.",
     ar:"انحدر ملايين اليهود إلى الفقر وبدأت هجرة هائلة — معظمها إلى أمريكا وقليلها إلى أرض إسرائيل.",
     ru:"Миллионы евреев обнищали, и началась огромная эмиграция — большей частью в Америку и лишь малой в Землю Израиля.",
     en:"Millions of Jews fell into poverty and a vast emigration began — most of it to America, and a small part of it to the Land of Israel."}),
  C({he:"השכלה",ar:"حركة التنوير اليهودية",ru:"Гаскала — еврейское просвещение",en:"Haskalah — the Jewish Enlightenment"},
    {he:"תנועה יהודית שקראה ללמוד מדע ולשונות אירופה לצד לימודי הקודש, כדי להשתלב בחברה שמסביב.",

 [ /* רמה 3 */
  E(1903,
    {he:"פרעות קישינב",ar:"مذبحة كيشينيف",ru:"Кишинёвский погром",en:"The Kishinev pogrom"},
    {he:"במשך יומיים נרצחו בקישינב עשרות יהודים ומאות נפצעו, בעוד המשטרה עומדת מנגד ואינה מתערבת.",
     ar:"على مدى يومين قُتل في كيشينيف عشرات اليهود وجُرح المئات، والشرطة واقفة جانبًا لا تتدخّل.",
     ru:"За два дня в Кишинёве убили десятки евреев и ранили сотни, а полиция стояла в стороне и не вмешивалась.",
     en:"Over two days dozens of Jews were murdered in Kishinev and hundreds wounded, while the police stood by and did not intervene."},
    {he:"עיתון מקומי הפיץ עלילת דם לפני חג הפסחא, והשלטון לא הכחיש אותה ולא הגן על התושבים.",
     ar:"نشرت صحيفة محلّية افتراء دم قبل عيد الفصح، ولم تنفِه السلطة ولم تحمِ السكّان.",
     ru:"Местная газета распространила кровавый навет перед Пасхой, а власть его не опровергла и жителей не защитила.",
     en:"A local newspaper spread a blood libel before Easter, and the authorities neither denied it nor protected the inhabitants."},
    {he:"הזעזוע העולמי דחף רבים להגירה ולארגון הגנה עצמית, וחיזק את הטענה הציונית שהיהודים זקוקים למדינה משלהם.",
     ar:"دفع الهول العالمي كثيرين إلى الهجرة وتنظيم دفاع عن النفس، وقوّى الحجّة الصهيونية بأن اليهود بحاجة إلى دولة خاصة بهم.",
     ru:"Мировое потрясение подтолкнуло многих к эмиграции и к созданию самообороны и укрепило сионистский довод, что евреям нужно своё государство.",
     en:"The shock around the world pushed many towards emigration and towards organised self-defence, and strengthened the Zionist argument that the Jews needed a state of their own."}),
  C({he:"פוגרום",ar:"البوغروم",ru:"Погром",en:"Pogrom"},
    {he:"התקפה אלימה של המון על שכונה יהודית, שהשלטון מרשה לה להתרחש או אינו ממהר לעצור אותה.",
     ar:"هجوم عنيف لجموع على حيّ يهودي، تسمح به السلطة أو لا تسارع إلى إيقافه.",
     ru:"Насильственное нападение толпы на еврейский квартал, которое власть допускает или не спешит остановить.",
     en:"A violent attack by a mob on a Jewish neighbourhood, which the authorities permit or are in no hurry to stop."}),
  C({he:"התבוללות",ar:"الانصهار",ru:"Ассимиляция",en:"Assimilation"},
    {he:"היטמעות בחברה שמסביב עד לוויתור על השפה, המנהגים והזהות היהודית הנפרדת.",

     en:"Blending into the surrounding society to the point of giving up the language, the customs and a separate Jewish identity."}),
  Sc({he:["ליהודים כאומה — יש לסרב להם הכול;",
          "ליהודים כבני אדם — יש להעניק להם הכול.",

          "אם אינם רוצים להיות אזרחים, שיאמרו זאת, ואז נגרש אותם.",
          "מדברי הרוזן קלרמון-טונר באספה הלאומית הצרפתית, 1789."],
      ar:["لليهود كأمّة — يجب أن يُرفض لهم كلّ شيء؛",
          "ولليهود كأفراد — يجب أن يُمنح لهم كلّ شيء.",
          "لا يجوز أن يكون لهم قضاتهم؛ عليهم أن يُحاكَموا في محاكمنا وحدها.",
          "وإن لم يريدوا أن يكونوا مواطنين، فليقولوها، وحينها نطردهم.",
          "من كلام الكونت كليرمون-تونير في الجمعية الوطنية الفرنسية، 1789."],
      ru:["Евреям как нации — отказать во всём;",
          "евреям как людям — дать всё.",
          "У них не должно быть своих судей; судиться им следует только в наших судах.",
          "Если они не хотят быть гражданами, пусть скажут это, и тогда мы их изгоним.",
          "Из речи графа Клермон-Тоннера в Национальном собрании Франции, 1789 год."],
      en:["To the Jews as a nation, everything must be refused;",
          "to the Jews as individuals, everything must be granted.",
          "They must not have judges of their own; they must be judged in our courts alone.",
          "If they do not wish to be citizens, let them say so, and then we shall expel them.",
          "From the speech of Count Clermont-Tonnerre to the French National Assembly, 1789."]},
     [Q({he:"מה התנאי שהדובר מציב לשוויון הזכויות?",ar:"ما الشرط الذي يضعه المتكلّم للمساواة في الحقوق؟",ru:"Какое условие ставит оратор для равноправия?",en:"What condition does the speaker set for equal rights?"},
        {he:"שהיהודים יוותרו על קיומם כקבוצה נפרדת ויתקבלו כיחידים בלבד.",ar:"أن يتخلّى اليهود عن وجودهم كجماعة منفصلة ويُقبلوا كأفراد فقط.",ru:"Чтобы евреи отказались от существования как отдельная группа и были приняты лишь как отдельные люди.",en:"That the Jews give up their existence as a separate group and be accepted as individuals only."},
        [{he:"שהיהודים ימירו את דתם לנצרות לפני קבלת האזרחות.",ar:"أن يغيّر اليهود دينهم إلى المسيحية قبل نيل المواطنة.",ru:"Чтобы евреи перешли в христианство перед получением гражданства.",en:"That the Jews convert to Christianity before receiving citizenship."},
         {he:"שהיהודים ישלמו מס מיוחד תמורת ההגנה שיקבלו.",ar:"أن يدفع اليهود ضريبة خاصة مقابل الحماية التي ينالونها.",ru:"Чтобы евреи платили особый налог за получаемую защиту.",en:"That the Jews pay a special tax in return for the protection they receive."},
         {he:"שהיהודים ישמרו על בתי הדין שלהם לצד בתי המשפט הכלליים.",ar:"أن يحافظ اليهود على محاكمهم إلى جانب المحاكم العامة.",ru:"Чтобы евреи сохранили свои суды наряду с общими.",en:"That the Jews keep their own courts alongside the general ones."}]),
      Q({he:"מה מלמד המשפט האחרון על אופייה של ההצעה?",ar:"ماذا تعلّمنا الجملة الأخيرة عن طبيعة الاقتراح؟",ru:"Что последняя фраза говорит о характере предложения?",en:"What does the last sentence show about the nature of the offer?"},
        {he:"שהשוויון מוצע כעסקה שאין ממנה דרך שלישית — או השתלבות מלאה או גירוש.",ar:"أن المساواة تُعرض كصفقة بلا طريق ثالث — إمّا اندماج كامل وإمّا طرد.",ru:"Что равенство предлагается как сделка без третьего пути — либо полное вхождение, либо изгнание.",en:"That equality is offered as a bargain with no third way — either full integration or expulsion."},
        [{he:"שההצעה זמנית ותיבחן מחדש בכל שנה.",ar:"أن العرض مؤقّت وسيُراجع كلّ سنة.",ru:"Что предложение временное и будет пересматриваться ежегодно.",en:"That the offer is temporary and will be reviewed each year."},
         {he:"שהדובר מתנגד להענקת זכויות ליהודים בכל תנאי.",ar:"أن المتكلّم يعارض منح اليهود حقوقًا بأيّ شرط.",ru:"Что оратор против предоставления евреям прав при любых условиях.",en:"That the speaker opposes granting the Jews rights under any condition."},
         {he:"שההחלטה נתונה בידי בתי הדין היהודיים עצמם.",ar:"أن القرار بيد المحاكم اليهودية نفسها.",ru:"Что решение отдано самим еврейским судам.",en:"That the decision is left to the Jewish courts themselves."}])])
 ]

 [
  E(1871,

    {he:"קמה מעצמה חדשה במרכז אירופה, שינתה את מאזן הכוחות והאיצה את המרוץ לקולוניות.",

  E(1884,

    {he:"מעצמות אירופה נפגשו וחילקו ביניהן את אפריקה, בלי נציג אפריקאי אחד.",

  E(1897,

    {he:"הרצל כינס בבזל נציגים יהודים מכל העולם והקים תנועה לאומית מדינית.",

    {he:"הפרעות ברוסיה והעלייה הראשונה",ar:"مذابح روسيا والهجرة الأولى",ru:"Погромы в России и Первая алия",en:"The pogroms in Russia and the First Aliyah"},

        {he:"שגרמניה אחראית לנזקי המלחמה, ומכאן החובה לשלם פיצויים.",ar:"أن ألمانيا مسؤولة عن أضرار الحرب، ومن هنا واجب دفع التعويضات.",ru:"Что Германия ответственна за ущерб войны, отсюда и обязанность платить репарации.",en:"That Germany is responsible for the damage of the war, and hence the duty to pay reparations."},

topic("coldwar","c20",
  {he:"המלחמה הקרה ושחרור המושבות",ar:"الحرب الباردة وتحرّر المستعمرات",ru:"Холодная война и деколонизация",en:"The Cold War and decolonisation"},
  {he:"שני גושים, פצצה שלא הוטלה, ועשרות מדינות חדשות",
   ar:"كتلتان، وقنبلة لم تُلقَ، وعشرات الدول الجديدة",
   ru:"Два блока, бомба, которую не сбросили, и десятки новых государств",
   en:"Two blocs, a bomb that was never dropped, and dozens of new states"},
[
 [ /* רמה 1 */
  E(1946,
    {he:"נאום מסך הברזל",ar:"خطاب الستار الحديدي",ru:"Речь о железном занавесе",en:"The Iron Curtain speech"},
    {he:"צ׳רצ׳יל הכריז בנאום באמריקה שמסך ברזל ירד על אירופה, ומאחוריו נשלטות בירות המזרח בידי מוסקבה.",
     ar:"أعلن تشرشل في خطاب بأمريكا أن ستارًا حديديًّا هبط على أوروبا، وخلفه تُحكم عواصم الشرق من موسكو.",
     ru:"Черчилль заявил в речи в Америке, что на Европу опустился железный занавес, за которым столицами Востока правят из Москвы.",
     en:"Churchill declared in a speech in America that an iron curtain had come down across Europe, and behind it the capitals of the East were ruled from Moscow."},
    {he:"ברית המועצות לא פינתה את מזרח אירופה אחרי המלחמה והקימה בה משטרים הכפופים לה, בניגוד להבטחות הוועידות.",
     ar:"لم يُخلِ الاتحاد السوفيتي شرق أوروبا بعد الحرب وأقام فيها أنظمة تابعة له، خلافًا لوعود المؤتمرات.",
     ru:"Советский Союз не покинул Восточную Европу после войны и поставил там подчинённые ему режимы, вопреки обещаниям конференций.",
     en:"The Soviet Union did not leave Eastern Europe after the war and set up regimes there that answered to it, against the promises made at the conferences."},
    {he:"בעלות הברית של אתמול הוגדרו כיריבות, והביטוי מסך הברזל נעשה שמה של החלוקה.",
     ar:"عُرّف حلفاء الأمس كخصوم، وصار تعبير الستار الحديدي اسمًا لذلك الانقسام.",
     ru:"Вчерашние союзники были названы противниками, а выражение «железный занавес» стало именем этого раздела.",
     en:"Yesterday's allies were named as rivals, and the phrase iron curtain became the name of the division."}),
  E(1948,
    {he:"המצור על ברלין ורכבת האוויר",ar:"حصار برلين والجسر الجوّي",ru:"Блокада Берлина и воздушный мост",en:"The Berlin blockade and the airlift"},
    {he:"ברית המועצות חסמה את הדרכים למערב ברלין, והמערב הזרים לעיר מזון ופחם במטוסים במשך כמעט שנה.",
     ar:"أغلق الاتحاد السوفيتي الطرق إلى برلين الغربية، فضخّ الغرب إلى المدينة الطعام والفحم بالطائرات نحو سنة.",
     ru:"Советский Союз перекрыл дороги в Западный Берлин, и Запад почти год снабжал город едой и углём по воздуху.",
     en:"The Soviet Union closed the roads to West Berlin, and the West flew food and coal into the city for almost a year."},
    {he:"המערב הנהיג מטבע חדש בחלקה המערבי של גרמניה, ומוסקבה ראתה בכך צעד להקמת מדינה גרמנית נפרדת.",
     ar:"أدخل الغرب عملة جديدة في الجزء الغربي من ألمانيا، ورأت موسكو في ذلك خطوة لإقامة دولة ألمانية منفصلة.",
     ru:"Запад ввёл новую валюту в западной части Германии, и Москва увидела в этом шаг к созданию отдельного немецкого государства.",
     en:"The West introduced a new currency in the western part of Germany, and Moscow saw this as a step towards a separate German state."},
    {he:"המצור הוסר בלי ירייה אחת, וגרמניה נחצתה לשתי מדינות שהתקיימו ארבעים שנה.",
     ar:"رُفع الحصار بلا طلقة واحدة، وانقسمت ألمانيا إلى دولتين بقيتا أربعين سنة.",
     ru:"Блокаду сняли без единого выстрела, а Германия раскололась на два государства, просуществовавших сорок лет.",
     en:"The blockade was lifted without a single shot, and Germany was split into two states that lasted forty years."}),
  E(1949,
    {he:"הקמת נאט״ו",ar:"تأسيس حلف الناتو",ru:"Создание НАТО",en:"The founding of NATO"},
    {he:"שתים עשרה מדינות מערביות חתמו על ברית צבאית שבה התקפה על אחת מהן נחשבת התקפה על כולן.",
     ar:"وقّعت اثنتا عشرة دولة غربية حلفًا عسكريًّا يُعدّ فيه الاعتداء على إحداها اعتداءً على الجميع.",
     ru:"Двенадцать западных стран подписали военный союз, в котором нападение на одну считается нападением на всех.",
     en:"Twelve western countries signed a military alliance in which an attack on one counts as an attack on them all."},
    {he:"מדינות מערב אירופה חששו שצבאן לבדו לא יעצור את הצבא האדום, וביקשו התחייבות אמריקאית כתובה.",
     ar:"خشيت دول غرب أوروبا ألّا توقف جيوشها وحدها الجيش الأحمر، فطلبت التزامًا أمريكيًّا مكتوبًا.",
     ru:"Страны Западной Европы боялись, что их армии в одиночку не остановят Красную армию, и просили письменного обязательства Америки.",
     en:"The countries of Western Europe feared their armies alone would not stop the Red Army, and asked for a written American commitment."},
    {he:"אמריקה נשארה באירופה בימי שלום לראשונה בתולדותיה, וברית המועצות הקימה כעבור שש שנים ברית נגדית.",
     ar:"بقيت أمريكا في أوروبا في زمن السلم لأوّل مرّة في تاريخها، وأقام الاتحاد السوفيتي بعد ستّ سنوات حلفًا مضادًّا.",
     ru:"Америка впервые в своей истории осталась в Европе в мирное время, а Советский Союз через шесть лет создал ответный союз.",
     en:"America stayed in Europe in peacetime for the first time in its history, and six years later the Soviet Union set up a rival alliance."}),
  C({he:"מלחמה קרה",ar:"الحرب الباردة",ru:"Холодная война",en:"Cold War"},
    {he:"עימות ממושך בין שתי מעצמות שנלחמו זו בזו בתעמולה, בריגול ובמלחמות של אחרים, אך לא זו בזו במישרין.",
     ar:"صراع طويل بين قوّتين تحاربتا بالدعاية والتجسّس وحروب الآخرين، لكن لم تتحاربا مباشرة.",
     ru:"Долгое противостояние двух держав, которые воевали друг с другом пропагандой, разведкой и чужими войнами, но не напрямую.",
     en:"A long confrontation between two powers that fought each other through propaganda, spying and other people's wars, but never directly."})
 ],
 [ /* רמה 2 */
  E(1947,
    {he:"עצמאות הודו וחלוקת תת היבשת",ar:"استقلال الهند وتقسيم شبه القارة",ru:"Независимость Индии и раздел субконтинента",en:"Indian independence and the partition"},
    {he:"בריטניה עזבה את הודו, שנחלקה לשתי מדינות לפי דת, ומיליוני הינדים ומוסלמים נעו לצד השני של הגבול החדש.",
     ar:"غادرت بريطانيا الهند، فانقسمت إلى دولتين بحسب الدين، وانتقل ملايين الهندوس والمسلمين إلى الجهة الأخرى من الحدود الجديدة.",
     ru:"Британия ушла из Индии, которая разделилась на два государства по религии, и миллионы индусов и мусульман двинулись на другую сторону новой границы.",
     en:"Britain left India, which was divided into two states along religious lines, and millions of Hindus and Muslims moved to the other side of the new border."},
    {he:"מאבק לא אלים בהנהגת גנדי שחק את שלטון בריטניה, והמלחמה הותירה אותה חלשה מכדי להחזיק אימפריה.",
     ar:"أنهك نضال لاعنفيّ بقيادة غاندي الحكم البريطاني، وتركت الحرب بريطانيا أضعف من أن تحتفظ بإمبراطورية.",
     ru:"Ненасильственная борьба под руководством Ганди измотала британскую власть, а война оставила Британию слишком слабой, чтобы держать империю.",
     en:"A non-violent struggle led by Gandhi wore down British rule, and the war had left Britain too weak to hold an empire."},
    {he:"נולדו הודו ופקיסטן, אך החלוקה עלתה במאות אלפי הרוגים והשאירה סכסוך שנמשך עד היום.",
     ar:"وُلدت الهند وباكستان، لكن التقسيم كلّف مئات آلاف القتلى وترك نزاعًا مستمرًّا حتى اليوم.",
     ru:"Родились Индия и Пакистан, но раздел стоил сотен тысяч жизней и оставил конфликт, длящийся поныне.",
     en:"India and Pakistan were born, but the partition cost hundreds of thousands of lives and left a conflict that lasts to this day."}),
  E(1955,
    {he:"הקמת ברית ורשה",ar:"تأسيس حلف وارسو",ru:"Создание Организации Варшавского договора",en:"The founding of the Warsaw Pact"},
    {he:"ברית המועצות ומדינות מזרח אירופה חתמו על ברית צבאית משלהן, שהעמידה את צבאותיהן תחת פיקוד אחד במוסקבה.",
     ar:"وقّع الاتحاد السوفيتي ودول شرق أوروبا حلفًا عسكريًّا خاصًّا بهم، وضع جيوشهم تحت قيادة واحدة في موسكو.",
     ru:"Советский Союз и страны Восточной Европы подписали собственный военный союз, поставивший их армии под единое командование в Москве.",
     en:"The Soviet Union and the countries of Eastern Europe signed a military alliance of their own, placing their armies under a single command in Moscow."},
    {he:"מערב גרמניה צורפה לנאט״ו והורשתה להקים צבא, ומוסקבה ראתה בגרמניה חמושה בגבולה איום ישיר.",
     ar:"ضُمّت ألمانيا الغربية إلى الناتو وسُمح لها بإقامة جيش، ورأت موسكو في ألمانيا مسلّحة على حدودها تهديدًا مباشرًا.",
     ru:"Западную Германию приняли в НАТО и позволили ей создать армию, и Москва увидела в вооружённой Германии у своих границ прямую угрозу.",
     en:"West Germany was brought into NATO and allowed an army, and Moscow saw an armed Germany on its border as a direct threat."},
    {he:"אירופה נחלקה לשתי בריתות חמושות, וכל ניסיון של מדינה במזרח לפרוש דוכא בכוח.",
     ar:"انقسمت أوروبا إلى حلفين مسلّحين، وقُمعت بالقوّة كلّ محاولة لدولة في الشرق للانسحاب.",
     ru:"Европа раскололась на два вооружённых союза, и всякая попытка страны Востока выйти подавлялась силой.",
     en:"Europe was split into two armed alliances, and every attempt by a country in the East to leave was put down by force."}),
  E(1962,
    {he:"משבר הטילים בקובה",ar:"أزمة الصواريخ الكوبية",ru:"Карибский кризис",en:"The Cuban missile crisis"},
    {he:"אמריקה גילתה טילים סובייטיים בקובה, הטילה הסגר ימי, ובמשך שלושה עשר יום עמד העולם על סף מלחמה גרעינית.",
     ar:"اكتشفت أمريكا صواريخ سوفيتية في كوبا، وفرضت حصارًا بحريًّا، ووقف العالم ثلاثة عشر يومًا على حافة حرب نووية.",
     ru:"Америка обнаружила советские ракеты на Кубе, ввела морскую блокаду, и тринадцать дней мир стоял на грани ядерной войны.",
     en:"America discovered Soviet missiles in Cuba, imposed a naval blockade, and for thirteen days the world stood on the edge of nuclear war."},
    {he:"מוסקבה ביקשה לאזן את הטילים האמריקאיים בטורקיה ולהגן על בעלת בריתה החדשה מפני פלישה נוספת.",
     ar:"أرادت موسكو موازنة الصواريخ الأمريكية في تركيا وحماية حليفتها الجديدة من غزو آخر.",
     ru:"Москва хотела уравновесить американские ракеты в Турции и защитить нового союзника от нового вторжения.",
     en:"Moscow wanted to balance the American missiles in Turkey and to shield its new ally from another invasion."},
    {he:"הטילים הוסרו משני הצדדים, נמתח קו טלפון ישיר בין הבירות, ושתי המעצמות למדו עד כמה קרוב היה האסון.",
     ar:"أُزيلت الصواريخ من الجانبين، ومُدّ خطّ هاتف مباشر بين العاصمتين، وأدركت القوّتان كم كانت الكارثة قريبة.",
     ru:"Ракеты убрали с обеих сторон, между столицами протянули прямую телефонную линию, и обе державы поняли, как близка была катастрофа.",
     en:"The missiles were removed on both sides, a direct telephone line was run between the capitals, and both powers saw how close disaster had come."}),
  C({he:"שחרור המושבות",ar:"تحرّر المستعمرات",ru:"Деколонизация",en:"Decolonisation"},
    {he:"התהליך שבו עשרות מושבות באסיה ובאפריקה קיבלו עצמאות מהמעצמות האירופיות אחרי מלחמת העולם השנייה.",
     ar:"العملية التي نالت فيها عشرات المستعمرات في آسيا وأفريقيا استقلالها عن القوى الأوروبية بعد الحرب العالمية الثانية.",
     ru:"Процесс, в котором десятки колоний в Азии и Африке получили независимость от европейских держав после Второй мировой войны.",
     en:"The process in which dozens of colonies in Asia and Africa gained independence from the European powers after the Second World War."})
 ],
 [ /* רמה 3 */
  E(1989,
    {he:"נפילת חומת ברלין",ar:"سقوط جدار برلين",ru:"Падение Берлинской стены",en:"The fall of the Berlin Wall"},
    {he:"מזרח גרמניה פתחה את המעברים למערב, והמונים עלו על החומה ופירקו אותה בידיהם באותו לילה.",
     ar:"فتحت ألمانيا الشرقية المعابر إلى الغرب، فصعدت الجموع على الجدار وفكّكته بأيديها في تلك الليلة.",
     ru:"Восточная Германия открыла переходы на Запад, и в ту же ночь толпы влезли на стену и разбирали её руками.",
     en:"East Germany opened the crossings to the West, and that same night crowds climbed the wall and pulled it down with their hands."},
    {he:"מוסקבה הודיעה שלא תשלח עוד טנקים להציל משטרים במזרח אירופה, והפגנות המונים גברו בכל הגוש.",
     ar:"أعلنت موسكو أنها لن ترسل بعد اليوم دبّابات لإنقاذ أنظمة شرق أوروبا، فتعاظمت المظاهرات في الكتلة كلّها.",
     ru:"Москва объявила, что больше не пошлёт танки спасать режимы Восточной Европы, и массовые демонстрации усилились по всему блоку.",
     en:"Moscow announced it would no longer send tanks to save the regimes of Eastern Europe, and mass demonstrations grew across the bloc."},
    {he:"גרמניה אוחדה בתוך שנה, המשטרים הקומוניסטיים באירופה קרסו, וברית המועצות התפרקה כעבור שנתיים.",
     ar:"توحّدت ألمانيا خلال سنة، وانهارت الأنظمة الشيوعية في أوروبا، وتفكّك الاتحاد السوفيتي بعد سنتين.",
     ru:"Германия объединилась в течение года, коммунистические режимы в Европе рухнули, а через два года распался Советский Союз.",
     en:"Germany was reunited within a year, the communist regimes in Europe collapsed, and the Soviet Union broke apart two years later."}),
  C({he:"מסך הברזל",ar:"الستار الحديدي",ru:"Железный занавес",en:"The Iron Curtain"},
    {he:"הגבול הסגור שחצה את אירופה, ואסר על תושבי המזרח לעבור למערב או לקבל ממנו מידע.",
     ar:"الحدّ المغلق الذي شقّ أوروبا، ومنع سكان الشرق من العبور إلى الغرب أو تلقّي معلومات منه.",
     ru:"Закрытая граница, рассёкшая Европу и запрещавшая жителям Востока переходить на Запад или получать оттуда сведения.",
     en:"The closed border that cut across Europe, forbidding the people of the East to cross to the West or to receive information from it."}),
  C({he:"הרתעה גרעינית",ar:"الردع النووي",ru:"Ядерное сдерживание",en:"Nuclear deterrence"},
    {he:"המצב שבו שני צדדים אינם תוקפים זה את זה משום שכל תקיפה תביא להשמדה הדדית ולא לניצחון.",
     ar:"الحال التي لا يهاجم فيها طرفان أحدهما الآخر لأن كلّ هجوم يؤدّي إلى دمار متبادل لا إلى نصر.",
     ru:"Положение, при котором две стороны не нападают друг на друга, потому что любое нападение ведёт к взаимному уничтожению, а не к победе.",
     en:"The situation in which two sides do not attack each other because any attack would bring mutual destruction rather than victory."}),
  Sc({he:["כפיפותם של עמים לשעבוד זר היא שלילה של זכויות האדם היסודיות,",
          "והיא נוגדת את מגילת האומות המאוחדות.",
          "לכל העמים הזכות להגדרה עצמית, ומכוחה הם קובעים בחופשיות את מעמדם המדיני.",
          "חוסר הכנה מדינית, כלכלית או חינוכית לעולם לא ישמש עילה לדחיית העצמאות.",
          "מתוך הצהרת האו״ם על מתן עצמאות למדינות ולעמים קולוניאליים, 1960."],
      ar:["إخضاع الشعوب للاستعباد الأجنبي هو إنكار لحقوق الإنسان الأساسية،",
          "وهو مناقض لميثاق الأمم المتحدة.",
          "لكلّ الشعوب الحقّ في تقرير المصير، وبه تحدّد بحرّية وضعها السياسي.",
          "ولا يجوز أبدًا اتّخاذ نقص الاستعداد السياسي أو الاقتصادي أو التعليمي ذريعة لتأخير الاستقلال.",
          "من إعلان الأمم المتحدة بشأن منح الاستقلال للبلدان والشعوب المستعمَرة، 1960."],
      ru:["Подчинение народов чужому господству есть отрицание основных прав человека",
          "и противоречит Уставу Организации Объединённых Наций.",
          "Все народы имеют право на самоопределение и в силу него свободно устанавливают свой политический статус.",

/* ---------- הרחבת הנושאים הקיימים ----------
   more() מוסיף פריטים לסוף מאגר של רמה קיימת. הוא נפרד
   מהקריאות ל-topic() בכוונה: ההתקדמות של מי שכבר למד
   נשמרת לפי אינדקס הפריט בתוך הרמה, ולכן פריט חדש חייב
   להתווסף בסוף ולא באמצע — אחרת כל מה שנלמד יזוז למקום אחר.
   ---------------------------------------------------------- */
function more(id,lv,items){
  var tp=topicOf(id); if(!tp||!tp.L[lv-1])return;
  tp.L[lv-1].push.apply(tp.L[lv-1],items);
}
