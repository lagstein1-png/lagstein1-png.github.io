     en:"Athens lost the best of its strength in the middle of the war with Sparta, and it was the blow from which it never recovered."}),
  C({he:"טרגדיה",ar:"التراجيديا",ru:"Трагедия",en:"Tragedy"},
    {he:"מחזה יווני שבו גיבור נופל בשל טעות או גאווה, והוצג בפני העיר כולה בחג לכבוד האל דיוניסוס.",
     ar:"مسرحية يونانية يسقط فيها البطل بسبب خطأ أو كبرياء، وكانت تُعرض أمام المدينة كلّها في عيد للإله ديونيسوس.",
     ru:"Греческая пьеса, в которой герой гибнет из-за ошибки или гордыни; её играли перед всем городом на празднике в честь Диониса.",
     en:"A Greek play in which a hero falls through an error or through pride, performed before the whole city at a festival for the god Dionysus."}),
  C({he:"פילוסופיה",ar:"الفلسفة",ru:"Философия",en:"Philosophy"},
    {he:"עיסוק בשאלות על העולם, הידיעה והצדק בדרך של נימוק וויכוח, ולא באמצעות סיפורי אלים.",
     ar:"نظر في أسئلة العالم والمعرفة والعدل بطريق التعليل والجدل، لا عبر حكايات الآلهة.",
     ru:"Занятие вопросами о мире, знании и справедливости путём рассуждения и спора, а не через сказания о богах.",
     en:"The pursuit of questions about the world, knowledge and justice by reasoning and argument, rather than through stories of the gods."}),
  Sc({he:["המשטר שלנו נקרא דמוקרטיה, מפני שהשלטון אינו בידי מעטים אלא בידי הרבים.",
          "בענייני הפרט שווים הכול בפני החוק;",
          "ובענייני הכלל, אדם נבחר למשרה לפי כישרונו ולא לפי מעמדו,",
          "והעוני אינו חוסם את דרכו של מי שיכול להועיל לעיר.",
          "מתוך נאום ההספד של פריקלס, כפי שמסר תוקידידס."],
      ar:["نظامنا يُسمّى ديمقراطية، لأن الحكم ليس بيد قلّة بل بيد الكثرة.",
          "في شؤون الأفراد الجميع سواء أمام القانون؛",
          "وفي الشأن العام، يُختار المرء للوظيفة بحسب كفاءته لا بحسب مكانته،",
          "والفقر لا يسدّ الطريق أمام من يقدر أن ينفع المدينة.",
          "من خطبة تأبين بريكليس، كما نقلها ثوكيديدس."],
      ru:["Наш строй называется демократией, потому что власть не у немногих, а у большинства.",
          "В частных делах все равны перед законом;",
          "а в делах общественных человека выбирают на должность по его способностям, а не по положению,",
          "и бедность не закрывает пути тому, кто может принести городу пользу.",
          "Из надгробной речи Перикла в передаче Фукидида."],
      en:["Our constitution is called a democracy, because power is not in the hands of a few but of the many.",
          "In private disputes all are equal before the law;",
          "and in public life a man is chosen for office by his merit and not by his class,",
          "and poverty does not bar the way of anyone who can be of use to the city.",
          "From the funeral oration of Pericles, as reported by Thucydides."]},
     [Q({he:"לפי הנאום, מה קובע מי יקבל משרה ציבורית?",ar:"بحسب الخطبة، ما الذي يحدّد من ينال وظيفة عامة؟",ru:"Согласно речи, что решает, кто получит государственную должность?",en:"According to the speech, what decides who gets public office?"},
        {he:"כישרונו של האדם ותועלתו לעיר, ולא מעמדו או עושרו.",ar:"كفاءة المرء ونفعه للمدينة، لا مكانته ولا ثروته.",ru:"Способности человека и его польза городу, а не положение или богатство.",en:"A person's ability and usefulness to the city, not his class or his wealth."},
        [{he:"ייחוסו של האדם ומוצא משפחתו.",ar:"نسب المرء وأصل عائلته.",ru:"Происхождение человека и род его семьи.",en:"A person's lineage and the standing of his family."},
         {he:"גורל שהוטל בהגרלה בין כל תושבי העיר.",ar:"قرعة تُلقى بين كلّ سكان المدينة.",ru:"Жребий, брошенный между всеми жителями города.",en:"A lot drawn among all the inhabitants of the city."},
         {he:"סכום הכסף שהוא תרם לאוצר העיר.",ar:"مبلغ المال الذي تبرّع به لخزينة المدينة.",ru:"Сумма, которую он пожертвовал в городскую казну.",en:"The sum of money he gave to the city's treasury."}]),
      Q({he:"מה הנאום אינו מספר על אתונה?",ar:"ما الذي لا تذكره الخطبة عن أثينا؟",ru:"О чём речь умалчивает применительно к Афинам?",en:"What does the speech leave out about Athens?"},
        {he:"שנשים, עבדים ותושבים זרים לא נחשבו אזרחים ולא הצביעו כלל.",ar:"أن النساء والعبيد والمقيمين الأجانب لم يُعدّوا مواطنين ولم يصوّتوا البتّة.",ru:"Что женщины, рабы и живущие в городе чужеземцы не считались гражданами и вовсе не голосовали.",en:"That women, slaves and resident foreigners were not counted as citizens and did not vote at all."},
        [{he:"שהאסיפה התכנסה רק פעם אחת בשנה.",ar:"أن الجمعية اجتمعت مرّة واحدة في السنة فقط.",ru:"Что собрание сходилось лишь раз в году.",en:"That the assembly met only once a year."},
         {he:"שהחוקים נכתבו בידי מלך ולא בידי האזרחים.",ar:"أن القوانين كتبها ملك لا المواطنون.",ru:"Что законы писал царь, а не граждане.",en:"That the laws were written by a king and not by the citizens."},
         {he:"שאתונה לא ניהלה מלחמות בתקופה זו.",ar:"أن أثينا لم تخض حروبًا في تلك الفترة.",ru:"Что Афины в это время не вели войн.",en:"That Athens fought no wars in this period."}])])
]);

more("rome",1,[
  E(-451,
    {he:"חוקי שנים עשר הלוחות",ar:"قوانين الألواح الاثني عشر",ru:"Законы Двенадцати таблиц",en:"The Law of the Twelve Tables"},
    {he:"רומא חרתה את חוקיה על שנים עשר לוחות והציבה אותם בכיכר, כדי שכל אזרח יוכל לקרוא אותם.",
     ar:"نقشت روما قوانينها على اثني عشر لوحًا ونصبتها في الساحة، ليقرأها كلّ مواطن.",
     ru:"Рим вырезал свои законы на двенадцати таблицах и выставил их на площади, чтобы каждый гражданин мог их прочесть.",
     en:"Rome cut its laws onto twelve tablets and set them up in the forum, so that every citizen could read them."},
    {he:"עד אז שמרו הפטריקים את החוק בעל פה ופירשו אותו כרצונם, והפלבאים דרשו לדעת לפי מה שופטים אותם.",
     ar:"حتى ذلك الحين حفظ الأشراف القانون شفويًّا وفسّروه كما شاؤوا، وطالب العامّة بمعرفة ما يُحاكمون بموجبه.",
     ru:"До того патриции хранили закон изустно и толковали его как хотели, а плебеи требовали знать, по чему их судят.",
     en:"Until then the patricians kept the law by memory and read it as they pleased, and the plebeians demanded to know what they were being judged by."},
    {he:"החוק נעשה נחלת הכול, וזה הבסיס שעליו נבנה המשפט הרומי שהשפיע על חוקי אירופה עד היום.",
     ar:"صار القانون ملكًا للجميع، وهذا الأساس الذي بُني عليه القانون الروماني الذي أثّر في قوانين أوروبا حتى اليوم.",
     ru:"Закон стал достоянием всех, и на этом основании выросло римское право, повлиявшее на законы Европы до наших дней.",
     en:"The law became everyone's, and on this foundation Roman law was built, which has shaped the laws of Europe to this day."}),
  E(-218,
    {he:"חניבעל חוצה את האלפים",ar:"حنبعل يعبر جبال الألب",ru:"Ганнибал переходит Альпы",en:"Hannibal crosses the Alps"},
    {he:"המצביא הקרתגי העביר צבא ופילי מלחמה מעל הרי האלפים והפתיע את רומא מצפון, בליבה של איטליה.",
     ar:"نقل القائد القرطاجي جيشًا وفيلة حرب فوق جبال الألب وفاجأ روما من الشمال، في قلب إيطاليا.",
     ru:"Карфагенский полководец провёл войско и боевых слонов через Альпы и застал Рим врасплох с севера, в самом сердце Италии.",
     en:"The Carthaginian general brought an army and war elephants over the Alps and surprised Rome from the north, in the heart of Italy."},
    {he:"רומא שלטה בים אחרי המלחמה הראשונה, וקרתגו לא יכלה להעביר צבא בספינות בלי שיוטבע.",
     ar:"سيطرت روما على البحر بعد الحرب الأولى، ولم تقدر قرطاج على نقل جيش بالسفن دون أن يُغرق.",
     ru:"После первой войны Рим владел морем, и Карфаген не мог перевезти войско на кораблях, не потопив его.",
     en:"Rome ruled the sea after the first war, and Carthage could not move an army by ship without having it sunk."},
    {he:"חניבעל ניצח בקרבות במשך שנים אך לא הצליח לכבוש את רומא, ובסוף הובס — וקרתגו איבדה את מעמדה.",
     ar:"انتصر حنبعل في المعارك سنين لكنه لم يفلح في فتح روما، وهُزم في النهاية — وفقدت قرطاج مكانتها.",
     ru:"Ганнибал побеждал в сражениях годами, но взять Рим не сумел и в конце концов был разбит — и Карфаген потерял своё положение.",
     en:"Hannibal won battles for years but never took Rome, and was defeated in the end — and Carthage lost its standing."}),
  E(-133,
    {he:"הרפורמה של טיבריוס גרכוס",ar:"إصلاح تيبيريوس غراكوس",ru:"Реформа Тиберия Гракха",en:"The reform of Tiberius Gracchus"},
    {he:"טיבריוס גרכוס הציע לחלק אדמות ציבור לחיילים משוחררים חסרי קרקע, ונרצח בידי יריביו בסנאט.",
     ar:"اقترح تيبيريوس غراكوس توزيع أراضي الدولة على جنود مسرّحين بلا أرض، فاغتاله خصومه في مجلس الشيوخ.",
     ru:"Тиберий Гракх предложил раздать общественные земли безземельным отставным воинам и был убит противниками в сенате.",
     en:"Tiberius Gracchus proposed dividing public land among landless discharged soldiers, and was killed by his opponents in the senate."},
    {he:"האיכרים שיצאו למלחמות איבדו את חלקותיהם, ואילו העשירים צירפו אותן לאחוזות ענק שעובדו בידי עבדים.",
     ar:"فقد الفلّاحون الذين خرجوا إلى الحروب قطعهم، وضمّها الأغنياء إلى ضياع هائلة يعمل فيها العبيد.",
     ru:"Крестьяне, ушедшие на войны, теряли свои наделы, а богатые присоединяли их к огромным поместьям, где работали рабы.",
     en:"The farmers who went off to the wars lost their plots, and the rich added them to vast estates worked by slaves."},
    {he:"לראשונה נשפך דם פוליטי ברומא, והמאבק על הקרקע הפך למאבק אלים שהחליש את הרפובליקה מבפנים.",
     ar:"لأوّل مرّة سُفك دم سياسي في روما، وتحوّل الصراع على الأرض إلى صراع عنيف أضعف الجمهورية من داخلها.",
     ru:"Впервые в Риме пролилась политическая кровь, и борьба за землю стала насильственной, подтачивая республику изнутри.",
     en:"For the first time political blood was shed in Rome, and the struggle over land became a violent one that weakened the republic from within."}),
  C({he:"לגיון",ar:"الفيلق",ru:"Легион",en:"Legion"},
    {he:"יחידת הצבא הרומית הגדולה, כחמשת אלפים חיילים מאומנים שנלחמו בשורות צפופות ובנו דרכים ומחנות.",
     ar:"الوحدة الكبرى في الجيش الروماني، نحو خمسة آلاف جندي مدرّب قاتلوا في صفوف متراصّة وشقّوا الطرق وبنوا المعسكرات.",
     ru:"Крупное соединение римского войска, около пяти тысяч обученных солдат, которые бились сомкнутым строем и прокладывали дороги и лагеря.",
     en:"The large unit of the Roman army, some five thousand trained soldiers who fought in close ranks and built the roads and camps."})
]);
more("rome",2,[
  E(-31,
    {he:"קרב אקטיום",ar:"معركة أكتيوم",ru:"Битва при Акции",en:"The battle of Actium"},
    {he:"אוקטביאנוס הביס בקרב ימי את צייהם של אנטוניוס וקליאופטרה, ומצרים נספחה לרומא.",
     ar:"هزم أوكتافيانوس في معركة بحرية أسطولي أنطونيوس وكليوباترة، وضُمّت مصر إلى روما.",
     ru:"Октавиан разбил в морском сражении флоты Антония и Клеопатры, и Египет был присоединён к Риму.",
     en:"Octavian defeated the fleets of Antony and Cleopatra in a sea battle, and Egypt was annexed to Rome."},
    {he:"אחרי רצח קיסר נחלקה רומא בין יורשיו, ושני הגברים החזקים ביותר לא יכלו לשלוט בה יחד.",
     ar:"بعد اغتيال قيصر انقسمت روما بين ورثته، ولم يقدر أقوى الرجلين على حكمها معًا.",
     ru:"После убийства Цезаря Рим разделился между его наследниками, и двое сильнейших не могли править им вместе.",
     en:"After Caesar's murder Rome was divided among his heirs, and the two strongest men could not rule it together."},
    {he:"מלחמות האזרחים תמו, ואוקטביאנוס נשאר שליט יחיד — ומכאן קצרה הדרך לקיסרות.",
     ar:"انتهت الحروب الأهلية، وبقي أوكتافيانوس حاكمًا وحيدًا — ومن هنا قصرت الطريق إلى الإمبراطورية.",
     ru:"Гражданские войны кончились, и Октавиан остался единственным правителем — отсюда до империи был один шаг.",
     en:"The civil wars ended and Octavian was left sole ruler — and from there it was a short step to the empire."}),
  E(64,
    {he:"שרפת רומא בימי נירון",ar:"حريق روما في عهد نيرون",ru:"Пожар Рима при Нероне",en:"The fire of Rome under Nero"},
    {he:"אש כילתה חלק גדול מרומא במשך שישה ימים, והקיסר נירון האשים בה את הנוצרים והוציא רבים מהם להורג.",
     ar:"التهمت النار جزءًا كبيرًا من روما ستّة أيام، واتّهم الإمبراطور نيرون بها المسيحيين وأعدم كثيرين منهم.",
     ru:"Огонь шесть дней пожирал большую часть Рима, и император Нерон обвинил в нём христиан и казнил многих из них.",
     en:"Fire consumed much of Rome over six days, and the emperor Nero blamed the Christians for it and put many of them to death."},
    {he:"העיר היתה צפופה ובנויה עץ, והשמועה שהקיסר עצמו הצית אותה חייבה אותו למצוא אשם אחר.",
     ar:"كانت المدينة مكتظّة ومبنيّة بالخشب، وألزمته الإشاعة بأن الإمبراطور نفسه أضرمها أن يجد مذنبًا آخر.",
     ru:"Город был тесен и построен из дерева, а слух, что поджёг его сам император, вынудил Нерона найти иного виновника.",
     en:"The city was crowded and built of wood, and the rumour that the emperor had set it alight forced him to find another culprit."},
    {he:"זו הרדיפה הראשונה של הנוצרים בידי השלטון הרומי, ומכאן ואילך נחשבה אמונתם עברה נגד המדינה.",
     ar:"هذا أوّل اضطهاد للمسيحيين على يد الحكم الروماني، ومنذئذ عُدّ إيمانهم جرمًا ضدّ الدولة.",
     ru:"Это первое гонение на христиан со стороны римской власти, и с тех пор их вера считалась преступлением против государства.",
     en:"This was the first persecution of Christians by the Roman state, and from then on their faith counted as an offence against it."}),
  E(122,
    {he:"בניית חומת אדריאנוס",ar:"بناء سور هادريان",ru:"Строительство вала Адриана",en:"The building of Hadrian's Wall"},
    {he:"הקיסר אדריאנוס בנה חומה חוצה את בריטניה מים אל ים, עם מצודות ושערי מעבר לאורכה.",
     ar:"بنى الإمبراطور هادريان سورًا يشقّ بريطانيا من بحر إلى بحر، بحصون وبوّابات عبور على طوله.",
     ru:"Император Адриан построил вал, пересекавший Британию от моря до моря, с крепостями и воротами по всей длине.",
     en:"The emperor Hadrian built a wall across Britain from sea to sea, with forts and gateways along its length."},
    {he:"האימפריה הגיעה לגבול שבו העלות של כיבוש נוסף עלתה על התועלת, והוחלט להתגונן במקום להתפשט.",
     ar:"بلغت الإمبراطورية حدًّا فاقت فيه كلفة الفتح الإضافي فائدته، فتقرّر الدفاع بدل التوسّع.",
     ru:"Империя дошла до предела, за которым стоимость новых завоеваний превысила выгоду, и было решено обороняться, а не расширяться.",
     en:"The empire had reached a point where the cost of further conquest outweighed the gain, and it was decided to defend rather than expand."},
    {he:"נקבע גבול קבוע לאימפריה, וזה סימן את סוף ההתפשטות ואת תחילת ההגנה על מה שכבר נכבש.",
     ar:"حُدّد للإمبراطورية حدّ ثابت، وكان ذلك إيذانًا بنهاية التوسّع وبدء الدفاع عمّا فُتح.",
     ru:"Империя получила постоянную границу, и это отметило конец расширения и начало обороны уже завоёванного.",
     en:"A fixed frontier was set for the empire, marking the end of expansion and the beginning of defending what was already held."}),
  C({he:"לחם ושעשועים",ar:"الخبز والملاهي",ru:"Хлеба и зрелищ",en:"Bread and circuses"},
    {he:"חלוקת מזון חינם ומופעים ראוותניים לתושבי רומא, כדי לקנות את שקטם ולהסיח את דעתם מן השלטון.",
     ar:"توزيع طعام مجّاني وعروض باذخة على سكان روما، لشراء هدوئهم وصرف انتباههم عن الحكم.",
     ru:"Раздача бесплатного хлеба и пышные зрелища для жителей Рима, чтобы купить их спокойствие и отвлечь от власти.",
     en:"Free grain and lavish shows for the people of Rome, to buy their quiet and turn their attention away from the government."})
]);
more("rome",3,[
  E(410,
    {he:"ביזת רומא בידי הוויזיגותים",ar:"نهب روما على يد القوط الغربيين",ru:"Разграбление Рима вестготами",en:"The sack of Rome by the Visigoths"},
    {he:"צבא הוויזיגותים בפיקוד אלריק נכנס לרומא ובזז אותה שלושה ימים — לראשונה מזה שמונה מאות שנה.",
     ar:"دخل جيش القوط الغربيين بقيادة ألاريك روما ونهبها ثلاثة أيام — لأوّل مرّة منذ ثمانمئة سنة.",
     ru:"Войско вестготов под началом Алариха вошло в Рим и три дня грабило его — впервые за восемьсот лет.",
     en:"The Visigothic army under Alaric entered Rome and plundered it for three days — the first time in eight hundred years."},
    {he:"האימפריה שילמה לשבטים גרמניים שישמרו על גבולותיה, ומשלא קיבלו את שהובטח להם פנו פנימה.",
     ar:"دفعت الإمبراطورية لقبائل جرمانية لتحرس حدودها، وحين لم تنل ما وُعدت به توجّهت إلى الداخل.",
     ru:"Империя платила германским племенам за охрану своих границ, а не получив обещанного, они повернули внутрь.",
     en:"The empire paid Germanic tribes to guard its frontiers, and when they did not receive what they were promised they turned inward."},
    {he:"האמונה שרומא אינה ניתנת לכיבוש נשברה, ורבים ראו בכך את הסימן שהאימפריה גוססת.",
     ar:"انكسر الاعتقاد بأن روما لا تُفتح، ورأى كثيرون في ذلك علامة على احتضار الإمبراطورية.",
     ru:"Вера в то, что Рим неприступен, рухнула, и многие увидели в этом знак, что империя умирает.",
     en:"The belief that Rome could not be taken was broken, and many saw in it the sign that the empire was dying."}),
  C({he:"אמת מים",ar:"القناة المائية",ru:"Акведук",en:"Aqueduct"},
    {he:"תעלה בנויה בשיפוע מתון שהובילה מי מעיינות עשרות קילומטרים אל העיר, לפעמים על גשרי קשתות.",
     ar:"قناة مبنيّة بميل لطيف نقلت مياه الينابيع عشرات الكيلومترات إلى المدينة، أحيانًا على جسور من أقواس.",
     ru:"Канал с малым уклоном, подводивший родниковую воду за десятки километров в город, иногда по арочным мостам.",
     en:"A channel built on a gentle slope that carried spring water tens of kilometres into the city, sometimes on bridges of arches."}),
  C({he:"משפט רומי",ar:"القانون الروماني",ru:"Римское право",en:"Roman law"},
    {he:"שיטת חוקים מסודרת שהבחינה בין דיני ממון לדיני עונשין, וקבעה שאדם חף מפשע עד שהוכחה אשמתו.",
     ar:"منظومة قوانين مرتّبة ميّزت بين أحكام المال وأحكام العقوبات، وقرّرت أن المرء بريء حتى تثبت إدانته.",
     ru:"Упорядоченная система законов, отделившая имущественные дела от уголовных и установившая, что человек невиновен, пока вина не доказана.",
     en:"An ordered system of law that separated matters of property from matters of crime, and held a person innocent until proved guilty."}),
  Sc({he:["אם התובע קורא לנתבע לדין — ילך הנתבע.",
          "אם לא ילך, יביא התובע עדים ואז יתפוס אותו בכוח.",
          "אם מחלה או זקנה מעכבות אותו — יספק לו התובע בהמה לרכיבה.",
          "בשקיעת החמה יסתיים המשפט.",
          "מתוך חוקי שנים עשר הלוחות, רומא, המאה החמישית לפני הספירה."],
      ar:["إن دعا المدّعي المدّعى عليه إلى المحكمة — فليذهب المدّعى عليه.",
          "وإن لم يذهب، فليُحضر المدّعي شهودًا ثمّ يأخذه بالقوّة.",
          "وإن أعاقه مرض أو شيخوخة — فليوفّر له المدّعي دابّة للركوب.",
          "وعند غروب الشمس تنتهي المحاكمة.",
          "من قوانين الألواح الاثني عشر، روما، القرن الخامس قبل الميلاد."],
      ru:["Если истец зовёт ответчика в суд — пусть ответчик идёт.",
          "Если не идёт, пусть истец приведёт свидетелей и тогда возьмёт его силой.",
          "Если болезнь или старость мешают ему — пусть истец предоставит ему вьючное животное.",
          "С заходом солнца разбирательство кончается.",
          "Из законов Двенадцати таблиц, Рим, V век до н. э."],
      en:["If the plaintiff calls the defendant to court, let the defendant go.",
          "If he does not go, let the plaintiff call witnesses and then take him by force.",
          "If illness or age hinders him, let the plaintiff provide him an animal to ride.",
          "At sunset the proceedings shall end.",
          "From the Law of the Twelve Tables, Rome, 5th century BCE."]},
     [Q({he:"מה מלמד הסעיף על המחלה ועל הזקנה?",ar:"ماذا يعلّمنا البند عن المرض والشيخوخة؟",ru:"Что говорит статья о болезни и старости?",en:"What does the clause about illness and age show?"},
        {he:"שהחוק מחייב את הצד החזק לאפשר לחלש להתייצב, ולא פוטר אותו מהמשפט.",ar:"أن القانون يلزم الطرف القويّ بتمكين الضعيف من الحضور، ولا يعفيه من المحاكمة.",ru:"Что закон обязывает сильную сторону дать слабому возможность явиться, но от суда его не освобождает.",en:"That the law obliges the stronger party to enable the weaker one to appear, and does not exempt him from the trial."},
        [{he:"שחולה או זקן פטור לגמרי מהתייצבות בבית הדין.",ar:"أن المريض أو الشيخ معفيّ تمامًا من الحضور أمام المحكمة.",ru:"Что больной или старик полностью освобождён от явки в суд.",en:"That a sick or elderly person is entirely excused from appearing in court."},
         {he:"שהמשפט נדחה עד להחלמתו של הנתבע.",ar:"أن المحاكمة تُؤجّل حتى يشفى المدّعى عليه.",ru:"Что суд откладывается до выздоровления ответчика.",en:"That the trial is postponed until the defendant recovers."},
         {he:"שהתובע רשאי לוותר על התביעה ולקבל פיצוי.",ar:"أن للمدّعي أن يتنازل عن الدعوى وينال تعويضًا.",ru:"Что истец вправе отказаться от иска и получить возмещение.",en:"That the plaintiff may drop the claim and receive compensation."}]),
      Q({he:"מי אחראי להביא את הנתבע לבית הדין, לפי המקור?",ar:"من المسؤول عن إحضار المدّعى عليه إلى المحكمة، بحسب المصدر؟",ru:"Кто, по источнику, отвечает за доставку ответчика в суд?",en:"Who, according to the source, is responsible for bringing the defendant to court?"},
        {he:"התובע עצמו, בעדים ואף בכוח — ואין שוטר שעושה זאת במקומו.",ar:"المدّعي نفسه، بشهود وحتى بالقوّة — ولا شرطيّ يفعل ذلك عنه.",ru:"Сам истец — со свидетелями и даже силой; никакого стража, который сделал бы это за него, нет.",en:"The plaintiff himself, with witnesses and even by force — there is no officer who does it for him."},
        [{he:"שוטרי העיר, שנשלחים בפקודת השופט.",ar:"شرطة المدينة، تُرسل بأمر القاضي.",ru:"Городская стража, посылаемая по приказу судьи.",en:"The city guard, sent at the judge's order."},
         {he:"הסנאט, שדן בכל תביעה לפני פתיחתה.",ar:"مجلس الشيوخ، الذي ينظر في كلّ دعوى قبل رفعها.",ru:"Сенат, рассматривающий каждый иск до его начала.",en:"The senate, which examines every claim before it opens."},
         {he:"שכניו של הנתבע, החייבים להעיד עליו.",ar:"جيران المدّعى عليه، الملزمون بالشهادة عليه.",ru:"Соседи ответчика, обязанные о нём свидетельствовать.",en:"The defendant's neighbours, who must testify about him."}])])
]);

more("temple2",1,[
  E(-516,
    {he:"חנוכת בית שני",ar:"تدشين الهيكل الثاني",ru:"Освящение Второго храма",en:"The dedication of the Second Temple"},
    {he:"אחרי שנים של עיכובים הושלמה בניית המקדש בירושלים, וחנוכתו נחגגה בידי השבים מבבל.",
     ar:"بعد سنوات من التعطيل اكتمل بناء الهيكل في القدس، واحتفل العائدون من بابل بتدشينه.",
     ru:"После лет задержек постройка Храма в Иерусалиме была завершена, и вернувшиеся из Вавилона отпраздновали его освящение.",
     en:"After years of delay the building of the Temple in Jerusalem was completed, and those who had returned from Babylon celebrated its dedication."},
    {he:"השכנים בארץ התנגדו לבנייה ופנו למלך פרס בטענה שירושלים תמרוד, והעבודה הופסקה לזמן רב.",
     ar:"عارض الجيران في البلاد البناء وتوجّهوا إلى ملك فارس بدعوى أن القدس ستتمرّد، فتوقّف العمل زمنًا طويلًا.",
     ru:"Соседи в стране противились стройке и обратились к персидскому царю с доводом, что Иерусалим взбунтуется, и работа надолго встала.",
     en:"The neighbouring peoples opposed the building and appealed to the Persian king, claiming Jerusalem would rebel, and the work was halted for a long time."},
    {he:"ירושלים שבה להיות מרכז דתי, אך בלי מלך — ובראש העם עמד מעתה הכהן הגדול.",
     ar:"عادت القدس مركزًا دينيًّا، لكن بلا ملك — ووقف على رأس الشعب من الآن الكاهن الأعظم.",
     ru:"Иерусалим снова стал религиозным центром, но без царя — и во главе народа отныне стоял первосвященник.",
     en:"Jerusalem became a religious centre again, but without a king — and from now on the high priest stood at the head of the people."}),
  E(-444,
    {he:"נחמיה בונה את חומת ירושלים",ar:"نحميا يبني سور القدس",ru:"Неемия строит стену Иерусалима",en:"Nehemiah rebuilds the wall of Jerusalem"},
    {he:"נחמיה הגיע משושן ברשות המלך, ובנה את חומת ירושלים בחמישים ושניים יום בעוד שומרים עומדים על המשמר.",
     ar:"وصل نحميا من شوشن بإذن الملك، وبنى سور القدس في اثنين وخمسين يومًا وحرّاس على المرصاد.",
     ru:"Неемия прибыл из Суз с разрешения царя и отстроил стену Иерусалима за пятьдесят два дня, пока стражи стояли на карауле.",
     en:"Nehemiah came from Susa with the king's leave, and built the wall of Jerusalem in fifty-two days while guards stood watch."},
    {he:"העיר עמדה פרוצה ובלי הגנה, ותושביה היו חשופים לשוד ולהתנכלות של השכנים.",
     ar:"وقفت المدينة مكشوفة بلا حماية، وكان سكانها عرضة للنهب ولتنكيل الجيران.",
     ru:"Город стоял открытым и беззащитным, и его жители были беззащитны перед грабежом и притеснением соседей.",
     en:"The city stood open and undefended, and its people were exposed to plunder and to harassment by their neighbours."},
    {he:"ירושלים נעשתה שוב עיר של ממש, ועזרא ונחמיה חיזקו בה את קריאת התורה ואת שמירת המצוות.",
     ar:"صارت القدس مدينة حقيقية من جديد، وعزّز عزرا ونحميا فيها قراءة التوراة وحفظ الوصايا.",
     ru:"Иерусалим вновь стал настоящим городом, а Ездра и Неемия укрепили в нём чтение Торы и соблюдение заповедей.",
     en:"Jerusalem became a real city again, and Ezra and Nehemiah strengthened in it the reading of the Torah and the keeping of the commandments."}),
  E(-142,
    {he:"עצמאות החשמונאים",ar:"استقلال الحشمونائيم",ru:"Независимость Хасмонеев",en:"Hasmonean independence"},
    {he:"שמעון החשמונאי השיג הכרה בביטול המס לממלכת סוריה, ויהודה נעשתה מדינה עצמאית בהנהגת בית חשמונאי.",
     ar:"نال شمعون الحشموني اعترافًا بإلغاء الضريبة لمملكة سوريا، وصارت يهودا دولة مستقلّة بقيادة البيت الحشموني.",
     ru:"Симон Хасмоней добился признания отмены дани сирийскому царству, и Иудея стала независимым государством во главе с Хасмонеями.",
     en:"Simon the Hasmonean won recognition that the tax to the Syrian kingdom was cancelled, and Judea became an independent state led by the Hasmonean house."},
    {he:"הממלכה הסלווקית נחלשה ממריבות ירושה, ולא היה בכוחה להמשיך ולהילחם במרד שנמשך עשרים וחמש שנה.",
     ar:"ضعفت المملكة السلوقية من نزاعات الوراثة، ولم تعد تقوى على مواصلة قتال ثورة دامت خمسًا وعشرين سنة.",
     ru:"Селевкидское царство ослабло от споров о наследовании и не могло дальше воевать с восстанием, длившимся двадцать пять лет.",
     en:"The Seleucid kingdom was weakened by quarrels over the succession, and could no longer keep fighting a revolt that had lasted twenty-five years."},
    {he:"קמה מדינה יהודית עצמאית שהחזיקה כשמונים שנה, ובה שימש אדם אחד גם כמלך וגם ככהן גדול.",
     ar:"قامت دولة يهودية مستقلّة دامت نحو ثمانين سنة، تولّى فيها رجل واحد الملك والكهانة العظمى معًا.",
     ru:"Возникло независимое еврейское государство, продержавшееся около восьмидесяти лет, где один человек был и царём, и первосвященником.",
     en:"An independent Jewish state arose that lasted some eighty years, in which one man was both king and high priest."}),
  C({he:"כהן גדול",ar:"الكاهن الأعظم",ru:"Первосвященник",en:"High priest"},
    {he:"ראש עבודת המקדש, היחיד שנכנס לקודש הקודשים ביום הכיפורים, ובימי בית שני גם מנהיג העם בפועל.",
     ar:"رأس خدمة الهيكل، الوحيد الذي يدخل قدس الأقداس في يوم الغفران، وفي عصر الهيكل الثاني قائد الشعب فعليًّا أيضًا.",
     ru:"Глава храмового служения, единственный, кто входил в Святая святых в Йом Кипур, а в эпоху Второго храма — и фактический вождь народа.",
     en:"The head of the Temple service, the only one who entered the Holy of Holies on the Day of Atonement, and in the Second Temple period the people's actual leader as well."})
]);
more("temple2",2,[
  E(-332,
    {he:"אלכסנדר בארץ ישראל",ar:"الإسكندر في أرض إسرائيل",ru:"Александр в Земле Израиля",en:"Alexander in the Land of Israel"},
    {he:"אלכסנדר עבר בארץ בדרכו למצרים, יהודה נכנעה בלי קרב, והשלטון עבר מפרס ליוונים.",
     ar:"مرّ الإسكندر بالبلاد في طريقه إلى مصر، واستسلمت يهودا بلا قتال، وانتقل الحكم من فارس إلى اليونانيين.",
     ru:"Александр прошёл через страну по пути в Египет, Иудея сдалась без боя, и власть перешла от персов к грекам.",
     en:"Alexander passed through the country on his way to Egypt, Judea submitted without a fight, and rule passed from the Persians to the Greeks."},
    {he:"יהודה היתה קטנה ולא ביצורה, וממילא לא היה לה כוח לעמוד מול צבא שהכריע את פרס כולה.",
     ar:"كانت يهودا صغيرة غير محصّنة، ولم تكن لها أصلًا قوّة لمواجهة جيش حسم فارس كلّها.",
     ru:"Иудея была мала и не укреплена, и у неё всё равно не было сил противостоять войску, сокрушившему всю Персию.",
     en:"Judea was small and unfortified, and in any case had no strength to face an army that had overthrown all of Persia."},
    {he:"התרבות היוונית החלה לחדור לארץ, ובתוך דורות אחדים נחלק העם בין מתייוונים לשומרי מסורת.",
     ar:"بدأت الثقافة اليونانية تتغلغل في البلاد، وانقسم الشعب خلال أجيال قليلة بين متأغرقين ومحافظين على التقليد.",
     ru:"Греческая культура начала проникать в страну, и через несколько поколений народ разделился между эллинизаторами и хранителями традиции.",
     en:"Greek culture began to enter the country, and within a few generations the people split between those who took up Greek ways and those who kept the tradition."}),
  E(-4,
    {he:"מות הורדוס וחלוקת ממלכתו",ar:"موت هيرودس وتقسيم مملكته",ru:"Смерть Ирода и раздел его царства",en:"The death of Herod and the division of his kingdom"},
    {he:"עם מות הורדוס חילק הקיסר הרומי את הממלכה בין שלושת בניו, ואף אחד מהם לא נשא בתואר מלך יהודה.",
     ar:"عند موت هيرودس قسّم الإمبراطور الروماني المملكة بين أبنائه الثلاثة، ولم يحمل أيّ منهم لقب ملك يهودا.",
     ru:"По смерти Ирода римский император разделил царство между тремя его сыновьями, и ни один из них не носил титула царя Иудеи.",
     en:"On Herod's death the Roman emperor divided the kingdom among his three sons, and none of them bore the title king of Judea."},
    {he:"הורדוס הוציא להורג את יורשיו הבכירים מחשש למרד, ובניו הנותרים לא היו חזקים דיים להחזיק ממלכה שלמה.",
     ar:"أعدم هيرودس كبار ورثته خشية التمرّد، ولم يكن أبناؤه الباقون أقوياء بما يكفي للاحتفاظ بمملكة كاملة.",
     ru:"Ирод казнил старших наследников из страха мятежа, и оставшиеся сыновья не были достаточно сильны, чтобы удержать целое царство.",
     en:"Herod had put his senior heirs to death for fear of revolt, and the sons who remained were not strong enough to hold a whole kingdom."},
    {he:"הממלכה התפרקה, וזה הצעד הראשון בדרך לשלטון רומי ישיר ביהודה.",
     ar:"تفكّكت المملكة، وكانت تلك الخطوة الأولى نحو حكم روماني مباشر في يهودا.",

     en:"The kingdom fell apart, and this was the first step towards direct Roman rule in Judea."}),
  E(6,

    {he:"רומא הדיחה את ארכלאוס בן הורדוס, מינתה נציב רומי ליהודה וערכה מפקד לצורכי מס.",
     ar:"عزلت روما أرخيلاوس بن هيرودس، وعيّنت واليًا رومانيًّا على يهودا، وأجرت إحصاءً لأغراض الضريبة.",
     ru:"Рим сместил Архелая, сына Ирода, назначил в Иудею римского наместника и провёл перепись для налога.",
     en:"Rome deposed Archelaus son of Herod, appointed a Roman governor over Judea and held a census for taxation."},
    {he:"תושבי יהודה התלוננו בפני הקיסר על אכזריותו של ארכלאוס, ורומא העדיפה שלטון ישיר על שליט כושל.",
     ar:"شكا سكان يهودا إلى الإمبراطور قسوة أرخيلاوس، وفضّلت روما الحكم المباشر على حاكم فاشل.",
     ru:"Жители Иудеи жаловались императору на жестокость Архелая, и Рим предпочёл прямое правление негодному правителю.",
     en:"The people of Judea complained to the emperor about the cruelty of Archelaus, and Rome preferred direct rule to a failed ruler."},
    {he:"המפקד עורר התנגדות עזה וממנו צמחה תנועת הקנאים, שראתה בתשלום מס לרומא בגידה באלוהים.",
     ar:"أثار الإحصاء معارضة شديدة، ومنه نشأت حركة الغيورين التي رأت في دفع الضريبة لروما خيانة لله.",
     ru:"Перепись вызвала резкое сопротивление, и из него выросло движение зелотов, видевшее в уплате налога Риму измену Богу.",
     en:"The census stirred fierce opposition, and out of it grew the movement of the Zealots, who saw paying tax to Rome as a betrayal of God."}),
  C({he:"פרושים וצדוקים",ar:"الفرّيسيون والصدّوقيون",ru:"Фарисеи и саддукеи",en:"Pharisees and Sadducees"},
    {he:"שתי אסכולות שנחלקו בשאלה אם לצד התורה הכתובה קיימת גם תורה שבעל פה מחייבת.",
     ar:"مدرستان اختلفتا في ما إذا كانت إلى جانب التوراة المكتوبة توراة شفويّة ملزمة أيضًا.",
     ru:"Две школы, расходившиеся в вопросе, есть ли наряду с письменной Торой и обязывающая устная.",
     en:"Two schools that differed over whether, alongside the written Torah, there is also a binding oral one."})
]);
more("temple2",3,[
  E(73,
    {he:"נפילת מצדה",ar:"سقوط مسادا",ru:"Падение Масады",en:"The fall of Masada"},
    {he:"הלגיון הרומי בנה סוללת עפר אל ראש הצוק וכבש את המבצר האחרון, ומגיניו לא נלקחו בשבי.",
     ar:"بنى الفيلق الروماني مدكّة ترابية إلى قمّة الجرف وفتح آخر الحصون، ولم يُؤسر المدافعون عنه.",
     ru:"Римский легион насыпал земляной вал к вершине скалы и взял последнюю крепость, а её защитники не сдались в плен.",
     en:"The Roman legion raised an earthen ramp to the top of the cliff and took the last fortress, and its defenders were not taken alive."},
    {he:"אחרי חורבן ירושלים נותרו קבוצות לוחמים במבצרי המדבר, ורומא לא הסכימה להשאיר מוקד מרד פעיל.",
     ar:"بعد خراب القدس بقيت جماعات مقاتلة في حصون الصحراء، ولم توافق روما على ترك بؤرة تمرّد نشطة.",
     ru:"После разрушения Иерусалима в пустынных крепостях остались отряды бойцов, и Рим не желал оставлять действующий очаг мятежа.",
     en:"After the destruction of Jerusalem, bands of fighters remained in the desert fortresses, and Rome would not leave an active centre of revolt."},
    {he:"המרד הגדול הסתיים כליל, והסיפור נעשה סמל שנוי במחלוקת — של גבורה עד הסוף ושל מחיר שאין לו תקנה.",
     ar:"انتهت الثورة الكبرى تمامًا، وصارت الحكاية رمزًا مختلفًا عليه — للبطولة حتى النهاية وللثمن الذي لا يُستدرك.",
     ru:"Великое восстание кончилось совсем, а рассказ стал спорным символом — доблести до конца и невозвратимой цены.",
     en:"The Great Revolt was wholly over, and the story became a disputed symbol — of courage to the end, and of a price beyond repair."}),
  C({he:"מגילות מדבר יהודה",ar:"مخطوطات البحر الميت",ru:"Свитки Мёртвого моря",en:"The Dead Sea Scrolls"},
    {he:"כתבי יד מימי בית שני שנמצאו במערות קומראן, ובהם ספרי מקרא ותקנות של כת שפרשה מירושלים.",
     ar:"مخطوطات من عصر الهيكل الثاني وُجدت في كهوف قمران، فيها أسفار مقدّسة وأنظمة طائفة انفصلت عن القدس.",
     ru:"Рукописи эпохи Второго храма, найденные в пещерах Кумрана, среди них библейские книги и уставы общины, отделившейся от Иерусалима.",
     en:"Manuscripts from the Second Temple period found in the caves of Qumran, among them biblical books and the rules of a sect that had broken away from Jerusalem."}),
  C({he:"עלייה לרגל",ar:"الحجّ إلى الهيكل",ru:"Паломничество в Храм",en:"Pilgrimage to the Temple"},
    {he:"מנהג העלייה לירושלים שלוש פעמים בשנה בחגים, שהביא לעיר המוני אנשים מכל הארץ ומהתפוצות.",
     ar:"عادة الصعود إلى القدس ثلاث مرّات في السنة في الأعياد، وكانت تجلب إلى المدينة جموعًا من البلاد والشتات.",
     ru:"Обычай трижды в год подниматься в Иерусалим на праздники, приводивший в город толпы людей со всей страны и из диаспоры.",
     en:"The custom of going up to Jerusalem three times a year at the festivals, which brought crowds to the city from all over the country and from the diaspora."}),
  Sc({he:["הקנאים לא הניחו לאיש לצאת מן העיר,",
          "ומי שנתפס בורח אל הרומאים נהרג בידי אחיו.",
          "היו בעיר שלוש מחנות, ואלה נלחמו אלה באלה בתוך החומות,",
          "ובעודם נלחמים שרפו זה את מחסני התבואה של זה, והרעב עשה את מלאכתו.",
          "מתוך תולדות מלחמת היהודים ברומאים, יוסף בן מתתיהו."],
      ar:["لم يدع الغيورون أحدًا يخرج من المدينة،",
          "ومن ضُبط هاربًا إلى الرومان قتله إخوته.",
          "كان في المدينة ثلاثة معسكرات، تقاتل بعضها بعضًا داخل الأسوار،",
          "وبينما هم يقتتلون أحرق كلّ منهم مخازن قمح الآخر، وفعل الجوع فعله.",
          "من تاريخ حرب اليهود على الرومان، ليوسيفوس فلافيوس."],
      ru:["Зелоты не давали никому выйти из города,",
          "и всякого, кого ловили при побеге к римлянам, убивали свои же.",
          "В городе было три стана, и они бились друг с другом внутри стен,",
          "и, сражаясь, сжигали хлебные склады один другого, и голод сделал своё дело.",
          "Из «Иудейской войны» Иосифа Флавия."],
      en:["The Zealots let no one leave the city,",
          "and anyone caught fleeing to the Romans was killed by his own people.",
          "There were three camps in the city, and they fought one another inside the walls,",
          "and while they fought they burned each other's stores of grain, and hunger did its work.",
          "From The Jewish War, by Josephus."]},
     [Q({he:"מה מציג המקור כגורם המרכזי לנפילת ירושלים?",ar:"ما الذي يقدّمه المصدر كسبب رئيسي لسقوط القدس؟",ru:"Что источник представляет как главную причину падения Иерусалима?",en:"What does the source present as the main cause of Jerusalem's fall?"},
        {he:"המלחמה בין הסיעות היהודיות בתוך העיר, ששרפה את המזון והחלישה את המגינים.",ar:"القتال بين الفصائل اليهودية داخل المدينة، الذي أحرق الطعام وأضعف المدافعين.",ru:"Война между еврейскими группировками внутри города, которая сожгла запасы и обессилила защитников.",en:"The fighting between the Jewish factions inside the city, which burned the food and weakened the defenders."},
        [{he:"עליונות מספרית מוחלטת של הצבא הרומי בקרב על החומות.",ar:"تفوّق عددي مطلق للجيش الروماني في القتال على الأسوار.",ru:"Полное численное превосходство римского войска в бою у стен.",en:"The sheer numerical superiority of the Roman army in the fighting at the walls."},
         {he:"בגידה של מפקד יהודי שפתח את שערי העיר.",ar:"خيانة قائد يهودي فتح أبواب المدينة.",ru:"Измена еврейского командира, открывшего городские ворота.",en:"The treachery of a Jewish commander who opened the city gates."},
         {he:"מגפה שפרצה בעיר וקטלה את רוב תושביה.",ar:"وباء انتشر في المدينة وأهلك معظم سكانها.",ru:"Эпидемия, вспыхнувшая в городе и погубившая большинство жителей.",en:"A plague that broke out in the city and killed most of its people."}]),
      Q({he:"מה נעשה למי שניסה לצאת מן העיר?",ar:"ماذا كان يحدث لمن حاول الخروج من المدينة؟",ru:"Что делали с тем, кто пытался выйти из города?",en:"What happened to anyone who tried to leave the city?"},
        {he:"הוא נהרג בידי הקנאים היהודים ולא בידי הרומאים.",ar:"كان يُقتل على يد الغيورين اليهود لا على يد الرومان.",ru:"Его убивали еврейские зелоты, а не римляне.",en:"He was killed by the Jewish Zealots, not by the Romans."},
        [{he:"הוא נלקח בשבי בידי הרומאים ונמכר לעבדות.",ar:"كان يُؤسر على يد الرومان ويُباع في العبودية.",ru:"Его брали в плен римляне и продавали в рабство.",en:"He was taken prisoner by the Romans and sold into slavery."},
         {he:"הוא הורשה לצאת אם שילם מס יציאה.",ar:"كان يُسمح له بالخروج إن دفع ضريبة مغادرة.",ru:"Ему разрешали уйти, если он платил выездную пошлину.",en:"He was allowed to leave if he paid an exit tax."},
         {he:"הוא נשלח כשליח לנהל משא ומתן עם הרומאים.",ar:"كان يُرسل مبعوثًا للتفاوض مع الرومان.",ru:"Его посылали послом для переговоров с римлянами.",en:"He was sent as an envoy to negotiate with the Romans."}])])
]);

more("feudal",1,[

     ar:"عبر ويليام دوق نورماندي القناة، وانتصر في معركة هيستنغز، وتُوّج ملكًا على إنجلترا.",

more("feudal",2,[
