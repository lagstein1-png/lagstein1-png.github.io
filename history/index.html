    {he:"שני המרכזים נחלקו זה מזה בשפה, במנהגי הפולחן ובשאלה אם לאפיפיור סמכות על הכנסייה כולה.",
     ar:"اختلف المركزان في اللغة وطقوس العبادة وفي مسألة سلطة البابا على الكنيسة كلّها.",
     ru:"Два центра расходились в языке, в обрядах и в вопросе, есть ли у папы власть над всей Церковью.",
     en:"The two centres differed in language, in the forms of worship, and over whether the pope had authority over the whole Church."},
    {he:"אירופה נחלקה לשני עולמות דתיים, והקרע הזה לא אוחה עד היום.",
     ar:"انقسمت أوروبا إلى عالمين دينيّين، ولم يُرتق هذا الصدع حتى اليوم.",
     ru:"Европа разделилась на два религиозных мира, и этот разрыв не залечен до сего дня.",
     en:"Europe divided into two religious worlds, and that breach has not been healed to this day."}),
  E(1291,
    {he:"נפילת עכו",ar:"سقوط عكّا",ru:"Падение Акры",en:"The fall of Acre"},
    {he:"הממלוכים כבשו את עכו, מעוזם האחרון של הצלבנים, ובכך תמה נוכחותם בארץ ישראל.",
     ar:"فتح المماليك عكّا، آخر معاقل الصليبيين، وبذلك انتهى وجودهم في أرض إسرائيل.",
     ru:"Мамлюки взяли Акру, последний оплот крестоносцев, и тем их присутствие в Земле Израиля кончилось.",
     en:"The Mamluks took Acre, the last stronghold of the Crusaders, and with it their presence in the Land of Israel ended."},
    {he:"הממלכה הצלבנית הצטמצמה לרצועת חוף, האצילים בה רבו ביניהם, וסיוע מאירופה כמעט חדל להגיע.",
     ar:"تقلّصت المملكة الصليبية إلى شريط ساحلي، وتنازع نبلاؤها فيما بينهم، وكاد العون من أوروبا ينقطع.",
     ru:"Государство крестоносцев сжалось до прибрежной полосы, его знать перессорилась, а помощь из Европы почти перестала приходить.",
     en:"The Crusader kingdom had shrunk to a coastal strip, its nobles quarrelled among themselves, and help from Europe had almost stopped coming."},
    {he:"מאתיים שנות שלטון צלבני במזרח הסתיימו, ואירופה הפנתה את מרצה לדרכי ים חדשות אל אסיה.",
     ar:"انتهت مئتا سنة من الحكم الصليبي في المشرق، ووجّهت أوروبا جهدها إلى طرق بحرية جديدة نحو آسيا.",
     ru:"Двести лет крестоносного правления на Востоке завершились, и Европа обратила силы к новым морским путям в Азию.",
     en:"Two hundred years of Crusader rule in the East were over, and Europe turned its energies to new sea routes to Asia."}),
  E(1337,
    {he:"פרוץ מלחמת מאה השנים",ar:"اندلاع حرب المئة عام",ru:"Начало Столетней войны",en:"The outbreak of the Hundred Years' War"},
    {he:"מלך אנגליה תבע לעצמו את כתר צרפת, ובין שתי הממלכות החלה מלחמה שנמשכה בהפסקות מאה ושש עשרה שנה.",
     ar:"طالب ملك إنجلترا بتاج فرنسا لنفسه، وبدأت بين المملكتين حرب دامت بانقطاعات مئة وستّ عشرة سنة.",
     ru:"Король Англии заявил права на французскую корону, и между королевствами началась война, длившаяся с перерывами сто шестнадцать лет.",
     en:"The king of England claimed the crown of France for himself, and a war began between the two kingdoms that lasted, with breaks, a hundred and sixteen years."},
    {he:"למלכי אנגליה היו אחוזות בצרפת, ומלך צרפת ביקש לקחתן — ואילו שושלת צרפת נותרה בלי יורש ישיר.",
     ar:"كانت لملوك إنجلترا ضياع في فرنسا، وأراد ملك فرنسا انتزاعها — وبقيت سلالة فرنسا بلا وريث مباشر.",
     ru:"У английских королей были владения во Франции, и французский король хотел их отнять, а французская династия осталась без прямого наследника.",
     en:"The kings of England held estates in France, and the king of France meant to take them — while the French line was left without a direct heir."},
    {he:"האבירות איבדה את בכורתה בשדה הקרב מפני קשתים ורובאים, וצרפת ואנגליה יצאו מהמלחמה כשתי אומות נפרדות.",
     ar:"فقدت الفروسية صدارتها في ساحة القتال أمام الرماة والبنادق، وخرجت فرنسا وإنجلترا من الحرب كأمّتين منفصلتين.",
     ru:"Рыцарство утратило первенство на поле боя перед лучниками и ружьями, а Франция и Англия вышли из войны двумя отдельными нациями.",
     en:"Knighthood lost its primacy on the battlefield to archers and firearms, and France and England came out of the war as two separate nations."}),
  C({he:"צמית",ar:"القنّ",ru:"Крепостной",en:"Serf"},
    {he:"איכר הקשור לאדמה שעליה נולד, שאינו רשאי לעזוב אותה, וחייב בעבודה ובתשלום לבעל האחוזה.",
     ar:"فلّاح مرتبط بالأرض التي وُلد عليها، لا يحقّ له تركها، وعليه العمل والدفع لصاحب الضيعة.",
     ru:"Крестьянин, привязанный к земле, на которой родился, не вправе её покинуть и обязанный трудом и платежами владельцу поместья.",
     en:"A peasant bound to the land where he was born, not free to leave it, and owing labour and payment to the lord of the manor."})
]);
more("feudal",3,[
  E(1381,
    {he:"מרד האיכרים באנגליה",ar:"ثورة الفلّاحين في إنجلترا",ru:"Восстание крестьян в Англии",en:"The Peasants' Revolt in England"},
    {he:"עשרות אלפי איכרים צעדו על לונדון, דרשו את ביטול הצמיתות, ופיזרו את המרד רק אחרי שמנהיגם נהרג.",
     ar:"زحف عشرات آلاف الفلّاحين على لندن، وطالبوا بإلغاء القنانة، ولم تتفرّق الثورة إلا بعد مقتل قائدهم.",
     ru:"Десятки тысяч крестьян двинулись на Лондон, требуя отмены крепостной зависимости, и разошлись лишь после гибели своего вождя.",
     en:"Tens of thousands of peasants marched on London demanding an end to serfdom, and dispersed only after their leader was killed."},
    {he:"המגפה הותירה מעט עובדים ושכרם עלה, אך החוק אסר להעלותו — ומס גולגולת חדש הצית את הכעס.",
     ar:"تركت الجائحة عمّالًا قليلين فارتفعت أجورهم، لكن القانون منع رفعها — وأشعلت ضريبة رؤوس جديدة الغضب.",
     ru:"Чума оставила мало работников, и плата за труд выросла, но закон запрещал её повышать — а новый подушный налог поджёг гнев.",
     en:"The plague had left few workers and wages rose, but the law forbade raising them — and a new poll tax set the anger alight."},
    {he:"המרד דוכא, אך מס הגולגולת בוטל והצמיתות נסוגה בהדרגה מאליה בשל המחסור בעובדים.",
     ar:"قُمعت الثورة، لكن ضريبة الرؤوس أُلغيت وتراجعت القنانة تدريجيًّا من تلقاء نفسها بسبب نقص العمّال.",
     ru:"Восстание подавили, но подушный налог отменили, а крепостная зависимость сама постепенно отступила из-за нехватки рабочих рук.",
     en:"The revolt was put down, but the poll tax was dropped and serfdom faded of itself as the shortage of workers went on."}),
  C({he:"גילדה",ar:"النقابة الحرفية",ru:"Цех — ремесленная гильдия",en:"Guild"},
    {he:"התאגדות של בעלי מלאכה מאותו מקצוע בעיר, שקבעה מחירים, איכות ומספר החניכים שיוכשרו.",
     ar:"تنظيم لأصحاب حرفة واحدة في المدينة، يحدّد الأسعار والجودة وعدد المتدرّبين الذين يُدرَّبون.",
     ru:"Объединение ремесленников одного дела в городе, устанавливавшее цены, качество и число обучаемых учеников.",
     en:"An association of craftsmen of one trade in a town, which set prices, quality and the number of apprentices to be trained."}),
  C({he:"אבירות",ar:"مثال الفروسية",ru:"Рыцарский кодекс",en:"Chivalry"},
    {he:"קוד ההתנהגות של האביר, שחייב אותו לנאמנות לאדונו, להגנה על החלשים ולכיבוד יריב במלחמה.",
     ar:"مدوّنة سلوك الفارس، تلزمه بالولاء لسيّده وحماية الضعفاء واحترام الخصم في الحرب.",
     ru:"Свод правил поведения рыцаря, обязывавший его к верности сеньору, защите слабых и уважению к противнику в бою.",
     en:"The knight's code of conduct, binding him to loyalty to his lord, to the protection of the weak and to respect for an opponent in war."}),
  Sc({he:["איש חופשי לא ייעצר ולא ייאסר, לא יישלל רכושו ולא יוגלה,",
          "ולא נפגע בו בשום דרך אחרת,",
          "אלא על פי משפט חוקי של שווי מעמדו או על פי חוק הארץ.",
          "לאיש לא נמכור, לאיש לא נסרב ולא נדחה, צדק או משפט.",
          "מתוך המגנה כרטה, אנגליה, 1215."],
      ar:["لا يُعتقل رجل حرّ ولا يُسجن، ولا يُنزع ملكه ولا يُنفى،",
          "ولا يُمسّ بأيّ وجه آخر،",
          "إلا بمحاكمة قانونية من أنداده أو بموجب قانون البلاد.",
          "لا نبيع لأحد، ولا نرفض ولا نؤخّر عن أحد، عدلًا أو قضاءً.",
          "من الماغنا كارتا، إنجلترا، 1215."],
      ru:["Ни один свободный человек не будет задержан или заключён, лишён имущества или изгнан,",
          "и не будет притеснён никаким иным образом,",
          "иначе как по законному приговору равных ему или по закону страны.",
          "Никому не будем продавать, никому не будем отказывать или задерживать право и правосудие.",
          "Из Великой хартии вольностей, Англия, 1215 год."],
      en:["No free man shall be seized or imprisoned, stripped of his property or exiled,",
          "nor harmed in any other way,",
          "except by the lawful judgement of his equals or by the law of the land.",
          "To no one will we sell, to no one will we refuse or delay, right or justice.",
          "From Magna Carta, England, 1215."]},
     [Q({he:"על מי חלה ההגנה שבסעיף, לפי לשונו?",ar:"على من تسري الحماية الواردة في البند، بحسب لفظه؟",ru:"На кого распространяется защита статьи, судя по её тексту?",en:"To whom does the clause's protection apply, by its own wording?"},
        {he:"על אנשים חופשיים בלבד — והצמיתים, שהיו רוב האוכלוסייה, אינם בכללם.",ar:"على الأحرار فقط — والأقنان، وكانوا أكثرية السكان، ليسوا منهم.",ru:"Только на свободных людей — а крепостные, составлявшие большинство населения, в их число не входят.",en:"To free men only — and the serfs, who were most of the population, are not among them."},
        [{he:"על כל תושבי אנגליה, בלי הבדל מעמד.",ar:"على كلّ سكان إنجلترا، بلا فرق في المكانة.",ru:"На всех жителей Англии, без различия положения.",en:"To all the inhabitants of England, without distinction of rank."},
         {he:"על האצילים והבישופים בלבד.",ar:"على النبلاء والأساقفة فقط.",ru:"Только на знать и епископов.",en:"To the nobles and the bishops only."},
         {he:"על סוחרים זרים הפועלים בממלכה.",ar:"على التجّار الأجانب العاملين في المملكة.",ru:"На иностранных купцов, торгующих в королевстве.",en:"To foreign merchants trading in the kingdom."}]),
      Q({he:"מה מגבילה השורה האחרונה?",ar:"ما الذي يقيّده السطر الأخير؟",ru:"Что ограничивает последняя строка?",en:"What does the last line limit?"},
        {he:"את כוחו של המלך עצמו — אסור לו למכור צדק, לסרב לתת אותו או להשהותו.",ar:"سلطة الملك نفسه — لا يجوز له بيع العدل ولا رفضه ولا تأخيره.",ru:"Власть самого короля — ему нельзя продавать правосудие, отказывать в нём или его затягивать.",en:"The power of the king himself — he may not sell justice, refuse it or delay it."},
        [{he:"את כוחם של הבישופים לגבות מס מן הכנסייה.",ar:"سلطة الأساقفة في جباية ضريبة من الكنيسة.",ru:"Власть епископов взимать налог с Церкви.",en:"The bishops' power to levy a tax on the Church."},
         {he:"את מספר האבירים שאציל רשאי להחזיק.",ar:"عدد الفرسان الذين يحقّ للنبيل الاحتفاظ بهم.",ru:"Число рыцарей, которых вправе держать сеньор.",en:"The number of knights a noble may keep."},
         {he:"את זכותם של האיכרים לעזוב את האחוזה.",ar:"حقّ الفلّاحين في مغادرة الضيعة.",ru:"Право крестьян покидать поместье.",en:"The right of the peasants to leave the manor."}])])
]);

more("islam",1,[
  E(630,
    {he:"הכניעה של מכה",ar:"فتح مكّة",ru:"Покорение Мекки",en:"The submission of Mecca"},
    {he:"מוחמד נכנס למכה כמעט בלי קרב, ניקה את הכעבה מפסלי האלילים והפך אותה למקום הקדוש של האסלאם.",
     ar:"دخل محمّد مكّة بلا قتال تقريبًا، وطهّر الكعبة من الأصنام، وجعلها المكان المقدّس للإسلام.",
     ru:"Мухаммад вошёл в Мекку почти без боя, очистил Каабу от идолов и сделал её святым местом ислама.",
     en:"Muhammad entered Mecca almost without a fight, cleared the Kaaba of its idols and made it the holy place of Islam."},
    {he:"שבטי מכה איבדו את בעלי בריתם ואת השליטה בדרכי השיירות, ומעמדם היה חלש מכדי לעמוד במצור.",
     ar:"فقدت قبائل مكّة حلفاءها والسيطرة على طرق القوافل، وكان موقعها أضعف من أن يصمد لحصار.",
     ru:"Мекканские племена потеряли союзников и власть над караванными путями, и их положение было слишком слабым, чтобы выдержать осаду.",
     en:"The tribes of Mecca had lost their allies and their hold on the caravan routes, and were too weak to withstand a siege."},
    {he:"שבטי ערב הצטרפו בזה אחר זה, וחצי האי התאחד תחת אמונה אחת בתוך שנים אחדות.",
     ar:"انضمّت قبائل العرب واحدة تلو الأخرى، واتّحدت شبه الجزيرة تحت عقيدة واحدة في سنوات قليلة.",
     ru:"Аравийские племена присоединялись одно за другим, и полуостров объединился под одной верой за считаные годы.",
     en:"The tribes of Arabia joined one after another, and the peninsula was united under one faith within a few years."}),
  E(632,
    {he:"מות מוחמד ובחירת הח׳ליף הראשון",ar:"وفاة محمّد واختيار أوّل خليفة",ru:"Смерть Мухаммада и избрание первого халифа",en:"The death of Muhammad and the first caliph"},
    {he:"אחרי מות הנביא בחרו ראשי הקהילה באבו בכר לעמוד בראשה, כממשיך דרכו ולא כנביא חדש.",
     ar:"بعد وفاة النبيّ اختار وجوه الجماعة أبا بكر ليقودها، خليفةً على نهجه لا نبيًّا جديدًا.",
     ru:"После смерти Пророка старейшины общины избрали Абу Бакра во главе её — как продолжателя, а не как нового пророка.",
     en:"After the Prophet's death the leaders of the community chose Abu Bakr to head it, as a successor to his way and not as a new prophet."},
    {he:"מוחמד לא הותיר בן ולא קבע יורש בבירור, ושבטים אחדים ראו במותו סוף הברית וניסו לפרוש.",
     ar:"لم يترك محمّد ابنًا ولم يعيّن خليفة بوضوح، ورأت قبائل في موته انتهاء العهد فحاولت الانفصال.",
     ru:"Мухаммад не оставил сына и ясно не назначил преемника, и некоторые племена сочли его смерть концом союза и попытались отделиться.",
     en:"Muhammad left no son and named no successor clearly, and some tribes took his death as the end of the covenant and tried to break away."},
    {he:"נוצרה משרת הח׳ליף, אך המחלוקת על מי ראוי לה הולידה את הפילוג בין סונים לשיעים.",
     ar:"نشأ منصب الخليفة، لكن الخلاف على من يستحقّه ولّد الانقسام بين السنّة والشيعة.",
     ru:"Возникла должность халифа, но спор о том, кто её достоин, породил раскол между суннитами и шиитами.",
     en:"The office of caliph came into being, but the dispute over who deserved it gave birth to the split between Sunnis and Shiites."}),
  E(661,
    {he:"עליית בית אומיה",ar:"قيام الدولة الأمويّة",ru:"Приход Омейядов к власти",en:"The rise of the Umayyads"},
    {he:"מועאויה השתלט על הח׳ליפות, העביר את הבירה לדמשק, והמשרה עברה בירושה במשפחתו.",
     ar:"استولى معاوية على الخلافة، ونقل العاصمة إلى دمشق، وصار المنصب وراثيًّا في أسرته.",
     ru:"Муавия захватил халифат, перенёс столицу в Дамаск, и должность стала наследственной в его роду.",
     en:"Muawiya took over the caliphate, moved the capital to Damascus, and the office became hereditary in his family."},
    {he:"מלחמת אחים על הח׳ליפות הסתיימה בניצחון מושל סוריה, שבידיו היה הצבא המאורגן ביותר.",
     ar:"انتهت حرب أهلية على الخلافة بانتصار والي الشام، الذي كان بيده الجيش الأكثر تنظيمًا.",
     ru:"Междоусобная война за халифат кончилась победой наместника Сирии, у которого было самое устроенное войско.",
     en:"A civil war over the caliphate ended in victory for the governor of Syria, who held the best-organised army."},
    {he:"הח׳ליפות נעשתה ממלכה יורשת, וממנה יצאו הכיבושים שהגיעו מספרד ועד גבול הודו.",
     ar:"صارت الخلافة ملكًا وراثيًّا، ومنها انطلقت الفتوح التي بلغت من الأندلس إلى حدود الهند.",
     ru:"Халифат стал наследственным царством, и из него пошли завоевания, дошедшие от Испании до границ Индии.",
     en:"The caliphate became a hereditary monarchy, and from it went out the conquests that reached from Spain to the borders of India."}),
  C({he:"מסגד",ar:"المسجد",ru:"Мечеть",en:"Mosque"},
    {he:"בית תפילה מוסלמי, ובו גומחה המורה את כיוון מכה ומגדל שממנו נקראים המאמינים לתפילה.",
     ar:"بيت صلاة للمسلمين، فيه محراب يدلّ على اتّجاه مكّة ومئذنة يُدعى منها المؤمنون إلى الصلاة.",
     ru:"Мусульманский дом молитвы, где есть ниша, указывающая направление на Мекку, и башня, с которой созывают верующих на молитву.",
     en:"A Muslim house of prayer, with a niche marking the direction of Mecca and a tower from which the faithful are called to prayer."})
]);
more("islam",2,[
  E(762,
    {he:"ייסוד בגדאד",ar:"تأسيس بغداد",ru:"Основание Багдада",en:"The founding of Baghdad"},
    {he:"הח׳ליף אלמנצור בנה על נהר החידקל עיר עגולה מתוכננת, ועשה אותה בירת האימפריה העבאסית.",
     ar:"بنى الخليفة المنصور على نهر دجلة مدينة مدوّرة مخطّطة، وجعلها عاصمة الدولة العبّاسية.",
     ru:"Халиф аль-Мансур построил на Тигре круглый, заранее распланированный город и сделал его столицей Аббасидской державы.",
     en:"The caliph al-Mansur built a planned round city on the Tigris and made it the capital of the Abbasid empire."},
    {he:"מרכז הכובד של האימפריה נדד מזרחה אל פרס ומסופוטמיה, ודמשק היתה רחוקה מדי מן הנתינים החדשים.",
     ar:"انتقل مركز ثقل الإمبراطورية شرقًا إلى فارس وبلاد الرافدين، وكانت دمشق بعيدة جدًّا عن الرعايا الجدد.",
     ru:"Центр тяжести державы сместился на восток, в Персию и Месопотамию, а Дамаск был слишком далёк от новых подданных.",
     en:"The empire's centre of gravity moved east to Persia and Mesopotamia, and Damascus lay too far from the new subjects."},
    {he:"בגדאד נעשתה העיר הגדולה בעולם ומרכז מסחר ומדע, ואליה זרמו ידע וספרים מיוון, מהודו ומפרס.",
     ar:"صارت بغداد أكبر مدن العالم ومركز تجارة وعلم، وتدفّقت إليها المعارف والكتب من اليونان والهند وفارس.",
     ru:"Багдад стал крупнейшим городом мира и средоточием торговли и науки, и в него стекались знания и книги из Греции, Индии и Персии.",
     en:"Baghdad became the largest city in the world and a centre of trade and learning, drawing knowledge and books from Greece, India and Persia."}),
  E(929,
    {he:"הח׳ליפות בקורדובה",ar:"خلافة قرطبة",ru:"Кордовский халифат",en:"The caliphate of Córdoba"},
    {he:"עבד אלרחמן השלישי הכריז על עצמו ח׳ליף בקורדובה, וספרד המוסלמית נעשתה מרכז עצמאי ומשגשג.",
     ar:"أعلن عبد الرحمن الثالث نفسه خليفة في قرطبة، وصارت الأندلس مركزًا مستقلًّا مزدهرًا.",
     ru:"Абд ар-Рахман III провозгласил себя халифом в Кордове, и мусульманская Испания стала самостоятельным цветущим центром.",
     en:"Abd al-Rahman III declared himself caliph in Córdoba, and Muslim Spain became an independent and flourishing centre."},
    {he:"בגדאד נחלשה ואיבדה את שליטתה במערב, ושליט ספרד סירב להכיר עוד במרותו של ח׳ליף רחוק.",
     ar:"ضعفت بغداد وفقدت سيطرتها على الغرب، ورفض حاكم الأندلس الاعتراف بعد بسلطة خليفة بعيد.",
     ru:"Багдад ослаб и потерял власть над Западом, и правитель Испании отказался далее признавать далёкого халифа.",
     en:"Baghdad had weakened and lost its grip on the west, and the ruler of Spain refused to acknowledge a distant caliph any longer."},
    {he:"קורדובה נעשתה לעיר הגדולה באירופה, ובה פרחו הרפואה, השירה והפילוסופיה של מוסלמים, נוצרים ויהודים.",
     ar:"صارت قرطبة أكبر مدن أوروبا، وازدهر فيها الطبّ والشعر والفلسفة لمسلمين ومسيحيين ويهود.",
     ru:"Кордова стала крупнейшим городом Европы, и в ней процветали медицина, поэзия и философия мусульман, христиан и евреев.",
     en:"Córdoba became the largest city in Europe, and in it the medicine, poetry and philosophy of Muslims, Christians and Jews flourished."}),
  E(1236,
    {he:"נפילת קורדובה בידי הנוצרים",ar:"سقوط قرطبة بيد المسيحيين",ru:"Падение Кордовы под ударом христиан",en:"The fall of Córdoba to the Christians"},
    {he:"פרננדו השלישי מלך קסטיליה כבש את קורדובה, והמסגד הגדול שבה הוסב לכנסייה.",
     ar:"فتح فرناندو الثالث ملك قشتالة قرطبة، وحُوّل مسجدها الكبير إلى كنيسة.",
     ru:"Фернандо III, король Кастилии, взял Кордову, и её великая мечеть была обращена в церковь.",
     en:"Ferdinand III of Castile took Córdoba, and its great mosque was turned into a church."},
    {he:"הח׳ליפות בספרד התפוררה למדינות קטנות ויריבות, וכל אחת מהן היתה חלשה מכדי לעצור את הממלכות הנוצריות.",
     ar:"تفكّكت الخلافة في الأندلس إلى دويلات صغيرة متنازعة، وكانت كلّ منها أضعف من أن توقف الممالك المسيحية.",
     ru:"Халифат в Испании распался на мелкие враждующие государства, и каждое было слишком слабо, чтобы остановить христианские королевства.",
     en:"The caliphate in Spain had broken up into small rival states, and each was too weak to stop the Christian kingdoms."},
    {he:"הרקונקיסטה התקדמה כמעט עד סופה, ורק גרנדה נותרה מוסלמית עוד מאתיים חמישים שנה.",
     ar:"تقدّمت حركة الاسترداد حتى شارفت نهايتها، ولم تبقَ مسلمة إلا غرناطة مئتين وخمسين سنة أخرى.",
     ru:"Реконкиста продвинулась почти до конца, и мусульманской осталась лишь Гранада ещё двести пятьдесят лет.",
     en:"The Reconquista advanced almost to its end, and only Granada remained Muslim for another two hundred and fifty years."}),
  C({he:"חמשת עמודי האסלאם",ar:"أركان الإسلام الخمسة",ru:"Пять столпов ислама",en:"The five pillars of Islam"},
    {he:"החובות שכל מוסלמי מחויב בהן: הצהרת אמונה, תפילה, צדקה, צום הרמדאן ועלייה לרגל למכה.",
     ar:"الفرائض التي يلتزم بها كلّ مسلم: الشهادة والصلاة والزكاة وصوم رمضان والحجّ إلى مكّة.",
     ru:"Обязанности каждого мусульманина: свидетельство веры, молитва, милостыня, пост в рамадан и паломничество в Мекку.",
     en:"The duties binding on every Muslim: the declaration of faith, prayer, alms, the fast of Ramadan and the pilgrimage to Mecca."})
]);
more("islam",3,[
  E(1517,
    {he:"העות׳מאנים כובשים את ארץ ישראל ומצרים",ar:"العثمانيون يفتحون بلاد الشام ومصر",ru:"Османы завоёвывают Землю Израиля и Египет",en:"The Ottomans conquer the Land of Israel and Egypt"},
    {he:"הסולטאן סלים הראשון הביס את הממלוכים, וארץ ישראל, סוריה ומצרים עברו לשלטון עות׳מאני לארבע מאות שנה.",
     ar:"هزم السلطان سليم الأول المماليك، وانتقلت بلاد الشام ومصر إلى الحكم العثماني أربعمئة سنة.",
     ru:"Султан Селим I разбил мамлюков, и Земля Израиля, Сирия и Египет перешли под османскую власть на четыреста лет.",
     en:"Sultan Selim I defeated the Mamluks, and the Land of Israel, Syria and Egypt passed under Ottoman rule for four hundred years."},
    {he:"לעות׳מאנים היו תותחים ורובים ואילו צבא הממלוכים נשען על פרשים, והפער בנשק הכריע את הקרבות.",
     ar:"كان للعثمانيين مدافع وبنادق بينما اعتمد جيش المماليك على الفرسان، وحسم فارق السلاح المعارك.",
     ru:"У османов были пушки и ружья, а войско мамлюков опиралось на конницу, и разрыв в вооружении решил исход сражений.",
     en:"The Ottomans had cannon and firearms while the Mamluk army rested on cavalry, and the gap in weapons decided the battles."},
    {he:"הסולטאן נטל לעצמו את תואר הח׳ליף ואת השמירה על ערי הקודש, ואיסטנבול נעשתה מרכז העולם המוסלמי.",
     ar:"اتّخذ السلطان لنفسه لقب الخليفة وحماية الحرمين، وصارت إسطنبول مركز العالم الإسلامي.",
     ru:"Султан взял себе титул халифа и опеку над священными городами, и Стамбул стал средоточием мусульманского мира.",
     en:"The sultan took for himself the title of caliph and the guardianship of the holy cities, and Istanbul became the centre of the Muslim world."}),
  C({he:"קוראן",ar:"القرآن",ru:"Коран",en:"The Quran"},
    {he:"ספר הקודש של האסלאם, שלפי האמונה נמסר למוחמד מפי האל בערבית, והוא מקור החוק והאמונה.",
     ar:"كتاب الإسلام المقدّس، أُنزل بحسب العقيدة على محمّد من الله بالعربية، وهو مصدر الشرع والعقيدة.",
     ru:"Священная книга ислама, по вере ниспосланная Мухаммаду от Бога по-арабски, источник закона и веры.",
     en:"The holy book of Islam, held by believers to have been given to Muhammad from God in Arabic, and the source of law and faith."}),
  C({he:"מדרסה",ar:"المدرسة الدينية",ru:"Медресе",en:"Madrasa"},
    {he:"בית מדרש מוסלמי שבו נלמדו הקוראן, החוק הדתי, הדקדוק והחשבון, ולעיתים גם רפואה ואסטרונומיה.",
     ar:"مدرسة إسلامية يُدرَّس فيها القرآن والفقه والنحو والحساب، وأحيانًا الطبّ والفلك.",
     ru:"Мусульманское училище, где изучали Коран, религиозное право, грамматику и счёт, а порой медицину и астрономию.",
     en:"A Muslim school where the Quran, religious law, grammar and arithmetic were taught, and sometimes medicine and astronomy too."}),
  Sc({he:["התנינו לכם על עצמנו שלא נבנה במקומותינו מנזר, כנסייה או מסגד חדש,",
          "ולא נחדש את מה שנהרס מהם.",
          "ולא נמנע מן המוסלמים לחסות בכנסיותינו, בלילה או ביום,",
          "ונפנה להם את מושבותינו ונכבד אותם, ולא נדמה להם בלבושנו.",
          "מתוך תנאי עומר, מסמך המסדיר את מעמד בני החסות."],
      ar:["اشترطنا على أنفسنا ألّا نُحدث في مدائننا ديرًا ولا كنيسة ولا مسجدًا جديدًا،",
          "ولا نجدّد ما خرب منها.",
          "وألّا نمنع المسلمين من النزول في كنائسنا، ليلًا أو نهارًا،",
          "وأن نوسّع لهم مجالسنا ونوقّرهم، وألّا نتشبّه بهم في لباسنا.",
          "من شروط عمر، الوثيقة المنظّمة لمكانة أهل الذمّة."],
      ru:["Мы приняли на себя обязательство не строить в наших городах нового монастыря, церкви или молельни",
          "и не восстанавливать из них того, что разрушилось.",
          "И не препятствовать мусульманам укрываться в наших церквах ночью или днём,",
          "и уступать им наши места, и почитать их, и не уподобляться им в одежде.",
          "Из «Условий Умара», документа о положении покровительствуемых."],
      en:["We took upon ourselves not to build in our towns any new monastery, church or cell,",
          "nor to restore those of them that fall into ruin.",
          "And not to keep Muslims from lodging in our churches, by night or by day,",
          "and to give up our seats to them and honour them, and not to imitate them in our dress.",
          "From the Pact of Umar, the document setting out the status of the protected communities."]},
     [Q({he:"מה מסדיר המסמך?",ar:"ما الذي تنظّمه الوثيقة؟",ru:"Что регулирует документ?",en:"What does the document regulate?"},
        {he:"את מעמדם של הנוצרים והיהודים תחת שלטון מוסלמי — הגנה בתמורה למגבלות ולמס.",ar:"مكانة المسيحيين واليهود تحت الحكم الإسلامي — حماية مقابل قيود وضريبة.",ru:"Положение христиан и евреев под мусульманской властью — защита в обмен на ограничения и налог.",en:"The standing of Christians and Jews under Muslim rule — protection in exchange for restrictions and a tax."},
        [{he:"את חלוקת השלל בין הלוחמים אחרי כיבוש עיר.",ar:"قسمة الغنائم بين المقاتلين بعد فتح مدينة.",ru:"Раздел добычи между воинами после взятия города.",en:"The division of spoils among the fighters after a city is taken."},
         {he:"את סדרי התפילה במסגד ואת תפקידי האימאם.",ar:"نظام الصلاة في المسجد ووظائف الإمام.",ru:"Порядок молитвы в мечети и обязанности имама.",en:"The order of prayer in the mosque and the duties of the imam."},
         {he:"את היחסים בין הח׳ליף לבין מושלי המחוזות.",ar:"العلاقات بين الخليفة وولاة الأقاليم.",ru:"Отношения между халифом и наместниками областей.",en:"The relations between the caliph and the provincial governors."}]),
      Q({he:"מה מלמד האיסור לבנות ולשפץ בתי תפילה?",ar:"ماذا يعلّمنا منع البناء وترميم دور العبادة؟",ru:"О чём говорит запрет строить и чинить дома молитвы?",en:"What does the ban on building and repairing houses of worship show?"},
        {he:"שהדתות האחרות הותרו להתקיים אך לא לגדול — הן נסבלות ואינן שוות.",ar:"أن الديانات الأخرى سُمح لها بالبقاء لا بالنموّ — فهي مُحتمَلة لا متساوية.",ru:"Что другим религиям позволено существовать, но не расти — их терпят, но не уравнивают.",en:"That the other faiths were allowed to exist but not to grow — they are tolerated, not equal."},
        [{he:"שהדתות האחרות נאסרו לחלוטין בשטח המוסלמי.",ar:"أن الديانات الأخرى مُنعت منعًا تامًّا في أرض المسلمين.",ru:"Что другие религии были полностью запрещены на мусульманской земле.",en:"That the other faiths were entirely forbidden in Muslim territory."},
         {he:"שהמדינה מימנה את בנייתם של בתי תפילה לכל הדתות.",ar:"أن الدولة موّلت بناء دور العبادة لكلّ الديانات.",ru:"Что государство оплачивало постройку молитвенных домов всех религий.",en:"That the state paid for building houses of worship for all religions."},
         {he:"שבתי התפילה הישנים נהרסו כולם בפקודה.",ar:"أن دور العبادة القديمة هُدمت كلّها بأمر.",ru:"Что все старые молитвенные дома были разрушены по приказу.",en:"That all the old houses of worship were demolished by order."}])])
]);

more("renaissance",1,[
  E(1498,
    {he:"ואסקו דה גאמה מגיע להודו",ar:"فاسكو دا غاما يصل إلى الهند",ru:"Васко да Гама достигает Индии",en:"Vasco da Gama reaches India"},
    {he:"הצי הפורטוגלי הקיף את אפריקה והגיע לחופי הודו, ופתח דרך ים ישירה אל ארצות התבלינים.",
     ar:"طاف الأسطول البرتغالي حول أفريقيا وبلغ سواحل الهند، وفتح طريقًا بحريًّا مباشرًا إلى بلاد التوابل.",
     ru:"Португальский флот обогнул Африку и достиг берегов Индии, открыв прямой морской путь в страны пряностей.",
     en:"The Portuguese fleet rounded Africa and reached the coast of India, opening a direct sea route to the lands of spices."},
    {he:"התבלינים הגיעו לאירופה דרך סוחרים מוסלמיים ואיטלקיים ומחירם הוכפל בכל תחנה, ופורטוגל ביקשה לעקוף אותם.",
     ar:"وصلت التوابل إلى أوروبا عبر تجّار مسلمين وإيطاليين وتضاعف ثمنها في كلّ محطّة، فأرادت البرتغال تجاوزهم.",
     ru:"Пряности приходили в Европу через мусульманских и итальянских купцов, и цена их удваивалась на каждой остановке; Португалия хотела их обойти.",
     en:"Spices reached Europe through Muslim and Italian merchants and doubled in price at every stage, and Portugal wanted to bypass them."},
    {he:"המסחר העולמי עבר מהים התיכון לאוקיינוסים, וערי איטליה שהתעשרו ממנו החלו לדעוך.",
     ar:"انتقلت التجارة العالمية من البحر المتوسّط إلى المحيطات، وبدأت مدن إيطاليا التي اغتنت منها بالأفول.",
     ru:"Мировая торговля перешла из Средиземного моря в океаны, и разбогатевшие на ней города Италии стали клониться к упадку.",
     en:"World trade moved from the Mediterranean to the oceans, and the cities of Italy that had grown rich on it began to decline."}),
  E(1508,
    {he:"תקרת הקפלה הסיסטינית",ar:"سقف كنيسة سيستينا",ru:"Роспись Сикстинской капеллы",en:"The ceiling of the Sistine Chapel"},
    {he:"מיכלאנג׳לו צייר ארבע שנים על גבי פיגומים את סיפור הבריאה, בדמויות אדם שריריות וחיות.",
     ar:"رسم مايكل أنجلو أربع سنوات فوق سقالات قصّة الخلق، بأجساد بشرية عضليّة حيّة.",
     ru:"Микеланджело четыре года писал на лесах историю творения, с живыми, мускулистыми человеческими телами.",
     en:"Michelangelo painted the story of creation for four years on scaffolding, in living, muscular human bodies."},
    {he:"האפיפיור רצה להאדיר את רומא ואת הכנסייה, והיה בידו כסף רב לשכור את מיטב האמנים.",
     ar:"أراد البابا تمجيد روما والكنيسة، وكان بيده مال وفير لاستئجار خيرة الفنّانين.",
     ru:"Папа хотел возвеличить Рим и Церковь, и у него было довольно денег, чтобы нанять лучших художников.",
     en:"The pope wished to glorify Rome and the Church, and had money enough to hire the finest artists."},
    {he:"האמנות הדתית העמידה במרכזה את גוף האדם ואת יופיו, וזה סימן ההיכר של הרנסאנס.",
     ar:"وضع الفنّ الديني في مركزه جسد الإنسان وجماله، وهذه علامة النهضة الفارقة.",
     ru:"Религиозное искусство поставило в центр человеческое тело и его красоту — отличительный знак Возрождения.",
     en:"Religious art put the human body and its beauty at its centre, and this is the mark of the Renaissance."}),
  E(1519,
    {he:"מגלן יוצא להקפת העולם",ar:"ماجلان ينطلق للدوران حول العالم",ru:"Магеллан отправляется вокруг света",en:"Magellan sets out to circle the globe"},
    {he:"מגלן הפליג מספרד עם חמש ספינות מערבה, וכעבור שלוש שנים חזרה ספינה אחת מן הכיוון הנגדי.",
     ar:"أبحر ماجلان من إسبانيا بخمس سفن غربًا، وبعد ثلاث سنوات عادت سفينة واحدة من الجهة المقابلة.",
     ru:"Магеллан отплыл из Испании на запад с пятью кораблями, и через три года один корабль вернулся с противоположной стороны.",
     en:"Magellan sailed west from Spain with five ships, and three years later one ship returned from the opposite direction."},
    {he:"ספרד חיפשה דרך מערבה אל איי התבלינים, כי הדרך סביב אפריקה היתה בידי פורטוגל.",
     ar:"بحثت إسبانيا عن طريق غربًا إلى جزر التوابل، لأن الطريق حول أفريقيا كان بيد البرتغال.",
     ru:"Испания искала путь на запад к островам пряностей, потому что дорога вокруг Африки была в руках Португалии.",
     en:"Spain looked for a westward route to the spice islands, because the way around Africa was in Portuguese hands."},
    {he:"הוכח למעשה שכדור הארץ עגול ורצוף מים, והתברר גודלו האמיתי של העולם.",
     ar:"ثبت عمليًّا أن الأرض كرويّة وأن مياهها متّصلة، وتبيّن حجم العالم الحقيقي.",
     ru:"Было доказано на деле, что Земля кругла и её воды связаны, и открылся истинный размер мира.",
     en:"It was proved in practice that the earth is round and its waters continuous, and the true size of the world became clear."}),
  C({he:"פרספקטיבה",ar:"المنظور",ru:"Перспектива",en:"Perspective"},
    {he:"שיטת ציור שבה קווים מתכנסים לנקודה אחת, וכך נראית תמונה שטוחה כאילו יש בה עומק.",
     ar:"طريقة رسم تتلاقى فيها الخطوط عند نقطة واحدة، فتبدو الصورة المسطّحة كأنّ فيها عمقًا.",
     ru:"Способ рисования, при котором линии сходятся в одну точку, и плоское изображение кажется глубоким.",
     en:"A way of drawing in which lines converge on a single point, so that a flat picture appears to have depth."})
]);
more("renaissance",2,[
  E(1521,
    {he:"לותר בוועידת וורמס",ar:"لوثر في مجمع فورمس",ru:"Лютер на Вормсском рейхстаге",en:"Luther at the Diet of Worms"},
    {he:"לותר הוזמן לחזור בו בפני הקיסר, סירב, והוכרז מחוץ לחוק — אך נסיך גרמני הסתיר אותו בטירתו.",
     ar:"دُعي لوثر إلى التراجع أمام الإمبراطور فرفض، وأُعلن خارجًا عن القانون — لكن أميرًا ألمانيًّا أخفاه في قلعته.",
     ru:"Лютера призвали отречься перед императором, он отказался и был объявлен вне закона — но немецкий князь укрыл его в своём замке.",
     en:"Luther was summoned to recant before the emperor, refused, and was declared an outlaw — but a German prince hid him in his castle."},
    {he:"כתביו התפשטו בדפוס בכל גרמניה בתוך חודשים, והכנסייה לא יכלה עוד להתעלם מהם.",
     ar:"انتشرت كتاباته بالطباعة في ألمانيا كلّها خلال أشهر، ولم تعد الكنيسة قادرة على تجاهلها.",
     ru:"Его сочинения разошлись в печати по всей Германии за считаные месяцы, и Церковь уже не могла их не замечать.",
     en:"His writings spread in print across Germany within months, and the Church could no longer ignore them."},
    {he:"לותר תרגם את התנ״ך והברית החדשה לגרמנית, וכל אדם שידע קרוא יכול היה לקרוא בכתבי הקודש בעצמו.",
     ar:"ترجم لوثر الكتاب المقدّس إلى الألمانية، فصار كلّ من يعرف القراءة قادرًا على قراءة النصّ المقدّس بنفسه.",
     ru:"Лютер перевёл Библию на немецкий, и всякий грамотный человек мог читать Писание сам.",
     en:"Luther translated the Bible into German, and anyone who could read was able to read the Scriptures for himself."}),
  E(1534,
    {he:"הנרי השמיני והכנסייה האנגליקנית",ar:"هنري الثامن والكنيسة الأنغليكانية",ru:"Генрих VIII и англиканская церковь",en:"Henry VIII and the Church of England"},
    {he:"הפרלמנט האנגלי הכריז על המלך כראש הכנסייה בממלכתו, וניתק אותה מסמכות האפיפיור.",
     ar:"أعلن البرلمان الإنجليزي الملك رأسًا للكنيسة في مملكته، وفصلها عن سلطة البابا.",
     ru:"Английский парламент объявил короля главой Церкви в его королевстве и отделил её от власти папы.",
     en:"The English Parliament declared the king head of the Church in his realm, and severed it from the pope's authority."},
    {he:"האפיפיור סירב לבטל את נישואיו של הנרי, והמלך רצה יורש זכר ולא היה מוכן להמתין.",
     ar:"رفض البابا إبطال زواج هنري، وأراد الملك وريثًا ذكرًا ولم يكن مستعدًّا للانتظار.",
     ru:"Папа отказался расторгнуть брак Генриха, а король хотел наследника-сына и ждать не желал.",
     en:"The pope refused to annul Henry's marriage, and the king wanted a male heir and would not wait."},
    {he:"אדמות המנזרים באנגליה הוחרמו ונמכרו לאצילים, והכתר התעשר ואיבד יריב פנימי חזק.",
     ar:"صودرت أراضي الأديرة في إنجلترا وبيعت للنبلاء، فاغتنى التاج وفقد خصمًا داخليًّا قويًّا.",
     ru:"Земли монастырей в Англии были отобраны и проданы знати, корона разбогатела и лишилась сильного внутреннего соперника.",
     en:"The monastery lands in England were seized and sold to the nobility, and the crown grew rich and lost a strong rival at home."}),
  E(1545,
    {he:"ועידת טרנטו",ar:"مجمع ترنت",ru:"Тридентский собор",en:"The Council of Trent"},
    {he:"הכנסייה הקתולית כינסה ועידה ארוכה, אסרה את מכירת שטרי המחילה והקימה בתי ספר להכשרת כמרים.",
     ar:"عقدت الكنيسة الكاثوليكية مجمعًا طويلًا، ومنعت بيع صكوك الغفران، وأنشأت مدارس لإعداد الكهنة.",
     ru:"Католическая церковь созвала долгий собор, запретила продажу индульгенций и учредила школы для подготовки священников.",
     en:"The Catholic Church convened a long council, banned the sale of indulgences and set up schools to train priests."},
    {he:"מחצית מגרמניה כבר עברה לפרוטסטנטיות, והכנסייה הבינה שאי אפשר להשיב אותה בלי לתקן את עצמה.",
     ar:"كان نصف ألمانيا قد صار بروتستانتيًّا، وأدركت الكنيسة أنه لا سبيل لاستعادته دون إصلاح نفسها.",
     ru:"Половина Германии уже перешла к протестантизму, и Церковь поняла, что не вернёт её, не исправив себя.",
     en:"Half of Germany had already gone over to Protestantism, and the Church saw it could not win it back without reforming itself."},
    {he:"הקתוליות התחזקה מחדש בדרום אירופה ובאמריקה, אך הפילוג הדתי באירופה נקבע לצמיתות.",
     ar:"تقوّت الكاثوليكية من جديد في جنوب أوروبا وأمريكا، لكن الانقسام الديني في أوروبا صار دائمًا.",
     ru:"Католичество вновь окрепло в южной Европе и в Америке, но религиозный раскол Европы закрепился навсегда.",
     en:"Catholicism grew strong again in southern Europe and in the Americas, but the religious split of Europe became permanent."}),
  C({he:"שטרי מחילה",ar:"صكوك الغفران",ru:"Индульгенции",en:"Indulgences"},
    {he:"תעודות שהכנסייה מכרה תמורת כסף, ולפי ההבטחה הן מקצרות את עונשו של החוטא לאחר מותו.",
     ar:"وثائق باعتها الكنيسة بالمال، ووُعد بأنها تقصّر عقاب المذنب بعد موته.",
     ru:"Грамоты, которые Церковь продавала за деньги, обещая, что они сократят наказание грешника после смерти.",
     en:"Certificates the Church sold for money, promised to shorten a sinner's punishment after death."})
]);
more("renaissance",3,[
  E(1633,
    {he:"משפט גלילאו",ar:"محاكمة غاليليو",ru:"Суд над Галилеем",en:"The trial of Galileo"},
    {he:"האינקוויזיציה העמידה את גלילאו לדין על שטען שכדור הארץ נע סביב השמש, וכפתה עליו לחזור בו.",
     ar:"حاكمت محاكم التفتيش غاليليو لقوله إن الأرض تدور حول الشمس، وأجبرته على التراجع.",
     ru:"Инквизиция судила Галилея за утверждение, что Земля движется вокруг Солнца, и принудила его отречься.",
     en:"The Inquisition tried Galileo for holding that the earth moves around the sun, and forced him to recant."},
    {he:"התצפיות בטלסקופ סתרו את מה שלימדה הכנסייה, וגלילאו פרסם אותן בשפה המדוברת ולא בלטינית.",
     ar:"ناقضت أرصاد التلسكوب ما علّمته الكنيسة، ونشرها غاليليو بلغة الناس لا باللاتينية.",
     ru:"Наблюдения в телескоп противоречили церковному учению, а Галилей издал их на разговорном языке, не на латыни.",
     en:"The telescope observations contradicted what the Church taught, and Galileo published them in the spoken language rather than in Latin."},
    {he:"גלילאו נדון למאסר בית עד יום מותו, אך ספריו נדפסו בהולנד והמדע החדש המשיך להתפשט.",
     ar:"حُكم على غاليليو بالإقامة الجبرية حتى وفاته، لكن كتبه طُبعت في هولندا وواصل العلم الجديد انتشاره.",
     ru:"Галилея приговорили к домашнему аресту до конца дней, но его книги печатались в Голландии, и новая наука продолжала распространяться.",
     en:"Galileo was sentenced to house arrest for the rest of his life, but his books were printed in Holland and the new science went on spreading."}),
  C({he:"שיטה מדעית",ar:"المنهج العلمي",ru:"Научный метод",en:"The scientific method"},
    {he:"דרך בירור שבה משערים השערה, בודקים אותה בניסוי ובמדידה, ומוותרים עליה אם התוצאות סותרות.",
     ar:"طريقة بحث تُفترض فيها فرضيّة، وتُختبر بالتجربة والقياس، ويُتخلّى عنها إذا ناقضتها النتائج.",
     ru:"Способ познания, при котором выдвигают предположение, проверяют его опытом и измерением и отбрасывают, если итоги ему противоречат.",
     en:"A way of inquiry in which a hypothesis is put forward, tested by experiment and measurement, and given up if the results contradict it."}),
  C({he:"חברת מניות",ar:"شركة المساهمة",ru:"Акционерная компания",en:"Joint-stock company"},
    {he:"חברה שרבים משקיעים בה כסף ומקבלים חלק ברווחיה ובהפסדיה, וכך אפשר לממן מסע יקר ומסוכן.",
     ar:"شركة يستثمر فيها كثيرون مالًا وينالون حصّة من أرباحها وخسائرها، فيمكن تمويل رحلة باهظة وخطرة.",
     ru:"Общество, в которое многие вкладывают деньги и получают долю в прибылях и убытках, что позволяет финансировать дорогое и опасное плавание.",
     en:"A company in which many people invest money and take a share of its profits and losses, making it possible to finance a costly and dangerous voyage."}),
  Sc({he:["אני, גלילאו, בן שבעים, עומד לפניכם כאסיר על ברכיי,",
          "ורואה לנגד עיניי את כתבי הקודש שידיי נוגעות בהם.",
          "אני נוטש, מקלל ומתעב את הטעות ואת הכפירה",
          "בדבר תנועת הארץ סביב השמש.",
          "מתוך הודאתו הכפויה של גלילאו לפני האינקוויזיציה, 1633."],
      ar:["أنا، غاليليو، ابن السبعين، أقف أمامكم سجينًا على ركبتيّ،",
          "وأمام عينيّ الكتاب المقدّس الذي تلمسه يداي.",
          "أتخلّى عن الخطأ والهرطقة وألعنهما وأمقتهما،",
          "في شأن حركة الأرض حول الشمس.",
          "من إقرار غاليليو المنتزع أمام محاكم التفتيش، 1633."],
      ru:["Я, Галилей, семидесяти лет от роду, стою перед вами узником, на коленях,",
          "и перед глазами моими Священное Писание, которого касаются мои руки.",
          "Я отрекаюсь, проклинаю и гнушаюсь заблуждения и ереси",
          "о движении Земли вокруг Солнца.",
          "Из вынужденного отречения Галилея перед инквизицией, 1633."],
      en:["I, Galileo, in my seventieth year, stand before you a prisoner on my knees,",
          "with the Holy Scriptures before my eyes and under my hands.",
          "I abjure, curse and detest the error and the heresy",
          "of the motion of the earth around the sun.",
          "From Galileo's forced abjuration before the Inquisition, 1633."]},
     [Q({he:"מה מלמדת לשון ההודאה על נסיבותיה?",ar:"ماذا تعلّمنا صيغة الإقرار عن ظروفه؟",ru:"Что язык отречения говорит об обстоятельствах?",en:"What does the wording of the abjuration show about the circumstances?"},
        {he:"שהיא נאמרה בכפייה, תחת איום — אסיר על ברכיו אינו חוזר בו מרצונו.",ar:"أنه قيل قسرًا تحت التهديد — فالسجين على ركبتيه لا يتراجع طوعًا.",ru:"Что оно произнесено по принуждению, под угрозой: узник на коленях не отрекается по своей воле.",en:"That it was made under compulsion and threat — a prisoner on his knees does not recant of his own will."},
        [{he:"שגלילאו שינה את דעתו אחרי שבחן מחדש את מדידותיו.",ar:"أن غاليليو غيّر رأيه بعد أن راجع قياساته.",ru:"Что Галилей изменил мнение, заново проверив свои измерения.",en:"That Galileo changed his mind after re-examining his measurements."},
         {he:"שגלילאו מעולם לא סבר שכדור הארץ נע.",ar:"أن غاليليو لم يعتقد قطّ أن الأرض تتحرّك.",ru:"Что Галилей никогда не считал, что Земля движется.",en:"That Galileo never held that the earth moves."},
         {he:"שהכנסייה קיבלה את טענתו ורק ביקשה לנסחה מחדש.",ar:"أن الكنيسة قبلت دعواه وطلبت إعادة صياغتها فقط.",ru:"Что Церковь приняла его довод и лишь просила его переформулировать.",en:"That the Church accepted his claim and only asked him to word it differently."}]),
      Q({he:"במה נחשבה טענתו של גלילאו לכפירה?",ar:"لماذا عُدّت دعوى غاليليو هرطقة؟",ru:"Почему утверждение Галилея сочли ересью?",en:"Why was Galileo's claim treated as heresy?"},
        {he:"מפני שסתרה את מה שהכנסייה לימדה על מקומו של האדם במרכז הבריאה.",ar:"لأنها ناقضت ما علّمته الكنيسة عن موقع الإنسان في مركز الخلق.",ru:"Потому что оно противоречило учению Церкви о месте человека в центре творения.",en:"Because it contradicted what the Church taught about man's place at the centre of creation."},
        [{he:"מפני שהוא סירב לשלם את המס שהכנסייה הטילה עליו.",ar:"لأنه رفض دفع الضريبة التي فرضتها عليه الكنيسة.",ru:"Потому что он отказался платить наложенный Церковью налог.",en:"Because he refused to pay the tax the Church laid on him."},
         {he:"מפני שהמציא את הטלסקופ בלי רשות מן האפיפיור.",ar:"لأنه اخترع التلسكوب دون إذن من البابا.",ru:"Потому что он изобрёл телескоп без позволения папы.",en:"Because he invented the telescope without the pope's permission."},
         {he:"מפני שלימד באוניברסיטה שלא הוסמכה בידי הכנסייה.",ar:"لأنه درّس في جامعة لم تُجزها الكنيسة.",ru:"Потому что он преподавал в университете, не утверждённом Церковью.",en:"Because he taught at a university the Church had not approved."}])])
]);

more("revolutions",1,[
  E(1787,
    {he:"חתימת החוקה האמריקאית",ar:"توقيع الدستور الأمريكي",ru:"Подписание Конституции США",en:"The signing of the American Constitution"},
    {he:"נציגי המדינות כתבו חוקה שחילקה את השלטון לשלוש רשויות ואיזנה ביניהן, וקבעה נשיא נבחר לזמן קצוב.",
     ar:"كتب مندوبو الولايات دستورًا قسّم السلطة إلى ثلاث وأقام توازنًا بينها، وحدّد رئيسًا منتخبًا لمدّة محدودة.",
     ru:"Представители штатов написали конституцию, разделившую власть на три ветви и уравновесившую их, и учредили президента, избираемого на срок.",
     en:"The delegates of the states wrote a constitution that divided power into three branches and balanced them, and set a president elected for a fixed term."},

     ar:"بعد الاستقلال كانت الولايات متّحدة في حلف رخو بلا خزينة مشتركة ولا جيش، ولم تُسدّد ديون الحرب.",
     ru:"После независимости штаты были соединены рыхлым союзом без общей казны и армии, и долги войны не выплачивались.",
     en:"After independence the states were joined in a loose league with no common treasury and no army, and the war debts went unpaid."},
    {he:"נולד הדגם של רפובליקה גדולה עם חוקה כתובה, והוא שימש מופת לחוקות שנכתבו אחריו בעולם.",
     ar:"وُلد نموذج الجمهورية الكبيرة ذات الدستور المكتوب، وصار مثالًا للدساتير التي كُتبت بعده في العالم.",
     ru:"Родился образец большой республики с писаной конституцией, ставший образцом для конституций, написанных после него в мире.",
     en:"The model of a large republic with a written constitution was born, and it served as a pattern for the constitutions written after it around the world."}),
  E(1793,
    {he:"הוצאת המלך להורג ותקופת הטרור",ar:"إعدام الملك وعهد الإرهاب",ru:"Казнь короля и эпоха террора",en:"The execution of the king and the Terror"},
    {he:"לואי השישה עשר הוצא להורג בגיליוטינה, ובשנה שאחריה הוצאו להורג עוד אלפי אנשים כחשודים באויבי המהפכה.",
     ar:"أُعدم لويس السادس عشر بالمقصلة، وفي السنة التالية أُعدم آلاف آخرون بتهمة عداء الثورة.",
     ru:"Людовика XVI казнили на гильотине, а в следующий год казнили ещё тысячи людей как подозреваемых во враждебности революции.",
     en:"Louis XVI was executed by guillotine, and in the year that followed thousands more were put to death as suspected enemies of the revolution."},
    {he:"צבאות אירופה פלשו לצרפת כדי להשיב את המלוכה, והמהפכנים ראו בכל מתנגד פנימי בוגד שפועל עימם.",
     ar:"غزت جيوش أوروبا فرنسا لإعادة الملكية، ورأى الثوريون في كلّ معارض داخلي خائنًا يعمل معهم.",
     ru:"Армии Европы вторглись во Францию, чтобы вернуть монархию, и революционеры видели в каждом внутреннем противнике изменника, действующего заодно с ними.",
     en:"The armies of Europe invaded France to restore the monarchy, and the revolutionaries saw every opponent at home as a traitor working with them."},
    {he:"התברר שמהפכה בשם החירות עלולה להוליד עריצות משלה, והתשישות מן הטרור פינתה דרך לשלטון יחיד.",
     ar:"تبيّن أن ثورة باسم الحرّية قد تلد استبدادًا خاصًّا بها، وأفسح الإنهاك من الإرهاب الطريق لحكم الفرد.",
     ru:"Оказалось, что революция во имя свободы способна породить собственную тиранию, и усталость от террора расчистила путь единовластию.",
     en:"It became clear that a revolution in the name of liberty can breed a tyranny of its own, and exhaustion with the Terror cleared the way for one-man rule."}),
  E(1799,
    {he:"נפוליאון תופס את השלטון",ar:"نابليون يستولي على الحكم",ru:"Наполеон захватывает власть",en:"Napoleon seizes power"},
    {he:"נפוליאון פיזר בכוח את בית הנבחרים ומינה את עצמו לקונסול ראשון, ובכך תמה המהפכה כמשטר של אספות.",
     ar:"فضّ نابليون المجلس بالقوّة ونصّب نفسه قنصلًا أوّل، وبذلك انتهت الثورة كنظام جمعيات.",
     ru:"Наполеон силой разогнал собрание и назначил себя первым консулом, и на этом революция как строй ассамблей кончилась.",
     en:"Napoleon dispersed the assembly by force and made himself First Consul, and with that the revolution as a rule of assemblies came to an end."},
    {he:"עשור של מהפכה הותיר את צרפת בחובות, באינפלציה ובמלחמות, ורבים ביקשו סדר יותר משביקשו חירות.",
     ar:"ترك عقد من الثورة فرنسا في الديون والتضخّم والحروب، وطلب كثيرون النظام أكثر ممّا طلبوا الحرّية.",
     ru:"Десятилетие революции оставило Францию в долгах, инфляции и войнах, и многие искали порядка больше, чем свободы.",
     en:"A decade of revolution had left France in debt, inflation and war, and many wanted order more than they wanted liberty."},
    {he:"נפוליאון שמר על הישגי המהפכה בחוק ובמנהל אך ביטל את הדמוקרטיה, וכעבור חמש שנים הכתיר עצמו לקיסר.",
     ar:"حافظ نابليون على مكاسب الثورة في القانون والإدارة لكنه ألغى الديمقراطية، وبعد خمس سنوات توّج نفسه إمبراطورًا.",
     ru:"Наполеон сохранил завоевания революции в праве и управлении, но упразднил демократию, а через пять лет короновал себя императором.",
     en:"Napoleon kept the gains of the revolution in law and administration but abolished democracy, and five years later crowned himself emperor."}),
  C({he:"הפרדת רשויות",ar:"الفصل بين السلطات",ru:"Разделение властей",en:"Separation of powers"},
    {he:"חלוקת השלטון בין מחוקק, מבצע ושופט, כדי שאף אחד מהם לא יוכל לרכז בידיו כוח בלי בקרה.",
     ar:"توزيع الحكم بين مشرّع ومنفّذ وقاضٍ، كي لا يتمكّن أيّ منها من حصر القوّة بيده بلا رقابة.",
     ru:"Распределение власти между законодательной, исполнительной и судебной, чтобы ни одна не могла сосредоточить силу без надзора.",
     en:"The division of government between lawmaker, executive and judge, so that none of them can gather power in its hands unchecked."})
]);
more("revolutions",2,[
  E(1812,
    {he:"מסע נפוליאון לרוסיה",ar:"حملة نابليون على روسيا",ru:"Поход Наполеона на Россию",en:"Napoleon's Russian campaign"},
    {he:"נפוליאון פלש לרוסיה עם צבא של מאות אלפים, הגיע למוסקבה הנטושה, וחזר עם שארית קטנה בלבד.",
     ar:"غزا نابليون روسيا بجيش من مئات الآلاف، وبلغ موسكو المهجورة، وعاد ببقيّة صغيرة فقط.",
     ru:"Наполеон вторгся в Россию с войском в сотни тысяч, дошёл до покинутой Москвы и вернулся лишь с малым остатком.",
     en:"Napoleon invaded Russia with an army of hundreds of thousands, reached a deserted Moscow, and came back with only a small remnant."},
    {he:"רוסיה סירבה להצטרף לחרם הכלכלי שהטיל נפוליאון על בריטניה, והמשיכה לסחור עימה.",
     ar:"رفضت روسيا الانضمام إلى الحصار الاقتصادي الذي فرضه نابليون على بريطانيا، وواصلت التجارة معها.",
     ru:"Россия отказалась присоединиться к экономической блокаде Британии, объявленной Наполеоном, и продолжала с ней торговать.",
     en:"Russia refused to join the economic blockade Napoleon had imposed on Britain, and went on trading with it."},
    {he:"מיתוס אי התבוסה של נפוליאון נשבר, אירופה התאחדה נגדו, וכעבור שנתיים איבד את כיסאו.",
     ar:"انكسرت أسطورة أن نابليون لا يُهزم، واتّحدت أوروبا ضدّه، وفقد عرشه بعد سنتين.",
     ru:"Миф о непобедимости Наполеона рухнул, Европа объединилась против него, и через два года он потерял трон.",
     en:"The myth that Napoleon could not be beaten was broken, Europe united against him, and two years later he lost his throne."}),
  E(1830,
    {he:"מהפכת יולי בצרפת",ar:"ثورة يوليو في فرنسا",ru:"Июльская революция во Франции",en:"The July Revolution in France"},
    {he:"פריז התקוממה בשלושה ימים נגד המלך שביטל את חופש העיתונות ופיזר את הפרלמנט, והוא נמלט מצרפת.",
     ar:"انتفضت باريس ثلاثة أيام ضدّ الملك الذي ألغى حرّية الصحافة وحلّ البرلمان، ففرّ من فرنسا.",
     ru:"Париж восстал за три дня против короля, отменившего свободу печати и распустившего парламент, и тот бежал из Франции.",
     en:"Paris rose in three days against the king who had abolished the freedom of the press and dissolved parliament, and he fled France."},
    {he:"המלוכה שהושבה אחרי נפוליאון ניסתה להחזיר את סמכויות המלך כפי שהיו לפני המהפכה.",
     ar:"حاولت الملكية التي أُعيدت بعد نابليون استرداد صلاحيات الملك كما كانت قبل الثورة.",
     ru:"Монархия, восстановленная после Наполеона, пыталась вернуть королю полномочия, какими они были до революции.",
     en:"The monarchy restored after Napoleon tried to bring back the king's powers as they had been before the revolution."},
    {he:"עלה מלך שקיבל את מרות החוקה, והוכח שאי אפשר להשיב את אירופה למצב שלפני 1789.",
     ar:"تولّى ملك قبل بسلطان الدستور، وثبت أنه لا يمكن إعادة أوروبا إلى ما قبل 1789.",
     ru:"На престол взошёл король, признавший власть конституции, и стало ясно, что вернуть Европу к состоянию до 1789 года нельзя.",
     en:"A king came to the throne who accepted the authority of the constitution, and it was proved that Europe could not be put back as it was before 1789."}),
  E(1832,
    {he:"רפורמת הבחירות בבריטניה",ar:"إصلاح الانتخابات في بريطانيا",ru:"Избирательная реформа в Британии",en:"The Reform Act in Britain"},
    {he:"הפרלמנט הבריטי ביטל מחוזות בחירה ריקים מתושבים, העביר מושבים לערי התעשייה והרחיב מעט את זכות ההצבעה.",
     ar:"ألغى البرلمان البريطاني دوائر انتخابية خالية من السكان، ونقل مقاعد إلى مدن الصناعة، ووسّع حقّ الاقتراع قليلًا.",
     ru:"Британский парламент упразднил обезлюдевшие избирательные округа, передал места промышленным городам и немного расширил право голоса.",
     en:"The British Parliament abolished constituencies empty of people, moved seats to the industrial towns and slightly widened the right to vote."},
    {he:"ערים חדשות שגדלו מהתיעוש לא היו מיוצגות כלל, ואילו כפרים נטושים שלחו נציגים לפרלמנט.",
     ar:"لم تكن المدن الجديدة التي نمت من التصنيع ممثَّلة البتّة، بينما أرسلت قرى مهجورة نوّابًا إلى البرلمان.",
     ru:"Новые города, выросшие от индустриализации, не были представлены вовсе, а обезлюдевшие деревни посылали депутатов в парламент.",
     en:"The new towns grown from industry had no representation at all, while deserted villages sent members to Parliament."},
    {he:"בריטניה הרחיבה את הדמוקרטיה בחקיקה ולא במהפכה, וזו הדרך שבה נמנעו בה ההתקוממויות של 1848.",
     ar:"وسّعت بريطانيا الديمقراطية بالتشريع لا بالثورة، وبهذه الطريقة تجنّبت انتفاضات 1848.",
     ru:"Британия расширяла демократию законом, а не революцией, и так избежала восстаний 1848 года.",
     en:"Britain widened its democracy by legislation rather than revolution, and this is how it escaped the risings of 1848."}),
  C({he:"ריבונות העם",ar:"سيادة الشعب",ru:"Народный суверенитет",en:"Popular sovereignty"},
    {he:"התפיסה שמקור סמכותו של השלטון הוא בעם עצמו, ולא באל, בירושה או בכוח הזרוע.",
     ar:"التصوّر بأن مصدر سلطة الحكم هو الشعب نفسه، لا الإله ولا الوراثة ولا القوّة.",
     ru:"Представление, что источник власти — сам народ, а не Бог, не наследование и не сила.",
     en:"The idea that the source of a government's authority is the people themselves, and not God, inheritance or force of arms."})
]);
more("revolutions",3,[
  E(1865,
    {he:"ביטול העבדות בארצות הברית",ar:"إلغاء العبودية في الولايات المتّحدة",ru:"Отмена рабства в США",en:"The abolition of slavery in the United States"},
    {he:"אחרי ניצחון הצפון נוסף לחוקה תיקון שאסר את העבדות בכל רחבי המדינה, וכארבעה מיליון בני אדם שוחררו.",
     ar:"بعد انتصار الشمال أُضيف إلى الدستور تعديل يحظر العبودية في كلّ أنحاء البلاد، وحُرّر نحو أربعة ملايين إنسان.",
     ru:"После победы Севера в конституцию внесли поправку, запретившую рабство по всей стране, и около четырёх миллионов человек были освобождены.",
     en:"After the North's victory an amendment was added to the constitution banning slavery throughout the country, and some four million people were freed."},

     ar:"لم يسرِ إعلان تحرير لينكولن إلا على ولايات التمرّد، ولم يكن ليمنع العبودية في كلّ مكان وإلى الأبد إلا تعديل دستوري.",
     ru:"Прокламация Линкольна об освобождении касалась лишь мятежных штатов, и только поправка к конституции могла запретить рабство везде и навсегда.",
     en:"Lincoln's Emancipation Proclamation applied only to the rebel states, and only a constitutional amendment could forbid slavery everywhere and for good."},
    {he:"העבדות בוטלה, אך חוקי הפרדה ואפליה נחקקו במקומה בדרום והחזיקו כמאה שנה.",
     ar:"أُلغيت العبودية، لكن قوانين فصل وتمييز سُنّت مكانها في الجنوب ودامت نحو مئة سنة.",
     ru:"Рабство было отменено, но вместо него на Юге приняли законы о сегрегации и дискриминации, продержавшиеся около ста лет.",
     en:"Slavery was abolished, but laws of segregation and discrimination were passed in its place in the South and lasted about a hundred years."}),
  C({he:"שוויון בפני החוק",ar:"المساواة أمام القانون",ru:"Равенство перед законом",en:"Equality before the law"},
    {he:"העיקרון שאותם חוקים ואותם בתי משפט חלים על כל אדם, בלי הבדל מעמד, מוצא או עושר.",
     ar:"المبدأ القاضي بأن القوانين ذاتها والمحاكم ذاتها تسري على كلّ إنسان، بلا فرق في المكانة أو الأصل أو الثروة.",
     ru:"Начало, по которому одни и те же законы и суды действуют для каждого человека, без различия положения, происхождения или богатства.",
     en:"The principle that the same laws and the same courts apply to every person, without distinction of rank, origin or wealth."}),
  C({he:"זכות בחירה",ar:"حقّ الاقتراع",ru:"Избирательное право",en:"The right to vote"},
    {he:"הזכות להשתתף בבחירת נציגי הציבור, שהורחבה בהדרגה מבעלי רכוש בלבד אל כלל הבוגרים ואל נשים.",
     ar:"الحقّ في المشاركة باختيار ممثّلي الجمهور، وقد اتّسع تدريجيًّا من أصحاب الملك وحدهم إلى كلّ البالغين وإلى النساء.",
     ru:"Право участвовать в выборе представителей, постепенно расширенное от одних лишь собственников до всех взрослых и до женщин.",
     en:"The right to take part in choosing public representatives, widened by degrees from property owners alone to all adults and to women."}),
  Sc({he:["בני האדם נולדים ונשארים חופשיים ושווים בזכויותיהם.",
          "מטרתה של כל התאגדות מדינית היא שמירת זכויותיו הטבעיות של האדם:",

          "החירות היא היכולת לעשות כל דבר שאינו מזיק לזולת.",
          "מתוך הצהרת זכויות האדם והאזרח, צרפת, 1789."],
      ar:["يولد الناس ويبقون أحرارًا متساوين في الحقوق.",
          "غاية كلّ اجتماع سياسي هي صون حقوق الإنسان الطبيعية:",
          "الحرّية والملكية والأمن ومقاومة الاضطهاد.",
          "والحرّية هي القدرة على فعل كلّ ما لا يضرّ بالآخرين.",
          "من إعلان حقوق الإنسان والمواطن، فرنسا، 1789."],
      ru:["Люди рождаются и остаются свободными и равными в правах.",
          "Цель всякого политического союза — охрана естественных прав человека:",
          "свободы, собственности, безопасности и сопротивления угнетению.",
          "Свобода состоит в возможности делать всё, что не вредит другому.",
          "Из Декларации прав человека и гражданина, Франция, 1789 год."],
      en:["Men are born and remain free and equal in rights.",
          "The aim of every political association is the preservation of the natural rights of man:",
          "liberty, property, security and resistance to oppression.",
          "Liberty consists in being able to do anything that does not harm another.",
          "From the Declaration of the Rights of Man and of the Citizen, France, 1789."]},
     [Q({he:"כיצד מגדיר המקור את גבול החירות?",ar:"كيف يحدّد المصدر حدّ الحرّية؟",ru:"Как источник определяет предел свободы?",en:"How does the source define the limit of liberty?"},
        {he:"החירות משתרעת עד לנקודה שבה המעשה מזיק לאדם אחר.",ar:"تمتدّ الحرّية إلى النقطة التي يضرّ عندها الفعل بإنسان آخر.",ru:"Свобода простирается до точки, где действие вредит другому человеку.",en:"Liberty extends up to the point where an act harms another person."},
        [{he:"החירות מוגבלת למה שהמלך מתיר בחוקיו.",ar:"الحرّية محدودة بما يبيحه الملك في قوانينه.",ru:"Свобода ограничена тем, что дозволяет король в своих законах.",en:"Liberty is limited to what the king permits in his laws."},
         {he:"החירות מוגבלת לבעלי רכוש ולמשלמי מס.",ar:"الحرّية محدودة بأصحاب الملك ودافعي الضرائب.",ru:"Свобода ограничена собственниками и налогоплательщиками.",en:"Liberty is limited to property owners and taxpayers."},
         {he:"החירות אינה מוגבלת כלל, וכל אדם עושה כרצונו.",ar:"الحرّية غير محدودة البتّة، وكلّ إنسان يفعل ما يشاء.",ru:"Свобода не ограничена вовсе, и каждый делает что хочет.",en:"Liberty is not limited at all, and everyone does as he pleases."}]),
      Q({he:"מה תפקידה של המדינה לפי המקור?",ar:"ما دور الدولة بحسب المصدر؟",ru:"В чём, по источнику, задача государства?",en:"What is the task of the state according to the source?"},

]);

more("industry",1,[
  E(1764,
    {he:"מכונת הטוויה ג׳ני",ar:"مغزل جيني",ru:"Прялка «Дженни»",en:"The spinning jenny"},
    {he:"ג׳יימס הרגריבס בנה מכונה שטווה שמונה חוטים בבת אחת, ופועל אחד עשה בה את עבודתם של שמונה.",
     ar:"صنع جيمس هارغريفز آلة تغزل ثمانية خيوط دفعة واحدة، فأدّى عامل واحد بها عمل ثمانية.",

    {he:"הובלה בנהרות ובים נעשתה צפויה וזולה, וההגירה ההמונית מאירופה לאמריקה נעשתה אפשרית.",

  E(1842,
    {he:"חוק המכרות בבריטניה",ar:"قانون المناجم في بريطانيا",ru:"Закон о шахтах в Британии",en:"The Mines Act in Britain"},
    {he:"הפרלמנט אסר להעסיק נשים וילדים מתחת לגיל עשר בעבודה מתחת לפני האדמה.",

     ru:"Парламент запретил труд женщин и детей младше десяти лет под землёй.",
     en:"Parliament forbade the employment of women and of children under ten below ground."},
    {he:"ועדת חקירה פרסמה ציורים ועדויות על ילדים הגוררים עגלות פחם במנהרות אפלות, והדעה הציבורית התהפכה.",
     ar:"نشرت لجنة تحقيق رسومًا وشهادات عن أطفال يجرّون عربات فحم في أنفاق مظلمة، فانقلب الرأي العام.",
     ru:"Следственная комиссия обнародовала рисунки и свидетельства о детях, тащивших вагонетки с углём в тёмных штольнях, и общественное мнение переменилось.",
     en:"A commission of inquiry published drawings and testimony of children dragging coal carts in dark tunnels, and public opinion turned."},
    {he:"נקבע לראשונה שהמדינה רשאית להתערב בתנאי העסקה, ומכאן נפתחה הדרך לחקיקת עבודה נוספת.",
     ar:"تقرّر لأوّل مرّة أن للدولة أن تتدخّل في شروط التشغيل، ومن هنا انفتح الطريق لتشريع عمل إضافي.",
     ru:"Впервые было установлено, что государство вправе вмешиваться в условия найма, и отсюда открылся путь к дальнейшему трудовому законодательству.",
     en:"It was established for the first time that the state may intervene in the terms of employment, and from there the way opened to further labour law."}),
  C({he:"בית חרושת",ar:"المصنع",ru:"Фабрика",en:"The factory"},

     ar:"مبنى جُمعت فيه الآلات والعمّال تحت سقف واحد، وحُدّدت فيه ساعات العمل بالساعة لا بضوء النهار.",
     ru:"Здание, где машины и рабочие собраны под одной крышей и часы труда отмеряются часами, а не дневным светом.",

]);
more("industry",2,[
  E(1851,
    {he:"התערוכה הגדולה בלונדון",ar:"المعرض الكبير في لندن",ru:"Всемирная выставка в Лондоне",en:"The Great Exhibition in London"},
    {he:"בריטניה הציגה בארמון בדולח מזכוכית ומברזל את מכונותיה ואת מוצריה, ושישה מיליון מבקרים באו לראותם.",
     ar:"عرضت بريطانيا في قصر بلّوري من زجاج وحديد آلاتها ومنتجاتها، وجاء ستّة ملايين زائر لرؤيتها.",
     ru:"Британия показала в хрустальном дворце из стекла и железа свои машины и изделия, и шесть миллионов человек пришли на них посмотреть.",
     en:"Britain displayed its machines and products in a crystal palace of glass and iron, and six million visitors came to see them."},

    {he:"התיעוש הוצג כהתקדמות שכל מדינה שואפת אליה, ומדינות אירופה מיהרו לחקות את בריטניה.",
     ar:"قُدّم التصنيع كتقدّم تطمح إليه كلّ دولة، وسارعت دول أوروبا إلى محاكاة بريطانيا.",
     ru:"Индустриализацию представили как прогресс, к которому стремится всякая страна, и страны Европы поспешили подражать Британии.",

  E(1876,
    {he:"המצאת הטלפון",ar:"اختراع الهاتف",ru:"Изобретение телефона",en:"The invention of the telephone"},
    {he:"אלכסנדר גרהם בל רשם פטנט על מכשיר שהעביר קול חי דרך חוט, ובתוך שנים אחדות נמתחו קווים בין ערים.",
     ar:"سجّل ألكسندر غراهام بل براءة جهاز نقل الصوت الحيّ عبر سلك، وخلال سنوات قليلة مُدّت خطوط بين المدن.",
     ru:"Александр Грэм Белл запатентовал устройство, передававшее живой голос по проводу, и за несколько лет между городами протянули линии.",
     en:"Alexander Graham Bell patented a device that carried a living voice along a wire, and within a few years lines were strung between cities."},
    {he:"הטלגרף כבר העביר הודעות למרחקים אך רק בקוד ובאמצעות מפעיל מיומן, ואנשים רצו לדבר בעצמם.",
     ar:"كان التلغراف ينقل الرسائل لمسافات لكن بالشيفرة وعبر مشغّل ماهر، وأراد الناس أن يتكلّموا بأنفسهم.",
     ru:"Телеграф уже передавал сообщения на расстояние, но только кодом и через умелого оператора, а люди хотели говорить сами.",
     en:"The telegraph already carried messages over distance, but only in code and through a trained operator, and people wanted to speak for themselves."},
    {he:"המסחר והמנהל התייעלו מאוד, וקצב קבלת ההחלטות בעולם העסקים השתנה מימים לדקות.",
     ar:"تحسّنت التجارة والإدارة كثيرًا، وتغيّر إيقاع اتّخاذ القرار في عالم الأعمال من أيّام إلى دقائق.",
     ru:"Торговля и управление стали намного действеннее, и темп принятия деловых решений сменился с дней на минуты.",
     en:"Commerce and administration became far more efficient, and the pace of business decisions changed from days to minutes."}),
  E(1879,
    {he:"נורת הליבון של אדיסון",ar:"مصباح إديسون المتوهّج",ru:"Лампа накаливания Эдисона",en:"Edison's incandescent lamp"},
    {he:"אדיסון הציג נורה שדלקה שעות רבות ובנה תחנת כוח שסיפקה חשמל לרובע שלם בניו יורק.",
     ar:"عرض إديسون مصباحًا أضاء ساعات طويلة، وبنى محطّة طاقة زوّدت حيًّا كاملًا في نيويورك بالكهرباء.",
     ru:"Эдисон показал лампу, горевшую много часов, и построил электростанцию, снабжавшую током целый район Нью-Йорка.",
     en:"Edison showed a lamp that burned for many hours and built a power station that supplied electricity to a whole district of New York."},
    {he:"תאורת הגז היתה מסוכנת ומזהמת, והמפעלים נאלצו לעצור את עבודתם עם רדת החשכה.",
     ar:"كانت إنارة الغاز خطرة وملوّثة، واضطرّت المصانع إلى وقف عملها مع حلول الظلام.",
     ru:"Газовое освещение было опасным и грязным, и фабрики вынуждены были останавливать работу с наступлением темноты.",
     en:"Gas lighting was dangerous and dirty, and factories had to stop work when darkness fell."},
    {he:"היום נעשה ארוך מן השעות שהשמש נותנת, והמשמרת הלילית במפעלים הפכה לדבר שבשגרה.",
     ar:"صار اليوم أطول من الساعات التي تمنحها الشمس، وأمست المناوبة الليلية في المصانع أمرًا معتادًا.",
     ru:"День стал длиннее часов, которые даёт солнце, а ночная смена на фабриках сделалась обычным делом.",
     en:"The day grew longer than the hours the sun gives, and the night shift in the factories became routine."}),
  C({he:"קפיטליזם",ar:"الرأسمالية",ru:"Капитализм",en:"Capitalism"},
    {he:"שיטה כלכלית שבה אמצעי הייצור בבעלות פרטית, והמחיר והשכר נקבעים בשוק לפי היצע וביקוש.",
     ar:"نظام اقتصادي تكون فيه وسائل الإنتاج ملكًا خاصًّا، ويتحدّد السعر والأجر في السوق بالعرض والطلب.",
     ru:"Хозяйственный строй, при котором средства производства в частных руках, а цена и плата за труд складываются на рынке по спросу и предложению.",
     en:"An economic system in which the means of production are privately owned, and price and wages are set in the market by supply and demand."})
]);
more("industry",3,[
  E(1913,
    {he:"פס הייצור של פורד",ar:"خطّ إنتاج فورد",ru:"Конвейер Форда",en:"Ford's assembly line"},
    {he:"במפעל פורד נעה המכונית על מסוע בין הפועלים, וכל אחד מהם התקין חלק אחד בלבד שוב ושוב.",

     ru:"На заводе Форда автомобиль двигался по конвейеру между рабочими, и каждый ставил лишь одну деталь снова и снова.",
     en:"At the Ford plant the car moved along a belt between the workers, and each of them fitted just one part over and over."},

    {he:"זמן ההרכבה התקצר פי שמונה והמחיר צנח, אך העבודה נעשתה חדגונית ותלויה בקצב שקובעת המכונה.",
     ar:"تقلّص زمن التركيب ثماني مرّات وهبط الثمن، لكن العمل صار رتيبًا ومرهونًا بإيقاع تحدّده الآلة.",
     ru:"Время сборки сократилось в восемь раз и цена упала, но труд стал однообразным и подчинённым темпу, который задаёт машина.",
     en:"Assembly time fell eightfold and the price dropped, but the work became monotonous and tied to a pace the machine sets."}),
  C({he:"מהפכה חקלאית",ar:"الثورة الزراعية",ru:"Аграрная революция",en:"The agricultural revolution"},
    {he:"שיפורים בגידול ובעיבוד שהגדילו את היבול, שחררו ידיים עובדות מן הכפר ואפשרו את התיעוש.",
     ar:"تحسينات في الزراعة والفلاحة زادت المحصول، وحرّرت أيدي عاملة من القرية، وأتاحت التصنيع.",
     ru:"Улучшения в возделывании и обработке земли, поднявшие урожай, высвободившие рабочие руки из деревни и сделавшие возможной индустриализацию.",
     en:"Improvements in growing and working the land that raised the yield, freed working hands from the village and made industrialisation possible."}),
  C({he:"סוציאליזם",ar:"الاشتراكية",ru:"Социализм",en:"Socialism"},
    {he:"תפיסה הגורסת שאמצעי הייצור צריכים להיות בידי הציבור, וכי על החברה לדאוג לחלוקה הוגנת של העושר.",

     ru:"Взгляд, согласно которому средства производства должны принадлежать обществу, а общество обязано обеспечить справедливое распределение богатства.",
     en:"The view that the means of production should be held in common, and that society must see to a fair distribution of wealth."}),
  Sc({he:["תולדות כל חברה שהיתה עד כה הן תולדות מאבק מעמדות.",

          "מתוך המניפסט הקומוניסטי, מארקס ואנגלס, 1848."],
      ar:["تاريخ كلّ مجتمع وُجد حتى الآن هو تاريخ صراع طبقات.",
          "الحرّ والعبد، النبيل والعامّي، صاحب الضيعة والقنّ",

          "وخاضوا حربًا كانت حينًا مستترة وحينًا معلنة.",
          "من البيان الشيوعي، ماركس وإنجلز، 1848."],
      ru:["История всех до сих пор существовавших обществ была историей борьбы классов.",
          "Свободный и раб, патриций и плебей, помещик и крепостной",
          "стояли друг против друга в постоянном противоречии",
          "и вели войну, то скрытую, то явную.",
          "Из «Манифеста коммунистической партии», Маркс и Энгельс, 1848."],
      en:["The history of all hitherto existing society is the history of class struggle.",
          "Freeman and slave, patrician and plebeian, lord and serf",
          "stood in constant opposition to one another,",
          "and carried on a war that was now hidden and now open.",
          "From The Communist Manifesto, Marx and Engels, 1848."]},
     [Q({he:"מה הטענה המרכזית של המקור על ההיסטוריה?",ar:"ما الدعوى المركزية للمصدر عن التاريخ؟",ru:"В чём главное утверждение источника об истории?",en:"What is the source's central claim about history?"},
        {he:"שכל תקופה בהיסטוריה מונעת בידי מאבק בין קבוצה שמחזיקה ברכוש ובין קבוצה שעובדת בשבילה.",ar:"أن كلّ حقبة في التاريخ يحرّكها صراع بين فئة تملك وفئة تعمل لصالحها.",ru:"Что каждую эпоху истории движет борьба между группой, владеющей имуществом, и группой, которая на неё работает.",en:"That every age in history is driven by a struggle between a group that owns property and a group that works for it."},
        [{he:"שההיסטוריה נקבעת בידי מנהיגים גדולים ובידי החלטותיהם.",ar:"أن التاريخ يحدّده قادة عظام وقراراتهم.",ru:"Что историю определяют великие вожди и их решения.",en:"That history is decided by great leaders and by their decisions."},
         {he:"שההיסטוריה מונעת בידי מלחמות דת בין אמונות יריבות.",ar:"أن التاريخ تحرّكه حروب دينية بين عقائد متنافسة.",ru:"Что историю движут религиозные войны между соперничающими верами.",en:"That history is driven by religious wars between rival faiths."},
         {he:"שההיסטוריה מתקדמת בזכות המצאות טכנולוגיות בלבד.",ar:"أن التاريخ يتقدّم بفضل الاختراعات التقنية وحدها.",ru:"Что история движется вперёд лишь благодаря техническим изобретениям.",en:"That history advances thanks to technological inventions alone."}]),
      Q({he:"מדוע מונה המקור זוגות מתקופות שונות?",ar:"لماذا يعدّد المصدر أزواجًا من حقب مختلفة؟",ru:"Зачем источник перечисляет пары из разных эпох?",en:"Why does the source list pairs from different periods?"},
        {he:"כדי להראות שאותו יחס בין מחזיק לעובד חוזר בכל תקופה בצורה אחרת.",ar:"ليُظهر أن العلاقة ذاتها بين مالك وعامل تتكرّر في كلّ حقبة بصورة أخرى.",ru:"Чтобы показать, что одно и то же отношение владельца и работника повторяется в каждую эпоху в ином виде.",en:"To show that the same relation between owner and worker recurs in every period in a different form."},
        [{he:"כדי להוכיח שהעבדות היתה קיימת בכל התקופות באותה צורה.",ar:"ليثبت أن العبودية وُجدت في كلّ الحقب بالصورة ذاتها.",ru:"Чтобы доказать, что рабство существовало во все эпохи в одном и том же виде.",en:"To prove that slavery existed in all periods in exactly the same form."},
         {he:"כדי להשוות בין מספר התושבים בכל תקופה ותקופה.",ar:"ليقارن بين عدد السكان في كلّ حقبة.",ru:"Чтобы сравнить численность населения в каждую эпоху.",en:"To compare the size of the population in each period."},
         {he:"כדי להראות שהמאבק נפסק עם בוא המהפכה התעשייתית.",ar:"ليُظهر أن الصراع توقّف بمجيء الثورة الصناعية.",ru:"Чтобы показать, что борьба прекратилась с приходом промышленной революции.",en:"To show that the struggle stopped with the coming of the industrial revolution."}])])
]);

more("nationalism",2,[

  E(1909,

     ar:"في السنة ذاتها وزّعت عائلات من يافا قسائم في الرمال وأقامت حيًّا عبريًّا، وأقامت مجموعة شبّان جماعة تعاونية في الغور.",
     ru:"В том же году семьи из Яффо разделили участки в песках и основали еврейский квартал, а группа молодых людей создала коммуну в долине.",

     ru:"Яффо был тесен и дорог, а владельцы земли в долине искали способ обрабатывать её без наёмных рабочих и без надсмотрщика.",
     en:"Jaffa was crowded and expensive, and those holding land in the valley looked for a way to work it without hired labourers and without an overseer."},
