<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>מפנה — היסטוריה לחטיבת הביניים</title>
<meta name="description" content="היסטוריה לחטיבת הביניים למי שלומד אחרת: כל אירוע עם תאריך, סיבה ותוצאה, עם מקורות ומושגים — מהעת העתיקה ועד המאה ה-20. בעברית, ערבית, רוסית ואנגלית." />
<meta name="theme-color" content="#f4f7f6" media="(prefers-color-scheme:light)" />
<meta name="theme-color" content="#0d1b1a" media="(prefers-color-scheme:dark)" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Lexend:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   מפנה — היסטוריה לחטיבת הביניים
   קהל היעד לא "לא יודע היסטוריה". הוא נכשל בה שוב ושוב, ולכן כל
   החלטה כאן נמדדת בשאלה אחת: האם היא מורידה עומס, או מוסיפה.
   · כל אירוע נושא תאריך, סיבה ותוצאה — לא רק שם.
   · שום טקסט לא מוצג בלי שאפשר לשמוע אותו.
   · שפת האם היא פיגום, לא קביים — היא נסוגה עם העלייה ברמה.
   כל המידות ב-rem, כדי שהגדלת טקסט תגדיל את הכול יחד.
   ============================================================ */
:root{
  --ar:"Noto Sans Arabic",system-ui,"Segoe UI",Arial,sans-serif;
  --font:"Heebo","Rubik",system-ui,"Segoe UI",Arial,sans-serif;
  --en:"Lexend","Heebo",system-ui,"Segoe UI",Arial,sans-serif;
  --bg:#f4f7f6; --surface:#ffffff; --surface2:#e9efee;
  --ink:#0f1f1d; --muted:#54655f; --faint:#6f817b; --line:#dde6e3;
  --accent:#0f766e; --accent-ink:#ffffff; --accent-soft:#d6f0eb;
  --gold:#a16207; --gold-soft:#fbf0d5; --hit:#f5c451; --hit-ink:#1a1300;
  --ok:#15803d; --ok-soft:#dcfce7; --bad:#be123c; --bad-soft:#ffe4e9;
  --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(15,31,29,.05),0 8px 24px -12px rgba(15,31,29,.2);
  --r:14px;
  /* צבע לכל מסלול. לא קישוט: ארבעה סוגי לימוד שונים לגמרי, וצבע
     קבוע לכל אחד חוסך למי שמתקשה להתמצא את השאלה "איפה אני". */
  --c-sound:#0369a1; --cs-sound:#dbeefc;   /* צליל ואות   */
  --c-words:#15803d; --cs-words:#dcfce7;   /* מילים       */
  --c-talk:#c2410c;  --cs-talk:#fde5d8;    /* מדוברת      */
  --c-read:#6d28d9;  --cs-read:#eae2fd;    /* ספרותית     */
}

/* Heebo, Fredoka ו-Assistant אינם מכילים גליפים ערביים. בלי
   המשפחה הזאת הממשק הערבי נופל לגופן ברירת המחדל של המערכת —
   נמדד: הוא הוצג כאן ב-Heebo. Noto Sans Arabic נטען מאותה בקשת
   גופנים שכבר קיימת, ולכן אין כאן תלות חיצונית חדשה, וקובצי
   הגופן נמשכים רק כשבאמת מוצג טקסט ערבי. */
html[lang="ar"] body,html[lang="ar"] input,html[lang="ar"] button,
html[lang="ar"] textarea,html[lang="ar"] select{font-family:var(--ar)}
:root[data-theme="dark"]{
  --bg:#0d1b1a; --surface:#142624; --surface2:#1c3230;
  --ink:#e6f0ee; --muted:#9ab0aa; --faint:#6f8781; --line:#264240;
  --accent:#5eead4; --accent-ink:#0d1b1a; --accent-soft:#123c37;
  --gold:#fbbf24; --gold-soft:#33270f; --hit:#ffd24d; --hit-ink:#241a00;
  --ok:#4ade80; --ok-soft:#132a1c; --bad:#fb7185; --bad-soft:#33161f;
  --warn:#fbbf24; --warn-soft:#33260f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  --c-sound:#7dd3fc; --cs-sound:#0b2a3d;
  --c-words:#86efac; --cs-words:#0f2a1a;
  --c-talk:#fdba74;  --cs-talk:#3a2113;
  --c-read:#c4b5fd;  --cs-read:#261a45;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d1b1a; --surface:#142624; --surface2:#1c3230;
    --ink:#e6f0ee; --muted:#9ab0aa; --faint:#6f8781; --line:#264240;
    --accent:#5eead4; --accent-ink:#0d1b1a; --accent-soft:#123c37;
    --gold:#fbbf24; --gold-soft:#33270f; --hit:#ffd24d; --hit-ink:#241a00;
    --ok:#4ade80; --ok-soft:#132a1c; --bad:#fb7185; --bad-soft:#33161f;
    --warn:#fbbf24; --warn-soft:#33260f;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
    --c-sound:#7dd3fc; --cs-sound:#0b2a3d;
    --c-words:#86efac; --cs-words:#0f2a1a;
    --c-talk:#fdba74;  --cs-talk:#3a2113;
    --c-read:#c4b5fd;  --cs-read:#261a45;
  }
}
/* ניגודיות גבוהה — שחור על לבן, מסגרות מלאות, בלי גוונים רכים */
:root.hc{
  --bg:#ffffff; --surface:#ffffff; --surface2:#ffffff;
  --ink:#000000; --muted:#1a1a1a; --faint:#333333; --line:#000000;
  --accent:#00434b; --accent-ink:#ffffff; --accent-soft:#e6f2f3;
  --gold:#5c3d00; --gold-soft:#f7efdf; --hit:#ffe600; --hit-ink:#000000;
  --ok:#0a5c2a; --ok-soft:#e6f4ea; --bad:#8c0f2c; --bad-soft:#fbe9ed;
  --warn:#6b3d00; --warn-soft:#f7efdf; --shadow:none;
  --c-sound:#00305c; --cs-sound:#e8eef7;
  --c-words:#0a5c2a; --cs-words:#e6f4ea;
  --c-talk:#7a2c00;  --cs-talk:#f9ece4;
  --c-read:#3d1a75;  --cs-read:#eee8f9;
}
:root.hc *{box-shadow:none!important}
:root.hc .card,:root.hc .btn,:root.hc .opt{border-width:2px!important}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs,17px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  font-size:1rem;line-height:1.65;-webkit-text-size-adjust:100%}
:root.clear body{font-family:"Verdana","Tahoma","Heebo",sans-serif;letter-spacing:.012em}
:root.spaced body{word-spacing:.22em;line-height:1.95}
:root.rm *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
h1,h2,h3{margin:0;line-height:1.3;font-weight:800}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* כל טקסט אנגלי — כיוון, גופן ומרווח משלו. unicode-bidi:isolate מונע
   מהמשפט האנגלי לגרור אחריו את סימני הפיסוק של המשפט העברי. */
.en{font-family:var(--en);direction:ltr;unicode-bidi:isolate;text-align:start}
.en-b{font-family:var(--en);direction:ltr;unicode-bidi:isolate;display:inline-block}

.wrap{max-width:56rem;margin:0 auto;padding:0 clamp(.9rem,3vw,1.5rem)}
.hbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-block:.6rem}
:root.hc .hbar{background:var(--bg);backdrop-filter:none}
.hrow{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
.brand{font-size:1.35rem;font-weight:800;letter-spacing:-.01em;display:flex;
  align-items:baseline;gap:.5rem;margin-inline-end:auto}
.brand small{font-size:.72rem;font-weight:600;color:var(--muted);letter-spacing:.06em}
.gbtn{display:inline-flex;align-items:center;gap:.4rem;background:var(--surface);
  border:1px solid var(--line);border-radius:999px;padding:.42rem .8rem;cursor:pointer;
  font-size:.86rem;font-weight:600;box-shadow:var(--shadow);min-height:44px}
.gbtn:hover{border-color:var(--accent)}
.gbtn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:1.1rem}
.grid{display:grid;gap:.85rem}
@media(min-width:640px){.g2{grid-template-columns:1fr 1fr}}
@media(min-width:900px){.g3{grid-template-columns:repeat(3,1fr)}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;
  border:1px solid var(--line);background:var(--surface);border-radius:12px;
  padding:.72rem 1.1rem;font-weight:700;cursor:pointer;box-shadow:var(--shadow);
  min-height:2.9rem;font-size:1rem}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;box-shadow:none}
.btn[disabled]{opacity:.45;cursor:default}
.btn.wide{width:100%}
/* מודול המבחן הכיתתי הועתק ממשפחת math-uni, ושם .btn-p ו-.btn.w
   מוגדרים. כאן הם לא היו, ולכן "מבחן חדש", "צרו את המבחן", "התחלת
   מבחן" וכפתורי הוואטסאפ נראו ככפתור ריק בלי צבע — טקסט קטן עם פלוס.
   כחול, ולא טורקיז: זה כפתור של המורה, ובולט מכל שאר המסך. */
.btn-p{background:#2563eb;color:#fff;border-color:#2563eb}
.btn-p:hover{filter:brightness(1.1);border-color:#2563eb}
.btn.w{width:100%}

.chip{display:inline-flex;align-items:center;gap:.35rem;border-radius:999px;
  padding:.22rem .6rem;font-size:.78rem;font-weight:700;background:var(--surface2);color:var(--muted)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}

/* ===== מסלולים: הצבע נכנס ככרטיס, לא כרקע של טקסט ===== */
.trk{--c:var(--accent);--cs:var(--accent-soft)}
.t-sound{--c:var(--c-sound);--cs:var(--cs-sound)}
.t-words{--c:var(--c-words);--cs:var(--cs-words)}
.t-talk{--c:var(--c-talk); --cs:var(--cs-talk)}
.t-read{--c:var(--c-read); --cs:var(--cs-read)}
.tcard{border-inline-start:5px solid var(--c);cursor:pointer;text-align:start;width:100%;
  display:flex;flex-direction:column;gap:.4rem;align-items:stretch}
.tcard:hover{border-color:var(--c)}
.tcard h3{font-size:1.05rem}
.tcard .sub{font-size:.85rem;color:var(--muted)}
.tdot{width:.62rem;height:.62rem;border-radius:50%;background:var(--c);flex:none}
.thead{display:flex;align-items:center;gap:.5rem}
.tpill{background:var(--cs);color:var(--c);border-radius:999px;padding:.15rem .55rem;
  font-size:.72rem;font-weight:800}

/* ===== סרגל שליטה ברמות ===== */
.lvls{display:flex;gap:.4rem;flex-wrap:wrap}
.lvl{border:1px solid var(--line);background:var(--surface);border-radius:10px;
  padding:.4rem .7rem;font-size:.82rem;font-weight:700;cursor:pointer;
  display:inline-flex;align-items:center;gap:.4rem}
.lvl.on{background:var(--c,var(--accent));color:var(--accent-ink);border-color:var(--c,var(--accent))}
.bar{height:.42rem;border-radius:999px;background:var(--surface2);overflow:hidden;flex:1;min-width:3rem}
.bar i{display:block;height:100%;background:var(--c,var(--accent))}
.bar.b0 i{background:var(--bad)} .bar.b1 i{background:var(--warn)} .bar.b2 i{background:var(--ok)}

/* ===== תרגול ===== */
.qcard{border-top:5px solid var(--c,var(--accent))}
.qtop{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.7rem}
.qtext{font-size:1.12rem;font-weight:600;margin:.2rem 0 .3rem}
.qhint{color:var(--muted);font-size:.9rem}
/* המילה או המשפט שנלמדים. גדול, מרווח, ותמיד לצד כפתור השמעה. */
.subject{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;
  background:var(--surface2);border-radius:12px;padding:.85rem 1rem;margin:.5rem 0}
.subject .word{font-family:var(--en);direction:ltr;unicode-bidi:isolate;
  font-size:1.7rem;font-weight:700;letter-spacing:.01em;line-height:1.25}
.subject .ipa{font-family:var(--en);direction:ltr;unicode-bidi:isolate;
  color:var(--muted);font-size:.95rem}
.spk{border:1px solid var(--line);background:var(--surface);border-radius:999px;
  width:2.7rem;height:2.7rem;display:inline-flex;align-items:center;justify-content:center;
  cursor:pointer;flex:none;box-shadow:var(--shadow)}
.spk:hover{border-color:var(--accent);color:var(--accent)}
.spk.sm{width:2.1rem;height:2.1rem}
.spk.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.opts{display:grid;gap:.6rem;margin-top:.9rem}
@media(min-width:560px){.opts.two{grid-template-columns:1fr 1fr}}
.opt{display:flex;align-items:center;gap:.6rem;text-align:start;width:100%;
  border:2px solid var(--line);background:var(--surface);border-radius:12px;
  padding:.8rem .9rem;cursor:pointer;font-size:1.02rem;font-weight:600;min-height:3.1rem}
.opt:hover{border-color:var(--accent)}
.opt .k{width:1.9rem;height:1.9rem;border-radius:8px;background:var(--surface2);
  display:inline-flex;align-items:center;justify-content:center;font-size:.85rem;
  font-weight:800;color:var(--muted);flex:none}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .k{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .k{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.55}
/* בחירה במבחן היא בחירה, לא תשובה נכונה. במסכי התרגול הצבע
   הירוק אומר "צדקת", ובמבחן אסור לו להופיע כלל — הוא נותן
   משוב שגוי לכל בחירה. ניטרלי, ורק מסמן מה סומן. */
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);margin-inline-start:3px}
.dot.ok{background:var(--ok);border-color:var(--ok)}
.dot.no{background:var(--bad);border-color:var(--bad)}
.dot.flag{box-shadow:0 0 0 2px var(--accent)}

/* אריחי בניית משפט. הסדר הוא התרגיל, ולכן האריח חייב להיראות כמשהו
   שאפשר להרים — מסגרת מלאה ורקע משלו, לא טקסט על רקע הכרטיס. */
.tiles{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:.7rem}
.tile{font-family:var(--en);direction:ltr;border:2px solid var(--line);
  background:var(--surface);border-radius:10px;padding:.5rem .8rem;font-weight:600;
  cursor:pointer;font-size:1.02rem;min-height:2.7rem}
.tile:hover{border-color:var(--accent)}
.slot{min-height:3.2rem;border:2px dashed var(--line);border-radius:12px;
  background:var(--surface2);padding:.5rem;display:flex;flex-wrap:wrap;gap:.45rem;
  align-items:center;direction:ltr}
.slot.ok{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.slot.bad{border-style:solid;border-color:var(--bad);background:var(--bad-soft)}
.slot .tile{background:var(--surface)}

/* ===== משוב ===== */
.fb{margin-top:.9rem;border-radius:12px;padding:.85rem 1rem;border:1px solid transparent}
.fb.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.fb.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.fb b{display:block;font-size:1.02rem;margin-bottom:.2rem}
.fb .body{color:var(--ink);font-weight:500;font-size:.95rem}
.why{margin-top:.55rem;padding-top:.55rem;border-top:1px dashed currentColor;color:var(--ink);
  font-weight:500;font-size:.93rem}

/* ===== קטע קריאה ===== */
.passage{background:var(--surface2);border-radius:12px;padding:1rem 1.1rem;margin:.6rem 0;
  font-family:var(--en);direction:ltr;unicode-bidi:isolate;font-size:1.08rem;line-height:2}
.passage .s{border-radius:5px;padding:.05em .12em;cursor:pointer}
.passage .s:hover{background:var(--accent-soft)}
.passage .s.now{background:var(--accent-soft);box-shadow:0 2px 0 var(--accent)}
.wd{border-radius:5px;padding:1px 3px}
.wd.hit{background:var(--hit);color:var(--hit-ink);font-weight:600}
/* כשמנוע הדיבור אינו מדווח על גבולות מילים — קורה הרבה בעברית
   באנדרואיד — אין מה להדגיש מילה־מילה, ואז מודגש כל האיבר. הכלל
   שקיים כאן מכוון למשפט בתוך קטע קריאה בלבד, ולכן ההדגשה החלופית
   על איבר אחר לא נראתה כלל. */
.wd.now,p.now,div.now,span.now,b.now{background:var(--hit);color:var(--hit-ink);
  border-radius:8px;box-shadow:0 0 0 4px var(--hit)}
.gloss{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.5rem}
.gword{border:1px solid var(--line);background:var(--surface);border-radius:999px;
  padding:.25rem .6rem;font-size:.85rem;cursor:pointer}
.gword b{font-family:var(--en);direction:ltr;unicode-bidi:isolate}

/* ===== סרגל מצב הקול ===== */
.vstrip{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;border-radius:10px;
  padding:.45rem .7rem;font-size:.85rem;font-weight:600;margin-bottom:.7rem}
.vstrip.ok{background:var(--ok-soft);color:var(--ok)}
.vstrip.warn{background:var(--warn-soft);color:var(--warn)}
.vstrip.bad{background:var(--bad-soft);color:var(--bad)}
.vstrip .btn{padding:.3rem .7rem;min-height:44px;font-size:.82rem}  /* 2.1rem היו 36 פיקסלים — מתחת ליעד המגע */

/* ===== הגדרות ===== */
.row{display:flex;align-items:center;justify-content:space-between;gap:.8rem;
  padding:.7rem 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row:last-child{border-bottom:0}
.row .lab{font-weight:700}
.row .desc{font-size:.85rem;color:var(--muted);font-weight:500}
.sw{width:3.2rem;height:1.8rem;border-radius:999px;background:var(--surface2);
  border:1px solid var(--line);position:relative;cursor:pointer;flex:none}
.sw i{position:absolute;top:.18rem;inset-inline-start:.2rem;width:1.3rem;height:1.3rem;
  border-radius:50%;background:var(--faint);transition:.15s}
.sw.on{background:var(--accent);border-color:var(--accent)}
.sw.on i{inset-inline-start:1.5rem;background:#fff}
.vgrid{display:grid;gap:.5rem;grid-template-columns:1fr}
@media(min-width:560px){.vgrid{grid-template-columns:1fr 1fr}}
.vopt{display:flex;align-items:center;gap:.6rem;border:2px solid var(--line);
  background:var(--surface);border-radius:12px;padding:.6rem .75rem;cursor:pointer;text-align:start}
.vopt.on{border-color:var(--accent);background:var(--accent-soft)}
.vopt .nm{font-weight:700}

  bar.id="demo-bar"; bar.hidden=true;
  bar.setAttribute("role","status");
  bar.setAttribute("aria-live","polite");
  bar.innerHTML='<div id="demo-sub"><p id="demo-txt"></p>'+
    '<div id="demo-meta"><span id="demo-step"></span>'+
    '<button id="demo-exit" type="button">יציאה · ESC</button></div>'+
    '<div id="demo-prog"><i></i></div></div>';
  document.body.appendChild(bar);

  DEMO.btn=b; DEMO.bar=bar;
  DEMO.txt=document.getElementById("demo-txt");
  DEMO.step=document.getElementById("demo-step");
  DEMO.fill=bar.querySelector("#demo-prog i");
  document.getElementById("demo-exit").addEventListener("click",function(){demoStop()});
  document.addEventListener("keydown",demoKey,true);
}

/* ESC יוצא. הקשבה בשלב הלכידה, כדי שמסך שכבר מטפל ב-Escape
   לא יבלע את המקש לפני שההדגמה ראתה אותו. */
function demoKey(e){
  if(!DEMO.on)return;
  if(e.key==="Escape"||e.keyCode===27){
    e.preventDefault(); e.stopPropagation();
    demoStop();
  }
}

function demoStart(){
  if(DEMO.on)return;
  DEMO.on=true; DEMO.i=0;
  DEMO.btn.hidden=true; DEMO.bar.hidden=false;
  document.documentElement.classList.add("demo-running");
  demoNext();
}

function demoNext(){
  if(!DEMO.on)return;
  if(DEMO.i>=DEMO_SCRIPT.length){demoStop();return}
  var it=DEMO_SCRIPT[DEMO.i++]||{};
  var d=Math.max(600,it.duration||3000);
  DEMO.txt.textContent=it.subtitle||"";
  DEMO.step.textContent=DEMO.i+" / "+DEMO_SCRIPT.length;
  DEMO.fill.style.transition="none"; DEMO.fill.style.width="0";
  void DEMO.fill.offsetWidth;
  DEMO.fill.style.transition="width "+d+"ms linear";
  DEMO.fill.style.width="100%";
  if(typeof it.action==="function"){
    try{it.action()}catch(err){if(window.console)console.warn("demo:",err)}
  }
  DEMO.timer=setTimeout(demoNext,d);
}

function demoStop(){
  DEMO.on=false;
  if(DEMO.timer){clearTimeout(DEMO.timer);DEMO.timer=null}
  DEMO.extra.forEach(function(t){clearTimeout(t);clearInterval(t)});
  DEMO.extra=[];
  var m=document.querySelectorAll(".demo-tap"),i;
  for(i=0;i<m.length;i++)m[i].classList.remove("demo-tap");
  if(DEMO.bar)DEMO.bar.hidden=true;
  if(DEMO.btn)DEMO.btn.hidden=false;
  document.documentElement.classList.remove("demo-running");
  demoQuiet();
}

}

function load(){
  try{

    Object.keys(blankState()).forEach(function(k){if(o[k]!==undefined)state[k]=o[k]});
  }catch(e){}
  if(!LANGS[state.lang])state.lang=guessLang();

/* שפת הדפדפן, לא ברירת מחדל עברית. מי שפותח את האפליקציה במכשיר
   ברוסית לא אמור להיתקל קודם במסך בעברית שאינו יכול לקרוא. */
/* אנגלית אינה סימן. טלפון בישראל מדווח אנגלית כברירת מחדל של
   המכשיר, לא כבחירה, והאפליקציה נפתחה באנגלית למי שבא ללמוד
   בעברית. ערבית ורוסית כן נחשבות — שם זו שפת אם של ממש. מי
   שרוצה אנגלית בוחר אותה, והבחירה נשמרת. */
function guessLang(){
  var ls=(navigator.languages||[navigator.language||"he"]).map(function(x){
    return String(x).toLowerCase().split("-")[0]});
  for(var i=0;i<ls.length;i++){
    var c=ls[i]==="iw"?"he":ls[i];
    if(c==="en")continue;
    if(LANGS[c])return c;
  }
  return "he";
}
function touchDay(){
  var d=todayIso();
  if(state.day.d!==d){
    var y=new Date(Date.now()-86400000);
    var yi=y.getFullYear()+"-"+String(y.getMonth()+1).padStart(2,"0")+"-"+String(y.getDate()).padStart(2,"0");
    state.streak=(state.lastDay===yi)?(state.streak||0)+1:1;
    state.lastDay=d; state.day={d:d,n:0};
  }
}
function stKey(tid,lv){return tid+"|"+lv}
function stOf(tid,lv){
  var k=stKey(tid,lv);

  return state.stats[k];
}
function mastery(tid,lv){
  var s=state.stats[stKey(tid,lv)];
  if(!s||!s.seen)return 0;
  return clamp(s.ok/Math.max(6,s.seen),0,1);
}

/* ------------------------------------------------------------
   פיצול לאמירות קצרות — הועתק מ"תאוריה מדברת", שם ההקראה נשמעת
   הכי טוב. מנועי מכשיר מאיצים ובולעים סופי מילים במשפט ארוך;
   כאן נשלחה שאלה שלמה באמירה אחת, לפעמים 300 תווים.
   כל מקטע נושא את ההיסט שלו במחרוזת המלאה, כי charIndex מתאפס
   בכל אמירה ובלעדיו ההדגשה קופצת לתחילת המשפט בכל מקטע.
   ------------------------------------------------------------ */
var SEG_MAX=90, SEG_GAP=260;
/* סימן פיסוק בין שתי ספרות הוא חלק מהמספר ולא מקום לחתוך בו:
   בלי הבדיקה הזאת "3,500" נשבר והמנוע קורא "שלוש, חמש מאות". */
function insideNumber(str,i){
  return i>0&&i+1<str.length&&/[0-9]/.test(str[i-1])&&/[0-9]/.test(str[i+1]);
}
function segments(spoken){
  var out=[],parts=[],from=0,i,j;
  function push(t,start){ if(String(t).trim())out.push({text:t,start:start}) }
  for(i=0;i<spoken.length;i++){
    if(".!?:;".indexOf(spoken[i])<0)continue;
    if(insideNumber(spoken,i))continue;
    j=i+1; while(j<spoken.length&&/\s/.test(spoken[j]))j++;
    parts.push({text:spoken.slice(from,j),start:from});
    from=j; i=j-1;
  }
  if(from<spoken.length)parts.push({text:spoken.slice(from),start:from});
  for(var k=0;k<parts.length;k++){
    var p=parts[k];
    if(p.text.length<=SEG_MAX){ push(p.text,p.start); continue }
    var rest=p.text,base=p.start;
    while(rest.length>SEG_MAX){
      var cut=rest.lastIndexOf(",",SEG_MAX);
      while(cut>0&&insideNumber(rest,cut))cut=rest.lastIndexOf(",",cut-1);
      if(cut<SEG_MAX*0.4)cut=rest.lastIndexOf(" ",SEG_MAX);
      if(cut<=0)break;
      push(rest.slice(0,cut+1),base);
      base+=cut+1; rest=rest.slice(cut+1);
    }
    push(rest,base);
  }
  /* מקטע זעיר — "12." או ")" — עם הפסקה של רבע שנייה אחריו נשמע
     כמו גמגום. מאחדים אותו לזה שאחריו. */
  var merged=[];
  for(i=0;i<out.length;i++){
    if(merged.length&&out[i].text.trim().length<12&&
       merged[merged.length-1].text.length+out[i].text.length<=SEG_MAX*1.4){
      merged[merged.length-1].text+=out[i].text; continue;
    }
    if(out[i].text.trim().length<12&&i+1<out.length){
      out[i+1]={text:out[i].text+out[i+1].text,start:out[i].start}; continue;
    }
    merged.push(out[i]);
  }
  out=merged;
  return out.length?out:[{text:spoken,start:0}];
}
/* קצב לפי שפה — אותם ערכים שנבחרו בתאוריה מדברת אחרי האזנה */
var VOICE_TUNE={he:0.82,ar:0.85,en:0.90,ru:0.88};
function tuneRate(lang,rate){
  var t=VOICE_TUNE[String(lang||"he").split("-")[0].toLowerCase()]||0.88;
  var r=t*(rate||1);
  return Math.max(0.5,Math.min(1.6,Math.round(r*100)/100));
}

/* ------------------------------------------------------------

   וכעבור SEG_GAP ההקראה הישנה חוזרת מעל החדשה — שני קולות
   במקביל. מונה אחד פותר את זה: כל הקראה מקבלת מספר, stopSpeak
   מקדם אותו, ומקטע מדור ישן פשוט אינו מדבר.
   ------------------------------------------------------------ */
var _sayGen=0;
function speakDevice(text,code,rate){
  if(!("speechSynthesis" in window))return false;
  try{speechSynthesis.cancel()}catch(e){}
  var my=++_sayGen;
  /* האמירה יוצאת מיד, בתוך הלחיצה. קודם היא נעטפה ב-voicesReady,
     שממתין לרשימת הקולות ועד ארבע שניות אם היא לא מגיעה — ואמירה
     שיוצאת ארבע שניות אחרי המגע נזרקת בשקט באנדרואיד ובספארי.
     כשהרשימה כבר כאן, בוחרים קול ומדברים. כשהיא ריקה — מדברים
     בכל זאת, עם u.lang בלבד: קול ברירת מחדל בשפה הנכונה עדיף על
     שתיקה, ויש מכשירים שמחזירים רשימה ריקה לצמיתות ומדברים היטב.
     voicesReady נשאר בשימוש למסך בחירת הקול, שם ההמתנה במקומה. */
  (function(){
    try{
      var v=bestVoice(code), lang=(v&&v.lang)||code;
      var segs=segments(String(text)), rt=tuneRate(lang,clamp(rate,0.55,1.4));
      var pit=femLift(v);
      (function sayseg(k){
        if(my!==_sayGen)return;   /* ההקראה הזאת בוטלה — המקטע הבא לא יוצא */
        if(k>=segs.length){ hlClear(); ttsOK(); return }
        var seg=segs[k];
        var u=new SpeechSynthesisUtterance(seg.text);
        u.lang=lang;
        if(v){ try{ u.voice=v }catch(e2){} }
        u.rate=rt; u.pitch=pit; u.volume=1;
        u.onboundary=function(e){if(!e.name||e.name==="word")hlAt(seg.start+e.charIndex)};
        u.onend=function(){
          if(k+1<segs.length) setTimeout(function(){sayseg(k+1)},SEG_GAP);
          else { hlClear(); ttsOK() }
        };
        u.onerror=function(e){ttsFail(e&&e.error)};
        speechSynthesis.speak(u);
      })(0);
    }catch(e){}
  })();

}

function speak(text,lang,rateMul){

     לבד, וניקוי חוזר אינו משנה דבר — אבל בלעדיו כל מחרוזת שנשארה
     עם <sub> או <span class="frac"> הוקראה בקול כתגית: הסטודנט
     שמע "span class frac" באמצע השאלה. */
  text=plainOf(String(text||"")).trim(); if(!text)return;
  lang=lang||"en";
  var code=lang==="en"?EN_TTS:LANGS[lang].tts;
  var rate=clamp(state.rate*(rateMul||1),0.55,1.4);
  stopSpeak();
  var my=_sayGen;   /* גם תשובת רשת שמגיעה אחרי עצירה לא תושמע */
  if(gemOn()){
    var vid=gvOf(state.gemVoice).id;
    var ck=lang+"|"+vid+"|"+rate.toFixed(2)+"|"+text;
    if(gCache[ck]){playUrl(gCache[ck],text,code,rate);return}
    gBusy=true; renderSpeakState();

/* ============================================================
   7. תוכן
   ------------------------------------------------------------
   E(y, t, w, c, e) — אירוע. y היא השנה, ושלילית פירושה לפני
     הספירה. t הכותרת, w מה קרה, c הסיבה ו-e התוצאה. ארבעת
     השדות אינם קישוט: מהם נבנות ארבע שאלות שונות על אותו
     אירוע, ומהם נבנים גם המסיחים של האירועים השכנים.
   C(t, d) — מושג והגדרתו.
   Sc(lines, qs) — מקור היסטורי קצר ושאלות עליו.
   כל שדה קיים בארבע השפות. היסטוריה נלמדת בשפת האם — תלמיד
     שקורא בקושי בעברית לא ילמד סיבתיות מטקסט שהוא מפענח מילה
     מילה, ולכן התוכן עצמו מתורגם ולא רק הממשק.
   ============================================================ */

  {he:"פוליס, דמוקרטיה ומסע הכיבושים של אלכסנדר",
   ar:"المدينة-الدولة والديمقراطية وفتوحات الإسكندر",
   ru:"Полис, демократия и походы Александра",
   en:"The polis, democracy and Alexander's campaigns"},
[
 [ /* רמה 1 */
  E(-508,
    {he:"הרפורמה של קלייסתנס",ar:"إصلاح كليسثينيس",ru:"Реформа Клисфена",en:"The reform of Cleisthenes"},
    {he:"קלייסתנס חילק את אזרחי אתונה לעשרה שבטים לפי מקום מגורים, וכל אזרח קיבל זכות דיבור והצבעה באסיפת העם.",
     ar:"قسّم كليسثينيس مواطني أثينا إلى عشر قبائل حسب مكان السكن، ونال كل مواطن حق الكلام والتصويت في الجمعية.",
     ru:"Клисфен разделил граждан Афин на десять фил по месту жительства, и каждый гражданин получил право говорить и голосовать в народном собрании.",
     en:"Cleisthenes divided the citizens of Athens into ten tribes by where they lived, and every citizen got the right to speak and vote in the assembly."},
    {he:"משפחות אצולה עשירות שלטו באתונה, והמתח בין העם לבינן איים לפרוץ.",
     ar:"سيطرت عائلات أرستقراطية غنية على أثينا، وكاد التوتر بين الشعب وبينها أن ينفجر.",
     ru:"Афинами правили богатые аристократические семьи, и напряжение между народом и ними готово было прорваться.",
     en:"Rich aristocratic families ruled Athens, and the tension between them and the people was close to breaking out."},
    {he:"נולד המשטר הדמוקרטי הראשון — שלטון שבו האזרחים מחליטים בעצמם ולא מלך יחיד.",
     ar:"وُلد أول نظام ديمقراطي — حكم يقرّر فيه المواطنون بأنفسهم لا ملك واحد.",
     ru:"Родился первый демократический строй — власть, при которой решают сами граждане, а не единственный царь.",
     en:"The first democratic system was born — a government in which the citizens decide for themselves rather than a single king."}),
  E(-490,
    {he:"קרב מרתון",ar:"معركة ماراثون",ru:"Марафонская битва",en:"The battle of Marathon"},
    {he:"צבא אתונה הקטן הביס במישור מרתון את הצבא הפרסי, שהיה גדול ממנו פי כמה.",
     ar:"هزم جيش أثينا الصغير في سهل ماراثون الجيش الفارسي الذي كان يفوقه بأضعاف.",
     ru:"Небольшое афинское войско разбило на Марафонской равнине персидскую армию, в несколько раз большую.",
     en:"The small Athenian army defeated on the plain of Marathon a Persian army several times its size."},
    {he:"פרס שלחה צי כדי להעניש את אתונה על שסייעה למרד הערים היווניות באסיה.",
     ar:"أرسلت فارس أسطولًا لمعاقبة أثينا على مساعدتها ثورة المدن اليونانية في آسيا.",
     ru:"Персия послала флот, чтобы наказать Афины за помощь восстанию греческих городов в Азии.",
     en:"Persia sent a fleet to punish Athens for helping the revolt of the Greek cities in Asia."},
    {he:"היוונים הבינו שאפשר לעצור את פרס, וביטחונה העצמי של אתונה גדל מאוד.",
     ar:"أدرك اليونانيون أن بالإمكان إيقاف فارس، وازدادت ثقة أثينا بنفسها كثيرًا.",
     ru:"Греки поняли, что Персию можно остановить, и уверенность Афин в себе резко выросла.",
     en:"The Greeks realised Persia could be stopped, and the self-confidence of Athens grew enormously."}),
  E(-431,
    {he:"מלחמת הפלופונס",ar:"الحرب البيلوبونيسية",ru:"Пелопоннесская война",en:"The Peloponnesian War"},
    {he:"אתונה וספרטה נלחמו זו בזו עשרים ושבע שנה, עד שספרטה ניצחה ואתונה נכנעה.",
     ar:"تحاربت أثينا وإسبرطة سبعًا وعشرين سنة، حتى انتصرت إسبرطة واستسلمت أثينا.",
     ru:"Афины и Спарта воевали двадцать семь лет, пока Спарта не победила и Афины не сдались.",
     en:"Athens and Sparta fought each other for twenty-seven years, until Sparta won and Athens surrendered."},
    {he:"ערי יוון חששו מכוחה הגדל של אתונה ומהכסף שגבתה מבנות בריתה.",
     ar:"خشيت المدن اليونانية من قوة أثينا المتنامية ومن الأموال التي جبتها من حليفاتها.",
     ru:"Греческие города боялись растущей мощи Афин и денег, которые она собирала с союзников.",
     en:"The Greek cities feared the growing power of Athens and the money it collected from its allies."},
    {he:"אתונה איבדה את מעמדה, יוון כולה נחלשה, ומוקדון כבשה אותה כעבור דור.",
     ar:"فقدت أثينا مكانتها، وضعفت اليونان كلها، وفتحتها مقدونيا بعد جيل.",
     ru:"Афины потеряли своё положение, вся Греция ослабла, и через поколение её завоевала Македония.",
     en:"Athens lost its standing, all of Greece was weakened, and a generation later Macedon conquered it."}),
  C({he:"פוליס",ar:"مدينة-دولة",ru:"Полис",en:"Polis"},
    {he:"עיר-מדינה יוונית: עיר ושדותיה, עם חוקים, מטבע וצבא משלה.",
     ar:"مدينة-دولة يونانية: مدينة وحقولها، لها قوانينها وعملتها وجيشها.",
     ru:"Греческий город-государство: город и его земли, со своими законами, монетой и войском.",
     en:"A Greek city-state: a city and its fields, with its own laws, coin and army."})
 ],
 [ /* רמה 2 */
  E(-399,
    {he:"משפט סוקרטס",ar:"محاكمة سقراط",ru:"Суд над Сократом",en:"The trial of Socrates"},
    {he:"בית הדין של אתונה דן את הפילוסוף סוקרטס למוות, והוא שתה את כוס הרעל.",
     ar:"حكمت محكمة أثينا على الفيلسوف سقراط بالإعدام، فشرب كأس السمّ.",
     ru:"Афинский суд приговорил философа Сократа к смерти, и он выпил чашу с ядом.",
     en:"The court of Athens sentenced the philosopher Socrates to death, and he drank the cup of poison."},
    {he:"סוקרטס שאל שאלות שערערו על מוסכמות, ואחרי התבוסה לספרטה רבים ראו בכך סכנה.",
     ar:"طرح سقراط أسئلة زعزعت المسلّمات، وبعد الهزيمة أمام إسبرطة رأى كثيرون في ذلك خطرًا.",
     ru:"Сократ задавал вопросы, подрывавшие общепринятое, и после поражения от Спарты многие увидели в этом опасность.",
     en:"Socrates asked questions that unsettled accepted ideas, and after the defeat by Sparta many saw that as dangerous."},
    {he:"תלמידו אפלטון כתב את דבריו, והשאלות שלו נשארו בלב הפילוסופיה עד היום.",
     ar:"دوّن تلميذه أفلاطون أقواله، وبقيت أسئلته في صميم الفلسفة حتى اليوم.",
     ru:"Его ученик Платон записал его слова, и его вопросы остались в центре философии до сегодняшнего дня.",
     en:"His pupil Plato wrote down his words, and his questions have stayed at the heart of philosophy ever since."}),
  E(-336,
    {he:"אלכסנדר מוקדון עולה לשלטון",ar:"تولّي الإسكندر المقدوني الحكم",ru:"Александр Македонский приходит к власти",en:"Alexander of Macedon comes to power"},
    {he:"אלכסנדר בן העשרים ירש את אביו פיליפוס ויצא למסע כיבושים מזרחה.",
     ar:"ورث الإسكندر ابن العشرين أباه فيليب وخرج في حملة فتوحات نحو الشرق.",
     ru:"Двадцатилетний Александр унаследовал отцу Филиппу и отправился в поход на восток.",
     en:"Alexander, aged twenty, succeeded his father Philip and set out on a campaign of conquest eastwards."},
    {he:"פיליפוס איחד את ערי יוון תחת מוקדון ובנה צבא חזק, ואז נרצח.",
     ar:"وحّد فيليب المدن اليونانية تحت مقدونيا وبنى جيشًا قويًا، ثم اغتيل.",
     ru:"Филипп объединил греческие города под властью Македонии и создал сильное войско, а затем был убит.",
     en:"Philip united the Greek cities under Macedon and built a strong army, and then was assassinated."},
    {he:"בתוך שלוש עשרה שנה נוצרה אימפריה שהשתרעה מיוון ועד הודו.",
     ar:"في ثلاث عشرة سنة نشأت إمبراطورية امتدت من اليونان حتى الهند.",
     ru:"За тринадцать лет возникла империя, простиравшаяся от Греции до Индии.",
     en:"Within thirteen years an empire arose that stretched from Greece to India."}),
  E(-323,
    {he:"מות אלכסנדר וחלוקת האימפריה",ar:"موت الإسكندر وتقسيم الإمبراطورية",ru:"Смерть Александра и раздел империи",en:"Alexander's death and the division of the empire"},
    {he:"אלכסנדר מת בבבל בגיל שלושים ושתיים, ומצביאיו חילקו ביניהם את האימפריה.",
     ar:"مات الإسكندر في بابل في الثانية والثلاثين، واقتسم قادته الإمبراطورية بينهم.",
     ru:"Александр умер в Вавилоне в тридцать два года, и его полководцы разделили империю между собой.",
     en:"Alexander died in Babylon at thirty-two, and his generals divided the empire between them."},
    {he:"לא היה לו יורש בוגר, והמצביאים היו חזקים ומרוחקים זה מזה.",
     ar:"لم يكن له وريث بالغ، وكان قادته أقوياء ومتباعدين.",
     ru:"У него не было взрослого наследника, а полководцы были сильны и далеки друг от друга.",
     en:"He had no grown heir, and the generals were powerful and far from one another."},
    {he:"קמו ממלכות הלניסטיות — התלמיים במצרים והסלווקים בסוריה — ובין שתיהן נקרעה ארץ ישראל.",
     ar:"قامت ممالك هلنستية — البطالمة في مصر والسلوقيون في سوريا — وتمزّقت أرض إسرائيل بينهما.",
     ru:"Возникли эллинистические царства — Птолемеи в Египте и Селевкиды в Сирии, — и Земля Израиля разрывалась между ними.",
     en:"Hellenistic kingdoms arose — the Ptolemies in Egypt and the Seleucids in Syria — and the Land of Israel was torn between them."}),
  C({he:"הלניזם",ar:"الهلينية",ru:"Эллинизм",en:"Hellenism"},
    {he:"התרבות שנוצרה מהמפגש בין התרבות היוונית לתרבויות המזרח אחרי כיבושי אלכסנדר.",
     ar:"الثقافة التي نشأت من لقاء الثقافة اليونانية بثقافات الشرق بعد فتوحات الإسكندر.",
     ru:"Культура, возникшая от встречи греческой культуры с культурами Востока после походов Александра.",
     en:"The culture that arose from the meeting of Greek culture with the cultures of the East after Alexander's conquests."})
 ],
 [ /* רמה 3 */
  E(-447,
    {he:"בניית הפרתנון",ar:"بناء البارثينون",ru:"Строительство Парфенона",en:"The building of the Parthenon"},
    {he:"אתונה בנתה על האקרופוליס מקדש שיש ענק לאלה אתנה, בכספי בנות בריתה.",
     ar:"بنت أثينا على الأكروبوليس معبدًا رخاميًا ضخمًا للإلهة أثينا، بأموال حليفاتها.",
     ru:"Афины возвели на Акрополе огромный мраморный храм богине Афине на деньги союзников.",
     en:"Athens built on the Acropolis a huge marble temple to the goddess Athena, with money from its allies."},
    {he:"פריקלס רצה להפוך את אתונה למרכז התרבות של יוון, וקופת הברית עמדה לרשותו.",
     ar:"أراد بريكليس أن يجعل أثينا مركز الثقافة في اليونان، وكانت خزينة الحلف تحت تصرّفه.",
     ru:"Перикл хотел сделать Афины культурным центром Греции, и казна союза была в его распоряжении.",
     en:"Pericles wanted to make Athens the cultural centre of Greece, and the treasury of the alliance was at his disposal."},
    {he:"אתונה זכתה לפאר חסר תקדים, אבל בנות בריתה חשו נשדדות והמתח לקראת המלחמה גבר.",
     ar:"نالت أثينا فخامة غير مسبوقة، لكن حليفاتها شعرن بالنهب وازداد التوتر نحو الحرب.",
     ru:"Афины получили небывалое великолепие, но союзники почувствовали себя обобранными, и напряжение перед войной выросло.",
     en:"Athens gained unmatched splendour, but its allies felt robbed and the tension towards war increased."}),
  C({he:"אזרח באתונה",ar:"مواطن في أثينا",ru:"Гражданин в Афинах",en:"A citizen in Athens"},
    {he:"גבר בוגר שנולד להורים אתונאים. נשים, זרים ועבדים לא נחשבו אזרחים ולא הצביעו.",
     ar:"رجل بالغ وُلد لأبوين أثينيين. أما النساء والغرباء والعبيد فلم يُعدّوا مواطنين ولم يصوّتوا.",
     ru:"Взрослый мужчина, рождённый от афинских родителей. Женщины, чужеземцы и рабы гражданами не считались и не голосовали.",
     en:"An adult man born to Athenian parents. Women, foreigners and slaves were not citizens and did not vote."}),
  C({he:"אוסטרקיזם",ar:"النفي بالتصويت",ru:"Остракизм",en:"Ostracism"},
    {he:"הצבעה שבה אזרחי אתונה יכלו לגרש מהעיר לעשר שנים אדם שנראה להם מסוכן לדמוקרטיה.",
     ar:"تصويت كان يمكن لمواطني أثينا فيه أن ينفوا من المدينة عشر سنوات شخصًا يرونه خطرًا على الديمقراطية.",
     ru:"Голосование, которым афинские граждане могли изгнать из города на десять лет человека, казавшегося им опасным для демократии.",
     en:"A vote by which the citizens of Athens could banish from the city for ten years anyone they thought dangerous to democracy."}),
  Sc({he:["המשטר שלנו נקרא דמוקרטיה, משום שהשלטון אינו בידי מעטים אלא בידי הרבים.",
          "בפני החוק הכול שווים כשיש ביניהם סכסוך פרטי.",
          "וכשאדם נבחר לתפקיד ציבורי, לא מוצאו קובע אלא כישרונו.",
          "גם עוני אינו מכשול: מי שיכול להועיל לעיר אינו נפסל בגלל מעמדו."],
      ar:["نظامنا يُسمّى ديمقراطية، لأن الحكم ليس بيد قلّة بل بيد الكثرة.",
          "أمام القانون الجميع سواء حين يقع بينهم خلاف خاص.",
          "وحين يُنتخب المرء لمنصب عام، لا يحسم أصله بل كفاءته.",
          "والفقر أيضًا ليس عائقًا: من يستطيع أن ينفع المدينة لا يُستبعد بسبب مكانته."],
      ru:["Наш строй называется демократией, потому что власть не в руках немногих, а в руках большинства.",
          "Перед законом все равны, когда между ними частный спор.",
          "А когда человека избирают на общественную должность, решает не происхождение, а способность.",
          "И бедность не помеха: тот, кто может принести пользу городу, не отвергается из-за своего положения."],
      en:["Our system is called a democracy, because power is not in the hands of a few but of the many.",
          "Before the law all are equal when a private dispute arises between them.",
          "And when a man is chosen for public office, it is not his birth that decides but his ability.",
          "Poverty is no obstacle either: a man who can serve the city is not rejected because of his standing."]},
     [Q({he:"מה מציג פריקלס כיתרון של אתונה?",ar:"ما الذي يعرضه بريكليس كميزة لأثينا؟",ru:"Что Перикл представляет как преимущество Афин?",en:"What does Pericles present as the advantage of Athens?"},
        {he:"תפקיד ציבורי ניתן לפי כישרון ולא לפי מוצא או עושר.",ar:"المنصب العام يُمنح حسب الكفاءة لا حسب الأصل أو الثروة.",ru:"Общественная должность даётся по способностям, а не по происхождению или богатству.",en:"Public office is given by ability, not by birth or wealth."},
        [{he:"רק בני האצולה מקבלים תפקיד ציבורי, לפי מוצא המשפחה שלהם.",ar:"أبناء الأرستقراطية وحدهم ينالون منصبًا عامًا، حسب أصل العائلة.",ru:"Общественную должность в городе получают только знатные люди, по происхождению их семьи.",en:"Only nobles receive public office, according to their family birth."},
         {he:"המלך ממנה את בעלי התפקידים, והעם מאשר את בחירתו באסיפה.",ar:"الملك يعيّن أصحاب المناصب، والشعب يصادق على اختياره في الجمعية.",ru:"Должностных лиц в городе назначает царь, а народ утверждает сделанный им выбор на собрании.",en:"The king appoints the officials, and the people approve his choice at the assembly."},
         {he:"החוק שונה לעשירים ולעניים גם בסכסוך פרטי פשוט ביניהם.",ar:"القانون يختلف للأغنياء والفقراء حتى في خلاف خاص بسيط بينهم.",ru:"Закон различен для богатых и для бедных даже в самом простом частном споре между ними.",en:"The law differs for rich and poor in a private dispute between them."}],
        [{he:"המקור אומר בדיוק ההפך: לא המוצא קובע אלא הכישרון.",ar:"المصدر يقول العكس تمامًا: لا يحسم الأصل بل الكفاءة.",ru:"Источник говорит прямо обратное: решает не происхождение, а способность.",en:"The source says the opposite: ability decides, not birth."},
         {he:"באתונה אין מלך. את ההחלטות מקבלת אסיפת העם.",ar:"لا ملك في أثينا. الجمعية الشعبية هي التي تقرّر.",ru:"В Афинах нет царя. Решения принимает народное собрание.",en:"Athens has no king. The assembly of the people decides."},
         {he:"המקור אומר שבפני החוק הכול שווים בסכסוך פרטי.",ar:"يقول المصدر إن الجميع سواء أمام القانون في خلاف خاص.",ru:"Источник говорит, что перед законом все равны в частном споре.",en:"The source says all are equal before the law in a private dispute."}]),
      Q({he:"מי אינו נכלל ב״רבים״ שעליהם מדבר פריקלס?",ar:"من لا يشمله «الكثرة» الذين يتحدث عنهم بريكليس؟",ru:"Кто не входит в «большинство», о котором говорит Перикл?",en:"Who is not included in the \"many\" Pericles speaks of?"},
        {he:"נשים, זרים ועבדים, שלא היו אזרחים ולא הצביעו.",ar:"النساء والغرباء والعبيد، فلم يكونوا مواطنين ولم يصوّتوا.",ru:"Женщины, чужеземцы и рабы, которые не были гражданами и не голосовали.",en:"Women, foreigners and slaves, who were not citizens and did not vote."},
        [{he:"החקלאים, שגרו רחוק מהעיר ועבדו בשדה בימי האסיפה.",ar:"الفلاحون، الذين سكنوا بعيدًا عن المدينة وعملوا في الحقل أيام الجمعية.",ru:"Земледельцы, жившие далеко за городом и работавшие в поле в дни собрания.",en:"The farmers, who lived far outside the city and worked their fields on assembly days."},
         {he:"החיילים, שהיו בחזית בימים שבהם התכנסה האסיפה בעיר.",ar:"الجنود، الذين كانوا في الجبهة أيام انعقاد الجمعية في المدينة.",ru:"Воины, находившиеся на фронте в те дни, когда собрание сходилось в городе.",en:"The soldiers, who were at the front in the days when the assembly met in the city."},
         {he:"אף אחד, שהרי כל תושבי אתונה הצביעו באסיפת העם.",ar:"لا أحد، فكل سكان أثينا صوّتوا في الجمعية الشعبية.",ru:"Никто, ведь все жители Афин голосовали в народном собрании.",en:"No one, because all the inhabitants of Athens voted in the assembly."}],
        [{he:"חקלאי אתונאי היה אזרח, וזכות ההצבעה שלו נשמרה.",ar:"الفلاح الأثيني كان مواطنًا، وحقّه في التصويت محفوظ.",ru:"Афинский земледелец был гражданином, и его право голоса сохранялось.",en:"An Athenian farmer was a citizen, and kept his right to vote."},
         {he:"היעדרות זמנית אינה שלילת אזרחות. הם נשארו אזרחים.",ar:"الغياب المؤقت ليس سلبًا للمواطنة. بقوا مواطنين.",ru:"Временное отсутствие не лишает гражданства. Они оставались гражданами.",en:"Being away for a time is not loss of citizenship. They stayed citizens."},
         {he:"רוב התושבים לא היו אזרחים כלל, ולכן לא הצביעו.",ar:"معظم السكان لم يكونوا مواطنين أصلًا، فلم يصوّتوا.",ru:"Большинство жителей вообще не были гражданами и не голосовали.",en:"Most inhabitants were not citizens at all, so they did not vote."}])])
 ]
]);

topic("rome","anc",
  {he:"רומא",ar:"روما",ru:"Рим",en:"Rome"},
  {he:"מרפובליקה לקיסרות, ומשם לאימפריה שהחזיקה מאות שנים",
   ar:"من الجمهورية إلى الإمبراطورية، ومنها إلى دولة دامت قرونًا",
   ru:"От республики к империи, и далее к державе, стоявшей столетия",
   en:"From republic to empire, and on to a power that lasted centuries"},
[
 [
  E(-509,
    {he:"הקמת הרפובליקה הרומית",ar:"قيام الجمهورية الرومانية",ru:"Основание Римской республики",en:"The founding of the Roman Republic"},
    {he:"הרומאים גירשו את המלך האחרון והנהיגו שלטון של נבחרים: שני קונסולים לשנה וסנאט.",
     ar:"طرد الرومان آخر ملوكهم وأقاموا حكم المنتخَبين: قنصلان لسنة واحدة ومجلس شيوخ.",
     ru:"Римляне изгнали последнего царя и установили власть избранных: двух консулов на год и сенат.",
     en:"The Romans drove out their last king and set up a government of elected men: two consuls for a year and a senate."},
    {he:"המלך האחרון נהג בעריצות, והאצולה כבר לא הסכימה לשלטון של אדם יחיד.",
     ar:"تصرّف الملك الأخير بطغيان، ولم تعد الأرستقراطية تقبل حكم رجل واحد.",
     ru:"Последний царь правил тиранически, и знать больше не соглашалась на власть одного человека.",
     en:"The last king ruled tyrannically, and the nobility would no longer accept the rule of one man."},
    {he:"נולד משטר שבו הכוח מחולק בין כמה מוסדות — רעיון שחוזר בחוקות עד היום.",
     ar:"وُلد نظام تتوزّع فيه السلطة بين عدة مؤسسات — فكرة تتكرّر في الدساتير حتى اليوم.",
     ru:"Родился строй, в котором власть разделена между несколькими учреждениями, — идея, которая повторяется в конституциях по сей день.",
     en:"A system was born in which power is divided among several institutions — an idea that recurs in constitutions to this day."}),
  E(-146,
    {he:"חורבן קרתגו",ar:"تدمير قرطاج",ru:"Разрушение Карфагена",en:"The destruction of Carthage"},
    {he:"רומא הרסה את קרתגו בתום שלוש מלחמות ארוכות, והפכה לשליטת הים התיכון המערבי.",
     ar:"دمّرت روما قرطاج بعد ثلاث حروب طويلة، وصارت سيدة غرب البحر المتوسط.",
     ru:"Рим разрушил Карфаген после трёх долгих войн и стал властелином западного Средиземноморья.",
     en:"Rome destroyed Carthage after three long wars, and became master of the western Mediterranean."},
    {he:"קרתגו ורומא נאבקו על נתיבי הסחר, על סיציליה ועל השליטה בים.",
     ar:"تنازعت قرطاج وروما على طرق التجارة وعلى صقلية وعلى السيادة في البحر.",
     ru:"Карфаген и Рим боролись за торговые пути, за Сицилию и за господство на море.",
     en:"Carthage and Rome fought over trade routes, over Sicily and over control of the sea."},
    {he:"רומא נעשתה אימפריה, וזרם עצום של שלל ועבדים שינה מן היסוד את החברה שבתוכה.",
     ar:"صارت روما إمبراطورية، وغيّر سيل هائل من الغنائم والعبيد مجتمعها من أساسه.",
     ru:"Рим стал империей, и огромный поток добычи и рабов в корне изменил его собственное общество.",
     en:"Rome became an empire, and a vast flow of plunder and slaves changed its own society from the ground up."}),
  E(-27,
    {he:"אוגוסטוס והקמת הקיסרות",ar:"أوغسطس وقيام الإمبراطورية",ru:"Август и создание империи",en:"Augustus and the founding of the empire"},
    {he:"אוקטביאנוס קיבל את התואר אוגוסטוס וריכז בידיו את השלטון, אף שהרפובליקה נשארה בשמה.",
     ar:"نال أوكتافيانوس لقب أوغسطس وجمع السلطة في يديه، مع بقاء الجمهورية بالاسم.",
     ru:"Октавиан получил титул Августа и сосредоточил власть в своих руках, хотя республика сохранилась по названию.",
     en:"Octavian received the title Augustus and gathered power into his own hands, while the republic survived in name."},
    {he:"מאה שנים של מלחמות אזרחים שחקו את מוסדות הרפובליקה, והעם רצה סדר.",
     ar:"أنهكت مئة سنة من الحروب الأهلية مؤسسات الجمهورية، وأراد الناس نظامًا.",
     ru:"Сто лет гражданских войн истощили учреждения республики, и народ хотел порядка.",
     en:"A hundred years of civil war had worn down the institutions of the republic, and people wanted order."},
    {he:"החל ה״שלום הרומי״ — כמאתיים שנות יציבות יחסית, סחר ובנייה בכל האימפריה.",
     ar:"بدأ «السلام الروماني» — نحو مئتي سنة من الاستقرار النسبي والتجارة والبناء في الإمبراطورية كلها.",
     ru:"Начался «римский мир» — около двухсот лет относительной устойчивости, торговли и строительства по всей империи.",
     en:"The \"Roman peace\" began — some two hundred years of relative stability, trade and building across the empire."}),
  C({he:"רפובליקה",ar:"جمهورية",ru:"Республика",en:"Republic"},
    {he:"משטר שבו נציגים נבחרים שולטים לזמן קצוב, במקום מלך שיורש את הכתר.",
     ar:"نظام يحكم فيه ممثلون منتخَبون لمدة محدّدة، بدل ملك يرث التاج.",
     ru:"Строй, при котором правят избранные представители на определённый срок, а не царь, наследующий корону.",
     en:"A system in which elected representatives rule for a fixed term, instead of a king who inherits the crown."})
 ],
 [
  E(-73,
    {he:"מרד ספרטקוס",ar:"ثورة سبارتاكوس",ru:"Восстание Спартака",en:"The revolt of Spartacus"},
    {he:"עבד־גלדיאטור בשם ספרטקוס הוביל מרד של עשרות אלפי עבדים, ורומא דיכאה אותו באכזריות.",
     ar:"قاد عبد مصارع اسمه سبارتاكوس ثورة عشرات آلاف العبيد، وسحقتها روما بوحشية.",
     ru:"Раб-гладиатор Спартак возглавил восстание десятков тысяч рабов, и Рим подавил его с жестокостью.",
     en:"A gladiator slave named Spartacus led a revolt of tens of thousands of slaves, and Rome crushed it brutally."},
    {he:"הכיבושים הביאו לרומא המוני עבדים, ותנאי חייהם באחוזות ובזירות היו קשים מנשוא.",
     ar:"جلبت الفتوح إلى روما جموع العبيد، وكانت ظروف حياتهم في الضياع والحلبات لا تُطاق.",
     ru:"Завоевания привели в Рим множество рабов, а условия их жизни в поместьях и на аренах были невыносимы.",
     en:"The conquests brought masses of slaves to Rome, and their conditions on the estates and in the arenas were unbearable."},
    {he:"רומא הידקה את הפיקוח על העבדים, והמרד נשאר סמל למאבק בשעבוד.",
     ar:"شدّدت روما الرقابة على العبيد، وبقيت الثورة رمزًا للنضال ضد الاستعباد.",
     ru:"Рим усилил надзор за рабами, а восстание осталось символом борьбы с рабством.",
     en:"Rome tightened its control over slaves, and the revolt remained a symbol of the struggle against slavery."}),
  E(-44,
    {he:"רצח יוליוס קיסר",ar:"اغتيال يوليوس قيصر",ru:"Убийство Юлия Цезаря",en:"The assassination of Julius Caesar"},
    {he:"קבוצת סנאטורים דקרה את קיסר למוות בעת ישיבה, בלב רומא.",
     ar:"طعن جمع من الشيوخ قيصر حتى الموت أثناء جلسة، في قلب روما.",
     ru:"Группа сенаторов заколола Цезаря во время заседания, в самом сердце Рима.",
     en:"A group of senators stabbed Caesar to death during a sitting, in the heart of Rome."},
    {he:"קיסר מונה לדיקטטור לכל ימי חייו, והסנאטורים חששו שהרפובליקה תהפוך למלוכה.",
     ar:"عُيّن قيصر ديكتاتورًا مدى الحياة، وخشي الشيوخ أن تتحوّل الجمهورية إلى ملكية.",
     ru:"Цезарь был назначен пожизненным диктатором, и сенаторы боялись, что республика станет монархией.",
     en:"Caesar was made dictator for life, and the senators feared the republic was turning into a monarchy."},
    {he:"במקום להציל את הרפובליקה, הרצח הצית מלחמת אזרחים שהובילה דווקא לקיסרות.",
     ar:"وبدل إنقاذ الجمهورية، أشعل الاغتيال حربًا أهلية أفضت تحديدًا إلى الإمبراطورية.",
     ru:"Вместо спасения республики убийство разожгло гражданскую войну, приведшую как раз к империи.",
     en:"Instead of saving the republic, the killing set off a civil war that led precisely to the empire."}),
  E(212,
    {he:"צו קרקלה",ar:"مرسوم كاراكلا",ru:"Эдикт Каракаллы",en:"The edict of Caracalla"},
    {he:"הקיסר קרקלה העניק אזרחות רומית כמעט לכל תושבי האימפריה בני החורין.",
     ar:"منح الإمبراطور كاراكلا المواطنة الرومانية لكل أحرار الإمبراطورية تقريبًا.",
     ru:"Император Каракалла даровал римское гражданство почти всем свободным жителям империи.",
     en:"The emperor Caracalla granted Roman citizenship to nearly every free inhabitant of the empire."},
    {he:"הקיסר נזקק להכנסות ממסים שחלו על אזרחים בלבד, וגם ביקש לחזק את נאמנות הפרובינציות.",
     ar:"احتاج الإمبراطور إلى إيرادات ضرائب لا تُفرض إلا على المواطنين، وأراد أيضًا تعزيز ولاء الولايات.",
     ru:"Императору были нужны доходы от налогов, которые платили только граждане, и он хотел укрепить верность провинций.",
     en:"The emperor needed revenue from taxes that only citizens paid, and also wanted to strengthen the loyalty of the provinces."},
    {he:"מושג האזרחות הורחב מעיר אחת לאימפריה שלמה, והזהות הרומית חדלה להיות עניין של מוצא.",
     ar:"اتّسع مفهوم المواطنة من مدينة واحدة إلى إمبراطورية كاملة، ولم تعد الهوية الرومانية مسألة أصل.",
     ru:"Понятие гражданства расширилось от одного города до целой империи, и римская идентичность перестала быть делом происхождения.",
     en:"Citizenship widened from a single city to an entire empire, and Roman identity stopped being a matter of descent."}),
  C({he:"סנאט",ar:"مجلس الشيوخ",ru:"Сенат",en:"Senate"},
    {he:"מועצת נכבדים ברומא שניהלה כספים ומדיניות חוץ ופיקחה על נבחרי הציבור.",
     ar:"مجلس وجهاء في روما أدار المال والسياسة الخارجية وراقب منتخَبي الشعب.",
     ru:"Совет знатных в Риме, ведавший финансами и внешней политикой и надзиравший за избранными должностными лицами.",
     en:"A council of leading men in Rome that ran finance and foreign policy and oversaw the elected officials."})
 ],
 [
  E(313,
    {he:"צו מילאנו",ar:"مرسوم ميلانو",ru:"Миланский эдикт",en:"The Edict of Milan"},
    {he:"קונסטנטינוס ושותפו הכריזו על חופש פולחן, והנצרות הפכה לדת מותרת באימפריה.",
     ar:"أعلن قسطنطين وشريكه حرية العبادة، وصارت المسيحية دينًا مسموحًا في الإمبراطورية.",
     ru:"Константин и его соправитель провозгласили свободу вероисповедания, и христианство стало дозволенной религией в империи.",
     en:"Constantine and his colleague proclaimed freedom of worship, and Christianity became a permitted religion in the empire."},
    {he:"הנוצרים היו רבים וחזקים, והרדיפות לא הצליחו לעצור את התפשטות האמונה.",
     ar:"كان المسيحيون كثيرين وأقوياء، ولم تفلح الاضطهادات في وقف انتشار الإيمان.",
     ru:"Христиан было много и они были сильны, а гонения не смогли остановить распространение веры.",
     en:"The Christians were many and strong, and persecution had failed to stop the faith from spreading."},
    {he:"בתוך דור הפכה הנצרות מדת נרדפת לדת המועדפת של האימפריה, ואחר כך לדת המדינה.",
     ar:"وفي جيل واحد تحوّلت المسيحية من دين مضطهَد إلى دين مفضَّل في الإمبراطورية، ثم إلى دين الدولة.",
     ru:"За одно поколение христианство из гонимой веры стало предпочитаемой религией империи, а затем и государственной.",
     en:"Within a generation Christianity went from a persecuted faith to the favoured religion of the empire, and then its state religion."}),
  C({he:"פאקס רומאנה",ar:"السلام الروماني",ru:"Римский мир",en:"Pax Romana"},
    {he:"״השלום הרומי״: תקופה ארוכה של יציבות יחסית שאפשרה סחר, דרכים סלולות ובנייה.",
     ar:"«السلام الروماني»: حقبة طويلة من الاستقرار النسبي أتاحت التجارة والطرق المعبّدة والبناء.",
     ru:"«Римский мир»: долгий период относительной устойчивости, который позволил торговлю, мощёные дороги и строительство.",
     en:"The \"Roman peace\": a long period of relative stability that allowed trade, paved roads and building."}),
  C({he:"פרובינקיה",ar:"ولاية",ru:"Провинция",en:"Province"},
    {he:"מחוז מחוץ לאיטליה שנשלט בידי נציב מטעם רומא ושילם לה מסים.",
     ar:"إقليم خارج إيطاليا يحكمه وال من قِبَل روما ويدفع لها الضرائب.",
     ru:"Область вне Италии, управляемая наместником от Рима и платившая ему налоги.",
     en:"A district outside Italy ruled by a governor sent from Rome and paying taxes to it."}),
  Sc({he:["אם אדם נקרא לבית הדין — ילך.",
          "אם הוא חולה או זקן, ייתן לו הקורא בהמה לרכיבה.",
          "המשפט ייערך בפומבי, לעיני הכול, עד בוא השמש.",
          "מה שהעם קבע באחרונה — הוא החוק."],
      ar:["إذا دُعي المرء إلى المحكمة — فليذهب.",
          "وإن كان مريضًا أو شيخًا، فليقدّم له الداعي دابّة للركوب.",
          "وتُعقد المحاكمة علنًا، على مرأى الجميع، حتى غروب الشمس.",
          "وما أقرّه الشعب أخيرًا — فهو القانون."],
      ru:["Если человека вызвали в суд — пусть идёт.",
          "Если он болен или стар, вызвавший даёт ему животное для езды.",
          "Суд ведётся открыто, на виду у всех, до заката.",
          "Что народ постановил последним — то и есть закон."],
      en:["If a man is summoned to court, let him go.",
          "If he is ill or old, the one who summoned him shall provide an animal to ride.",
          "The trial shall be held in public, before all eyes, until sunset.",
          "Whatever the people enacted last — that is the law."]},
     [Q({he:"מה מלמד המקור על המשפט ברומא?",ar:"ماذا يعلّمنا المصدر عن القضاء في روما؟",ru:"Что источник говорит о суде в Риме?",en:"What does the source show about justice in Rome?"},
        {he:"המשפט התנהל בפומבי ולפי כללים כתובים שכולם יכלו לדעת.",ar:"جرى القضاء علنًا ووفق قواعد مكتوبة يعرفها الجميع.",ru:"Суд шёл открыто и по записанным правилам, которые все могли знать.",en:"Justice was public and followed written rules that everyone could know."},
        [{he:"רק כוהנים יכלו לשפוט, והחוק נשמר בידיהם ולא פורסם ברבים.",ar:"الكهنة وحدهم كان بإمكانهم القضاء، والقانون بأيديهم ولم يُنشر.",ru:"Судить могли только жрецы, и закон хранился в их руках, не оглашаясь.",en:"Only priests could judge, and the law was kept in their hands, unpublished."},
         {he:"המלך הכריע בכל סכסוך, ופסק דינו נמסר בעל פה.",ar:"الملك كان يحسم كل خلاف، وحكمه يُبلَّغ شفويًا.",ru:"Царь решал каждый спор, и его приговор объявлялся устно.",en:"The king settled every dispute, and his ruling was given by word of mouth."},
         {he:"אסור היה לחולה או לזקן לעמוד לדין בבית הדין הפומבי ברומא.",ar:"مُنع المريض أو المسنّ من المثول أمام المحكمة العلنية.",ru:"Больному или старику запрещалось представать перед открытым судом Рима.",en:"A sick or old man was forbidden to stand trial in the public court of Rome."}],
        [{he:"המקור עצמו הוא חוק כתוב וגלוי, שכל אדם יכול לדעת.",ar:"المصدر نفسه قانون مكتوب ومعلن، يستطيع كل إنسان معرفته.",ru:"Сам источник — записанный и открытый закон, который может знать каждый.",en:"The source itself is a written, public law that anyone can know."},
         {he:"המקור מייחס את קביעת החוק לעם, ולא למלך.",ar:"المصدر ينسب تقرير القانون إلى الشعب، لا إلى الملك.",ru:"Источник относит установление закона к народу, а не к царю.",en:"The source credits the people with setting the law, not a king."},
         {he:"המקור אומר ההפך: נותנים לו בהמה כדי שיגיע.",ar:"المصدر يقول العكس: يُعطى دابّة كي يصل.",ru:"Источник говорит обратное: ему дают животное, чтобы он добрался.",en:"The source says the opposite: he is given an animal so he can come."}]),
      Q({he:"מהי משמעות המשפט האחרון?",ar:"ما معنى الجملة الأخيرة؟",ru:"Каков смысл последней строки?",en:"What does the last line mean?"},
        {he:"חוק חדש שהעם מחוקק גובר על חוק ישן יותר.",ar:"القانون الجديد الذي يسنّه الشعب يعلو على قانون أقدم.",ru:"Новый закон, принятый народом, отменяет более старый.",en:"A newer law made by the people overrides an older one."},
        [{he:"רק חוקים עתיקים תקפים, וחוק חדש בטל מעיקרו.",ar:"القوانين القديمة وحدها سارية، والقانون الجديد باطل من أصله.",ru:"Действуют только древние законы, а новый закон недействителен.",en:"Only ancient laws hold, and any new law is void from the start."},
         {he:"הסנאט לבדו מחוקק את החוקים, בלי אישור של העם.",ar:"مجلس الشيوخ وحده يسنّ القوانين كلها، بلا مصادقة من الشعب.",ru:"Законы издаёт только сенат, без всякого утверждения народа.",en:"The senate alone makes the laws, without the people's approval."},
         {he:"החוק אינו משתנה לעולם, גם לא בידי העם.",ar:"القانون لا يتغيّر أبدًا، ولا حتى بيد الشعب.",ru:"Закон не меняется никогда, даже самим народом.",en:"The law never changes, not even by the people."}],
        [{he:"המילה ״באחרונה״ מצביעה על החוק המאוחר, לא המוקדם.",ar:"كلمة «أخيرًا» تشير إلى القانون المتأخر لا المبكر.",ru:"Слово «последним» указывает на поздний закон, а не на ранний.",en:"The word last points to the later law, not the earlier one."},
         {he:"המשפט מייחס את הקביעה לעם, ולא לסנאט.",ar:"الجملة تنسب التقرير إلى الشعب، لا إلى مجلس الشيوخ.",ru:"Фраза относит решение к народу, а не к сенату.",en:"The line credits the people with the decision, not the senate."},
         {he:"אם יש חוק ״אחרון״, סימן שהחוק כן משתנה.",ar:"إذا كان هناك قانون «أخير»، فالقانون يتغيّر إذن.",ru:"Если есть «последний» закон, значит закон всё же меняется.",en:"If there is a last law, then the law does change."}])])
 ]
]);

topic("temple2","anc",
  {he:"ימי בית שני",ar:"عصر الهيكل الثاني",ru:"Эпоха Второго храма",en:"The Second Temple period"},
  {he:"משיבת ציון ועד החורבן ומרד בר כוכבא",
   ar:"من العودة إلى صهيون حتى الخراب وثورة بار كوخبا",
   ru:"От возвращения в Сион до разрушения и восстания Бар-Кохбы",
   en:"From the return to Zion to the destruction and the Bar Kokhba revolt"},
[
 [
  E(-538,
    {he:"הצהרת כורש",ar:"إعلان كورش",ru:"Указ Кира",en:"The declaration of Cyrus"},
    {he:"כורש מלך פרס התיר ליהודי בבל לשוב לירושלים ולבנות מחדש את בית המקדש.",
     ar:"سمح كورش ملك فارس ليهود بابل بالعودة إلى القدس وإعادة بناء الهيكل.",
     ru:"Кир, царь Персии, разрешил вавилонским евреям вернуться в Иерусалим и заново отстроить Храм.",
     en:"Cyrus, king of Persia, allowed the Jews of Babylon to return to Jerusalem and rebuild the Temple."},
    {he:"פרס כבשה את בבל ונקטה מדיניות של סובלנות: כל עם יעבוד את אלוהיו במקומו.",
     ar:"فتحت فارس بابل وانتهجت سياسة تسامح: كل شعب يعبد إلهه في مكانه.",
     ru:"Персия завоевала Вавилон и повела политику терпимости: каждый народ служит своему богу у себя.",
     en:"Persia conquered Babylon and adopted a policy of tolerance: each people would worship its god in its own place."},
    {he:"החלה שיבת ציון, ונבנה בית המקדש השני — שעמד כחמש מאות שנה.",
     ar:"بدأت العودة إلى صهيون، وبُني الهيكل الثاني — الذي قام نحو خمسمئة سنة.",
     ru:"Началось возвращение в Сион, и был построен Второй храм, простоявший около пятисот лет.",
     en:"The return to Zion began, and the Second Temple was built — it stood for some five hundred years."}),
  E(-167,
    {he:"גזרות אנטיוכוס ומרד החשמונאים",ar:"مراسيم أنطيوخوس وثورة الحشمونائيم",ru:"Указы Антиоха и восстание Хасмонеев",en:"The decrees of Antiochus and the Hasmonean revolt"},
    {he:"אנטיוכוס אסר על קיום מצוות וחילל את המקדש, ומתתיהו ובניו יצאו למרד.",
     ar:"منع أنطيوخوس أداء الشرائع ودنّس الهيكل، فخرج متتياهو وبنوه في ثورة.",
     ru:"Антиох запретил исполнение заповедей и осквернил Храм, и Маттафия с сыновьями поднял восстание.",
     en:"Antiochus banned the keeping of the commandments and defiled the Temple, and Mattathias and his sons rose in revolt."},
    {he:"מאבק פנימי בין מתייוונים למתנגדיהם, וניסיון המלך לכפות תרבות אחת על כל ממלכתו.",
     ar:"صراع داخلي بين المتأغرقين ومعارضيهم، ومحاولة الملك فرض ثقافة واحدة على مملكته كلها.",
     ru:"Внутренняя борьба между эллинизаторами и их противниками и попытка царя навязать единую культуру всему царству.",
     en:"An internal struggle between the Hellenisers and their opponents, and the king's attempt to impose one culture on his whole kingdom."},
    {he:"המקדש טוהר, נקבע חג החנוכה, וכעבור שנים קמה ממלכה חשמונאית עצמאית.",
     ar:"طُهّر الهيكل، وأُقرّ عيد الحانوكاه، وبعد سنوات قامت مملكة حشمونية مستقلة.",
     ru:"Храм был очищен, установлен праздник Ханука, а спустя годы возникло независимое Хасмонейское царство.",
     en:"The Temple was purified, the festival of Hanukkah was established, and years later an independent Hasmonean kingdom arose."}),
  E(-63,
    {he:"פומפיוס כובש את ירושלים",ar:"بومبيوس يفتح القدس",ru:"Помпей берёт Иерусалим",en:"Pompey takes Jerusalem"},
    {he:"המצביא הרומי פומפיוס נכנס לירושלים והכפיף את יהודה לרומא.",
     ar:"دخل القائد الروماني بومبيوس القدس وأخضع يهودا لروما.",
     ru:"Римский полководец Помпей вошёл в Иерусалим и подчинил Иудею Риму.",
     en:"The Roman general Pompey entered Jerusalem and made Judea subject to Rome."},
    {he:"מלחמת אחים בין שני נסיכים חשמונאים, ושני הצדדים פנו לרומא שתכריע ביניהם.",
     ar:"حرب أهلية بين أميرين حشمونيين، ولجأ الطرفان إلى روما لتفصل بينهما.",
     ru:"Междоусобная война двух хасмонейских князей, и обе стороны обратились к Риму, чтобы он их рассудил.",
     en:"A civil war between two Hasmonean princes, and both sides asked Rome to decide between them."},
    {he:"עצמאות החשמונאים הסתיימה, ויהודה נעשתה תלויה ברומא לדורות.",
     ar:"انتهى استقلال الحشمونيين، وصارت يهودا تابعة لروما لأجيال.",
     ru:"Независимость Хасмонеев кончилась, и Иудея на поколения стала зависимой от Рима.",
     en:"Hasmonean independence ended, and Judea became dependent on Rome for generations."}),
  C({he:"שיבת ציון",ar:"العودة إلى صهيون",ru:"Возвращение в Сион",en:"The return to Zion"},
    {he:"חזרתם של גולי בבל לארץ ישראל ובניית בית המקדש השני בירושלים.",

     ru:"Возвращение вавилонских изгнанников в Землю Израиля и строительство Второго храма в Иерусалиме.",
     en:"The return of the Babylonian exiles to the Land of Israel and the building of the Second Temple in Jerusalem."})

 [

    {he:"רומא רצתה מלך נאמן שיחזיק את הגבול המזרחי, והחשמונאים כבר לא היו יציבים.",

  E(66,

    {he:"היהודים מרדו ברומא, גירשו את חיל המצב מירושלים והקימו ממשלה משלהם.",

     en:"The Jews revolted against Rome, drove the garrison out of Jerusalem and set up a government of their own."},
    {he:"מעשי הנציבים, מסים כבדים ומתחים בין יהודים ליוונים בערים המעורבות.",

    {he:"רומא שלחה צבא גדול, והמלחמה נמשכה ארבע שנים עד נפילת ירושלים.",

     en:"Rome sent a large army, and the war lasted four years until Jerusalem fell."}),
  E(70,
    {he:"חורבן בית שני",ar:"خراب الهيكل الثاني",ru:"Разрушение Второго храма",en:"The destruction of the Second Temple"},

     ar:"فتح تيطس القدس، واحترق الهيكل ودُمّرت المدينة.",
     ru:"Тит взял Иерусалим, Храм сгорел, а город был разрушен.",
     en:"Titus took Jerusalem, the Temple burned and the city was destroyed."},
    {he:"המרד הגדול, ולצידו מאבקים קשים בין סיעות יריבות בתוך העיר הנצורה.",
     ar:"الثورة الكبرى، وإلى جانبها صراعات قاسية بين فصائل متنازعة داخل المدينة المحاصرة.",
     ru:"Великое восстание, а рядом с ним жестокая борьба враждующих группировок внутри осаждённого города.",
     en:"The Great Revolt, and alongside it bitter fighting between rival factions inside the besieged city."},
    {he:"הפולחן במקדש פסק, ומרכז החיים היהודיים עבר לבית המדרש וליבנה.",
     ar:"توقّفت العبادة في الهيكل، وانتقل مركز الحياة اليهودية إلى بيت الدرس وإلى يفنه.",
     ru:"Служение в Храме прекратилось, и центр еврейской жизни перешёл в дома учения и в Явне.",

  C({he:"סנהדרין",ar:"السنهدرين",ru:"Синедрион",en:"Sanhedrin"},

     ar:"المحكمة العليا لليهود في عصر الهيكل الثاني: واحد وسبعون حكيمًا فصلوا في الشريعة والقضاء.",
     ru:"Верховный суд евреев эпохи Второго храма: семьдесят один мудрец, решавший вопросы закона и права.",

 ],
 [
  E(132,
    {he:"מרד בר כוכבא",ar:"ثورة بار كوخبا",ru:"Восстание Бар-Кохбы",en:"The Bar Kokhba revolt"},
    {he:"שמעון בר כוכבא הוביל מרד שנמשך שלוש שנים ושחרר לזמן מה חלקים מיהודה.",
     ar:"قاد شمعون بار كوخبا ثورة دامت ثلاث سنوات وحرّرت لبعض الوقت أجزاء من يهودا.",
     ru:"Шимон Бар-Кохба возглавил восстание, длившееся три года и на время освободившее часть Иудеи.",
     en:"Simon Bar Kokhba led a revolt that lasted three years and briefly freed parts of Judea."},
    {he:"תוכנית הקיסר אדריאנוס להקים עיר רומית על חורבות ירושלים, וגזרות על קיום המצוות.",

     en:"The emperor Hadrian's plan to build a Roman city on the ruins of Jerusalem, and decrees against keeping the commandments."},
    {he:"המרד דוכא, יהודה חרבה, והמרכז היהודי בארץ עבר לגליל.",
     ar:"سُحقت الثورة، وخربت يهودا، وانتقل المركز اليهودي في البلاد إلى الجليل.",

  C({he:"יבנה",ar:"يفنه",ru:"Явне",en:"Yavne"},
    {he:"העיר שבה הקים רבן יוחנן בן זכאי מרכז לימוד אחרי החורבן, ובה נשמר רצף היהדות בלי מקדש.",
     ar:"المدينة التي أقام فيها ربان يوحنان بن زكاي مركز تعليم بعد الخراب، وفيها حُفظ تواصل اليهودية بلا هيكل.",
     ru:"Город, где рабан Йоханан бен Заккай основал центр учения после разрушения и где сохранилась непрерывность иудаизма без Храма.",
     en:"The town where Rabban Yohanan ben Zakkai founded a centre of study after the destruction, and where Judaism continued without a Temple."}),
  C({he:"תפוצה",ar:"الشتات",ru:"Диаспора",en:"Diaspora"},
    {he:"פיזור העם היהודי מחוץ לארץ ישראל, בקהילות ברחבי האימפריה ומעבר לגבולותיה.",

  Sc({he:["המקדש עלה באש בלי שהקיסר ציווה על כך.",
          "אחד החיילים חטף בול עץ בוער והשליך אותו דרך חלון.",
          "כשהתפשטה האש זעקו היהודים זעקה גדולה ורצו להציל.",
          "מי שעד אז שמר על חייו, לא חס עליהם עוד.",
          "כך כותב יוסף בן מתתיהו — שהיה מפקד במרד, ואחר כך עבר לצד הרומאים."],
      ar:["احترق الهيكل من غير أن يأمر القيصر بذلك.",
          "خطف أحد الجنود عودًا مشتعلًا وقذفه من نافذة.",
          "ولما انتشرت النار صرخ اليهود صرخة عظيمة وهرعوا للإنقاذ.",
          "ومن كان حتى تلك اللحظة يصون حياتهم، لم يعد يشفق عليهم.",
          "هكذا يكتب يوسيفوس — الذي كان قائدًا في الثورة ثم انتقل إلى صفّ الرومان."],
      ru:["Храм загорелся без приказа императора.",
          "Один из воинов схватил горящее полено и бросил его в окно.",
          "Когда огонь распространился, евреи подняли великий крик и бросились спасать.",
          "Тот, кто до сих пор берёг их жизни, больше их не щадил.",
          "Так пишет Иосиф Флавий — который был командиром в восстании, а затем перешёл на сторону римлян."],
      en:["The Temple caught fire without the emperor ordering it.",
          "One of the soldiers snatched a burning brand and threw it through a window.",
          "When the fire spread the Jews raised a great cry and rushed to save it.",
          "He who until then had spared their lives spared them no longer.",
          "So writes Josephus — who was a commander in the revolt, and later went over to the Roman side."]},
     [Q({he:"מה טוען המקור על שריפת המקדש?",ar:"بماذا يزعم المصدر بشأن حريق الهيكل؟",ru:"Что источник утверждает о пожаре Храма?",en:"What does the source claim about the burning of the Temple?"},
        {he:"היא לא נעשתה בפקודת הקיסר אלא ביוזמת חייל אחד.",ar:"أنه لم يقع بأمر القيصر بل بمبادرة جندي واحد.",ru:"Что он произошёл не по приказу императора, а по почину одного воина.",en:"That it was not by the emperor's order but on the initiative of a single soldier."},
        [{he:"היהודים עצמם הציתו את המקדש במו ידיהם, כדי שלא ייפול.",ar:"اليهود أنفسهم أحرقوا الهيكل بأيديهم كي لا يسقط.",ru:"Сами иудеи подожгли Храм своими руками, чтобы он не достался врагу целым.",en:"The Jews themselves set the Temple on fire with their own hands, so it would not fall."},
         {he:"האש פרצה מברק שפגע במקדש בזמן סערה גדולה בלילה ההוא.",ar:"اندلعت النار من صاعقة أصابت الهيكل في عاصفة ليلية.",ru:"Огонь начался от молнии, ударившей в Храм во время сильной ночной бури.",en:"The fire started from lightning that struck the Temple during a strong storm that night."},
         {he:"הקיסר ציווה במפורש לשרוף את המקדש בפקודה כתובה.",ar:"أمر القيصر صراحةً بإحراق الهيكل بأمر مكتوب.",ru:"Император отдал прямой письменный приказ сжечь Храм.",en:"The emperor himself gave an explicit written order to burn the Temple."}],
        [{he:"המקור מספר שהם זעקו ורצו להציל אותו מהאש.",ar:"المصدر يروي أنهم صرخوا وركضوا لإنقاذه من النار.",ru:"Источник рассказывает, что они кричали и бежали спасать его от огня.",en:"The source says they cried out and ran to save it from the fire."},
         {he:"המקור מצביע על בול עץ בוער שהשליך חייל.",ar:"المصدر يشير إلى قطعة خشب مشتعلة ألقاها جندي.",ru:"Источник указывает на горящее полено, брошенное солдатом.",en:"The source points to a burning log thrown by a soldier."},
         {he:"השורה הראשונה אומרת שהאש עלתה בלי שציווה.",ar:"السطر الأول يقول إن النار اشتعلت دون أمره.",ru:"Первая строка говорит, что огонь вспыхнул без его приказа.",en:"The first line says the fire rose without his order."}]),
      Q({he:"מדוע צריך לקרוא את המקור הזה בזהירות?",ar:"لماذا ينبغي قراءة هذا المصدر بحذر؟",ru:"Почему этот источник нужно читать осторожно?",en:"Why should this source be read with care?"},
        {he:"הכותב עבר לצד הרומאים, ויש לו עניין להסיר מהם אשמה.",ar:"لأن الكاتب انتقل إلى صفّ الرومان، وله مصلحة في رفع اللوم عنهم.",ru:"Автор перешёл на сторону римлян, и ему выгодно снять с них вину.",en:"The writer went over to the Roman side, and has an interest in clearing them of blame."},
        [{he:"הוא נכתב מאות שנים אחרי האירוע, בידי כותב מאוחר.",ar:"كُتب بعد الحدث بمئات السنين، على يد كاتب متأخر.",ru:"Он написан через сотни лет после события, поздним автором.",en:"It was written hundreds of years after the event, by a later writer."},
         {he:"הכותב לא היה בארץ מעולם, ולא ראה את המקדש ולא את המלחמה.",ar:"الكاتب لم يكن في البلاد قط، ولم يشاهد الهيكل ولا المعركة بعينيه.",ru:"Автор никогда не был в стране и не видел своими глазами ни Храма, ни войны.",en:"The writer was never in the country and never saw the Temple or the war with his own eyes."},
         {he:"אין בו תיאור של מה שקרה, אלא דעה כללית על המלחמה.",ar:"لا يوجد فيه وصف لما جرى، بل رأي عام عن الحرب وأطرافها.",ru:"В нём нет описания случившегося, а есть общее мнение о войне.",en:"It gives no account of what happened, but a general opinion of the war."}],
        [{he:"יוסף בן מתתיהו היה שם בזמן המרד וכתב בסמוך לו.",ar:"كان يوسيفوس هناك زمن الثورة وكتب بعدها بقليل.",ru:"Иосиф Флавий был там во время восстания и писал вскоре после него.",en:"Josephus was there during the revolt and wrote soon after it."},
         {he:"הוא היה מפקד במרד ביהודה, ולכן ראה את המלחמה.",ar:"كان قائدًا في ثورة يهودا، فرأى الحرب بعينيه.",ru:"Он был командиром в иудейском восстании и видел войну.",en:"He was a commander in the revolt in Judea and saw the war."},
         {he:"יש בו תיאור מפורט. הבעיה היא בעמדת הכותב.",ar:"فيه وصف مفصّل. المشكلة في موقف الكاتب.",ru:"В нём есть подробное описание. Проблема — в позиции автора.",en:"It gives a detailed account. The problem is the writer's position."}])])
 ]
]);

topic("feudal","mid",
  {he:"אירופה הפיאודלית",ar:"أوروبا الإقطاعية",ru:"Феодальная Европа",en:"Feudal Europe"},
  {he:"מנפילת רומא ועד המגנה כרטה והמגפה השחורה",

   en:"From the fall of Rome to Magna Carta and the Black Death"},
[
 [
  E(476,
    {he:"נפילת האימפריה הרומית המערבית",ar:"سقوط الإمبراطورية الرومانية الغربية",ru:"Падение Западной Римской империи",en:"The fall of the Western Roman Empire"},
    {he:"מפקד גרמני בשם אודואקר הדיח את הקיסר הרומי האחרון במערב.",
     ar:"خلع قائد جرماني اسمه أودواكر آخر إمبراطور روماني في الغرب.",

     en:"A Germanic commander named Odoacer deposed the last Roman emperor in the West."},
    {he:"פלישות שבטים, משבר כלכלי וצבא שנשען על לוחמים שכירים החלישו את רומא במשך מאה שנה.",
     ar:"أضعفت روما مئة سنة من غزوات القبائل والأزمة الاقتصادية وجيش يعتمد على مرتزقة.",
     ru:"Нашествия племён, экономический кризис и войско, опиравшееся на наёмников, ослабляли Рим сто лет.",
     en:"Tribal invasions, an economic crisis and an army leaning on hired warriors had weakened Rome for a century."},
    {he:"המערב התפרק לממלכות קטנות, והכנסייה נשארה המוסד היחיד שפעל בכולן.",
     ar:"تفكّك الغرب إلى ممالك صغيرة، وبقيت الكنيسة المؤسسة الوحيدة العاملة فيها جميعًا.",
     ru:"Запад распался на мелкие королевства, и церковь осталась единственным учреждением, действовавшим во всех них.",
     en:"The West broke into small kingdoms, and the Church remained the only institution that worked in all of them."}),
  E(800,
    {he:"הכתרת קרל הגדול",ar:"تتويج شارلمان",ru:"Коронация Карла Великого",en:"The coronation of Charlemagne"},
    {he:"האפיפיור הכתיר את קרל הגדול לקיסר בחג המולד, בכנסייה ברומא.",
     ar:"توّج البابا شارلمان إمبراطورًا في عيد الميلاد، في كنيسة بروما.",

     en:"The Pope crowned Charlemagne emperor at Christmas, in a church in Rome."},
    {he:"קרל איחד תחת שלטונו חלק גדול ממערב אירופה, והאפיפיור חיפש מגן חזק.",
     ar:"وحّد شارلمان تحت حكمه جزءًا كبيرًا من غرب أوروبا، وكان البابا يبحث عن حامٍ قوي.",

     en:"Charlemagne had united much of western Europe under his rule, and the Pope was looking for a strong protector."},
    {he:"נוצרה שותפות בין הכתר לכנסייה, ואיתה מאבק ארוך על השאלה מי מהם עליון.",
     ar:"نشأت شراكة بين التاج والكنيسة، ومعها صراع طويل حول أيّهما الأعلى.",

     en:"A partnership between crown and Church was created, and with it a long struggle over which of them stood above the other."}),
  E(1095,
    {he:"הכרזת מסע הצלב הראשון",ar:"إعلان الحملة الصليبية الأولى",ru:"Провозглашение Первого крестового похода",en:"The call for the First Crusade"},
    {he:"האפיפיור אורבנוס קרא לנוצרי אירופה לצאת ולכבוש את ארץ הקודש.",
     ar:"دعا البابا أوربان مسيحيي أوروبا إلى الخروج وفتح الأرض المقدسة.",
     ru:"Папа Урбан призвал христиан Европы выступить и завоевать Святую землю.",
     en:"Pope Urban called on the Christians of Europe to set out and conquer the Holy Land."},
    {he:"בקשת עזרה מביזנטיון, רצון להפנות את מלחמות האבירים החוצה, והמשיכה הדתית לירושלים.",
     ar:"طلب نجدة من بيزنطة، ورغبة في توجيه حروب الفرسان إلى الخارج، والانجذاب الديني إلى القدس.",
     ru:"Просьба Византии о помощи, желание направить войны рыцарей вовне и религиозное влечение к Иерусалиму.",
     en:"A plea for help from Byzantium, a wish to turn the knights' wars outwards, and the religious pull of Jerusalem."},
    {he:"עשרות אלפים יצאו מזרחה; בדרך הושמדו קהילות יהודיות בגרמניה, וירושלים נכבשה ב-1099.",
     ar:"خرج عشرات الآلاف شرقًا؛ وفي الطريق أُبيدت جماعات يهودية في ألمانيا، وفُتحت القدس سنة 1099.",
     ru:"Десятки тысяч двинулись на восток; по пути были уничтожены еврейские общины в Германии, а в 1099 году взят Иерусалим.",
     en:"Tens of thousands set out eastwards; on the way Jewish communities in Germany were destroyed, and Jerusalem was taken in 1099."}),
  C({he:"פיאודליזם",ar:"الإقطاع",ru:"Феодализм",en:"Feudalism"},
    {he:"שיטה שבה אדון מעניק אחוזה לאציל אחר, וזה מתחייב לשרת אותו בקרב ולהישבע לו אמונים.",

 ],
 [

    {he:"אצילי אנגליה כפו על המלך ג׳ון לחתום על מסמך שהגביל את סמכותו.",

  E(1348,

    {he:"חיידק שהועבר בפרעושים על חולדות, בערים צפופות, בלי ידע רפואי ובלי תברואה.",

     ru:"Нехватка работников подняла плату крестьянам и подорвала феодальный порядок; евреев обвинили в отравлении колодцев и подвергли нападениям.",
     en:"The shortage of workers raised peasants' wages and loosened the feudal order; Jews were accused of poisoning wells and were attacked."}),
  E(1453,
    {he:"נפילת קונסטנטינופול",ar:"سقوط القسطنطينية",ru:"Падение Константинополя",en:"The fall of Constantinople"},
    {he:"העות׳מאנים בפיקוד מהמט השני כבשו את בירת האימפריה הביזנטית.",

     en:"The Ottomans under Mehmed II took the capital of the Byzantine empire."},
    {he:"ביזנטיון נחלשה מאות שנים, והעות׳מאנים הביאו תותחים ענקיים שפרצו את החומות.",
     ar:"ضعفت بيزنطة قرونًا، وجلب العثمانيون مدافع ضخمة اخترقت الأسوار.",

  C({he:"ואסל",ar:"تابع إقطاعي",ru:"Вассал",en:"Vassal"},
