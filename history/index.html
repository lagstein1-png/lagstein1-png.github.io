     ru:"Император Генрих IV три дня стоял в снегу перед замком в северной Италии, прося прощения у папы.",
     en:"The emperor Henry IV stood three days in the snow before a castle in northern Italy to beg the Pope's forgiveness."},
    {he:"מאבק על הזכות למנות בישופים: האפיפיור נידה את הקיסר ושחרר את נתיניו משבועת האמונים.",
     ar:"صراع على حق تعيين الأساقفة: حرم البابا الإمبراطور وحلّ رعاياه من قسم الولاء.",
     ru:"Спор о праве назначать епископов: папа отлучил императора и освободил его подданных от присяги.",
     en:"A struggle over the right to appoint bishops: the Pope excommunicated the emperor and released his subjects from their oath."},
    {he:"הודגם כוחה של הכנסייה מול הקיסר, אך המאבק על המינויים נמשך עוד עשרות שנים.",
     ar:"تجلّت قوة الكنيسة أمام الإمبراطور، لكن الصراع على التعيينات استمرّ عقودًا أخرى.",
     ru:"Сила церкви перед императором была показана, но борьба за назначения тянулась ещё десятилетия.",
     en:"The power of the Church over the emperor was displayed, but the struggle over appointments went on for decades more."}),
  C({he:"מנזר",ar:"دير",ru:"Монастырь",en:"Monastery"},
    {he:"קהילה סגורה של אנשי דת שבחרו בחיי פרישות. במנזרים הועתקו ספרים ונשמר ידע עתיק.",
     ar:"جماعة مغلقة من المتديّنين اختاروا حياة الزهد. في الأديرة نُسخت الكتب وحُفظت المعرفة القديمة.",
     ru:"Замкнутая община людей, выбравших отшельническую жизнь. В монастырях переписывали книги и сохраняли древнее знание.",
     en:"A closed community of religious people who chose a life apart. In monasteries books were copied and old knowledge was preserved."}),
  C({he:"אינקוויזיציה",ar:"محاكم التفتيش",ru:"Инквизиция",en:"The Inquisition"},
    {he:"בית דין של הכנסייה שחקר ושפט אנשים שנחשדו בכפירה, לעיתים תוך שימוש בעינויים.",
     ar:"محكمة كنسية حقّقت وحاكمت من يُشتبه بهم في الهرطقة، أحيانًا باستخدام التعذيب.",
     ru:"Церковный суд, расследовавший и судивший подозреваемых в ереси, порой применяя пытки.",
     en:"A Church court that investigated and tried people suspected of heresy, at times using torture."}),
  Sc({he:["שום אדם חופשי לא ייאסר ולא ינושל מנכסיו,",
          "ולא יוגלה ולא ייפגע בשום דרך אחרת,",
          "אלא על פי משפט חוקי של שווים לו, או על פי חוק הארץ.",
          "לאיש לא נמכור, לאיש לא נמנע ולאיש לא נאחר, צדק ומשפט."],
      ar:["لا يُسجن رجل حرّ ولا يُجرَّد من أملاكه،",
          "ولا يُنفى ولا يُمسّ بأي وجه آخر،",
          "إلا بمحاكمة قانونية من أنداده، أو وفق قانون البلاد.",
          "لن نبيع لأحد، ولن نمنع أحدًا ولن نؤخّر عن أحد، العدل والقضاء."],
      ru:["Ни один свободный человек не будет заключён и не лишится имущества,",
          "не будет изгнан и не потерпит вреда никаким иным образом,",
          "иначе как по законному суду равных ему или по закону страны.",
          "Никому не продадим, никому не откажем и ни для кого не замедлим правосудие."],
      en:["No free man shall be imprisoned or stripped of his property,",
          "nor exiled nor harmed in any other way,",
          "except by the lawful judgment of his equals or by the law of the land.",
          "To no one will we sell, to no one deny or delay, right or justice."]},
     [Q({he:"איזה עיקרון קובע המקור?",ar:"أي مبدأ يقرّره المصدر؟",ru:"Какой принцип устанавливает источник?",en:"What principle does the source set out?"},
        {he:"אין להעניש אדם בלי משפט, וגם המלך כפוף לחוק.",ar:"لا يُعاقَب المرء بلا محاكمة، والملك أيضًا خاضع للقانون.",ru:"Никого нельзя наказать без суда, и король тоже подчинён закону.",en:"No one may be punished without trial, and the king too is bound by law."},
        [{he:"המלך רשאי לאסור כל אדם לפי שיקול דעתו, בלי משפט מוקדם.",ar:"للملك أن يعتقل أي إنسان حسب تقديره، دون محاكمة مسبقة.",ru:"Король вправе заключить любого под стражу по своему усмотрению, без предварительного суда.",en:"The king may jail any man at his own discretion, without a prior trial."},
         {he:"רק הכנסייה מוסמכת לשפוט אדם חופשי באנגליה.",ar:"الكنيسة وحدها مخوّلة بمحاكمة رجل حرّ في إنجلترا.",ru:"Судить свободного человека вправе только церковь Англии.",en:"Only the church is authorised to judge a free man in England."},
         {he:"אפשר לקנות פסק דין בכסף מידי המלך ופקידיו.",ar:"يمكن شراء حكم قضائي بالمال من الملك ومن موظفيه.",ru:"Приговор можно купить за деньги у короля и его чиновников.",en:"A judgement can be bought with money from the king and his officers."}],
        [{he:"המסמך נכתב בדיוק כדי להגביל את הכוח הזה.",ar:"كُتبت الوثيقة تحديدًا للحدّ من هذه السلطة.",ru:"Документ написан именно для того, чтобы ограничить эту власть.",en:"The document was written precisely to limit that power."},
         {he:"המקור מדבר על משפט של שווים ועל חוק הארץ.",ar:"المصدر يتحدث عن محاكمة الأنداد وعن قانون البلاد.",ru:"Источник говорит о суде равных и о законе страны.",en:"The source speaks of judgement by equals and the law of the land."},
         {he:"השורה האחרונה אוסרת למכור צדק לאיש.",ar:"السطر الأخير يمنع بيع العدل لأحد.",ru:"Последняя строка запрещает продавать правосудие.",en:"The last line forbids selling justice to anyone."}]),
      Q({he:"על מי חל המסמך בזמנו?",ar:"على من انطبقت الوثيقة في زمنها؟",ru:"На кого распространялся документ в то время?",en:"Whom did the document apply to at the time?"},
        {he:"על ״אדם חופשי״ בלבד, שהוא חלק קטן מהאוכלוסייה, ולא על הצמיתים.",ar:"على «الرجل الحرّ» فقط، وهم فئة صغيرة من السكان، لا على الأقنان.",ru:"Только на «свободного человека», то есть на небольшую часть населения, но не на крепостных.",en:"Only to a \"free man\", a small part of the population, and not to serfs."},
        [{he:"על כל תושבי אנגליה במידה שווה, בני חורין וצמיתים.",ar:"على كل سكان إنجلترا بالتساوي، أحرارًا كانوا أم أقنانًا.",ru:"На всех жителей Англии в равной мере, на свободных и на крепостных.",en:"On all the people of England equally, free men and serfs alike."},
         {he:"על אנשי הכנסייה בלבד, ולא על אצילים או על איכרים.",ar:"على رجال الكنيسة وحدهم، لا على النبلاء ولا على الفلاحين.",ru:"Только на людей церкви, но не на знать и не на простых землепашцев.",en:"Only on men of the church, not on nobles and not on peasants."},
         {he:"על סוחרים בלבד, כדי להגן על המסחר בערים הגדולות.",ar:"على التجار وحدهم، حمايةً للتجارة في المدن الكبرى.",ru:"Только на купцов, чтобы защитить торговлю в больших городах страны.",en:"Only on merchants, in order to protect trade in the larger towns."}],
        [{he:"המסמך כותב ״אדם חופשי״, והצמיתים לא נכללו בו.",ar:"الوثيقة تقول «رجل حرّ»، والأقنان لم يشملهم ذلك.",ru:"Документ пишет «свободный человек», и крепостные в него не входили.",en:"The document says free man, and serfs were not included."},
         {he:"המסמך אינו מוגבל לכנסייה. הוא מדבר על אדם חופשי.",ar:"الوثيقة ليست محصورة بالكنيسة. تتحدث عن رجل حرّ.",ru:"Документ не ограничен церковью. Он говорит о свободном человеке.",en:"The document is not limited to the church. It speaks of a free man."},
         {he:"מעמד הסוחר אינו מופיע במקור כתנאי כלשהו.",ar:"مكانة التاجر لا ترد في المصدر كشرط.",ru:"Звание купца в источнике как условие не упоминается.",en:"The source never names merchant status as a condition."}])])
 ]
]);

topic("islam","mid",
  {he:"האסלאם והח׳ליפות",ar:"الإسلام والخلافة",ru:"Ислам и халифат",en:"Islam and the caliphate"},
  {he:"מההיג׳רה ועד בגדאד, אנדלוסיה והמאבק על ירושלים",
   ar:"من الهجرة حتى بغداد والأندلس والصراع على القدس",
   ru:"От хиджры до Багдада, Андалусии и борьбы за Иерусалим",
   en:"From the Hijra to Baghdad, al-Andalus and the struggle for Jerusalem"},
[
 [
  E(622,
    {he:"ההיג׳רה",ar:"الهجرة",ru:"Хиджра",en:"The Hijra"},
    {he:"מוחמד ומאמיניו עברו ממכה למדינה, ושם קמה הקהילה המוסלמית הראשונה.",
     ar:"انتقل محمد ومؤمنوه من مكة إلى المدينة، وهناك قامت أول جماعة مسلمة.",
     ru:"Мухаммад и его последователи переселились из Мекки в Медину, и там возникла первая мусульманская община.",
     en:"Muhammad and his believers moved from Mecca to Medina, and there the first Muslim community was formed."},
    {he:"התנגדות שבטי מכה לבשורה החדשה, והלחץ הכבד שהופעל על המאמינים.",
     ar:"معارضة قبائل مكة للدعوة الجديدة، والضغط الشديد الذي مورس على المؤمنين.",
     ru:"Сопротивление мекканских племён новой проповеди и тяжёлое давление на верующих.",
     en:"The opposition of the Meccan tribes to the new message, and the heavy pressure put on the believers."},
    {he:"שנת ההיג׳רה נקבעה כראשית לוח השנה המוסלמי, וקמה קהילה עם חוקים ומנהיגות.",
     ar:"صارت سنة الهجرة بداية التقويم الهجري، وقامت جماعة لها قوانين وقيادة.",
     ru:"Год хиджры стал началом мусульманского календаря, и возникла община со своими законами и руководством.",
     en:"The year of the Hijra became the start of the Muslim calendar, and a community with laws and leadership was formed."}),
  E(638,
    {he:"כיבוש ירושלים בידי המוסלמים",ar:"فتح المسلمين للقدس",ru:"Мусульманское завоевание Иерусалима",en:"The Muslim conquest of Jerusalem"},
    {he:"הח׳ליף עומר קיבל את ירושלים מידי הפטריארך הנוצרי, כמעט בלי קרב.",
     ar:"تسلّم الخليفة عمر القدس من البطريرك المسيحي، من غير قتال يُذكر.",
     ru:"Халиф Умар принял Иерусалим из рук христианского патриарха, почти без боя.",
     en:"The caliph Umar received Jerusalem from the Christian patriarch, almost without a battle."},
    {he:"הצבאות הערביים הביסו את ביזנטיון בקרב הירמוך, והעיר נותרה בלי הגנה.",
     ar:"هزمت الجيوش العربية بيزنطة في معركة اليرموك، فبقيت المدينة بلا حماية.",
     ru:"Арабские войска разбили Византию в битве при Ярмуке, и город остался без защиты.",
     en:"The Arab armies defeated Byzantium at the battle of Yarmuk, and the city was left undefended."},
    {he:"ירושלים נעשתה קדושה גם באסלאם, ובהר הבית נבנו כיפת הסלע ומסגד אל־אקצא.",
     ar:"صارت القدس مقدسة في الإسلام أيضًا، وبُنيت في الحرم قبة الصخرة والمسجد الأقصى.",
     ru:"Иерусалим стал святым и в исламе, и на Храмовой горе были построены Купол Скалы и мечеть аль-Акса.",
     en:"Jerusalem became holy in Islam as well, and on the Temple Mount the Dome of the Rock and al-Aqsa mosque were built."}),
  E(750,
    {he:"עליית בית עבאס",ar:"قيام الدولة العباسية",ru:"Приход Аббасидов",en:"The rise of the Abbasids"},
    {he:"שושלת עבאס הדיחה את בית אומיה והעבירה את בירת הח׳ליפות לבגדאד.",
     ar:"أطاحت الدولة العباسية بالأمويين ونقلت عاصمة الخلافة إلى بغداد.",
     ru:"Аббасиды свергли Омейядов и перенесли столицу халифата в Багдад.",
     en:"The Abbasid dynasty overthrew the Umayyads and moved the capital of the caliphate to Baghdad."},
    {he:"מתחים בין ערבים למוסלמים שאינם ערבים, ומחלוקות ארוכות על הירושה ועל השלטון.",
     ar:"توتّرات بين العرب والمسلمين غير العرب، وخلافات طويلة على الوراثة والحكم.",
     ru:"Напряжённость между арабами и неарабскими мусульманами и долгие споры о наследовании и власти.",
     en:"Tension between Arabs and non-Arab Muslims, and long disputes over succession and rule."},
    {he:"בגדאד נעשתה מרכז מדע ותרגום, ובה קודמו הרפואה, המתמטיקה והפילוסופיה.",
     ar:"صارت بغداد مركزًا للعلم والترجمة، وتقدّم فيها الطب والرياضيات والفلسفة.",
     ru:"Багдад стал центром науки и перевода, где развивались медицина, математика и философия.",
     en:"Baghdad became a centre of science and translation, where medicine, mathematics and philosophy advanced."}),
  C({he:"ח׳ליף",ar:"خليفة",ru:"Халиф",en:"Caliph"},
    {he:"מנהיג הקהילה המוסלמית אחרי מוחמד: ראש המדינה וראש הדת בעת ובעונה אחת.",
     ar:"قائد الجماعة المسلمة بعد محمد: رأس الدولة ورأس الدين في آن واحد.",
     ru:"Глава мусульманской общины после Мухаммада: одновременно глава государства и глава религии.",
     en:"The leader of the Muslim community after Muhammad: head of state and head of religion at once."})
 ],
 [
  E(711,
    {he:"הכיבוש המוסלמי של ספרד",ar:"الفتح الإسلامي للأندلس",ru:"Мусульманское завоевание Испании",en:"The Muslim conquest of Spain"},
    {he:"צבא מוסלמי חצה את מיצר גיברלטר וכבש את רוב חצי האי האיברי בתוך שנים ספורות.",
     ar:"عبر جيش مسلم مضيق جبل طارق وفتح معظم شبه الجزيرة الإيبيرية في سنوات قليلة.",
     ru:"Мусульманское войско перешло Гибралтарский пролив и за несколько лет заняло большую часть Пиренейского полуострова.",
     en:"A Muslim army crossed the Strait of Gibraltar and took most of the Iberian peninsula within a few years."},
    {he:"ממלכת הוויזיגותים הייתה חלוקה ומוחלשת, והצבא המוסלמי היה מנוסה ומהיר.",
     ar:"كانت مملكة القوط الغربيين منقسمة وضعيفة، وكان الجيش المسلم مجرّبًا وسريعًا.",
     ru:"Королевство вестготов было расколото и ослаблено, а мусульманское войско — опытным и быстрым.",
     en:"The Visigothic kingdom was divided and weak, and the Muslim army was experienced and fast."},
    {he:"קמה אנדלוסיה — מרכז תרבות שבו חיו מוסלמים, נוצרים ויהודים, ובו פרח ״תור הזהב״ היהודי.",
     ar:"قامت الأندلس — مركز حضاري عاش فيه مسلمون ومسيحيون ويهود، وازدهر فيه «العصر الذهبي» اليهودي.",
     ru:"Возникла Андалусия — культурный центр, где жили мусульмане, христиане и евреи и где расцвёл еврейский «золотой век».",
     en:"Al-Andalus arose — a cultural centre where Muslims, Christians and Jews lived, and where the Jewish \"golden age\" flourished."}),
  E(1099,
    {he:"הצלבנים כובשים את ירושלים",ar:"الصليبيون يفتحون القدس",ru:"Крестоносцы берут Иерусалим",en:"The Crusaders take Jerusalem"},
    {he:"צבא מסע הצלב הראשון פרץ לירושלים וטבח ברבים מתושביה, מוסלמים ויהודים.",
     ar:"اقتحم جيش الحملة الصليبية الأولى القدس وقتل كثيرًا من سكانها، مسلمين ويهودًا.",
     ru:"Войско Первого крестового похода ворвалось в Иерусалим и перебило многих жителей, мусульман и евреев.",
     en:"The army of the First Crusade broke into Jerusalem and massacred many of its inhabitants, Muslims and Jews."},
    {he:"קריאת האפיפיור, ומצבן החלש והמפוצל של הממלכות המוסלמיות באזור באותה עת.",
     ar:"دعوة البابا، وحال الممالك الإسلامية في المنطقة آنذاك من ضعف وتفكّك.",
     ru:"Призыв папы и слабое, раздробленное положение мусульманских государств в этом краю в то время.",
     en:"The Pope's call, and the weak and divided state of the Muslim kingdoms in the region at that time."},
    {he:"קמה ממלכת ירושלים הצלבנית, ובמשך כמאתיים שנה נאבקו עליה צלבנים ומוסלמים.",
     ar:"قامت مملكة القدس الصليبية، وتنازع عليها الصليبيون والمسلمون نحو مئتي سنة.",
     ru:"Возникло крестоносное Иерусалимское королевство, и около двухсот лет за него боролись крестоносцы и мусульмане.",
     en:"The Crusader Kingdom of Jerusalem was founded, and for some two hundred years Crusaders and Muslims fought over it."}),
  E(1187,
    {he:"קרב קרני חיטין",ar:"معركة حطّين",ru:"Битва при Хаттине",en:"The battle of Hattin"},
    {he:"צלאח א־דין הביס את צבא הצלבנים ליד הכינרת, וכעבור חודשים כבש את ירושלים.",
     ar:"هزم صلاح الدين جيش الصليبيين قرب بحيرة طبريا، وبعد أشهر فتح القدس.",
     ru:"Салах ад-Дин разбил войско крестоносцев у Тивериадского озера, а через несколько месяцев взял Иерусалим.",
     en:"Saladin defeated the Crusader army near the Sea of Galilee, and months later took Jerusalem."},
    {he:"הוא איחד את מצרים ואת סוריה תחת שלטון אחד, והצלבנים נגררו לקרב בשטח יבש בלי מים.",
     ar:"وحّد مصر والشام تحت حكم واحد، وانجرّ الصليبيون إلى قتال في أرض قاحلة بلا ماء.",
     ru:"Он объединил Египет и Сирию под одной властью, а крестоносцев втянули в бой на сухой местности без воды.",
     en:"He united Egypt and Syria under one rule, and the Crusaders were drawn into battle on dry ground without water."},
    {he:"ירושלים חזרה לידיים מוסלמיות, ובאירופה יצאו למסעות צלב נוספים שלא שינו את התוצאה.",
     ar:"عادت القدس إلى أيدٍ إسلامية، وخرجت أوروبا في حملات صليبية أخرى لم تغيّر النتيجة.",
     ru:"Иерусалим вернулся в мусульманские руки, а Европа снаряжала новые крестовые походы, не изменившие исхода.",
     en:"Jerusalem returned to Muslim hands, and Europe launched further crusades that did not change the outcome."}),
  C({he:"ד׳ימי",ar:"ذمّي",ru:"Зимми",en:"Dhimmi"},
    {he:"בן חסות: נוצרי או יהודי במדינה מוסלמית, שקיבל הגנה וחופש פולחן ושילם מס מיוחד.",
     ar:"أهل الذمة: مسيحي أو يهودي في دولة إسلامية، ناله الحماية وحرية العبادة مقابل ضريبة خاصة.",
     ru:"Покровительствуемый: христианин или еврей в мусульманском государстве, получавший защиту и свободу культа и плативший особый налог.",
     en:"A protected subject: a Christian or Jew in a Muslim state, who received protection and freedom of worship and paid a special tax."})
 ],
 [
  E(1258,
    {he:"המונגולים כובשים את בגדאד",ar:"المغول يجتاحون بغداد",ru:"Монголы берут Багдад",en:"The Mongols take Baghdad"},
    {he:"צבא מונגולי הרס את בגדאד והרג את הח׳ליף האחרון לבית עבאס.",
     ar:"دمّر جيش مغولي بغداد وقتل آخر الخلفاء العباسيين.",
     ru:"Монгольское войско разрушило Багдад и убило последнего аббасидского халифа.",
     en:"A Mongol army destroyed Baghdad and killed the last Abbasid caliph."},
    {he:"התפשטות האימפריה המונגולית מערבה, ואי־יכולתה של ח׳ליפות מפורדת להתגונן.",
     ar:"توسّع الإمبراطورية المغولية غربًا، وعجز خلافة مفكّكة عن الدفاع.",
     ru:"Расширение Монгольской империи на запад и неспособность раздробленного халифата защититься.",
     en:"The Mongol empire's expansion westwards, and the inability of a fragmented caliphate to defend itself."},
    {he:"מרכז הכובד של העולם המוסלמי עבר למצרים, ומאוחר יותר לאימפריה העות׳מאנית.",
     ar:"انتقل مركز ثقل العالم الإسلامي إلى مصر، ثم لاحقًا إلى الدولة العثمانية.",
     ru:"Центр тяжести мусульманского мира переместился в Египет, а позже — в Османскую империю.",
     en:"The centre of gravity of the Muslim world moved to Egypt, and later to the Ottoman empire."}),
  C({he:"שריעה",ar:"الشريعة",ru:"Шариат",en:"Sharia"},
    {he:"מכלול ההלכה המוסלמית, הנשענת על הקוראן, על מסורת הנביא ועל פרשנות החכמים.",
     ar:"مجموع الأحكام الإسلامية، المستندة إلى القرآن وسنّة النبي واجتهاد العلماء.",
     ru:"Совокупность мусульманского права, опирающегося на Коран, предание о Пророке и толкования учёных.",
     en:"The body of Muslim law, resting on the Quran, the tradition of the Prophet and the interpretation of the scholars."}),
  C({he:"בית החכמה",ar:"بيت الحكمة",ru:"Дом мудрости",en:"The House of Wisdom"},
    {he:"מרכז לימוד ותרגום בבגדאד, שבו הועברו לערבית כתבים מיוונית, מפרסית ומהודית.",
     ar:"مركز للعلم والترجمة في بغداد، نُقلت فيه إلى العربية كتب من اليونانية والفارسية والهندية.",
     ru:"Центр учёности и перевода в Багдаде, где на арабский переводили сочинения с греческого, персидского и индийского.",
     en:"A centre of study and translation in Baghdad, where works were rendered into Arabic from Greek, Persian and Indian."}),
  Sc({he:["בבגדאד הוקם בית החכמה, ובו תורגמו ספרים מיוונית, מפרסית ומהודית.",
          "מלומדים מוסלמים, נוצרים ויהודים עבדו בו זה לצד זה.",
          "אלח׳ואריזמי כתב שם ספר על פתרון משוואות, ומשמו נגזרה המילה אלגוריתם.",
          "הספרות שהגיעו מהודו קיבלו את הצורה שאירופה תאמץ מאות שנים אחר כך."],
      ar:["أُنشئ في بغداد بيت الحكمة، وتُرجمت فيه كتب من اليونانية والفارسية والهندية.",
          "عمل فيه علماء مسلمون ومسيحيون ويهود جنبًا إلى جنب.",
          "كتب الخوارزمي هناك كتابًا في حلّ المعادلات، ومن اسمه اشتُقّت كلمة خوارزمية.",
          "والأرقام التي جاءت من الهند أخذت الشكل الذي ستتبنّاه أوروبا بعد قرون."],
      ru:["В Багдаде был основан Дом мудрости, где переводили книги с греческого, персидского и индийского.",
          "В нём работали бок о бок мусульманские, христианские и еврейские учёные.",
          "Аль-Хорезми написал там книгу о решении уравнений, и от его имени произошло слово «алгоритм».",
          "А цифры, пришедшие из Индии, приняли тот вид, который Европа переймёт столетия спустя."],
      en:["In Baghdad the House of Wisdom was founded, where books were translated from Greek, Persian and Indian.",
          "Muslim, Christian and Jewish scholars worked in it side by side.",
          "Al-Khwarizmi wrote there a book on solving equations, and from his name came the word algorithm.",
          "And the numerals that came from India took the form Europe would adopt centuries later."]},
     [Q({he:"מה מלמד המקור על הידע באותה תקופה?",ar:"ماذا يعلّمنا المصدر عن المعرفة في تلك الحقبة؟",ru:"Что источник говорит о знании в ту эпоху?",en:"What does the source show about knowledge in that period?"},
        {he:"ידע עבר בין תרבויות ושפות, ונשמר ופותח בבגדאד.",ar:"أن المعرفة انتقلت بين الثقافات واللغات، وحُفظت وطُوّرت في بغداد.",ru:"Что знание переходило между культурами и языками и сохранялось и развивалось в Багдаде.",en:"That knowledge moved between cultures and languages, and was preserved and developed in Baghdad."},
        [{he:"כל תרבות פיתחה מדע לעצמה, בנפרד מן התרבויות האחרות.",ar:"كل ثقافة طوّرت العلم لنفسها، بمعزل عن الثقافات الأخرى.",ru:"Каждая культура развивала науку сама по себе, отдельно от других культур.",en:"Each culture developed its own science, apart from the other cultures."},
         {he:"כל הידע היווני אבד בלי שריד ולא הועבר לדורות שאחריו.",ar:"كل المعرفة اليونانية ضاعت دون أثر ولم تُنقل إلى الأجيال التي تلتها.",ru:"Всё греческое знание пропало без следа и не перешло ни к каким следующим поколениям после него.",en:"All of the Greek knowledge was lost without trace and was not passed on to the later generations."},
         {he:"רק מוסלמים הורשו לעסוק במדע בעיר בגדאד.",ar:"المسلمون وحدهم سُمح لهم بالاشتغال بالعلم في مدينة بغداد.",ru:"Заниматься наукой в городе Багдаде позволялось одним лишь мусульманам.",en:"Only Muslims were permitted to take part in any science in the city of Baghdad."}],
        [{he:"המקור מתאר תרגום מיוונית, מפרסית ומהודית.",ar:"المصدر يصف ترجمة من اليونانية والفارسية والهندية.",ru:"Источник описывает переводы с греческого, персидского и индийского.",en:"The source describes translation from Greek, Persian and Indian."},
         {he:"המקור אומר שספרים יווניים תורגמו בבית החכמה.",ar:"المصدر يقول إن كتبًا يونانية تُرجمت في بيت الحكمة.",ru:"Источник говорит, что греческие книги переводили в Доме мудрости.",en:"The source says Greek books were translated in the House of Wisdom."},
         {he:"בבית החכמה עבדו יחד מוסלמים, נוצרים ויהודים.",ar:"في بيت الحكمة عمل معًا مسلمون ومسيحيون ويهود.",ru:"В Доме мудрости вместе работали мусульмане, христиане и иудеи.",en:"In the House of Wisdom Muslims, Christians and Jews worked together."}]),
      Q({he:"מהיכן הגיעה המילה ״אלגוריתם״?",ar:"من أين جاءت كلمة «خوارزمية»؟",ru:"Откуда пришло слово «алгоритм»?",en:"Where does the word \"algorithm\" come from?"},
        {he:"משמו של מלומד שפעל בבגדאד וכתב על פתרון משוואות.",ar:"من اسم عالم عمل في بغداد وكتب في حلّ المعادلات.",ru:"От имени учёного, работавшего в Багдаде и писавшего о решении уравнений.",en:"From the name of a scholar who worked in Baghdad and wrote on solving equations."},
        [{he:"מהשפה היוונית העתיקה, מהמילה ״מספר״ שבפי המתמטיקאים.",ar:"من اللغة اليونانية القديمة، من كلمة «عدد» عند الرياضيين.",ru:"Из древнегреческого языка, от слова «число», которое было в устах математиков.",en:"From the ancient Greek language, from the word number that was used by mathematicians."},
         {he:"מלטינית של ימי הביניים, משם של ספר לימוד אחד ישן מאוד.",ar:"من لاتينية العصور الوسطى، من اسم كتاب تعليمي قديم جدًا.",ru:"Из средневековой латыни, от названия одного очень старого школьного учебника.",en:"From medieval Latin, taken from the title of one very old school textbook of the time."},
         {he:"משמו של מתמטיקאי אירופי שפעל במאה ה-19.",ar:"من اسم عالم رياضيات أوروبي من القرن الـ19.",ru:"От имени европейского математика, который жил и работал в 19 веке.",en:"From the name of a European mathematician who worked in the 19th century."}],
        [{he:"המקור אומר במפורש שהמילה נגזרה משם של אדם.",ar:"المصدر يقول صراحةً إن الكلمة اشتُقّت من اسم شخص.",ru:"Источник прямо говорит, что слово произошло от имени человека.",en:"The source says plainly that the word came from a person's name."},
         {he:"הצורה הלטינית באה אחר כך, והיא אינה המקור.",ar:"الصيغة اللاتينية جاءت لاحقًا، وليست هي الأصل.",ru:"Латинская форма появилась позже и не является источником.",en:"The Latin form came later, and it is not the origin."},
         {he:"המילה עתיקה בהרבה, ומקורה בבגדאד של המאה ה-9.",ar:"الكلمة أقدم بكثير، وأصلها في بغداد القرن التاسع.",ru:"Слово намного древнее, и родом оно из Багдада 9 века.",en:"The word is far older, and comes from 9th century Baghdad."}])])
 ]
]);

topic("renaissance","mid",
  {he:"רנסאנס וגילויים",ar:"النهضة والاكتشافات",ru:"Возрождение и открытия",en:"Renaissance and discovery"},

[
 [
  E(1440,
    {he:"המצאת הדפוס",ar:"اختراع الطباعة",ru:"Изобретение книгопечатания",en:"The invention of printing"},
    {he:"יוהנס גוטנברג פיתח בית דפוס עם אותיות מתכת נעות, והדפיס בו ספרים שלמים.",
     ar:"طوّر يوهانس غوتنبرغ مطبعة بحروف معدنية متحركة، وطبع بها كتبًا كاملة.",
     ru:"Иоганн Гутенберг создал печатный станок с подвижными металлическими литерами и напечатал на нём целые книги.",
     en:"Johannes Gutenberg developed a press with movable metal type, and printed whole books with it."},
    {he:"הביקוש לספרים גדל באוניברסיטאות ובערי הסחר, והעתקה ביד הייתה איטית ויקרה מאוד.",
     ar:"تزايد الطلب على الكتب في الجامعات ومدن التجارة، وكان النسخ باليد بطيئًا وباهظًا.",
     ru:"Спрос на книги рос в университетах и торговых городах, а переписывание от руки было медленным и очень дорогим.",
     en:"Demand for books was growing in the universities and trading cities, and copying by hand was slow and very expensive."},
    {he:"ספר חדל להיות נדיר; רעיונות התפשטו במהירות, והאוריינות הלכה וגדלה.",
     ar:"لم يعد الكتاب نادرًا؛ وانتشرت الأفكار بسرعة، وتوسّعت معرفة القراءة.",
     ru:"Книга перестала быть редкостью; идеи распространялись быстро, и грамотность росла.",
     en:"A book stopped being rare; ideas spread quickly, and literacy grew."}),
  E(1492,
    {he:"קולומבוס מגיע לאמריקה",ar:"وصول كولومبوس إلى أمريكا",ru:"Колумб достигает Америки",en:"Columbus reaches America"},
    {he:"משלחת בפיקוד קולומבוס הפליגה מספרד מערבה והגיעה לאיים בים הקריבי.",
     ar:"أبحرت بعثة بقيادة كولومبوس من إسبانيا غربًا، فوصلت جزرًا في البحر الكاريبي.",
     ru:"Экспедиция под началом Колумба отплыла из Испании на запад и достигла островов в Карибском море.",
     en:"An expedition under Columbus sailed west from Spain and reached islands in the Caribbean."},
    {he:"החיפוש אחר דרך ים להודו אחרי שנחסמה הדרך היבשתית, ותמיכתם של מלכי ספרד.",
     ar:"البحث عن طريق بحري إلى الهند بعد انسداد الطريق البرّي، ودعم ملكَي إسبانيا.",
     ru:"Поиск морского пути в Индию после закрытия сухопутного, и поддержка испанских монархов.",
     en:"The search for a sea route to India after the land route was closed, and the backing of the Spanish monarchs."},
    {he:"נפתח ״העולם החדש״ לאירופה — ואיתו כיבוש, מחלות והרס של תרבויות הילידים.",
     ar:"انفتح «العالم الجديد» أمام أوروبا — ومعه الغزو والأوبئة وتدمير حضارات السكان الأصليين.",
     ru:"Для Европы открылся «Новый Свет» — а с ним завоевание, болезни и гибель культур коренных народов.",
     en:"The \"New World\" opened to Europe — and with it conquest, disease and the destruction of native cultures."}),
  E(1517,
    {he:"לותר ותחילת הרפורמציה",ar:"لوثر وبداية الإصلاح",ru:"Лютер и начало Реформации",en:"Luther and the start of the Reformation"},
    {he:"מרטין לותר פרסם רשימת טענות נגד מכירת כתבי מחילה בכנסייה.",
     ar:"نشر مارتن لوثر قائمة اعتراضات على بيع صكوك الغفران في الكنيسة.",
     ru:"Мартин Лютер обнародовал список возражений против продажи индульгенций в церкви.",
     en:"Martin Luther published a list of objections to the sale of indulgences in the Church."},
    {he:"ביקורת רחבה על שחיתות בכנסייה, ורצון להחזיר את הסמכות לכתבי הקודש עצמם.",
     ar:"نقد واسع لفساد الكنيسة، ورغبة في إعادة السلطة إلى النصوص المقدسة نفسها.",
     ru:"Широкая критика церковной порчи и желание вернуть авторитет самим Писаниям.",
     en:"Wide criticism of corruption in the Church, and a wish to return authority to the scriptures themselves."},
    {he:"הנצרות במערב נחלקה לקתולים ולפרוטסטנטים, ואירופה נגררה למאה שנות מלחמות דת.",
     ar:"انقسمت المسيحية الغربية إلى كاثوليك وبروتستانت، وانجرّت أوروبا إلى قرن من حروب الدين.",
     ru:"Западное христианство раскололось на католиков и протестантов, и Европу втянуло в столетие религиозных войн.",
     en:"Western Christianity split into Catholics and Protestants, and Europe was drawn into a century of religious wars."}),
  C({he:"רנסאנס",ar:"النهضة",ru:"Возрождение",en:"Renaissance"},
    {he:"״לידה מחדש״: תנועה תרבותית שהחזירה למרכז את האדם ואת מורשת יוון ורומא.",
     ar:"«ولادة جديدة»: حركة ثقافية أعادت الإنسان وتراث اليونان وروما إلى المركز.",
     ru:"«Возрождение»: культурное движение, вернувшее в центр человека и наследие Греции и Рима.",
     en:"\"Rebirth\": a cultural movement that put the human being and the legacy of Greece and Rome back at the centre."})
 ],
 [
  E(1492,
    {he:"גירוש יהודי ספרד",ar:"طرد يهود إسبانيا",ru:"Изгнание евреев из Испании",en:"The expulsion of the Jews from Spain"},
    {he:"מלכי ספרד ציוו על היהודים להתנצר או לעזוב את הממלכה בתוך חודשים.",

    {he:"איחוד ספרד תחת שלטון קתולי, לחץ האינקוויזיציה, וחשד מתמשך כלפי מומרים.",

     en:"The unification of Spain under Catholic rule, the pressure of the Inquisition, and lasting suspicion of converts."},
    {he:"עשרות אלפי יהודים גורשו והתפזרו לצפון אפריקה, לאימפריה העות׳מאנית ולהולנד.",
     ar:"طُرد عشرات آلاف اليهود وتفرّقوا إلى شمال إفريقيا والدولة العثمانية وهولندا.",
     ru:"Десятки тысяч евреев были изгнаны и рассеялись в Северную Африку, Османскую империю и Голландию.",
     en:"Tens of thousands of Jews were expelled and scattered to North Africa, the Ottoman empire and Holland."}),

 [

[
 [
  E(1914,
    {he:"רצח בסרייבו ופרוץ המלחמה",ar:"اغتيال سراييفو واندلاع الحرب",ru:"Убийство в Сараеве и начало войны",en:"The Sarajevo assassination and the outbreak of war"},
    {he:"יורש העצר האוסטרי נרצח בסרייבו, ובתוך שבועות נגררו מעצמות אירופה למלחמה.",
     ar:"اغتيل وليّ العهد النمساوي في سراييفو، وخلال أسابيع انجرّت دول أوروبا إلى الحرب.",

     en:"The Austrian heir to the throne was assassinated in Sarajevo, and within weeks the powers of Europe were dragged into war."},
    {he:"בריתות צבאיות כובלות, מרוץ חימוש, מתחים לאומיים בבלקן ותחרות אימפריאלית.",
     ar:"أحلاف عسكرية ملزِمة، وسباق تسلّح، وتوتّرات قومية في البلقان، وتنافس إمبريالي.",

    {he:"מלחמה שנמשכה ארבע שנים והרגה כתשעה מיליון חיילים, בקנה מידה שלא נודע קודם.",

  E(1916,
    {he:"קרב ורדן",ar:"معركة فردان",ru:"Битва при Вердене",en:"The battle of Verdun"},
    {he:"צרפת וגרמניה נלחמו עשרה חודשים על אזור מבצרים אחד, ומאות אלפים נהרגו.",

     ru:"Франция и Германия десять месяцев бились за один укреплённый район, и погибли сотни тысяч.",
     en:"France and Germany fought for ten months over a single fortified area, and hundreds of thousands died."},
    {he:"תפיסת ״מלחמת התשה״ — לשחוק את האויב עד שלא יוכל עוד להחזיק מעמד.",
     ar:"مفهوم «حرب الاستنزاف» — إنهاك العدو حتى لا يقوى على الصمود.",
     ru:"Замысел «войны на истощение» — измотать врага, пока он не сможет держаться.",
     en:"The idea of a \"war of attrition\" — to wear the enemy down until he could hold out no longer."},
    {he:"ורדן נעשה סמל לחוסר התוחלת של מלחמת החפירות ולמחיר האנושי העצום שלה.",

     ru:"Верден стал символом бессмысленности окопной войны и её огромной человеческой цены.",
     en:"Verdun became a symbol of the futility of trench warfare and of its enormous human cost."}),
  E(1918,
    {he:"שביתת הנשק וסיום המלחמה",ar:"الهدنة ونهاية الحرب",ru:"Перемирие и конец войны",en:"The armistice and the end of the war"},
    {he:"גרמניה חתמה על הפסקת אש בקרון רכבת ביער קומפיין, והלחימה נפסקה.",

    {he:"כניסת ארצות הברית למלחמה, מצור ימי, רעב בעורף ומרידות בגרמניה עצמה.",

    {he:"ארבע אימפריות קרסו — הגרמנית, האוסטרו־הונגרית, הרוסית והעות׳מאנית.",

     en:"Four empires collapsed — the German, the Austro-Hungarian, the Russian and the Ottoman."}),
  C({he:"מלחמת חפירות",ar:"حرب الخنادق",ru:"Окопная война",en:"Trench warfare"},
    {he:"לחימה סטטית משתי מערכות חפירות מקבילות, שבה התקפה עולה באלפי הרוגים ומזיזה מטרים.",
     ar:"قتال ثابت من خطّي خنادق متوازيين، يكلّف فيه الهجوم آلاف القتلى ويحرّك أمتارًا.",

 ],
 [
  E(1917,
    {he:"המהפכה הבולשביקית",ar:"الثورة البلشفية",ru:"Большевистская революция",en:"The Bolshevik revolution"},

    {he:"תבוסות בחזית, רעב בערים, ואי־יכולתה של הממשלה הזמנית להכריע בשאלת המלחמה.",

    {he:"משבר כלכלי ותחושת עלבון בגרמניה, שהפכו לקרקע פורייה לתעמולה קיצונית.",

  E(1920,
    {he:"הקמת חבר הלאומים",ar:"إنشاء عصبة الأمم",ru:"Создание Лиги Наций",en:"The founding of the League of Nations"},

     en:"An international organisation was set up to settle disputes by talking rather than by war."},
    {he:"ההלם מהמלחמה, והרצון למנוע הישנות של הרג בקנה מידה כזה.",

     ru:"Потрясение от войны и желание не допустить повторения гибели такого масштаба.",

    {he:"הארגון נכשל מול תוקפנות בשנות השלושים, אך היה האב־טיפוס של האומות המאוחדות.",
     ar:"أخفقت المنظمة أمام العدوان في الثلاثينات، لكنها كانت نموذجًا أوّليًا للأمم المتحدة.",

  C({he:"פיצויי מלחמה",ar:"تعويضات الحرب",ru:"Военные репарации",en:"War reparations"},
    {he:"תשלומים שמדינה מנוצחת נדרשת לשלם למנצחות בשל הנזק שגרמה במלחמה.",
     ar:"مدفوعات تُطالَب بها الدولة المهزومة للمنتصرين عن الضرر الذي أحدثته في الحرب.",
     ru:"Выплаты, которые побеждённое государство обязано внести победителям за причинённый войной ущерб.",
     en:"Payments a defeated state is required to make to the victors for the damage it caused in the war."})

 [
  E(1929,
    {he:"השפל הגדול",ar:"الكساد الكبير",ru:"Великая депрессия",en:"The Great Depression"},
    {he:"מפולת בבורסה בניו יורק גררה משבר כלכלי עולמי ואבטלה המונית.",
     ar:"جرّ انهيار بورصة نيويورك أزمة اقتصادية عالمية وبطالة جماعية.",
     ru:"Обвал на нью-йоркской бирже повлёк мировой экономический кризис и массовую безработицу.",

    {he:"ספקולציה בבורסה, אשראי זול, וייצור שעלה בהרבה על יכולת הקנייה של האנשים.",

    {he:"מיליונים איבדו את פרנסתם, ובמדינות רבות עלו לשלטון תנועות קיצוניות.",

  C({he:"טוטליטריות",ar:"الشمولية",ru:"Тоталитаризм",en:"Totalitarianism"},
    {he:"משטר שמבקש לשלוט לא רק במדינה אלא גם במחשבה, בחינוך ובחיים הפרטיים.",
     ar:"نظام يسعى إلى السيطرة لا على الدولة فحسب بل على الفكر والتربية والحياة الخاصة.",

     en:"A regime that seeks to control not only the state but also thought, education and private life."}),
  C({he:"תעמולה",ar:"الدعاية",ru:"Пропаганда",en:"Propaganda"},
    {he:"הפצה מכוונת של מסרים כדי לעצב דעת קהל, לרוב תוך הסתרה או עיוות של עובדות.",
     ar:"بثّ مقصود لرسائل لتشكيل الرأي العام، غالبًا بإخفاء الحقائق أو تشويهها.",
     ru:"Целенаправленное распространение сообщений для формирования общественного мнения, чаще всего со скрытием или искажением фактов.",
     en:"The deliberate spreading of messages to shape public opinion, usually by hiding or twisting facts."}),
  Sc({he:["ממשלות בעלות הברית מצהירות, וגרמניה מקבלת,",
          "את אחריותה של גרמניה ובעלות בריתה",
          "לכל הנזק והאובדן שנגרמו לממשלות בעלות הברית ולאזרחיהן",
          "כתוצאה מן המלחמה שנכפתה עליהן בתוקפנותה של גרמניה ובעלות בריתה.",
          "מתוך סעיף 231 בחוזה ורסאי."],
      ar:["تعلن حكومات الحلفاء، وتقبل ألمانيا،",
          "مسؤولية ألمانيا وحلفائها",
          "عن كل الضرر والخسارة اللذين لحقا بحكومات الحلفاء ومواطنيها",
          "نتيجة الحرب التي فُرضت عليها بعدوان ألمانيا وحلفائها.",
          "من المادة 231 في معاهدة فرساي."],
      ru:["Правительства союзников заявляют, а Германия признаёт",
          "ответственность Германии и её союзников",
          "за весь ущерб и все потери, причинённые правительствам союзников и их гражданам",
          "вследствие войны, навязанной им агрессией Германии и её союзников.",
          "Из статьи 231 Версальского договора."],
      en:["The Allied governments affirm, and Germany accepts,",
          "the responsibility of Germany and her allies",
          "for all the damage and loss caused to the Allied governments and their nationals",
          "as a consequence of the war imposed upon them by the aggression of Germany and her allies.",
          "From article 231 of the Treaty of Versailles."]},
     [Q({he:"מה קובע הסעיף?",ar:"ماذا تقرّر المادة؟",ru:"Что устанавливает эта статья?",en:"What does the clause establish?"},
        {he:"שגרמניה אחראית לנזקי המלחמה, ומכאן החובה לשלם פיצויים.",ar:"أن ألمانيا مسؤولة عن أضرار الحرب، ومن هنا واجب دفع التعويضات.",ru:"Что Германия ответственна за ущерб войны, отсюда и обязанность платить репарации.",en:"That Germany is responsible for the damage of the war, and hence the duty to pay reparations."},
        [{he:"שהמלחמה נגרמה בטעות, ואין צד אחד שאפשר להאשים.",ar:"أن الحرب وقعت بالخطأ، ولا طرف واحد يمكن اتهامه بها.",ru:"Что война случилась по ошибке и винить в ней одну сторону нельзя.",en:"That the war came about by mistake, and that no single side can be blamed for it."},
         {he:"שגרמניה תפורק מנשקה בלבד, ולא תידרש לשלם דבר.",ar:"أن ألمانيا ستُنزع أسلحتها فقط، ولن يُطلب منها دفع شيء.",ru:"Что Германию только разоружат и платить с неё ничего не потребуют.",en:"That Germany would only be disarmed, and would not be asked to pay anything."},
         {he:"שכל הצדדים אחראים במידה שווה לנזקי המלחמה הזאת.",ar:"أن كل الأطراف مسؤولة بالتساوي عن أضرار هذه الحرب الكبرى.",ru:"Что все стороны в равной мере отвечают за ущерб от этой большой войны.",en:"That all the sides are equally responsible for the damage of this great war."}],
        [{he:"הסעיף מטיל את האחריות על גרמניה, במפורש.",ar:"المادة تُلقي المسؤولية على ألمانيا صراحةً.",ru:"Статья прямо возлагает ответственность на Германию.",en:"The clause places the responsibility on Germany, in plain words."},
         {he:"הסעיף עוסק בנזק ובאובדן, ומהם באים הפיצויים.",ar:"المادة تتناول الضرر والخسارة، ومنهما تأتي التعويضات.",ru:"Статья говорит об ущербе и потерях, отсюда и репарации.",en:"The clause deals with damage and loss, and from those come reparations."},
         {he:"הסעיף מדבר על גרמניה ועל בעלות בריתה בלבד.",ar:"المادة تتحدث عن ألمانيا وحلفائها فقط.",ru:"Статья говорит только о Германии и её союзниках.",en:"The clause speaks only of Germany and her allies."}]),
      Q({he:"מדוע היה לסעיף הזה משקל פוליטי בשנים שאחריו?",ar:"لماذا كان لهذه المادة وزن سياسي في السنوات التالية؟",ru:"Почему эта статья имела политический вес в последующие годы?",en:"Why did this clause carry political weight in the years that followed?"},
        {he:"תחושת העלבון שיצר שימשה תעמולה קיצונית בגרמניה.",ar:"لأن الشعور بالإهانة الذي أوجدته خدم دعاية متطرفة في ألمانيا.",ru:"Порождённое им чувство унижения послужило крайней пропаганде в Германии.",en:"The sense of humiliation it created served extremist propaganda in Germany."},
        [{he:"הסעיף ביטל את חבר הלאומים כמה שנים אחרי שהוקם בוורסאי.",ar:"ألغى هذا البند عصبة الأمم بعد بضع سنوات من إنشائها في فرساي.",ru:"Эта статья упразднила Лигу Наций через несколько лет после её создания в Версале.",en:"This clause abolished the League of Nations a few years after its founding in Versailles."},

 [

    {he:"שאיפות התפשטות נאציות, מדיניות פיוס שלא עצרה אותן, והסכם עם ברית המועצות לחלוקת פולין.",

/* ============================================================
   8. מנוע התרגילים
   ------------------------------------------------------------
   כלל אחד מנחה את כל הבנייה כאן: מסיח חייב להיות מסיח *סביר*.
   ארבע אפשרויות אקראיות מלמדות לנחש לפי אורך המשפט. ארבע
   אפשרויות מאותה תקופה מכריחות באמת לדעת, וזו כל התועלת.
   ============================================================ */
function itemId(tid,lv,i){return tid+"|"+lv+"|"+i}
function itemRec(id){
  if(!state.item[id])state.item[id]={n:0,ok:0};
  return state.item[id];
}
/* בחירת פריט: קודם מה שעוד לא נראה, אחר כך מה שנכשל, ורק בסוף
   מה שכבר נשלט. חזרה מרווחת פשוטה, בלי שעון ובלי נוסחה. */
function chooseIndex(tid,lv,pool,avoid){
  var cand=[],i,w;
  for(i=0;i<pool.length;i++){
    if(avoid!==undefined&&i===avoid&&pool.length>1)continue;
    var r=state.item[itemId(tid,lv,i)];
    if(!r||!r.n)w=6;                            /* חדש */
    else if(r.ok<r.n)w=1+Math.min(4,r.n-r.ok);  /* נכשל בעבר */
    else w=1;                                   /* נשלט */
    for(var j=0;j<w;j++)cand.push(i);
  }
  if(!cand.length)return 0;
  return pick(cand);
}
function poolOf(tp,lv){return (tp.L[lv-1]||tp.L[0]||[])}

/* שנה לתצוגה. שנה שלילית היא לפני הספירה, וזה נכתב במילים ולא
   במינוס — תלמיד שרואה "−450" לא יודע שמדובר בשנה. */
function yr(y){
  if(y<0)return String(-y)+" "+t("bce");
  if(y<1000)return String(y)+" "+t("ce");
  return String(y);
}
/* המאה של שנה. שנת 1789 היא המאה ה-18, ושנת 100 היא המאה ה-1. */
function centuryOf(y){
  var a=Math.abs(y);
  return Math.floor((a-1)/100)+1;
}
function centuryStr(y){
  return t("century")+" "+_rom(centuryOf(y))+(y<0?" "+t("bce"):"");
}
var ROM=["","I","II","III","IV","V","VI","VII","VIII","IX","X",
         "XI","XII","XIII","XIV","XV","XVI","XVII","XVIII","XIX","XX","XXI"];
function _rom(n){return ROM[n]||String(n)}
/* ------------------------------------------------------------
   שתי שכבות ניקוי להקראה בלבד. המסך אינו משתנה מהן.

   הספרה הרומית נראית נכון על המסך ונשמעת רע באוזן: קול עברי או
   ערבי מוסר "XVIII" כאותיות לטיניות ולא כמספר. ההשוואה היא מול
   ROM עצמו ולא מול תבנית, כדי שמילה לטינית בשם נושא לא תהפוך
   בטעות למספר.

   והגרשיים העבריים משמשים כאן לשני דברים: ראשי תיבות (לפנה״ס,
   או״ם) ומירכאות (״אדם חופשי״). המנוע מכיר רק את הראשון. הכלל
   שמפריד ביניהם: בראשי תיבות באה אחרי הגרשיים אות עברית אחת
   בדיוק וסוף מילה. הסיכון א-סימטרי — מירכאה שהוסרה אינה יכולה
   להזיק, מירכאה שנשארה כן.
   ------------------------------------------------------------ */
function saySpell(x){
  return String(x==null?"":x).replace(/[IVXLC]+/g,function(m){
    var i=ROM.indexOf(m);
    return i>0?String(i):m;
  }).replace(/״/g,function(m,i,str){
    return /^[\u05D0-\u05EA](?![\u05D0-\u05EA])/.test(str.slice(i+1))?m:"";
  }).replace(/\s—\s/g,", ");
}

/* כל האירועים מכל התוכן — משם נלקחים מסיחים כשהנושא עצמו קטן מדי,
   וגם תרגיל הסדר הכרונולוגי בין תקופות. */
var ALL_EV=null;
function allEvents(){
  if(ALL_EV)return ALL_EV;
  ALL_EV=[];
  TOPICS.forEach(function(tp){tp.L.forEach(function(lvl){
    lvl.forEach(function(it){if(it.k==="e")ALL_EV.push(it)})})});
  return ALL_EV;
}
var ALL_CON=null;
function allConcepts(){
  if(ALL_CON)return ALL_CON;
  ALL_CON=[];
  TOPICS.forEach(function(tp){tp.L.forEach(function(lvl){
    lvl.forEach(function(it){if(it.k==="c")ALL_CON.push(it)})})});
  return ALL_CON;
}
/* אירועים אחרים לפי קרבה בזמן. מסיח מאותה מאה הוא מסיח אמיתי;
   מסיח במרחק אלף שנה נפסל לפי התאריך ולא לפי הידע. */
function nearEvents(it,pool,n){
  var mine=pool.filter(function(x){return x.k==="e"&&x!==it});
  var rest=allEvents().filter(function(x){return x!==it&&mine.indexOf(x)<0});
  rest.sort(function(a,b){return Math.abs(a.y-it.y)-Math.abs(b.y-it.y)});
  return shuffle(mine).concat(rest).slice(0,Math.max(n,0));
}
function O(html,ok,why){return {h:html,ok:!!ok,why:why||""}}

/* בונה ארבע אפשרויות משדה אחד של פריט, ומוודא שאין שתיים זהות.
   שני אירועים יכולים לחלוק תוצאה מנוסחת דומה, ואז השאלה נשארת
   בלי תשובה יחידה — לכן הסינון כאן ולא בתצוגה.
   מועמד שנפסל מוחלף במועמד הבא ואינו מנוכה ממספר האפשרויות:
   שאלה עם שלוש אפשרויות היא ניחוש של אחד משלושה. אם גם רשימה
   רחבה לא הספיקה לארבע — מחזירים null, והקורא נופל לצורה אחרת
   במקום להציג שאלה חלשה יותר. */
function optsFromField(it,cands,field,n){
  var seen={},opts=[],own=gl(it[field]);
  if(!own)return null;
  seen[own]=1;
  opts.push(O(esc(own),true));
  for(var i=0;i<cands.length&&opts.length<n;i++){
    var v=gl(cands[i][field]);
    if(!v||seen[v])continue;
    seen[v]=1;
    opts.push(O(esc(v),false,evLabel(cands[i])));
  }
  return opts.length>=n?shuffle(opts):null;
}
function evLabel(x){
  if(x.k==="e")return gl(x.t)+" · "+yr(x.y);
  if(x.k==="c")return gl(x.t);
  return "";
}

/* --- צורה 1: מתי --- */
function formWhen(tp,lv,pool,idx){
  var it=pool[idx];
  var cands=nearEvents(it,pool,12);
  var seen={},opts=[O(esc(yr(it.y)),true)],i;
  seen[yr(it.y)]=1;
  for(i=0;i<cands.length&&opts.length<4;i++){
    var v=yr(cands[i].y);
    if(seen[v])continue; seen[v]=1;
    opts.push(O(esc(v),false,evLabel(cands[i])));
  }
  /* אם התקופה דלילה, מוסיפים הזזות סבירות ולא מספרים אקראיים */
  var off=shuffle([-200,-100,-50,-30,30,50,100,200]);
  for(i=0;i<off.length&&opts.length<4;i++){
    var y2=it.y+off[i];
    if(y2===0)continue;
    var s2=yr(y2);
    if(seen[s2])continue; seen[s2]=1;
    opts.push(O(esc(s2),false,""));
  }
  return {type:"fact",prompt:t("qWhen"),lead:gl(it.t),
    opts:shuffle(opts),answer:yr(it.y),
    /* השנה היא התשובה, ולכן היא חייבת להיאמר. קודם נאמרו רק
       הכותרת והתיאור — כלומר הכול חוץ ממה שנשאל. */
    say:gl(it.t)+", "+yr(it.y)+". "+gl(it.w),reveal:it};
}
/* --- צורה 2: מה קרה --- */
function formWhat(tp,lv,pool,idx){
  var it=pool[idx];
  var opts=optsFromField(it,nearEvents(it,pool,28),"w",4);
  if(!opts)return formWhen(tp,lv,pool,idx);
  return {type:"fact",prompt:t("qWhat"),lead:gl(it.t)+" · "+yr(it.y),
    opts:opts,answer:gl(it.w),say:gl(it.t)+". "+gl(it.w),reveal:it};
}
/* --- צורה 3: על איזה אירוע מדובר --- */
function formName(tp,lv,pool,idx){
  var it=pool[idx];
  var opts=optsFromField(it,nearEvents(it,pool,28),"t",4);
  if(!opts)return formWhen(tp,lv,pool,idx);
  return {type:"fact",prompt:t("qName"),lead:gl(it.w),
    opts:opts,answer:gl(it.t),
    /* שם האירוע הוא התשובה. בלעדיו נשמע רק התיאור שכבר הופיע בשאלה. */
    say:gl(it.t)+". "+gl(it.w),reveal:it};
}
/* --- צורה 4: סיבה --- */
function formWhy(tp,lv,pool,idx){
  var it=pool[idx];
  var opts=optsFromField(it,nearEvents(it,pool,28),"c",4);
  if(!opts)return formWhat(tp,lv,pool,idx);
  return {type:"fact",prompt:t("qWhy"),lead:gl(it.t)+" · "+yr(it.y),
    opts:opts,answer:gl(it.c),say:gl(it.t)+". "+gl(it.c),reveal:it};
}
/* --- צורה 5: תוצאה --- */
function formEff(tp,lv,pool,idx){
  var it=pool[idx];
  var opts=optsFromField(it,nearEvents(it,pool,28),"e",4);
  if(!opts)return formWhat(tp,lv,pool,idx);
  return {type:"fact",prompt:t("qEff"),lead:gl(it.t)+" · "+yr(it.y),
    opts:opts,answer:gl(it.e),say:gl(it.t)+". "+gl(it.e),reveal:it};
}
/* --- צורה 6: מה קרה קודם --- */
function formFirst(tp,lv,pool,idx){
  var it=pool[idx];
  /* שנים חוזרות הופכות את השאלה לחסרת תשובה יחידה, וכך גם שני
     אירועים שכותרתם מנוסחת אותו דבר. קודם נבחרו שלושה מועמדים
     ורק אחר כך נפסלו הכפולים — ומי שנפסל פשוט נעלם, כך שהשאלה
     הוצגה עם שלוש אפשרויות. כאן עוברים על רשימה רחבה ומקבלים
     מועמד רק אם הוא מוסיף שנה חדשה, עד שיש ארבעה.
     שנים־עשר הקרובים בזמן מעורבבים ומשמשים ראשונים — מסיח מאותה
     תקופה נפסל לפי הידע ולא לפי התאריך; השאר ממשיכים אחריהם
     לפי קרבה בזמן, רק אם צריך. */
  var all=nearEvents(it,pool,40).filter(function(x){return x.y!==it.y});
  var cands=shuffle(all.slice(0,12)).concat(all.slice(12));
  var seenY={},seenT={},uniq=[it],i,x,xt;
  seenY[it.y]=1; seenT[gl(it.t)]=1;
  for(i=0;i<cands.length&&uniq.length<4;i++){
    x=cands[i]; xt=gl(x.t);
    if(seenY[x.y]||!xt||seenT[xt])continue;
    seenY[x.y]=1; seenT[xt]=1; uniq.push(x);
  }
  if(uniq.length<4)return formWhen(tp,lv,pool,idx);
  var first=uniq.slice().sort(function(a,b){return a.y-b.y})[0];
  var opts=uniq.map(function(x){
    return O(esc(gl(x.t)),x===first,x===first?"":gl(x.t)+" · "+yr(x.y));
  });
  return {type:"fact",prompt:t("qFirst"),lead:"",
    opts:shuffle(opts),answer:gl(first.t),
    say:gl(first.t)+". "+yr(first.y),reveal:first};
}
/* --- צורה 7: מושג --- */
function formTerm(tp,lv,pool,idx){
  var it=pool[idx];
  var cands=shuffle(pool.filter(function(x){return x.k==="c"&&x!==it}))
    .concat(shuffle(allConcepts().filter(function(x){return x!==it})));
  var opts=optsFromField(it,cands,"d",4);
  if(!opts)return null;
  return {type:"fact",prompt:t("qTerm"),lead:gl(it.t),
    opts:opts,answer:gl(it.d),say:gl(it.t)+". "+gl(it.d),reveal:it};
}
/* --- צורה 8: מקור --- */
function formSrc(tp,lv,pool,idx){
  var it=pool[idx];
  var qq=pick(it.qs);
  var opts=[O(esc(gl(qq.a)),true)],ys=qq.y||[];
  /* לכל מסיח יש נימוק משלו: מה בדיוק במקור סותר אותו. y||[] שומר
     על קריאות Q ישנות שעדיין אין בהן נימוקים. */
  qq.w.forEach(function(x,i){opts.push(O(esc(gl(x)),false,ys[i]?gl(ys[i]):""))});
  return {type:"src",prompt:t("qRead"),passage:it,qtext:gl(qq.q),
    opts:shuffle(opts),answer:gl(qq.a),
    /* הקטע עצמו כבר מוקרא בכפתור נפרד מעל הפסקה. אחרי המענה
       מה שצריך להישמע הוא השאלה והתשובה עליה. */
    say:gl(qq.q)+" "+gl(qq.a),reveal:null};
}

/* בוחר את צורת התרגיל. הרמה קובעת מה נשאל: ברמה 1 האירוע עצמו,
   ברמה 2 הקשר שבין אירועים, וברמה 3 מקור ומושג. */
/* הרמז נותן תכונה אחרת מזו שנשאלה: לשאלת שנה — המאה, ולשאלה על
   טקסט — השנה. הוא נגזר מהשאלה שחזרה בפועל ולא מהצורה שביקשנו,
   כי formName נופלת חזרה ל-formWhen כשאין די מסיחים — ורמז לפי
   הצורה המבוקשת היה מוסר שם את התשובה. */
function hintFor(q,tp){
  if(!q)return "";
  if(q.type==="src")return t("hintSrcL");
  if(q.prompt===t("qFirst"))return t("hintOrderL");
  var it=q.reveal;
  if(!it||typeof it.y!=="number")return t("hintTopicL")+": "+tName(tp);
  if(q.answer===yr(it.y))return centuryStr(it.y);
  return t("hintYearL")+": "+yr(it.y);
}
function buildQuestion(tid,lv,avoid){
  var tp=topicOf(tid); if(!tp)return null;
  var pool=poolOf(tp,lv);
  if(!pool.length)return null;
  var idx=chooseIndex(tid,lv,pool,avoid);
  var it=pool[idx],q=null,f;
  if(it.k==="p")q=formSrc(tp,lv,pool,idx);
  else if(it.k==="c")q=formTerm(tp,lv,pool,idx);
  else {
    var forms=lv===1?["when","what","name"]
             :lv===2?["why","eff","first","what"]
                    :["why","eff","first","when","name"];
    f=pick(forms);
    q=f==="when"?formWhen(tp,lv,pool,idx)
     :f==="what"?formWhat(tp,lv,pool,idx)
     :f==="name"?formName(tp,lv,pool,idx)
     :f==="why" ?formWhy(tp,lv,pool,idx)
     :f==="eff" ?formEff(tp,lv,pool,idx)
                :formFirst(tp,lv,pool,idx);
  }
  if(!q)q=formWhen(tp,lv,pool,idx);
  q.tid=tid; q.lv=lv; q.idx=idx; q.id=itemId(tid,lv,idx);
  q.hint=hintFor(q,tp);
  return q;
}

/* --- מחולל מזורע. mulberry32: קצר, מהיר, ופיזור טוב דיו --- */
function withSeed(seed,fn){

/* base64url. הניקוי בפענוח אינו קוסמטי: וואטסאפ שובר מחרוזות

   שכבר נקלטו אליו מתייתמות. */
function examId(spec){return hash32(spec.s+"|"+spec.q.map(function(x){

function examQuestions(spec){
  /* מסננים נושאים שאינם מוכרים לאפליקציה הזאת, בדיוק כמו decodeExam.
     בלי הסינון buildQ מחזיר null על נושא זר, והמסך נופל על
     q.topic של null. עדיף לדלג בשקט מאשר להתרסק. */
  var pairs=(spec.q||[]).filter(function(x){return !!topicById(x[0])});
  /* מבחן שנבנה עם זרע לכל משבצת נבנה משבצת אחרי משבצת, וכל

     מבחן ישן, בלי זרעים, חייב להיבנות בדיוק כפי שנבנה ביום

/* --- בחירת השאלות בידי המורה ---------------------------------
   עד כאן המורה בחר נושאים, רמה ומספר שאלות — והשאלות עצמן הוגרלו
   מאחורי גבו. הוא ראה אותן לראשונה רק אחרי שהמבחן כבר היה אצל
   התלמידים. מעכשיו כל שאלה היא משבצת נפרדת עם זרע משלה: המורה
   רואה אותה לפני השליחה, מחליף אותה בשאלה אחרת מאותו נושא,
   מסיר אותה, או מוסיף שאלה מנושא שחסר לו.

   גם את הרביעית ואת החמישית — כלומר לא "החלפה" אלא הגרלה מחדש

function xlg(){return state.lang||"he"}
function xt(k){var d=XT[xlg()];var v=d&&d[k];return v===undefined?(XK[k]===undefined?k:XK[k]):v}
/* {0} ו-{1} — סדר המילים משתנה בין השפות, ולכן מספרים ולא רצף */
function xf(k){var s=xt(k),a=arguments,i;
  for(i=1;i<a.length;i++)s=s.split("{"+(i-1)+"}").join(String(a[i]));
  return s}

/* השאלות עצמן, על המסך של המורה, לפני שהמבחן נשלח. */
function viewExamSlots(){
  var ls=exSlots(),h="",tops=EB.topics.filter(function(x){return topicById(x)});
  h+='<div style="margin-top:18px"><b>'+esc(xt("exQs"))+'</b>'+
     '<p class="sub" style="margin:4px 0 8px">'+esc(xt("exQsNote"))+'</p>';
  h+='<div class="row" style="margin:0 0 10px">'+
     '<button class="xq-b" data-a="exqans" aria-pressed="'+(EB.ans?"true":"false")+'">'+
     (EB.ans?esc(xt("exQsHide")):esc(xt("exQsShow")))+'</button>'+
     '<button class="xq-b" data-a="exqreset">'+esc(xt("exQsReset"))+'</button></div>';
  h+='<ol class="xq-list">';
  ls.forEach(function(sl,i){
    var q=exPreviewQ(sl),ok=exRightAnswer(q);
    h+='<li class="xq"><div class="xq-top">'+
       '<span class="xq-n">'+(i+1)+'</span>'+
       '<span class="xq-tp">'+esc(q&&q.topicName?q.topicName:exTopicName(sl[0]))+'</span>'+
       '<span class="xq-acts">'+
       '<button class="xq-b" data-a="exqroll" data-i="'+i+'">'+esc(xt("exQsSwap"))+'</button>'+
       /* המבחן חייב להישאר עם שאלה אחת לפחות, ולכן הכפתור נעלם
          ולא מוצג כבוי: כפתור שאי אפשר ללחוץ עליו מבלבל. */
       (ls.length>1?'<button class="xq-b" data-a="exqdel" data-i="'+i+'">'+esc(xt("exQsDrop"))+'</button>':"")+
       '</span></div>';
    if(q){
      h+='<div class="xq-q">'+q.ask+(q.expr?'<div class="xq-e">'+q.expr+'</div>':"")+'</div>';
      if(EB.ans&&ok)h+='<div class="xq-a"><b>'+esc(xt("exQsAns"))+'</b> '+ok.h+'</div>';
    }else h+='<div class="xq-q sub">'+esc(xt("exQsFail"))+'</div>';
    h+='</li>';
  });
  h+='</ol>';
  /* כפתור לכל נושא שנבחר, כדי שהמורה יוסיף בדיוק את מה שחסר לו
     ולא שאלה אקראית מנושא כלשהו. */
  if(tops.length){
    h+='<div class="row xq-add"><span class="sub">'+esc(xt("exQsAdd"))+'</span>';
    tops.forEach(function(id){
      h+='<button class="xq-b" data-a="exqadd" data-t="'+esc(id)+'">'+
         '<b aria-hidden="true">+</b> <span>'+esc(exTopicName(id))+'</span></button>';
    });
    h+='</div>';
  }
  return h+'</div>';
}
function viewExamNew(){
  var tops=topicsForTrack(state.track);
  if(!EB.topics.length)EB.topics=tops.slice(0,4).map(function(t){return t.id});
  var h='<div class="wrap" style="padding-block:22px">';
  h+='<h1 class="h1">'+esc(xt("exTitle"))+'</h1>'+
     '<p class="sub">'+esc(xt("exLead"))+'</p>';

  h+='<div class="card pad" style="margin-top:16px">';
  h+='<label class="tt"><b>'+esc(xt("exName"))+'</b></label>'+
     '<input class="field" id="exTitle" value="'+esc(EB.title)+'" placeholder="'+esc(xt("exNamePh"))+'" maxlength="60">';

  /* שורת יחידות הלימוד הגיעה עם מודול המבחן ממשפחת math-uni. באפליקציה
     עם מסלול אחד — math-app, ארבע פעולות החשבון — אין 3/4/5 יח״ל, והשורה
     רק בלבלה. מציגים אותה רק כשיש באמת יותר ממסלול אחד. */
  if(TRACKS.length>1)h+='<div style="margin-top:16px"><b>'+esc(xt("exUnits"))+'</b>'+
     '<div class="seg" style="margin-top:7px">'+[3,4,5].map(function(tr){
       return '<button class="'+(state.track===tr?"on":"")+'" data-a="track" data-t="'+tr+'">'+tr+' '+esc(xt("exUnitSuf"))+'</button>'
     }).join("")+'</div></div>';

  h+='<div style="margin-top:16px"><b>'+esc(xt("exLevel"))+'</b><div class="seg" style="margin-top:7px">'+
     LVL.map(function(l,i){
       return '<button class="'+(EB.level===i+1?"on":"")+'" style="--c:'+LVL_C[i]+'" data-a="exlvl" data-l="'+(i+1)+'">'+l+'</button>'
     }).join("")+'</div></div>';

  h+='<div style="margin-top:16px"><b>'+esc(xt("exCount"))+': <span id="exNlab">'+EB.n+'</span></b>'+
     '<input type="range" min="5" max="25" step="1" value="'+EB.n+'" data-slide="exn" style="margin-top:6px"></div>';
  h+='<div style="margin-top:16px"><b>'+esc(xt("exTime"))+': <span id="exMlab">'+
     esc(EB.mins?EB.mins+' '+xt("minutes"):xt("none"))+'</span></b>'+
     '<p class="sub sm" style="margin:2px 0 0">'+esc(xt("exTimeNote"))+'</p>'+
     '<input type="range" min="0" max="90" step="5" value="'+EB.mins+'" data-slide="exm" style="margin-top:6px"></div>';

  h+='<div style="margin-top:18px"><b>'+esc(xt("exTopics"))+'</b>'+
     '<p class="sub" style="margin:4px 0 8px">'+esc(xt("exTopicsNote"))+'</p>'+
     '<div class="grid g2">';
  tops.forEach(function(t){
    var on=EB.topics.indexOf(t.id)>=0;
    h+='<button class="tpc '+areaCls(t.area)+(on?" on":"")+'" data-a="extopic" data-t="'+t.id+
       '" aria-pressed="'+(on?"true":"false")+'"><span class="tn">'+esc(tName(t))+'</span>'+
       '<span class="td">'+esc(tDesc(t))+'</span></button>';
  });
  h+='</div></div>';

  /* התאמות. לא "הקלות" — הן הסיבה שהאפליקציה הזאת קיימת, והמורה
     הוא זה שמחליט מה מותר במבחן שלו. */
  h+='<div style="margin-top:18px"><b>'+esc(xt("exAcc"))+'</b>'+
     '<p class="sub" style="margin:4px 0 8px">'+esc(xt("exAccNote"))+'</p>';
  [["tts",xt("exTts"),xt("exTtsSub")],
   ["formulas",xt("exForm"),xt("exFormSub")]]
   .filter(function(r){return r[0]!=="formulas"||HAS_FORMULAS})
   .forEach(function(r){
    var on=!!EB[r[0]];
    h+='<button class="tog" data-a="exflag" data-f="'+r[0]+'" role="switch" aria-checked="'+(on?"true":"false")+'">'+
      '<span class="tt"><b>'+esc(r[1])+'</b><span>'+esc(r[2])+'</span></span><span class="sw"></span></button>';
  });
  h+='</div>';

  h+='<div style="margin-top:18px"><label class="tt"><b>'+esc(xt("exPhone"))+'</b></label>'+
     '<p class="sub" style="margin:4px 0 6px">'+esc(xt("exPhoneNote"))+'</p>'+
     '<input class="field" id="exPhone" value="'+esc(EB.phone)+'" placeholder="972501234567" inputmode="tel" maxlength="20"></div>';

  h+=viewExamSlots();
  h+='<button class="btn btn-p w" style="margin-top:20px" data-a="exbuild">'+ic("check",18)+' '+esc(xt("exBuild"))+'</button>';
  h+='</div>';

  if(EB.built){
    var sp=EB.built,url=examUrl(sp);
    var msg=(sp.t||xt("exam"))+"\n"+xf("exShareMsg",sp.q.length)+"\n"+url;
    h+='<div class="card pad" style="margin-top:18px;border-color:var(--ok)">'+
       '<h2 class="h2">'+esc(xt("exReady"))+'</h2>'+
       '<p class="sub">'+esc(sp.t||xt("exam"))+' · '+sp.q.length+' '+esc(xt("qs"))+' · '+esc(LVL[sp.l-1]||"")+'</p>'+
       '<div class="row" style="margin-top:12px">'+
       '<a class="btn btn-p" href="'+esc(waLink(msg,""))+'" target="_blank" rel="noopener">'+
       ic("share",17)+' '+esc(xt("exWa"))+'</a>'+
       '<button class="btn" data-a="excopy" data-v="'+esc(url)+'">'+ic("copy",17)+' '+esc(xt("exCopyUrl"))+'</button>'+
       '<button class="btn btn-g" data-a="go" data-v="marks">'+ic("chart",17)+' '+esc(xt("exToMarks"))+'</button></div>'+
       (EB.copied==="url"?'<p class="chip ok" style="margin-top:10px">'+esc(xt("exUrlCopied"))+'</p>':"")+
       '<p class="sub" style="margin-top:12px;word-break:break-all;direction:ltr;text-align:left">'+esc(url)+'</p>'+
       '</div>';
  }
  return h+'</div>';

var MK={open:"",paste:"",msg:null,del:""};
function viewMarks(){
  var h='<div class="wrap" style="padding-block:22px">';
  h+='<h1 class="h1">'+esc(xt("mkTitle"))+'</h1>'+
     '<p class="sub">'+esc(xt("mkLead"))+'</p>';

     ic("plus",17)+' '+esc(xt("mkNew"))+'</button></div>';
  if(MK.msg&&!MK.msg.id)h+='<p class="chip '+(MK.msg.ok?"ok":"bad")+'" style="margin-top:10px">'+esc(MK.msg.m)+'</p>';

  if(!EX.list.length){
    h+='<div class="card pad" style="margin-top:16px"><p class="sub" style="margin:0">'+
       esc(xt("mkEmpty"))+'</p></div>';
    return h+'</div>';
  }
  EX.list.forEach(function(ex){
    var open=MK.open===ex.id;
    var subs=ex.subs||[];
    var avg=subs.length?Math.round(subs.reduce(function(a,b){return a+b.pct},0)/subs.length):0;
    h+='<div class="card pad" style="margin-top:14px">';
    h+='<button class="row" data-a="mkopen" data-i="'+esc(ex.id)+'" style="width:100%;background:none;border:0;text-align:start;cursor:pointer">'+

       '<span class="sub" style="display:block">'+ex.spec.q.length+' '+esc(xt("qs"))+' · '+esc(ex.date)+
       ' · '+subs.length+' '+esc(xt("mkSubs"))+(subs.length?' · '+esc(xt("mkAvg"))+' '+avg:'')+'</span></span>'+
       '<span class="chip'+(subs.length?(avg>=70?" ok":avg>=55?" warn":" bad"):"")+'">'+
       (subs.length?avg+"%":"—")+'</span></button>';
    if(!open){h+='</div>';return}

    h+='<div style="margin-top:14px"><label class="tt"><b>'+esc(xt("mkPaste"))+'</b></label>'+
       '<textarea class="field" id="mkPaste" rows="3" placeholder="'+esc(xt("mkPastePh"))+'"></textarea>'+
       '<div class="row" style="margin-top:8px">'+
       '<button class="btn btn-p" data-a="mkadd" data-i="'+esc(ex.id)+'">'+ic("check",17)+' '+esc(xt("mkTake"))+'</button>'+
       '<a class="btn" href="'+esc(waLink((ex.spec.t||xt("exam"))+"\n"+examUrl(ex.spec),""))+'" target="_blank" rel="noopener">'+
       ic("share",17)+' '+esc(xt("mkResend"))+'</a>'+
       (subs.length?'<button class="btn btn-g" data-a="mkcopy" data-i="'+esc(ex.id)+'">'+ic("copy",17)+' '+esc(xt("mkCopyTbl"))+'</button>'+
         '<button class="btn btn-g" data-a="mkcsv" data-i="'+esc(ex.id)+'">'+ic("share",17)+' '+esc(xt("mkCsv"))+'</button>':"")+
       (MK.del===ex.id?
         '<span class="row" style="gap:6px"><span class="chip bad">'+esc(xf("mkDelQ",subs.length||0))+'</span>'+
         '<button class="btn btn-d" data-a="mkdelyes" data-i="'+esc(ex.id)+'">'+esc(xt("mkDelYes"))+'</button>'+
         '<button class="btn btn-g" data-a="mkdelno">'+esc(xt("mkCancel"))+'</button></span>':
         '<button class="btn btn-g" data-a="mkdel" data-i="'+esc(ex.id)+'">'+esc(xt("mkDel"))+'</button>')+
       '</div>';
    if(MK.msg&&MK.msg.id===ex.id)
      h+='<p class="chip '+(MK.msg.ok?"ok":"bad")+'" style="margin-top:10px">'+esc(MK.msg.m)+'</p>';
    h+='</div>';

    if(subs.length){
      /* לפי תלמיד */
      h+='<div style="margin-top:16px"><b>'+esc(xt("mkByStudent"))+'</b>';
      subs.slice().sort(function(a,b){return b.pct-a.pct}).forEach(function(s){
        var wrong=s.per.filter(function(p){return !p.ok});
        h+='<div class="tog" style="align-items:flex-start"><span class="tt"><b>'+esc(s.name||xt("mkNoName"))+'</b>'+
          '<span>'+s.ok+' '+esc(xt("outOf"))+' '+s.n+

          '<span class="chip '+(s.pct>=70?"ok":s.pct>=55?"warn":"bad")+'">'+s.pct+'%</span></div>';
      });
      h+='</div>';
      /* לפי נושא — זה מה שמורה באמת צריך: לא מי נכשל, אלא מה ללמד שוב */
      var byT={};
      subs.forEach(function(s){s.per.forEach(function(p){
        if(!byT[p.topic])byT[p.topic]={n:0,ok:0,name:p.topicName};
        byT[p.topic].n++; byT[p.topic].ok+=p.ok;
      })});
      h+='<div style="margin-top:16px"><b>'+esc(xt("mkByTopic"))+'</b>'+
         '<p class="sub" style="margin:4px 0 8px">'+esc(xt("mkByTopicNote"))+'</p>';
      Object.keys(byT).map(function(k){var o=byT[k];o.pct=Math.round(100*o.ok/o.n);return o})
        .sort(function(a,b){return a.pct-b.pct}).forEach(function(o){
        h+='<div class="tog"><span class="tt"><b>'+esc(o.name)+'</b>'+
          '<span>'+o.ok+' '+esc(xt("mkRight"))+' '+o.n+'</span></span>'+
          '<span class="bar '+(o.pct>=70?"ok":o.pct>=40?"mid":"low")+'" style="width:90px;flex:none">'+
          '<i style="width:'+o.pct+'%"></i></span>'+
          '<span class="chip">'+o.pct+'%</span></div>';
      });
      h+='</div>';
    }
    h+='</div>';
  });
  return h+'</div>';
}
/* ------------------------------------------------------------
   ייצוא CSV של ההגשות.
   העתקת הטבלה נותנת טקסט מופרד בטאבים — נוח להדבקה, אבל לא קובץ.
   מורה שרוצה למיין, לסנן או לחשב ממוצע צריך גיליון. שורה לכל תלמיד,
   ועמודה לכל שאלה, כדי שאפשר יהיה לראות מיד באיזו שאלה נפלה הכיתה.
   ה-BOM בהתחלה הוא מה שגורם לאקסל לקרוא עברית, ערבית ורוסית נכון
   במקום ג׳יבריש — בלעדיו הקובץ נפתח שבור בדיוק אצל מי שצריך אותו.
   ------------------------------------------------------------ */
function csvCell(v){
  var s=(v===undefined||v===null)?"":String(v);

}
function csvRow(a){ return a.map(csvCell).join(",") }
/* ============================================================
   מצב מורה.
   בונה המבחן ומסך הציונים נועדו למורה. על טאבלט כיתתי, או על
   טלפון שהילד לוקח לעצמו, אין סיבה שהם יהיו במרחק הקשה אחת:
   ילד יכול למחוק מבחן, לראות ציונים של חברים, או לפתוח מבחן
   ולראות מראש את השאלות.
   זו אינה אבטחה, ואסור להציג אותה ככזאת: מי שיודע לפתוח כלי
   פיתוח יעקוף אותה בשנייה. זו נעילה מפני יד סקרנית — בדיוק מה
   שצריך כאן, ולא יותר.
   כל עוד לא נבחר קוד, שום דבר לא משתנה והמסכים גלויים כתמיד.
   ============================================================ */
var TE={ask:false,mode:"",msg:"",busy:false};
function teRead(){try{return JSON.parse(localStorage.getItem("mifne-teacher")||"null")}catch(e){return null}}
function teWrite(o){try{o===null?localStorage.removeItem("mifne-teacher"):localStorage.setItem("mifne-teacher",JSON.stringify(o))}catch(e){}}

function teOpen(){
  if(!teHas())return true;
  try{if(sessionStorage.getItem("mifne-teacher"+"-open")==="1")return true}catch(e){}
  try{if(localStorage.getItem("mifne-teacher"+"-open")==="1")return true}catch(e){}
  return false;
}
function teSetOpen(on,remember){

  try{localStorage.removeItem("mifne-teacher"+"-open")}catch(e){}

/* גיבוב חלש כגיבוי בלבד. SubtleCrypto קיים בכל דפדפן מודרני
   בהקשר מאובטח, ו-GitHub Pages הוא כזה. */
function teWeak(s){var h=5381,i;for(i=0;i<s.length;i++)h=((h*33)^s.charCodeAt(i))>>>0;return "w"+h.toString(16)}
function teHash(pin,salt,cb){
  var msg=salt+"|"+pin;
  try{
    if(window.crypto&&crypto.subtle&&crypto.subtle.digest&&window.TextEncoder){
      crypto.subtle.digest("SHA-256",new TextEncoder().encode(msg)).then(function(d){
        var a=Array.prototype.slice.call(new Uint8Array(d));
        cb(a.map(function(b){return ("0"+b.toString(16)).slice(-2)}).join(""));
      },function(){cb(teWeak(msg))});
      return;
    }
  }catch(e){}
  cb(teWeak(msg));
}
function teSalt(){
  var s="";
  try{
    var a=new Uint8Array(8);crypto.getRandomValues(a);
    s=Array.prototype.slice.call(a).map(function(b){return ("0"+b.toString(16)).slice(-2)}).join("");
  }catch(e){ s=String(Date.now())+Math.random().toString(36).slice(2) }
  return s;
}
/* השהיה אחרי ניסיונות כושלים. ארבע ספרות הן עשרת אלפים
   אפשרויות, וילד סבלני יכול לנסות הרבה. */
function teWait(){
  var r=teRead();if(!r||!r.bad||r.bad<3)return 0;
  var pen=Math.min(300,Math.pow(2,r.bad-3)*5)*1000;
  var left=Math.ceil(((r.badAt||0)+pen-Date.now())/1000);
  return left>0?left:0;
}
function teDialog(){
  var wrap=document.getElementById("te-wrap");

  var dirv=(LANGS[state.lang]&&LANGS[state.lang].dir)||"rtl";
  var w=document.createElement("div");

    '<div class="te-row">'+
      '<button class="te-btn pri" id="te-ok"'+(wait?' disabled':'')+'>'+esc(xt("teOk"))+'</button>'+
      '<button class="te-btn" id="te-no">'+esc(xt("teCancel"))+'</button>'+
    '</div>'+
    (!setting&&teHas()?'<button class="te-btn link" id="te-forgot">'+esc(xt("teForgot"))+'</button>':'')+
    '</div>';
  document.body.appendChild(w);

  box.focus(); if(pin&&!wait)pin.focus();
  /* מלכודת פוקוס, כמו בשער התנאים */
  w.addEventListener("keydown",function(e){
    if(e.key==="Escape"){teClose();return}
    if(e.key==="Enter"){e.preventDefault();teSubmit();return}
    if(e.key!=="Tab")return;

}
function teClose(){ TE.ask=false; TE.mode=""; TE.msg=""; teDialog(); }
function teSubmit(){
  if(TE.busy)return;
  var setting=(TE.mode==="set"||TE.mode==="change"||!teHas());
  var pin=(document.getElementById("te-pin")||{}).value||"";
  var rem=!!(document.getElementById("te-rem")||{}).checked;
  if(!/^[0-9]{4,8}$/.test(pin)){TE.msg=xt("teShort");teDialog();return}
  if(setting){
    var p2=(document.getElementById("te-pin2")||{}).value||"";
    if(pin!==p2){TE.msg=xt("teMismatch");teDialog();return}
    var salt=teSalt();
    TE.busy=true;
    teHash(pin,salt,function(h){
      TE.busy=false;
      teWrite({h:h,s:salt,bad:0,badAt:0});
      teSetOpen(true,rem);
      TE.ask=false;TE.mode="";TE.msg="";
      teDialog(); render();
    });
    return;
  }
  if(teWait()){teDialog();return}
  var rec=teRead(); if(!rec){teClose();return}
  TE.busy=true;
  teHash(pin,rec.s,function(h){
    TE.busy=false;
    if(h===rec.h){
      rec.bad=0;rec.badAt=0;teWrite(rec);
      teSetOpen(true,rem);
      TE.ask=false;TE.mode="";TE.msg="";
      teDialog(); render();
    }else{
      rec.bad=(rec.bad||0)+1;rec.badAt=Date.now();teWrite(rec);
      TE.msg=xt("teBad"); teDialog();
    }
  });
}
function teAsk(mode){ TE.ask=true; TE.mode=mode||""; TE.msg=""; teDialog() }

/* נעילה אוטומטית אחרי שהאפליקציה הייתה מוסתרת זמן־מה.

   פתוח, וזה בדיוק המצב שהתכונה אמורה למנוע. שתי דקות מספיקות
   כדי לא להפריע לעבודה רצופה, ולנעול כשהמכשיר עבר יד.
   נעילה שנשמרה כ"לזכור במכשיר הזה" היא בחירה מפורשת ולא נוגעים בה. */
var TE_HID=0;

    teSetOpen(false); render();
  });

/* ?teacher=1 פותח את החלון, והפרמטר מוסר מיד מהכתובת כדי שלא
   יישאר בקישור ששותף או בהיסטוריה. */
(function(){
  try{
    var u=new URL(location.href);
    if(u.searchParams.get("teacher")==="1"){
      u.searchParams.delete("teacher");
      history.replaceState(null,"",u.pathname+(u.searchParams.toString()?"?"+u.searchParams:"")+u.hash);
      /* שער התנאים יושב מעל הכול, וכך צריך להיות: אי־אפשר להשתמש
         באפליקציה לפני שהוסכם עליהם. חלון הקוד ממתין לו במקום
         להיפתח מתחתיו ולהיראות תקוע. */
      var tries=0;
      (function waitLegal(){
        if(tries++>=600){ teAsk(teHas()?"":"set"); return }
        /* LEGAL.accepted נוצר רק כש-protect.js מאותחל. עד אז אין
           עדיין מה לבדוק, ובדיקה של ".lg-wrap" לבדה מחזירה "אין
           שער" בדיוק ברגע שלפני שהוא נבנה. */
        var ready=false;
        try{ ready=!!(window.LEGAL&&window.LEGAL.accepted) }catch(e){}
        if(!ready){ setTimeout(waitLegal,200); return }
        var ok=true;
        try{ ok=!!window.LEGAL.accepted() }catch(e){ ok=true }
        if(!ok){ setTimeout(waitLegal,200); return }
        teAsk(teHas()?"":"set");
      })();
    }
  }catch(e){}
})();

function marksCsv(ex){

  var n=ex.spec.q.length,i;
  var head=[xt("mkCsvName"),xt("mkCsvPct"),xt("mkCsvOk"),xt("mkCsvTotal"),
            xt("mkCsvDate"),xt("mkCsvValid")];
  for(i=0;i<n;i++)head.push(xf("mkCsvQ",i+1));
  var rows=[csvRow(head)];
  subs.forEach(function(s){
    var r=[s.name||xt("mkNoName"),s.pct,s.ok,s.n,s.date||"",
           s.valid?xt("mkCsvYes"):xt("mkCsvNo")];

/* כרום מוחק את שם הקובץ כולו ברגע שיש בו תו אחד שאינו ASCII —
   לא רק עברית: גם é או מקף ארוך. מה שיורד נקרא "download", בלי
   סיומת, ואקסל לא יודע לפתוח אותו. מורה שקרא למבחן שלו בעברית
   קיבל קובץ בלי שם ובלי סוג. לכן השם מתועתק ללטינית. */
var TRLIT={
  "א":"a","ב":"b","ג":"g","ד":"d","ה":"h","ו":"v","ז":"z","ח":"ch","ט":"t","י":"y",
  "כ":"k","ך":"k","ל":"l","מ":"m","ם":"m","נ":"n","ן":"n","ס":"s","ע":"","פ":"f",
  "ף":"f","צ":"tz","ץ":"tz","ק":"k","ר":"r","ש":"sh","ת":"t",
  "ا":"a","ب":"b","ت":"t","ث":"th","ج":"j","ح":"h","خ":"kh","د":"d","ذ":"dh","ر":"r",
  "ز":"z","س":"s","ش":"sh","ص":"s","ض":"d","ط":"t","ظ":"z","ع":"","غ":"gh","ف":"f",
  "ق":"q","ك":"k","ل":"l","م":"m","ن":"n","ه":"h","و":"w","ي":"y","ة":"h","ى":"a","ء":"",
  "أ":"a","إ":"i","آ":"a","ؤ":"w","ئ":"y",
  "а":"a","б":"b","в":"v","г":"g","д":"d","е":"e","ё":"e","ж":"zh","з":"z","и":"i",
  "й":"y","к":"k","л":"l","м":"m","н":"n","о":"o","п":"p","р":"r","с":"s","т":"t",
  "у":"u","ф":"f","х":"kh","ц":"ts","ч":"ch","ш":"sh","щ":"sch","ъ":"","ы":"y","ь":"",
  "э":"e","ю":"yu","я":"ya"
};
function asciiName(s){
  var i,c,out="";
  /* é ו-ü הם אות לטינית ועוד סימן מצורף. פירוק והסרת הסימן משאיר e ו-u. */
  try{ s=s.normalize("NFD").replace(/[\u0300-\u036f]/g,"") }catch(e){}
  for(i=0;i<s.length;i++){
    c=s.charAt(i);
    if(/[A-Za-z0-9]/.test(c)){ out+=c; continue }
    var lower=c.toLowerCase();
    if(TRLIT[lower]!==undefined){ out+=TRLIT[lower]; continue }
    out+=" ";                     /* כל השאר — רווח, שיתכווץ בהמשך */
  }
  return out.replace(/\s+/g," ").trim();
}
function csvFileName(ex){
  var t=asciiName(String(ex.spec.t||"")).slice(0,60).trim();
  var d=String(ex.date||todayIso()).replace(/[^0-9-]/g,"");
  /* כשלא נשאר כלום קריא, מזהה המבחן הוא מה שמבדיל בין שני קבצים
     שירדו באותו יום. */
  if(!t) t="exam "+String(ex.id||"").slice(0,6);
  return (t+" "+d).trim()+".csv";
}
function downloadCsv(ex){
  var txt=marksCsv(ex),url=null,a=document.createElement("a");
  try{
    url=URL.createObjectURL(new Blob([txt],{type:"text/csv;charset=utf-8"}));
  }catch(e){
    url="data:text/csv;charset=utf-8,"+encodeURIComponent(txt);
  }
  a.href=url; a.download=csvFileName(ex);
  a.style.cssText="position:fixed;inset-inline-start:-9999px";
  document.body.appendChild(a); a.click();
  setTimeout(function(){
    if(a.parentNode)a.parentNode.removeChild(a);
    if(url&&url.indexOf("blob:")===0){try{URL.revokeObjectURL(url)}catch(e){}}
  },400);
}
function marksTable(ex){
  var out=(ex.spec.t||xt("exam"))+"\n";
  out+=xt("mkTblHead")+"\n";

    out+=(s.name||xt("mkNoName"))+"\t"+s.pct+"\t"+s.ok+"/"+s.n+"\t"+wrong.join(", ")+"\n";

/* ------------------------------------------------------------
   מסך התלמיד — מבחן מתוך קישור
   ------------------------------------------------------------ */
var SIT={spec:null,id:"",qs:[],i:0,name:"",answers:[],flags:[],
         t0:0,tick:null,phase:"intro",code:"",copied:false};

/* ------------------------------------------------------------
   מבחן שנפתח מחדש — ריענון, שיחה נכנסת, נעילת מסך
   ------------------------------------------------------------
   תלמיד שדפדפן שלו רענן באמצע מבחן איבד עד כה את הכול. התשובות
   נשמרות עכשיו במכשיר, לפי מזהה המבחן, יחד עם שעת ההתחלה — כדי
   שגם טיימר לא יתאפס ויעניק זמן נוסף. השמירה מקומית בלבד.
   ------------------------------------------------------------ */
function sitKey(){return EKEY+"-run-"+SIT.id}
function sitSave(){
  if(!SIT.id)return;
  try{localStorage.setItem(sitKey(),JSON.stringify({
    n:SIT.name,a:SIT.answers,f:SIT.flags,t:SIT.t0,i:SIT.i,p:SIT.phase}))}catch(e){}
}
function sitKeyOld(){return EKEY_OLD+"-run-"+SIT.id}
function sitDrop(){try{localStorage.removeItem(sitKey());localStorage.removeItem(sitKeyOld())}catch(e){}}
function sitRestore(){
  if(!SIT.id)return false;
  try{
    /* מבחן שהתחיל לפני פיצול המפתחות נשמר תחת המפתח הישן. */
    var o=JSON.parse(localStorage.getItem(sitKey())||localStorage.getItem(sitKeyOld())||"null");
    if(!o||!o.a||!o.a.length)return false;
    SIT.qs=examQuestions(SIT.spec);
    if(o.a.length!==SIT.qs.length)return false;   /* מבחן אחר תחת אותו מזהה */
    SIT.name=o.n||""; SIT.answers=o.a;
    SIT.flags=o.f&&o.f.length===o.a.length?o.f:SIT.qs.map(function(){return false});
    SIT.t0=o.t||0; SIT.i=Math.min(Math.max(0,o.i|0),SIT.qs.length-1);
    SIT.phase=o.p==="done"?"done":"ask";
    if(SIT.phase==="done")SIT.code=encodeResult(SIT.id,SIT.name,SIT.answers);
    return true;
  }catch(e){return false}
}
/* שניות שנותרו, או null כשלא הוגדרה הגבלת זמן */
function sitLeft(){
  var m=SIT.spec&&SIT.spec.m;
  if(!m||!SIT.t0)return null;
  return Math.max(0,Math.round((SIT.t0+m*60000-Date.now())/1000));
}
function sitClock(){
  var l=sitLeft(); if(l===null)return "";
  var mm=Math.floor(l/60),ss=l%60;
  return mm+":"+(ss<10?"0":"")+ss;
}
/* הזמן נגמר — מגישים. לא מבקשים אישור: אישור שאיש לא לוחץ עליו
   פירושו מבחן שנשאר פתוח לנצח. */
function sitTimerOn(){
  sitTimerOff();
  if(sitLeft()===null)return;
  SIT.tick=setInterval(function(){
    if(SIT.phase!=="ask"){sitTimerOff();return}
    if(sitLeft()<=0){sitTimerOff();sitFinish();return}
    var el=$("#sitclock"); if(el)el.textContent=sitClock();
  },1000);
}
function sitTimerOff(){if(SIT.tick){clearInterval(SIT.tick);SIT.tick=null}}

function sitStart(){
  var nm=$("#sitName"); SIT.name=nm?nm.value.trim():"";
  SIT.qs=examQuestions(SIT.spec);
  /* אם לא נותרה אף שאלה שאפשר לבנות (למשל מבחן של אפליקציה אחרת),
     מציגים את מסך המבחן השבור במקום ליפול על שאלה שאינה קיימת. */
  if(!SIT.qs.length){view="badexam"; render(); return}
  SIT.answers=SIT.qs.map(function(){return -1});
  SIT.flags=SIT.qs.map(function(){return false});
  SIT.i=0; SIT.phase="ask"; SIT.t0=Date.now();
  sitSave(); sitTimerOn();
  window.scrollTo(0,0); render();
}
function sitAnswer(i){
  if(SIT.phase!=="ask")return;
  SIT.answers[SIT.i]=i;
  sitSave();
  sitNext();
}
/* סימון לחזרה אינו תשובה ואינו משנה אותה — הוא רק מסמן. */
function sitFlag(){
  if(SIT.phase!=="ask")return;
  SIT.flags[SIT.i]=!SIT.flags[SIT.i];
  sitSave(); render();
}
function sitNext(){
  if(SIT.i+1<SIT.qs.length){SIT.i++;window.scrollTo(0,0);render();return}
  /* לא מגישים בלחיצה על תשובה. לחיצה בטעות על האפשרות האחרונה
     אינה אמורה לסיים מבחן. */
  SIT.phase="review"; stopSpeak(); window.scrollTo(0,0); render();
}
function sitGo(i){
  SIT.i=clamp(i,0,SIT.qs.length-1); SIT.phase="ask";
  window.scrollTo(0,0); render();
}
/* התוצאה נשלחת כקישור ולא כקוד: המורה לוחץ, האפליקציה נפתחת אצלו
   וקולטת. הקוד עצמו יושב אחרי #r=, ולכן גם הדבקה של הקישור השלם
   בתיבת הקוד עובדת — codeOf מחלץ אותו משם. */
function resultUrl(code){return location.origin+location.pathname+"#r="+code}
function codeOf(raw){
  var m=String(raw||"").match(/#r=([A-Za-z0-9\-_]+)/);
  return (m?m[1]:String(raw||"")).trim();
}
function sitFinish(){
  SIT.phase="done";
  sitTimerOff();
  SIT.code=encodeResult(SIT.id,SIT.name,SIT.answers);
  sitSave();
  stopSpeak(); window.scrollTo(0,0); render();
}
function sitGrade(){
  var ok=0,i;
  for(i=0;i<SIT.qs.length;i++){
    var a=SIT.answers[i];
    if(a>=0&&SIT.qs[i].options[a]&&SIT.qs[i].options[a].ok)ok++;
  }
  return {ok:ok,n:SIT.qs.length,pct:Math.round(100*ok/SIT.qs.length)};
}

  if(sp.w!==false){
