  Sc({he:["אם ייטען נוצרי שיהודי משכן אצלו חפץ, והיהודי מכחיש —",
          "יאמין השופט ליהודי בשבועתו.",
          "אם ייטען על יהודי שהרג ילד נוצרי, ולא יובאו על כך ארבעה עדים,",
          "יהיה המאשים חייב באותו עונש שביקש להטיל על היהודי.",
          "מתוך כתב הזכויות של הנסיך בולסלב, קאליש, 1264."],
      ar:["إن ادّعى مسيحيّ أن يهوديًّا رهن عنده شيئًا، وأنكر اليهودي —",
          "فليصدّق القاضي اليهوديّ بيمينه.",
          "وإن اتُّهم يهودي بقتل طفل مسيحي ولم يُؤتَ على ذلك بأربعة شهود،",
          "فليَنَل المتّهِم العقوبة ذاتها التي أراد إنزالها باليهودي.",
          "من مرسوم حقوق الأمير بوليسلاف، كاليش، 1264."],
      ru:["Если христианин утверждает, что еврей взял у него вещь в заклад, а еврей отрицает,",
          "судья да поверит еврею по его клятве.",
          "Если еврея обвинят в убийстве христианского ребёнка и не приведут четырёх свидетелей,",
          "обвинитель понесёт то самое наказание, какое хотел навлечь на еврея.",
          "Из грамоты князя Болеслава, Калиш, 1264 год."],
      en:["If a Christian claims that a Jew holds a pledge of his, and the Jew denies it,",
          "the judge shall believe the Jew on his oath.",
          "If a Jew is accused of killing a Christian child and four witnesses are not produced,",
          "the accuser shall bear the very punishment he sought to bring upon the Jew.",
          "From the charter of Duke Bolesław, Kalisz, 1264."]},
     [Q({he:"כיצד מרתיע כתב הזכויות מפני עלילות דם?",ar:"كيف يردع مرسوم الحقوق عن افتراءات الدم؟",ru:"Как грамота удерживает от кровавых наветов?",en:"How does the charter deter blood libels?"},
        {he:"מי שמאשים ואינו מביא ארבעה עדים נענש בעצמו בעונש שביקש להטיל.",ar:"من يتّهم ولا يأتي بأربعة شهود يُعاقَب هو بالعقوبة التي أرادها.",ru:"Тот, кто обвиняет и не приводит четырёх свидетелей, сам несёт наказание, которого добивался.",en:"Anyone who accuses and does not bring four witnesses bears the punishment he sought to impose."},
        [{he:"האשמה כזאת נאסרת לחלוטין ואינה נשמעת בבית הדין.",ar:"تُحظر تهمة كهذه تمامًا ولا تُسمع في المحكمة.",ru:"Такое обвинение запрещено вовсе и в суде не выслушивается.",en:"Such an accusation is forbidden outright and is not heard in court."},
         {he:"הקהילה היהודית משלמת קנס ובכך נסגר העניין.",ar:"تدفع الجماعة اليهودية غرامة وبذلك يُغلق الأمر.",ru:"Еврейская община платит штраф, и на этом дело закрывается.",en:"The Jewish community pays a fine and the matter is closed."},
         {he:"הנסיך עצמו חוקר כל מקרה ופוסק בו לבדו.",ar:"يحقّق الأمير نفسه في كلّ حالة ويحكم فيها وحده.",ru:"Князь сам расследует каждый случай и решает его единолично.",en:"The duke himself investigates every case and decides it alone."}]),
      Q({he:"מה חריג במעמד עדותו של היהודי לפי המקור?",ar:"ما الاستثنائي في مكانة شهادة اليهودي بحسب المصدر؟",ru:"Что необычно в положении свидетельства еврея по источнику?",en:"What is unusual about the standing of the Jew's testimony in the source?"},
        {he:"שבועתו מספיקה כדי לדחות טענה של נוצרי — במקום שבו יהודים נחשבו בדרך כלל פחות אמינים.",ar:"يمينه تكفي لردّ دعوى مسيحيّ — في مكان عُدّ فيه اليهود عادةً أقلّ مصداقية.",ru:"Его клятвы довольно, чтобы отклонить иск христианина, — там, где евреев обыкновенно считали менее достоверными.",en:"His oath suffices to reject a Christian's claim — in a place where Jews were usually held less credible."},
        [{he:"עדותו אינה מתקבלת כלל, וצריך עד נוצרי לצידה.",ar:"لا تُقبل شهادته البتّة، ويلزم شاهد مسيحيّ إلى جانبها.",ru:"Его свидетельство вовсе не принимается и требует христианского свидетеля рядом.",en:"His testimony is not accepted at all, and needs a Christian witness beside it."},
         {he:"עדותו נשמעת רק בענייני מסחר ולא בענייני נפשות.",ar:"تُسمع شهادته في شؤون التجارة فقط لا في شؤون الدماء.",ru:"Его свидетельство слушают только в торговых делах, а не в делах о жизни.",en:"His testimony is heard only in matters of trade and not in cases of life."},
         {he:"עדותו מחייבת אישור של רב הקהילה לפני שתישמע.",ar:"تستوجب شهادته تصديق حاخام الجماعة قبل أن تُسمع.",ru:"Его свидетельство требует утверждения раввином общины, прежде чем быть выслушанным.",en:"His testimony requires the approval of the community's rabbi before it is heard."}])])
]);

more("emancip",1,[
  E(1806,
    {he:"הסנהדרין של נפוליאון",ar:"سنهدرين نابليون",ru:"Синедрион Наполеона",en:"Napoleon's Sanhedrin"},
    {he:"נפוליאון כינס אספת רבנים ונכבדים ושאל אותם אם היהודים רואים בצרפת את מולדתם ובצרפתים את אחיהם.",
     ar:"عقد نابليون جمعية حاخامات ووجهاء وسألهم هل يرى اليهود في فرنسا وطنهم وفي الفرنسيين إخوة لهم.",
     ru:"Наполеон созвал собрание раввинов и почётных людей и спросил их, видят ли евреи во Франции свою родину, а во французах — братьев.",
     en:"Napoleon convened an assembly of rabbis and notables and asked them whether the Jews saw France as their homeland and the French as their brothers."},
    {he:"מתנגדי האמנציפציה טענו שהיהודים נאמנים לעמם ולא למדינה, ונפוליאון רצה תשובה מחייבת בכתב.",
     ar:"ادّعى معارضو المساواة أن اليهود أوفياء لشعبهم لا للدولة، وأراد نابليون جوابًا ملزمًا مكتوبًا.",
     ru:"Противники эмансипации утверждали, что евреи верны своему народу, а не государству, и Наполеон хотел обязывающего письменного ответа.",
     en:"Opponents of emancipation argued that the Jews were loyal to their own people and not to the state, and Napoleon wanted a binding answer in writing."},
    {he:"הרבנים השיבו שהיהודים הם קהילה דתית ולא אומה בתוך אומה, וזו התשובה שליוותה את יהדות המערב מאה שנה.",
     ar:"أجاب الحاخامات بأن اليهود جماعة دينية لا أمّة داخل أمّة، وهذا الجواب رافق يهود الغرب مئة سنة.",
     ru:"Раввины ответили, что евреи — религиозная община, а не народ внутри народа, и этот ответ сопровождал западное еврейство сто лет.",
     en:"The rabbis answered that the Jews were a religious community and not a nation within a nation, and this answer stayed with western Jewry for a century."}),
  E(1867,
    {he:"אמנציפציה באוסטרו-הונגריה",ar:"المساواة في النمسا-المجر",ru:"Эмансипация в Австро-Венгрии",en:"Emancipation in Austria-Hungary"},
    {he:"החוקה החדשה של האימפריה העניקה שוויון זכויות מלא לכל אזרחיה, ובהם ליהודים, בלי תנאי.",
     ar:"منح دستور الإمبراطورية الجديد مساواة كاملة في الحقوق لكلّ مواطنيها، ومنهم اليهود، بلا شرط.",
     ru:"Новая конституция империи дала полное равноправие всем гражданам, в том числе евреям, без всяких условий.",
     en:"The empire's new constitution granted full equality of rights to all its citizens, the Jews among them, without condition."},
    {he:"אחרי התבוסה לפרוסיה נאלצה אוסטריה להתפשר עם הונגריה ולכתוב חוקה, שנשענה על שוויון בין נתיניה.",
     ar:"بعد الهزيمة أمام بروسيا اضطُرّت النمسا إلى التسوية مع المجر وكتابة دستور، قام على المساواة بين رعاياها.",
     ru:"После поражения от Пруссии Австрия была вынуждена пойти на соглашение с Венгрией и написать конституцию, опиравшуюся на равенство подданных.",
     en:"After its defeat by Prussia, Austria had to compromise with Hungary and write a constitution, which rested on equality among its subjects."},
    {he:"וינה ובודפשט נעשו מרכזים יהודיים גדולים ומשגשגים, ובהן צמחו סופרים, רופאים ועיתונאים יהודים רבים.",
     ar:"صارت فيينا وبودابست مركزين يهوديّين كبيرين مزدهرين، ونشأ فيهما كتّاب وأطبّاء وصحفيّون يهود كثر.",
     ru:"Вена и Будапешт стали крупными и процветающими еврейскими центрами, где выросло множество еврейских писателей, врачей и журналистов.",
     en:"Vienna and Budapest became large and flourishing Jewish centres, where many Jewish writers, doctors and journalists came up."}),
  E(1870,
    {he:"פתיחת גטו רומא",ar:"فتح غيتو روما",ru:"Открытие римского гетто",en:"The opening of the Roman ghetto"},
    {he:"עם סיפוח רומא לממלכת איטליה בוטלו חומות הגטו האחרון באירופה המערבית, ויהודי רומא קיבלו אזרחות שווה.",
     ar:"مع ضمّ روما إلى مملكة إيطاليا أُزيلت أسوار آخر غيتو في غرب أوروبا، ونال يهود روما مواطنة متساوية.",
     ru:"С присоединением Рима к Итальянскому королевству были снесены стены последнего гетто в Западной Европе, и евреи Рима получили равное гражданство.",
     en:"With the annexation of Rome to the kingdom of Italy the walls of the last ghetto in Western Europe came down, and the Jews of Rome received equal citizenship."},
    {he:"האפיפיור שלט ברומא עד אז ושמר על הגטו, ואילו ממלכת איטליה החדשה נשענה על עקרונות אזרחיים.",
     ar:"حكم البابا روما حتى ذلك الحين وحافظ على الغيتو، بينما قامت مملكة إيطاليا الجديدة على مبادئ مدنيّة.",
     ru:"До того Римом правил папа и сохранял гетто, а новое Итальянское королевство опиралось на гражданские начала.",
     en:"The pope had ruled Rome until then and kept the ghetto, while the new kingdom of Italy rested on civil principles."},
    {he:"הגטו שהוקם בוונציה שלוש מאות וחמישים שנה קודם לכן נעלם מאירופה המערבית — עד שהנאצים החזירו אותו.",
     ar:"اختفى الغيتو الذي أُقيم في البندقية قبل ثلاثمئة وخمسين سنة من غرب أوروبا — حتى أعاده النازيون.",
     ru:"Гетто, возникшее в Венеции тремястами пятьюдесятью годами ранее, исчезло из Западной Европы — пока его не вернули нацисты.",
     en:"The ghetto that had begun in Venice three hundred and fifty years earlier vanished from Western Europe — until the Nazis brought it back."}),
  C({he:"התנועה הרפורמית",ar:"الحركة الإصلاحية اليهودية",ru:"Реформистское движение",en:"The Reform movement"},
    {he:"זרם ביהדות שקיצר את התפילה, הכניס לה את שפת המדינה ואת העוגב, וראה בתורה מסמך המשתנה עם הזמן.",
     ar:"تيّار في اليهودية اختصر الصلاة، وأدخل إليها لغة الدولة والأرغن، ورأى في التوراة نصًّا يتغيّر مع الزمن.",
     ru:"Течение в иудаизме, сократившее молитву, введшее в неё язык страны и орган и видевшее в Торе документ, меняющийся со временем.",
     en:"A stream in Judaism that shortened the prayer service, brought into it the language of the country and the organ, and saw the Torah as a document that changes with time."})
]);
more("emancip",2,[
  E(1827,
    {he:"גזרת הקנטוניסטים",ar:"مرسوم الكانتونيين",ru:"Указ о кантонистах",en:"The Cantonist decree"},
    {he:"רוסיה חייבה את הקהילות היהודיות למסור ילדים לשירות צבאי ארוך, ורבים מהם הוטבלו לנצרות בכפייה.",
     ar:"ألزمت روسيا الجماعات اليهودية بتسليم أطفال لخدمة عسكرية طويلة، وعُمّد كثيرون منهم قسرًا.",
     ru:"Россия обязала еврейские общины сдавать детей на долгую военную службу, и многих из них насильно крестили.",
     en:"Russia required the Jewish communities to hand over children for long military service, and many of them were baptised by force."},
    {he:"הצאר ראה בצבא כלי להתכת מיעוטים לתוך העם הרוסי, וסבר שילד שגדל במחנה ינתק מקהילתו.",
     ar:"رأى القيصر في الجيش أداة لصهر الأقلّيات في الشعب الروسي، ورأى أن طفلًا ينشأ في المعسكر ينفصل عن جماعته.",
     ru:"Царь видел в армии средство переплавить меньшинства в русский народ и полагал, что выросший в лагере ребёнок оторвётся от общины.",
     en:"The tsar saw the army as a means of melting minorities into the Russian people, and held that a child raised in camp would be cut off from his community."},
    {he:"הגזרה קרעה את הקהילות מבפנים, שכן פרנסיהן נאלצו לבחור אילו ילדים יימסרו — ובדרך כלל נלקחו בני העניים.",
     ar:"مزّق المرسوم الجماعات من داخلها، إذ اضطُرّ وجهاؤها إلى اختيار الأطفال الذين يُسلَّمون — وغالبًا أُخذ أبناء الفقراء.",
     ru:"Указ разрывал общины изнутри: их старшинам приходилось выбирать, каких детей отдать, — и обычно брали детей бедняков.",
     en:"The decree tore the communities apart from within, since their leaders had to choose which children to give up — and it was usually the children of the poor who were taken."}),
  E(1840,
    {he:"עלילת דמשק",ar:"افتراء دمشق",ru:"Дамасское дело",en:"The Damascus affair"},
    {he:"נכבדי הקהילה היהודית בדמשק נעצרו ועונו באשמת רצח נזיר לצורכי פולחן, ורבים מהם מתו בכלא.",
     ar:"اعتُقل وجهاء الجماعة اليهودية في دمشق وعُذّبوا بتهمة قتل راهب لطقوس، ومات كثيرون منهم في السجن.",
     ru:"Знатных членов еврейской общины Дамаска арестовали и пытали по обвинению в убийстве монаха для обряда, и многие умерли в тюрьме.",
     en:"Leading members of the Jewish community of Damascus were arrested and tortured on a charge of killing a monk for a ritual, and many of them died in prison."},
    {he:"נזיר איטלקי נעלם, והקונסול הצרפתי אימץ את עלילת הדם וסייע לחוקרים במקום לעצור אותם.",
     ar:"اختفى راهب إيطالي، وتبنّى القنصل الفرنسي افتراء الدم وساعد المحقّقين بدل أن يوقفهم.",
     ru:"Пропал итальянский монах, и французский консул принял кровавый навет и помогал следователям, вместо того чтобы их остановить.",
     en:"An Italian monk disappeared, and the French consul took up the blood libel and helped the investigators instead of stopping them."},
    {he:"יהודי מערב אירופה התארגנו לראשונה למען יהודים בארץ אחרת, וכך נולדה פעילות ההגנה היהודית הבינלאומית.",
     ar:"تنظّم يهود غرب أوروبا لأوّل مرّة من أجل يهود في بلد آخر، وهكذا وُلد نشاط الدفاع اليهودي الدولي.",
     ru:"Евреи Западной Европы впервые организовались ради евреев в другой стране — так родилась международная еврейская правозащита.",
     en:"The Jews of Western Europe organised for the first time on behalf of Jews in another country, and so international Jewish advocacy was born."}),
  E(1860,
    {he:"הקמת כל ישראל חברים",ar:"تأسيس الأليانس",ru:"Основание «Альянса»",en:"The founding of the Alliance Israélite Universelle"},
    {he:"יהודי צרפת הקימו ארגון שיגן על יהודים נרדפים בכל העולם ויקים בשבילם בתי ספר מודרניים.",
     ar:"أسّس يهود فرنسا منظّمة تدافع عن اليهود المضطهدين في العالم وتنشئ لهم مدارس حديثة.",
     ru:"Евреи Франции создали организацию для защиты преследуемых евреев по всему миру и открытия для них современных школ.",
     en:"The Jews of France founded an organisation to defend persecuted Jews around the world and to open modern schools for them."},
    {he:"עלילת דמשק ופרשות דומות הראו שיהודים במזרח חסרי הגנה, ויהודי המערב חשו אחריות כלפיהם.",
     ar:"أظهر افتراء دمشق وقضايا مشابهة أن يهود الشرق بلا حماية، وشعر يهود الغرب بمسؤولية تجاههم.",
     ru:"Дамасское дело и подобные истории показали, что евреи Востока беззащитны, и западные евреи почувствовали за них ответственность.",
     en:"The Damascus affair and cases like it showed that the Jews of the East were without protection, and the Jews of the West felt responsible for them."},
    {he:"נפתחה רשת בתי ספר בצפון אפריקה ובמזרח התיכון, ובהם למדו בנים ובנות צרפתית ומקצוע לצד לימודי קודש.",
     ar:"افتُتحت شبكة مدارس في شمال أفريقيا والشرق الأوسط، تعلّم فيها بنون وبنات الفرنسية ومهنة إلى جانب العلوم الدينية.",
     ru:"Открылась сеть школ в Северной Африке и на Ближнем Востоке, где мальчики и девочки учили французский и ремесло наряду с религиозными предметами.",
     en:"A network of schools opened in North Africa and the Middle East, where boys and girls learned French and a trade alongside religious studies."}),
  C({he:"תחום המושב",ar:"منطقة الاستيطان المحدّدة",ru:"Черта оседлости",en:"The Pale of Settlement"},
    {he:"האזור המערבי של האימפריה הרוסית שרק בו הותר ליהודים לגור, ומחוצה לו נדרש היתר מיוחד.",
     ar:"المنطقة الغربية من الإمبراطورية الروسية التي أُبيح لليهود السكن فيها وحدها، وخارجها لزم إذن خاصّ.",
     ru:"Западная область Российской империи, единственная, где евреям разрешалось жить; за её пределами требовалось особое разрешение.",
     en:"The western region of the Russian empire, the only place Jews were allowed to live; outside it a special permit was needed."})
]);
more("emancip",3,[
  E(1913,
    {he:"משפט בייליס בקייב",ar:"محاكمة بيليس في كييف",ru:"Дело Бейлиса в Киеве",en:"The Beilis trial in Kiev"},
    {he:"מנחם מנדל בייליס הועמד לדין באשמת רצח ילד נוצרי לצורכי פולחן, וחבר המושבעים זיכה אותו.",
     ar:"حوكم مناحم مندل بيليس بتهمة قتل طفل مسيحي لطقوس، وبرّأته هيئة المحلّفين.",
     ru:"Менахема Менделя Бейлиса судили по обвинению в убийстве христианского ребёнка для обряда, и присяжные его оправдали.",
     en:"Menahem Mendel Beilis was tried on a charge of killing a Christian child for a ritual, and the jury acquitted him."},
    {he:"השלטון הרוסי ביקש להוכיח שעלילת הדם אמת, וניהל את התביעה בעצמו אף שהמשטרה ידעה מי הרוצח.",
     ar:"أراد الحكم الروسي إثبات صحّة افتراء الدم، وأدار الادّعاء بنفسه رغم أن الشرطة عرفت القاتل.",

     en:"The Russian government wanted to prove the blood libel true, and ran the prosecution itself although the police knew who the murderer was."},
    {he:"הזיכוי היה ניצחון מוסרי שהדהד בעולם, אך המשפט הראה שמדינה שלמה מוכנה לגייס את בתי הדין נגד מיעוט.",
     ar:"كانت التبرئة انتصارًا أخلاقيًّا تردّد صداه في العالم، لكن المحاكمة أظهرت أن دولة بأكملها مستعدّة لتجنيد محاكمها ضدّ أقلّية.",
     ru:"Оправдание было нравственной победой, отозвавшейся во всём мире, но процесс показал, что целое государство готово поставить суды против меньшинства.",
     en:"The acquittal was a moral victory that echoed around the world, but the trial showed that a whole state was ready to turn its courts against a minority."}),
  C({he:"אוטואמנציפציה",ar:"التحرّر الذاتي",ru:"Автоэмансипация",en:"Auto-emancipation"},
    {he:"הטענה שאין להמתין עד שהעמים יעניקו ליהודים זכויות, ושעליהם לשחרר את עצמם בכוחות עצמם.",
     ar:"الدعوى بألّا يُنتظر أن تمنح الشعوب اليهود حقوقًا، وأن عليهم تحرير أنفسهم بأنفسهم.",
     ru:"Утверждение, что не следует ждать, пока народы даруют евреям права, и что они должны освободить себя сами.",
     en:"The argument that the Jews should not wait for other nations to grant them rights, but must free themselves by their own effort."}),
  C({he:"הפרוטוקולים של זקני ציון",ar:"بروتوكولات حكماء صهيون",ru:"«Протоколы сионских мудрецов»",en:"The Protocols of the Elders of Zion"},
    {he:"זיוף שנכתב ברוסיה וטען לחשוף מזימה יהודית להשתלט על העולם, והופץ בעולם גם אחרי שהוכח כמזויף.",
     ar:"تزوير كُتب في روسيا وادّعى كشف مؤامرة يهودية للسيطرة على العالم، وانتشر في العالم حتى بعد ثبوت تزويره.",
     ru:"Подделка, написанная в России и притязавшая раскрыть еврейский заговор с целью овладеть миром; её распространяли и после того, как подлог был доказан.",
     en:"A forgery written in Russia claiming to expose a Jewish plot to rule the world, and circulated even after it was proved false."}),
  Sc({he:["בעיני החיים אנו מתים, בעיני ילידי הארץ אנו זרים,",
          "בעיני בעלי הרכוש אנו קבצנים, ובעיני העניים אנו מנצלים.",
          "אין לנו מולדת, ולכן אין איש רואה בנו בני בית.",
          "הישועה לא תבוא לנו מידי אחרים; עלינו לקום ולעזור לעצמנו.",
          "מתוך אוטואמנציפציה, יהודה ליב פינסקר, 1882."],
      ar:["في عيون الأحياء نحن أموات، وفي عيون أبناء البلاد نحن غرباء،",
          "وفي عيون أصحاب المال نحن متسوّلون، وفي عيون الفقراء مستغِلّون.",
          "لا وطن لنا، ولذلك لا يرانا أحد من أهل البيت.",
          "لن يأتينا الخلاص من أيدي الآخرين؛ علينا أن ننهض ونعين أنفسنا.",
          "من «التحرّر الذاتي»، يهودا ليف بينسكر، 1882."],
      ru:["В глазах живых мы мертвы, в глазах местных уроженцев мы чужие,",
          "в глазах имущих мы нищие, а в глазах бедных — эксплуататоры.",
          "У нас нет отечества, и потому никто не видит в нас своих.",
          "Спасение не придёт к нам от чужих рук; мы должны подняться и помочь себе сами.",
          "Из «Автоэмансипации», Иехуда Лейб Пинскер, 1882."],
      en:["In the eyes of the living we are dead, in the eyes of the natives we are strangers,",
          "in the eyes of the propertied we are beggars, and in the eyes of the poor we are exploiters.",
          "We have no homeland, and therefore no one sees us as belonging.",
          "Deliverance will not come to us from the hands of others; we must rise and help ourselves.",
          "From Auto-Emancipation, Judah Leib Pinsker, 1882."]},
     [Q({he:"מהי המסקנה שהמחבר מסיק מן התיאור?",ar:"ما الخلاصة التي يستنتجها الكاتب من الوصف؟",ru:"Какой вывод автор делает из своего описания?",en:"What conclusion does the author draw from his description?"},
        {he:"שאין להמתין לחסדי אחרים, ושעל היהודים לפעול בעצמם למען מעמדם.",ar:"ألّا يُنتظر فضل الآخرين، وأن على اليهود العمل بأنفسهم من أجل مكانتهم.",ru:"Что не следует ждать чужой милости и что евреи должны сами действовать ради своего положения.",en:"That they should not wait for the favour of others, and that the Jews must act for their own standing themselves."},
        [{he:"שיש להמשיך ולדרוש מן המדינות שיעניקו ליהודים שוויון.",ar:"أن يواصلوا مطالبة الدول بمنح اليهود المساواة.",ru:"Что нужно и дальше требовать от государств равноправия для евреев.",en:"That they should go on demanding that the states grant the Jews equality."},
         {he:"שההתבוללות המלאה תפתור את מצוקת היהודים.",ar:"أن الانصهار التامّ سيحلّ ضائقة اليهود.",ru:"Что полная ассимиляция решит бедственное положение евреев.",en:"That complete assimilation will solve the Jews' distress."},
         {he:"שיש להמתין לגאולה שתבוא בדרך נס.",ar:"أن يُنتظر خلاص يأتي بمعجزة.",ru:"Что нужно ждать избавления, которое придёт чудом.",en:"That they should wait for a deliverance that will come by a miracle."}]),
      Q({he:"מה מיוחד בסתירות שהמחבר מונה?",ar:"ما الخاصّ في التناقضات التي يعدّدها الكاتب؟",ru:"Что особенного в противоречиях, которые перечисляет автор?",en:"What is striking about the contradictions the author lists?"},
        {he:"היהודים מואשמים בדברים הפוכים בעת ובעונה אחת — סימן שהשנאה אינה תלויה במעשיהם.",ar:"يُتّهم اليهود بأمور متناقضة في آن — دليل على أن الكراهية لا تتعلّق بأفعالهم.",ru:"Евреев обвиняют в противоположных вещах одновременно — знак, что ненависть не зависит от их поступков.",en:"The Jews are accused of opposite things at once — a sign that the hatred does not depend on what they do."},
        [{he:"הסתירות מראות שהיהודים אכן התנהגו באופן שונה בכל מקום.",ar:"تُظهر التناقضات أن اليهود سلكوا فعلًا سلوكًا مختلفًا في كلّ مكان.",ru:"Противоречия показывают, что евреи и правда вели себя по-разному в каждом месте.",en:"The contradictions show that the Jews really did behave differently in each place."},
         {he:"הסתירות מוכיחות שהיהודים לא נרדפו אלא בערים גדולות.",ar:"تثبت التناقضات أن اليهود لم يُضطهدوا إلا في المدن الكبيرة.",ru:"Противоречия доказывают, что евреев преследовали только в больших городах.",en:"The contradictions prove that the Jews were persecuted only in the large cities."},
         {he:"הסתירות נובעות מכך שהמחבר תיאר תקופות שונות זו מזו.",ar:"تنبع التناقضات من أن الكاتب وصف حقبًا مختلفة.",ru:"Противоречия происходят оттого, что автор описывал разные эпохи.",en:"The contradictions arise because the author was describing different periods."}])])
]);

more("coldwar",1,[
  E(1945,
    {he:"ועידת יאלטה",ar:"مؤتمر يالطا",ru:"Ялтинская конференция",en:"The Yalta Conference"},
    {he:"רוזוולט, צ׳רצ׳יל וסטלין נפגשו בחצי האי קרים וקבעו את חלוקת גרמניה ואת סדרי אירופה אחרי המלחמה.",
     ar:"التقى روزفلت وتشرشل وستالين في شبه جزيرة القرم، وحدّدوا تقسيم ألمانيا وترتيبات أوروبا بعد الحرب.",
     ru:"Рузвельт, Черчилль и Сталин встретились в Крыму и определили раздел Германии и устройство Европы после войны.",
     en:"Roosevelt, Churchill and Stalin met in the Crimea and settled the division of Germany and the order of Europe after the war."},
    {he:"הצבא האדום כבר עמד עמוק במזרח אירופה, ולמערב לא היה כוח בשטח שיאזן את נוכחותו.",
     ar:"كان الجيش الأحمر قد توغّل عميقًا في شرق أوروبا، ولم يكن للغرب قوّة على الأرض توازن وجوده.",
     ru:"Красная армия уже стояла глубоко в Восточной Европе, и у Запада не было сил на месте, чтобы уравновесить её присутствие.",
     en:"The Red Army already stood deep in Eastern Europe, and the West had no force on the ground to balance its presence."},
    {he:"סטלין הבטיח בחירות חופשיות במזרח אירופה ולא קיים, וההסכם נזכר מאז כרגע שבו נחתמה חלוקת היבשת.",
     ar:"وعد ستالين بانتخابات حرّة في شرق أوروبا ولم يفِ، ويُذكر الاتفاق منذئذ كلحظة خُتم فيها انقسام القارّة.",
     ru:"Сталин обещал свободные выборы в Восточной Европе и не сдержал слова, и с тех пор соглашение вспоминают как миг, когда раздел континента был скреплён.",
     en:"Stalin promised free elections in Eastern Europe and did not keep his word, and the agreement has since been remembered as the moment the continent's division was sealed."}),
  E(1947,
    {he:"תוכנית מרשל ודוקטרינת טרומן",ar:"مشروع مارشال ومبدأ ترومان",ru:"План Маршалла и доктрина Трумэна",en:"The Marshall Plan and the Truman Doctrine"},
    {he:"ארצות הברית הכריזה שתסייע לכל מדינה המאוימת בהשתלטות קומוניסטית, והזרימה מיליארדים לשיקום אירופה.",
     ar:"أعلنت الولايات المتّحدة أنها ستساعد كلّ دولة مهدّدة بسيطرة شيوعية، وضخّت مليارات لإعمار أوروبا.",
     ru:"США объявили, что помогут любой стране, которой грозит коммунистический захват, и влили миллиарды в восстановление Европы.",
     en:"The United States declared it would aid any country threatened by a communist takeover, and poured billions into rebuilding Europe."},
    {he:"אירופה היתה הרוסה ורעבה, ומפלגות קומוניסטיות צברו כוח בבחירות בצרפת ובאיטליה.",
     ar:"كانت أوروبا مدمّرة جائعة، وجمعت الأحزاب الشيوعية قوّة في انتخابات فرنسا وإيطاليا.",
     ru:"Европа была разрушена и голодала, а коммунистические партии набирали силу на выборах во Франции и Италии.",
     en:"Europe was ruined and hungry, and communist parties were gaining strength in elections in France and Italy."},
    {he:"מערב אירופה שוקמה במהירות וקשרה את עצמה לאמריקה, ומוסקבה אסרה על מדינות המזרח לקבל את הסיוע.",
     ar:"أُعيد إعمار غرب أوروبا سريعًا وربط نفسه بأمريكا، ومنعت موسكو دول الشرق من قبول المساعدة.",
     ru:"Западная Европа быстро восстановилась и связала себя с Америкой, а Москва запретила странам Востока принимать помощь.",
     en:"Western Europe was rebuilt quickly and tied itself to America, while Moscow forbade the countries of the East to accept the aid."}),
  E(1950,
    {he:"מלחמת קוריאה",ar:"الحرب الكورية",ru:"Корейская война",en:"The Korean War"},
    {he:"צפון קוריאה פלשה לדרום, כוח או״ם בהובלת אמריקה נחלץ להגנתו, וסין שלחה מתנדבים לצד השני.",
     ar:"غزت كوريا الشمالية الجنوب، وهبّت قوّة أمميّة بقيادة أمريكا للدفاع عنه، وأرسلت الصين متطوّعين إلى الجهة الأخرى.",
     ru:"Северная Корея вторглась на юг, силы ООН во главе с Америкой встали на его защиту, а Китай послал добровольцев на другую сторону.",
     en:"North Korea invaded the south, a UN force led by America came to its defence, and China sent volunteers to the other side."},
    {he:"קוריאה חולקה בין המעצמות בסוף מלחמת העולם, וכל צד ראה בקו החלוקה גבול זמני שאפשר לבטלו בכוח.",
     ar:"قُسّمت كوريا بين القوى في نهاية الحرب العالمية، ورأى كلّ طرف في خطّ التقسيم حدًّا مؤقّتًا يمكن إلغاؤه بالقوّة.",
     ru:"Корею разделили державы в конце мировой войны, и каждая сторона видела в линии раздела временную границу, которую можно снять силой.",
     en:"Korea had been divided between the powers at the end of the world war, and each side saw the dividing line as a temporary border that force could erase."},
    {he:"שלוש שנות לחימה הסתיימו כמעט באותו קו שממנו החלו, אך המלחמה הקרה הוכיחה שהיא יכולה להיות חמה מחוץ לאירופה.",
     ar:"انتهت ثلاث سنوات من القتال عند الخطّ ذاته تقريبًا الذي بدأت منه، لكن الحرب الباردة أثبتت أنها قد تشتعل خارج أوروبا.",
     ru:"Три года боёв кончились почти на той же линии, с которой начались, но холодная война показала, что вне Европы она может стать горячей.",
     en:"Three years of fighting ended almost on the same line where it began, but the Cold War had shown it could turn hot outside Europe."}),
  C({he:"גוש",ar:"الكتلة الدولية",ru:"Блок",en:"Bloc"},
    {he:"קבוצת מדינות הקשורות למעצמה אחת בברית צבאית, במשטר דומה ובכלכלה משותפת, ואינן חופשיות לפרוש ממנה.",
     ar:"مجموعة دول مرتبطة بقوّة واحدة بحلف عسكري ونظام متشابه واقتصاد مشترك، وليست حرّة في الانسحاب منها.",
     ru:"Группа государств, связанных с одной державой военным союзом, сходным строем и общим хозяйством и не вольных из него выйти.",
     en:"A group of states tied to one great power by a military alliance, a similar system of government and a shared economy, and not free to leave it."})
]);
more("coldwar",2,[
  E(1956,
    {he:"המרד בהונגריה",ar:"الانتفاضة في المجر",ru:"Восстание в Венгрии",en:"The Hungarian uprising"},
    {he:"הונגרים יצאו לרחובות, הקימו ממשלה שהכריזה על יציאה מברית ורשה, וטנקים סובייטיים דיכאו את המרד בדם.",
     ar:"خرج المجريّون إلى الشوارع، وأقاموا حكومة أعلنت الخروج من حلف وارسو، وقمعت الدبّابات السوفيتية الانتفاضة بالدم.",
     ru:"Венгры вышли на улицы, создали правительство, объявившее о выходе из Варшавского договора, и советские танки утопили восстание в крови.",
     en:"Hungarians came out into the streets, set up a government that declared it was leaving the Warsaw Pact, and Soviet tanks crushed the rising in blood."},
    {he:"מנהיג ברית המועצות גינה את פשעי סטלין באותה שנה, ורבים במזרח הבינו זאת כאות שאפשר לדרוש שינוי.",
     ar:"شجب زعيم الاتحاد السوفيتي جرائم ستالين في تلك السنة، وفهم كثيرون في الشرق ذلك إشارةً إلى إمكان المطالبة بالتغيير.",
     ru:"Вождь Советского Союза в том же году осудил преступления Сталина, и многие на Востоке поняли это как знак, что перемен можно требовать.",
     en:"The Soviet leader had denounced Stalin's crimes that same year, and many in the East took it as a sign that change could be demanded."},
    {he:"התברר שגבולות הגוש נשמרים בכוח, והמערב לא התערב — כי התערבות פירושה מלחמה בין מעצמות גרעיניות.",
     ar:"تبيّن أن حدود الكتلة تُحفظ بالقوّة، ولم يتدخّل الغرب — لأن التدخّل يعني حربًا بين قوى نووية.",
     ru:"Стало ясно, что границы блока держатся силой, а Запад не вмешался — ибо вмешательство означало войну ядерных держав.",
     en:"It became clear that the bloc's borders were held by force, and the West did not intervene — because intervention meant war between nuclear powers."}),
  E(1957,
    {he:"שיגור הספוטניק",ar:"إطلاق سبوتنيك",ru:"Запуск спутника",en:"The launch of Sputnik"},
    {he:"ברית המועצות שיגרה לחלל את הלוויין המלאכותי הראשון, וצפצופיו נקלטו במקלטי רדיו בכל העולם.",
     ar:"أطلق الاتحاد السوفيتي إلى الفضاء أوّل قمر صناعي، والتُقطت أصواته في أجهزة الراديو حول العالم.",
     ru:"Советский Союз запустил в космос первый искусственный спутник, и его сигналы ловили радиоприёмники по всему миру.",
     en:"The Soviet Union launched the first artificial satellite into space, and its beeps were picked up on radio sets all over the world."},
    {he:"שתי המעצמות פיתחו טילים בין יבשתיים לנשיאת פצצות, ואותו טיל שנושא לוויין יכול לשאת גם ראש נפץ.",

/* ============================================================
   8. מנוע התרגילים
   ------------------------------------------------------------
   כלל אחד מנחה את כל הבנייה כאן: מסיח חייב להיות מסיח *סביר*.
   ארבע אפשרויות אקראיות מלמדות לנחש לפי אורך המשפט. ארבע
   אפשרויות מאותה תקופה מכריחות באמת לדעת, וזו כל התועלת.
   ============================================================ */
function itemId(tid,lv,i){return tid+"|"+lv+"|"+i}
function itemRec(id){
  if(!state.item[id])state.item[id]={n:0,ok:0};
  return state.item[id];
}
/* בחירת פריט: קודם מה שעוד לא נראה, אחר כך מה שנכשל, ורק בסוף
   מה שכבר נשלט. חזרה מרווחת פשוטה, בלי שעון ובלי נוסחה. */
function chooseIndex(tid,lv,pool,avoid){
  var cand=[],i,w;
  for(i=0;i<pool.length;i++){
    if(avoid!==undefined&&i===avoid&&pool.length>1)continue;
    var r=state.item[itemId(tid,lv,i)];
    if(!r||!r.n)w=6;                            /* חדש */
    else if(r.ok<r.n)w=1+Math.min(4,r.n-r.ok);  /* נכשל בעבר */
    else w=1;                                   /* נשלט */
    for(var j=0;j<w;j++)cand.push(i);
  }
  if(!cand.length)return 0;
  return pick(cand);
}
function poolOf(tp,lv){return (tp.L[lv-1]||tp.L[0]||[])}

/* שנה לתצוגה. שנה שלילית היא לפני הספירה, וזה נכתב במילים ולא
   במינוס — תלמיד שרואה "−450" לא יודע שמדובר בשנה. */
function yr(y){
  if(y<0)return String(-y)+" "+t("bce");
  if(y<1000)return String(y)+" "+t("ce");
  return String(y);
}
/* המאה של שנה. שנת 1789 היא המאה ה-18, ושנת 100 היא המאה ה-1. */
function centuryOf(y){
  var a=Math.abs(y);
  return Math.floor((a-1)/100)+1;
}
function centuryStr(y){
  return t("century")+" "+_rom(centuryOf(y))+(y<0?" "+t("bce"):"");
}
var ROM=["","I","II","III","IV","V","VI","VII","VIII","IX","X",
         "XI","XII","XIII","XIV","XV","XVI","XVII","XVIII","XIX","XX","XXI"];
function _rom(n){return ROM[n]||String(n)}
/* ------------------------------------------------------------
   שתי שכבות ניקוי להקראה בלבד. המסך אינו משתנה מהן.

   הספרה הרומית נראית נכון על המסך ונשמעת רע באוזן: קול עברי או
   ערבי מוסר "XVIII" כאותיות לטיניות ולא כמספר. ההשוואה היא מול
   ROM עצמו ולא מול תבנית, כדי שמילה לטינית בשם נושא לא תהפוך
   בטעות למספר.

   והגרשיים העבריים משמשים כאן לשני דברים: ראשי תיבות (לפנה״ס,
   או״ם) ומירכאות (״אדם חופשי״). המנוע מכיר רק את הראשון. הכלל
   שמפריד ביניהם: בראשי תיבות באה אחרי הגרשיים אות עברית אחת
   בדיוק וסוף מילה. הסיכון א-סימטרי — מירכאה שהוסרה אינה יכולה
   להזיק, מירכאה שנשארה כן.
   ------------------------------------------------------------ */
function saySpell(x){
  return String(x==null?"":x).replace(/[IVXLC]+/g,function(m){
    var i=ROM.indexOf(m);
    return i>0?String(i):m;
  }).replace(/״/g,function(m,i,str){
    return /^[\u05D0-\u05EA](?![\u05D0-\u05EA])/.test(str.slice(i+1))?m:"";
  }).replace(/\s—\s/g,", ");
}

/* כל האירועים מכל התוכן — משם נלקחים מסיחים כשהנושא עצמו קטן מדי,
   וגם תרגיל הסדר הכרונולוגי בין תקופות. */
var ALL_EV=null;
function allEvents(){
  if(ALL_EV)return ALL_EV;
  ALL_EV=[];
  TOPICS.forEach(function(tp){tp.L.forEach(function(lvl){
    lvl.forEach(function(it){if(it.k==="e")ALL_EV.push(it)})})});
  return ALL_EV;
}
var ALL_CON=null;
function allConcepts(){
  if(ALL_CON)return ALL_CON;
  ALL_CON=[];
  TOPICS.forEach(function(tp){tp.L.forEach(function(lvl){
    lvl.forEach(function(it){if(it.k==="c")ALL_CON.push(it)})})});
  return ALL_CON;
}
/* אירועים אחרים לפי קרבה בזמן. מסיח מאותה מאה הוא מסיח אמיתי;
   מסיח במרחק אלף שנה נפסל לפי התאריך ולא לפי הידע. */
function nearEvents(it,pool,n){
  var mine=pool.filter(function(x){return x.k==="e"&&x!==it});
  var rest=allEvents().filter(function(x){return x!==it&&mine.indexOf(x)<0});
  rest.sort(function(a,b){return Math.abs(a.y-it.y)-Math.abs(b.y-it.y)});
  return shuffle(mine).concat(rest).slice(0,Math.max(n,0));
}
function O(html,ok,why){return {h:html,ok:!!ok,why:why||""}}

/* בונה ארבע אפשרויות משדה אחד של פריט, ומוודא שאין שתיים זהות.
   שני אירועים יכולים לחלוק תוצאה מנוסחת דומה, ואז השאלה נשארת
   בלי תשובה יחידה — לכן הסינון כאן ולא בתצוגה.
   מועמד שנפסל מוחלף במועמד הבא ואינו מנוכה ממספר האפשרויות:
   שאלה עם שלוש אפשרויות היא ניחוש של אחד משלושה. אם גם רשימה
   רחבה לא הספיקה לארבע — מחזירים null, והקורא נופל לצורה אחרת
   במקום להציג שאלה חלשה יותר. */
function optsFromField(it,cands,field,n){
  var seen={},opts=[],own=gl(it[field]);
  if(!own)return null;
  seen[own]=1;
  opts.push(O(esc(own),true));
  for(var i=0;i<cands.length&&opts.length<n;i++){
    var v=gl(cands[i][field]);
    if(!v||seen[v])continue;
    seen[v]=1;
    opts.push(O(esc(v),false,evLabel(cands[i])));
  }
  return opts.length>=n?shuffle(opts):null;
}
function evLabel(x){
  if(x.k==="e")return gl(x.t)+" · "+yr(x.y);
  if(x.k==="c")return gl(x.t);
  return "";
}

/* --- צורה 1: מתי --- */
function formWhen(tp,lv,pool,idx){
  var it=pool[idx];
  var cands=nearEvents(it,pool,12);
  var seen={},opts=[O(esc(yr(it.y)),true)],i;
  seen[yr(it.y)]=1;
  for(i=0;i<cands.length&&opts.length<4;i++){
    var v=yr(cands[i].y);
    if(seen[v])continue; seen[v]=1;
    opts.push(O(esc(v),false,evLabel(cands[i])));
  }
  /* אם התקופה דלילה, מוסיפים הזזות סבירות ולא מספרים אקראיים */
  var off=shuffle([-200,-100,-50,-30,30,50,100,200]);
  for(i=0;i<off.length&&opts.length<4;i++){
    var y2=it.y+off[i];
    if(y2===0)continue;
    var s2=yr(y2);
    if(seen[s2])continue; seen[s2]=1;
    opts.push(O(esc(s2),false,""));
  }
  return {type:"fact",prompt:t("qWhen"),lead:gl(it.t),
    opts:shuffle(opts),answer:yr(it.y),
    /* השנה היא התשובה, ולכן היא חייבת להיאמר. קודם נאמרו רק
       הכותרת והתיאור — כלומר הכול חוץ ממה שנשאל. */
    say:gl(it.t)+", "+yr(it.y)+". "+gl(it.w),reveal:it};
}
/* --- צורה 2: מה קרה --- */
function formWhat(tp,lv,pool,idx){
  var it=pool[idx];
  var opts=optsFromField(it,nearEvents(it,pool,28),"w",4);
  if(!opts)return formWhen(tp,lv,pool,idx);
  return {type:"fact",prompt:t("qWhat"),lead:gl(it.t)+" · "+yr(it.y),
    opts:opts,answer:gl(it.w),say:gl(it.t)+". "+gl(it.w),reveal:it};
}
/* --- צורה 3: על איזה אירוע מדובר --- */
function formName(tp,lv,pool,idx){
  var it=pool[idx];
  var opts=optsFromField(it,nearEvents(it,pool,28),"t",4);
  if(!opts)return formWhen(tp,lv,pool,idx);
  return {type:"fact",prompt:t("qName"),lead:gl(it.w),
    opts:opts,answer:gl(it.t),
    /* שם האירוע הוא התשובה. בלעדיו נשמע רק התיאור שכבר הופיע בשאלה. */
    say:gl(it.t)+". "+gl(it.w),reveal:it};
}
/* --- צורה 4: סיבה --- */
function formWhy(tp,lv,pool,idx){
  var it=pool[idx];
  var opts=optsFromField(it,nearEvents(it,pool,28),"c",4);
  if(!opts)return formWhat(tp,lv,pool,idx);
  return {type:"fact",prompt:t("qWhy"),lead:gl(it.t)+" · "+yr(it.y),
    opts:opts,answer:gl(it.c),say:gl(it.t)+". "+gl(it.c),reveal:it};
}
/* --- צורה 5: תוצאה --- */
function formEff(tp,lv,pool,idx){
  var it=pool[idx];
  var opts=optsFromField(it,nearEvents(it,pool,28),"e",4);
  if(!opts)return formWhat(tp,lv,pool,idx);
  return {type:"fact",prompt:t("qEff"),lead:gl(it.t)+" · "+yr(it.y),
    opts:opts,answer:gl(it.e),say:gl(it.t)+". "+gl(it.e),reveal:it};
}
/* --- צורה 6: מה קרה קודם --- */
function formFirst(tp,lv,pool,idx){
  var it=pool[idx];
  /* שנים חוזרות הופכות את השאלה לחסרת תשובה יחידה, וכך גם שני
     אירועים שכותרתם מנוסחת אותו דבר. קודם נבחרו שלושה מועמדים
     ורק אחר כך נפסלו הכפולים — ומי שנפסל פשוט נעלם, כך שהשאלה
     הוצגה עם שלוש אפשרויות. כאן עוברים על רשימה רחבה ומקבלים
     מועמד רק אם הוא מוסיף שנה חדשה, עד שיש ארבעה.
     שנים־עשר הקרובים בזמן מעורבבים ומשמשים ראשונים — מסיח מאותה
     תקופה נפסל לפי הידע ולא לפי התאריך; השאר ממשיכים אחריהם
     לפי קרבה בזמן, רק אם צריך. */
  var all=nearEvents(it,pool,40).filter(function(x){return x.y!==it.y});
  var cands=shuffle(all.slice(0,12)).concat(all.slice(12));
  var seenY={},seenT={},uniq=[it],i,x,xt;
  seenY[it.y]=1; seenT[gl(it.t)]=1;
  for(i=0;i<cands.length&&uniq.length<4;i++){
    x=cands[i]; xt=gl(x.t);
    if(seenY[x.y]||!xt||seenT[xt])continue;
    seenY[x.y]=1; seenT[xt]=1; uniq.push(x);
  }
  if(uniq.length<4)return formWhen(tp,lv,pool,idx);
  var first=uniq.slice().sort(function(a,b){return a.y-b.y})[0];
  var opts=uniq.map(function(x){
    return O(esc(gl(x.t)),x===first,x===first?"":gl(x.t)+" · "+yr(x.y));
  });
  return {type:"fact",prompt:t("qFirst"),lead:"",
    opts:shuffle(opts),answer:gl(first.t),
    say:gl(first.t)+". "+yr(first.y),reveal:first};
}
/* --- צורה 7: מושג --- */
function formTerm(tp,lv,pool,idx){
  var it=pool[idx];
  var cands=shuffle(pool.filter(function(x){return x.k==="c"&&x!==it}))
    .concat(shuffle(allConcepts().filter(function(x){return x!==it})));
  var opts=optsFromField(it,cands,"d",4);
  if(!opts)return null;
  return {type:"fact",prompt:t("qTerm"),lead:gl(it.t),
    opts:opts,answer:gl(it.d),say:gl(it.t)+". "+gl(it.d),reveal:it};
}
/* --- צורה 8: מקור --- */
function formSrc(tp,lv,pool,idx){
  var it=pool[idx];
  var qq=pick(it.qs);
  var opts=[O(esc(gl(qq.a)),true)],ys=qq.y||[];
  /* לכל מסיח יש נימוק משלו: מה בדיוק במקור סותר אותו. y||[] שומר
     על קריאות Q ישנות שעדיין אין בהן נימוקים. */
  qq.w.forEach(function(x,i){opts.push(O(esc(gl(x)),false,ys[i]?gl(ys[i]):""))});
  return {type:"src",prompt:t("qRead"),passage:it,qtext:gl(qq.q),
    opts:shuffle(opts),answer:gl(qq.a),
    /* הקטע עצמו כבר מוקרא בכפתור נפרד מעל הפסקה. אחרי המענה
       מה שצריך להישמע הוא השאלה והתשובה עליה. */
    say:gl(qq.q)+" "+gl(qq.a),reveal:null};
}

/* בוחר את צורת התרגיל. הרמה קובעת מה נשאל: ברמה 1 האירוע עצמו,
   ברמה 2 הקשר שבין אירועים, וברמה 3 מקור ומושג. */
/* הרמז נותן תכונה אחרת מזו שנשאלה: לשאלת שנה — המאה, ולשאלה על
   טקסט — השנה. הוא נגזר מהשאלה שחזרה בפועל ולא מהצורה שביקשנו,
   כי formName נופלת חזרה ל-formWhen כשאין די מסיחים — ורמז לפי
   הצורה המבוקשת היה מוסר שם את התשובה. */
function hintFor(q,tp){
  if(!q)return "";
  if(q.type==="src")return t("hintSrcL");
  if(q.prompt===t("qFirst"))return t("hintOrderL");
  var it=q.reveal;
  if(!it||typeof it.y!=="number")return t("hintTopicL")+": "+tName(tp);
  if(q.answer===yr(it.y))return centuryStr(it.y);
  return t("hintYearL")+": "+yr(it.y);
}
function buildQuestion(tid,lv,avoid){
  var tp=topicOf(tid); if(!tp)return null;
  var pool=poolOf(tp,lv);
  if(!pool.length)return null;
  var idx=chooseIndex(tid,lv,pool,avoid);
  var it=pool[idx],q=null,f;
  if(it.k==="p")q=formSrc(tp,lv,pool,idx);
  else if(it.k==="c")q=formTerm(tp,lv,pool,idx);
  else {
    var forms=lv===1?["when","what","name"]
             :lv===2?["why","eff","first","what"]
                    :["why","eff","first","when","name"];
    f=pick(forms);
    q=f==="when"?formWhen(tp,lv,pool,idx)
     :f==="what"?formWhat(tp,lv,pool,idx)
     :f==="name"?formName(tp,lv,pool,idx)
     :f==="why" ?formWhy(tp,lv,pool,idx)
     :f==="eff" ?formEff(tp,lv,pool,idx)
                :formFirst(tp,lv,pool,idx);
  }
  if(!q)q=formWhen(tp,lv,pool,idx);
  q.tid=tid; q.lv=lv; q.idx=idx; q.id=itemId(tid,lv,idx);
  q.hint=hintFor(q,tp);
  return q;
}

/* טקסט נקי מתוך HTML — המסכים משווים ומדווחים תשובות כטקסט. */
function plainOf(h){

function buildQ(tid,lv){

/* ============================================================
   18. מבחן כיתתי — פרסום בוואטסאפ, קבלת תשובות וציונים
   ------------------------------------------------------------
   אין שרת, ואין כוונה שיהיה. לכן המבחן אינו נשלח לשום מקום:
   הוא *נארז לתוך הקישור*. המורה מקבל קישור, שולח אותו בוואטסאפ,
   והמכשיר של התלמיד בונה מהקישור בדיוק את אותן שאלות.

   מה שהופך את זה לאפשרי הוא שכל מחולל שאלות כאן משתמש ב-
   Math.random בלבד. אם מזרעים אותו, אותו זרע מייצר את אותן
   שאלות ואת אותו סדר תשובות — אצל המורה ואצל התלמיד. הקישור
   נושא זרע ורשימת נושאים, לא עשרים שאלות מלאות, ולכן הוא נשאר
   קצר מספיק לוואטסאפ.

   שלוש מגבלות שנאמרות כאן במפורש כי הן חלק מהתכנון:
   · אין איסוף אוטומטי. התלמיד שולח קוד תשובות בוואטסאפ, והמורה
     מדביק אותו. זה המחיר של אפס שרת ואפס עלות.
   · אפשר לזייף קוד. הציון מחושב מחדש אצל המורה מתוך התשובות
     ולא נלקח מהתלמיד, אבל אין כאן הגנה קריפטוגרפית — זה מבחן
     כיתתי מעצב, לא בגרות.
   · שמות התלמידים נשארים במכשיר של המורה. הם לא עוברים דרך
     שום שרת, כי אין שרת.
   ============================================================ */
var GENV=3;                 /* גרסת המחוללים. מבחן שנוצר בגרסה אחרת
                               אינו נפתח — עדיף הודעה ברורה מאשר
                               עשרים שאלות אחרות בשקט. */
var EKEY="shlav-exams-history-v1";   /* מפתח לאפליקציה הזאת בלבד */
var EKEY_OLD="shlav-exams-v1";  /* המפתח המשותף הישן. לקריאה בלבד, לא נמחק. */

/* --- מחולל מזורע. mulberry32: קצר, מהיר, ופיזור טוב דיו --- */
function withSeed(seed,fn){
  var real=Math.random,s=(seed>>>0)||1;
  Math.random=function(){
    s|=0; s=s+0x6D2B79F5|0;
    var t=Math.imul(s^s>>>15,1|s);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
  try{return fn()}finally{Math.random=real}
}
function hash32(str){
  var h=0x811c9dc5,i;
  for(i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193)}
  return (h>>>0);
}
/* base64url. הניקוי בפענוח אינו קוסמטי: וואטסאפ שובר מחרוזות
   ארוכות בשורות, ורווח אחד הורס את כל הקוד. */
function b64e(str){
  var bytes=new TextEncoder().encode(str),bin="",i;
  for(i=0;i<bytes.length;i+=8192)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));
  return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function b64d(s){
  s=String(s||"").replace(/[^A-Za-z0-9\-_]/g,"").replace(/-/g,"+").replace(/_/g,"/");
  while(s.length%4)s+="=";
  var bin=atob(s),bytes=new Uint8Array(bin.length),i;
  for(i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
/* הזרע של המשבצת נכנס למזהה: שני מבחנים באותם נושאים ובאותה
   רמה, שהמורה החליף באחד מהם שאלה, אינם אותו מבחן. מבחן ישן
   שאין לו זרעים מקבל בדיוק את המזהה שקיבל תמיד — אחרת ההגשות
   שכבר נקלטו אליו מתייתמות. */
function examId(spec){return hash32(spec.s+"|"+spec.q.map(function(x){
  return x[0]+x[1]+(x.length>2?"@"+x[2]:"")}).join(",")).toString(36)}
function encodeExam(spec){return b64e(JSON.stringify(spec))}
function decodeExam(code){
  try{
    var o=JSON.parse(b64d(code));
    if(!o||!o.q||!o.q.length||typeof o.s!=="number")return null;
    o.q=o.q.filter(function(x){return topicById(x[0])});
    return o.q.length?o:null;
  }catch(e){return null}
}
/* בונה את שאלות המבחן. אותו זרע → אותן שאלות, גם אצל המורה
   כשהוא בודק וגם אצל התלמיד כשהוא נבחן. */
function examQuestions(spec){
  /* מסננים נושאים שאינם מוכרים לאפליקציה הזאת, בדיוק כמו decodeExam.
     בלי הסינון buildQ מחזיר null על נושא זר, והמסך נופל על
     q.topic של null. עדיף לדלג בשקט מאשר להתרסק. */
  var pairs=(spec.q||[]).filter(function(x){return !!topicById(x[0])});
  /* מבחן שנבנה עם זרע לכל משבצת נבנה משבצת אחרי משבצת, וכל
     שאלה תלויה בזרע שלה בלבד — כך המורה יכול להחליף אחת מהן.
     מבחן ישן, בלי זרעים, חייב להיבנות בדיוק כפי שנבנה ביום
     שנשלח: אחרת הציון של מי שכבר נבחן משתנה למפרע. */
  if(pairs.length&&pairs.every(function(x){return typeof x[2]==="number"}))
    return pairs.map(function(p){return exBuildSlot(p)})
                .filter(function(q){return !!q});
  return withSeed(spec.s,function(){
    return pairs.map(function(pair){return buildQ(pair[0],pair[1])})
                .filter(function(q){return !!q});
  });
}
/* --- בחירת השאלות בידי המורה ---------------------------------
   עד כאן המורה בחר נושאים, רמה ומספר שאלות — והשאלות עצמן הוגרלו
   מאחורי גבו. הוא ראה אותן לראשונה רק אחרי שהמבחן כבר היה אצל
   התלמידים. מעכשיו כל שאלה היא משבצת נפרדת עם זרע משלה: המורה
   רואה אותה לפני השליחה, מחליף אותה בשאלה אחרת מאותו נושא,
   מסיר אותה, או מוסיף שאלה מנושא שחסר לו.

   הזרע הנפרד לכל משבצת הוא מה שמאפשר את זה. בזרם אקראי אחד
   ומשותף, כפי שהיה עד כאן, החלפה של השאלה השלישית הייתה משנה
   גם את הרביעית ואת החמישית — כלומר לא "החלפה" אלא הגרלה מחדש
   של כל מה שאחריה.

   24 ביט ולא 32: הזרע נוסע בתוך הקישור שנשלח בוואטסאפ, וזרע
   קצר יותר הוא קישור קצר יותר. שישה־עשר מיליון אפשרויות למשבצת
   הן הרבה מעבר למה שהמחולל עצמו יודע לייצר. */
function exNewSeed(){return (Math.random()*16777215)>>>0}
function exSlot(topicId,level){return [topicId,level,exNewSeed()]}
/* אותו זרע → אותה שאלה בדיוק: אצל המורה כשהוא בוחר, ואצל
   התלמיד כשהוא נבחן. */
function exBuildSlot(slot){
  if(!slot||!topicById(slot[0]))return null;
  return withSeed(slot[2],function(){return buildQ(slot[0],slot[1])})||null;
}
/* מסך הבנייה מצייר את עצמו מחדש אחרי כל לחיצה, ובניית עשרים
   וחמש שאלות בכל ציור מיותרת. המטמון הוא לתצוגה בלבד — מי
   שנבחן בונה את שאלותיו מחדש, כדי שאיש לא יערוך בטעות אובייקט
   שגם מסך אחר מחזיק בו. */
var EXQCACHE={};
/* לכל אפליקציה מנגנון שפה משלה, ולא לכולן אותם שמות. הפנייה
   דרך window ולא בשם ישיר, כי שם שאינו קיים באפליקציה מסוימת
   הוא שגיאה בעיני הבודקים — רעש שמסתיר שגיאה אמיתית. */
function exLangKey(){
  try{
    var g=(typeof window!=="undefined")?window:{};
    if(typeof g.xlg==="function")return g.xlg();
    if(typeof g.LG==="string")return g.LG;
    return (state&&state.settings&&state.settings.lang)||"he";
  }catch(e){return "he"}
}
function exPreviewQ(slot){
  if(!slot)return null;
  var k=slot[0]+"|"+slot[1]+"|"+slot[2]+"|"+exLangKey();
  if(!(k in EXQCACHE)){
    /* מורה שמחליף שאלות שוב ושוב מייצר מפתח חדש בכל לחיצה.
       מטמון שרק גדל הוא דליפה; מרוקנים אותו ומתחילים מחדש. */
    if(Object.keys(EXQCACHE).length>400)EXQCACHE={};
    EXQCACHE[k]=exBuildSlot(slot);
  }
  return EXQCACHE[k];
}
function exTopicName(id){
  var t=topicById(id); if(!t)return "";
  var g=(typeof window!=="undefined")?window:{};
  return (typeof g.tName==="function"?g.tName(t):t.name)||"";
}
function exRightAnswer(q){
  var i; if(!q||!q.options)return null;
  for(i=0;i<q.options.length;i++)if(q.options[i].ok)return q.options[i];
  return null;
}
/* המשבצות שהמורה עורך. נבנות מחדש רק כשנושא, רמה או מספר
   השאלות משתנים; עריכה של משבצת בודדת נשמרת. */
function exSlots(){
  if(EB.q&&EB.q.length)return EB.q;
  var tops=EB.topics.filter(function(x){return topicById(x)});
  if(!tops.length)tops=topicsForTrack(state.track).slice(0,3).map(function(t){return t.id});
  var q=[],i;
  for(i=0;i<EB.n;i++)q.push(exSlot(tops[i%tops.length],EB.level));
  /* מערבבים כאן ולא בשליחה: המורה רואה את הסדר הסופי ומאשר אותו. */
  EB.q=shuffle(q);
  return EB.q;
}
function examUrl(spec){
  var base=location.origin+location.pathname;

}
/* wa.me מקבל רק מספר בינלאומי בלי אפס מוביל. מורה שהקליד 050-8554380
   כמו שמקלידים בטלפון קיבל אצל התלמיד "לא ניתן לבדוק את מספר הטלפון…
   חסרה קידומת חיוג", והתשובות לא נשלחו. אפס מוביל הוא מספר ישראלי
   מקומי ומקבל 972; "00" בהתחלה הוא קידומת בינלאומית ונופל; מספר
   שכבר מתחיל בקידומת מדינה נשאר כפי שהוא. */
function waLink(text,phone){
  var p=String(phone||"").replace(/[^0-9]/g,"");
  if(p.indexOf("00")===0)p=p.slice(2);
  else if(p.charAt(0)==="0")p="972"+p.slice(1);
  return "https://wa.me/"+p+"?text="+encodeURIComponent(text);
}

var EX={list:[]};
/* --- הגירה מהמפתח המשותף הישן ---------------------------------
   עד הגרסה הזאת כל האפליקציות כתבו מבחנים לאותו מפתח localStorage
   ובאותו origin, ולכן מבחן שנבנה במתמטיקה הופיע ברשימת המבחנים של
   אנגלית והפיל את המסך. מעכשיו לכל אפליקציה מפתח משלה, ובטעינה
   מועתקות מהמפתח הישן רק רשומות שכל נושאיהן מוכרים כאן.
   המפתח הישן נשאר על כנו ואינו נמחק, כדי שגם אפליקציה אחרת תוכל
   לקלוט ממנו את המבחנים ששייכים לה. --------------------------- */
function exSpecKnown(spec){
  if(!spec||!spec.q||!spec.q.length)return false;
  for(var i=0;i<spec.q.length;i++){
    var pair=spec.q[i];
    if(!pair||!topicById(pair[0]))return false;
  }
  return true;
}
function exAdoptLegacy(){
  var added=0;
  try{
    var raw=localStorage.getItem(EKEY_OLD); if(!raw)return;
    var old=JSON.parse(raw); if(!old||!old.list||!old.list.length)return;
    var have={},i,ex;
    for(i=0;i<EX.list.length;i++)have[EX.list[i].id]=1;
    for(i=0;i<old.list.length;i++){
      ex=old.list[i];
      if(!ex||!ex.id||have[ex.id])continue;
      if(!exSpecKnown(ex.spec))continue;
      EX.list.push(ex); have[ex.id]=1; added++;
    }
  }catch(e){return}
  if(added)exSave();
}
function exLoad(){
  try{var r=localStorage.getItem(EKEY);if(r){var o=JSON.parse(r);if(o&&o.list)EX=o}}catch(e){}
  if(!EX.list)EX.list=[];
  exAdoptLegacy();
}
function exSave(){try{localStorage.setItem(EKEY,JSON.stringify(EX))}catch(e){}}
function exFind(id){for(var i=0;i<EX.list.length;i++)if(EX.list[i].id===id)return EX.list[i];return null}

/* --- קוד ההגשה של התלמיד --- */
function encodeResult(id,name,answers){
  var body={i:id,n:String(name||"").slice(0,40),a:answers,d:todayIso()};
  body.c=hash32(JSON.stringify([body.i,body.n,body.a])).toString(36);
  return b64e(JSON.stringify(body));
}
function decodeResult(code){
  try{
    var o=JSON.parse(b64d(code));
    if(!o||!o.i||!o.a||!o.a.length)return null;
    o.ok=(o.c===hash32(JSON.stringify([o.i,o.n,o.a])).toString(36));
    return o;
  }catch(e){return null}
}
/* הציון מחושב כאן מחדש מתוך התשובות. מה שהתלמיד שלח הוא מה
   שסימן, לא כמה הוא קיבל. */
function gradeResult(spec,res){
  var qs=examQuestions(spec),per=[],ok=0,i,q,a;
  for(i=0;i<qs.length;i++){
    q=qs[i]; a=res.a[i];
    var right=(a>=0&&q.options[a]&&q.options[a].ok)?1:0;
    if(right)ok++;
    per.push({topic:q.topic,topicName:q.topicName,ok:right,
              picked:(a>=0&&q.options[a])?q.options[a].t:"—",
              answer:(q.options.filter(function(o){return o.ok})[0]||{}).t||""});
  }
  return {ok:ok,n:qs.length,pct:Math.round(100*ok/qs.length),per:per};
}

function xlg(){return state.lang||"he"}
function xt(k){var d=XT[xlg()];var v=d&&d[k];return v===undefined?(XK[k]===undefined?k:XK[k]):v}
/* {0} ו-{1} — סדר המילים משתנה בין השפות, ולכן מספרים ולא רצף */
function xf(k){var s=xt(k),a=arguments,i;
  for(i=1;i<a.length;i++)s=s.split("{"+(i-1)+"}").join(String(a[i]));
  return s}

function viewLocked(){
  return '<div class="wrap" style="padding-block:40px;max-width:32rem">'+
    '<div class="card pad"><h1 class="h1">'+esc(xt("teTitle"))+'</h1>'+
    '<p class="sub">'+esc(xt("teLocked"))+'</p>'+
    '<div class="row" style="margin-top:14px">'+
    '<button class="btn btn-p" data-a="teask">'+esc(xt("teUnlock"))+'</button></div></div></div>';
}
/* השאלות עצמן, על המסך של המורה, לפני שהמבחן נשלח. */
function viewExamSlots(){
  var ls=exSlots(),h="",tops=EB.topics.filter(function(x){return topicById(x)});
  h+='<div style="margin-top:18px"><b>'+esc(xt("exQs"))+'</b>'+
     '<p class="sub" style="margin:4px 0 8px">'+esc(xt("exQsNote"))+'</p>';
  h+='<div class="row" style="margin:0 0 10px">'+
     '<button class="xq-b" data-a="exqans" aria-pressed="'+(EB.ans?"true":"false")+'">'+
     (EB.ans?esc(xt("exQsHide")):esc(xt("exQsShow")))+'</button>'+
     '<button class="xq-b" data-a="exqreset">'+esc(xt("exQsReset"))+'</button></div>';
  h+='<ol class="xq-list">';
  ls.forEach(function(sl,i){
    var q=exPreviewQ(sl),ok=exRightAnswer(q);
    h+='<li class="xq"><div class="xq-top">'+
       '<span class="xq-n">'+(i+1)+'</span>'+
       '<span class="xq-tp">'+esc(q&&q.topicName?q.topicName:exTopicName(sl[0]))+'</span>'+
       '<span class="xq-acts">'+
       '<button class="xq-b" data-a="exqroll" data-i="'+i+'">'+esc(xt("exQsSwap"))+'</button>'+
       /* המבחן חייב להישאר עם שאלה אחת לפחות, ולכן הכפתור נעלם
          ולא מוצג כבוי: כפתור שאי אפשר ללחוץ עליו מבלבל. */
       (ls.length>1?'<button class="xq-b" data-a="exqdel" data-i="'+i+'">'+esc(xt("exQsDrop"))+'</button>':"")+
       '</span></div>';
    if(q){
      h+='<div class="xq-q">'+q.ask+(q.expr?'<div class="xq-e">'+q.expr+'</div>':"")+'</div>';
      if(EB.ans&&ok)h+='<div class="xq-a"><b>'+esc(xt("exQsAns"))+'</b> '+ok.h+'</div>';
    }else h+='<div class="xq-q sub">'+esc(xt("exQsFail"))+'</div>';
    h+='</li>';
  });
  h+='</ol>';
  /* כפתור לכל נושא שנבחר, כדי שהמורה יוסיף בדיוק את מה שחסר לו
     ולא שאלה אקראית מנושא כלשהו. */
  if(tops.length){
    h+='<div class="row xq-add"><span class="sub">'+esc(xt("exQsAdd"))+'</span>';
    tops.forEach(function(id){
      h+='<button class="xq-b" data-a="exqadd" data-t="'+esc(id)+'">'+
         '<b aria-hidden="true">+</b> <span>'+esc(exTopicName(id))+'</span></button>';
    });
    h+='</div>';
  }
  return h+'</div>';
}
function viewExamNew(){
  var tops=topicsForTrack(state.track);
  if(!EB.topics.length)EB.topics=tops.slice(0,4).map(function(t){return t.id});
  var h='<div class="wrap" style="padding-block:22px">';
  h+='<h1 class="h1">'+esc(xt("exTitle"))+'</h1>'+
     '<p class="sub">'+esc(xt("exLead"))+'</p>';

  h+='<div class="card pad" style="margin-top:16px">';
  h+='<label class="tt"><b>'+esc(xt("exName"))+'</b></label>'+
     '<input class="field" id="exTitle" value="'+esc(EB.title)+'" placeholder="'+esc(xt("exNamePh"))+'" maxlength="60">';

  /* שורת יחידות הלימוד הגיעה עם מודול המבחן ממשפחת math-uni. באפליקציה
     עם מסלול אחד — math-app, ארבע פעולות החשבון — אין 3/4/5 יח״ל, והשורה
     רק בלבלה. מציגים אותה רק כשיש באמת יותר ממסלול אחד. */
  if(TRACKS.length>1)h+='<div style="margin-top:16px"><b>'+esc(xt("exUnits"))+'</b>'+
     '<div class="seg" style="margin-top:7px">'+[3,4,5].map(function(tr){
       return '<button class="'+(state.track===tr?"on":"")+'" data-a="track" data-t="'+tr+'">'+tr+' '+esc(xt("exUnitSuf"))+'</button>'
     }).join("")+'</div></div>';

  h+='<div style="margin-top:16px"><b>'+esc(xt("exLevel"))+'</b><div class="seg" style="margin-top:7px">'+
     LVL.map(function(l,i){
       return '<button class="'+(EB.level===i+1?"on":"")+'" style="--c:'+LVL_C[i]+'" data-a="exlvl" data-l="'+(i+1)+'">'+l+'</button>'
     }).join("")+'</div></div>';

/* ------------------------------------------------------------
   ייצוא CSV של ההגשות.
   העתקת הטבלה נותנת טקסט מופרד בטאבים — נוח להדבקה, אבל לא קובץ.
   מורה שרוצה למיין, לסנן או לחשב ממוצע צריך גיליון. שורה לכל תלמיד,
   ועמודה לכל שאלה, כדי שאפשר יהיה לראות מיד באיזו שאלה נפלה הכיתה.
   ה-BOM בהתחלה הוא מה שגורם לאקסל לקרוא עברית, ערבית ורוסית נכון
   במקום ג׳יבריש — בלעדיו הקובץ נפתח שבור בדיוק אצל מי שצריך אותו.
   ------------------------------------------------------------ */
function csvCell(v){
  var s=(v===undefined||v===null)?"":String(v);
  return /[",\n\r;\t]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function csvRow(a){ return a.map(csvCell).join(",") }
/* ============================================================
   מצב מורה.
   בונה המבחן ומסך הציונים נועדו למורה. על טאבלט כיתתי, או על
   טלפון שהילד לוקח לעצמו, אין סיבה שהם יהיו במרחק הקשה אחת:
   ילד יכול למחוק מבחן, לראות ציונים של חברים, או לפתוח מבחן
   ולראות מראש את השאלות.
   זו אינה אבטחה, ואסור להציג אותה ככזאת: מי שיודע לפתוח כלי
   פיתוח יעקוף אותה בשנייה. זו נעילה מפני יד סקרנית — בדיוק מה
   שצריך כאן, ולא יותר.
   כל עוד לא נבחר קוד, שום דבר לא משתנה והמסכים גלויים כתמיד.
   ============================================================ */
var TE={ask:false,mode:"",msg:"",busy:false};
function teRead(){try{return JSON.parse(localStorage.getItem("mifne-teacher")||"null")}catch(e){return null}}
function teWrite(o){try{o===null?localStorage.removeItem("mifne-teacher"):localStorage.setItem("mifne-teacher",JSON.stringify(o))}catch(e){}}
function teHas(){var r=teRead();return !!(r&&r.h)}
function teOpen(){
  if(!teHas())return true;
  try{if(sessionStorage.getItem("mifne-teacher"+"-open")==="1")return true}catch(e){}
  try{if(localStorage.getItem("mifne-teacher"+"-open")==="1")return true}catch(e){}
  return false;
}
function teSetOpen(on,remember){
  try{sessionStorage.removeItem("mifne-teacher"+"-open")}catch(e){}
  try{localStorage.removeItem("mifne-teacher"+"-open")}catch(e){}
  if(!on)return;
  try{(remember?localStorage:sessionStorage).setItem("mifne-teacher"+"-open","1")}catch(e){}
}
/* גיבוב חלש כגיבוי בלבד. SubtleCrypto קיים בכל דפדפן מודרני
   בהקשר מאובטח, ו-GitHub Pages הוא כזה. */
function teWeak(s){var h=5381,i;for(i=0;i<s.length;i++)h=((h*33)^s.charCodeAt(i))>>>0;return "w"+h.toString(16)}
function teHash(pin,salt,cb){
  var msg=salt+"|"+pin;
  try{
    if(window.crypto&&crypto.subtle&&crypto.subtle.digest&&window.TextEncoder){
      crypto.subtle.digest("SHA-256",new TextEncoder().encode(msg)).then(function(d){
        var a=Array.prototype.slice.call(new Uint8Array(d));
        cb(a.map(function(b){return ("0"+b.toString(16)).slice(-2)}).join(""));
      },function(){cb(teWeak(msg))});
      return;
    }
  }catch(e){}
  cb(teWeak(msg));
}
function teSalt(){
  var s="";
  try{
    var a=new Uint8Array(8);crypto.getRandomValues(a);
    s=Array.prototype.slice.call(a).map(function(b){return ("0"+b.toString(16)).slice(-2)}).join("");
  }catch(e){ s=String(Date.now())+Math.random().toString(36).slice(2) }
  return s;
}
/* השהיה אחרי ניסיונות כושלים. ארבע ספרות הן עשרת אלפים
   אפשרויות, וילד סבלני יכול לנסות הרבה. */
function teWait(){
  var r=teRead();if(!r||!r.bad||r.bad<3)return 0;
  var pen=Math.min(300,Math.pow(2,r.bad-3)*5)*1000;
  var left=Math.ceil(((r.badAt||0)+pen-Date.now())/1000);
  return left>0?left:0;
}
function teDialog(){
  var wrap=document.getElementById("te-wrap");
  if(wrap&&wrap.parentNode)wrap.parentNode.removeChild(wrap);
  if(!TE.ask)return;
  var setting=(TE.mode==="set"||TE.mode==="change"||!teHas());
  var dirv=(LANGS[state.lang]&&LANGS[state.lang].dir)||"rtl";
  var w=document.createElement("div");
  w.id="te-wrap"; w.className="te-wrap"; w.dir=dirv;
  w.setAttribute("role","dialog"); w.setAttribute("aria-modal","true");
  var wait=teWait();
  w.innerHTML='<div class="te-box" tabindex="-1">'+
    '<h2>'+esc(setting?xt("teSet"):xt("teTitle"))+'</h2>'+
    '<p class="te-lead">'+esc(setting?xt("teLead"):xt("teEnter"))+'</p>'+
    (setting?'<p class="te-warn">'+esc(xt("teWarn"))+'</p>':'')+
    '<label class="te-lab" for="te-pin">'+esc(xt("tePin"))+'</label>'+
    '<input id="te-pin" class="te-in" type="password" inputmode="numeric" '+
      'autocomplete="off" maxlength="8" dir="ltr">'+
    (setting?'<label class="te-lab" for="te-pin2">'+esc(xt("teAgain"))+'</label>'+
      '<input id="te-pin2" class="te-in" type="password" inputmode="numeric" '+
      'autocomplete="off" maxlength="8" dir="ltr">':'')+
    '<label class="te-chk"><input type="checkbox" id="te-rem"> '+esc(xt("teRemember"))+'</label>'+
    '<p class="te-note">'+esc(xt("teRememberNote"))+'</p>'+
    (TE.msg?'<p class="te-msg" role="alert">'+esc(TE.msg)+'</p>':'')+
    (wait?'<p class="te-msg" role="alert">'+esc(xf("teWaitN",wait))+'</p>':'')+
    '<div class="te-row">'+
      '<button class="te-btn pri" id="te-ok"'+(wait?' disabled':'')+'>'+esc(xt("teOk"))+'</button>'+
      '<button class="te-btn" id="te-no">'+esc(xt("teCancel"))+'</button>'+
    '</div>'+
    (!setting&&teHas()?'<button class="te-btn link" id="te-forgot">'+esc(xt("teForgot"))+'</button>':'')+
    '</div>';
  document.body.appendChild(w);
  var box=w.firstChild, pin=document.getElementById("te-pin");
  box.focus(); if(pin&&!wait)pin.focus();
  /* מלכודת פוקוס, כמו בשער התנאים */
  w.addEventListener("keydown",function(e){
    if(e.key==="Escape"){teClose();return}
    if(e.key==="Enter"){e.preventDefault();teSubmit();return}
    if(e.key!=="Tab")return;
    var f=box.querySelectorAll("button:not([disabled]),input");
    if(!f.length)return;
    var a=f[0],z=f[f.length-1];
    if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}
    else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}
  });
  document.getElementById("te-no").onclick=teClose;
  document.getElementById("te-ok").onclick=teSubmit;
  var fg=document.getElementById("te-forgot");
  if(fg)fg.onclick=function(){ TE.msg=xt("teForgotHow"); teDialog() };
}
function teClose(){ TE.ask=false; TE.mode=""; TE.msg=""; teDialog(); }
function teSubmit(){
  if(TE.busy)return;
  var setting=(TE.mode==="set"||TE.mode==="change"||!teHas());
  var pin=(document.getElementById("te-pin")||{}).value||"";
  var rem=!!(document.getElementById("te-rem")||{}).checked;
  if(!/^[0-9]{4,8}$/.test(pin)){TE.msg=xt("teShort");teDialog();return}
  if(setting){
    var p2=(document.getElementById("te-pin2")||{}).value||"";
    if(pin!==p2){TE.msg=xt("teMismatch");teDialog();return}
    var salt=teSalt();
    TE.busy=true;
    teHash(pin,salt,function(h){
      TE.busy=false;
      teWrite({h:h,s:salt,bad:0,badAt:0});
      teSetOpen(true,rem);
      TE.ask=false;TE.mode="";TE.msg="";
      teDialog(); render();
    });
    return;
  }
  if(teWait()){teDialog();return}
  var rec=teRead(); if(!rec){teClose();return}
  TE.busy=true;
  teHash(pin,rec.s,function(h){
    TE.busy=false;
    if(h===rec.h){
      rec.bad=0;rec.badAt=0;teWrite(rec);
      teSetOpen(true,rem);
      TE.ask=false;TE.mode="";TE.msg="";
      teDialog(); render();
    }else{
      rec.bad=(rec.bad||0)+1;rec.badAt=Date.now();teWrite(rec);
      TE.msg=xt("teBad"); teDialog();
    }
  });
}
function teAsk(mode){ TE.ask=true; TE.mode=mode||""; TE.msg=""; teDialog() }
function teLock(){ teSetOpen(false); render() }
function teRemove(){ teWrite(null); teSetOpen(false); render() }
/* נעילה אוטומטית אחרי שהאפליקציה הייתה מוסתרת זמן־מה.
   מורה שבנה מבחן ומסר את הטאבלט בלי ללחוץ "יציאה" השאיר אותו
   פתוח, וזה בדיוק המצב שהתכונה אמורה למנוע. שתי דקות מספיקות
   כדי לא להפריע לעבודה רצופה, ולנעול כשהמכשיר עבר יד.
   נעילה שנשמרה כ"לזכור במכשיר הזה" היא בחירה מפורשת ולא נוגעים בה. */
var TE_HID=0;
try{
  document.addEventListener("visibilitychange",function(){
    if(document.hidden){ TE_HID=Date.now(); return }
    if(!TE_HID||!teHas())return;
    var away=Date.now()-TE_HID; TE_HID=0;
    if(away<120000)return;
    var kept=false;
    try{ kept=localStorage.getItem("mifne-teacher"+"-open")==="1" }catch(e){}
    if(kept)return;
    try{ if(sessionStorage.getItem("mifne-teacher"+"-open")!=="1")return }catch(e){ return }
    teSetOpen(false); render();
  });
}catch(e){}

/* ?teacher=1 פותח את החלון, והפרמטר מוסר מיד מהכתובת כדי שלא
   יישאר בקישור ששותף או בהיסטוריה. */
(function(){
  try{
    var u=new URL(location.href);
    if(u.searchParams.get("teacher")==="1"){
      u.searchParams.delete("teacher");
      history.replaceState(null,"",u.pathname+(u.searchParams.toString()?"?"+u.searchParams:"")+u.hash);
      /* שער התנאים יושב מעל הכול, וכך צריך להיות: אי־אפשר להשתמש
         באפליקציה לפני שהוסכם עליהם. חלון הקוד ממתין לו במקום
         להיפתח מתחתיו ולהיראות תקוע. */
      var tries=0;
      (function waitLegal(){
        if(tries++>=600){ teAsk(teHas()?"":"set"); return }
        /* LEGAL.accepted נוצר רק כש-protect.js מאותחל. עד אז אין
           עדיין מה לבדוק, ובדיקה של ".lg-wrap" לבדה מחזירה "אין
           שער" בדיוק ברגע שלפני שהוא נבנה. */
        var ready=false;
        try{ ready=!!(window.LEGAL&&window.LEGAL.accepted) }catch(e){}
        if(!ready){ setTimeout(waitLegal,200); return }
        var ok=true;
        try{ ok=!!window.LEGAL.accepted() }catch(e){ ok=true }
        if(!ok){ setTimeout(waitLegal,200); return }
        teAsk(teHas()?"":"set");
      })();
    }
  }catch(e){}
})();

function marksCsv(ex){
  var subs=(ex.subs||[]).slice().sort(function(a,b){return b.pct-a.pct});
  var n=ex.spec.q.length,i;
  var head=[xt("mkCsvName"),xt("mkCsvPct"),xt("mkCsvOk"),xt("mkCsvTotal"),
            xt("mkCsvDate"),xt("mkCsvValid")];
  for(i=0;i<n;i++)head.push(xf("mkCsvQ",i+1));
  var rows=[csvRow(head)];
  subs.forEach(function(s){
    var r=[s.name||xt("mkNoName"),s.pct,s.ok,s.n,s.date||"",
           s.valid?xt("mkCsvYes"):xt("mkCsvNo")];
    for(i=0;i<n;i++){
      var p=s.per&&s.per[i];
      r.push(p?(p.ok?xt("mkCsvYes"):xt("mkCsvNo")):"");
    }
    rows.push(csvRow(r));
  });
  return "\ufeff"+rows.join("\r\n")+"\r\n";
}
/* כרום מוחק את שם הקובץ כולו ברגע שיש בו תו אחד שאינו ASCII —
   לא רק עברית: גם é או מקף ארוך. מה שיורד נקרא "download", בלי
   סיומת, ואקסל לא יודע לפתוח אותו. מורה שקרא למבחן שלו בעברית
   קיבל קובץ בלי שם ובלי סוג. לכן השם מתועתק ללטינית. */
var TRLIT={
  "א":"a","ב":"b","ג":"g","ד":"d","ה":"h","ו":"v","ז":"z","ח":"ch","ט":"t","י":"y",
  "כ":"k","ך":"k","ל":"l","מ":"m","ם":"m","נ":"n","ן":"n","ס":"s","ע":"","פ":"f",
  "ף":"f","צ":"tz","ץ":"tz","ק":"k","ר":"r","ש":"sh","ת":"t",
  "ا":"a","ب":"b","ت":"t","ث":"th","ج":"j","ح":"h","خ":"kh","د":"d","ذ":"dh","ر":"r",
  "ز":"z","س":"s","ش":"sh","ص":"s","ض":"d","ط":"t","ظ":"z","ع":"","غ":"gh","ف":"f",
  "ق":"q","ك":"k","ل":"l","م":"m","ن":"n","ه":"h","و":"w","ي":"y","ة":"h","ى":"a","ء":"",
  "أ":"a","إ":"i","آ":"a","ؤ":"w","ئ":"y",
  "а":"a","б":"b","в":"v","г":"g","д":"d","е":"e","ё":"e","ж":"zh","з":"z","и":"i",
  "й":"y","к":"k","л":"l","м":"m","н":"n","о":"o","п":"p","р":"r","с":"s","т":"t",
  "у":"u","ф":"f","х":"kh","ц":"ts","ч":"ch","ш":"sh","щ":"sch","ъ":"","ы":"y","ь":"",
  "э":"e","ю":"yu","я":"ya"
};
function asciiName(s){
  var i,c,out="";
  /* é ו-ü הם אות לטינית ועוד סימן מצורף. פירוק והסרת הסימן משאיר e ו-u. */
  try{ s=s.normalize("NFD").replace(/[\u0300-\u036f]/g,"") }catch(e){}
  for(i=0;i<s.length;i++){
    c=s.charAt(i);
    if(/[A-Za-z0-9]/.test(c)){ out+=c; continue }
    var lower=c.toLowerCase();
    if(TRLIT[lower]!==undefined){ out+=TRLIT[lower]; continue }
    out+=" ";                     /* כל השאר — רווח, שיתכווץ בהמשך */
  }
  return out.replace(/\s+/g," ").trim();
}
function csvFileName(ex){
  var t=asciiName(String(ex.spec.t||"")).slice(0,60).trim();
  var d=String(ex.date||todayIso()).replace(/[^0-9-]/g,"");
  /* כשלא נשאר כלום קריא, מזהה המבחן הוא מה שמבדיל בין שני קבצים
     שירדו באותו יום. */
  if(!t) t="exam "+String(ex.id||"").slice(0,6);
  return (t+" "+d).trim()+".csv";
}
function downloadCsv(ex){
  var txt=marksCsv(ex),url=null,a=document.createElement("a");
  try{
    url=URL.createObjectURL(new Blob([txt],{type:"text/csv;charset=utf-8"}));
  }catch(e){
    url="data:text/csv;charset=utf-8,"+encodeURIComponent(txt);
  }
  a.href=url; a.download=csvFileName(ex);
  a.style.cssText="position:fixed;inset-inline-start:-9999px";
  document.body.appendChild(a); a.click();
  setTimeout(function(){
    if(a.parentNode)a.parentNode.removeChild(a);
    if(url&&url.indexOf("blob:")===0){try{URL.revokeObjectURL(url)}catch(e){}}
  },400);
}
function marksTable(ex){
  var out=(ex.spec.t||xt("exam"))+"\n";
  out+=xt("mkTblHead")+"\n";
  (ex.subs||[]).slice().sort(function(a,b){return b.pct-a.pct}).forEach(function(s){
    var wrong=uniq(s.per.filter(function(p){return !p.ok}).map(function(p){return p.topicName}));
    out+=(s.name||xt("mkNoName"))+"\t"+s.pct+"\t"+s.ok+"/"+s.n+"\t"+wrong.join(", ")+"\n";
  });
  return out;
}

/* ------------------------------------------------------------
   מסך התלמיד — מבחן מתוך קישור
   ------------------------------------------------------------ */
var SIT={spec:null,id:"",qs:[],i:0,name:"",answers:[],flags:[],
         t0:0,tick:null,phase:"intro",code:"",copied:false};

/* ------------------------------------------------------------
   מבחן שנפתח מחדש — ריענון, שיחה נכנסת, נעילת מסך
   ------------------------------------------------------------
   תלמיד שדפדפן שלו רענן באמצע מבחן איבד עד כה את הכול. התשובות
   נשמרות עכשיו במכשיר, לפי מזהה המבחן, יחד עם שעת ההתחלה — כדי
   שגם טיימר לא יתאפס ויעניק זמן נוסף. השמירה מקומית בלבד.
   ------------------------------------------------------------ */
function sitKey(){return EKEY+"-run-"+SIT.id}
function sitSave(){
  if(!SIT.id)return;
  try{localStorage.setItem(sitKey(),JSON.stringify({
    n:SIT.name,a:SIT.answers,f:SIT.flags,t:SIT.t0,i:SIT.i,p:SIT.phase}))}catch(e){}
}
function sitKeyOld(){return EKEY_OLD+"-run-"+SIT.id}
function sitDrop(){try{localStorage.removeItem(sitKey());localStorage.removeItem(sitKeyOld())}catch(e){}}
function sitRestore(){
  if(!SIT.id)return false;
  try{
    /* מבחן שהתחיל לפני פיצול המפתחות נשמר תחת המפתח הישן. */
    var o=JSON.parse(localStorage.getItem(sitKey())||localStorage.getItem(sitKeyOld())||"null");
    if(!o||!o.a||!o.a.length)return false;
    SIT.qs=examQuestions(SIT.spec);
    if(o.a.length!==SIT.qs.length)return false;   /* מבחן אחר תחת אותו מזהה */
    SIT.name=o.n||""; SIT.answers=o.a;
    SIT.flags=o.f&&o.f.length===o.a.length?o.f:SIT.qs.map(function(){return false});
    SIT.t0=o.t||0; SIT.i=Math.min(Math.max(0,o.i|0),SIT.qs.length-1);
    SIT.phase=o.p==="done"?"done":"ask";
    if(SIT.phase==="done")SIT.code=encodeResult(SIT.id,SIT.name,SIT.answers);
    return true;
  }catch(e){return false}
}
/* שניות שנותרו, או null כשלא הוגדרה הגבלת זמן */
function sitLeft(){
  var m=SIT.spec&&SIT.spec.m;
  if(!m||!SIT.t0)return null;
  return Math.max(0,Math.round((SIT.t0+m*60000-Date.now())/1000));
}
function sitClock(){
  var l=sitLeft(); if(l===null)return "";
  var mm=Math.floor(l/60),ss=l%60;
  return mm+":"+(ss<10?"0":"")+ss;
}
/* הזמן נגמר — מגישים. לא מבקשים אישור: אישור שאיש לא לוחץ עליו
   פירושו מבחן שנשאר פתוח לנצח. */
function sitTimerOn(){
  sitTimerOff();
  if(sitLeft()===null)return;
  SIT.tick=setInterval(function(){
    if(SIT.phase!=="ask"){sitTimerOff();return}
    if(sitLeft()<=0){sitTimerOff();sitFinish();return}
    var el=$("#sitclock"); if(el)el.textContent=sitClock();
  },1000);
}
function sitTimerOff(){if(SIT.tick){clearInterval(SIT.tick);SIT.tick=null}}

function sitStart(){
  var nm=$("#sitName"); SIT.name=nm?nm.value.trim():"";
  SIT.qs=examQuestions(SIT.spec);
  /* אם לא נותרה אף שאלה שאפשר לבנות (למשל מבחן של אפליקציה אחרת),
     מציגים את מסך המבחן השבור במקום ליפול על שאלה שאינה קיימת. */
  if(!SIT.qs.length){view="badexam"; render(); return}
  SIT.answers=SIT.qs.map(function(){return -1});
  SIT.flags=SIT.qs.map(function(){return false});
  SIT.i=0; SIT.phase="ask"; SIT.t0=Date.now();
  sitSave(); sitTimerOn();
  window.scrollTo(0,0); render();
}
function sitAnswer(i){
  if(SIT.phase!=="ask")return;
  SIT.answers[SIT.i]=i;
  sitSave();
  sitNext();
}
/* סימון לחזרה אינו תשובה ואינו משנה אותה — הוא רק מסמן. */
function sitFlag(){
  if(SIT.phase!=="ask")return;
  SIT.flags[SIT.i]=!SIT.flags[SIT.i];
  sitSave(); render();
}
function sitNext(){
  if(SIT.i+1<SIT.qs.length){SIT.i++;window.scrollTo(0,0);render();return}
  /* לא מגישים בלחיצה על תשובה. לחיצה בטעות על האפשרות האחרונה
     אינה אמורה לסיים מבחן. */
  SIT.phase="review"; stopSpeak(); window.scrollTo(0,0); render();
}
function sitGo(i){
  SIT.i=clamp(i,0,SIT.qs.length-1); SIT.phase="ask";
  window.scrollTo(0,0); render();
}
/* התוצאה נשלחת כקישור ולא כקוד: המורה לוחץ, האפליקציה נפתחת אצלו
   וקולטת. הקוד עצמו יושב אחרי #r=, ולכן גם הדבקה של הקישור השלם
   בתיבת הקוד עובדת — codeOf מחלץ אותו משם. */
function resultUrl(code){return location.origin+location.pathname+"#r="+code}
function codeOf(raw){
  var m=String(raw||"").match(/#r=([A-Za-z0-9\-_]+)/);
  return (m?m[1]:String(raw||"")).trim();
}
function sitFinish(){
  SIT.phase="done";
  sitTimerOff();
  SIT.code=encodeResult(SIT.id,SIT.name,SIT.answers);
  sitSave();
  stopSpeak(); window.scrollTo(0,0); render();
}
function sitGrade(){
  var ok=0,i;
  for(i=0;i<SIT.qs.length;i++){
    var a=SIT.answers[i];
    if(a>=0&&SIT.qs[i].options[a]&&SIT.qs[i].options[a].ok)ok++;
  }
  return {ok:ok,n:SIT.qs.length,pct:Math.round(100*ok/SIT.qs.length)};
}
