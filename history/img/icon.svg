<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img">
<title>מפנה — היסטוריה לחטיבת הביניים</title>
<!-- ============================================================
     אייקון "מפנה". נבנה לפי מידות הבית שנמדדו משמונת האייקונים
     הקיימים: קנבס לבן אטום, אריח 460×460 בהיסט 26, רדיוס 98,
     גרדיאנט אנכי, גליף לבן שמרכזו ב-50% אופקית ו-51% אנכית.

     הגליף הוא האות מ׳ ולא N. האות בנויה משני חלקים, כמו בכל
     גופן עברי: החלק הימני סגור (קו עליון, מוט ימני, קו תחתון),
     והקו השמאלי יורד ממנו ונוטה שמאלה, ומשאיר חריץ פתוח בפינה
     השמאלית התחתונה. החריץ ברוחב קבוע 20 — פניו של הקו התחתון
     נחתכו באותה נטייה של הקו השמאלי — כי חריץ שמתרחב כלפי מטה
     נראה כפגם ייצור ולא כצורת אות.
     ============================================================ -->
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0f7654"/>
    <stop offset="1" stop-color="#0a543b"/>
  </linearGradient>
</defs>

<rect width="512" height="512" fill="#ffffff"/>
<rect x="26" y="26" width="460" height="460" rx="98" ry="98" fill="url(#g)"/>

<!-- מ׳ — תיבה 176×172, מרכז (256, 260) -->
<path fill="#ffffff" d="M196 174
  L344 174 L344 346 L224 346 L230 310 L308 310 L308 210 L226 210 L204 346 L168 346 Z"/>
</svg>
