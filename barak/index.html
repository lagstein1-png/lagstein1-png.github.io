@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){

footer{text-align:center;color:var(--text-soft);font-size:.85rem;margin-block-start:28px}

  var lh=""; ["he","ar","ru","en"].forEach(function(l){ lh+='<button class="chip" type="button" data-l="'+l+'" aria-pressed="'+(l===S.lang)+'" lang="'+l+'">'+({he:"עברית",ar:"العربية",ru:"Русский",en:"English"})[l]+'</button>' });
  $("langs").innerHTML=lh;
  var sh=""; ["math","english","history","theory"].forEach(function(k){ sh+='<button class="chip" type="button" data-s="'+k+'" aria-pressed="'+(k===S.sub)+'">'+esc(t.subs[k])+'</button>' });
  $("subs").innerHTML=sh;
  $("q").innerHTML=lat(q.q.replace(/«|»/g,""));
  var oh=""; S.opts.forEach(function(o,i){
    var cls="opt"+(S.done&&o===q.ans?" right":"")+(S.picked===o&&o!==q.ans?" wrong":"");
    oh+='<button class="'+cls+'" type="button" data-i="'+i+'"'+(S.done?" disabled":"")+'>'+lat(o)+'</button>';
  });
  $("opts").innerHTML=oh;
  $("hint").innerHTML = S.hint ? '<div class="hint">'+lat(q.hint)+'</div>' : "";
  $("fb").textContent = S.done ? t.ok : (S.picked ? t.no : "");
  $("btnAsk").textContent = (window.TUTOR && TUTOR.on()) ? TUTOR.label() : t.ask;
  $("btnHint").textContent=t.hint; $("btnHint").disabled = S.hint || S.done;
  $("btnNext").textContent=t.next;
}
function pick(o){
  if(S.done) return;
  S.picked=o;
  if(o===cur().ans) S.done=true;
  render();
}
function next(){ S.i=(S.i+1)%BANK[S.sub][S.lang].length; load(); render(); }
document.addEventListener("click", function(e){
  var b=e.target.closest("button"); if(!b) return;
  if(b.dataset.l){ S.lang=b.dataset.l; load(); render(); return }
  if(b.dataset.s){ S.sub=b.dataset.s; S.i=0; load(); render(); return }
  if(b.classList.contains("opt")){ pick(S.opts[+b.dataset.i]); return }
  if(b.id==="btnHint"){ S.hint=true; render(); return }
  if(b.id==="btnNext"){ next(); return }
  if(b.id==="btnAsk"){ if(window.TUTOR) TUTOR.open(); }
});
load(); render();

/* ---------- לימור ---------- */
if(window.TUTOR){
  TUTOR.mount({
    app: BANK[S.sub].app,
    lang: function(){ return S.lang },
    q: function(){ var q=cur(); return { expr:q.q.replace(/«|»/g,""), ans:q.ans, topic:q.topic, level:CURR[S.sub] } }
  });
}
function log(name, ok){ var t=T(); $("log").textContent = t.did + name + (ok ? " ✓" : " ✗"); }
if(window.BARAK) BARAK.register({
  /* המזהה משתנה עם המקצוע — התפקיד בשרת נבחר לפי app. `app` נקרא
     בזמן הבקשה דרך getter, ולכן החלפת מקצוע מחליפה תפקיד. */
  get app(){ return BANK[S.sub].app },
  getScreenContext: function(){
    var q=cur();
    return { id: S.sub+"-"+S.lang+"-"+S.i, type: S.done ? "reveal" : "mcq",
             q: q.q.replace(/«|»/g,""), options: S.opts.slice(), correct: q.ans,
             student: (S.picked && S.picked!==q.ans) ? S.picked : null,
             topic: q.topic, level: CURR[S.sub], curriculum: CURR[S.sub]+" — "+q.topic };
  },
  actions: {
    next_question: { desc:"עובר לשאלה הבאה", run:function(){ next(); log("next_question", true); return true } },
    show_hint: { desc:"מציג את הרמז של השאלה", run:function(){ if(S.hint||S.done){ log("show_hint", false); return false } S.hint=true; render(); log("show_hint", true); return true } },
    highlight_option: { desc:"מדגיש אפשרות לפי מקומה (0 עד 3)", params:{ index:{ type:"integer", min:0, max:3, required:true } },
      run:function(a){ var ok=BARAK.highlight(document.querySelectorAll("#opts .opt")[a.index]); log("highlight_option "+a.index, ok); return ok } },
    explain_again: { desc:"מציג שוב את הרמז וההסבר אחרי שנענתה", run:function(){ if(!S.done){ log("explain_again", false); return false } S.hint=true; render(); log("explain_again", true); return true } }
  }
});
})();
</script>
</body>
</html>
