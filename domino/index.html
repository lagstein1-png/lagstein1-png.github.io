  try{
    var q=(location.search.match(/[?&]internal=([^&]*)/)||[])[1];

#pc,#pk{display:none}

<script>
/* ===== helpers ===== */
var LG=["he","ar","ru","en"];
function L(h,a,r,e){return {he:h,ar:a,ru:r,en:e}}
var RNG=Math.random;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function ri(a,b){return Math.floor(RNG()*(b-a+1))+a}
function pick(a){return a[ri(0,a.length-1)]}
function shuffle(a){var r=a.slice(),i,j,x;for(i=r.length-1;i>0;i--){j=ri(0,i);x=r[i];r[i]=r[j];r[j]=x}return r}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function svg(w,h,inner,lab){return '<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+esc(lab||"")+'" preserveAspectRatio="xMidYMid meet">'+inner+'</svg>'}
var INK="#17333c",C1="#2f7fd8",C2="#f58a1f",SHADE="#ffb04d";
/* ===== number words 1..20 (he: counting forms) ===== */
var NW={
he:["","אחת","שתיים","שלוש","ארבע","חמש","שש","שבע","שמונה","תשע","עשר","אחת עשרה","שתים עשרה","שלוש עשרה","ארבע עשרה","חמש עשרה","שש עשרה","שבע עשרה","שמונה עשרה","תשע עשרה","עשרים"],
ar:["","واحد","اثنان","ثلاثة","أربعة","خمسة","ستة","سبعة","ثمانية","تسعة","عشرة","أحد عشر","اثنا عشر","ثلاثة عشر","أربعة عشر","خمسة عشر","ستة عشر","سبعة عشر","ثمانية عشر","تسعة عشر","عشرون"],
ru:["","один","два","три","четыре","пять","шесть","семь","восемь","девять","десять","одиннадцать","двенадцать","тринадцать","четырнадцать","пятнадцать","шестнадцать","семнадцать","восемнадцать","девятнадцать","двадцать"],
en:["","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen","twenty"]};
var OPW={plus:L("ועוד","плюс","плюс","plus"),minus:L("פחות","ناقص","минус","minus"),times:L("כפול","ضرب","умножить на","times"),over:L("מתוך","من","из","out of")};
OPW.plus.ar="زائد";OPW.plus.ru="плюс";
/* ===== visuals ===== */
function dotsSvg(n){var s="",i,rows=Math.ceil(n/5),oy=(82-rows*18)/2+9,ox=(100-Math.min(n,5)*18)/2+9;
  for(i=0;i<n;i++){var r=Math.floor(i/5),c=i%5;s+='<circle cx="'+(ox+c*18-9+0)+'" cy="'+(oy+r*18)+'" r="7" fill="'+(r%2?C2:C1)+'" stroke="'+INK+'" stroke-width="1.5"/>'}
  return svg(100,82,s,String(n))}
function arraySvg(r,c){var sp=Math.min(110/c,72/r),rad=sp*.38,s="",i,j,w=c*sp+6,h=r*sp+6;
  for(i=0;i<r;i++)for(j=0;j<c;j++)s+='<circle cx="'+(3+sp*(j+.5)).toFixed(1)+'" cy="'+(3+sp*(i+.5)).toFixed(1)+'" r="'+rad.toFixed(1)+'" fill="'+(i%2?C2:C1)+'" stroke="'+INK+'" stroke-width="1"/>';
  return svg(w.toFixed(0),h.toFixed(0),s,r+"x"+c)}
function rodsSvg(t,o){var s="",i,j;
  for(i=0;i<t;i++){var x=4+i*13;s+='<rect x="'+x+'" y="6" width="10" height="64" rx="2" fill="#7fcbea" stroke="'+INK+'" stroke-width="1.4"/>';for(j=1;j<10;j++)s+='<line x1="'+x+'" x2="'+(x+10)+'" y1="'+(6+j*6.4)+'" y2="'+(6+j*6.4)+'" stroke="'+INK+'" stroke-width=".6"/>'}
  var ox=4+t*13+6;
  for(i=0;i<o;i++){s+='<rect x="'+(ox+(i%3)*12)+'" y="'+(10+Math.floor(i/3)*14)+'" width="10" height="10" rx="2" fill="#ffc531" stroke="'+INK+'" stroke-width="1.2"/>'}
  return svg(ox+40,76,s,t+"/"+o)}
function pieSvg(p,q){var s='<circle cx="50" cy="50" r="42" fill="#fff" stroke="'+INK+'" stroke-width="2.5"/>',i;
  for(i=0;i<p;i++){var a0=-Math.PI/2+i*2*Math.PI/q,a1=-Math.PI/2+(i+1)*2*Math.PI/q;
    s+='<path d="M50 50 L'+(50+42*Math.cos(a0)).toFixed(2)+' '+(50+42*Math.sin(a0)).toFixed(2)+' A42 42 0 0 1 '+(50+42*Math.cos(a1)).toFixed(2)+' '+(50+42*Math.sin(a1)).toFixed(2)+' Z" fill="'+SHADE+'"/>'}
  for(i=0;i<q;i++){var a=-Math.PI/2+i*2*Math.PI/q;s+='<line x1="50" y1="50" x2="'+(50+42*Math.cos(a)).toFixed(2)+'" y2="'+(50+42*Math.sin(a)).toFixed(2)+'" stroke="'+INK+'" stroke-width="2"/>'}
  s+='<circle cx="50" cy="50" r="42" fill="none" stroke="'+INK+'" stroke-width="2.5"/>';
  return svg(100,100,s,p+"/"+q)}
function barSvg(p,q){var w=108/q,s="",i;
  for(i=0;i<q;i++)s+='<rect x="'+(6+i*w).toFixed(2)+'" y="10" width="'+w.toFixed(2)+'" height="34" fill="'+(i<p?SHADE:"#fff")+'" stroke="'+INK+'" stroke-width="2"/>';
  return svg(120,54,s,p+"/"+q)}
function clockSvg(h,m){var s='<circle cx="90" cy="90" r="82" fill="#fff" stroke="'+INK+'" stroke-width="5"/>',i;
  for(i=1;i<=12;i++){var a=i*Math.PI/6;s+='<text x="'+(90+62*Math.sin(a)).toFixed(1)+'" y="'+(98-62*Math.cos(a)).toFixed(1)+'" text-anchor="middle" font-size="20" font-weight="800" fill="'+INK+'">'+i+'</text>'}
  var ha=((h%12)+m/60)*Math.PI/6,ma=m*Math.PI/30;
  s+='<line x1="90" y1="90" x2="'+(90+40*Math.sin(ha)).toFixed(1)+'" y2="'+(90-40*Math.cos(ha)).toFixed(1)+'" stroke="#e8453c" stroke-width="8" stroke-linecap="round"/>';
  s+='<line x1="90" y1="90" x2="'+(90+60*Math.sin(ma)).toFixed(1)+'" y2="'+(90-60*Math.cos(ma)).toFixed(1)+'" stroke="#2f7fd8" stroke-width="5" stroke-linecap="round"/><circle cx="90" cy="90" r="6" fill="'+INK+'"/>';
  return svg(180,180,s,hh(h,m))}
function hh(h,m){return h+":"+(m<10?"0"+m:m)}
/* ===== representations: a rep is a language-free spec {t, ...}; R() renders it ===== */
function tx(str,num){var n=String(str).length,sz=n<=3?15:n<=5?12:n<=8?9:n<=11?7:5.6;return '<span class="tx'+(num?' n':'')+'" style="font-size:'+sz+'cqw">'+esc(str)+'</span>'}
function sayOp(str,lang){return str.replace(/\+/g," "+OPW.plus[lang]+" ").replace(/−/g," "+OPW.minus[lang]+" ").replace(/×/g," "+OPW.times[lang]+" ")}
function R(sp,lang){var t=sp.t;
  if(t==="digit")return {h:tx(sp.n,1),s:String(sp.n)};
  if(t==="word")return {h:tx(NW[lang][sp.n],0),s:NW[lang][sp.n]};
  if(t==="dots")return {h:dotsSvg(sp.n),s:String(sp.n)};
  if(t==="sum"){var x=sp.a+"+"+sp.b;return {h:tx(x,1),s:sayOp(x,lang)}}
  if(t==="diff"){var x2=sp.a+"−"+sp.b;return {h:tx(x2,1),s:sayOp(x2,lang)}}

  return h+'</div><button class="gear" data-a="settings" aria-label="'+esc(t.settings)+'"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button></div>'}
function tutorBtn(){return (window.TUTOR&&TUTOR.on&&TUTOR.on())?'<button class="btn tut" data-a="tutor"><img src="/img/limor.jpg" alt="">'+esc(TUTOR.label())+'</button>':''}
function listenRow(sayId){var t=T();return '<div class="row" style="margin:6px 0 8px"><button class="btn play" data-a="say" data-t="'+sayId+'"><svg width="22" height="22" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M6 4l14 8-14 8z"/></svg>'+esc(t.listen)+'</button><button class="btn stop" data-a="stop"><svg width="20" height="20" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>'+esc(t.stop)+'</button><button class="btn slow" data-a="slowsay" data-t="'+sayId+'">'+esc(t.slow)+'</button></div>'}
function homeView(){var t=T(),cur=SETS[S.set],h='<h1 id="h1">'+esc(t.title)+'</h1><p class="sub" id="hs">'+esc(t.tag)+'</p>'+listenRow("home");
  h+='<div class="tbox"><img src="/img/limor.jpg" alt=""><div><b>'+esc(t.limor)+'</b>'+'<p class="how" id="how">'+esc(t.how)+'</p></div></div>'+listenRow("how")+tutorBtn();
  h+='<h2 style="margin-top:14px">'+esc(t.pick)+'</h2><div class="sets">';
  SETIDS.forEach(function(id){var s=SETS[id];h+='<button class="setb" style="--c:'+s.c+'" data-a="set" data-s="'+id+'" aria-pressed="'+(S.set===id)+'"><span class="ico" style="color:'+(s.tc||"#fff")+'" aria-hidden="true">'+esc(s.ic)+'</span><span><span class="nm">'+esc(lt(s.n))+'</span><br><span class="ds">'+esc(lt(s.d))+'</span></span></button>'});
  h+='</div>';
  if(cur.lv>1)h+='<div class="lvls" role="group" aria-label="'+esc(t.level)+'"><button class="lvl" data-a="lvl" data-l="1" aria-pressed="'+(S.lvl===1)+'">'+esc(t.l1)+'</button><button class="lvl" data-a="lvl" data-l="2" aria-pressed="'+(S.lvl===2)+'">'+esc(t.l2)+'</button></div>';
  h+='<div class="kits" role="group" aria-label="'+esc(t.kit)+'"><b>'+esc(t.kit)+':</b>';
  [1,2,3].forEach(function(k){h+='<button class="kit" data-a="kit" data-k="'+k+'" aria-pressed="'+(S.seed===k)+'">'+k+'</button>'});
  h+='<button class="btn shuf" data-a="newkit"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1a1300" stroke-width="2.4" aria-hidden="true"><path d="M3 7h4l10 10h4M3 17h4l3-3M14 10l3-3h4M18 4l3 3-3 3M18 14l3 3-3 3"/></svg>'+esc(t.kitNew)+'</button><span class="cap">'+esc(t.kitNo)+': '+S.seed+'</span></div>';
  h+='<div class="row" style="margin:10px 0 14px"><button class="btn print" data-a="printcards">'+esc(t.printCards)+'<small>'+esc(t.printCardsD)+'</small></button><button class="btn print" style="background:var(--sky-deep)" data-a="printkey">'+esc(t.printKey)+'<small>'+esc(t.printKeyD)+'</small></button></div>';
  h+='<button class="btn ghost" data-a="keyview" style="margin-bottom:14px">'+esc(t.showKey)+'</button>';
  h+='<h2>'+esc(t.cardsT)+' · '+esc(lt(cur.n))+'</h2><p class="sub">'+esc(t.tapHalf)+'</p><div class="pgrid">';
  DECK.cards.forEach(function(c){h+='<div class="cwrap">'+cardHTML(c,true)+'</div>'});
  return h+'</div>'}
function keyView(){var t=T(),h='<button class="btn ghost" data-a="home">'+esc(t.back)+'</button><h1 id="kt">'+esc(t.keyT)+'</h1><p class="sub" id="kh">'+esc(t.keyHow)+'</p>'+listenRow("key");
  h+='<p><b>'+esc(t.keyOrder)+':</b> <span dir="ltr">'+DECK.chain.join(" → ")+' → '+DECK.chain[0]+'</span></p><div class="row" style="margin-bottom:14px"><button class="btn print" style="background:var(--sky-deep)" data-a="printkey">'+esc(t.printKey)+'<small>'+esc(t.printKeyD)+'</small></button></div><div class="kgrid">';
  DECK.byChain.forEach(function(c,i){h+='<div class="cwrap"><span class="cap">'+(i+1)+' · '+esc(t.cardW)+' '+c.id+(i===0?' · ★ '+esc(t.start):'')+'</span>'+cardHTML(c,true,{noNo:true})+'</div>'});
  return h+'</div>'}
function settingsView(){var t=T();function tg(k,l){return '<div class="set"><span>'+esc(l)+'</span><button class="tog" data-a="tog" data-k="'+k+'" aria-pressed="'+!!S[k]+'">'+esc(S[k]?t.on:t.off)+'</button></div>'}
  return '<button class="btn ghost" data-a="home">'+esc(t.back)+'</button><h1 id="st">'+esc(t.settings)+'</h1>'+listenRow("settings")+'<div class="card">'+tg("slow",t.setSlow)+tg("big",t.setBig)+'<p class="sub" id="sn" style="margin-top:12px">'+esc(t.setNote)+'</p></div>'}
function render(){document.documentElement.lang=S.lang;document.documentElement.dir=LDIR[S.lang];document.documentElement.classList.toggle("big",!!S.big);
  if(!DECK)mkDeck();
  var h=header();h+=({home:homeView,key:keyView,settings:settingsView})[view]();$("#app").innerHTML=h;
  $("#pc").innerHTML=sheetsHTML();$("#pk").innerHTML=keyHTML();
  document.title=T().title+" · bekol";if(window.TUTOR&&TUTOR.refresh)try{TUTOR.refresh()}catch(e){}}
function sayText(w){var t=T();
  if(w==="home")return [t.title+". "+t.tag,$("#h1")];
  if(w==="how")return [t.limor+" "+t.how,$("#how")];
  if(w==="key")return [t.keyHow,$("#kh")];
  if(w==="settings")return [t.setNote,$("#sn")];
  return ["",null]}
function doPrint(cls){stopSpeak();var r=document.documentElement;r.classList.add(cls);
  var done=function(){r.classList.remove("pc");r.classList.remove("pk");window.removeEventListener("afterprint",done)};
  window.addEventListener("afterprint",done);setTimeout(function(){try{window.print()}catch(e){done()}},60)}
function onAct(a,el){
  if(a==="home"){stopSpeak();view="home";render();window.scrollTo(0,0)}
  else if(a==="lang"){stopSpeak();S.lang=el.dataset.l;saveS();render()}
  else if(a==="settings"){stopSpeak();view="settings";render();window.scrollTo(0,0)}
  else if(a==="keyview"){stopSpeak();view="key";render();window.scrollTo(0,0)}
  else if(a==="set"){stopSpeak();S.set=el.dataset.s;if(S.lvl>SETS[S.set].lv)S.lvl=1;saveS();mkDeck();render()}
  else if(a==="lvl"){stopSpeak();S.lvl=+el.dataset.l;saveS();mkDeck();render()}
  else if(a==="kit"){stopSpeak();S.seed=+el.dataset.k;saveS();mkDeck();render()}
  else if(a==="newkit"){stopSpeak();S.seed=Math.floor(Math.random()*9000)+1000;saveS();mkDeck();render()}
  else if(a==="say"||a==="slowsay"){var r=sayText(el.dataset.t),o=S.slow;if(a==="slowsay")S.slow=true;speak(r[0],r[1]);S.slow=o}
  else if(a==="sayhalf"){var c=byId(+el.dataset.c),rp=R(el.dataset.s==="a"?c.a:c.b,S.lang);speak(rp.s,null)}
  else if(a==="stop")stopSpeak();
  else if(a==="tutor"){stopSpeak();if(window.TUTOR)TUTOR.open()}
  else if(a==="tog"){var kk=el.dataset.k;S[kk]=!S[kk];saveS();render()}
  else if(a==="printcards")doPrint("pc");
  else if(a==="printkey")doPrint("pk")}
document.addEventListener("click",function(e){var el=e.target.closest("[data-a]");if(!el||el.disabled)return;onAct(el.dataset.a,el)});
window.addEventListener("pagehide",function(){stopSpeak()});
</script>

function boot(){var q=new URLSearchParams(location.search),l=q.get("lang");if(l&&STR[l])S.lang=l;
  var st=q.get("set");if(st&&SETS[st])S.set=st;var lv=q.get("lvl");if(lv)S.lvl=+lv;var sd=q.get("seed");if(sd)S.seed=+sd;
  mkDeck();var vw=q.get("view");if(vw==="key"||vw==="settings")view=vw;
  render();
  var pr=q.get("print");if(pr==="cards")document.documentElement.classList.add("pc");else if(pr==="key")document.documentElement.classList.add("pk");
  if(window.TUTOR){try{TUTOR.mount({app:"domino",lang:function(){return S.lang},q:function(){return null},stopHost:function(){stopSpeak()}});render()}catch(e){}}
  if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js?v=dm3-pwa1").catch(function(){})})}
if(!INTERNAL_OK){
  document.getElementById("gate").hidden=false;
  document.title="לא פורסם";
}else{
  boot();
}
