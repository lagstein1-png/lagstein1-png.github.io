body{margin:0;background:var(--paper);color:var(--ink);font-family:"Heebo",system-ui,"Segoe UI",Arial,sans-serif;line-height:1.5;-webkit-text-size-adjust:100%}

html[lang="ru"] body,html[lang="ru"] button{font-family:var(--ru)}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:820px;margin:0 auto;padding:12px 14px 120px}
.top{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.brand{font-weight:800;font-size:.9rem;line-height:1.15;flex:1;min-width:0;color:var(--teal-deep);background:none;border:0;text-align:start;padding:6px 0}
.langs{display:flex;gap:4px}
.langs button{min-width:46px;min-height:50px;padding:0 4px;border-radius:14px;border:2px solid var(--teal);background:var(--card);font-weight:700;font-size:.9rem}
/* הכפתור הנבחר בשורת השפות הוא 18px/700 — טקסט רגיל ולא גדול,
   ולכן הסף הוא 4.5:1. לבן על --teal היה 3.41:1 במצב בהיר.
   --pick הוא teal-deep בבהיר ו--teal בכהה: 5.59:1 ו-9.97:1. */
.langs button[aria-pressed=true]{background:var(--pick);color:var(--on-teal)}
.gear{min-width:46px;padding:0;min-height:50px;border-radius:14px;border:2px solid var(--violet);background:var(--card);color:var(--violet-deep)}
h1{font-size:1.6rem;margin:.2em 0 .1em;line-height:1.25}
h2{font-size:1.25rem;margin:.2em 0 .4em}
.sub{color:var(--ink-soft);margin:0 0 12px}
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:0 2px 10px rgba(23,51,60,.08);margin-bottom:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:10px 20px;border-radius:16px;border:0;font-weight:800;font-size:1rem;color:#fff;background:var(--btn);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.play{background:var(--green);font-size:1.1rem;min-height:62px;padding:10px 18px}
.btn.stop{background:var(--red);padding:10px 14px}
.btn.slow{background:var(--sky-deep);color:#fff;padding:10px 14px}
.btn.print{flex-direction:column;gap:0;background:#6a45b0;font-size:1.1rem;min-height:64px;flex:1;min-width:230px}
.btn.print small{display:block;font-weight:500;font-size:.75rem;opacity:.95}
.btn.shuf{background:var(--amber);color:#1a1300}
.btn.ghost{background:var(--card);color:var(--teal-deep);border:2px solid var(--teal);box-shadow:none}
.btn.tut{background:var(--card);color:var(--violet-deep);border:3px solid var(--violet);width:100%;box-shadow:none;justify-content:flex-start}
.btn.tut img{width:44px;height:44px;border-radius:50%;object-fit:cover;object-position:47% 27%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin:6px 0 12px}
.setb{display:flex;gap:12px;align-items:center;text-align:start;background:var(--card);border:3px solid var(--c);border-radius:20px;padding:10px 12px;min-height:84px}
.setb{position:relative}
.setb[aria-pressed=true]{box-shadow:0 0 0 4px var(--c)}
.setb[aria-pressed=true]::after{content:"✓";position:absolute;top:4px;inset-inline-end:10px;font-weight:900;font-size:1.2rem;color:var(--c)}
.setb .ico{flex:none;width:56px;height:56px;border-radius:16px;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.25rem}
.setb .nm{font-weight:800;font-size:1.1rem;line-height:1.2}
.setb .ds{font-size:.8rem;color:var(--ink-soft);line-height:1.3}
.lvls{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 12px}
.lvl{flex:1;min-width:140px;min-height:56px;border-radius:16px;border:3px solid var(--sky);background:var(--card);font-weight:800;padding:6px}
.lvl[aria-pressed=true]{background:var(--sky-deep);border-color:var(--sky-deep);color:#fff}
.kits{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:4px 0 12px}
.kits .kit{min-width:56px;min-height:50px;border-radius:14px;border:2px solid var(--amber);background:var(--card);font-weight:800}
.kits .kit[aria-pressed=true]{background:var(--amber);color:#1a1300}
.hl{background:var(--amber);color:#1a1300;border-radius:6px;padding:0 2px}
.tbox{background:var(--violet-soft);border:3px solid var(--violet);border-radius:18px;padding:12px 14px;margin:12px 0;display:flex;gap:12px;align-items:flex-start}
.tbox img{flex:none;width:64px;height:64px;border-radius:50%;object-fit:cover;object-position:47% 27%;border:3px solid var(--violet)}
.how{margin:0;font-size:1.05rem;white-space:pre-line}
.how::first-line{font-weight:800}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.cwrap{display:flex;flex-direction:column;gap:4px}
.cap{font-size:.8rem;color:var(--ink-soft);font-weight:700}
.set .tog,.tog{min-width:92px;min-height:50px;border-radius:14px;border:2px solid var(--teal);background:var(--card);font-weight:800}
.tog[aria-pressed=true]{background:var(--teal);color:var(--on-teal)}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.credit{font-size:.8rem;color:var(--ink-soft);text-align:center;margin-top:20px}
.srOnly{position:absolute;inset-inline-start:-9999px}
/* ===== הקלף עצמו — תמיד על נייר לבן, גם במצב כהה ===== */
.dc{container-type:inline-size;position:relative;width:100%;aspect-ratio:12/5;display:flex;background:#fff;color:#17333c;border:.35cqw dashed #6b7f86;border-radius:1.2cqw;overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.dc .half{position:relative;flex:1;min-width:0;display:flex;align-items:center;justify-content:center;padding:2.2cqw;background:#fff;border:0;color:#17333c;text-align:center;font-family:inherit}
.dc .half+.half{border-inline-start:.7cqw solid var(--dcc,#0e9c8d)}
.dc .half .vis{display:flex;align-items:center;justify-content:center;width:100%;height:100%}
.dc .half svg{max-width:100%;max-height:100%;width:100%;height:100%}
.dc .tx{font-weight:800;line-height:1.1;overflow-wrap:anywhere;unicode-bidi:plaintext}
.dc .tx.n{direction:ltr}
.dc .fr{display:inline-flex;flex-direction:column;align-items:center;font-weight:800;line-height:1;font-size:17cqw}
.dc .fr s{display:block;width:100%;height:.9cqw;background:#17333c;margin:1cqw 0;text-decoration:none}
/* תג מספר הקלף. לבן על צבע הסט היה 2.46:1 בשעון (כתום) ו-3.41:1
   במספרים — והטקסט כאן הוא כ-14px, כלומר טקסט רגיל שסף 4.5:1.
   דיו כהה על נייר הקלף עם טבעת בצבע הסט: 13.33:1 בכל חמשת
   הנושאים, וצבע הסט נשאר על המסך ועל הדף. */
.dc .no{position:absolute;inset-inline-start:50%;bottom:1cqw;transform:translateX(-50%);min-width:6cqw;height:6cqw;border-radius:3cqw;background:#fff;border:.45cqw solid var(--dcc,#0e9c8d);color:#17333c;font-weight:800;font-size:3.6cqw;line-height:5.1cqw;text-align:center;padding:0 1cqw;z-index:2}
html[dir=rtl] .dc .no{transform:translateX(50%)}
.dc .st{position:absolute;top:1.2cqw;inset-inline-start:1.8cqw;font-size:4.6cqw;font-weight:800;color:#9b6b00;line-height:1;z-index:2}
/* טבעת מיקוד מפורשת. ברירת המחדל של הדפדפן נבלעת על כפתור צבעוני,
   ומי שמנווט במקלדת לא רואה איפה הוא. אף כלל כאן אינו מבטל outline. */
button:focus-visible{outline:3px solid #6a45b0;outline-offset:2px}
.dc button.half:focus-visible{outline:3px solid #6a45b0;outline-offset:-3px}
.dc button.half .vis{padding-top:6cqw}
.dc .spk{position:absolute;top:1cqw;inset-inline-end:1cqw;width:8cqw;height:8cqw;min-width:34px;min-height:34px;border-radius:50%;background:#1f9d4d;display:flex;align-items:center;justify-content:center}
.dc .spk svg{width:60%;height:60%}
canvas#cf{display:none}
/* ===== הדפסה ===== */
#pc,#pk{display:none}
.sheet{width:210mm;height:297mm;position:relative;overflow:hidden;background:#fff;color:#17333c;break-after:page;page-break-after:always;font-family:"Heebo",system-ui,sans-serif}
/* הגיליון האחרון אינו שובר דף אחריו — אחרת יוצא דף חמישי ריק
   מהמדפסת בכל הדפסה (ארבעה גיליונות ב-#pc, אחד ב-#pk). */
.sheet:last-child{break-after:auto;page-break-after:auto}
html[lang="ar"] .sheet{font-family:var(--ar)}
html[lang="ru"] .sheet{font-family:var(--ru)}
.sheet .cut{position:absolute;top:9mm;inset-inline:0;text-align:center;font-size:3.4mm;color:#4c666e}
.sheet .cards{position:absolute;top:23.5mm;left:45mm;width:120mm;display:flex;flex-direction:column}
.sheet .cards .dc{width:120mm;height:50mm;aspect-ratio:auto}
.sheet .foot{position:absolute;bottom:7mm;inset-inline:0;text-align:center;font-size:3.2mm;color:#4c666e}
.sheet.key{padding:12mm 10mm}
.sheet.key h2{font-size:6.4mm;margin:0 0 1mm}
.sheet.key .seq{font-size:3.6mm;margin:0 0 3mm;direction:ltr;text-align:start;overflow-wrap:anywhere}
html[dir=rtl] .sheet.key .seq{text-align:right}
.sheet.key .kg{display:grid;grid-template-columns:repeat(3,1fr);gap:2.4mm 3mm}
.sheet.key .kl{font-size:3.1mm;font-weight:700;margin-bottom:.6mm}
.sheet.key .dc{width:100%;aspect-ratio:12/5}
@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff!important;font-size:16px}
  .wrap,#cf{display:none!important}
  html.pc #pc,html.pk #pk{display:block}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
