LESSONS.be=[
 ST_("I am, you are, he is, she is, it is, we are, they are. אפשר לקצר: I'm, he's.","I am وyou are وhe is وshe is وit is وwe are وthey are. يمكن الاختصار: I'm وhe's.","I am, you are, he is, she is, it is, we are, they are. Можно сократить: I'm, he's.","I am, you are, he is, she is, it is, we are, they are. We can shorten: I'm, he's.",function(){return enEx("I am a student.","She is my sister.","They are friends.")}),
 ST_("have משמעו יש לי. אצל he, she, it אומרים has: She has a dog.","have تعني عندي. مع he وshe وit نقول has: She has a dog.","have значит «у меня есть». С he, she, it говорим has: She has a dog.","have means I own something. With he, she, it we say has: She has a dog.",function(){return enEx("I have a bike.","He has a cat.")}),
 ST_("בשאלה מחליפים מקום: Is she tall? Are they here? Do you have a pen? לשלילה: is not, are not, do not have.","في السؤال نبدّل المكان: Is she tall? Are they here? Do you have a pen? للنفي: is not وare not وdo not have.","В вопросе меняем порядок: Is she tall? Are they here? Do you have a pen? Отрицание: is not, are not, do not have.","In a question we change the places: Is she tall? Are they here? Do you have a pen? For no: is not, are not, do not have.",function(){return enEx("Are you ready?","He is not here.")})];
LESSONS.pres=[
 ST_("הווה פשוט: מה שקורה תמיד או כל יום. אצל he, she, it מוסיפים s: He plays football.","المضارع البسيط: ما يحدث دائمًا أو كل يوم. مع he وshe وit نضيف s: He plays football.","Present simple: то, что бывает всегда или каждый день. С he, she, it добавляем s: He plays football.","Present simple: what happens always or every day. With he, she, it we add s: He plays football.",function(){return enEx("I walk to school every day.","She likes music.")}),
 ST_("הווה ממשיך: מה שקורה עכשיו. am/is/are + פועל עם ing: I am reading now.","المضارع المستمر: ما يحدث الآن. am/is/are + فعل مع ing: I am reading now.","Present continuous: то, что происходит сейчас. am/is/are + глагол с ing: I am reading now.","Present continuous: what is happening now. am/is/are + verb with ing: I am reading now.",function(){return enEx("Look! It is raining.","They are playing now.")}),
 ST_("מילים שעוזרות: every day, usually, always → פשוט. now, at the moment, look! → ממשיך.","كلمات تساعد: every day وusually وalways ← بسيط. now وat the moment وlook! ← مستمر.","Слова-подсказки: every day, usually, always → simple. now, at the moment, look! → continuous.","Helper words: every day, usually, always → simple. now, at the moment, look! → continuous.",function(){return enEx("He usually eats at six.","He is eating now.")})];
LESSONS.past=[
 ST_("עבר פשוט הוא משהו שנגמר. בפעלים רגילים מוסיפים ed: walk → walked, play → played.","الماضي البسيط شيء انتهى. مع الأفعال العادية نضيف ed: walk ← walked وplay ← played.","Past simple — то, что закончилось. У обычных глаголов добавляем ed: walk → walked, play → played.","Past simple is something that finished. With regular verbs we add ed: walk → walked, play → played.",function(){return enEx("Yesterday I walked to school.")}),
 ST_("יש פעלים שמשתנים: go → went, see → saw, eat → ate, have → had, buy → bought. צריך לזכור אותם.","هناك أفعال تتغير: go ← went وsee ← saw وeat ← ate وhave ← had وbuy ← bought. علينا أن نتذكرها.","Есть глаголы, которые меняются: go → went, see → saw, eat → ate, have → had, buy → bought. Их надо запомнить.","Some verbs change: go → went, see → saw, eat → ate, have → had, buy → bought. We must remember them.",function(){return enEx("We went to the beach.","She saw a movie.")}),
 ST_("בשאלה ובשלילה אומרים did ופועל רגיל: Did you go? I did not go. אחרי did לא מוסיפים ed.","في السؤال والنفي نقول did وفعلًا عاديًا: Did you go? I did not go. بعد did لا نضيف ed.","В вопросе и отрицании говорим did и обычный глагол: Did you go? I did not go. После did ed не добавляем.","In a question and in no we say did and the plain verb: Did you go? I did not go. After did we do not add ed.",function(){return enEx("Did he call you?","I did not see him.")})];
LESSONS.art=[
 ST_("a לפני עיצור: a book. an לפני תנועה: an apple. the כשמדברים על דבר מסוים.","a قبل حرف ساكن: a book. an قبل حرف علة: an apple. the عندما نتكلم عن شيء محدد.","a перед согласным: a book. an перед гласным: an apple. the когда говорим о конкретном.","a before a consonant sound: a book. an before a vowel sound: an apple. the for something special.",function(){return enEx("a dog   an egg   the sun")}),
 ST_("דברים שאפשר לספור: one book, two books. דברים שאי אפשר לספור: water, milk, rice.","أشياء تُعدّ: one book وtwo books. أشياء لا تُعدّ: water وmilk وrice.","Считаемое: one book, two books. Несчитаемое: water, milk, rice.","Things we can count: one book, two books. Things we cannot count: water, milk, rice.",function(){return enEx("three apples","some water")}),
 ST_("many לדברים שאפשר לספור: many books. much לדברים שאי אפשר לספור: much water. some בחיובי, any בשאלה ובשלילה.","many للأشياء التي تُعدّ: many books. much لما لا يُعدّ: much water. some في الإثبات وany في السؤال والنفي.","many для считаемого: many books. much для несчитаемого: much water. some в утверждении, any в вопросе и отрицании.","many for things we count: many books. much for things we cannot count: much water. some in yes sentences, any in questions and no sentences.",function(){return enEx("How many books do you have?","I don't have any milk.")})];

 ST_("בהווה: is/are + צורה שלישית. English is spoken here. בעבר: was/were + צורה שלישית.","في المضارع: is/are + التصريف الثالث. English is spoken here. في الماضي: was/were + التصريف الثالث.","В настоящем: is/are + третья форма. English is spoken here. В прошедшем: was/were + третья форма.","In the present: is/are + third form. English is spoken here. In the past: was/were + third form.",function(){return enEx("Milk is sold in shops.","The book was written in 1990.")}),
 ST_("אפשר להוסיף מי עשה עם by: The song was sung by Noa.","يمكن أن نضيف من فعل مع by: The song was sung by Noa.","Можно добавить, кто сделал, с by: The song was sung by Noa.","We can add who did it with by: The song was sung by Noa.",function(){return enEx("The picture was painted by my sister.")})];
LESSONS.rel=[
 ST_("who לאנשים, which לדברים, that לשניהם. The girl who sings is my friend.","who للأشخاص وwhich للأشياء وthat للاثنين. The girl who sings is my friend.","who для людей, which для вещей, that для обоих. The girl who sings is my friend.","who for people, which for things, that for both. The girl who sings is my friend.",function(){return enEx("This is the book which I like.")}),
 ST_("דיבור עקיף: מספרים מה מישהו אמר וחוזרים צעד אחורה. \"I am tired,\" she said → She said she was tired.","الكلام المنقول: نحكي ما قاله أحدهم ونرجع خطوة إلى الماضي. \"I am tired,\" she said ← She said she was tired.","Косвенная речь: пересказываем, что сказал человек, и сдвигаем время назад. \"I am tired,\" she said → She said she was tired.","Reported speech: we tell what someone said and go one step back. \"I am tired,\" she said → She said she was tired.",function(){return enEx("He said, \"I like pizza.\"","He said he liked pizza.")}),
 ST_("בשאלה בדיבור עקיף אומרים if ובלי do: He asked, \"Do you like it?\" → He asked if I liked it.","في السؤال المنقول نقول if وبدون do: He asked, \"Do you like it?\" ← He asked if I liked it.","В косвенном вопросе говорим if и без do: He asked, \"Do you like it?\" → He asked if I liked it.","In a reported question we use if and no do: He asked, \"Do you like it?\" → He asked if I liked it.",function(){return enEx("She asked if I was hungry.")})];
LESSONS.pv=[
 ST_("פועל דו־מילתי: פועל ועוד מילה קטנה, והמשמעות משתנה. give up = לוותר. look for = לחפש.","فعل مركّب: فعل وكلمة صغيرة ويتغير المعنى. give up = يستسلم. look for = يبحث عن.","Фразовый глагол: глагол и маленькое слово, значение меняется. give up = сдаться. look for = искать.","A phrasal verb: a verb and a small word, and the meaning changes. give up = stop trying. look for = search.",function(){return enEx("Never give up!")}),
 ST_("עוד: turn on (להדליק), turn off (לכבות), put on (ללבוש), take off (להסיר).","أخرى: turn on (يشغّل) وturn off (يطفئ) وput on (يلبس) وtake off (يخلع).","Ещё: turn on (включить), turn off (выключить), put on (надеть), take off (снять).","More: turn on, turn off, put on, take off.",function(){return enEx("Please turn off the light.")}),
 ST_("צירופים הולכים יחד: make a cake, do homework, take a photo, have lunch.","متلازمات تذهب معًا: make a cake وdo homework وtake a photo وhave lunch.","Сочетания идут вместе: make a cake, do homework, take a photo, have lunch.","Some words go together: make a cake, do homework, take a photo, have lunch.",function(){return enEx("I do my homework at four.")})];
LESSONS.conn=[
 ST_("and מוסיף. but מראה ניגוד. or נותן בחירה. because נותן סיבה. so נותן תוצאה.","and يضيف. but يدل على التناقض. or يعطي خيارًا. because يعطي السبب. so يعطي النتيجة.","and добавляет. but показывает контраст. or даёт выбор. because — причина. so — результат.","and adds. but shows a difference. or gives a choice. because gives a reason. so gives a result.",function(){return enEx("I was tired, so I went to bed.")}),
 ST_("although = למרות ש. Although it was cold, we went out. however פותח משפט חדש: It was cold. However, we went out.","although = رغم أن. Although it was cold, we went out. however تبدأ جملة جديدة: It was cold. However, we went out.","although = хотя. Although it was cold, we went out. however начинает новое предложение: It was cold. However, we went out.","although = even if. Although it was cold, we went out. however starts a new sentence: It was cold. However, we went out.",function(){return enEx("Although I was tired, I finished.")}),
 ST_("בכתיבה: פותחים ברעיון, נותנים סיבה ודוגמה, וסוגמים. First, Then, Finally.","في الكتابة: نبدأ بالفكرة ونعطي سببًا ومثالًا ونختم. First وThen وFinally.","В письме: начинаем с идеи, даём причину и пример и заканчиваем. First, Then, Finally.","In writing: start with an idea, give a reason and an example, and end. First, Then, Finally.",function(){return enEx("First, I get up. Then I eat. Finally, I go to school.")})];
LESSONS.read9=[
 ST_("הסקה: הטקסט לא אומר הכול במילים. מחברים רמזים ומבינים. הוא חיפש את המפתחות ופתח את הדלת, כנראה מצא אותם.","الاستنتاج: النص لا يقول كل شيء بالكلمات. نربط التلميحات ونفهم. بحث عن المفاتيح ثم فتح الباب، فغالبًا وجدها.","Вывод: текст не говорит всё словами. Соединяем подсказки и понимаем. Он искал ключи и открыл дверь, значит, нашёл их.","An inference: the text does not say everything in words. We join the clues and understand. He looked for his keys and opened the door, so he probably found them.",function(){return enEx("Tom opened the door with a smile.","He is happy to be home.")}),
 ST_("למה הטקסט נכתב? ללמד, לשכנע או לספר. לשכנע: should, must, we need to.","لماذا كُتب النص؟ ليعلّم أو يقنع أو يحكي. للإقناع: should وmust وwe need to.","Зачем написан текст? Рассказать, убедить или развлечь. Убеждение: should, must, we need to.","Why was the text written? To teach, to persuade or to tell a story. Persuade: should, must, we need to.",function(){return enEx("We should plant more trees.")}),
 ST_("מילה חדשה: בודקים מילים לפניה ואחריה. but מראה ניגוד, because מראה סיבה.","كلمة جديدة: نفحص الكلمات قبلها وبعدها. but يدل على التناقض وbecause يدل على السبب.","Новое слово: смотрим на слова до и после. but — контраст, because — причина.","A new word: check the words before and after. but shows a difference, because shows a reason.",function(){return enEx("He was reluctant to go, but his mum asked him.")})];
