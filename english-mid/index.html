LESSONS.be=[
 ST_("I am, you are, he is, she is, it is, we are, they are. אפשר לקצר: I'm, he's.","I am وyou are وhe is وshe is وit is وwe are وthey are. يمكن الاختصار: I'm وhe's.","I am, you are, he is, she is, it is, we are, they are. Можно сократить: I'm, he's.","I am, you are, he is, she is, it is, we are, they are. We can shorten: I'm, he's.",function(){return enEx("I am a student.","She is my sister.","They are friends.")}),
 ST_("have משמעו יש לי. אצל he, she, it אומרים has: She has a dog.","have تعني عندي. مع he وshe وit نقول has: She has a dog.","have значит «у меня есть». С he, she, it говорим has: She has a dog.","have means I own something. With he, she, it we say has: She has a dog.",function(){return enEx("I have a bike.","He has a cat.")}),
 ST_("בשאלה מחליפים מקום: Is she tall? Are they here? Do you have a pen? לשלילה: is not, are not, do not have.","في السؤال نبدّل المكان: Is she tall? Are they here? Do you have a pen? للنفي: is not وare not وdo not have.","В вопросе меняем порядок: Is she tall? Are they here? Do you have a pen? Отрицание: is not, are not, do not have.","In a question we change the places: Is she tall? Are they here? Do you have a pen? For no: is not, are not, do not have.",function(){return enEx("Are you ready?","He is not here.")})];
LESSONS.pres=[
 ST_("הווה פשוט: מה שקורה תמיד או כל יום. אצל he, she, it מוסיפים s: He plays football.","المضارع البسيط: ما يحدث دائمًا أو كل يوم. مع he وshe وit نضيف s: He plays football.","Present simple: то, что бывает всегда или каждый день. С he, she, it добавляем s: He plays football.","Present simple: what happens always or every day. With he, she, it we add s: He plays football.",function(){return enEx("I walk to school every day.","She likes music.")}),
 ST_("הווה ממשיך: מה שקורה עכשיו. am/is/are + פועל עם ing: I am reading now.","المضارع المستمر: ما يحدث الآن. am/is/are + فعل مع ing: I am reading now.","Present continuous: то, что происходит сейчас. am/is/are + глагол с ing: I am reading now.","Present continuous: what is happening now. am/is/are + verb with ing: I am reading now.",function(){return enEx("Look! It is raining.","They are playing now.")}),
 ST_("מילים שעוזרות: every day, usually, always → פשוט. now, at the moment, look! → ממשיך.","كلمات تساعد: every day وusually وalways ← بسيط. now وat the moment وlook! ← مستمر.","Слова-подсказки: every day, usually, always → simple. now, at the moment, look! → continuous.","Helper words: every day, usually, always → simple. now, at the moment, look! → continuous.",function(){return enEx("He usually eats at six.","He is eating now.")})];
LESSONS.past=[
 ST_("עבר פשוט הוא משהו שנגמר. בפעלים רגילים מוסיפים ed: walk → walked, play → played.","الماضي البسيط شيء انتهى. مع الأفعال العادية نضيف ed: walk ← walked وplay ← played.","Past simple — то, что закончилось. У обычных глаголов добавляем ed: walk → walked, play → played.","Past simple is something that finished. With regular verbs we add ed: walk → walked, play → played.",function(){return enEx("Yesterday I walked to school.")}),
 ST_("יש פעלים שמשתנים: go → went, see → saw, eat → ate, have → had, buy → bought. צריך לזכור אותם.","هناك أفعال تتغير: go ← went وsee ← saw وeat ← ate وhave ← had وbuy ← bought. علينا أن نتذكرها.","Есть глаголы, которые меняются: go → went, see → saw, eat → ate, have → had, buy → bought. Их надо запомнить.","Some verbs change: go → went, see → saw, eat → ate, have → had, buy → bought. We must remember them.",function(){return enEx("We went to the beach.","She saw a movie.")}),
 ST_("בשאלה ובשלילה אומרים did ופועל רגיל: Did you go? I did not go. אחרי did לא מוסיפים ed.","في السؤال والنفي نقول did وفعلًا عاديًا: Did you go? I did not go. بعد did لا نضيف ed.","В вопросе и отрицании говорим did и обычный глагол: Did you go? I did not go. После did ed не добавляем.","In a question and in no we say did and the plain verb: Did you go? I did not go. After did we do not add ed.",function(){return enEx("Did he call you?","I did not see him.")})];
LESSONS.art=[
 ST_("a לפני עיצור: a book. an לפני תנועה: an apple. the כשמדברים על דבר מסוים.","a قبل حرف ساكن: a book. an قبل حرف علة: an apple. the عندما نتكلم عن شيء محدد.","a перед согласным: a book. an перед гласным: an apple. the когда говорим о конкретном.","a before a consonant sound: a book. an before a vowel sound: an apple. the for something special.",function(){return enEx("a dog   an egg   the sun")}),
 ST_("דברים שאפשר לספור: one book, two books. דברים שאי אפשר לספור: water, milk, rice.","أشياء تُعدّ: one book وtwo books. أشياء لا تُعدّ: water وmilk وrice.","Считаемое: one book, two books. Несчитаемое: water, milk, rice.","Things we can count: one book, two books. Things we cannot count: water, milk, rice.",function(){return enEx("three apples","some water")}),
 ST_("many לדברים שאפשר לספור: many books. much לדברים שאי אפשר לספור: much water. some בחיובי, any בשאלה ובשלילה.","many للأشياء التي تُعدّ: many books. much لما لا يُعدّ: much water. some في الإثبات وany في السؤال والنفي.","many для считаемого: many books. much для несчитаемого: much water. some в утверждении, any в вопросе и отрицании.","many for things we count: many books. much for things we cannot count: much water. some in yes sentences, any in questions and no sentences.",function(){return enEx("How many books do you have?","I don't have any milk.")})];

 ST_("מקום: next to (ליד), behind (מאחורי), between (בין), in front of (מול).","المكان: next to (بجانب) وbehind (خلف) وbetween (بين) وin front of (أمام).","Место: next to (рядом), behind (за), between (между), in front of (перед).","Place: next to, behind, between, in front of.",function(){return enEx("The cat is behind the sofa.","The bank is next to the shop.")}),
 ST_("מילות שאלה: who (מי), what (מה), where (איפה), when (מתי), why (למה), how (איך).","كلمات السؤال: who (من) وwhat (ماذا) وwhere (أين) وwhen (متى) وwhy (لماذا) وhow (كيف).","Вопросительные слова: who (кто), what (что), where (где), when (когда), why (почему), how (как).","Question words: who, what, where, when, why, how.",function(){return enEx("Where do you live?","When is the party?")})];
LESSONS.v7=[

LESSONS.comp=[
 ST_("מילה קצרה: מוסיפים er. big → bigger, tall → taller. אחר כך than: Dan is taller than Ron.","كلمة قصيرة: نضيف er. big ← bigger وtall ← taller. ثم than: Dan is taller than Ron.","Короткое слово: добавляем er. big → bigger, tall → taller. Потом than: Dan is taller than Ron.","Short word: add er. big → bigger, tall → taller. Then than: Dan is taller than Ron.",function(){return enEx("My bag is heavier than yours.")}),

 ST_("שלוש מילים מיוחדות: good → better → the best. bad → worse → the worst. far → farther → the farthest.","ثلاث كلمات خاصة: good ← better ← the best. bad ← worse ← the worst. far ← farther ← the farthest.","Три особых слова: good → better → the best. bad → worse → the worst. far → farther → the farthest.","Three special words: good → better → the best. bad → worse → the worst. far → farther → the farthest.",function(){return enEx("This is the best day!")})];
LESSONS.fut=[

 ST_("going to: תוכנית שכבר יש לי, או משהו שרואים שיקרה. I am going to visit my aunt. Look at the clouds! It is going to rain.","going to: خطة عندي أو شيء نرى أنه سيحدث. I am going to visit my aunt. Look at the clouds! It is going to rain.","going to: уже есть план или видно, что случится. I am going to visit my aunt. Look at the clouds! It is going to rain.","going to: a plan I already have, or something we can see coming. I am going to visit my aunt. Look at the clouds! It is going to rain.",function(){return enEx("We are going to travel in July.")}),
 ST_("מילים לעתיד: tomorrow, next week, soon, in two days. אחרי will בא פועל בלי to.","كلمات المستقبل: tomorrow وnext week وsoon وin two days. بعد will يأتي فعل بلا to.","Слова будущего: tomorrow, next week, soon, in two days. После will идёт глагол без to.","Future words: tomorrow, next week, soon, in two days. After will comes a verb without to.",function(){return enEx("She will call you tomorrow.")})];

LESSONS.mod=[
 ST_("can: אני יכול. can't: אני לא יכול. אחרי can בא פועל בלי to: I can swim.","can: أستطيع. can't: لا أستطيع. بعد can يأتي فعل بلا to: I can swim.","can: я могу. can't: я не могу. После can идёт глагол без to: I can swim.","can: I am able. can't: I am not able. After can comes a verb without to: I can swim.",function(){return enEx("She can play the piano.")}),

LESSONS.cond=[

 ST_("אם משהו לא אמיתי: if + עבר, would + פועל. If I had a car, I would drive to Eilat.","إذا كان شيء غير حقيقي: if + ماضٍ وwould + فعل. If I had a car, I would drive to Eilat.","Если что-то нереально: if + прошедшее, would + глагол. If I had a car, I would drive to Eilat.","If something is not real: if + past, would + verb. If I had a car, I would drive to Eilat.",function(){return enEx("If I were a bird, I would fly.")}),
