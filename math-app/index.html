<!doctype html>
<html lang="he" dir="rtl" data-theme="ocean">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>מתמטיקה לחכמים שמתקשים</title>
<meta name="description" content="אפליקציית תרגול מתמטיקה למתקשים בלמידה ולילדים שלומדים אחרת — חיית מחמד מלווה, הקראה קולית, רמזים ויזואליים והמון עידוד." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Rubik:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --ar:"Noto Sans Arabic",system-ui,"Segoe UI",Arial,sans-serif;
  --font-display:"Fredoka","Rubik",sans-serif; --font-body:"Rubik",sans-serif;
  --paper:#f3f8f4; --card:#ffffff; --ink:#17333c; --ink-soft:#4c666e; --ink-faint:#5a7178;
  --teal:#0e9c8d; --teal-deep:#0b7568; --teal-soft:#d9f2ec;
  --amber:#ffc531; --amber-deep:#8a6100; --amber-soft:#fff3ce;
  --coral:#ff6f61; --coral-deep:#ba3826; --coral-soft:#ffe3de;
  --sky:#58b7e0; --sky-deep:#246c8c; --sky-soft:#dff1fa;
  --violet:#8a63d2; --violet-deep:#6a45b0; --violet-soft:#ece4fa;
  --hit:#ffc531; --hit-ink:#1a1300;
}

/* Heebo, Fredoka ו-Assistant אינם מכילים גליפים ערביים. בלי
   המשפחה הזאת הממשק הערבי נופל לגופן ברירת המחדל של המערכת —
   נמדד: הוא הוצג כאן ב-Fredoka. Noto Sans Arabic נטען מאותה בקשת
   גופנים שכבר קיימת, ולכן אין כאן תלות חיצונית חדשה, וקובצי
   הגופן נמשכים רק כשבאמת מוצג טקסט ערבי. */
html[lang="ar"] body,html[lang="ar"] input,html[lang="ar"] button,
html[lang="ar"] textarea,html[lang="ar"] select{font-family:var(--ar)}
/* לכל פעולת חשבון יש צבע קבוע. ילד לומד את הצבע לפני שהוא
   קורא את המילה, וזה עוזר במיוחד למי שהקריאה עצמה מאמצת אותו. */
.op-add{--op:var(--teal);--op-d:var(--teal-deep);--op-s:var(--teal-soft)}
.op-sub{--op:var(--coral);--op-d:var(--coral-deep);--op-s:var(--coral-soft)}
.op-mul{--op:var(--amber);--op-d:var(--amber-deep);--op-s:var(--amber-soft)}
.op-div{--op:var(--sky);--op-d:var(--sky-deep);--op-s:var(--sky-soft)}
.opdot{display:inline-block;width:13px;height:13px;border-radius:5px;background:var(--op);
  border:2px solid var(--op-d);flex-shrink:0;vertical-align:-2px}
.opchip{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:.88rem;
  color:var(--op-d);background:var(--op-s);border:2px solid var(--op);border-radius:99px;padding:5px 16px}
/* פס צבע בראש כרטיס השאלה, בצבע הפעולה */
.card.opcard{box-shadow:0 12px 0 rgba(23,51,60,.12),inset 0 10px 0 var(--op)}
html[data-theme="grape"]{ --paper:#f7f4fc; --teal:#8a63d2; --teal-deep:#6a45b0; --teal-soft:#ece4fa; --sky:#4db8a4; --sky-deep:#358d7c; --sky-soft:#dff4ee; }
html[data-theme="berry"]{ --paper:#fdf2f5; --teal:#d94f70; --teal-deep:#b03a57; --teal-soft:#fbdde6; --sky:#4fb3c9; --sky-deep:#35899d; --sky-soft:#ddf1f6; }
*{box-sizing:border-box;margin:0}
body{font-family:var(--font-body);background:var(--paper);color:var(--ink);overflow-x:hidden;line-height:1.6}
::selection{background:var(--amber);color:var(--ink)}
/* המילה שנאמרת ברגע זה. שאר האפליקציות מדגישות אותה כבר, וכאן
   לא היה שום סימון — ילד שמאזין איבד את המקום בטקסט. */
.wd{border-radius:5px;padding:1px 3px}
.wd.hit{background:var(--hit);color:var(--hit-ink);font-weight:600}
/* כשהמנוע אינו מדווח על גבולות מילים, או כשהמחרוזת הנאמרת אינה
   מתלכדת עם המוצגת — מודגש כל האיבר במקום מילה בודדת. */
.now{background:var(--hit);color:var(--hit-ink);border-radius:10px;
  box-shadow:0 0 0 5px var(--hit)}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font-family:inherit;color:var(--ink)}
html.large-text{font-size:118%}
html.spaced body{letter-spacing:.015em;word-spacing:.12em;line-height:1.85}
/* ===== נגישות ===== */
/* שלושה גדלי טקסט. משנים את גודל הבסיס, וכל האפליקציה גדלה יחד איתו,
   כי כל המידות בנויות ב-rem. */
html.ts2{font-size:113%}
html.ts3{font-size:128%}
/* פונט ברור לקריאה. Tahoma ו-Verdana קיימים בכל מחשב וכוללים
   עברית, ערבית, רוסית ואנגלית — בניגוד לפונטים ייעודיים לקריאה
   נגישה שקיימים באותיות לטיניות בלבד. */
html.clear-font{--font-display:Tahoma,Verdana,Arial,sans-serif;--font-body:Tahoma,Verdana,Arial,sans-serif}
/* ניגודיות גבוהה: שחור על לבן, בלי גוונים רכים, עם מסגרות ברורות. */
html.hi-contrast{
  --paper:#ffffff;--card:#ffffff;--ink:#000000;--ink-soft:#161616;--ink-faint:#333333;
  --teal:#00584e;--teal-deep:#00352e;--teal-soft:#e8f2f0;
  --amber:#7a5500;--amber-deep:#523900;--amber-soft:#fbf3e2;
  --coral:#9c1f16;--coral-deep:#73160f;--coral-soft:#fbe8e6;
  --sky:#00517a;--sky-deep:#003651;--sky-soft:#e7f0f6;
  --hit:#ffe600;--hit-ink:#000000;
}
html.hi-contrast .bg{display:none}
html.hi-contrast .op-add,html.hi-contrast .op-sub,html.hi-contrast .op-mul,html.hi-contrast .op-div{
  --op:#000;--op-d:#000;--op-s:#fff}
html.hi-contrast .lvl{--lv:#000}
html.hi-contrast .lvl .n{background:#000;color:#fff}
html.hi-contrast .card.opcard{box-shadow:none}
html.hi-contrast .card,html.hi-contrast .opt,html.hi-contrast .tog,
html.hi-contrast .chip,html.hi-contrast .pick,html.hi-contrast .tile{border:2px solid #000}
html.hi-contrast .btn{border:2px solid #000}
/* טבלת מקשי הקיצור בהגדרות */
.keys{display:grid;gap:8px;margin-top:12px}
.keys div{display:flex;align-items:center;gap:10px;color:var(--ink-soft);font-size:.95rem}
.keys kbd{font-family:var(--font-display);font-weight:700;background:var(--paper);border:2px solid rgba(23,51,60,.18);
  border-radius:8px;padding:4px 11px;min-width:38px;text-align:center;color:var(--ink);font-size:.9rem}
.fd{font-family:var(--font-display)}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
/* ambient graph paper */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background-image:linear-gradient(to left,rgba(14,156,141,.07) 1px,transparent 1px),linear-gradient(to bottom,rgba(14,156,141,.07) 1px,transparent 1px);background-size:28px 28px}
.bg .blob{position:absolute;border-radius:50%}
.bg .b1{top:-96px;right:-96px;width:380px;height:380px;background:radial-gradient(circle,rgba(255,197,49,.28),transparent 70%);opacity:.5}
.bg .b2{bottom:-120px;left:-96px;width:430px;height:430px;background:radial-gradient(circle,rgba(14,156,141,.22),transparent 70%);opacity:.5}
.bg .b3{top:33%;left:24%;width:290px;height:290px;background:radial-gradient(circle,rgba(255,111,97,.15),transparent 70%);opacity:.45}
.fl{position:absolute;font-family:var(--font-display);font-weight:700;color:var(--ink);opacity:.06;user-select:none;animation:floaty var(--d,16s) ease-in-out var(--dl,0s) infinite alternate}
@keyframes floaty{from{transform:translateY(0) rotate(var(--r,0deg))}to{transform:translateY(-22px) rotate(calc(var(--r,0deg) + 7deg))}}
#app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}
/* בלי זה כרום מותח כל מסך לרוחב המינימלי של התוכן שלו,
   ואז כל העמוד גולש הצידה בטלפון. */
#app>*{min-width:0;width:100%}
/* header */
header{background:color-mix(in srgb,var(--paper) 85%,transparent);backdrop-filter:blur(6px);border-bottom:3px solid rgba(23,51,60,.08);position:sticky;top:0;z-index:30}
.hbar{display:flex;align-items:center;gap:14px;padding-block:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:12px}
.logo .mark{width:44px;height:44px;border-radius:16px;background:var(--ink);color:var(--amber);display:grid;place-items:center;box-shadow:0 6px 0 rgba(23,51,60,.15);transition:transform .2s}
.logo:hover .mark{transform:rotate(8deg) scale(1.05)}
.logo b{display:block;font-size:1.05rem;line-height:1.1}
.logo small{color:var(--teal-deep);font-weight:600;font-size:.78rem}
nav{display:flex;gap:6px;margin-inline-start:auto;flex-wrap:wrap}
.nb{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:9px 15px;font-family:var(--font-display);font-weight:600;font-size:.95rem;border:2px solid rgba(23,51,60,.1);background:var(--card);color:var(--ink-soft);transition:all .15s}
.nb:hover{border-color:rgba(23,51,60,.35);transform:translateY(-1px)}
.nb.on{background:var(--ink);color:var(--paper);box-shadow:0 5px 0 rgba(23,51,60,.2);transform:rotate(-1deg)}
.chip{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:8px 14px;font-weight:600;font-size:.85rem;border:2px solid rgba(23,51,60,.12);background:var(--card);color:var(--ink-soft);transition:all .15s}
.chip:hover{border-color:var(--teal);color:var(--teal-deep);transform:translateY(-1px)}
.chip.ok{background:var(--teal-deep);color:#fff;border-color:var(--teal-deep)}
.xpchip{display:inline-flex;align-items:center;gap:10px;background:var(--card);border:2px solid rgba(23,51,60,.1);border-radius:999px;padding:5px 16px 5px 6px}
[dir="ltr"] .xpchip{padding:5px 6px 5px 16px}
.xpchip svg{display:block}
/* buttons & cards */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-family:var(--font-display);font-weight:700;border-radius:18px;transition:transform .15s,box-shadow .15s,background .2s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(3px)!important;box-shadow:0 1px 0 rgba(23,51,60,.15)!important}
.btn-teal{background:var(--teal-deep);color:#fff;box-shadow:0 6px 0 var(--teal-deep)}
.btn-teal:hover{filter:brightness(1.12)}
.btn-amber{background:var(--amber);color:var(--ink);box-shadow:0 6px 0 var(--amber-deep)}
.btn-amber:hover{background:var(--amber-deep);color:#fff}
.btn-ink{background:var(--ink);color:var(--paper);box-shadow:0 6px 0 rgba(23,51,60,.35)}
.btn-ghost{background:var(--card);border:2px solid rgba(23,51,60,.15);box-shadow:0 5px 0 rgba(23,51,60,.1)}
.btn-coral{background:var(--coral);color:#fff;box-shadow:0 6px 0 var(--coral-deep)}
/* מודול המבחן הכיתתי הועתק ממשפחת math-uni, ושם .btn-p ו-.btn.w
   מוגדרים. כאן הם לא היו, ולכן "מבחן חדש", "צרו את המבחן", "התחלת
   מבחן" וכפתורי הוואטסאפ נראו ככפתור ריק בלי צבע — טקסט קטן עם פלוס.
   כחול, ולא טורקיז: זה כפתור של המורה, ובולט מכל שאר המסך. */
.btn-p{background:#2563eb;color:#fff;box-shadow:0 6px 0 #1e40af}
.btn-p:hover{filter:brightness(1.1)}
.btn.w{width:100%}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none!important}
.card{background:var(--card);border:3px solid var(--ink);border-radius:30px;box-shadow:0 12px 0 rgba(23,51,60,.12)}
/* animations */
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.06);opacity:.85}}
@keyframes bulb{0%,100%{filter:drop-shadow(0 0 0 rgba(255,197,49,0))}50%{filter:drop-shadow(0 0 9px rgba(255,197,49,.95))}}
@keyframes caret{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
.bob{animation:bob 3.2s ease-in-out infinite}
.wig{animation:wiggle .55s ease-in-out}
.pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.shake{animation:shake .45s ease-in-out}
.rise{animation:rise .55s cubic-bezier(.2,.9,.3,1) both}
.pulse{animation:pulse 2.6s ease-in-out infinite}
.bulb{animation:bulb 1.8s ease-in-out infinite}
.caret{display:inline-block;width:3px;height:1.05em;background:var(--teal);border-radius:3px;margin-inline-start:4px;vertical-align:middle;animation:caret .9s step-end infinite}
.spin{animation:spin .9s linear infinite}
html.reduce-motion *{animation:none!important;transition:none!important}
/* העדפת מערכת ההפעלה מקבלת בדיוק מה שהמתג הפנימי נותן. קודם היא
   קיבלה רשימה חלקית, ו-.spin ,.brc ו-.sm-d.p המשיכו לזוז. */
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* טבעת פוקוס — שמונה האפליקציות האחרות מגדירות אותה, זו לא. */
:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
/* practice */
.lvlbar{display:flex;gap:8px;overflow-x:auto;padding:6px 2px;scrollbar-width:thin}
.lvl{display:inline-flex;align-items:center;gap:7px;flex-shrink:0;font-family:var(--font-display);font-weight:600;font-size:.88rem;border-radius:999px;border:2.5px solid rgba(23,51,60,.15);background:var(--card);color:var(--ink-soft);padding:7px 14px;transition:all .15s}
.lvl:hover{border-color:var(--amber);color:var(--amber-deep)}
.lvl.on{border-color:var(--ink);background:var(--amber);color:var(--ink);box-shadow:0 4px 0 var(--amber-deep);transform:rotate(-1deg)}
.lvl .n{width:20px;height:20px;border-radius:50%;background:var(--lv,rgba(23,51,60,.08));
  color:#fff;display:grid;place-items:center;font-size:.72rem;font-weight:700}
/* צבעי הרמות קבועים ולא נגזרים מהערכה, כי ערכת ״ענבים״ מחליפה
   את הטורקיז בסגול — ואז שתי רמות היו מקבלות אותו צבע בדיוק.
   חוץ מזה, ״רמה 5 היא סגולה״ עדיף שיישאר נכון בכל ערכה. */
.lvl.l1{--lv:#2e86ad}
.lvl.l2{--lv:#0b7568}
.lvl.l3{--lv:#d99a00}
.lvl.l4{--lv:#d94f42}
.lvl.l5{--lv:#6a45b0}
.lvl.l6{--lv:#17333c}
.lvl.l6 .n{color:var(--amber)}
.lvl.on .n{background:var(--ink);color:var(--amber)}
/* גם הטבעת סביב הכפתור מקבלת את צבע הרמה, כדי שרואים את הסולם
   גם בלי לקרוא את המספרים */
.lvl{border-color:var(--lv,rgba(23,51,60,.15))!important}
.lvl.on{border-color:var(--ink)!important}
.dots{display:flex;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid rgba(23,51,60,.2);background:transparent}
.dot.ok{background:var(--teal);border-color:var(--teal-deep)}
.dot.no{background:var(--coral);border-color:var(--coral-deep)}
.dot.sk{background:var(--sky);opacity:.6}
.opt{font-family:var(--font-display);font-weight:700;font-size:2.1rem;border-radius:18px;border:3px solid rgba(23,51,60,.15);background:var(--paper);padding:22px 10px;transition:all .15s;box-shadow:0 6px 0 rgba(23,51,60,.12)}
.opt:hover:not([disabled]){border-color:var(--op,var(--teal));background:var(--op-s,var(--teal-soft));transform:translateY(-2px)}
.opt.right{border-color:var(--teal-deep);background:var(--teal-deep);color:#fff;box-shadow:0 6px 0 var(--teal-deep)}
.opt.wrong{border-color:rgba(255,111,97,.4);background:var(--coral-soft);color:rgba(217,79,66,.5);text-decoration:line-through;cursor:not-allowed}
.opt.flash{border-color:var(--coral);background:var(--coral-soft);color:var(--coral-deep)}
/* מצב המבחן הכיתתי בלבד. הכפתור שם נושא תג מספר (.k) לצד הערך
   (.m), ולא רק ערך כמו בתרגול — ולכן הוא שורה, לא הריבוע הענק
   שלמעלה. בלי הכלל הזה .k נופל לטקסט inline רגיל ונדבק ל-.m:
   התשובה 18 בכפתור הראשון מוצגת "118", וארבעה כפתורים נפרשים
   בשורה אחת כי ל-.opts אין display. הסימון הועתק לכאן ממשפחת
   החידון, וה-CSS שלו לא בא איתו. */
.opts{display:grid;gap:12px;margin-top:18px}
@media(min-width:520px){.opts{grid-template-columns:1fr 1fr}}
.opts .opt{display:flex;align-items:center;gap:12px;text-align:start;width:100%;font-size:1.5rem;padding:14px 16px;min-height:3.4rem}
.opts .opt .k{flex:none;width:2rem;height:2rem;border-radius:10px;background:var(--teal-soft);color:var(--teal-deep);display:inline-flex;align-items:center;justify-content:center;font-size:.9rem;font-weight:800}
.opts .opt .m{direction:ltr}
.opts .opt.right .k{background:var(--paper);color:var(--teal-deep)}
.hintpill{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:12px;background:var(--amber);color:var(--ink);font-family:var(--font-display);font-weight:700;font-size:1.15rem;border-radius:18px;padding:15px 24px;box-shadow:0 6px 0 var(--amber-deep);transition:all .15s}
.hintpill:hover{background:var(--amber-deep);color:#fff;transform:translateY(-2px)}
.hintpill .cnt{position:absolute;top:-9px;inset-inline-start:-9px;background:var(--coral);color:#fff;font-size:.72rem;width:27px;height:27px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--card)}
.bubble{position:relative;background:var(--card);border:3px solid var(--ink);border-radius:22px;padding:16px 20px;box-shadow:0 7px 0 rgba(23,51,60,.13);font-size:1.05rem;font-weight:500;line-height:1.65}
.bubble::after{content:"";position:absolute;bottom:-10px;inset-inline-start:40px;width:16px;height:16px;background:var(--card);border-inline-start:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(-45deg)}
[dir="ltr"] .bubble::after{transform:rotate(45deg);border:none;border-inline-end:3px solid var(--ink);border-bottom:3px solid var(--ink)}
.shelf{display:flex;flex-wrap:wrap;gap:6px}
.stk{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:1.15rem;border:2px solid rgba(23,51,60,.08);background:var(--paper)}
.stk.got{background:var(--amber-soft);border-color:rgba(255,197,49,.55)}
.stk.miss{opacity:.38;filter:grayscale(1)}
.bar{height:10px;background:rgba(23,51,60,.08);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--teal);transition:width .6s cubic-bezier(.2,.9,.3,1)}
/* breathing overlay */
.overlay{position:fixed;inset:0;background:rgba(23,51,60,.55);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:60;padding:20px}
.brc{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,var(--teal-soft),var(--teal) 75%);display:grid;place-items:center;color:#fff;font-family:var(--font-display);font-weight:700;font-size:1.1rem;text-align:center;animation:br 8s ease-in-out infinite;box-shadow:0 0 0 12px rgba(255,255,255,.15)}
@keyframes br{0%,100%{transform:scale(.8)}45%,55%{transform:scale(1.12)}}
/* settings */
.tog{display:flex;align-items:center;gap:16px;text-align:start;width:100%;background:var(--paper);border:2px solid rgba(23,51,60,.1);border-radius:18px;padding:15px 18px;transition:background .2s}
.tog:hover{background:var(--teal-soft)}
.tog+.tog{margin-top:12px}
.sw{position:relative;width:56px;height:32px;border-radius:99px;background:rgba(23,51,60,.12);border:2px solid rgba(23,51,60,.15);flex-shrink:0;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.tog[aria-checked="true"] .sw{background:var(--teal);border-color:var(--teal-deep)}
.tog[aria-checked="true"] .sw::after{transform:translateX(-24px)}
[dir="ltr"] .tog[aria-checked="true"] .sw::after{transform:translateX(24px)}
.swb{display:inline-block;font-size:.62rem;font-weight:700;background:var(--amber);color:var(--ink);border-radius:99px;padding:2px 9px;margin-inline-start:8px;vertical-align:middle}
input[type=range]{width:100%;accent-color:var(--teal)}
.vrow{display:flex;align-items:center;gap:12px;margin-top:9px;padding:12px 16px;border-radius:16px;border:2.5px solid rgba(23,51,60,.1);background:var(--paper);cursor:pointer;transition:all .15s}
.vrow:hover{border-color:rgba(23,51,60,.3)}
.vrow.on{border-color:var(--teal);background:var(--teal-soft);box-shadow:0 5px 0 rgba(14,156,141,.25)}
.vrow .rd{width:20px;height:20px;border-radius:50%;border:2.5px solid rgba(23,51,60,.25);display:grid;place-items:center;flex-shrink:0}
.vrow.on .rd{border-color:var(--teal)}
.vrow.on .rd::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--teal)}
.badge{font-size:.68rem;font-weight:700;border-radius:99px;padding:2.5px 10px;white-space:nowrap}
.b-gold{background:var(--amber-soft);color:var(--amber-deep);border:1px solid rgba(255,197,49,.6)}
.b-teal{background:var(--teal-soft);color:var(--teal-deep);border:1px solid rgba(14,156,141,.35)}
.b-mut{background:rgba(23,51,60,.07);color:var(--ink-soft)}
.b-coral{background:var(--coral-soft);color:var(--coral-deep);border:1px solid rgba(255,111,97,.4)}
.b-sky{background:var(--sky-soft);color:var(--sky-deep);border:1px solid rgba(88,183,224,.4)}
.pick{display:flex;align-items:center;gap:14px;text-align:start;border-radius:20px;border:3px solid rgba(23,51,60,.15);background:var(--paper);padding:16px;transition:all .15s}
.pick:hover{border-color:rgba(23,51,60,.4);background:var(--teal-soft);transform:translateY(-2px)}
.pick.on{border-color:var(--ink);background:var(--amber-soft);box-shadow:0 7px 0 rgba(23,51,60,.14);transform:rotate(-1.5deg)}
.thsw{display:flex;gap:5px}
.thsw i{width:16px;height:16px;border-radius:6px;display:block}
/* records */
.pod{display:flex;align-items:flex-end;justify-content:center;gap:14px;margin-top:26px}
.pcol{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--card);border:3px solid var(--ink);border-radius:24px;padding:18px 14px 14px;box-shadow:0 9px 0 rgba(23,51,60,.12);width:130px}
.pcol.p1{transform:translateY(-16px);background:var(--amber-soft)}
/* בטלפון שלוש עמודות של 130px רחבות מהמסך — מצמצמים אותן
   ומקטינים איתן את החיה, במקום לדחוף את העמוד הצידה. */
@media(max-width:520px){
  .pod{gap:8px}
  .pcol{width:auto;flex:1 1 0;min-width:0;padding:14px 8px 10px}
  .pcol>svg{width:100%;height:auto;max-width:64px}
  .pcol b{font-size:.95rem;overflow-wrap:anywhere}
}
.tbl{width:100%;border-collapse:collapse;margin-top:22px}
.tbl th{font-family:var(--font-display);font-size:.85rem;color:var(--ink-faint);text-align:start;padding:10px 12px;border-bottom:3px solid rgba(23,51,60,.12)}
.tbl td{padding:12px;border-bottom:2px solid rgba(23,51,60,.07);font-weight:500}
.tbl tr.me td{background:var(--teal-soft);font-weight:700}
.tbl tr.me td:first-child{border-inline-start:5px solid var(--teal)}
/* בטלפון צר ארבע העמודות לא נכנסות — מצמצמים ריווח כדי
   שלא יצטרכו לגלול את הטבלה הצידה. */
@media(max-width:520px){
  .tbl th,.tbl td{padding:9px 6px}
  .tbl th{font-size:.78rem}
  .tbl td{font-size:.9rem}
  .tbl td svg{width:26px;height:26px}
}
/* progress */
.tile{background:var(--card);border:3px solid var(--ink);border-radius:22px;padding:16px;text-align:center;box-shadow:0 7px 0 rgba(23,51,60,.12)}
.tile b{display:block;font-family:var(--font-display);font-size:1.9rem;margin-top:8px}
.tile span{color:var(--ink-soft);font-size:.85rem;font-weight:500}
.ic{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:13px}
.wk{display:flex;justify-content:space-between;gap:8px}
.wkd{flex:1;max-width:52px;aspect-ratio:1;border-radius:15px;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;border:2.5px solid rgba(23,51,60,.1);background:var(--paper);color:var(--ink-faint)}
.wkd.on{background:var(--teal-deep);color:#fff;border-color:var(--teal-deep);box-shadow:0 4px 0 var(--teal-deep)}
.wkd.td{background:var(--amber-soft);color:var(--amber-deep);border-color:var(--amber)}
.cols{display:grid;gap:18px}
@media(min-width:860px){.cols{grid-template-columns:1fr 1fr}.cols3{grid-template-columns:repeat(3,1fr)}.cols4{grid-template-columns:repeat(4,1fr)}.cols.ob-hero{grid-template-columns:1.05fr 1fr}.cols.pr-cols{grid-template-columns:1.6fr 1fr}}
/* עמודות גריד לא נותנות לילדים שלהן להצטמצם כברירת מחדל,
   וזה מה שדוחף את העמוד מעבר לרוחב המסך בטלפון. */
.cols>*{min-width:0}
/* כותרת עמוד: אייקון + כותרת. בטלפון צר הכותרת חייבת להתכווץ,
   אחרת היא לבדה רחבה מהמסך וגוררת איתה את כל העמוד. */
.phead{display:flex;align-items:center;gap:16px}
.phead>span:last-child{min-width:0}
.phead h1{font-size:clamp(1.55rem,7.5vw,2.4rem);overflow-wrap:anywhere}
.phead p{overflow-wrap:anywhere}
.cols4{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.hbar2{display:flex;align-items:flex-end;gap:8px;height:130px;direction:ltr}
.hbar2 .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.hbar2 .c i{width:100%;border-radius:8px 8px 0 0;display:block;transition:height .7s cubic-bezier(.2,.9,.3,1)}
.hbar2 .c span{font-size:.62rem;font-family:var(--font-display);font-weight:700;color:var(--ink-soft)}
/* misc */
.note{border-radius:16px;padding:13px 17px;font-size:.9rem;font-weight:500;border:2px solid;line-height:1.6}
.note.ok{background:var(--teal-soft);color:var(--teal-deep);border-color:rgba(14,156,141,.3)}
.note.err{background:var(--coral-soft);color:var(--coral-deep);border-color:rgba(255,111,97,.35)}
.note.warn{background:var(--amber-soft);color:var(--amber-deep);border-color:rgba(255,197,49,.5)}
.kbd{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;word-break:break-all;direction:ltr;text-align:left;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.18);border-radius:14px;padding:12px 16px;color:#fff}
footer{border-top:3px solid rgba(23,51,60,.08);background:color-mix(in srgb,var(--paper) 80%,transparent);margin-top:auto}
.fbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding-block:16px;font-size:.86rem;color:var(--ink-soft)}
.floatlink{position:fixed;bottom:20px;left:20px;z-index:40}
.visdot{width:15px;height:15px;border-radius:50%;background:var(--sky);display:inline-block;margin:3px;opacity:.85}
.visdot.x{background:var(--coral);position:relative}
.visgrid{display:flex;flex-wrap:wrap;max-width:340px;gap:2px;align-items:center;justify-content:center}
.qask{font-family:var(--font-display);font-weight:600;font-size:1.35rem;text-align:center;color:var(--ink-soft);margin-top:28px}
.qbig{font-family:var(--font-display);font-weight:700;font-size:3rem;text-align:center;margin-top:6px;direction:ltr;unicode-bidi:isolate;letter-spacing:3px}
@media(max-width:640px){.qask{font-size:1.1rem}.qbig{font-size:2.3rem}.opt{font-size:1.6rem;padding:16px 8px}}
/* ===== בורר שפה במסך הפתיחה ===== */
.oblang{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:99px;border:2px solid rgba(23,51,60,.12);background:var(--card);font-family:var(--font-display);font-weight:600;font-size:.95rem;color:var(--ink-soft);transition:all .15s}
.oblang:hover{border-color:var(--teal);color:var(--ink)}
.oblang.on{background:var(--teal-deep);border-color:var(--teal-deep);color:#fff;box-shadow:0 5px 14px rgba(14,156,141,.3)}
/* מסך הפתיחה בטלפון: העמודות חייבות להיות מסוגלות להצטמצם,
   אחרת שלוש חיות ברוחב קבוע דוחפות את כל העמוד מעבר לרוחב המסך. */
.wrap.rise,.wrap.rise>div,.cols.ob-hero,.cols.ob-hero>*{min-width:0}
.ob-pets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:18px}
.ob-pets .pick{min-width:0;justify-content:center}
.ob-pets .pick>span{display:block;width:100%}
.ob-pets svg{width:100%;height:auto;max-width:104px;margin:0 auto;display:block}

/* ===== מצב "למידה איטית" — עיצוב ===== */
.sm-btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:14px;border-radius:18px;font-family:var(--font-display);font-weight:600;font-size:1.05rem;color:#fff;background:linear-gradient(135deg,var(--teal),var(--sky-deep));box-shadow:0 6px 16px rgba(14,156,141,.3);transition:transform .15s}
.sm-btn:hover:not(:disabled){transform:translateY(-2px)}
.sm-btn:disabled{opacity:.35;cursor:default}
.sm-ov{position:fixed;inset:0;z-index:120;background:rgba(23,51,60,.6);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px}
.sm-box{background:var(--card);border-radius:26px;width:100%;max-width:540px;max-height:94vh;overflow-y:auto;padding:22px 20px 18px;box-shadow:0 24px 60px rgba(23,51,60,.4)}
.sm-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sm-x{width:40px;height:40px;border-radius:50%;background:var(--paper);font-size:1.2rem;font-weight:700;color:var(--ink-soft);flex:0 0 auto}
.sm-ex{direction:ltr;text-align:center;font-family:var(--font-display);font-weight:700;font-size:2rem;color:var(--teal-deep);margin:12px 0 2px;letter-spacing:2px}
.sm-cap{text-align:center;font-family:var(--font-display);font-weight:600;font-size:1.4rem;min-height:60px;display:flex;align-items:center;justify-content:center;padding:8px 6px;line-height:1.4}
.sm-dots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:12px 8px;min-height:70px;direction:ltr}
.sm-d{width:28px;height:28px;border-radius:50%;background:var(--teal);transition:opacity .25s,transform .2s}
.sm-d.n{background:var(--sky)}
.sm-d.g{background:rgba(23,51,60,.18);opacity:.45;transform:scale(.68)}
.sm-d.p{animation:smpop .45s ease}
/* קבוצות — לכפל ולחילוק */
.sm-grp{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;direction:ltr}
.sm-g{border:2px dashed rgba(23,51,60,.22);border-radius:14px;padding:7px;display:flex;flex-wrap:wrap;gap:5px;justify-content:center;align-content:flex-start;min-width:46px;min-height:44px;transition:all .2s}
.sm-g.fresh{border-color:var(--teal);border-style:solid;background:var(--teal-soft)}
.sm-g .sm-d{width:19px;height:19px}
/* מוטות של עשר — לספירה בקפיצות. כל מוט מחולק ל-10 מקטעים,
   כדי שרואים בעין שהוא באמת שווה עשר עיגולים. */
.sm-b10{display:flex;flex-wrap:wrap;gap:7px;align-items:flex-end;justify-content:center;direction:ltr;padding:10px 6px;min-height:88px}
.sm-rod{width:17px;height:78px;border-radius:5px;flex:0 0 auto;background:var(--teal);
  background-image:repeating-linear-gradient(to bottom,rgba(255,255,255,0) 0 6.8px,rgba(255,255,255,.55) 6.8px 7.8px)}
.sm-b10 .sm-d{width:17px;height:17px;background:var(--sky)}
.sm-rod.p{animation:smpop .45s ease}
.sm-pile{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;max-width:330px;margin:0 auto 12px;padding-bottom:12px;border-bottom:2px dashed rgba(23,51,60,.12)}
.sm-pile .sm-d{width:19px;height:19px;background:var(--ink-faint)}
.sm-stack{display:flex;flex-direction:column;gap:0}
@keyframes smpop{0%{transform:scale(.2);opacity:0}60%{transform:scale(1.35)}100%{transform:scale(1);opacity:1}}
.sm-line{display:flex;gap:5px;overflow-x:auto;padding:10px 4px;direction:ltr}
.sm-t{min-width:34px;padding:6px 0;border-radius:10px;text-align:center;font-weight:600;color:var(--ink-faint);background:var(--paper);flex:0 0 auto;transition:all .2s}
.sm-t.pv{background:var(--teal-soft);color:var(--teal-deep)}
.sm-t.on{background:var(--teal);color:#fff;transform:scale(1.2);box-shadow:0 4px 12px rgba(14,156,141,.4)}
.sm-pb{height:8px;background:var(--paper);border-radius:99px;overflow:hidden;margin:10px 4px 4px}
.sm-pb>i{display:block;height:100%;width:0;background:var(--teal);transition:width .25s}
.sm-ctl{display:flex;gap:9px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.sm-ctl button{font-family:var(--font-display);font-weight:600;font-size:1.02rem;padding:12px 18px;border-radius:14px;border:2px solid rgba(23,51,60,.12);background:var(--paper);color:var(--ink);min-width:92px}
.sm-ctl button:disabled{opacity:.3}
.sm-ctl .go{background:var(--teal);color:#fff;border-color:transparent}
@media(max-width:430px){.sm-ex{font-size:1.6rem}.sm-cap{font-size:1.15rem}.sm-d{width:23px;height:23px}.sm-ctl button{font-size:.92rem;padding:11px 13px;min-width:78px}}


/* ---------- שדה קלט של המבחן ----------
   מודול המבחן הועתק לכאן מאפליקציה שבה .field כבר היה מוגדר.
   בלי הכלל הזה שדה השם של הנבחן נשאר תיבת ברירת המחדל של
   הדפדפן — 21 פיקסלים גובה, הרבה מתחת ליעד המגע של 44. */
.field{width:100%;box-sizing:border-box;font:inherit;font-size:1rem;
  min-height:48px;padding:12px 14px;border-radius:11px;outline:none;background:var(--paper);color:var(--ink);border:1px solid var(--ink-faint)}
.field:focus{border-color:var(--teal)}
textarea.field{min-height:96px;resize:vertical}

/* ---------- שורות המבחן ----------
   .tog הגיע ממודול המבחן שהועתק לכאן. בלי הכללים האלה השם והמידע
   שמתחתיו נדבקים לשורה אחת בלי רווח: "1. חיבורהתשובה הנכונה: 24".
   */
.tog .tt{flex:1;min-width:0}
.tog .tt b{display:block;font-size:.97rem;overflow-wrap:anywhere}
.tog .tt span{display:block;font-size:.85rem;opacity:.78;overflow-wrap:anywhere;margin-top:2px}

/* יעד מגע לקישור התחתית. קישור טקסט בשורה יוצא בגובה הטקסט —
   15 פיקסלים — וזה קטן מדי לאצבע, גם כשהוא רק לתנאי השימוש. */
.lg-foot a{display:inline-flex;align-items:center;min-height:44px;padding-inline:6px}

/* ---------- מסך בניית המבחן ויעדי מגע ----------
   .seg ו-.tpc הגיעו עם מודול המבחן שהועתק לכאן ולא היה להם עיצוב:
   כפתורי הבחירה יצאו 17 פיקסלים וכרטיסי הנושאים לא נראו כלל.
   בנוסף מוצמד גובה 44 לכל מה שנלחץ — המידה שהפרויקט מחייב את עצמו בה. */
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 auto;min-width:0;min-height:44px;border:2px solid rgba(23,51,60,.12);
  background:var(--paper);color:var(--ink-soft);border-radius:12px;padding:10px 12px;
  font:inherit;font-weight:700;font-size:.9rem;cursor:pointer}
.seg button.on{background:var(--teal-deep);color:#fff;border-color:var(--teal-deep)}
.tpc{position:relative;display:flex;flex-direction:column;gap:8px;text-align:start;
  background:var(--paper);border:2px solid rgba(23,51,60,.12);
  border-inline-start:5px solid var(--c,var(--teal));border-radius:16px;padding:14px;
  min-width:0;min-height:44px;cursor:pointer;font:inherit;color:inherit}
.tpc.on{border-color:var(--teal);background:var(--teal-soft)}
.tpc .tn{font-weight:800;font-size:.98rem;overflow-wrap:anywhere}
.tpc .td{color:var(--ink-soft);font-size:.8rem;overflow-wrap:anywhere}
.btn,.lvl,.nb,button.chip{min-height:44px}

/* טקסט לבן על --teal יוצא 3.41:1 — מתחת ל-4.5 שנדרש. --teal-deep
   מגיע ל-5.4 באותה משפחת צבע, ולכן כל רקע שיש עליו טקסט לבן
   משתמש בו. --teal נשאר לקישוט: פסים, נקודות, סמן. */
/* ---------- מצב מורה ---------- */
.te-wrap{position:fixed;inset:0;z-index:2147482500;background:rgba(8,12,20,.72);
  display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto;
  font-family:system-ui,"Heebo","Rubik",Arial,sans-serif}
.te-box{background:#fff;color:#111827;max-width:26rem;width:100%;border-radius:18px;
  box-shadow:0 24px 70px -20px rgba(0,0,0,.6);padding:clamp(18px,4vw,26px);
  max-height:92vh;overflow-y:auto;font-size:16px;line-height:1.6}
.te-box h2{margin:0 0 6px;font-size:1.35rem;font-weight:800;line-height:1.25}
.te-lead{margin:0 0 10px;color:#374151}
.te-warn{margin:0 0 12px;font-size:.88rem;color:#7c2d12;background:#fef3c7;
  border-radius:10px;padding:9px 11px}
.te-lab{display:block;margin:10px 0 4px;font-weight:700;font-size:.92rem}
.te-in{width:100%;box-sizing:border-box;font:inherit;letter-spacing:.3em;
  border:1px solid #d1d5db;border-radius:11px;padding:.7rem .8rem;min-height:48px;
  background:#fff;color:#111827}
.te-in:focus-visible{outline:3px solid #2563eb;outline-offset:1px}
.te-chk{display:flex;align-items:center;gap:.5rem;margin-top:14px;min-height:44px;
  font-size:.94rem;cursor:pointer}
.te-chk input{width:20px;height:20px}
.te-note{margin:2px 0 0;font-size:.82rem;color:#6b7280}

   נשאר עם המסך הזה (duration, באלפיות שנייה).

   ההדגמה מפעילה את האפליקציה האמיתית — היא לוחצת על אותם

   שהאפליקציה לא באמת עושה.

   בלי ?demo=1 שום שורה כאן אינה רצה: המשתנים מוגדרים ונשארים

var DEMO_ON=/(^|[?&])demo=1(&|$)/.test(location.search||"");

/* בוחר אפשרות לפי נכונותה. התסריט לא מקודד תשובה: הוא שואל את
   השאלה שעל המסך עכשיו, ולכן הוא עובד גם כשההגרלה שינתה אותה. */
function demoAns(right){
  var q=(typeof P!=="undefined"&&P.ses)?P.ses[P.qi]:null;
  if(!q||!q.options)return false;
  for(var i=0;i<q.options.length;i++){
    var o=q.options[i];
    if((o===q.answer)===!!right)return demoTap('[data-a="ans"][data-o="'+o+'"]');
  }
  return false;
}

var DEMO_SCRIPT=[
  {subtitle:"מתמטיקה לחכמים שמתקשים — ארבע פעולות החשבון, צעד אחר צעד, בלי טיימר ובלי לחץ.",
   action:function(){if(typeof view!=="undefined"){view="onboarding";P.selPet=null;render();window.scrollTo(0,0)}}, duration:4400},

/* --- מנוע ההדגמה. הקוד כאן זהה בכל האפליקציות; רק DEMO_SCRIPT משתנה. --- */
var DEMO={on:false,i:0,timer:null,extra:[],bar:null,txt:null,step:null,fill:null,btn:null};

/* עוזרים לתסריט. כולם מחזירים false כשהאיבר אינו על המסך, כדי
   שצעד שלא מצא את מה שחיפש ידלג ולא יפיל את ההדגמה כולה. */
function demoEl(s){return typeof s==="string"?document.querySelector(s):s}
function demoShow(s){
  var e=demoEl(s); if(!e)return false;
  try{e.scrollIntoView({behavior:"smooth",block:"center"})}catch(err){try{e.scrollIntoView()}catch(err2){}}
  return true;
}
/* מדגיש את האיבר, ורק אז לוחץ — צופה שלא ראה לאן נלחץ לא הבין
   מה קרה. לכן אין צעד קצר מ-1200 אלפיות בתסריטים. */
function demoTap(s){
  var e=demoEl(s); if(!e||e.disabled)return false;
  demoShow(e);
  e.classList.add("demo-tap");
  DEMO.extra.push(setTimeout(function(){
    e.classList.remove("demo-tap");
    /* המסך מצטייר מחדש כל הזמן. אם האיבר שסומן כבר אינו במסמך,
       מחפשים אותו שוב לפי אותו בורר — לחיצה על איבר מת אינה
       עושה דבר, וזה בדיוק צעד שנראה כאילו נתקע. */
    var live=(typeof s==="string"&&!document.contains(e))?demoEl(s):e;
    if(DEMO.on&&live&&!live.disabled&&document.contains(live))try{live.click()}catch(err){}
  },430));
  return true;
}
function demoClick(s){
  var e=demoEl(s); if(!e||e.disabled)return false;
  try{e.click()}catch(err){return false}
  return true;
}
/* הקלדה אות אחר אות, עם אירוע input אמיתי — שדה חיפוש שמאזין
   ל-input לא היה מגיב להשמה ישירה ל-value. */
function demoType(s,text){
  var e=demoEl(s); if(!e)return false;
  demoShow(e); try{e.focus()}catch(err){}
  e.value=""; var i=0;
  var t=setInterval(function(){
    if(!DEMO.on||!e.parentNode){clearInterval(t);return}
    e.value=String(text).slice(0,++i);
    e.dispatchEvent(new Event("input",{bubbles:true}));
    if(i>=String(text).length)clearInterval(t);
  },85);
  DEMO.extra.push(t);
  return true;
}
function demoQuiet(){
  try{if(window.speechSynthesis)speechSynthesis.cancel()}catch(e){}
  try{if(typeof stopSpeak==="function")stopSpeak()}catch(e){}
}

function demoMountUI(){
  var st=document.createElement("style");
  st.id="demo-style"; st.textContent=DEMO_CSS;
  (document.head||document.documentElement).appendChild(st);

  var b=document.createElement("button");
  b.id="demo-start"; b.type="button";
  b.innerHTML='<span aria-hidden="true">▶</span><span>התחל הדגמה</span>';
  b.addEventListener("click",demoStart);
  document.body.appendChild(b);

  var bar=document.createElement("div");
  bar.id="demo-bar"; bar.hidden=true;
  bar.setAttribute("role","status");
  bar.setAttribute("aria-live","polite");
  bar.innerHTML='<div id="demo-sub"><p id="demo-txt"></p>'+
    '<div id="demo-meta"><span id="demo-step"></span>'+
    '<button id="demo-exit" type="button">יציאה · ESC</button></div>'+
    '<div id="demo-prog"><i></i></div></div>';
  document.body.appendChild(bar);

  DEMO.btn=b; DEMO.bar=bar;
  DEMO.txt=document.getElementById("demo-txt");
  DEMO.step=document.getElementById("demo-step");
  DEMO.fill=bar.querySelector("#demo-prog i");
  document.getElementById("demo-exit").addEventListener("click",function(){demoStop()});
  document.addEventListener("keydown",demoKey,true);
}

/* ESC יוצא. הקשבה בשלב הלכידה, כדי שמסך שכבר מטפל ב-Escape
   לא יבלע את המקש לפני שההדגמה ראתה אותו. */
function demoKey(e){
  if(!DEMO.on)return;
  if(e.key==="Escape"||e.keyCode===27){
    e.preventDefault(); e.stopPropagation();
    demoStop();
  }
}

function demoStart(){
  if(DEMO.on)return;
  DEMO.on=true; DEMO.i=0;
  DEMO.btn.hidden=true; DEMO.bar.hidden=false;
  document.documentElement.classList.add("demo-running");
  demoNext();
}

function demoNext(){
  if(!DEMO.on)return;
  if(DEMO.i>=DEMO_SCRIPT.length){demoStop();return}
  var it=DEMO_SCRIPT[DEMO.i++]||{};
  var d=Math.max(600,it.duration||3000);
  DEMO.txt.textContent=it.subtitle||"";
  DEMO.step.textContent=DEMO.i+" / "+DEMO_SCRIPT.length;
  DEMO.fill.style.transition="none"; DEMO.fill.style.width="0";
  void DEMO.fill.offsetWidth;
  DEMO.fill.style.transition="width "+d+"ms linear";
  DEMO.fill.style.width="100%";
  if(typeof it.action==="function"){
    try{it.action()}catch(err){if(window.console)console.warn("demo:",err)}
  }
  DEMO.timer=setTimeout(demoNext,d);
}

function demoStop(){
  DEMO.on=false;
  if(DEMO.timer){clearTimeout(DEMO.timer);DEMO.timer=null}
  DEMO.extra.forEach(function(t){clearTimeout(t);clearInterval(t)});
  DEMO.extra=[];
  var m=document.querySelectorAll(".demo-tap"),i;
  for(i=0;i<m.length;i++)m[i].classList.remove("demo-tap");
  if(DEMO.bar)DEMO.bar.hidden=true;
  if(DEMO.btn)DEMO.btn.hidden=false;
  document.documentElement.classList.remove("demo-running");
  demoQuiet();
}

/* שער התנאים הוא חלון מודאלי מעל הכול. כפתור הדגמה מתחתיו היה

function demoMount(){
  if(document.querySelector(".lg-wrap")){setTimeout(demoMount,500);return}
  if(!document.getElementById("demo-start"))demoMountUI();
}

  else window.addEventListener("load",function(){setTimeout(demoMount,0)});
}

     המכשיר, לא כבחירה. מי שרוצה אנגלית בוחר אותה, וזה נשמר. */
  var lang=s.lang;
  if(!lang){
    lang=(navigator.language||"he").slice(0,2);
    if(lang==="iw")lang="he";
    /* רק לניחוש, לא לבחירה: הכלל הזה דרס גם את מי שבחר אנגלית
       במפורש, ואז הטקסט היה אנגלי אבל הכיוון נשאר מימין לשמאל. */
    if(lang==="en")lang="he";
  }
  if(!LANGS[lang])lang="he";
  if(!s.lang)s.lang=lang;
  r.setAttribute("dir",LANGS[lang].dir);
  r.setAttribute("lang",lang);
  r.setAttribute("data-theme",THEMES[s.theme]?s.theme:"ocean");

/* ================= מעקב טעויות חוזרות =================
   רושמים את התוצאות של השאלות האחרונות בכל פעולה (חלון נע),
   ולא את כל ההיסטוריה. ילד ששלט בחיבור לפני חודש ומתקשה בו היום
   צריך לקבל עזרה היום — ולהפך, קושי ישן לא צריך לרדוף אחריו.
   ===================================================== */
var WEAK_WINDOW=8;    /* כמה שאלות אחרונות זוכרים לכל פעולה */
var WEAK_TRIGGER=3;   /* כמה טעויות בתוך החלון מפעילות הצעת תרגול */
var WEAK_NEAR=2;      /* טעות במרחק כזה מהתשובה נחשבת "קרובה" */

/* רושם תוצאה של שאלה אחת. dist = כמה רחוקה הייתה התשובה השגויה. */
function noteResult(kind,ok,dist){
  var w=state.weak&&state.weak[kind];
  if(!w)return;
  w.r.push(ok?1:0);
  if(w.r.length>WEAK_WINDOW)w.r.shift();
  if(!ok){ if(dist<=WEAK_NEAR)w.near++; else w.far++; }
  save();
}
/* כמה טעויות יש בחלון הנוכחי של פעולה מסוימת */
function weakMisses(kind){
  var w=state.weak&&state.weak[kind];
  if(!w)return 0;
  var n=0;for(var i=0;i<w.r.length;i++)if(!w.r[i])n++;
  return n;
}
/* הפעולה שהכי מתקשים בה כרגע — או null אם הכול בסדר */
function weakestOp(){
  var best=null,bestN=WEAK_TRIGGER-1;
  ["add","sub","mul","div"].forEach(function(k){
    var n=weakMisses(k);
    if(n>bestN){bestN=n;best=k}
  });
  return best;
}
/* האם רוב הטעויות בפעולה הזאת היו "קרובות"?
   קרוב = כנראה החלקה בספירה. רחוק = כנראה לא הבינו את הפעולה. */
function weakIsNear(kind){
  var w=state.weak&&state.weak[kind];
  return !!(w&&w.near>w.far);
}
/* מתחיל סבב תרגול ממוקד: 5 שאלות מאותה פעולה, שתי רמות קלות יותר */
function startFocus(kind){
  var lvl=Math.max(1,activeLevel()-2);
  P.ses=[];
  for(var i=0;i<5;i++)P.ses.push(genQ(i,lvl,state.settings.lang||"he",kind));
  P.qi=0;P.phase="ask";P.wrong=[];P.flash=null;P.hints=0;P.results=[];P.ok=0;P.visual=false;
  P.focus=kind;
  /* מאפסים את החלון — הסבב הזה עצמו יהיה העדות החדשה */
  if(state.weak[kind])state.weak[kind].r=[];
  save();
}

/* ================= מצב "למידה איטית" =================
   מפרק תרגיל לצעדים קטנים, עם ספירה מונפשת ועיגולים.
   פתיחה:  SlowMode.open(q)   — q היא שאלה שנוצרה ב-genQ
   כרגע: חיבור (add) וחיסור (sub) בלבד. כפל וחילוק יתווספו בשלב הבא.
   ===================================================== */
var SlowMode=(function(){
  var el=null,steps=[],idx=0,timer=null,lineTo=10,isOn=false;

  /* מעל המספר הזה עוברים מספירה של אחד־אחד לקפיצות של עשר.
     56 צעדים זה לא עזרה — זה עונש. */
  var JUMP_MIN=12;

  /* ספירה בקפיצות: 18 + 56 הופך לחמש קפיצות של עשר ואז שש של אחד.
     המספרים מוצגים כמוטות של עשר ועיגולים בודדים, וכשמצטברים
     עשרה עיגולים הם נאספים לבד למוט — בדיוק הרעיון של יחידות ועשרות. */
  function planJump(t,a,b,isAdd){
    var out=[],i,v=a,sign=isAdd?1:-1;
    var tens=Math.floor(b/10),ones=b%10;
    function blk(val,cap,pulse,end){
      return {j:1,t10:Math.floor(val/10),o1:val%10,v:val,cap:cap,pulse:pulse,end:end};
    }
    out.push(blk(a,fmt(t.slowHave,{a:a})));
    out.push(blk(a,fmt(isAdd?t.slowPlus:t.slowMinus,{b:b})));
    if(tens){
      out.push(blk(v,fmt(t.slowByTens,{n:tens})));
      for(i=0;i<tens;i++){v+=sign*10;out.push(blk(v,String(v),1))}
    }
    if(ones){
      out.push(blk(v,fmt(t.slowByOnes,{n:ones})));
      for(i=0;i<ones;i++){v+=sign;out.push(blk(v,String(v),1))}
    }
    out.push(blk(v,fmt(isAdd?t.slowGotAdd:t.slowGotSub,{r:v}),0,1));
    return out;
  }

  /* --- בונה את רשימת הצעדים מתוך השאלה --- */
  function plan(q){
    var t=T(),out=[],i,v,a=q.a,b=q.b;
    /* מספר שני גדול? עוברים לקפיצות של עשר במקום ספירה אחד־אחד */
    if((q.kind==="add"||q.kind==="sub")&&b>JUMP_MIN)return planJump(t,a,b,q.kind==="add");
    if(q.kind==="add"){
      out.push({d:a,base:a,gone:0,v:a,cap:fmt(t.slowHave,{a:a})});          /* יש לנו a */
      out.push({d:a,base:a,gone:0,v:a,cap:fmt(t.slowPlus,{b:b})});          /* נוסיף b  */
      for(i=1;i<=b;i++){v=a+i;out.push({d:v,base:a,gone:0,v:v,cap:String(v),pulse:1})}
      v=a+b;out.push({d:v,base:a,gone:0,v:v,cap:fmt(t.slowGotAdd,{r:v}),end:1});
    }else if(q.kind==="sub"){
      out.push({d:a,base:a,gone:0,v:a,cap:fmt(t.slowHave,{a:a})});
      out.push({d:a,base:a,gone:0,v:a,cap:fmt(t.slowMinus,{b:b})});
      for(i=1;i<=b;i++){v=a-i;out.push({d:a,base:a,gone:i,v:v,cap:String(v),pulse:1})}
      v=a-b;out.push({d:a,base:a,gone:b,v:v,cap:fmt(t.slowGotSub,{r:v}),end:1});

    }else if(q.kind==="mul"){
      /* כפל = {a} קבוצות, ובכל אחת {b}.
         ממלאים קבוצה שלמה בכל צעד, והמספר קופץ בקפיצות של {b}: 8, 16, 24, 32 ... */
      var g=[];for(i=0;i<a;i++)g.push(0);
      out.push({g:g.slice(),cap:fmt(t.slowGroups,{a:a})});
      out.push({g:g.slice(),cap:fmt(t.slowEach,{b:b})});
      for(i=0;i<a;i++){
        g[i]=b;
        out.push({g:g.slice(),gf:i,per:b,cap:String((i+1)*b),pulse:1});
      }
      out.push({g:g.slice(),cap:fmt(t.slowGotMul,{a:a,b:b,r:a*b}),end:1});

    }else{
      /* חילוק = מחלקים {a} ל-{b} קבוצות שוות.
         בכל צעד נותנים עיגול אחד לכל קבוצה — חלוקה הוגנת אמיתית.
         כך התשובה מתגלה לילד לבד, במקום להינתן לו מוכנה. */
      var ansv=q.answer!=null?q.answer:Math.round(a/b);
      var gd=[];for(i=0;i<b;i++)gd.push(0);
      out.push({g:gd.slice(),pile:a,cap:fmt(t.slowHave,{a:a})});
      out.push({g:gd.slice(),pile:a,cap:fmt(t.slowSplit,{a:a,b:b})});
      for(i=1;i<=ansv;i++){
        for(var j=0;j<b;j++)gd[j]=i;
        out.push({g:gd.slice(),pile:a-i*b,gf:-1,per:1,cap:fmt(t.slowRound,{n:i}),pulse:1});
      }
      out.push({g:gd.slice(),pile:0,cap:fmt(t.slowGotDiv,{r:ansv}),end:1});
    }
    return out;
  }

  /* --- בונה את החלון פעם אחת בלבד --- */
  function make(){
    var ov=document.createElement("div");
    ov.className="sm-ov";ov.style.display="none";
    ov.innerHTML='<div class="sm-box" role="dialog" aria-modal="true"><div class="sm-head"><h2 class="fd" style="font-size:1.25rem"></h2><button class="sm-x" aria-label="'+esc(((TTSMSG[(state.settings&&state.settings.lang)||"he"]||TTSMSG.he).close))+'">&#10005;</button></div><div class="sm-ex"></div><div class="sm-cap" aria-live="polite"></div><div class="sm-dots"></div><div class="sm-line"></div><div class="sm-pb"><i></i></div><div class="sm-ctl"><button class="bk"></button><button class="pl"></button><button class="go nx"></button></div></div>';
    document.body.appendChild(ov);
    el={ov:ov,box:ov.querySelector(".sm-box"),ttl:ov.querySelector("h2"),ex:ov.querySelector(".sm-ex"),
        cap:ov.querySelector(".sm-cap"),dots:ov.querySelector(".sm-dots"),line:ov.querySelector(".sm-line"),
        pb:ov.querySelector(".sm-pb>i"),bk:ov.querySelector(".bk"),pl:ov.querySelector(".pl"),
        nx:ov.querySelector(".nx"),x:ov.querySelector(".sm-x")};
    el.nx.onclick=function(){stop();go(idx+1)};
    el.bk.onclick=function(){stop();go(idx-1)};
    el.pl.onclick=function(){timer?stop():play()};
    el.x.onclick=close;
    ov.onclick=function(e){if(e.target===ov)close()};
    document.addEventListener("keydown",function(e){
      if(!isOn)return;
      if(e.key==="Escape"){close()}
      else if(e.key===" "||e.key==="ArrowRight"||e.key==="ArrowDown"){e.preventDefault();stop();go(idx+1)}
      else if(e.key==="ArrowLeft"||e.key==="ArrowUp"){e.preventDefault();stop();go(idx-1)}
    });
  }

  /* --- מצייר צעד אחד --- */
  function draw(){
    var s=steps[idx],t=T(),i,n,d,tk;
    if(!s)return;
    el.cap.textContent=s.cap;

    /* --- מצב קפיצות של עשר (חיבור וחיסור עם מספרים גדולים) --- */
    if(s.j){
      el.line.innerHTML="";
      var hb='<div class="sm-b10">';
      for(i=0;i<s.t10;i++)hb+='<span class="sm-rod'+((s.pulse&&s.o1===0&&i===s.t10-1)?" p":"")+'"></span>';
      for(i=0;i<s.o1;i++)hb+='<span class="sm-d'+((s.pulse&&i===s.o1-1)?" p":"")+'"></span>';
      el.dots.innerHTML=hb+'</div>';
      el.pb.style.width=Math.round(idx/(steps.length-1)*100)+"%";
      el.bk.disabled=(idx===0);
      el.bk.textContent=t.slowBack;
      el.nx.textContent=s.end?t.slowAgain:t.slowNext;
      speak(s.cap);
      if(s.end&&state.settings.soundFx)sfxCorrect();
      return;
    }

    /* --- מצב קבוצות (כפל וחילוק) --- */
    if(s.g){
      el.line.innerHTML="";
      var html="";
      /* הערימה שעוד לא חולקה */
      if(s.pile>0){
        html+='<div class="sm-pile">';
        for(i=0;i<s.pile;i++)html+='<span class="sm-d"></span>';
        html+='</div>';
      }
      html+='<div class="sm-grp">';
      for(i=0;i<s.g.length;i++){
        var isFresh=!!(s.pulse&&(s.gf===-1||s.gf===i));
        html+='<div class="sm-g'+(isFresh?" fresh":"")+'">';
        for(n=0;n<s.g[i];n++){
          var isNew=isFresh&&n>=s.g[i]-(s.per||1);
          html+='<span class="sm-d n'+(isNew?" p":"")+'"></span>';
        }
        html+='</div>';
      }
      html+='</div>';
      el.dots.innerHTML=html;
      el.pb.style.width=Math.round(idx/(steps.length-1)*100)+"%";
      el.bk.disabled=(idx===0);
      el.bk.textContent=t.slowBack;
      el.nx.textContent=s.end?t.slowAgain:t.slowNext;
      speak(s.cap);
      if(s.end&&state.settings.soundFx)sfxCorrect();
      return;
    }

    /* --- מצב עיגולים בשורה (חיבור וחיסור) --- */
    el.dots.innerHTML="";
    var last=s.gone?s.d-s.gone:s.d-1;
    for(i=0;i<s.d;i++){
      d=document.createElement("span");
      d.className="sm-d"+(i>=s.base?" n":"")+(s.gone&&i>=s.d-s.gone?" g":"")+(s.pulse&&i===last?" p":"");
      el.dots.appendChild(d);
    }
    /* ציר המספרים */
    el.line.innerHTML="";
    var from=0,to=lineTo;
    if(lineTo>18){from=Math.max(0,s.v-7);to=Math.min(lineTo,from+15)}
    for(n=from;n<=to;n++){
      tk=document.createElement("span");
      tk.className="sm-t"+(n===s.v?" on":(n<s.v?" pv":""));
      tk.textContent=n;el.line.appendChild(tk);
    }
    var cur=el.line.querySelector(".sm-t.on");
    if(cur&&cur.scrollIntoView)cur.scrollIntoView({block:"nearest",inline:"center"});
    /* פס התקדמות + כפתורים */
    el.pb.style.width=Math.round(idx/(steps.length-1)*100)+"%";
    el.bk.disabled=(idx===0);
    el.bk.textContent=t.slowBack;
    el.nx.textContent=s.end?t.slowAgain:t.slowNext;
    /* הקראה — משתמש במנוע ההקראה הקיים של האפליקציה */
    speak(s.cap);
    if(s.end&&state.settings.soundFx)sfxCorrect();
  }

  function go(n){
    if(n<0)return;
    if(n>=steps.length){go(0);return}
    idx=n;draw();
  }
  /* מצב "הפעלה" — מתקדם לבד. 2100 = 2.1 שניות בין צעד לצעד */
  function play(){el.pl.textContent=T().slowStop;timer=setInterval(function(){
    if(idx>=steps.length-1){stop();return}go(idx+1)},2100)}
  function stop(){if(timer){clearInterval(timer);timer=null}if(el)el.pl.textContent=T().slowPlay}

  /* האם אפשר לפרק את השאלה הזאת? נשמר ציבורי כדי שמסך התרגול
     ידע אם להציג את הכפתור בכלל. */
  function can(q){
    if(!q)return false;
    var a=q.a,b=q.b;
    if(q.kind==="add"||q.kind==="sub")return b>=0&&b<=99;   /* מעל 12 עוברים לקפיצות של עשר */
    if(q.kind==="mul")return a>=1&&a<=12&&b>=1&&b<=12;
    if(q.kind==="div"){var v=q.answer!=null?q.answer:Math.round(a/b);return b>=1&&b<=12&&v>=1&&v<=12}
    return false;
  }

  function open(q){
    if(!can(q))return false;
    if(!el)make();
    var t=T();
    steps=plan(q);
    lineTo=Math.max(10,q.kind==="add"?q.a+q.b:q.a);
    el.box.setAttribute("dir",LANGS[state.settings.lang||"he"].dir);
    el.ttl.textContent={add:t.slowAdd,sub:t.slowSub,mul:t.slowMul,div:t.slowDiv}[q.kind];
    el.ex.textContent=(q.expr||(q.a+" ? "+q.b))+" = ?";
    el.pl.textContent=t.slowPlay;
    idx=0;isOn=true;el.ov.style.display="grid";
    draw();
    return true;
  }
  function close(){stop();isOn=false;stopSpeak();if(el)el.ov.style.display="none"}

  return {open:open,close:close,can:can,isOpen:function(){return isOn}};
})();

/* בוחרת כותרת, משפט וכוכבים לפי התוצאה בפועל.
   מחושב באחוזים ולא במספרים, כי סבב רגיל הוא 8 שאלות
   וסבב תרגול ממוקד הוא 5 — ובשניהם 100% צריך להיות 3 כוכבים. */
function doneLines(){
  var t=T(),n=P.ses.length||1,ratio=P.ok/n;
  var tier=ratio<0.3?"Low":(ratio<0.75?"Mid":"High");
  return {
    tier:tier,
    stars:ratio>=0.75?3:(ratio>=0.5?2:1),
    title:t["done"+tier]||t.doneTitle,
    sub:fmt(t["sub"+tier]||t.doneSub,{a:P.ok,b:n})
  };
}

function withSeed(seed,fn){

/* base64url. הניקוי בפענוח אינו קוסמטי: וואטסאפ שובר מחרוזות

function b64d(s){

  while(s.length%4)s+="=";
  var bin=atob(s),bytes=new Uint8Array(bin.length),i;
  for(i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);

function xlg(){return state.settings.lang||"he"}
function xt(k){var d=XT[xlg()];var v=d&&d[k];return v===undefined?(XK[k]===undefined?k:XK[k]):v}
/* {0} ו-{1} — סדר המילים משתנה בין השפות, ולכן מספרים ולא רצף */
function xf(k){var s=xt(k),a=arguments,i;
  for(i=1;i<a.length;i++)s=s.split("{"+(i-1)+"}").join(String(a[i]));
  return s}

function viewLocked(){
  return '<div class="wrap" style="padding-block:40px;max-width:32rem">'+

}
/* השאלות עצמן, על המסך של המורה, לפני שהמבחן נשלח. */
function viewExamSlots(){
  var ls=exSlots(),h="",tops=EB.topics.filter(function(x){return topicById(x)});
  h+='<div style="margin-top:18px"><b>'+esc(xt("exQs"))+'</b>'+
     '<p class="sub" style="margin:4px 0 8px">'+esc(xt("exQsNote"))+'</p>';
  h+='<div class="row" style="margin:0 0 10px">'+
     '<button class="xq-b" data-a="exqans" aria-pressed="'+(EB.ans?"true":"false")+'">'+
     (EB.ans?esc(xt("exQsHide")):esc(xt("exQsShow")))+'</button>'+
     '<button class="xq-b" data-a="exqreset">'+esc(xt("exQsReset"))+'</button></div>';
  h+='<ol class="xq-list">';
  ls.forEach(function(sl,i){
    var q=exPreviewQ(sl),ok=exRightAnswer(q);
    h+='<li class="xq"><div class="xq-top">'+
       '<span class="xq-n">'+(i+1)+'</span>'+
       '<span class="xq-tp">'+esc(q&&q.topicName?q.topicName:exTopicName(sl[0]))+'</span>'+
       '<span class="xq-acts">'+
       '<button class="xq-b" data-a="exqroll" data-i="'+i+'">'+esc(xt("exQsSwap"))+'</button>'+
       /* המבחן חייב להישאר עם שאלה אחת לפחות, ולכן הכפתור נעלם
          ולא מוצג כבוי: כפתור שאי אפשר ללחוץ עליו מבלבל. */
       (ls.length>1?'<button class="xq-b" data-a="exqdel" data-i="'+i+'">'+esc(xt("exQsDrop"))+'</button>':"")+
       '</span></div>';
    if(q){
      h+='<div class="xq-q">'+q.ask+(q.expr?'<div class="xq-e">'+q.expr+'</div>':"")+'</div>';
      if(EB.ans&&ok)h+='<div class="xq-a"><b>'+esc(xt("exQsAns"))+'</b> '+ok.h+'</div>';
    }else h+='<div class="xq-q sub">'+esc(xt("exQsFail"))+'</div>';
    h+='</li>';
  });
  h+='</ol>';
  /* כפתור לכל נושא שנבחר, כדי שהמורה יוסיף בדיוק את מה שחסר לו
     ולא שאלה אקראית מנושא כלשהו. */
  if(tops.length){
    h+='<div class="row xq-add"><span class="sub">'+esc(xt("exQsAdd"))+'</span>';
    tops.forEach(function(id){
      h+='<button class="xq-b" data-a="exqadd" data-t="'+esc(id)+'">'+
         '<b aria-hidden="true">+</b> <span>'+esc(exTopicName(id))+'</span></button>';
    });
    h+='</div>';
  }
  return h+'</div>';
}
function viewExamNew(){
  var tops=topicsForTrack(state.track);
  if(!EB.topics.length)EB.topics=tops.slice(0,4).map(function(t){return t.id});
  var h='<div class="wrap" style="padding-block:22px">';
  h+='<h1 class="h1">'+esc(xt("exTitle"))+'</h1>'+
     '<p class="sub">'+esc(xt("exLead"))+'</p>';

  h+='<div class="card pad" style="margin-top:16px">';
  h+='<label class="tt"><b>'+esc(xt("exName"))+'</b></label>'+
     '<input class="field" id="exTitle" value="'+esc(EB.title)+'" placeholder="'+esc(xt("exNamePh"))+'" maxlength="60">';

  /* שורת יחידות הלימוד הגיעה עם מודול המבחן ממשפחת math-uni. באפליקציה
     עם מסלול אחד — math-app, ארבע פעולות החשבון — אין 3/4/5 יח״ל, והשורה
     רק בלבלה. מציגים אותה רק כשיש באמת יותר ממסלול אחד. */
  if(TRACKS.length>1)h+='<div style="margin-top:16px"><b>'+esc(xt("exUnits"))+'</b>'+
     '<div class="seg" style="margin-top:7px">'+[3,4,5].map(function(tr){
       return '<button class="'+(state.track===tr?"on":"")+'" data-a="track" data-t="'+tr+'">'+tr+' '+esc(xt("exUnitSuf"))+'</button>'
     }).join("")+'</div></div>';

  h+='<div style="margin-top:16px"><b>'+esc(xt("exLevel"))+'</b><div class="seg" style="margin-top:7px">'+
     LVL.map(function(l,i){
       return '<button class="'+(EB.level===i+1?"on":"")+'" style="--c:'+LVL_C[i]+'" data-a="exlvl" data-l="'+(i+1)+'">'+l+'</button>'
     }).join("")+'</div></div>';

  h+='<div style="margin-top:16px"><b>'+esc(xt("exCount"))+': <span id="exNlab">'+EB.n+'</span></b>'+
     '<input type="range" min="5" max="25" step="1" value="'+EB.n+'" data-slide="exn" style="margin-top:6px"></div>';

  h+='<div style="margin-top:18px"><b>'+esc(xt("exTopics"))+'</b>'+
     '<p class="sub" style="margin:4px 0 8px">'+esc(xt("exTopicsNote"))+'</p>'+
     '<div class="grid g2">';
  tops.forEach(function(t){
    var on=EB.topics.indexOf(t.id)>=0;
    h+='<button class="tpc '+areaCls(t.area)+(on?" on":"")+'" data-a="extopic" data-t="'+t.id+
       '" aria-pressed="'+(on?"true":"false")+'"><span class="tn">'+esc(tName(t))+'</span>'+
       (typeof tDesc==="function"?'<span class="td">'+esc(tDesc(t))+'</span>':"")+'</button>';
  });
  h+='</div></div>';

  /* התאמות. לא "הקלות" — הן הסיבה שהאפליקציה הזאת קיימת, והמורה
     הוא זה שמחליט מה מותר במבחן שלו. */
  h+='<div style="margin-top:18px"><b>'+esc(xt("exAcc"))+'</b>'+
     '<p class="sub" style="margin:4px 0 8px">'+esc(xt("exAccNote"))+'</p>';
  [["tts",xt("exTts"),xt("exTtsSub")],
   ["formulas",xt("exForm"),xt("exFormSub")]]
   .filter(function(r){return r[0]!=="formulas"||HAS_FORMULAS})
   .forEach(function(r){
    var on=!!EB[r[0]];
    h+='<button class="tog" data-a="exflag" data-f="'+r[0]+'" role="switch" aria-checked="'+(on?"true":"false")+'">'+
      '<span class="tt"><b>'+esc(r[1])+'</b><span>'+esc(r[2])+'</span></span><span class="sw"></span></button>';
  });
  h+='</div>';

  h+='<div style="margin-top:18px"><label class="tt"><b>'+esc(xt("exPhone"))+'</b></label>'+
     '<p class="sub" style="margin:4px 0 6px">'+esc(xt("exPhoneNote"))+'</p>'+
     '<input class="field" id="exPhone" value="'+esc(EB.phone)+'" placeholder="972501234567" inputmode="tel" maxlength="20"></div>';

  h+=viewExamSlots();
  h+='<button class="btn btn-p w" style="margin-top:20px" data-a="exbuild">'+ic("check",18)+' '+esc(xt("exBuild"))+'</button>';
  h+='</div>';

  if(EB.built){
    var sp=EB.built,url=examUrl(sp);
    var msg=(sp.t||xt("exam"))+"\n"+xf("exShareMsg",sp.q.length)+"\n"+url;
    h+='<div class="card pad" style="margin-top:18px;border-color:var(--ok)">'+
       '<h2 class="h2">'+esc(xt("exReady"))+'</h2>'+
       '<p class="sub">'+esc(sp.t||xt("exam"))+' · '+sp.q.length+' '+esc(xt("qs"))+' · '+esc(LVL[sp.l-1]||"")+'</p>'+
       '<div class="row" style="margin-top:12px">'+
       '<a class="btn btn-p" href="'+esc(waLink(msg,""))+'" target="_blank" rel="noopener">'+
       ic("share",17)+' '+esc(xt("exWa"))+'</a>'+
       '<button class="btn" data-a="excopy" data-v="'+esc(url)+'">'+ic("copy",17)+' '+esc(xt("exCopyUrl"))+'</button>'+
       '<button class="btn btn-g" data-a="go" data-v="marks">'+ic("chart",17)+' '+esc(xt("exToMarks"))+'</button></div>'+
       (EB.copied==="url"?'<p class="chip ok" style="margin-top:10px">'+esc(xt("exUrlCopied"))+'</p>':"")+
       '<p class="sub" style="margin-top:12px;word-break:break-all;direction:ltr;text-align:left">'+esc(url)+'</p>'+
       '</div>';
  }
  return h+'</div>';
}

var MK={open:"",paste:"",msg:null,del:""};
function viewMarks(){
  var h='<div class="wrap" style="padding-block:22px">';
  h+='<h1 class="h1">'+esc(xt("mkTitle"))+'</h1>'+
     '<p class="sub">'+esc(xt("mkLead"))+'</p>';
  h+='<div class="row" style="margin-top:14px"><button class="btn btn-p" style="font-size:1.2rem;padding:14px 28px" data-a="go" data-v="exam">'+
     ic("plus",17)+' '+esc(xt("mkNew"))+'</button></div>';
  if(MK.msg&&!MK.msg.id)h+='<p class="chip '+(MK.msg.ok?"ok":"bad")+'" style="margin-top:10px">'+esc(MK.msg.m)+'</p>';

  if(!EX.list.length){
    h+='<div class="card pad" style="margin-top:16px"><p class="sub" style="margin:0">'+
       esc(xt("mkEmpty"))+'</p></div>';
    return h+'</div>';
  }
  EX.list.forEach(function(ex){
    var open=MK.open===ex.id;
    var subs=ex.subs||[];
    var avg=subs.length?Math.round(subs.reduce(function(a,b){return a+b.pct},0)/subs.length):0;
    h+='<div class="card pad" style="margin-top:14px">';
    h+='<button class="row" data-a="mkopen" data-i="'+esc(ex.id)+'" style="width:100%;background:none;border:0;text-align:start;cursor:pointer">'+
       '<span style="flex:1;min-width:0"><b>'+esc(ex.spec.t||xt("exam"))+'</b>'+
       '<span class="sub" style="display:block">'+ex.spec.q.length+' '+esc(xt("qs"))+' · '+esc(ex.date)+
       ' · '+subs.length+' '+esc(xt("mkSubs"))+(subs.length?' · '+esc(xt("mkAvg"))+' '+avg:'')+'</span></span>'+
       '<span class="chip'+(subs.length?(avg>=70?" ok":avg>=55?" warn":" bad"):"")+'">'+
       (subs.length?avg+"%":"—")+'</span></button>';
    if(!open){h+='</div>';return}

    h+='<div style="margin-top:14px"><label class="tt"><b>'+esc(xt("mkPaste"))+'</b></label>'+
       '<textarea class="field" id="mkPaste" rows="3" placeholder="'+esc(xt("mkPastePh"))+'"></textarea>'+
       '<div class="row" style="margin-top:8px">'+
       '<button class="btn btn-p" data-a="mkadd" data-i="'+esc(ex.id)+'">'+ic("check",17)+' '+esc(xt("mkTake"))+'</button>'+
       '<a class="btn" href="'+esc(waLink((ex.spec.t||xt("exam"))+"\n"+examUrl(ex.spec),""))+'" target="_blank" rel="noopener">'+
       ic("share",17)+' '+esc(xt("mkResend"))+'</a>'+
       (subs.length?'<button class="btn btn-g" data-a="mkcopy" data-i="'+esc(ex.id)+'">'+ic("copy",17)+' '+esc(xt("mkCopyTbl"))+'</button>'+
         '<button class="btn btn-g" data-a="mkcsv" data-i="'+esc(ex.id)+'">'+ic("share",17)+' '+esc(xt("mkCsv"))+'</button>':"")+
       (MK.del===ex.id?
         '<span class="row" style="gap:6px"><span class="chip bad">'+esc(xf("mkDelQ",subs.length||0))+'</span>'+
         '<button class="btn btn-d" data-a="mkdelyes" data-i="'+esc(ex.id)+'">'+esc(xt("mkDelYes"))+'</button>'+
         '<button class="btn btn-g" data-a="mkdelno">'+esc(xt("mkCancel"))+'</button></span>':
         '<button class="btn btn-g" data-a="mkdel" data-i="'+esc(ex.id)+'">'+esc(xt("mkDel"))+'</button>')+
       '</div>';
    if(MK.msg&&MK.msg.id===ex.id)
      h+='<p class="chip '+(MK.msg.ok?"ok":"bad")+'" style="margin-top:10px">'+esc(MK.msg.m)+'</p>';
    h+='</div>';

    if(subs.length){
      /* לפי תלמיד */
      h+='<div style="margin-top:16px"><b>'+esc(xt("mkByStudent"))+'</b>';
      subs.slice().sort(function(a,b){return b.pct-a.pct}).forEach(function(s){
        var wrong=s.per.filter(function(p){return !p.ok});
        h+='<div class="tog" style="align-items:flex-start"><span class="tt"><b>'+esc(s.name||xt("mkNoName"))+'</b>'+
          '<span>'+s.ok+' '+esc(xt("outOf"))+' '+s.n+
          (wrong.length?' · '+esc(xt("mkFell"))+' '+esc(uniq(wrong.map(function(p){return p.topicName})).join(", ")):' · '+esc(xt("mkAllOk")))+
          (s.valid?"":' · <b style="color:var(--bad)">'+esc(xt("mkBadCode"))+'</b>')+'</span></span>'+
          '<span class="chip '+(s.pct>=70?"ok":s.pct>=55?"warn":"bad")+'">'+s.pct+'%</span></div>';
      });
      h+='</div>';
      /* לפי נושא — זה מה שמורה באמת צריך: לא מי נכשל, אלא מה ללמד שוב */
      var byT={};
      subs.forEach(function(s){s.per.forEach(function(p){
        if(!byT[p.topic])byT[p.topic]={n:0,ok:0,name:p.topicName};
        byT[p.topic].n++; byT[p.topic].ok+=p.ok;
      })});
      h+='<div style="margin-top:16px"><b>'+esc(xt("mkByTopic"))+'</b>'+
         '<p class="sub" style="margin:4px 0 8px">'+esc(xt("mkByTopicNote"))+'</p>';
      Object.keys(byT).map(function(k){var o=byT[k];o.pct=Math.round(100*o.ok/o.n);return o})
        .sort(function(a,b){return a.pct-b.pct}).forEach(function(o){
        h+='<div class="tog"><span class="tt"><b>'+esc(o.name)+'</b>'+
          '<span>'+o.ok+' '+esc(xt("mkRight"))+' '+o.n+'</span></span>'+
          '<span class="bar '+(o.pct>=70?"ok":o.pct>=40?"mid":"low")+'" style="width:90px;flex:none">'+
          '<i style="width:'+o.pct+'%"></i></span>'+
          '<span class="chip">'+o.pct+'%</span></div>';
      });
      h+='</div>';
    }
    h+='</div>';
  });
  return h+'</div>';
}
/* ------------------------------------------------------------
   ייצוא CSV של ההגשות.
   העתקת הטבלה נותנת טקסט מופרד בטאבים — נוח להדבקה, אבל לא קובץ.
   מורה שרוצה למיין, לסנן או לחשב ממוצע צריך גיליון. שורה לכל תלמיד,
   ועמודה לכל שאלה, כדי שאפשר יהיה לראות מיד באיזו שאלה נפלה הכיתה.
   ה-BOM בהתחלה הוא מה שגורם לאקסל לקרוא עברית, ערבית ורוסית נכון
   במקום ג׳יבריש — בלעדיו הקובץ נפתח שבור בדיוק אצל מי שצריך אותו.
   ------------------------------------------------------------ */
function csvCell(v){
  var s=(v===undefined||v===null)?"":String(v);
  return /[",\n\r;\t]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function csvRow(a){ return a.map(csvCell).join(",") }
/* ============================================================
   מצב מורה.
   בונה המבחן ומסך הציונים נועדו למורה. על טאבלט כיתתי, או על
   טלפון שהילד לוקח לעצמו, אין סיבה שהם יהיו במרחק הקשה אחת:
   ילד יכול למחוק מבחן, לראות ציונים של חברים, או לפתוח מבחן
   ולראות מראש את השאלות.
   זו אינה אבטחה, ואסור להציג אותה ככזאת: מי שיודע לפתוח כלי
   פיתוח יעקוף אותה בשנייה. זו נעילה מפני יד סקרנית — בדיוק מה
   שצריך כאן, ולא יותר.
   כל עוד לא נבחר קוד, שום דבר לא משתנה והמסכים גלויים כתמיד.
   ============================================================ */
var TE={ask:false,mode:"",msg:"",busy:false};
function teRead(){try{return JSON.parse(localStorage.getItem("mathapp-teacher")||"null")}catch(e){return null}}
function teWrite(o){try{o===null?localStorage.removeItem("mathapp-teacher"):localStorage.setItem("mathapp-teacher",JSON.stringify(o))}catch(e){}}
function teHas(){var r=teRead();return !!(r&&r.h)}
function teOpen(){
  if(!teHas())return true;
  try{if(sessionStorage.getItem("mathapp-teacher"+"-open")==="1")return true}catch(e){}
  try{if(localStorage.getItem("mathapp-teacher"+"-open")==="1")return true}catch(e){}
  return false;
}
function teSetOpen(on,remember){
  try{sessionStorage.removeItem("mathapp-teacher"+"-open")}catch(e){}
  try{localStorage.removeItem("mathapp-teacher"+"-open")}catch(e){}

/* גיבוב חלש כגיבוי בלבד. SubtleCrypto קיים בכל דפדפן מודרני
   בהקשר מאובטח, ו-GitHub Pages הוא כזה. */
function teWeak(s){var h=5381,i;for(i=0;i<s.length;i++)h=((h*33)^s.charCodeAt(i))>>>0;return "w"+h.toString(16)}
function teHash(pin,salt,cb){
  var msg=salt+"|"+pin;
  try{
    if(window.crypto&&crypto.subtle&&crypto.subtle.digest&&window.TextEncoder){
      crypto.subtle.digest("SHA-256",new TextEncoder().encode(msg)).then(function(d){
        var a=Array.prototype.slice.call(new Uint8Array(d));
        cb(a.map(function(b){return ("0"+b.toString(16)).slice(-2)}).join(""));
      },function(){cb(teWeak(msg))});
      return;
    }
  }catch(e){}
  cb(teWeak(msg));
}
function teSalt(){
  var s="";
  try{
    var a=new Uint8Array(8);crypto.getRandomValues(a);
    s=Array.prototype.slice.call(a).map(function(b){return ("0"+b.toString(16)).slice(-2)}).join("");
  }catch(e){ s=String(Date.now())+Math.random().toString(36).slice(2) }
  return s;
}
/* השהיה אחרי ניסיונות כושלים. ארבע ספרות הן עשרת אלפים
   אפשרויות, וילד סבלני יכול לנסות הרבה. */
function teWait(){
  var r=teRead();if(!r||!r.bad||r.bad<3)return 0;
  var pen=Math.min(300,Math.pow(2,r.bad-3)*5)*1000;
  var left=Math.ceil(((r.badAt||0)+pen-Date.now())/1000);
  return left>0?left:0;
}
function teDialog(){
  var wrap=document.getElementById("te-wrap");
  if(wrap&&wrap.parentNode)wrap.parentNode.removeChild(wrap);

  var setting=(TE.mode==="set"||TE.mode==="change"||!teHas());
  var dirv=(LANGS[state.settings.lang||"he"]&&LANGS[state.settings.lang||"he"].dir)||"rtl";
  var w=document.createElement("div");

    (TE.msg?'<p class="te-msg" role="alert">'+esc(TE.msg)+'</p>':'')+

    '<div class="te-row">'+
      '<button class="te-btn pri" id="te-ok"'+(wait?' disabled':'')+'>'+esc(xt("teOk"))+'</button>'+
      '<button class="te-btn" id="te-no">'+esc(xt("teCancel"))+'</button>'+
    '</div>'+
    (!setting&&teHas()?'<button class="te-btn link" id="te-forgot">'+esc(xt("teForgot"))+'</button>':'')+
    '</div>';
  document.body.appendChild(w);
  var box=w.firstChild, pin=document.getElementById("te-pin");
  box.focus(); if(pin&&!wait)pin.focus();
  /* מלכודת פוקוס, כמו בשער התנאים */
  w.addEventListener("keydown",function(e){
    if(e.key==="Escape"){teClose();return}
    if(e.key==="Enter"){e.preventDefault();teSubmit();return}
    if(e.key!=="Tab")return;
    var f=box.querySelectorAll("button:not([disabled]),input");
    if(!f.length)return;
    var a=f[0],z=f[f.length-1];
    if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}
    else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}
  });
  document.getElementById("te-no").onclick=teClose;
  document.getElementById("te-ok").onclick=teSubmit;
  var fg=document.getElementById("te-forgot");
  if(fg)fg.onclick=function(){ TE.msg=xt("teForgotHow"); teDialog() };
}
function teClose(){ TE.ask=false; TE.mode=""; TE.msg=""; teDialog(); }
function teSubmit(){
  if(TE.busy)return;
  var setting=(TE.mode==="set"||TE.mode==="change"||!teHas());
  var pin=(document.getElementById("te-pin")||{}).value||"";
  var rem=!!(document.getElementById("te-rem")||{}).checked;
  if(!/^[0-9]{4,8}$/.test(pin)){TE.msg=xt("teShort");teDialog();return}
  if(setting){
    var p2=(document.getElementById("te-pin2")||{}).value||"";
    if(pin!==p2){TE.msg=xt("teMismatch");teDialog();return}
    var salt=teSalt();
    TE.busy=true;
    teHash(pin,salt,function(h){
      TE.busy=false;
      teWrite({h:h,s:salt,bad:0,badAt:0});
      teSetOpen(true,rem);
      TE.ask=false;TE.mode="";TE.msg="";
      teDialog(); render();
    });
    return;
  }
  if(teWait()){teDialog();return}
  var rec=teRead(); if(!rec){teClose();return}
  TE.busy=true;
  teHash(pin,rec.s,function(h){
    TE.busy=false;
    if(h===rec.h){
      rec.bad=0;rec.badAt=0;teWrite(rec);
      teSetOpen(true,rem);
      TE.ask=false;TE.mode="";TE.msg="";
      teDialog(); render();
    }else{
      rec.bad=(rec.bad||0)+1;rec.badAt=Date.now();teWrite(rec);
      TE.msg=xt("teBad"); teDialog();
    }
  });
}
function teAsk(mode){ TE.ask=true; TE.mode=mode||""; TE.msg=""; teDialog() }
function teLock(){ teSetOpen(false); render() }
function teRemove(){ teWrite(null); teSetOpen(false); render() }
/* נעילה אוטומטית אחרי שהאפליקציה הייתה מוסתרת זמן־מה.

   פתוח, וזה בדיוק המצב שהתכונה אמורה למנוע. שתי דקות מספיקות
   כדי לא להפריע לעבודה רצופה, ולנעול כשהמכשיר עבר יד.
   נעילה שנשמרה כ"לזכור במכשיר הזה" היא בחירה מפורשת ולא נוגעים בה. */
var TE_HID=0;
try{
  document.addEventListener("visibilitychange",function(){

    if(kept)return;

    teSetOpen(false); render();
  });
}catch(e){}

/* ?teacher=1 פותח את החלון, והפרמטר מוסר מיד מהכתובת כדי שלא
   יישאר בקישור ששותף או בהיסטוריה. */
(function(){
  try{
    var u=new URL(location.href);
    if(u.searchParams.get("teacher")==="1"){
      u.searchParams.delete("teacher");
      history.replaceState(null,"",u.pathname+(u.searchParams.toString()?"?"+u.searchParams:"")+u.hash);
      /* שער התנאים יושב מעל הכול, וכך צריך להיות: אי־אפשר להשתמש
         באפליקציה לפני שהוסכם עליהם. חלון הקוד ממתין לו במקום
         להיפתח מתחתיו ולהיראות תקוע. */
      var tries=0;
      (function waitLegal(){
        if(tries++>=600){ teAsk(teHas()?"":"set"); return }
        /* LEGAL.accepted נוצר רק כש-protect.js מאותחל. עד אז אין
           עדיין מה לבדוק, ובדיקה של ".lg-wrap" לבדה מחזירה "אין
           שער" בדיוק ברגע שלפני שהוא נבנה. */
        var ready=false;
        try{ ready=!!(window.LEGAL&&window.LEGAL.accepted) }catch(e){}
        if(!ready){ setTimeout(waitLegal,200); return }
        var ok=true;
        try{ ok=!!window.LEGAL.accepted() }catch(e){ ok=true }
        if(!ok){ setTimeout(waitLegal,200); return }
        teAsk(teHas()?"":"set");
      })();
    }
  }catch(e){}
})();

function marksCsv(ex){
  var subs=(ex.subs||[]).slice().sort(function(a,b){return b.pct-a.pct});
  var n=ex.spec.q.length,i;
  var head=[xt("mkCsvName"),xt("mkCsvPct"),xt("mkCsvOk"),xt("mkCsvTotal"),
            xt("mkCsvDate"),xt("mkCsvValid")];
  for(i=0;i<n;i++)head.push(xf("mkCsvQ",i+1));
  var rows=[csvRow(head)];
  subs.forEach(function(s){
    var r=[s.name||xt("mkNoName"),s.pct,s.ok,s.n,s.date||"",
           s.valid?xt("mkCsvYes"):xt("mkCsvNo")];
    for(i=0;i<n;i++){
      var p=s.per&&s.per[i];
      r.push(p?(p.ok?xt("mkCsvYes"):xt("mkCsvNo")):"");
    }
    rows.push(csvRow(r));
  });
  return "\ufeff"+rows.join("\r\n")+"\r\n";
}
/* כרום מוחק את שם הקובץ כולו ברגע שיש בו תו אחד שאינו ASCII —
   לא רק עברית: גם é או מקף ארוך. מה שיורד נקרא "download", בלי
   סיומת, ואקסל לא יודע לפתוח אותו. מורה שקרא למבחן שלו בעברית
   קיבל קובץ בלי שם ובלי סוג. לכן השם מתועתק ללטינית. */
var TRLIT={
  "א":"a","ב":"b","ג":"g","ד":"d","ה":"h","ו":"v","ז":"z","ח":"ch","ט":"t","י":"y",
  "כ":"k","ך":"k","ל":"l","מ":"m","ם":"m","נ":"n","ן":"n","ס":"s","ע":"","פ":"f",
  "ף":"f","צ":"tz","ץ":"tz","ק":"k","ר":"r","ש":"sh","ת":"t",
  "ا":"a","ب":"b","ت":"t","ث":"th","ج":"j","ح":"h","خ":"kh","د":"d","ذ":"dh","ر":"r",
  "ز":"z","س":"s","ش":"sh","ص":"s","ض":"d","ط":"t","ظ":"z","ع":"","غ":"gh","ف":"f",
  "ق":"q","ك":"k","ل":"l","م":"m","ن":"n","ه":"h","و":"w","ي":"y","ة":"h","ى":"a","ء":"",
  "أ":"a","إ":"i","آ":"a","ؤ":"w","ئ":"y",
  "а":"a","б":"b","в":"v","г":"g","д":"d","е":"e","ё":"e","ж":"zh","з":"z","и":"i",
  "й":"y","к":"k","л":"l","м":"m","н":"n","о":"o","п":"p","р":"r","с":"s","т":"t",
  "у":"u","ф":"f","х":"kh","ц":"ts","ч":"ch","ш":"sh","щ":"sch","ъ":"","ы":"y","ь":"",
  "э":"e","ю":"yu","я":"ya"
};
function asciiName(s){
  var i,c,out="";
  /* é ו-ü הם אות לטינית ועוד סימן מצורף. פירוק והסרת הסימן משאיר e ו-u. */
  try{ s=s.normalize("NFD").replace(/[\u0300-\u036f]/g,"") }catch(e){}
  for(i=0;i<s.length;i++){
    c=s.charAt(i);
    if(/[A-Za-z0-9]/.test(c)){ out+=c; continue }
    var lower=c.toLowerCase();
    if(TRLIT[lower]!==undefined){ out+=TRLIT[lower]; continue }
    out+=" ";                     /* כל השאר — רווח, שיתכווץ בהמשך */
  }
  return out.replace(/\s+/g," ").trim();
}
function csvFileName(ex){
  var t=asciiName(String(ex.spec.t||"")).slice(0,60).trim();
  var d=String(ex.date||todayIso()).replace(/[^0-9-]/g,"");
  /* כשלא נשאר כלום קריא, מזהה המבחן הוא מה שמבדיל בין שני קבצים
     שירדו באותו יום. */
  if(!t) t="exam "+String(ex.id||"").slice(0,6);
  return (t+" "+d).trim()+".csv";
}
function downloadCsv(ex){
  var txt=marksCsv(ex),url=null,a=document.createElement("a");
  try{
    url=URL.createObjectURL(new Blob([txt],{type:"text/csv;charset=utf-8"}));
  }catch(e){
    url="data:text/csv;charset=utf-8,"+encodeURIComponent(txt);
  }
  a.href=url; a.download=csvFileName(ex);
  a.style.cssText="position:fixed;inset-inline-start:-9999px";
  document.body.appendChild(a); a.click();
  setTimeout(function(){
    if(a.parentNode)a.parentNode.removeChild(a);
    if(url&&url.indexOf("blob:")===0){try{URL.revokeObjectURL(url)}catch(e){}}
  },400);
}
function marksTable(ex){
  var out=(ex.spec.t||xt("exam"))+"\n";
  out+=xt("mkTblHead")+"\n";
  (ex.subs||[]).slice().sort(function(a,b){return b.pct-a.pct}).forEach(function(s){
    var wrong=uniq(s.per.filter(function(p){return !p.ok}).map(function(p){return p.topicName}));
    out+=(s.name||xt("mkNoName"))+"\t"+s.pct+"\t"+s.ok+"/"+s.n+"\t"+wrong.join(", ")+"\n";
  });
  return out;
}

/* ------------------------------------------------------------
   מסך התלמיד — מבחן מתוך קישור
   ------------------------------------------------------------ */
var SIT={spec:null,id:"",qs:[],i:0,name:"",answers:[],phase:"intro",code:"",copied:false};

function sitStart(){
  var nm=$("#sitName"); SIT.name=nm?nm.value.trim():"";

     מציגים את מסך המבחן השבור במקום ליפול על שאלה שאינה קיימת. */
  if(!SIT.qs.length){view="badexam"; render(); return}
  SIT.answers=SIT.qs.map(function(){return -1});

  window.scrollTo(0,0); render();
}
function sitAnswer(i){
  if(SIT.phase!=="ask")return;

}
function sitNext(){
  if(SIT.i+1<SIT.qs.length){SIT.i++;window.scrollTo(0,0);render();return}
  /* לא מגישים בלחיצה על תשובה. לחיצה בטעות על האפשרות האחרונה
     אינה אמורה לסיים מבחן. */
  SIT.phase="review"; stopSpeak(); window.scrollTo(0,0); render();

/* התוצאה נשלחת כקישור ולא כקוד: המורה לוחץ, האפליקציה נפתחת אצלו
   וקולטת. הקוד עצמו יושב אחרי #r=, ולכן גם הדבקה של הקישור השלם
   בתיבת הקוד עובדת — codeOf מחלץ אותו משם. */
function resultUrl(code){return location.origin+location.pathname+"#r="+code}
function codeOf(raw){
  var m=String(raw||"").match(/#r=([A-Za-z0-9\-_]+)/);
  return (m?m[1]:String(raw||"")).trim();
}
function sitFinish(){
  SIT.phase="done";
  SIT.code=encodeResult(SIT.id,SIT.name,SIT.answers);
  stopSpeak(); window.scrollTo(0,0); render();
}
function sitGrade(){
  var ok=0,i;

  }
  return {ok:ok,n:SIT.qs.length,pct:Math.round(100*ok/SIT.qs.length)};
}
