<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>אקסיומה ב׳ — שנה שנייה, צעד אחר צעד</title>
<meta name="description" content="תרגול מתמטיקה לשנה ב׳ באוניברסיטה: חדו״א 2, אלגברה לינארית 2, משוואות דיפרנציאליות והסתברות. כל שאלה עם פתרון מודרך צעד־צעד, זיהוי הטעות, דף נוסחאות והקראה בקול טבעי." />
<meta name="theme-color" content="#0e1117" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   אקסיומה ב׳ — מתמטיקה לשנה ב׳
   המשך ישיר של ״אקסיומה״, בחומר של שנה ב׳: חדו״א 2, אלגברה לינארית 2,
   משוואות דיפרנציאליות והסתברות רציפה. סטודנט שמתקשה לא צריך פחות
   חומר — הוא צריך לראות את הצעדים שבין שורה לשורה.
   ============================================================ */
:root{
  --font:"Heebo","Rubik",system-ui,"Segoe UI",Arial,sans-serif;
  --bg:#f5f7fb; --surface:#ffffff; --surface2:#eef1f7;
  --ink:#101828; --muted:#5b6478; --faint:#8b93a7; --line:#e0e4ee;
  --accent:#4f46e5; --accent-ink:#ffffff; --accent-soft:#e9e8fd;
  /* צהוב ההדגשה — אותו צהוב של מקריא קולי, כדי שמעקב ההקראה
     ייראה אותו דבר בכל האתר. */
  --hit:#f5c451; --hit-ink:#1a1300;
  --cyan:#0e7490; --cyan-soft:#dcf3f8;
  --ok:#15803d; --ok-soft:#dcfce7; --bad:#be123c; --bad-soft:#ffe4e9;
  --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px -12px rgba(16,24,40,.18);
  --r:14px;
  /* צבע לכל תחום לימוד. זה לא קישוט — זה עוזר לזהות מיד באיזה
     סוג חומר מדובר, וזה בדיוק מה שעוזר למי שמתקשה להתמצא. */
  --c-base:#0d9488; --cs-base:#d2f4ef;
  --c-alg:#5b56e0;  --cs-alg:#e6e5fe;
  --c-geo:#b45309;  --cs-geo:#fbecd3;
  --c-data:#be185d; --cs-data:#fbdfeb;
}
:root[data-theme="dark"]{
  --bg:#0e1117; --surface:#161b26; --surface2:#1e2532;
  --ink:#e8ecf4; --muted:#9aa4ba; --faint:#6f7a91; --line:#28313f;
  --accent:#818cf8; --accent-ink:#0e1117; --accent-soft:#232842;
  --hit:#ffd24d; --hit-ink:#241a00;
  --cyan:#22d3ee; --cyan-soft:#132b33;
  --ok:#4ade80; --ok-soft:#132a1c; --bad:#fb7185; --bad-soft:#33161f;
  --warn:#fbbf24; --warn-soft:#33260f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  --c-base:#2dd4bf; --cs-base:#0f2e2b;
  --c-alg:#a5b4fc;  --cs-alg:#1e2140;
  --c-geo:#fbbf24;  --cs-geo:#33270f;
  --c-data:#f472b6; --cs-data:#33162a;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1117; --surface:#161b26; --surface2:#1e2532;
    --ink:#e8ecf4; --muted:#9aa4ba; --faint:#6f7a91; --line:#28313f;
    --accent:#818cf8; --accent-ink:#0e1117; --accent-soft:#232842;
    --hit:#ffd24d; --hit-ink:#241a00;
    --cyan:#22d3ee; --cyan-soft:#132b33;
    --ok:#4ade80; --ok-soft:#132a1c; --bad:#fb7185; --bad-soft:#33161f;
    --warn:#fbbf24; --warn-soft:#33260f;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  --c-base:#2dd4bf; --cs-base:#0f2e2b;
  --c-alg:#a5b4fc;  --cs-alg:#1e2140;
  --c-geo:#fbbf24;  --cs-geo:#33270f;
  --c-data:#f472b6; --cs-data:#33162a;
  }
}
/* ניגודיות גבוהה — שחור על לבן, מסגרות מלאות, בלי גוונים רכים */
:root.hc{
  --bg:#ffffff; --surface:#ffffff; --surface2:#ffffff;
  --ink:#000000; --muted:#1a1a1a; --faint:#333333; --line:#000000;
  --accent:#00308f; --accent-ink:#ffffff; --accent-soft:#e8edf8;
  --hit:#ffe600; --hit-ink:#000000;
  --cyan:#004b57; --cyan-soft:#e6f2f4;
  --ok:#0a5c2a; --ok-soft:#e6f4ea; --bad:#8c0f2c; --bad-soft:#fbe9ed;
  --warn:#6b3d00; --warn-soft:#f7efdf; --shadow:none;
  --c-base:#00308f; --cs-base:#e8edf8; --c-alg:#00308f; --cs-alg:#e8edf8;
  --c-geo:#00308f;  --cs-geo:#e8edf8;  --c-data:#00308f; --cs-data:#e8edf8;
}
:root.hc .card,:root.hc .opt,:root.hc .btn,:root.hc .chip,:root.hc .tile{border:2px solid #000}
:root.hc .deco{display:none}

*{box-sizing:border-box;margin:0}
html{font-size:100%}
html.ts2{font-size:112%}
html.ts3{font-size:126%}
/* פונט ברור לקריאה: Tahoma ו-Verdana קיימים כמעט בכל מכשיר וכוללים עברית */
html.clearfont{--font:Tahoma,Verdana,Arial,sans-serif}
/* ריווח מוגדל — עוזר לקוראים עם דיסלקציה */
html.spaced body{letter-spacing:.03em;word-spacing:.16em;line-height:1.95}
html.rm *,html.rm *::before,html.rm *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.65;
  -webkit-text-size-adjust:100%;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:inherit}
input,select,textarea{font:inherit;color:var(--ink)}
a{color:var(--accent)}
::selection{background:var(--accent);color:var(--accent-ink)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---------- שלד ---------- */
#app{min-height:100vh;display:flex;flex-direction:column}
/* בלי זה כרום מותח כל מסך לרוחב המינימלי של התוכן שלו והעמוד גולש בטלפון */
#app>*{min-width:0;width:100%}
.wrap{max-width:1120px;margin:0 auto;padding:0 clamp(12px,4vw,22px)}
.deco{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.85;
  background:
    radial-gradient(760px 380px at 92% -6%,var(--cs-alg),transparent 62%),
    radial-gradient(620px 340px at 2% 18%,var(--cs-data),transparent 58%),
    radial-gradient(700px 380px at 10% 102%,var(--cs-base),transparent 60%),
    radial-gradient(520px 300px at 96% 78%,var(--cs-geo),transparent 58%)}
#app{position:relative;z-index:1}

/* ---------- כותרת עליונה ---------- */
header{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:10px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand .mk{width:38px;height:38px;border-radius:11px;
  background:linear-gradient(140deg,var(--c-alg),var(--c-data) 55%,var(--c-geo));color:#fff;
  display:grid;place-items:center;font-weight:800;font-size:1.05rem;flex-shrink:0}
:root.hc .brand .mk{background:var(--ink)}
.brand b{display:block;font-size:1rem;line-height:1.15;font-weight:800}
.brand small{display:block;color:var(--muted);font-size:.72rem;font-weight:500}
nav{display:flex;gap:4px;margin-inline-start:auto;flex-wrap:wrap}
.nb{display:inline-flex;align-items:center;gap:6px;border-radius:10px;padding:8px 12px;
  font-size:.9rem;font-weight:600;color:var(--muted);border:1px solid transparent;transition:.15s}
.nb:hover{background:var(--surface2);color:var(--ink)}
.nb.on{background:var(--accent);color:#fff}
:root.hc .nb.on{background:var(--ink);color:var(--bg)}
.nb svg{flex-shrink:0}
@media(max-width:560px){.nb span{display:none}.nb{padding:9px 11px}}

/* ---------- רכיבי בסיס ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:clamp(14px,3.4vw,22px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:11px;
  font-weight:700;padding:12px 18px;transition:.15s;border:1px solid transparent;line-height:1.3}
.btn-p{background:linear-gradient(135deg,var(--accent),var(--c-data));color:#fff}
.btn-p:hover{filter:brightness(1.1)}
:root.hc .btn-p{background:var(--accent)}
.btn-d{background:var(--ink);color:var(--bg)}
.btn-g{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-g:hover{background:var(--surface2)}
.btn[disabled]{opacity:.42;cursor:not-allowed}
.btn.w{width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;
  font-size:.82rem;font-weight:600;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.chip.a{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.h1{font-size:clamp(1.5rem,5.2vw,2.05rem);font-weight:800;line-height:1.2;overflow-wrap:anywhere}
.h2{font-size:clamp(1.1rem,3.6vw,1.3rem);font-weight:700;overflow-wrap:anywhere}
.sub{color:var(--muted);margin-top:5px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.sm{font-size:.85rem}
.xs{font-size:.76rem}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
/* רשימת הקולות: שתי עמודות רק כשבאמת יש מקום, אחרת השמות נקטעים */
.vgrid{grid-template-columns:repeat(auto-fit,minmax(min(100%,215px),1fr));gap:8px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
hr.sep{border:none;border-top:1px solid var(--line);margin:16px 0}

/* ---------- מתמטיקה: תמיד משמאל לימין, מבודד מהעברית ---------- */
.m{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums}
.mline{direction:ltr;unicode-bidi:isolate;text-align:center;font-weight:700;
  font-size:clamp(1.55rem,7vw,2.5rem);letter-spacing:.01em;line-height:1.35;overflow-wrap:anywhere}
.mstep{direction:ltr;unicode-bidi:isolate;text-align:center;font-weight:700;
  font-size:clamp(1.05rem,4.6vw,1.35rem);background:var(--surface2);border-radius:10px;
  padding:9px 12px;margin-top:8px;overflow-wrap:anywhere}
sup{font-size:.62em;vertical-align:super;line-height:0}
sub{font-size:.62em;vertical-align:sub;line-height:0}
/* ---------- מטריצה ווקטור ---------- */
.mtx{display:inline-flex;align-items:stretch;gap:7px;vertical-align:middle;
  padding:3px 10px;margin:0 .2em;position:relative;direction:ltr}
.mtx::before,.mtx::after{content:"";position:absolute;top:0;bottom:0;width:7px;
  border-top:2px solid currentColor;border-bottom:2px solid currentColor}
.mtx::before{inset-inline-start:0;border-inline-start:2px solid currentColor}
.mtx::after{inset-inline-end:0;border-inline-end:2px solid currentColor}
.mtx .mcol{display:flex;flex-direction:column;gap:3px;text-align:center;min-width:1.5em}
.mtx .mcol>span{padding:1px 4px;font-variant-numeric:tabular-nums}
.vec{display:inline-flex;gap:9px;padding:2px 11px;margin:0 .16em;direction:ltr;
  border-inline-start:2px solid currentColor;border-inline-end:2px solid currentColor;border-radius:9px}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;
  line-height:1.05;margin:0 .18em;font-size:.86em}
.frac>span:first-child{border-bottom:.09em solid currentColor;padding:0 .22em}
.frac>span:last-child{padding:0 .22em}

/* ---------- תשובות ---------- */
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
@media(max-width:430px){.opts{grid-template-columns:minmax(0,1fr)}}
.opt{position:relative;border:2px solid var(--line);background:var(--surface);border-radius:12px;
  padding:15px 14px 15px 44px;font-weight:700;font-size:clamp(1rem,4vw,1.2rem);transition:.14s;min-height:58px;
  display:flex;align-items:center;gap:10px}
[dir="rtl"] .opt{padding:15px 44px 15px 14px}
.opt:hover:not([disabled]){border-color:var(--c,var(--accent));background:var(--cs,var(--accent-soft))}
.opt .k{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);
  width:24px;height:24px;border-radius:7px;background:var(--cs,var(--surface2));color:var(--c,var(--faint));
  display:grid;place-items:center;font-size:.76rem;font-weight:700}
/* currentColor כאן היה נפתר לצבע שנקבע באותה הצהרה עצמה,
   ולכן הרקע והטקסט יצאו זהים והספרה נעלמה. */
.opt.right .k{background:var(--ok);color:var(--surface)}
.opt.wrong .k{background:var(--bad);color:var(--surface)}
.opt.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
/* בחירה במבחן היא בחירה, לא תשובה נכונה. במסכי התרגול הצבע
   הירוק אומר "צדקת", ובמבחן אסור לו להופיע כלל — הוא נותן
   משוב שגוי לכל בחירה. ניטרלי, ורק מסמן מה סומן. */
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.opt.dim{opacity:.4}
.opt.gone{opacity:.35;text-decoration:line-through}

/* ---------- פתרון מודרך ---------- */
.steps{margin-top:16px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.step{padding:13px 15px;border-top:1px solid var(--line);background:var(--surface)}
.step:first-child{border-top:none}
.step.future{display:none}
.step .st{display:flex;align-items:center;gap:9px;font-weight:700;font-size:.95rem}
.step .num{width:23px;height:23px;border-radius:50%;background:var(--c,var(--accent));color:#fff;
  display:grid;place-items:center;font-size:.76rem;flex-shrink:0;font-weight:700}
.step .sd{color:var(--muted);font-size:.92rem;margin-top:4px;overflow-wrap:anywhere}
.step.last{background:var(--ok-soft)}
.step.last .num{background:var(--ok);color:var(--surface)}

/* ---------- פירוט טעות ---------- */
.diag{margin-top:14px;border-inline-start:4px solid var(--bad);background:var(--bad-soft);
  border-radius:0 10px 10px 0;padding:12px 15px}
[dir="rtl"] .diag{border-radius:10px 0 0 10px}
.diag b{color:var(--bad)}
.hintbox{margin-top:14px;border-inline-start:4px solid var(--warn);background:var(--warn-soft);
  border-radius:0 10px 10px 0;padding:12px 15px}
.wd{border-radius:5px;padding:1px 3px}
.wd.hit{background:var(--hit);color:var(--hit-ink);font-weight:600}
[dir="rtl"] .hintbox{border-radius:10px 0 0 10px}

/* ---------- מדדים ---------- */
.bar{height:7px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s,background .3s}
.bar.ok>i{background:var(--ok)}
.bar.mid>i{background:var(--warn)}
.bar.low>i{background:var(--bad)}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--surface2);border:1px solid var(--line)}
.dot.ok{background:var(--ok);border-color:var(--ok)}
.dot.no{background:var(--bad);border-color:var(--bad)}
.dot.flag{box-shadow:0 0 0 2px var(--accent)}
.dot.hp{background:var(--warn);border-color:var(--warn)}
.tile{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--c,var(--accent));
  border-radius:12px;padding:14px;box-shadow:var(--shadow)}
.tile b{display:block;font-size:1.7rem;font-weight:800;line-height:1.2;color:var(--c,var(--ink))}
.tile span{color:var(--muted);font-size:.82rem}

/* ---------- כרטיס נושא ---------- */
.tpc{position:relative;display:flex;flex-direction:column;gap:9px;text-align:start;background:var(--surface);
  border:1px solid var(--line);border-inline-start:4px solid var(--c,var(--accent));
  border-radius:12px;padding:14px;transition:.15s;box-shadow:var(--shadow);min-width:0}
.tpc:hover{border-color:var(--c,var(--accent));transform:translateY(-2px);box-shadow:0 8px 22px -12px var(--c)}
.tpc:hover{border-inline-start-color:var(--c,var(--accent))}
.tpc.on{border-color:var(--c,var(--accent));background:var(--cs,var(--accent-soft))}
.tpc .tn{color:var(--c,var(--ink))}
.tpc .tn{font-weight:700;font-size:.98rem;overflow-wrap:anywhere}
.tpc .td{color:var(--muted);font-size:.8rem;overflow-wrap:anywhere}
.tpc .tm{display:flex;align-items:center;gap:7px;font-size:.74rem;color:var(--faint)}
.tpc .tm .bar{flex:1;min-width:0}

/* ---------- מתגים והגדרות ---------- */
.tog{display:flex;align-items:center;gap:13px;width:100%;text-align:start;background:var(--surface2);
  border:1px solid transparent;border-radius:12px;padding:13px 15px;transition:.15s;min-width:0}
.tog:hover{border-color:var(--line)}
.tog+.tog{margin-top:9px}
.tog .tt{flex:1;min-width:0}
.tog .tt b{display:block;font-size:.97rem;overflow-wrap:anywhere}
.tog .tt span{display:block;color:var(--muted);font-size:.82rem;overflow-wrap:anywhere}
.sw{position:relative;width:46px;height:27px;border-radius:99px;background:var(--line);flex-shrink:0;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:21px;height:21px;border-radius:50%;
  background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .2s}
.tog[aria-checked="true"] .sw{background:var(--accent)}
.tog[aria-checked="true"] .sw::after{transform:translateX(-19px)}
[dir="ltr"] .tog[aria-checked="true"] .sw::after{transform:translateX(19px)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 auto;min-width:0;border:1px solid var(--line);background:var(--surface);
  border-radius:10px;padding:10px 12px;font-weight:600;font-size:.9rem;color:var(--muted);transition:.15s}
.seg button.on{background:var(--c,var(--ink));color:#fff;border-color:transparent}
:root.hc .seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--accent)}
.field{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:11px;
  padding:12px 14px;font-size:1rem;outline:none}
.field:focus{border-color:var(--accent)}

/* ---------- דף נוסחאות ---------- */
.a-base{--c:var(--c-base);--cs:var(--cs-base)}
.a-alg{--c:var(--c-alg);--cs:var(--cs-alg)}
.a-geo{--c:var(--c-geo);--cs:var(--cs-geo)}
.a-data{--c:var(--c-data);--cs:var(--cs-data)}
.chip.area{background:var(--cs);color:var(--c);border-color:transparent}
.arh{display:flex;align-items:center;gap:9px}

/* ---------- שורת מצב הקול ---------- */
.vstrip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;
  padding:9px 13px;border-radius:11px;font-size:.86rem;font-weight:600;line-height:1.5}
.vstrip>span{flex:1;min-width:0}
.vstrip .btn{padding:6px 12px;font-size:.8rem;background:var(--surface);border-color:currentColor}
.vstrip.ok{background:var(--ok-soft);color:var(--ok)}
.vstrip.warn{background:var(--warn-soft);color:var(--warn)}
.vstrip.bad{background:var(--bad-soft);color:var(--bad)}

/* ---------- שכבות ---------- */
.ov{position:fixed;inset:0;z-index:80;background:rgba(8,11,18,.62);backdrop-filter:blur(3px);
  display:grid;place-items:center;padding:14px}
.ovbox{background:var(--surface);border-radius:16px;width:100%;max-width:560px;max-height:92vh;
  overflow-y:auto;padding:20px;box-shadow:0 24px 70px rgba(0,0,0,.45)}
.ovx{width:36px;height:36px;border-radius:50%;background:var(--surface2);font-size:1.1rem;
  font-weight:700;color:var(--muted);flex-shrink:0;display:grid;place-items:center}

/* ---------- אנימציות מדודות ---------- */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes nudge{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.rise{animation:rise .3s ease both}
.nudge{animation:nudge .3s ease}

footer{border-top:1px solid var(--line);margin-top:auto;background:var(--surface)}
.fbar{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;
  padding-block:16px;font-size:.82rem;color:var(--muted)}
.skip{position:absolute;inset-inline-start:-9999px}
.skip:focus{position:static;display:inline-flex;align-items:center;min-height:44px;margin:8px;padding:8px 14px;background:var(--accent);color:var(--accent-ink);border-radius:8px}

function Fr(n,d){

  if(d<0){n=-n;d=-d}
  var g=gcd(n,d);
  this.n=n/g;this.d=d/g;
}
Fr.prototype.add=function(o){return new Fr(this.n*o.d+o.n*this.d,this.d*o.d)};
Fr.prototype.sub=function(o){return new Fr(this.n*o.d-o.n*this.d,this.d*o.d)};
Fr.prototype.mul=function(o){return new Fr(this.n*o.n,this.d*o.d)};
Fr.prototype.div=function(o){return new Fr(this.n*o.d,this.d*o.n)};

Fr.prototype.eq=function(o){return this.n===o.n&&this.d===o.d};

/* HTML — שבר אמיתי עם קו אופקי, קריא הרבה יותר לתלמיד שמתקשה */

  if(this.d===1)return String(this.n);
  var sign=this.n<0?"−":"";
  return sign+'<span class="frac"><span>'+Math.abs(this.n)+'</span><span>'+this.d+'</span></span>';
};

  if(this.d===1)return String(this.n);

/* מספר לתצוגה: מינוס טיפוגרפי, בלי אפסים מיותרים אחרי הנקודה */
function r2(v){return Math.round(v*100)/100}
function num(v){
  if(typeof v!=="number")return String(v);
  var s=(Math.round(v*1e6)/1e6).toString();
  return s.replace(/^-/,"−");
}
function say(v){return String(v).replace(/−/g,_("מינוס ")).replace(/·/g,_(" כפול "))}

/* " + 5" / " − 5" — לחיבור איברים בביטוי */
function sgn(v){return (v<0?" − ":" + ")+Math.abs(v)}
/* מקדם לפני משתנה: 1x -> x, -1x -> -x */
function coef(c,v){
  if(c===1)return v;
  if(c===-1)return "−"+v;
  return num(c)+v;
}
/* מקדם שמופיע לפני סוגריים. 1 לא נכתב, ו-−1 נכתב כמינוס בלבד. */
function fac(c){return c===1?"":c===-1?"−":num(c)}
/* מקדם כשהסימן כבר נכתב בנפרד: 1 לא נכתב כלל */
function afac(c){var a=Math.abs(c);return a===1?"":num(a)}
/* איבר עם סימן, לשרשור בתוך ביטוי: " + 3x" / " − x" */
function term(c,v){
  if(c===0)return "";
  var s=c<0?" − ":" + ",a=Math.abs(c);
  return s+(a===1?v:a+v);
}
/* חזקה */
function pw(base,e){
  if(e===1)return base;
  if(e===0)return "1";
  return base+"<sup>"+num(e)+"</sup>";
}
/* פולינום ריבועי מהמקדמים */
function quadStr(a,b,c,v){
  v=v||"x";
  var s=(a===1?"":a===-1?"−":num(a))+v+"<sup>2</sup>";
  s+=term(b,v);
  if(c!==0)s+=sgn(c);
  return s;
}
/* שורש: מציג √50 = 5√2 */
function simpRoot(n){
  var out=1,i;
  for(i=Math.floor(Math.sqrt(n));i>=2;i--){ if(n%(i*i)===0){out=i;n=n/(i*i);break} }
  return {out:out,in:n};
}
function rootHtml(o){
  if(o.in===1)return String(o.out);
  return (o.out===1?"":o.out)+"√"+o.in;
}
function isSquare(n){var r=Math.round(Math.sqrt(n));return r*r===n}

/* מטריצה מ-מערך שורות: mat([[1,2],[3,4]]) */
function mat(rows){
  var cols=rows[0].length,out="",c,r;
  for(c=0;c<cols;c++){
    out+='<span class="mcol">';
    for(r=0;r<rows.length;r++)out+='<span>'+num(rows[r][c])+'</span>';
    out+='</span>';
  }
  return '<span class="mtx">'+out+'</span>';
}

/* פולינום ממערך מקדמים מהחזקה הגבוהה לנמוכה: poly([2,0,-5,1]) */
function poly(cs,v){
  v=v||"x";
  var n=cs.length-1,out="",i,c,p,t;
  for(i=0;i<cs.length;i++){
    c=cs[i];p=n-i;
    if(c===0)continue;
    t=(p===0?String(Math.abs(c)):(Math.abs(c)===1?"":Math.abs(c))+pw(v,p));
    out+=out===""?(c<0?"−":"")+t:(c<0?" − ":" + ")+t;
  }
  return out===""?"0":out;
}

/* ============================================================

   אינה מתורגמת כי היא כבר אוניברסלית. מה שמתורגם הוא כל מה

var LANGS={
  he:{name:"עברית",   dir:"rtl", tts:"he-IL"},
  ar:{name:"العربية", dir:"rtl", tts:"ar-SA"},
  ru:{name:"Русский", dir:"ltr", tts:"ru-RU"},
  en:{name:"English", dir:"ltr", tts:"en-US"}
};
var LG="he";
var TR={};
function _(h){
  if(LG==="he")return h;
  var d=TR[LG];
  if(!d)return h;
  var v=d[h];
  return v===undefined?h:v;
}
/* תבנית עם ערכים מוצבים. סדר החלקים אינו זהה בכל שפה, ולכן משפט
   שמשולב בו מספר נשמר כתבנית שלמה ולא כשני חלקים מודבקים. */
function _f(h){
  var t=_(h),i,args=arguments;
  for(i=1;i<args.length;i++)t=t.split("{"+(i-1)+"}").join(String(args[i]));
  return t;
}
/* אנגלית אינה סימן. טלפון בישראל מדווח אנגלית כברירת מחדל של
   המכשיר, לא כבחירה, והאפליקציה נפתחה באנגלית למי שבא ללמוד
   בעברית. ערבית ורוסית כן נחשבות — שם זו שפת אם של ממש. מי
   שרוצה אנגלית בוחר אותה, והבחירה נשמרת. */
function guessLang(){
  var ls=(navigator.languages||[navigator.language||"he"]);
  for(var i=0;i<ls.length;i++){
    var c=String(ls[i]).toLowerCase().split("-")[0];
    if(c==="iw")c="he";
    if(c==="en")continue;
    if(LANGS[c])return c;
  }
  return "he";
}

var state=blankState();

function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(!raw)return false;
    var s=JSON.parse(raw);
    if(!s||typeof s!=="object")return false;
    var base=blankState(),k;
    for(k in base)if(!(k in s))s[k]=base[k];
    for(k in base.settings)if(!(k in s.settings))s.settings[k]=base.settings[k];
    for(k in base.stats)if(!(k in s.stats))s.stats[k]=base.stats[k];
    state=s;
    return true;
  }catch(e){return false}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}

/* רצף ימים — נספר רק כשבאמת תרגלו, ובמצב רגוע לא מוצג בכלל */
function touchDay(){
  var d=todayIso(),st=state.stats;
  if(st.lastDay===d)return;
  if(st.lastDay&&daysBetween(st.lastDay,d)===1)st.streakDays++;
  else st.streakDays=1;
  st.lastDay=d;
}
function dayRec(){
  var d=todayIso();
  if(!state.days[d])state.days[d]={a:0,c:0};
  return state.days[d];
}

function applyModes(){

   speakMath ומשנות צורה, ולכן שם אין מיפוי ומדגישים את הכרטיס.

var HL={el:null,raw:"",spans:[],map:[],timer:null,got:false,added:false};
function hlClear(){

  if(HL.el){try{HL.el.innerHTML=HL.raw;HL.el.classList.remove("now")}catch(e){}}
  HL={el:null,raw:"",spans:[],map:[],timer:null,got:false,added:false};

}

  hlClear();

    HL.map.push({from:pos,to:pos+pt.length,i:idx});
    html+='<span class="wd" data-i="'+idx+'">'+esc(pt)+'</span>';
    pos+=pt.length; idx++;

  if(!HL.map.length){hlClear();return}
  el.innerHTML=html;
  HL.spans=el.querySelectorAll(".wd");
  HL.timer=setTimeout(function(){if(!HL.got&&HL.el){HL.added=true;HL.el.classList.add("now")}},1500);
}
function hlAt(c){

  if(HL.added){HL.el.classList.remove("now");HL.added=false}
  for(var k=0;k<HL.map.length;k++){
    if(c>=HL.map[k].from&&c<HL.map[k].to){

        W(wrongs[0],_("שכחתם את העצרת במכנה. המקדם הוא הנגזרת ה-n־ית חלקי n עצרת.")),
        W(wrongs[1],_("איבדתם את האיבר החופשי. הוא ערך הפונקציה באפס.")),
        W(wrongs[2],_("טעות סימן. בודקים על ידי הצבת x קטן ובדיקה מול הפונקציה עצמה."))
      ],
      steps:[
        S(_("נוסחת מקלורן"),_("כל מקדם הוא הנגזרת ה-n־ית באפס, חלקי n עצרת."),
          "f(x) = Σ "+frac("f<sup>(n)</sup>(0)","n!")+" xⁿ"),
        S(_("מה מיוחד כאן"),data.why,""),
        S(_("התוצאה"),"",data.t3+" + …")
      ],rule:"maclaurin",hint:_("המקדם ה-n־י הוא הנגזרת ה-n־ית באפס חלקי n עצרת.")};
  }
  if(L===2){
    /* פיתוח פולינום סביב נקודה — כאן טיילור הוא בדיוק כתיבה מחדש */
    a=rnz(-3,3);var A=ri(1,4),B=rnz(-5,5),C=rnz(-6,6);
    /* B = −A·a היה עושה את "פיתוח סביב אפס" זהה ל"סימן הפוך", ו-f′=0 מוחק את האיבר הלינארי */
    while(B===0||B===-A*a||2*A*a+B===0)B=B+1;
    var f0=A*a*a+B*a+C, f1=2*A*a+B, f2=2*A;
    return {ask:_f("פתחו את הפונקציה לטור טיילור סביב x = {0}.", num(a)),
      expr:"f(x) = "+poly([A,B,C]),
      ans:W(num(f0)+" "+(f1<0?"−":"+")+" "+afac(f1)+"(x"+sgn(-a)+") + "+afac(A)+"(x"+sgn(-a)+")²"),
      wrong:[
        W(num(f0)+" "+(f1<0?"−":"+")+" "+afac(f1)+"(x"+sgn(-a)+") + "+afac(f2)+"(x"+sgn(-a)+")²",
          _("שכחתם לחלק ב-2 עצרת. המקדם השני הוא הנגזרת השנייה חלקי 2.")),
        W(num(f0)+" "+(f1<0?"+":"−")+" "+afac(f1)+"(x"+sgn(-a)+") + "+afac(A)+"(x"+sgn(-a)+")²",
          _("איבדתם את סימן הנגזרת הראשונה.")),
        W(num(C)+" "+(B<0?"−":"+")+" "+afac(B)+"(x"+sgn(-a)+") + "+afac(A)+"(x"+sgn(-a)+")²",
          _f("הצבתם אפס במקום {0}. הפיתוח הוא סביב הנקודה שנתונה.", num(a)))
      ],
      steps:[
        S(_("מחשבים שלוש נגזרות בנקודה"),"",
          "f("+num(a)+") = "+num(f0)+"   ,   f′("+num(a)+") = "+num(f1)+"   ,   f″ = "+num(f2)),
        S(_("מציבים בנוסחה"),_("כל מקדם הוא הנגזרת חלקי העצרת המתאימה."),
          "f(a) + f′(a)(x−a) + "+frac("f″(a)","2!")+"(x−a)²"),
        S(_("מפשטים"),_("לפולינום ממעלה שנייה הפיתוח נעצר כאן — הנגזרת השלישית אפס."),
          num(f0)+" "+(f1<0?"−":"+")+" "+afac(f1)+"(x"+sgn(-a)+") + "+afac(A)+"(x"+sgn(-a)+")²")
      ],rule:"taylor",hint:_("f(a) + f′(a)(x−a) + f″(a)(x−a)² חלקי 2. כל מקדם מחולק בעצרת.")};
  }
  /* L3 — גבול בעזרת פיתוח, במקום לופיטל */
  k=pick(["sin","cos","exp"]);
  var d={sin:{e:"sin x − x",den:"x³",v:"−1/6",
              w:["0",_("הצבתם ישירות וקיבלתם 0 חלקי 0. זו לא תשובה — צריך לפתח."),"−1/2","1/6"],
              exp:"x − x³/6 + … − x = −x³/6"},
         cos:{e:"1 − cos x",den:"x²",v:"1/2",
              w:["0",_("הצבתם ישירות וקיבלתם 0 חלקי 0. צריך לפתח."),"1","−1/2"],
              exp:"1 − (1 − x²/2 + …) = x²/2"},
         exp:{e:"e<sup>x</sup> − 1 − x",den:"x²",v:"1/2",
              w:["0",_("הצבתם ישירות וקיבלתם 0 חלקי 0. צריך לפתח."),"1","1/6"],
              exp:"(1 + x + x²/2 + …) − 1 − x = x²/2"}}[k];
  return {ask:_("חשבו את הגבול בעזרת פיתוח לטור"),
    expr:"lim<sub>x→0</sub> "+frac(d.e,d.den),
    ans:W(d.v),
    wrong:[W(d.w[0],d.w[1]),
           W(d.w[2],_("טעות במקדם הפיתוח. כדאי לרשום את שלושת האיברים הראשונים במפורש.")),
           W(d.w[3],_("החלפתם בין המכנים של הפיתוחים. כל פונקציה והמקדמים שלה."))],
    steps:[
      S(_("מפתחים את המונה"),_("מספיקים שני־שלושה איברים — כל השאר קטן מדי כדי להשפיע."),d.exp),
      S(_("מצמצמים מול המכנה"),_("החזקה שנשארה במונה היא בדיוק חזקת המכנה, וזה מה שנותן ערך סופי."),""),
      S(_("התוצאה"),"",d.v)
    ],rule:"maclaurin",hint:_("במקום לופיטל: מפתחים את המונה לשני איברים ומצמצמים מול המכנה.")};
}

/* ---------- 3. אינטגרלים לא אמיתיים ---------- */
function genImproper(L){
  var a,p;
  if(L===1){
    p=pick([2,3,4]);
    var val=fr(1,p-1);
    return {ask:_("חשבו את האינטגרל הלא אמיתי"),
      expr:"∫<sub>1</sub><sup>∞</sup> "+frac("1","x<sup>"+p+"</sup>")+" dx",
      ans:W(val.html()),
      wrong:[
        W(_("מתבדר"),_f("מתבדר רק כאשר החזקה קטנה או שווה ל-1. כאן היא {0}.", num(p))),
        W(fr(1,p).html(),_("שכחתם להוריד 1 מהחזקה. אחרי האינטגרציה החזקה היא p פחות 1.")),
        W(fr(1,p+1).html(),_("העליתם את החזקה במקום להוריד אותה."))
      ],
      steps:[
        S(_("מחליפים אינסוף בגבול"),_("אינסוף אינו מספר שאפשר להציב. כותבים גבול ורק אז מציבים."),
          "lim<sub>b→∞</sub> ∫<sub>1</sub><sup>b</sup> x<sup>−"+p+"</sup> dx"),
        S(_("מוצאים פונקציה קדומה"),"",frac("x<sup>−"+(p-1)+"</sup>","−"+(p-1))),
        S(_("מציבים גבולות"),_f("החזקה השלילית שואפת לאפס כאשר b שואף לאינסוף, ונשאר רק הערך ב-1."),
          "0 − ("+_("מינוס ")+frac("1",num(p-1))+") = "+val.html())
      ],rule:"improp",hint:_("∫ מ-1 עד אינסוף של 1 חלקי x בחזקת p מתכנס אם ורק אם p גדול מ-1.")};
  }
  if(L===2){
    a=pick([1,2,3]);
    return {ask:_("האם האינטגרל מתכנס?"),
      expr:"∫<sub>0</sub><sup>1</sup> "+frac("1","x<sup>"+(a===1?"":a)+"</sup>")+" dx",
      ans:W(a===1?_("מתבדר"):(a>1?_("מתבדר"):_("מתכנס"))),
      wrong:[
        W(a>=1?_("מתכנס"):_("מתבדר"),
          _("בקצה 0 הכלל מתהפך: כאן מתכנס דווקא כאשר החזקה קטנה מ-1, ולא גדולה ממנה.")),
        W(_("אי אפשר לקבוע"),_("זהו אינטגרל p סטנדרטי בקצה אפס, וההכרעה מלאה.")),
        W(_("מתכנס רק אם החזקה שלמה"),_("שלמות החזקה אינה רלוונטית להתכנסות."))
      ],
      steps:[
        S(_("איפה הבעיה"),_("הפונקציה אינה חסומה ליד אפס, ולכן זה אינטגרל לא אמיתי מהסוג השני."),
          "x → 0<sup>+</sup>"),
        S(_("הכלל בקצה אפס"),_("∫ מ-0 עד 1 של 1 חלקי x בחזקת p מתכנס אם ורק אם p קטן מ-1. זה בדיוק הפוך מהכלל באינסוף."),
          "p < 1 ⇒ "+_("מתכנס")),
        S(_("מסקנה"),"","p = "+num(a)+(a<1?" < 1":" ≥ 1")+" ⇒ "+(a<1?_("מתכנס"):_("מתבדר")))
      ],rule:"improp0",hint:_("בקצה אפס הכלל הפוך: מתכנס כאשר החזקה קטנה מ-1.")};
  }
  a=ri(2,4);   /* a=1 היה נותן מסיחים ששווים לתשובה */
  return {ask:_("חשבו את האינטגרל הלא אמיתי"),
    expr:"∫<sub>0</sub><sup>∞</sup> "+num(a)+"e<sup>−"+num(a)+"x</sup> dx",
    ans:W("1"),
    wrong:[
      W(num(a),_("שכחתם לחלק במקדם שבמעריך. האינטגרל של e בחזקת מינוס kx הוא מינוס 1 חלקי k.")),
      W(fr(1,a).html(),_("חילקתם פעמיים — גם המקדם שבחוץ וגם זה שבמעריך הם אותו a, והם מצטמצמים.")),
      W(_("מתבדר"),_("מעריך שלילי גורם לדעיכה מהירה, והאינטגרל סופי."))
    ],
    steps:[
      S(_("מחליפים אינסוף בגבול"),"","lim<sub>b→∞</sub> ∫<sub>0</sub><sup>b</sup> "+num(a)+"e<sup>−"+num(a)+"x</sup> dx"),
      S(_("פונקציה קדומה"),_("הנגזרת הפנימית היא מינוס a, ולכן מחלקים בה."),"−e<sup>−"+num(a)+"x</sup>"),
      S(_("מציבים"),_("באינסוף האקספוננט שואף לאפס, ונשאר הערך באפס."),"0 − (−1) = 1")
    ],rule:"improp",hint:_("זו בדיוק פונקציית הצפיפות המעריכית, ולכן האינטגרל שלה הוא 1.")};
}

/* ---------- 4. נגזרות חלקיות וגרדיאנט ---------- */
function genPartial(L){
  var a,b,c;
  if(L===1){
    a=rnz(-5,5);b=rnz(-5,5);c=rnz(-6,6);
    /* f = a x² + b xy + c y² */
    return {ask:_("חשבו את הנגזרת החלקית לפי x"),
      expr:"f(x,y) = "+coef(a,"x²")+term(b,"xy")+term(c,"y²"),
      ans:W("f<sub>x</sub> = "+coef(2*a,"x")+term(b,"y")),
      wrong:[
        W("f<sub>x</sub> = "+coef(2*a,"x")+term(b,"y")+term(2*c,"y"),
          _("גזרתם גם את האיבר ב-y². בגזירה לפי x כל מה שאין בו x הוא קבוע, ונגזרתו אפס.")),
        W("f<sub>x</sub> = "+coef(a,"x")+term(b,"y"),_("שכחתם להוריד את החזקה למקדם.")),
        W("f<sub>x</sub> = "+coef(2*a,"x")+term(b,"x"),_("החלפתם משתנה. הנגזרת של bxy לפי x היא by."))
      ],
      steps:[
        S(_("y הוא קבוע"),_("בנגזרת חלקית לפי x מתייחסים ל-y כמו למספר. זה כל הרעיון."),""),
        S(_("גוזרים איבר איבר"),"",coef(a,"x²")+" → "+coef(2*a,"x")+"   ,   "+coef(b,"xy")+" → "+coef(b,"y")+"   ,   "+coef(c,"y²")+" → 0"),
        S(_("מחברים"),"","f<sub>x</sub> = "+coef(2*a,"x")+term(b,"y"))
      ],rule:"partial",hint:_("גוזרים לפי x ומתייחסים ל-y כמו למספר קבוע.")};
  }
  if(L===2){
    a=rnz(-4,4);b=rnz(-4,4);
    var x0=rnz(-3,3),y0=rnz(-3,3),gtry=0;
    var gx=2*a*x0+b*y0, gy=b*x0;
    /* רכיבים שווים היו הופכים את המסיח "החלפתם רכיבים" לתשובה הנכונה */
    while(gx===gy&&gtry++<30){x0=rnz(-3,3);y0=rnz(-3,3);gx=2*a*x0+b*y0;gy=b*x0}
    return {ask:_f("חשבו את הגרדיאנט בנקודה ({0} , {1})", num(x0), num(y0)),
      expr:"f(x,y) = "+coef(a,"x²")+term(b,"xy"),
      ans:W("∇f = ("+num(gx)+" , "+num(gy)+")"),
      wrong:[
        W("∇f = ("+num(gy)+" , "+num(gx)+")",_("החלפתם בין הרכיבים. הרכיב הראשון הוא הנגזרת לפי x.")),
        W("∇f = ("+num(2*a*x0)+" , "+num(b*x0)+")",_("שכחתם את האיבר המעורב בנגזרת לפי x.")),
        W("∇f = "+num(gx+gy),_("הגרדיאנט הוא וקטור, לא מספר. הוא מצביע לכיוון העלייה התלולה ביותר."))
      ],
      steps:[
        S(_("שתי נגזרות חלקיות"),"","f<sub>x</sub> = "+coef(2*a,"x")+term(b,"y")+"   ,   f<sub>y</sub> = "+coef(b,"x")),
        S(_("מציבים את הנקודה"),"","f<sub>x</sub> = "+num(gx)+"   ,   f<sub>y</sub> = "+num(gy)),
        S(_("הגרדיאנט הוא וקטור"),_("הוא מצביע לכיוון שבו הפונקציה עולה הכי מהר, וגודלו הוא קצב העלייה."),
          "∇f = ("+num(gx)+" , "+num(gy)+")")
      ],rule:"grad",hint:_("הגרדיאנט הוא הווקטור של הנגזרות החלקיות, לפי הסדר.")};
  }
  /* L3 — נגזרת מכוונת */
  a=rnz(-4,4);b=rnz(-4,4);
  var ux=pick([3,4]),uy=(ux===3?4:3),sg=pick([1,-1]);
  uy=uy*sg;
  var normd=5;
  var gx3=2*a, gy3=b;   /* בנקודה (1,1): f=ax²+bxy → fx=2a+b·1, fy=b·1 */
  gx3=2*a+b; gy3=b;
  var dd=(gx3*ux+gy3*uy)/normd;
  return {ask:_f("חשבו את הנגזרת המכוונת בנקודה (1 , 1) בכיוון u = ({0} , {1})", num(ux), num(uy)),
    expr:"f(x,y) = "+coef(a,"x²")+term(b,"xy"),
    ans:W(num(r2(dd))),
    wrong:[
      W(num(gx3*ux+gy3*uy),_("שכחתם לנרמל את וקטור הכיוון. נגזרת מכוונת מוגדרת לכיוון באורך 1.")),
      W(num(r2((gx3*uy+gy3*ux)/normd)),_("החלפתם בין רכיבי הכיוון.")),
      W(num(r2(Math.sqrt(gx3*gx3+gy3*gy3))),_("זה גודל הגרדיאנט — הנגזרת המכוונת המרבית, ולא זו שבכיוון שנתן."))
    ],
    steps:[
      S(_("הגרדיאנט בנקודה"),"","∇f = ("+num(gx3)+" , "+num(gy3)+")"),
      S(_("מנרמלים את הכיוון"),_("נגזרת מכוונת דורשת וקטור יחידה, אחרת התוצאה תלויה באורך שבחרו."),
        "|u| = "+normd+"   ,   û = ("+num(ux)+"/"+normd+" , "+num(uy)+"/"+normd+")"),
      S(_("מכפלה סקלרית"),_("הנגזרת המכוונת היא הגרדיאנט כפול וקטור היחידה."),
        "∇f · û = "+num(r2(dd)))
    ],rule:"dirder",hint:_("נגזרת מכוונת = גרדיאנט כפול וקטור כיוון מנורמל.")};
}

/* ---------- 5. קיצון בשני משתנים ---------- */
function genExtrema2(L){
  var a,b,c,d;
  if(L===1){
    /* f = a(x−p)² + b(y−q)² + c — סוג הקיצון נקבע רק בסימנים */
    var p=rnz(-3,3),q=rnz(-3,3);
    a=pick([1,-1])*ri(1,3); b=pick([1,-1])*ri(1,3);
    var kind=(a>0&&b>0)?_("מינימום"):(a<0&&b<0)?_("מקסימום"):_("נקודת אוכף");
    /* המסיחים הם שני הסוגים שלא נבחרו — אחרת אחד מהם היה התשובה עצמה */
    var rest=[_("מינימום"),_("מקסימום"),_("נקודת אוכף")].filter(function(k){return k!==kind});
    var whyKind=function(k){return k===_("נקודת אוכף")
      ?_("אוכף מתקבל רק כששני המקדמים בסימנים מנוגדים.")
      :_("שני המקדמים חיוביים נותנים מינימום, שניהם שליליים מקסימום, וסימנים מעורבים נותנים אוכף.")};
    return {ask:_("איזה סוג נקודה קריטית יש כאן?"),
      expr:"f(x,y) = "+fac(a)+"(x"+sgn(-p)+")² "+(b<0?"−":"+")+" "+afac(b)+"(y"+sgn(-q)+")²",
      ans:W(kind),
      wrong:[
        W(rest[0],whyKind(rest[0])),
        W(rest[1],whyKind(rest[1])),
        W(_("אין קיצון"),_("לפונקציה ריבועית בשני משתנים תמיד יש נקודה קריטית אחת."))
      ],
      steps:[
        S(_("איפה הנקודה הקריטית"),_("שתי הנגזרות החלקיות מתאפסות בדיוק במרכז הריבועים."),
          "("+num(p)+" , "+num(q)+")"),
        S(_("קוראים את הסימנים"),_("כל ריבוע תורם קמירות בכיוון שלו. הסימן של המקדם הוא כל הסיפור."),
          "a = "+num(a)+"   ,   b = "+num(b)),
        S(_("מסקנה"),"",kind)
      ],rule:"hess",hint:_("שני מקדמים חיוביים — מינימום. שניהם שליליים — מקסימום. מעורב — אוכף.")};
  }
  if(L===2){
    /* מבחן ההסיאן על f = ax² + bxy + cy² */
    a=rnz(-3,3);c=rnz(-3,3);b=rnz(-4,4);
    var D=4*a*c-b*b;
    var kind2=D<0?_("נקודת אוכף"):(D>0?(a>0?_("מינימום"):_("מקסימום")):_("המבחן אינו מכריע"));
    var rest2=[_("נקודת אוכף"),_("מינימום"),_("מקסימום")].filter(function(k){return k!==kind2});
    return {ask:_("מהו סוג הנקודה הקריטית (0 , 0)?"),
      expr:"f(x,y) = "+coef(a,"x²")+term(b,"xy")+term(c,"y²"),
      ans:W(kind2),
      wrong:[
        W(rest2[0],_("הדטרמיננטה של ההסיאן מכריעה קודם. שלילית פירושה אוכף, בלי קשר לסימן של a.")),
        W(rest2[1],_("אחרי שהדטרמיננטה חיובית, הסימן של f<sub>xx</sub> הוא שקובע — ולא ההפך ממנו.")),
        W(_("אין נקודה קריטית"),_("הגרדיאנט מתאפס בראשית, ולכן היא נקודה קריטית."))
      ],
      steps:[
        S(_("בונים את ההסיאן"),_("ארבע נגזרות שניות. המעורבות שוות זו לזו."),
          "f<sub>xx</sub> = "+num(2*a)+"   ,   f<sub>yy</sub> = "+num(2*c)+"   ,   f<sub>xy</sub> = "+num(b)),
        S(_("הדטרמיננטה"),_("D = f_xx·f_yy פחות ריבוע המעורבת."),
          "D = "+num(2*a)+"·"+pn(2*c)+" − "+pn(b)+"² = "+num(D)),
        S(_("קוראים את התוצאה"),_("D שלילי — אוכף. D חיובי — לפי הסימן של f_xx. D אפס — המבחן שותק."),kind2)
      ],rule:"hess",hint:_("D = f_xx·f_yy פחות f_xy בריבוע. שלילי זה אוכף, ורק אז מסתכלים על f_xx.")};
  }
  /* L3 — מציאת הנקודה הקריטית עצמה */
  a=ri(1,3);b=rnz(-6,6);d=rnz(-6,6);
  /* f = a x² + a y² + b x + d y  → קריטית ב-(−b/2a , −d/2a) */
  var xs=fr(-b,2*a),ys=fr(-d,2*a);
  return {ask:_("מצאו את הנקודה הקריטית"),
    expr:"f(x,y) = "+coef(a,"x²")+" + "+coef(a,"y²")+term(b,"x")+term(d,"y"),
    ans:W("("+xs.html()+" , "+ys.html()+")"),
    wrong:[
      W("("+fr(b,2*a).html()+" , "+fr(d,2*a).html()+")",_("טעות סימן. מעבירים אגף ואז מחלקים, והסימן מתהפך.")),
      W("("+fr(-b,a).html()+" , "+fr(-d,a).html()+")",_("שכחתם את ה-2 שמגיע מגזירת הריבוע.")),
      W("(0 , 0)",_("הראשית היא נקודה קריטית רק כשאין איברים לינאריים."))
    ],
    steps:[
      S(_("מאפסים שתי נגזרות"),"","f<sub>x</sub> = "+coef(2*a,"x")+sgn(b)+" = 0   ,   f<sub>y</sub> = "+coef(2*a,"y")+sgn(d)+" = 0"),
      S(_("פותרים כל אחת"),_("שתי משוואות בלתי תלויות, כל אחת בנעלם אחד."),
        "x = "+xs.html()+"   ,   y = "+ys.html()),
      S(_("הנקודה"),"","("+xs.html()+" , "+ys.html()+")")
    ],rule:"crit2",hint:_("נקודה קריטית היא המקום שבו שתי הנגזרות החלקיות מתאפסות יחד.")};
}

/* ---------- 6. כופלי לגראנז׳ ---------- */
function genLagrange(L){
  var a,b,c;
  if(L===1){
    c=ri(3,9);   /* c=2 היה נותן c² = 2c, ושני מסיחים זהים */
    /* max/min של x+y תחת x²+y²=c² → ±c√2 */
    var v=r2(c*Math.SQRT2);
    return {ask:_f("מהו הערך המרבי של x + y תחת האילוץ x² + y² = {0}?", num(c*c)),
      expr:"g(x,y) = x² + y² = "+num(c*c),
      ans:W(num(v)),
      wrong:[
        W(num(c),_("זהו רדיוס המעגל, ולא הערך המרבי של הסכום.")),
        W(num(2*c),_("זה היה נכון אילו הנקודה המרבית הייתה על הצירים. היא על האלכסון.")),
        W(num(c*c),_("זה ערך האילוץ עצמו, לא הפונקציה שממקסמים."))
      ],
      steps:[
        S(_("מציבים את התנאי של לגראנז׳"),_("הגרדיאנט של הפונקציה מקביל לגרדיאנט האילוץ."),
          "(1 , 1) = λ(2x , 2y)"),
        S(_("מסיקים סימטריה"),_("שתי המשוואות זהות, ולכן x שווה ל-y — זה כל מה שהתנאי אומר כאן."),"x = y"),
        S(_("מציבים באילוץ"),"","2x² = "+num(c*c)+" ⇒ x = "+frac(num(c),"√2")+"   ⇒   x + y = "+num(v))
      ],rule:"lagr",hint:_("∇f = λ∇g. הסימטריה של המשוואות היא בדרך כלל מה שפותר אותן.")};
  }
  if(L===2){
    a=pick([3,5,6]);   /* ערכים שבהם ארבעת הסכומים שונים זה מזה */
    /* מלבן בהיקף קבוע: שטח מרבי בריבוע */
    var per=4*a, side=a, area=a*a;
    return {ask:_f("למלבן היקף {0}. מהו השטח המרבי שלו?", num(per)),
      expr:"f(x,y) = xy   ,   g = 2x + 2y = "+num(per),
      ans:W(num(area)),
      wrong:[
        W(num(per*per/4),_("חילקתם את ההיקף בשתיים במקום בארבע. למלבן ארבע צלעות, לא שתיים.")),
        W(num(per),_("זה ההיקף עצמו, לא השטח.")),
        W(num(2*a*a),_("זה השטח אילו הצלעות היו a ו-2a. לגראנז׳ נותן כאן שוויון בין הצלעות."))
      ],
      steps:[
        S(_("תנאי לגראנז׳"),"","(y , x) = λ(2 , 2)"),
        S(_("מה זה אומר"),_("שתי המשוואות נותנות y = 2λ = x. הצלעות שוות, כלומר ריבוע."),"x = y"),
        S(_("מציבים באילוץ"),"","4x = "+num(per)+" ⇒ x = "+num(side)+"   ⇒   "+_("שטח")+" = "+num(area))
      ],rule:"lagr",hint:_("בהיקף נתון, השטח המרבי מתקבל תמיד בריבוע. לגראנז׳ מוכיח את זה בשתי שורות.")};
  }
  /* L3 — מרחק מנקודה לישר */
  var w0d,w1d,ltry=0;
  do{ a=ri(2,5);b=ri(2,5);c=ri(4,14);
      var dist=r2(c/Math.sqrt(a*a+b*b));
      w0d=r2(c/(a+b)); w1d=r2(c*c/(a*a+b*b));
  }while(ltry++<40&&(w0d===dist||w1d===dist||w0d===w1d||c===dist||c===w0d||c===w1d));
  return {ask:_("מהו המרחק המינימלי מהראשית אל הישר?"),
    expr:num(a)+"x + "+num(b)+"y = "+num(c),
    ans:W(num(dist)),
    wrong:[
      W(num(w0d),_("חיברתם את המקדמים במקום לקחת את שורש סכום הריבועים.")),
      W(num(w1d),_("שכחתם להוציא שורש. המרחק הוא c חלקי נורמת וקטור המקדמים.")),
      W(num(c),_("זה האגף הימני של הישר, לא מרחק."))
    ],
    steps:[
      S(_("ממזערים ריבוע מרחק"),_("ממזערים x²+y² ולא את השורש — אותה נקודה, חשבון פשוט בהרבה."),
        "f = x² + y²   ,   g = "+num(a)+"x + "+num(b)+"y = "+num(c)),
      S(_("תנאי לגראנז׳"),_("הנקודה הקרובה ביותר נמצאת על הישר שמאונך לישר הנתון ועובר בראשית."),
        "(2x , 2y) = λ("+num(a)+" , "+num(b)+")   ⇒   (x , y) ∥ ("+num(a)+" , "+num(b)+")"),
      S(_("מציבים ומקבלים את הנוסחה"),"","d = "+frac("|"+num(c)+"|","√("+num(a*a)+" + "+num(b*b)+")")+" = "+num(dist))
    ],rule:"lagr",hint:_("המרחק מהראשית לישר ax+by=c הוא c בערך מוחלט חלקי שורש a²+b².")};
}

/* ---------- 7. אינטגרל כפול ---------- */
function genDouble(L){
  var a,b,c;
  if(L===1){
    var dtry=0;
    do{ a=ri(1,4);b=ri(1,4);c=ri(1,5); }
    while(dtry++<40&&(new Set([a*b*c,a*b,a+b,c*(a+b)]).size<4));
    /* ∫∫ c dA על מלבן */
    return {ask:_("חשבו את האינטגרל הכפול"),
      expr:"∫<sub>0</sub><sup>"+num(a)+"</sup> ∫<sub>0</sub><sup>"+num(b)+"</sup> "+num(c)+" dy dx",
      ans:W(num(a*b*c)),
      wrong:[
        W(num(a*b),_("שכחתם את הקבוע. אינטגרל של קבוע הוא הקבוע כפול השטח.")),
        W(num(a+b),_("חיברתם את הגבולות. אינטגרל כפול על מלבן מכפיל אורך ברוחב.")),
        W(num(c*(a+b)),_("הכפלתם בסכום הצלעות במקום בשטח."))
      ],
      steps:[
        S(_("האינטגרל הפנימי"),_("גוזרים ומאנטגרלים לפי y, ו-x קבוע."),"∫<sub>0</sub><sup>"+num(b)+"</sup> "+num(c)+" dy = "+num(b*c)),
        S(_("האינטגרל החיצוני"),"","∫<sub>0</sub><sup>"+num(a)+"</sup> "+num(b*c)+" dx = "+num(a*b*c)),
        S(_("בדיקה גיאומטרית"),_("זה גובה קבוע כפול שטח הבסיס — נפח תיבה."),
          num(c)+" · "+num(a)+" · "+num(b)+" = "+num(a*b*c))
      ],rule:"dblint",hint:_("מחשבים קודם את האינטגרל הפנימי, והחיצוני רואה את התוצאה כפונקציה של x בלבד.")};
  }
  if(L===2){
    var v,d2try=0;
    do{ a=ri(1,3);b=ri(1,3); v=fr(a*a*b*b,4); }
    while(d2try++<40&&(new Set([v.html(),fr(a*a*b*b,2).html(),num(a*b),fr(a*a*b,4).html()]).size<4));
    /* ∫0^a ∫0^b xy dy dx = a²b²/4 */
    return {ask:_("חשבו את האינטגרל הכפול"),
      expr:"∫<sub>0</sub><sup>"+num(a)+"</sup> ∫<sub>0</sub><sup>"+num(b)+"</sup> xy dy dx",
      ans:W(v.html()),
      wrong:[
        W(fr(a*a*b*b,2).html(),_("חילקתם ב-2 פעם אחת בלבד. כל אינטגרציה של משתנה מוסיפה חלוקה ב-2.")),
        W(num(a*b),_("לא ביצעתם אינטגרציה — זו רק מכפלת הגבולות.")),
        W(fr(a*a*b,4).html(),_("איבדתם חזקה באחד המשתנים."))
      ],
      steps:[
        S(_("האינטגרל הפנימי"),_("x יוצא כקבוע החוצה."),
          "x·"+frac("y²","2")+" |<sub>0</sub><sup>"+num(b)+"</sup> = "+frac(num(b*b),"2")+"x"),
        S(_("האינטגרל החיצוני"),"",frac(num(b*b),"2")+"·"+frac("x²","2")+" |<sub>0</sub><sup>"+num(a)+"</sup>"),
        S(_("מפשטים"),"",v.html())
      ],rule:"dblint",hint:_("בכל אינטגרציה החזקה עולה באחת ומחלקים בה — פעמיים, אחת לכל משתנה.")};
  }
  /* L3 — קואורדינטות קוטביות */
  a=ri(2,4);   /* ברדיוס 1 היו π·1 ו-π·1² אותו דבר */
  return {ask:_f("חשבו את שטח העיגול ברדיוס {0} באמצעות אינטגרל כפול בקוטביות.", num(a)),
    expr:"∫<sub>0</sub><sup>2π</sup> ∫<sub>0</sub><sup>"+num(a)+"</sup> r dr dθ",
    ans:W("π·"+num(a*a)),
    wrong:[
      W("2π·"+num(a),_("שכחתם את ה-r שביעקוביאן. בלעדיו מקבלים היקף ולא שטח.")),
      W("π·"+num(a),_("לא העליתם את הרדיוס בריבוע. אינטגרל של r נותן r² חלקי 2.")),
      W("2π·"+num(a*a),_("שכחתם לחלק ב-2 באינטגרל הפנימי."))
    ],
    steps:[
      S(_("היעקוביאן"),_("במעבר לקוטביות dA אינו dr dθ אלא r dr dθ. ה-r הזה הוא הטעות הנפוצה ביותר כאן."),
        "dA = r dr dθ"),
      S(_("האינטגרל הפנימי"),"","∫<sub>0</sub><sup>"+num(a)+"</sup> r dr = "+frac(num(a*a),"2")),
      S(_("האינטגרל החיצוני"),"","∫<sub>0</sub><sup>2π</sup> "+frac(num(a*a),"2")+" dθ = π·"+num(a*a))
    ],rule:"polar",hint:_("במעבר לקוטביות אסור לשכוח את ה-r: dA = r dr dθ.")};
}

/* ============================================================
   מחוללי השאלות — אלגברה לינארית 2

/* ---------- 8. תלות לינארית ---------- */
function genVspace(L){
  var a,b,k;
  if(L===1){
    k=ri(2,5);a=rnz(-4,4);b=rnz(-4,4);
    while(a===0||b===0){a=rnz(-4,4);b=rnz(-4,4)}
    return {ask:_("האם שני הווקטורים תלויים לינארית?"),
      expr:"u = ("+num(a)+" , "+num(b)+")   ,   v = ("+num(k*a)+" , "+num(k*b)+")",
      ans:W(_("תלויים")),
      wrong:[
        W(_("בלתי תלויים"),_f("v הוא בדיוק {0} כפול u, ולכן הם על אותו ישר דרך הראשית.", num(k))),
        W(_("אי אפשר לקבוע"),_("לשני וקטורים ההכרעה תמידית: או שאחד כפולה של השני, או שלא.")),
        W(_("תלויים רק אם הם מאונכים"),_("ניצבות היא ההפך הגמור מתלות — וקטורים מאונכים אינם תלויים."))
      ],
      steps:[
        S(_("שני וקטורים בלבד"),_("כאן אין צורך בדירוג: מספיק לבדוק אם אחד הוא כפולה של השני."),""),
        S(_("מחפשים את המקדם"),"",num(k*a)+" ÷ "+num(a)+" = "+num(k)+"   ,   "+num(k*b)+" ÷ "+num(b)+" = "+num(k)),
        S(_("אותו מקדם בשני הרכיבים"),_("אילו היחסים היו שונים, הם היו בלתי תלויים."),"v = "+num(k)+"u")
      ],rule:"lindep",hint:_("שני וקטורים תלויים אם ורק אם אחד הוא כפולה בסקלר של השני.")};
  }
  if(L===2){
    return {ask:_("כמה וקטורים בלתי תלויים לינארית יכולים להיות ב-ℝ³ לכל היותר?"),
      expr:"ℝ³",
      ans:W("3"),
      wrong:[
        W("4",_("ארבעה וקטורים בממד 3 תלויים תמיד — אין מספיק כיוונים.")),
        W("2",_("שלושה כיוונים בלתי תלויים קיימים בהחלט: למשל צירי המרחב.")),
        W(_("אינסוף"),_("אפשר לבחור אינסוף וקטורים, אבל לא יותר משלושה מהם יהיו בלתי תלויים."))
      ],
      steps:[
        S(_("ממד קובע תקרה"),_("מספר האיברים בקבוצה בלתי תלויה לא יכול לעלות על ממד המרחב."),"dim ℝ³ = 3"),
        S(_("למה"),_("כל וקטור רביעי הוא כבר צירוף לינארי של השלושה, כי הם פורשים את כל המרחב."),""),
        S(_("מסקנה"),"",_("לכל היותר")+" 3")
      ],rule:"dim",hint:_("בממד n אפשר לכל היותר n וקטורים בלתי תלויים.")};
  }
  /* L3 — תלות של שלושה וקטורים דרך דטרמיננטה */
  a=ri(1,4);b=ri(1,4);
  var dep=pick([true,false]);
  var r3=dep?[a+b,a+b,a+b]:[a,b,a+b+1];
  var det=dep?0:1;
  return {ask:_("האם שלושת הווקטורים בלתי תלויים לינארית?"),
    expr:mat([[1,0,num(a)],[0,1,num(b)],[dep?1:0,dep?1:0,dep?num(a+b):1]]),
    ans:W(dep?_("תלויים"):_("בלתי תלויים")),
    wrong:[
      W(dep?_("בלתי תלויים"):_("תלויים"),
        _("הדטרמיננטה מכריעה: אפס פירושו תלות, ושונה מאפס פירושו אי־תלות.")),
      W(_("אי אפשר לקבוע"),_("למטריצה ריבועית הדטרמיננטה תמיד מכריעה את השאלה הזאת.")),
      W(_("תלויים רק בזוגות"),_("תלות לינארית היא תכונה של הקבוצה כולה, לא של זוגות."))
    ],
    steps:[
      S(_("כותבים כמטריצה"),_("כל וקטור שורה. השאלה היא אם הדירוג משאיר שורת אפסים."),""),
      S(_("מחשבים דטרמיננטה"),_("אפס פירושו ששורה אחת היא צירוף של האחרות."),"det = "+num(det)),
      S(_("מסקנה"),"",det===0?_("תלויים"):_("בלתי תלויים"))
    ],rule:"lindep",hint:_("דטרמיננטה אפס — תלויים. שונה מאפס — בלתי תלויים.")};
}

/* ---------- 9. בסיס, ממד ודרגה ---------- */
function genBasis(L){
  var n,r;
  if(L===1){
    n=ri(3,5);r=ri(1,n-1);
    if(n-r===r)r=(r===1?2:1);   /* אחרת "ממד הגרעין" ו"הדרגה" אותו מספר */
    return {ask:_f("למטריצה בגודל {0}×{0} יש דרגה {1}. מהו ממד מרחב האפס שלה?", num(n), num(r)),
      expr:"rank(A) = "+num(r)+"   ,   A "+_("בגודל")+" "+num(n)+"×"+num(n),
      ans:W(num(n-r)),
      wrong:[
        W(num(r),_("זו הדרגה עצמה — ממד התמונה, לא ממד הגרעין.")),
        W(num(n),_("זה ממד המרחב כולו. הגרעין הוא רק חלק ממנו.")),
        W(num(n+r),_("משפט הדרגה מחסר, לא מחבר: n = דרגה ועוד ממד הגרעין."))
      ],
      steps:[
        S(_("משפט הדרגה"),_("מספר העמודות מתחלק בין התמונה לגרעין, בלי שארית."),
          "rank + dim ker = n"),
        S(_("מציבים"),"",num(r)+" + dim ker = "+num(n)),
        S(_("פותרים"),"","dim ker = "+num(n-r))
      ],rule:"ranknull",hint:_("דרגה ועוד ממד הגרעין שווים למספר העמודות. תמיד.")};
  }
  if(L===2){
    n=ri(2,4);
    return {ask:_f("כמה וקטורים יש בבסיס של ℝ^{0}?", num(n)),
      expr:"ℝ<sup>"+num(n)+"</sup>",
      ans:W(num(n)),
      wrong:[
        W(num(n+1),_("קבוצה גדולה מהממד היא בהכרח תלויה, ולכן אינה בסיס.")),
        W(num(n-1),_("קבוצה קטנה מהממד אינה פורשת את כל המרחב, ולכן אינה בסיס.")),
        W(_("תלוי בבסיס שבוחרים"),_("בסיסים שונים בהחלט קיימים, אבל מספר האיברים בהם זהה תמיד — זו הגדרת הממד."))
      ],
      steps:[
        S(_("מהו בסיס"),_("קבוצה שגם בלתי תלויה וגם פורשת. שני התנאים יחד."),""),
        S(_("למה המספר קבוע"),_("כל שני בסיסים של אותו מרחב הם באותו גודל, וזה בדיוק מה שמגדיר ממד."),""),
        S(_("מסקנה"),"",num(n))
      ],rule:"dim",hint:_("מספר האיברים בכל בסיס של מרחב שווה לממד שלו.")};
  }
  /* L3 — דרגה של מטריצה עם שורה תלויה */
  var k=ri(2,4);
  return {ask:_("מהי דרגת המטריצה?"),
    expr:mat([[1,2],[num(k),num(2*k)]]),
    ans:W("1"),
    wrong:[
      W("2",_f("השורה השנייה היא בדיוק {0} כפול הראשונה, ולכן היא אינה מוסיפה כיוון חדש.", num(k))),
      W("0",_("דרגה אפס יש רק למטריצת האפס.")),
      W(_("אי אפשר לקבוע"),_("הדרגה מוגדרת היטב לכל מטריצה — מספר השורות הבלתי תלויות."))
    ],
    steps:[
      S(_("מדרגים"),_("מחסרים כפולה של השורה הראשונה מהשנייה."),
        _("שורה")+" 2 − "+num(k)+"·"+_("שורה")+" 1 = (0 , 0)"),
      S(_("סופרים שורות שאינן אפס"),_("הדרגה היא מספר השורות שנשארו אחרי הדירוג."),"1"),
      S(_("מה זה אומר"),_("שני וקטורי השורה על אותו ישר. התמונה היא ישר, לא מישור."),"rank = 1")
    ],rule:"rank",hint:_("דרגה = מספר השורות הבלתי תלויות אחרי דירוג.")};
}

/* ---------- 10. העתקות לינאריות ---------- */
function genTransform(L){
  var a,b;
  if(L===1){
    a=rnz(-4,4);b=rnz(-4,4);
    var x=rnz(-3,3),y=rnz(-3,3),ttry=0;
    /* x=y או ערך ראשון ששווה ל-x היו הופכים מסיח לתשובה */
    while(ttry++<40&&(x===y||a*x+b*y===x))
      {x=rnz(-3,3);y=rnz(-3,3)}
    return {ask:_f("חשבו את T({0} , {1})", num(x), num(y)),
      expr:"T(x , y) = ("+coef(a,"x")+term(b,"y")+" , x)",
      ans:W("("+num(a*x+b*y)+" , "+num(x)+")"),
      wrong:[
        W("("+num(a*x+b*y)+" , "+num(y)+")",_("הרכיב השני הוא x ולא y. קוראים את ההגדרה עד הסוף.")),
        W("("+num(x)+" , "+num(a*x+b*y)+")",_("החלפתם בין הרכיבים.")),
        W("("+num(a*x)+" , "+num(b*y)+")",_("חילקתם את הביטוי בין הרכיבים. הרכיב הראשון מכיל את שניהם."))
      ],
      steps:[
        S(_("מציבים ברכיב הראשון"),"",num(a)+"·"+pn(x)+sgn(b)+"·"+pn(y)+" = "+num(a*x+b*y)),
        S(_("הרכיב השני"),_("הוא פשוט x עצמו."),num(x)),
        S(_("התוצאה"),"","("+num(a*x+b*y)+" , "+num(x)+")")
      ],rule:"lintrans",hint:_("מציבים את הקואורדינטות בכל רכיב בנפרד, לפי ההגדרה.")};
  }
  if(L===2){
    return {ask:_("מהו הגרעין של ההעתקה?"),
      expr:"T(x , y) = (x + y , x + y)",
      ans:W(_("הישר y = −x")),
      wrong:[
        W(_("רק הראשית"),_("הגרעין הוא הראשית בלבד כאשר ההעתקה חד־חד־ערכית. כאן היא לא — שני רכיביה זהים.")),
        W(_("כל המישור"),_("כל המישור הוא הגרעין רק בהעתקת האפס.")),
        W(_("הישר y = x"),_("על הישר הזה הסכום הוא 2x ולא אפס. הגרעין הוא איפה שהסכום מתאפס."))
      ],
      steps:[
        S(_("מהו גרעין"),_("כל הווקטורים שההעתקה שולחת לאפס."),"T(v) = 0"),
        S(_("פותרים"),"","x + y = 0   ⇒   y = −x"),
        S(_("מה קיבלנו"),_("הגרעין הוא ישר, ולכן ממדו 1. משפט הדרגה נותן שממד התמונה גם הוא 1."),
          "dim ker = 1   ,   rank = 1")
      ],rule:"kernel",hint:_("הגרעין הוא פתרון המשוואה T(v) = 0.")};
  }
  /* L3 — מטריצה מייצגת של סיבוב */
  var deg=pick([90,180,270]);
  var M={90:[[0,-1],[1,0]],180:[[-1,0],[0,-1]],270:[[0,1],[-1,0]]}[deg];
  /* ב-180 הסיבוב ההפוך הוא אותה מטריצה, ולכן המסיח שם הוא סיבוב של 90 */
  var wrongM={90:[[0,1],[-1,0]],180:[[0,-1],[1,0]],270:[[0,-1],[1,0]]}[deg];
  var wrongWhy=deg===180
    ?_("זה סיבוב של 90 מעלות. ב-180 שני הצירים מתהפכים יחד.")
    :_("זה סיבוב בכיוון ההפוך. הסימן של הסינוס הוא שמבדיל ביניהם.");
  return {ask:_f("מהי המטריצה המייצגת סיבוב של {0} מעלות נגד כיוון השעון?", num(deg)),
    expr:"R<sub>"+num(deg)+"°</sub>",
    ans:W(mat(M.map(function(r){return r.map(num)}))),
    wrong:[
      W(mat(wrongM.map(function(r){return r.map(num)})),wrongWhy),
      W(mat([[1,0],[0,1]].map(function(r){return r.map(num)})),
        _("מטריצת היחידה אינה מסובבת כלום — היא סיבוב של אפס מעלות.")),
      W(mat([[1,0],[0,-1]].map(function(r){return r.map(num)})),
        _("זו שיקוף סביב ציר x, לא סיבוב."))
    ],
    steps:[
      S(_("הנוסחה הכללית"),_("עמודה ראשונה היא התמונה של (1,0), והשנייה של (0,1)."),
        "R = "+mat([["cos θ","−sin θ"],["sin θ","cos θ"]])),
      S(_("מציבים"),"","θ = "+num(deg)+"°"),
      S(_("התוצאה"),"",mat(M.map(function(r){return r.map(num)})))
    ],rule:"rot",hint:_("עמודות המטריצה הן התמונות של וקטורי הבסיס.")};
}

/* ---------- 11. לכסון ---------- */
function genDiag(L){
  var a,b;
  if(L===1){
    a=rnz(-5,5);b=rnz(-5,5);
    while(b===a)b=rnz(-5,5);
    return {ask:_("האם המטריצה לכסינה?"),
      expr:mat([[num(a),"1"],["0",num(b)]]),
      ans:W(_("לכסינה")),
      wrong:[
        W(_("אינה לכסינה"),_f("שני ערכים עצמיים שונים, {0} ו-{1}, מבטיחים לכסינות תמיד.", num(a), num(b))),
        W(_("אי אפשר לקבוע"),_("לערכים עצמיים שונים זה לזה יש הכרעה מיידית.")),
        W(_("לכסינה רק אם היא סימטרית"),_("סימטריות מבטיחה לכסינות, אבל היא אינה תנאי הכרחי."))
      ],
      steps:[
        S(_("קוראים ערכים עצמיים"),_("המטריצה משולשת, ולכן הערכים העצמיים יושבים על האלכסון."),
          "λ₁ = "+num(a)+"   ,   λ₂ = "+num(b)),
        S(_("בודקים ריבוי"),_("n ערכים עצמיים שונים בגודל n×n מבטיחים n וקטורים עצמיים בלתי תלויים."),""),
        S(_("מסקנה"),"",_("לכסינה"))
      ],rule:"diag",hint:_("ערכים עצמיים שונים זה מזה מבטיחים לכסינות.")};
  }
  if(L===2){
    a=rnz(-4,4);
    return {ask:_("האם המטריצה לכסינה?"),
      expr:mat([[num(a),"1"],["0",num(a)]]),
      ans:W(_("אינה לכסינה")),
      wrong:[
        W(_("לכסינה"),_f("λ = {0} מופיע פעמיים, אבל יש לו רק וקטור עצמי אחד. חסר וקטור לבסיס.", num(a))),
        W(_("לכסינה מעל המרוכבים"),_("המרוכבים עוזרים כשאין שורשים ממשיים. כאן השורש ממשי, והבעיה היא ריבוי.")),
        W(_("אי אפשר לקבוע"),_("אפשר וצריך: סופרים ממד של מרחב עצמי."))
      ],
      steps:[
        S(_("ערך עצמי כפול"),_("משוואה אופיינית עם שורש כפול. הריבוי האלגברי הוא 2."),
          "(λ − "+num(a)+")² = 0"),
        S(_("כמה וקטורים עצמיים"),_("פותרים (A − λI)v = 0 ומקבלים מרחב ממד 1 בלבד. הריבוי הגיאומטרי הוא 1."),
          "dim ker(A − "+num(a)+"I) = 1"),
        S(_("התנאי ללכסינות"),_("ריבוי גיאומטרי חייב להיות שווה לאלגברי לכל ערך עצמי. כאן 1 ≠ 2."),
          _("אינה לכסינה"))
      ],rule:"diag",hint:_("לכסינה אם ורק אם לכל ערך עצמי הריבוי הגיאומטרי שווה לאלגברי.")};
  }
  /* L3 — חישוב חזקה בעזרת לכסון */
  a=pick([2,3]);var n=pick([3,4,5]);
  return {ask:_f("נתונה מטריצה אלכסונית D. מהי D בחזקת {0}?", num(n)),
    expr:mat([[num(a),"0"],["0","1"]]),
    ans:W(mat([[num(Math.pow(a,n)),"0"],["0","1"]])),
    wrong:[
      W(mat([[num(a*n),"0"],["0",num(n)]]),_("הכפלתם באקספוננט במקום להעלות בחזקה.")),
      W(mat([[num(Math.pow(a,n)),"0"],["0",num(n)]]),_("1 בכל חזקה נשאר 1.")),
      W(mat([[num(a),"0"],["0","1"]]),_("לא ביצעתם את ההעלאה בחזקה בכלל."))
    ],
    steps:[
      S(_("חזקה של אלכסונית"),_("זו כל התועלת של לכסון: חזקה הופכת מחישוב כבד לחישוב על האלכסון בלבד."),
        "D<sup>n</sup> = diag(d₁ⁿ , d₂ⁿ)"),
      S(_("מציבים"),"",num(a)+"<sup>"+num(n)+"</sup> = "+num(Math.pow(a,n))+"   ,   1<sup>"+num(n)+"</sup> = 1"),
      S(_("ולמטריצה כללית"),_("אם A = PDP⁻¹ אז A בחזקת n הוא P כפול D בחזקת n כפול P הפוכה. האמצע קורס."),
        "A<sup>n</sup> = P D<sup>n</sup> P<sup>−1</sup>")
    ],rule:"diagpow",hint:_("חזקה של מטריצה אלכסונית היא חזקה של כל איבר על האלכסון בנפרד.")};
}

/* ---------- 12. אורתוגונליות וגרם־שמידט ---------- */
function genOrtho(L){
  var a,b;
  if(L===1){
    a=ri(1,5);b=ri(1,5);
    return {ask:_("האם הווקטורים אורתוגונליים?"),
      expr:"u = ("+num(a)+" , "+num(b)+")   ,   v = ("+num(-b)+" , "+num(a)+")",
      ans:W(_("כן")),
      wrong:[
        W(_("לא"),_("המכפלה הסקלרית מתאפסת בדיוק, ולכן הם מאונכים.")),
        W(_("רק אם הם באורך 1"),_("אורך 1 הופך אותם לאורתונורמליים. אורתוגונליות דורשת רק מכפלה סקלרית אפס.")),
        W(_("אי אפשר לקבוע"),_("מכפלה סקלרית היא חישוב אחד וקצר, והיא מכריעה."))
      ],
      steps:[
        S(_("מחשבים מכפלה סקלרית"),"",num(a)+"·"+pn(-b)+" + "+num(b)+"·"+pn(a)+" = "+num(-a*b+a*b)),
        S(_("אפס"),_("מכפלה סקלרית אפס פירושה זווית של 90 מעלות."),""),
        S(_("הכלל הכללי"),_("במישור, (−b , a) מאונך ל-(a , b) תמיד. זו בדיוק סיבוב של 90 מעלות."),"")
      ],rule:"orth",hint:_("מכפלה סקלרית אפס = מאונכים. במישור מחליפים רכיבים והופכים סימן לאחד.")};
  }
  if(L===2){
    a=ri(2,5);
    return {ask:_("נרמלו את הווקטור"),
      expr:"v = ("+num(3*a)+" , "+num(4*a)+")",
      ans:W("("+frac("3","5")+" , "+frac("4","5")+")"),
      wrong:[
        W("("+num(3*a)+" , "+num(4*a)+")",_("לא נרמלתם בכלל. נרמול פירושו חלוקה באורך.")),
        W("("+frac(num(3*a),num(5*a*5*a))+" , "+frac(num(4*a),num(5*a*5*a))+")",
          _("חילקתם בריבוע האורך. מחלקים באורך עצמו.")),
        W("("+frac("4","5")+" , "+frac("3","5")+")",_("החלפתם בין הרכיבים."))
      ],
      steps:[
        S(_("מחשבים אורך"),"","|v| = √("+num(9*a*a)+" + "+num(16*a*a)+") = "+num(5*a)),
        S(_("מחלקים כל רכיב"),"","("+num(3*a)+"/"+num(5*a)+" , "+num(4*a)+"/"+num(5*a)+")"),
        S(_("מצמצמים"),_("הסקלר a מצטמצם — לכיוון אין תלות באורך המקורי."),
          "("+frac("3","5")+" , "+frac("4","5")+")")
      ],rule:"norm2",hint:_("נרמול = חלוקה באורך. הכיוון נשמר, האורך הופך ל-1.")};
  }
  /* L3 — צעד ראשון של גרם־שמידט */
  a=ri(1,4);b=ri(1,4);
  var v2x=ri(1,5),v2y=ri(1,5);
  var dot=a*v2x+b*v2y, nn=a*a+b*b;
  return {ask:_("בצעו את הצעד הראשון של גרם־שמידט: הוציאו מ-v את הרכיב שבכיוון u."),
    expr:"u = ("+num(a)+" , "+num(b)+")   ,   v = ("+num(v2x)+" , "+num(v2y)+")",
    ans:W("v − "+frac(num(dot),num(nn))+"u"),
    wrong:[
      W("v − "+frac(num(dot),num(Math.round(Math.sqrt(nn)*100)/100))+"u",
        _("חילקתם באורך במקום בריבוע האורך. ההיטל מחלק ב-u·u.")),
      W("v + "+frac(num(dot),num(nn))+"u",_("מחסרים את ההיטל, לא מוסיפים אותו.")),
      W(frac(num(dot),num(nn))+"u",_("זה ההיטל עצמו. גרם־שמידט מחסר אותו מ-v כדי לקבל את מה שמאונך."))
    ],
    steps:[
      S(_("נוסחת ההיטל"),_("ההיטל של v על u הוא מכפלה סקלרית חלקי ריבוע האורך, כפול u."),
        "proj = "+frac("v·u","u·u")+"u"),
      S(_("מציבים"),"","v·u = "+num(dot)+"   ,   u·u = "+num(nn)),
      S(_("מחסרים"),_("מה שנשאר מאונך ל-u בהגדרה. זה כל גרם־שמידט."),
        "w = v − "+frac(num(dot),num(nn))+"u")
    ],rule:"gs",hint:_("ההיטל מחלק בריבוע האורך, לא באורך. ואז מחסרים.")};
}

/* ============================================================
   מחוללי השאלות — משוואות דיפרנציאליות
   ============================================================ */

/* ---------- 13. משוואות פרידות ---------- */
function genSep(L){
  var a,b,c;
  if(L===1){
    a=pick([-4,-3,-2,2,3,4]);   /* |a|=1 היה מוחק את המקדם מהמעריך ומזהה מסיח לתשובה */
    return {ask:_("פתרו את המשוואה הדיפרנציאלית"),
      expr:"y′ = "+coef(a,"y"),
      ans:W("y = C·e<sup>"+coef(a,"x")+"</sup>"),
      wrong:[
        W("y = C·e<sup>x</sup>",_f("איבדתם את המקדם {0}. הוא נשאר במעריך.", num(a))),
        W("y = "+coef(a,"x")+" + C",_("זה היה נכון אילו y′ היה שווה למספר קבוע. כאן הוא פרופורציוני ל-y עצמו.")),
        W("y = C·"+num(a)+"<sup>x</sup>",_("הבסיס הוא e, והמקדם יושב במעריך."))
      ],
      steps:[
        S(_("מפרידים משתנים"),_("כל y בצד אחד, כל x בצד השני."),frac("dy","y")+" = "+num(a)+" dx"),
        S(_("מאנטגרלים"),"","ln|y| = "+coef(a,"x")+" + C"),
        S(_("מעריכים"),_("הקבוע שהיה חיבורי הופך לכפלי — וזה ה-C שבתשובה."),"y = C·e<sup>"+coef(a,"x")+"</sup>")
      ],rule:"sep",hint:_("y′ = ky פירושו צמיחה מעריכית: y = Ce בחזקת kx.")};
  }
  if(L===2){
    a=pick([-4,-3,-2,2,3,4]);b=ri(2,5);
    while(b===a)b=ri(2,5);   /* a=b היה הופך את "החלפתם מקדם ותנאי" לתשובה */
    return {ask:_f("פתרו עם תנאי ההתחלה y(0) = {0}", num(b)),
      expr:"y′ = "+coef(a,"y")+"   ,   y(0) = "+num(b),
      ans:W("y = "+num(b)+"e<sup>"+coef(a,"x")+"</sup>"),
      wrong:[
        W("y = e<sup>"+coef(a,"x")+"</sup>"+sgn(b),_("הקבוע כאן כפלי ולא חיבורי — הוא יצא מהאקספוננט של ה-C.")),
        W("y = "+num(a)+"e<sup>"+coef(b,"x")+"</sup>",_("החלפתם בין המקדם לתנאי ההתחלה.")),
        W("y = "+num(b)+"e<sup>x</sup>",_f("איבדתם את {0} מהמעריך.", num(a)))
      ],
      steps:[
        S(_("הפתרון הכללי"),"","y = C·e<sup>"+coef(a,"x")+"</sup>"),
        S(_("מציבים את התנאי"),_("באפס האקספוננט שווה 1, ולכן C הוא בדיוק הערך ההתחלתי."),
          num(b)+" = C·e<sup>0</sup> = C"),
        S(_("הפתרון הפרטי"),"","y = "+num(b)+"e<sup>"+coef(a,"x")+"</sup>")
      ],rule:"sep",hint:_("מוצאים פתרון כללי, ורק אז מציבים את תנאי ההתחלה כדי למצוא את C.")};
  }
  /* L3 — y' = k y (a − y)? נשמור פשוט: y' = x/y */
  return {ask:_("פתרו את המשוואה הדיפרנציאלית"),
    expr:"y′ = "+frac("x","y"),
    ans:W("y² − x² = C"),
    wrong:[
      W("y = "+frac("x²","2")+" + C",_("לא הפרדתם — y נשאר בצד ימין ואי אפשר לאנטגרל ככה.")),
      W("y² + x² = C",_("טעות סימן. אחרי ההעברה מקבלים הפרש ריבועים ולא סכום.")),
      W("y = x + C",_("זה פתרון של y′ = 1, לא של המשוואה הזאת."))
    ],
    steps:[
      S(_("מפרידים"),_("מכפילים ב-y ומעבירים dx."),"y dy = x dx"),
      S(_("מאנטגרלים שני צדדים"),"",frac("y²","2")+" = "+frac("x²","2")+" + C"),
      S(_("מכפילים ומסדרים"),_("הקבוע נשאר קבוע גם אחרי הכפלה ב-2."),"y² − x² = C")
    ],rule:"sep",hint:_("מכניסים כל y עם dy וכל x עם dx, ואז מאנטגרלים כל צד בנפרד.")};
}

/* ---------- 14. לינארית מסדר ראשון ---------- */
function genLinear1(L){
  var a,b;
  if(L===1){
    a=pick([-4,-3,-2,2,3,4]);
    return {ask:_("מהו גורם האינטגרציה של המשוואה?"),
      expr:"y′"+term(a,"y")+" = f(x)",
      ans:W("μ = e<sup>"+coef(a,"x")+"</sup>"),
      wrong:[
        W("μ = e<sup>"+coef(-a,"x")+"</sup>",_("טעות סימן. גורם האינטגרציה הוא e בחזקת האינטגרל של המקדם כפי שהוא.")),
        W("μ = "+coef(a,"x"),_("שכחתם את האקספוננט. גורם האינטגרציה הוא תמיד e בחזקת משהו.")),
        W("μ = e<sup>x</sup>",_f("איבדתם את המקדם {0}.", num(a)))
      ],
      steps:[
        S(_("הצורה הסטנדרטית"),_("y′ ועוד p(x)·y שווה f(x). כאן p הוא קבוע."),"p(x) = "+num(a)),
        S(_("גורם האינטגרציה"),_("הוא e בחזקת האינטגרל של p."),"μ = e<sup>∫"+num(a)+"dx</sup> = e<sup>"+coef(a,"x")+"</sup>"),
        S(_("למה זה עובד"),_("אחרי ההכפלה בו, האגף השמאלי הופך לנגזרת של מכפלה אחת — וזה כל הרעיון."),
          "(μy)′ = μf")
      ],rule:"intfac",hint:_("גורם האינטגרציה הוא e בחזקת האינטגרל של המקדם של y.")};
  }
  if(L===2){
    a=pick([-3,-2,2,3]);b=rnz(-6,6);   /* |a|=1 היה משאיר b/a = b, ומסיח שווה לתשובה */
    /* y' + a y = b  → y = b/a + C e^{-a x} */
    var st=fr(b,a);
    return {ask:_("מהו הפתרון הכללי?"),
      expr:"y′"+term(a,"y")+" = "+num(b),
      ans:W("y = "+st.html()+" + C·e<sup>"+coef(-a,"x")+"</sup>"),
      wrong:[
        W("y = "+st.html()+" + C·e<sup>"+coef(a,"x")+"</sup>",
          _("טעות סימן במעריך. הפתרון ההומוגני הוא e בחזקת מינוס המקדם.")),
        W("y = "+num(b)+" + C·e<sup>"+coef(-a,"x")+"</sup>",_("שכחתם לחלק במקדם כדי לקבל את הפתרון הקבוע.")),
        W("y = C·e<sup>"+coef(-a,"x")+"</sup>",_("זה הפתרון ההומוגני בלבד. חסר הפתרון הפרטי."))
      ],
      steps:[
        S(_("פתרון פרטי קבוע"),_("מנסים y קבוע: אז y′ אפס, ונשאר a·y = b."),"y<sub>p</sub> = "+st.html()),
        S(_("פתרון הומוגני"),_("פותרים y′ ועוד a·y שווה אפס."),"y<sub>h</sub> = C·e<sup>"+coef(-a,"x")+"</sup>"),
        S(_("סוכמים"),_("במשוואה לינארית הפתרון הכללי הוא תמיד פרטי ועוד הומוגני."),
          "y = "+st.html()+" + C·e<sup>"+coef(-a,"x")+"</sup>")
      ],rule:"lin1",hint:_("פתרון כללי = פתרון פרטי ועוד פתרון הומוגני.")};
  }
  a=ri(2,5);
  return {ask:_("איזו משוואה היא לינארית מסדר ראשון?"),
    expr:"?",
    ans:W("y′ + "+num(a)+"y = x²"),
    wrong:[
      W("y′ + "+num(a)+"y² = x",_("y בריבוע הופך אותה ללא לינארית.")),
      W("y·y′ = x",_("מכפלה של y ב-y′ אינה לינארית.")),
      W("y″ + y = 0",_("זו לינארית, אבל מסדר שני ולא ראשון."))
    ],
    steps:[
      S(_("מה זו לינאריות"),_("y והנגזרות שלו מופיעים בחזקה ראשונה בלבד, ולא מוכפלים זה בזה."),""),
      S(_("מה מותר"),_("המקדמים והאגף הימני יכולים להיות כל פונקציה של x. זה לא פוגע בלינאריות."),""),
      S(_("הצורה"),"","y′ + p(x)y = f(x)")
    ],rule:"lin1",hint:_("לינארית פירושה ש-y ונגזרותיו בחזקה ראשונה ולא מוכפלים זה בזה.")};
}

/* ---------- 15. מסדר שני עם מקדמים קבועים ---------- */
function genOde2(L){
  var r1,r2v,b,c;
  if(L===1){
    r1=rnz(-4,4);r2v=rnz(-4,4);
    while(r2v===r1)r2v=rnz(-4,4);
    b=-(r1+r2v);c=r1*r2v;
    return {ask:_("מהו הפתרון הכללי?"),
      expr:"y″"+term(b,"y′")+term(c,"y")+" = 0",
      ans:W("y = C₁e<sup>"+coef(r1,"x")+"</sup> + C₂e<sup>"+coef(r2v,"x")+"</sup>"),
      wrong:[
        W("y = C₁e<sup>"+coef(-r1,"x")+"</sup> + C₂e<sup>"+coef(-r2v,"x")+"</sup>",
          _("טעות סימן בשורשים. השורשים עצמם נכנסים למעריך, בלי היפוך.")),
        W("y = C₁e<sup>"+coef(r1,"x")+"</sup>",_("חסר הפתרון השני. משוואה מסדר שני דורשת שני קבועים.")),
        W("y = C₁x + C₂",_("זה פתרון של y″ = 0 בלבד."))
      ],
      steps:[
        S(_("המשוואה האופיינית"),_("מחליפים y″ ב-r², y′ ב-r ו-y ב-1."),
          "r²"+term(b,"r")+sgn(c)+" = 0"),
        S(_("פותרים"),_("שני שורשים ממשיים שונים."),"r₁ = "+num(r1)+"   ,   r₂ = "+num(r2v)),
        S(_("הפתרון"),_("כל שורש נותן אקספוננט משלו, וכל אחד עם קבוע משלו."),
          "y = C₁e<sup>"+coef(r1,"x")+"</sup> + C₂e<sup>"+coef(r2v,"x")+"</sup>")
      ],rule:"ode2",hint:_("כותבים משוואה אופיינית, פותרים, וכל שורש נותן אקספוננט.")};
  }
  if(L===2){
    r1=rnz(-4,4);
    b=-2*r1;c=r1*r1;
    return {ask:_("מהו הפתרון הכללי?"),
      expr:"y″"+term(b,"y′")+" + "+num(c)+"y = 0",
      ans:W("y = (C₁ + C₂x)e<sup>"+coef(r1,"x")+"</sup>"),
      wrong:[
        W("y = C₁e<sup>"+coef(r1,"x")+"</sup> + C₂e<sup>"+coef(r1,"x")+"</sup>",
          _("שני איברים זהים מצטמצמים לאחד, ואז חסר פתרון שני. לכן מכפילים אחד מהם ב-x.")),
        W("y = C₁e<sup>"+coef(r1,"x")+"</sup>",_("שורש כפול עדיין דורש שני פתרונות בלתי תלויים.")),
        W("y = (C₁ + C₂x)e<sup>"+coef(-r1,"x")+"</sup>",_("טעות סימן בשורש."))
      ],
      steps:[
        S(_("המשוואה האופיינית"),"","(r "+(r1<0?"+":"−")+" "+num(Math.abs(r1))+")² = 0"),
        S(_("שורש כפול"),_("שורש אחד בלבד, ולכן פתרון אחד — וזה לא מספיק."),"r = "+num(r1)),
        S(_("הפתרון השני"),_("מכפילים ב-x. זה תמיד הפתרון השני בשורש כפול."),
          "y = (C₁ + C₂x)e<sup>"+coef(r1,"x")+"</sup>")
      ],rule:"ode2",hint:_("שורש כפול נותן e ועוד x כפול e — הכפלה ב-x היא מה שמייצר את הפתרון השני.")};
  }
  /* L3 — שורשים מרוכבים */
  var al=pick([-3,-2,2,3]),be=ri(1,4);
  while(be===Math.abs(al))be=ri(1,4);   /* אחרת "החלפתם ממשי ומדומה" הוא התשובה עצמה */
  b=-2*al;c=al*al+be*be;
  return {ask:_("מהו הפתרון הכללי?"),
    expr:"y″"+term(b,"y′")+" + "+num(c)+"y = 0",
    ans:W("y = e<sup>"+coef(al,"x")+"</sup>(C₁cos "+coef(be,"x")+" + C₂sin "+coef(be,"x")+")"),
    wrong:[
      W("y = C₁cos "+coef(be,"x")+" + C₂sin "+coef(be,"x"),
        _f("איבדתם את המעטפת e בחזקת {0}x. היא באה מהחלק הממשי של השורש.", num(al))),
      W("y = e<sup>"+coef(al,"x")+"</sup>(C₁cos "+coef(al,"x")+" + C₂sin "+coef(al,"x")+")",
        _("החלפתם בין החלק הממשי למדומה. הממשי הולך למעטפת, המדומה לתדר.")),
      W("y = C₁e<sup>"+coef(al,"x")+"</sup> + C₂e<sup>"+coef(-al,"x")+"</sup>",
        _("זה המקרה של שני שורשים ממשיים. כאן הדיסקרימיננטה שלילית."))
    ],
    steps:[
      S(_("המשוואה האופיינית"),"","r²"+term(b,"r")+" + "+num(c)+" = 0"),
      S(_("דיסקרימיננטה שלילית"),_("אין שורשים ממשיים, והשורשים מרוכבים וצמודים."),
        "r = "+num(al)+" ± "+num(be)+"i"),
      S(_("מתרגמים לצורה ממשית"),_("החלק הממשי נעשה מעטפת אקספוננציאלית, והמדומה נעשה תדר של סינוס וקוסינוס."),
        "y = e<sup>"+coef(al,"x")+"</sup>(C₁cos "+coef(be,"x")+" + C₂sin "+coef(be,"x")+")")
    ],rule:"ode2c",hint:_("שורש α ± βi נותן e בחזקת αx כפול קוסינוס וסינוס של βx.")};
}

   מחוללי השאלות — הסתברות וסטטיסטיקה

/* ---------- 16. משתנים רציפים ---------- */
function genCont(L){
  var a,b,c;
  if(L===1){
    a=ri(2,6);
    /* צפיפות אחידה על [0,a] */
    return {ask:_f("X מתפלגת אחיד על הקטע [0 , {0}]. מהי פונקציית הצפיפות?", num(a)),
      expr:"X ~ U(0 , "+num(a)+")",
      ans:W("f(x) = "+frac("1",num(a))+"   ,   0 ≤ x ≤ "+num(a)),
      wrong:[
        W("f(x) = "+num(a),_("הצפיפות היא ההופכי של אורך הקטע, כדי שהשטח מתחתיה יהיה 1.")),
        W("f(x) = "+frac("x",num(a)),_("זו פונקציית ההצטברות, לא הצפיפות.")),
        W("f(x) = "+frac("1",num(a*a)),_("חילקתם בריבוע. השטח הוא בסיס כפול גובה, לא בסיס בריבוע."))
      ],
      steps:[
        S(_("התנאי על כל צפיפות"),_("השטח מתחת לגרף חייב להיות בדיוק 1."),"∫ f = 1"),
        S(_("מלבן"),_("צפיפות אחידה היא גובה קבוע על קטע. שטח מלבן הוא בסיס כפול גובה."),
          num(a)+" · h = 1"),
        S(_("מבודדים"),"","h = "+frac("1",num(a)))
      ],rule:"pdf",hint:_("השטח מתחת לפונקציית צפיפות שווה תמיד ל-1.")};
  }
  if(L===2){
    /* b חייב להשאיר את b/a, (a−b)/a ו-1/a שונים זה מזה */
    var utry=0;
    do{ a=pick([5,6,7]); b=ri(2,a-2); }
    while(utry++<40&&(a===2*b||a-b===1||b===1));
    return {ask:_f("X ~ U(0 , {0}). מהי ההסתברות ש-X קטן מ-{1}?", num(a), num(b)),
      expr:"P(X < "+num(b)+")",
      ans:W(fr(b,a).html()),
      wrong:[
        W(fr(a,b).html(),_("הפכתם את השבר. ההסתברות היא חלק מתוך שלם, ולכן קטנה מ-1.")),
        W(fr(a-b,a).html(),_("זו ההסתברות המשלימה — ש-X גדול מהערך.")),
        W(fr(1,a).html(),_("זו הצפיפות בנקודה, לא ההסתברות בקטע."))
      ],
      steps:[
        S(_("בהתפלגות רציפה הסתברות היא שטח"),_("לא סוכמים ערכים — מחשבים שטח מתחת לצפיפות."),""),
        S(_("שטח המלבן"),"",num(b)+" · "+frac("1",num(a))),
        S(_("התוצאה"),_("באחידה ההסתברות היא פשוט יחס האורכים."),fr(b,a).html())
      ],rule:"pdf",hint:_("בהתפלגות רציפה ההסתברות היא שטח, ובאחידה זה יחס אורכים.")};
  }
  a=ri(2,5);
  return {ask:_f("X מעריכית עם פרמטר λ = {0}. מהי התוחלת שלה?", num(a)),
    expr:"f(x) = "+num(a)+"e<sup>−"+num(a)+"x</sup>   ,   x ≥ 0",
    ans:W(fr(1,a).html()),
    wrong:[
      W(num(a),_("זהו הפרמטר עצמו. התוחלת היא ההופכי שלו.")),
      W(fr(1,a*a).html(),_("זו השונות, לא התוחלת.")),
      W(num(a*a),_("זה הפרמטר בריבוע, ואין לו משמעות כאן."))
    ],
    steps:[
      S(_("נוסחת התוחלת"),_("אינטגרל של x כפול הצפיפות, על כל התחום."),"E(X) = ∫₀<sup>∞</sup> x·λe<sup>−λx</sup> dx"),
      S(_("התוצאה הידועה"),_("אינטגרציה בחלקים נותנת 1 חלקי למדה."),"E(X) = "+frac("1","λ")),
      S(_("והשונות"),_("שווה ל-1 חלקי למדה בריבוע. סטיית התקן שווה לתוחלת — תכונה מיוחדת של המעריכית."),
        "V(X) = "+frac("1","λ²"))
    ],rule:"expdist",hint:_("במעריכית התוחלת היא 1 חלקי למדה, והשונות 1 חלקי למדה בריבוע.")};
}

/* ---------- 17. שונות משותפת ומתאם ---------- */
function genCov(L){
  var a,b,c;
  if(L===1){
    var ctry=0;
    do{ a=ri(2,8);b=ri(2,8);c=ri(1,Math.min(a,b)); }
    while(ctry++<40&&(new Set([c,a*b+c,a*b,a+b]).size<4));
    return {ask:_f("נתון E(XY) = {0} , E(X) = {1} , E(Y) = {2}. מהי השונות המשותפת?", num(a*b+c), num(a), num(b)),
      expr:"Cov(X , Y) = ?",
      ans:W(num(c)),
      wrong:[
        W(num(a*b+c),_("זה E(XY) עצמו. צריך לחסר ממנו את מכפלת התוחלות.")),
        W(num(a*b),_("זו מכפלת התוחלות. היא מה שמחסרים, לא התוצאה.")),
        W(num(a+b),_("סכום התוחלות אינו מופיע בנוסחה בכלל."))
      ],
      steps:[
        S(_("הנוסחה"),_("תוחלת המכפלה פחות מכפלת התוחלות."),"Cov = E(XY) − E(X)E(Y)"),
        S(_("מציבים"),"",num(a*b+c)+" − "+num(a)+"·"+num(b)),
        S(_("מחשבים"),"",num(a*b+c)+" − "+num(a*b)+" = "+num(c))
      ],rule:"cov",hint:_("Cov = E(XY) פחות E(X)·E(Y).")};
  }
  if(L===2){
    var c2try=0;
    do{ a=ri(2,5);b=ri(2,5); }
    while(c2try++<40&&(new Set([1,a*b,r2(a*b/(a*a*b*b)),r2(a*b/(a+b))]).size<4));
    var cv=a*b;
    return {ask:_f("נתון Cov(X,Y) = {0} , σ_X = {1} , σ_Y = {2}. מהו מקדם המתאם?", num(cv), num(a), num(b)),
      expr:"ρ = ?",
      ans:W("1"),
      wrong:[
        W(num(cv),_("זו השונות המשותפת. מקדם המתאם הוא היא מחולקת במכפלת סטיות התקן.")),
        W(num(r2(cv/(a*a*b*b))),_("חילקתם בריבועי סטיות התקן, כלומר בשונויות.")),
        W(num(r2(cv/(a+b))),_("מחלקים במכפלה ולא בסכום."))
      ],
      steps:[
        S(_("הנוסחה"),_("השונות המשותפת מנורמלת על ידי סטיות התקן."),"ρ = "+frac("Cov","σ<sub>X</sub>σ<sub>Y</sub>")),
        S(_("מציבים"),"",frac(num(cv),num(a)+"·"+num(b))),
        S(_("מה זה אומר"),_("מתאם 1 פירושו תלות לינארית מושלמת. מקדם המתאם תמיד בין מינוס 1 ל-1."),"ρ = 1")
      ],rule:"corr",hint:_("מקדם המתאם הוא השונות המשותפת חלקי מכפלת סטיות התקן, והוא תמיד בין −1 ל-1.")};
  }
  var c3try=0;
  do{ a=ri(2,6);b=ri(2,6); }
  while(c3try++<40&&(new Set([a+b,a*b,Math.abs(a-b),r2(Math.sqrt(a*a+b*b))]).size<4));
  return {ask:_f("X ו-Y בלתי תלויים, V(X) = {0} ו-V(Y) = {1}. מהי V(X + Y)?", num(a), num(b)),
    expr:"V(X + Y) = ?",
    ans:W(num(a+b)),
    wrong:[
      W(num(a*b),_("שונויות מתחברות, לא מוכפלות.")),
      W(num(Math.abs(a-b)),_("חיסור מתאים ל... כלום. גם ב-X פחות Y השונויות מתחברות.")),
      W(num(r2(Math.sqrt(a*a+b*b))),_("זו נוסחה לסטיות תקן בריבוע, ואינה נכונה. השונויות עצמן מתחברות."))
    ],
    steps:[
      S(_("הנוסחה הכללית"),_("יש גם איבר של שונות משותפת."),"V(X+Y) = V(X) + V(Y) + 2Cov(X,Y)"),
      S(_("אי־תלות"),_("כשהמשתנים בלתי תלויים השונות המשותפת מתאפסת."),"Cov = 0"),
      S(_("מחברים"),_("שימו לב: גם ב-X פחות Y התוצאה היא סכום השונויות, כי המקדם עולה בריבוע."),
        num(a)+" + "+num(b)+" = "+num(a+b))
    ],rule:"varsum",hint:_("בבלתי תלויים השונויות מתחברות — גם בחיסור.")};
}

/* ---------- 18. משפט הגבול המרכזי ורווח סמך ---------- */
function genCLT(L){
  var mu,sd,n;
  if(L===1){
    mu=ri(10,60);sd=pick([2,4,5,10]);n=pick([25,100,400]);
    var se=r2(sd/Math.sqrt(n));
    return {ask:_f("מדגם בגודל {0} מאוכלוסייה עם סטיית תקן {1}. מהי סטיית התקן של הממוצע?", num(n), num(sd)),
      expr:"σ<sub>x̄</sub> = ?",
      ans:W(num(se)),
      wrong:[
        W(num(sd),_("זו סטיית התקן של פרט בודד. הממוצע מפוזר פחות ממנו.")),
        W(num(r2(sd/n)),_("מחלקים בשורש n ולא ב-n עצמו.")),
        W(num(r2(sd*Math.sqrt(n))),_("מחלקים בשורש n, לא מכפילים בו. מדגם גדול מקטין פיזור."))
      ],
      steps:[
        S(_("שגיאת התקן"),_("סטיית התקן של הממוצע קטנה משל הפרט, פי שורש n."),
          "σ<sub>x̄</sub> = "+frac("σ","√n")),
        S(_("מציבים"),"",frac(num(sd),"√"+num(n))+" = "+frac(num(sd),num(Math.sqrt(n)))),
        S(_("התוצאה"),_("זו הסיבה שמדגם גדול נותן אומדן מדויק יותר — הפיזור יורד."),num(se))
      ],rule:"clt",hint:_("סטיית התקן של הממוצע היא סטיית התקן חלקי שורש גודל המדגם.")};
  }
  if(L===2){
    return {ask:_("מה אומר משפט הגבול המרכזי?"),
      expr:"x̄ ~ ?",
      ans:W(_("ממוצע המדגם מתפלג בקירוב נורמלית, גם אם האוכלוסייה אינה נורמלית")),
      wrong:[
        W(_("האוכלוסייה עצמה נעשית נורמלית"),
          _("המשפט אומר משהו על התפלגות הממוצע, ולא משנה את האוכלוסייה עצמה.")),
        W(_("כל מדגם גדול הוא נורמלי"),
          _("המדגם עצמו נראה כמו האוכלוסייה. מה שנעשה נורמלי הוא הממוצע על פני מדגמים.")),
        W(_("השונות שואפת לאפס"),
          _("היא יורדת עם n אבל אינה מתאפסת, וזה גם לא תוכן המשפט."))
      ],
      steps:[
        S(_("מה מתפלג נורמלית"),_("ההתפלגות של הממוצע, כשמדמיינים מדגמים רבים."),""),
        S(_("מה לא נדרש"),_("אין דרישה שהאוכלוסייה תהיה נורמלית. זה בדיוק כוחו של המשפט."),""),
        S(_("הפרמטרים"),"","x̄ ~ N(μ , σ²/n)")
      ],rule:"clt",hint:_("מה שהופך לנורמלי הוא ממוצע המדגם, לא האוכלוסייה.")};
  }
  /* L3 — רווח סמך */
  mu=ri(20,80);sd=pick([4,5,10]);n=pick([25,100]);
  var seq=r2(sd/Math.sqrt(n)), half=r2(1.96*seq);
  return {ask:_f("ממוצע מדגם {0}, סטיית תקן {1}, גודל מדגם {2}. מהו רווח סמך של 95 אחוז?", num(mu), num(sd), num(n)),
    expr:"x̄ ± z·"+frac("σ","√n"),
    ans:W(num(mu)+" ± "+num(half)),
    wrong:[
      W(num(mu)+" ± "+num(r2(1.96*sd)),_("שכחתם לחלק בשורש n. הרווח נבנה סביב הממוצע ולא סביב פרט בודד.")),
      W(num(mu)+" ± "+num(seq),_("שכחתם את 1.96. זה מקדם הביטחון של 95 אחוז.")),
      W(num(mu)+" ± "+num(r2(1.96*sd/n)),_("חילקתם ב-n במקום בשורש n. שגיאת התקן יורדת לפי השורש בלבד."))
    ],
    steps:[
      S(_("שגיאת התקן"),"",frac(num(sd),"√"+num(n))+" = "+num(seq)),
      S(_("מקדם הביטחון"),_("ל-95 אחוז המקדם הוא 1.96, כי בין ±1.96 סטיות תקן נמצא 95 אחוז מהשטח."),"z = 1.96"),
      S(_("הרווח"),"",num(mu)+" ± 1.96·"+num(seq)+" = "+num(mu)+" ± "+num(half))
    ],rule:"ci",hint:_("רווח סמך = ממוצע ± z כפול שגיאת התקן. ל-95 אחוז z שווה 1.96.")};
}

function lazyTr(obj,fields){
