<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>אקסיומה ב׳ — שנה שנייה, צעד אחר צעד</title>
<meta name="description" content="תרגול מתמטיקה לשנה ב׳ באוניברסיטה: חדו״א 2, אלגברה לינארית 2, משוואות דיפרנציאליות והסתברות. כל שאלה עם פתרון מודרך צעד־צעד, זיהוי הטעות, דף נוסחאות והקראה בקול טבעי." />
<meta name="theme-color" content="#f5f7fb" media="(prefers-color-scheme:light)" />
<meta name="theme-color" content="#0e1117" media="(prefers-color-scheme:dark)" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   אקסיומה ב׳ — מתמטיקה לשנה ב׳
   המשך ישיר של ״אקסיומה״, בחומר של שנה ב׳: חדו״א 2, אלגברה לינארית 2,
   משוואות דיפרנציאליות והסתברות רציפה. סטודנט שמתקשה לא צריך פחות
   חומר — הוא צריך לראות את הצעדים שבין שורה לשורה.
   ============================================================ */
:root{
  --ar:"Noto Sans Arabic",system-ui,"Segoe UI",Arial,sans-serif;
  --font:"Heebo","Rubik",system-ui,"Segoe UI",Arial,sans-serif;
  --bg:#f5f7fb; --surface:#ffffff; --surface2:#eef1f7;
  --ink:#101828; --muted:#5b6478; --faint:#687080; --line:#e0e4ee;
  --accent:#4f46e5; --accent-ink:#ffffff; --accent-soft:#e9e8fd;
  /* צהוב ההדגשה — אותו צהוב של מקריא קולי, כדי שמעקב ההקראה
     ייראה אותו דבר בכל האתר. */
  --hit:#f5c451; --hit-ink:#1a1300;
  --cyan:#0e7490; --cyan-soft:#dcf3f8;
  --ok:#15803d; --ok-soft:#dcfce7; --bad:#be123c; --bad-soft:#ffe4e9;
  --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px -12px rgba(16,24,40,.18);
  --r:14px;
  /* צבע לכל תחום לימוד. זה לא קישוט — זה עוזר לזהות מיד באיזה
     סוג חומר מדובר, וזה בדיוק מה שעוזר למי שמתקשה להתמצא. */
  --c-base:#0a6f66; --cs-base:#d2f4ef;
  --c-alg:#4a45c9;  --cs-alg:#e6e5fe;
  --c-geo:#9a4708;  --cs-geo:#fbecd3;
  --c-data:#be185d; --cs-data:#fbdfeb;
}

/* Heebo, Fredoka ו-Assistant אינם מכילים גליפים ערביים. בלי
   המשפחה הזאת הממשק הערבי נופל לגופן ברירת המחדל של המערכת —
   נמדד: הוא הוצג כאן ב-Heebo. Noto Sans Arabic נטען מאותה בקשת
   גופנים שכבר קיימת, ולכן אין כאן תלות חיצונית חדשה, וקובצי
   הגופן נמשכים רק כשבאמת מוצג טקסט ערבי. */
html[lang="ar"] body,html[lang="ar"] input,html[lang="ar"] button,
html[lang="ar"] textarea,html[lang="ar"] select{font-family:var(--ar)}
:root[data-theme="dark"]{
  --bg:#0e1117; --surface:#161b26; --surface2:#1e2532;
  --ink:#e8ecf4; --muted:#9aa4ba; --faint:#8f99ae; --line:#28313f;
  --accent:#818cf8; --accent-ink:#0e1117; --accent-soft:#232842;
  --hit:#ffd24d; --hit-ink:#241a00;
  --cyan:#22d3ee; --cyan-soft:#132b33;
  --ok:#4ade80; --ok-soft:#132a1c; --bad:#fb7185; --bad-soft:#33161f;
  --warn:#fbbf24; --warn-soft:#33260f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  --c-base:#2dd4bf; --cs-base:#0f2e2b;
  --c-alg:#a5b4fc;  --cs-alg:#1e2140;
  --c-geo:#fbbf24;  --cs-geo:#33270f;
  --c-data:#f472b6; --cs-data:#33162a;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1117; --surface:#161b26; --surface2:#1e2532;
    --ink:#e8ecf4; --muted:#9aa4ba; --faint:#8f99ae; --line:#28313f;
    --accent:#818cf8; --accent-ink:#0e1117; --accent-soft:#232842;
    --hit:#ffd24d; --hit-ink:#241a00;
    --cyan:#22d3ee; --cyan-soft:#132b33;
    --ok:#4ade80; --ok-soft:#132a1c; --bad:#fb7185; --bad-soft:#33161f;
    --warn:#fbbf24; --warn-soft:#33260f;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  --c-base:#2dd4bf; --cs-base:#0f2e2b;
  --c-alg:#a5b4fc;  --cs-alg:#1e2140;
  --c-geo:#fbbf24;  --cs-geo:#33270f;
  --c-data:#f472b6; --cs-data:#33162a;
  }
}
/* ניגודיות גבוהה — שחור על לבן, מסגרות מלאות, בלי גוונים רכים */
:root.hc{
  --bg:#ffffff; --surface:#ffffff; --surface2:#ffffff;
  --ink:#000000; --muted:#1a1a1a; --faint:#333333; --line:#000000;
  --accent:#00308f; --accent-ink:#ffffff; --accent-soft:#e8edf8;
  --hit:#ffe600; --hit-ink:#000000;
  --cyan:#004b57; --cyan-soft:#e6f2f4;
  --ok:#0a5c2a; --ok-soft:#e6f4ea; --bad:#8c0f2c; --bad-soft:#fbe9ed;
  --warn:#6b3d00; --warn-soft:#f7efdf; --shadow:none;
  --c-base:#00308f; --cs-base:#e8edf8; --c-alg:#00308f; --cs-alg:#e8edf8;
  --c-geo:#00308f;  --cs-geo:#e8edf8;  --c-data:#00308f; --cs-data:#e8edf8;
}
:root.hc .card,:root.hc .opt,:root.hc .btn,:root.hc .chip,:root.hc .tile{border:2px solid #000}
:root.hc .deco{display:none}

*{box-sizing:border-box;margin:0}
html{font-size:100%}
html.ts2{font-size:112%}
html.ts3{font-size:126%}
/* פונט ברור לקריאה: Tahoma ו-Verdana קיימים כמעט בכל מכשיר וכוללים עברית */
html.clearfont{--font:Tahoma,Verdana,Arial,sans-serif}
/* ריווח מוגדל — עוזר למי שקשה לו לעקוב אחרי השורה */
html.spaced body{letter-spacing:.03em;word-spacing:.16em;line-height:1.95}
html.rm *,html.rm *::before,html.rm *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.65;
  -webkit-text-size-adjust:100%;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:inherit}
input,select,textarea{font:inherit;color:var(--ink)}
a{color:var(--accent)}
::selection{background:var(--accent);color:var(--accent-ink)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---------- שלד ---------- */
#app{min-height:100vh;display:flex;flex-direction:column}
/* בלי זה כרום מותח כל מסך לרוחב המינימלי של התוכן שלו והעמוד גולש בטלפון */
#app>*{min-width:0;width:100%}
.wrap{max-width:1120px;margin:0 auto;padding:0 clamp(12px,4vw,22px)}
.deco{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.85;
  background:
    radial-gradient(760px 380px at 92% -6%,var(--cs-alg),transparent 62%),
    radial-gradient(620px 340px at 2% 18%,var(--cs-data),transparent 58%),
    radial-gradient(700px 380px at 10% 102%,var(--cs-base),transparent 60%),
    radial-gradient(520px 300px at 96% 78%,var(--cs-geo),transparent 58%)}
#app{position:relative;z-index:1}

/* ---------- כותרת עליונה ---------- */
header{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:10px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand .mk{width:38px;height:38px;border-radius:11px;
  background:linear-gradient(140deg,var(--c-alg),var(--c-data) 55%,var(--c-geo));color:#fff;
  display:grid;place-items:center;font-weight:800;font-size:1.05rem;flex-shrink:0}
:root.hc .brand .mk{background:var(--ink)}
.brand b{display:block;font-size:1rem;line-height:1.15;font-weight:800}
.brand small{display:block;color:var(--muted);font-size:.72rem;font-weight:500}
nav{display:flex;gap:4px;margin-inline-start:auto;flex-wrap:wrap}
.nb{display:inline-flex;align-items:center;gap:6px;border-radius:10px;padding:8px 12px;
  font-size:.9rem;font-weight:600;color:var(--muted);border:1px solid transparent;transition:.15s}
.nb:hover{background:var(--surface2);color:var(--ink)}
.nb.on{background:var(--accent);color:var(--accent-ink)}
:root.hc .nb.on{background:var(--ink);color:var(--bg)}
.nb svg{flex-shrink:0}
@media(max-width:560px){.nb span{display:none}.nb{padding:9px 11px}}

/* ---------- רכיבי בסיס ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:clamp(14px,3.4vw,22px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:11px;
  font-weight:700;padding:12px 18px;transition:.15s;border:1px solid transparent;line-height:1.3}
.btn-p{background:linear-gradient(135deg,var(--accent),var(--c-data));color:#fff}
.btn-p:hover{filter:brightness(1.1)}
:root.hc .btn-p{background:var(--accent)}
.btn-d{background:var(--ink);color:var(--bg)}
.btn-g{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-g:hover{background:var(--surface2)}
.btn[disabled]{opacity:.42;cursor:not-allowed}
.btn.w{width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;
  font-size:.82rem;font-weight:600;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.chip.a{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.h1{font-size:clamp(1.5rem,5.2vw,2.05rem);font-weight:800;line-height:1.2;overflow-wrap:anywhere}
.h2{font-size:clamp(1.1rem,3.6vw,1.3rem);font-weight:700;overflow-wrap:anywhere}
.sub{color:var(--muted);margin-top:5px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.sm{font-size:.85rem}
.xs{font-size:.76rem}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
/* רשימת הקולות: שתי עמודות רק כשבאמת יש מקום, אחרת השמות נקטעים */
.vgrid{grid-template-columns:repeat(auto-fit,minmax(min(100%,215px),1fr));gap:8px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
hr.sep{border:none;border-top:1px solid var(--line);margin:16px 0}

/* ---------- מתמטיקה: תמיד משמאל לימין, מבודד מהעברית ---------- */
.m{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums}
.mline{direction:ltr;unicode-bidi:isolate;text-align:center;font-weight:700;
  font-size:clamp(1.55rem,7vw,2.5rem);letter-spacing:.01em;line-height:1.35;overflow-wrap:anywhere}
.mstep{direction:ltr;unicode-bidi:isolate;text-align:center;font-weight:700;
  font-size:clamp(1.05rem,4.6vw,1.35rem);background:var(--surface2);border-radius:10px;
  padding:9px 12px;margin-top:8px;overflow-wrap:anywhere}
sup{font-size:.62em;vertical-align:super;line-height:0}
sub{font-size:.62em;vertical-align:sub;line-height:0}
/* ---------- מטריצה ווקטור ---------- */
.mtx{display:inline-flex;align-items:stretch;gap:7px;vertical-align:middle;
  padding:3px 10px;margin:0 .2em;position:relative;direction:ltr}
.mtx::before,.mtx::after{content:"";position:absolute;top:0;bottom:0;width:7px;
  border-top:2px solid currentColor;border-bottom:2px solid currentColor}
.mtx::before{inset-inline-start:0;border-inline-start:2px solid currentColor}
.mtx::after{inset-inline-end:0;border-inline-end:2px solid currentColor}
.mtx .mcol{display:flex;flex-direction:column;gap:3px;text-align:center;min-width:1.5em}
.mtx .mcol>span{padding:1px 4px;font-variant-numeric:tabular-nums}
.vec{display:inline-flex;gap:9px;padding:2px 11px;margin:0 .16em;direction:ltr;
  border-inline-start:2px solid currentColor;border-inline-end:2px solid currentColor;border-radius:9px}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;
  line-height:1.05;margin:0 .18em;font-size:.86em}
.frac>span:first-child{border-bottom:.09em solid currentColor;padding:0 .22em}
.frac>span:last-child{padding:0 .22em}

/* ---------- תשובות ---------- */
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
@media(max-width:430px){.opts{grid-template-columns:minmax(0,1fr)}}
.opt{position:relative;border:2px solid var(--line);background:var(--surface);border-radius:12px;
  padding:15px 14px 15px 44px;font-weight:700;font-size:clamp(1rem,4vw,1.2rem);transition:.14s;min-height:58px;
  display:flex;align-items:center;gap:10px}
[dir="rtl"] .opt{padding:15px 44px 15px 14px}
.opt:hover:not([disabled]){border-color:var(--c,var(--accent));background:var(--cs,var(--accent-soft))}
.opt .k{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);
  width:24px;height:24px;border-radius:7px;background:var(--cs,var(--surface2));color:var(--c,var(--faint));
  display:grid;place-items:center;font-size:.76rem;font-weight:700}
/* currentColor כאן היה נפתר לצבע שנקבע באותה הצהרה עצמה,
   ולכן הרקע והטקסט יצאו זהים והספרה נעלמה. */
.opt.right .k{background:var(--ok);color:var(--surface)}
.opt.wrong .k{background:var(--bad);color:var(--surface)}
.opt.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
/* בחירה במבחן היא בחירה, לא תשובה נכונה. במסכי התרגול הצבע
   הירוק אומר "צדקת", ובמבחן אסור לו להופיע כלל — הוא נותן
   משוב שגוי לכל בחירה. ניטרלי, ורק מסמן מה סומן. */
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.opt.dim{opacity:.4}
.opt.gone{opacity:.35;text-decoration:line-through}

/* ---------- פתרון מודרך ---------- */
.steps{margin-top:16px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.step{padding:13px 15px;border-top:1px solid var(--line);background:var(--surface)}
.step:first-child{border-top:none}
.step.future{display:none}
.step .st{display:flex;align-items:center;gap:9px;font-weight:700;font-size:.95rem}
.step .num{width:23px;height:23px;border-radius:50%;background:var(--c,var(--accent));color:var(--accent-ink);
  display:grid;place-items:center;font-size:.76rem;flex-shrink:0;font-weight:700}
.step .sd{color:var(--muted);font-size:.92rem;margin-top:4px;overflow-wrap:anywhere}
.step.last{background:var(--ok-soft)}
.step.last .num{background:var(--ok);color:var(--surface)}

/* ---------- פירוט טעות ---------- */
.diag{margin-top:14px;border-inline-start:4px solid var(--bad);background:var(--bad-soft);
  border-radius:0 10px 10px 0;padding:12px 15px}
[dir="rtl"] .diag{border-radius:10px 0 0 10px}
.diag b{color:var(--bad)}
.hintbox{margin-top:14px;border-inline-start:4px solid var(--warn);background:var(--warn-soft);
  border-radius:0 10px 10px 0;padding:12px 15px}
.wd{border-radius:5px;padding:1px 3px}
.wd.hit{background:var(--hit);color:var(--hit-ink);font-weight:600}
/* כשמנוע הדיבור אינו מדווח על גבולות מילים — קורה הרבה בעברית
   באנדרואיד — אין מה להדגיש מילה־מילה, ואז מודגש כל האיבר. הכלל
   הזה חסר, ולכן ההדגשה החלופית לא נראתה כלל: מי שהמנוע שלו שקט
   קיבל טקסט בלי שום סימון והמשיך לחפש את המקום בעיניים. */
.now{background:var(--hit);color:var(--hit-ink);border-radius:8px;
  box-shadow:0 0 0 4px var(--hit)}
[dir="rtl"] .hintbox{border-radius:10px 0 0 10px}

/* ---------- מדדים ---------- */
.bar{height:7px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s,background .3s}
.bar.ok>i{background:var(--ok)}
.bar.mid>i{background:var(--warn)}
.bar.low>i{background:var(--bad)}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--surface2);border:1px solid var(--line)}
.dot.ok{background:var(--ok);border-color:var(--ok)}
.dot.no{background:var(--bad);border-color:var(--bad)}
.dot.flag{box-shadow:0 0 0 2px var(--accent)}
.dot.hp{background:var(--warn);border-color:var(--warn)}
.tile{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--c,var(--accent));
  border-radius:12px;padding:14px;box-shadow:var(--shadow)}
.tile b{display:block;font-size:1.7rem;font-weight:800;line-height:1.2;color:var(--c,var(--ink))}
.tile span{color:var(--muted);font-size:.82rem}

/* ---------- כרטיס נושא ---------- */
.tpc{position:relative;display:flex;flex-direction:column;gap:9px;text-align:start;background:var(--surface);
  border:1px solid var(--line);border-inline-start:4px solid var(--c,var(--accent));
  border-radius:12px;padding:14px;transition:.15s;box-shadow:var(--shadow);min-width:0}
.tpc:hover{border-color:var(--c,var(--accent));transform:translateY(-2px);box-shadow:0 8px 22px -12px var(--c)}
.tpc:hover{border-inline-start-color:var(--c,var(--accent))}
.tpc.on{border-color:var(--c,var(--accent));background:var(--cs,var(--accent-soft))}
.tpc .tn{color:var(--c,var(--ink))}
.tpc .tn{font-weight:700;font-size:.98rem;overflow-wrap:anywhere}
.tpc .td{color:var(--muted);font-size:.8rem;overflow-wrap:anywhere}
.tpc .tm{display:flex;align-items:center;gap:7px;font-size:.74rem;color:var(--faint)}
.tpc .tm .bar{flex:1;min-width:0}

/* ---------- מתגים והגדרות ---------- */
.tog{display:flex;align-items:center;gap:13px;width:100%;text-align:start;background:var(--surface2);
  border:1px solid transparent;border-radius:12px;padding:13px 15px;transition:.15s;min-width:0}
.tog:hover{border-color:var(--line)}
.tog+.tog{margin-top:9px}
.tog .tt{flex:1;min-width:0}
.tog .tt b{display:block;font-size:.97rem;overflow-wrap:anywhere}

function demoMountUI(){
  var st=document.createElement("style");
  st.id="demo-style"; st.textContent=DEMO_CSS;
  (document.head||document.documentElement).appendChild(st);

  var b=document.createElement("button");
  b.id="demo-start"; b.type="button";
  b.innerHTML='<span aria-hidden="true">▶</span><span>התחל הדגמה</span>';
  b.addEventListener("click",demoStart);
  document.body.appendChild(b);

  var bar=document.createElement("div");
  bar.id="demo-bar"; bar.hidden=true;
  bar.setAttribute("role","status");
  bar.setAttribute("aria-live","polite");
  bar.innerHTML='<div id="demo-sub"><p id="demo-txt"></p>'+
    '<div id="demo-meta"><span id="demo-step"></span>'+
    '<button id="demo-exit" type="button">יציאה · ESC</button></div>'+
    '<div id="demo-prog"><i></i></div></div>';
  document.body.appendChild(bar);

  DEMO.btn=b; DEMO.bar=bar;
  DEMO.txt=document.getElementById("demo-txt");
  DEMO.step=document.getElementById("demo-step");
  DEMO.fill=bar.querySelector("#demo-prog i");
  document.getElementById("demo-exit").addEventListener("click",function(){demoStop()});
  document.addEventListener("keydown",demoKey,true);
}

/* ESC יוצא. הקשבה בשלב הלכידה, כדי שמסך שכבר מטפל ב-Escape
   לא יבלע את המקש לפני שההדגמה ראתה אותו. */
function demoKey(e){
  if(!DEMO.on)return;
  if(e.key==="Escape"||e.keyCode===27){
    e.preventDefault(); e.stopPropagation();
    demoStop();
  }
}

function demoStart(){
  if(DEMO.on)return;
  DEMO.on=true; DEMO.i=0;
  DEMO.btn.hidden=true; DEMO.bar.hidden=false;
  document.documentElement.classList.add("demo-running");
  demoNext();
}

function demoNext(){
  if(!DEMO.on)return;
  if(DEMO.i>=DEMO_SCRIPT.length){demoStop();return}
  var it=DEMO_SCRIPT[DEMO.i++]||{};
  var d=Math.max(600,it.duration||3000);
  DEMO.txt.textContent=it.subtitle||"";
  DEMO.step.textContent=DEMO.i+" / "+DEMO_SCRIPT.length;
  DEMO.fill.style.transition="none"; DEMO.fill.style.width="0";
  void DEMO.fill.offsetWidth;
  DEMO.fill.style.transition="width "+d+"ms linear";
  DEMO.fill.style.width="100%";
  if(typeof it.action==="function"){
    try{it.action()}catch(err){if(window.console)console.warn("demo:",err)}
  }
  DEMO.timer=setTimeout(demoNext,d);
}

function demoStop(){
  DEMO.on=false;
  if(DEMO.timer){clearTimeout(DEMO.timer);DEMO.timer=null}
  DEMO.extra.forEach(function(t){clearTimeout(t);clearInterval(t)});
  DEMO.extra=[];
  var m=document.querySelectorAll(".demo-tap"),i;
  for(i=0;i<m.length;i++)m[i].classList.remove("demo-tap");
  if(DEMO.bar)DEMO.bar.hidden=true;
  if(DEMO.btn)DEMO.btn.hidden=false;
  document.documentElement.classList.remove("demo-running");
  demoQuiet();
}

Fr.prototype.sub=function(o){return new Fr(this.n*o.d-o.n*this.d,this.d*o.d)};

function coef(c,v){

}

function afac(c){var a=Math.abs(c);return a===1?"":num(a)}

function term(c,v){
  if(c===0)return "";
  var s=c<0?" − ":" + ",a=Math.abs(c);

}
/* חזקה */
function pw(base,e){
  if(e===1)return base;

  for(i=Math.floor(Math.sqrt(n));i>=2;i--){ if(n%(i*i)===0){out=i;n=n/(i*i);break} }

function mat(rows){
  var cols=rows[0].length,out="",c,r;
  for(c=0;c<cols;c++){

    for(r=0;r<rows.length;r++)out+='<span>'+num(rows[r][c])+'</span>';

/* פולינום ממערך מקדמים מהחזקה הגבוהה לנמוכה: poly([2,0,-5,1]) */
function poly(cs,v){
  v=v||"x";
  var n=cs.length-1,out="",i,c,p,t;
  for(i=0;i<cs.length;i++){
    c=cs[i];p=n-i;

}

var LANGS={
  he:{name:"עברית",   dir:"rtl", tts:"he-IL"},
  ar:{name:"العربية", dir:"rtl", tts:"ar-SA"},
  ru:{name:"Русский", dir:"ltr", tts:"ru-RU"},
  en:{name:"English", dir:"ltr", tts:"en-US"}
};
var LG="he";
var TR={};
function _(h){
  if(LG==="he")return h;
  var d=TR[LG];
  if(!d)return h;
  var v=d[h];

}
/* תבנית עם ערכים מוצבים. סדר החלקים אינו זהה בכל שפה, ולכן משפט
   שמשולב בו מספר נשמר כתבנית שלמה ולא כשני חלקים מודבקים. */
function _f(h){
  var t=_(h),i,args=arguments;
  for(i=1;i<args.length;i++)t=t.split("{"+(i-1)+"}").join(String(args[i]));
  return t;
}
/* אנגלית אינה סימן. טלפון בישראל מדווח אנגלית כברירת מחדל של
   המכשיר, לא כבחירה, והאפליקציה נפתחה באנגלית למי שבא ללמוד
   בעברית. ערבית ורוסית כן נחשבות — שם זו שפת אם של ממש. מי
   שרוצה אנגלית בוחר אותה, והבחירה נשמרת. */
function guessLang(){
  var ls=(navigator.languages||[navigator.language||"he"]);
  for(var i=0;i<ls.length;i++){
    var c=String(ls[i]).toLowerCase().split("-")[0];
    if(c==="iw")c="he";
    if(c==="en")continue;
    if(LANGS[c])return c;
  }
  return "he";
}

/* ------------------------------------------------------------
   פיצול לאמירות קצרות — הועתק מ"תאוריה מדברת", שם ההקראה נשמעת
   הכי טוב. מנועי מכשיר מאיצים ובולעים סופי מילים במשפט ארוך;
   כאן נשלחה שאלה שלמה באמירה אחת, לפעמים 300 תווים.
   כל מקטע נושא את ההיסט שלו במחרוזת המלאה, כי charIndex מתאפס
   בכל אמירה ובלעדיו ההדגשה קופצת לתחילת המשפט בכל מקטע.
   ------------------------------------------------------------ */
var SEG_MAX=90, SEG_GAP=260;
/* סימן פיסוק בין שתי ספרות הוא חלק מהמספר ולא מקום לחתוך בו:
   בלי הבדיקה הזאת "3,500" נשבר והמנוע קורא "שלוש, חמש מאות". */
function insideNumber(str,i){
  return i>0&&i+1<str.length&&/[0-9]/.test(str[i-1])&&/[0-9]/.test(str[i+1]);
}
function segments(spoken){
  var out=[],parts=[],from=0,i,j;
  function push(t,start){ if(String(t).trim())out.push({text:t,start:start}) }
  for(i=0;i<spoken.length;i++){
    if(".!?:;".indexOf(spoken[i])<0)continue;
    if(insideNumber(spoken,i))continue;
    j=i+1; while(j<spoken.length&&/\s/.test(spoken[j]))j++;
    parts.push({text:spoken.slice(from,j),start:from});
    from=j; i=j-1;
  }
  if(from<spoken.length)parts.push({text:spoken.slice(from),start:from});
  for(var k=0;k<parts.length;k++){
    var p=parts[k];
    if(p.text.length<=SEG_MAX){ push(p.text,p.start); continue }
    var rest=p.text,base=p.start;
    while(rest.length>SEG_MAX){
      var cut=rest.lastIndexOf(",",SEG_MAX);
      while(cut>0&&insideNumber(rest,cut))cut=rest.lastIndexOf(",",cut-1);
      if(cut<SEG_MAX*0.4)cut=rest.lastIndexOf(" ",SEG_MAX);
      if(cut<=0)break;
      push(rest.slice(0,cut+1),base);
      base+=cut+1; rest=rest.slice(cut+1);
    }
    push(rest,base);
  }
  /* מקטע זעיר — "12." או ")" — עם הפסקה של רבע שנייה אחריו נשמע
     כמו גמגום. מאחדים אותו לזה שאחריו. */
  var merged=[];
  for(i=0;i<out.length;i++){
    if(merged.length&&out[i].text.trim().length<12&&
       merged[merged.length-1].text.length+out[i].text.length<=SEG_MAX*1.4){
      merged[merged.length-1].text+=out[i].text; continue;
    }
    if(out[i].text.trim().length<12&&i+1<out.length){
      out[i+1]={text:out[i].text+out[i+1].text,start:out[i].start}; continue;
    }
    merged.push(out[i]);
  }
  out=merged;
  return out.length?out:[{text:spoken,start:0}];
}
/* קצב לפי שפה — אותם ערכים שנבחרו בתאוריה מדברת אחרי האזנה */
var VOICE_TUNE={he:0.82,ar:0.85,en:0.90,ru:0.88};
function tuneRate(lang,rate){
  var t=VOICE_TUNE[String(lang||"he").split("-")[0].toLowerCase()]||0.88;
  var r=t*(rate||1);
  return Math.max(0.5,Math.min(1.6,Math.round(r*100)/100));
}

  return _("במכשיר הזה אין קול נשי בשפה הנוכחית, ולכן גובה הקול הורם. זה לא קול נשי אמיתי — כדי לקבל אחד צריך להתקין אותו.")+" "+how;

     כשהרשימה כבר כאן, בוחרים קול ומדברים. כשהיא ריקה — מדברים
     בכל זאת, עם u.lang בלבד: קול ברירת מחדל בשפה הנכונה עדיף על

     בשפה הנכונה בקול ברירת המחדל מאשר לשתוק לגמרי. */

                          :_("טור p מתכנס אם ורק אם p גדול מ-1. שוויון ל-1 הוא הטור ההרמוני, והוא מתבדר.")))})
        .concat([W(_("מתכנס רק לאיברים זוגיים"),_("התכנסות אינה תלויה בזוגיות האינדקס."))]),
      steps:[
        S(_("מזהים טור p"),_("צורת 1 חלקי n בחזקת p. כל ההכרעה תלויה ב-p אחד."),"p = "+pStr),
        S(_("הכלל"),_("p גדול מ-1 מתכנס. p קטן או שווה ל-1 מתבדר. הטור ההרמוני p=1 הוא הגבול, והוא מתבדר."),
          "p > 1 ⇒ "+_("מתכנס")),
        S(_("מסקנה"),unk?whyU:"",unk?"p = ?":(pStr+(conv?" > 1 ⇒ ":" ≤ 1 ⇒ ")+(conv?_("מתכנס"):_("מתבדר"))))
      ],rule:"pser",hint:_("טור p מתכנס אם ורק אם p גדול ממש מ-1.")};
  }
  /* L3 — מבחן המנה. קודם עמד כאן טור אחד בלבד, aⁿ חלקי n!, ולכן
     התשובה הייתה "מתכנס" בכל 500 ההגרלות — ושני המקרים האחרים של
     המבחן, גבול גדול מ-1 וגבול השווה ל-1 שאינו מכריע, לא הודגמו
     מעולם. עכשיו מוגרל אחד מארבעה טורים, ושלוש המסקנות אפשריות. */
  a=ri(2,5);
  var kp=pick([2,3]),cs=pick(["fact","powfac","pow","one"]);
  var eStr,ratio1,ratio2,limS,verd,vdesc,sdesc;
  if(cs==="fact"){
    eStr=frac(num(a)+"<sup>n</sup>","n!");
    ratio1=frac(num(a)+"<sup>n+1</sup> · n!","(n+1)! · "+num(a)+"<sup>n</sup>");
    ratio2=frac(num(a),"n+1");limS="0";verd=_("מתכנס");
    sdesc=_("העצרת מצטמצמת לגורם אחד: (n+1)! הוא (n+1) כפול n!.");
    vdesc=_("הגבול קטן מ-1, ולכן הטור מתכנס בהחלט.");
  }else if(cs==="powfac"){
    eStr=frac("n!",num(a)+"<sup>n</sup>");
    ratio1=frac("(n+1)! · "+num(a)+"<sup>n</sup>",num(a)+"<sup>n+1</sup> · n!");
    ratio2=frac("n+1",num(a));limS="∞";verd=_("מתבדר");
    sdesc=_("העצרת מצטמצמת לגורם אחד: (n+1)! הוא (n+1) כפול n!.");
    vdesc=_("הגבול גדול מ-1, ולכן האיברים אינם שואפים לאפס והטור מתבדר.");
  }else if(cs==="pow"){
    eStr=frac(num(a)+"<sup>n</sup>","n<sup>"+kp+"</sup>");
    ratio1=frac(num(a)+"<sup>n+1</sup> · n<sup>"+kp+"</sup>","(n+1)<sup>"+kp+"</sup> · "+num(a)+"<sup>n</sup>");
    ratio2=num(a)+" · "+frac("n<sup>"+kp+"</sup>","(n+1)<sup>"+kp+"</sup>");limS=num(a);verd=_("מתבדר");
    sdesc=_("יחס החזקות שואף ל-1, ולכן נשאר רק המקדם.");
    vdesc=_("הגבול גדול מ-1, ולכן האיברים אינם שואפים לאפס והטור מתבדר.");
  }else{
    eStr=frac("1","n<sup>"+kp+"</sup>");
    ratio1=frac("n<sup>"+kp+"</sup>","(n+1)<sup>"+kp+"</sup>");
    ratio2=ratio1;limS="1";verd=_("אי אפשר לקבוע");
    sdesc=_("יחס החזקות שואף ל-1, ולכן נשאר רק המקדם.");
    vdesc=_("הגבול הוא בדיוק 1, ובמקרה הזה מבחן המנה אינו אומר דבר — צריך מבחן אחר. הטור הזה אמנם מתכנס, אבל לא מבחן המנה מראה זאת.");
  }
  var vwhy=function(v){
    if(v===_("אי אפשר לקבוע"))return _f("מבחן המנה מכריע בכל פעם שהגבול שונה מ-1. כאן הגבול הוא {0}.", limS);
    if(cs==="one")return _("מבחן המנה אינו מכריע כשהגבול שווה ל-1. גם אם הטור מתכנס — לא מבחן המנה מראה זאת.");
    return _f("גבול המנה כאן הוא {0}. גבול קטן מ-1 פירושו התכנסות, וגבול גדול מ-1 פירושו התבדרות.", limS);
  };
  return {ask:_("לפי מבחן המנה — האם הטור מתכנס?"),
    expr:"Σ<sub>n=1</sub><sup>∞</sup> "+eStr,
    ans:W(verd),
    wrong:[_("מתכנס"),_("מתבדר"),_("אי אפשר לקבוע")].filter(function(v){return v!==verd})
      .map(function(v){return W(v,vwhy(v))})
      .concat([W(_("מתכנס רק לאיברים זוגיים"),_("התכנסות אינה תלויה בזוגיות האינדקס."))]),
    steps:[
      S(_("בונים את המנה"),_("מחלקים איבר באיבר שלפניו ומצמצמים."),
        frac("a<sub>n+1</sub>","a<sub>n</sub>")+" = "+ratio1),
      S(_("מצמצמים"),sdesc,"= "+ratio2),
      S(_("לוקחים גבול"),vdesc,"lim<sub>n→∞</sub> = "+limS)
    ],rule:"ratio",hint:_("מבחן המנה: גבול קטן מ-1 מתכנס, גבול גדול מ-1 מתבדר, וגבול השווה ל-1 אינו מכריע.")};
}

/* ---------- 2. טור טיילור ---------- */
function genTaylor(L){
  /* רמה 4 — תחום ההתכנסות ולא רק הרדיוס. הרדיוס יוצא ממבחן המנה,
     אבל כל קצה נבדק בנפרד ובכלי אחר: טור p או לייבניץ. ארבעת
     סוגי הקטעים מוגרלים, ולכן כל ארבע התשובות מופיעות. */
  if(L===4){
    var ct=rnz(-3,3),rd=ri(2,4),cs4=pick(["open","lc","cl","rc"]);
    var lo=ct-rd,hi=ct+rd;
    var den4,alt4,lcv,rcv,lser,rser;
    if(cs4==="open"){den4="";alt4=false;lcv=false;rcv=false;lser="Σ (−1)<sup>n</sup>";rser="Σ 1"}
    else if(cs4==="lc"){den4="n·";alt4=false;lcv=true;rcv=false;lser="Σ "+frac("(−1)<sup>n</sup>","n");rser="Σ "+frac("1","n")}
    else if(cs4==="cl"){den4="n²·";alt4=false;lcv=true;rcv=true;lser="Σ "+frac("(−1)<sup>n</sup>","n²");rser="Σ "+frac("1","n²")}
    else{den4="n·";alt4=true;lcv=false;rcv=true;lser="Σ "+frac("1","n");rser="Σ "+frac("(−1)<sup>n</sup>","n")}
    var iv=function(a,b){return (a?"[":"(")+num(lo)+" , "+num(hi)+(b?"]":")")};
    var ans4t=iv(lcv,rcv);
    var wt=function(c){return c?_("מתכנס"):_("מתבדר")};
    var why4t=_f("הרדיוס אינו התשובה. בדיקת הקצוות: ב-x = {0} מתקבל טור ש{1}, וב-x = {2} מתקבל טור ש{3}.",
      num(lo), wt(lcv), num(hi), wt(rcv));
    return {ask:_("מהו תחום ההתכנסות של הטור, כולל הקצוות?"),
      expr:"Σ<sub>n=1</sub><sup>∞</sup> "+(alt4?"(−1)<sup>n</sup>":"")+frac("(x"+sgn(-ct)+")<sup>n</sup>",den4+num(rd)+"<sup>n</sup>"),
      ans:W(ans4t),
      wrong:[iv(false,false),iv(true,false),iv(true,true),iv(false,true)]
        .filter(function(v){return v!==ans4t}).map(function(v){return W(v,why4t)}),
      steps:[
        S(_("רדיוס ההתכנסות"),_("מבחן המנה על הטור נותן את הרדיוס בלבד. בתוך הקטע הפתוח הטור מתכנס בהחלט, ומחוצה לו מתבדר."),
          "|x"+sgn(-ct)+"| < "+num(rd)+"   ⇒   R = "+num(rd)),
        S(_f("בודקים את הקצה x = {0}", num(lo)),_("מציבים את הקצה בטור עצמו ומקבלים טור מספרי. במבחן המנה הגבול שם שווה 1, ולכן הוא אינו יכול לעזור."),
          lser+" — "+wt(lcv)),
        S(_f("בודקים את הקצה x = {0}", num(hi)),_("אותה בדיקה בקצה השני. שני הקצוות אינם חייבים להתנהג אותו דבר."),
          rser+" — "+wt(rcv)),
        S(_("מרכיבים את התחום"),_("סוגר מרובע לקצה שמתכנס, סוגר עגול לקצה שמתבדר."),ans4t)
      ],rule:"ratio",hint:_("מבחן המנה נותן רדיוס בלבד. את שני הקצוות מציבים בנפרד ובודקים כטור מספרי.")};
  }
  var a,k;
  if(L===1){
    /* פיתוח סביב אפס לפונקציות היסוד — כאן רק לזהות, לא לגזור */
    var f=pick(["e","sin","cos","ln"]);
    var data={
      e:  {expr:"e<sup>x</sup>", t3:"1 + x + "+frac("x²","2")+" + "+frac("x³","6"),
           why:_("הנגזרות של eˣ כולן eˣ, ולכן כל המקדמים הם 1 חלקי n עצרת.")},
      sin:{expr:"sin x", t3:"x − "+frac("x³","6"),
           why:_("סינוס אי־זוגי, ולכן בפיתוח שלו יש רק חזקות אי־זוגיות.")},
      cos:{expr:"cos x", t3:"1 − "+frac("x²","2"),
           why:_("קוסינוס זוגי, ולכן בפיתוח שלו יש רק חזקות זוגיות.")},
      ln: {expr:"ln(1 + x)", t3:"x − "+frac("x²","2")+" + "+frac("x³","3"),
           why:_("כאן המכנים הם n עצמו ולא n עצרת, וזה ההבדל שהכי מבלבל.")}
    }[f];
    var wrongs={
      e:  ["1 + x + x² + x³", frac("x²","2")+" + "+frac("x³","6"), "1 − x + "+frac("x²","2")],
      sin:["x + "+frac("x³","6"), "1 − "+frac("x²","2"), "x − "+frac("x³","3")],
      cos:["1 + "+frac("x²","2"), "x − "+frac("x³","6"), "1 − x²"],
      ln: ["x − "+frac("x²","2")+" + "+frac("x³","6"), "1 + x − "+frac("x²","2"), "x + "+frac("x²","2")+" + "+frac("x³","3")]
    }[f];
    return {ask:_("מהו הפיתוח לטור מקלורן, עד החזקה השלישית?"),expr:"f(x) = "+data.expr,
      ans:W(data.t3),
      wrong:[
        W(wrongs[0],_("שכחתם את העצרת במכנה. המקדם הוא הנגזרת ה-n־ית חלקי n עצרת.")),
        W(wrongs[1],_("איבדתם את האיבר החופשי. הוא ערך הפונקציה באפס.")),
        W(wrongs[2],_("טעות סימן. בודקים על ידי הצבת x קטן ובדיקה מול הפונקציה עצמה."))
      ],
      steps:[
        S(_("נוסחת מקלורן"),_("כל מקדם הוא הנגזרת ה-n־ית באפס, חלקי n עצרת."),
          "f(x) = Σ "+frac("f<sup>(n)</sup>(0)","n!")+" xⁿ"),
        S(_("מה מיוחד כאן"),data.why,""),
        S(_("התוצאה"),"",data.t3+" + …")
      ],rule:"maclaurin",hint:_("המקדם ה-n־י הוא הנגזרת ה-n־ית באפס חלקי n עצרת.")};
  }
  if(L===2){
    /* פיתוח פולינום סביב נקודה — כאן טיילור הוא בדיוק כתיבה מחדש */
    a=rnz(-3,3);var A=ri(1,4),B=rnz(-5,5),C=rnz(-6,6);
    /* B = −A·a היה עושה את "פיתוח סביב אפס" זהה ל"סימן הפוך", ו-f′=0 מוחק את האיבר הלינארי */
    while(B===0||B===-A*a||2*A*a+B===0)B=B+1;
    var f0=A*a*a+B*a+C, f1=2*A*a+B, f2=2*A;
    return {ask:_f("פתחו את הפונקציה לטור טיילור סביב x = {0}.", num(a)),
      expr:"f(x) = "+poly([A,B,C]),
      ans:W(num(f0)+" "+(f1<0?"−":"+")+" "+afac(f1)+"(x"+sgn(-a)+") + "+afac(A)+"(x"+sgn(-a)+")²"),
      wrong:[
        W(num(f0)+" "+(f1<0?"−":"+")+" "+afac(f1)+"(x"+sgn(-a)+") + "+afac(f2)+"(x"+sgn(-a)+")²",
          _("שכחתם לחלק ב-2 עצרת. המקדם השני הוא הנגזרת השנייה חלקי 2.")),
        W(num(f0)+" "+(f1<0?"+":"−")+" "+afac(f1)+"(x"+sgn(-a)+") + "+afac(A)+"(x"+sgn(-a)+")²",
          _("איבדתם את סימן הנגזרת הראשונה.")),
        W(num(C)+" "+(B<0?"−":"+")+" "+afac(B)+"(x"+sgn(-a)+") + "+afac(A)+"(x"+sgn(-a)+")²",
          _f("הצבתם אפס במקום {0}. הפיתוח הוא סביב הנקודה שנתונה.", num(a)))
      ],
      steps:[
        S(_("מחשבים שלוש נגזרות בנקודה"),"",
          "f("+num(a)+") = "+num(f0)+"   ,   f′("+num(a)+") = "+num(f1)+"   ,   f″ = "+num(f2)),
        S(_("מציבים בנוסחה"),_("כל מקדם הוא הנגזרת חלקי העצרת המתאימה."),
          "f(a) + f′(a)(x−a) + "+frac("f″(a)","2!")+"(x−a)²"),
        S(_("מפשטים"),_("לפולינום ממעלה שנייה הפיתוח נעצר כאן — הנגזרת השלישית אפס."),
          num(f0)+" "+(f1<0?"−":"+")+" "+afac(f1)+"(x"+sgn(-a)+") + "+afac(A)+"(x"+sgn(-a)+")²")
      ],rule:"taylor",hint:_("f(a) + f′(a)(x−a) + f″(a)(x−a)² חלקי 2. כל מקדם מחולק בעצרת.")};
  }
  /* L3 — גבול בעזרת פיתוח, במקום לופיטל */
  /* המכנה היה תמיד מאותה דרגה כמו האיבר המוביל במונה, ולכן "0" היה
     מסיח שמופיע בכל שאלה ואינו נכון אף פעם. עכשיו מוגרל גם מכנה
     נמוך בדרגה אחת, ואז הגבול הוא באמת אפס — וזה בדיוק ההבדל שהרמה
     מלמדת: לא ההצבה קובעת, אלא השוואת הדרגות. */
  k=pick(["sin","cos","exp"]);
  var low=Math.random()<0.4;
  var d={sin:{e:"sin x − x",den:"x³",denLo:"x²",v:"−1/6",
              w:["−1/2","1/6"],
              exp:"x − x³/6 + … − x = −x³/6"},
         cos:{e:"1 − cos x",den:"x²",denLo:"x",v:"1/2",
              w:["1","−1/2"],
              exp:"1 − (1 − x²/2 + …) = x²/2"},
         exp:{e:"e<sup>x</sup> − 1 − x",den:"x²",denLo:"x",v:"1/2",
              w:["1","1/6"],
              exp:"(1 + x + x²/2 + …) − 1 − x = x²/2"}}[k];
  var denT=low?d.denLo:d.den,ansT=low?"0":d.v;
  return {ask:_("חשבו את הגבול בעזרת פיתוח לטור"),
    expr:"lim<sub>x→0</sub> "+frac(d.e,denT),
    ans:W(ansT),
    wrong:[W(low?d.v:"0",low?_("זה הגבול כשהמכנה מאותה דרגה כמו האיבר המוביל במונה. כאן המכנה נמוך בדרגה אחת, ולכן נשאר x שמאפס את הכול.")
                          :_("הצבתם ישירות וקיבלתם 0 חלקי 0. זו לא תשובה — צריך לפתח.")),
           W(d.w[0],_("טעות במקדם הפיתוח. כדאי לרשום את שלושת האיברים הראשונים במפורש.")),
           W(d.w[1],_("החלפתם בין המכנים של הפיתוחים. כל פונקציה והמקדמים שלה."))],
    steps:[
      S(_("מפתחים את המונה"),_("מספיקים שני־שלושה איברים — כל השאר קטן מדי כדי להשפיע."),d.exp),
      S(_("מצמצמים מול המכנה"),low?_("החזקה שנשארה במונה גבוהה מחזקת המכנה, ולכן אחרי הצמצום נשאר גורם x — והוא שואף לאפס.")
                                 :_("החזקה שנשארה במונה היא בדיוק חזקת המכנה, וזה מה שנותן ערך סופי."),""),
      S(_("התוצאה"),"",ansT)
    ],rule:"maclaurin",hint:_("במקום לופיטל: מפתחים את המונה לשני איברים ומצמצמים מול המכנה.")};
}

/* ---------- 3. אינטגרלים לא אמיתיים ---------- */
function genImproper(L){
  /* רמה 4 — לא נאמר איפה הבעיה. קודם מזהים מה הופך את האינטגרל
     ללא אמיתי, ורק אז מפעילים את הכלל של אותו קצה — והכללים
     בשני הקצוות הפוכים זה לזה. */
  if(L===4){
    var sh4=pick(["inf","zero","one"]),ps4=pick(["1/2","1/3",2,3]);
    var pv4=(ps4==="1/2")?0.5:(ps4==="1/3")?(1/3):ps4;
    var isInf4=(sh4==="inf");
    var cnv4=isInf4?(pv4>1):(pv4<1);
    var ex4=isInf4?("∫<sub>1</sub><sup>∞</sup> "+frac("1","x<sup>"+ps4+"</sup>")+" dx")
      :(sh4==="zero")?("∫<sub>0</sub><sup>1</sup> "+frac("1","x<sup>"+ps4+"</sup>")+" dx")
      :("∫<sub>0</sub><sup>1</sup> "+frac("1","(1 − x)<sup>"+ps4+"</sup>")+" dx");
    var locW=isInf4?_("שני הדברים שיכולים לקלקל אינטגרל הם קצה אינסופי ופונקציה שאינה חסומה. כאן הקטע אינסופי, והפונקציה עצמה חסומה בכל נקודה שלו.")
      :(sh4==="zero")?_("שני גבולות האינטגרציה סופיים. מה שהופך את האינטגרל ללא אמיתי הוא שהפונקציה אינה חסומה כאשר x שואף ל-0.")
      :_("שני גבולות האינטגרציה סופיים, והפונקציה נראית תמימה — אבל כאשר x שואף ל-1 המכנה מתאפס והיא אינה חסומה. שם הקושי.");
    var verW=isInf4?_f("בקצה אינסופי הכלל הוא p > 1 להתכנסות, וכאן p = {0}.", String(ps4))
      :_f("בקצה סופי הכלל הפוך לזה שבאינסוף: p < 1 להתכנסות, וכאן p = {0}.", String(ps4));
    var oi1=_("לא אמיתי באינסוף — ומתכנס"),oi2=_("לא אמיתי באינסוף — ומתבדר");
    var oi3=_("לא אמיתי בנקודת קצה סופית שבה הפונקציה אינה חסומה — ומתכנס");
    var oi4=_("לא אמיתי בנקודת קצה סופית שבה הפונקציה אינה חסומה — ומתבדר");
    var ansI=isInf4?(cnv4?oi1:oi2):(cnv4?oi3:oi4);
    return {ask:_("מדוע האינטגרל אינו אמיתי, והאם הוא מתכנס?"),
      expr:ex4,
      ans:W(ansI),
      wrong:[oi1,oi2,oi3,oi4].filter(function(v){return v!==ansI})
        .map(function(v){
          var vInf=(v===oi1||v===oi2);
          return W(v,vInf===isInf4?verW:locW);
        }),
      steps:[
        S(_("קודם: מה בכלל לא אמיתי כאן"),locW,""),
        S(_("איזה כלל שייך לקצה הזה"),verW,
          isInf4?"∫<sub>1</sub><sup>∞</sup> x<sup>−p</sup> dx   ⇔   p > 1":"∫<sub>0</sub><sup>1</sup> x<sup>−p</sup> dx   ⇔   p < 1"),
        S(_("מסקנה"),"",cnv4?_("מתכנס"):_("מתבדר"))
      ],rule:isInf4?"improp":"improp0",
      hint:_("קודם מזהים איזה קצה מקלקל, ורק אז בוחרים כלל — הכלל באינסוף הפוך לכלל בקצה סופי.")};
  }
  var a,p;
  if(L===1){
    /* p היה תמיד גדול מ-1, ולכן האינטגרל תמיד התכנס ו"מתבדר" לא היה
       התשובה אף פעם. p = 1 היא בדיוק נקודת הגבול של מבחן ה-p: שם
       הפונקציה הקדומה היא ln x, והאינטגרל מתבדר. */
    p=pick([1,2,3,4]);
    var dvg=(p===1),val=dvg?null:fr(1,p-1);
    return {ask:_("חשבו את האינטגרל הלא אמיתי"),
      expr:"∫<sub>1</sub><sup>∞</sup> "+frac("1",p===1?"x":"x<sup>"+p+"</sup>")+" dx",
      ans:W(dvg?_("מתבדר"):val.html()),
      wrong:dvg?[
        W("1",_("הפונקציה הקדומה של 1 חלקי x היא ln x ולא חזקה, ו-ln b שואף לאינסוף — אין כאן ערך סופי.")),
        W(fr(1,2).html(),_("זו התוצאה של החזקה 3, לא של החזקה 1.")),
        W("0",_("האיברים אמנם שואפים לאפס, אבל השטח שמתחת לעקומה עדיין אינו סופי."))
      ]:[
        W(_("מתבדר"),_f("מתבדר רק כאשר החזקה קטנה או שווה ל-1. כאן היא {0}.", num(p))),
        W(fr(1,p).html(),_("שכחתם להוריד 1 מהחזקה. אחרי האינטגרציה החזקה היא p פחות 1.")),
        W(fr(1,p+1).html(),_("העליתם את החזקה במקום להוריד אותה."))
      ],
      steps:[
        S(_("מחליפים אינסוף בגבול"),_("אינסוף אינו מספר שאפשר להציב. כותבים גבול ורק אז מציבים."),
          "lim<sub>b→∞</sub> ∫<sub>1</sub><sup>b</sup> x<sup>−"+p+"</sup> dx"),
        S(_("מוצאים פונקציה קדומה"),dvg?_("בחזקה 1 כלל החזקה היה מחלק באפס, ולכן הפונקציה הקדומה היא לוגריתם ולא חזקה."):"",
          dvg?"ln x":frac("x<sup>−"+(p-1)+"</sup>","−"+(p-1))),
        S(_("מציבים גבולות"),dvg?_("ln b שואף לאינסוף, ולכן לגבול אין ערך סופי והאינטגרל מתבדר.")
          :_f("החזקה השלילית שואפת לאפס כאשר b שואף לאינסוף, ונשאר רק הערך ב-1."),
          dvg?"ln b − ln 1 → ∞":("0 − ("+_("מינוס ")+frac("1",num(p-1))+") = "+val.html()))
      ],rule:"improp",hint:_("∫ מ-1 עד אינסוף של 1 חלקי x בחזקת p מתכנס אם ורק אם p גדול מ-1.")};
  }
  if(L===2){
    /* p היה תמיד גדול או שווה ל-1, ולכן התשובה הייתה תמיד "מתבדר"
       והכלל ההפוך שהרמה כולה מלמדת לא הודגם אף פעם. */
    /* החזקה הייתה תמיד נתונה, ולכן "אי אפשר לקבוע" לא היה התשובה
       אף פעם. עכשיו בחלק מההגרלות היא פרמטר p שאינו נתון. */
    a=pick([1,2,3,"1/2","1/3","p"]);
    var unkI=(a==="p");
    var pv=(a==="1/2")?0.5:(a==="1/3")?(1/3):a;
    var cnv=!unkI&&pv<1;
    var uni2i=[_("מתכנס"),_("מתבדר"),_("אי אפשר לקבוע")];
    var ans2i=unkI?uni2i[2]:(cnv?uni2i[0]:uni2i[1]);
    var whyUI=_("החזקה עצמה אינה נתונה: בקצה אפס הכלל הוא p קטן מ-1 להתכנסות, ובלי לדעת את p אי אפשר להכריע.");
    return {ask:_("האם האינטגרל מתכנס?"),
      expr:"∫<sub>0</sub><sup>1</sup> "+frac("1",a===1?"x":"x<sup>"+a+"</sup>")+" dx",
      ans:W(ans2i),
      wrong:uni2i.filter(function(v){return v!==ans2i}).map(function(v){
          return W(v, unkI?whyUI
            :(v===uni2i[2]?_("זהו אינטגרל p סטנדרטי בקצה אפס, וההכרעה מלאה.")
                          :_("בקצה 0 הכלל מתהפך: כאן מתכנס דווקא כאשר החזקה קטנה מ-1, ולא גדולה ממנה.")))})
        .concat([W(_("מתכנס רק אם החזקה שלמה"),_("שלמות החזקה אינה רלוונטית להתכנסות."))]),
      steps:[
        S(_("איפה הבעיה"),_("הפונקציה אינה חסומה ליד אפס, ולכן זה אינטגרל לא אמיתי מהסוג השני."),
          "x → 0<sup>+</sup>"),
        S(_("הכלל בקצה אפס"),_("∫ מ-0 עד 1 של 1 חלקי x בחזקת p מתכנס אם ורק אם p קטן מ-1. זה בדיוק הפוך מהכלל באינסוף."),
          "p < 1 ⇒ "+_("מתכנס")),
        S(_("מסקנה"),unkI?whyUI:"",unkI?"p = ?":("p = "+num(a)+(cnv?" < 1":" ≥ 1")+" ⇒ "+(cnv?_("מתכנס"):_("מתבדר"))))
      ],rule:"improp0",hint:_("בקצה אפס הכלל הפוך: מתכנס כאשר החזקה קטנה מ-1.")};
  }
  /* רמה 3. קודם עמד כאן תמיד a·e בחזקת מינוס ax, שבו a מצטמצם והתשובה
     יוצאת 1 — כלומר המספר שהשתנה בשאלה היה בדיוק המספר שאינו משפיע
     על התשובה. עכשיו המקדם שבחוץ והמקדם שבמעריך נפרדים, והתשובה היא
     היחס ביניהם; ולעיתים המעריך חיובי והאינטגרל מתבדר. */
  /* cc=kc היה מחזיר 1 בכל פעם, ו-kc=cc² היה משווה שני מסיחים זה לזה */
  var kc=ri(2,5),cc=ri(1,6),ktry=0;
  while((cc===kc||kc===cc*cc)&&ktry++<40)cc=ri(1,6);
  if(Math.random()<0.35){
    return {ask:_("חשבו את האינטגרל הלא אמיתי"),
      expr:"∫<sub>0</sub><sup>∞</sup> "+coef(cc,"e<sup>"+num(kc)+"x</sup>")+" dx",
      ans:W(_("מתבדר")),
      wrong:[
        W(fr(cc,kc).html(),_("זו התשובה שהייתה מתקבלת אילו המעריך היה שלילי. מעריך חיובי גדל, ואינו דועך.")),
        W(num(cc),_("שכחתם לחלק במקדם שבמעריך. האינטגרל של e בחזקת מינוס kx הוא מינוס 1 חלקי k.")),
        W("0",_("האינטגרנד חיובי וגדל, ולכן השטח מתחתיו אינו אפס אלא אינסופי."))
      ],
      steps:[
        S(_("מחליפים אינסוף בגבול"),"","lim<sub>b→∞</sub> ∫<sub>0</sub><sup>b</sup> "+coef(cc,"e<sup>"+num(kc)+"x</sup>")+" dx"),
        S(_("פונקציה קדומה"),_("הנגזרת הפנימית היא המקדם שבמעריך, ולכן מחלקים בו."),
          frac(num(cc),num(kc))+"e<sup>"+num(kc)+"x</sup>"),
        S(_("מציבים"),_("מעריך חיובי שואף לאינסוף, ולכן הגבול אינו קיים כמספר סופי."),"∞ − "+frac(num(cc),num(kc))+" = ∞")
      ],rule:"improp",hint:_("∫ מ-0 עד אינסוף של c·e בחזקת מינוס kx שווה c חלקי k. מעריך חיובי — האינטגרל מתבדר.")};
  }
  return {ask:_("חשבו את האינטגרל הלא אמיתי"),
    expr:"∫<sub>0</sub><sup>∞</sup> "+coef(cc,"e<sup>−"+num(kc)+"x</sup>")+" dx",
    ans:W(fr(cc,kc).html()),
    wrong:[
      W(num(cc),_("שכחתם לחלק במקדם שבמעריך. האינטגרל של e בחזקת מינוס kx הוא מינוס 1 חלקי k.")),
      W(fr(kc,cc).html(),_("הפכתם את היחס. מחלקים במקדם שבמעריך, לא במקדם שבחוץ.")),
      W(_("מתבדר"),_("מעריך שלילי גורם לדעיכה מהירה, והאינטגרל סופי."))
    ],
    steps:[
      S(_("מחליפים אינסוף בגבול"),"","lim<sub>b→∞</sub> ∫<sub>0</sub><sup>b</sup> "+coef(cc,"e<sup>−"+num(kc)+"x</sup>")+" dx"),
      S(_("פונקציה קדומה"),_("הנגזרת הפנימית היא מינוס k, ולכן מחלקים בה."),
        "−"+frac(num(cc),num(kc))+"e<sup>−"+num(kc)+"x</sup>"),
      S(_("מציבים"),_("באינסוף האקספוננט שואף לאפס, ונשאר הערך באפס."),
        "0 − (−"+frac(num(cc),num(kc))+") = "+fr(cc,kc).html())
    ],rule:"improp",hint:_("∫ מ-0 עד אינסוף של c·e בחזקת מינוס kx שווה c חלקי k. מעריך חיובי — האינטגרל מתבדר.")};
}

/* ---------- 4. נגזרות חלקיות וגרדיאנט ---------- */
function genPartial(L){
  /* רמה 4 — לא "חשבו נגזרת מכוונת" אלא "באיזה כיוון היא מתאפסת".
     צריך לחבר שני דברים: הנגזרת המכוונת היא מכפלה סקלרית עם
     הגרדיאנט, ומכפלה סקלרית מתאפסת בדיוק בניצבות. */
  if(L===4){
    var pa=rnz(-3,3),pb=rnz(-4,4),pc=rnz(-3,3),px=rnz(-3,3),py=rnz(-3,3),pt=0;
    var gx4=2*pa*px+pb*py, gy4=pb*px+2*pc*py;
    while(pt++<200&&(gx4===0||gy4===0||Math.abs(gx4)===Math.abs(gy4))){
      pa=rnz(-3,3);pb=rnz(-4,4);pc=rnz(-3,3);px=rnz(-3,3);py=rnz(-3,3);
      gx4=2*pa*px+pb*py;gy4=pb*px+2*pc*py;
    }
    var vv=function(u,v){return "("+num(u)+" , "+num(v)+")"};
    return {ask:_f("בכיוון איזה וקטור הנגזרת המכוונת של f בנקודה ({0} , {1}) מתאפסת?", num(px), num(py)),
      expr:"f(x,y) = "+coef(pa,"x²")+term(pb,"xy")+term(pc,"y²"),
      ans:W(vv(-gy4,gx4)),
      wrong:[
        W(vv(gx4,gy4),_("זהו הגרדיאנט עצמו. בכיוון שלו הנגזרת המכוונת מרבית, ולא אפס.")),
        W(vv(gy4,gx4),_f("החלפת רכיבים אינה יוצרת ניצבות. המכפלה הסקלרית כאן היא 2·f_x·f_y = {0}, ואינה אפס.", num(2*gx4*gy4))),
        W(vv(-gx4,gy4),_f("היפוך סימן ברכיב אחד מספיק רק אם מחליפים גם את הרכיבים. המכפלה הסקלרית כאן היא f_y² − f_x² = {0}.", num(gy4*gy4-gx4*gx4)))
      ],
      steps:[
        S(_("הגרדיאנט בנקודה"),_("שתי נגזרות חלקיות, ואז הצבה."),
          "∇f = ("+num(gx4)+" , "+num(gy4)+")"),
        S(_("מה בכלל הנגזרת המכוונת"),_("היא המכפלה הסקלרית של הגרדיאנט בווקטור הכיוון. הנרמול משנה גודל, לא סימן — ולכן להתאפסות הוא אינו רלוונטי."),
          "D<sub>u</sub>f = ∇f · û"),
        S(_("מתי מכפלה סקלרית מתאפסת"),_("בדיוק כשהווקטורים מאונכים. לכן מחפשים וקטור שמאונך לגרדיאנט."),
          "∇f · u = 0"),
        S(_("המאונך במישור"),_("מחליפים רכיבים והופכים סימן לאחד מהם. זה גם הכיוון המשיק לעקום הגובה — לאורכו f אינה משתנה."),
          num(gx4)+"·"+pn(-gy4)+" + "+num(gy4)+"·"+pn(gx4)+" = 0")
      ],rule:"dirder",hint:_("הנגזרת המכוונת מתאפסת בדיוק בכיוון המאונך לגרדיאנט — הכיוון המשיק לעקום הגובה.")};
  }
  var a,b,c;
  if(L===1){
    a=rnz(-5,5);b=rnz(-5,5);c=rnz(-6,6);
    /* f = a x² + b xy + c y² */
    return {ask:_("חשבו את הנגזרת החלקית לפי x"),
      expr:"f(x,y) = "+coef(a,"x²")+term(b,"xy")+term(c,"y²"),
      ans:W("f<sub>x</sub> = "+coef(2*a,"x")+term(b,"y")),
      wrong:[
        W("f<sub>x</sub> = "+coef(2*a,"x")+term(b,"y")+term(2*c,"y"),
          _("גזרתם גם את האיבר ב-y². בגזירה לפי x כל מה שאין בו x הוא קבוע, ונגזרתו אפס.")),
        W("f<sub>x</sub> = "+coef(a,"x")+term(b,"y"),_("שכחתם להוריד את החזקה למקדם.")),
        W("f<sub>x</sub> = "+coef(2*a,"x")+term(b,"x"),_("החלפתם משתנה. הנגזרת של bxy לפי x היא by."))
      ],
      steps:[
        S(_("y הוא קבוע"),_("בנגזרת חלקית לפי x מתייחסים ל-y כמו למספר. זה כל הרעיון."),""),
        S(_("גוזרים איבר איבר"),"",coef(a,"x²")+" → "+coef(2*a,"x")+"   ,   "+coef(b,"xy")+" → "+coef(b,"y")+"   ,   "+coef(c,"y²")+" → 0"),
        S(_("מחברים"),"","f<sub>x</sub> = "+coef(2*a,"x")+term(b,"y"))
      ],rule:"partial",hint:_("גוזרים לפי x ומתייחסים ל-y כמו למספר קבוע.")};
  }
  if(L===2){
    a=rnz(-4,4);b=rnz(-4,4);
    var x0=rnz(-3,3),y0=rnz(-3,3),gtry=0;
    var gx=2*a*x0+b*y0, gy=b*x0;
    /* רכיבים שווים היו הופכים את המסיח "החלפתם רכיבים" לתשובה הנכונה */
    while(gx===gy&&gtry++<30){x0=rnz(-3,3);y0=rnz(-3,3);gx=2*a*x0+b*y0;gy=b*x0}
    return {ask:_f("חשבו את הגרדיאנט בנקודה ({0} , {1})", num(x0), num(y0)),
      expr:"f(x,y) = "+coef(a,"x²")+term(b,"xy"),
      ans:W("∇f = ("+num(gx)+" , "+num(gy)+")"),
      wrong:[
        W("∇f = ("+num(gy)+" , "+num(gx)+")",_("החלפתם בין הרכיבים. הרכיב הראשון הוא הנגזרת לפי x.")),
        W("∇f = ("+num(2*a*x0)+" , "+num(b*x0)+")",_("שכחתם את האיבר המעורב בנגזרת לפי x.")),
        W("∇f = "+num(gx+gy),_("הגרדיאנט הוא וקטור, לא מספר. הוא מצביע לכיוון העלייה התלולה ביותר."))
      ],
      steps:[
        S(_("שתי נגזרות חלקיות"),"","f<sub>x</sub> = "+coef(2*a,"x")+term(b,"y")+"   ,   f<sub>y</sub> = "+coef(b,"x")),
        S(_("מציבים את הנקודה"),"","f<sub>x</sub> = "+num(gx)+"   ,   f<sub>y</sub> = "+num(gy)),
        S(_("הגרדיאנט הוא וקטור"),_("הוא מצביע לכיוון שבו הפונקציה עולה הכי מהר, וגודלו הוא קצב העלייה."),
          "∇f = ("+num(gx)+" , "+num(gy)+")")
      ],rule:"grad",hint:_("הגרדיאנט הוא הווקטור של הנגזרות החלקיות, לפי הסדר.")};
  }
  /* L3 — נגזרת מכוונת */
  a=rnz(-4,4);b=rnz(-4,4);
  var ux=pick([3,4]),uy=(ux===3?4:3),sg=pick([1,-1]);
  uy=uy*sg;
  var normd=5;
  var gx3=2*a, gy3=b;   /* בנקודה (1,1): f=ax²+bxy → fx=2a+b·1, fy=b·1 */
  gx3=2*a+b; gy3=b;
  var dd=(gx3*ux+gy3*uy)/normd;
  return {ask:_f("חשבו את הנגזרת המכוונת בנקודה (1 , 1) בכיוון u = ({0} , {1})", num(ux), num(uy)),
    expr:"f(x,y) = "+coef(a,"x²")+term(b,"xy"),
    ans:W(num(r2(dd))),
    wrong:[
      W(num(gx3*ux+gy3*uy),_("שכחתם לנרמל את וקטור הכיוון. נגזרת מכוונת מוגדרת לכיוון באורך 1.")),
      W(num(r2((gx3*uy+gy3*ux)/normd)),_("החלפתם בין רכיבי הכיוון.")),
      W(num(r2(Math.sqrt(gx3*gx3+gy3*gy3))),_("זה גודל הגרדיאנט — הנגזרת המכוונת המרבית, ולא זו שבכיוון שנתן."))
    ],
    steps:[
      S(_("הגרדיאנט בנקודה"),"","∇f = ("+num(gx3)+" , "+num(gy3)+")"),
      S(_("מנרמלים את הכיוון"),_("נגזרת מכוונת דורשת וקטור יחידה, אחרת התוצאה תלויה באורך שבחרו."),
        "|u| = "+normd+"   ,   û = ("+num(ux)+"/"+normd+" , "+num(uy)+"/"+normd+")"),
      S(_("מכפלה סקלרית"),_("הנגזרת המכוונת היא הגרדיאנט כפול וקטור היחידה."),
        "∇f · û = "+num(r2(dd)))
    ],rule:"dirder",hint:_("נגזרת מכוונת = גרדיאנט כפול וקטור כיוון מנורמל.")};
}

/* ---------- 5. קיצון בשני משתנים ---------- */
function genExtrema2(L){
  /* רמה 4 — הכלי שלמדו נשבר. ההסיאן נותן D = 0 ואינו מכריע,
     והתלמיד צריך להכריע ישירות מהצורה. הפיתוי הגדול הוא לענות
     "אי אפשר לקבוע", וזה בדיוק מה שאינו נכון. */
  if(L===4){
    var ea=pick([1,-1])*ri(1,3),eb=pick([1,-1])*ri(1,3),xf=pick([true,false]);
    var kind4=(ea>0&&eb>0)?_("מינימום"):(ea<0&&eb<0)?_("מקסימום"):_("נקודת אוכף");
    var e4x=xf?(fac(ea)+"x⁴"):(fac(ea)+"x²");
    var e4y=(eb<0?" − ":" + ")+afac(eb)+(xf?"y²":"y⁴");
    var axTxt=_f("לאורך ציר x: f(x , 0) = {0}, ולכן הסימן שם הוא הסימן של {1}.", e4x, num(ea));
    var ayTxt=_f("לאורך ציר y: f(0 , y) = {0}, ולכן הסימן שם הוא הסימן של {1}.", (eb<0?"−":"")+afac(eb)+(xf?"y²":"y⁴"), num(eb));
    var whyK=function(k){
      if(k===_("נקודת אוכף"))return _("אוכף פירושו שהפונקציה עולה בכיוון אחד ויורדת באחר. כאן שני המקדמים באותו סימן, ולכן זה לא המצב.");
      if(kind4===_("נקודת אוכף"))return _("שני המקדמים בסימנים מנוגדים, ולכן לאורך ציר אחד יש עלייה ולאורך השני ירידה — זה אוכף ולא קיצון.");
      return _("הסימן של שני המקדמים הוא שקובע: שניהם חיוביים נותנים מינימום, שניהם שליליים נותנים מקסימום.");
    };
    return {ask:_("בראשית מבחן ההסיאן נותן D = 0 ואינו מכריע. מהו סוג הנקודה?"),
      expr:"f(x,y) = "+e4x+e4y,
      ans:W(kind4),
      wrong:[_("מינימום"),_("מקסימום"),_("נקודת אוכף")].filter(function(k){return k!==kind4})
        .map(function(k){return W(k,whyK(k))})
        .concat([W(_("אי אפשר לקבוע — המבחן אינו מכריע"),
          _("המבחן אכן שותק, אבל השאלה אינה שותקת. שתי החזקות זוגיות, ולכן הסימנים של המקדמים מכריעים ישירות בלי שום מבחן."))]),
      steps:[
        S(_("מוודאים שזו נקודה קריטית"),_("שתי הנגזרות החלקיות מתאפסות בראשית, ולכן יש מה לסווג."),
          "f<sub>x</sub>(0,0) = 0   ,   f<sub>y</sub>(0,0) = 0"),
        S(_("למה ההסיאן שותק"),_("החזקה הרביעית נותנת נגזרת שנייה שמתאפסת בראשית, ולכן D יוצא אפס. במצב הזה המבחן אינו אומר דבר — לא לחיוב ולא לשלילה."),
          "D = f<sub>xx</sub>f<sub>yy</sub> − f<sub>xy</sub>² = 0"),
        S(_("בודקים ישירות לאורך הצירים"),axTxt+" "+ayTxt,""),
        S(_("מסקנה"),_("שני הכיוונים באותו סימן נותנים קיצון; סימנים מנוגדים נותנים אוכף."),kind4)
      ],rule:"hess",hint:_("D = 0 אינו אומר שאין קיצון — הוא אומר שהמבחן אינו עוזר. אז בודקים את הפונקציה עצמה.")};
  }
  var a,b,c,d;
  if(L===1){
    /* f = a(x−p)² + b(y−q)² + c — סוג הקיצון נקבע רק בסימנים */
    var p=rnz(-3,3),q=rnz(-3,3);
    a=pick([1,-1])*ri(1,3); b=pick([1,-1])*ri(1,3);
    var kind=(a>0&&b>0)?_("מינימום"):(a<0&&b<0)?_("מקסימום"):_("נקודת אוכף");
    /* המסיחים הם שני הסוגים שלא נבחרו — אחרת אחד מהם היה התשובה עצמה */
    var rest=[_("מינימום"),_("מקסימום"),_("נקודת אוכף")].filter(function(k){return k!==kind});
    var whyKind=function(k){return k===_("נקודת אוכף")
      ?_("אוכף מתקבל רק כששני המקדמים בסימנים מנוגדים.")
      :_("שני המקדמים חיוביים נותנים מינימום, שניהם שליליים מקסימום, וסימנים מעורבים נותנים אוכף.")};
    return {ask:_("איזה סוג נקודה קריטית יש כאן?"),
      expr:"f(x,y) = "+fac(a)+"(x"+sgn(-p)+")² "+(b<0?"−":"+")+" "+afac(b)+"(y"+sgn(-q)+")²",
      ans:W(kind),
      wrong:[
        W(rest[0],whyKind(rest[0])),
        W(rest[1],whyKind(rest[1])),
        W(_("אין קיצון"),_("לפונקציה ריבועית בשני משתנים תמיד יש נקודה קריטית אחת."))
      ],
      steps:[
        S(_("איפה הנקודה הקריטית"),_("שתי הנגזרות החלקיות מתאפסות בדיוק במרכז הריבועים."),
          "("+num(p)+" , "+num(q)+")"),
        S(_("קוראים את הסימנים"),_("כל ריבוע תורם קמירות בכיוון שלו. הסימן של המקדם הוא כל הסיפור."),
          "a = "+num(a)+"   ,   b = "+num(b)),
        S(_("מסקנה"),"",kind)
      ],rule:"hess",hint:_("שני מקדמים חיוביים — מינימום. שניהם שליליים — מקסימום. מעורב — אוכף.")};
  }
  if(L===2){
    /* מבחן ההסיאן על f = ax² + bxy + cy² */
    a=rnz(-3,3);c=rnz(-3,3);b=rnz(-4,4);
    var D=4*a*c-b*b;
    var kind2=D<0?_("נקודת אוכף"):(D>0?(a>0?_("מינימום"):_("מקסימום")):_("המבחן אינו מכריע"));
    var rest2=[_("נקודת אוכף"),_("מינימום"),_("מקסימום")].filter(function(k){return k!==kind2});
    return {ask:_("מהו סוג הנקודה הקריטית (0 , 0)?"),
      expr:"f(x,y) = "+coef(a,"x²")+term(b,"xy")+term(c,"y²"),
      ans:W(kind2),
      wrong:[
        W(rest2[0],_("הדטרמיננטה של ההסיאן מכריעה קודם. שלילית פירושה אוכף, בלי קשר לסימן של a.")),
        W(rest2[1],_("אחרי שהדטרמיננטה חיובית, הסימן של f<sub>xx</sub> הוא שקובע — ולא ההפך ממנו.")),
        W(_("אין נקודה קריטית"),_("הגרדיאנט מתאפס בראשית, ולכן היא נקודה קריטית."))
      ],
      steps:[
        S(_("בונים את ההסיאן"),_("ארבע נגזרות שניות. המעורבות שוות זו לזו."),
          "f<sub>xx</sub> = "+num(2*a)+"   ,   f<sub>yy</sub> = "+num(2*c)+"   ,   f<sub>xy</sub> = "+num(b)),
        S(_("הדטרמיננטה"),_("D = f_xx·f_yy פחות ריבוע המעורבת."),
          "D = "+num(2*a)+"·"+pn(2*c)+" − "+pn(b)+"² = "+num(D)),
        S(_("קוראים את התוצאה"),_("D שלילי — אוכף. D חיובי — לפי הסימן של f_xx. D אפס — המבחן שותק."),kind2)
      ],rule:"hess",hint:_("D = f_xx·f_yy פחות f_xy בריבוע. שלילי זה אוכף, ורק אז מסתכלים על f_xx.")};
  }
  /* L3 — מציאת הנקודה הקריטית עצמה */
  a=ri(1,3);b=rnz(-6,6);d=rnz(-6,6);
  /* f = a x² + a y² + b x + d y  → קריטית ב-(−b/2a , −d/2a) */
  var xs=fr(-b,2*a),ys=fr(-d,2*a);
  return {ask:_("מצאו את הנקודה הקריטית"),
    expr:"f(x,y) = "+coef(a,"x²")+" + "+coef(a,"y²")+term(b,"x")+term(d,"y"),
    ans:W("("+xs.html()+" , "+ys.html()+")"),
    wrong:[
      W("("+fr(b,2*a).html()+" , "+fr(d,2*a).html()+")",_("טעות סימן. מעבירים אגף ואז מחלקים, והסימן מתהפך.")),
      W("("+fr(-b,a).html()+" , "+fr(-d,a).html()+")",_("שכחתם את ה-2 שמגיע מגזירת הריבוע.")),
      W("(0 , 0)",_("הראשית היא נקודה קריטית רק כשאין איברים לינאריים."))
    ],
    steps:[
      S(_("מאפסים שתי נגזרות"),"","f<sub>x</sub> = "+coef(2*a,"x")+sgn(b)+" = 0   ,   f<sub>y</sub> = "+coef(2*a,"y")+sgn(d)+" = 0"),
      S(_("פותרים כל אחת"),_("שתי משוואות בלתי תלויות, כל אחת בנעלם אחד."),
        "x = "+xs.html()+"   ,   y = "+ys.html()),
      S(_("הנקודה"),"","("+xs.html()+" , "+ys.html()+")")
    ],rule:"crit2",hint:_("נקודה קריטית היא המקום שבו שתי הנגזרות החלקיות מתאפסות יחד.")};
}

/* ---------- 6. כופלי לגראנז׳ ---------- */
function genLagrange(L){
  /* רמה 4 — לא "מצאו את הקיצון" אלא "האם הוא בכלל קיים".
     לגראנז׳ מייצר מועמדים; מה שמבטיח שהקיצון מתקבל הוא שהאילוץ
     סגור וחסום, או שהפונקציה שואפת לאינסוף לאורכו. */
  if(L===4){
    var lc=pick(["circ","line","dist"]),isMax=pick([true,false]);
    var lr=ri(2,6),la=ri(1,4),lb=ri(1,4),lk=ri(2,9);
    var dirW=isMax?_("מקסימום"):_("מינימום");
    var fTxt,gTxt,setW,behW,corr;
    var oL1=_f("כן — האילוץ סגור וחסום ו-f רציפה עליו, ולכן ה{0} מתקבל", dirW);
    var oL2=_f("לא — האילוץ אינו חסום, ולאורכו f אינה חסומה בכיוון הזה, ולכן אין {0}", dirW);
    var oL3=_f("כן — האילוץ אינו חסום, אבל f שואפת לאינסוף בשני קצותיו, ולכן ה{0} כן מתקבל", dirW);
    var oL4=_("לא — הגרדיאנט של האילוץ מתאפס באחת מנקודות האילוץ, ולכן שיטת לגראנז׳ אינה חלה כאן");
    if(lc==="circ"){
      fTxt="f(x,y) = x + y";gTxt="g: x² + y² = "+num(lr*lr);
      setW=_f("האילוץ הוא מעגל ברדיוס {0} — קבוצה סגורה וחסומה.", num(lr));
      behW=_("פונקציה רציפה על קבוצה סגורה וחסומה מקבלת עליה מקסימום ומינימום. זה משפט ויירשטראס, והוא מה שמצדיק את החיפוש.");
      corr=oL1;
    }else if(lc==="line"){
      fTxt="f(x,y) = x + y";gTxt="g: x − y = "+num(lk);
      setW=_("האילוץ הוא ישר — קבוצה סגורה, אבל אינה חסומה.");
      behW=_f("לאורך הישר אפשר לכתוב y = x − {0}, ואז f = 2x − {0}. כאשר x שואף לאינסוף f שואפת לאינסוף, וכאשר x שואף למינוס אינסוף f שואפת למינוס אינסוף — ולכן אין לא מקסימום ולא מינימום.", num(lk));
      corr=oL2;
    }else{
      fTxt="f(x,y) = x² + y²";gTxt="g: "+coef(la,"x")+" + "+coef(lb,"y")+" = "+num(lk);
      setW=_("האילוץ הוא ישר — קבוצה סגורה, אבל אינה חסומה.");
      behW=_("f היא ריבוע המרחק מהראשית, ולכן היא שואפת לאינסוף בשני קצות הישר. מינימום מתקבל בנקודה הקרובה ביותר, אבל מקסימום אינו קיים.");
      corr=isMax?oL2:oL3;
    }
    var whyL=function(v){
      if(v===oL4)return _("∇g כאן אינו מתאפס באף נקודה של האילוץ, ולכן תנאי לגראנז׳ תקף. זו אינה הסיבה.");
      if(v===oL1)return _("האילוץ כאן אינו חסום, ולכן משפט ויירשטראס אינו חל ואי אפשר להסתמך עליו.");
      if(v===oL2)return lc==="circ"
        ?_("האילוץ חסום, ופונקציה רציפה על קבוצה סגורה וחסומה תמיד מקבלת עליה מקסימום ומינימום.")
        :behW;
      return behW;
    };
    return {ask:_f("האם ל-f יש {0} תחת האילוץ, ומדוע?", dirW),
      expr:fTxt+"   ,   "+gTxt,
      ans:W(corr),
      wrong:[oL1,oL2,oL3,oL4].filter(function(v){return v!==corr})
        .map(function(v){return W(v,whyL(v))}),
      steps:[
        S(_("מה לגראנז׳ מבטיח ומה לא"),_("השיטה מוצאת נקודות חשודות. היא אינה מוכיחה שקיים קיצון, ולכן קודם שואלים אם יש מה לחפש."),
          "∇f = λ∇g"),
        S(_("בודקים את קבוצת האילוץ"),setW,""),
        S(_("בודקים את התנהגות f לאורכה"),behW,""),
        S(_("מסקנה"),"",corr)
      ],rule:"lagr",hint:_("לפני שמחפשים קיצון שואלים אם הוא קיים: אילוץ סגור וחסום מבטיח, ואילוץ פתוח דורש בדיקה של ההתנהגות באינסוף.")};
  }
  var a,b,c;
  if(L===1){
    c=ri(3,9);   /* c=2 היה נותן c² = 2c, ושני מסיחים זהים */
    /* max/min של x+y תחת x²+y²=c² → ±c√2 */
    var v=r2(c*Math.SQRT2);
    return {ask:_f("מהו הערך המרבי של x + y תחת האילוץ x² + y² = {0}?", num(c*c)),
      expr:"g(x,y) = x² + y² = "+num(c*c),
      ans:W(num(v)),
      wrong:[
        W(num(c),_("זהו רדיוס המעגל, ולא הערך המרבי של הסכום.")),
        W(num(2*c),_("זה היה נכון אילו הנקודה המרבית הייתה על הצירים. היא על האלכסון.")),
        W(num(c*c),_("זה ערך האילוץ עצמו, לא הפונקציה שממקסמים."))
      ],
      steps:[
        S(_("מציבים את התנאי של לגראנז׳"),_("הגרדיאנט של הפונקציה מקביל לגרדיאנט האילוץ."),
          "(1 , 1) = λ(2x , 2y)"),
        S(_("מסיקים סימטריה"),_("שתי המשוואות זהות, ולכן x שווה ל-y — זה כל מה שהתנאי אומר כאן."),"x = y"),
        S(_("מציבים באילוץ"),"","2x² = "+num(c*c)+" ⇒ x = "+frac(num(c),"√2")+"   ⇒   x + y = "+num(v))
      ],rule:"lagr",hint:_("∇f = λ∇g. הסימטריה של המשוואות היא בדרך כלל מה שפותר אותן.")};
  }
  if(L===2){
    a=pick([3,5,6]);   /* ערכים שבהם ארבעת הסכומים שונים זה מזה */
    /* מלבן בהיקף קבוע: שטח מרבי בריבוע */
    var per=4*a, side=a, area=a*a;
    return {ask:_f("למלבן היקף {0}. מהו השטח המרבי שלו?", num(per)),
      expr:"f(x,y) = xy   ,   g = 2x + 2y = "+num(per),
      ans:W(num(area)),
      wrong:[
        W(num(per*per/4),_("חילקתם את ההיקף בשתיים במקום בארבע. למלבן ארבע צלעות, לא שתיים.")),
        W(num(per),_("זה ההיקף עצמו, לא השטח.")),
        W(num(2*a*a),_("זה השטח אילו הצלעות היו a ו-2a. לגראנז׳ נותן כאן שוויון בין הצלעות."))
      ],
      steps:[
        S(_("תנאי לגראנז׳"),"","(y , x) = λ(2 , 2)"),
        S(_("מה זה אומר"),_("שתי המשוואות נותנות y = 2λ = x. הצלעות שוות, כלומר ריבוע."),"x = y"),
        S(_("מציבים באילוץ"),"","4x = "+num(per)+" ⇒ x = "+num(side)+"   ⇒   "+_("שטח")+" = "+num(area))
      ],rule:"lagr",hint:_("בהיקף נתון, השטח המרבי מתקבל תמיד בריבוע. לגראנז׳ מוכיח את זה בשתי שורות.")};
  }
  /* L3 — מרחק מנקודה לישר */
  var w0d,w1d,ltry=0;
  do{ a=ri(2,5);b=ri(2,5);c=ri(4,14);
      var dist=r2(c/Math.sqrt(a*a+b*b));
      w0d=r2(c/(a+b)); w1d=r2(c*c/(a*a+b*b));
  }while(ltry++<40&&(w0d===dist||w1d===dist||w0d===w1d||c===dist||c===w0d||c===w1d));
  return {ask:_("מהו המרחק המינימלי מהראשית אל הישר?"),
    expr:num(a)+"x + "+num(b)+"y = "+num(c),
    ans:W(num(dist)),
    wrong:[
      W(num(w0d),_("חיברתם את המקדמים במקום לקחת את שורש סכום הריבועים.")),
      W(num(w1d),_("שכחתם להוציא שורש. המרחק הוא c חלקי נורמת וקטור המקדמים.")),
      W(num(c),_("זה האגף הימני של הישר, לא מרחק."))
    ],
    steps:[
      S(_("ממזערים ריבוע מרחק"),_("ממזערים x²+y² ולא את השורש — אותה נקודה, חשבון פשוט בהרבה."),
        "f = x² + y²   ,   g = "+num(a)+"x + "+num(b)+"y = "+num(c)),
      S(_("תנאי לגראנז׳"),_("הנקודה הקרובה ביותר נמצאת על הישר שמאונך לישר הנתון ועובר בראשית."),
        "(2x , 2y) = λ("+num(a)+" , "+num(b)+")   ⇒   (x , y) ∥ ("+num(a)+" , "+num(b)+")"),
      S(_("מציבים ומקבלים את הנוסחה"),"","d = "+frac("|"+num(c)+"|","√("+num(a*a)+" + "+num(b*b)+")")+" = "+num(dist))
    ],rule:"lagr",hint:_("המרחק מהראשית לישר ax+by=c הוא c בערך מוחלט חלקי שורש a²+b².")};
}

/* ---------- 7. אינטגרל כפול ---------- */
function genDouble(L){
  /* רמה 4 — לא נאמר איך לחשב. שלוש דרכים אפשריות, ובכל הגרלה
     בדיוק אחת מהן עובדת: החלפת סדר, מעבר לקוטביות, או חישוב ישיר. */
  if(L===4){
    var dc=pick(["swap","polar","direct"]),da=ri(1,3),db=ri(1,3);
    var oD1=_("מחליפים את סדר האינטגרציה — כפי שנכתב אין לאינטגרל הפנימי פונקציה קדומה אלמנטרית, ואחרי ההחלפה יש");
    var oD2=_("עוברים לקואורדינטות קוטביות — התחום עיגול והאינטגרנד תלוי רק ב-x² + y²");
    var oD3=_("מחשבים ישירות: קודם האינטגרל הפנימי ואז החיצוני");
    var oD4=_("אי אפשר לחשב — לאינטגרנד אין פונקציה קדומה אלמנטרית");
    var exD,corrD,whD;
    if(dc==="swap"){
      exD="∫<sub>0</sub><sup>"+num(da)+"</sup> ∫<sub>y</sub><sup>"+num(da)+"</sup> e<sup>x²</sup> dx dy";
      corrD=oD1;
      whD=_("התחום הוא המשולש 0 ≤ y ≤ x ≤ a. אחרי החלפת הסדר האינטגרל הפנימי הוא לפי y, ו-e בחזקת x² יוצא ממנו כקבוע — ואז נשאר x·e בחזקת x², שיש לו פונקציה קדומה.");
    }else if(dc==="polar"){
      exD="∫∫<sub>D</sub> e<sup>−(x² + y²)</sup> dA   ,   D: x² + y² ≤ "+num(da*da);
      corrD=oD2;
      whD=_("בקרטזיות האינטגרל הפנימי הוא של e בחזקת מינוס y² ואין לו פונקציה קדומה אלמנטרית — וגם החלפת סדר לא תעזור, כי המצב סימטרי בין x ל-y. בקוטביות האינטגרנד הופך ל-e בחזקת מינוס r² כפול r, ואת זה מחשבים בהצבה.");
    }else{
      exD="∫<sub>0</sub><sup>"+num(da)+"</sup> ∫<sub>0</sub><sup>"+num(db)+"</sup> xy² dy dx";
      corrD=oD3;
      whD=_("התחום מלבן והאינטגרנד פולינום. אין שום מכשול: מאנטגרלים לפי y, מציבים גבולות, ואז מאנטגרלים לפי x.");
    }
    var whyD=function(v){
      if(v===oD4)return _("לאינטגרל הזה בהחלט יש ערך. הכלי המתאים משנה את הצורה עד שהאינטגרנד נעשה פשוט.");
      if(v===oD1)return dc==="direct"
        ?_("החלפת סדר מותרת כאן, אבל היא מיותרת — לאינטגרנד יש פונקציה קדומה אלמנטרית כפי שהוא, והנימוק שכתוב כאן פשוט אינו נכון.")
        :whD;
      if(v===oD2)return dc==="polar"?whD:_("התחום כאן אינו עיגול או חלק ממנו, ולכן מעבר לקוטביות רק יסבך את הגבולות.");
      return dc==="direct"?whD:_("כפי שנכתב, לאינטגרל הפנימי אין פונקציה קדומה אלמנטרית — ולכן חישוב ישיר נתקע כבר בשלב הראשון.");
    };
    return {ask:_("איך נכון לחשב את האינטגרל הכפול הזה, ולמה?"),
      expr:exD,
      ans:W(corrD),
      wrong:[oD1,oD2,oD3,oD4].filter(function(v){return v!==corrD})
        .map(function(v){return W(v,whyD(v))}),
      steps:[
        S(_("קודם מסתכלים על האינטגרנד"),_("השאלה הראשונה אינה מה הגבולות, אלא האם לאינטגרל הפנימי יש בכלל פונקציה קדומה אלמנטרית."),""),
        S(_("ואז על התחום"),_("תחום עגול ואינטגרנד שתלוי ב-x² + y² מצביעים על קוטביות. תחום משולש עם אינטגרנד שנתקע מצביע על החלפת סדר."),""),
        S(_("הדרך שעובדת כאן"),whD,""),
        S(_("מסקנה"),"",corrD)
      ],rule:dc==="polar"?"polar":"dblint",
      hint:_("קודם בודקים אם האינטגרל הפנימי בר־חישוב. אם לא — משנים סדר או מערכת צירים, ולא מוותרים.")};
  }
  var a,b,c;
  if(L===1){
    var dtry=0;
    do{ a=ri(1,4);b=ri(1,4);c=ri(1,5); }
    while(dtry++<40&&(new Set([a*b*c,a*b,a+b,c*(a+b)]).size<4));
    /* ∫∫ c dA על מלבן */
    return {ask:_("חשבו את האינטגרל הכפול"),
      expr:"∫<sub>0</sub><sup>"+num(a)+"</sup> ∫<sub>0</sub><sup>"+num(b)+"</sup> "+num(c)+" dy dx",
      ans:W(num(a*b*c)),
      wrong:[
        W(num(a*b),_("שכחתם את הקבוע. אינטגרל של קבוע הוא הקבוע כפול השטח.")),
        W(num(a+b),_("חיברתם את הגבולות. אינטגרל כפול על מלבן מכפיל אורך ברוחב.")),
        W(num(c*(a+b)),_("הכפלתם בסכום הצלעות במקום בשטח."))
      ],
      steps:[
        S(_("האינטגרל הפנימי"),_("גוזרים ומאנטגרלים לפי y, ו-x קבוע."),"∫<sub>0</sub><sup>"+num(b)+"</sup> "+num(c)+" dy = "+num(b*c)),
        S(_("האינטגרל החיצוני"),"","∫<sub>0</sub><sup>"+num(a)+"</sup> "+num(b*c)+" dx = "+num(a*b*c)),
        S(_("בדיקה גיאומטרית"),_("זה גובה קבוע כפול שטח הבסיס — נפח תיבה."),
          num(c)+" · "+num(a)+" · "+num(b)+" = "+num(a*b*c))
      ],rule:"dblint",hint:_("מחשבים קודם את האינטגרל הפנימי, והחיצוני רואה את התוצאה כפונקציה של x בלבד.")};
  }
  if(L===2){
    var v,d2try=0;
    do{ a=ri(1,3);b=ri(1,3); v=fr(a*a*b*b,4); }
    while(d2try++<40&&(new Set([v.html(),fr(a*a*b*b,2).html(),num(a*b),fr(a*a*b,4).html()]).size<4));
    /* ∫0^a ∫0^b xy dy dx = a²b²/4 */
    return {ask:_("חשבו את האינטגרל הכפול"),
      expr:"∫<sub>0</sub><sup>"+num(a)+"</sup> ∫<sub>0</sub><sup>"+num(b)+"</sup> xy dy dx",
      ans:W(v.html()),
      wrong:[
        W(fr(a*a*b*b,2).html(),_("חילקתם ב-2 פעם אחת בלבד. כל אינטגרציה של משתנה מוסיפה חלוקה ב-2.")),
        W(num(a*b),_("לא ביצעתם אינטגרציה — זו רק מכפלת הגבולות.")),
        W(fr(a*a*b,4).html(),_("איבדתם חזקה באחד המשתנים."))
      ],
      steps:[
        S(_("האינטגרל הפנימי"),_("x יוצא כקבוע החוצה."),
          "x·"+frac("y²","2")+" |<sub>0</sub><sup>"+num(b)+"</sup> = "+frac(num(b*b),"2")+"x"),
        S(_("האינטגרל החיצוני"),"",frac(num(b*b),"2")+"·"+frac("x²","2")+" |<sub>0</sub><sup>"+num(a)+"</sup>"),
        S(_("מפשטים"),"",v.html())
      ],rule:"dblint",hint:_("בכל אינטגרציה החזקה עולה באחת ומחלקים בה — פעמיים, אחת לכל משתנה.")};
  }
  /* L3 — קואורדינטות קוטביות */
  /* ברדיוס 1 מתלכדים π·1 ו-π·1², וברדיוס 2 מתלכדים 2π·2 ו-π·4 —
     בשני המקרים מסיח שהוא תשובה נכונה שנייה. שלושה רדיוסים, כמו קודם. */
  a=ri(3,5);
  return {ask:_f("חשבו את שטח העיגול ברדיוס {0} באמצעות אינטגרל כפול בקוטביות.", num(a)),
    expr:"∫<sub>0</sub><sup>2π</sup> ∫<sub>0</sub><sup>"+num(a)+"</sup> r dr dθ",
    ans:W("π·"+num(a*a)),
    wrong:[
      W("2π·"+num(a),_("שכחתם את ה-r שביעקוביאן. בלעדיו מקבלים היקף ולא שטח.")),
      W("π·"+num(a),_("לא העליתם את הרדיוס בריבוע. אינטגרל של r נותן r² חלקי 2.")),
      W("2π·"+num(a*a),_("שכחתם לחלק ב-2 באינטגרל הפנימי."))
    ],
    steps:[
      S(_("היעקוביאן"),_("במעבר לקוטביות dA אינו dr dθ אלא r dr dθ. ה-r הזה הוא הטעות הנפוצה ביותר כאן."),
        "dA = r dr dθ"),
      S(_("האינטגרל הפנימי"),"","∫<sub>0</sub><sup>"+num(a)+"</sup> r dr = "+frac(num(a*a),"2")),
      S(_("האינטגרל החיצוני"),"","∫<sub>0</sub><sup>2π</sup> "+frac(num(a*a),"2")+" dθ = π·"+num(a*a))
    ],rule:"polar",hint:_("במעבר לקוטביות אסור לשכוח את ה-r: dA = r dr dθ.")};
}
