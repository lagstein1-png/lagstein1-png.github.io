  Q("a1-fair-test",{"he": "תלמיד רוצה לבדוק איך סוג המשטח משפיע על החיכוך. איזה ניסוי יתן תשובה טובה?", "ar": "يريد طالب أن يفحص كيف يؤثر نوع السطح على الاحتكاك. أي تجربة تعطي إجابة جيدة؟", "ru": "Ученик хочет проверить, как тип поверхности влияет на трение. Какой опыт даст хороший ответ?", "en": "A student wants to test how the surface type affects friction. Which experiment gives a good answer?"},[{"he": "לגרור קוביית עץ על שיש וקוביית פלסטיק על שטיח, ולמדוד את כוח הגרירה בכל מקרה.", "ar": "سحب مكعب خشبي على رخام ومكعب بلاستيكي على سجادة، وقياس قوة السحب في كل حالة.", "ru": "Тянуть деревянный кубик по мрамору и пластиковый по ковру, измеряя силу тяги в каждом случае.", "en": "Drag a wooden cube on marble and a plastic cube on carpet, measuring the pull force in each case."},{"he": "לגרור קובייה אחת על שטיח ביום שמש ועל שיש ביום גשום.", "ar": "سحب مكعب واحد على سجادة في يوم مشمس وعلى رخام في يوم ممطر.", "ru": "Тянуть один кубик по ковру в солнечный день и по мрамору в дождливый.", "en": "Drag one cube on carpet on a sunny day and on marble on a rainy day."},{"he": "לגרור קובייה כבדה על שיש וקובייה קלה על שטיח, ולהשוות את הכוחות.", "ar": "سحب مكعب ثقيل على رخام ومكعب خفيف على سجادة، ومقارنة القوى.", "ru": "Тянуть тяжёлый кубик по мрамору и лёгкий по ковру, сравнивая силы.", "en": "Drag a heavy cube on marble and a light cube on carpet, comparing the forces."},{"he": "לגרור את אותה קובייה באותה מהירות, פעם על שיש ופעם על שטיח, ולמדוד את הכוח.", "ar": "سحب المكعب نفسه بالسرعة نفسها، مرة على رخام ومرة على سجادة، وقياس القوة.", "ru": "Тянуть тот же кубик с той же скоростью сначала по мрамору, потом по ковру, измеряя силу.", "en": "Drag the same cube at the same speed, once on marble and once on carpet, measuring the force."}],3,{"he": "בניסוי הוגן משנים רק דבר אחד בכל פעם.", "ar": "في التجربة العادلة نغيّر شيئًا واحدًا فقط كل مرة.", "ru": "В честном опыте меняют только одну вещь за раз.", "en": "In a fair experiment you change only one thing at a time."},{"he": "כדי לבודד את השפעת המשטח, כל שאר התנאים נשארים זהים: אותה קובייה, אותה מהירות, אותו מד כוח. רק סוג המשטח משתנה. למשל בוחני צמיגים מנסים אותם על אותה מכונית ומחליפים רק את פני הכביש.", "ar": "لعزل تأثير السطح، تبقى كل الشروط الأخرى كما هي: نفس المكعب، نفس السرعة، نفس مقياس القوة. فقط نوع السطح يتغير. مثال: مختبرو الإطارات يجربونها على نفس السيارة ويغيّرون سطح الطريق فقط.", "ru": "Чтобы выделить влияние поверхности, все прочие условия остаются теми же: тот же кубик, та же скорость, тот же динамометр. Меняется только тип поверхности. Например, испытатели шин проверяют их на одной машине и меняют только покрытие дороги.", "en": "To isolate the surface's effect, every other condition stays the same: same cube, same speed, same force meter. Only the surface type changes. For example, tire testers try tires on the same car and change only the road surface."},null,[{"he": "כאן השתנו גם חומר הקובייה וגם המשטח, ואי אפשר לדעת מה גרם להבדל.", "ar": "هنا تغيّرت مادة المكعب والسطح معًا، فلا يمكن معرفة سبب الفرق.", "ru": "Здесь изменились и материал кубика, и поверхность, поэтому причину различия не определить.", "en": "Here both the cube's material and the surface changed, so the cause of any difference stays unknown."},{"he": "מזג האוויר מוסיף משתנה נוסף שמלבלבל את המדידה.", "ar": "الطقس يضيف متغيرًا آخر يشوّش القياس.", "ru": "Погода добавляет ещё одну переменную, которая искажает измерение.", "en": "The weather adds another variable that muddies the measurement."},{"he": "המסה משפיעה על החיכוך, ולכן ההשוואה אינה הוגנת.", "ar": "الكتلة تؤثر على الاحتكاك، لذلك المقارنة غير عادلة.", "ru": "Масса влияет на трение, поэтому сравнение нечестное.", "en": "Mass affects friction, so the comparison is not fair."},null]),
  Q("a1-helmet",{"he": "איזה ממצא הוא הראיה החזקה ביותר שקסדה מגנה על רוכבי אופניים?", "ar": "أي نتيجة هي أقوى دليل على أن الخوذة تحمي راكبي الدراجات؟", "ru": "Какой факт является самым сильным доказательством того, что шлем защищает велосипедистов?", "en": "Which finding is the strongest evidence that a helmet protects bike riders?"},[{"he": "חבר שלי החליק בלי קסדה ולא קרה לו כלום.", "ar": "صديق لي انزلق بدون خوذة ولم يصب بأذى.", "ru": "Мой друг поскользнулся без шлема, и ничего не случилось.", "en": "A friend of mine slipped without a helmet and nothing happened to him."},{"he": "סקר גדול: בקרב רוכבים שנפלו, חובשי קסדה נפצעו בראש פחות.", "ar": "مسح كبير: بين الراكبين الذين سقطوا، أصيب مرتدو الخوذة في الرأس أقل بكثير.", "ru": "Большой обзор: среди упавших велосипедистов те, кто был в шлеме, получали травмы головы гораздо реже.", "en": "A large survey: among riders who fell, helmet wearers had far fewer head injuries."},{"he": "הקסדות בחנויות נראות קשות ומוצקות.", "ar": "الخوذات في المتاجر تبدو صلبة وقوية.", "ru": "Шлемы в магазинах выглядят твёрдыми и прочными.", "en": "The helmets in stores look hard and sturdy."},{"he": "היצרן כותב על האריזה שהקסדה עברה את כל הבדיקות.", "ar": "الشركة المصنعة تكتب على العبوة أن الخوذة اجتازت كل الفحوص.", "ru": "Производитель пишет на упаковке, что шлем прошёл все проверки.", "en": "The manufacturer writes on the package that the helmet passed every test."}],1,{"he": "ראיה חזקה מסתמכת על הרבה מקרים ועל השוואה, לא על סיפור בודד.", "ar": "الدليل القوي يعتمد على حالات كثيرة ومقارنة، لا على قصة واحدة.", "ru": "Сильное доказательство опирается на много случаев и на сравнение, а не на одну историю.", "en": "Strong evidence rests on many cases and a comparison, not on a single story."},{"he": "מדע מסתמך על נתונים ממדגם גדול ועל השוואה בין קבוצות. אם בקרב נופלים חובשי הקסדה נפצעים פחות, יש קשר סביר בין קסדה להגנה. למשל גם תאונה בודדת של רוכב עם קסדה אינה מפריכה את המגמה הכללית.", "ar": "العلم يعتمد على بيانات من عينة كبيرة وعلى مقارنة بين مجموعتين. إذا كان الساقطون مرتدي الخوذة يُصابون أقل، فثمة علاقة معقولة بين الخوذة والحماية. مثال: حتى حادثة واحدة لراكب بخوذة لا تدحض الاتجاه العام.", "ru": "Наука опирается на данные большой выборки и сравнение групп. Если среди упавших те, кто в шлеме, травмируются реже, связь шлема с защитой правдоподобна. Например, даже одиночная авария с велосипедистом в шлеме не опровергает общую тенденцию.", "en": "Science relies on data from a large sample and on comparing groups. If among fallen riders the helmet wearers are injured less, a link between helmets and protection is plausible. For example, even a single crash of a helmeted rider does not disprove the general trend."},null,[{"he": "מקרה בודד אינו מייצג; החלקה אחרת עלולה הייתה להסתיים אחרת.", "ar": "حالة واحدة لا تمثل؛ انزلاقة أخرى قد تنتهي بشكل مختلف.", "ru": "Один случай не представляет картину; другое падение могло кончиться иначе.", "en": "A single case is not representative; another slip could have ended differently."},null,{"he": "מראה קשה אינו מבטיח הגנה; בודקים ביצועים במעבדה ונתוני פציעות.", "ar": "المظهر الصلب لا يضمن الحماية؛ نفحص الأداء في المختبر وبيانات الإصابات.", "ru": "Твёрдый вид не гарантирует защиту; проверяют работу в лаборатории и данные о травмах.", "en": "A hard look does not guarantee protection; performance is checked in labs and injury data."},{"he": "ליצרן אינטרס למכור; מחפשים בדיקות בלתי תלויות.", "ar": "للمصنّع مصلحة في البيع؛ نبحث عن فحوص مستقلة.", "ru": "У производителя есть интерес продать; ищут независимые проверки.", "en": "The manufacturer has an interest in selling; look for independent testing."}]),
  Q("fm-3-01",{"he": "דנה טוענת: ״גופים כבדים נופלים מהר יותר״. כהוכחה היא הפילה כדור כדורת ונוצה, והכדור הגיע ראשון. מה הבעיה בהוכחה?", "ar": "تقول دانا: «الأجسام الثقيلة تسقط أسرع». وكدليل أسقطت كرة بولينغ وريشة، فوصلت الكرة أولًا. ما المشكلة في الدليل؟", "ru": "Дана утверждает: «Тяжёлые тела падают быстрее». В доказательство она уронила шар для боулинга и перо, и шар упал первым. В чём проблема доказательства?", "en": "Dana claims: \"Heavy bodies fall faster.\" As proof she dropped a bowling ball and a feather, and the ball landed first. What is the problem with this proof?"},[{"he": "אין בעיה; הניסוי מוכיח את הטענה לגמרי.", "ar": "لا مشكلة؛ التجربة تُثبت الادّعاء تمامًا.", "ru": "Проблемы нет: опыт полностью доказывает утверждение.", "en": "There is no problem; the experiment fully proves the claim."}, {"he": "הנוצה מושפעת מהאוויר, כך שלא רק המשקל שונה.", "ar": "الريشة تتأثّر بالهواء، فالوزن ليس الفرق الوحيد.", "ru": "На перо влияет воздух, так что различается не только вес.", "en": "Air affects the feather, so weight is not the only difference."}, {"he": "היה צריך להפיל אותם מגובה נמוך יותר, כדי למדוד טוב.", "ar": "كان يجب إسقاطهما من ارتفاع أقلّ لقياس أدقّ.", "ru": "Нужно было ронять их с меньшей высоты, чтобы точнее измерить.", "en": "They should have been dropped from lower down, for a better measurement."}, {"he": "היה צריך לחזור על הניסוי עם הרבה נוצות נוספות.", "ar": "كان يجب تكرار التجربة بعدد أكبر من الريش.", "ru": "Нужно было повторить опыт с большим количеством перьев.", "en": "The experiment should have been repeated with many more feathers."}],1,{"he": "בדקו אם בניסוי השתנה רק דבר אחד.", "ar": "تحقّقوا هل تغيّر في التجربة أمر واحد فقط.", "ru": "Проверьте, менялось ли в опыте только что-то одно.", "en": "Check whether only one thing changed in the experiment."},{"he": "בניסוי הוגן משנים רק משתנה אחד. כאן השתנו גם המסה וגם הצורה, ולנוצה יש התנגדות אוויר גדולה מאוד ביחס למשקל שלה. למשל כדור כדורת וכדור ברזל קטן שנופלים יחד מגיעים לקרקע כמעט באותו זמן.", "ar": "في التجربة العادلة نغيّر متغيّرًا واحدًا فقط. هنا تغيّرت الكتلة والشكل معًا، وللريشة مقاومة هواء كبيرة جدًا مقارنة بوزنها. مثلًا كرة بولينغ وكرة حديد صغيرة تسقطان معًا وتصلان إلى الأرض في الوقت نفسه تقريبًا.", "ru": "В честном опыте меняют только одну переменную. Здесь изменились и масса, и форма, а у пера очень большое сопротивление воздуха по сравнению с его весом. Например, шар для боулинга и маленький железный шарик, упавшие вместе, достигают земли почти одновременно.", "en": "In a fair test you change only one variable. Here both mass and shape changed, and a feather has very large air resistance compared with its weight. For example, a bowling ball and a small iron ball dropped together reach the ground at almost the same time."},null,[{"he": "הניסוי לא הפריד בין משקל לבין צורה, ולכן הוא לא מוכיח.", "ar": "التجربة لم تفصل بين الوزن والشكل، لذلك لا تُثبت شيئًا.", "ru": "Опыт не разделил вес и форму, поэтому ничего не доказывает.", "en": "The experiment did not separate weight from shape, so it proves nothing."}, null, {"he": "גם מגובה נמוך האוויר ישפיע על הנוצה, והבעיה תישאר.", "ar": "حتى من ارتفاع منخفض يؤثّر الهواء في الريشة، وتبقى المشكلة.", "ru": "И с малой высоты воздух повлияет на перо, проблема останется.", "en": "Even from a low height air affects the feather, so the problem remains."}, {"he": "עוד נוצות יחזרו על אותה טעות, כי הצורה עדיין שונה.", "ar": "مزيد من الريش يكرّر الخطأ نفسه، لأن الشكل ما زال مختلفًا.", "ru": "Больше перьев повторят ту же ошибку: форма всё равно другая.", "en": "More feathers repeat the same flaw, because the shape is still different."}]),
  Q("fm-3-02",{"he": "תלמידה רוצה לבדוק אם הגובה של מדרון משפיע על המהירות של מכונית צעצוע בתחתיתו. מה עליה לשמור קבוע?", "ar": "طالبة تريد أن تفحص هل يؤثّر ارتفاع المنحدر في سرعة سيارة لعبة عند أسفله. ما الذي يجب أن تُبقيه ثابتًا؟", "ru": "Ученица хочет проверить, влияет ли высота горки на скорость игрушечной машинки внизу. Что ей нужно оставить неизменным?", "en": "A student wants to test whether a ramp's height affects a toy car's speed at the bottom. What should she keep the same?"},[{"he": "את המכונית, את משטח המדרון ואת אופן השחרור.", "ar": "السيارة وسطح المنحدر وطريقة الإفلات.", "ru": "Машинку, покрытие горки и способ запуска.", "en": "The car, the ramp's surface and the way it is released."}, {"he": "את הגובה, כי הוא המשתנה החשוב ביותר.", "ar": "الارتفاع، لأنه المتغيّر الأهمّ.", "ru": "Высоту, потому что это самая важная переменная.", "en": "The height, because it is the most important variable."}, {"he": "רק את המכונית; המשטח לא משנה למהירות.", "ar": "السيارة فقط؛ السطح لا يؤثّر في السرعة.", "ru": "Только машинку: покрытие не влияет на скорость.", "en": "Only the car; the surface does not affect the speed."}, {"he": "את המהירות בתחתית, כדי שההשוואה תהיה הוגנת.", "ar": "السرعة عند الأسفل، لتكون المقارنة عادلة.", "ru": "Скорость внизу, чтобы сравнение было честным.", "en": "The speed at the bottom, so the comparison is fair."}],0,{"he": "הבחינו בין מה שמשנים בכוונה, מה שמודדים, ומה שנשאר כמו שהוא.", "ar": "ميّزوا بين ما نغيّره عمدًا وما نقيسه وما يبقى كما هو.", "ru": "Различайте, что меняют специально, что измеряют и что оставляют как есть.", "en": "Tell apart what you change on purpose, what you measure, and what stays as it is."},{"he": "הגובה הוא המשתנה שמשנים, והמהירות היא מה שמודדים. כל השאר צריך להישאר זהה, אחרת לא נדע מה גרם לשינוי. למשל אם מחליפים גם את המכונית, ייתכן שהגלגלים שלה הם הסיבה.", "ar": "الارتفاع هو المتغيّر الذي نغيّره، والسرعة هي ما نقيسه. كل ما عدا ذلك يجب أن يبقى كما هو، وإلا فلن نعرف سبب التغيّر. مثلًا إذا غيّرنا السيارة أيضًا فقد تكون عجلاتها هي السبب.", "ru": "Высота — это то, что меняют, а скорость — то, что измеряют. Всё остальное должно оставаться одинаковым, иначе не понять, что вызвало изменение. Например, если сменить ещё и машинку, причиной могут оказаться её колёса.", "en": "Height is what you change, and speed is what you measure. Everything else must stay the same, or you cannot tell what caused the change. For example, if you also swap the car, its wheels might be the reason."},null,[null, {"he": "הגובה הוא מה שבודקים, ולכן דווקא אותו משנים בין הניסויים.", "ar": "الارتفاع هو ما نختبره، لذلك هو تحديدًا ما نغيّره بين التجارب.", "ru": "Высоту как раз и проверяют, поэтому её меняют от опыта к опыту.", "en": "Height is what is being tested, so it is exactly what changes between trials."}, {"he": "משטח מחוספס מאט את המכונית, ולכן גם אותו שומרים קבוע.", "ar": "السطح الخشن يُبطئ السيارة، لذلك نُبقيه ثابتًا أيضًا.", "ru": "Шершавое покрытие тормозит машинку, поэтому его тоже не меняют.", "en": "A rough surface slows the car, so it must also be kept the same."}, {"he": "המהירות היא התוצאה שמודדים, ואי אפשר לקבוע אותה מראש.", "ar": "السرعة هي النتيجة التي نقيسها، ولا يمكن تثبيتها مسبقًا.", "ru": "Скорость — это измеряемый результат, её нельзя задать заранее.", "en": "Speed is the result being measured, and it cannot be fixed in advance."}]),
  Q("fm-3-03",{"he": "פרסומת: ״הצמיג שלנו מקצר בלימה ב-30%!״. איזה מידע הכי חשוב כדי לבדוק אם אפשר לסמוך על הטענה?", "ar": "إعلان: «إطارنا يقصّر الكبح بنسبة 30%!». ما المعلومة الأهمّ للتحقّق مما إذا كان يمكن الوثوق بالادّعاء؟", "ru": "Реклама: «Наша шина сокращает торможение на 30%!». Какая информация важнее всего, чтобы понять, можно ли этому верить?", "en": "An ad says: \"Our tire cuts braking by 30%!\" Which information matters most to check whether the claim can be trusted?"},[{"he": "כמה אנשים כבר קנו את הצמיג החדש.", "ar": "كم شخصًا اشترى الإطار الجديد.", "ru": "Сколько людей уже купили новую шину.", "en": "How many people have already bought the new tire."}, {"he": "אם ספורטאי מפורסם ממליץ על הצמיג.", "ar": "هل يوصي رياضي مشهور بالإطار.", "ru": "Рекомендует ли шину известный спортсмен.", "en": "Whether a famous athlete recommends the tire."}, {"he": "מה הצבע של הצמיג ואיך הוא נראה בחנות.", "ar": "ما لون الإطار وكيف يبدو في المتجر.", "ru": "Какого цвета шина и как она выглядит в магазине.", "en": "What color the tire is and how it looks in the shop."}, {"he": "מול איזה צמיג השוו, ומי ערך את הבדיקה.", "ar": "مقارنةً بأيّ إطار، ومن أجرى الفحص.", "ru": "С какой шиной сравнивали и кто проводил испытание.", "en": "Which tire it was compared with, and who ran the test."}],3,{"he": "חשבו מה הופך מספר בפרסומת למדידה שאפשר לבדוק.", "ar": "فكّروا ما الذي يجعل رقمًا في إعلان قياسًا يمكن فحصه.", "ru": "Подумайте, что делает число из рекламы проверяемым измерением.", "en": "Think about what turns a number in an ad into a measurement you can check."},{"he": "מספר כמו 30% חסר משמעות בלי בסיס השוואה: אולי השוו לצמיג ישן ושחוק. חשוב גם שגוף בלתי תלוי יבדוק, ובאותם תנאים. למשל ארגוני צרכנים בודקים כמה צמיגים על אותה מכונית ועל אותו כביש.", "ar": "رقم مثل 30% لا معنى له دون أساس للمقارنة: ربما قارنوا بإطار قديم مهترئ. ومن المهمّ أيضًا أن تفحص جهة مستقلّة، في الظروف نفسها. مثلًا تفحص جمعيات المستهلكين عدّة إطارات على السيارة نفسها والطريق نفسه.", "ru": "Число вроде 30% ничего не значит без базы для сравнения: возможно, сравнивали со старой изношенной шиной. Важно и то, чтобы проверяла независимая организация, в одинаковых условиях. Например, общества потребителей проверяют несколько шин на одной машине и одной дороге.", "en": "A number like 30% means nothing without a baseline: maybe they compared with an old worn tire. It also matters that an independent body tests it under the same conditions. For example, consumer groups test several tires on the same car and the same road."},null,[{"he": "מספר הקונים מראה פופולריות, ולא מודד את מרחק הבלימה.", "ar": "عدد المشترين يُظهر الشعبية ولا يقيس مسافة الكبح.", "ru": "Число покупателей говорит о популярности, а не о тормозном пути.", "en": "The number of buyers shows popularity; it does not measure braking distance."}, {"he": "המלצה של מפורסם אינה מדידה, ולעיתים קרובות משלמים עליה.", "ar": "توصية المشهور ليست قياسًا، وغالبًا ما تكون مدفوعة.", "ru": "Рекомендация знаменитости — не измерение, и за неё часто платят.", "en": "A celebrity endorsement is not a measurement, and it is often paid for."}, {"he": "צבע ומראה לא משפיעים על החיכוך עם הכביש.", "ar": "اللون والمظهر لا يؤثّران في الاحتكاك مع الطريق.", "ru": "Цвет и внешний вид не влияют на сцепление с дорогой.", "en": "Color and looks do not affect friction with the road."}, null]),
  Q("fm-3-04",{"he": "טענה: ״בתחנת החלל האסטרונאוטים מרחפים, כי שם אין כבידה בכלל״. איזו תגובה נכונה מדעית?", "ar": "ادّعاء: «في محطّة الفضاء يطفو الروّاد لأنه لا جاذبية هناك أبدًا». أيّ ردّ صحيح علميًا؟", "ru": "Утверждение: «На космической станции космонавты парят, потому что там совсем нет тяготения». Какой ответ научно верен?", "en": "Claim: \"On the space station astronauts float because there is no gravity there at all.\" Which reply is scientifically correct?"},[{"he": "הטענה נכונה, כי בחלל אין אוויר, ובלי אוויר אין כבידה.", "ar": "الادّعاء صحيح، لأنه لا هواء في الفضاء، ودون هواء لا جاذبية.", "ru": "Верно: в космосе нет воздуха, а без воздуха нет тяготения.", "en": "The claim is right: space has no air, and without air there is no gravity."}, {"he": "הטענה נכונה, כי התחנה רחוקה מאוד מכדור הארץ.", "ar": "الادّعاء صحيح، لأن المحطّة بعيدة جدًا عن الأرض.", "ru": "Верно: станция очень далеко от Земли.", "en": "The claim is right, because the station is very far from Earth."}, {"he": "יש שם כבידה, אבל התחנה והאסטרונאוטים נופלים יחד.", "ar": "توجد جاذبية، لكن المحطّة والروّاد يسقطون معًا.", "ru": "Тяготение там есть, но станция и экипаж падают вместе.", "en": "Gravity is there, but the station and crew fall together."}, {"he": "יש שם כבידה, אבל החליפות המיוחדות מבטלות אותה.", "ar": "توجد جاذبية، لكن البدلات الخاصّة تُلغيها.", "ru": "Тяготение есть, но специальные костюмы его отменяют.", "en": "Gravity is there, but the special suits cancel it."}],2,{"he": "מה היה קורה לתחנה, אם באמת שום דבר לא היה מושך אותה?", "ar": "ماذا كان سيحدث للمحطّة لو لم يجذبها شيء فعلًا؟", "ru": "Что стало бы со станцией, если бы её правда ничто не притягивало?", "en": "What would happen to the station if truly nothing pulled on it?"},{"he": "בגובה התחנה, כ-400 ק״מ, הכבידה כמעט חזקה כמו על הקרקע, והיא שומרת על התחנה במסלול. התחנה והאסטרונאוטים נופלים כל הזמן סביב כדור הארץ באותה תאוצה, ולכן הם מרחפים זה ביחס לזה. למשל ברגע הירידה החדה ברכבת הרים מרגישים ריחוף קצר.", "ar": "على ارتفاع المحطّة، نحو 400 كم، تكون الجاذبية قريبة من قوّتها على سطح الأرض، وهي تُبقي المحطّة في مدارها. المحطّة والروّاد يسقطون باستمرار حول الأرض بالتسارع نفسه، لذلك يطفون بعضهم بالنسبة إلى بعض. مثلًا في لحظة الهبوط الحادّ في قطار الملاهي نشعر بطفو قصير.", "ru": "На высоте станции, около 400 км, тяготение почти такое же, как у поверхности, и оно удерживает станцию на орбите. Станция и космонавты всё время падают вокруг Земли с одинаковым ускорением, поэтому парят относительно друг друга. Например, на крутом спуске американских горок ощущаешь короткую невесомость.", "en": "At the station's height, about 400 km, gravity is almost as strong as on the ground, and it keeps the station in orbit. The station and astronauts keep falling around Earth with the same acceleration, so they float relative to each other. For example, on a roller coaster's steep drop you feel a brief float."},null,[{"he": "כבידה לא נוצרת מאוויר; גם בריק גופים מושכים זה את זה.", "ar": "الجاذبية لا تنشأ من الهواء؛ الأجسام تتجاذب حتى في الفراغ.", "ru": "Тяготение не создаётся воздухом: тела притягиваются и в вакууме.", "en": "Gravity does not come from air; bodies attract each other even in a vacuum."}, {"he": "התחנה קרובה יחסית, והכבידה שם כמעט כמו על הקרקע.", "ar": "المحطّة قريبة نسبيًا، والجاذبية هناك قريبة من جاذبية سطح الأرض.", "ru": "Станция сравнительно близко, и тяготение там почти как у земли.", "en": "The station is fairly close, and gravity there is almost as on the ground."}, null, {"he": "חליפה לא יכולה לבטל כבידה, ובתוך התחנה רובם בבגדים רגילים.", "ar": "البدلة لا تُلغي الجاذبية، وداخل المحطّة يلبس معظمهم ملابس عادية.", "ru": "Костюм не отменяет тяготение, а внутри станции все в обычной одежде.", "en": "A suit cannot cancel gravity, and inside the station most wear ordinary clothes."}]),
  Q("fm-3-05",{"he": "תלמיד בדק מצנחים בשטח של 100, 200 ו-300 סמ״ר. ככל שהשטח גדל, זמן הנפילה התארך. איזו מסקנה מתאימה לנתונים?", "ar": "فحص طالب مظلّات مساحتها 100 و200 و300 سم مربع. كلما كبرت المساحة طال زمن السقوط. أيّ استنتاج يناسب المعطيات؟", "ru": "Ученик испытал парашюты площадью 100, 200 и 300 квадратных сантиметров. Чем больше площадь, тем дольше падение. Какой вывод соответствует данным?", "en": "A student tested parachutes with areas of 100, 200 and 300 square centimeters. The larger the area, the longer the fall took. Which conclusion fits the data?"},[{"he": "כל מצנח, בכל גודל, יאט את הנפילה עוד ועוד בלי גבול.", "ar": "أي مظلّة بأي حجم ستُبطئ السقوط أكثر فأكثر بلا حدّ.", "ru": "Любой парашют любого размера будет тормозить всё сильнее без предела.", "en": "Any parachute of any size will slow the fall more and more without limit."}, {"he": "בטווח שנבדק, שטח גדול יותר האריך את זמן הנפילה.", "ar": "في المدى المفحوص، المساحة الأكبر أطالت زمن السقوط.", "ru": "В проверенном диапазоне большая площадь удлиняла падение.", "en": "In the tested range, a larger area made the fall take longer."}, {"he": "זמן הנפילה לא קשור לשטח, וזה קרה במקרה.", "ar": "زمن السقوط لا علاقة له بالمساحة، وحدث هذا صدفةً.", "ru": "Время падения не связано с площадью, это случайность.", "en": "Fall time is unrelated to area; it happened by chance."}, {"he": "שטח גדול יותר מגדיל את כוח הכבידה על המצנח.", "ar": "المساحة الأكبر تزيد قوة الجاذبية على المظلّة.", "ru": "Большая площадь увеличивает силу тяжести на парашют.", "en": "A larger area increases the gravity on the parachute."}],1,{"he": "האם מותר להסיק על מצנחים שלא נבדקו בכלל?", "ar": "هل يجوز الاستنتاج عن مظلّات لم تُفحص أصلًا؟", "ru": "Можно ли делать выводы о парашютах, которые вовсе не проверяли?", "en": "Can you draw conclusions about parachutes that were never tested?"},{"he": "מסקנה טובה נשארת בגבולות הנתונים. שלוש מדידות מראות מגמה ברורה, אבל לא מוכיחות שהיא נמשכת בכל גודל. למשל תוצאה שנמדדה במצנחי צעצוע לא בהכרח נכונה למצנחי ענק.", "ar": "الاستنتاج الجيّد يبقى ضمن حدود المعطيات. ثلاثة قياسات تُظهر اتجاهًا واضحًا، لكنها لا تُثبت أنه يستمرّ في كل حجم. مثلًا نتيجة قيست على مظلّات ألعاب ليست بالضرورة صحيحة لمظلّات ضخمة.", "ru": "Хороший вывод остаётся в пределах данных. Три измерения показывают явную тенденцию, но не доказывают, что она верна для любого размера. Например, результат, полученный на игрушечных парашютах, не обязательно верен для огромных.", "en": "A good conclusion stays within the limits of the data. Three measurements show a clear trend, but do not prove it holds for every size. For example, a result measured with toy parachutes does not necessarily hold for giant ones."},null,[{"he": "שלושה גדלים לא מספיקים כדי לקבוע מה יקרה בכל גודל אפשרי.", "ar": "ثلاثة أحجام لا تكفي لتحديد ما يحدث في كل حجم ممكن.", "ru": "Трёх размеров мало, чтобы судить о любом возможном размере.", "en": "Three sizes are not enough to decide what happens at every possible size."}, null, {"he": "המגמה עקבית בכל שלוש המדידות, ולכן קשה לייחס אותה למקרה.", "ar": "الاتجاه ثابت في القياسات الثلاثة، لذلك يصعب نسبته إلى الصدفة.", "ru": "Тенденция одинакова во всех трёх измерениях, это вряд ли случайность.", "en": "The trend is consistent in all three measurements, so chance is unlikely."}, {"he": "השטח משנה את התנגדות האוויר, ולא את כוח הכבידה.", "ar": "المساحة تغيّر مقاومة الهواء، لا قوة الجاذبية.", "ru": "Площадь меняет сопротивление воздуха, а не силу тяжести.", "en": "Area changes air resistance, not the force of gravity."}]),
  Q("fm-3-06",{"he": "משפחה מתלבטת אם לקנות רכב שטח כבד מאוד. איזה טיעון נכון מבחינה פיזיקלית?", "ar": "عائلة تتردّد في شراء سيارة دفع رباعي ثقيلة جدًا. أيّ حجّة صحيحة من ناحية فيزيائية؟", "ru": "Семья раздумывает, покупать ли очень тяжёлый внедорожник. Какой довод верен с точки зрения физики?", "en": "A family is debating whether to buy a very heavy SUV. Which argument is physically correct?"},[{"he": "בהתנגשות עם רכב קל, נוסעי הרכב הקל ייפגעו יותר.", "ar": "عند الاصطدام بسيارة خفيفة، يتضرّر ركّاب السيارة الخفيفة أكثر.", "ru": "При столкновении с лёгкой машиной сильнее пострадают её пассажиры.", "en": "In a crash with a light car, the light car's passengers are hurt more."}, {"he": "רכב כבד עוצר מהר יותר, כי הוא נלחץ חזק לכביש.", "ar": "السيارة الثقيلة تتوقّف أسرع لأنها تنضغط بقوة على الطريق.", "ru": "Тяжёлая машина тормозит быстрее, ведь она сильнее прижата к дороге.", "en": "A heavy car stops faster, because it is pressed hard onto the road."}, {"he": "בהתנגשות, הרכב הקל מפעיל על הכבד כוח גדול יותר.", "ar": "عند الاصطدام تؤثّر السيارة الخفيفة في الثقيلة بقوة أكبر.", "ru": "При столкновении лёгкая машина действует на тяжёлую с большей силой.", "en": "In a crash, the light car exerts a bigger force on the heavy one."}, {"he": "מסה גדולה לא משפיעה על שום דבר בתאונה.", "ar": "الكتلة الكبيرة لا تؤثّر في أيّ شيء في الحادث.", "ru": "Большая масса ни на что не влияет при аварии.", "en": "A large mass has no effect at all in a crash."}],0,{"he": "בהתנגשות הכוחות שווים. מה בכל זאת שונה בין שני הרכבים?", "ar": "في التصادم القوى متساوية. فما الذي يختلف مع ذلك بين السيارتين؟", "ru": "При столкновении силы равны. Что же всё-таки различается у двух машин?", "en": "In a crash the forces are equal. What is still different between the two cars?"},{"he": "לפי החוק השלישי, שני הרכבים מקבלים כוח שווה. אבל לרכב הקל מסה קטנה, ולכן התאוצה שלו ושל נוסעיו גדולה יותר, והפגיעה קשה יותר. למשל עגלת קניות שנתקלת במשאית נזרקת, והמשאית כמעט לא זזה.", "ar": "حسب القانون الثالث، تتلقّى السيارتان قوة متساوية. لكن كتلة السيارة الخفيفة صغيرة، لذلك يكون تسارعها وتسارع ركّابها أكبر والإصابة أشدّ. مثلًا عربة تسوّق تصطدم بشاحنة تُقذف بعيدًا، والشاحنة لا تكاد تتحرّك.", "ru": "По третьему закону обе машины получают равную силу. Но у лёгкой машины масса меньше, поэтому её ускорение и ускорение пассажиров больше, а травмы тяжелее. Например, магазинная тележка, налетевшая на грузовик, отлетает, а грузовик почти не двигается.", "en": "By the third law, both cars receive an equal force. But the light car has less mass, so it and its passengers accelerate more and the injuries are worse. For example, a shopping cart that hits a truck bounces away, while the truck barely moves."},null,[null, {"he": "לרכב כבד יש גם יותר התמדה, ולכן הבלימה שלו לא קצרה יותר.", "ar": "للسيارة الثقيلة قصور ذاتي أكبر أيضًا، لذلك كبحها ليس أقصر.", "ru": "У тяжёлой машины больше инерция, поэтому её тормозной путь не короче.", "en": "A heavy car also has more inertia, so its braking is not shorter."}, {"he": "לפי החוק השלישי, הכוחות בהתנגשות שווים בגודלם.", "ar": "حسب القانون الثالث، القوى في التصادم متساوية في المقدار.", "ru": "По третьему закону силы при столкновении равны по величине.", "en": "By the third law, the forces in a collision are equal in size."}, {"he": "המסה קובעת כמה הרכב משנה מהירות בהתנגשות, ולכן היא חשובה מאוד.", "ar": "الكتلة تحدّد مقدار تغيّر سرعة السيارة في التصادم، فهي مهمّة جدًا.", "ru": "Масса определяет, насколько изменится скорость машины, так что она очень важна.", "en": "Mass decides how much a car's speed changes in a crash, so it matters a lot."}]),
  Q("fm-3-07",{"he": "נהג אומר: ״יש לי כרית אוויר, אז אני לא צריך חגורת בטיחות״. מה הבעיה בטענה?", "ar": "يقول سائق: «لديّ وسادة هوائية، فلا أحتاج إلى حزام الأمان». ما المشكلة في هذا الادّعاء؟", "ru": "Водитель говорит: «У меня есть подушка безопасности, так что ремень мне не нужен». В чём ошибка?", "en": "A driver says: \"I have an airbag, so I don't need a seat belt.\" What is wrong with this claim?"},[{"he": "אין בעיה; כרית אוויר מגינה בכל סוג של תאונה.", "ar": "لا مشكلة؛ الوسادة الهوائية تحمي في كل أنواع الحوادث.", "ru": "Ошибки нет: подушка защищает при любой аварии.", "en": "Nothing; an airbag protects in every type of crash."}, {"he": "החגורה מיותרת, אבל רק בנסיעות קצרות בעיר.", "ar": "الحزام غير ضروري، لكن فقط في الرحلات القصيرة في المدينة.", "ru": "Ремень лишний, но только в коротких поездках по городу.", "en": "The belt is unneeded, but only on short city trips."}, {"he": "כרית האוויר מסוכנת, ולכן עדיף לנטרל אותה.", "ar": "الوسادة الهوائية خطيرة، لذلك الأفضل تعطيلها.", "ru": "Подушка опасна, поэтому лучше её отключить.", "en": "The airbag is dangerous, so it is better to disable it."}, {"he": "הכרית בנויה לעבוד יחד עם החגורה, ולא במקומה.", "ar": "الوسادة مصمَّمة لتعمل مع الحزام لا بدلًا منه.", "ru": "Подушка рассчитана работать вместе с ремнём, а не вместо него.", "en": "The airbag is designed to work with the belt, not instead of it."}],3,{"he": "חשבו על תאונה מהצד, או על רכב שמתהפך.", "ar": "فكّروا في حادث من الجانب أو في سيارة تنقلب.", "ru": "Подумайте о боковом ударе или опрокидывании машины.", "en": "Think about a side crash or a car rolling over."},{"he": "החגורה מחזיקה את הגוף במקום ומעבירה את הכוח לחלקים החזקים שלו. בלי חגורה הגוף ממשיך קדימה בגלל ההתמדה, יכול לפגוע בכרית בזמן שהיא מתנפחת, ובהתהפכות אף להיזרק מהרכב. למשל גם ברכב עם 8 כריות אוויר החוק מחייב לחגור.", "ar": "الحزام يُثبّت الجسم في مكانه وينقل القوة إلى أجزائه القوية. دون حزام يواصل الجسم إلى الأمام بسبب القصور الذاتي، وقد يصطدم بالوسادة وهي تنتفخ، وقد يُقذف من السيارة عند الانقلاب. مثلًا حتى في سيارة فيها 8 وسائد هوائية يُلزم القانون بربط الحزام.", "ru": "Ремень удерживает тело на месте и передаёт силу на его крепкие части. Без ремня тело по инерции летит вперёд, может удариться о раскрывающуюся подушку, а при опрокидывании — вылететь из машины. Например, даже в машине с 8 подушками закон требует пристёгиваться.", "en": "The belt holds the body in place and passes the force to its strong parts. Without a belt, inertia carries the body forward; it can hit the airbag while it inflates, and in a rollover it can be thrown out. For example, even in a car with 8 airbags the law requires buckling up."},null,[{"he": "כרית מלפנים לא עוזרת בהתהפכות או בפגיעה מהצד, ושם החגורה חיונית.", "ar": "الوسادة الأمامية لا تساعد في الانقلاب أو الصدمة الجانبية، وهناك الحزام ضروري.", "ru": "Передняя подушка не помогает при опрокидывании или боковом ударе, там важен ремень.", "en": "A front airbag does not help in a rollover or side impact, where the belt is vital."}, {"he": "גם במהירות של עיר, 50 קמ״ש, הגוף נזרק בכוח גדול מאוד.", "ar": "حتى بسرعة المدينة، 50 كم/س، يُقذف الجسم بقوة كبيرة جدًا.", "ru": "Даже на городской скорости 50 км/ч тело бросает с огромной силой.", "en": "Even at a city speed of 50 km/h, the body is thrown with a huge force."}, {"he": "הכרית מצילה חיים כשחוגרים חגורה, ואין סיבה לנטרל אותה.", "ar": "الوسادة تنقذ الأرواح عند ربط الحزام، ولا سبب لتعطيلها.", "ru": "Подушка спасает жизни, когда ремень пристёгнут, и отключать её незачем.", "en": "The airbag saves lives when the belt is worn, and there is no reason to disable it."}, null]),
  Q("fm-3-08",{"he": "תלמידים מדדו 5 פעמים את זמן הנפילה של כדור מאותו גובה: 0.62, 0.60, 0.61, 0.95, 0.62 שניות. מה הכי נכון לעשות עם 0.95?", "ar": "قاس طلاب 5 مرات زمن سقوط كرة من الارتفاع نفسه: 0.62، 0.60، 0.61، 0.95، 0.62 ثانية. ما الأصحّ فعله مع 0.95؟", "ru": "Ученики 5 раз измерили время падения мяча с одной высоты: 0,62; 0,60; 0,61; 0,95; 0,62 с. Как правильнее всего поступить с 0,95?", "en": "Students measured a ball's fall time from the same height 5 times: 0.62, 0.60, 0.61, 0.95, 0.62 seconds. What is best to do with 0.95?"},[{"he": "לכלול אותו בממוצע כרגיל, כי כל מדידה שווה.", "ar": "إدخالها في المتوسّط كالمعتاد، لأن كل القياسات متساوية القيمة.", "ru": "Включить в среднее как обычно: все измерения равноценны.", "en": "Include it in the average as usual, since every measurement counts equally."}, {"he": "למחוק אותו בשקט, ולא לדווח עליו בכלל.", "ar": "حذفها بصمت وعدم ذكرها أبدًا.", "ru": "Тихо удалить его и вообще не упоминать.", "en": "Quietly delete it and never report it."}, {"he": "לבדוק אם הייתה טעות, לחזור על המדידה ולדווח.", "ar": "فحص هل حدث خطأ، وتكرار القياس، والإبلاغ عنه.", "ru": "Проверить, не было ли ошибки, повторить замер и сообщить.", "en": "Check for an error, repeat the measurement and report it."}, {"he": "להחליט שהזמן האמיתי הוא 0.95, כי הוא שונה.", "ar": "تقرير أن الزمن الحقيقي هو 0.95 لأنه مختلف.", "ru": "Решить, что истинное время — 0,95, раз оно отличается.", "en": "Decide the true time is 0.95, because it stands out."}],2,{"he": "מדידה אחת רחוקה מאוד מהשאר. מה יכול היה לגרום לה?", "ar": "قياس واحد بعيد جدًا عن الباقي. ما الذي قد يسبّبه؟", "ru": "Одно измерение сильно отличается от остальных. Что могло его вызвать?", "en": "One measurement is far from the rest. What could have caused it?"},{"he": "ארבע מדידות קרובות זו לזו, ואחת חורגת, כנראה בגלל טעות כמו לחיצה מאוחרת על שעון העצר. נכון לבדוק, לחזור על המדידה ולדווח בגלוי מה עשינו. למשל בתחרות ריצה בודקים מחדש תוצאה חריגה, ולא מוחקים אותה בשקט.", "ar": "أربعة قياسات متقاربة وواحد يشذّ، والأرجح بسبب خطأ مثل الضغط المتأخّر على ساعة الإيقاف. الصحيح أن نفحص ونكرّر القياس ونذكر بوضوح ما فعلناه. مثلًا في سباق الجري تُراجَع النتيجة الشاذّة ولا تُحذف بصمت.", "ru": "Четыре измерения близки, а одно выбивается — скорее всего, из-за ошибки, например секундомер нажали поздно. Правильно проверить, повторить измерение и открыто сообщить, что сделано. Например, на соревнованиях по бегу странный результат перепроверяют, а не стирают втихую.", "en": "Four measurements are close and one stands out, probably due to an error such as pressing the stopwatch late. The right move is to check, repeat the measurement and openly report what was done. For example, in a running race an odd result is rechecked, not quietly erased."},null,[{"he": "מדידה שגויה תעוות את הממוצע, ולכן קודם בודקים אותה.", "ar": "القياس الخاطئ يُشوّه المتوسّط، لذلك نفحصه أولًا.", "ru": "Ошибочное измерение исказит среднее, поэтому его сначала проверяют.", "en": "A faulty measurement skews the average, so it is checked first."}, {"he": "הסתרת נתונים פוגעת באמינות, וצריך לדווח על כל שינוי.", "ar": "إخفاء البيانات يضرّ بالمصداقية، ويجب الإبلاغ عن كل تغيير.", "ru": "Скрывать данные — значит подрывать доверие, о любом изменении сообщают.", "en": "Hiding data hurts credibility, and every change must be reported."}, null, {"he": "ארבע מדידות עקביות סביב 0.61 אמינות יותר ממדידה חריגה אחת.", "ar": "أربعة قياسات متّسقة حول 0.61 أوثق من قياس شاذّ واحد.", "ru": "Четыре согласованных измерения около 0,61 надёжнее одного выброса.", "en": "Four consistent readings near 0.61 are more reliable than one odd reading."}]),
  Q("fm-3-09",{"he": "אם אומרת: ״בנסיעה קצרה אחזיק את התינוק בידיים״. בהתנגשות ב-50 קמ״ש, כדי לעצור תינוק של 10 ק״ג צריך כוח כמו להרים יותר מ-100 ק״ג. מה נובע מכך?", "ar": "أمّ تقول: «في رحلة قصيرة سأحمل الطفل بين ذراعيّ». في تصادم بسرعة 50 كم/س، يحتاج إيقاف طفل كتلته 10 كغ إلى قوة تعادل رفع أكثر من 100 كغ. ماذا ينتج عن ذلك؟", "ru": "Мама говорит: «В короткой поездке я подержу малыша на руках». При столкновении на 50 км/ч, чтобы остановить младенца массой 10 кг, нужна сила, как для подъёма более 100 кг. Что из этого следует?", "en": "A mother says: \"On a short trip I'll hold the baby in my arms.\" In a 50 km/h crash, stopping a 10 kg baby takes a force like lifting more than 100 kg. What follows from this?"},[{"he": "אם תחזיק חזק מספיק בשתי ידיים, התינוק יהיה מוגן.", "ar": "إذا أمسكته بقوة كافية بكلتا يديها فسيكون الطفل محميًا.", "ru": "Если держать достаточно крепко двумя руками, малыш будет защищён.", "en": "If she holds tight enough with both arms, the baby will be safe."}, {"he": "אי אפשר להחזיק כוח כזה, ולכן צריך מושב בטיחות.", "ar": "لا يمكن تحمّل قوة كهذه، لذلك يلزم مقعد أمان.", "ru": "Такую силу не удержать, поэтому нужно автокресло.", "en": "No one can hold such a force, so a child seat is needed."}, {"he": "בנסיעה קצרה אין סכנה אמיתית, ולכן הטענה שלה נכונה.", "ar": "في الرحلة القصيرة لا خطر حقيقي، لذلك ادّعاؤها صحيح.", "ru": "В короткой поездке настоящей опасности нет, значит, она права.", "en": "On a short trip there is no real danger, so her claim is right."}, {"he": "הסכנה קיימת רק כשהרכב שוקל יותר מ-100 ק״ג.", "ar": "الخطر قائم فقط عندما تزن السيارة أكثر من 100 كغ.", "ru": "Опасность есть, только если машина весит больше 100 кг.", "en": "The danger exists only when the car weighs more than 100 kg."}],1,{"he": "השוו את הכוח הדרוש למה שאדם מסוגל להחזיק בידיים.", "ar": "قارنوا القوة اللازمة بما يستطيع الإنسان أن يحمله بيديه.", "ru": "Сравните нужную силу с тем, что человек может удержать руками.", "en": "Compare the force needed with what a person can hold in their arms."},{"he": "בתאונה התינוק ממשיך קדימה בגלל ההתמדה, וכדי לעצור אותו ברגע צריך כוח עצום. אף אדם לא מחזיק משקל כזה בידיים בשבריר שנייה. למשל החוק מחייב מושב בטיחות לפעוטות גם בנסיעה של 5 דקות.", "ar": "في الحادث يواصل الطفل حركته إلى الأمام بسبب القصور الذاتي، وإيقافه في لحظة يحتاج إلى قوة هائلة. لا يستطيع أيّ إنسان أن يمسك وزنًا كهذا بيديه في جزء من الثانية. مثلًا يُلزم القانون بمقعد أمان للأطفال حتى في رحلة مدّتها 5 دقائق.", "ru": "В аварии малыш по инерции продолжает двигаться вперёд, и чтобы остановить его за миг, нужна огромная сила. Никто не удержит руками такой вес за долю секунды. Например, закон требует детское автокресло даже для поездки на 5 минут.", "en": "In a crash the baby keeps moving forward by inertia, and stopping it in an instant takes a huge force. No one can hold such a weight in their arms in a split second. For example, the law requires a child seat even for a 5-minute drive."},null,[{"he": "שום אדם לא מסוגל להחזיק כוח כזה בשבריר שנייה, גם אם ינסה.", "ar": "لا يستطيع أي إنسان تحمّل قوة كهذه في جزء من الثانية مهما حاول.", "ru": "Никто не способен удержать такую силу за долю секунды, как ни старайся.", "en": "No one can hold such a force in a split second, however hard they try."}, null, {"he": "הכוח תלוי במהירות ולא באורך הנסיעה, ו-50 קמ״ש מספיקים לפגיעה.", "ar": "القوة تتعلّق بالسرعة لا بطول الرحلة، و50 كم/س تكفي للإصابة.", "ru": "Сила зависит от скорости, а не от длины поездки, и 50 км/ч хватит для травмы.", "en": "The force depends on speed, not trip length, and 50 km/h is enough to cause injury."}, {"he": "המספר בשאלה מתאר את הכוח על התינוק, ולא את המשקל של הרכב.", "ar": "الرقم في السؤال يصف القوة على الطفل، لا وزن السيارة.", "ru": "Число в вопросе описывает силу на малыша, а не вес машины.", "en": "The number in the question describes the force on the baby, not the car's weight."}]),
  Q("fm-3-10",{"he": "סבא אומר: ״מכוניות ישנות היו בטוחות יותר, כי הן לא התקמטו בתאונה״. איך עונים לו לפי הפיזיקה?", "ar": "يقول الجدّ: «السيارات القديمة كانت أكثر أمانًا لأنها لم تكن تنطوي في الحوادث». كيف نردّ عليه حسب الفيزياء؟", "ru": "Дедушка говорит: «Старые машины были безопаснее, потому что не сминались при аварии». Как ответить ему с точки зрения физики?", "en": "Grandpa says: \"Old cars were safer, because they did not crumple in a crash.\" How do you answer him using physics?"},[{"he": "ההתקמטות מאריכה את העצירה, והכוח על הנוסעים קטן.", "ar": "الانطواء يطيل التوقّف، فتصغر القوة على الركّاب.", "ru": "Смятие удлиняет остановку, и сила на пассажиров меньше.", "en": "Crumpling lengthens the stop, so the force on passengers is smaller."}, {"he": "הוא צודק: רכב שלא נפגע מגן גם על הנוסעים שבתוכו.", "ar": "هو محقّ: السيارة التي لا تتضرّر تحمي ركّابها أيضًا.", "ru": "Он прав: целая машина защищает и пассажиров внутри.", "en": "He is right: a car that stays undamaged also protects its passengers."}, {"he": "ההתקמטות נועדה רק להוזיל את המחיר של המכונית.", "ar": "الانطواء هدفه فقط تخفيض سعر السيارة.", "ru": "Смятие нужно лишь для того, чтобы удешевить машину.", "en": "Crumpling is only meant to lower the car's price."}, {"he": "ההתקמטות מבטלת את ההתמדה של הנוסעים שבתוך הרכב.", "ar": "الانطواء يُلغي القصور الذاتي للركّاب داخل السيارة.", "ru": "Смятие отменяет инерцию пассажиров в машине.", "en": "Crumpling cancels the inertia of the passengers inside."}],0,{"he": "לאן הולכת אנרגיית התנועה כשהרכב לא מתקמט?", "ar": "إلى أين تذهب طاقة الحركة عندما لا تنطوي السيارة؟", "ru": "Куда уходит энергия движения, если машина не сминается?", "en": "Where does the motion energy go when the car does not crumple?"},{"he": "אזור הקמט בחזית הרכב מתעוות ובולע אנרגיה, והעצירה נמשכת יותר זמן. כך הכוח על הנוסעים קטן, ורכב קשיח היה מעביר את המכה ישר לגוף. למשל מי שמכופף ברכיים בנחיתה מקפיצה נפגע פחות.", "ar": "منطقة الانطواء في مقدّمة السيارة تتشوّه وتمتصّ الطاقة، فيستمرّ التوقّف وقتًا أطول. بذلك تصغر القوة على الركّاب، أمّا السيارة الصلبة فتنقل الصدمة مباشرة إلى الجسم. مثلًا من يثني ركبتيه عند الهبوط من قفزة يتأذّى أقلّ.", "ru": "Зона смятия спереди машины деформируется и поглощает энергию, и остановка длится дольше. Так сила на пассажиров меньше, а жёсткая машина передала бы удар прямо телу. Например, тот, кто сгибает колени при приземлении после прыжка, травмируется меньше.", "en": "The crumple zone at the front deforms and absorbs energy, so the stop lasts longer. This makes the force on passengers smaller, while a rigid car would pass the blow straight to the body. For example, someone who bends their knees when landing from a jump gets hurt less."},null,[null, {"he": "רכב שלא מתקמט נעצר בבת אחת, והמכה עוברת ישר לגוף הנוסעים.", "ar": "السيارة التي لا تنطوي تتوقّف دفعة واحدة، فتنتقل الصدمة مباشرة إلى أجساد الركّاب.", "ru": "Несминаемая машина останавливается мгновенно, и удар идёт прямо в тело.", "en": "A car that does not crumple stops at once, and the blow goes straight to the body."}, {"he": "אזור הקמט מתוכנן בכוונה לבטיחות, ונבדק במבחני ריסוק.", "ar": "منطقة الانطواء مصمَّمة عمدًا للسلامة، وتُفحص في اختبارات التصادم.", "ru": "Зону смятия специально проектируют для безопасности и проверяют в краш-тестах.", "en": "The crumple zone is deliberately designed for safety and checked in crash tests."}, {"he": "ההתמדה לא מתבטלת; ההתקמטות רק מאריכה את זמן העצירה.", "ar": "القصور الذاتي لا يُلغى؛ الانطواء يطيل زمن التوقّف فقط.", "ru": "Инерцию не отменить: смятие лишь удлиняет время остановки.", "en": "Inertia is not cancelled; crumpling only lengthens the stopping time."}]),
  Q("fm-3-11",{"he": "מוצע להעלות את המהירות המותרת מ-90 ל-110 קמ״ש. בנסיעה של 40 ק״מ זה חוסך בערך 5 דקות. איזה טיעון נגד ההצעה מבוסס על פיזיקה?", "ar": "يُقترح رفع السرعة المسموح بها من 90 إلى 110 كم/س. في رحلة طولها 40 كم يوفّر ذلك نحو 5 دقائق. أيّ حجّة ضدّ الاقتراح مبنية على الفيزياء؟", "ru": "Предлагают поднять разрешённую скорость с 90 до 110 км/ч. На поездке в 40 км это экономит около 5 минут. Какой довод против предложения основан на физике?", "en": "It is proposed to raise the speed limit from 90 to 110 km/h. On a 40 km drive this saves about 5 minutes. Which argument against the proposal is based on physics?"},[{"he": "במהירות גבוהה יותר הכבידה על הרכב גדלה.", "ar": "بسرعة أعلى تزداد الجاذبية على السيارة.", "ru": "При большей скорости сила тяжести на машину растёт.", "en": "At higher speed gravity on the car increases."}, {"he": "5 דקות הן חיסכון גדול, ולכן אין טיעון נגד.", "ar": "5 دقائق توفير كبير، لذلك لا حجّة ضدّ.", "ru": "5 минут — большая экономия, так что доводов против нет.", "en": "5 minutes is a big saving, so there is no argument against."}, {"he": "במהירות גבוהה הנהגים מרוכזים יותר, ולכן זה בטוח.", "ar": "بالسرعة العالية يكون السائقون أكثر تركيزًا، لذلك هذا آمن.", "ru": "На большой скорости водители внимательнее, значит, это безопасно.", "en": "At high speed drivers focus more, so it is safe."}, {"he": "אנרגיית התנועה עולה בכ-50%, וגם מרחק הבלימה.", "ar": "طاقة الحركة ترتفع بنحو 50%، وكذلك مسافة الكبح.", "ru": "Энергия движения растёт примерно на 50%, как и тормозной путь.", "en": "Motion energy rises by about 50%, and so does braking distance."}],3,{"he": "השוו בין מה שמרוויחים לבין מה שמשתנה בתאונה.", "ar": "قارنوا بين ما نكسبه وما يتغيّر في الحادث.", "ru": "Сравните выигрыш с тем, что меняется при аварии.", "en": "Compare what is gained with what changes in a crash."},{"he": "אנרגיית התנועה תלויה בריבוע המהירות: 110 בריבוע גדול בערך פי 1.5 מ-90 בריבוע. לכן מרחק הבלימה והאנרגיה שמשתחררת בתאונה גדלים בכחצי, תמורת 5 דקות. למשל פגיעה ב-110 קמ״ש דומה לנפילה מגובה של כ-48 מטר, וב-90 קמ״ש לנפילה מכ-32 מטר.", "ar": "طاقة الحركة تتعلّق بمربّع السرعة: مربّع 110 أكبر بنحو 1.5 مرة من مربّع 90. لذلك تزداد مسافة الكبح والطاقة المتحرّرة في الحادث بنحو النصف، مقابل 5 دقائق. مثلًا الاصطدام بسرعة 110 كم/س يشبه السقوط من ارتفاع نحو 48 مترًا، وبسرعة 90 كم/س من نحو 32 مترًا.", "ru": "Энергия движения зависит от квадрата скорости: 110 в квадрате примерно в 1,5 раза больше, чем 90 в квадрате. Поэтому тормозной путь и энергия, выделяющаяся при аварии, растут примерно наполовину — ради 5 минут. Например, удар на 110 км/ч похож на падение с высоты около 48 метров, а на 90 км/ч — около 32 метров.", "en": "Motion energy depends on the square of speed: 110 squared is about 1.5 times 90 squared. So braking distance and the energy released in a crash grow by about half, in exchange for 5 minutes. For example, a crash at 110 km/h is like falling from about 48 meters, and at 90 km/h from about 32 meters."},null,[{"he": "הכבידה לא תלויה במהירות של הרכב, והיא נשארת קבועה.", "ar": "الجاذبية لا تتعلّق بسرعة السيارة، وتبقى ثابتة.", "ru": "Сила тяжести не зависит от скорости машины и остаётся постоянной.", "en": "Gravity does not depend on the car's speed; it stays constant."}, {"he": "זה טיעון בעד ההצעה, והשאלה מבקשת טיעון פיזיקלי נגדה.", "ar": "هذه حجّة مع الاقتراح، والسؤال يطلب حجّة فيزيائية ضدّه.", "ru": "Это довод за предложение, а спрашивают физический довод против.", "en": "This argues for the proposal, while the question asks for a physics argument against it."}, {"he": "זו טענה על התנהגות שאינה מבוססת על פיזיקה, והיא בעד ההצעה.", "ar": "هذا ادّعاء عن السلوك لا يستند إلى الفيزياء، وهو مع الاقتراح.", "ru": "Это утверждение о поведении, не основанное на физике, и оно за предложение.", "en": "This is a claim about behavior, not physics, and it supports the proposal."}, null]),
  Q("fm-3-12",{"he": "מהנדסת מתכננת קסדה. אפשרות א׳: מעטפת קשה בלבד. אפשרות ב׳: מעטפת קשה ושכבת קצף שנמעכת במכה. למה ב׳ מגינה יותר על הראש?", "ar": "مهندسة تصمّم خوذة. الخيار أ: غلاف صلب فقط. الخيار ب: غلاف صلب وطبقة إسفنج تنضغط عند الضربة. لماذا يحمي الخيار ب الرأس أكثر؟", "ru": "Инженер проектирует шлем. Вариант А: только твёрдая оболочка. Вариант Б: твёрдая оболочка и слой пены, который сминается при ударе. Почему Б лучше защищает голову?", "en": "An engineer is designing a helmet. Option A: a hard shell only. Option B: a hard shell plus a foam layer that crushes on impact. Why does B protect the head better?"},[{"he": "הקצף מקטין את המסה של הראש בזמן המכה.", "ar": "الإسفنج يُنقص كتلة الرأس أثناء الضربة.", "ru": "Пена уменьшает массу головы во время удара.", "en": "The foam reduces the head's mass during the impact."}, {"he": "הקצף מונע מכוח הכבידה לפעול על הראש.", "ar": "الإسفنج يمنع الجاذبية من التأثير في الرأس.", "ru": "Пена не даёт силе тяжести действовать на голову.", "en": "The foam stops gravity from acting on the head."}, {"he": "הקצף נמעך ומאריך את זמן העצירה של הראש.", "ar": "الإسفنج ينضغط ويطيل زمن توقّف الرأس.", "ru": "Пена сминается и удлиняет время остановки головы.", "en": "The foam crushes and lengthens the head's stopping time."}, {"he": "הקצף מקפיץ את הראש בחזרה, וזה מבטל את המכה.", "ar": "الإسفنج يُرجع الرأس بارتداد، وهذا يُلغي الضربة.", "ru": "Пена отбрасывает голову назад, и это отменяет удар.", "en": "The foam bounces the head back, which cancels the blow."}],2,{"he": "חשבו מה קורה לקצף ולראש ברגע המכה עצמו.", "ar": "فكّروا ماذا يحدث للإسفنج وللرأس في لحظة الضربة نفسها.", "ru": "Подумайте, что происходит с пеной и головой в сам момент удара.", "en": "Think about what happens to the foam and the head at the moment of impact."},{"he": "המעטפת הקשה מפזרת את המכה על שטח גדול, אבל לבדה היא עוצרת את הראש מהר מדי. הקצף נמעך, בולע אנרגיה ומאריך את העצירה, ולכן הכוח על המוח קטן. למשל קסדה שספגה מכה חזקה מחליפים, כי הקצף שבתוכה כבר נמעך.", "ar": "الغلاف الصلب يوزّع الضربة على مساحة كبيرة، لكنه وحده يوقف الرأس بسرعة زائدة. الإسفنج ينضغط ويمتصّ الطاقة ويطيل التوقّف، فتصغر القوة على الدماغ. مثلًا تُستبدل الخوذة بعد ضربة قوية، لأن الإسفنج داخلها قد انضغط.", "ru": "Твёрдая оболочка распределяет удар по большой площади, но одна она останавливает голову слишком быстро. Пена сминается, поглощает энергию и удлиняет остановку, поэтому сила на мозг меньше. Например, шлем после сильного удара меняют, потому что пена внутри уже смята.", "en": "The hard shell spreads the blow over a large area, but alone it stops the head too quickly. The foam crushes, absorbs energy and lengthens the stop, so the force on the brain is smaller. For example, a helmet is replaced after a hard hit, because the foam inside is already crushed."},null,[{"he": "שום שכבה לא משנה את המסה של הראש; היא משנה את זמן העצירה.", "ar": "لا طبقة تغيّر كتلة الرأس؛ إنها تغيّر زمن التوقّف.", "ru": "Никакой слой не меняет массу головы, он меняет время остановки.", "en": "No layer changes the head's mass; it changes the stopping time."}, {"he": "הכבידה פועלת על הראש תמיד, והקצף לא יכול לחסום אותה.", "ar": "الجاذبية تؤثّر في الرأس دائمًا، ولا يستطيع الإسفنج حجبها.", "ru": "Тяготение действует на голову всегда, и пена его не блокирует.", "en": "Gravity always acts on the head, and foam cannot block it."}, null, {"he": "קפיצה חזרה מוסיפה שינוי מהירות, וקצף טוב דווקא נמעך ולא מקפיץ.", "ar": "الارتداد يضيف تغيّرًا في السرعة، والإسفنج الجيّد ينضغط ولا يرتدّ.", "ru": "Отскок добавляет изменение скорости, а хорошая пена сминается, а не пружинит.", "en": "Bouncing back adds change in speed, and good foam crushes rather than bounces."}]),
  Q("fm-3-13",{"he": "איזו מהשאלות הבאות אפשר לבדוק בניסוי מדעי?", "ar": "أيّ من الأسئلة الآتية يمكن فحصه بتجربة علمية؟", "ru": "Какой из этих вопросов можно проверить научным опытом?", "en": "Which of these questions can be checked with a scientific experiment?"},[{"he": "איזה צבע של מכונית הוא היפה ביותר מכולם?", "ar": "أيّ لون للسيارة هو الأجمل بين الجميع؟", "ru": "Какой цвет машины самый красивый из всех?", "en": "Which car color is the most beautiful of all?"}, {"he": "האם לחץ האוויר בצמיג משפיע על מרחק הבלימה?", "ar": "هل يؤثّر ضغط الهواء في الإطار على مسافة الكبح؟", "ru": "Влияет ли давление в шине на тормозной путь?", "en": "Does tire air pressure affect braking distance?"}, {"he": "האם נהגים צריכים לאהוב את המכונית שלהם?", "ar": "هل يجب أن يحبّ السائقون سياراتهم؟", "ru": "Должны ли водители любить свою машину?", "en": "Should drivers love their own car?"}, {"he": "האם ראוי לאסור נהיגה על בני 17?", "ar": "هل من الصواب منع القيادة لمن هم في سنّ 17؟", "ru": "Правильно ли запретить водить в 17 лет?", "en": "Is it right to ban driving at age 17?"}],1,{"he": "על שאלה מדעית עונים במדידה, ולא בדעה.", "ar": "السؤال العلمي يُجاب عنه بالقياس لا بالرأي.", "ru": "На научный вопрос отвечают измерением, а не мнением.", "en": "A scientific question is answered by measurement, not opinion."},{"he": "שאלה מדעית מציעה משהו שאפשר למדוד: כאן משנים לחץ בצמיג ומודדים מרחק בלימה. שאלות על טעם, רגש או ערכים חשובות, אבל ניסוי לא יכריע בהן. למשל אפשר למדוד איזה כדור קופץ הכי גבוה, אבל לא איזה כדור הכי יפה.", "ar": "السؤال العلمي يقترح شيئًا يمكن قياسه: هنا نغيّر ضغط الإطار ونقيس مسافة الكبح. أسئلة الذوق والمشاعر والقيم مهمّة، لكن التجربة لا تحسمها. مثلًا يمكن قياس أيّ كرة ترتدّ أعلى، لكن لا يمكن قياس أيّ كرة أجمل.", "ru": "Научный вопрос предлагает то, что можно измерить: здесь меняют давление в шине и измеряют тормозной путь. Вопросы вкуса, чувств и ценностей важны, но опыт их не решит. Например, можно измерить, какой мяч прыгает выше всех, но не какой мяч красивее.", "en": "A scientific question proposes something measurable: here you change tire pressure and measure braking distance. Questions of taste, feelings or values matter, but an experiment cannot settle them. For example, you can measure which ball bounces highest, but not which ball is prettiest."},null,[{"he": "יופי הוא עניין של טעם אישי, ואין מכשיר שמודד אותו.", "ar": "الجمال مسألة ذوق شخصي، ولا يوجد جهاز يقيسه.", "ru": "Красота — дело вкуса, и нет прибора, чтобы её измерить.", "en": "Beauty is a matter of personal taste, and no instrument measures it."}, null, {"he": "זו שאלה על רגשות וערכים, ולא על משהו שאפשר למדוד.", "ar": "هذا سؤال عن المشاعر والقيم، لا عن شيء يمكن قياسه.", "ru": "Это вопрос о чувствах и ценностях, а не об измеримом.", "en": "This is a question about feelings and values, not something measurable."}, {"he": "זו שאלה של ערכים וחוק, ונתונים לבדם לא מכריעים בה.", "ar": "هذا سؤال قيم وقانون، والبيانات وحدها لا تحسمه.", "ru": "Это вопрос ценностей и закона, одни данные его не решат.", "en": "This is a question of values and law, and data alone cannot settle it."}]),
  Q("fm-3-14",{"he": "יואב טוען: ״כדור שבעטו בו ממשיך להתגלגל, כי כוח הבעיטה נשאר בתוכו״. איזה הסבר נכון יותר?", "ar": "يقول يوآف: «الكرة التي رُكلت تواصل التدحرج لأن قوة الركلة تبقى داخلها». أيّ تفسير أصحّ؟", "ru": "Йоав утверждает: «Мяч после удара катится дальше, потому что сила удара остаётся внутри него». Какое объяснение вернее?", "en": "Yoav claims: \"A kicked ball keeps rolling because the force of the kick stays inside it.\" Which explanation is better?"},[{"he": "הכדור ממשיך בהתמדה, וחיכוך עוצר אותו לאט.", "ar": "الكرة تستمرّ بالقصور الذاتي، والاحتكاك يوقفها ببطء.", "ru": "Мяч катится по инерции, а трение медленно его тормозит.", "en": "The ball moves on by inertia, and friction slowly stops it."}, {"he": "יואב צודק, והכוח שבתוך הכדור הולך ונגמר.", "ar": "يوآف محقّ، والقوة داخل الكرة تنفد تدريجيًا.", "ru": "Йоав прав: сила внутри мяча постепенно кончается.", "en": "Yoav is right, and the force inside the ball slowly runs out."}, {"he": "הכבידה דוחפת את הכדור קדימה אחרי הבעיטה.", "ar": "الجاذبية تدفع الكرة إلى الأمام بعد الركلة.", "ru": "Тяготение толкает мяч вперёд после удара.", "en": "Gravity pushes the ball forward after the kick."}, {"he": "האוויר שמאחורי הכדור ממשיך לדחוף אותו.", "ar": "الهواء خلف الكرة يواصل دفعها.", "ru": "Воздух позади мяча продолжает его толкать.", "en": "The air behind the ball keeps pushing it."}],0,{"he": "חשבו על דסקית הוקי שמחליקה על קרח חלק.", "ar": "فكّروا في قرص الهوكي الذي ينزلق على جليد أملس.", "ru": "Вспомните шайбу, скользящую по гладкому льду.", "en": "Think about a hockey puck sliding on smooth ice."},{"he": "כוח לא נשמר בתוך גוף. לפי החוק הראשון, גוף ממשיך לנוע בלי דחיפה, עד שכוח כמו חיכוך מאט אותו. למשל בחלל גשושית ממשיכה לטוס שנים עם מנוע כבוי.", "ar": "القوة لا تُخزَّن داخل الجسم. حسب القانون الأول يواصل الجسم الحركة دون دفع، حتى تُبطئه قوة مثل الاحتكاك. مثلًا يواصل مسبار في الفضاء رحلته سنوات ومحرّكه مطفأ.", "ru": "Сила не хранится внутри тела. По первому закону тело продолжает двигаться без толчка, пока его не затормозит сила, например трение. Например, космический зонд годами летит с выключенным двигателем.", "en": "Force is not stored inside a body. By the first law, a body keeps moving without a push until a force such as friction slows it. For example, a space probe flies on for years with its engine off."},null,[null, {"he": "כוח אינו דבר שנאגר בגוף; הכדור מאט בגלל חיכוך.", "ar": "القوة ليست شيئًا يُخزَّن في الجسم؛ الكرة تتباطأ بسبب الاحتكاك.", "ru": "Сила не накапливается в теле; мяч тормозит из-за трения.", "en": "Force is not something stored in a body; the ball slows due to friction."}, {"he": "הכבידה מושכת את הכדור כלפי מטה, ולא דוחפת אותו קדימה.", "ar": "الجاذبية تسحب الكرة إلى أسفل ولا تدفعها إلى الأمام.", "ru": "Тяготение тянет мяч вниз, а не толкает вперёд.", "en": "Gravity pulls the ball down; it does not push it forward."}, {"he": "האוויר דווקא מתנגד לתנועה של הכדור ומאט אותו.", "ar": "الهواء يقاوم حركة الكرة ويُبطئها.", "ru": "Воздух, наоборот, сопротивляется движению мяча и тормозит его.", "en": "Air actually resists the ball's motion and slows it down."}])
 ]]),

  {"he": "אנרגיה בחיי היומיום", "ar": "الطاقة في الحياة اليومية", "ru": "Энергия в повседневной жизни", "en": "Energy in everyday life"},
  {"he": "מאיפה באה האנרגיה, איך היא משנה צורה, ואיך חוסכים אותה", "ar": "من أين تأتي الطاقة، وكيف تتغير، وكيف نوفرها", "ru": "Откуда берётся энергия, как она превращается и как её экономить", "en": "Where energy comes from, how it changes form, and how to save it"},
[ [
Q("a2-sun",{"he": "משפחה תולה כביסה רטובה על חבל בחצר בצהריים. מאיפה מגיעה רוב האנרגיה שמייבשת את הכביסה?", "ar": "عائلة تنشر غسيلًا مبللًا على حبل في الساحة ظهرًا. من أين يأتي معظم الطاقة التي تجفف الغسيل؟", "ru": "Семья вешает мокрое бельё на верёвку во дворе в полдень. Откуда приходит большая часть энергии, которая сушит бельё?", "en": "A family hangs wet laundry on a line in the yard at noon. Where does most of the energy that dries the laundry come from?"},[{"he": "מחברת החשמל, שמעבירה זרם דרך חבל הכביסה.", "ar": "من شركة الكهرباء التي تنقل التيار عبر حبل الغسيل.", "ru": "От электрокомпании, которая передаёт ток по бельевой верёвке.", "en": "From the power company, which sends current through the laundry line."},{"he": "מהשמש, שמחממת את הבד ומאדה את המים שבו.", "ar": "من الشمس التي تسخّن القماش وتبخّر الماء فيه.", "ru": "От Солнца: оно нагревает ткань и испаряет воду в ней.", "en": "From the Sun, which heats the fabric and evaporates the water in it."},{"he": "מהאדמה, ששואבת את המים החוצה מהבגדים.", "ar": "من الأرض التي تمتص الماء من الملابس.", "ru": "От земли, которая вытягивает воду из одежды.", "en": "From the ground, which draws the water out of the clothes."},{"he": "מהחום האגור בקירות הבית סביב החצר.", "ar": "من الحرارة المخزنة في جدران البيت حول الساحة.", "ru": "От тепла, накопленного в стенах дома вокруг двора.", "en": "From heat stored in the house walls around the yard."}],1,{"he": "חשבו מה מחמם את הבגדים הרטובים ביום בהיר, גם כשאין רוח.", "ar": "فكّروا ما الذي يسخّن الملابس المبللة في يوم مشمس حتى بلا رياح.", "ru": "Подумайте, что нагревает мокрую одежду в ясный день даже без ветра.", "en": "Think about what heats wet clothes on a bright day even without wind."},{"he": "השמש היא מקור האנרגיה המרכזי של כדור הארץ: קרני השמש מחממות את הבד, והחום מאיץ את אידוי המים. למשל פאנלים סולאריים על גגות הופכים אור שמש לחשמל ביתי.", "ar": "الشمس هي مصدر الطاقة الرئيسي لكوكب الأرض: أشعتها تسخّن القماش، والحرارة تسرّع تبخر الماء. مثال: الألواح الشمسية على الأسطح تحوّل ضوء الشمس إلى كهرباء منزلية.", "ru": "Солнце является главным источником энергии Земли: его лучи нагревают ткань, а тепло ускоряет испарение воды. Например, солнечные панели на крышах превращают солнечный свет в домашнее электричество.", "en": "The Sun is Earth's main energy source: its rays heat the fabric, and the heat speeds up evaporation. For example, rooftop solar panels turn sunlight into household electricity."},null,[{"he": "חבל כביסה אינו מחובר לחשמל, והכביסה מתייבשת גם בלי חשמל.", "ar": "حبل الغسيل غير موصول بالكهرباء، والغسيل يجف أيضًا بلا كهرباء.", "ru": "Бельевая верёвка не подключена к электричеству, и бельё сохнет и без него.", "en": "A laundry line is not connected to electricity, and laundry dries without it."},null,{"he": "האדמה אינה נוגעת בבגדים התלויים, ואינה שואבת מהם מים.", "ar": "الأرض لا تلمس الملابس المعلقة ولا تمتص منها الماء.", "ru": "Земля не касается висящей одежды и не вытягивает из неё воду.", "en": "The ground does not touch the hanging clothes or pull water from them."},{"he": "הקירות מתחממים מהשמש בעצמם; הם אינם המקור העיקרי לאנרגיה.", "ar": "الجدران نفسها تسخن من الشمس؛ فهي ليست المصدر الرئيسي للطاقة.", "ru": "Стены сами нагреваются от Солнца; они не главный источник энергии.", "en": "The walls themselves are heated by the Sun; they are not the main energy source."}]),
Q("a2-transform",{"he": "דורון מדליק פנס שעובד על סוללה. איזה שינוי אנרגיה קורה בתוך הפנס?", "ar": "دورون يشغّل مصباحًا يدويًا يعمل ببطارية. أي تحوّل طاقة يحدث داخل المصباح؟", "ru": "Дорон включает фонарик на батарейке. Какое превращение энергии происходит внутри фонарика?", "en": "Doron switches on a battery-powered flashlight. What energy change happens inside the flashlight?"},[{"he": "אנרגיה כימית מהסוללה הופכת לחשמל, וממנו לאור ולחום.", "ar": "الطاقة الكيميائية المخزنة في البطارية تتحول إلى كهرباء، ومنها إلى ضوء وحرارة.", "ru": "Химическая энергия батарейки превращается в ток, а из него в свет и тепло.", "en": "Chemical energy from the battery becomes electricity, then light and heat."},{"he": "אנרגיית האור בסביבה נאגרת בתוך הסוללה לשימוש בלילה.", "ar": "طاقة الضوء في المحيط تُخزَّن داخل البطارية لاستخدامها في الليل فقط.", "ru": "Световая энергия вокруг запасается в батарейке для использования ночью.", "en": "Light energy around is stored inside the battery for nighttime use."},{"he": "אנרגיית הקול של צעדים בלילה הופכת לזרם חשמלי בפנס.", "ar": "طاقة صوت الخطوات في الليل تتحول إلى تيار كهربائي في المصباح.", "ru": "Энергия звука шагов ночью превращается в ток внутри фонарика.", "en": "Sound energy from footsteps at night becomes electric current in the flashlight."},{"he": "אנרגיית התנועה של היד הופכת למזון חדש בתוך הסוללה.", "ar": "طاقة حركة اليد تتحول إلى غذاء جديد داخل البطارية.", "ru": "Энергия движения руки превращается в новую пищу внутри батарейки.", "en": "The hand's motion energy becomes new food inside the battery."}],0,{"he": "חשבו מה אגור בתוך סוללה טרייה, ומה יוצא מהפנס כשהוא דולק.", "ar": "فكّروا ما المخزون داخل بطارية جديدة، وما الذي يخرج من المصباح وهو يعمل.", "ru": "Подумайте, что запасено в свежей батарейке и что выходит из работающего фонарика.", "en": "Think about what is stored inside a fresh battery and what comes out of a lit flashlight."},{"he": "אנרגיה עוברת מצורה לצורה: בסוללה אגורה אנרגיה כימית, המעגל הופך אותה לזרם חשמלי, והנורה פולטת אור וגם קצת חום. למשל גם במזון אגורה אנרגיה כימית, והגוף הופך אותה לתנועה ולחום.", "ar": "الطاقة تنتقل من شكل إلى آخر: في البطارية تُخزن طاقة كيميائية، والدائرة تحوّلها إلى تيار كهربائي، والمصباح يصدر ضوءً وقليلًا من الحرارة. مثال: في الغذاء أيضًا تُخزن طاقة كيميائية، والجسم يحوّلها إلى حركة وحرارة.", "ru": "Энергия переходит из вида в вид: в батарейке запасена химическая энергия, цепь превращает её в ток, а лампочка излучает свет и немного тепла. Например, в пище тоже запасена химическая энергия, и тело превращает её в движение и тепло.", "en": "Energy moves from form to form: the battery stores chemical energy, the circuit turns it into current, and the bulb gives off light and some heat. For example, food also stores chemical energy, and the body turns it into motion and heat."},null,[null,{"he": "סוללה אינה קולטת אור; היא מספקת אנרגיה כימית שהייצור טען בה.", "ar": "البطارية لا تلتقط الضوء؛ فهي توفر طاقة كيميائية شُحنت فيها عند التصنيع.", "ru": "Батарейка не собирает свет; она отдаёт химическую энергию, заложенную при производстве.", "en": "A battery does not collect light; it supplies chemical energy stored at manufacture."},{"he": "לפנס אין חלק שהופך קול לחשמל; האור נוצר מהסוללה.", "ar": "ليس في المصباح جزء يحوّل الصوت إلى كهرباء؛ فالضوء يتولد من البطارية.", "ru": "В фонарике нет части, превращающей звук в электричество; свет даёт батарейка.", "en": "A flashlight has no part that turns sound into electricity; the light comes from the battery."},{"he": "סוללה אינה מייצרת מזון; האנרגיה שלה הופכת לחשמל בלבד.", "ar": "البطارية لا تنتج غذاء؛ فطاقتها تتحول إلى كهرباء فقط.", "ru": "Батарейка не производит пищу; её энергия превращается только в электричество.", "en": "A battery does not produce food; its energy becomes electricity only."}]),
Q("a2-save",{"he": "איזו פעולה חוסכת הכי הרבה חשמל בבית לאורך זמן?", "ar": "أي إجراء يوفر أكبر قدر من الكهرباء في البيت على المدى الطويل؟", "ru": "Какое действие экономит больше всего электричества дома на длительном сроке?", "en": "Which action saves the most electricity at home over time?"},[{"he": "להשאיר את הטלוויזיה דלוקה כשאף אחד לא צופה בה.", "ar": "ترك التلفاز يعمل عندما لا يشاهده أحد.", "ru": "Оставлять телевизор включённым, когда никто не смотрит.", "en": "Leaving the television on when nobody is watching."},{"he": "להחזיק את דלת המקרר פתוחה בזמן שבוחרים נשנוש.", "ar": "إبقاء باب الثلاجة مفتوحًا أثناء اختيار وجبة خفيفة.", "ru": "Держать дверцу холодильника открытой, пока выбираешь перекус.", "en": "Holding the fridge door open while choosing a snack."},{"he": "לכבות אורות ומכשירים בחדרים שאין בהם איש.", "ar": "إطفاء الأضواء والأجهزة في الغرف الخالية.", "ru": "Выключать свет и приборы в комнатах, где никого нет.", "en": "Turning off lights and devices in empty rooms."},{"he": "להדליק את כל האורות בבית בכל ערב.", "ar": "إشعال كل أضواء البيت كل مساء.", "ru": "Включать весь свет в доме каждый вечер.", "en": "Switching on all the house lights every evening."}],2,{"he": "חשבו איזו פעולה מפסיקה צריכת חשמל במקום להוסיף לה.", "ar": "فكّروا أي إجراء يوقف استهلاك الكهرباء بدلًا من زيادته.", "ru": "Подумайте, какое действие прекращает расход электричества вместо того, чтобы увеличивать его.", "en": "Think about which action stops electricity use instead of adding to it."},{"he": "חיסכון בחשמל מתחיל בלהפסיק צריכה מיותרת: מכשיר דולק צורך אנרגיה כל הזמן, גם כשאף אחד לא משתמש בו. למשל מנורת לד שנכבית ביציאה מהחדר חוסכת כסף ואנרגיה בכל לילה.", "ar": "توفير الكهرباء يبدأ بإيقاف الاستهلاك غير الضروري: الجهاز المشتغل يستهلك طاقة طوال الوقت حتى بلا مستخدم. مثال: مصباح ليد يُطفأ عند مغادرة الغرفة يوفر مالًا وطاقة كل ليلة.", "ru": "Экономия электричества начинается с прекращения лишнего расхода: включённый прибор потребляет энергию всё время, даже без пользователя. Например, светодиодная лампа, выключенная при выходе из комнаты, экономит деньги и энергию каждую ночь.", "en": "Saving electricity starts with stopping unneeded use: a running device draws energy the whole time, even with no user. For example, an LED lamp switched off when leaving the room saves money and energy every night."},null,[{"he": "טלוויזיה דולקת צורכת חשמל, ולכן זו בזבוז ולא חיסכון.", "ar": "التلفاز المشتغل يستهلك كهرباء، فهذا هدر وليس توفيرًا.", "ru": "Включённый телевизор тратит электричество; это расточительство, а не экономия.", "en": "A running television uses electricity, so that is waste, not saving."},{"he": "דלת פתוחה מכניסה חום למקרר, והמדחס עובד קשה יותר וצורך יותר.", "ar": "الباب المفتوح يدخل الحرارة إلى الثلاجة، فيعمل الضاغط بجهد أكبر ويستهلك أكثر.", "ru": "Открытая дверца впускает тепло, и компрессор работает сильнее и тратит больше.", "en": "An open door lets heat into the fridge, so the compressor works harder and uses more."},null,{"he": "תאורה מלאה בכל הבית מגדילה את הצריכה, ולא מקטינה אותה.", "ar": "الإضاءة الكاملة في كل البيت تزيد الاستهلاك ولا تنقصه.", "ru": "Полное освещение всего дома увеличивает расход, а не уменьшает его.", "en": "Lighting the whole house increases consumption instead of reducing it."}]),
Q("en-1-01",{"he": "נועה מרתיחה מים בקומקום חשמלי. איזה שינוי אנרגיה קורה בתוך הקומקום?", "ar": "تغلي نوعا الماء في غلاية كهربائية. أي تحوّل للطاقة يحدث داخل الغلاية؟", "ru": "Ноа кипятит воду в электрочайнике. Какое превращение энергии происходит внутри чайника?", "en": "Noa boils water in an electric kettle. Which energy change happens inside the kettle?"},[{"he": "אנרגיית תנועה הופכת לאנרגיה חשמלית.", "ar": "طاقة الحركة تتحول إلى طاقة كهربائية.", "ru": "Энергия движения превращается в электрическую.", "en": "Motion energy turns into electrical energy."}, {"he": "אנרגיית חום הופכת לאנרגיה כימית.", "ar": "الطاقة الحرارية تتحول إلى طاقة كيميائية.", "ru": "Тепловая энергия превращается в химическую.", "en": "Heat energy turns into chemical energy."}, {"he": "אנרגיה חשמלית הופכת לאנרגיית חום.", "ar": "الطاقة الكهربائية تتحول إلى طاقة حرارية.", "ru": "Электрическая энергия превращается в тепловую.", "en": "Electrical energy turns into heat energy."}, {"he": "אנרגיית אור הופכת לאנרגיה חשמלית.", "ar": "طاقة الضوء تتحول إلى طاقة كهربائية.", "ru": "Световая энергия превращается в электрическую.", "en": "Light energy turns into electrical energy."}],2,{"he": "חשבו מה נכנס לקומקום דרך הכבל, ומה המים מקבלים ממנו.", "ar": "فكّروا ماذا يدخل الغلاية عبر السلك، وماذا يأخذ الماء منها.", "ru": "Подумайте, что входит в чайник по проводу и что получает от него вода.", "en": "Think about what enters the kettle through the cord, and what the water gets from it."},{"he": "בקומקום יש גוף חימום שמקבל זרם חשמלי ומתחמם. החום עובר למים ומרתיח אותם. למשל גם מייבש שיער הופך חשמל לחום, וגם לתנועה של אוויר.", "ar": "في الغلاية عنصر تسخين يستقبل التيار الكهربائي ويسخن. تنتقل الحرارة إلى الماء فيغلي. مثال: مجفف الشعر أيضًا يحوّل الكهرباء إلى حرارة، وإلى حركة هواء.", "ru": "В чайнике есть нагревательный элемент: через него идёт ток, и он нагревается. Тепло переходит к воде и доводит её до кипения. Например, фен тоже превращает электричество в тепло, а ещё в движение воздуха.", "en": "The kettle has a heating element that gets electric current and warms up. The heat passes to the water and boils it. For example, a hair dryer also turns electricity into heat, and into moving air."},null,[{"he": "בקומקום אין חלק שזז ומייצר חשמל; הוא רק צורך חשמל מהשקע.", "ar": "لا يوجد في الغلاية جزء متحرك يولّد الكهرباء؛ هي تستهلك الكهرباء فقط.", "ru": "В чайнике нет движущейся части, которая вырабатывает ток; он только потребляет его.", "en": "A kettle has no moving part that makes electricity; it only uses electricity."}, {"he": "המים רק מתחממים ולא הופכים לחומר חדש, ולכן לא נאגרת בהם אנרגיה כימית.", "ar": "الماء يسخن فقط ولا يتحول إلى مادة جديدة، لذلك لا تُخزَّن فيه طاقة كيميائية.", "ru": "Вода только нагревается и не становится новым веществом, поэтому химическая энергия не запасается.", "en": "The water only heats up and does not become a new substance, so no chemical energy is stored."}, null, {"he": "קומקום אינו קולט אור; את האנרגיה שלו הוא מקבל מהשקע.", "ar": "الغلاية لا تستقبل الضوء؛ هي تأخذ طاقتها من المقبس.", "ru": "Чайник не улавливает свет; энергию он получает из розетки.", "en": "A kettle does not collect light; it gets its energy from the socket."}]),
Q("en-1-02",{"he": "יוסי השאיר כף מתכת בסיר מרק חם. אחרי דקה גם הידית של הכף חמה. איך הגיע החום אל הידית?", "ar": "ترك يوسي ملعقة معدنية في قدر حساء ساخن. بعد دقيقة صار مقبض الملعقة ساخنًا أيضًا. كيف وصلت الحرارة إلى المقبض؟", "ru": "Йоси оставил металлическую ложку в кастрюле с горячим супом. Через минуту ручка ложки тоже горячая. Как тепло дошло до ручки?", "en": "Yossi left a metal spoon in a pot of hot soup. After a minute the spoon's handle is hot too. How did the heat reach the handle?"},[{"he": "בהולכה: החום עבר בתוך המתכת מהקצה החם לקצה הקר.", "ar": "بالتوصيل: انتقلت الحرارة داخل المعدن من الطرف الساخن إلى البارد.", "ru": "Теплопроводностью: тепло прошло по металлу от горячего конца к холодному.", "en": "By conduction: heat passed along the metal from hot end to cold end."}, {"he": "בהסעה: המרק עצמו זרם במעלה הכף עד לידית.", "ar": "بالحمل: الحساء نفسه صعد على الملعقة حتى المقبض.", "ru": "Конвекцией: сам суп поднялся по ложке до ручки.", "en": "By convection: the soup itself flowed up the spoon to the handle."}, {"he": "בקרינה: מנורת המטבח חיממה את הידית מלמעלה.", "ar": "بالإشعاع: مصباح المطبخ سخّن المقبض من الأعلى.", "ru": "Излучением: лампа на кухне нагрела ручку сверху.", "en": "By radiation: the kitchen lamp warmed the handle from above."}, {"he": "הקור יצא מהידית אל המרק החם, ולכן נשאר בידית רק חום.", "ar": "خرجت البرودة من المقبض إلى الحساء الساخن، فبقيت فيه الحرارة فقط.", "ru": "Холод ушёл из ручки в горячий суп, и в ней осталось только тепло.", "en": "The cold left the handle into the hot soup, so only heat stayed in it."}],0,{"he": "חשבו מה מחבר בין המרק לבין הידית לאורך כל הזמן.", "ar": "فكّروا ما الذي يصل بين الحساء والمقبض طوال الوقت.", "ru": "Подумайте, что всё время соединяет суп и ручку.", "en": "Think about what connects the soup and the handle the whole time."},{"he": "מתכת מוליכה חום טוב. החום עובר בה מחלקיק לחלקיק, מהחלק החם אל החלק הקר. למשל לכן לסירים רבים יש ידיות מעץ או מפלסטיק.", "ar": "المعدن موصل جيد للحرارة. تنتقل الحرارة فيه من جسيم إلى جسيم، من الجزء الساخن إلى البارد. مثال: لهذا لكثير من القدور مقابض من الخشب أو البلاستيك.", "ru": "Металл хорошо проводит тепло. Тепло передаётся в нём от частицы к частице, от горячей части к холодной. Например, поэтому у многих кастрюль ручки из дерева или пластика.", "en": "Metal conducts heat well. Heat passes through it from particle to particle, from the hot part to the cold part. For example, that is why many pots have wooden or plastic handles."},null,[null, {"he": "המרק נשאר בסיר ולא מטפס על הכף; החום עבר דרך המתכת.", "ar": "الحساء يبقى في القدر ولا يتسلق الملعقة؛ الحرارة انتقلت عبر المعدن.", "ru": "Суп остаётся в кастрюле и не ползёт по ложке; тепло прошло по металлу.", "en": "The soup stays in the pot and does not climb the spoon; heat moved through the metal."}, {"he": "מנורה רגילה מחממת מעט מאוד, והידית התחממה רק אחרי שהכף נכנסה למרק.", "ar": "المصباح العادي يسخّن قليلًا جدًا، والمقبض سخن فقط بعد وضع الملعقة في الحساء.", "ru": "Обычная лампа греет очень слабо, а ручка нагрелась только после того, как ложку опустили в суп.", "en": "An ordinary lamp warms very little, and the handle got hot only after the spoon went into the soup."}, {"he": "קור אינו זורם; חום עובר תמיד מהחם אל הקר.", "ar": "البرودة لا تنتقل؛ الحرارة تنتقل دائمًا من الساخن إلى البارد.", "ru": "Холод не течёт; тепло всегда переходит от горячего к холодному.", "en": "Cold does not flow; heat always moves from hot to cold."}]),
Q("en-1-03",{"he": "איזה מקור אנרגיה לייצור חשמל הוא מקור מתחדש?", "ar": "أي مصدر طاقة لإنتاج الكهرباء هو مصدر متجدد؟", "ru": "Какой источник энергии для производства электричества является возобновляемым?", "en": "Which energy source for making electricity is a renewable source?"},[{"he": "גז טבעי מהמאגרים בים התיכון.", "ar": "الغاز الطبيعي من الحقول في البحر المتوسط.", "ru": "Природный газ из месторождений в Средиземном море.", "en": "Natural gas from fields in the Mediterranean Sea."}, {"he": "פחם שמגיע באוניות לתחנת הכוח.", "ar": "الفحم الذي يصل بالسفن إلى محطة الكهرباء.", "ru": "Уголь, который привозят на электростанцию на кораблях.", "en": "Coal that arrives by ship at the power station."}, {"he": "סולר שמפעיל גנרטור גדול באתר בנייה.", "ar": "السولار الذي يشغّل مولّدًا كبيرًا في موقع بناء.", "ru": "Дизель, на котором работает большой генератор на стройке.", "en": "Diesel that runs a large generator at a building site."}, {"he": "רוח שמסובבת טורבינות ברמת הגולן.", "ar": "الرياح التي تدير التوربينات في هضبة الجولان.", "ru": "Ветер, который вращает турбины на Голанских высотах.", "en": "Wind that turns turbines in the Golan Heights."}],3,{"he": "חשבו איזה מקור לא ייגמר, גם אם משתמשים בו שנים רבות.", "ar": "فكّروا أي مصدر لن ينفد حتى لو استعملناه سنوات طويلة.", "ru": "Подумайте, какой источник не закончится, даже если пользоваться им много лет.", "en": "Think about which source will not run out, even after many years of use."},{"he": "מקור מתחדש הוא מקור שהטבע ממלא שוב כל הזמן, כמו שמש ורוח. גז, פחם ונפט נוצרו במשך מיליוני שנים, ונגמרים כששורפים אותם. למשל בגולן פועלות טורבינות רוח שמייצרות חשמל.", "ar": "المصدر المتجدد هو مصدر تجدّده الطبيعة باستمرار، مثل الشمس والرياح. الغاز والفحم والنفط تكوّنت خلال ملايين السنين، وتنفد عندما نحرقها. مثال: في الجولان تعمل توربينات رياح تنتج الكهرباء.", "ru": "Возобновляемый источник природа всё время восполняет, как солнце и ветер. Газ, уголь и нефть образовались за миллионы лет и заканчиваются, когда их сжигают. Например, на Голанах работают ветровые турбины, которые дают электричество.", "en": "A renewable source is one that nature keeps refilling, like sun and wind. Gas, coal and oil formed over millions of years and run out when burned. For example, wind turbines in the Golan produce electricity."},null,[{"he": "גז טבעי נוצר במיליוני שנים, והמאגר נגמר כששורפים אותו.", "ar": "الغاز الطبيعي تكوّن خلال ملايين السنين، وينفد الحقل عندما نحرقه.", "ru": "Природный газ образовался за миллионы лет, и запас кончается при сжигании.", "en": "Natural gas formed over millions of years, and the field runs out as it is burned."}, {"he": "פחם הוא דלק מאובנים, וכמותו באדמה מוגבלת.", "ar": "الفحم وقود أحفوري، وكميته في الأرض محدودة.", "ru": "Уголь — ископаемое топливо, и его запас в земле ограничен.", "en": "Coal is a fossil fuel, and the amount in the ground is limited."}, {"he": "סולר מופק מנפט, ונפט הוא מקור שנגמר.", "ar": "السولار يُستخرج من النفط، والنفط مصدر ينفد.", "ru": "Дизель получают из нефти, а нефть — источник, который кончается.", "en": "Diesel is made from oil, and oil is a source that runs out."}, null]),
Q("en-1-04",{"he": "למה הלוחות של דוד השמש על הגג צבועים בצבע כהה?", "ar": "لماذا تكون ألواح السخان الشمسي على السطح مطلية بلون داكن؟", "ru": "Почему панели солнечного водонагревателя на крыше тёмного цвета?", "en": "Why are the panels of a solar water heater on the roof painted a dark color?"},[{"he": "כדי שהלוחות יחזירו את קרני השמש בחזרה לשמיים.", "ar": "كي تعكس الألواح أشعة الشمس عائدةً إلى السماء.", "ru": "Чтобы панели отражали солнечные лучи обратно в небо.", "en": "So the panels reflect the sunlight back to the sky."}, {"he": "כי משטח כהה בולע יותר קרינה, ולכן מתחמם יותר.", "ar": "لأن السطح الداكن يمتص إشعاعًا أكثر، فيسخن أكثر.", "ru": "Потому что тёмная поверхность поглощает больше излучения и сильнее греется.", "en": "Because a dark surface absorbs more radiation, so it heats up more."}, {"he": "כי צבע כהה מונע מהמים לזרום החוצה מהצינורות.", "ar": "لأن اللون الداكن يمنع الماء من الخروج من الأنابيب.", "ru": "Потому что тёмная краска не даёт воде вытекать из труб.", "en": "Because dark paint stops the water from leaking out of the pipes."}, {"he": "כי צבע כהה מסתיר לכלוך, ואין לו קשר לחום.", "ar": "لأن اللون الداكن يخفي الأوساخ، ولا علاقة له بالحرارة.", "ru": "Потому что тёмный цвет скрывает грязь и не связан с теплом.", "en": "Because a dark color hides dirt and has nothing to do with heat."}],1,{"he": "חשבו איזו חולצה מתחממת יותר בשמש: שחורה או לבנה.", "ar": "فكّروا أي قميص يسخن أكثر في الشمس: الأسود أم الأبيض.", "ru": "Подумайте, какая футболка сильнее греется на солнце: чёрная или белая.", "en": "Think about which shirt gets hotter in the sun: a black one or a white one."},{"he": "משטח כהה בולע את רוב קרינת השמש והופך אותה לחום. החום עובר למים שזורמים בצינורות שבתוך הלוח. למשל מכונית שחורה שחונה בשמש מתחממת יותר ממכונית לבנה.", "ar": "السطح الداكن يمتص معظم أشعة الشمس ويحوّلها إلى حرارة. تنتقل الحرارة إلى الماء الذي يجري في الأنابيب داخل اللوح. مثال: السيارة السوداء المتوقفة في الشمس تسخن أكثر من البيضاء.", "ru": "Тёмная поверхность поглощает большую част
