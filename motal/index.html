    Q("env-issues-1-3",{"he":"איזה מהבאים יכול לייצר חשמל ממקור אנרגיה מתחדש?","ar":"أي مما يلي يمكنه إنتاج الكهرباء من مصدر طاقة متجدّد؟","ru":"Что из перечисленного может производить электричество из возобновляемого источника?","en":"Which of these can generate electricity from a renewable source?"},[{"he":"פאנלים סולאריים על גג","ar":"ألواح شمسية على سطح","ru":"Солнечные панели на крыше","en":"Solar panels on a roof"},{"he":"תחנת כוח ששורפת פחם","ar":"محطة كهرباء تحرق الفحم","ru":"Угольная электростанция","en":"A power plant burning coal"},{"he":"גנרטור שפועל על סולר","ar":"مولّد يعمل بالديزل","ru":"Дизельный генератор","en":"A diesel-powered generator"},{"he":"תחנה ששורפת גז טבעי","ar":"محطة تحرق الغاز الطبيعي","ru":"Станция, сжигающая природный газ","en":"A plant burning natural gas"}],0,{"he":"בדקו איזה מקור מתחדש בטבע ואינו צריך שריפת דלק.","ar":"افحصوا أي مصدر يتجدّد في الطبيعة ولا يحتاج إلى حرق وقود.","ru":"Подумайте, какой источник возобновляется в природе и не требует сжигания топлива.","en":"Consider which source is renewed in nature and needs no fuel burned."},{"he":"פאנלים סולאריים הופכים אור שמש לחשמל בלי לשרוף דלק בזמן הפעולה. למשל, פאנלים על גג בית ספר יכולים לספק לו חלק מהחשמל בשעות האור.","ar":"تحوّل الألواح الشمسية ضوء الشمس إلى كهرباء دون حرق وقود أثناء عملها. مثلًا، قد توفر ألواح على سطح مدرسة جزءًا من كهربائها نهارًا.","ru":"Солнечные панели превращают свет в электричество без сжигания топлива при работе. Например, панели на школьной крыше могут обеспечивать часть нужной школе электроэнергии днём.","en":"Solar panels turn sunlight into electricity without burning fuel while operating. For example, panels on a school roof can supply part of its daytime electricity."},null,[null,{"he":"פחם הוא דלק מתכלה, ושריפתו פולטת מזהמים.","ar":"الفحم وقود غير متجدّد، وحرقه يطلق ملوّثات.","ru":"Уголь невозобновляем, а его сжигание даёт выбросы.","en":"Coal is nonrenewable, and burning it emits pollutants."},{"he":"סולר מיוצר מנפט, שהוא מקור שאינו מתחדש.","ar":"الديزل يُصنع من النفط، وهو مصدر غير متجدّد.","ru":"Дизель получают из нефти, невозобновляемого ресурса.","en":"Diesel comes from oil, a nonrenewable resource."},{"he":"גז טבעי הוא דלק מאובנים שאינו מתחדש בקצב השימוש בו.","ar":"الغاز الطبيعي وقود أحفوري لا يتجدّد بمعدل استهلاكه.","ru":"Природный газ - ископаемое топливо, не возобновляющееся со скоростью потребления.","en":"Natural gas is a fossil fuel that does not renew at the rate we use it."}]),
    Q("ev-1-01",{"he":"חקלאי רוצה להשקות עצי פרי ולבזבז כמה שפחות מים. איזו שיטה הכי מתאימה?","ar":"يريد مزارع أن يروي أشجار الفاكهة بأقل هدر ممكن للمياه. أيّ طريقة هي الأنسب؟","ru":"Фермер хочет поливать фруктовые деревья, тратя как можно меньше воды. Какой способ подходит лучше всего?","en":"A farmer wants to water fruit trees while wasting as little water as possible. Which method suits best?"},[{"he":"טפטפות ליד השורשים","ar":"تنقيط قرب الجذور","ru":"Капельницы у корней","en":"Drip emitters near the roots"},{"he":"ממטרות בצהרי היום","ar":"رشاشات في وقت الظهيرة","ru":"Дождеватели в полдень","en":"Sprinklers at midday"},{"he":"הצפת השדה פעם בשבוע","ar":"غمر الحقل مرة في الأسبوع","ru":"Затопление поля раз в неделю","en":"Flooding the field once a week"},{"he":"צינור פתוח בין השורות","ar":"خرطوم مفتوح بين الصفوف","ru":"Открытый шланг между рядами","en":"An open hose between the rows"}],0,{"he":"חשבו לאן בדיוק צריכים המים להגיע כדי שהעץ ישתה אותם.","ar":"فكّروا إلى أين يجب أن يصل الماء بالضبط كي تشربه الشجرة.","ru":"Подумайте, куда именно должна попасть вода, чтобы дерево её выпило.","en":"Think about where exactly the water must go for the tree to drink it."},{"he":"בטפטוף המים יוצאים לאט, ממש ליד השורשים, ולכן מעט מים מתאדים או הולכים לאיבוד. למשל, בפרדסים ובגינות רבות בישראל יש צינור טפטוף שעובר ליד כל עץ.","ar":"في الريّ بالتنقيط يخرج الماء ببطء قرب الجذور مباشرة، لذلك يتبخّر القليل منه أو يضيع. مثلًا، في كثير من البساتين والحدائق في إسرائيل يمرّ أنبوب تنقيط قرب كل شجرة.","ru":"При капельном поливе вода выходит медленно прямо у корней, поэтому мало воды испаряется или теряется. Например, во многих садах в Израиле рядом с каждым деревом проходит капельная трубка.","en":"In drip irrigation water comes out slowly right by the roots, so little evaporates or is lost. For example, in many orchards and gardens in Israel a drip line runs past each tree."},null,[null,{"he":"בצהריים חלק גדול מהמים מתאדה לפני שהוא מגיע לשורשים.","ar":"في الظهيرة يتبخّر جزء كبير من الماء قبل أن يصل إلى الجذور.","ru":"В полдень много воды испаряется, не дойдя до корней.","en":"At midday much of the water evaporates before reaching the roots."},{"he":"הצפה מרטיבה את כל השטח, ומים רבים מתאדים או מחלחלים עמוק מדי.","ar":"الغمر يبلّل كل المساحة، فيتبخّر كثير من الماء أو يتسرّب عميقًا جدًا.","ru":"При затоплении мокнет всё поле, и много воды испаряется или уходит слишком глубоко.","en":"Flooding wets the whole area, so much water evaporates or sinks too deep."},{"he":"צינור פתוח שופך מים גם במקומות שאין בהם שורשים.","ar":"الخرطوم المفتوح يسكب الماء حتى في أماكن لا جذور فيها.","ru":"Открытый шланг льёт воду и туда, где нет корней.","en":"An open hose pours water even where there are no roots."}]),
    Q("ev-1-02",{"he":"בישראל מטהרים את רוב מי הביוב במתקנים מיוחדים. במה משתמשים בעיקר במים המטוהרים?","ar":"في إسرائيل تُعالَج معظم مياه الصرف الصحي في منشآت خاصة. فيمَ تُستخدم المياه المعالجة أساسًا؟","ru":"В Израиле большую часть сточных вод очищают на специальных станциях. Для чего в основном используют очищенную воду?","en":"In Israel most sewage water is treated in special plants. What is the treated water mainly used for?"},[{"he":"לשתייה ישירה מהברז בבית","ar":"للشرب مباشرة من حنفية البيت","ru":"Для питья прямо из крана дома","en":"Drinking straight from the home tap"},{"he":"להשקיית שדות חקלאיים","ar":"لريّ الحقول الزراعية","ru":"Для полива сельхозполей","en":"Irrigating farm fields"},{"he":"למילוי בריכות שחייה","ar":"لملء برك السباحة","ru":"Для наполнения бассейнов","en":"Filling swimming pools"},{"he":"להכנת קרח למשקאות","ar":"لصنع الثلج للمشروبات","ru":"Для льда в напитки","en":"Making ice for drinks"}],1,{"he":"חשבו איפה צריך כמויות גדולות של מים, אבל לא חייבים מים ששותים.","ar":"فكّروا أين نحتاج إلى كميات كبيرة من الماء دون أن يكون ماءً للشرب.","ru":"Подумайте, где нужно много воды, но не обязательно питьевой.","en":"Think about where large amounts of water are needed, but not drinking water."},{"he":"המים המטוהרים נקראים ״מים מושבים״. הם לא מתאימים לשתייה, אבל מתאימים להשקיית גידולים רבים, וכך נחסכים מי שתייה. למשל, שדה תירס יכול להיות מושקה במים מושבים, ומי השתייה נשארים לבתים.","ar":"تُسمّى المياه المعالجة «مياهًا معاد استعمالها». هي غير صالحة للشرب، لكنها مناسبة لريّ محاصيل كثيرة، وهكذا نوفّر مياه الشرب. مثلًا، يمكن ريّ حقل ذرة بمياه معالجة، فتبقى مياه الشرب للبيوت.","ru":"Очищенную воду называют оборотной. Она не годится для питья, но подходит для полива многих культур, и так экономится питьевая вода. Например, кукурузное поле можно поливать оборотной водой, а питьевая останется для домов.","en":"Treated water is called reclaimed water. It is not fit for drinking, but it suits irrigation of many crops, which saves drinking water. For example, a corn field can be watered with reclaimed water, leaving drinking water for homes."},null,[{"he":"מים מטוהרים מביוב אינם מיועדים לשתייה, אלא לשימושים כמו השקיה.","ar":"المياه المعالجة من الصرف الصحي ليست مخصّصة للشرب، بل لاستخدامات مثل الريّ.","ru":"Очищенные сточные воды не предназначены для питья, а нужны для полива и подобного.","en":"Treated sewage water is not meant for drinking but for uses like irrigation."},null,{"he":"בריכות שחייה ממולאות במי שתייה, כי אנשים באים איתם במגע ישיר.","ar":"تُملأ برك السباحة بمياه الشرب، لأن الناس يلامسونها مباشرة.","ru":"Бассейны наполняют питьевой водой, ведь люди касаются её напрямую.","en":"Pools are filled with drinking water, since people touch it directly."},{"he":"קרח למשקאות מכינים ממי שתייה, כי בולעים אותו.","ar":"يُصنع ثلج المشروبات من مياه الشرب لأننا نبتلعه.","ru":"Лёд для напитков делают из питьевой воды, ведь его глотают.","en":"Ice for drinks is made from drinking water, since we swallow it."}]),
    Q("ev-1-03",{"he":"כשיש באוויר יותר פחמן דו-חמצני, כדור הארץ מתחמם. מה הגז עושה?","ar":"عندما يزداد ثاني أكسيد الكربون في الهواء، ترتفع حرارة الأرض. ماذا يفعل هذا الغاز؟","ru":"Когда в воздухе больше углекислого газа, Земля нагревается. Что делает этот газ?","en":"When there is more carbon dioxide in the air, Earth warms up. What does the gas do?"},[{"he":"מייצר חום בעצמו, כמו אש בוערת","ar":"يُنتج الحرارة بنفسه مثل نار مشتعلة","ru":"Сам производит тепло, как горящий огонь","en":"Makes heat by itself, like a burning fire"},{"he":"פותח חור בשכבת האוזון","ar":"يفتح ثقبًا في طبقة الأوزون","ru":"Пробивает дыру в озоновом слое","en":"Opens a hole in the ozone layer"},{"he":"לוכד חלק מהחום שהקרקע פולטת","ar":"يحبس جزءًا من الحرارة التي تُطلقها الأرض","ru":"Задерживает часть тепла, которое отдаёт поверхность","en":"Traps some of the heat the ground gives off"},{"he":"מקרב את כדור הארץ לשמש","ar":"يقرّب الأرض من الشمس","ru":"Приближает Землю к Солнцу","en":"Moves Earth closer to the Sun"}],2,{"he":"דמיינו מכונית סגורה שעומדת בשמש. מה קורה לחום בתוכה?","ar":"تخيّلوا سيارة مغلقة متوقفة في الشمس. ماذا يحدث للحرارة داخلها؟","ru":"Представьте закрытую машину на солнце. Что происходит с теплом внутри?","en":"Picture a closed car parked in the sun. What happens to the heat inside?"},{"he":"הקרקע מתחממת מהשמש ופולטת חום. גזי חממה כמו פחמן דו-חמצני בולעים חלק מהחום הזה ומחזירים אותו, ולכן פחות חום יוצא לחלל. למשל, לילה מעונן נשאר לרוב חם יותר מלילה בהיר, כי העננים מעכבים את החום.","ar":"تسخن الأرض من الشمس وتُطلق حرارة. غازات الدفيئة مثل ثاني أكسيد الكربون تمتصّ جزءًا من هذه الحرارة وتعيده، فيخرج قدر أقل منها إلى الفضاء. مثلًا، الليلة الغائمة تبقى عادةً أدفأ من الليلة الصافية لأن الغيوم تؤخّر خروج الحرارة.","ru":"Поверхность нагревается от Солнца и отдаёт тепло. Парниковые газы, например углекислый газ, поглощают часть этого тепла и возвращают его, поэтому в космос уходит меньше тепла. Например, облачная ночь обычно теплее ясной, потому что облака задерживают тепло.","en":"The ground is warmed by the Sun and gives off heat. Greenhouse gases like carbon dioxide absorb some of this heat and send it back, so less heat escapes to space. For example, a cloudy night usually stays warmer than a clear one, because clouds hold the heat in."},null,[{"he":"הגז אינו בוער ואינו מייצר חום; הוא רק מעכב את יציאת החום לחלל.","ar":"الغاز لا يحترق ولا يُنتج حرارة، بل يؤخّر خروج الحرارة إلى الفضاء.","ru":"Газ не горит и не производит тепло, он лишь задерживает уход тепла в космос.","en":"The gas does not burn or make heat; it only slows heat escaping to space."},{"he":"חור האוזון נגרם בעיקר מחומרים אחרים, ואינו הסיבה להתחממות.","ar":"ثقب الأوزون سببته أساسًا مواد أخرى، وهو ليس سبب الاحترار.","ru":"Озоновую дыру вызвали в основном другие вещества, и она не причина потепления.","en":"The ozone hole was caused mainly by other substances and is not why Earth warms."},null,{"he":"גזים באוויר אינם משנים את המרחק בין כדור הארץ לשמש.","ar":"الغازات في الهواء لا تغيّر المسافة بين الأرض والشمس.","ru":"Газы в воздухе не меняют расстояние между Землёй и Солнцем.","en":"Gases in the air do not change the distance between Earth and the Sun."}]),
    Q("ev-1-04",{"he":"איזה תפקיד יש לשכבת האוזון שנמצאת גבוה מעלינו?","ar":"ما دور طبقة الأوزون الموجودة عاليًا فوقنا؟","ru":"Какую роль играет озоновый слой высоко над нами?","en":"What role does the ozone layer high above us play?"},[{"he":"לוכדת חום ומחממת את כדור הארץ","ar":"تحبس الحرارة وتُدفئ الأرض","ru":"Удерживает тепло и греет Землю","en":"Traps heat and warms the Earth"},{"he":"מייצרת את החמצן שאנחנו נושמים","ar":"تُنتج الأكسجين الذي نتنفّسه","ru":"Производит кислород, которым мы дышим","en":"Makes the oxygen we breathe"},{"he":"מונעת מגשם חומצי לרדת","ar":"تمنع سقوط المطر الحمضي","ru":"Не даёт выпадать кислотным дождям","en":"Stops acid rain from falling"},{"he":"מסננת חלק מקרינת UV של השמש","ar":"تحجب جزءًا من أشعة الشمس فوق البنفسجية","ru":"Задерживает часть УФ-излучения Солнца","en":"Blocks part of the Sun's UV radiation"}],3,{"he":"חשבו למה ממליצים למרוח קרם הגנה ביום שמשי.","ar":"فكّروا لماذا يُنصح بوضع واقي الشمس في يوم مشمس.","ru":"Подумайте, зачем советуют мазаться солнцезащитным кремом в солнечный день.","en":"Think about why people are told to use sunscreen on a sunny day."},{"he":"שכבת האוזון נמצאת גבוה באטמוספרה ובולעת חלק גדול מקרינת ה-UV המזיקה. זה נושא שונה מאפקט החממה, אף שמבלבלים ביניהם הרבה. למשל, קרינת UV יכולה לגרום לכוויות שמש, ושכבת האוזון מקטינה את כמותה.","ar":"توجد طبقة الأوزون عاليًا في الغلاف الجوي وتمتصّ جزءًا كبيرًا من الأشعة فوق البنفسجية الضارّة. هذا موضوع مختلف عن ظاهرة الدفيئة، رغم أن الخلط بينهما شائع. مثلًا، الأشعة فوق البنفسجية قد تسبّب حروق الشمس، وطبقة الأوزون تقلّل كميتها.","ru":"Озоновый слой находится высоко в атмосфере и поглощает большую часть вредного УФ-излучения. Это не то же самое, что парниковый эффект, хотя их часто путают. Например, УФ-излучение может вызвать солнечный ожог, а озоновый слой уменьшает его количество.","en":"The ozone layer sits high in the atmosphere and absorbs much of the harmful UV radiation. This is a different topic from the greenhouse effect, though people often mix them up. For example, UV can cause sunburn, and the ozone layer reduces how much reaches us."},null,[{"he":"לכידת חום היא אפקט החממה, וזה תפקיד שונה משל שכבת האוזון.","ar":"حبس الحرارة هو ظاهرة الدفيئة، وهو دور مختلف عن دور طبقة الأوزون.","ru":"Удержание тепла — это парниковый эффект, а не роль озонового слоя.","en":"Trapping heat is the greenhouse effect, a different role from the ozone layer's."},{"he":"את רוב החמצן שאנחנו נושמים מייצרים צמחים ואצות בפוטוסינתזה.","ar":"معظم الأكسجين الذي نتنفّسه تُنتجه النباتات والطحالب في التمثيل الضوئي.","ru":"Большую часть кислорода дают растения и водоросли при фотосинтезе.","en":"Most of the oxygen we breathe comes from plants and algae through photosynthesis."},{"he":"גשם חומצי נוצר מזיהום אוויר ליד הקרקע, ושכבת האוזון אינה עוצרת אותו.","ar":"المطر الحمضي ينشأ من تلوّث الهواء قرب الأرض، وطبقة الأوزون لا توقفه.","ru":"Кислотный дождь возникает из-за загрязнения у земли, и озоновый слой его не останавливает.","en":"Acid rain forms from air pollution near the ground, and the ozone layer does not stop it."},null]),
    Q("ev-1-05",{"he":"בחול של חוף הים נמצאו חתיכות פלסטיק קטנות מאוד. מאיפה מגיע רובן?","ar":"وُجدت في رمل الشاطئ قطع بلاستيك صغيرة جدًا. من أين يأتي معظمها؟","ru":"В песке на пляже нашли очень мелкие кусочки пластика. Откуда берётся большая их часть?","en":"Very small pieces of plastic were found in beach sand. Where do most of them come from?"},[{"he":"מבקבוקים ושקיות שהתפוררו","ar":"من قوارير وأكياس تفتّتت","ru":"От раскрошившихся бутылок и пакетов","en":"From bottles and bags that crumbled"},{"he":"מאבנים שנשחקו מהגלים לאורך שנים","ar":"من صخور طحنتها الأمواج على مرّ السنين","ru":"От камней, годами стёртых волнами","en":"From rocks worn down by waves over years"},{"he":"מאצות שמתו והתייבשו","ar":"من طحالب ماتت وجفّت","ru":"От погибших и высохших водорослей","en":"From algae that died and dried"},{"he":"ממלח שהתגבש בשמש","ar":"من ملح تبلور في الشمس","ru":"От соли, кристаллизовавшейся на солнце","en":"From salt that crystallized in the sun"}],0,{"he":"חשבו מה קורה לחפצים שנשארים שנים בשמש ובגלים.","ar":"فكّروا ماذا يحدث للأشياء التي تبقى سنوات في الشمس والأمواج.","ru":"Подумайте, что происходит с вещами, которые годами лежат на солнце и в волнах.","en":"Think about what happens to objects left for years in the sun and waves."},{"he":"שמש, חום וגלים מחלישים פלסטיק, והוא נשבר לחתיכות קטנות יותר ויותר. החתיכות הקטנות נקראות מיקרופלסטיק, וקשה מאוד לאסוף אותן. למשל, דלי פלסטיק ששוכב בחוף נעשה שביר ומתפורר לפירורים צבעוניים.","ar":"الشمس والحرارة والأمواج تُضعف البلاستيك، فيتكسّر إلى قطع أصغر فأصغر. تُسمّى القطع الصغيرة جزيئات البلاستيك الدقيقة، وجمعها صعب جدًا. مثلًا، دلو بلاستيكي ملقى على الشاطئ يصبح هشًّا ويتفتّت إلى فُتات ملوّن.","ru":"Солнце, жара и волны ослабляют пластик, и он ломается на всё более мелкие кусочки. Мелкие кусочки называют микропластиком, и собрать их очень трудно. Например, пластиковое ведро на пляже становится хрупким и крошится на цветные крошки.","en":"Sun, heat and waves weaken plastic, and it breaks into smaller and smaller pieces. These tiny pieces are called microplastics, and they are very hard to collect. For example, a plastic bucket left on the beach becomes brittle and crumbles into colorful bits."},null,[null,{"he":"אבנים שנשחקות הופכות לחול, לא לפלסטיק.","ar":"الصخور المطحونة تصبح رملًا، لا بلاستيكًا.","ru":"Стёртые камни превращаются в песок, а не в пластик.","en":"Worn rocks turn into sand, not into plastic."},{"he":"אצות הן חומר טבעי שמתפרק, והן אינן הופכות לפלסטיק.","ar":"الطحالب مادة طبيعية تتحلّل، ولا تتحوّل إلى بلاستيك.","ru":"Водоросли — природный материал, он разлагается и не становится пластиком.","en":"Algae are natural material that decays, and they do not become plastic."},{"he":"גבישי מלח נמסים במים, והם אינם פלסטיק.","ar":"بلّورات الملح تذوب في الماء، وهي ليست بلاستيكًا.","ru":"Кристаллы соли растворяются в воде и не являются пластиком.","en":"Salt crystals dissolve in water, and they are not plastic."}]),
    Q("ev-1-06",{"he":"נועה גרה 3 ק״מ מבית הספר. איזו דרך הגעה מקטינה בדרך כלל את טביעת הרגל הפחמנית שלה?","ar":"تسكن نوعا على بُعد 3 كم من المدرسة. أيّ طريقة وصول تقلّل عادةً بصمتها الكربونية؟","ru":"Ноа живёт в 3 км от школы. Какой способ добираться обычно уменьшает её углеродный след?","en":"Noa lives 3 km from school. Which way of getting there usually shrinks her carbon footprint?"},[{"he":"נסיעה לבד ברכב פרטי","ar":"السفر وحدها في سيارة خاصة","ru":"Ехать одной на личной машине","en":"Riding alone in a private car"},{"he":"רכיבה על אופניים","ar":"ركوب الدرّاجة الهوائية","ru":"Ехать на велосипеде","en":"Riding a bicycle"},{"he":"נסיעה ברכב גדול יותר","ar":"السفر في سيارة أكبر","ru":"Ехать на машине побольше","en":"Riding in a bigger car"},{"he":"נסיעה במונית בדרך ארוכה","ar":"السفر بسيارة أجرة عبر طريق أطول","ru":"Ехать на такси длинным путём","en":"Taking a taxi by a longer route"}],1,{"he":"בדקו בכל אפשרות: האם נשרף דלק, ובשביל כמה אנשים.","ar":"افحصوا في كل خيار: هل يُحرق وقود، ولأجل كم شخصًا؟","ru":"Проверьте каждый вариант: сжигается ли топливо и ради скольких людей.","en":"Check each option: is fuel burned, and for how many people?"},{"he":"טביעת רגל פחמנית היא כמות גזי החממה שנפלטים בגלל פעולה שלנו. אופניים אינם שורפים דלק בזמן הרכיבה, ולכן הפליטה קטנה מאוד. למשל, מי שרוכב לבית הספר במקום להגיע ברכב חוסך דלק בכל יום.","ar":"البصمة الكربونية هي كمية غازات الدفيئة المنبعثة بسبب نشاطنا. الدرّاجة لا تحرق وقودًا أثناء الركوب، لذلك انبعاثها صغير جدًا. مثلًا، من يذهب إلى المدرسة بالدرّاجة بدل السيارة يوفّر وقودًا كل يوم.","ru":"Углеродный след — это количество парниковых газов, выброшенных из-за наших действий. Велосипед не сжигает топливо во время езды, поэтому выбросы очень малы. Например, кто ездит в школу на велосипеде, а не на машине, каждый день экономит топливо.","en":"A carbon footprint is the amount of greenhouse gases released because of what we do. A bicycle burns no fuel while riding, so its emissions are very small. For example, cycling to school instead of being driven saves fuel every day."},null,[{"he":"רכב פרטי עם נוסעת אחת שורף דלק בשביל אדם אחד בלבד.","ar":"السيارة الخاصة براكبة واحدة تحرق الوقود من أجل شخص واحد فقط.","ru":"Машина с одним пассажиром сжигает топливо ради одного человека.","en":"A private car with one rider burns fuel for just one person."},null,{"he":"רכב גדול יותר צורך בדרך כלל יותר דלק, ולכן פולט יותר.","ar":"السيارة الأكبر تستهلك عادةً وقودًا أكثر، فتُطلق انبعاثات أكثر.","ru":"Большая машина обычно тратит больше топлива и больше выбрасывает.","en":"A bigger car usually uses more fuel, so it emits more."},{"he":"דרך ארוכה יותר ברכב פירושה יותר דלק ויותר פליטות.","ar":"الطريق الأطول بالسيارة يعني وقودًا أكثر وانبعاثات أكثر.","ru":"Более длинный путь на машине означает больше топлива и выбросов.","en":"A longer drive means more fuel and more emissions."}]),
    Q("ev-1-07",{"he":"שאריות מזון נקברות במטמנה, עמוק מתחת לפסולת אחרת. איזה גז עלול להיפלט מהן?","ar":"تُدفن بقايا الطعام في المكبّ عميقًا تحت نفايات أخرى. أيّ غاز قد ينبعث منها؟","ru":"Остатки еды закапывают на свалке глубоко под другим мусором. Какой газ может от них выделяться?","en":"Food scraps are buried in a landfill, deep under other waste. Which gas may be released from them?"},[{"he":"חמצן","ar":"الأكسجين","ru":"Кислород","en":"Oxygen"},{"he":"הליום","ar":"الهيليوم","ru":"Гелий","en":"Helium"},{"he":"מתאן","ar":"الميثان","ru":"Метан","en":"Methane"},{"he":"אוזון","ar":"الأوزون","ru":"Озон","en":"Ozone"}],2,{"he":"חשבו מה קורה לחומר אורגני שמתפרק בלי אוויר.","ar":"فكّروا ماذا يحدث لمادة عضوية تتحلّل دون هواء.","ru":"Подумайте, что происходит с органикой, которая разлагается без воздуха.","en":"Think about what happens to organic matter that breaks down without air."},{"he":"במטמנה כמעט אין אוויר, וחיידקים מפרקים את המזון בלי חמצן. בתהליך הזה נוצר מתאן, שהוא גז חממה חזק. למשל, מטמנות מודרניות אוספות את הגז בצינורות, ולפעמים מייצרות ממנו חשמל.","ar":"في المكبّ لا يكاد يوجد هواء، فتحلّل البكتيريا الطعام دون أكسجين. في هذه العملية ينتج الميثان، وهو غاز دفيئة قوي. مثلًا، المكبّات الحديثة تجمع الغاز في أنابيب، وأحيانًا تُنتج منه الكهرباء.","ru":"На свалке почти нет воздуха, и бактерии разлагают еду без кислорода. При этом образуется метан — сильный парниковый газ. Например, современные полигоны собирают газ по трубам и иногда делают из него электричество.","en":"A landfill has almost no air, so bacteria break down food without oxygen. This produces methane, a strong greenhouse gas. For example, modern landfills collect the gas in pipes and sometimes use it to make electricity."},null,[{"he":"חיידקים במטמנה צורכים חמצן ואינם מייצרים אותו.","ar":"البكتيريا في المكبّ تستهلك الأكسجين ولا تُنتجه.","ru":"Бактерии на свалке потребляют кислород, а не производят его.","en":"Bacteria in a landfill use up oxygen rather than make it."},{"he":"הליום אינו נוצר מפירוק של מזון.","ar":"الهيليوم لا ينتج من تحلّل الطعام.","ru":"Гелий не образуется при разложении еды.","en":"Helium does not form when food breaks down."},null,{"he":"אוזון אינו הגז העיקרי שנוצר מפירוק מזון בלי אוויר.","ar":"الأوزون ليس الغاز الرئيسي الناتج عن تحلّل الطعام دون هواء.","ru":"Озон не главный газ, образующийся при гниении еды без воздуха.","en":"Ozone is not the main gas formed when food rots without air."}]),
    Q("ev-1-08",{"he":"כביש חדש חוצה שטח פתוח שבו חיים צבאים. בלי גשרים או מעברים, מה עלול לקרות לצבאים?","ar":"طريق جديد يقطع منطقة مفتوحة تعيش فيها الغزلان. دون جسور أو معابر، ماذا قد يحدث للغزلان؟","ru":"Новая дорога пересекает открытую местность, где живут газели. Что может случиться с газелями, если нет мостов и переходов?","en":"A new road crosses open land where gazelles live. Without bridges or crossings, what may happen to the gazelles?"},[{"he":"הם יעברו לגור בתוך העיר הגדולה הקרובה","ar":"ستنتقل للعيش في المدينة الكبيرة القريبة","ru":"Они переселятся в ближайший большой город","en":"They will move into the nearby big city"},{"he":"הם יתרבו מהר יותר משהיו קודם","ar":"ستتكاثر أسرع مما كانت من قبل","ru":"Они станут размножаться быстрее, чем раньше","en":"They will breed faster than they used to"},{"he":"הם יפסיקו לגמרי לחפש מזון","ar":"ستتوقف تمامًا عن البحث عن الطعام","ru":"Они совсем перестанут искать пищу","en":"They will stop looking for food altogether"},{"he":"הם יתפצלו לקבוצות קטנות ומבודדות","ar":"ستنقسم إلى مجموعات صغيرة ومعزولة","ru":"Они разделятся на мелкие изолированные группы","en":"They will split into small, isolated groups"}],3,{"he":"דמיינו קו שאי אפשר לחצות, שעובר באמצע הבית של בעלי החיים.","ar":"تخيّلوا خطًا لا يمكن عبوره يمرّ وسط موطن الحيوانات.","ru":"Представьте непреодолимую линию посреди дома животных.","en":"Picture a line that cannot be crossed running through the animals' home."},{"he":"כביש שאי אפשר לחצות מחלק את בית הגידול לחלקים קטנים. בכל חלק יש פחות פרטים ופחות גיוון גנטי, והאוכלוסייה נעשית פגיעה יותר. למשל, מעבר אקולוגי מתחת לכביש מאפשר לבעלי חיים לעבור בבטחה בין הצדדים.","ar":"الطريق الذي لا يمكن عبوره يقسّم الموطن إلى أجزاء صغيرة. في كل جزء أفراد أقل وتنوّع وراثي أقل، فتصبح المجموعة أكثر هشاشة. مثلًا، ممرّ بيئي تحت الطريق يتيح للحيوانات العبور بأمان بين الجانبين.","ru":"Непроходимая дорога делит среду обитания на маленькие части. В каждой части меньше особей и меньше генетического разнообразия, и популяция становится уязвимее. Например, экологический проход под дорогой позволяет животным безопасно переходить с одной стороны на другую.","en":"A road that cannot be crossed splits the habitat into small pieces. Each piece has fewer animals and less genetic variety, so the population becomes more vulnerable. For example, a wildlife passage under the road lets animals cross safely from side to side."},null,[{"he":"בעלי חיים בר אינם עוברים לעיר רק בגלל כביש, והעיר אינה בית גידול מתאים להם.","ar":"الحيوانات البرية لا تنتقل إلى المدينة بسبب طريق، والمدينة ليست موطنًا مناسبًا لها.","ru":"Дикие животные не переселяются в город из-за дороги, и город им не подходит.","en":"Wild animals do not move to a city because of a road, and a city is not a fitting habitat."},{"he":"כביש אינו מגביר רבייה; הוא דווקא מקשה על מפגש בין בני זוג.","ar":"الطريق لا يزيد التكاثر، بل يصعّب التقاء الأزواج.","ru":"Дорога не ускоряет размножение, а наоборот мешает встречам партнёров.","en":"A road does not boost breeding; it makes it harder for mates to meet."},{"he":"הצבאים ימשיכו לחפש מזון, אבל יתקשו להגיע לחלק מהשטח.","ar":"ستواصل الغزلان البحث عن الطعام، لكنها ستجد صعوبة في الوصول إلى جزء من المنطقة.","ru":"Газели продолжат искать пищу, но им будет трудно попасть в часть территории.","en":"The gazelles will keep looking for food but will struggle to reach part of the area."},null]),
    Q("ev-1-09",{"he":"רכב חשמלי אינו פולט גזים מהמנוע בזמן הנסיעה. ממה תלויה בעיקר כמות הפליטות שנגרמות בגלל הנסיעה בו?","ar":"السيارة الكهربائية لا تُطلق غازات من المحرّك أثناء السير. على ماذا تعتمد أساسًا الانبعاثات الناتجة عن السفر بها؟","ru":"Электромобиль не выпускает газы из мотора во время езды. От чего в основном зависят выбросы, вызванные поездкой на нём?","en":"An electric car releases no engine gases while driving. What do the emissions caused by driving it mainly depend on?"},[{"he":"ממקור החשמל שבו טוענים אותו","ar":"على مصدر الكهرباء الذي يُشحن منه","ru":"От источника электричества для зарядки","en":"On the power source used to charge it"},{"he":"מכמות הבנזין שנשארה במיכל שלו","ar":"على كمية البنزين الباقية في خزّانها","ru":"От количества бензина, оставшегося в баке","en":"On the amount of petrol left in its tank"},{"he":"מצבע הפח החיצוני שלו","ar":"على لون هيكلها الخارجي","ru":"От цвета его кузова","en":"On the color of its body"},{"he":"מעוצמת הרדיו בזמן הנסיעה","ar":"على ارتفاع صوت الراديو أثناء السير","ru":"От громкости радио в дороге","en":"On the radio volume while driving"}],0,{"he":"חשבו מאיפה מגיעה האנרגיה שבסוללה, ומה קרה שם.","ar":"فكّروا من أين تأتي الطاقة في البطارية، وماذا حدث هناك.","ru":"Подумайте, откуда берётся энергия в батарее и что там происходило.","en":"Think about where the energy in the battery comes from, and what happened there."},{"he":"הסוללה נטענת בחשמל מהרשת. אם החשמל הופק משריפת דלק, הפליטות קרו בתחנת הכוח. אם הוא הופק משמש או מרוח, הפליטות קטנות בהרבה. למשל, רכב שנטען מפאנלים סולאריים על הגג גורם לפחות פליטות מרכב שנטען מתחנת פחם.","ar":"تُشحن البطارية بكهرباء من الشبكة. إذا أُنتجت الكهرباء بحرق الوقود، فالانبعاثات حدثت في محطة الطاقة. وإذا أُنتجت من الشمس أو الرياح، فالانبعاثات أقل بكثير. مثلًا، سيارة تُشحن من ألواح شمسية على السطح تسبّب انبعاثات أقل من سيارة تُشحن من محطة فحم.","ru":"Батарея заряжается от сети. Если электричество получено сжиганием топлива, выбросы произошли на электростанции. Если от солнца или ветра, выбросы намного меньше. Например, машина, заряженная от солнечных панелей на крыше, даёт меньше выбросов, чем заряженная от угольной станции.","en":"The battery is charged from the grid. If the power came from burning fuel, the emissions happened at the power plant. If it came from sun or wind, emissions are much lower. For example, a car charged from rooftop solar panels causes fewer emissions than one charged from a coal plant."},null,[null,{"he":"לרכב חשמלי אין מיכל בנזין; הוא נוסע על חשמל מסוללה.","ar":"ليس للسيارة الكهربائية خزّان بنزين، فهي تسير بكهرباء من بطارية.","ru":"У электромобиля нет бензобака, он едет на электричестве из батареи.","en":"An electric car has no petrol tank; it runs on battery power."},{"he":"צבע הרכב אינו משנה כמה חשמל נדרש ואיך הוא מיוצר.","ar":"لون السيارة لا يغيّر كمية الكهرباء اللازمة ولا طريقة إنتاجها.","ru":"Цвет машины не влияет на нужное электричество и способ его получения.","en":"The car's color does not change how much power is needed or how it is made."},{"he":"הרדיו צורך מעט מאוד חשמל, ואינו קובע את רוב הפליטות.","ar":"الراديو يستهلك كهرباء قليلة جدًا، ولا يحدّد معظم الانبعاثات.","ru":"Радио потребляет очень мало энергии и не определяет основные выбросы.","en":"The radio uses very little power and does not decide most emissions."}]),
    Q("ev-1-10",{"he":"ביום חם ובלי רוח נראה ערפל בצבע חום-אפור מעל עיר גדולה. מה ההסבר הסביר?","ar":"في يوم حارّ بلا رياح يظهر ضباب بنّي رمادي فوق مدينة كبيرة. ما التفسير المعقول؟","ru":"В жаркий безветренный день над большим городом видна серо-бурая дымка. Какое объяснение вероятно?","en":"On a hot, windless day a brown-gray haze appears over a big city. What is the likely explanation?"},[{"he":"אדי מים מבריכות השחייה מתקררים באוויר","ar":"بخار ماء من برك السباحة يبرد في الهواء","ru":"Пар из бассейнов остывает в воздухе","en":"Vapor from swimming pools cools in the air"},{"he":"המזהמים לא מתפזרים ונשארים מעל העיר","ar":"الملوِّثات لا تتبدّد وتبقى فوق المدينة","ru":"Загрязнения не рассеиваются и остаются над городом","en":"Pollutants do not disperse and stay over the city"},{"he":"האור מהבניינים צובע את האוויר בצבע חום","ar":"أضواء المباني تلوّن الهواء بالبنّي","ru":"Свет зданий окрашивает воздух в бурый цвет","en":"Building lights tint the air brown"},{"he":"ענן גשם רגיל שעומד לרדת על העיר","ar":"سحابة مطر عادية على وشك الهطول","ru":"Обычная дождевая туча вот-вот прольётся","en":"An ordinary rain cloud about to fall"}],1,{"he":"חשבו מה בדרך כלל מפזר עשן מארובה או ממדורה.","ar":"فكّروا ما الذي يبدّد عادةً دخان المدخنة أو النار.","ru":"Подумайте, что обычно разносит дым от трубы или костра.","en":"Think about what usually spreads out smoke from a chimney or campfire."},{"he":"רכבים, תעשייה ותחנות כוח פולטים חלקיקים וגזים. כשאין רוח, המזהמים לא נישאים הלאה ומצטברים מעל העיר. למשל, ביום חם ושקט אפשר לפעמים לראות מנקודה גבוהה שכבה עכורה מעל העיר.","ar":"السيارات والصناعة ومحطات الطاقة تُطلق جسيمات وغازات. عندما لا توجد رياح، لا تُحمل الملوِّثات بعيدًا فتتراكم فوق المدينة. مثلًا، في يوم حارّ وهادئ يمكن أحيانًا رؤية طبقة عكرة فوق المدينة من مكان مرتفع.","ru":"Машины, промышленность и электростанции выбрасывают частицы и газы. Когда нет ветра, загрязнения никуда не уносятся и скапливаются над городом. Например, в жаркий тихий день с высокой точки иногда видна мутная пелена над городом.","en":"Cars, industry and power plants release particles and gases. With no wind, pollutants are not carried away and build up over the city. For example, on a hot, still day you can sometimes see a murky layer over the city from a high point."},null,[{"he":"אדי מים מבריכות אינם יוצרים ערפל בצבע חום-אפור מעל עיר שלמה.","ar":"بخار الماء من البرك لا يكوّن ضبابًا بنّيًا رماديًا فوق مدينة كاملة.","ru":"Пар из бассейнов не создаёт серо-бурую дымку над целым городом.","en":"Vapor from pools does not create a brown-gray haze over a whole city."},null,{"he":"אור אינו צובע את האוויר; הצבע נובע מחלקיקים וגזים מזהמים.","ar":"الضوء لا يلوّن الهواء؛ اللون ناتج عن جسيمات وغازات ملوِّثة.","ru":"Свет не окрашивает воздух, цвет дают частицы и загрязняющие газы.","en":"Light does not tint the air; the color comes from polluting particles and gases."},{"he":"שכבה נמוכה בצבע חום-אפור מעל עיר מעידה על זיהום, לא על ענן גשם.","ar":"الطبقة المنخفضة البنّية الرمادية فوق المدينة تدلّ على تلوّث، لا على سحابة مطر.","ru":"Низкая серо-бурая пелена над городом говорит о загрязнении, а не о туче.","en":"A low brown-gray layer over a city points to pollution, not a rain cloud."}]),
    Q("ev-1-11",{"he":"על גגות רבים בישראל יש דוד שמש. איזו אנרגיה הוא מנצל כדי לחמם את המים?","ar":"على أسطح كثيرة في إسرائيل يوجد سخّان شمسي. أيّ طاقة يستغلّ لتسخين الماء؟","ru":"На многих крышах в Израиле стоит солнечный бойлер. Какую энергию он использует, чтобы греть воду?","en":"Many roofs in Israel have a solar water heater. What energy does it use to heat the water?"},[{"he":"חשמל מתחנת כוח בלבד","ar":"كهرباء من محطة طاقة فقط","ru":"Только ток от электростанции","en":"Only power from a power plant"},{"he":"חום מהאדמה שמתחת לבית","ar":"حرارة الأرض تحت البيت","ru":"Тепло земли под домом","en":"Heat from the ground under the house"},{"he":"חום מקרינת השמש","ar":"حرارة أشعة الشمس","ru":"Тепло солнечных лучей","en":"Heat from sunlight"},{"he":"רוח שנושבת על הגג","ar":"رياح تهبّ على السطح","ru":"Ветер, дующий над крышей","en":"Wind blowing over the roof"}],2,{"he":"חשבו למה הקולטים הכהים מונחים בזווית על הגג.","ar":"فكّروا لماذا توضع اللواقط الداكنة مائلة على السطح.","ru":"Подумайте, зачем тёмные коллекторы ставят на крыше под наклоном.","en":"Think about why the dark collectors are tilted on the roof."},{"he":"הקולטים כהים וסופגים קרינה, והחום עובר למים שזורמים בתוכם. המים החמים עולים ונאגרים במיכל המבודד. למשל, ביום קיץ שמשי אפשר להתקלח במים חמים בלי להדליק את החימום החשמלי.","ar":"اللواقط داكنة وتمتصّ الأشعة، وتنتقل الحرارة إلى الماء الذي يجري فيها. يرتفع الماء الساخن ويُخزَّن في الخزّان المعزول. مثلًا، في يوم صيفي مشمس يمكن الاستحمام بماء ساخن دون تشغيل التسخين الكهربائي.","ru":"Коллекторы тёмные и поглощают излучение, а тепло переходит к воде внутри них. Горячая вода поднимается и хранится в утеплённом баке. Например, в солнечный летний день можно принять горячий душ, не включая электрический нагрев.","en":"The collectors are dark and absorb radiation, and the heat passes to the water flowing inside. The hot water rises and is stored in an insulated tank. For example, on a sunny summer day you can take a hot shower without switching on the electric heating."},null,[{"he":"דוד שמש מחמם מים בעיקר מהשמש; גוף חימום חשמלי משמש רק כגיבוי.","ar":"السخّان الشمسي يسخّن الماء أساسًا من الشمس، والتسخين الكهربائي احتياط فقط.","ru":"Солнечный бойлер греет воду в основном от солнца, а электротэн — лишь запасной.","en":"A solar heater warms water mainly from the sun; an electric element is only a backup."},{"he":"הקולטים על הגג פונים לשמש, ואינם לוקחים חום מהאדמה.","ar":"اللواقط على السطح موجّهة نحو الشمس، ولا تأخذ حرارة من الأرض.","ru":"Коллекторы на крыше обращены к солнцу и не берут тепло из земли.","en":"The collectors on the roof face the sun and take no heat from the ground."},null,{"he":"אין בדוד שמש חלקים שמסתובבים ברוח, ורוח אינה מחממת מים.","ar":"لا توجد في السخّان الشمسي أجزاء تدور بالرياح، والرياح لا تسخّن الماء.","ru":"В солнечном бойлере нет деталей, вращаемых ветром, и ветер не греет воду.","en":"A solar heater has no parts turned by wind, and wind does not heat water."}]),
    Q("ev-1-12",{"he":"איזה הרגל מקטין בצורה הכי ישירה את כמות הפסולת מפלסטיק שיוצאת מהבית?","ar":"أيّ عادة تقلّل بشكل مباشر أكثر من غيرها كمية نفايات البلاستيك الخارجة من البيت؟","ru":"Какая привычка напрямую сильнее всего уменьшает количество пластикового мусора из дома?","en":"Which habit most directly cuts the amount of plastic waste leaving the home?"},[{"he":"שריפת שקיות בחצר","ar":"حرق الأكياس في الساحة","ru":"Сжигать пакеты во дворе","en":"Burning bags in the yard"},{"he":"קבירת בקבוקים בגינה","ar":"دفن القوارير في الحديقة","ru":"Закапывать бутылки в саду","en":"Burying bottles in the garden"},{"he":"קניית בקבוק מים חדש בכל יום","ar":"شراء قارورة ماء جديدة كل يوم","ru":"Покупать новую бутылку воды каждый день","en":"Buying a new water bottle every day"},{"he":"שימוש חוזר בבקבוק ובשקית","ar":"إعادة استخدام القارورة والكيس","ru":"Повторно использовать бутылку и пакет","en":"Reusing a bottle and a bag"}],3,{"he":"חשבו איזו פעולה מונעת את הפסולת עוד לפני שהיא נוצרת.","ar":"فكّروا أيّ فعل يمنع النفايات قبل أن تتكوّن.","ru":"Подумайте, какое действие не даёт мусору даже появиться.","en":"Think about which action stops waste before it is even created."},{"he":"הדרך הטובה ביותר לטפל בפסולת היא לא ליצור אותה. כל בקבוק או שקית שמשמשים שוב ושוב חוסכים פריט חדש שהיה הופך לפסולת. למשל, בקבוק רב-פעמי שממלאים בברזייה מחליף בקבוקים חד-פעמיים רבים.","ar":"أفضل طريقة لمعالجة النفايات هي عدم إنتاجها. كل قارورة أو كيس يُستعمل مرارًا يوفّر قطعة جديدة كانت ستصبح نفايات. مثلًا، قارورة متعددة الاستعمال تُملأ من مبرّدة الماء تحلّ محلّ قوارير كثيرة تُستعمل مرة واحدة.","ru":"Лучший способ справиться с мусором — не создавать его. Каждая бутылка или пакет, которые используют снова и снова, заменяют новую вещь, которая стала бы мусором. Например, многоразовая бутылка, которую наполняют у фонтанчика, заменяет много одноразовых.","en":"The best way to handle waste is not to create it. Each bottle or bag used again and again saves a new item that would have become waste. For example, a refillable bottle filled at a water fountain replaces many single-use bottles."},null,[{"he":"שריפת פלסטיק פולטת עשן מזיק, והיא אינה מונעת את יצירת הפסולת.","ar":"حرق البلاستيك يُطلق دخانًا ضارًا ولا يمنع تكوّن النفايات.","ru":"Сжигание пластика даёт вредный дым и не предотвращает появление мусора.","en":"Burning plastic releases harmful smoke and does not prevent the waste."},{"he":"פלסטיק קבור נשאר באדמה שנים רבות, והפסולת עדיין נוצרה.","ar":"البلاستيك المدفون يبقى في التربة سنوات طويلة، والنفايات تكوّنت أصلًا.","ru":"Закопанный пластик годами остаётся в земле, а мусор всё равно появился.","en":"Buried plastic stays in the soil for years, and the waste was still made."},{"he":"בקבוק חדש בכל יום מוסיף עוד ועוד פסולת.","ar":"قارورة جديدة كل يوم تضيف المزيد من النفايات.","ru":"Новая бутылка каждый день добавляет всё больше мусора.","en":"A new bottle every day adds more and more waste."},null]),
    Q("ev-1-13",{"he":"משפחה רוצה לחסוך במים בבית. איזו פעולה תעזור לה?","ar":"تريد عائلة توفير المياه في البيت. أيّ فعل سيساعدها؟","ru":"Семья хочет экономить воду дома. Какое действие ей поможет?","en":"A family wants to save water at home. Which action will help?"},[{"he":"לתקן ברז שמטפטף כל הזמן","ar":"إصلاح حنفية تقطر طوال الوقت","ru":"Починить кран, который всё время капает","en":"Fixing a tap that drips all the time"},{"he":"להשקות את הגינה בצהריים","ar":"ريّ الحديقة وقت الظهيرة","ru":"Поливать сад в полдень","en":"Watering the garden at noon"},{"he":"לשטוף את המרפסת בצינור","ar":"غسل الشرفة بالخرطوم","ru":"Мыть балкон из шланга","en":"Washing the balcony with a hose"},{"he":"להפעיל מדיח כלים חצי ריק","ar":"تشغيل جلّاية صحون نصف فارغة","ru":"Запускать посудомойку полупустой","en":"Running a half-empty dishwasher"}],0,{"he":"חשבו איפה מים הולכים לאיבוד בלי שאף אחד משתמש בהם.","ar":"فكّروا أين يضيع الماء دون أن يستعمله أحد.","ru":"Подумайте, где вода теряется, хотя ею никто не пользуется.","en":"Think about where water is lost without anyone using it."},{"he":"ברז מטפטף מאבד מים כל שעה, גם בלילה וגם כשאין איש בבית. תיקון פשוט, כמו החלפת אטם, עוצר את הבזבוז. למשל, כוס שמניחים מתחת לברז מטפטף יכולה להתמלא תוך זמן קצר.","ar":"الحنفية التي تقطر تفقد الماء كل ساعة، حتى في الليل وعندما لا يكون أحد في البيت. إصلاح بسيط مثل تغيير الحَشيّة يوقف الهدر. مثلًا، كوب يوضع تحت حنفية تقطر قد يمتلئ خلال وقت قصير.","ru":"Капающий кран теряет воду каждый час, даже ночью и когда дома никого нет. Простой ремонт, например замена прокладки, останавливает потери. Например, стакан под капающим краном может быстро наполниться.","en":"A dripping tap loses water every hour, even at night and when no one is home. A simple repair, like replacing a washer, stops the waste. For example, a cup placed under a dripping tap can fill up quickly."},null,[null,{"he":"בצהריים חלק גדול ממי ההשקיה מתאדה, ולכן צריך יותר מים.","ar":"في الظهيرة يتبخّر جزء كبير من ماء الريّ، فنحتاج إلى ماء أكثر.","ru":"В полдень много воды для полива испаряется, и её нужно больше.","en":"At noon much of the watering evaporates, so more water is needed."},{"he":"שטיפה בצינור משתמשת בהרבה יותר מים מניקוי בדלי או במגב.","ar":"الغسل بالخرطوم يستهلك ماءً أكثر بكثير من التنظيف بدلو أو مِمسحة.","ru":"Мытьё из шланга тратит намного больше воды, чем ведро или швабра.","en":"Hosing down uses far more water than cleaning with a bucket or mop."},{"he":"מדיח חצי ריק משתמש כמעט באותה כמות מים כמו מדיח מלא.","ar":"الجلّاية نصف الفارغة تستهلك تقريبًا كمية الماء نفسها كالممتلئة.","ru":"Полупустая посудомойка тратит почти столько же воды, сколько полная.","en":"A half-empty dishwasher uses nearly as much water as a full one."}]),
    Q("ev-1-14",{"he":"בבית הספר אוספים קליפות של פירות וירקות לקומפוסטר. מה יתקבל אחרי כמה חודשים?","ar":"في المدرسة تُجمع قشور الفواكه والخضار في حاوية سماد. ماذا سينتج بعد بضعة أشهر؟","ru":"В школе собирают очистки фруктов и овощей в компостер. Что получится через несколько месяцев?","en":"At school, fruit and vegetable peels are collected in a compost bin. What will form after a few months?"},[{"he":"פלסטיק חדש לייצור בקבוקים","ar":"بلاستيك جديد لصنع القوارير","ru":"Новый пластик для производства бутылок","en":"New plastic for making bottles"},{"he":"אדמה עשירה שמזינה צמחים","ar":"تربة غنية تغذّي النباتات","ru":"Богатая почва, питающая растения","en":"Rich soil that feeds plants"},{"he":"מים נקיים לשתייה","ar":"مياه نظيفة للشرب","ru":"Чистая питьевая вода","en":"Clean drinking water"},{"he":"דלק לרכבים ולמשאיות","ar":"وقود للسيارات والشاحنات","ru":"Топливо для машин и грузовиков","en":"Fuel for cars and trucks"}],1,{"he":"חשבו מה קורה לעלים שנופלים ביער ונשארים על הקרקע.","ar":"فكّروا ماذا يحدث لأوراق الشجر التي تسقط في الغابة وتبقى على الأرض.","ru":"Подумайте, что происходит с листьями, которые падают в лесу и остаются на земле.","en":"Think about what happens to leaves that fall in a forest and stay on the ground."},{"he":"בקומפוסטר חיידקים, פטריות ותולעים מפרקים את הקליפות בעזרת אוויר. התוצר הוא חומר כהה שמחזיר מזון לאדמה. למשל, אפשר לפזר את הקומפוסט בערוגות של גינת בית הספר במקום דשן קנוי.","ar":"في حاوية السماد تحلّل البكتيريا والفطريات والديدان القشور بمساعدة الهواء. الناتج مادة داكنة تُعيد الغذاء إلى التربة. مثلًا، يمكن نثر السماد في أحواض حديقة المدرسة بدل سماد مشترى.","ru":"В компостере бактерии, грибы и черви с помощью воздуха разлагают очистки. Получается тёмное вещество, которое возвращает питание в почву. Например, компост можно рассыпать по грядкам школьного сада вместо покупного удобрения.","en":"In the compost bin, bacteria, fungi and worms break down the peels with the help of air. The result is a dark material that returns nutrients to the soil. For example, the compost can be spread on the school garden beds instead of bought fertilizer."},null,[{"he":"קליפות הן חומר אורגני שמתפרק, והן אינן הופכות לפלסטיק.","ar":"القشور مادة عضوية تتحلّل، ولا تتحوّل إلى بلاستيك.","ru":"Очистки — органика, они разлагаются и не становятся пластиком.","en":"Peels are organic matter that decays, and they do not become plastic."},null,{"he":"בקומפוסט נוצר חומר מוצק לאדמה, לא מים נקיים לשתייה.","ar":"في السماد تتكوّن مادة صلبة للتربة، لا ماء نظيف للشرب.","ru":"В компосте получается твёрдое вещество для почвы, а не питьевая вода.","en":"Compost makes solid material for soil, not clean drinking water."},{"he":"קומפוסטר בבית ספר אינו מייצר דלק, אלא חומר להעשרת האדמה.","ar":"حاوية السماد في المدرسة لا تُنتج وقودًا، بل مادة لإغناء التربة.","ru":"Школьный компостер не производит топливо, а даёт вещество для почвы.","en":"A school compost bin makes no fuel, only material to enrich soil."}])
