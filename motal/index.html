  [
    Q("env-issues-2-1",{"he":"למה שקית פלסטיק שנשארת בחוף עלולה להזיק גם זמן רב אחר כך?","ar":"لماذا قد يضرّ كيس بلاستيكي تُرك على الشاطئ بعد وقت طويل؟","ru":"Почему пластиковый пакет, оставленный на пляже, может вредить и спустя долгое время?","en":"Why can a plastic bag left on a beach cause harm long afterward?"},[{"he":"כי היא מתאדה ומזהמת עננים","ar":"لأنها تتبخر وتلوّث الغيوم","ru":"Потому что он испаряется и загрязняет облака","en":"It evaporates and pollutes clouds"},{"he":"כי היא נהפכת לדשן ומפרה אצות","ar":"لأنها تتحول إلى سماد يغذي الطحالب","ru":"Потому что он становится удобрением для водорослей","en":"It turns into fertilizer for algae"},{"he":"כי היא שואבת את כל החמצן מהמים","ar":"لأنها تمتص كل الأكسجين من الماء","ru":"Потому что он поглощает весь кислород из воды","en":"It absorbs all oxygen from the water"},{"he":"כי היא מתפרקת לאט ופוגעת בבעלי חיים","ar":"لأنها تتحلل ببطء وتضرّ الحيوانات","ru":"Потому что он разлагается медленно и вредит животным","en":"It breaks down slowly and harms animals"}],3,{"he":"חשבו מה קורה לחומר שנשאר בסביבה שנים ומה עלול לקרות לבעלי חיים שנתקלים בו.","ar":"فكّروا بما يحدث لمادة تبقى في البيئة سنوات، وللحيوانات التي تصادفها.","ru":"Подумайте о материале, который годами остаётся в природе, и о животных, которые с ним сталкиваются.","en":"Think about a material that stays outdoors for years and animals that encounter it."},{"he":"פלסטיק אינו נעלם במהירות: הוא יכול להישאר בסביבה שנים רבות ולהתפורר לחתיכות קטנות. למשל, צב ים עלול לבלוע שקית שנסחפה מחוף לים.","ar":"لا يختفي البلاستيك بسرعة: قد يبقى في البيئة سنوات كثيرة ويتفتت إلى قطع صغيرة. مثلًا، قد تبتلع سلحفاة بحرية كيسًا جرفته المياه من الشاطئ.","ru":"Пластик не исчезает быстро: он может оставаться в природе много лет и распадаться на мелкие части. Например, морская черепаха может проглотить пакет, попавший с пляжа в море.","en":"Plastic does not disappear quickly: it can remain for many years and break into small pieces. For example, a sea turtle may swallow a bag washed from the beach into the sea."},null,[{"he":"שקית פלסטיק אינה מתאדה לעננים בתנאי החוף הרגילים.","ar":"الكيس البلاستيكي لا يتبخر إلى الغيوم في ظروف الشاطئ العادية.","ru":"При обычных условиях на пляже пакет не испаряется в облака.","en":"A plastic bag does not evaporate into clouds under ordinary beach conditions."},{"he":"פלסטיק אינו הופך לדשן שמזין צמחים או אצות.","ar":"البلاستيك لا يتحول إلى سماد يغذي النباتات أو الطحالب.","ru":"Пластик не превращается в удобрение для растений или водорослей.","en":"Plastic does not turn into fertilizer for plants or algae."},{"he":"שקית אינה שואבת את כל החמצן מהמים; הסכנה כאן היא הישארותה ופגיעתה בבעלי חיים.","ar":"الكيس لا يمتص كل الأكسجين من الماء؛ الخطر هنا بقاؤه وإضراره بالحيوانات.","ru":"Пакет не забирает весь кислород из воды; здесь опасны его стойкость и вред животным.","en":"A bag does not absorb all oxygen from water; the concern here is its persistence and harm to animals."},null]),
    Q("env-issues-2-2",{"he":"איך מפרידים את רוב המלח ממי הים במתקני התפלה בישראל?","ar":"كيف يُفصل معظم الملح عن ماء البحر في محطات التحلية في إسرائيل؟","ru":"Как на израильских опреснительных станциях отделяют большую часть соли от морской воды?","en":"How do desalination plants in Israel remove most salt from seawater?"},[{"he":"מרתיחים עד שהמלח נעלם","ar":"يغلون الماء حتى يختفي الملح","ru":"Кипятят воду, пока соль не исчезнет","en":"Boil water until salt disappears"},{"he":"דוחפים מים בלחץ דרך קרומים מיוחדים","ar":"يدفعون الماء بضغط عبر أغشية خاصة","ru":"Продавливают воду через особые мембраны","en":"Push water under pressure through special membranes"},{"he":"מקפיאים מים עד שהמלח שוקע","ar":"يجمّدون الماء حتى يترسّب الملح","ru":"Замораживают воду, пока соль не осядет","en":"Freeze water until salt sinks"},{"he":"מוסיפים מי ברז עד שהמלח מתפוגג","ar":"يضيفون ماء الصنبور حتى يتلاشى الملح","ru":"Добавляют воду из крана, пока соль не исчезнет","en":"Add tap water until the salt fades"}],1,{"he":"חשבו איך מחסום זעיר עשוי להפריד בין מים למלחים שבתוכם.","ar":"فكّروا كيف يمكن لحاجز دقيق أن يفصل بين الماء والأملاح فيه.","ru":"Подумайте, как тонкий барьер может разделить воду и растворённые соли.","en":"Think about how a tiny barrier could separate water from dissolved salts."},{"he":"בתהליך שנקרא אוסמוזה הפוכה, לחץ דוחף מי ים דרך קרומים שמאפשרים בעיקר למים לעבור ומרחיקים את רוב המלחים. למשל, מתקן שורק משתמש בשיטה הזאת, ואחריה המים עוברים טיפול לפני האספקה.","ar":"في التناضح العكسي يدفع الضغط ماء البحر عبر أغشية تسمح بمرور الماء أساسًا وتزيل معظم الأملاح. مثلًا، تستخدم محطة سوريك هذه الطريقة ثم يُعالَج الماء قبل توزيعه.","ru":"При обратном осмосе давление проталкивает морскую воду через мембраны, которые пропускают главным образом воду и задерживают большую часть солей. Например, так работает станция Сорек; затем воду обрабатывают перед подачей.","en":"In reverse osmosis, pressure pushes seawater through membranes that mainly let water pass and reject most salts. For example, the Sorek plant uses this method; the water is then treated before supply."},null,[{"he":"רתיחה אינה מעלימה מלח; באידוי המלח נשאר מאחור.","ar":"الغليان لا يجعل الملح يختفي؛ عند تبخر الماء يبقى الملح.","ru":"При кипячении соль не исчезает: при испарении воды она остаётся.","en":"Boiling does not make salt disappear; evaporation leaves it behind."},null,{"he":"הקפאה לבדה אינה דרך הפעולה של מתקני ההתפלה האלה.","ar":"التجميد وحده ليس طريقة عمل محطات التحلية هذه.","ru":"Одно лишь замораживание не является способом работы этих станций.","en":"Freezing alone is not how these desalination plants work."},{"he":"דילול במי ברז אינו מוציא את המלח ממי הים.","ar":"التخفيف بماء الصنبور لا يزيل الملح من ماء البحر.","ru":"Разбавление водопроводной водой не удаляет соль из морской воды.","en":"Diluting with tap water does not remove salt from seawater."}]),
    Q("env-issues-2-3",{"he":"מה משותף לייצור חשמל מרוח ומאור השמש?","ar":"ما القاسم المشترك بين إنتاج الكهرباء من الرياح وضوء الشمس؟","ru":"Что общего у производства электричества из ветра и солнечного света?","en":"What do electricity from wind and sunlight have in common?"},[{"he":"שניהם מספקים חשמל קבוע בכל שעה","ar":"كلاهما يوفر كهرباء ثابتة في كل ساعة","ru":"Оба дают постоянный ток круглые сутки","en":"Both supply constant power every hour"},{"he":"שניהם מחייבים שריפת גז בלילה","ar":"كلاهما يتطلب حرق الغاز ليلًا","ru":"Оба требуют сжигания газа ночью","en":"Both require burning gas at night"},{"he":"שניהם מתחדשים בלי שריפת דלק בייצור","ar":"كلاهما متجدّد ولا يحرق وقودًا أثناء الإنتاج","ru":"Оба возобновляемы и не сжигают топливо при выработке","en":"Both are renewable and burn no fuel while generating"},{"he":"שניהם פועלים רק ממש ליד הים","ar":"كلاهما يعمل فقط قرب البحر","ru":"Оба работают лишь у самого моря","en":"Both work only beside the sea"}],2,{"he":"בדקו מה קורה למקור הטבעי אחרי שמשתמשים בו, ומה נדרש בזמן ייצור החשמל.","ar":"افحصوا ما يحدث للمصدر الطبيعي بعد استخدامه، وما يلزم أثناء إنتاج الكهرباء.","ru":"Подумайте, что происходит с природным источником после использования и что нужно при выработке.","en":"Consider what happens to each natural source after use and what is needed during generation."},{"he":"אור השמש והרוח מתחדשים באופן טבעי, והמתקנים אינם שורפים דלק בזמן ייצור החשמל. למשל, טורבינת רוח ברמת הגולן ופאנל על גג יכולים לייצר חשמל בלי פליטות ישירות בזמן הפעולה; הייצור תלוי במזג האוויר.","ar":"يتجدّد ضوء الشمس والرياح طبيعيًا، ولا تحرق المنشآت وقودًا أثناء إنتاج الكهرباء. مثلًا، توربين رياح في الجولان ولوح على سطح قد ينتجان كهرباء بلا انبعاثات مباشرة أثناء التشغيل؛ ويتعلق الإنتاج بالطقس.","ru":"Солнечный свет и ветер возобновляются естественно, а установки не сжигают топливо при выработке. Например, ветротурбина на Голанах и панель на крыше могут давать электричество без прямых выбросов при работе; выработка зависит от погоды.","en":"Sunlight and wind renew naturally, and the equipment burns no fuel while generating power. For example, a wind turbine in the Golan Heights and a rooftop panel can generate without direct operating emissions; output depends on weather."},null,[{"he":"בלילה אין אור שמש, וגם עוצמת הרוח משתנה, לכן ההספק אינו קבוע.","ar":"لا يوجد ضوء شمس ليلًا، وقوة الرياح تتغير، لذلك الإنتاج ليس ثابتًا.","ru":"Ночью нет солнечного света, а ветер меняется, поэтому мощность непостоянна.","en":"There is no sunlight at night and wind varies, so output is not constant."},{"he":"ייתכן שצריך מקור חשמל אחר כשאין שמש או רוח, אך המתקנים עצמם אינם מחייבים שריפת גז.","ar":"قد تلزم مصادر أخرى عند غياب الشمس أو الرياح، لكن الأجهزة نفسها لا تتطلب حرق الغاز.","ru":"При отсутствии солнца или ветра может понадобиться иной источник, но сами установки не требуют сжигания газа.","en":"Other power sources may be needed without sun or wind, but these devices do not themselves require burning gas."},null,{"he":"פאנלים וטורבינות יכולים לפעול גם הרחק מהים, אם יש תנאים מתאימים.","ar":"يمكن للألواح والتوربينات العمل بعيدًا عن البحر إذا توفرت الظروف الملائمة.","ru":"Панели и турбины могут работать и вдали от моря при подходящих условиях.","en":"Panels and turbines can work far from the sea when conditions are suitable."}]),
    Q("ev-2-01",{"he":"משפחה מדדה צריכת מים ביום: מקלחות 80 ליטר, אסלה 40, כביסה ובישול 30, גינה 50. איזה חלק מהצריכה הוא מקלחות?","ar":"قاست عائلة استهلاك الماء في اليوم: استحمام 80 لترًا، مرحاض 40، غسيل وطبخ 30، حديقة 50. ما نسبة الاستحمام من الاستهلاك؟","ru":"Семья измерила расход воды за день: душ 80 литров, туалет 40, стирка и готовка 30, сад 50. Какую долю расхода составляет душ?","en":"A family measured its daily water use: showers 80 liters, toilet 40, laundry and cooking 30, garden 50. What share of the use is showers?"},[{"he":"80%","ar":"80%","ru":"80%","en":"80%"},{"he":"20%","ar":"20%","ru":"20%","en":"20%"},{"he":"40%","ar":"40%","ru":"40%","en":"40%"},{"he":"50%","ar":"50%","ru":"50%","en":"50%"}],2,{"he":"חברו קודם את כל הצריכה, ורק אחר כך השוו את המקלחות לסכום.","ar":"اجمعوا أولًا كل الاستهلاك، ثم قارنوا الاستحمام بالمجموع.","ru":"Сначала сложите весь расход, а потом сравните душ с суммой.","en":"First add up all the use, then compare the showers to the total."},{"he":"סך הצריכה הוא 80 ועוד 40 ועוד 30 ועוד 50, כלומר 200 ליטר. המקלחות הן 80 מתוך 200, שזה 40%. למשל, קיצור כל מקלחת בכמה דקות יחסוך חלק ניכר מהצריכה של המשפחה.","ar":"مجموع الاستهلاك هو 80 و40 و30 و50، أي 200 لتر. الاستحمام 80 من 200، وهذا 40%. مثلًا، تقصير كل حمّام ببضع دقائق يوفّر جزءًا كبيرًا من استهلاك العائلة.","ru":"Общий расход: 80, 40, 30 и 50, то есть 200 литров. Душ — 80 из 200, это 40%. Например, если сокращать каждый душ на несколько минут, семья заметно сэкономит воду.","en":"Total use is 80 plus 40 plus 30 plus 50, which is 200 liters. Showers are 80 of 200, or 40%. For example, cutting each shower by a few minutes would save a big part of the family's water."},null,[{"he":"80 הוא מספר הליטרים, לא האחוז מתוך סך של 200 ליטר.","ar":"80 هو عدد اللترات، لا النسبة من مجموع 200 لتر.","ru":"80 — это литры, а не доля от общих 200 литров.","en":"80 is the number of liters, not the share of the 200-liter total."},{"he":"20% מתוך 200 ליטר הם 40 ליטר בלבד, וזו צריכת האסלה.","ar":"20% من 200 لتر هي 40 لترًا فقط، وهذا استهلاك المرحاض.","ru":"20% от 200 литров — это всего 40 литров, расход туалета.","en":"20% of 200 liters is only 40 liters, which is the toilet's use."},null,{"he":"חצי מ-200 ליטר הוא 100 ליטר, והמקלחות צרכו פחות מזה.","ar":"نصف 200 لتر هو 100 لتر، والاستحمام استهلك أقل من ذلك.","ru":"Половина от 200 литров — 100 литров, а душ потратил меньше.","en":"Half of 200 liters is 100 liters, and showers used less than that."}]),
    Q("ev-2-02",{"he":"בניסוי, שדה שהושקה בממטרות צרך 500 קוב מים, ושדה דומה בטפטוף צרך 300 קוב. היבול היה דומה. כמה אחוזים מהמים חסך הטפטוף?","ar":"في تجربة، استهلك حقل رُوي بالرشاشات 500 متر مكعب من الماء، وحقل مشابه بالتنقيط 300 متر مكعب. كان المحصول متشابهًا. كم بالمئة من الماء وفّر التنقيط؟","ru":"В опыте поле с дождевателями израсходовало 500 кубометров воды, а похожее поле с капельным поливом — 300. Урожай был похож. Сколько процентов воды сэкономил капельный полив?","en":"In a trial, a field watered by sprinklers used 500 cubic meters of water, and a similar drip-irrigated field used 300. The yields were alike. What percent of the water did drip save?"},[{"he":"67%","ar":"67%","ru":"67%","en":"67%"},{"he":"60%","ar":"60%","ru":"60%","en":"60%"},{"he":"20%","ar":"20%","ru":"20%","en":"20%"},{"he":"40%","ar":"40%","ru":"40%","en":"40%"}],3,{"he":"מצאו קודם כמה קוב נחסכו, ואז השוו אותם לשדה שצרך יותר.","ar":"جدوا أولًا كم مترًا مكعبًا وُفّر، ثم قارنوه بالحقل الذي استهلك أكثر.","ru":"Сначала найдите, сколько кубометров сэкономлено, затем сравните с полем, где расход больше.","en":"First find how many cubic meters were saved, then compare them with the field that used more."},{"he":"הטפטוף חסך 200 קוב, שהם ההפרש בין 500 ל-300. 200 מתוך 500 הם 40%. למשל, חקלאי שעובר לטפטוף יכול להשקות שטח גדול יותר באותה כמות מים.","ar":"وفّر التنقيط 200 متر مكعب، وهي الفرق بين 500 و300. و200 من 500 هي 40%. مثلًا، المزارع الذي ينتقل إلى التنقيط يستطيع ريّ مساحة أكبر بالكمية نفسها من الماء.","ru":"Капельный полив сэкономил 200 кубометров — разницу между 500 и 300. 200 из 500 — это 40%. Например, фермер, перешедший на капельный полив, может поливать большую площадь тем же объёмом воды.","en":"Drip saved 200 cubic meters, the difference between 500 and 300. 200 out of 500 is 40%. For example, a farmer who switches to drip can water a larger area with the same amount of water."},null,[{"he":"67% הם 200 מתוך 300, אבל צריך להשוות לצריכה המקורית של 500.","ar":"67% هي 200 من 300، لكن يجب المقارنة بالاستهلاك الأصلي 500.","ru":"67% — это 200 из 300, а сравнивать надо с исходными 500.","en":"67% is 200 out of 300, but you must compare with the original 500."},{"he":"60% הם החלק שהטפטוף עדיין צרך, לא החלק שנחסך.","ar":"60% هي الحصة التي ما زال التنقيط يستهلكها، لا الحصة التي وُفّرت.","ru":"60% — это доля, которую капельный полив всё же потратил, а не сэкономил.","en":"60% is the share drip still used, not the share it saved."},{"he":"החיסכון הוא 200 קוב מתוך 500, וזה יותר מ-20%.","ar":"التوفير 200 متر مكعب من 500، وهذا أكثر من 20%.","ru":"Экономия — 200 кубометров из 500, а это больше 20%.","en":"The saving is 200 out of 500 cubic meters, which is more than 20%."},null]),
    Q("ev-2-03",{"he":"בעיר נאספו בקבוקים למחזור: בשנה הראשונה 10 טון, בשנייה 15 טון ובשלישית 20 טון. מה מתאר את המגמה?","ar":"جُمعت في مدينة قوارير لإعادة التدوير: في السنة الأولى 10 أطنان، وفي الثانية 15 طنًا، وفي الثالثة 20 طنًا. ما الذي يصف الاتجاه؟","ru":"В городе собрали бутылки на переработку: в первый год 10 тонн, во второй 15, в третий 20. Что описывает тенденцию?","en":"A city collected bottles for recycling: 10 tonnes in year one, 15 in year two and 20 in year three. What describes the trend?"},[{"he":"עלייה של 5 טון בכל שנה","ar":"زيادة 5 أطنان كل سنة","ru":"Рост на 5 тонн каждый год","en":"A rise of 5 tonnes each year"},{"he":"הכמות הוכפלה בכל שנה","ar":"الكمية تضاعفت كل سنة","ru":"Количество удваивалось каждый год","en":"The amount doubled each year"},{"he":"ירידה של 5 טון בכל שנה","ar":"انخفاض 5 أطنان كل سنة","ru":"Снижение на 5 тонн каждый год","en":"A drop of 5 tonnes each year"},{"he":"הכמות לא השתנתה","ar":"الكمية لم تتغيّر","ru":"Количество не менялось","en":"The amount did not change"}],0,{"he":"בדקו בכמה הכמות משתנה מכל שנה לשנה שאחריה.","ar":"افحصوا بكم تتغيّر الكمية من كل سنة إلى التي تليها.","ru":"Проверьте, на сколько меняется количество от года к году.","en":"Check by how much the amount changes from each year to the next."},{"he":"מ-10 ל-15 נוספו 5 טון, ומ-15 ל-20 נוספו עוד 5 טון. זו עלייה קבועה, לא הכפלה. למשל, אם המגמה תימשך, בשנה הרביעית צפויים בערך 25 טון.","ar":"من 10 إلى 15 أُضيفت 5 أطنان، ومن 15 إلى 20 أُضيفت 5 أطنان أخرى. هذه زيادة ثابتة، لا تضاعف. مثلًا، إذا استمرّ الاتجاه، يُتوقّع نحو 25 طنًا في السنة الرابعة.","ru":"С 10 до 15 прибавилось 5 тонн, и с 15 до 20 — ещё 5. Это постоянный рост, а не удвоение. Например, если тенденция сохранится, на четвёртый год ожидается около 25 тонн.","en":"From 10 to 15, 5 tonnes were added, and from 15 to 20, another 5. This is a steady rise, not doubling. For example, if the trend continues, about 25 tonnes are expected in year four."},null,[null,{"he":"מ-10 ל-15 אין הכפלה; הכפלה הייתה מביאה ל-20 כבר בשנה השנייה.","ar":"من 10 إلى 15 ليس تضاعفًا؛ التضاعف كان سيصل إلى 20 في السنة الثانية.","ru":"От 10 к 15 нет удвоения, при удвоении было бы 20 уже во второй год.","en":"From 10 to 15 is not doubling; doubling would reach 20 in year two."},{"he":"המספרים גדלים משנה לשנה, ולכן אין כאן ירידה.","ar":"الأرقام تكبر من سنة إلى أخرى، فلا يوجد انخفاض.","ru":"Числа растут из года в год, поэтому снижения нет.","en":"The numbers grow from year to year, so there is no drop."},{"he":"הכמות השתנתה מ-10 ל-20 טון במהלך שלוש השנים.","ar":"تغيّرت الكمية من 10 إلى 20 طنًا خلال السنوات الثلاث.","ru":"За три года количество изменилось с 10 до 20 тонн.","en":"The amount changed from 10 to 20 tonnes over the three years."}]),
    Q("ev-2-04",{"he":"נניח שכל ק״מ ברכב פרטי פולט 150 גרם פחמן דו-חמצני לנוסע, ובאוטובוס מלא 50 גרם לנוסע. כמה נחסך בנסיעה של 10 ק״מ באוטובוס?","ar":"لنفترض أن كل كيلومتر في سيارة خاصة يُطلق 150 غرامًا من ثاني أكسيد الكربون للراكب، وفي حافلة ممتلئة 50 غرامًا للراكب. كم يُوفَّر في رحلة 10 كم بالحافلة؟","ru":"Допустим, каждый километр на личной машине даёт 150 граммов углекислого газа на пассажира, а в полном автобусе — 50 граммов. Сколько экономится за 10 км на автобусе?","en":"Suppose each km by private car emits 150 grams of carbon dioxide per passenger, and a full bus 50 grams per passenger. How much is saved on a 10 km bus ride?"},[{"he":"100 גרם","ar":"100 غرام","ru":"100 граммов","en":"100 grams"},{"he":"1,000 גרם","ar":"1,000 غرام","ru":"1000 граммов","en":"1,000 grams"},{"he":"500 גרם","ar":"500 غرام","ru":"500 граммов","en":"500 grams"},{"he":"1,500 גרם","ar":"1,500 غرام","ru":"1500 граммов","en":"1,500 grams"}],1,{"he":"מצאו את ההפרש בק״מ אחד, ואז חשבו על כל הדרך.","ar":"جدوا الفرق في كيلومتر واحد، ثم فكّروا في الطريق كلها.","ru":"Найдите разницу на одном километре, а потом посчитайте весь путь.","en":"Find the gap for one km, then think about the whole trip."},{"he":"בכל ק״מ נחסכים 100 גרם, שהם ההפרש בין 150 ל-50. ב-10 ק״מ נחסכים 1,000 גרם, שזה קילוגרם אחד. למשל, מי שנוסע כך הלוך ושוב כל יום חוסך 2 ק״ג ביום.","ar":"في كل كيلومتر يُوفَّر 100 غرام، وهو الفرق بين 150 و50. في 10 كم يُوفَّر 1,000 غرام، أي كيلوغرام واحد. مثلًا، من يسافر هكذا ذهابًا وإيابًا كل يوم يوفّر 2 كغ يوميًا.","ru":"На каждом километре экономится 100 граммов — разница между 150 и 50. За 10 км экономится 1000 граммов, то есть 1 килограмм. Например, кто ездит так туда и обратно каждый день, экономит 2 кг в день.","en":"Each km saves 100 grams, the gap between 150 and 50. Over 10 km that is 1,000 grams, or 1 kilogram. For example, someone who rides like this there and back every day saves 2 kg a day."},null,[{"he":"100 גרם הם ההפרש בק״מ אחד בלבד, ולא בכל 10 הק״מ.","ar":"100 غرام هي الفرق في كيلومتر واحد فقط، لا في 10 كيلومترات.","ru":"100 граммов — это разница лишь на одном километре, а не на десяти.","en":"100 grams is the gap for one km only, not for all 10 km."},null,{"he":"500 גרם הם כל הפליטה של האוטובוס ב-10 ק״מ, לא החיסכון.","ar":"500 غرام هي كل انبعاث الحافلة في 10 كم، لا التوفير.","ru":"500 граммов — это все выбросы автобуса за 10 км, а не экономия.","en":"500 grams is the bus's total emission over 10 km, not the saving."},{"he":"1,500 גרם הם כל הפליטה של הרכב ב-10 ק״מ, לא ההפרש.","ar":"1,500 غرام هي كل انبعاث السيارة في 10 كم، لا الفرق.","ru":"1500 граммов — это все выбросы машины за 10 км, а не разница.","en":"1,500 grams is the car's total emission over 10 km, not the difference."}]),
    Q("ev-2-05",{"he":"תחנת ניטור מדדה חלקיקים בארבעה ימים: 20, 25, 90 ו-22 מיקרוגרם למ״ק. נניח שהגבול המומלץ הוא 50. מה נכון לפי הנתונים?","ar":"قاست محطة رصد الجسيمات في أربعة أيام: 20 و25 و90 و22 ميكروغرامًا لكل متر مكعب. لنفترض أن الحدّ الموصى به 50. ما الصحيح حسب المعطيات؟","ru":"Станция мониторинга измерила частицы за четыре дня: 20, 25, 90 и 22 микрограмма на кубометр. Допустим, рекомендуемый предел — 50. Что верно по данным?","en":"A monitoring station measured particles on four days: 20, 25, 90 and 22 micrograms per cubic meter. Suppose the recommended limit is 50. What is true from the data?"},[{"he":"בכל ארבעת הימים עברו את הגבול","ar":"تجاوز الحدّ في الأيام الأربعة كلها","ru":"Предел превышен во все четыре дня","en":"The limit was passed on all four days"},{"he":"הממוצע של הימים מעל 50","ar":"متوسط الأيام فوق 50","ru":"Среднее за дни выше 50","en":"The average of the days is above 50"},{"he":"רק ביום אחד עברו את הגבול","ar":"تجاوز الحدّ في يوم واحد فقط","ru":"Предел превышен лишь в один день","en":"The limit was passed on one day only"},{"he":"הריכוז עלה בכל יום מחדש","ar":"التركيز ارتفع في كل يوم","ru":"Концентрация росла каждый день","en":"The level rose every single day"}],2,{"he":"השוו כל מדידה בנפרד למספר 50.","ar":"قارنوا كل قياس على حدة بالرقم 50.","ru":"Сравните каждое измерение по отдельности с числом 50.","en":"Compare each reading on its own with the number 50."},{"he":"רק המדידה של 90 גבוהה מ-50, ושלוש האחרות נמוכות ממנו. יום אחד גבוה במיוחד אינו הופך את כל התקופה למזוהמת. למשל, סופת אבק או שריפה יכולות להקפיץ את הריכוז ליום אחד בלבד.","ar":"القياس 90 وحده أعلى من 50، والثلاثة الأخرى أقل منه. يوم واحد مرتفع جدًا لا يجعل الفترة كلها ملوّثة. مثلًا، عاصفة غبار أو حريق قد يرفعان التركيز ليوم واحد فقط.","ru":"Только измерение 90 выше 50, остальные три ниже. Один очень высокий день не делает загрязнённым весь период. Например, пыльная буря или пожар могут поднять уровень всего на один день.","en":"Only the reading of 90 is above 50; the other three are below it. One very high day does not make the whole period polluted. For example, a dust storm or a fire can push the level up for a single day."},null,[{"he":"שלושה ימים היו מתחת ל-50, ולכן לא בכל הימים עברו את הגבול.","ar":"ثلاثة أيام كانت تحت 50، فلم يُتجاوز الحدّ في كل الأيام.","ru":"Три дня были ниже 50, поэтому предел превышен не во все дни.","en":"Three days were below 50, so the limit was not passed every day."},{"he":"סכום הימים הוא 157, והממוצע קצת פחות מ-40, מתחת ל-50.","ar":"مجموع الأيام 157، والمتوسط أقل قليلًا من 40، تحت 50.","ru":"Сумма за дни — 157, а среднее чуть меньше 40, то есть ниже 50.","en":"The days add up to 157, and the average is just under 40, below 50."},null,{"he":"ביום הרביעי הריכוז ירד ל-22, ולכן לא הייתה עלייה בכל יום.","ar":"في اليوم الرابع انخفض التركيز إلى 22، فلم يكن هناك ارتفاع كل يوم.","ru":"На четвёртый день уровень упал до 22, значит, рост был не каждый день.","en":"On day four the level fell to 22, so it did not rise every day."}]),
    Q("ev-2-06",{"he":"בצהרי יום קיץ נמדדה טמפרטורת פני השטח בחצר: אספלט 52°, דשא 33°, אדמה בצל עץ 29°. איזו מסקנה מתאימה לנתונים?","ar":"في ظهيرة يوم صيفي قيست حرارة السطح في ساحة: إسفلت 52°، عشب 33°، تربة في ظلّ شجرة 29°. أيّ استنتاج يناسب المعطيات؟","ru":"В летний полдень во дворе измерили температуру поверхности: асфальт 52°, трава 33°, земля в тени дерева 29°. Какой вывод подходит к данным?","en":"At noon on a summer day, surface temperatures in a yard were measured: asphalt 52°, grass 33°, soil in a tree's shade 29°. Which conclusion fits the data?"},[{"he":"האספלט חם פי שניים מהדשא","ar":"الإسفلت أسخن من العشب بمرّتين","ru":"Асфальт вдвое горячее травы","en":"Asphalt is twice as hot as grass"},{"he":"הצל מוסיף חום לאדמה","ar":"الظلّ يضيف حرارة إلى التربة","ru":"Тень добавляет земле тепло","en":"Shade adds heat to the soil"},{"he":"כל שלושת המשטחים חמים במידה דומה","ar":"الأسطح الثلاثة كلها متقاربة في حرارتها","ru":"Все три поверхности нагреты примерно одинаково","en":"All three surfaces are about equally hot"},{"he":"משטחים ירוקים ומוצלים חמים פחות","ar":"الأسطح الخضراء والمظلّلة أقل حرارة","ru":"Зелёные и затенённые поверхности холоднее","en":"Green, shaded surfaces are cooler"}],3,{"he":"סדרו את שלוש המדידות מהחמה לקרה, ובדקו מה משותף לקרות.","ar":"رتّبوا القياسات الثلاثة من الأسخن إلى الأبرد، وانظروا ما المشترك بين الأبرد.","ru":"Расставьте три измерения от горячего к холодному и посмотрите, что общего у холодных.","en":"Order the three readings from hottest to coolest and see what the cooler ones share."},{"he":"האספלט הכהה סופג הרבה קרינה ומתחמם מאוד. הדשא מתקרר בעזרת אידוי מים, והעץ חוסם את השמש. למשל, חצר בית ספר עם עצים ומדשאה נעימה יותר בהפסקה מחצר שכולה אספלט.","ar":"الإسفلت الداكن يمتصّ إشعاعًا كثيرًا ويسخن جدًا. العشب يبرد بفضل تبخّر الماء، والشجرة تحجب الشمس. مثلًا، ساحة مدرسة فيها أشجار وعشب أكثر راحة في الاستراحة من ساحة كلها إسفلت.","ru":"Тёмный асфальт поглощает много излучения и сильно нагревается. Трава охлаждается за счёт испарения воды, а дерево закрывает солнце. Например, школьный двор с деревьями и газоном приятнее на перемене, чем двор целиком из асфальта.","en":"Dark asphalt absorbs a lot of radiation and gets very hot. Grass cools through water evaporation, and the tree blocks the sun. For example, a schoolyard with trees and a lawn is more pleasant at break than one covered in asphalt."},null,[{"he":"פי שניים מ-33 הם 66, והאספלט נמדד 52 בלבד.","ar":"ضعف 33 هو 66، والإسفلت قيس 52 فقط.","ru":"Вдвое больше 33 — это 66, а асфальт показал только 52.","en":"Twice 33 is 66, and the asphalt measured only 52."},{"he":"האדמה בצל הייתה הקרה ביותר, ולכן הצל לא הוסיף חום.","ar":"التربة في الظلّ كانت الأبرد، فالظلّ لم يُضف حرارة.","ru":"Земля в тени была самой холодной, значит, тень не добавила тепла.","en":"The soil in the shade was the coolest, so shade did not add heat."},{"he":"בין האספלט לאדמה בצל יש הפרש של 23 מעלות, וזה הבדל גדול.","ar":"بين الإسفلت والتربة في الظلّ فرق 23 درجة، وهذا فرق كبير.","ru":"Между асфальтом и землёй в тени разница 23 градуса, это много.","en":"Asphalt and shaded soil differ by 23 degrees, which is a big gap."},null]),
    Q("ev-2-07",{"he":"נניח שהתפלה של קוב מי ים אחד צורכת 3.5 קוט״ש חשמל. כמה חשמל צריך כדי להתפיל 200 קוב?","ar":"لنفترض أن تحلية متر مكعب واحد من ماء البحر تستهلك 3.5 كيلوواط ساعة من الكهرباء. كم كهرباء نحتاج لتحلية 200 متر مكعب؟","ru":"Допустим, опреснение одного кубометра морской воды требует 3,5 кВт·ч электричества. Сколько электричества нужно, чтобы опреснить 200 кубометров?","en":"Suppose desalinating one cubic meter of seawater uses 3.5 kWh of electricity. How much electricity is needed to desalinate 200 cubic meters?"},[{"he":"700 קוט״ש","ar":"700 كيلوواط ساعة","ru":"700 кВт·ч","en":"700 kWh"},{"he":"70 קוט״ש","ar":"70 كيلوواط ساعة","ru":"70 кВт·ч","en":"70 kWh"},{"he":"350 קוט״ש","ar":"350 كيلوواط ساعة","ru":"350 кВт·ч","en":"350 kWh"},{"he":"7,000 קוט״ש","ar":"7,000 كيلوواط ساعة","ru":"7000 кВт·ч","en":"7,000 kWh"}],0,{"he":"חשבו קודם כמה חשמל צריך ל-100 קוב, ואז הכפילו.","ar":"احسبوا أولًا الكهرباء اللازمة لـ100 متر مكعب، ثم ضاعفوها.","ru":"Сначала посчитайте энергию для 100 кубометров, а потом удвойте.","en":"First work out the power for 100 cubic meters, then double it."},{"he":"כל קוב צורך 3.5 קוט״ש, ולכן 100 קוב צורכים 350 קוט״ש. 200 קוב צורכים פי 2, כלומר 700 קוט״ש. למשל, כך מתכננים כמה חשמל מתקן התפלה יצטרך בכל יום.","ar":"كل متر مكعب يستهلك 3.5 كيلوواط ساعة، فـ100 متر مكعب تستهلك 350. و200 متر مكعب تستهلك الضعف، أي 700 كيلوواط ساعة. مثلًا، هكذا يُخطَّط كم كهرباء ستحتاج منشأة تحلية كل يوم.","ru":"Каждый кубометр требует 3,5 кВт·ч, значит, 100 кубометров — 350 кВт·ч. 200 кубометров — вдвое больше, то есть 700 кВт·ч. Например, так рассчитывают, сколько электричества нужно опреснительной станции в день.","en":"Each cubic meter uses 3.5 kWh, so 100 cubic meters use 350 kWh. 200 cubic meters use twice that, 700 kWh. For example, this is how planners estimate a desalination plant's daily power needs."},null,[null,{"he":"70 קטן פי 10 מהתשובה; כנראה נשכח אפס בכפל.","ar":"70 أصغر بعشر مرات من الجواب؛ يبدو أن صفرًا سقط في الضرب.","ru":"70 в 10 раз меньше ответа, видимо, при умножении потерян ноль.","en":"70 is 10 times too small; a zero was probably lost when multiplying."},{"he":"350 קוט״ש מספיקים רק ל-100 קוב, כלומר לחצי מהכמות.","ar":"350 كيلوواط ساعة تكفي لـ100 متر مكعب فقط، أي نصف الكمية.","ru":"350 кВт·ч хватит лишь на 100 кубометров, то есть на половину.","en":"350 kWh is enough for only 100 cubic meters, half the amount."},{"he":"7,000 גדול פי 10 מהתשובה; נוסף אפס מיותר בכפל.","ar":"7,000 أكبر بعشر مرات من الجواب؛ أُضيف صفر زائد في الضرب.","ru":"7000 в 10 раз больше ответа, при умножении добавлен лишний ноль.","en":"7,000 is 10 times too big; an extra zero was added when multiplying."}]),
    Q("ev-2-08",{"he":"בבדיקה של 100 ק״ג פסולת ביתית נמצאו: 40 ק״ג שאריות מזון, 25 נייר, 20 פלסטיק ו-15 אחר. אם מפרידים רק את שאריות המזון לקומפוסט, כמה ק״ג נשארים?","ar":"في فحص 100 كغ من النفايات المنزلية وُجد: 40 كغ بقايا طعام، 25 ورق، 20 بلاستيك و15 أخرى. إذا فُصلت بقايا الطعام فقط للسماد، فكم كغ يبقى؟","ru":"В 100 кг бытового мусора нашли: 40 кг остатков еды, 25 бумаги, 20 пластика и 15 прочего. Если отделить на компост только остатки еды, сколько кг останется?","en":"A check of 100 kg of household waste found 40 kg food scraps, 25 paper, 20 plastic and 15 other. If only the food scraps go to compost, how many kg remain?"},[{"he":"40 ק״ג","ar":"40 كغ","ru":"40 кг","en":"40 kg"},{"he":"60 ק״ג","ar":"60 كغ","ru":"60 кг","en":"60 kg"},{"he":"15 ק״ג","ar":"15 كغ","ru":"15 кг","en":"15 kg"},{"he":"85 ק״ג","ar":"85 كغ","ru":"85 кг","en":"85 kg"}],1,{"he":"חשבו מה יוצא מהערימה ומה נשאר בה.","ar":"فكّروا ما الذي يخرج من الكومة وما الذي يبقى فيها.","ru":"Подумайте, что уходит из кучи, а что в ней остаётся.","en":"Think about what leaves the pile and what stays in it."},{"he":"מתוך 100 ק״ג יוצאים 40 ק״ג מזון, ונשארים 60 ק״ג של נייר, פלסטיק ואחר. הפרדה של סוג פסולת אחד בלבד כבר מקטינה מאוד את מה שמגיע למטמנה. למשל, פח חום לשאריות מזון במטבח יכול להוריד חלק גדול מהפסולת המעורבת.","ar":"من 100 كغ يخرج 40 كغ طعام، ويبقى 60 كغ من الورق والبلاستيك وغيرها. فصل نوع واحد فقط من النفايات يقلّل كثيرًا مما يصل إلى المكبّ. مثلًا، حاوية بنّية لبقايا الطعام في المطبخ قد تُزيل جزءًا كبيرًا من النفايات المختلطة.","ru":"Из 100 кг уходят 40 кг еды, и остаются 60 кг бумаги, пластика и прочего. Даже отделение одного вида мусора сильно уменьшает то, что попадает на свалку. Например, коричневый бак для остатков еды на кухне может убрать большую часть смешанного мусора.","en":"Of the 100 kg, 40 kg of food goes out, leaving 60 kg of paper, plastic and other. Separating just one type of waste already greatly cuts what reaches the landfill. For example, a brown bin for food scraps in the kitchen can remove a large part of mixed waste."},null,[{"he":"40 ק״ג הם שאריות המזון שהופרדו, לא מה שנשאר.","ar":"40 كغ هي بقايا الطعام المفصولة، لا ما تبقّى.","ru":"40 кг — это отделённые остатки еды, а не остаток.","en":"40 kg is the food that was separated, not what is left."},null,{"he":"15 ק״ג הם רק הסוג ״אחר״, ושכחו את הנייר והפלסטיק.","ar":"15 كغ هي فئة «أخرى» فقط، ونُسي الورق والبلاستيك.","ru":"15 кг — это только «прочее», а бумагу и пластик забыли.","en":"15 kg is only the 'other' type; paper and plastic were left out."},{"he":"85 ק״ג מתקבלים כשמורידים רק את ה״אחר״, ולא את המזון.","ar":"85 كغ تنتج عند طرح فئة «أخرى» فقط، لا الطعام.","ru":"85 кг выходит, если убрать только «прочее», а не еду.","en":"85 kg comes from removing only 'other', not the food."}]),
    Q("ev-2-09",{"he":"ממוצע הטמפרטורה השנתי בעיר: 1990 – 20.1°, 2000 – 20.4°, 2010 – 20.8°, 2020 – 21.1°. מה אפשר לומר לפי הנתונים?","ar":"متوسط الحرارة السنوي في مدينة: 1990 – 20.1°، 2000 – 20.4°، 2010 – 20.8°، 2020 – 21.1°. ماذا يمكن القول حسب المعطيات؟","ru":"Среднегодовая температура в городе: 1990 — 20,1°, 2000 — 20,4°, 2010 — 20,8°, 2020 — 21,1°. Что можно сказать по этим данным?","en":"A city's average yearly temperature: 1990 – 20.1°, 2000 – 20.4°, 2010 – 20.8°, 2020 – 21.1°. What can be said from the data?"},[{"he":"כל שנה הייתה חמה יותר מהשנה הקודמת","ar":"كل سنة كانت أدفأ من السنة التي قبلها","ru":"Каждый год был теплее предыдущего года","en":"Every year was warmer than the year before"},{"he":"עלייה של 5 מעלות בתקופה","ar":"ارتفاع 5 درجات خلال الفترة","ru":"Рост на 5 градусов за период","en":"A rise of 5 degrees over the period"},{"he":"עלייה של כמעלה אחת ב-30 שנה","ar":"ارتفاع نحو درجة واحدة خلال 30 سنة","ru":"Рост примерно на 1 градус за 30 лет","en":"A rise of about 1 degree in 30 years"},{"he":"בוודאות 22° בשנת 2050","ar":"حتمًا 22° في سنة 2050","ru":"Точно 22° в 2050 году","en":"Surely 22° in the year 2050"}],2,{"he":"חשבו את ההפרש בין המדידה הראשונה לאחרונה, ושימו לב כמה שנים נמדדו.","ar":"احسبوا الفرق بين القياس الأول والأخير، وانتبهوا كم سنة قيست.","ru":"Найдите разницу между первым и последним измерением и обратите внимание, сколько лет измерено.","en":"Find the gap between the first and last readings, and note how many years were measured."},{"he":"בין 1990 ל-2020 עברו 30 שנה, והממוצע עלה מ-20.1° ל-21.1°. זו מגמת עלייה, אבל ארבע מדידות לא מספרות מה היה בכל שנה. למשל, ייתכן ששנת 2005 הייתה קרירה, ועדיין המגמה הכללית עולה.","ar":"بين 1990 و2020 مرّت 30 سنة، وارتفع المتوسط من 20.1° إلى 21.1°. هذا اتجاه صاعد، لكن أربعة قياسات لا تخبرنا بما حدث في كل سنة. مثلًا، ربما كانت سنة 2005 باردة، ومع ذلك يبقى الاتجاه العام صاعدًا.","ru":"С 1990 по 2020 прошло 30 лет, и среднее выросло с 20,1° до 21,1°. Это тенденция роста, но четыре измерения не говорят, что было в каждом году. Например, 2005 год мог быть прохладным, а общая тенденция всё равно растёт.","en":"Between 1990 and 2020, 30 years passed, and the average rose from 20.1° to 21.1°. This is a rising trend, but four readings do not tell us about every year. For example, 2005 may have been cool, yet the overall trend still rises."},null,[{"he":"נמדדו רק 4 שנים, ואין מידע על השנים שביניהן.","ar":"قيست 4 سنوات فقط، ولا معلومات عن السنوات بينها.","ru":"Измерены лишь 4 года, о годах между ними данных нет.","en":"Only 4 years were measured, with no data on the years between."},{"he":"מ-20.1° ל-21.1° העלייה היא מעלה אחת, לא 5 מעלות.","ar":"من 20.1° إلى 21.1° الارتفاع درجة واحدة، لا 5 درجات.","ru":"С 20,1° до 21,1° рост на 1 градус, а не на 5.","en":"From 20.1° to 21.1° the rise is 1 degree, not 5."},null,{"he":"מגמה של העבר אינה ודאות לגבי העתיד, גם אם היא מרמזת על כיוון.","ar":"اتجاه الماضي ليس يقينًا بشأن المستقبل، حتى لو أشار إلى اتجاه.","ru":"Прошлая тенденция не даёт уверенности в будущем, хоть и намекает.","en":"A past trend is not certainty about the future, even if it hints at one."}]),
    Q("ev-2-10",{"he":"אוטובוס חשמלי צורך 1 קוט״ש לכל ק״מ, והסוללה שלו מחזיקה 300 קוט״ש. הקו שלו באורך 40 ק״מ. כמה נסיעות שלמות בקו אפשר לעשות בטעינה אחת?","ar":"حافلة كهربائية تستهلك 1 كيلوواط ساعة لكل كيلومتر، وبطاريتها تتّسع لـ300 كيلوواط ساعة. طول خطّها 40 كم. كم رحلة كاملة على الخط يمكن في شحنة واحدة؟","ru":"Электробус тратит 1 кВт·ч на километр, а его батарея вмещает 300 кВт·ч. Длина его маршрута — 40 км. Сколько полных рейсов можно сделать на одной зарядке?","en":"An electric bus uses 1 kWh per km, and its battery holds 300 kWh. Its route is 40 km long. How many full trips can it make on one charge?"},[{"he":"8","ar":"8","ru":"8","en":"8"},{"he":"4","ar":"4","ru":"4","en":"4"},{"he":"12","ar":"12","ru":"12","en":"12"},{"he":"7","ar":"7","ru":"7","en":"7"}],3,{"he":"בדקו כמה פעמים 40 נכנס ב-300, ומה קורה עם השארית.","ar":"افحصوا كم مرة يدخل 40 في 300، وماذا يحدث للباقي.","ru":"Проверьте, сколько раз 40 помещается в 300 и что делать с остатком.","en":"Check how many times 40 fits into 300, and what happens to the remainder."},{"he":"כל נסיעה צורכת 40 קוט״ש. 7 נסיעות צורכות 280 קוט״ש, ונשארים רק 20 קוט״ש, שלא מספיקים לנסיעה נוספת. למשל, מפעילי תחבורה מתכננים טעינה באמצע היום כדי שהאוטובוס לא ייתקע בדרך.","ar":"كل رحلة تستهلك 40 كيلوواط ساعة. 7 رحلات تستهلك 280، ويبقى 20 فقط، وهي لا تكفي لرحلة أخرى. مثلًا، يخطّط مشغّلو النقل شحنًا في منتصف اليوم كي لا تتوقف الحافلة في الطريق.","ru":"Каждый рейс требует 40 кВт·ч. 7 рейсов тратят 280 кВт·ч, остаётся лишь 20 — на ещё один рейс не хватит. Например, перевозчики планируют зарядку в середине дня, чтобы автобус не встал в пути.","en":"Each trip uses 40 kWh. 7 trips use 280 kWh, leaving only 20, which is not enough for another trip. For example, transit operators plan a midday charge so the bus does not get stuck on the way."},null,[{"he":"7.5 נסיעות מעוגלות ל-8, אבל לנסיעה השמינית אין מספיק חשמל.","ar":"7.5 رحلات تُقرَّب إلى 8، لكن الرحلة الثامنة لا تكفيها الكهرباء.","ru":"7,5 округляют до 8, но на восьмой рейс энергии не хватит.","en":"7.5 rounds to 8, but there is not enough power for an eighth trip."},{"he":"4 נסיעות צורכות רק 160 קוט״ש, ונשאר עוד הרבה חשמל.","ar":"4 رحلات تستهلك 160 كيلوواط ساعة فقط، ويبقى كثير من الكهرباء.","ru":"4 рейса тратят лишь 160 кВт·ч, и энергии остаётся ещё много.","en":"4 trips use only 160 kWh, leaving plenty of power."},{"he":"12 נסיעות צורכות 480 קוט״ש, יותר ממה שהסוללה מחזיקה.","ar":"12 رحلة تستهلك 480 كيلوواط ساعة، أكثر مما تتّسع له البطارية.","ru":"12 рейсов требуют 480 кВт·ч, больше, чем вмещает батарея.","en":"12 trips need 480 kWh, more than the battery holds."},null]),
    Q("ev-2-11",{"he":"בסקר ציפורים בפארק נספרו מינים שונים: ב-2015 – 12 מינים, ב-2020 – 9, וב-2025 – 6. מה נכון לפי הנתונים?","ar":"في مسح للطيور في متنزّه عُدّت أنواع مختلفة: سنة 2015 – 12 نوعًا، 2020 – 9، و2025 – 6. ما الصحيح حسب المعطيات؟","ru":"При учёте птиц в парке насчитали разные виды: в 2015 году — 12 видов, в 2020 — 9, в 2025 — 6. Что верно по данным?","en":"A bird survey in a park counted different species: 12 species in 2015, 9 in 2020 and 6 in 2025. What is true from the data?"},[{"he":"מספר המינים ירד בחצי","ar":"عدد الأنواع انخفض إلى النصف","ru":"Число видов сократилось вдвое","en":"The number of species halved"},{"he":"מספר הציפורים ירד בחצי","ar":"عدد الطيور انخفض إلى النصف","ru":"Число птиц сократилось вдвое","en":"The number of birds halved"},{"he":"בכל סקר נעלמו 6 מינים","ar":"في كل مسح اختفت 6 أنواع","ru":"В каждом учёте исчезали 6 видов","en":"Six species vanished in each survey"},{"he":"מספר המינים עלה בהדרגה","ar":"عدد الأنواع ارتفع تدريجيًا","ru":"Число видов постепенно росло","en":"The number of species rose gradually"}],0,{"he":"שימו לב מה בדיוק נספר בסקר, ואל תניחו מידע שלא נמסר.","ar":"انتبهوا ماذا عُدّ بالضبط في المسح، ولا تفترضوا معلومات لم تُذكر.","ru":"Обратите внимание, что именно считали, и не додумывайте данных.","en":"Notice exactly what the survey counted, and do not assume missing data."},{"he":"מ-12 מינים ל-6 מינים זו ירידה בחצי במגוון המינים. הסקר לא ספר כמה ציפורים יש, ולכן אי אפשר לדעת אם מספרן ירד. למשל, ייתכן שיש הרבה יונים, אבל מעט סוגים של ציפורים.","ar":"من 12 نوعًا إلى 6 أنواع انخفاض إلى النصف في تنوّع الأنواع. المسح لم يَعُدّ الطيور، فلا يمكن معرفة إن انخفض عددها. مثلًا، ربما يوجد حمام كثير لكن أنواع قليلة من الطيور.","ru":"С 12 видов до 6 — это сокращение разнообразия вдвое. Учёт не считал самих птиц, поэтому нельзя знать, стало ли их меньше. Например, голубей может быть много, а видов птиц — мало.","en":"Going from 12 to 6 species halves the variety of species. The survey did not count birds, so we cannot know whether their number fell. For example, there may be many pigeons but few kinds of birds."},null,[null,{"he":"נספרו מינים ולא ציפורים, ולכן אין מידע על מספר הציפורים.","ar":"عُدّت الأنواع لا الطيور، فلا معلومات عن عدد الطيور.","ru":"Считали виды, а не птиц, поэтому о числе птиц данных нет.","en":"Species were counted, not birds, so we know nothing about bird numbers."},{"he":"בין כל סקר לסקר שאחריו נעלמו 3 מינים, לא 6.","ar":"بين كل مسح والذي يليه اختفت 3 أنواع، لا 6.","ru":"Между учётами исчезало по 3 вида, а не по 6.","en":"Between surveys 3 species vanished each time, not 6."},{"he":"המספרים 12, 9 ו-6 יורדים, ולכן אין כאן עלייה.","ar":"الأرقام 12 و9 و6 تنخفض، فلا يوجد ارتفاع.","ru":"Числа 12, 9 и 6 уменьшаются, значит, роста нет.","en":"The numbers 12, 9 and 6 go down, so there is no rise."}]),
    Q("ev-2-12",{"he":"בעיר נוצרים בכל שנה 80 מיליון קוב ביוב. 60 מיליון קוב מהם מטוהרים ומשמשים להשקיה. איזה אחוז מהביוב מגיע להשקיה?","ar":"تنتج مدينة كل سنة 80 مليون متر مكعب من مياه الصرف. 60 مليونًا منها تُعالج وتُستخدم للريّ. ما نسبة مياه الصرف التي تصل إلى الريّ؟","ru":"В городе каждый год образуется 80 миллионов кубометров сточных вод. 60 миллионов из них очищают и используют для полива. Какой процент стоков идёт на полив?","en":"A city produces 80 million cubic meters of sewage each year. 60 million of it is treated and used for irrigation. What percent of the sewage goes to irrigation?"},[{"he":"60%","ar":"60%","ru":"60%","en":"60%"},{"he":"75%","ar":"75%","ru":"75%","en":"75%"},{"he":"25%","ar":"25%","ru":"25%","en":"25%"},{"he":"80%","ar":"80%","ru":"80%","en":"80%"}],1,{"he":"חשבו איזה חלק מהשלם מגיע להשקיה. נסו לחלק את שני המספרים ב-20.","ar":"فكّروا أيّ جزء من الكل يصل إلى الريّ. جرّبوا قسمة العددين على 20.","ru":"Подумайте, какая часть целого идёт на полив. Попробуйте разделить оба числа на 20.","en":"Think about what part of the whole goes to irrigation. Try dividing both numbers by 20."},{"he":"60 מתוך 80 הם 3 מתוך 4, כלומר 75%. כך המים חוזרים לשימוש, ונחסכים מים שפירים. למשל, אם עיר מטהרת עוד ביוב, החקלאים סביבה צריכים פחות מים מהכנרת או מהתפלה.","ar":"60 من 80 تعني 3 من 4، أي 75%. هكذا يعود الماء للاستعمال، وتُوفَّر المياه العذبة. مثلًا، إذا عالجت المدينة مزيدًا من مياه الصرف، يحتاج المزارعون حولها إلى ماء أقل من بحيرة طبريا أو من التحلية.","ru":"60 из 80 — это 3 из 4, то есть 75%. Так вода используется повторно, и пресная вода экономится. Например, если город очищает больше стоков, окрестным фермерам нужно меньше воды из Кинерета или от опреснения.","en":"60 out of 80 is 3 out of 4, or 75%. This way water is reused and fresh water is saved. For example, if a city treats more sewage, nearby farmers need less water from the Sea of Galilee or desalination."},null,[{"he":"60 הוא מספר מיליוני הקובים, לא האחוז מתוך 80.","ar":"60 هو عدد ملايين الأمتار المكعبة، لا النسبة من 80.","ru":"60 — это миллионы кубометров, а не процент от 80.","en":"60 is the millions of cubic meters, not the percent of 80."},null,{"he":"25% הם החלק שאינו מגיע להשקיה.","ar":"25% هي الحصة التي لا تصل إلى الريّ.","ru":"25% — это доля, которая не идёт на полив.","en":"25% is the share that does not go to irrigation."},{"he":"80 הוא סך הביוב במיליוני קוב, ולא אחוז.","ar":"80 هو مجموع مياه الصرف بملايين الأمتار المكعبة، وليس نسبة.","ru":"80 — это весь объём стоков в миллионах кубометров, а не процент.","en":"80 is the total sewage in millions of cubic meters, not a percent."}]),
    Q("ev-2-13",{"he":"בבית ספר ספרו בקבוקי פלסטיק בפחים: לפני התקנת ברזיות 300 בשבוע, ואחרי ההתקנה 120 בשבוע. בכמה אחוזים ירדה הכמות?","ar":"في مدرسة عُدّت قوارير البلاستيك في الحاويات: قبل تركيب مبرّدات الماء 300 في الأسبوع، وبعد التركيب 120 في الأسبوع. بكم بالمئة انخفضت الكمية؟","ru":"В школе считали пластиковые бутылки в баках: до установки фонтанчиков — 300 в неделю, после — 120 в неделю. На сколько процентов уменьшилось количество?","en":"A school counted plastic bottles in its bins: 300 a week before installing water fountains, and 120 a week after. By what percent did the number drop?"},[{"he":"40%","ar":"40%","ru":"40%","en":"40%"},{"he":"180%","ar":"180%","ru":"180%","en":"180%"},{"he":"60%","ar":"60%","ru":"60%","en":"60%"},{"he":"120%","ar":"120%","ru":"120%","en":"120%"}],2,{"he":"מצאו כמה בקבוקים פחות היו, ואז השוו למצב שלפני השינוי.","ar":"جدوا كم قارورة نقصت، ثم قارنوا ذلك بالوضع قبل التغيير.","ru":"Найдите, на сколько бутылок стало меньше, и сравните с тем, что было до.","en":"Find how many fewer bottles there were, then compare with the situation before."},{"he":"הכמות ירדה ב-180 בקבוקים, שהם ההפרש בין 300 ל-120. 180 מתוך 300 הם 60%. למשל, כשיש ברזייה קרובה, תלמידים ממלאים בקבוק רב-פעמי במקום לקנות חדש.","ar":"انخفضت الكمية بـ180 قارورة، وهو الفرق بين 300 و120. و180 من 300 هي 60%. مثلًا، عندما تكون مبرّدة الماء قريبة، يملأ الطلاب قارورة متعددة الاستعمال بدل شراء جديدة.","ru":"Количество уменьшилось на 180 бутылок — разница между 300 и 120. 180 из 300 — это 60%. Например, когда фонтанчик рядом, ученики наполняют многоразовую бутылку, а не покупают новую.","en":"The number fell by 180 bottles, the gap between 300 and 120. 180 out of 300 is 60%. For example, with a fountain nearby, students refill a reusable bottle instead of buying a new one."},null,[{"he":"40% הם החלק שנשאר, כי 120 הם 40% מ-300.","ar":"40% هي الحصة الباقية، لأن 120 هي 40% من 300.","ru":"40% — это оставшаяся доля: 120 составляют 40% от 300.","en":"40% is the share that remains, since 120 is 40% of 300."},{"he":"180 הוא מספר הבקבוקים שירד, לא אחוז, וירידה לא יכולה לעבור 100%.","ar":"180 هو عدد القوارير التي نقصت، لا نسبة، والانخفاض لا يتجاوز 100%.","ru":"180 — это число бутылок, а не процент, и снижение не бывает больше 100%.","en":"180 is the number of bottles cut, not a percent, and a drop cannot pass 100%."},null,{"he":"120 הוא מספר הבקבוקים אחרי ההתקנה, ולא שיעור הירידה.","ar":"120 هو عدد القوارير بعد التركيب، لا نسبة الانخفاض.","ru":"120 — это число бутылок после установки, а не величина снижения.","en":"120 is the number of bottles after installing, not the rate of the drop."}]),
    Q("ev-2-14",{"he":"נורה ישנה צורכת 60 וואט, ונורת LED עם אור דומה צורכת 9 וואט. כמה וואט נחסכים כשמחליפים 4 נורות ישנות בנורות LED?","ar":"مصباح قديم يستهلك 60 واط، ومصباح LED بضوء مشابه يستهلك 9 واط. كم واط يُوفَّر عند استبدال 4 مصابيح قديمة بمصابيح LED؟","ru":"Старая лампа потребляет 60 ватт, а светодиодная с похожим светом — 9 ватт. Сколько ватт экономится, если заменить 4 старые лампы на светодиодные?","en":"An old bulb uses 60 watts, and an LED bulb with similar light uses 9 watts. How many watts are saved by replacing 4 old bulbs with LEDs?"},[{"he":"51 וואט","ar":"51 واط","ru":"51 ватт","en":"51 watts"},{"he":"36 וואט","ar":"36 واط","ru":"36 ватт","en":"36 watts"},{"he":"240 וואט","ar":"240 واط","ru":"240 ватт","en":"240 watts"},{"he":"204 וואט","ar":"204 واط","ru":"204 ватта","en":"204 watts"}],3,{"he":"חשבו קודם את החיסכון בנורה אחת, ורק אחר כך את כל הבית.","ar":"احسبوا أولًا التوفير في مصباح واحد، ثم في البيت كله.","ru":"Сначала посчитайте экономию на одной лампе, потом на весь дом.","en":"First work out the saving for one bulb, then for the whole home."},{"he":"כל נורה חוסכת 51 וואט, שהם ההפרש בין 60 ל-9. בארבע נורות החיסכון גדול פי 4, כלומר 204 וואט. למשל, בבית שבו האורות דולקים כל ערב, החלפה כזאת מורידה את חשבון החשמל.","ar":"كل مصباح يوفّر 51 واط، وهو الفرق بين 60 و9. في أربعة مصابيح التوفير أكبر بأربع مرات، أي 204 واط. مثلًا، في بيت تُضاء أنواره كل مساء، يخفّض هذا الاستبدال فاتورة الكهرباء.","ru":"Каждая лампа экономит 51 ватт — разница между 60 и 9. На четырёх лампах экономия в 4 раза больше, то есть 204 ватта. Например, в доме, где свет горит каждый вечер, такая замена снижает счёт за электричество.","en":"Each bulb saves 51 watts, the gap between 60 and 9. With four bulbs the saving is 4 times bigger, 204 watts. For example, in a home where lights are on every evening, this swap lowers the electricity bill."},null,[{"he":"51 וואט הם החיסכון בנורה אחת בלבד, ולא בארבע.","ar":"51 واط هي التوفير في مصباح واحد فقط، لا في أربعة.","ru":"51 ватт — экономия только на одной лампе, а не на четырёх.","en":"51 watts is the saving for one bulb only, not four."},{"he":"36 וואט הם הצריכה של 4 נורות LED, לא החיסכון.","ar":"36 واط هي استهلاك 4 مصابيح LED، لا التوفير.","ru":"36 ватт — это потребление 4 светодиодных ламп, а не экономия.","en":"36 watts is what 4 LED bulbs use, not the saving."},{"he":"240 וואט הם הצריכה של 4 נורות ישנות, בלי להוריד את צריכת ה-LED.","ar":"240 واط هي استهلاك 4 مصابيح قديمة، دون طرح استهلاك LED.","ru":"240 ватт — расход 4 старых ламп без вычета расхода светодиодных.","en":"240 watts is what 4 old bulbs use, without subtracting the LEDs."},null])
