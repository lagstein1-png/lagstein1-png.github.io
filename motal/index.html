ь солнечного излучения и превращает его в тепло. Тепло переходит к воде, которая течёт по трубам внутри панели. Например, чёрная машина на солнце нагревается сильнее белой.", "en": "A dark surface absorbs most of the sunlight and turns it into heat. The heat passes to the water flowing in the pipes inside the panel. For example, a black car parked in the sun gets hotter than a white one."},null,[{"he": "משטח שמחזיר קרינה מתחמם פחות, וזה ההפך ממה שהדוד צריך.", "ar": "السطح الذي يعكس الإشعاع يسخن أقل، وهذا عكس ما يحتاجه السخان.", "ru": "Поверхность, отражающая излучение, греется меньше, а нагревателю нужно обратное.", "en": "A surface that reflects radiation heats less, which is the opposite of what the heater needs."}, null, {"he": "צבע על הלוח אינו משפיע על זרימת המים בצינורות.", "ar": "الطلاء على اللوح لا يؤثر على جريان الماء في الأنابيب.", "ru": "Краска на панели не влияет на течение воды в трубах.", "en": "Paint on the panel does not affect how water flows in the pipes."}, {"he": "לצבע יש קשר ישיר לחום, כי הוא קובע כמה קרינה נבלעת.", "ar": "للون علاقة مباشرة بالحرارة، لأنه يحدد كمية الإشعاع الممتص.", "ru": "Цвет прямо связан с теплом: от него зависит, сколько излучения поглощается.", "en": "Color is directly linked to heat, because it decides how much radiation is absorbed."}]),
Q("en-1-05",{"he": "נורת לד ונורת להט ישנה מאירות באותה עוצמה. למה נורת הלד צורכת פחות חשמל?", "ar": "مصباح LED ومصباح متوهج قديم يضيئان بالشدة نفسها. لماذا يستهلك مصباح LED كهرباء أقل؟", "ru": "Светодиодная лампа и старая лампа накаливания светят одинаково ярко. Почему светодиодная лампа тратит меньше электричества?", "en": "An LED bulb and an old incandescent bulb shine equally bright. Why does the LED bulb use less electricity?"},[{"he": "כי נורת לד אוגרת אור ביום ומחזירה אותו בלילה.", "ar": "لأن مصباح LED يخزّن الضوء نهارًا ويعيده ليلًا.", "ru": "Потому что светодиодная лампа копит свет днём и отдаёт его ночью.", "en": "Because an LED bulb stores light by day and gives it back at night."}, {"he": "כי נורה קטנה יותר תמיד צורכת פחות חשמל.", "ar": "لأن المصباح الأصغر يستهلك دائمًا كهرباء أقل.", "ru": "Потому что лампа поменьше всегда тратит меньше электричества.", "en": "Because a smaller bulb always uses less electricity."}, {"he": "כי בלד רוב החשמל הופך לאור, ורק מעט הופך לחום.", "ar": "لأن معظم الكهرباء في LED تتحول إلى ضوء، وقليل فقط إلى حرارة.", "ru": "Потому что в светодиоде большая часть тока идёт в свет и лишь немного в тепло.", "en": "Because an LED turns most electricity into light and little into heat."}, {"he": "כי נורת הלהט מאירה חזק יותר, וזה דורש יותר חשמל.", "ar": "لأن المصباح المتوهج يضيء أقوى، وهذا يحتاج كهرباء أكثر.", "ru": "Потому что лампа накаливания светит ярче, а это требует больше электричества.", "en": "Because the incandescent bulb shines brighter, which needs more electricity."}],2,{"he": "דמיינו שאתם נוגעים בשתי הנורות אחרי שעה של הארה. איזו מהן חמה יותר?", "ar": "تخيّلوا أنكم تلمسون المصباحين بعد ساعة من الإضاءة. أيّهما أسخن؟", "ru": "Представьте, что вы трогаете обе лампы после часа работы. Какая из них горячее?", "en": "Imagine touching both bulbs after an hour of lighting. Which one is hotter?"},{"he": "נורת להט הופכת את רוב החשמל לחום, ורק חלק קטן לאור. נורת לד מבזבזת הרבה פחות על חום, ולכן צריכה פחות חשמל לאותו אור. למשל נורת לד של 9 ואט מאירה בערך כמו נורת להט של 60 ואט.", "ar": "المصباح المتوهج يحوّل معظم الكهرباء إلى حرارة، وجزءًا صغيرًا فقط إلى ضوء. مصباح LED يهدر أقل بكثير على الحرارة، فيحتاج كهرباء أقل للضوء نفسه. مثال: مصباح LED بقدرة 9 واط يضيء تقريبًا مثل مصباح متوهج بقدرة 60 واط.", "ru": "Лампа накаливания превращает большую часть тока в тепло и лишь малую часть в свет. Светодиод гораздо меньше теряет на тепло, поэтому ему нужно меньше электричества для того же света. Например, светодиодная лампа на 9 Вт светит примерно как лампа накаливания на 60 Вт.", "en": "An incandescent bulb turns most of the electricity into heat and only a small part into light. An LED wastes much less as heat, so it needs less electricity for the same light. For example, a 9 W LED bulb gives about as much light as a 60 W incandescent bulb."},null,[{"he": "נורה אינה אוגרת אור; היא מאירה רק כשזורם בה חשמל.", "ar": "المصباح لا يخزّن الضوء؛ هو يضيء فقط عندما تمر فيه الكهرباء.", "ru": "Лампа не копит свет; она светит, только когда через неё идёт ток.", "en": "A bulb does not store light; it shines only while current flows through it."}, {"he": "הצריכה תלויה באיך הנורה הופכת חשמל לאור, ולא בגודל שלה.", "ar": "الاستهلاك يتعلق بكيفية تحويل المصباح الكهرباء إلى ضوء، لا بحجمه.", "ru": "Расход зависит от того, как лампа превращает ток в свет, а не от её размера.", "en": "Use depends on how the bulb turns electricity into light, not on its size."}, null, {"he": "בשאלה נאמר ששתי הנורות מאירות באותה עוצמה בדיוק.", "ar": "ذُكر في السؤال أن المصباحين يضيئان بالشدة نفسها تمامًا.", "ru": "В вопросе сказано, что обе лампы светят одинаково ярко.", "en": "The question says both bulbs shine with exactly the same brightness."}]),
Q("en-1-06",{"he": "מזגן לקירור מותקן בדרך כלל גבוה על הקיר. למה זה עוזר לקרר את כל החדר?", "ar": "يُركَّب مكيّف التبريد عادةً في أعلى الجدار. لماذا يساعد ذلك على تبريد الغرفة كلها؟", "ru": "Кондиционер для охлаждения обычно вешают высоко на стене. Почему это помогает охладить всю комнату?", "en": "A cooling air conditioner is usually mounted high on the wall. Why does this help cool the whole room?"},[{"he": "כי אוויר קר כבד יותר ויורד, ואוויר חם עולה אל המזגן.", "ar": "لأن الهواء البارد أثقل فيهبط، والهواء الساخن يصعد إلى المكيّف.", "ru": "Потому что холодный воздух тяжелее и опускается, а тёплый поднимается к кондиционеру.", "en": "Because cold air is heavier and sinks, while warm air rises to the unit."}, {"he": "כי אוויר קר עולה תמיד לתקרה, ונשאר שם כל הזמן.", "ar": "لأن الهواء البارد يصعد دائمًا إلى السقف ويبقى هناك طوال الوقت.", "ru": "Потому что холодный воздух всегда поднимается к потолку и остаётся там.", "en": "Because cold air always rises to the ceiling and stays there the whole time."}, {"he": "כי ליד התקרה יש פחות אוויר, ולכן הרבה יותר קל לקרר אותו.", "ar": "لأن الهواء قرب السقف أقل، فيسهل تبريده كثيرًا.", "ru": "Потому что у потолка меньше воздуха, и его гораздо легче охладить.", "en": "Because there is less air near the ceiling, so it is much easier to cool."}, {"he": "כי המזגן שולח קור דרך הקיר גם לחדר הסמוך.", "ar": "لأن المكيّف يرسل البرودة عبر الجدار إلى الغرفة المجاورة أيضًا.", "ru": "Потому что кондиционер посылает холод сквозь стену и в соседнюю комнату.", "en": "Because the unit sends cold through the wall into the next room too."}],0,{"he": "חשבו למה העשן של מדורה עולה למעלה.", "ar": "فكّروا لماذا يصعد دخان النار إلى الأعلى.", "ru": "Подумайте, почему дым от костра поднимается вверх.", "en": "Think about why the smoke from a campfire rises."},{"he": "זו הסעה: אוויר קר צפוף יותר ושוקע, ואוויר חם קל יותר ועולה. כך נוצר זרם שמערבב את האוויר בכל החדר. למשל לכן תנור חימום מציבים דווקא נמוך, ליד הרצפה.", "ar": "هذا هو الحمل الحراري: الهواء البارد أكثف فيهبط، والهواء الساخن أخف فيصعد. هكذا ينشأ تيار يخلط هواء الغرفة كلها. مثال: لهذا توضع المدفأة في الأسفل، قرب الأرض.", "ru": "Это конвекция: холодный воздух плотнее и опускается, а тёплый легче и поднимается. Так возникает поток, который перемешивает воздух во всей комнате. Например, поэтому обогреватель ставят внизу, у пола.", "en": "This is convection: cold air is denser and sinks, while warm air is lighter and rises. This makes a current that mixes the air in the whole room. For example, that is why a heater is placed low, near the floor."},null,[null, {"he": "אוויר קר צפוף יותר מאוויר חם, ולכן הוא יורד ולא עולה.", "ar": "الهواء البارد أكثف من الساخن، لذلك يهبط ولا يصعد.", "ru": "Холодный воздух плотнее тёплого, поэтому он опускается, а не поднимается.", "en": "Cold air is denser than warm air, so it sinks rather than rises."}, {"he": "בחדר יש אוויר בכל הגבהים, והיתרון של גובה הוא בזרם שנוצר.", "ar": "في الغرفة هواء على كل الارتفاعات، وفائدة الارتفاع في التيار الذي ينشأ.", "ru": "Воздух в комнате есть на любой высоте; польза высоты — в потоке, который возникает.", "en": "The room has air at every height; the benefit of height is the current it creates."}, {"he": "מזגן מקרר את החדר שבו הוא נמצא, ואינו שולח קור דרך קירות.", "ar": "المكيّف يبرّد الغرفة التي هو فيها، ولا يرسل البرودة عبر الجدران.", "ru": "Кондиционер охлаждает свою комнату и не посылает холод сквозь стены.", "en": "An air conditioner cools its own room and does not send cold through walls."}]),
Q("en-1-07",{"he": "כדור נופל על הרצפה וקופץ שוב, אבל לגובה נמוך יותר. מה קרה לחלק מהאנרגיה שלו?", "ar": "تسقط كرة على الأرض وترتد، لكن إلى ارتفاع أقل. ماذا حدث لجزء من طاقتها؟", "ru": "Мяч падает на пол и подпрыгивает, но ниже, чем раньше. Что стало с частью его энергии?", "en": "A ball falls to the floor and bounces back, but not as high. What happened to part of its energy?"},[{"he": "היא נעלמה לגמרי, כי אנרגיה נגמרת עם הזמן.", "ar": "اختفت تمامًا، لأن الطاقة تنتهي مع الوقت.", "ru": "Она полностью исчезла, потому что энергия со временем кончается.", "en": "It vanished completely, because energy runs out over time."}, {"he": "היא נשארה בכדור, והוא יקפוץ גבוה יותר בפעם הבאה.", "ar": "بقيت في الكرة، وسترتد أعلى في المرة القادمة.", "ru": "Она осталась в мяче, и в следующий раз он прыгнет выше.", "en": "It stayed in the ball, and it will bounce higher next time."}, {"he": "היא הפכה לאנרגיה כימית חדשה בתוך הגומי.", "ar": "تحولت إلى طاقة كيميائية جديدة داخل المطاط.", "ru": "Она стала новой химической энергией внутри резины.", "en": "It became new chemical energy inside the rubber."}, {"he": "היא הפכה לחום ולקול כשהכדור פגע ברצפה.", "ar": "تحولت إلى حرارة وصوت عندما اصطدمت الكرة بالأرض.", "ru": "Она превратилась в тепло и звук при ударе мяча об пол.", "en": "It turned into heat and sound when the ball hit the floor."}],3,{"he": "הקשיבו לכדור כשהוא פוגע ברצפה, וחשבו מה עוד נוצר שם.", "ar": "استمعوا إلى الكرة عندما تصطدم بالأرض، وفكّروا ماذا ينشأ هناك أيضًا.", "ru": "Прислушайтесь к мячу при ударе об пол и подумайте, что ещё там возникает.", "en": "Listen to the ball as it hits the floor, and think about what else is produced there."},{"he": "אנרגיה לא נעלמת, היא רק עוברת לצורות אחרות. בכל פגיעה חלק מאנרגיית התנועה הופך לחום ולקול, ולכן הכדור קופץ נמוך יותר. למשל גם הבלמים של אופניים מתחממים כשעוצרים.", "ar": "الطاقة لا تختفي، بل تنتقل إلى أشكال أخرى فقط. في كل اصطدام يتحول جزء من طاقة الحركة إلى حرارة وصوت، فترتد الكرة أقل. مثال: مكابح الدراجة أيضًا تسخن عند التوقف.", "ru": "Энергия не исчезает, она только переходит в другие формы. При каждом ударе часть энергии движения становится теплом и звуком, поэтому мяч прыгает ниже. Например, тормоза велосипеда тоже нагреваются при остановке.", "en": "Energy does not disappear; it only changes form. At each hit, part of the motion energy becomes heat and sound, so the ball bounces lower. For example, bicycle brakes also get warm when you stop."},null,[{"he": "אנרגיה לא נעלמת; היא עוברת לצורה אחרת.", "ar": "الطاقة لا تختفي؛ هي تنتقل إلى شكل آخر.", "ru": "Энергия не исчезает; она переходит в другую форму.", "en": "Energy does not vanish; it changes into another form."}, {"he": "כדור שקופץ נמוך יותר בכל פעם לא יקפוץ פתאום גבוה יותר.", "ar": "الكرة التي ترتد أقل في كل مرة لن ترتد فجأة أعلى.", "ru": "Мяч, который каждый раз прыгает ниже, не прыгнет вдруг выше.", "en": "A ball that bounces lower each time will not suddenly bounce higher."}, {"he": "בפגיעה לא נוצר חומר חדש בגומי, ולכן אין כאן אנרגיה כימית חדשה.", "ar": "لا تنشأ مادة جديدة في المطاط عند الاصطدام، فلا توجد طاقة كيميائية جديدة.", "ru": "При ударе в резине не возникает нового вещества, значит, новой химической энергии нет.", "en": "No new substance forms in the rubber on impact, so there is no new chemical energy."}, null]),
Q("en-1-08",{"he": "כוס תרמוס שומרת על קפה חם במשך שעות. בין שתי הדפנות שלה יש ריק, כמעט בלי אוויר. איך הריק עוזר?", "ar": "كوب الترمس يحافظ على القهوة ساخنة لساعات. بين جداريه فراغ تقريبًا بلا هواء. كيف يساعد هذا الفراغ؟", "ru": "Термокружка часами держит кофе горячим. Между её двумя стенками вакуум, почти без воздуха. Как помогает вакуум?", "en": "A thermos cup keeps coffee hot for hours. Between its two walls there is a vacuum, almost no air. How does the vacuum help?"},[{"he": "הוא מכניס אוויר חם מבחוץ ומחמם בעזרתו את הקפה.", "ar": "يُدخل هواءً ساخنًا من الخارج ويسخّن به القهوة.", "ru": "Он впускает тёплый воздух снаружи и им греет кофе.", "en": "It lets warm air in from outside and uses it to heat the coffee."}, {"he": "אין בו חומר, ולכן קשה לחום לעבור דרכו החוצה.", "ar": "لا مادة فيه، لذلك يصعب على الحرارة أن تعبره إلى الخارج.", "ru": "В нём нет вещества, поэтому теплу трудно пройти через него наружу.", "en": "It has no matter in it, so heat can hardly pass through it outward."}, {"he": "הוא מייצר חום משלו, כמו סוללה קטנה.", "ar": "يُنتج حرارة خاصة به، مثل بطارية صغيرة.", "ru": "Он сам вырабатывает тепло, как маленькая батарейка.", "en": "It makes its own heat, like a small battery."}, {"he": "הוא מעביר את החום מהר יותר אל הידיים.", "ar": "ينقل الحرارة بسرعة أكبر إلى اليدين.", "ru": "Он быстрее передаёт тепло к рукам.", "en": "It moves the heat to your hands faster."}],1,{"he": "חשבו אילו דרכים של מעבר חום צריכות חלקיקים כדי לפעול.", "ar": "فكّروا أي طرق لانتقال الحرارة تحتاج جسيمات كي تعمل.", "ru": "Подумайте, каким способам передачи тепла нужны частицы.", "en": "Think about which ways of heat transfer need particles to work."},{"he": "הולכה והסעה צריכות חומר: מוצק, נוזל או גז. בריק כמעט אין חומר, ולכן החום כמעט לא בורח מהקפה. למשל בקבוק תרמי שומר גם מים קרים קרים בקיץ.", "ar": "التوصيل والحمل يحتاجان مادة: صلبة أو سائلة أو غازية. في الفراغ لا توجد مادة تقريبًا، فلا تكاد الحرارة تهرب من القهوة. مثال: القارورة الحرارية تحفظ الماء البارد باردًا في الصيف أيضًا.", "ru": "Теплопроводности и конвекции нужно вещество: твёрдое, жидкое или газ. В вакууме вещества почти нет, поэтому тепло почти не уходит из кофе. Например, термос летом держит и холодную воду холодной.", "en": "Conduction and convection need matter: solid, liquid or gas. A vacuum has almost no matter, so heat hardly escapes from the coffee. For example, a vacuum bottle also keeps cold water cold in summer."},null,[{"he": "בריק אין אוויר בכלל, ולכן הוא לא יכול להכניס אוויר חם.", "ar": "في الفراغ لا يوجد هواء أصلًا، فلا يمكنه إدخال هواء ساخن.", "ru": "В вакууме совсем нет воздуха, поэтому он не может впустить тёплый воздух.", "en": "A vacuum has no air at all, so it cannot let warm air in."}, null, {"he": "ריק אינו מקור אנרגיה; הוא רק מאט את בריחת החום.", "ar": "الفراغ ليس مصدر طاقة؛ هو يبطئ هروب الحرارة فقط.", "ru": "Вакуум не источник энергии; он только замедляет потерю тепла.", "en": "A vacuum is not an energy source; it only slows heat loss."}, {"he": "אילו החום עבר מהר אל הידיים, הקפה היה מתקרר מהר.", "ar": "لو انتقلت الحرارة بسرعة إلى اليدين لبردت القهوة بسرعة.", "ru": "Если бы тепло быстро шло к рукам, кофе быстро бы остыл.", "en": "If heat moved quickly to your hands, the coffee would cool fast."}]),
Q("en-1-09",{"he": "רינה מטעינה את הטלפון בלילה. באיזו צורה נשמרת האנרגיה בסוללה של הטלפון?", "ar": "تشحن رينا الهاتف في الليل. بأي شكل تُحفَظ الطاقة في بطارية الهاتف؟", "ru": "Рина заряжает телефон ночью. В какой форме энергия хранится в аккумуляторе телефона?", "en": "Rina charges her phone at night. In what form is the energy kept in the phone's battery?"},[{"he": "כאנרגיית חום, שנשמרת בסוללה עד הבוקר.", "ar": "كطاقة حرارية تبقى في البطارية حتى الصباح.", "ru": "Как тепловая энергия, которая держится в аккумуляторе до утра.", "en": "As heat energy that stays in the battery until morning."}, {"he": "כאור שנכלא בתוך הסוללה ולא יוצא ממנה.", "ar": "كضوء محبوس داخل البطارية لا يخرج منها.", "ru": "Как свет, запертый внутри аккумулятора.", "en": "As light trapped inside the battery that cannot get out."}, {"he": "כאנרגיה כימית בחומרים שבתוך הסוללה.", "ar": "كطاقة كيميائية في المواد داخل البطارية.", "ru": "Как химическая энергия в веществах внутри аккумулятора.", "en": "As chemical energy in the materials inside the battery."}, {"he": "כאנרגיית תנועה של גלגל קטן שמסתובב בתוכה.", "ar": "كطاقة حركة لعجلة صغيرة تدور داخلها.", "ru": "Как энергия движения маленького колёсика, которое крутится внутри.", "en": "As motion energy of a small wheel spinning inside it."}],2,{"he": "חשבו מה נשאר בסוללה גם אחרי שבוע במגירה, בלי שהיא חמה.", "ar": "فكّروا ماذا يبقى في البطارية حتى بعد أسبوع في الدرج، دون أن تكون ساخنة.", "ru": "Подумайте, что остаётся в аккумуляторе даже после недели в ящике, когда он холодный.", "en": "Think about what stays in the battery even after a week in a drawer, while it is not warm."},{"he": "בזמן טעינה החשמל משנה את החומרים שבתוך הסוללה. כך האנרגיה נשמרת כאנרגיה כימית, וכשמשתמשים בטלפון היא חוזרת להיות חשמל. למשל גם הסוללה של אופניים חשמליים נטענת בלילה ומניעה אותם ביום.", "ar": "أثناء الشحن تغيّر الكهرباء المواد داخل البطارية. هكذا تُحفَظ الطاقة كطاقة كيميائية، وعند استعمال الهاتف تعود كهرباء. مثال: بطارية الدراجة الكهربائية أيضًا تُشحن ليلًا وتحرّكها نهارًا.", "ru": "При зарядке ток изменяет вещества внутри аккумулятора. Так энергия хранится как химическая, а при работе телефона снова становится электричеством. Например, аккумулятор электровелосипеда тоже заряжают ночью, и днём он двигает велосипед.", "en": "While charging, electricity changes the materials inside the battery. So the energy is kept as chemical energy, and when you use the phone it becomes electricity again. For example, an e-bike battery is also charged at night and drives the bike by day."},null,[{"he": "חום מתפזר לסביבה תוך זמן קצר, ולא יכול להישמר בסוללה ימים.", "ar": "الحرارة تتبدد في المحيط خلال وقت قصير، ولا تبقى في البطارية أيامًا.", "ru": "Тепло быстро рассеивается и не может храниться в аккумуляторе днями.", "en": "Heat spreads into the surroundings quickly and cannot stay in a battery for days."}, {"he": "אור אינו נכלא בסוללה; הסוללה שומרת אנרגיה בחומרים שלה.", "ar": "الضوء لا يُحبَس في البطارية؛ البطارية تحفظ الطاقة في موادها.", "ru": "Свет не запирается в аккумуляторе; энергия хранится в его веществах.", "en": "Light is not trapped in a battery; it keeps energy in its materials."}, null, {"he": "בסוללת טלפון אין חלקים שזזים, ואין בה גלגל מסתובב.", "ar": "لا توجد في بطارية الهاتف أجزاء متحركة، ولا عجلة تدور.", "ru": "В аккумуляторе телефона нет движущихся частей и нет колёсика.", "en": "A phone battery has no moving parts and no spinning wheel."}]),
Q("en-1-10",{"he": "על אריזה של חטיף כתוב: ״אנרגיה: 180 קילוקלוריות״. מה המספר הזה אומר?", "ar": "كُتب على غلاف وجبة خفيفة: «الطاقة: 180 كيلو سعرة حرارية». ماذا يعني هذا الرقم؟", "ru": "На упаковке батончика написано: «Энергия: 180 килокалорий». Что означает это число?", "en": "A snack package says: \"Energy: 180 kilocalories\". What does this number mean?"},[{"he": "כמה אנרגיה הגוף יכול לקבל מאכילת החטיף.", "ar": "كم من الطاقة يمكن أن يحصل عليه الجسم من أكل الوجبة.", "ru": "Сколько энергии организм может получить, съев батончик.", "en": "How much energy the body can get from eating the snack."}, {"he": "כמה חם החטיף בזמן שאוכלים אותו.", "ar": "كم تكون الوجبة ساخنة أثناء أكلها.", "ru": "Насколько горячий батончик, когда его едят.", "en": "How hot the snack is while you eat it."}, {"he": "כמה חשמל צרך המפעל כדי לייצר את החטיף הזה.", "ar": "كم استهلك المصنع من الكهرباء لإنتاج هذه الوجبة.", "ru": "Сколько электричества завод потратил на этот батончик.", "en": "How much electricity the factory used to make this snack."}, {"he": "כמה זמן החטיף יכול להישאר על המדף.", "ar": "كم من الوقت يمكن أن تبقى الوجبة على الرف.", "ru": "Сколько времени батончик может лежать на полке.", "en": "How long the snack can stay on the shelf."}],0,{"he": "חשבו מה הגוף עושה עם המזון אחרי שהוא מתעכל.", "ar": "فكّروا ماذا يفعل الجسم بالطعام بعد هضمه.", "ru": "Подумайте, что организм делает с едой после переваривания.", "en": "Think about what the body does with food after digesting it."},{"he": "במזון אגורה אנרגיה כימית. הגוף מפרק את המזון ומשתמש באנרגיה לתנועה, לחום ולגדילה. למשל הליכה מהירה של חצי שעה מוציאה בערך 150 קילוקלוריות.", "ar": "في الطعام طاقة كيميائية مخزّنة. الجسم يفكّك الطعام ويستعمل الطاقة للحركة والحرارة والنمو. مثال: المشي السريع نصف ساعة يستهلك نحو 150 كيلو سعرة حرارية.", "ru": "В еде запасена химическая энергия. Организм расщепляет пищу и тратит энергию на движение, тепло и рост. Например, быстрая ходьба полчаса расходует около 150 килокалорий.", "en": "Food stores chemical energy. The body breaks the food down and uses the energy for movement, warmth and growth. For example, half an hour of brisk walking uses about 150 kilocalories."},null,[null, {"he": "קילוקלוריות מודדות אנרגיה, ולא את הטמפרטורה של המזון.", "ar": "الكيلو سعرات تقيس الطاقة، لا درجة حرارة الطعام.", "ru": "Килокалории измеряют энергию, а не температуру еды.", "en": "Kilocalories measure energy, not the temperature of the food."}, {"he": "הערך על האריזה מתאר את המזון עצמו, ולא את החשמל של המפעל.", "ar": "القيمة على الغلاف تصف الطعام نفسه، لا كهرباء المصنع.", "ru": "Число на упаковке описывает саму еду, а не электричество завода.", "en": "The value on the package describes the food itself, not the factory's electricity."}, {"he": "זמן המדף מסומן בתאריך תפוגה, ולא ביחידות של אנרגיה.", "ar": "مدة الصلاحية تُكتب بتاريخ انتهاء، لا بوحدات طاقة.", "ru": "Срок хранения указывают датой, а не единицами энергии.", "en": "Shelf life is shown by an expiry date, not in units of energy."}]),
Q("en-1-11",{"he": "חלק גדול מהחשמל בישראל מיוצר בתחנות כוח ששורפות דלק. איך נוצר שם החשמל?", "ar": "جزء كبير من الكهرباء في إسرائيل يُنتج في محطات تحرق الوقود. كيف تُنتَج الكهرباء هناك؟", "ru": "Большая часть электричества в Израиле производится на электростанциях, которые сжигают топливо. Как там получается электричество?", "en": "Much of Israel's electricity is made in power stations that burn fuel. How is the electricity made there?"},[{"he": "החשמל נכנס לדלק ונאגר בו כאנרגיה כימית לשימוש מאוחר.", "ar": "تدخل الكهرباء إلى الوقود وتُخزَّن فيه كطاقة كيميائية لاحقًا.", "ru": "Электричество входит в топливо и запасается в нём как химическая энергия.", "en": "Electricity goes into the fuel and is stored in it as chemical energy for later."}, {"he": "הדלק נשרף, החום מסובב טורבינה, והטורבינה מפעילה גנרטור.", "ar": "يحترق الوقود، فتدير الحرارةُ توربينًا، والتوربين يشغّل مولّدًا.", "ru": "Топливо сгорает, тепло вращает турбину, а турбина приводит в действие генератор.", "en": "The fuel burns, the heat spins a turbine, and the turbine drives a generator."}, {"he": "אור הלהבה פוגע בלוחות סולאריים שמייצרים את החשמל.", "ar": "ضوء اللهب يسقط على ألواح شمسية تنتج الكهرباء.", "ru": "Свет пламени падает на солнечные панели, которые дают ток.", "en": "The light of the flame hits solar panels that make the electricity."}, {"he": "העשן שיוצא מהארובה מסובב גנרטור בראש הארובה.", "ar": "الدخان الخارج من المدخنة يدير مولّدًا في أعلاها.", "ru": "Дым из трубы вращает генератор наверху трубы.", "en": "The smoke leaving the chimney spins a generator at its top."}],1,{"he": "חשבו מה מסתובב בתוך תחנת כוח, ומה גורם לו להסתובב.", "ar": "فكّروا ما الذي يدور داخل محطة الكهرباء، وما الذي يجعله يدور.", "ru": "Подумайте, что вращается внутри электростанции и что заставляет это вращаться.", "en": "Think about what spins inside a power station, and what makes it spin."},{"he": "בתחנת כוח האנרגיה הכימית של הדלק הופכת לחום. החום יוצר קיטור או גז חם שמסובב טורבינה, והגנרטור הופך את התנועה לחשמל. למשל בתחנות כוח רבות בישראל שורפים גז טבעי.", "ar": "في محطة الكهرباء تتحول الطاقة الكيميائية للوقود إلى حرارة. تُنتج الحرارة بخارًا أو غازًا ساخنًا يدير توربينًا، والمولّد يحوّل الحركة إلى كهرباء. مثال: في محطات كثيرة في إسرائيل يُحرق الغاز الطبيعي.", "ru": "На электростанции химическая энергия топлива становится теплом. Тепло создаёт пар или горячий газ, который вращает турбину, а генератор превращает движение в электричество. Например, на многих электростанциях Израиля сжигают природный газ.", "en": "In a power station the fuel's chemical energy becomes heat. The heat makes steam or hot gas that spins a turbine, and the generator turns the motion into electricity. For example, many power stations in Israel burn natural gas."},null,[{"he": "בתחנת כוח הדלק מייצר חשמל; החשמל לא נאגר בתוך הדלק.", "ar": "في المحطة الوقود يُنتج الكهرباء؛ الكهرباء لا تُخزَّن داخله.", "ru": "На станции топливо даёт электричество, а не хранит его в себе.", "en": "In a power station the fuel produces electricity; electricity is not stored in it."}, null, {"he": "בתחנת כוח שורפת דלק אין לוחות סולאריים; החום מסובב טורבינה.", "ar": "لا توجد ألواح شمسية في محطة تحرق الوقود؛ الحرارة تدير توربينًا.", "ru": "На тепловой станции нет солнечных панелей; тепло вращает турбину.", "en": "A fuel-burning station has no solar panels; the heat spins a turbine."}, {"he": "העשן הוא פסולת של השריפה, והוא אינו מפעיל את הגנרטור.", "ar": "الدخان فضلات الاحتراق، ولا يشغّل المولّد.", "ru": "Дым — это отходы горения, он не приводит в действие генератор.", "en": "The smoke is waste from burning; it does not drive the generator."}]),
Q("en-1-12",{"he": "המטען של המחשב הנייד חם למגע אחרי שעה של טעינה, אף שהחדר לא חם. מה זה אומר?", "ar": "شاحن الحاسوب المحمول ساخن عند لمسه بعد ساعة من الشحن، مع أن الغرفة ليست حارة. ماذا يعني ذلك؟", "ru": "Зарядка ноутбука горячая на ощупь после часа зарядки, хотя в комнате не жарко. Что это значит?", "en": "The laptop charger feels hot after an hour of charging, although the room is not warm. What does this mean?"},[{"he": "שהמטען יוצר אנרגיה חדשה בזמן הטעינה.", "ar": "أن الشاحن يخلق طاقة جديدة أثناء الشحن.", "ru": "Что зарядка создаёт новую энергию во время работы.", "en": "That the charger creates new energy while charging."}, {"he": "שכל החשמל הגיע למחשב, והחום הגיע מבחוץ.", "ar": "أن كل الكهرباء وصلت إلى الحاسوب، والحرارة جاءت من الخارج.", "ru": "Что всё электричество дошло до ноутбука, а тепло пришло снаружи.", "en": "That all the electricity reached the laptop, and the heat came from outside."}, {"he": "שהמטען מקולקל, כי מטען תקין נשאר קר לגמרי.", "ar": "أن الشاحن معطّل، لأن الشاحن السليم يبقى باردًا تمامًا.", "ru": "Что зарядка сломана, ведь исправная остаётся совсем холодной.", "en": "That the charger is broken, since a good one stays completely cold."}, {"he": "שחלק מהחשמל הפך לחום ולא הגיע לסוללה.", "ar": "أن جزءًا من الكهرباء تحوّل إلى حرارة ولم يصل إلى البطارية.", "ru": "Что часть электричества стала теплом и не дошла до аккумулятора.", "en": "That part of the electricity became heat and did not reach the battery."}],3,{"he": "חשבו מאיפה בא החום, אם האוויר בחדר עצמו לא חם.", "ar": "فكّروا من أين جاءت الحرارة، إن لم يكن هواء الغرفة حارًا.", "ru": "Подумайте, откуда взялось тепло, если воздух в комнате не тёплый.", "en": "Think about where the heat came from, if the air in the room is not warm."},{"he": "אף מכשיר אינו מעביר את כל האנרגיה לשימוש שרצינו. חלק ממנה הופך לחום שמתפזר לסביבה, וזו אנרגיה שהתבזבזה. למשל גם מנוע של מכונית מתחמם מאוד בזמן נסיעה.", "ar": "لا يوجد جهاز ينقل كل الطاقة إلى الاستعمال المطلوب. جزء منها يتحول إلى حرارة تتبدد في المحيط، وهذه طاقة مهدورة. مثال: محرّك السيارة أيضًا يسخن كثيرًا أثناء السفر.", "ru": "Ни один прибор не передаёт всю энергию на нужное дело. Часть её становится теплом, которое уходит в окружающую среду, и эта энергия потеряна. Например, двигатель машины тоже сильно греется во время езды.", "en": "No device passes all its energy to the use we want. Part of it becomes heat that spreads into the surroundings, and that energy is wasted. For example, a car engine also gets very hot while driving."},null,[{"he": "מטען אינו יוצר אנרגיה; הוא רק משנה את החשמל שנכנס אליו.", "ar": "الشاحن لا يخلق طاقة؛ هو يغيّر الكهرباء التي تدخله فقط.", "ru": "Зарядка не создаёт энергию; она только преобразует входящий ток.", "en": "A charger does not create energy; it only changes the electricity going in."}, {"he": "החדר אינו חם, ולכן החום נוצר בתוך המטען עצמו.", "ar": "الغرفة ليست حارة، لذلك نشأت الحرارة داخل الشاحن نفسه.", "ru": "В комнате не жарко, значит, тепло возникло в самой зарядке.", "en": "The room is not warm, so the heat was made inside the charger itself."}, {"he": "גם מטען תקין מתחמם מעט, כי אף מכשיר אינו מושלם.", "ar": "حتى الشاحن السليم يسخن قليلًا، لأنه لا يوجد جهاز مثالي.", "ru": "Даже исправная зарядка немного греется: идеальных приборов нет.", "en": "Even a good charger warms a little, because no device is perfect."}, null]),
Q("en-1-13",{"he": "בחשבון החשמל מופיעה היחידה קוט״ש, קילוואט־שעה. מה היחידה הזאת מודדת?", "ar": "في فاتورة الكهرباء تظهر الوحدة ك.و.س، أي كيلوواط ساعة. ماذا تقيس هذه الوحدة؟", "ru": "В счёте за электричество есть единица кВт·ч, киловатт-час. Что измеряет эта единица?", "en": "The electricity bill shows the unit kWh, kilowatt-hour. What does this unit measure?"},[{"he": "את המתח החשמלי שיש בשקע שבקיר.", "ar": "الجهد الكهربائي الموجود في المقبس في الجدار.", "ru": "Напряжение в розетке на стене.", "en": "The voltage in the wall socket."}, {"he": "את מספר המכשירים שמחוברים בבית.", "ar": "عدد الأجهزة الموصولة في البيت.", "ru": "Число приборов, подключённых в доме.", "en": "The number of devices plugged in at home."}, {"he": "את כמות האנרגיה החשמלית שהבית צרך.", "ar": "كمية الطاقة الكهربائية التي استهلكها البيت.", "ru": "Количество электроэнергии, которое потратил дом.", "en": "The amount of electrical energy the home used."}, {"he": "את המהירות שבה הזרם עובר בכבלים.", "ar": "السرعة التي يمر بها التيار في الأسلاك.", "ru": "Скорость, с которой ток идёт по проводам.", "en": "The speed at which current moves in the wires."}],2,{"he": "חשבו על מה בדיוק משלמים בסוף כל תקופת חשבון.", "ar": "فكّروا على ماذا ندفع بالضبط في نهاية كل فترة فاتورة.", "ru": "Подумайте, за что именно платят в конце каждого расчётного периода.", "en": "Think about what exactly you pay for at the end of each billing period."},{"he": "קוט״ש היא יחידה של אנרגיה: הספק של 1 קילוואט שפועל במשך שעה אחת. ככל שמכשירים פועלים יותר זמן ובהספק גבוה יותר, נצרכים יותר קוט״ש. למשל תנור של 2 קילוואט שפועל חצי שעה צורך 1 קוט״ש.", "ar": "ك.و.س وحدة طاقة: قدرة 1 كيلوواط تعمل مدة ساعة واحدة. كلما عملت الأجهزة وقتًا أطول وبقدرة أعلى، استُهلكت ك.و.س أكثر. مثال: مدفأة بقدرة 2 كيلوواط تعمل نصف ساعة تستهلك 1 ك.و.س.", "ru": "кВт·ч — единица энергии: мощность 1 киловатт в течение одного часа. Чем дольше и мощнее работают приборы, тем больше кВт·ч расходуется. Например, обогреватель на 2 киловатта за полчаса тратит 1 кВт·ч.", "en": "A kWh is a unit of energy: a power of 1 kilowatt running for one hour. The longer and the more powerfully devices run, the more kWh are used. For example, a 2 kilowatt heater running for half an hour uses 1 kWh."},null,[{"he": "מתח נמדד בוולט, והוא כמעט קבוע בכל שקע בבית.", "ar": "الجهد يُقاس بالفولت، وهو ثابت تقريبًا في كل مقبس.", "ru": "Напряжение измеряют в вольтах, и оно почти одинаково в каждой розетке.", "en": "Voltage is measured in volts and is almost the same in every socket."}, {"he": "מספר מכשירים אינו אנרגיה; מכשיר כבוי לא צורך כמעט דבר.", "ar": "عدد الأجهزة ليس طاقة؛ الجهاز المطفأ لا يستهلك شيئًا تقريبًا.", "ru": "Число приборов — не энергия; выключенный прибор почти ничего не тратит.", "en": "A number of devices is not energy; a device that is off uses almost nothing."}, null, {"he": "החשבון אינו מודד מהירות; הוא מודד כמה אנרגיה נצרכה.", "ar": "الفاتورة لا تقيس السرعة؛ هي تقيس كم من الطاقة استُهلك.", "ru": "Счёт не измеряет скорость; он показывает, сколько энергии потрачено.", "en": "The bill does not measure speed; it measures how much energy was used."}]),
Q("en-1-14",{"he": "השמש רחוקה מאוד, ובין השמש לכדור הארץ יש חלל כמעט ריק. איך החום של השמש מגיע אלינו?", "ar": "الشمس بعيدة جدًا، وبينها وبين الأرض فضاء شبه فارغ. كيف تصل إلينا حرارة الشمس؟", "ru": "Солнце очень далеко, а между ним и Землёй почти пустой космос. Как солнечное тепло доходит до нас?", "en": "The Sun is very far away, and between it and Earth there is almost empty space. How does the Sun's heat reach us?"},[{"he": "בהולכה, דרך החלקיקים שממלאים את החלל.", "ar": "بالتوصيل، عبر الجسيمات التي تملأ الفضاء.", "ru": "Теплопроводностью, через частицы, заполняющие космос.", "en": "By conduction, through particles that fill space."}, {"he": "בקרינה, שיכולה לעבור גם בלי חומר.", "ar": "بالإشعاع، الذي يمكنه العبور حتى بلا مادة.", "ru": "Излучением, которое может идти и без вещества.", "en": "By radiation, which can travel even with no matter."}, {"he": "בהסעה, בזרמים של אוויר חם מהשמש.", "ar": "بالحمل، بتيارات هواء ساخن من الشمس.", "ru": "Конвекцией, потоками тёплого воздуха от Солнца.", "en": "By convection, in currents of warm air from the Sun."}, {"he": "החום לא מגיע מהשמש; הוא עולה מבטן האדמה.", "ar": "الحرارة لا تأتي من الشمس؛ هي تصعد من باطن الأرض.", "ru": "Тепло идёт не от Солнца; оно поднимается из недр Земли.", "en": "The heat does not come from the Sun; it rises from inside the Earth."}],1,{"he": "חשבו איך מרגישים חום של מדורה על הפנים, גם כשהרוח נושבת לכיוון השני.", "ar": "فكّروا كيف نشعر بحرارة النار على الوجه، حتى عندما تهب الريح في الاتجاه المعاكس.", "ru": "Подумайте, как лицо чувствует жар костра, даже когда ветер дует в другую сторону.", "en": "Think about how you feel a campfire's heat on your face, even when the wind blows the other way."},{"he": "קרינה היא דרך של מעבר חום שאינה צריכה חומר. היא עוברת גם בחלל הריק, ומחממת את מה שבולע אותה. למשל תנור הלוגן מחמם את הפנים מרחוק, עוד לפני שהאוויר בחדר מתחמם.", "ar": "الإشعاع طريقة لانتقال الحرارة لا تحتاج مادة. يعبر حتى الفضاء الفارغ، ويسخّن ما يمتصه. مثال: مدفأة الهالوجين تسخّن الوجه من بعيد، قبل أن يسخن هواء الغرفة.", "ru": "Излучение — способ передачи тепла, которому не нужно вещество. Оно проходит даже через пустой космос и нагревает то, что его поглощает. Например, галогенный обогреватель греет лицо издалека, ещё до того, как прогреется воздух.", "en": "Radiation is a way of heat transfer that needs no matter. It crosses even empty space and warms whatever absorbs it. For example, a halogen heater warms your face from a distance, before the room's air warms up."},null,[{"he": "בחלל כמעט אין חלקיקים, ולכן הולכה לא יכולה להביא את החום.", "ar": "في الفضاء لا تكاد توجد جسيمات، فلا يمكن للتوصيل أن ينقل الحرارة.", "ru": "В космосе почти нет частиц, поэтому теплопроводность не принесёт тепло.", "en": "Space has almost no particles, so conduction cannot carry the heat."}, null, {"he": "בחלל אין אוויר, ולכן אין זרמי אוויר חם בין השמש לכדור הארץ.", "ar": "لا هواء في الفضاء، فلا توجد تيارات هواء ساخن بين الشمس والأرض.", "ru": "В космосе нет воздуха, значит, нет и потоков тёплого воздуха.", "en": "Space has no air, so there are no warm air currents between the Sun and Earth."}, {"he": "ביום חם יותר מבלילה, ולכן ברור שהשמש היא מקור החום העיקרי.", "ar": "النهار أدفأ من الليل، فواضح أن الشمس هي مصدر الحرارة الرئيسي.", "ru": "Днём теплее, чем ночью, значит, главный источник тепла — Солнце.", "en": "Days are warmer than nights, so clearly the Sun is the main source of heat."}])
], [
Q("a2-bill",{"he": "בחשבון החשמל של משפחת כהן נרשמה צריכה חודשית: ינואר 520 קוט״ש, אפריל 310 קוט״ש, יולי 610 קוט״ש, אוקטובר 320 קוט״ש. מה ההסבר הסביר ביותר לצריכה הגבוהה ביולי?", "ar": "في فاتورة كهرباء عائلة كوهين سُجل استهلاك شهري: يناير 520 ك.و.س، أبريل 310، يوليو 610، أكتوبر 320. ما التفسير الأرجح للاستهلاك المرتفع في يوليو؟", "ru": "В счёте семьи Коэн записан месячный расход: январь 520 кВт·ч, апрель 310, июль 610, октябрь 320. Какое объяснение высокого расхода в июле самое разумное?", "en": "The Cohen family's bill shows monthly use: January 520 kWh, April 310, July 610, October 320. What is the most reasonable explanation for the high July use?"},[{"he": "בקיץ יש יותר שמש, ולכן הבית צורך פחות חשמל.", "ar": "في الصيف شمس أكثر، لذلك يستهلك البيت كهرباء أقل.", "ru": "Летом больше солнца, поэтому дом тратит меньше электричества.", "en": "Summer has more sunshine, so the house uses less electricity."},{"he": "המזגן פועל שעות רבות בגלל החום, וצורך הרבה חשמל.", "ar": "المكيّف يعمل ساعات طويلة بسبب الحر، ويستهلك كثيرًا من الكهرباء.", "ru": "Кондиционер работает много часов из-за жары и тратит много электричества.", "en": "The air conditioner runs many hours because of the heat and uses much electricity."},{"he": "בחודש יולי השכנים מתחברים לחשמל של המשפחה.", "ar": "في يوليو يتصل الجيران بكهرباء العائلة.", "ru": "В июле соседи подключаются к электричеству семьи.", "en": "In July the neighbors connect to the family's electricity."},{"he": "מונה החשמל מתקלקל בלי סיבה דווקא בחודש יולי בכל שנה.", "ar": "عدّاد الكهرباء يتعطل من تلقاء نفسه في شهر يوليو من كل عام بالذات.", "ru": "Счётчик электричества каждый год ломается сам по себе именно в июле.", "en": "The electricity meter happens to break down on its own every single year in July."}],1,{"he": "חשבו איזה מכשיר ביתי עובד הכי קשה דווקא בחודשי הקיץ החמים.", "ar": "فكّروا أي جهاز منزلي يعمل بأقصى جهد في أشهر الصيف الحارة.", "ru": "Подумайте, какой домашний прибор работает интенсивнее всего именно в жаркие летние месяцы.", "en": "Think about which home device works hardest precisely in the hot summer months."},{"he": "המספרים מספרים סיפור: בקיץ ובחורף הצריכה כפולה כמעט, כי מזגן ותנור הם מכשירים בזבזניים. למשל בית שממזג כל הלילה יראה קפיצה בחשבון.", "ar": "الأرقام تحكي قصة: في الصيف والشتاء الاستهلاك يقارب الضعف، لأن المكيّف والمدفأة جهازان متعطشان للطاقة. مثال: بيت يكيّف طوال الليل ترتفع فاتورته.", "ru": "Числа говорят сами: летом и зимой расход почти вдвое выше, ведь кондиционер и обогреватель самые прожорливые. Например, ночной кондиционер даёт заметный скачок в счёте.", "en": "The numbers tell a story: summer and winter use is nearly double, since air conditioners and heaters are the hungriest. For example, all-night cooling shows a clear bill jump."},null,[{"he": "הנתונים מראים ההפך: דווקא בקיץ הצריכה הכי גבוהה.", "ar": "البيانات تظهر العكس: الاستهلاك الأعلى هو في الصيف تحديدًا.", "ru": "Данные показывают обратное: наибольший расход приходится именно на лето.", "en": "The data show the opposite: the highest use is precisely in summer."},null,{"he": "אין בנתונים שום רמז לשכנים; ההבדל מתאים לשימוש עונתי במכשירים.", "ar": "لا يوجد في البيانات أي تلميح للجيران؛ فالفرق يناسب استخدامًا موسميًا للأجهزة.", "ru": "В данных нет никаких намёков на соседей; разница соответствует сезонному использованию приборов.", "en": "Nothing in the data hints at neighbors; the difference fits seasonal device use."},{"he": "תקלה חוזרת כל שנה באותו חודש אינה סבירה; דפוס עונתי מסביר טוב יותר.", "ar": "عطل متكرر في الشهر نفسه كل عام أمر غير معقول؛ والنمط الموسمي يفسر بشكل أفضل.", "ru": "Поломка каждый год в одном месяце маловероятна; сезонная закономерность объясняет лучше.", "en": "A fault repeating every year in the same month is unlikely; a seasonal pattern explains it better."}]),
Q("a2-appliance",{"he": "צריכה ממוצעת לשעת עבודה: מזגן 2.0 קוט״ש, טלוויזיה 0.1 קוט״ש, מקרר 0.15 קוט״ש, קומקום חשמלי 2.2 קוט״ש. שני מכשירים עובדים שעה אחת. איזה זוג יצרוך הכי הרבה חשמל?", "ar": "متوسط الاستهلاك لساعة عمل: مكيّف 2.0 ك.و.س، تلفاز 0.1، ثلاجة 0.15، غلاية كهربائية 2.2. جهازان يعملان ساعة واحدة. أي زوج يستهلك أكبر قدر من الكهرباء؟", "ru": "Средний расход за час работы: кондиционер 2.0 кВт·ч, телевизор 0.1, холодильник 0.15, электрочайник 2.2. Два прибора работают один час. Какая пара потратит больше всего электричества?", "en": "Average use per working hour: air conditioner 2.0 kWh, television 0.1, fridge 0.15, electric kettle 2.2. Two devices run for one hour. Which pair uses the most electricity?"},[{"he": "טלוויזיה ומקרר.", "ar": "التلفاز والثلاجة.", "ru": "Телевизор и холодильник.", "en": "The television and the fridge."},{"he": "מזגן וטלוויזיה.", "ar": "المكيّف والتلفاز.", "ru": "Кондиционер и телевизор.", "en": "The air conditioner and the television."},{"he": "מקרר וקומקום חשמלי.", "ar": "الثلاجة والغلاية الكهربائية.", "ru": "Холодильник и электрочайник.", "en": "The fridge and the electric kettle."},{"he": "קומקום חשמלי ומזגן.", "ar": "الغلاية الكهربائية والمكيّف.", "ru": "Электрочайник и кондиционер.", "en": "Electric kettle and air conditioner."}],3,{"he": "חברו את שני המספרים בכל זוג, וחפשו את הסכום הגדול ביותר.", "ar": "اجمعوا الرقمين في كل زوج وابحثوا عن المجموع الأكبر.", "ru": "Сложите два числа в каждой паре и найдите наибольшую сумму.", "en": "Add the two numbers in each pair and look for the largest total."},{"he": "מחברים את הצריכה של שני המכשירים: קומקום ומזגן יחד צורכים 4.2 קוט״ש, יותר מכל זוג אחר. למשל גם בחשבון הביתי שווה לשים לב דווקא למכשירים הגדולים, כי הם מכריעים את הסכום.", "ar": "نجمع استهلاك الجهازين: الغلاية والمكيّف معًا يستهلكان 4.2 ك.و.س، أكثر من أي زوج آخر. مثال: في الفاتورة المنزلية أيضًا يُستحسن الانتباه للأجهزة الكبيرة تحديدًا، لأنها هي التي تحسم المجموع.", "ru": "Складываем расход двух приборов: чайник и кондиционер вместе тратят 4.2 кВт·ч, больше любой другой пары. Например, в домашнем счёте стоит следить именно за крупными приборами, потому что они решают итог.", "en": "Add the use of the two devices: kettle plus air conditioner comes to 4.2 kWh, more than any other pair. For example, in the home bill it pays to watch the big devices, because they decide the total."},null,[{"he": "טלוויזיה ומקרר יחד צורכים רק 0.25 קוט״ש, הרבה פחות מהזוגות האחרים.", "ar": "التلفاز والثلاجة معًا يستهلكان فقط 0.25 ك.و.س، أقل بكثير من الأزواج الأخرى.", "ru": "Телевизор с холодильником тратят лишь 0.25 кВт·ч, гораздо меньше остальных пар.", "en": "Television plus fridge totals only 0.25 kWh, far less than the other pairs."},{"he": "מזגן וטלוויזיה צורכים 2.1 קוט״ש, פחות מקומקום ומזגן.", "ar": "المكيّف والتلفاز يستهلكان 2.1 ك.و.س، أقل من الغلاية والمكيّف.", "ru": "Кондиционер с телевизором тратят 2.1 кВт·ч, меньше, чем чайник с кондиционером.", "en": "Air conditioner plus television totals 2.1 kWh, less than kettle plus air conditioner."},{"he": "מקרר וקומקום צורכים 2.35 קוט״ש, עדיין פחות מקומקום ומזגן.", "ar": "الثلاجة والغلاية يستهلكان 2.35 ك.و.س، وما زال أقل من الغلاية والمكيّف.", "ru": "Холодильник с чайником тратят 2.35 кВт·ч, всё равно меньше, чем чайник с кондиционером.", "en": "Fridge plus kettle totals 2.35 kWh, still less than kettle plus air conditioner."},null]),
Q("a2-melt",{"he": "תלמידים הניחו שתי קוביות קרח זהות: אחת בשמש ואחת בצל. אחרי עשר דקות נמסו מהקובייה בשמש 30 מ״ל מים, ומהקובייה בצל 12 מ״ל. איזו מסקנה נכונה?", "ar": "وضع تلاميذ مكعبَي ثلج متماثلَين: أحدهما في الشمس والآخر في الظل. بعد عشر دقائق ذاب من مكعب الشمس 30 مل ماء، ومن مكعب الظل 12 مل. أي استنتاج صحيح؟", "ru": "Ученики положили два одинаковых кубика льда: один на солнце, другой в тень. Через десять минут кубик на солнце дал 30 мл воды, а в тени 12 мл. Какой вывод верен?", "en": "Students placed two identical ice cubes: one in sunlight and one in shade. After ten minutes the sun cube yielded 30 ml of water and the shade cube 12 ml. Which conclusion is correct?"},[{"he": "קרח נמס מהר יותר בשמש, כי השמש מוסיפה אנרגיית חום.", "ar": "الثلج يذوب أسرع في الشمس، لأن الشمس تضيف طاقة حرارية.", "ru": "Лёд тает быстрее на солнце, потому что Солнце добавляет тепловую энергию.", "en": "Ice melts faster in sunlight, because the Sun adds heat energy."},{"he": "קרח נמס מהר יותר בצל, כי השמש מפריעה להמסה.", "ar": "الثلج يذوب أسرع في الظل، لأن الشمس تعيق الذوبان.", "ru": "Лёд тает быстрее в тени, потому что солнце мешает таянию.", "en": "Ice melts faster in shade, because sunlight hinders melting."},{"he": "קצב ההמסה אינו תלוי במקום, וההבדל במספרים מקרי.", "ar": "سرعة الذوبان لا تتعلق بالمكان، والفرق في الأرقام عشوائي.", "ru": "Скорость таяния совсем не зависит от места, а разница в числах случайна.", "en": "Melting speed does not depend on place, and the number gap is random."},{"he": "בשמש הקרח קופא יותר, ולכן נאספו בו יותר מים.", "ar": "في الشمس يتجمد الثلج أكثر، لذلك تجمع فيه ماء أكثر.", "ru": "На солнце лёд замерзает сильнее, поэтому в нём собралось больше воды.", "en": "In sunlight the ice freezes harder, so more water collected in it."}],0,{"he": "חשבו לאיזה כיוון זורמת האנרגיה כשקרח הופך למים, ומי מספק אותה.", "ar": "فكّروا في أي اتجاه تتدفق الطاقة عندما يتحول الثلج إلى ماء، ومن يزودها.", "ru": "Подумайте, в каком направлении течёт энергия, когда лёд превращается в воду, и кто её поставляет.", "en": "Think about which way energy flows when ice turns to water, and who supplies it."},{"he": "המסה דורשת קליטת אנרגיה: הקובייה בשמש קיבלה יותר חום, ולכן נמסו ממנה 30 מ״ל לעומת 12 בצל. למשל גם שוקולד נמס מהר ביד חמה ובאיטיות במגירה קרה.", "ar": "الذوبان يتطلب امتصاص طاقة: مكعب الشمس تلقى حرارة أكثر، لذلك ذاب منه 30 مل مقابل 12 في الظل. مثال: الشوكولاتة أيضًا تذوب بسرعة في يد دافئة وببطء في درج بارد.", "ru": "Таяние требует поглощения энергии: кубик на солнце получил больше тепла, поэтому из него растаяло 30 мл против 12 в тени. Например, шоколад тоже тает быстро в тёплой руке и медленно в холодном ящике.", "en": "Melting requires taking in energy: the sun cube received more heat, so 30 ml melted from it versus 12 in the shade. For example, chocolate also melts fast in a warm hand and slowly in a cold drawer."},null,[null,{"he": "המספרים מראים ההפך: בשמש נמסו 30 מ״ל לעומת 12 בצל.", "ar": "الأرقام تظهر العكس: في الشمس ذاب 30 مل مقابل 12 في الظل.", "ru": "Числа показывают обратное: на солнце растаяло 30 мл против 12 в тени.", "en": "The numbers show the opposite: 30 ml melted in sunlight versus 12 in shade."},{"he": "ההבדל גדול ועקבי עם תפקיד השמש בחימום; אין סיבה לייחס אותו למקרה.", "ar": "الفرق كبير ويتفق مع دور الشمس في التسخين؛ ولا سبب لنسبته إلى الصدفة.", "ru": "Разница велика и согласуется с ролью Солнца в нагреве; нет причин списывать её на случайность.", "en": "The gap is large and fits the Sun's heating role; there is no reason to call it chance."},{"he": "קרח אינו קופא עוד כשהוא כבר נמס; השמש מוסיפה חום, לא קור.", "ar": "الثلج لا يزداد تجمدًا وهو يذوب أصلًا؛ فالشمس تضيف حرارة لا برودة.", "ru": "Лёд не замерзает сильнее, когда он уже тает; Солнце добавляет тепло, а не холод.", "en": "Ice does not freeze harder while it is already melting; sunlight adds heat, not cold."}]),
Q("en-2-01",{"he": "מזגן בהספק של 1.5 קילוואט פועל 4 שעות ביום. כמה אנרגיה הוא צורך ביום אחד?", "ar": "مكيّف بقدرة 1.5 كيلوواط يعمل 4 ساعات في اليوم. كم من الطاقة يستهلك في يوم واحد؟", "ru": "Кондиционер мощностью 1.5 киловатта работает 4 часа в день. Сколько энергии он тратит за один день?", "en": "An air conditioner with a power of 1.5 kilowatts runs 4 hours a day. How much energy does it use in one day?"},[{"he": "6 קוט״ש.", "ar": "6 ك.و.س.", "ru": "6 кВт·ч.", "en": "6 kWh."}, {"he": "5.5 קוט״ש.", "ar": "5.5 ك.و.س.", "ru": "5.5 кВт·ч.", "en": "5.5 kWh."}, {"he": "1.5 קוט״ש.", "ar": "1.5 ك.و.س.", "ru": "1.5 кВт·ч.", "en": "1.5 kWh."}, {"he": "0.375 קוט״ש.", "ar": "0.375 ك.و.س.", "ru": "0.375 кВт·ч.", "en": "0.375 kWh."}],0,{"he": "אנרגיה תלויה גם בהספק של המכשיר וגם במשך הזמן שהוא פועל.", "ar": "الطاقة تتعلق بقدرة الجهاز وبمدة عمله معًا.", "ru": "Энергия зависит и от мощности прибора, и от времени его работы.", "en": "Energy depends both on the device's power and on how long it runs."},{"he": "כדי לחשב אנרגיה כופלים הספק בזמן: 1.5 קילוואט כפול 4 שעות הם 6 קוט״ש. למשל מזגן כזה שפועל כל הלילה, 8 שעות, יצרוך פי 2: 12 קוט״ש.", "ar": "لحساب الطاقة نضرب القدرة في الزمن: 1.5 كيلوواط في 4 ساعات تساوي 6 ك.و.س. مثال: مكيّف كهذا يعمل طوال الليل، 8 ساعات، يستهلك الضعف: 12 ك.و.س.", "ru": "Чтобы найти энергию, мощность умножают на время: 1.5 киловатта на 4 часа дают 6 кВт·ч. Например, такой кондиционер за всю ночь, 8 часов, потратит вдвое больше: 12 кВт·ч.", "en": "To find energy, multiply power by time: 1.5 kilowatts times 4 hours gives 6 kWh. For example, the same unit running all night, 8 hours, uses twice as much: 12 kWh."},null,[null, {"he": "5.5 מתקבל מחיבור ההספק והשעות, אבל צריך לכפול אותם.", "ar": "5.5 ناتج عن جمع القدرة والساعات، لكن يجب ضربهما.", "ru": "5.5 получается при сложении мощности и часов, а их нужно перемножить.", "en": "5.5 comes from adding the power and the hours, but they must be multiplied."}, {"he": "1.5 הוא ההספק בלבד, והחישוב שוכח את 4 שעות הפעולה.", "ar": "1.5 هي القدرة فقط، والحساب ينسى ساعات العمل الأربع.", "ru": "1.5 — это только мощность; в расчёте забыты 4 часа работы.", "en": "1.5 is only the power; this answer forgets the 4 hours of running."}, {"he": "0.375 מתקבל מחילוק ההספק בשעות, אבל צריך לכפול.", "ar": "0.375 ناتج عن قسمة القدرة على الساعات، لكن يجب الضرب.", "ru": "0.375 получается делением мощности на часы, а нужно умножать.", "en": "0.375 comes from dividing the power by the hours, but you must multiply."}]),
Q("en-2-02",{"he": "קומקום של 2 קילוואט פועל 15 דקות ביום. נניח שקוט״ש עולה 60 אגורות. כמה עולה הפעלת הקומקום במשך 30 ימים?", "ar": "غلاية بقدرة 2 كيلوواط تعمل 15 دقيقة في اليوم. لنفترض أن ك.و.س يكلّف 60 أغورة. كم يكلّف تشغيل الغلاية مدة 30 يومًا؟", "ru": "Чайник мощностью 2 киловатта работает 15 минут в день. Допустим, 1 кВт·ч стоит 60 агорот. Сколько стоит работа чайника за 30 дней?", "en": "A 2 kilowatt kettle runs 15 minutes a day. Suppose 1 kWh costs 60 agorot. How much does running the kettle for 30 days cost?"},[{"he": "0.30 ₪", "ar": "0.30 ₪", "ru": "0.30 ₪", "en": "0.30 ₪"}, {"he": "9 ₪", "ar": "9 ₪", "ru": "9 ₪", "en": "9 ₪"}, {"he": "5.40 ₪", "ar": "5.40 ₪", "ru": "5.40 ₪", "en": "5.40 ₪"}, {"he": "540 ₪", "ar": "540 ₪", "ru": "540 ₪", "en": "540 ₪"}],1,{"he": "הפכו קודם את הדקות לחלק של שעה, ורק אז חשבו את האנרגיה ליום.", "ar": "حوّلوا الدقائق أولًا إلى جزء من الساعة، ثم احسبوا الطاقة لليوم.", "ru": "Сначала переведите минуты в долю часа, а потом найдите энергию за день.", "en": "First turn the minutes into a part of an hour, then work out the energy per day."},{"he": "15 דקות הן רבע שעה, ולכן ביום נצרכים 2 כפול 0.25, כלומר 0.5 קוט״ש. זה 30 אגורות ליום, ו-30 ימים עולים 9 ₪. למשל אם מרתיחים רק את כמות המים שצריך, הזמן מתקצר והחשבון יורד.", "ar": "15 دقيقة هي ربع ساعة، فيُستهلك يوميًا 2 في 0.25، أي 0.5 ك.و.س. هذا 30 أغورة في اليوم، و30 يومًا تكلّف 9 ₪. مثال: إذا غلينا كمية الماء اللازمة فقط، يقصر الوقت وتنخفض الفاتورة.", "ru": "15 минут — это четверть часа, значит, за день уходит 2 на 0.25, то есть 0.5 кВт·ч. Это 30 агорот в день, а 30 дней стоят 9 ₪. Например, если кипятить только нужное количество воды, время сократится, и счёт уменьшится.", "en": "15 minutes is a quarter of an hour, so each day uses 2 times 0.25, which is 0.5 kWh. That is 30 agorot a day, and 30 days cost 9 ₪. For example, boiling only the water you need shortens the time and lowers the bill."},null,[{"he": "0.30 ₪ הוא המחיר של יום אחד בלבד, ולא של 30 ימים.", "ar": "0.30 ₪ هو ثمن يوم واحد فقط، لا 30 يومًا.", "ru": "0.30 ₪ — цена только одного дня, а не 30 дней.", "en": "0.30 ₪ is the price of just one day, not of 30 days."}, null, {"he": "כאן 15 דקות נכתבו כ-0.15 שעה, אבל רבע שעה היא 0.25.", "ar": "هنا كُتبت 15 دقيقة كـ 0.15 ساعة، لكن ربع الساعة هو 0.25.", "ru": "Здесь 15 минут записали как 0.15 часа, но четверть часа — это 0.25.", "en": "Here 15 minutes was taken as 0.15 hour, but a quarter hour is 0.25."}, {"he": "כאן כפלו ב-15 כאילו היו 15 שעות, ולא רבע שעה.", "ar": "هنا ضربوا في 15 كأنها 15 ساعة، لا ربع ساعة.", "ru": "Здесь умножили на 15, как будто это 15 часов, а не четверть часа.", "en": "Here they multiplied by 15 as if it were 15 hours, not a quarter hour."}]),
Q("en-2-03",{"he": "בכל שנייה נכנסים לנורת להט 60 ג׳אול של חשמל, ויוצאים ממנה 6 ג׳אול של אור. מה הנצילות של הנורה?", "ar": "في كل ثانية يدخل المصباح المتوهج 60 جول من الكهرباء، ويخرج منه 6 جول من الضوء. ما كفاءة المصباح؟", "ru": "Каждую секунду в лампу накаливания входит 60 джоулей электричества, а выходит 6 джоулей света. Каков КПД лампы?", "en": "Every second, 60 joules of electricity go into an incandescent bulb and 6 joules of light come out. What is the bulb's efficiency?"},[{"he": "6%", "ar": "6%", "ru": "6%", "en": "6%"}, {"he": "54%", "ar": "54%", "ru": "54%", "en": "54%"}, {"he": "10%", "ar": "10%", "ru": "10%", "en": "10%"}, {"he": "90%", "ar": "90%", "ru": "90%", "en": "90%"}],2,{"he": "חשבו איזה חלק מהאנרגיה שנכנסה יצא כאור, וכתבו אותו באחוזים.", "ar": "فكّروا أي جزء من الطاقة الداخلة خرج ضوءًا، واكتبوه بالنسبة المئوية.", "ru": "Подумайте, какая доля вошедшей энергии вышла светом, и выразите её в процентах.", "en": "Think about what part of the energy that went in came out as light, and write it as a percent."},{"he": "נצילות היא החלק השימושי מתוך כל האנרגיה: 6 מתוך 60 הם עשירית, כלומר 10%. 54 הג׳אול האחרים הופכים לחום. למשל לכן נורת להט חמה מאוד למגע.", "ar": "الكفاءة هي الجزء المفيد من كل الطاقة: 6 من 60 هي العُشر، أي 10%. الـ 54 جول الأخرى تتحول إلى حرارة. مثال: لهذا يكون المصباح المتوهج ساخنًا جدًا عند لمسه.", "ru": "КПД — это полезная доля всей энергии: 6 из 60 — это десятая часть, то есть 10%. Остальные 54 джоуля становятся теплом. Например, поэтому лампа накаливания очень горячая на ощупь.", "en": "Efficiency is the useful part of all the energy: 6 out of 60 is one tenth, so 10%. The other 54 joules become heat. For example, that is why an incandescent bulb is very hot to touch."},null,[{"he": "6 הוא מספר הג׳אול של האור, ולא האחוז מתוך האנרגיה שנכנסה.", "ar": "6 هو عدد جولات الضوء، لا النسبة من الطاقة الداخلة.", "ru": "6 — это джоули света, а не процент от вошедшей энергии.", "en": "6 is the number of joules of light, not the percent of the energy that went in."}, {"he": "54 הוא מספר הג׳אול שהפכו לחום, ולא אחוז הנצילות.", "ar": "54 هو عدد الجولات التي تحولت إلى حرارة، لا نسبة الكفاءة.", "ru": "54 — это джоули, ушедшие в тепло, а не процент КПД.", "en": "54 is the number of joules that became heat, not the efficiency percent."}, null, {"he": "90% הוא החלק שהפך לחום, כלומר האנרגיה שהתבזבזה.", "ar": "90% هي الجزء الذي تحوّل إلى حرارة، أي الطاقة المهدورة.", "ru": "90% — доля, ушедшая в тепло, то есть потерянная энергия.", "en": "90% is the part that became heat, meaning the wasted energy."}]),
Q("en-2-04",{"he": "מקרר א׳ עולה 2,000 ₪ וצורך 350 קוט״ש בשנה. מקרר ב׳ עולה 2,300 ₪ וצורך 250 קוט״ש בשנה. נניח שקוט״ש עולה 0.60 ₪. אחרי כמה שנים החיסכון בחשמל יכסה את הפרש המחיר?", "ar": "الثلاجة أ تكلّف 2,000 ₪ وتستهلك 350 ك.و.س في السنة. الثلاجة ب تكلّف 2,300 ₪ وتستهلك 250 ك.و.س في السنة. لنفترض أن ك.و.س يكلّف 0.60 ₪. بعد كم سنة يغطي التوفير في الكهرباء فرق السعر؟", "ru": "Холодильник А стоит 2,000 ₪ и тратит 350 кВт·ч в год. Холодильник Б стоит 2,300 ₪ и тратит 250 кВт·ч в год. Допустим, 1 кВт·ч стоит 0.60 ₪. Через сколько лет экономия на электричестве покроет разницу в цене?", "en": "Fridge A costs 2,000 ₪ and uses 350 kWh a year. Fridge B costs 2,300 ₪ and uses 250 kWh a year. Suppose 1 kWh costs 0.60 ₪. After how many years will the electricity savings cover the price difference?"},[{"he": "אחרי שנה אחת.", "ar": "بعد سنة واحدة.", "ru": "Через 1 год.", "en": "After 1 year."}, {"he": "אחרי 3 שנים.", "ar": "بعد 3 سنوات.", "ru": "Через 3 года.", "en": "After 3 years."}, {"he": "אחרי 10 שנים.", "ar": "بعد 10 سنوات.", "ru": "Через 10 лет.", "en": "After 10 years."}, {"he": "אחרי 5 שנים.", "ar": "بعد 5 سنوات.", "ru": "Через 5 лет.", "en": "After 5 years."}],3,{"he": "מצאו קודם כמה קוט״ש חוסכים בשנה, ואז כמה כסף זה שווה.", "ar": "جِدوا أولًا كم ك.و.س نوفّر في السنة، ثم كم يساوي ذلك من المال.", "ru": "Сначала найдите, сколько кВт·ч экономится за год, а потом сколько это в деньгах.", "en": "First find how many kWh are saved per year, then how much money that is."},{"he": "מקרר ב׳ חוסך 100 קוט״ש בשנה, כלומר 60 ₪ בשנה. הפרש המחיר הוא 300 ₪, ו-300 חלקי 60 הם 5 שנים. למשל מקרר עובד בבית 10 שנים ויותר, ולכן החיסכון ממשיך גם אחרי שההפרש כוסה.", "ar": "الثلاجة ب توفّر 100 ك.و.س في السنة، أي 60 ₪ في السنة. فرق السعر 300 ₪، و300 على 60 تساوي 5 سنوات. مثال: الثلاجة تعمل في البيت 10 سنوات وأكثر، فيستمر التوفير بعد تغطية الفرق.", "ru": "Холодильник Б экономит 100 кВт·ч в год, то есть 60 ₪ в год. Разница в цене 300 ₪, а 300 разделить на 60 — это 5 лет. Например, холодильник служит дома 10 лет и больше, поэтому экономия продолжается и после того, как разница покрыта.", "en": "Fridge B saves 100 kWh a year, which is 60 ₪ a year. The price difference is 300 ₪, and 300 divided by 60 is 5 years. For example, a fridge works at home for 10 years or more, so the saving goes on after the difference is covered."},null,[{"he": "בשנה אחת חוסכים רק 60 ₪, הרבה פחות מההפרש של 300 ₪.", "ar": "في سنة واحدة نوفّر 60 ₪ فقط، أقل بكثير من فرق 300 ₪.", "ru": "За один год экономится лишь 60 ₪, намного меньше разницы в 300 ₪.", "en": "In one year you save only 60 ₪, far less than the 300 ₪ difference."}, {"he": "3 מתקבל מחילוק 300 ב-100 קוט״ש, בלי להפוך את הקוט״ש לשקלים.", "ar": "3 ناتج عن قسمة 300 على 100 ك.و.س، دون تحويل ك.و.س إلى شواقل.", "ru": "3 получается делением 300 на 100 кВт·ч, без перевода кВт·ч в шекели.", "en": "3 comes from dividing 300 by 100 kWh without turning the kWh into shekels."}, {"he": "אחרי 10 שנים החיסכון הוא 600 ₪, כפול מההפרש; הכיסוי מגיע מוקדם יותר.", "ar": "بعد 10 سنوات يكون التوفير 600 ₪، ضعف الفرق؛ التغطية تأتي أبكر.", "ru": "За 10 лет экономия 600 ₪, вдвое больше разницы; покрытие наступает раньше.", "en": "After 10 years the saving is 600 ₪, twice the difference; it is covered sooner."}, null]),
Q("en-2-05",{"he": "תלמיד מדד את טמפרטורת המים בדוד שמש ביום שבו איש לא השתמש במים: 7:00 – 25°C, 11:00 – 45°C, 15:00 – 60°C, 23:00 – 50°C. מה המסקנה הנכונה?", "ar": "قاس طالب درجة حرارة الماء في سخان شمسي في يوم لم يستعمل فيه أحد الماء: 7:00 – 25°C، 11:00 – 45°C، 15:00 – 60°C، 23:00 – 50°C. ما الاستنتاج الصحيح؟", "ru": "Ученик измерял температуру воды в солнечном водонагревателе в день, когда водой никто не пользовался: 7:00 – 25°C, 11:00 – 45°C, 15:00 – 60°C, 23:00 – 50°C. Какой вывод верный?", "en": "A student measured the water temperature in a solar water heater on a day when nobody used the water: 7:00 – 25°C, 11:00 – 45°C, 15:00 – 60°C, 23:00 – 50°C. Which conclusion is correct?"},[{"he": "המים התחממו בשעות האור, ובערב איבדו חלק מהחום.", "ar": "سخن الماء في ساعات النهار، وفي المساء فقد جزءًا من حرارته.", "ru": "Вода нагрелась в светлое время, а вечером потеряла часть тепла.", "en": "The water warmed in daylight hours and lost some heat in the evening."}, {"he": "המים התחממו הכי מהר אחרי 15:00, לקראת השקיעה.", "ar": "سخن الماء بأسرع شكل بعد 15:00، قرب الغروب.", "ru": "Быстрее всего вода грелась после 15:00, ближе к закату.", "en": "The water warmed fastest after 15:00, toward sunset."}, {"he": "הדוד מבודד לגמרי, כי המים לא התקררו בכלל.", "ar": "السخان معزول تمامًا، لأن الماء لم يبرد إطلاقًا.", "ru": "Бак изолирован полностью, ведь вода совсем не остыла.", "en": "The tank is perfectly insulated, since the water did not cool at all."}, {"he": "המים התקררו לאורך כל היום, משעה 7:00 ועד הלילה.", "ar": "برد الماء طوال اليوم، من الساعة 7:00 حتى الليل.", "ru": "Вода остывала весь день, с 7:00 до ночи.", "en": "The water cooled all day long, from 7:00 until night."}],0,{"he": "השוו את כיוון השינוי לפני 15:00 ואחריה.", "ar": "قارنوا اتجاه التغيّر قبل الساعة 15:00 وبعدها.", "ru": "Сравните направление изменения до 15:00 и после.", "en": "Compare the direction of the change before 15:00 and after it."},{"he": "עד 15:00 הטמפרטורה עלתה, כי השמש חיממה את הלוחות. אחר כך היא ירדה מ-60 ל-50 מעלות, כי גם דוד מבודד מאבד מעט חום. למשל לכן המים בבוקר פחות חמים מאשר אחר הצהריים.", "ar": "حتى 15:00 ارتفعت درجة الحرارة، لأن الشمس سخّنت الألواح. بعد ذلك انخفضت من 60 إلى 50 درجة، لأن السخان المعزول أيضًا يفقد قليلًا من الحرارة. مثال: لهذا يكون الماء صباحًا أقل سخونة منه بعد الظهر.", "ru": "До 15:00 температура росла, потому что солнце грело панели. Потом она упала с 60 до 50 градусов: даже утеплённый бак понемногу теряет тепло. Например, поэтому утром вода не такая горячая, как днём.", "en": "Until 15:00 the temperature rose, because the sun heated the panels. Then it fell from 60 to 50 degrees, because even an insulated tank loses a little heat. For example, that is why the water is less hot in the morning than in the afternoon."},null,[null, {"he": "אחרי 15:00 הטמפרטורה ירדה מ-60 ל-50, ולא עלתה.", "ar": "بعد 15:00 انخفضت الحرارة من 60 إلى 50، ولم ترتفع.", "ru": "После 15:00 температура упала с 60 до 50, а не выросла.", "en": "After 15:00 the temperature fell from 60 to 50; it did not rise."}, {"he": "הטמפרטורה ירדה ב-10 מעלות בערב, ולכן הדוד איבד חום.", "ar": "انخفضت الحرارة 10 درجات في المساء، فالسخان فقد حرارة.", "ru": "Вечером температура упала на 10 градусов, значит, бак терял тепло.", "en": "The temperature fell by 10 degrees in the evening, so the tank lost heat."}, {"he": "עד 15:00 הטמפרטורה עלתה מ-25 ל-60, כלומר המים התחממו.", "ar": "حتى 15:00 ارتفعت الحرارة من 25 إلى 60، أي أن الماء سخن.", "ru": "До 15:00 температура выросла с 25 до 60, то есть вода нагрелась.", "en": "Until 15:00 the temperature rose from 25 to 60, so the water warmed."}]),
Q("en-2-06",{"he": "טלוויזיה במצב המתנה צורכת 2 ואט, 20 שעות ביום. כמה קוט״ש היא צורכת במצב המתנה בשנה של 365 ימים?", "ar": "تلفاز في وضع الانتظار يستهلك 2 واط، 20 ساعة في اليوم. كم ك.و.س يستهلك في وضع الانتظار في سنة من 365 يومًا؟", "ru": "Телевизор в режиме ожидания потребляет 2 ватта 20 часов в сутки. Сколько кВт·ч он тратит в режиме ожидания за год из 365 дней?", "en": "A TV on standby uses 2 watts for 20 hours a day. How many kWh does it use on standby in a year of 365 days?"},[{"he": "40 קוט״ש", "ar": "40 ك.و.س", "ru": "40 кВт·ч", "en": "40 kWh"}, {"he": "14.6 קוט״ש", "ar": "14.6 ك.و.س", "ru": "14.6 кВт·ч", "en": "14.6 kWh"}, {"he": "730 קוט״ש", "ar": "730 ك.و.س", "ru": "730 кВт·ч", "en": "730 kWh"}, {"he": "1.46 קוט״ש", "ar": "1.46 ك.و.س", "ru": "1.46 кВт·ч", "en": "1.46 kWh"}],1,{"he": "חשבו קודם כמה ואט־שעה נצרכים ביום, וזכרו ש-1,000 ואט־שעה הם 1 קוט״ש.", "ar": "احسبوا أولًا كم واط ساعة تُستهلك في اليوم، وتذكّروا أن 1,000 واط ساعة تساوي 1 ك.و.س.", "ru": "Сначала найдите, сколько ватт-часов уходит за день, и помните: 1,000 ватт-часов — это 1 кВт·ч.", "en": "First find how many watt-hours are used per day, and remember that 1,000 watt-hours make 1 kWh."},{"he": "ביום: 2 ואט כפול 20 שעות הם 40 ואט־שעה. בשנה: 40 כפול 365 הם 14,600 ואט־שעה, כלומר 14.6 קוט״ש. למשל מפצל עם מתג מאפשר לנתק כמה מכשירים בלחיצה אחת.", "ar": "في اليوم: 2 واط في 20 ساعة تساوي 40 واط ساعة. في السنة: 40 في 365 تساوي 14,600 واط ساعة، أي 14.6 ك.و.س. مثال: مشترك كهربائي بمفتاح يتيح فصل عدة أجهزة بضغطة واحدة.", "ru": "За день: 2 ватта на 20 часов — это 40 ватт-часов. За год: 40 на 365 — это 14,600 ватт-часов, то есть 14.6 кВт·ч. Например, удлинитель с выключателем отключает несколько приборов одним нажатием.", "en": "Per day: 2 watts times 20 hours is 40 watt-hours. Per year: 40 times 365 is 14,600 watt-hours, which is 14.6 kWh. For example, a power strip with a switch cuts off several devices with one press."},null,[{"he": "40 הוא מספר הוואט־שעה ביום אחד, ולא הקוט״ש בשנה.", "ar": "40 هو عدد الواط ساعة في يوم واحد، لا ك.و.س في السنة.", "ru": "40 — это ватт-часы за один день, а не кВт·ч за год.", "en": "40 is the watt-hours for one day, not the kWh for a year."}, null, {"he": "730 מתקבל בלי שעות היום ובלי המרה מוואט לקילוואט.", "ar": "730 ناتج دون ساعات اليوم ودون التحويل من واط إلى كيلوواط.", "ru": "730 получается без часов в сутках и без перевода ватт в киловатты.", "en": "730 comes from leaving out the daily hours and the change from watts to kilowatts."}, {"he": "1.46 קטן פי 10 מהתוצאה; הנקודה העשרונית זזה בטעות.", "ar": "1.46 أصغر بعشر مرات من النتيجة؛ الفاصلة العشرية انتقلت خطأً.", "ru": "1.46 в 10 раз меньше ответа; десятичная точка сдвинута по ошибке.", "en": "1.46 is 10 times too small; the decimal point moved by mistake."}]),
Q("en-2-07",{"he": "תלמידים חיממו שתי קופסאות זהות. קופסה א׳ עטופה בצמר, וקופסה ב׳ לא. אחרי שכיבו את החימום, בחצי שעה א׳ ירדה מ-40 ל-35 מעלות, וב׳ ירדה מ-32 ל-24. מה אפשר להסיק?", "ar": "سخّن طلاب صندوقين متماثلين. الصندوق أ ملفوف بالصوف، والصندوق ب لا. بعد إطفاء التسخين، خلال نصف ساعة انخفض أ من 40 إلى 35 درجة، وب من 32 إلى 24. ماذا نستنتج؟", "ru": "Ученики нагрели две одинаковые коробки. Коробка А обёрнута шерстью, коробка Б — нет. После выключения нагрева за полчаса А остыла с 40 до 35 градусов, а Б — с 32 до 24. Какой вывод можно сделать?", "en": "Students heated two identical boxes. Box A is wrapped in wool and box B is not. After the heating was turned off, in half an hour A fell from 40 to 35 degrees and B fell from 32 to 24. What can be concluded?"},[{"he": "קופסה ב׳ שמרה על החום טוב יותר, כי בסוף היא קרה יותר.", "ar": "الصندوق ب حافظ على الحرارة أفضل، لأنه في النهاية أبرد.", "ru": "Коробка Б лучше сохранила тепло, ведь в конце она холоднее.", "en": "Box B kept heat better, because at the end it is colder."}, {"he": "הצמר גרם לקופסה א׳ לייצר חום משלה.", "ar": "الصوف جعل الصندوق أ يُنتج حرارة خاصة به.", "ru": "Шерсть заставила коробку А вырабатывать своё тепло.", "en": "The wool made box A produce its own heat."}, {"he": "הצמר האט את בריחת החום מקופסה א׳.", "ar": "الصوف أبطأ هروب الحرارة من الصندوق أ.", "ru": "Шерсть замедлила потерю тепла коробкой А.", "en": "The wool slowed the loss of heat from box A."}, {"he": "שתי הקופסאות איבדו בדיוק אותה כמות חום.", "ar": "فقد الصندوقان الكمية نفسها تمامًا من الحرارة.", "ru": "Обе коробки потеряли ровно одинаковое количество тепла.", "en": "Both boxes lost exactly the same amount of heat."}],2,{"he": "חשבו בכמה מעלות ירדה כל קופסה, ולא רק מה הטמפרטורה בסוף.", "ar": "احسبوا بكم درجة انخفض كل صندوق، لا درجة الحرارة النهائية فقط.", "ru": "Посчитайте, на сколько градусов остыла каждая коробка, а не только итоговую температуру.", "en": "Work out how many degrees each box dropped, not just the final temperature."},{"he": "קופסה א׳ ירדה 5 מעלות, וקופסה ב׳ ירדה 8 מעלות באותו זמן. הצמר מכיל אוויר כלוא ומפריע לחום לעבור, ולכן החום בורח לאט יותר. למשל בידוד בגג שומר על בית חם יותר בחורף וקריר יותר בקיץ.", "ar": "الصندوق أ انخفض 5 درجات، والصندوق ب انخفض 8 درجات في الوقت نفسه. الصوف يحتوي هواءً محبوسًا ويعيق انتقال الحرارة، فتهرب الحرارة ببطء أكبر. مثال: عزل السطح يُبقي البيت أدفأ شتاءً وأبرد صيفًا.", "ru": "Коробка А остыла на 5 градусов, а коробка Б за то же время — на 8. В шерсти есть запертый воздух, он мешает теплу проходить, поэтому тепло уходит медленнее. Например, утеплённая крыша сохраняет дом теплее зимой и прохладнее летом.", "en": "Box A dropped 5 degrees, and box B dropped 8 degrees in the same time. Wool holds trapped air that blocks heat, so heat escapes more slowly. For example, roof insulation keeps a home warmer in winter and cooler in summer."},null,[{"he": "קופסה ב׳ התחילה קרה יותר, 32 מעלות מול 40, ובכל זאת ירדה 8 מעלות מול 5 בלבד, כלומר איבדה חום מהר יותר.", "ar": "الصندوق ب بدأ أبرد، 32 درجة مقابل 40، ومع ذلك انخفض 8 درجات مقابل 5 فقط، أي أنه فقد الحرارة أسرع.", "ru": "Коробка Б была холоднее с начала, 32 против 40, но остыла на 8 градусов против 5, то есть теряла тепло быстрее.", "en": "Box B started colder, 32 degrees against 40, yet dropped 8 degrees against only 5, so it lost heat faster."}, {"he": "צמר אינו מקור חום; הוא רק מאט את מעבר החום החוצה.", "ar": "الصوف ليس مصدر حرارة؛ هو فقط يبطئ خروج الحرارة.", "ru": "Шерсть не источник тепла; она только замедляет уход тепла.", "en": "Wool is not a heat source; it only slows heat from getting out."}, null, {"he": "קופסה א׳ ירדה 5 מעלות וקופסה ב׳ ירדה 8, ולכן ההפסד שונה.", "ar": "الصندوق أ انخفض 5 درجات والصندوق ب 8، فالفقد مختلف.", "ru": "Коробка А остыла на 5 градусов, а Б — на 8, значит, потери разные.", "en": "Box A dropped 5 degrees and box B dropped 8, so the losses differ."}]),
Q("en-2-08",{"he": "מערכת סולארית על גג מייצרת בממוצע 15 קוט״ש ביום. המשפחה צורכת 600 קוט״ש בחודש של 30 ימים. איזה חלק מהצריכה החודשית המערכת מכסה?", "ar": "منظومة شمسية على سطح تنتج في المتوسط 15 ك.و.س في اليوم. العائلة تستهلك 600 ك.و.س في شهر من 30 يومًا. أي جزء من الاستهلاك الشهري تغطيه المنظومة؟", "ru": "Солнечная система на крыше даёт в среднем 15 кВт·ч в день. Семья тратит 600 кВт·ч за месяц из 30 дней. Какую часть месячного расхода покрывает система?", "en": "A rooftop solar system makes 15 kWh a day on average. The family uses 600 kWh in a 30-day month. What part of the monthly use does the system cover?"},[{"he": "2.5%", "ar": "2.5%", "ru": "2.5%", "en": "2.5%"}, {"he": "133%", "ar": "133%", "ru": "133%", "en": "133%"}, {"he": "25%", "ar": "25%", "ru": "25%", "en": "25%"}, {"he": "75%", "ar": "75%", "ru": "75%", "en": "75%"}],3,{"he": "חשבו קודם כמה המערכת מייצרת בחודש שלם, ואז השוו לצריכה.", "ar": "احسبوا أولًا كم تنتج المنظومة في شهر كامل، ثم قارنوا بالاستهلاك.", "ru": "Сначала найдите, сколько система даёт за целый месяц, а потом сравните с расходом.", "en": "First find how much the system makes in a whole month, then compare it with the use."},{"he": "בחודש המערכת מייצרת 15 כפול 30, כלומר 450 קוט״ש. 450 מתוך 600 הם שלושה רבעים, כלומר 75%. למשל את 25% הנותרים המשפחה מקבלת מרשת החשמל.", "ar": "في الشهر تنتج المنظومة 15 في 30، أي 450 ك.و.س. 450 من 600 هي ثلاثة أرباع، أي 75%. مثال: الـ 25% الباقية تأخذها العائلة من شبكة الكهرباء.", "ru": "За месяц система даёт 15 на 30, то есть 450 кВт·ч. 450 из 600 — это три четверти, то есть 75%. Например, оставшиеся 25% семья получает из электросети.", "en": "In a month the system makes 15 times 30, which is 450 kWh. 450 out of 600 is three quarters, so 75%. For example, the family gets the other 25% from the power grid."},null,[{"he": "2.5% מתקבל מהשוואה של ייצור ביום אחד לצריכה של חודש שלם.", "ar": "2.5% ناتج عن مقارنة إنتاج يوم واحد باستهلاك شهر كامل.", "ru": "2.5% получается, если сравнить выработку за день с расходом за месяц.", "en": "2.5% comes from comparing one day's output with a whole month's use."}, {"he": "133% מתקבל מחילוק הפוך, של הצריכה בייצור.", "ar": "133% ناتج عن قسمة معكوسة، للاستهلاك على الإنتاج.", "ru": "133% получается при обратном делении: расход на выработку.", "en": "133% comes from dividing the wrong way round, use by output."}, {"he": "25% הוא החלק שהמערכת לא מכסה, ולא החלק שהיא מכסה.", "ar": "25% هو الجزء الذي لا تغطيه المنظومة، لا الجزء الذي تغطيه.", "ru": "25% — это доля, которую система не покрывает.", "en": "25% is the part the system does not cover, not the part it covers."}, null]),
Q("en-2-09",{"he": "חטיף שוקולד מכיל 250 קילוקלוריות. בהליכה מהירה אדם מוציא בערך 5 קילוקלוריות בדקה. כמה דקות הליכה צריך כדי להוציא את האנרגיה של החטיף?", "ar": "قطعة شوكولاتة تحتوي 250 كيلو سعرة حرارية. في المشي السريع يصرف الإنسان نحو 5 كيلو سعرات في الدقيقة. كم دقيقة مشي نحتاج لصرف طاقة القطعة؟", "ru": "Шоколадный батончик содержит 250 килокалорий. При быстрой ходьбе человек тратит около 5 килокалорий в минуту. Сколько минут ходьбы нужно, чтобы потратить энергию батончика?", "en": "A chocolate bar contains 250 kilocalories. Brisk walking uses about 5 kilocalories a minute. How many minutes of walking are needed to use up the bar's energy?"},[{"he": "50 דקות.", "ar": "50 دقيقة.", "ru": "50 минут.", "en": "50 minutes."}, {"he": "5 דקות.", "ar": "5 دقائق.", "ru": "5 минут.", "en": "5 minutes."}, {"he": "1,250 דקות.", "ar": "1,250 دقيقة.", "ru": "1,250 минут.", "en": "1,250 minutes."}, {"he": "255 דקות.", "ar": "255 دقيقة.", "ru": "255 минут.", "en": "255 minutes."}],0,{"he": "חשבו כמה קילוקלוריות מוציאים ב-10 דקות, והמשיכו משם.", "ar": "احسبوا كم كيلو سعرة نصرف في 10 دقائق، وتابعوا من هناك.", "ru": "Посчитайте, сколько килокалорий уходит за 10 минут, и продолжайте оттуда.", "en": "Work out how many kilocalories are used in 10 minutes, and go on from there."},{"he": "מחלקים את האנרגיה בקצב ההוצאה: 250 חלקי 5 הם 50 דקות. כלומר חטיף אחד שווה כמעט שעה של הליכה מהירה. למשל תפוח של 80 קילוקלוריות שווה בערך 16 דקות של הליכה כזו.", "ar": "نقسم الطاقة على معدل الصرف: 250 على 5 تساوي 50 دقيقة. أي أن قطعة واحدة تعادل نحو ساعة من المشي السريع. مثال: تفاحة فيها 80 كيلو سعرة تعادل نحو 16 دقيقة من هذا المشي.", "ru": "Энергию делим на скорость расхода: 250 разделить на 5 — это 50 минут. То есть один батончик — почти час быстрой ходьбы. Например, яблоко на 80 килокалорий — это около 16 минут такой ходьбы.", "en": "Divide the energy by the rate of use: 250 divided by 5 is 50 minutes. So one bar equals almost an hour of brisk walking. For example, an 80 kilocalorie apple equals about 16 minutes of such walking."},null,[null, {"he": "ב-5 דקות מוציאים רק 25 קילוקלוריות, עשירית מהאנרגיה של החטיף.", "ar": "في 5 دقائق نصرف 25 كيلو سعرة فقط، عُشر طاقة القطعة.", "ru": "За 5 минут уходит лишь 25 килокалорий, десятая часть батончика.", "en": "In 5 minutes you use only 25 kilocalories, a tenth of the bar's energy."}, {"he": "1,250 מתקבל מכפל 250 ב-5, אבל כאן צריך לחלק.", "ar": "1,250 ناتج عن ضرب 250 في 5، لكن هنا يجب القسمة.", "ru": "1,250 получается умножением 250 на 5, а здесь нужно делить.", "en": "1,250 comes from multiplying 250 by 5, but here you must divide."}, {"he": "255 מתקבל מחיבור המספרים, ולחיבור אין משמעות בחישוב הזה.", "ar": "255 ناتج عن جمع الرقمين، والجمع لا معنى له في هذا الحساب.", "ru": "255 получается сложением чисел, а сложение здесь не имеет смысла.", "en": "255 comes from adding the numbers, and adding makes no sense here."}]),
Q("en-2-10",{"he": "נורת להט של 60 ואט ונורת לד של 10 ואט מאירות באותה עוצמה. כמה קוט״ש חוסכים בהחלפה ללד, במשך 1,000 שעות של הארה?", "ar": "مصباح متوهج 60 واط ومصباح LED 10 واط يضيئان بالشدة نفسها. كم ك.و.س نوفّر بالانتقال إلى LED خلال 1,000 ساعة إضاءة؟", "ru": "Лампа накаливания на 60 ватт и светодиодная на 10 ватт светят одинаково. Сколько кВт·ч экономит замена на светодиод за 1,000 часов освещения?", "en": "A 60 watt incandescent bulb and a 10 watt LED give the same light. How many kWh does switching to the LED save over 1,000 hours of lighting?"},[{"he": "70 קוט״ש", "ar": "70 ك.و.س", "ru": "70 кВт·ч", "en": "70 kWh"}, {"he": "50 קוט״ש", "ar": "50 ك.و.س", "ru": "50 кВт·ч", "en": "50 kWh"}, {"he": "50,000 קוט״ש", "ar": "50,000 ك.و.س", "ru": "50,000 кВт·ч", "en": "50,000 kWh"}, {"he": "6 קוט״ש", "ar": "6 ك.و.س", "ru": "6 кВт·ч", "en": "6 kWh"}],1,{"he": "מצאו קודם בכמה ואט הלד חסכונית יותר, ואז חשבו לאורך כל השעות.", "ar": "جِدوا أولًا بكم واط يكون LED أوفر، ثم احسبوا لكل الساعات.", "ru": "Сначала найдите, на сколько ватт светодиод экономнее, а потом посчитайте за все часы.", "en": "First find by how many watts the LED is more economical, then work it out for all the hours."},{"he": "ההפרש בהספק הוא 50 ואט. כפול 1,000 שעות זה 50,000 ואט־שעה, כלומר 50 קוט״ש. למשל בבית עם 10 נורות כאלה החיסכון גדל פי 10.", "ar": "الفرق في القدرة 50 واط. في 1,000 ساعة يساوي 50,000 واط ساعة، أي 50 ك.و.س. مثال: في بيت فيه 10 مصابيح كهذه يكبر التوفير 10 مرات.", "ru": "Разница в мощности — 50 ватт. За 1,000 часов это 50,000 ватт-часов, то есть 50 кВт·ч. Например, в доме с 10 такими лампами экономия в 10 раз больше.", "en": "The power difference is 50 watts. Over 1,000 hours that is 50,000 watt-hours, which is 50 kWh. For example, in a home with 10 such bulbs the saving is 10 times bigger."},null,[{"he": "70 מתקבל מחיבור ההספקים, אבל החיסכון הוא ההפרש ביניהם.", "ar": "70 ناتج عن جمع القدرتين، لكن التوفير هو الفرق بينهما.", "ru": "70 получается сложением мощностей, а экономия — это их разница.", "en": "70 comes from adding the powers, but the saving is their difference."}, null, {"he": "50,000 הוא בוואט־שעה; צריך לחלק ב-1,000 כדי לקבל קוט״ש.", "ar": "50,000 بالواط ساعة؛ يجب القسمة على 1,000 للحصول على ك.و.س.", "ru": "50,000 — это ватт-часы; чтобы получить кВт·ч, делим на 1,000.", "en": "50,000 is in watt-hours; divide by 1,000 to get kWh."}, {"he": "6 הוא היחס בין ההספקים, ולא כמות האנרגיה שנחסכה.", "ar": "6 هي النسبة بين القدرتين، لا كمية الطاقة الموفَّرة.", "ru": "6 — это отношение мощностей, а не сэкономленная энергия.", "en": "6 is the ratio of the powers, not the amount of energy saved."}]),
Q("en-2-11",{"he": "בטבלה של מדינה מסוימת מופיעים מקורות החשמל: גז טבעי 65%, פחם 20%, שמש 12%, רוח 3%. מה נכון לפי הנתונים?", "ar": "في جدول لدولة ما تظهر مصادر الكهرباء: غاز طبيعي 65%، فحم 20%، شمس 12%، رياح 3%. ما الصحيح حسب المعطيات؟", "ru": "В таблице одной страны указаны источники электричества: природный газ 65%, уголь 20%, солнце 12%, ветер 3%. Что верно по этим данным?", "en": "A table for one country lists its electricity sources: natural gas 65%, coal 20%, sun 12%, wind 3%. What is true according to the data?"},[{"he": "רוב החשמל במדינה מגיע ממקורות מתחדשים.", "ar": "معظم الكهرباء في الدولة يأتي من مصادر متجددة.", "ru": "Большая часть электричества страны — из возобновляемых источников.", "en": "Most of the country's electricity comes from renewable sources."}, {"he": "השמש מספקת יותר חשמל מהגז הטבעי.", "ar": "الشمس توفّر كهرباء أكثر من الغاز الطبيعي.", "ru": "Солнце даёт больше электричества, чем природный газ.", "en": "The sun supplies more electricity than natural gas."}, {"he": "85% מהחשמל מיוצר משריפת דלקים.", "ar": "85% من الكهرباء تُنتج من حرق الوقود.", "ru": "85% электричества получают сжиганием топлива.", "en": "85% of the electricity comes from burning fuels."}, {"he": "הפחם הוא מקור החשמל הגדול ביותר.", "ar": "الفحم هو أكبر مصدر للكهرباء.", "ru": "Уголь — самый большой источник электричества.", "en": "Coal is the largest source of electricity."}],2,{"he": "סמנו אילו מקורות נשרפים ואילו לא, וחברו כל קבוצה לחוד.", "ar": "حدّدوا أي المصادر تُحرق وأيها لا، واجمعوا كل مجموعة وحدها.", "ru": "Отметьте, какие источники сжигают, а какие нет, и сложите каждую группу отдельно.", "en": "Mark which sources are burned and which are not, and add up each group separately."},{"he": "גז ופחם הם דלקים שנשרפים: 65 ועוד 20 הם 85%. שמש ורוח הם מקורות מתחדשים, ויחד הם רק 15%. למשל גם בישראל רוב החשמל עדיין מגיע משריפת גז טבעי.", "ar": "الغاز والفحم وقودان يُحرقان: 65 و20 تساوي 85%. الشمس والرياح مصدران متجددان، ومعًا 15% فقط. مثال: في إسرائيل أيضًا ما زالت معظم الكهرباء تأتي من حرق الغاز الطبيعي.", "ru": "Газ и уголь — топливо, которое сжигают: 65 плюс 20 — это 85%. Солнце и ветер — возобновляемые источники, вместе только 15%. Например, и в Израиле большая часть электричества пока получается сжиганием природного газа.", "en": "Gas and coal are fuels that are burned: 65 plus 20 is 85%. Sun and wind are renewable sources, together only 15%. For example, in Israel too most electricity still comes from burning natural gas."},null,[{"he": "שמש ורוח יחד הם רק 15%, הרבה פחות ממחצית.", "ar": "الشمس والرياح معًا 15% فقط، أقل بكثير من النصف.", "ru": "Солнце и ветер вместе дают лишь 15%, намного меньше половины.", "en": "Sun and wind together are only 15%, far less than half."}, {"he": "השמש מספקת 12% והגז 65%, כך שהגז מספק הרבה יותר.", "ar": "الشمس توفّر 12% والغاز 65%، فالغاز يوفّر أكثر بكثير.", "ru": "Солнце даёт 12%, а газ 65%, так что газ даёт намного больше.", "en": "The sun gives 12% and gas 65%, so gas gives much more."}, null, {"he": "הפחם מספק 20%, והגז הטבעי מספק 65%, יותר מפי 3.", "ar": "الفحم يوفّر 20% والغاز الطبيعي 65%، أكثر من 3 أضعاف.", "ru": "Уголь даёт 20%, а природный газ 65%, больше чем втрое.", "en": "Coal gives 20% and natural gas 65%, more than three times as much."}]),
