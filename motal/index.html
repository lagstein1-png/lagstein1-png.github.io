<style>
/* ============================================================
   ספרות — ספרות לבגרות
   קהל היעד לא "לא יודע אזרחות". הוא נכשל בה שוב ושוב, מפני
   שהמקצוע כולו טקסט ומושגים — ולכן כל החלטה כאן נמדדת בשאלה
   אחת: האם היא מורידה עומס, או מוסיפה.
   · כל שאלה נושאת רמז שאינו התשובה, והסבר שנפתח גם כשצדקו.
   · שום טקסט לא מוצג בלי שאפשר לשמוע אותו.
   · שפת האם אינה קישוט: מושג באזרחות נלמד קודם בשפה שחושבים בה.
   כל המידות ב-rem, כדי שהגדלת טקסט תגדיל את הכול יחד.
   ============================================================ */
:root{
  --font:"Heebo","Rubik",system-ui,"Segoe UI",Arial,sans-serif;
  --en:"Lexend","Heebo",system-ui,"Segoe UI",Arial,sans-serif;
  --ar:"Noto Sans Arabic",system-ui,"Segoe UI",Arial,sans-serif;
  --ru:"Noto Sans","Heebo",system-ui,"Segoe UI",Arial,sans-serif;   /* קירילית — Heebo אינו מכיל אותה */
  --bg:#f5f7fb; --surface:#ffffff; --surface2:#e8ecf6;
  --ink:#101828; --muted:#55607a; --faint:#6f7a95; --line:#dde3f0;
  --accent:#1d4ed8; --accent-ink:#ffffff; --accent-soft:#dbe4fe;
  --gold:#a16207; --gold-soft:#fbf0d5; --hit:#f5c451; --hit-ink:#1a1300;
  --ok:#15803d; --ok-soft:#dcfce7; --bad:#be123c; --bad-soft:#ffe4e9;
  --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px -12px rgba(16,24,40,.2);
  --r:14px;
  /* צבע לכל מסלול. לא קישוט: ארבעה סוגי לימוד שונים לגמרי, וצבע
     קבוע לכל אחד חוסך למי שמתקשה להתמצא את השאלה "איפה אני". */
  --c-sound:#0369a1; --cs-sound:#dbeefc;   /* צליל ואות   */
  --c-words:#15803d; --cs-words:#dcfce7;   /* מילים       */
  --c-talk:#b43a0a;  --cs-talk:#fde5d8;    /* מדוברת — #c2410c היה 4.28:1 על ה-cs (30.9) */
  --c-read:#6d28d9;  --cs-read:#eae2fd;    /* ספרותית     */
}
:root[data-theme="dark"]{
  --bg:#0e1425; --surface:#17203a; --surface2:#202c4d;
  --ink:#e8edf8; --muted:#9aa5c0; --faint:#78829e; --line:#2a3762;
  --accent:#93c5fd; --accent-ink:#0e1425; --accent-soft:#1b2a5c;
  --gold:#fbbf24; --gold-soft:#33270f; --hit:#ffd24d; --hit-ink:#241a00;
  --ok:#4ade80; --ok-soft:#132a1c; --bad:#fb7185; --bad-soft:#33161f;
  --warn:#fbbf24; --warn-soft:#33260f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  --c-sound:#7dd3fc; --cs-sound:#0b2a3d;
  --c-words:#86efac; --cs-words:#0f2a1a;
  --c-talk:#fdba74;  --cs-talk:#3a2113;
  --c-read:#c4b5fd;  --cs-read:#261a45;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1425; --surface:#17203a; --surface2:#202c4d;
    --ink:#e8edf8; --muted:#9aa5c0; --faint:#78829e; --line:#2a3762;
    --accent:#93c5fd; --accent-ink:#0e1425; --accent-soft:#1b2a5c;
    --gold:#fbbf24; --gold-soft:#33270f; --hit:#ffd24d; --hit-ink:#241a00;
    --ok:#4ade80; --ok-soft:#132a1c; --bad:#fb7185; --bad-soft:#33161f;
    --warn:#fbbf24; --warn-soft:#33260f;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
    --c-sound:#7dd3fc; --cs-sound:#0b2a3d;
    --c-words:#86efac; --cs-words:#0f2a1a;
    --c-talk:#fdba74;  --cs-talk:#3a2113;
    --c-read:#c4b5fd;  --cs-read:#261a45;
  }
}
/* ניגודיות גבוהה — שחור על לבן, מסגרות מלאות, בלי גוונים רכים */
:root.hc{
  --bg:#ffffff; --surface:#ffffff; --surface2:#ffffff;
  --ink:#000000; --muted:#1a1a1a; --faint:#333333; --line:#000000;
  --accent:#00434b; --accent-ink:#ffffff; --accent-soft:#e6f2f3;
  --gold:#5c3d00; --gold-soft:#f7efdf; --hit:#ffe600; --hit-ink:#000000;
  --ok:#0a5c2a; --ok-soft:#e6f4ea; --bad:#8c0f2c; --bad-soft:#fbe9ed;
  --warn:#6b3d00; --warn-soft:#f7efdf; --shadow:none;
  --c-sound:#00305c; --cs-sound:#e8eef7;
  --c-words:#0a5c2a; --cs-words:#e6f4ea;
  --c-talk:#7a2c00;  --cs-talk:#f9ece4;
  --c-read:#3d1a75;  --cs-read:#eee8f9;
}
:root.hc *{box-shadow:none!important}
:root.hc .card,:root.hc .btn,:root.hc .opt{border-width:2px!important}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs,17px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  font-size:1rem;line-height:1.65;-webkit-text-size-adjust:100%}
:root.clear body{font-family:"Verdana","Tahoma","Heebo",sans-serif;letter-spacing:.012em}
:root.spaced body{word-spacing:.22em;line-height:1.95}
:root.rm *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
h1,h2,h3{margin:0;line-height:1.3;font-weight:800}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}
/* כרטיס ״מבנה הבגרות״ (--gold-soft): הקישור לאתר משרד החינוך בלי צבע נפל לכחול ברירת המחדל — 1.55:1 בכהה (30.9) */
.gcard a{color:var(--accent)}
.skip{position:absolute;inset-inline-start:-9999px}
.skip:focus{position:static;display:inline-flex;align-items:center;min-height:44px;
  margin:8px;padding:8px 14px;background:#0b7c71;color:#fff;
  border-radius:8px;font-weight:700;text-decoration:none;z-index:100}

/* כל טקסט אנגלי — כיוון, גופן ומרווח משלו. unicode-bidi:isolate מונע
   מהמשפט האנגלי לגרור אחריו את סימני הפיסוק של המשפט העברי. */
.en{font-family:var(--en);direction:ltr;unicode-bidi:isolate;text-align:start}
.en-b{font-family:var(--en);direction:ltr;unicode-bidi:isolate;display:inline-block}

.wrap{max-width:56rem;margin:0 auto;padding:0 clamp(.9rem,3vw,1.5rem)}
.hbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-block:.6rem}
:root.hc .hbar{background:var(--bg);backdrop-filter:none}
.hrow{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
.brand{font-size:1.35rem;font-weight:800;letter-spacing:-.01em;display:flex;
  align-items:baseline;gap:.5rem;margin-inline-end:auto}
.brand small{font-size:.72rem;font-weight:600;color:var(--muted);letter-spacing:.06em}
.gbtn{display:inline-flex;align-items:center;gap:.4rem;background:var(--surface);
  border:1px solid var(--line);border-radius:999px;padding:.42rem .8rem;cursor:pointer;
  font-size:.86rem;font-weight:600;box-shadow:var(--shadow);min-height:44px}
.gbtn:hover{border-color:var(--accent)}
.gbtn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:1.1rem}
.grid{display:grid;gap:.85rem}
@media(min-width:640px){.g2{grid-template-columns:1fr 1fr}}
@media(min-width:900px){.g3{grid-template-columns:repeat(3,1fr)}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;
  border:1px solid var(--line);background:var(--surface);border-radius:12px;
  padding:.72rem 1.1rem;font-weight:700;cursor:pointer;box-shadow:var(--shadow);
  min-height:2.9rem;font-size:1rem}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;box-shadow:none}
.btn[disabled]{opacity:.45;cursor:default}
.btn.wide{width:100%}

.chip{display:inline-flex;align-items:center;gap:.35rem;border-radius:999px;
  padding:.22rem .6rem;font-size:.78rem;font-weight:700;background:var(--surface2);color:var(--muted)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}

/* גופני שפה: Heebo אינו מכיל ערבית וקירילית, ולכן שפת הממשק
   מחליפה גופן ולא רק כיוון. */
html[lang="ar"] body,html[lang="ar"] input,html[lang="ar"] button,
html[lang="ar"] textarea,html[lang="ar"] select{font-family:var(--ar)}
html[lang="ru"] body,html[lang="ru"] input,html[lang="ru"] button,
html[lang="ru"] textarea,html[lang="ru"] select{font-family:var(--ru)}
button[data-a="lang"][lang="ar"]{font-family:var(--ar)}
button[data-a="lang"][lang="ru"]{font-family:var(--ru)}

/* ===== מסלולים: הצבע נכנס ככרטיס, לא כרקע של טקסט ===== */
.trk{--c:var(--accent);--cs:var(--accent-soft)}
.t-sound{--c:var(--c-sound);--cs:var(--cs-sound)}
.t-words{--c:var(--c-words);--cs:var(--cs-words)}
.t-talk{--c:var(--c-talk); --cs:var(--cs-talk)}
.t-read{--c:var(--c-read); --cs:var(--cs-read)}
.tcard{border-inline-start:5px solid var(--c);cursor:pointer;text-align:start;width:100%;
  display:flex;flex-direction:column;gap:.4rem;align-items:stretch}
.tcard:hover{border-color:var(--c)}
.tcard h3{font-size:1.05rem}
.tcard .sub{font-size:.85rem;color:var(--muted)}
.tdot{width:.62rem;height:.62rem;border-radius:50%;background:var(--c);flex:none}
.thead{display:flex;align-items:center;gap:.5rem}
.tpill{background:var(--cs);color:var(--c);border-radius:999px;padding:.15rem .55rem;
  font-size:.72rem;font-weight:800}

/* ===== סרגל שליטה ברמות ===== */
.lvls{display:flex;gap:.4rem;flex-wrap:wrap}
.lvl{border:1px solid var(--line);background:var(--surface);border-radius:10px;
  padding:.4rem .7rem;font-size:.82rem;font-weight:700;cursor:pointer;
  display:inline-flex;align-items:center;gap:.4rem}
.lvl.on{background:var(--c,var(--accent));color:var(--accent-ink);border-color:var(--c,var(--accent))}
.bar{height:.42rem;border-radius:999px;background:var(--surface2);overflow:hidden;flex:1;min-width:3rem}
.bar i{display:block;height:100%;background:var(--c,var(--accent))}
.bar.b0 i{background:var(--bad)} .bar.b1 i{background:var(--warn)} .bar.b2 i{background:var(--ok)}

/* ===== תרגול ===== */
.qcard{border-top:5px solid var(--c,var(--accent))}
.qtop{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.7rem}
.qtext{font-size:1.12rem;font-weight:600;margin:.2rem 0 .3rem}
.qhint{color:var(--muted);font-size:.9rem}
/* המילה או המשפט שנלמדים. גדול, מרווח, ותמיד לצד כפתור השמעה. */
.subject{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;
  background:var(--surface2);border-radius:12px;padding:.85rem 1rem;margin:.5rem 0}
.subject .word{font-family:var(--en);direction:ltr;unicode-bidi:isolate;
  font-size:1.7rem;font-weight:700;letter-spacing:.01em;line-height:1.25}
.subject .ipa{font-family:var(--en);direction:ltr;unicode-bidi:isolate;
  color:var(--muted);font-size:.95rem}
.spk{border:1px solid var(--line);background:var(--surface);border-radius:999px;
  width:2.7rem;height:2.7rem;display:inline-flex;align-items:center;justify-content:center;
  cursor:pointer;flex:none;box-shadow:var(--shadow)}
.spk:hover{border-color:var(--accent);color:var(--accent)}
.spk.sm{width:2.1rem;height:2.1rem;background:#0b7c71;border-color:#0b7c71;color:#fff}
/* הרמקול הקטן — אותו ירוק של כפתור ההקראה הגדול, התקן המשותף */
.spk.sm:hover{background:#0b7c71;border-color:#0b7c71;color:#fff}
.spk.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.opts{display:grid;gap:.6rem;margin-top:.9rem}
.orow{display:flex;gap:.45rem;align-items:center;min-width:0}
/* min-width:0 — פריט grid נולד עם min-width:auto, ולכן משפט ארוך
   באפשרות היה מרחיב את השורה מעבר למכל ודוחף את הרמקול מחוץ למסך. */
.orow .opt{flex:1;min-width:0}
@media(min-width:560px){.opts.two{grid-template-columns:1fr 1fr}}
.opt{display:flex;align-items:center;gap:.6rem;text-align:start;width:100%;
  border:2px solid var(--line);background:var(--surface);border-radius:12px;
  padding:.8rem .9rem;cursor:pointer;font-size:1.02rem;font-weight:600;min-height:3.1rem}
.opt:hover{border-color:var(--accent)}
.opt .k{width:1.9rem;height:1.9rem;border-radius:8px;background:var(--surface2);
  display:inline-flex;align-items:center;justify-content:center;font-size:.85rem;
  font-weight:800;color:var(--muted);flex:none}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .k{background:var(--ok);color:var(--bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .k{background:var(--bad);color:var(--bg)}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.55}
/* בחירה במבחן היא בחירה, לא תשובה נכונה. במסכי התרגול הצבע
   הירוק אומר "צדקת", ובמבחן אסור לו להופיע כלל — הוא נותן
   משוב שגוי לכל בחירה. ניטרלי, ורק מסמן מה סומן. */
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);margin-inline-start:3px}
.dot.ok{background:var(--ok);border-color:var(--ok)}
.dot.no{background:var(--bad);border-color:var(--bad)}
.dot.flag{box-shadow:0 0 0 2px var(--accent)}

/* אריחי בניית משפט. הסדר הוא התרגיל, ולכן האריח חייב להיראות כמשהו
   שאפשר להרים — מסגרת מלאה ורקע משלו, לא טקסט על רקע הכרטיס. */
.tiles{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:.7rem}
.tile{font-family:var(--en);direction:ltr;border:2px solid var(--line);
  background:var(--surface);border-radius:10px;padding:.5rem .8rem;font-weight:600;
  cursor:pointer;font-size:1.02rem;min-height:2.7rem}
.tile:hover{border-color:var(--accent)}
.slot{min-height:3.2rem;border:2px dashed var(--line);border-radius:12px;
  background:var(--surface2);padding:.5rem;display:flex;flex-wrap:wrap;gap:.45rem;
  align-items:center;direction:ltr}
.slot.ok{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.slot.bad{border-style:solid;border-color:var(--bad);background:var(--bad-soft)}
.slot .tile{background:var(--surface)}

/* ===== משוב ===== */
.fb{margin-top:.9rem;border-radius:12px;padding:.85rem 1rem;border:1px solid transparent}
.fb.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.fb.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.fb b{display:block;font-size:1.02rem;margin-bottom:.2rem}
.fb .body{color:var(--ink);font-weight:500;font-size:.95rem}
.why{margin-top:.55rem;padding-top:.55rem;border-top:1px dashed currentColor;color:var(--ink);
  font-weight:500;font-size:.93rem}

/* ===== קטע קריאה ===== */
/* איור בתוך כרטיס שאלה. הצבע יורש מ-color, ולכן אותו SVG נראה
   נכון גם בערכה הבהירה וגם בכהה בלי גרסה שנייה. */
.figure{margin:.7rem 0;padding:.6rem;border:1px solid var(--line);border-radius:12px;
  background:var(--surface2);color:var(--ink);overflow-x:auto}
.figure svg{display:block;max-width:100%}
/* המבחן המדומה: השאלות זו אחר זו, כמו חוברת בחינה. */
.simq{border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;margin:.8rem 0;
  background:var(--surface)}
.simq.miss{border-color:var(--warn)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.simn{font-weight:800;color:var(--muted);font-size:.86rem}
.simbar{position:sticky;top:0;z-index:5;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:.6rem .8rem;margin:.8rem 0;display:flex;gap:.6rem;
  align-items:center;flex-wrap:wrap;box-shadow:var(--shadow)}
.clock{font-weight:800;font-variant-numeric:tabular-nums;font-size:1.1rem}
.clock.low{color:var(--bad)}
.passage{background:var(--surface2);border-radius:12px;padding:1rem 1.1rem;margin:.6rem 0;
  font-family:var(--en);direction:ltr;unicode-bidi:isolate;font-size:1.08rem;line-height:2}
.passage .s{border-radius:5px;padding:.05em .12em;cursor:pointer}
.passage .s:hover{background:var(--accent-soft)}
.passage .s.now{background:var(--accent-soft);box-shadow:0 2px 0 var(--accent)}
.wd{border-radius:5px;padding:1px 3px}
.wd.hit{background:var(--hit);color:var(--hit-ink);font-weight:600}
/* כשמנוע הדיבור אינו מדווח על גבולות מילים — קורה הרבה בעברית
   באנדרואיד — אין מה להדגיש מילה־מילה, ואז מודגש כל האיבר. הכלל
   שקיים כאן מכוון למשפט בתוך קטע קריאה בלבד, ולכן ההדגשה החלופית
   על איבר אחר לא נראתה כלל. */
.wd.now,p.now,div.now,span.now,b.now{background:var(--hit);color:var(--hit-ink);
  border-radius:8px;box-shadow:0 0 0 4px var(--hit)}
.gloss{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.5rem}
.gword{border:1px solid var(--line);background:var(--surface);border-radius:999px;
  padding:.25rem .6rem;font-size:.85rem;cursor:pointer}
.gword b{font-family:var(--en);direction:ltr;unicode-bidi:isolate}

/* ===== סרגל מצב הקול ===== */
.vstrip{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;border-radius:10px;
  padding:.45rem .7rem;font-size:.85rem;font-weight:600;margin-bottom:.7rem}
.vstrip.ok{background:var(--ok-soft);color:var(--ok)}
.vstrip.warn{background:var(--warn-soft);color:var(--warn)}
.vstrip.bad{background:var(--bad-soft);color:var(--bad)}
.vstrip .btn{padding:.3rem .7rem;min-height:44px;font-size:.82rem}  /* 2.1rem היו 36 פיקסלים — מתחת ליעד המגע */

/* ===== הגדרות ===== */
.row{display:flex;align-items:center;justify-content:space-between;gap:.8rem;
  padding:.7rem 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row:last-child{border-bottom:0}
.row .lab{font-weight:700}
.row .desc{font-size:.85rem;color:var(--muted);font-weight:500}
.sw{width:3.2rem;height:1.8rem;border-radius:999px;background:var(--surface2);
  border:1px solid var(--line);position:relative;cursor:pointer;flex:none}
.sw i{position:absolute;top:.18rem;inset-inline-start:.2rem;width:1.3rem;height:1.3rem;
  border-radius:50%;background:var(--faint);transition:.15s}
.sw.on{background:var(--accent);border-color:var(--accent)}
.sw.on i{inset-inline-start:1.5rem;background:#fff}
.vgrid{display:grid;gap:.5rem;grid-template-columns:1fr}
@media(min-width:560px){.vgrid{grid-template-columns:1fr 1fr}}
.vopt{display:flex;align-items:center;gap:.6rem;border:2px solid var(--line);
  background:var(--surface);border-radius:12px;padding:.6rem .75rem;cursor:pointer;text-align:start}
.vopt.on{border-color:var(--accent);background:var(--accent-soft)}
.vopt .nm{font-weight:700}
.vopt .ds{font-size:.8rem;color:var(--muted)}
input[type=password],input[type=text]{font:inherit;background:var(--surface);color:var(--ink);
  border:1px solid var(--line);border-radius:10px;padding:.6rem .7rem;min-width:0;flex:1;
  direction:ltr;text-align:left}
input[type=range]{width:100%;accent-color:var(--accent)}

.fbar{border-top:1px solid var(--line);margin-top:2rem;padding-block:1rem;
  color:var(--muted);font-size:.82rem}   /* --faint יצא 2.96:1 */
.hidden{display:none!important}

/* ---------- שדה קלט של המבחן ----------
   מודול המבחן הועתק לכאן מאפליקציה שבה .field כבר היה מוגדר.
   בלי הכלל הזה שדה השם של הנבחן נשאר תיבת ברירת המחדל של
   הדפדפן — 21 פיקסלים גובה, הרבה מתחת ליעד המגע של 44. */
.field{width:100%;box-sizing:border-box;font:inherit;font-size:1rem;
  min-height:48px;padding:12px 14px;border-radius:11px;outline:none;background:var(--surface2);color:inherit;border:1px solid var(--line)}
.field:focus{border-color:var(--accent)}
/* `outline:none` של `.field` הוא (0,1,0) ויושב אחרי הכלל הכללי
   `:focus-visible` שבראש הקובץ — אותה ספציפיות, ולכן המאוחר מנצח
   והשדה נשאר בלי סימן מיקוד במקלדת. אותו כלל קיים ב-literature וב-biology. */
.field:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
textarea.field{min-height:96px;resize:vertical}

/* ---------- שורות המבחן ----------
   .tog הגיע ממודול המבחן שהועתק לכאן, ולא היה לו עיצוב כלל: השם
   והמידע שמתחתיו נדבקו לשורה אחת בלי רווח. */
.tog{display:flex;align-items:center;gap:13px;width:100%;text-align:start;
  background:var(--surface2);border:1px solid transparent;border-radius:12px;
  padding:13px 15px;min-width:0}
.tog:hover{border-color:var(--line)}
.tog+.tog{margin-top:9px}
.tog .tt{flex:1;min-width:0}
.tog .tt b{display:block;font-size:.97rem;overflow-wrap:anywhere}
.tog .tt span{display:block;color:var(--muted);font-size:.85rem;overflow-wrap:anywhere;margin-top:2px}

/* יעד מגע לקישור התחתית. קישור טקסט בשורה יוצא בגובה הטקסט —
   15 פיקסלים — וזה קטן מדי לאצבע, גם כשהוא רק לתנאי השימוש. */
.lg-foot a{display:inline-flex;align-items:center;min-height:44px;padding-inline:6px}

/* ---------- יעדי מגע ----------
   .lvl יצא 39 פיקסלים ומתג ה-.sw רק 31, שניהם מתחת ל-44 שהפרויקט
   מחייב את עצמו בהם. במתג לא מגדילים את המסילה — היא תיראה מגושמת —
   אלא מרחיבים את שטח הלחיצה סביבה. */
.lvl{min-height:44px}
.sw{position:relative}
.sw::after{content:"";position:absolute;inset-block:-7px;inset-inline:-4px}

/* ---------- מסך בניית המבחן ----------
   .seg ו-.tpc הגיעו עם מודול המבחן שהועתק לכאן, ולא היה להם עיצוב:
   כפתורי הבחירה יצאו 34 פיקסלים, וכרטיסי הנושאים 6 פיקסלים בלבד —
   כלומר המורה לא יכול היה לבחור נושאים בכלל. */
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 auto;min-width:0;min-height:44px;border:1px solid var(--line);
  background:var(--surface);border-radius:10px;padding:10px 12px;font:inherit;
  font-weight:600;font-size:.9rem;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.tpc{position:relative;display:flex;flex-direction:column;gap:9px;text-align:start;
  background:var(--surface);border:1px solid var(--line);
  border-inline-start:4px solid var(--c,var(--accent));border-radius:12px;padding:14px;
  box-shadow:var(--shadow);min-width:0;min-height:44px;cursor:pointer;font:inherit;color:inherit}
.tpc.on{border-color:var(--accent);background:var(--accent-soft)}
.tpc .tn{font-weight:700;font-size:.98rem;overflow-wrap:anywhere;color:var(--c,var(--ink))}
.tpc .td{color:var(--muted);font-size:.8rem;overflow-wrap:anywhere}

/* טקסט על רקע ההדגשה: --accent-ink ולא לבן קבוע. במצב כהה
   ההדגשה בהירה, ולבן עליה יצא 1.5–2.0:1 — כמעט בלתי קריא. */
/* ---------- מצב מורה ---------- */
.te-wrap{position:fixed;inset:0;z-index:2147482500;background:rgba(8,12,20,.72);
  display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto;
  font-family:system-ui,"Heebo","Rubik",Arial,sans-serif}
.te-box{background:#fff;color:#111827;max-width:26rem;width:100%;border-radius:18px;
  box-shadow:0 24px 70px -20px rgba(0,0,0,.6);padding:clamp(18px,4vw,26px);
  max-height:92vh;overflow-y:auto;font-size:16px;line-height:1.6}
.te-box h2{margin:0 0 6px;font-size:1.35rem;font-weight:800;line-height:1.25}
.te-lead{margin:0 0 10px;color:#374151}
.te-warn{margin:0 0 12px;font-size:.88rem;color:#7c2d12;background:#fef3c7;
  border-radius:10px;padding:9px 11px}
.te-lab{display:block;margin:10px 0 4px;font-weight:700;font-size:.92rem}
.te-in{width:100%;box-sizing:border-box;font:inherit;letter-spacing:.3em;
  border:1px solid #d1d5db;border-radius:11px;padding:.7rem .8rem;min-height:48px;
  background:#fff;color:#111827}
.te-in:focus-visible{outline:3px solid #2563eb;outline-offset:1px}
.te-chk{display:flex;align-items:center;gap:.5rem;margin-top:14px;min-height:44px;
  font-size:.94rem;cursor:pointer}
.te-chk input{width:20px;height:20px}
.te-note{margin:2px 0 0;font-size:.82rem;color:#6b7280}
.te-msg{margin:10px 0 0;font-size:.92rem;font-weight:700;color:#7f1d1d;
  background:#fee2e2;border-radius:10px;padding:9px 11px}
.te-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.te-btn{font:inherit;font-weight:700;border-radius:12px;padding:.75rem 1.2rem;
  cursor:pointer;border:1px solid #d1d5db;background:#fff;color:#111827;min-height:48px}
.te-btn.pri{background:#111827;color:#fff;border-color:#111827;flex:1 1 9rem}
.te-btn.pri[disabled]{opacity:.5;cursor:default}
.te-btn.link{border:0;background:none;text-decoration:underline;padding:.6rem .2rem;
  color:#374151;margin-top:8px;min-height:44px}
.te-btn:focus-visible{outline:3px solid #2563eb;outline-offset:2px}
@media (prefers-color-scheme:dark){
  .te-box{background:#141a24;color:#e8ecf4}
  .te-lead,.te-note{color:#b9c2d4}
  .te-warn{background:#3a2a10;color:#fcd9a5}
  .te-in{background:#1d2531;color:#e8ecf4;border-color:#2c3648}
  .te-msg{background:#4a1717;color:#ffd7d7}
  .te-btn{background:#1d2531;color:#e8ecf4;border-color:#2c3648}
  .te-btn.pri{background:#e8ecf4;color:#141a24;border-color:#e8ecf4}
  .te-btn.link{color:#b9c2d4}
}

/* ---------- רשימת השאלות במסך בניית המבחן ---------- */
.xq-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.xq{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface2)}
.xq-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.xq-n{flex:0 0 auto;min-width:27px;height:27px;border-radius:8px;display:inline-flex;
  align-items:center;justify-content:center;font-weight:800;font-size:.85rem;background:var(--ink);color:var(--bg)}
.xq-tp{font-weight:700;font-size:.88rem;color:var(--muted);overflow-wrap:anywhere}
.xq-acts{margin-inline-start:auto;display:flex;gap:6px;flex-wrap:wrap}
/* 44 פיקסלים גם כאן. כפתור קטן בתוך רשימה ארוכה הוא בדיוק
   הכפתור שנהג מבוגר או ילד עם ADHD לא מצליח לפגוע בו. */
.xq-b{padding:8px 13px;font-size:.88rem;font-weight:700;border-radius:10px;min-height:44px;
  border:1px solid var(--line);background:transparent;color:inherit;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:inherit}
.xq-b:hover{background:var(--line)}
.xq-b[aria-pressed="true"]{background:var(--line)}
.xq-q{margin-top:8px;line-height:1.5;overflow-wrap:anywhere}
.xq-e{margin-top:5px;font-weight:700;overflow-wrap:anywhere}
.xq-a{margin-top:7px;font-size:.92rem;color:var(--ok);overflow-wrap:anywhere}
.xq-add{margin-top:12px;gap:8px}
.xq-add .sub{margin:0}
/* שאלת מקור נושאת קטע שלם. בלי תקרה הוא דוחף את שאר הרשימה
   אל מחוץ למסך. */
.xq .passage{max-height:11rem;overflow:auto}
.hlang{display:flex;gap:4px;flex:none;align-items:center;flex-wrap:wrap}
.hlang button{border:1px solid #d4dbe7;background:transparent;color:inherit;border-radius:10px;padding:3px 9px;font:inherit;font-size:.82rem;cursor:pointer;min-height:36px}
.hlang button.on{border-color:#2f5fd8;color:#fff;background:#2f5fd8;font-weight:700}

/* ---------- יעדי מגע ≥44px — 1.10.2026 ----------
   נמדד בדפדפן ב-390px וב-360px, בדף הפתיחה ובשני צעדי לחיצה ממנו.
   הבלוק אחרון ב-style כדי לגבור על ההגדרות שמעליו. מגדילים בריפוד
   ובגובה מינימלי, לא בגובה קשיח — ערבית ורוסית ארוכות יותר. */
.hlang button{min-height:44px;padding-block:6px}
input[type=range]{min-height:44px}
.spk.sm{min-width:44px;min-height:44px}
.lvl{min-width:44px}
a[href*="education.gov.il"]{display:inline-flex;align-items:center;min-height:44px}

/* ---------- קישור בתוך טקסט — אזור נגיעה ≥44px · 2.10.2026 (O-110) ----------
   שני מקרים, ונמדדו שניהם ב-390px וב-360px:
   - קישור בתוך שורת טקסט רצה: ריפוד אנכי בלבד. ב-inline הוא מגדיל את
     אזור הנגיעה ואינו נכנס לגובה השורה — אף אלמנט לא זז.
   - קישורים זה מתחת לזה (<br>), וקישור בתוך פס ההקראה הקבוע: שם הריפוד
     חרג מהשורה וכיסה את הקישור או הכפתור שלידו, ולכן inline-flex
     בגובה 44 — כמו `.lg-foot a`. השורה גדלה, ואין חפיפה.
   לא `a` כללי: `.lg-foot a` ודומיו כבר 44px בבנייה אחרת. */
#tts-fail a{display:inline-flex;align-items:center;min-height:44px}

/* רמקול לכל תשובה — מי שקורא בקושי בוחר באוזן (אותו תקן של history) */

/* עוזרים לתסריט. כולם מחזירים false כשהאיבר אינו על המסך, כדי
   שצעד שלא מצא את מה שחיפש ידלג ולא יפיל את ההדגמה כולה. */
function demoEl(s){return typeof s==="string"?document.querySelector(s):s}
function demoShow(s){
  var e=demoEl(s); if(!e)return false;
  try{e.scrollIntoView({behavior:"smooth",block:"center"})}catch(err){try{e.scrollIntoView()}catch(err2){}}
  return true;
}
/* מדגיש את האיבר, ורק אז לוחץ — צופה שלא ראה לאן נלחץ לא הבין
   מה קרה. לכן אין צעד קצר מ-1200 אלפיות בתסריטים. */
function demoTap(s){
  var e=demoEl(s); if(!e||e.disabled)return false;
  demoShow(e);
  e.classList.add("demo-tap");
  DEMO.extra.push(setTimeout(function(){
    e.classList.remove("demo-tap");
    /* המסך מצטייר מחדש כל הזמן. אם האיבר שסומן כבר אינו במסמך,
       מחפשים אותו שוב לפי אותו בורר — לחיצה על איבר מת אינה
       עושה דבר, וזה בדיוק צעד שנראה כאילו נתקע. */

  },430));

   ל-input לא היה מגיב להשמה ישירה ל-value. */
function demoType(s,text){
  var e=demoEl(s); if(!e)return false;
  demoShow(e); try{e.focus()}catch(err){}
  e.value=""; var i=0;

    if(!DEMO.on||!e.parentNode){clearInterval(t);return}

   לא יבלע את המקש לפני שההדגמה ראתה אותו. */
function demoKey(e){
  if(!DEMO.on)return;
  if(e.key==="Escape"||e.keyCode===27){
    e.preventDefault(); e.stopPropagation();
    demoStop();
  }

function demoStart(){
  if(DEMO.on)return;
  DEMO.on=true; DEMO.i=0;
  DEMO.btn.hidden=true; DEMO.bar.hidden=false;
  document.documentElement.classList.add("demo-running");

function demoNext(){
  if(!DEMO.on)return;
  if(DEMO.i>=DEMO_SCRIPT.length){demoStop();return}
  var it=DEMO_SCRIPT[DEMO.i++]||{};
  var d=Math.max(600,it.duration||3000);
  DEMO.txt.textContent=it.subtitle||"";
  DEMO.step.textContent=DEMO.i+" / "+DEMO_SCRIPT.length;
  DEMO.fill.style.transition="none"; DEMO.fill.style.width="0";
  void DEMO.fill.offsetWidth;
  DEMO.fill.style.transition="width "+d+"ms linear";
  DEMO.fill.style.width="100%";
  if(typeof it.action==="function"){
    try{it.action()}catch(err){if(window.console)console.warn("demo:",err)}

}

function demoStop(){
  DEMO.on=false;

    poll=setInterval(function(){if(allVoices().length)finish()},120);

       עדיף לדבר בקול ברירת מחדל מאשר לשתוק לנצח. */

   בתוך הלחיצה, בלי מילון, בלי בחירת קול ובלי שום שכבה — ומדווחת
   על המסך מה קרה. יום שלם אבד כי כשלא היה קול, שום דבר לא אמר למה.
   ------------------------------------------------------------ */
var VCHK="";
/* ------------------------------------------------------------
   תוצאת בדיקת הקול, בארבע שפות. הכפתור היה מתורגם והתשובה לא:
   מי שהקול לא עובד לו ואינו קורא עברית קיבל הודעת תקלה בעברית —
   בדיוק המשתמש שהבדיקה נועדה לו. טבלה נפרדת ולא TR_KEYS, כדי לא
   להזיז אינדקסים, ומפני ש-math-teen מתרגם לערבית בלבד.
   ------------------------------------------------------------ */
var VCHKMSG={
  he:{sent:"נשלח…",noSup:"✗ הדפדפן הזה לא תומך בהקראה",mkFail:"✗ יצירת האמירה נכשלה: ",
      okN:["✓ הקול פועל — "," קולות במכשיר"],ok:"✓ הקול פועל",unk:"לא ידוע",
      engine:["✗ המנוע החזיר "," קולות · זו תקלה במכשיר, לא באפליקציה"],
      spFail:"✗ speak נכשל: ",timeout:["✗ שתי שניות ואין תגובה מהמנוע · "," קולות במכשיר"],
      say:"שלום, זו בדיקת קול"},
  ar:{sent:"جارٍ الإرسال…",noSup:"✗ هذا المتصفّح لا يدعم القراءة الصوتية",mkFail:"✗ فشل إنشاء النطق: ",
      okN:["✓ الصوت يعمل — "," صوتًا في الجهاز"],ok:"✓ الصوت يعمل",unk:"غير معروف",
      engine:["✗ أعاد المحرّك "," صوتًا · هذا عطل في الجهاز، لا في التطبيق"],
      spFail:"✗ فشل speak: ",timeout:["✗ ثانيتان بلا ردّ من المحرّك · "," صوتًا في الجهاز"],
      say:"مرحبًا، هذا فحص صوت"},
  ru:{sent:"Отправляем…",noSup:"✗ Этот браузер не поддерживает озвучивание",mkFail:"✗ Не удалось создать реплику: ",
      okN:["✓ Голос работает — голосов: ",""],ok:"✓ Голос работает",unk:"неизвестно",
      engine:["✗ Синтезатор вернул "," голосов · это неполадка устройства, а не приложения"],
      spFail:"✗ speak не сработал: ",timeout:["✗ Две секунды без ответа от синтезатора · "," голосов"],
      say:"Здравствуйте, это проверка голоса"},
  en:{sent:"Sending…",noSup:"✗ This browser does not support read-aloud",mkFail:"✗ Could not create the utterance: ",
      okN:["✓ The voice works — "," voices on this device"],ok:"✓ The voice works",unk:"unknown",
      engine:["✗ The engine returned "," voices · this is a device fault, not an app fault"],
      spFail:"✗ speak failed: ",timeout:["✗ Two seconds and no response from the engine · "," voices on this device"],
      say:"Hello, this is a voice check"}
};
function vchkT(){ var g=state.lang||"he"; return VCHKMSG[g]||VCHKMSG.he }
function voiceCheck(){
  var M=vchkT();
  VCHK=M.sent; render();
  function show(m){ VCHK=m; render() }
  if(!("speechSynthesis" in window)){ show(M.noSup); return }
  var list=[]; try{ list=speechSynthesis.getVoices()||[] }catch(e){}
  try{ speechSynthesis.cancel() }catch(e){}
  var u;
  try{ u=new SpeechSynthesisUtterance(M.say) }
  catch(e){ show(M.mkFail+e.message); return }
  u.lang=(LANGS[state.lang||"he"]||LANGS.he).tts; u.volume=1; u.rate=1; u.pitch=1;
  var done=false;
  u.onstart=function(){ done=true; show(M.okN[0]+list.length+M.okN[1]) };
  u.onerror=function(e){ done=true;
    var er=(e&&e.error)||M.unk;
    if(er==="interrupted"||er==="canceled"){ show(M.ok); return }
    show(M.engine[0]+er+" · "+list.length+M.engine[1]); };
  try{ speechSynthesis.speak(u) }
  catch(e){ show(M.spFail+e.message); return }
  setTimeout(function(){ if(!done)
    show(M.timeout[0]+list.length+M.timeout[1]) },2000);
}

/* ------------------------------------------------------------
   דור ההקראה. speechSynthesis.cancel() אינו מבטל setTimeout:
   כרום יורה onend על האמירה שבוטלה, המקטע הבא נרשם בכל זאת,
   וכעבור SEG_GAP ההקראה הישנה חוזרת מעל החדשה — שני קולות
   במקביל. מונה אחד פותר את זה: כל הקראה מקבלת מספר, stopSpeak
   מקדם אותו, ומקטע מדור ישן פשוט אינו מדבר.
   ------------------------------------------------------------ */
var _sayGen=0;
function speakDevice(text,code,rate){
  if(!("speechSynthesis" in window))return false;
  try{speechSynthesis.cancel()}catch(e){}
  var my=++_sayGen;
  /* האמירה יוצאת מיד, בתוך הלחיצה. קודם היא נעטפה ב-voicesReady,
     שממתין לרשימת הקולות ועד ארבע שניות אם היא לא מגיעה — ואמירה
     שיוצאת ארבע שניות אחרי המגע נזרקת בשקט באנדרואיד ובספארי.
     כשהרשימה כבר כאן, בוחרים קול ומדברים. כשהיא ריקה — מדברים
     בכל זאת, עם u.lang בלבד: קול ברירת מחדל בשפה הנכונה עדיף על
     שתיקה, ויש מכשירים שמחזירים רשימה ריקה לצמיתות ומדברים היטב.
     voicesReady נשאר בשימוש למסך בחירת הקול, שם ההמתנה במקומה. */
  (function(){
    try{
      var v=bestVoice(code), lang=(v&&v.lang)||code;
      var segs=segments(String(text)), rt=tuneRate(lang,clamp(rate,0.55,1.4));
      var pit=femLift(v);
      (function sayseg(k){
        if(my!==_sayGen)return;   /* ההקראה הזאת בוטלה — המקטע הבא לא יוצא */
        if(k>=segs.length){ hlClear(); ttsOK(); return }
        var seg=segs[k];
        var u=new SpeechSynthesisUtterance(seg.text);
        u.lang=lang;
        if(v){ try{ u.voice=v }catch(e2){} }
        u.rate=rt; u.pitch=pit; u.volume=1;
        u.onboundary=function(e){if(!e.name||e.name==="word")hlAt(seg.start+e.charIndex)};
        u.onend=function(){
          if(k+1<segs.length) setTimeout(function(){sayseg(k+1)},SEG_GAP);
          else { hlClear(); ttsOK() }
        };
        u.onerror=function(e){ttsFail(e&&e.error)};
        speechSynthesis.speak(u);
      })(0);
    }catch(e){}
  })();
  return true;
}
/* lang: "en" לחומר הנלמד, או קוד שפת האם להוראה. */
function speak(text,lang,rateMul){
  /* כל טקסט שמגיע להקראה מנוקה מתגיות. חלק מהקריאות כבר מנקות
     לבד, וניקוי חוזר אינו משנה דבר — אבל בלעדיו כל מחרוזת שנשארה
     עם <sub> או <span class="frac"> הוקראה בקול כתגית: הסטודנט
     שמע "span class frac" באמצע השאלה. */
  /* 6.10.2026 — O-145: `<br>` נעלם ב-plainOf בלי להשאיר רווח, ולכן
     "…ניקיון גדול<br>עד איזו שעה" נאמר כמילה אחת מודבקת. תגית `br`
     היא סוף משפט, ולכן היא הופכת לנקודה לפני ההשטחה. נמדד
     ב-hebrew-arab: 450 מופעים בקטעי הקריאה. */
  text=plainOf(String(text||"").replace(/<br\s*\/?>/gi,". ")).trim(); if(!text)return;
  lang=lang||"en";
  var code=lang==="en"?EN_TTS:LANGS[lang].tts;
  var rate=clamp(state.rate*(rateMul||1),0.55,1.4);
  stopSpeak();
  var my=_sayGen;   /* גם תשובת רשת שמגיעה אחרי עצירה לא תושמע */
  /* שכבה 1 - קובץ מוקלט (המנוע של תאוריה מדברת). יש קובץ:
     מנגנים וזהו; אין: קול המכשיר כרגיל. הבעלים, 2.10.2026. */
  if(typeof RECORDED!=="undefined"&&RECORDED.play(text,lang,{rate:state.rate,
      onError:function(){ if(my===_sayGen)speakDevice(text,code,rate) }})){
    return;
  }
  if(gemOn()){
    var vid=gvOf(state.gemVoice).id;
    var ck=lang+"|"+vid+"|"+rate.toFixed(2)+"|"+text;
    if(gCache[ck]){playUrl(gCache[ck],text,code,rate);return}
    gBusy=true; renderSpeakState();
    gSynth(text,vid,rate,lang).then(function(u){
      if(my!==_sayGen)return;
      gCache[ck]=u; gBusy=false; renderSpeakState(); playUrl(u,text,code,rate);
    }).catch(function(){
      gBusy=false; renderSpeakState(); speakDevice(text,code,rate);
    });
    return;
  }
  speakDevice(text,code,rate);
}
function playUrl(url,text,code,rate){
  gStop();
  /* משתמשים באלמנט ששוחרר במגע ולא יוצרים חדש. */
  if(!GEL)GEL=new Audio();
  gAudio=GEL; gAudio.src=url;
  gAudio.play().catch(function(){speakDevice(text,code,rate)});
}
function stopSpeak(){_sayGen++;gStop();if(typeof RECORDED!=="undefined")RECORDED.stop();hlClear();try{if(window.speechSynthesis)speechSynthesis.cancel()}catch(e){}}
/* עוזבים את הדף — הקול נעצר. בלעדיו הוא ממשיך ברקע אחרי מעבר לטאב
   אחר, ולפעמים נתקע עד סגירת הדפדפן. */
try{document.addEventListener("visibilitychange",function(){
  if(document.hidden)stopSpeak();
});}catch(e){}
/* iOS לא ישמיע כלום עד שאמירה אחת יצאה מתוך handler של מגע אמיתי.
   אמירה אוטומטית בטעינת הדף נבלעת בשקט — בלי חריגה, בלי לוג, בלי
   דרך לדעת. משחררים פעם אחת עם אמירה ריקה.
   חשוב: קריאה ישירה, בלי voicesReady — הבטחה שוברת את שרשרת המגע
   ו-Safari כבר לא יזהה את האמירה כיוזמת משתמש. */
try{document.addEventListener("pointerdown",function(){
  try{speechSynthesis.speak(new SpeechSynthesisUtterance(""))}catch(e){}
  /* ואותו דבר לאלמנט השמע: מקור שקט, play בתוך המגע עצמו. */
  try{
    if(!GEL)GEL=new Audio();
    GEL.src=SILENT_WAV;
    var pr=GEL.play();
    if(pr&&pr.then)pr.then(function(){try{GEL.pause();GEL.currentTime=0}catch(e){}},function(){});
  }catch(e){}
},{once:true});}catch(e){}
function renderSpeakState(){
  var b=document.querySelectorAll(".spk");
  for(var i=0;i<b.length;i++)b[i].classList.toggle("on",gBusy);
}

/* ============================================================
   7. תוכן
   ------------------------------------------------------------
   בנק שאלות כתוב, ולא מחולל. באזרחות אין נוסחה שממנה נגזרת
   שאלה: הניסוח המדויק הוא החומר הנלמד, ומסיח שנבנה אוטומטית
   מנוסח אחר היה יוצא או מופרך מדי או נכון בעצמו.

   Q(id, q, opts, ok, hint, ex, fig)
     id   — מזהה יציב לפריט. הוא נכנס לסטטיסטיקה של הלומד, ולכן
            אסור לו להשתנות כשמוסיפים פריט לפניו.
     q    — נוסח השאלה, בארבע שפות.
     opts — ארבע תשובות, כל אחת בארבע שפות. תמיד ארבע: שלוש
            אפשרויות הן ניחוש של אחד משלושה.
     ok   — אינדקס התשובה הנכונה במערך opts (0..3). הסדר על
            המסך מעורבב בכל הצגה, ולכן האינדקס אינו רמז.
     hint — רמז שמכוון לחשיבה ואינו מוסר את התשובה.
     ex   — ההסבר שנפתח אחרי המענה, גם כשענו נכון.
     fig  — מפתח איור מתוך FIGS, או null. אופציונלי בהגדרה:
            רוב השאלות באזרחות הן טקסט בלבד.

   כל שדה קיים בארבע השפות. אזרחות נלמדת בשפת האם — מי שקורא
   בקושי בעברית לא ילמד ממנה מדרג נורמות, ולכן התוכן עצמו
   מתורגם ולא רק הממשק.

   מקור: תוכנית הלימודים של משרד החינוך במדע וטכנולוגיה לכול ומבנה שאלון מוט״ל 704182. הניסוח מקורי של בקול, עם קרדיט וקישור למשרד החינוך.
   השאלות נכתבו לאפליקציה הזאת ואינן העתק של בחינה.
   ============================================================ */
function Q(id,q,opts,ok,hint,ex,fig,wrong){
  return {id:id,q:q,o:opts,ok:ok,hint:hint,ex:ex,fig:fig||null,wrong:wrong||null};
}

/* ------------------------------------------------------------
   איורים. SVG בקוד ולא קובץ תמונה: אין בקשת רשת, הם עובדים
   אופליין מהרגע הראשון, והם מקבלים את צבעי הערכה — כולל הכהה.
   הטקסט שבתוכם עובר דרך gl(), ולכן איור נקרא בשפת הלומד.
   ------------------------------------------------------------ */
function figBox(x,y,w,h,label,sub){
  return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="6" '+
    'fill="var(--surface2)" stroke="currentColor" stroke-width="1.2"/>'+
    '<text x="'+(x+w/2)+'" y="'+(y+(sub?h/2-2:h/2+4))+'" text-anchor="middle" '+
    'font-size="10" font-weight="700" fill="currentColor">'+esc(label)+'</text>'+
    (sub?'<text x="'+(x+w/2)+'" y="'+(y+h/2+11)+'" text-anchor="middle" '+
      'font-size="8" fill="currentColor" opacity=".75">'+esc(sub)+'</text>':"");
}
var FIGS={
  /* שלוש הרשויות, ולמה הן מופרדות */
  branches:function(){
    var L=[{he:"מחוקקת",ar:"التشريعية",ru:"Законодательная",en:"Legislative"},
           {he:"מבצעת", ar:"التنفيذية", ru:"Исполнительная",en:"Executive"},
           {he:"שופטת", ar:"القضائية",  ru:"Судебная",     en:"Judicial"}];
    var S=[{he:"הכנסת",ar:"الكنيست",ru:"Кнессет",en:"The Knesset"},
           {he:"הממשלה",ar:"الحكومة",ru:"Правительство",en:"The government"},
           {he:"בתי המשפט",ar:"المحاكم",ru:"Суды",en:"The courts"}];
    return '<svg viewBox="0 0 300 96" role="img" width="100%" height="96">'+
      figBox(6,20,88,56,gl(L[0]),gl(S[0]))+
      figBox(106,20,88,56,gl(L[1]),gl(S[1]))+
      figBox(206,20,88,56,gl(L[2]),gl(S[2]))+
      '<path d="M94 48h12M194 48h12" stroke="currentColor" stroke-width="1.2"/>'+
      '</svg>';
  },
  /* מדרג הנורמות — מה גובר על מה */
  pyramid:function(){
    var L=[{he:"חוקי יסוד",ar:"قوانين أساس",ru:"Основные законы",en:"Basic Laws"},
           {he:"חוק",ar:"قانون",ru:"Закон",en:"Statute"},
           {he:"תקנה",ar:"لائحة",ru:"Постановление",en:"Regulation"},
           {he:"הנחיה מנהלית",ar:"تعليمات إدارية",ru:"Административная инструкция",en:"Administrative directive"}];
    var h="",i,w;
    for(i=0;i<4;i++){
      w=90+i*54;
      h+=figBox(150-w/2,6+i*24,w,20,gl(L[i]),"");
    }
    return '<svg viewBox="0 0 300 104" role="img" width="100%" height="104">'+h+'</svg>';
  },
  /* אחוז החסימה: קו אחד, וכל מה שמתחתיו אינו נכנס לכנסת */
  threshold:function(){
    var bars=[["A",7.4],["B",5.1],["C",3.9],["D",2.8],["E",1.6]],h="",i,x,ht;
    for(i=0;i<bars.length;i++){
      x=20+i*54; ht=Math.round(bars[i][1]*8);
      h+='<rect x="'+x+'" y="'+(84-ht)+'" width="34" height="'+ht+'" rx="3" fill="'+
        (bars[i][1]>=3.25?"currentColor":"var(--surface2)")+'" stroke="currentColor" stroke-width="1"/>'+
        '<text x="'+(x+17)+'" y="95" text-anchor="middle" font-size="8" fill="currentColor">'+
        bars[i][1]+'%</text>';
    }
    h+='<path d="M8 58h284" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3"/>'+
       '<text x="8" y="54" font-size="8" fill="currentColor">3.25%</text>';
    return '<svg viewBox="0 0 300 100" role="img" width="100%" height="100" dir="ltr">'+h+'</svg>';
  }
};

topic("forces-motion-daily","704182",
  {"he": "כוחות ותנועה בחיי היומיום", "ar": "القوى والحركة في الحياة اليومية", "ru": "Силы и движение в повседневной жизни", "en": "Forces and motion in everyday life"},
  {"he": "מה גורם לגוף להאיץ, להאט או לשנות כיוון", "ar": "ما الذي يجعل الجسم يتسارع أو يتباطأ أو يغيّر اتجاهه", "ru": "Что заставляет тело ускоряться, тормозить или менять направление", "en": "What makes a body speed up, slow down or change direction"},
[ [
  Q("a1-inertia",{"he": "אוטובוס נוסע ובלם פתאום. הנוסעים הוטו קדימה. איזה עיקרון מסביר את זה?", "ar": "حافلة تسير وتوقفت فجأة، فمال الركاب إلى الأمام. أي مبدأ يفسّر ذلك؟", "ru": "Автобус ехал и резко затормозил, и пассажиры наклонились вперёд. Какой принцип это объясняет?", "en": "A moving bus brakes suddenly and the passengers lurch forward. Which principle explains this?"},[{"he": "כוח המנוע דוחף את הנוסעים קדימה גם בזמן בלימה.", "ar": "قوة المحرك تدفع الركاب إلى الأمام حتى أثناء الكبح.", "ru": "Сила мотора толкает пассажиров вперёд даже при торможении.", "en": "The engine's force pushes the passengers forward even during braking."},{"he": "הגוף נוטה להמשיך בתנועתו בגלל ההתמדה (אינרציה).", "ar": "الجسم يميل لمواصلة حركته بسبب القصور الذاتي.", "ru": "Тело стремится продолжать движение из-за инерции.", "en": "A body tends to keep moving because of inertia."},{"he": "כוח הכבידה גדל ברגע הבלימה ומושך את הנוסעים קדימה.", "ar": "قوة الجاذبية تزداد لحظة الكبح وتسحب الركاب إلى الأمام.", "ru": "Сила тяжести возрастает в момент торможения и тянет пассажиров вперёд.", "en": "Gravity increases at the moment of braking and pulls the passengers forward."},{"he": "לחץ האוויר בתא הנוסעים דוחף את האנשים לעבר הנהג.", "ar": "ضغط الهواء داخل الحافلة يدفع الناس نحو السائق.", "ru": "Давление воздуха в салоне толкает людей к водителю.", "en": "Air pressure in the cabin pushes people toward the driver."}],1,{"he": "חשבו מה קורה לגוף שנמצא בתנועה כשהכלי שמתחתיו נעצר.", "ar": "فكّروا ماذا يحدث لجسم متحرك عندما تتوقف المركبة التي تحته.", "ru": "Подумайте, что происходит с движущимся телом, когда транспорт под ним останавливается.", "en": "Think about what happens to a moving body when the vehicle beneath it stops."},{"he": "ההתמדה (אינרציה) היא הנטייה של גוף לשמור על מצב התנועה שלו. האוטובוס מאט, אבל גוף הנוסע ממשיך במהירות שהייתה לו, ולכן הוא נע קדימה ביחס לאוטובוס. למשל חגורת בטיחות עוצרת את הגוף יחד עם הרכב, ובלעדיה הגוף ממשיך לבד.", "ar": "القصور الذاتي هو ميل الجسم للمحافظة على حالة حركته. الحافلة تتباطأ، لكن جسم الراكب يواصل بالسرعة التي كانت له، فيتحرك إلى الأمام بالنسبة للحافلة. مثال: حزام الأمان يوقف الجسم مع المركبة، وبدونه يواصل الجسم وحده.", "ru": "Инерцией называют стремление тела сохранять состояние движения. Автобус замедляется, а тело пассажира продолжает двигаться с прежней скоростью, поэтому оно смещается вперёд относительно автобуса. Например, ремень безопасности останавливает тело вместе с машиной, а без него тело продолжает движение само.", "en": "Inertia is a body's tendency to keep its state of motion. The bus slows down, but the passenger's body keeps its previous speed, so it moves forward relative to the bus. For example, a seat belt stops the body together with the vehicle; without it the body keeps going alone."},null,[{"he": "בזמן בלימה המנוע אינו דוחף קדימה; ההטיה מגיעה מתנועת הגוף עצמו.", "ar": "أثناء الكبح لا يدفع المحرك إلى الأمام؛ الميلان ناتج عن حركة الجسم نفسه.", "ru": "При торможении мотор не толкает вперёд; наклон возникает из-за движения самого тела.", "en": "During braking the engine does not push forward; the lurch comes from the body's own motion."},null,{"he": "כוח הכבידה פועל מטה כל הזמן, ואינו משתנה ברגע הבלימה.", "ar": "الجاذبية تعمل نحو الأسفل طوال الوقت ولا تتغير لحظة الكبح.", "ru": "Сила тяжести действует вниз всегда и не меняется в момент торможения.", "en": "Gravity pulls downward at all times and does not change when the bus brakes."},{"he": "האוויר בתא נע יחד עם האוטובוס, ואינו דוחף אנשים קדימה.", "ar": "الهواء داخل الحافلة يتحرك معها ولا يدفع الناس إلى الأمام.", "ru": "Воздух в салоне движется вместе с автобусом и не толкает людей вперёд.", "en": "The air in the cabin moves with the bus and does not push people forward."}]),
  Q("a1-friction",{"he": "נהג מנסה לעצור ברחוב מכוסה קרח, ומרחק הבלימה מתארך מאוד. מה הסיבה?", "ar": "سائق يحاول التوقف في شارع مغطى بالجليد، فيطول طريق الكبح جدًا. ما السبب؟", "ru": "Водитель тормозит на обледенелой улице, и тормозной путь сильно растёт. В чём причина?", "en": "A driver tries to stop on an icy street and the braking distance grows very long. Why?"},[{"he": "כוח הכבידה על המכונית קטן בגלל הקר.", "ar": "قوة الجاذبية على السيارة تقل بسبب البرد.", "ru": "Сила тяжести на машину уменьшается из-за холода.", "en": "Gravity on the car weakens because of the cold."},{"he": "האוויר הקר מונע מהמנוע לבלום בזמן.", "ar": "الهواء البارد يمنع المحرك من الكبح في الوقت المناسب.", "ru": "Холодный воздух мешает мотору затормозить вовремя.", "en": "The cold air stops the engine from braking in time."},{"he": "החיכוך בין הגלגלים לכביש כמעט מתאפס, ולכן קשה להאט.", "ar": "الاحتكاك بين العجلات والطريق يكاد يختفي، لذلك يصعب التباطؤ.", "ru": "Трение между колёсами и дорогой почти исчезает, поэтому трудно замедлиться.", "en": "Friction between the wheels and the road nearly vanishes, so slowing down is hard."},{"he": "הקרח דוחף את המכונית קדימה ומאריך את הבלימה.", "ar": "الجليد يدفع السيارة إلى الأمام ويطيل الكبح.", "ru": "Лёд толкает машину вперёд и удлиняет торможение.", "en": "The ice pushes the car forward and lengthens braking."}],2,{"he": "מה משתנה במגע שבין הגלגל לכביש?", "ar": "ما الذي يتغير في التلامس بين العجلة والطريق؟", "ru": "Что меняется в контакте колеса с дорогой?", "en": "What changes in the contact between wheel and road?"},{"he": "בלימה מסתמכת על חיכוך בין הגלגלים לכביש. על קרח החיכוך קטן מאוד, הכוח שמאט את המכונית קטן, והיא ממשיכה להחליק. למשל מפזרים חול על כביש מכוסה קרח כדי להגדיל את החיכוך.", "ar": "الكبح يعتمد على الاحتكاك بين العجلات والطريق. على الجليد يكون الاحتكاك صغيرًا جدًا، فتصغر القوة المبطئة وتواصل السيارة الانزلاق. مثال: يُنثر الرمل على الطريق المجلد لزيادة الاحتكاك.", "ru": "Торможение опирается на трение между колёсами и дорогой. На льду трение очень мало, тормозящая сила мала, и машина продолжает скользить. Например, на обледенелую дорогу насыпают песок, чтобы увеличить трение.", "en": "Braking relies on friction between the wheels and the road. On ice friction is very small, the slowing force is small, and the car keeps sliding. For example, sand is spread on icy roads to increase friction."},null,[{"he": "כוח הכבידה לא תלוי בטמפרטורה, והמסה לא משתנה בגלל קר.", "ar": "الجاذبية لا تتعلق بدرجة الحرارة، والكتلة لا تتغير بالبرد.", "ru": "Сила тяжести не зависит от температуры, и масса не меняется от холода.", "en": "Gravity does not depend on temperature, and mass does not change with cold."},{"he": "המנוע אינו הבולם; הבלמים פועלים על הגלגלים בכל מזג אוויר.", "ar": "المحرك ليس هو الكابح؛ الفرامل تعمل على العجلات في كل طقس.", "ru": "Мотор не тормозит колёса; тормоза работают в любую погоду.", "en": "The engine is not the brake; the brakes act on the wheels in any weather."},null,{"he": "קרח אינו מפעיל כוח דוחף; הוא רק מקטין את החיכוך.", "ar": "الجليد لا يطبق قوة دافعة؛ هو فقط يقلل الاحتكاك.", "ru": "Лёд не создаёт толкающую силу; он только уменьшает трение.", "en": "Ice applies no pushing force; it only reduces friction."}]),
  Q("a1-newton3",{"he": "ילדה דוחפת קיר בידיים ומרגישה שהקיר דוחף אותה בחזרה. מה אומר החוק השלישי של ניוטון?", "ar": "فتاة تدفع جدارًا بيديها وتشعر أن الجدار يدفعها للخلف. ماذا يقول قانون نيوتن الثالث؟", "ru": "Девочка толкает стену руками и чувствует, что стена толкает её обратно. Что говорит третий закон Ньютона?", "en": "A girl pushes a wall with her hands and feels the wall push back. What does Newton's third law say?"},[{"he": "הקיר מפעיל על הידיים כוח שווה בגודלו והפוך בכיוונו.", "ar": "الجدار يطبق على اليدين قوة مساوية في المقدار ومعاكسة في الاتجاه.", "ru": "Стена действует на руки с силой, равной по величине и противоположной по направлению.", "en": "The wall pushes the hands with a force equal in size and opposite in direction."},{"he": "הקיר לא מפעיל שום כוח, כי הוא לא זז.", "ar": "الجدار لا يطبق أي قوة لأنه لا يتحرك.", "ru": "Стена не действует силой, потому что не движется.", "en": "The wall applies no force because it does not move."},{"he": "הכוח של הילדה גדול מהכוח של הקיר, ולכן מרגישים לחץ.", "ar": "قوة الفتاة أكبر من قوة الجدار، لذلك يُشعر بالضغط.", "ru": "Сила девочки больше силы стены, поэтому чувствуется давление.", "en": "The girl's force is greater than the wall's, so pressure is felt."},{"he": "כוחות פועלים רק כששני הגופים נעים.", "ar": "القوى تعمل فقط عندما يتحرك الجسمان.", "ru": "Силы действуют, только когда оба тела движутся.", "en": "Forces act only when both bodies are moving."}],0,{"he": "שימו לב לזוג הכוחות: מי מפעיל כוח על מי.", "ar": "لاحظوا زوج القوى: مَن يؤثر بقوة على مَن.", "ru": "Обратите внимание на пару сил: кто на кого действует.", "en": "Notice the pair of forces: who acts on whom."},{"he": "החוק השלישי: כשגוף אחד מפעיל כוח על גוף שני, הגוף השני מפעיל על הראשון כוח שווה והפוך. הכוחות פועלים על גופים שונים, ולכן אינם מבטלים זה את זה. למשל רקדנית על הקרח שדוחפת את המעקה נעה אחורה.", "ar": "القانون الثالث: عندما يؤثر جسم بقوة على جسم آخر، يؤثر الأخير على الأول بقوة مساوية ومعاكسة. القوتان تؤثران على جسمين مختلفين، لذلك لا تلغي إحداهما الأخرى. مثال: متزلجة على الجليد تدفع الحاجز فتتحرك للخلف.", "ru": "Третий закон: когда одно тело действует силой на другое, второе действует на первое с равной и противоположной силой. Силы приложены к разным телам, поэтому не уничтожают друг друга. Например, фигуристка, оттолкнувшая бортик, поедет назад.", "en": "The third law: when one body pushes another, the second pushes back on the first with an equal and opposite force. The forces act on different bodies, so they do not cancel each other. For example, an ice skater who pushes the railing slides backward."},null,[null,{"he": "גוף יכול להפעיל כוח גם בלי לזוז; הקיר לוחץ בחזרה על הידיים.", "ar": "الجسم قد يطبق قوة دون أن يتحرك؛ الجدار يضغط على اليدين بالمقابل.", "ru": "Тело может действовать силой, не двигаясь; стена давит на руки в ответ.", "en": "A body can apply force without moving; the wall presses back on the hands."},{"he": "לפי החוק השלישי הכוחות שווים תמיד בגודלם; ההבדל הוא בתחושה, לא בגודל.", "ar": "بحسب القانون الثالث القوتان متساويتان دائمًا؛ الفرق في الإحساس لا في المقدار.", "ru": "По третьему закону силы всегда равны; различие в ощущении, а не в величине.", "en": "By the third law the forces are always equal; the difference is in the feeling, not the size."},{"he": "כוחות פועלים גם במנוחה; ספר על שולחן לוחץ עליו והשולחן לוחץ בחזרה.", "ar": "القوى تعمل أيضًا في السكون؛ كتاب على طاولة يضغط عليها وهي تضغط بالمقابل.", "ru": "Силы действуют и в покое: книга на столе давит на него, а стол на книгу.", "en": "Forces also act at rest: a book on a table presses it, and the table presses back."}]),
  Q("fm-1-01",{"he": "אסטרונאוטית שמסתה 60 ק״ג נוחתת על הירח. מה קורה למסה ולמשקל שלה שם?", "ar": "رائدة فضاء كتلتها 60 كغ تهبط على القمر. ماذا يحدث لكتلتها ولوزنها هناك؟", "ru": "Космонавтка массой 60 кг высаживается на Луну. Что происходит там с её массой и весом?", "en": "An astronaut with a mass of 60 kg lands on the Moon. What happens to her mass and weight there?"},[{"he": "המסה נשארת 60 ק״ג, והמשקל קטן.", "ar": "الكتلة تبقى 60 كغ، والوزن يقلّ.", "ru": "Масса остаётся 60 кг, а вес уменьшается.", "en": "Her mass stays 60 kg, and her weight gets smaller."}, {"he": "המסה והמשקל קטנים שניהם באותה מידה.", "ar": "الكتلة والوزن يقلّان معًا بالقدر نفسه.", "ru": "Масса и вес уменьшаются одинаково.", "en": "Mass and weight both shrink by the same amount."}, {"he": "המשקל נשאר זהה, והמסה קטנה.", "ar": "الوزن يبقى كما هو، والكتلة تقلّ.", "ru": "Вес остаётся прежним, а масса уменьшается.", "en": "Her weight stays the same, and her mass gets smaller."}, {"he": "שניהם מתאפסים, כי בירח אין כבידה.", "ar": "كلاهما يصبح صفرًا لأنه لا جاذبية على القمر.", "ru": "Оба становятся нулём, ведь на Луне нет тяготения.", "en": "Both drop to zero, because the Moon has no gravity."}],0,{"he": "איזה גודל תלוי במקום, ואיזה תלוי רק בכמות החומר?", "ar": "أيّ مقدار يتعلّق بالمكان، وأيّه يتعلّق بكمية المادة فقط؟", "ru": "Какая величина зависит от места, а какая — только от количества вещества?", "en": "Which quantity depends on the place, and which only on the amount of matter?"},{"he": "מסה היא כמות החומר בגוף, והיא לא משתנה ממקום למקום. משקל הוא כוח המשיכה, ובירח הכבידה חלשה פי 6 בערך. למשל אסטרונאוטים על הירח קופצים גבוה, אף שהגוף שלהם לא השתנה.", "ar": "الكتلة هي كمية المادة في الجسم، ولا تتغيّر من مكان لآخر. الوزن هو قوة الجذب، وجاذبية القمر أضعف بنحو 6 مرات. مثلًا يقفز روّاد الفضاء عاليًا على القمر مع أن أجسامهم لم تتغيّر.", "ru": "Масса — это количество вещества в теле, она не меняется от места к месту. Вес — это сила притяжения, а на Луне тяготение примерно в 6 раз слабее. Например, космонавты на Луне прыгают высоко, хотя их тело не изменилось.", "en": "Mass is the amount of matter in a body and does not change from place to place. Weight is the pull of gravity, and on the Moon gravity is about 6 times weaker. For example, astronauts on the Moon jump high, although their bodies have not changed."},null,[null, {"he": "המסה היא כמות החומר בגוף, והיא לא קטנה כשעוברים לירח.", "ar": "الكتلة هي كمية المادة، ولا تقلّ عند الانتقال إلى القمر.", "ru": "Масса — это количество вещества, и она не уменьшается на Луне.", "en": "Mass is the amount of matter, and it does not shrink on the Moon."}, {"he": "זה הפוך: המשקל תלוי בכבידה ומשתנה, והמסה נשארת קבועה.", "ar": "العكس صحيح: الوزن يتعلّق بالجاذبية ويتغيّر، والكتلة ثابتة.", "ru": "Наоборот: вес зависит от тяготения и меняется, а масса постоянна.", "en": "It is the reverse: weight depends on gravity and changes, while mass stays fixed."}, {"he": "לירח יש כבידה חלשה, ולכן יש שם משקל, רק קטן יותר.", "ar": "للقمر جاذبية ضعيفة، لذلك يوجد وزن هناك لكنه أصغر.", "ru": "У Луны есть слабое тяготение, поэтому вес там есть, только меньше.", "en": "The Moon has weak gravity, so there is weight there, just less of it."}]),
  Q("fm-1-02",{"he": "בתאונה הכרית האווירית מתנפחת מול הנהג. איך היא מקטינה את הפגיעה בו?", "ar": "في حادث تنتفخ الوسادة الهوائية أمام السائق. كيف تقلّل إصابته؟", "ru": "При аварии перед водителем надувается подушка безопасности. Как она уменьшает травму?", "en": "In a crash the airbag inflates in front of the driver. How does it reduce the injury?"},[{"he": "היא מבטלת את ההתמדה של הנהג ושל הגוף שלו.", "ar": "تُلغي القصور الذاتي للسائق ولجسمه.", "ru": "Она отменяет инерцию водителя и его тела.", "en": "It cancels the inertia of the driver and his body."}, {"he": "היא מאריכה את זמן העצירה, ולכן הכוח קטן.", "ar": "تطيل زمن التوقّف، فتصغر القوة.", "ru": "Она удлиняет время остановки, поэтому сила меньше.", "en": "It lengthens the stopping time, so the force is smaller."}, {"he": "היא דוחפת את הנהג אחורה מהר יותר מהמכונית.", "ar": "تدفع السائق إلى الخلف أسرع من السيارة.", "ru": "Она отталкивает водителя назад быстрее машины.", "en": "It pushes the driver backward faster than the car."}, {"he": "היא מגדילה את המסה של הנהג, ולכן הוא יציב.", "ar": "تزيد كتلة السائق فيصبح ثابتًا.", "ru": "Она увеличивает массу водителя, и он устойчивее.", "en": "It adds to the driver's mass, so he is steadier."}],1,{"he": "השוו בין עצירה על הגה קשה לעצירה על משהו רך.", "ar": "قارنوا بين التوقّف على مقود صلب والتوقّف على شيء ليّن.", "ru": "Сравните остановку о твёрдый руль и о что-то мягкое.", "en": "Compare stopping against a hard wheel with stopping against something soft."},{"he": "הנהג צריך לעצור בכל מקרה. כשהעצירה נמשכת זמן ארוך יותר, הכוח על הגוף קטן יותר, והכרית גם פורסת את הלחץ על שטח גדול. למשל כשתופסים ביצה מזיזים את היד לאחור, והביצה לא נשברת.", "ar": "على السائق أن يتوقّف في كل الأحوال. عندما يستمرّ التوقّف وقتًا أطول تصغر القوة على الجسم، والوسادة توزّع الضغط على مساحة كبيرة أيضًا. مثلًا عند التقاط بيضة نُرجع اليد إلى الخلف فلا تنكسر.", "ru": "Водитель в любом случае должен остановиться. Чем дольше длится остановка, тем меньше сила на тело, а подушка ещё и распределяет давление на большую площадь. Например, ловя яйцо, отводят руку назад, и оно не разбивается.", "en": "The driver has to stop either way. When stopping takes longer, the force on the body is smaller, and the airbag also spreads the pressure over a large area. For example, when you catch an egg you move your hand back, and the egg does not break."},null,[{"he": "ההתמדה היא תכונה של כל גוף, והכרית לא יכולה לבטל אותה.", "ar": "القصور الذاتي صفة لكل جسم، ولا تستطيع الوسادة إلغاءه.", "ru": "Инерция — свойство любого тела, и подушка не может её отменить.", "en": "Inertia is a property of every body, and the airbag cannot cancel it."}, null, {"he": "הכרית לא זורקת את הנהג אחורה, אלא בולמת אותו לאט יותר.", "ar": "الوسادة لا تقذف السائق إلى الخلف، بل توقفه ببطء أكبر.", "ru": "Подушка не отбрасывает водителя назад, а тормозит его медленнее.", "en": "The airbag does not throw the driver back; it slows him down more gently."}, {"he": "הכרית לא משנה את המסה של הנהג, והיא רק מאריכה את הבלימה.", "ar": "الوسادة لا تغيّر كتلة السائق، بل تطيل زمن الكبح فقط.", "ru": "Подушка не меняет массу водителя, она лишь удлиняет торможение.", "en": "The airbag does not change the driver's mass; it only lengthens the braking."}]),
  Q("fm-1-03",{"he": "סכין חדה חותכת עגבנייה בקלות, וסכין קהה מועכת אותה. מה ההסבר?", "ar": "سكين حادّة تقطع الطماطم بسهولة، وسكين غير حادّة تهرسها. ما التفسير؟", "ru": "Острый нож легко режет помидор, а тупой его давит. Как это объяснить?", "en": "A sharp knife cuts a tomato easily, while a blunt knife squashes it. What is the explanation?"},[{"he": "לסכין החדה יש מסה גדולה יותר, ולכן היא כבדה.", "ar": "السكين الحادّة كتلتها أكبر، لذلك هي أثقل.", "ru": "У острого ножа больше масса, поэтому он тяжелее.", "en": "The sharp knife has more mass, so it is heavier."}, {"he": "הסכין החדה מקטינה את החיכוך עם הקליפה.", "ar": "السكين الحادّة تقلّل الاحتكاك مع القشرة.", "ru": "Острый нож уменьшает трение с кожицей.", "en": "The sharp knife reduces friction with the skin."}, {"he": "אותו כוח פועל על שטח קטן, ולכן הלחץ גדול.", "ar": "القوة نفسها تؤثّر في مساحة صغيرة، فيكبر الضغط.", "ru": "Та же сила действует на малую площадь, и давление больше.", "en": "The same force acts on a small area, so the pressure is high."}, {"he": "הסכין הקהה מפעילה כוח גדול מדי על העגבנייה.", "ar": "السكين غير الحادّة تؤثّر بقوة كبيرة جدًا في الطماطم.", "ru": "Тупой нож действует на помидор слишком большой силой.", "en": "The blunt knife applies too much force to the tomato."}],2,{"he": "חשבו על השטח שבו הלהב נוגע בעגבנייה.", "ar": "فكّروا في المساحة التي يلمس فيها النصل الطماطم.", "ru": "Подумайте о площади, которой лезвие касается помидора.", "en": "Think about the area where the blade touches the tomato."},{"he": "לחץ הוא כוח שמתחלק על שטח. להב חד נוגע בשטח קטן מאוד, ולכן אותו כוח יוצר לחץ גדול שחודר את הקליפה. למשל מחט נכנסת לבד בקלות, ואצבע שלוחצת באותו כוח לא נכנסת.", "ar": "الضغط قوة موزّعة على مساحة. النصل الحادّ يلمس مساحة صغيرة جدًا، فتُنتج القوة نفسها ضغطًا كبيرًا يخترق القشرة. مثلًا تدخل الإبرة في القماش بسهولة، ولا يدخل الإصبع الذي يضغط بالقوة نفسها.", "ru": "Давление — это сила, распределённая по площади. Острое лезвие касается очень малой площади, поэтому та же сила создаёт большое давление и прорезает кожицу. Например, игла легко входит в ткань, а палец с той же силой — нет.", "en": "Pressure is force spread over an area. A sharp blade touches a very small area, so the same force creates a high pressure that cuts the skin. For example, a needle easily goes into cloth, but a finger pressing with the same force does not."},null,[{"he": "מסת הסכין לא קובעת את החיתוך, ושתי הסכינים יכולות לשקול אותו דבר.", "ar": "كتلة السكين لا تحدّد القطع، وقد تزن السكينان الشيء نفسه.", "ru": "Масса ножа не определяет резку, оба ножа могут весить одинаково.", "en": "The knife's mass does not decide the cut, and both knives can weigh the same."}, {"he": "חיתוך תלוי בלחץ על הקליפה, ולא בהקטנת החיכוך.", "ar": "القطع يتعلّق بالضغط على القشرة، لا بتقليل الاحتكاك.", "ru": "Резка зависит от давления на кожицу, а не от уменьшения трения.", "en": "Cutting depends on the pressure on the skin, not on less friction."}, null, {"he": "גם בכוח גדול להב רחב מפזר את הכוח, ולכן הוא מועך במקום לחתוך.", "ar": "حتى بقوة كبيرة يوزّع النصل العريض القوة، فيهرس بدل أن يقطع.", "ru": "Даже с большой силой широкое лезвие распределяет её и давит, а не режет.", "en": "Even with a big force a wide blade spreads it out, so it squashes instead of cutting."}]),
  Q("fm-1-04",{"he": "משפחה העמיסה מזוודות כבדות על גג המכונית. למה המכונית נוטה יותר להתהפך בסיבוב חד?", "ar": "حمّلت عائلة حقائب ثقيلة على سقف السيارة. لماذا تصبح السيارة أكثر عرضة للانقلاب في منعطف حادّ؟", "ru": "Семья погрузила тяжёлые чемоданы на крышу машины. Почему машина легче переворачивается на крутом повороте?", "en": "A family loaded heavy suitcases on the car roof. Why is the car more likely to tip over on a sharp turn?"},[{"he": "המזוודות מגדילות את החיכוך עם הכביש.", "ar": "الحقائب تزيد الاحتكاك مع الطريق.", "ru": "Чемоданы увеличивают трение с дорогой.", "en": "The suitcases increase friction with the road."}, {"he": "הרוח דוחפת את המזוודות ומסובבת את הרכב.", "ar": "الريح تدفع الحقائب وتُدير السيارة.", "ru": "Ветер толкает чемоданы и разворачивает машину.", "en": "The wind pushes the suitcases and turns the car."}, {"he": "כוח הכבידה על המזוודות פועל כלפי מעלה.", "ar": "قوة الجاذبية على الحقائب تؤثّر إلى أعلى.", "ru": "Сила тяжести на чемоданы направлена вверх.", "en": "Gravity on the suitcases acts upward."}, {"he": "מרכז הכובד של הרכב עלה, והרכב פחות יציב.", "ar": "مركز ثقل السيارة ارتفع، فأصبحت أقلّ ثباتًا.", "ru": "Центр тяжести машины поднялся, и она менее устойчива.", "en": "The car's center of mass rose, so it is less stable."}],3,{"he": "מה קורה ליציבות של גוף כשרוב המשקל שלו נמצא למעלה?", "ar": "ماذا يحدث لثبات الجسم عندما يكون معظم وزنه في الأعلى؟", "ru": "Что происходит с устойчивостью тела, когда большая часть веса наверху?", "en": "What happens to a body's stability when most of its weight is high up?"},{"he": "גוף יציב יותר כשמרכז הכובד שלו נמוך. מטען על הגג מרים את מרכז הכובד, ובסיבוב קל יותר להטות את הרכב. למשל במשאית מעמיסים את המטען הכבד בתחתית.", "ar": "يكون الجسم أكثر ثباتًا عندما يكون مركز ثقله منخفضًا. الحمولة على السقف ترفع مركز الثقل، فيسهل أن تميل السيارة في المنعطف. مثلًا تُحمَّل البضائع الثقيلة في أسفل الشاحنة.", "ru": "Тело устойчивее, когда его центр тяжести низко. Груз на крыше поднимает центр тяжести, и на повороте машину легче опрокинуть. Например, тяжёлый груз в грузовике кладут внизу.", "en": "A body is more stable when its center of mass is low. A load on the roof raises the center of mass, so on a turn the car tips more easily. For example, heavy cargo in a truck is placed at the bottom."},null,[{"he": "חיכוך גדול עם הכביש דווקא מונע החלקה, ולא גורם להתהפכות.", "ar": "الاحتكاك الكبير مع الطريق يمنع الانزلاق ولا يسبّب الانقلاب.", "ru": "Большое трение с дорогой мешает скольжению, а не вызывает опрокидывание.", "en": "Large friction with the road prevents sliding; it does not cause tipping over."}, {"he": "הסכנה קיימת גם בלי רוח, כי היא נובעת מגובה המטען.", "ar": "الخطر قائم حتى دون ريح، لأنه ناتج عن ارتفاع الحمولة.", "ru": "Опасность есть и без ветра, ведь она связана с высотой груза.", "en": "The danger exists even without wind, because it comes from the height of the load."}, {"he": "כוח הכבידה פועל תמיד כלפי מטה, גם על מטען שנמצא על הגג.", "ar": "قوة الجاذبية تؤثّر دائمًا إلى أسفل، حتى على الحمولة فوق السقف.", "ru": "Сила тяжести всегда направлена вниз, даже на груз на крыше.", "en": "Gravity always acts downward, even on a load on the roof."}, null]),
  Q("fm-1-05",{"he": "ספינה עשויה פלדה שוקלת אלפי טונות, ובכל זאת היא צפה. מה מאפשר לה לצוף?", "ar": "سفينة مصنوعة من الفولاذ تزن آلاف الأطنان، ومع ذلك تطفو. ما الذي يسمح لها بالطفو؟", "ru": "Стальной корабль весит тысячи тонн, но всё равно плавает. Что позволяет ему держаться на воде?", "en": "A steel ship weighs thousands of tons, yet it floats. What allows it to float?"},[{"he": "הגוף החלול דוחק הרבה מים, והמים דוחפים אותו מעלה.", "ar": "هيكلها المجوّف يزيح ماءً كثيرًا، والماء يدفعها إلى أعلى.", "ru": "Полый корпус вытесняет много воды, и вода выталкивает его.", "en": "Its hollow hull pushes aside a lot of water, which pushes it up."}, {"he": "פלדה קלה יותר ממים, ולכן כל חפץ מפלדה צף על המים.", "ar": "الفولاذ أخفّ من الماء، لذلك يطفو كل شيء من الفولاذ.", "ru": "Сталь легче воды, поэтому любой стальной предмет плавает.", "en": "Steel is lighter than water, so every steel object floats."}, {"he": "המנוע של הספינה דוחף אותה כלפי מעלה כל הזמן.", "ar": "محرّك السفينة يدفعها إلى أعلى طوال الوقت.", "ru": "Двигатель корабля всё время толкает его вверх.", "en": "The ship's engine pushes it upward all the time."}, {"he": "מי הים מלוחים, ובמים מתוקים היא הייתה שוקעת.", "ar": "مياه البحر مالحة، وفي الماء العذب كانت ستغرق.", "ru": "Морская вода солёная, а в пресной корабль утонул бы.", "en": "Sea water is salty, and in fresh water it would sink."}],0,{"he": "השוו בין גוש פלדה מלא לבין קערת פלדה באותה מסה.", "ar": "قارنوا بين كتلة فولاذ مصمتة ووعاء فولاذ بالكتلة نفسها.", "ru": "Сравните сплошной кусок стали и стальную миску той же массы.", "en": "Compare a solid lump of steel with a steel bowl of the same mass."},{"he": "מים דוחפים מעלה כל גוף שנכנס לתוכם, וככל שהוא דוחק יותר מים הדחיפה גדולה יותר. ספינה חלולה ורחבה דוחקת מים ששוקלים כמוה, ולכן היא צפה. למשל כדור פלסטלינה שוקע, אבל סירה מאותה פלסטלינה צפה.", "ar": "الماء يدفع إلى أعلى كل جسم يدخل فيه، وكلما أزاح الجسم ماءً أكثر كبر الدفع. السفينة المجوّفة العريضة تزيح ماءً يزن مثلها، لذلك تطفو. مثلًا كرة المعجون تغرق، لكن قاربًا من المعجون نفسه يطفو.", "ru": "Вода выталкивает вверх любое тело в ней, и чем больше воды тело вытесняет, тем сильнее выталкивание. Полый широкий корабль вытесняет воду, которая весит столько же, сколько он, поэтому он плавает. Например, шарик пластилина тонет, а лодочка из того же пластилина плавает.", "en": "Water pushes up on any body placed in it, and the more water the body pushes aside, the stronger the push. A wide hollow ship pushes aside water that weighs as much as the ship, so it floats. For example, a ball of modeling clay sinks, but a boat made of the same clay floats."},null,[null, {"he": "פלדה כבדה יותר ממים, ומסמר פלדה שוקע מיד.", "ar": "الفولاذ أثقل من الماء، ومسمار الفولاذ يغرق فورًا.", "ru": "Сталь тяжелее воды, и стальной гвоздь сразу тонет.", "en": "Steel is denser than water, and a steel nail sinks at once."}, {"he": "המנוע דוחף קדימה, וספינה צפה גם כשהמנוע כבוי.", "ar": "المحرّك يدفع إلى الأمام، والسفينة تطفو حتى والمحرّك مطفأ.", "ru": "Двигатель толкает вперёд, а корабль плавает и с выключенным мотором.", "en": "The engine pushes forward, and a ship floats even with the engine off."}, {"he": "מלח עוזר מעט, אבל ספינות צפות גם בנהרות ובאגמים של מים מתוקים.", "ar": "الملح يساعد قليلًا، لكن السفن تطفو في الأنهار والبحيرات العذبة أيضًا.", "ru": "Соль немного помогает, но корабли плавают и в пресных реках и озёрах.", "en": "Salt helps a little, but ships also float in freshwater rivers and lakes."}]),
  Q("fm-1-06",{"he": "צנחן קופץ ממטוס ופותח מצנח. למה המהירות שלו קטנה מאוד אחרי הפתיחה?", "ar": "مظلّي يقفز من طائرة ويفتح المظلّة. لماذا تقلّ سرعته كثيرًا بعد فتحها؟", "ru": "Парашютист прыгает из самолёта и раскрывает парашют. Почему после этого его скорость сильно падает?", "en": "A skydiver jumps from a plane and opens the parachute. Why does his speed drop a lot after it opens?"},[{"he": "המצנח מבטל את כוח הכבידה על הצנחן.", "ar": "المظلّة تُلغي قوة الجاذبية على المظلّي.", "ru": "Парашют отменяет силу тяжести на парашютиста.", "en": "The parachute cancels gravity on the skydiver."}, {"he": "שטח המצנח גדול, ולכן התנגדות האוויר גדלה מאוד.", "ar": "مساحة المظلّة كبيرة، فتزداد مقاومة الهواء كثيرًا.", "ru": "Площадь купола большая, и сопротивление воздуха сильно растёт.", "en": "The canopy is large, so air resistance grows a lot."}, {"he": "המצנח מקטין את המסה של הצנחן ושל הציוד שלו.", "ar": "المظلّة تُنقص كتلة المظلّي ومعدّاته.", "ru": "Парашют уменьшает массу парашютиста и его снаряжения.", "en": "The parachute reduces the mass of the skydiver and his gear."}, {"he": "האוויר למעלה דליל, ולכן הצנחן נופל לאט יותר.", "ar": "الهواء في الأعلى خفيف، لذلك يسقط المظلّي ببطء.", "ru": "Наверху воздух разрежен, поэтому парашютист падает медленнее.", "en": "The air high up is thin, so the skydiver falls more slowly."}],1,{"he": "מה מתנגד לתנועה של גוף שנופל דרך האוויר?", "ar": "ما الذي يقاوم حركة جسم يسقط عبر الهواء؟", "ru": "Что мешает движению тела, падающего в воздухе?", "en": "What resists the motion of a body falling through air?"},{"he": "גוף שנופל באוויר מתנגש בחלקיקי האוויר, והם מאטים אותו. ככל שהשטח גדול יותר ההתנגדות גדולה יותר, עד שהיא משתווה לכבידה והמהירות נשארת קבועה ונמוכה. למשל דף פרוש נופל לאט, ואותו דף מקומט נופל מהר.", "ar": "الجسم الساقط في الهواء يصطدم بجزيئات الهواء فتبطئه. كلما كبرت المساحة كبرت المقاومة، حتى تتساوى مع الجاذبية فتبقى السرعة ثابتة ومنخفضة. مثلًا الورقة المفرودة تسقط ببطء، والورقة نفسها مكوّرة تسقط بسرعة.", "ru": "Падающее тело сталкивается с частицами воздуха, и они его тормозят. Чем больше площадь, тем больше сопротивление, пока оно не сравняется с силой тяжести и скорость не станет постоянной и низкой. Например, расправленный лист падает медленно, а тот же лист, смятый в комок, — быстро.", "en": "A body falling through air collides with air particles, and they slow it down. The larger the area, the larger the resistance, until it equals gravity and the speed stays constant and low. For example, a flat sheet of paper falls slowly, while the same sheet crumpled falls fast."},null,[{"he": "הכבידה ממשיכה לפעול, והצנחן ממשיך לרדת עד הקרקע.", "ar": "الجاذبية تستمرّ في التأثير، ويواصل المظلّي النزول حتى الأرض.", "ru": "Тяготение продолжает действовать, и парашютист опускается до земли.", "en": "Gravity keeps acting, and the skydiver keeps descending to the ground."}, null, {"he": "המסה של הצנחן והציוד לא משתנה כשהמצנח נפתח.", "ar": "كتلة المظلّي ومعدّاته لا تتغيّر عند فتح المظلّة.", "ru": "Масса парашютиста и снаряжения не меняется при раскрытии парашюта.", "en": "The mass of the skydiver and gear does not change when the parachute opens."}, {"he": "האוויר נעשה דווקא צפוף יותר בירידה, וההאטה נובעת משטח המצנח.", "ar": "الهواء يصبح أكثف عند النزول، والتباطؤ ناتج عن مساحة المظلّة.", "ru": "При спуске воздух становится плотнее, а торможение вызвано площадью купола.", "en": "The air actually gets denser on the way down; the slowing comes from the canopy's area."}]),
  Q("fm-1-07",{"he": "מכונאי לא מצליח לשחרר בורג תקוע. הוא מחליף למפתח ברגים ארוך יותר, וזה עובד. למה?", "ar": "ميكانيكي لا ينجح في فكّ برغي عالق. يستبدل مفتاحًا أطول، فينجح. لماذا؟", "ru": "Механик не может открутить застрявший болт. Он берёт ключ подлиннее, и это помогает. Почему?", "en": "A mechanic cannot loosen a stuck bolt. He switches to a longer wrench, and it works. Why?"},[{"he": "מפתח ארוך כבד יותר, והמשקל הנוסף שלו מסובב את הבורג.", "ar": "المفتاح الطويل أثقل، ووزنه الإضافي يُدير البرغي.", "ru": "Длинный ключ тяжелее, и его лишний вес поворачивает болт.", "en": "A long wrench is heavier, and its extra weight turns the bolt."}, {"he": "מפתח ארוך מקטין את החיכוך בין הבורג לבין האום.", "ar": "المفتاح الطويل يقلّل الاحتكاك بين البرغي والصامولة.", "ru": "Длинный ключ уменьшает трение между болтом и гайкой.", "en": "A long wrench reduces friction between the bolt and the nut."}, {"he": "היד רחוקה יותר מהבורג, ולכן אותו כוח מסובב חזק יותר.", "ar": "اليد أبعد عن البرغي، فتُدير القوة نفسها بشدة أكبر.", "ru": "Рука дальше от болта, и та же сила поворачивает сильнее.", "en": "The hand is farther from the bolt, so the same force turns it harder."}, {"he": "מפתח ארוך יוצר אנרגיה נוספת, בלי מאמץ של הידיים.", "ar": "المفتاح الطويل يُنتج طاقة إضافية دون جهد اليدين.", "ru": "Длинный ключ создаёт лишнюю энергию без усилия рук.", "en": "A long wrench creates extra energy with no effort from the hands."}],2,{"he": "חשבו על נדנדה: איפה כדאי לשבת כדי להרים ילד כבד?", "ar": "فكّروا في الأرجوحة المتوازنة: أين يجب الجلوس لرفع طفل ثقيل؟", "ru": "Вспомните качели-балансир: где сесть, чтобы поднять тяжёлого ребёнка?", "en": "Think of a seesaw: where should you sit to lift a heavy child?"},{"he": "מפתח ברגים הוא מנוף. ככל שהכוח מופעל רחוק יותר מציר הסיבוב, השפעת הסיבוב שלו גדולה יותר. למשל קל יותר לפתוח דלת כשדוחפים ליד הידית ולא ליד הצירים.", "ar": "مفتاح البراغي رافعة. كلما أُثّرت القوة أبعد عن محور الدوران كان أثرها في التدوير أكبر. مثلًا يسهل فتح الباب عند دفعه قرب المقبض لا قرب المفصّلات.", "ru": "Гаечный ключ — это рычаг. Чем дальше от оси вращения приложена сила, тем сильнее её поворачивающее действие. Например, дверь легче открыть, толкая её у ручки, а не у петель.", "en": "A wrench is a lever. The farther from the turning axis a force is applied, the greater its turning effect. For example, a door is easier to open when you push near the handle than near the hinges."},null,[{"he": "משקל המפתח קטן מאוד, ומה שעוזר הוא המרחק של היד מהבורג.", "ar": "وزن المفتاح صغير جدًا، وما يساعد هو بُعد اليد عن البرغي.", "ru": "Вес ключа очень мал, а помогает расстояние от руки до болта.", "en": "The wrench's weight is tiny; what helps is the hand's distance from the bolt."}, {"he": "אורך המפתח לא משנה את החיכוך בבורג, אלא את השפעת הכוח.", "ar": "طول المفتاح لا يغيّر الاحتكاك في البرغي، بل أثر القوة.", "ru": "Длина ключа не меняет трение в болте, а меняет действие силы.", "en": "The wrench's length does not change friction in the bolt, only the effect of the force."}, null, {"he": "כלי לא יוצר אנרגיה, והידיים עדיין עושות את העבודה.", "ar": "الأداة لا تُنتج طاقة، واليدان ما زالتا تبذلان الشغل.", "ru": "Инструмент не создаёт энергию, работу всё равно делают руки.", "en": "A tool does not create energy, and the hands still do the work."}]),
  Q("fm-1-08",{"he": "שחיין דוחף את המים אחורה בידיים וברגליים. מה גורם לו לנוע קדימה?", "ar": "سبّاح يدفع الماء إلى الخلف بيديه ورجليه. ما الذي يجعله يتقدّم إلى الأمام؟", "ru": "Пловец толкает воду назад руками и ногами. Что заставляет его двигаться вперёд?", "en": "A swimmer pushes the water backward with arms and legs. What makes him move forward?"},[{"he": "המים נעים קדימה מעצמם וגוררים אותו.", "ar": "الماء يتحرّك إلى الأمام من تلقاء نفسه ويجرّه.", "ru": "Вода сама течёт вперёд и тянет его.", "en": "The water flows forward by itself and drags him."}, {"he": "הוא צף על המים, ולכן לא פועלים עליו כוחות בכלל.", "ar": "هو يطفو، لذلك لا تؤثّر فيه أي قوى أبدًا.", "ru": "Он плавает, поэтому на него вообще не действуют силы.", "en": "He floats, so no forces act on him at all."}, {"he": "הכבידה מושכת אותו קדימה כשהוא שוכב במים.", "ar": "الجاذبية تسحبه إلى الأمام عندما يستلقي في الماء.", "ru": "Тяготение тянет его вперёд, когда он лежит в воде.", "en": "Gravity pulls him forward when he lies in the water."}, {"he": "המים מפעילים עליו כוח שווה בכיוון ההפוך.", "ar": "الماء يؤثّر فيه بقوة مساوية في الاتجاه المعاكس.", "ru": "Вода действует на него равной силой в обратную сторону.", "en": "The water pushes on him with an equal force the opposite way."}],3,{"he": "מי דוחף את מי, ולאיזה כיוון?", "ar": "مَن يدفع مَن، وفي أي اتجاه؟", "ru": "Кто кого толкает и в какую сторону?", "en": "Who pushes whom, and in which direction?"},{"he": "לפי החוק השלישי של ניוטון, כשהשחיין דוחף את המים אחורה, המים דוחפים אותו קדימה באותו גודל. הכוח הזה מניע אותו. למשל חותר בסירה דוחף מים אחורה במשוט, והסירה מתקדמת.", "ar": "حسب قانون نيوتن الثالث، عندما يدفع السبّاح الماء إلى الخلف، يدفعه الماء إلى الأمام بالمقدار نفسه. هذه القوة تحرّكه. مثلًا يدفع المجذّف الماء إلى الخلف بالمجذاف، فيتقدّم القارب.", "ru": "По третьему закону Ньютона, когда пловец толкает воду назад, вода толкает его вперёд с той же силой. Эта сила и двигает его. Например, гребец толкает воду веслом назад, и лодка плывёт вперёд.", "en": "By Newton's third law, when the swimmer pushes the water back, the water pushes him forward just as hard. This force moves him. For example, a rower pushes water back with the oar, and the boat moves forward."},null,[{"he": "גם בבריכה שקטה השחיין מתקדם, ולכן התנועה לא באה מזרם.", "ar": "حتى في مسبح هادئ يتقدّم السبّاح، فالحركة لا تأتي من تيّار.", "ru": "Пловец движется и в спокойном бассейне, значит, дело не в течении.", "en": "The swimmer moves forward even in a still pool, so it is not a current."}, {"he": "על גוף צף פועלים כוחות, למשל הכבידה ודחיפת המים כלפי מעלה.", "ar": "تؤثّر في الجسم الطافي قوى، مثل الجاذبية ودفع الماء إلى أعلى.", "ru": "На плавающее тело действуют силы, например тяжесть и выталкивание воды.", "en": "Forces do act on a floating body, such as gravity and the water's upward push."}, {"he": "הכבידה מושכת תמיד כלפי מטה, ולא קדימה.", "ar": "الجاذبية تسحب دائمًا إلى أسفل، لا إلى الأمام.", "ru": "Тяготение всегда тянет вниз, а не вперёд.", "en": "Gravity always pulls downward, not forward."}, null]),
