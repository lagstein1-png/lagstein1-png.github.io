  Q("fm-1-09",{"he": "משאית כבדה ומכונית קטנה נוסעות באותה מהירות. איזה רכב קשה יותר לעצור, ולמה?", "ar": "شاحنة ثقيلة وسيارة صغيرة تسيران بالسرعة نفسها. أيّ مركبة أصعب في الإيقاف، ولماذا؟", "ru": "Тяжёлый грузовик и маленькая машина едут с одинаковой скоростью. Какую труднее остановить и почему?", "en": "A heavy truck and a small car travel at the same speed. Which is harder to stop, and why?"},[{"he": "המשאית, כי למסה גדולה יותר יש תנע גדול יותר.", "ar": "الشاحنة، لأن الكتلة الأكبر لها زخم أكبر.", "ru": "Грузовик, потому что у большей массы больше импульс.", "en": "The truck, because a larger mass has more momentum."}, {"he": "המכונית, כי היא קלה ומחליקה בקלות.", "ar": "السيارة، لأنها خفيفة وتنزلق بسهولة.", "ru": "Машину, потому что она лёгкая и легко скользит.", "en": "The car, because it is light and slides easily."}, {"he": "שתיהן באותה מידה, כי המהירות שלהן שווה.", "ar": "كلتاهما بالقدر نفسه، لأن سرعتهما متساوية.", "ru": "Одинаково, ведь их скорости равны.", "en": "Both equally, because their speeds are equal."}, {"he": "המשאית, כי לרכב גדול יש פחות חיכוך עם הכביש.", "ar": "الشاحنة، لأن المركبة الكبيرة احتكاكها مع الطريق أقل.", "ru": "Грузовик, потому что у большой машины меньше трения с дорогой.", "en": "The truck, because a big vehicle has less friction with the road."}],0,{"he": "מה עוד חשוב בבלימה, מלבד המהירות?", "ar": "ما الذي يهمّ أيضًا في الكبح غير السرعة؟", "ru": "Что ещё важно при торможении, кроме скорости?", "en": "Besides speed, what else matters when braking?"},{"he": "תנע (כמות תנועה) הוא מסה כפול מהירות. באותה מהירות למשאית יש מסה גדולה פי כמה, ולכן צריך כוח גדול יותר או זמן ארוך יותר כדי לעצור אותה. למשל עגלת סופר מלאה קשה יותר לעצור מעגלה ריקה.", "ar": "الزخم (كمية الحركة) هو الكتلة مضروبة في السرعة. عند السرعة نفسها كتلة الشاحنة أكبر بأضعاف، لذلك نحتاج قوة أكبر أو زمنًا أطول لإيقافها. مثلًا عربة التسوّق الممتلئة أصعب في الإيقاف من الفارغة.", "ru": "Импульс (количество движения) — это масса, умноженная на скорость. При той же скорости масса грузовика во много раз больше, поэтому для остановки нужна большая сила или больше времени. Например, полную тележку в магазине труднее остановить, чем пустую.", "en": "Momentum is mass times velocity. At the same speed the truck has many times more mass, so stopping it needs a bigger force or more time. For example, a full shopping cart is harder to stop than an empty one."},null,[null, {"he": "מסה קטנה פירושה תנע קטן, ולכן קל יותר לעצור את המכונית.", "ar": "الكتلة الصغيرة تعني زخمًا صغيرًا، فيسهل إيقاف السيارة.", "ru": "Малая масса означает малый импульс, поэтому машину остановить легче.", "en": "A small mass means a small momentum, so the car is easier to stop."}, {"he": "מהירות שווה לא מספיקה, כי גם המסה קובעת כמה קשה לעצור.", "ar": "تساوي السرعة لا يكفي، فالكتلة أيضًا تحدّد صعوبة الإيقاف.", "ru": "Равной скорости мало: трудность остановки зависит и от массы.", "en": "Equal speed is not enough, because mass also decides how hard it is to stop."}, {"he": "לרכב כבד אין פחות חיכוך; הקושי בא מהמסה הגדולה.", "ar": "المركبة الثقيلة ليس لها احتكاك أقل؛ الصعوبة من كتلتها الكبيرة.", "ru": "У тяжёлой машины трение не меньше, трудность в её большой массе.", "en": "A heavy vehicle does not have less friction; the difficulty comes from its large mass."}]),
  Q("fm-1-10",{"he": "מכונית נוסעת בכיכר במהירות קבועה של 30 קמ״ש. האם היא נמצאת בתאוצה?", "ar": "سيارة تسير في دوّار بسرعة ثابتة مقدارها 30 كم/س. هل هي في حالة تسارع؟", "ru": "Машина едет по кольцу с постоянной скоростью 30 км/ч. Есть ли у неё ускорение?", "en": "A car drives around a roundabout at a steady 30 km/h. Is it accelerating?"},[{"he": "לא, כי המספר על מד המהירות לא משתנה.", "ar": "لا، لأن الرقم على عدّاد السرعة لا يتغيّر.", "ru": "Нет, ведь число на спидометре не меняется.", "en": "No, because the number on the speedometer does not change."}, {"he": "כן, כי כיוון התנועה שלה משתנה כל הזמן.", "ar": "نعم، لأن اتجاه حركتها يتغيّر باستمرار.", "ru": "Да, потому что направление её движения всё время меняется.", "en": "Yes, because its direction of motion keeps changing."}, {"he": "לא, כי תאוצה קיימת רק כשלוחצים על הדוושה.", "ar": "لا، لأن التسارع يحدث فقط عند الضغط على الدوّاسة.", "ru": "Нет, ускорение бывает только при нажатии на педаль.", "en": "No, because acceleration happens only when you press the pedal."}, {"he": "כן, כי בכל כיכר המכונית מאטה ומאבדת מהירות.", "ar": "نعم، لأن السيارة في كل دوّار تتباطأ وتفقد سرعتها.", "ru": "Да, ведь на любом кольце машина тормозит и теряет скорость.", "en": "Yes, because in every roundabout the car slows and loses speed."}],1,{"he": "ממה בנויה המהירות: רק ממספר, או גם ממשהו נוסף?", "ar": "مِمّ تتكوّن السرعة المتّجهة: من رقم فقط، أم من شيء آخر أيضًا؟", "ru": "Из чего состоит скорость: только из числа или из чего-то ещё?", "en": "What makes up velocity: only a number, or something more?"},{"he": "מהירות כוללת גודל וגם כיוון. בכיכר הגודל קבוע אבל הכיוון משתנה, ולכן יש תאוצה, וצריך כוח שמסובב את המכונית. למשל בסיבוב חד הנוסעים מרגישים שהם נדחפים הצידה.", "ar": "السرعة المتّجهة تشمل المقدار والاتجاه. في الدوّار المقدار ثابت لكن الاتجاه يتغيّر، لذلك يوجد تسارع، ونحتاج قوة تُدير السيارة. مثلًا في المنعطف الحادّ يشعر الركاب أنهم يُدفعون إلى الجانب.", "ru": "Скорость включает величину и направление. На кольце величина постоянна, но направление меняется, поэтому ускорение есть, и нужна сила, поворачивающая машину. Например, на крутом повороте пассажиров словно отбрасывает в сторону.", "en": "Velocity includes both size and direction. In a roundabout the size is constant but the direction changes, so there is acceleration, and a force is needed to turn the car. For example, on a sharp turn passengers feel pushed to the side."},null,[{"he": "מד המהירות מראה רק את הגודל, ושינוי כיוון הוא גם תאוצה.", "ar": "عدّاد السرعة يُظهر المقدار فقط، وتغيير الاتجاه تسارع أيضًا.", "ru": "Спидометр показывает только величину, а смена направления — тоже ускорение.", "en": "The speedometer shows only the size, and a change of direction is also acceleration."}, null, {"he": "תאוצה היא כל שינוי במהירות או בכיוון, גם בלי דוושה.", "ar": "التسارع هو أي تغيّر في السرعة أو الاتجاه، حتى دون دوّاسة.", "ru": "Ускорение — любое изменение скорости или направления, даже без педали.", "en": "Acceleration is any change in speed or direction, even without the pedal."}, {"he": "בשאלה המהירות קבועה, ולכן הסיבה אינה האטה.", "ar": "في السؤال السرعة ثابتة، لذلك السبب ليس التباطؤ.", "ru": "В вопросе скорость постоянна, значит, причина не в торможении.", "en": "In the question the speed is constant, so the reason is not slowing down."}]),
  Q("fm-1-11",{"he": "ילד דוחף באותו כוח מזחלת ריקה, ואחר כך מזחלת שאחיו יושב עליה. מה יקרה?", "ar": "طفل يدفع بالقوة نفسها زلّاجة فارغة، ثم زلّاجة يجلس عليها أخوه. ماذا سيحدث؟", "ru": "Мальчик толкает с одной и той же силой пустые санки, а потом санки с братом. Что произойдёт?", "en": "A boy pushes an empty sled, then a sled with his brother on it, using the same force. What will happen?"},[{"he": "שתי המזחלות יאיצו באותה מידה, כי הכוח שווה.", "ar": "الزلّاجتان تتسارعان بالقدر نفسه، لأن القوة متساوية.", "ru": "И те и другие санки разгонятся одинаково, ведь сила равна.", "en": "Both sleds will speed up equally, because the force is equal."}, {"he": "המזחלת עם האח תאיץ יותר, כי היא כבדה.", "ar": "الزلّاجة مع الأخ تتسارع أكثر لأنها أثقل.", "ru": "Санки с братом разгонятся сильнее, потому что они тяжелее.", "en": "The sled with the brother speeds up more, because it is heavier."}, {"he": "המזחלת הריקה תאיץ יותר, כי המסה שלה קטנה.", "ar": "الزلّاجة الفارغة تتسارع أكثر، لأن كتلتها أصغر.", "ru": "Пустые санки разгонятся сильнее, потому что их масса меньше.", "en": "The empty sled speeds up more, because its mass is smaller."}, {"he": "המזחלת עם האח לא תזוז בכלל, גם בדחיפה חזקה.", "ar": "الزلّاجة مع الأخ لن تتحرّك أبدًا، حتى مع دفعة قوية.", "ru": "Санки с братом совсем не сдвинутся, даже при сильном толчке.", "en": "The sled with the brother will not move at all, even with a strong push."}],2,{"he": "לפי החוק השני, מה עוד קובע את התאוצה מלבד הכוח?", "ar": "حسب القانون الثاني، ما الذي يحدّد التسارع غير القوة؟", "ru": "По второму закону, что ещё определяет ускорение, кроме силы?", "en": "By the second law, what else sets the acceleration besides the force?"},{"he": "לפי החוק השני של ניוטון, אותו כוח נותן תאוצה גדולה יותר לגוף עם מסה קטנה. כשהמסה גדלה, התאוצה קטנה. למשל קל לזרוק כדור טניס רחוק, וכדור כדורת שנזרק באותו מאמץ נוחת קרוב.", "ar": "حسب قانون نيوتن الثاني، القوة نفسها تعطي الجسم الأصغر كتلة تسارعًا أكبر. عندما تزيد الكتلة يقلّ التسارع. مثلًا يسهل رمي كرة تنس بعيدًا، أما كرة البولينغ بالجهد نفسه فتسقط قريبًا.", "ru": "По второму закону Ньютона одна и та же сила даёт большее ускорение телу с меньшей массой. Когда масса растёт, ускорение уменьшается. Например, теннисный мяч легко бросить далеко, а шар для боулинга с тем же усилием падает близко.", "en": "By Newton's second law, the same force gives a larger acceleration to a body with less mass. When the mass grows, the acceleration shrinks. For example, a tennis ball is easy to throw far, while a bowling ball thrown with the same effort lands close."},null,[{"he": "אותו כוח לא נותן אותה תאוצה כשהמסות שונות.", "ar": "القوة نفسها لا تعطي التسارع نفسه عندما تختلف الكتل.", "ru": "Одна и та же сила не даёт одинакового ускорения при разных массах.", "en": "The same force does not give the same acceleration when the masses differ."}, {"he": "מסה גדולה מקטינה את התאוצה, ולא מגדילה אותה.", "ar": "الكتلة الكبيرة تُصغّر التسارع ولا تزيده.", "ru": "Большая масса уменьшает ускорение, а не увеличивает его.", "en": "A larger mass reduces the acceleration; it does not increase it."}, null, {"he": "על השלג החיכוך קטן, ולכן גם מזחלת כבדה זזה, רק לאט יותר.", "ar": "الاحتكاك على الثلج صغير، لذلك تتحرّك الزلّاجة الثقيلة أيضًا لكن ببطء أكبر.", "ru": "На снегу трение мало, поэтому и тяжёлые санки поедут, только медленнее.", "en": "On snow friction is small, so even the heavy sled moves, just more slowly."}]),
  Q("fm-1-12",{"he": "על הירח אין אוויר. אסטרונאוט משחרר פטיש ונוצה מאותו גובה באותו רגע. מה יקרה?", "ar": "لا يوجد هواء على القمر. يُفلت رائد فضاء مطرقة وريشة من الارتفاع نفسه في اللحظة نفسها. ماذا سيحدث؟", "ru": "На Луне нет воздуха. Космонавт одновременно отпускает молоток и перо с одной высоты. Что произойдёт?", "en": "There is no air on the Moon. An astronaut drops a hammer and a feather from the same height at the same moment. What will happen?"},[{"he": "הפטיש יגיע ראשון, כי הוא כבד יותר.", "ar": "تصل المطرقة أولًا لأنها أثقل.", "ru": "Молоток упадёт первым, потому что он тяжелее.", "en": "The hammer lands first, because it is heavier."}, {"he": "הנוצה תרחף ולא תיפול, כי אין אוויר.", "ar": "الريشة ستطفو ولن تسقط لأنه لا هواء.", "ru": "Перо будет парить и не упадёт, ведь воздуха нет.", "en": "The feather will float and not fall, because there is no air."}, {"he": "שניהם יישארו תלויים במקום, כי בירח אין כבידה.", "ar": "سيبقيان معلّقين في مكانهما لأنه لا جاذبية على القمر.", "ru": "Оба зависнут на месте, потому что на Луне нет тяготения.", "en": "Both will hang in place, because the Moon has no gravity."}, {"he": "שניהם ינחתו על הקרקע באותו רגע בדיוק.", "ar": "سيصلان إلى سطح القمر في اللحظة نفسها تمامًا.", "ru": "Оба коснутся поверхности точно в один момент.", "en": "Both will hit the ground at exactly the same moment."}],3,{"he": "מה מאט נוצה שנופלת בכדור הארץ?", "ar": "ما الذي يُبطئ الريشة الساقطة على الأرض؟", "ru": "Что замедляет падающее перо на Земле?", "en": "What slows a falling feather on Earth?"},{"he": "בלי התנגדות אוויר, הכבידה נותנת לכל הגופים אותה תאוצה, בלי קשר למסה. בכדור הארץ הנוצה איטית רק בגלל האוויר. למשל אסטרונאוט במשימת אפולו 15 עשה בדיוק את הניסוי הזה, והשניים נחתו יחד.", "ar": "دون مقاومة هواء، تعطي الجاذبية جميع الأجسام التسارع نفسه بغضّ النظر عن الكتلة. على الأرض تكون الريشة بطيئة بسبب الهواء فقط. مثلًا أجرى رائد فضاء في مهمة أبولو 15 هذه التجربة بالضبط، فهبط الجسمان معًا.", "ru": "Без сопротивления воздуха тяготение даёт всем телам одинаковое ускорение независимо от массы. На Земле перо падает медленно только из-за воздуха. Например, астронавт миссии «Аполлон-15» провёл именно этот опыт, и оба предмета упали вместе.", "en": "Without air resistance, gravity gives all bodies the same acceleration, whatever their mass. On Earth the feather is slow only because of the air. For example, an Apollo 15 astronaut did exactly this experiment, and both landed together."},null,[{"he": "בלי אוויר המסה לא משנה את מהירות הנפילה, ושניהם נופלים יחד.", "ar": "دون هواء لا تؤثّر الكتلة في سرعة السقوط، فيسقطان معًا.", "ru": "Без воздуха масса не влияет на скорость падения, и они падают вместе.", "en": "Without air, mass does not change how fast things fall, so they fall together."}, {"he": "אוויר לא מחזיק דברים למעלה; בלעדיו הנוצה נופלת מהר יותר.", "ar": "الهواء لا يحمل الأشياء إلى أعلى؛ ودونه تسقط الريشة أسرع.", "ru": "Воздух не держит предметы наверху; без него перо падает быстрее.", "en": "Air does not hold things up; without it the feather falls faster."}, {"he": "לירח יש כבידה, חלשה מזו של כדור הארץ, ולכן חפצים נופלים בו.", "ar": "للقمر جاذبية أضعف من جاذبية الأرض، لذلك تسقط الأجسام عليه.", "ru": "У Луны есть тяготение, слабее земного, поэтому предметы там падают.", "en": "The Moon has gravity, weaker than Earth's, so objects do fall there."}, null]),
  Q("fm-1-13",{"he": "אדם הולך על רצפה רטובה עם סבון ומחליק. איזה כוח חסר לו כדי ללכת בבטחה?", "ar": "رجل يمشي على أرضية مبلّلة بالصابون فينزلق. ما القوة التي تنقصه ليمشي بأمان؟", "ru": "Человек идёт по мокрому мыльному полу и поскальзывается. Какой силы ему не хватает, чтобы идти безопасно?", "en": "A man walks on a wet, soapy floor and slips. Which force is missing for him to walk safely?"},[{"he": "חיכוך בין הנעליים לבין הרצפה.", "ar": "الاحتكاك بين الحذاء والأرضية.", "ru": "Трения между обувью и полом.", "en": "Friction between his shoes and the floor."}, {"he": "כוח כבידה חזק יותר שילחץ אותו לרצפה.", "ar": "قوة جاذبية أقوى تضغطه على الأرضية.", "ru": "Более сильного тяготения, прижимающего к полу.", "en": "Stronger gravity pressing him to the floor."}, {"he": "התנגדות אוויר שתאט את הצעדים שלו.", "ar": "مقاومة هواء تُبطئ خطواته.", "ru": "Сопротивления воздуха, замедляющего шаги.", "en": "Air resistance to slow down his steps."}, {"he": "כוח ציפה שיחזיק אותו למעלה.", "ar": "قوة طفو تُبقيه في الأعلى.", "ru": "Выталкивающей силы, которая его держит.", "en": "A buoyant force to hold him up."}],0,{"he": "מה מאפשר לרגל לדחוף את הרצפה אחורה בלי לזוז ממקומה?", "ar": "ما الذي يسمح للقدم بدفع الأرضية إلى الخلف دون أن تتحرّك من مكانها؟", "ru": "Что позволяет ноге толкать пол назад и не сдвигаться с места?", "en": "What lets the foot push the floor backward without moving from its spot?"},{"he": "כדי ללכת, הרגל דוחפת את הרצפה אחורה, והחיכוך מחזיר דחיפה קדימה. מים וסבון מקטינים מאוד את החיכוך, והרגל מחליקה. למשל לנעלי ספורט יש סוליה מחוספסת כדי להגדיל את האחיזה.", "ar": "لكي نمشي تدفع القدم الأرضية إلى الخلف، فيعيد الاحتكاك دفعًا إلى الأمام. الماء والصابون يقلّلان الاحتكاك كثيرًا فتنزلق القدم. مثلًا للأحذية الرياضية نعل خشن لزيادة التماسك.", "ru": "При ходьбе нога толкает пол назад, а трение даёт толчок вперёд. Вода и мыло сильно уменьшают трение, и нога скользит. Например, у кроссовок рифлёная подошва, чтобы лучше держаться.", "en": "To walk, the foot pushes the floor backward, and friction gives a push forward. Water and soap greatly reduce friction, so the foot slides. For example, sports shoes have a rough sole to improve grip."},null,[null, {"he": "הכבידה לא נעלמה, והבעיה היא שהנעל לא נאחזת ברצפה.", "ar": "الجاذبية لم تختفِ، والمشكلة أن الحذاء لا يتماسك مع الأرضية.", "ru": "Тяготение никуда не делось, проблема в том, что обувь не держится за пол.", "en": "Gravity has not disappeared; the problem is that the shoe does not grip the floor."}, {"he": "התנגדות האוויר בהליכה קטנה מאוד, והיא לא מונעת החלקה.", "ar": "مقاومة الهواء أثناء المشي ضئيلة، ولا تمنع الانزلاق.", "ru": "Сопротивление воздуха при ходьбе ничтожно и от скольжения не спасает.", "en": "Air resistance while walking is tiny and does not prevent slipping."}, {"he": "כוח ציפה דוחף גוף מעלה בתוך נוזל או גז, והוא לא עוזר לנעל להיאחז ברצפה.", "ar": "قوة الطفو تدفع الجسم إلى أعلى داخل سائل أو غاز، ولا تساعد الحذاء على التمسّك بالأرضية.", "ru": "Выталкивающая сила толкает тело вверх в жидкости или газе и не помогает подошве держаться за пол.", "en": "Buoyancy pushes a body up in a liquid or gas, and it does not help the shoe grip the floor."}]),
  Q("fm-1-14",{"he": "עובד צריך להעלות חבית כבדה למשאית. הוא מגלגל אותה על רמפה משופעת במקום להרים. מה הוא מרוויח?", "ar": "عامل يحتاج إلى رفع برميل ثقيل إلى شاحنة. يدحرجه على منحدر مائل بدل أن يرفعه. ماذا يكسب؟", "ru": "Рабочему нужно поднять тяжёлую бочку в грузовик. Вместо подъёма он закатывает её по наклонному пандусу. Что он выигрывает?", "en": "A worker needs to get a heavy barrel onto a truck. Instead of lifting it, he rolls it up a sloped ramp. What does he gain?"},[{"he": "הוא משקיע פחות אנרגיה בסך הכול, כי הרמפה עוזרת.", "ar": "يبذل طاقة أقلّ في المجموع، لأن المنحدر يساعده.", "ru": "Он тратит меньше энергии в целом, потому что пандус помогает.", "en": "He uses less energy overall, because the ramp helps."}, {"he": "הוא דוחף בכוח קטן יותר, לאורך דרך ארוכה יותר.", "ar": "يدفع بقوة أصغر على مسافة أطول.", "ru": "Он толкает с меньшей силой, но на более длинном пути.", "en": "He pushes with less force, over a longer distance."}, {"he": "הרמפה מקטינה את המסה של החבית בזמן העלייה.", "ar": "المنحدر يُنقص كتلة البرميل أثناء الصعود.", "ru": "Пандус уменьшает массу бочки во время подъёма.", "en": "The ramp reduces the barrel's mass on the way up."}, {"he": "החבית עולה מהר יותר, ולכן הכוח קטן.", "ar": "يصعد البرميل أسرع، لذلك تصغر القوة.", "ru": "Бочка поднимается быстрее, поэтому сила меньше.", "en": "The barrel goes up faster, so the force is smaller."}],1,{"he": "השוו את אורך הרמפה לגובה של המשאית.", "ar": "قارنوا طول المنحدر بارتفاع الشاحنة.", "ru": "Сравните длину пандуса с высотой кузова.", "en": "Compare the ramp's length with the truck's height."},{"he": "מישור משופע הוא מכונה פשוטה. הוא מאפשר להפעיל כוח קטן יותר, אבל לאורך מרחק גדול יותר, והעבודה הכוללת לא קטנה. למשל דרך הררית מתפתלת ארוכה יותר, אבל קל יותר לעלות בה.", "ar": "المستوى المائل آلة بسيطة. يسمح بالتأثير بقوة أصغر لكن على مسافة أطول، والشغل الكلي لا يقلّ. مثلًا الطريق الجبلي المتعرّج أطول، لكن الصعود فيه أسهل.", "ru": "Наклонная плоскость — простой механизм. Она позволяет прикладывать меньшую силу, но на большем пути, и общая работа не уменьшается. Например, горная дорога-серпантин длиннее, зато подниматься по ней легче.", "en": "An inclined plane is a simple machine. It lets you apply a smaller force over a longer distance, and the total work does not shrink. For example, a winding mountain road is longer, but it is easier to climb."},null,[{"he": "מכונה פשוטה לא חוסכת אנרגיה, ובפועל החיכוך אף מוסיף מעט.", "ar": "الآلة البسيطة لا توفّر طاقة، والاحتكاك يضيف قليلًا في الواقع.", "ru": "Простой механизм не экономит энергию, а трение даже немного добавляет.", "en": "A simple machine does not save energy, and friction actually adds a little."}, null, {"he": "המסה של החבית קבועה, והרמפה משנה רק את הכוח שצריך לדחוף.", "ar": "كتلة البرميل ثابتة، والمنحدر يغيّر فقط القوة اللازمة للدفع.", "ru": "Масса бочки постоянна, пандус меняет лишь нужную силу толчка.", "en": "The barrel's mass is fixed; the ramp changes only the force needed to push."}, {"he": "ברמפה הדרך ארוכה יותר, והחבית לא עולה מהר יותר.", "ar": "على المنحدر الطريق أطول، والبرميل لا يصعد أسرع.", "ru": "По пандусу путь длиннее, и бочка не поднимается быстрее.", "en": "On a ramp the path is longer, and the barrel does not go up faster."}])
 ],
 [
  Q("a1-motion-table",{"he": "תלמידה מדדה את מיקום עגלת צעצוע בכל שנייה: 0, 2, 4, 6, 8 מטר אחרי 0, 1, 2, 3, 4 שניות. איזה תיאור מתאים לתנועה?", "ar": "قاسَت طالبة موضع عربة لعبة كل ثانية: 0، 2، 4، 6، 8 أمتار بعد 0، 1، 2، 3، 4 ثوانٍ. أي وصف يناسب الحركة؟", "ru": "Ученица измеряла положение игрушечной тележки каждую секунду: 0, 2, 4, 6, 8 м после 0, 1, 2, 3, 4 с. Какое описание подходит движению?", "en": "A student measured a toy cart's position every second: 0, 2, 4, 6, 8 meters after 0, 1, 2, 3, 4 seconds. Which description fits the motion?"},[{"he": "העגלה מאיצה, כי המרחקים בטבלה גדלים.", "ar": "العربة تتسارع لأن المسافات في الجدول تكبر.", "ru": "Тележка ускоряется, потому что расстояния в таблице растут.", "en": "The cart accelerates because the distances in the table grow."},{"he": "העגלה מאטה, כי ההפרשים בין המדידות קטנים.", "ar": "العربة تتباطأ لأن الفروق بين القياسات صغيرة.", "ru": "Тележка замедляется, потому что промежутки между измерениями малы.", "en": "The cart slows down because the gaps between measurements are small."},{"he": "העגלה נעה לאחור, כי המספרים מתחילים מאפס.", "ar": "العربة تتحرك للخلف لأن الأرقام تبدأ من الصفر.", "ru": "Тележка движется назад, потому что числа начинаются с нуля.", "en": "The cart moves backward because the numbers start from zero."},{"he": "מהירות קבועה: בכל שנייה העגלה עוברת מרחק שווה.", "ar": "سرعة ثابتة: العربة تقطع مسافة متساوية كل ثانية.", "ru": "Скорость постоянна: тележка проходит равный путь каждую секунду.", "en": "Constant speed: the cart covers an equal distance every second."}],3,{"he": "בדקו את ההפרש בין מדידה למדידה, לא רק את המספרים עצמם.", "ar": "افحصوا الفرق بين كل قياسين، وليس الأرقام وحدها.", "ru": "Проверьте разницу между соседними измерениями, а не только сами числа.", "en": "Check the difference between consecutive measurements, not only the numbers themselves."},{"he": "במהירות קבועה הגוף עובר מרחקים שווים בזמנים שווים. כאן העגלה מתקדמת 2 מטר בכל שנייה, כלומר 2 מטר לשנייה לאורך כל המדידה. למשל רכבת שנעה 20 מטר בכל שנייה נוסעת במהירות קבועה של 20 מטר לשנייה.", "ar": "بالسرعة الثابتة يقطع الجسم مسافات متساوية في أزمنة متساوية. هنا تتقدم العربة مترين كل ثانية، أي مترين في الثانية طوال القياس. مثال: قطار يقطع 20 مترًا كل ثانية يسير بسرعة ثابتة 20 مترًا في الثانية.", "ru": "При постоянной скорости тело проходит равные пути за равное время. Здесь тележка проходит 2 м каждую секунду, то есть 2 м/с на всём измерении. Например, поезд, проходящий 20 м каждую секунду, едет с постоянной скоростью 20 м/с.", "en": "At constant speed a body covers equal distances in equal times. Here the cart advances 2 meters every second, that is 2 meters per second throughout. For example, a train covering 20 meters every second moves at a constant 20 meters per second."},null,[{"he": "בהאצה המהירות משתנה, וההפרשים היו גדלים ממדידה למדידה.", "ar": "في التسارع تتغير السرعة، وكانت الفروق ستكبر من قياس لقياس.", "ru": "При ускорении скорость меняется, и промежутки росли бы от измерения к измерению.", "en": "With acceleration the speed changes, and the gaps would grow from one measurement to the next."},{"he": "בהאטה ההפרשים היו קטנים עד אפס, וכאן הם קבועים.", "ar": "في التباطؤ كانت الفروق ستصغر حتى الصفر، وهنا هي ثابتة.", "ru": "При торможении промежутки уменьшались бы до нуля, а здесь они постоянны.", "en": "When slowing down the gaps would shrink to zero; here they stay the same."},{"he": "המיקום גדל בכיוון אחד בלבד, ואין סימן לתנועה לאחור.", "ar": "الموضع يزداد في اتجاه واحد فقط، ولا علامة على حركة للخلف.", "ru": "Положение растёт в одном направлении, признаков движения назад нет.", "en": "The position grows in one direction only; there is no sign of backward motion."},null]),
  Q("a1-elevator",{"he": "אדם עומד על משקל בתוך מעלית. המעלית מתחילה להאיץ כלפי מעלה. מה יראה המשקל באותו רגע?", "ar": "شخص يقف على ميزان داخل مصعد. بدأ المصعد يتسارع نحو الأعلى. ماذا سيُظهر الميزان في تلك اللحظة؟", "ru": "Человек стоит на весах в лифте. Лифт начинает ускоряться вверх. Что покажут весы в этот момент?", "en": "A person stands on a scale inside an elevator. The elevator starts accelerating upward. What will the scale show at that moment?"},[{"he": "קריאה נמוכה מהרגיל, כי המעלית לוקחת חלק מהמשקל.", "ar": "قراءة أقل من المعتاد، لأن المصعد يأخذ جزءًا من الوزن.", "ru": "Показание ниже обычного, потому что лифт забирает часть веса.", "en": "A lower reading than usual, because the elevator takes part of the weight."},{"he": "קריאה גבוהה מהרגיל, כי הרצפה לוחצת עליו חזק יותר בהאצה מעלה.", "ar": "قراءة أعلى من المعتاد، لأن الأرضية تضغط عليه بقوة أكبر عند التسارع للأعلى.", "ru": "Показание выше обычного: пол давит сильнее при ускорении вверх.", "en": "A higher reading than usual, because the floor presses harder when accelerating upward."},{"he": "אותה קריאה בדיוק, כי משקל האדם לא משתנה בתנועה.", "ar": "نفس القراءة تمامًا، لأن وزن الشخص لا يتغير بالحركة.", "ru": "Точно то же показание, ведь вес человека не меняется в движении.", "en": "Exactly the same reading, because the person's weight does not change in motion."},{"he": "אפס, כי בתנועה אין משקל בכלל.", "ar": "صفر، لأنه لا يوجد وزن أثناء الحركة.", "ru": "Ноль, потому что в движении веса нет.", "en": "Zero, because there is no weight while moving."}],1,{"he": "המשקל מודד את הלחץ של הרצפה על הרגליים, לא את המסה.", "ar": "الميزان يقيس ضغط الأرضية على القدمين، لا الكتلة.", "ru": "Весы измеряют давление пола на ноги, а не массу.", "en": "The scale measures the floor's push on the feet, not the mass."},{"he": "המשקל מודד את הכוח שהרצפה מפעילה על האדם. כשהמעלית מאיצה מעלה, הרצפה צריכה כוח גדול מכוח הכבידה כדי להאיץ את האדם יחד איתה, והקריאה גדלה. למשל ברגע הזינוק של מעלית מרגישים לחץ קל בברכיים.", "ar": "الميزان يقيس القوة التي تطبقها الأرضية على الشخص. عندما يتسارع المصعد للأعلى، تحتاج الأرضية قوة أكبر من الجاذبية لتسريع الشخص معها، فتكبر القراءة. مثال: لحظة انطلاق المصعد نشعر بضغط خفيف في الركب.", "ru": "Весы измеряют силу, с которой пол давит на человека. Когда лифт ускоряется вверх, полу нужна сила больше силы тяжести, чтобы ускорить человека вместе с собой, и показание растёт. Например, в момент старта лифта чувствуется лёгкое давление в коленях.", "en": "The scale measures the force the floor applies to the person. When the elevator accelerates upward, the floor needs a force greater than gravity to accelerate the person along with it, so the reading grows. For example, at the elevator's takeoff you feel a slight pressure in your knees."},null,[{"he": "קריאה נמוכה מופיעה דווקא כשהמעלית מאיצה כלפי מטה.", "ar": "القراءة الأقل تظهر بالعكس عند تسارع المصعد نحو الأسفل.", "ru": "Показание ниже обычного бывает как раз при ускорении вниз.", "en": "A lower reading appears exactly when the elevator accelerates downward."},null,{"he": "המסה לא משתנה, אבל המשקל מודד כוח נורמלי, והוא כן משתנה בהאצה.", "ar": "الكتلة لا تتغير، لكن الميزان يقيس القوة العمودية وهي تتغير مع التسارع.", "ru": "Масса не меняется, но весы измеряют силу реакции опоры, а она при ускорении меняется.", "en": "Mass stays the same, but the scale measures the normal force, which does change with acceleration."},{"he": "אפס יופיע רק בנפילה חופשית מלאה, לא בהאצה מעלה.", "ar": "الصفر يظهر فقط في السقوط الحر الكامل، لا في التسارع للأعلى.", "ru": "Ноль появится только в полном свободном падении, а не при ускорении вверх.", "en": "Zero appears only in full free fall, not when accelerating upward."}]),
  Q("a1-braking",{"he": "במבחני בטיחות נמדד: רכב ב-50 קמ״ש עוצר אחרי 12 מטר, ואותו רכב ב-100 קמ״ש עוצר אחרי 48 מטר. איזו מסקנה נכונה?", "ar": "في اختبارات السلامة قيس: سيارة بسرعة 50 كم/س تتوقف بعد 12 مترًا، ونفسها بسرعة 100 كم/س تتوقف بعد 48 مترًا. أي استنتاج صحيح؟", "ru": "В испытаниях безопасности измерили: машина на 50 км/ч останавливается через 12 м, та же машина на 100 км/ч через 48 м. Какой вывод верен?", "en": "Safety tests measured: a car at 50 km/h stops after 12 meters, the same car at 100 km/h stops after 48 meters. Which conclusion is correct?"},[{"he": "מרחק הבלימה גדל פי 2 כשהמהירות גדלה פי 2.", "ar": "طريق الكبح يتضاعف مرتين عند مضاعفة السرعة.", "ru": "Тормозной путь растёт в 2 раза при удвоении скорости.", "en": "Braking distance doubles when speed doubles."},{"he": "מרחק הבלימה תלוי רק במשקל הרכב.", "ar": "طريق الكبح يعتمد فقط على وزن السيارة.", "ru": "Тормозной путь зависит только от массы машины.", "en": "Braking distance depends only on the car's weight."},{"he": "המרחק גדל בערך פי 4 כשהמהירות מוכפלת.", "ar": "المسافة تكبر نحو أربع مرات عند مضاعفة السرعة.", "ru": "Путь растёт примерно в 4 раза при удвоении скорости.", "en": "The distance grows about fourfold when the speed doubles."},{"he": "המדידות סותרות זו את זו, ולכן אי אפשר להסיק מסקנה.", "ar": "القياسات متناقضة، لذلك لا يمكن استنتاج شيء.", "ru": "Измерения противоречат друг другу, поэтому вывода нет.", "en": "The measurements contradict each other, so no conclusion is possible."}],2,{"he": "חשבו את היחס בין שני המרחקים, לא את ההפרש.", "ar": "احسبوا النسبة بين المسافتين، لا الفرق بينهما.", "ru": "Посчитайте отношение двух путей, а не разность.", "en": "Work out the ratio of the two distances, not the difference."},{"he": "המרחק גדל מ-12 ל-48 מטר, כלומר פי 4, כשהמהירות הוכפלה. מרחק הבלימה קשור לאנרגיית התנועה, והיא גדלה עם ריבוע המהירות. למשל נהיגה ב-120 קמ״ש דורשת מרחק בלימה גדול בהרבה מפי 2 מ-60 קמ״ש.", "ar": "المسافة كبرت من 12 إلى 48 مترًا، أي أربع مرات، عندما تضاعفت السرعة. طريق الكبح مرتبط بطاقة الحركة، وهي تكبر مع مربع السرعة. مثال: القيادة بسرعة 120 كم/س تتطلب طريق كبح أكبر بكثير من ضعف ما عند 60 كم/س.", "ru": "Путь вырос с 12 до 48 м, то есть в 4 раза, при удвоении скорости. Тормозной путь связан с кинетической энергией, а она растёт с квадратом скорости. Например, езда на 120 км/ч требует тормозного пути гораздо больше, чем вдвое большего, чем на 60 км/ч.", "en": "The distance grew from 12 to 48 meters, four times, when the speed doubled. Braking distance is tied to kinetic energy, which grows with the square of speed. For example, driving at 120 km/h needs a braking distance far more than twice that at 60 km/h."},null,[{"he": "פי 2 היה נותן 24 מטר בלבד, והמדידה היא 48.", "ar": "الضعفان كان سيعطي 24 مترًا فقط، والقياس 48.", "ru": "Двукратный рост дал бы 24 м, а измерено 48.", "en": "Doubling would give only 24 meters; the measurement is 48."},{"he": "שתי המדידות הן על אותו רכב, והמרחק משתנה דווקא עם המהירות.", "ar": "القياسان لنفس السيارة، والمسافة تتغير تحديدًا مع السرعة.", "ru": "Оба измерения на одной машине, а путь меняется именно со скоростью.", "en": "Both measurements are for the same car, and the distance changes precisely with speed."},null,{"he": "שתי מדידות עקביות מספיקות כדי לראות מגמה ברורה.", "ar": "قياسان متسقان يكفيان لرؤية اتجاه واضح.", "ru": "Двух согласованных измерений достаточно, чтобы увидеть ясную закономерность.", "en": "Two consistent measurements are enough to see a clear pattern."}]),
  Q("fm-2-01",{"he": "רץ עבר 100 מטר ב-20 שניות. מה המהירות הממוצעת שלו?", "ar": "عدّاء قطع 100 متر في 20 ثانية. ما سرعته المتوسّطة؟", "ru": "Бегун пробежал 100 метров за 20 секунд. Какова его средняя скорость?", "en": "A runner covered 100 meters in 20 seconds. What is his average speed?"},[{"he": "2,000 מטר לשנייה", "ar": "2,000 متر في الثانية", "ru": "2000 метров в секунду", "en": "2,000 meters per second"}, {"he": "0.2 מטר לשנייה", "ar": "0.2 متر في الثانية", "ru": "0,2 метра в секунду", "en": "0.2 meters per second"}, {"he": "5 מטר לשנייה", "ar": "5 أمتار في الثانية", "ru": "5 метров в секунду", "en": "5 meters per second"}, {"he": "80 מטר לשנייה", "ar": "80 مترًا في الثانية", "ru": "80 метров в секунду", "en": "80 meters per second"}],2,{"he": "מהירות היא הדרך שעוברים בכל שנייה.", "ar": "السرعة هي المسافة المقطوعة في كل ثانية.", "ru": "Скорость — это путь за каждую секунду.", "en": "Speed is the distance covered each second."},{"he": "מחלקים את הדרך בזמן: 100 מטר חלקי 20 שניות. יוצא שהרץ מתקדם בממוצע 5 מטר בכל שנייה. למשל אדם בהליכה רגילה עובר בערך מטר אחד בשנייה.", "ar": "نقسم المسافة على الزمن: 100 متر على 20 ثانية. فيتقدّم العدّاء في المتوسّط 5 أمتار كل ثانية. مثلًا يقطع الإنسان في المشي العادي نحو متر واحد في الثانية.", "ru": "Делим путь на время: 100 метров на 20 секунд. Получается, что бегун в среднем продвигается на 5 метров каждую секунду. Например, при обычной ходьбе человек проходит около 1 метра в секунду.", "en": "Divide distance by time: 100 meters by 20 seconds. So the runner advances 5 meters each second on average. For example, a person walking normally covers about 1 meter per second."},null,[{"he": "כאן כפלו את הדרך בזמן במקום לחלק, ויצאה מהירות גבוהה מזו של מטוס.", "ar": "هنا ضُربت المسافة في الزمن بدل القسمة، فخرجت سرعة أعلى من سرعة طائرة.", "ru": "Здесь путь умножили на время вместо деления, и вышла скорость больше, чем у самолёта.", "en": "Here distance was multiplied by time instead of divided, giving a speed higher than a plane's."}, {"he": "כאן חילקו את הזמן בדרך, ויצא מספר הפוך.", "ar": "هنا قُسم الزمن على المسافة، فخرج رقم مقلوب.", "ru": "Здесь время разделили на путь и получили обратное число.", "en": "Here time was divided by distance, giving the inverted number."}, null, {"he": "כאן חיסרו את הזמן מהדרך, וכך לא מחשבים מהירות.", "ar": "هنا طُرح الزمن من المسافة، وهكذا لا تُحسب السرعة.", "ru": "Здесь время вычли из пути, а так скорость не считают.", "en": "Here the time was subtracted from the distance, which is not how speed is found."}]),
  Q("fm-2-02",{"he": "נסיעה של 120 ק״מ נמשכה שעה וחצי. מה הייתה המהירות הממוצעת?", "ar": "رحلة طولها 120 كم استغرقت ساعة ونصفًا. ما كانت السرعة المتوسّطة؟", "ru": "Поездка длиной 120 км заняла полтора часа. Какой была средняя скорость?", "en": "A 120 km drive took an hour and a half. What was the average speed?"},[{"he": "120 קמ״ש", "ar": "120 كم/س", "ru": "120 км/ч", "en": "120 km/h"}, {"he": "180 קמ״ש", "ar": "180 كم/س", "ru": "180 км/ч", "en": "180 km/h"}, {"he": "60 קמ״ש", "ar": "60 كم/س", "ru": "60 км/ч", "en": "60 km/h"}, {"he": "80 קמ״ש", "ar": "80 كم/س", "ru": "80 км/ч", "en": "80 km/h"}],3,{"he": "כתבו שעה וחצי כמספר עשרוני, ורק אז חלקו.", "ar": "اكتبوا ساعة ونصفًا كعدد عشري، ثم اقسموا.", "ru": "Запишите полтора часа десятичной дробью, а потом делите.", "en": "Write an hour and a half as a decimal, and only then divide."},{"he": "שעה וחצי הן 1.5 שעות. מחלקים 120 ק״מ ב-1.5 שעות ומקבלים 80 קמ״ש בממוצע. למשל בפקק הרכב עומד חלק מהזמן, והממוצע יורד גם אם לפעמים נסעו מהר.", "ar": "ساعة ونصف تساوي 1.5 ساعة. نقسم 120 كم على 1.5 ساعة فنحصل على 80 كم/س في المتوسّط. مثلًا في الازدحام تتوقّف السيارة جزءًا من الوقت، فينخفض المتوسّط حتى لو أسرعت أحيانًا.", "ru": "Полтора часа — это 1,5 часа. Делим 120 км на 1,5 часа и получаем в среднем 80 км/ч. Например, в пробке машина часть времени стоит, и средняя скорость падает, даже если иногда ехали быстро.", "en": "An hour and a half is 1.5 hours. Dividing 120 km by 1.5 hours gives 80 km/h on average. For example, in a traffic jam the car stands still part of the time, so the average drops even if it sometimes went fast."},null,[{"he": "120 קמ״ש מתאים לנסיעה של שעה אחת בלבד, ולא שעה וחצי.", "ar": "120 كم/س تناسب رحلة ساعة واحدة فقط، لا ساعة ونصفًا.", "ru": "120 км/ч подходит для поездки ровно в 1 час, а не в полтора.", "en": "120 km/h fits a drive of only one hour, not an hour and a half."}, {"he": "כאן כפלו ב-1.5 במקום לחלק, ולכן המהירות יצאה גבוהה מדי.", "ar": "هنا ضُرب في 1.5 بدل القسمة، فخرجت السرعة كبيرة جدًا.", "ru": "Здесь умножили на 1,5 вместо деления, и скорость вышла слишком большой.", "en": "Here it was multiplied by 1.5 instead of divided, so the speed came out too high."}, {"he": "60 קמ״ש מתאים לנסיעה של שעתיים, ולא של שעה וחצי.", "ar": "60 كم/س تناسب رحلة ساعتين، لا ساعة ونصفًا.", "ru": "60 км/ч подходит для поездки в 2 часа, а не в полтора.", "en": "60 km/h fits a two-hour drive, not one of an hour and a half."}, null]),
  Q("fm-2-03",{"he": "בגרף מהירות–זמן של אופניים יש קו ישר ואופקי בגובה 15 קמ״ש, מהדקה 2 עד הדקה 6. מה קרה בזמן הזה?", "ar": "في رسم السرعة–الزمن لدرّاجة يوجد خطّ مستقيم أفقي عند 15 كم/س، من الدقيقة 2 حتى الدقيقة 6. ماذا حدث في هذا الوقت؟", "ru": "На графике скорость–время для велосипеда есть прямая горизонтальная линия на уровне 15 км/ч, со 2-й по 6-ю минуту. Что происходило в это время?", "en": "On a bike's speed–time graph there is a straight horizontal line at 15 km/h, from minute 2 to minute 6. What happened during that time?"},[{"he": "האופניים נסעו במהירות קבועה של 15 קמ״ש.", "ar": "سارت الدرّاجة بسرعة ثابتة مقدارها 15 كم/س.", "ru": "Велосипед ехал с постоянной скоростью 15 км/ч.", "en": "The bike rode at a steady 15 km/h."}, {"he": "האופניים עמדו במקום, כי הקו לא עולה.", "ar": "الدرّاجة كانت متوقّفة لأن الخطّ لا يرتفع.", "ru": "Велосипед стоял на месте, ведь линия не растёт.", "en": "The bike stood still, because the line does not rise."}, {"he": "האופניים האיצו באופן קבוע עד 15 קמ״ש.", "ar": "تسارعت الدرّاجة بانتظام حتى 15 كم/س.", "ru": "Велосипед равномерно разгонялся до 15 км/ч.", "en": "The bike sped up steadily to 15 km/h."}, {"he": "האופניים עברו בדיוק 15 ק״מ בזמן הזה.", "ar": "قطعت الدرّاجة 15 كم بالضبط في هذا الوقت.", "ru": "Велосипед проехал ровно 15 км за это время.", "en": "The bike covered exactly 15 km in that time."}],0,{"he": "שימו לב מה מסומן על הציר האנכי של הגרף.", "ar": "انتبهوا لما هو مكتوب على المحور العمودي للرسم.", "ru": "Обратите внимание, что отложено по вертикальной оси.", "en": "Notice what the vertical axis of the graph shows."},{"he": "בגרף מהירות–זמן, הגובה של הקו הוא המהירות. קו אופקי אומר שהמהירות לא משתנה, ולכן אין תאוצה. למשל רכב עם בקרת שיוט בכביש מהיר נותן קו אופקי כזה.", "ar": "في رسم السرعة–الزمن ارتفاع الخطّ هو السرعة. الخطّ الأفقي يعني أن السرعة لا تتغيّر، فلا يوجد تسارع. مثلًا سيارة تعمل بمثبّت السرعة على طريق سريع تعطي خطًّا أفقيًا كهذا.", "ru": "На графике скорость–время высота линии — это скорость. Горизонтальная линия значит, что скорость не меняется и ускорения нет. Например, машина с круиз-контролем на шоссе даёт такую горизонтальную линию.", "en": "On a speed–time graph, the line's height is the speed. A horizontal line means the speed does not change, so there is no acceleration. For example, a car on cruise control on a highway gives a horizontal line like this."},null,[null, {"he": "עמידה במקום הייתה נראית כקו בגובה אפס, ולא בגובה 15.", "ar": "التوقّف يظهر كخطّ عند الصفر، لا عند 15.", "ru": "Остановка выглядела бы как линия на нуле, а не на 15.", "en": "Standing still would show as a line at zero, not at 15."}, {"he": "בהאצה הקו היה עולה, וכאן הקו אופקי.", "ar": "عند التسارع يرتفع الخطّ، وهنا الخطّ أفقي.", "ru": "При разгоне линия шла бы вверх, а здесь она горизонтальна.", "en": "When speeding up the line would rise, and here it is flat."}, {"he": "15 היא מהירות בקמ״ש, ובארבע דקות עוברים בה רק ק״מ אחד.", "ar": "15 هي سرعة بالكم/س، وفي أربع دقائق تُقطع بها كيلومتر واحد فقط.", "ru": "15 — это скорость в км/ч, и за 4 минуты с ней проезжают лишь 1 км.", "en": "15 is a speed in km/h, and in 4 minutes it covers only 1 km."}]),
  Q("fm-2-04",{"he": "עגלה שמסתה 50 ק״ג נדחפת בכוח של 100 ניוטון. נניח שאין חיכוך. מה התאוצה שלה?", "ar": "عربة كتلتها 50 كغ تُدفع بقوة 100 نيوتن. لنفترض أنه لا يوجد احتكاك. ما تسارعها؟", "ru": "Тележку массой 50 кг толкают с силой 100 ньютонов. Пусть трения нет. Каково её ускорение?", "en": "A cart with a mass of 50 kg is pushed with a force of 100 newtons. Assume there is no friction. What is its acceleration?"},[{"he": "5,000 מטר לשנייה בריבוע", "ar": "5,000 متر لكل ثانية تربيع", "ru": "5000 метров в секунду в квадрате", "en": "5,000 meters per second squared"}, {"he": "2 מטר לשנייה בריבוע", "ar": "2 متر لكل ثانية تربيع", "ru": "2 метра в секунду в квадрате", "en": "2 meters per second squared"}, {"he": "0.5 מטר לשנייה בריבוע", "ar": "0.5 متر لكل ثانية تربيع", "ru": "0,5 метра в секунду в квадрате", "en": "0.5 meters per second squared"}, {"he": "150 מטר לשנייה בריבוע", "ar": "150 متر لكل ثانية تربيع", "ru": "150 метров в секунду в квадрате", "en": "150 meters per second squared"}],1,{"he": "היזכרו בחוק השני של ניוטון: איך קשורים כוח, מסה ותאוצה?", "ar": "تذكّروا قانون نيوتن الثاني: كيف ترتبط القوة والكتلة والتسارع؟", "ru": "Вспомните второй закон Ньютона: как связаны сила, масса и ускорение?", "en": "Recall Newton's second law: how are force, mass and acceleration related?"},{"he": "לפי החוק השני, התאוצה היא הכוח חלקי המסה: 100 חלקי 50. התוצאה היא תוספת של 2 מטר לשנייה בכל שנייה. למשל אם דוחפים באותו כוח עגלה כבדה פי 2, התאוצה קטנה פי 2.", "ar": "حسب القانون الثاني، التسارع هو القوة مقسومة على الكتلة: 100 على 50. النتيجة زيادة 2 متر في الثانية كل ثانية. مثلًا إذا دفعنا بالقوة نفسها عربة أثقل بمرّتين يصغر التسارع إلى النصف.", "ru": "По второму закону ускорение — это сила, делённая на массу: 100 на 50. Получается прибавка 2 м/с каждую секунду. Например, если той же силой толкать вдвое более тяжёлую тележку, ускорение станет вдвое меньше.", "en": "By the second law, acceleration is force divided by mass: 100 divided by 50. The result is 2 m/s gained every second. For example, pushing a cart twice as heavy with the same force halves the acceleration."},null,[{"he": "כאן כפלו כוח במסה, אבל צריך לחלק את הכוח במסה.", "ar": "هنا ضُربت القوة في الكتلة، والصحيح قسمة القوة على الكتلة.", "ru": "Здесь силу умножили на массу, а нужно делить силу на массу.", "en": "Here force was multiplied by mass, but you must divide force by mass."}, null, {"he": "כאן חילקו מסה בכוח, וזה החישוב ההפוך.", "ar": "هنا قُسمت الكتلة على القوة، وهذا الحساب المعكوس.", "ru": "Здесь массу разделили на силу — это обратный расчёт.", "en": "Here mass was divided by force, which is the reverse calculation."}, {"he": "כאן חיברו כוח ומסה, אבל אי אפשר לחבר גדלים מסוגים שונים.", "ar": "هنا جُمعت القوة والكتلة، ولا يمكن جمع مقادير من أنواع مختلفة.", "ru": "Здесь сложили силу и массу, а величины разного рода не складывают.", "en": "Here force and mass were added, but quantities of different kinds cannot be added."}]),
  Q("fm-2-05",{"he": "ארגז שוקל 600 ניוטון על כדור הארץ, שבו כל ק״ג שוקל כ-10 ניוטון. בירח הכבידה חלשה פי 6. מה נכון לגבי הארגז על הירח?", "ar": "صندوق يزن 600 نيوتن على الأرض، حيث يزن كل كغ نحو 10 نيوتن. جاذبية القمر أضعف بـ6 مرات. ما الصحيح بشأن الصندوق على القمر؟", "ru": "Ящик весит 600 ньютонов на Земле, где каждый килограмм весит около 10 ньютонов. На Луне тяготение в 6 раз слабее. Что верно для ящика на Луне?", "en": "A crate weighs 600 newtons on Earth, where each kg weighs about 10 newtons. Gravity on the Moon is 6 times weaker. What is true for the crate on the Moon?"},[{"he": "משקל 600 ניוטון, מסה 10 ק״ג", "ar": "الوزن 600 نيوتن، والكتلة 10 كغ", "ru": "Вес 600 Н, масса 10 кг", "en": "Weight 600 N, mass 10 kg"}, {"he": "משקל 3,600 ניוטון, מסה 60 ק״ג", "ar": "الوزن 3,600 نيوتن، والكتلة 60 كغ", "ru": "Вес 3600 Н, масса 60 кг", "en": "Weight 3,600 N, mass 60 kg"}, {"he": "משקל 100 ניוטון, מסה 60 ק״ג", "ar": "الوزن 100 نيوتن، والكتلة 60 كغ", "ru": "Вес 100 Н, масса 60 кг", "en": "Weight 100 N, mass 60 kg"}, {"he": "משקל 100 ניוטון, מסה 10 ק״ג", "ar": "الوزن 100 نيوتن، والكتلة 10 كغ", "ru": "Вес 100 Н, масса 10 кг", "en": "Weight 100 N, mass 10 kg"}],2,{"he": "חשבו קודם את המסה על כדור הארץ, ושאלו אם היא תלויה במקום.", "ar": "احسبوا الكتلة على الأرض أولًا، واسألوا هل تتعلّق بالمكان.", "ru": "Сначала найдите массу на Земле и спросите себя, зависит ли она от места.", "en": "First work out the mass on Earth, and ask whether it depends on the place."},{"he": "המסה היא 600 חלקי 10, כלומר 60 ק״ג, והיא זהה בכל מקום. המשקל תלוי בכבידה, ולכן בירח הוא קטן פי 6: 100 ניוטון. למשל אותה מזוודה מרגישה קלה מאוד על הירח, אבל קשה לעצור אותה באותה מידה.", "ar": "الكتلة 600 على 10، أي 60 كغ، وهي نفسها في كل مكان. الوزن يتعلّق بالجاذبية، لذلك يكون على القمر أصغر بـ6 مرات: 100 نيوتن. مثلًا الحقيبة نفسها تبدو خفيفة جدًا على القمر، لكن إيقافها صعب بالقدر نفسه.", "ru": "Масса — это 600 разделить на 10, то есть 60 кг, и она одинакова везде. Вес зависит от тяготения, поэтому на Луне он в 6 раз меньше: 100 Н. Например, тот же чемодан на Луне кажется очень лёгким, но остановить его так же трудно.", "en": "The mass is 600 divided by 10, which is 60 kg, and it is the same everywhere. Weight depends on gravity, so on the Moon it is 6 times smaller: 100 N. For example, the same suitcase feels very light on the Moon, but it is just as hard to stop."},null,[{"he": "המשקל חייב לקטון בירח, והמסה היא 60 ק״ג ולא 10.", "ar": "الوزن يجب أن يقلّ على القمر، والكتلة 60 كغ لا 10.", "ru": "Вес на Луне должен уменьшиться, а масса — 60 кг, а не 10.", "en": "The weight must drop on the Moon, and the mass is 60 kg, not 10."}, {"he": "כאן כפלו ב-6, אבל בירח הכבידה חלשה יותר, ולא חזקה.", "ar": "هنا ضُرب في 6، لكن جاذبية القمر أضعف لا أقوى.", "ru": "Здесь умножили на 6, но на Луне тяготение слабее, а не сильнее.", "en": "Here it was multiplied by 6, but the Moon's gravity is weaker, not stronger."}, null, {"he": "המשקל נכון, אבל המסה לא קטנה; היא נשארת 60 ק״ג.", "ar": "الوزن صحيح، لكن الكتلة لا تقلّ؛ تبقى 60 كغ.", "ru": "Вес верен, но масса не уменьшается: она остаётся 60 кг.", "en": "The weight is right, but the mass does not shrink; it stays 60 kg."}]),
  Q("fm-2-06",{"he": "אדם שוקל 600 ניוטון. כשהוא עומד על שתי רגליים, שטח המגע עם הרצפה הוא 400 סמ״ר. מה יקרה ללחץ על הרצפה כשיעמוד על רגל אחת?", "ar": "رجل وزنه 600 نيوتن. عندما يقف على قدمين تكون مساحة التلامس مع الأرضية 400 سم مربع. ماذا يحدث للضغط على الأرضية إذا وقف على قدم واحدة؟", "ru": "Человек весит 600 Н. Когда он стоит на двух ногах, площадь опоры на пол 400 квадратных сантиметров. Что будет с давлением на пол, если он встанет на одну ногу?", "en": "A man weighs 600 N. Standing on two feet, his contact area with the floor is 400 square centimeters. What happens to the pressure on the floor if he stands on one foot?"},[{"he": "הלחץ יקטן פי 2, כי השטח קטן.", "ar": "يقلّ الضغط إلى النصف لأن المساحة صغرت.", "ru": "Давление уменьшится вдвое, ведь площадь меньше.", "en": "The pressure halves, because the area is smaller."}, {"he": "הלחץ לא ישתנה, כי המשקל של האדם נשאר אותו דבר.", "ar": "لا يتغيّر الضغط لأن وزن الرجل بقي كما هو.", "ru": "Давление не изменится, ведь вес человека остался прежним.", "en": "The pressure stays the same, because the man's weight is unchanged."}, {"he": "הלחץ יגדל פי 4, כי עכשיו רגל אחת נושאת את כל המשקל.", "ar": "يزداد الضغط 4 مرات لأن قدمًا واحدة تحمل الآن كل الوزن.", "ru": "Давление вырастет в 4 раза, ведь теперь одна нога несёт весь вес.", "en": "The pressure grows 4 times, because one foot now carries all the weight."}, {"he": "הלחץ יגדל פי 2, כי אותו כוח פועל על חצי שטח.", "ar": "يتضاعف الضغط لأن القوة نفسها تؤثّر في نصف المساحة.", "ru": "Давление вырастет вдвое: та же сила на половине площади.", "en": "The pressure doubles, as the same force acts on half the area."}],3,{"he": "לחץ הוא כוח שמתחלק על שטח. מה משתנה כאן, ומה נשאר?", "ar": "الضغط قوة موزّعة على مساحة. ما الذي يتغيّر هنا وما الذي يبقى؟", "ru": "Давление — это сила, распределённая по площади. Что здесь меняется, а что нет?", "en": "Pressure is force spread over an area. What changes here, and what stays?"},{"he": "הכוח נשאר 600 ניוטון, והשטח יורד מ-400 ל-200 סמ״ר. כשמחלקים אותו כוח בשטח קטן פי 2, הלחץ גדל פי 2. למשל עקב דק של נעל משאיר שקעים ברצפת עץ, ונעל שטוחה לא.", "ar": "تبقى القوة 600 نيوتن، وتنخفض المساحة من 400 إلى 200 سم مربع. عند قسمة القوة نفسها على مساحة أصغر بمرّتين يتضاعف الضغط. مثلًا الكعب الرفيع يترك علامات على أرضية الخشب، والحذاء المسطّح لا يتركها.", "ru": "Сила остаётся 600 Н, а площадь падает с 400 до 200 квадратных сантиметров. Если ту же силу делить на вдвое меньшую площадь, давление растёт вдвое. Например, тонкий каблук оставляет вмятины на деревянном полу, а плоская обувь — нет.", "en": "The force stays 600 N, and the area drops from 400 to 200 square centimeters. Dividing the same force by half the area doubles the pressure. For example, a thin heel leaves dents in a wooden floor, while a flat shoe does not."},null,[{"he": "שטח קטן יותר מגדיל את הלחץ, ולא מקטין אותו.", "ar": "المساحة الأصغر تزيد الضغط ولا تُنقصه.", "ru": "Меньшая площадь увеличивает давление, а не уменьшает.", "en": "A smaller area raises the pressure; it does not lower it."}, {"he": "המשקל אותו דבר, אבל השטח קטן, ולכן הלחץ משתנה.", "ar": "الوزن نفسه، لكن المساحة صغرت، لذلك يتغيّر الضغط.", "ru": "Вес тот же, но площадь меньше, поэтому давление меняется.", "en": "The weight is the same, but the area is smaller, so the pressure changes."}, {"he": "השטח קטן פי 2 ולא פי 4, ולכן הלחץ גדל רק פי 2.", "ar": "المساحة صغرت مرّتين لا 4 مرات، لذلك يتضاعف الضغط فقط.", "ru": "Площадь уменьшилась в 2 раза, а не в 4, поэтому давление выросло лишь вдвое.", "en": "The area halved rather than shrinking 4 times, so the pressure only doubles."}, null]),
  Q("fm-2-07",{"he": "נהג נוסע ב-72 קמ״ש, כלומר 20 מטר בשנייה. זמן התגובה שלו שנייה אחת, ועם טלפון ביד 2 שניות. כמה מטר יעבור הרכב לפני תחילת הבלימה, בלי טלפון ועם טלפון?", "ar": "سائق يسير بسرعة 72 كم/س، أي 20 مترًا في الثانية. زمن ردّ فعله ثانية واحدة، ومع هاتف في يده ثانيتان. كم مترًا تقطع السيارة قبل بدء الكبح، دون هاتف ومع هاتف؟", "ru": "Водитель едет со скоростью 72 км/ч, это 20 метров в секунду. Его время реакции — 1 секунда, а с телефоном в руке — 2 секунды. Сколько метров проедет машина до начала торможения без телефона и с ним?", "en": "A driver goes 72 km/h, which is 20 meters per second. His reaction time is 1 second, and 2 seconds with a phone in hand. How many meters does the car travel before braking starts, without and with the phone?"},[{"he": "20 מטר בלי טלפון, ו-40 מטר עם טלפון.", "ar": "20 مترًا دون هاتف، و40 مترًا مع الهاتف.", "ru": "20 метров без телефона и 40 метров с телефоном.", "en": "20 meters without a phone, and 40 meters with one."}, {"he": "72 מטר בלי טלפון, ו-144 מטר עם טלפון.", "ar": "72 مترًا دون هاتف، و144 مترًا مع الهاتف.", "ru": "72 метра без телефона и 144 метра с телефоном.", "en": "72 meters without a phone, and 144 meters with one."}, {"he": "20 מטר בשני המקרים, כי המהירות זהה.", "ar": "20 مترًا في الحالتين، لأن السرعة نفسها.", "ru": "20 метров в обоих случаях, ведь скорость та же.", "en": "20 meters in both cases, because the speed is the same."}, {"he": "10 מטר בלי טלפון, ו-20 מטר עם טלפון.", "ar": "10 أمتار دون هاتف، و20 مترًا مع الهاتف.", "ru": "10 метров без телефона и 20 метров с телефоном.", "en": "10 meters without a phone, and 20 meters with one."}],0,{"he": "בזמן התגובה הרכב עדיין נוסע במהירות המלאה.", "ar": "خلال زمن ردّ الفعل تظلّ السيارة تسير بسرعتها الكاملة.", "ru": "За время реакции машина ещё едет с полной скоростью.", "en": "During the reaction time the car is still moving at full speed."},{"he": "בזמן התגובה הרכב לא מאט. ב-20 מטר בכל שנייה, שנייה אחת נותנת 20 מטר ו-2 שניות נותנות 40 מטר. למשל הצצה קצרה בהודעה מוסיפה עשרות מטרים של נסיעה בלי לראות את הכביש.", "ar": "خلال زمن ردّ الفعل لا تتباطأ السيارة. بسرعة 20 مترًا في الثانية، تعطي ثانية واحدة 20 مترًا وتعطي ثانيتان 40 مترًا. مثلًا نظرة قصيرة إلى رسالة تضيف عشرات الأمتار من القيادة دون رؤية الطريق.", "ru": "За время реакции машина не замедляется. При 20 метрах в секунду 1 секунда даёт 20 метров, а 2 секунды — 40 метров. Например, короткий взгляд на сообщение добавляет десятки метров езды, не глядя на дорогу.", "en": "During the reaction time the car does not slow down. At 20 meters each second, 1 second gives 20 meters and 2 seconds give 40 meters. For example, a quick glance at a message adds tens of meters of driving without seeing the road."},null,[null, {"he": "72 היא המהירות בקמ״ש, ובשנייה הרכב עובר רק 20 מטר.", "ar": "72 هي السرعة بالكم/س، وفي الثانية تقطع السيارة 20 مترًا فقط.", "ru": "72 — это скорость в км/ч, а за секунду машина проезжает лишь 20 метров.", "en": "72 is the speed in km/h, and in one second the car covers only 20 meters."}, {"he": "זמן תגובה ארוך פי 2 מוסיף דרך, גם כשהמהירות זהה.", "ar": "زمن ردّ فعل أطول بمرّتين يضيف مسافة حتى مع السرعة نفسها.", "ru": "Вдвое большее время реакции добавляет путь и при той же скорости.", "en": "A reaction time twice as long adds distance, even at the same speed."}, {"he": "כאן חילקו ב-2, אבל בשנייה אחת הרכב עובר 20 מטר שלמים.", "ar": "هنا قُسم على 2، لكن السيارة تقطع 20 مترًا كاملة في ثانية واحدة.", "ru": "Здесь разделили на 2, но за 1 секунду машина проходит целых 20 метров.", "en": "Here it was halved, but in one second the car covers a full 20 meters."}]),
  Q("fm-2-08",{"he": "תלמיד תלה משקולות על קפיץ ומדד: 1 ניוטון מאריך אותו ב-2 ס״מ, 2 ניוטון ב-4 ס״מ, 3 ניוטון ב-6 ס״מ. בכמה יתארך הקפיץ בכוח של 5 ניוטון?", "ar": "علّق طالب أثقالًا على نابض وقاس: 1 نيوتن يطيله 2 سم، و2 نيوتن 4 سم، و3 نيوتن 6 سم. كم سيطول النابض بقوة 5 نيوتن؟", "ru": "Ученик подвешивал грузы на пружину и измерил: 1 Н растягивает её на 2 см, 2 Н — на 4 см, 3 Н — на 6 см. На сколько растянется пружина при силе 5 Н?", "en": "A student hung weights on a spring and measured: 1 N stretches it 2 cm, 2 N stretches it 4 cm, 3 N stretches it 6 cm. How much will it stretch with a force of 5 N?"},[{"he": "7 ס״מ", "ar": "7 سم", "ru": "7 см", "en": "7 cm"}, {"he": "10 ס״מ", "ar": "10 سم", "ru": "10 см", "en": "10 cm"}, {"he": "8 ס״מ", "ar": "8 سم", "ru": "8 см", "en": "8 cm"}, {"he": "25 ס״מ", "ar": "25 سم", "ru": "25 см", "en": "25 cm"}],1,{"he": "בדקו כמה סנטימטרים מוסיף כל ניוטון.", "ar": "تحقّقوا كم سنتيمترًا يضيف كل نيوتن.", "ru": "Проверьте, сколько сантиметров добавляет каждый ньютон.", "en": "Check how many centimeters each newton adds."},{"he": "בכל המדידות ההתארכות היא 2 ס״מ לכל ניוטון. לכן 5 ניוטון יאריכו את הקפיץ ב-10 ס״מ. למשל מאזני קפיץ במכולת עובדים על אותו עיקרון.", "ar": "في كل القياسات الاستطالة 2 سم لكل نيوتن. لذلك 5 نيوتن تُطيل النابض 10 سم. مثلًا ميزان النابض في البقالة يعمل على المبدأ نفسه.", "ru": "Во всех измерениях удлинение — 2 см на каждый ньютон. Поэтому 5 Н растянут пружину на 10 см. Например, пружинные весы в лавке работают по тому же принципу.", "en": "In every measurement the stretch is 2 cm per newton. So 5 N will stretch the spring by 10 cm. For example, the spring scale at the grocery works on the same principle."},null,[{"he": "כאן הוסיפו 2 ל-5, אבל כל ניוטון מוסיף 2 ס״מ.", "ar": "هنا أُضيف 2 إلى 5، لكن كل نيوتن يضيف 2 سم.", "ru": "Здесь прибавили 2 к 5, но каждый ньютон добавляет 2 см.", "en": "Here 2 was added to 5, but each newton adds 2 cm."}, null, {"he": "8 ס״מ מתאים לכוח של 4 ניוטון, ולא של 5.", "ar": "8 سم تناسب قوة 4 نيوتن، لا 5.", "ru": "8 см соответствует силе 4 Н, а не 5.", "en": "8 cm matches a force of 4 N, not 5."}, {"he": "כאן כפלו 5 ב-5, אבל ההתארכות גדלה ב-2 ס״מ לכל ניוטון.", "ar": "هنا ضُرب 5 في 5، لكن الاستطالة تزيد 2 سم لكل نيوتن.", "ru": "Здесь умножили 5 на 5, а удлинение растёт на 2 см на ньютон.", "en": "Here 5 was multiplied by 5, but the stretch grows 2 cm per newton."}]),
  Q("fm-2-09",{"he": "על נדנדה, ילד של 30 ק״ג יושב 2 מטר מהציר. באיזה מרחק מהציר צריכה לשבת ילדה של 40 ק״ג בצד השני, כדי שהנדנדה תתאזן?", "ar": "على أرجوحة يجلس طفل كتلته 30 كغ على بُعد 2 متر من المحور. على أي بُعد يجب أن تجلس طفلة كتلتها 40 كغ في الجهة الأخرى لتتوازن الأرجوحة؟", "ru": "На качелях-балансире мальчик массой 30 кг сидит в 2 метрах от оси. На каком расстоянии от оси должна сесть девочка массой 40 кг с другой стороны, чтобы качели уравновесились?", "en": "On a seesaw, a 30 kg boy sits 2 meters from the pivot. How far from the pivot must a 40 kg girl sit on the other side to balance it?"},[{"he": "2 מטר, כמו הילד", "ar": "2 متر، مثل الطفل", "ru": "2 метра, как мальчик", "en": "2 meters, like the boy"}, {"he": "בערך 2.7 מטר", "ar": "نحو 2.7 متر", "ru": "Около 2,7 метра", "en": "About 2.7 meters"}, {"he": "1.5 מטר", "ar": "1.5 متر", "ru": "1,5 метра", "en": "1.5 meters"}, {"he": "1 מטר", "ar": "متر واحد", "ru": "1 метр", "en": "1 meter"}],2,{"he": "בנדנדה מאוזנת, המסה כפול המרחק שווה בשני הצדדים.", "ar": "في الأرجوحة المتوازنة، الكتلة في البُعد متساوية في الجهتين.", "ru": "На уравновешенных качелях масса, умноженная на расстояние, одинакова с обеих сторон.", "en": "On a balanced seesaw, mass times distance is equal on both sides."},{"he": "בצד של הילד: 30 כפול 2 הם 60. הילדה צריכה גם היא 60, ולכן המרחק שלה הוא 60 חלקי 40, כלומר 1.5 מטר. למשל הורה שמשחק עם ילד קטן יושב קרוב לציר.", "ar": "في جهة الطفل: 30 في 2 يساوي 60. تحتاج الطفلة أيضًا إلى 60، لذلك بُعدها 60 على 40، أي 1.5 متر. مثلًا الأب الذي يلعب مع طفل صغير يجلس قريبًا من المحور.", "ru": "Со стороны мальчика: 30 умножить на 2 — это 60. Девочке тоже нужно 60, поэтому её расстояние — 60 разделить на 40, то есть 1,5 метра. Например, взрослый, играющий с малышом, садится ближе к оси.", "en": "On the boy's side: 30 times 2 makes 60. The girl also needs 60, so her distance is 60 divided by 40, which is 1.5 meters. For example, a parent playing with a small child sits close to the pivot."},null,[{"he": "הילדה כבדה יותר, ולכן במרחק שווה הצד שלה ירד.", "ar": "الطفلة أثقل، لذلك في البُعد نفسه تنخفض جهتها.", "ru": "Девочка тяжелее, поэтому на том же расстоянии её сторона опустится.", "en": "The girl is heavier, so at the same distance her side would go down."}, {"he": "הכבד צריך לשבת קרוב יותר לציר, ולא רחוק יותר.", "ar": "الأثقل يجب أن يجلس أقرب إلى المحور، لا أبعد.", "ru": "Тяжёлый должен сидеть ближе к оси, а не дальше.", "en": "The heavier child must sit closer to the pivot, not farther."}, null, {"he": "במטר אחד הצד שלה קל מדי, כי 40 קטן מ-60.", "ar": "على بُعد متر واحد تكون جهتها خفيفة جدًا، لأن 40 أقلّ من 60.", "ru": "На 1 метре её сторона будет слишком лёгкой, ведь 40 меньше 60.", "en": "At 1 meter her side is too light, because 40 is less than 60."}]),
  Q("fm-2-10",{"he": "אותה קופסה נדחפה באותה מהירות על שלושה משטחים, ונמדד המרחק עד שעצרה: שטיח 0.5 מטר, עץ 1.2 מטר, אריחים 2.4 מטר. מה אפשר להסיק?", "ar": "دُفع الصندوق نفسه بالسرعة نفسها على ثلاثة أسطح، وقيست المسافة حتى توقّف: سجّاد 0.5 م، خشب 1.2 م، بلاط 2.4 م. ماذا يمكن أن نستنتج؟", "ru": "Одну и ту же коробку толкали с одинаковой скоростью по трём поверхностям и измеряли путь до остановки: ковёр 0,5 м, дерево 1,2 м, плитка 2,4 м. Какой вывод можно сделать?", "en": "The same box was pushed at the same speed on three surfaces, and the distance until it stopped was measured: carpet 0.5 m, wood 1.2 m, tiles 2.4 m. What can be concluded?"},[{"he": "על השטיח החיכוך הכי קטן, כי עליו הקופסה עצרה הכי מהר.", "ar": "على السجّاد الاحتكاك الأصغر لأن الصندوق توقّف عليه بأسرع وقت.", "ru": "На ковре трение наименьшее, ведь на нём коробка остановилась быстрее всего.", "en": "The carpet has the least friction, because the box stopped there the fastest."}, {"he": "החיכוך זהה בכל המשטחים, כי זו אותה קופסה.", "ar": "الاحتكاك متساوٍ على كل الأسطح لأنه الصندوق نفسه.", "ru": "Трение везде одинаково, ведь коробка та же.", "en": "Friction is the same on all surfaces, because it is the same box."}, {"he": "על העץ המהירות ההתחלתית הייתה גבוהה יותר מאשר בשאר.", "ar": "على الخشب كانت السرعة الابتدائية أعلى من غيره.", "ru": "На дереве начальная скорость была выше, чем на других.", "en": "On wood the starting speed was higher than on the others."}, {"he": "על האריחים החיכוך הכי קטן, כי הקופסה הגיעה הכי רחוק.", "ar": "على البلاط الاحتكاك الأصغر لأن الصندوق وصل إلى أبعد مسافة.", "ru": "На плитке трение наименьшее: коробка уехала дальше всех.", "en": "The tiles have the least friction, as the box went farthest."}],3,{"he": "חיכוך גדול עוצר גוף מהר או לאט?", "ar": "هل يوقف الاحتكاك الكبير الجسم بسرعة أم ببطء؟", "ru": "Большое трение останавливает тело быстро или медленно?", "en": "Does large friction stop a body quickly or slowly?"},{"he": "החיכוך הוא הכוח שעוצר את הקופסה. ככל שהוא קטן יותר, הקופסה ממשיכה רחוק יותר, ולכן באריחים, עם 2.4 מטר, החיכוך הוא הקטן ביותר. למשל כדור מתגלגל רחוק יותר על מגרש בטון מאשר על דשא.", "ar": "الاحتكاك هو القوة التي توقف الصندوق. كلما كان أصغر واصل الصندوق مسافة أبعد، لذلك على البلاط، مع 2.4 م، يكون الاحتكاك الأصغر. مثلًا تتدحرج الكرة أبعد على ملعب إسمنتي منها على العشب.", "ru": "Трение — это сила, которая останавливает коробку. Чем оно меньше, тем дальше едет коробка, поэтому на плитке, где 2,4 м, трение наименьшее. Например, мяч катится дальше по бетонной площадке, чем по траве.", "en": "Friction is the force that stops the box. The smaller it is, the farther the box goes, so on tiles, with 2.4 m, friction is the smallest. For example, a ball rolls farther on a concrete court than on grass."},null,[{"he": "עצירה מהירה מראה על חיכוך גדול, ולכן בשטיח החיכוך הכי גדול.", "ar": "التوقّف السريع يدلّ على احتكاك كبير، فعلى السجّاد الاحتكاك الأكبر.", "ru": "Быстрая остановка говорит о большом трении, значит, на ковре оно наибольшее.", "en": "A quick stop shows large friction, so the carpet has the most friction."}, {"he": "אם החיכוך היה זהה, המרחקים היו שווים, והם שונים מאוד.", "ar": "لو كان الاحتكاك متساويًا لتساوت المسافات، وهي مختلفة جدًا.", "ru": "Если бы трение было одинаковым, пути были бы равны, а они сильно различаются.", "en": "If friction were equal, the distances would match, and they differ a lot."}, {"he": "בשאלה כתוב שהמהירות ההתחלתית הייתה זהה בכל הניסויים.", "ar": "في السؤال مكتوب أن السرعة الابتدائية كانت متساوية في كل التجارب.", "ru": "В условии сказано, что начальная скорость везде была одинаковой.", "en": "The question says the starting speed was the same in every trial."}, null]),
  Q("fm-2-11",{"he": "לחפץ יש מסה של 300 גרם ונפח של 400 סמ״ק. סמ״ק אחד של מים שוקל 1 גרם. מה יקרה לחפץ במים?", "ar": "جسم كتلته 300 غرام وحجمه 400 سم مكعب. سم مكعب واحد من الماء كتلته 1 غرام. ماذا يحدث للجسم في الماء؟", "ru": "Предмет имеет массу 300 граммов и объём 400 кубических сантиметров. 1 кубический сантиметр воды имеет массу 1 грамм. Что будет с предметом в воде?", "en": "An object has a mass of 300 grams and a volume of 400 cubic centimeters. 1 cubic centimeter of water has a mass of 1 gram. What will happen to the object in water?"},[{"he": "הוא יצוף, כי בכל סמ״ק שלו יש פחות מ-1 גרם.", "ar": "سيطفو، لأن في كل سم مكعب منه أقلّ من 1 غرام.", "ru": "Он будет плавать: в каждом его кубическом сантиметре меньше 1 грамма.", "en": "It floats, because each cubic centimeter of it has less than 1 gram."}, {"he": "הוא ישקע, כי 300 גרם זה משקל כבד.", "ar": "سيغرق، لأن 300 غرام وزن ثقيل.", "ru": "Он утонет, ведь 300 граммов — это тяжело.", "en": "It sinks, because 300 grams is heavy."}, {"he": "הוא ישקע, כי הנפח שלו גדול מהמסה.", "ar": "سيغرق، لأن حجمه أكبر من كتلته.", "ru": "Он утонет, потому что объём больше массы.", "en": "It sinks, because its volume is bigger than its mass."}, {"he": "הוא ירחף באמצע המים, כי המסה והנפח קרובים זה לזה.", "ar": "سيبقى معلّقًا وسط الماء لأن الكتلة والحجم متقاربان.", "ru": "Он зависнет посреди воды, ведь масса и объём близки.", "en": "It hovers mid-water, because its mass and volume are close."}],0,{"he": "חשבו כמה גרם יש בכל סמ״ק של החפץ, והשוו למים.", "ar": "احسبوا كم غرامًا في كل سم مكعب من الجسم، وقارنوا بالماء.", "ru": "Посчитайте, сколько граммов в каждом кубическом сантиметре предмета, и сравните с водой.", "en": "Work out how many grams are in each cubic centimeter of the object, and compare with water."},{"he": "הצפיפות של החפץ היא 300 חלקי 400, כלומר 0.75 גרם לסמ״ק. זה פחות מהצפיפות של המים, ולכן הוא יצוף, וחלק ממנו יבלוט מעל המים. למשל צפיפות הקרח היא כ-0.9, ולכן קרחונים צפים, ורובם מתחת למים.", "ar": "كثافة الجسم 300 على 400، أي 0.75 غرام لكل سم مكعب. هذا أقلّ من كثافة الماء، لذلك يطفو ويبرز جزء منه فوق الماء. مثلًا كثافة الجليد نحو 0.9، لذلك تطفو الجبال الجليدية ومعظمها تحت الماء.", "ru": "Плотность предмета — 300 разделить на 400, то есть 0,75 грамма на кубический сантиметр. Это меньше плотности воды, поэтому он плавает, и часть его выступает над водой. Например, плотность льда около 0,9, поэтому айсберги плавают, а большая их часть под водой.", "en": "The object's density is 300 divided by 400, which is 0.75 grams per cubic centimeter. That is less than water's density, so it floats with part of it above the water. For example, ice has a density of about 0.9, so icebergs float with most of their bulk underwater."},null,[null, {"he": "מה שקובע הוא המסה ביחס לנפח, ולא המסה לבדה.", "ar": "ما يحدّد هو الكتلة نسبةً إلى الحجم، لا الكتلة وحدها.", "ru": "Решает масса по отношению к объёму, а не масса сама по себе.", "en": "What matters is mass compared with volume, not mass alone."}, {"he": "נפח גדול ביחס למסה פירושו צפיפות קטנה, וזה גורם לציפה.", "ar": "الحجم الكبير مقارنة بالكتلة يعني كثافة صغيرة، وهذا يجعله يطفو.", "ru": "Большой объём при той же массе — это малая плотность, и тело плавает.", "en": "A large volume for its mass means low density, which makes it float."}, {"he": "ריחוף באמצע קורה רק כשהצפיפות שווה בדיוק לזו של המים.", "ar": "التعلّق في الوسط يحدث فقط إذا تساوت الكثافة تمامًا مع كثافة الماء.", "ru": "Зависание бывает только при плотности, точно равной плотности воды.", "en": "Hovering happens only when the density exactly matches water's."}]),
  Q("fm-2-12",{"he": "בגרף מרחק–זמן של מכונית, הקו מתחיל כמעט שטוח ונעשה תלול יותר ויותר. מה זה אומר על התנועה?", "ar": "في رسم المسافة–الزمن لسيارة يبدأ الخطّ شبه مسطّح ويصبح أشدّ انحدارًا شيئًا فشيئًا. ماذا يعني ذلك عن الحركة؟", "ru": "На графике путь–время для машины линия сначала почти пологая, а потом становится всё круче. Что это говорит о движении?", "en": "On a car's distance–time graph, the line starts almost flat and gets steeper and steeper. What does that say about the motion?"},[{"he": "המכונית מאטה, כי הקו מתעקם ואינו ישר.", "ar": "السيارة تتباطأ لأن الخطّ ينحني وليس مستقيمًا.", "ru": "Машина тормозит, ведь линия изгибается, а не прямая.", "en": "The car is slowing, because the line bends instead of being straight."}, {"he": "המכונית מאיצה, כי בכל שנייה היא עוברת יותר דרך.", "ar": "السيارة تتسارع، لأنها تقطع مسافة أكبر كل ثانية.", "ru": "Машина разгоняется: каждую секунду она проезжает больше.", "en": "The car is speeding up, since it covers more ground each second."}, {"he": "המכונית נוסעת במהירות קבועה, כי הקו עולה כל הזמן.", "ar": "تسير السيارة بسرعة ثابتة لأن الخطّ يرتفع دائمًا.", "ru": "Машина едет с постоянной скоростью, ведь линия всё время растёт.", "en": "The car moves at a constant speed, because the line keeps rising."}, {"he": "המכונית מטפסת על עלייה, כי הקו עולה למעלה.", "ar": "السيارة تصعد مرتفعًا لأن الخطّ يتّجه إلى أعلى.", "ru": "Машина едет в гору, ведь линия идёт вверх.", "en": "The car is climbing a hill, because the line goes up."}],1,{"he": "מה מראה השיפוע של קו בגרף מרחק–זמן?", "ar": "ماذا يُظهر ميل الخطّ في رسم المسافة–الزمن؟", "ru": "Что показывает наклон линии на графике путь–время?", "en": "What does the slope of a distance–time line show?"},{"he": "בגרף מרחק–זמן, השיפוע הוא המהירות. קו שנעשה תלול יותר מראה שבכל פרק זמן עוברים יותר מרחק, כלומר המהירות עולה. למשל רכב שיוצא מרמזור ירוק נותן קו כזה בשניות הראשונות.", "ar": "في رسم المسافة–الزمن الميل هو السرعة. الخطّ الذي يزداد انحدارًا يعني أن المسافة المقطوعة في كل فترة تزداد، أي أن السرعة ترتفع. مثلًا سيارة تنطلق عند الإشارة الخضراء تعطي خطًّا كهذا في الثواني الأولى.", "ru": "На графике путь–время наклон — это скорость. Линия, которая становится круче, значит, что за каждый промежуток проезжают больше, то есть скорость растёт. Например, машина, трогающаяся на зелёный свет, даёт такую линию в первые секунды.", "en": "On a distance–time graph, the slope is the speed. A line that gets steeper means more distance is covered in each time interval, so the speed is rising. For example, a car pulling away at a green light gives such a line in the first seconds."},null,[{"he": "בהאטה הקו היה נעשה שטוח יותר, ולא תלול יותר.", "ar": "عند التباطؤ يصبح الخطّ أكثر تسطّحًا لا أكثر انحدارًا.", "ru": "При торможении линия становилась бы положе, а не круче.", "en": "When slowing, the line would get flatter, not steeper."}, null, {"he": "במהירות קבועה הקו היה ישר, עם אותו שיפוע לאורך כל הדרך.", "ar": "بالسرعة الثابتة يكون الخطّ مستقيمًا بالميل نفسه طوال الوقت.", "ru": "При постоянной скорости линия была бы прямой с одинаковым наклоном.", "en": "At constant speed the line would be straight with the same slope throughout."}, {"he": "הגרף מראה מרחק מול זמן, ולא את הצורה של הכביש.", "ar": "الرسم يُظهر المسافة مقابل الزمن، لا شكل الطريق.", "ru": "График показывает путь от времени, а не форму дороги.", "en": "The graph shows distance against time, not the shape of the road."}]),
  Q("fm-2-13",{"he": "בניסוי על כביש רטוב, ב-80 קמ״ש: רכב עם צמיגים חדשים עצר אחרי 40 מטר, ועם צמיגים שחוקים אחרי 60 מטר. מה נכון?", "ar": "في تجربة على طريق مبلّل بسرعة 80 كم/س: سيارة بإطارات جديدة توقّفت بعد 40 مترًا، وبإطارات مهترئة بعد 60 مترًا. ما الصحيح؟", "ru": "В опыте на мокрой дороге при 80 км/ч машина с новыми шинами остановилась через 40 метров, а с изношенными — через 60 метров. Что верно?", "en": "In a test on a wet road at 80 km/h, a car with new tires stopped after 40 meters, and with worn tires after 60 meters. What is true?"},[{"he": "עם צמיגים שחוקים הבלימה ארוכה פי 2.", "ar": "مع الإطارات المهترئة الكبح أطول بمرّتين.", "ru": "С изношенными шинами торможение в 2 раза длиннее.", "en": "With worn tires braking is twice as long."}, {"he": "ההבדל של 20 מטר קטן מכדי שתהיה לו משמעות.", "ar": "فرق 20 مترًا صغير جدًا ولا معنى له.", "ru": "Разница в 20 метров слишком мала, чтобы иметь значение.", "en": "A 20-meter difference is too small to matter."}, {"he": "עם צמיגים שחוקים מרחק הבלימה גדל ב-50%.", "ar": "مع الإطارات المهترئة تزيد مسافة الكبح بنسبة 50%.", "ru": "С изношенными шинами тормозной путь растёт на 50%.", "en": "With worn tires the braking distance grows by 50%."}, {"he": "עם צמיגים שחוקים הבלימה ארוכה ב-60%.", "ar": "مع الإطارات المهترئة الكبح أطول بنسبة 60%.", "ru": "С изношенными шинами торможение длиннее на 60%.", "en": "With worn tires braking is 60% longer."}],2,{"he": "חשבו כמה נוסף, ביחס למרחק ההתחלתי.", "ar": "احسبوا كم أُضيف مقارنة بالمسافة الأصلية.", "ru": "Посчитайте, сколько прибавилось относительно исходного пути.", "en": "Work out how much was added compared with the original distance."},{"he": "התוספת היא 20 מטר על 40 מטר, כלומר חצי, שהם 50%. ההבדל נובע מחיכוך קטן יותר בין צמיג שחוק לכביש רטוב. למשל 20 מטר הם בערך אורך של 4 מכוניות, וזה יכול להכריע אם תהיה תאונה.", "ar": "الزيادة 20 مترًا على 40 مترًا، أي النصف، وهو 50%. الفرق ناتج عن احتكاك أقلّ بين الإطار المهترئ والطريق المبلّل. مثلًا 20 مترًا تعادل طول 4 سيارات تقريبًا، وقد تحسم وقوع حادث أو عدمه.", "ru": "Прибавка — 20 метров к 40, то есть половина, или 50%. Разница вызвана меньшим трением изношенной шины о мокрую дорогу. Например, 20 метров — это примерно длина 4 машин, и это может решить, будет ли авария.", "en": "The extra is 20 meters on top of 40, which is half, or 50%. The difference comes from less friction between a worn tire and a wet road. For example, 20 meters is roughly 4 car lengths, which can decide whether a crash happens."},null,[{"he": "פי 2 היה 80 מטר, והמדידה היא 60 מטר.", "ar": "ضعف المسافة يكون 80 مترًا، والقياس 60 مترًا.", "ru": "Вдвое длиннее было бы 80 метров, а измерено 60.", "en": "Twice as long would be 80 meters, and the measurement is 60."}, {"he": "20 מטר הם כמה מכוניות, וזה מספיק כדי לפגוע במי שעומד בדרך.", "ar": "20 مترًا هي طول عدّة سيارات، وهذا يكفي لإصابة من يقف في الطريق.", "ru": "20 метров — это несколько машин, и этого хватит, чтобы сбить пешехода.", "en": "20 meters is several car lengths, enough to hit someone in the way."}, null, {"he": "60 הוא המרחק במטרים, ולא האחוז שבו הוא גדל.", "ar": "60 هي المسافة بالأمتار، لا النسبة المئوية للزيادة.", "ru": "60 — это путь в метрах, а не процент роста.", "en": "60 is the distance in meters, not the percentage it grew by."}]),
  Q("fm-2-14",{"he": "במבחן ריסוק, ראש של בובה נעצר בלי כרית אוויר תוך 0.01 שנייה, ועם כרית תוך 0.05 שנייה. המהירות לפני העצירה זהה. מה קורה לכוח הממוצע על הראש?", "ar": "في اختبار تصادم، توقّف رأس الدمية دون وسادة هوائية خلال 0.01 ثانية، ومع الوسادة خلال 0.05 ثانية. السرعة قبل التوقّف متساوية. ماذا يحدث لمتوسّط القوة على الرأس؟", "ru": "В краш-тесте голова манекена без подушки останавливается за 0,01 секунды, а с подушкой — за 0,05 секунды. Скорость до остановки одинакова. Что происходит со средней силой на голову?", "en": "In a crash test, a dummy's head stops in 0.01 second without an airbag and in 0.05 second with one. The speed before stopping is the same. What happens to the average force on the head?"},[{"he": "הכוח גדל פי 5, כי העצירה ארוכה יותר.", "ar": "تزداد القوة 5 مرات لأن التوقّف أطول.", "ru": "Сила вырастает в 5 раз, ведь остановка дольше.", "en": "The force grows 5 times, because the stop takes longer."}, {"he": "הכוח לא משתנה, כי המהירות זהה.", "ar": "القوة لا تتغيّر لأن السرعة متساوية.", "ru": "Сила не меняется, ведь скорость одинакова.", "en": "The force stays the same, because the speed is equal."}, {"he": "הכוח קטן רק ב-0.04 ניוטון, שהוא הפרש הזמנים.", "ar": "تقلّ القوة 0.04 نيوتن فقط، وهو فرق الزمنين.", "ru": "Сила уменьшается лишь на 0,04 Н — это разность времён.", "en": "The force drops by only 0.04 N, the gap between the times."}, {"he": "הכוח קטן פי 5, כי העצירה ארוכה פי 5.", "ar": "تقلّ القوة 5 مرات لأن التوقّف أطول 5 مرات.", "ru": "Сила уменьшается в 5 раз, ведь остановка в 5 раз дольше.", "en": "The force shrinks 5 times, as the stop lasts 5 times longer."}],3,{"he": "עוצרים את אותו ראש מאותה מהירות. מה משתנה כשיש לזה יותר זמן?", "ar": "نوقف الرأس نفسه من السرعة نفسها. ما الذي يتغيّر عندما يتوفّر وقت أطول لذلك؟", "ru": "Останавливают ту же голову с той же скорости. Что меняется, если на это больше времени?", "en": "The same head is stopped from the same speed. What changes when there is more time for it?"},{"he": "לעצור את אותו ראש מאותה מהירות צריך אותו שינוי בתנע. כשזמן העצירה ארוך פי 5, הכוח הממוצע קטן פי 5. למשל נחיתה על מזרן עבה פוגעת פחות מנחיתה על בטון, כי העצירה איטית יותר.", "ar": "إيقاف الرأس نفسه من السرعة نفسها يتطلّب التغيّر نفسه في الزخم. عندما يكون زمن التوقّف أطول بـ5 مرات، تصغر القوة المتوسّطة 5 مرات. مثلًا الهبوط على فرشة سميكة يؤذي أقلّ من الهبوط على الإسمنت، لأن التوقّف أبطأ.", "ru": "Чтобы остановить ту же голову с той же скорости, нужно то же изменение импульса. Если время остановки в 5 раз больше, средняя сила в 5 раз меньше. Например, приземление на толстый мат травмирует меньше, чем на бетон, потому что остановка медленнее.", "en": "Stopping the same head from the same speed needs the same change in momentum. When the stopping time is 5 times longer, the average force is 5 times smaller. For example, landing on a thick mat hurts less than landing on concrete, because the stop is slower."},null,[{"he": "עצירה ארוכה יותר מקטינה את הכוח, ולא מגדילה אותו.", "ar": "التوقّف الأطول يُصغّر القوة ولا يزيدها.", "ru": "Более долгая остановка уменьшает силу, а не увеличивает.", "en": "A longer stop reduces the force; it does not increase it."}, {"he": "המהירות זהה, אבל זמן העצירה שונה, וזה משנה את הכוח.", "ar": "السرعة متساوية، لكن زمن التوقّف مختلف، وهذا يغيّر القوة.", "ru": "Скорость та же, но время остановки разное, и это меняет силу.", "en": "The speed is the same, but the stopping time differs, and that changes the force."}, {"he": "הפרש של זמנים אינו כוח; משווים את היחס בין הזמנים.", "ar": "فرق الأزمنة ليس قوة؛ نقارن النسبة بين الزمنين.", "ru": "Разность времён — не сила; сравнивают отношение времён.", "en": "A difference in times is not a force; you compare the ratio of the times."}, null])
 ],
 [
  Q("a1-pulley",{"he": "חבר טוען: ״גלגלת יוצרת כוח חדש, ולכן אפשר להרים ארון כבד בלי להשקיע כוח בכלל״. איזו תגובה נכונה מדעית?", "ar": "يدّعي صديق: «البكرة تُنشئ قوة جديدة، لذلك يمكن رفع خزانة ثقيلة دون بذل أي قوة». أي ردّ صحيح علميًا؟", "ru": "Друг утверждает: «Блок создаёт новую силу, поэтому тяжёлый шкаф можно поднять, вообще не прикладывая силы». Какой ответ научно верен?", "en": "A friend claims: \"A pulley creates new force, so you can lift a heavy closet without applying any force.\" Which reply is scientifically correct?"},[{"he": "הגלגלת משנה כיוון או מחלקת כוח, אבל לא יוצרת כוח חדש.", "ar": "البكرة تغيّر الاتجاه أو توزّع القوة، لكنها لا تُنشئ قوة جديدة.", "ru": "Блок меняет направление или распределяет силу, но не создаёт новой силы.", "en": "A pulley changes direction or shares force, but does not create new force."},{"he": "הטענה נכונה: גלגלת טובה מחליפה את עבודת השרירים.", "ar": "الادعاء صحيح: البكرة الجيدة تحل محل عمل العضلات.", "ru": "Утверждение верно: хороший блок заменяет работу мышц.", "en": "The claim is right: a good pulley replaces muscle work."},{"he": "הגלגלת מבטלת את כוח הכבידה, ולכן הארון קל.", "ar": "البكرة تلغي الجاذبية، لذلك تصبح الخزانة خفيفة.", "ru": "Блок отменяет силу тяжести, поэтому шкаф лёгкий.", "en": "The pulley cancels gravity, so the closet is light."},{"he": "אי אפשר לדעת בלי לדעת ממה עשויה הגלגלת.", "ar": "لا يمكن المعرفة دون معرفة مادة صنع البكرة.", "ru": "Нельзя знать, не выяснив, из чего сделан блок.", "en": "You cannot tell without knowing what the pulley is made of."}],0,{"he": "שאלו את עצמכם מאיפה מגיעה האנרגיה להרמה.", "ar": "اسألوا أنفسكم من أين تأتي طاقة الرفع.", "ru": "Спросите себя, откуда берётся энергия для подъёма.", "en": "Ask yourselves where the lifting energy comes from."},{"he": "גלגלת היא כלי עזר: היא משנה את כיוון המשיכה או מחלקת את העומס בין חלקי החבל, אבל היא אינה מקור אנרגיה. האנרגיה מגיעה מהשרירים או ממנוע. למשל כדי להעלות דגל מושכים את החבל מטה דרך הגלגלת, והיד עדיין עובדת.", "ar": "البكرة أداة مساعدة: تغيّر اتجاه الشد أو توزّع الحمل بين أجزاء الحبل، لكنها ليست مصدر طاقة. الطاقة تأتي من العضلات أو من محرك. مثال: لرفع علم نسحب الحبل للأسفل عبر البكرة، واليد ما زالت تعمل.", "ru": "Блок является вспомогательным устройством: он меняет направление тяги или распределяет нагрузку между ветвями верёвки, но не источник энергии. Энергия приходит от мышц или мотора. Например, чтобы поднять флаг, тянем верёвку вниз через блок, и рука всё равно работает.", "en": "A pulley is a helper: it changes the pull direction or shares the load between rope parts, but it is not an energy source. The energy comes from muscles or a motor. For example, to raise a flag you pull the rope down through the pulley, and the hand still works."},null,[null,{"he": "אם גלגלת הייתה יוצרת כוח, אפשר היה לבנות מכונה שעובדת בלי אנרגיה, וזה סותר את חוק שימור האנרגיה.", "ar": "لو كانت البكرة تُنشئ قوة، لأمكن بناء آلة تعمل بلا طاقة، وهذا يناقض قانون حفظ الطاقة.", "ru": "Если бы блок создавал силу, машина работала бы без энергии, а это противоречит закону сохранения энергии.", "en": "If a pulley created force, you could build a machine that runs without energy, which contradicts energy conservation."},{"he": "כוח הכבידה פועל על הארון כרגיל; הגלגלת רק משנה את אופן ההתגברות עליו.", "ar": "الجاذبية تعمل على الخزانة كالمعتاد؛ البكرة فقط تغيّر طريقة التغلب عليها.", "ru": "Сила тяжести действует на шкаф как обычно; блок лишь меняет способ её преодоления.", "en": "Gravity acts on the closet as usual; the pulley only changes how you overcome it."},{"he": "החומר אינו משנה את עקרון הכוחות; בודקים חבל, כוחות ותנועה.", "ar": "المادة لا تغيّر مبدأ القوى؛ نفحص الحبل والقوى والحركة.", "ru": "Материал не меняет принцип сил; проверяют верёвку, силы и движение.", "en": "The material does not change the principle of forces; you check rope, forces and motion."}]),
