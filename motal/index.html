<script>
/* INTERNAL-GATE — שער פנימי. ראו .claude/qa/internal-gate.html.
   המפתח נשמר במגירה משל האפליקציה (shlav-internal-motal) ולא
   במגירה המשותפת shlav-internal, כדי שפתיחת אזרח לא תסגור את
   מתח ולהפך. */
var INTERNAL_KEY="shlav-internal-motal";
var INTERNAL_OK=(function(){
  try{
    var q=(location.search.match(/[?&]internal=([^&]*)/)||[])[1];
    if(q) localStorage.setItem("shlav-internal-motal", decodeURIComponent(q));
    return localStorage.getItem("shlav-internal-motal")===INTERNAL_KEY;
  }catch(e){ return false }   /* localStorage חסום — סגור, לא פתוח */
})();
</script>

<style>
/* ============================================================
   ספרות — ספרות לבגרות
   קהל היעד לא "לא יודע אזרחות". הוא נכשל בה שוב ושוב, מפני
   שהמקצוע כולו טקסט ומושגים — ולכן כל החלטה כאן נמדדת בשאלה
   אחת: האם היא מורידה עומס, או מוסיפה.
   · כל שאלה נושאת רמז שאינו התשובה, והסבר שנפתח גם כשצדקו.
   · שום טקסט לא מוצג בלי שאפשר לשמוע אותו.
   · שפת האם אינה קישוט: מושג באזרחות נלמד קודם בשפה שחושבים בה.
   כל המידות ב-rem, כדי שהגדלת טקסט תגדיל את הכול יחד.
   ============================================================ */
:root{
  --font:"Heebo","Rubik",system-ui,"Segoe UI",Arial,sans-serif;
  --en:"Lexend","Heebo",system-ui,"Segoe UI",Arial,sans-serif;
  --ar:"Noto Sans Arabic",system-ui,"Segoe UI",Arial,sans-serif;
  --ru:"Noto Sans","Heebo",system-ui,"Segoe UI",Arial,sans-serif;   /* קירילית — Heebo אינו מכיל אותה */
  --bg:#f5f7fb; --surface:#ffffff; --surface2:#e8ecf6;
  --ink:#101828; --muted:#55607a; --faint:#6f7a95; --line:#dde3f0;
  --accent:#1d4ed8; --accent-ink:#ffffff; --accent-soft:#dbe4fe;
  --gold:#a16207; --gold-soft:#fbf0d5; --hit:#f5c451; --hit-ink:#1a1300;
  --ok:#15803d; --ok-soft:#dcfce7; --bad:#be123c; --bad-soft:#ffe4e9;
  --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px -12px rgba(16,24,40,.2);
  --r:14px;
  /* צבע לכל מסלול. לא קישוט: ארבעה סוגי לימוד שונים לגמרי, וצבע
     קבוע לכל אחד חוסך למי שמתקשה להתמצא את השאלה "איפה אני". */
  --c-sound:#0369a1; --cs-sound:#dbeefc;   /* צליל ואות   */
  --c-words:#15803d; --cs-words:#dcfce7;   /* מילים       */
  --c-talk:#c2410c;  --cs-talk:#fde5d8;    /* מדוברת      */
  --c-read:#6d28d9;  --cs-read:#eae2fd;    /* ספרותית     */
}
:root[data-theme="dark"]{
  --bg:#0e1425; --surface:#17203a; --surface2:#202c4d;
  --ink:#e8edf8; --muted:#9aa5c0; --faint:#78829e; --line:#2a3762;
  --accent:#93c5fd; --accent-ink:#0e1425; --accent-soft:#1b2a5c;
  --gold:#fbbf24; --gold-soft:#33270f; --hit:#ffd24d; --hit-ink:#241a00;
  --ok:#4ade80; --ok-soft:#132a1c; --bad:#fb7185; --bad-soft:#33161f;
  --warn:#fbbf24; --warn-soft:#33260f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  --c-sound:#7dd3fc; --cs-sound:#0b2a3d;
  --c-words:#86efac; --cs-words:#0f2a1a;
  --c-talk:#fdba74;  --cs-talk:#3a2113;
  --c-read:#c4b5fd;  --cs-read:#261a45;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1425; --surface:#17203a; --surface2:#202c4d;
    --ink:#e8edf8; --muted:#9aa5c0; --faint:#78829e; --line:#2a3762;
    --accent:#93c5fd; --accent-ink:#0e1425; --accent-soft:#1b2a5c;
    --gold:#fbbf24; --gold-soft:#33270f; --hit:#ffd24d; --hit-ink:#241a00;
    --ok:#4ade80; --ok-soft:#132a1c; --bad:#fb7185; --bad-soft:#33161f;
    --warn:#fbbf24; --warn-soft:#33260f;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
    --c-sound:#7dd3fc; --cs-sound:#0b2a3d;
    --c-words:#86efac; --cs-words:#0f2a1a;
    --c-talk:#fdba74;  --cs-talk:#3a2113;
    --c-read:#c4b5fd;  --cs-read:#261a45;
  }
}
/* ניגודיות גבוהה — שחור על לבן, מסגרות מלאות, בלי גוונים רכים */
:root.hc{
  --bg:#ffffff; --surface:#ffffff; --surface2:#ffffff;
  --ink:#000000; --muted:#1a1a1a; --faint:#333333; --line:#000000;
  --accent:#00434b; --accent-ink:#ffffff; --accent-soft:#e6f2f3;
  --gold:#5c3d00; --gold-soft:#f7efdf; --hit:#ffe600; --hit-ink:#000000;
  --ok:#0a5c2a; --ok-soft:#e6f4ea; --bad:#8c0f2c; --bad-soft:#fbe9ed;
  --warn:#6b3d00; --warn-soft:#f7efdf; --shadow:none;
  --c-sound:#00305c; --cs-sound:#e8eef7;
  --c-words:#0a5c2a; --cs-words:#e6f4ea;
  --c-talk:#7a2c00;  --cs-talk:#f9ece4;
  --c-read:#3d1a75;  --cs-read:#eee8f9;
}
:root.hc *{box-shadow:none!important}
:root.hc .card,:root.hc .btn,:root.hc .opt{border-width:2px!important}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs,17px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  font-size:1rem;line-height:1.65;-webkit-text-size-adjust:100%}
:root.clear body{font-family:"Verdana","Tahoma","Heebo",sans-serif;letter-spacing:.012em}
:root.spaced body{word-spacing:.22em;line-height:1.95}
:root.rm *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
h1,h2,h3{margin:0;line-height:1.3;font-weight:800}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;inset-inline-start:-9999px}
.skip:focus{position:static;display:inline-flex;align-items:center;min-height:44px;
  margin:8px;padding:8px 14px;background:#0e9c8d;color:#fff;
  border-radius:8px;font-weight:700;text-decoration:none;z-index:100}

/* כל טקסט אנגלי — כיוון, גופן ומרווח משלו. unicode-bidi:isolate מונע
   מהמשפט האנגלי לגרור אחריו את סימני הפיסוק של המשפט העברי. */
.en{font-family:var(--en);direction:ltr;unicode-bidi:isolate;text-align:start}
.en-b{font-family:var(--en);direction:ltr;unicode-bidi:isolate;display:inline-block}

.wrap{max-width:56rem;margin:0 auto;padding:0 clamp(.9rem,3vw,1.5rem)}
.hbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-block:.6rem}
:root.hc .hbar{background:var(--bg);backdrop-filter:none}
.hrow{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
.brand{font-size:1.35rem;font-weight:800;letter-spacing:-.01em;display:flex;
  align-items:baseline;gap:.5rem;margin-inline-end:auto}
.brand small{font-size:.72rem;font-weight:600;color:var(--muted);letter-spacing:.06em}
.gbtn{display:inline-flex;align-items:center;gap:.4rem;background:var(--surface);
  border:1px solid var(--line);border-radius:999px;padding:.42rem .8rem;cursor:pointer;
  font-size:.86rem;font-weight:600;box-shadow:var(--shadow);min-height:44px}
.gbtn:hover{border-color:var(--accent)}
.gbtn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:1.1rem}
.grid{display:grid;gap:.85rem}
@media(min-width:640px){.g2{grid-template-columns:1fr 1fr}}
@media(min-width:900px){.g3{grid-template-columns:repeat(3,1fr)}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;
  border:1px solid var(--line);background:var(--surface);border-radius:12px;
  padding:.72rem 1.1rem;font-weight:700;cursor:pointer;box-shadow:var(--shadow);
  min-height:2.9rem;font-size:1rem}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;box-shadow:none}
.btn[disabled]{opacity:.45;cursor:default}
.btn.wide{width:100%}

.chip{display:inline-flex;align-items:center;gap:.35rem;border-radius:999px;
  padding:.22rem .6rem;font-size:.78rem;font-weight:700;background:var(--surface2);color:var(--muted)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}

/* גופני שפה: Heebo אינו מכיל ערבית וקירילית, ולכן שפת הממשק
   מחליפה גופן ולא רק כיוון. */
html[lang="ar"] body,html[lang="ar"] input,html[lang="ar"] button,
html[lang="ar"] textarea,html[lang="ar"] select{font-family:var(--ar)}
html[lang="ru"] body,html[lang="ru"] input,html[lang="ru"] button,
html[lang="ru"] textarea,html[lang="ru"] select{font-family:var(--ru)}
button[data-a="lang"][lang="ar"]{font-family:var(--ar)}
button[data-a="lang"][lang="ru"]{font-family:var(--ru)}

/* ===== מסלולים: הצבע נכנס ככרטיס, לא כרקע של טקסט ===== */
.trk{--c:var(--accent);--cs:var(--accent-soft)}
.t-sound{--c:var(--c-sound);--cs:var(--cs-sound)}
.t-words{--c:var(--c-words);--cs:var(--cs-words)}
.t-talk{--c:var(--c-talk); --cs:var(--cs-talk)}
.t-read{--c:var(--c-read); --cs:var(--cs-read)}
.tcard{border-inline-start:5px solid var(--c);cursor:pointer;text-align:start;width:100%;
  display:flex;flex-direction:column;gap:.4rem;align-items:stretch}
.tcard:hover{border-color:var(--c)}
.tcard h3{font-size:1.05rem}
.tcard .sub{font-size:.85rem;color:var(--muted)}
.tdot{width:.62rem;height:.62rem;border-radius:50%;background:var(--c);flex:none}
.thead{display:flex;align-items:center;gap:.5rem}
.tpill{background:var(--cs);color:var(--c);border-radius:999px;padding:.15rem .55rem;
  font-size:.72rem;font-weight:800}

/* ===== סרגל שליטה ברמות ===== */
.lvls{display:flex;gap:.4rem;flex-wrap:wrap}
.lvl{border:1px solid var(--line);background:var(--surface);border-radius:10px;
  padding:.4rem .7rem;font-size:.82rem;font-weight:700;cursor:pointer;
  display:inline-flex;align-items:center;gap:.4rem}
.lvl.on{background:var(--c,var(--accent));color:var(--accent-ink);border-color:var(--c,var(--accent))}
.bar{height:.42rem;border-radius:999px;background:var(--surface2);overflow:hidden;flex:1;min-width:3rem}
.bar i{display:block;height:100%;background:var(--c,var(--accent))}
.bar.b0 i{background:var(--bad)} .bar.b1 i{background:var(--warn)} .bar.b2 i{background:var(--ok)}

/* ===== תרגול ===== */
.qcard{border-top:5px solid var(--c,var(--accent))}
.qtop{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.7rem}
.qtext{font-size:1.12rem;font-weight:600;margin:.2rem 0 .3rem}
.qhint{color:var(--muted);font-size:.9rem}
/* המילה או המשפט שנלמדים. גדול, מרווח, ותמיד לצד כפתור השמעה. */
.subject{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;
  background:var(--surface2);border-radius:12px;padding:.85rem 1rem;margin:.5rem 0}
.subject .word{font-family:var(--en);direction:ltr;unicode-bidi:isolate;
  font-size:1.7rem;font-weight:700;letter-spacing:.01em;line-height:1.25}
.subject .ipa{font-family:var(--en);direction:ltr;unicode-bidi:isolate;
  color:var(--muted);font-size:.95rem}
.spk{border:1px solid var(--line);background:var(--surface);border-radius:999px;
  width:2.7rem;height:2.7rem;display:inline-flex;align-items:center;justify-content:center;
  cursor:pointer;flex:none;box-shadow:var(--shadow)}
.spk:hover{border-color:var(--accent);color:var(--accent)}
.spk.sm{width:2.1rem;height:2.1rem;background:#0e9c8d;border-color:#0b7c71;color:#fff}
/* הרמקול הקטן — אותו ירוק של כפתור ההקראה הגדול, התקן המשותף */
.spk.sm:hover{background:#0b7c71;border-color:#0b7c71;color:#fff}
.spk.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.opts{display:grid;gap:.6rem;margin-top:.9rem}
.orow{display:flex;gap:.45rem;align-items:center;min-width:0}
/* min-width:0 — פריט grid נולד עם min-width:auto, ולכן משפט ארוך
   באפשרות היה מרחיב את השורה מעבר למכל ודוחף את הרמקול מחוץ למסך. */
.orow .opt{flex:1;min-width:0}
@media(min-width:560px){.opts.two{grid-template-columns:1fr 1fr}}
.opt{display:flex;align-items:center;gap:.6rem;text-align:start;width:100%;
  border:2px solid var(--line);background:var(--surface);border-radius:12px;
  padding:.8rem .9rem;cursor:pointer;font-size:1.02rem;font-weight:600;min-height:3.1rem}
.opt:hover{border-color:var(--accent)}
.opt .k{width:1.9rem;height:1.9rem;border-radius:8px;background:var(--surface2);
  display:inline-flex;align-items:center;justify-content:center;font-size:.85rem;
  font-weight:800;color:var(--muted);flex:none}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .k{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .k{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.55}
/* בחירה במבחן היא בחירה, לא תשובה נכונה. במסכי התרגול הצבע
   הירוק אומר "צדקת", ובמבחן אסור לו להופיע כלל — הוא נותן
   משוב שגוי לכל בחירה. ניטרלי, ורק מסמן מה סומן. */
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);margin-inline-start:3px}
.dot.ok{background:var(--ok);border-color:var(--ok)}
.dot.no{background:var(--bad);border-color:var(--bad)}
.dot.flag{box-shadow:0 0 0 2px var(--accent)}

/* אריחי בניית משפט. הסדר הוא התרגיל, ולכן האריח חייב להיראות כמשהו
   שאפשר להרים — מסגרת מלאה ורקע משלו, לא טקסט על רקע הכרטיס. */
.tiles{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:.7rem}
.tile{font-family:var(--en);direction:ltr;border:2px solid var(--line);
  background:var(--surface);border-radius:10px;padding:.5rem .8rem;font-weight:600;
  cursor:pointer;font-size:1.02rem;min-height:2.7rem}
.tile:hover{border-color:var(--accent)}
.slot{min-height:3.2rem;border:2px dashed var(--line);border-radius:12px;
  background:var(--surface2);padding:.5rem;display:flex;flex-wrap:wrap;gap:.45rem;
  align-items:center;direction:ltr}
.slot.ok{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.slot.bad{border-style:solid;border-color:var(--bad);background:var(--bad-soft)}
.slot .tile{background:var(--surface)}

/* ===== משוב ===== */
.fb{margin-top:.9rem;border-radius:12px;padding:.85rem 1rem;border:1px solid transparent}
.fb.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.fb.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.fb b{display:block;font-size:1.02rem;margin-bottom:.2rem}
.fb .body{color:var(--ink);font-weight:500;font-size:.95rem}
.why{margin-top:.55rem;padding-top:.55rem;border-top:1px dashed currentColor;color:var(--ink);
  font-weight:500;font-size:.93rem}

/* ===== קטע קריאה ===== */
/* איור בתוך כרטיס שאלה. הצבע יורש מ-color, ולכן אותו SVG נראה
   נכון גם בערכה הבהירה וגם בכהה בלי גרסה שנייה. */
.figure{margin:.7rem 0;padding:.6rem;border:1px solid var(--line);border-radius:12px;
  background:var(--surface2);color:var(--ink);overflow-x:auto}
.figure svg{display:block;max-width:100%}
/* המבחן המדומה: השאלות זו אחר זו, כמו חוברת בחינה. */
.simq{border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;margin:.8rem 0;
  background:var(--surface)}
.simq.miss{border-color:var(--warn)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.simn{font-weight:800;color:var(--muted);font-size:.86rem}
.simbar{position:sticky;top:0;z-index:5;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:.6rem .8rem;margin:.8rem 0;display:flex;gap:.6rem;

.passage{background:var(--surface2);border-radius:12px;padding:1rem 1.1rem;margin:.6rem 0;

.passage .s{border-radius:5px;padding:.05em .12em;cursor:pointer}

.wd{border-radius:5px;padding:1px 3px}

   באנדרואיד — אין מה להדגיש מילה־מילה, ואז מודגש כל האיבר. הכלל
   שקיים כאן מכוון למשפט בתוך קטע קריאה בלבד, ולכן ההדגשה החלופית
   על איבר אחר לא נראתה כלל. */
.wd.now,p.now,div.now,span.now,b.now{background:var(--hit);color:var(--hit-ink);
  border-radius:8px;box-shadow:0 0 0 4px var(--hit)}
.gloss{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.5rem}

.vstrip{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;border-radius:10px;

.row .desc{font-size:.85rem;color:var(--muted);font-weight:500}
.sw{width:3.2rem;height:1.8rem;border-radius:999px;background:var(--surface2);
  border:1px solid var(--line);position:relative;cursor:pointer;flex:none}
.sw i{position:absolute;top:.18rem;inset-inline-start:.2rem;width:1.3rem;height:1.3rem;
  border-radius:50%;background:var(--faint);transition:.15s}
.sw.on{background:var(--accent);border-color:var(--accent)}

.fbar{border-top:1px solid var(--line);margin-top:2rem;padding-block:1rem;

/* ---------- שדה קלט של המבחן ----------
   מודול המבחן הועתק לכאן מאפליקציה שבה .field כבר היה מוגדר.
   בלי הכלל הזה שדה השם של הנבחן נשאר תיבת ברירת המחדל של
   הדפדפן — 21 פיקסלים גובה, הרבה מתחת ליעד המגע של 44. */
.field{width:100%;box-sizing:border-box;font:inherit;font-size:1rem;
  min-height:48px;padding:12px 14px;border-radius:11px;outline:none;background:var(--surface2);color:inherit;border:1px solid var(--line)}
.field:focus{border-color:var(--accent)}

/* ---------- שורות המבחן ----------
   .tog הגיע ממודול המבחן שהועתק לכאן, ולא היה לו עיצוב כלל: השם
   והמידע שמתחתיו נדבקו לשורה אחת בלי רווח. */
.tog{display:flex;align-items:center;gap:13px;width:100%;text-align:start;

.lg-foot a{display:inline-flex;align-items:center;min-height:44px;padding-inline:6px}

/* ---------- יעדי מגע ----------
   .lvl יצא 39 פיקסלים ומתג ה-.sw רק 31, שניהם מתחת ל-44 שהפרויקט
   מחייב את עצמו בהם. במתג לא מגדילים את המסילה — היא תיראה מגושמת —
   אלא מרחיבים את שטח הלחיצה סביבה. */
.lvl{min-height:44px}

/* ---------- מסך בניית המבחן ----------

   כפתורי הבחירה יצאו 34 פיקסלים, וכרטיסי הנושאים 6 פיקסלים בלבד —

.tpc{position:relative;display:flex;flex-direction:column;gap:9px;text-align:start;

  border-inline-start:4px solid var(--c,var(--accent));border-radius:12px;padding:14px;

/* --- מנוע ההדגמה. הקוד כאן זהה בכל האפליקציות; רק DEMO_SCRIPT משתנה. --- */
var DEMO={on:false,i:0,timer:null,extra:[],bar:null,txt:null,step:null,fill:null,btn:null};

/* עוזרים לתסריט. כולם מחזירים false כשהאיבר אינו על המסך, כדי
   שצעד שלא מצא את מה שחיפש ידלג ולא יפיל את ההדגמה כולה. */
function demoEl(s){return typeof s==="string"?document.querySelector(s):s}
function demoShow(s){
  var e=demoEl(s); if(!e)return false;
  try{e.scrollIntoView({behavior:"smooth",block:"center"})}catch(err){try{e.scrollIntoView()}catch(err2){}}
  return true;
}
/* מדגיש את האיבר, ורק אז לוחץ — צופה שלא ראה לאן נלחץ לא הבין
   מה קרה. לכן אין צעד קצר מ-1200 אלפיות בתסריטים. */
function demoTap(s){
  var e=demoEl(s); if(!e||e.disabled)return false;
  demoShow(e);
  e.classList.add("demo-tap");
  DEMO.extra.push(setTimeout(function(){
    e.classList.remove("demo-tap");
    /* המסך מצטייר מחדש כל הזמן. אם האיבר שסומן כבר אינו במסמך,
       מחפשים אותו שוב לפי אותו בורר — לחיצה על איבר מת אינה
       עושה דבר, וזה בדיוק צעד שנראה כאילו נתקע. */
    var live=(typeof s==="string"&&!document.contains(e))?demoEl(s):e;
    if(DEMO.on&&live&&!live.disabled&&document.contains(live))try{live.click()}catch(err){}
  },430));
  return true;
}
function demoClick(s){
  var e=demoEl(s); if(!e||e.disabled)return false;
  try{e.click()}catch(err){return false}
  return true;
}
/* הקלדה אות אחר אות, עם אירוע input אמיתי — שדה חיפוש שמאזין
   ל-input לא היה מגיב להשמה ישירה ל-value. */
function demoType(s,text){
  var e=demoEl(s); if(!e)return false;
  demoShow(e); try{e.focus()}catch(err){}
  e.value=""; var i=0;
  var t=setInterval(function(){
    if(!DEMO.on||!e.parentNode){clearInterval(t);return}
    e.value=String(text).slice(0,++i);
    e.dispatchEvent(new Event("input",{bubbles:true}));
    if(i>=String(text).length)clearInterval(t);
  },85);
  DEMO.extra.push(t);
  return true;
}
function demoQuiet(){
  try{if(window.speechSynthesis)speechSynthesis.cancel()}catch(e){}
  try{if(typeof stopSpeak==="function")stopSpeak()}catch(e){}
}

function demoMountUI(){
  var st=document.createElement("style");
  st.id="demo-style"; st.textContent=DEMO_CSS;
  (document.head||document.documentElement).appendChild(st);

  var b=document.createElement("button");
  b.id="demo-start"; b.type="button";
  b.innerHTML='<span aria-hidden="true">▶</span><span>התחל הדגמה</span>';
  b.addEventListener("click",demoStart);
  document.body.appendChild(b);

  var bar=document.createElement("div");
  bar.id="demo-bar"; bar.hidden=true;
  bar.setAttribute("role","status");
  bar.setAttribute("aria-live","polite");
  bar.innerHTML='<div id="demo-sub"><p id="demo-txt"></p>'+
    '<div id="demo-meta"><span id="demo-step"></span>'+
    '<button id="demo-exit" type="button">יציאה · ESC</button></div>'+
    '<div id="demo-prog"><i></i></div></div>';
  document.body.appendChild(bar);

  DEMO.btn=b; DEMO.bar=bar;
  DEMO.txt=document.getElementById("demo-txt");
  DEMO.step=document.getElementById("demo-step");
  DEMO.fill=bar.querySelector("#demo-prog i");
  document.getElementById("demo-exit").addEventListener("click",function(){demoStop()});
  document.addEventListener("keydown",demoKey,true);
}

/* ESC יוצא. הקשבה בשלב הלכידה, כדי שמסך שכבר מטפל ב-Escape
   לא יבלע את המקש לפני שההדגמה ראתה אותו. */
function demoKey(e){
  if(!DEMO.on)return;
  if(e.key==="Escape"||e.keyCode===27){
    e.preventDefault(); e.stopPropagation();
    demoStop();
  }
}

function demoStart(){
  if(DEMO.on)return;
  DEMO.on=true; DEMO.i=0;
  DEMO.btn.hidden=true; DEMO.bar.hidden=false;
  document.documentElement.classList.add("demo-running");
  demoNext();
}

function demoNext(){
  if(!DEMO.on)return;
  if(DEMO.i>=DEMO_SCRIPT.length){demoStop();return}
  var it=DEMO_SCRIPT[DEMO.i++]||{};
  var d=Math.max(600,it.duration||3000);
  DEMO.txt.textContent=it.subtitle||"";
  DEMO.step.textContent=DEMO.i+" / "+DEMO_SCRIPT.length;
  DEMO.fill.style.transition="none"; DEMO.fill.style.width="0";
  void DEMO.fill.offsetWidth;
  DEMO.fill.style.transition="width "+d+"ms linear";
  DEMO.fill.style.width="100%";
  if(typeof it.action==="function"){
    try{it.action()}catch(err){if(window.console)console.warn("demo:",err)}
  }
  DEMO.timer=setTimeout(demoNext,d);
}

function demoStop(){
  DEMO.on=false;
  if(DEMO.timer){clearTimeout(DEMO.timer);DEMO.timer=null}
  DEMO.extra.forEach(function(t){clearTimeout(t);clearInterval(t)});
  DEMO.extra=[];
  var m=document.querySelectorAll(".demo-tap"),i;
  for(i=0;i<m.length;i++)m[i].classList.remove("demo-tap");
  if(DEMO.bar)DEMO.bar.hidden=true;
  if(DEMO.btn)DEMO.btn.hidden=false;
  document.documentElement.classList.remove("demo-running");
  demoQuiet();
}

function demoMount(){
  if(document.querySelector(".lg-wrap")){setTimeout(demoMount,500);return}
  if(!document.getElementById("demo-start"))demoMountUI();
}

if(DEMO_ON){
  if(document.readyState==="complete")setTimeout(demoMount,0);
  else window.addEventListener("load",function(){setTimeout(demoMount,0)});
}

function shuffle(a){var i,j,t;for(i=a.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));
  t=a[i];a[i]=a[j];a[j]=t}return a}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function uniq(a){return a.filter(function(v,i){return a.indexOf(v)===i})}

var state=blankState();

function load(){
  try{
    var raw=localStorage.getItem(SKEY); if(!raw)return;
    var o=JSON.parse(raw); if(!o||typeof o!=="object")return;
    Object.keys(blankState()).forEach(function(k){if(o[k]!==undefined)state[k]=o[k]});
  }catch(e){}
  if(!LANGS[state.lang])state.lang=guessLang();
  if(GEM_VOICES.every(function(v){return v.id!==state.gemVoice}))state.gemVoice="Kore";
  state.rate=clamp(Number(state.rate)||0.95,0.6,1.3);
}
function save(){try{localStorage.setItem(SKEY,JSON.stringify(state))}catch(e){}}

/* שפת הדפדפן, לא ברירת מחדל עברית. מי שפותח את האפליקציה במכשיר
   ברוסית לא אמור להיתקל קודם במסך בעברית שאינו יכול לקרוא. */
/* אנגלית אינה סימן. טלפון בישראל מדווח אנגלית כברירת מחדל של
   המכשיר, לא כבחירה, והאפליקציה נפתחה באנגלית למי שבא ללמוד
   בעברית. ערבית ורוסית כן נחשבות — שם זו שפת אם של ממש. מי
   שרוצה אנגלית בוחר אותה, והבחירה נשמרת. */
function guessLang(){
  var ls=(navigator.languages||[navigator.language||"he"]).map(function(x){
    return String(x).toLowerCase().split("-")[0]});
  for(var i=0;i<ls.length;i++){
    var c=ls[i]==="iw"?"he":ls[i];
    if(c==="en")continue;
    if(LANGS[c])return c;
  }
  return "he";
}
function touchDay(){
  var d=todayIso();
  if(state.day.d!==d){
    var y=new Date(Date.now()-86400000);
    var yi=y.getFullYear()+"-"+String(y.getMonth()+1).padStart(2,"0")+"-"+String(y.getDate()).padStart(2,"0");
    state.streak=(state.lastDay===yi)?(state.streak||0)+1:1;
    state.lastDay=d; state.day={d:d,n:0};
  }
}
function stKey(tid,lv){return tid+"|"+lv}
function stOf(tid,lv){
  var k=stKey(tid,lv);
  if(!state.stats[k])state.stats[k]={seen:0,ok:0,bad:0};
  return state.stats[k];
}
function mastery(tid,lv){
  var s=state.stats[stKey(tid,lv)];
  if(!s||!s.seen)return 0;
  return clamp(s.ok/Math.max(6,s.seen),0,1);
}
function barCls(m){return m>=.75?"b2":m>=.4?"b1":"b0"}

/* --- קול המכשיר, לפי שפה --- */
function allVoices(){try{return window.speechSynthesis?(speechSynthesis.getVoices()||[]):[]}catch(e){return[]}}
/* הקולות נטענים אסינכרונית, ורק אז נורה voiceschanged. מי שמקריא
   לפני כן מקבל את ברירת המחדל של הדפדפן — לרוב קול אנגלי, גם כשמותקן
   קול עברי טוב. onvoiceschanged לבדו אינו פתרון: הוא מרענן תפריט,
   הוא לא מעכב את האמירה הראשונה. */
var _voicesP=null;
function voicesReady(){
  if(_voicesP)return _voicesP;
  _voicesP=new Promise(function(done){
    if(!("speechSynthesis" in window)){done();return}
    if(allVoices().length){done();return}
    var poll=null,cap=null,fired=false;
    function finish(){
      if(fired)return; fired=true;
      clearInterval(poll); clearTimeout(cap);
      try{speechSynthesis.removeEventListener("voiceschanged",finish)}catch(e){}
      done();
    }
    try{speechSynthesis.addEventListener("voiceschanged",finish)}catch(e){}
    /* Safari לא תמיד יורה את האירוע — לכן גם דגימה */
    poll=setInterval(function(){if(allVoices().length)finish()},120);
    /* תקרה: יש מכשירים שמחזירים רשימה ריקה לצמיתות ומדברים מצוין.
       עדיף לדבר בקול ברירת מחדל מאשר לשתוק לנצח. */
    cap=setTimeout(finish,4000);
  });
  return _voicesP;
}
var LANG_HINT={he:/עברית|hebrew|ivrit/i,ar:/العربية|arabic/i,ru:/русский|russian/i,en:/english/i};
/* שמות שהמערכות באמת מתקינות. חסרו כאן קולות ערביים ורוסיים,
   ואז שניהם חזרו "לא ידוע" — איש מהם לא קיבל את בונוס המגדר,
   וההכרעה נפלה על התאמת אזור מדויקת. כך נבחר קול גברי כשקיים
   קול נשי באותה שפה. */
var V_F=/(הילה|כרמית|زارية|سلمى|أمينة|امينة|هدى|فاطمة|ليلى|نورا|светлана|дарья|ирина|екатерина|татьяна|елена|female|woman|#female|\bfem\b|carmit|hila|\bmiri\b|\bdana\b|shira|samantha|karen|moira|tessa|serena|victoria|\bava\b|allison|susan|vicki|nicky|\bzoe\b|fiona|\bkate\b|shelley|zira|hazel|aria|jenny|michelle|\bana\b|\beva\b|emma|libby|sonia|natasha|clara|\bamber\b|ashley|\bcora\b|elizabeth|monica|\bsara\b|\bsarah\b|\bjane\b|\bnancy\b|\bluna\b|\bmolly\b|irina|milena|svetlana|dariya|\belena\b|katja|ekaterina|\bkatya\b|tatyana|\balena\b|hoda|salma|zariyah|amina|\bhala\b|noura|laila|layla|fatima|zeina|\biman\b|\brana\b|\bsana\b|maryam|asma|heera|raveena|swara|neerja)/
var V_M=/(google[^a-z]{0,15}(arabic|العربية)|אברי|אסף|حامد|ماجد|طارق|ناصر|بسام|дмитрий|павел|юрий|максим|николай|\bmale\b|\bman\b|#male|asaf|avri|yoni|moshe|\balex\b|daniel|\bfred\b|\btom\b|aaron|arthur|oliver|rishi|gordon|\blee\b|ralph|bruce|david|\bmark\b|\bguy\b|ryan|christopher|\beric\b|brian|andrew|roger|steffan|liam|william|george|james|\bthomas\b|benjamin|brandon|\bjason\b|\btony\b|dmitry|pavel|\byuri\b|artemi|maxim|nikolai|maged|tarik|naayf|hamed|shakir|\bomar\b|tarek|\bali\b|bassel|\bmoaz\b|hamdan|saleh|abdullah|\btaim\b|fahed|rakan|yasser|hemant|madhur|prabhat)/
function vGender(v){var n=((v.name||"")+" "+(v.lang||"")).toLowerCase();
  return V_F.test(n)?"f":V_M.test(n)?"m":"?"}
function voicesFor(code){
  var base=String(code).split("-")[0].toLowerCase(),hint=LANG_HINT[base];
  return allVoices().filter(function(v){
    var l=String(v.lang||"").replace("_","-").toLowerCase();
    if(l.split("-")[0]===base)return true;
    return !l&&hint?hint.test(v.name||""):false;
  });
}
/* בורר קולות המכשיר. עד כה לא היה כזה בכלל: bestVoice בחר לבד,
   והמשתמש לא יכול היה להשפיע — כולל לבקש קול נשי. */
/* אין קול נשי בשפה שמוצגת? femLift מרים את הגובה, וזה כל מה
   שדפדפן יכול לעשות בלי הקלטות ובלי שירות חיצוני. ההודעה מסבירה
   את זה ומצרפת את ההוראות למערכת ההפעלה שהמשתמש נמצא בה — קול
   נשי שמותקן נבחר מיד, בלי שינוי הגובה ובלי הודעה. */
function femNote(pool){
  if(!pool||!pool.length)return "";
  for(var i=0;i<pool.length;i++)if(vGender(pool[i])==="f")return "";
  /* המסלול נכתב למערכת שהמשתמש נמצא בה עכשיו. אנדרואיד של גוגל
     מחזיק את ההגדרה תחת "נגישות" — "ניהול כללי" הוא מסלול של
     סמסונג בלבד; אייפד מדווח מאז iPadOS 13 כמו מק ונבדל ממנו רק
     במסך מגע; ומשתמש מק קיבל עד כה הוראות של ווינדוס, כי כל מה
     שאינו אנדרואיד או אייפון נפל לשם. */
  var ua=navigator.userAgent||"";
  var how=/Android/i.test(ua)?"femAndroid"
         :(/iPhone|iPad|iPod/i.test(ua)||(/Macintosh/i.test(ua)&&navigator.maxTouchPoints>1))?"femIos"
         :/Mac OS X|Macintosh/i.test(ua)?"femMac":"femWin";
  return t("femNone")+" "+t(how);
}
function devPicker(lgs){
  var out="";
  lgs.forEach(function(lg){
    var code=lg==="en"?EN_TTS:LANGS[lg].tts;
    var pool=voicesFor(code);
    if(lgs.length>1)out+='<p style="font-weight:700;margin:.9rem 0 .3rem">'+esc(LANGS[lg]?LANGS[lg].name:code)+"</p>";
    if(!pool.length){
      /* אומרים את זה במפורש. רשימה ריקה בלי הסבר נראית כמו תקלה. */
      out+='<p class="chip bad" style="margin:.4rem 0">'+esc(t("vNoneLang"))+"</p>";
      return;
    }
    /* אין קול נשי בשפה הזאת? הגובה מורם — וגם נאמר למה. בלי המשפט
       הזה הקול הגברי נראה כמו בחירה של האפליקציה ולא כמו מה שיש
       במכשיר, ואין שום רמז שאפשר להתקין קול נשי ולקבל אותו מיד. */
    var fnote=femNote(pool);
    if(fnote)out+='<p class="sub" style="margin:.4rem 0;line-height:1.5">'+esc(fnote)+"</p>";
    var cur=(state.devVoice||{})[code]||"";
    function row(v){
      var on=v?cur===v.voiceURI:!cur;
      var uri=v?v.voiceURI:"";
      return '<div class="vopt'+(on?" on":"")+'" data-a="devvoice" data-l="'+lg+'" data-u="'+esc(uri)+
        '" role="button" tabindex="0" aria-pressed="'+(on?"true":"false")+'">'+
        '<span style="flex:1"><span class="nm">'+esc(v?v.name:t("vAuto"))+'</span><br>'+
        '<span class="ds">'+esc(v?v.lang:t("vDevD"))+"</span></span>"+
        (v?'<button class="btn ghost" data-a="devsample" data-l="'+lg+'" data-u="'+esc(uri)+
           '" style="padding:.35rem .7rem;min-height:2.2rem;font-size:.82rem">'+
           ic("play",14)+" "+esc(t("vSample"))+"</button>":"")+"</div>";
    }
    out+='<div class="vgrid">'+row(null)+"</div>";

function vchkT(){ var g=state.lang||"he"; return VCHKMSG[g]||VCHKMSG.he }
function voiceCheck(){
  var M=vchkT();
  VCHK=M.sent; render();
  function show(m){ VCHK=m; render() }
  if(!("speechSynthesis" in window)){ show(M.noSup); return }
  var list=[]; try{ list=speechSynthesis.getVoices()||[] }catch(e){}
  try{ speechSynthesis.cancel() }catch(e){}
  var u;
  try{ u=new SpeechSynthesisUtterance(M.say) }
  catch(e){ show(M.mkFail+e.message); return }
  u.lang=(LANGS[state.lang||"he"]||LANGS.he).tts; u.volume=1; u.rate=1; u.pitch=1;
  var done=false;
  u.onstart=function(){ done=true; show(M.okN[0]+list.length+M.okN[1]) };
  u.onerror=function(e){ done=true;
    var er=(e&&e.error)||M.unk;
    if(er==="interrupted"||er==="canceled"){ show(M.ok); return }
    show(M.engine[0]+er+" · "+list.length+M.engine[1]); };
  try{ speechSynthesis.speak(u) }
  catch(e){ show(M.spFail+e.message); return }
  setTimeout(function(){ if(!done)
    show(M.timeout[0]+list.length+M.timeout[1]) },2000);
}

/* ------------------------------------------------------------
   דור ההקראה. speechSynthesis.cancel() אינו מבטל setTimeout:
   כרום יורה onend על האמירה שבוטלה, המקטע הבא נרשם בכל זאת,
   וכעבור SEG_GAP ההקראה הישנה חוזרת מעל החדשה — שני קולות
   במקביל. מונה אחד פותר את זה: כל הקראה מקבלת מספר, stopSpeak
   מקדם אותו, ומקטע מדור ישן פשוט אינו מדבר.
   ------------------------------------------------------------ */
var _sayGen=0;
function speakDevice(text,code,rate){
  if(!("speechSynthesis" in window))return false;
  try{speechSynthesis.cancel()}catch(e){}
  var my=++_sayGen;
  /* האמירה יוצאת מיד, בתוך הלחיצה. קודם היא נעטפה ב-voicesReady,
     שממתין לרשימת הקולות ועד ארבע שניות אם היא לא מגיעה — ואמירה
     שיוצאת ארבע שניות אחרי המגע נזרקת בשקט באנדרואיד ובספארי.
     כשהרשימה כבר כאן, בוחרים קול ומדברים. כשהיא ריקה — מדברים
     בכל זאת, עם u.lang בלבד: קול ברירת מחדל בשפה הנכונה עדיף על
     שתיקה, ויש מכשירים שמחזירים רשימה ריקה לצמיתות ומדברים היטב.
     voicesReady נשאר בשימוש למסך בחירת הקול, שם ההמתנה במקומה. */
  (function(){
    try{
      var v=bestVoice(code), lang=(v&&v.lang)||code;
      var segs=segments(String(text)), rt=tuneRate(lang,clamp(rate,0.55,1.4));
      var pit=femLift(v);
      (function sayseg(k){
        if(my!==_sayGen)return;   /* ההקראה הזאת בוטלה — המקטע הבא לא יוצא */
        if(k>=segs.length){ hlClear(); ttsOK(); return }
        var seg=segs[k];
        var u=new SpeechSynthesisUtterance(seg.text);
        u.lang=lang;
        if(v){ try{ u.voice=v }catch(e2){} }
        u.rate=rt; u.pitch=pit; u.volume=1;
        u.onboundary=function(e){if(!e.name||e.name==="word")hlAt(seg.start+e.charIndex)};
        u.onend=function(){
          if(k+1<segs.length) setTimeout(function(){sayseg(k+1)},SEG_GAP);
          else { hlClear(); ttsOK() }
        };
        u.onerror=function(e){ttsFail(e&&e.error)};
        speechSynthesis.speak(u);
      })(0);
    }catch(e){}
  })();
  return true;
}
/* lang: "en" לחומר הנלמד, או קוד שפת האם להוראה. */
function speak(text,lang,rateMul){
  /* כל טקסט שמגיע להקראה מנוקה מתגיות. חלק מהקריאות כבר מנקות
     לבד, וניקוי חוזר אינו משנה דבר — אבל בלעדיו כל מחרוזת שנשארה
     עם <sub> או <span class="frac"> הוקראה בקול כתגית: הסטודנט
     שמע "span class frac" באמצע השאלה. */
  text=plainOf(String(text||"")).trim(); if(!text)return;
  lang=lang||"en";
  var code=lang==="en"?EN_TTS:LANGS[lang].tts;
  var rate=clamp(state.rate*(rateMul||1),0.55,1.4);
  stopSpeak();
  var my=_sayGen;   /* גם תשובת רשת שמגיעה אחרי עצירה לא תושמע */
  if(gemOn()){
    var vid=gvOf(state.gemVoice).id;
    var ck=lang+"|"+vid+"|"+rate.toFixed(2)+"|"+text;
    if(gCache[ck]){playUrl(gCache[ck],text,code,rate);return}
    gBusy=true; renderSpeakState();
    gSynth(text,vid,rate,lang).then(function(u){
      if(my!==_sayGen)return;
      gCache[ck]=u; gBusy=false; renderSpeakState(); playUrl(u,text,code,rate);
    }).catch(function(){
      gBusy=false; renderSpeakState(); speakDevice(text,code,rate);
    });
    return;
  }
  speakDevice(text,code,rate);
}
function playUrl(url,text,code,rate){
  gStop();
  /* משתמשים באלמנט ששוחרר במגע ולא יוצרים חדש. */
  if(!GEL)GEL=new Audio();
  gAudio=GEL; gAudio.src=url;
  gAudio.play().catch(function(){speakDevice(text,code,rate)});
}
function stopSpeak(){_sayGen++;gStop();hlClear();try{if(window.speechSynthesis)speechSynthesis.cancel()}catch(e){}}
/* עוזבים את הדף — הקול נעצר. בלעדיו הוא ממשיך ברקע אחרי מעבר לטאב
   אחר, ולפעמים נתקע עד סגירת הדפדפן. */
try{document.addEventListener("visibilitychange",function(){
  if(document.hidden)stopSpeak();
});}catch(e){}
/* iOS לא ישמיע כלום עד שאמירה אחת יצאה מתוך handler של מגע אמיתי.
   אמירה אוטומטית בטעינת הדף נבלעת בשקט — בלי חריגה, בלי לוג, בלי
   דרך לדעת. משחררים פעם אחת עם אמירה ריקה.
   חשוב: קריאה ישירה, בלי voicesReady — הבטחה שוברת את שרשרת המגע
   ו-Safari כבר לא יזהה את האמירה כיוזמת משתמש. */
try{document.addEventListener("pointerdown",function(){
  try{speechSynthesis.speak(new SpeechSynthesisUtterance(""))}catch(e){}
  /* ואותו דבר לאלמנט השמע: מקור שקט, play בתוך המגע עצמו. */
  try{
    if(!GEL)GEL=new Audio();
    GEL.src=SILENT_WAV;
    var pr=GEL.play();
    if(pr&&pr.then)pr.then(function(){try{GEL.pause();GEL.currentTime=0}catch(e){}},function(){});
  }catch(e){}
},{once:true});}catch(e){}
function renderSpeakState(){
  var b=document.querySelectorAll(".spk");

/* ============================================================
   7. תוכן
   ------------------------------------------------------------
   בנק שאלות כתוב, ולא מחולל. באזרחות אין נוסחה שממנה נגזרת
   שאלה: הניסוח המדויק הוא החומר הנלמד, ומסיח שנבנה אוטומטית
   מנוסח אחר היה יוצא או מופרך מדי או נכון בעצמו.

   Q(id, q, opts, ok, hint, ex, fig)
     id   — מזהה יציב לפריט. הוא נכנס לסטטיסטיקה של הלומד, ולכן
            אסור לו להשתנות כשמוסיפים פריט לפניו.
     q    — נוסח השאלה, בארבע שפות.
     opts — ארבע תשובות, כל אחת בארבע שפות. תמיד ארבע: שלוש
            אפשרויות הן ניחוש של אחד משלושה.
     ok   — אינדקס התשובה הנכונה במערך opts (0..3). הסדר על
            המסך מעורבב בכל הצגה, ולכן האינדקס אינו רמז.
     hint — רמז שמכוון לחשיבה ואינו מוסר את התשובה.
     ex   — ההסבר שנפתח אחרי המענה, גם כשענו נכון.
     fig  — מפתח איור מתוך FIGS, או null. אופציונלי בהגדרה:
            רוב השאלות באזרחות הן טקסט בלבד.

   כל שדה קיים בארבע השפות. אזרחות נלמדת בשפת האם — מי שקורא
   בקושי בעברית לא ילמד ממנה מדרג נורמות, ולכן התוכן עצמו
   מתורגם ולא רק הממשק.

   מקור: תוכנית הלימודים של משרד החינוך במדע וטכנולוגיה לכול ומבנה שאלון מוט״ל 704182. הניסוח מקורי של בקול, עם קרדיט וקישור למשרד החינוך.
   השאלות נכתבו לאפליקציה הזאת ואינן העתק של בחינה.
   ============================================================ */
function Q(id,q,opts,ok,hint,ex,fig,wrong){
  return {id:id,q:q,o:opts,ok:ok,hint:hint,ex:ex,fig:fig||null,wrong:wrong||null};
}

topic("forces-motion-daily","704182",
  {"he": "כוחות ותנועה בחיי היומיום", "ar": "القوى والحركة في الحياة اليومية", "ru": "Силы и движение в повседневной жизни", "en": "Forces and motion in everyday life"},
  {"he": "מה גורם לגוף להאיץ, להאט או לשנות כיוון", "ar": "ما الذي يجعل الجسم يتسارع أو يتباطأ أو يغيّر اتجاهه", "ru": "Что заставляет тело ускоряться, тормозить или менять направление", "en": "What makes a body speed up, slow down or change direction"},
[ [
  Q("a1-inertia",{"he": "אוטובוס נוסע ובלם פתאום. הנוסעים הוטו קדימה. איזה עיקרון מסביר את זה?", "ar": "حافلة تسير وتوقفت فجأة، فمال الركاب إلى الأمام. أي مبدأ يفسّر ذلك؟", "ru": "Автобус ехал и резко затормозил, и пассажиры наклонились вперёд. Какой принцип это объясняет?", "en": "A moving bus brakes suddenly and the passengers lurch forward. Which principle explains this?"},[{"he": "כוח המנוע דוחף את הנוסעים קדימה גם בזמן בלימה.", "ar": "قوة المحرك تدفع الركاب إلى الأمام حتى أثناء الكبح.", "ru": "Сила мотора толкает пассажиров вперёд даже при торможении.", "en": "The engine's force pushes the passengers forward even during braking."},{"he": "הגוף נוטה להמשיך בתנועתו בגלל ההתמדה (אינרציה).", "ar": "الجسم يميل لمواصلة حركته بسبب القصور الذاتي.", "ru": "Тело стремится продолжать движение из-за инерции.", "en": "A body tends to keep moving because of inertia."},{"he": "כוח הכבידה גדל ברגע הבלימה ומושך את הנוסעים קדימה.", "ar": "قوة الجاذبية تزداد لحظة الكبح وتسحب الركاب إلى الأمام.", "ru": "Сила тяжести возрастает в момент торможения и тянет пассажиров вперёд.", "en": "Gravity increases at the moment of braking and pulls the passengers forward."},{"he": "לחץ האוויר בתא הנוסעים דוחף את האנשים לעבר הנהג.", "ar": "ضغط الهواء داخل الحافلة يدفع الناس نحو السائق.", "ru": "Давление воздуха в салоне толкает людей к водителю.", "en": "Air pressure in the cabin pushes people toward the driver."}],1,{"he": "חשבו מה קורה לגוף שנמצא בתנועה כשהכלי שמתחתיו נעצר.", "ar": "فكّروا ماذا يحدث لجسم متحرك عندما تتوقف المركبة التي تحته.", "ru": "Подумайте, что происходит с движущимся телом, когда транспорт под ним останавливается.", "en": "Think about what happens to a moving body when the vehicle beneath it stops."},{"he": "ההתמדה (אינרציה) היא הנטייה של גוף לשמור על מצב התנועה שלו. האוטובוס מאט, אבל גוף הנוסע ממשיך במהירות שהייתה לו, ולכן הוא נע קדימה ביחס לאוטובוס. למשל חגורת בטיחות עוצרת את הגוף יחד עם הרכב, ובלעדיה הגוף ממשיך לבד.", "ar": "القصور الذاتي هو ميل الجسم للمحافظة على حالة حركته. الحافلة تتباطأ، لكن جسم الراكب يواصل بالسرعة التي كانت له، فيتحرك إلى الأمام بالنسبة للحافلة. مثال: حزام الأمان يوقف الجسم مع المركبة، وبدونه يواصل الجسم وحده.", "ru": "Инерцией называют стремление тела сохранять состояние движения. Автобус замедляется, а тело пассажира продолжает двигаться с прежней скоростью, поэтому оно смещается вперёд относительно автобуса. Например, ремень безопасности останавливает тело вместе с машиной, а без него тело продолжает движение само.", "en": "Inertia is a body's tendency to keep its state of motion. The bus slows down, but the passenger's body keeps its previous speed, so it moves forward relative to the bus. For example, a seat belt stops the body together with the vehicle; without it the body keeps going alone."},null,[{"he": "בזמן בלימה המנוע אינו דוחף קדימה; ההטיה מגיעה מתנועת הגוף עצמו.", "ar": "أثناء الكبح لا يدفع المحرك إلى الأمام؛ الميلان ناتج عن حركة الجسم نفسه.", "ru": "При торможении мотор не толкает вперёд; наклон возникает из-за движения самого тела.", "en": "During braking the engine does not push forward; the lurch comes from the body's own motion."},null,{"he": "כוח הכבידה פועל מטה כל הזמן, ואינו משתנה ברגע הבלימה.", "ar": "الجاذبية تعمل نحو الأسفل طوال الوقت ولا تتغير لحظة الكبح.", "ru": "Сила тяжести действует вниз всегда и не меняется в момент торможения.", "en": "Gravity pulls downward at all times and does not change when the bus brakes."},{"he": "האוויר בתא נע יחד עם האוטובוס, ואינו דוחף אנשים קדימה.", "ar": "الهواء داخل الحافلة يتحرك معها ولا يدفع الناس إلى الأمام.", "ru": "Воздух в салоне движется вместе с автобусом и не толкает людей вперёд.", "en": "The air in the cabin moves with the bus and does not push people forward."}]),
  Q("a1-friction",{"he": "נהג מנסה לעצור ברחוב מכוסה קרח, ומרחק הבלימה מתארך מאוד. מה הסיבה?", "ar": "سائق يحاول التوقف في شارع مغطى بالجليد، فيطول طريق الكبح جدًا. ما السبب؟", "ru": "Водитель тормозит на обледенелой улице, и тормозной путь сильно растёт. В чём причина?", "en": "A driver tries to stop on an icy street and the braking distance grows very long. Why?"},[{"he": "כוח הכבידה על המכונית קטן בגלל הקר.", "ar": "قوة الجاذبية على السيارة تقل بسبب البرد.", "ru": "Сила тяжести на машину уменьшается из-за холода.", "en": "Gravity on the car weakens because of the cold."},{"he": "האוויר הקר מונע מהמנוע לבלום בזמן.", "ar": "الهواء البارد يمنع المحرك من الكبح في الوقت المناسب.", "ru": "Холодный воздух мешает мотору затормозить вовремя.", "en": "The cold air stops the engine from braking in time."},{"he": "החיכוך בין הגלגלים לכביש כמעט מתאפס, ולכן קשה להאט.", "ar": "الاحتكاك بين العجلات والطريق يكاد يختفي، لذلك يصعب التباطؤ.", "ru": "Трение между колёсами и дорогой почти исчезает, поэтому трудно замедлиться.", "en": "Friction between the wheels and the road nearly vanishes, so slowing down is hard."},{"he": "הקרח דוחף את המכונית קדימה ומאריך את הבלימה.", "ar": "الجليد يدفع السيارة إلى الأمام ويطيل الكبح.", "ru": "Лёд толкает машину вперёд и удлиняет торможение.", "en": "The ice pushes the car forward and lengthens braking."}],2,{"he": "מה משתנה במגע שבין הגלגל לכביש?", "ar": "ما الذي يتغير في التلامس بين العجلة والطريق؟", "ru": "Что меняется в контакте колеса с дорогой?", "en": "What changes in the contact between wheel and road?"},{"he": "בלימה מסתמכת על חיכוך בין הגלגלים לכביש. על קרח החיכוך קטן מאוד, הכוח שמאט את המכונית קטן, והיא ממשיכה להחליק. למשל מפזרים חול על כביש מכוסה קרח כדי להגדיל את החיכוך.", "ar": "الكبح يعتمد على الاحتكاك بين العجلات والطريق. على الجليد يكون الاحتكاك صغيرًا جدًا، فتصغر القوة المبطئة وتواصل السيارة الانزلاق. مثال: يُنثر الرمل على الطريق المجلد لزيادة الاحتكاك.", "ru": "Торможение опирается на трение между колёсами и дорогой. На льду трение очень мало, тормозящая сила мала, и машина продолжает скользить. Например, на обледенелую дорогу насыпают песок, чтобы увеличить трение.", "en": "Braking relies on friction between the wheels and the road. On ice friction is very small, the slowing force is small, and the car keeps sliding. For example, sand is spread on icy roads to increase friction."},null,[{"he": "כוח הכבידה לא תלוי בטמפרטורה, והמסה לא משתנה בגלל קר.", "ar": "الجاذبية لا تتعلق بدرجة الحرارة، والكتلة لا تتغير بالبرد.", "ru": "Сила тяжести не зависит от температуры, и масса не меняется от холода.", "en": "Gravity does not depend on temperature, and mass does not change with cold."},{"he": "המנוע אינו הבולם; הבלמים פועלים על הגלגלים בכל מזג אוויר.", "ar": "المحرك ليس هو الكابح؛ الفرامل تعمل على العجلات في كل طقس.", "ru": "Мотор не тормозит колёса; тормоза работают в любую погоду.", "en": "The engine is not the brake; the brakes act on the wheels in any weather."},null,{"he": "קרח אינו מפעיל כוח דוחף; הוא רק מקטין את החיכוך.", "ar": "الجليد لا يطبق قوة دافعة؛ هو فقط يقلل الاحتكاك.", "ru": "Лёд не создаёт толкающую силу; он только уменьшает трение.", "en": "Ice applies no pushing force; it only reduces friction."}]),
  Q("a1-newton3",{"he": "ילדה דוחפת קיר בידיים ומרגישה שהקיר דוחף אותה בחזרה. מה אומר החוק השלישי של ניוטון?", "ar": "فتاة تدفع جدارًا بيديها وتشعر أن الجدار يدفعها للخلف. ماذا يقول قانون نيوتن الثالث؟", "ru": "Девочка толкает стену руками и чувствует, что стена толкает её обратно. Что говорит третий закон Ньютона?", "en": "A girl pushes a wall with her hands and feels the wall push back. What does Newton's third law say?"},[{"he": "הקיר מפעיל על הידיים כוח שווה בגודלו והפוך בכיוונו.", "ar": "الجدار يطبق على اليدين قوة مساوية في المقدار ومعاكسة في الاتجاه.", "ru": "Стена действует на руки с силой, равной по величине и противоположной по направлению.", "en": "The wall pushes the hands with a force equal in size and opposite in direction."},{"he": "הקיר לא מפעיל שום כוח, כי הוא לא זז.", "ar": "الجدار لا يطبق أي قوة لأنه لا يتحرك.", "ru": "Стена не действует силой, потому что не движется.", "en": "The wall applies no force because it does not move."},{"he": "הכוח של הילדה גדול מהכוח של הקיר, ולכן מרגישים לחץ.", "ar": "قوة الفتاة أكبر من قوة الجدار، لذلك يُشعر بالضغط.", "ru": "Сила девочки больше силы стены, поэтому чувствуется давление.", "en": "The girl's force is greater than the wall's, so pressure is felt."},{"he": "כוחות פועלים רק כששני הגופים נעים.", "ar": "القوى تعمل فقط عندما يتحرك الجسمان.", "ru": "Силы действуют, только когда оба тела движутся.", "en": "Forces act only when both bodies are moving."}],0,{"he": "שימו לב לזוג הכוחות: מי מפעיל כוח על מי.", "ar": "لاحظوا زوج القوى: مَن يؤثر بقوة على مَن.", "ru": "Обратите внимание на пару сил: кто на кого действует.", "en": "Notice the pair of forces: who acts on whom."},{"he": "החוק השלישי: כשגוף אחד מפעיל כוח על גוף שני, הגוף השני מפעיל על הראשון כוח שווה והפוך. הכוחות פועלים על גופים שונים, ולכן אינם מבטלים זה את זה. למשל רקדנית על הקרח שדוחפת את המעקה נעה אחורה.", "ar": "القانون الثالث: عندما يؤثر جسم بقوة على جسم آخر، يؤثر الأخير على الأول بقوة مساوية ومعاكسة. القوتان تؤثران على جسمين مختلفين، لذلك لا تلغي إحداهما الأخرى. مثال: متزلجة على الجليد تدفع الحاجز فتتحرك للخلف.", "ru": "Третий закон: когда одно тело действует силой на другое, второе действует на первое с равной и противоположной силой. Силы приложены к разным телам, поэтому не уничтожают друг друга. Например, фигуристка, оттолкнувшая бортик, поедет назад.", "en": "The third law: when one body pushes another, the second pushes back on the first with an equal and opposite force. The forces act on different bodies, so they do not cancel each other. For example, an ice skater who pushes the railing slides backward."},null,[null,{"he": "גוף יכול להפעיל כוח גם בלי לזוז; הקיר לוחץ בחזרה על הידיים.", "ar": "الجسم قد يطبق قوة دون أن يتحرك؛ الجدار يضغط على اليدين بالمقابل.", "ru": "Тело может действовать силой, не двигаясь; стена давит на руки в ответ.", "en": "A body can apply force without moving; the wall presses back on the hands."},{"he": "לפי החוק השלישי הכוחות שווים תמיד בגודלם; ההבדל הוא בתחושה, לא בגודל.", "ar": "بحسب القانون الثالث القوتان متساويتان دائمًا؛ الفرق في الإحساس لا في المقدار.", "ru": "По третьему закону силы всегда равны; различие в ощущении, а не в величине.", "en": "By the third law the forces are always equal; the difference is in the feeling, not the size."},{"he": "כוחות פועלים גם במנוחה; ספר על שולחן לוחץ עליו והשולחן לוחץ בחזרה.", "ar": "القوى تعمل أيضًا في السكون؛ كتاب على طاولة يضغط عليها وهي تضغط بالمقابل.", "ru": "Силы действуют и в покое: книга на столе давит на него, а стол на книгу.", "en": "Forces also act at rest: a book on a table presses it, and the table presses back."}])
 ],
 [
  Q("a1-motion-table",{"he": "תלמידה מדדה את מיקום עגלת צעצוע בכל שנייה: 0, 2, 4, 6, 8 מטר אחרי 0, 1, 2, 3, 4 שניות. איזה תיאור מתאים לתנועה?", "ar": "قاسَت طالبة موضع عربة لعبة كل ثانية: 0، 2، 4، 6، 8 أمتار بعد 0، 1، 2، 3، 4 ثوانٍ. أي وصف يناسب الحركة؟", "ru": "Ученица измеряла положение игрушечной тележки каждую секунду: 0, 2, 4, 6, 8 м после 0, 1, 2, 3, 4 с. Какое описание подходит движению?", "en": "A student measured a toy cart's position every second: 0, 2, 4, 6, 8 meters after 0, 1, 2, 3, 4 seconds. Which description fits the motion?"},[{"he": "העגלה מאיצה, כי המרחקים בטבלה גדלים.", "ar": "العربة تتسارع لأن المسافات في الجدول تكبر.", "ru": "Тележка ускоряется, потому что расстояния в таблице растут.", "en": "The cart accelerates because the distances in the table grow."},{"he": "העגלה מאטה, כי ההפרשים בין המדידות קטנים.", "ar": "العربة تتباطأ لأن الفروق بين القياسات صغيرة.", "ru": "Тележка замедляется, потому что промежутки между измерениями малы.", "en": "The cart slows down because the gaps between measurements are small."},{"he": "העגלה נעה לאחור, כי המספרים מתחילים מאפס.", "ar": "العربة تتحرك للخلف لأن الأرقام تبدأ من الصفر.", "ru": "Тележка движется назад, потому что числа начинаются с нуля.", "en": "The cart moves backward because the numbers start from zero."},{"he": "מהירות קבועה: בכל שנייה העגלה עוברת מרחק שווה.", "ar": "سرعة ثابتة: العربة تقطع مسافة متساوية كل ثانية.", "ru": "Скорость постоянна: тележка проходит равный путь каждую секунду.", "en": "Constant speed: the cart covers an equal distance every second."}],3,{"he": "בדקו את ההפרש בין מדידה למדידה, לא רק את המספרים עצמם.", "ar": "افحصوا الفرق بين كل قياسين، وليس الأرقام وحدها.", "ru": "Проверьте разницу между соседними измерениями, а не только сами числа.", "en": "Check the difference between consecutive measurements, not only the numbers themselves."},{"he": "במהירות קבועה הגוף עובר מרחקים שווים בזמנים שווים. כאן העגלה מתקדמת 2 מטר בכל שנייה, כלומר 2 מטר לשנייה לאורך כל המדידה. למשל רכבת שנעה 20 מטר בכל שנייה נוסעת במהירות קבועה של 20 מטר לשנייה.", "ar": "بالسرعة الثابتة يقطع الجسم مسافات متساوية في أزمنة متساوية. هنا تتقدم العربة مترين كل ثانية، أي مترين في الثانية طوال القياس. مثال: قطار يقطع 20 مترًا كل ثانية يسير بسرعة ثابتة 20 مترًا في الثانية.", "ru": "При постоянной скорости тело проходит равные пути за равное время. Здесь тележка проходит 2 м каждую секунду, то есть 2 м/с на всём измерении. Например, поезд, проходящий 20 м каждую секунду, едет с постоянной скоростью 20 м/с.", "en": "At constant speed a body covers equal distances in equal times. Here the cart advances 2 meters every second, that is 2 meters per second throughout. For example, a train covering 20 meters every second moves at a constant 20 meters per second."},null,[{"he": "בהאצה המהירות משתנה, וההפרשים היו גדלים ממדידה למדידה.", "ar": "في التسارع تتغير السرعة، وكانت الفروق ستكبر من قياس لقياس.", "ru": "При ускорении скорость меняется, и промежутки росли бы от измерения к измерению.", "en": "With acceleration the speed changes, and the gaps would grow from one measurement to the next."},{"he": "בהאטה ההפרשים היו קטנים עד אפס, וכאן הם קבועים.", "ar": "في التباطؤ كانت الفروق ستصغر حتى الصفر، وهنا هي ثابتة.", "ru": "При торможении промежутки уменьшались бы до нуля, а здесь они постоянны.", "en": "When slowing down the gaps would shrink to zero; here they stay the same."},{"he": "המיקום גדל בכיוון אחד בלבד, ואין סימן לתנועה לאחור.", "ar": "الموضع يزداد في اتجاه واحد فقط، ولا علامة على حركة للخلف.", "ru": "Положение растёт в одном направлении, признаков движения назад нет.", "en": "The position grows in one direction only; there is no sign of backward motion."},null]),
  Q("a1-elevator",{"he": "אדם עומד על משקל בתוך מעלית. המעלית מתחילה להאיץ כלפי מעלה. מה יראה המשקל באותו רגע?", "ar": "شخص يقف على ميزان داخل مصعد. بدأ المصعد يتسارع نحو الأعلى. ماذا سيُظهر الميزان في تلك اللحظة؟", "ru": "Человек стоит на весах в лифте. Лифт начинает ускоряться вверх. Что покажут весы в этот момент?", "en": "A person stands on a scale inside an elevator. The elevator starts accelerating upward. What will the scale show at that moment?"},[{"he": "קריאה נמוכה מהרגיל, כי המעלית לוקחת חלק מהמשקל.", "ar": "قراءة أقل من المعتاد، لأن المصعد يأخذ جزءًا من الوزن.", "ru": "Показание ниже обычного, потому что лифт забирает часть веса.", "en": "A lower reading than usual, because the elevator takes part of the weight."},{"he": "קריאה גבוהה מהרגיל, כי הרצפה לוחצת עליו חזק יותר בהאצה מעלה.", "ar": "قراءة أعلى من المعتاد، لأن الأرضية تضغط عليه بقوة أكبر عند التسارع للأعلى.", "ru": "Показание выше обычного: пол давит сильнее при ускорении вверх.", "en": "A higher reading than usual, because the floor presses harder when accelerating upward."},{"he": "אותה קריאה בדיוק, כי משקל האדם לא משתנה בתנועה.", "ar": "نفس القراءة تمامًا، لأن وزن الشخص لا يتغير بالحركة.", "ru": "Точно то же показание, ведь вес человека не меняется в движении.", "en": "Exactly the same reading, because the person's weight does not change in motion."},{"he": "אפס, כי בתנועה אין משקל בכלל.", "ar": "صفر، لأنه لا يوجد وزن أثناء الحركة.", "ru": "Ноль, потому что в движении веса нет.", "en": "Zero, because there is no weight while moving."}],1,{"he": "המשקל מודד את הלחץ של הרצפה על הרגליים, לא את המסה.", "ar": "الميزان يقيس ضغط الأرضية على القدمين، لا الكتلة.", "ru": "Весы измеряют давление пола на ноги, а не массу.", "en": "The scale measures the floor's push on the feet, not the mass."},{"he": "המשקל מודד את הכוח שהרצפה מפעילה על האדם. כשהמעלית מאיצה מעלה, הרצפה צריכה כוח גדול מכוח הכבידה כדי להאיץ את האדם יחד איתה, והקריאה גדלה. למשל ברגע הזינוק של מעלית מרגישים לחץ קל בברכיים.", "ar": "الميزان يقيس القوة التي تطبقها الأرضية على الشخص. عندما يتسارع المصعد للأعلى، تحتاج الأرضية قوة أكبر من الجاذبية لتسريع الشخص معها، فتكبر القراءة. مثال: لحظة انطلاق المصعد نشعر بضغط خفيف في الركب.", "ru": "Весы измеряют силу, с которой пол давит на человека. Когда лифт ускоряется вверх, полу нужна сила больше силы тяжести, чтобы ускорить человека вместе с собой, и показание растёт. Например, в момент старта лифта чувствуется лёгкое давление в коленях.", "en": "The scale measures the force the floor applies to the person. When the elevator accelerates upward, the floor needs a force greater than gravity to accelerate the person along with it, so the reading grows. For example, at the elevator's takeoff you feel a slight pressure in your knees."},null,[{"he": "קריאה נמוכה מופיעה דווקא כשהמעלית מאיצה כלפי מטה.", "ar": "القراءة الأقل تظهر بالعكس عند تسارع المصعد نحو الأسفل.", "ru": "Показание ниже обычного бывает как раз при ускорении вниз.", "en": "A lower reading appears exactly when the elevator accelerates downward."},null,{"he": "המסה לא משתנה, אבל המשקל מודד כוח נורמלי, והוא כן משתנה בהאצה.", "ar": "الكتلة لا تتغير، لكن الميزان يقيس القوة العمودية وهي تتغير مع التسارع.", "ru": "Масса не меняется, но весы измеряют силу реакции опоры, а она при ускорении меняется.", "en": "Mass stays the same, but the scale measures the normal force, which does change with acceleration."},{"he": "אפס יופיע רק בנפילה חופשית מלאה, לא בהאצה מעלה.", "ar": "الصفر يظهر فقط في السقوط الحر الكامل، لا في التسارع للأعلى.", "ru": "Ноль появится только в полном свободном падении, а не при ускорении вверх.", "en": "Zero appears only in full free fall, not when accelerating upward."}]),
  Q("a1-braking",{"he": "במבחני בטיחות נמדד: רכב ב-50 קמ״ש עוצר אחרי 12 מטר, ואותו רכב ב-100 קמ״ש עוצר אחרי 48 מטר. איזו מסקנה נכונה?", "ar": "في اختبارات السلامة قيس: سيارة بسرعة 50 كم/س تتوقف بعد 12 مترًا، ونفسها بسرعة 100 كم/س تتوقف بعد 48 مترًا. أي استنتاج صحيح؟", "ru": "В испытаниях безопасности измерили: машина на 50 км/ч останавливается через 12 м, та же машина на 100 км/ч через 48 м. Какой вывод верен?", "en": "Safety tests measured: a car at 50 km/h stops after 12 meters, the same car at 100 km/h stops after 48 meters. Which conclusion is correct?"},[{"he": "מרחק הבלימה גדל פי 2 כשהמהירות גדלה פי 2.", "ar": "طريق الكبح يتضاعف مرتين عند مضاعفة السرعة.", "ru": "Тормозной путь растёт в 2 раза при удвоении скорости.", "en": "Braking distance doubles when speed doubles."},{"he": "מרחק הבלימה תלוי רק במשקל הרכב.", "ar": "طريق الكبح يعتمد فقط على وزن السيارة.", "ru": "Тормозной путь зависит только от массы машины.", "en": "Braking distance depends only on the car's weight."},{"he": "המרחק גדל בערך פי 4 כשהמהירות מוכפלת.", "ar": "المسافة تكبر نحو أربع مرات عند مضاعفة السرعة.", "ru": "Путь растёт примерно в 4 раза при удвоении скорости.", "en": "The distance grows about fourfold when the speed doubles."},{"he": "המדידות סותרות זו את זו, ולכן אי אפשר להסיק מסקנה.", "ar": "القياسات متناقضة، لذلك لا يمكن استنتاج شيء.", "ru": "Измерения противоречат друг другу, поэтому вывода нет.", "en": "The measurements contradict each other, so no conclusion is possible."}],2,{"he": "חשבו את היחס בין שני המרחקים, לא את ההפרש.", "ar": "احسبوا النسبة بين المسافتين، لا الفرق بينهما.", "ru": "Посчитайте отношение двух путей, а не разность.", "en": "Work out the ratio of the two distances, not the difference."},{"he": "המרחק גדל מ-12 ל-48 מטר, כלומר פי 4, כשהמהירות הוכפלה. מרחק הבלימה קשור לאנרגיית התנועה, והיא גדלה עם ריבוע המהירות. למשל נהיגה ב-120 קמ״ש דורשת מרחק בלימה גדול בהרבה מפי 2 מ-60 קמ״ש.", "ar": "المسافة كبرت من 12 إلى 48 مترًا، أي أربع مرات، عندما تضاعفت السرعة. طريق الكبح مرتبط بطاقة الحركة، وهي تكبر مع مربع السرعة. مثال: القيادة بسرعة 120 كم/س تتطلب طريق كبح أكبر بكثير من ضعف ما عند 60 كم/س.", "ru": "Путь вырос с 12 до 48 м, то есть в 4 раза, при удвоении скорости. Тормозной путь связан с кинетической энергией, а она растёт с квадратом скорости. Например, езда на 120 км/ч требует тормозного пути гораздо больше, чем вдвое большего, чем на 60 км/ч.", "en": "The distance grew from 12 to 48 meters, four times, when the speed doubled. Braking distance is tied to kinetic energy, which grows with the square of speed. For example, driving at 120 km/h needs a braking distance far more than twice that at 60 km/h."},null,[{"he": "פי 2 היה נותן 24 מטר בלבד, והמדידה היא 48.", "ar": "الضعفان كان سيعطي 24 مترًا فقط، والقياس 48.", "ru": "Двукратный рост дал бы 24 м, а измерено 48.", "en": "Doubling would give only 24 meters; the measurement is 48."},{"he": "שתי המדידות הן על אותו רכב, והמרחק משתנה דווקא עם המהירות.", "ar": "القياسان لنفس السيارة، والمسافة تتغير تحديدًا مع السرعة.", "ru": "Оба измерения на одной машине, а путь меняется именно со скоростью.", "en": "Both measurements are for the same car, and the distance changes precisely with speed."},null,{"he": "שתי מדידות עקביות מספיקות כדי לראות מגמה ברורה.", "ar": "قياسان متسقان يكفيان لرؤية اتجاه واضح.", "ru": "Двух согласованных измерений достаточно, чтобы увидеть ясную закономерность.", "en": "Two consistent measurements are enough to see a clear pattern."}])
