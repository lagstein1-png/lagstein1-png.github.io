  [
    Q("env-issues-3-1",{"he":"נמדדו חלקיקים באותו רחוב ב-02:00 וב-08:00. ב-08:00 הריכוז היה פי שלושה, ובאותה שעה גם התנועה הייתה כבדה יותר. איזה הסבר מתאים לנתונים?","ar":"قيس تركيز الجسيمات في الشارع نفسه عند 02:00 و08:00. كان التركيز عند 08:00 ثلاثة أضعاف، وكانت حركة المرور أكثر ازدحامًا. أي تفسير يلائم البيانات؟","ru":"В одной улице измерили частицы в 02:00 и 08:00. В 08:00 их было втрое больше, и движение было интенсивнее. Какое объяснение согласуется с данными?","en":"Particles were measured on the same street at 02:00 and 08:00. At 08:00 the level was three times higher, and traffic was heavier. Which explanation fits the data?"},[{"he":"תנועת הבוקר עשויה לתרום לעלייה","ar":"قد تسهم حركة الصباح في الارتفاع","ru":"Утреннее движение могло способствовать росту","en":"Morning traffic may contribute to the rise"},{"he":"מכשיר המדידה התקלקל בלילה","ar":"تعطل جهاز القياس ليلًا","ru":"Ночью измеритель сломался","en":"The measuring device broke at night"},{"he":"השמש בבוקר יצרה את כל החלקיקים","ar":"أنتجت شمس الصباح كل الجسيمات","ru":"Утреннее солнце создало все частицы","en":"The morning sun created all the particles"},{"he":"גשם ירד בלילה וניקה את הרחוב","ar":"هطل المطر ليلًا ونظّف الشارع","ru":"Ночной дождь очистил улицу","en":"Rain fell at night and cleaned the street"}],0,{"he":"השוו בין שני הדברים שנמדדו, והבחינו בין הסבר אפשרי לבין הוכחה מוחלטת.","ar":"قارنوا الأمرين المقاسَين وميّزوا بين تفسير محتمل وإثبات قاطع.","ru":"Сопоставьте два наблюдения и различайте возможное объяснение и доказанную причину.","en":"Compare the two observations and distinguish a possible explanation from proof."},{"he":"העלייה בתנועת כלי הרכב מתאימה לעלייה בחלקיקים, כי כלי רכב יכולים לפלוט חלקיקים וגם להעלות אבק מן הכביש. זו התאמה, לא הוכחה שהתנועה היא הסיבה היחידה. למשל, מדידה ליד צומת בבוקר עשויה להיות גבוהה מזו שבאמצע הלילה.","ar":"ازدياد حركة المركبات يلائم ازدياد الجسيمات، لأن المركبات قد تطلق جسيمات وتثير غبار الطريق أيضًا. هذه ملاءمة وليست دليلًا على أن المرور هو السبب الوحيد. مثلًا، قد تكون القراءة قرب تقاطع صباحًا أعلى منها بعد منتصف الليل.","ru":"Рост движения согласуется с ростом частиц: транспорт выбрасывает частицы и поднимает дорожную пыль. Это соответствие, а не доказательство, что движение - единственная причина. Например, утром на перекрёстке показатель может быть выше, чем глубокой ночью.","en":"Heavier traffic fits a rise in particles: vehicles can emit particles and stir up road dust. This is a match, not proof that traffic is the only cause. For example, a morning reading near a junction may be higher than a late-night one."},null,[null,{"he":"לא נמסר שמכשיר המדידה התקלקל, ואין בנתונים סימן לתקלה.","ar":"لم يُذكر أن جهاز القياس تعطل، ولا تدل البيانات على عطل.","ru":"О поломке прибора не сказано, и данные на неё не указывают.","en":"No equipment failure is reported or indicated by the data."},{"he":"אור השמש לבדו אינו יוצר את כל החלקיקים שנמדדו ברחוב.","ar":"ضوء الشمس وحده لا ينتج كل الجسيمات المقاسة في الشارع.","ru":"Солнечный свет сам по себе не создаёт все измеренные уличные частицы.","en":"Sunlight alone does not create all the measured street particles."},{"he":"אין בנתונים מידע על גשם בלילה, ולכן אי אפשר להסיק שירד גשם.","ar":"لا تتضمن البيانات معلومات عن مطر ليلًا، فلا يمكن استنتاج أنه هطل.","ru":"Данных о ночном дожде нет, поэтому нельзя утверждать, что он шёл.","en":"The data say nothing about overnight rain, so it cannot be inferred."}]),
    Q("env-issues-3-2",{"he":"עיר שוקלת להגדיל את כמות מי הים שהיא מתפילה. איזה אתגר עליה להביא בחשבון?","ar":"تدرس مدينة زيادة كمية ماء البحر التي تحلّيها. أي تحدٍّ عليها أن تأخذه في الحسبان؟","ru":"Город хочет опреснять больше морской воды. Какую трудность нужно учесть?","en":"A city plans to desalinate more seawater. Which challenge should it account for?"},[{"he":"המלח הופך את הגשם למלוח","ar":"يجعل الملح المطر مالحًا","ru":"Соль делает дождь солёным","en":"The salt makes rain salty"},{"he":"כל מי הים הופכים למתוקים","ar":"تصبح كل مياه البحر عذبة","ru":"Вся морская вода становится пресной","en":"All seawater becomes fresh"},{"he":"מפלס הכנרת יורד בגלל ההתפלה","ar":"ينخفض منسوب بحيرة طبريا بسبب التحلية","ru":"Из-за опреснения падает уровень Кинерета","en":"Desalination lowers the Sea of Galilee"},{"he":"המשאבות צורכות הרבה חשמל","ar":"تستهلك المضخات كهرباء كثيرة","ru":"Насосы потребляют много электроэнергии","en":"The pumps use substantial electricity"}],3,{"he":"חשבו מה נדרש כדי להפעיל תהליך שבו מים עוברים במחסום תחת לחץ.","ar":"فكّروا بما يلزم لتشغيل عملية يمر فيها الماء عبر حاجز تحت الضغط.","ru":"Подумайте, что нужно для процесса, в котором вода проходит через барьер под давлением.","en":"Think about what a process needs to move water through a barrier under pressure."},{"he":"באוסמוזה הפוכה משאבות יוצרות לחץ גבוה כדי להעביר מים דרך קרומים. הפעלתן דורשת חשמל, ולכן גם מקור החשמל חשוב להשפעה הסביבתית. למשל, הגדלת התפוקה במתקן התפלה מחייבת לתכנן גם את אספקת החשמל שלו.","ar":"في التناضح العكسي تصنع المضخات ضغطًا عاليًا لتمرير الماء عبر الأغشية. تشغيلها يحتاج إلى الكهرباء، ولذلك يؤثر مصدر الكهرباء في الأثر البيئي. مثلًا، زيادة إنتاج محطة تحلية تتطلب تخطيط إمدادها بالكهرباء أيضًا.","ru":"При обратном осмосе насосы создают высокое давление, проталкивая воду через мембраны. Им нужно электричество, а значит, источник энергии влияет на экологический след. Например, увеличивая выпуск опреснительной станции, нужно спланировать и её электроснабжение.","en":"In reverse osmosis, pumps create high pressure to push water through membranes. They need electricity, so the power source also affects the environmental impact. For example, increasing a desalination plant’s output requires planning its electricity supply."},null,[{"he":"המלח המופרד אינו הופך את הגשם למלוח.","ar":"الملح المفصول لا يجعل المطر مالحًا.","ru":"Отделённая соль не делает дождь солёным.","en":"Separated salt does not make rain salty."},{"he":"רק מים שנשאבים ומטופלים עוברים התפלה, לא כל מי הים.","ar":"تُحلّى المياه التي تُسحب وتُعالَج فقط، لا البحر كله.","ru":"Опресняют только забранную и обработанную воду, а не всё море.","en":"Only the water drawn and treated is desalinated, not the entire sea."},{"he":"התפלת מי ים אינה שואבת מים מהכנרת, ולכן אינה מורידה ישירות את מפלסה.","ar":"تحلية ماء البحر لا تسحب الماء من بحيرة طبريا، فلا تخفض منسوبها مباشرة.","ru":"Опреснение морской воды не забирает воду из Кинерета и не снижает его уровень напрямую.","en":"Seawater desalination does not draw water from the Sea of Galilee, so it does not directly lower its level."},null]),
    Q("env-issues-3-3",{"he":"יישוב רוצה להסתמך רק על פאנלים סולאריים לאספקת חשמל בכל שעות היממה. מה הקושי המרכזי בתוכנית?","ar":"تريد بلدة الاعتماد على الألواح الشمسية وحدها لتوفير الكهرباء طوال اليوم. ما الصعوبة الرئيسية؟","ru":"Посёлок хочет получать электричество круглосуточно только от солнечных панелей. В чём главная трудность?","en":"A town wants to rely only on solar panels for electricity around the clock. What is the main difficulty?"},[{"he":"פאנלים פולטים עשן בשעות החמות","ar":"تطلق الألواح دخانًا في الحر","ru":"В жару панели выделяют дым","en":"Panels release smoke when hot"},{"he":"בלילה אין ייצור ונדרש גיבוי או אגירה","ar":"ليلًا لا إنتاج، وتلزم بطاريات أو مصدر بديل","ru":"Ночью нет выработки; нужны накопители или резерв","en":"At night there is no output; storage or backup is needed"},{"he":"פאנלים מסוגלים להאיר רק פנסי רחוב","ar":"يمكن للألواح إنارة أعمدة الشوارع فقط","ru":"Панели способны питать только фонари","en":"Panels can power only streetlights"},{"he":"פאנלים מפסיקים לעבוד אחרי יום שמש אחד","ar":"تتوقف الألواح بعد يوم مشمس واحد","ru":"Панели перестают работать после одного солнечного дня","en":"Panels stop working after one sunny day"}],1,{"he":"בדקו מתי מקור האנרגיה זמין, והאם הביקוש לחשמל נגמר באותה שעה.","ar":"افحصوا متى يتوفر مصدر الطاقة، وهل ينتهي الطلب على الكهرباء عندها.","ru":"Подумайте, когда доступен источник энергии и заканчивается ли тогда потребность в электричестве.","en":"Consider when the energy source is available and whether electricity demand ends then."},{"he":"פאנלים סולאריים מייצרים חשמל מאור, ולכן בלילה אינם מייצרים; גם עננות מפחיתה את התפוקה. כדי לספק חשמל רצוף צריך אגירה, מקור נוסף או שילוב שלהם. למשל, חשמל מפאנלים בצהריים יכול להיטען בסוללה לשימוש בערב.","ar":"تنتج الألواح الشمسية الكهرباء من الضوء، لذلك لا تنتج ليلًا؛ والغيوم تقلل إنتاجها أيضًا. لتوفير الكهرباء باستمرار تلزم وسائل تخزين أو مصدر آخر أو كلاهما. مثلًا، يمكن تخزين كهرباء الظهر في بطارية للاستخدام مساءً.","ru":"Панели вырабатывают электричество из света, поэтому ночью не работают, а облачность снижает выработку. Для постоянного снабжения нужны накопители, другой источник или их сочетание. Например, дневную солнечную энергию можно запасти в батарее на вечер.","en":"Solar panels generate from light, so they produce none at night; clouds also reduce output. Continuous supply needs storage, another source, or both. For example, midday solar power can charge a battery for evening use."},null,[{"he":"פאנלים אינם שורפים דלק בזמן הפעולה ולכן אינם פולטים עשן בגלל החום.","ar":"الألواح لا تحرق وقودًا أثناء التشغيل، لذا لا تطلق دخانًا بسبب الحر.","ru":"Панели при работе не сжигают топливо и не выделяют дым из-за жары.","en":"Panels do not burn fuel in operation or release smoke because of heat."},null,{"he":"חשמל מפאנלים יכול לשמש מכשירים רבים, לא רק תאורת רחוב.","ar":"يمكن لكهرباء الألواح تشغيل أجهزة كثيرة، لا إنارة الشوارع فقط.","ru":"Электричество от панелей питает разные устройства, а не только фонари.","en":"Solar electricity can power many devices, not just streetlights."},{"he":"פאנלים אינם מפסיקים לעבוד אחרי יום אחד; הייצור תלוי באור ובמצב המערכת.","ar":"لا تتوقف الألواح بعد يوم واحد؛ يعتمد إنتاجها على الضوء وحالة النظام.","ru":"Панели не прекращают работу через день; выработка зависит от света и состояния системы.","en":"Panels do not stop after one day; output depends on light and system condition."}]),
    Q("ev-3-01",{"he":"בסקר נמצא שבשכונות עם יותר עצים, התושבים מדווחים על פחות ימים חמים מדי. מישהו טוען שהעצים הם הסיבה היחידה לכך. מה הבעיה בטענה?","ar":"وجد مسح أن سكان الأحياء التي فيها أشجار أكثر يبلّغون عن أيام حارّة جدًا أقل. يدّعي شخص أن الأشجار هي السبب الوحيد لذلك. ما مشكلة هذا الادعاء؟","ru":"Опрос показал: в районах, где больше деревьев, жители сообщают о меньшем числе слишком жарких дней. Кто-то утверждает, что деревья — единственная причина. В чём проблема этого утверждения?","en":"A survey found that in neighborhoods with more trees, residents report fewer overly hot days. Someone claims trees are the only reason. What is the problem with this claim?"},[{"he":"ייתכנו גורמים נוספים, כמו קרבה לים","ar":"قد توجد عوامل أخرى، مثل القرب من البحر","ru":"Могут быть и другие причины, например близость к морю","en":"Other factors may exist, such as being near the sea"},{"he":"סקר לעולם אינו מלמד דבר","ar":"المسح لا يعلّمنا شيئًا أبدًا","ru":"Опрос никогда ничего не показывает","en":"A survey never teaches us anything"},{"he":"עצים דווקא מחממים את האוויר","ar":"الأشجار في الحقيقة تُسخّن الهواء","ru":"Деревья, наоборот, нагревают воздух","en":"Trees actually heat up the air"},{"he":"הנתונים מוכיחים את הטענה לגמרי ובוודאות","ar":"المعطيات تُثبت الادعاء تمامًا وبيقين","ru":"Данные полностью и точно доказывают утверждение","en":"The data prove the claim fully and for sure"}],0,{"he":"חשבו במה עוד שכונות ירוקות עשויות להיות שונות משכונות אחרות.","ar":"فكّروا بماذا قد تختلف الأحياء الخضراء أيضًا عن غيرها.","ru":"Подумайте, чем ещё зелёные районы могут отличаться от других.","en":"Think about what else may differ between green neighborhoods and others."},{"he":"הסקר מראה קשר בין עצים לבין פחות ימים חמים, אבל לא מוכיח שזו הסיבה היחידה. שכונות ירוקות יכולות להיות גם קרובות לים או גבוהות יותר. למשל, כדי לבדוק את העצים לבד, משווים שכונות דומות שההבדל ביניהן הוא רק כמות העצים.","ar":"يُظهر المسح علاقة بين الأشجار وقلة الأيام الحارّة، لكنه لا يُثبت أنها السبب الوحيد. قد تكون الأحياء الخضراء أيضًا أقرب إلى البحر أو أعلى ارتفاعًا. مثلًا، لفحص أثر الأشجار وحدها نقارن أحياء متشابهة يختلف فيها عدد الأشجار فقط.","ru":"Опрос показывает связь между деревьями и меньшим числом жарких дней, но не доказывает, что это единственная причина. Зелёные районы могут быть ещё и ближе к морю или выше. Например, чтобы проверить только деревья, сравнивают похожие районы, отличающиеся лишь числом деревьев.","en":"The survey shows a link between trees and fewer hot days, but does not prove it is the only cause. Green neighborhoods may also be nearer the sea or higher up. For example, to test trees alone, you compare similar neighborhoods that differ only in the number of trees."},null,[null,{"he":"סקר יכול להראות קשר חשוב, גם אם אינו מוכיח סיבה.","ar":"المسح قد يُظهر علاقة مهمّة، حتى لو لم يُثبت سببًا.","ru":"Опрос может показать важную связь, даже если не доказывает причину.","en":"A survey can show an important link, even if it does not prove a cause."},{"he":"עצים מצלים ומאדים מים, ולכן בדרך כלל מקררים את סביבתם.","ar":"الأشجار تُظلّل وتُبخّر الماء، فتُبرّد محيطها عادةً.","ru":"Деревья дают тень и испаряют воду, поэтому обычно охлаждают всё вокруг.","en":"Trees give shade and release water vapor, so they usually cool their surroundings."},{"he":"קשר בסקר אינו הוכחה שהעצים הם הסיבה היחידה.","ar":"العلاقة في المسح ليست إثباتًا أن الأشجار هي السبب الوحيد.","ru":"Связь в опросе не доказывает, что деревья — единственная причина.","en":"A link in a survey is not proof that trees are the only cause."}]),
    Q("ev-3-02",{"he":"תלמידים רוצים לבדוק אם כיסוי האדמה בשבבי עץ שומר על הלחות בעציץ. איזה ניסוי הוא בדיקה הוגנת?","ar":"يريد طلاب فحص ما إذا كانت تغطية التربة برقائق الخشب تحافظ على الرطوبة في الأصيص. أيّ تجربة هي فحص عادل؟","ru":"Ученики хотят проверить, сохраняет ли покрытие почвы древесной щепой влагу в горшке. Какой опыт будет честной проверкой?","en":"Students want to test whether covering soil with wood chips keeps a pot moist. Which experiment is a fair test?"},[{"he":"עציץ עם שבבים בצל, ועציץ בלי שבבים בשמש","ar":"أصيص بالرقائق في الظلّ، وأصيص بدونها في الشمس","ru":"Горшок со щепой в тени, а без щепы — на солнце","en":"A pot with chips in shade, one without chips in sun"},{"he":"עציצים זהים, אותה השקיה, שבבים רק באחד","ar":"أصيصان متماثلان، الريّ نفسه، والرقائق في واحد فقط","ru":"Одинаковые горшки, одинаковый полив, щепа только в одном","en":"Identical pots, same watering, chips in only one"},{"he":"עציץ אחד עם שבבים, בלי עציץ להשוואה","ar":"أصيص واحد بالرقائق، دون أصيص للمقارنة","ru":"Один горшок со щепой, без горшка для сравнения","en":"One pot with chips and no pot to compare"},{"he":"שני עציצים עם שבבים, ואחד מקבל יותר מים","ar":"أصيصان بالرقائق، وأحدهما يتلقّى ماءً أكثر","ru":"Два горшка со щепой, и один получает больше воды","en":"Two pots with chips, one getting more water"}],1,{"he":"בניסוי הוגן משנים דבר אחד בלבד. בדקו מה שונה בכל הצעה.","ar":"في التجربة العادلة نغيّر شيئًا واحدًا فقط. افحصوا ما المختلف في كل اقتراح.","ru":"В честном опыте меняют только одно. Проверьте, что отличается в каждом варианте.","en":"In a fair test you change only one thing. Check what differs in each option."},{"he":"כדי לדעת מה השבבים עושים, כל השאר חייב להיות זהה: עציץ, אדמה, צמח, מקום והשקיה. רק אז ההבדל בלחות נובע מהשבבים. למשל, אחרי שבוע אפשר לגעת באדמה בשני העציצים ולהשוות כמה היא לחה.","ar":"لمعرفة ما تفعله الرقائق، يجب أن يكون كل شيء آخر متماثلًا: الأصيص والتربة والنبتة والمكان والريّ. عندها فقط يكون الفرق في الرطوبة بسبب الرقائق. مثلًا، بعد أسبوع يمكن لمس التربة في الأصيصين ومقارنة رطوبتها.","ru":"Чтобы понять действие щепы, всё остальное должно быть одинаковым: горшок, почва, растение, место и полив. Только тогда разница во влажности связана со щепой. Например, через неделю можно потрогать почву в обоих горшках и сравнить, насколько она влажная.","en":"To know what the chips do, everything else must be the same: pot, soil, plant, place and watering. Only then does the moisture difference come from the chips. For example, after a week you can touch the soil in both pots and compare how moist it is."},null,[{"he":"הצל והשמש שונים, ולכן לא נדע אם השבבים או הצל שמרו על הלחות.","ar":"الظلّ والشمس مختلفان، فلن نعرف هل الرقائق أم الظلّ حفظت الرطوبة.","ru":"Тень и солнце разные, и неясно, щепа или тень сохранила влагу.","en":"Shade and sun differ, so we won't know if chips or shade kept the moisture."},null,{"he":"בלי עציץ להשוואה אין למה להשוות את הלחות שנמדדה.","ar":"دون أصيص للمقارنة لا يوجد ما نقارن به الرطوبة المقيسة.","ru":"Без горшка для сравнения измеренную влажность не с чем сопоставить.","en":"With no pot to compare, the measured moisture has nothing to compare against."},{"he":"בשני העציצים יש שבבים, ולכן אי אפשר לדעת מה השבבים עושים.","ar":"في الأصيصين رقائق، فلا يمكن معرفة ما تفعله الرقائق.","ru":"В обоих горшках есть щепа, поэтому её действие не узнать.","en":"Both pots have chips, so we cannot tell what the chips do."}]),
    Q("ev-3-03",{"he":"חברה כותבת על בקבוק שהיא מוכרת: ״ידידותי לסביבה״. איזו ראיה תחזק את הטענה יותר מכל השאר?","ar":"تكتب شركة على قارورة تبيعها: «صديقة للبيئة». أيّ دليل يقوّي هذا الادعاء أكثر من غيره؟","ru":"Компания пишет на продаваемой бутылке: «экологичная». Какое доказательство подкрепит это лучше всего?","en":"A company writes on a bottle it sells: 'eco-friendly'. Which evidence would support the claim best?"},[{"he":"פרסומת עם תמונה של יער ירוק ונהר","ar":"إعلان فيه صورة غابة خضراء ونهر","ru":"Реклама с фото зелёного леса и реки","en":"An ad with a picture of a green forest and river"},{"he":"הבקבוק עצמו צבוע בצבע ירוק בהיר","ar":"القارورة نفسها ملوّنة بلون أخضر فاتح","ru":"Сама бутылка окрашена в светло-зелёный цвет","en":"The bottle itself is colored light green"},{"he":"בדיקה של מעבדה עצמאית, מהייצור ועד הפסולת","ar":"فحص مختبر مستقلّ، من الإنتاج حتى النفايات","ru":"Проверка независимой лаборатории: от производства до отходов","en":"An independent lab check, from production to waste"},{"he":"אדם מפורסם אומר בפרסומת שהוא משתמש בבקבוק","ar":"شخص مشهور يقول في إعلان إنه يستعمل القارورة","ru":"Знаменитость говорит в рекламе, что пользуется этой бутылкой","en":"A celebrity says in an ad that they use the bottle"}],2,{"he":"חשבו מי בודק, מה בדיוק נמדד, והאם לבודק יש אינטרס.","ar":"فكّروا مَن يفحص، وماذا يُقاس بالضبط، وهل للفاحص مصلحة.","ru":"Подумайте, кто проверяет, что именно измеряется и есть ли у проверяющего интерес.","en":"Think about who checks, what exactly is measured, and whether the checker has an interest."},{"he":"ראיה חזקה מגיעה ממדידה, ומגורם שאין לו רווח מהתוצאה. בדיקה שכוללת ייצור, שימוש ופסולת נותנת תמונה מלאה יותר. למשל, תו סביבתי מגוף בודק עצמאי אמין יותר מסיסמה על האריזה.","ar":"الدليل القوي يأتي من القياس، ومن جهة لا تربح من النتيجة. الفحص الذي يشمل الإنتاج والاستعمال والنفايات يعطي صورة أكمل. مثلًا، علامة بيئية من جهة فحص مستقلّة أوثق من شعار على العلبة.","ru":"Сильное доказательство даёт измерение, сделанное тем, кто не выигрывает от результата. Проверка производства, использования и отходов даёт более полную картину. Например, экологический знак независимого органа надёжнее лозунга на упаковке.","en":"Strong evidence comes from measurement by someone who does not profit from the result. A check covering production, use and waste gives a fuller picture. For example, an eco-label from an independent testing body is more reliable than a slogan on the package."},null,[{"he":"תמונה יפה בפרסומת אינה מדידה של השפעה על הסביבה.","ar":"صورة جميلة في إعلان ليست قياسًا للأثر على البيئة.","ru":"Красивая картинка в рекламе не измеряет влияние на природу.","en":"A nice picture in an ad does not measure environmental impact."},{"he":"צבע הבקבוק אינו אומר דבר על החומרים, על הייצור או על הפירוק.","ar":"لون القارورة لا يقول شيئًا عن المواد أو الإنتاج أو التحلّل.","ru":"Цвет бутылки ничего не говорит о материалах, производстве или распаде.","en":"The bottle's color says nothing about materials, production or breakdown."},null,{"he":"דעה של אדם מפורסם אינה ראיה מדעית, ואולי יש לו אינטרס.","ar":"رأي شخص مشهور ليس دليلًا علميًا، وقد تكون له مصلحة.","ru":"Мнение знаменитости не научное доказательство, и у неё может быть интерес.","en":"A celebrity's opinion is not scientific evidence, and they may have an interest."}]),
    Q("ev-3-04",{"he":"מתקן התפלה מחזיר לים מים מלוחים מאוד, שנקראים תמלחת. איזו דרך מאזנת בין הצורך במים לבין שמירה על הים?","ar":"تعيد منشأة تحلية إلى البحر مياهًا شديدة الملوحة تُسمّى المحلول الملحي. أيّ طريقة توازن بين الحاجة إلى الماء وحماية البحر؟","ru":"Опреснительная станция сбрасывает в море очень солёную воду — рассол. Какой способ уравновешивает нужду в воде и защиту моря?","en":"A desalination plant returns very salty water, called brine, to the sea. Which approach balances the need for water with protecting the sea?"},[{"he":"לסגור מיד את כל מתקני ההתפלה","ar":"إغلاق جميع منشآت التحلية فورًا","ru":"Сразу закрыть все опреснительные станции","en":"Close all desalination plants at once"},{"he":"לשפוך את כל התמלחת ממש ליד החוף, במקום אחד","ar":"سكب كل المحلول قرب الشاطئ مباشرة، في مكان واحد","ru":"Сливать весь рассол прямо у берега, в одном месте","en":"Pour all the brine right by the shore, in one spot"},{"he":"להפסיק לבדוק את הים כדי לחסוך","ar":"التوقّف عن فحص البحر للتوفير","ru":"Перестать проверять море ради экономии","en":"Stop checking the sea to save costs"},{"he":"לפזר את התמלחת רחוק בים ולנטר אותו","ar":"تشتيت المحلول بعيدًا في البحر ومراقبته","ru":"Рассеивать рассол далеко в море и следить за ним","en":"Spread the brine far out at sea and monitor it"}],3,{"he":"חפשו את האפשרות שלא מוותרת לגמרי על אף אחד משני הצרכים.","ar":"ابحثوا عن الخيار الذي لا يتخلّى تمامًا عن أيّ من الحاجتين.","ru":"Ищите вариант, который полностью не отказывается ни от одной из двух нужд.","en":"Look for the option that does not fully give up either of the two needs."},{"he":"תמלחת מרוכזת במקום אחד עלולה לפגוע בבעלי חיים בקרקעית. פיזור למרחק ובדיקות קבועות מקטינים את הנזק, והמתקן ממשיך לספק מים. למשל, צינור ארוך עם פתחים רבים מערבב את התמלחת במי הים מהר יותר.","ar":"المحلول المركّز في مكان واحد قد يضرّ بالحيوانات في القاع. التشتيت لمسافة بعيدة والفحوص المنتظمة تقلّل الضرر، وتستمرّ المنشأة في تزويد الماء. مثلًا، أنبوب طويل فيه فتحات كثيرة يخلط المحلول بماء البحر أسرع.","ru":"Концентрированный рассол в одном месте может навредить животным на дне. Рассеивание вдали и регулярные проверки уменьшают вред, а станция продолжает давать воду. Например, длинная труба с множеством отверстий быстрее смешивает рассол с морской водой.","en":"Concentrated brine in one spot may harm animals on the seabed. Spreading it far out and regular checks reduce the harm, while the plant keeps supplying water. For example, a long pipe with many openings mixes the brine into seawater faster."},null,[{"he":"סגירה מיידית פוגעת באספקת מי השתייה, ולכן אינה מאזנת בין הצרכים.","ar":"الإغلاق الفوري يضرّ بتزويد مياه الشرب، فلا يوازن بين الحاجات.","ru":"Немедленное закрытие ударит по снабжению питьевой водой, и баланса нет.","en":"Closing at once harms the drinking water supply, so it does not balance needs."},{"he":"תמלחת מרוכזת ליד החוף עלולה לפגוע ביצורים שחיים שם.","ar":"المحلول المركّز قرب الشاطئ قد يضرّ بالكائنات التي تعيش هناك.","ru":"Концентрированный рассол у берега может навредить живущим там организмам.","en":"Concentrated brine near the shore may harm the creatures living there."},{"he":"בלי בדיקות לא נדע אם הים נפגע, ולא נוכל לתקן בזמן.","ar":"دون فحوص لن نعرف إن تضرّر البحر، ولن نستطيع الإصلاح في الوقت.","ru":"Без проверок мы не узнаем о вреде морю и не исправим всё вовремя.","en":"Without checks we won't know if the sea is harmed, or fix it in time."},null]),
    Q("ev-3-05",{"he":"מדינה שוקלת לעודד רכבים חשמליים, אבל רוב החשמל בה מופק משריפת פחם. מה הניתוח הזהיר ביותר?","ar":"تفكّر دولة في تشجيع السيارات الكهربائية، لكن معظم كهربائها يُنتج بحرق الفحم. ما التحليل الأكثر حذرًا؟","ru":"Страна думает поощрять электромобили, но большая часть её электричества получается сжиганием угля. Какой анализ самый осторожный?","en":"A country is considering promoting electric cars, but most of its electricity comes from burning coal. What is the most careful analysis?"},[{"he":"האוויר בעיר ישתפר, ולאקלים חשוב מקור החשמל","ar":"سيتحسّن هواء المدينة، ومصدر الكهرباء مهمّ للمناخ","ru":"Воздух в городах улучшится, а для климата важен источник энергии","en":"City air will improve, and the power source matters for climate"},{"he":"רכב חשמלי אינו גורם לשום פליטה בכלל","ar":"السيارة الكهربائية لا تسبّب أيّ انبعاث إطلاقًا","ru":"Электромобиль вообще не даёт никаких выбросов","en":"An electric car causes no emissions at all"},{"he":"אין לרכב חשמלי שום יתרון, גם לא לאוויר בעיר","ar":"لا ميزة للسيارة الكهربائية، ولا حتى لهواء المدينة","ru":"У электромобиля нет плюсов, даже для воздуха в городе","en":"An electric car has no benefit, not even for city air"},{"he":"עדיף לעודד רק רכבים חדשים על בנזין","ar":"الأفضل تشجيع سيارات بنزين جديدة فقط","ru":"Лучше поощрять только новые бензиновые машины","en":"It is better to promote only new petrol cars"}],0,{"he":"הפרידו בין מה שקורה ברחוב לבין מה שקורה בתחנת הכוח.","ar":"افصلوا بين ما يحدث في الشارع وما يحدث في محطة الطاقة.","ru":"Разделите то, что происходит на улице, и то, что происходит на электростанции.","en":"Separate what happens on the street from what happens at the power plant."},{"he":"רכב חשמלי אינו פולט גזים ברחוב, ולכן אוויר העיר משתפר. אבל אם החשמל מופק מפחם, חלק מהפליטות עובר לתחנת הכוח. למשל, מדינה כזאת יכולה לעודד רכבים חשמליים ובמקביל להוסיף מקורות חשמל מתחדשים.","ar":"السيارة الكهربائية لا تُطلق غازات في الشارع، فيتحسّن هواء المدينة. لكن إذا أُنتجت الكهرباء من الفحم، ينتقل جزء من الانبعاثات إلى محطة الطاقة. مثلًا، يمكن لمثل هذه الدولة تشجيع السيارات الكهربائية وإضافة مصادر طاقة متجدّدة في الوقت نفسه.","ru":"Электромобиль не выпускает газы на улице, поэтому городской воздух улучшается. Но если электричество получают из угля, часть выбросов переходит на электростанцию. Например, такая страна может поощрять электромобили и одновременно добавлять возобновляемые источники энергии.","en":"An electric car emits no gases on the street, so city air improves. But if the power comes from coal, some emissions move to the power plant. For example, such a country can promote electric cars while also adding renewable power sources."},null,[null,{"he":"החשמל לטעינה מופק כאן מפחם, ולכן יש פליטות בתחנת הכוח.","ar":"كهرباء الشحن هنا تُنتج من الفحم، فهناك انبعاثات في محطة الطاقة.","ru":"Здесь электричество для зарядки получают из угля, так что выбросы есть на станции.","en":"Here the charging power comes from coal, so there are emissions at the plant."},{"he":"רכב חשמלי אינו פולט גזים ברחוב, ולכן הוא משפר את אוויר העיר.","ar":"السيارة الكهربائية لا تُطلق غازات في الشارع، فتحسّن هواء المدينة.","ru":"Электромобиль не выпускает газы на улице, поэтому воздух в городе чище.","en":"An electric car emits no gases on the street, so it improves city air."},{"he":"רכבי בנזין פולטים גזים ברחוב, וההחלטה הזאת מתעלמת ממקור החשמל.","ar":"سيارات البنزين تُطلق غازات في الشارع، وهذا القرار يتجاهل مصدر الكهرباء.","ru":"Бензиновые машины выбрасывают газы на улице, а такой выбор не учитывает источник энергии.","en":"Petrol cars emit gases on the street, and this choice ignores the power source."}]),
    Q("ev-3-06",{"he":"מישהו אומר: ״החורף הזה היה קר מאוד אצלנו, אז אין התחממות גלובלית.״ מה הבעיה העיקרית בטענה?","ar":"يقول شخص: «كان هذا الشتاء باردًا جدًا عندنا، إذن لا يوجد احترار عالمي». ما المشكلة الرئيسية في الادعاء؟","ru":"Кто-то говорит: «Эта зима у нас была очень холодной, значит, глобального потепления нет». В чём главная проблема утверждения?","en":"Someone says: 'This winter was very cold here, so there is no global warming.' What is the main problem with the claim?"},[{"he":"חורף קר מוכיח דווקא שיש התחממות","ar":"الشتاء البارد يُثبت بالذات وجود الاحترار","ru":"Холодная зима как раз доказывает потепление","en":"A cold winter actually proves warming"},{"he":"אקלים נבדק לפי ממוצע של שנים ומקומות רבים","ar":"المناخ يُقاس بمتوسط سنوات وأماكن كثيرة","ru":"Климат оценивают по среднему за много лет и мест","en":"Climate is judged by averages over many years and places"},{"he":"מזג אוויר ואקלים הם בדיוק אותו דבר","ar":"الطقس والمناخ هما الشيء نفسه تمامًا","ru":"Погода и климат — это одно и то же","en":"Weather and climate are exactly the same"},{"he":"רק המדידות של חודשי הקיץ קובעות את האקלים","ar":"قياسات أشهر الصيف وحدها تحدّد المناخ","ru":"Климат определяют только измерения летних месяцев","en":"Only readings from the summer months decide the climate"}],1,{"he":"חשבו על ההבדל בין יום גשום אחד לבין כמה גשם יורד בדרך כלל באזור.","ar":"فكّروا في الفرق بين يوم ماطر واحد وكمية المطر المعتادة في المنطقة.","ru":"Подумайте о разнице между одним дождливым днём и тем, сколько дождя обычно выпадает в регионе.","en":"Think about the difference between one rainy day and how much rain usually falls in the area."},{"he":"מזג אוויר משתנה מיום ליום וממקום למקום. התחממות גלובלית היא עלייה בממוצע של כל כדור הארץ לאורך שנים רבות. למשל, גם בעולם שמתחמם יכול להיות חורף קר במדינה אחת וחורף חם במיוחד במדינה אחרת.","ar":"الطقس يتغيّر من يوم إلى يوم ومن مكان إلى آخر. الاحترار العالمي هو ارتفاع في متوسط الأرض كلها على مدى سنوات كثيرة. مثلًا، حتى في عالم يزداد دفئًا قد يكون الشتاء باردًا في دولة ودافئًا جدًا في دولة أخرى.","ru":"Погода меняется день ото дня и от места к месту. Глобальное потепление — это рост средней температуры всей Земли за много лет. Например, даже в теплеющем мире в одной стране может быть холодная зима, а в другой — очень тёплая.","en":"Weather changes from day to day and place to place. Global warming is a rise in the average of the whole Earth over many years. For example, even in a warming world one country can have a cold winter while another has a very warm one."},null,[{"he":"חורף אחד, קר או חם, אינו מוכיח דבר על מגמה ארוכה.","ar":"شتاء واحد، باردًا كان أو دافئًا، لا يُثبت شيئًا عن اتجاه طويل.","ru":"Одна зима, холодная или тёплая, ничего не доказывает о долгой тенденции.","en":"One winter, cold or warm, proves nothing about a long-term trend."},null,{"he":"מזג אוויר הוא מצב של ימים, ואקלים הוא דפוס של עשרות שנים.","ar":"الطقس حالة أيام، والمناخ نمط عشرات السنين.","ru":"Погода — это состояние на дни, а климат — картина за десятилетия.","en":"Weather is the state over days, and climate is the pattern over decades."},{"he":"אקלים כולל את כל עונות השנה, ולא רק את הקיץ.","ar":"المناخ يشمل كل فصول السنة، لا الصيف فقط.","ru":"Климат включает все времена года, а не только лето.","en":"Climate includes all seasons of the year, not only summer."}]),
    Q("ev-3-07",{"he":"תלמיד בדק דוגמה אחת של חול מחוף אחד ומצא בה הרבה מיקרופלסטיק. הוא קובע שבכל חופי הארץ יש אותה כמות. מה החולשה העיקרית במסקנה?","ar":"فحص طالب عيّنة رمل واحدة من شاطئ واحد ووجد فيها جزيئات بلاستيك دقيقة كثيرة. يقرّر أن في كل شواطئ البلاد الكمية نفسها. ما نقطة الضعف الرئيسية في الاستنتاج؟","ru":"Ученик проверил одну пробу песка с одного пляжа и нашёл много микропластика. Он заключает, что на всех пляжах страны столько же. В чём главная слабость вывода?","en":"A student tested one sand sample from one beach and found a lot of microplastic. He concludes that all the country's beaches have the same amount. What is the main weakness?"},[{"he":"מיקרופלסטיק לא נמצא אף פעם בחול","ar":"البلاستيك الدقيق لا يوجد أبدًا في الرمل","ru":"Микропластика никогда не бывает в песке","en":"Microplastic is never found in sand"},{"he":"צריך לבדוק רק בחודשי החורף","ar":"يجب الفحص في أشهر الشتاء فقط","ru":"Проверять нужно только зимой","en":"Testing must be done only in winter"},{"he":"דוגמה אחת לא מייצגת חופים רבים","ar":"عيّنة واحدة لا تمثّل شواطئ كثيرة","ru":"Одна проба не представляет много пляжей","en":"One sample does not represent many beaches"},{"he":"חול אינו חלק מהסביבה הטבעית","ar":"الرمل ليس جزءًا من البيئة الطبيعية","ru":"Песок не часть природной среды","en":"Sand is not part of the natural environment"}],2,{"he":"חשבו אם חוף אחד יכול להיות שונה מאחרים, למשל ליד נמל או ליד שמורה.","ar":"فكّروا هل يمكن أن يختلف شاطئ واحد عن غيره، مثلًا قرب ميناء أو قرب محمية.","ru":"Подумайте, может ли один пляж отличаться от других, например рядом с портом или заповедником.","en":"Think about whether one beach can differ from others, say near a port or a nature reserve."},{"he":"מדידה אחת במקום אחד יכולה להיות חריגה. כדי להכליל צריך דוגמאות רבות מחופים שונים ובזמנים שונים. למשל, חוף ליד שפך נחל עשוי להכיל יותר פלסטיק מחוף מרוחק.","ar":"قياس واحد في مكان واحد قد يكون شاذًا. للتعميم نحتاج إلى عيّنات كثيرة من شواطئ مختلفة وفي أوقات مختلفة. مثلًا، شاطئ قرب مصبّ وادٍ قد يحوي بلاستيكًا أكثر من شاطئ بعيد.","ru":"Одно измерение в одном месте может быть исключением. Для обобщения нужно много проб с разных пляжей и в разное время. Например, пляж у устья ручья может содержать больше пластика, чем отдалённый.","en":"One measurement in one place may be unusual. To generalize you need many samples from different beaches at different times. For example, a beach near a stream mouth may hold more plastic than a remote one."},null,[{"he":"מיקרופלסטיק נמצא בחול של חופים רבים, ולכן זו לא הבעיה.","ar":"البلاستيك الدقيق يوجد في رمل شواطئ كثيرة، فليست هذه المشكلة.","ru":"Микропластик находят в песке многих пляжей, так что дело не в этом.","en":"Microplastic is found in the sand of many beaches, so that is not the issue."},{"he":"עונת הבדיקה יכולה להשפיע, אבל הבעיה העיקרית היא מספר הדוגמאות.","ar":"قد يؤثّر موسم الفحص، لكن المشكلة الرئيسية هي عدد العيّنات.","ru":"Сезон может влиять, но главная проблема — число проб.","en":"The season may matter, but the main problem is the number of samples."},null,{"he":"חול הוא חלק מהחוף ומהסביבה, ובודקים בו זיהום באופן קבוע.","ar":"الرمل جزء من الشاطئ والبيئة، ويُفحص فيه التلوّث بانتظام.","ru":"Песок — часть пляжа и среды, его регулярно проверяют на загрязнение.","en":"Sand is part of the beach and environment, and it is routinely tested."}]),
    Q("ev-3-08",{"he":"עירייה מתלבטת אם להטמין פסולת שאי אפשר למחזר, או לשרוף אותה במתקן שמייצר חשמל. מה שיקול נכון?","ar":"تتردّد بلدية بين دفن النفايات غير القابلة للتدوير، أو حرقها في منشأة تُنتج الكهرباء. ما الاعتبار الصحيح؟","ru":"Муниципалитет выбирает: закапывать мусор, который нельзя переработать, или сжигать его на установке, которая даёт электричество. Какое соображение верно?","en":"A city is deciding whether to bury waste that cannot be recycled, or burn it in a plant that makes electricity. Which consideration is correct?"},[{"he":"הטמנה אינה פולטת שום גז לאוויר","ar":"الدفن لا يُطلق أيّ غاز إلى الهواء","ru":"Захоронение не выпускает в воздух никаких газов","en":"Burying releases no gas into the air"},{"he":"שריפה מייצרת חשמל בלי שום פליטה","ar":"الحرق يُنتج كهرباء دون أيّ انبعاث","ru":"Сжигание даёт ток совсем без выбросов","en":"Burning makes power with no emissions at all"},{"he":"שתי הדרכים מבטלות לגמרי את הצורך למחזר","ar":"الطريقتان تُلغيان تمامًا الحاجة إلى التدوير","ru":"Оба способа полностью отменяют нужду в переработке","en":"Both methods fully remove the need to recycle"},{"he":"שריפה חוסכת שטח, אבל צריך לסנן את העשן","ar":"الحرق يوفّر المساحة، لكن يجب ترشيح الدخان","ru":"Сжигание экономит место, но дым нужно фильтровать","en":"Burning saves space, but the smoke must be filtered"}],3,{"he":"לכל אחת משתי הדרכים יש מחיר. חפשו את האפשרות שמודה בזה.","ar":"لكلّ من الطريقتين ثمن. ابحثوا عن الخيار الذي يعترف بذلك.","ru":"У каждого из двух способов есть цена. Ищите вариант, который это признаёт.","en":"Each of the two methods has a cost. Look for the option that admits it."},{"he":"הטמנה תופסת שטח ופולטת מתאן, ושריפה פולטת גזים וחלקיקים. מתקן שריפה עם מסננים טובים יכול לצמצם את הפליטות ולייצר חשמל. למשל, ערים רבות משלבות: קודם ממחזרים, ורק את מה שנשאר שורפים או מטמינים.","ar":"الدفن يشغل مساحة ويُطلق الميثان، والحرق يُطلق غازات وجسيمات. منشأة حرق بمرشّحات جيدة تستطيع تقليل الانبعاثات وإنتاج الكهرباء. مثلًا، مدن كثيرة تجمع بين الطرق: تدوّر أولًا، ثم تحرق أو تدفن ما يتبقّى فقط.","ru":"Захоронение занимает место и выделяет метан, а сжигание выпускает газы и частицы. Установка с хорошими фильтрами может снизить выбросы и давать электричество. Например, многие города сочетают способы: сначала перерабатывают, а сжигают или закапывают только остаток.","en":"Burying takes up land and releases methane, while burning releases gases and particles. A plant with good filters can cut emissions and make electricity. For example, many cities combine methods: they recycle first, then burn or bury only what is left."},null,[{"he":"פסולת אורגנית במטמנה מתפרקת ופולטת מתאן.","ar":"النفايات العضوية في المكبّ تتحلّل وتُطلق الميثان.","ru":"Органика на свалке разлагается и выделяет метан.","en":"Organic waste in a landfill breaks down and releases methane."},{"he":"שריפה פולטת גזים וחלקיקים, ולכן צריך מסננים ובקרה.","ar":"الحرق يُطلق غازات وجسيمات، لذلك نحتاج إلى مرشّحات ورقابة.","ru":"Сжигание выпускает газы и частицы, поэтому нужны фильтры и контроль.","en":"Burning releases gases and particles, so filters and monitoring are needed."},{"he":"השאלה עוסקת רק בפסולת שאי אפשר למחזר, ומחזור עדיין עדיף כשהוא אפשרי.","ar":"السؤال يخصّ النفايات غير القابلة للتدوير فقط، والتدوير يبقى أفضل حين يمكن.","ru":"Речь только о мусоре, который нельзя переработать, а переработка лучше, где возможна.","en":"The question is only about unrecyclable waste; recycling is still better when possible."},null]),
    Q("ev-3-09",{"he":"חוקר השווה את חשבון החשמל של שני בתים: באחד יש פאנלים על הגג ובשני אין. בבית עם הפאנלים גרים 2 אנשים, ובשני 6. מה הבעיה בהשוואה?","ar":"قارن باحث فاتورة الكهرباء لبيتين: في أحدهما ألواح على السطح وفي الآخر لا. في البيت ذي الألواح يسكن شخصان، وفي الآخر 6. ما مشكلة المقارنة؟","ru":"Исследователь сравнил счета за электричество двух домов: на крыше одного есть панели, на другом нет. В доме с панелями живут 2 человека, в другом — 6. В чём проблема сравнения?","en":"A researcher compared the power bills of two homes: one has rooftop panels and the other does not. Two people live in the home with panels, and six in the other. What is wrong with the comparison?"},[{"he":"מספר הדיירים שונה ומשפיע על הצריכה","ar":"عدد السكان مختلف ويؤثّر في الاستهلاك","ru":"Число жильцов разное и влияет на расход","en":"The number of residents differs and affects use"},{"he":"אי אפשר להשוות חשבונות חשמל של בתים בכלל","ar":"لا يمكن مقارنة فواتير كهرباء البيوت أصلًا","ru":"Счета за электричество разных домов вообще нельзя сравнивать","en":"Power bills of homes can never be compared at all"},{"he":"פאנלים מעלים את צריכת החשמל בבית","ar":"الألواح ترفع استهلاك الكهرباء في البيت","ru":"Панели увеличивают расход электричества в доме","en":"Panels raise a home's electricity use"},{"he":"בבית עם יותר אנשים צורכים פחות","ar":"البيت الذي فيه ناس أكثر يستهلك أقل","ru":"В доме, где больше людей, тратят меньше","en":"A home with more people uses less"}],0,{"he":"חפשו הבדל בין הבתים שאינו קשור לפאנלים.","ar":"ابحثوا عن فرق بين البيتين لا علاقة له بالألواح.","ru":"Ищите различие между домами, не связанное с панелями.","en":"Look for a difference between the homes that has nothing to do with panels."},{"he":"בבית עם 6 דיירים צורכים בדרך כלל יותר חשמל, גם בלי קשר לפאנלים. לכן ההבדל בחשבון לא מלמד רק על הפאנלים. למשל, השוואה הוגנת תהיה בין בתים דומים בגודל ובמספר הדיירים.","ar":"في بيت فيه 6 سكان يُستهلك عادةً كهرباء أكثر، بغضّ النظر عن الألواح. لذلك الفرق في الفاتورة لا يدلّ على الألواح وحدها. مثلًا، المقارنة العادلة تكون بين بيوت متشابهة في الحجم وعدد السكان.","ru":"В доме с 6 жильцами обычно тратят больше электричества, независимо от панелей. Поэтому разница в счёте говорит не только о панелях. Например, честное сравнение — между похожими домами по размеру и числу жильцов.","en":"A home with 6 residents usually uses more power, regardless of panels. So the bill difference does not tell us only about the panels. For example, a fair comparison is between homes similar in size and number of residents."},null,[null,{"he":"אפשר להשוות חשבונות, בתנאי ששאר הגורמים דומים.","ar":"يمكن مقارنة الفواتير بشرط أن تكون العوامل الأخرى متشابهة.","ru":"Счета можно сравнивать, если остальные условия похожи.","en":"Bills can be compared, as long as the other factors are similar."},{"he":"פאנלים מייצרים חשמל, ואינם מגדילים את הצריכה של המכשירים בבית.","ar":"الألواح تُنتج الكهرباء، ولا تزيد استهلاك الأجهزة في البيت.","ru":"Панели производят электричество и не увеличивают расход приборов.","en":"Panels produce power; they do not raise what the appliances use."},{"he":"בדרך כלל יותר אנשים משתמשים ביותר מכשירים, ולכן צורכים יותר.","ar":"عادةً يستعمل الناس الأكثر أجهزة أكثر، فيستهلكون أكثر.","ru":"Обычно больше людей пользуются большим числом приборов и тратят больше.","en":"Usually more people use more appliances, so they use more power."}]),
    Q("ev-3-10",{"he":"נמצא שבערים עם יותר רכבים חשמליים יש גם יותר פאנלים סולאריים על הגגות. איזו מסקנה זהירה מתאימה?","ar":"وُجد أن المدن التي فيها سيارات كهربائية أكثر فيها أيضًا ألواح شمسية أكثر على الأسطح. أيّ استنتاج حذر يناسب؟","ru":"Выяснилось, что в городах, где больше электромобилей, на крышах и больше солнечных панелей. Какой осторожный вывод подходит?","en":"Cities with more electric cars were found to also have more rooftop solar panels. Which careful conclusion fits?"},[{"he":"רכבים חשמליים גורמים להתקנת פאנלים","ar":"السيارات الكهربائية تسبّب تركيب الألواح","ru":"Электромобили вызывают установку панелей","en":"Electric cars cause panels to be installed"},{"he":"יש קשר, ואולי גורם שלישי משפיע על שניהם","ar":"توجد علاقة، وربما يؤثّر عامل ثالث في الاثنين","ru":"Связь есть, и, возможно, на оба влияет третий фактор","en":"There is a link, and a third factor may affect both"},{"he":"פאנלים על הגג גורמים לאנשים לקנות רכב חשמלי","ar":"الألواح على السطح تدفع الناس إلى شراء سيارة كهربائية","ru":"Панели на крыше заставляют людей покупать электромобили","en":"Rooftop panels make people buy electric cars"},{"he":"אין שום קשר בין שני הדברים","ar":"لا علاقة إطلاقًا بين الأمرين","ru":"Между этими вещами нет никакой связи","en":"There is no link at all between the two"}],1,{"he":"חשבו מה עוד יכול להיות שונה בין הערים האלה לערים אחרות.","ar":"فكّروا ماذا قد يختلف أيضًا بين هذه المدن والمدن الأخرى.","ru":"Подумайте, чем ещё эти города могут отличаться от других.","en":"Think about what else might differ between these cities and others."},{"he":"כשנמצא קשר, ייתכן שדבר אחד גורם לשני, אבל ייתכן גם שגורם שלישי משפיע על שניהם. למשל, בעיר עם הרבה בתים פרטיים ושמש חזקה קל יותר להתקין פאנלים וגם לטעון רכב בחניה.","ar":"عندما نجد علاقة، قد يكون أحد الأمرين سببًا للآخر، وقد يؤثّر عامل ثالث في الاثنين. مثلًا، في مدينة فيها بيوت خاصة كثيرة وشمس قوية يسهل تركيب الألواح وشحن السيارة في الموقف.","ru":"Когда найдена связь, одно может вызывать другое, но может и третий фактор влиять на оба. Например, в городе с множеством частных домов и сильным солнцем проще ставить панели и заряжать машину у дома.","en":"When a link is found, one thing may cause the other, but a third factor may also affect both. For example, in a city with many private houses and strong sun, it is easier to install panels and to charge a car at home."},null,[{"he":"קשר בין שני דברים אינו מוכיח שאחד מהם גורם לשני.","ar":"العلاقة بين أمرين لا تُثبت أن أحدهما يسبّب الآخر.","ru":"Связь двух явлений не доказывает, что одно вызывает другое.","en":"A link between two things does not prove one causes the other."},null,{"he":"גם בכיוון הזה אין הוכחה לסיבה, וייתכן שגורם אחר משפיע.","ar":"في هذا الاتجاه أيضًا لا دليل على السبب، وربما يؤثّر عامل آخر.","ru":"И в эту сторону причина не доказана, может влиять другой фактор.","en":"This direction also lacks proof of cause, and another factor may be at work."},{"he":"הנתונים מראים ששני הדברים מופיעים יחד, ולכן יש ביניהם קשר.","ar":"المعطيات تُظهر أن الأمرين يظهران معًا، فبينهما علاقة.","ru":"Данные показывают, что оба явления встречаются вместе, значит, связь есть.","en":"The data show the two appear together, so there is a link."}]),
    Q("ev-3-11",{"he":"חקלאי שוקל להשקות את המטע במים מושבים, כלומר מי ביוב מטוהרים, במקום במים שפירים. מה השיקול המאוזן ביותר?","ar":"يفكّر مزارع في ريّ بستانه بمياه معاد استعمالها، أي مياه صرف معالجة، بدل المياه العذبة. ما الاعتبار الأكثر توازنًا؟","ru":"Фермер думает поливать сад оборотной водой, то есть очищенными стоками, а не пресной водой. Какое соображение самое взвешенное?","en":"A farmer is considering watering his orchard with reclaimed water, meaning treated sewage, instead of fresh water. What is the most balanced consideration?"},[{"he":"המים המושבים ראויים לשתייה בלי טיפול נוסף","ar":"المياه المعالجة صالحة للشرب دون معالجة إضافية","ru":"Оборотная вода пригодна для питья без доочистки","en":"Reclaimed water is drinkable with no further treatment"},{"he":"מים מושבים פוגעים בכל סוג של גידול","ar":"المياه المعالجة تضرّ بكل أنواع المحاصيل","ru":"Оборотная вода вредит любым культурам","en":"Reclaimed water harms every kind of crop"},{"he":"לחסוך מים שפירים ולעקוב אחר המלח בקרקע","ar":"توفير المياه العذبة ومتابعة الملح في التربة","ru":"Экономить пресную воду и следить за солью в почве","en":"Save fresh water and keep track of salt in the soil"},{"he":"אין צורך לבדוק את הקרקע לעולם","ar":"لا حاجة إلى فحص التربة أبدًا","ru":"Почву никогда не нужно проверять","en":"There is never any need to check the soil"}],2,{"he":"חפשו את האפשרות שרואה גם יתרון וגם סיכון.","ar":"ابحثوا عن الخيار الذي يرى فائدة ومخاطرة معًا.","ru":"Ищите вариант, который видит и пользу, и риск.","en":"Look for the option that sees both a benefit and a risk."},{"he":"מים מושבים חוסכים מים שפירים, ולכן הם חשובים במדינה יבשה. מצד שני, יש בהם לרוב יותר מלחים, ולאורך שנים מלח עלול להצטבר בקרקע. למשל, חקלאי יכול לבדוק את הקרקע כל שנה ולהתאים את ההשקיה לפי התוצאות.","ar":"المياه المعالجة توفّر المياه العذبة، لذلك هي مهمّة في بلد جافّ. من جهة أخرى، فيها غالبًا أملاح أكثر، وعلى مرّ السنين قد يتراكم الملح في التربة. مثلًا، يستطيع المزارع فحص التربة كل سنة وتعديل الريّ حسب النتائج.","ru":"Оборотная вода экономит пресную, поэтому она важна в засушливой стране. С другой стороны, в ней обычно больше солей, и за годы соль может накопиться в почве. Например, фермер может проверять почву каждый год и менять полив по результатам.","en":"Reclaimed water saves fresh water, so it matters in a dry country. On the other hand, it often has more salts, and over the years salt may build up in the soil. For example, a farmer can test the soil every year and adjust watering to the results."},null,[{"he":"מים מושבים מיועדים להשקיה, ואינם מטופלים לרמה של מי שתייה.","ar":"المياه المعالجة مخصّصة للريّ، ولا تُعالج إلى مستوى مياه الشرب.","ru":"Оборотная вода предназначена для полива и не очищена до питьевой.","en":"Reclaimed water is meant for irrigation and is not treated to drinking level."},{"he":"גידולים רבים מושקים במים מושבים ומניבים יבול טוב.","ar":"محاصيل كثيرة تُروى بمياه معالجة وتعطي غلّة جيدة.","ru":"Многие культуры поливают оборотной водой, и урожай хороший.","en":"Many crops are watered with reclaimed water and give good yields."},null,{"he":"במים מושבים יש לרוב יותר מלחים, ולכן כדאי לבדוק את הקרקע.","ar":"المياه المعالجة تحوي غالبًا أملاحًا أكثر، لذلك يُستحسن فحص التربة.","ru":"В оборотной воде обычно больше солей, поэтому почву стоит проверять.","en":"Reclaimed water often contains more salts, so the soil should be checked."}]),
    Q("ev-3-12",{"he":"במחקר בדקו אם החלפת נורות חוסכת חשמל. המדידה נעשתה בבית אחד בלבד, במשך יום אחד. איך אפשר לחזק את הממצאים?","ar":"في بحث فُحص هل استبدال المصابيح يوفّر الكهرباء. أُجري القياس في بيت واحد فقط، خلال يوم واحد. كيف يمكن تقوية النتائج؟","ru":"В исследовании проверяли, экономит ли замена ламп электричество. Измеряли только в одном доме и один день. Как можно усилить результаты?","en":"A study checked whether changing bulbs saves electricity. It measured only one home, for one day. How can the findings be made stronger?"},[{"he":"למדוד שוב באותו בית בדיוק ובאותו יום","ar":"القياس مرة أخرى في البيت نفسه تمامًا واليوم نفسه","ru":"Измерить снова в том же самом доме в тот же день","en":"Measure again in the very same home on the same day"},{"he":"לשאול את הדיירים מה דעתם","ar":"سؤال السكان عن رأيهم","ru":"Спросить мнение жильцов","en":"Ask the residents what they think"},{"he":"לקצר את המדידה לשעה אחת","ar":"تقصير القياس إلى ساعة واحدة","ru":"Сократить измерение до одного часа","en":"Cut the measurement to one hour"},{"he":"למדוד בבתים רבים ולאורך זמן רב","ar":"القياس في بيوت كثيرة ولفترة طويلة","ru":"Измерять во многих домах и долго","en":"Measure in many homes over a long time"}],3,{"he":"חשבו מה עלול להיות מיוחד בבית אחד או ביום אחד.","ar":"فكّروا ما الذي قد يكون مميّزًا في بيت واحد أو في يوم واحد.","ru":"Подумайте, чем может быть особенным один дом или один день.","en":"Think about what might be special about one home or one day."},{"he":"בית אחד ויום אחד יכולים להיות יוצאי דופן, כמו יום שבו איש לא היה בבית. מדידה בהרבה בתים ולאורך שבועות מקטינה את השפעת המקרה. למשל, אם החיסכון חוזר בעשרות בתים, אפשר לסמוך עליו יותר.","ar":"بيت واحد ويوم واحد قد يكونان استثنائيين، كيوم لم يكن فيه أحد في البيت. القياس في بيوت كثيرة وعلى مدى أسابيع يقلّل أثر الصدفة. مثلًا، إذا تكرّر التوفير في عشرات البيوت، يمكن الاعتماد عليه أكثر.","ru":"Один дом и один день могут быть исключением, как день, когда дома никого не было. Измерения во многих домах и в течение недель уменьшают роль случая. Например, если экономия повторяется в десятках домов, ей можно больше доверять.","en":"One home and one day may be unusual, like a day when no one was home. Measuring many homes over weeks reduces the effect of chance. For example, if the saving repeats in dozens of homes, it can be trusted more."},null,[{"he":"מדידה חוזרת באותם תנאים לא מוסיפה בתים או ימים שונים.","ar":"القياس المكرّر في الظروف نفسها لا يضيف بيوتًا أو أيامًا مختلفة.","ru":"Повтор в тех же условиях не добавляет других домов или дней.","en":"Repeating under the same conditions adds no other homes or days."},{"he":"דעה של דיירים אינה מדידה של צריכת החשמל.","ar":"رأي السكان ليس قياسًا لاستهلاك الكهرباء.","ru":"Мнение жильцов не является измерением расхода электричества.","en":"Residents' opinions are not a measurement of power use."},{"he":"מדידה קצרה יותר נותנת פחות מידע, ולא יותר.","ar":"القياس الأقصر يعطي معلومات أقل، لا أكثر.","ru":"Более короткое измерение даёт меньше данных, а не больше.","en":"A shorter measurement gives less information, not more."},null]),
    Q("ev-3-13",{"he":"מתכננים חוות טורבינות רוח באזור שבו עוברות ציפורים נודדות באביב ובסתיו. איזו החלטה מאזנת בין אנרגיה נקייה לבין הגנה על הציפורים?","ar":"يُخطَّط لمزرعة توربينات رياح في منطقة تعبرها الطيور المهاجرة في الربيع والخريف. أيّ قرار يوازن بين الطاقة النظيفة وحماية الطيور؟","ru":"Планируют ветропарк там, где весной и осенью пролетают перелётные птицы. Какое решение уравновешивает чистую энергию и защиту птиц?","en":"A wind farm is planned where migrating birds pass in spring and autumn. Which decision balances clean energy with protecting the birds?"},[{"he":"לעצור טורבינות בשעות של נדידה עמוסה","ar":"إيقاف التوربينات في ساعات الهجرة الكثيفة","ru":"Останавливать турбины в часы сильного перелёта","en":"Stop the turbines during heavy migration hours"},{"he":"לוותר לגמרי על כל אנרגיה מתחדשת באזור","ar":"التخلّي تمامًا عن كل طاقة متجدّدة في المنطقة","ru":"Полностью отказаться от возобновляемой энергии в районе","en":"Give up all renewable energy in the area entirely"},{"he":"להתעלם, כי ציפורים תמיד מתרחקות","ar":"التجاهل، لأن الطيور تبتعد دائمًا","ru":"Не обращать внимания: птицы всегда облетают","en":"Ignore it, since birds always fly around"},{"he":"לבנות במקום זה תחנה ששורפת פחם","ar":"بناء محطة تحرق الفحم بدلًا منها","ru":"Построить вместо этого угольную станцию","en":"Build a coal-burning plant instead"}],0,{"he":"חשבו אם הסכנה לציפורים קיימת כל השנה, או רק בזמנים מסוימים.","ar":"فكّروا هل الخطر على الطيور قائم طوال السنة، أم في أوقات معيّنة فقط.","ru":"Подумайте, грозит ли птицам опасность весь год или только в определённое время.","en":"Think about whether the danger to birds exists all year or only at certain times."},{"he":"טורבינות רוח מייצרות חשמל נקי, אבל עלולות לפגוע בציפורים שעוברות לידן. עצירה בזמני נדידה עמוסה מקטינה את הסיכון ומשאירה ייצור ברוב השנה. למשל, אפשר להיעזר במכ״ם שמזהה להקות ומפעיל עצירה בזמן.","ar":"توربينات الرياح تُنتج كهرباء نظيفة، لكنها قد تضرّ بالطيور العابرة قربها. الإيقاف في أوقات الهجرة الكثيفة يقلّل الخطر ويُبقي الإنتاج معظم السنة. مثلًا، يمكن الاستعانة برادار يرصد الأسراب ويُشغّل الإيقاف في الوقت المناسب.","ru":"Ветряки дают чистую энергию, но могут вредить пролетающим рядом птицам. Остановка в часы сильного перелёта снижает риск, а выработка сохраняется большую часть года. Например, можно использовать радар, который замечает стаи и вовремя останавливает турбины.","en":"Wind turbines make clean power but can harm birds flying past. Stopping during heavy migration lowers the risk while keeping production most of the year. For example, a radar can spot flocks and trigger a stop in time."},null,[null,{"he":"ויתור מלא על אנרגיה מתחדשת מאבד את התועלת לאקלים ולאוויר.","ar":"التخلّي التامّ عن الطاقة المتجدّدة يُضيع الفائدة للمناخ والهواء.","ru":"Полный отказ от возобновляемой энергии теряет пользу для климата и воздуха.","en":"Giving up renewables entirely loses the benefit for climate and air."},{"he":"ציפורים לא תמיד מצליחות להתחמק, ולכן אי אפשר להתעלם מהסיכון.","ar":"الطيور لا تنجح دائمًا في التفادي، فلا يمكن تجاهل الخطر.","ru":"Птицы не всегда успевают увернуться, поэтому риск нельзя игнорировать.","en":"Birds do not always manage to avoid them, so the risk cannot be ignored."},{"he":"תחנת פחם מזהמת את האוויר ומוסיפה גזי חממה, וזה אינו איזון.","ar":"محطة الفحم تلوّث الهواء وتضيف غازات دفيئة، وهذا ليس توازنًا.","ru":"Угольная станция загрязняет воздух и добавляет парниковые газы, это не баланс.","en":"A coal plant pollutes the air and adds greenhouse gases, which is no balance."}]),
    Q("ev-3-14",{"he":"בפרסומת למסנן מים לברז נכתב: ״9 מתוך 10 משתמשים מרוצים״. מה חסר כדי לדעת אם המסנן באמת מנקה את המים?","ar":"كُتب في إعلان لمرشّح ماء للحنفية: «9 من كل 10 مستخدمين راضون». ما الذي ينقص لمعرفة هل المرشّح ينظّف الماء فعلًا؟","ru":"В рекламе фильтра для крана написано: «9 из 10 пользователей довольны». Чего не хватает, чтобы понять, очищает ли фильтр воду на самом деле?","en":"An ad for a tap water filter says: '9 out of 10 users are satisfied.' What is missing to know whether the filter really cleans the water?"},[{"he":"עוד תמונות של כוס מים צלולים","ar":"صور أخرى لكوب ماء صافٍ","ru":"Больше фото стакана прозрачной воды","en":"More photos of a glass of clear water"},{"he":"בדיקת איכות המים לפני הסינון ואחריו","ar":"فحص جودة الماء قبل الترشيح وبعده","ru":"Анализ воды до и после фильтрации","en":"Testing water quality before and after filtering"},{"he":"סקר חדש עם עוד יותר משתמשים מרוצים","ar":"مسح جديد مع مستخدمين راضين أكثر","ru":"Новый опрос с ещё большим числом довольных","en":"A new survey with even more happy users"},{"he":"מחיר נמוך יותר למסנן בחנות","ar":"سعر أقل للمرشّح في المتجر","ru":"Более низкая цена фильтра в магазине","en":"A lower price for the filter in the shop"}],1,{"he":"הפרידו בין מה שאנשים מרגישים לבין מה שאפשר למדוד.","ar":"افصلوا بين ما يشعر به الناس وما يمكن قياسه.","ru":"Отделите то, что люди чувствуют, от того, что можно измерить.","en":"Separate what people feel from what can be measured."},{"he":"כדי לדעת אם מסנן עובד, צריך למדוד חומרים במים לפני שהם עוברים בו ואחרי. משתמשים יכולים להיות מרוצים בגלל טעם או נוחות, גם אם הסינון חלש. למשל, מעבדה יכולה לבדוק כמה כלור או חלקיקים נשארו במים אחרי המסנן.","ar":"لمعرفة هل المرشّح يعمل، يجب قياس المواد في الماء قبل مروره فيه وبعده. قد يرضى المستخدمون بسبب الطعم أو الراحة، حتى لو كان الترشيح ضعيفًا. مثلًا، يستطيع مختبر فحص كمية الكلور أو الجسيمات الباقية في الماء بعد المرشّح.","ru":"Чтобы знать, работает ли фильтр, нужно измерить вещества в воде до и после него. Пользователи могу function itemId(tid,lv,i){return tid+"|"+lv+"|"+i}
function itemRec(id){
  if(!state.item[id])state.item[id]={n:0,ok:0};
  return state.item[id];
}
function poolOf(tp,lv){return (tp.L[lv-1]||tp.L[0]||[])}

/* בחירת פריט לתרגול. משקל גבוה לחדש, בינוני לנכשל, נמוך לנשלט. */
function chooseIndex(tid,lv,pool,avoid){
  var cand=[],i,w;
  for(i=0;i<pool.length;i++){
    if(avoid!==undefined&&i===avoid&&pool.length>1)continue;
    var r=state.item[itemId(tid,lv,i)];
    if(!r||!r.n)w=6;                            /* חדש */
    else if(r.ok<r.n)w=1+Math.min(4,r.n-r.ok);  /* נכשל בעבר */
    else w=1;                                   /* נשלט */
    for(var j=0;j<w;j++)cand.push(i);
  }
  if(!cand.length)return 0;
  return pick(cand);
}
/* בחירת פריט למבחן. אחידה, ואינה נוגעת ב-state כלל. */
function pureIndex(pool,avoid){
  var cand=[],i;
  for(i=0;i<pool.length;i++){
    if(avoid!==undefined&&i===avoid&&pool.length>1)continue;
    cand.push(i);
  }
  return cand.length?pick(cand):0;
}


/* ------------------------------------------------------------
   ניקוי להקראה בלבד. המסך אינו משתנה ממנו.

   הגרשיים העבריים משמשים לשני דברים: ראשי תיבות (חוק־יסוד,
   בג״ץ) ומירכאות (״מדינה יהודית״). המנוע מכיר רק את הראשון.
   הכלל שמפריד: בראשי תיבות באה אחרי הגרשיים אות עברית אחת
   בדיוק וסוף מילה. הסיכון א־סימטרי — מירכאה שהוסרה אינה
   יכולה להזיק, מירכאה שנשארה כן.

   המירכאות המסולסלות (“ ”) משמשות כאן לציטוט מונחים בלבד,
   ולכן הן נופלות תמיד. הקו המפריד הופך לפסיק, כדי שהקול
   ייעצר במקום לרוץ הלאה.
   ------------------------------------------------------------ */
function saySpell(x){
  return String(x==null?"":x)
    .replace(/[“”‘’]/g,"")
    .replace(/״/g,function(m,i,str){
      return /^[א-ת](?![א-ת])/.test(str.slice(i+1))?m:"";
    })
    .replace(/\s—\s/g,", ");
}

function O(html,ok,why){return {h:html,ok:!!ok,why:why||""}}

/* בונה שאלה מפריט אחד. סדר האפשרויות מעורבב בכל בנייה, ולכן
   האינדקס ok שבתוכן אינו מגיע למסך לעולם. */
function buildFromItem(it){
  var opts=it.o.map(function(o,i){return O(esc(gl(o)),i===it.ok,it.wrong&&it.wrong[i]?gl(it.wrong[i]):"")});
  var ans=gl(it.o[it.ok]);
  return {
    type:"mcq",
    prompt:t("qPick"),
    lead:gl(it.q),
    fig:figHtml(it.fig),
    opts:shuffle(opts),
    answer:ans,
    /* מה שנאמר אחרי המענה: השאלה, התשובה הנכונה, וההסבר.
       תשובה בלי ההסבר נשמעת כמו עובדה לשינון, וזה בדיוק מה
       שהאפליקציה הזאת קיימת כדי להחליף. */
    say:gl(it.q)+" "+ans+". "+gl(it.ex),
    reveal:it
  };
}
function buildQuestion(tid,lv,avoid,pure){
  var tp=topicOf(tid); if(!tp)return null;
  var pool=poolOf(tp,lv);
  if(!pool.length)return null;
  var idx=pure?pureIndex(pool,avoid):chooseIndex(tid,lv,pool,avoid);
  var it=pool[idx];
  if(!it)return null;
  var q=buildFromItem(it);
  q.tid=tid; q.lv=lv; q.idx=idx; q.id=itemId(tid,lv,idx);
  q.hint=gl(it.hint);
  return q;
}

       '<p style="color:var(--muted);font-size:.9rem;margin:.25rem 0 0">'+esc(t(tr.dk))+"</p></div>";
    h+='<div class="grid g2">';
    tops.forEach(function(tp){
      var best=0,li;
      for(li=1;li<=3;li++)best=Math.max(best,mastery(tp.id,li));
      h+='<button class="card tcard trk '+tr.cls+'" data-a="open" data-t="'+esc(tp.id)+'">'+
        "<h3>"+esc(tName(tp))+"</h3>"+

        '<div style="display:flex;align-items:center;gap:.5rem;margin-top:.35rem">'+

        '<span class="chip">'+Math.round(best*100)+"%</span></div></button>";
    });
    h+="</div>";
  });
  return h+"</div>"+fbar();
}

function levelBar(tp){

  for(i=1;i<=3;i++){
    var m=mastery(tp.id,i);
    h+='<button class="lvl'+(state.level===i&&!state.challenge?" on":"")+'" aria-pressed="'+(state.level===i&&!state.challenge?"true":"false")+'" data-a="lvl" data-v="'+i+'">'+
      esc(t("lv"+i))+' <span class="bar '+barCls(m)+'" style="width:2.6rem;flex:none">'+
      '<i style="width:'+Math.round(m*100)+'%"></i></span></button>';
  }
  if(CH_GATE){
    h+='<button class="lvl'+(state.challenge?" on":"")+'" aria-pressed="'+(state.challenge?"true":"false")+'" data-a="chal"'+(state.challenge?' style="background:#6d28d9;color:#fff;border-color:#6d28d9;font-weight:700"':"")+'>'+esc(t("lvC"))+'</button>';
  }
  h+="</div>";
  if(CH_GATE&&state.challenge){
    h+='<div style="display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin:.4rem 0">'+
       '<span style="font-size:.88rem;color:var(--muted)">'+esc(t("chMixed"))+'</span>'+
       '<span style="font-size:.88rem;color:var(--muted)">· '+esc(t("chTimer"))+':</span>'+

         return '<button class="lvl'+(state.chSecs===s?" on":"")+'" aria-pressed="'+(state.chSecs===s?"true":"false")+'" data-a="chsec" data-v="'+s+'" style="min-height:46px">'+(s===0?esc(t("chOff")):esc(t("chSec").replace("{0}",s)))+'</button>';
       }).join("")+'</div>';

function spkBtn(text,lang,slow,label){
  return '<button class="spk'+(slow?" sm":"")+'" data-a="say" data-say="'+esc(text)+
    '" data-lang="'+esc(lang)+'"'+(slow?' data-slow="1"':"")+
    ' aria-label="'+esc(label||t("hear"))+'">'+(slow?ic("slow",15):'\u266b '+esc(label||t("hear")))+"</button>";
}
function spkStop(){
  return '<button class="spk spkStop" data-a="stop" aria-label="'+esc(t("stopB"))+'">'+esc(t("stopB"))+"</button>";
}

/* כרטיס הנושא: מה שמוצג מעל האפשרויות. בהיסטוריה זו כותרת
   האירוע או המושג, ולצידה כפתורי השמעה בשפת הממשק. */
function leadBox(txt,sub){
  if(!txt)return "";
  return '<div class="subject"><span class="word" style="font-size:1.15rem">'+esc(txt)+"</span>"+
    (sub?'<span class="ipa">'+esc(sub)+"</span>":"")+
    '<span style="margin-inline-start:auto;display:flex;gap:.4rem">'+
    spkBtn(txt,state.lang,false,t("hearWord"))+spkBtn(txt,state.lang,true,t("hearSlow"))+spkStop()+"</span></div>";
}

/* נוסח השאלה, ולצידו כפתורי השמעה. באזרחות השאלה היא משפט שלם
   ולא מילה בודדת, ולכן היא יושבת בשורה משלה ולא בתוך שורת נושא. */
function askBox(txt){
  if(!txt)return "";
  return '<div class="subject" style="align-items:flex-start">'+
    '<span class="qtext" style="flex:1;margin:0">'+esc(txt)+"</span>"+
    '<span style="display:flex;gap:.4rem;flex:none">'+
    spkBtn(txt,state.lang,false,t("hearWord"))+spkBtn(txt,state.lang,true,t("hearSlow"))+spkStop()+"</span></div>";
}

function screenPractice(){
  var tp=topicOf(state.topic); if(!tp){state.screen="home";return screenHome()}
  var tr=trackOf(tp.trk), q=P.q;
  var h='<div class="wrap"><div class="trk '+tr.cls+'">';
  h+='<div style="display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin:1rem 0 .6rem">'+
     '<span class="tdot"></span><h2 style="font-size:1.2rem">'+esc(tName(tp))+"</h2>"+
     '<span class="tpill">'+esc(t(tr.nk))+"</span></div>";
  h+=levelBar(tp);
  h+='<p style="color:var(--muted);font-size:.88rem;margin:.5rem 0 .8rem">'+esc(t("lv"+state.level+"D"))+"</p>";
  h+=vstrip();
  if(!q)return h+"</div></div>"+fbar();

  h+='<div class="card qcard">';
  h+='<div class="qtop"><span class="chip">'+esc(q.prompt)+"</span>"+
     '<span class="chip" style="margin-inline-start:auto">'+esc(t("todayL"))+" "+(state.day.n||0)+"</span></div>";

  h+=askBox(q.lead||"");
  /* האיור, כשיש. הוא אינו נדרש לפתרון — הוא מראה במבט אחד את
     מה שהטקסט מתאר במילים, ולכן הוא עוזר בדיוק למי שהטקסט
     מכביד עליו. */
  if(q.fig)h+=q.fig;

  {
    h+='<div class="opts'+(q.opts.length>3?"":" two")+'" id="opts">';
    /* רמקול לכל אפשרות, כמו באנגלית: מי שאינו יודע לקרוא את הניסוח
       לא יכול לבחור בו. הקראת אפשרות אינה הסגרת תשובה — היא זמינה
       על כל ארבע במידה שווה, והמעקב הצהוב עובד כמו בנוסח השאלה. */
    q.opts.forEach(function(o,i){
      var cls="opt";
      if(P.done){
        if(o.ok)cls+=" ok";
        else if(i===P.picked)cls+=" bad";
        else cls+=" dim";
      }
      var ob='<button class="'+cls+'" data-a="pick" data-i="'+i+'"'+(P.done?" disabled":"")+'>'+
        '<span class="k">'+String.fromCharCode(65+i)+"</span><span>"+o.h+"</span></button>";
      h+='<div class="orow">'+ob+
        '<button class="spk sm" data-a="say" data-say="'+esc(plainOf(o.h))+'" data-lang="'+esc(state.lang)+
        '" aria-label="'+esc(t("hearOpt"))+'">'+ic("play",15)+"</button></div>";
    });
    h+="</div>";
  }

  if(P.done){
    var it=q.reveal;
    h+='<div class="fb '+(P.ok?"ok":"bad")+'"><b>'+(P.ok?esc(t("correct")):esc(t("wrong")))+"</b>";
    if(!P.ok){h+='<div class="body">'+esc(t("answerIs"))+" <b>"+esc(q.answer)+"</b></div>";
      if(P.timeUp)h+='<div class="body" style="color:#b45309;font-weight:700">'+esc(t("chTimeUp"))+'</div>';
      var wp=P.picked>=0&&q.opts[P.picked]?q.opts[P.picked].why:"";
      if(wp)h+='<div class="why"><b>'+esc(t("whyNot"))+":</b> "+esc(wp)+"</div>";}
    /* ההסבר נפתח גם כשצדקו. תשובה נכונה שנוחשה נראית בדיוק כמו
       תשובה נכונה שנודעה, ורק ההסבר מבדיל ביניהן. */
    if(it&&it.ex)h+='<div class="why"><b>'+esc(t("whyT"))+":</b> "+esc(gl(it.ex))+"</div>";
    h+="</div>";
    h+='<div style="display:flex;gap:.5rem;margin-top:.9rem;flex-wrap:wrap">'+
       spkBtn(saySpell(q.say),state.lang,false,t("hearSent"))+spkBtn(saySpell(q.say),state.lang,true,t("hearSlow"))+spkStop()+
       '<button class="btn pri" data-a="next" style="margin-inline-start:auto">'+
       esc(t("next"))+" "+ic("arrow",16)+"</button></div>";
  } else {
    h+='<div style="display:flex;gap:.5rem;margin-top:.9rem;flex-wrap:wrap;align-items:center">'+
       (state.challenge&&state.chSecs>0?'<span id="chtimer" style="font-weight:800;color:#b45309;min-width:2.6rem;font-size:1.1rem">'+state.chSecs+'</span>':"")+
       (P.hint||state.challenge?"":'<button class="btn ghost" data-a="hint">'+esc(t("hintB"))+"</button>")+
       '<button class="btn ghost" data-a="dunno">'+esc(t("dunno"))+"</button>"+
       (!state.challenge&&window.TUTOR&&TUTOR.on()?'<button class="btn ghost" data-a="tutor">'+esc(TUTOR.label())+"</button>":"")+"</div>";
    if(P.hint&&q.hint)h+='<div class="qhint" style="margin-top:.6rem">'+esc(q.hint)+"</div>";
  }
  h+="</div></div></div>"+fbar();
  return h;
}

function screenProg(){
  var h='<div class="wrap"><h2 style="margin:1.1rem 0 .3rem;font-size:1.4rem">'+esc(t("progT"))+"</h2>";
  var acc=state.totalAsk?Math.round(100*state.totalOk/state.totalAsk):0;
  var seen=0,mast=0;

  h+='<div class="grid g3" style="margin:.8rem 0 1.2rem">';
  [[t("streakL"),state.streak||0],[t("todayL"),state.day.n||0],[t("accL"),acc+"%"]].forEach(function(p){
    h+='<div class="card" style="text-align:center"><div style="font-size:1.9rem;font-weight:800">'+
      esc(String(p[1]))+'</div><div style="color:var(--muted);font-size:.9rem">'+esc(p[0])+"</div></div>";
  });
  h+="</div>";
  if(!state.totalAsk)h+='<div class="card"><p style="margin:0;color:var(--muted)">'+esc(t("progNone"))+"</p></div>";
  TRACKS.forEach(function(tr){
    var tops=TOPICS.filter(function(x){return x.trk===tr.id&&
      [1,2,3].some(function(l){var s=state.stats[stKey(x.id,l)];return s&&s.seen})});
    if(!tops.length)return;
    h+='<div class="trk '+tr.cls+'"><div class="thead" style="margin:1.2rem 0 .5rem">'+
       '<span class="tdot"></span><h3 style="font-size:1.05rem">'+esc(t(tr.nk))+"</h3></div>";
    h+='<div class="card">';
    tops.forEach(function(tp){
      h+='<div class="row"><div><div class="lab">'+esc(tName(tp))+"</div>"+
        '<div class="desc">';
      for(var l=1;l<=3;l++){
        var s=state.stats[stKey(tp.id,l)];
        if(s&&s.seen)h+=esc(t("lv"+l))+" "+s.ok+"/"+s.seen+"   ";
      }
      h+="</div></div>";
      var best=Math.max(mastery(tp.id,1),mastery(tp.id,2),mastery(tp.id,3));
      h+='<span class="bar '+barCls(best)+'" style="max-width:8rem"><i style="width:'+
        Math.round(best*100)+'%"></i></span></div>';
    });
    h+="</div></div>";
  });
  h+='<p style="color:var(--muted);font-size:.9rem;margin-top:1rem">'+esc(t("seen"))+": "+seen+
     " · "+esc(t("mastered"))+": "+mast+"</p>";
  return h+"</div>"+fbar();
}

/* ============================================================
   מבחן מדומה
   ------------------------------------------------------------
   עשרים שאלות מכל הנושאים ומכל הרמות, בחוברת אחת שגוללים בה —
   ולא שאלה־שאלה. מי שקורא לאט צריך לראות כמה נשאר, לחזור אחורה
   ולשנות תשובה; ניווט שמסתיר את שאר השאלות לוקח ממנו בדיוק את זה.

   המבחן אינו נשמר. הוא מצב זמני בזיכרון בלבד, ורענון הדף מתחיל
   אותו מחדש — זו הצהרה ולא פער: שעון שממשיך לרוץ בין ביקורים
   הוא בדיוק המקום שבו נולדים באגים שקשה לשחזר.
   ============================================================ */
var SIM_N=20, SIM_MIN=30;
var SIM={on:false,done:false,q:[],ans:[],end:0,tick:null};

function simStop(){if(SIM.tick){clearInterval(SIM.tick);SIM.tick=null}}
function simFmt(ms){
  if(ms<0)ms=0;
  var sec=Math.round(ms/1000),m=Math.floor(sec/60),c=sec%60;
  return m+":"+(c<10?"0":"")+c;
}
function simLeftN(){
  var n=0,i;
  for(i=0;i<SIM.ans.length;i++)if(SIM.ans[i]<0)n++;
  return n;
}
function simRight(){
  var n=0,i;
  for(i=0;i<SIM.q.length;i++)if(SIM.ans[i]>=0&&SIM.q[i].opts[SIM.ans[i]].ok)n++;
  return n;
}
function simStart(){
  var pairs=[],qs=[],i,q;
  TOPICS.forEach(function(tp){for(var l=1;l<=3;l++)pairs.push([tp.id,l])});
  shuffle(pairs);
  for(i=0;i<pairs.length&&qs.length<SIM_N;i++){
    q=buildQuestion(pairs[i][0],pairs[i][1],undefined,true);
    if(q)qs.push(q);
  }
  /* פחות צמדי נושא-רמה מ-SIM_N: סבב נוסף, בלי לחזור על אותו פריט. */
  var guard=0;
  while(qs.length<SIM_N&&guard<400){
    var pr=pairs[guard%pairs.length]; guard++;
    q=buildQuestion(pr[0],pr[1],undefined,true);
    if(!q)continue;
    var dup=false,k;
    for(k=0;k<qs.length;k++)if(qs[k].id===q.id){dup=true;break}
    if(!dup)qs.push(q);
  }
  SIM.q=qs;
  SIM.ans=qs.map(function(){return -1});
  SIM.on=true; SIM.done=false; SIM.end=Date.now()+SIM_MIN*60000;
  simArm();
}
function simArm(){
  simStop();
  if(SIM.on&&!SIM.done)SIM.tick=setInterval(simClock,1000);
}
function simClock(){
  var el=$("#simclock");
  /* המסך הוחלף — אין מה לעדכן, והשעון נעצר מעצמו. */
  if(!el){simStop();return}
  var left=SIM.end-Date.now();
  el.textContent=simFmt(left);
  if(left<=60000)el.classList.add("low");
  if(left<=0){simStop();simSubmit()}
}
/* ההגשה היא גם רגע הרישום: עד כאן לא נספרה אף תשובה, כדי
   שהמבחן לא ידחוף לבנק הטעויות שאלה שהנבחן עוד עמד לשנות. */
function simSubmit(){
  if(!SIM.on||SIM.done)return;
  simStop();
  var i;
  for(i=0;i<SIM.q.length;i++){
    var q=SIM.q[i],pk=SIM.ans[i];
    recordItem(q.tid,q.lv,q.id,pk>=0&&!!q.opts[pk].ok);
  }
  SIM.done=true; save(); render(); window.scrollTo(0,0);
}

function screenSim(){
  var h='<div class="wrap"><h2 style="margin:1.1rem 0 .3rem;font-size:1.4rem">'+esc(t("simT"))+"</h2>";
  if(!SIM.on){
    h+='<div class="card"><p style="margin:0 0 .8rem;color:var(--muted)">'+esc(t("simD"))+"</p>"+
       '<button class="btn pri" data-a="simstart">'+ic("play",16)+" "+esc(t("simStart"))+"</button></div>";
    return h+"</div>"+fbar();
  }
  if(SIM.done){
    var right=simRight(),pc=Math.round(100*right/Math.max(1,SIM.q.length));
    h+='<div class="card" style="text-align:center"><div style="font-size:2.2rem;font-weight:800">'+
       pc+'%</div><div style="color:var(--muted)">'+esc(t("simScore"))+" — "+right+" / "+SIM.q.length+"</div>"+
       '<div style="margin-top:.8rem"><button class="btn pri" data-a="simstart">'+
       ic("redo",16)+" "+esc(t("simAgain"))+"</button></div></div>";
    h+='<h3 style="margin:1.2rem 0 .2rem;font-size:1.1rem">'+esc(t("simReview"))+"</h3>";
    SIM.q.forEach(function(q,i){
      var pk=SIM.ans[i],ok=pk>=0&&!!q.opts[pk].ok;
      h+='<div class="simq"><div class="simn">'+esc(t("simQ"))+" "+(i+1)+" · "+
         esc(topicOf(q.tid)?tName(topicOf(q.tid)):"")+" · "+esc(t("lv"+q.lv))+"</div>";
      h+=askBox(q.lead||"");
      if(q.fig)h+=q.fig;
      h+='<div class="fb '+(ok?"ok":"bad")+'"><b>'+(ok?esc(t("correct")):esc(t("wrong")))+"</b>"+
         '<div class="body">'+esc(t("simYours"))+": <b>"+
         esc(pk>=0?plainOf(q.opts[pk].h):t("simNone"))+"</b><br>"+
         esc(t("answerIs"))+" <b>"+esc(q.answer)+"</b></div>";
      var wsim=pk>=0&&!ok&&q.opts[pk]?q.opts[pk].why:"";
      if(wsim)h+='<div class="why"><b>'+esc(t("whyT"))+":</b> "+esc(wsim)+"</div>";
      else if(q.reveal&&q.reveal.ex)
        h+='<div class="why"><b>'+esc(t("whyT"))+":</b> "+esc(gl(q.reveal.ex))+"</div>";
      h+="</div>";
      h+='<div style="display:flex;gap:.5rem;margin-top:.6rem">'+
         spkBtn(saySpell(q.say),state.lang,false,t("hearSent"))+
         spkBtn(saySpell(q.say),state.lang,true,t("hearSlow"))+spkStop()+"</div>";
      h+="</div>";
    });
    return h+"</div>"+fbar();
  }
  /* המבחן עצמו. השעון נדרך אחרי הציור, כי הוא מעדכן אלמנט
     שעדיין לא קיים בזמן שבניית ה-HTML רצה. */
  setTimeout(simArm,0);
  h+='<div class="simbar"><span class="clock" id="simclock">'+esc(simFmt(SIM.end-Date.now()))+"</span>"+
     '<span class="chip"><span id="simleft">'+simLeftN()+"</span> "+esc(t("simLeft"))+"</span>"+
     '<button class="btn pri" data-a="simsubmit" style="margin-inline-start:auto">'+
     esc(t("simSubmit"))+"</button></div>";
  SIM.q.forEach(function(q,i){
    h+='<div class="simq"><div class="simn">'+esc(t("simQ"))+" "+(i+1)+" / "+SIM.q.length+"</div>";
    h+=askBox(q.lead||"");
    if(q.fig)h+=q.fig;
    h+='<div class="opts">';
    q.opts.forEach(function(o,j){
      /* הבחירה נמסרת גם לקורא המסך ולא רק בצבע. במבחן הכיתתי
         (viewSit) זה כבר כך, ובמבחן המדומה היה חסר. */
      h+='<button class="opt'+(SIM.ans[i]===j?" sel":"")+'" data-a="simpick" data-i="'+i+
        '" data-j="'+j+'" aria-pressed="'+(SIM.ans[i]===j?"true":"false")+'"><span class="k">'+String.fromCharCode(65+j)+"</span><span>"+o.h+"</span></button>";
    });
    h+="</div></div>";
  });
  h+='<div style="margin:1rem 0"><button class="btn pri" data-a="simsubmit">'+
     esc(t("simSubmit"))+"</button></div>";
  return h+"</div>"+fbar();
}

/* ============================================================
   בנק הטעויות
   ------------------------------------------------------------
   לא רשימת ציונים אלא רשימת עבודה: כל שאלה שנענתה לא נכון
   יושבת כאן עד שתיענה נכון פעמיים ברצף. הבנק שומר מזהי פריטים
   ולא עותקים של שאלות, ולכן עריכה של שאלה בתוכן אינה מותירה

var gkShow=false,gkMsg=null,askReset=false;

/* אתגר: שאלה פתוחה בלי רמז — ולכן גם בלי המורה. אותו תנאי שמסתיר
   את כפתור הרמז ב-screenPractice. הכפתור הצף נבנה ב-/tutor/tutor.js
   (#tu-fl, עם [hidden]{display:none}); הוא מוסתר מכאן ולא משם, כדי
   לא לגעת בקובץ המשותף. פאנל שנפתח לפני האתגר נסגר. אחרי המענה
   המורה חוזר, כמו ההסבר. */
function tutorGate(){
  var off=state.screen==="prac"&&state.challenge&&!(P&&P.done)&&!view;
  var fl=document.getElementById("tu-fl");
  if(!fl)return;
  if(off){
    /* הכפתור מוסתר גם כשהפאנל פתוח (floatHide ב-tutor.js); מוסתר בלי
       הסימון שלנו = הפאנל פתוח. close מחזיר את הכפתור, ולכן קודם. */
    if(fl.hidden&&fl.getAttribute("data-gate")!=="1"&&window.TUTOR&&TUTOR.close)try{TUTOR.close()}catch(e){}
    fl.hidden=true; fl.setAttribute("data-gate","1");
  }else if(fl.getAttribute("data-gate")==="1"){
    fl.hidden=false; fl.removeAttribute("data-gate");
  }
}
function render(){ try{lgChrome()}catch(e){}
  applyModes();
  lvlSync();
  try{tutorGate()}catch(e){}
  /* מבחן שהגיע מקישור עוקף הכול, כולל מסך הפתיחה: מי שנכנס
     להיבחן לא בהכרח פתח את האפליקציה הזאת אי פעם. */
  /* תלמיד שפתח את דף המושגים באמצע מבחן חייב דרך חזרה מפורשת.
     סרגל הניווט הרגיל לא מכיר את המבחן ולא יחזיר אותו אליו. */

      esc(xf("stBackTo",SIT.i+1,SIT.qs.length))+'</button></div></div>'+viewFormulas();
    return;
  }

  if(view==="badexam"||view==="oldexam"){
    $("#app").innerHTML=viewBadExam(view==="oldexam"?
      xt("exOld"):xt("exBroken"));

  }
  if(view==="exam"||view==="marks"){

  }
  var body=state.screen==="prog"?screenProg():
           state.screen==="sim" ?screenSim():
           state.screen==="bad" ?screenBad():
           state.screen==="set" ?screenSet():
           state.screen==="form"?viewFormulas():
           state.screen==="prac"?screenPractice():screenHome();
  $("#app").innerHTML=hdr()+body;
}

/* אין track ב-blankState של האפליקציה הזאת, ולכן בכניסה הראשונה

function topicsForTrack(trk){
