  Q("a1-pulley",{"he": "חבר טוען: ״גלגלת יוצרת כוח חדש, ולכן אפשר להרים ארון כבד בלי להשקיע כוח בכלל״. איזו תגובה נכונה מדעית?", "ar": "يدّعي صديق: «البكرة تُنشئ قوة جديدة، لذلك يمكن رفع خزانة ثقيلة دون بذل أي قوة». أي ردّ صحيح علميًا؟", "ru": "Друг утверждает: «Блок создаёт новую силу, поэтому тяжёлый шкаф можно поднять, вообще не прикладывая силы». Какой ответ научно верен?", "en": "A friend claims: \"A pulley creates new force, so you can lift a heavy closet without applying any force.\" Which reply is scientifically correct?"},[{"he": "הגלגלת משנה כיוון או מחלקת כוח, אבל לא יוצרת כוח חדש.", "ar": "البكرة تغيّر الاتجاه أو توزّع القوة، لكنها لا تُنشئ قوة جديدة.", "ru": "Блок меняет направление или распределяет силу, но не создаёт новой силы.", "en": "A pulley changes direction or shares force, but does not create new force."},{"he": "הטענה נכונה: גלגלת טובה מחליפה את עבודת השרירים.", "ar": "الادعاء صحيح: البكرة الجيدة تحل محل عمل العضلات.", "ru": "Утверждение верно: хороший блок заменяет работу мышц.", "en": "The claim is right: a good pulley replaces muscle work."},{"he": "הגלגלת מבטלת את כוח הכבידה, ולכן הארון קל.", "ar": "البكرة تلغي الجاذبية، لذلك تصبح الخزانة خفيفة.", "ru": "Блок отменяет силу тяжести, поэтому шкаф лёгкий.", "en": "The pulley cancels gravity, so the closet is light."},{"he": "אי אפשר לדעת בלי לדעת ממה עשויה הגלגלת.", "ar": "لا يمكن المعرفة دون معرفة مادة صنع البكرة.", "ru": "Нельзя знать, не выяснив, из чего сделан блок.", "en": "You cannot tell without knowing what the pulley is made of."}],0,{"he": "שאלו את עצמכם מאיפה מגיעה האנרגיה להרמה.", "ar": "اسألوا أنفسكم من أين تأتي طاقة الرفع.", "ru": "Спросите себя, откуда берётся энергия для подъёма.", "en": "Ask yourselves where the lifting energy comes from."},{"he": "גלגלת היא כלי עזר: היא משנה את כיוון המשיכה או מחלקת את העומס בין חלקי החבל, אבל היא אינה מקור אנרגיה. האנרגיה מגיעה מהשרירים או ממנוע. למשל כדי להעלות דגל מושכים את החבל מטה דרך הגלגלת, והיד עדיין עובדת.", "ar": "البكرة أداة مساعدة: تغيّر اتجاه الشد أو توزّع الحمل بين أجزاء الحبل، لكنها ليست مصدر طاقة. الطاقة تأتي من العضلات أو من محرك. مثال: لرفع علم نسحب الحبل للأسفل عبر البكرة، واليد ما زالت تعمل.", "ru": "Блок является вспомогательным устройством: он меняет направление тяги или распределяет нагрузку между ветвями верёвки, но не источник энергии. Энергия приходит от мышц или мотора. Например, чтобы поднять флаг, тянем верёвку вниз через блок, и рука всё равно работает.", "en": "A pulley is a helper: it changes the pull direction or shares the load between rope parts, but it is not an energy source. The energy comes from muscles or a motor. For example, to raise a flag you pull the rope down through the pulley, and the hand still works."},null,[null,{"he": "אם גלגלת הייתה יוצרת כוח, אפשר היה לבנות מכונה שעובדת בלי אנרגיה, וזה סותר את חוק שימור האנרגיה.", "ar": "لو كانت البكرة تُنشئ قوة، لأمكن بناء آلة تعمل بلا طاقة، وهذا يناقض قانون حفظ الطاقة.", "ru": "Если бы блок создавал силу, можно было бы построить машину, работающую без энергии, а это противоречит закону сохранения энергии.", "en": "If a pulley created force, you could build a machine that runs without energy, which contradicts energy conservation."},{"he": "כוח הכבידה פועל על הארון כרגיל; הגלגלת רק משנה את אופן ההתגברות עליו.", "ar": "الجاذبية تعمل على الخزانة كالمعتاد؛ البكرة فقط تغيّر طريقة التغلب عليها.", "ru": "Сила тяжести действует на шкаф как обычно; блок лишь меняет способ её преодоления.", "en": "Gravity acts on the closet as usual; the pulley only changes how you overcome it."},{"he": "החומר אינו משנה את עקרון הכוחות; בודקים חבל, כוחות ותנועה.", "ar": "المادة لا تغيّر مبدأ القوى؛ نفحص الحبل والقوى والحركة.", "ru": "Материал не меняет принцип сил; проверяют верёвку, силы и движение.", "en": "The material does not change the principle of forces; you check rope, forces and motion."}]),
  Q("a1-fair-test",{"he": "תלמיד רוצה לבדוק איך סוג המשטח משפיע על החיכוך. איזה ניסוי יתן תשובה טובה?", "ar": "يريد طالب أن يفحص كيف يؤثر نوع السطح على الاحتكاك. أي تجربة تعطي إجابة جيدة؟", "ru": "Ученик хочет проверить, как тип поверхности влияет на трение. Какой опыт даст хороший ответ?", "en": "A student wants to test how the surface type affects friction. Which experiment gives a good answer?"},[{"he": "לגרור קוביית עץ על שיש וקוביית פלסטיק על שטיח, ולמדוד את כוח הגרירה בכל מקרה.", "ar": "سحب مكعب خشبي على رخام ومكعب بلاستيكي على سجادة، وقياس قوة السحب في كل حالة.", "ru": "Тянуть деревянный кубик по мрамору и пластиковый по ковру, измеряя силу тяги в каждом случае.", "en": "Drag a wooden cube on marble and a plastic cube on carpet, measuring the pull force in each case."},{"he": "לגרור קובייה אחת על שטיח ביום שמש ועל שיש ביום גשום.", "ar": "سحب مكعب واحد على سجادة في يوم مشمس وعلى رخام في يوم ممطر.", "ru": "Тянуть один кубик по ковру в солнечный день и по мрамору в дождливый.", "en": "Drag one cube on carpet on a sunny day and on marble on a rainy day."},{"he": "לגרור קובייה כבדה על שיש וקובייה קלה על שטיח, ולהשוות את הכוחות.", "ar": "سحب مكعب ثقيل على رخام ومكعب خفيف على سجادة، ومقارنة القوى.", "ru": "Тянуть тяжёлый кубик по мрамору и лёгкий по ковру, сравнивая силы.", "en": "Drag a heavy cube on marble and a light cube on carpet, comparing the forces."},{"he": "לגרור את אותה קובייה באותה מהירות, פעם על שיש ופעם על שטיח, ולמדוד את הכוח.", "ar": "سحب المكعب نفسه بالسرعة نفسها، مرة على رخام ومرة على سجادة، وقياس القوة.", "ru": "Тянуть тот же кубик с той же скоростью сначала по мрамору, потом по ковру, измеряя силу.", "en": "Drag the same cube at the same speed, once on marble and once on carpet, measuring the force."}],3,{"he": "בניסוי הוגן משנים רק דבר אחד בכל פעם.", "ar": "في التجربة العادلة نغيّر شيئًا واحدًا فقط كل مرة.", "ru": "В честном опыте меняют только одну вещь за раз.", "en": "In a fair experiment you change only one thing at a time."},{"he": "כדי לבודד את השפעת המשטח, כל שאר התנאים נשארים זהים: אותה קובייה, אותה מהירות, אותו מד כוח. רק סוג המשטח משתנה. למשל בוחני צמיגים מנסים אותם על אותה מכונית ומחליפים רק את פני הכביש.", "ar": "لعزل تأثير السطح، تبقى كل الشروط الأخرى كما هي: نفس المكعب، نفس السرعة، نفس مقياس القوة. فقط نوع السطح يتغير. مثال: مختبرو الإطارات يجربونها على نفس السيارة ويغيّرون سطح الطريق فقط.", "ru": "Чтобы выделить влияние поверхности, все прочие условия остаются теми же: тот же кубик, та же скорость, тот же динамометр. Меняется только тип поверхности. Например, испытатели шин проверяют их на одной машине и меняют только покрытие дороги.", "en": "To isolate the surface's effect, every other condition stays the same: same cube, same speed, same force meter. Only the surface type changes. For example, tire testers try tires on the same car and change only the road surface."},null,[{"he": "כאן השתנו גם חומר הקובייה וגם המשטח, ואי אפשר לדעת מה גרם להבדל.", "ar": "هنا تغيّرت مادة المكعب والسطح معًا، فلا يمكن معرفة سبب الفرق.", "ru": "Здесь изменились и материал кубика, и поверхность, поэтому причину различия не определить.", "en": "Here both the cube's material and the surface changed, so the cause of any difference stays unknown."},{"he": "מזג האוויר מוסיף משתנה נוסף שמלבלבל את המדידה.", "ar": "الطقس يضيف متغيرًا آخر يشوّش القياس.", "ru": "Погода добавляет ещё одну переменную, которая искажает измерение.", "en": "The weather adds another variable that muddies the measurement."},{"he": "המסה משפיעה על החיכוך, ולכן ההשוואה אינה הוגנת.", "ar": "الكتلة تؤثر على الاحتكاك، لذلك المقارنة غير عادلة.", "ru": "Масса влияет на трение, поэтому сравнение нечестное.", "en": "Mass affects friction, so the comparison is not fair."},null]),
  Q("a1-helmet",{"he": "איזה ממצא הוא הראיה החזקה ביותר שקסדה מגנה על רוכבי אופניים?", "ar": "أي نتيجة هي أقوى دليل على أن الخوذة تحمي راكبي الدراجات؟", "ru": "Какой факт является самым сильным доказательством того, что шлем защищает велосипедистов?", "en": "Which finding is the strongest evidence that a helmet protects bike riders?"},[{"he": "חבר שלי החליק בלי קסדה ולא קרה לו כלום.", "ar": "صديق لي انزلق بدون خوذة ولم يصب بأذى.", "ru": "Мой друг поскользнулся без шлема, и ничего не случилось.", "en": "A friend of mine slipped without a helmet and nothing happened to him."},{"he": "סקר גדול: בקרב רוכבים שנפלו, חובשי קסדה נפצעו בראש פחות.", "ar": "مسح كبير: بين الراكبين الذين سقطوا، أصيب مرتدو الخوذة في الرأس أقل بكثير.", "ru": "Большой обзор: среди упавших велосипедистов те, кто был в шлеме, получали травмы головы гораздо реже.", "en": "A large survey: among riders who fell, helmet wearers had far fewer head injuries."},{"he": "הקסדות בחנויות נראות קשות ומוצקות.", "ar": "الخوذات في المتاجر تبدو صلبة وقوية.", "ru": "Шлемы в магазинах выглядят твёрдыми и прочными.", "en": "The helmets in stores look hard and sturdy."},{"he": "היצרן כותב על האריזה שהקסדה עברה את כל הבדיקות.", "ar": "الشركة المصنعة تكتب على العبوة أن الخوذة اجتازت كل الفحوص.", "ru": "Производитель пишет на упаковке, что шлем прошёл все проверки.", "en": "The manufacturer writes on the package that the helmet passed every test."}],1,{"he": "ראיה חזקה מסתמכת על הרבה מקרים ועל השוואה, לא על סיפור בודד.", "ar": "الدليل القوي يعتمد على حالات كثيرة ومقارنة، لا على قصة واحدة.", "ru": "Сильное доказательство опирается на много случаев и на сравнение, а не на одну историю.", "en": "Strong evidence rests on many cases and a comparison, not on a single story."},{"he": "מדע מסתמך על נתונים ממדגם גדול ועל השוואה בין קבוצות. אם בקרב נופלים חובשי הקסדה נפצעים פחות, יש קשר סביר בין קסדה להגנה. למשל גם תאונה בודדת של רוכב עם קסדה אינה מפריכה את המגמה הכללית.", "ar": "العلم يعتمد على بيانات من عينة كبيرة وعلى مقارنة بين مجموعتين. إذا كان الساقطون مرتدي الخوذة يُصابون أقل، فثمة علاقة معقولة بين الخوذة والحماية. مثال: حتى حادثة واحدة لراكب بخوذة لا تدحض الاتجاه العام.", "ru": "Наука опирается на данные большой выборки и сравнение групп. Если среди упавших те, кто в шлеме, травмируются реже, связь шлема с защитой правдоподобна. Например, даже одиночная авария с велосипедистом в шлеме не опровергает общую тенденцию.", "en": "Science relies on data from a large sample and on comparing groups. If among fallen riders the helmet wearers are injured less, a link between helmets and protection is plausible. For example, even a single crash of a helmeted rider does not disprove the general trend."},null,[{"he": "מקרה בודד אינו מייצג; החלקה אחרת עלולה הייתה להסתיים אחרת.", "ar": "حالة واحدة لا تمثل؛ انزلاقة أخرى قد تنتهي بشكل مختلف.", "ru": "Один случай не представляет картину; другое падение могло кончиться иначе.", "en": "A single case is not representative; another slip could have ended differently."},null,{"he": "מראה קשה אינו מבטיח הגנה; בודקים ביצועים במעבדה ונתוני פציעות.", "ar": "المظهر الصلب لا يضمن الحماية؛ نفحص الأداء في المختبر وبيانات الإصابات.", "ru": "Твёрдый вид не гарантирует защиту; проверяют работу в лаборатории и данные о травмах.", "en": "A hard look does not guarantee protection; performance is checked in labs and injury data."},{"he": "ליצרן אינטרס למכור; מחפשים בדיקות בלתי תלויות.", "ar": "للمصنّع مصلحة في البيع؛ نبحث عن فحوص مستقلة.", "ru": "У производителя есть интерес продать; ищут независимые проверки.", "en": "The manufacturer has an interest in selling; look for independent testing."}])
 ]]),

topic("energy-daily","704182",
  {"he": "אנרגיה בחיי היומיום", "ar": "الطاقة في الحياة اليومية", "ru": "Энергия в повседневной жизни", "en": "Energy in everyday life"},
  {"he": "מאיפה באה האנרגיה, איך היא משנה צורה, ואיך חוסכים אותה", "ar": "من أين تأتي الطاقة، وكيف تتغير، وكيف نوفرها", "ru": "Откуда берётся энергия, как она превращается и как её экономить", "en": "Where energy comes from, how it changes form, and how to save it"},
[ [
Q("a2-sun",{"he": "משפחה תולה כביסה רטובה על חבל בחצר בצהריים. מאיפה מגיעה רוב האנרגיה שמייבשת את הכביסה?", "ar": "عائلة تنشر غسيلًا مبللًا على حبل في الساحة ظهرًا. من أين يأتي معظم الطاقة التي تجفف الغسيل؟", "ru": "Семья вешает мокрое бельё на верёвку во дворе в полдень. Откуда приходит большая часть энергии, которая сушит бельё?", "en": "A family hangs wet laundry on a line in the yard at noon. Where does most of the energy that dries the laundry come from?"},[{"he": "מחברת החשמל, שמעבירה זרם דרך חבל הכביסה.", "ar": "من شركة الكهرباء التي تنقل التيار عبر حبل الغسيل.", "ru": "От электрокомпании, которая передаёт ток по бельевой верёвке.", "en": "From the power company, which sends current through the laundry line."},{"he": "מהשמש, שמחממת את הבד ומאדה את המים שבו.", "ar": "من الشمس التي تسخّن القماش وتبخّر الماء فيه.", "ru": "От Солнца: оно нагревает ткань и испаряет воду в ней.", "en": "From the Sun, which heats the fabric and evaporates the water in it."},{"he": "מהאדמה, ששואבת את המים החוצה מהבגדים.", "ar": "من الأرض التي تمتص الماء من الملابس.", "ru": "От земли, которая вытягивает воду из одежды.", "en": "From the ground, which draws the water out of the clothes."},{"he": "מהחום האגור בקירות הבית סביב החצר.", "ar": "من الحرارة المخزنة في جدران البيت حول الساحة.", "ru": "От тепла, накопленного в стенах дома вокруг двора.", "en": "From heat stored in the house walls around the yard."}],1,{"he": "חשבו מה מחמם את הבגדים הרטובים ביום בהיר, גם כשאין רוח.", "ar": "فكّروا ما الذي يسخّن الملابس المبللة في يوم مشمس حتى بلا رياح.", "ru": "Подумайте, что нагревает мокрую одежду в ясный день даже без ветра.", "en": "Think about what heats wet clothes on a bright day even without wind."},{"he": "השמש היא מקור האנרגיה המרכזי של כדור הארץ: קרני השמש מחממות את הבד, והחום מאיץ את אידוי המים. למשל פאנלים סולאריים על גגות הופכים אור שמש לחשמל ביתי.", "ar": "الشمس هي مصدر الطاقة الرئيسي لكوكب الأرض: أشعتها تسخّن القماش، والحرارة تسرّع تبخر الماء. مثال: الألواح الشمسية على الأسطح تحوّل ضوء الشمس إلى كهرباء منزلية.", "ru": "Солнце является главным источником энергии Земли: его лучи нагревают ткань, а тепло ускоряет испарение воды. Например, солнечные панели на крышах превращают солнечный свет в домашнее электричество.", "en": "The Sun is Earth's main energy source: its rays heat the fabric, and the heat speeds up evaporation. For example, rooftop solar panels turn sunlight into household electricity."},null,[{"he": "חבל כביסה אינו מחובר לחשמל, והכביסה מתייבשת גם בלי חשמל.", "ar": "حبل الغسيل غير موصول بالكهرباء، والغسيل يجف أيضًا بلا كهرباء.", "ru": "Бельевая верёвка не подключена к электричеству, и бельё сохнет и без него.", "en": "A laundry line is not connected to electricity, and laundry dries without it."},null,{"he": "האדמה אינה נוגעת בבגדים התלויים, ואינה שואבת מהם מים.", "ar": "الأرض لا تلمس الملابس المعلقة ولا تمتص منها الماء.", "ru": "Земля не касается висящей одежды и не вытягивает из неё воду.", "en": "The ground does not touch the hanging clothes or pull water from them."},{"he": "הקירות מתחממים מהשמש בעצמם; הם אינם המקור העיקרי לאנרגיה.", "ar": "الجدران نفسها تسخن من الشمس؛ فهي ليست المصدر الرئيسي للطاقة.", "ru": "Стены сами нагреваются от Солнца; они не главный источник энергии.", "en": "The walls themselves are heated by the Sun; they are not the main energy source."}]),
Q("a2-transform",{"he": "דורון מדליק פנס שעובד על סוללה. איזה שינוי אנרגיה קורה בתוך הפנס?", "ar": "دورون يشغّل مصباحًا يدويًا يعمل ببطارية. أي تحوّل طاقة يحدث داخل المصباح؟", "ru": "Дорон включает фонарик на батарейке. Какое превращение энергии происходит внутри фонарика?", "en": "Doron switches on a battery-powered flashlight. What energy change happens inside the flashlight?"},[{"he": "אנרגיה כימית מהסוללה הופכת לחשמל, וממנו לאור ולחום.", "ar": "الطاقة الكيميائية المخزنة في البطارية تتحول إلى كهرباء، ومنها إلى ضوء وحرارة.", "ru": "Химическая энергия батарейки превращается в ток, а из него в свет и тепло.", "en": "Chemical energy from the battery becomes electricity, then light and heat."},{"he": "אנרגיית האור בסביבה נאגרת בתוך הסוללה לשימוש בלילה.", "ar": "طاقة الضوء في المحيط تُخزَّن داخل البطارية لاستخدامها في الليل فقط.", "ru": "Световая энергия вокруг запасается в батарейке для использования ночью.", "en": "Light energy around is stored inside the battery for nighttime use."},{"he": "אנרגיית הקול של צעדים בלילה הופכת לזרם חשמלי בפנס.", "ar": "طاقة صوت الخطوات في الليل تتحول إلى تيار كهربائي في المصباح.", "ru": "Энергия звука шагов ночью превращается в ток внутри фонарика.", "en": "Sound energy from footsteps at night becomes electric current in the flashlight."},{"he": "אנרגיית התנועה של היד הופכת למזון חדש בתוך הסוללה.", "ar": "طاقة حركة اليد تتحول إلى غذاء جديد داخل البطارية.", "ru": "Энергия движения руки превращается в новую пищу внутри батарейки.", "en": "The hand's motion energy becomes new food inside the battery."}],0,{"he": "חשבו מה אגור בתוך סוללה טרייה, ומה יוצא מהפנס כשהוא דולק.", "ar": "فكّروا ما المخزون داخل بطارية جديدة، وما الذي يخرج من المصباح وهو يعمل.", "ru": "Подумайте, что запасено в свежей батарейке и что выходит из работающего фонарика.", "en": "Think about what is stored inside a fresh battery and what comes out of a lit flashlight."},{"he": "אנרגיה עוברת מצורה לצורה: בסוללה אגורה אנרגיה כימית, המעגל הופך אותה לזרם חשמלי, והנורה פולטת אור וגם קצת חום. למשל גם במזון אגורה אנרגיה כימית, והגוף הופך אותה לתנועה ולחום.", "ar": "الطاقة تنتقل من شكل إلى آخر: في البطارية تُخزن طاقة كيميائية، والدائرة تحوّلها إلى تيار كهربائي، والمصباح يصدر ضوءً وقليلًا من الحرارة. مثال: في الغذاء أيضًا تُخزن طاقة كيميائية، والجسم يحوّلها إلى حركة وحرارة.", "ru": "Энергия переходит из вида в вид: в батарейке запасена химическая энергия, цепь превращает её в ток, а лампочка излучает свет и немного тепла. Например, в пище тоже запасена химическая энергия, и тело превращает её в движение и тепло.", "en": "Energy moves from form to form: the battery stores chemical energy, the circuit turns it into current, and the bulb gives off light and some heat. For example, food also stores chemical energy, and the body turns it into motion and heat."},null,[null,{"he": "סוללה אינה קולטת אור; היא מספקת אנרגיה כימית שהייצור טען בה.", "ar": "البطارية لا تلتقط الضوء؛ فهي توفر طاقة كيميائية شُحنت فيها عند التصنيع.", "ru": "Батарейка не собирает свет; она отдаёт химическую энергию, заложенную при производстве.", "en": "A battery does not collect light; it supplies chemical energy stored at manufacture."},{"he": "לפנס אין חלק שהופך קול לחשמל; האור נוצר מהסוללה.", "ar": "ليس في المصباح جزء يحوّل الصوت إلى كهرباء؛ فالضوء يتولد من البطارية.", "ru": "В фонарике нет части, превращающей звук в электричество; свет даёт батарейка.", "en": "A flashlight has no part that turns sound into electricity; the light comes from the battery."},{"he": "סוללה אינה מייצרת מזון; האנרגיה שלה הופכת לחשמל בלבד.", "ar": "البطارية لا تنتج غذاء؛ فطاقتها تتحول إلى كهرباء فقط.", "ru": "Батарейка не производит пищу; её энергия превращается только в электричество.", "en": "A battery does not produce food; its energy becomes electricity only."}]),
Q("a2-save",{"he": "איזו פעולה חוסכת הכי הרבה חשמל בבית לאורך זמן?", "ar": "أي إجراء يوفر أكبر قدر من الكهرباء في البيت على المدى الطويل؟", "ru": "Какое действие экономит больше всего электричества дома на длительном сроке?", "en": "Which action saves the most electricity at home over time?"},[{"he": "להשאיר את הטלוויזיה דלוקה כשאף אחד לא צופה בה.", "ar": "ترك التلفاز يعمل عندما لا يشاهده أحد.", "ru": "Оставлять телевизор включённым, когда никто не смотрит.", "en": "Leaving the television on when nobody is watching."},{"he": "להחזיק את דלת המקרר פתוחה בזמן שבוחרים נשנוש.", "ar": "إبقاء باب الثلاجة مفتوحًا أثناء اختيار وجبة خفيفة.", "ru": "Держать дверцу холодильника открытой, пока выбираешь перекус.", "en": "Holding the fridge door open while choosing a snack."},{"he": "לכבות אורות ומכשירים בחדרים שאין בהם איש.", "ar": "إطفاء الأضواء والأجهزة في الغرف الخالية.", "ru": "Выключать свет и приборы в комнатах, где никого нет.", "en": "Turning off lights and devices in empty rooms."},{"he": "להדליק את כל האורות בבית בכל ערב.", "ar": "إشعال كل أضواء البيت كل مساء.", "ru": "Включать весь свет в доме каждый вечер.", "en": "Switching on all the house lights every evening."}],2,{"he": "חשבו איזו פעולה מפסיקה צריכת חשמל במקום להוסיף לה.", "ar": "فكّروا أي إجراء يوقف استهلاك الكهرباء بدلًا من زيادته.", "ru": "Подумайте, какое действие прекращает расход электричества вместо того, чтобы увеличивать его.", "en": "Think about which action stops electricity use instead of adding to it."},{"he": "חיסכון בחשמל מתחיל בלהפסיק צריכה מיותרת: מכשיר דולק צורך אנרגיה כל הזמן, גם כשאף אחד לא משתמש בו. למשל מנורת לד שנכבית ביציאה מהחדר חוסכת כסף ואנרגיה בכל לילה.", "ar": "توفير الكهرباء يبدأ بإيقاف الاستهلاك غير الضروري: الجهاز المشتغل يستهلك طاقة طوال الوقت حتى بلا مستخدم. مثال: مصباح ليد يُطفأ عند مغادرة الغرفة يوفر مالًا وطاقة كل ليلة.", "ru": "Экономия электричества начинается с прекращения лишнего расхода: включённый прибор потребляет энергию всё время, даже без пользователя. Например, светодиодная лампа, выключенная при выходе из комнаты, экономит деньги и энергию каждую ночь.", "en": "Saving electricity starts with stopping unneeded use: a running device draws energy the whole time, even with no user. For example, an LED lamp switched off when leaving the room saves money and energy every night."},null,[{"he": "טלוויזיה דולקת צורכת חשמל, ולכן זו בזבוז ולא חיסכון.", "ar": "التلفاز المشتغل يستهلك كهرباء، فهذا هدر وليس توفيرًا.", "ru": "Включённый телевизор тратит электричество; это расточительство, а не экономия.", "en": "A running television uses electricity, so that is waste, not saving."},{"he": "דלת פתוחה מכניסה חום למקרר, והמדחס עובד קשה יותר וצורך יותר.", "ar": "الباب المفتوح يدخل الحرارة إلى الثلاجة، فيعمل الضاغط بجهد أكبر ويستهلك أكثر.", "ru": "Открытая дверца впускает тепло, и компрессор работает сильнее и тратит больше.", "en": "An open door lets heat into the fridge, so the compressor works harder and uses more."},null,{"he": "תאורה מלאה בכל הבית מגדילה את הצריכה, ולא מקטינה אותה.", "ar": "الإضاءة الكاملة في كل البيت تزيد الاستهلاك ولا تنقصه.", "ru": "Полное освещение всего дома увеличивает расход, а не уменьшает его.", "en": "Lighting the whole house increases consumption instead of reducing it."}])

Q("a2-bill",{"he": "בחשבון החשמל של משפחת כהן נרשמה צריכה חודשית: ינואר 520 קוט״ש, אפריל 310 קוט״ש, יולי 610 קוט״ש, אוקטובר 320 קוט״ש. מה ההסבר הסביר ביותר לצריכה הגבוהה ביולי?", "ar": "في فاتورة كهرباء عائلة كوهين سُجل استهلاك شهري: يناير 520 ك.و.س، أبريل 310، يوليو 610، أكتوبر 320. ما التفسير الأرجح للاستهلاك المرتفع في يوليو؟", "ru": "В счёте семьи Коэн записан месячный расход: январь 520 кВт·ч, апрель 310, июль 610, октябрь 320. Какое объяснение высокого расхода в июле самое разумное?", "en": "The Cohen family's bill shows monthly use: January 520 kWh, April 310, July 610, October 320. What is the most reasonable explanation for the high July use?"},[{"he": "בקיץ יש יותר שמש, ולכן הבית צורך פחות חשמל.", "ar": "في الصيف شمس أكثر، لذلك يستهلك البيت كهرباء أقل.", "ru": "Летом больше солнца, поэтому дом тратит меньше электричества.", "en": "Summer has more sunshine, so the house uses less electricity."},{"he": "המזגן פועל שעות רבות בגלל החום, וצורך הרבה חשמל.", "ar": "المكيّف يعمل ساعات طويلة بسبب الحر، ويستهلك كثيرًا من الكهرباء.", "ru": "Кондиционер работает много часов из-за жары и тратит много электричества.", "en": "The air conditioner runs many hours because of the heat and uses much electricity."},{"he": "בחודש יולי השכנים מתחברים לחשמל של המשפחה.", "ar": "في يوليو يتصل الجيران بكهرباء العائلة.", "ru": "В июле соседи подключаются к электричеству семьи.", "en": "In July the neighbors connect to the family's electricity."},{"he": "מונה החשמל מתקלקל בלי סיבה דווקא בחודש יולי בכל שנה.", "ar": "عدّاد الكهرباء يتعطل من تلقاء نفسه في شهر يوليو من كل عام بالذات.", "ru": "Счётчик электричества каждый год ломается сам по себе именно в июле.", "en": "The electricity meter happens to break down on its own every single year in July."}],1,{"he": "חשבו איזה מכשיר ביתי עובד הכי קשה דווקא בחודשי הקיץ החמים.", "ar": "فكّروا أي جهاز منزلي يعمل بأقصى جهد في أشهر الصيف الحارة.", "ru": "Подумайте, какой домашний прибор работает интенсивнее всего именно в жаркие летние месяцы.", "en": "Think about which home device works hardest precisely in the hot summer months."},{"he": "המספרים מספרים סיפור: בקיץ ובחורף הצריכה כפולה כמעט, כי מזגן ותנור הם מכשירים בזבזניים. למשל בית שממזג כל הלילה יראה קפיצה בחשבון.", "ar": "الأرقام تحكي قصة: في الصيف والشتاء الاستهلاك يقارب الضعف، لأن المكيّف والمدفأة جهازان متعطشان للطاقة. مثال: بيت يكيّف طوال الليل ترتفع فاتورته.", "ru": "Числа говорят сами: летом и зимой расход почти вдвое выше, ведь кондиционер и обогреватель самые прожорливые. Например, ночной кондиционер даёт заметный скачок в счёте.", "en": "The numbers tell a story: summer and winter use is nearly double, since air conditioners and heaters are the hungriest. For example, all-night cooling shows a clear bill jump."},null,[{"he": "הנתונים מראים ההפך: דווקא בקיץ הצריכה הכי גבוהה.", "ar": "البيانات تظهر العكس: الاستهلاك الأعلى هو في الصيف تحديدًا.", "ru": "Данные показывают обратное: наибольший расход приходится именно на лето.", "en": "The data show the opposite: the highest use is precisely in summer."},null,{"he": "אין בנתונים שום רמז לשכנים; ההבדל מתאים לשימוש עונתי במכשירים.", "ar": "لا يوجد في البيانات أي تلميح للجيران؛ فالفرق يناسب استخدامًا موسميًا للأجهزة.", "ru": "В данных нет никаких намёков на соседей; разница соответствует сезонному использованию приборов.", "en": "Nothing in the data hints at neighbors; the difference fits seasonal device use."},{"he": "תקלה חוזרת כל שנה באותו חודש אינה סבירה; דפוס עונתי מסביר טוב יותר.", "ar": "عطل متكرر في الشهر نفسه كل عام أمر غير معقول؛ والنمط الموسمي يفسر بشكل أفضل.", "ru": "Поломка каждый год в одном месяце маловероятна; сезонная закономерность объясняет лучше.", "en": "A fault repeating every year in the same month is unlikely; a seasonal pattern explains it better."}]),
Q("a2-appliance",{"he": "צריכה ממוצעת לשעת עבודה: מזגן 2.0 קוט״ש, טלוויזיה 0.1 קוט״ש, מקרר 0.15 קוט״ש, קומקום חשמלי 2.2 קוט״ש. שני מכשירים עובדים שעה אחת. איזה זוג יצרוך הכי הרבה חשמל?", "ar": "متوسط الاستهلاك لساعة عمل: مكيّف 2.0 ك.و.س، تلفاز 0.1، ثلاجة 0.15، غلاية كهربائية 2.2. جهازان يعملان ساعة واحدة. أي زوج يستهلك أكبر قدر من الكهرباء؟", "ru": "Средний расход за час работы: кондиционер 2.0 кВт·ч, телевизор 0.1, холодильник 0.15, электрочайник 2.2. Два прибора работают один час. Какая пара потратит больше всего электричества?", "en": "Average use per working hour: air conditioner 2.0 kWh, television 0.1, fridge 0.15, electric kettle 2.2. Two devices run for one hour. Which pair uses the most electricity?"},[{"he": "טלוויזיה ומקרר.", "ar": "التلفاز والثلاجة.", "ru": "Телевизор и холодильник.", "en": "The television and the fridge."},{"he": "מזגן וטלוויזיה.", "ar": "المكيّف والتلفاز.", "ru": "Кондиционер и телевизор.", "en": "The air conditioner and the television."},{"he": "מקרר וקומקום חשמלי.", "ar": "الثلاجة والغلاية الكهربائية.", "ru": "Холодильник и электрочайник.", "en": "The fridge and the electric kettle."},{"he": "קומקום חשמלי ומזגן.", "ar": "الغلاية الكهربائية والمكيّف.", "ru": "Электрочайник и кондиционер.", "en": "Electric kettle and air conditioner."}],3,{"he": "חברו את שני המספרים בכל זוג, וחפשו את הסכום הגדול ביותר.", "ar": "اجمعوا الرقمين في كل زوج وابحثوا عن المجموع الأكبر.", "ru": "Сложите два числа в каждой паре и найдите наибольшую сумму.", "en": "Add the two numbers in each pair and look for the largest total."},{"he": "מחברים את הצריכה של שני המכשירים: קומקום ומזגן יחד צורכים 4.2 קוט״ש, יותר מכל זוג אחר. למשל גם בחשבון הביתי שווה לשים לב דווקא למכשירים הגדולים, כי הם מכריעים את הסכום.", "ar": "نجمع استهلاك الجهازين: الغلاية والمكيّف معًا يستهلكان 4.2 ك.و.س، أكثر من أي زوج آخر. مثال: في الفاتورة المنزلية أيضًا يُستحسن الانتباه للأجهزة الكبيرة تحديدًا، لأنها هي التي تحسم المجموع.", "ru": "Складываем расход двух приборов: чайник и кондиционер вместе тратят 4.2 кВт·ч, больше любой другой пары. Например, в домашнем счёте стоит следить именно за крупными приборами, потому что они решают итог.", "en": "Add the use of the two devices: kettle plus air conditioner comes to 4.2 kWh, more than any other pair. For example, in the home bill it pays to watch the big devices, because they decide the total."},null,[{"he": "טלוויזיה ומקרר יחד צורכים רק 0.25 קוט״ש, הרבה פחות מהזוגות האחרים.", "ar": "التلفاز والثلاجة معًا يستهلكان فقط 0.25 ك.و.س، أقل بكثير من الأزواج الأخرى.", "ru": "Телевизор с холодильником тратят лишь 0.25 кВт·ч, гораздо меньше остальных пар.", "en": "Television plus fridge totals only 0.25 kWh, far less than the other pairs."},{"he": "מזגן וטלוויזיה צורכים 2.1 קוט״ש, פחות מקומקום ומזגן.", "ar": "المكيّف والتلفاز يستهلكان 2.1 ك.و.س، أقل من الغلاية والمكيّف.", "ru": "Кондиционер с телевизором тратят 2.1 кВт·ч, меньше, чем чайник с кондиционером.", "en": "Air conditioner plus television totals 2.1 kWh, less than kettle plus air conditioner."},{"he": "מקרר וקומקום צורכים 2.35 קוט״ש, עדיין פחות מקומקום ומזגן.", "ar": "الثلاجة والغلاية يستهلكان 2.35 ك.و.س، وما زال أقل من الغلاية والمكيّف.", "ru": "Холодильник с чайником тратят 2.35 кВт·ч, всё равно меньше, чем чайник с кондиционером.", "en": "Fridge plus kettle totals 2.35 kWh, still less than kettle plus air conditioner."},null]),
Q("a2-melt",{"he": "תלמידים הניחו שתי קוביות קרח זהות: אחת בשמש ואחת בצל. אחרי עשר דקות נמסו מהקובייה בשמש 30 מ״ל מים, ומהקובייה בצל 12 מ״ל. איזו מסקנה נכונה?", "ar": "وضع تلاميذ مكعبَي ثلج متماثلَين: أحدهما في الشمس والآخر في الظل. بعد عشر دقائق ذاب من مكعب الشمس 30 مل ماء، ومن مكعب الظل 12 مل. أي استنتاج صحيح؟", "ru": "Ученики положили два одинаковых кубика льда: один на солнце, другой в тень. Через десять минут кубик на солнце дал 30 мл воды, а в тени 12 мл. Какой вывод верен?", "en": "Students placed two identical ice cubes: one in sunlight and one in shade. After ten minutes the sun cube yielded 30 ml of water and the shade cube 12 ml. Which conclusion is correct?"},[{"he": "קרח נמס מהר יותר בשמש, כי השמש מוסיפה אנרגיית חום.", "ar": "الثلج يذوب أسرع في الشمس، لأن الشمس تضيف طاقة حرارية.", "ru": "Лёд тает быстрее на солнце, потому что Солнце добавляет тепловую энергию.", "en": "Ice melts faster in sunlight, because the Sun adds heat energy."},{"he": "קרח נמס מהר יותר בצל, כי השמש מפריעה להמסה.", "ar": "الثلج يذوب أسرع في الظل، لأن الشمس تعيق الذوبان.", "ru": "Лёд тает быстрее в тени, потому что солнце мешает таянию.", "en": "Ice melts faster in shade, because sunlight hinders melting."},{"he": "קצב ההמסה אינו תלוי במקום, וההבדל במספרים מקרי.", "ar": "سرعة الذوبان لا تتعلق بالمكان، والفرق في الأرقام عشوائي.", "ru": "Скорость таяния совсем не зависит от места, а разница в числах случайна.", "en": "Melting speed does not depend on place, and the number gap is random."},{"he": "בשמש הקרח קופא יותר, ולכן נאספו בו יותר מים.", "ar": "في الشمس يتجمد الثلج أكثر، لذلك تجمع فيه ماء أكثر.", "ru": "На солнце лёд замерзает сильнее, поэтому в нём собралось больше воды.", "en": "In sunlight the ice freezes harder, so more water collected in it."}],0,{"he": "חשבו לאיזה כיוון זורמת האנרגיה כשקרח הופך למים, ומי מספק אותה.", "ar": "فكّروا في أي اتجاه تتدفق الطاقة عندما يتحول الثلج إلى ماء، ومن يزودها.", "ru": "Подумайте, в каком направлении течёт энергия, когда лёд превращается в воду, и кто её поставляет.", "en": "Think about which way energy flows when ice turns to water, and who supplies it."},{"he": "המסה דורשת קליטת אנרגיה: הקובייה בשמש קיבלה יותר חום, ולכן נמסו ממנה 30 מ״ל לעומת 12 בצל. למשל גם שוקולד נמס מהר ביד חמה ובאיטיות במגירה קרה.", "ar": "الذوبان يتطلب امتصاص طاقة: مكعب الشمس تلقى حرارة أكثر، لذلك ذاب منه 30 مل مقابل 12 في الظل. مثال: الشوكولاتة أيضًا تذوب بسرعة في يد دافئة وببطء في درج بارد.", "ru": "Таяние требует поглощения энергии: кубик на солнце получил больше тепла, поэтому из него растаяло 30 мл против 12 в тени. Например, шоколад тоже тает быстро в тёплой руке и медленно в холодном ящике.", "en": "Melting requires taking in energy: the sun cube received more heat, so 30 ml melted from it versus 12 in the shade. For example, chocolate also melts fast in a warm hand and slowly in a cold drawer."},null,[null,{"he": "המספרים מראים ההפך: בשמש נמסו 30 מ״ל לעומת 12 בצל.", "ar": "الأرقام تظهر العكس: في الشمس ذاب 30 مل مقابل 12 في الظل.", "ru": "Числа показывают обратное: на солнце растаяло 30 мл против 12 в тени.", "en": "The numbers show the opposite: 30 ml melted in sunlight versus 12 in shade."},{"he": "ההבדל גדול ועקבי עם תפקיד השמש בחימום; אין סיבה לייחס אותו למקרה.", "ar": "الفرق كبير ويتفق مع دور الشمس في التسخين؛ ولا سبب لنسبته إلى الصدفة.", "ru": "Разница велика и согласуется с ролью Солнца в нагреве; нет причин списывать её на случайность.", "en": "The gap is large and fits the Sun's heating role; there is no reason to call it chance."},{"he": "קרח אינו קופא עוד כשהוא כבר נמס; השמש מוסיפה חום, לא קור.", "ar": "الثلج لا يزداد تجمدًا وهو يذوب أصلًا؛ فالشمس تضيف حرارة لا برودة.", "ru": "Лёд не замерзает сильнее, когда он уже тает; Солнце добавляет тепло, а не холод.", "en": "Ice does not freeze harder while it is already melting; sunlight adds heat, not cold."}])

Q("a2-miracle",{"he": "במודעה נכתב: ״התקן קטן שמחברים לשקע חוסך חצי מחשבון החשמל, בלי לשנות דבר!״ מה הכי נכון לעשות לפני שמאמינים?", "ar": "ورد في إعلان: «جهاز صغير يُوصل بالمقبس يوفر نصف فاتورة الكهرباء دون تغيير شيء!» ما الأصح فعله قبل التصديق؟", "ru": "В рекламе написано: «Маленькое устройство в розетку экономит половину счёта за электричество, ничего не меняя!» Что правильнее всего сделать, прежде чем поверить?", "en": "An ad says: \"A tiny device you plug in cuts the electricity bill in half, changing nothing!\" What is the best thing to do before believing it?"},[{"he": "לקנות מיד, כי הבטחה של חמישים אחוז נשמעת משתלמת.", "ar": "الشراء فورًا، لأن وعد الخمسين بالمئة يبدو مغريًا.", "ru": "Купить сразу, потому что обещание пятидесяти процентов звучит выгодно.", "en": "Buy at once, because a fifty percent promise sounds worthwhile."},{"he": "לשאול את המוכר אם ההתקן באמת עובד כפי שהוא מבטיח, ולהסתפק בתשובה שלו.", "ar": "سؤال البائع إن كان الجهاز يعمل حقًا كما يَعِد، والاكتفاء التام بجوابه.", "ru": "Спросить продавца, действительно ли устройство работает как обещано, и полностью удовлетвориться его ответом.", "en": "Ask the seller whether the device really works as promised, and settle completely for their answer."},{"he": "לבקש ראיות מבדיקה עצמאית שמדדה צריכה עם ההתקן ובלעדיו.", "ar": "طلب أدلة من فحص مستقل قاس الاستهلاك مع الجهاز وبدونه.", "ru": "Попросить доказательства из независимой проверки, измерившей расход с устройством и без него.", "en": "Ask for evidence from an independent test that measured use with and without the device."},{"he": "לקרוא רק תגובות של לקוחות באתר של המוכר.", "ar": "قراءة تعليقات الزبائن في موقع البائع فقط.", "ru": "Читать только отзывы покупателей на сайте продавца.", "en": "Reading only customer comments on the seller's own site."}],2,{"he": "חשבו מי עלול להרוויח ממכירה, ואיזו בדיקה אינה תלויה בו.", "ar": "فكّروا من قد يربح من البيع، وأي فحص غير تابع له.", "ru": "Подумайте, кто может заработать на продаже и какая проверка от него не зависит.", "en": "Think about who profits from the sale, and which test is independent of them."},{"he": "טענה חריגה דורשת ראיות חזקות ובלתי תלויות: מי שמוכר את ההתקן מרוויח מהמכירה, ולכן המלצה שלו אינה ראיה. למשל בדיקה של גוף ניטרלי שמודד את אותו בית פעם עם ההתקן ופעם בלעדיו נותנת תשובה אמינה.", "ar": "الادعاء الاستثنائي يتطلب أدلة قوية ومستقلة: من يبيع الجهاز يربح من البيع، فتوصيته ليست دليلًا. مثال: فحص جهة محايدة تقيس البيت نفسه مرة مع الجهاز ومرة بدونه يعطي جوابًا موثوقًا.", "ru": "Необычное утверждение требует сильных и независимых доказательств: продавец устройства зарабатывает на продаже, поэтому его рекомендация не является доказательством. Например, проверка нейтральной организации, измерившей один и тот же дом с устройством и без него, даёт надёжный ответ.", "en": "An unusual claim needs strong, independent evidence: the seller profits from the sale, so their recommendation is not evidence. For example, a neutral body measuring the same house once with the device and once without gives a reliable answer."},null,[{"he": "הבטחה נעימה אינה ראיה; קנייה לפני בדיקה עלולה לבזבז כסף.", "ar": "الوعد المغرِي ليس دليلًا؛ والشراء قبل الفحص قد يبدد المال.", "ru": "Приятное обещание не является доказательством; покупка до проверки может впустую потратить деньги.", "en": "A pleasant promise is not evidence; buying before testing may waste money."},{"he": "למוכר יש אינטרס למכור, ולכן תשובתו אינה בדיקה בלתי תלויה.", "ar": "للبائع مصلحة في البيع، فجوابه ليس فحصًا مستقلًا.", "ru": "У продавца есть интерес продать, поэтому его ответ не является независимой проверкой.", "en": "The seller has an interest in selling, so their answer is not an independent test."},null,{"he": "תגובות באתר המוכר נבחרות על ידו, ואינן מדידה אובייקטיבית.", "ar": "تعليقات موقع البائع يختارها هو، وليست قياسًا موضوعيًا.", "ru": "Отзывы на сайте продавца отобраны им самим и не являются объективным измерением.", "en": "Comments on the seller's site are chosen by the seller and are not objective measurement."}]),

function itemId(tid,lv,i){return tid+"|"+lv+"|"+i}
function itemRec(id){
  if(!state.item[id])state.item[id]={n:0,ok:0};
  return state.item[id];
}
function poolOf(tp,lv){return (tp.L[lv-1]||tp.L[0]||[])}

/* בחירת פריט לתרגול. משקל גבוה לחדש, בינוני לנכשל, נמוך לנשלט. */
function chooseIndex(tid,lv,pool,avoid){
  var cand=[],i,w;
  for(i=0;i<pool.length;i++){
    if(avoid!==undefined&&i===avoid&&pool.length>1)continue;
    var r=state.item[itemId(tid,lv,i)];
    if(!r||!r.n)w=6;                            /* חדש */
    else if(r.ok<r.n)w=1+Math.min(4,r.n-r.ok);  /* נכשל בעבר */
    else w=1;                                   /* נשלט */
    for(var j=0;j<w;j++)cand.push(i);
  }
  if(!cand.length)return 0;
  return pick(cand);
}
/* בחירת פריט למבחן. אחידה, ואינה נוגעת ב-state כלל. */
function pureIndex(pool,avoid){
  var cand=[],i;
  for(i=0;i<pool.length;i++){
    if(avoid!==undefined&&i===avoid&&pool.length>1)continue;
    cand.push(i);
  }
  return cand.length?pick(cand):0;
}

   הגרשיים העבריים משמשים לשני דברים: ראשי תיבות (חוק־יסוד,
   בג״ץ) ומירכאות (״מדינה יהודית״). המנוע מכיר רק את הראשון.
   הכלל שמפריד: בראשי תיבות באה אחרי הגרשיים אות עברית אחת
   בדיוק וסוף מילה. הסיכון א־סימטרי — מירכאה שהוסרה אינה
   יכולה להזיק, מירכאה שנשארה כן.

   המירכאות המסולסלות (“ ”) משמשות כאן לציטוט מונחים בלבד,
   ולכן הן נופלות תמיד. הקו המפריד הופך לפסיק, כדי שהקול
   ייעצר במקום לרוץ הלאה.
   ------------------------------------------------------------ */
function saySpell(x){
  return String(x==null?"":x)
    .replace(/[“”‘’]/g,"")
    .replace(/״/g,function(m,i,str){
      return /^[א-ת](?![א-ת])/.test(str.slice(i+1))?m:"";
    })
    .replace(/\s—\s/g,", ");
}

function O(html,ok,why){return {h:html,ok:!!ok,why:why||""}}

/* בונה שאלה מפריט אחד. סדר האפשרויות מעורבב בכל בנייה, ולכן
   האינדקס ok שבתוכן אינו מגיע למסך לעולם. */
function buildFromItem(it){
  var opts=it.o.map(function(o,i){return O(esc(gl(o)),i===it.ok,it.wrong&&it.wrong[i]?gl(it.wrong[i]):"")});
  var ans=gl(it.o[it.ok]);
  return {
    type:"mcq",
    prompt:t("qPick"),
    lead:gl(it.q),
    fig:figHtml(it.fig),
    opts:shuffle(opts),
    answer:ans,
    /* מה שנאמר אחרי המענה: השאלה, התשובה הנכונה, וההסבר.
       תשובה בלי ההסבר נשמעת כמו עובדה לשינון, וזה בדיוק מה
       שהאפליקציה הזאת קיימת כדי להחליף. */
    say:gl(it.q)+" "+ans+". "+gl(it.ex),
    reveal:it
  };
}
function buildQuestion(tid,lv,avoid,pure){
  var tp=topicOf(tid); if(!tp)return null;
  var pool=poolOf(tp,lv);
  if(!pool.length)return null;
  var idx=pure?pureIndex(pool,avoid):chooseIndex(tid,lv,pool,avoid);
  var it=pool[idx];
  if(!it)return null;
  var q=buildFromItem(it);
  q.tid=tid; q.lv=lv; q.idx=idx; q.id=itemId(tid,lv,idx);
  q.hint=gl(it.hint);
  return q;
}

function viewFormulas(){
  var h='<div class="wrap" style="padding-top:22px;padding-bottom:44px">';
  h+='<h2 style="font-size:1.5rem">'+esc(t("cfT"))+'</h2>'+
     '<p style="color:var(--muted);margin:.5rem 0 0">'+esc(t("cfP"))+'</p>';
  TRACKS.forEach(function(tr){
    var items=CONCEPTS.filter(function(c){return c.trk===tr.id});
    if(!items.length)return;
    h+='<div class="trk '+tr.cls+'" style="margin:1.4rem 0 .6rem">'+
       '<div class="thead"><span class="tdot"></span><h2 style="font-size:1.15rem">'+
       esc(t(tr.nk))+'</h2><span class="tpill">'+items.length+'</span></div></div>';
    h+='<div class="grid g2">';
    items.forEach(function(c){
      var term=gl(c.t),def=gl(c.d);
      h+='<div class="card tcard trk '+tr.cls+'" style="cursor:default;text-align:start">'+
        '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:.5rem">'+
        '<h3 style="margin:0">'+esc(term)+'</h3>'+
        spkBtn(term+". "+def,state.lang,false,t("hear"))+'</div>'+
        '<div class="sub">'+esc(def)+'</div></div>';
    });
    h+='</div>';
  });
  return h+'</div>'+fbar();
}

var P={q:null,picked:-1,done:false,slot:[],used:[],ok:false,hint:false};

function hdr(){
  var s=state.screen;
  return '<div class="hbar"><div class="wrap hrow">'+
    '<h1 class="brand">'+esc(t("app"))+'<small>'+esc(t("tagline"))+'</small></h1>'+
    (s==="home"?"":'<button class="gbtn" data-a="home">'+ic("home",16)+" "+esc(t("navHome"))+"</button>")+
    '<button class="gbtn'+(s==="sim"?" on":"")+'" data-a="sim">'+ic("play",16)+" "+esc(t("navSim"))+"</button>"+
    /* בנק הטעויות מופיע רק כשיש בו משהו. כפתור שמוביל תמיד
       למסך ריק מלמד להתעלם ממנו. */
    (badList().length?'<button class="gbtn'+(s==="bad"?" on":"")+'" data-a="bad">'+ic("redo",16)+" "+
      esc(t("navBad"))+" ("+badList().length+")</button>":"")+
    '<button class="gbtn'+(s==="form"?" on":"")+'" data-a="form">'+ic("book",16)+" "+esc(t("navForm"))+"</button>"+
    '<button class="gbtn'+(s==="prog"?" on":"")+'" data-a="prog">'+ic("chart",16)+" "+esc(t("navProg"))+"</button>"+
    /* מסך המורה נעלם מהכותרת כשנבחר קוד והמכשיר נעול. */
    (teOpen()?'<button class="gbtn'+(view==="marks"?" on":"")+'" data-a="marks">'+ic("share",16)+" "+esc(t("navExam"))+"</button>":"")+
    '<button class="gbtn'+(s==="set"?" on":"")+'" data-a="set">'+ic("gear",16)+" "+esc(t("navSet"))+"</button>"+
    '<span class="hlang" role="group">'+Object.keys(LANGS).map(function(k){
      return '<button class="'+(state.lang===k?"on":"")+'" data-a="lang" data-v="'+k+
        '" lang="'+k+'" dir="'+LANGS[k].dir+'">'+esc(LANGS[k].name)+'</button>';
    }).join("")+'</span>'+
  "</div></div>"}

function fbar(){
  return '<div class="fbar"><div class="wrap">'+esc(t("savedNote"))+" · "+BUILD+"</div></div>"}

function vstrip(){
  var st=voiceStatus();
  if(st==="ok")return '<div class="vstrip ok">'+ic("spark",15)+" "+esc(t("vsOk"))+"</div>";
  if(st==="dev")return '<div class="vstrip warn">'+ic("play",15)+" "+esc(t("vsDev"))+
    ' <button class="btn ghost" data-a="set">'+esc(t("vGem"))+"</button></div>";
  return '<div class="vstrip bad">'+ic("x",15)+" <b>"+esc(t("vsNoEn"))+"</b> "+esc(t("vsNoEnD"))+
    ' <button class="btn ghost" data-a="set">'+esc(t("setVoice"))+"</button></div>";
}

function screenHome(){
  var h='<div class="wrap">';
  h+='<div class="card" style="margin:1.1rem 0"><h2 style="font-size:1.5rem">'+esc(t("heroT"))+"</h2>"+
     '<p style="color:var(--muted);margin:.5rem 0 0">'+esc(t("heroP"))+"</p></div>";
  h+=vstrip();
  h+='<div class="card" style="margin:1.1rem 0;background:#fff5db;border-inline-start:5px solid #aa6c0c"><h2 style="font-size:1.1rem">'+esc(t("bgT"))+'</h2>'+
     '<p style="color:var(--muted);margin:.4rem 0;font-size:.95rem">'+esc(t("bgP"))+'</p>'+
     '<p style="margin:.3rem 0 0;font-size:.9rem"><a href="https://pop.education.gov.il/sherutey-tiksuv-bachinuch/focus-matriculation-exams/" target="_blank" rel="noopener">'+esc(t("bgL2"))+'</a></p></div>';
  TRACKS.forEach(function(tr){
    var tops=TOPICS.filter(function(x){return x.trk===tr.id});
    if(!tops.length)return;
    h+='<div class="trk '+tr.cls+'" style="margin:1.4rem 0 .6rem">'+
       '<div class="thead"><span class="tdot"></span><h2 style="font-size:1.15rem">'+
       esc(t(tr.nk))+'</h2><span class="tpill">'+tops.length+"</span></div>"+
       '<p style="color:var(--muted);font-size:.9rem;margin:.25rem 0 0">'+esc(t(tr.dk))+"</p></div>";
    h+='<div class="grid g2">';
    tops.forEach(function(tp){
      var best=0,li;
      for(li=1;li<=3;li++)best=Math.max(best,mastery(tp.id,li));
      h+='<button class="card tcard trk '+tr.cls+'" data-a="open" data-t="'+esc(tp.id)+'">'+
        "<h3>"+esc(tName(tp))+"</h3>"+
        '<div class="sub">'+esc(tDesc(tp))+"</div>"+
        '<div style="display:flex;align-items:center;gap:.5rem;margin-top:.35rem">'+
        '<span class="bar '+barCls(best)+'"><i style="width:'+Math.round(best*100)+'%"></i></span>'+
        '<span class="chip">'+Math.round(best*100)+"%</span></div></button>";
    });

  return h+"</div>"+fbar();

function levelBar(tp){
  var h='<div class="lvls">',i;
  for(i=1;i<=3;i++){
    var m=mastery(tp.id,i);
    h+='<button class="lvl'+(state.level===i&&!state.challenge?" on":"")+'" data-a="lvl" data-v="'+i+'">'+
      esc(t("lv"+i))+' <span class="bar '+barCls(m)+'" style="width:2.6rem;flex:none">'+
      '<i style="width:'+Math.round(m*100)+'%"></i></span></button>';
  }
  if(CH_GATE){
    h+='<button class="lvl'+(state.challenge?" on":"")+'" data-a="chal"'+(state.challenge?' style="background:#6d28d9;color:#fff;border-color:#6d28d9;font-weight:700"':"")+'>'+esc(t("lvC"))+'</button>';
  }
  h+="</div>";
  if(CH_GATE&&state.challenge){
    h+='<div style="display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin:.4rem 0">'+
       '<span style="font-size:.88rem;color:var(--muted)">'+esc(t("chMixed"))+'</span>'+
       '<span style="font-size:.88rem;color:var(--muted)">· '+esc(t("chTimer"))+':</span>'+
       [0,30,60].map(function(s){
         return '<button class="lvl'+(state.chSecs===s?" on":"")+'" data-a="chsec" data-v="'+s+'" style="min-height:46px">'+(s===0?esc(t("chOff")):esc(t("chSec").replace("{0}",s)))+'</button>';
       }).join("")+'</div>';
  }
  return h;
}

function spkBtn(text,lang,slow,label){
  return '<button class="spk'+(slow?" sm":"")+'" data-a="say" data-say="'+esc(text)+
    '" data-lang="'+esc(lang)+'"'+(slow?' data-slow="1"':"")+
    ' aria-label="'+esc(label||t("hear"))+'">'+(slow?ic("slow",15):'\u266b '+esc(label||t("hear")))+"</button>";
}
function spkStop(){
  return '<button class="spk spkStop" data-a="stop" aria-label="'+esc(t("stopB"))+'">'+esc(t("stopB"))+"</button>";
}

/* כרטיס הנושא: מה שמוצג מעל האפשרויות. בהיסטוריה זו כותרת
   האירוע או המושג, ולצידה כפתורי השמעה בשפת הממשק. */
function leadBox(txt,sub){
  if(!txt)return "";
  return '<div class="subject"><span class="word" style="font-size:1.15rem">'+esc(txt)+"</span>"+
    (sub?'<span class="ipa">'+esc(sub)+"</span>":"")+
    '<span style="margin-inline-start:auto;display:flex;gap:.4rem">'+
    spkBtn(txt,state.lang,false,t("hearWord"))+spkBtn(txt,state.lang,true,t("hearSlow"))+spkStop()+"</span></div>";
}

/* נוסח השאלה, ולצידו כפתורי השמעה. באזרחות השאלה היא משפט שלם
   ולא מילה בודדת, ולכן היא יושבת בשורה משלה ולא בתוך שורת נושא. */
function askBox(txt){
  if(!txt)return "";
  return '<div class="subject" style="align-items:flex-start">'+
    '<span class="qtext" style="flex:1;margin:0">'+esc(txt)+"</span>"+
    '<span style="display:flex;gap:.4rem;flex:none">'+
    spkBtn(txt,state.lang,false,t("hearWord"))+spkBtn(txt,state.lang,true,t("hearSlow"))+spkStop()+"</span></div>";
}

function screenPractice(){
  var tp=topicOf(state.topic); if(!tp){state.screen="home";return screenHome()}
  var tr=trackOf(tp.trk), q=P.q;
  var h='<div class="wrap"><div class="trk '+tr.cls+'">';
  h+='<div style="display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin:1rem 0 .6rem">'+
     '<span class="tdot"></span><h2 style="font-size:1.2rem">'+esc(tName(tp))+"</h2>"+
     '<span class="tpill">'+esc(t(tr.nk))+"</span></div>";
  h+=levelBar(tp);
  h+='<p style="color:var(--muted);font-size:.88rem;margin:.5rem 0 .8rem">'+esc(t("lv"+state.level+"D"))+"</p>";
  h+=vstrip();
  if(!q)return h+"</div></div>"+fbar();

  h+='<div class="card qcard">';
  h+='<div class="qtop"><span class="chip">'+esc(q.prompt)+"</span>"+
     '<span class="chip" style="margin-inline-start:auto">'+esc(t("todayL"))+" "+(state.day.n||0)+"</span></div>";

  h+=askBox(q.lead||"");
  /* האיור, כשיש. הוא אינו נדרש לפתרון — הוא מראה במבט אחד את
     מה שהטקסט מתאר במילים, ולכן הוא עוזר בדיוק למי שהטקסט
     מכביד עליו. */
  if(q.fig)h+=q.fig;

  {
    h+='<div class="opts'+(q.opts.length>3?"":" two")+'" id="opts">';
    /* רמקול לכל אפשרות, כמו באנגלית: מי שאינו יודע לקרוא את הניסוח
       לא יכול לבחור בו. הקראת אפשרות אינה הסגרת תשובה — היא זמינה
       על כל ארבע במידה שווה, והמעקב הצהוב עובד כמו בנוסח השאלה. */
    q.opts.forEach(function(o,i){
      var cls="opt";
      if(P.done){
        if(o.ok)cls+=" ok";
        else if(i===P.picked)cls+=" bad";
        else cls+=" dim";
      }
      var ob='<button class="'+cls+'" data-a="pick" data-i="'+i+'"'+(P.done?" disabled":"")+'>'+
        '<span class="k">'+String.fromCharCode(65+i)+"</span><span>"+o.h+"</span></button>";
      h+='<div class="orow">'+ob+
        '<button class="spk sm" data-a="say" data-say="'+esc(plainOf(o.h))+'" data-lang="'+esc(state.lang)+
        '" aria-label="'+esc(t("hearOpt"))+'">'+ic("play",15)+"</button></div>";
    });
    h+="</div>";
  }

  if(P.done){
    var it=q.reveal;
    h+='<div class="fb '+(P.ok?"ok":"bad")+'"><b>'+(P.ok?esc(t("correct")):esc(t("wrong")))+"</b>";
    if(!P.ok){h+='<div class="body">'+esc(t("answerIs"))+" <b>"+esc(q.answer)+"</b></div>";
      if(P.timeUp)h+='<div class="body" style="color:#b45309;font-weight:700">'+esc(t("chTimeUp"))+'</div>';
      var wp=P.picked>=0&&q.opts[P.picked]?q.opts[P.picked].why:"";
      if(wp)h+='<div class="why"><b>'+esc(t("whyNot"))+":</b> "+esc(wp)+"</div>";}
    /* ההסבר נפתח גם כשצדקו. תשובה נכונה שנוחשה נראית בדיוק כמו
       תשובה נכונה שנודעה, ורק ההסבר מבדיל ביניהן. */
    if(it&&it.ex)h+='<div class="why"><b>'+esc(t("whyT"))+":</b> "+esc(gl(it.ex))+"</div>";
    h+="</div>";
    h+='<div style="display:flex;gap:.5rem;margin-top:.9rem;flex-wrap:wrap">'+
       spkBtn(saySpell(q.say),state.lang,false,t("hearSent"))+spkBtn(saySpell(q.say),state.lang,true,t("hearSlow"))+spkStop()+
       '<button class="btn pri" data-a="next" style="margin-inline-start:auto">'+
       esc(t("next"))+" "+ic("arrow",16)+"</button></div>";
  } else {
    h+='<div style="display:flex;gap:.5rem;margin-top:.9rem;flex-wrap:wrap;align-items:center">'+
       (state.challenge&&state.chSecs>0?'<span id="chtimer" style="font-weight:800;color:#b45309;min-width:2.6rem;font-size:1.1rem">'+state.chSecs+'</span>':"")+
       (P.hint||state.challenge?"":'<button class="btn ghost" data-a="hint">'+esc(t("hintB"))+"</button>")+
       '<button class="btn ghost" data-a="dunno">'+esc(t("dunno"))+"</button></div>";
    if(P.hint&&q.hint)h+='<div class="qhint" style="margin-top:.6rem">'+esc(q.hint)+"</div>";
  }
  h+="</div></div></div>"+fbar();
  return h;
}

function screenProg(){
  var h='<div class="wrap"><h2 style="margin:1.1rem 0 .3rem;font-size:1.4rem">'+esc(t("progT"))+"</h2>";
  var acc=state.totalAsk?Math.round(100*state.totalOk/state.totalAsk):0;
  var seen=0,mast=0;
  TOPICS.forEach(function(tp){for(var l=1;l<=3;l++){
    var s=state.stats[stKey(tp.id,l)];
    if(s&&s.seen){seen++;if(mastery(tp.id,l)>=.75)mast++}}});
  h+='<div class="grid g3" style="margin:.8rem 0 1.2rem">';
  [[t("streakL"),state.streak||0],[t("todayL"),state.day.n||0],[t("accL"),acc+"%"]].forEach(function(p){
    h+='<div class="card" style="text-align:center"><div style="font-size:1.9rem;font-weight:800">'+
      esc(String(p[1]))+'</div><div style="color:var(--muted);font-size:.9rem">'+esc(p[0])+"</div></div>";
  });
  h+="</div>";
  if(!state.totalAsk)h+='<div class="card"><p style="margin:0;color:var(--muted)">'+esc(t("progNone"))+"</p></div>";
  TRACKS.forEach(function(tr){
    var tops=TOPICS.filter(function(x){return x.trk===tr.id&&
      [1,2,3].some(function(l){var s=state.stats[stKey(x.id,l)];return s&&s.seen})});
    if(!tops.length)return;
    h+='<div class="trk '+tr.cls+'"><div class="thead" style="margin:1.2rem 0 .5rem">'+
       '<span class="tdot"></span><h3 style="font-size:1.05rem">'+esc(t(tr.nk))+"</h3></div>";
    h+='<div class="card">';
    tops.forEach(function(tp){
      h+='<div class="row"><div><div class="lab">'+esc(tName(tp))+"</div>"+
        '<div class="desc">';
      for(var l=1;l<=3;l++){
        var s=state.stats[stKey(tp.id,l)];
        if(s&&s.seen)h+=esc(t("lv"+l))+" "+s.ok+"/"+s.seen+"   ";
      }
      h+="</div></div>";
      var best=Math.max(mastery(tp.id,1),mastery(tp.id,2),mastery(tp.id,3));
      h+='<span class="bar '+barCls(best)+'" style="max-width:8rem"><i style="width:'+
        Math.round(best*100)+'%"></i></span></div>';
    });
    h+="</div></div>";
  });
  h+='<p style="color:var(--muted);font-size:.9rem;margin-top:1rem">'+esc(t("seen"))+": "+seen+
     " · "+esc(t("mastered"))+": "+mast+"</p>";
  return h+"</div>"+fbar();
}

/* ============================================================
   מבחן מדומה
   ------------------------------------------------------------
   עשרים שאלות מכל הנושאים ומכל הרמות, בחוברת אחת שגוללים בה —
   ולא שאלה־שאלה. מי שקורא לאט צריך לראות כמה נשאר, לחזור אחורה
   ולשנות תשובה; ניווט שמסתיר את שאר השאלות לוקח ממנו בדיוק את זה.

   המבחן אינו נשמר. הוא מצב זמני בזיכרון בלבד, ורענון הדף מתחיל
   אותו מחדש — זו הצהרה ולא פער: שעון שממשיך לרוץ בין ביקורים
   הוא בדיוק המקום שבו נולדים באגים שקשה לשחזר.
   ============================================================ */
var SIM_N=20, SIM_MIN=30;
var SIM={on:false,done:false,q:[],ans:[],end:0,tick:null};

function simStop(){if(SIM.tick){clearInterval(SIM.tick);SIM.tick=null}}
function simFmt(ms){
  if(ms<0)ms=0;
  var sec=Math.round(ms/1000),m=Math.floor(sec/60),c=sec%60;
  return m+":"+(c<10?"0":"")+c;
}
function simLeftN(){
  var n=0,i;
  for(i=0;i<SIM.ans.length;i++)if(SIM.ans[i]<0)n++;
  return n;
}
function simRight(){
  var n=0,i;
  for(i=0;i<SIM.q.length;i++)if(SIM.ans[i]>=0&&SIM.q[i].opts[SIM.ans[i]].ok)n++;
  return n;
}
function simStart(){
  var pairs=[],qs=[],i,q;
  TOPICS.forEach(function(tp){for(var l=1;l<=3;l++)pairs.push([tp.id,l])});
  shuffle(pairs);
  for(i=0;i<pairs.length&&qs.length<SIM_N;i++){
    q=buildQuestion(pairs[i][0],pairs[i][1],undefined,true);
    if(q)qs.push(q);
  }
  /* פחות צמדי נושא-רמה מ-SIM_N: סבב נוסף, בלי לחזור על אותו פריט. */
  var guard=0;
  while(qs.length<SIM_N&&guard<400){
    var pr=pairs[guard%pairs.length]; guard++;
    q=buildQuestion(pr[0],pr[1],undefined,true);
    if(!q)continue;
    var dup=false,k;
    for(k=0;k<qs.length;k++)if(qs[k].id===q.id){dup=true;break}
    if(!dup)qs.push(q);
  }
  SIM.q=qs;
  SIM.ans=qs.map(function(){return -1});
  SIM.on=true; SIM.done=false; SIM.end=Date.now()+SIM_MIN*60000;
  simArm();
}
function simArm(){
  simStop();
  if(SIM.on&&!SIM.done)SIM.tick=setInterval(simClock,1000);
}
function simClock(){
  var el=$("#simclock");
  /* המסך הוחלף — אין מה לעדכן, והשעון נעצר מעצמו. */
  if(!el){simStop();return}
  var left=SIM.end-Date.now();
  el.textContent=simFmt(left);
  if(left<=60000)el.classList.add("low");
  if(left<=0){simStop();simSubmit()}
}
/* ההגשה היא גם רגע הרישום: עד כאן לא נספרה אף תשובה, כדי
   שהמבחן לא ידחוף לבנק הטעויות שאלה שהנבחן עוד עמד לשנות. */
function simSubmit(){
  if(!SIM.on||SIM.done)return;
  simStop();
  var i;
  for(i=0;i<SIM.q.length;i++){
    var q=SIM.q[i],pk=SIM.ans[i];
    recordItem(q.tid,q.lv,q.id,pk>=0&&!!q.opts[pk].ok);
  }
  SIM.done=true; save(); render(); window.scrollTo(0,0);
}

function screenSim(){
  var h='<div class="wrap"><h2 style="margin:1.1rem 0 .3rem;font-size:1.4rem">'+esc(t("simT"))+"</h2>";
  if(!SIM.on){
    h+='<div class="card"><p style="margin:0 0 .8rem;color:var(--muted)">'+esc(t("simD"))+"</p>"+
       '<button class="btn pri" data-a="simstart">'+ic("play",16)+" "+esc(t("simStart"))+"</button></div>";
    return h+"</div>"+fbar();
  }
  if(SIM.done){
    var right=simRight(),pc=Math.round(100*right/Math.max(1,SIM.q.length));
    h+='<div class="card" style="text-align:center"><div style="font-size:2.2rem;font-weight:800">'+
       pc+'%</div><div style="color:var(--muted)">'+esc(t("simScore"))+" — "+right+" / "+SIM.q.length+"</div>"+
       '<div style="margin-top:.8rem"><button class="btn pri" data-a="simstart">'+
       ic("redo",16)+" "+esc(t("simAgain"))+"</button></div></div>";
    h+='<h3 style="margin:1.2rem 0 .2rem;font-size:1.1rem">'+esc(t("simReview"))+"</h3>";
    SIM.q.forEach(function(q,i){

      h+='<div class="simq"><div class="simn">'+esc(t("simQ"))+" "+(i+1)+" · "+
         esc(topicOf(q.tid)?tName(topicOf(q.tid)):"")+" · "+esc(t("lv"+q.lv))+"</div>";
      h+=askBox(q.lead||"");

      h+='<div class="fb '+(ok?"ok":"bad")+'"><b>'+(ok?esc(t("correct")):esc(t("wrong")))+"</b>"+
         '<div class="body">'+esc(t("simYours"))+": <b>"+
         esc(pk>=0?plainOf(q.opts[pk].h):t("simNone"))+"</b><br>"+
         esc(t("answerIs"))+" <b>"+esc(q.answer)+"</b></div>";
      var wsim=pk>=0&&!ok&&q.opts[pk]?q.opts[pk].why:"";
      if(wsim)h+='<div class="why"><b>'+esc(t("whyT"))+":</b> "+esc(wsim)+"</div>";

      h+="</div>";
      h+='<div style="display:flex;gap:.5rem;margin-top:.6rem">'+
         spkBtn(saySpell(q.say),state.lang,false,t("hearSent"))+
         spkBtn(saySpell(q.say),state.lang,true,t("hearSlow"))+spkStop()+"</div>";
      h+="</div>";
    });
    return h+"</div>"+fbar();
  }
  /* המבחן עצמו. השעון נדרך אחרי הציור, כי הוא מעדכן אלמנט
     שעדיין לא קיים בזמן שבניית ה-HTML רצה. */
  setTimeout(simArm,0);
  h+='<div class="simbar"><span class="clock" id="simclock">'+esc(simFmt(SIM.end-Date.now()))+"</span>"+
     '<span class="chip"><span id="simleft">'+simLeftN()+"</span> "+esc(t("simLeft"))+"</span>"+
     '<button class="btn pri" data-a="simsubmit" style="margin-inline-start:auto">'+
     esc(t("simSubmit"))+"</button></div>";
  SIM.q.forEach(function(q,i){
    h+='<div class="simq"><div class="simn">'+esc(t("simQ"))+" "+(i+1)+" / "+SIM.q.length+"</div>";
    h+=askBox(q.lead||"");
    if(q.fig)h+=q.fig;
    h+='<div class="opts">';
    q.opts.forEach(function(o,j){
      h+='<button class="opt'+(SIM.ans[i]===j?" sel":"")+'" data-a="simpick" data-i="'+i+
        '" data-j="'+j+'"><span class="k">'+String.fromCharCode(65+j)+"</span><span>"+o.h+"</span></button>";
    });
    h+="</div></div>";
  });
  h+='<div style="margin:1rem 0"><button class="btn pri" data-a="simsubmit">'+
     esc(t("simSubmit"))+"</button></div>";
  return h+"</div>"+fbar();
}

/* ============================================================
   מתאם למסכי המבחן
   ------------------------------------------------------------
   מסכי המבחן נכתבו לאפליקציות המתמטיקה. שם השאלה נראית אחרת —
   ask, options, topicName — וכאן היא prompt, lead ו-opts. גם
   הניווט שונה: שם משתנה view, וכאן state.screen. ההמרה נעשית
   כאן, במקום אחד, ולא בפיזור תנאים בתוך המסכים.
   ============================================================ */
var view="";   /* מסכי המבחן בלבד. שאר האפליקציה מנווטת ב-state.screen. */
/* שמות הרמות כבר מתורגמים באפליקציה (lv1..lv3). המסכים קוראים
   LVL[i] וגם LVL.map, ולכן זה חייב להיות מערך אמיתי — ומכיוון
   שהוא מערך, הוא מתרענן בכל ציור מסך, אחרת החלפת שפה לא הייתה
   משנה את מה שכתוב במבחן. */
var LVL=["","",""];
function lvlSync(){LVL[0]=t("lv1");LVL[1]=t("lv2");LVL[2]=t("lv3")}

   ההקראה זמינה תמיד דרך כפתורי ההשמעה — ולכן התשובה קבועה. */
if(!state.settings)state.settings={tts:true};
/* לא לכל אפליקציה יש דף נוסחאות. מקטע המבחן הגיע מאפליקציה שיש
   בה אחד, והציע אותו גם כאן — כפתור שמוביל למסך שאינו קיים. */
var HAS_FORMULAS=(typeof viewFormulas==="function");

function plainOf(h){

function buildQ(tid,lv){
  /* pure=true — הבחירה כאן אינה מביטה בהתקדמות הלומד. זה מה

          options:(q.opts||[]).map(function(o){

/* ============================================================
   18. מבחן כיתתי — פרסום בוואטסאפ, קבלת תשובות וציונים
   ------------------------------------------------------------
   אין שרת, ואין כוונה שיהיה. לכן המבחן אינו נשלח לשום מקום:
   הוא *נארז לתוך הקישור*. המורה מקבל קישור, שולח אותו בוואטסאפ,
   והמכשיר של התלמיד בונה מהקישור בדיוק את אותן שאלות.

   מה שהופך את זה לאפשרי הוא שכל מחולל שאלות כאן משתמש ב-
   Math.random בלבד. אם מזרעים אותו, אותו זרע מייצר את אותן
   שאלות ואת אותו סדר תשובות — אצל המורה ואצל התלמיד. הקישור
   נושא זרע ורשימת נושאים, לא עשרים שאלות מלאות, ולכן הוא נשאר
   קצר מספיק לוואטסאפ.

   שלוש מגבלות שנאמרות כאן במפורש כי הן חלק מהתכנון:
   · אין איסוף אוטומטי. התלמיד שולח קוד תשובות בוואטסאפ, והמורה
     מדביק אותו. זה המחיר של אפס שרת ואפס עלות.
   · אפשר לזייף קוד. הציון מחושב מחדש אצל המורה מתוך התשובות
     ולא נלקח מהתלמיד, אבל אין כאן הגנה קריפטוגרפית — זה מבחן
     כיתתי מעצב, לא בגרות.
   · שמות התלמידים נשארים במכשיר של המורה. הם לא עוברים דרך
     שום שרת, כי אין שרת.
   ============================================================ */
var GENV=2;                 /* גרסת המחוללים. מבחן שנוצר בגרסה אחרת
                               אינו נפתח — עדיף הודעה ברורה מאשר
                               עשרים שאלות אחרות בשקט. */
var EKEY="shlav-exams-motal-v1";   /* מפתח לאפליקציה הזאת בלבד */
var EKEY_OLD="shlav-exams-v1";  /* המפתח המשותף הישן. לקריאה בלבד, לא נמחק. */

/* --- מחולל מזורע. mulberry32: קצר, מהיר, ופיזור טוב דיו --- */
function withSeed(seed,fn){
  var real=Math.random,s=(seed>>>0)||1;
  Math.random=function(){
    s|=0; s=s+0x6D2B79F5|0;
    var t=Math.imul(s^s>>>15,1|s);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
  try{return fn()}finally{Math.random=real}
}
function hash32(str){
  var h=0x811c9dc5,i;
  for(i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193)}
  return (h>>>0);
}
/* base64url. הניקוי בפענוח אינו קוסמטי: וואטסאפ שובר מחרוזות
   ארוכות בשורות, ורווח אחד הורס את כל הקוד. */
function b64e(str){
  var bytes=new TextEncoder().encode(str),bin="",i;
  for(i=0;i<bytes.length;i+=8192)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));
  return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function b64d(s){
  s=String(s||"").replace(/[^A-Za-z0-9\-_]/g,"").replace(/-/g,"+").replace(/_/g,"/");
  while(s.length%4)s+="=";
  var bin=atob(s),bytes=new Uint8Array(bin.length),i;
  for(i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
/* הזרע של המשבצת נכנס למזהה: שני מבחנים באותם נושאים ובאותה
   רמה, שהמורה החליף באחד מהם שאלה, אינם אותו מבחן. מבחן ישן
   שאין לו זרעים מקבל בדיוק את המזהה שקיבל תמיד — אחרת ההגשות
   שכבר נקלטו אליו מתייתמות. */
function examId(spec){return hash32(spec.s+"|"+spec.q.map(function(x){
  return x[0]+x[1]+(x.length>2?"@"+x[2]:"")}).join(",")).toString(36)}
function encodeExam(spec){return b64e(JSON.stringify(spec))}
function decodeExam(code){
  try{
    var o=JSON.parse(b64d(code));
    if(!o||!o.q||!o.q.length||typeof o.s!=="number")return null;
    o.q=o.q.filter(function(x){return topicById(x[0])});
    return o.q.length?o:null;
  }catch(e){return null}
}
/* בונה את שאלות המבחן. אותו זרע → אותן שאלות, גם אצל המורה
   כשהוא בודק וגם אצל התלמיד כשהוא נבחן. */
function examQuestions(spec){
  /* מסננים נושאים שאינם מוכרים לאפליקציה הזאת, בדיוק כמו decodeExam.
     בלי הסינון buildQ מחזיר null על נושא זר, והמסך נופל על
     q.topic של null. עדיף לדלג בשקט מאשר להתרסק. */
  var pairs=(spec.q||[]).filter(function(x){return !!topicById(x[0])});
  /* מבחן שנבנה עם זרע לכל משבצת נבנה משבצת אחרי משבצת, וכל
     שאלה תלויה בזרע שלה בלבד — כך המורה יכול להחליף אחת מהן.
     מבחן ישן, בלי זרעים, חייב להיבנות בדיוק כפי שנבנה ביום
     שנשלח: אחרת הציון של מי שכבר נבחן משתנה למפרע. */
  if(pairs.length&&pairs.every(function(x){return typeof x[2]==="number"}))
    return pairs.map(function(p){return exBuildSlot(p)})
                .filter(function(q){return !!q});
  return withSeed(spec.s,function(){
    return pairs.map(function(pair){return buildQ(pair[0],pair[1])})
                .filter(function(q){return !!q});
  });
}
/* --- בחירת השאלות בידי המורה ---------------------------------
   עד כאן המורה בחר נושאים, רמה ומספר שאלות — והשאלות עצמן הוגרלו
   מאחורי גבו. הוא ראה אותן לראשונה רק אחרי שהמבחן כבר היה אצל
   התלמידים. מעכשיו כל שאלה היא משבצת נפרדת עם זרע משלה: המורה
   רואה אותה לפני השליחה, מחליף אותה בשאלה אחרת מאותו נושא,
   מסיר אותה, או מוסיף שאלה מנושא שחסר לו.

   הזרע הנפרד לכל משבצת הוא מה שמאפשר את זה. בזרם אקראי אחד
   ומשותף, כפי שהיה עד כאן, החלפה של השאלה השלישית הייתה משנה
   גם את הרביעית ואת החמישית — כלומר לא "החלפה" אלא הגרלה מחדש
   של כל מה שאחריה.

   24 ביט ולא 32: הזרע נוסע בתוך הקישור שנשלח בוואטסאפ, וזרע
   קצר יותר הוא קישור קצר יותר. שישה־עשר מיליון אפשרויות למשבצת
   הן הרבה מעבר למה שהמחולל עצמו יודע לייצר. */
function exNewSeed(){return (Math.random()*16777215)>>>0}
function exSlot(topicId,level){return [topicId,level,exNewSeed()]}
/* אותו זרע → אותה שאלה בדיוק: אצל המורה כשהוא בוחר, ואצל
   התלמיד כשהוא נבחן. */
function exBuildSlot(slot){
  if(!slot||!topicById(slot[0]))return null;
  return withSeed(slot[2],function(){return buildQ(slot[0],slot[1])})||null;
}
/* מסך הבנייה מצייר את עצמו מחדש אחרי כל לחיצה, ובניית עשרים
   וחמש שאלות בכל ציור מיותרת. המטמון הוא לתצוגה בלבד — מי
   שנבחן בונה את שאלותיו מחדש, כדי שאיש לא יערוך בטעות אובייקט
   שגם מסך אחר מחזיק בו. */
var EXQCACHE={};
/* לכל אפליקציה מנגנון שפה משלה, ולא לכולן אותם שמות. הפנייה
   דרך window ולא בשם ישיר, כי שם שאינו קיים באפליקציה מסוימת
   הוא שגיאה בעיני הבודקים — רעש שמסתיר שגיאה אמיתית. */
function exLangKey(){
  try{
    var g=(typeof window!=="undefined")?window:{};
    if(typeof g.xlg==="function")return g.xlg();
    if(typeof g.LG==="string")return g.LG;
    return (state&&state.settings&&state.settings.lang)||"he";
  }catch(e){return "he"}
}
function exPreviewQ(slot){
  if(!slot)return null;
  var k=slot[0]+"|"+slot[1]+"|"+slot[2]+"|"+exLangKey();
  if(!(k in EXQCACHE)){
    /* מורה שמחליף שאלות שוב ושוב מייצר מפתח חדש בכל לחיצה.
       מטמון שרק גדל הוא דליפה; מרוקנים אותו ומתחילים מחדש. */
    if(Object.keys(EXQCACHE).length>400)EXQCACHE={};
    EXQCACHE[k]=exBuildSlot(slot);
  }
  return EXQCACHE[k];
}
function exTopicName(id){
  var t=topicById(id); if(!t)return "";
  var g=(typeof window!=="undefined")?window:{};
  return (typeof g.tName==="function"?g.tName(t):t.name)||"";
}
function exRightAnswer(q){
  var i; if(!q||!q.options)return null;
  for(i=0;i<q.options.length;i++)if(q.options[i].ok)return q.options[i];
  return null;
}
/* המשבצות שהמורה עורך. נבנות מחדש רק כשנושא, רמה או מספר
   השאלות משתנים; עריכה של משבצת בודדת נשמרת. */
function exSlots(){
  if(EB.q&&EB.q.length)return EB.q;
  var tops=EB.topics.filter(function(x){return topicById(x)});
  if(!tops.length)tops=topicsForTrack(state.track).slice(0,3).map(function(t){return t.id});
  var q=[],i;
  for(i=0;i<EB.n;i++)q.push(exSlot(tops[i%tops.length],EB.level));
  /* מערבבים כאן ולא בשליחה: המורה רואה את הסדר הסופי ומאשר אותו. */
  EB.q=shuffle(q);
  return EB.q;
}
function examUrl(spec){
  var base=location.origin+location.pathname;
  return base+"#x="+encodeExam(spec);
}
function waLink(text,phone){
  var p=String(phone||"").replace(/[^0-9]/g,"");
  return "https://wa.me/"+p+"?text="+encodeURIComponent(text);
}

/* --- אחסון מבחנים והגשות, בנפרד מהתקדמות התלמיד --- */
var EX={list:[]};
/* --- הגירה מהמפתח המשותף הישן ---------------------------------
   עד הגרסה הזאת כל האפליקציות כתבו מבחנים לאותו מפתח localStorage
   ובאותו origin, ולכן מבחן שנבנה במתמטיקה הופיע ברשימת המבחנים של
   אנגלית והפיל את המסך. מעכשיו לכל אפליקציה מפתח משלה, ובטעינה
   מועתקות מהמפתח הישן רק רשומות שכל נושאיהן מוכרים כאן.
   המפתח הישן נשאר על כנו ואינו נמחק, כדי שגם אפליקציה אחרת תוכל
   לקלוט ממנו את המבחנים ששייכים לה. --------------------------- */
function exSpecKnown(spec){
  if(!spec||!spec.q||!spec.q.length)return false;
  for(var i=0;i<spec.q.length;i++){
    var pair=spec.q[i];
    if(!pair||!topicById(pair[0]))return false;
  }
  return true;
}
function exAdoptLegacy(){
  var added=0;
  try{
    var raw=localStorage.getItem(EKEY_OLD); if(!raw)return;
    var old=JSON.parse(raw); if(!old||!old.list||!old.list.length)return;
    var have={},i,ex;
    for(i=0;i<EX.list.length;i++)have[EX.list[i].id]=1;
    for(i=0;i<old.list.length;i++){
      ex=old.list[i];
      if(!ex||!ex.id||have[ex.id])continue;
      if(!exSpecKnown(ex.spec))continue;
      EX.list.push(ex); have[ex.id]=1; added++;
    }
  }catch(e){return}
  if(added)exSave();
}
function exLoad(){
  try{var r=localStorage.getItem(EKEY);if(r){var o=JSON.parse(r);if(o&&o.list)EX=o}}catch(e){}
  if(!EX.list)EX.list=[];
  exAdoptLegacy();
}
function exSave(){try{localStorage.setItem(EKEY,JSON.stringify(EX))}catch(e){}}
function exFind(id){for(var i=0;i<EX.list.length;i++)if(EX.list[i].id===id)return EX.list[i];return null}

/* --- קוד ההגשה של התלמיד --- */
function encodeResult(id,name,answers){
  var body={i:id,n:String(name||"").slice(0,40),a:answers,d:todayIso()};
  body.c=hash32(JSON.stringify([body.i,body.n,body.a])).toString(36);
  return b64e(JSON.stringify(body));
}
function decodeResult(code){
  try{
    var o=JSON.parse(b64d(code));
    if(!o||!o.i||!o.a||!o.a.length)return null;
    o.ok=(o.c===hash32(JSON.stringify([o.i,o.n,o.a])).toString(36));
    return o;
  }catch(e){return null}
}
/* הציון מחושב כאן מחדש מתוך התשובות. מה שהתלמיד שלח הוא מה
   שסימן, לא כמה הוא קיבל. */
function gradeResult(spec,res){
  var qs=examQuestions(spec),per=[],ok=0,i,q,a;
  for(i=0;i<qs.length;i++){
    q=qs[i]; a=res.a[i];
    var right=(a>=0&&q.options[a]&&q.options[a].ok)?1:0;
    if(right)ok++;
    per.push({topic:q.topic,topicName:q.topicName,ok:right,
              picked:(a>=0&&q.options[a])?q.options[a].t:"—",
              answer:(q.options.filter(function(o){return o.ok})[0]||{}).t||""});
  }
  return {ok:ok,n:qs.length,pct:Math.round(100*ok/qs.length),per:per};
}

/* ------------------------------------------------------------
   מילון המבחן. הוא עומד בפני עצמו ואינו נשען על המילון הכללי
   של האפליקציה: מודול המבחן זהה בכל האפליקציות ומועתק ביניהן
   כמו שהוא, וכל אחת מהן מתרגמת בדרך אחרת. כך ההעתקה נשארת

/* ------------------------------------------------------------
   ייצוא CSV של ההגשות.
   העתקת הטבלה נותנת טקסט מופרד בטאבים — נוח להדבקה, אבל לא קובץ.
   מורה שרוצה למיין, לסנן או לחשב ממוצע צריך גיליון. שורה לכל תלמיד,
   ועמודה לכל שאלה, כדי שאפשר יהיה לראות מיד באיזו שאלה נפלה הכיתה.
   ה-BOM בהתחלה הוא מה שגורם לאקסל לקרוא עברית, ערבית ורוסית נכון
   במקום ג׳יבריש — בלעדיו הקובץ נפתח שבור בדיוק אצל מי שצריך אותו.
   ------------------------------------------------------------ */
function csvCell(v){
  var s=(v===undefined||v===null)?"":String(v);
  return /[",\n\r;\t]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function csvRow(a){ return a.map(csvCell).join(",") }
/* ============================================================
   מצב מורה.
   בונה המבחן ומסך הציונים נועדו למורה. על טאבלט כיתתי, או על
   טלפון שהילד לוקח לעצמו, אין סיבה שהם יהיו במרחק הקשה אחת:
   ילד יכול למחוק מבחן, לראות ציונים של חברים, או לפתוח מבחן
   ולראות מראש את השאלות.
   זו אינה אבטחה, ואסור להציג אותה ככזאת: מי שיודע לפתוח כלי
   פיתוח יעקוף אותה בשנייה. זו נעילה מפני יד סקרנית — בדיוק מה
   שצריך כאן, ולא יותר.
   כל עוד לא נבחר קוד, שום דבר לא משתנה והמסכים גלויים כתמיד.
   ============================================================ */

/* גיבוב חלש כגיבוי בלבד. SubtleCrypto קיים בכל דפדפן מודרני
   בהקשר מאובטח, ו-GitHub Pages הוא כזה. */
function teWeak(s){var h=5381,i;for(i=0;i<s.length;i++)h=((h*33)^s.charCodeAt(i))>>>0;return "w"+h.toString(16)}
function teHash(pin,salt,cb){
  var msg=salt+"|"+pin;
  try{
    if(window.crypto&&crypto.subtle&&crypto.subtle.digest&&window.TextEncoder){
      crypto.subtle.digest("SHA-256",new TextEncoder().encode(msg)).then(function(d){
        var a=Array.prototype.slice.call(new Uint8Array(d));
        cb(a.map(function(b){return ("0"+b.toString(16)).slice(-2)}).join(""));
      },function(){cb(teWeak(msg))});
      return;
    }
  }catch(e){}
  cb(teWeak(msg));
}
function teSalt(){
  var s="";
  try{
    var a=new Uint8Array(8);crypto.getRandomValues(a);
    s=Array.prototype.slice.call(a).map(function(b){return ("0"+b.toString(16)).slice(-2)}).join("");
  }catch(e){ s=String(Date.now())+Math.random().toString(36).slice(2) }
  return s;
}
/* השהיה אחרי ניסיונות כושלים. ארבע ספרות הן עשרת אלפים
   אפשרויות, וילד סבלני יכול לנסות הרבה. */
function teWait(){
  var r=teRead();if(!r||!r.bad||r.bad<3)return 0;
  var pen=Math.min(300,Math.pow(2,r.bad-3)*5)*1000;
  var left=Math.ceil(((r.badAt||0)+pen-Date.now())/1000);
  return left>0?left:0;
}
