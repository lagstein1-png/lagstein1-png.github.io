Q("en-2-12",{"he": "מכונת כביסה צורכת לכל כביסה: ב-30 מעלות 0.5 קוט״ש, ב-60 מעלות 1.3 קוט״ש, ב-90 מעלות 2.2 קוט״ש. מה המסקנה הנכונה?", "ar": "غسالة تستهلك لكل غسلة: عند 30 درجة 0.5 ك.و.س، عند 60 درجة 1.3 ك.و.س، عند 90 درجة 2.2 ك.و.س. ما الاستنتاج الصحيح؟", "ru": "Стиральная машина тратит за одну стирку: при 30 градусах 0.5 кВт·ч, при 60 градусах 1.3 кВт·ч, при 90 градусах 2.2 кВт·ч. Какой вывод верный?", "en": "A washing machine uses per wash: at 30 degrees 0.5 kWh, at 60 degrees 1.3 kWh, at 90 degrees 2.2 kWh. Which conclusion is correct?"},[{"he": "הצריכה כמעט זהה בכל הטמפרטורות.", "ar": "الاستهلاك متشابه تقريبًا في كل درجات الحرارة.", "ru": "Расход почти одинаков при любой температуре.", "en": "The use is almost the same at every temperature."}, {"he": "כביסה ב-30 מעלות צורכת הכי הרבה, כי היא ארוכה.", "ar": "الغسل عند 30 درجة يستهلك الأكثر، لأنه أطول.", "ru": "Стирка при 30 градусах тратит больше всего, ведь она дольше.", "en": "Washing at 30 degrees uses the most, because it takes longer."}, {"he": "ב-90 מעלות הצריכה כפולה בדיוק מזו של 30 מעלות.", "ar": "عند 90 درجة يكون الاستهلاك ضعف 30 درجة تمامًا.", "ru": "При 90 градусах расход ровно вдвое больше, чем при 30.", "en": "At 90 degrees the use is exactly double that at 30."}, {"he": "ככל שהמים חמים יותר, הכביסה צורכת יותר חשמל.", "ar": "كلما كان الماء أسخن، استهلكت الغسلة كهرباء أكثر.", "ru": "Чем горячее вода, тем больше электричества тратит стирка.", "en": "The hotter the water, the more electricity the wash uses."}],3,{"he": "עקבו אחרי המספרים מהטמפרטורה הנמוכה אל הגבוהה. מה קורה לצריכה?", "ar": "تتبّعوا الأرقام من الحرارة المنخفضة إلى المرتفعة. ماذا يحدث للاستهلاك؟", "ru": "Проследите за числами от низкой температуры к высокой. Что происходит с расходом?", "en": "Follow the numbers from the low temperature to the high one. What happens to the use?"},{"he": "בכל עלייה בטמפרטורה הצריכה עולה: מ-0.5 ל-1.3 ועד 2.2 קוט״ש. את רוב החשמל המכונה מוציאה על חימום המים. למשל כביסה רגילה ב-30 מעלות מנקה היטב וחוסכת חשמל.", "ar": "مع كل ارتفاع في الحرارة يرتفع الاستهلاك: من 0.5 إلى 1.3 حتى 2.2 ك.و.س. معظم الكهرباء تصرفها الغسالة على تسخين الماء. مثال: الغسيل العادي عند 30 درجة ينظّف جيدًا ويوفّر الكهرباء.", "ru": "С каждым повышением температуры расход растёт: с 0.5 до 1.3 и до 2.2 кВт·ч. Большую часть электричества машина тратит на нагрев воды. Например, обычная стирка при 30 градусах хорошо отстирывает и экономит электричество.", "en": "With each rise in temperature the use goes up: from 0.5 to 1.3 and up to 2.2 kWh. Most of the machine's electricity goes into heating the water. For example, a normal wash at 30 degrees cleans well and saves electricity."},null,[{"he": "הצריכה ב-90 מעלות גדולה פי 4 בערך מזו של 30 מעלות.", "ar": "الاستهلاك عند 90 درجة أكبر بنحو 4 مرات منه عند 30 درجة.", "ru": "Расход при 90 градусах примерно в 4 раза больше, чем при 30.", "en": "The use at 90 degrees is about 4 times the use at 30 degrees."}, {"he": "ב-30 מעלות הצריכה היא הנמוכה ביותר, רק 0.5 קוט״ש.", "ar": "عند 30 درجة يكون الاستهلاك الأقل، 0.5 ك.و.س فقط.", "ru": "При 30 градусах расход самый низкий, всего 0.5 кВт·ч.", "en": "At 30 degrees the use is the lowest, only 0.5 kWh."}, {"he": "פי 2 מ-0.5 הוא 1.0, אבל ב-90 מעלות הצריכה היא 2.2 קוט״ש.", "ar": "ضعف 0.5 هو 1.0، لكن الاستهلاك عند 90 درجة 2.2 ك.و.س.", "ru": "Удвоенное 0.5 — это 1.0, а при 90 градусах расход 2.2 кВт·ч.", "en": "Double 0.5 is 1.0, but the use at 90 degrees is 2.2 kWh."}, null]),
Q("en-2-13",{"he": "תנור חימום של 2 קילוואט ומזגן במצב חימום של 0.8 קילוואט מחממים חדר באותה מידה. כל אחד פועל 3 שעות. כמה קוט״ש חוסך המזגן?", "ar": "مدفأة بقدرة 2 كيلوواط ومكيّف في وضع التدفئة بقدرة 0.8 كيلوواط يدفّئان الغرفة بالقدر نفسه. كل منهما يعمل 3 ساعات. كم ك.و.س يوفّر المكيّف؟", "ru": "Обогреватель на 2 киловатта и кондиционер в режиме обогрева на 0.8 киловатта греют комнату одинаково. Каждый работает 3 часа. Сколько кВт·ч экономит кондиционер?", "en": "A 2 kilowatt heater and a 0.8 kilowatt air conditioner in heating mode warm a room equally. Each runs for 3 hours. How many kWh does the air conditioner save?"},[{"he": "3.6 קוט״ש", "ar": "3.6 ك.و.س", "ru": "3.6 кВт·ч", "en": "3.6 kWh"}, {"he": "1.2 קוט״ש", "ar": "1.2 ك.و.س", "ru": "1.2 кВт·ч", "en": "1.2 kWh"}, {"he": "8.4 קוט״ש", "ar": "8.4 ك.و.س", "ru": "8.4 кВт·ч", "en": "8.4 kWh"}, {"he": "2.4 קוט״ש", "ar": "2.4 ك.و.س", "ru": "2.4 кВт·ч", "en": "2.4 kWh"}],0,{"he": "חשבו כמה כל מכשיר צורך בשלוש השעות, ורק אחר כך השוו.", "ar": "احسبوا كم يستهلك كل جهاز في الساعات الثلاث، ثم قارنوا.", "ru": "Посчитайте, сколько тратит каждый прибор за три часа, и только потом сравните.", "en": "Work out how much each device uses in the three hours, and only then compare."},{"he": "התנור צורך 2 כפול 3, כלומר 6 קוט״ש. המזגן צורך 0.8 כפול 3, כלומר 2.4 קוט״ש, וההפרש הוא 3.6 קוט״ש. למשל מזגן חוסך כי הוא מעביר חום מבחוץ פנימה, ולא רק יוצר אותו מחשמל.", "ar": "المدفأة تستهلك 2 في 3، أي 6 ك.و.س. المكيّف يستهلك 0.8 في 3، أي 2.4 ك.و.س، والفرق 3.6 ك.و.س. مثال: المكيّف يوفّر لأنه ينقل الحرارة من الخارج إلى الداخل، ولا يصنعها من الكهرباء فقط.", "ru": "Обогреватель тратит 2 на 3, то есть 6 кВт·ч. Кондиционер тратит 0.8 на 3, то есть 2.4 кВт·ч, а разница — 3.6 кВт·ч. Например, кондиционер экономит, потому что переносит тепло снаружи внутрь, а не только делает его из электричества.", "en": "The heater uses 2 times 3, which is 6 kWh. The air conditioner uses 0.8 times 3, which is 2.4 kWh, and the difference is 3.6 kWh. For example, an air conditioner saves because it moves heat from outside in, rather than only making it from electricity."},null,[null, {"he": "1.2 הוא ההפרש בהספק לשעה אחת, בלי לכפול ב-3 שעות.", "ar": "1.2 هو فرق القدرة لساعة واحدة، دون الضرب في 3 ساعات.", "ru": "1.2 — разница мощностей за один час, без умножения на 3 часа.", "en": "1.2 is the power difference for one hour, without multiplying by 3 hours."}, {"he": "8.4 מתקבל מחיבור הצריכה של שני המכשירים, ולא מההפרש.", "ar": "8.4 ناتج عن جمع استهلاك الجهازين، لا عن الفرق بينهما.", "ru": "8.4 получается сложением расхода двух приборов, а не разницей.", "en": "8.4 comes from adding the two devices' use, not from the difference."}, {"he": "2.4 הוא מה שהמזגן צורך, ולא כמה הוא חוסך.", "ar": "2.4 هو ما يستهلكه المكيّف، لا ما يوفّره.", "ru": "2.4 — это расход кондиционера, а не его экономия.", "en": "2.4 is what the air conditioner uses, not what it saves."}]),
Q("en-2-14",{"he": "גרף של טעינת טלפון מראה: מ-0% ל-80% בחצי השעה הראשונה, ומ-80% ל-100% בחצי השעה השנייה. מה נכון לפי הגרף?", "ar": "رسم بياني لشحن هاتف يُظهر: من 0% إلى 80% في نصف الساعة الأول، ومن 80% إلى 100% في نصف الساعة الثاني. ما الصحيح حسب الرسم؟", "ru": "График зарядки телефона показывает: с 0% до 80% за первые полчаса и с 80% до 100% за вторые полчаса. Что верно по графику?", "en": "A phone charging graph shows: from 0% to 80% in the first half hour, and from 80% to 100% in the second half hour. What is true according to the graph?"},[{"he": "קצב הטעינה קבוע לאורך כל השעה.", "ar": "معدل الشحن ثابت طوال الساعة.", "ru": "Скорость зарядки постоянна весь час.", "en": "The charging rate stays the same for the whole hour."}, {"he": "בחצי השעה השנייה נוספו יותר אחוזים.", "ar": "في نصف الساعة الثاني أُضيفت نسبة أكبر.", "ru": "Во вторые полчаса добавилось больше процентов.", "en": "More percent was added in the second half hour."}, {"he": "הסוללה הגיעה ל-100% כבר אחרי חצי שעה.", "ar": "وصلت البطارية إلى 100% بعد نصف ساعة فقط.", "ru": "Аккумулятор зарядился до 100% уже за полчаса.", "en": "The battery reached 100% after just half an hour."}, {"he": "הטעינה האטה מאוד אחרי שהגיעה ל-80%.", "ar": "تباطأ الشحن كثيرًا بعد الوصول إلى 80%.", "ru": "После 80% зарядка сильно замедлилась.", "en": "Charging slowed down a lot after reaching 80%."}],3,{"he": "השוו כמה אחוזים נוספו בכל אחד משני חצאי השעה.", "ar": "قارنوا كم نسبة أُضيفت في كل من نصفي الساعة.", "ru": "Сравните, сколько процентов добавилось в каждые полчаса.", "en": "Compare how many percent were added in each of the two half hours."},{"he": "בחצי השעה הראשונה נוספו 80%, ובשנייה רק 20%. כלומר הקצב בסוף היה איטי פי 4. למשל טלפונים רבים מאטים את הטעינה בסוף כדי לשמור על הסוללה.", "ar": "في نصف الساعة الأول أُضيفت 80%، وفي الثاني 20% فقط. أي أن المعدل في النهاية كان أبطأ 4 مرات. مثال: هواتف كثيرة تبطئ الشحن في النهاية للحفاظ على البطارية.", "ru": "За первые полчаса добавилось 80%, а за вторые — только 20%. То есть в конце скорость была в 4 раза меньше. Например, многие телефоны в конце замедляют зарядку, чтобы беречь аккумулятор.", "en": "In the first half hour 80% was added, and in the second only 20%. So at the end the rate was 4 times slower. For example, many phones slow charging at the end to protect the battery."},null,[{"he": "בחצי שעה אחת נוספו 80% ובשנייה רק 20%, כך שהקצב השתנה.", "ar": "في نصف ساعة أُضيفت 80% وفي الثاني 20% فقط، فالمعدل تغيّر.", "ru": "За одни полчаса добавилось 80%, за другие лишь 20%, значит, скорость менялась.", "en": "One half hour added 80% and the other only 20%, so the rate changed."}, {"he": "בחצי השעה השנייה נוספו רק 20%, מול 80% בראשונה.", "ar": "في نصف الساعة الثاني أُضيفت 20% فقط، مقابل 80% في الأول.", "ru": "Во вторые полчаса добавилось лишь 20% против 80% в первые.", "en": "The second half hour added only 20%, against 80% in the first."}, {"he": "אחרי חצי שעה הסוללה הייתה ב-80%, ולא ב-100%.", "ar": "بعد نصف ساعة كانت البطارية عند 80%، لا 100%.", "ru": "Через полчаса аккумулятор был заряжен на 80%, а не на 100%.", "en": "After half an hour the battery was at 80%, not 100%."}, null])

Q("a2-miracle",{"he": "במודעה נכתב: ״התקן קטן שמחברים לשקע חוסך חצי מחשבון החשמל, בלי לשנות דבר!״ מה הכי נכון לעשות לפני שמאמינים?", "ar": "ورد في إعلان: «جهاز صغير يُوصل بالمقبس يوفر نصف فاتورة الكهرباء دون تغيير شيء!» ما الأصح فعله قبل التصديق؟", "ru": "В рекламе написано: «Маленькое устройство в розетку экономит половину счёта за электричество, ничего не меняя!» Что правильнее всего сделать, прежде чем поверить?", "en": "An ad says: \"A tiny device you plug in cuts the electricity bill in half, changing nothing!\" What is the best thing to do before believing it?"},[{"he": "לקנות מיד, כי הבטחה של חמישים אחוז נשמעת משתלמת.", "ar": "الشراء فورًا، لأن وعد الخمسين بالمئة يبدو مغريًا.", "ru": "Купить сразу, потому что обещание пятидесяти процентов звучит выгодно.", "en": "Buy at once, because a fifty percent promise sounds worthwhile."},{"he": "לשאול את המוכר אם ההתקן באמת עובד כפי שהוא מבטיח, ולהסתפק בתשובה שלו.", "ar": "سؤال البائع إن كان الجهاز يعمل حقًا كما يَعِد، والاكتفاء التام بجوابه.", "ru": "Спросить продавца, действительно ли устройство работает как обещано, и полностью удовлетвориться его ответом.", "en": "Ask the seller whether the device really works as promised, and settle completely for their answer."},{"he": "לבקש ראיות מבדיקה עצמאית שמדדה צריכה עם ההתקן ובלעדיו.", "ar": "طلب أدلة من فحص مستقل قاس الاستهلاك مع الجهاز وبدونه.", "ru": "Попросить доказательства из независимой проверки, измерившей расход с устройством и без него.", "en": "Ask for evidence from an independent test that measured use with and without the device."},{"he": "לקרוא רק תגובות של לקוחות באתר של המוכר.", "ar": "قراءة تعليقات الزبائن في موقع البائع فقط.", "ru": "Читать только отзывы покупателей на сайте продавца.", "en": "Reading only customer comments on the seller's own site."}],2,{"he": "חשבו מי עלול להרוויח ממכירה, ואיזו בדיקה אינה תלויה בו.", "ar": "فكّروا من قد يربح من البيع، وأي فحص غير تابع له.", "ru": "Подумайте, кто может заработать на продаже и какая проверка от него не зависит.", "en": "Think about who profits from the sale, and which test is independent of them."},{"he": "טענה חריגה דורשת ראיות חזקות ובלתי תלויות: מי שמוכר את ההתקן מרוויח מהמכירה, ולכן המלצה שלו אינה ראיה. למשל בדיקה של גוף ניטרלי שמודד את אותו בית פעם עם ההתקן ופעם בלעדיו נותנת תשובה אמינה.", "ar": "الادعاء الاستثنائي يتطلب أدلة قوية ومستقلة: من يبيع الجهاز يربح من البيع، فتوصيته ليست دليلًا. مثال: فحص جهة محايدة تقيس البيت نفسه مرة مع الجهاز ومرة بدونه يعطي جوابًا موثوقًا.", "ru": "Необычное утверждение требует сильных и независимых доказательств: продавец устройства зарабатывает на продаже, поэтому его рекомендация не является доказательством. Например, проверка нейтральной организации, измерившей один и тот же дом с устройством и без него, даёт надёжный ответ.", "en": "An unusual claim needs strong, independent evidence: the seller profits from the sale, so their recommendation is not evidence. For example, a neutral body measuring the same house once with the device and once without gives a reliable answer."},null,[{"he": "הבטחה נעימה אינה ראיה; קנייה לפני בדיקה עלולה לבזבז כסף.", "ar": "الوعد المغرِي ليس دليلًا؛ والشراء قبل الفحص قد يبدد المال.", "ru": "Приятное обещание не является доказательством; покупка до проверки может впустую потратить деньги.", "en": "A pleasant promise is not evidence; buying before testing may waste money."},{"he": "למוכר יש אינטרס למכור, ולכן תשובתו אינה בדיקה בלתי תלויה.", "ar": "للبائع مصلحة في البيع، فجوابه ليس فحصًا مستقلًا.", "ru": "У продавца есть интерес продать, поэтому его ответ не является независимой проверкой.", "en": "The seller has an interest in selling, so their answer is not an independent test."},null,{"he": "תגובות באתר המוכר נבחרות על ידו, ואינן מדידה אובייקטיבית.", "ar": "تعليقات موقع البائع يختارها هو، وليست قياسًا موضوعيًا.", "ru": "Отзывы на сайте продавца отобраны им самим и не являются объективным измерением.", "en": "Comments on the seller's site are chosen by the seller and are not objective measurement."}]),
Q("a2-fair-test",{"he": "תלמידה רוצה לבדוק אם בקבוק שחור מתחמם בשמש מהר יותר מבקבוק לבן. מה חובה לשמור זהה כדי שהניסוי יהיה הוגן?", "ar": "تريد تلميذة أن تفحص هل قنينة سوداء تسخن في الشمس أسرع من قنينة بيضاء. ما الذي يجب إبقاؤه متماثلًا ليكون الفحص عادلًا؟", "ru": "Ученица хочет проверить, нагревается ли чёрная бутылка на солнце быстрее белой. Что обязательно нужно держать одинаковым, чтобы опыт был честным?", "en": "A student wants to test whether a black bottle heats up in sunlight faster than a white bottle. What must be kept identical for the test to be fair?"},[{"he": "כמות המים, גודל הבקבוקים, מקום ההצבה ומשך המדידה זהים; רק הצבע שונה.", "ar": "كمية الماء وحجم القنينتين ومكان الوضع ومدة القياس متماثلة؛ واللون وحده مختلف.", "ru": "Количество воды, размер бутылок, место и длительность измерения одинаковы; различается только цвет.", "en": "Water amount, bottle size, placement spot and measuring time identical; only the color differs."},{"he": "בקבוק אחד בשמש ואחד בתוך מקרר, כדי לראות הבדל גדול.", "ar": "قنينة في الشمس وأخرى في الثلاجة، لرؤية فرق كبير.", "ru": "Одна бутылка на солнце, другая в холодильнике, чтобы увидеть большую разницу.", "en": "One bottle in sunlight and one in the fridge, to see a big difference."},{"he": "מים חמים בבקבוק השחור ומים קרים בלבן, כדי לזרז את הניסוי.", "ar": "ماء دافئ في القنينة السوداء وبارد في البيضاء، لتسريع الفحص.", "ru": "Тёплая вода в чёрной бутылке и холодная в белой, чтобы ускорить опыт.", "en": "Warm water in the black bottle and cold in the white one, to speed the test up."},{"he": "בקבוק שחור גדול ובקבוק לבן קטן, כי הצבע השחור חזק יותר מלכתחילה בכל מקרה.", "ar": "قنينة سوداء كبيرة وأخرى بيضاء صغيرة، لأن اللون الأسود أقوى تأثيرًا من الأساس.", "ru": "Большая чёрная бутылка и маленькая белая, потому что чёрный цвет всегда сильнее по своей природе.", "en": "A large black bottle and a small white one, because the black color is inherently stronger."}],0,{"he": "חשבו על כלל הניסוי ההוגן: משנים רק את הדבר שרוצים לבדוק.", "ar": "فكّروا في قاعدة الفحص العادل: نغيّر فقط الشيء الذي نريد اختباره.", "ru": "Подумайте о правиле честного опыта: меняем только то, что хотим проверить.", "en": "Think about the fair-test rule: change only the thing you want to test."},{"he": "בניסוי הוגן משנים משתנה אחד בלבד, כאן הצבע, וכל השאר נשאר זהה: אותם בקבוקים, אותה כמות מים, אותו מקום ואותו זמן. למשל אם הבקבוק השחור יקבל יותר מים, לא נדע אם ההבדל בחום נובע מהצבע או מהכמות.", "ar": "في الفحص العادل نغيّر متغيرًا واحدًا فقط، وهنا اللون، وكل شيء آخر يبقى متماثلًا: القنينتان نفسهما، وكمية الماء نفسها، والمكان والزمان نفسهما. مثال: إذا أخذت القنينة السوداء ماء أكثر، لن نعرف هل فرق الحرارة بسبب اللون أم الكمية.", "ru": "В честном опыте меняют только одну переменную, здесь цвет, а всё остальное остаётся одинаковым: те же бутылки, то же количество воды, то же место и время. Например, если в чёрной бутылке будет больше воды, мы не узнаем, вызвана ли разница в нагреве цветом или количеством.", "en": "A fair test changes one variable only, here color, and everything else stays identical: same bottles, same water amount, same place and time. For example, if the black bottle gets more water, we cannot know whether the heat gap comes from color or amount."},null,[null,{"he": "מעבר בין שמש למקרר משנה גם את מקור החום, ולא רק את הצבע.", "ar": "الانتقال بين الشمس والثلاجة يغيّر مصدر الحرارة أيضًا، وليس اللون فقط.", "ru": "Переход от солнца к холодильнику меняет ещё и источник тепла, а не только цвет.", "en": "Moving between sunlight and fridge changes the heat source too, not only color."},{"he": "טמפרטורת מים שונה מוסיפה משתנה שני, ואי אפשר לבודד את תפקיד הצבע.", "ar": "اختلاف حرارة الماء يضيف متغيرًا ثانيًا، فلا يمكن عزل دور اللون.", "ru": "Разная температура воды добавляет вторую переменную, и роль цвета нельзя выделить.", "en": "Different water temperatures add a second variable, so the color's role cannot be isolated."},{"he": "גודל שונה משנה את שטח הפנים ואת כמות המים, ומקלקל את ההשוואה.", "ar": "اختلاف الحجم يغيّر مساحة السطح وكمية الماء، فيفسد المقارنة.", "ru": "Разный размер меняет площадь поверхности и количество воды, и портит сравнение.", "en": "Different sizes change the surface area and water amount, ruining the comparison."}]),
Q("a2-charger",{"he": "חבר טוען: ״מטען שמחובר לשקע בלי טלפון לא צורך חשמל בכלל.״ איך בודקים את הטענה בעזרת ראיות?", "ar": "يدّعي صديق: «الشاحن الموصول بالمقبس بلا هاتف لا يستهلك كهرباء إطلاقًا». كيف نفحص الادعاء بالأدلة؟", "ru": "Друг утверждает: «Зарядка в розетке без телефона совсем не тратит электричество». Как проверить это утверждение с помощью доказательств?", "en": "A friend claims: \"A charger left in the socket with no phone uses no electricity at all.\" How do you test the claim with evidence?"},[{"he": "שואלים עוד כמה חברים מה דעתם על מטענים בבית, ומחליטים יחד לפי דעת הרוב של כולם.", "ar": "نسأل عددًا من الأصدقاء الآخرين عن رأيهم في شواحن البيت، ونقرر حسب رأي الأغلبية.", "ru": "Спросить ещё нескольких друзей, что они думают о домашних зарядках, и решить по мнению большинства.", "en": "Ask several more friends what they think about home chargers, and decide together by majority vote."},{"he": "מסתכלים על המטען; אם אין בו נורית הוא בטח לא צורך.", "ar": "ننظر إلى الشاحن؛ فإن لم تكن فيه لمبة فهو حتمًا لا يستهلك.", "ru": "Посмотреть на зарядку; если на ней нет лампочки, она точно ничего не тратит.", "en": "Look at the charger; if it has no light it surely uses nothing."},{"he": "מנתקים את כל המטענים לנצח, כי אי אפשר לדעת.", "ar": "نفصل كل الشواحن للأبد، لأنه لا يمكن المعرفة.", "ru": "Отключить все зарядки навсегда, потому что узнать невозможно.", "en": "Unplug all chargers forever, since there is no way to know."},{"he": "מודדים עם מד צריכה ביתי כמה המטען צורך בשקע בלי טלפון, ורושמים את הקריאה.", "ar": "نقيس بعدّاد استهلاك منزلي كم يستهلك الشاحن في المقبس بلا هاتف، ونسجل القراءة.", "ru": "Измерить бытовым измерителем, сколько зарядка тратит в розетке без телефона, и записать показание.", "en": "Measure with a home power meter what the charger draws with no phone attached, and record the reading."}],3,{"he": "חשבו איזה כלי מודד צריכת חשמל בפועל, ולא רק משער אותה.", "ar": "فكّروا أي أداة تقيس استهلاك الكهرباء فعليًا ولا تخمّنه فقط.", "ru": "Подумайте, какой прибор измеряет расход электричества по факту, а не догадывается о нём.", "en": "Think about which tool measures electricity use for real instead of guessing it."},{"he": "טענה על צריכה נבדקת במדידה: מד צריכה ביתי מראה כמה ואט המטען שואב גם בלי טלפון, והקריאה היא ראיה. למשל מדידה כזו מגלית שמטענים רבים צורכים קצת חשמל במצב המתנה, ולכן שווה לנתק אותם.", "ar": "الادعاء عن الاستهلاك يُفحص بالقياس: عدّاد الاستهلاك المنزلي يُظهر كم واط يسحب الشاحن حتى بلا هاتف، والقراءة هي الدليل. مثال: مثل هذا القياس يكشف أن شواحن كثيرة تستهلك قليلًا من الكهرباء في وضع الانتظار، لذلك يُستحسن فصلها.", "ru": "Утверждение о расходе проверяется измерением: бытовой измеритель показывает, сколько ватт зарядка берёт даже без телефона, и показание является доказательством. Например, такое измерение выявляет, что многие зарядки тратят немного электричества в режиме ожидания, поэтому их стоит отключать.", "en": "A use claim is tested by measuring: a home power meter shows how many watts the charger draws even with no phone, and the reading is evidence. For example, such a measurement reveals that many chargers draw a little standby power, so they are worth unplugging."},null,[{"he": "דעות של חברים אינן מדידה; ראיה דורשת מספר שנמדד.", "ar": "آراء الأصدقاء ليست قياسًا؛ فالدليل يتطلب رقمًا مُقاسًا.", "ru": "Мнения друзей не являются измерением; доказательству нужно измеренное число.", "en": "Friends' opinions are not measurement; evidence needs a measured number."},{"he": "מבט אינו מודד זרם; יש מכשירים צורכים בלי נורית כלל.", "ar": "النظر لا يقيس التيار؛ فبعض الأجهزة تستهلك بلا لمبة إطلاقًا.", "ru": "Взгляд не измеряет ток; многие приборы потребляют вовсе без лампочки.", "en": "Looking does not measure current; some devices draw power with no light at all."},{"he": "ויתור אינו בדיקה; אפשר למדוד ולדעת בדיוק כמה נצרך.", "ar": "الاستسلام ليس فحصًا؛ يمكن القياس والمعرفة بدقة كم يُستهلك.", "ru": "Отказ не является проверкой; можно измерить и точно узнать расход.", "en": "Giving up is not a test; one can measure and know exactly how much is used."},null]),
Q("en-3-01",{"he": "פרסומת לדוד שמש: ״מים חמים בחינם כל השנה, בלי חשמל בכלל!״ מה החולשה העיקרית בטענה?", "ar": "إعلان لسخان شمسي: «ماء ساخن مجانًا طوال السنة، بلا كهرباء إطلاقًا!» ما نقطة الضعف الرئيسية في الادعاء؟", "ru": "Реклама солнечного водонагревателя: «Горячая вода бесплатно круглый год, совсем без электричества!» В чём главная слабость этого утверждения?", "en": "An ad for a solar water heater says: \"Free hot water all year, with no electricity at all!\" What is the main weakness of the claim?"},[{"he": "דוד שמש לא מחמם מים בכלל, ולכן כל הפרסומת שקרית.", "ar": "السخان الشمسي لا يسخّن الماء أصلًا، فالإعلان كله كذب.", "ru": "Солнечный нагреватель вообще не греет воду, так что всё ложь.", "en": "A solar heater does not heat water at all, so it is all a lie."}, {"he": "בחורף המעונן השמש לא תמיד מספיקה, וצריך גיבוי.", "ar": "في الشتاء الغائم لا تكفي الشمس دائمًا، ونحتاج دعمًا.", "ru": "Пасмурной зимой солнца не всегда хватает, нужен догрев.", "en": "In cloudy winter the sun is not always enough, and backup is needed."}, {"he": "מים שחוממו בשמש אינם בטוחים לרחצה.", "ar": "الماء الذي سخّنته الشمس غير آمن للاستحمام.", "ru": "Вода, нагретая солнцем, небезопасна для мытья.", "en": "Water heated by the sun is not safe for bathing."}, {"he": "אין חולשה, כי השמש חזקה באותה מידה כל השנה.", "ar": "لا ضعف، لأن الشمس قوية بالقدر نفسه طوال السنة.", "ru": "Слабости нет: солнце одинаково сильное весь год.", "en": "There is no weakness, since the sun is equally strong all year."}],1,{"he": "דמיינו יום גשום בינואר. מה יקרה למים בדוד?", "ar": "تخيّلوا يومًا ماطرًا في يناير. ماذا سيحدث للماء في السخان؟", "ru": "Представьте дождливый день в январе. Что будет с водой в баке?", "en": "Imagine a rainy day in January. What will happen to the water in the tank?"},{"he": "דוד שמש חוסך הרבה חשמל, אבל הוא תלוי בשמש. בחורף ובימים מעוננים יש פחות קרינה, ולכן ברוב הדודים יש גוף חימום חשמלי לגיבוי. למשל משפחות רבות מדליקות את הדוד רק בימי חורף.", "ar": "السخان الشمسي يوفّر كهرباء كثيرة، لكنه يعتمد على الشمس. في الشتاء والأيام الغائمة يقل الإشعاع، لذلك في معظم السخانات عنصر تسخين كهربائي احتياطي. مثال: عائلات كثيرة تشغّل السخان فقط في أيام الشتاء.", "ru": "Солнечный нагреватель экономит много электричества, но зависит от солнца. Зимой и в пасмурные дни излучения меньше, поэтому в большинстве баков есть электрический догрев. Например, многие семьи включают бойлер только зимой.", "en": "A solar heater saves a lot of electricity, but it depends on the sun. In winter and on cloudy days there is less sunlight, so most tanks have an electric backup element. For example, many families switch on the heater only on winter days."},null,[{"he": "דוד שמש כן מחמם מים, ובקיץ הוא מספיק לרוב הבתים.", "ar": "السخان الشمسي يسخّن الماء فعلًا، وفي الصيف يكفي معظم البيوت.", "ru": "Солнечный нагреватель греет воду, и летом его хватает почти всем домам.", "en": "A solar heater does heat water, and in summer it is enough for most homes."}, null, {"he": "מים מדוד שמש הם אותם מים מהברז, רק חמים יותר.", "ar": "ماء السخان الشمسي هو ماء الحنفية نفسه، لكنه أسخن.", "ru": "Вода из солнечного бака — та же вода из крана, только теплее.", "en": "Water from a solar heater is the same tap water, just warmer."}, {"he": "בחורף הקרינה חלשה יותר והימים קצרים, ולכן הדוד מחמם פחות.", "ar": "في الشتاء الإشعاع أضعف والأيام أقصر، فيسخّن السخان أقل.", "ru": "Зимой излучение слабее и дни короче, поэтому бак греет хуже.", "en": "In winter the sunlight is weaker and days are shorter, so the tank heats less."}]),
Q("en-3-02",{"he": "תלמיד רוצה לבדוק איזה חומר מבודד טוב יותר: צמר או קלקר. איזה תכנון ניסוי הוא הטוב ביותר?", "ar": "يريد طالب أن يفحص أي مادة تعزل أفضل: الصوف أم الفلّين الصناعي (البوليسترين). أي تخطيط للتجربة هو الأفضل؟", "ru": "Ученик хочет проверить, что лучше утепляет: шерсть или пенопласт. Какой план опыта лучший?", "en": "A student wants to test which material insulates better: wool or polystyrene foam. Which experiment plan is best?"},[{"he": "שתי כוסות זהות עם אותם מים חמים, כל אחת עטופה בחומר אחר.", "ar": "كوبان متماثلان فيهما الماء الساخن نفسه، كل منهما ملفوف بمادة مختلفة.", "ru": "Две одинаковые чашки с одинаковой горячей водой, каждая в своём материале.", "en": "Two identical cups of the same hot water, each in a different material."}, {"he": "כוס בצמר עם מים חמים, וכוס בקלקר עם מים קרים מהברז.", "ar": "كوب بالصوف مع ماء ساخن، وكوب بالبوليسترين مع ماء بارد من الحنفية.", "ru": "Чашка в шерсти с горячей водой и чашка в пенопласте с холодной водой из крана.", "en": "A cup in wool with hot water, and a cup in foam with cold tap water."}, {"he": "כוס אחת בצמר בלבד, ומדידה אחת אחרי שעה, בלי השוואה.", "ar": "كوب واحد بالصوف فقط، وقياس واحد بعد ساعة، بلا مقارنة.", "ru": "Одна чашка только в шерсти и одно измерение через час, без сравнения.", "en": "One cup in wool only, and one reading after an hour, with no comparison."}, {"he": "כוס גדולה בצמר וכוס קטנה בקלקר, ובדיקה איזו חמה יותר.", "ar": "كوب كبير بالصوف وكوب صغير بالبوليسترين، وفحص أيهما أسخن.", "ru": "Большая чашка в шерсти и маленькая в пенопласте, и проверка, какая теплее.", "en": "A big cup in wool and a small cup in foam, then check which is warmer."}],0,{"he": "חשבו מה מותר לשנות בניסוי, אם רוצים לדעת מה השפיע על התוצאה.", "ar": "فكّروا ماذا يُسمح بتغييره في التجربة، إن أردنا معرفة ما أثّر في النتيجة.", "ru": "Подумайте, что можно менять в опыте, если хотите знать, что повлияло на результат.", "en": "Think about what you may change in the experiment if you want to know what affected the result."},{"he": "בניסוי הוגן משנים רק דבר אחד, כאן חומר הבידוד. כל השאר זהה: הכוסות, כמות המים, הטמפרטורה בהתחלה וזמני המדידה. למשל אם הכוסות שונות בגודל, לא נדע אם ההבדל נובע מהבידוד או מהגודל.", "ar": "في التجربة العادلة نغيّر أمرًا واحدًا فقط، هنا مادة العزل. كل الباقي متماثل: الكوبان، كمية الماء، درجة الحرارة في البداية وأوقات القياس. مثال: إذا اختلف حجم الكوبين، لن نعرف هل الفرق من العزل أم من الحجم.", "ru": "В честном опыте меняют только одно — здесь материал утеплителя. Всё остальное одинаково: чашки, количество воды, начальная температура и время измерений. Например, если чашки разного размера, мы не узнаем, что дало разницу: утеплитель или размер.", "en": "In a fair test you change only one thing, here the insulating material. Everything else stays the same: the cups, the amount of water, the starting temperature and the times of measuring. For example, if the cups differ in size, we will not know whether the insulation or the size caused the difference."},null,[null, {"he": "מים בטמפרטורות שונות מוסיפים משתנה שני, ואי אפשר להשוות.", "ar": "ماء بدرجات حرارة مختلفة يضيف متغيرًا ثانيًا، فلا يمكن المقارنة.", "ru": "Вода разной температуры добавляет вторую переменную, и сравнить нельзя.", "en": "Water at different temperatures adds a second variable, so you cannot compare."}, {"he": "בלי כוס שנייה להשוואה, אי אפשר לדעת איזה חומר עדיף.", "ar": "بلا كوب ثانٍ للمقارنة، لا يمكن معرفة أي مادة أفضل.", "ru": "Без второй чашки для сравнения нельзя понять, какой материал лучше.", "en": "Without a second cup to compare, you cannot tell which material is better."}, {"he": "גודל שונה משנה גם את כמות המים, ולכן ההשוואה לא הוגנת.", "ar": "الحجم المختلف يغيّر كمية الماء أيضًا، فلا تكون المقارنة عادلة.", "ru": "Разный размер меняет и количество воды, поэтому сравнение нечестное.", "en": "A different size also changes the amount of water, so the comparison is unfair."}]),
Q("en-3-03",{"he": "עירייה מתלבטת: להקים שדה סולארי על שטח פתוח ליד העיר, או להתקין לוחות על גגות בתי הספר. איזה טיעון הוא שיקול ענייני?", "ar": "بلدية متردّدة: إقامة حقل شمسي على أرض مفتوحة قرب المدينة، أو تركيب ألواح على أسطح المدارس. أي حجة هي اعتبار موضوعي؟", "ru": "Муниципалитет решает: построить солнечное поле на открытой земле у города или поставить панели на крыши школ. Какой довод — деловое соображение?", "en": "A city is deciding: build a solar field on open land near town, or put panels on school roofs. Which argument is a relevant consideration?"},[{"he": "לוחות על גגות תמיד מייצרים יותר מכל שדה, בכל מקום.", "ar": "الألواح على الأسطح تنتج دائمًا أكثر من أي حقل، في كل مكان.", "ru": "Панели на крышах всегда дают больше любого поля, где угодно.", "en": "Roof panels always produce more than any field, anywhere."}, {"he": "אנרגיה סולארית היא אופנה, ולכן לא כדאי להשקיע בה.", "ar": "الطاقة الشمسية موضة، فلا يستحق الاستثمار فيها.", "ru": "Солнечная энергия — это мода, поэтому вкладываться не стоит.", "en": "Solar energy is a fad, so it is not worth investing in."}, {"he": "השדה ייראה יפה יותר בתמונות של העירייה, ולכן הוא עדיף.", "ar": "الحقل سيبدو أجمل في صور البلدية، لذلك هو أفضل.", "ru": "Поле будет красивее на фото муниципалитета, поэтому оно лучше.", "en": "The field will look nicer in the city's photos, so it is better."}, {"he": "גגות חוסכים שטח פתוח, אבל התקנה על כל גג קטן יקרה יותר.", "ar": "الأسطح توفّر الأرض المفتوحة، لكن التركيب على كل سطح صغير أغلى.", "ru": "Крыши берегут открытую землю, но монтаж на каждой малой крыше дороже.", "en": "Roofs save open land, but installing on each small roof costs more."}],3,{"he": "חפשו טיעון ששוקל יתרון וחיסרון אמיתיים, ולא דעה או הכללה.", "ar": "ابحثوا عن حجة توازن بين ميزة وعيب حقيقيين، لا عن رأي أو تعميم.", "ru": "Ищите довод, который взвешивает настоящие плюс и минус, а не мнение или обобщение.", "en": "Look for an argument that weighs a real advantage and drawback, not an opinion or a generalization."},{"he": "בדילמה טכנולוגית אין תשובה אחת מושלמת. טיעון ענייני מציג עובדות על שני הצדדים: שמירה על שטח פתוח מול עלות ההתקנה. למשל בישראל, שבה יש מעט שטח פנוי, מעודדים התקנה על גגות ומעל חניונים.", "ar": "في المعضلة التكنولوجية لا توجد إجابة واحدة كاملة. الحجة الموضوعية تعرض حقائق عن الجانبين: الحفاظ على الأرض المفتوحة مقابل تكلفة التركيب. مثال: في إسرائيل، حيث الأرض الفارغة قليلة، يُشجَّع التركيب على الأسطح وفوق مواقف السيارات.", "ru": "В технологической дилемме нет одного идеального ответа. Деловой довод приводит факты о двух сторонах: сохранение открытой земли против стоимости монтажа. Например, в Израиле, где мало свободной земли, поощряют панели на крышах и над парковками.", "en": "In a technological dilemma there is no single perfect answer. A relevant argument gives facts on both sides: saving open land versus the cost of installing. For example, in Israel, where free land is scarce, installing on roofs and over parking lots is encouraged."},null,[{"he": "זו הכללה בלי ראיות; הייצור תלוי בכיוון, בצל ובגודל המערכת.", "ar": "هذا تعميم بلا أدلة؛ الإنتاج يتعلق بالاتجاه والظل وحجم المنظومة.", "ru": "Это обобщение без доказательств; выработка зависит от наклона, тени и размера.", "en": "This is a generalization with no evidence; output depends on direction, shade and size."}, {"he": "זו דעה בלי ראיות, ואנרגיה סולארית כבר מייצרת חשמל רב.", "ar": "هذا رأي بلا أدلة، والطاقة الشمسية تنتج الآن كهرباء كثيرة.", "ru": "Это мнение без доказательств, а солнце уже даёт много электричества.", "en": "This is an opinion with no evidence, and solar already makes a lot of electricity."}, {"he": "מראה בתמונות אינו שיקול של אנרגיה, עלות או סביבה.", "ar": "المظهر في الصور ليس اعتبارًا للطاقة أو التكلفة أو البيئة.", "ru": "Вид на фото — не довод об энергии, цене или природе.", "en": "Looks in photos are not a point about energy, cost or environment."}, null]),
Q("en-3-04",{"he": "שני חברים מתווכחים: כשיוצאים מהבית לשעתיים, עדיף לכבות את המזגן או להשאיר אותו דלוק? איזו ראיה הכי חזקה להכרעה?", "ar": "صديقان يتجادلان: عند الخروج من البيت لساعتين، هل الأفضل إطفاء المكيّف أم تركه يعمل؟ أي دليل هو الأقوى للحسم؟", "ru": "Два друга спорят: если уходишь из дома на два часа, лучше выключить кондиционер или оставить его? Какое доказательство сильнее всего?", "en": "Two friends argue: when leaving home for two hours, is it better to switch the air conditioner off or leave it on? Which evidence is strongest for deciding?"},[{"he": "סרטון ברשת שבו טכנאי אומר שעדיף להשאיר דלוק.", "ar": "فيديو على الشبكة يقول فيه فنّي إن الأفضل تركه يعمل.", "ru": "Ролик в сети, где мастер говорит, что лучше оставить включённым.", "en": "An online video in which a technician says it is better to leave it on."}, {"he": "מה שההורים של אחד החברים עושים כבר שנים.", "ar": "ما يفعله والدا أحد الصديقين منذ سنوات.", "ru": "То, что родители одного из друзей делают уже много лет.", "en": "What one friend's parents have done for years."}, {"he": "קריאת המונה בכמה ימים דומים, עם כיבוי ובלי כיבוי.", "ar": "قراءة العدّاد في عدة أيام متشابهة، مع الإطفاء وبدونه.", "ru": "Показания счётчика за несколько похожих дней, с выключением и без.", "en": "Meter readings on several similar days, with and without switching off."}, {"he": "התחושה שהבית קריר יותר כשחוזרים אם המזגן נשאר דלוק.", "ar": "الشعور بأن البيت أبرد عند العودة إذا بقي المكيّف يعمل.", "ru": "Ощущение, что дома прохладнее по возвращении, если кондиционер работал.", "en": "The feeling that the home is cooler on return if the unit stayed on."}],2,{"he": "חשבו איזו ראיה מבוססת על מספרים שנמדדו בתנאים דומים.", "ar": "فكّروا أي دليل يعتمد على أرقام قيست في ظروف متشابهة.", "ru": "Подумайте, какое доказательство опирается на числа, измеренные в похожих условиях.", "en": "Think about which evidence is based on numbers measured under similar conditions."},{"he": "ראיה חזקה נאספת במדידה, בתנאים דומים, וחוזרת כמה פעמים. דעה של מומחה ברשת או הרגל של משפחה אינם מדידה. למשל השוואה כזו נעשית בימים עם אותו מזג אוויר, כדי שהחום בחוץ לא ישפיע.", "ar": "الدليل القوي يُجمع بالقياس، في ظروف متشابهة، ويتكرر عدة مرات. رأي خبير على الشبكة أو عادة عائلة ليسا قياسًا. مثال: تُجرى مقارنة كهذه في أيام بالطقس نفسه، كي لا تؤثر الحرارة في الخارج.", "ru": "Сильное доказательство получают измерением, в похожих условиях и несколько раз. Мнение мастера в сети или привычка семьи — не измерение. Например, такое сравнение делают в дни с одинаковой погодой, чтобы жара снаружи не влияла.", "en": "Strong evidence comes from measuring, under similar conditions, several times. An expert's opinion online or a family habit is not a measurement. For example, such a comparison is done on days with the same weather, so the outdoor heat does not affect it."},null,[{"he": "דעה בסרטון אינה מדידה, ולא ידוע על מה היא מבוססת.", "ar": "الرأي في فيديو ليس قياسًا، ولا نعرف على ماذا يستند.", "ru": "Мнение в ролике — не измерение, и неизвестно, на чём оно основано.", "en": "An opinion in a video is not a measurement, and we do not know its basis."}, {"he": "הרגל של משפחה אינו ראיה; ייתכן שמעולם לא בדקו אותו.", "ar": "عادة العائلة ليست دليلًا؛ ربما لم يفحصوها أبدًا.", "ru": "Привычка семьи — не доказательство; возможно, её никогда не проверяли.", "en": "A family habit is not evidence; it may never have been checked."}, null, {"he": "תחושה של נוחות אינה מודדת כמה חשמל נצרך.", "ar": "الشعور بالراحة لا يقيس كم من الكهرباء استُهلك.", "ru": "Ощущение комфорта не измеряет, сколько электричества потрачено.", "en": "A feeling of comfort does not measure how much electricity was used."}]),
Q("en-3-05",{"he": "מוכר מציע מכשיר שמחברים לשקע, ולדבריו הוא מחזיר לרשת פי 2 יותר חשמל ממה שהוא צורך. מה הבעיה המדעית בטענה?", "ar": "بائع يعرض جهازًا يُوصل بالمقبس، ويقول إنه يعيد إلى الشبكة ضعف الكهرباء التي يستهلكها. ما المشكلة العلمية في الادعاء؟", "ru": "Продавец предлагает прибор для розетки и говорит, что тот отдаёт в сеть вдвое больше электричества, чем потребляет. В чём научная проблема этого утверждения?", "en": "A seller offers a plug-in device and says it returns twice as much electricity to the grid as it uses. What is the scientific problem with the claim?"},[{"he": "אין בעיה, כי טכנולוגיה חדשה יכולה לעשות הכול.", "ar": "لا مشكلة، لأن التكنولوجيا الجديدة تستطيع كل شيء.", "ru": "Проблемы нет: новая технология может всё.", "en": "There is no problem, because new technology can do anything."}, {"he": "אי אפשר לקבל יותר אנרגיה ממה שנכנסה למכשיר.", "ar": "لا يمكن الحصول على طاقة أكثر مما دخل الجهاز.", "ru": "Нельзя получить больше энергии, чем вошло в прибор.", "en": "You cannot get more energy out than went into the device."}, {"he": "הבעיה היחידה היא שהמכשיר יקר מדי לרוב המשפחות.", "ar": "المشكلة الوحيدة أن الجهاز غالٍ جدًا لمعظم العائلات.", "ru": "Единственная проблема — прибор слишком дорог для большинства семей.", "en": "The only problem is that the device is too expensive for most families."}, {"he": "הוא יעבוד רק אם מחברים אותו לשקע חזק יותר.", "ar": "سيعمل فقط إذا وُصل بمقبس أقوى.", "ru": "Он заработает, только если включить его в более мощную розетку.", "en": "It will work only if plugged into a stronger socket."}],1,{"he": "חשבו מאיפה יכולה לבוא האנרגיה הנוספת, אם רק השקע מחובר.", "ar": "فكّروا من أين يمكن أن تأتي الطاقة الإضافية، إن كان المقبس وحده موصولًا.", "ru": "Подумайте, откуда может взяться лишняя энергия, если подключена только розетка.", "en": "Think about where the extra energy could come from, if only the socket is connected."},{"he": "לפי חוק שימור האנרגיה, אנרגיה לא נוצרת ולא נעלמת. מכשיר יכול להוציא לכל היותר את מה שנכנס אליו, ובפועל פחות, כי חלק הופך לחום. למשל גם הסוללה הטובה ביותר מחזירה פחות ממה שהוכנס אליה בטעינה.", "ar": "حسب قانون حفظ الطاقة، الطاقة لا تُخلق ولا تفنى. يمكن للجهاز أن يُخرج على الأكثر ما دخله، وفعليًا أقل، لأن جزءًا يتحول إلى حرارة. مثال: حتى أفضل بطارية تعيد أقل مما أُدخل فيها عند الشحن.", "ru": "По закону сохранения энергии энергия не возникает и не исчезает. Прибор может отдать самое большее то, что в него вошло, а на деле меньше, потому что часть уходит в тепло. Например, даже лучший аккумулятор отдаёт меньше, чем в него зарядили.", "en": "By the law of conservation of energy, energy is neither created nor destroyed. A device can give out at most what went in, and in practice less, because some becomes heat. For example, even the best battery gives back less than was put in while charging."},null,[{"he": "טכנולוגיה חדשה לא יכולה לעקוף את חוק שימור האנרגיה.", "ar": "التكنولوجيا الجديدة لا تستطيع تجاوز قانون حفظ الطاقة.", "ru": "Новая технология не может обойти закон сохранения энергии.", "en": "New technology cannot get around the law of conservation of energy."}, null, {"he": "המחיר אינו הבעיה; מכשיר כזה לא יכול לעבוד בכלל.", "ar": "السعر ليس المشكلة؛ جهاز كهذا لا يمكن أن يعمل أصلًا.", "ru": "Цена не главное; такой прибор вообще не может работать.", "en": "Price is not the issue; such a device cannot work at all."}, {"he": "שקע חזק יותר לא ייצור אנרגיה יש מאין.", "ar": "المقبس الأقوى لن يخلق طاقة من العدم.", "ru": "Более мощная розетка не создаст энергию из ничего.", "en": "A stronger socket will not create energy from nothing."}]),
Q("en-3-06",{"he": "פרסומת: ״רכב חשמלי – אפס זיהום!״ במדינות רבות חלק גדול מהחשמל מיוצר משריפת דלקים. מה ההערכה הנכונה ביותר של הטענה?", "ar": "إعلان: «سيارة كهربائية – صفر تلوث!» في دول كثيرة يُنتج جزء كبير من الكهرباء من حرق الوقود. ما التقييم الأصح للادعاء؟", "ru": "Реклама: «Электромобиль — ноль загрязнения!» Во многих странах большая часть электричества получается сжиганием топлива. Какая оценка этого утверждения самая верная?", "en": "An ad says: \"Electric car – zero pollution!\" In many countries much of the electricity is made by burning fuels. What is the most accurate judgment of the claim?"},[{"he": "בנסיעה אין פליטה, אבל ייצור החשמל שלו עלול לזהם.", "ar": "لا انبعاثات أثناء السفر، لكن إنتاج كهربائها قد يلوّث.", "ru": "В поездке выбросов нет, но производство его тока может загрязнять.", "en": "No fumes while driving, but making its electricity may pollute."}, {"he": "הטענה נכונה לגמרי, כי לרכב חשמלי אין שריפה של דלק.", "ar": "الادعاء صحيح تمامًا، لأن السيارة الكهربائية لا تحرق وقودًا.", "ru": "Утверждение полностью верно: электромобиль не сжигает топливо.", "en": "The claim is fully true, because an electric car burns no fuel."}, {"he": "רכב חשמלי מזהם יותר מרכב בנזין, בכל מדינה ובכל מצב.", "ar": "السيارة الكهربائية تلوّث أكثر من سيارة البنزين، في كل دولة وكل حال.", "ru": "Электромобиль загрязняет больше бензинового в любой стране и всегда.", "en": "An electric car pollutes more than a petrol car, in every country and case."}, {"he": "החשמל מגיע מהסוללה, ולכן אין לרכב קשר לתחנות כוח.", "ar": "الكهرباء تأتي من البطارية، فلا علاقة للسيارة بمحطات الكهرباء.", "ru": "Ток идёт из аккумулятора, значит, машина не связана с электростанциями.", "en": "The power comes from the battery, so the car has no link to power stations."}],0,{"he": "חשבו מאיפה מגיע החשמל שנטען לסוללה של הרכב.", "ar": "فكّروا من أين تأتي الكهرباء التي تُشحن بها بطارية السيارة.", "ru": "Подумайте, откуда берётся электричество, которым заряжают аккумулятор машины.", "en": "Think about where the electricity that charges the car's battery comes from."},{"he": "רכב חשמלי לא פולט גזים בזמן הנסיעה, וזה טוב לאוויר בעיר. אבל החשמל שלו מיוצר במקום אחר, ושם ייתכן זיהום. למשל רכב שנטען מלוחות סולאריים על הגג גורם לזיהום קטן מאוד בשימוש.", "ar": "السيارة الكهربائية لا تطلق غازات أثناء السفر، وهذا جيد لهواء المدينة. لكن كهرباءها تُنتج في مكان آخر، وقد يحدث هناك تلوث. مثال: سيارة تُشحن من ألواح شمسية على السطح تسبب تلوثًا قليلًا جدًا أثناء الاستعمال.", "ru": "Электромобиль не выбрасывает газы во время езды, и это хорошо для воздуха в городе. Но его электричество производят в другом месте, и там возможно загрязнение. Например, машина, заряженная от солнечных панелей на крыше, при использовании почти не загрязняет воздух.", "en": "An electric car gives off no gases while driving, which is good for city air. But its electricity is made somewhere else, and there may be pollution there. For example, a car charged from rooftop solar panels causes very little pollution in use."},null,[null, {"he": "הרכב לא שורף דלק, אבל תחנת כוח שמייצרת לו חשמל עשויה לשרוף.", "ar": "السيارة لا تحرق وقودًا، لكن المحطة التي تنتج كهرباءها قد تحرق.", "ru": "Машина не сжигает топливо, но станция, дающая ей ток, может сжигать.", "en": "The car burns no fuel, but the station making its power may burn fuel."}, {"he": "זו הכללה; הזיהום תלוי במקור החשמל בכל מדינה.", "ar": "هذا تعميم؛ التلوث يتعلق بمصدر الكهرباء في كل دولة.", "ru": "Это обобщение; загрязнение зависит от источника электричества в стране.", "en": "This is a generalization; pollution depends on each country's power source."}, {"he": "הסוללה רק אוגרת חשמל שהגיע מהרשת, ולא מייצרת אותו.", "ar": "البطارية تخزّن فقط كهرباء جاءت من الشبكة، ولا تنتجها.", "ru": "Аккумулятор лишь хранит ток из сети, а не вырабатывает его.", "en": "The battery only stores electricity from the grid; it does not make it."}]),
Q("en-3-07",{"he": "משפחה החליפה את כל הנורות ללד בספטמבר. החשבון של נובמבר נמוך ב-30% מזה של אוגוסט. למה זו לא הוכחה שהלד לבדו חסך 30%?", "ar": "عائلة غيّرت كل المصابيح إلى LED في سبتمبر. فاتورة نوفمبر أقل بـ 30% من فاتورة أغسطس. لماذا هذا ليس إثباتًا أن LED وحده وفّر 30%؟", "ru": "Семья заменила все лампы на светодиодные в сентябре. Счёт за ноябрь на 30% меньше, чем за август. Почему это не доказывает, что светодиоды сами сэкономили 30%?", "en": "A family switched all its bulbs to LED in September. The November bill is 30% lower than August's. Why is this not proof that the LEDs alone saved 30%?"},[{"he": "כי נורות לד אינן חוסכות חשמל בכלל.", "ar": "لأن مصابيح LED لا توفّر الكهرباء إطلاقًا.", "ru": "Потому что светодиодные лампы вообще не экономят электричество.", "en": "Because LED bulbs do not save electricity at all."}, {"he": "כי החשבון אינו כולל את החשמל של הנורות.", "ar": "لأن الفاتورة لا تشمل كهرباء المصابيح.", "ru": "Потому что счёт не включает электричество ламп.", "en": "Because the bill does not include the bulbs' electricity."}, {"he": "כי 30% הוא שינוי קטן מכדי שתהיה לו משמעות.", "ar": "لأن 30% تغيّر صغير جدًا ليكون له معنى.", "ru": "Потому что 30% — слишком малое изменение, чтобы что-то значить.", "en": "Because 30% is too small a change to mean anything."}, {"he": "כי באוגוסט המזגן עבד הרבה, וגם העונה השתנתה.", "ar": "لأن المكيّف عمل كثيرًا في أغسطس، والموسم تغيّر أيضًا.", "ru": "Потому что в августе много работал кондиционер, и сезон тоже сменился.", "en": "Because August had heavy air conditioner use, and the season changed."}],3,{"he": "חשבו מה עוד השתנה בבית בין אוגוסט לנובמבר, חוץ מהנורות.", "ar": "فكّروا ماذا تغيّر أيضًا في البيت بين أغسطس ونوفمبر، غير المصابيح.", "ru": "Подумайте, что ещё изменилось дома между августом и ноябрём, кроме ламп.", "en": "Think about what else changed at home between August and November, besides the bulbs."},{"he": "כשמשתנים שני דברים יחד, אי אפשר לדעת מה גרם לשינוי. כאן השתנו גם הנורות וגם העונה, ובנובמבר המזגן כמעט לא עבד. למשל השוואה הוגנת יותר היא בין נובמבר השנה לנובמבר בשנה שעברה.", "ar": "عندما يتغيّر أمران معًا، لا يمكن معرفة سبب التغيير. هنا تغيّرت المصابيح والموسم معًا، وفي نوفمبر لم يكد المكيّف يعمل. مثال: المقارنة الأعدل هي بين نوفمبر هذه السنة ونوفمبر السنة الماضية.", "ru": "Когда меняются две вещи сразу, нельзя понять, что вызвало изменение. Здесь сменились и лампы, и сезон, а в ноябре кондиционер почти не работал. Например, честнее сравнить ноябрь этого года с ноябрём прошлого.", "en": "When two things change together, you cannot tell which caused the change. Here both the bulbs and the season changed, and in November the air conditioner hardly ran. For example, a fairer comparison is this November against last November."},null,[{"he": "נורות לד כן חוסכות חשמל; השאלה היא כמה מהירידה נובעת מהן.", "ar": "مصابيح LED توفّر الكهرباء فعلًا؛ السؤال كم من الانخفاض سببه هي.", "ru": "Светодиоды экономят электричество; вопрос, какая часть снижения от них.", "en": "LED bulbs do save electricity; the question is how much of the drop is due to them."}, {"he": "המונה סופר את כל החשמל בבית, כולל התאורה.", "ar": "العدّاد يحسب كل كهرباء البيت، بما فيها الإضاءة.", "ru": "Счётчик учитывает всё электричество в доме, включая свет.", "en": "The meter counts all the home's electricity, including the lighting."}, {"he": "30% הוא שינוי גדול; הבעיה היא שלא ברור מה גרם לו.", "ar": "30% تغيّر كبير؛ المشكلة أنه غير واضح ما سببه.", "ru": "30% — большое изменение; проблема в том, что неясна его причина.", "en": "30% is a big change; the problem is that its cause is unclear."}, null]),
Q("en-3-08",{"he": "מתכננים חוות טורבינות רוח ליד נתיב שבו עוברות ציפורים נודדות. מה הצעד הנכון ביותר לפני ההחלטה?", "ar": "يخطّطون لمزرعة توربينات رياح قرب مسار تعبر فيه طيور مهاجرة. ما الخطوة الأصح قبل القرار؟", "ru": "Планируют ветряную электростанцию рядом с путём перелётных птиц. Какой шаг самый правильный до решения?", "en": "A wind farm is planned near a route used by migrating birds. What is the best step before deciding?"},[{"he": "לבטל את כל התוכניות לאנרגיית רוח, בכל מקום בארץ.", "ar": "إلغاء كل خطط طاقة الرياح، في كل مكان في البلاد.", "ru": "Отменить все планы ветровой энергетики по всей стране.", "en": "Cancel all wind energy plans everywhere in the country."}, {"he": "להקים מיד, כי אנרגיה נקייה חשובה מכל שיקול אחר.", "ar": "البناء فورًا، لأن الطاقة النظيفة أهم من أي اعتبار آخر.", "ru": "Строить сразу: чистая энергия важнее любых других соображений.", "en": "Build at once, because clean energy matters more than anything else."}, {"he": "לאסוף נתונים על הציפורים, ולבחור מיקום שפוגע פחות.", "ar": "جمع معطيات عن الطيور، واختيار موقع يضرّ أقل.", "ru": "Собрать данные о птицах и выбрать место, где вреда меньше.", "en": "Collect data on the birds, and choose a site that does less harm."}, {"he": "לשאול רק את החברה שבונה את הטורבינות, ולסמוך עליה.", "ar": "سؤال الشركة التي تبني التوربينات فقط، والوثوق بها.", "ru": "Спросить только компанию, которая строит турбины, и довериться ей.", "en": "Ask only the company building the turbines, and trust it."}],2,{"he": "חשבו על צעד שמתייחס גם לחשמל הנקי וגם לציפורים.", "ar": "فكّروا في خطوة تأخذ بالحسبان الكهرباء النظيفة والطيور معًا.", "ru": "Подумайте о шаге, который учитывает и чистое электричество, и птиц.", "en": "Think of a step that takes both clean electricity and the birds into account."},{"he": "בדילמה טכנולוגית שוקלים תועלת מול נזק, על סמך נתונים. מידע על הנדידה עוזר לבחור מיקום ושעות פעולה שמקטינים את הפגיעה. למשל יש חוות רוח שעוצרות את הטורבינות בשיא עונת הנדידה.", "ar": "في المعضلة التكنولوجية نوازن بين الفائدة والضرر، اعتمادًا على المعطيات. المعلومات عن الهجرة تساعد على اختيار موقع وساعات عمل تقلّل الضرر. مثال: توجد مزارع رياح توقف التوربينات في ذروة موسم الهجرة.", "ru": "В технологической дилемме взвешивают пользу и вред на основе данных. Сведения о перелёте помогают выбрать место и часы работы, при которых вред меньше. Например, некоторые ветряные станции останавливают турбины в разгар перелёта.", "en": "In a technological dilemma you weigh benefit against harm, based on data. Information on migration helps choose a site and operating hours that reduce harm. For example, some wind farms stop their turbines at the peak of the migration season."},null,[{"he": "בעיה במקום אחד אינה סיבה לבטל כל פרויקט רוח בכל הארץ.", "ar": "مشكلة في مكان واحد ليست سببًا لإلغاء كل مشروع رياح في البلاد.", "ru": "Проблема в одном месте — не повод отменять все ветровые проекты страны.", "en": "A problem at one site is no reason to cancel every wind project in the country."}, {"he": "החלטה בלי לבדוק את הנזק לציפורים מתעלמת מצד אחד של הדילמה.", "ar": "القرار دون فحص الضرر على الطيور يتجاهل جانبًا من المعضلة.", "ru": "Решение без проверки вреда для птиц игнорирует одну сторону дилеммы.", "en": "Deciding without checking harm to birds ignores one side of the dilemma."}, null, {"he": "לחברה הבונה יש אינטרס, ולכן צריך גם בדיקה בלתי תלויה.", "ar": "للشركة البانية مصلحة، لذلك نحتاج أيضًا فحصًا مستقلًا.", "ru": "У строящей компании есть интерес, поэтому нужна и независимая проверка.", "en": "The building company has an interest, so an independent check is also needed."}]),
Q("en-3-09",{"he": "תלמיד חימם צלחת אורז: במיקרוגל נצרכו 0.1 קוט״ש, ובתנור 0.9 קוט״ש. הוא כתב: ״המיקרוגל תמיד חסכוני יותר מהתנור, לכל מאכל.״ מה הבעיה במסקנה?", "ar": "سخّن طالب طبق أرز: في الميكروويف استُهلك 0.1 ك.و.س، وفي الفرن 0.9 ك.و.س. كتب: «الميكروويف دائمًا أوفر من الفرن، لكل طعام.» ما المشكلة في الاستنتاج؟", "ru": "Ученик разогрел тарелку риса: в микроволновке ушло 0.1 кВт·ч, в духовке 0.9 кВт·ч. Он написал: «Микроволновка всегда экономнее духовки для любого блюда». В чём проблема вывода?", "en": "A student heated a plate of rice: the microwave used 0.1 kWh and the oven 0.9 kWh. He wrote: \"The microwave is always more economical than the oven, for any food.\" What is the problem with the conclusion?"},[{"he": "אין בעיה; ניסוי אחד מספיק כדי לדעת על כל סוגי המאכלים.", "ar": "لا مشكلة؛ تجربة واحدة تكفي لمعرفة كل أنواع الطعام.", "ru": "Проблемы нет: одного опыта хватает, чтобы знать обо всех блюдах.", "en": "There is no problem; one test is enough to know about every kind of food."}, {"he": "הוא בדק מאכל אחד בלבד, ואי אפשר להכליל לכל מאכל.", "ar": "فحص طعامًا واحدًا فقط، ولا يمكن التعميم على كل طعام.", "ru": "Он проверил одно блюдо, и обобщать на все блюда нельзя.", "en": "He tested only one food, so he cannot generalize to every food."}, {"he": "המספרים מראים שדווקא התנור חסכוני יותר.", "ar": "الأرقام تُظهر أن الفرن هو الأوفر في الحقيقة.", "ru": "Числа показывают, что экономнее как раз духовка.", "en": "The numbers show that the oven is actually more economical."}, {"he": "קוט״ש אינה יחידה מתאימה למדידה של אנרגיה.", "ar": "ك.و.س ليست وحدة مناسبة لقياس الطاقة.", "ru": "кВт·ч — неподходящая единица для измерения энергии.", "en": "The kWh is not a suitable unit for measuring energy."}],1,{"he": "חשבו מה הניסוי בדק בפועל, ועל מה המסקנה מדברת.", "ar": "فكّروا ماذا فحصت التجربة فعلًا، وعن ماذا يتحدث الاستنتاج.", "ru": "Подумайте, что опыт проверил на самом деле и о чём говорит вывод.", "en": "Think about what the test actually checked, and what the conclusion talks about."},{"he": "מסקנה צריכה להתאים לנתונים שנאספו. ניסוי עם מאכל אחד מראה תוצאה למאכל הזה בלבד. למשל באפייה של עוגה גדולה המיקרוגל לא מתאים, ואין לנו נתונים עליה.", "ar": "يجب أن يتلاءم الاستنتاج مع المعطيات التي جُمعت. تجربة بطعام واحد تُظهر نتيجة لهذا الطعام فقط. مثال: في خَبز كعكة كبيرة لا يناسب الميكروويف، ولا معطيات لدينا عنها.", "ru": "Вывод должен соответствовать собранным данным. Опыт с одним блюдом показывает результат только для этого блюда. Например, для выпечки большого пирога микроволновка не подходит, и данных о нём у нас нет.", "en": "A conclusion must fit the data collected. A test with one food shows a result for that food only. For example, a microwave is not suited to baking a large cake, and we have no data on it."},null,[{"he": "ניסוי אחד במאכל אחד לא מלמד על מאכלים אחרים.", "ar": "تجربة واحدة بطعام واحد لا تخبرنا عن أطعمة أخرى.", "ru": "Один опыт с одним блюдом ничего не говорит о других.", "en": "One test with one food tells us nothing about other foods."}, null, {"he": "התנור צרך 0.9 והמיקרוגל רק 0.1, כלומר המיקרוגל חסכוני יותר כאן.", "ar": "الفرن استهلك 0.9 والميكروويف 0.1 فقط، أي أن الميكروويف أوفر هنا.", "ru": "Духовка потратила 0.9, а микроволновка 0.1, значит, здесь экономнее микроволновка.", "en": "The oven used 0.9 and the microwave only 0.1, so here the microwave is cheaper."}, {"he": "קוט״ש היא בדיוק יחידה של אנרגיה, והיא מתאימה כאן.", "ar": "ك.و.س هي بالضبط وحدة طاقة، وهي مناسبة هنا.", "ru": "кВт·ч — именно единица энергии, и здесь она подходит.", "en": "The kWh is exactly a unit of energy, and it fits here."}]),
Q("en-3-10",{"he": "אחרי השקיעה הצריכה של חשמל בבתים עולה. מדינה שמייצרת הרבה חשמל מהשמש צריכה פתרון לשעות האלה. איזה פתרון מתאים ביותר?", "ar": "بعد الغروب يرتفع استهلاك الكهرباء في البيوت. دولة تنتج كهرباء كثيرة من الشمس تحتاج حلًا لهذه الساعات. أي حل هو الأنسب؟", "ru": "После заката расход электричества в домах растёт. Стране, которая получает много электричества от солнца, нужно решение для этих часов. Какое решение самое подходящее?", "en": "After sunset, home electricity use goes up. A country that makes a lot of solar electricity needs a solution for those hours. Which solution fits best?"},[{"he": "לאגור ביום אנרגיה בסוללות גדולות, ולהשתמש בה בערב.", "ar": "تخزين الطاقة نهارًا في بطاريات كبيرة، واستعمالها مساءً.", "ru": "Запасать энергию днём в больших аккумуляторах и тратить вечером.", "en": "Store energy by day in big batteries, and use it in the evening."}, {"he": "להקים עוד הרבה לוחות סולאריים, כדי שיעבדו גם בלילה.", "ar": "إقامة ألواح شمسية كثيرة أخرى، كي تعمل في الليل أيضًا.", "ru": "Поставить ещё много солнечных панелей, чтобы они работали и ночью.", "en": "Build many more solar panels, so they will work at night too."}, {"he": "לבקש מכולם לא להשתמש בחשמל בכלל אחרי השקיעה.", "ar": "الطلب من الجميع عدم استعمال الكهرباء إطلاقًا بعد الغروب.", "ru": "Попросить всех вообще не пользоваться электричеством после заката.", "en": "Ask everyone not to use electricity at all after sunset."}, {"he": "לצבוע את הלוחות בשחור, כדי שיקלטו אור גם בחושך.", "ar": "طلاء الألواح بالأسود، كي تلتقط الضوء في الظلام أيضًا.", "ru": "Покрасить панели в чёрный, чтобы они ловили свет и в темноте.", "en": "Paint the panels black, so they catch light even in the dark."}],0,{"he": "חשבו איך מעבירים אנרגיה משעות שיש בהן עודף לשעות שיש בהן מחסור.", "ar": "فكّروا كيف ننقل الطاقة من ساعات فيها فائض إلى ساعات فيها نقص.", "ru": "Подумайте, как перенести энергию из часов избытка в часы нехватки.", "en": "Think about how to move energy from hours with extra to hours with a shortage."},{"he": "אור השמש קיים רק ביום, ולכן עוד לוחות לא יעזרו בלילה. אגירה מאפשרת להשתמש מאוחר יותר באנרגיה שנוצרה ביום. למשל בגלבוע יש תחנת אגירה שאובה: כשיש עודף שואבים מים למעלה, ובשעות העומס הם יורדים ומייצרים חשמל.", "ar": "ضوء الشمس موجود نهارًا فقط، فمزيد من الألواح لن يساعد ليلًا. التخزين يتيح استعمال الطاقة التي نتجت نهارًا في وقت لاحق. مثال: في جبل الجلبوع محطة تخزين بالضخ: عند الفائض يُضخ الماء إلى الأعلى، وفي ساعات الذروة ينزل وينتج كهرباء.", "ru": "Солнечный свет есть только днём, поэтому лишние панели ночью не помогут. Накопление позволяет позже использовать энергию, полученную днём. Например, на горе Гильбоа есть гидроаккумулирующая станция: при избытке воду закачивают наверх, а в часы пик она стекает и даёт ток.", "en": "Sunlight exists only by day, so more panels will not help at night. Storage lets us use energy made by day at a later time. For example, Mount Gilboa has a pumped-storage station: when there is extra, water is pumped up, and at peak hours it flows down and makes electricity."},null,[null, {"he": "לוחות סולאריים צריכים אור, ובלילה הם לא מייצרים חשמל.", "ar": "الألواح الشمسية تحتاج ضوءًا، وفي الليل لا تنتج كهرباء.", "ru": "Солнечным панелям нужен свет, и ночью они не дают ток.", "en": "Solar panels need light, and at night they make no electricity."}, {"he": "זה לא פתרון מעשי; בתים צריכים חשמל גם בערב.", "ar": "هذا ليس حلًا عمليًا؛ البيوت تحتاج كهرباء في المساء أيضًا.", "ru": "Это не практичное решение: домам нужно электричество и вечером.", "en": "This is not practical; homes need electricity in the evening too."}, {"he": "בחושך אין אור לקלוט, ולכן הצבע לא משנה דבר בלילה.", "ar": "في الظلام لا ضوء يُلتقط، فاللون لا يغيّر شيئًا ليلًا.", "ru": "В темноте нечего улавливать, поэтому цвет ночью ничего не меняет.", "en": "In the dark there is no light to catch, so the color changes nothing at night."}]),
Q("en-3-11",{"he": "במדיח כלים, תוכנית ״אקו״ נמשכת 3 שעות, ותוכנית רגילה שעה וחצי. דני אומר: ״התוכנית הארוכה בטוח צורכת יותר חשמל.״ מה נכון?", "ar": "في جلّاية الصحون، برنامج «إيكو» يستمر 3 ساعات، والبرنامج العادي ساعة ونصفًا. يقول داني: «البرنامج الطويل يستهلك حتمًا كهرباء أكثر.» ما الصحيح؟", "ru": "В посудомойке программа «Эко» идёт 3 часа, а обычная — полтора часа. Дани говорит: «Длинная программа точно тратит больше электричества». Что верно?", "en": "In a dishwasher, the \"Eco\" program lasts 3 hours and the normal one an hour and a half. Danny says: \"The long program surely uses more electricity.\" What is correct?"},[{"he": "הוא צודק, כי זמן ארוך יותר תמיד אומר יותר אנרגיה.", "ar": "هو محق، لأن الوقت الأطول يعني دائمًا طاقة أكثر.", "ru": "Он прав: больше времени всегда означает больше энергии.", "en": "He is right, because more time always means more energy."}, {"he": "לא בהכרח: ב״אקו״ המים חמים פחות, וההספק נמוך יותר.", "ar": "ليس بالضرورة: في «إيكو» يسخن الماء أقل، والقدرة أقل.", "ru": "Не обязательно: в «Эко» вода греется меньше, и мощность ниже.", "en": "Not necessarily: in Eco the water is heated less, and the power is lower."}, {"he": "הוא צודק, כי המנוע של המדיח עובד באקו זמן כפול בדיוק.", "ar": "هو محق، لأن محرّك الجلّاية يعمل في «إيكو» ضعف الوقت تمامًا.", "ru": "Он прав: в «Эко» мотор посудомойки работает ровно вдвое дольше.", "en": "He is right, because in Eco the dishwasher's motor runs exactly twice as long."}, {"he": "אי אפשר לדעת שום דבר על הצריכה של מכשירים.", "ar": "لا يمكن معرفة أي شيء عن استهلاك الأجهزة.", "ru": "О расходе приборов ничего узнать нельзя.", "en": "Nothing can be known about how much devices use."}],1,{"he": "חשבו מה משפיע על כמות האנרגיה, חוץ ממשך הזמן.", "ar": "فكّروا ما الذي يؤثر في كمية الطاقة، غير المدة.", "ru": "Подумайте, что влияет на количество энергии, кроме времени.", "en": "Think about what affects the amount of energy, besides the time."},{"he": "אנרגיה היא הספק כפול זמן. רוב החשמל במדיח הולך לחימום המים, וב״אקו״ המים חמים פחות, ולכן הצריכה הכוללת קטנה יותר. למשל ב״אקו״ הכלים נשרים יותר זמן, וכך הם מתנקים גם במים פחות חמים.", "ar": "الطاقة هي القدرة مضروبة في الزمن. معظم كهرباء الجلّاية يذهب لتسخين الماء، وفي «إيكو» يكون الماء أقل سخونة، فيكون الاستهلاك الكلي أقل. مثال: في «إيكو» تُنقع الصحون وقتًا أطول، فتنظف حتى بماء أقل سخونة.", "ru": "Энергия — это мощность, умноженная на время. Больше всего электричества посудомойка тратит на нагрев воды, а в «Эко» вода холоднее, поэтому общий расход меньше. Например, в «Эко» посуда дольше отмокает и отмывается даже менее горячей водой.", "en": "Energy is power multiplied by time. Most of a dishwasher's electricity goes to heating water, and in Eco the water is cooler, so the total use is lower. For example, in Eco the dishes soak longer, so they get clean even in less hot water."},null,[{"he": "אנרגיה תלויה גם בהספק, ולא רק בזמן.", "ar": "الطاقة تتعلق بالقدرة أيضًا، لا بالزمن فقط.", "ru": "Энергия зависит и от мощности, а не только от времени.", "en": "Energy depends on power too, not only on time."}, null, {"he": "המנוע צורך מעט; רוב החשמל הולך לחימום המים.", "ar": "المحرّك يستهلك قليلًا؛ معظم الكهرباء يذهب لتسخين الماء.", "ru": "Мотор тратит мало; основная часть электричества идёт на нагрев воды.", "en": "The motor uses little; most of the electricity goes to heating the water."}, {"he": "אפשר למדוד צריכה במד צריכה או לקרוא אותה על התווית.", "ar": "يمكن قياس الاستهلاك بعدّاد أو قراءته على الملصق.", "ru": "Расход можно измерить счётчиком или прочитать на этикетке.", "en": "Use can be measured with a meter or read on the label."}]),
Q("en-3-12",{"he": "שתי תלמידות בדקו פעם אחת: כוס עם מכסה התקררה ב-6 מעלות, וכוס בלי מכסה ב-7 מעלות. הן כתבו: ״מכסה כמעט לא משנה.״ מה הכי נכון לעשות כדי לבדוק את המסקנה?", "ar": "فحصت طالبتان مرة واحدة: كوب بغطاء برد 6 درجات، وكوب بلا غطاء برد 7 درجات. كتبتا: «الغطاء لا يغيّر تقريبًا.» ما الأصح فعله لفحص الاستنتاج؟", "ru": "Две ученицы проверили один раз: чашка с крышкой остыла на 6 градусов, без крышки — на 7. Они написали: «Крышка почти ничего не меняет». Что правильнее всего сделать, чтобы проверить вывод?", "en": "Two students tested once: a cup with a lid cooled by 6 degrees, and a cup without a lid by 7 degrees. They wrote: \"A lid hardly matters.\" What is best to do to check the conclusion?"},[{"he": "לחזור כמה פעמים באותם תנאים, ולראות אם ההבדל חוזר.", "ar": "التكرار عدة مرات بالظروف نفسها، ورؤية هل يتكرر الفرق.", "ru": "Повторить несколько раз в тех же условиях и посмотреть, повторится ли разница.", "en": "Repeat it several times in the same conditions and see if the gap repeats."}, {"he": "לשנות את המסקנה ל״מכסה משנה מאוד״, כי 7 גדול יותר מ-6.", "ar": "تغيير الاستنتاج إلى «الغطاء يغيّر كثيرًا»، لأن 7 أكبر من 6.", "ru": "Изменить вывод на «крышка очень важна», ведь 7 больше 6.", "en": "Change the conclusion to \"a lid matters a lot\", since 7 is more than 6."}, {"he": "לפרסם את המסקנה מיד, כי מדידה אחת מספיקה תמיד.", "ar": "نشر الاستنتاج فورًا، لأن قياسًا واحدًا يكفي دائمًا.", "ru": "Сразу опубликовать вывод: одного измерения всегда достаточно.", "en": "Publish the conclusion at once, because one measurement is always enough."}, {"he": "לבדוק בפעם הבאה רק את הכוס עם המכסה, בלי השוואה.", "ar": "فحص الكوب ذي الغطاء فقط في المرة القادمة، بلا مقارنة.", "ru": "В следующий раз проверить только чашку с крышкой, без сравнения.", "en": "Next time test only the cup with a lid, with no comparison."}],0,{"he": "חשבו מה עושים כשהבדל קטן עלול לנבוע מטעות במדידה.", "ar": "فكّروا ماذا نفعل عندما يكون الفرق الصغير ربما ناتجًا عن خطأ في القياس.", "ru": "Подумайте, что делать, если маленькая разница может быть ошибкой измерения.", "en": "Think about what to do when a small difference may come from a measuring error."},{"he": "מדידה אחת יכולה להטעות, במיוחד כשההבדל קטן. חזרה על הניסוי באותם תנאים מראה אם התוצאה יציבה. למשל מדחום פשוט יכול לטעות במעלה אחת, וזה כל ההבדל כאן.", "ar": "قياس واحد قد يضلّل، خاصة عندما يكون الفرق صغيرًا. تكرار التجربة بالظروف نفسها يُظهر هل النتيجة ثابتة. مثال: ميزان حرارة بسيط قد يخطئ بدرجة واحدة، وهذا هو كل الفرق هنا.", "ru": "Одно измерение может обмануть, особенно если разница мала. Повтор опыта в тех же условиях показывает, устойчив ли результат. Например, простой термометр может ошибаться на градус, а здесь вся разница — один градус.", "en": "One measurement can mislead, especially when the difference is small. Repeating the test under the same conditions shows whether the result is stable. For example, a simple thermometer can be off by one degree, which is the whole difference here."},null,[null, {"he": "הבדל של מעלה אחת בבדיקה אחת אינו מספיק למסקנה חזקה.", "ar": "فرق درجة واحدة في فحص واحد لا يكفي لاستنتاج قوي.", "ru": "Разница в один градус в одном опыте не даёт сильного вывода.", "en": "A one-degree difference in a single test is not enough for a strong conclusion."}, {"he": "מדידה אחת עלולה לכלול טעות, ולכן היא אינה מספיקה.", "ar": "القياس الواحد قد يحتوي خطأ، لذلك لا يكفي.", "ru": "В одном измерении может быть ошибка, поэтому его мало.", "en": "A single measurement may contain an error, so it is not enough."}, {"he": "בלי כוס להשוואה אי אפשר לדעת מה המכסה משנה.", "ar": "بلا كوب للمقارنة لا يمكن معرفة ما يغيّره الغطاء.", "ru": "Без чашки для сравнения не понять, что меняет крышка.", "en": "Without a cup to compare, you cannot tell what the lid changes."}]),
Q("en-3-13",{"he": "בעל בית שוקל להתקין מערכת סולארית על הגג. איזה מידע הכי חשוב לו כדי להחליט אם ההשקעה משתלמת?", "ar": "صاحب بيت يفكّر في تركيب منظومة شمسية على السطح. أي معلومة هي الأهم له ليقرّر هل الاستثمار مُجدٍ؟", "ru": "Хозяин дома думает поставить солнечную систему на крышу. Какие сведения важнее всего, чтобы решить, выгодно ли это вложение?", "en": "A homeowner is thinking of installing a solar system on the roof. Which information matters most for deciding whether the investment pays off?"},[{"he": "כמה שכנים ברחוב כבר התקינו מערכת דומה.", "ar": "كم جارًا في الشارع ركّب منظومة مشابهة.", "ru": "Сколько соседей на улице уже поставили такую систему.", "en": "How many neighbors on the street already installed a similar system."}, {"he": "מה צבע המסגרת של הלוחות, והאם הוא מתאים לבית.", "ar": "ما لون إطار الألواح، وهل يناسب البيت.", "ru": "Какого цвета рамка панелей и подходит ли она к дому.", "en": "What color the panel frames are, and whether it suits the house."}, {"he": "כמה חשמל צורכים השכנים מהבניין הסמוך בכל חודש.", "ar": "كم كهرباء يستهلك الجيران في المبنى المجاور كل شهر.", "ru": "Сколько электричества в месяц тратят соседи из соседнего дома.", "en": "How much electricity the neighbors next door use each month."}, {"he": "עלות ההתקנה מול החשמל שהמערכת תייצר בכל שנה.", "ar": "تكلفة التركيب مقابل الكهرباء التي تنتجها المنظومة كل سنة.", "ru": "Цена установки по сравнению с электричеством, которое система даст за год.", "en": "The installation cost against the electricity it will make each year."}],3,{"he": "חשבו על השוואה בין כמה משלמים לבין כמה מקבלים בחזרה.", "ar": "فكّروا في مقارنة بين كم ندفع وكم نستعيد.", "ru": "Подумайте о сравнении: сколько платишь и сколько получаешь обратно.", "en": "Think about comparing how much you pay with how much you get back."},{"he": "כדי לדעת אם השקעה משתלמת, משווים עלות מול תועלת לאורך זמן. כאן התועלת היא החשמל שהמערכת תייצר, והכסף שהוא חוסך. למשל מערכת שעולה 30,000 ₪ וחוסכת 5,000 ₪ בשנה מחזירה את עצמה תוך 6 שנים.", "ar": "لمعرفة هل الاستثمار مُجدٍ، نقارن التكلفة بالفائدة على مدى الزمن. هنا الفائدة هي الكهرباء التي تنتجها المنظومة، والمال الذي توفّره. مثال: منظومة تكلّف 30,000 ₪ وتوفّر 5,000 ₪ في السنة تسترجع ثمنها خلال 6 سنوات.", "ru": "Чтобы понять, выгодно ли вложение, сравнивают затраты и пользу за долгое время. Здесь польза — электричество, которое даст система, и сэкономленные деньги. Например, система за 30,000 ₪, экономящая 5,000 ₪ в год, окупается за 6 лет.", "en": "To know whether an investment pays off, compare cost with benefit over time. Here the benefit is the electricity the system will make, and the money it saves. For example, a system costing 30,000 ₪ that saves 5,000 ₪ a year pays for itself in 6 years."},null,[{"he": "מה שהשכנים עשו אינו אומר כמה המערכת תחסוך בבית הזה.", "ar": "ما فعله الجيران لا يخبر كم ستوفّر المنظومة في هذا البيت.", "ru": "То, что сделали соседи, не говорит, сколько система сэкономит в этом доме.", "en": "What the neighbors did does not tell how much the system will save in this home."}, {"he": "צבע המסגרת אינו משנה את כמות החשמל או את העלות.", "ar": "لون الإطار لا يغيّر كمية الكهرباء أو التكلفة.", "ru": "Цвет рамки не меняет ни выработку, ни цену.", "en": "The frame color does not change the amount of electricity or the cost."}, {"he": "הצריכה של השכנים אינה משפיעה על התשואה של המערכת בבית הזה.", "ar": "استهلاك الجيران لا يؤثر في عائد المنظومة في هذا البيت.", "ru": "Расход соседей не влияет на выгоду системы в этом доме.", "en": "The neighbors' use does not affect the system's return in this home."}, null]),
Q("en-3-14",{"he": "איזו מהטענות על הרתחת מים אפשר לבדוק בניסוי עם מדידה?", "ar": "أي من الادعاءات عن غلي الماء يمكن فحصه بتجربة فيها قياس؟", "ru": "Какое из утверждений о кипячении воды можно проверить опытом с измерением?", "en": "Which of these claims about boiling water can be checked by an experiment with measurement?"},[{"he": "קומקום אדום יפה יותר מקומקום לבן.", "ar": "الغلاية الحمراء أجمل من البيضاء.", "ru": "Красный чайник красивее белого.", "en": "A red kettle is prettier than a white one."}, {"he": "נעים יותר לשתות תה מכוס זכוכית מאשר מספל.", "ar": "شرب الشاي من كوب زجاجي أمتع من الفنجان.", "ru": "Пить чай из стакана приятнее, чем из кружки.", "en": "Drinking tea from a glass is nicer than from a mug."}, {"he": "קומקום מרתיח ליטר מים מהר יותר מסיר רגיל.", "ar": "الغلاية تغلي لترًا من الماء أسرع من قدر عادي.", "ru": "Чайник кипятит литр воды быстрее обычной кастрюли.", "en": "A kettle boils a liter of water faster than an ordinary pot."}, {"he": "כל משפחה צריכה להחזיק קומקום חשמלי בבית.", "ar": "يجب أن تمتلك كل عائلة غلاية كهربائية في البيت.", "ru": "Каждой семье нужно держать дома электрочайник.", "en": "Every family should keep an electric kettle at home."}],2,{"he": "חפשו טענה שאפשר לענות עליה במספר שמכשיר מדידה מראה.", "ar": "ابحثوا عن ادعاء يمكن الإجابة عنه برقم يُظهره جهاز قياس.", "ru": "Ищите утверждение, на которое можно ответить числом с измерительного прибора.", "en": "Look for a claim that can be answered with a number shown by a measuring device."},{"he": "טענה מדעית אפשר לבדוק במדידה, למשל עם שעון עצר ומדחום. ״יפה״ ו״נעים״ הם עניין של טעם, ו״צריכה״ היא המלצה שתלויה בערכים. למשל מרתיחים ליטר מים בכל כלי, ומודדים כמה זמן זה לקח.", "ar": "الادعاء العلمي يمكن فحصه بالقياس، مثلًا بساعة توقيت وميزان حرارة. «جميل» و«ممتع» مسألة ذوق، و«يجب» توصية تتعلق بالقيم. مثال: نغلي لترًا من الماء في كل وعاء، ونقيس كم استغرق ذلك.", "ru": "Научное утверждение можно проверить измерением, например секундомером и термометром. «Красивый» и «приятный» — дело вкуса, а «нужно» — совет, зависящий от ценностей. Например, кипятят литр воды в каждой посуде и засекают, сколько это заняло.", "en": "A scientific claim can be checked by measuring, for example with a stopwatch and a thermometer. \"Pretty\" and \"nice\" are matters of taste, and \"should\" is advice that depends on values. For example, boil a liter of water in each vessel and time how long it takes."},null,[{"he": "יופי הוא עניין של טעם, ואין מכשיר שמודד אותו.", "ar": "الجمال مسألة ذوق، ولا يوجد جهاز يقيسه.", "ru": "Красота — дело вкуса, и нет прибора, который её измеряет.", "en": "Beauty is a matter of taste, and no device measures it."}, {"he": "״נעים״ הוא תחושה אישית, ולא מספר שאפשר למדוד.", "ar": "«ممتع» شعور شخصي، وليس رقمًا يمكن قياسه.", "ru": "«Приятно» — личное ощущение, а не число для измерения.", "en": "\"Nicer\" is a personal feeling, not a number you can measure."}, null, {"he": "״צריכה״ היא המלצה שתלויה בערכים, ומדידה לא מכריעה אותה.", "ar": "«يجب» توصية تتعلق بالقيم، والقياس لا يحسمها.", "ru": "«Нужно» — совет, зависящий от ценностей; измерение его не решает.", "en": "\"Should\" is advice that depends on values; measuring does not settle it."}])
] ])

topic("env-issues","704182",{"he":"סוגיות מדעיות-טכנולוגיות עכשוויות","ar":"قضايا علمية وتكنولوجية معاصرة","ru":"Современные научно-технологические вопросы","en":"Current science and technology issues"},{"he":"סביבה, מים ואנרגיה בחיי היום-יום","ar":"البيئة والمياه والطاقة في الحياة اليومية","ru":"Окружающая среда, вода и энергия в повседневной жизни","en":"Environment, water, and energy in daily life"}, [
  [
    Q("env-issues-1-1",{"he":"מה עלול לזהם את האוויר ליד כביש עמוס בעיר?","ar":"ما الذي قد يلوّث الهواء قرب شارع مزدحم في المدينة؟","ru":"Что может загрязнять воздух возле оживлённой городской дороги?","en":"What can pollute the air beside a busy city road?"},[{"he":"האור מפנסי הרחוב","ar":"ضوء مصابيح الشارع","ru":"Свет уличных фонарей","en":"Light from street lamps"},{"he":"גזים וחלקיקים מכלי רכב","ar":"غازات وجسيمات من المركبات","ru":"Газы и частицы от транспорта","en":"Gases and particles from vehicles"},{"he":"אדי מים שעולים מהים","ar":"بخار الماء الصاعد من البحر","ru":"Водяной пар с моря","en":"Water vapor rising from the sea"},{"he":"ריח של אוכל מחנויות","ar":"رائحة الطعام من المتاجر","ru":"Запах еды из магазинов","en":"Food smells from shops"}],1,{"he":"חשבו מה משתחרר לסביבה כשמנועים פועלים בפקק.","ar":"فكّروا بما ينطلق إلى البيئة عندما تعمل المحركات في الازدحام.","ru":"Подумайте, что попадает в окружающую среду, когда двигатели работают в пробке.","en":"Think about what enters the surroundings when engines run in traffic."},{"he":"מנועי בנזין ודיזל פולטים גזים וחלקיקים שעלולים לפגוע באיכות האוויר. למשל, ליד צומת עמוס בשעת הבוקר יש יותר כלי רכב שפולטים מזהמים.","ar":"تطلق محركات البنزين والديزل غازات وجسيمات قد تضر بجودة الهواء. مثلًا، قرب تقاطع مزدحم صباحًا تمر مركبات أكثر وتطلق ملوّثات.","ru":"Бензиновые и дизельные двигатели выбрасывают газы и частицы, которые ухудшают качество воздуха. Например, утром на оживлённом перекрёстке больше машин и выбросов.","en":"Petrol and diesel engines release gases and particles that can harm air quality. For example, at a busy junction in the morning, more vehicles release pollutants."},null,[{"he":"האור הוא זיהום אור אפשרי, אך אינו פולט את מזהמי האוויר של כלי הרכב.","ar":"قد يسبب الضوء تلوثًا ضوئيًا، لكنه لا يطلق ملوّثات الهواء الناتجة عن المركبات.","ru":"Свет может создавать световое загрязнение, но не выбрасывает загрязнители воздуха от машин.","en":"Light may cause light pollution, but it does not emit vehicle air pollutants."},null,{"he":"אדי מים מהים אינם פליטה ממנועי כלי רכב.","ar":"بخار الماء من البحر ليس انبعاثًا من محركات المركبات.","ru":"Водяной пар с моря не является выбросом двигателей.","en":"Sea vapor is not an emission from vehicle engines."},{"he":"ריח אוכל אינו מקור הגזים והחלקיקים שמנועים פולטים לכביש.","ar":"رائحة الطعام ليست مصدر الغازات والجسيمات التي تطلقها المحركات إلى الشارع.","ru":"Запах еды не является источником газов и частиц от двигателей на дороге.","en":"Food smells are not the source of gases and particles released by road engines."}]),
    Q("env-issues-1-2",{"he":"בקיץ יבש, מאיפה מגיע חלק גדול ממי השתייה בישראל?","ar":"في صيف جاف، من أين يأتي جزء كبير من مياه الشرب في إسرائيل؟","ru":"Откуда берётся значительная часть питьевой воды Израиля засушливым летом?","en":"In a dry summer, where does a large share of Israel’s drinking water come from?"},[{"he":"מאיסוף גשם בכל שכונה","ar":"من جمع المطر في كل حيّ","ru":"Из сбора дождя в каждом районе","en":"Rain collected in each neighborhood"},{"he":"מייבוא בקבוקי מים מחו״ל","ar":"من استيراد عبوات الماء من الخارج","ru":"Из импортной бутилированной воды","en":"Imported bottled water"},{"he":"ממתקני התפלה על החוף","ar":"من محطات التحلية على الساحل","ru":"С опреснительных станций на побережье","en":"Coastal desalination plants"},{"he":"מצינורות שמגיעים מאירופה","ar":"من أنابيب قادمة من أوروبا","ru":"По трубопроводам из Европы","en":"Pipelines arriving from Europe"}],2,{"he":"חשבו איך אפשר להשתמש בים התיכון גם כשכמעט לא יורד גשם.","ar":"فكّروا كيف يمكن الاستفادة من البحر المتوسط حتى حين يقل المطر.","ru":"Подумайте, как можно использовать Средиземное море, когда дождей почти нет.","en":"Think about how the Mediterranean can be used when there is little rain."},{"he":"ישראל מתפילה מי ים במתקנים גדולים ומעבירה את המים המטופלים לרשת האספקה. למשל, מתקן ההתפלה באשקלון מספק מים גם כשאין גשם בקיץ.","ar":"تحلّي إسرائيل ماء البحر في محطات كبيرة وتوصل الماء المعالَج إلى شبكة التزويد. مثلًا، محطة عسقلان توفر الماء حتى حين لا يهطل المطر صيفًا.","ru":"Израиль опресняет морскую воду на крупных станциях и подаёт обработанную воду в систему водоснабжения. Например, станция в Ашкелоне поставляет воду и летом без дождей.","en":"Israel desalinates seawater at large plants and sends treated water into the supply network. For example, the Ashkelon plant supplies water even when summer brings no rain."},null,[{"he":"איסוף גשם מקומי אינו מספק את רוב צורכי השתייה, במיוחד בקיץ יבש.","ar":"جمع المطر محليًا لا يلبي معظم حاجات الشرب، خصوصًا في صيف جاف.","ru":"Местного сбора дождя недостаточно для основной потребности в питьевой воде, особенно летом.","en":"Local rain collection cannot meet most drinking-water needs, especially in a dry summer."},{"he":"בקבוקי מים מיובאים אינם המקור העיקרי למים הזורמים בברז.","ar":"عبوات الماء المستوردة ليست المصدر الرئيسي للماء الجاري من الصنبور.","ru":"Импортные бутылки не являются основным источником воды в кране.","en":"Imported bottles are not the main source of tap water."},null,{"he":"ישראל אינה מקבלת את מי השתייה שלה בצינורות מנהרות אירופה.","ar":"إسرائيل لا تتلقى مياه الشرب عبر أنابيب من أنهار أوروبا.","ru":"Израиль не получает питьевую воду по трубам из европейских рек.","en":"Israel does not get its drinking water by pipes from European rivers."}]),
