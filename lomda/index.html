<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>לומדה — לימוד לפי נושא</title>
<meta name="description" content="לומדה — לימוד לפי נושא, למי שלומד אחרת: כל פריט עם הסבר, סיבה ותוצאה, עם מושגים וקטעי מקור — בעברית, ערבית, רוסית ואנגלית, והכול מוקרא." />
<meta name="theme-color" content="#f5f5fb" media="(prefers-color-scheme:light)" />
<meta name="theme-color" content="#12122a" media="(prefers-color-scheme:dark)" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Lexend:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   לומדה — לימוד לפי נושא
   האפליקציה הזאת אינה יודעת שום נושא. את התוכן היא מקבלת מקובצי
   data/*.js, ולכן נושא חדש נכנס בקובץ אחד ולא בכתיבה מחדש של
   אלפי שורות. ראו סעיף 7 — הוא הסעיף היחיד שנבדל כאן משאר
   הפורטפוליו. כל שאר ההחלטות זהות:
   · כל פריט נושא הסבר, סיבה ותוצאה — לא רק שם.
   · שום טקסט לא מוצג בלי שאפשר לשמוע אותו.
   · שפת האם היא פיגום, לא קביים — היא נסוגה עם העלייה ברמה.
   כל המידות ב-rem, כדי שהגדלת טקסט תגדיל את הכול יחד.
   ============================================================ */
:root{
  --ar:"Noto Sans Arabic",system-ui,"Segoe UI",Arial,sans-serif;
  --font:"Heebo","Rubik",system-ui,"Segoe UI",Arial,sans-serif;
  --en:"Lexend","Heebo",system-ui,"Segoe UI",Arial,sans-serif;
  --bg:#f5f5fb; --surface:#ffffff; --surface2:#eceaf5;
  --ink:#16162b; --muted:#5a5a72; --faint:#78788f; --line:#e2e0ee;
  --accent:#4338ca; --accent-ink:#ffffff; --accent-soft:#e2e0fb;
  --gold:#a16207; --gold-soft:#fbf0d5; --hit:#f5c451; --hit-ink:#1a1300;
  --ok:#15803d; --ok-soft:#dcfce7; --bad:#be123c; --bad-soft:#ffe4e9;
  --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(22,22,43,.05),0 8px 24px -12px rgba(22,22,43,.2);
  --r:14px;
  /* צבע לכל מסלול. לא קישוט: ארבעה סוגי לימוד שונים לגמרי, וצבע
     קבוע לכל אחד חוסך למי שמתקשה להתמצא את השאלה "איפה אני". */
  --c-sound:#0369a1; --cs-sound:#dbeefc;   /* צליל ואות   */
  --c-words:#15803d; --cs-words:#dcfce7;   /* מילים       */
  --c-talk:#c2410c;  --cs-talk:#fde5d8;    /* מדוברת      */
  --c-read:#6d28d9;  --cs-read:#eae2fd;    /* ספרותית     */
}

/* Heebo, Fredoka ו-Assistant אינם מכילים גליפים ערביים. בלי
   המשפחה הזאת הממשק הערבי נופל לגופן ברירת המחדל של המערכת —
   נמדד: הוא הוצג כאן ב-Heebo. Noto Sans Arabic נטען מאותה בקשת
   גופנים שכבר קיימת, ולכן אין כאן תלות חיצונית חדשה, וקובצי
   הגופן נמשכים רק כשבאמת מוצג טקסט ערבי. */
html[lang="ar"] body,html[lang="ar"] input,html[lang="ar"] button,
html[lang="ar"] textarea,html[lang="ar"] select{font-family:var(--ar)}
:root[data-theme="dark"]{
  --bg:#12122a; --surface:#1b1b38; --surface2:#252547;
  --ink:#eceaf6; --muted:#a6a6c2; --faint:#7f7f9c; --line:#33335c;
  --accent:#a5b4fc; --accent-ink:#12122a; --accent-soft:#282856;
  --gold:#fbbf24; --gold-soft:#33270f; --hit:#ffd24d; --hit-ink:#241a00;
  --ok:#4ade80; --ok-soft:#132a1c; --bad:#fb7185; --bad-soft:#33161f;
  --warn:#fbbf24; --warn-soft:#33260f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  --c-sound:#7dd3fc; --cs-sound:#0b2a3d;
  --c-words:#86efac; --cs-words:#0f2a1a;
  --c-talk:#fdba74;  --cs-talk:#3a2113;
  --c-read:#c4b5fd;  --cs-read:#261a45;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12122a; --surface:#1b1b38; --surface2:#252547;
    --ink:#eceaf6; --muted:#a6a6c2; --faint:#7f7f9c; --line:#33335c;
    --accent:#a5b4fc; --accent-ink:#12122a; --accent-soft:#282856;
    --gold:#fbbf24; --gold-soft:#33270f; --hit:#ffd24d; --hit-ink:#241a00;
    --ok:#4ade80; --ok-soft:#132a1c; --bad:#fb7185; --bad-soft:#33161f;
    --warn:#fbbf24; --warn-soft:#33260f;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
    --c-sound:#7dd3fc; --cs-sound:#0b2a3d;
    --c-words:#86efac; --cs-words:#0f2a1a;
    --c-talk:#fdba74;  --cs-talk:#3a2113;
    --c-read:#c4b5fd;  --cs-read:#261a45;
  }
}
/* ניגודיות גבוהה — שחור על לבן, מסגרות מלאות, בלי גוונים רכים */
:root.hc{
  --bg:#ffffff; --surface:#ffffff; --surface2:#ffffff;
  --ink:#000000; --muted:#1a1a1a; --faint:#333333; --line:#000000;
  --accent:#26208c; --accent-ink:#ffffff; --accent-soft:#eceafb;
  --gold:#5c3d00; --gold-soft:#f7efdf; --hit:#ffe600; --hit-ink:#000000;
  --ok:#0a5c2a; --ok-soft:#e6f4ea; --bad:#8c0f2c; --bad-soft:#fbe9ed;
  --warn:#6b3d00; --warn-soft:#f7efdf; --shadow:none;
  --c-sound:#00305c; --cs-sound:#e8eef7;
  --c-words:#0a5c2a; --cs-words:#e6f4ea;
  --c-talk:#7a2c00;  --cs-talk:#f9ece4;
  --c-read:#3d1a75;  --cs-read:#eee8f9;
}
:root.hc *{box-shadow:none!important}
:root.hc .card,:root.hc .btn,:root.hc .opt{border-width:2px!important}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs,17px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  font-size:1rem;line-height:1.65;-webkit-text-size-adjust:100%}
:root.clear body{font-family:"Verdana","Tahoma","Heebo",sans-serif;letter-spacing:.012em}
:root.spaced body{word-spacing:.22em;line-height:1.95}
:root.rm *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
h1,h2,h3{margin:0;line-height:1.3;font-weight:800}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* כל טקסט אנגלי — כיוון, גופן ומרווח משלו. unicode-bidi:isolate מונע
   מהמשפט האנגלי לגרור אחריו את סימני הפיסוק של המשפט העברי. */
.en{font-family:var(--en);direction:ltr;unicode-bidi:isolate;text-align:start}
.en-b{font-family:var(--en);direction:ltr;unicode-bidi:isolate;display:inline-block}

.wrap{max-width:56rem;margin:0 auto;padding:0 clamp(.9rem,3vw,1.5rem)}
.hbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-block:.6rem}
:root.hc .hbar{background:var(--bg);backdrop-filter:none}
.hrow{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
.brand{font-size:1.35rem;font-weight:800;letter-spacing:-.01em;display:flex;
  align-items:baseline;gap:.5rem;margin-inline-end:auto}
.brand small{font-size:.72rem;font-weight:600;color:var(--muted);letter-spacing:.06em}
.gbtn{display:inline-flex;align-items:center;gap:.4rem;background:var(--surface);
  border:1px solid var(--line);border-radius:999px;padding:.42rem .8rem;cursor:pointer;
  font-size:.86rem;font-weight:600;box-shadow:var(--shadow);min-height:44px}
.gbtn:hover{border-color:var(--accent)}
.gbtn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:1.1rem}
.grid{display:grid;gap:.85rem}
@media(min-width:640px){.g2{grid-template-columns:1fr 1fr}}
@media(min-width:900px){.g3{grid-template-columns:repeat(3,1fr)}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;
  border:1px solid var(--line);background:var(--surface);border-radius:12px;
  padding:.72rem 1.1rem;font-weight:700;cursor:pointer;box-shadow:var(--shadow);
  min-height:2.9rem;font-size:1rem}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;box-shadow:none}
.btn[disabled]{opacity:.45;cursor:default}
.btn.wide{width:100%}
/* מודול המבחן הכיתתי הועתק ממשפחת math-uni, ושם .btn-p ו-.btn.w
   מוגדרים. כאן הם לא היו, ולכן "מבחן חדש", "צרו את המבחן", "התחלת
   מבחן" וכפתורי הוואטסאפ נראו ככפתור ריק בלי צבע — טקסט קטן עם פלוס.
   כחול, ולא טורקיז: זה כפתור של המורה, ובולט מכל שאר המסך. */
.btn-p{background:#2563eb;color:#fff;border-color:#2563eb}
.btn-p:hover{filter:brightness(1.1);border-color:#2563eb}
.btn.w{width:100%}

.chip{display:inline-flex;align-items:center;gap:.35rem;border-radius:999px;
  padding:.22rem .6rem;font-size:.78rem;font-weight:700;background:var(--surface2);color:var(--muted)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}

/* ===== מסלולים: הצבע נכנס ככרטיס, לא כרקע של טקסט ===== */
.trk{--c:var(--accent);--cs:var(--accent-soft)}
.t-sound{--c:var(--c-sound);--cs:var(--cs-sound)}
.t-words{--c:var(--c-words);--cs:var(--cs-words)}
.t-talk{--c:var(--c-talk); --cs:var(--cs-talk)}
.t-read{--c:var(--c-read); --cs:var(--cs-read)}
.tcard{border-inline-start:5px solid var(--c);cursor:pointer;text-align:start;width:100%;
  display:flex;flex-direction:column;gap:.4rem;align-items:stretch}
.tcard:hover{border-color:var(--c)}
.tcard h3{font-size:1.05rem}
.tcard .sub{font-size:.85rem;color:var(--muted)}
.tdot{width:.62rem;height:.62rem;border-radius:50%;background:var(--c);flex:none}
.thead{display:flex;align-items:center;gap:.5rem}
.tpill{background:var(--cs);color:var(--c);border-radius:999px;padding:.15rem .55rem;
  font-size:.72rem;font-weight:800}

/* ===== סרגל שליטה ברמות ===== */
.lvls{display:flex;gap:.4rem;flex-wrap:wrap}
.lvl{border:1px solid var(--line);background:var(--surface);border-radius:10px;
  padding:.4rem .7rem;font-size:.82rem;font-weight:700;cursor:pointer;
  display:inline-flex;align-items:center;gap:.4rem}
.lvl.on{background:var(--c,var(--accent));color:var(--accent-ink);border-color:var(--c,var(--accent))}
.bar{height:.42rem;border-radius:999px;background:var(--surface2);overflow:hidden;flex:1;min-width:3rem}
.bar i{display:block;height:100%;background:var(--c,var(--accent))}
.bar.b0 i{background:var(--bad)} .bar.b1 i{background:var(--warn)} .bar.b2 i{background:var(--ok)}

/* ===== תרגול ===== */
.qcard{border-top:5px solid var(--c,var(--accent))}
.qtop{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.7rem}
.qtext{font-size:1.12rem;font-weight:600;margin:.2rem 0 .3rem}
.qhint{color:var(--muted);font-size:.9rem}
/* המילה או המשפט שנלמדים. גדול, מרווח, ותמיד לצד כפתור השמעה. */
.subject{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;
  background:var(--surface2);border-radius:12px;padding:.85rem 1rem;margin:.5rem 0}
.subject .word{font-family:var(--en);direction:ltr;unicode-bidi:isolate;
  font-size:1.7rem;font-weight:700;letter-spacing:.01em;line-height:1.25}
.subject .ipa{font-family:var(--en);direction:ltr;unicode-bidi:isolate;
  color:var(--muted);font-size:.95rem}
.spk{border:1px solid var(--line);background:var(--surface);border-radius:999px;
  width:2.7rem;height:2.7rem;display:inline-flex;align-items:center;justify-content:center;
  cursor:pointer;flex:none;box-shadow:var(--shadow)}
.spk:hover{border-color:var(--accent);color:var(--accent)}
.spk.sm{width:2.1rem;height:2.1rem}
.spk.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.opts{display:grid;gap:.6rem;margin-top:.9rem}
@media(min-width:560px){.opts.two{grid-template-columns:1fr 1fr}}
.opt{display:flex;align-items:center;gap:.6rem;text-align:start;width:100%;
  border:2px solid var(--line);background:var(--surface);border-radius:12px;
  padding:.8rem .9rem;cursor:pointer;font-size:1.02rem;font-weight:600;min-height:3.1rem}
.opt:hover{border-color:var(--accent)}
.opt .k{width:1.9rem;height:1.9rem;border-radius:8px;background:var(--surface2);
  display:inline-flex;align-items:center;justify-content:center;font-size:.85rem;
  font-weight:800;color:var(--muted);flex:none}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .k{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .k{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.55}
/* בחירה במבחן היא בחירה, לא תשובה נכונה. במסכי התרגול הצבע
   הירוק אומר "צדקת", ובמבחן אסור לו להופיע כלל — הוא נותן
   משוב שגוי לכל בחירה. ניטרלי, ורק מסמן מה סומן. */
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);margin-inline-start:3px}
.dot.ok{background:var(--ok);border-color:var(--ok)}
.dot.no{background:var(--bad);border-color:var(--bad)}
.dot.flag{box-shadow:0 0 0 2px var(--accent)}

/* אריחי בניית משפט. הסדר הוא התרגיל, ולכן האריח חייב להיראות כמשהו
   שאפשר להרים — מסגרת מלאה ורקע משלו, לא טקסט על רקע הכרטיס. */
.tiles{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:.7rem}
.tile{font-family:var(--en);direction:ltr;border:2px solid var(--line);
  background:var(--surface);border-radius:10px;padding:.5rem .8rem;font-weight:600;
  cursor:pointer;font-size:1.02rem;min-height:2.7rem}
.tile:hover{border-color:var(--accent)}
.slot{min-height:3.2rem;border:2px dashed var(--line);border-radius:12px;
  background:var(--surface2);padding:.5rem;display:flex;flex-wrap:wrap;gap:.45rem;
  align-items:center;direction:ltr}
.slot.ok{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.slot.bad{border-style:solid;border-color:var(--bad);background:var(--bad-soft)}
.slot .tile{background:var(--surface)}

/* ===== משוב ===== */
.fb{margin-top:.9rem;border-radius:12px;padding:.85rem 1rem;border:1px solid transparent}
.fb.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.fb.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.fb b{display:block;font-size:1.02rem;margin-bottom:.2rem}
.fb .body{color:var(--ink);font-weight:500;font-size:.95rem}
.why{margin-top:.55rem;padding-top:.55rem;border-top:1px dashed currentColor;color:var(--ink);
  font-weight:500;font-size:.93rem}

/* ===== קטע קריאה ===== */
.passage{background:var(--surface2);border-radius:12px;padding:1rem 1.1rem;margin:.6rem 0;
  font-family:var(--en);direction:ltr;unicode-bidi:isolate;font-size:1.08rem;line-height:2}
.passage .s{border-radius:5px;padding:.05em .12em;cursor:pointer}
.passage .s:hover{background:var(--accent-soft)}
.passage .s.now{background:var(--accent-soft);box-shadow:0 2px 0 var(--accent)}
.wd{border-radius:5px;padding:1px 3px}
.wd.hit{background:var(--hit);color:var(--hit-ink);font-weight:600}
/* כשמנוע הדיבור אינו מדווח על גבולות מילים — קורה הרבה בעברית
   באנדרואיד — אין מה להדגיש מילה־מילה, ואז מודגש כל האיבר. הכלל
   שקיים כאן מכוון למשפט בתוך קטע קריאה בלבד, ולכן ההדגשה החלופית
   על איבר אחר לא נראתה כלל. */
.wd.now,p.now,div.now,span.now,b.now{background:var(--hit);color:var(--hit-ink);
  border-radius:8px;box-shadow:0 0 0 4px var(--hit)}
.gloss{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.5rem}
.gword{border:1px solid var(--line);background:var(--surface);border-radius:999px;
  padding:.25rem .6rem;font-size:.85rem;cursor:pointer}
.gword b{font-family:var(--en);direction:ltr;unicode-bidi:isolate}

/* ===== סרגל מצב הקול ===== */
.vstrip{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;border-radius:10px;
  padding:.45rem .7rem;font-size:.85rem;font-weight:600;margin-bottom:.7rem}
.vstrip.ok{background:var(--ok-soft);color:var(--ok)}
.vstrip.warn{background:var(--warn-soft);color:var(--warn)}
.vstrip.bad{background:var(--bad-soft);color:var(--bad)}
.vstrip .btn{padding:.3rem .7rem;min-height:44px;font-size:.82rem}  /* 2.1rem היו 36 פיקסלים — מתחת ליעד המגע */

/* ===== הגדרות ===== */
.row{display:flex;align-items:center;justify-content:space-between;gap:.8rem;
  padding:.7rem 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row:last-child{border-bottom:0}
.row .lab{font-weight:700}
.row .desc{font-size:.85rem;color:var(--muted);font-weight:500}
.sw{width:3.2rem;height:1.8rem;border-radius:999px;background:var(--surface2);
  border:1px solid var(--line);position:relative;cursor:pointer;flex:none}
.sw i{position:absolute;top:.18rem;inset-inline-start:.2rem;width:1.3rem;height:1.3rem;
  border-radius:50%;background:var(--faint);transition:.15s}
.sw.on{background:var(--accent);border-color:var(--accent)}
.sw.on i{inset-inline-start:1.5rem;background:#fff}
.vgrid{display:grid;gap:.5rem;grid-template-columns:1fr}
@media(min-width:560px){.vgrid{grid-template-columns:1fr 1fr}}
.vopt{display:flex;align-items:center;gap:.6rem;border:2px solid var(--line);
  background:var(--surface);border-radius:12px;padding:.6rem .75rem;cursor:pointer;text-align:start}

.field{width:100%;box-sizing:border-box;font:inherit;font-size:1rem;
  min-height:48px;padding:12px 14px;border-radius:11px;outline:none;background:var(--surface2);color:inherit;border:1px solid var(--line)}

/* ---------- שורות המבחן ----------
   .tog הגיע ממודול המבחן שהועתק לכאן, ולא היה לו עיצוב כלל: השם
   והמידע שמתחתיו נדבקו לשורה אחת בלי רווח. */

/* יעד מגע לקישור התחתית. קישור טקסט בשורה יוצא בגובה הטקסט —
   15 פיקסלים — וזה קטן מדי לאצבע, גם כשהוא רק לתנאי השימוש. */

   .lvl יצא 39 פיקסלים ומתג ה-.sw רק 31, שניהם מתחת ל-44 שהפרויקט
   מחייב את עצמו בהם. במתג לא מגדילים את המסילה — היא תיראה מגושמת —
   אלא מרחיבים את שטח הלחיצה סביבה. */
.lvl{min-height:44px}
.sw{position:relative}

/* ---------- מסך בניית המבחן ----------

   כפתורי הבחירה יצאו 34 פיקסלים, וכרטיסי הנושאים 6 פיקסלים בלבד —

<script>
/* ============================================================
   מצב הדגמה — נכנס אך ורק דרך ?demo=1 בכתובת.
   ------------------------------------------------------------
   התסריט הוא נתון, לא קוד שפזור במסכים: כל פריט אומר מה נכתב
   בכתוביות (subtitle), מה נעשה על המסך (action) וכמה זמן הצופה
   נשאר עם המסך הזה (duration, באלפיות שנייה).

   ההדגמה מפעילה את האפליקציה האמיתית — היא לוחצת על אותם
   כפתורים שהמשתמש לוחץ עליהם. אין כאן מסך מזויף ואין תוכן
   שנכתב במיוחד להדגמה, ולכן היא גם לא יכולה להראות משהו
   שהאפליקציה לא באמת עושה.

   בלי ?demo=1 שום שורה כאן אינה רצה: המשתנים מוגדרים ונשארים
   בלי שימוש, לא נרשם אף מאזין אירועים, ולא נוסף דבר למסך.
   ============================================================ */
var DEMO_ON=/(^|[?&])demo=1(&|$)/.test(location.search||"");

/* בוחר אפשרות לפי נכונותה. התסריט לא מקודד תשובה: הוא שואל את
   השאלה שעל המסך עכשיו, ולכן הוא עובד גם כשההגרלה שינתה אותה. */
/* יש צורת שאלה אחת שאין בה מה להשמיע לפני שעונים. מגרילים
   שאלה אחרת במקום לדלג על הצעד: ההקראה היא כל העניין כאן. */
function demoHear(){
  for(var n=0;n<8&&!document.querySelector('[data-a="say"]');n++){
    try{newQuestion()}catch(e){break}
  }
  return demoTap('[data-a="say"]');
}
function demoPick(right){
  var q=(typeof P!=="undefined")?P.q:null;
  if(!q||!q.opts)return false;
  for(var i=0;i<q.opts.length;i++)
    if(!!q.opts[i].ok===!!right)return demoTap('[data-a="pick"][data-i="'+i+'"]');
  return false;
}

var DEMO_SCRIPT=[
  {subtitle:"לומדה — לימוד לפי נושא. פריטים, סיבות ותוצאות, עם מושגים, קטעי מקור ורמז בכל שאלה.",
   action:function(){if(typeof state!=="undefined"){view="";state.screen="home";P.q=null;render();window.scrollTo(0,0)}}, duration:4800},

  {subtitle:"הנושאים מסודרים במסלולים — מסלול לכל תחום.",
   action:function(){demoShow(".trk")}, duration:4400},

  {subtitle:"נכנסים לנושא.",

   action:function(){demoTap('[data-a="lvl"][data-v="2"]')}, duration:5000},

  {subtitle:"השאלה נקראת בקול, כולל קטע המקור שבתוכה.",

  {subtitle:"רמז אינו טעות ואינו נספר ככזו. מי שנעזר בו עדיין עונה בעצמו.",

  {subtitle:"עונים.",
   action:function(){demoPick(true)}, duration:4200},

  {subtitle:"המשוב מסביר את ההקשר — מה קרה, למה, ומה יצא מזה.",
   action:function(){}, duration:5000},

  {subtitle:"לשאלה הבאה.",

  {subtitle:"״לא יודע״ אינו דילוג: הוא נספר כטעות, ומיד מראה ומשמיע את התשובה.",

   action:function(){demoTap('[data-a="set"]')}, duration:4800},

  {subtitle:"וחזרה. בלי הרשמה, בלי פרסומות, והכול נשמר במכשיר הזה בלבד.",
   action:function(){demoTap('[data-a="home"]')}, duration:4400}
];

/* --- מנוע ההדגמה. הקוד כאן זהה בכל האפליקציות; רק DEMO_SCRIPT משתנה. --- */
var DEMO={on:false,i:0,timer:null,extra:[],bar:null,txt:null,step:null,fill:null,btn:null};

/* עוזרים לתסריט. כולם מחזירים false כשהאיבר אינו על המסך, כדי
   שצעד שלא מצא את מה שחיפש ידלג ולא יפיל את ההדגמה כולה. */
function demoEl(s){return typeof s==="string"?document.querySelector(s):s}
function demoShow(s){
  var e=demoEl(s); if(!e)return false;
  try{e.scrollIntoView({behavior:"smooth",block:"center"})}catch(err){try{e.scrollIntoView()}catch(err2){}}
  return true;
}
/* מדגיש את האיבר, ורק אז לוחץ — צופה שלא ראה לאן נלחץ לא הבין
   מה קרה. לכן אין צעד קצר מ-1200 אלפיות בתסריטים. */
function demoTap(s){
  var e=demoEl(s); if(!e||e.disabled)return false;
  demoShow(e);
  e.classList.add("demo-tap");
  DEMO.extra.push(setTimeout(function(){
    e.classList.remove("demo-tap");
    /* המסך מצטייר מחדש כל הזמן. אם האיבר שסומן כבר אינו במסמך,
       מחפשים אותו שוב לפי אותו בורר — לחיצה על איבר מת אינה
       עושה דבר, וזה בדיוק צעד שנראה כאילו נתקע. */
    var live=(typeof s==="string"&&!document.contains(e))?demoEl(s):e;
    if(DEMO.on&&live&&!live.disabled&&document.contains(live))try{live.click()}catch(err){}
  },430));
  return true;
}
function demoClick(s){
  var e=demoEl(s); if(!e||e.disabled)return false;
  try{e.click()}catch(err){return false}
  return true;
}
/* הקלדה אות אחר אות, עם אירוע input אמיתי — שדה חיפוש שמאזין
   ל-input לא היה מגיב להשמה ישירה ל-value. */
function demoType(s,text){
  var e=demoEl(s); if(!e)return false;
  demoShow(e); try{e.focus()}catch(err){}
  e.value=""; var i=0;
  var t=setInterval(function(){
    if(!DEMO.on||!e.parentNode){clearInterval(t);return}
    e.value=String(text).slice(0,++i);
    e.dispatchEvent(new Event("input",{bubbles:true}));
    if(i>=String(text).length)clearInterval(t);
  },85);
  DEMO.extra.push(t);
  return true;
}
function demoQuiet(){
  try{if(window.speechSynthesis)speechSynthesis.cancel()}catch(e){}
  try{if(typeof stopSpeak==="function")stopSpeak()}catch(e){}
}

function demoMountUI(){
  var st=document.createElement("style");
  st.id="demo-style"; st.textContent=DEMO_CSS;
  (document.head||document.documentElement).appendChild(st);

  var b=document.createElement("button");
  b.id="demo-start"; b.type="button";
  b.innerHTML='<span aria-hidden="true">▶</span><span>התחל הדגמה</span>';
  b.addEventListener("click",demoStart);
  document.body.appendChild(b);

  var bar=document.createElement("div");
  bar.id="demo-bar"; bar.hidden=true;
  bar.setAttribute("role","status");
  bar.setAttribute("aria-live","polite");
  bar.innerHTML='<div id="demo-sub"><p id="demo-txt"></p>'+
    '<div id="demo-meta"><span id="demo-step"></span>'+
    '<button id="demo-exit" type="button">יציאה · ESC</button></div>'+
    '<div id="demo-prog"><i></i></div></div>';
  document.body.appendChild(bar);

  DEMO.btn=b; DEMO.bar=bar;
  DEMO.txt=document.getElementById("demo-txt");
  DEMO.step=document.getElementById("demo-step");
  DEMO.fill=bar.querySelector("#demo-prog i");
  document.getElementById("demo-exit").addEventListener("click",function(){demoStop()});
  document.addEventListener("keydown",demoKey,true);
}

/* ESC יוצא. הקשבה בשלב הלכידה, כדי שמסך שכבר מטפל ב-Escape
   לא יבלע את המקש לפני שההדגמה ראתה אותו. */
function demoKey(e){
  if(!DEMO.on)return;
  if(e.key==="Escape"||e.keyCode===27){
    e.preventDefault(); e.stopPropagation();
    demoStop();
  }
}

function demoStart(){
  if(DEMO.on)return;
  DEMO.on=true; DEMO.i=0;
  DEMO.btn.hidden=true; DEMO.bar.hidden=false;
  document.documentElement.classList.add("demo-running");
  demoNext();
}

function demoNext(){
  if(!DEMO.on)return;
  if(DEMO.i>=DEMO_SCRIPT.length){demoStop();return}
  var it=DEMO_SCRIPT[DEMO.i++]||{};
  var d=Math.max(600,it.duration||3000);
  DEMO.txt.textContent=it.subtitle||"";
  DEMO.step.textContent=DEMO.i+" / "+DEMO_SCRIPT.length;
  DEMO.fill.style.transition="none"; DEMO.fill.style.width="0";
  void DEMO.fill.offsetWidth;
  DEMO.fill.style.transition="width "+d+"ms linear";
  DEMO.fill.style.width="100%";
  if(typeof it.action==="function"){
    try{it.action()}catch(err){if(window.console)console.warn("demo:",err)}
  }
  DEMO.timer=setTimeout(demoNext,d);
}

function demoStop(){
  DEMO.on=false;
  if(DEMO.timer){clearTimeout(DEMO.timer);DEMO.timer=null}
  DEMO.extra.forEach(function(t){clearTimeout(t);clearInterval(t)});
  DEMO.extra=[];
  var m=document.querySelectorAll(".demo-tap"),i;
  for(i=0;i<m.length;i++)m[i].classList.remove("demo-tap");
  if(DEMO.bar)DEMO.bar.hidden=true;
  if(DEMO.btn)DEMO.btn.hidden=false;
  document.documentElement.classList.remove("demo-running");
  demoQuiet();
}

/* שער התנאים הוא חלון מודאלי מעל הכול. כפתור הדגמה מתחתיו היה
   מפעיל אפליקציה שאי אפשר לראות, ולכן ממתינים שייסגר. */
function demoMount(){
  if(document.querySelector(".lg-wrap")){setTimeout(demoMount,500);return}
  if(!document.getElementById("demo-start"))demoMountUI();
}

if(DEMO_ON){
  if(document.readyState==="complete")setTimeout(demoMount,0);
  else window.addEventListener("load",function(){setTimeout(demoMount,0)});
}

function blankState(){
  return {
    lang:null,            /* נקבע לפי שפת הדפדפן בהפעלה הראשונה */
    screen:"home", topic:null, level:1,

    stats:{},             /* topic|level → {seen,ok,bad} */

    day:{d:"",n:0}, streak:0, lastDay:"", totalOk:0, totalAsk:0
  };
}
var state=blankState();

function load(){
  try{
    var raw=localStorage.getItem(SKEY); if(!raw)return;
    var o=JSON.parse(raw); if(!o||typeof o!=="object")return;
    Object.keys(blankState()).forEach(function(k){if(o[k]!==undefined)state[k]=o[k]});
  }catch(e){}
  if(!LANGS[state.lang])state.lang=guessLang();
  if(GEM_VOICES.every(function(v){return v.id!==state.gemVoice}))state.gemVoice="Kore";
  state.rate=clamp(Number(state.rate)||0.95,0.6,1.3);
}
function save(){try{localStorage.setItem(SKEY,JSON.stringify(state))}catch(e){}}

/* שפת הדפדפן, לא ברירת מחדל עברית. מי שפותח את האפליקציה במכשיר
   ברוסית לא אמור להיתקל קודם במסך בעברית שאינו יכול לקרוא. */
/* אנגלית אינה סימן. טלפון בישראל מדווח אנגלית כברירת מחדל של
   המכשיר, לא כבחירה, והאפליקציה נפתחה באנגלית למי שבא ללמוד
   בעברית. ערבית ורוסית כן נחשבות — שם זו שפת אם של ממש. מי
   שרוצה אנגלית בוחר אותה, והבחירה נשמרת. */
function guessLang(){
  var ls=(navigator.languages||[navigator.language||"he"]).map(function(x){
    return String(x).toLowerCase().split("-")[0]});
  for(var i=0;i<ls.length;i++){
    var c=ls[i]==="iw"?"he":ls[i];
    if(c==="en")continue;
    if(LANGS[c])return c;
  }
  return "he";
}
function touchDay(){
  var d=todayIso();
  if(state.day.d!==d){
    var y=new Date(Date.now()-86400000);
    var yi=y.getFullYear()+"-"+String(y.getMonth()+1).padStart(2,"0")+"-"+String(y.getDate()).padStart(2,"0");
    state.streak=(state.lastDay===yi)?(state.streak||0)+1:1;
    state.lastDay=d; state.day={d:d,n:0};
  }
}
function stKey(tid,lv){return tid+"|"+lv}
function stOf(tid,lv){
  var k=stKey(tid,lv);
  if(!state.stats[k])state.stats[k]={seen:0,ok:0,bad:0};
  return state.stats[k];
}
function mastery(tid,lv){
  var s=state.stats[stKey(tid,lv)];
  if(!s||!s.seen)return 0;
  return clamp(s.ok/Math.max(6,s.seen),0,1);
}
function barCls(m){return m>=.75?"b2":m>=.4?"b1":"b0"}

function voicesReady(){
  if(_voicesP)return _voicesP;

    }
    try{speechSynthesis.addEventListener("voiceschanged",finish)}catch(e){}

/* ------------------------------------------------------------
   פיצול לאמירות קצרות — הועתק מ"תאוריה מדברת", שם ההקראה נשמעת
   הכי טוב. מנועי מכשיר מאיצים ובולעים סופי מילים במשפט ארוך;
   כאן נשלחה שאלה שלמה באמירה אחת, לפעמים 300 תווים.
   כל מקטע נושא את ההיסט שלו במחרוזת המלאה, כי charIndex מתאפס
   בכל אמירה ובלעדיו ההדגשה קופצת לתחילת המשפט בכל מקטע.
   ------------------------------------------------------------ */
var SEG_MAX=90, SEG_GAP=260;
/* סימן פיסוק בין שתי ספרות הוא חלק מהמספר ולא מקום לחתוך בו:
   בלי הבדיקה הזאת "3,500" נשבר והמנוע קורא "שלוש, חמש מאות". */
function insideNumber(str,i){
  return i>0&&i+1<str.length&&/[0-9]/.test(str[i-1])&&/[0-9]/.test(str[i+1]);
}
function segments(spoken){
  var out=[],parts=[],from=0,i,j;
  function push(t,start){ if(String(t).trim())out.push({text:t,start:start}) }
  for(i=0;i<spoken.length;i++){
    if(".!?:;".indexOf(spoken[i])<0)continue;
    if(insideNumber(spoken,i))continue;
    j=i+1; while(j<spoken.length&&/\s/.test(spoken[j]))j++;
    parts.push({text:spoken.slice(from,j),start:from});
    from=j; i=j-1;
  }
  if(from<spoken.length)parts.push({text:spoken.slice(from),start:from});
  for(var k=0;k<parts.length;k++){
    var p=parts[k];
    if(p.text.length<=SEG_MAX){ push(p.text,p.start); continue }
    var rest=p.text,base=p.start;
    while(rest.length>SEG_MAX){
      var cut=rest.lastIndexOf(",",SEG_MAX);
      while(cut>0&&insideNumber(rest,cut))cut=rest.lastIndexOf(",",cut-1);
      if(cut<SEG_MAX*0.4)cut=rest.lastIndexOf(" ",SEG_MAX);
      if(cut<=0)break;
      push(rest.slice(0,cut+1),base);
      base+=cut+1; rest=rest.slice(cut+1);
    }
    push(rest,base);
  }
  /* מקטע זעיר — "12." או ")" — עם הפסקה של רבע שנייה אחריו נשמע
     כמו גמגום. מאחדים אותו לזה שאחריו. */
  var merged=[];
  for(i=0;i<out.length;i++){
    if(merged.length&&out[i].text.trim().length<12&&
       merged[merged.length-1].text.length+out[i].text.length<=SEG_MAX*1.4){
      merged[merged.length-1].text+=out[i].text; continue;
    }
    if(out[i].text.trim().length<12&&i+1<out.length){
      out[i+1]={text:out[i].text+out[i+1].text,start:out[i].start}; continue;
    }
    merged.push(out[i]);
  }
  out=merged;
  return out.length?out:[{text:spoken,start:0}];
}
/* קצב לפי שפה — אותם ערכים שנבחרו בתאוריה מדברת אחרי האזנה */
var VOICE_TUNE={he:0.82,ar:0.85,en:0.90,ru:0.88};
function tuneRate(lang,rate){
  var t=VOICE_TUNE[String(lang||"he").split("-")[0].toLowerCase()]||0.88;
  var r=t*(rate||1);
  return Math.max(0.5,Math.min(1.6,Math.round(r*100)/100));
}

   במקביל. מונה אחד פותר את זה: כל הקראה מקבלת מספר, stopSpeak

     שממתין לרשימת הקולות ועד ארבע שניות אם היא לא מגיעה — ואמירה
     שיוצאת ארבע שניות אחרי המגע נזרקת בשקט באנדרואיד ובספארי.
     כשהרשימה כבר כאן, בוחרים קול ומדברים. כשהיא ריקה — מדברים
     בכל זאת, עם u.lang בלבד: קול ברירת מחדל בשפה הנכונה עדיף על
     שתיקה, ויש מכשירים שמחזירים רשימה ריקה לצמיתות ומדברים היטב.
     voicesReady נשאר בשימוש למסך בחירת הקול, שם ההמתנה במקומה. */

    try{
      var v=bestVoice(code), lang=(v&&v.lang)||code;
      var segs=segments(String(text)), rt=tuneRate(lang,clamp(rate,0.55,1.4));
      var pit=femLift(v);

        u.onboundary=function(e){if(!e.name||e.name==="word")hlAt(seg.start+e.charIndex)};

     עם <sub> או <span class="frac"> הוקראה בקול כתגית: הסטודנט

  if(gemOn()){

  for(i=0;i<banks.length;i++){
    b=banks[i]||{}; tr=b.track||{};
    if(!tr.id||!b.topics||!b.topics.length)continue;
    if(hasTrack(tr.id))continue;                       /* אותו מזהה פעמיים — הראשון נשאר */
    TRACKS.push({id:tr.id,cls:tr.cls||TRACK_CLS[TRACKS.length%TRACK_CLS.length],
                 icon:tr.icon||"book",n:tr.n||{},d:tr.d||{}});
    for(j=0;j<b.topics.length;j++){
      tp=b.topics[j];
      if(!tp||!tp.id||!tp.L||!tp.L.length)continue;
      if(topicOf(tp.id))continue;
      TOPICS.push({id:tp.id,trk:tr.id,n:tp.n||{},d:tp.d||{},L:tp.L});
    }
  }
})();
/* ============================================================
   8. מנוע התרגילים
   ------------------------------------------------------------
   כלל אחד מנחה את כל הבנייה כאן: מסיח חייב להיות מסיח *סביר*.
   ארבע אפשרויות אקראיות מלמדות לנחש לפי אורך המשפט. ארבע
   אפשרויות מאותה תקופה מכריחות באמת לדעת, וזו כל התועלת.
   ============================================================ */
function itemId(tid,lv,i){return tid+"|"+lv+"|"+i}
function itemRec(id){
  if(!state.item[id])state.item[id]={n:0,ok:0};
  return state.item[id];
}
/* בחירת פריט: קודם מה שעוד לא נראה, אחר כך מה שנכשל, ורק בסוף
   מה שכבר נשלט. חזרה מרווחת פשוטה, בלי שעון ובלי נוסחה. */
function chooseIndex(tid,lv,pool,avoid){
  var cand=[],i,w;
  for(i=0;i<pool.length;i++){
    if(avoid!==undefined&&i===avoid&&pool.length>1)continue;
    var r=state.item[itemId(tid,lv,i)];
    if(!r||!r.n)w=6;                            /* חדש */
    else if(r.ok<r.n)w=1+Math.min(4,r.n-r.ok);  /* נכשל בעבר */
    else w=1;                                   /* נשלט */
    for(var j=0;j<w;j++)cand.push(i);
  }
  if(!cand.length)return 0;
  return pick(cand);
}
function poolOf(tp,lv){return (tp.L[lv-1]||tp.L[0]||[])}

/* שנה לתצוגה. שנה שלילית היא לפני הספירה, וזה נכתב במילים ולא
   במינוס — תלמיד שרואה "−450" לא יודע שמדובר בשנה. */
function yr(y){
  if(y<0)return String(-y)+" "+t("bce");
  if(y<1000)return String(y)+" "+t("ce");
  return String(y);
}
/* המאה של שנה. שנת 1789 היא המאה ה-18, ושנת 100 היא המאה ה-1. */
function centuryOf(y){
  var a=Math.abs(y);
  return Math.floor((a-1)/100)+1;
}
function centuryStr(y){
  return t("century")+" "+_rom(centuryOf(y))+(y<0?" "+t("bce"):"");
}
var ROM=["","I","II","III","IV","V","VI","VII","VIII","IX","X",
         "XI","XII","XIII","XIV","XV","XVI","XVII","XVIII","XIX","XX","XXI"];
function _rom(n){return ROM[n]||String(n)}
/* ------------------------------------------------------------
   שתי שכבות ניקוי להקראה בלבד. המסך אינו משתנה מהן.

   הספרה הרומית נראית נכון על המסך ונשמעת רע באוזן: קול עברי או
   ערבי מוסר "XVIII" כאותיות לטיניות ולא כמספר. ההשוואה היא מול
   ROM עצמו ולא מול תבנית, כדי שמילה לטינית בשם נושא לא תהפוך
   בטעות למספר.

   והגרשיים העבריים משמשים כאן לשני דברים: ראשי תיבות (לפנה״ס,
   או״ם) ומירכאות (״אדם חופשי״). המנוע מכיר רק את הראשון. הכלל
   שמפריד ביניהם: בראשי תיבות באה אחרי הגרשיים אות עברית אחת
   בדיוק וסוף מילה. הסיכון א-סימטרי — מירכאה שהוסרה אינה יכולה
   להזיק, מירכאה שנשארה כן.
   ------------------------------------------------------------ */
function saySpell(x){
  return String(x==null?"":x).replace(/[IVXLC]+/g,function(m){
    var i=ROM.indexOf(m);
    return i>0?String(i):m;
  }).replace(/״/g,function(m,i,str){
    return /^[\u05D0-\u05EA](?![\u05D0-\u05EA])/.test(str.slice(i+1))?m:"";
  }).replace(/\s—\s/g,", ");
}

/* כל האירועים מכל התוכן — משם נלקחים מסיחים כשהנושא עצמו קטן מדי,
   וגם תרגיל הסדר הכרונולוגי בין תקופות. */
var ALL_EV=null;
function allEvents(){
  if(ALL_EV)return ALL_EV;
  ALL_EV=[];
  TOPICS.forEach(function(tp){tp.L.forEach(function(lvl){
    lvl.forEach(function(it){if(it.k==="e")ALL_EV.push(it)})})});
  return ALL_EV;
}
var ALL_CON=null;
function allConcepts(){
  if(ALL_CON)return ALL_CON;
  ALL_CON=[];
  TOPICS.forEach(function(tp){tp.L.forEach(function(lvl){
    lvl.forEach(function(it){if(it.k==="c")ALL_CON.push(it)})})});
  return ALL_CON;
}
/* אירועים אחרים לפי קרבה בזמן. מסיח מאותה מאה הוא מסיח אמיתי;
   מסיח במרחק אלף שנה נפסל לפי התאריך ולא לפי הידע. */
function nearEvents(it,pool,n){
  var mine=pool.filter(function(x){return x.k==="e"&&x!==it});
  var rest=allEvents().filter(function(x){return x!==it&&mine.indexOf(x)<0});
  rest.sort(function(a,b){return Math.abs(a.y-it.y)-Math.abs(b.y-it.y)});
  return shuffle(mine).concat(rest).slice(0,Math.max(n,0));
}
function O(html,ok,why){return {h:html,ok:!!ok,why:why||""}}

/* בונה ארבע אפשרויות משדה אחד של פריט, ומוודא שאין שתיים זהות.
   שני אירועים יכולים לחלוק תוצאה מנוסחת דומה, ואז השאלה נשארת
   בלי תשובה יחידה — לכן הסינון כאן ולא בתצוגה.
   מועמד שנפסל מוחלף במועמד הבא ואינו מנוכה ממספר האפשרויות:
   שאלה עם שלוש אפשרויות היא ניחוש של אחד משלושה. אם גם רשימה
   רחבה לא הספיקה לארבע — מחזירים null, והקורא נופל לצורה אחרת
   במקום להציג שאלה חלשה יותר. */
function optsFromField(it,cands,field,n){
  var seen={},opts=[],own=gl(it[field]);
  if(!own)return null;
  seen[own]=1;
  opts.push(O(esc(own),true));
  for(var i=0;i<cands.length&&opts.length<n;i++){
    var v=gl(cands[i][field]);
    if(!v||seen[v])continue;
    seen[v]=1;
    opts.push(O(esc(v),false,evLabel(cands[i])));
  }
  return opts.length>=n?shuffle(opts):null;
}
function evLabel(x){
  if(x.k==="e")return gl(x.t)+" · "+yr(x.y);
  if(x.k==="c")return gl(x.t);
  return "";
}

/* --- צורה 1: מתי --- */
function formWhen(tp,lv,pool,idx){
  var it=pool[idx];
  var cands=nearEvents(it,pool,12);
  var seen={},opts=[O(esc(yr(it.y)),true)],i;
  seen[yr(it.y)]=1;
  for(i=0;i<cands.length&&opts.length<4;i++){
    var v=yr(cands[i].y);
    if(seen[v])continue; seen[v]=1;
    opts.push(O(esc(v),false,evLabel(cands[i])));
  }
  /* אם התקופה דלילה, מוסיפים הזזות סבירות ולא מספרים אקראיים */
  var off=shuffle([-200,-100,-50,-30,30,50,100,200]);
  for(i=0;i<off.length&&opts.length<4;i++){
    var y2=it.y+off[i];
    if(y2===0)continue;
    var s2=yr(y2);
    if(seen[s2])continue; seen[s2]=1;
    opts.push(O(esc(s2),false,""));
  }
  return {type:"fact",prompt:t("qWhen"),lead:gl(it.t),
    opts:shuffle(opts),answer:yr(it.y),
    /* השנה היא התשובה, ולכן היא חייבת להיאמר. קודם נאמרו רק
       הכותרת והתיאור — כלומר הכול חוץ ממה שנשאל. */
    say:gl(it.t)+", "+yr(it.y)+". "+gl(it.w),reveal:it};
}
/* --- צורה 2: מה קרה --- */
function formWhat(tp,lv,pool,idx){
  var it=pool[idx];
  var opts=optsFromField(it,nearEvents(it,pool,28),"w",4);
  if(!opts)return formWhen(tp,lv,pool,idx);
  return {type:"fact",prompt:t("qWhat"),lead:gl(it.t)+" · "+yr(it.y),
    opts:opts,answer:gl(it.w),say:gl(it.t)+". "+gl(it.w),reveal:it};
}
/* --- צורה 3: על איזה אירוע מדובר --- */
function formName(tp,lv,pool,idx){
  var it=pool[idx];
  var opts=optsFromField(it,nearEvents(it,pool,28),"t",4);
  if(!opts)return formWhen(tp,lv,pool,idx);
  return {type:"fact",prompt:t("qName"),lead:gl(it.w),
    opts:opts,answer:gl(it.t),
    /* שם האירוע הוא התשובה. בלעדיו נשמע רק התיאור שכבר הופיע בשאלה. */
    say:gl(it.t)+". "+gl(it.w),reveal:it};
}
/* --- צורה 4: סיבה --- */
function formWhy(tp,lv,pool,idx){
  var it=pool[idx];
  var opts=optsFromField(it,nearEvents(it,pool,28),"c",4);
  if(!opts)return formWhat(tp,lv,pool,idx);
  return {type:"fact",prompt:t("qWhy"),lead:gl(it.t)+" · "+yr(it.y),
    opts:opts,answer:gl(it.c),say:gl(it.t)+". "+gl(it.c),reveal:it};
}
/* --- צורה 5: תוצאה --- */
function formEff(tp,lv,pool,idx){
  var it=pool[idx];
  var opts=optsFromField(it,nearEvents(it,pool,28),"e",4);
  if(!opts)return formWhat(tp,lv,pool,idx);
  return {type:"fact",prompt:t("qEff"),lead:gl(it.t)+" · "+yr(it.y),
    opts:opts,answer:gl(it.e),say:gl(it.t)+". "+gl(it.e),reveal:it};
}
/* --- צורה 6: מה קרה קודם --- */
function formFirst(tp,lv,pool,idx){
  var it=pool[idx];
  /* שנים חוזרות הופכות את השאלה לחסרת תשובה יחידה, וכך גם שני
     אירועים שכותרתם מנוסחת אותו דבר. קודם נבחרו שלושה מועמדים
     ורק אחר כך נפסלו הכפולים — ומי שנפסל פשוט נעלם, כך שהשאלה
     הוצגה עם שלוש אפשרויות. כאן עוברים על רשימה רחבה ומקבלים
     מועמד רק אם הוא מוסיף שנה חדשה, עד שיש ארבעה.
     שנים־עשר הקרובים בזמן מעורבבים ומשמשים ראשונים — מסיח מאותה
     תקופה נפסל לפי הידע ולא לפי התאריך; השאר ממשיכים אחריהם
     לפי קרבה בזמן, רק אם צריך. */
  var all=nearEvents(it,pool,40).filter(function(x){return x.y!==it.y});
  var cands=shuffle(all.slice(0,12)).concat(all.slice(12));
  var seenY={},seenT={},uniq=[it],i,x,xt;
  seenY[it.y]=1; seenT[gl(it.t)]=1;
  for(i=0;i<cands.length&&uniq.length<4;i++){
    x=cands[i]; xt=gl(x.t);
    if(seenY[x.y]||!xt||seenT[xt])continue;
    seenY[x.y]=1; seenT[xt]=1; uniq.push(x);
  }
  if(uniq.length<4)return formWhen(tp,lv,pool,idx);
  var first=uniq.slice().sort(function(a,b){return a.y-b.y})[0];
  var opts=uniq.map(function(x){
    return O(esc(gl(x.t)),x===first,x===first?"":gl(x.t)+" · "+yr(x.y));
  });
  return {type:"fact",prompt:t("qFirst"),lead:"",
    opts:shuffle(opts),answer:gl(first.t),
    say:gl(first.t)+". "+yr(first.y),reveal:first};
}
/* --- צורה 7: מושג --- */
function formTerm(tp,lv,pool,idx){
  var it=pool[idx];
  var cands=shuffle(pool.filter(function(x){return x.k==="c"&&x!==it}))
    .concat(shuffle(allConcepts().filter(function(x){return x!==it})));
  var opts=optsFromField(it,cands,"d",4);
  if(!opts)return null;
  return {type:"fact",prompt:t("qTerm"),lead:gl(it.t),
    opts:opts,answer:gl(it.d),say:gl(it.t)+". "+gl(it.d),reveal:it};
}
/* --- צורה 8: מקור --- */
function formSrc(tp,lv,pool,idx){
  var it=pool[idx];
  var qq=pick(it.qs);
  var opts=[O(esc(gl(qq.a)),true)],ys=qq.y||[];
  /* לכל מסיח יש נימוק משלו: מה בדיוק במקור סותר אותו. y||[] שומר
     על קריאות Q ישנות שעדיין אין בהן נימוקים. */
  qq.w.forEach(function(x,i){opts.push(O(esc(gl(x)),false,ys[i]?gl(ys[i]):""))});
  return {type:"src",prompt:t("qRead"),passage:it,qtext:gl(qq.q),
    opts:shuffle(opts),answer:gl(qq.a),
    /* הקטע עצמו כבר מוקרא בכפתור נפרד מעל הפסקה. אחרי המענה
       מה שצריך להישמע הוא השאלה והתשובה עליה. */
    say:gl(qq.q)+" "+gl(qq.a),reveal:null};
}

/* בוחר את צורת התרגיל. הרמה קובעת מה נשאל: ברמה 1 האירוע עצמו,
   ברמה 2 הקשר שבין אירועים, וברמה 3 מקור ומושג. */
/* הרמז נותן תכונה אחרת מזו שנשאלה: לשאלת שנה — המאה, ולשאלה על
   טקסט — השנה. הוא נגזר מהשאלה שחזרה בפועל ולא מהצורה שביקשנו,
   כי formName נופלת חזרה ל-formWhen כשאין די מסיחים — ורמז לפי
   הצורה המבוקשת היה מוסר שם את התשובה. */
function hintFor(q,tp){
  if(!q)return "";
  if(q.type==="src")return t("hintSrcL");
  if(q.prompt===t("qFirst"))return t("hintOrderL");
  var it=q.reveal;
  if(!it||typeof it.y!=="number")return t("hintTopicL")+": "+tName(tp);
  if(q.answer===yr(it.y))return centuryStr(it.y);
  return t("hintYearL")+": "+yr(it.y);
}
function buildQuestion(tid,lv,avoid){
  var tp=topicOf(tid); if(!tp)return null;
  var pool=poolOf(tp,lv);
  if(!pool.length)return null;
  var idx=chooseIndex(tid,lv,pool,avoid);
  var it=pool[idx],q=null,f;
  if(it.k==="p")q=formSrc(tp,lv,pool,idx);
  else if(it.k==="c")q=formTerm(tp,lv,pool,idx);
  else {
    var forms=lv===1?["when","what","name"]
             :lv===2?["why","eff","first","what"]
                    :["why","eff","first","when","name"];
    f=pick(forms);
    q=f==="when"?formWhen(tp,lv,pool,idx)
     :f==="what"?formWhat(tp,lv,pool,idx)
     :f==="name"?formName(tp,lv,pool,idx)
     :f==="why" ?formWhy(tp,lv,pool,idx)
     :f==="eff" ?formEff(tp,lv,pool,idx)
                :formFirst(tp,lv,pool,idx);
  }
  if(!q)q=formWhen(tp,lv,pool,idx);
  q.tid=tid; q.lv=lv; q.idx=idx; q.id=itemId(tid,lv,idx);
  q.hint=hintFor(q,tp);
  return q;
}

/* כרטיס הנושא: מה שמוצג מעל האפשרויות. בהיסטוריה זו כותרת
   האירוע או המושג, ולצידה כפתורי השמעה בשפת הממשק. */
function leadBox(txt,sub){
  if(!txt)return "";
  return '<div class="subject"><span class="word" style="font-size:1.15rem">'+esc(txt)+"</span>"+
    (sub?'<span class="ipa">'+esc(sub)+"</span>":"")+
    '<span style="margin-inline-start:auto;display:flex;gap:.4rem">'+
    spkBtn(txt,state.lang,false,t("hearWord"))+spkBtn(txt,state.lang,true,t("hearSlow"))+"</span></div>";
}

function screenPractice(){
  var tp=topicOf(state.topic); if(!tp){state.screen="home";return screenHome()}
  var tr=trackOf(tp.trk), q=P.q;
  var h='<div class="wrap"><div class="trk '+tr.cls+'">';
  h+='<div style="display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin:1rem 0 .6rem">'+
     '<span class="tdot"></span><h2 style="font-size:1.2rem">'+esc(tName(tp))+"</h2>"+
     '<span class="tpill">'+esc(trName(tr))+"</span></div>";
  h+=levelBar(tp);
  h+='<p style="color:var(--muted);font-size:.88rem;margin:.5rem 0 .8rem">'+esc(t("lv"+state.level+"D"))+"</p>";
  h+=vstrip();
  if(!q)return h+"</div></div>"+fbar();

  h+='<div class="card qcard">';
  h+='<div class="qtop"><span class="chip">'+esc(q.prompt)+"</span>"+
     '<span class="chip" style="margin-inline-start:auto">'+esc(t("todayL"))+" "+(state.day.n||0)+"</span></div>";

  if(q.type==="src"){
    var lines=gl(q.passage.lines)||[];
    var full=lines.join(" ");
    h+='<div style="display:flex;gap:.4rem;margin-bottom:.4rem">'+
       '<span class="chip">'+esc(t("source"))+"</span>"+
       '<span style="margin-inline-start:auto;display:flex;gap:.4rem">'+
       spkBtn(full,state.lang,false,t("hearSent"))+
       spkBtn(full,state.lang,true,t("hearSlow"))+"</span></div>";
    h+='<div class="passage">';
    lines.forEach(function(ln){
      h+='<span class="s" data-a="sayline" data-say="'+esc(ln)+'">'+esc(ln)+"</span> ";
    });
    h+="</div>";
    h+='<p class="qtext">'+esc(q.qtext)+"</p>";
  }
  else {
    h+=leadBox(q.lead||"");
  }

  {
    h+='<div class="opts'+(q.opts.length>3?"":" two")+'" id="opts">';
    q.opts.forEach(function(o,i){
      var cls="opt";
      if(P.done){
        if(o.ok)cls+=" ok";
        else if(i===P.picked)cls+=" bad";
        else cls+=" dim";
      }
      h+='<button class="'+cls+'" data-a="pick" data-i="'+i+'"'+(P.done?" disabled":"")+'>'+
        '<span class="k">'+String.fromCharCode(65+i)+"</span><span>"+o.h+"</span></button>";
    });
    h+="</div>";
  }

  if(P.done){
    var it=q.reveal;
    h+='<div class="fb '+(P.ok?"ok":"bad")+'"><b>'+(P.ok?esc(t("correct")):esc(t("wrong")))+"</b>";
    if(!P.ok)h+='<div class="body">'+esc(t("answerIs"))+" <b>"+esc(q.answer)+"</b></div>";
    /* הכרטיס המלא של האירוע. תשובה נכונה בלי הקשר נשכחת מיד —
       כאן רואים גם את הסיבה וגם את התוצאה, בכל פעם מחדש. */
    if(it&&it.k==="e")h+='<div class="why"><b>'+esc(gl(it.t))+"</b> · "+esc(yr(it.y))+
      " · "+esc(centuryStr(it.y))+"<br>"+esc(gl(it.w))+
      '<br><b>'+esc(t("causeW"))+":</b> "+esc(gl(it.c))+
      '<br><b>'+esc(t("effectW"))+":</b> "+esc(gl(it.e))+"</div>";
    if(it&&it.k==="c")h+='<div class="why"><b>'+esc(gl(it.t))+"</b> — "+esc(gl(it.d))+"</div>";
    if(!P.ok&&P.picked>=0&&q.opts&&q.opts[P.picked]&&q.opts[P.picked].why)
      h+='<div class="why">'+esc(q.opts[P.picked].why)+"</div>";
    h+="</div>";
    h+='<div style="display:flex;gap:.5rem;margin-top:.9rem;flex-wrap:wrap">'+
       spkBtn(saySpell(q.say),state.lang,false,t("hearSent"))+spkBtn(saySpell(q.say),state.lang,true,t("hearSlow"))+
       '<button class="btn pri" data-a="next" style="margin-inline-start:auto">'+
       esc(t("next"))+" "+ic("arrow",16)+"</button></div>";
  } else {
    h+='<div style="display:flex;gap:.5rem;margin-top:.9rem;flex-wrap:wrap">'+
       (P.hint?"":'<button class="btn ghost" data-a="hint">'+esc(t("hintB"))+"</button>")+
       '<button class="btn ghost" data-a="dunno">'+esc(t("dunno"))+"</button></div>";
    if(P.hint&&q.hint)h+='<div class="qhint" style="margin-top:.6rem">'+esc(q.hint)+"</div>";
  }
  h+="</div></div></div>"+fbar();
  return h;
}

function screenProg(){
  var h='<div class="wrap"><h2 style="margin:1.1rem 0 .3rem;font-size:1.4rem">'+esc(t("progT"))+"</h2>";
  var acc=state.totalAsk?Math.round(100*state.totalOk/state.totalAsk):0;
  var seen=0,mast=0;
  TOPICS.forEach(function(tp){for(var l=1;l<=3;l++){
    var s=state.stats[stKey(tp.id,l)];
    if(s&&s.seen){seen++;if(mastery(tp.id,l)>=.75)mast++}}});
  h+='<div class="grid g3" style="margin:.8rem 0 1.2rem">';
  [[t("streakL"),state.streak||0],[t("todayL"),state.day.n||0],[t("accL"),acc+"%"]].forEach(function(p){
    h+='<div class="card" style="text-align:center"><div style="font-size:1.9rem;font-weight:800">'+
      esc(String(p[1]))+'</div><div style="color:var(--muted);font-size:.9rem">'+esc(p[0])+"</div></div>";
  });
  h+="</div>";
  if(!state.totalAsk)h+='<div class="card"><p style="margin:0;color:var(--muted)">'+esc(t("progNone"))+"</p></div>";
  TRACKS.forEach(function(tr){
    var tops=TOPICS.filter(function(x){return x.trk===tr.id&&
      [1,2,3].some(function(l){var s=state.stats[stKey(x.id,l)];return s&&s.seen})});
    if(!tops.length)return;
    h+='<div class="trk '+tr.cls+'"><div class="thead" style="margin:1.2rem 0 .5rem">'+
       '<span class="tdot"></span><h3 style="font-size:1.05rem">'+esc(trName(tr))+"</h3></div>";
    h+='<div class="card">';
    tops.forEach(function(tp){
      h+='<div class="row"><div><div class="lab">'+esc(tName(tp))+"</div>"+
        '<div class="desc">';
      for(var l=1;l<=3;l++){
        var s=state.stats[stKey(tp.id,l)];
        if(s&&s.seen)h+=esc(t("lv"+l))+" "+s.ok+"/"+s.seen+"   ";
      }
      h+="</div></div>";
      var best=Math.max(mastery(tp.id,1),mastery(tp.id,2),mastery(tp.id,3));
      h+='<span class="bar '+barCls(best)+'" style="max-width:8rem"><i style="width:'+
        Math.round(best*100)+'%"></i></span></div>';
    });
    h+="</div></div>";
  });
  h+='<p style="color:var(--muted);font-size:.9rem;margin-top:1rem">'+esc(t("seen"))+": "+seen+
     " · "+esc(t("mastered"))+": "+mast+"</p>";
  return h+"</div>"+fbar();
}

/* ==== כותרת תחתונה וקישור הדילוג בשפת הממשק ====
   שניהם HTML סטטי שאינו עובר דרך render, ולכן נשארו עבריים בכל שפה. */
var LGFOOT={he:"© 2026 יהושע לגשטיין",ar:"© 2026 يهوشع لچشطاين",ru:"© 2026 Иехошуа Лагштейн",en:"© 2026 Joshua Lagstein"};
var LGTERMS={he:"תנאי שימוש וזכויות יוצרים",ar:"شروط الاستخدام وحقوق النشر",ru:"Условия использования и авторские права",en:"Terms of use and copyright"};
var LGSKIP={he:"דילוג לתוכן",ar:"تخطّي إلى المحتوى",ru:"Перейти к содержимому",en:"Skip to content"};
function lgChrome(){
  var g="he"; try{ g=state.lang||"he" }catch(e){}
  if(!LGFOOT[g])g="he";
  var dir=(g==="ru"||g==="en")?"ltr":"rtl";
  var f=document.querySelector("footer.lg-foot");
  if(f){
    f.setAttribute("lang",g); f.setAttribute("dir",dir);
    f.textContent="";
    f.appendChild(document.createTextNode(LGFOOT[g]+" · "));
    var a=document.createElement("a");
    a.href="/legal/"; a.style.color="inherit"; a.textContent=LGTERMS[g];
    f.appendChild(a);
  }
  var s=document.querySelector("a.skip[href='#main']");
  if(s){ s.setAttribute("lang",g); s.setAttribute("dir",dir); s.textContent=LGSKIP[g] }
}

/* בחירת שפה מתוך שער התנאים — הוא נפתח לפני שיש בכלל גישה להגדרות. */
window.addEventListener("legal:lang",function(e){
  var k=e&&e.detail; if(!k)return;
  try{ state.lang=k;save();render(); }catch(err){}
});

function render(){ try{lgChrome()}catch(e){}
  applyModes();
  lvlSync();
  /* מבחן שהגיע מקישור עוקף הכול, כולל מסך הפתיחה: מי שנכנס
     להיבחן לא בהכרח פתח את האפליקציה הזאת אי פעם. */
  if(view==="sit"&&SIT.spec){ $("#app").innerHTML=viewSit(); return; }
  if(view==="badexam"||view==="oldexam"){
    $("#app").innerHTML=viewBadExam(view==="oldexam"?
      xt("exOld"):xt("exBroken"));
    return;
  }
  if(view==="exam"||view==="marks"){
    $("#app").innerHTML=hdr()+(!teOpen()?viewLocked():(view==="exam"?viewExamNew():viewMarks()));
    return;
  }
  var body=state.screen==="prog"?screenProg():
           state.screen==="set" ?screenSet():
           state.screen==="prac"?screenPractice():screenHome();
  $("#app").innerHTML=hdr()+body;
}

/* ============================================================
   מתאם למסכי המבחן
   ------------------------------------------------------------
   מסכי המבחן נכתבו לאפליקציות המתמטיקה. שם השאלה נראית אחרת —
   ask, options, topicName — וכאן היא prompt, lead ו-opts. גם
   הניווט שונה: שם משתנה view, וכאן state.screen. ההמרה נעשית
   כאן, במקום אחד, ולא בפיזור תנאים בתוך המסכים.
   ============================================================ */
var view="";   /* מסכי המבחן בלבד. שאר האפליקציה מנווטת ב-state.screen. */
/* שמות הרמות כבר מתורגמים באפליקציה (lv1..lv3). המסכים קוראים
   LVL[i] וגם LVL.map, ולכן זה חייב להיות מערך אמיתי — ומכיוון
   שהוא מערך, הוא מתרענן בכל ציור מסך, אחרת החלפת שפה לא הייתה
   משנה את מה שכתוב במבחן. */
var LVL=["","",""];
function lvlSync(){LVL[0]=t("lv1");LVL[1]=t("lv2");LVL[2]=t("lv3")}
var LVL_C=["var(--c-sound)","var(--c-words)","var(--c-talk)"];
/* מסכי המבחן שואלים אם ההקראה פעילה. באפליקציה הזאת אין מתג כזה —
   ההקראה זמינה תמיד דרך כפתורי ההשמעה — ולכן התשובה קבועה. */
if(!state.settings)state.settings={tts:true};
/* לא לכל אפליקציה יש דף נוסחאות. מקטע המבחן הגיע מאפליקציה שיש
   בה אחד, והציע אותו גם כאן — כפתור שמוביל למסך שאינו קיים. */
var HAS_FORMULAS=(typeof viewFormulas==="function");
function topicById(id){return topicOf(id)}
/* אין track ב-blankState של האפליקציה הזאת, ולכן בכניסה הראשונה
   הוא undefined ורשימת הנושאים הייתה יוצאת ריקה. נופלים למסלול
   הראשון במקום להציג מסך בלי כלום. */
function topicsForTrack(trk){
  if(!trk)trk=(TRACKS[0]||{}).id;
  return TOPICS.filter(function(x){return x.trk===trk});
}
function topicCls(id){var tp=topicOf(id);return tp?trackOf(tp.trk).cls:""}
function areaCls(id){return topicCls(id)}
/* טקסט נקי מתוך HTML — המסכים משווים ומדווחים תשובות כטקסט. */
function plainOf(h){
  var d=document.createElement("div"); d.innerHTML=String(h||"");
  return (d.textContent||"").replace(/\s+/g," ").trim();
}
function buildQ(tid,lv){
  var q=buildQuestion(tid,lv,undefined); if(!q)return null;
  var tp=topicOf(tid);
  /* שאלה על מקור נושאת את הקטע עצמו. בלעדיו אי אפשר לענות עליה,
     והמבחן היה מציג שאלה בלי מה שהיא שואלת עליו. */
  var expr="";
  if(q.type==="src"&&q.passage){
    var lines=gl(q.passage.lines)||[];
    expr='<div class="passage">'+lines.map(function(l){
      return '<div class="s">'+esc(l)+"</div>"}).join("")+"</div>";
  }
  var lead=q.type==="src"?(q.qtext||""):(q.lead||"");
  var ask=esc(q.prompt||"")+(lead?' <b>'+esc(lead)+"</b>":"");
  return {topic:tid, topicName:tp?tName(tp):"", ask:ask, expr:expr, fig:"",
          options:(q.opts||[]).map(function(o){
            return {h:o.h,t:plainOf(o.h),ok:!!o.ok,why:o.why||""}}),
          say:q.say||"", hint:q.hint||""};
}


/* ============================================================
   18. מבחן כיתתי — פרסום בוואטסאפ, קבלת תשובות וציונים
   ------------------------------------------------------------
   אין שרת, ואין כוונה שיהיה. לכן המבחן אינו נשלח לשום מקום:
   הוא *נארז לתוך הקישור*. המורה מקבל קישור, שולח אותו בוואטסאפ,
   והמכשיר של התלמיד בונה מהקישור בדיוק את אותן שאלות.

   מה שהופך את זה לאפשרי הוא שכל מחולל שאלות כאן משתמש ב-
   Math.random בלבד. אם מזרעים אותו, אותו זרע מייצר את אותן
   שאלות ואת אותו סדר תשובות — אצל המורה ואצל התלמיד. הקישור

/* --- מחולל מזורע. mulberry32: קצר, מהיר, ופיזור טוב דיו --- */
function withSeed(seed,fn){
  var real=Math.random,s=(seed>>>0)||1;
  Math.random=function(){
    s|=0; s=s+0x6D2B79F5|0;
    var t=Math.imul(s^s>>>15,1|s);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;

}
function hash32(str){
  var h=0x811c9dc5,i;
  for(i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193)}
  return (h>>>0);

/* base64url. הניקוי בפענוח אינו קוסמטי: וואטסאפ שובר מחרוזות
   ארוכות בשורות, ורווח אחד הורס את כל הקוד. */
function b64e(str){
  var bytes=new TextEncoder().encode(str),bin="",i;
  for(i=0;i<bytes.length;i+=8192)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));
  return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function b64d(s){
  s=String(s||"").replace(/[^A-Za-z0-9\-_]/g,"").replace(/-/g,"+").replace(/_/g,"/");
  while(s.length%4)s+="=";
  var bin=atob(s),bytes=new Uint8Array(bin.length),i;
  for(i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

   שכבר נקלטו אליו מתייתמות. */

function examQuestions(spec){
  /* מסננים נושאים שאינם מוכרים לאפליקציה הזאת, בדיוק כמו decodeExam.
     בלי הסינון buildQ מחזיר null על נושא זר, והמסך נופל על
     q.topic של null. עדיף לדלג בשקט מאשר להתרסק. */
  var pairs=(spec.q||[]).filter(function(x){return !!topicById(x[0])});
  /* מבחן שנבנה עם זרע לכל משבצת נבנה משבצת אחרי משבצת, וכל
     שאלה תלויה בזרע שלה בלבד — כך המורה יכול להחליף אחת מהן.
     מבחן ישן, בלי זרעים, חייב להיבנות בדיוק כפי שנבנה ביום

  if(pairs.length&&pairs.every(function(x){return typeof x[2]==="number"}))

                .filter(function(q){return !!q});

   ומשותף, כפי שהיה עד כאן, החלפה של השאלה השלישית הייתה משנה

   הן הרבה מעבר למה שהמחולל עצמו יודע לייצר. */
function exNewSeed(){return (Math.random()*16777215)>>>0}
function exSlot(topicId,level){return [topicId,level,exNewSeed()]}
/* אותו זרע → אותה שאלה בדיוק: אצל המורה כשהוא בוחר, ואצל
   התלמיד כשהוא נבחן. */
function exBuildSlot(slot){

    if(Object.keys(EXQCACHE).length>400)EXQCACHE={};

   שסימן, לא כמה הוא קיבל. */
function gradeResult(spec,res){

/* ------------------------------------------------------------
   ייצוא CSV של ההגשות.
   העתקת הטבלה נותנת טקסט מופרד בטאבים — נוח להדבקה, אבל לא קובץ.
   מורה שרוצה למיין, לסנן או לחשב ממוצע צריך גיליון. שורה לכל תלמיד,
   ועמודה לכל שאלה, כדי שאפשר יהיה לראות מיד באיזו שאלה נפלה הכיתה.
   ה-BOM בהתחלה הוא מה שגורם לאקסל לקרוא עברית, ערבית ורוסית נכון
   במקום ג׳יבריש — בלעדיו הקובץ נפתח שבור בדיוק אצל מי שצריך אותו.
   ------------------------------------------------------------ */
function csvCell(v){
  var s=(v===undefined||v===null)?"":String(v);
  return /[",\n\r;\t]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function csvRow(a){ return a.map(csvCell).join(",") }
/* ============================================================

   ילד יכול למחוק מבחן, לראות ציונים של חברים, או לפתוח מבחן
   ולראות מראש את השאלות.
   זו אינה אבטחה, ואסור להציג אותה ככזאת: מי שיודע לפתוח כלי
   פיתוח יעקוף אותה בשנייה. זו נעילה מפני יד סקרנית — בדיוק מה
   שצריך כאן, ולא יותר.
   כל עוד לא נבחר קוד, שום דבר לא משתנה והמסכים גלויים כתמיד.

/* גיבוב חלש כגיבוי בלבד. SubtleCrypto קיים בכל דפדפן מודרני
   בהקשר מאובטח, ו-GitHub Pages הוא כזה. */
function teWeak(s){var h=5381,i;for(i=0;i<s.length;i++)h=((h*33)^s.charCodeAt(i))>>>0;return "w"+h.toString(16)}
function teHash(pin,salt,cb){
  var msg=salt+"|"+pin;
  try{
    if(window.crypto&&crypto.subtle&&crypto.subtle.digest&&window.TextEncoder){
      crypto.subtle.digest("SHA-256",new TextEncoder().encode(msg)).then(function(d){
        var a=Array.prototype.slice.call(new Uint8Array(d));
        cb(a.map(function(b){return ("0"+b.toString(16)).slice(-2)}).join(""));
      },function(){cb(teWeak(msg))});
      return;
    }
  }catch(e){}
  cb(teWeak(msg));
}
function teSalt(){
  var s="";
  try{
    var a=new Uint8Array(8);crypto.getRandomValues(a);
    s=Array.prototype.slice.call(a).map(function(b){return ("0"+b.toString(16)).slice(-2)}).join("");
  }catch(e){ s=String(Date.now())+Math.random().toString(36).slice(2) }
  return s;
}
/* השהיה אחרי ניסיונות כושלים. ארבע ספרות הן עשרת אלפים
   אפשרויות, וילד סבלני יכול לנסות הרבה. */
function teWait(){
  var r=teRead();if(!r||!r.bad||r.bad<3)return 0;
  var pen=Math.min(300,Math.pow(2,r.bad-3)*5)*1000;
  var left=Math.ceil(((r.badAt||0)+pen-Date.now())/1000);
  return left>0?left:0;
}

    (setting?'<label class="te-lab" for="te-pin2">'+esc(xt("teAgain"))+'</label>'+
      '<input id="te-pin2" class="te-in" type="password" inputmode="numeric" '+
      'autocomplete="off" maxlength="8" dir="ltr">':'')+
    '<label class="te-chk"><input type="checkbox" id="te-rem"> '+esc(xt("teRemember"))+'</label>'+
    '<p class="te-note">'+esc(xt("teRememberNote"))+'</p>'+
    (TE.msg?'<p class="te-msg" role="alert">'+esc(TE.msg)+'</p>':'')+
    (wait?'<p class="te-msg" role="alert">'+esc(xf("teWaitN",wait))+'</p>':'')+
    '<div class="te-row">'+
      '<button class="te-btn pri" id="te-ok"'+(wait?' disabled':'')+'>'+esc(xt("teOk"))+'</button>'+
      '<button class="te-btn" id="te-no">'+esc(xt("teCancel"))+'</button>'+
    '</div>'+
    (!setting&&teHas()?'<button class="te-btn link" id="te-forgot">'+esc(xt("teForgot"))+'</button>':'')+
    '</div>';
  document.body.appendChild(w);
  var box=w.firstChild, pin=document.getElementById("te-pin");
  box.focus(); if(pin&&!wait)pin.focus();
  /* מלכודת פוקוס, כמו בשער התנאים */
  w.addEventListener("keydown",function(e){
    if(e.key==="Escape"){teClose();return}
    if(e.key==="Enter"){e.preventDefault();teSubmit();return}
    if(e.key!=="Tab")return;
    var f=box.querySelectorAll("button:not([disabled]),input");
    if(!f.length)return;
    var a=f[0],z=f[f.length-1];
    if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}
    else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}
  });
  document.getElementById("te-no").onclick=teClose;
  document.getElementById("te-ok").onclick=teSubmit;
  var fg=document.getElementById("te-forgot");
  if(fg)fg.onclick=function(){ TE.msg=xt("teForgotHow"); teDialog() };
}
function teClose(){ TE.ask=false; TE.mode=""; TE.msg=""; teDialog(); }
function teSubmit(){
  if(TE.busy)return;
  var setting=(TE.mode==="set"||TE.mode==="change"||!teHas());
  var pin=(document.getElementById("te-pin")||{}).value||"";
  var rem=!!(document.getElementById("te-rem")||{}).checked;
  if(!/^[0-9]{4,8}$/.test(pin)){TE.msg=xt("teShort");teDialog();return}
  if(setting){
    var p2=(document.getElementById("te-pin2")||{}).value||"";
    if(pin!==p2){TE.msg=xt("teMismatch");teDialog();return}
    var salt=teSalt();
    TE.busy=true;
    teHash(pin,salt,function(h){
      TE.busy=false;
      teWrite({h:h,s:salt,bad:0,badAt:0});
      teSetOpen(true,rem);
      TE.ask=false;TE.mode="";TE.msg="";
      teDialog(); render();
    });
    return;
  }
  if(teWait()){teDialog();return}
  var rec=teRead(); if(!rec){teClose();return}
  TE.busy=true;
  teHash(pin,rec.s,function(h){
    TE.busy=false;
    if(h===rec.h){
      rec.bad=0;rec.badAt=0;teWrite(rec);
      teSetOpen(true,rem);
      TE.ask=false;TE.mode="";TE.msg="";
      teDialog(); render();
    }else{
      rec.bad=(rec.bad||0)+1;rec.badAt=Date.now();teWrite(rec);
      TE.msg=xt("teBad"); teDialog();
    }
  });
}
function teAsk(mode){ TE.ask=true; TE.mode=mode||""; TE.msg=""; teDialog() }
function teLock(){ teSetOpen(false); render() }
function teRemove(){ teWrite(null); teSetOpen(false); render() }
/* נעילה אוטומטית אחרי שהאפליקציה הייתה מוסתרת זמן־מה.
   מורה שבנה מבחן ומסר את הטאבלט בלי ללחוץ "יציאה" השאיר אותו
   פתוח, וזה בדיוק המצב שהתכונה אמורה למנוע. שתי דקות מספיקות
   כדי לא להפריע לעבודה רצופה, ולנעול כשהמכשיר עבר יד.
   נעילה שנשמרה כ"לזכור במכשיר הזה" היא בחירה מפורשת ולא נוגעים בה. */
var TE_HID=0;
try{
  document.addEventListener("visibilitychange",function(){
    if(document.hidden){ TE_HID=Date.now(); return }
    if(!TE_HID||!teHas())return;
    var away=Date.now()-TE_HID; TE_HID=0;
    if(away<120000)return;
    var kept=false;
    try{ kept=localStorage.getItem("mifne-teacher"+"-open")==="1" }catch(e){}
    if(kept)return;
    try{ if(sessionStorage.getItem("mifne-teacher"+"-open")!=="1")return }catch(e){ return }
    teSetOpen(false); render();
  });
}catch(e){}

/* ?teacher=1 פותח את החלון, והפרמטר מוסר מיד מהכתובת כדי שלא
   יישאר בקישור ששותף או בהיסטוריה. */
(function(){
  try{
    var u=new URL(location.href);
    if(u.searchParams.get("teacher")==="1"){
      u.searchParams.delete("teacher");
      history.replaceState(null,"",u.pathname+(u.searchParams.toString()?"?"+u.searchParams:"")+u.hash);
      /* שער התנאים יושב מעל הכול, וכך צריך להיות: אי־אפשר להשתמש
         באפליקציה לפני שהוסכם עליהם. חלון הקוד ממתין לו במקום
         להיפתח מתחתיו ולהיראות תקוע. */
      var tries=0;
      (function waitLegal(){
        if(tries++>=600){ teAsk(teHas()?"":"set"); return }
        /* LEGAL.accepted נוצר רק כש-protect.js מאותחל. עד אז אין
           עדיין מה לבדוק, ובדיקה של ".lg-wrap" לבדה מחזירה "אין
           שער" בדיוק ברגע שלפני שהוא נבנה. */
        var ready=false;
        try{ ready=!!(window.LEGAL&&window.LEGAL.accepted) }catch(e){}
        if(!ready){ setTimeout(waitLegal,200); return }
        var ok=true;
        try{ ok=!!window.LEGAL.accepted() }catch(e){ ok=true }
        if(!ok){ setTimeout(waitLegal,200); return }
        teAsk(teHas()?"":"set");
      })();
    }
  }catch(e){}
})();

function marksCsv(ex){
  var subs=(ex.subs||[]).slice().sort(function(a,b){return b.pct-a.pct});
  var n=ex.spec.q.length,i;
  var head=[xt("mkCsvName"),xt("mkCsvPct"),xt("mkCsvOk"),xt("mkCsvTotal"),
            xt("mkCsvDate"),xt("mkCsvValid")];
  for(i=0;i<n;i++)head.push(xf("mkCsvQ",i+1));
  var rows=[csvRow(head)];
  subs.forEach(function(s){
    var r=[s.name||xt("mkNoName"),s.pct,s.ok,s.n,s.date||"",
           s.valid?xt("mkCsvYes"):xt("mkCsvNo")];
    for(i=0;i<n;i++){
      var p=s.per&&s.per[i];
      r.push(p?(p.ok?xt("mkCsvYes"):xt("mkCsvNo")):"");
    }
    rows.push(csvRow(r));
  });
  return "\ufeff"+rows.join("\r\n")+"\r\n";
}
/* כרום מוחק את שם הקובץ כולו ברגע שיש בו תו אחד שאינו ASCII —
   לא רק עברית: גם é או מקף ארוך. מה שיורד נקרא "download", בלי
   סיומת, ואקסל לא יודע לפתוח אותו. מורה שקרא למבחן שלו בעברית
   קיבל קובץ בלי שם ובלי סוג. לכן השם מתועתק ללטינית. */
var TRLIT={
  "א":"a","ב":"b","ג":"g","ד":"d","ה":"h","ו":"v","ז":"z","ח":"ch","ט":"t","י":"y",
  "כ":"k","ך":"k","ל":"l","מ":"m","ם":"m","נ":"n","ן":"n","ס":"s","ע":"","פ":"f",
  "ף":"f","צ":"tz","ץ":"tz","ק":"k","ר":"r","ש":"sh","ת":"t",
  "ا":"a","ب":"b","ت":"t","ث":"th","ج":"j","ح":"h","خ":"kh","د":"d","ذ":"dh","ر":"r",
  "ز":"z","س":"s","ش":"sh","ص":"s","ض":"d","ط":"t","ظ":"z","ع":"","غ":"gh","ف":"f",
  "ق":"q","ك":"k","ل":"l","م":"m","ن":"n","ه":"h","و":"w","ي":"y","ة":"h","ى":"a","ء":"",
  "أ":"a","إ":"i","آ":"a","ؤ":"w","ئ":"y",
  "а":"a","б":"b","в":"v","г":"g","д":"d","е":"e","ё":"e","ж":"zh","з":"z","и":"i",
  "й":"y","к":"k","л":"l","м":"m","н":"n","о":"o","п":"p","р":"r","с":"s","т":"t",
  "у":"u","ф":"f","х":"kh","ц":"ts","ч":"ch","ш":"sh","щ":"sch","ъ":"","ы":"y","ь":"",
  "э":"e","ю":"yu","я":"ya"
};
function asciiName(s){
  var i,c,out="";
  /* é ו-ü הם אות לטינית ועוד סימן מצורף. פירוק והסרת הסימן משאיר e ו-u. */
  try{ s=s.normalize("NFD").replace(/[\u0300-\u036f]/g,"") }catch(e){}
  for(i=0;i<s.length;i++){
    c=s.charAt(i);
    if(/[A-Za-z0-9]/.test(c)){ out+=c; continue }
    var lower=c.toLowerCase();
    if(TRLIT[lower]!==undefined){ out+=TRLIT[lower]; continue }
    out+=" ";                     /* כל השאר — רווח, שיתכווץ בהמשך */
  }
  return out.replace(/\s+/g," ").trim();
}
function csvFileName(ex){
  var t=asciiName(String(ex.spec.t||"")).slice(0,60).trim();
  var d=String(ex.date||todayIso()).replace(/[^0-9-]/g,"");
  /* כשלא נשאר כלום קריא, מזהה המבחן הוא מה שמבדיל בין שני קבצים
     שירדו באותו יום. */
  if(!t) t="exam "+String(ex.id||"").slice(0,6);
  return (t+" "+d).trim()+".csv";
}
function downloadCsv(ex){
  var txt=marksCsv(ex),url=null,a=document.createElement("a");
  try{
    url=URL.createObjectURL(new Blob([txt],{type:"text/csv;charset=utf-8"}));
  }catch(e){
    url="data:text/csv;charset=utf-8,"+encodeURIComponent(txt);
  }
  a.href=url; a.download=csvFileName(ex);
  a.style.cssText="position:fixed;inset-inline-start:-9999px";
  document.body.appendChild(a); a.click();
  setTimeout(function(){
    if(a.parentNode)a.parentNode.removeChild(a);
    if(url&&url.indexOf("blob:")===0){try{URL.revokeObjectURL(url)}catch(e){}}
  },400);
}
function marksTable(ex){
  var out=(ex.spec.t||xt("exam"))+"\n";
  out+=xt("mkTblHead")+"\n";
  (ex.subs||[]).slice().sort(function(a,b){return b.pct-a.pct}).forEach(function(s){
    var wrong=uniq(s.per.filter(function(p){return !p.ok}).map(function(p){return p.topicName}));
    out+=(s.name||xt("mkNoName"))+"\t"+s.pct+"\t"+s.ok+"/"+s.n+"\t"+wrong.join(", ")+"\n";
  });
  return out;
}

/* ------------------------------------------------------------
   מסך התלמיד — מבחן מתוך קישור
   ------------------------------------------------------------ */
var SIT={spec:null,id:"",qs:[],i:0,name:"",answers:[],flags:[],
         t0:0,tick:null,phase:"intro",code:"",copied:false};

/* ------------------------------------------------------------
   מבחן שנפתח מחדש — ריענון, שיחה נכנסת, נעילת מסך
   ------------------------------------------------------------
   תלמיד שדפדפן שלו רענן באמצע מבחן איבד עד כה את הכול. התשובות
   נשמרות עכשיו במכשיר, לפי מזהה המבחן, יחד עם שעת ההתחלה — כדי
   שגם טיימר לא יתאפס ויעניק זמן נוסף. השמירה מקומית בלבד.
   ------------------------------------------------------------ */
function sitKey(){return EKEY+"-run-"+SIT.id}
function sitSave(){
  if(!SIT.id)return;
  try{localStorage.setItem(sitKey(),JSON.stringify({
    n:SIT.name,a:SIT.answers,f:SIT.flags,t:SIT.t0,i:SIT.i,p:SIT.phase}))}catch(e){}
}
function sitKeyOld(){return EKEY_OLD+"-run-"+SIT.id}
function sitDrop(){try{localStorage.removeItem(sitKey());localStorage.removeItem(sitKeyOld())}catch(e){}}
function sitRestore(){
  if(!SIT.id)return false;
  try{
    /* מבחן שהתחיל לפני פיצול המפתחות נשמר תחת המפתח הישן. */
    var o=JSON.parse(localStorage.getItem(sitKey())||localStorage.getItem(sitKeyOld())||"null");
    if(!o||!o.a||!o.a.length)return false;
    SIT.qs=examQuestions(SIT.spec);
    if(o.a.length!==SIT.qs.length)return false;   /* מבחן אחר תחת אותו מזהה */
    SIT.name=o.n||""; SIT.answers=o.a;
    SIT.flags=o.f&&o.f.length===o.a.length?o.f:SIT.qs.map(function(){return false});
    SIT.t0=o.t||0; SIT.i=Math.min(Math.max(0,o.i|0),SIT.qs.length-1);
    SIT.phase=o.p==="done"?"done":"ask";
    if(SIT.phase==="done")SIT.code=encodeResult(SIT.id,SIT.name,SIT.answers);
    return true;
  }catch(e){return false}
}
/* שניות שנותרו, או null כשלא הוגדרה הגבלת זמן */
function sitLeft(){
  var m=SIT.spec&&SIT.spec.m;
  if(!m||!SIT.t0)return null;
  return Math.max(0,Math.round((SIT.t0+m*60000-Date.now())/1000));
}
function sitClock(){
  var l=sitLeft(); if(l===null)return "";
  var mm=Math.floor(l/60),ss=l%60;
  return mm+":"+(ss<10?"0":"")+ss;
}
/* הזמן נגמר — מגישים. לא מבקשים אישור: אישור שאיש לא לוחץ עליו
   פירושו מבחן שנשאר פתוח לנצח. */
function sitTimerOn(){
  sitTimerOff();
  if(sitLeft()===null)return;
  SIT.tick=setInterval(function(){
    if(SIT.phase!=="ask"){sitTimerOff();return}
    if(sitLeft()<=0){sitTimerOff();sitFinish();return}
    var el=$("#sitclock"); if(el)el.textContent=sitClock();
  },1000);
}
function sitTimerOff(){if(SIT.tick){clearInterval(SIT.tick);SIT.tick=null}}

function sitStart(){
  var nm=$("#sitName"); SIT.name=nm?nm.value.trim():"";
  SIT.qs=examQuestions(SIT.spec);
  /* אם לא נותרה אף שאלה שאפשר לבנות (למשל מבחן של אפליקציה אחרת),
     מציגים את מסך המבחן השבור במקום ליפול על שאלה שאינה קיימת. */
  if(!SIT.qs.length){view="badexam"; render(); return}
  SIT.answers=SIT.qs.map(function(){return -1});
  SIT.flags=SIT.qs.map(function(){return false});
  SIT.i=0; SIT.phase="ask"; SIT.t0=Date.now();
  sitSave(); sitTimerOn();
  window.scrollTo(0,0); render();
}
function sitAnswer(i){
  if(SIT.phase!=="ask")return;
  SIT.answers[SIT.i]=i;
  sitSave();
  sitNext();
}
/* סימון לחזרה אינו תשובה ואינו משנה אותה — הוא רק מסמן. */
function sitFlag(){
  if(SIT.phase!=="ask")return;
  SIT.flags[SIT.i]=!SIT.flags[SIT.i];
  sitSave(); render();
}
function sitNext(){
  if(SIT.i+1<SIT.qs.length){SIT.i++;window.scrollTo(0,0);render();return}
  /* לא מגישים בלחיצה על תשובה. לחיצה בטעות על האפשרות האחרונה
     אינה אמורה לסיים מבחן. */
  SIT.phase="review"; stopSpeak(); window.scrollTo(0,0); render();
}
function sitGo(i){
  SIT.i=clamp(i,0,SIT.qs.length-1); SIT.phase="ask";
  window.scrollTo(0,0); render();
}
/* התוצאה נשלחת כקישור ולא כקוד: המורה לוחץ, האפליקציה נפתחת אצלו
   וקולטת. הקוד עצמו יושב אחרי #r=, ולכן גם הדבקה של הקישור השלם
   בתיבת הקוד עובדת — codeOf מחלץ אותו משם. */
function resultUrl(code){return location.origin+location.pathname+"#r="+code}
function codeOf(raw){
  var m=String(raw||"").match(/#r=([A-Za-z0-9\-_]+)/);
  return (m?m[1]:String(raw||"")).trim();
}
function sitFinish(){
  SIT.phase="done";
  sitTimerOff();
  SIT.code=encodeResult(SIT.id,SIT.name,SIT.answers);
  sitSave();
  stopSpeak(); window.scrollTo(0,0); render();
}
function sitGrade(){
  var ok=0,i;
  for(i=0;i<SIT.qs.length;i++){
    var a=SIT.answers[i];
    if(a>=0&&SIT.qs[i].options[a]&&SIT.qs[i].options[a].ok)ok++;
  }
  return {ok:ok,n:SIT.qs.length,pct:Math.round(100*ok/SIT.qs.length)};
}

function copyText(txt,done){
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(done,function(){fallbackCopy(txt,done)});
      return;
    }
  }catch(e){}
  fallbackCopy(txt,done);
}
function fallbackCopy(txt,done){
  try{
    var ta=document.createElement("textarea");
    ta.value=txt; ta.setAttribute("readonly","");
    ta.style.position="fixed"; ta.style.top="-1000px";
    document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); document.body.removeChild(ta);
    done();
  }catch(e){}
}
function examAction(a,el){
  /* --- בניית מבחן --- */
  if(a==="exlvl"){EB.level=parseInt(el.getAttribute("data-l"),10)||2;EB.q=null;EB.built=null;render();return true}
  if(a==="extopic"){
    var id=el.getAttribute("data-t"),k=EB.topics.indexOf(id);
    if(k>=0)EB.topics.splice(k,1);else EB.topics.push(id);
    EB.q=null;EB.built=null;render();return true;
  }
  if(a==="exflag"){var f=el.getAttribute("data-f");EB[f]=!EB[f];EB.built=null;render();return true}
  /* --- בחירת השאלות --- */
  if(a==="exqans"){EB.ans=!EB.ans;render();return true}
  if(a==="exqreset"){EB.q=null;EB.built=null;render();return true}
  if(a==="exqroll"){
    var qi=parseInt(el.getAttribute("data-i"),10),ql=exSlots();
    /* משבצת חדשה ולא רק זרע חדש, כדי שהמערך יישאר בן שלושה
       איברים גם אם מישהו יוסיף שדה בעתיד. */
    if(ql[qi])
      {ql[qi]=exSlot(ql[qi][0],ql[qi][1]);EB.built=null}
    render();return true;
  }
  if(a==="exqdel"){
    var di=parseInt(el.getAttribute("data-i"),10),dl=exSlots();
    /* מבחן בלי שאלות אינו מבחן. משאירים אחת. */
    if(dl.length>1&&di>=0&&di<dl.length){dl.splice(di,1);EB.n=dl.length;EB.built=null}
    render();return true;
  }
  if(a==="exqadd"){
    var at=el.getAttribute("data-t"),al=exSlots();
    /* עשרים וחמש — גם הגבול של המחוון, וגם מבחן ארוך דיו. */
    if(topicById(at)&&al.length<25){al.push(exSlot(at,EB.level));EB.n=al.length;EB.built=null}
    render();return true;
  }
  if(a==="exbuild"){
    var ti=$("#exTitle"),ph=$("#exPhone");
    EB.title=ti?ti.value.trim():""; EB.phone=ph?ph.value.trim():"";
    /* המבחן נארז מהמשבצות שעל המסך — אותן שאלות ואותו סדר
       שהמורה אישר. ערבוב כאן היה מסדר מחדש מבחן שכבר נבדק. */
    var q=exSlots().slice();
    var spec={v:GENV,t:EB.title||xt("exam"),s:(Math.random()*4294967295)>>>0,l:EB.level,
              q:q,r:!!EB.tts,f:!!EB.formulas,w:true,m:EB.mins||0};
    if(EB.phone)spec.p=EB.phone.replace(/[^0-9]/g,"");
    EB.built=spec; EB.copied="";
    var id=examId(spec);
    if(!exFind(id)){EX.list.unshift({id:id,spec:spec,date:todayIso(),subs:[]});exSave()}
    render(); return true;
  }
  if(a==="excopy"){var u=el.getAttribute("data-v");copyText(u,function(){EB.copied="url";render()});return true}

  /* --- ציונים --- */
  if(a==="mkopen"){var i2=el.getAttribute("data-i");MK.open=MK.open===i2?"":i2;MK.msg=null;render();return true}
  /* מחיקה מוחקת גם את כל ההגשות. שאלה אחת לפני זה היא לא נימוס —
     היא ההבדל בין טעות לבין אובדן של כיתה שלמה. */
  if(a==="mkdel"){MK.del=el.getAttribute("data-i");render();return true}
  if(a==="mkdelno"){MK.del="";render();return true}
  if(a==="mkdelyes"){
    var id3=el.getAttribute("data-i");
    EX.list=EX.list.filter(function(x){return x.id!==id3});
    exSave(); MK.open=""; MK.del=""; render(); return true;
  }
  if(a==="teask"){ teAsk(teHas()?"":"set"); return true }
  if(a==="techange"){ teAsk("change"); return true }
  if(a==="telock"){ teLock(); return true }
  if(a==="teremove"){ teRemove(); return true }
  if(a==="mkcsv"){
    var exc=exFind(el.getAttribute("data-i")); if(!exc)return true;
    downloadCsv(exc);
    MK.msg={id:exc.id,ok:true,m:xt("mkCsvDone")}; render();
    return true;
  }
  if(a==="mkcopy"){
    var ex4=exFind(el.getAttribute("data-i")); if(!ex4)return true;
    copyText(marksTable(ex4),function(){MK.msg={id:ex4.id,ok:true,m:xt("mkTblCopied")};render()});
    return true;
  }
  if(a==="mkadd"){
    var ex=exFind(el.getAttribute("data-i")); if(!ex)return true;
    var ta=$("#mkPaste"),raw=ta?ta.value:"";
    var res=decodeResult(codeOf(raw));
    if(!res){MK.msg={id:ex.id,ok:false,m:xt("mkErrRead")};render();return true}
    if(mkImport(ex,res)&&ta)ta.value="";
    render(); return true;
  }

  /* --- התלמיד --- */
  if(a==="sitstart"){sitStart();return true}
  if(a==="sitans"){sitAnswer(parseInt(el.getAttribute("data-i"),10));return true}
  if(a==="sitskip"){SIT.answers[SIT.i]=-1;sitSave();sitNext();return true}
  if(a==="sitflag"){sitFlag();return true}
  if(a==="sitprev"){sitGo(SIT.i-1);return true}
  if(a==="sitfwd"){sitNext();return true}
  if(a==="sitgo"){sitGo(parseInt(el.getAttribute("data-i"),10));return true}
  if(a==="sitfinish"){sitFinish();return true}
  /* בלי שפה מפורשת speak נופל ל-"en", ושאלת מבחן בעברית, בערבית
     או ברוסית הוקראה בקול אנגלי. כאן החומר עצמו בשפת הממשק. */
  /* say נבנה במפורש כ"השאלה והתשובה עליה" ונועד להישמע *אחרי*
     המענה. במבחן הכפתור זמין *לפני*, ולכן הוא הקריא לתלמיד את
     התשובה. כאן מוקרא מה שעל המסך — הכותרת והמקור — והאפשרויות
     ממילא אינן חלק ממנו. */
  if(a==="sitread"){var q2=SIT.qs[SIT.i];
    if(q2)speak(saySpell(plainOf(q2.ask||"")+" "+plainOf(q2.expr||"")),state.lang);
    return true}
  if(a==="sitform"){view="formulas";render();window.scrollTo(0,0);return true}
  if(a==="sitcopy"){copyText(SIT.code,function(){SIT.copied=true;render()});return true}
  if(a==="sitback"){view="sit";render();window.scrollTo(0,0);return true}
  return false;
}

/* קליטת מבחן מהכתובת. עושים את זה לפני ה-render הראשון, אחרת
   התלמיד רואה לרגע את מסך הבית של אפליקציה שהוא לא מכיר. */
/* קולט תוצאה אחת למבחן. מחזיר true כשנשמרה; בכל מקרה משאיר הודעה
   ב-MK.msg למסך הציונים. משמש גם את תיבת ההדבקה וגם את הקישור. */
function mkImport(ex,res){
    if(res.i!==ex.id){
      var other=exFind(res.i);
      MK.msg={id:ex.id,ok:false,m:other?xf("mkErrOther",other.spec.t||xt("exam")):xt("mkErrUnknown")};
      return false;
    }
    if(res.a.length!==ex.spec.q.length){
      MK.msg={id:ex.id,ok:false,m:xt("mkErrCount")};return false}
    var g=gradeResult(ex.spec,res);
    var sub={name:res.n||"",date:res.d||todayIso(),ok:g.ok,n:g.n,pct:g.pct,per:g.per,valid:!!res.ok};
    /* הגשה חוזרת של אותו תלמיד מחליפה את הקודמת ולא מצטברת לידה */
    /* הגשה חדשה מחליפה קודמת רק כששני השמות זהים אחרי נירמול, והשם
       אינו ריק. בלי זה כל ההגשות בלי שם נראו כאותו תלמיד ודרסו זו את
       זו בשקט, וגם "דני" מול "דני  " (רווח כפול פנימי) נחשבו לשניים. */
    var nrm=function(x){return String(x==null?"":x).replace(/\s+/g," ").trim()};
    var sn=nrm(sub.name);
    var k2=sn?(ex.subs||[]).findIndex(function(s){return nrm(s.name)===sn}):-1;
    if(!ex.subs)ex.subs=[];
    if(k2>=0)ex.subs[k2]=sub; else ex.subs.push(sub);
    exSave();
    MK.msg={id:ex.id,ok:true,m:(sub.name||xt("student"))+" "+xt("mkTaken")+" · "+g.pct+" ("+g.ok+"/"+g.n+")"+
      (sub.valid?"":" · "+xt("mkNoteBad"))};
    return true;
}
/* קליטת תוצאה מהכתובת — הצד של המורה. הכתובת מנוקה מיד, כדי שרענון
   לא יקלוט שוב; קליטה חוזרת של אותו תלמיד הייתה מחליפה ולא מכפילה,
   אבל אין סיבה להשאיר קוד בשורת הכתובת. */
function resultFromUrl(){
  var m=String(location.hash||"").match(/^#r=(.+)$/);
  if(!m)return false;
  var res=decodeResult(m[1]),ex=res?exFind(res.i):null;
  try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}
  if(!res)MK.msg={id:"",ok:false,m:xt("mkErrRead")};
  else if(!ex)MK.msg={id:"",ok:false,m:xt("mkErrUnknown")};
  else if(mkImport(ex,res))MK.open=ex.id;
  view="marks"; return true;
}
function examFromUrl(){
  var m=String(location.hash||"").match(/^#x=(.+)$/);
  if(!m)return false;
  var sp=decodeExam(m[1]);
  if(!sp){
    view="badexam"; return true;
  }
  if(sp.v!==GENV){view="oldexam";return true}
  SIT.spec=sp; SIT.id=examId(sp); SIT.phase="intro";
  /* מבחן שכבר התחיל במכשיר הזה נמשך מהמקום שבו נעצר, עם הזמן
     שכבר חלף. בלי זה ריענון היה מוחק תשובות ומאפס טיימר. */
  if(sitRestore()&&SIT.phase==="ask")sitTimerOn();
  view="sit"; return true;
}

}
