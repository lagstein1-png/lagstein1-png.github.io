  return `<!DOCTYPE html>

<body>

      <button class="btn" onclick="skipQuestion()">⏭️ דלג</button>

</div>

<script>
const questions = ${JSON.stringify(app.questions)};
let current=0, score=0, selected=null, answered=false;
let currentLang='he';
let femaleVoice=null;

// ============================================================
// בחירת קול נשי
// ============================================================
function pickFemaleVoice() {
  if(!('speechSynthesis' in window)) return;
  const voices = speechSynthesis.getVoices();
  const femaleNames = ['female','woman','girl','miri','hila','carmit','samantha','karen','zira','hazel','ava','emma','mia','chloe','zoe','luna','nova','aria','iris','lily','rose','jasmine','ruby','sophie','ella','grace','charlotte','amelia','olivia','isabella','sofia','elena','maria','ana','daria','svetlana','nadia','tanya','katya','anastasia','masha','olga','irina','vera','galina','ludmila','natasha','oksana','tamara','zoya','lara','rita','maya','lea','noa','tamar','shira','gaya','roni','neta','mor','lihi','yael','ayala','michal','dana','sivan','rotem','shani','tali','gali','noa','maya','tamar','shira'];
  for(let v of voices) {
    const name = v.name.toLowerCase();
    if(femaleNames.some(f => name.includes(f))) { femaleVoice = v; return; }
  }
}
speechSynthesis.onvoiceschanged = pickFemaleVoice;
setTimeout(pickFemaleVoice, 200);

// ============================================================
// פונקציית דיבור (קול נשי + הגבהה)
// ============================================================
function speak(t) {
  if(!t || !('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t);
  const map = {he:'he-IL', ar:'ar-SA', en:'en-US', ru:'ru-RU'};
  u.lang = map[currentLang] || 'he-IL';
  u.rate = 0.9;
  if(femaleVoice) u.voice = femaleVoice;
  else u.pitch = 1.3;
  window.speechSynthesis.speak(u);
}

// ============================================================
// שפה
// ============================================================
function setLang(lang) {
  currentLang = lang;
  document.querySelectorAll('#langbar button').forEach(b => b.classList.toggle('on', b.dataset.lang === lang));
  loadQuestion(current);
  speak('שפה שונתה');
}

// ============================================================
// שאלות
// ============================================================
function loadQuestion(i) {
  const q = questions[i];
  document.getElementById('qHeader').textContent = 'שאלה '+(i+1)+' מתוך '+questions.length;
  document.getElementById('qText').textContent = q.q[currentLang];
  document.getElementById('qNum').textContent = i+1;
  document.getElementById('qTotal').textContent = questions.length;
  document.getElementById('feedback').innerHTML = '';
  document.getElementById('solutionBox').classList.add('hidden');
  const box = document.getElementById('optionsBox');
  box.innerHTML = '';
  q.opts[currentLang].forEach((opt, idx) => {
    const div = document.createElement('div');
    div.className = 'option';
    div.textContent = opt;
    div.dataset.index = idx;
    div.onclick = () => selectOption(idx);
    box.appendChild(div);
  });
  selected = null; answered = false;
  document.querySelectorAll('.option').forEach(el => el.classList.remove('selected-correct', 'selected-wrong'));
  speak(q.q[currentLang]);
}

function selectOption(idx) {
  if(answered) return;
  selected = idx;
  const q = questions[current];
  speak(q.opts[currentLang][idx]);
  const correct = (idx === q.ans);
  const options = document.querySelectorAll('.option');
  options.forEach((el, i) => {
    if(i === q.ans) el.classList.add('selected-correct');
    if(i === idx && !correct) el.classList.add('selected-wrong');
  });
  answered = true;
  if(correct) {
    score++;
    document.getElementById('feedback').innerHTML = '✅ תשובה נכונה!';
    speak('תשובה נכונה');
  } else {
    document.getElementById('feedback').innerHTML = '❌ תשובה שגויה. התשובה הנכונה: '+q.opts[currentLang][q.ans];
    speak('תשובה שגויה. התשובה הנכונה היא: '+q.opts[currentLang][q.ans]);
  }
}

function showSolution() {
  const box = document.getElementById('solutionBox');
  box.classList.remove('hidden');
  document.getElementById('solutionContent').innerHTML = '<p>'+questions[current].sol[currentLang].replace(/\\n/g,'<br>')+'</p>';
  speak('פתרון: '+questions[current].sol[currentLang]);
}
function hideSolution(){ document.getElementById('solutionBox').classList.add('hidden'); }
function nextQuestion() {
  if(!answered){ speak('ענה קודם'); return; }
  if(current+1 < questions.length) { current++; loadQuestion(current); }
  else { document.getElementById('feedback').innerHTML = '🎉 סיימת! ציון: '+score+'/'+questions.length; speak('סיימת! הציון שלך: '+score+' מתוך '+questions.length); }
}
function skipQuestion() {
  if(current+1 < questions.length) { current++; loadQuestion(current); speak('דילגת'); }
  else speak('אין שאלות נוספות');
}
function resetQuiz() { current=0; score=0; loadQuestion(0); speak('אתחלת את המבחן'); }

// ============================================================
document.getElementById('btnCreate').addEventListener('click', function() {
  const log = document.getElementById('log');
  log.innerHTML = '<div class="info">⏳ יוצר את כל 21 האפליקציות...</div>';
  const zip = new JSZip();
  APPS.forEach((app, i) => {
    const html = generateAppHTML(app);
    zip.file(`apps/${app.id}/index.html`, html);
    log.innerHTML += '<div>✅ '+(i+1)+'. '+app.name.he+'</div>';
  });
  // דף בית
  let home = `<!DOCTYPE html><html dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>כל האפליקציות</title><style>body{font-family:Arial;background:#f5f7fb;color:#101828;padding:30px;text-align:center}h1{color:#4f46e5}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;max-width:900px;margin:30px auto}.card{background:#ffffff;padding:18px;border-radius:12px;border:1px solid #e0e4ee;transition:.3s}.card:hover{background:#eef1f7;transform:scale(1.03)}.card a{color:#4f46e5;text-decoration:none;font-size:1.1rem;display:block}.card .icon{font-size:2rem;display:block;margin-bottom:6px}</style></head><body><h1>🚀 21 האפליקציות שלי</h1><div class="grid">`;
  APPS.forEach(app => {
    home += `<div class="card"><span class="icon">${app.icon}</span><a href="apps/${app.id}/index.html">${app.name.he}</a></div>`;
  });
  home += '</div></body></html>';
  zip.file('index.html', home);

  // ג׳וש אינו נארז כאן: המוח היחיד הוא tutor-api/worker.js. ראו JOSH.md
  const fetched = Promise.resolve();

  log.innerHTML += '<div class="info">📦 מוריד את הקובץ...</div>';
  fetched.then(function () {
  return zip.generateAsync({type:'blob'}); }).then(content => {
    saveAs(content, 'all_apps_21_final.zip');
    log.innerHTML += '<div class="done">✅ סיום! הקובץ הורד. פתח את ה-ZIP ותיהנה.</div>';
  }).catch(err => {
    log.innerHTML += '<div class="fail">❌ שגיאה: '+err+'</div>';
  });
});
