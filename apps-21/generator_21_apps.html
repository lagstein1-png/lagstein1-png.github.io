<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>21 אפליקציות</title>
<style>
*{box-sizing:border-box;margin:0}
body{font-family:Arial;background:#f5f7fb;color:#101828;padding:20px;text-align:center}
h1{color:#4f46e5;font-size:2.2rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;max-width:1000px;margin:30px auto}
.card{background:#ffffff;padding:20px;border-radius:12px;border:1px solid #e0e4ee;cursor:pointer;transition:.3s}
.card:hover{background:#eef1f7;transform:scale(1.05)}
.card .icon{font-size:2.5rem;display:block;margin-bottom:6px}
.card .name{font-size:1.1rem;font-weight:600}
#appContainer{margin-top:30px;background:#ffffff;border-radius:16px;padding:20px;display:none}
#appContainer iframe{width:100%;min-height:650px;border:none;border-radius:12px;background:#f5f7fb}
.back{background:#15803d;color:#fff;border:none;padding:12px 30px;border-radius:10px;font-size:1.2rem;cursor:pointer;margin:10px}
.back:hover{background:#166534}
</style>

<!-- ג'וש — המורה הדיגיטלי הצף -->
<link rel="stylesheet" href="josh-avatar.css">
</head>
<body>

<h1>🚀 21 האפליקציות שלי</h1>
<p>לחץ על כל אפליקציה – היא תיטען בדף זה.</p>
<div class="grid" id="appGrid"></div>
<div id="appContainer">
  <button class="back" onclick="closeApp()">⬅️ חזרה לרשימה</button>
  <!-- allow="microphone" נדרש כדי שזיהוי הדיבור של ג'וש יעבוד במסגרת -->
  <iframe id="appFrame" allow="microphone" title="אפליקציה"></iframe>
</div>

<script>
// ============================================================
// כל 21 האפליקציות – קוד HTML מלא
// ============================================================
const apps = [
  {id:"netiv",icon:"🚗",name:"נתיב",desc:"רישיון נהיגה"},
  {id:"ulpan",icon:"🗣️",name:"אולפן",desc:"עברית לעולים"},
  {id:"zkut",icon:"⚖️",name:"זכות",desc:"מיצוי זכויות"},
  {id:"shkal",icon:"💰",name:"שקל",desc:"אוריינות פיננסית"},
  {id:"tsura",icon:"📝",name:"צורה",desc:"לשון לבגרות"},
  {id:"amana",icon:"🇮🇱",name:"אמנה",desc:"אזרחות לבגרות"},
  {id:"miftan",icon:"🚪",name:"מפתן",desc:"מיצ\"ב לחטיבה"},
  {id:"mapa",icon:"🌍",name:"מפה",desc:"גיאוגרפיה לחטיבה"},
  {id:"ta",icon:"🧬",name:"תא",desc:"ביולוגיה לבגרות"},
  {id:"yesod",icon:"➕",name:"יסוד",desc:"חשבון למבוגרים"},
  {id:"ot",icon:"✍️",name:"אות",desc:"קריאה וכתיבה"},
  {id:"chibur",icon:"💻",name:"חיבור",desc:"אוריינות דיגיטלית"},
  {id:"korot",icon:"📄",name:"קורות",desc:"קורות חיים"},
  {id:"midgam",icon:"📊",name:"מדגם",desc:"סטטיסטיקה"},
  {id:"maslul",icon:"⚙️",name:"מסלול",desc:"מה\"ט והנדסאים"},
  {id:"code",icon:"⌨️",name:"קוד",desc:"יסודות תכנות"},
  {id:"gesher",icon:"🌉",name:"גשר",desc:"ערבית מדוברת"},
  {id:"tavnit",icon:"⚠️",name:"תווית",desc:"בטיחות בעבודה"},
  {id:"sha-ar",icon:"🛂",name:"שער",desc:"מבחן התאזרחות"},
  {id:"mafteach",icon:"🧠",name:"מפתח",desc:"פסיכומטרי"},
  {id:"mirsham",icon:"💊",name:"מרשם",desc:"מונחי רפואה"}
];

// ============================================================
// פונקציה ליצירת HTML של אפליקציה (כללית)
// ============================================================
function generateAppHTML(app) {
  return `<!DOCTYPE html>
<html dir="rtl" lang="he"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>${app.name}</title>
<link rel="stylesheet" href="josh-avatar.css">
<style>
:root{--bg:#f5f7fb;--panel:#ffffff;--line:#e0e4ee;--ink:#101828;--ink-soft:#5b6478;--accent:#4f46e5;--font:Arial,sans-serif}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);padding:20px;text-align:center;font-size:1.2rem}
.wrap{max-width:750px;margin:auto}
.brand{font-size:2rem;font-weight:700;color:#4f46e5}
#langbar{display:flex;gap:6px;justify-content:center;margin:15px 0;flex-wrap:wrap}
#langbar button{border:1px solid var(--line);background:transparent;color:var(--ink-soft);border-radius:9px;padding:10px 18px;cursor:pointer;font-size:1.1rem}
#langbar button.on{border-color:var(--accent);color:var(--accent);background:rgba(79,70,229,.10)}
.q-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:25px;margin:20px 0}
.q-text{font-size:1.8rem;font-weight:700;margin-bottom:16px}
.options{display:flex;flex-direction:column;gap:12px;margin:16px 0}
.option{background:var(--bg);padding:16px;border-radius:10px;cursor:pointer;font-size:1.3rem;border:2px solid var(--line);transition:.2s}
.option:hover{border-color:var(--accent)}
.option.selected-correct{border-color:#15803d;background:rgba(21,128,61,.12)}
.option.selected-wrong{border-color:#be123c;background:rgba(190,18,60,.10)}
.feedback{font-size:1.4rem;font-weight:700;padding:12px 0}
.btn{display:inline-block;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:12px 22px;border-radius:10px;font-size:1.1rem;font-weight:600;cursor:pointer;margin:5px}
.btn:hover{border-color:var(--accent)}
.solution{background:var(--bg);padding:20px;border-radius:10px;margin-top:16px;border-right:4px solid var(--accent);text-align:right}
.solution p{font-size:1.2rem;line-height:2;white-space:pre-wrap}
.hidden{display:none}
</style></head><body>
<div class="wrap"><div class="brand">${app.icon} ${app.name}</div>
<div id="langbar"><button data-lang="he" class="on">עברית</button><button data-lang="ar">العربية</button><button data-lang="en">English</button><button data-lang="ru">Русский</button></div>
<div class="q-box" id="questionBox"><div class="q-text" id="qHeader">שאלה 1 מתוך 5</div><div class="q-text" id="qText">טוען...</div><div class="options" id="optionsBox"></div><div id="feedback" class="feedback"></div><div>
<button class="btn" onclick="skipQuestion()">⏭️ דלג</button>
<button class="btn" onclick="showSolution()">📘 פתרון</button>
<button class="btn" onclick="resetQuiz()">🔄 שוב</button>
<button class="btn" onclick="nextQuestion()">➡️ הבא</button>
</div></div>
<div id="solutionBox" class="solution hidden"><h3>📘 פתרון</h3><div id="solutionContent"></div><button class="btn" onclick="hideSolution()">סגור</button></div>
<div style="margin-top:16px;font-size:1.2rem">שאלה <span id="qNum">1</span> / <span id="qTotal">5</span></div></div>
<script>
// ============================================================
// שאלות לדוגמה (ניתן להחליף לכל נושא)
// ============================================================
const questions = [
  {q:{he:"מה הפירוש?",ar:"ماذا يعني؟",en:"What does it mean?",ru:"Что это значит?"},opts:{he:["אפשרות 1","אפשרות 2","אפשרות 3","אפשרות 4"],ar:["خيار 1","خيار 2","خيار 3","خيار 4"],en:["Option 1","Option 2","Option 3","Option 4"],ru:["Вариант 1","Вариант 2","Вариант 3","Вариант 4"]},ans:0,sol:{he:"1. הסבר.\\n2. תשובה: אפשרות 1.",ar:"1. شرح.\\n2. الإجابة: خيار 1.",en:"1. Explanation.\\n2. Answer: Option 1.",ru:"1. Объяснение.\\n2. Ответ: Вариант 1."}},
  {q:{he:"האם זה נכון?",ar:"هل هذا صحيح؟",en:"Is this correct?",ru:"Это верно?"},opts:{he:["כן","לא","אולי","לא יודע"],ar:["نعم","لا","ربما","لا أعرف"],en:["Yes","No","Maybe","Don't know"],ru:["Да","Нет","Возможно","Не знаю"]},ans:0,sol:{he:"1. התשובה הנכונה: כן.",ar:"1. الإجابة الصحيحة: نعم.",en:"1. Correct answer: Yes.",ru:"1. Правильный ответ: Да."}},
  {q:{he:"מה הבחירה הנכונה?",ar:"ما هو الخيار الصحيح؟",en:"What is the correct choice?",ru:"Какой правильный выбор?"},opts:{he:["א","ב","ג","ד"],ar:["أ","ب","ج","د"],en:["A","B","C","D"],ru:["А","Б","В","Г"]},ans:1,sol:{he:"1. התשובה: ב.",ar:"1. الإجابة: ب.",en:"1. Answer: B.",ru:"1. Ответ: Б."}},
  {q:{he:"כמה זה 2+2?",ar:"كم 2+2؟",en:"What is 2+2?",ru:"Сколько 2+2?"},opts:{he:["3","4","5","6"],ar:["3","4","5","6"],en:["3","4","5","6"],ru:["3","4","5","6"]},ans:1,sol:{he:"1. 2+2=4.\\n2. תשובה: 4.",ar:"1. 2+2=4.\\n2. الإجابة: 4.",en:"1. 2+2=4.\\n2. Answer: 4.",ru:"1. 2+2=4.\\n2. Ответ: 4."}},
  {q:{he:"מהי מילה נרדפת?",ar:"ما هي الكلمة المرادفة؟",en:"What is a synonym?",ru:"Что такое синоним?"},opts:{he:["מילה זהה","מילה הפוכה","מילה דומה","מילה שונה"],ar:["كلمة مطابقة","كلمة عكسية","كلمة مشابهة","كلمة مختلفة"],en:["Same word","Opposite word","Similar word","Different word"],ru:["Одинаковое слово","Противоположное слово","Похожее слово","Разное слово"]},ans:2,sol:{he:"1. מילה נרדפת = מילה דומה.\\n2. תשובה: מילה דומה.",ar:"1. الكلمة المرادفة = كلمة مشابهة.\\n2. الإجابة: كلمة مشابهة.",en:"1. Synonym = similar word.\\n2. Answer: Similar word.",ru:"1. Синоним = похожее слово.\\n2. Ответ: Похожее слово."}}
];

let current=0,score=0,selected=null,answered=false,currentLang='he',femaleVoice=null;
function pickVoice(){if(!('speechSynthesis' in window))return;const v=speechSynthesis.getVoices();const f=['female','woman','girl','miri','hila','carmit','samantha','karen','zira','hazel','ava','emma','mia','chloe','zoe','luna','nova','aria','iris','lily','rose','jasmine','ruby','sophie','ella','grace','charlotte','amelia','olivia','isabella','sofia','elena','maria','ana','daria','svetlana','nadia','tanya','katya','anastasia','masha','olga','irina','vera','galina','ludmila','natasha','oksana','tamara','zoya','lara','rita','maya','lea','noa','tamar','shira','gaya','roni','neta','mor','lihi','yael','ayala','michal','dana','sivan','rotem','shani','tali','gali'];for(let x of v){const n=x.name.toLowerCase();if(f.some(s=>n.includes(s))){femaleVoice=x;return;}}}
speechSynthesis.onvoiceschanged=pickVoice;setTimeout(pickVoice,200);
function speak(t){if(!t||!('speechSynthesis' in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);const map={he:'he-IL',ar:'ar-SA',en:'en-US',ru:'ru-RU'};u.lang=map[currentLang]||'he-IL';u.rate=0.9;if(femaleVoice)u.voice=femaleVoice;else u.pitch=1.3;window.speechSynthesis.speak(u);}
function setLang(l){currentLang=l;document.querySelectorAll('#langbar button').forEach(b=>b.classList.toggle('on',b.dataset.lang===l));loadQuestion(current);speak('שפה שונתה');}
function loadQuestion(i){const q=questions[i];document.getElementById('qHeader').textContent='שאלה '+(i+1)+' מתוך '+questions.length;document.getElementById('qText').textContent=q.q[currentLang];document.getElementById('qNum').textContent=i+1;document.getElementById('qTotal').textContent=questions.length;document.getElementById('feedback').innerHTML='';document.getElementById('solutionBox').classList.add('hidden');const box=document.getElementById('optionsBox');box.innerHTML='';q.opts[currentLang].forEach((opt,idx)=>{const div=document.createElement('div');div.className='option';div.textContent=opt;div.dataset.index=idx;div.onclick=()=>selectOption(idx);box.appendChild(div);});selected=null;answered=false;document.querySelectorAll('.option').forEach(el=>el.classList.remove('selected-correct','selected-wrong'));speak(q.q[currentLang]);if(window.Josh)Josh.solving(true);}
function selectOption(idx){if(answered)return;selected=idx;const q=questions[current];speak(q.opts[currentLang][idx]);const correct=(idx===q.ans);document.querySelectorAll('.option').forEach((el,i)=>{if(i===q.ans)el.classList.add('selected-correct');if(i===idx&&!correct)el.classList.add('selected-wrong');});answered=true;if(correct){score++;document.getElementById('feedback').innerHTML='✅ תשובה נכונה!';if(window.Josh){Josh.solving(false);Josh.celebrate();}else speak('תשובה נכונה');}else{document.getElementById('feedback').innerHTML='❌ שגוי. התשובה הנכונה: '+q.opts[currentLang][q.ans];if(window.Josh){Josh.solving(false);Josh.encourage('לא נורא. התשובה הנכונה היא: '+q.opts[currentLang][q.ans]);}else speak('תשובה שגויה. התשובה הנכונה היא: '+q.opts[currentLang][q.ans]);}}
function showSolution(){const box=document.getElementById('solutionBox');box.classList.remove('hidden');document.getElementById('solutionContent').innerHTML='<p>'+questions[current].sol[currentLang].replace(/\\n/g,'<br>')+'</p>';speak('פתרון: '+questions[current].sol[currentLang]);}
function hideSolution(){document.getElementById('solutionBox').classList.add('hidden');}
function nextQuestion(){if(!answered){speak('ענה קודם');return;}if(current+1<questions.length){current++;loadQuestion(current);}else{document.getElementById('feedback').innerHTML='🎉 סיימת! ציון: '+score+'/'+questions.length;speak('סיימת! הציון שלך: '+score+' מתוך '+questions.length);}}
function skipQuestion(){if(current+1<questions.length){current++;loadQuestion(current);speak('דילגת');}else speak('אין שאלות נוספות');}
function resetQuiz(){current=0;score=0;loadQuestion(0);speak('אתחלת את המבחן');}
document.querySelectorAll('#langbar button').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));loadQuestion(0);
<\/script>
<script>window.JOSH_OPTIONS={autoGreet:false,continuous:true};<\/script>
<script src="josh-engine.js"><\/script>
</body></html>`;
}

// ============================================================
// טעינת הרשימה
// ============================================================
const grid = document.getElementById('appGrid');
apps.forEach(app => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<span class="icon">${app.icon}</span><span class="name">${app.name}</span>`;
  card.onclick = () => openApp(app);
  grid.appendChild(card);
});

// ============================================================
// פתיחת אפליקציה
// ============================================================
function openApp(app) {
  const container = document.getElementById('appContainer');
  const frame = document.getElementById('appFrame');
  container.style.display = 'block';
  /* srcdoc ולא data:text/html — כתובת data היא מקור אטום ובלי כתובת
     בסיס, ולכן josh-avatar.css ו-josh-engine.js לא היו נטענים שם. */
  frame.srcdoc = generateAppHTML(app);
  container.scrollIntoView({ behavior: 'smooth', block: 'start' });
  if (window.Josh) Josh.hide();          // לאפליקציה יש ג'וש משלה
}

function closeApp() {
  const frame = document.getElementById('appFrame');
  // עוצרים הקראה שרצה במסגרת, אחרת היא ממשיכה אחרי הסגירה
  try { frame.contentWindow.speechSynthesis.cancel(); } catch (e) { /* noop */ }
  document.getElementById('appContainer').style.display = 'none';
  frame.removeAttribute('srcdoc');
  frame.src = 'about:blank';
  if (window.Josh) Josh.show();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

</script>

<!-- המנוע של ג'וש מאתחל את עצמו ובונה את הבועה הצפה. -->
<script>
window.JOSH_OPTIONS = {
  name: "ג'וש הגאון",
  lang: 'he-IL',
  position: 'left',
  greeting: 'שלום! אני ג\'וש הגאון. בחרו אפליקציה מהרשימה, ואם משהו לא ברור — לחצו על המיקרופון ושאלו אותי.'
};
</script>
<script src="josh-engine.js" defer></script>
</body>
</html>
