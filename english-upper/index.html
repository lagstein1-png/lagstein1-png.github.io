U("cond",4,"#c0392b",L("משפטי תנאי ו-wish","الجمل الشرطية وwish","Условные предложения и wish","Conditionals and wish"),L("if + הווה, if + עבר, if + past perfect","if + مضارع وif + ماضٍ وif + ماضٍ تام","if + настоящее, прошедшее, past perfect","if + present, past, past perfect"));

/* ===== lessons: 3 short steps per unit; examples are in English ===== */
LESSONS.main=[
 ST_("קוראים קודם את כל הקטע. הרעיון המרכזי הוא על מה הקטע כולו, לא על משפט אחד. שואלים: מה הכותב רוצה שאדע?","نقرأ النص كله أولًا. الفكرة الرئيسية هي موضوع النص كله وليس جملة واحدة. نسأل: ماذا يريد الكاتب أن أعرف؟","Сначала читаем весь текст. Главная мысль — о чём весь текст, а не одно предложение. Спроси себя: что автор хочет, чтобы я понял?","Read the whole text first. The main idea is what the whole text is about, not one sentence. Ask: what does the writer want me to know?",function(){return enEx("Every morning, Dana walks to school instead of taking the bus. She says it wakes her up and gives her time to think.","Main idea: Walking to school has good things for Dana.")}),
 ST_("שאלת פרט שואלת על משהו מסוים. מחפשים בקטע את המילים של השאלה, וקוראים את המשפט שסביבן.","سؤال التفاصيل يسأل عن شيء محدد. نبحث في النص عن كلمات السؤال ونقرأ الجملة حولها.","Вопрос о детали спрашивает о конкретном. Найди в тексте слова из вопроса и прочитай предложение рядом.","A detail question asks about something specific. Find the words of the question in the text and read the sentence around them.",function(){return enEx("Question: Why does Dana walk?","Look for: walks ... wakes her up ... time to think.")}),
 ST_("תשובה נכונה אומרת את מה שכתוב, במילים אחרות. תשובה שגויה לפעמים משתמשת באותן מילים, אבל מספרת משהו אחר.","الإجابة الصحيحة تقول ما كُتب بكلمات أخرى. الإجابة الخاطئة قد تستعمل الكلمات نفسها لكنها تحكي شيئًا آخر.","Верный ответ говорит то, что написано, другими словами. Неверный иногда использует те же слова, но говорит другое.","A right answer says what the text says, in other words. A wrong answer sometimes uses the same words but says something else.",function(){return enEx("Text: it wakes her up","Right: It helps her feel awake.","Wrong: She wakes up late.")})];
LESSONS.infer=[
 ST_("הסקה היא להבין משהו שלא כתוב במילים. הכותב נותן רמזים, ואנחנו מחברים אותם.","الاستنتاج هو فهم شيء لم يُكتب بالكلمات. يعطي الكاتب تلميحات ونحن نربطها.","Вывод — понять то, что не написано прямо. Автор даёт подсказки, а мы их соединяем.","An inference is understanding something that is not written in words. The writer gives clues and we put them together.",function(){return enEx("Tom looked at the empty plate and then at his brother, who was smiling and holding a crumb.","Inference: His brother ate the food.")}),
 ST_("מטרת הכותב: ללמד (inform), לשכנע (persuade) או לספר (entertain). הסגנון מראה את המטרה. מילים כמו should ו-must מרמזות על שכנוע.","هدف الكاتب: أن يعلّم (inform) أو يقنع (persuade) أو يسلّي (entertain). الأسلوب يدل على الهدف. كلمات مثل should وmust تدل على الإقناع.","Цель автора: рассказать (inform), убедить (persuade) или развлечь (entertain). Стиль показывает цель. Слова should и must часто значат убеждение.","The writer's purpose: to inform, to persuade or to entertain. The style shows the purpose. Words like should and must often mean persuade.",function(){return enEx("Everyone should recycle paper. It saves trees!","Purpose: to persuade.")}),
 ST_("הטון הוא הרגש של הכותב: שמח, מודאג, ביקורתי. מילים כמו sadly או unfortunately מראות טון עצוב או מודאג.","النبرة هي شعور الكاتب: سعيد أو قلق أو ناقد. كلمات مثل sadly وunfortunately تدل على نبرة حزينة أو قلقة.","Тон — это чувство автора: радостный, тревожный, критичный. Слова sadly и unfortunately показывают грустный или тревожный тон.","Tone is the writer's feeling: happy, worried, critical. Words like sadly or unfortunately show a sad or worried tone.",function(){return enEx("Unfortunately, the old library closed last week.","Tone: sad / disappointed.")})];
LESSONS.ref=[
 ST_("מילות הפניה כמו it, they, this, those מחליפות מילה שכבר נאמרה. כדי לדעת למה הן מתכוונות, חוזרים אחורה במשפט הקודם.","كلمات الإحالة مثل it وthey وthis وthose تحلّ محل كلمة ذُكرت. لنعرف المقصود نعود إلى الجملة السابقة.","Слова it, they, this, those заменяют уже сказанное. Чтобы понять, о чём они, вернись к предыдущему предложению.","Reference words like it, they, this and those replace a word that was already said. To know what they mean, go back to the sentence before.",function(){return enEx("I bought two books. They were cheap.","They = the two books")}),
 ST_("this יכול להפנות לרעיון שלם ולא רק למילה אחת. אם אפשר להחליף את this במשפט שלם, זו הפניה לרעיון.","this قد تشير إلى فكرة كاملة وليس كلمة واحدة. إذا أمكن استبدال this بجملة كاملة فهي تحيل إلى فكرة.","this может указывать на целую мысль, а не на одно слово. Если this можно заменить целым предложением, это отсылка к мысли.","this can point to a whole idea, not only one word. If you can replace this with a whole sentence, it points to an idea.",function(){return enEx("The team lost three games in a row. This made the coach angry.","This = the team lost three games in a row.")}),
 ST_("מילות קישור מראות את מבנה הטקסט: First, Then, However, In conclusion. הן מספרות לנו איפה אנחנו בטקסט.","كلمات الربط تُظهر بناء النص: First وThen وHowever وIn conclusion. تخبرنا أين نحن في النص.","Слова-связки показывают строение текста: First, Then, However, In conclusion. Они говорят, где мы в тексте.","Linking words show the structure of a text: First, Then, However, In conclusion. They tell us where we are in the text.",function(){return enEx("First, wash the rice. Then cook it for ten minutes.","Text type: instructions.")})];
LESSONS.vocab=[
 ST_("אם לא מכירים מילה, לא עוצרים. קוראים את המשפט כולו ושואלים: איזה מובן מתאים כאן?","إذا لم نعرف كلمة فلا نتوقف. نقرأ الجملة كلها ونسأل: أي معنى يناسب هنا؟","Если слово незнакомо, не останавливайся. Прочитай всё предложение и спроси: какое значение подходит?","If you do not know a word, do not stop. Read the whole sentence and ask: which meaning fits here?",function(){return enEx("The room was so tiny that we could hardly move.","tiny = very small")}),
 ST_("רמזים מהמשפט: מילה הפוכה (but...), דוגמה, או הסבר אחרי פסיק או מקף.","تلميحات من الجملة: كلمة معاكسة (but...) أو مثال أو شرح بعد فاصلة أو شرطة.","Подсказки в предложении: противоположное слово (but...), пример или объяснение после запятой или тире.","Clues in the sentence: an opposite word (but...), an example, or an explanation after a comma or dash.",function(){return enEx("He is frugal, which means he never spends money without thinking.","frugal = careful with money")}),
 ST_("למילה אחת יש כמה מובנים. bank יכול להיות בנק וגם גדת נהר. ההקשר מחליט.","للكلمة الواحدة عدة معانٍ. bank قد تكون بنكًا أو ضفة نهر. السياق يقرر.","У одного слова бывает несколько значений. bank — это банк или берег реки. Решает контекст.","One word can have several meanings. bank can be a bank or the side of a river. The context decides.",function(){return enEx("We sat on the bank of the river.","bank = the land next to a river")})];
LESSONS.wf=[
 ST_("תחילית באה לפני המילה ומשנה את מובנה: un-, dis-, im-, re-. happy ← unhappy (לא שמח). do ← redo (לעשות שוב).","البادئة تأتي قبل الكلمة وتغيّر معناها: un- وdis- وim- وre-. happy ← unhappy (غير سعيد). do ← redo (يفعل مرة أخرى).","Приставка стоит перед словом и меняет значение: un-, dis-, im-, re-. happy → unhappy (несчастный). do → redo (сделать заново).","A prefix comes before the word and changes its meaning: un-, dis-, im-, re-. happy → unhappy. do → redo.",function(){return enEx("possible → impossible","agree → disagree","write → rewrite")}),
 ST_("סופית באה אחרי המילה ומשנה את סוג המילה: -tion ו--ment לשם עצם, -ful ו--able לשם תואר, -ly לתואר פועל.","اللاحقة تأتي بعد الكلمة وتغيّر نوعها: -tion و-ment للاسم و-ful و-able للصفة و-ly للحال.","Суффикс стоит после слова и меняет часть речи: -tion и -ment — существительное, -ful и -able — прилагательное, -ly — наречие.","A suffix comes after the word and changes its type: -tion and -ment make nouns, -ful and -able make adjectives, -ly makes adverbs.",function(){return enEx("decide → decision (noun)","care → careful (adjective)","slow → slowly (adverb)")}),
 ST_("בכל משפט שואלים איזה סוג מילה חסר: שם עצם, תואר, פועל או תואר פועל. ואז בוחרים את הצורה המתאימה.","في كل جملة نسأل أي نوع كلمة ناقص: اسم أو صفة أو فعل أو حال. ثم نختار الصيغة المناسبة.","В каждом предложении спроси, какая часть речи нужна: существительное, прилагательное, глагол или наречие. Потом выбери форму.","In each sentence ask which type of word is missing: noun, adjective, verb or adverb. Then choose the right form.",function(){return enEx("She spoke ___ . (clear)  →  clearly","adverb after a verb")})];
LESSONS.syn=[
 ST_("מילים נרדפות הן מילים עם מובן קרוב: big ו-large. הן לא תמיד זהות לגמרי, אבל מתאימות באותו משפט.","المترادفات كلمات بمعنى قريب: big وlarge. ليست دائمًا متطابقة تمامًا لكنها تناسب الجملة نفسها.","Синонимы — слова с близким значением: big и large. Они не всегда одинаковы, но подходят в одном предложении.","Synonyms are words with a close meaning: big and large. They are not always exactly the same, but they fit the same sentence.",function(){return enEx("The movie was fantastic. = The movie was wonderful.")}),
 ST_("מילים הפוכות (antonyms) הן מילים עם מובן מנוגד: hot ו-cold. לפעמים מקבלים הפכים בעזרת תחילית: possible ו-impossible.","الأضداد (antonyms) كلمات بمعنى معاكس: hot وcold. أحيانًا نصنع الضد بالبادئة: possible وimpossible.","Антонимы — слова с противоположным значением: hot и cold. Иногда антоним делает приставка: possible и impossible.","Antonyms are words with the opposite meaning: hot and cold. Sometimes a prefix makes the opposite: possible and impossible.",function(){return enEx("brave ↔ cowardly","ancient ↔ modern")}),
 ST_("בשאלה בוחרים את המילה שמתאימה למשפט, לא רק למילה. מחליפים את המילה במשפט וקוראים שוב.","في السؤال نختار الكلمة التي تناسب الجملة وليس الكلمة فقط. نبدّل الكلمة في الجملة ونقرأ مرة أخرى.","В задании выбирай слово, подходящее предложению, а не только слову. Подставь слово в предложение и перечитай.","In the question choose the word that fits the sentence, not just the word. Put it in the sentence and read again.",function(){return enEx("I was delighted to see you. → happy")})];
LESSONS.pv=[
 ST_("פועל דו־מילתי הוא פועל ומילה קטנה, והמובן משתנה: give up = להפסיק לנסות. look for = לחפש.","الفعل المركّب فعل وكلمة صغيرة ويتغير المعنى: give up = يتوقف عن المحاولة. look for = يبحث عن.","Фразовый глагол — глагол и маленькое слово, значение меняется: give up = бросить попытки. look for = искать.","A phrasal verb is a verb and a small word, and the meaning changes: give up = stop trying. look for = search for.",function(){return enEx("Don't give up!","I am looking for my keys.")}),
 ST_("לפעלים ולשמות תואר יש מילת יחס קבועה: depend on, afraid of, good at, interested in. כדאי ללמוד אותם יחד.","للأفعال والصفات حرف جر ثابت: depend on وafraid of وgood at وinterested in. من الأفضل حفظها معًا.","У глаголов и прилагательных есть свой предлог: depend on, afraid of, good at, interested in. Учи их вместе.","Verbs and adjectives have a fixed preposition: depend on, afraid of, good at, interested in. Learn them together.",function(){return enEx("She is good at math.","He is interested in music.")}),
 ST_("מילות יחס של זמן ומקום: in (חודש, שנה, חדר), on (יום, תאריך), at (שעה, נקודה). in May, on Monday, at 5 o'clock.","حروف الزمان والمكان: in (شهر وسنة وغرفة) وon (يوم وتاريخ) وat (ساعة ونقطة). in May وon Monday وat 5 o'clock.","Предлоги времени и места: in (месяц, год, комната), on (день, дата), at (час, точка). in May, on Monday, at 5 o'clock.","Prepositions of time and place: in (month, year, room), on (day, date), at (hour, point). in May, on Monday, at 5 o'clock.",function(){return enEx("in May   on Monday   at 5 o'clock")})];
LESSONS.coll=[
 ST_("צירוף מילים הוא שתי מילים שהולכות יחד. אומרים make a decision ולא do a decision. הצירופים נלמדים בעל פה, בזוגות.","المتلازمة كلمتان تأتيان معًا. نقول make a decision وليس do a decision. نحفظها كأزواج.","Сочетание — два слова, которые идут вместе. Говорят make a decision, а не do a decision. Сочетания учат парами.","A collocation is two words that go together. We say make a decision, not do a decision. Learn collocations as pairs.",function(){return enEx("make a mistake   do homework","take a break   have a shower")}),
 ST_("make בדרך כלל יוצר משהו חדש (make a cake). do הוא פעולה או עבודה (do homework, do the dishes).","make عادةً ينتج شيئًا جديدًا (make a cake). do عمل أو نشاط (do homework وdo the dishes).","make обычно создаёт новое (make a cake). do — действие или работа (do homework, do the dishes).","make usually creates something new (make a cake). do is an action or a job (do homework, do the dishes).",function(){return enEx("make a plan   do your best")}),
 ST_("ניב (idiom) אי אפשר לתרגם מילה במילה: it's a piece of cake = זה קל מאוד. מבינים אותו מההקשר.","التعبير الاصطلاحي (idiom) لا يُترجم كلمة بكلمة: it's a piece of cake = إنه سهل جدًا. نفهمه من السياق.","Идиому нельзя переводить слово в слово: it's a piece of cake = это очень легко. Смысл понятен из контекста.","An idiom cannot be translated word for word: it's a piece of cake = it is very easy. You understand it from the context.",function(){return enEx("It's raining cats and dogs. = It's raining very hard.")})];
LESSONS.tense=[
 ST_("הווה פשוט להרגל ולעובדה: She plays tennis every day. הווה ממשיך למה שקורה עכשיו: She is playing now.","المضارع البسيط للعادة والحقيقة: She plays tennis every day. المضارع المستمر لما يحدث الآن: She is playing now.","Present simple — привычка и факт: She plays tennis every day. Present continuous — то, что происходит сейчас: She is playing now.","Present simple is for habits and facts: She plays tennis every day. Present continuous is for now: She is playing now.",function(){return enEx("He works in a bank. (every day)","He is working now.")}),
 ST_("עבר פשוט לדבר שנגמר בזמן מסוים: We visited Rome last year. הווה מושלם (have + צורה שלישית) כשהזמן לא חשוב או שזה קשור להווה: I have visited Rome.","الماضي البسيط لشيء انتهى في وقت محدد: We visited Rome last year. المضارع التام (have + التصريف الثالث) عندما لا يهم الوقت أو يرتبط بالحاضر: I have visited Rome.","Past simple — действие закончилось в определённое время: We visited Rome last year. Present perfect (have + третья форма) — время неважно или связь с настоящим: I have visited Rome.","Past simple is for something finished at a certain time: We visited Rome last year. Present perfect (have + third form) is for no clear time or a link to now: I have visited Rome.",function(){return enEx("I saw him yesterday.","I have seen him before.")}),
 ST_("מילות זמן עוזרות לבחור: yesterday, ago, last → עבר פשוט. already, yet, ever, never, for, since → הווה מושלם. tomorrow, next → will.","كلمات الزمن تساعد: yesterday وago وlast ← ماضٍ بسيط. already وyet وever وnever وfor وsince ← مضارع تام. tomorrow وnext ← will.","Слова-маркеры помогают: yesterday, ago, last → past simple. already, yet, ever, never, for, since → present perfect. tomorrow, next → will.","Time words help you choose: yesterday, ago, last → past simple. already, yet, ever, never, for, since → present perfect. tomorrow, next → will.",function(){return enEx("She lived here two years ago.","She has lived here for two years.")})];
LESSONS.cond=[
 ST_("תנאי אפשרי: If + הווה, will + פועל. If it rains, we will stay home.","شرط ممكن: If + مضارع وwill + فعل. If it rains, we will stay home.","Реальное условие: If + настоящее, will + глагол. If it rains, we will stay home.","Real condition: If + present, will + verb. If it rains, we will stay home.",function(){return enEx("If I study, I will pass.")}),
 ST_("תנאי לא מציאותי בהווה: If + עבר, would + פועל. If I had more time, I would learn Spanish. ב-wish משתמשים בעבר: I wish I had a bike.","شرط غير واقعي في الحاضر: If + ماضٍ وwould + فعل. If I had more time, I would learn Spanish. مع wish نستعمل الماضي: I wish I had a bike.","Нереальное условие сейчас: If + прошедшее, would + глагол. If I had more time, I would learn Spanish. После wish — прошедшее: I wish I had a bike.","Unreal condition now: If + past, would + verb. If I had more time, I would learn Spanish. After wish we use the past: I wish I had a bike.",function(){return enEx("If I were you, I would call her.","I wish I knew the answer.")}),
 ST_("תנאי על העבר שלא קרה: If + had + צורה שלישית, would have + צורה שלישית. If I had left earlier, I would have caught the bus.","شرط عن الماضي الذي لم يحدث: If + had + التصريف الثالث وwould have + التصريف الثالث. If I had left earlier, I would have caught the bus.","Условие о прошлом, которого не было: If + had + третья форма, would have + третья форма. If I had left earlier, I would have caught the bus.","Condition about a past that did not happen: If + had + third form, would have + third form. If I had left earlier, I would have caught the bus.",function(){return enEx("If she had studied, she would have passed.")})];
LESSONS.pass=[
 ST_("סביל: מה שקרה לדבר חשוב יותר מי עשה. be + צורה שלישית. The window was broken. Active: Someone broke the window.","المبني للمجهول: ما حدث للشيء أهم ممن فعله. be + التصريف الثالث. The window was broken.","Страдательный залог: важнее, что случилось с предметом, а не кто сделал. be + третья форма. The window was broken.","Passive: what happened to the thing matters more than who did it. be + third form. The window was broken.",function(){return enEx("Active: They built the bridge in 1990.","Passive: The bridge was built in 1990.")}),
 ST_("זמן ה-be קובע את זמן המשפט: is made (הווה), was made (עבר), will be made (עתיד), has been made (מושלם).","زمن be يحدد زمن الجملة: is made (مضارع) وwas made (ماضٍ) وwill be made (مستقبل) وhas been made (تام).","Время be задаёт время предложения: is made (настоящее), was made (прошедшее), will be made (будущее), has been made (perfect).","The tense of be sets the tense of the sentence: is made (present), was made (past), will be made (future), has been made (perfect).",function(){return enEx("Cheese is made from milk.","The letter will be sent tomorrow.")}),
 ST_("דיבור עקיף: מחזירים צעד אחורה בזמן ומשנים כינויים. \"I am tired,\" she said → She said that she was tired.","الكلام المنقول: نرجع خطوة إلى الماضي ونغيّر الضمائر. \"I am tired,\" she said → She said that she was tired.","Косвенная речь: сдвигаем время назад и меняем местоимения. \"I am tired,\" she said → She said that she was tired.","Reported speech: go one step back in time and change the pronouns. \"I am tired,\" she said → She said that she was tired.",function(){return enEx("\"I will help,\" he said.","He said that he would help.")})];
LESSONS.mod=[
 ST_("can ו-could: יכולת. must: חובה חזקה. have to: חובה מבחוץ. should: עצה. after a modal comes the base verb, without to.","can وcould: قدرة. must: واجب قوي. have to: واجب من الخارج. should: نصيحة. بعد الفعل المساعد يأتي الفعل الأساسي بلا to.","can и could — умение. must — сильная обязанность. have to — обязанность извне. should — совет. После модального глагола идёт глагол без to.","can and could: ability. must: strong duty. have to: duty from outside. should: advice. After a modal comes the base verb, without to.",function(){return enEx("You should drink water.","She can swim.")}),
 ST_("might ו-may: אולי. must be: בטוח שכן. can't be: בטוח שלא. He must be at home (אני בטוח). He might be at home (אולי).","might وmay: ربما. must be: متأكد أنه كذلك. can't be: متأكد أنه ليس كذلك. He must be at home (أنا متأكد). He might be at home (ربما).","might и may — возможно. must be — уверен, что так. can't be — уверен, что нет. He must be at home (уверен). He might be at home (возможно).","might and may: maybe. must be: sure it is true. can't be: sure it is not true. He must be at home (I am sure). He might be at home (maybe).",function(){return enEx("The lights are on. They must be home.")}),
 ST_("don't have to: אין חובה. mustn't: אסור. שני אלה שונים מאוד! You don't have to come (לא חייב). You mustn't come (אסור).","don't have to: لا يلزم. mustn't: ممنوع. الاثنان مختلفان جدًا! You don't have to come (لا يلزمك). You mustn't come (ممنوع).","don't have to — не обязательно. mustn't — нельзя. Это очень разные вещи! You don't have to come (не обязан). You mustn't come (нельзя).","don't have to: not necessary. mustn't: forbidden. These are very different! You don't have to come. You mustn't come.",function(){return enEx("You don't have to pay. (it is free)","You mustn't smoke here. (it is forbidden)")})];
LESSONS.conn=[
 ST_("but ו-however מראים ניגוד. although ו-even though גם. because ו-since מסבירים סיבה. so ו-therefore מראים תוצאה.","but وhowever تدلّان على التناقض. although وeven though كذلك. because وsince تشرحان السبب. so وtherefore تدلان على النتيجة.","but и however — противопоставление. although и even though — тоже. because и since — причина. so и therefore — результат.","but and however show contrast. although and even though too. because and since give a reason. so and therefore show a result.",function(){return enEx("It was cold, but we went out.","It was cold, so we stayed in.")}),
 ST_("although פותח משפט משנה: Although it was cold, we went out. however עומד לבד: It was cold. However, we went out.","although تفتح جملة فرعية: Although it was cold, we went out. however تقف وحدها: It was cold. However, we went out.","although начинает придаточное: Although it was cold, we went out. however стоит отдельно: It was cold. However, we went out.","although starts a smaller clause: Although it was cold, we went out. however stands alone: It was cold. However, we went out.",function(){return enEx("Although she was tired, she kept working.","She was tired. However, she kept working.")}),
 ST_("קישורים לסדר: first, then, after that, finally. להוספה: also, moreover, in addition. לסיכום: in conclusion.","ربط الترتيب: first وthen وafter that وfinally. للإضافة: also وmoreover وin addition. للخلاصة: in conclusion.","Для порядка: first, then, after that, finally. Для добавления: also, moreover, in addition. Для итога: in conclusion.","For order: first, then, after that, finally. To add: also, moreover, in addition. To end: in conclusion.",function(){return enEx("First, mix the eggs. Then add the flour. Finally, bake.")})];
LESSONS.write=[
 ST_("פסקה טובה: משפט פותח עם הרעיון, אחריו שניים־שלושה משפטים עם פרטים, ובסוף משפט סיכום. כל פסקה היא רעיון אחד.","فقرة جيدة: جملة افتتاحية بالفكرة ثم جملتان أو ثلاث بتفاصيل وجملة ختامية. كل فقرة فكرة واحدة.","Хороший абзац: первое предложение с идеей, потом два-три предложения с деталями и итоговое. Один абзац — одна идея.","A good paragraph: an opening sentence with the idea, two or three sentences with details, and a closing sentence. One paragraph is one idea.",function(){return enEx("I think students need more sleep. First, ... Second, ... That is why school should start later.")}),
 ST_("מכתב רשמי: Dear Sir or Madam / Dear Mr Cohen, נושא ברור, שפה מנומסת בלי קיצורים (I am writing to... ולא I'm), ובסוף Yours sincerely או Yours faithfully.","رسالة رسمية: Dear Sir or Madam / Dear Mr Cohen، موضوع واضح ولغة مهذبة بلا اختصارات (I am writing to... وليس I'm) وفي النهاية Yours sincerely أو Yours faithfully.","Официальное письмо: Dear Sir or Madam / Dear Mr Cohen, ясная тема, вежливый язык без сокращений (I am writing to..., а не I'm), в конце Yours sincerely или Yours faithfully.","Formal letter: Dear Sir or Madam / Dear Mr Cohen, a clear subject, polite language without short forms (I am writing to..., not I'm), and Yours sincerely or Yours faithfully at the end.",function(){return enEx("Dear Mr Cohen,","I am writing to ask about the summer course.","Yours sincerely,")}),
 ST_("דעה: אומרים מה חושבים (In my opinion), נותנים שתי סיבות (because, for example) ומסכמים (To sum up). בלי להעתיק מהשאלה.","الرأي: نقول ما نفكر به (In my opinion) ونعطي سببين (because وfor example) ونختم (To sum up). دون نسخ السؤال.","Мнение: говорим, что думаем (In my opinion), даём две причины (because, for example) и подводим итог (To sum up). Не копируй вопрос.","Opinion: say what you think (In my opinion), give two reasons (because, for example) and end (To sum up). Do not copy the question.",function(){return enEx("In my opinion, uniforms are a good idea. For example, ... To sum up, ...")})];
LESSONS.lit=[
 ST_("סיפור כולל דמות, מקום וזמן (setting), בעיה (conflict) ופתרון. בשאלות מחפשים את הרגע שבו הבעיה מתחילה.","القصة فيها شخصية ومكان وزمان (setting) ومشكلة (conflict) وحل. في الأسئلة نبحث عن اللحظة التي تبدأ فيها المشكلة.","В рассказе есть герой, место и время (setting), проблема (conflict) и решение. В вопросах ищем момент, где начинается проблема.","A story has a character, a place and time (setting), a problem (conflict) and a solution. In questions, look for the moment the problem starts.",function(){return enEx("Setting: a small village in winter.","Conflict: the road is closed.")}),
 ST_("איך מכירים דמות? מה היא אומרת, מה היא עושה ומה אחרים אומרים עליה. אל תנחשו, אלא הוכיחו מהטקסט.","كيف نعرف الشخصية؟ ماذا تقول وماذا تفعل وماذا يقول الآخرون عنها. لا نخمّن بل نثبت من النص.","Как узнать героя? Что он говорит, что делает и что о нём говорят другие. Не гадай, а доказывай текстом.","How do we know a character? What she says, what she does and what others say about her. Do not guess, prove it from the text.",function(){return enEx("She gave her only coat to the stranger.","Character: generous.")}),
 ST_("דימוי (simile) משווה בעזרת like או as: as brave as a lion. מטפורה אומרת שדבר הוא דבר אחר: Time is money. המסר (theme) הוא הרעיון הגדול של הסיפור.","التشبيه (simile) يقارن بـ like أو as: as brave as a lion. الاستعارة تقول إن شيئًا هو شيء آخر: Time is money. الرسالة (theme) هي الفكرة الكبيرة للقصة.","Сравнение (simile) использует like или as: as brave as a lion. Метафора говорит, что одно — это другое: Time is money. Идея (theme) — главная мысль рассказа.","A simile compares with like or as: as brave as a lion. A metaphor says one thing is another: Time is money. The theme is the big idea of the story.",function(){return enEx("Her voice was like music. (simile)","The classroom was a zoo. (metaphor)")})];
