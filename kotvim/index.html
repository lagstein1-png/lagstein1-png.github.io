<style>
/* ============================================================
   אולפן — עברית מעשית לעולים חדשים
   קהל היעד אינו "לא יודע עברית". הוא חי בעברית כל יום ונכשל בה
   כל יום — בקופת חולים, בטופס, מול פקיד — ולכן כל החלטה כאן
   נמדדת בשאלה אחת: האם היא מורידה עומס, או מוסיפה.
   · שום מילה עברית לא מוצגת בלי שאפשר לשמוע אותה.
   · לצד כל מילה יש ניקוד. מי שקורא לאט קורא אותיות, לא מילים,
     ובלי ניקוד הוא מנחש תנועה ומקבל מילה אחרת.
   · שפת האם היא פיגום, לא קביים — היא נסוגה עם העלייה ברמה.
   · Noto Sans Arabic נטען לצד Heebo: Heebo אינו מכיל גליפים
     ערביים, ובלעדיו הממשק הערבי נופל לגופן ברירת המחדל.
   כל המידות ב-rem, כדי שהגדלת טקסט תגדיל את הכול יחד.
   ============================================================ */
:root{
  --font:"Heebo","Rubik",system-ui,"Segoe UI",Arial,sans-serif;
  --ar:"Noto Sans Arabic","Heebo",system-ui,"Segoe UI",Arial,sans-serif;
  --ru:"Noto Sans","Heebo",system-ui,"Segoe UI",Arial,sans-serif;   /* קירילית — Heebo אינו מכיל אותה, נמדד 7.9 */
  --lrn:"Heebo","Rubik",system-ui,"Segoe UI",Arial,sans-serif;
  --bg:#faf7f2; --surface:#ffffff; --surface2:#f0e9df;
  --ink:#1f1a14; --muted:#5c5147; --faint:#7f6a52; --line:#e5dbcc;
  --accent:#8a5a2b; --accent-ink:#ffffff; --accent-soft:#f3e3d1;
  --gold:#a16207; --gold-soft:#fbf0d5; --hit:#f5c451; --hit-ink:#1a1300;
  --ok:#15803d; --ok-soft:#dcfce7; --bad:#be123c; --bad-soft:#ffe4e9;
  --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(31,26,20,.05),0 8px 24px -12px rgba(31,26,20,.2);
  --r:14px;
  /* צבע לכל מסלול. לא קישוט: ארבעה סוגי לימוד שונים לגמרי, וצבע
     קבוע לכל אחד חוסך למי שמתקשה להתמצא את השאלה "איפה אני". */
  --c-sound:#0369a1; --cs-sound:#dbeefc;   /* אות וצליל      */
  --c-words:#15803d; --cs-words:#dcfce7;   /* מילים          */
  --c-talk:#c2410c;  --cs-talk:#fde5d8;    /* מדוברת         */
  --c-read:#6d28d9;  --cs-read:#eae2fd;    /* שלטים וטפסים   */
}
:root[data-theme="dark"]{
  --bg:#17120d; --surface:#221b14; --surface2:#2e251b;
  --ink:#f2ece3; --muted:#b3a595; --faint:#8a7c6c; --line:#3a2f23;
  --accent:#e8c9a0; --accent-ink:#17120d; --accent-soft:#3a2c1c;
  --gold:#fbbf24; --gold-soft:#33270f; --hit:#ffd24d; --hit-ink:#241a00;
  --ok:#4ade80; --ok-soft:#132a1c; --bad:#fb7185; --bad-soft:#33161f;
  --warn:#fbbf24; --warn-soft:#33260f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  --c-sound:#7dd3fc; --cs-sound:#0b2a3d;
  --c-words:#86efac; --cs-words:#0f2a1a;
  --c-talk:#fdba74;  --cs-talk:#3a2113;
  --c-read:#c4b5fd;  --cs-read:#261a45;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d1b1a; --surface:#142624; --surface2:#1c3230;
    --ink:#e6f0ee; --muted:#9ab0aa; --faint:#6f8781; --line:#264240;
    --accent:#5eead4; --accent-ink:#0d1b1a; --accent-soft:#123c37;
    --gold:#fbbf24; --gold-soft:#33270f; --hit:#ffd24d; --hit-ink:#241a00;
    --ok:#4ade80; --ok-soft:#132a1c; --bad:#fb7185; --bad-soft:#33161f;
    --warn:#fbbf24; --warn-soft:#33260f;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
    --c-sound:#7dd3fc; --cs-sound:#0b2a3d;
    --c-words:#86efac; --cs-words:#0f2a1a;
    --c-talk:#fdba74;  --cs-talk:#3a2113;
    --c-read:#c4b5fd;  --cs-read:#261a45;
  }
}
/* ניגודיות גבוהה — שחור על לבן, מסגרות מלאות, בלי גוונים רכים */
:root.hc{
  --bg:#ffffff; --surface:#ffffff; --surface2:#ffffff;
  --ink:#000000; --muted:#1a1a1a; --faint:#333333; --line:#000000;
  --accent:#00434b; --accent-ink:#ffffff; --accent-soft:#e6f2f3;
  --gold:#5c3d00; --gold-soft:#f7efdf; --hit:#ffe600; --hit-ink:#000000;
  --ok:#0a5c2a; --ok-soft:#e6f4ea; --bad:#8c0f2c; --bad-soft:#fbe9ed;
  --warn:#6b3d00; --warn-soft:#f7efdf; --shadow:none;
  --c-sound:#00305c; --cs-sound:#e8eef7;
  --c-words:#0a5c2a; --cs-words:#e6f4ea;
  --c-talk:#7a2c00;  --cs-talk:#f9ece4;
  --c-read:#3d1a75;  --cs-read:#eee8f9;
}
:root.hc *{box-shadow:none!important}
:root.hc .card,:root.hc .btn,:root.hc .opt{border-width:2px!important}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs,17px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  font-size:1rem;line-height:1.65;-webkit-text-size-adjust:100%}
:root.clear body{font-family:"Verdana","Tahoma","Heebo",sans-serif;letter-spacing:.012em}
:root.spaced body{word-spacing:.22em;line-height:1.95}
:root.rm *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
/* הגדרת המערכת ולא רק המתג שבאפליקציה: מי שכיבה אנימציות במכשיר
   ציפה שזה יחול גם כאן. */
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
h1,h2,h3{margin:0;line-height:1.3;font-weight:800}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* החומר הנלמד — עברית — בכיוון, בגופן ובמרווח משלו. unicode-bidi:isolate
   מונע מהמשפט העברי לגרור אחריו את סימני הפיסוק של המשפט הרוסי או האנגלי
   שלצידו, וזה קורה בדיוק במקום שבו הלומד קורא לאט וזקוק ליציבות. */
html[lang="ar"] body{font-family:var(--ar)}
html[lang="ru"] body{font-family:var(--ru)}
.lrn{font-family:var(--lrn);direction:rtl;unicode-bidi:isolate;text-align:start}
.lrn-b{font-family:var(--lrn);direction:rtl;unicode-bidi:isolate;display:inline-block}
.tr-b{font-family:system-ui,"Segoe UI",Arial,sans-serif;direction:ltr;
  unicode-bidi:isolate;display:inline-block;color:var(--muted)}

.wrap{max-width:56rem;margin:0 auto;padding:0 clamp(.9rem,3vw,1.5rem)}
.hbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-block:.6rem}
:root.hc .hbar{background:var(--bg);backdrop-filter:none}
.hrow{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
.brand{font-size:1.35rem;font-weight:800;letter-spacing:-.01em;display:flex;
  align-items:baseline;gap:.5rem;margin-inline-end:auto}
.brand small{font-size:.72rem;font-weight:600;color:var(--muted);letter-spacing:.06em}
.gbtn{display:inline-flex;align-items:center;gap:.4rem;background:var(--surface);
  border:1px solid var(--line);border-radius:999px;padding:.42rem .8rem;cursor:pointer;
  font-size:.86rem;font-weight:600;box-shadow:var(--shadow);min-height:44px}
.gbtn:hover{border-color:var(--accent)}
.gbtn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:1.1rem}
.grid{display:grid;gap:.85rem}
@media(min-width:640px){.g2{grid-template-columns:1fr 1fr}}
@media(min-width:900px){.g3{grid-template-columns:repeat(3,1fr)}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;
  border:1px solid var(--line);background:var(--surface);border-radius:12px;
  padding:.72rem 1.1rem;font-weight:700;cursor:pointer;box-shadow:var(--shadow);
  min-height:2.9rem;font-size:1rem}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;box-shadow:none}
.btn[disabled]{opacity:.45;cursor:default}
.btn.wide{width:100%}
/* מודול המבחן הכיתתי הועתק ממשפחת math-uni, ושם .btn-p ו-.btn.w
   מוגדרים. כאן הם לא היו, ולכן "מבחן חדש", "צרו את המבחן", "התחלת
   מבחן" וכפתורי הוואטסאפ נראו ככפתור ריק בלי צבע — טקסט קטן עם פלוס.
   כחול, ולא טורקיז: זה כפתור של המורה, ובולט מכל שאר המסך. */
.btn-p{background:#2563eb;color:#fff;border-color:#2563eb}
.btn-p:hover{filter:brightness(1.1);border-color:#2563eb}
.btn.w{width:100%}

.chip{display:inline-flex;align-items:center;gap:.35rem;border-radius:999px;
  padding:.22rem .6rem;font-size:.78rem;font-weight:700;background:var(--surface2);color:var(--muted)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}

/* ===== מסלולים: הצבע נכנס ככרטיס, לא כרקע של טקסט ===== */
.trk{--c:var(--accent);--cs:var(--accent-soft)}
.t-sound{--c:var(--c-sound);--cs:var(--cs-sound)}
.t-words{--c:var(--c-words);--cs:var(--cs-words)}
.t-talk{--c:var(--c-talk); --cs:var(--cs-talk)}
.t-read{--c:var(--c-read); --cs:var(--cs-read)}
.tcard{border-inline-start:5px solid var(--c);cursor:pointer;text-align:start;width:100%;
  display:flex;flex-direction:column;gap:.4rem;align-items:stretch}
.tcard:hover{border-color:var(--c)}
.tcard h3{font-size:1.05rem}
.tcard .sub{font-size:.85rem;color:var(--muted)}
.tdot{width:.62rem;height:.62rem;border-radius:50%;background:var(--c);flex:none}
.thead{display:flex;align-items:center;gap:.5rem}
.tpill{background:var(--cs);color:var(--c);border-radius:999px;padding:.15rem .55rem;
  font-size:.72rem;font-weight:800}

/* ===== סרגל שליטה ברמות ===== */
.lvls{display:flex;gap:.4rem;flex-wrap:wrap}
.lvl{border:1px solid var(--line);background:var(--surface);border-radius:10px;
  padding:.4rem .7rem;font-size:.82rem;font-weight:700;cursor:pointer;
  display:inline-flex;align-items:center;gap:.4rem}
.lvl.on{background:var(--c,var(--accent));color:var(--accent-ink);border-color:var(--c,var(--accent))}
.bar{height:.42rem;border-radius:999px;background:var(--surface2);overflow:hidden;flex:1;min-width:3rem}
.bar i{display:block;height:100%;background:var(--c,var(--accent))}
.bar.b0 i{background:var(--bad)} .bar.b1 i{background:var(--warn)} .bar.b2 i{background:var(--ok)}

/* ===== תרגול ===== */
.qcard{border-top:5px solid var(--c,var(--accent))}
.qtop{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.7rem}
.qtext{font-size:1.12rem;font-weight:600;margin:.2rem 0 .3rem}
.qhint{color:var(--muted);font-size:.9rem}
/* המילה או המשפט שנלמדים. גדול, מרווח, ותמיד לצד כפתור השמעה. */
.subject{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;
  background:var(--surface2);border-radius:12px;padding:.85rem 1rem;margin:.5rem 0}
.subject .word{font-family:var(--lrn);direction:rtl;unicode-bidi:isolate;
  font-size:1.7rem;font-weight:700;letter-spacing:.01em;line-height:1.25}
/* התעתיק הוא לטיני ולכן LTR — הוא נועד למי שעדיין אינו קורא אות
   עברית בכלל, ובלעדיו רמה 1 חסומה בפניו לגמרי. */
.subject .ipa{font-family:system-ui,"Segoe UI",Arial,sans-serif;direction:ltr;
  unicode-bidi:isolate;color:var(--muted);font-size:.95rem;letter-spacing:.02em}
.spk{border:1px solid var(--line);background:var(--surface);border-radius:999px;
  width:2.7rem;height:2.7rem;display:inline-flex;align-items:center;justify-content:center;
  cursor:pointer;flex:none;box-shadow:var(--shadow)}
.spk:hover{border-color:var(--accent);color:var(--accent)}
.spk.sm{width:2.1rem;height:2.1rem}
.spk.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.opts{display:grid;gap:.6rem;margin-top:.9rem}
@media(min-width:560px){.opts.two{grid-template-columns:1fr 1fr}}
.opt{display:flex;align-items:center;gap:.6rem;text-align:start;width:100%;
  border:2px solid var(--line);background:var(--surface);border-radius:12px;
  padding:.8rem .9rem;cursor:pointer;font-size:1.02rem;font-weight:600;min-height:3.1rem}
.opt:hover{border-color:var(--accent)}
.opt .k{width:1.9rem;height:1.9rem;border-radius:8px;background:var(--surface2);
  display:inline-flex;align-items:center;justify-content:center;font-size:.85rem;
  font-weight:800;color:var(--muted);flex:none}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .k{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .k{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
/* נסיגה בצבע ולא בשקיפות: opacity:.55 הוריד את הטקסט ל-3.87:1
   ואת אות הסימון ל-2.37:1, ואחרי המענה קריאת המסיח היא הלמידה. */
.opt.dim{color:var(--muted);border-color:var(--line);box-shadow:none}
.opt.dim .k{background:var(--surface2);color:var(--muted)}

/* אריחי בניית משפט. הסדר הוא התרגיל, ולכן האריח חייב להיראות כמשהו
   שאפשר להרים — מסגרת מלאה ורקע משלו, לא טקסט על רקע הכרטיס. */
.tiles{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:.7rem}
.tile{font-family:var(--lrn);direction:rtl;border:2px solid var(--line);
  background:var(--surface);border-radius:10px;padding:.5rem .8rem;font-weight:600;
  cursor:pointer;font-size:1.02rem;min-height:2.7rem}
.tile:hover{border-color:var(--accent)}
.slot{min-height:3.2rem;border:2px dashed var(--line);border-radius:12px;
  background:var(--surface2);padding:.5rem;display:flex;flex-wrap:wrap;gap:.45rem;
  align-items:center;direction:ltr}
.slot.ok{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.slot.bad{border-style:solid;border-color:var(--bad);background:var(--bad-soft)}
.slot .tile{background:var(--surface)}

/* ===== משוב ===== */
.fb{margin-top:.9rem;border-radius:12px;padding:.85rem 1rem;border:1px solid transparent}
.fb.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.fb.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.fb b{display:block;font-size:1.02rem;margin-bottom:.2rem}
.fb .body{color:var(--ink);font-weight:500;font-size:.95rem}
.why{margin-top:.55rem;padding-top:.55rem;border-top:1px dashed currentColor;color:var(--ink);
  font-weight:500;font-size:.93rem}

/* ===== קטע קריאה ===== */
.passage{background:var(--surface2);border-radius:12px;padding:1rem 1.1rem;margin:.6rem 0;
  font-family:var(--lrn);direction:rtl;unicode-bidi:isolate;font-size:1.08rem;line-height:2}
.passage .s{border-radius:5px;padding:.05em .12em;cursor:pointer}
.passage .s:hover{background:var(--accent-soft)}
.passage .s.now{background:var(--accent-soft);box-shadow:0 2px 0 var(--accent)}
.wd{border-radius:5px;padding:1px 3px}
.wd.hit{background:var(--hit);color:var(--hit-ink);font-weight:600}
/* כשמנוע הדיבור אינו מדווח על גבולות מילים — קורה הרבה בעברית
   באנדרואיד — אין מה להדגיש מילה־מילה, ואז מודגש כל האיבר. הכלל
   שקיים כאן מכוון למשפט בתוך קטע קריאה בלבד, ולכן ההדגשה החלופית
   על איבר אחר לא נראתה כלל. */
.wd.now,p.now,div.now,span.now,b.now{background:var(--hit);color:var(--hit-ink);
  border-radius:8px;box-shadow:0 0 0 4px var(--hit)}
.gloss{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.5rem}
.gword{border:1px solid var(--line);background:var(--surface);border-radius:999px;
  padding:.25rem .6rem;font-size:.85rem;cursor:pointer}
.gword b{font-family:var(--lrn);direction:rtl;unicode-bidi:isolate}

/* ===== סרגל מצב הקול ===== */
.vstrip{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;border-radius:10px;
  padding:.45rem .7rem;font-size:.85rem;font-weight:600;margin-bottom:.7rem}
.vstrip.ok{background:var(--ok-soft);color:var(--ok)}
.vstrip.warn{background:var(--warn-soft);color:var(--warn)}
.vstrip.bad{background:var(--bad-soft);color:var(--bad)}
.vstrip .btn{padding:.3rem .7rem;min-height:44px;font-size:.82rem}  /* 2.1rem היו 36 פיקסלים — מתחת ליעד המגע */

/* ===== הגדרות ===== */
.row{display:flex;align-items:center;justify-content:space-between;gap:.8rem;
  padding:.7rem 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row:last-child{border-bottom:0}

/* ---------- שדה קלט של המבחן ----------
   מודול המבחן הועתק לכאן מאפליקציה שבה .field כבר היה מוגדר.
   בלי הכלל הזה שדה השם של הנבחן נשאר תיבת ברירת המחדל של
   הדפדפן — 21 פיקסלים גובה, הרבה מתחת ליעד המגע של 44. */
.field{width:100%;box-sizing:border-box;font:inherit;font-size:1rem;
  min-height:48px;padding:12px 14px;border-radius:11px;outline:none;background:var(--surface2);color:inherit;border:1px solid var(--line)}

/* ---------- שורות המבחן ----------
   .tog הגיע ממודול המבחן שהועתק לכאן, ולא היה לו עיצוב כלל: השם
   והמידע שמתחתיו נדבקו לשורה אחת בלי רווח. */
.tog{display:flex;align-items:center;gap:13px;width:100%;text-align:start;

  padding:13px 15px;min-width:0}

   15 פיקסלים — וזה קטן מדי לאצבע, גם כשהוא רק לתנאי השימוש. */
.lg-foot a{display:inline-flex;align-items:center;min-height:44px;padding-inline:6px}

/* ---------- יעדי מגע ----------
   .lvl יצא 39 פיקסלים ומתג ה-.sw רק 31, שניהם מתחת ל-44 שהפרויקט
   מחייב את עצמו בהם. במתג לא מגדילים את המסילה — היא תיראה מגושמת —
   אלא מרחיבים את שטח הלחיצה סביבה. */
.lvl{min-height:44px}
.sw{position:relative}
.sw::after{content:"";position:absolute;inset-block:-7px;inset-inline:-4px}

/* ---------- מסך בניית המבחן ----------
   .seg ו-.tpc הגיעו עם מודול המבחן שהועתק לכאן, ולא היה להם עיצוב:
   כפתורי הבחירה יצאו 34 פיקסלים, וכרטיסי הנושאים 6 פיקסלים בלבד —
   כלומר המורה לא יכול היה לבחור נושאים בכלל. */
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 auto;min-width:0;min-height:44px;border:1px solid var(--line);

  font-weight:600;font-size:.9rem;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.tpc{position:relative;display:flex;flex-direction:column;gap:9px;text-align:start;
  background:var(--surface);border:1px solid var(--line);
  border-inline-start:4px solid var(--c,var(--accent));border-radius:12px;padding:14px;
  box-shadow:var(--shadow);min-width:0;min-height:44px;cursor:pointer;font:inherit;color:inherit}
.tpc.on{border-color:var(--accent);background:var(--accent-soft)}
.tpc .tn{font-weight:700;font-size:.98rem;overflow-wrap:anywhere;color:var(--c,var(--ink))}
.tpc .td{color:var(--muted);font-size:.8rem;overflow-wrap:anywhere}

/* טקסט על רקע ההדגשה: --accent-ink ולא לבן קבוע. במצב כהה
   ההדגשה בהירה, ולבן עליה יצא 1.5–2.0:1 — כמעט בלתי קריא. */

var DEMO={on:false,i:0,timer:null,extra:[],bar:null,txt:null,step:null,fill:null,btn:null};

/* עוזרים לתסריט. כולם מחזירים false כשהאיבר אינו על המסך, כדי
   שצעד שלא מצא את מה שחיפש ידלג ולא יפיל את ההדגמה כולה. */
function demoEl(s){return typeof s==="string"?document.querySelector(s):s}
function demoShow(s){
  var e=demoEl(s); if(!e)return false;
  try{e.scrollIntoView({behavior:"smooth",block:"center"})}catch(err){try{e.scrollIntoView()}catch(err2){}}
  return true;
}
/* מדגיש את האיבר, ורק אז לוחץ — צופה שלא ראה לאן נלחץ לא הבין
   מה קרה. לכן אין צעד קצר מ-1200 אלפיות בתסריטים. */
function demoTap(s){
  var e=demoEl(s); if(!e||e.disabled)return false;
  demoShow(e);
  e.classList.add("demo-tap");
  DEMO.extra.push(setTimeout(function(){
    e.classList.remove("demo-tap");
    /* המסך מצטייר מחדש כל הזמן. אם האיבר שסומן כבר אינו במסמך,
       מחפשים אותו שוב לפי אותו בורר — לחיצה על איבר מת אינה
       עושה דבר, וזה בדיוק צעד שנראה כאילו נתקע. */
    var live=(typeof s==="string"&&!document.contains(e))?demoEl(s):e;
    if(DEMO.on&&live&&!live.disabled&&document.contains(live))try{live.click()}catch(err){}
  },430));
  return true;
}
function demoClick(s){
  var e=demoEl(s); if(!e||e.disabled)return false;
  try{e.click()}catch(err){return false}
  return true;
}
/* הקלדה אות אחר אות, עם אירוע input אמיתי — שדה חיפוש שמאזין
   ל-input לא היה מגיב להשמה ישירה ל-value. */
function demoType(s,text){
  var e=demoEl(s); if(!e)return false;
  demoShow(e); try{e.focus()}catch(err){}
  e.value=""; var i=0;
  var t=setInterval(function(){
    if(!DEMO.on||!e.parentNode){clearInterval(t);return}
    e.value=String(text).slice(0,++i);
    e.dispatchEvent(new Event("input",{bubbles:true}));
    if(i>=String(text).length)clearInterval(t);
  },85);
  DEMO.extra.push(t);
  return true;
}
function demoQuiet(){
  try{if(window.speechSynthesis)speechSynthesis.cancel()}catch(e){}
  try{if(typeof stopSpeak==="function")stopSpeak()}catch(e){}
}

function demoMountUI(){
  var st=document.createElement("style");
  st.id="demo-style"; st.textContent=DEMO_CSS;
  (document.head||document.documentElement).appendChild(st);

  var b=document.createElement("button");
  b.id="demo-start"; b.type="button";
  b.innerHTML='<span aria-hidden="true">▶</span><span>התחל הדגמה</span>';
  b.addEventListener("click",demoStart);
  document.body.appendChild(b);

  var bar=document.createElement("div");
  bar.id="demo-bar"; bar.hidden=true;
  bar.setAttribute("role","status");
  bar.setAttribute("aria-live","polite");
  bar.innerHTML='<div id="demo-sub"><p id="demo-txt"></p>'+
    '<div id="demo-meta"><span id="demo-step"></span>'+
    '<button id="demo-exit" type="button">יציאה · ESC</button></div>'+
    '<div id="demo-prog"><i></i></div></div>';
  document.body.appendChild(bar);

  DEMO.btn=b; DEMO.bar=bar;
  DEMO.txt=document.getElementById("demo-txt");
  DEMO.step=document.getElementById("demo-step");
  DEMO.fill=bar.querySelector("#demo-prog i");
  document.getElementById("demo-exit").addEventListener("click",function(){demoStop()});
  document.addEventListener("keydown",demoKey,true);
}

/* ESC יוצא. הקשבה בשלב הלכידה, כדי שמסך שכבר מטפל ב-Escape
   לא יבלע את המקש לפני שההדגמה ראתה אותו. */
function demoKey(e){
  if(!DEMO.on)return;
  if(e.key==="Escape"||e.keyCode===27){
    e.preventDefault(); e.stopPropagation();
    demoStop();
  }
}

function demoStart(){
  if(DEMO.on)return;
  DEMO.on=true; DEMO.i=0;
  DEMO.btn.hidden=true; DEMO.bar.hidden=false;
  document.documentElement.classList.add("demo-running");
  demoNext();
}

function demoNext(){
  if(!DEMO.on)return;
  if(DEMO.i>=DEMO_SCRIPT.length){demoStop();return}
  var it=DEMO_SCRIPT[DEMO.i++]||{};
  var d=Math.max(600,it.duration||3000);
  DEMO.txt.textContent=it.subtitle||"";
  DEMO.step.textContent=DEMO.i+" / "+DEMO_SCRIPT.length;
  DEMO.fill.style.transition="none"; DEMO.fill.style.width="0";
  void DEMO.fill.offsetWidth;
  DEMO.fill.style.transition="width "+d+"ms linear";
  DEMO.fill.style.width="100%";
  if(typeof it.action==="function"){
    try{it.action()}catch(err){if(window.console)console.warn("demo:",err)}
  }
  DEMO.timer=setTimeout(demoNext,d);
}

function demoStop(){
  DEMO.on=false;
  if(DEMO.timer){clearTimeout(DEMO.timer);DEMO.timer=null}
  DEMO.extra.forEach(function(t){clearTimeout(t);clearInterval(t)});
  DEMO.extra=[];
  var m=document.querySelectorAll(".demo-tap"),i;
  for(i=0;i<m.length;i++)m[i].classList.remove("demo-tap");
  if(DEMO.bar)DEMO.bar.hidden=true;
  if(DEMO.btn)DEMO.btn.hidden=false;
  document.documentElement.classList.remove("demo-running");
  demoQuiet();
}

/* ------------------------------------------------------------

   מסך בוחר מנוע לפי lang: כשהממשק רוסי ה-html הוא lang="ru",
   ומילה עברית בלי סימון נמסרת למנוע הרוסי — ועם ניקוד זו אות
   ועוד שני סימנים לכל תו. WCAG 2.2 §3.1.2.
   lrn() נושא גם את .lrn-b, ולכן טקסט שאינו עברי אינו מקבל את
   הכיווניות הכפויה: תשובה ברוסית קיבלה עד כה direction:rtl.
   ------------------------------------------------------------ */
var HEB_RE=/[\u0590-\u05FF]/;
function heb(x){x=String(x==null?"":x);
  return HEB_RE.test(x)?'<span lang="he" dir="rtl">'+esc(x)+"</span>":esc(x)}
function lrn(x){x=String(x==null?"":x);
  return HEB_RE.test(x)?'<span class="lrn-b" lang="he" dir="rtl">'+esc(x)+"</span>":esc(x)}

     קול שנבחר לרוסית אינו רלוונטי כשמקריאים עברית. */

    var s=0,n=((v.name||"")+" "+(v.lang||"")).toLowerCase();
    if(String(v.lang||"").replace("_","-").toLowerCase()===want)s+=12;
    if(/\b(google|microsoft|apple)\b/.test(n))s+=30;
    if(/natural|neural|enhanced|premium|wavenet|siri/.test(n))s+=22;
    /* קול רשת — הנוירליים של Edge הם כאלה — נשמע טוב יותר כשיש
       רשת, וזה כל מה שנקבע כאן. מה קורה כשאין רשת נקבע ב-voiceUsable,
       שהוא מיון קודם: קנס בתוך הניקוד לא הצליח להתגבר על שם היצרן. */
    if(v.localService===false&&voiceUsable(v))s+=6;

     נבלעו מול שלושים על שם יצרן, וקול גברי ממותג ניצח קול נשי
     שקיים באותו מכשיר — בדיוק מה שהעדפת המגדר הייתה אמורה למנוע.
     קודם הקולות במגדר המבוקש, אחריהם מי שלא זוהה, ורק אז ההפוך;
     ובתוך כל קבוצה מכריעה האיכות. */

  })[0];
}

    v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,ch,true);
    v.setUint32(24,sr,true);v.setUint32(28,sr*ch*bits/8,true);
    v.setUint16(32,ch*bits/8,true);v.setUint16(34,bits,true);
    ws(36,"data");v.setUint32(40,dl,true);

    for(var k=0;k<bytes.length;k+=8192)out+=String.fromCharCode.apply(null,bytes.subarray(k,k+8192));

/* האיבר שמציג בדיוק את המחרוזת הזאת. מדלגים על איברים שמכילים
   כפתור — החלפת ה-HTML שלהם הייתה מוחקת את כפתור ההשמעה עצמו. */
function hlFind(btn,text){
  var want=String(text||"").replace(/\s+/g," ").trim();
  if(!want||!btn)return null;
  var box=(btn.closest&&btn.closest(".subject,.qcard,.fb,.passage,.card"))||document.body;
  var cand=box.querySelectorAll(".word,.s,span,p,b");

}
/* כשאין איבר יחיד שמציג בדיוק את המחרוזת — למשל משפט שמורכב
   מכותרת ומתיאור בשני איברים — אי אפשר למפות מילים. מדגישים את
   הכרטיס כולו, כדי שיהיה משוב במקום שום דבר. */
function hlWhole(el){
  hlClear();

  HL.el=el; HL.raw=el.innerHTML; HL.added=true;
  el.classList.add("now");
}
function hlPrep(el,text){
  hlClear();

  var parts=String(text).split(/(\s+)/),html="",pos=0,idx=0;
  HL.map=[];
  for(var i=0;i<parts.length;i++){
    var pt=parts[i];
    if(!pt.length)continue;
    if(/^\s+$/.test(pt)){html+=pt;pos+=pt.length;continue}
    HL.map.push({from:pos,to:pos+pt.length,i:idx});
    html+='<span class="wd" data-i="'+idx+'">'+esc(pt)+'</span>';
    pos+=pt.length; idx++;
  }
  if(!HL.map.length){hlClear();return}
  el.innerHTML=html;
  HL.spans=el.querySelectorAll(".wd");
  HL.timer=setTimeout(function(){if(!HL.got&&HL.el){HL.added=true;HL.el.classList.add("now")}},1500);
}
function hlAt(c){
  if(!HL.el||!HL.map.length)return;
  HL.got=true;
  if(HL.timer){clearTimeout(HL.timer);HL.timer=null}
  if(HL.added){HL.el.classList.remove("now");HL.added=false}
  for(var k=0;k<HL.map.length;k++){
    if(c>=HL.map[k].from&&c<HL.map[k].to){
      for(var j=0;j<HL.spans.length;j++)HL.spans[j].classList.toggle("hit",j===HL.map[k].i);
      return;
    }
  }
}

  function push(t,start){ if(String(t).trim())out.push({text:t,start:start}) }
  for(i=0;i<spoken.length;i++){
    if(".!?:;".indexOf(spoken[i])<0)continue;
    if(insideNumber(spoken,i))continue;
    j=i+1; while(j<spoken.length&&/\s/.test(spoken[j]))j++;
    parts.push({text:spoken.slice(from,j),start:from});
    from=j; i=j-1;
  }
  if(from<spoken.length)parts.push({text:spoken.slice(from),start:from});
  for(var k=0;k<parts.length;k++){
    var p=parts[k];
    if(p.text.length<=SEG_MAX){ push(p.text,p.start); continue }
    var rest=p.text,base=p.start;
    while(rest.length>SEG_MAX){
      var cut=rest.lastIndexOf(",",SEG_MAX);
      while(cut>0&&insideNumber(rest,cut))cut=rest.lastIndexOf(",",cut-1);
      if(cut<SEG_MAX*0.4)cut=rest.lastIndexOf(" ",SEG_MAX);
      if(cut<=0)break;
      push(rest.slice(0,cut+1),base);
      base+=cut+1; rest=rest.slice(cut+1);
    }
    push(rest,base);
  }
  /* מקטע זעיר — "12." או ")" — עם הפסקה של רבע שנייה אחריו נשמע
     כמו גמגום. מאחדים אותו לזה שאחריו. */
  var merged=[];
  for(i=0;i<out.length;i++){
    if(merged.length&&out[i].text.trim().length<12&&
       merged[merged.length-1].text.length+out[i].text.length<=SEG_MAX*1.4){
      merged[merged.length-1].text+=out[i].text; continue;
    }
    if(out[i].text.trim().length<12&&i+1<out.length){
      out[i+1]={text:out[i].text+out[i+1].text,start:out[i].start}; continue;
    }
    merged.push(out[i]);
  }
  out=merged;
  return out.length?out:[{text:spoken,start:0}];
}
/* קצב לפי שפה — אותם ערכים שנבחרו בתאוריה מדברת אחרי האזנה */
var VOICE_TUNE={he:0.82,ar:0.85,en:0.90,ru:0.88};
function tuneRate(lang,rate){
  var t=VOICE_TUNE[String(lang||"he").split("-")[0].toLowerCase()]||0.88;
  var r=t*(rate||1);
  return Math.max(0.5,Math.min(1.6,Math.round(r*100)/100));
}

/* ------------------------------------------------------------

   כרום יורה onend על האמירה שבוטלה, המקטע הבא נרשם בכל זאת,
   וכעבור SEG_GAP ההקראה הישנה חוזרת מעל החדשה — שני קולות
   במקביל. מונה אחד פותר את זה: כל הקראה מקבלת מספר, stopSpeak
   מקדם אותו, ומקטע מדור ישן פשוט אינו מדבר. כאן זה חמור יותר
   מבשאר האפליקציות, כי קטע קריאה מנוקד מתפצל להרבה מקטעים.
   ------------------------------------------------------------ */
var _sayGen=0;
function speakDevice(text,code,rate){
  if(!("speechSynthesis" in window))return false;
  try{speechSynthesis.cancel()}catch(e){}
  var my=++_sayGen;
  /* האמירה יוצאת מיד, בתוך הלחיצה. קודם היא נעטפה ב-voicesReady,
     שממתין לרשימת הקולות ועד ארבע שניות אם היא לא מגיעה — ואמירה
     שיוצאת ארבע שניות אחרי המגע נזרקת בשקט באנדרואיד ובספארי.
     כשהרשימה כבר כאן, בוחרים קול ומדברים. כשהיא ריקה — מדברים
     בכל זאת, עם u.lang בלבד: קול ברירת מחדל בשפה הנכונה עדיף על
     שתיקה, ויש מכשירים שמחזירים רשימה ריקה לצמיתות ומדברים היטב.
     voicesReady נשאר בשימוש למסך בחירת הקול, שם ההמתנה במקומה. */
  (function(){
    try{
      var v=bestVoice(code), lang=(v&&v.lang)||code;
      var segs=segments(String(text)), rt=tuneRate(lang,clamp(rate,0.55,1.4));
      var pit=femLift(v);
      var retried=false;
      function alive(){return my===_sayGen}
      function allDone(){ maybeStopKeepAlive(); hlClear(); ttsOK() }
      (function sayseg(k){
        if(!alive())return;   /* ההקראה הזאת בוטלה — המקטע הבא לא יוצא */
        if(k>=segs.length){ allDone(); return }
        /* moved מבטיח שמקטע מתקדם פעם אחת בלבד: onend ושומר הזמן
           יכולים שניהם לרצות לקדם אותו, וקידום כפול מדלג על מקטע. */
        var seg=segs[k], moved=false, disarm=null;

          moved=true; if(disarm)disarm();

        u.lang=lang;

        u.onboundary=function(e){if(!e.name||e.name==="word")hlAt(seg.start+e.charIndex)};

        u.onerror=function(e){

          var err=(e&&e.error)||"";

          /* קול רשת שנכשל פירושו כמעט תמיד שאין אינטרנט. עוברים לקול
             מקומי וחוזרים על אותו מקטע, פעם אחת, כדי שההקראה לא
             תישבר בשקט באמצע שאלה. */
          if(!retried&&v&&v.localService===false){
            retried=true; _netVoiceOK=false; moved=true;
            if(disarm)disarm(); _activeU=null;
            v=bestVoice(code); lang=(v&&v.lang)||code; pit=femLift(v);
            setTimeout(function(){sayseg(k)},SEG_GAP);
            return;
          }
          moved=true; if(disarm)disarm(); maybeStopKeepAlive(); ttsFail(err);
        };
        _activeU=u;                        /* מגן מפני איסוף זבל */
        try{if(speechSynthesis.paused)speechSynthesis.resume()}catch(e2){}
        speechSynthesis.speak(u);
        startKeepAlive();
        disarm=ttsWatchdog(function(){return alive()&&!moved},next);
      })(0);
    }catch(e){}

     עם <sub> או <span class="frac"> הוקראה בקול כתגית: הסטודנט

  if(gemOn()){

/* ============================================================
   8. מנוע ההרכבה
   ------------------------------------------------------------
   אין כאן שאלה ואין תשובה נכונה. `W` הוא מצב הכתיבה: איזה סוג
   נבחר, איזה נושא, ואילו קטעים סומנו בכל אחד מארבעת המקומות.

   הטענות הן ריבוי־בחירה (הלומד מסמן שתיים או שלוש); שלושת
   האחרים הם בחירה יחידה. זה לא קישוט: חיבור עם טענה אחת אינו
   חיבור, וחיבור עם חמש טענות אינו נקרא.
   ============================================================ */
/* דגלי מסך ההגדרות. ההצהרה שלהם ישבה בבלוק שהוסר, ולכן היא כאן. */
var gkShow=false,gkMsg=null,askReset=false;
var W={step:1, type:null, topic:null, op:-1, cl:[], ex:-1, cn:-1, txt:""};
var CL_MIN=2, CL_MAX=3;

function wReset(){ W={step:1,type:null,topic:null,op:-1,cl:[],ex:-1,cn:-1,txt:""} }
function typeById(id){ for(var i=0;i<TYPES.length;i++) if(TYPES[i].id===id) return TYPES[i]; return null }
function bankOf(typeId){ for(var i=0;i<BANKS_K.length;i++) if(BANKS_K[i].type===typeId) return BANKS_K[i].topics; return [] }
function topicById(typeId,id){ var a=bankOf(typeId),i; for(i=0;i<a.length;i++) if(a[i].id===id) return a[i]; return null }
function gl(o){ return (o&&(o[state.lang]||o.he))||"" }

/* הטקסט המורכב. שורה לכל חלק, ולא פסקה אחת ארוכה: הלומד צריך
   לראות את המבנה שהוא בנה, ולא רק את התוצאה. */
function wText(){
  var tp=W.topic?topicById(W.type,W.topic):null;
  if(!tp) return "";
  var out=[],i;
  if(W.op>=0&&tp.op[W.op]) out.push(gl(tp.op[W.op]));
  for(i=0;i<W.cl.length;i++) if(tp.cl[W.cl[i]]) out.push(gl(tp.cl[W.cl[i]]));
  if(W.ex>=0&&tp.ex[W.ex]) out.push(gl(tp.ex[W.ex]));
  if(W.cn>=0&&tp.cn[W.cn]) out.push(gl(tp.cn[W.cn]));
  return out.join(" ");
}
/* כמה חסר עדיין. המסך אינו נועל את הכפתור — הוא אומר מה חסר,
   וזה ההבדל בין הדרכה לחסימה. */
function wMissing(){
  var m=[];
  if(W.op<0) m.push(t("kOpen"));
  if(W.cl.length<CL_MIN) m.push(t("kClaims"));
  if(W.ex<0) m.push(t("kEx"));
  if(W.cn<0) m.push(t("kConc"));
  return m;
}

var LGFOOT={he:"© 2026 יהושע לגשטיין",ar:"© 2026 يهوشع لچشطاين",ru:"© 2026 Иехошуа Лагштейн",en:"© 2026 Joshua Lagstein"};
var LGTERMS={he:"תנאי שימוש וזכויות יוצרים",ar:"شروط الاستخدام وحقوق النشر",ru:"Условия использования и авторские права",en:"Terms of use and copyright"};
var LGSKIP={he:"דילוג לתוכן",ar:"تخطّي إلى المحتوى",ru:"Перейти к содержимому",en:"Skip to content"};
function lgChrome(){
  var g="he"; try{ g=state.lang||"he" }catch(e){}
  if(!LGFOOT[g])g="he";
  var dir=(g==="ru"||g==="en")?"ltr":"rtl";
  var f=document.querySelector("footer.lg-foot");
  if(f){
    f.setAttribute("lang",g); f.setAttribute("dir",dir);
    f.textContent="";
    f.appendChild(document.createTextNode(LGFOOT[g]+" · "));
    var a=document.createElement("a");
    a.href="/legal/"; a.style.color="inherit"; a.textContent=LGTERMS[g];
    f.appendChild(a);
  }
  var s=document.querySelector("a.skip[href='#main']");
  if(s){ s.setAttribute("lang",g); s.setAttribute("dir",dir); s.textContent=LGSKIP[g] }
}

window.addEventListener("legal:lang",function(e){
  var k=e&&e.detail; if(!k)return;
  try{ state.lang=k;save();render(); }catch(err){}
});

function render(){ try{lgChrome()}catch(e){}
  applyModes();
  /* lvlSync סנכרן שמות רמות. אין רמות באפליקציית כתיבה. */
  /* ארבעת צעדי הכתיבה יושבים ב-W.step, ולא ב-state.screen:
     ההתקדמות והגדרות הן מסכי מעטפת ונשארות כפי שהיו, והצעדים
     הם האפליקציה עצמה. */
  var body=state.screen==="prog"?screenProg():
           state.screen==="set" ?screenSet():
           W.step===4?screenText():
           W.step===3?screenBuild():
           W.step===2?screenTopic():screenType();
  $("#app").innerHTML=hdr()+body;
}

/* גיבוב חלש כגיבוי בלבד. SubtleCrypto קיים בכל דפדפן מודרני
   בהקשר מאובטח, ו-GitHub Pages הוא כזה. */
function teWeak(s){var h=5381,i;for(i=0;i<s.length;i++)h=((h*33)^s.charCodeAt(i))>>>0;return "w"+h.toString(16)}
function teHash(pin,salt,cb){
  var msg=salt+"|"+pin;
  try{
    if(window.crypto&&crypto.subtle&&crypto.subtle.digest&&window.TextEncoder){
      crypto.subtle.digest("SHA-256",new TextEncoder().encode(msg)).then(function(d){
        var a=Array.prototype.slice.call(new Uint8Array(d));
        cb(a.map(function(b){return ("0"+b.toString(16)).slice(-2)}).join(""));
      },function(){cb(teWeak(msg))});
      return;
    }
  }catch(e){}
  cb(teWeak(msg));
}
function teSalt(){
  var s="";
  try{
    var a=new Uint8Array(8);crypto.getRandomValues(a);
    s=Array.prototype.slice.call(a).map(function(b){return ("0"+b.toString(16)).slice(-2)}).join("");
  }catch(e){ s=String(Date.now())+Math.random().toString(36).slice(2) }
  return s;
}

  var pen=Math.min(300,Math.pow(2,r.bad-3)*5)*1000;

  return left>0?left:0;

function teSubmit(){

  var pin=(document.getElementById("te-pin")||{}).value||"";
  var rem=!!(document.getElementById("te-rem")||{}).checked;
  if(!/^[0-9]{4,8}$/.test(pin)){TE.msg=xt("teShort");teDialog();return}
  if(setting){
    var p2=(document.getElementById("te-pin2")||{}).value||"";
    if(pin!==p2){TE.msg=xt("teMismatch");teDialog();return}
    var salt=teSalt();
    TE.busy=true;
    teHash(pin,salt,function(h){
      TE.busy=false;
      teWrite({h:h,s:salt,bad:0,badAt:0});
      teSetOpen(true,rem);
      TE.ask=false;TE.mode="";TE.msg="";
      teDialog(); render();
    });
    return;
  }
  if(teWait()){teDialog();return}
  var rec=teRead(); if(!rec){teClose();return}
  TE.busy=true;
  teHash(pin,rec.s,function(h){
    TE.busy=false;
    if(h===rec.h){
      rec.bad=0;rec.badAt=0;teWrite(rec);
      teSetOpen(true,rem);
      TE.ask=false;TE.mode="";TE.msg="";

(function(){

        var ready=false;

function copyText(txt,done){

}
function fallbackCopy(txt,done){

    document.body.appendChild(ta); ta.select();

}

    render(); window.scrollTo(0,0); return;
  }
  if(a==="kpick"){
    var kk=el.getAttribute("data-k"), ki=parseInt(el.getAttribute("data-i"),10);
    if(kk==="cl"){
      var at=W.cl.indexOf(ki);
      /* טענות הן ריבוי־בחירה עם תקרה. מעל התקרה הלחיצה אינה
         מתעלמת בשקט — היא מודיעה, אחרת נראה שהכפתור שבור. */
      if(at>=0) W.cl.splice(at,1);
      else if(W.cl.length>=CL_MAX){ announce(t("kTooMany")); return }
      else W.cl.push(ki);
    }
    else if(kk==="op") W.op=(W.op===ki?-1:ki);
    else if(kk==="ex") W.ex=(W.ex===ki?-1:ki);
    else if(kk==="cn") W.cn=(W.cn===ki?-1:ki);
    render(); return;
  }
  if(a==="kdone"){
    if(!wReady())return;
    W.txt=wText(); W.step=4; stopSpeak(); render(); window.scrollTo(0,0);
    announce(t("kStep4"));
    return;
  }
  if(a==="kedit"){ W.step=3; stopSpeak(); render(); window.scrollTo(0,0); return }
  if(a==="knew"){ wReset(); stopSpeak(); render(); window.scrollTo(0,0); return }
  if(a==="ksay"){ speak(W.txt,state.lang); return }
  if(a==="kcopy"){
    copyText(W.txt,function(){
      var m=$("#kmsg"); if(m)m.textContent=t("kCopied");
      announce(t("kCopied"));
    });
    return;
  }
  if(a==="lang"){state.lang=LANGS[v]?v:"he";save();render();return}
  if(a==="vmode"){state.voiceMode=v==="gem"?"gem":"device";save();render();return}
  if(a==="vcheck"){voiceCheck();return}
  if(a==="devvoice"||a==="devsample"){
    var lg=el.getAttribute("data-l")||state.lang;
    var code=LANGS[lg].tts;
    var uri=el.getAttribute("data-u")||"";
    if(a==="devvoice"){
      if(!state.devVoice)state.devVoice={};
      if(uri)state.devVoice[code]=uri; else delete state.devVoice[code];
      save(); render();
    }
    /* משמיעים תמיד — בחירה בלי לשמוע אינה בחירה. */
    speak(lg==="en"?'Hello. This is the reading voice.':t("heroT"),lg);
    return;
  }
  if(a==="gvoice"){state.gemVoice=gvOf(v).id;save();render();return}
  if(a==="gsample"){
    if(!hasKey()){gkMsg={ok:false,m:t("vNeed")};render();return}
    var vid=gvOf(el.getAttribute("data-v")).id, old=state.gemVoice;
    state.gemVoice=vid; state.voiceMode="gem";
    speak("שלום. ככה אני נשמע.",LEARN);
    state.gemVoice=old; save(); return;
  }
  if(a==="gkshow"){var inp=$("#gk");var val=inp?inp.value:GKEY;gkShow=!gkShow;render();
    var i2=$("#gk"); if(i2){i2.value=val;i2.focus()} return}
  if(a==="gsave"){testKey();return}
  if(a==="tog"){state[v]=!state[v];save();render();return}
  if(a==="theme"){state.theme=v;save();render();return}
  if(a==="askreset"){askReset=true;render();return}
  if(a==="noreset"){askReset=false;render();return}
  if(a==="doreset"){
    var lg2=state.lang; state=blankState(); state.lang=lg2;
    try{localStorage.removeItem(SKEY)}catch(e){}
    askReset=false; save(); render(); return;
  }
});
document.addEventListener("input",function(e){
  var el=e.target.closest("[data-a='rate']"); if(!el)return;
  state.rate=clamp(parseFloat(el.value)||0.95,0.6,1.3); save();
});
/* Enter ורווח על כרטיס קול — הוא div ולכן המקלדת אינה מקבלת אותו בחינם */
document.addEventListener("keydown",function(e){
  if(e.key!=="Enter"&&e.key!==" ")return;
  var el=e.target.closest("[data-a='gvoice'],[data-a='devvoice'],[data-a='sayline']"); if(!el)return;
  e.preventDefault(); el.click();
});
/* קיצורי מקלדת בתרגול, כמו באפליקציות המתמטיקה: מי שהעכבר קשה לו,
   או שהוא עובד עם מקלדת בלבד, לא אמור להיות תלוי בלחיצה מדויקת.
   1–4 עונה, רווח מקריא שוב, Enter עובר לשאלה הבאה. */
document.addEventListener("keydown",function(e){
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.target&&e.target.closest("input,textarea,select,[contenteditable]"))return;
  /* רווח מקריא את מה שעל המסך. בצעד הרביעי זה הטקסט שנבנה,
     ובצעדים שלפניו אין מה להקריא — ולכן אין קיצור. */
  if(e.key===" "&&W.step===4&&W.txt){
    if(e.target&&e.target.closest("button,[role='button'],a[href]"))return;
    e.preventDefault(); speak(W.txt,state.lang); return;
  }
});
/* רשימת הקולות של הדפדפן מגיעה מאוחר. בלי הרינדור הזה סרגל מצב
   הקול מכריז "אין קול אנגלי" על מכשיר שיש בו אחד. */
if(window.speechSynthesis){
  try{speechSynthesis.getVoices()}catch(e){}
  speechSynthesis.onvoiceschanged=function(){
    /* הרשימה יכולה להגיע לפני שהמצב נטען. רינדור אז מצייר מסך של
       אפליקציה שעדיין לא קיימת. */
    if(booted)render();
  };
}
window.addEventListener("pagehide",stopSpeak);

/* ============================================================
   11. הפעלה
   ============================================================ */
function boot(){
  loadKey();
  load();
  booted=true;
  applyModes();
  render();
}
/* INTERNAL-GATE — לא נטענת בלי מפתח. */
if(!INTERNAL_OK){
  document.getElementById("gate").hidden=false;
  document.title="לא פורסם";
}else{
  boot();
}
</script>

<!-- ״עזרה מהמורה״. התשתית ב-/tutor/tutor.js, ההוראות בשרת.
     mount מחזיר false כשאין כתובת שרת, ואז הכפתור אינו נבנה. -->
<script>
if(window.TUTOR){
  /* הניסוח שעל המסך מגיע כ-HTML; לשרת נשלח טקסט בלבד. */
  var txt=function(x){return String(x==null?"":x).replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim()};
  TUTOR.mount({
    app:"kotvim",
    target:"he",
    lang:function(){return (typeof state!=="undefined"&&state.lang)||"he"},
    /* כאן אין תרגיל עם תשובה נכונה, אלא טקסט שהלומד מרכיב. מה
       שנשלח למורה הוא מה שעל המסך: סוג הטקסט, הנושא, והטקסט
       עצמו — או, לפני הצעד הרביעי, מה שכבר נבחר. `ans` נשאר null
       מפני שאין תשובה אחת נכונה בכתיבה. */
    q:function(){
      if(typeof W==="undefined"||!W.type)return null;
      /* W.type ו-W.topic הם מזהים, לא אובייקטים. */
      var t0=TYPES.filter(function(x){return x.id===W.type})[0];
      var p0=W.topic?topicById(W.type,W.topic):null;
      var ty=t0?txt(gl(t0.n)):"", tp=p0?txt(gl(p0.n)):"";
      var body=W.txt?txt(W.txt):txt(wText());
      if(!body)return null;
      return {expr:body, ans:null, topic:tp||null, level:ty||null};
    },
    stopHost:function(){try{stopSpeak()}catch(e){}}
  });
  if(INTERNAL_OK){try{render()}catch(e){}}
}
</script>
