    wrong=wSel(num(res),[
      [num(r2(N/p)),"חילקתם את המספר באחוז. אחוז זה כפל בשבר, לא חילוק."],
      [num(N-p),"חיסרתם את המספר "+p+" מהסכום. "+p+"% הוא לא "+p+" יחידות."],
      [num(res*10),"טעות בהזזת נקודה עשרונית — חלקתם ב-10 במקום ב-100."],
      [num(N*p),"שכחתם לחלק במאה. אחוז הוא תמיד חלק מתוך מאה."],
      [num(N+p),"חיברתם את המספר "+p+" לסכום. "+p+"% הוא לא "+p+" יחידות."]
    ]);
    return {ask:"חשבו",expr:p+"% מתוך "+N,ans:W(num(res)),wrong:wrong,steps:steps,rule:"pct",
      hint:"אחוז מתוך מספר = המספר כפול האחוז חלקי 100."};
  }
  if(L===2){
    p=pick([10,15,20,25,30,40,50]);
    N=pick([80,120,160,200,240,300,400,600,800]);
    var down=Math.random()<0.6;
    var change=N*p/100;
    res=down?N-change:N+change;
    steps=[
      S("מחשבים את גודל השינוי",p+"% מתוך "+N+".",p+"% · "+N+" = "+num(change)),
      S(down?"מחסרים מהמחיר המקורי":"מוסיפים למחיר המקורי","",
        N+(down?" − ":" + ")+num(change)+" = "+num(res)),
      S("קיצור דרך שכדאי להכיר",
        down?"הנחה של "+p+"% משאירה "+(100-p)+"% מהמחיר, אז אפשר פשוט להכפיל ב-"+((100-p)/100)+".":
             "העלאה של "+p+"% נותנת "+(100+p)+"% מהמחיר, אז אפשר להכפיל ב-"+((100+p)/100)+".",
        N+" · "+(down?(100-p)/100:(100+p)/100)+" = "+num(res))
    ];
    wrong=wSel(num(res),[
      [num(change),"חישבתם את גודל ההנחה או התוספת, אבל השאלה מבקשת את המחיר עצמו."],
      [num(down?N+change:N-change),"הלכתם לכיוון ההפוך — "+(down?"הוספתם במקום להוריד":"הורדתם במקום להוסיף")+"."],
      [num(down?N-p:N+p),"התייחסתם ל-"+p+"% כאילו הם "+p+" שקלים."],
      [num(down?N-change/10:N+change/10),"טעות בהזזת הנקודה העשרונית — השינוי יצא קטן פי עשרה ממה שהוא באמת."],
      [num(down?N+p:N-p),"גם התייחסתם ל-"+p+"% כאילו הם "+p+" שקלים, וגם הלכתם לכיוון ההפוך."]
    ]);
    return {ask:down?"מחיר מוצר הוא "+N+" ש\"ח ויש עליו הנחה של "+p+"%. כמה משלמים?"
                     :"מחיר מוצר הוא "+N+" ש\"ח והוא התייקר ב-"+p+"%. מה המחיר החדש?",
      expr:"",ans:W(num(res)+' ש"ח'),
      wrong:wrong.map(function(w){return W(w.h+' ש"ח',w.why)}),steps:steps,rule:"pct",
      hint:down?"הנחה של "+p+"% משאירה "+(100-p)+"% מהמחיר.":"התייקרות ב-"+p+"% נותנת "+(100+p)+"% מהמחיר."};
  }
  /* רמה 4 — שני שינויי אחוזים בזה אחר זה, והשאלה היא על השינוי הכולל.
     צריך גם לחשב אחוז מכמות (רמה 2) וגם אחוז שינוי (רמה 3), ולהבין
     שאחוזים אינם מתחברים. */
  if(L===4){
    var up=Math.random()<0.5;
    var p1=pick([10,20,25,30,40,50]),p2=pick([10,20,25,30,40,50]);
    var f1=(100+(up?p1:-p1))/100,f2=(100+(up?-p2:p2))/100;
    var cand=shuffle([400,500,600,800,1200,1600,2000]),i4,V1=0,V2=0;
    N=2000;
    for(i4=0;i4<cand.length;i4++){
      if(Math.round(cand[i4]*f1)===cand[i4]*f1&&Math.round(cand[i4]*f1*f2)===cand[i4]*f1*f2){N=cand[i4];break}
    }
    V1=N*f1;V2=N*f1*f2;
    var chg=r2((V2-N)/N*100);
    var naive=up?p1-p2:p2-p1;
    var pctTxt=function(v){return v>0?"עלייה של "+num(v)+"%":v<0?"ירידה של "+num(-v)+"%":"אין שינוי במחיר"};
    steps=[
      S("מחשבים את המחיר אחרי השינוי הראשון",
        up?"התייקרות של "+p1+"% נותנת "+(100+p1)+"% מהמחיר.":"הנחה של "+p1+"% משאירה "+(100-p1)+"% מהמחיר.",
        N+" · "+f1+" = "+num(V1)+' ש"ח'),
      S("מחשבים את המחיר אחרי השינוי השני","השינוי השני מחושב מהמחיר החדש, לא מהמחיר המקורי. זו כל הנקודה.",
        num(V1)+" · "+f2+" = "+num(V2)+' ש"ח'),
      S("משווים למחיר המקורי","אחוז שינוי = (חדש − ישן) ÷ ישן · 100. המכנה הוא המחיר שממנו התחלנו.",
        "("+num(V2)+" − "+N+") ÷ "+N+" · 100 = "+num(chg)+"%"),
      S("קוראים את התוצאה","",pctTxt(chg))
    ];
    return {ask:"מחיר מוצר הוא "+N+' ש"ח. המחיר '+(up?"עלה ב-"+p1+"% ואחר כך ירד ב-"+p2+"%":"ירד ב-"+p1+"% ואחר כך עלה ב-"+p2+"%")+
        ". מה השינוי הכולל לעומת המחיר המקורי?",
      expr:"",ans:W(pctTxt(chg)),
      wrong:[
        W(pctTxt(naive),"חיסרתם אחוז מאחוז. אחוזים אינם מתחברים ואינם מתחסרים — כל אחד מהם מחושב מבסיס אחר."),
        W(pctTxt(-chg),"הכיוון הפוך. שווה להשוות את המחיר הסופי למחיר המקורי ולראות מי גדול."),
        W(pctTxt(up?p1+p2:-(p1+p2)),"חיברתם את שני האחוזים. שינוי אחד מעלה ואחד מוריד — הם לא מצטברים לאותו כיוון."),
        W(pctTxt(up?-p2:p2),"זה השינוי השני בלבד. השאלה מבקשת את השינוי לעומת המחיר המקורי.")
      ],steps:steps,rule:"pctchange",
      hint:"שני האחוזים מחושבים מבסיסים שונים. מחשבים את המחיר הסופי בפועל, ורק אז משווים אותו למחיר ההתחלתי."};
  }
  /* רמה 3: אחוז שינוי, או מציאת המחיר המקורי */
  if(Math.random()<0.5){
    var A=pick([40,50,60,80,120,150,200,250]);
    p=pick([10,20,25,50,75,100]);
    var B=A*(100+p)/100;
    if(Math.round(B)!==B){B=A*1.5;p=50}
    steps=[
      S("אחוז שינוי נמדד תמיד ביחס להתחלה","זו הנקודה שהכי הרבה נופלים בה: המכנה הוא הערך הישן, לא החדש.",
        "שינוי באחוזים = (חדש − ישן) ÷ ישן · 100"),
      S("מחשבים את השינוי","",num(B)+" − "+A+" = "+num(B-A)),
      S("מחלקים בערך ההתחלתי וכופלים ב-100","",num(B-A)+" ÷ "+A+" · 100 = "+num(p)+"%")
    ];
    return {ask:"מחיר עלה מ-"+A+' ש"ח ל-'+num(B)+' ש"ח. בכמה אחוזים הוא עלה?',expr:"",
      ans:W(num(p)+"%"),
      wrong:wSel(num(p)+"%",[
        [num(Math.round((B-A)/B*1000)/10)+"%","חילקתם בערך החדש. אחוז שינוי מחושב תמיד ביחס לערך ההתחלתי."],
        [num(B-A)+"%","זה גודל השינוי בשקלים, לא באחוזים."],
        [num(Math.round(B/A*1000)/10)+"%","זה היחס בין המחירים. כדי לקבל את אחוז העלייה צריך להוריד 100%."],
        [num(-p)+"%","חיסרתם בכיוון ההפוך — ישן פחות חדש. המחיר עלה, אז אחוז השינוי חיובי."],
        [num(r2(p/100))+"%","שכחתם להכפיל ב-100. היחס שקיבלתם הוא שבר, והאחוז הוא אותו שבר כפול מאה."]
      ]),steps:steps,rule:"pctchange",
      hint:"אחוז שינוי = (חדש פחות ישן) חלקי הישן, כפול 100."};
  }
  p=pick([10,20,25,40,50]);
  var orig=pick([80,120,160,200,240,300,400]);
  var after=orig*(100-p)/100;
  steps=[
    S("מתרגמים את המשפט למשוואה","אחרי הנחה של "+p+"% נשארו "+(100-p)+"% מהמחיר המקורי.",
      (100-p)/100+" · x = "+num(after)),
    S("מחלקים בשיעור שנשאר","זה ההפך מהכפלה — לא מוסיפים חזרה "+p+"%.",
      "x = "+num(after)+" ÷ "+(100-p)/100),
    S("התשובה","","x = "+num(orig))
  ];
  return {ask:"אחרי הנחה של "+p+"% שילמו "+num(after)+' ש"ח. מה היה המחיר לפני ההנחה?',expr:"",
    ans:W(num(orig)+' ש"ח'),
    wrong:wSel(num(orig)+' ש"ח',[
      [num(after*(100+p)/100)+' ש"ח',"הוספתם "+p+"% למחיר אחרי ההנחה. אחוז שמורידים ואחוז שמוסיפים לא מבטלים זה את זה."],
      [num(after+p)+' ש"ח',"הוספתם "+p+" שקלים במקום "+p+" אחוזים."],
      [num(after/(p/100))+' ש"ח',"חילקתם באחוז ההנחה במקום באחוז שנשאר."],
      [num(r2(after*(100-p)/100))+' ש"ח',"הורדתם עוד "+p+"% מהמחיר. כדי לחזור אחורה מחלקים בשיעור שנשאר, לא מכפילים בו."],
      [num(r2(after*100/(100+p)))+' ש"ח',"חילקתם ב-"+((100+p)/100)+" במקום ב-"+((100-p)/100)+". אחרי הנחה של "+p+"% נשארו "+(100-p)+"% מהמחיר."]
    ]),steps:steps,rule:"pctback",
    hint:"אם ההנחה "+p+"%, המחיר ששולם הוא "+(100-p)+"% מהמקורי. מחלקים ב-"+((100-p)/100)+"."};
}

/* ---------- 6. יחס ופרופורציה ---------- */
function genRatio(L){
  var a,b,k,steps,total;
  if(L===1){
    k=ri(2,9);a=ri(2,9);b=ri(2,9);
    while(gcd(a,b)!==1){b=ri(2,9)}
    steps=[
      S("מחפשים מחלק משותף","המספר הגדול ביותר שמחלק גם את "+(a*k)+" וגם את "+(b*k)+" הוא "+k+".","מחלק משותף: "+k),
      S("מחלקים את שני האגפים","יחס לא משתנה כשמחלקים את שני חלקיו באותו מספר.",
        (a*k)+" ÷ "+k+" : "+(b*k)+" ÷ "+k),
      S("התשובה","",a+" : "+b)
    ];
    return {ask:"צמצמו את היחס",expr:(a*k)+" : "+(b*k),ans:W(a+" : "+b),
      wrong:[
        W((a*k-k)+" : "+(b*k-k),"חיסרתם את אותו מספר משני האגפים. ביחס מצמצמים בחילוק, לא בחיסור."),
        W(b+" : "+a,"הפכתם את סדר האיברים. הסדר ביחס משנה."),
        W((a*k)+" : "+b,"צמצמתם רק את האיבר השני. חייבים לחלק את שני האיברים באותו מספר.")
      ],
      steps:steps,rule:"ratio",hint:"מחלקים את שני איברי היחס באותו מספר עד שאין להם מחלק משותף."};
  }
  if(L===2){
    a=ri(1,7);b=ri(1,7);
    while(a===b||gcd(a,b)!==1)b=ri(1,7);     /* יחס מצומצם — אחרת השאלה מבקשת לצמצם בלי לומר */
    k=ri(3,14);total=(a+b)*k;
    steps=[
      S("סופרים חלקים","היחס "+a+":"+b+" אומר שיש "+a+" חלקים ועוד "+b+" חלקים.",
        a+" + "+b+" = "+(a+b)+" חלקים"),
      S("מחשבים כמה שווה חלק אחד","",total+" ÷ "+(a+b)+" = "+k),
      S("מכפילים בכל מנה","",a+" · "+k+" = "+(a*k)+"   ,   "+b+" · "+k+" = "+(b*k))
    ];
    return {ask:"מחלקים "+total+" שקלים ביחס "+a+":"+b+". כמה מקבל כל אחד?",expr:"",
      ans:W((a*k)+" ו-"+(b*k)),
      wrong:[
        W((total/2)+" ו-"+(total/2),"חילקתם שווה בשווה. היחס "+a+":"+b+" אומר שהחלקים לא שווים."),
        W(r2(total/a)+" ו-"+r2(total/b),"חילקתם את הסכום בכל מספר בנפרד. קודם צריך לחלק במספר החלקים הכולל."),
        W((a*k)+" ו-"+(total-a*k-k),"אחרי שחישבתם את החלק הראשון, השני חושב בטעות.")
      ],
      steps:steps,rule:"ratio",hint:"סוכמים את מספרי היחס, מחלקים בסכום כדי לדעת כמה שווה חלק אחד, ואז מכפילים."};
  }
  /* רמה 4 — יחס בכניסה, אחוז ביציאה. שני נושאים שנלמדו בנפרד,
     והמעבר ביניהם הוא כל השאלה: אחוז נמדד מהשלם, לא מהחלק השני. */
  if(L===4){
    var pr4=pick([[1,3],[3,1],[1,4],[2,3],[3,2],[4,1],[1,7],[3,5],[5,3],[7,1],
                  [1,9],[3,7],[7,3],[9,1],[3,17],[7,13],[9,11],[11,9],[13,7],[17,3]]);
    a=pr4[0];b=pr4[1];
    var boys=Math.random()<0.5,part=boys?a:b,tot4=a+b;
    var ans4=r2(part/tot4*100);
    steps=[
      S("סופרים חלקים","היחס אינו אחוז. קודם בודקים מכמה חלקים מורכב השלם.",
        a+" + "+b+" = "+tot4+" חלקים"),
      S("כותבים את החלק המבוקש כשבר","המכנה הוא הסך הכול, לא הקבוצה השנייה.",
        part+" / "+tot4),
      S("הופכים שבר לאחוזים","מכפילים ב-100.",part+" ÷ "+tot4+" · 100 = "+num(ans4)+"%")
    ];
    return {ask:"בכיתה היחס בין מספר הבנים למספר הבנות הוא "+a+":"+b+". איזה אחוז מתלמידי הכיתה הם "+(boys?"בנים":"בנות")+"?",
      expr:"",ans:W(num(ans4)+"%"),
      wrong:[
        W(num(r2(part/(boys?b:a)*100))+"%","חילקתם בקבוצה השנייה. אחוז נמדד תמיד מתוך הסך הכול."),
        W(num(r2(100-ans4))+"%","זה האחוז של הקבוצה השנייה."),
        W(num(r2(part/tot4))+"%","עצרתם בשבר ולא הכפלתם ב-100."),
        W("50%","חילקתם שווה בשווה. היחס "+a+":"+b+" אומר שהחלקים אינם שווים.")
      ],steps:steps,rule:"ratio",
      hint:"היחס נותן חלקים, ואחוז נמדד תמיד מתוך השלם. אז קודם מחשבים כמה חלקים יש בסך הכול."};
  }
  a=ri(2,12);b=ri(2,12);k=ri(2,9);
  /* a = b הופך את הפרופורציה לזהות: התשובה היא c עצמו, ושני
     המסיחים מתלכדים איתה. */
  while(b===a)b=ri(2,12);
  var c=a*k,x=b*k;
  steps=[
    S("כותבים כפרופורציה","",a+" : "+b+" = "+c+" : x"),
    S("מכפילים באלכסון","במשוואת יחסים מכפילים את הקצוות מול האמצעים.",a+"·x = "+b+"·"+c),
    S("מחשבים","",a+"x = "+(b*c)),
    S("מחלקים","","x = "+(b*c)+" ÷ "+a+" = "+x)
  ];
  return {ask:"השלימו את הפרופורציה",expr:a+" : "+b+" = "+c+" : x",ans:W("x = "+x),
    wrong:[
      W("x = "+num(r2(a*c/b)),"הכפלתם את האלכסון ההפוך. שימו לב איזה איבר לא ידוע."),
      W("x = "+num(c-a+b),"חיסרתם במקום להכפיל. פרופורציה עובדת בכפל, לא בחיבור."),
      W("x = "+num(b*c),"הכפלתם באלכסון אבל שכחתם לחלק ב-"+a+"."),
      W("x = "+num(b+c),"חיברתם את "+b+" ל-"+c+". פרופורציה נפתרת בכפל באלכסון, לא בחיבור.")
    ],
    steps:steps,rule:"prop",hint:"בפרופורציה a:b = c:x מתקיים a·x = b·c."};
}
/* ---------- 7. חוקי חזקות ---------- */
function genPowers(L){
  var m,n,c,steps;
  if(L===1){
    m=ri(2,7);n=ri(2,7);
    if(Math.random()<0.5){
      return {ask:"פשטו לחזקה אחת",expr:pw("x",m)+" · "+pw("x",n),ans:W(pw("x",m+n)),
        wrong:wSel(pw("x",m+n),[
          [pw("x",m*n),"הכפלתם את המעריכים. בכפל של אותו בסיס המעריכים מתחברים."],
          ["2"+pw("x",m+n),"הכפלתם גם את הבסיס. הבסיס נשאר x — רק המעריך משתנה."],
          [pw("x",Math.abs(m-n)),"חיסרתם את המעריכים. חיסור שייך לחילוק, לא לכפל."],
          m===n?["2"+pw("x",m),"בלבלתם עם חיבור. שני איברים זהים שמתחברים נותנים מקדם שתיים, אבל כאן יש כפל והמעריכים מתחברים."]:null,
          [pw("x",m),"השארתם את המעריך של הגורם הראשון בלבד. בכפל של אותו בסיס המעריכים מתחברים."]
        ]),
        steps:[
          S("אותו בסיס בכפל — מחברים מעריכים","הכלל: xᵃ · xᵇ = xᵃ⁺ᵇ. אפשר לראות למה: זה פשוט x שמוכפל בעצמו "+m+" פעמים ועוד "+n+" פעמים.",
            "x<sup>"+m+"</sup> · x<sup>"+n+"</sup> = x<sup>"+m+"+"+n+"</sup>"),
          S("מסכמים","",pw("x",m+n))
        ],rule:"powmul",hint:"אותו בסיס, פעולת כפל — המעריכים מתחברים."};
    }
    if(m<=n){var t=m;m=n+ri(1,4);n=t}
    return {ask:"פשטו לחזקה אחת",expr:pw("x",m)+" ÷ "+pw("x",n),ans:W(pw("x",m-n)),
      wrong:[
        W(pw("x",m+n),"חיברתם את המעריכים. חיבור שייך לכפל, ובחילוק מחסרים."),
        W(pw("x",n-m),"חיסרתם בכיוון ההפוך. מחסרים את המעריך של המכנה מזה של המונה."),
        W(pw("x",m*n),"הכפלתם את המעריכים.")
      ],
      steps:[
        S("אותו בסיס בחילוק — מחסרים מעריכים","הכלל: xᵃ ÷ xᵇ = xᵃ⁻ᵇ. כל x במכנה מצמצם x אחד במונה.",
          "x<sup>"+m+"</sup> ÷ x<sup>"+n+"</sup> = x<sup>"+m+"−"+n+"</sup>"),
        S("מסכמים","",pw("x",m-n))
      ],rule:"powdiv",hint:"אותו בסיס, פעולת חילוק — מחסרים את המעריך התחתון מהעליון."};
  }
  if(L===2){
    c=ri(2,5);m=ri(2,5);n=ri(2,4);
    return {ask:"פשטו את הביטוי",expr:"("+c+pw("x",m)+")<sup>"+n+"</sup>",
      ans:W(Math.pow(c,n)+pw("x",m*n)),
      wrong:wSel(Math.pow(c,n)+pw("x",m*n),[
        [c+pw("x",m*n),"החזקה החיצונית חלה גם על המקדם "+c+", לא רק על ה-x."],
        [Math.pow(c,n)+pw("x",m+n),"בחזקה של חזקה מכפילים מעריכים, לא מחברים."],
        [(c*n)+pw("x",m*n),"הכפלתם את המקדם במעריך במקום להעלות אותו בחזקה."],
        [Math.pow(c,n)+pw("x",m),"העליתם את המקדם בחזקה אבל השארתם את מעריך ה-x כמו שהוא."],
        [c+pw("x",m),"לא הפעלתם את החזקה החיצונית כלל — לא על המקדם ולא על המעריך."]
      ]),
      steps:[
        S("החזקה החיצונית חלה על כל מה שבסוגריים","גם על המספר וגם על ה-x. זו הטעות הכי נפוצה כאן.",
          "("+c+"x<sup>"+m+"</sup>)<sup>"+n+"</sup> = "+c+"<sup>"+n+"</sup> · (x<sup>"+m+"</sup>)<sup>"+n+"</sup>"),
        S("חזקה של חזקה — מכפילים מעריכים","(xᵃ)ᵇ = xᵃ·ᵇ","(x<sup>"+m+"</sup>)<sup>"+n+"</sup> = x<sup>"+(m*n)+"</sup>"),
        S("מחשבים את המקדם","",c+"<sup>"+n+"</sup> = "+Math.pow(c,n)),
        S("התשובה","",Math.pow(c,n)+pw("x",m*n))
      ],rule:"powpow",hint:"סוגריים בחזקה: כל גורם בפנים מקבל את החזקה. ובחזקה של חזקה — מכפילים."};
  }
  /* רמה 4 — שלושה חוקי חזקות בביטוי אחד, והתוצאה יוצאת לפעמים
     במעריך חיובי ולפעמים שלילי. לא נאמר באיזה חוק להתחיל. */
  if(L===4){
    c=ri(2,4);n=ri(2,3);m=ri(2,3);
    while(m===2&&n===2)m=ri(2,3);          /* m·n = m+n מוחק את ההבדל בין המסיח לתשובה */
    /* j4 = −e4 היה נותן למסיח ״חיברתם בחילוק״ בדיוק את המעריך של
       התשובה בערך מוחלט. השבר והחזקה נראים שונה לגמרי על המסך, אבל
       כטקסט חשוף הם זהים, והמסיח היה נשמט בשקט — שלוש אפשרויות. */
    var k4=ri(1,5),e4=rnz(-5,5),j4=m*n+k4-e4,t4=0;
    while((j4<1||j4>14||j4===-e4)&&t4<60){k4=ri(1,5);e4=rnz(-5,5);j4=m*n+k4-e4;t4++}
    if(j4<1||j4>14||j4===-e4){k4=2;e4=-2;j4=m*n+k4-e4}
    var cn=Math.pow(c,n);
    var frac4=function(top,ex){return '<span class="frac"><span>'+top+'</span><span>'+pw("x",ex)+'</span></span>'};
    var show=function(co,ex){return ex===0?String(co):ex>0?co+pw("x",ex):frac4(co,-ex)};
    var e2=m+n+k4-j4;
    steps=[
      S("מתחילים מהסוגריים","החזקה החיצונית חלה על כל גורם בפנים, וחזקה של חזקה מכפילה מעריכים.",
        "("+c+"x<sup>"+m+"</sup>)<sup>"+n+"</sup> = "+cn+"x<sup>"+(m*n)+"</sup>"),
      S("כפל באותו בסיס — מחברים מעריכים","",
        "x<sup>"+(m*n)+"</sup> · x<sup>"+k4+"</sup> = x<sup>"+(m*n+k4)+"</sup>"),
      S("חילוק באותו בסיס — מחסרים מעריכים","",
        "x<sup>"+(m*n+k4)+"</sup> ÷ x<sup>"+j4+"</sup> = x<sup>"+num(e4)+"</sup>"),
      e4<0?S("מעריך שלילי יורד למכנה","הכלל: x⁻ᵃ = 1/xᵃ. המקדם נשאר למעלה.",show(cn,e4))
          :S("התשובה","",show(cn,e4))
    ];
    return {ask:"פשטו והציגו בלי מעריך שלילי",
      expr:"("+c+pw("x",m)+")<sup>"+n+"</sup> · "+pw("x",k4)+" ÷ "+pw("x",j4),
      ans:W(show(cn,e4)),
      wrong:[
        W(show(c,e4),"החזקה החיצונית חלה גם על המקדם "+c+", ולא רק על ה-x."),
        W(show(cn,e2),"בחזקה של חזקה חיברתם מעריכים במקום להכפיל אותם."),
        e4<0?W("−"+cn+pw("x",-e4),"מעריך שלילי אינו סימן מינוס של הביטוי — הוא מוריד את החזקה למכנה.")
            :W(cn+pw("x",-e4),"חיסרתם את המעריכים בכיוון ההפוך. מחסרים את המעריך של המכנה מזה של המונה."),
        W(show(cn,m*n+k4+j4),"בחילוק חיברתם מעריכים. חיבור שייך לכפל, ובחילוק מחסרים.")
      ],
      steps:steps,rule:"powneg",
      hint:"שלושה חוקים שונים נדרשים כאן. מתחילים מהסוגריים — כל עוד יש חזקה של חזקה, אי אפשר לחבר או לחסר מעריכים."};
  }
  m=ri(2,6);n=ri(m+1,m+5);
  return {ask:"פשטו והציגו בלי מעריך שלילי",expr:pw("x",m)+" ÷ "+pw("x",n),
    ans:W('<span class="frac"><span>1</span><span>'+pw("x",n-m)+'</span></span>'),
    wrong:[
      W(pw("x",n-m),"קיבלתם מעריך שלילי והורדתם ממנו את המינוס. מעריך שלילי הופך לשבר, לא נעלם."),
      W('<span class="frac"><span>1</span><span>'+pw("x",(m-n===0?1:Math.abs(m*n)))+'</span></span>',"הכפלתם את המעריכים במקום לחסר."),
      W("−"+pw("x",n-m),"המינוס עבר למקדם. מעריך שלילי לא הופך את הסימן של הביטוי, אלא מוריד אותו למכנה.")
    ],
    steps:[
      S("מחסרים מעריכים","x<sup>"+m+"</sup> ÷ x<sup>"+n+"</sup> = x<sup>"+m+"−"+n+"</sup>","x<sup>"+num(m-n)+"</sup>"),
      S("מעריך שלילי יורד למכנה","הכלל: x⁻ᵃ = 1/xᵃ. הסימן במעריך אומר ״עבור לצד השני של קו השבר״, לא ״מינוס״.",
        "x<sup>"+num(m-n)+"</sup> = 1 / "+pw("x",n-m)),
      S("התשובה","",'<span class="frac"><span>1</span><span>'+pw("x",n-m)+'</span></span>')
    ],rule:"powneg",hint:"מעריך שלילי אינו מספר שלילי — הוא אומר שהחזקה יורדת למכנה."};
}

/* ---------- 8. שורשים ---------- */
function genRoots(L){
  var n,o,a,b,steps;
  if(L===1){
    n=pick([16,25,36,49,64,81,100,121,144,169,196,225,256,400,625]);
    var r=Math.round(Math.sqrt(n));
    return {ask:"חשבו",expr:"√"+n,ans:W(String(r)),
      wrong:wSel(String(r),[
        [String(n/2),"חילקתם ב-2. שורש הוא לא חצי — הוא המספר שמוכפל בעצמו נותן "+n+"."],
        [String(r+1),"קרוב, אבל "+(r+1)+"² = "+((r+1)*(r+1))+" ולא "+n+"."],
        [String(r*2),"זה כפול השורש."],
        [String(r-1),"קרוב, אבל "+(r-1)+"² = "+((r-1)*(r-1))+" ולא "+n+"."]
      ]),
      steps:[
        S("שואלים: איזה מספר בריבוע נותן "+n+"?","שורש ריבועי הוא הפעולה ההפוכה להעלאה בריבוע.","? · ? = "+n),
        S("בודקים","",r+" · "+r+" = "+n),
        S("התשובה","","√"+n+" = "+r)
      ],rule:"root",hint:"שורש של מספר הוא המספר שכשמכפילים אותו בעצמו מקבלים אותו מספר."};
  }
  if(L===2){
    /* התשובה הייתה תמיד שורש שלא מתפשט עד הסוף, והמסיח "הכפלתם את
       שני החלקים" היה תמיד המספר השלם היחיד ברשימה — סימן היכר
       שאפשר למחוק לפיו בלי לפשט. עכשיו חלק מההגרלות נותנות ריבוע
       שלם, ואז דווקא התשובה היא המספר השלם היחיד; ובנוסף סדר
       המסיחים מוגרל, כדי שאותו מסיח לא יופיע בכל שאלה. */
    var base=pick([1,1,2,3,5,6,7,10,11]),sq=pick([2,3,4,5,6]);
    /* בריבוע שלם עם sq = 2 המספר הוא 4, ואז המסיח "הכפלתם ב-2" שווה
       למספר שמתחת לשורש — שני מסיחים זהים. */
    while((base!==1&&base===sq)||(base===1&&sq===2))sq=pick([2,3,4,5,6]);
    n=base*sq*sq;
    o=simpRoot(n);
    var cands=(o.in===1)?[
        [String(n),"זה המספר שמתחת לשורש עצמו, ולא השורש שלו."],
        ["√"+o.out,"הוצאתם שורש פעמיים. פעם אחת מספיקה."],
        [String(2*o.out),"הכפלתם ב-2. שורש אינו הכפלה ואינו חלוקה בשתיים."]
      ]:[
        [String(o.out*o.in),"הכפלתם את שני החלקים. המספר שיצא מהשורש נשאר מוכפל בשורש שנשאר, לא מתמזג איתו."],
        ["√"+(o.out*o.in),"הוצאתם את הגורם הריבועי בלי לחשב את השורש שלו."],
        [(o.out*o.out)+"√"+o.in,"הוצאתם מהשורש את המספר הריבועי עצמו במקום את השורש שלו."],
        [o.in+"√"+o.out,"החלפתם בין המספר שיוצא מהשורש ובין זה שנשאר בתוכו."]
      ];
    shuffle(cands);
    return {ask:"פשטו את השורש",expr:"√"+n,ans:W(rootHtml(o)),
      wrong:wSel(rootHtml(o),cands),
      steps:[
        S("מפרקים למכפלה עם ריבוע שלם",(o.in===1?n+" הוא בעצמו ריבוע שלם, ולכן כל השורש יוצא החוצה ולא נשאר בפנים כלום.":"מחפשים את הריבוע השלם הגדול ביותר שמחלק את "+n+"."),"√"+n+" = √("+(o.out*o.out)+(o.in===1?")":" · "+o.in+")")),
        S("שורש של מכפלה = מכפלת השורשים","","√"+(o.out*o.out)+(o.in===1?"":" · √"+o.in)),
        S("מוציאים את מה שאפשר","",rootHtml(o))
      ],rule:"rootsimp",hint:"מחפשים ריבוע שלם שמתחבא בתוך המספר, ומוציאים רק את השורש שלו."};
  }
  /* רמה 4 — שני שורשים שנראים שונים. רק אחרי פישוט מתברר שהם דומים
     ואפשר לכנס. מי שינסה לכנס מיד, או לפשט ולעצור, לא יגיע לתשובה. */
  if(L===4){
    var p4=pick([2,3,5,6,7]),k1=ri(2,5),k2=ri(2,5),plus4=Math.random()<0.6;
    while(k2===k1)k2=ri(2,5);
    if(!plus4&&k2>k1){var sk=k1;k1=k2;k2=sk}
    var n1=p4*k1*k1,n2=p4*k2*k2,s4=plus4?k1+k2:k1-k2;
    var rt=function(co,rad){return (co===1?"":co)+"√"+rad};   /* 1√2 אינו כתיב מקובל */
    steps=[
      S("מפשטים כל שורש בנפרד","שני השורשים נראים זרים זה לזה. מחפשים בכל אחד את הריבוע השלם שמסתתר בו.",
        "√"+n1+" = √("+(k1*k1)+" · "+p4+") = "+k1+"√"+p4),
      S("ואותו דבר בשני","","√"+n2+" = √("+(k2*k2)+" · "+p4+") = "+k2+"√"+p4),
      S("עכשיו שני השורשים זהים","ורק שורשים זהים אפשר לכנס. מחברים או מחסרים אך ורק את המקדמים.",
        k1+"√"+p4+(plus4?" + ":" − ")+k2+"√"+p4),
      S("התשובה","",k1+(plus4?" + ":" − ")+k2+" = "+s4+"  →  "+rt(s4,p4))
    ];
    return {ask:"כתבו כביטוי אחד",expr:"√"+n1+(plus4?" + ":" − ")+"√"+n2,ans:W(rt(s4,p4)),
      wrong:[
        W("√"+(plus4?n1+n2:n1-n2),"חיברתם את המספרים שבתוך השורש. √a + √b אינו √(a+b)."),
        W(rt(s4,2*p4),"כינסתם גם את מה שבתוך השורש. השורש הוא ה״שם״ של האיבר — הוא נשאר כמו שהוא."),
        W(rt(plus4?k1*k2:k1+k2,p4),plus4?"הכפלתם את המקדמים במקום לחבר אותם.":"חיברתם את המקדמים במקום לחסר אותם."),
        W(num(r2(Math.sqrt(n1)+(plus4?1:-1)*Math.sqrt(n2))),"זה הערך המקורב שיוצא במחשבון. השאלה מבקשת תשובה מדויקת בצורת שורש.")
      ],steps:steps,rule:"rootadd",
      hint:"אי אפשר לכנס שורשים שאינם זהים — אבל אולי הם כן יהיו זהים אחרי פישוט. משם מתחילים."};
  }
  a=ri(2,9);b=ri(2,9);
  n=pick([2,3,5,6,7,10]);
  var sum=a+b;
  return {ask:"כנסו איברים דומים",expr:a+"√"+n+" + "+b+"√"+n,ans:W(sum+"√"+n),
    wrong:wSel(sum+"√"+n,[
      [sum+"√"+(n*2),"חיברתם גם את המספרים שבתוך השורש. השורש הוא ה״שם״ של האיבר — הוא לא משתנה."],
      [(a*b)+"√"+n,"הכפלתם את המקדמים במקום לחבר אותם."],
      [(a+b)+"√"+(n*n),"העליתם את השורש בריבוע."],
      [a+"√"+n,"לקחתם רק את האיבר הראשון."],
      [b+"√"+n,"לקחתם רק את האיבר השני."],
      [String(sum),"השמטתם את השורש. הוא חלק מהאיבר ואינו נעלם בכינוס."]
    ]),
    steps:[
      S("שורשים שווים מתנהגים כמו משתנה","a√"+n+" + b√"+n+" זה בדיוק כמו ax + bx. מחברים רק את המקדמים.",
        a+"√"+n+" + "+b+"√"+n),
      S("מחברים מקדמים","",a+" + "+b+" = "+sum),
      S("התשובה","",sum+"√"+n)
    ],rule:"rootadd",hint:"רק שורשים זהים מתחברים, ומחברים אך ורק את המקדמים שלפניהם."};
}
/* ---------- 9. הישר y = mx + b ---------- */
/* משוואת ישר לתצוגה. מסיח שנקודת החיתוך שלו יצאה אפס הוצג כ״y = 2x + 0״
   — כתיב שאיש אינו כותב, ולכן אפשרות שאפשר לפסול בלי לחשב. */
function lineEq(m,b){return "y = "+coef(m,"x")+(b===0?"":sgn(b))}
function genLine(L){
  var m,b,x1,y1,x2,y2,steps;
  if(L===1){
    m=rnz(-5,5);x1=ri(-6,6);x2=x1+rnz(1,5);b=ri(-8,8);
    y1=m*x1+b;y2=m*x2+b;
    steps=[
      S("נוסחת השיפוע","שיפוע = כמה ה-y משתנה חלקי כמה ה-x משתנה.","m = (y₂ − y₁) ÷ (x₂ − x₁)"),
      S("מציבים","","m = ("+num(y2)+" − "+pn(y1)+") ÷ ("+num(x2)+" − "+pn(x1)+")"),
      S("מחשבים","","m = "+num(y2-y1)+" ÷ "+num(x2-x1)+" = "+num(m))
    ];
    return {ask:"מצאו את שיפוע הישר העובר בנקודות",
      expr:"("+num(x1)+", "+num(y1)+")   ,   ("+num(x2)+", "+num(y2)+")",
      ans:W("m = "+num(m)),
      wrong:[
        W("m = "+num(r2((x2-x1)/(y2-y1))),"הפכתם את השבר. השינוי ב-y הוא המונה, השינוי ב-x הוא המכנה."),
        W("m = "+num(-m),"טעות סימן בחיסור. שמרו על אותו סדר בשני החיסורים."),
        W("m = "+num(y2-y1),"עצרתם אחרי החיסור בלי לחלק בהפרש ה-x."),
        /* שני מסיחי מילוי. הראשון והשלישי מתלכדים עם התשובה כש-|m| = 1
           או כשהפרש ה-x הוא 1, ובלעדיהם נשארו שם שתי אפשרויות בלבד. */
        W("m = "+num(y1-y2),"חיסרתם את ה-y בסדר ההפוך, וגם לא חילקתם בהפרש ה-x."),
        W("m = "+num(x2-x1),"זה הפרש ה-x. הוא המכנה בנוסחה, לא השיפוע עצמו.")
      ],steps:steps,rule:"slope",
      hint:"שיפוע = הפרש ה-y חלקי הפרש ה-x, ותמיד באותו סדר בשני החיסורים."};
  }
  if(L===2){
    m=rnz(-5,5);x1=rnz(-7,7);b=rnz(-9,9);y1=m*x1+b;
    steps=[
      S("מציבים את הנקודה במשוואת הישר","y = mx + b — יודעים את m, את x ואת y, ומחפשים את b.",
        num(y1)+" = "+num(m)+"·"+pn(x1)+" + b"),
      S("מחשבים את המכפלה","",num(y1)+" = "+num(m*x1)+" + b"),
      S("מבודדים את b","",	"b = "+num(y1)+" − "+pn(m*x1)+" = "+num(b))
    ];
    return {ask:"ישר בעל שיפוע "+num(m)+" עובר בנקודה ("+num(x1)+", "+num(y1)+"). מהי משוואת הישר?",
      expr:"",ans:W(lineEq(m,b)),
      wrong:wSel(lineEq(m,b),[
        [lineEq(m,y1),"לקחתם את ערך ה-y של הנקודה כ-b. b הוא מקום החיתוך עם ציר y, כלומר הערך כש-x שווה 0."],
        [lineEq(m,-b),"טעות סימן כשבידדתם את b."],
        [lineEq(x1,b),"החלפתם בין השיפוע לבין ערך ה-x של הנקודה."],
        [lineEq(m,y1+m*x1),"חיברתם במקום לחסר כשבידדתם את b. המכפלה m·x עוברת אגף ומחליפה סימן."],
        [lineEq(m,x1),"לקחתם את ערך ה-x של הנקודה כ-b."],
        [lineEq(b,m),"החלפתם בין השיפוע ל-b. השיפוע הוא זה שמוכפל ב-x."],
        [lineEq(-m,b),"העתקתם את השיפוע בסימן הפוך."]
      ]),steps:steps,rule:"lineeq",
      hint:"מציבים את x ואת y של הנקודה בתוך y = mx + b, ומשאירים את b כנעלם."};
  }
  /* רמה 4 — שתי נקודות בכניסה, ושאלה שאינה ״מהי משוואת הישר״. את
     המשוואה צריך למצוא כדי להמשיך, אבל אף אחד לא מבקש אותה. */
  if(L===4){
    m=rnz(-4,4);
    var x0=rnz(-6,6);
    b=-m*x0;
    x1=rnz(-7,7);x2=rnz(-7,7);
    while(x2===x1||x1===x0||x2===x0){x1=rnz(-7,7);x2=rnz(-7,7)}
    y1=m*x1+b;y2=m*x2+b;
    if(Math.random()<0.5){
      /* בשיפוע −1 מתקיים b = x₀, והמסיח ״הצבתם את b״ הופך להיות
         התשובה הנכונה עצמה. אז הוא נשמט, והשאלה הוצגה בשלוש. */
      while(m===-1){m=rnz(-4,4);b=-m*x0;y1=m*x1+b;y2=m*x2+b}
      steps=[
        S("שלב א: מחשבים שיפוע","","m = ("+num(y2)+" − "+pn(y1)+") ÷ ("+num(x2)+" − "+pn(x1)+") = "+num(m)),
        S("שלב ב: מוצאים את b","מציבים אחת הנקודות ב-y = mx + b.",
          num(y1)+" = "+num(m)+"·"+pn(x1)+" + b  →  b = "+num(b)),
        S("שלב ג: על ציר x מתקיים y = 0","זו ההגדרה של ציר ה-x, וזה מה שהופך את השאלה למשוואה.",
          "0 = "+coef(m,"x")+sgn(b)),
        S("פותרים","","x = "+num(-b)+" ÷ "+pn(m)+" = "+num(x0)+"   →   ("+num(x0)+", 0)")
      ];
      return {ask:"באיזו נקודה חותך את ציר ה-x הישר העובר בשתי הנקודות?",
        expr:"("+num(x1)+", "+num(y1)+")   ,   ("+num(x2)+", "+num(y2)+")",
        ans:W("("+num(x0)+", 0)"),
        wrong:[
          W("(0, "+num(b)+")","זו נקודת החיתוך עם ציר y. על ציר x דווקא ה-y הוא שמתאפס."),
          W("("+num(b)+", 0)","הצבתם את b כתשובה. b הוא נקודת החיתוך עם ציר y, וצריך עוד לפתור mx + b = 0."),
          W("("+num(-x0)+", 0)","טעות סימן בחילוק ב-m."),
          W("("+num(x2)+", 0)","זו נקודה שנתונה בשאלה, לא נקודת החיתוך עם הציר."),
          W("(0, 0)","ראשית הצירים אכן נמצאת על ציר ה-x, אבל הישר הזה אינו עובר דרכה."),
          W("("+num(x0)+", "+num(b)+")","מצאתם את ה-x הנכון, אבל צירפתם לו את b. על ציר x ערך ה-y הוא 0.")
        ],steps:steps,rule:"lineeq",
        hint:"שתי נקודות מגדירות ישר אחד. ועל ציר ה-x כל הנקודות חולקות תכונה אחת — שווה לחשוב מהי."};
    }
    /* xq = −x₀ נותן m·xq = b, ו-xq = −2x₀ נותן m·xq = 2b. בשני
       המקרים שניים מהמסיחים מתלכדים ונשארות שלוש אפשרויות. */
    var xq=rnz(-8,9);
    while(xq===x1||xq===x2||xq===-x0||xq===-2*x0)xq=rnz(-8,9);
    var yq=m*xq+b;
    steps=[
      S("שלב א: מחשבים שיפוע","","m = ("+num(y2)+" − "+pn(y1)+") ÷ ("+num(x2)+" − "+pn(x1)+") = "+num(m)),
      S("שלב ב: מוצאים את b","מציבים אחת הנקודות ב-y = mx + b.",
        num(y1)+" = "+num(m)+"·"+pn(x1)+" + b  →  b = "+num(b)),
      S("שלב ג: מציבים את ה-x שנשאלנו עליו","עכשיו יש משוואה מלאה, אפשר להציב בה כל x.",
        "y = "+num(m)+"·"+pn(xq)+sgn(b)+" = "+num(yq))
    ];
    return {ask:"הישר עובר בשתי הנקודות שלפניכם. מהו ערך y כאשר x = "+num(xq)+"?",
      expr:"("+num(x1)+", "+num(y1)+")   ,   ("+num(x2)+", "+num(y2)+")",
      ans:W("y = "+num(yq)),
      wrong:[
        W("y = "+num(m*xq),"הצבתם בשיפוע ושכחתם את b. y = mx + b, לא y = mx."),
        W("y = "+num(b),"זה ערך ה-y רק כאשר x = 0."),
        W("y = "+num(m+xq),"חיברתם את השיפוע ל-x במקום להכפיל."),
        W("y = "+num(y1+(xq-x1)),"קידמתם את ה-y ביחידה אחת לכל צעד ב-x. כל צעד ב-x מזיז את y בגודל השיפוע."),
        W("y = "+num(xq),"זה ערך ה-x שנתון בשאלה, לא ה-y שמחפשים."),
        W("y = "+num(m*xq-b),"טעות סימן ב-b בשלב ההצבה."),
        W("y = "+num(b*xq+m),"החלפתם בין m ל-b. השיפוע הוא זה שמוכפל ב-x.")
      ],steps:steps,rule:"lineeq",
      hint:"אי אפשר להציב לפני שיודעים גם את m וגם את b, ואת שניהם צריך למצוא מהנקודות."};
  }
  x1=ri(-6,4);x2=x1+ri(1,5);m=rnz(-4,4);b=rnz(-8,8);
  y1=m*x1+b;y2=m*x2+b;
  steps=[
    S("שלב א: מחשבים שיפוע","","m = ("+num(y2)+" − "+pn(y1)+") ÷ ("+num(x2)+" − "+pn(x1)+") = "+num(m)),
    S("שלב ב: מציבים נקודה אחת","אפשר כל אחת מהשתיים — התוצאה זהה.",num(y1)+" = "+num(m)+"·"+pn(x1)+" + b"),
    S("מבודדים b","","b = "+num(y1)+" − "+pn(m*x1)+" = "+num(b)),
    S("כותבים את המשוואה","","y = "+coef(m,"x")+sgn(b))
  ];
  return {ask:"מצאו את משוואת הישר העובר בשתי הנקודות",
    expr:"("+num(x1)+", "+num(y1)+")   ,   ("+num(x2)+", "+num(y2)+")",
    ans:W(lineEq(m,b)),
    wrong:wSel(lineEq(m,b),[
      [lineEq(m,-b),"טעות סימן בבידוד b."],
      [lineEq(-m,b),"השיפוע יצא בסימן הפוך — בדקו את סדר החיסור."],
      [lineEq(m,y2),"לקחתם ערך y של נקודה כ-b במקום לחשב אותו."],
      [lineEq(m,y1),"לקחתם ערך y של נקודה כ-b במקום לחשב אותו."],
      [lineEq(m,y1+m*x1),"חיברתם במקום לחסר כשבידדתם את b. המכפלה m·x עוברת אגף ומחליפה סימן."],
      [lineEq(y2-y1,b),"עצרתם אחרי הפרש ה-y ולא חילקתם בהפרש ה-x. זה לא השיפוע."],
      [lineEq(r2((x2-x1)/(y2-y1)),b),"הפכתם את שבר השיפוע. השינוי ב-y הוא המונה, השינוי ב-x הוא המכנה."]
    ]),steps:steps,rule:"lineeq",
    hint:"קודם שיפוע משתי הנקודות, אחר כך מציבים אחת מהן כדי למצוא את b."};
}

/* ---------- 10. מערכת שתי משוואות ---------- */
function genSystem(L){
  var x,y,a1,b1,c1,a2,b2,c2,steps;
  x=rnz(-8,8);y=rnz(-8,8);
  if(L===1){
    a1=1;b1=1;c1=x+y;
    a2=1;b2=-1;c2=x-y;
    steps=[
      S("מחברים את שתי המשוואות","כשמחברים אגף לאגף, ה-y מתבטל כי יש +y ו-−y.",
        "(x + y) + (x − y) = "+num(c1)+" + "+pn(c2)),
      S("מקבלים משוואה עם נעלם אחד","","2x = "+num(c1+c2)+"  →  x = "+num(x)),
      S("מציבים חזרה","","("+num(x)+") + y = "+num(c1)+"  →  y = "+num(y))
    ];
    return {ask:"פתרו את המערכת",expr:"x + y = "+num(c1)+"<br>x − y = "+num(c2),
      ans:W("x = "+num(x)+" , y = "+num(y)),
      wrong:wSel("x = "+num(x)+" , y = "+num(y),[
        ["x = "+num(y)+" , y = "+num(x),"החלפתם בין x ל-y בסוף."],
        ["x = "+num(c1)+" , y = "+num(c2),"לקחתם את אגפי הימין כתשובה בלי לפתור."],
        ["x = "+num(-x)+" , y = "+num(-y),"טעות סימן בחיבור המשוואות."],
        ["x = "+num(x)+" , y = "+num(-y),"טעות סימן ב-y בשלב ההצבה חזרה."],
        ["x = "+num(-x)+" , y = "+num(y),"טעות סימן ב-x כשחילקתם ב-2."]
      ]),steps:steps,rule:"sys",
      hint:"כשמקדם אחד הוא +1 והשני −1 — פשוט מחברים את שתי המשוואות והנעלם נעלם."};
  }
  if(L===2){
    a1=rnz(-4,4);b1=rnz(-4,4);a2=rnz(-4,4);b2=rnz(-4,4);
    var tries=0;
    while((a1*b2-a2*b1===0)&&tries<50){a2=rnz(-4,4);b2=rnz(-4,4);tries++}
    if(a1*b2-a2*b1===0){a1=1;b1=2;a2=3;b2=-1}
    c1=a1*x+b1*y;c2=a2*x+b2*y;
    steps=[
      S("בוחרים נעלם לסלק","מכפילים כל משוואה כך שמקדמי ה-y יהיו הפוכים.",
        "משוואה 1 · "+num(b2)+" , משוואה 2 · "+num(-b1)),
      S("מחברים ומקבלים משוואה אחת","",num(a1*b2-a2*b1)+"x = "+num(c1*b2-c2*b1)),
      S("מחשבים x","","x = "+num(c1*b2-c2*b1)+" ÷ "+pn(a1*b2-a2*b1)+" = "+num(x)),
      S("מציבים ומוצאים y","","y = "+num(y))
    ];
    return {ask:"פתרו את המערכת",
      expr:coef(a1,"x")+term(b1,"y")+" = "+num(c1)+"<br>"+coef(a2,"x")+term(b2,"y")+" = "+num(c2),
      ans:W("x = "+num(x)+" , y = "+num(y)),
      wrong:wSel("x = "+num(x)+" , y = "+num(y),[
        ["x = "+num(y)+" , y = "+num(x),"החלפתם בין הנעלמים."],
        ["x = "+num(-x)+" , y = "+num(y),"טעות סימן בשלב הסילוק."],
        ["x = "+num(x)+" , y = "+num(-y),"טעות סימן בהצבה חזרה."],
        ["x = "+num(-x)+" , y = "+num(-y),"טעות סימן בשני הנעלמים — כל המערכת הוכפלה במינוס."],
        ["x = "+num(c1)+" , y = "+num(c2),"לקחתם את אגפי הימין כתשובה בלי לפתור."]
      ]),steps:steps,rule:"sys",
      hint:"מכפילים משוואה במספר כך שמקדמי אחד הנעלמים יהיו הפוכים, ואז מחברים."};
  }
  /* רמה 4 — הסיפור בא במקום המערכת. את שתי המשוואות התלמיד כותב
     בעצמו, ובסוף צריך לזכור מה בכלל נשאל. */
  if(L===4){
    x=ri(3,15);y=ri(2,12);
    /* y = 2x מזהה את מסיח ההפרש עם התשובה עצמה */
    while(y===x||y===2*x||x===2*y)y=ri(2,12);
    a1=ri(1,4);b1=ri(1,4);a2=ri(1,4);b2=ri(1,4);
    var tr5=0;
    while((a1*b2-a2*b1===0)&&tr5<40){a2=ri(1,4);b2=ri(1,4);tr5++}
    if(a1*b2-a2*b1===0){a1=1;b1=2;a2=3;b2=1}
    c1=a1*x+b1*y;c2=a2*x+b2*y;
    var askX=Math.random()<0.5,want=askX?x:y;
    steps=[
      /* רווחים כפולים סביב טקסט עברי שוברים את התרגום: שכבת התרגום
         מנרמלת רווחים כדי למצוא את המפתח, ואז מחפשת את המחרוזת
         המנורמלת בתוך המקור — ולא מוצאת אותה. רווח יחיד בלבד. */
      S("מסמנים את הנעלמים","כל דבר שמחירו לא ידוע מקבל אות משלו.",
        "x = מחיר מחברת , y = מחיר עט"),
      S("כל קנייה היא משוואה","",coef(a1,"x")+term(b1,"y")+" = "+c1+"<br>"+coef(a2,"x")+term(b2,"y")+" = "+c2),
      S("מסלקים נעלם אחד","מכפילים כל משוואה כך שמקדמי ה-y יתבטלו, ומחברים.",
        "משוואה 1 · "+num(b2)+" , משוואה 2 · "+num(-b1)),
      S("מוצאים את שני המחירים","","x = "+x+" , y = "+y),
      S("חוזרים לשאלה","נשאלנו על "+(askX?"מחברת":"עט")+" בלבד — ורק את זה עונים.",want+' ש"ח')
    ];
    return {ask:"קנו "+a1+" מחברות ו-"+b1+" עטים ושילמו "+c1+' ש"ח. באותה חנות קנו '+a2+" מחברות ו-"+b2+
        " עטים ושילמו "+c2+' ש"ח. מה מחיר '+(askX?"מחברת אחת":"עט אחד")+"?",
      expr:"",ans:W(want+' ש"ח'),
      wrong:[
        W((askX?y:x)+' ש"ח',"פתרתם נכון, אבל עניתם על הנעלם השני. שווה לחזור ולקרוא מה נשאל."),
        W((x+y)+' ש"ח',"זה המחיר של מחברת ועט יחד."),
        W(num(r2(c1/(a1+b1)))+' ש"ח',"חילקתם את הסכום במספר הפריטים, כאילו כולם עולים אותו דבר."),
        W(Math.abs(x-y)+' ש"ח',"זה ההפרש בין שני המחירים.")
      ],steps:steps,rule:"sys",
      hint:"שתי קניות — שתי משוואות. מסמנים באות את מה שלא ידוע, ובסוף בודקים על מה בדיוק נשאלתם."};
  }
  a1=rnz(-3,3);b1=rnz(-3,3);
  /* a1===b1 הופך את המשוואה הראשונה לכפולה של x+y=const: למערכת
     אינסוף פתרונות, שלוש מארבע האפשרויות נכונות, והצעד מציג 0x = 0
     ואז מכריז על פתרון יחיד. */
  while(b1===a1)b1=rnz(-3,3);
  c1=a1*x+b1*y;
  steps=[
    S("מבודדים נעלם אחד","מהמשוואה השנייה קל לבודד את y.","y = "+num(x+y)+" − x"),
    S("מציבים בביטוי הראשון","מחליפים כל y בביטוי שקיבלנו.",
      coef(a1,"x")+" + "+num(b1)+"("+num(x+y)+" − x) = "+num(c1)),
    S("פותחים ומכנסים","",num(a1-b1)+"x = "+num(c1-b1*(x+y))),
    S("מחשבים x ואז y","","x = "+num(x)+"  ,  y = "+num(y))
  ];
  return {ask:"פתרו בשיטת ההצבה",
    expr:coef(a1,"x")+term(b1,"y")+" = "+num(c1)+"<br>x + y = "+num(x+y),
    ans:W("x = "+num(x)+" , y = "+num(y)),
    wrong:wSel("x = "+num(x)+" , y = "+num(y),[
      ["x = "+num(y)+" , y = "+num(x),"החלפתם בין הנעלמים בסוף."],
      ["x = "+num(x+y)+" , y = 0","הנחתם ש-y שווה אפס. אין לזה בסיס במשוואות."],
      ["x = "+num(-x)+" , y = "+num(-y),"טעות סימן בפתיחת הסוגריים אחרי ההצבה."],
      ["x = "+num(x)+" , y = "+num(-y),"טעות סימן ב-y כשחזרתם להציב."],
      ["x = "+num(-x)+" , y = "+num(y),"טעות סימן ב-x אחרי ההצבה."]
    ]),steps:steps,rule:"sys",
    hint:"מבודדים נעלם אחד מהמשוואה הפשוטה, ומציבים אותו במשוואה השנייה."};
}

/* ---------- 11. משוואה ריבועית ---------- */
/* שני פתרונות אינם רשימה מסודרת: ״x = 3 , x = −3״ ו-״x = −3 , x = 3״
   הם אותה תשובה. מסיח שנופל על אותה קבוצה הוא תשובה נכונה שנייה,
   והשוואת טקסט לבדה אינה תופסת אותו. */
function sameRoots(p1,p2,q1,q2){
  return (p1===q1&&p2===q2)||(p1===q2&&p2===q1);
}

function genQuad(L){
  var r1,r2,a,b,c,steps;
  if(L===1){
    r1=rnz(-9,9);r2=rnz(-9,9);
    while(r2===r1)r2=rnz(-9,9);          /* שני שורשים שונים — אחרת המסיחים קורסים */
    b=-(r1+r2);c=r1*r2;
    steps=[
      S("מחפשים שני מספרים","צריך שני מספרים שהמכפלה שלהם "+num(c)+" והסכום שלהם "+num(-b)+".",
        "מכפלה: "+num(c)+"   סכום: "+num(-b)),
      S("מוצאים אותם","",num(r1)+" ו-"+num(r2)),
      S("מפרקים לגורמים","",	"(x"+sgn(-r1)+")(x"+sgn(-r2)+") = 0"),
      S("מכפלה מתאפסת כשאחד הגורמים מתאפס","",	"x = "+num(r1)+" או x = "+num(r2))
    ];
    return {ask:"פתרו את המשוואה",expr:quadStr(1,b,c)+" = 0",
      ans:W("x = "+num(r1)+" , x = "+num(r2)),
      wrong:wSel("x = "+num(r1)+" , x = "+num(r2),[
        /* כששני השורשים הפוכים זה לזה — x² − 81 = 0 — היפוך הסימן של
           שניהם מחזיר בדיוק את אותה קבוצת פתרונות, כלומר תשובה נכונה
           שנייה. במקרה הזה המועמד יורד. */
        r2===-r1?null:["x = "+num(-r1)+" , x = "+num(-r2),"שכחתם להפוך סימן. אם הפירוק הוא (x − r) אז השורש הוא +r."],
        /* גם המקדמים עצמם יוצאים לפעמים בדיוק שני השורשים, בסדר הפוך.
           אותה קבוצת פתרונות היא תשובה נכונה, ולא מסיח. */
        sameRoots(b,c,r1,r2)?null:["x = "+num(b)+" , x = "+num(c),"לקחתם את המקדמים כפתרונות."],
        ["x = "+num(r1)+" , x = "+num(-r2),"סימן אחד הופך והשני לא — שווה לבדוק את הפירוק שוב."],
        ["x = "+num(-r1)+" , x = "+num(r2),"סימן אחד הופך והשני לא — שווה לבדוק את הפירוק שוב."],
        sameRoots(-b,-c,r1,r2)?null:["x = "+num(-b)+" , x = "+num(-c),"לקחתם את המקדמים כפתרונות, בסימן הפוך."]
      ]),steps:steps,rule:"quadfac",
      hint:"מחפשים שני מספרים שמכפלתם היא האיבר החופשי וסכומם הוא מינוס המקדם של x."};
  }
  if(L===2){
    a=pick([1,1,2,2,3]);r1=rnz(-6,6);r2=rnz(-6,6);
    while(r2===r1)r2=rnz(-6,6);
    b=-a*(r1+r2);c=a*r1*r2;
    var disc=b*b-4*a*c;
    steps=[
      S("מזהים את המקדמים","","a = "+a+"   b = "+num(b)+"   c = "+num(c)),
      S("מחשבים דיסקרימיננטה","Δ = b² − 4ac. היא מספרת כמה פתרונות יש.",
        "Δ = "+pn(b)+"² − 4·"+a+"·"+pn(c)+" = "+num(disc)),
      S("מציבים בנוסחת השורשים","x = (−b ± √Δ) ÷ 2a",
        "x = ("+num(-b)+" ± "+num(Math.sqrt(disc))+") ÷ "+(2*a)),
      S("שני הפתרונות","","x = "+num(r1)+"   ,   x = "+num(r2))
    ];
    return {ask:"פתרו בעזרת נוסחת השורשים",expr:quadStr(a,b,c)+" = 0",
      ans:W("x = "+num(r1)+" , x = "+num(r2)),
      wrong:wSel("x = "+num(r1)+" , x = "+num(r2),[
        /* שני שורשים הפוכים זה לזה: היפוך הסימן של שניהם מחזיר את
           אותה קבוצת פתרונות, כלומר תשובה נכונה שנייה. */
        r2===-r1?null:["x = "+num(-r1)+" , x = "+num(-r2),"טעות סימן ב-−b. שימו לב שהנוסחה מתחילה במינוס b."],
        /* כש-a = 1 החלוקה ב-2 היא בדיוק הפתרון הנכון. קודם המסיח הזה
           נשמט רק כשגם סדר השורשים יצא זהה, ואחרת הוצגה כאן תשובה
           נכונה שנייה שנחשבה טעות. */
        /* r2 כאן הוא שורש המשוואה ולא פונקציית העיגול — השם תפוס
           בגנרטור הזה, וכל הערכים כאן ממילא יוצאים מדויקים. */
        a===1?null:["x = "+num((-b+Math.sqrt(disc))/2)+" , x = "+num((-b-Math.sqrt(disc))/2),"חילקתם ב-2 במקום ב-2a."],
        ["x = "+num(r1)+" , x = "+num(r1),"מצאתם פתרון אחד בלבד. הסימן ± נותן שני פתרונות."],
        ["x = "+num((-b+Math.sqrt(disc))/a)+" , x = "+num((-b-Math.sqrt(disc))/a),"חילקתם ב-a במקום ב-2a."],
        ["x = "+num(-b/(2*a)+Math.sqrt(disc))+" , x = "+num(-b/(2*a)-Math.sqrt(disc)),"חילקתם רק את b במכנה והשארתם את השורש בחוץ. קו השבר חל על כל המונה."],
        ["x = "+num(r2)+" , x = "+num(r2),"מצאתם פתרון אחד בלבד. הסימן ± נותן שני פתרונות."],
        sameRoots(b,c,r1,r2)?null:["x = "+num(b)+" , x = "+num(c),"לקחתם את המקדמים כפתרונות."]
      ]),steps:steps,rule:"quadform",
      hint:"נוסחת השורשים: x = (−b ± √(b²−4ac)) ÷ 2a. שימו לב שמחלקים ב-2a ולא ב-2."};
  }
  /* רמה 4 — המשוואה לא ניתנת מסודרת, או שהיא בכלל לא ניתנת. צריך
     לבנות אותה ואז לבחור מה מבין שני הפתרונות באמת עונה על השאלה. */
  if(L===4){
    if(Math.random()<0.5){
      var wd=ri(2,12),kk4=ri(1,8),ar4=wd*(wd+kk4);
      steps=[
        S("מסמנים את הנעלם","מסמנים ב-x את הצלע שמחפשים, ומבטאים דרכה את השנייה.",
          "x = הרוחב , האורך = x + "+kk4),
        S("כותבים את השטח כמשוואה","שטח מלבן = אורך · רוחב.","x(x + "+kk4+") = "+ar4),
        S("מסדרים למשוואה ריבועית","מעבירים הכול לצד אחד — רק כך אפשר לפרק לגורמים.",
          "x<sup>2</sup> + "+kk4+"x − "+ar4+" = 0"),
        S("מפרקים ופותרים","מחפשים שני מספרים שמכפלתם −"+ar4+" וסכומם "+kk4+".",
          "(x − "+wd+")(x + "+(wd+kk4)+") = 0 → x = "+wd+" או x = −"+(wd+kk4)),
        S("בוחרים את הפתרון שמתאים לשאלה","אורך צלע אינו יכול להיות שלילי, ולכן הפתרון השני נפסל.",
          "הרוחב = "+wd+' ס"מ')
      ];
      return {ask:"אורך מלבן גדול ב-"+kk4+' ס"מ מרוחבו, ושטחו '+ar4+' סמ"ר. מהו רוחב המלבן?',
        expr:"",ans:W(wd+' ס"מ'),
        wrong:[
          W((wd+kk4)+' ס"מ',"זה האורך. השאלה מבקשת את הרוחב, והוא הקטן מביניהם."),
          W("−"+(wd+kk4)+' ס"מ',"זה הפתרון השני של המשוואה, אבל אורך צלע אינו יכול להיות שלילי."),
          /* r2 כאן הוא שורש המשוואה, לא פונקציית העיגול — בגנרטור הזה
             השם תפוס, ולכן העיגול נעשה במפורש. */
          W(num(Math.round(ar4/kk4*100)/100)+' ס"מ',"חילקתם את השטח בהפרש בין הצלעות. ההפרש אינו אחת הצלעות."),
          W(num(Math.round(Math.sqrt(ar4)*100)/100)+' ס"מ',"הנחתם שזה ריבוע. שתי הצלעות כאן אינן שוות.")
        ],steps:steps,rule:"quadfac",
        hint:"אין כאן משוואה — צריך לכתוב אותה. מסמנים באות את הצלע המבוקשת ומבטאים דרכה את השנייה."};
    }
    r1=rnz(-8,8);r2=rnz(-8,8);
    /* r2 = −r1 נותן b = 0, ואיתו שתי תקלות באותה שאלה: המשוואה
       מוצגת "x² = 0x + 36" במקום "x² = 36", והמסיח שהופך את שני
       הסימנים הוא בדיוק אותה קבוצת פתרונות — כלומר שתי תשובות
       נכונות. וממילא זו שאלה אחרת: אין בה מה להעביר אגף, וזה כל
       מה שהרמה הזאת מלמדת. */
    while(r2===r1||r2===-r1)r2=rnz(-8,8);
    b=-(r1+r2);c=r1*r2;
    steps=[
      S("מעבירים הכול לצד אחד","משוואה ריבועית נפתרת רק כשבצד אחד יש אפס. זה הצעד שלפני כל השאר.",
        quadStr(1,b,c)+" = 0"),
      S("מחפשים שני מספרים","צריך שני מספרים שהמכפלה שלהם "+num(c)+" והסכום שלהם "+num(-b)+".",
        "מכפלה: "+num(c)+"   סכום: "+num(-b)),
      S("מפרקים לגורמים","","(x"+sgn(-r1)+")(x"+sgn(-r2)+") = 0"),
      S("מכפלה מתאפסת כשאחד הגורמים מתאפס","","x = "+num(r1)+" או x = "+num(r2))
    ];
    return {ask:"פתרו את המשוואה",expr:"x<sup>2</sup> = "+coef(-b,"x")+sgn(-c),
      ans:W("x = "+num(r1)+" , x = "+num(r2)),
      wrong:[
        W("x = "+num(-r1)+" , x = "+num(-r2),"פתרתם כאילו המשוואה כבר מסודרת. כשמעבירים אגף כל הסימנים מתהפכים."),
        W("x = "+num(-b)+" , x = "+num(c),"לקחתם את המספרים כפי שהם מופיעים במשוואה, בלי לפרק."),
        W("x = "+num(r1)+" , x = "+num(-r2),"סימן אחד הופך והשני לא — שווה לבדוק שוב את המעבר לצד אחד."),
        W("x = 0 , x = "+num(-b),"התעלמתם מהאיבר החופשי והוצאתם x מחוץ לסוגריים. יש כאן גם מספר בלי x.")
      ],steps:steps,rule:"quadfac",
      hint:"המשוואה לא כתובה בצורה שאפשר לפרק. קודם מסדרים אותה כך שבצד אחד יהיה אפס."};
  }
  a=pick([1,2,3]);b=rnz(-9,9);
  /* "אינסוף פתרונות" הופיע בכל שאלה ולא היה נכון אף פעם, מפני
     שהמשוואה תמיד הושוותה לאפס עם a שונה מאפס. עכשיו מוגרלת גם
     משוואה שבה שני האגפים זהים אחרי פתיחת סוגריים — ואז כל x
     מקיים אותה. זה בדיוק המצב שהמסיח מתאר. */
  var kind=pick(["two","one","none","inf"]);
  if(kind==="inf"){
    var kI=ri(2,4);c=rnz(-9,9);
    var lhs=quadStr(a*kI,b*kI,c*kI),rhs=kI+"("+quadStr(a,b,c)+")";
    steps=[
      S("קודם בודקים אם זו בכלל משוואה ריבועית","פותחים את הסוגריים באגף ימין ומשווים אגף לאגף.",
        rhs+" = "+lhs),
      S("מעבירים הכול לצד אחד","שני האגפים זהים לחלוטין, ולכן ההפרש ביניהם מתאפס בכל x.","0 = 0"),
      S("מה זה אומר","משוואה שמתקיימת לכל x אינה מגבילה אותו כלל, ולכן יש לה אינסוף פתרונות.","אינסוף פתרונות")
    ];
    return {ask:"כמה פתרונות יש למשוואה?",expr:lhs+" = "+rhs,
      ans:W("אינסוף פתרונות"),
      wrong:[
        W("שני פתרונות","הדיסקרימיננטה נבדקת רק אחרי שמעבירים הכול לצד אחד. כאן אחרי ההעברה לא נשאר x בכלל."),
        W("פתרון אחד","אין כאן פתרון בודד: כל מספר מקיים את המשוואה."),
        W("אין פתרון","זה ההפך. שני האגפים זהים, ולכן כל x מקיים את המשוואה ולא אף אחד.")
      ],
      steps:steps,rule:"disc",
      hint:"לפני שמחשבים דיסקרימיננטה — מעבירים הכול לצד אחד ובודקים מה בכלל נשאר."};
  }
  if(kind==="one"){ c=b*b/(4*a); if(Math.round(c)!==c){b=2*a;c=1} }
  else if(kind==="none"){ c=Math.ceil((b*b+1)/(4*a))+ri(0,4) }
  else { c=Math.floor((b*b-1)/(4*a))-ri(0,4) }
  var D=b*b-4*a*c;
  var ansTxt=D>0?"שני פתרונות":D===0?"פתרון אחד":"אין פתרון";
  steps=[
    S("מחשבים את הדיסקרימיננטה","Δ = b² − 4ac","Δ = "+pn(b)+"² − 4·"+a+"·"+pn(c)+" = "+num(D)),
    S("קוראים את הסימן של Δ","Δ חיובי → שני פתרונות. Δ אפס → פתרון אחד. Δ שלילי → אין פתרון ממשי, כי אין שורש למספר שלילי.",
      "Δ = "+num(D)+"  →  "+ansTxt)
  ];
  return {ask:"כמה פתרונות יש למשוואה?",expr:quadStr(a,b,c)+" = 0",
    ans:W(ansTxt),
    /* לשאלה "כמה פתרונות" יש בדיוק שלוש תשובות בעולם, ולכן הרשימה
       הישנה — שלושה ביטויים מותנים — הכילה תמיד כפילות, היא נבלעה
       בסינון, והתלמיד ראה שלוש אפשרויות במקום ארבע. כאן נלקחות שתי
       התשובות האחרות בדיוק, ונוסף מסיח רביעי אמיתי: ריבועית עם
       a ≠ 0 מתאפסת לכל היותר בשתי נקודות, ולכן "אינסוף" תמיד שגוי. */
    wrong:["שני פתרונות","פתרון אחד","אין פתרון"].filter(function(t){return t!==ansTxt})
      .map(function(t){return W(t,"הדיסקרימיננטה יצאה "+num(D)+", ולכן "+(D>0?"יש שני פתרונות שונים":D===0?"יש פתרון כפול אחד":"אין פתרון ממשי")+".")})
      .concat([W("אינסוף פתרונות","משוואה ריבועית שבה a אינו אפס מתאפסת לכל היותר בשתי נקודות. אינסוף פתרונות מתקבל רק כששני האגפים זהים, וכאן הם אינם.")]),
    steps:steps,rule:"disc",
    hint:"מחשבים Δ = b² − 4ac ומסתכלים רק על הסימן שלה."};
}
/* ---------- ציורים ---------- */
/* ציור קטן שווה יותר ממאה מילים, במיוחד למי שמתקשה לתרגם טקסט לתמונה. */
function figWrap(inner,w,h){
  return '<div style="display:flex;justify-content:center;margin-top:14px"><svg viewBox="0 0 '+w+' '+h+'" style="width:100%;max-width:'+w+'px;height:auto;color:var(--muted)" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true">'+inner+'</svg></div>';
}
function txt(x,y,s,anchor){
  return '<text x="'+x+'" y="'+y+'" fill="currentColor" stroke="none" font-size="15" font-weight="700" text-anchor="'+(anchor||"middle")+'" style="direction:ltr">'+s+'</text>';
}
function svgRightTri(la,lb,lc,ang){
  var g='<path d="M40 150 L240 150 L240 40 Z" stroke="var(--accent)" stroke-width="2.5"/>'+
        '<path d="M240 132 L222 132 L222 150" stroke="var(--muted)" stroke-width="2"/>';
  if(la)g+=txt(140,172,la);
  if(lb)g+=txt(262,100,lb,"start");
  if(lc)g+=txt(128,86,lc,"middle");
  if(ang)g+='<path d="M70 150 A30 30 0 0 0 62 132" stroke="var(--cyan)" stroke-width="2.5"/>'+txt(84,140,ang,"start");
  return figWrap(g,300,190);
}
function svgRect(lw,lh){
  return figWrap('<rect x="45" y="35" width="200" height="115" rx="4" stroke="var(--accent)" stroke-width="2.5"/>'+
    txt(145,172,lw)+txt(266,98,lh,"start"),300,190);
}
function svgCircle(lr){
  return figWrap('<circle cx="145" cy="95" r="70" stroke="var(--accent)" stroke-width="2.5"/>'+
    '<path d="M145 95 L215 95" stroke="var(--cyan)" stroke-width="2.5"/>'+
    '<circle cx="145" cy="95" r="3" fill="currentColor" stroke="none"/>'+txt(180,86,lr),300,190);
}
function svgTrap(la,lb,lh){
  return figWrap('<path d="M70 150 L250 150 L215 45 L110 45 Z" stroke="var(--accent)" stroke-width="2.5"/>'+
    '<path d="M110 150 L110 45" stroke="var(--cyan)" stroke-width="2" stroke-dasharray="5 4"/>'+
    txt(160,172,la)+txt(163,37,lb)+txt(100,100,lh,"end"),300,190);
}

/* ---------- 12. משפט פיתגורס ---------- */
var TRIPLES=[[3,4,5],[6,8,10],[5,12,13],[9,12,15],[8,15,17],[7,24,25],[20,21,29],[12,16,20],[10,24,26],[15,20,25]];
function genPyth(L){
  var t=pick(TRIPLES),a=t[0],b=t[1],c=t[2],steps;
  if(L===1){
    steps=[
      S("מזהים את היתר","היתר הוא הצלע שמול הזווית הישרה — תמיד הארוכה ביותר. כאן היא הנעלם.",
        "a² + b² = c²"),
      S("מציבים","",a+"² + "+b+"² = c²"),
      S("מחשבים","",(a*a)+" + "+(b*b)+" = "+(c*c)),
      S("מוציאים שורש","","c = √"+(c*c)+" = "+c)
    ];
    return {ask:"במשולש ישר זווית הניצבים הם "+a+" ו-"+b+". מהו אורך היתר?",expr:"",
      fig:svgRightTri(a,b,"?"),ans:W(String(c)),
      wrong:[
        W(String(a+b),"חיברתם את הניצבים. פיתגורס עובד על הריבועים, לא על הצלעות עצמן."),

        W(String(Math.round(Math.sqrt(Math.abs(b*b-a*a))*100)/100),"חיסרתם במקום לחבר. מחסרים רק כשמחפשים ניצב, לא יתר.")

      S("מציבים","","a² = "+c+"² − "+b+"² = "+(c*c)+" − "+(b*b)),

      wrong:[

        W(String(c-b),"חיסרתם את הצלעות עצמן במקום את הריבועים שלהן."),
        W(String(a*a),"זה a², צריך להוציא שורש.")

          "S = (a · b) ÷ 2"),
        S("מוצאים את הניצב החסר","היתר ידוע, ולכן מחסרים ריבועים.","a² = "+c+"² − "+b+"² = "+(c*c-b*b)),
        S("מוציאים שורש","","a = √"+(a*a)+" = "+a),
        S("ורק עכשיו מחשבים שטח","",	"S = ("+a+" · "+b+") ÷ 2 = "+num(a*b/2)+' סמ"ר')
      ];

      S("מה חסר כדי לחשב היקף","היקף הוא סכום שלוש הצלעות, והצלע השלישית אינה נתונה.","P = a + b + c"),
      S("מוצאים את היתר","שני הניצבים ידועים, ולכן מחברים ריבועים.","c² = "+a+"² + "+b+"² = "+(c*c)),
      S("מוציאים שורש","","c = √"+(c*c)+" = "+c),

/* ---------- 13. שטחים והיקפים ---------- */

        '<path d="M165 136 L151 136 L151 150" stroke="var(--muted)" stroke-width="1.6"/>'+

      wrong:wSel(num(b*h/2)+' סמ"ר',[

        [num(b+h)+' סמ"ר',"חיברתם במקום להכפיל."],
        [num((b+h)/2)+' סמ"ר',"חישבתם ממוצע של הבסיס והגובה."],
        [(2*b*h)+' סמ"ר',"הכפלתם בשתיים במקום לחלק בשתיים. משולש הוא חצי מהמלבן, לא כפול ממנו."]

      steps:[S("נוסחת שטח משולש","שטח = בסיס · גובה חלקי 2. החלוקה ב-2 היא כי משולש הוא חצי מלבן.","S = (b · h) ÷ 2"),
             S("מציבים","","S = ("+b+" · "+h+") ÷ 2"),
             S("מחשבים","","S = "+(b*h)+" ÷ 2 = "+num(b*h/2)+' סמ"ר')],

           S("מחלקים","הפעולה ההפוכה לכפל היא חילוק.","b = "+area+" ÷ "+b),
           S("מחשבים","","b = "+h+' ס"מ')],
    rule:"rect",hint:"אם השטח והאורך ידועים — מחלקים את השטח באורך."};
}

/* ---------- 14. טריגונומטריה במשולש ישר זווית ---------- */
function genTrig(L){
  var t,a,b,c,steps,f;
  if(L===1){
    t=pick(TRIPLES);a=t[0];b=t[1];c=t[2];
    f=pick(["sin","cos","tan"]);
    var val=f==="sin"?fr(a,c):f==="cos"?fr(b,c):fr(a,b);
    var top=f==="sin"?"הניצב שמול הזווית":f==="cos"?"הניצב שליד הזווית":"הניצב שמול הזווית";
    var bot=f==="tan"?"הניצב שליד הזווית":"היתר";
    steps=[
      S("נזכרים בהגדרות","״מול״ היא הצלע שמעבר לזווית, ״ליד״ היא הצלע שנוגעת בה, והיתר הוא מול הזווית הישרה.",
        "sin = מול ÷ יתר   ·   cos = ליד ÷ יתר   ·   tan = מול ÷ ליד"),
      S("מזהים את הצלעות ביחס לזווית α","מול α נמצא הניצב "+a+", לידה הניצב "+b+", והיתר הוא "+c+".",
        "מול = "+a+"  ,  ליד = "+b+"  ,  יתר = "+c),
      S("מציבים בהגדרה","המונה הוא "+top+", המכנה הוא "+bot+".",
        f+" α = "+(f==="sin"?a+"/"+c:f==="cos"?b+"/"+c:a+"/"+b)),
      S("מצמצמים","",f+" α = "+val.html())
    ];
    return {ask:"במשולש שלפניכם, מהו "+f+" α?",expr:"",fig:svgRightTri(b,a,c,"α"),
      ans:W(val.html()),
      wrong:[
        W(fr(val.d,val.n).html(),"הפכתם את השבר. שימו לב מה במונה ומה במכנה בהגדרה."),
        /* ב-tan החלפת ״מול״ ו״ליד״ נותנת בדיוק את השבר ההפוך, כלומר
           את המסיח שמעל. לכן שם המסיח הזה הוא cos. */
        W(f==="tan"?fr(b,c).html():f==="sin"?fr(b,c).html():fr(a,c).html(),
          f==="tan"?"זו ההגדרה של cos. ב-tan אין יתר בכלל — מול חלקי ליד.":"התבלבלתם בין הניצב שמול הזווית לניצב שלידה."),
        W(f==="tan"?fr(a,c).html():fr(a,b).html(),"השתמשתם בהגדרה של פונקציה טריגונומטרית אחרת.")
      ],steps:steps,rule:"trigdef",
      hint:"sin = מול/יתר, cos = ליד/יתר, tan = מול/ליד. תמיד ביחס לזווית שנשאלתם עליה."};
  }
  if(L===2){
    var ang=pick([30,60]);
    c=pick([4,6,8,10,12,14,16,20]);
    var want=ang===30?"הניצב שמול הזווית":"הניצב שליד הזווית";
    var res=c/2;
    steps=[
      S("בוחרים את הפונקציה המתאימה",
        ang===30?"מחפשים את הניצב שמול הזווית, והיתר ידוע — לכן sin.":"מחפשים את הניצב שליד הזווית, והיתר ידוע — לכן cos.",
        ang===30?"sin 30° = מול ÷ יתר":"cos 60° = ליד ÷ יתר"),
      S("מציבים את הערך המדויק","גם sin 30° וגם cos 60° שווים בדיוק לחצי.",
        (ang===30?"sin 30°":"cos 60°")+" = 1/2"),
      S("מבודדים את הצלע","","הצלע = "+c+" · 1/2"),
      S("מחשבים","","הצלע = "+num(res)+' ס"מ')
    ];
    return {ask:"במשולש ישר זווית היתר הוא "+c+' ס"מ ואחת הזוויות היא '+ang+"°. מהו אורך "+want+"?",
      expr:"",fig:ang===30?svgRightTri(null,"?",c+' ס"מ',ang+"°"):svgRightTri("?",null,c+' ס"מ',ang+"°"),
      ans:W(num(res)+' ס"מ'),
      wrong:[
        W(num(r2(c*Math.sqrt(3)/2))+' ס"מ',"השתמשתם ב-√3/2, שזה הערך של הפונקציה השנייה בזווית הזו."),
        W(num(c*2)+' ס"מ',"הכפלתם ביתר במקום לקחת ממנו חלק. ניצב תמיד קצר מהיתר."),
        W(num(ang)+' ס"מ',"זו מידת הזווית במעלות, לא אורך צלע.")
      ],steps:steps,rule:"trigval",
      hint:"sin 30° = cos 60° = 1/2. הצלע המבוקשת היא בדיוק חצי מהיתר."};
  }
  /* רמה 4 — הצלע שההגדרה זקוקה לה אינה נתונה. פיתגורס קודם,
     ההגדרה הטריגונומטרית אחריו, ואיש לא אומר את הסדר. */
  if(L===4){
    t=pick(TRIPLES);a=t[0];b=t[1];c=t[2];
    f=pick(["sin","tan"]);
    var den=f==="sin"?c:b;
    var v4=fr(a,den);
    steps=[
      S("בודקים מה ההגדרה דורשת",
        f==="sin"?"sin הוא הניצב שמול הזווית חלקי היתר. היתר נתון, הניצב שמול — לא.":
                  "tan הוא הניצב שמול הזווית חלקי הניצב שלידה. הניצב שליד נתון, זה שמול — לא.",
        f+" α = "+(f==="sin"?"מול ÷ יתר":"מול ÷ ליד")),
      S("קודם מוצאים את הצלע החסרה","במשולש ישר זווית שתי צלעות קובעות את השלישית.",
        "a² = "+c+"² − "+b+"² = "+(c*c)+" − "+(b*b)+" = "+(a*a)),
      S("מוציאים שורש","","a = √"+(a*a)+" = "+a),
      S("ורק עכשיו מציבים בהגדרה","",f+" α = "+a+" / "+den+" = "+v4.html())
    ];
    return {ask:"במשולש ישר זווית היתר הוא "+c+' ס"מ והניצב שליד הזווית α הוא '+b+' ס"מ. מהו '+f+" α?",
      expr:"",fig:svgRightTri(b,"?",c,"α"),
      ans:W(v4.html()),
      wrong:[
        W(fr(b,c).html(),"זה cos α — הניצב שליד חלקי היתר. השאלה מבקשת "+f+", וההגדרה שלו דורשת את הניצב שמול הזווית."),
        W(fr(den,a).html(),"הפכתם את השבר. הניצב שמול הזווית הוא המונה."),
        W(fr(c-b,den).html(),"חיסרתם את הצלעות עצמן. בפיתגורס מחסרים את הריבועים שלהן, ורק אז מוציאים שורש."),
        W(f==="sin"?fr(a,b).html():fr(a,c).html(),"מצאתם את הצלע החסרה נכון, אבל הצבתם אותה בהגדרה של פונקציה אחרת.")
      ],steps:steps,rule:"trigdef",
      hint:"ההגדרה זקוקה לצלע שאינה נתונה. במשולש ישר זווית תמיד אפשר להשלים צלע שלישית משתי האחרות."};
  }
  var ang3=pick([30,45,60]);
  var fn=pick(["sin","cos","tan"]);
  var TBL={ "sin30":"1/2","cos30":"√3/2","tan30":"1/√3","sin45":"√2/2","cos45":"√2/2","tan45":"1","sin60":"√3/2","cos60":"1/2","tan60":"√3" };
  var key=fn+ang3,val3=TBL[key];
  var others=[];
  for(var kk in TBL)if(TBL[kk]!==val3&&others.indexOf(TBL[kk])<0)others.push(TBL[kk]);
  shuffle(others);
  return {ask:"מהו הערך המדויק?",expr:fn+" "+ang3+"°",
    ans:W(val3),
    wrong:others.slice(0,3).map(function(v){return W(v,"זה הערך של פונקציה אחרת או של זווית אחרת בטבלת הזוויות המיוחדות.")}),
    steps:[
      S("משולש הזוויות המיוחדות","30°, 45° ו-60° הן זוויות שהערכים שלהן ידועים במדויק, בלי מחשבון.",
        "sin30 = 1/2 , cos30 = √3/2 , tan30 = 1/√3"),
      S("ממשיכים בטבלה","","sin45 = cos45 = √2/2 , tan45 = 1"),
      S("ולסיום","","sin60 = √3/2 , cos60 = 1/2 , tan60 = √3"),
      S("התשובה","",fn+" "+ang3+"° = "+val3)
    ],rule:"trigval",
    hint:"שווה לשנן טבלה קטנה: הזוויות 30, 45 ו-60 חוזרות כמעט בכל שאלה."};
}
/* ---------- 15. סטטיסטיקה ---------- */
function genStat(L){
  var arr=[],i,n,steps,sorted,wrong;
  if(L===1){
    n=pick([5,5,6,7]);
    for(i=0;i<n;i++)arr.push(ri(2,20));
    var sum=arr.reduce(function(a,b){return a+b},0);
    while(sum%n!==0){arr[0]=arr[0]+1;sum=arr.reduce(function(a,b){return a+b},0)}
    var avg=sum/n;
    steps=[
      S("ממוצע = סכום חלקי כמות","זו ההגדרה: מחלקים את הכול שווה בשווה בין כל האיברים.","ממוצע = סכום ÷ מספר האיברים"),
      S("מחברים את כל המספרים","",arr.join(" + ")+" = "+sum),
      S("מחלקים בכמות","",sum+" ÷ "+n+" = "+avg)
    ];
    return {ask:"מהו הממוצע של המספרים?",expr:arr.join(" , "),ans:W(String(avg)),
      wrong:wSel(String(avg),[
        [String(sum),"זה הסכום. נשאר לחלק במספר האיברים."],
        [String(Math.round(sum/(n-1)*100)/100),"חילקתם במספר איברים שגוי — יש כאן "+n+" מספרים."],
        [String(Math.max.apply(null,arr)),"זה המספר הגדול ביותר, לא הממוצע."],
        [String(Math.round(sum/(n+1)*100)/100),"ספרתם איבר אחד יותר מדי — יש כאן "+n+" מספרים."],
        [String(Math.min.apply(null,arr)),"זה המספר הקטן ביותר, לא הממוצע."]
      ]),steps:steps,rule:"mean",hint:"ממוצע = סכום כל המספרים חלקי כמה מספרים יש."};
  }
  if(L===2){
    /* רשימה שכמעט כל איבריה שווים — 3 , 3 , 4 , 2 , 3 — מפילה את כל
       המסיחים בבת אחת: הממוצע, שני השכנים אחרי הסידור והקצוות כולם
       יוצאים בדיוק החציון. במקרה כזה מגרילים רשימה חדשה. */
    var med,tries2=0;
    do{
      arr=[];n=pick([5,7,6,8]);
      for(i=0;i<n;i++)arr.push(ri(1,30));
      sorted=arr.slice().sort(function(a,b){return a-b});
      med=n%2?sorted[(n-1)/2]:(sorted[n/2-1]+sorted[n/2])/2;
      wrong=wSel(String(med),candMed(arr,sorted,n,med));
      tries2++;
    }while(wrong.length<3&&tries2<40);
    steps=[
      S("קודם כול — מסדרים","חציון בלי סידור הוא טעות כמעט ודאית. מסדרים מהקטן לגדול.",sorted.join(" , ")),
      S(n%2?"סופרים לאמצע":"יש מספר זוגי של איברים",
        n%2?"יש "+n+" מספרים, אז החציון הוא זה שבמקום ה-"+((n+1)/2)+".":"אין איבר יחיד באמצע, אז לוקחים ממוצע של שני האמצעיים.",
        n%2?"החציון: "+med:"("+sorted[n/2-1]+" + "+sorted[n/2]+") ÷ 2 = "+med),
      S("התשובה","","חציון = "+med)
    ];
    return {ask:"מהו החציון?",expr:arr.join(" , "),ans:W(String(med)),
      wrong:wrong,steps:steps,rule:"median",hint:"חציון = האיבר האמצעי אחרי סידור. במספר זוגי של איברים — ממוצע שני האמצעיים."};
  }
  /* רמה 4 — הממוצע הוא הדרך פנימה, לא התשובה. פעם אחת הוא משמש
     כדי להשלים מספר חסר ואז נשאלים על החציון, ופעם אחת נשאלים על
     מספר שהוסף וששינה את הממוצע. */
  if(L===4){
    if(Math.random()<0.5){
      /* חמישה מספרים שונים זה מזה. ברשימה עם חזרות שני איברים
         סמוכים אחרי הסידור יוצאים שווים, וכל המסיחים שנשענים על
         המיקום אחרי הסידור מתלכדים עם החציון — שלוש אפשרויות. */
      var kn=[],mi,vv,pool4=[];
      while(kn.length<4){vv=ri(2,24);if(kn.indexOf(vv)<0)kn.push(vv)}
      var knSum=kn.reduce(function(u,v){return u+v},0);
      for(vv=2;vv<=26;vv++)if((knSum+vv)%5===0&&kn.indexOf(vv)<0)pool4.push(vv);
      mi=pool4.length?pick(pool4):27-((knSum+27)%5);
      var all=kn.concat([mi]),avg4=(knSum+mi)/5;
      var so=all.slice().sort(function(u,v){return u-v}),med4=so[2];
      var knSorted=kn.slice().sort(function(u,v){return u-v});
      steps=[
        S("ממוצע הוא משוואה","אם הממוצע "+avg4+" ויש 5 מספרים, הסכום חייב להיות "+avg4+" · 5.",
          "סכום = "+avg4+" · 5 = "+(avg4*5)),
        S("משלימים את המספר החסר","",(avg4*5)+" − "+knSum+" = "+mi),
        S("עכשיו יש חמישה מספרים — מסדרים","חציון בלי סידור הוא טעות כמעט ודאית.",so.join(" , ")),
        S("לוקחים את האמצעי","יש כאן חמישה מספרים, ולכן החציון הוא זה שבמקום השלישי.","חציון = "+med4)
      ];
      return {ask:"לחמישה מספרים יש ממוצע "+avg4+". ארבעה מהם הם "+kn.join(", ")+". מהו החציון של כל חמשת המספרים?",
        expr:"",ans:W(String(med4)),
        wrong:[
          W(String(mi),"זה המספר החסר שמצאתם. הוא צעד בדרך, לא התשובה."),
          W(String(avg4),"זה הממוצע שנתון בשאלה. ממוצע וחציון אינם אותו דבר."),
          W(String((knSorted[1]+knSorted[2])/2),"חישבתם חציון של ארבעת המספרים הידועים בלבד, בלי המספר החסר."),
          W(String(all[2]),"לקחתם את האיבר האמצעי לפי הסדר שבו הם כתובים. חייבים לסדר קודם."),
          W(String(so[4]-so[0]),"זה הטווח — ההפרש בין הגדול לקטן."),
          /* שני האחרונים הם רשת ביטחון: כשהמספרים שונים זה מזה,
             so[1] ו-so[3] לעולם אינם שווים ל-so[2], ולכן תמיד
             נשארות ארבע אפשרויות גם אם כל האחרים מתלכדים. */
          W(String(so[1]),"ספרתם מקום אחד מוקדם מדי. מבין חמישה מספרים האמצעי הוא השלישי."),
          W(String(so[3]),"ספרתם מקום אחד מאוחר מדי. מבין חמישה מספרים האמצעי הוא השלישי."),
          W(String(so[0]),"זה המספר הקטן ביותר, לא האמצעי."),
          W(String(so[4]),"זה המספר הגדול ביותר, לא האמצעי.")
        ],steps:steps,rule:"median",
        hint:"החציון נמדד על כל חמשת המספרים, ואחד מהם עדיין לא ידוע. אז יש כאן שני שלבים."};
    }
    n=pick([4,5,6,7]);
    var m1=ri(4,20),m2=m1+pick([1,2,3]),added=(n+1)*m2-n*m1;
    steps=[
      S("הסכום לפני התוספת","ממוצע כפול כמות נותן את הסכום.",n+" · "+m1+" = "+(n*m1)),
      S("הסכום אחרי התוספת","עכשיו יש "+(n+1)+" מספרים, והממוצע שלהם "+m2+".",(n+1)+" · "+m2+" = "+((n+1)*m2)),
      S("ההפרש הוא המספר שהוסף","",((n+1)*m2)+" − "+(n*m1)+" = "+added)
    ];
    return {ask:"ל-"+n+" מספרים יש ממוצע "+m1+". הוסיפו מספר אחד נוסף, והממוצע החדש הוא "+m2+". מהו המספר שהוסף?",
      expr:"",ans:W(String(added)),
      wrong:[
        W(String(m2),"זה הממוצע החדש. מספר שמוסיפים כדי להעלות ממוצע חייב להיות גדול ממנו."),
        W(String(m2-m1),"זה גודל השינוי בממוצע, לא המספר שהוסף."),
        W(String((n+1)*(m2-m1)),"הכפלתם את שינוי הממוצע בכמות. חסר כאן הערך של הממוצע עצמו."),
        W(String(m1+m2),"חיברתם את שני הממוצעים. ממוצעים לא מתחברים כך."),
        W(String(m1),"זה הממוצע הקודם, לפני שהוסף המספר.")
      ],steps:steps,rule:"mean",
      hint:"ממוצע כפול כמות = סכום. חשבו את הסכום לפני ואת הסכום אחרי, וההפרש הוא התשובה."};
  }
  n=pick([4,5,6]);
  var known=[],missing=ri(3,20);
  for(i=0;i<n-1;i++)known.push(ri(2,20));
  /* מזיזים איבר אחד עד שהממוצע יוצא שלם — כך המספר החסר נשאר בטווח סביר */
  var tot=known.reduce(function(a,b){return a+b},0)+missing;
  known[0]+=(n-tot%n)%n;
  tot=known.reduce(function(a,b){return a+b},0)+missing;
  var target=tot/n;
  steps=[
    S("מתרגמים ממוצע למשוואה","אם הממוצע הוא "+target+" ויש "+n+" מספרים, הסכום חייב להיות "+target+" · "+n+".",
      "סכום = "+target+" · "+n+" = "+(target*n)),
    S("מחשבים את הסכום הידוע","",known.map(num).join(" + ")+" = "+known.reduce(function(a,b){return a+b},0)),
    S("מחסרים","",(target*n)+" − "+known.reduce(function(a,b){return a+b},0)+" = "+missing)
  ];
  return {ask:"ל-"+n+" מספרים יש ממוצע "+num(target)+". "+(n-1)+" מהם הם "+known.map(num).join(", ")+". מהו המספר החסר?",
    expr:"",ans:W(String(missing)),
    wrong:wSel(String(missing),[
      [String(target),"הנחתם שהמספר החסר שווה לממוצע. זה נכון רק אם כל המספרים שווים."],
      [String(target*n),"זה הסכום של כל המספרים, לא המספר החסר."],
      [String(Math.abs(known.reduce(function(a,b){return a+b},0)-target)),"חיסרתם את הממוצע מהסכום הידוע במקום להשתמש בסכום הכולל."],
      [String(known.reduce(function(a,b){return a+b},0)),"זה סכום המספרים הידועים. ממנו עוד צריך להגיע למספר החסר."],
      [String(target*(n-1)-known.reduce(function(a,b){return a+b},0)),"הכפלתם את הממוצע במספר המספרים הידועים. הממוצע מוכפל בכל "+n+" המספרים."],
      [String(target*n-target),"חיסרתם מהסכום הכולל את הממוצע. צריך לחסר ממנו את סכום המספרים הידועים."],
      [String(Math.round(known.reduce(function(a,b){return a+b},0)/(n-1)*100)/100),"זה הממוצע של המספרים הידועים בלבד, לא המספר החסר."]
    ]),steps:steps,rule:"mean",
    hint:"ממוצע כפול כמות = הסכום הכולל. משם מחסרים את מה שכבר ידוע."};
}

/* מועמדי המסיחים של החציון. */
function candMed(arr,sorted,n,med){
  return [
    [String(arr[Math.floor(n/2)]),"לקחתם את האיבר האמצעי לפי הסדר שבו הם נכתבו. חייבים קודם לסדר."],
    [String(Math.round(arr.reduce(function(a,b){return a+b},0)/n*100)/100),"זה הממוצע, לא החציון."],
    [String(sorted[n-1]-sorted[0]),"זה הטווח — ההפרש בין הגדול לקטן."],
    [String(n%2?sorted[(n+1)/2]:sorted[n/2]),
      n%2?"ספרתם מקום אחד יותר מדי אחרי הסידור.":"לקחתם רק אחד משני האיברים האמצעיים. במספר זוגי לוקחים את הממוצע שלהם."],
    [String(n%2?sorted[(n-3)/2]:sorted[n/2-1]),
      n%2?"ספרתם מקום אחד מוקדם מדי אחרי הסידור.":"לקחתם רק אחד משני האיברים האמצעיים. במספר זוגי לוקחים את הממוצע שלהם."],
    [String(sorted[0]),"זה המספר הקטן ביותר, לא האמצעי."],
    [String(sorted[n-1]),"זה המספר הגדול ביותר, לא האמצעי."],
    [String(Math.round((sorted[0]+sorted[n-1])/2*100)/100),"חישבתם ממוצע של הגדול והקטן ביותר. החציון הוא האיבר האמצעי אחרי סידור."]
  ];
}
/* ---------- 16. הסתברות ---------- */
function genProb(L){
  var r,g,b2,tot,steps,p;
  if(L===1){
    r=ri(2,9);g=ri(2,9);b2=ri(2,9);tot=r+g+b2;
    p=fr(r,tot);
    steps=[
      S("סופרים את כל האפשרויות","","סה\"כ כדורים: "+r+" + "+g+" + "+b2+" = "+tot),
      S("סופרים את המקרים המבוקשים","",	"כדורים אדומים: "+r),
      S("הסתברות = מבוקש חלקי הכול","",p.html())
    ];
    return {ask:"בשקית "+r+" כדורים אדומים, "+g+" ירוקים ו-"+b2+" כחולים. מוציאים כדור אחד באקראי. מה ההסתברות שהוא אדום?",
      expr:"",ans:W(p.html()),
      wrong:wSel(p.html(),[
        [fr(r,g+b2).html(),"חילקתם במספר הכדורים שאינם אדומים. המכנה הוא תמיד סך כל האפשרויות."],
        [fr(tot,r).html(),"הפכתם את השבר. המבוקש נמצא במונה."],
        [fr(r,3).html(),"חילקתם במספר הצבעים ולא במספר הכדורים."],
        [fr(r,r+g).html(),"שכחתם לספור את הכדורים הכחולים. המכנה הוא סך כל הכדורים בשקית."],
        [fr(g+b2,tot).html(),"זו ההסתברות שהכדור אינו אדום. השאלה מבקשת דווקא אדום."]
      ]),steps:steps,rule:"prob",hint:"הסתברות = כמה מקרים מתאימים, חלקי כמה מקרים אפשריים בסך הכול."};
  }
  if(L===2){
    r=ri(2,8);tot=r+ri(3,10);
    while(tot-r===r)tot++;                   /* בדיוק חצי הופך את המשלים לזהה למקור */
    p=fr(tot-r,tot);
    steps=[
      S("ההסתברות למאורע המקורי","",fr(r,tot).html()),
      S("משלים ל-1","סכום ההסתברויות של מאורע ושל ההפך שלו הוא תמיד 1.","P(לא) = 1 − P(כן)"),
      S("מחשבים","","1 − "+fr(r,tot).html()+" = "+p.html())
    ];
    return {ask:"בקופסה "+tot+" גרביים, מתוכם "+r+" שחורים. מה ההסתברות להוציא גרב שאינו שחור?",
      expr:"",ans:W(p.html()),
      wrong:[
        W(fr(r,tot).html(),"זו ההסתברות דווקא כן להוציא שחור. השאלה מבקשת את המשלים."),
        W(fr(tot,tot-r).html(),"הפכתם את השבר."),
        W(fr(tot-r,r).html(),"חילקתם במספר השחורים במקום בסך הכול.")
      ],steps:steps,rule:"probc",hint:"הסתברות למאורע משלים = 1 פחות ההסתברות למאורע עצמו."};
  }
  /* רמה 4 — ״לפחות אחת״ ו״בדיוק אחת״. שני המאורעות דורשים גם את
     כלל המכפלה וגם את המשלים, ואף אחד מהם אינו נזכר בשאלה. */
  if(L===4){
    var nf=pick([4,6,8,10,12]),fc=ri(1,3);
    if(Math.random()<0.5){
      p=fr(2*nf-1,nf*nf);
      steps=[
        S("סופרים מה קל יותר","״לפחות פעם אחת״ מכסה שלושה מקרים שונים. ההפך שלו — ״אף פעם לא״ — הוא מקרה אחד בלבד.",
          "P(לפחות אחת) = 1 − P(אף פעם)"),
        S("מחשבים את ההסתברות לא לקבל בהטלה אחת","",fr(nf-1,nf).html()),
        S("שתי הטלות בלתי תלויות — מכפילים","",fr(nf-1,nf).html()+" · "+fr(nf-1,nf).html()+" = "+fr((nf-1)*(nf-1),nf*nf).html()),
        S("משלימים ל-1","",	"1 − "+fr((nf-1)*(nf-1),nf*nf).html()+" = "+p.html())
      ];
      return {ask:"מטילים קובייה בעלת "+nf+" פאות פעמיים. מה ההסתברות לקבל את המספר "+fc+" לפחות פעם אחת?",
        expr:"",ans:W(p.html()),
        wrong:[
          W(fr((nf-1)*(nf-1),nf*nf).html(),"זו ההסתברות שהמספר לא הופיע אף פעם. זה בדיוק המאורע ההפוך — נשאר להשלים ל-1."),
          W(fr(2,nf).html(),"חיברתם את שתי ההטלות. החיבור סופר פעמיים את המקרה שבו שתיהן הצליחו."),
          W(fr(1,nf*nf).html(),"זו ההסתברות ששתי ההטלות נתנו את המספר. ״לפחות אחת״ כולל גם מקרה אחד בלבד."),
          W(fr(1,nf).html(),"התייחסתם להטלה אחת בלבד.")
        ],steps:steps,rule:"probc",
        hint:"״לפחות אחת״ מכסה כמה מקרים. שווה לשאול מה ההפך שלו — כי ההפך הוא מקרה יחיד."};
    }
    p=fr(2*(nf-1),nf*nf);
    steps=[
      S("מפרקים את המאורע","״בדיוק פעם אחת״ קורה בשתי דרכים: הצלחה ואז כישלון, או כישלון ואז הצלחה.",
        "P = P(כן, לא) + P(לא, כן)"),
      S("כל דרך היא מכפלה","ההטלות בלתי תלויות, ולכן מכפילים.",
        fr(1,nf).html()+" · "+fr(nf-1,nf).html()+" = "+fr(nf-1,nf*nf).html()),
      S("שתי דרכים — מחברים אותן","",	fr(nf-1,nf*nf).html()+" + "+fr(nf-1,nf*nf).html()+" = "+p.html())
    ];
    return {ask:"מטילים קובייה בעלת "+nf+" פאות פעמיים. מה ההסתברות לקבל את המספר "+fc+" בדיוק פעם אחת?",
      expr:"",ans:W(p.html()),
      wrong:[
        W(fr(nf-1,nf*nf).html(),"חישבתם רק סדר אחד. ״בדיוק פעם אחת״ מתקיים בשתי דרכים — וצריך לחבר אותן."),
        W(fr(2*nf-1,nf*nf).html(),"זו ההסתברות ל״לפחות פעם אחת״, והיא כוללת גם את המקרה שבו המספר הופיע פעמיים."),
        W(fr(1,nf*nf).html(),"זו ההסתברות ששתי ההטלות נתנו את המספר."),
        W(fr(2,nf).html(),"חיברתם את ההסתברויות בלי להתחשב בכך שההטלה השנייה חייבת להיכשל.")
      ],steps:steps,rule:"probm",
      hint:"״בדיוק פעם אחת״ אינו מקרה יחיד — יש שני סדרים אפשריים, וכל אחד מהם מכפלה."};
  }
  /* קובייה בעלת 3 או 5 פאות אינה קיימת. 4, 6, 8, 10 ו-12 הן קוביות אמיתיות. */
  var n1=pick([4,6,8,10,12]),n2=pick([4,6,8,10,12]);
  p=fr(1,n1*n2);
  steps=[
    S("שני ניסויים בלתי תלויים","התוצאה של הראשון לא משפיעה על השני, ולכן מכפילים הסתברויות.","P(שניהם) = P₁ · P₂"),
    S("מציבים","",fr(1,n1).html()+" · "+fr(1,n2).html()),
    S("מכפילים","",p.html())
  ];
  return {ask:"מטילים קובייה בעלת "+n1+" פאות ואחריה קובייה בעלת "+n2+" פאות. מה ההסתברות לקבל 1 בשתיהן?",
    expr:"",ans:W(p.html()),
    wrong:[
      /* חיבור ההסתברויות הוא 1/n₁ + 1/n₂, כלומר (n₁+n₂)/(n₁·n₂).
         המסיח הקודם הראה 2/(n₁+n₂), מספר שאינו נובע מההסבר שלידו. */
      W(fr(n1+n2,n1*n2).html(),"חיברתם הסתברויות. חיבור מתאים ל״או״, כפל מתאים ל״וגם״."),
      W(fr(1,n1+n2).html(),"חיברתם את מספרי הפאות במקום להכפיל אותם."),
      W(fr(1,Math.max(n1,n2)).html(),"התייחסתם רק לקובייה אחת.")
    ],steps:steps,rule:"probm",hint:"״וגם״ בשני ניסויים בלתי תלויים — מכפילים את ההסתברויות."};
}

/* ---------- 17. סדרה חשבונית ---------- */
function genSeq(L){
  var a1,d,n,steps,an;
  a1=rnz(-12,15);d=rnz(-7,8);
  if(L===1){
    n=ri(5,20);an=a1+(n-1)*d;
    steps=[
      S("נוסחת האיבר הכללי","aₙ = a₁ + (n − 1)·d. שימו לב ל-n מינוס 1 — כי מהאיבר הראשון עושים n−1 צעדים.",
        "aₙ = a₁ + (n − 1)d"),
      S("מציבים","","a"+n+" = "+num(a1)+" + ("+n+" − 1)·"+pn(d)),
      S("מחשבים","","a"+n+" = "+num(a1)+" + "+(n-1)+"·"+pn(d)+" = "+num(an))
    ];
    return {ask:"בסדרה חשבונית האיבר הראשון הוא "+num(a1)+" וההפרש הוא "+num(d)+". מהו האיבר ה-"+n+"?",
      expr:"",ans:W(num(an)),
      wrong:wSel(num(an),[
        [num(a1+n*d),"הכפלתם ב-n במקום ב-n מינוס 1. מהאיבר הראשון לאיבר ה-"+n+" יש "+(n-1)+" צעדים."],
        [num(a1+(n-1)*d*-1),"טעות סימן בהפרש."],
        [num(a1*n+d),"הכפלתם את האיבר הראשון ב-n."],
        [num(a1+(n-2)*d),"ספרתם צעד אחד פחות מדי. מהאיבר הראשון לאיבר ה-"+n+" יש "+(n-1)+" צעדים."],
        [num((n-1)*d),"שכחתם להוסיף את האיבר הראשון. הנוסחה מתחילה ב-a₁."]
      ]),steps:steps,rule:"seq",hint:"aₙ = a₁ + (n−1)·d. הכי חשוב: n מינוס אחד, לא n."};
  }
  if(L===2){
    n=ri(6,14);an=a1+(n-1)*d;
    steps=[
      S("שני איברים ידועים","","a₁ = "+num(a1)+"   ,   a"+n+" = "+num(an)),
      S("מציבים בנוסחה","","a"+n+" = a₁ + ("+n+" − 1)d"),
      S("מבודדים את d","",num(an)+" − "+pn(a1)+" = "+(n-1)+"d  →  "+num(an-a1)+" = "+(n-1)+"d"),
      S("מחלקים","","d = "+num(an-a1)+" ÷ "+(n-1)+" = "+num(d))
    ];
    return {ask:"בסדרה חשבונית a₁ = "+num(a1)+" והאיבר ה-"+n+" הוא "+num(an)+". מהו ההפרש d?",
      expr:"",ans:W("d = "+num(d)),
      wrong:[
        W("d = "+num(r2((an-a1)/n)),"חילקתם ב-n. מספר הצעדים בין האיבר הראשון לאיבר ה-"+n+" הוא "+(n-1)+"."),
        W("d = "+num(an-a1),"זה ההפרש הכולל לאורך כל הסדרה, לא ההפרש בין שני איברים עוקבים."),
        W("d = "+num(-d),"טעות סימן בחיסור. מחסרים את הראשון מהאחרון.")
      ],steps:steps,rule:"seq",hint:"מציבים את שני האיברים בנוסחה ומבודדים את d. שימו לב שמחלקים ב-n מינוס 1."};
  }
  /* רמה 4 — האיבר הראשון אינו נתון. כדי להגיע לסכום צריך קודם את
     ההפרש, ממנו לחזור אחורה אל a₁, ורק אז להיכנס לנוסחת הסכום. */
  if(L===4){
    n=pick([8,10,12,15,20]);
    an=a1+(n-1)*d;
    /* שתי הגרלות שמפרקות את השאלה: a₁ + aₙ = 0 מאפס את הסכום, ואם
       הסכום יוצא שווה לאיבר האחרון — המסיח ״זה האיבר עצמו״ הוא
       התשובה הנכונה, והשאלה יורדת לשלוש אפשרויות. */
    var g7=0,bad7=function(){return a1+an===0||n*(a1+an)/2===an};
    while(bad7()&&g7<40){d=rnz(-7,8);a1=rnz(-12,15);an=a1+(n-1)*d;g7++}
    if(bad7()){a1=5;d=2;an=a1+(n-1)*d}
    var ii=ri(2,5),jj=ii+ri(2,6),ai=a1+(ii-1)*d,aj=a1+(jj-1)*d;
    var sm=n*(a1+an)/2;
    steps=[
      S("מוצאים את ההפרש","בין האיבר ה-"+ii+" לאיבר ה-"+jj+" יש "+(jj-ii)+" צעדים, וכל צעד הוא d.",
        "d = ("+num(aj)+" − "+pn(ai)+") ÷ "+(jj-ii)+" = "+num(d)),
      S("חוזרים אחורה אל האיבר הראשון","מהאיבר ה-"+ii+" חוזרים אחורה אל הראשון, צעד אחרי צעד.",
        "a₁ = "+num(ai)+" − "+(ii-1)+"·"+pn(d)+" = "+num(a1)),
      S("מחשבים את האיבר האחרון","","a"+n+" = "+num(a1)+" + "+(n-1)+"·"+pn(d)+" = "+num(an)),
      S("מציבים בנוסחת הסכום","Sₙ = n(a₁ + aₙ) ÷ 2","S = "+n+"·("+num(a1)+" + "+pn(an)+") ÷ 2 = "+num(sm))
    ];
    return {ask:"בסדרה חשבונית האיבר ה-"+ii+" הוא "+num(ai)+" והאיבר ה-"+jj+" הוא "+num(aj)+". מהו סכום "+n+" האיברים הראשונים?",
      expr:"",ans:W(num(sm)),
      wrong:[
        W(num(n*(ai+an)/2),"התייחסתם לאיבר ה-"+ii+" כאילו הוא האיבר הראשון. צריך קודם לחזור אחורה אליו."),
        W(num(an),"זה האיבר ה-"+n+" עצמו, לא הסכום."),
        W(num(n*(a1+an)),"שכחתם לחלק ב-2."),
        W(num(n*a1),"הכפלתם את האיבר הראשון במספר האיברים, כאילו כל האיברים שווים."),
        W(num(n*(a1+a1+n*d)/2),"בחישוב האיבר האחרון הכפלתם ב-n במקום ב-n מינוס 1.")
      ],steps:steps,rule:"seqsum",
      hint:"נוסחת הסכום דורשת את a₁, והוא לא נתון. אז מתחילים מההפרש — הוא מה שמאפשר לחזור אחורה."};
  }
  n=ri(5,15);an=a1+(n-1)*d;
  var sum=n*(a1+an)/2;
  if(Math.round(sum)!==sum){d=2;an=a1+(n-1)*d;sum=n*(a1+an)/2}
  steps=[
    S("נוסחת הסכום","Sₙ = n · (a₁ + aₙ) ÷ 2 — כלומר מספר האיברים כפול ממוצע הראשון והאחרון.","Sₙ = n(a₁ + aₙ) ÷ 2"),
    S("מחשבים את האיבר האחרון","","a"+n+" = "+num(a1)+" + "+(n-1)+"·"+pn(d)+" = "+num(an)),
    S("מציבים בנוסחת הסכום","","S = "+n+"·("+num(a1)+" + "+pn(an)+") ÷ 2"),
    S("מחשבים","","S = "+n+"·"+pn(a1+an)+" ÷ 2 = "+num(sum))
  ];
  return {ask:"בסדרה חשבונית a₁ = "+num(a1)+" ו-d = "+num(d)+". מהו סכום "+n+" האיברים הראשונים?",
    expr:"",ans:W(num(sum)),
    wrong:wSel(num(sum),[
      [num(an),"זה האיבר ה-"+n+" עצמו, לא הסכום של כולם."],
      [num(n*(a1+an)),"שכחתם לחלק ב-2."],
      [num(n*a1),"הכפלתם את האיבר הראשון במספר האיברים, כאילו כל האיברים שווים."],
      [num(r2((a1+an)/2)),"זה הממוצע של הראשון והאחרון. נשאר להכפיל אותו במספר האיברים."],
      [num(n*an),"הכפלתם את האיבר האחרון במספר האיברים, כאילו כל האיברים שווים לו."]
    ]),steps:steps,rule:"seqsum",
    hint:"סכום סדרה חשבונית = מספר האיברים כפול הממוצע של הראשון והאחרון."};
}

/* ---------- 18. בעיות מילוליות ---------- */
function genWord(L){
  var v1,v2,t,d,steps,x;
  if(L===1){
    v1=pick([40,50,60,70,80,90,100]);t=pick([2,3,4,5]);d=v1*t;
    return {ask:"רכב נוסע במהירות קבועה של "+v1+' קמ"ש במשך '+t+" שעות. איזה מרחק הוא עבר?",
      expr:"",ans:W(d+' ק"מ'),
      wrong:[
        W(num(r2(v1/t))+' ק"מ',"חילקתם. מרחק = מהירות כפול זמן."),
        W(num(v1+t)+' ק"מ',"חיברתם מהירות עם זמן. אלה גדלים שונים — הם לא מתחברים."),
        W(num(r2(t/v1))+' ק"מ',"חילקתם בכיוון ההפוך.")
      ],
      steps:[S("הנוסחה המשולשת","מרחק = מהירות · זמן. מכאן גם: מהירות = מרחק ÷ זמן, וזמן = מרחק ÷ מהירות.","D = v · t"),
             S("מציבים","","D = "+v1+" · "+t),
             S("מחשבים","","D = "+d+' ק"מ')],
      rule:"motion",hint:"מרחק = מהירות כפול זמן. שווה לזכור את המשולש: D למעלה, v ו-t למטה."};
  }
  if(L===2){
    /* בעיית גיל — קלאסיקה של תרגום משפט למשוואה */
    var kid=ri(6,14),mult=pick([2,3,4]);
    var parent=kid*mult;
    steps=[
      S("מגדירים נעלם","מסמנים באות אחת בדיוק את מה שמחפשים.","x = גיל הילד היום"),
      S("כותבים את המשפט כביטוי","״מבוגר פי "+mult+"״ פירושו שגיל ההורה הוא "+mult+" כפול גיל הילד.",
        "גיל ההורה = "+mult+"x"),
      S("בונים משוואה","ידוע שגיל ההורה הוא "+parent+".",mult+"x = "+parent),
      S("מחלקים במקדם","","x = "+parent+" ÷ "+mult+" = "+kid)
    ];
    return {ask:"הורה מבוגר מילדו פי "+mult+". היום ההורה בן "+parent+". בן כמה הילד?",
      expr:"",ans:W(kid+" שנים"),
      wrong:[
        W((parent-mult)+" שנים","חיסרתם את המספר "+mult+" מגיל ההורה. ״פי "+mult+"״ פירושו חילוק, לא חיסור."),
        W((parent*mult)+" שנים","הכפלתם במקום לחלק. הילד צעיר יותר."),
        W((parent-kid)+" שנים","זה הפרש הגילים, לא גיל הילד."),
        W(parent+" שנים","זה גיל ההורה, שכבר נתון בשאלה. מבקשים את גיל הילד.")
      ],steps:steps,rule:"word",
      hint:"מסמנים באות אחת את מה שמחפשים, וכותבים כל משפט בשאלה כביטוי עם אותה אות."};
  }
  /* רמה 4 — מהירות ממוצעת. הנוסחה D = v·t משמשת כאן פעמיים בכיוון
     אחד ופעם אחת בכיוון ההפוך, והמלכודת היא לחשוב שממוצע של שתי
     מהירויות הוא הממוצע שלהן. */
  if(L===4){
    var t1=pick([1,2,3,4]),t2=pick([1,2,3,4]);
    v1=pick([40,50,60,80,90,100,120]);v2=pick([40,50,60,80,90,100,120]);
    var tw8=0,D8,T8,av8;
    D8=v1*t1+v2*t2;T8=t1+t2;av8=D8/T8;
    while((t1===t2||v1===v2||T8<3||Math.round(av8)!==av8)&&tw8<200){
      t1=pick([1,2,3,4]);t2=pick([1,2,3,4]);
      v1=pick([40,50,60,80,90,100,120]);v2=pick([40,50,60,80,90,100,120]);
      D8=v1*t1+v2*t2;T8=t1+t2;av8=D8/T8;tw8++;
    }
    if(t1===t2||v1===v2||Math.round(av8)!==av8){t1=1;t2=3;v1=100;v2=60;D8=280;T8=4;av8=70}
    steps=[
      S("מחשבים כמה נסע בכל קטע","מרחק = מהירות · זמן.",
        v1+" · "+t1+" = "+(v1*t1)+' ק"מ<br>'+v2+" · "+t2+" = "+(v2*t2)+' ק"מ'),
      S("מסכמים את כל הדרך ואת כל הזמן","",
        (v1*t1)+" + "+(v2*t2)+" = "+D8+' ק"מ<br>'+t1+" + "+t2+" = "+T8+" שעות"),
      S("מהירות ממוצעת = כל המרחק חלקי כל הזמן","זה לא הממוצע של שתי המהירויות — הן לא נמשכו אותו מספר שעות.",
        D8+" ÷ "+T8+" = "+num(av8)+' קמ"ש')
    ];
    return {ask:"רכב נסע "+t1+" שעות במהירות "+v1+' קמ"ש, ומיד אחר כך '+t2+" שעות במהירות "+v2+
        ' קמ"ש. מהי המהירות הממוצעת שלו לאורך כל הנסיעה?',
      expr:"",ans:W(num(av8)+' קמ"ש'),
      wrong:[
        W(num((v1+v2)/2)+' קמ"ש',"חישבתם ממוצע של שתי המהירויות. הן לא נמשכו אותו זמן, ולכן המשקל שלהן שונה."),
        W(num(D8)+' קמ"ש',"זה המרחק הכולל בקילומטרים, לא המהירות."),
        W(num(v1+v2)+' קמ"ש',"חיברתם את שתי המהירויות. מהירויות מתחברות רק כששני גופים נעים זה לקראת זה."),
        W(num(D8/2)+' קמ"ש',"חילקתם ב-2 במקום בזמן הכולל. מספר הקטעים אינו מספר השעות.")
      ],steps:steps,rule:"motion",
      hint:"מהירות ממוצעת אינה ממוצע של מהירויות. היא כל המרחק חלקי כל הזמן — אז קודם מחשבים את שניהם."};
  }
  /* רמה 3: שתי מהירויות — פגישה */
  v1=pick([40,50,60,70]);v2=pick([30,60,80,90]);
  if(v1===v2)v2=v1+20;
  t=pick([2,3,4]);
  d=(v1+v2)*t;
  steps=[
    S("מציירים את המצב","שני רכבים נוסעים זה לקראת זה. בכל שעה המרחק ביניהם מצטמצם בסכום המהירויות.",
      "מהירות התקרבות = "+v1+" + "+v2+" = "+(v1+v2)+' קמ"ש'),
    S("כותבים את המשוואה","","("+v1+" + "+v2+") · t = "+d),
    S("מחלקים","","t = "+d+" ÷ "+(v1+v2)+" = "+t+" שעות")
  ];
  return {ask:"שתי מכוניות יוצאות זו לקראת זו ממרחק "+d+' ק"מ, במהירויות '+v1+" ו-"+v2+' קמ"ש. אחרי כמה שעות ייפגשו?',
    expr:"",ans:W(t+" שעות"),
    wrong:wSel(t+" שעות",[
      [num(r2(d/v1))+" שעות","התייחסתם רק לרכב אחד. כששניהם נוסעים זה לקראת זה — המהירויות מתחברות."],
      [num(r2(d/Math.abs(v1-v2)))+" שעות","חיסרתם מהירויות. חיסור מתאים למרדף באותו כיוון, לא לנסיעה זה לקראת זה."],
      [num(r2(d/(v1+v2)/2))+" שעות","חילקתם ב-2 מיותר — לא צריך לחצות את המרחק."],
      [num(r2(d/v2))+" שעות","התייחסתם רק לרכב השני. כששניהם נוסעים זה לקראת זה — המהירויות מתחברות."],
      [num(r2(d/(v1+v2)*2))+" שעות","הכפלתם ב-2 מיותר. המרחק כבר נסגר על ידי שני הרכבים יחד."]
    ]),steps:steps,rule:"motion",
    hint:"כששניים נוסעים זה לקראת זה, המהירויות מתחברות ואז מחלקים את המרחק בסכום."};
}
