      wrong:wSel(num(b*h/2)+' סמ"ר',[
        [(b*h)+' סמ"ר',"שכחתם לחלק ב-2. משולש הוא בדיוק חצי מהמלבן שעוטף אותו."],
        [num(b+h)+' סמ"ר',"חיברתם במקום להכפיל."],
        [num((b+h)/2)+' סמ"ר',"חישבתם ממוצע של הבסיס והגובה."],
        [(2*b*h)+' סמ"ר',"הכפלתם בשתיים במקום לחלק בשתיים. משולש הוא חצי מהמלבן, לא כפול ממנו."]

      steps:[S("נוסחת שטח משולש","שטח = בסיס · גובה חלקי 2. החלוקה ב-2 היא כי משולש הוא חצי מלבן.","S = (b · h) ÷ 2"),
             S("מציבים","","S = ("+b+" · "+h+") ÷ 2"),
             S("מחשבים","","S = "+(b*h)+" ÷ 2 = "+num(b*h/2)+' סמ"ר')],

    wrong:[
      W(num(area*b)+' ס"מ',"הכפלתם במקום לחלק. כדי לחזור אחורה מנוסחת השטח מחלקים."),
      W(num(area-b)+' ס"מ',"חיסרתם. השטח נוצר מכפל, אז הפעולה ההפוכה היא חילוק."),
      W(num(area/b/2)+' ס"מ',"חילקתם פעמיים.")
    ],
    steps:[S("כותבים את הנוסחה עם הנעלם","","S = a · b  →  "+area+" = "+b+" · b"),
           S("מחלקים","הפעולה ההפוכה לכפל היא חילוק.","b = "+area+" ÷ "+b),
           S("מחשבים","","b = "+h+' ס"מ')],
    rule:"rect",hint:"אם השטח והאורך ידועים — מחלקים את השטח באורך."};
}

/* ---------- 14. טריגונומטריה במשולש ישר זווית ---------- */
function genTrig(L){
  var t,a,b,c,steps,f;
  if(L===1){
    t=pick(TRIPLES);a=t[0];b=t[1];c=t[2];
    f=pick(["sin","cos","tan"]);
    var val=f==="sin"?fr(a,c):f==="cos"?fr(b,c):fr(a,b);
    var top=f==="sin"?"הניצב שמול הזווית":f==="cos"?"הניצב שליד הזווית":"הניצב שמול הזווית";
    var bot=f==="tan"?"הניצב שליד הזווית":"היתר";
    steps=[
      S("נזכרים בהגדרות","״מול״ היא הצלע שמעבר לזווית, ״ליד״ היא הצלע שנוגעת בה, והיתר הוא מול הזווית הישרה.",
        "sin = מול ÷ יתר   ·   cos = ליד ÷ יתר   ·   tan = מול ÷ ליד"),
      S("מזהים את הצלעות ביחס לזווית α","מול α נמצא הניצב "+a+", לידה הניצב "+b+", והיתר הוא "+c+".",
        "מול = "+a+"  ,  ליד = "+b+"  ,  יתר = "+c),
      S("מציבים בהגדרה","המונה הוא "+top+", המכנה הוא "+bot+".",
        f+" α = "+(f==="sin"?a+"/"+c:f==="cos"?b+"/"+c:a+"/"+b)),
      S("מצמצמים","",f+" α = "+val.html())
    ];
    return {ask:"במשולש שלפניכם, מהו "+f+" α?",expr:"",fig:svgRightTri(b,a,c,"α"),
      ans:W(val.html()),
      wrong:[
        W(fr(val.d,val.n).html(),"הפכתם את השבר. שימו לב מה במונה ומה במכנה בהגדרה."),
        /* ב-tan החלפת ״מול״ ו״ליד״ נותנת בדיוק את השבר ההפוך, כלומר
           את המסיח שמעל. לכן שם המסיח הזה הוא cos. */
        W(f==="tan"?fr(b,c).html():f==="sin"?fr(b,c).html():fr(a,c).html(),
          f==="tan"?"זו ההגדרה של cos. ב-tan אין יתר בכלל — מול חלקי ליד.":"התבלבלתם בין הניצב שמול הזווית לניצב שלידה."),
        W(f==="tan"?fr(a,c).html():fr(a,b).html(),"השתמשתם בהגדרה של פונקציה טריגונומטרית אחרת.")
      ],steps:steps,rule:"trigdef",
      hint:"sin = מול/יתר, cos = ליד/יתר, tan = מול/ליד. תמיד ביחס לזווית שנשאלתם עליה."};
  }
  if(L===2){
    var ang=pick([30,60]);
    c=pick([4,6,8,10,12,14,16,20]);
    var want=ang===30?"הניצב שמול הזווית":"הניצב שליד הזווית";
    var res=c/2;
    steps=[
      S("בוחרים את הפונקציה המתאימה",
        ang===30?"מחפשים את הניצב שמול הזווית, והיתר ידוע — לכן sin.":"מחפשים את הניצב שליד הזווית, והיתר ידוע — לכן cos.",
        ang===30?"sin 30° = מול ÷ יתר":"cos 60° = ליד ÷ יתר"),
      S("מציבים את הערך המדויק","גם sin 30° וגם cos 60° שווים בדיוק לחצי.",
        (ang===30?"sin 30°":"cos 60°")+" = 1/2"),
      S("מבודדים את הצלע","","הצלע = "+c+" · 1/2"),
      S("מחשבים","","הצלע = "+num(res)+' ס"מ')
    ];
    return {ask:"במשולש ישר זווית היתר הוא "+c+' ס"מ ואחת הזוויות היא '+ang+"°. מהו אורך "+want+"?",
      expr:"",fig:ang===30?svgRightTri(null,"?",c+' ס"מ',ang+"°"):svgRightTri("?",null,c+' ס"מ',ang+"°"),
      ans:W(num(res)+' ס"מ'),
      wrong:[
        W(num(r2(c*Math.sqrt(3)/2))+' ס"מ',"השתמשתם ב-√3/2, שזה הערך של הפונקציה השנייה בזווית הזו."),
        W(num(c*2)+' ס"מ',"הכפלתם ביתר במקום לקחת ממנו חלק. ניצב תמיד קצר מהיתר."),
        W(num(ang)+' ס"מ',"זו מידת הזווית במעלות, לא אורך צלע.")
      ],steps:steps,rule:"trigval",
      hint:"sin 30° = cos 60° = 1/2. הצלע המבוקשת היא בדיוק חצי מהיתר."};
  }
  /* רמה 4 — הצלע שההגדרה זקוקה לה אינה נתונה. פיתגורס קודם,
     ההגדרה הטריגונומטרית אחריו, ואיש לא אומר את הסדר. */
  if(L===4){
    t=pick(TRIPLES);a=t[0];b=t[1];c=t[2];
    f=pick(["sin","tan"]);
    var den=f==="sin"?c:b;
    var v4=fr(a,den);
    steps=[
      S("בודקים מה ההגדרה דורשת",
        f==="sin"?"sin הוא הניצב שמול הזווית חלקי היתר. היתר נתון, הניצב שמול — לא.":
                  "tan הוא הניצב שמול הזווית חלקי הניצב שלידה. הניצב שליד נתון, זה שמול — לא.",
        f+" α = "+(f==="sin"?"מול ÷ יתר":"מול ÷ ליד")),
      S("קודם מוצאים את הצלע החסרה","במשולש ישר זווית שתי צלעות קובעות את השלישית.",
        "a² = "+c+"² − "+b+"² = "+(c*c)+" − "+(b*b)+" = "+(a*a)),
      S("מוציאים שורש","","a = √"+(a*a)+" = "+a),
      S("ורק עכשיו מציבים בהגדרה","",f+" α = "+a+" / "+den+" = "+v4.html())
    ];
    return {ask:"במשולש ישר זווית היתר הוא "+c+' ס"מ והניצב שליד הזווית α הוא '+b+' ס"מ. מהו '+f+" α?",
      expr:"",fig:svgRightTri(b,"?",c,"α"),
      ans:W(v4.html()),
      wrong:[
        W(fr(b,c).html(),"זה cos α — הניצב שליד חלקי היתר. השאלה מבקשת "+f+", וההגדרה שלו דורשת את הניצב שמול הזווית."),
        W(fr(den,a).html(),"הפכתם את השבר. הניצב שמול הזווית הוא המונה."),
        W(fr(c-b,den).html(),"חיסרתם את הצלעות עצמן. בפיתגורס מחסרים את הריבועים שלהן, ורק אז מוציאים שורש."),
        W(f==="sin"?fr(a,b).html():fr(a,c).html(),"מצאתם את הצלע החסרה נכון, אבל הצבתם אותה בהגדרה של פונקציה אחרת.")
      ],steps:steps,rule:"trigdef",
      hint:"ההגדרה זקוקה לצלע שאינה נתונה. במשולש ישר זווית תמיד אפשר להשלים צלע שלישית משתי האחרות."};
  }
  var ang3=pick([30,45,60]);
  var fn=pick(["sin","cos","tan"]);
  var TBL={ "sin30":"1/2","cos30":"√3/2","tan30":"1/√3","sin45":"√2/2","cos45":"√2/2","tan45":"1","sin60":"√3/2","cos60":"1/2","tan60":"√3" };
  var key=fn+ang3,val3=TBL[key];
  var others=[];
  for(var kk in TBL)if(TBL[kk]!==val3&&others.indexOf(TBL[kk])<0)others.push(TBL[kk]);
  shuffle(others);
  return {ask:"מהו הערך המדויק?",expr:fn+" "+ang3+"°",
    ans:W(val3),
    wrong:others.slice(0,3).map(function(v){return W(v,"זה הערך של פונקציה אחרת או של זווית אחרת בטבלת הזוויות המיוחדות.")}),
    steps:[
      S("משולש הזוויות המיוחדות","30°, 45° ו-60° הן זוויות שהערכים שלהן ידועים במדויק, בלי מחשבון.",
        "sin30 = 1/2 , cos30 = √3/2 , tan30 = 1/√3"),
      S("ממשיכים בטבלה","","sin45 = cos45 = √2/2 , tan45 = 1"),
      S("ולסיום","","sin60 = √3/2 , cos60 = 1/2 , tan60 = √3"),
      S("התשובה","",fn+" "+ang3+"° = "+val3)
    ],rule:"trigval",
    hint:"שווה לשנן טבלה קטנה: הזוויות 30, 45 ו-60 חוזרות כמעט בכל שאלה."};
}
/* ---------- 15. סטטיסטיקה ---------- */
function genStat(L){
  var arr=[],i,n,steps,sorted,wrong;
  if(L===1){
    n=pick([5,5,6,7]);
    for(i=0;i<n;i++)arr.push(ri(2,20));
    var sum=arr.reduce(function(a,b){return a+b},0);
    while(sum%n!==0){arr[0]=arr[0]+1;sum=arr.reduce(function(a,b){return a+b},0)}
    var avg=sum/n;
    steps=[
      S("ממוצע = סכום חלקי כמות","זו ההגדרה: מחלקים את הכול שווה בשווה בין כל האיברים.","ממוצע = סכום ÷ מספר האיברים"),
      S("מחברים את כל המספרים","",arr.join(" + ")+" = "+sum),
      S("מחלקים בכמות","",sum+" ÷ "+n+" = "+avg)
    ];
    return {ask:"מהו הממוצע של המספרים?",expr:arr.join(" , "),ans:W(String(avg)),
      wrong:wSel(String(avg),[
        [String(sum),"זה הסכום. נשאר לחלק במספר האיברים."],
        [String(Math.round(sum/(n-1)*100)/100),"חילקתם במספר איברים שגוי — יש כאן "+n+" מספרים."],
        [String(Math.max.apply(null,arr)),"זה המספר הגדול ביותר, לא הממוצע."],
        [String(Math.round(sum/(n+1)*100)/100),"ספרתם איבר אחד יותר מדי — יש כאן "+n+" מספרים."],
        [String(Math.min.apply(null,arr)),"זה המספר הקטן ביותר, לא הממוצע."]
      ]),steps:steps,rule:"mean",hint:"ממוצע = סכום כל המספרים חלקי כמה מספרים יש."};
  }
  if(L===2){
    /* רשימה שכמעט כל איבריה שווים — 3 , 3 , 4 , 2 , 3 — מפילה את כל
       המסיחים בבת אחת: הממוצע, שני השכנים אחרי הסידור והקצוות כולם
       יוצאים בדיוק החציון. במקרה כזה מגרילים רשימה חדשה. */
    var med,tries2=0;
    do{
      arr=[];n=pick([5,7,6,8]);
      for(i=0;i<n;i++)arr.push(ri(1,30));
      sorted=arr.slice().sort(function(a,b){return a-b});
      med=n%2?sorted[(n-1)/2]:(sorted[n/2-1]+sorted[n/2])/2;
      wrong=wSel(String(med),candMed(arr,sorted,n,med));
      tries2++;
    }while(wrong.length<3&&tries2<40);
    steps=[
      S("קודם כול — מסדרים","חציון בלי סידור הוא טעות כמעט ודאית. מסדרים מהקטן לגדול.",sorted.join(" , ")),
      S(n%2?"סופרים לאמצע":"יש מספר זוגי של איברים",
        n%2?"יש "+n+" מספרים, אז החציון הוא זה שבמקום ה-"+((n+1)/2)+".":"אין איבר יחיד באמצע, אז לוקחים ממוצע של שני האמצעיים.",
        n%2?"החציון: "+med:"("+sorted[n/2-1]+" + "+sorted[n/2]+") ÷ 2 = "+med),
      S("התשובה","","חציון = "+med)
    ];
    return {ask:"מהו החציון?",expr:arr.join(" , "),ans:W(String(med)),
      wrong:wrong,steps:steps,rule:"median",hint:"חציון = האיבר האמצעי אחרי סידור. במספר זוגי של איברים — ממוצע שני האמצעיים."};
  }
  /* רמה 4 — הממוצע הוא הדרך פנימה, לא התשובה. פעם אחת הוא משמש
     כדי להשלים מספר חסר ואז נשאלים על החציון, ופעם אחת נשאלים על
     מספר שהוסף וששינה את הממוצע. */
  if(L===4){
    if(Math.random()<0.5){
      /* חמישה מספרים שונים זה מזה. ברשימה עם חזרות שני איברים
         סמוכים אחרי הסידור יוצאים שווים, וכל המסיחים שנשענים על
         המיקום אחרי הסידור מתלכדים עם החציון — שלוש אפשרויות. */
      var kn=[],mi,vv,pool4=[];
      while(kn.length<4){vv=ri(2,24);if(kn.indexOf(vv)<0)kn.push(vv)}
      var knSum=kn.reduce(function(u,v){return u+v},0);
      for(vv=2;vv<=26;vv++)if((knSum+vv)%5===0&&kn.indexOf(vv)<0)pool4.push(vv);
      mi=pool4.length?pick(pool4):27-((knSum+27)%5);
      var all=kn.concat([mi]),avg4=(knSum+mi)/5;
      var so=all.slice().sort(function(u,v){return u-v}),med4=so[2];
      var knSorted=kn.slice().sort(function(u,v){return u-v});
      steps=[
        S("ממוצע הוא משוואה","אם הממוצע "+avg4+" ויש 5 מספרים, הסכום חייב להיות "+avg4+" · 5.",
          "סכום = "+avg4+" · 5 = "+(avg4*5)),
        S("משלימים את המספר החסר","",(avg4*5)+" − "+knSum+" = "+mi),
        S("עכשיו יש חמישה מספרים — מסדרים","חציון בלי סידור הוא טעות כמעט ודאית.",so.join(" , ")),
        S("לוקחים את האמצעי","יש כאן חמישה מספרים, ולכן החציון הוא זה שבמקום השלישי.","חציון = "+med4)
      ];
      return {ask:"לחמישה מספרים יש ממוצע "+avg4+". ארבעה מהם הם "+kn.join(", ")+". מהו החציון של כל חמשת המספרים?",
        expr:"",ans:W(String(med4)),
        wrong:[
          W(String(mi),"זה המספר החסר שמצאתם. הוא צעד בדרך, לא התשובה."),
          W(String(avg4),"זה הממוצע שנתון בשאלה. ממוצע וחציון אינם אותו דבר."),
          W(String((knSorted[1]+knSorted[2])/2),"חישבתם חציון של ארבעת המספרים הידועים בלבד, בלי המספר החסר."),
          W(String(all[2]),"לקחתם את האיבר האמצעי לפי הסדר שבו הם כתובים. חייבים לסדר קודם."),
          W(String(so[4]-so[0]),"זה הטווח — ההפרש בין הגדול לקטן."),
          /* שני האחרונים הם רשת ביטחון: כשהמספרים שונים זה מזה,
             so[1] ו-so[3] לעולם אינם שווים ל-so[2], ולכן תמיד
             נשארות ארבע אפשרויות גם אם כל האחרים מתלכדים. */
          W(String(so[1]),"ספרתם מקום אחד מוקדם מדי. מבין חמישה מספרים האמצעי הוא השלישי."),
          W(String(so[3]),"ספרתם מקום אחד מאוחר מדי. מבין חמישה מספרים האמצעי הוא השלישי."),
          W(String(so[0]),"זה המספר הקטן ביותר, לא האמצעי."),
          W(String(so[4]),"זה המספר הגדול ביותר, לא האמצעי.")
        ],steps:steps,rule:"median",
        hint:"החציון נמדד על כל חמשת המספרים, ואחד מהם עדיין לא ידוע. אז יש כאן שני שלבים."};
    }
    n=pick([4,5,6,7]);
    var m1=ri(4,20),m2=m1+pick([1,2,3]),added=(n+1)*m2-n*m1;
    steps=[
      S("הסכום לפני התוספת","ממוצע כפול כמות נותן את הסכום.",n+" · "+m1+" = "+(n*m1)),
      S("הסכום אחרי התוספת","עכשיו יש "+(n+1)+" מספרים, והממוצע שלהם "+m2+".",(n+1)+" · "+m2+" = "+((n+1)*m2)),
      S("ההפרש הוא המספר שהוסף","",((n+1)*m2)+" − "+(n*m1)+" = "+added)
    ];
    return {ask:"ל-"+n+" מספרים יש ממוצע "+m1+". הוסיפו מספר אחד נוסף, והממוצע החדש הוא "+m2+". מהו המספר שהוסף?",
      expr:"",ans:W(String(added)),
      wrong:[
        W(String(m2),"זה הממוצע החדש. מספר שמוסיפים כדי להעלות ממוצע חייב להיות גדול ממנו."),
        W(String(m2-m1),"זה גודל השינוי בממוצע, לא המספר שהוסף."),
        W(String((n+1)*(m2-m1)),"הכפלתם את שינוי הממוצע בכמות. חסר כאן הערך של הממוצע עצמו."),
        W(String(m1+m2),"חיברתם את שני הממוצעים. ממוצעים לא מתחברים כך."),
        W(String(m1),"זה הממוצע הקודם, לפני שהוסף המספר.")
      ],steps:steps,rule:"mean",
      hint:"ממוצע כפול כמות = סכום. חשבו את הסכום לפני ואת הסכום אחרי, וההפרש הוא התשובה."};
  }
  n=pick([4,5,6]);
  var known=[],missing=ri(3,20);
  for(i=0;i<n-1;i++)known.push(ri(2,20));
  /* מזיזים איבר אחד עד שהממוצע יוצא שלם — כך המספר החסר נשאר בטווח סביר */
  var tot=known.reduce(function(a,b){return a+b},0)+missing;
  known[0]+=(n-tot%n)%n;
  tot=known.reduce(function(a,b){return a+b},0)+missing;
  var target=tot/n;
  steps=[
    S("מתרגמים ממוצע למשוואה","אם הממוצע הוא "+target+" ויש "+n+" מספרים, הסכום חייב להיות "+target+" · "+n+".",
      "סכום = "+target+" · "+n+" = "+(target*n)),
    S("מחשבים את הסכום הידוע","",known.map(num).join(" + ")+" = "+known.reduce(function(a,b){return a+b},0)),
    S("מחסרים","",(target*n)+" − "+known.reduce(function(a,b){return a+b},0)+" = "+missing)
  ];
  return {ask:"ל-"+n+" מספרים יש ממוצע "+num(target)+". "+(n-1)+" מהם הם "+known.map(num).join(", ")+". מהו המספר החסר?",
    expr:"",ans:W(String(missing)),
    wrong:wSel(String(missing),[
      [String(target),"הנחתם שהמספר החסר שווה לממוצע. זה נכון רק אם כל המספרים שווים."],
      [String(target*n),"זה הסכום של כל המספרים, לא המספר החסר."],
      [String(Math.abs(known.reduce(function(a,b){return a+b},0)-target)),"חיסרתם את הממוצע מהסכום הידוע במקום להשתמש בסכום הכולל."],
      [String(known.reduce(function(a,b){return a+b},0)),"זה סכום המספרים הידועים. ממנו עוד צריך להגיע למספר החסר."],
      [String(target*(n-1)-known.reduce(function(a,b){return a+b},0)),"הכפלתם את הממוצע במספר המספרים הידועים. הממוצע מוכפל בכל "+n+" המספרים."],
      [String(target*n-target),"חיסרתם מהסכום הכולל את הממוצע. צריך לחסר ממנו את סכום המספרים הידועים."],
      [String(Math.round(known.reduce(function(a,b){return a+b},0)/(n-1)*100)/100),"זה הממוצע של המספרים הידועים בלבד, לא המספר החסר."]
    ]),steps:steps,rule:"mean",
    hint:"ממוצע כפול כמות = הסכום הכולל. משם מחסרים את מה שכבר ידוע."};
}

/* מועמדי המסיחים של החציון. */
function candMed(arr,sorted,n,med){
  return [
    [String(arr[Math.floor(n/2)]),"לקחתם את האיבר האמצעי לפי הסדר שבו הם נכתבו. חייבים קודם לסדר."],
    [String(Math.round(arr.reduce(function(a,b){return a+b},0)/n*100)/100),"זה הממוצע, לא החציון."],
    [String(sorted[n-1]-sorted[0]),"זה הטווח — ההפרש בין הגדול לקטן."],
    [String(n%2?sorted[(n+1)/2]:sorted[n/2]),
      n%2?"ספרתם מקום אחד יותר מדי אחרי הסידור.":"לקחתם רק אחד משני האיברים האמצעיים. במספר זוגי לוקחים את הממוצע שלהם."],
    [String(n%2?sorted[(n-3)/2]:sorted[n/2-1]),
      n%2?"ספרתם מקום אחד מוקדם מדי אחרי הסידור.":"לקחתם רק אחד משני האיברים האמצעיים. במספר זוגי לוקחים את הממוצע שלהם."],
    [String(sorted[0]),"זה המספר הקטן ביותר, לא האמצעי."],
    [String(sorted[n-1]),"זה המספר הגדול ביותר, לא האמצעי."],
    [String(Math.round((sorted[0]+sorted[n-1])/2*100)/100),"חישבתם ממוצע של הגדול והקטן ביותר. החציון הוא האיבר האמצעי אחרי סידור."]
  ];
}
/* ---------- 16. הסתברות ---------- */
function genProb(L){
  var r,g,b2,tot,steps,p;
  if(L===1){
    r=ri(2,9);g=ri(2,9);b2=ri(2,9);tot=r+g+b2;
    p=fr(r,tot);
    steps=[
      S("סופרים את כל האפשרויות","","סה\"כ כדורים: "+r+" + "+g+" + "+b2+" = "+tot),
      S("סופרים את המקרים המבוקשים","",	"כדורים אדומים: "+r),
      S("הסתברות = מבוקש חלקי הכול","",p.html())
    ];
    return {ask:"בשקית "+r+" כדורים אדומים, "+g+" ירוקים ו-"+b2+" כחולים. מוציאים כדור אחד באקראי. מה ההסתברות שהוא אדום?",
      expr:"",ans:W(p.html()),
      wrong:wSel(p.html(),[
        [fr(r,g+b2).html(),"חילקתם במספר הכדורים שאינם אדומים. המכנה הוא תמיד סך כל האפשרויות."],
        [fr(tot,r).html(),"הפכתם את השבר. המבוקש נמצא במונה."],
        [fr(r,3).html(),"חילקתם במספר הצבעים ולא במספר הכדורים."],
        [fr(r,r+g).html(),"שכחתם לספור את הכדורים הכחולים. המכנה הוא סך כל הכדורים בשקית."],
        [fr(g+b2,tot).html(),"זו ההסתברות שהכדור אינו אדום. השאלה מבקשת דווקא אדום."]
      ]),steps:steps,rule:"prob",hint:"הסתברות = כמה מקרים מתאימים, חלקי כמה מקרים אפשריים בסך הכול."};
  }
  if(L===2){
    r=ri(2,8);tot=r+ri(3,10);
    while(tot-r===r)tot++;                   /* בדיוק חצי הופך את המשלים לזהה למקור */
    p=fr(tot-r,tot);
    steps=[
      S("ההסתברות למאורע המקורי","",fr(r,tot).html()),
      S("משלים ל-1","סכום ההסתברויות של מאורע ושל ההפך שלו הוא תמיד 1.","P(לא) = 1 − P(כן)"),
      S("מחשבים","","1 − "+fr(r,tot).html()+" = "+p.html())
    ];
    return {ask:"בקופסה "+tot+" גרביים, מתוכם "+r+" שחורים. מה ההסתברות להוציא גרב שאינו שחור?",
      expr:"",ans:W(p.html()),
      wrong:[
        W(fr(r,tot).html(),"זו ההסתברות דווקא כן להוציא שחור. השאלה מבקשת את המשלים."),
        W(fr(tot,tot-r).html(),"הפכתם את השבר."),
        W(fr(tot-r,r).html(),"חילקתם במספר השחורים במקום בסך הכול.")
      ],steps:steps,rule:"probc",hint:"הסתברות למאורע משלים = 1 פחות ההסתברות למאורע עצמו."};
  }
  /* רמה 4 — ״לפחות אחת״ ו״בדיוק אחת״. שני המאורעות דורשים גם את
     כלל המכפלה וגם את המשלים, ואף אחד מהם אינו נזכר בשאלה. */
  if(L===4){
    var nf=pick([4,6,8,10,12]),fc=ri(1,3);
    if(Math.random()<0.5){
      p=fr(2*nf-1,nf*nf);
      steps=[
        S("סופרים מה קל יותר","״לפחות פעם אחת״ מכסה שלושה מקרים שונים. ההפך שלו — ״אף פעם לא״ — הוא מקרה אחד בלבד.",
          "P(לפחות אחת) = 1 − P(אף פעם)"),
        S("מחשבים את ההסתברות לא לקבל בהטלה אחת","",fr(nf-1,nf).html()),
        S("שתי הטלות בלתי תלויות — מכפילים","",fr(nf-1,nf).html()+" · "+fr(nf-1,nf).html()+" = "+fr((nf-1)*(nf-1),nf*nf).html()),
        S("משלימים ל-1","",	"1 − "+fr((nf-1)*(nf-1),nf*nf).html()+" = "+p.html())
      ];
      return {ask:"מטילים קובייה בעלת "+nf+" פאות פעמיים. מה ההסתברות לקבל את המספר "+fc+" לפחות פעם אחת?",
        expr:"",ans:W(p.html()),
        wrong:[
          W(fr((nf-1)*(nf-1),nf*nf).html(),"זו ההסתברות שהמספר לא הופיע אף פעם. זה בדיוק המאורע ההפוך — נשאר להשלים ל-1."),
          W(fr(2,nf).html(),"חיברתם את שתי ההטלות. החיבור סופר פעמיים את המקרה שבו שתיהן הצליחו."),
          W(fr(1,nf*nf).html(),"זו ההסתברות ששתי ההטלות נתנו את המספר. ״לפחות אחת״ כולל גם מקרה אחד בלבד."),
          W(fr(1,nf).html(),"התייחסתם להטלה אחת בלבד.")
        ],steps:steps,rule:"probc",
        hint:"״לפחות אחת״ מכסה כמה מקרים. שווה לשאול מה ההפך שלו — כי ההפך הוא מקרה יחיד."};
    }
    p=fr(2*(nf-1),nf*nf);
    steps=[
      S("מפרקים את המאורע","״בדיוק פעם אחת״ קורה בשתי דרכים: הצלחה ואז כישלון, או כישלון ואז הצלחה.",
        "P = P(כן, לא) + P(לא, כן)"),
      S("כל דרך היא מכפלה","ההטלות בלתי תלויות, ולכן מכפילים.",
        fr(1,nf).html()+" · "+fr(nf-1,nf).html()+" = "+fr(nf-1,nf*nf).html()),
      S("שתי דרכים — מחברים אותן","",	fr(nf-1,nf*nf).html()+" + "+fr(nf-1,nf*nf).html()+" = "+p.html())
    ];
    return {ask:"מטילים קובייה בעלת "+nf+" פאות פעמיים. מה ההסתברות לקבל את המספר "+fc+" בדיוק פעם אחת?",
      expr:"",ans:W(p.html()),
      wrong:[
        W(fr(nf-1,nf*nf).html(),"חישבתם רק סדר אחד. ״בדיוק פעם אחת״ מתקיים בשתי דרכים — וצריך לחבר אותן."),
        W(fr(2*nf-1,nf*nf).html(),"זו ההסתברות ל״לפחות פעם אחת״, והיא כוללת גם את המקרה שבו המספר הופיע פעמיים."),
        W(fr(1,nf*nf).html(),"זו ההסתברות ששתי ההטלות נתנו את המספר."),
        W(fr(2,nf).html(),"חיברתם את ההסתברויות בלי להתחשב בכך שההטלה השנייה חייבת להיכשל.")
      ],steps:steps,rule:"probm",
      hint:"״בדיוק פעם אחת״ אינו מקרה יחיד — יש שני סדרים אפשריים, וכל אחד מהם מכפלה."};
  }
  /* קובייה בעלת 3 או 5 פאות אינה קיימת. 4, 6, 8, 10 ו-12 הן קוביות אמיתיות. */
  var n1=pick([4,6,8,10,12]),n2=pick([4,6,8,10,12]);
  p=fr(1,n1*n2);
  steps=[
    S("שני ניסויים בלתי תלויים","התוצאה של הראשון לא משפיעה על השני, ולכן מכפילים הסתברויות.","P(שניהם) = P₁ · P₂"),
    S("מציבים","",fr(1,n1).html()+" · "+fr(1,n2).html()),
    S("מכפילים","",p.html())
  ];
  return {ask:"מטילים קובייה בעלת "+n1+" פאות ואחריה קובייה בעלת "+n2+" פאות. מה ההסתברות לקבל 1 בשתיהן?",
    expr:"",ans:W(p.html()),
    wrong:[
      /* חיבור ההסתברויות הוא 1/n₁ + 1/n₂, כלומר (n₁+n₂)/(n₁·n₂).
         המסיח הקודם הראה 2/(n₁+n₂), מספר שאינו נובע מההסבר שלידו. */
      W(fr(n1+n2,n1*n2).html(),"חיברתם הסתברויות. חיבור מתאים ל״או״, כפל מתאים ל״וגם״."),
      W(fr(1,n1+n2).html(),"חיברתם את מספרי הפאות במקום להכפיל אותם."),
      W(fr(1,Math.max(n1,n2)).html(),"התייחסתם רק לקובייה אחת.")
    ],steps:steps,rule:"probm",hint:"״וגם״ בשני ניסויים בלתי תלויים — מכפילים את ההסתברויות."};
}

/* ---------- 17. סדרה חשבונית ---------- */
function genSeq(L){
  var a1,d,n,steps,an;
  a1=rnz(-12,15);d=rnz(-7,8);
  if(L===1){
    n=ri(5,20);an=a1+(n-1)*d;
    steps=[
      S("נוסחת האיבר הכללי","aₙ = a₁ + (n − 1)·d. שימו לב ל-n מינוס 1 — כי מהאיבר הראשון עושים n−1 צעדים.",
        "aₙ = a₁ + (n − 1)d"),
      S("מציבים","","a"+n+" = "+num(a1)+" + ("+n+" − 1)·"+pn(d)),
      S("מחשבים","","a"+n+" = "+num(a1)+" + "+(n-1)+"·"+pn(d)+" = "+num(an))
    ];
    return {ask:"בסדרה חשבונית האיבר הראשון הוא "+num(a1)+" וההפרש הוא "+num(d)+". מהו האיבר ה-"+n+"?",
      expr:"",ans:W(num(an)),
      wrong:wSel(num(an),[
        [num(a1+n*d),"הכפלתם ב-n במקום ב-n מינוס 1. מהאיבר הראשון לאיבר ה-"+n+" יש "+(n-1)+" צעדים."],
        [num(a1+(n-1)*d*-1),"טעות סימן בהפרש."],
        [num(a1*n+d),"הכפלתם את האיבר הראשון ב-n."],
        [num(a1+(n-2)*d),"ספרתם צעד אחד פחות מדי. מהאיבר הראשון לאיבר ה-"+n+" יש "+(n-1)+" צעדים."],
        [num((n-1)*d),"שכחתם להוסיף את האיבר הראשון. הנוסחה מתחילה ב-a₁."]
      ]),steps:steps,rule:"seq",hint:"aₙ = a₁ + (n−1)·d. הכי חשוב: n מינוס אחד, לא n."};
  }
  if(L===2){
    n=ri(6,14);an=a1+(n-1)*d;
    steps=[
      S("שני איברים ידועים","","a₁ = "+num(a1)+"   ,   a"+n+" = "+num(an)),
      S("מציבים בנוסחה","","a"+n+" = a₁ + ("+n+" − 1)d"),
      S("מבודדים את d","",num(an)+" − "+pn(a1)+" = "+(n-1)+"d  →  "+num(an-a1)+" = "+(n-1)+"d"),
      S("מחלקים","","d = "+num(an-a1)+" ÷ "+(n-1)+" = "+num(d))
    ];
    return {ask:"בסדרה חשבונית a₁ = "+num(a1)+" והאיבר ה-"+n+" הוא "+num(an)+". מהו ההפרש d?",
      expr:"",ans:W("d = "+num(d)),
      wrong:[
        W("d = "+num(r2((an-a1)/n)),"חילקתם ב-n. מספר הצעדים בין האיבר הראשון לאיבר ה-"+n+" הוא "+(n-1)+"."),
        W("d = "+num(an-a1),"זה ההפרש הכולל לאורך כל הסדרה, לא ההפרש בין שני איברים עוקבים."),
        W("d = "+num(-d),"טעות סימן בחיסור. מחסרים את הראשון מהאחרון.")
      ],steps:steps,rule:"seq",hint:"מציבים את שני האיברים בנוסחה ומבודדים את d. שימו לב שמחלקים ב-n מינוס 1."};
  }
  /* רמה 4 — האיבר הראשון אינו נתון. כדי להגיע לסכום צריך קודם את
     ההפרש, ממנו לחזור אחורה אל a₁, ורק אז להיכנס לנוסחת הסכום. */
  if(L===4){
    n=pick([8,10,12,15,20]);
    an=a1+(n-1)*d;
    /* שתי הגרלות שמפרקות את השאלה: a₁ + aₙ = 0 מאפס את הסכום, ואם
       הסכום יוצא שווה לאיבר האחרון — המסיח ״זה האיבר עצמו״ הוא
       התשובה הנכונה, והשאלה יורדת לשלוש אפשרויות. */
    var g7=0,bad7=function(){return a1+an===0||n*(a1+an)/2===an};
    while(bad7()&&g7<40){d=rnz(-7,8);a1=rnz(-12,15);an=a1+(n-1)*d;g7++}
    if(bad7()){a1=5;d=2;an=a1+(n-1)*d}
    var ii=ri(2,5),jj=ii+ri(2,6),ai=a1+(ii-1)*d,aj=a1+(jj-1)*d;
    var sm=n*(a1+an)/2;
    steps=[
      S("מוצאים את ההפרש","בין האיבר ה-"+ii+" לאיבר ה-"+jj+" יש "+(jj-ii)+" צעדים, וכל צעד הוא d.",
        "d = ("+num(aj)+" − "+pn(ai)+") ÷ "+(jj-ii)+" = "+num(d)),
      S("חוזרים אחורה אל האיבר הראשון","מהאיבר ה-"+ii+" חוזרים אחורה אל הראשון, צעד אחרי צעד.",
        "a₁ = "+num(ai)+" − "+(ii-1)+"·"+pn(d)+" = "+num(a1)),
      S("מחשבים את האיבר האחרון","","a"+n+" = "+num(a1)+" + "+(n-1)+"·"+pn(d)+" = "+num(an)),
      S("מציבים בנוסחת הסכום","Sₙ = n(a₁ + aₙ) ÷ 2","S = "+n+"·("+num(a1)+" + "+pn(an)+") ÷ 2 = "+num(sm))
    ];
    return {ask:"בסדרה חשבונית האיבר ה-"+ii+" הוא "+num(ai)+" והאיבר ה-"+jj+" הוא "+num(aj)+". מהו סכום "+n+" האיברים הראשונים?",
      expr:"",ans:W(num(sm)),
      wrong:[
        W(num(n*(ai+an)/2),"התייחסתם לאיבר ה-"+ii+" כאילו הוא האיבר הראשון. צריך קודם לחזור אחורה אליו."),
        W(num(an),"זה האיבר ה-"+n+" עצמו, לא הסכום."),
        W(num(n*(a1+an)),"שכחתם לחלק ב-2."),
        W(num(n*a1),"הכפלתם את האיבר הראשון במספר האיברים, כאילו כל האיברים שווים."),
        W(num(n*(a1+a1+n*d)/2),"בחישוב האיבר האחרון הכפלתם ב-n במקום ב-n מינוס 1.")
      ],steps:steps,rule:"seqsum",
      hint:"נוסחת הסכום דורשת את a₁, והוא לא נתון. אז מתחילים מההפרש — הוא מה שמאפשר לחזור אחורה."};
  }
  n=ri(5,15);an=a1+(n-1)*d;
  var sum=n*(a1+an)/2;
  if(Math.round(sum)!==sum){d=2;an=a1+(n-1)*d;sum=n*(a1+an)/2}
  steps=[
    S("נוסחת הסכום","Sₙ = n · (a₁ + aₙ) ÷ 2 — כלומר מספר האיברים כפול ממוצע הראשון והאחרון.","Sₙ = n(a₁ + aₙ) ÷ 2"),
    S("מחשבים את האיבר האחרון","","a"+n+" = "+num(a1)+" + "+(n-1)+"·"+pn(d)+" = "+num(an)),
    S("מציבים בנוסחת הסכום","","S = "+n+"·("+num(a1)+" + "+pn(an)+") ÷ 2"),
    S("מחשבים","","S = "+n+"·"+pn(a1+an)+" ÷ 2 = "+num(sum))
  ];
  return {ask:"בסדרה חשבונית a₁ = "+num(a1)+" ו-d = "+num(d)+". מהו סכום "+n+" האיברים הראשונים?",
    expr:"",ans:W(num(sum)),
    wrong:wSel(num(sum),[
      [num(an),"זה האיבר ה-"+n+" עצמו, לא הסכום של כולם."],
      [num(n*(a1+an)),"שכחתם לחלק ב-2."],
      [num(n*a1),"הכפלתם את האיבר הראשון במספר האיברים, כאילו כל האיברים שווים."],
      [num(r2((a1+an)/2)),"זה הממוצע של הראשון והאחרון. נשאר להכפיל אותו במספר האיברים."],
      [num(n*an),"הכפלתם את האיבר האחרון במספר האיברים, כאילו כל האיברים שווים לו."]
    ]),steps:steps,rule:"seqsum",
    hint:"סכום סדרה חשבונית = מספר האיברים כפול הממוצע של הראשון והאחרון."};
}

/* ---------- 18. בעיות מילוליות ---------- */
function genWord(L){
  var v1,v2,t,d,steps,x;
  if(L===1){
    v1=pick([40,50,60,70,80,90,100]);t=pick([2,3,4,5]);d=v1*t;
    return {ask:"רכב נוסע במהירות קבועה של "+v1+' קמ"ש במשך '+t+" שעות. איזה מרחק הוא עבר?",
      expr:"",ans:W(d+' ק"מ'),
      wrong:[
        W(num(r2(v1/t))+' ק"מ',"חילקתם. מרחק = מהירות כפול זמן."),
        W(num(v1+t)+' ק"מ',"חיברתם מהירות עם זמן. אלה גדלים שונים — הם לא מתחברים."),
        W(num(r2(t/v1))+' ק"מ',"חילקתם בכיוון ההפוך.")
      ],
      steps:[S("הנוסחה המשולשת","מרחק = מהירות · זמן. מכאן גם: מהירות = מרחק ÷ זמן, וזמן = מרחק ÷ מהירות.","D = v · t"),
             S("מציבים","","D = "+v1+" · "+t),
             S("מחשבים","","D = "+d+' ק"מ')],
      rule:"motion",hint:"מרחק = מהירות כפול זמן. שווה לזכור את המשולש: D למעלה, v ו-t למטה."};
  }
  if(L===2){
    /* בעיית גיל — קלאסיקה של תרגום משפט למשוואה */
    var kid=ri(6,14),mult=pick([2,3,4]);
    var parent=kid*mult;
    steps=[
      S("מגדירים נעלם","מסמנים באות אחת בדיוק את מה שמחפשים.","x = גיל הילד היום"),
      S("כותבים את המשפט כביטוי","״מבוגר פי "+mult+"״ פירושו שגיל ההורה הוא "+mult+" כפול גיל הילד.",
        "גיל ההורה = "+mult+"x"),
      S("בונים משוואה","ידוע שגיל ההורה הוא "+parent+".",mult+"x = "+parent),
      S("מחלקים במקדם","","x = "+parent+" ÷ "+mult+" = "+kid)
    ];
    return {ask:"הורה מבוגר מילדו פי "+mult+". היום ההורה בן "+parent+". בן כמה הילד?",
      expr:"",ans:W(kid+" שנים"),
      wrong:[
        W((parent-mult)+" שנים","חיסרתם את המספר "+mult+" מגיל ההורה. ״פי "+mult+"״ פירושו חילוק, לא חיסור."),
        W((parent*mult)+" שנים","הכפלתם במקום לחלק. הילד צעיר יותר."),
        W((parent-kid)+" שנים","זה הפרש הגילים, לא גיל הילד."),
        W(parent+" שנים","זה גיל ההורה, שכבר נתון בשאלה. מבקשים את גיל הילד.")
      ],steps:steps,rule:"word",
      hint:"מסמנים באות אחת את מה שמחפשים, וכותבים כל משפט בשאלה כביטוי עם אותה אות."};
  }
  /* רמה 4 — מהירות ממוצעת. הנוסחה D = v·t משמשת כאן פעמיים בכיוון
     אחד ופעם אחת בכיוון ההפוך, והמלכודת היא לחשוב שממוצע של שתי
     מהירויות הוא הממוצע שלהן. */
  if(L===4){
    var t1=pick([1,2,3,4]),t2=pick([1,2,3,4]);
    v1=pick([40,50,60,80,90,100,120]);v2=pick([40,50,60,80,90,100,120]);
    var tw8=0,D8,T8,av8;
    D8=v1*t1+v2*t2;T8=t1+t2;av8=D8/T8;
    while((t1===t2||v1===v2||T8<3||Math.round(av8)!==av8)&&tw8<200){
      t1=pick([1,2,3,4]);t2=pick([1,2,3,4]);
      v1=pick([40,50,60,80,90,100,120]);v2=pick([40,50,60,80,90,100,120]);
      D8=v1*t1+v2*t2;T8=t1+t2;av8=D8/T8;tw8++;
    }
    if(t1===t2||v1===v2||Math.round(av8)!==av8){t1=1;t2=3;v1=100;v2=60;D8=280;T8=4;av8=70}
    steps=[
      S("מחשבים כמה נסע בכל קטע","מרחק = מהירות · זמן.",
        v1+" · "+t1+" = "+(v1*t1)+' ק"מ<br>'+v2+" · "+t2+" = "+(v2*t2)+' ק"מ'),
      S("מסכמים את כל הדרך ואת כל הזמן","",
        (v1*t1)+" + "+(v2*t2)+" = "+D8+' ק"מ<br>'+t1+" + "+t2+" = "+T8+" שעות"),
      S("מהירות ממוצעת = כל המרחק חלקי כל הזמן","זה לא הממוצע של שתי המהירויות — הן לא נמשכו אותו מספר שעות.",
        D8+" ÷ "+T8+" = "+num(av8)+' קמ"ש')
    ];
    return {ask:"רכב נסע "+t1+" שעות במהירות "+v1+' קמ"ש, ומיד אחר כך '+t2+" שעות במהירות "+v2+
        ' קמ"ש. מהי המהירות הממוצעת שלו לאורך כל הנסיעה?',
      expr:"",ans:W(num(av8)+' קמ"ש'),
      wrong:[
        W(num((v1+v2)/2)+' קמ"ש',"חישבתם ממוצע של שתי המהירויות. הן לא נמשכו אותו זמן, ולכן המשקל שלהן שונה."),
        W(num(D8)+' קמ"ש',"זה המרחק הכולל בקילומטרים, לא המהירות."),
        W(num(v1+v2)+' קמ"ש',"חיברתם את שתי המהירויות. מהירויות מתחברות רק כששני גופים נעים זה לקראת זה."),
        W(num(D8/2)+' קמ"ש',"חילקתם ב-2 במקום בזמן הכולל. מספר הקטעים אינו מספר השעות.")
      ],steps:steps,rule:"motion",
      hint:"מהירות ממוצעת אינה ממוצע של מהירויות. היא כל המרחק חלקי כל הזמן — אז קודם מחשבים את שניהם."};
  }
  /* רמה 3: שתי מהירויות — פגישה */
  v1=pick([40,50,60,70]);v2=pick([30,60,80,90]);
  if(v1===v2)v2=v1+20;
  t=pick([2,3,4]);
  d=(v1+v2)*t;
  steps=[
    S("מציירים את המצב","שני רכבים נוסעים זה לקראת זה. בכל שעה המרחק ביניהם מצטמצם בסכום המהירויות.",
      "מהירות התקרבות = "+v1+" + "+v2+" = "+(v1+v2)+' קמ"ש'),
    S("כותבים את המשוואה","","("+v1+" + "+v2+") · t = "+d),
    S("מחלקים","","t = "+d+" ÷ "+(v1+v2)+" = "+t+" שעות")
  ];
  return {ask:"שתי מכוניות יוצאות זו לקראת זו ממרחק "+d+' ק"מ, במהירויות '+v1+" ו-"+v2+' קמ"ש. אחרי כמה שעות ייפגשו?',
    expr:"",ans:W(t+" שעות"),
    wrong:wSel(t+" שעות",[
      [num(r2(d/v1))+" שעות","התייחסתם רק לרכב אחד. כששניהם נוסעים זה לקראת זה — המהירויות מתחברות."],
      [num(r2(d/Math.abs(v1-v2)))+" שעות","חיסרתם מהירויות. חיסור מתאים למרדף באותו כיוון, לא לנסיעה זה לקראת זה."],
      [num(r2(d/(v1+v2)/2))+" שעות","חילקתם ב-2 מיותר — לא צריך לחצות את המרחק."],
      [num(r2(d/v2))+" שעות","התייחסתם רק לרכב השני. כששניהם נוסעים זה לקראת זה — המהירויות מתחברות."],
      [num(r2(d/(v1+v2)*2))+" שעות","הכפלתם ב-2 מיותר. המרחק כבר נסגר על ידי שני הרכבים יחד."]
    ]),steps:steps,rule:"motion",
    hint:"כששניים נוסעים זה לקראת זה, המהירויות מתחברות ואז מחלקים את המרחק בסכום."};
}

/* ============================================================
   12. בניית שאלה
   מנרמל את מה שהמחולל החזיר: מסנן מסיחים כפולים או פגומים,
   מערבב, ומכין גם טקסט להקראה.
   ============================================================ */
function badStr(s){return !s||/NaN|Infinity|undefined|null/.test(s)}

function buildQ(topicId,level){
  var t=topicById(topicId);
  if(!t)t=TOPICS[0];
  var raw=null,tries=0,opts,i,p,seen,ansP;
  while(tries<8){
    tries++;
    try{raw=t.gen(level)}catch(e){raw=null}
    if(!raw||!raw.ans||badStr(plainOf(raw.ans.h)))continue;
    ansP=plainOf(raw.ans.h);
    seen={};seen[ansP]=1;
    opts=[{h:raw.ans.h,t:ansP,ok:true,why:""}];
    for(i=0;i<(raw.wrong||[]).length;i++){
      /* ארבע אפשרויות לכל היותר: המקלדת מקצה 1–4, ובמסך התרגול
         מערך התוויות הוא באורך ארבע. אפשרות חמישית קיבלה תווית
         undefined ולא הייתה נגישה מהמקלדת. */
      if(opts.length>=4)break;
      p=plainOf(raw.wrong[i].h);
      if(badStr(p)||seen[p])continue;
      seen[p]=1;
      opts.push({h:raw.wrong[i].h,t:p,ok:false,why:raw.wrong[i].why||""});
    }
    if(opts.length>=3)break;
  }
  if(!raw)raw={ask:"חשבו",expr:"1 + 1",ans:W("2"),wrong:[W("1"),W("3"),W("11")],steps:[S("חיבור","","1 + 1 = 2")],hint:"",rule:"order"};
  if(!opts||opts.length<2){
    ansP=plainOf(raw.ans.h);
    opts=[{h:raw.ans.h,t:ansP,ok:true,why:""}];
  }
  shuffle(opts);
  var sayTxt=speakProse(raw.ask)+(raw.expr?". "+speakMath(plainOf(raw.expr)):"");
  return {
    topic:t.id,topicName:t.name,level:level,
    ask:raw.ask,expr:raw.expr||"",fig:raw.fig||"",
    options:opts,steps:raw.steps||[],hint:raw.hint||"",rule:raw.rule||"",
    say:sayTxt
  };
}

var P={list:[],i:0,q:null,phase:"ask",picked:[],hints:0,steps:0,usedHelp:false,results:[],startedAt:0};

function mastery(id){
  var m=state.mastery[id];
  if(!m){m={seen:0,ok:0,help:0,m:0};state.mastery[id]=m}
  return m;
}
function activeTopics(){
  var chosen=state.topics.filter(function(id){return !!topicById(id)});
  if(chosen.length)return chosen;
  return topicsForTrack(state.track).map(function(t){return t.id});
}
/* בחירת הנושא הבא: מי שחלש יותר מקבל יותר תורות, ומדי כמה
   שאלות חוזר נושא שנפלו בו קודם. ככה החזרה קורית לבד. */
function nextTopic(idx){
  var pool=activeTopics();
  if(idx>0&&idx%3===2&&state.wrongBank.length){
    var w=state.wrongBank[state.wrongBank.length-1-Math.floor(Math.random()*Math.min(5,state.wrongBank.length))];
    if(w&&pool.indexOf(w.topic)>=0)return w.topic;
  }
  var weights=pool.map(function(id){return 110-mastery(id).m}),total=0,i;
  for(i=0;i<weights.length;i++)total+=weights[i];
  var r=Math.random()*total;
  for(i=0;i<pool.length;i++){r-=weights[i];if(r<=0)return pool[i]}
  return pool[pool.length-1];
}
function startRound(forceTopic){
  var n=state.settings.roundLen,i;
  P.list=[];
  for(i=0;i<n;i++)P.list.push(forceTopic||nextTopic(i));
  P.i=0;P.results=[];P.startedAt=Date.now();
  loadQ();
}
function loadQ(){
  P.q=buildQ(P.list[P.i],state.level);
  P.phase="ask";P.picked=[];P.hints=0;P.steps=0;P.usedHelp=false;
  if(state.settings.autoSteps)P.steps=1;
}
function roundDone(){return P.i>=P.list.length}

/* השליטה בנושא נמדדת כממוצע נע של הביצועים האחרונים, ולא
   כמונה שמטפס לאט. תלמיד שענה נכון צריך לראות מספר שמשקף
   את זה מיד — אחרת המדד מתסכל במקום לעזור. */
function scoreAnswer(ok){
  var m=mastery(P.q.topic),d=dayRec(),score;
  m.seen++;d.a++;state.stats.answered++;
  touchDay();
  if(ok&&!P.usedHelp&&P.picked.length===1){
    m.ok++;d.c++;state.stats.correct++;state.stats.xp+=10;
    score=1;P.results.push("ok");
  }else if(ok&&!P.usedHelp){
    m.ok++;d.c++;state.stats.correct++;state.stats.xp+=4;
    score=0.7;P.results.push("ok");
  }else if(P.usedHelp){
    m.help++;state.stats.helped++;state.stats.xp+=2;
    score=0.35;P.results.push("hp");
  }else{
    score=0;P.results.push("no");
  }
  m.m=m.seen===1?Math.round(score*100):Math.round(m.m*0.6+score*40);
  if(!ok||P.usedHelp){
    state.wrongBank.push({topic:P.q.topic,ts:Date.now()});
    if(state.wrongBank.length>40)state.wrongBank.shift();
  }
  save();
}

    var ma=mastery(a),mb=mastery(b);
    if(!ma.seen&&!mb.seen)return 0;
    if(!ma.seen)return 1;
    if(!mb.seen)return -1;
    return ma.m-mb.m;
  }).slice(0,6);
  h+='<h2 class="h2" style="margin-top:26px">מה כדאי לתרגל עכשיו</h2>'+
     '<p class="sub sm">שישה נושאים לפי מה שעדיין לא יושב. לחיצה פותחת תרגול ממוקד.</p>'+
     '<div class="grid g3" style="margin-top:12px">'+
     byNeed.map(function(id){
       var tp=topicById(id);
       return '<button class="tpc '+areaCls(tp.area)+'" data-a="starttopic" data-t="'+id+'">'+
         '<span class="tn">'+tp.name+'</span><span class="td">'+tp.desc+'</span>'+masteryBar(id)+'</button>';
     }).join("")+'</div>';
  h+='<div class="row" style="margin-top:20px"><button class="btn btn-g" data-a="go" data-v="topics">'+ic("list",17)+' כל '+pool.length+' הנושאים</button>'+
     '<button class="btn btn-g" data-a="go" data-v="formulas">'+ic("book",17)+' דף נוסחאות</button></div>';
  return h+'</main>';
}
/* ---------- תרגול ---------- */
function viewPractice(){
  if(!P.q)startRound();
  if(P.phase==="done")return viewSummary();
  var q=P.q,calm=state.settings.calm;
  var h='<main id="main" class="wrap" style="padding-top:18px;padding-bottom:44px">';
  /* שורת מצב */
  h+='<div class="spread">'+
      '<div class="row"><span class="chip area '+topicCls(q.topic)+'">'+q.topicName+'</span>'+
      '<span class="chip">שאלה '+(P.i+1)+' מתוך '+P.list.length+'</span></div>'+
      '<div class="row"><span class="dots">'+
        P.list.map(function(_,i){
          var c=i<P.results.length?(P.results[i]==="ok"?"ok":P.results[i]==="hp"?"hp":"no"):"";
          return '<span class="dot '+c+'"></span>';
        }).join("")+'</span>'+
      '<button class="btn btn-g" style="padding:8px 12px;font-size:.85rem" data-a="stop">'+ic("pause",15)+' עצירה</button></div>'+
     '</div>';
  h+='<div class="grid" style="grid-template-columns:minmax(0,1fr);margin-top:14px">';
  /* כרטיס השאלה */
  h+='<div class="card pad rise '+topicCls(q.topic)+'" style="border-top:3px solid var(--c)">';
  h+='<p style="font-size:clamp(1rem,3.6vw,1.15rem);font-weight:600">'+q.ask+'</p>';
  if(q.expr)h+='<p class="mline" style="margin-top:14px">'+q.expr+'</p>';
  if(q.fig)h+=q.fig;
  /* כפתורי עזר */
  h+='<div class="row" style="margin-top:16px;gap:8px">'+
     (state.settings.tts?(saying
       ?'<button class="btn btn-g" style="padding:9px 13px;font-size:.88rem" data-a="hush">'+ic("pause",16)+' עצירת ההקראה</button>'
       :'<button class="btn btn-g" style="padding:9px 13px;font-size:.88rem" data-a="read">'+ic("speaker",16)+' הקראה</button>'):"")+
     '<button class="btn btn-g" style="padding:9px 13px;font-size:.88rem" data-a="hint"'+(P.hints>0?" disabled":"")+'>'+ic("bulb",16)+' רמז</button>'+
     '<button class="btn btn-g" style="padding:9px 13px;font-size:.88rem" data-a="guide"'+(P.steps>0?" disabled":"")+'>'+ic("steps",16)+' פתרון מודרך</button>'+
     (q.rule?'<button class="btn btn-g" style="padding:9px 13px;font-size:.88rem" data-a="rule" data-r="'+q.rule+'">'+ic("book",16)+' הנוסחה</button>':"")+
     '</div>';
  if(P.hints>0&&q.hint)h+='<div class="hintbox rise"><b>רמז</b><div class="sm hintxt" style="margin-top:3px">'+q.hint+'</div></div>';
  /* תשובות */
  var keys=["1","2","3","4"];
  h+='<div class="opts">'+q.options.map(function(o,i){
    var cls="opt",dis="";
    var wasPicked=P.picked.indexOf(i)>=0;
    if(P.phase==="reveal"){
      dis=" disabled";
      if(o.ok)cls+=" right";
      else if(wasPicked)cls+=calm?" gone":" wrong";
      else cls+=" dim";
    }else if(wasPicked){cls+=calm?" gone":" wrong";dis=" disabled"}
    return '<button class="'+cls+'"'+dis+' data-a="ans" data-i="'+i+'">'+
      '<span class="k">'+keys[i]+'</span><span class="m">'+o.h+'</span></button>';
  }).join("")+'</div>';
  /* אבחון הטעות האחרונה */
  if(P.lastWhy&&P.phase!=="reveal"){
    /* הכותרת וההסבר נכנסו למסך גולמיים. ההכרזה לקורא המסך כבר
       עברה דרך _(), אבל הטקסט הנראה לא — כלומר תלמיד שלמד בערבית
       קיבל את ההסבר לטעות שלו בעברית, בדיוק ברגע שהוא הכי צריך
       אותו. מחרוזת שאינה במילון נופלת חזרה לעברית כמו קודם. */
    h+='<div class="diag rise"><b>'+_("מה קרה כאן")+'</b><div class="sm" style="margin-top:3px">'+_(P.lastWhy)+'</div></div>';
  }
  h+='</div>';
  /* פתרון מודרך */
  if(P.steps>0||P.phase==="reveal"){
    var showAll=P.phase==="reveal";
    var shown=showAll?q.steps.length:Math.min(P.steps,q.steps.length);
    h+='<div class="card pad rise '+topicCls(q.topic)+'"><div class="spread"><div class="h2" style="color:var(--c)">'+ic("steps",18)+' הפתרון, צעד אחר צעד</div>'+
       (state.settings.tts?'<button class="btn btn-g" style="padding:8px 12px;font-size:.85rem" data-a="readsteps">'+ic("speaker",15)+' הקראה</button>':"")+'</div>';
    h+='<div class="steps">'+q.steps.map(function(s,i){
      if(i>=shown)return "";
      return '<div class="step'+(i===q.steps.length-1?" last":"")+'"><div class="st"><span class="num">'+(i+1)+'</span>'+s.t+'</div>'+
        (s.d?'<div class="sd">'+s.d+'</div>':"")+
        (s.m?'<div class="mstep">'+s.m+'</div>':"")+'</div>';
    }).join("")+'</div>';
    if(!showAll&&shown<q.steps.length){
      h+='<button class="btn btn-p w" style="margin-top:12px" data-a="nextstep">הצעד הבא '+ic("arrow",17)+'</button>';
      h+='<p class="sub xs" style="text-align:center;margin-top:8px">אפשר לעצור בכל שלב ולנסות להמשיך לבד.</p>';
    }
    h+='</div>';
  }
  /* פס תחתון אחרי מענה */
  if(P.phase==="reveal"){
    var kind=P.results[P.results.length-1];
    h+='<div class="card pad rise" style="border-inline-start:4px solid var(--'+(kind==="ok"?"ok":kind==="hp"?"accent":"bad")+')">'+
       '<div class="row">'+ic(kind==="ok"?"check":"bulb",19)+'<b>'+lineFor(kind)+'</b></div>'+
       '<button class="btn btn-p w" style="margin-top:12px;padding:14px" data-a="next">'+
         (P.i+1>=P.list.length?"לסיכום הסבב":"לשאלה הבאה")+' '+ic("arrow",18)+'</button>'+
       (state.settings.keys?'<p class="sub xs" style="text-align:center;margin-top:8px">אפשר גם ללחוץ Enter</p>':"")+
       '</div>';
  }
  h+='</div>';
  if(state.settings.keys&&P.phase==="ask")
    h+='<p class="sub xs" style="margin-top:14px;text-align:center">מקלדת: 1–4 תשובה · רווח הקראה · H רמז · S פתרון</p>';
  return h+'</main>';
}

/* ---------- סיכום סבב ---------- */
function viewSummary(){
  var ok=P.results.filter(function(r){return r==="ok"}).length;
  var hp=P.results.filter(function(r){return r==="hp"}).length;
  var no=P.results.length-ok-hp;
  var pct=Math.round(ok/Math.max(1,P.results.length)*100);
  var byTopic={},i;
  for(i=0;i<P.list.length&&i<P.results.length;i++){
    var id=P.list[i];
    if(!byTopic[id])byTopic[id]={ok:0,n:0};
    byTopic[id].n++;if(P.results[i]==="ok")byTopic[id].ok++;
  }
  var worst=null;
  for(var k in byTopic)if(byTopic[k].n>=2&&(!worst||byTopic[k].ok/byTopic[k].n<byTopic[worst].ok/byTopic[worst].n))worst=k;
  var title=pct>=85?"סבב חזק.":pct>=60?"סבב טוב.":pct>=35?"סבב עם עבודה.":"סבב קשה — וזה בסדר.";
  var sub=pct>=85?"אתם שולטים ברוב מה שתרגלתם כאן."
       :pct>=60?"רוב הדברים במקום. יש נקודה אחת או שתיים שכדאי לחדד."
       :pct>=35?"חלק מהחומר עוד לא יושב. זה בדיוק מה שמדידה כזאת נועדה להראות."
       :"סבב כזה לא אומר עליכם כלום חוץ מזה שהחומר הזה חדש. שווה לרדת רמה ולבנות מלמטה.";
  var h='<main id="main" class="wrap" style="padding-top:26px;padding-bottom:44px;max-width:760px">';
  h+='<div class="card pad rise"><h1 class="h1">'+title+'</h1><p class="sub">'+sub+'</p>'+
     '<div class="grid g4" style="margin-top:18px">'+
       '<div class="tile" style="--c:var(--ok)"><b>'+ok+'</b><span>נכון לבד</span></div>'+
       '<div class="tile" style="--c:var(--c-alg)"><b>'+hp+'</b><span>עם פתרון מודרך</span></div>'+
       '<div class="tile" style="--c:var(--bad)"><b>'+no+'</b><span>לא נפתרו</span></div>'+
       '<div class="tile" style="--c:var(--c-geo)"><b>'+pct+'%</b><span>דיוק</span></div>'+
     '</div>';
  h+='<hr class="sep"><div class="h2">לפי נושא</div><div class="grid" style="margin-top:10px">'+
     Object.keys(byTopic).map(function(id){
       var b=byTopic[id],tp=topicById(id);
       return '<div class="spread '+topicCls(id)+'" style="gap:8px"><span class="arh">'+tp.name+'</span>'+
         '<span class="chip '+(b.ok===b.n?"ok":b.ok===0?"bad":"warn")+'">'+b.ok+' מתוך '+b.n+'</span></div>';
     }).join("")+'</div>';
  if(worst&&byTopic[worst].ok<byTopic[worst].n){
    var wt=topicById(worst);
    h+='<div class="card pad" style="margin-top:16px;background:var(--surface2)">'+
       '<div class="row">'+ic("target",17)+'<b>מה לקחת מכאן</b></div>'+
       '<p class="sub sm">'+wt.name+' היה הנושא שהכי הפריע בסבב הזה. סבב ממוקד אחד בו יעשה יותר מעוד עשר שאלות מעורבות.</p>'+
       '<button class="btn btn-p" style="margin-top:10px" data-a="starttopic" data-t="'+worst+'">'+ic("pencil",16)+' סבב ממוקד ב'+wt.name+'</button></div>';
  }
  h+='<div class="row" style="margin-top:18px">'+
     '<button class="btn btn-p" data-a="start">'+ic("refresh",17)+' סבב נוסף</button>'+
     '<button class="btn btn-g" data-a="go" data-v="home">'+ic("home",17)+' לדף הבית</button>'+
     '<button class="btn btn-g" data-a="go" data-v="progress">'+ic("chart",17)+' להתקדמות</button></div>';
  return h+'</div></main>';
}

}

/* ---------- התקדמות ---------- */
function viewProgress(){
  var st=state.stats;
  var acc=st.answered?Math.round(st.correct/st.answered*100):0;
  var days=[],i,d=new Date();
  for(i=13;i>=0;i--){
    var dd=new Date(d.getTime()-i*86400000);
    var key=dd.getFullYear()+"-"+String(dd.getMonth()+1).padStart(2,"0")+"-"+String(dd.getDate()).padStart(2,"0");
    days.push({k:key,r:state.days[key]||{a:0,c:0},lbl:({ar:"حنثرخجس",ru:"ВПВСЧПС",en:"SMTWTFS"}[LG]||"אבגדהוש").charAt(dd.getDay())});
  }
  var maxA=Math.max.apply(null,days.map(function(x){return x.r.a}).concat([1]));
  var seen=TOPICS.filter(function(t){return mastery(t.id).seen>0});
  var h='<main id="main" class="wrap" style="padding-top:22px;padding-bottom:44px">';
  h+='<h1 class="h1">התקדמות</h1><p class="sub">המספרים כאן הם כלי עבודה, לא ציון.</p>';
  h+='<div class="grid g4" style="margin-top:16px">'+
     '<div class="tile" style="--c:var(--c-base)"><b>'+st.answered+'</b><span>שאלות שנפתרו</span></div>'+
     '<div class="tile" style="--c:var(--ok)"><b>'+acc+'%</b><span>דיוק כולל</span></div>'+
     '<div class="tile" style="--c:var(--c-alg)"><b>'+st.helped+'</b><span>עם פתרון מודרך</span></div>'+
     '<div class="tile" style="--c:var(--c-geo)"><b>'+st.xp+'</b><span>נקודות</span></div></div>';
  h+='<div class="card pad" style="margin-top:16px"><div class="h2">שבועיים אחרונים</div>'+
     '<div style="display:flex;gap:5px;align-items:flex-end;height:120px;margin-top:14px;direction:ltr">'+
     days.map(function(x){
       var hh=Math.round(x.r.a/maxA*88);
       return '<div style="flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%">'+
         '<i style="display:block;width:100%;border-radius:5px 5px 0 0;background:'+(x.r.a?"linear-gradient(180deg,var(--c-alg),var(--c-data))":"var(--surface2)")+';height:'+Math.max(hh,4)+'px" title="'+x.r.a+' שאלות"></i>'+
         '<span class="xs faint">'+x.lbl+'</span></div>';
     }).join("")+'</div></div>';
  h+='<div class="card pad" style="margin-top:16px"><div class="h2">שליטה לפי נושא</div>';
  if(!seen.length)h+='<p class="sub sm">עוד לא תרגלתם נושאים. אחרי הסבב הראשון תופיע כאן תמונה.</p>';
  else h+='<div class="grid" style="margin-top:12px;gap:11px">'+seen.sort(function(a,b){return mastery(a.id).m-mastery(b.id).m}).map(function(tp){
    var m=mastery(tp.id);
    return '<div class="'+areaCls(tp.area)+'"><div class="spread" style="gap:8px"><span class="arh" style="font-weight:600">'+tp.name+'</span>'+
      '<span class="xs faint">'+m.ok+' מתוך '+m.seen+(m.help?" · "+m.help+" עם עזרה":"")+'</span></div>'+
      '<div class="bar '+barCls(m)+'" style="margin-top:5px"><i style="width:'+m.m+'%"></i></div></div>';
  }).join("")+'</div>';
  h+='</div>';
  return h+'</main>';
}

var TR_ATTRS=/(placeholder|aria-label|title|alt)="([^"]*)"/g;
/* שאלה נבנית בזמן ריצה משברי משפט ומספרים אקראיים: "מהו שטח משולש
   שהניצבים שלו " + 5 + " ס\"מ ו-" + 8 + " ס\"מ?". המשפט המורכב אינו
   יכול להיות מפתח במילון — יש אינסוף כאלה. לכן, כשאין התאמה
   למשפט השלם, הוא נחתך על המספרים ומתורגם שבר־שבר: השברים הם
   בדיוק המחרוזות שכתובות בקוד, ולכן הם כן מפתחות. */
/* המקף ב"ו-8" הוא כלל כתיב עברי — תחילית בת אות אחת נצמדת למספר
   במקף. בערבית אין לו מקבילה. הביטוי הרגולרי למטה בולע את המקף
   יחד עם המספר ופולט אותו כמות שהוא, ולכן «و-8» — מקף לפני ספרה,
   במרחק אות אחת מהמינוס הטיפוגרפי שהאפליקציה משתמשת בו.
   מה שבא לפניו מכריע: תחילית שנצמדת — אות יחידה כמו «و», או כזו
   שנכתבה במילון עם תטויל כמו «الـ» ו-«بـ», שהתטויל בה נועד בדיוק
   לסמן שהיא נדבקת להמשך — נדבקת למספר. מילה שלמה כמו «على» מקבלת
   רווח. */
function arJoinNum(s){
  return s.replace(/([\u0600-\u06FF]+)-(?=\d)/g,function(m,w){
    return (/\u0640$/.test(w)||w.length===1) ? w : w+" ";
  });
}
function trParts(t,d){
  if(!/\d/.test(t))return null;
  var out="",last=0,hit=false,m;
  var re=/-?\d+(?:[.,]\d+)?%?/g;
  while((m=re.exec(t))){
    var seg=t.slice(last,m.index);
    out+=trSeg(seg,d,function(){hit=true});
    /* המקף ב"ו-3" או ב"ה-10" הוא מקף עברי שמחבר תחילית למספר,
       ולא סימן מינוס. המפצל בולע אותו כחלק מהמספר, ובערבית הוא
       יוצא "و-3" — כלומר מינוס שלוש. כשהתו שלפניו הוא אות עברית
       הוא שייך לכתיב העברי בלבד, ונשמט מהשפה האחרת. */
    var num=m[0];
    if(num.charAt(0)==="-"&&/[א-ת]/.test(t.charAt(m.index-1)))num=num.slice(1);
    out+=num; last=m.index+m[0].length;
  }
  out+=trSeg(t.slice(last),d,function(){hit=true});
  return hit?arJoinNum(out):null;
}
/* הרווחים שמסביב נשמרים, אבל הגרעין מוחלף במלואו. קודם עמד כאן
   seg.replace(core,v) — ו-core הוא הגרסה המנורמלת של seg. במחרוזת
   שיש בה רצף רווחים ("a : b   ·   חלוקה") core אינו תת־מחרוזת של
   seg כלל, replace לא מצא דבר, והשורה נשארה עברית מתחת לממשק ערבי
   בלי שאיש ידווח על מפתח חסר — התרגום היה קיים ופשוט לא הוצב. */
function trSeg(seg,d,mark){
  var core=seg.replace(/\s+/g," ").trim();
  if(!core||!/[֐-׿]/.test(core))return seg;
  var v=d[core];
  if(v===undefined){ trSeen(core); return seg }
  mark();
  return seg.match(/^\s*/)[0]+v+seg.match(/\s*$/)[0];
}
function trHTML(h){
  if(LG==="he")return h;
  var d=TR[LG]; if(!d)return h;
  h=String(h).replace(/>([^<>]+)</g,function(m,t){
    var core=t.replace(/\s+/g," ").trim();
    if(!core||!/[֐-׿]/.test(core))return m;
    var v=d[core];
    if(v!==undefined)return ">"+t.match(/^\s*/)[0]+v+t.match(/\s*$/)[0]+"<";
    var pieces=trParts(t,d);
    if(pieces!==null)return ">"+pieces+"<";
    trSeen(core); return m;
  });
  h=h.replace(TR_ATTRS,function(m,a,t){
    var core=t.replace(/\s+/g," ").trim();
    if(!core||!/[֐-׿]/.test(core))return m;
    var v=d[core];
    if(v!==undefined)return a+'="'+v+'"';
    /* גם כאן צריך את הפיצול על מספרים: aria-label בנוי בדיוק כמו
       הטקסט הנראה, ובלי זה תווית לקורא מסך נשארה עברית מתחת
       לממשק ערבי — בדיוק אצל מי שתלוי בה. */
    var pieces=trParts(t,d);
    if(pieces!==null)return a+'="'+pieces.replace(/"/g,"&quot;")+'"';
    trSeen(core); return m;
  });
  return h;
}

/* טקסט ההקראה של שאלה — מקור אחד לתרגול ולמבחן. עד כאן המבחן
   הקריא את q.say, שהוא הניסוח והביטוי בלבד, והתלמיד לא שמע את
   ארבע האפשרויות. האפשרויות נקראות מ-q.options בסדר שבו הן
   מוצגות על המסך.
   הטקסט נשמר בעברית ומתורגם בתצוגה, ולכן ההקראה מתרגמת בעצמה
   כל חלק לפני שהיא מרכיבה את המשפט. speakProse כבר קורא ל-_(). */
function questionSay(q){
  if(!q)return "";
  var body=q.expr;
  if(body&&body.indexOf("<br>")>=0){
    var eqs=body.split("<br>");
    body=eqs.map(function(e,i){return _(i===0?"משוואה ראשונה: ":"משוואה שנייה: ")+speakMath(plainOf(e))}).join(". ");
  }else body=body?speakMath(plainOf(body)):"";
  return speakProse(q.ask)+". "+body+
    ". "+_("האפשרויות:")+" "+(q.options||[]).map(function(o,i){
      return _("אפשרות")+" "+(i+1)+". "+speakMath(_(o.t))}).join(", ");
}
function readQuestion(){
  if(!P.q)return;
  speak(questionSay(P.q));
}
function readSteps(){
  if(!P.q)return;
  var shown=P.phase==="reveal"?P.q.steps.length:Math.min(P.steps,P.q.steps.length);
  var txt=P.q.steps.slice(0,shown).map(function(s){
    return _(s.t)+". "+speakProse(s.d||"")+" "+(s.m?speakMath(_(plainOf(s.m))):"");
  }).join(". ");
  speak(txt);
}
function onAnswer(i){
  if(P.phase!=="ask"||!P.q)return;
  if(P.picked.indexOf(i)>=0)return;
  var o=P.q.options[i];
  P.picked.push(i);
  if(o.ok){
    P.lastWhy="";
    P.phase="reveal";
    scoreAnswer(true);
    announce(_("נכון"));
    if(state.settings.tts)speak(lineFor(P.results[P.results.length-1]));
  }else{
    P.lastWhy=o.why||"התשובה הזו לא נכונה. שווה לפתוח את הפתרון המודרך ולראות איפה הדרך מתפצלת.";
    announce(_f("לא נכון. {0}",_(P.lastWhy)));
    /* speakProse קורא ל-_() בתוכו, ולכן לא עוטפים אותו שוב. */
    if(state.settings.tts)speak(speakProse(P.lastWhy));
    /* אם נגמרו האפשרויות — עוברים לחשיפה ולא משאירים תקועים */
    if(P.picked.length>=P.q.options.length-1){
      P.phase="reveal";
      scoreAnswer(false);
    }
  }
  render();
}
function advance(){
  P.i++;
  P.lastWhy="";
  if(roundDone()){P.phase="done";state.stats.rounds++;save();render();return}
  loadQ();
  window.scrollTo(0,0);
  render();
}
var VOICE_SAMPLE_HE="פותרים את המשוואה: שלוש איקס ועוד חמש שווה עשרים. מעבירים את החמש לצד השני, ומחלקים בשלוש.";
var VOICE_SAMPLE_AR="نحلّ المعادلة: ثلاثة إكس زائد خمسة يساوي عشرين. ننقل الخمسة إلى الطرف الآخر، ونقسم على ثلاثة.";
var VOICE_SAMPLE_RU="Решаем уравнение: три икс плюс пять равно двадцати. Переносим пять в другую часть и делим на три.";
var VOICE_SAMPLE_EN="Solving the equation: three x plus five equals twenty. Move the five to the other side, and divide by three.";
/* משפט הדגמה בשפת הממשק. משפט עברי בקול ערבי אינו בדיקה של כלום. */
Object.defineProperty(window,"VOICE_SAMPLE",{get:function(){
  return {ar:VOICE_SAMPLE_AR,ru:VOICE_SAMPLE_RU,en:VOICE_SAMPLE_EN}[LG]||VOICE_SAMPLE_HE}});
function onAction(a,el){
  var s=state.settings;
  if(examAction(a,el))return;
  if(a==="go"){goto(el.getAttribute("data-v"));return}
  if(a==="lvl"){state.level=parseInt(el.getAttribute("data-l"),10);save();if(view==="practice"&&P.phase==="ask")loadQ();render();return}
  if(a==="track"){state.track=parseInt(el.getAttribute("data-t"),10);
    state.topics=state.topics.filter(function(id){var t=topicById(id);return t&&t.tracks.indexOf(state.track)>=0});
    save();render();return}
  if(a==="start"){startRound();view="practice";window.scrollTo(0,0);render();return}
  if(a==="starttopic"){var tid=el.getAttribute("data-t");startRound(tid);view="practice";window.scrollTo(0,0);render();return}
  if(a==="ans"){onAnswer(parseInt(el.getAttribute("data-i"),10));return}
  if(a==="next"){advance();return}
  if(a==="stop"){
    if(P.results.length===0){goto("home");return}
    P.list=P.list.slice(0,P.results.length);P.phase="done";save();window.scrollTo(0,0);render();return}
  if(a==="hint"){
    P.hints=1;render();
    if(s.tts&&P.q.hint){
      /* אותה מחרוזת בדיוק להקראה ולהדגשה: hlPrep ממפה תווים לפי
         מה שנאמר, ורמז שיש בו סימן (→, %) נאמר אחרת ממה שכתוב —
         מיפוי לפי הכתוב היה מדגיש את המילה הלא נכונה. כשהשתיים
         אינן זהות hlPrep מדגיש את הרמז כולו, וזה נכון. */
      var hsay=speakProse(P.q.hint);
      speak(hsay);
      /* אחרי speak — הוא קורא ל-stopSpeak שמנקה הדגשה קודמת. */
      hlPrep(document.querySelector(".hintxt"),hsay);
    }
    return;
  }
  if(a==="guide"){
    P.steps=1;P.usedHelp=true;
    render();if(s.tts)readSteps();return}
  if(a==="nextstep"){
    P.steps++;P.usedHelp=true;
    if(P.steps>=P.q.steps.length&&P.phase==="ask"){P.phase="reveal";scoreAnswer(false)}
    render();
    if(s.tts&&P.q.steps[P.steps-1]){
      var st=P.q.steps[P.steps-1];
      speak(_(st.t)+". "+speakProse(st.d||"")+" "+(st.m?speakMath(_(plainOf(st.m))):""));
    }
    return}
  if(a==="read"){readQuestion();return}
  if(a==="hush"){stopSpeak();render();return}
  if(a==="readsteps"){readSteps();return}
  if(a==="rule"){fq="";view="formulas";pendingScroll="f-"+el.getAttribute("data-r");window.scrollTo(0,0);render();return}
  if(a==="tog"){var k=el.getAttribute("data-k");s[k]=!s[k];save();applyModes();render();return}
  if(a==="lang"){
    var lg=el.getAttribute("data-n");
    if(LANGS[lg]&&lg!==state.settings.lang){
      state.settings.lang=lg; save(); applyModes(); stopSpeak();
      /* שאלה נבנית פעם אחת, וכל הטקסט שלה נקבע בשפה שהייתה פעילה
         אז. החלפת שפה באמצע שאלה הייתה משאירה מסך חצי מתורגם. */
      try{ if(P.q&&!roundDone()){P.lastWhy="";loadQ()} }catch(e){}
      render(); window.scrollTo(0,0);
    }
    return;
  }
  if(a==="ts"){s.ts=parseInt(el.getAttribute("data-n"),10);save();applyModes();render();return}
  if(a==="theme"){s.theme=el.getAttribute("data-n");save();applyModes();render();return}
  if(a==="rlen"){s.roundLen=parseInt(el.getAttribute("data-n"),10);save();render();return}
  if(a==="voice"){s.voice=el.getAttribute("data-u");save();render();speak(VOICE_SAMPLE);return}
  if(a==="vcheck"){voiceCheck();return}
  if(a==="test"){speak(VOICE_SAMPLE);return}
  if(a==="pick"){
    var id=el.getAttribute("data-t"),ix=state.topics.indexOf(id);
    if(ix>=0)state.topics.splice(ix,1);else state.topics.push(id);
    save();render();return}
  if(a==="selall"){state.topics=topicsForTrack(state.track).map(function(t){return t.id});save();render();return}
  if(a==="selnone"){state.topics=[];save();render();return}
  if(a==="fclear"){fq="";render();return}
  if(a==="obnext"){
    P.obStep=(P.obStep||1)+1;
    if(P.obStep>3){state.onboarded=true;save();applyModes();view="home";window.scrollTo(0,0)}
    save();render();return}
  if(a==="obback"){P.obStep=Math.max(1,(P.obStep||1)-1);render();return}
  if(a==="reset"){
    if(!P.confirmReset){P.confirmReset=true;el.textContent=_("לוחצים שוב כדי למחוק סופית");return}
    try{localStorage.removeItem(KEY)}catch(e){}
    state=blankState();P=({list:[],i:0,q:null,phase:"ask",picked:[],hints:0,steps:0,usedHelp:false,results:[]});
    applyModes();view="home";render();return}
}

/* ============================================================
   18. מבחן כיתתי — פרסום בוואטסאפ, קבלת תשובות וציונים
   ------------------------------------------------------------
   אין שרת, ואין כוונה שיהיה. לכן המבחן אינו נשלח לשום מקום:
   הוא *נארז לתוך הקישור*. המורה מקבל קישור, שולח אותו בוואטסאפ,
   והמכשיר של התלמיד בונה מהקישור בדיוק את אותן שאלות.

   מה שהופך את זה לאפשרי הוא שכל מחולל שאלות כאן משתמש ב-
   Math.random בלבד. אם מזרעים אותו, אותו זרע מייצר את אותן
   שאלות ואת אותו סדר תשובות — אצל המורה ואצל התלמיד. הקישור
   נושא זרע ורשימת נושאים, לא עשרים שאלות מלאות, ולכן הוא נשאר
   קצר מספיק לוואטסאפ.

   שלוש מגבלות שנאמרות כאן במפורש כי הן חלק מהתכנון:
   · אין איסוף אוטומטי. התלמיד שולח קוד תשובות בוואטסאפ, והמורה
     מדביק אותו. זה המחיר של אפס שרת ואפס עלות.
   · אפשר לזייף קוד. הציון מחושב מחדש אצל המורה מתוך התשובות
     ולא נלקח מהתלמיד, אבל אין כאן הגנה קריפטוגרפית — זה מבחן
     כיתתי מעצב, לא בגרות.
   · שמות התלמידים נשארים במכשיר של המורה. הם לא עוברים דרך
     שום שרת, כי אין שרת.
   ============================================================ */
var GENV=5;                 /* גרסת המחוללים. מבחן שנוצר בגרסה אחרת
                               אינו נפתח — עדיף הודעה ברורה מאשר
                               עשרים שאלות אחרות בשקט. */
var EKEY="shlav-exams-math-teen-v1";   /* מפתח לאפליקציה הזאת בלבד */
var EKEY_OLD="shlav-exams-v1";  /* המפתח המשותף הישן. לקריאה בלבד, לא נמחק. */

/* --- מחולל מזורע. mulberry32: קצר, מהיר, ופיזור טוב דיו --- */
function withSeed(seed,fn){
  var real=Math.random,s=(seed>>>0)||1;
  Math.random=function(){
    s|=0; s=s+0x6D2B79F5|0;
    var t=Math.imul(s^s>>>15,1|s);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
  try{return fn()}finally{Math.random=real}
}
function hash32(str){
  var h=0x811c9dc5,i;
  for(i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193)}
  return (h>>>0);
}
/* base64url. הניקוי בפענוח אינו קוסמטי: וואטסאפ שובר מחרוזות
   ארוכות בשורות, ורווח אחד הורס את כל הקוד. */
function b64e(str){
  var bytes=new TextEncoder().encode(str),bin="",i;
  for(i=0;i<bytes.length;i+=8192)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));
  return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function b64d(s){
  s=String(s||"").replace(/[^A-Za-z0-9\-_]/g,"").replace(/-/g,"+").replace(/_/g,"/");
  while(s.length%4)s+="=";
  var bin=atob(s),bytes=new Uint8Array(bin.length),i;
  for(i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
/* הזרע של המשבצת נכנס למזהה: שני מבחנים באותם נושאים ובאותה
   רמה, שהמורה החליף באחד מהם שאלה, אינם אותו מבחן. מבחן ישן
   שאין לו זרעים מקבל בדיוק את המזהה שקיבל תמיד — אחרת ההגשות
   שכבר נקלטו אליו מתייתמות. */
function examId(spec){return hash32(spec.s+"|"+spec.q.map(function(x){
  return x[0]+x[1]+(x.length>2?"@"+x[2]:"")}).join(",")).toString(36)}
function encodeExam(spec){return b64e(JSON.stringify(spec))}
function decodeExam(code){
  try{
    var o=JSON.parse(b64d(code));
    if(!o||!o.q||!o.q.length||typeof o.s!=="number")return null;
    o.q=o.q.filter(function(x){return topicById(x[0])});
    return o.q.length?o:null;
  }catch(e){return null}
}
/* בונה את שאלות המבחן. אותו זרע → אותן שאלות, גם אצל המורה
   כשהוא בודק וגם אצל התלמיד כשהוא נבחן. */
function examQuestions(spec){
  /* מסננים נושאים שאינם מוכרים לאפליקציה הזאת, בדיוק כמו decodeExam.
     בלי הסינון buildQ מחזיר null על נושא זר, והמסך נופל על
     q.topic של null. עדיף לדלג בשקט מאשר להתרסק. */
  var pairs=(spec.q||[]).filter(function(x){return !!topicById(x[0])});
  /* מבחן שנבנה עם זרע לכל משבצת נבנה משבצת אחרי משבצת, וכל
     שאלה תלויה בזרע שלה בלבד — כך המורה יכול להחליף אחת מהן.
     מבחן ישן, בלי זרעים, חייב להיבנות בדיוק כפי שנבנה ביום
     שנשלח: אחרת הציון של מי שכבר נבחן משתנה למפרע. */
  if(pairs.length&&pairs.every(function(x){return typeof x[2]==="number"}))
    return pairs.map(function(p){return exBuildSlot(p)})
                .filter(function(q){return !!q});
  return withSeed(spec.s,function(){
    return pairs.map(function(pair){return buildQ(pair[0],pair[1])})
                .filter(function(q){return !!q});
  });
}
/* --- בחירת השאלות בידי המורה ---------------------------------
   עד כאן המורה בחר נושאים, רמה ומספר שאלות — והשאלות עצמן הוגרלו
   מאחורי גבו. הוא ראה אותן לראשונה רק אחרי שהמבחן כבר היה אצל
   התלמידים. מעכשיו כל שאלה היא משבצת נפרדת עם זרע משלה: המורה
   רואה אותה לפני השליחה, מחליף אותה בשאלה אחרת מאותו נושא,
   מסיר אותה, או מוסיף שאלה מנושא שחסר לו.

   הזרע הנפרד לכל משבצת הוא מה שמאפשר את זה. בזרם אקראי אחד
   ומשותף, כפי שהיה עד כאן, החלפה של השאלה השלישית הייתה משנה
   גם את הרביעית ואת החמישית — כלומר לא "החלפה" אלא הגרלה מחדש
   של כל מה שאחריה.

   24 ביט ולא 32: הזרע נוסע בתוך הקישור שנשלח בוואטסאפ, וזרע
   קצר יותר הוא קישור קצר יותר. שישה־עשר מיליון אפשרויות למשבצת
   הן הרבה מעבר למה שהמחולל עצמו יודע לייצר. */
function exNewSeed(){return (Math.random()*16777215)>>>0}
function exSlot(topicId,level){return [topicId,level,exNewSeed()]}
/* אותו זרע → אותה שאלה בדיוק: אצל המורה כשהוא בוחר, ואצל
   התלמיד כשהוא נבחן. */
function exBuildSlot(slot){
  if(!slot||!topicById(slot[0]))return null;
  return withSeed(slot[2],function(){return buildQ(slot[0],slot[1])})||null;
}
/* מסך הבנייה מצייר את עצמו מחדש אחרי כל לחיצה, ובניית עשרים
   וחמש שאלות בכל ציור מיותרת. המטמון הוא לתצוגה בלבד — מי
   שנבחן בונה את שאלותיו מחדש, כדי שאיש לא יערוך בטעות אובייקט
   שגם מסך אחר מחזיק בו. */
var EXQCACHE={};
/* לכל אפליקציה מנגנון שפה משלה, ולא לכולן אותם שמות. הפנייה
   דרך window ולא בשם ישיר, כי שם שאינו קיים באפליקציה מסוימת
   הוא שגיאה בעיני הבודקים — רעש שמסתיר שגיאה אמיתית. */
function exLangKey(){
  try{
    var g=(typeof window!=="undefined")?window:{};
    if(typeof g.xlg==="function")return g.xlg();
    if(typeof g.LG==="string")return g.LG;
    return (state&&state.settings&&state.settings.lang)||"he";
  }catch(e){return "he"}
}
function exPreviewQ(slot){
  if(!slot)return null;
  var k=slot[0]+"|"+slot[1]+"|"+slot[2]+"|"+exLangKey();
  if(!(k in EXQCACHE)){
    /* מורה שמחליף שאלות שוב ושוב מייצר מפתח חדש בכל לחיצה.
       מטמון שרק גדל הוא דליפה; מרוקנים אותו ומתחילים מחדש. */
    if(Object.keys(EXQCACHE).length>400)EXQCACHE={};
    EXQCACHE[k]=exBuildSlot(slot);
  }
  return EXQCACHE[k];
}
function exTopicName(id){
  var t=topicById(id); if(!t)return "";
  var g=(typeof window!=="undefined")?window:{};
  return (typeof g.tName==="function"?g.tName(t):t.name)||"";
}
function exRightAnswer(q){
  var i; if(!q||!q.options)return null;
  for(i=0;i<q.options.length;i++)if(q.options[i].ok)return q.options[i];
  return null;
}
/* המשבצות שהמורה עורך. נבנות מחדש רק כשנושא, רמה או מספר
   השאלות משתנים; עריכה של משבצת בודדת נשמרת. */
function exSlots(){
  if(EB.q&&EB.q.length)return EB.q;
  var tops=EB.topics.filter(function(x){return topicById(x)});
  if(!tops.length)tops=topicsForTrack(state.track).slice(0,3).map(function(t){return t.id});
  var q=[],i;
  for(i=0;i<EB.n;i++)q.push(exSlot(tops[i%tops.length],EB.level));
  /* מערבבים כאן ולא בשליחה: המורה רואה את הסדר הסופי ומאשר אותו. */
  EB.q=shuffle(q);
  return EB.q;
}
function examUrl(spec){
  var base=location.origin+location.pathname;
  return base+"#x="+encodeExam(spec);
}
/* wa.me מקבל רק מספר בינלאומי בלי אפס מוביל. מורה שהקליד 050-8554380
   כמו שמקלידים בטלפון קיבל אצל התלמיד "לא ניתן לבדוק את מספר הטלפון…
   חסרה קידומת חיוג", והתשובות לא נשלחו. אפס מוביל הוא מספר ישראלי
   מקומי ומקבל 972; "00" בהתחלה הוא קידומת בינלאומית ונופל; מספר
   שכבר מתחיל בקידומת מדינה נשאר כפי שהוא. */
function waLink(text,phone){
  var p=String(phone||"").replace(/[^0-9]/g,"");
  if(p.indexOf("00")===0)p=p.slice(2);
  else if(p.charAt(0)==="0")p="972"+p.slice(1);
  return "https://wa.me/"+p+"?text="+encodeURIComponent(text);
}

/* --- אחסון מבחנים והגשות, בנפרד מהתקדמות התלמיד --- */
var EX={list:[]};
/* --- הגירה מהמפתח המשותף הישן ---------------------------------
   עד הגרסה הזאת כל האפליקציות כתבו מבחנים לאותו מפתח localStorage
   ובאותו origin, ולכן מבחן שנבנה במתמטיקה הופיע ברשימת המבחנים של
   אנגלית והפיל את המסך. מעכשיו לכל אפליקציה מפתח משלה, ובטעינה
   מועתקות מהמפתח הישן רק רשומות שכל נושאיהן מוכרים כאן.
   המפתח הישן נשאר על כנו ואינו נמחק, כדי שגם אפליקציה אחרת תוכל
   לקלוט ממנו את המבחנים ששייכים לה. --------------------------- */
function exSpecKnown(spec){
  if(!spec||!spec.q||!spec.q.length)return false;
  for(var i=0;i<spec.q.length;i++){
    var pair=spec.q[i];
    if(!pair||!topicById(pair[0]))return false;
  }
  return true;
}
function exAdoptLegacy(){
  var added=0;
  try{
    var raw=localStorage.getItem(EKEY_OLD); if(!raw)return;
    var old=JSON.parse(raw); if(!old||!old.list||!old.list.length)return;
    var have={},i,ex;
    for(i=0;i<EX.list.length;i++)have[EX.list[i].id]=1;
    for(i=0;i<old.list.length;i++){
      ex=old.list[i];
      if(!ex||!ex.id||have[ex.id])continue;
      if(!exSpecKnown(ex.spec))continue;
      EX.list.push(ex); have[ex.id]=1; added++;
    }
  }catch(e){return}
  if(added)exSave();
}
function exLoad(){
  try{var r=localStorage.getItem(EKEY);if(r){var o=JSON.parse(r);if(o&&o.list)EX=o}}catch(e){}
  if(!EX.list)EX.list=[];
  exAdoptLegacy();
}
function exSave(){try{localStorage.setItem(EKEY,JSON.stringify(EX))}catch(e){}}
function exFind(id){for(var i=0;i<EX.list.length;i++)if(EX.list[i].id===id)return EX.list[i];return null}

/* --- קוד ההגשה של התלמיד --- */
function encodeResult(id,name,answers){
  var body={i:id,n:String(name||"").slice(0,40),a:answers,d:todayIso()};
  body.c=hash32(JSON.stringify([body.i,body.n,body.a])).toString(36);
  return b64e(JSON.stringify(body));
}
function decodeResult(code){
  try{
    var o=JSON.parse(b64d(code));
    if(!o||!o.i||!o.a||!o.a.length)return null;
    o.ok=(o.c===hash32(JSON.stringify([o.i,o.n,o.a])).toString(36));
    return o;
  }catch(e){return null}
}
/* הציון מחושב כאן מחדש מתוך התשובות. מה שהתלמיד שלח הוא מה
   שסימן, לא כמה הוא קיבל. */
function gradeResult(spec,res){
  var qs=examQuestions(spec),per=[],ok=0,i,q,a;
  for(i=0;i<qs.length;i++){
    q=qs[i]; a=res.a[i];
    var right=(a>=0&&q.options[a]&&q.options[a].ok)?1:0;
    if(right)ok++;
    per.push({topic:q.topic,topicName:q.topicName,ok:right,
              picked:(a>=0&&q.options[a])?q.options[a].t:"—",
              answer:(q.options.filter(function(o){return o.ok})[0]||{}).t||""});
  }
  return {ok:ok,n:qs.length,pct:Math.round(100*ok/qs.length),per:per};
}

/* גיבוב חלש כגיבוי בלבד. SubtleCrypto קיים בכל דפדפן מודרני

        var a=Array.prototype.slice.call(new Uint8Array(d));
        cb(a.map(function(b){return ("0"+b.toString(16)).slice(-2)}).join(""));

  return left>0?left:0;

  var pin=(document.getElementById("te-pin")||{}).value||"";
  var rem=!!(document.getElementById("te-rem")||{}).checked;

(function(){

function marksCsv(ex){

            "תאריך","קוד תקין"];
  for(i=0;i<n;i++)head.push(("שאלה "+(i+1)));
  var rows=[csvRow(head)];
  subs.forEach(function(s){
    var r=[s.name||_("ללא שם"),s.pct,s.ok,s.n,s.date||"",
           s.valid?"כן":"לא"];
    for(i=0;i<n;i++){

/* כרום מוחק את שם הקובץ כולו ברגע שיש בו תו אחד שאינו ASCII —

   סיומת, ואקסל לא יודע לפתוח אותו. מורה שקרא למבחן שלו בעברית
   קיבל קובץ בלי שם ובלי סוג. לכן השם מתועתק ללטינית. */
var TRLIT={
  "א":"a","ב":"b","ג":"g","ד":"d","ה":"h","ו":"v","ז":"z","ח":"ch","ט":"t","י":"y",
  "כ":"k","ך":"k","ל":"l","מ":"m","ם":"m","נ":"n","ן":"n","ס":"s","ע":"","פ":"f",
  "ף":"f","צ":"tz","ץ":"tz","ק":"k","ר":"r","ש":"sh","ת":"t",
  "ا":"a","ب":"b","ت":"t","ث":"th","ج":"j","ح":"h","خ":"kh","د":"d","ذ":"dh","ر":"r",
  "ز":"z","س":"s","ش":"sh","ص":"s","ض":"d","ط":"t","ظ":"z","ع":"","غ":"gh","ف":"f",
  "ق":"q","ك":"k","ل":"l","م":"m","ن":"n","ه":"h","و":"w","ي":"y","ة":"h","ى":"a","ء":"",
  "أ":"a","إ":"i","آ":"a","ؤ":"w","ئ":"y",
  "а":"a","б":"b","в":"v","г":"g","д":"d","е":"e","ё":"e","ж":"zh","з":"z","и":"i",
  "й":"y","к":"k","л":"l","м":"m","н":"n","о":"o","п":"p","р":"r","с":"s","т":"t",
  "у":"u","ф":"f","х":"kh","ц":"ts","ч":"ch","ш":"sh","щ":"sch","ъ":"","ы":"y","ь":"",
  "э":"e","ю":"yu","я":"ya"
};
function asciiName(s){
  var i,c,out="";
  /* é ו-ü הם אות לטינית ועוד סימן מצורף. פירוק והסרת הסימן משאיר e ו-u. */
  try{ s=s.normalize("NFD").replace(/[\u0300-\u036f]/g,"") }catch(e){}
  for(i=0;i<s.length;i++){
    c=s.charAt(i);
    if(/[A-Za-z0-9]/.test(c)){ out+=c; continue }
    var lower=c.toLowerCase();
    if(TRLIT[lower]!==undefined){ out+=TRLIT[lower]; continue }
    out+=" ";                     /* כל השאר — רווח, שיתכווץ בהמשך */
  }
  return out.replace(/\s+/g," ").trim();
}

  if(!SIT.id)return;
  try{localStorage.setItem(sitKey(),JSON.stringify({
    n:SIT.name,a:SIT.answers,f:SIT.flags,t:SIT.t0,i:SIT.i,p:SIT.phase}))}catch(e){}
}
function sitKeyOld(){return EKEY_OLD+"-run-"+SIT.id}
function sitDrop(){try{localStorage.removeItem(sitKey());localStorage.removeItem(sitKeyOld())}catch(e){}}
function sitRestore(){
  if(!SIT.id)return false;
  try{
    /* מבחן שהתחיל לפני פיצול המפתחות נשמר תחת המפתח הישן. */
    var o=JSON.parse(localStorage.getItem(sitKey())||localStorage.getItem(sitKeyOld())||"null");
    if(!o||!o.a||!o.a.length)return false;
    SIT.qs=examQuestions(SIT.spec);
    if(o.a.length!==SIT.qs.length)return false;   /* מבחן אחר תחת אותו מזהה */
    SIT.name=o.n||""; SIT.answers=o.a;
    SIT.flags=o.f&&o.f.length===o.a.length?o.f:SIT.qs.map(function(){return false});
    SIT.t0=o.t||0; SIT.i=Math.min(Math.max(0,o.i|0),SIT.qs.length-1);
    SIT.phase=o.p==="done"?"done":"ask";
    if(SIT.phase==="done")SIT.code=encodeResult(SIT.id,SIT.name,SIT.answers);
    return true;
  }catch(e){return false}
}
/* שניות שנותרו, או null כשלא הוגדרה הגבלת זמן */
function sitLeft(){
  var m=SIT.spec&&SIT.spec.m;
  if(!m||!SIT.t0)return null;
  return Math.max(0,Math.round((SIT.t0+m*60000-Date.now())/1000));
}
function sitClock(){
  var l=sitLeft(); if(l===null)return "";
  var mm=Math.floor(l/60),ss=l%60;
  return mm+":"+(ss<10?"0":"")+ss;
}
/* הזמן נגמר — מגישים. לא מבקשים אישור: אישור שאיש לא לוחץ עליו
   פירושו מבחן שנשאר פתוח לנצח. */
function sitTimerOn(){
  sitTimerOff();
  if(sitLeft()===null)return;
  SIT.tick=setInterval(function(){
    if(SIT.phase!=="ask"){sitTimerOff();return}
    if(sitLeft()<=0){sitTimerOff();sitFinish();return}
    var el=$("#sitclock"); if(el)el.textContent=sitClock();
  },1000);
}
function sitTimerOff(){if(SIT.tick){clearInterval(SIT.tick);SIT.tick=null}}

function sitStart(){
  var nm=$("#sitName"); SIT.name=nm?nm.value.trim():"";
  SIT.qs=examQuestions(SIT.spec);
  /* אם לא נותרה אף שאלה שאפשר לבנות (למשל מבחן של אפליקציה אחרת),
     מציגים את מסך המבחן השבור במקום ליפול על שאלה שאינה קיימת. */
  if(!SIT.qs.length){view="badexam"; render(); return}
  SIT.answers=SIT.qs.map(function(){return -1});
  SIT.flags=SIT.qs.map(function(){return false});
  SIT.i=0; SIT.phase="ask"; SIT.t0=Date.now();
  sitSave(); sitTimerOn();
  window.scrollTo(0,0); render();
}
function sitAnswer(i){
  if(SIT.phase!=="ask")return;
  SIT.answers[SIT.i]=i;
  sitSave();
  sitNext();
}
/* סימון לחזרה אינו תשובה ואינו משנה אותה — הוא רק מסמן. */
function sitFlag(){
  if(SIT.phase!=="ask")return;
  SIT.flags[SIT.i]=!SIT.flags[SIT.i];
  sitSave(); render();
}
function sitNext(){
  if(SIT.i+1<SIT.qs.length){SIT.i++;window.scrollTo(0,0);render();return}
  /* לא מגישים בלחיצה על תשובה. לחיצה בטעות על האפשרות האחרונה
     אינה אמורה לסיים מבחן. */
  SIT.phase="review"; stopSpeak(); window.scrollTo(0,0); render();
}
function sitGo(i){
  SIT.i=clamp(i,0,SIT.qs.length-1); SIT.phase="ask";
  window.scrollTo(0,0); render();
}
/* התוצאה נשלחת כקישור ולא כקוד: המורה לוחץ, האפליקציה נפתחת אצלו
   וקולטת. הקוד עצמו יושב אחרי #r=, ולכן גם הדבקה של הקישור השלם
   בתיבת הקוד עובדת — codeOf מחלץ אותו משם. */
function resultUrl(code){return location.origin+location.pathname+"#r="+code}
function codeOf(raw){
  var m=String(raw||"").match(/#r=([A-Za-z0-9\-_]+)/);
  return (m?m[1]:String(raw||"")).trim();
}
function sitFinish(){
  SIT.phase="done";
  sitTimerOff();
  SIT.code=encodeResult(SIT.id,SIT.name,SIT.answers);
  sitSave();
  stopSpeak(); window.scrollTo(0,0); render();
}
function sitGrade(){
  var ok=0,i;
  for(i=0;i<SIT.qs.length;i++){
    var a=SIT.answers[i];
    if(a>=0&&SIT.qs[i].options[a]&&SIT.qs[i].options[a].ok)ok++;
  }
  return {ok:ok,n:SIT.qs.length,pct:Math.round(100*ok/SIT.qs.length)};
}

  h3+='<p class="sub" style="margin-top:16px"><b>עכשיו שולחים את הקוד למורה.</b> '+

  h3+='<div class="row" style="margin-top:12px">'+
      '<a class="btn btn-p" href="'+esc(waLink(msg,sp.p||""))+'" target="_blank" rel="noopener">'+

  if(SIT.copied)h3+='<p class="chip ok" style="margin-top:10px">הקוד הועתק</p>';
  h3+='<p class="sub" style="margin-top:12px;word-break:break-all;direction:ltr;text-align:left;'+
      'background:var(--surface2);border-radius:10px;padding:10px">'+esc(SIT.code)+'</p>';

  if(sp.w!==false){
