 α = מול ÷ ליד":"tan α = المقابل ÷ المجاور","tan הוא הניצב שמול הזווית חלקי הניצב שלידה. הניצב שליד נתון, זה שמול — לא.":"tan هو الضلع المقابل للزاوية مقسومًا على الضلع المجاور لها. المجاور معطى، أمّا المقابل — فلا.","x = הרוחב , האורך = x +":"x = العرض ، الطول = x +","x = מחיר מחברת , y = מחיר עט":"x = سعر دفتر ، y = سعر قلم","אורך מלבן גדול ב":"طول مستطيل أكبر من عرضه بـ","אורך צלע אינו יכול להיות שלילי, ולכן הפתרון השני נפסל.":"طول الضلع لا يمكن أن يكون سالبًا، ولذلك يُستبعَد الحلّ الثاني.","אחוז שינוי = (חדש − ישן) ÷ ישן ·":"نسبة التغيّر = (الجديد − القديم) ÷ القديم ·","אחר כך החזקה":"ثمّ الأُسّ","אי אפשר להציב לפני שיודעים גם את m וגם את b, ואת שניהם צריך למצוא מהנקודות.":"لا يمكن التعويض قبل معرفة m و‑b معًا، وكلاهما يُستخرَج من النقطتين.","אי אפשר לכנס שורשים שאינם זהים — אבל אולי הם כן יהיו זהים אחרי פישוט. משם מתחילים.":"لا يمكن جمع جذور غير متماثلة — لكن ربّما تصير متماثلة بعد التبسيط. من هنا نبدأ.","אין כאן משוואה — צריך לכתוב אותה. מסמנים באות את הצלע המבוקשת ומבטאים דרכה את השנייה.":"لا توجد هنا معادلة — علينا كتابتها. نرمز بحرف للضلع المطلوب ونعبّر به عن الضلع الآخر.","אין שינוי במחיר":"لا تغيّر في السعر","אם הממוצע":"إذا كان المتوسّط","ארבע פעולות בתרגיל אחד. הסדר הוא סוגריים, אחר כך חזקה, אחר כך כפל, והחיבור אחרון.":"أربع عمليّات في تمرين واحد. الترتيب: الأقواس، ثمّ الأُسّ، ثمّ الضرب، والجمع أخيرًا.","באיזו נקודה חותך את ציר ה-x הישר העובר בשתי הנקודות?":"في أيّ نقطة يقطع محورَ الـ x المستقيمُ المارّ بالنقطتين؟","בדיוק פעם אחת?":"مرّة واحدة بالضبط؟","בודקים מה ההגדרה דורשת":"نفحص ما يتطلّبه التعريف","בוחרים את הפתרון שמתאים לשאלה":"نختار الحلّ الذي يناسب السؤال","בחזקה של חזקה חיברתם מעריכים במקום להכפיל אותם.":"في أُسّ الأُسّ جمعتم الأُسّين بدل ضربهما.","בין האיבר ה":"بين الحدّ الـ","בכיתה היחס בין מספר הבנים למספר הבנות הוא":"في صفّ، النسبة بين عدد البنين وعدد البنات هي","בכפל שברים גם המכנים מוכפלים — הם לא מתחברים.":"في ضرب الكسور تُضرب المقامات أيضًا — وهي لا تُجمع.","במשולש ישר זווית שתי צלעות קובעות את השלישית.":"في المثلّث القائم الزاوية يحدّد ضلعان الضلعَ الثالث.","בסדר הפעולות הסוגריים קודמים להכול — גם לחזקה.":"في ترتيب العمليّات تسبق الأقواسُ كلَّ شيء — حتّى الأُسّ.","בסדר הפעולות כפל קודם לחיבור, גם כשהוא כתוב אחרון וגם כשמדובר בשברים.":"في ترتيب العمليّات يسبق الضربُ الجمعَ، حتّى لو كُتب أخيرًا وحتّى في الكسور.","בסדרה חשבונית האיבר ה":"في متتالية حسابيّة الحدّ الـ","בסיס כפול גובה חלקי":"القاعدة في الارتفاع مقسومًا على","בשביל שטח צריך שני ניצבים, וכאן נתון רק אחד. אז השאלה הראשונה היא איך משיגים את השני.":"لحساب المساحة نحتاج إلى ضلعَي القائمة، وهنا معطى واحد فقط. فالسؤال الأوّل هو كيف نحصل على الثاني.","דילגתם על החזקה. מה שבסוגריים מועלה בריבוע לפני הכפל.":"تجاوزتم الأُسّ. ما داخل الأقواس يُرفَع إلى المربّع قبل الضرب.","האיבר האמצעי בפתיחת הריבוע הוא כפול המכפלה, ולא המכפלה עצמה.":"الحدّ الأوسط عند فكّ المربّع هو ضِعف الجداء، وليس الجداء نفسه.","ההגדרה זקוקה לצלע שאינה נתונה. במשולש ישר זווית תמיד אפשר להשלים צלע שלישית משתי האחרות.":"التعريف يحتاج إلى ضلع غير معطى. وفي المثلّث القائم الزاوية يمكن دائمًا إكمال الضلع الثالث من الضلعين الآخرين.","ההטלות בלתי תלויות, ולכן מכפילים.":"الرميتان مستقلّتان، ولذلك نضرب.","ההיקף אינו השטח, אבל ממנו אפשר להגיע לצלע החסרה — ומשם לשטח.":"المحيط ليس المساحة، لكن منه نصل إلى الضلع الناقص — ومنه إلى المساحة.","ההפרש הוא המספר שהוסף":"الفرق هو العدد الذي أُضيف","הוא c² ולא c.":"هو c² وليس c.","הופכים את השבר שאחרי סימן החילוק ומכפילים.":"نقلب الكسر الذي بعد إشارة القسمة ونضرب.","הופכים שבר לאחוזים":"نحوّل الكسر إلى نسبة مئويّة","החזקה החיצונית חלה גם על המקדם":"الأُسّ الخارجيّ يسري أيضًا على المعامل","החזקה החיצונית חלה על כל גורם בפנים, וחזקה של חזקה מכפילה מעריכים.":"الأُسّ الخارجيّ يسري على كلّ عامل في الداخل، وأُسّ الأُسّ يضرب الأُسّين.","החציון נמדד על כל חמשת המספרים, ואחד מהם עדיין לא ידוע. אז יש כאן שני שלבים.":"الوسيط يُحسَب على الأعداد الخمسة كلّها، وأحدها ما زال مجهولًا. إذن هنا مرحلتان.","היחס אינו אחוז. קודם בודקים מכמה חלקים מורכב השלם.":"النسبة ليست نسبة مئويّة. أوّلًا نفحص من كم جزءًا يتكوّن الكلّ.","היחס נותן חלקים, ואחוז נמדד תמיד מתוך השלם. אז קודם מחשבים כמה חלקים יש בסך הכול.":"النسبة تعطي أجزاءً، والنسبة المئويّة تُقاس دائمًا من الكلّ. فأوّلًا نحسب كم جزءًا في المجموع.","היקף הוא סכום שלוש הצלעות, והצלע השלישית אינה נתונה.":"المحيط هو مجموع الأضلاع الثلاثة، والضلع الثالث غير معطى.","היקף הוא סכום שלוש הצלעות. אחת מהן חסרה — ואותה אפשר לחשב מהשתיים האחרות.":"المحيط هو مجموع الأضلاع الثلاثة. أحدها ناقص — ويمكن حسابه من الضلعين الآخرين.","היקף מלבן הוא":"محيط مستطيل هو","הישר עובר בשתי הנקודות שלפניכם. מהו ערך y כאשר x =":"المستقيم يمرّ بالنقطتين التاليتين. ما قيمة y عندما x =","הישר עובר בשתי הנקודות שלפניכם. מהו ערך y כאשר x = −":"المستقيم يمرّ بالنقطتين التاليتين. ما قيمة y عندما x = −","היתר ידוע, ולכן מחסרים ריבועים.":"الوتر معلوم، ولذلك نطرح المربّعات.","הכיוון הפוך. שווה להשוות את המחיר הסופי למחיר המקורי ולראות מי גדול.":"الاتّجاه معكوس. يستحقّ أن تقارنوا السعر النهائيّ بالسعر الأصليّ وتروا أيّهما أكبر.","הכפלתם את האיבר הראשון במספר האיברים, כאילו כל האיברים שווים.":"ضربتم الحدّ الأوّل في عدد الحدود، كأنّ كلّ الحدود متساوية.","הכפלתם את ההיקף באורך. השטח מחושב משתי הצלעות, לא מההיקף.":"ضربتم المحيط في الطول. المساحة تُحسَب من الضلعين، لا من المحيط.","הכפלתם את הזוג הלא נכון. סימן הכפל נמצא בין שני השברים האחרונים.":"ضربتم الزوج غير الصحيح. إشارة الضرب بين الكسرين الأخيرين.","הכפלתם את היתר בניצב. שטח משולש ישר זווית מחושב משני הניצבים בלבד.":"ضربتم الوتر في ضلع القائمة. مساحة المثلّث القائم تُحسَب من ضلعَي القائمة وحدهما.","הכפלתם את המקדמים במקום לחבר אותם.":"ضربتم المعاملات بدل جمعها.","הכפלתם את הסוגריים בשתיים. העלאה בריבוע היא כפל של הביטוי בעצמו, ולא כפל בשתיים.":"ضربتم الأقواس في اثنين. الرفع إلى المربّع هو ضرب المقدار بنفسه، وليس ضربًا في اثنين.","הכפלתם את שינוי הממוצע בכמות. חסר כאן הערך של הממוצע עצמו.":"ضربتم تغيّر المتوسّط في الكمّيّة. ينقص هنا قيمة المتوسّط نفسه.","הכפלתם בלי להפוך. בחילוק בשבר חייבים להפוך את השבר השני.":"ضربتم بلا قلب. في القسمة على كسر يجب قلب الكسر الثاني.","הכפלתם במכנה רק את ה-x. המכנה מוכפל בכל מה שמעל קו השבר.":"ضربتم بالمقام الـ x وحده. المقام يُضرب بكلّ ما فوق خطّ الكسر.","המינוס לפני הסוגריים השניים חל על שני האיברים שבתוכם, ולא רק על הראשון.":"الإشارة السالبة قبل الأقواس الثانية تسري على الحدّين كليهما، لا على الأوّل وحده.","המכנה הוא הסך הכול, לא הקבוצה השנייה.":"المقام هو المجموع الكلّيّ، لا المجموعة الثانية.","המספר שבחוץ מוכפל גם ב-x וגם במספר שלידו.":"العدد الذي في الخارج يُضرب بالـ x وبالعدد المجاور له معًا.","המשוואה לא כתובה בצורה שאפשר לפרק. קודם מסדרים אותה כך שבצד אחד יהיה אפס.":"المعادلة غير مكتوبة بصورة تسمح بالتحليل. أوّلًا نرتّبها بحيث يكون في أحد الطرفين صفر.","הנחתם שזה ריבוע. שתי הצלעות כאן אינן שוות.":"افترضتم أنّه مربّع. الضلعان هنا غير متساويين.","הסוגריים קודמים לחילוק, ולחיסור שברים צריך מכנה משותף.":"الأقواس تسبق القسمة، ولطرح الكسور نحتاج إلى مقام مشترك.","הסכום אחרי התוספת":"المجموع بعد الإضافة","הסכום לפני התוספת":"المجموع قبل الإضافة","העליתם כל מספר בסוגריים בריבוע בנפרד. (a − b)² אינו a² − b².":"رفعتم كلّ عدد داخل الأقواس إلى المربّع على حدة. (a − b)² لا يساوي a² − b².","הפכתם את השבר הלא נכון — יצא הפוך לגמרי.":"قلبتم الكسر غير الصحيح — فخرجت النتيجة معكوسة تمامًا.","הפכתם את השבר. הניצב שמול הזווית הוא המונה.":"قلبتم الكسر. الضلع المقابل للزاوية هو البسط.","הצבתם את b כתשובה. b הוא נקודת החיתוך עם ציר y, וצריך עוד לפתור mx + b =":"وضعتم b جوابًا. b هي نقطة التقاطع مع محور y، وما زال علينا حلّ mx + b =","הצבתם בשיפוע ושכחתם את b. y = mx + b, לא y = mx.":"عوّضتم في الميل ونسيتم b. ‏y = mx + b، وليس y = mx.","הצורה מורכבת משתי צורות שכבר מוכרות. מחשבים כל אחת בנפרד, ואז מחליטים אם לחבר או לחסר.":"الشكل مركّب من شكلين معروفين. نحسب كلّ واحد على حدة، ثمّ نقرّر أنجمع أم نطرح.","הרוחב =":"العرض =","הריבוע יצא שלילי. מספר בריבוע לעולם אינו שלילי, גם כשהבסיס שלילי.":"خرج المربّع سالبًا. مربّع أيّ عدد ليس سالبًا أبدًا، حتّى لو كان الأساس سالبًا.","השינוי השני מחושב מהמחיר החדש, לא מהמחיר המקורי. זו כל הנקודה.":"التغيّر الثاني يُحسَب من السعر الجديد، لا من السعر الأصليّ. هذه هي النقطة كلّها.","התחלתם מהחילוק. הסוגריים קודמים לכל פעולה אחרת.":"بدأتم من القسمة. الأقواس تسبق كلّ عمليّة أخرى.","התייחסתם לאיבר ה":"تعاملتم مع الحدّ الـ","התייקרות של":"ارتفاع بنسبة","התעלמתם מהאיבר החופשי והוצאתם x מחוץ לסוגריים. יש כאן גם מספר בלי x.":"تجاهلتم الحدّ الحرّ وأخرجتم x خارج الأقواس. يوجد هنا أيضًا عدد بلا x.","ואותו דבר בשני":"والأمر نفسه في الثاني","ואחר כך ירד ב":"ثمّ انخفض بـ","ואחר כך עלה ב":"ثمّ ارتفع بـ","ולבסוף החיבור":"وأخيرًا الجمع","וסכומם":"ومجموعهما","ורק עכשיו מחברים":"والآن فقط نجمع","ורק עכשיו מחשבים שטח":"والآن فقط نحسب المساحة","ורק עכשיו מציבים בהגדרה":"والآن فقط نعوّض في التعريف","ורק עכשיו צריך מכנה משותף.":"والآن فقط نحتاج إلى مقام مشترك.","ורק שורשים זהים אפשר לכנס. מחברים או מחסרים אך ורק את המקדמים.":"والجذور المتماثلة وحدها يمكن جمعها. نجمع أو نطرح المعاملات فقط.","זה cos α — הניצב שליד חלקי היתר. השאלה מבקשת sin, וההגדרה שלו דורשת את הניצב שמול הזווית.":"هذا cos α — المجاور مقسومًا على الوتر. السؤال يطلب sin، وتعريفه يحتاج إلى الضلع المقابل للزاوية.","זה cos α — הניצב שליד חלקי היתר. השאלה מבקשת tan, וההגדרה שלו דורשת את הניצב שמול הזווית.":"هذا cos α — المجاور مقسومًا على الوتر. السؤال يطلب tan، وتعريفه يحتاج إلى الضلع المقابل للزاوية.","זה גודל השינוי בממוצע, לא המספר שהוסף.":"هذا مقدار التغيّر في المتوسّط، لا العدد الذي أُضيف.","זה האורך. השאלה מבקשת את הרוחב, והוא הקטן מביניהם.":"هذا هو الطول. السؤال يطلب العرض، وهو الأصغر منهما.","זה האחוז של הקבוצה השנייה.":"هذه هي نسبة المجموعة الثانية.","זה האיבר ה":"هذا هو الحدّ الـ","זה ההיקף — סכום הצלעות. שטח הוא מכפלה.":"هذا هو المحيط — مجموع الأضلاع. أمّا المساحة فجداء.","זה הטווח — ההפרש בין הגדול לקטן.":"هذا هو المدى — الفرق بين الأكبر والأصغر.","זה היקף מלבן שצלעותיו":"هذا محيط مستطيل ضلعاه","זה המחיר של מחברת ועט יחד.":"هذا سعر دفتر وقلم معًا.","זה הממוצע החדש. מספר שמוסיפים כדי להעלות ממוצע חייב להיות גדול ממנו.":"هذا هو المتوسّط الجديد. والعدد الذي نضيفه لرفع المتوسّط يجب أن يكون أكبر منه.","זה הממוצע הקודם, לפני שהוסף המספר.":"هذا هو المتوسّط السابق، قبل إضافة العدد.","זה הממוצע שנתון בשאלה. ממוצע וחציון אינם אותו דבר.":"هذا هو المتوسّط المعطى في السؤال. المتوسّط والوسيط ليسا الشيء نفسه.","זה המספר החסר שמצאתם. הוא צעד בדרך, לא התשובה.":"هذا هو العدد الناقص الذي وجدتموه. هو خطوة في الطريق، لا الجواب.","זה המרחק הכולל בקילומטרים, לא המהירות.":"هذه هي المسافة الكلّيّة بالكيلومترات، لا السرعة.","זה הניצב שמצאתם, ועדיין לא השטח.":"هذا هو ضلع القائمة الذي وجدتموه، وليس المساحة بعد.","זה הפתרון השני של המשוואה, אבל אורך צלע אינו יכול להיות שלילי.":"هذا هو الحلّ الثاني للمعادلة، لكن طول الضلع لا يمكن أن يكون سالبًا.","זה השטח, לא ההיקף.":"هذه هي المساحة، لا المحيط.","זה השינוי השני בלבד. השאלה מבקשת את השינוי לעומת המחיר המקורי.":"هذا هو التغيّر الثاني وحده. السؤال يطلب التغيّر بالنسبة إلى السعر الأصليّ.","זה לא הממוצע של שתי המהירויות — הן לא נמשכו אותו מספר שעות.":"هذا ليس متوسّط السرعتين — فهما لم تستمرّا العدد نفسه من الساعات.","זה ערך ה-x שנתון בשאלה, לא ה-y שמחפשים.":"هذه قيمة الـ x المعطاة في السؤال، لا الـ y المطلوبة.","זה ערך ה-y רק כאשר x =":"هذه قيمة الـ y فقط عندما x =","זה שטח המשולש שהוסר בלבד.":"هذه مساحة المثلّث المقتطَع وحده.","זו ההגדרה של ציר ה-x, וזה מה שהופך את השאלה למשוואה.":"هذا هو تعريف محور الـ x، وهذا ما يحوّل السؤال إلى معادلة.","זו ההסתברות ל״לפחות פעם אחת״, והיא כוללת גם את המקרה שבו המספר הופיע פעמיים.":"هذا احتمال «مرّة واحدة على الأقلّ»، وهو يشمل أيضًا الحالة التي ظهر فيها العدد مرّتين.","זו ההסתברות שהמספר לא הופיע אף פעם. זה בדיוק המאורע ההפוך — נשאר להשלים ל":"هذا احتمال ألّا يظهر العدد أبدًا. وهذا بالضبط الحدث المعاكس — بقي أن نكمله إلى","זו ההסתברות ששתי ההטלות נתנו את המספר.":"هذا احتمال أن تعطي الرميتان كلتاهما العدد.","זו ההסתברות ששתי ההטלות נתנו את המספר. ״לפחות אחת״ כולל גם מקרה אחד בלבד.":"هذا احتمال أن تعطي الرميتان كلتاهما العدد. أمّا «واحدة على الأقلّ» فيشمل أيضًا حالة واحدة فقط.","זו נקודה שנתונה בשאלה, לא נקודת החיתוך עם הציר.":"هذه نقطة معطاة في السؤال، لا نقطة التقاطع مع المحور.","זו נקודת החיתוך עם ציר y. על ציר x דווקא ה-y הוא שמתאפס.":"هذه نقطة التقاطع مع محور y. أمّا على محور x فالـ y هي التي تساوي صفرًا.","חוזרים אחורה אל האיבר הראשון":"نعود إلى الحدّ الأوّل","חוזרים אחורה אל הראשון, צעד אחרי צעד.":"نعود إلى الحدّ الأوّل، خطوة بعد خطوة.","חוזרים לשאלה":"نعود إلى السؤال","חיברתם את המספרים שבתוך השורש. √a + √b אינו √(a+b).":"جمعتم العددين داخل الجذر. ‏√a + √b لا يساوي √(a+b).","חיברתם את המקדמים במקום לחסר אותם.":"جمعتم المعاملات بدل طرحها.","חיברתם את השיפוע ל-x במקום להכפיל.":"جمعتم الميل إلى الـ x بدل الضرب.","חיברתם את מקדמי ה-x במקום לחסר אותם.":"جمعتم معاملات الـ x بدل طرحها.","חיברתם את שלושת השברים. באמצע יש כפל, לא חיבור.":"جمعتم الكسور الثلاثة. في الوسط ضرب، لا جمع.","חיברתם את שני האחוזים. שינוי אחד מעלה ואחד מוריד — הם לא מצטברים לאותו כיוון.":"جمعتم النسبتين. تغيّر يرفع وآخر يخفض — وهما لا يتراكمان في الاتّجاه نفسه.","חיברתם את שתי ההטלות. החיבור סופר פעמיים את המקרה שבו שתיהן הצליחו.":"جمعتم الرميتين. الجمع يعدّ مرّتين الحالة التي نجحت فيها الرميتان معًا.","חיברתם את שתי המהירויות. מהירויות מתחברות רק כששני גופים נעים זה לקראת זה.":"جمعتم السرعتين. السرعات تُجمع فقط عندما يتحرّك جسمان أحدهما نحو الآخر.","חיברתם במקום לחסר. המשולש הוסר מהמלבן.":"جمعتم بدل الطرح. المثلّث اقتُطع من المستطيل.","חיברתם מונה עם מונה ומכנה עם מכנה. בחיבור שברים חייבים מכנה משותף.":"جمعتم بسطًا مع بسط ومقامًا مع مقام. في جمع الكسور يجب وجود مقام مشترك.","חיברתם רק את שני הניצבים. להיקף צריך גם את היתר.":"جمعتم ضلعَي القائمة فقط. المحيط يحتاج إلى الوتر أيضًا.","חילוק באותו בסיס — מחסרים מעריכים":"قسمة بالأساس نفسه — نطرح الأُسّين","חילקתם את הסכום במספר הפריטים, כאילו כולם עולים אותו דבר.":"قسمتم المبلغ على عدد الأغراض، كأنّ ثمنها كلّها واحد.","חילקתם את השטח בהפרש בין הצלעות. ההפרש אינו אחת הצלעות.":"قسمتم المساحة على الفرق بين الضلعين. والفرق ليس أحد الضلعين.","חילקתם בקבוצה השנייה. אחוז נמדד תמיד מתוך הסך הכול.":"قسمتم على المجموعة الثانية. النسبة المئويّة تُقاس دائمًا من المجموع الكلّيّ.","חיסרתם אחוז מאחוז. אחוזים אינם מתחברים ואינם מתחסרים — כל אחד מהם מחושב מבסיס אחר.":"طرحتم نسبة من نسبة. النسب المئويّة لا تُجمع ولا تُطرح — فكلّ واحدة منها تُحسَب من أساس مختلف.","חיסרתם את המעריכים בכיוון ההפוך. מחסרים את המעריך של המכנה מזה של המונה.":"طرحتم الأُسّين بالاتّجاه المعاكس. نطرح أُسّ المقام من أُسّ البسط.","חיסרתם את הצלעות עצמן. בפיתגורס מחסרים את הריבועים שלהן, ורק אז מוציאים שורש.":"طرحتم الأضلاع نفسها. في فيثاغورس نطرح مربّعاتها، وعندها فقط نستخرج الجذر.","חיסרתם את מכפלת הבסיס בגובה. שטח משולש הוא חצי מזה.":"طرحتم جداء القاعدة في الارتفاع. مساحة المثلّث نصف ذلك.","חיסרתם מונה ממונה ומכנה ממכנה. בחיסור שברים חייבים מכנה משותף.":"طرحتم بسطًا من بسط ومقامًا من مقام. في طرح الكسور يجب وجود مقام مشترك.","חיסרתם צלע אחת בלבד. בהיקף כל צלע מופיעה פעמיים.":"طرحتم ضلعًا واحدًا فقط. في المحيط يظهر كلّ ضلع مرّتين.","חישבתם חציון של ארבעת המספרים הידועים בלבד, בלי המספר החסר.":"حسبتم وسيط الأعداد الأربعة المعلومة وحدها، بلا العدد الناقص.","חישבתם ממוצע של שתי המהירויות. הן לא נמשכו אותו זמן, ולכן המשקל שלהן שונה.":"حسبتم متوسّط السرعتين. لم تستمرّا الزمن نفسه، ولذلك وزنهما مختلف.","חישבתם משמאל לימין. הכפל קודם לחיבור, גם כשהוא כתוב אחרון.":"حسبتم من اليسار إلى اليمين. الضرب يسبق الجمع، حتّى لو كُتب أخيرًا.","חישבתם משמאל לימין. כפל קודם לחיבור, גם בשברים.":"حسبتم من اليسار إلى اليمين. الضرب يسبق الجمع، حتّى في الكسور.","חישבתם רק סדר אחד. ״בדיוק פעם אחת״ מתקיים בשתי דרכים — וצריך לחבר אותן.":"حسبتم ترتيبًا واحدًا فقط. «مرّة واحدة بالضبط» يتحقّق بطريقتين — وعلينا جمعهما.","חצי ההיקף הוא סכום שתי הצלעות, ולא הרוחב עצמו.":"نصف المحيط هو مجموع الضلعين، وليس العرض نفسه.","חציון בלי סידור הוא טעות כמעט ודאית.":"الوسيط بلا ترتيب خطأ شبه مؤكّد.","טעות בסימן המכפלה. שני סימנים זהים נותנים פלוס, סימנים שונים נותנים מינוס.":"خطأ في إشارة الجداء. إشارتان متماثلتان تعطيان موجبًا، والمختلفتان سالبًا.","טעות סימן ב-b בשלב ההצבה.":"خطأ إشارة في b عند مرحلة التعويض.","טעות סימן בחילוק ב-m.":"خطأ إشارة في القسمة على m.","טעות סימן בשלב האחרון, כשחילקתם במקדם.":"خطأ إشارة في المرحلة الأخيرة، عند القسمة على المعامل.","ירידה של":"انخفاض بنسبة","יש כאן גם שברים וגם סוגריים. כל עוד יש מכנים אי אפשר להעביר אגפים — אז מהם מתחילים.":"هنا كسور وأقواس معًا. وما دامت هناك مقامات لا يمكن نقل الحدود بين الطرفين — فمنها نبدأ.","יש כאן חמישה מספרים, ולכן החציון הוא זה שבמקום השלישי.":"هنا خمسة أعداد، ولذلك الوسيط هو الذي في المكان الثالث.","יש כאן שתי נוסחאות כפל מקוצר שונות. פותחים כל אחת בנפרד, ורק אחר כך מחסרים ומכנסים.":"هنا صيغتان مختلفتان من صيغ الضرب المختصر. نفكّ كلّ واحدة على حدة، وبعد ذلك فقط نطرح ونجمع.","יש כאן שתי פעולות שונות. השאלה הראשונה היא לא איך מחברים — אלא מה עושים קודם.":"هنا عمليّتان مختلفتان. السؤال الأوّل ليس كيف نجمع — بل ماذا نفعل أوّلًا.","יש כאן שתי פעולות שונות. השאלה הראשונה היא לא איך מחלקים — אלא מה עושים קודם.":"هنا عمليّتان مختلفتان. السؤال الأوّل ليس كيف نقسم — بل ماذا نفعل أوّلًا.","כאילו הוא האיבר הראשון. צריך קודם לחזור אחורה אליו.":"كأنّه الحدّ الأوّل. علينا أوّلًا العودة إليه.","כותבים את החלק המבוקש כשבר":"نكتب الجزء المطلوب على صورة كسر","כותבים את השטח כמשוואה":"نكتب المساحة على صورة معادلة","כינסתם גם את מה שבתוך השורש. השורש הוא ה״שם״ של האיבר — הוא נשאר כמו שהוא.":"جمعتم أيضًا ما داخل الجذر. الجذر هو «اسم» الحدّ — ويبقى كما هو.","כל איבר שעובר אגף מחליף סימן.":"كلّ حدّ ينتقل إلى الطرف الآخر يغيّر إشارته.","כל דבר שמחירו לא ידוע מקבל אות משלו.":"كلّ شيء سعره مجهول يأخذ حرفًا خاصًّا به.","כל דרך היא מכפלה":"كلّ طريق هو جداء","כל קנייה היא משוואה":"كلّ عمليّة شراء هي معادلة","כפל באותו בסיס — מחברים מעריכים":"ضرب بالأساس نفسه — نجمع الأُسّين","כפל קודם לחיבור, גם כשהוא כתוב אחרון.":"الضرب يسبق الجمع، حتّى لو كُتب أخيرًا.","לא צמצמתם: x² מופיע פעמיים עם סימנים הפוכים והוא מתבטל.":"لم تختصروا: ‏x² يظهر مرّتين بإشارتين متعاكستين ويُلغى.","לאיבר ה":"إلى الحدّ الـ","לוקחים את האמצעי":"نأخذ الأوسط","לחמישה מספרים יש ממוצע":"لخمسة أعداد متوسّط","לפחות פעם אחת?":"مرّة واحدة على الأقلّ؟","לקחתם את האיבר האמצעי לפי הסדר שבו הם כתובים. חייבים לסדר קודם.":"أخذتم الحدّ الأوسط حسب ترتيب كتابتها. يجب الترتيب أوّلًا.","לקחתם את המספרים כפי שהם מופיעים במשוואה, בלי לפרק.":"أخذتم الأعداد كما تظهر في المعادلة، بلا تحليل.","מה חסר כדי לחשב היקף":"ما الناقص لحساب المحيط","מה חסר כדי לחשב שטח":"ما الناقص لحساب المساحة","מהאיבר ה":"من الحدّ الـ","מההיקף לרוחב":"من المحيط إلى العرض","מהירות ממוצעת = כל המרחק חלקי כל הזמן":"السرعة المتوسّطة = كلّ المسافة مقسومة على كلّ الزمن","מהירות ממוצעת אינה ממוצע של מהירויות. היא כל המרחק חלקי כל הזמן — אז קודם מחשבים את שניהם.":"السرعة المتوسّطة ليست متوسّط السرعات. هي كلّ المسافة مقسومة على كلّ الزمن — فأوّلًا نحسب الاثنين.","מוצאים את ההפרש":"نجد الفرق","מוצאים את היתר":"نجد الوتر","מוצאים את הניצב החסר":"نجد ضلع القائمة الناقص","מוצאים את שני המחירים":"نجد السعرين","מחברות ו":"دفاتر و","מחברים ומצמצמים":"نجمع ونختصر","מחסרים את הסוגריים השניים כולם":"نطرح الأقواس الثانية كلّها","מחפשים שני מספרים שמכפלתם −":"نبحث عن عددين جداؤهما −","מחשבים את ההסתברות לא לקבל בהטלה אחת":"نحسب احتمال عدم الحصول عليه في رمية واحدة","מחשבים את המחיר אחרי השינוי הראשון":"نحسب السعر بعد التغيّر الأوّل","מחשבים את המחיר אחרי השינוי השני":"نحسب السعر بعد التغيّر الثاني","מחשבים כמה נסע בכל קטע":"نحسب المسافة في كلّ مقطع","מינוס לפני סוגריים הופך את הסימן של כל איבר בתוכם, גם של השני.":"الإشارة السالبة قبل الأقواس تقلب إشارة كلّ حدّ فيها، وكذلك إشارة الثاني.","מכפילים את שני האגפים במכנה המשותף":"نضرب طرفَي المعادلة بالمقام المشترك","מכפילים ב":"نضرب بـ","מכפילים ומצמצמים":"نضرب ونختصر","מכפילים כל משוואה כך שמקדמי ה-y יתבטלו, ומחברים.":"نضرب كلّ معادلة بحيث تُلغى معاملات الـ y، ثمّ نجمع.","ממוצע הוא משוואה":"المتوسّط معادلة","ממוצע כפול כמות = סכום. חשבו את הסכום לפני ואת הסכום אחרי, וההפרש הוא התשובה.":"المتوسّط في الكمّيّة = المجموع. احسبوا المجموع قبل والمجموع بعد، والفرق هو الجواب.","ממוצע כפול כמות נותן את הסכום.":"المتوسّط في الكمّيّة يعطي المجموع.","ממלבן שאורכו":"من مستطيل طوله","מסדרים למשוואה ריבועית":"نرتّبها معادلة تربيعيّة","מסכמים את כל הדרך ואת כל הזמן":"نجمع كلّ المسافة وكلّ الزمن","מסלקים נעלם אחד":"نحذف مجهولًا واحدًا","מסמנים את הנעלם":"نرمز للمجهول","מסמנים את הנעלמים":"نرمز للمجهولين","מסמנים ב-x את הצלע שמחפשים, ומבטאים דרכה את השנייה.":"نرمز بـ x للضلع المطلوب، ونعبّر به عن الضلع الآخر.","מספר שלילי בריבוע יוצא חיובי: מינוס כפול מינוס נותן פלוס.":"العدد السالب في المربّع يخرج موجبًا: سالب في سالب يعطي موجبًا.","מספר שעבר אגף לא החליף סימן.":"عدد انتقل إلى الطرف الآخر ولم يغيّر إشارته.","מספרים, והממוצע שלהם":"أعداد، ومتوسّطها","מעבירים הכול לצד אחד":"ننقل كلّ شيء إلى طرف واحد","מעבירים הכול לצד אחד — רק כך אפשר לפרק לגורמים.":"ننقل كلّ شيء إلى طرف واحد — فبهذا وحده يمكن التحليل إلى عوامل.","מעלים בריבוע את מה שיצא מהסוגריים.":"نرفع إلى المربّع ما خرج من الأقواس.","מעריך שלילי אינו סימן מינוס של הביטוי — הוא מוריד את החזקה למכנה.":"الأُسّ السالب ليس إشارة سالبة للمقدار — بل ينقل القوّة إلى المقام.","מפרקים את המאורע":"نفكّك الحدث","מפרקים את הצורה לשתיים":"نفكّك الشكل إلى شكلين","מפרקים ופותרים":"نحلّل ونحلّ","מפשטים כל שורש בנפרד":"نبسّط كلّ جذر على حدة","מציבים אחת הנקודות ב-y = mx + b.":"نعوّض إحدى النقطتين في y = mx + b.","מרחיבים למכנה משותף":"نوسّع إلى المقام المشترك","מרחק = מהירות · זמן.":"المسافة = السرعة · الزمن.","משוואה ריבועית נפתרת רק כשבצד אחד יש אפס. זה הצעד שלפני כל השאר.":"المعادلة التربيعيّة لا تُحلّ إلّا عندما يكون في أحد الطرفين صفر. هذه هي الخطوة التي تسبق كلّ شيء.","משווים למחיר המקורי":"نقارن بالسعر الأصليّ","משלימים את המספר החסר":"نُكمل العدد الناقص","משלימים ל":"نُكمل إلى","מתחילים מהסוגריים":"نبدأ من الأقواس","נוסחת הסכום דורשת את a₁, והוא לא נתון. אז מתחילים מההפרש — הוא מה שמאפשר לחזור אחורה.":"قانون المجموع يحتاج إلى a₁، وهو غير معطى. فنبدأ من الفرق — هو ما يتيح العودة إلى الوراء.","נפטרים מהמכנים":"نتخلّص من المقامات","נשאלנו על מחברת בלבד — ורק את זה עונים.":"سُئلنا عن الدفتر وحده — وهذا فقط ما نجيب به.","נשאלנו על עט בלבד — ורק את זה עונים.":"سُئلنا عن القلم وحده — وهذا فقط ما نجيب به.","ס\"מ גזרו משולש שבסיסו":"سم اقتُطع مثلّث قاعدته","ס\"מ ואורכו":"سم وطوله","ס\"מ ואחד הניצבים":"سم وأحد ضلعَي القائمة","ס\"מ והניצב שליד הזווית α הוא":"سم والضلع المجاور للزاوية α هو","ס\"מ מרוחבו, ושטחו":"سم، ومساحته","ס\"מ. מהו sin α?":"سم. ما sin α؟","ס\"מ. מהו tan α?":"سم. ما tan α؟","ס\"מ. מהו היקף המשולש?":"سم. ما محيط المثلّث؟","ס\"מ. מהו שטח החלק שנשאר?":"سم. ما مساحة الجزء المتبقّي؟","ס\"מ. מהו שטח המשולש?":"سم. ما مساحة المثلّث؟","סופרים מה קל יותר":"نعدّ ما هو أسهل","סימן אחד הופך והשני לא — שווה לבדוק שוב את המעבר לצד אחד.":"إشارة واحدة انقلبت والأخرى لا — يستحقّ أن تفحصوا مجدّدًا النقل إلى طرف واحد.","סמ\"ר. מהו רוחב המלבן?":"سم². ما عرض المستطيل؟","ספרתם מקום אחד מאוחר מדי. מבין חמישה מספרים האמצעי הוא השלישי.":"عددتم مكانًا واحدًا زيادة. من بين خمسة أعداد، الأوسط هو الثالث.","ספרתם מקום אחד מוקדם מדי. מבין חמישה מספרים האמצעי הוא השלישי.":"عددتم مكانًا واحدًا أقلّ. من بين خمسة أعداد، الأوسط هو الثالث.","עטים ושילמו":"أقلام ودفعوا","עכשיו הכפל":"والآن الضرب","עכשיו יש":"الآن يوجد","עכשיו יש חמישה מספרים — מסדרים":"الآن لدينا خمسة أعداد — نرتّبها","עכשיו יש משוואה מלאה, אפשר להציב בה כל x.":"الآن لدينا معادلة كاملة، ويمكن التعويض فيها بأيّ x.","עכשיו שני השורשים זהים":"الآن الجذران متماثلان","עלייה של":"ارتفاع بنسبة","עצמו, לא הסכום.":"نفسه، لا المجموع.","עצרתם אחרי הסוגריים ולא ביצעתם את החילוק.":"توقّفتم بعد الأقواس ولم تُجروا القسمة.","עצרתם בשבר ולא הכפלתם ב":"توقّفتم عند الكسر ولم تضربوا بـ","פאות פעמיים. מה ההסתברות לקבל את המספר":"وجهًا مرّتين. ما احتمال الحصول على العدد","פותחים את המכפלה השנייה":"نفكّ الجداء الثاني","פותחים את הריבוע":"نفكّ المربّع","פותחים את שני זוגות הסוגריים":"نفكّ زوجَي الأقواس","פותרים":"نحلّ","פשטו וכנסו":"بسّطوا واجمعوا","פתרתם כאילו המשוואה כבר מסודרת. כשמעבירים אגף כל הסימנים מתהפכים.":"حللتم كأنّ المعادلة مرتّبة أصلًا. وعند النقل إلى الطرف الآخر تنقلب كلّ الإشارات.","פתרתם נכון, אבל עניתם על הנעלם השני. שווה לחזור ולקרוא מה נשאל.":"حللتم بشكل صحيح، لكنّكم أجبتم عن المجهول الثاني. يستحقّ أن تعودوا وتقرأوا ما هو المطلوب.","צעדים, וכל צעד הוא d.":"خطوات، وكلّ خطوة هي d.","קודם הכפל":"أوّلًا الضرب","קודם מה שבתוך הסוגריים":"أوّلًا ما داخل الأقواس","קודם מוצאים את הצלע החסרה":"أوّلًا نجد الضلع الناقص","קוראים את התוצאה":"نقرأ النتيجة","קידמתם את ה-y ביחידה אחת לכל צעד ב-x. כל צעד ב-x מזיז את y בגודל השיפוע.":"زدتم الـ y وحدة واحدة لكلّ خطوة في الـ x. كلّ خطوة في الـ x تحرّك الـ y بمقدار الميل.","קמ\"ש, ומיד אחר כך":"كم/س، وبعد ذلك مباشرةً","קמ\"ש. מהי המהירות הממוצעת שלו לאורך כל הנסיעה?":"كم/س. ما سرعته المتوسّطة على طول الرحلة كلّها؟","קנו":"اشتروا","ראשית הצירים אכן נמצאת על ציר ה-x, אבל הישר הזה אינו עובר דרכה.":"نقطة الأصل تقع فعلًا على محور الـ x، لكنّ هذا المستقيم لا يمرّ بها.","ריבוע של סוגריים אינו ריבוע של כל איבר בנפרד. יש גם איבר אמצעי, וזה מה שהכי הרבה נשכח.":"مربّع الأقواس ليس مربّع كلّ حدّ على حدة. هناك أيضًا حدّ أوسط، وهو الأكثر نسيانًا.","רכב נסע":"سافرت سيّارة","ש\"ח. באותה חנות קנו":"شيكل. وفي المتجر نفسه اشتروا","ש\"ח. המחיר ירד ב":"شيكل. انخفض السعر بـ","ש\"ח. המחיר עלה ב":"شيكل. ارتفع السعر بـ","ש\"ח. מה מחיר מחברת אחת?":"شيكل. ما سعر دفتر واحد؟","ש\"ח. מה מחיר עט אחד?":"شيكل. ما سعر قلم واحد؟","שטח = אורך · רוחב, והרוחב אינו נתון. אותו מוצאים מההיקף.":"المساحة = الطول · العرض، والعرض غير معطى. نجده من المحيط.","שטח המלבן":"مساحة المستطيل","שטח המשולש":"مساحة المثلّث","שטח מלבן = אורך · רוחב.":"مساحة المستطيل = الطول · العرض.","שטח משולש ישר זווית מחושב משני הניצבים, והניצב השני אינו נתון.":"مساحة المثلّث القائم تُحسَب من ضلعَي القائمة، والضلع الثاني غير معطى.","שטח שנשאר = שטח המלבן פחות שטח המשולש שהוסר.":"المساحة المتبقّية = مساحة المستطيل ناقص مساحة المثلّث المقتطَع.","שכחתם להוציא שורש —":"نسيتم استخراج الجذر —","שכחתם לחלק ב":"نسيتم القسمة على","שלב ב: מוצאים את b":"المرحلة ب: نجد b","שלב ג: מציבים את ה-x שנשאלנו עליו":"المرحلة ج: نعوّض الـ x المسؤول عنه","שלב ג: על ציר x מתקיים y =":"المرحلة ج: على محور x يتحقّق y =","שלושה חוקים שונים נדרשים כאן. מתחילים מהסוגריים — כל עוד יש חזקה של חזקה, אי אפשר לחבר או לחסר מעריכים.":"هنا حاجة إلى ثلاث قواعد مختلفة. نبدأ من الأقواس — فما دام هناك أُسّ لأُسّ، لا يمكن جمع الأُسّات أو طرحها.","שני איברי x² מתבטלים זה עם זה.":"حدّا x² يُلغي أحدهما الآخر.","שני האחוזים מחושבים מבסיסים שונים. מחשבים את המחיר הסופי בפועל, ורק אז משווים אותו למחיר ההתחלתי.":"النسبتان تُحسَبان من أساسين مختلفين. نحسب السعر النهائيّ فعليًّا، وعندها فقط نقارنه بالسعر الابتدائيّ.","שני הניצבים ידועים, ולכן מחברים ריבועים.":"ضلعا القائمة معلومان، ولذلك نجمع المربّعات.","שני השורשים נראים זרים זה לזה. מחפשים בכל אחד את הריבוע השלם שמסתתר בו.":"الجذران يبدوان غريبين أحدهما عن الآخر. نبحث في كلّ واحد عن المربّع الكامل المختبئ فيه.","שעות במהירות":"ساعات بسرعة","שתי דרכים — מחברים אותן":"طريقان — نجمعهما","שתי הטלות בלתי תלויות — מכפילים":"رميتان مستقلّتان — نضرب","שתי נקודות מגדירות ישר אחד. ועל ציר ה-x כל הנקודות חולקות תכונה אחת — שווה לחשוב מהי.":"نقطتان تحدّدان مستقيمًا واحدًا. وعلى محور الـ x تشترك كلّ النقاط في صفة واحدة — يستحقّ التفكير ما هي.","שתי קניות — שתי משוואות. מסמנים באות את מה שלא ידוע, ובסוף בודקים על מה בדיוק נשאלתם.":"عمليّتا شراء — معادلتان. نرمز بحرف لما هو مجهول، وفي النهاية نفحص عمّاذا سُئلنا بالضبط.","״בדיוק פעם אחת״ אינו מקרה יחיד — יש שני סדרים אפשריים, וכל אחד מהם מכפלה.":"«مرّة واحدة بالضبط» ليست حالة واحدة — هناك ترتيبان ممكنان، وكلّ واحد منهما جداء.","״בדיוק פעם אחת״ קורה בשתי דרכים: הצלחה ואז כישלון, או כישלון ואז הצלחה.":"«مرّة واحدة بالضبط» تحدث بطريقتين: نجاح ثمّ إخفاق، أو إخفاق ثمّ نجاح.","״לפחות אחת״ מכסה כמה מקרים. שווה לשאול מה ההפך שלו — כי ההפך הוא מקרה יחיד.":"«واحدة على الأقلّ» تغطّي عدّة حالات. يستحقّ أن نسأل ما عكسها — لأنّ العكس حالة واحدة فقط.","״לפחות פעם אחת״ מכסה שלושה מקרים שונים. ההפך שלו — ״אף פעם לא״ — הוא מקרה אחד בלבד.":"«مرّة واحدة على الأقلّ» تغطّي ثلاث حالات مختلفة. أمّا عكسها — «ولا مرّة» — فحالة واحدة فقط.","− P(אף פעם)":"− P(ولا مرّة)","אומר שהחלקים אינם שווים.":"تعني أنّ الأجزاء غير متساوية.","בחילוק חיברתם מעריכים. חיבור שייך לכפל, ובחילוק מחסרים.":"في القسمة جمعتم الأُسّين. الجمع للضرب، وفي القسمة نطرح.","בחישוב האיבר האחרון הכפלתם ב-n במקום ב-n מינוס":"في حساب الحدّ الأخير ضربتم بـ n بدل n ناقص","במקום בזמן הכולל. מספר הקטעים אינו מספר השעות.":"بدل الزمن الكلّيّ. عدد المقاطع ليس عدد الساعات.","החלפתם בין m ל-b. השיפוע הוא זה שמוכפל ב-x.":"بدّلتم بين m و‑b. الميل هو ما يُضرب بالـ x.","התייחסתם להטלה אחת בלבד.":"تعاملتم مع رمية واحدة فقط.","זה ההפרש בין שני המחירים.":"هذا هو الفرق بين السعرين.","זה המספר הגדול ביותר, לא האמצעי.":"هذا هو أكبر الأعداد، لا الأوسط.","זה המספר הקטן ביותר, לא האמצעי.":"هذا هو أصغر ا    ============================================================ */
function voices(){try{return window.speechSynthesis?speechSynthesis.getVoices():[]}catch(e){return[]}}
/* הקולות נטענים אסינכרונית, ורק אז נורה voiceschanged. מי שמקריא
   לפני כן מקבל את ברירת המחדל של הדפדפן — לרוב קול אנגלי, גם כשמותקן
   קול עברי טוב. onvoiceschanged לבדו אינו פתרון: הוא מרענן תפריט,
   הוא לא מעכב את האמירה הראשונה. */
var _voicesP=null;
function voicesReady(){
  if(_voicesP)return _voicesP;
  _voicesP=new Promise(function(done){
    if(!("speechSynthesis" in window)){done();return}
    if(voices().length){done();return}
    var poll=null,cap=null,fired=false;
    function finish(){
      if(fired)return; fired=true;
      clearInterval(poll); clearTimeout(cap);
      try{speechSynthesis.removeEventListener("voiceschanged",finish)}catch(e){}
      done();
    }
    try{speechSynthesis.addEventListener("voiceschanged",finish)}catch(e){}
    /* Safari לא תמיד יורה את האירוע — לכן גם דגימה */
    poll=setInterval(function(){if(voices().length)finish()},120);
    /* תקרה: יש מכשירים שמחזירים רשימה ריקה לצמיתות ומדברים מצוין.
       עדיף לדבר בקול ברירת מחדל מאשר לשתוק לנצח. */
    cap=setTimeout(finish,4000);
  });
  return _voicesP;
}
/* קולות בשפת הממשק. השם נשאר מהתקופה שבה הייתה רק עברית; מה
   שנבדק הוא LG, ולכן ממשק בערבית מחפש קול ערבי ולא עברי. */
function langRe(){return LG==="ar"?/^ar/i:/^(he|iw)/i}
/* יש מכשירים שמחזירים קול בלי שדה lang. סינון לפי lang בלבד הסתיר
   אותו לגמרי, והאפליקציה הכריזה "אין קול בשפה הזאת" על מכשיר שיש
   בו אחד. השם הוא הרמז היחיד שנשאר. */
var LANG_HINT={he:/עברית|hebrew|ivrit/i, ar:/العربية|arabic/i};
function hebVoices(){
  var re=langRe(),hint=LANG_HINT[LG];

    var l=String(v.lang||"");
    if(l)return re.test(l);
    return hint?hint.test(v.name||""):false;
  });
}
/* עברית קודם, ואחריה כל השאר — כדי שתמיד תהיה רשימה לבחור ממנה */
function pickList(){
  var he=hebVoices(),rest=voices().filter(function(v){return he.indexOf(v)<0});
  return he.concat(rest);
}
/* אין שדה מגדר ב-Web Speech API. השם הוא הרמז היחיד, ולכן אלה
   שמות הקולות שהמערכות באמת מתקינות — ולא ניחוש לפי צליל.
   "google" הוא שם יצרן ולא מגדר, ומכוון אינו מופיע כאן. */
var VOICE_F=/(female|woman|#female|\bfem\b|carmit|hila|\bmiri\b|\bdana\b|shira|samantha|karen|moira|tessa|serena|victoria|\bava\b|allison|susan|vicki|nicky|\bzoe\b|fiona|\bkate\b|shelley|zira|hazel|aria|jenny|michelle|\bana\b|\beva\b|emma|libby|sonia|natasha|clara|\bamber\b|ashley|\bcora\b|elizabeth|monica|\bsara\b|\bsarah\b|\bjane\b|\bnancy\b|\bluna\b|\bmolly\b|irina|milena|svetlana|dariya|\belena\b|katja|ekaterina|\bkatya\b|tatyana|\balena\b|hoda|salma|zariyah|amina|\bhala\b|noura|laila|layla|fatima|zeina|\biman\b|\brana\b|\bsana\b|maryam|asma|heera|raveena|swara|neerja)/
var VOICE_M=/(\bmale\b|\bman\b|#male|asaf|avri|yoni|moshe|\balex\b|daniel|\bfred\b|\btom\b|aaron|arthur|oliver|rishi|gordon|\blee\b|ralph|bruce|david|\bmark\b|\bguy\b|ryan|christopher|\beric\b|brian|andrew|roger|steffan|liam|william|george|james|\bthomas\b|benjamin|brandon|\bjason\b|\btony\b|dmitry|pavel|\byuri\b|artemi|maxim|nikolai|maged|tarik|naayf|hamed|shakir|\bomar\b|tarek|\bali\b|bassel|\bmoaz\b|hamdan|saleh|abdullah|\btaim\b|fahed|rakan|yasser|hemant|madhur|prabhat)/
function guessGender(v){
  var n=((v.name||"")+" "+(v.lang||"")).toLowerCase();

  if(VOICE_M.test(n))return "m";

function deviceVoice(){

     כל הרשימה, וכפתור "לשמוע" ברשימת הקולות אינו משמיע אלא בוחר —
     לחיצה אחת ליד קול אנגלי נשמרה כקול שמקריא עברית, ומאז כל
     המשפטים נקראו באנגלית. מחפשים רק בתוך שפת הממשק. */
  var mineFirst=hebVoices();
  for(i=0;i<mineFirst.length;i++)if(mineFirst[i].voiceURI===state.settings.voice)return mineFirst[i];
  /* בלי בחירה ידנית — קול נשי, אבל *רק מתוך שפת הממשק*.
     pickList מחזיר קודם את שפת הממשק ואחריה את כל השאר, ולכן
     סריקה על כל הרשימה מצאה קול אנגלי נשי במכשיר שאין בו קול
     עברי נשי — והעברית הוקראה באנגלית. שפה קודמת למגדר. */
  var mine=hebVoices();
  for(i=0;i<mine.length;i++)if(guessGender(mine[i])==="f")return mine[i];

     לבחור — גרוע פחות מהקראה בשפה הלא נכונה. */
  return null;
}
/* ============================================================
   מעקב הקראה: הדגשת המילה הנאמרת
   ------------------------------------------------------------
   עובד רק כשהמחרוזת שנמסרה למנוע הדיבור זהה לזו שעל המסך.
   כאן זה נכון לרמז, שנאמר גולמי; שאלה ונוסחה עוברות דרך
   speakMath ומשנות צורה, ולכן שם אין מיפוי ומדגישים את הכרטיס.
   hlPrep משווה בעצמו ומחליט — אין הנחה מראש.

   charIndex מתאפס בכל אמירה, ולכן המפה נבנית מהמחרוזת שנמסרה
   ולא מה-DOM. אנדרואיד, ולעתים ספארי, לא שולחים דיווח על מילים
   כלל — ואז הדגשה שלא זזה נראית כמו תקלה, ולכן אחרי שנייה וחצי
   בלי דיווח מודגש כל האיבר.
   ============================================================ */
var HL={el:null,raw:"",spans:[],map:[],timer:null,got:false,added:false};
function hlClear(){
  if(HL.timer){clearTimeout(HL.timer);HL.timer=null}
  if(HL.el){try{HL.el.innerHTML=HL.raw;HL.el.classList.remove("now")}catch(e){}}
  HL={el:null,raw:"",spans:[],map:[],timer:null,got:false,added:false};
}
function hlWhole(el){
  hlClear();
  if(!el)return;
  HL.el=el; HL.raw=el.innerHTML; HL.added=true;
  el.classList.add("now");
}
function hlPrep(el,text){
  hlClear();
  if(!el||!text)return;
  /* אם המחרוזת הנאמרת אינה זהה למוצגת — אין מיפוי, ומדגישים הכול. */
  var shown=(el.textContent||"").replace(/\s+/g," ").trim();
  var said=String(text).replace(/\s+/g," ").trim();
  if(shown!==said){hlWhole(el);return}
  HL.el=el; HL.raw=el.innerHTML;
  var parts=String(text).split(/(\s+)/),html="",pos=0,idx=0;
  HL.map=[];
  for(var i=0;i<parts.length;i++){
    var pt=parts[i];
    if(!pt.length)continue;
    if(/^\s+$/.test(pt)){html+=pt;pos+=pt.length;continue}
    HL.map.push({from:pos,to:pos+pt.length,i:idx});
    html+='<span class="wd" data-i="'+idx+'">'+esc(pt)+'</span>';
    pos+=pt.length; idx++;
  }
  if(!HL.map.length){hlClear();return}
  el.innerHTML=html;
  HL.spans=el.querySelectorAll(".wd");
  HL.timer=setTimeout(function(){if(!HL.got&&HL.el){HL.added=true;HL.el.classList.add("now")}},1500);
}
function hlAt(c){
  if(!HL.el||!HL.map.length)return;
  HL.got=true;
  if(HL.timer){clearTimeout(HL.timer);HL.timer=null}
  if(HL.added){HL.el.classList.remove("now");HL.added=false}
  for(var k=0;k<HL.map.length;k++){
    if(c>=HL.map[k].from&&c<HL.map[k].to){
      for(var j=0;j<HL.spans.length;j++)HL.spans[j].classList.toggle("hit",j===HL.map[k].i);
      return;
    }
  }
}

     לגמרי, שקורה בכל לחיצה שנייה. הצגתן כשגיאה הבהילה משתמש
     ואמרה לו שהמכשיר שלו שבור בזמן שהוא עבד.
     גם ניקוי ההדגשה חייב לבוא אחרי היציאה הזאת ולא לפניה: הביטול
     של האמירה הקודמת מגיע אחרי שהאמירה החדשה כבר הכינה את ההדגשה
     שלה, וניקוי כאן מחק אותה מיד. */
  if(err==="interrupted"||err==="canceled")return;

  m.style.cssText="position:fixed;inset-inline:10px;bottom:10px;z-index:99999;"+
    "background:#7f1d1d;color:#fff;padding:13px 15px;border-radius:12px;"+
    "font:600 15px/1.55 system-ui,Arial,sans-serif;box-shadow:0 10px 34px rgba(0,0,0,.45);"+
    "display:flex;gap:10px;align-items:flex-start";

  m.appendChild(t); m.appendChild(x);

/* הקראה שהצליחה מסירה את ההודעה — המצב השתנה */
function ttsOK(){ if(_ttsBar&&_ttsBar.parentNode){_ttsBar.parentNode.removeChild(_ttsBar);_ttsBar=null} }

   בדיקת קול בתוך האפליקציה. הפשוטה ביותר שאפשר: אמירה אחת,
   בתוך הלחיצה, בלי מילון, בלי בחירת קול ובלי שום שכבה — ומדווחת

/* כמה מהקולות הם בשפה שנבדקת. עד כה ההודעה מנתה את כל הקולות
   במכשיר, בכל השפות — "23 קולות" בכרום על ווינדוס, כשבעברית יש
   שם אחד בלבד (Asaf). המספר היה נכון ולא אמר כלום; עכשיו שניהם. */
function sameLang(list,lang){
  var base=String(lang||"").split("-")[0].toLowerCase(),n=0;
  for(var i=0;i<list.length;i++){
    if(String(list[i].lang||"").replace("_","-").toLowerCase().split("-")[0]===base)n++;
  }
  return n;
}
function voiceCheck(){
  var M=vchkT();
  VCHK=M.sent; render();
  function show(m){ VCHK=m; render() }
  if(!("speechSynthesis" in window)){ show(M.noSup); return }
  var list=[]; try{ list=speechSynthesis.getVoices()||[] }catch(e){}
  try{ speechSynthesis.cancel() }catch(e){}
  var u;
  try{ u=new SpeechSynthesisUtterance(M.say) }
  catch(e){ show(M.mkFail+e.message); return }
  u.lang=LANGS[LG].tts; u.volume=1; u.rate=1; u.pitch=1;
  var done=false;
  u.onstart=function(){ done=true; show(M.okN[0]+sameLang(list,u.lang)+M.okN[1]+list.length+M.okN[2]) };
  u.onerror=function(e){ done=true;
    var er=(e&&e.error)||M.unk;
    show(M.engine[0]+er+" · "+list.length+M.engine[1]); };
  try{ speechSynthesis.speak(u) }
  catch(e){ show(M.spFail+e.message); return }
  setTimeout(function(){ if(!done)
    show(M.timeout[0]+list.length+M.timeout[1]) },2000);
}


/* ------------------------------------------------------------
   פיצול לאמירות קצרות — הועתק מ"תאוריה מדברת", שם ההקראה נשמעת
   הכי טוב. מנועי מכשיר מאיצים ובולעים סופי מילים במשפט ארוך;
   כאן נשלחה שאלה שלמה באמירה אחת, לפעמים 300 תווים.
   כל מקטע נושא את ההיסט שלו במחרוזת המלאה, כי charIndex מתאפס
   בכל אמירה ובלעדיו ההדגשה קופצת לתחילת המשפט בכל מקטע.
   ------------------------------------------------------------ */
var SEG_MAX=90, SEG_GAP=260;
/* סימן פיסוק בין שתי ספרות הוא חלק מהמספר ולא מקום לחתוך בו:
   בלי הבדיקה הזאת "3,500" נשבר והמנוע קורא "שלוש, חמש מאות". */
function insideNumber(str,i){
  return i>0&&i+1<str.length&&/[0-9]/.test(str[i-1])&&/[0-9]/.test(str[i+1]);
}
function segments(spoken){
  var out=[],parts=[],from=0,i,j;
  function push(t,start){ if(String(t).trim())out.push({text:t,start:start}) }
  for(i=0;i<spoken.length;i++){
    if(".!?:;".indexOf(spoken[i])<0)continue;
    if(insideNumber(spoken,i))continue;
    j=i+1; while(j<spoken.length&&/\s/.test(spoken[j]))j++;
    parts.push({text:spoken.slice(from,j),start:from});
    from=j; i=j-1;
  }
  if(from<spoken.length)parts.push({text:spoken.slice(from),start:from});
  for(var k=0;k<parts.length;k++){
    var p=parts[k];
    if(p.text.length<=SEG_MAX){ push(p.text,p.start); continue }
    var rest=p.text,base=p.start;
    while(rest.length>SEG_MAX){
      var cut=rest.lastIndexOf(",",SEG_MAX);
      while(cut>0&&insideNumber(rest,cut))cut=rest.lastIndexOf(",",cut-1);
      if(cut<SEG_MAX*0.4)cut=rest.lastIndexOf(" ",SEG_MAX);
      if(cut<=0)break;
      push(rest.slice(0,cut+1),base);
      base+=cut+1; rest=rest.slice(cut+1);
    }
    push(rest,base);
  }
  /* מקטע זעיר — "12." או ")" — עם הפסקה של רבע שנייה אחריו נשמע
     כמו גמגום. מאחדים אותו לזה שאחריו. */
  var merged=[];
  for(i=0;i<out.length;i++){
    if(merged.length&&out[i].text.trim().length<12&&
       merged[merged.length-1].text.length+out[i].text.length<=SEG_MAX*1.4){
      merged[merged.length-1].text+=out[i].text; continue;
    }
    if(out[i].text.trim().length<12&&i+1<out.length){
      out[i+1]={text:out[i].text+out[i+1].text,start:out[i].start}; continue;
    }
    merged.push(out[i]);
  }
  out=merged;
  return out.length?out:[{text:spoken,start:0}];
}
/* קצב לפי שפה — אותם ערכים שנבחרו בתאוריה מדברת אחרי האזנה */
var VOICE_TUNE={he:0.82,ar:0.85,en:0.90,ru:0.88};
function tuneRate(lang,rate){
  var t=VOICE_TUNE[String(lang||"he").split("-")[0].toLowerCase()]||0.88;
  var r=t*(rate||1);
  return Math.max(0.5,Math.min(1.6,Math.round(r*100)/100));
}


/* ------------------------------------------------------------
   כשאין במכשיר קול נשי בשפה הנוכחית — ווינדוס עם Asaf בלבד הוא
   המקרה הנפוץ בעברית — מרימים את גובה הקול. זה לא קול נשי אמיתי,
   וגם לא מתיימר להיות: זו הדרך היחידה בדפדפן להזיז קול גברי לכיוון
   הנשי בלי הקלטות ובלי שירות חיצוני. מי שמתקין קול נשי מקבל אותו
   מיד ובלי שינוי הגובה.
   ------------------------------------------------------------ */
var FEM_PITCH=1.35;
function femLift(v){
  if(!v)return 1;
  try{ return guessGender(v)==="m"?FEM_PITCH:1 }catch(e){ return 1 }
}


/* הודעה כשאין קול נשי בשפה — עם ההוראות למערכת ההפעלה שהמשתמש
   נמצא בה. בלי זה "אין קול נשי" נראה כמו החלטה של האפליקציה. */
function femNote(){
  var mine=hebVoices(),i,has=false;
  for(i=0;i<mine.length;i++)if(guessGender(mine[i])==="f")has=true;
  if(has||!mine.length)return "";
  /* המסלול נכתב למערכת שהמשתמש נמצא בה עכשיו. אנדרואיד של גוגל
     מחזיק את ההגדרה תחת "נגישות" — "ניהול כללי" הוא מסלול של
     סמסונג בלבד; אייפד מדווח מאז iPadOS 13 כמו מק ונבדל ממנו רק
     במסך מגע; ומשתמש מק קיבל עד כה הוראות של ווינדוס. */
  var ua=navigator.userAgent||"";
  var how=/Android/i.test(ua)
    ? ("באנדרואיד: הגדרות ← נגישות ← טקסט לדיבור (בסמסונג: הגדרות ← ניהול כללי ← טקסט לדיבור) ← גלגל השיניים ליד המנוע ← התקנת נתוני קול ← לבחור וריאנט נשי.")
    : (/iPhone|iPad|iPod/i.test(ua)||(/Macintosh/i.test(ua)&&navigator.maxTouchPoints>1))
    ? ("באייפון או באייפד: הגדרות ← נגישות ← תוכן מדובר ← קולות ← לבחור קול נשי ולהוריד.")
    : /Mac OS X|Macintosh/i.test(ua)
    ? ("במק: הגדרות המערכת ← נגישות ← תוכן מדובר ← קול המערכת ← ניהול קולות ← להוריד קול נשי.")
    : ("בווינדוס: הגדרות ← שעה ושפה ← דיבור ← ניהול קולות ← הוספת קולות.");
  return ("במכשיר הזה אין קול נשי בשפה הנוכחית, ולכן גובה הקול הורם. זה לא קול נשי אמיתי — כדי לקבל אחד צריך להתקין אותו.")+" "+how;
}

/* ------------------------------------------------------------
   דור ההקראה. speechSynthesis.cancel() אינו מבטל setTimeout:
   כרום יורה onend על האמירה שבוטלה, המקטע הבא נרשם בכל זאת,
   וכעבור SEG_GAP ההקראה הישנה חוזרת מעל החדשה — שני קולות
   במקביל. מונה אחד פותר את זה: כל הקראה מקבלת מספר, stopSpeak
   מקדם אותו, ומקטע מדור ישן פשוט אינו מדבר.
   saying הוא אותו מצב כפי שהוא נראה על המסך — כדי שכפתור
   ההקראה יציע לעצור בזמן שמדברים.
   ------------------------------------------------------------ */
var _sayGen=0, saying=false;
function sayDone(){
  var was=saying; saying=false;
  hlClear(); ttsOK();
  if(was&&view==="practice")render();
}

function speakDevice(text){
  if(!("speechSynthesis" in window)){ sayDone(); return }
  try{speechSynthesis.cancel()}catch(e){}
  var my=++_sayGen;
  /* האמירה יוצאת מיד, בתוך הלחיצה. קודם היא נעטפה ב-voicesReady,
     שממתין לרשימת הקולות ועד ארבע שניות אם היא לא מגיעה — ואמירה
     שיוצאת ארבע שניות אחרי המגע נזרקת בשקט באנדרואיד ובספארי.
     כשהרשימה כבר כאן, בוחרים קול ומדברים. כשהיא ריקה — מדברים
     בכל זאת, עם u.lang בלבד: קול ברירת מחדל בשפה הנכונה עדיף על
     שתיקה, ויש מכשירים שמחזירים רשימה ריקה לצמיתות ומדברים היטב.
     voicesReady נשאר בשימוש למסך בחירת הקול, שם ההמתנה במקומה. */
  var _v=deviceVoice(), _lang=(_v&&_v.lang)||LANGS[LG].tts;
  var _segs=segments(String(text)), _rate=tuneRate(_lang,state.settings.rate);
  var _pitch=femLift(_v);
  /* המקטע הראשון יוצא כאן, בתוך הלחיצה. השאר נשרשרים מ-onend. */
  (function sayseg(k){
    if(my!==_sayGen)return;   /* ההקראה הזאת בוטלה — המקטע הבא לא יוצא */
    if(k>=_segs.length){ sayDone(); return }
    var seg=_segs[k];
    try{
      var u=new SpeechSynthesisUtterance(seg.text);
      u.lang=_lang;
      if(_v){ try{ u.voice=_v }catch(e2){} }
      u.rate=_rate; u.pitch=_pitch; u.volume=1;
      u.onboundary=function(e){if(!e.name||e.name==="word")hlAt(seg.start+e.charIndex)};
      u.onend=function(){
        if(k+1<_segs.length) setTimeout(function(){sayseg(k+1)},SEG_GAP);
        else { sayDone() }
      };
      u.onerror=function(e){ttsFail(e&&e.error)};
      speechSynthesis.speak(u);
    }catch(e){}
  })(0);
}
function speak(text){
  if(!state.settings.tts||!text)return;
  /* כל טקסט שמגיע להקראה מנוקה מתגיות. חלק מהקריאות כבר מנקות
     לבד, וניקוי חוזר אינו משנה דבר — אבל בלעדיו כל מחרוזת שנשארה
     עם <sub> או <span class="frac"> הוקראה בקול כתגית: הסטודנט
     שמע "span class frac" באמצע השאלה. */
  text=plainOf(String(text));
  stopSpeak();
  /* מדברים — וכפתור ההקראה בכרטיס מתחלף לעצירה */
  saying=true; if(view==="practice")render();
  speakDevice(text);
}
function stopSpeak(){
  hlClear();
  _sayGen++; saying=false;   /* כל מקטע שממתין ב-setTimeout שייך מעכשיו לדור ישן */
  try{if(window.speechSynthesis)speechSynthesis.cancel()}catch(e){}
}
/* עוזבים את הדף — הקול נעצר. בלעדיו הוא ממשיך ברקע אחרי מעבר לטאב
   אחר, ולפעמים נתקע עד סגירת הדפדפן. */
try{document.addEventListener("visibilitychange",function(){
  if(document.hidden)stopSpeak();
});}catch(e){}
/* iOS לא ישמיע כלום עד שאמירה אחת יצאה מתוך handler של מגע אמיתי.
   אמירה אוטומטית בטעינת הדף נבלעת בשקט — בלי חריגה, בלי לוג, בלי
   דרך לדעת. משחררים פעם אחת עם אמירה ריקה.
   חשוב: קריאה ישירה, בלי voicesReady — הבטחה שוברת את שרשרת המגע
   ו-Safari כבר לא יזהה את האמירה כיוזמת משתמש. */
try{document.addEventListener("pointerdown",function(){

},{once:true});}catch(e){}

/* ============================================================
   7. מ-HTML לטקסט מדובר
   המחוללים כותבים את המתמטיקה כ-HTML (שברים אמיתיים, חזקות
   מוגבהות). הפונקציות כאן הופכות אותו לטקסט פשוט להשוואה,
   ומשם לעברית מדוברת להקראה.
   ============================================================ */
function plainOf(html){
  var s=String(html);
  s=s.replace(/<span class="frac"><span>(.*?)<\/span><span>(.*?)<\/span><\/span>/g,"($1)/($2)");
  s=s.replace(/<sup>(.*?)<\/sup>/g,"^$1");
  s=s.replace(/<sub>(.*?)<\/sub>/g,"_$1");
  s=s.replace(/<br\s*\/?>/g," ");
  s=s.replace(/<[^>]+>/g,"");
  s=s.replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"');
  return s.replace(/\s+/g," ").trim();
}
/* מ-״3x + 5 = 20״ ל-״שלוש איקס ועוד חמש שווה עשרים״.
   הסדר כאן חשוב: קודם מבנים מורכבים (שברים, חזקות, שורשים),
   ורק אחר כך סימנים בודדים ואותיות. */
var SAY_MAP=[
  /* שבר שהגיע מ-plainOf בצורה (3)/(4) */
  [/\(([^()]{1,14})\)\s*\/\s*\(([^()]{1,14})\)/g,"$1 חלקי $2"],
  /* שמות פונקציות לפני מיפוי אותיות בודדות */
  [/\bsin/gi," סינוס "],[/\bcos/gi," קוסינוס "],[/\btan/gi," טנגנס "],
  /* חזקות */
  [/\^2\b/g," בריבוע "],[/\^3\b/g," בשלישית "],[/\^\(?([−–-]?\d+)\)?/g," בחזקת $1 "],
  [/²/g," בריבוע "],[/³/g," בשלישית "],
  /* אינדקסים תחתונים: a₁ , aₙ , Sₙ */
  [/₁/g," אחת "],[/₂/g," שתיים "],[/₃/g," שלוש "],[/ₙ/g," אן "],
  /* שורש */
  [/(\d)\s*√/g,"$1 כפול √"],[/√/g," שורש של "],
  /* סימנים מיוחדים */
  [/π/g," פאי "],[/°/g," מעלות "],[/α/g," אלפא "],[/β/g," בטא "],[/Δ/g," דלתא "],
  [/≈/g," בערך "],[/≠/g," לא שווה "],[/≤/g," קטן או שווה "],[/≥/g," גדול או שווה "],
  [/→/g," ולכן "],
  /* יחס — רק בין מספרים או x, כדי לא לפגוע בנקודתיים בעברית */
  [/([\dx])\s*:\s*([\dx])/g,"$1 ל $2"],
  /* השוואה */
  [/=/g," שווה "],[/</g," קטן מ "],[/>/g," גדול מ "],
  /* כפל מרומז: 3(x+2) וגם (x+1)(x+2) */
  [/(\d)\s*\(/g,"$1 כפול ("],[/\)\s*\(/g,") כפול ("],
  /* פעולות */
  [/\+/g," ועוד "],[/[−–-]/g," מינוס "],[/[×·]/g," כפול "],[/÷/g," חלקי "],
  [/\//g," חלקי "],[/%/g," אחוז "],
  /* מפרידים בין מספר לאות, כדי שגבול־מילה יעבוד על האות */
  [/(\d)([a-zA-Z])/g,"$1 $2"],
  /* אותיות בודדות בשמן העברי */
  /* שמות האותיות בלי ניקוד — חלק ממנועי ההקראה מועדים עליו.
     איפה שלאות יש משמעות קבועה בנוסחה, אומרים את המשמעות. */
  [/\bx\b/g," איקס "],[/\by\b/g," וואי "],[/\bn\b/g," אן "],[/\bd\b/g," די "],

var SAY_MAP_AR=[

  [/\+/g," زائد "],[/[−–-]/g," ناقص "],[/[×·]/g," في "],[/÷/g," على "],

  [/⁻/g," ناقص "],[/⁺/g," زائد "],[/ᵃ/g," إيه "],[/ᵇ/g," بي "],[/⁰/g," صفر "],[/¹/g," واحد "],
  [/√/g," جذر "],[/π/g," پاي "],[/°/g," درجة "],[/Δ/g," دلتا "],[/%/g," بالمئة "],[/→/g," إذن "],
  [/α/g," ألفا "],[/β/g," بيتا "],[/[×·]/g," في "],[/÷/g," على "],[/≈/g," تقريبًا "],

/* טקסט הסבר הוא עברית רגילה שמשובצים בה סימנים בודדים. כאן מתרגמים
   רק את מה שחד־משמעי — מקף בעברית הוא מקף, לא מינוס. */
var PROSE_MAP=[
  [/²/g," בריבוע "],[/³/g," בשלישית "],[/₁/g," אחת "],[/₂/g," שתיים "],[/₃/g," שלוש "],[/ₙ/g," אן "],
  /* מעריכים מוגבהים ביוניקוד, כמו x⁻ᵃ */
  [/⁻/g," מינוס "],[/⁺/g," ועוד "],[/ᵃ/g," איי "],[/ᵇ/g," בי "],[/⁰/g," אפס "],[/¹/g," אחת "],

     מקף רגיל נשאר מקף — "ה-3" הוא לא חיסור. */
  [/[−–]/g," מינוס "],[/=/g," שווה "],[/\+/g," ועוד "],[/\//g," חלקי "],
  [/\bsin/gi," סינוס "],[/\bcos/gi," קוסינוס "],[/\btan/gi," טנגנס "]

function speakProse(t){
  /* הטקסט מגיע לכאן בעברית, כי כך הוא נשמר בקוד. התרגום קורה
     בתצוגה, ולכן ההקראה חייבת לעבור אותו בעצמה — אחרת המסך בערבית
     והקול אומר עברית. */
  t=_(String(t||""));
  var s=String(t),i,M=(LG==="ar")?PROSE_MAP_AR:PROSE_MAP;
  for(i=0;i<M.length;i++)s=s.replace(M[i][0],M[i][1]);

/* ============================================================
   8. עזרי בנייה למחוללים
   ============================================================ */
function S(t,d,m){return {t:t,d:d||"",m:m||""}}         /* צעד בפתרון */
function W(h,why){return {h:String(h),why:why||""}}      /* מסיח + הטעות שהוא מייצג */

/* בורר מסיחים כללי — אותו רעיון כמו frWrong, לכל סוג תשובה.
   כל מועמד הוא [תצוגה, ההסבר לטעות]. מועמד שנראה על המסך בדיוק
   כמו התשובה הנכונה, או כמו מסיח שכבר נבחר, נזרק ובמקומו נכנס הבא
   בתור. לכן רשימות המועמדים ארוכות משלושה: בהגרלות מסוימות שתי
   טעויות שונות נותנות בדיוק אותו מספר, ובלי מלאי המשך השאלה הוצגה
   בשלוש אפשרויות — ניחוש של אחד משלושה במקום אחד מארבעה. */
function wSel(ansH,cands){
  var out=[],seen={},i,p;
  seen[plainOf(String(ansH))]=1;
  for(i=0;i<cands.length&&out.length<3;i++){
    if(!cands[i]||cands[i][0]===null||cands[i][0]===undefined)continue;
    p=plainOf(String(cands[i][0]));
    if(!p||badStr(p)||seen[p])continue;
    seen[p]=1;
    out.push(W(cands[i][0],cands[i][1]));
  }
  return out;
}

/* ============================================================
   9. מחוללי השאלות — היסודות
   כל מחולל מחזיר שאלה שלמה: ניסוח, תשובה, מסיחים שכל אחד
   מהם הוא טעות אמיתית שתלמידים עושים, ופתרון מלא צעד־צעד.
   ============================================================ */

/* --- מספר בסוגריים כשהוא שלילי, כמו שכותבים במחברת --- */
function pn(v){return v<0?"("+num(v)+")":String(v)}

/* ---------- 1. מספרים מכוונים ---------- */
function genNeg(L){
  var a,b,c,res,expr,steps,wrong;
  if(L===1){
    a=rnz(-20,20);b=rnz(-20,20);
    /* בלי מינוס אחד לפחות אין כאן שאלה על מספרים מכוונים,
       וגם המסיחים קורסים כי כולם מתלכדים עם התשובה. */
    while(a>0&&b>0)b=rnz(-20,-1);
    var op=pick(["+","−"]);
    res=op==="+"?a+b:a-b;
    expr=num(a)+" "+op+" "+pn(b);
    var eff=op==="+"?b:-b;
    steps=[
      S("כותבים את זה כחיבור אחד",
        op==="−"?"חיסור של מספר זה חיבור של ההפך שלו. מינוס ומינוס נותנים פלוס.":"כבר יש כאן חיבור.",
        num(a)+" + "+pn(eff)),
      S((a<0)===(eff<0)?"אותו סימן — מחברים":"סימנים שונים — מחסרים",
        (a<0)===(eff<0)
          ? "שני המספרים לאותו כיוון, אז מחברים את הגדלים ושומרים על הסימן."
          : "המספרים לכיוונים הפוכים, אז מחסרים את הקטן מהגדול והתוצאה מקבלת את הסימן של הגדול.",
        (a<0)===(eff<0)
          ? Math.abs(a)+" + "+Math.abs(eff)+" = "+(Math.abs(a)+Math.abs(eff))
          : Math.max(Math.abs(a),Math.abs(eff))+" − "+Math.min(Math.abs(a),Math.abs(eff))+" = "+Math.abs(res)),
      S("התשובה","",num(a)+" "+op+" "+pn(b)+" = "+num(res))
    ];
    /* המסיחים נבנים מ-eff, האיבר השני אחרי הפיכת החיסור לחיבור.
       כשהם נבנו מ-b עצמו, |a| − |b| יצא בדיוק התשובה הנכונה
       ו-|a| + |b| חזר על המסיח שלפניו. */
    wrong=wSel(num(res),[
      [num(-res),"הפכתם את הסימן של התוצאה. שווה לבדוק שוב איזה מהמספרים גדול יותר בערכו המוחלט."],
      [num(a-eff),op==="−"?"חיברתם במקום לחסר.":"חיסרתם במקום לחבר."],
      [num(eff-a),"חיסרתם בכיוון ההפוך — את המספר הראשון מהשני."],
      [num(Math.abs(a)+Math.abs(eff)),"חיברתם את הגדלים בלי להתחשב בסימנים בכלל."],
      [num(Math.abs(a)-Math.abs(eff)),"חיסרתם את הגדלים והתעלמתם מהסימנים."],
      [num(Math.abs(eff)-Math.abs(a)),"חיסרתם את הגדלים בסדר ההפוך, וגם התעלמתם מהסימנים."],
      [num(a),"השארתם את המספר הראשון כמו שהוא, כאילו השני שווה לאפס."],
      [num(eff),"השארתם את המספר השני בלבד ושכחתם את הראשון."]
    ]);
    return {ask:"חשבו",expr:expr,ans:W(num(res)),wrong:wrong,steps:steps,rule:"neg",
      hint:"חיסור זה חיבור של ההפך. אחרי זה שאלו: שני המספרים לאותו כיוון או לכיוונים הפוכים?"};
  }
  if(L===2){
    var mulMode=Math.random()<0.5;
    if(mulMode){
      a=rnz(-12,12);b=rnz(-12,12);res=a*b;
      expr=pn(a)+" × "+pn(b);
      steps=[
        S("קודם הגודל","מכפילים את המספרים בלי הסימנים.",Math.abs(a)+" × "+Math.abs(b)+" = "+Math.abs(res)),
        S("עכשיו הסימן",
          (a<0)===(b<0)?"שני סימנים זהים — התוצאה חיובית.":"סימן אחד שלילי — התוצאה שלילית.",
          "התוצאה: "+num(res)),
        S("התשובה","",expr+" = "+num(res))
      ];
    }else{
      b=rnz(-12,12);res=rnz(-12,12);a=b*res;
      expr=pn(a)+" ÷ "+pn(b);
      steps=[
        S("קודם הגודל","מחלקים בלי הסימנים.",Math.abs(a)+" ÷ "+Math.abs(b)+" = "+Math.abs(res)),
        S("עכשיו הסימן",
          (a<0)===(b<0)?"שני סימנים זהים — התוצאה חיובית.":"סימן אחד שלילי — התוצאה שלילית.",
          "התוצאה: "+num(res)),
        S("התשובה","",expr+" = "+num(res))
      ];
    }
    /* מסיחים: טעות סימן, בלבול בפעולה, סימן שנלקח רק מהמספר הראשון,
       ולבסוף קירוב שגוי — כדי שתמיד יישארו שלושה נבדלים. */
    wrong=wSel(num(res),[
      [num(-res),"הסימן התהפך. הכלל: שני סימנים זהים נותנים פלוס, סימנים שונים נותנים מינוס."],
      [num(mulMode?a+b:a*b),mulMode?"חיברתם במקום להכפיל.":"הכפלתם במקום לחלק."],
      [num((a<0?-1:1)*Math.abs(res)),"לקחתם את הסימן מהמספר הראשון בלבד. בכפל ובחילוק שני הסימנים משתתפים."],
      [num(-(mulMode?a+b:a*b)),mulMode?"חיברתם במקום להכפיל, וגם הסימן יצא הפוך.":"הכפלתם במקום לחלק, וגם הסימן יצא הפוך."],
      [num(a-b),mulMode?"חיסרתם במקום להכפיל.":"חיסרתם במקום לחלק."],
      [num(a+b),mulMode?"חיברתם במקום להכפיל.":"חיברתם במקום לחלק."],
      [num(res+(res>0?1:-1)*Math.abs(mulMode?a:b)),"טעות בגודל המכפלה. שווה לחשב שוב בלי הסימנים ורק אז להוסיף אותם."]
    ]);
    return {ask:"חשבו",expr:expr,ans:W(num(res)),wrong:wrong,steps:steps,rule:"neg",
      hint:"בכפל ובחילוק הסימן נקבע לבד: זהים → פלוס, שונים → מינוס."};
  }
  /* רמה 4 — סדר פעולות מלא, כולל החזקה. ברמות 1–3 נאמר איזו פעולה
     עושים; כאן יש ארבע פעולות ואיש אינו אומר במה מתחילים. */
  if(L===4){
    a=rnz(-9,9);b=rnz(-9,9);c=rnz(-6,6);var d4=rnz(-6,6);
    while(b===a)b=rnz(-9,9);               /* סוגריים שמתאפסים מוחקים את כל השאלה */
    while(d4===1)d4=rnz(-6,6);             /* d=1 מזהה מסיח עם התשובה */
    var sq=(a-b)*(a-b);
    res=sq+c*d4;
    expr="("+num(a)+" − "+pn(b)+")<sup>2</sup> + "+pn(c)+" · "+pn(d4);
    steps=[
      S("קודם מה שבתוך הסוגריים","בסדר הפעולות הסוגריים קודמים להכול — גם לחזקה.",
        num(a)+" − "+pn(b)+" = "+num(a-b)),
      S("אחר כך החזקה",
        a-b<0?"מספר שלילי בריבוע יוצא חיובי: מינוס כפול מינוס נותן פלוס.":"מעלים בריבוע את מה שיצא מהסוגריים.",
        "("+num(a-b)+")<sup>2</sup> = "+sq),
      S("עכשיו הכפל","כפל קודם לחיבור, גם כשהוא כתוב אחרון.",pn(c)+" · "+pn(d4)+" = "+num(c*d4)),
      S("ולבסוף החיבור","",sq+sgn(c*d4)+" = "+num(res))
    ];
    wrong=[
      W(num(a*a-b*b+c*d4),"העליתם כל מספר בסוגריים בריבוע בנפרד. (a − b)² אינו a² − b²."),
      W(num(-sq+c*d4),"הריבוע יצא שלילי. מספר בריבוע לעולם אינו שלילי, גם כשהבסיס שלילי."),
      W(num(sq-c*d4),"טעות בסימן המכפלה. שני סימנים זהים נותנים פלוס, סימנים שונים נותנים מינוס."),
      W(num((sq+c)*d4),"חישבתם משמאל לימין. הכפל קודם לחיבור, גם כשהוא כתוב אחרון."),
      W(num(2*(a-b)+c*d4),"הכפלתם את הסוגריים בשתיים. העלאה בריבוע היא כפל של הביטוי בעצמו, ולא כפל בשתיים."),
      /* שני מסיחי מילוי. בלעדיהם, בהגרלות שבהן a − b יוצא 1 או 2,
         חלק מהמסיחים מתלכדים והשאלה הוצגה בשלוש אפשרויות. */
      W(num((a-b)+c*d4),"דילגתם על החזקה. מה שבסוגריים מועלה בריבוע לפני הכפל."),
      W(num(sq+c+d4),"חיברתם את שני המספרים האחרונים במקום להכפיל אותם.")
    ];
    return {ask:"חשבו",expr:expr,ans:W(num(res)),wrong:wrong,steps:steps,rule:"order",
      hint:"ארבע פעולות בתרגיל אחד. הסדר הוא סוגריים, אחר כך חזקה, אחר כך כפל, והחיבור אחרון."};
  }
  a=rnz(-12,12);b=rnz(-9,9);c=rnz(-9,9);
  res=a+b*c;
  expr=num(a)+" + "+pn(b)+" × "+pn(c);
  steps=[
    S("קודם כפל","בסדר פעולות החשבון כפל וחילוק קודמים לחיבור וחיסור.",pn(b)+" × "+pn(c)+" = "+num(b*c)),
    S("עכשיו החיבור","מציבים בחזרה ומחברים.",num(a)+" + "+pn(b*c)+" = "+num(res)),
    S("התשובה","",expr+" = "+num(res))
  ];
  wrong=wSel(num(res),[
    [num((a+b)*c),"חישבתם משמאל לימין. כפל תמיד קודם לחיבור, גם אם הוא כתוב אחריו."],
    [num(a-b*c),"החלפתם את סימן המכפלה בשלב החיבור."],
    [num(a*b+c),"הכפלתם את הזוג הלא נכון. הכפל שכתוב הוא בין שני המספרים האחרונים."],
    [num(a+b+c),"חיברתם את שלושת המספרים. באמצע יש כפל, ולא חיבור."],
    [num(b*c),"חישבתם רק את הכפל ושכחתם להוסיף את המספר הראשון."],
    [num(a*b*c),"הכפלתם את שלושת המספרים. באמצע יש כפל, אבל בהתחלה יש חיבור."]
  ]);
  return {ask:"חשבו",expr:expr,ans:W(num(res)),wrong:wrong,steps:steps,rule:"order",
    hint:"סדר פעולות: קודם כפל וחילוק, ורק אחר כך חיבור וחיסור."};
}

/* ---------- 2. פתיחת סוגריים וכינוס איברים ---------- */
function genExpand(L){
  var a,b,c,d,steps,wrong,expr,ansH;
  if(L===1){
    a=rnz(-8,8);b=rnz(-9,9);
    expr=fac(a)+"(x"+sgn(b)+")";
    ansH=coef(a,"x")+sgn(a*b);
    steps=[
      S("מכפילים את המספר שבחוץ בכל איבר בפנים","הסוגריים אומרים: כל מה שבפנים מוכפל במה שבחוץ. בלי לדלג על האיבר השני.",
        num(a)+"·x "+(a*b<0?"−":"+")+" "+Math.abs(a)+"·"+Math.abs(b)),
      S("מחשבים כל מכפלה","",coef(a,"x")+sgn(a*b)),
      S("התשובה","",expr+" = "+coef(a,"x")+sgn(a*b))
    ];
    wrong=wSel(ansH,[
      [coef(a,"x")+sgn(b),"הכפלתם רק את ה-x ושכחתם להכפיל גם את המספר השני שבסוגריים."],
      [coef(a,"x")+sgn(-a*b),"טעות סימן במכפלה של שני המספרים."],
      [a+b===0?"0":coef(a+b,"x"),"חיברתם את שני המספרים במקום להכפיל. הסוגריים כאן מסמנים כפל."],
      ["x"+sgn(a*b),"הכפלתם את המספר שבפנים ושכחתם להכפיל גם את ה-x."],
      [coef(a,"x")+(a+b===0?"":sgn(a+b)),"חיברתם את המספר שבחוץ עם המספר שבפנים במקום להכפיל אותם."]
    ]);
    return {ask:"פתחו את הסוגריים",expr:expr,ans:W(ansH),wrong:wrong,steps:steps,rule:"dist",
      hint:"כל איבר בתוך הסוגריים מוכפל במספר שבחוץ — גם ה-x וגם המספר."};
  }
  if(L===2){
    a=rnz(-6,6);b=rnz(-8,8);c=rnz(-6,6);d=rnz(-8,8);
    while(a+c===0)c=rnz(-6,6);                 /* לא משאירים ביטוי בלי x */
    var xc=a+c,kc=a*b+c*d;
    expr=fac(a)+"(x"+sgn(b)+") "+(c<0?"−":"+")+" "+(Math.abs(c)===1?"":Math.abs(c))+"(x"+sgn(d)+")";
    /* אותה כתיבה לתשובה ולמסיחים. כשהמסיחים נכתבו ישירות, מסיח
       שהאיבר החופשי שלו יצא אפס הוצג כ״4x + 0״ — כתיב שאיש אינו
       כותב, ולכן אפשרות שאפשר לפסול בלי לחשב. */
    var lin2=function(cx,ck){return (cx===0?"":coef(cx,"x"))+(ck===0?(cx===0?"0":""):sgn(ck))};
    ansH=lin2(xc,kc);
    steps=[
      S("פותחים כל זוג סוגריים בנפרד","",coef(a,"x")+sgn(a*b)+"  ,  "+coef(c,"x")+sgn(c*d)),
      S("אוספים את איברי ה-x","רק איברים מאותו סוג מתחברים: x עם x, מספר עם מספר.",
        coef(a,"x")+term(c,"x")+" = "+coef(xc,"x")),
      S("אוספים את המספרים","",num(a*b)+sgn(c*d)+" = "+num(kc)),
      S("התשובה","",ansH)
    ];
    wrong=wSel(ansH,[
      [lin2(xc,a*b+d),"בסוגריים השניים הכפלתם רק את ה-x ולא את המספר."],
      [lin2(xc,a*b-c*d),"טעות סימן כשפתחתם את הסוגריים השניים."],
      [lin2(a*c,kc),"הכפלתם את מקדמי ה-x זה בזה במקום לחבר אותם."],
      [lin2(xc,c*d-a*b),"טעות סימן כשפתחתם את הסוגריים הראשונים."],
      [lin2(xc,a*b),"שכחתם לגמרי את המספר שבזוג הסוגריים השני."],
      [lin2(xc,b+d),"לא הכפלתם את המספרים שבתוך הסוגריים במקדמים שלפניהם."]
    ]);
    return {ask:"פתחו וכנסו איברים דומים",expr:expr,ans:W(ansH),wrong:wrong,steps:steps,rule:"dist",
      hint:"קודם פותחים את שני זוגות הסוגריים, ורק אחר כך אוספים x עם x ומספר עם מספר."};
  }
  /* רמה 4 — שתי נוסחאות כפל מקוצר בתרגיל אחד, ומינוס לפני הסוגריים
     השניים. לא נאמר באיזו נוסחה להשתמש ולא באיזה סדר. */
  if(L===4){
    a=rnz(-7,7);b=ri(2,7);
    while(Math.abs(a)===b)b=ri(2,7);       /* a² = b² מאפס את האיבר החופשי במסיח */
    var kk=a*a+b*b,k2=a*a-b*b;
    expr="(x"+sgn(a)+")<sup>2</sup> − (x"+sgn(b)+")(x − "+b+")";
    ansH=coef(2*a,"x")+sgn(kk);
    steps=[
      S("פותחים את הריבוע","ריבוע של סוגריים אינו ריבוע של כל איבר בנפרד. יש גם איבר אמצעי, וזה מה שהכי הרבה נשכח.",
        "(x"+sgn(a)+")<sup>2</sup> = x<sup>2</sup>"+term(2*a,"x")+" + "+(a*a)),
      S("פותחים את המכפלה השנייה","(x + b)(x − b) = x² − b². אין כאן איבר אמצעי — הוא מתבטל.",
        "x<sup>2</sup> − "+(b*b)),
      S("מחסרים את הסוגריים השניים כולם","מינוס לפני סוגריים הופך את הסימן של כל איבר בתוכם, גם של השני.",
        "x<sup>2</sup>"+term(2*a,"x")+" + "+(a*a)+" − x<sup>2</sup> + "+(b*b)),
      S("מכנסים איברים דומים","שני איברי x² מתבטלים זה עם זה.",ansH)
    ];
    wrong=[
      W(coef(2*a,"x")+sgn(k2),"המינוס לפני הסוגריים השניים חל על שני האיברים שבתוכם, ולא רק על הראשון."),
      W("x<sup>2</sup>"+term(2*a,"x")+sgn(kk),"לא צמצמתם: x² מופיע פעמיים עם סימנים הפוכים והוא מתבטל."),
      W(coef(a,"x")+sgn(kk),"האיבר האמצעי בפתיחת הריבוע הוא כפול המכפלה, ולא המכפלה עצמה."),
      W(coef(2*a,"x")+sgn(-kk),"טעות סימן באיבר החופשי.")
    ];
    return {ask:"פשטו את הביטוי",expr:expr,ans:W(ansH),wrong:wrong,steps:steps,rule:"short",
      hint:"יש כאן שתי נוסחאות כפל מקוצר שונות. פותחים כל אחת בנפרד, ורק אחר כך מחסרים ומכנסים."};
  }
  a=rnz(-9,9);b=rnz(-9,9);
  expr="(x"+sgn(a)+")(x"+sgn(b)+")";
  var mid=a+b,last=a*b;
  ansH="x<sup>2</sup>"+(mid===0?"":term(mid,"x"))+(last===0?"":sgn(last));
  steps=[
    S("מכפילים כל איבר בכל איבר","ארבע מכפלות: ראשון·ראשון, ראשון·שני, שני·ראשון, שני·שני.",
      "x·x "+(a<0?"−":"+")+" "+Math.abs(a)+"·x "+(b<0?"−":"+")+" "+Math.abs(b)+"·x "+(last<0?"−":"+")+" "+Math.abs(last)),
    S("אוספים את שני איברי ה-x","",coef(a,"x")+term(b,"x")+" = "+coef(mid,"x")),
    S("התשובה","",ansH)
  ];
  wrong=wSel(ansH,[
    ["x<sup>2</sup>"+(last===0?"":sgn(last)),"שכחתם את האיבר האמצעי. יש שתי מכפלות שנותנות x, וצריך לחבר אותן."],
    ["x<sup>2</sup>"+(mid===0?"":term(mid,"x")),"שכחתם את המכפלה של שני המספרים."],
    ["x<sup>2</sup>"+(mid===0?"":term(mid,"x"))+(last===0?"":sgn(-last)),"טעות סימן במכפלת שני המספרים."],
    ["x<sup>2</sup>"+(last===0?"":term(last,"x"))+(mid===0?"":sgn(mid)),"החלפתם בין הסכום למכפלה: האיבר האמצעי הוא הסכום, והאחרון הוא המכפלה."],
    mid===0?null:["x<sup>2</sup>"+term(mid,"x")+sgn(mid),"האיבר האחרון הוא מכפלת שני המספרים, ולא הסכום שלהם."]
  ]);
  return {ask:"פתחו את הסוגריים",expr:expr,ans:W(ansH),wrong:wrong,steps:steps,rule:"binom",
    hint:"(x+a)(x+b) = x² + (a+b)x + a·b — האיבר האמצעי הוא סכום, האחרון הוא מכפלה."};
}
/* ---------- 3. משוואות ממעלה ראשונה ---------- */
/* מועמדי המסיחים של a(x + b) = c(x + d). */
function candLin3(a,b,c,d,x){
  return [
    ["x = "+num(-x),"הסימן התהפך — כדאי לבדוק את החיסור של המקדמים."],
    [a+c===0?null:"x = "+num(r2((c*d-a*b)/(a+c))),"חיברתם את מקדמי ה-x במקום לחסר. איבר שעובר צד מחליף סימן."],
    ["x = "+num(r2((c*d+a*b)/(a-c))),"בפתיחת הסוגריים בצד שמאל נשמר הסימן במקום להתהפך."],
    ["x = "+num(r2((c*d-b)/(a-c))),"בסוגריים השמאליים הכפלתם רק את ה-x ולא את המספר שלידו."],
    ["x = "+num(r2((d-b)/(a-c))),"בשני זוגות הסוגריים הכפלתם רק את ה-x ולא את המספר שלידו."],
    ["x = "+num(c*d-a*b),"עצרתם צעד מוקדם מדי — נשאר לחלק במקדם של x."]
  ];
}
/* מועמדי המסיחים של ax + b = cx + d. a + c = 0 נותן חלוקה באפס,
   והמסיח היה יוצא ״x = Infinity״ ונשמט בשקט — לכן הוא מסונן כאן. */
function candLin2(a,b,c,d,x){
  return [
    [num(r2((d+b)/(a-c))),"המספר לא החליף סימן כשעבר צד."],
    [a+c===0?null:num(r2((d-b)/(a+c))),"חיברתם את מקדמי ה-x במקום לחסר אותם. איבר שעובר צד מחליף סימן."],
    [num(-x),"הסימן של התשובה התהפך בשלב החילוק."],
    [num(d-b),"עצרתם צעד מוקדם מדי — נשאר לחלק במקדם של x."],
    [num(r2((d-b)*(a-c))),"הכפלתם במקדם במקום לחלק בו."],
    [num(r2((b-d)/(a-c))),"חיסרתם בכיוון ההפוך — את המספר שבאגף ימין מזה שבאגף שמאל."],
    [a+c===0?null:num(r2((d+b)/(a+c))),"גם המספר לא החליף סימן וגם מקדמי ה-x חוברו במקום להתחסר."]
  ];
}
/* מועמדי המסיחים של ax + b = c. הרשימה ארוכה משלושה כי בהגרלות
   מסוימות כמה טעויות שונות נותנות בדיוק אותו מספר. */
function candLin1(a,b,c,x){
  return [
    [num(r2((c+b)/a)),"העברתם את "+num(b)+" לצד השני בלי להחליף סימן."],
    [num(c-b),"עצרתם צעד מוקדם מדי — נשאר לחלק במקדם של x."],
    [num((c-b)*a),"הכפלתם במקדם במקום לחלק בו."],
    [num(r2((b-c)/a)),"חיסרתם בכיוון ההפוך — את המספר שבאגף ימין מזה שבאגף שמאל."],
    [num(r2(c/a)),"התעלמתם מהמספר שבאגף שמאל. קודם מעבירים אותו לצד השני, ורק אז מחלקים במקדם."],
    [num(c+b),"לא החלפתם סימן במעבר האגף, וגם עצרתם לפני החלוקה במקדם."],
    [num(-x),"הסימן של התשובה התהפך בשלב החילוק."]
  ];
}
function genLinear(L){
  var a,b,c,d,x,steps,wrong,expr;
  if(L===1){
    /* ההגרלה נבדקת גם על המסיחים. כשהמקדם הוא 1 או −1 כל הטעויות
       הסבירות מצטמצמות לאותם שניים־שלושה מספרים, ואם גם האגף הימני
       מתאפס נשארים שניים בלבד. במקרה כזה מגרילים מחדש, במקום להמציא
       מסיח שאינו טעות אמיתית של תלמיד. */
    var t1=0;
    do{
      a=rnz(-9,9);x=rnz(-12,12);b=rnz(-20,20);c=a*x+b;
      wrong=wSel(num(x),candLin1(a,b,c,x));
      t1++;
    }while(wrong.length<3&&t1<80);
    expr=coef(a,"x")+sgn(b)+" = "+num(c);
    steps=[
      S("מעבירים את המספר לצד השני","מה שעובר צד — מחליף סימן. "+num(b)+" עובר ונהיה "+num(-b)+".",
        coef(a,"x")+" = "+num(c)+sgn(-b)),
      S("מסכמים את הצד הימני","",coef(a,"x")+" = "+num(c-b)),
      S("מחלקים במקדם של x","",	"x = "+num(c-b)+" ÷ "+pn(a)),
      S("התשובה","","x = "+num(x))
    ];
    return {ask:"פתרו את המשוואה",expr:expr,ans:W("x = "+num(x)),wrong:wrong.map(function(w){return W("x = "+w.h,w.why)}),
      steps:steps,rule:"lin",hint:"קודם מכניסים את כל המספרים לצד אחד ואת ה-x לצד השני, ורק בסוף מחלקים במקדם."};
  }
  if(L===2){
    /* c = 0 הציג את המשוואה כ״0x + 22״ — אגף שאין בו x בכלל, ולא
       מה שרמה 2 אמורה לתרגל. וכמו ברמה 1, ההגרלה נבדקת גם על
       המסיחים: יש צירופים שבהם כולם מתלכדים לשני מספרים. */
    var t2=0;
    do{
      x=rnz(-10,10);a=rnz(-8,8);c=rnz(-8,8);
      while(a===c||c===0)c=rnz(-8,8);
      b=rnz(-20,20);d=(a-c)*x+b;
      wrong=wSel(num(x),candLin2(a,b,c,d,x));
      t2++;
    }while(wrong.length<3&&t2<80);
    /* d = 0 הוצג כ״−4x + 0״ — כתיב שאיש אינו כותב. */
    expr=coef(a,"x")+sgn(b)+" = "+coef(c,"x")+(d===0?"":sgn(d));
    steps=[
      S("כל ה-x לצד אחד","מעבירים את "+coef(c,"x")+" שמאלה, והוא מחליף סימן.",
        coef(a,"x")+term(-c,"x")+sgn(b)+" = "+num(d)),
      S("כל המספרים לצד השני","מעבירים את "+num(b)+" ימינה, גם הוא מחליף סימן.",
        coef(a-c,"x")+" = "+num(d)+sgn(-b)),
      S("מסכמים","",coef(a-c,"x")+" = "+num(d-b)),
      S("מחלקים במקדם","","x = "+num(d-b)+" ÷ "+pn(a-c)+" = "+num(x))
    ];
    return {ask:"פתרו את המשוואה",expr:expr,ans:W("x = "+num(x)),wrong:wrong.map(function(w){return W("x = "+w.h,w.why)}),
      steps:steps,rule:"lin",hint:"מרכזים את כל איברי ה-x בצד אחד ואת כל המספרים בצד השני. כל מעבר צד הופך סימן."};
  }
  /* רמה 4 — שבר בשני האגפים. צריך קודם להיפטר מהמכנים ורק אחר כך
     לפתוח סוגריים ולהעביר אגפים. שלושה כלים, ואיש לא אומר מה ראשון. */
  if(L===4){
    var b4=pick([2,3,4,5]),d4=pick([2,3,4,5]),m4,p4,q4,a4,c4,tr4=0;
    while(b4===d4)d4=pick([2,3,4,5]);
    m4=lcm(b4,d4);p4=m4/b4;q4=m4/d4;
    /* ההגרלה נבדקת גם על המסיחים: בערכים קטנים שלושה מהם מתלכדים
       זה בזה או עם הפתרון, והשאלה הייתה יורדת לשלוש אפשרויות. */
    var okL=function(){
      if(Math.round(c4)!==c4||c4===0||Math.abs(c4)>24)return false;
      var vs=[num(r2((q4*c4+p4*a4)/(p4-q4))),num(r2((q4*c4-p4*a4)/(p4+q4))),
              num(r2((q4*c4-a4)/(p4-q4))),num(-x)],ax=num(x),u,st={};
      for(u=0;u<vs.length;u++)if(vs[u]!==ax)st[vs[u]]=1;
      return Object.keys(st).length>=3;
    };
    x=rnz(-9,9);a4=rnz(-9,9);c4=((p4-q4)*x+p4*a4)/q4;
    while(!okL()&&tr4<300){
      x=rnz(-9,9);a4=rnz(-9,9);c4=((p4-q4)*x+p4*a4)/q4;tr4++;
    }
    if(!okL()){b4=2;d4=3;m4=6;p4=3;q4=2;x=4;a4=2;c4=5}
    expr='<span class="frac"><span>x'+sgn(a4)+'</span><span>'+b4+'</span></span> = '+
         '<span class="frac"><span>x'+sgn(c4)+'</span><span>'+d4+'</span></span>';
    steps=[
      S("נפטרים מהמכנים","מכפילים את שני האגפים במכנה המשותף "+m4+", וכל אחד מהשברים מצטמצם.",
        p4+"(x"+sgn(a4)+") = "+q4+"(x"+sgn(c4)+")"),
      S("פותחים את שני זוגות הסוגריים","המספר שבחוץ מוכפל גם ב-x וגם במספר שלידו.",
        coef(p4,"x")+sgn(p4*a4)+" = "+coef(q4,"x")+sgn(q4*c4)),
      S("מרכזים x בצד אחד ומספרים בצד השני","כל איבר שעובר אגף מחליף סימן.",
        coef(p4-q4,"x")+" = "+num(q4*c4-p4*a4)),
      S("מחלקים במקדם","","x = "+num(q4*c4-p4*a4)+" ÷ "+pn(p4-q4)+" = "+num(x))
    ];
    wrong=[
      W("x = "+num(r2((q4*c4+p4*a4)/(p4-q4))),"מספר שעבר אגף לא החליף סימן."),
      W("x = "+num(r2((q4*c4-p4*a4)/(p4+q4))),"חיברתם את מקדמי ה-x במקום לחסר אותם."),
      W("x = "+num(r2((q4*c4-a4)/(p4-q4))),"הכפלתם במכנה רק את ה-x. המכנה מוכפל בכל מה שמעל קו השבר."),
      W("x = "+num(-x),"טעות סימן בשלב האחרון, כשחילקתם במקדם.")
    ];
    return {ask:"פתרו את המשוואה",expr:expr,ans:W("x = "+num(x)),wrong:wrong,steps:steps,rule:"fraceq",
      hint:"יש כאן גם שברים וגם סוגריים. כל עוד יש מכנים אי אפשר להעביר אגפים — אז מהם מתחילים."};
  }
  /* רמה 3: משוואה עם סוגריים משני הצדדים */
  /* c = 0 הציג ״0(x + 8)״ — אגף שכולו מתאפס, ולא משוואה עם סוגריים
     משני הצדדים. x = 0 מזהה את מסיח היפוך הסימן עם התשובה עצמה.
     ובנוסף ההגרלה נבדקת על המסיחים עצמם: אם אין בה שלושה ערכים
     שונים, מגרילים מחדש. */
  var tries=0;
  do{
    a=rnz(-6,6);b=rnz(-9,9);c=rnz(-6,6);d=rnz(-9,9);
    while(a===c||c===0)c=rnz(-6,6);
    x=(c*d-a*b)/(a-c);
    wrong=isFinite(x)&&Math.round(x)===x?wSel("x = "+num(x),candLin3(a,b,c,d,x)):[];
    tries++;
  }while((!isFinite(x)||Math.round(x)!==x||Math.abs(x)>25||b===d||x===0||wrong.length<3)&&tries<120);
  if(!isFinite(x)||Math.round(x)!==x){a=2;b=3;c=1;d=-4;x=(c*d-a*b)/(a-c);wrong=wSel("x = "+num(x),candLin3(a,b,c,d,x))}
  expr=fac(a)+"(x"+sgn(b)+") = "+fac(c)+"(x"+sgn(d)+")";
  steps=[
    S("פותחים סוגריים בשני הצדדים","המספר שבחוץ מוכפל בכל אחד משני האיברים שבפנים.",
      coef(a,"x")+sgn(a*b)+" = "+coef(c,"x")+sgn(c*d)),
    S("מרכזים x בצד אחד ומספרים בצד השני","",coef(a-c,"x")+" = "+num(c*d-a*b)),
    S("מחלקים במקדם","","x = "+num(c*d-a*b)+" ÷ "+pn(a-c)+" = "+num(x))
  ];
  return {ask:"פתרו את המשוואה",expr:expr,ans:W("x = "+num(x)),wrong:wrong,steps:steps,rule:"lin",
    hint:"קודם פותחים את שני זוגות הסוגריים, ורק אחר כך מעבירים אגפים."};
}

/* ---------- 4. שברים ---------- */
/* בורר מסיחים לשברים. כל מועמד הוא [שבר, ההסבר לטעות]. מועמד שערכו
   שווה לתשובה הנכונה, או למסיח שכבר נבחר, נזרק ובמקומו נכנס הבא
   בתור. בלי הסינון הזה חלק מהשאלות הוצגו עם מסיח שהוא בעצם התשובה
   הנכונה — ובחילוק שני מסיחים היו תמיד אותו מספר. */
function frWrong(ans,cands){
  var out=[],seen={},i,k;
  seen[ans.txt()]=1;
  for(i=0;i<cands.length&&out.length<3;i++){
    if(!cands[i]||!cands[i][0])continue;
    k=cands[i][0].txt();
    if(seen[k])continue;
    seen[k]=1;
    out.push(W(cands[i][0].html(),cands[i][1]));
  }
  return out;
}
function genFrac(L){
  var a,b,c,d,res,steps,wrong,expr;
  if(L===1){
    b=pick([2,3,4,5,6,8,10,12]);d=pick([2,3,4,5,6,8,10,12]);
    a=ri(1,b*2-1);c=ri(1,d*2-1);
    while(a%b===0)a=ri(1,b*2-1);           /* שומרים על שבר אמיתי ולא על מספר שלם */
    while(c%d===0)c=ri(1,d*2-1);
    var plus=Math.random()<0.55;
    var f1=fr(a,b),f2=fr(c,d);
    /* שני שברים זהים — X + X — הם המקרה היחיד שבו רשימת המועמדים
       אינה מספיקה: ״מונה עם מונה ומכנה עם מכנה״ מחזיר את X עצמו,
       ומכפלת המונים מחזירה את התשובה בדיוק. מגרילים את השבר השני
       מחדש. המקרה של מכנים שווים נשמר — 1/2 + 3/2 עדיין מוגרל. */
    var gd=0;
    while(f1.eq(f2)&&gd<60){gd++;c=ri(1,d*2-1);if(c%d===0)continue;f2=fr(c,d)}
    if(f1.eq(f2)){d=f1.d===2?3:2;c=1;f2=fr(c,d)}
    /* בחיסור משאירים את הגדול קודם, כדי לא לפתוח את רמת הבסיס בתוצאה שלילית */
    if(!plus&&f1.val()<=f2.val()){var sw=f1;f1=f2;f2=sw;a=f1.n;b=f1.d;c=f2.n;d=f2.d}
    res=plus?f1.add(f2):f1.sub(f2);
    if(res.n===0){plus=true;res=f1.add(f2)}
    a=f1.n;b=f1.d;c=f2.n;d=f2.d;
    /* המכנה המשותף מחושב מהמכנים שהתלמיד רואה, אחרי הצמצום.
       כשהוא חושב מהמכנים שלפני הצמצום, השלב הראשון הכריז
       ״המכנה המשותף הקטן ביותר של 2 ו-5 הוא 30״. */
    var m=lcm(b,d);
    expr=f1.html()+(plus?" + ":" − ")+f2.html();
    steps=b===d?[
      S("המכנים כבר שווים","כששני המכנים זהים אין מה להרחיב — עוברים ישר למונים.","מכנה משותף: "+m),
      S("פועלים על המונים בלבד","המכנה נשאר "+m+". רק המונים מתחברים או מתחסרים.",
        a+(plus?" + ":" − ")+c+" = "+(plus?a+c:a-c)),
      S("מצמצמים","",res.html())
    ]:[
      S("מוצאים מכנה משותף","המכנה המשותף הקטן ביותר של "+b+" ו-"+d+" הוא "+m+".","מכנה משותף: "+m),
      S("מרחיבים את שני השברים","מכפילים מונה ומכנה באותו מספר — ערך השבר לא משתנה.",
        rawFr(a*(m/b),m)+(plus?" + ":" − ")+rawFr(c*(m/d),m)),
      S("פועלים על המונים בלבד","המכנה נשאר "+m+". רק המונים מתחברים או מתחסרים.",
        rawFr(plus?a*(m/b)+c*(m/d):a*(m/b)-c*(m/d),m)),
      S("מצמצמים","",res.html())
    ];
    var sg=plus?1:-1,A=a*(m/b),C=c*(m/d);
    wrong=frWrong(res,[
      [fr(a+sg*c,b+d),"חיברתם מונה עם מונה ומכנה עם מכנה. בחיבור וחיסור שברים חייבים מכנה משותף."],
      [fr(a+sg*c,b),"פעלתם על המונים אבל השארתם את המכנה של השבר הראשון."],
      [fr(a+sg*c,m),"מצאתם מכנה משותף, אבל לא הרחבתם את המונים. כשהמכנה גדל — גם המונה חייב לגדול באותו יחס."],
      [fr(A+sg*c,m),"הרחבתם רק את השבר הראשון. שני השברים צריכים להגיע למכנה המשותף."],
      [fr(a+sg*C,m),"הרחבתם רק את השבר השני. שני השברים צריכים להגיע למכנה המשותף."],
      [fr(A+sg*C,b*d),"לקחתם את מכפלת המכנים כמכנה, אבל הרחבתם את המונים לפי המכנה המשותף — שני מכנים שונים באותו חישוב."],
      [fr(a*c,b*d),"הכפלתם את השברים במקום לחבר או לחסר אותם."],
      /* כשהמכנים כבר שווים, חמישה מהמועמדים שלמעלה מצטמצמים
         לתשובה הנכונה עצמה. שני אלה נשענים על המונים בלבד, ולכן הם
         נשארים שונים ממנה גם אז. */
      [fr(a*c,b),plus?"הכפלתם את המונים במקום לחבר אותם, והשארתם את המכנה.":"הכפלתם את המונים במקום לחסר אותם, והשארתם את המכנה."],
      plus?null:[fr(c-a,m),"חיסרתם בכיוון ההפוך — את המונה הראשון מהשני."]
    ]);
    return {ask:"חשבו וצמצמו",expr:expr,ans:W(res.html()),wrong:wrong,steps:steps,rule:"fracadd",
      hint:"אי אפשר לחבר שברים עם מכנים שונים. קודם מכנה משותף, ורק אחר כך פועלים על המונים."};
  }
  if(L===2){
    b=pick([2,3,4,5,6,7,8,9]);d=pick([2,3,4,5,6,7,8,9]);
    a=ri(1,b*2);c=ri(1,d*2);
    while(a%b===0)a=ri(1,b*2);
    while(c%d===0)c=ri(1,d*2);
    var mul=Math.random()<0.5;
    var g1=fr(a,b),g2=fr(c,d);
    /* מכאן ואילך עובדים עם המספרים שמוצגים בשאלה. קודם השאלה
       הראתה 9/8 × 1/2 והשלב הראשון דיבר על 9·2 / 8·4. */
    a=g1.n;b=g1.d;c=g2.n;d=g2.d;
    res=mul?g1.mul(g2):g1.div(g2);
    expr=g1.html()+(mul?" × ":" ÷ ")+g2.html();
    steps=mul?[
      S("בכפל שברים אין צורך במכנה משותף","מונה כפול מונה, מכנה כפול מכנה.",a+"·"+c+" / "+b+"·"+d),
      S("מחשבים","",fr(a*c,1).n+" / "+(b*d)),
      S("מצמצמים","",res.html())
    ]:[
      S("חילוק בשבר = כפל בשבר ההפוך","הופכים את השבר השני — מונה ומכנה מתחלפים — ומכפילים.",
        g1.html()+" × "+fr(d,c).html()),
      S("מכפילים","",a+"·"+d+" / "+b+"·"+c),
      S("מצמצמים","",res.html())
    ];
    wrong=mul?frWrong(res,[
      [fr(a*d,b*c),"הפכתם את השבר השני. הופכים רק בחילוק, לא בכפל."],
      [fr(a+c,b+d),"חיברתם מונים ומכנים. בכפל מכפילים מונה במונה ומכנה במכנה."],
      [fr(a*c,b+d),"המונים הוכפלו אבל המכנים חוברו."],
      [fr(res.d,res.n),"התשובה יצאה הפוכה — מונה ומכנה התחלפו בסוף."],
      [fr(a*d+b*c,b*d),"חיברתם את שני השברים במקום להכפיל אותם."]
    ]):frWrong(res,[
      [fr(a*c,b*d),"הכפלתם ישר בלי להפוך את השבר השני. בחילוק חייבים להפוך."],
      [fr(b*c,a*d),"הפכתם את השבר הראשון במקום את השני."],
      [fr(b*d,a*c),"הפכתם את שני השברים. הופכים רק את זה שאחרי סימן החילוק."],
      [fr(a+c,b+d),"חיברתם מונים ומכנים. זו לא הפעולה שנדרשה כאן."],
      [fr(a*d+b*c,b*d),"חיברתם את שני השברים במקום לחלק ביניהם."]
    ]);
    return {ask:"חשבו וצמצמו",expr:expr,ans:W(res.html()),wrong:wrong,steps:steps,rule:"fracmul",
      hint:mul?"בכפל: מונה כפול מונה, מכנה כפול מכנה. אין מכנה משותף.":"חילוק בשבר הוא כפל בשבר ההפוך."};
  }
  /* רמה 4 — שתי פעולות שונות בתרגיל אחד. הכלל שנבחן כאן אינו איך
     מחברים או איך מכפילים, אלא מה עושים ראשון. */
  if(L===4){
    var h1,h2,h3,pr,r4;
    var da=pick([2,3,4,6]),db=pick([2,3]),dc=pick([2,3,4]);
    h1=fr(ri(1,da-1),da);h2=fr(ri(1,db-1),db);h3=fr(ri(1,dc-1),dc);
    if(Math.random()<0.5){
      /* חיבור וכפל: הכפל קודם */
      pr=h2.mul(h3);r4=h1.add(pr);
      expr=h1.html()+" + "+h2.html()+" · "+h3.html();
      steps=[
        S("קודם הכפל","בסדר הפעולות כפל קודם לחיבור, גם כשהוא כתוב אחרון וגם כשמדובר בשברים.",
          h2.html()+" · "+h3.html()+" = "+pr.html()),
        S("עכשיו החיבור","ורק עכשיו צריך מכנה משותף.",h1.html()+" + "+pr.html()),
        S("מרחיבים למכנה משותף","",rawFr(h1.n*(lcm(h1.d,pr.d)/h1.d),lcm(h1.d,pr.d))+" + "+
          rawFr(pr.n*(lcm(h1.d,pr.d)/pr.d),lcm(h1.d,pr.d))),
        S("מחברים ומצמצמים","",r4.html())
      ];
      wrong=frWrong(r4,[
        [h1.add(h2).mul(h3),"חישבתם משמאל לימין. כפל קודם לחיבור, גם בשברים."],
        [fr(h2.n*h3.n,h2.d+h3.d),"בכפל שברים גם המכנים מוכפלים — הם לא מתחברים."],
        [fr(h1.n+pr.n,h1.d+pr.d),"חיברתם מונה עם מונה ומכנה עם מכנה. בחיבור שברים חייבים מכנה משותף."],
        [h1.mul(h2).add(h3),"הכפלתם את הזוג הלא נכון. סימן הכפל נמצא בין שני השברים האחרונים."],
        [h1.add(h2).add(h3),"חיברתם את שלושת השברים. באמצע יש כפל, לא חיבור."]
      ]);
      return {ask:"חשבו וצמצמו",expr:expr,ans:W(r4.html()),wrong:wrong,steps:steps,rule:"order",
        hint:"יש כאן שתי פעולות שונות. השאלה הראשונה היא לא איך מחברים — אלא מה עושים קודם."};
    }
    /* חיסור בסוגריים ואז חילוק */
    if(h1.val()<=h2.val()){var sw4=h1;h1=h2;h2=sw4}
    if(h1.eq(h2))h2=fr(1,h2.d+1);
    pr=h1.sub(h2);r4=pr.div(h3);
    expr="("+h1.html()+" − "+h2.html()+") ÷ "+h3.html();
    steps=[
      S("קודם מה שבתוך הסוגריים","הסוגריים קודמים לחילוק, ולחיסור שברים צריך מכנה משותף.",
        h1.html()+" − "+h2.html()+" = "+pr.html()),
      S("חילוק בשבר = כפל בשבר ההפוך","הופכים את השבר שאחרי סימן החילוק ומכפילים.",
        pr.html()+" × "+fr(h3.d,h3.n).html()),
      S("מכפילים ומצמצמים","",r4.html())
    ];
    wrong=frWrong(r4,[
      [h1.sub(h2.div(h3)),"התחלתם מהחילוק. הסוגריים קודמים לכל פעולה אחרת."],
      [pr.mul(h3),"הכפלתם בלי להפוך. בחילוק בשבר חייבים להפוך את השבר השני."],
      [fr(h1.n-h2.n,h1.d-h2.d).div(h3),"חיסרתם מונה ממונה ומכנה ממכנה. בחיסור שברים חייבים מכנה משותף."],
      [h3.div(pr),"הפכתם את השבר הלא נכון — יצא הפוך לגמרי."],
      [pr,"עצרתם אחרי הסוגריים ולא ביצעתם את החילוק."]
    ]);
    return {ask:"חשבו וצמצמו",expr:expr,ans:W(r4.html()),wrong:wrong,steps:steps,rule:"fracmul",
      hint:"יש כאן שתי פעולות שונות. השאלה הראשונה היא לא איך מחלקים — אלא מה עושים קודם."};
  }
  /* רמה 3: משוואה עם שברים */
  b=pick([2,3,4,6]);d=pick([2,3,4,6]);
  if(b===d)d=b===2?3:2;
  var mm=lcm(b,d),xx=mm*ri(1,4);
  var total=xx/b+xx/d;
  expr='<span class="frac"><span>x</span><span>'+b+'</span></span> + <span class="frac"><span>x</span><span>'+d+'</span></span> = '+total;
  steps=[
    S("מכפילים את כל המשוואה במכנה המשותף","המכנה המשותף של "+b+" ו-"+d+" הוא "+mm+". מכפילים בו כל איבר — כך השברים נעלמים.",
      mm+"·x/"+b+" + "+mm+"·x/"+d+" = "+mm+"·"+total),
    S("מצמצמים כל איבר","",(mm/b)+"x + "+(mm/d)+"x = "+(mm*total)),
    S("מכנסים איברים דומים","",(mm/b+mm/d)+"x = "+(mm*total)),
    S("מחלקים במקדם","","x = "+(mm*total)+" ÷ "+(mm/b+mm/d)+" = "+xx)
  ];
  wrong=[
    W("x = "+num(total),"חיברתם את השברים כאילו x/"+b+" + x/"+d+" = x. המקדמים לא מסתכמים ל-1."),
    W("x = "+num(total*(b+d)),"חיברתם את המכנים: x/"+b+" + x/"+d+" אינו x/"+(b+d)+". חיבור שברים לא מחבר מכנים."),
    W("x = "+num(mm*total),"הכפלתם במכנה המשותף אבל שכחתם לחלק בסוף במקדם של x.")
  ];
  return {ask:"פתרו את המשוואה",expr:expr,ans:W("x = "+xx),wrong:wrong,steps:steps,rule:"fraceq",
    hint:"כשיש שברים במשוואה — מכפילים את כל המשוואה במכנה המשותף, והם נעלמים."};
}
/* ---------- 5. אחוזים ---------- */
function genPercent(L){
  var p,N,res,steps,wrong;
  if(L===1){
    p=pick([5,10,15,20,25,30,40,50,60,75,80]);
    N=pick([20,40,60,80,120,140,160,200,240,300,360,400,500]);
    res=N*p/100;
    if(Math.round(res)!==res){N=200;res=N*p/100}
    steps=[
      S("אחוז הוא שבר מתוך מאה",p+"% זה "+p+" חלקי 100.",p+"% = "+p+"/100"),
      S("״מ־״ במתמטיקה זה כפל","מכפילים את החלק במספר השלם.",p+"/100 · "+N),
      S("מחשבים","",(p/100)+" · "+N+" = "+num(res))
    ];
