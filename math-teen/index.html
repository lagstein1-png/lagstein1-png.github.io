 α = מול ÷ ליד":"tan α = المقابل ÷ المجاور","tan הוא הניצב שמול הזווית חלקי הניצב שלידה. הניצב שליד נתון, זה שמול — לא.":"tan هو الضلع المقابل للزاوية مقسومًا على الضلع المجاور لها. المجاور معطى، أمّا المقابل — فلا.","x = הרוחב , האורך = x +":"x = العرض ، الطول = x +","x = מחיר מחברת , y = מחיר עט":"x = سعر دفتر ، y = سعر قلم","אורך מלבן גדול ב":"طول مستطيل أكبر من عرضه بـ","אורך צלע אינו יכול להיות שלילי, ולכן הפתרון השני נפסל.":"طول الضلع لا يمكن أن يكون سالبًا، ولذلك يُستبعَد الحلّ الثاني.","אחוז שינוי = (חדש − ישן) ÷ ישן ·":"نسبة التغيّر = (الجديد − القديم) ÷ القديم ·","אחר כך החזקה":"ثمّ الأُسّ","אי אפשר להציב לפני שיודעים גם את m וגם את b, ואת שניהם צריך למצוא מהנקודות.":"لا يمكن التعويض قبل معرفة m و‑b معًا، وكلاهما يُستخرَج من النقطتين.","אי אפשר לכנס שורשים שאינם זהים — אבל אולי הם כן יהיו זהים אחרי פישוט. משם מתחילים.":"لا يمكن جمع جذور غير متماثلة — لكن ربّما تصير متماثلة بعد التبسيط. من هنا نبدأ.","אין כאן משוואה — צריך לכתוב אותה. מסמנים באות את הצלע המבוקשת ומבטאים דרכה את השנייה.":"لا توجد هنا معادلة — علينا كتابتها. نرمز بحرف للضلع المطلوب ونعبّر به عن الضلع الآخر.","אין שינוי במחיר":"لا تغيّر في السعر","אם הממוצע":"إذا كان المتوسّط","ארבע פעולות בתרגיל אחד. הסדר הוא סוגריים, אחר כך חזקה, אחר כך כפל, והחיבור אחרון.":"أربع عمليّات في تمرين واحد. الترتيب: الأقواس، ثمّ الأُسّ، ثمّ الضرب، والجمع أخيرًا.","באיזו נקודה חותך את ציר ה-x הישר העובר בשתי הנקודות?":"في أيّ نقطة يقطع محورَ الـ x المستقيمُ المارّ بالنقطتين؟","בדיוק פעם אחת?":"مرّة واحدة بالضبط؟","בודקים מה ההגדרה דורשת":"نفحص ما يتطلّبه التعريف","בוחרים את הפתרון שמתאים לשאלה":"نختار الحلّ الذي يناسب السؤال","בחזקה של חזקה חיברתם מעריכים במקום להכפיל אותם.":"في أُسّ الأُسّ جمعتم الأُسّين بدل ضربهما.","בין האיבר ה":"بين الحدّ الـ","בכיתה היחס בין מספר הבנים למספר הבנות הוא":"في صفّ، النسبة بين عدد البنين وعدد البنات هي","בכפל שברים גם המכנים מוכפלים — הם לא מתחברים.":"في ضرب الكسور تُضرب المقامات أيضًا — وهي لا تُجمع.","במשולש ישר זווית שתי צלעות קובעות את השלישית.":"في المثلّث القائم الزاوية يحدّد ضلعان الضلعَ الثالث.","בסדר הפעולות הסוגריים קודמים להכול — גם לחזקה.":"في ترتيب العمليّات تسبق الأقواسُ كلَّ شيء — حتّى الأُسّ.","בסדר הפעולות כפל קודם לחיבור, גם כשהוא כתוב אחרון וגם כשמדובר בשברים.":"في ترتيب العمليّات يسبق الضربُ الجمعَ، حتّى لو كُتب أخيرًا وحتّى في الكسور.","בסדרה חשבונית האיבר ה":"في متتالية حسابيّة الحدّ الـ","בסיס כפול גובה חלקי":"القاعدة في الارتفاع مقسومًا على","בשביל שטח צריך שני ניצבים, וכאן נתון רק אחד. אז השאלה הראשונה היא איך משיגים את השני.":"لحساب المساحة نحتاج إلى ضلعَي القائمة، وهنا معطى واحد فقط. فالسؤال الأوّل هو كيف نحصل على الثاني.","דילגתם על החזקה. מה שבסוגריים מועלה בריבוע לפני הכפל.":"تجاوزتم الأُسّ. ما داخل الأقواس يُرفَع إلى المربّع قبل الضرب.","האיבר האמצעי בפתיחת הריבוע הוא כפול המכפלה, ולא המכפלה עצמה.":"الحدّ الأوسط عند فكّ المربّع هو ضِعف الجداء، وليس الجداء نفسه.","ההגדרה זקוקה לצלע שאינה נתונה. במשולש ישר זווית תמיד אפשר להשלים צלע שלישית משתי האחרות.":"التعريف يحتاج إلى ضلع غير معطى. وفي المثلّث القائم الزاوية يمكن دائمًا إكمال الضلع الثالث من الضلعين الآخرين.","ההטלות בלתי תלויות, ולכן מכפילים.":"الرميتان مستقلّتان، ولذلك نضرب.","ההיקף אינו השטח, אבל ממנו אפשר להגיע לצלע החסרה — ומשם לשטח.":"المحيط ليس المساحة، لكن منه نصل إلى الضلع الناقص — ومنه إلى المساحة.","ההפרש הוא המספר שהוסף":"الفرق هو العدد الذي أُضيف","הוא c² ולא c.":"هو c² وليس c.","הופכים את השבר שאחרי סימן החילוק ומכפילים.":"نقلب الكسر الذي بعد إشارة القسمة ونضرب.","הופכים שבר לאחוזים":"نحوّل الكسر إلى نسبة مئويّة","החזקה החיצונית חלה גם על המקדם":"الأُسّ الخارجيّ يسري أيضًا على المعامل","החזקה החיצונית חלה על כל גורם בפנים, וחזקה של חזקה מכפילה מעריכים.":"الأُسّ الخارجيّ يسري على كلّ عامل في الداخل، وأُسّ الأُسّ يضرب الأُسّين.","החציון נמדד על כל חמשת המספרים, ואחד מהם עדיין לא ידוע. אז יש כאן שני שלבים.":"الوسيط يُحسَب على الأعداد الخمسة كلّها، وأحدها ما زال مجهولًا. إذن هنا مرحلتان.","היחס אינו אחוז. קודם בודקים מכמה חלקים מורכב השלם.":"النسبة ليست نسبة مئويّة. أوّلًا نفحص من كم جزءًا يتكوّن الكلّ.","היחס נותן חלקים, ואחוז נמדד תמיד מתוך השלם. אז קודם מחשבים כמה חלקים יש בסך הכול.":"النسبة تعطي أجزاءً، والنسبة المئويّة تُقاس دائمًا من الكلّ. فأوّلًا نحسب كم جزءًا في المجموع.","היקף הוא סכום שלוש הצלעות, והצלע השלישית אינה נתונה.":"المحيط هو مجموع الأضلاع الثلاثة، والضلع الثالث غير معطى.","היקף הוא סכום שלוש הצלעות. אחת מהן חסרה — ואותה אפשר לחשב מהשתיים האחרות.":"المحيط هو مجموع الأضلاع الثلاثة. أحدها ناقص — ويمكن حسابه من الضلعين الآخرين.","היקף מלבן הוא":"محيط مستطيل هو","הישר עובר בשתי הנקודות שלפניכם. מהו ערך y כאשר x =":"المستقيم يمرّ بالنقطتين التاليتين. ما قيمة y عندما x =","הישר עובר בשתי הנקודות שלפניכם. מהו ערך y כאשר x = −":"المستقيم يمرّ بالنقطتين التاليتين. ما قيمة y عندما x = −","היתר ידוע, ולכן מחסרים ריבועים.":"الوتر معلوم، ولذلك نطرح المربّعات.","הכיוון הפוך. שווה להשוות את המחיר הסופי למחיר המקורי ולראות מי גדול.":"الاتّجاه معكوس. يستحقّ أن تقارنوا السعر النهائيّ بالسعر الأصليّ وتروا أيّهما أكبر.","הכפלתם את האיבר הראשון במספר האיברים, כאילו כל האיברים שווים.":"ضربتم الحدّ الأوّل في عدد الحدود، كأنّ كلّ الحدود متساوية.","הכפלתם את ההיקף באורך. השטח מחושב משתי הצלעות, לא מההיקף.":"ضربتم المحيط في الطول. المساحة تُحسَب من الضلعين، لا من المحيط.","הכפלתם את הזוג הלא נכון. סימן הכפל נמצא בין שני השברים האחרונים.":"ضربتم الزوج غير الصحيح. إشارة الضرب بين الكسرين الأخيرين.","הכפלתם את היתר בניצב. שטח משולש ישר זווית מחושב משני הניצבים בלבד.":"ضربتم الوتر في ضلع القائمة. مساحة المثلّث القائم تُحسَب من ضلعَي القائمة وحدهما.","הכפלתם את המקדמים במקום לחבר אותם.":"ضربتم المعاملات بدل جمعها.","הכפלתם את הסוגריים בשתיים. העלאה בריבוע היא כפל של הביטוי בעצמו, ולא כפל בשתיים.":"ضربتم الأقواس في اثنين. الرفع إلى المربّع هو ضرب المقدار بنفسه، وليس ضربًا في اثنين.","הכפלתם את שינוי הממוצע בכמות. חסר כאן הערך של הממוצע עצמו.":"ضربتم تغيّر المتوسّط في الكمّيّة. ينقص هنا قيمة المتوسّط نفسه.","הכפלתם בלי להפוך. בחילוק בשבר חייבים להפוך את השבר השני.":"ضربتم بلا قلب. في القسمة على كسر يجب قلب الكسر الثاني.","הכפלתם במכנה רק את ה-x. המכנה מוכפל בכל מה שמעל קו השבר.":"ضربتم بالمقام الـ x وحده. المقام يُضرب بكلّ ما فوق خطّ الكسر.","המינוס לפני הסוגריים השניים חל על שני האיברים שבתוכם, ולא רק על הראשון.":"الإشارة السالبة قبل الأقواس الثانية تسري على الحدّين كليهما، لا على الأوّل وحده.","המכנה הוא הסך הכול, לא הקבוצה השנייה.":"المقام هو المجموع الكلّيّ، لا المجموعة الثانية.","המספר שבחוץ מוכפל גם ב-x וגם במספר שלידו.":"العدد الذي في الخارج يُضرب بالـ x وبالعدد المجاور له معًا.","המשוואה לא כתובה בצורה שאפשר לפרק. קודם מסדרים אותה כך שבצד אחד יהיה אפס.":"المعادلة غير مكتوبة بصورة تسمح بالتحليل. أوّلًا نرتّبها بحيث يكون في أحد الطرفين صفر.","הנחתם שזה ריבוע. שתי הצלעות כאן אינן שוות.":"افترضتم أنّه مربّع. الضلعان هنا غير متساويين.","הסוגריים קודמים לחילוק, ולחיסור שברים צריך מכנה משותף.":"الأقواس تسبق القسمة، ولطرح الكسور نحتاج إلى مقام مشترك.","הסכום אחרי התוספת":"المجموع بعد الإضافة","הסכום לפני התוספת":"المجموع قبل الإضافة","העליתם כל מספר בסוגריים בריבוע בנפרד. (a − b)² אינו a² − b².":"رفعتم كلّ عدد داخل الأقواس إلى المربّع على حدة. (a − b)² لا يساوي a² − b².","הפכתם את השבר הלא נכון — יצא הפוך לגמרי.":"قلبتم الكسر غير الصحيح — فخرجت النتيجة معكوسة تمامًا.","הפכתם את השבר. הניצב שמול הזווית הוא המונה.":"قلبتم الكسر. الضلع المقابل للزاوية هو البسط.","הצבתם את b כתשובה. b הוא נקודת החיתוך עם ציר y, וצריך עוד לפתור mx + b =":"وضعتم b جوابًا. b هي نقطة التقاطع مع محور y، وما زال علينا حلّ mx + b =","הצבתם בשיפוע ושכחתם את b. y = mx + b, לא y = mx.":"عوّضتم في الميل ونسيتم b. ‏y = mx + b، وليس y = mx.","הצורה מורכבת משתי צורות שכבר מוכרות. מחשבים כל אחת בנפרד, ואז מחליטים אם לחבר או לחסר.":"الشكل مركّب من شكلين معروفين. نحسب كلّ واحد على حدة، ثمّ نقرّر أنجمع أم نطرح.","הרוחב =":"العرض =","הריבוע יצא שלילי. מספר בריבוע לעולם אינו שלילי, גם כשהבסיס שלילי.":"خرج المربّع سالبًا. مربّع أيّ عدد ليس سالبًا أبدًا، حتّى لو كان الأساس سالبًا.","השינוי השני מחושב מהמחיר החדש, לא מהמחיר המקורי. זו כל הנקודה.":"التغيّر الثاني يُحسَب من السعر الجديد، لا من السعر الأصليّ. هذه هي النقطة كلّها.","התחלתם מהחילוק. הסוגריים קודמים לכל פעולה אחרת.":"بدأتم من القسمة. الأقواس تسبق كلّ عمليّة أخرى.","התייחסתם לאיבר ה":"تعاملتم مع الحدّ الـ","התייקרות של":"ارتفاع بنسبة","התעלמתם מהאיבר החופשי והוצאתם x מחוץ לסוגריים. יש כאן גם מספר בלי x.":"تجاهلتم الحدّ الحرّ وأخرجتم x خارج الأقواس. يوجد هنا أيضًا عدد بلا x.","ואותו דבר בשני":"والأمر نفسه في الثاني","ואחר כך ירד ב":"ثمّ انخفض بـ","ואחר כך עלה ב":"ثمّ ارتفع بـ","ולבסוף החיבור":"وأخيرًا الجمع","וסכומם":"ومجموعهما","ורק עכשיו מחברים":"والآن فقط نجمع","ורק עכשיו מחשבים שטח":"والآن فقط نحسب المساحة","ורק עכשיו מציבים בהגדרה":"والآن فقط نعوّض في التعريف","ורק עכשיו צריך מכנה משותף.":"والآن فقط نحتاج إلى مقام مشترك.","ורק שורשים זהים אפשר לכנס. מחברים או מחסרים אך ורק את המקדמים.":"والجذور المتماثلة وحدها يمكن جمعها. نجمع أو نطرح المعاملات فقط.","זה cos α — הניצב שליד חלקי היתר. השאלה מבקשת sin, וההגדרה שלו דורשת את הניצב שמול הזווית.":"هذا cos α — المجاور مقسومًا على الوتر. السؤال يطلب sin، وتعريفه يحتاج إلى الضلع المقابل للزاوية.","זה cos α — הניצב שליד חלקי היתר. השאלה מבקשת tan, וההגדרה שלו דורשת את הניצב שמול הזווית.":"هذا cos α — المجاور مقسومًا على الوتر. السؤال يطلب tan، وتعريفه يحتاج إلى الضلع المقابل للزاوية.","זה גודל השינוי בממוצע, לא המספר שהוסף.":"هذا مقدار التغيّر في المتوسّط، لا العدد الذي أُضيف.","זה האורך. השאלה מבקשת את הרוחב, והוא הקטן מביניהם.":"هذا هو الطول. السؤال يطلب العرض، وهو الأصغر منهما.","זה האחוז של הקבוצה השנייה.":"هذه هي نسبة المجموعة الثانية.","זה האיבר ה":"هذا هو الحدّ الـ","זה ההיקף — סכום הצלעות. שטח הוא מכפלה.":"هذا هو المحيط — مجموع الأضلاع. أمّا المساحة فجداء.","זה הטווח — ההפרש בין הגדול לקטן.":"هذا هو المدى — الفرق بين الأكبر والأصغر.","זה היקף מלבן שצלעותיו":"هذا محيط مستطيل ضلعاه","זה המחיר של מחברת ועט יחד.":"هذا سعر دفتر وقلم معًا.","זה הממוצע החדש. מספר שמוסיפים כדי להעלות ממוצע חייב להיות גדול ממנו.":"هذا هو المتوسّط الجديد. والعدد الذي نضيفه لرفع المتوسّط يجب أن يكون أكبر منه.","זה הממוצע הקודם, לפני שהוסף המספר.":"هذا هو المتوسّط السابق، قبل إضافة العدد.","זה הממוצע שנתון בשאלה. ממוצע וחציון אינם אותו דבר.":"هذا هو المتوسّط المعطى في السؤال. المتوسّط والوسيط ليسا الشيء نفسه.","זה המספר החסר שמצאתם. הוא צעד בדרך, לא התשובה.":"هذا هو العدد الناقص الذي وجدتموه. هو خطوة في الطريق، لا الجواب.","זה המרחק הכולל בקילומטרים, לא המהירות.":"هذه هي المسافة الكلّيّة بالكيلومترات، لا السرعة.","זה הניצב שמצאתם, ועדיין לא השטח.":"هذا هو ضلع القائمة الذي وجدتموه، وليس المساحة بعد.","זה הפתרון השני של המשוואה, אבל אורך צלע אינו יכול להיות שלילי.":"هذا هو الحلّ الثاني للمعادلة، لكن طول الضلع لا يمكن أن يكون سالبًا.","זה השטח, לא ההיקף.":"هذه هي المساحة، لا المحيط.","זה השינוי השני בלבד. השאלה מבקשת את השינוי לעומת המחיר המקורי.":"هذا هو التغيّر الثاني وحده. السؤال يطلب التغيّر بالنسبة إلى السعر الأصليّ.","זה לא הממוצע של שתי המהירויות — הן לא נמשכו אותו מספר שעות.":"هذا ليس متوسّط السرعتين — فهما لم تستمرّا العدد نفسه من الساعات.","זה ערך ה-x שנתון בשאלה, לא ה-y שמחפשים.":"هذه قيمة الـ x المعطاة في السؤال، لا الـ y المطلوبة.","זה ערך ה-y רק כאשר x =":"هذه قيمة الـ y فقط عندما x =","זה שטח המשולש שהוסר בלבד.":"هذه مساحة المثلّث المقتطَع وحده.","זו ההגדרה של ציר ה-x, וזה מה שהופך את השאלה למשוואה.":"هذا هو تعريف محور الـ x، وهذا ما يحوّل السؤال إلى معادلة.","זו ההסתברות ל״לפחות פעם אחת״, והיא כוללת גם את המקרה שבו המספר הופיע פעמיים.":"هذا احتمال «مرّة واحدة على الأقلّ»، وهو يشمل أيضًا الحالة التي ظهر فيها العدد مرّتين.","זו ההסתברות שהמספר לא הופיע אף פעם. זה בדיוק המאורע ההפוך — נשאר להשלים ל":"هذا احتمال ألّا يظهر العدد أبدًا. وهذا بالضبط الحدث المعاكس — بقي أن نكمله إلى","זו ההסתברות ששתי ההטלות נתנו את המספר.":"هذا احتمال أن تعطي الرميتان كلتاهما العدد.","זו ההסתברות ששתי ההטלות נתנו את המספר. ״לפחות אחת״ כולל גם מקרה אחד בלבד.":"هذا احتمال أن تعطي الرميتان كلتاهما العدد. أمّا «واحدة على الأقلّ» فيشمل أيضًا حالة واحدة فقط.","זו נקודה שנתונה בשאלה, לא נקודת החיתוך עם הציר.":"هذه نقطة معطاة في السؤال، لا نقطة التقاطع مع المحور.","זו נקודת החיתוך עם ציר y. על ציר x דווקא ה-y הוא שמתאפס.":"هذه نقطة التقاطع مع محور y. أمّا على محور x فالـ y هي التي تساوي صفرًا.","חוזרים אחורה אל האיבר הראשון":"نعود إلى الحدّ الأوّل","חוזרים אחורה אל הראשון, צעד אחרי צעד.":"نعود إلى الحدّ الأوّل، خطوة بعد خطوة.","חוזרים לשאלה":"نعود إلى السؤال","חיברתם את המספרים שבתוך השורש. √a + √b אינו √(a+b).":"جمعتم العددين داخل الجذر. ‏√a + √b لا يساوي √(a+b).","חיברתם את המקדמים במקום לחסר אותם.":"جمعتم المعاملات بدل طرحها.","חיברתם את השיפוע ל-x במקום להכפיל.":"جمعتم الميل إلى الـ x بدل الضرب.","חיברתם את מקדמי ה-x במקום לחסר אותם.":"جمعتم معاملات الـ x بدل طرحها.","חיברתם את שלושת השברים. באמצע יש כפל, לא חיבור.":"جمعتم الكسور الثلاثة. في الوسط ضرب، لا جمع.","חיברתם את שני האחוזים. שינוי אחד מעלה ואחד מוריד — הם לא מצטברים לאותו כיוון.":"جمعتم النسبتين. تغيّر يرفع وآخر يخفض — وهما لا يتراكمان في الاتّجاه نفسه.","חיברתם את שתי ההטלות. החיבור סופר פעמיים את המקרה שבו שתיהן הצליחו.":"جمعتم الرميتين. الجمع يعدّ مرّتين الحالة التي نجحت فيها الرميتان معًا.","חיברתם את שתי המהירויות. מהירויות מתחברות רק כששני גופים נעים זה לקראת זה.":"جمعتم السرعتين. السرعات تُجمع فقط عندما يتحرّك جسمان أحدهما نحو الآخر.","חיברתם במקום לחסר. המשולש הוסר מהמלבן.":"جمعتم بدل الطرح. المثلّث اقتُطع من المستطيل.","חיברתם מונה עם מונה ומכנה עם מכנה. בחיבור שברים חייבים מכנה משותף.":"جمعتم بسطًا مع بسط ومقامًا مع مقام. في جمع الكسور يجب وجود مقام مشترك.","חיברתם רק את שני הניצבים. להיקף צריך גם את היתר.":"جمعتم ضلعَي القائمة فقط. المحيط يحتاج إلى الوتر أيضًا.","חילוק באותו בסיס — מחסרים מעריכים":"قسمة بالأساس نفسه — نطرح الأُسّين","חילקתם את הסכום במספר הפריטים, כאילו כולם עולים אותו דבר.":"قسمتم المبلغ على عدد الأغراض، كأنّ ثمنها كلّها واحد.","חילקתם את השטח בהפרש בין הצלעות. ההפרש אינו אחת הצלעות.":"قسمتم المساحة على الفرق بين الضلعين. والفرق ليس أحد الضلعين.","חילקתם בקבוצה השנייה. אחוז נמדד תמיד מתוך הסך הכול.":"قسمتم على المجموعة الثانية. النسبة المئويّة تُقاس دائمًا من المجموع الكلّيّ.","חיסרתם אחוז מאחוז. אחוזים אינם מתחברים ואינם מתחסרים — כל אחד מהם מחושב מבסיס אחר.":"طرحتم نسبة من نسبة. النسب المئويّة لا تُجمع ولا تُطرح — فكلّ واحدة منها تُحسَب من أساس مختلف.","חיסרתם את המעריכים בכיוון ההפוך. מחסרים את המעריך של המכנה מזה של המונה.":"طرحتم الأُسّين بالاتّجاه المعاكس. نطرح أُسّ المقام من أُسّ البسط.","חיסרתם את הצלעות עצמן. בפיתגורס מחסרים את הריבועים שלהן, ורק אז מוציאים שורש.":"طرحتم الأضلاع نفسها. في فيثاغورس نطرح مربّعاتها، وعندها فقط نستخرج الجذر.","חיסרתם את מכפלת הבסיס בגובה. שטח משולש הוא חצי מזה.":"طرحتم جداء القاعدة في الارتفاع. مساحة المثلّث نصف ذلك.","חיסרתם מונה ממונה ומכנה ממכנה. בחיסור שברים חייבים מכנה משותף.":"طرحتم بسطًا من بسط ومقامًا من مقام. في طرح الكسور يجب وجود مقام مشترك.","חיסרתם צלע אחת בלבד. בהיקף כל צלע מופיעה פעמיים.":"طرحتم ضلعًا واحدًا فقط. في المحيط يظهر كلّ ضلع مرّتين.","חישבתם חציון של ארבעת המספרים הידועים בלבד, בלי המספר החסר.":"حسبتم وسيط الأعداد الأربعة المعلومة وحدها، بلا العدد الناقص.","חישבתם ממוצע של שתי המהירויות. הן לא נמשכו אותו זמן, ולכן המשקל שלהן שונה.":"حسبتم متوسّط السرعتين. لم تستمرّا الزمن نفسه، ولذلك وزنهما مختلف.","חישבתם משמאל לימין. הכפל קודם לחיבור, גם כשהוא כתוב אחרון.":"حسبتم من اليسار إلى اليمين. الضرب يسبق الجمع، حتّى لو كُتب أخيرًا.","חישבתם משמאל לימין. כפל קודם לחיבור, גם בשברים.":"حسبتم من اليسار إلى اليمين. الضرب يسبق الجمع، حتّى في الكسور.","חישבתם רק סדר אחד. ״בדיוק פעם אחת״ מתקיים בשתי דרכים — וצריך לחבר אותן.":"حسبتم ترتيبًا واحدًا فقط. «مرّة واحدة بالضبط» يتحقّق بطريقتين — وعلينا جمعهما.","חצי ההיקף הוא סכום שתי הצלעות, ולא הרוחב עצמו.":"نصف المحيط هو مجموع الضلعين، وليس العرض نفسه.","חציון בלי סידור הוא טעות כמעט ודאית.":"الوسيط بلا ترتيب خطأ شبه مؤكّد.","טעות בסימן המכפלה. שני סימנים זהים נותנים פלוס, סימנים שונים נותנים מינוס.":"خطأ في إشارة الجداء. إشارتان متماثلتان تعطيان موجبًا، والمختلفتان سالبًا.","טעות סימן ב-b בשלב ההצבה.":"خطأ إشارة في b عند مرحلة التعويض.","טעות סימן בחילוק ב-m.":"خطأ إشارة في القسمة على m.","טעות סימן בשלב האחרון, כשחילקתם במקדם.":"خطأ إشارة في المرحلة الأخيرة، عند القسمة على المعامل.","ירידה של":"انخفاض بنسبة","יש כאן גם שברים וגם סוגריים. כל עוד יש מכנים אי אפשר להעביר אגפים — אז מהם מתחילים.":"هنا كسور وأقواس معًا. وما دامت هناك مقامات لا يمكن نقل الحدود بين الطرفين — فمنها نبدأ.","יש כאן חמישה מספרים, ולכן החציון הוא זה שבמקום השלישי.":"هنا خمسة أعداد، ولذلك الوسيط هو الذي في المكان الثالث.","יש כאן שתי נוסחאות כפל מקוצר שונות. פותחים כל אחת בנפרד, ורק אחר כך מחסרים ומכנסים.":"هنا صيغتان مختلفتان من صيغ الضرب المختصر. نفكّ كلّ واحدة على حدة، وبعد ذلك فقط نطرح ونجمع.","יש כאן שתי פעולות שונות. השאלה הראשונה היא לא איך מחברים — אלא מה עושים קודם.":"هنا عمليّتان مختلفتان. السؤال الأوّل ليس كيف نجمع — بل ماذا نفعل أوّلًا.","יש כאן שתי פעולות שונות. השאלה הראשונה היא לא איך מחלקים — אלא מה עושים קודם.":"هنا عمليّتان مختلفتان. السؤال الأوّل ليس كيف نقسم — بل ماذا نفعل أوّلًا.","כאילו הוא האיבר הראשון. צריך קודם לחזור אחורה אליו.":"كأنّه الحدّ الأوّل. علينا أوّلًا العودة إليه.","כותבים את החלק המבוקש כשבר":"نكتب الجزء المطلوب على صورة كسر","כותבים את השטח כמשוואה":"نكتب المساحة على صورة معادلة","כינסתם גם את מה שבתוך השורש. השורש הוא ה״שם״ של האיבר — הוא נשאר כמו שהוא.":"جمعتم أيضًا ما داخل الجذر. الجذر هو «اسم» الحدّ — ويبقى كما هو.","כל איבר שעובר אגף מחליף סימן.":"كلّ حدّ ينتقل إلى الطرف الآخر يغيّر إشارته.","כל דבר שמחירו לא ידוע מקבל אות משלו.":"كلّ شيء سعره مجهول يأخذ حرفًا خاصًّا به.","כל דרך היא מכפלה":"كلّ طريق هو جداء","כל קנייה היא משוואה":"كلّ عمليّة شراء هي معادلة","כפל באותו בסיס — מחברים מעריכים":"ضرب بالأساس نفسه — نجمع الأُسّين","כפל קודם לחיבור, גם כשהוא כתוב אחרון.":"الضرب يسبق الجمع، حتّى لو كُتب أخيرًا.","לא צמצמתם: x² מופיע פעמיים עם סימנים הפוכים והוא מתבטל.":"لم تختصروا: ‏x² يظهر مرّتين بإشارتين متعاكستين ويُلغى.","לאיבר ה":"إلى الحدّ الـ","לוקחים את האמצעי":"نأخذ الأوسط","לחמישה מספרים יש ממוצע":"لخمسة أعداد متوسّط","לפחות פעם אחת?":"مرّة واحدة على الأقلّ؟","לקחתם את האיבר האמצעי לפי הסדר שבו הם כתובים. חייבים לסדר קודם.":"أخذتم الحدّ الأوسط حسب ترتيب كتابتها. يجب الترتيب أوّلًا.","לקחתם את המספרים כפי שהם מופיעים במשוואה, בלי לפרק.":"أخذتم الأعداد كما تظهر في المعادلة، بلا تحليل.","מה חסר כדי לחשב היקף":"ما الناقص لحساب المحيط","מה חסר כדי לחשב שטח":"ما الناقص لحساب المساحة","מהאיבר ה":"من الحدّ الـ","מההיקף לרוחב":"من المحيط إلى العرض","מהירות ממוצעת = כל המרחק חלקי כל הזמן":"السرعة المتوسّطة = كلّ المسافة مقسومة على كلّ الزمن","מהירות ממוצעת אינה ממוצע של מהירויות. היא כל המרחק חלקי כל הזמן — אז קודם מחשבים את שניהם.":"السرعة المتوسّطة ليست متوسّط السرعات. هي كلّ المسافة مقسومة على كلّ الزمن — فأوّلًا نحسب الاثنين.","מוצאים את ההפרש":"نجد الفرق","מוצאים את היתר":"نجد الوتر","מוצאים את הניצב החסר":"نجد ضلع القائمة الناقص","מוצאים את שני המחירים":"نجد السعرين","מחברות ו":"دفاتر و","מחברים ומצמצמים":"نجمع ونختصر","מחסרים את הסוגריים השניים כולם":"نطرح الأقواس الثانية كلّها","מחפשים שני מספרים שמכפלתם −":"نبحث عن عددين جداؤهما −","מחשבים את ההסתברות לא לקבל בהטלה אחת":"نحسب احتمال عدم الحصول عليه في رمية واحدة","מחשבים את המחיר אחרי השינוי הראשון":"نحسب السعر بعد التغيّر الأوّل","מחשבים את המחיר אחרי השינוי השני":"نحسب السعر بعد التغيّر الثاني","מחשבים כמה נסע בכל קטע":"نحسب المسافة في كلّ مقطع","מינוס לפני סוגריים הופך את הסימן של כל איבר בתוכם, גם של השני.":"الإشارة السالبة قبل الأقواس تقلب إشارة كلّ حدّ فيها، وكذلك إشارة الثاني.","מכפילים את שני האגפים במכנה המשותף":"نضرب طرفَي المعادلة بالمقام المشترك","מכפילים ב":"نضرب بـ","מכפילים ומצמצמים":"نضرب ونختصر","מכפילים כל משוואה כך שמקדמי ה-y יתבטלו, ומחברים.":"نضرب كلّ معادلة بحيث تُلغى معاملات الـ y، ثمّ نجمع.","ממוצע הוא משוואה":"المتوسّط معادلة","ממוצע כפול כמות = סכום. חשבו את הסכום לפני ואת הסכום אחרי, וההפרש הוא התשובה.":"المتوسّط في الكمّيّة = المجموع. احسبوا المجموع قبل والمجموع بعد، والفرق هو الجواب.","ממוצע כפול כמות נותן את הסכום.":"المتوسّط في الكمّيّة يعطي المجموع.","ממלבן שאורכו":"من مستطيل طوله","מסדרים למשוואה ריבועית":"نرتّبها معادلة تربيعيّة","מסכמים את כל הדרך ואת כל הזמן":"نجمع كلّ المسافة وكلّ الزمن","מסלקים נעלם אחד":"نحذف مجهولًا واحدًا","מסמנים את הנעלם":"نرمز للمجهول","מסמנים את הנעלמים":"نرمز للمجهولين","מסמנים ב-x את הצלע שמחפשים, ומבטאים דרכה את השנייה.":"نرمز بـ x للضلع المطلوب، ونعبّر به عن الضلع الآخر.","מספר שלילי בריבוע יוצא חיובי: מינוס כפול מינוס נותן פלוס.":"العدد السالب في المربّع يخرج موجبًا: سالب في سالب يعطي موجبًا.","מספר שעבר אגף לא החליף סימן.":"عدد انتقل إلى الطرف الآخر ولم يغيّر إشارته.","מספרים, והממוצע שלהם":"أعداد، ومتوسّطها","מעבירים הכול לצד אחד":"ننقل كلّ شيء إلى طرف واحد","מעבירים הכול לצד אחד — רק כך אפשר לפרק לגורמים.":"ننقل كلّ شيء إلى طرف واحد — فبهذا وحده يمكن التحليل إلى عوامل.","מעלים בריבוע את מה שיצא מהסוגריים.":"نرفع إلى المربّع ما خرج من الأقواس.","מעריך שלילי אינו סימן מינוס של הביטוי — הוא מוריד את החזקה למכנה.":"الأُسّ السالب ليس إشارة سالبة للمقدار — بل ينقل القوّة إلى المقام.","מפרקים את המאורע":"نفكّك الحدث","מפרקים את הצורה לשתיים":"نفكّك الشكل إلى شكلين","מפרקים ופותרים":"نحلّل ونحلّ","מפשטים כל שורש בנפרד":"نبسّط كلّ جذر على حدة","מציבים אחת הנקודות ב-y = mx + b.":"نعوّض إحدى النقطتين في y = mx + b.","מרחיבים למכנה משותף":"نوسّع إلى المقام المشترك","מרחק = מהירות · זמן.":"المسافة = السرعة · الزمن.","משוואה ריבועית נפתרת רק כשבצד אחד יש אפס. זה הצעד שלפני כל השאר.":"المعادلة التربيعيّة لا تُحلّ إلّا عندما يكون في أحد الطرفين صفر. هذه هي الخطوة التي تسبق كلّ شيء.","משווים למחיר המקורי":"نقارن بالسعر الأصليّ","משלימים את המספר החסר":"نُكمل العدد الناقص","משלימים ל":"نُكمل إلى","מתחילים מהסוגריים":"نبدأ من الأقواس","נוסחת הסכום דורשת את a₁, והוא לא נתון. אז מתחילים מההפרש — הוא מה שמאפשר לחזור אחורה.":"قانون المجموع يحتاج إلى a₁، وهو غير معطى. فنبدأ من الفرق — هو ما يتيح العودة إلى الوراء.","נפטרים מהמכנים":"نتخلّص من المقامات","נשאלנו על מחברת בלבד — ורק את זה עונים.":"سُئلنا عن الدفتر وحده — وهذا فقط ما نجيب به.","נשאלנו על עט בלבד — ורק את זה עונים.":"سُئلنا عن القلم وحده — وهذا فقط ما نجيب به.","ס\"מ גזרו משולש שבסיסו":"سم اقتُطع مثلّث قاعدته","ס\"מ ואורכו":"سم وطوله","ס\"מ ואחד הניצבים":"سم وأحد ضلعَي القائمة","ס\"מ והניצב שליד הזווית α הוא":"سم والضلع المجاور للزاوية α هو","ס\"מ מרוחבו, ושטחו":"سم، ومساحته","ס\"מ. מהו sin α?":"سم. ما sin α؟","ס\"מ. מהו tan α?":"سم. ما tan α؟","ס\"מ. מהו היקף המשולש?":"سم. ما محيط المثلّث؟","ס\"מ. מהו שטח החלק שנשאר?":"سم. ما مساحة الجزء المتبقّي؟","ס\"מ. מהו שטח המשולש?":"سم. ما مساحة المثلّث؟","סופרים מה קל יותר":"نعدّ ما هو أسهل","סימן אחד הופך והשני לא — שווה לבדוק שוב את המעבר לצד אחד.":"إشارة واحدة انقلبت والأخرى لا — يستحقّ أن تفحصوا مجدّدًا النقل إلى طرف واحد.","סמ\"ר. מהו רוחב המלבן?":"سم². ما عرض المستطيل؟","ספרתם מקום אחד מאוחר מדי. מבין חמישה מספרים האמצעי הוא השלישי.":"عددتم مكانًا واحدًا زيادة. من بين خمسة أعداد، الأوسط هو الثالث.","ספרתם מקום אחד מוקדם מדי. מבין חמישה מספרים האמצעי הוא השלישי.":"عددتم مكانًا واحدًا أقلّ. من بين خمسة أعداد، الأوسط هو الثالث.","עטים ושילמו":"أقلام ودفعوا","עכשיו הכפל":"والآن الضرب","עכשיו יש":"الآن يوجد","עכשיו יש חמישה מספרים — מסדרים":"الآن لدينا خمسة أعداد — نرتّبها","עכשיו יש משוואה מלאה, אפשר להציב בה כל x.":"الآن لدينا معادلة كاملة، ويمكن التعويض فيها بأيّ x.","עכשיו שני השורשים זהים":"الآن الجذران متماثلان","עלייה של":"ارتفاع بنسبة","עצמו, לא הסכום.":"نفسه، لا المجموع.","עצרתם אחרי הסוגריים ולא ביצעתם את החילוק.":"توقّفتم بعد الأقواس ولم تُجروا القسمة.","עצרתם בשבר ולא הכפלתם ב":"توقّفتم عند الكسر ولم تضربوا بـ","פאות פעמיים. מה ההסתברות לקבל את המספר":"وجهًا مرّتين. ما احتمال الحصول على العدد","פותחים את המכפלה השנייה":"نفكّ الجداء الثاني","פותחים את הריבוע":"نفكّ المربّع","פותחים את שני זוגות הסוגריים":"نفكّ زوجَي الأقواس","פותרים":"نحلّ","פשטו וכנסו":"بسّطوا واجمعوا","פתרתם כאילו המשוואה כבר מסודרת. כשמעבירים אגף כל הסימנים מתהפכים.":"حللتم كأنّ المعادلة مرتّبة أصلًا. وعند النقل إلى الطرف الآخر تنقلب كلّ الإشارات.","פתרתם נכון, אבל עניתם על הנעלם השני. שווה לחזור ולקרוא מה נשאל.":"حللتم بشكل صحيح، لكنّكم أجبتم عن المجهول الثاني. يستحقّ أن تعودوا وتقرأوا ما هو المطلوب.","צעדים, וכל צעד הוא d.":"خطوات، وكلّ خطوة هي d.","קודם הכפל":"أوّلًا الضرب","קודם מה שבתוך הסוגריים":"أوّلًا ما داخل الأقواس","קודם מוצאים את הצלע החסרה":"أوّلًا نجد الضلع الناقص","קוראים את התוצאה":"نقرأ النتيجة","קידמתם את ה-y ביחידה אחת לכל צעד ב-x. כל צעד ב-x מזיז את y בגודל השיפוע.":"زدتم الـ y وحدة واحدة لكلّ خطوة في الـ x. كلّ خطوة في الـ x تحرّك الـ y بمقدار الميل.","קמ\"ש, ומיד אחר כך":"كم/س، وبعد ذلك مباشرةً","קמ\"ש. מהי המהירות הממוצעת שלו לאורך כל הנסיעה?":"كم/س. ما سرعته المتوسّطة على طول الرحلة كلّها؟","קנו":"اشتروا","ראשית הצירים אכן נמצאת על ציר ה-x, אבל הישר הזה אינו עובר דרכה.":"نقطة الأصل تقع فعلًا على محور الـ x، لكنّ هذا المستقيم لا يمرّ بها.","ריבוע של סוגריים אינו ריבוע של כל איבר בנפרד. יש גם איבר אמצעי, וזה מה שהכי הרבה נשכח.":"مربّع الأقواس ليس مربّع كلّ حدّ على حدة. هناك أيضًا حدّ أوسط، وهو الأكثر نسيانًا.","רכב נסע":"سافرت سيّارة","ש\"ח. באותה חנות קנו":"شيكل. وفي المتجر نفسه اشتروا","ש\"ח. המחיר ירד ב":"شيكل. انخفض السعر بـ","ש\"ח. המחיר עלה ב":"شيكل. ارتفع السعر بـ","ש\"ח. מה מחיר מחברת אחת?":"شيكل. ما سعر دفتر واحد؟","ש\"ח. מה מחיר עט אחד?":"شيكل. ما سعر قلم واحد؟","שטח = אורך · רוחב, והרוחב אינו נתון. אותו מוצאים מההיקף.":"المساحة = الطول · العرض، والعرض غير معطى. نجده من المحيط.","שטח המלבן":"مساحة المستطيل","שטח המשולש":"مساحة المثلّث","שטח מלבן = אורך · רוחב.":"مساحة المستطيل = الطول · العرض.","שטח משולש ישר זווית מחושב משני הניצבים, והניצב השני אינו נתון.":"مساحة المثلّث القائم تُحسَب من ضلعَي القائمة، والضلع الثاني غير معطى.","שטח שנשאר = שטח המלבן פחות שטח המשולש שהוסר.":"المساحة المتبقّية = مساحة المستطيل ناقص مساحة المثلّث المقتطَع.","שכחתם להוציא שורש —":"نسيتم استخراج الجذر —","שכחתם לחלק ב":"نسيتم القسمة على","שלב ב: מוצאים את b":"المرحلة ب: نجد b","שלב ג: מציבים את ה-x שנשאלנו עליו":"المرحلة ج: نعوّض الـ x المسؤول عنه","שלב ג: על ציר x מתקיים y =":"المرحلة ج: على محور x يتحقّق y =","שלושה חוקים שונים נדרשים כאן. מתחילים מהסוגריים — כל עוד יש חזקה של חזקה, אי אפשר לחבר או לחסר מעריכים.":"هنا حاجة إلى ثلاث قواعد مختلفة. نبدأ من الأقواس — فما دام هناك أُسّ لأُسّ، لا يمكن جمع الأُسّات أو طرحها.","שני איברי x² מתבטלים זה עם זה.":"حدّا x² يُلغي أحدهما الآخر.","שני האחוזים מחושבים מבסיסים שונים. מחשבים את המחיר הסופי בפועל, ורק אז משווים אותו למחיר ההתחלתי.":"النسبتان تُحسَبان من أساسين مختلفين. نحسب السعر النهائيّ فعليًّا، وعندها فقط نقارنه بالسعر الابتدائيّ.","שני הניצבים ידועים, ולכן מחברים ריבועים.":"ضلعا القائمة معلومان، ولذلك نجمع المربّعات.","שני השורשים נראים זרים זה לזה. מחפשים בכ וצר משולש ישר זווית שצלעותיו הן שתי צלעות המלבן.":"Диагональ прямоугольника образует прямоугольный треугольник, катеты которого — две стороны прямоугольника.","האמצעי הוא סכום, האחרון הוא מכפלה.":"Средний — сумма, последний — произведение.","הגבלת זמן:":"Ограничение времени:","הגדרות טריגונומטריות":"Тригонометрические определения","הגובה חייב להיות מאונך לבסיס.":"Высота должна быть перпендикулярна основанию.","הדבקת קוד תשובות":"Вставка кода ответов","ההסתברות למאורע המקורי":"Вероятность исходного события","ההקראה בקול המכשיר. יש קול טבעי שנשמע כמו אדם":"Озвучивание голосом устройства. Есть естественный голос, похожий на человеческий","הופכים את השבר השני — מונה ומכנה מתחלפים — ומכפילים.":"Переворачиваем вторую дробь — числитель и знаменатель меняются местами — и умножаем.","החזקה החיצונית חלה על כל מה שבסוגריים":"Внешняя степень относится ко всему, что в скобках","החזקה חלה על כל גורם בתוך הסוגריים, כולל המקדם.":"Степень относится к каждому множителю в скобках, включая коэффициент.","הישר y = mx + b":"Прямая y = mx + b","הישר y = mx + b היה הנושא שהכי הפריע בסבב הזה. סבב ממוקד אחד בו יעשה יותר מעוד עשר שאלות מעורבות.":"Прямая y = mx + b — тема, которая мешала больше всего в этом раунде. Один раунд только по ней даст больше, чем ещё десять смешанных вопросов.","היתר הוא הצלע מול הזווית הישרה: a² + b² = c².":"Гипотенуза — сторона напротив прямого угла: a² + b² = c².","היתר הוא הצלע שמול הזווית הישרה — תמיד הארוכה ביותר. כאן היא הנעלם.":"Гипотенуза — сторона напротив прямого угла, всегда самая длинная. Здесь она и есть неизвестное.","הכלל: xᵃ ÷ xᵇ = xᵃ⁻ᵇ. כל x במכנה מצמצם x אחד במונה.":"Правило: xᵃ ÷ xᵇ = xᵃ⁻ᵇ. Каждый x в знаменателе сокращает один x в числителе.","המבחן מוכן":"Тест готов","המונה הוא הניצב שליד הזווית, המכנה הוא היתר.":"Числитель — прилежащий катет, знаменатель — гипотенуза.","המונה הוא הניצב שמול הזווית, המכנה הוא היתר.":"Числитель — противолежащий катет, знаменатель — гипотенуза.","המונה הוא הניצב שמול הזווית, המכנה הוא הניצב שליד הזווית.":"Числитель — противолежащий катет, знаменатель — прилежащий катет.","המכנה הוא תמיד הערך ההתחלתי — לא החדש.":"В знаменателе всегда начальное значение — не новое.","המכנה הוא תמיד סך כל האפשרויות.":"В знаменателе всегда общее число возможных исходов.","המכנים כבר שווים":"Знаменатели уже равны","המסלול שלי":"Мой маршрут","המספר שבחוץ מוכפל בכל אחד מהאיברים בפנים — בלי לדלג.":"Число снаружи умножается на каждый член внутри — ничего не пропускаем.","המספר שבחוץ מוכפל בכל אחד משני האיברים שבפנים.":"Число снаружи умножается на каждый из двух членов внутри.","המספרים לכיוונים הפוכים, אז מחסרים את הקטן מהגדול והתוצאה מקבלת את הסימן של הגדול.":"Числа с разными знаками, поэтому вычитаем меньшее из большего, и результат получает знак большего.","הנוסחה המשולשת":"Формула трёх величин","הסוגריים אומרים: כל מה שבפנים מוכפל במה שבחוץ. בלי לדלג על האיבר השני.":"Скобки означают: всё, что внутри, умножается на то, что снаружи. Не пропускаем второй член.","הסתברות":"Вероятность","הסתברות = כמה מקרים מתאימים, חלקי כמה מקרים אפשריים בסך הכול.":"Вероятность = число подходящих исходов, делённое на общее число возможных исходов.","הסתברות = מבוקש חלקי הכול":"Вероятность = нужные исходы делить на все","הסתברות היה הנושא שהכי הפריע בסבב הזה. סבב ממוקד אחד בו יעשה יותר מעוד עשר שאלות מעורבות.":"Вероятность — тема, которая мешала больше всего в этом раунде. Один раунд только по ней даст больше, чем ещё десять смешанных вопросов.","העתקת הקוד":"Копирование кода","העתקת הקישור":"Копирование ссылки","הפעולה ההפוכה לכפל היא חילוק.":"Обратное действие к умножению — деление.","הפתרון, צעד אחר צעד":"Решение, шаг за шагом","הקוד מכיל את השם ואת התשובות שסימנתם — המורה מחשב את הציון אצלו מחדש.":"Код содержит имя и отмеченные вами ответы — учитель заново вычисляет оценку у себя.","הקישור לא נקרא":"Ссылку не удалось прочитать","השאלות מתחלקות שווה בשווה בין הנושאים שנבחרו.":"Вопросы делятся поровну между выбранными темами.","השלימו את הפרופורציה":"Дополните пропорцию","השם שלכם":"Ваше имя","התאמות לנבחנים":"Особые условия для экзаменуемых","התוצאה של הראשון לא משפיעה על השני, ולכן מכפילים הסתברויות.":"Результат первого не влияет на второй, поэтому вероятности перемножаем.","ולסיום":"И в завершение","ומכאן: סכום = ממוצע · מספר האיברים.":"Отсюда: сумма = среднее · число членов.","זה לקראת זה — המהירויות מתחברות. מרדף — מחסרים.":"Навстречу друг другу — скорости складываются. Погоня — вычитаем.","זו ההגדרה: מחלקים את הכול שווה בשווה בין כל האיברים.":"Это и есть определение: делим всё поровну между всеми членами.","זו הנקודה שהכי הרבה נופלים בה: המכנה הוא הערך הישן, לא החדש.":"Здесь ошибаются чаще всего: в знаменателе старое значение, а не новое.","זוויות מיוחדות":"Особые углы","חוק הפילוג":"Распределительный закон","חוק הפילוג וכינוס איברים דומים":"Распределительный закон и приведение подобных","חוקי חזקות":"Свойства степеней","חוקי חזקות היה הנושא שהכי הפריע בסבב הזה. סבב ממוקד אחד בו יעשה יותר מעוד עשר שאלות מעורבות.":"Свойства степеней — тема, которая мешала больше всего в этом раунде. Один раунд только по ней даст больше, чем ещё десять смешанных вопросов.","חזקה של חזקה":"Степень степени","חזקה של חזקה — מכפילים מעריכים":"Степень степени — перемножаем показатели","חזרה":"Назад","חיבור שברים":"Сложение дробей","חיבור, כפל, חילוק ומשוואה עם שבר":"Сложение, умножение, деление и уравнение с дробью","חייבים מכנה משותף. אסור לחבר מונה עם מונה ומכנה עם מכנה.":"Нужен общий знаменатель. Нельзя складывать числитель с числителем и знаменатель со знаменателем.","חילוק בשבר = כפל בשבר ההפוך":"Деление на дробь = умножение на обратную дробь","חילוק בשבר הוא כפל בשבר ההפוך.":"Деление на дробь — это умножение на обратную дробь.","חילוק חזקות":"Деление степеней","חיסור זה חיבור של ההפך. אחרי זה שאלו: שני המספרים לאותו כיוון או לכיוונים הפוכים?":"Вычитание — это сложение с противоположным числом. Потом спросите: у двух чисел один знак или разные?","חיסור של מספר זה חיבור של ההפך שלו. מינוס ומינוס נותנים פלוס.":"Вычесть число — значит прибавить противоположное. Минус и минус дают плюс.","חיפוש נוסחה — למשל: שיפוע, פיתגורס, אחוז":"Поиск формулы — например: угловой коэффициент, Пифагор, процент","חישוב, פישוט וכינוס שורשים":"Вычисление, упрощение и приведение корней","חציון":"Медиана","חציון = האיבר האמצעי אחרי סידור. במספר זוגי של איברים — ממוצע שני האמצעיים.":"Медиана = средний член после упорядочивания. При чётном числе членов — среднее двух средних.","חציון בלי סידור הוא טעות כמעט ודאית. מסדרים מהקטן לגדול.":"Медиана без упорядочивания — почти наверняка ошибка. Упорядочиваем от меньшего к большему.","חשבו וצמצמו":"Вычислите и сократите","טריגונומטריה":"Тригонометрия","טריגונומטריה היה הנושא שהכי הפריע בסבב הזה. סבב ממוקד אחד בו יעשה יותר מעוד עשר שאלות מעורבות.":"Тригонометрия — тема, которая мешала больше всего в этом раунде. Один раунд только по ней даст больше, чем ещё десять смешанных вопросов.","טרפז":"Трапеция","יחס":"Отношение","יחס ופרופורציה":"Отношение и пропорция","יחס ופרופורציה היה הנושא שהכי הפריע בסבב הזה. סבב ממוקד אחד בו יעשה יותר מעוד עשר שאלות מעורבות.":"Отношение и пропорция — тема, которая мешала больше всего в этом раунде. Один раунд только по ней даст больше, чем ещё десять смешанных вопросов.","יחס לא משתנה כשמחלקים את שני חלקיו באותו מספר.":"Отношение не меняется, если обе его части разделить на одно и то же число.","יסודות":"Основы","יש מספר זוגי של איברים":"Число членов чётное","יתר, ניצב ואלכסון":"Гипотенуза, катет и диагональ","כבר יש כאן חיבור.":"Здесь уже сложение.","כדי שהמורה יידע מי ענה. השם לא נשלח לשום שרת — הוא נכנס לתוך הקוד.":"Чтобы учитель знал, кто отвечал. Имя не отправляется ни на какой сервер — оно входит в код.","כותבים את המשוואה":"Записываем уравнение","כותבים את המשפט כביטוי":"Записываем предложение как выражение","כותבים את הנוסחה עם הנעלם":"Записываем формулу с неизвестным","כותבים את זה כחיבור אחד":"Записываем это как одно сложение","כותבים כפרופורציה":"Записываем как пропорцию","כינוס שורשים":"Приведение корней","כל איבר בשני האגפים, כולל המספרים בלי שבר.":"Каждый член в обеих частях, включая числа без дроби.","כל איבר בתוך הסוגריים מוכפל במספר שבחוץ — גם ה-x וגם המספר.":"Каждый член в скобках умножается на число снаружи — и x, и число.","כל איבר שעובר אגף מחליף סימן. מחלקים במקדם רק בסוף.":"Каждый член при переносе в другую часть меняет знак. На коэффициент делим только в конце.","כל ה-x לצד אחד":"Все x в одну часть","כל המספרים לצד השני":"Все числа в другую часть","כל השאלות נענו":"На все вопросы дан ответ","כל שאלה כאן מגיעה עם פתרון מלא שנפתח שלב אחרי שלב, ועם הסבר מדויק לטעות שעשיתם — לא רק ״לא נכון״. דף נוסחאות תמיד פתוח, הקראה קולית, ובלי טיימר שרודף אחריכם.":"К каждому вопросу здесь прилагается полное решение, которое раскрывается шаг за шагом, и точное объяснение сделанной вами ошибки — не просто «неверно». Справочник формул всегда открыт, есть озвучивание, и никакой таймер вас не подгоняет.","כל שאלה נפתחת לשלבים קטנים, בקצב שלכם":"Каждый вопрос раскрывается на маленькие шаги, в вашем темпе","כללי סימנים":"Правила знаков","כמה פתרונות יש למשוואה?":"Сколько решений у уравнения?","כן, למחוק":"Да, удалить","כנסו איברים דומים":"Приведите подобные слагаемые","כפל באלכסון.":"Умножение крест-накрест.","כפל וחילוק שברים":"Умножение и деление дробей","כפל חזקות":"Умножение степеней","כפל תמיד לפני חיבור, גם אם הוא כתוב אחריו.":"Умножение всегда раньше сложения, даже если записано после него.","כפל, חילוק, חזקה של חזקה ומעריך שלילי":"Умножение, деление, степень степени и отрицательный показатель","כשהיתר ידוע והניצב חסר — מחסרים: a² = c² − b².":"Когда гипотенуза известна, а катет неизвестен — вычитаем: a² = c² − b².","כשיש שברים במשוואה — מכפילים את כל המשוואה במכנה המשותף, והם נעלמים.":"Когда в уравнении есть дроби — умножаем всё уравнение на общий знаменатель, и они исчезают.","כשמחברים אגף לאגף, ה-y מתבטל כי יש +y ו-−y.":"При сложении уравнений y исчезает, потому что есть +y и −y.","כששני המכנים זהים אין מה להרחיב — עוברים ישר למונים.":"Когда оба знаменателя одинаковы, расширять нечего — сразу переходим к числителям.","כששניים נוסעים זה לקראת זה, המהירויות מ тает с квадратами, а не с самими сторонами.","חיסרתם את הצלעות עצמן במקום את הריבועים שלהן.":"Вы вычли сами стороны вместо их квадратов.","חיברתם. כשמחפשים ניצב מחסרים את ריבוע הניצב הידוע מריבוע היתר.":"Вы сложили. Когда ищут катет, из квадрата гипотенузы вычитают квадрат известного катета.","חיסרתם במקום לחבר. מחסרים רק כשמחפשים ניצב, לא יתר.":"Вы вычли вместо сложения. Вычитают только когда ищут катет, а не гипотенузу.","חיברתם במקום לחסר.":"Вы сложили вместо вычитания.","חיסרתם. האלכסון הוא היתר, ולכן מחברים.":"Вы вычли. Диагональ — это гипотенуза, поэтому складываем.","חיברתם את הצלעות. האלכסון תמיד קצר מסכום שתי הצלעות.":"Вы сложили стороны. Диагональ всегда короче суммы двух сторон.","הוצאתם את הגורם הריבועי בלי לחשב את השורש שלו.":"Вы вынесли квадратный множитель, не вычислив его корень.","הוצאתם מהשורש את המספר הריבועי עצמו במקום את השורש שלו.":"Вы вынесли из-под корня само число-квадрат вместо его корня.","הכפלתם את שני החלקים. המספר שיצא מהשורש נשאר מוכפל בשורש שנשאר, לא מתמזג איתו.":"Вы перемножили обе части. Число, вынесенное из-под корня, остаётся множителем при оставшемся корне, а не сливается с ним.","חיברתם גם את המספרים שבתוך השורש. השורש הוא ה״שם״ של האיבר — הוא לא משתנה.":"Вы сложили и числа под корнем. Корень — это «имя» слагаемого, оно не меняется.","העליתם את השורש בריבוע.":"Вы возвели корень в квадрат.","זה כפול השורש.":"Это удвоенный корень.",". שורש הוא לא חצי — הוא המספר שמוכפל בעצמו נותן":". Корень — это не половина, а число, которое при умножении на себя даёт","בחזקה של חזקה מכפילים מעריכים, לא מחברים.":"При возведении степени в степень показатели умножают, а не складывают.","הכפלתם את המעריכים.":"Вы перемножили показатели.","הכפלתם את המעריכים. בכפל של אותו בסיס המעריכים מתחברים.":"Вы перемножили показатели. При умножении степеней с одним основанием показатели складываются.","הכפלתם את המעריכים במקום לחסר.":"Вы перемножили показатели вместо вычитания.","חיברתם את המעריכים. חיבור שייך לכפל, ובחילוק מחסרים.":"Вы сложили показатели. Сложение — для умножения, а при делении вычитают.","חיסרתם את המעריכים. חיסור שייך לחילוק, לא לכפל.":"Вы вычли показатели. Вычитание — для деления, а не для умножения.","חיסרתם בכיוון ההפוך. מחסרים את המעריך של המכנה מזה של המונה.":"Вы вычли в обратном порядке. Из показателя числителя вычитают показатель знаменателя.","הכפלתם גם את הבסיס. הבסיס נשאר x — רק המעריך משתנה.":"Вы умножили и основание. Основание остаётся x — меняется только показатель.","הכפלתם את המקדם במעריך במקום להעלות אותו בחזקה.":"Вы умножили коэффициент на показатель вместо того, чтобы возвести его в степень.","קיבלתם מעריך שלילי והורדתם ממנו את המינוס. מעריך שלילי הופך לשבר, לא נעלם.":"Вы получили отрицательный показатель и убрали у него минус. Отрицательный показатель превращается в дробь, а не исчезает.","המינוס עבר למקדם. מעריך שלילי לא הופך את הסימן של הביטוי, אלא מוריד אותו למכנה.":"Минус перешёл к коэффициенту. Отрицательный показатель не меняет знак выражения, а переносит его в знаменатель.",", לא רק על ה-x.":", а не только на x.","חיברתם מונה עם מונה ומכנה עם מכנה. בחיבור וחיסור שברים חייבים מכנה משותף.":"Вы сложили числитель с числителем и знаменатель со знаменателем. При сложении и вычитании дробей нужен общий знаменатель.","חיברתם מונים ומכנים. בכפל מכפילים מונה במונה ומכנה במכנה.":"Вы сложили числители и знаменатели. При умножении числитель умножают на числитель, а знаменатель на знаменатель.","חיברתם מונים ומכנים. זו לא הפעולה שנדרשה כאן.":"Вы сложили числители и знаменатели. Здесь требовалось не это действие.","המונים הוכפלו אבל המכנים חוברו.":"Числители перемножены, а знаменатели сложены.","פעלתם על המונים אבל השארתם את המכנה של השבר הראשון.":"Вы выполнили действие с числителями, но оставили знаменатель первой дроби.","הפכתם את השבר. המבוקש נמצא במונה.":"Вы перевернули дробь. Искомое стоит в числителе.","הפכתם את השבר. שימו לב מה במונה ומה במכנה בהגדרה.":"Вы перевернули дробь. Посмотрите, что в определении стоит в числителе, а что в знаменателе.","הפכתם את השבר השני. הופכים רק בחילוק, לא בכפל.":"Вы перевернули вторую дробь. Переворачивают только при делении, а не при умножении.","הפכתם את שני השברים. הופכים רק את זה שאחרי סימן החילוק.":"Вы перевернули обе дроби. Переворачивают только ту, что после знака деления.","הפכתם את השבר הראשון במקום את השני.":"Вы перевернули первую дробь вместо второй.","הכפלתם ישר בלי להפוך את השבר השני. בחילוק חייבים להפוך.":"Вы сразу умножили, не перевернув вторую дробь. При делении переворачивать обязательно.","הכפלתם את השברים במקום לחבר או לחסר אותם.":"Вы перемножили дроби вместо того, чтобы сложить или вычесть их.","חיברתם את שני השברים במקום להכפיל אותם.":"Вы сложили две дроби вместо того, чтобы перемножить их.","חיברתם את שני השברים במקום לחלק ביניהם.":"Вы сложили две дроби вместо того, чтобы разделить одну на другую.","מצאתם מכנה משותף, אבל לא הרחבתם את המונים. כשהמכנה גדל — גם המונה חייב לגדול באותו יחס.":"Вы нашли общий знаменатель, но не домножили числители. Если знаменатель увеличился — числитель должен увеличиться во столько же раз.","הרחבתם רק את השבר הראשון. שני השברים צריכים להגיע למכנה המשותף.":"Вы привели к общему знаменателю только первую дробь. Обе дроби должны прийти к общему знаменателю.","הרחבתם רק את השבר השני. שני השברים צריכים להגיע למכנה המשותף.":"Вы привели к общему знаменателю только вторую дробь. Обе дроби должны прийти к общему знаменателю.","לקחתם את מכפלת המכנים כמכנה, אבל הרחבתם את המונים לפי המכנה המשותף — שני מכנים שונים באותו חישוב.":"Вы взяли произведение знаменателей как знаменатель, но домножили числители по общему знаменателю — два разных знаменателя в одном вычислении.","התשובה יצאה הפוכה — מונה ומכנה התחלפו בסוף.":"Ответ получился перевёрнутым — числитель и знаменатель поменялись местами в конце.","הכפלתם במכנה המשותף אבל שכחתם לחלק בסוף במקדם של x.":"Вы умножили на общий знаменатель, но в конце забыли разделить на коэффициент при x.","חילקתם בכיוון ההפוך.":"Вы разделили в обратном порядке.","חילקתם. מרחק = מהירות כפול זמן.":"Вы разделили. Расстояние = скорость умножить на время.","חיברתם מהירות עם זמן. אלה גדלים שונים — הם לא מתחברים.":"Вы сложили скорость и время. Это разные величины — они не складываются.","חיסרתם מהירויות. חיסור מתאים למרדף באותו כיוון, לא לנסיעה זה לקראת זה.":"Вы вычли скорости. Вычитание подходит для погони в одном направлении, а не для движения навстречу.","התייחסתם רק לרכב אחד. כששניהם נוסעים זה לקראת זה — המהירויות מתחברות.":"Вы учли только одну машину. Когда обе едут навстречу друг другу — скорости складываются.","מיותר — לא צריך לחצות את המרחק.":"Лишнее — расстояние делить пополам не нужно.","התייחסתם רק לקובייה אחת.":"Вы учли только один кубик.","חיברתם את מספרי הפאות במקום להכפיל אותם.":"Вы сложили числа граней вместо того, чтобы перемножить их.","חיברתם הסתברויות. חיבור מתאים ל״או״, כפל מתאים ל״וגם״.":"Вы сложили вероятности. Сложение — для «или», умножение — для «и».","זו ההסתברות דווקא כן להוציא שחור. השאלה מבקשת את המשלים.":"Это вероятность как раз вытащить чёрный. В вопросе просят противоположное событие.","חילקתם במספר הכדורים שאינם אדומים. המכנה הוא תמיד סך כל האפשרויות.":"Вы разделили на число не красных шаров. Знаменатель — всегда общее число всех возможностей.","חילקתם במספר השחורים במקום בסך הכול.":"Вы разделили на число чёрных вместо общего числа.","חילקתם במספר הצבעים ולא במספר הכדורים.":"Вы разделили на число цветов, а не на число шаров.","זה הסכום של כל המספרים, לא המספר החסר.":"Это сумма всех чисел, а не недостающее число.","זה הסכום. נשאר לחלק במספר האיברים.":"Это сумма. Осталось разделить на количество чисел.","זה המספר הגדול ביותר, לא הממוצע.":"Это наибольшее число, а не среднее.","זה הממוצע, לא החציון.":"Это среднее, а не медиана.","חילקתם במספר איברים שגוי — יש כאן":"Вы разделили на неверное количество чисел — здесь их","חיסרתם את הממוצע מהסכום הידוע במקום להשתמש בסכום הכולל.":"Вы вычли среднее из известной суммы вместо того, чтобы использовать общую сумму.","הנחתם שהמספר החסר שווה לממוצע. זה נכון רק אם כל המספרים שווים.":"Вы предположили, что недостающее число равно среднему. Это верно, только если все числа равны.","לקחתם את האיבר האמצעי לפי הסדר שבו הם נכתבו. חייבים קודם לסדר.":"Вы взяли средний член в том порядке, в котором числа записаны. Сначала нужно упорядочить.","לקחתם רק אחד משני האיברים האמצעיים. במספר זוגי לוקחים את הממוצע שלהם.":"Вы взяли только один из двух средних членов. При чётном количестве берут их среднее.","ספרתם מקום אחד יותר מדי אחרי הסידור.":"После упорядочивания вы отсчитали на одну позицию больше.","חילקתם את הסכום בכל מספר בנפרד. קודם צריך לחלק במספר החלקים הכולל.":"Вы разделили сумму на каждое число отдельно. Сначала нужно разделить на общее число частей.","זה ההפרש הכולל לאורך כל הסדרה, לא ההפרש בין שני איברים עוקבים.":"Это общая разность по всей прогрессии, а не разность двух соседних членов.","הכפלתם ב-n במקום ב-n מינוס":"Вы умножили на n вместо n минус",". מהאיבר הראשון לאיבר ה":". От первого члена до члена номер","חילקתם ב-n. מספר הצעדים בין האיבר הראשון לאיבר ה":"Вы разделили на n. Число шагов от первого члена до члена номер","הכפלתם את האיבר הראשון ב-n.":"Вы умножили первый член на n.","עצמו, לא הסכום של כולם.":"сам по себе, а не сумма всех членов.","לקחתם רק את האיבר הראשון.":"Вы взяли только первый член.","טעות בהזזת נקודה עשרונית — חלקתם ב":"Ошибка при переносе десятичной запятой — вы разделили на","חילקתם את המספר באחוז. אחוז זה כפל בשבר, לא חילוק.":"Вы разделили число на процент. Процент — это умножение на дробь, а не деление.","חישבתם את גודל ההנחה או התוספת, אבל השאלה מבקשת את המחיר עצמו.":"Вы вычислили размер скидки или надбавки, а в вопросе спрашивают саму цену.","הלכתם לכיוון ההפוך — הוספתם במקום להוריד.":"Вы пошли в обратную сторону — прибавили вместо того, чтобы снять.","הלכתם לכיוון ההפוך — הורדתם במקום להוסיף.":"Вы пошли в обратную сторону — сняли вместо того, чтобы прибавить.","למחיר אחרי ההנחה. אחוז שמורידים ואחוז שמוסיפים לא מבטלים זה את זה.":"к цене после скидки. Процент, который снимают, и процент, который добавляют, не отменяют друг друга.","חילקתם באחוז ההנחה במקום באחוז שנשאר.":"Вы разделили на процент скидки, а не на оставшийся процент.","חילקתם בערך החדש. אחוז שינוי מחושב תמיד ביחס לערך ההתחלתי.":"Вы разделили на новое значение. Процент изменения всегда считается от начального значения.","זה גודל השינוי בשקלים, לא באחוזים.":"Это размер изменения в шекелях, а не в процентах.","זה היחס בין המחירים. כדי לקבל את אחוז העלייה צריך להוריד":"Это отношение цен. Чтобы получить процент роста, нужно вычесть","זה ההיקף —":"Это длина окружности —","πr. שטח הוא πr².":"πr. Площадь равна πr².","זה השטח — πr². היקף הוא":"Это площадь — πr². Длина окружности равна","שכחתם את המכפלה ב":"Вы забыли умножить на",". ההיקף מחושב לפי הקוטר, שהוא פי שניים מהרדיוס.":". Длина окружности считается по диаметру, а он вдвое больше радиуса.","השתמשתם בקוטר במקום ברדיוס. בנוסחה r הוא הרדיוס — חצי מהקוטר.":"Вы использовали диаметр вместо радиуса. В формуле r — это радиус, половина диаметра.","זה ההיקף — סכום כל הצלעות. שטח הוא אורך כפול רוחב.":"Это периметр — сумма всех сторон. Площадь — это длина, умноженная на ширину.","חיברתם את הצלעות במקום להכפיל.":"Вы сложили стороны вместо того, чтобы перемножить.","הכפלתם במקום לחלק. כדי לחזור אחורה מנוסחת השטח מחלקים.":"Вы умножили вместо того, чтобы разделить. Чтобы вернуться назад от формулы площади, делим.","חיסרתם. השטח נוצר מכפל, אז הפעולה ההפוכה היא חילוק.":"Вы вычли. Площадь получается умножением, значит обратное действие — деление.","חילקתם פעמיים.":"Вы разделили дважды.","ללא צורך.":"без надобности.",". חצי מהמכפלה זה שטח משולש, לא מלבן.":". Половина произведения — это площадь треугольника, а не прямоугольника.",". משולש הוא בדיוק חצי מהמלבן שעוטף אותו.":". Треугольник — это ровно половина прямоугольника, который его охватывает.","הכפלתם את שני הבסיסים. בטרפז מחברים אותם, לא מכפילים.":"Вы перемножили основания. В трапеции их складывают, а не перемножают.","חישבתם רק את ממוצע הבסיסים בלי להכפיל בגובה.":"Вы нашли только среднее оснований, не умножив на высоту.","חישבתם ממוצע של הבסיס והגובה.":"Вы нашли среднее основания и высоты.","חישבתם משמ угольник) − S(треугольник)","sin α = מול ÷ יתר":"sin α = противолежащий ÷ гипотенуза","sin הוא הניצב שמול הזווית חלקי היתר. היתר נתון, הניצב שמול — לא.":"sin — это катет, противолежащий углу, делённый на гипотенузу. Гипотенуза дана, противолежащий катет — нет.","tan α = מול ÷ ליד":"tan α = противолежащий ÷ прилежащий","tan הוא הניצב שמול הזווית חלקי הניצב שלידה. הניצב שליד נתון, זה שמול — לא.":"tan — это катет, противолежащий углу, делённый на прилежащий катет. Прилежащий катет дан, противолежащий — нет.","x = הרוחב , האורך = x +":"x = ширина , длина = x +","x = מחיר מחברת , y = מחיר עט":"x = цена тетради , y = цена ручки","אורך מלבן גדול ב":"Длина прямоугольника больше на","אורך צלע אינו יכול להיות שלילי, ולכן הפתרון השני נפסל.":"Длина стороны не может быть отрицательной, поэтому второе решение отбрасываем.","אחוז שינוי = (חדש − ישן) ÷ ישן ·":"Процент изменения = (новое − старое) ÷ старое ·","אחר כך החזקה":"Затем степень","אי אפשר להציב לפני שיודעים גם את m וגם את b, ואת שניהם צריך למצוא מהנקודות.":"Нельзя подставлять, пока не известны и m, и b, а оба нужно найти по точкам.","אי אפשר לכנס שורשים שאינם זהים — אבל אולי הם כן יהיו זהים אחרי פישוט. משם מתחילים.":"Нельзя приводить неодинаковые корни — но, возможно, они станут одинаковыми после упрощения. С этого и начинаем.","אין כאן משוואה — צריך לכתוב אותה. מסמנים באות את הצלע המבוקשת ומבטאים דרכה את השנייה.":"Уравнения здесь нет — его нужно составить. Обозначаем буквой искомую сторону и выражаем через неё вторую.","אין שינוי במחיר":"Цена не изменилась","אם הממוצע":"Если среднее","ארבע פעולות בתרגיל אחד. הסדר הוא סוגריים, אחר כך חזקה, אחר כך כפל, והחיבור אחרון.":"Четыре действия в одном примере. Порядок: скобки, затем степень, затем умножение, а сложение последним.","באיזו נקודה חותך את ציר ה-x הישר העובר בשתי הנקודות?":"В какой точке прямая, проходящая через две точки, пересекает ось x?","בדיוק פעם אחת?":"ровно один раз?","בודקים מה ההגדרה דורשת":"Проверяем, что требует определение","בוחרים את הפתרון שמתאים לשאלה":"Выбираем решение, подходящее к вопросу","בחזקה של חזקה חיברתם מעריכים במקום להכפיל אותם.":"В степени степени вы сложили показатели вместо того, чтобы перемножить их.","בין האיבר ה":"между членом номер","בכיתה היחס בין מספר הבנים למספר הבנות הוא":"В классе отношение числа мальчиков к числу девочек равно","בכפל שברים גם המכנים מוכפלים — הם לא מתחברים.":"При умножении дробей знаменатели тоже перемножаются — они не складываются.","במשולש ישר זווית שתי צלעות קובעות את השלישית.":"В прямоугольном треугольнике две стороны определяют третью.","בסדר הפעולות הסוגריים קודמים להכול — גם לחזקה.":"В порядке действий скобки идут раньше всего — даже раньше степени.","בסדר הפעולות כפל קודם לחיבור, גם כשהוא כתוב אחרון וגם כשמדובר בשברים.":"В порядке действий умножение раньше сложения, даже если оно записано последним и даже если это дроби.","בסדרה חשבונית האיבר ה":"В арифметической прогрессии член номер","בסיס כפול גובה חלקי":"Основание умножить на высоту, делённое на","בשביל שטח צריך שני ניצבים, וכאן נתון רק אחד. אז השאלה הראשונה היא איך משיגים את השני.":"Для площади нужны два катета, а здесь дан только один. Значит, первый вопрос — как получить второй.","דילגתם על החזקה. מה שבסוגריים מועלה בריבוע לפני הכפל.":"Вы пропустили степень. То, что в скобках, возводится в квадрат до умножения.","האיבר האמצעי בפתיחת הריבוע הוא כפול המכפלה, ולא המכפלה עצמה.":"Средний член при раскрытии квадрата — это удвоенное произведение, а не само произведение.","ההגדרה זקוקה לצלע שאינה נתונה. במשולש ישר זווית תמיד אפשר להשלים צלע שלישית משתי האחרות.":"Определению нужна сторона, которая не дана. В прямоугольном треугольнике третью сторону всегда можно найти по двум другим.","ההטלות בלתי תלויות, ולכן מכפילים.":"Броски независимы, поэтому перемножаем.","ההיקף אינו השטח, אבל ממנו אפשר להגיע לצלע החסרה — ומשם לשטח.":"Периметр — не площадь, но из него можно найти недостающую сторону — а из неё площадь.","ההפרש הוא המספר שהוסף":"Разность — это добавленное число","הוא c² ולא c.":"равен c², а не c.","הופכים את השבר שאחרי סימן החילוק ומכפילים.":"Переворачиваем дробь после знака деления и умножаем.","הופכים שבר לאחוזים":"Переводим дробь в проценты","החזקה החיצונית חלה גם על המקדם":"Внешняя степень относится и к коэффициенту","החזקה החיצונית חלה על כל גורם בפנים, וחזקה של חזקה מכפילה מעריכים.":"Внешняя степень относится к каждому множителю внутри, а степень степени перемножает показатели.","החציון נמדד על כל חמשת המספרים, ואחד מהם עדיין לא ידוע. אז יש כאן שני שלבים.":"Медиана считается по всем пяти числам, а одно из них ещё неизвестно. Значит, здесь два шага.","היחס אינו אחוז. קודם בודקים מכמה חלקים מורכב השלם.":"Отношение — не процент. Сначала проверяем, из скольких частей состоит целое.","היחס נותן חלקים, ואחוז נמדד תמיד מתוך השלם. אז קודם מחשבים כמה חלקים יש בסך הכול.":"Отношение даёт части, а процент всегда считается от целого. Поэтому сначала находим, сколько всего частей.","היקף הוא סכום שלוש הצלעות, והצלע השלישית אינה נתונה.":"Периметр — это сумма трёх сторон, а третья сторона не дана.","היקף הוא סכום שלוש הצלעות. אחת מהן חסרה — ואותה אפשר לחשב מהשתיים האחרות.":"Периметр — это сумма трёх сторон. Одной из них нет — и её можно вычислить по двум другим.","היקף מלבן הוא":"Периметр прямоугольника равен","הישר עובר בשתי הנקודות שלפניכם. מהו ערך y כאשר x =":"Прямая проходит через две данные точки. Каково значение y, когда x =","הישר עובר בשתי הנקודות שלפניכם. מהו ערך y כאשר x = −":"Прямая проходит через две данные точки. Каково значение y, когда x = −","היתר ידוע, ולכן מחסרים ריבועים.":"Гипотенуза известна, поэтому квадраты вычитаем.","הכיוון הפוך. שווה להשוות את המחיר הסופי למחיר המקורי ולראות מי גדול.":"Направление обратное. Стоит сравнить конечную цену с исходной и посмотреть, какая больше.","הכפלתם את האיבר הראשון במספר האיברים, כאילו כל האיברים שווים.":"Вы умножили первый член на число членов, как будто все члены равны.","הכפלתם את ההיקף באורך. השטח מחושב משתי הצלעות, לא מההיקף.":"Вы умножили периметр на длину. Площадь считается по двум сторонам, а не по периметру.","הכפלתם את הזוג הלא נכון. סימן הכפל נמצא בין שני השברים האחרונים.":"Вы перемножили не ту пару. Знак умножения стоит между двумя последними дробями.","הכפלתם את היתר בניצב. שטח משולש ישר זווית מחושב משני הניצבים בלבד.":"Вы умножили гипотенузу на катет. Площадь прямоугольного треугольника считается только по двум катетам.","הכפלתם את המקדמים במקום לחבר אותם.":"Вы перемножили коэффициенты вместо того, чтобы сложить их.","הכפלתם את הסוגריים בשתיים. העלאה בריבוע היא כפל של הביטוי בעצמו, ולא כפל בשתיים.":"Вы умножили скобки на два. Возведение в квадрат — это умножение выражения на само себя, а не на два.","הכפלתם את שינוי הממוצע בכמות. חסר כאן הערך של הממוצע עצמו.":"Вы умножили изменение среднего на количество. Здесь не хватает значения самого среднего.","הכפלתם בלי להפוך. בחילוק בשבר חייבים להפוך את השבר השני.":"Вы умножили, не перевернув. При делении на дробь вторую дробь обязательно переворачивают.","הכפלתם במכנה רק את ה-x. המכנה מוכפל בכל מה שמעל קו השבר.":"Вы умножили на знаменатель только x. На знаменатель умножается всё, что над дробной чертой.","המינוס לפני הסוגריים השניים חל על שני האיברים שבתוכם, ולא רק על הראשון.":"Минус перед вторыми скобками относится к обоим членам внутри, а не только к первому.","המכנה הוא הסך הכול, לא הקבוצה השנייה.":"Знаменатель — это общее количество, а не вторая группа.","המספר שבחוץ מוכפל גם ב-x וגם במספר שלידו.":"Число снаружи умножается и на x, и на число рядом с ним.","המשוואה לא כתובה בצורה שאפשר לפרק. קודם מסדרים אותה כך שבצד אחד יהיה אפס.":"Уравнение записано не в том виде, который можно разложить. Сначала приводим его так, чтобы в одной части был нуль.","הנחתם שזה ריבוע. שתי הצלעות כאן אינן שוות.":"Вы решили, что это квадрат. Здесь две стороны не равны.","הסוגריים קודמים לחילוק, ולחיסור שברים צריך מכנה משותף.":"Скобки раньше деления, а для вычитания дробей нужен общий знаменатель.","הסכום אחרי התוספת":"Сумма после добавления","הסכום לפני התוספת":"Сумма до добавления","העליתם כל מספר בסוגריים בריבוע בנפרד. (a − b)² אינו a² − b².":"Вы возвели каждое число в скобках в квадрат отдельно. (a − b)² — это не a² − b².","הפכתם את השבר הלא נכון — יצא הפוך לגמרי.":"Вы перевернули не ту дробь — вышло совсем наоборот.","הפכתם את השבר. הניצב שמול הזווית הוא המונה.":"Вы перевернули дробь. Катет, противолежащий углу, — это числитель.","הצבתם את b כתשובה. b הוא נקודת החיתוך עם ציר y, וצריך עוד לפתור mx + b =":"Вы взяли b как ответ. b — это точка пересечения с осью y, а ещё нужно решить mx + b =","הצבתם בשיפוע ושכחתם את b. y = mx + b, לא y = mx.":"Вы подставили в угловой коэффициент и забыли b. y = mx + b, а не y = mx.","הצורה מורכבת משתי צורות שכבר מוכרות. מחשבים כל אחת בנפרד, ואז מחליטים אם לחבר או לחסר.":"Фигура составлена из двух уже знакомых фигур. Считаем каждую отдельно, а потом решаем, складывать или вычитать.","הרוחב =":"Ширина =","הריבוע יצא שלילי. מספר בריבוע לעולם אינו שלילי, גם כשהבסיס שלילי.":"Квадрат вышел отрицательным. Число в квадрате никогда не отрицательно, даже если основание отрицательное.","השינוי השני מחושב מהמחיר החדש, לא מהמחיר המקורי. זו כל הנקודה.":"Второе изменение считается от новой цены, а не от исходной. В этом вся суть.","התחלתם מהחילוק. הסוגריים קודמים לכל פעולה אחרת.":"Вы начали с деления. Скобки идут раньше любого другого действия.","התייחסתם לאיבר ה":"Вы взяли член номер","התייקרות של":"Подорожание на","התעלמתם מהאיבר החופשי והוצאתם x מחוץ לסוגריים. יש כאן גם מספר בלי x.":"Вы не учли свободный член и вынесли x за скобки. Здесь есть и число без x.","ואותו דבר בשני":"И то же самое со вторым","ואחר כך ירד ב":"а затем снизилась на","ואחר כך עלה ב":"а затем выросла на","ולבסוף החיבור":"И наконец сложение","וסכומם":"а их сумма","ורק עכשיו מחברים":"И только теперь складываем","ורק עכשיו מחשבים שטח":"И только теперь считаем площадь","ורק עכשיו מציבים בהגדרה":"И только теперь подставляем в определение","ורק עכשיו צריך מכנה משותף.":"И только теперь нужен общий знаменатель.","ורק שורשים זהים אפשר לכנס. מחברים או מחסרים אך ורק את המקדמים.":"И только одинаковые корни можно приводить. Складываем или вычитаем только коэффициенты.","זה cos α — הניצב שליד חלקי היתר. השאלה מבקשת sin, וההגדרה שלו דורשת את הניצב שמול הזווית.":"Это cos α — прилежащий катет, делённый на гипотенузу. В вопросе спрашивают sin, а его определению нужен катет, противолежащий углу.","זה cos α — הניצב שליד חלקי היתר. השאלה מבקשת tan, וההגדרה שלו דורשת את הניצב שמול הזווית.":"Это cos α — прилежащий катет, делённый на гипотенузу. В вопросе спрашивают tan, а его определению нужен катет, противолежащий углу.","זה גודל השינוי בממוצע, לא המספר שהוסף.":"Это размер изменения среднего, а не добавленное число.","זה האורך. השאלה מבקשת את הרוחב, והוא הקטן מביניהם.":"Это длина. В вопросе спрашивают ширину, а она меньшая из двух.","זה האחוז של הקבוצה השנייה.":"Это процент второй группы.","זה האיבר ה":"Это член номер","זה ההיקף — סכום הצלעות. שטח הוא מכפלה.":"Это периметр — сумма сторон. Площадь — это произведение.","זה הטווח — ההפרש בין הגדול לקטן.":"Это размах — разность между наибольшим и наименьшим.","זה היקף מלבן שצלעותיו":"Это периметр прямоугольника со сторонами","זה המחיר של מחברת ועט יחד.":"Это цена тетради и ручки вместе.","זה הממוצע החדש. מספר שמוסיפים כדי להעלות ממוצע חייב להיות גדול ממנו.":"Это новое среднее. Число, которое добавляют, чтобы поднять среднее, должно быть больше него.","זה הממוצע הקודם, לפני שהוסף המספר.":"Это прежнее среднее, до добавления числа.","זה הממוצע שנתון בשאלה. ממוצע וחציון אינם אותו דבר.":"Это среднее, данное в задаче. Среднее и медиана — не одно и то же.","זה המספר החסר שמצאתם. הוא צעד בדרך, לא התשובה.":"Это найденное вами недостающее число. Это шаг на пути, а не ответ.","זה המרחק הכולל בקילומטרים, לא המהירות.":"Это общее расстояние в километрах, а не скорость.","זה הניצב שמצאתם, ועדיין לא השטח.":"Это найденный вами катет, а ещё не площадь.","זה הפתרון השני של המשוואה, אבל אורך צלע אינו יכול להיות שלילי.":"Это второе решение уравнения, но длина стороны не может быть отрицательной.","זה השטח, לא ההיקף.":"Это площадь, а не периметр.","זה השינוי השני בלבד. השאלה מבקשת את השינוי לעומת המחיר המקורי.":"Это только второе изменение. В задаче спрашивают об изменении относительно исходной цены.","זה לא הממוצע של שתי המהירויות — הן לא נמשכו אותו מספר שעות.":"Это не среднее двух скоростей — они длились разное число часов.","זה ערך ה-x שנתון בשאלה, לא ה-y שמחפשים.":"Это значение x, данное в задаче, а не искомый y.","זה ערך ה-y רק כאשר x =":"Это значение y только при x =","זה שטח המשולש שהוסר בלבד.":"Это площадь только вырезанного треугольника.","זו ההגדרה של ציר ה-x, וזה מה שהופך את השאלה למשוואה.":"Это определение оси x, и именно оно превращает вопрос в уравнение.","זו ההסתברות ל״לפחות פעם אחת״, והיא כוללת גם את המקרה שבו המספר הופיע פעמיים.":"Это вероятность «хотя бы один раз», и она включает также случай, когда число выпало дважды.","זו ההסתברות שהמספר לא הופיע אף פעם. זה בדיוק המאורע ההפוך — נשאר להשלים ל":"Это вероятность того, что число не выпало ни разу. Это как раз противоположное событие — осталось дополнить до","זו ההסתברות ששתי ההטלות נתנו את המספר.":"Это вероятность того, что оба броска дали это число.","זו ההסתברות ששתי ההטלות נתנו את המספר. ״לפחות אחת״ כולל גם מקרה אחד בלבד.":"Это вероятность того, что оба броска дали это число. «Хотя бы один» включает и случай только одного.","זו נקודה שנתונה בשאלה, לא נקודת החיתוך עם הציר.":"Это точка, данная в задаче, а не точка пересечения с осью.","זו נקודת החיתוך עם ציר y. על ציר x דווקא ה-y הוא שמתאפס.":"Это точка пересечения с осью y. А на оси x нулю равен как раз y.","חוזרים אחורה אל האיבר הראשון":"Возвращаемся назад к первому члену","חוזרים אחורה אל הראשון, צעד אחרי צעד.":"Возвращаемся назад к первому, шаг за шагом.","חוזרים לשאלה":"Возвращаемся к вопросу","חיברתם את המספרים שבתוך השורש. √a + √b אינו √(a+b).":"Вы сложили числа под корнем. √a + √b не равно √(a+b).","חיברתם את המקדמים במקום לחסר אותם.":"Вы сложили коэффициенты, а не вычли их.","חיברתם את השיפוע ל-x במקום להכפיל.":"Вы прибавили угловой коэффициент к x, а не умножили.","חיברתם את מקדמי ה-x במקום לחסר אותם.":"Вы сложили коэффициенты при x, а не вычли их.","חיברתם את שלושת השברים. באמצע יש כפל, לא חיבור.":"Вы сложили все три дроби. В середине стоит умножение, а не сложение.","חיברתם את שני האחוזים. שינוי אחד מעלה ואחד מוריד — הם לא מצטברים לאותו כיוון.":"Вы сложили оба процента. Одно изменение повышает, другое понижает — они не складываются в одну сторону.","חיברתם את שתי ההטלות. החיבור סופר פעמיים את המקרה שבו שתיהן הצליחו.":"Вы сложили два броска. Сложение считает дважды случай, когда удались оба.","חיברתם את שתי המהירויות. מהירויות מתחברות רק כששני גופים נעים זה לקראת זה.":"Вы сложили две скорости. Скорости складываются только когда два тела движутся навстречу друг другу.","חיברתם במקום לחסר. המשולש הוסר מהמלבן.":"Вы сложили, а не вычли. Треугольник вырезан из прямоугольника.","חיברתם מונה עם מונה ומכנה עם מכנה. בחיבור שברים חייבים מכנה משותף.":"Вы сложили числитель с числителем и знаменатель со знаменателем. При сложении дробей нужен общий знаменатель.","חיברתם רק את שני הניצבים. להיקף צריך גם את היתר.":"Вы сложили только два катета. Для периметра нужна и гипотенуза.","חילוק באותו בסיס — מחסרים מעריכים":"Деление с одинаковым основанием — вычитаем показатели","חילקתם את הסכום במספר הפריטים, כאילו כולם עולים אותו דבר.":"Вы разделили сумму на число предметов, как будто все стоят одинаково.","חילקתם את השטח בהפרש בין הצלעות. ההפרש אינו אחת הצלעות.":"Вы разделили площадь на разность сторон. Разность — не одна из сторон.","חילקתם בקבוצה השנייה. אחוז נמדד תמיד מתוך הסך הכול.":"Вы разделили на вторую группу. Процент всегда считается от общего количества.","חיסרתם אחוז מאחוז. אחוזים אינם מתחברים ואינם מתחסרים — כל אחד מהם מחושב מבסיס אחר.":"Вы вычли процент из процента. Проценты не складываются и не вычитаются — каждый из них считается от другой базы.","חיסרתם את המעריכים בכיוון ההפוך. מחסרים את המעריך של המכנה מזה של המונה.":"Вы вычли показатели в обратном порядке. Из показателя числителя вычитаем показатель знаменателя.","חיסרתם את הצלעות עצמן. בפיתגורס מחסרים את הריבועים שלהן, ורק אז מוציאים שורש.":"Вы вычли сами стороны. По теореме Пифагора вычитают их квадраты, и только потом извлекают корень.","חיסרתם את מכפלת הבסיס בגובה. שטח משולש הוא חצי מזה.":"Вы вычли произведение основания на высоту. Площадь треугольника — половина этого.","חיסרתם מונה ממונה ומכנה ממכנה. בחיסור שברים חייבים מכנה משותף.":"Вы вычли числитель из числителя и знаменатель из знаменателя. При вычитании дробей нужен общий знаменатель.","חיסרתם צלע אחת בלבד. בהיקף כל צלע מופיעה פעמיים.":"Вы вычли только одну сторону. В периметре каждая сторона входит дважды.","חישבתם חציון של ארבעת המספרים הידועים בלבד, בלי המספר החסר.":"Вы нашли медиану только четырёх известных чисел, без недостающего.","חישבתם ממוצע של שתי המהירויות. הן לא נמשכו אותו זמן, ולכן המשקל שלהן שונה.":"Вы нашли среднее двух скоростей. Они длились разное время, поэтому их вес разный.","חישבתם משמאל לימין. הכפל קודם לחיבור, גם כשהוא כתוב אחרון.":"Вы считали слева направо. Умножение выполняется раньше сложения, даже если записано последним.","חישבתם משמאל לימין. כפל קודם לחיבור, גם בשברים.":"Вы считали слева направо. Умножение раньше сложения, и в дробях тоже.","חישבתם רק סדר אחד. ״בדיוק פעם אחת״ מתקיים בשתי דרכים — וצריך לחבר אותן.":"Вы посчитали только один порядок. «Ровно один раз» происходит двумя способами — и их нужно сложить.","חצי ההיקף הוא סכום שתי הצלעות, ולא הרוחב עצמו.":"Половина периметра — это сумма двух сторон, а не сама ширина.","חציון בלי סידור הוא טעות כמעט ודאית.":"Медиана без упорядочивания — почти гарантированная ошибка.","טעות בסימן המכפלה. שני סימנים זהים נותנים פלוס, סימנים שונים נותנים מינוס.":"Ошибка в знаке произведения. Два одинаковых знака дают плюс, разные знаки дают минус.","טעות סימן ב-b בשלב ההצבה.":"Ошибка знака у b при подстановке.","טעות סימן בחילוק ב-m.":"Ошибка знака при делении на m.","טעות סימן בשלב האחרון, כשחילקתם במקדם.":"Ошибка знака на последнем шаге, при делении на коэффициент.","ירידה של":"снижение на","יש כאן גם שברים וגם סוגריים. כל עוד יש מכנים אי אפשר להעביר אגפים — אז מהם מתחילים.":"Здесь и дроби, и скобки. Пока есть знаменатели, переносить слагаемые нельзя — поэтому начинаем с них.","יש כאן חמישה מספרים, ולכן החציון הוא זה שבמקום השלישי.":"Здесь пять чисел, поэтому медиана — то, что стоит на третьем месте.","יש כאן שתי נוסחאות כפל מקוצר שונות. פותחים כל אחת בנפרד, ורק אחר כך מחסרים ומכנסים.":"Здесь две разные формулы сокращённого умножения. Раскрываем каждую отдельно, и только потом вычитаем и приводим подобные.","יש כאן שתי פעולות שונות. השאלה הראשונה היא לא איך מחברים — אלא מה עושים קודם.":"Здесь два разных действия. Первый вопрос — не как складывать, а что делать сначала.","יש כאן שתי פעולות שונות. השאלה הראשונה היא לא איך מחלקים — אלא מה עושים קודם.":"Здесь два разных действия. Первый вопрос — не как делить, а что делать сначала.","כאילו הוא האיבר הראשון. צריך קודם לחזור אחורה אליו.":"Как будто это первый член. Сначала нужно вернуться назад к нему.","כותבים את החלק המבוקש כשבר":"Записываем искомую часть в виде дроби","כותבים את השטח כמשוואה":"Записываем площадь в виде уравнения","כינסתם גם את מה שבתוך השורש. השורש הוא ה״שם״ של האיבר — הוא נשאר כמו שהוא.":"Вы сложили и то, что под корнем. Корень — это «имя» слагаемого, он остаётся как есть.","כל איבר שעובר אגף מחליף סימן.":"Каждое слагаемое при переносе в другую часть меняет знак.","כל דבר שמחירו לא ידוע מקבל אות משלו.":"Всё, чья цена неизвестна, получает свою букву.","כל דרך היא מכפלה":"Каждый путь — произведение","כל קנייה היא משוואה":"Каждая покупка — уравнение","כפל באותו בסיס — מחברים מעריכים":"Умножение с одинаковым основанием — складываем показатели","כפל קודם לחיבור, גם כשהוא כתוב אחרון.":"Умножение раньше сложения, даже если записано последним.","לא צמצמתם: x² מופיע פעמיים עם סימנים הפוכים והוא מתבטל.":"Вы не упростили: x² встречается дважды с противоположными знаками и сокращается.","לאיבר ה":"к члену номер","לוקחים את האמצעי":"Берём средний","לחמישה מספרים יש ממוצע":"Среднее пяти чисел равно","לפחות פעם אחת?":"хотя бы один раз?","לקחתם את האיבר האמצעי לפי הסדר שבו הם כתובים. חייבים לסדר קודם.":"Вы взяли средний элемент в том порядке, в котором числа записаны. Сначала нужно упорядочить.","לקחתם את המספרים כפי שהם מופיעים במשוואה, בלי לפרק.":"Вы взяли числа так, как они стоят в уравнении, без разложения.","מה חסר כדי לחשב היקף":"Чего не хватает для вычисления периметра","מה חסר כדי לחשב שטח":"Чего не хватает для вычисления площади","מהאיבר ה":"От члена номер","מההיקף לרוחב":"От периметра к ширине","מהירות ממוצעת = כל המרחק חלקי כל הזמן":"Средняя скорость = весь путь делить на всё время","מהירות ממוצעת אינה ממוצע של מהירויות. היא כל המרחק חלקי כל הזמן — אז קודם מחשבים את שניהם.":"Средняя скорость — не среднее скоростей. Это весь путь, делённый на всё время, — поэтому сначала находим и то, и другое.","מוצאים את ההפרש":"Находим разность","מוצאים את היתר":"Находим гипотенузу","מוצאים את הניצב החסר":"Находим недостающий катет","מוצאים את שני המחירים":"Находим обе цены","מחברות ו":"тетрадей и","מחברים ומצמצמים":"Складываем и упрощаем","מחסרים את הסוגריים השניים כולם":"Вычитаем вторые скобки целиком","מחפשים שני מספרים שמכפלתם −":"Ищем два числа, произведение которых −","מחשבים את ההסתברות לא לקבל בהטלה אחת":"Вычисляем вероятность не получить его за один бросок","מחשבים את המחיר אחרי השינוי הראשון":"Вычисляем цену после первого изменения","מחשבים את המחיר אחרי השינוי השני":"Вычисляем цену после второго изменения","מחשבים כמה נסע בכל קטע":"Вычисляем, сколько проехал на каждом участке","מינוס לפני סוגריים הופך את הסימן של כל איבר בתוכם, גם של השני.":"Минус перед скобками меняет знак каждого слагаемого внутри, в том числе второго.","מכפילים את שני האגפים במכנה המשותף":"Умножаем обе части на общий знаменатель","מכפילים ב":"Умножаем на","מכפילים ומצמצמים":"Умножаем и упрощаем","מכפילים כל משוואה כך שמקדמי ה-y יתבטלו, ומחברים.":"Умножаем каждое уравнение так, чтобы коэффициенты при y сократились, и складываем.","ממוצע הוא משוואה":"Среднее — это уравнение","ממוצע כפול כמות = סכום. חשבו את הסכום לפני ואת הסכום אחרי, וההפרש הוא התשובה.":"Среднее умножить на количество = сумма. Найдите сумму до и сумму после, и разность — это ответ.","ממוצע כפול כמות נותן את הסכום.":"Среднее, умноженное на количество, даёт сумму.","ממלבן שאורכו":"Из прямоугольника, длина которого","מסדרים למשוואה ריבועית":"Приводим к квадратному уравнению","מסכמים את כל הדרך ואת כל הזמן":"Складываем весь путь и всё время","מסלקים נעלם אחד":"Исключаем одно неизвестное","מסמנים את הנעלם":"Обозначаем неизвестное","מסמנים את הנעלמים":"Обозначаем неизвестные","מסמנים ב-x את הצלע שמחפשים, ומבטאים דרכה את השנייה.":"Обозначаем через x искомую сторону и выражаем через неё вторую.","מספר שלילי בריבוע יוצא חיובי: מינוס כפול מינוס נותן פלוס.":"Отрицательное число в квадрате даёт положительное: минус на минус даёт плюс.","מספר שעבר אגף לא החליף סימן.":"Число при переносе в другую часть не поменяло знак.","מספרים, והממוצע שלהם":"чисел, и их среднее равно","מעבירים הכול לצד אחד":"Переносим всё в одну часть","מעבירים הכול לצד אחד — רק כך אפשר לפרק לגורמים.":"Переносим всё в одну часть — только так можно разложить на множители.","מעלים בריבוע את מה שיצא מהסוגריים.":"Возводим в квадрат то, что получилось из скобок.","מעריך שלילי אינו סימן מינוס של הביטוי — הוא מוריד את החזקה למכנה.":"Отрицательный показатель — не знак минус у выражения, он переводит степень в знаменатель.","מפרקים את המאורע":"Разбиваем событие на части","מפרקים את הצורה לשתיים":"Разбиваем фигуру на две","מפרקים ופותרים":"Разлагаем на множители и решаем","מפשטים כל שורש בנפרד":"Упрощаем каждый корень отдельно","מציבים אחת הנקודות ב-y = mx + b.":"Подставляем одну из точек в y = mx + b.","מרחיבים למכנה משותף":"Приводим к общему знаменателю","מרחק = מהירות · זמן.":"Путь = скорость · время.","משוואה ריבועית נפתרת רק כשבצד אחד יש אפס. זה הצעד שלפני כל השאר.":"Квадратное уравнение решается только когда в одной части стоит ноль. Это шаг перед всеми остальными.","משווים למחיר המקורי":"Сравниваем с исходной ценой","משלימים את המספר החסר":"Находим недостающее число","משלימים ל":"Дополняем до","מתחילים מהסוגריים":"Начинаем со скобок","נוסחת הסכום דורשת את a₁, והוא לא נתון. אז מתחילים מההפרש — הוא מה שמאפשר לחזור אחורה.":"Формула суммы требует a₁, а он не дан. Поэтому начинаем с разности — она позволяет вернуться назад.","נפטרים מהמכנים":"Избавляемся от знаменателей","נשאלנו על מחברת בלבד — ורק את זה עונים.":"Спрашивали только о тетради — и отвечаем только на это.","נשאלנו על עט בלבד — ורק את זה עונים.":"Спрашивали только о ручке — и отвечаем только на это.","ס\"מ גזרו משולש שבסיסו":"см вырезали треугольник, основание которого","ס\"מ ואורכו":"см, а его длина","ס\"מ ואחד הניצבים":"см, а один из катетов","ס\"מ והניצב שליד הזווית α הוא":"см, а катет, прилежащий к углу α, равен","ס\"מ מרוחבו, ושטחו":"см больше ширины, а площадь","ס\"מ. מהו sin α?":"см. Чему равен sin α?","ס\"מ. מהו tan α?":"см. Чему равен tan α?","ס\"מ. מהו היקף המשולש?":"см. Каков периметр треугольника?","ס\"מ. מהו שטח החלק שנשאר?":"см. Какова площадь оставшейся части?","ס\"מ. מהו שטח המשולש?":"см. Какова площадь треугольника?","סופרים מה קל יותר":"Считаем то, что проще","סימן אחד הופך והשני לא — שווה לבדוק שוב את המעבר לצד אחד.":"Один знак поменялся, а другой нет — стоит ещё раз проверить перенос в одну часть.","סמ\"ר. מהו רוחב המלבן?":"кв. см. Какова ширина прямоугольника?","ספרתם מקום אחד מאוחר מדי. מבין חמישה מספרים האמצעי הוא השלישי.":"Вы отсчитали на одно место дальше. Из пяти чисел среднее — третье.","ספרתם מקום אחד מוקדם מדי. מבין חמישה מספרים האמצעי הוא השלישי.":"Вы отсчитали на одно место меньше. Из пяти чисел среднее — третье.","עטים ושילמו":"ручек и заплатили","עכשיו הכפל":"Теперь умножение","עכשיו יש":"Теперь есть","עכשיו יש חמישה מספרים — מסדרים":"Теперь пять чисел — упорядочиваем","עכשיו יש משוואה מלאה, אפשר להציב בה כל x.":"Теперь есть полное уравнение, в него можно подставить любой x.","עכשיו שני השורשים זהים":"Теперь оба корня одинаковые","עלייה של":"повышение на","עצמו, לא הסכום.":"само по себе, а не сумма.","עצרתם אחרי הסוגריים ולא ביצעתם את החילוק.":"Вы остановились после скобок и не выполнили деление.","עצרתם בשבר ולא הכפלתם ב":"Вы остановились на дроби и не умножили на","פאות פעמיים. מה ההסתברות לקבל את המספר":"гранями бросают дважды. Какова вероятность получить число","פותחים את המכפלה השנייה":"Раскрываем второе произведение","פותחים את הריבוע":"Раскрываем квадрат","פותחים את שני זוגות הסוגריים":"Раскрываем обе пары скобок","פשטו וכנסו":"Упростите и приведите подобные","פתרתם כאילו המשוואה כבר מסודרת. כשמעבירים אגף כל הסימנים מתהפכים.":"Вы решали, как будто уравнение уже приведено. При переносе в другую часть все знаки меняются.","פתרתם נכון, אבל עניתם על הנעלם השני. שווה לחזור ולקרוא מה נשאל.":"Вы решили верно, но ответили на второе неизвестное. Стоит вернуться и перечитать, что спрашивали.","צעדים, וכל צעד הוא d.":"шагов, и каждый шаг равен d.","קודם הכפל":"Сначала умножение","קודם מה שבתוך הסוגריים":"Сначала то, что в скобках","קודם מוצאים את הצלע החסרה":"Сначала находим недостающую сторону","קידמתם את ה-y ביחידה אחת לכל צעד ב-x. כל צעד ב-x מזיז את y בגודל השיפוע.":"Вы увеличивали y на единицу за каждый шаг по x. Каждый шаг по x сдвигает y на величину углового коэффициента.","קמ\"ש, ומיד אחר כך":"км/ч, а сразу после этого","קמ\"ש. מהי המהירות הממוצעת שלו לאורך כל הנסיעה?":"км/ч. Какова его средняя скорость за всю поездку?","קנו":"Купили","ראשית הצירים אכן נמצאת על ציר ה-x, אבל הישר הזה אינו עובר דרכה.":"Начало координат действительно лежит на оси x, но эта прямая через него не проходит.","ריבוע של סוגריים אינו ריבוע של כל איבר בנפרד. יש גם איבר אמצעי, וזה מה שהכי הרבה נשכח.":"Квадрат скобок — не квадрат каждого слагаемого отдельно. Есть ещё средний член, и о нём забывают чаще всего.","רכב נסע":"Автомобиль ехал","ש\"ח. באותה חנות קנו":"шекелей. В том же магазине купили","ש\"ח. המחיר ירד ב":"шекелей. Цена снизилась на","ש\"ח. המחיר עלה ב":"шекелей. Цена выросла на","ש\"ח. מה מחיר מחברת אחת?":"шекелей. Сколько стоит одна тетрадь?","ש\"ח. מה מחיר עט אחד?":"шекелей. Сколько стоит одна ручка?","שטח = אורך · רוחב, והרוחב אינו נתון. אותו מוצאים מההיקף.":"Площадь = длина · ширина, а ширина не дана. Её находим из периметра.","שטח המשולש":"Площадь треугольника","שטח מלבן = אורך · רוחב.":"Площадь прямоугольника = длина · ширина.","שטח משולש ישר זווית מחושב משני הניצבים, והניצב השני אינו נתון.":"Площадь прямоугольного треугольника считается по двум катетам, а второй катет не дан.","שטח שנשאר = שטח המלבן פחות שטח המשולש שהוסר.":"Оставшаяся площадь = площадь прямоугольника минус площадь вырезанного треугольника.","שכחתם להוציא שורש —":"Вы забыли извлечь корень —","שכחתם לחלק ב":"Вы забыли разделить на","שלב ב: מוצאים את b":"Шаг Б: находим b","שלב ג: מציבים את ה-x שנשאלנו עליו":"Шаг В: подставляем x, о котором спрашивали","שלב ג: על ציר x מתקיים y =":"Шаг В: на оси x выполняется y =","שלושה חוקים שונים נדרשים כאן. מתחילים מהסוגריים — כל עוד יש חזקה של חזקה, אי אפשר לחבר או לחסר מעריכים.":"Здесь нужны три разных правила. Начинаем со скобок — пока есть степень степени, складывать или вычитать показатели нельзя.","שני איברי x² מתבטלים זה עם זה.":"Два слагаемых с x² взаимно сокращаются.","שני האחוזים מחושבים מבסיסים שונים. מחשבים את המחיר הסופי בפועל, ורק אז משווים אותו למחיר ההתחלתי.":"Оба процента считаются от разных баз. Находим реальную конечную цену, и только потом сравниваем её с начальной.","שני הניצבים ידועים, ולכן מחברים ריבועים.":"Оба катета известны, поэтому складываем квадраты.","שני השורשים נראים זרים זה לזה. מחפשים בכל אחד את הריבוע השלם שמסתתר בו.":"Два корня выглядят совсем разными. Ищем в каждом скрытый в нём полный квадрат.","שעות במהירות":"ч со скоростью","שתי דרכים — מחברים אותן":"Два пути — складываем их","שתי הטלות בלתי תלויות — מכפילים":"Два независимых броска — умножаем","שתי נקודות מגדירות ישר אחד. ועל ציר ה-x כל הנקודות חולקות תכונה אחת — שווה לחשוב מהי.":"Две точки задают одну прямую. А у всех точек на оси x есть одно общее свойство — стоит подумать, какое.","שתי קניות — שתי משוואות. מסמנים באות את מה שלא ידוע, ובסוף בודקים על מה בדיוק נשאלתם.":"Две покупки — два уравнения. Обозначаем буквой неизвестное, а в конце проверяем, о чём именно спрашивали.","״בדיוק פעם אחת״ אינו מקרה יחיד — יש שני סדרים אפשריים, וכל אחד מהם מכפלה.":"«Ровно один раз» — не единственный случай: есть два возможных порядка, и каждый из них — произведение.","״בדיוק פעם אחת״ קורה בשתי דרכים: הצלחה ואז כישלון, או כישלון ואז הצלחה.":"«Ровно один раз» происходит двумя способами: успех, затем неудача, или неудача, затем успех.","״לפחות אחת״ מכסה כמה מקרים. שווה לשאול מה ההפך שלו — כי ההפך הוא מקרה יחיד.":"«Хотя бы один» охватывает несколько случаев. Стоит спросить, что ему противоположно — ведь противоположное событие всего одно.","״לפחות פעם אחת״ מכסה שלושה מקרים שונים. ההפך שלו — ״אף פעם לא״ — הוא מקרה אחד בלבד.":"«Хотя бы один раз» охватывает три разных случая. Противоположное ему — «ни разу» — всего один случай.","− P(אף פעם)":"− P(ни разу)","אומר שהחלקים אינם שווים.":"означает, что части не равны.","בחילוק חיברתם מעריכים. חיבור שייך לכפל, ובחילוק מחסרים.":"При делении вы сложили показатели. Сложение относится к умножению, а при делении вычитают.","בחישוב האיבר האחרון הכפלתם ב-n במקום ב-n מינוס":"При вычислении последнего члена вы умножили на n вместо n минус","במקום בזמן הכולל. מספר הקטעים אינו מספר השעות.":"вместо общего времени. Число участков — не число часов.","החלפתם בין m ל-b. השיפוע הוא זה שמוכפל ב-x.":"Вы перепутали m и b. Угловой коэффициент — тот, что умножается на x.","התייחסתם להטלה אחת בלבד.":"Вы учли только один бросок.","זה ההפרש בין שני המחירים.":"Это разность двух цен.","זה המספר הגדול ביותר, לא האמצעי.":"Это наибольшее число, а не среднее.","זה המספר הקטן ביותר, לא האמצעי.":"Это наименьшее число, а не среднее.","זה הערך המקורב שיוצא במחשבון. השאלה מבקשת תשובה מדויקת בצורת שורש.":"Это приближённое значение с калькулятора. В задаче требуется точный ответ в виде корня.","זה כפול הרוחב. מצאתם צלע, ועדיין לא חישבתם שטח.":"Это удвоенная ширина. Вы нашли сторону, но площадь ещё не вычислили.","זה שטח המלבן כולו, לפני שהוסר ממנו המשולש.":"Это площадь всего прямоуг
