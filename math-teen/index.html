/* ---------- 12. משפט פיתגורס ---------- */
var TRIPLES=[[3,4,5],[6,8,10],[5,12,13],[9,12,15],[8,15,17],[7,24,25],[20,21,29],[12,16,20],[10,24,26],[15,20,25]];
function genPyth(L){
  var t=pick(TRIPLES),a=t[0],b=t[1],c=t[2],steps;
  if(L===1){
    steps=[
      S("מזהים את היתר","היתר הוא הצלע שמול הזווית הישרה — תמיד הארוכה ביותר. כאן היא הנעלם.",
        "a² + b² = c²"),
      S("מציבים","",a+"² + "+b+"² = c²"),
      S("מחשבים","",(a*a)+" + "+(b*b)+" = "+(c*c)),
      S("מוציאים שורש","","c = √"+(c*c)+" = "+c)
    ];
    return {ask:"במשולש ישר זווית הניצבים הם "+a+" ו-"+b+". מהו אורך היתר?",expr:"",
      fig:svgRightTri(a,b,"?"),ans:W(String(c)),
      wrong:[
        W(String(a+b),"חיברתם את הניצבים. פיתגורס עובד על הריבועים, לא על הצלעות עצמן."),
        W(String(c*c),"עצרתם לפני הוצאת השורש — "+(c*c)+" זה c², לא c."),
        W(String(Math.round(Math.sqrt(Math.abs(b*b-a*a))*100)/100),"חיסרתם במקום לחבר. מחסרים רק כשמחפשים ניצב, לא יתר.")
      ],steps:steps,rule:"pyth",
      hint:"היתר הוא הצלע מול הזווית הישרה: a² + b² = c²."};
  }
  if(L===2){
    steps=[
      S("מזהים מה חסר","היתר "+c+" ידוע, ואחד הניצבים חסר. לכן מחסרים.","a² = c² − b²"),
      S("מציבים","","a² = "+c+"² − "+b+"² = "+(c*c)+" − "+(b*b)),
      S("מחשבים","","a² = "+(a*a)),
      S("מוציאים שורש","","a = √"+(a*a)+" = "+a)
    ];
    return {ask:"במשולש ישר זווית היתר הוא "+c+" ואחד הניצבים "+b+". מהו הניצב השני?",expr:"",
      fig:svgRightTri("?",b,c),ans:W(String(a)),
      wrong:[
        W(String(Math.round(Math.sqrt(c*c+b*b)*100)/100),"חיברתם. כשמחפשים ניצב מחסרים את ריבוע הניצב הידוע מריבוע היתר."),
        W(String(c-b),"חיסרתם את הצלעות עצמן במקום את הריבועים שלהן."),
        W(String(a*a),"זה a², צריך להוציא שורש.")
      ],steps:steps,rule:"pyth",
      hint:"כשהיתר ידוע והניצב חסר — מחסרים: a² = c² − b²."};
  }
  var scale=pick([1,1,2]);
  var w=b*scale,hgt=a*scale,dg=c*scale;
  steps=[
    S("מציירים ומזהים משולש ישר זווית","האלכסון של מלבן יוצר משולש ישר זווית שצלעותיו הן שתי צלעות המלבן.",
      "אורך² + רוחב² = אלכסון²"),
    S("מציבים","",w+"² + "+hgt+"² = d²"),
    S("מחשבים","",(w*w)+" + "+(hgt*hgt)+" = "+(dg*dg)),
    S("מוציאים שורש","","d = "+dg+" ס\"מ")
  ];
  return {ask:"מלבן שאורכו "+w+' ס"מ ורוחבו '+hgt+' ס"מ. מהו אורך האלכסון?',expr:"",
    fig:figWrap('<rect x="45" y="40" width="200" height="110" rx="3" stroke="var(--accent)" stroke-width="2.5"/>'+
      '<path d="M45 150 L245 40" stroke="var(--cyan)" stroke-width="2.5"/>'+
      txt(145,172,String(w))+txt(266,100,String(hgt),"start")+txt(160,88,"d"),300,190),
    ans:W(dg+' ס"מ'),
    wrong:[
      W((w+hgt)+' ס"מ',"חיברתם את הצלעות. האלכסון תמיד קצר מסכום שתי הצלעות."),
      W((dg*dg)+' ס"מ',"שכחתם להוציא שורש בסוף."),
      W(num(Math.round(Math.sqrt(Math.abs(w*w-hgt*hgt))*100)/100)+' ס"מ',"חיסרתם. האלכסון הוא היתר, ולכן מחברים.")
    ],steps:steps,rule:"pyth",
    hint:"האלכסון של מלבן הוא היתר במשולש ישר זווית שצלעותיו הן האורך והרוחב."};
}
/* ---------- 13. שטחים והיקפים ---------- */
function genGeo(L){
  var a,b,h,steps;
  if(L===1){
    a=ri(4,20);b=ri(3,18);
    if(Math.random()<0.5){
      return {ask:"מלבן שאורכו "+a+' ס"מ ורוחבו '+b+' ס"מ. מהו שטחו?',expr:"",fig:svgRect(a,b),
        ans:W((a*b)+' סמ"ר'),
        wrong:[
          W((2*(a+b))+' סמ"ר',"זה ההיקף — סכום כל הצלעות. שטח הוא אורך כפול רוחב."),
          W((a+b)+' סמ"ר',"חיברתם את הצלעות במקום להכפיל."),
          W((a*b/2)+' סמ"ר',"חילקתם ב-2. חצי מהמכפלה זה שטח משולש, לא מלבן.")
        ],
        steps:[S("נוסחת שטח מלבן","שטח = אורך · רוחב","S = a · b"),
               S("מציבים","","S = "+a+" · "+b),
               S("מחשבים","","S = "+(a*b)+' סמ"ר')],
        rule:"rect",hint:"שטח מלבן = אורך כפול רוחב. היקף = סכום כל ארבע הצלעות."};
    }
    h=ri(3,16);b=ri(4,20);
    return {ask:"משולש שבסיסו "+b+' ס"מ וגובהו '+h+' ס"מ. מהו שטחו?',expr:"",
      fig:figWrap('<path d="M45 150 L245 150 L165 45 Z" stroke="var(--accent)" stroke-width="2.5"/>'+
        '<path d="M165 150 L165 45" stroke="var(--cyan)" stroke-width="2" stroke-dasharray="5 4"/>'+
        '<path d="M165 136 L151 136 L151 150" stroke="var(--muted)" stroke-width="1.6"/>'+
        txt(145,172,String(b))+txt(178,100,String(h),"start"),300,190),
      ans:W(num(b*h/2)+' סמ"ר'),
      wrong:[
        W((b*h)+' סמ"ר',"שכחתם לחלק ב-2. משולש הוא בדיוק חצי מהמלבן שעוטף אותו."),
        W(num(b+h)+' סמ"ר',"חיברתם במקום להכפיל."),
        W(num((b+h)/2)+' סמ"ר',"חישבתם ממוצע של הבסיס והגובה.")
      ],
      steps:[S("נוסחת שטח משולש","שטח = בסיס · גובה חלקי 2. החלוקה ב-2 היא כי משולש הוא חצי מלבן.","S = (b · h) ÷ 2"),
             S("מציבים","","S = ("+b+" · "+h+") ÷ 2"),
             S("מחשבים","","S = "+(b*h)+" ÷ 2 = "+num(b*h/2)+' סמ"ר')],
      rule:"tri",hint:"שטח משולש = בסיס כפול גובה, ואז לחלק ב-2."};
  }
  if(L===2){
    var r=ri(3,12);   /* ב-r=2 היקף ושטח מתלכדים מספרית והמסיחים קורסים */
    if(Math.random()<0.5){
      return {ask:"מעגל שרדיוסו "+r+' ס"מ. מהו שטחו?',expr:"",fig:svgCircle("r = "+r),
        ans:W((r*r)+"π"),
        wrong:[
          W((2*r)+"π","זה ההיקף — 2πr. שטח הוא πr²."),
          W((4*r*r)+"π","השתמשתם בקוטר במקום ברדיוס. בנוסחה r הוא הרדיוס — חצי מהקוטר."),
          W(num(r*r/2)+"π","חילקתם ב-2 ללא צורך.")
        ],
        steps:[S("נוסחת שטח מעגל","S = π · r²","S = πr²"),
               S("מציבים","","S = π · "+r+"²"),
               S("מחשבים","","S = "+(r*r)+"π סמ\"ר")],
        rule:"circle",hint:"שטח מעגל = π כפול הרדיוס בריבוע. את ההיקף מחשבים עם 2πr."};
    }
    return {ask:"מעגל שרדיוסו "+r+' ס"מ. מהו היקפו?',expr:"",fig:svgCircle("r = "+r),
      ans:W((2*r)+"π"),
      wrong:[
        W((r*r)+"π","זה השטח — πr². היקף הוא 2πr."),
        W(r+"π","שכחתם את המכפלה ב-2. ההיקף מחושב לפי הקוטר, שהוא פי שניים מהרדיוס."),
        W((4*r)+"π","הכפלתם ב-4 במקום ב-2."),
        W(num(r*r/2)+"π","חילקתם ב-2 ללא צורך.")
      ],
      steps:[S("נוסחת היקף מעגל","P = 2 · π · r","P = 2πr"),
             S("מציבים","","P = 2 · π · "+r),
             S("מחשבים","","P = "+(2*r)+"π ס\"מ")],
      rule:"circle",hint:"היקף מעגל = 2πr. שטח = πr². אל תתבלבלו ביניהם."};
  }
  /* רמה 3: טרפז, או בעיה הפוכה */
  if(Math.random()<0.5){
    a=ri(4,16);b=a+ri(2,10);h=pick([2,4,6,8,10]);
    return {ask:"טרפז שבסיסיו "+a+" ו-"+b+' ס"מ וגובהו '+h+' ס"מ. מהו שטחו?',expr:"",fig:svgTrap(b,a,h),
      ans:W(num((a+b)*h/2)+' סמ"ר'),
      wrong:[
        W(num(a*b*h)+' סמ"ר',"הכפלתם את שני הבסיסים. בטרפז מחברים אותם, לא מכפילים."),
        W(num((a+b)*h)+' סמ"ר',"שכחתם לחלק ב-2."),
        W(num((a+b)/2)+' סמ"ר',"חישבתם רק את ממוצע הבסיסים בלי להכפיל בגובה.")
      ],
      steps:[S("נוסחת שטח טרפז","מחברים את שני הבסיסים, מכפילים בגובה ומחלקים ב-2.","S = (a + b) · h ÷ 2"),
             S("מציבים","","S = ("+a+" + "+b+") · "+h+" ÷ 2"),
             S("מחשבים","","S = "+(a+b)+" · "+h+" ÷ 2 = "+num((a+b)*h/2)+' סמ"ר')],
      rule:"trap",hint:"שטח טרפז = סכום הבסיסים כפול הגובה, חלקי 2."};
  }
  b=ri(4,15);h=ri(4,15);
  var area=b*h;
  return {ask:"שטח מלבן הוא "+area+' סמ"ר ואורכו '+b+' ס"מ. מהו רוחבו?',expr:"",fig:svgRect(b,"?"),
    ans:W(h+' ס"מ'),
    wrong:[
      W(num(area*b)+' ס"מ',"הכפלתם במקום לחלק. כדי לחזור אחורה מנוסחת השטח מחלקים."),
      W(num(area-b)+' ס"מ',"חיסרתם. השטח נוצר מכפל, אז הפעולה ההפוכה היא חילוק."),
      W(num(area/b/2)+' ס"מ',"חילקתם פעמיים.")
    ],
    steps:[S("כותבים את הנוסחה עם הנעלם","","S = a · b  →  "+area+" = "+b+" · b"),
           S("מחלקים","הפעולה ההפוכה לכפל היא חילוק.","b = "+area+" ÷ "+b),
           S("מחשבים","","b = "+h+' ס"מ')],
    rule:"rect",hint:"אם השטח והאורך ידועים — מחלקים את השטח באורך."};
}

/* ---------- 14. טריגונומטריה במשולש ישר זווית ---------- */
function genTrig(L){
  var t,a,b,c,steps,f;
  if(L===1){
    t=pick(TRIPLES);a=t[0];b=t[1];c=t[2];
    f=pick(["sin","cos","tan"]);
    var val=f==="sin"?fr(a,c):f==="cos"?fr(b,c):fr(a,b);
    var top=f==="sin"?"הניצב שמול הזווית":f==="cos"?"הניצב שליד הזווית":"הניצב שמול הזווית";
    var bot=f==="tan"?"הניצב שליד הזווית":"היתר";
    steps=[
      S("נזכרים בהגדרות","״מול״ היא הצלע שמעבר לזווית, ״ליד״ היא הצלע שנוגעת בה, והיתר הוא מול הזווית הישרה.",
        "sin = מול ÷ יתר   ·   cos = ליד ÷ יתר   ·   tan = מול ÷ ליד"),
      S("מזהים את הצלעות ביחס לזווית α","מול α נמצא הניצב "+a+", לידה הניצב "+b+", והיתר הוא "+c+".",
        "מול = "+a+"  ,  ליד = "+b+"  ,  יתר = "+c),
      S("מציבים בהגדרה","המונה הוא "+top+", המכנה הוא "+bot+".",
        f+" α = "+(f==="sin"?a+"/"+c:f==="cos"?b+"/"+c:a+"/"+b)),
      S("מצמצמים","",f+" α = "+val.html())
    ];
    return {ask:"במשולש שלפניכם, מהו "+f+" α?",expr:"",fig:svgRightTri(b,a,c,"α"),
      ans:W(val.html()),
      wrong:[
        W(fr(val.d,val.n).html(),"הפכתם את השבר. שימו לב מה במונה ומה במכנה בהגדרה."),
        W(f==="sin"?fr(b,c).html():f==="cos"?fr(a,c).html():fr(b,a).html(),"התבלבלתם בין הניצב שמול הזווית לניצב שלידה."),
        W(f==="tan"?fr(a,c).html():fr(a,b).html(),"השתמשתם בהגדרה של פונקציה טריגונומטרית אחרת.")
      ],steps:steps,rule:"trigdef",
      hint:"sin = מול/יתר, cos = ליד/יתר, tan = מול/ליד. תמיד ביחס לזווית שנשאלתם עליה."};
  }
  if(L===2){
    var ang=pick([30,60]);
    c=pick([4,6,8,10,12,14,16,20]);
    var want=ang===30?"הניצב שמול הזווית":"הניצב שליד הזווית";
    var res=c/2;
    steps=[
      S("בוחרים את הפונקציה המתאימה",
        ang===30?"מחפשים את הניצב שמול הזווית, והיתר ידוע — לכן sin.":"מחפשים את הניצב שליד הזווית, והיתר ידוע — לכן cos.",
        ang===30?"sin 30° = מול ÷ יתר":"cos 60° = ליד ÷ יתר"),
      S("מציבים את הערך המדויק","גם sin 30° וגם cos 60° שווים בדיוק לחצי.",
        (ang===30?"sin 30°":"cos 60°")+" = 1/2"),
      S("מבודדים את הצלע","","הצלע = "+c+" · 1/2"),
      S("מחשבים","","הצלע = "+num(res)+' ס"מ')
    ];
    return {ask:"במשולש ישר זווית היתר הוא "+c+' ס"מ ואחת הזוויות היא '+ang+"°. מהו אורך "+want+"?",
      expr:"",fig:ang===30?svgRightTri(null,"?",c+' ס"מ',ang+"°"):svgRightTri("?",null,c+' ס"מ',ang+"°"),
      ans:W(num(res)+' ס"מ'),
      wrong:[
        W(num(r2(c*Math.sqrt(3)/2))+' ס"מ',"השתמשתם ב-√3/2, שזה הערך של הפונקציה השנייה בזווית הזו."),
        W(num(c*2)+' ס"מ',"הכפלתם ביתר במקום לקחת ממנו חלק. ניצב תמיד קצר מהיתר."),
        W(num(ang)+' ס"מ',"זו מידת הזווית במעלות, לא אורך צלע.")
      ],steps:steps,rule:"trigval",
      hint:"sin 30° = cos 60° = 1/2. הצלע המבוקשת היא בדיוק חצי מהיתר."};
  }
  var ang3=pick([30,45,60]);
  var fn=pick(["sin","cos","tan"]);
  var TBL={ "sin30":"1/2","cos30":"√3/2","tan30":"1/√3","sin45":"√2/2","cos45":"√2/2","tan45":"1","sin60":"√3/2","cos60":"1/2","tan60":"√3" };
  var key=fn+ang3,val3=TBL[key];
  var others=[];
  for(var kk in TBL)if(TBL[kk]!==val3&&others.indexOf(TBL[kk])<0)others.push(TBL[kk]);
  shuffle(others);
  return {ask:"מהו הערך המדויק?",expr:fn+" "+ang3+"°",
    ans:W(val3),
    wrong:others.slice(0,3).map(function(v){return W(v,"זה הערך של פונקציה אחרת או של זווית אחרת בטבלת הזוויות המיוחדות.")}),
    steps:[
      S("משולש הזוויות המיוחדות","30°, 45° ו-60° הן זוויות שהערכים שלהן ידועים במדויק, בלי מחשבון.",
        "sin30 = 1/2 , cos30 = √3/2 , tan30 = 1/√3"),
      S("ממשיכים בטבלה","","sin45 = cos45 = √2/2 , tan45 = 1"),
      S("ולסיום","","sin60 = √3/2 , cos60 = 1/2 , tan60 = √3"),
      S("התשובה","",fn+" "+ang3+"° = "+val3)
    ],rule:"trigval",
    hint:"שווה לשנן טבלה קטנה: הזוויות 30, 45 ו-60 חוזרות כמעט בכל שאלה."};
}
/* ---------- 15. סטטיסטיקה ---------- */
function genStat(L){
  var arr=[],i,n,steps,sorted;
  if(L===1){
    n=pick([5,5,6,7]);
    for(i=0;i<n;i++)arr.push(ri(2,20));
    var sum=arr.reduce(function(a,b){return a+b},0);
    while(sum%n!==0){arr[0]=arr[0]+1;sum=arr.reduce(function(a,b){return a+b},0)}
    var avg=sum/n;
    steps=[
      S("ממוצע = סכום חלקי כמות","זו ההגדרה: מחלקים את הכול שווה בשווה בין כל האיברים.","ממוצע = סכום ÷ מספר האיברים"),
      S("מחברים את כל המספרים","",arr.join(" + ")+" = "+sum),
      S("מחלקים בכמות","",sum+" ÷ "+n+" = "+avg)
    ];
    return {ask:"מהו הממוצע של המספרים?",expr:arr.join(" , "),ans:W(String(avg)),
      wrong:[
        W(String(sum),"זה הסכום. נשאר לחלק במספר האיברים."),
        W(String(Math.round(sum/(n-1)*100)/100),"חילקתם במספר איברים שגוי — יש כאן "+n+" מספרים."),
        W(String(Math.max.apply(null,arr)),"זה המספר הגדול ביותר, לא הממוצע.")
      ],steps:steps,rule:"mean",hint:"ממוצע = סכום כל המספרים חלקי כמה מספרים יש."};
  }
  if(L===2){
    n=pick([5,7,6,8]);
    for(i=0;i<n;i++)arr.push(ri(1,30));
    sorted=arr.slice().sort(function(a,b){return a-b});
    var med=n%2?sorted[(n-1)/2]:(sorted[n/2-1]+sorted[n/2])/2;
    steps=[
      S("קודם כול — מסדרים","חציון בלי סידור הוא טעות כמעט ודאית. מסדרים מהקטן לגדול.",sorted.join(" , ")),
      S(n%2?"סופרים לאמצע":"יש מספר זוגי של איברים",
        n%2?"יש "+n+" מספרים, אז החציון הוא זה שבמקום ה-"+((n+1)/2)+".":"אין איבר יחיד באמצע, אז לוקחים ממוצע של שני האמצעיים.",
        n%2?"החציון: "+med:"("+sorted[n/2-1]+" + "+sorted[n/2]+") ÷ 2 = "+med),
      S("התשובה","","חציון = "+med)
    ];
    return {ask:"מהו החציון?",expr:arr.join(" , "),ans:W(String(med)),
      wrong:[
        W(String(arr[Math.floor(n/2)]),"לקחתם את האיבר האמצעי לפי הסדר שבו הם נכתבו. חייבים קודם לסדר."),
        W(String(Math.round(arr.reduce(function(a,b){return a+b},0)/n*100)/100),"זה הממוצע, לא החציון."),
        W(String(sorted[n-1]-sorted[0]),"זה הטווח — ההפרש בין הגדול לקטן.")
      ],steps:steps,rule:"median",hint:"חציון = האיבר האמצעי אחרי סידור. במספר זוגי של איברים — ממוצע שני האמצעיים."};
  }
  n=pick([4,5,6]);
  var known=[],missing=ri(3,20);
  for(i=0;i<n-1;i++)known.push(ri(2,20));
  /* מזיזים איבר אחד עד שהממוצע יוצא שלם — כך המספר החסר נשאר בטווח סביר */
  var tot=known.reduce(function(a,b){return a+b},0)+missing;
  known[0]+=(n-tot%n)%n;
  tot=known.reduce(function(a,b){return a+b},0)+missing;
  var target=tot/n;
  steps=[
    S("מתרגמים ממוצע למשוואה","אם הממוצע הוא "+target+" ויש "+n+" מספרים, הסכום חייב להיות "+target+" · "+n+".",
      "סכום = "+target+" · "+n+" = "+(target*n)),
    S("מחשבים את הסכום הידוע","",known.map(num).join(" + ")+" = "+known.reduce(function(a,b){return a+b},0)),
    S("מחסרים","",(target*n)+" − "+known.reduce(function(a,b){return a+b},0)+" = "+missing)
  ];
  return {ask:"ל-"+n+" מספרים יש ממוצע "+num(target)+". "+(n-1)+" מהם הם "+known.map(num).join(", ")+". מהו המספר החסר?",
    expr:"",ans:W(String(missing)),
    wrong:[
      W(String(target),"הנחתם שהמספר החסר שווה לממוצע. זה נכון רק אם כל המספרים שווים."),
      W(String(target*n),"זה הסכום של כל המספרים, לא המספר החסר."),
      W(String(Math.abs(known.reduce(function(a,b){return a+b},0)-target)),"חיסרתם את הממוצע מהסכום הידוע במקום להשתמש בסכום הכולל.")
    ],steps:steps,rule:"mean",
    hint:"ממוצע כפול כמות = הסכום הכולל. משם מחסרים את מה שכבר ידוע."};
}

/* ---------- 16. הסתברות ---------- */
function genProb(L){
  var r,g,b2,tot,steps,p;
  if(L===1){
    r=ri(2,9);g=ri(2,9);b2=ri(2,9);tot=r+g+b2;
    p=fr(r,tot);
    steps=[
      S("סופרים את כל האפשרויות","","סה\"כ כדורים: "+r+" + "+g+" + "+b2+" = "+tot),
      S("סופרים את המקרים המבוקשים","",	"כדורים אדומים: "+r),
      S("הסתברות = מבוקש חלקי הכול","",p.html())
    ];
    return {ask:"בשקית "+r+" כדורים אדומים, "+g+" ירוקים ו-"+b2+" כחולים. מוציאים כדור אחד באקראי. מה ההסתברות שהוא אדום?",
      expr:"",ans:W(p.html()),
      wrong:[
        W(fr(r,g+b2).html(),"חילקתם במספר הכדורים שאינם אדומים. המכנה הוא תמיד סך כל האפשרויות."),
        W(fr(tot,r).html(),"הפכתם את השבר. המבוקש נמצא במונה."),
        W(fr(r,3).html(),"חילקתם במספר הצבעים ולא במספר הכדורים.")
      ],steps:steps,rule:"prob",hint:"הסתברות = כמה מקרים מתאימים, חלקי כמה מקרים אפשריים בסך הכול."};
  }
  if(L===2){
    r=ri(2,8);tot=r+ri(3,10);
    while(tot-r===r)tot++;                   /* בדיוק חצי הופך את המשלים לזהה למקור */
    p=fr(tot-r,tot);
    steps=[
      S("ההסתברות למאורע המקורי","",fr(r,tot).html()),
      S("משלים ל-1","סכום ההסתברויות של מאורע ושל ההפך שלו הוא תמיד 1.","P(לא) = 1 − P(כן)"),
      S("מחשבים","","1 − "+fr(r,tot).html()+" = "+p.html())
    ];
    return {ask:"בקופסה "+tot+" גרביים, מתוכם "+r+" שחורים. מה ההסתברות להוציא גרב שאינו שחור?",
      expr:"",ans:W(p.html()),
      wrong:[
        W(fr(r,tot).html(),"זו ההסתברות דווקא כן להוציא שחור. השאלה מבקשת את המשלים."),
        W(fr(tot,tot-r).html(),"הפכתם את השבר."),
        W(fr(tot-r,r).html(),"חילקתם במספר השחורים במקום בסך הכול.")
      ],steps:steps,rule:"probc",hint:"הסתברות למאורע משלים = 1 פחות ההסתברות למאורע עצמו."};
  }
  var n1=pick([2,3,4,5,6]),n2=pick([2,3,4,5,6]);
  p=fr(1,n1*n2);
  steps=[
    S("שני ניסויים בלתי תלויים","התוצאה של הראשון לא משפיעה על השני, ולכן מכפילים הסתברויות.","P(שניהם) = P₁ · P₂"),
    S("מציבים","",fr(1,n1).html()+" · "+fr(1,n2).html()),
    S("מכפילים","",p.html())
  ];
  return {ask:"מטילים קובייה בעלת "+n1+" פאות ואחריה קובייה בעלת "+n2+" פאות. מה ההסתברות לקבל 1 בשתיהן?",
    expr:"",ans:W(p.html()),
    wrong:[
      W(fr(2,n1+n2).html(),"חיברתם הסתברויות. חיבור מתאים ל״או״, כפל מתאים ל״וגם״."),
      W(fr(1,n1+n2).html(),"חיברתם את מספרי הפאות במקום להכפיל אותם."),
      W(fr(1,Math.max(n1,n2)).html(),"התייחסתם רק לקובייה אחת.")
    ],steps:steps,rule:"probm",hint:"״וגם״ בשני ניסויים בלתי תלויים — מכפילים את ההסתברויות."};
}

/* ---------- 17. סדרה חשבונית ---------- */
function genSeq(L){
  var a1,d,n,steps,an;
  a1=rnz(-12,15);d=rnz(-7,8);
  if(L===1){
    n=ri(5,20);an=a1+(n-1)*d;
    steps=[
      S("נוסחת האיבר הכללי","aₙ = a₁ + (n − 1)·d. שימו לב ל-n מינוס 1 — כי מהאיבר הראשון עושים n−1 צעדים.",
        "aₙ = a₁ + (n − 1)d"),
      S("מציבים","","a"+n+" = "+num(a1)+" + ("+n+" − 1)·"+pn(d)),
      S("מחשבים","","a"+n+" = "+num(a1)+" + "+(n-1)+"·"+pn(d)+" = "+num(an))
    ];
    return {ask:"בסדרה חשבונית האיבר הראשון הוא "+num(a1)+" וההפרש הוא "+num(d)+". מהו האיבר ה-"+n+"?",
      expr:"",ans:W(num(an)),
      wrong:[
        W(num(a1+n*d),"הכפלתם ב-n במקום ב-n מינוס 1. מהאיבר הראשון לאיבר ה-"+n+" יש "+(n-1)+" צעדים."),
        W(num(a1+(n-1)*d*-1),"טעות סימן בהפרש."),
        W(num(a1*n+d),"הכפלתם את האיבר הראשון ב-n.")
      ],steps:steps,rule:"seq",hint:"aₙ = a₁ + (n−1)·d. הכי חשוב: n מינוס אחד, לא n."};
  }
  if(L===2){
    n=ri(6,14);an=a1+(n-1)*d;
    steps=[
      S("שני איברים ידועים","","a₁ = "+num(a1)+"   ,   a"+n+" = "+num(an)),
      S("מציבים בנוסחה","","a"+n+" = a₁ + ("+n+" − 1)d"),
      S("מבודדים את d","",num(an)+" − "+pn(a1)+" = "+(n-1)+"d  →  "+num(an-a1)+" = "+(n-1)+"d"),
      S("מחלקים","","d = "+num(an-a1)+" ÷ "+(n-1)+" = "+num(d))
    ];
    return {ask:"בסדרה חשבונית a₁ = "+num(a1)+" והאיבר ה-"+n+" הוא "+num(an)+". מהו ההפרש d?",
      expr:"",ans:W("d = "+num(d)),
      wrong:[
        W("d = "+num(r2((an-a1)/n)),"חילקתם ב-n. מספר הצעדים בין האיבר הראשון לאיבר ה-"+n+" הוא "+(n-1)+"."),
        W("d = "+num(an-a1),"זה ההפרש הכולל לאורך כל הסדרה, לא ההפרש בין שני איברים עוקבים."),
        W("d = "+num(-d),"טעות סימן בחיסור. מחסרים את הראשון מהאחרון.")
      ],steps:steps,rule:"seq",hint:"מציבים את שני האיברים בנוסחה ומבודדים את d. שימו לב שמחלקים ב-n מינוס 1."};
  }
  n=ri(5,15);an=a1+(n-1)*d;
  var sum=n*(a1+an)/2;
  if(Math.round(sum)!==sum){d=2;an=a1+(n-1)*d;sum=n*(a1+an)/2}
  steps=[
    S("נוסחת הסכום","Sₙ = n · (a₁ + aₙ) ÷ 2 — כלומר מספר האיברים כפול ממוצע הראשון והאחרון.","Sₙ = n(a₁ + aₙ) ÷ 2"),
    S("מחשבים את האיבר האחרון","","a"+n+" = "+num(a1)+" + "+(n-1)+"·"+pn(d)+" = "+num(an)),
    S("מציבים בנוסחת הסכום","","S = "+n+"·("+num(a1)+" + "+pn(an)+") ÷ 2"),
    S("מחשבים","","S = "+n+"·"+pn(a1+an)+" ÷ 2 = "+num(sum))
  ];
  return {ask:"בסדרה חשבונית a₁ = "+num(a1)+" ו-d = "+num(d)+". מהו סכום "+n+" האיברים הראשונים?",
    expr:"",ans:W(num(sum)),
    wrong:[
      W(num(an),"זה האיבר ה-"+n+" עצמו, לא הסכום של כולם."),
      W(num(n*(a1+an)),"שכחתם לחלק ב-2."),
      W(num(n*a1),"הכפלתם את האיבר הראשון במספר האיברים, כאילו כל האיברים שווים.")
    ],steps:steps,rule:"seqsum",
    hint:"סכום סדרה חשבונית = מספר האיברים כפול הממוצע של הראשון והאחרון."};
}

/* ---------- 18. בעיות מילוליות ---------- */
function genWord(L){
  var v1,v2,t,d,steps,x;
  if(L===1){
    v1=pick([40,50,60,70,80,90,100]);t=pick([2,3,4,5]);d=v1*t;
    return {ask:"רכב נוסע במהירות קבועה של "+v1+' קמ"ש במשך '+t+" שעות. איזה מרחק הוא עבר?",
      expr:"",ans:W(d+' ק"מ'),
      wrong:[
        W(num(r2(v1/t))+' ק"מ',"חילקתם. מרחק = מהירות כפול זמן."),
        W(num(v1+t)+' ק"מ',"חיברתם מהירות עם זמן. אלה גדלים שונים — הם לא מתחברים."),
        W(num(r2(t/v1))+' ק"מ',"חילקתם בכיוון ההפוך.")
      ],
      steps:[S("הנוסחה המשולשת","מרחק = מהירות · זמן. מכאן גם: מהירות = מרחק ÷ זמן, וזמן = מרחק ÷ מהירות.","D = v · t"),
             S("מציבים","","D = "+v1+" · "+t),
             S("מחשבים","","D = "+d+' ק"מ')],
      rule:"motion",hint:"מרחק = מהירות כפול זמן. שווה לזכור את המשולש: D למעלה, v ו-t למטה."};
  }
  if(L===2){
    /* בעיית גיל — קלאסיקה של תרגום משפט למשוואה */
    var kid=ri(6,14),mult=pick([2,3,4]);
    var parent=kid*mult;
    steps=[
      S("מגדירים נעלם","מסמנים באות אחת בדיוק את מה שמחפשים.","x = גיל הילד היום"),
      S("כותבים את המשפט כביטוי","״מבוגר פי "+mult+"״ פירושו שגיל ההורה הוא "+mult+" כפול גיל הילד.",
        "גיל ההורה = "+mult+"x"),
      S("בונים משוואה","ידוע שגיל ההורה הוא "+parent+".",mult+"x = "+parent),
      S("מחלקים במקדם","","x = "+parent+" ÷ "+mult+" = "+kid)
    ];
    return {ask:"הורה מבוגר מילדו פי "+mult+". היום ההורה בן "+parent+". בן כמה הילד?",
      expr:"",ans:W(kid+" שנים"),
      wrong:[
        W((parent-mult)+" שנים","חיסרתם את המספר "+mult+" מגיל ההורה. ״פי "+mult+"״ פירושו חילוק, לא חיסור."),
        W((parent*mult)+" שנים","הכפלתם במקום לחלק. הילד צעיר יותר."),
        W((parent-kid)+" שנים","זה הפרש הגילים, לא גיל הילד.")
      ],steps:steps,rule:"word",
      hint:"מסמנים באות אחת את מה שמחפשים, וכותבים כל משפט בשאלה כביטוי עם אותה אות."};
  }
  /* רמה 3: שתי מהירויות — פגישה */
  v1=pick([40,50,60,70]);v2=pick([30,60,80,90]);
  if(v1===v2)v2=v1+20;
  t=pick([2,3,4]);
  d=(v1+v2)*t;
  steps=[
    S("מציירים את המצב","שני רכבים נוסעים זה לקראת זה. בכל שעה המרחק ביניהם מצטמצם בסכום המהירויות.",
      "מהירות התקרבות = "+v1+" + "+v2+" = "+(v1+v2)+' קמ"ש'),
    S("כותבים את המשוואה","","("+v1+" + "+v2+") · t = "+d),
    S("מחלקים","","t = "+d+" ÷ "+(v1+v2)+" = "+t+" שעות")
  ];
  return {ask:"שתי מכוניות יוצאות זו לקראת זו ממרחק "+d+' ק"מ, במהירויות '+v1+" ו-"+v2+' קמ"ש. אחרי כמה שעות ייפגשו?',
    expr:"",ans:W(t+" שעות"),
    wrong:[
      W(num(r2(d/v1))+" שעות","התייחסתם רק לרכב אחד. כששניהם נוסעים זה לקראת זה — המהירויות מתחברות."),
      W(num(r2(d/Math.abs(v1-v2)))+" שעות","חיסרתם מהירויות. חיסור מתאים למרדף באותו כיוון, לא לנסיעה זה לקראת זה."),
      W(num(r2(d/(v1+v2)/2))+" שעות","חילקתם ב-2 מיותר — לא צריך לחצות את המרחק.")
    ],steps:steps,rule:"motion",
    hint:"כששניים נוסעים זה לקראת זה, המהירויות מתחברות ואז מחלקים את המרחק בסכום."};
}

/* ============================================================
   12. בניית שאלה
   מנרמל את מה שהמחולל החזיר: מסנן מסיחים כפולים או פגומים,
   מערבב, ומכין גם טקסט להקראה.
   ============================================================ */
function badStr(s){return !s||/NaN|Infinity|undefined|null/.test(s)}

function buildQ(topicId,level){
  var t=topicById(topicId);
  if(!t)t=TOPICS[0];
  var raw=null,tries=0,opts,i,p,seen,ansP;
  while(tries<8){
    tries++;
    try{raw=t.gen(level)}catch(e){raw=null}
    if(!raw||!raw.ans||badStr(plainOf(raw.ans.h)))continue;
    ansP=plainOf(raw.ans.h);
    seen={};seen[ansP]=1;
    opts=[{h:raw.ans.h,t:ansP,ok:true,why:""}];
    for(i=0;i<(raw.wrong||[]).length;i++){
      p=plainOf(raw.wrong[i].h);
      if(badStr(p)||seen[p])continue;
      seen[p]=1;
      opts.push({h:raw.wrong[i].h,t:p,ok:false,why:raw.wrong[i].why||""});
    }
    if(opts.length>=3)break;
  }
  if(!raw)raw={ask:"חשבו",expr:"1 + 1",ans:W("2"),wrong:[W("1"),W("3"),W("11")],steps:[S("חיבור","","1 + 1 = 2")],hint:"",rule:"order"};
  if(!opts||opts.length<2){
    ansP=plainOf(raw.ans.h);
    opts=[{h:raw.ans.h,t:ansP,ok:true,why:""}];
  }
  shuffle(opts);
  var sayTxt=raw.ask+(raw.expr?". "+speakMath(plainOf(raw.expr)):"");
  return {
    topic:t.id,topicName:t.name,level:level,
    ask:raw.ask,expr:raw.expr||"",fig:raw.fig||"",
    options:opts,steps:raw.steps||[],hint:raw.hint||"",rule:raw.rule||"",
    say:sayTxt
  };
}

var P={list:[],i:0,q:null,phase:"ask",picked:[],hints:0,steps:0,usedHelp:false,results:[],startedAt:0};

function mastery(id){
  var m=state.mastery[id];
  if(!m){m={seen:0,ok:0,help:0,m:0};state.mastery[id]=m}
  return m;
}
function activeTopics(){
  var chosen=state.topics.filter(function(id){return !!topicById(id)});
  if(chosen.length)return chosen;
  return topicsForTrack(state.track).map(function(t){return t.id});
}
/* בחירת הנושא הבא: מי שחלש יותר מקבל יותר תורות, ומדי כמה
   שאלות חוזר נושא שנפלו בו קודם. ככה החזרה קורית לבד. */
function nextTopic(idx){
  var pool=activeTopics();
  if(idx>0&&idx%3===2&&state.wrongBank.length){
    var w=state.wrongBank[state.wrongBank.length-1-Math.floor(Math.random()*Math.min(5,state.wrongBank.length))];
    if(w&&pool.indexOf(w.topic)>=0)return w.topic;
  }
  var weights=pool.map(function(id){return 110-mastery(id).m}),total=0,i;
  for(i=0;i<weights.length;i++)total+=weights[i];
  var r=Math.random()*total;
  for(i=0;i<pool.length;i++){r-=weights[i];if(r<=0)return pool[i]}
  return pool[pool.length-1];
}
function startRound(forceTopic){
  var n=state.settings.roundLen,i;
  P.list=[];
  for(i=0;i<n;i++)P.list.push(forceTopic||nextTopic(i));
  P.i=0;P.results=[];P.startedAt=Date.now();
  loadQ();
}
function loadQ(){
  P.q=buildQ(P.list[P.i],state.level);
  P.phase="ask";P.picked=[];P.hints=0;P.steps=0;P.usedHelp=false;
  if(state.settings.autoSteps)P.steps=1;
}
function roundDone(){return P.i>=P.list.length}

/* השליטה בנושא נמדדת כממוצע נע של הביצועים האחרונים, ולא
   כמונה שמטפס לאט. תלמיד שענה נכון צריך לראות מספר שמשקף
   את זה מיד — אחרת המדד מתסכל במקום לעזור. */
function scoreAnswer(ok){
  var m=mastery(P.q.topic),d=dayRec(),score;
  m.seen++;d.a++;state.stats.answered++;
  touchDay();
  if(ok&&!P.usedHelp&&P.picked.length===1){
    m.ok++;d.c++;state.stats.correct++;state.stats.xp+=10;
    score=1;P.results.push("ok");
  }else if(ok&&!P.usedHelp){
    m.ok++;d.c++;state.stats.correct++;state.stats.xp+=4;
    score=0.7;P.results.push("ok");
  }else if(P.usedHelp){
    m.help++;state.stats.helped++;state.stats.xp+=2;
    score=0.35;P.results.push("hp");
  }else{
    score=0;P.results.push("no");
  }
  m.m=m.seen===1?Math.round(score*100):Math.round(m.m*0.6+score*40);
  if(!ok||P.usedHelp){
    state.wrongBank.push({topic:P.q.topic,ts:Date.now()});
    if(state.wrongBank.length>40)state.wrongBank.shift();
  }
  save();
}

     '<div class="grid g3" style="margin-top:12px">'+
     byNeed.map(function(id){
       var tp=topicById(id);
       return '<button class="tpc '+areaCls(tp.area)+'" data-a="starttopic" data-t="'+id+'">'+
         '<span class="tn">'+tp.name+'</span><span class="td">'+tp.desc+'</span>'+masteryBar(id)+'</button>';
     }).join("")+'</div>';
  h+='<div class="row" style="margin-top:20px"><button class="btn btn-g" data-a="go" data-v="topics">'+ic("list",17)+' כל '+pool.length+' הנושאים</button>'+
     '<button class="btn btn-g" data-a="go" data-v="formulas">'+ic("book",17)+' דף נוסחאות</button></div>';
  return h+'</main>';
}
/* ---------- תרגול ---------- */
/* מצב הקול חייב להיות במסך התרגול עצמו. הודעה שמסבירה למה
   הקול לא מה שביקשת חסרת ערך אם היא מוסתרת בהגדרות. */
function voiceStrip(){
  var s=state.settings;
  if(!s.tts)return "";
  if(s.engine==="gemini"&&hasKey()&&ttsState!=="err"){
    if(ttsState!=="ok")return "";      /* עוד לא הושמע דבר — אין מה להודיע */
    return '<div class="vstrip ok">'+ic("speaker",15)+'<span>קול טבעי · '+gvName(s.gvoice).t+'</span>'+
      '<button class="btn btn-g" data-a="go" data-v="settings">להחליף</button></div>';
  }
  if(ttsState==="err")
    return '<div class="vstrip bad">'+ic("speaker",15)+'<span>הקול הטבעי לא הגיב, ההקראה עברה לקול המכשיר</span>'+
      '<button class="btn btn-g" data-a="go" data-v="settings">לבדוק</button></div>';
  return '<div class="vstrip warn">'+ic("speaker",15)+'<span>ההקראה בקול המכשיר. יש קול טבעי שנשמע כמו אדם</span>'+
    '<button class="btn btn-g" data-a="go" data-v="settings">להפעיל</button></div>';
}
function viewPractice(){
  if(!P.q)startRound();
  if(P.phase==="done")return viewSummary();
  var q=P.q,calm=state.settings.calm;
  var h='<main id="main" class="wrap" style="padding-top:18px;padding-bottom:44px">';
  /* שורת מצב */
  h+='<div class="spread">'+
      '<div class="row"><span class="chip area '+topicCls(q.topic)+'">'+q.topicName+'</span>'+
      '<span class="chip">שאלה '+(P.i+1)+' מתוך '+P.list.length+'</span></div>'+
      '<div class="row"><span class="dots">'+
        P.list.map(function(_,i){
          var c=i<P.results.length?(P.results[i]==="ok"?"ok":P.results[i]==="hp"?"hp":"no"):"";
          return '<span class="dot '+c+'"></span>';
        }).join("")+'</span>'+
      '<button class="btn btn-g" style="padding:8px 12px;font-size:.85rem" data-a="stop">'+ic("pause",15)+' עצירה</button></div>'+
     '</div>';
  h+=voiceStrip();
  h+='<div class="grid" style="grid-template-columns:minmax(0,1fr);margin-top:14px">';
  /* כרטיס השאלה */
  h+='<div class="card pad rise '+topicCls(q.topic)+'" style="border-top:3px solid var(--c)">';
  h+='<p style="font-size:clamp(1rem,3.6vw,1.15rem);font-weight:600">'+q.ask+'</p>';
  if(q.expr)h+='<p class="mline" style="margin-top:14px">'+q.expr+'</p>';
  if(q.fig)h+=q.fig;
  /* כפתורי עזר */
  h+='<div class="row" style="margin-top:16px;gap:8px">'+
     (state.settings.tts?'<button class="btn btn-g" style="padding:9px 13px;font-size:.88rem" data-a="read">'+ic("speaker",16)+' הקראה</button>':"")+
     '<button class="btn btn-g" style="padding:9px 13px;font-size:.88rem" data-a="hint"'+(P.hints>0?" disabled":"")+'>'+ic("bulb",16)+' רמז</button>'+
     '<button class="btn btn-g" style="padding:9px 13px;font-size:.88rem" data-a="guide"'+(P.steps>0?" disabled":"")+'>'+ic("steps",16)+' פתרון מודרך</button>'+
     (q.rule?'<button class="btn btn-g" style="padding:9px 13px;font-size:.88rem" data-a="rule" data-r="'+q.rule+'">'+ic("book",16)+' הנוסחה</button>':"")+
     '</div>';
  if(P.hints>0&&q.hint)h+='<div class="hintbox rise"><b>רמז</b><div class="sm hintxt" style="margin-top:3px">'+q.hint+'</div></div>';
  /* תשובות */
  var keys=["1","2","3","4"];
  h+='<div class="opts">'+q.options.map(function(o,i){
    var cls="opt",dis="";
    var wasPicked=P.picked.indexOf(i)>=0;
    if(P.phase==="reveal"){
      dis=" disabled";
      if(o.ok)cls+=" right";
      else if(wasPicked)cls+=calm?" gone":" wrong";
      else cls+=" dim";
    }else if(wasPicked){cls+=calm?" gone":" wrong";dis=" disabled"}
    return '<button class="'+cls+'"'+dis+' data-a="ans" data-i="'+i+'">'+
      '<span class="k">'+keys[i]+'</span><span class="m">'+o.h+'</span></button>';
  }).join("")+'</div>';
  /* אבחון הטעות האחרונה */
  if(P.lastWhy&&P.phase!=="reveal"){
    h+='<div class="diag rise"><b>מה קרה כאן</b><div class="sm" style="margin-top:3px">'+P.lastWhy+'</div></div>';
  }
  h+='</div>';
  /* פתרון מודרך */
  if(P.steps>0||P.phase==="reveal"){
    var showAll=P.phase==="reveal";
    var shown=showAll?q.steps.length:Math.min(P.steps,q.steps.length);
    h+='<div class="card pad rise '+topicCls(q.topic)+'"><div class="spread"><div class="h2" style="color:var(--c)">'+ic("steps",18)+' הפתרון, צעד אחר צעד</div>'+
       (state.settings.tts?'<button class="btn btn-g" style="padding:8px 12px;font-size:.85rem" data-a="readsteps">'+ic("speaker",15)+' הקראה</button>':"")+'</div>';
    h+='<div class="steps">'+q.steps.map(function(s,i){
      if(i>=shown)return "";
      return '<div class="step'+(i===q.steps.length-1?" last":"")+'"><div class="st"><span class="num">'+(i+1)+'</span>'+s.t+'</div>'+
        (s.d?'<div class="sd">'+s.d+'</div>':"")+
        (s.m?'<div class="mstep">'+s.m+'</div>':"")+'</div>';
    }).join("")+'</div>';
    if(!showAll&&shown<q.steps.length){
      h+='<button class="btn btn-p w" style="margin-top:12px" data-a="nextstep">הצעד הבא '+ic("arrow",17)+'</button>';
      h+='<p class="sub xs" style="text-align:center;margin-top:8px">אפשר לעצור בכל שלב ולנסות להמשיך לבד.</p>';
    }
    h+='</div>';
  }
  /* פס תחתון אחרי מענה */
  if(P.phase==="reveal"){
    var kind=P.results[P.results.length-1];
    h+='<div class="card pad rise" style="border-inline-start:4px solid var(--'+(kind==="ok"?"ok":kind==="hp"?"accent":"bad")+')">'+
       '<div class="row">'+ic(kind==="ok"?"check":"bulb",19)+'<b>'+lineFor(kind)+'</b></div>'+
       '<button class="btn btn-p w" style="margin-top:12px;padding:14px" data-a="next">'+
         (P.i+1>=P.list.length?"לסיכום הסבב":"לשאלה הבאה")+' '+ic("arrow",18)+'</button>'+
       (state.settings.keys?'<p class="sub xs" style="text-align:center;margin-top:8px">אפשר גם ללחוץ Enter</p>':"")+
       '</div>';
  }
  h+='</div>';
  if(state.settings.keys&&P.phase==="ask")
    h+='<p class="sub xs" style="margin-top:14px;text-align:center">מקלדת: 1–4 תשובה · רווח הקראה · H רמז · S פתרון</p>';
  return h+'</main>';
}

/* ---------- סיכום סבב ---------- */
function viewSummary(){
  var ok=P.results.filter(function(r){return r==="ok"}).length;
  var hp=P.results.filter(function(r){return r==="hp"}).length;
  var no=P.results.length-ok-hp;
  var pct=Math.round(ok/Math.max(1,P.results.length)*100);
  var byTopic={},i;
  for(i=0;i<P.list.length&&i<P.results.length;i++){
    var id=P.list[i];
    if(!byTopic[id])byTopic[id]={ok:0,n:0};
    byTopic[id].n++;if(P.results[i]==="ok")byTopic[id].ok++;
  }
  var worst=null;
  for(var k in byTopic)if(byTopic[k].n>=2&&(!worst||byTopic[k].ok/byTopic[k].n<byTopic[worst].ok/byTopic[worst].n))worst=k;
  var title=pct>=85?"סבב חזק.":pct>=60?"סבב טוב.":pct>=35?"סבב עם עבודה.":"סבב קשה — וזה בסדר.";
  var sub=pct>=85?"אתם שולטים ברוב מה שתרגלתם כאן."
       :pct>=60?"רוב הדברים במקום. יש נקודה אחת או שתיים שכדאי לחדד."
       :pct>=35?"חלק מהחומר עוד לא יושב. זה בדיוק מה שמדידה כזאת נועדה להראות."
       :"סבב כזה לא אומר עליכם כלום חוץ מזה שהחומר הזה חדש. שווה לרדת רמה ולבנות מלמטה.";
  var h='<main id="main" class="wrap" style="padding-top:26px;padding-bottom:44px;max-width:760px">';
  h+='<div class="card pad rise"><h1 class="h1">'+title+'</h1><p class="sub">'+sub+'</p>'+
     '<div class="grid g4" style="margin-top:18px">'+
       '<div class="tile" style="--c:var(--ok)"><b>'+ok+'</b><span>נכון לבד</span></div>'+
       '<div class="tile" style="--c:var(--c-alg)"><b>'+hp+'</b><span>עם פתרון מודרך</span></div>'+
       '<div class="tile" style="--c:var(--bad)"><b>'+no+'</b><span>לא נפתרו</span></div>'+
       '<div class="tile" style="--c:var(--c-geo)"><b>'+pct+'%</b><span>דיוק</span></div>'+
     '</div>';
  h+='<hr class="sep"><div class="h2">לפי נושא</div><div class="grid" style="margin-top:10px">'+
     Object.keys(byTopic).map(function(id){
       var b=byTopic[id],tp=topicById(id);
       return '<div class="spread '+topicCls(id)+'" style="gap:8px"><span class="arh">'+tp.name+'</span>'+
         '<span class="chip '+(b.ok===b.n?"ok":b.ok===0?"bad":"warn")+'">'+b.ok+' מתוך '+b.n+'</span></div>';
     }).join("")+'</div>';
  if(worst&&byTopic[worst].ok<byTopic[worst].n){
    var wt=topicById(worst);
    h+='<div class="card pad" style="margin-top:16px;background:var(--surface2)">'+
       '<div class="row">'+ic("target",17)+'<b>מה לקחת מכאן</b></div>'+
       '<p class="sub sm">'+wt.name+' היה הנושא שהכי הפריע בסבב הזה. סבב ממוקד אחד בו יעשה יותר מעוד עשר שאלות מעורבות.</p>'+
       '<button class="btn btn-p" style="margin-top:10px" data-a="starttopic" data-t="'+worst+'">'+ic("pencil",16)+' סבב ממוקד ב'+wt.name+'</button></div>';
  }
  h+='<div class="row" style="margin-top:18px">'+
     '<button class="btn btn-p" data-a="start">'+ic("refresh",17)+' סבב נוסף</button>'+
     '<button class="btn btn-g" data-a="go" data-v="home">'+ic("home",17)+' לדף הבית</button>'+
     '<button class="btn btn-g" data-a="go" data-v="progress">'+ic("chart",17)+' להתקדמות</button></div>';
  return h+'</div></main>';
}

var fq="";
function viewFormulas(){

  var h='<main id="main" class="wrap" style="padding-top:22px;padding-bottom:44px">';

     '<input class="field" style="flex:1;min-width:min(100%,220px)" placeholder="חיפוש נוסחה — למשל: שיפוע, פיתגורס, אחוז" value="'+esc(fq)+'" data-bind="fq" />'+

  AREAS.forEach(function(g){

    h+='<h2 class="h2 arh '+areaCls(g)+'" style="margin-top:24px">'+g+'</h2><div class="grid g3" style="margin-top:10px">'+

      }).join("")+'</div>';
  });
  return h+'</main>';
}

/* ---------- התקדמות ---------- */
function viewProgress(){
  var st=state.stats;
  var acc=st.answered?Math.round(st.correct/st.answered*100):0;
  var days=[],i,d=new Date();
  for(i=13;i>=0;i--){
    var dd=new Date(d.getTime()-i*86400000);
    var key=dd.getFullYear()+"-"+String(dd.getMonth()+1).padStart(2,"0")+"-"+String(dd.getDate()).padStart(2,"0");
    days.push({k:key,r:state.days[key]||{a:0,c:0},lbl:"אבגדהוש".charAt(dd.getDay())});
  }
  var maxA=Math.max.apply(null,days.map(function(x){return x.r.a}).concat([1]));
  var seen=TOPICS.filter(function(t){return mastery(t.id).seen>0});
  var h='<main id="main" class="wrap" style="padding-top:22px;padding-bottom:44px">';
  h+='<h1 class="h1">התקדמות</h1><p class="sub">המספרים כאן הם כלי עבודה, לא ציון.</p>';
  h+='<div class="grid g4" style="margin-top:16px">'+
     '<div class="tile" style="--c:var(--c-base)"><b>'+st.answered+'</b><span>שאלות שנפתרו</span></div>'+
     '<div class="tile" style="--c:var(--ok)"><b>'+acc+'%</b><span>דיוק כולל</span></div>'+
     '<div class="tile" style="--c:var(--c-alg)"><b>'+st.helped+'</b><span>עם פתרון מודרך</span></div>'+
     '<div class="tile" style="--c:var(--c-geo)"><b>'+st.xp+'</b><span>נקודות</span></div></div>';
  h+='<div class="card pad" style="margin-top:16px"><div class="h2">שבועיים אחרונים</div>'+
     '<div style="display:flex;gap:5px;align-items:flex-end;height:120px;margin-top:14px;direction:ltr">'+
     days.map(function(x){
       var hh=Math.round(x.r.a/maxA*88);
       return '<div style="flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%">'+
         '<i style="display:block;width:100%;border-radius:5px 5px 0 0;background:'+(x.r.a?"linear-gradient(180deg,var(--c-alg),var(--c-data))":"var(--surface2)")+';height:'+Math.max(hh,4)+'px" title="'+x.r.a+' שאלות"></i>'+
         '<span class="xs faint">'+x.lbl+'</span></div>';
     }).join("")+'</div></div>';
  h+='<div class="card pad" style="margin-top:16px"><div class="h2">שליטה לפי נושא</div>';
  if(!seen.length)h+='<p class="sub sm">עוד לא תרגלתם נושאים. אחרי הסבב הראשון תופיע כאן תמונה.</p>';
  else h+='<div class="grid" style="margin-top:12px;gap:11px">'+seen.sort(function(a,b){return mastery(a.id).m-mastery(b.id).m}).map(function(tp){
    var m=mastery(tp.id);
    return '<div class="'+areaCls(tp.area)+'"><div class="spread" style="gap:8px"><span class="arh" style="font-weight:600">'+tp.name+'</span>'+
      '<span class="xs faint">'+m.ok+' מתוך '+m.seen+(m.help?" · "+m.help+" עם עזרה":"")+'</span></div>'+
      '<div class="bar '+barCls(m)+'" style="margin-top:5px"><i style="width:'+m.m+'%"></i></div></div>';
  }).join("")+'</div>';
  h+='</div>';
  return h+'</main>';
}

var pendingScroll=null;
function render(){
  var html="";
  /* תלמיד שפתח את דף הנוסחאות באמצע מבחן חייב דרך חזרה מפורשת.
     סרגל הניווט הרגיל לא מכיר את המבחן ולא יחזיר אותו אליו. */
  if(view==="formulas"&&SIT.spec&&SIT.phase==="ask"){
    $("#app").innerHTML=header()+
      '<div class="wrap" style="padding-top:14px"><div class="row">'+
      '<button class="btn btn-p" data-a="sitback">'+ic("back",17)+' חזרה למבחן — שאלה '+
      (SIT.i+1)+' מתוך '+SIT.qs.length+'</button></div></div>'+viewFormulas();
    afterRender(); return;
  }
  /* מבחן שהגיע מקישור עוקף הכול, כולל מסך הפתיחה: מי שנכנס
     ללמוד לא בהכרח פתח את האפליקציה הזאת אי פעם. */
  if(view==="sit"&&SIT.spec){
    $("#app").innerHTML=viewSit();
    afterRender(); return;
  }
  if(view==="badexam"||view==="oldexam"){
    $("#app").innerHTML=viewBadExam(view==="oldexam"?
      "המבחן הזה נוצר בגרסה קודמת של האפליקציה, ולכן השאלות בו כבר לא זהות. בקשו מהמורה לשלוח מבחן חדש.":
      "הקישור חסר או נשבר בדרך. אם הוא הגיע בוואטסאפ, נסו להיכנס אליו ישירות מההודעה.");
    afterRender(); return;
  }
  if(!state.onboarded){
    html=viewOnboard();
  }else{
    html=header();
    if(view==="home")html+=viewHome();
    else if(view==="practice")html+=viewPractice();
    else if(view==="topics")html+=viewTopics();
    else if(view==="formulas")html+=viewFormulas();
    else if(view==="progress")html+=viewProgress();
    else if(view==="settings")html+=viewSettings();
    else if(view==="exam")html+=viewExamNew();
    else if(view==="marks")html+=viewMarks();
    html+='<footer><div class="wrap fbar">'+
      '<span>שלב · מתמטיקה לתיכון, צעד אחר צעד</span>'+
      '<span class="faint">הכול נשמר במכשיר הזה · '+BUILD+'</span></div></footer>';
  }
  $("#app").innerHTML=html;
  afterRender();
}
function afterRender(){
  if(pendingScroll){
    var el=document.getElementById(pendingScroll);
    if(el){
      el.scrollIntoView({block:"center",behavior:state.settings.rm?"auto":"smooth"});
      el.style.outline="3px solid var(--accent)";el.style.outlineOffset="3px";
      setTimeout(function(){el.style.outline="";},2600);
    }
    pendingScroll=null;
  }
}

/* ============================================================
   17. פעולות
   ============================================================ */
function goto(v){
  if(view===v)return;
  view=v;stopSpeak();
  window.scrollTo(0,0);
  render();
}
function readQuestion(){
  if(!P.q)return;
  var body=P.q.expr;
  if(body&&body.indexOf("<br>")>=0){
    var eqs=body.split("<br>");
    body=eqs.map(function(e,i){return (i===0?"משוואה ראשונה: ":"משוואה שנייה: ")+speakMath(plainOf(e))}).join(". ");
  }else body=body?speakMath(plainOf(body)):"";
  var txt=P.q.ask+". "+body+
    ". האפשרויות: "+P.q.options.map(function(o,i){return "אפשרות "+(i+1)+". "+speakMath(o.t)}).join(", ");
  speak(txt);
}
function readSteps(){
  if(!P.q)return;
  var shown=P.phase==="reveal"?P.q.steps.length:Math.min(P.steps,P.q.steps.length);
  var txt=P.q.steps.slice(0,shown).map(function(s){
    return s.t+". "+speakProse(s.d||"")+" "+(s.m?speakMath(plainOf(s.m)):"");
  }).join(". ");
  speak(txt);
}
function onAnswer(i){
  if(P.phase!=="ask"||!P.q)return;
  if(P.picked.indexOf(i)>=0)return;
  var o=P.q.options[i];
  P.picked.push(i);
  if(o.ok){
    P.lastWhy="";
    P.phase="reveal";
    scoreAnswer(true);
    announce("נכון");
    if(state.settings.tts)speak(lineFor(P.results[P.results.length-1]));
  }else{
    P.lastWhy=o.why||"התשובה הזו לא נכונה. שווה לפתוח את הפתרון המודרך ולראות איפה הדרך מתפצלת.";
    announce("לא נכון. "+P.lastWhy);
    if(state.settings.tts)speak(P.lastWhy);
    /* אם נגמרו האפשרויות — עוברים לחשיפה ולא משאירים תקועים */
    if(P.picked.length>=P.q.options.length-1){
      P.phase="reveal";
      scoreAnswer(false);
    }
  }
  render();
}
function advance(){
  P.i++;
  P.lastWhy="";
  if(roundDone()){P.phase="done";state.stats.rounds++;save();render();return}
  loadQ();
  window.scrollTo(0,0);
  render();
}
var VOICE_SAMPLE="פותרים את המשוואה: שלוש איקס ועוד חמש שווה עשרים. מעבירים את החמש לצד השני, ומחלקים בשלוש.";
function onAction(a,el){
  var s=state.settings;
  if(examAction(a,el))return;
  if(a==="go"){goto(el.getAttribute("data-v"));return}
  if(a==="lvl"){state.level=parseInt(el.getAttribute("data-l"),10);save();if(view==="practice"&&P.phase==="ask")loadQ();render();return}
  if(a==="track"){state.track=parseInt(el.getAttribute("data-t"),10);
    state.topics=state.topics.filter(function(id){var t=topicById(id);return t&&t.tracks.indexOf(state.track)>=0});
    save();render();return}
  if(a==="start"){startRound();view="practice";window.scrollTo(0,0);render();return}
  if(a==="starttopic"){var tid=el.getAttribute("data-t");startRound(tid);view="practice";window.scrollTo(0,0);render();return}
  if(a==="ans"){onAnswer(parseInt(el.getAttribute("data-i"),10));return}
  if(a==="next"){advance();return}
  if(a==="stop"){
    if(P.results.length===0){goto("home");return}
    P.list=P.list.slice(0,P.results.length);P.phase="done";save();window.scrollTo(0,0);render();return}
  if(a==="hint"){
    P.hints=1;render();
    if(s.tts&&P.q.hint){
      speak(P.q.hint);
      /* אחרי speak — הוא קורא ל-stopSpeak שמנקה הדגשה קודמת. */
      hlPrep(document.querySelector(".hintxt"),P.q.hint);
    }
    return;
  }
  if(a==="guide"){
    P.steps=1;P.usedHelp=true;
    render();if(s.tts)readSteps();return}
  if(a==="nextstep"){
    P.steps++;P.usedHelp=true;
    if(P.steps>=P.q.steps.length&&P.phase==="ask"){P.phase="reveal";scoreAnswer(false)}
    render();
    if(s.tts&&P.q.steps[P.steps-1]){
      var st=P.q.steps[P.steps-1];
      speak(st.t+". "+speakProse(st.d||"")+" "+(st.m?speakMath(plainOf(st.m)):""));
    }
    return}
  if(a==="read"){readQuestion();return}
  if(a==="readsteps"){readSteps();return}
  if(a==="rule"){fq="";view="formulas";pendingScroll="f-"+el.getAttribute("data-r");window.scrollTo(0,0);render();return}
  if(a==="tog"){var k=el.getAttribute("data-k");s[k]=!s[k];save();applyModes();render();return}
  if(a==="ts"){s.ts=parseInt(el.getAttribute("data-n"),10);save();applyModes();render();return}
  if(a==="theme"){s.theme=el.getAttribute("data-n");save();applyModes();render();return}
  if(a==="rlen"){s.roundLen=parseInt(el.getAttribute("data-n"),10);save();render();return}
  if(a==="engine"){s.engine=el.getAttribute("data-n");ttsErr="";ttsState="";gDead=false;save();render();speak(VOICE_SAMPLE);return}
  if(a==="gvoice"){s.gvoice=el.getAttribute("data-n");ttsErr="";ttsState="";save();render();speak(VOICE_SAMPLE);return}
  if(a==="clearkey"){saveKey("");ttsErr="";render();return}
  if(a==="voice"){s.voice=el.getAttribute("data-u");s.engine="device";save();render();speak(VOICE_SAMPLE);return}
  if(a==="vcheck"){voiceCheck();return}
  if(a==="test"){speak(VOICE_SAMPLE);return}
  if(a==="pick"){
    var id=el.getAttribute("data-t"),ix=state.topics.indexOf(id);
    if(ix>=0)state.topics.splice(ix,1);else state.topics.push(id);
    save();render();return}
  if(a==="selall"){state.topics=topicsForTrack(state.track).map(function(t){return t.id});save();render();return}
  if(a==="selnone"){state.topics=[];save();render();return}
  if(a==="fclear"){fq="";render();return}
  if(a==="obnext"){
    P.obStep=(P.obStep||1)+1;
    if(P.obStep>3){state.onboarded=true;save();applyModes();view="home";window.scrollTo(0,0)}
    save();render();return}
  if(a==="obback"){P.obStep=Math.max(1,(P.obStep||1)-1);render();return}
  if(a==="reset"){
    if(!P.confirmReset){P.confirmReset=true;el.textContent="לוחצים שוב כדי למחוק סופית";return}
    try{localStorage.removeItem(KEY)}catch(e){}
    state=blankState();P=({list:[],i:0,q:null,phase:"ask",picked:[],hints:0,steps:0,usedHelp:false,results:[]});
    applyModes();view="home";render();return}
}

document.addEventListener("click",function(e){
  var el=e.target.closest("[data-a]");
  if(el&&!el.disabled)onAction(el.getAttribute("data-a"),el);
});
document.addEventListener("input",function(e){
  var el=e.target;
  if(!el.dataset)return;
  if(el.dataset.bind==="name"){state.name=el.value;save();return}
  if(el.dataset.bind==="gkey"){
    var k=String(el.value||"").trim();
    /* מציירים מחדש רק כשהמפתח נראה שלם, אחרת הפוקוס קופץ בכל תו */
    if(/^AIza[\w-]{25,}$/.test(k)){saveKey(k);ttsErr="";render();speak(VOICE_SAMPLE)}
    return}
  if(el.dataset.bind==="fq"){fq=el.value;
    var pos=el.selectionStart;render();
    var again=document.querySelector('[data-bind="fq"]');
    if(again){again.focus();try{again.setSelectionRange(pos,pos)}catch(x){}}
    return}
  if(el.dataset.slide==="exm"){
    EB.mins=clamp(parseInt(el.value,10)||0,0,90);
    var labM=$("#exMlab");if(labM)labM.textContent=EB.mins?EB.mins+" דקות":"ללא";
    EB.built=null;
    return}
  if(el.dataset.slide==="exn"){
    EB.n=clamp(parseInt(el.value,10)||10,5,25);
    var lab2=$("#exNlab");if(lab2)lab2.textContent=EB.n;
    EB.built=null;
    return}
  if(el.dataset.slide==="rate"){
    state.settings.rate=parseFloat(el.value);save();
    var lab=$("#ratev");if(lab)lab.textContent=state.settings.rate.toFixed(2);
    return}
});
document.addEventListener("keydown",function(e){
  if(!state.settings.keys)return;
  if(e.target.closest("input,textarea,select"))return;
  if(!state.onboarded||view!=="practice"||!P.q)return;
  if(P.phase==="ask"&&/^[1-4]$/.test(e.key)){
    var i=parseInt(e.key,10)-1;
    if(P.q.options[i]){e.preventDefault();onAnswer(i)}
    return;
  }
  if(e.key===" "){e.preventDefault();readQuestion();return}
  if(e.key==="h"||e.key==="H"){e.preventDefault();if(P.phase==="ask"&&!P.hints)onAction("hint",document.body);return}
  if(e.key==="s"||e.key==="S"){e.preventDefault();if(!P.steps)onAction("guide",document.body);else onAction("nextstep",document.body);return}
  if(e.key==="Enter"&&P.phase==="reveal"){e.preventDefault();advance();return}
});

/* ============================================================
   18. מבחן כיתתי — פרסום בוואטסאפ, קבלת תשובות וציונים
   ------------------------------------------------------------
   אין שרת, ואין כוונה שיהיה. לכן המבחן אינו נשלח לשום מקום:
   הוא *נארז לתוך הקישור*. המורה מקבל קישור, שולח אותו בוואטסאפ,
   והמכשיר של התלמיד בונה מהקישור בדיוק את אותן שאלות.

   מה שהופך את זה לאפשרי הוא שכל מחולל שאלות כאן משתמש ב-
   Math.random בלבד. אם מזרעים אותו, אותו זרע מייצר את אותן
   שאלות ואת אותו סדר תשובות — אצל המורה ואצל התלמיד. הקישור
   נושא זרע ורשימת נושאים, לא עשרים שאלות מלאות, ולכן הוא נשאר
   קצר מספיק לוואטסאפ.

   שלוש מגבלות שנאמרות כאן במפורש כי הן חלק מהתכנון:
   · אין איסוף אוטומטי. התלמיד שולח קוד תשובות בוואטסאפ, והמורה
     מדביק אותו. זה המחיר של אפס שרת ואפס עלות.
   · אפשר לזייף קוד. הציון מחושב מחדש אצל המורה מתוך התשובות
     ולא נלקח מהתלמיד, אבל אין כאן הגנה קריפטוגרפית — זה מבחן
     כיתתי מעצב, לא בגרות.
   · שמות התלמידים נשארים במכשיר של המורה. הם לא עוברים דרך
     שום שרת, כי אין שרת.
   ============================================================ */
var GENV=1;                 /* גרסת המחוללים. מבחן שנוצר בגרסה אחרת
                               אינו נפתח — עדיף הודעה ברורה מאשר
                               עשרים שאלות אחרות בשקט. */
var EKEY="shlav-exams-v1";

/* --- מחולל מזורע. mulberry32: קצר, מהיר, ופיזור טוב דיו --- */
function withSeed(seed,fn){
  var real=Math.random,s=(seed>>>0)||1;
  Math.random=function(){
    s|=0; s=s+0x6D2B79F5|0;
    var t=Math.imul(s^s>>>15,1|s);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
  try{return fn()}finally{Math.random=real}
}
function hash32(str){
  var h=0x811c9dc5,i;
  for(i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193)}
  return (h>>>0);
}
/* base64url. הניקוי בפענוח אינו קוסמטי: וואטסאפ שובר מחרוזות
   ארוכות בשורות, ורווח אחד הורס את כל הקוד. */
function b64e(str){
  var bytes=new TextEncoder().encode(str),bin="",i;
  for(i=0;i<bytes.length;i+=8192)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));
  return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function b64d(s){
  s=String(s||"").replace(/[^A-Za-z0-9\-_]/g,"").replace(/-/g,"+").replace(/_/g,"/");
  while(s.length%4)s+="=";
  var bin=atob(s),bytes=new Uint8Array(bin.length),i;
  for(i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function examId(spec){return hash32(spec.s+"|"+spec.q.map(function(x){return x[0]+x[1]}).join(",")).toString(36)}
function encodeExam(spec){return b64e(JSON.stringify(spec))}
function decodeExam(code){
  try{
    var o=JSON.parse(b64d(code));
    if(!o||!o.q||!o.q.length||typeof o.s!=="number")return null;
    o.q=o.q.filter(function(x){return topicById(x[0])});
    return o.q.length?o:null;
  }catch(e){return null}
}
/* בונה את שאלות המבחן. אותו זרע → אותן שאלות, גם אצל המורה
   כשהוא בודק וגם אצל התלמיד כשהוא נבחן. */
function examQuestions(spec){
  return withSeed(spec.s,function(){
    return spec.q.map(function(pair){return buildQ(pair[0],pair[1])});
  });
}
function examUrl(spec){
  var base=location.origin+location.pathname;
  return base+"#x="+encodeExam(spec);
}
function waLink(text,phone){
  var p=String(phone||"").replace(/[^0-9]/g,"");
  return "https://wa.me/"+p+"?text="+encodeURIComponent(text);
}

/* --- אחסון מבחנים והגשות, בנפרד מהתקדמות התלמיד --- */
var EX={list:[]};
function exLoad(){
  try{var r=localStorage.getItem(EKEY);if(r){var o=JSON.parse(r);if(o&&o.list)EX=o}}catch(e){}
  if(!EX.list)EX.list=[];
}
function exSave(){try{localStorage.setItem(EKEY,JSON.stringify(EX))}catch(e){}}
function exFind(id){for(var i=0;i<EX.list.length;i++)if(EX.list[i].id===id)return EX.list[i];return null}

/* --- קוד ההגשה של התלמיד --- */
function encodeResult(id,name,answers){
  var body={i:id,n:String(name||"").slice(0,40),a:answers,d:todayIso()};
  body.c=hash32(JSON.stringify([body.i,body.n,body.a])).toString(36);
  return b64e(JSON.stringify(body));
}
function decodeResult(code){
  try{
    var o=JSON.parse(b64d(code));
    if(!o||!o.i||!o.a||!o.a.length)return null;
    o.ok=(o.c===hash32(JSON.stringify([o.i,o.n,o.a])).toString(36));
    return o;
  }catch(e){return null}
}
/* הציון מחושב כאן מחדש מתוך התשובות. מה שהתלמיד שלח הוא מה
   שסימן, לא כמה הוא קיבל. */
function gradeResult(spec,res){
  var qs=examQuestions(spec),per=[],ok=0,i,q,a;
  for(i=0;i<qs.length;i++){
    q=qs[i]; a=res.a[i];
    var right=(a>=0&&q.options[a]&&q.options[a].ok)?1:0;
    if(right)ok++;
    per.push({topic:q.topic,topicName:q.topicName,ok:right,
              picked:(a>=0&&q.options[a])?q.options[a].t:"—",
              answer:(q.options.filter(function(o){return o.ok})[0]||{}).t||""});
  }
  return {ok:ok,n:qs.length,pct:Math.round(100*ok/qs.length),per:per};
}

   תלמיד שדפדפן שלו רענן באמצע מבחן איבד עד כה את הכול. התשובות
   נשמרות עכשיו במכשיר, לפי מזהה המבחן, יחד עם שעת ההתחלה — כדי
   שגם טיימר לא יתאפס ויעניק זמן נוסף. השמירה מקומית בלבד.
   ------------------------------------------------------------ */
function sitKey(){return EKEY+"-run-"+SIT.id}
function sitSave(){
  if(!SIT.id)return;
  try{localStorage.setItem(sitKey(),JSON.stringify({
    n:SIT.name,a:SIT.answers,f:SIT.flags,t:SIT.t0,i:SIT.i,p:SIT.phase}))}catch(e){}
}
function sitDrop(){try{localStorage.removeItem(sitKey())}catch(e){}}
function sitRestore(){
  if(!SIT.id)return false;
  try{
    var o=JSON.parse(localStorage.getItem(sitKey())||"null");
    if(!o||!o.a||!o.a.length)return false;
    SIT.qs=examQuestions(SIT.spec);
    if(o.a.length!==SIT.qs.length)return false;   /* מבחן אחר תחת אותו מזהה */
    SIT.name=o.n||""; SIT.answers=o.a;
    SIT.flags=o.f&&o.f.length===o.a.length?o.f:SIT.qs.map(function(){return false});
    SIT.t0=o.t||0; SIT.i=Math.min(Math.max(0,o.i|0),SIT.qs.length-1);
    SIT.phase=o.p==="done"?"done":"ask";
    if(SIT.phase==="done")SIT.code=encodeResult(SIT.id,SIT.name,SIT.answers);
    return true;
  }catch(e){return false}
}
/* שניות שנותרו, או null כשלא הוגדרה הגבלת זמן */
function sitLeft(){
  var m=SIT.spec&&SIT.spec.m;
  if(!m||!SIT.t0)return null;
  return Math.max(0,Math.round((SIT.t0+m*60000-Date.now())/1000));
}
function sitClock(){
  var l=sitLeft(); if(l===null)return "";
  var mm=Math.floor(l/60),ss=l%60;
  return mm+":"+(ss<10?"0":"")+ss;
}
/* הזמן נגמר — מגישים. לא מבקשים אישור: אישור שאיש לא לוחץ עליו
   פירושו מבחן שנשאר פתוח לנצח. */
function sitTimerOn(){
  sitTimerOff();
  if(sitLeft()===null)return;
  SIT.tick=setInterval(function(){
    if(SIT.phase!=="ask"){sitTimerOff();return}
    if(sitLeft()<=0){sitTimerOff();sitFinish();return}
    var el=$("#sitclock"); if(el)el.textContent=sitClock();
  },1000);
}
function sitTimerOff(){if(SIT.tick){clearInterval(SIT.tick);SIT.tick=null}}

function sitStart(){
  var nm=$("#sitName"); SIT.name=nm?nm.value.trim():"";
  SIT.qs=examQuestions(SIT.spec);
  SIT.answers=SIT.qs.map(function(){return -1});
  SIT.flags=SIT.qs.map(function(){return false});
  SIT.i=0; SIT.phase="ask"; SIT.t0=Date.now();
  sitSave(); sitTimerOn();
  window.scrollTo(0,0); render();
}
function sitAnswer(i){
  if(SIT.phase!=="ask")return;
  SIT.answers[SIT.i]=i;
  sitSave();
  sitNext();
}
/* סימון לחזרה אינו תשובה ואינו משנה אותה — הוא רק מסמן. */
function sitFlag(){
  if(SIT.phase!=="ask")return;
  SIT.flags[SIT.i]=!SIT.flags[SIT.i];
  sitSave(); render();
}
function sitNext(){
  if(SIT.i+1<SIT.qs.length){SIT.i++;window.scrollTo(0,0);render();return}
  /* לא מגישים בלחיצה על תשובה. לחיצה בטעות על האפשרות האחרונה
     אינה אמורה לסיים מבחן. */
  SIT.phase="review"; stopSpeak(); window.scrollTo(0,0); render();
}
function sitGo(i){
  SIT.i=clamp(i,0,SIT.qs.length-1); SIT.phase="ask";
  window.scrollTo(0,0); render();
}
function sitFinish(){
  SIT.phase="done";
  sitTimerOff();
  SIT.code=encodeResult(SIT.id,SIT.name,SIT.answers);
  sitSave();
  stopSpeak(); window.scrollTo(0,0); render();
}
function sitGrade(){
  var ok=0,i;
  for(i=0;i<SIT.qs.length;i++){
    var a=SIT.answers[i];
    if(a>=0&&SIT.qs[i].options[a]&&SIT.qs[i].options[a].ok)ok++;
  }
  return {ok:ok,n:SIT.qs.length,pct:Math.round(100*ok/SIT.qs.length)};
}

      '" style="font-size:1.4rem;padding:10px 18px">'+g.pct+'</span>'+
      '<span class="sub">'+g.ok+' נכונות מתוך '+g.n+'</span></div>';
  h3+='<p class="sub" style="margin-top:16px"><b>עכשיו שולחים את הקוד למורה.</b> '+

   פעולות המבחן
   ------------------------------------------------------------ */
function copyText(txt,done){
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(done,function(){fallbackCopy(txt,done)});
      return;
    }
  }catch(e){}
  fallbackCopy(txt,done);
}
function fallbackCopy(txt,done){
  try{
    var ta=document.createElement("textarea");
    ta.value=txt; ta.setAttribute("readonly","");
    ta.style.position="fixed"; ta.style.top="-1000px";
    document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); document.body.removeChild(ta);
    done();
  }catch(e){}
}
function examAction(a,el){
  /* --- בניית מבחן --- */
  if(a==="exlvl"){EB.level=parseInt(el.getAttribute("data-l"),10)||2;EB.built=null;render();return true}
  if(a==="extopic"){
    var id=el.getAttribute("data-t"),k=EB.topics.indexOf(id);
    if(k>=0)EB.topics.splice(k,1);else EB.topics.push(id);
    EB.built=null;render();return true;
  }
  if(a==="exflag"){var f=el.getAttribute("data-f");EB[f]=!EB[f];EB.built=null;render();return true}
  if(a==="exbuild"){
    var ti=$("#exTitle"),ph=$("#exPhone");
    EB.title=ti?ti.value.trim():""; EB.phone=ph?ph.value.trim():"";
    var tops=EB.topics.filter(function(x){return topicById(x)});
    if(!tops.length)tops=topicsForTrack(state.track).slice(0,3).map(function(t){return t.id});
    /* חלוקה שווה בין הנושאים, ואז ערבוב — כדי שלא יגיעו בגושים */
    var q=[],i;
    for(i=0;i<EB.n;i++)q.push([tops[i%tops.length],EB.level]);
    var spec={v:GENV,t:EB.title||"מבחן",s:(Math.random()*4294967295)>>>0,l:EB.level,
              q:shuffle(q),r:!!EB.tts,f:!!EB.formulas,w:true,m:EB.mins||0};
    if(EB.phone)spec.p=EB.phone.replace(/[^0-9]/g,"");
    EB.built=spec; EB.copied="";
    var id=examId(spec);
    if(!exFind(id)){EX.list.unshift({id:id,spec:spec,date:todayIso(),subs:[]});exSave()}
    render(); return true;
  }
  if(a==="excopy"){var u=el.getAttribute("data-v");copyText(u,function(){EB.copied="url";render()});return true}

  /* --- ציונים --- */
  if(a==="mkopen"){var i2=el.getAttribute("data-i");MK.open=MK.open===i2?"":i2;MK.msg=null;render();return true}
  /* מחיקה מוחקת גם את כל ההגשות. שאלה אחת לפני זה היא לא נימוס —
     היא ההבדל בין טעות לבין אובדן של כיתה שלמה. */
  if(a==="mkdel"){MK.del=el.getAttribute("data-i");render();return true}
  if(a==="mkdelno"){MK.del="";render();return true}
  if(a==="mkdelyes"){
    var id3=el.getAttribute("data-i");
    EX.list=EX.list.filter(function(x){return x.id!==id3});
    exSave(); MK.open=""; MK.del=""; render(); return true;
  }
  if(a==="mkcopy"){
    var ex4=exFind(el.getAttribute("data-i")); if(!ex4)return true;
    copyText(marksTable(ex4),function(){MK.msg={id:ex4.id,ok:true,m:"הטבלה הועתקה"};render()});
    return true;
  }
  if(a==="mkadd"){
    var ex=exFind(el.getAttribute("data-i")); if(!ex)return true;
    var ta=$("#mkPaste"),raw=ta?ta.value:"";
    var res=decodeResult(raw);
    if(!res){MK.msg={id:ex.id,ok:false,m:"לא הצלחנו לקרוא את הקוד. נסו להעתיק אותו שוב, במלואו."};render();return true}
    if(res.i!==ex.id){
      var other=exFind(res.i);
      MK.msg={id:ex.id,ok:false,m:other?"הקוד הזה שייך למבחן „"+(other.spec.t||"מבחן")+"”.":
        "הקוד הזה שייך למבחן אחר, שלא נמצא במכשיר הזה."};
      render(); return true;
    }
    if(res.a.length!==ex.spec.q.length){
      MK.msg={id:ex.id,ok:false,m:"מספר התשובות בקוד אינו תואם למבחן."};render();return true}
    var g=gradeResult(ex.spec,res);
    var sub={name:res.n||"",date:res.d||todayIso(),ok:g.ok,n:g.n,pct:g.pct,per:g.per,valid:!!res.ok};
    /* הגשה חוזרת של אותו תלמיד מחליפה את הקודמת ולא מצטברת לידה */
    var k2=(ex.subs||[]).findIndex(function(s){return s.name===sub.name});
    if(!ex.subs)ex.subs=[];
    if(k2>=0)ex.subs[k2]=sub; else ex.subs.push(sub);
    exSave();
    MK.msg={id:ex.id,ok:true,m:(sub.name||"תלמיד")+" נקלט · "+g.pct+" ("+g.ok+"/"+g.n+")"+
      (sub.valid?"":" · שימו לב: הקוד לא תואם לעצמו")};
    if(ta)ta.value="";
    render(); return true;
  }

  /* --- התלמיד --- */
  if(a==="sitstart"){sitStart();return true}
  if(a==="sitans"){sitAnswer(parseInt(el.getAttribute("data-i"),10));return true}
  if(a==="sitskip"){SIT.answers[SIT.i]=-1;sitSave();sitNext();return true}
  if(a==="sitflag"){sitFlag();return true}
  if(a==="sitprev"){sitGo(SIT.i-1);return true}
  if(a==="sitfwd"){sitNext();return true}
  if(a==="sitgo"){sitGo(parseInt(el.getAttribute("data-i"),10));return true}
  if(a==="sitfinish"){sitFinish();return true}
  if(a==="sitread"){var q2=SIT.qs[SIT.i];if(q2)speak(q2.say);return true}
  if(a==="sitform"){view="formulas";render();window.scrollTo(0,0);return true}
  if(a==="sitcopy"){copyText(SIT.code,function(){SIT.copied=true;render()});return true}
  if(a==="sitback"){view="sit";render();window.scrollTo(0,0);return true}
  return false;
}

/* קליטת מבחן מהכתובת. עושים את זה לפני ה-render הראשון, אחרת
   התלמיד רואה לרגע את מסך הבית של אפליקציה שהוא לא מכיר. */
function examFromUrl(){
  var m=String(location.hash||"").match(/^#x=(.+)$/);
  if(!m)return false;
  var sp=decodeExam(m[1]);
  if(!sp){
    view="badexam"; return true;
  }
  if(sp.v!==GENV){view="oldexam";return true}
  SIT.spec=sp; SIT.id=examId(sp); SIT.phase="intro";
  /* מבחן שכבר התחיל במכשיר הזה נמשך מהמקום שבו נעצר, עם הזמן
     שכבר חלף. בלי זה ריענון היה מוחק תשובות ומאפס טיימר. */
  if(sitRestore()&&SIT.phase==="ask")sitTimerOn();
  view="sit"; return true;
}
function viewBadExam(msg){
  return '<div class="wrap" style="padding-block:40px;max-width:520px"><div class="card pad">'+
    '<h1 class="h1">הקישור לא נקרא</h1><p class="sub">'+esc(msg)+'</p>'+
    '<a class="btn btn-p" style="margin-top:14px" href="'+esc(location.origin+location.pathname)+
    '">לאפליקציה</a></div></div>';
}

/* מעבר לקישור מבחן כשהאפליקציה כבר פתוחה הוא ניווט בתוך אותו מסמך:
   הדפדפן לא טוען מחדש, ולכן ההפעלה לא רצה שוב. בלי זה תלמיד שכבר
   פתח את האפליקציה ואז לחץ על הקישור בוואטסאפ פשוט לא רואה כלום. */
window.addEventListener("hashchange",function(){
  if(examFromUrl()){stopSpeak();window.scrollTo(0,0);render()}
  else if(view==="sit"||view==="badexam"||view==="oldexam"){view="home";render()}
});
try{if(window.speechSynthesis)speechSynthesis.onvoiceschanged=function(){if(view==="settings")render()}}catch(e){}
render();
</script>
