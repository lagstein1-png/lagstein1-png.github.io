rything goes through the link and through WhatsApp.","בונים משוואה":"Build an equation","בידוד x ומעבר אגפים":"Isolating x and moving terms to the other side","בכפל אין צורך במכנה משותף. בחילוק הופכים את השבר השני.":"In multiplication there is no need for a common denominator. In division, flip the second fraction.","בכפל ובחילוק הסימן נקבע לבד: זהים → פלוס, שונים → מינוס.":"In multiplication and division the sign is decided on its own: same → plus, different → minus.","בכפל שברים אין צורך במכנה משותף":"When multiplying fractions there is no need for a common denominator","בכפל: מונה כפול מונה, מכנה כפול מכנה. אין מכנה משותף.":"In multiplication: numerator times numerator, denominator times denominator. No common denominator.","במספר זוגי של איברים — ממוצע שני האמצעיים.":"With an even number of terms — the mean of the two middle ones.","במשוואת יחסים מכפילים את הקצוות מול האמצעים.":"In a proportion, multiply the extremes against the means.","במשולש שלפניכם, מהו cos α?":"In the triangle in front of you, what is cos α?","במשולש שלפניכם, מהו sin α?":"In the triangle in front of you, what is sin α?","במשולש שלפניכם, מהו tan α?":"In the triangle in front of you, what is tan α?","בסדר פעולות החשבון כפל וחילוק קודמים לחיבור וחיסור.":"In the order of operations, multiplication and division come before addition and subtraction.","בסוף תקבלו קוד — שולחים אותו למורה בוואטסאפ.":"At the end you will get a code — send it to the teacher on WhatsApp.","בעיות מילוליות":"Word problems","בעיות מילוליות היה הנושא שהכי הפריע בסבב הזה. סבב ממוקד אחד בו יעשה יותר מעוד עשר שאלות מעורבות.":"Word problems was the topic that caused the most trouble this round. One focused round on it will do more than ten more mixed questions.","בפרופורציה a:b = c:x מתקיים a·x = b·c.":"In the proportion a:b = c:x we have a·x = b·c.","בשביל ללמוד מזה, לא בשביל הציון.":"To learn from it, not for the grade.","גיאומטריה":"Geometry","גם על המספר וגם על ה-x. זו הטעות הכי נפוצה כאן.":"Both the number and the x. This ractions","כפל חזקות":"Multiplying powers","כפל תמיד לפני חיבור, גם אם הוא כתוב אחריו.":"Multiplication always comes before addition, even if it is written after it.","כפל, חילוק, חזקה של חזקה ומעריך שלילי":"Multiplication, division, power of a power and a negative exponent","כשהיתר ידוע והניצב חסר — מחסרים: a² = c² − b².":"When the hypotenuse is known and a leg is missing — subtract: a² = c² − b².","כשיש שברים במשוואה — מכפילים את כל המשוואה במכנה המשותף, והם נעלמים.":"When there are fractions in an equation — multiply the whole equation by the common denominator, and they disappear.","כשמחברים אגף לאגף, ה-y מתבטל כי יש +y ו-−y.":"When adding side to side, the y cancels because there is +y and −y.","כששני המכנים זהים אין מה להרחיב — עוברים ישר למונים.":"When both denominators are the same there is nothing to expand — go straight to the numerators.","כששניים נוסעים זה לקראת זה, המהירויות מתחברות ואז מחלקים את המרחק בסכום.":"When two travel towards each other, the speeds add up, and then divide the distance by the sum.","לא חובה":"Optional","לא יודע/ת":"I don't know","לא נפתרו":"Not solved","לאפליקציה":"To the app","לאפליקציה עצמה — לתרגול חופשי":"To the app itself — for free practice","להשתמש בדף נוסחאות זו לא רמאות — גם בבגרות נותנים אחד. מי שלא מבזבז זיכרון על שינון, פנוי לחשוב.":"Using a formula sheet is not cheating — you get one in the Bagrut exam too. Whoever doesn't waste memory on memorising is free to think.","להתקדמות":"To progress","לפני ההגשה":"Before submitting","לציונים":"To grades","לשמוע דוגמה":"Hear a sample","לתלמידי תיכון שלומדים אחרת":"For high-school students who learn differently","מאורע יחיד, משלים ושני ניסויים":"Single event, complement and two trials","מאורע משלים":"Complementary event","מאתגר":"Challenging","מבודדים b":"Isolate b","מבודדים את b":"Isolate b","מבודדים את d":"Isolate d","מבודדים את הצלע":"Isolate the side","מבודדים נעלם אחד":"Isolate one unknown","מבודדים נעלם אחד מהמשוואה הפשוטה, ומציבים אותו במשוואה השנייה.":"Isolate one unknown from the simpler equation, and substitute it into the other equation.","מבחן חדש":"New test","מבחן כיתתי":"Class test","מגדירים נעלם":"Define the unknown","מדביקים כאן את הקוד שהתלמיד שלח בוואטסאפ. הציון מחושב מחדש מהתשובות עצמן, ולא נלקח ממה שהתלמיד כתב.":"Paste here the code the student sent on WhatsApp. The grade is recalculated from the answers themselves, not taken from what the student wrote.","מה היה נכון":"What was correct","מה לקחת מכאן":"What to take from this","מה שמותר בבחינה עצמה. ההקראה ודף הנוסחאות אינם רמז — הם כלי נגישות.":"What is allowed in the exam itself. Read-aloud and the formula sheet are not a hint — they are accessibility tools.","מה שמחפשים הוא ה-x. כל משפט בשאלה הופך לשורה.":"What we are looking for is the x. Each sentence in the question becomes a line.","מהו החציון?":"What is the median?","מהו הממוצע של המספרים?":"What is the mean of the numbers?","מהו הערך המדויק?":"What is the exact value?","מהמשוואה השנייה קל לבודד את y.":"From the second equation it is easy to isolate y.","מונה כפול מונה, מכנה כפול מכנה.":"Numerator times numerator, denominator times denominator.","מוסיפים למחיר המקורי":"Add to the original price","מוצאים אותם":"Find them","מוצאים מכנה משותף":"Find a common denominator","מוציאים את מה שאפשר":"Take out what you can","מוציאים שורש":"Take the square root","מזהים את היתר":"Identify the hypotenuse","מזהים את המקדמים":"Identify the coefficients","מזהים את הצלעות ביחס לזווית α":"Identify the sides relative to the angle α","מזהים מה חסר":"Identify what is missing","מחברים את כל המספרים":"Add up all the numbers","מחברים את שתי המשוואות":"Add the two equations","מחברים ומקבלים משוואה אחת":"Add and get one equation","מחברים מקדמים":"Add the coefficients","מחיקת המבחן":"Delete the test","מחיר לפני ההנחה":"Price before the discount","מחליפים כל y בביטוי שקיבלנו.":"Replace every y with the expression we got.","מחלקים את שני איברי היחס באותו מספר עד שאין להם מחלק משותף.":"Divide both parts of the ratio by the same number until they have no common divisor.","מחלקים את שני האגפים":"Divide both sides","מחלקים באחוז שנשאר. לא מוסיפים חזרה את אותו אחוז.":"Divide by the percentage that remains. Do not add the same percentage back.","מחלקים בכמות":"Divide by the count","מחלקים בלי הסימנים.":"Divide without the signs.","מחלקים במקדם":"Divide by the coefficient","מחלקים במקדם של x":"Divide by the coefficient of x","מחלקים בשיעור שנשאר":"Divide by the remaining rate","מחסרים את המעריך של המכנה.":"Subtract the exponent of the denominator.","מחסרים מהמחיר המקורי":"Subtract from the original price","מחסרים מעריכים":"Subtract the exponents","מחפשים את הניצב שליד הזווית, והיתר ידוע — לכן cos.":"We are looking for the leg adjacent to the angle, and the hypotenuse is known — so cos.","מחפשים את הניצב שמול הזווית, והיתר ידוע — לכן sin.":"We are looking for the leg opposite the angle, and the hypotenuse is known — so sin.","מחפשים מחלק משותף":"Look for a common divisor","מחפשים ריבוע שלם שמתחבא בתוך המספר, ומוציאים רק את השורש שלו.":"Look for a perfect square hiding inside the number, and take out only its root.","מחפשים ריבוע שלם שמתחלק במספר שבשורש.":"Look for a perfect square that divides the number under the root.","מחפשים שני מספרים":"Look for two numbers","מחפשים שני מספרים עם סכום ומכפלה נתונים.":"Look for two numbers with a given sum and product.","מחפשים שני מספרים שמכפלתם היא האיבר החופשי וסכומם הוא מינוס המקדם של x.":"Look for two numbers whose product is the constant term and whose sum is minus the coefficient of x.","מחשבים x":"Calculate x","מחשבים x ואז y":"Calculate x and then y","מחשבים את גודל השינוי":"Calculate the size of the change","מחשבים את האיבר האחרון":"Calculate the last term","מחשבים את הדיסקרימיננטה":"Calculate the discriminant","מחשבים את המקדם":"Calculate the coefficient","מחשבים את הסכום הידוע":"Calculate the known sum","מחשבים את השינוי":"Calculate the change","מחשבים דיסקרימיננטה":"Calculate the discriminant","מחשבים כל מכפלה":"Calculate each product","מחשבים כמה שווה חלק אחד":"Calculate how much one part is worth","מטרה אחת: להגיע למשוואה עם נעלם יחיד.":"One goal: get to an equation with a single unknown.","מכנסים איברים דומים":"Collect like terms","מכפילים את החלק במספר השלם.":"Multiply the part by the whole number.","מכפילים את המספר שבחוץ בכל איבר בפנים":"Multiply the number outside by each term inside","מכפילים את המספרים בלי הסימנים.":"Multiply the numbers without the signs.","מכפילים את כל המשוואה במכנה המשותף":"Multiply the whole equation by the common denominator","מכפילים באלכסון":"Cross-multiply","מכפילים בכל מנה":"Multiply by each share","מכפילים כל איבר בכל איבר":"Multiply every term by every term","מכפילים כל משוואה כך שמקדמי ה-y יהיו הפוכים.":"Multiply each equation so that the y coefficients are opposites.","מכפילים מונה ומכנה באותו מספר — ערך השבר לא משתנה.":"Multiply numerator and denominator by the same number — the value of the fraction does not change.","מכפילים משוואה במספר כך שמקדמי אחד הנעלמים יהיו הפוכים, ואז מחברים.":"Multiply an equation by a number so that the coefficients of one unknown are opposites, then add.","מכפלה מתאפסת כשאחד הגורמים מתאפס":"A product is zero when one of the factors is zero","מכפלת שני בינומים":"Product of two binomials","מלבן, משולש, מעגל וטרפז":"Rectangle, triangle, circle and trapezium","ממוצע = סכום ÷ מספר האיברים":"Mean = sum ÷ number of terms","ממוצע = סכום חלקי כמות":"Mean = sum divided by count","ממוצע = סכום כל המספרים חלקי כמה מספרים יש.":"Mean = the sum of all the numbers divided by how many numbers there are.","ממוצע וחציון":"Mean and median","ממוצע וחציון היה הנושא שהכי הפריע בסבב הזה. סבב ממוקד אחד בו יעשה יותר מעוד עשר שאלות מעורבות.":"Mean and median was the topic that caused the most trouble this round. One focused round on it will do more than ten more mixed questions.","ממוצע כפול כמות = הסכום הכולל. משם מחסרים את מה שכבר ידוע.":"Mean times count = the total sum. From there, subtract what is already known.","ממוצע, חציון ומספר חסר":"Mean, median and a missing number","ממשיכים בטבלה":"Continue in the table","מסכמים":"Add up","מסכמים את הצד הימני":"Add up the right-hand side","מסלול":"Track","מסמנים ב-x את הנעלם, וכותבים כל משפט כביטוי":"Mark the unknown as x, and write each sentence as an expression","מסמנים באות אחת את מה שמחפשים, וכותבים כל משפט בשאלה כביטוי עם אותה אות.":"Mark what we are looking for with one letter, and write each sentence in the question as an expression with that letter.","מסמנים באות אחת בדיוק את מה שמחפשים.":"Mark exactly what we are looking for with one letter.","מספר האיברים כפול הממוצע של הראשון והאחרון.":"The number of terms times the mean of the first and last.","מספר הוואטסאפ שלכם (לא חובה)":"Your WhatsApp number (optional)","מספר שאלות:":"Number of questions:","מספרים מכוונים":"Signed numbers","מספרים מכוונים היה הנושא שהכי הפריע בסבב הזה. סבב ממוקד אחד בו יעשה יותר מעוד עשר שאלות מעורבות.":"Signed numbers was the topic that gave you the most trouble this round. One focused round on it will do more than ten more mixed questions.","מעבירים את x שמאלה, והוא מחליף סימן.":"Move x to the left; it changes sign.","מעבירים את המספר לצד השני":"Move the number to the other side","מעגל":"Circle","מעריך שלילי אינו מספר שלילי — הוא אומר שהחזקה יורדת למכנה.":"A negative exponent is not a negative number — it means the power moves down to the denominator.","מעריך שלילי ואפס":"Negative and zero exponents","מעריך שלילי יורד למכנה":"A negative exponent moves down to the denominator","מעריך שלילי מוריד למכנה, הוא לא הופך את הסימן.":"A negative exponent moves the power to the denominator; it does not flip the sign.","מערכת משוואות":"System of equations","מערכת שתי משוואות":"System of two equations","מערכת שתי משוואות היה הנושא שהכי הפריע בסבב הזה. סבב ממוקד אחד בו יעשה יותר מעוד עשר שאלות מעורבות.":"System of two equations was the topic that gave you the most trouble this round. One focused round on it will do more than ten more mixed questions.","מפרקים למכפלה עם ריבוע שלם":"Factorise into a product with a perfect square","מצאו את משוואת הישר העובר בשתי הנקודות":"Find the equation of the line through the two points","מצאו את שיפוע הישר העובר בנקודות":"Find the slope of the line through the points","מציבים את x ואת y של הנקודה בתוך y = mx + b, ומשאירים את b כנעלם.":"Substitute the point's x and y into y = mx + b, and leave b as the unknown.","מציבים את הנקודה במשוואת הישר":"Substitute the point into the line's equation","מציבים את הערך המדויק":"Substitute the exact value","מציבים בביטוי הראשון":"Substitute into the first expression","מציבים בהגדרה":"Substitute into the definition","מציבים בחזרה ומחברים.":"Substitute back and add.","מציבים בנוסחת השורשים":"Substitute into the quadratic formula","מציבים ומוצאים y":"Substitute and find y","מציבים חזרה":"Substitute back","מציירים את המצב":"Draw the situation","מציירים ומזהים משולש ישר זווית":"Draw and identify a right-angled triangle","מצמצמים יחס בחילוק בשני האיברים, לא בחיסור.":"Simplify a ratio by dividing both terms, not by subtracting.","מצמצמים כל איבר":"Simplify each term","מקבלים משוואה עם נעלם אחד":"We get an equation with one unknown","מרחיבים את שני השברים":"Expand both fractions","מרחק = מהירות · זמן. מכאן גם: מהירות = מרחק ÷ זמן, וזמן = מרחק ÷ מהירות.":"Distance = speed · time. So also: speed = distance ÷ time, and time = distance ÷ speed.","מרחק = מהירות כפול זמן. שווה לזכור את המשולש: D למעלה, v ו-t למטה.":"Distance = speed times time. Remember the triangle: D on top, v and t below.","מרכזים x בצד אחד ומספרים בצד השני":"Collect the x terms on one side and the numbers on the other","מרכזים את כל איברי ה-x בצד אחד ואת כל המספרים בצד השני. כל מעבר צד הופך סימן.":"Collect all the x terms on one side and all the numbers on the other. Every move across changes the sign.","משוואה ממעלה ראשונה":"Linear equation","משוואה עם שברים":"Equation with fractions","משוואה ריבועית":"Quadratic equation","משוואה ריבועית היה הנושא שהכי הפריע בסבב הזה. סבב ממוקד אחד בו יעשה יותר מעוד עשר שאלות מעורבות.":"Quadratic equation was the topi ent and special angles","סכום סדרה חשבונית":"Sum of an arithmetic sequence","סכום סדרה חשבונית = מספר האיברים כפול הממוצע של הראשון והאחרון.":"Sum of an arithmetic sequence = the number of terms times the mean of the first and last.","עוד לא יצרתם מבחן. אפשר להתחיל מ״מבחן חדש״.":"You haven't created a test yet. You can start from “New test”.","עכשיו החיבור":"Now the addition","עכשיו הסימן":"Now the sign","עכשיו שולחים את הקוד למורה.":"Now send the code to your teacher.","עם פתרון מודרך":"With a guided solution","עצירה":"Stop","פועלים על המונים בלבד":"Work on the numerators only","פותחים ומכנסים":"Expand and collect","פותחים כל זוג סוגריים בנפרד":"Expand each pair of brackets separately","פותחים סוגריים בשני הצדדים":"Expand the brackets on both sides","פירוק טרינום":"Factorising a trinomial","פירוק לגורמים, נוסחת השורשים ודיסקרימיננטה":"Factorising, the quadratic formula and the discriminant","פישוט שורש":"Simplifying a root","פעולות עם מינוס וסדר פעולות":"Operations with minus and order of operations","פרופורציה":"Proportion","פשטו את הביטוי":"Simplify the expression","פשטו את השורש":"Simplify the root","פשטו והציגו בלי מעריך שלילי":"Simplify and write without a negative exponent","פשטו לחזקה אחת":"Simplify to a single power","פתוח תמיד — כמו בבגרות, וזה בסדר גמור":"Always open — just like in the Bagrut exam, and that's perfectly fine","פתחו את הסוגריים":"Expand the brackets","פתחו וכנסו איברים דומים":"Expand and collect like terms","פתיחת סוגריים":"Expanding brackets","פתיחת סוגריים היה הנושא שהכי הפריע בסבב הזה. סבב ממוקד אחד בו יעשה יותר מעוד עשר שאלות מעורבות.":"Expanding brackets was the topic that gave you the most trouble this round. One focused round on it will do more than ten more mixed questions.","פתרו בעזרת נוסחת השורשים":"Solve using the quadratic formula","פתרו בשיטת ההצבה":"Solve by substitution","פתרון אחד":"One solution","ציונים":"Scores","צמצום יחס, חלוקה ביחס, פרופורציה":"Simplifying a ratio, dividing in a ratio, proportion","צמצמו את היחס":"Simplify the ratio","צרו את המבחן":"Create the test","קובע אילו נושאים יוצעו לכם. אפשר לשנות בכל רגע.":"Decides which topics you are offered. You can change it at any time.","קודם הגודל":"First the size","קודם כול — מסדרים":"First of all — tidy up","קודם כפל":"Multiplication first","קודם מכניסים את כל המספרים לצד אחד ואת ה-x לצד השני, ורק בסוף מחלקים במקדם.":"First move all the numbers to one side and the x to the other, and only at the end divide by the coefficient.","קודם פותחים את שני זוגות הסוגריים, ורק אחר כך אוספים x עם x ומספר עם מספר.":"First expand both pairs of brackets, and only then collect x with x and number with number.","קודם פותחים את שני זוגות הסוגריים, ורק אחר כך מעבירים אגפים.":"First expand both pairs of brackets, and only then move terms across.","קודם שיפוע משתי הנקודות, אחר כך מציבים אחת מהן כדי למצוא את b.":"First the slope from the two points, then substitute one of them to find b.","קודמת":"Previous","קול המכשיר":"Device voice","קול טבעי":"Natural voice","קוראים את הסימן של Δ":"Read the sign of Δ","קיצור דרך שכדאי להכיר":"A shortcut worth knowing","קליטה":"Receive","ראיתם את כל הדרך. בפעם הבאה תנסו לבד.":"You saw the whole way through. Next time, try it on your own.","רמה":"Level","רק איברים מאותו סוג מתחברים: x עם x, מספר עם מספר.":"Only terms of the same kind add together: x with x, number with number.","רק כשהבסיס זהה.":"Only when the base is the same.","רק שורשים זהים מתחברים, ומחברים אך ורק את המקדמים שלפניהם.":"Only identical roots add together, and you add only the coefficients in front of them.","רק שורשים זהים מתחברים, ורק המקדמים משתנים.":"Only identical roots add together, and only the coefficients change.","שאלות":"Questions","שאלות שנפתרו":"Questions solved","שברים":"Fractions","שברים היה הנושא שהכי הפריע בסבב הזה. סבב ממוקד אחד בו יעשה יותר מעוד עשר שאלות מעורבות.":"Fractions was the topic that gave you the most trouble this round. One focused round on it will do more than ten more mixed questions.","שווה לשנן — חוזר כמעט בכל שאל tters in a ratio.","חיסרתם את אותו מספר משני האגפים. ביחס מצמצמים בחילוק, לא בחיסור.":"You subtracted the same number from both sides. A ratio is simplified by dividing, not subtracting.","זה הערך של פונקציה אחרת או של זווית אחרת בטבלת הזוויות המיוחדות.":"This is the value of a different function or a different angle in the special-angles table.",", שזה הערך של הפונקציה השנייה בזווית הזו.":", which is the value of the other function at this angle.","השתמשתם ב-√":"You used √","השתמשתם בהגדרה של פונקציה טריגונומטרית אחרת.":"You used the definition of a different trigonometric function.","זו ההגדרה של cos. ב-tan אין יתר בכלל — מול חלקי ליד.":"That's the definition of cos. tan has no hypotenuse at all — opposite over adjacent.","זו מידת הזווית במעלות, לא אורך צלע.":"That's the size of the angle in degrees, not the length of a side.","התבלבלתם בין הניצב שמול הזווית לניצב שלידה.":"You mixed up the leg opposite the angle with the leg next to it.","הכפלתם ביתר במקום לקחת ממנו חלק. ניצב תמיד קצר מהיתר.":"You multiplied by the hypotenuse instead of taking a part of it. A leg is always shorter than the hypotenuse.","= x. המקדמים לא מסתכמים ל":"= x. The coefficients don't add up to","אינו x/":"is not x/","חיברתם את המכנים: x/":"You added the denominators: x/","חיברתם את השברים כאילו x/":"You added the fractions as if x/",". חיבור שברים לא מחבר מכנים.":". Adding fractions doesn't add denominators.","לקחתם את ערך ה-y של הנקודה כ-b. b הוא מקום החיתוך עם ציר y, כלומר הערך כש-x שווה":"You took the point's y-value as b. b is where the line crosses the y-axis, that is, the value when x equals","לקחתם ערך y של נקודה כ-b במקום לחשב אותו.":"You took a point's y-value as b instead of calculating it.","החלפתם בין השיפוע לבין ערך ה-x של הנקודה.":"You swapped the slope with the point's x-value.","השיפוע יצא בסימן הפוך — בדקו את סדר החיסור.":"The slope came out with the opposite sign — check the order of subtraction.","הפכתם את השבר. השינוי ב-y הוא המונה, השינוי ב-x הוא המכנה.":"You flipped the fraction. The change in y is the numerator, the change in x is the denominator.","עצרתם אחרי החיסור בלי לחלק בהפרש ה-x.":"You stopped after subtracting without dividing by the difference in x.","זה הפרש ה-x. הוא המכנה בנוסחה, לא השיפוע עצמו.":"That's the difference in x. It's the denominator in the formula, not the slope itself.","חיסרתם את ה-y בסדר ההפוך, וגם לא חילקתם בהפרש ה-x.":"You subtracted the y-values in the opposite order, and also didn't divide by the difference in x.","טעות סימן בבידוד b.":"Sign error when isolating b.","טעות סימן כשבידדתם את b.":"Sign error when you isolated b.","הנחתם ש-y שווה אפס. אין לזה בסיס במשוואות.":"You assumed y equals zero. There's no basis for that in the equations.","עצרתם לפני הוצאת השורש —":"You stopped before taking the square root —","זה c², לא c.":"is c², not c.","זה a², צריך להוציא שורש.":"This is a², you need to take the square root.","שכחתם להוציא שורש בסוף.":"You forgot to take the square root at the end.","חיברתם את הניצבים. פיתגורס עובד על הריבועים, לא על הצלעות עצמן.":"You added the legs. Pythagoras works on the squares, not on the sides themselves.","חיסרתם את הצלעות עצמן במקום את הריבועים שלהן.":"You subtracted the sides themselves instead of their squares.","חיברתם. כשמחפשים ניצב מחסרים את ריבוע הניצב הידוע מריבוע היתר.":"You added. When finding a leg, subtract the square of the known leg from the square of the hypotenuse.","חיסרתם במקום לחבר. מחסרים רק כשמחפשים ניצב, לא יתר.":"You subtracted instead of adding. Subtract only when finding a leg, not the hypotenuse.","חיברתם במקום לחסר.":"You added instead of subtracting.","חיסרתם. האלכסון הוא היתר, ולכן מחברים.":"You subtracted. The diagonal is the hypotenuse, so we add.","חיברתם את הצלעות. האלכסון תמיד קצר מסכום שתי הצלעות.":"You added the sides. The diagonal is always shorter than the sum of the two sides.","הוצאתם את הגורם הריבועי בלי לחשב את השורש שלו.":"You took the square factor out without calculating its root.","הוצאתם מהשורש את המספר הריבועי עצמו במקום את השורש שלו.":"You took the square number itself out of the root instead of its square root.","הכפלתם את שני החלקים. המספר שיצא מהשורש נשאר מוכפל בשורש שנשאר, לא מתמזג איתו.":"You multiplied the two parts. The number that came out of the root stays multiplied by the remaining root; it doesn't merge with it.","חיברתם גם את המספרים שבתוך השורש. השורש הוא ה״שם״ של האיבר — הוא לא משתנה.":"You also added the numbers inside the root. The root is the term's \"name\" — it doesn't change.","העליתם את השורש בריבוע.":"You squared the root.","זה כפול השורש.":"That's twice the root.",". שורש הוא לא חצי — הוא המספר שמוכפל בעצמו נותן":". A root is not a half — it's the number that, multiplied by itself, gives","בחזקה של חזקה מכפילים מעריכים, לא מחברים.":"With a power of a power, multiply the exponents, don't add them.","הכפלתם את המעריכים.":"You multiplied the exponents.","הכפלתם את המעריכים. בכפל של אותו בסיס המעריכים מתחברים.":"You multiplied the exponents. When multiplying the same base, the exponents add.","הכפלתם את המעריכים במקום לחסר.":"You multiplied the exponents instead of subtracting.","חיברתם את המעריכים. חיבור שייך לכפל, ובחילוק מחסרים.":"You added the exponents. Adding belongs to multiplication; in division we subtract.","חיסרתם את המעריכים. חיסור שייך לחילוק, לא לכפל.":"You subtracted the exponents. Subtracting belongs to division, not multiplication.","חיסרתם בכיוון ההפוך. מחסרים את המעריך של המכנה מזה של המונה.":"You subtracted in the wrong direction. Subtract the denominator's exponent from the numerator's.","הכפלתם גם את הבסיס. הבסיס נשאר x — רק המעריך משתנה.":"You multiplied the base too. The base stays x — only the exponent changes.","הכפלתם את המקדם במעריך במקום להעלות אותו בחזקה.":"You multiplied the coefficient by the exponent instead of raising it to the power.","קיבלתם מעריך שלילי והורדתם ממנו את המינוס. מעריך שלילי הופך לשבר, לא נעלם.":"You got a negative exponent and dropped its minus. A negative exponent becomes a fraction; it doesn't disappear.","המינוס עבר למקדם. מעריך שלילי לא הופך את הסימן של הביטוי, אלא מוריד אותו למכנה.":"The minus moved to the coefficient. A negative exponent doesn't flip the sign of the expression; it moves it to the denominator.",", לא רק על ה-x.":", not only on the x.","חיברתם מונה עם מונה ומכנה עם מכנה. בחיבור וחיסור שברים חייבים מכנה משותף.":"You added numerator to numerator and denominator to denominator. Adding and subtracting fractions requires a common denominator.","חיברתם מונים ומכנים. בכפל מכפילים מונה במונה ומכנה במכנה.":"You added numerators and denominators. In multiplication, multiply numerator by numerator and denominator by denominator.","חיברתם מונים ומכנים. זו לא הפעולה שנדרשה כאן.":"You added numerators and denominators. That's not the operation required here.","המונים הוכפלו אבל המכנים חוברו.":"The numerators were multiplied but the denominators were added.","פעלתם על המונים אבל השארתם את המכנה של השבר הראשון.":"You worked on the numerators but kept the denominator of the first fraction.","הפכתם את השבר. המבוקש נמצא במונה.":"You flipped the fraction. What's asked for is in the numerator.","הפכתם את השבר. שימו לב מה במונה ומה במכנה בהגדרה.":"You flipped the fraction. Notice what's in the numerator and what's in the denominator in the definition.","הפכתם את השבר השני. הופכים רק בחילוק, לא בכפל.":"You flipped the second fraction. Flip only in division, not in multiplication.","הפכתם את שני השברים. הופכים רק את זה שאחרי סימן החילוק.":"You flipped both fractions. Flip only the one after the division sign.","הפכתם את השבר הראשון במקום את השני.":"You flipped the first fraction instead of the second.","הכפלתם ישר בלי להפוך את השבר השני. בחילוק חייבים להפוך.":"You multiplied straight away without flipping the second fraction. In division you must flip.","הכפלתם את השברים במקום לחבר או לחסר אותם.":"You multiplied the fractions instead of adding or subtracting them.","חיברתם את שני השברים במקום להכפיל אותם.":"You added the two fractions instead of multiplying them.","חיברתם את שני השברים במקום לחלק ביניהם.":"You added the two fractions instead of dividing them.","מצאתם מכנה משותף, אבל לא הרחבתם את המונים. כשהמכנה גדל — גם המונה חייב לגדול באותו יחס.":"You found a common denominator, but didn't scale the numerators. When the denominator grows, the numerator must grow by the same ratio.","הרחבתם רק את השבר הראשון. שני השברים צריכים להגיע למכנה המשותף.":"You scaled only the first fraction. Both fractions need to reach the common denominator.","הרחבתם רק את השבר השני. שני השברים צריכים להגיע למכנה המשותף.":"You scaled only the second fraction. Both fractions need to reach the common denominator.","לקחתם את מכפלת המכנים כמכנה, אבל הרחבתם את המונים לפי המכנה המשותף — שני מכנים שונים באותו חישוב.":"You took the product of the denominators as the denominator, but scaled the numerators by the common denominator — two different denominators in the same calculation.","התשובה יצאה הפוכה — מונה ומכנה התחלפו בסוף.":"The answer came out upside down — numerator and denominator got swapped at the end.","הכפלתם במכנה המשותף אבל שכחתם לחלק בסוף במקדם של x.":"You multiplied by the common denominator but forgot to divide by the coefficient of x at the end.","חילקתם בכיוון ההפוך.":"You divided the wrong way round.","חילקתם. מרחק = מהירות כפול זמן.":"You divided. Distance = speed times time.","חיברתם מהירות עם זמן. אלה גדלים שונים — הם לא מתחברים.":"You added speed to time. These are different quantities — they don't add.","חיסרתם מהירויות. חיסור מתאים למרדף באותו כיוון, לא לנסיעה זה לקראת זה.":"You subtracted the speeds. Subtracting fits a chase in the same direction, not travelling towards each other.","התייחסתם רק לרכב אחד. כששניהם נוסעים זה לקראת זה — המהירויות מתחברות.":"You considered only one vehicle. When both travel towards each other, the speeds add.","מיותר — לא צריך לחצות את המרחק.":"Unnecessary — there's no need to halve the distance.","התייחסתם רק לקובייה אחת.":"You considered only one die.","חיברתם את מספרי הפאות במקום להכפיל אותם.":"You added the numbers of faces instead of multiplying them.","חיברתם הסתברויות. חיבור מתאים ל״או״, כפל מתאים ל״וגם״.":"You added probabilities. Adding fits \"or\", multiplying fits \"and\".","זו ההסתברות דווקא כן להוציא שחור. השאלה מבקשת את המשלים.":"That's the probability of actually drawing black. The question asks for the complement.","חילקתם במספר הכדורים שאינם אדומים. המכנה הוא תמיד סך כל האפשרויות.":"You divided by the number of balls that aren't red. The denominator is always the total number of possibilities.","חילקתם במספר השחורים במקום בסך הכול.":"You divided by the number of black balls instead of the total.","חילקתם במספר הצבעים ולא במספר הכדורים.":"You divided by the number of colours, not the number of balls.","זה הסכום של כל המספרים, לא המספר החסר.":"That's the sum of all the numbers, not the missing number.","זה הסכום. נשאר לחלק במספר האיברים.":"That's the sum. You still need to divide by the number of terms.","זה המספר הגדול ביותר, לא הממוצע.":"That's the largest number, not the mean.","זה הממוצע, לא החציון.":"That's the mean, not the median.","חילקתם במספר איברים שגוי — יש כאן":"You divided by the wrong number of terms — there are","חיסרתם את הממוצע מהסכום הידוע במקום להשתמש בסכום הכולל.":"You subtracted the mean from the known sum instead of using the total sum.","הנחתם שהמספר החסר שווה לממוצע. זה נכון רק אם כל המספרים שווים.":"You assumed the missing number equals the mean. That's true only if all the numbers are equal.","לקחתם את האיבר האמצעי לפי הסדר שבו הם נכתבו. חייבים קודם לסדר.":"You took the middle term in the order they were written. You must sort first.","לקחתם רק אחד משני האיברים האמצעיים. במספר זוגי לוקחים את הממוצע שלהם.":"You took only one of the two middle terms. With an even count, take their mean.","ספרתם מקום אחד יותר מדי אחרי הסידור.":"You counted one place too many after sorting.","חילקתם את הסכום בכל מספר בנפרד. קודם צריך לחלק במספר החלקים הכולל.":"You divided the amount by each number separately. First divide by the total number of parts.","זה ההפרש הכולל לאורך כל הסדרה, לא ההפרש בין שני איברים עוקבים.":"That's the total difference across the whole sequence, not the difference between two consecutive terms.","הכפלתם ב-n במקום ב-n מינוס":"You multiplied by n instead of n minus",". מהאיבר הראשון לאיבר ה":". From the first term to term number","חילקתם ב-n. מספר הצעדים בין האיבר הראשון לאיבר ה":"You divided by n. The number of steps between the first term and term number","הכפלתם את האיבר הראשון ב-n.":"You multiplied the first term by n.","עצמו, לא הסכום של כולם.":"itself, not the sum of all of them.","לקחתם רק את האיבר הראשון.":"You took only the first term.","טעות בהזזת נקודה עשרונית — חלקתם ב":"Decimal point error — you divided by","חילקתם את המספר באחוז. אחוז זה כפל בשבר, לא חילוק.":"You divided the number by the percentage. A percentage means multiplying by a fraction, not dividing.","חישבתם את גודל ההנחה או התוספת, אבל השאלה מבקשת את המחיר עצמו.":"You calculated the size of the discount or increase, but the question asks for the price itself.","הלכתם לכיוון ההפוך — הוספתם במקום להוריד.":"You went the wrong way — you added instead of subtracting.","הלכתם לכיוון ההפוך — הורדתם במקום להוסיף.":"You went the wrong way — you subtracted instead of adding.","למחיר אחרי ההנחה. אחוז שמורידים ואחוז שמוסיפים לא מבטלים זה את זה.":"to the price after the discount. A percentage taken off and a percentage added on do not cancel each other out.","חילקתם באחוז ההנחה במקום באחוז שנשאר.":"You divided by the discount percentage instead of the remaining percentage.","חילקתם בערך החדש. אחוז שינוי מחושב תמיד ביחס לערך ההתחלתי.":"You divided by the new value. Percentage change is always calculated relative to the original value.","זה גודל השינוי בשקלים, לא באחוזים.":"This is the size of the change in shekels, not in percent.","זה היחס בין המחירים. כדי לקבל את אחוז העלייה צריך להוריד":"This is the ratio between the prices. To get the percentage increase you need to subtract","זה ההיקף —":"This is the circumference —","πr. שטח הוא πr².":"πr. Area is πr².","זה השטח — πr². היקף הוא":"This is the area — πr². Circumference is","שכחתם את המכפלה ב":"You forgot to multiply by",". ההיקף מחושב לפי הקוטר, שהוא פי שניים מהרדיוס.":". The circumference is calculated from the diameter, which is twice the radius.","השתמשתם בקוטר במקום ברדיוס. בנוסחה r הוא הרדיוס — חצי מהקוטר.":"You used the diameter instead of the radius. In the formula r is the radius — half the diameter.","זה ההיקף — סכום כל הצלעות. שטח הוא אורך כפול רוחב.":"This is the perimeter — the sum of all the sides. Area is length times width.","חיברתם את הצלעות במקום להכפיל.":"You added the sides instead of multiplying.","הכפלתם במקום לחלק. כדי לחזור אחורה מנוסחת השטח מחלקים.":"You multiplied instead of dividing. To work backwards from the area formula, you divide.","חיסרתם. השטח נוצר מכפל, אז הפעולה ההפוכה היא חילוק.":"You subtracted. Area comes from multiplication, so the inverse operation is division.","חילקתם פעמיים.":"You divided twice.","ללא צורך.":"unnecessarily.",". חצי מהמכפלה זה שטח משולש, לא מלבן.":". Half the product is the area of a triangle, not a rectangle.",". משולש הוא בדיוק חצי מהמלבן שעוטף אותו.":". A triangle is exactly half of the rectangle that encloses it.","הכפלתם את שני הבסיסים. בטרפז מחברים אותם, לא מכפילים.":"You multiplied the two bases. In a trapezium you add them, not multiply.","חישבתם רק את ממוצע הבסיסים בלי להכפיל בגובה.":"You only calculated the average of the bases without multiplying by the height.","חישבתם ממוצע של הבסיס והגובה.":"You calculated the average of the base and the height.","חישבתם משמאל לימין. כפל תמיד קודם לחיבור, גם אם הוא כתוב אחריו.":"You calculated from left to right. Multiplication always comes before addition, even if it is written after it.","חיברתם את שלושת המספרים. באמצע יש כפל, ולא חיבור.":"You added all three numbers. In the middle there is multiplication, not addition.","חיברתם את שני המספרים במקום להכפיל. הסוגריים כאן מסמנים כפל.":"You added the two numbers instead of multiplying. The brackets here mean multiplication.","הכפלתם את הזוג הלא נכון. הכפל שכתוב הוא בין שני המספרים האחרונים.":"You multiplied the wrong pair. The multiplication is between the last two numbers.","הסימן התהפך. הכלל: שני סימנים זהים נותנים פלוס, סימנים שונים נותנים מינוס.":"The sign got flipped. The rule: two identical signs give plus, different signs give minus.","הפכתם את הסימן של התוצאה. שווה לבדוק שוב איזה מהמספרים גדול יותר בערכו המוחלט.":"You flipped the sign of the result. Check again which number has the larger absolute value.","טעות בגודל המכפלה. שווה לחשב שוב בלי הסימנים ורק אז להוסיף אותם.":"Error in the size of the product. Recalculate without the signs, then add them back.","חיסרתם בכיוון ההפוך — את המספר הראשון מהשני.":"You subtracted the wrong way round — the first number from the second.","החלפתם את סימן המכפלה בשלב החיבור.":"You changed the sign of the product at the addition step.","המספר לא החליף סימן כשעבר צד.":"The number did not change sign when it moved to the other side.","עצרתם צעד מוקדם מדי — נשאר לחלק במקדם של x.":"You stopped one step too early — you still need to divide by the coefficient of x.","הכפלתם במקדם במקום לחלק בו.":"You multiplied by the coefficient instead of dividing by it.","הסימן של התשובה התהפך בשלב החילוק.":"The sign of the answer got flipped at the division step.","הסימן התהפך — כדאי לבדוק את החיסור של המקדמים.":"The sign got flipped — check the subtraction of the coefficients.","חיברתם את מקדמי ה-x במקום לחסר אותם. איבר שעובר צד מחליף סימן.":"You added the x coefficients instead of subtracting them. A term that moves to the other side changes sign.","חיברתם את מקדמי ה-x במקום לחסר. איבר שעובר צד מחליף סימן.":"You added the x coefficients instead of subtracting. A term that moves to the other side changes sign.","הכפלתם את מקדמי ה-x זה בזה במקום לחבר אותם.":"You multiplied the x coefficients by each other instead of adding them.","בפתיחת הסוגריים בצד שמאל נשמר הסימן במקום להתהפך.":"When expanding the brackets on the left side, the sign stayed the same instead of flipping.","בסוגריים השניים הכפלתם רק את ה-x ולא את המספר.":"In the second brackets you multiplied only the x and not the number.","הכפלתם רק את ה-x ושכחתם להכפיל גם את המספר השני שבסוגריים.":"You multiplied only the x and forgot to also multiply the second number in the brackets.","טעות סימן כשפתחתם את הסוגריים השניים.":"Sign error when you expanded the second brackets.","צמצמתם רק את האיבר השני. חייבים לחלק את שני האיברים באותו מספר.":"You cancelled only the second term. Both terms must be divided by the same number.","חילקתם ב-a במקום ב":"You divided by a instead of by","החלפתם בין הנעלמים.":"You swapped the unknowns.","החלפתם בין x ל-y בסוף.":"You swapped x and y at the end.","טעות סימן בחיבור המשוואות.":"Sign error when adding the equations.","טעות סימן בפתיחת הסוגריים אחרי ההצבה.":"Sign error when expanding the brackets after substituting.","טעות סימן בהצבה חזרה.":"Sign error when substituting back.","טעות סימן בהפרש.":"Sign error in the difference.","טעות סימן בחיסור. מחסרים את הראשון מהאחרון.":"Sign error in the subtraction. Subtract the first from the last.","טעות סימן בחיסור. שמרו על אותו סדר בשני החיסורים.":"Sign error in the subtraction. Keep the same order in both subtractions.","טעות סימן במכפלת שני המספרים.":"Sign error in the product of the two numbers.","טעות סימן במכפלה של שני המספרים.":"Sign error when multiplying the two numbers.","לקחתם את אגפי הימין כתשובה בלי לפתור.":"You took the right-hand sides as the answer without solving.","טעות סימן ב-−b. שימו לב שהנוסחה מתחילה במינוס b.":"Sign error in −b. Note that the formula starts with minus b.","מצאתם פתרון אחד בלבד. הסימן ± נותן שני פתרונות.":"You found only one solution. The ± sign gives two solutions.","לקחתם את המקדמים כפתרונות.":"You took the coefficients as the solutions.","שכחתם את האיבר האמצעי. יש שתי מכפלות שנותנות x, וצריך לחבר אותן.":"You forgot the middle term. There are two products that give x, and they need to be added.","שכחתם את המכפלה של שני המספרים.":"You forgot the product of the two numbers.","שכחתם להפוך סימן. אם הפירוק הוא (x − r) אז השורש הוא +r.":"You forgot to flip the sign. If the factor is (x − r) then the root is +r.","סימן אחד הופך והשני לא — שווה לבדוק את הפירוק שוב.":"One sign flips and the other does not — check the factorisation again.","אחרי שחישבתם את החלק הראשון, השני חושב בטעות.":"After you calculated the first part, the second was calculated wrongly.","הכפלתם במקום לחלק. הילד צעיר יותר.":"You multiplied instead of dividing. The child is younger.","מגיל ההורה. ״פי":"from the parent's age. The “","״ פירושו חילוק, לא חיסור.":"” is a multiplier — it means division, not subtraction.","זה הפרש הגילים, לא גיל הילד.":"This is the age difference, not the child's age.","זה גיל ההורה, שכבר נתון בשאלה. מבקשים את גיל הילד.":"This is the parent's age, which is already given in the question. The child's age is what is asked for.","חיברתם במקום להכפיל, וגם הסימן יצא הפוך.":"You added instead of multiplying, and the sign also came out wrong.","הכפלתם במקום לחלק, וגם הסימן יצא הפוך.":"You multiplied instead of dividing, and the sign also came out wrong.","חישבתם ממוצע של הגדול והקטן ביותר. החציון הוא האיבר האמצעי אחרי סידור.":"You averaged the largest and the smallest. The median is the middle value after sorting.","גם התייחסתם ל-":"You also treated the ","שקלים, וגם הלכתם לכיוון ההפוך.":"shekels, and you also went the wrong way.","חיברתם את המספר":"You added the number","לסכום.":"to the total.","שכחתם להכפיל ב":"You forgot to multiply by",". היחס שקיבלתם הוא שבר, והאחוז הוא אותו שבר כפול מאה.":". The ratio you got is a fraction, and the percentage is that same fraction times one hundred.","% מהמחיר. כדי לחזור אחורה מחלקים בשיעור שנשאר, לא מכפילים בו.":"% of the price. To work backwards, divide by the remaining fraction, do not multiply by it.","לא החלפתם סימן במעבר האגף, וגם עצרתם לפני החלוקה במקדם.":"You did not change the sign when moving to the other side, and you also stopped before dividing by the coefficient.",". אחרי הנחה של":". After a discount of","בלבלתם עם חיבור. שני איברים זהים שמתחברים נותנים מקדם שתיים, אבל כאן יש כפל והמעריכים מתחברים.":"You confused this with addition. Two identical terms added together give a coefficient of two, but here it is multiplication and the exponents are added.","במקום ב":"instead of by","בסוגריים השמאליים הכפלתם רק את ה-x ולא את המספר שלידו.":"In the left-hand brackets you multiplied only the x and not the number next to it.","בשני זוגות הסוגריים הכפלתם רק את ה-x ולא את המספר שלידו.":"In both pairs of brackets you multiplied only the x and not the number next to it.","גם המספר לא החליף סימן וגם מקדמי ה-x חוברו במקום להתחסר.":"The number did not change sign, and the x coefficients were added instead of subtracted.","הורדתם עוד":"You took off another","החלפתם בין הסכום למכפלה: האיבר האמצעי הוא הסכום, והאחרון הוא המכפלה.":"You swapped the sum and the product: the middle term is the sum, and the last one is the product.","החלפתם בין השיפוע ל-b. השיפוע הוא זה שמוכפל ב-x.":"You swapped the slope and b. The slope is the one multiplied by x.","הכפלתם את האורך בעצמו. במלבן מכפילים אורך ברוחב.":"You multiplied the length by itself. In a rectangle you multiply length by width.","הכפלתם את הרוחב בעצמו. במלבן מכפילים אורך ברוחב.":"You multiplied the width by itself. In a rectangle you multiply length by width.","הכפלתם את האיבר האחרון במספר האיברים, כאילו כל האיברים שווים לו.":"You multiplied the last term by the number of terms, as if all the terms were equal to it.","הכפלתם את המונים במקום לחבר אותם, והשארתם את המכנה.":"You multiplied the numerators instead of adding them, and kept the denominator.","הכפלתם את המונים במקום לחסר אותם, והשארתם את המכנה.":"You multiplied the numerators instead of subtracting them, and kept the denominator.","הכפלתם את הממוצע במספר המספרים הידועים. הממוצע מוכפל בכל":"You multiplied the mean by the number of known numbers. The mean is multiplied by all","הכפלתם את המספר שבפנים ושכחתם להכפיל גם את ה-x.":"You multiplied the number inside and forgot to also multiply the x.","הכפלתם ב":"You multiplied by","הכפלתם בשתיים במקום לחלק בשתיים. משולש הוא חצי מהמלבן, לא כפול ממנו.":"You multiplied by two instead of dividing by two. A triangle is half of the rectangle, not double it.","העליתם את המקדם בחזקה אבל השארתם את מעריך ה-x כמו שהוא.":"You raised the coefficient to the power but left the exponent of x as it was.","השארתם את המספר הראשון כמו שהוא, כאילו השני שווה לאפס.":"You left the first number as it was, as if the second were zero.","השארתם את המספר השני בלבד ושכחתם את הראשון.":"You kept only the second number and forgot the first.","השמטתם את השורש. הוא חלק מהאיבר ואינו נעלם בכינוס.":"You dropped the root. It is part of the term and does not disappear when collecting like terms.","התייחסתם רק לרכב השני. כששניהם נוסעים זה לקראת זה — המהירויות מתחברות.":"You only considered the second vehicle. When both travel towards each other — the speeds add up.","התעלמתם מהמספר שבאגף שמאל. קודם מעבירים אותו לצד השני, ורק אז מחלקים במקדם.":"You ignored the number on the left side. First move it to the other side, and only then divide by the coefficient.","ולא":"and not","זה הממוצע של המספרים הידועים בלבד, לא המספר החסר.":"This is the mean of the known numbers only, not the missing number.","זה הממוצע של הראשון והאחרון. נשאר להכפיל אותו במספר האיברים.":"This is the average of the first and last terms. You still need to multiply it by the number of terms.","זה המספר הקטן ביותר, לא הממוצע.":"This is the smallest number, not the mean.","זה סכום המספרים הידועים. ממנו עוד צריך להגיע למספר החסר.":"This is the sum of the known numbers. From here you still need to get to the missing number.","זו ההסתברות שהכדור אינו אדום. השאלה מבקשת דווקא אדום.":"This is the probability that the ball is not red. The question asks for red.","חיברתם את המספר שבחוץ עם המספר שבפנים במקום להכפיל אותם.":"You added the number outside to the number inside instead of multiplying them.","חיברתם במקום לחלק.":"You added instead of dividing.","חיברתם במקום לחסר כשבידדתם את b. המכפלה m·x עוברת אגף ומחליפה סימן.":"You added instead of subtracting when isolating b. The product m·x moves to the other side and changes sign.","חילקתם רק את b במכנה והשארתם את השורש בחוץ. קו השבר חל על כל המונה.":"You divided only b by the denominator and left the root outside. The fraction bar applies to the whole numerator.","חיסרתם בכיוון ההפוך — את המספר שבאגף ימין מזה שבאגף שמאל.":"You subtracted the wrong way round — the number on the right side from the one on the left side.","חיסרתם בכיוון ההפוך — ישן פחות חדש. המחיר עלה, אז אחוז השינוי חיובי.":"You subtracted the wrong way round — old minus new. The price went up, so the percentage change is positive.","חיסרתם בכיוון ההפוך — את המונה הראשון מהשני.":"You subtracted the wrong way round — the first numerator from the second.","חיסרתם במקום להכפיל.":"You subtracted instead of multiplying.","חיסרתם במקום לחלק.":"You subtracted instead of dividing.","חיסרתם את הגדלים בסדר ההפוך, וגם התעלמתם מהסימנים.":"You subtracted the values in the wrong order, and also ignored the signs.","חיסרתם מהסכום הכולל את הממוצע. צריך לחסר ממנו את סכום המספרים הידועים.":"You subtracted the mean from the total. You need to subtract the sum of the known numbers from it.","חישבתם ממוצע של שתי הצלעות.":"You calculated the average of the two sides.","חישבתם רק את הכפל ושכחתם להוסיף את המספר הראשון.":"You only did the multiplication and forgot to add the first number.","הכפלתם את שלושת המספרים. באמצע יש כפל, אבל בהתחלה יש חיבור.":"You multiplied all three numbers. In the middle there is multiplication, but at the start there is addition.","טעות בהזזת הנקודה העשרונית — השינוי יצא קטן פי עשרה ממה שהוא באמת.":"Decimal point error — the change came out ten times smaller than it really is.","טעות סימן ב-x אחרי ההצבה.":"Sign error in x after substituting.","טעות סימן ב-x כשחילקתם ב":"Sign error in x when you divided by","טעות סימן ב-y בשלב ההצבה חזרה.":"Sign error in y ou forgot to add the first term. The formula starts with a₁.","שכחתם להעלות את הרדיוס בריבוע.":"You forgot to square the radius.","שכחתם לחלק במאה. אחוז הוא תמיד חלק מתוך מאה.":"You forgot to divide by one hundred. A percentage is always a part out of one hundred.","שכחתם לספור את הכדורים הכחולים. המכנה הוא סך כל הכדורים בשקית.":"You forgot to count the blue balls. The denominator is the total number of balls in the bag.","העתקתם את השיפוע בסימן הפוך.":"You copied the slope with the opposite sign.","הפכתם את שבר השיפוע. השינוי ב-y הוא המונה, השינוי ב-x הוא המכנה.":"You inverted the slope fraction. The change in y is the numerator, the change in x is the denominator.","עצרתם אחרי הפרש ה-y ולא חילקתם בהפרש ה-x. זה לא השיפוע.":"You stopped after the difference in y and did not divide by the difference in x. That is not the slope.","השארתם את המעריך של הגורם הראשון בלבד. בכפל של אותו בסיס המעריכים מתחברים.":"You kept only the exponent of the first factor. When multiplying the same base, the exponents are added.","האיבר האחרון הוא מכפלת שני המספרים, ולא הסכום שלהם.":"The last term is the product of the two numbers, not their sum.","טעות סימן ב-x כשחילקתם ב-2.":"Sign error in x when you divided by 2.","לא נכון":"Incorrect","(a + b), אז חצי ההיקף הוא סכום שתי הצלעות.":"(a + b), so half the perimeter is the sum of the two sides.","(x + b)(x − b) = x² − b². אין כאן איבר אמצעי — הוא מתבטל.":"(x + b)(x − b) = x² − b². There is no middle term here — it cancels out.",", וכל אחד מהשברים מצטמצם.":", and each of the fractions cancels down.",", ולא רק על ה-x.":", and not just to the x.",". איזה אחוז מתלמידי הכיתה הם בנות?":". What percentage of the students in the class are girls?",". איזה אחוז מתלמידי הכיתה הם בנים?":". What percentage of the students in the class are boys?",". ארבעה מהם הם":". Four of them are",". במשולש יש שלוש צלעות בלבד.":". A triangle has only three sides.",". הוסיפו מספר אחד נוסף, והממוצע החדש הוא":". One more number was added, and the new mean is",". המכנה הוא המחיר שממנו התחלנו.":". The denominator is the price we started from.",". מה השינוי הכולל לעומת המחיר המקורי?":". What is the total change compared with the original price?",". מהו החציון של כל חמשת המספרים?":". What is the median of all five numbers?",". מהו המספר שהוסף?":". What is the number that was added?",". משולש הוא חצי מהמלבן שעוטף אותו.":". A triangle is half of the rectangle that encloses it.","/xᵃ. המקדם נשאר למעלה.":"/xᵃ. The coefficient stays on top.","P = P(כן, לא) + P(לא, כן)":"P = P(yes, no) + P(no, yes)","P(לפחות אחת) =":"P(at least one) =","S = S(מלבן) − S(משולש)":"S = S(rectangle) − S(triangle)","sin α = מול ÷ יתר":"sin α = opposite ÷ hypotenuse","sin הוא הניצב שמול הזווית חלקי היתר. היתר נתון, הניצב שמול — לא.":"sin is the side opposite the angle divided by the hypotenuse. The hypotenuse is given, the opposite side — is not.","tan α = מול ÷ ליד":"tan α = opposite ÷ adjacent","tan הוא הניצב שמול הזווית חלקי הניצב שלידה. הניצב שליד נתון, זה שמול — לא.":"tan is the side opposite the angle divided by the side adjacent to it. The adjacent side is given, the opposite one — is not.","x = הרוחב , האורך = x +":"x = the width , the length = x +","x = מחיר מחברת , y = מחיר עט":"x = price of a notebook , y = price of a pen","אורך מלבן גדול ב":"The length of a rectangle is greater by","אורך צלע אינו יכול להיות שלילי, ולכן הפתרון השני נפסל.":"A side length cannot be negative, so the second solution is rejected.","אחוז שינוי = (חדש − ישן) ÷ ישן ·":"percentage change = (new − old) ÷ old ·","אחר כך החזקה":"then the power","אי אפשר להציב לפני שיודעים גם את m וגם את b, ואת שניהם צריך למצוא מהנקודות.":"You cannot substitute before you know both m and b, and both must be found from the points.","אי אפשר לכנס שורשים שאינם זהים — אבל אולי הם כן יהיו זהים אחרי פישוט. משם מתחילים.":"You cannot collect roots that are not identical — but maybe they will be identical after simplifying. That is where to start.","אין כאן משוואה — צריך לכתוב אותה. מסמנים באות את הצלע המבוקשת ומבטאים דרכה את השנייה.":"There is no equation here — you need to write one. Use a letter for the side you are looking for and express the other side in terms of it.","אין שינוי במחיר":"No change in price","אם הממוצע":"If the mean","ארבע פעולות בתרגיל אחד. הסדר הוא סוגריים, אחר כך חזקה, אחר כך כפל, והחיבור אחרון.":"Four operations in one exercise. The order is brackets, then powers, then multiplication, and addition last.","באיזו נקודה חותך את ציר ה-x הישר העובר בשתי הנקודות?":"At what point does the line through the two points cross the x-axis?","בדיוק פעם אחת?":"exactly once?","בודקים מה ההגדרה דורשת":"Check what the definition requires","בוחרים את הפתרון שמתאים לשאלה":"Choose the solution that fits the question","בחזקה של חזקה חיברתם מעריכים במקום להכפיל אותם.":"For a power of a power you added the exponents instead of multiplying them.","בין האיבר ה":"between term number","בכיתה היחס בין מספר הבנים למספר הבנות הוא":"In a class, the ratio of the number of boys to the number of girls is","בכפל שברים גם המכנים מוכפלים — הם לא מתחברים.":"When multiplying fractions the denominators are multiplied too — they are not added.","במשולש ישר זווית שתי צלעות קובעות את השלישית.":"In a right-angled triangle, two sides determine the third.","בסדר הפעולות הסוגריים קודמים להכול — גם לחזקה.":"In the order of operations, brackets come before everything — even powers.","בסדר הפעולות כפל קודם לחיבור, גם כשהוא כתוב אחרון וגם כשמדובר בשברים.":"In the order of operations, multiplication comes before addition, even when it is written last and even with fractions.","בסדרה חשבונית האיבר ה":"In an arithmetic sequence, term number","בסיס כפול גובה חלקי":"base times height divided by","בשביל שטח צריך שני ניצבים, וכאן נתון רק אחד. אז השאלה הראשונה היא איך משיגים את השני.":"For the area you need both legs, and here only one is given. So the first question is how to get the second.","דילגתם על החזקה. מה שבסוגריים מועלה בריבוע לפני הכפל.":"You skipped the power. What is in the brackets is squared before multiplying.","האיבר האמצעי בפתיחת הריבוע הוא כפול המכפלה, ולא המכפלה עצמה.":"The middle term when expanding the square is twice the product, not the product itself.","ההגדרה זקוקה לצלע שאינה נתונה. במשולש ישר זווית תמיד אפשר להשלים צלע שלישית משתי האחרות.":"The definition needs a side that is not given. In a right-angled triangle you can always find the third side from the other two.","ההטלות בלתי תלויות, ולכן מכפילים.":"The throws are independent, so we multiply.","ההיקף אינו השטח, אבל ממנו אפשר להגיע לצלע החסרה — ומשם לשטח.":"The perimeter is not the area, but from it you can get the missing side — and from there the area.","ההפרש הוא המספר שהוסף":"The difference is the number that was added","הוא c² ולא c.":"is c² and not c.","הופכים את השבר שאחרי סימן החילוק ומכפילים.":"Flip the fraction after the division sign and multiply.","הופכים שבר לאחוזים":"Convert the fraction to a percentage","החזקה החיצונית חלה גם על המקדם":"The outer power applies to the coefficient too","החזקה החיצונית חלה על כל גורם בפנים, וחזקה של חזקה מכפילה מעריכים.":"The outer power applies to every factor inside, and a power of a power multiplies the exponents.","החציון נמדד על כל חמשת המספרים, ואחד מהם עדיין לא ידוע. אז יש כאן שני שלבים.":"The median is taken over all five numbers, and one of them is still unknown. So there are two steps here.","היחס אינו אחוז. קודם בודקים מכמה חלקים מורכב השלם.":"A ratio is not a percentage. First check how many parts make up the whole.","היחס נותן חלקים, ואחוז נמדד תמיד מתוך השלם. אז קודם מחשבים כמה חלקים יש בסך הכול.":"A ratio gives parts, and a percentage is always measured out of the whole. So first work out how many parts there are in total.","היקף הוא סכום שלוש הצלעות, והצלע השלישית אינה נתונה.":"The perimeter is the sum of the three sides, and the third side is not given.","היקף הוא סכום שלוש הצלעות. אחת מהן חסרה — ואותה אפשר לחשב מהשתיים האחרות.":"The perimeter is the sum of the three sides. One of them is missing — and it can be calculated from the other two.","היקף מלבן הוא":"The perimeter of a rectangle is","הישר עובר בשתי הנקודות שלפניכם. מהו ערך y כאשר x =":"The line passes through the two points shown. What is the value of y when x =","הישר עובר בשתי הנקודות שלפניכם. מהו ערך y כאשר x = −":"The line passes through the two points shown. What is the value of y when x = −","היתר ידוע, ולכן מחסרים ריבועים.":"The hypotenuse is known, so we subtract squares.","הכיוון הפוך. שווה להשוות את המחיר הסופי למחיר המקורי ולראות מי גדול.":"The direction is wrong. Compare the final price with the original price and see which is bigger.","הכפלתם את האיבר הראשון במספר האיברים, כאילו כל האיברים שווים.":"You multiplied the first term by the number of terms, as if all the terms were equal.","הכפלתם את ההיקף באורך. השטח מחושב משתי הצלעות, לא מההיקף.":"You multiplied the perimeter by the length. The area is calculated from the two sides, not from the perimeter.","הכפלתם את הזוג הלא נכון. סימן הכפל נמצא בין שני השברים האחרונים.":"You multiplied the wrong pair. The multiplication sign is between the last two fractions.","הכפלתם את היתר בניצב. שטח משולש ישר זווית מחושב משני הניצבים בלבד.":"You multiplied the hypotenuse by a leg. The area of a right-angled triangle is calculated from the two legs only.","הכפלתם את המקדמים במקום לחבר אותם.":"You multiplied the coefficients instead of adding them.","הכפלתם את הסוגריים בשתיים. העלאה בריבוע היא כפל של הביטוי בעצמו, ולא כפל בשתיים.":"You multiplied the brackets by two. Squaring means multiplying the expression by itself, not by two.","הכפלתם את שינוי הממוצע בכמות. חסר כאן הערך של הממוצע עצמו.":"You multiplied the change in the mean by the count. The value of the mean itself is missing here.","הכפלתם בלי להפוך. בחילוק בשבר חייבים להפוך את השבר השני.":"You multiplied without flipping. When dividing by a fraction you must flip the second fraction.","הכפלתם במכנה רק את ה-x. המכנה מוכפל בכל מה שמעל קו השבר.":"You multiplied only the x by the denominator. The denominator multiplies everything above the fraction bar.","המינוס לפני הסוגריים השניים חל על שני האיברים שבתוכם, ולא רק על הראשון.":"The minus before the second brackets applies to both terms inside them, not just the first.","המכנה הוא הסך הכול, לא הקבוצה השנייה.":"The denominator is the total, not the second group.","המספר שבחוץ מוכפל גם ב-x וגם במספר שלידו.":"The number outside multiplies both the x and the number next to it.","המשוואה לא כתובה בצורה שאפשר לפרק. קודם מסדרים אותה כך שבצד אחד יהיה אפס.":"The equation is not written in a form that can be factorised. First rearrange it so that one side is zero.","הנחתם שזה ריבוע. שתי הצלעות כאן אינן שוות.":"You assumed it is a square. The two sides here are not equal.","הסוגריים קודמים לחילוק, ולחיסור שברים צריך מכנה משותף.":"Brackets come before division, and subtracting fractions needs a common denominator.","הסכום אחרי התוספת":"The sum after the addition","הסכום לפני התוספת":"The sum before the addition","העליתם כל מספר בסוגריים בריבוע בנפרד. (a − b)² אינו a² − b².":"You squared each number in the brackets separately. (a − b)² is not a² − b².","הפכתם את השבר הלא נכון — יצא הפוך לגמרי.":"You flipped the wrong fraction — the result came out completely inverted.","הפכתם את השבר. הניצב שמול הזווית הוא המונה.":"You inverted the fraction. The side opposite the angle is the numerator.","הצבתם את b כתשובה. b הוא נקודת החיתוך עם ציר y, וצריך עוד לפתור mx + b =":"You gave b as the answer. b is the y-intercept, and you still need to solve mx + b =","הצבתם בשיפוע ושכחתם את b. y = mx + b, לא y = mx.":"You substituted into the slope and forgot b. y = mx + b, not y = mx.","הצורה מורכבת משתי צורות שכבר מוכרות. מחשבים כל אחת בנפרד, ואז מחליטים אם לחבר או לחסר.":"The shape is made of two shapes you already know. Calculate each one separately, then decide whether to add or subtract.","הרוחב =":"the width =","הריבוע יצא שלילי. מספר בריבוע לעולם אינו שלילי, גם כשהבסיס שלילי.":"The square came out negative. A squared number is never negative, even when the base is negative.","השינוי השני מחושב מהמחיר החדש, לא מהמחיר המקורי. זו כל הנקודה.":"The second change is calculated from the new price, not from the original price. That is the whole point.","התחלתם מהחילוק. הסוגריים קודמים לכל פעולה אחרת.":"You started with the division. Brackets come before every other operation.","התייחסתם לאיבר ה":"You treated term number","התייקרות של":"A price increase of","התעלמתם מהאיבר החופשי והוצאתם x מחוץ לסוגריים. יש כאן גם מספר בלי x.":"You ignored the constant term and factored out x. There is also a number without x here.","ואותו דבר בשני":"and the same in the second","ואחר כך ירד ב":"and then went down by","ואחר כך עלה ב":"and then went up by","ולבסוף החיבור":"and finally the addition","וסכומם":"and their sum","ורק עכשיו מחברים":"and only now add","ורק עכשיו מחשבים שטח":"and only now calculate the area","ורק עכשיו מציבים בהגדרה":"and only now substitute into the definition","ורק עכשיו צריך מכנה משותף.":"and only now do we need a common denominator.","ורק שורשים זהים אפשר לכנס. מחברים או מחסרים אך ורק את המקדמים.":"and only identical roots can be collected. Add or subtract the coefficients only.","זה cos α — הניצב שליד חלקי היתר. השאלה מבקשת sin, וההגדרה שלו דורשת את הניצב שמול הזווית.":"This is cos α — adjacent divided by hypotenuse. The question asks for sin, and its definition needs the side opposite the angle.","זה cos α — הניצב שליד חלקי היתר. השאלה מבקשת tan, וההגדרה שלו דורשת את הניצב שמול הזווית.":"This is cos α — adjacent divided by hypotenuse. The question asks for tan, and its definition needs the side opposite the angle.","זה גודל השינוי בממוצע, לא המספר שהוסף.":"This is the size of the change in the mean, not the number that was added.","זה האורך. השאלה מבקשת את הרוחב, והוא הקטן מביניהם.":"This is the length. The question asks for the width, which is the smaller of the two.","זה האחוז של הקבוצה השנייה.":"This is the percentage of the second group.","זה האיבר ה":"This is term number","זה ההיקף — סכום הצלעות. שטח הוא מכפלה.":"This is the perimeter — the sum of the sides. Area is a product.","זה הטווח — ההפרש בין הגדול לקטן.":"That is the range — the difference between the largest and the smallest.","זה היקף מלבן שצלעותיו":"That is the perimeter of a rectangle whose sides are","זה המחיר של מחברת ועט יחד.":"That is the price of a notebook and a pen together.","זה הממוצע החדש. מספר שמוסיפים כדי להעלות ממוצע חייב להיות גדול ממנו.":"That is the new mean. A number added to raise a mean must be larger than it.","זה הממוצע הקודם, לפני שהוסף המספר.":"That is the previous mean, before the number was added.","זה הממוצע שנתון בשאלה. ממוצע וחציון אינם אותו דבר.":"That is the mean given in the question. Mean and median are not the same thing.","זה המספר החסר שמצאתם. הוא צעד בדרך, לא התשובה.":"That is the missing number you found. It is a step on the way, not the answer.","זה המרחק הכולל בקילומטרים, לא המהירות.":"That is the total distance in kilometres, not the speed.","זה הניצב שמצאתם, ועדיין לא השטח.":"That is the leg you found, and not yet the area.","זה הפתרון השני של המשוואה, אבל אורך צלע אינו יכול להיות שלילי.":"That is the second solution of the equation, but a side length cannot be negative.","זה השטח, לא ההיקף.":"That is the area, not the perimeter.","זה השינוי השני בלבד. השאלה מבקשת את השינוי לעומת המחיר המקורי.":"That is the second change only. The question asks for the change compared with the original price.","זה לא הממוצע של שתי המהירויות — הן לא נמשכו אותו מספר שעות.":"It is not the average of the two speeds — they did not last the same number of hours.","זה ערך ה-x שנתון בשאלה, לא ה-y שמחפשים.":"That is the x value given in the question, not the y we are looking for.","זה ערך ה-y רק כאשר x =":"That is the y value only when x =","זה שטח המשולש שהוסר בלבד.":"That is the area of the removed triangle only.","זו ההגדרה של ציר ה-x, וזה מה שהופך את השאלה למשוואה.":"That is the definition of the x-axis, and that is what turns the question into an equation.","זו ההסתברות ל״לפחות פעם אחת״, והיא כוללת גם את המקרה שבו המספר הופיע פעמיים.":"That is the probability of \"at least once\", and it also includes the case where the number came up twice.","זו ההסתברות שהמספר לא הופיע אף פעם. זה בדיוק המאורע ההפוך — נשאר להשלים ל":"That is the probability that the number never came up. That is exactly the opposite event — it remains to complete it to","זו ההסתברות ששתי ההטלות נתנו את המספר.":"That is the probability that both rolls gave the number.","זו ההסתברות ששתי ההטלות נתנו את המספר. ״לפחות אחת״ כולל גם מקרה אחד בלבד.":"That is the probability that both rolls gave the number. \"At least one\" also includes the case of just one.","זו נקודה שנתונה בשאלה, לא נקודת החיתוך עם הציר.":"That is a point given in the question, not the intersection point with the axis.","זו נקודת החיתוך עם ציר y. על ציר x דווקא ה-y הוא שמתאפס.":"That is the intersection point with the y-axis. On the x-axis it is y that equals zero.","חוזרים אחורה אל האיבר הראשון":"Go back to the first term","חוזרים אחורה אל הראשון, צעד אחרי צעד.":"Go back to the first term, step by step.","חוזרים לשאלה":"Back to the question","חיברתם את המספרים שבתוך השורש. √a + √b אינו √(a+b).":"You added the numbers inside the root. √a + √b is not √(a+b).","חיברתם את המקדמים במקום לחסר אותם.":"You added the coefficients instead of subtracting them.","חיברתם את השיפוע ל-x במקום להכפיל.":"You added the slope to x instead of multiplying.","חיברתם את מקדמי ה-x במקום לחסר אותם.":"You added the x coefficients instead of subtracting them.","חיברתם את שלושת השברים. באמצע יש כפל, לא חיבור.":"You added the three fractions. In the middle there is a multiplication, not an addition.","חיברתם את שני האחוזים. שינוי אחד מעלה ואחד מוריד — הם לא מצטברים לאותו כיוון.":"You added the two percentages. One change goes up and one goes down — they do not add up in the same direction.","חיברתם את שתי ההטלות. החיבור סופר פעמיים את המקרה שבו שתיהן הצליחו.":"You added the two rolls. Adding counts the case where both succeeded twice.","חיברתם את שתי המהירויות. מהירויות מתחברות רק כששני גופים נעים זה לקראת זה.":"You added the two speeds. Speeds add up only when two bodies move towards each other.","חיברתם במקום לחסר. המשולש הוסר מהמלבן.":"You added instead of subtracting. The triangle was removed from the rectangle.","חיברתם מונה עם מונה ומכנה עם מכנה. בחיבור שברים חייבים מכנה משותף.":"You added numerator to numerator and denominator to denominator. Adding fractions needs a common denominator.","חיברתם רק את שני הניצבים. להיקף צריך גם את היתר.":"You added only the two legs. The perimeter needs the hypotenuse too.","חילוק באותו בסיס — מחסרים מעריכים":"Dividing with the same base — subtract the exponents","חילקתם את הסכום במספר הפריטים, כאילו כולם עולים אותו דבר.":"You divided the total by the number of items, as if they all cost the same.","חילקתם את השטח בהפרש בין הצלעות. ההפרש אינו אחת הצלעות.":"You divided the area by the difference between the sides. The difference is not one of the sides.","חילקתם בקבוצה השנייה. אחוז נמדד תמיד מתוך הסך הכול.":"You divided by the second group. A percentage is always measured out of the total.","חיסרתם אחוז מאחוז. אחוזים אינם מתחברים ואינם מתחסרים — כל אחד מהם מחושב מבסיס אחר.":"You subtracted a percentage from a percentage. Percentages cannot be added or subtracted — each is calculated from a different base.","חיסרתם את המעריכים בכיוון ההפוך. מחסרים את המעריך של המכנה מזה של המונה.":"You subtracted the exponents the wrong way round. Subtract the exponent of the denominator from that of the numerator.","חיסרתם את הצלעות עצמן. בפיתגורס מחסרים את הריבועים שלהן, ורק אז מוציאים שורש.":"You subtracted the sides themselves. In Pythagoras you subtract their squares, and only then take the root.","חיסרתם את מכפלת הבסיס בגובה. שטח משולש הוא חצי מזה.":"You subtracted the product of base and height. The area of a triangle is half of that.","חיסרתם מונה ממונה ומכנה ממכנה. בחיסור שברים חייבים מכנה משותף.":"You subtracted numerator from numerator and denominator from denominator. Subtracting fractions needs a common denominator.","חיסרתם צלע אחת בלבד. בהיקף כל צלע מופיעה פעמיים.":"You subtracted only one side. In the perimeter each side appears twice.","חישבתם חציון של ארבעת המספרים הידועים בלבד, בלי המספר החסר.":"You found the median of the four known numbers only, without the missing number.","חישבתם ממוצע של שתי המהירויות. הן לא נמשכו אותו זמן, ולכן המשקל שלהן שונה.":"You averaged the two speeds. They did not last the same time, so their weights are different.","חישבתם משמאל לימין. הכפל קודם לחיבור, גם כשהוא כתוב אחרון.":"You calculated from left to right. Multiplication comes before addition, even when it is written last.","חישבתם משמאל לימין. כפל קודם לחיבור, גם בשברים.":"You calculated from left to right. Multiplication comes before addition, in fractions too.","חישבתם רק סדר אחד. ״בדיוק פעם אחת״ מתקיים בשתי דרכים — וצריך לחבר אותן.":"You counted only one order. \"Exactly once\" happens in two ways — and they must be added.","חצי ההיקף הוא סכום שתי הצלעות, ולא הרוחב עצמו.":"Half the perimeter is the sum of the two sides, not the width itself.","חציון בלי סידור הוא טעות כמעט ודאית.":"A median without sorting is an almost certain mistake.","טעות בסימן המכפלה. שני סימנים זהים נותנים פלוס, סימנים שונים נותנים מינוס.":"Sign error in the product. Two equal signs give plus, different signs give minus.","טעות סימן ב-b בשלב ההצבה.":"Sign error in b at the substitution step.","טעות סימן בחילוק ב-m.":"Sign error when dividing by m.","טעות סימן בשלב האחרון, כשחילקתם במקדם.":"Sign error in the last step, when you divided by the coefficient.","ירידה של":"a decrease of","יש כאן גם שברים וגם סוגריים. כל עוד יש מכנים אי אפשר להעביר אגפים — אז מהם מתחילים.":"There are both fractions and brackets here. As long as there are denominators you cannot move terms to the other side — so start with them.","יש כאן חמישה מספרים, ולכן החציון הוא זה שבמקום השלישי.":"There are five numbers here, so the median is the one in third place.","יש כאן שתי נוסחאות כפל מקוצר שונות. פותחים כל אחת בנפרד, ורק אחר כך מחסרים ומכנסים.":"There are two different special-product formulas here. Expand each one separately, and only then subtract and collect like terms.","יש כאן שתי פעולות שונות. השאלה הראשונה היא לא איך מחברים — אלא מה עושים קודם.":"There are two different operations here. The first question is not how to add — but what to do first.","יש כאן שתי פעולות שונות. השאלה הראשונה היא לא איך מחלקים — אלא מה עושים קודם.":"There are two different operations here. The first question is not how to divide — but what to do first.","כאילו הוא האיבר הראשון. צריך קודם לחזור אחורה אליו.":"As if it were the first term. You first need to go back to it.","כותבים את החלק המבוקש כשבר":"Write the required part as a fraction","כותבים את השטח כמשוואה":"Write the area as an equation","כינסתם גם את מה שבתוך השורש. השורש הוא ה״שם״ של האיבר — הוא נשאר כמו שהוא.":"You also collected what is inside the root. The root is the \"name\" of the term — it stays as it is.","כל איבר שעובר אגף מחליף סימן.":"Every term that moves to the other side changes sign.","כל דבר שמחירו לא ידוע מקבל אות משלו.":"Everything whose price is unknown gets a letter of its own.","כל דרך היא מכפלה":"Each way is a product","כל קנייה היא משוואה":"Each purchase is an equation","כפל באותו בסיס — מחברים מעריכים":"Multiplying with the same base — add the exponents","כפל קודם לחיבור, גם כשהוא כתוב אחרון.":"Multiplication comes before addition, even when it is written last.","לא צמצמתם: x² מופיע פעמיים עם סימנים הפוכים והוא מתבטל.":"You did not simplify: x² appears twice with opposite signs and cancels out.","לאיבר ה":"to term number","לוקחים את האמצעי":"Take the middle one","לחמישה מספרים יש ממוצע":"Five numbers have a mean of","לפחות פעם אחת?":"at least once?","לקחתם את האיבר האמצעי לפי הסדר שבו הם כתובים. חייבים לסדר קודם.":"You took the middle term in the order they are written. You must sort first.","לקחתם את המספרים כפי שהם מופיעים במשוואה, בלי לפרק.":"You took the numbers as they appear in the equation, without factorising.","מה חסר כדי לחשב היקף":"What is missing to find the perimeter","מה חסר כדי לחשב שטח":"What is missing to find the area","מהאיבר ה":"from term number","מההיקף לרוחב":"From the perimeter to the width","מהירות ממוצעת = כל המרחק חלקי כל הזמן":"Average speed = total distance divided by total time","מהירות ממוצעת אינה ממוצע של מהירויות. היא כל המרחק חלקי כל הזמן — אז קודם מחשבים את שניהם.":"Average speed is not the average of the speeds. It is the total distance divided by the total time — so first work out both.","מוצאים את ההפרש":"Find the common difference","מוצאים את היתר":"Find the hypotenuse","מוצאים את הניצב החסר":"Find the missing leg","מוצאים את שני המחירים":"Find both prices","מחברות ו":"notebooks and","מחברים ומצמצמים":"Add and simplify","מחסרים את הסוגריים השניים כולם":"Subtract the whole second bracket","מחפשים שני מספרים שמכפלתם −":"Look for two numbers whose product is −","מחשבים את ההסתברות לא לקבל בהטלה אחת":"Find the probability of not getting it in one roll","מחשבים את המחיר אחרי השינוי הראשון":"Find the price after the first change","מחשבים את המחיר אחרי השינוי השני":"Find the price after the second change","מחשבים כמה נסע בכל קטע":"Find how far it travelled in each part","מינוס לפני סוגריים הופך את הסימן של כל איבר בתוכם, גם של השני.":"A minus before brackets flips the sign of every term inside, the second one too.","מכפילים את שני האגפים במכנה המשותף":"Multiply both sides by the common denominator","מכפילים ב":"Multiply by","מכפילים ומצמצמים":"Multiply and simplify","מכפילים כל משוואה כך שמקדמי ה-y יתבטלו, ומחברים.":"Multiply each equation so that the y coefficients cancel, then add.","ממוצע הוא משוואה":"A mean is an equation","ממוצע כפול כמות = סכום. חשבו את הסכום לפני ואת הסכום אחרי, וההפרש הוא התשובה.":"Mean times count = sum. Work out the sum before and the sum after, and the difference is the answer.","ממוצע כפול כמות נותן את הסכום.":"Mean times count gives the sum.","ממלבן שאורכו":"From a rectangle whose length is","מסדרים למשוואה ריבועית":"Rearrange into a quadratic equation","מסכמים את כל הדרך ואת כל הזמן":"Add up the total distance and the total time","מסלקים נעלם אחד":"Eliminate one unknown","מסמנים את הנעלם":"Name the unknown","מסמנים את הנעלמים":"Name the unknowns","מסמנים ב-x את הצלע שמחפשים, ומבטאים דרכה את השנייה.":"Call the side we are looking for x, and express the other one through it.","מספר שלילי בריבוע יוצא חיובי: מינוס כפול מינוס נותן פלוס.":"A negative number squared comes out positive: minus times minus gives plus.","מספר שעבר אגף לא החליף סימן.":"A number moved to the other side without changing sign.","מספרים, והממוצע שלהם":"numbers, and their mean is","מעבירים הכול לצד אחד":"Move everything to one side","מעבירים הכול לצד אחד — רק כך אפשר לפרק לגורמים.":"Move everything to one side — only then can you factorise.","מעלים בריבוע את מה שיצא מהסוגריים.":"Square what came out of the brackets.","מעריך שלילי אינו סימן מינוס של הביטוי — הוא מוריד את החזקה למכנה.":"A negative exponent is not a minus sign on the expression — it moves the power to the denominator.","מפרקים את המאורע":"Break the event down","מפרקים את הצורה לשתיים":"Split the shape into two","מפרקים ופותרים":"Factorise and solve","מפשטים כל שורש בנפרד":"Simplify each root separately","מציבים אחת הנקודות ב-y = mx + b.":"Substitute one of the points into y = mx + b.","מרחיבים למכנה משותף":"Expand to a common denominator","מרחק = מהירות · זמן.":"Distance = speed · time.","משוואה ריבועית נפתרת רק כשבצד אחד יש אפס. זה הצעד שלפני כל השאר.":"A quadratic equation is solved only when one side is zero. That is the step before everything else.","משווים למחיר המקורי":"Compare with the original price","משלימים את המספר החסר":"Fill in the missing number","משלימים ל":"Complete to","מתחילים מהסוגריים":"Start with the brackets","נוסחת הסכום דורשת את a₁, והוא לא נתון. אז מתחילים מההפרש — הוא מה שמאפשר לחזור אחורה.":"The sum formula needs a₁, and it is not given. So start with the common difference — it is what lets you go back.","נפטרים מהמכנים":"Get rid of the denominators","נשאלנו על מחברת בלבד — ורק את זה עונים.":"We were asked about a notebook only — and that is all we answer.","נשאלנו על עט בלבד — ורק את זה עונים.":"We were asked about a pen only — and that is all we answer.","ס\"מ גזרו משולש שבסיסו":"cm a triangle was cut out whose base is","ס\"מ ואורכו":"cm and its length is","ס\"מ ואחד הניצבים":"cm and one of the legs is","ס\"מ והניצב שליד הזווית α הוא":"cm and the leg next to angle α is","ס\"מ מרוחבו, ושטחו":"cm longer than its width, and its area is","ס\"מ. מהו sin α?":"cm. What is sin α?","ס\"מ. מהו tan α?":"cm. What is tan α?","ס\"מ. מהו היקף המשולש?":"cm. What is the perimeter of the triangle?","ס\"מ. מהו שטח החלק שנשאר?":"cm. What is the area of the remaining part?","ס\"מ. מהו שטח המשולש?":"cm. What is the area of the triangle?","סופרים מה קל יותר":"Count whatever is easier","סימן אחד הופך והשני לא — שווה לבדוק שוב את המעבר לצד אחד.":"One sign flips and the other does not — worth checking again how you moved everything to one side.","סמ\"ר. מהו רוחב המלבן?":"sq cm. What is the width of the rectangle?","ספרתם מקום אחד מאוחר מדי. מבין חמישה מספרים האמצעי הוא השלישי.":"You counted one place too far. Out of five numbers the middle one is the third.","ספרתם מקום אחד מוקדם מדי. מבין חמישה מספרים האמצעי הוא השלישי.":"You stopped one place too early. Out of five numbers the middle one is the third.","עטים ושילמו":"pens and paid","עכשיו הכפל":"Now the multiplication","עכשיו יש":"Now there are","עכשיו יש חמישה מספרים — מסדרים":"Now there are five numbers — sort them","עכשיו יש משוואה מלאה, אפשר להציב בה כל x.":"Now there is a complete equation, and any x can be substituted into it.","עכשיו שני השורשים זהים":"Now the two roots are the same","עלייה של":"an increase of","עצמו, לא הסכום.":"itself, not the sum.","עצרתם אחרי הסוגריים ולא ביצעתם את החילוק.":"You stopped after the brackets and did not do the division.","עצרתם בשבר ולא הכפלתם ב":"You stopped at the fraction and did not  and the width is not given. Find it from the perimeter.","שטח המשולש":"Area of the triangle","שטח מלבן = אורך · רוחב.":"Area of a rectangle = length · width.","שטח משולש ישר זווית מחושב משני הניצבים, והניצב השני אינו נתון.":"The area of a right-angled triangle is found from the two legs, and the second leg is not given.","שטח שנשאר = שטח המלבן פחות שטח המשולש שהוסר.":"Remaining area = area of the rectangle minus area of the removed triangle.","שכחתם להוציא שורש —":"You forgot to take the root —","שכחתם לחלק ב":"You forgot to divide by","שלב ב: מוצאים את b":"Step B: find b","שלב ג: מציבים את ה-x שנשאלנו עליו":"Step C: substitute the x we were asked about","שלב ג: על ציר x מתקיים y =":"Step C: on the x-axis, y =","שלושה חוקים שונים נדרשים כאן. מתחילים מהסוגריים — כל עוד יש חזקה של חזקה, אי אפשר לחבר או לחסר מעריכים.":"Three different rules are needed here. Start with the brackets — as long as there is a power of a power, you cannot add or subtract exponents.","שני איברי x² מתבטלים זה עם זה.":"The two x² terms cancel each other out.","שני האחוזים מחושבים מבסיסים שונים. מחשבים את המחיר הסופי בפועל, ורק אז משווים אותו למחיר ההתחלתי.":"The two percentages are calculated from different bases. Work out the actual final price, and only then compare it with the starting price.","שני הניצבים ידועים, ולכן מחברים ריבועים.":"Both legs are known, so add the squares.","שני השורשים נראים זרים זה לזה. מחפשים בכל אחד את הריבוע השלם שמסתתר בו.":"The two roots look unrelated. Look inside each one for the perfect square hiding in it.","שעות במהירות":"hours at a speed of","שתי דרכים — מחברים אותן":"Two ways — add them","שתי הטלות בלתי תלויות — מכפילים":"Two independent rolls — multiply","שתי נקודות מגדירות ישר אחד. ועל ציר ה-x כל הנקודות חולקות תכונה אחת — שווה לחשוב מהי.":"Two points define one line. And on the x-axis all the points share one property — worth thinking about what it is.","שתי קניות — שתי משוואות. מסמנים באות את מה שלא ידוע, ובסוף בודקים על מה בדיוק נשאלתם.":"Two purchase var DEMO={on:false,i:0,timer:null,extra:[],bar:null,txt:null,step:null,fill:null,btn:null};

/* עוזרים לתסריט. כולם מחזירים false כשהאיבר אינו על המסך, כדי
   שצעד שלא מצא את מה שחיפש ידלג ולא יפיל את ההדגמה כולה. */
function demoEl(s){return typeof s==="string"?document.querySelector(s):s}
function demoShow(s){
  var e=demoEl(s); if(!e)return false;
  try{e.scrollIntoView({behavior:"smooth",block:"center"})}catch(err){try{e.scrollIntoView()}catch(err2){}}
  return true;
}
/* מדגיש את האיבר, ורק אז לוחץ — צופה שלא ראה לאן נלחץ לא הבין
   מה קרה. לכן אין צעד קצר מ-1200 אלפיות בתסריטים. */
function demoTap(s){
  var e=demoEl(s); if(!e||e.disabled)return false;
  demoShow(e);
  e.classList.add("demo-tap");
  DEMO.extra.push(setTimeout(function(){
    e.classList.remove("demo-tap");
    /* המסך מצטייר מחדש כל הזמן. אם האיבר שסומן כבר אינו במסמך,

    var live=(typeof s==="string"&&!document.contains(e))?demoEl(s):e;
    if(DEMO.on&&live&&!live.disabled&&document.contains(live))try{live.click()}catch(err){}
  },430));
  return true;
}
function demoClick(s){
  var e=demoEl(s); if(!e||e.disabled)return false;
  try{e.click()}catch(err){return false}
  return true;
}
/* הקלדה אות אחר אות, עם אירוע input אמיתי — שדה חיפוש שמאזין
   ל-input לא היה מגיב להשמה ישירה ל-value. */
function demoType(s,text){
  var e=demoEl(s); if(!e)return false;
  demoShow(e); try{e.focus()}catch(err){}
  e.value=""; var i=0;

    if(i>=String(text).length)clearInterval(t);
  },85);
  DEMO.extra.push(t);
  return true;
}

    '<button id="demo-exit" type="button">יציאה · ESC</button></div>'+
    '<div id="demo-prog"><i></i></div></div>';
