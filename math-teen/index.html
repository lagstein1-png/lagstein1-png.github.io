<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>שלב — מתמטיקה לתיכון, צעד אחר צעד</title>
<meta name="description" content="תרגול מתמטיקה לתיכון לתלמידים שלומדים אחרת: כל שאלה עם פתרון מודרך צעד־צעד, זיהוי הטעות שעשית, דף נוסחאות והקראה קולית. 3, 4 ו-5 יחידות." />
<meta name="theme-color" content="#0e1117" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   שלב — מתמטיקה לתיכון
   עיצוב לגיל תיכון: נקי, בוגר, בלי חיות מחמד ובלי קונפטי.
   כל המידות ב-rem כדי שהגדלת טקסט תגדיל את הכול יחד.
   ============================================================ */
:root{
  --font:"Heebo","Rubik",system-ui,"Segoe UI",Arial,sans-serif;
  --bg:#f5f7fb; --surface:#ffffff; --surface2:#eef1f7;
  --ink:#101828; --muted:#5b6478; --faint:#8b93a7; --line:#e0e4ee;
  --accent:#4f46e5; --accent-ink:#ffffff; --accent-soft:#e9e8fd;
  /* צהוב ההדגשה — אותו צהוב של מקריא קולי, כדי שמעקב ההקראה
     ייראה אותו דבר בכל האתר. */
  --hit:#f5c451; --hit-ink:#1a1300;
  --cyan:#0e7490; --cyan-soft:#dcf3f8;
  --ok:#15803d; --ok-soft:#dcfce7; --bad:#be123c; --bad-soft:#ffe4e9;
  --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px -12px rgba(16,24,40,.18);
  --r:14px;
  /* צבע לכל תחום לימוד. זה לא קישוט — זה עוזר לזהות מיד באיזה
     סוג חומר מדובר, וזה בדיוק מה שעוזר למי שמתקשה להתמצא. */
  --c-base:#0d9488; --cs-base:#d2f4ef;
  --c-alg:#5b56e0;  --cs-alg:#e6e5fe;
  --c-geo:#b45309;  --cs-geo:#fbecd3;
  --c-data:#be185d; --cs-data:#fbdfeb;
}
:root[data-theme="dark"]{
  --bg:#0e1117; --surface:#161b26; --surface2:#1e2532;
  --ink:#e8ecf4; --muted:#9aa4ba; --faint:#6f7a91; --line:#28313f;
  --accent:#818cf8; --accent-ink:#0e1117; --accent-soft:#232842;
  --hit:#ffd24d; --hit-ink:#241a00;
  --cyan:#22d3ee; --cyan-soft:#132b33;
  --ok:#4ade80; --ok-soft:#132a1c; --bad:#fb7185; --bad-soft:#33161f;
  --warn:#fbbf24; --warn-soft:#33260f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  --c-base:#2dd4bf; --cs-base:#0f2e2b;
  --c-alg:#a5b4fc;  --cs-alg:#1e2140;
  --c-geo:#fbbf24;  --cs-geo:#33270f;
  --c-data:#f472b6; --cs-data:#33162a;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1117; --surface:#161b26; --surface2:#1e2532;
    --ink:#e8ecf4; --muted:#9aa4ba; --faint:#6f7a91; --line:#28313f;
    --accent:#818cf8; --accent-ink:#0e1117; --accent-soft:#232842;
    --hit:#ffd24d; --hit-ink:#241a00;
    --cyan:#22d3ee; --cyan-soft:#132b33;
    --ok:#4ade80; --ok-soft:#132a1c; --bad:#fb7185; --bad-soft:#33161f;
    --warn:#fbbf24; --warn-soft:#33260f;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  --c-base:#2dd4bf; --cs-base:#0f2e2b;
  --c-alg:#a5b4fc;  --cs-alg:#1e2140;
  --c-geo:#fbbf24;  --cs-geo:#33270f;
  --c-data:#f472b6; --cs-data:#33162a;
  }
}
/* ניגודיות גבוהה — שחור על לבן, מסגרות מלאות, בלי גוונים רכים */
:root.hc{
  --bg:#ffffff; --surface:#ffffff; --surface2:#ffffff;
  --ink:#000000; --muted:#1a1a1a; --faint:#333333; --line:#000000;
  --accent:#00308f; --accent-ink:#ffffff; --accent-soft:#e8edf8;
  --hit:#ffe600; --hit-ink:#000000;
  --cyan:#004b57; --cyan-soft:#e6f2f4;
  --ok:#0a5c2a; --ok-soft:#e6f4ea; --bad:#8c0f2c; --bad-soft:#fbe9ed;
  --warn:#6b3d00; --warn-soft:#f7efdf; --shadow:none;
  --c-base:#00308f; --cs-base:#e8edf8; --c-alg:#00308f; --cs-alg:#e8edf8;
  --c-geo:#00308f;  --cs-geo:#e8edf8;  --c-data:#00308f; --cs-data:#e8edf8;
}
:root.hc .card,:root.hc .opt,:root.hc .btn,:root.hc .chip,:root.hc .tile{border:2px solid #000}
:root.hc .deco{display:none}

*{box-sizing:border-box;margin:0}
html{font-size:100%}
html.ts2{font-size:112%}
html.ts3{font-size:126%}
/* פונט ברור לקריאה: Tahoma ו-Verdana קיימים כמעט בכל מכשיר וכוללים עברית */
html.clearfont{--font:Tahoma,Verdana,Arial,sans-serif}
/* ריווח מוגדל — עוזר לקוראים עם דיסלקציה */
html.spaced body{letter-spacing:.03em;word-spacing:.16em;line-height:1.95}
html.rm *,html.rm *::before,html.rm *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.65;
  -webkit-text-size-adjust:100%;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:inherit}
input,select,textarea{font:inherit;color:var(--ink)}
a{color:var(--accent)}
::selection{background:var(--accent);color:var(--accent-ink)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---------- שלד ---------- */
#app{min-height:100vh;display:flex;flex-direction:column}
/* בלי זה כרום מותח כל מסך לרוחב המינימלי של התוכן שלו והעמוד גולש בטלפון */
#app>*{min-width:0;width:100%}
.wrap{max-width:1120px;margin:0 auto;padding:0 clamp(12px,4vw,22px)}
.deco{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.85;
  background:
    radial-gradient(760px 380px at 92% -6%,var(--cs-alg),transparent 62%),
    radial-gradient(620px 340px at 2% 18%,var(--cs-data),transparent 58%),
    radial-gradient(700px 380px at 10% 102%,var(--cs-base),transparent 60%),
    radial-gradient(520px 300px at 96% 78%,var(--cs-geo),transparent 58%)}
#app{position:relative;z-index:1}

/* ---------- כותרת עליונה ---------- */
header{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:10px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand .mk{width:38px;height:38px;border-radius:11px;
  background:linear-gradient(140deg,var(--c-alg),var(--c-data) 55%,var(--c-geo));color:#fff;
  display:grid;place-items:center;font-weight:800;font-size:1.05rem;flex-shrink:0}
:root.hc .brand .mk{background:var(--ink)}
.brand b{display:block;font-size:1rem;line-height:1.15;font-weight:800}
.brand small{display:block;color:var(--muted);font-size:.72rem;font-weight:500}
nav{display:flex;gap:4px;margin-inline-start:auto;flex-wrap:wrap}
.nb{display:inline-flex;align-items:center;gap:6px;border-radius:10px;padding:8px 12px;
  font-size:.9rem;font-weight:600;color:var(--muted);border:1px solid transparent;transition:.15s}
.nb:hover{background:var(--surface2);color:var(--ink)}
.nb.on{background:var(--accent);color:#fff}
:root.hc .nb.on{background:var(--ink);color:var(--bg)}
.nb svg{flex-shrink:0}
@media(max-width:560px){.nb span{display:none}.nb{padding:9px 11px}}

/* ---------- רכיבי בסיס ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:clamp(14px,3.4vw,22px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:11px;
  font-weight:700;padding:12px 18px;transition:.15s;border:1px solid transparent;line-height:1.3}
.btn-p{background:linear-gradient(135deg,var(--accent),var(--c-data));color:#fff}
.btn-p:hover{filter:brightness(1.1)}
:root.hc .btn-p{background:var(--accent)}
.btn-d{background:var(--ink);color:var(--bg)}
.btn-g{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-g:hover{background:var(--surface2)}
.btn[disabled]{opacity:.42;cursor:not-allowed}
.btn.w{width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;
  font-size:.82rem;font-weight:600;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.chip.a{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.h1{font-size:clamp(1.5rem,5.2vw,2.05rem);font-weight:800;line-height:1.2;overflow-wrap:anywhere}
.h2{font-size:clamp(1.1rem,3.6vw,1.3rem);font-weight:700;overflow-wrap:anywhere}
.sub{color:var(--muted);margin-top:5px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.sm{font-size:.85rem}
.xs{font-size:.76rem}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
/* רשימת הקולות: שתי עמודות רק כשבאמת יש מקום, אחרת השמות נקטעים */
.vgrid{grid-template-columns:repeat(auto-fit,minmax(min(100%,215px),1fr));gap:8px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
hr.sep{border:none;border-top:1px solid var(--line);margin:16px 0}

/* ---------- מתמטיקה: תמיד משמאל לימין, מבודד מהעברית ---------- */
.m{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums}
.mline{direction:ltr;unicode-bidi:isolate;text-align:center;font-weight:700;
  font-size:clamp(1.55rem,7vw,2.5rem);letter-spacing:.01em;line-height:1.35;overflow-wrap:anywhere}
.mstep{direction:ltr;unicode-bidi:isolate;text-align:center;font-weight:700;
  font-size:clamp(1.05rem,4.6vw,1.35rem);background:var(--surface2);border-radius:10px;
  padding:9px 12px;margin-top:8px;overflow-wrap:anywhere}
sup{font-size:.62em;vertical-align:super;line-height:0}
sub{font-size:.62em;vertical-align:sub;line-height:0}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;
  line-height:1.05;margin:0 .18em;font-size:.86em}
.frac>span:first-child{border-bottom:.09em solid currentColor;padding:0 .22em}
.frac>span:last-child{padding:0 .22em}

/* ---------- תשובות ---------- */
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
@media(max-width:430px){.opts{grid-template-columns:minmax(0,1fr)}}
.opt{position:relative;border:2px solid var(--line);background:var(--surface);border-radius:12px;
  padding:15px 14px 15px 44px;font-weight:700;font-size:clamp(1rem,4vw,1.2rem);transition:.14s;min-height:58px;
  display:flex;align-items:center;gap:10px}
[dir="rtl"] .opt{padding:15px 44px 15px 14px}
.opt:hover:not([disabled]){border-color:var(--c,var(--accent));background:var(--cs,var(--accent-soft))}
.opt .k{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);
  width:24px;height:24px;border-radius:7px;background:var(--cs,var(--surface2));color:var(--c,var(--faint));
  display:grid;place-items:center;font-size:.76rem;font-weight:700}
/* currentColor כאן היה נפתר לצבע שנקבע באותה הצהרה עצמה,
   ולכן הרקע והטקסט יצאו זהים והספרה נעלמה. */
.opt.right .k{background:var(--ok);color:var(--surface)}
.opt.wrong .k{background:var(--bad);color:var(--surface)}
.opt.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
/* בחירה במבחן היא בחירה, לא תשובה נכונה. במסכי התרגול הצבע
   הירוק אומר "צדקת", ובמבחן אסור לו להופיע כלל — הוא נותן
   משוב שגוי לכל בחירה. ניטרלי, ורק מסמן מה סומן. */
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.opt.dim{opacity:.4}
.opt.gone{opacity:.35;text-decoration:line-through}

/* ---------- פתרון מודרך ---------- */
.steps{margin-top:16px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.step{padding:13px 15px;border-top:1px solid var(--line);background:var(--surface)}
.step:first-child{border-top:none}
.step.future{display:none}
.step .st{display:flex;align-items:center;gap:9px;font-weight:700;font-size:.95rem}
.step .num{width:23px;height:23px;border-radius:50%;background:var(--c,var(--accent));color:#fff;
  display:grid;place-items:center;font-size:.76rem;flex-shrink:0;font-weight:700}
.step .sd{color:var(--muted);font-size:.92rem;margin-top:4px;overflow-wrap:anywhere}
.step.last{background:var(--ok-soft)}
.step.last .num{background:var(--ok);color:var(--surface)}

/* ---------- פירוט טעות ---------- */
.diag{margin-top:14px;border-inline-start:4px solid var(--bad);background:var(--bad-soft);
  border-radius:0 10px 10px 0;padding:12px 15px}
[dir="rtl"] .diag{border-radius:10px 0 0 10px}
.diag b{color:var(--bad)}
.hintbox{margin-top:14px;border-inline-start:4px solid var(--warn);background:var(--warn-soft);
  border-radius:0 10px 10px 0;padding:12px 15px}
.wd{border-radius:5px;padding:1px 3px}
.wd.hit{background:var(--hit);color:var(--hit-ink);font-weight:600}
[dir="rtl"] .hintbox{border-radius:10px 0 0 10px}

/* ---------- מדדים ---------- */
.bar{height:7px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s,background .3s}
.bar.ok>i{background:var(--ok)}
.bar.mid>i{background:var(--warn)}
.bar.low>i{background:var(--bad)}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--surface2);border:1px solid var(--line)}
.dot.ok{background:var(--ok);border-color:var(--ok)}
.dot.no{background:var(--bad);border-color:var(--bad)}
.dot.hp{background:var(--warn);border-color:var(--warn)}
.tile{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--c,var(--accent));
  border-radius:12px;padding:14px;box-shadow:var(--shadow)}
.tile b{display:block;font-size:1.7rem;font-weight:800;line-height:1.2;color:var(--c,var(--ink))}
.tile span{color:var(--muted);font-size:.82rem}

/* ---------- כרטיס נושא ---------- */
.tpc{position:relative;display:flex;flex-direction:column;gap:9px;text-align:start;background:var(--surface);
  border:1px solid var(--line);border-inline-start:4px solid var(--c,var(--accent));
  border-radius:12px;padding:14px;transition:.15s;box-shadow:var(--shadow);min-width:0}
.tpc:hover{border-color:var(--c,var(--accent));transform:translateY(-2px);box-shadow:0 8px 22px -12px var(--c)}
.tpc:hover{border-inline-start-color:var(--c,var(--accent))}
.tpc.on{border-color:var(--c,var(--accent));background:var(--cs,var(--accent-soft))}
.tpc .tn{color:var(--c,var(--ink))}
.tpc .tn{font-weight:700;font-size:.98rem;overflow-wrap:anywhere}
.tpc .td{color:var(--muted);font-size:.8rem;overflow-wrap:anywhere}
.tpc .tm{display:flex;align-items:center;gap:7px;font-size:.74rem;color:var(--faint)}
.tpc .tm .bar{flex:1;min-width:0}

/* ---------- מתגים והגדרות ---------- */
.tog{display:flex;align-items:center;gap:13px;width:100%;text-align:start;background:var(--surface2);
  border:1px solid transparent;border-radius:12px;padding:13px 15px;transition:.15s;min-width:0}
.tog:hover{border-color:var(--line)}
.tog+.tog{margin-top:9px}
.tog .tt{flex:1;min-width:0}
.tog .tt b{display:block;font-size:.97rem;overflow-wrap:anywhere}
.tog .tt span{display:block;color:var(--muted);font-size:.82rem;overflow-wrap:anywhere}
.sw{position:relative;width:46px;height:27px;border-radius:99px;background:var(--line);flex-shrink:0;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:21px;height:21px;border-radius:50%;
  background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .2s}
.tog[aria-checked="true"] .sw{background:var(--accent)}
.tog[aria-checked="true"] .sw::after{transform:translateX(-19px)}
[dir="ltr"] .tog[aria-checked="true"] .sw::after{transform:translateX(19px)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 auto;min-width:0;border:1px solid var(--line);background:var(--surface);
  border-radius:10px;padding:10px 12px;font-weight:600;font-size:.9rem;color:var(--muted);transition:.15s}
.seg button.on{background:var(--c,var(--ink));color:#fff;border-color:transparent}
:root.hc .seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--accent)}
.field{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:11px;
  padding:12px 14px;font-size:1rem;outline:none}
.field:focus{border-color:var(--accent)}

/* ---------- דף נוסחאות ---------- */
.a-base{--c:var(--c-base);--cs:var(--cs-base)}
.a-alg{--c:var(--c-alg);--cs:var(--cs-alg)}
.a-geo{--c:var(--c-geo);--cs:var(--cs-geo)}
.a-data{--c:var(--c-data);--cs:var(--cs-data)}
.chip.area{background:var(--cs);color:var(--c);border-color:transparent}
.arh{display:flex;align-items:center;gap:9px}
.arh::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c);flex-shrink:0}
.fcard{background:var(--surface);border:1px solid var(--line);border-inline-start:4px solid var(--c,var(--line));
  border-radius:12px;padding:13px 15px;min-width:0}
.fcard .fm{color:var(--c,var(--ink))}
.fcard .ft{font-weight:700;font-size:.93rem}
.fcard .fm{margin-top:7px;font-size:1.05rem}
.fcard .fn{color:var(--muted);font-size:.82rem;margin-top:6px;overflow-wrap:anywhere}

/* ---------- שורת מצב הקול ---------- */
.vstrip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;
  padding:9px 13px;border-radius:11px;font-size:.86rem;font-weight:600;line-height:1.5}
.vstrip>span{flex:1;min-width:0}
.vstrip .btn{padding:6px 12px;font-size:.8rem;background:var(--surface);border-color:currentColor}
.vstrip.ok{background:var(--ok-soft);color:var(--ok)}
.vstrip.warn{background:var(--warn-soft);color:var(--warn)}
.vstrip.bad{background:var(--bad-soft);color:var(--bad)}
.vstrip svg{flex-shrink:0}

/* ---------- שכבות ---------- */

/* ============================================================
   2. עזרי מתמטיקה — שברים, מספרים, ביטויים

function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t}return a||1}
function lcm(a,b){return Math.abs(a*b)/gcd(a,b)}

/* שבר מצומצם. den תמיד חיובי, הסימן יושב במונה. */
function Fr(n,d){
  if(d===undefined)d=1;
  if(d===0)d=1;
  if(d<0){n=-n;d=-d}
  var g=gcd(n,d);
  this.n=n/g;this.d=d/g;
}
Fr.prototype.add=function(o){return new Fr(this.n*o.d+o.n*this.d,this.d*o.d)};
Fr.prototype.sub=function(o){return new Fr(this.n*o.d-o.n*this.d,this.d*o.d)};
Fr.prototype.mul=function(o){return new Fr(this.n*o.n,this.d*o.d)};
Fr.prototype.div=function(o){return new Fr(this.n*o.d,this.d*o.n)};
Fr.prototype.isInt=function(){return this.d===1};
Fr.prototype.val=function(){return this.n/this.d};
Fr.prototype.eq=function(o){return this.n===o.n&&this.d===o.d};
/* טקסט פשוט — להקראה ולהשוואה */
Fr.prototype.txt=function(){return this.d===1?String(this.n):(this.n+"/"+this.d)};
/* HTML — שבר אמיתי עם קו אופקי, קריא הרבה יותר לתלמיד שמתקשה */
Fr.prototype.html=function(){
  if(this.d===1)return String(this.n);
  var sign=this.n<0?"−":"";
  return sign+'<span class="frac"><span>'+Math.abs(this.n)+'</span><span>'+this.d+'</span></span>';
};
Fr.prototype.say=function(){
  if(this.d===1)return String(this.n);
  return (this.n<0?"מינוס ":"")+Math.abs(this.n)+" חלקי "+this.d;
};
function fr(n,d){return new Fr(n,d)}
/* הצגה בלי צמצום. שלב ההרחבה למכנה משותף חייב להראות את 10/15,
   ולא את 2/3 שאליו הוא מצטמצם. */
function rawFr(n,d){
  if(d===1)return String(n);

}

/* מספר לתצוגה: מינוס טיפוגרפי, בלי אפסים מיותרים אחרי הנקודה */
function r2(v){return Math.round(v*100)/100}
function num(v){
  if(typeof v!=="number")return String(v);
  var s=(Math.round(v*1e6)/1e6).toString();
  return s.replace(/^-/,"−");
}
function say(v){return String(v).replace(/−/g,"מינוס ").replace(/·/g," כפול ")}

/* " + 5" / " − 5" — לחיבור איברים בביטוי */
function sgn(v){return (v<0?" − ":" + ")+Math.abs(v)}
/* מקדם לפני משתנה: 1x -> x, -1x -> -x */
function coef(c,v){
  if(c===1)return v;
  if(c===-1)return "−"+v;
  return num(c)+v;
}
/* מקדם שמופיע לפני סוגריים. 1 לא נכתב, ו-−1 נכתב כמינוס בלבד. */
function fac(c){return c===1?"":c===-1?"−":num(c)}
/* איבר עם סימן, לשרשור בתוך ביטוי: " + 3x" / " − x" */
function term(c,v){
  if(c===0)return "";
  var s=c<0?" − ":" + ",a=Math.abs(c);
  return s+(a===1?v:a+v);
}
/* חזקה */
function pw(base,e){
  if(e===1)return base;
  if(e===0)return "1";
  return base+"<sup>"+num(e)+"</sup>";
}
/* פולינום ריבועי מהמקדמים */
function quadStr(a,b,c,v){
  v=v||"x";
  var s=(a===1?"":a===-1?"−":num(a))+v+"<sup>2</sup>";
  s+=term(b,v);
  if(c!==0)s+=sgn(c);
  return s;
}
/* שורש: מציג √50 = 5√2 */
function simpRoot(n){
  var out=1,i;
  for(i=Math.floor(Math.sqrt(n));i>=2;i--){ if(n%(i*i)===0){out=i;n=n/(i*i);break} }
  return {out:out,in:n};
}
function rootHtml(o){
  if(o.in===1)return String(o.out);
  return (o.out===1?"":o.out)+"√"+o.in;
}

var BUILD="t18 · 2026-08-29";
var KEY="shlav-state-v1";

function blankState(){
  return {
    v:1,
    name:"",
    track:4,                 /* 3 / 4 / 5 יחידות — קובע אילו נושאים מוצעים */
    level:2,                 /* 1 בסיס · 2 רגיל · 3 מאתגר */

    mastery:{},              /* לכל נושא: {seen,ok,help,m} כאשר m הוא 0..100 */
    stats:{answered:0,correct:0,helped:0,xp:0,streakDays:0,lastDay:"",rounds:0},
    days:{},
    wrongBank:[],            /* נושאים שנפלו בהם — חוזרים לתרגול */
    settings:{theme:"auto",ts:1,clearfont:false,spaced:false,hc:false,rm:false,
              calm:false,tts:true,rate:0.95,engine:"device",gvoice:"Kore",voice:"",
              roundLen:8,keys:true,autoSteps:false}
  };
}
var state=blankState();

function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(!raw)return false;
    var s=JSON.parse(raw);
    if(!s||typeof s!=="object")return false;
    var base=blankState(),k;
    for(k in base)if(!(k in s))s[k]=base[k];
    for(k in base.settings)if(!(k in s.settings))s.settings[k]=base.settings[k];
    for(k in base.stats)if(!(k in s.stats))s.stats[k]=base.stats[k];
    state=s;
    return true;
  }catch(e){return false}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}

/* רצף ימים — נספר רק כשבאמת תרגלו, ובמצב רגוע לא מוצג בכלל */
function touchDay(){
  var d=todayIso(),st=state.stats;
  if(st.lastDay===d)return;
  if(st.lastDay&&daysBetween(st.lastDay,d)===1)st.streakDays++;
  else st.streakDays=1;
  st.lastDay=d;
}
function dayRec(){
  var d=todayIso();
  if(!state.days[d])state.days[d]={a:0,c:0};
  return state.days[d];
}

  var h=document.documentElement,s=state.settings;

function voices(){try{return window.speechSynthesis?speechSynthesis.getVoices():[]}catch(e){return[]}}
/* הקולות נטענים אסינכרונית, ורק אז נורה voiceschanged. מי שמקריא
   לפני כן מקבל את ברירת המחדל של הדפדפן — לרוב קול אנגלי, גם כשמותקן
   קול עברי טוב. onvoiceschanged לבדו אינו פתרון: הוא מרענן תפריט,
   הוא לא מעכב את האמירה הראשונה. */
var _voicesP=null;
function voicesReady(){
  if(_voicesP)return _voicesP;
  _voicesP=new Promise(function(done){
    if(!("speechSynthesis" in window)){done();return}
    if(voices().length){done();return}
    var poll=null,cap=null,fired=false;
    function finish(){
      if(fired)return; fired=true;
      clearInterval(poll); clearTimeout(cap);
      try{speechSynthesis.removeEventListener("voiceschanged",finish)}catch(e){}
      done();
    }
    try{speechSynthesis.addEventListener("voiceschanged",finish)}catch(e){}
    /* Safari לא תמיד יורה את האירוע — לכן גם דגימה */
    poll=setInterval(function(){if(voices().length)finish()},120);
    /* תקרה: יש מכשירים שמחזירים רשימה ריקה לצמיתות ומדברים מצוין.
       עדיף לדבר בקול ברירת מחדל מאשר לשתוק לנצח. */
    cap=setTimeout(finish,4000);
  });
  return _voicesP;
}
function hebVoices(){return voices().filter(function(v){return /^(he|iw)/i.test(v.lang||"")})}
/* עברית קודם, ואחריה כל השאר — כדי שתמיד תהיה רשימה לבחור ממנה */
function pickList(){
  var he=hebVoices(),rest=voices().filter(function(v){return he.indexOf(v)<0});
  return he.concat(rest);
}
/* אין שדה מגדר ב-Web Speech API. השם הוא הרמז היחיד, ולכן אלה

      u.onboundary=function(e){if(!e.name||e.name==="word")hlAt(seg.start+e.charIndex)};
      u.onend=function(){
        if(k+1<_segs.length) setTimeout(function(){sayseg(k+1)},SEG_GAP);
        else { hlClear(); ttsOK() }

}
function speak(text){
  if(!state.settings.tts||!text)return;
  /* כל טקסט שמגיע להקראה מנוקה מתגיות. חלק מהקריאות כבר מנקות
     לבד, וניקוי חוזר אינו משנה דבר — אבל בלעדיו כל מחרוזת שנשארה
     עם <sub> או <span class="frac"> הוקראה בקול כתגית: הסטודנט
     שמע "span class frac" באמצע השאלה. */
  text=plainOf(String(text));
  stopSpeak();
  if(voiceMode()!=="gemini"){
    if(ttsState!=="device"){ttsState="device"}
    speakDevice(text);return;
  }
  var name=state.settings.gvoice||"Kore",rate=state.settings.rate;
  var ck=name+"|"+rate.toFixed(2)+"|"+text;
  function play(url){
    gStop();
    /* משתמשים באלמנט ששוחרר במגע ולא יוצרים חדש. */
    if(!GEL)GEL=new Audio();
    gAudio=GEL; gAudio.src=url;
    gAudio.play().catch(function(){speakDevice(text)});
  }
  if(gCache[ck]){play(gCache[ck]);return}
  gSynth(text,name,rate).then(function(url){
    gCache[ck]=url;ttsErr="";
    if(ttsState!=="ok"){ttsState="ok";if(view==="practice")render()}
    play(url);
  }).catch(function(e){
    /* נופלים חזרה לקול המכשיר במקום להשתתק, ורושמים למה — כדי
       שמסך ההגדרות יוכל להראות את הסיבה במקום "לא עובד". */
    ttsErr=String(e&&e.message||e);
    if(/\b(400|401|403)\b|blocked|permission|API key|not valid/i.test(ttsErr))gDead=true;
    ttsState="err";
    speakDevice(text);
    render();
  });
}
function stopSpeak(){
  gStop();
  hlClear();
  try{if(window.speechSynthesis)speechSynthesis.cancel()}catch(e){}
}
/* עוזבים את הדף — הקול נעצר. בלעדיו הוא ממשיך ברקע אחרי מעבר לטאב
   אחר, ולפעמים נתקע עד סגירת הדפדפן. */
try{document.addEventListener("visibilitychange",function(){

});}catch(e){}
/* iOS לא ישמיע כלום עד שאמירה אחת יצאה מתוך handler של מגע אמיתי.
   אמירה אוטומטית בטעינת הדף נבלעת בשקט — בלי חריגה, בלי לוג, בלי
   דרך לדעת. משחררים פעם אחת עם אמירה ריקה.
   חשוב: קריאה ישירה, בלי voicesReady — הבטחה שוברת את שרשרת המגע

  try{
    if(!GEL)GEL=new Audio();

    var pr=GEL.play();
    if(pr&&pr.then)pr.then(function(){try{GEL.pause();GEL.currentTime=0}catch(e){}},function(){});
  }catch(e){}
},{once:true});}catch(e){}

/* ============================================================
   7. מ-HTML לטקסט מדובר
   המחוללים כותבים את המתמטיקה כ-HTML (שברים אמיתיים, חזקות
   מוגבהות). הפונקציות כאן הופכות אותו לטקסט פשוט להשוואה,
   ומשם לעברית מדוברת להקראה.
   ============================================================ */
function plainOf(html){
  var s=String(html);
  s=s.replace(/<span class="frac"><span>(.*?)<\/span><span>(.*?)<\/span><\/span>/g,"($1)/($2)");
  s=s.replace(/<sup>(.*?)<\/sup>/g,"^$1");
  s=s.replace(/<sub>(.*?)<\/sub>/g,"_$1");
  s=s.replace(/<br\s*\/?>/g," ");
  s=s.replace(/<[^>]+>/g,"");
  s=s.replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"');
  return s.replace(/\s+/g," ").trim();
}
/* מ-״3x + 5 = 20״ ל-״שלוש איקס ועוד חמש שווה עשרים״.
   הסדר כאן חשוב: קודם מבנים מורכבים (שברים, חזקות, שורשים),
   ורק אחר כך סימנים בודדים ואותיות. */
var SAY_MAP=[
  /* שבר שהגיע מ-plainOf בצורה (3)/(4) */
  [/\(([^()]{1,14})\)\s*\/\s*\(([^()]{1,14})\)/g,"$1 חלקי $2"],
  /* שמות פונקציות לפני מיפוי אותיות בודדות */
  [/\bsin/gi," סינוס "],[/\bcos/gi," קוסינוס "],[/\btan/gi," טנגנס "],
  /* חזקות */
  [/\^2\b/g," בריבוע "],[/\^3\b/g," בשלישית "],[/\^\(?([−–-]?\d+)\)?/g," בחזקת $1 "],
  [/²/g," בריבוע "],[/³/g," בשלישית "],
  /* אינדקסים תחתונים: a₁ , aₙ , Sₙ */
  [/₁/g," אחת "],[/₂/g," שתיים "],[/₃/g," שלוש "],[/ₙ/g," אן "],
  /* שורש */
  [/(\d)\s*√/g,"$1 כפול √"],[/√/g," שורש של "],
  /* סימנים מיוחדים */
  [/π/g," פאי "],[/°/g," מעלות "],[/α/g," אלפא "],[/β/g," בטא "],[/Δ/g," דלתא "],
  [/≈/g," בערך "],[/≠/g," לא שווה "],[/≤/g," קטן או שווה "],[/≥/g," גדול או שווה "],
  [/→/g," ולכן "],
  /* יחס — רק בין מספרים או x, כדי לא לפגוע בנקודתיים בעברית */
  [/([\dx])\s*:\s*([\dx])/g,"$1 ל $2"],
  /* השוואה */
  [/=/g," שווה "],[/</g," קטן מ "],[/>/g," גדול מ "],
  /* כפל מרומז: 3(x+2) וגם (x+1)(x+2) */
  [/(\d)\s*\(/g,"$1 כפול ("],[/\)\s*\(/g,") כפול ("],
  /* פעולות */
  [/\+/g," ועוד "],[/[−–-]/g," מינוס "],[/[×·]/g," כפול "],[/÷/g," חלקי "],
  [/\//g," חלקי "],[/%/g," אחוז "],
  /* מפרידים בין מספר לאות, כדי שגבול־מילה יעבוד על האות */
  [/(\d)([a-zA-Z])/g,"$1 $2"],
  /* אותיות בודדות בשמן העברי */
  /* שמות האותיות בלי ניקוד — חלק ממנועי ההקראה מועדים עליו.
     איפה שלאות יש משמעות קבועה בנוסחה, אומרים את המשמעות. */
  [/\bx\b/g," איקס "],[/\by\b/g," וואי "],[/\bn\b/g," אן "],[/\bd\b/g," די "],
  [/\bm\b/g," שיפוע "],[/\ba\b/g," איי "],[/\bb\b/g," בי "],[/\bc\b/g," סי "],
  [/\bh\b/g," גובה "],[/\br\b/g," רדיוס "],[/\bt\b/g," זמן "],[/\bv\b/g," מהירות "],
  [/\bS\b/g," שטח "],[/\bP\b/g," היקף "],
  /* סוגריים: "בסוגריים" לפתיחה, ופסיק לסגירה. הניסוח הקודם,
     "סוגריים ... סוף סוגריים", הפך כל ביטוי קצר לנאום. */
  [/\(/g," בסוגריים "],[/\)/g," , "]
];
function speakMath(plain){
  var s=" "+String(plain)+" ",i;
  for(i=0;i<SAY_MAP.length;i++)s=s.replace(SAY_MAP[i][0],SAY_MAP[i][1]);
  return s.replace(/\s+/g," ").trim();
}
/* טקסט הסבר הוא עברית רגילה שמשובצים בה סימנים בודדים. כאן מתרגמים
   רק את מה שחד־משמעי — מקף בעברית הוא מקף, לא מינוס. */
var PROSE_MAP=[
  [/²/g," בריבוע "],[/³/g," בשלישית "],[/₁/g," אחת "],[/₂/g," שתיים "],[/ₙ/g," אן "],
  /* מעריכים מוגבהים ביוניקוד, כמו x⁻ᵃ */
  [/⁻/g," מינוס "],[/⁺/g," ועוד "],[/ᵃ/g," איי "],[/ᵇ/g," בי "],[/⁰/g," אפס "],[/¹/g," אחת "],
  [/√/g," שורש של "],[/π/g," פאי "],[/°/g," מעלות "],[/Δ/g," דלתא "],
  [/α/g," אלפא "],[/[×·]/g," כפול "],[/÷/g," חלקי "],[/≈/g," בערך "],
  /* מינוס טיפוגרפי ו-en dash לא מופיעים בעברית, ולכן בטוח לתרגם.
     מקף רגיל נשאר מקף — "ה-3" הוא לא חיסור. */
  [/[−–]/g," מינוס "],[/=/g," שווה "],[/\+/g," ועוד "],[/\//g," חלקי "],
  [/\bsin/gi," סינוס "],[/\bcos/gi," קוסינוס "],[/\btan/gi," טנגנס "]

function speakProse(t){
  var s=String(t||""),i;
  for(i=0;i<PROSE_MAP.length;i++)s=s.replace(PROSE_MAP[i][0],PROSE_MAP[i][1]);

/* ============================================================
   8. עזרי בנייה למחוללים
   ============================================================ */
function S(t,d,m){return {t:t,d:d||"",m:m||""}}         /* צעד בפתרון */
function W(h,why){return {h:String(h),why:why||""}}      /* מסיח + הטעות שהוא מייצג */

/* ============================================================
   9. מחוללי השאלות — היסודות
   כל מחולל מחזיר שאלה שלמה: ניסוח, תשובה, מסיחים שכל אחד
   מהם הוא טעות אמיתית שתלמידים עושים, ופתרון מלא צעד־צעד.
   ============================================================ */

/* --- מספר בסוגריים כשהוא שלילי, כמו שכותבים במחברת --- */
function pn(v){return v<0?"("+num(v)+")":String(v)}

/* ---------- 1. מספרים מכוונים ---------- */
function genNeg(L){
  var a,b,c,res,expr,steps,wrong;
  if(L===1){
    a=rnz(-20,20);b=rnz(-20,20);
    /* בלי מינוס אחד לפחות אין כאן שאלה על מספרים מכוונים,
       וגם המסיחים קורסים כי כולם מתלכדים עם התשובה. */
    while(a>0&&b>0)b=rnz(-20,-1);
    var op=pick(["+","−"]);
    res=op==="+"?a+b:a-b;
    expr=num(a)+" "+op+" "+pn(b);
    var eff=op==="+"?b:-b;
    steps=[
      S("כותבים את זה כחיבור אחד",
        op==="−"?"חיסור של מספר זה חיבור של ההפך שלו. מינוס ומינוס נותנים פלוס.":"כבר יש כאן חיבור.",
        num(a)+" + "+pn(eff)),
      S((a<0)===(eff<0)?"אותו סימן — מחברים":"סימנים שונים — מחסרים",
        (a<0)===(eff<0)
          ? "שני המספרים לאותו כיוון, אז מחברים את הגדלים ושומרים על הסימן."
          : "המספרים לכיוונים הפוכים, אז מחסרים את הקטן מהגדול והתוצאה מקבלת את הסימן של הגדול.",
        (a<0)===(eff<0)
          ? Math.abs(a)+" + "+Math.abs(eff)+" = "+(Math.abs(a)+Math.abs(eff))
          : Math.max(Math.abs(a),Math.abs(eff))+" − "+Math.min(Math.abs(a),Math.abs(eff))+" = "+Math.abs(res)),
      S("התשובה","",num(a)+" "+op+" "+pn(b)+" = "+num(res))
    ];
    wrong=[
      W(num(-res),"הפכתם את הסימן של התוצאה. שווה לבדוק שוב איזה מהמספרים גדול יותר בערכו המוחלט."),
      W(num(a+Math.abs(b)),"התעלמתם מהמינוס של המספר השני והתייחסתם אליו כאילו הוא חיובי."),
      W(num(Math.abs(a)+Math.abs(b)),"חיברתם את הגדלים בלי להתחשב בסימנים בכלל."),
      W(num(Math.abs(a)-Math.abs(b)),"חיסרתם את הגדלים והתעלמתם מהסימנים.")
    ];
    return {ask:"חשבו",expr:expr,ans:W(num(res)),wrong:wrong,steps:steps,rule:"neg",
      hint:"חיסור זה חיבור של ההפך. אחרי זה שאלו: שני המספרים לאותו כיוון או לכיוונים הפוכים?"};
  }
  if(L===2){
    var mulMode=Math.random()<0.5;
    if(mulMode){
      a=rnz(-12,12);b=rnz(-12,12);res=a*b;
      expr=pn(a)+" × "+pn(b);
      steps=[
        S("קודם הגודל","מכפילים את המספרים בלי הסימנים.",Math.abs(a)+" × "+Math.abs(b)+" = "+Math.abs(res)),
        S("עכשיו הסימן",
          (a<0)===(b<0)?"שני סימנים זהים — התוצאה חיובית.":"סימן אחד שלילי — התוצאה שלילית.",
          "התוצאה: "+num(res)),
        S("התשובה","",expr+" = "+num(res))
      ];
    }else{
      b=rnz(-12,12);res=rnz(-12,12);a=b*res;
      expr=pn(a)+" ÷ "+pn(b);
      steps=[
        S("קודם הגודל","מחלקים בלי הסימנים.",Math.abs(a)+" ÷ "+Math.abs(b)+" = "+Math.abs(res)),
        S("עכשיו הסימן",
          (a<0)===(b<0)?"שני סימנים זהים — התוצאה חיובית.":"סימן אחד שלילי — התוצאה שלילית.",
          "התוצאה: "+num(res)),
        S("התשובה","",expr+" = "+num(res))
      ];
    }
    /* מסיחים: טעות סימן, בלבול בפעולה, סימן שנלקח רק מהמספר הראשון,
       ולבסוף קירוב שגוי — כדי שתמיד יישארו שלושה נבדלים. */
    wrong=[
      W(num(-res),"הסימן התהפך. הכלל: שני סימנים זהים נותנים פלוס, סימנים שונים נותנים מינוס."),
      W(num(mulMode?a+b:a*b),mulMode?"חיברתם במקום להכפיל.":"הכפלתם במקום לחלק."),
      W(num((a<0?-1:1)*Math.abs(res)),"לקחתם את הסימן מהמספר הראשון בלבד. בכפל ובחילוק שני הסימנים משתתפים."),
      W(num(-(mulMode?a+b:a*b)),mulMode?"חיברתם במקום להכפיל, וגם הסימן יצא הפוך.":"הכפלתם במקום לחלק, וגם הסימן יצא הפוך."),
      W(num(res+(res>0?1:-1)*Math.abs(mulMode?a:b)),"טעות בגודל המכפלה. שווה לחשב שוב בלי הסימנים ורק אז להוסיף אותם.")
    ];
    return {ask:"חשבו",expr:expr,ans:W(num(res)),wrong:wrong,steps:steps,rule:"neg",
      hint:"בכפל ובחילוק הסימן נקבע לבד: זהים → פלוס, שונים → מינוס."};
  }
  a=rnz(-12,12);b=rnz(-9,9);c=rnz(-9,9);
  res=a+b*c;
  expr=num(a)+" + "+pn(b)+" × "+pn(c);
  steps=[
    S("קודם כפל","בסדר פעולות החשבון כפל וחילוק קודמים לחיבור וחיסור.",pn(b)+" × "+pn(c)+" = "+num(b*c)),
    S("עכשיו החיבור","מציבים בחזרה ומחברים.",num(a)+" + "+pn(b*c)+" = "+num(res)),
    S("התשובה","",expr+" = "+num(res))
  ];
  wrong=[
    W(num((a+b)*c),"חישבתם משמאל לימין. כפל תמיד קודם לחיבור, גם אם הוא כתוב אחריו."),
    W(num(a+Math.abs(b*c)),"איבדתם את הסימן של המכפלה."),
    W(num(a-b*c),"החלפתם את סימן המכפלה בשלב החיבור.")
  ];
  return {ask:"חשבו",expr:expr,ans:W(num(res)),wrong:wrong,steps:steps,rule:"order",
    hint:"סדר פעולות: קודם כפל וחילוק, ורק אחר כך חיבור וחיסור."};
}

/* ---------- 2. פתיחת סוגריים וכינוס איברים ---------- */
function genExpand(L){
  var a,b,c,d,steps,wrong,expr,ansH;
  if(L===1){
    a=rnz(-8,8);b=rnz(-9,9);
    expr=fac(a)+"(x"+sgn(b)+")";
    ansH=coef(a,"x")+sgn(a*b);
    steps=[
      S("מכפילים את המספר שבחוץ בכל איבר בפנים","הסוגריים אומרים: כל מה שבפנים מוכפל במה שבחוץ. בלי לדלג על האיבר השני.",
        num(a)+"·x "+(a*b<0?"−":"+")+" "+Math.abs(a)+"·"+Math.abs(b)),
      S("מחשבים כל מכפלה","",coef(a,"x")+sgn(a*b)),
      S("התשובה","",expr+" = "+coef(a,"x")+sgn(a*b))
    ];
    wrong=[
      W(coef(a,"x")+sgn(b),"הכפלתם רק את ה-x ושכחתם להכפיל גם את המספר השני שבסוגריים."),
      W(coef(a,"x")+sgn(-a*b),"טעות סימן במכפלה של שני המספרים."),
      W(coef(a+b,"x"),"חיברתם את שני המספרים במקום להכפיל. הסוגריים כאן מסמנים כפל.")
    ];
    return {ask:"פתחו את הסוגריים",expr:expr,ans:W(ansH),wrong:wrong,steps:steps,rule:"dist",
      hint:"כל איבר בתוך הסוגריים מוכפל במספר שבחוץ — גם ה-x וגם המספר."};
  }
  if(L===2){
    a=rnz(-6,6);b=rnz(-8,8);c=rnz(-6,6);d=rnz(-8,8);
    while(a+c===0)c=rnz(-6,6);                 /* לא משאירים ביטוי בלי x */
    var xc=a+c,kc=a*b+c*d;
    expr=fac(a)+"(x"+sgn(b)+") "+(c<0?"−":"+")+" "+(Math.abs(c)===1?"":Math.abs(c))+"(x"+sgn(d)+")";
    ansH=(xc===0?"":coef(xc,"x"))+(kc===0?(xc===0?"0":""):sgn(kc));
    steps=[
      S("פותחים כל זוג סוגריים בנפרד","",coef(a,"x")+sgn(a*b)+"  ,  "+coef(c,"x")+sgn(c*d)),
      S("אוספים את איברי ה-x","רק איברים מאותו סוג מתחברים: x עם x, מספר עם מספר.",
        coef(a,"x")+term(c,"x")+" = "+coef(xc,"x")),
      S("אוספים את המספרים","",num(a*b)+sgn(c*d)+" = "+num(kc)),
      S("התשובה","",ansH)
    ];
    wrong=[
      W((xc===0?"":coef(xc,"x"))+sgn(a*b+d),"בסוגריים השניים הכפלתם רק את ה-x ולא את המספר."),
      W(coef(xc,"x")+sgn(a*b-c*d),"טעות סימן כשפתחתם את הסוגריים השניים."),
      W(coef(a*c,"x")+sgn(kc),"הכפלתם את מקדמי ה-x זה בזה במקום לחבר אותם.")
    ];
    return {ask:"פתחו וכנסו איברים דומים",expr:expr,ans:W(ansH),wrong:wrong,steps:steps,rule:"dist",
      hint:"קודם פותחים את שני זוגות הסוגריים, ורק אחר כך אוספים x עם x ומספר עם מספר."};
  }
  a=rnz(-9,9);b=rnz(-9,9);
  expr="(x"+sgn(a)+")(x"+sgn(b)+")";
  var mid=a+b,last=a*b;
  ansH="x<sup>2</sup>"+(mid===0?"":term(mid,"x"))+(last===0?"":sgn(last));
  steps=[
    S("מכפילים כל איבר בכל איבר","ארבע מכפלות: ראשון·ראשון, ראשון·שני, שני·ראשון, שני·שני.",
      "x·x "+(a<0?"−":"+")+" "+Math.abs(a)+"·x "+(b<0?"−":"+")+" "+Math.abs(b)+"·x "+(last<0?"−":"+")+" "+Math.abs(last)),
    S("אוספים את שני איברי ה-x","",coef(a,"x")+term(b,"x")+" = "+coef(mid,"x")),
    S("התשובה","",ansH)
  ];
  wrong=[
    W("x<sup>2</sup>"+(last===0?"":sgn(last)),"שכחתם את האיבר האמצעי. יש שתי מכפלות שנותנות x, וצריך לחבר אותן."),
    W("x<sup>2</sup>"+(mid===0?"":term(mid,"x")),"שכחתם את המכפלה של שני המספרים."),
    W("x<sup>2</sup>"+(mid===0?"":term(mid,"x"))+(last===0?"":sgn(-last)),"טעות סימן במכפלת שני המספרים.")
  ];
  return {ask:"פתחו את הסוגריים",expr:expr,ans:W(ansH),wrong:wrong,steps:steps,rule:"binom",
    hint:"(x+a)(x+b) = x² + (a+b)x + a·b — האיבר האמצעי הוא סכום, האחרון הוא מכפלה."};
}
/* ---------- 3. משוואות ממעלה ראשונה ---------- */
function genLinear(L){
  var a,b,c,d,x,steps,wrong,expr;
  if(L===1){
    a=rnz(-9,9);x=rnz(-12,12);b=rnz(-20,20);c=a*x+b;
    expr=coef(a,"x")+sgn(b)+" = "+num(c);
    steps=[
      S("מעבירים את המספר לצד השני","מה שעובר צד — מחליף סימן. "+num(b)+" עובר ונהיה "+num(-b)+".",
        coef(a,"x")+" = "+num(c)+sgn(-b)),
      S("מסכמים את הצד הימני","",coef(a,"x")+" = "+num(c-b)),
      S("מחלקים במקדם של x","",	"x = "+num(c-b)+" ÷ "+pn(a)),
      S("התשובה","","x = "+num(x))
    ];
    wrong=[
      W(num(r2((c+b)/a)),"העברתם את "+num(b)+" לצד השני בלי להחליף סימן."),
      W(num(c-b),"עצרתם צעד מוקדם מדי — נשאר לחלק במקדם של x."),
      W(num((c-b)*a),"הכפלתם במקדם במקום לחלק בו.")
    ];
    return {ask:"פתרו את המשוואה",expr:expr,ans:W("x = "+num(x)),wrong:wrong.map(function(w){return W("x = "+w.h,w.why)}),
      steps:steps,rule:"lin",hint:"קודם מכניסים את כל המספרים לצד אחד ואת ה-x לצד השני, ורק בסוף מחלקים במקדם."};
  }
  if(L===2){
    x=rnz(-10,10);a=rnz(-8,8);c=rnz(-8,8);
    if(a===c)c=a+pick([1,2,3]);
    b=rnz(-20,20);d=(a-c)*x+b;
    expr=coef(a,"x")+sgn(b)+" = "+coef(c,"x")+sgn(d);
    steps=[
      S("כל ה-x לצד אחד","מעבירים את "+coef(c,"x")+" שמאלה, והוא מחליף סימן.",
        coef(a,"x")+term(-c,"x")+sgn(b)+" = "+num(d)),
      S("כל המספרים לצד השני","מעבירים את "+num(b)+" ימינה, גם הוא מחליף סימן.",
        coef(a-c,"x")+" = "+num(d)+sgn(-b)),
      S("מסכמים","",coef(a-c,"x")+" = "+num(d-b)),
      S("מחלקים במקדם","","x = "+num(d-b)+" ÷ "+pn(a-c)+" = "+num(x))
    ];
    wrong=[
      W(num(r2((d+b)/(a-c))),"המספר לא החליף סימן כשעבר צד."),
      W(num(r2((d-b)/(a+c))),"חיברתם את מקדמי ה-x במקום לחסר אותם. איבר שעובר צד מחליף סימן."),
      W(num(-x),"הסימן של התשובה התהפך בשלב החילוק.")
    ];
    return {ask:"פתרו את המשוואה",expr:expr,ans:W("x = "+num(x)),wrong:wrong.map(function(w){return W("x = "+w.h,w.why)}),
      steps:steps,rule:"lin",hint:"מרכזים את כל איברי ה-x בצד אחד ואת כל המספרים בצד השני. כל מעבר צד הופך סימן."};
  }
  /* רמה 3: משוואה עם סוגריים משני הצדדים */
  a=rnz(-6,6);b=rnz(-9,9);c=rnz(-6,6);d=rnz(-9,9);
  if(a===c)c=a+pick([1,2,-2,3]);
  x=(c*d-a*b)/(a-c);
  var tries=0;
  while((!isFinite(x)||Math.round(x)!==x||Math.abs(x)>25||b===d)&&tries<80){
    a=rnz(-6,6);b=rnz(-9,9);c=rnz(-6,6);d=rnz(-9,9);
    if(a===c)c=a+pick([1,2,-2,3]);
    x=(c*d-a*b)/(a-c);tries++;
  }
  if(!isFinite(x)||Math.round(x)!==x){a=2;b=3;c=1;d=-4;x=(c*d-a*b)/(a-c)}
  expr=fac(a)+"(x"+sgn(b)+") = "+fac(c)+"(x"+sgn(d)+")";
  steps=[
    S("פותחים סוגריים בשני הצדדים","המספר שבחוץ מוכפל בכל אחד משני האיברים שבפנים.",
      coef(a,"x")+sgn(a*b)+" = "+coef(c,"x")+sgn(c*d)),
    S("מרכזים x בצד אחד ומספרים בצד השני","",coef(a-c,"x")+" = "+num(c*d-a*b)),
    S("מחלקים במקדם","","x = "+num(c*d-a*b)+" ÷ "+pn(a-c)+" = "+num(x))
  ];
  wrong=[
    W("x = "+num(-x),"הסימן התהפך — כדאי לבדוק את החיסור של המקדמים."),
    W("x = "+num(r2((c*d-a*b)/(a+c))),"חיברתם את מקדמי ה-x במקום לחסר. איבר שעובר צד מחליף סימן."),
    W("x = "+num(r2((c*d+a*b)/(a-c))),"בפתיחת הסוגריים בצד שמאל נשמר הסימן במקום להתהפך.")
  ];
  return {ask:"פתרו את המשוואה",expr:expr,ans:W("x = "+num(x)),wrong:wrong,steps:steps,rule:"lin",
    hint:"קודם פותחים את שני זוגות הסוגריים, ורק אחר כך מעבירים אגפים."};
}

/* ---------- 4. שברים ---------- */
function genFrac(L){
  var a,b,c,d,res,steps,wrong,expr;
  if(L===1){
    b=pick([2,3,4,5,6,8,10,12]);d=pick([2,3,4,5,6,8,10,12]);
    a=ri(1,b*2-1);c=ri(1,d*2-1);
    while(a%b===0)a=ri(1,b*2-1);           /* שומרים על שבר אמיתי ולא על מספר שלם */
    while(c%d===0)c=ri(1,d*2-1);
    var plus=Math.random()<0.55;
    var f1=fr(a,b),f2=fr(c,d);
    /* בחיסור משאירים את הגדול קודם, כדי לא לפתוח את רמת הבסיס בתוצאה שלילית */
    if(!plus&&f1.val()<=f2.val()){var sw=f1;f1=f2;f2=sw;a=f1.n;b=f1.d;c=f2.n;d=f2.d}
    res=plus?f1.add(f2):f1.sub(f2);
    if(res.n===0){plus=true;res=f1.add(f2)}
    var m=lcm(b,d);
    a=f1.n;b=f1.d;c=f2.n;d=f2.d;
    expr=f1.html()+(plus?" + ":" − ")+f2.html();
    steps=b===d?[
      S("המכנים כבר שווים","כששני המכנים זהים אין מה להרחיב — עוברים ישר למונים.","מכנה משותף: "+m),
      S("פועלים על המונים בלבד","המכנה נשאר "+m+". רק המונים מתחברים או מתחסרים.",
        a+(plus?" + ":" − ")+c+" = "+(plus?a+c:a-c)),
      S("מצמצמים","",res.html())
    ]:[
      S("מוצאים מכנה משותף","המכנה המשותף הקטן ביותר של "+b+" ו-"+d+" הוא "+m+".","מכנה משותף: "+m),
      S("מרחיבים את שני השברים","מכפילים מונה ומכנה באותו מספר — ערך השבר לא משתנה.",
        rawFr(a*(m/b),m)+(plus?" + ":" − ")+rawFr(c*(m/d),m)),
      S("פועלים על המונים בלבד","המכנה נשאר "+m+". רק המונים מתחברים או מתחסרים.",
        rawFr(plus?a*(m/b)+c*(m/d):a*(m/b)-c*(m/d),m)),
      S("מצמצמים","",res.html())
    ];
    wrong=[
      W(fr(plus?a+c:a-c,b+d).html(),"חיברתם מונה עם מונה ומכנה עם מכנה. בחיבור וחיסור שברים חייבים מכנה משותף."),
      W(fr(plus?a+c:a-c,b).html(),"פעלתם על המונים אבל השארתם את המכנה של השבר הראשון."),
      W(fr(plus?a*(m/b)+c*(m/d):a*(m/b)-c*(m/d),b*d).html(),"לקחתם את מכפלת המכנים כמכנה, אבל הרחבתם את המונים לפי המכנה המשותף — שני מכנים שונים באותו חישוב."),
      W(fr(a*c,b*d).html(),"הכפלתם את השברים במקום לחבר או לחסר אותם.")
    ];
    return {ask:"חשבו וצמצמו",expr:expr,ans:W(res.html()),wrong:wrong,steps:steps,rule:"fracadd",
      hint:"אי אפשר לחבר שברים עם מכנים שונים. קודם מכנה משותף, ורק אחר כך פועלים על המונים."};
  }
  if(L===2){
    b=pick([2,3,4,5,6,7,8,9]);d=pick([2,3,4,5,6,7,8,9]);
    a=ri(1,b*2);c=ri(1,d*2);
    while(a%b===0)a=ri(1,b*2);
    while(c%d===0)c=ri(1,d*2);
    var mul=Math.random()<0.5;
    var g1=fr(a,b),g2=fr(c,d);
    res=mul?g1.mul(g2):g1.div(g2);
    expr=g1.html()+(mul?" × ":" ÷ ")+g2.html();
    steps=mul?[
      S("בכפל שברים אין צורך במכנה משותף","מונה כפול מונה, מכנה כפול מכנה.",a+"·"+c+" / "+b+"·"+d),
      S("מחשבים","",fr(a*c,1).n+" / "+(b*d)),
      S("מצמצמים","",res.html())
    ]:[
      S("חילוק בשבר = כפל בשבר ההפוך","הופכים את השבר השני — מונה ומכנה מתחלפים — ומכפילים.",
        g1.html()+" × "+fr(d,c).html()),
      S("מכפילים","",a+"·"+d+" / "+b+"·"+c),
      S("מצמצמים","",res.html())
    ];
    wrong=mul?[
      W(fr(a*d,b*c).html(),"הפכתם את השבר השני. הופכים רק בחילוק, לא בכפל."),
      W(fr(a+c,b+d).html(),"חיברתם מונים ומכנים. בכפל מכפילים מונה במונה ומכנה במכנה."),
      W(fr(a*c,b+d).html(),"המונים הוכפלו אבל המכנים חוברו."),
      W(fr(res.d,res.n).html(),"התשובה יצאה הפוכה — מונה ומכנה התחלפו בסוף.")
    ]:[
      W(fr(a*c,b*d).html(),"הכפלתם ישר בלי להפוך את השבר השני. בחילוק חייבים להפוך."),
      W(fr(b*c,a*d).html(),"הפכתם את השבר הראשון במקום את השני."),
      W(fr(res.d,res.n).html(),"התשובה יצאה הפוכה — מונה ומכנה התחלפו בסוף."),
      W(fr(a+c,b+d).html(),"חיברתם מונים ומכנים. זו לא הפעולה שנדרשה כאן.")
    ];
    return {ask:"חשבו וצמצמו",expr:expr,ans:W(res.html()),wrong:wrong,steps:steps,rule:"fracmul",
      hint:mul?"בכפל: מונה כפול מונה, מכנה כפול מכנה. אין מכנה משותף.":"חילוק בשבר הוא כפל בשבר ההפוך."};
  }
  /* רמה 3: משוואה עם שברים */
  b=pick([2,3,4,6]);d=pick([2,3,4,6]);
  if(b===d)d=b===2?3:2;
  var mm=lcm(b,d),xx=mm*ri(1,4);
  var total=xx/b+xx/d;
  expr='<span class="frac"><span>x</span><span>'+b+'</span></span> + <span class="frac"><span>x</span><span>'+d+'</span></span> = '+total;
  steps=[
    S("מכפילים את כל המשוואה במכנה המשותף","המכנה המשותף של "+b+" ו-"+d+" הוא "+mm+". מכפילים בו כל איבר — כך השברים נעלמים.",
      mm+"·x/"+b+" + "+mm+"·x/"+d+" = "+mm+"·"+total),
    S("מצמצמים כל איבר","",(mm/b)+"x + "+(mm/d)+"x = "+(mm*total)),
    S("מכנסים איברים דומים","",(mm/b+mm/d)+"x = "+(mm*total)),
    S("מחלקים במקדם","","x = "+(mm*total)+" ÷ "+(mm/b+mm/d)+" = "+xx)
  ];
  wrong=[
    W("x = "+num(total),"חיברתם את השברים כאילו x/"+b+" + x/"+d+" = x. המקדמים לא מסתכמים ל-1."),
    W("x = "+num(total*b*d/(b+d)),"השתמשתם במכפלת המכנים במקום במכנה המשותף הנכון, ואז חילקתם לא נכון."),
    W("x = "+num(mm*total),"הכפלתם במכנה המשותף אבל שכחתם לחלק בסוף במקדם של x.")
  ];
  return {ask:"פתרו את המשוואה",expr:expr,ans:W("x = "+xx),wrong:wrong,steps:steps,rule:"fraceq",
    hint:"כשיש שברים במשוואה — מכפילים את כל המשוואה במכנה המשותף, והם נעלמים."};
}
/* ---------- 5. אחוזים ---------- */
function genPercent(L){
  var p,N,res,steps,wrong;
  if(L===1){
    p=pick([5,10,15,20,25,30,40,50,60,75,80]);
    N=pick([20,40,60,80,120,140,160,200,240,300,360,400,500]);
    res=N*p/100;
    if(Math.round(res)!==res){N=200;res=N*p/100}
    steps=[
      S("אחוז הוא שבר מתוך מאה",p+"% זה "+p+" חלקי 100.",p+"% = "+p+"/100"),
      S("״מ־״ במתמטיקה זה כפל","מכפילים את החלק במספר השלם.",p+"/100 · "+N),
      S("מחשבים","",(p/100)+" · "+N+" = "+num(res))
    ];
    wrong=[
      W(num(r2(N/p)),"חילקתם את המספר באחוז. אחוז זה כפל בשבר, לא חילוק."),
      W(num(N-p),"חיסרתם את המספר "+p+" מהסכום. "+p+"% הוא לא "+p+" יחידות."),
      W(num(res*10),"טעות בהזזת נקודה עשרונית — חלקתם ב-10 במקום ב-100.")
    ];
    return {ask:"חשבו",expr:p+"% מתוך "+N,ans:W(num(res)),wrong:wrong,steps:steps,rule:"pct",
      hint:"אחוז מתוך מספר = המספר כפול האחוז חלקי 100."};
  }
  if(L===2){
    p=pick([10,15,20,25,30,40,50]);
    N=pick([80,120,160,200,240,300,400,600,800]);
    var down=Math.random()<0.6;
    var change=N*p/100;
    res=down?N-change:N+change;
    steps=[
      S("מחשבים את גודל השינוי",p+"% מתוך "+N+".",p+"% · "+N+" = "+num(change)),
      S(down?"מחסרים מהמחיר המקורי":"מוסיפים למחיר המקורי","",
        N+(down?" − ":" + ")+num(change)+" = "+num(res)),
      S("קיצור דרך שכדאי להכיר",
        down?"הנחה של "+p+"% משאירה "+(100-p)+"% מהמחיר, אז אפשר פשוט להכפיל ב-"+((100-p)/100)+".":
             "העלאה של "+p+"% נותנת "+(100+p)+"% מהמחיר, אז אפשר להכפיל ב-"+((100+p)/100)+".",
        N+" · "+(down?(100-p)/100:(100+p)/100)+" = "+num(res))
    ];
    wrong=[
      W(num(change),"חישבתם את גודל ההנחה או התוספת, אבל השאלה מבקשת את המחיר עצמו."),
      W(num(down?N+change:N-change),"הלכתם לכיוון ההפוך — "+(down?"הוספתם במקום להוריד":"הורדתם במקום להוסיף")+"."),
      W(num(down?N-p:N+p),"התייחסתם ל-"+p+"% כאילו הם "+p+" שקלים.")
    ];
    return {ask:down?"מחיר מוצר הוא "+N+" ש\"ח ויש עליו הנחה של "+p+"%. כמה משלמים?"
                     :"מחיר מוצר הוא "+N+" ש\"ח והוא התייקר ב-"+p+"%. מה המחיר החדש?",
      expr:"",ans:W(num(res)+' ש"ח'),
      wrong:wrong.map(function(w){return W(w.h+' ש"ח',w.why)}),steps:steps,rule:"pct",
      hint:down?"הנחה של "+p+"% משאירה "+(100-p)+"% מהמחיר.":"התייקרות ב-"+p+"% נותנת "+(100+p)+"% מהמחיר."};
  }
  /* רמה 3: אחוז שינוי, או מציאת המחיר המקורי */
  if(Math.random()<0.5){
    var A=pick([40,50,60,80,120,150,200,250]);
    p=pick([10,20,25,50,75,100]);
    var B=A*(100+p)/100;
    if(Math.round(B)!==B){B=A*1.5;p=50}
    steps=[
      S("אחוז שינוי נמדד תמיד ביחס להתחלה","זו הנקודה שהכי הרבה נופלים בה: המכנה הוא הערך הישן, לא החדש.",
        "שינוי באחוזים = (חדש − ישן) ÷ ישן · 100"),
      S("מחשבים את השינוי","",num(B)+" − "+A+" = "+num(B-A)),
      S("מחלקים בערך ההתחלתי וכופלים ב-100","",num(B-A)+" ÷ "+A+" · 100 = "+num(p)+"%")
    ];
    return {ask:"מחיר עלה מ-"+A+' ש"ח ל-'+num(B)+' ש"ח. בכמה אחוזים הוא עלה?',expr:"",
      ans:W(num(p)+"%"),
      wrong:[
        W(num(Math.round((B-A)/B*1000)/10)+"%","חילקתם בערך החדש. אחוז שינוי מחושב תמיד ביחס לערך ההתחלתי."),
        W(num(B-A)+"%","זה גודל השינוי בשקלים, לא באחוזים."),
        W(num(Math.round(B/A*1000)/10)+"%","זה היחס בין המחירים. כדי לקבל את אחוז העלייה צריך להוריד 100%.")
      ],steps:steps,rule:"pctchange",
      hint:"אחוז שינוי = (חדש פחות ישן) חלקי הישן, כפול 100."};
  }
  p=pick([10,20,25,40,50]);
  var orig=pick([80,120,160,200,240,300,400]);
  var after=orig*(100-p)/100;
  steps=[
    S("מתרגמים את המשפט למשוואה","אחרי הנחה של "+p+"% נשארו "+(100-p)+"% מהמחיר המקורי.",
      (100-p)/100+" · x = "+num(after)),
    S("מחלקים בשיעור שנשאר","זה ההפך מהכפלה — לא מוסיפים חזרה "+p+"%.",
      "x = "+num(after)+" ÷ "+(100-p)/100),
    S("התשובה","","x = "+num(orig))
  ];
  return {ask:"אחרי הנחה של "+p+"% שילמו "+num(after)+' ש"ח. מה היה המחיר לפני ההנחה?',expr:"",
    ans:W(num(orig)+' ש"ח'),
    wrong:[
      W(num(after*(100+p)/100)+' ש"ח',"הוספתם "+p+"% למחיר אחרי ההנחה. אחוז שמורידים ואחוז שמוסיפים לא מבטלים זה את זה."),
      W(num(after+p)+' ש"ח',"הוספתם "+p+" שקלים במקום "+p+" אחוזים."),
      W(num(after/(p/100))+' ש"ח',"חילקתם באחוז ההנחה במקום באחוז שנשאר.")
    ],steps:steps,rule:"pctback",
    hint:"אם ההנחה "+p+"%, המחיר ששולם הוא "+(100-p)+"% מהמקורי. מחלקים ב-"+((100-p)/100)+"."};
}

/* ---------- 6. יחס ופרופורציה ---------- */
function genRatio(L){
  var a,b,k,steps,total;
  if(L===1){
    k=ri(2,9);a=ri(2,9);b=ri(2,9);
    while(gcd(a,b)!==1){b=ri(2,9)}
    steps=[
      S("מחפשים מחלק משותף","המספר הגדול ביותר שמחלק גם את "+(a*k)+" וגם את "+(b*k)+" הוא "+k+".","מחלק משותף: "+k),
      S("מחלקים את שני האגפים","יחס לא משתנה כשמחלקים את שני חלקיו באותו מספר.",
        (a*k)+" ÷ "+k+" : "+(b*k)+" ÷ "+k),
      S("התשובה","",a+" : "+b)
    ];
    return {ask:"צמצמו את היחס",expr:(a*k)+" : "+(b*k),ans:W(a+" : "+b),
      wrong:[
        W((a*k-k)+" : "+(b*k-k),"חיסרתם את אותו מספר משני האגפים. ביחס מצמצמים בחילוק, לא בחיסור."),
        W(b+" : "+a,"הפכתם את סדר האיברים. הסדר ביחס משנה."),
        W((a*k)+" : "+b,"צמצמתם רק את האיבר השני. חייבים לחלק את שני האיברים באותו מספר.")
      ],
      steps:steps,rule:"ratio",hint:"מחלקים את שני איברי היחס באותו מספר עד שאין להם מחלק משותף."};
  }
  if(L===2){
    a=ri(1,7);b=ri(1,7);
    while(a===b||gcd(a,b)!==1)b=ri(1,7);     /* יחס מצומצם — אחרת השאלה מבקשת לצמצם בלי לומר */
    k=ri(3,14);total=(a+b)*k;
    steps=[
      S("סופרים חלקים","היחס "+a+":"+b+" אומר שיש "+a+" חלקים ועוד "+b+" חלקים.",
        a+" + "+b+" = "+(a+b)+" חלקים"),
      S("מחשבים כמה שווה חלק אחד","",total+" ÷ "+(a+b)+" = "+k),
      S("מכפילים בכל מנה","",a+" · "+k+" = "+(a*k)+"   ,   "+b+" · "+k+" = "+(b*k))
    ];
    return {ask:"מחלקים "+total+" שקלים ביחס "+a+":"+b+". כמה מקבל כל אחד?",expr:"",
      ans:W((a*k)+" ו-"+(b*k)),
      wrong:[
        W((total/2)+" ו-"+(total/2),"חילקתם שווה בשווה. היחס "+a+":"+b+" אומר שהחלקים לא שווים."),
        W(r2(total/a)+" ו-"+r2(total/b),"חילקתם את הסכום בכל מספר בנפרד. קודם צריך לחלק במספר החלקים הכולל."),
        W((a*k)+" ו-"+(total-a*k-k),"אחרי שחישבתם את החלק הראשון, השני חושב בטעות.")
      ],
      steps:steps,rule:"ratio",hint:"סוכמים את מספרי היחס, מחלקים בסכום כדי לדעת כמה שווה חלק אחד, ואז מכפילים."};
  }
  a=ri(2,12);b=ri(2,12);k=ri(2,9);
  var c=a*k,x=b*k;
  steps=[
    S("כותבים כפרופורציה","",a+" : "+b+" = "+c+" : x"),
    S("מכפילים באלכסון","במשוואת יחסים מכפילים את הקצוות מול האמצעים.",a+"·x = "+b+"·"+c),
    S("מחשבים","",a+"x = "+(b*c)),
    S("מחלקים","","x = "+(b*c)+" ÷ "+a+" = "+x)
  ];
  return {ask:"השלימו את הפרופורציה",expr:a+" : "+b+" = "+c+" : x",ans:W("x = "+x),
    wrong:[
      W("x = "+num(r2(a*c/b)),"הכפלתם את האלכסון ההפוך. שימו לב איזה איבר לא ידוע."),
      W("x = "+num(c-a+b),"חיסרתם במקום להכפיל. פרופורציה עובדת בכפל, לא בחיבור."),
      W("x = "+num(b+c-a),"חיברתם וחיסרתם את המספרים. פרופורציה נפתרת בכפל באלכסון.")
    ],
    steps:steps,rule:"prop",hint:"בפרופורציה a:b = c:x מתקיים a·x = b·c."};
}
/* ---------- 7. חוקי חזקות ---------- */
function genPowers(L){
  var m,n,c,steps;
  if(L===1){
    m=ri(2,7);n=ri(2,7);
    if(Math.random()<0.5){
      return {ask:"פשטו לחזקה אחת",expr:pw("x",m)+" · "+pw("x",n),ans:W(pw("x",m+n)),
        wrong:[
          W(pw("x",m*n),"הכפלתם את המעריכים. בכפל של אותו בסיס המעריכים מתחברים."),
          W("2"+pw("x",m+n),"הכפלתם גם את הבסיס. הבסיס נשאר x — רק המעריך משתנה."),
          W(pw("x",Math.abs(m-n)),"חיסרתם את המעריכים. חיסור שייך לחילוק, לא לכפל.")
        ],
        steps:[
          S("אותו בסיס בכפל — מחברים מעריכים","הכלל: xᵃ · xᵇ = xᵃ⁺ᵇ. אפשר לראות למה: זה פשוט x שמוכפל בעצמו "+m+" פעמים ועוד "+n+" פעמים.",
            "x<sup>"+m+"</sup> · x<sup>"+n+"</sup> = x<sup>"+m+"+"+n+"</sup>"),
          S("מסכמים","",pw("x",m+n))
        ],rule:"powmul",hint:"אותו בסיס, פעולת כפל — המעריכים מתחברים."};
    }
    if(m<=n){var t=m;m=n+ri(1,4);n=t}
    return {ask:"פשטו לחזקה אחת",expr:pw("x",m)+" ÷ "+pw("x",n),ans:W(pw("x",m-n)),
      wrong:[
        W(pw("x",m+n),"חיברתם את המעריכים. חיבור שייך לכפל, ובחילוק מחסרים."),
        W(pw("x",n-m),"חיסרתם בכיוון ההפוך. מחסרים את המעריך של המכנה מזה של המונה."),
        W(pw("x",m*n),"הכפלתם את המעריכים.")
      ],
      steps:[
        S("אותו בסיס בחילוק — מחסרים מעריכים","הכלל: xᵃ ÷ xᵇ = xᵃ⁻ᵇ. כל x במכנה מצמצם x אחד במונה.",
          "x<sup>"+m+"</sup> ÷ x<sup>"+n+"</sup> = x<sup>"+m+"−"+n+"</sup>"),
        S("מסכמים","",pw("x",m-n))
      ],rule:"powdiv",hint:"אותו בסיס, פעולת חילוק — מחסרים את המעריך התחתון מהעליון."};
  }
  if(L===2){
    c=ri(2,5);m=ri(2,5);n=ri(2,4);
    return {ask:"פשטו את הביטוי",expr:"("+c+pw("x",m)+")<sup>"+n+"</sup>",
      ans:W(Math.pow(c,n)+pw("x",m*n)),
      wrong:[
        W(c+pw("x",m*n),"החזקה החיצונית חלה גם על המקדם "+c+", לא רק על ה-x."),
        W(Math.pow(c,n)+pw("x",m+n),"בחזקה של חזקה מכפילים מעריכים, לא מחברים."),
        W((c*n)+pw("x",m*n),"הכפלתם את המקדם במעריך במקום להעלות אותו בחזקה.")
      ],
      steps:[
        S("החזקה החיצונית חלה על כל מה שבסוגריים","גם על המספר וגם על ה-x. זו הטעות הכי נפוצה כאן.",
          "("+c+"x<sup>"+m+"</sup>)<sup>"+n+"</sup> = "+c+"<sup>"+n+"</sup> · (x<sup>"+m+"</sup>)<sup>"+n+"</sup>"),
        S("חזקה של חזקה — מכפילים מעריכים","(xᵃ)ᵇ = xᵃ·ᵇ","(x<sup>"+m+"</sup>)<sup>"+n+"</sup> = x<sup>"+(m*n)+"</sup>"),
        S("מחשבים את המקדם","",c+"<sup>"+n+"</sup> = "+Math.pow(c,n)),
        S("התשובה","",Math.pow(c,n)+pw("x",m*n))
      ],rule:"powpow",hint:"סוגריים בחזקה: כל גורם בפנים מקבל את החזקה. ובחזקה של חזקה — מכפילים."};
  }
  m=ri(2,6);n=ri(m+1,m+5);
  return {ask:"פשטו והציגו בלי מעריך שלילי",expr:pw("x",m)+" ÷ "+pw("x",n),
    ans:W('<span class="frac"><span>1</span><span>x<sup>'+(n-m)+'</sup></span></span>'),
    wrong:[
      W(pw("x",n-m),"קיבלתם מעריך שלילי והורדתם ממנו את המינוס. מעריך שלילי הופך לשבר, לא נעלם."),
      W('<span class="frac"><span>1</span><span>x<sup>'+(m-n===0?1:Math.abs(m*n))+'</sup></span></span>',"הכפלתם את המעריכים במקום לחסר."),
      W("−"+pw("x",n-m),"המינוס עבר למקדם. מעריך שלילי לא הופך את הסימן של הביטוי, אלא מוריד אותו למכנה.")
    ],
    steps:[
      S("מחסרים מעריכים","x<sup>"+m+"</sup> ÷ x<sup>"+n+"</sup> = x<sup>"+m+"−"+n+"</sup>","x<sup>"+num(m-n)+"</sup>"),
      S("מעריך שלילי יורד למכנה","הכלל: x⁻ᵃ = 1/xᵃ. הסימן במעריך אומר ״עבור לצד השני של קו השבר״, לא ״מינוס״.",
        "x<sup>"+num(m-n)+"</sup> = 1 / x<sup>"+(n-m)+"</sup>"),
      S("התשובה","",'<span class="frac"><span>1</span><span>x<sup>'+(n-m)+'</sup></span></span>')
    ],rule:"powneg",hint:"מעריך שלילי אינו מספר שלילי — הוא אומר שהחזקה יורדת למכנה."};
}

/* ---------- 8. שורשים ---------- */
function genRoots(L){
  var n,o,a,b,steps;
  if(L===1){
    n=pick([16,25,36,49,64,81,100,121,144,169,196,225,256,400,625]);
    var r=Math.round(Math.sqrt(n));
    return {ask:"חשבו",expr:"√"+n,ans:W(String(r)),
      wrong:[
        W(String(n/2),"חילקתם ב-2. שורש הוא לא חצי — הוא המספר שמוכפל בעצמו נותן "+n+"."),
        W(String(r+1),"קרוב, אבל "+(r+1)+"² = "+((r+1)*(r+1))+" ולא "+n+"."),
        W(String(r*2),"זה כפול השורש.")
      ],
      steps:[
        S("שואלים: איזה מספר בריבוע נותן "+n+"?","שורש ריבועי הוא הפעולה ההפוכה להעלאה בריבוע.","? · ? = "+n),
        S("בודקים","",r+" · "+r+" = "+n),
        S("התשובה","","√"+n+" = "+r)
      ],rule:"root",hint:"שורש של מספר הוא המספר שכשמכפילים אותו בעצמו מקבלים אותו מספר."};
  }
  if(L===2){
    var base=pick([2,3,5,6,7,10,11]),sq=pick([2,3,4,5,6]);
    n=base*sq*sq;
    o=simpRoot(n);
    return {ask:"פשטו את השורש",expr:"√"+n,ans:W(rootHtml(o)),
      wrong:[
        W(String(o.out*o.in),"הכפלתם את שני החלקים. המספר שיצא מהשורש נשאר מוכפל בשורש שנשאר, לא מתמזג איתו."),
        W("√"+(o.out*o.in),"הוצאתם את הגורם הריבועי בלי לחשב את השורש שלו."),
        W((o.out*o.out)+"√"+o.in,"הוצאתם מהשורש את המספר הריבועי עצמו במקום את השורש שלו.")
      ],
      steps:[
        S("מפרקים למכפלה עם ריבוע שלם","מחפשים את הריבוע השלם הגדול ביותר שמחלק את "+n+".","√"+n+" = √("+(o.out*o.out)+" · "+o.in+")"),
        S("שורש של מכפלה = מכפלת השורשים","","√"+(o.out*o.out)+" · √"+o.in),
        S("מוציאים את מה שאפשר","",rootHtml(o))
      ],rule:"rootsimp",hint:"מחפשים ריבוע שלם שמתחבא בתוך המספר, ומוציאים רק את השורש שלו."};
  }
  a=ri(2,9);b=ri(2,9);
  n=pick([2,3,5,6,7,10]);
  var sum=a+b;
  return {ask:"כנסו איברים דומים",expr:a+"√"+n+" + "+b+"√"+n,ans:W(sum+"√"+n),
    wrong:[
      W(sum+"√"+(n*2),"חיברתם גם את המספרים שבתוך השורש. השורש הוא ה״שם״ של האיבר — הוא לא משתנה."),
      W((a*b)+"√"+n,"הכפלתם את המקדמים במקום לחבר אותם."),
      W((a+b)+"√"+(n*n),"העליתם את השורש בריבוע."),
      W(a+"√"+n,"לקחתם רק את האיבר הראשון.")
    ],
    steps:[
      S("שורשים שווים מתנהגים כמו משתנה","a√"+n+" + b√"+n+" זה בדיוק כמו ax + bx. מחברים רק את המקדמים.",
        a+"√"+n+" + "+b+"√"+n),
      S("מחברים מקדמים","",a+" + "+b+" = "+sum),
      S("התשובה","",sum+"√"+n)
    ],rule:"rootadd",hint:"רק שורשים זהים מתחברים, ומחברים אך ורק את המקדמים שלפניהם."};
}
/* ---------- 9. הישר y = mx + b ---------- */
function genLine(L){
  var m,b,x1,y1,x2,y2,steps;
  if(L===1){
    m=rnz(-5,5);x1=ri(-6,6);x2=x1+rnz(1,5);b=ri(-8,8);
    y1=m*x1+b;y2=m*x2+b;
    steps=[
      S("נוסחת השיפוע","שיפוע = כמה ה-y משתנה חלקי כמה ה-x משתנה.","m = (y₂ − y₁) ÷ (x₂ − x₁)"),
      S("מציבים","","m = ("+num(y2)+" − "+pn(y1)+") ÷ ("+num(x2)+" − "+pn(x1)+")"),
      S("מחשבים","","m = "+num(y2-y1)+" ÷ "+num(x2-x1)+" = "+num(m))
    ];
    return {ask:"מצאו את שיפוע הישר העובר בנקודות",
      expr:"("+num(x1)+", "+num(y1)+")   ,   ("+num(x2)+", "+num(y2)+")",
      ans:W("m = "+num(m)),
      wrong:[
        W("m = "+num(r2((x2-x1)/(y2-y1))),"הפכתם את השבר. השינוי ב-y הוא המונה, השינוי ב-x הוא המכנה."),
        W("m = "+num(-m),"טעות סימן בחיסור. שמרו על אותו סדר בשני החיסורים."),
        W("m = "+num(y2-y1),"עצרתם אחרי החיסור בלי לחלק בהפרש ה-x.")
      ],steps:steps,rule:"slope",
      hint:"שיפוע = הפרש ה-y חלקי הפרש ה-x, ותמיד באותו סדר בשני החיסורים."};
  }
  if(L===2){
    m=rnz(-5,5);x1=rnz(-7,7);b=rnz(-9,9);y1=m*x1+b;
    steps=[
      S("מציבים את הנקודה במשוואת הישר","y = mx + b — יודעים את m, את x ואת y, ומחפשים את b.",
        num(y1)+" = "+num(m)+"·"+pn(x1)+" + b"),
      S("מחשבים את המכפלה","",num(y1)+" = "+num(m*x1)+" + b"),
      S("מבודדים את b","",	"b = "+num(y1)+" − "+pn(m*x1)+" = "+num(b))
    ];
    return {ask:"ישר בעל שיפוע "+num(m)+" עובר בנקודה ("+num(x1)+", "+num(y1)+"). מהי משוואת הישר?",
      expr:"",ans:W("y = "+coef(m,"x")+sgn(b)),
      wrong:[
        W("y = "+coef(m,"x")+sgn(y1),"לקחתם את ערך ה-y של הנקודה כ-b. b הוא מקום החיתוך עם ציר y, כלומר הערך כש-x שווה 0."),
        W("y = "+coef(m,"x")+sgn(-b),"טעות סימן כשבידדתם את b."),
        W("y = "+coef(x1,"x")+sgn(b),"החלפתם בין השיפוע לבין ערך ה-x של הנקודה.")
      ],steps:steps,rule:"lineeq",
      hint:"מציבים את x ואת y של הנקודה בתוך y = mx + b, ומשאירים את b כנעלם."};
  }
  x1=ri(-6,4);x2=x1+ri(1,5);m=rnz(-4,4);b=rnz(-8,8);
  y1=m*x1+b;y2=m*x2+b;
  steps=[
    S("שלב א: מחשבים שיפוע","","m = ("+num(y2)+" − "+pn(y1)+") ÷ ("+num(x2)+" − "+pn(x1)+") = "+num(m)),
    S("שלב ב: מציבים נקודה אחת","אפשר כל אחת מהשתיים — התוצאה זהה.",num(y1)+" = "+num(m)+"·"+pn(x1)+" + b"),
    S("מבודדים b","","b = "+num(y1)+" − "+pn(m*x1)+" = "+num(b)),
    S("כותבים את המשוואה","","y = "+coef(m,"x")+sgn(b))
  ];
  return {ask:"מצאו את משוואת הישר העובר בשתי הנקודות",
    expr:"("+num(x1)+", "+num(y1)+")   ,   ("+num(x2)+", "+num(y2)+")",
    ans:W("y = "+coef(m,"x")+sgn(b)),
    wrong:[
      W("y = "+coef(m,"x")+sgn(-b),"טעות סימן בבידוד b."),
      W("y = "+coef(-m,"x")+sgn(b),"השיפוע יצא בסימן הפוך — בדקו את סדר החיסור."),
      W("y = "+coef(m,"x")+sgn(y2),"לקחתם ערך y של נקודה כ-b במקום לחשב אותו.")
    ],steps:steps,rule:"lineeq",
    hint:"קודם שיפוע משתי הנקודות, אחר כך מציבים אחת מהן כדי למצוא את b."};
}

/* ---------- 10. מערכת שתי משוואות ---------- */
function genSystem(L){
  var x,y,a1,b1,c1,a2,b2,c2,steps;
  x=rnz(-8,8);y=rnz(-8,8);
  if(L===1){
    a1=1;b1=1;c1=x+y;
    a2=1;b2=-1;c2=x-y;
    steps=[
      S("מחברים את שתי המשוואות","כשמחברים אגף לאגף, ה-y מתבטל כי יש +y ו-−y.",
        "(x + y) + (x − y) = "+c1+" + "+pn(c2)),
      S("מקבלים משוואה עם נעלם אחד","","2x = "+(c1+c2)+"  →  x = "+x),
      S("מציבים חזרה","","("+x+") + y = "+c1+"  →  y = "+y)
    ];
    return {ask:"פתרו את המערכת",expr:"x + y = "+num(c1)+"<br>x − y = "+num(c2),
      ans:W("x = "+num(x)+" , y = "+num(y)),
      wrong:[
        W("x = "+num(y)+" , y = "+num(x),"החלפתם בין x ל-y בסוף."),
        W("x = "+num(c1)+" , y = "+num(c2),"לקחתם את אגפי הימין כתשובה בלי לפתור."),
        W("x = "+num(-x)+" , y = "+num(-y),"טעות סימן בחיבור המשוואות.")
      ],steps:steps,rule:"sys",
      hint:"כשמקדם אחד הוא +1 והשני −1 — פשוט מחברים את שתי המשוואות והנעלם נעלם."};
  }
  if(L===2){
    a1=rnz(-4,4);b1=rnz(-4,4);a2=rnz(-4,4);b2=rnz(-4,4);
    var tries=0;
    while((a1*b2-a2*b1===0)&&tries<50){a2=rnz(-4,4);b2=rnz(-4,4);tries++}
    if(a1*b2-a2*b1===0){a1=1;b1=2;a2=3;b2=-1}
    c1=a1*x+b1*y;c2=a2*x+b2*y;
    steps=[
      S("בוחרים נעלם לסלק","מכפילים כל משוואה כך שמקדמי ה-y יהיו הפוכים.",
        "משוואה 1 · "+num(b2)+"  ,  משוואה 2 · "+num(-b1)),
      S("מחברים ומקבלים משוואה אחת","",num(a1*b2-a2*b1)+"x = "+num(c1*b2-c2*b1)),
      S("מחשבים x","","x = "+num(c1*b2-c2*b1)+" ÷ "+pn(a1*b2-a2*b1)+" = "+num(x)),
      S("מציבים ומוצאים y","","y = "+num(y))
    ];
    return {ask:"פתרו את המערכת",
      expr:coef(a1,"x")+term(b1,"y")+" = "+num(c1)+"<br>"+coef(a2,"x")+term(b2,"y")+" = "+num(c2),
      ans:W("x = "+num(x)+" , y = "+num(y)),
      wrong:[
        W("x = "+num(y)+" , y = "+num(x),"החלפתם בין הנעלמים."),
        W("x = "+num(-x)+" , y = "+num(y),"טעות סימן בשלב הסילוק."),
        W("x = "+num(x)+" , y = "+num(-y),"טעות סימן בהצבה חזרה.")
      ],steps:steps,rule:"sys",
      hint:"מכפילים משוואה במספר כך שמקדמי אחד הנעלמים יהיו הפוכים, ואז מחברים."};
  }
  a1=rnz(-3,3);b1=rnz(-3,3);c1=a1*x+b1*y;
  steps=[
    S("מבודדים נעלם אחד","מהמשוואה השנייה קל לבודד את y.","y = "+num(x+y)+" − x"),
    S("מציבים בביטוי הראשון","מחליפים כל y בביטוי שקיבלנו.",
      coef(a1,"x")+" + "+num(b1)+"("+num(x+y)+" − x) = "+num(c1)),
    S("פותחים ומכנסים","",num(a1-b1)+"x = "+num(c1-b1*(x+y))),
    S("מחשבים x ואז y","","x = "+num(x)+"  ,  y = "+num(y))
  ];
  return {ask:"פתרו בשיטת ההצבה",
    expr:coef(a1,"x")+term(b1,"y")+" = "+num(c1)+"<br>x + y = "+num(x+y),
    ans:W("x = "+num(x)+" , y = "+num(y)),
    wrong:[
      W("x = "+num(y)+" , y = "+num(x),"החלפתם בין הנעלמים בסוף."),
      W("x = "+num(x+y)+" , y = 0","הנחתם ש-y שווה אפס. אין לזה בסיס במשוואות."),
      W("x = "+num(-x)+" , y = "+num(-y),"טעות סימן בפתיחת הסוגריים אחרי ההצבה.")
    ],steps:steps,rule:"sys",
    hint:"מבודדים נעלם אחד מהמשוואה הפשוטה, ומציבים אותו במשוואה השנייה."};
}

/* ---------- 11. משוואה ריבועית ---------- */
function genQuad(L){
  var r1,r2,a,b,c,steps;
  if(L===1){
    r1=rnz(-9,9);r2=rnz(-9,9);
    while(r2===r1)r2=rnz(-9,9);          /* שני שורשים שונים — אחרת המסיחים קורסים */
    b=-(r1+r2);c=r1*r2;
    steps=[
      S("מחפשים שני מספרים","צריך שני מספרים שהמכפלה שלהם "+num(c)+" והסכום שלהם "+num(-b)+".",
        "מכפלה: "+num(c)+"   סכום: "+num(-b)),
      S("מוצאים אותם","",num(r1)+" ו-"+num(r2)),
      S("מפרקים לגורמים","",	"(x"+sgn(-r1)+")(x"+sgn(-r2)+") = 0"),
      S("מכפלה מתאפסת כשאחד הגורמים מתאפס","",	"x = "+num(r1)+"   או   x = "+num(r2))
    ];
    return {ask:"פתרו את המשוואה",expr:quadStr(1,b,c)+" = 0",
      ans:W("x = "+num(r1)+" , x = "+num(r2)),
      wrong:[
        W("x = "+num(-r1)+" , x = "+num(-r2),"שכחתם להפוך סימן. אם הפירוק הוא (x − r) אז השורש הוא +r."),
        W("x = "+num(b)+" , x = "+num(c),"לקחתם את המקדמים כפתרונות."),
        W("x = "+num(r1)+" , x = "+num(-r2),"סימן אחד הופך והשני לא — שווה לבדוק את הפירוק שוב.")
      ],steps:steps,rule:"quadfac",
      hint:"מחפשים שני מספרים שמכפלתם היא האיבר החופשי וסכומם הוא מינוס המקדם של x."};
  }
  if(L===2){
    a=pick([1,1,2,2,3]);r1=rnz(-6,6);r2=rnz(-6,6);
    while(r2===r1)r2=rnz(-6,6);
    b=-a*(r1+r2);c=a*r1*r2;
    var disc=b*b-4*a*c;
    steps=[
      S("מזהים את המקדמים","","a = "+a+"   b = "+num(b)+"   c = "+num(c)),
      S("מחשבים דיסקרימיננטה","Δ = b² − 4ac. היא מספרת כמה פתרונות יש.",
        "Δ = "+pn(b)+"² − 4·"+a+"·"+pn(c)+" = "+num(disc)),
      S("מציבים בנוסחת השורשים","x = (−b ± √Δ) ÷ 2a",
        "x = ("+num(-b)+" ± "+num(Math.sqrt(disc))+") ÷ "+(2*a)),
      S("שני הפתרונות","","x = "+num(r1)+"   ,   x = "+num(r2))
    ];
    return {ask:"פתרו בעזרת נוסחת השורשים",expr:quadStr(a,b,c)+" = 0",
      ans:W("x = "+num(r1)+" , x = "+num(r2)),
      wrong:[
        W("x = "+num(-r1)+" , x = "+num(-r2),"טעות סימן ב-−b. שימו לב שהנוסחה מתחילה במינוס b."),
        W("x = "+num((-b+Math.sqrt(disc))/2)+" , x = "+num((-b-Math.sqrt(disc))/2),"חילקתם ב-2 במקום ב-2a."),
        W("x = "+num(r1)+" , x = "+num(r1),"מצאתם פתרון אחד בלבד. הסימן ± נותן שני פתרונות.")
      ],steps:steps,rule:"quadform",
      hint:"נוסחת השורשים: x = (−b ± √(b²−4ac)) ÷ 2a. שימו לב שמחלקים ב-2a ולא ב-2."};
  }
  a=pick([1,2,3]);b=rnz(-9,9);
  var kind=pick(["two","one","none"]);
  if(kind==="one"){ c=b*b/(4*a); if(Math.round(c)!==c){b=2*a;c=1} }
  else if(kind==="none"){ c=Math.ceil((b*b+1)/(4*a))+ri(0,4) }
  else { c=Math.floor((b*b-1)/(4*a))-ri(0,4) }
  var D=b*b-4*a*c;
  var ansTxt=D>0?"שני פתרונות":D===0?"פתרון אחד":"אין פתרון";
  steps=[
    S("מחשבים את הדיסקרימיננטה","Δ = b² − 4ac","Δ = "+pn(b)+"² − 4·"+a+"·"+pn(c)+" = "+num(D)),
    S("קוראים את הסימן של Δ","Δ חיובי → שני פתרונות. Δ אפס → פתרון אחד. Δ שלילי → אין פתרון ממשי, כי אין שורש למספר שלילי.",
      "Δ = "+num(D)+"  →  "+ansTxt)
  ];
  return {ask:"כמה פתרונות יש למשוואה?",expr:quadStr(a,b,c)+" = 0",
    ans:W(ansTxt),
    wrong:shuffle([W(D>0?"פתרון אחד":"שני פתרונות",""),W(D<0?"פתרון אחד":"אין פתרון",""),W(D===0?"אין פתרון":"פתרון אחד","")])
      .filter(function(w){return w.h!==ansTxt}).slice(0,3)
      .map(function(w){return W(w.h,"הדיסקרימיננטה יצאה "+num(D)+", ולכן "+(D>0?"יש שני פתרונות שונים":D===0?"יש פתרון כפול אחד":"אין פתרון ממשי")+".")}),
    steps:steps,rule:"disc",
    hint:"מחשבים Δ = b² − 4ac ומסתכלים רק על הסימן שלה."};
}
