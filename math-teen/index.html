<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>שלב — מתמטיקה לתיכון, צעד אחר צעד</title>
<meta name="description" content="תרגול מתמטיקה לתיכון לתלמידים שלומדים אחרת: כל שאלה עם פתרון מודרך צעד־צעד, זיהוי הטעות שעשית, דף נוסחאות והקראה קולית. 3, 4 ו-5 יחידות." />
<meta name="theme-color" content="#f5f7fb" media="(prefers-color-scheme:light)" />
<meta name="theme-color" content="#0e1117" media="(prefers-color-scheme:dark)" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   שלב — מתמטיקה לתיכון
   עיצוב לגיל תיכון: נקי, בוגר, בלי חיות מחמד ובלי קונפטי.
   כל המידות ב-rem כדי שהגדלת טקסט תגדיל את הכול יחד.
   ============================================================ */
:root{
  --ar:"Noto Sans Arabic",system-ui,"Segoe UI",Arial,sans-serif;
  --font:"Heebo","Rubik",system-ui,"Segoe UI",Arial,sans-serif;
  --bg:#f5f7fb; --surface:#ffffff; --surface2:#eef1f7;
  --ink:#101828; --muted:#5b6478; --faint:#687080; --line:#e0e4ee;
  --accent:#4f46e5; --accent-ink:#ffffff; --accent-soft:#e9e8fd;
  /* צהוב ההדגשה — אותו צהוב של מקריא קולי, כדי שמעקב ההקראה
     ייראה אותו דבר בכל האתר. */
  --hit:#f5c451; --hit-ink:#1a1300;
  --cyan:#0e7490; --cyan-soft:#dcf3f8;
  --ok:#15803d; --ok-soft:#dcfce7; --bad:#be123c; --bad-soft:#ffe4e9;
  --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px -12px rgba(16,24,40,.18);
  --r:14px;
  /* צבע לכל תחום לימוד. זה לא קישוט — זה עוזר לזהות מיד באיזה
     סוג חומר מדובר, וזה בדיוק מה שעוזר למי שמתקשה להתמצא. */
  --c-base:#0d9488; --cs-base:#d2f4ef;
  --c-alg:#5b56e0;  --cs-alg:#e6e5fe;
  --c-geo:#b45309;  --cs-geo:#fbecd3;
  --c-data:#be185d; --cs-data:#fbdfeb;
}

/* Heebo, Fredoka ו-Assistant אינם מכילים גליפים ערביים. בלי
   המשפחה הזאת הממשק הערבי נופל לגופן ברירת המחדל של המערכת —
   נמדד: הוא הוצג כאן ב-Heebo. Noto Sans Arabic נטען מאותה בקשת
   גופנים שכבר קיימת, ולכן אין כאן תלות חיצונית חדשה, וקובצי
   הגופן נמשכים רק כשבאמת מוצג טקסט ערבי. */
html[lang="ar"] body,html[lang="ar"] input,html[lang="ar"] button,
html[lang="ar"] textarea,html[lang="ar"] select{font-family:var(--ar)}
:root[data-theme="dark"]{
  --bg:#0e1117; --surface:#161b26; --surface2:#1e2532;
  --ink:#e8ecf4; --muted:#9aa4ba; --faint:#8f99ae; --line:#28313f;
  --accent:#818cf8; --accent-ink:#0e1117; --accent-soft:#232842;
  --hit:#ffd24d; --hit-ink:#241a00;
  --cyan:#22d3ee; --cyan-soft:#132b33;
  --ok:#4ade80; --ok-soft:#132a1c; --bad:#fb7185; --bad-soft:#33161f;
  --warn:#fbbf24; --warn-soft:#33260f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  --c-base:#2dd4bf; --cs-base:#0f2e2b;
  --c-alg:#a5b4fc;  --cs-alg:#1e2140;
  --c-geo:#fbbf24;  --cs-geo:#33270f;
  --c-data:#f472b6; --cs-data:#33162a;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1117; --surface:#161b26; --surface2:#1e2532;
    --ink:#e8ecf4; --muted:#9aa4ba; --faint:#8f99ae; --line:#28313f;
    --accent:#818cf8; --accent-ink:#0e1117; --accent-soft:#232842;
    --hit:#ffd24d; --hit-ink:#241a00;
    --cyan:#22d3ee; --cyan-soft:#132b33;
    --ok:#4ade80; --ok-soft:#132a1c; --bad:#fb7185; --bad-soft:#33161f;
    --warn:#fbbf24; --warn-soft:#33260f;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  --c-base:#2dd4bf; --cs-base:#0f2e2b;
  --c-alg:#a5b4fc;  --cs-alg:#1e2140;
  --c-geo:#fbbf24;  --cs-geo:#33270f;
  --c-data:#f472b6; --cs-data:#33162a;
  }
}
/* ניגודיות גבוהה — שחור על לבן, מסגרות מלאות, בלי גוונים רכים */
:root.hc{
  --bg:#ffffff; --surface:#ffffff; --surface2:#ffffff;
  --ink:#000000; --muted:#1a1a1a; --faint:#333333; --line:#000000;
  --accent:#00308f; --accent-ink:#ffffff; --accent-soft:#e8edf8;
  --hit:#ffe600; --hit-ink:#000000;
  --cyan:#004b57; --cyan-soft:#e6f2f4;
  --ok:#0a5c2a; --ok-soft:#e6f4ea; --bad:#8c0f2c; --bad-soft:#fbe9ed;
  --warn:#6b3d00; --warn-soft:#f7efdf; --shadow:none;
  --c-base:#00308f; --cs-base:#e8edf8; --c-alg:#00308f; --cs-alg:#e8edf8;
  --c-geo:#00308f;  --cs-geo:#e8edf8;  --c-data:#00308f; --cs-data:#e8edf8;
}
:root.hc .card,:root.hc .opt,:root.hc .btn,:root.hc .chip,:root.hc .tile{border:2px solid #000}
:root.hc .deco{display:none}

*{box-sizing:border-box;margin:0}
html{font-size:100%}
html.ts2{font-size:112%}
html.ts3{font-size:126%}
/* פונט ברור לקריאה: Tahoma ו-Verdana קיימים כמעט בכל מכשיר וכוללים עברית */
html.clearfont{--font:Tahoma,Verdana,Arial,sans-serif}
/* ריווח מוגדל — עוזר למי שקשה לו לעקוב אחרי השורה */
html.spaced body{letter-spacing:.03em;word-spacing:.16em;line-height:1.95}
html.rm *,html.rm *::before,html.rm *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.65;
  -webkit-text-size-adjust:100%;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:inherit}
input,select,textarea{font:inherit;color:var(--ink)}
a{color:var(--accent)}
::selection{background:var(--accent);color:var(--accent-ink)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---------- שלד ---------- */
#app{min-height:100vh;display:flex;flex-direction:column}
/* בלי זה כרום מותח כל מסך לרוחב המינימלי של התוכן שלו והעמוד גולש בטלפון */
#app>*{min-width:0;width:100%}
.wrap{max-width:1120px;margin:0 auto;padding:0 clamp(12px,4vw,22px)}
.deco{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.85;
  background:
    radial-gradient(760px 380px at 92% -6%,var(--cs-alg),transparent 62%),
    radial-gradient(620px 340px at 2% 18%,var(--cs-data),transparent 58%),
    radial-gradient(700px 380px at 10% 102%,var(--cs-base),transparent 60%),
    radial-gradient(520px 300px at 96% 78%,var(--cs-geo),transparent 58%)}
#app{position:relative;z-index:1}

/* ---------- כותרת עליונה ---------- */
header{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:10px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand .mk{width:38px;height:38px;border-radius:11px;
  background:linear-gradient(140deg,var(--c-alg),var(--c-data) 55%,var(--c-geo));color:#fff;
  display:grid;place-items:center;font-weight:800;font-size:1.05rem;flex-shrink:0}
:root.hc .brand .mk{background:var(--ink)}
.brand b{display:block;font-size:1rem;line-height:1.15;font-weight:800}
.brand small{display:block;color:var(--muted);font-size:.72rem;font-weight:500}
nav{display:flex;gap:4px;margin-inline-start:auto;flex-wrap:wrap}
.nb{display:inline-flex;align-items:center;gap:6px;border-radius:10px;padding:8px 12px;
  font-size:.9rem;font-weight:600;color:var(--muted);border:1px solid transparent;transition:.15s}
.nb:hover{background:var(--surface2);color:var(--ink)}
.nb.on{background:var(--accent);color:#fff}
:root.hc .nb.on{background:var(--ink);color:var(--bg)}
.nb svg{flex-shrink:0}
@media(max-width:560px){.nb span{display:none}.nb{padding:9px 11px}}

/* ---------- רכיבי בסיס ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:clamp(14px,3.4vw,22px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:11px;
  font-weight:700;padding:12px 18px;transition:.15s;border:1px solid transparent;line-height:1.3}
.btn-p{background:linear-gradient(135deg,var(--accent),var(--c-data));color:#fff}
.btn-p:hover{filter:brightness(1.1)}
:root.hc .btn-p{background:var(--accent)}
.btn-d{background:var(--ink);color:var(--bg)}
.btn-g{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-g:hover{background:var(--surface2)}
.btn[disabled]{opacity:.42;cursor:not-allowed}
.btn.w{width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;
  font-size:.82rem;font-weight:600;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.chip.a{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.h1{font-size:clamp(1.5rem,5.2vw,2.05rem);font-weight:800;line-height:1.2;overflow-wrap:anywhere}
.h2{font-size:clamp(1.1rem,3.6vw,1.3rem);font-weight:700;overflow-wrap:anywhere}
.sub{color:var(--muted);margin-top:5px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.sm{font-size:.85rem}
.xs{font-size:.76rem}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
/* רשימת הקולות: שתי עמודות רק כשבאמת יש מקום, אחרת השמות נקטעים */
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
hr.sep{border:none;border-top:1px solid var(--line);margin:16px 0}

/* ---------- מתמטיקה: תמיד משמאל לימין, מבודד מהעברית ---------- */
.m{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums}
.mline{direction:ltr;unicode-bidi:isolate;text-align:center;font-weight:700;
  font-size:clamp(1.55rem,7vw,2.5rem);letter-spacing:.01em;line-height:1.35;overflow-wrap:anywhere}
.mstep{direction:ltr;unicode-bidi:isolate;text-align:center;font-weight:700;
  font-size:clamp(1.05rem,4.6vw,1.35rem);background:var(--surface2);border-radius:10px;
  padding:9px 12px;margin-top:8px;overflow-wrap:anywhere}
sup{font-size:.62em;vertical-align:super;line-height:0}
sub{font-size:.62em;vertical-align:sub;line-height:0}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;
  line-height:1.05;margin:0 .18em;font-size:.86em}
.frac>span:first-child{border-bottom:.09em solid currentColor;padding:0 .22em}
.frac>span:last-child{padding:0 .22em}

/* ---------- תשובות ---------- */
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
@media(max-width:430px){.opts{grid-template-columns:minmax(0,1fr)}}
.opt{position:relative;border:2px solid var(--line);background:var(--surface);border-radius:12px;
  padding:15px 14px 15px 44px;font-weight:700;font-size:clamp(1rem,4vw,1.2rem);transition:.14s;min-height:58px;
  display:flex;align-items:center;gap:10px}
[dir="rtl"] .opt{padding:15px 44px 15px 14px}
.opt:hover:not([disabled]){border-color:var(--c,var(--accent));background:var(--cs,var(--accent-soft))}
.opt .k{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);
  width:24px;height:24px;border-radius:7px;background:var(--cs,var(--surface2));color:var(--c,var(--faint));
  display:grid;place-items:center;font-size:.76rem;font-weight:700}
/* currentColor כאן היה נפתר לצבע שנקבע באותה הצהרה עצמה,
   ולכן הרקע והטקסט יצאו זהים והספרה נעלמה. */
.opt.right .k{background:var(--ok);color:var(--surface)}
.opt.wrong .k{background:var(--bad);color:var(--surface)}
.opt.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
/* בחירה במבחן היא בחירה, לא תשובה נכונה. במסכי התרגול הצבע
   הירוק אומר "צדקת", ובמבחן אסור לו להופיע כלל — הוא נותן
   משוב שגוי לכל בחירה. ניטרלי, ורק מסמן מה סומן. */
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.opt.dim{opacity:.4}
.opt.gone{opacity:.35;text-decoration:line-through}

/* ---------- פתרון מודרך ---------- */
.steps{margin-top:16px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.step{padding:13px 15px;border-top:1px solid var(--line);background:var(--surface)}
.step:first-child{border-top:none}
.step.future{display:none}
.step .st{display:flex;align-items:center;gap:9px;font-weight:700;font-size:.95rem}
.step .num{width:23px;height:23px;border-radius:50%;background:var(--c,var(--accent));color:#fff;
  display:grid;place-items:center;font-size:.76rem;flex-shrink:0;font-weight:700}
.step .sd{color:var(--muted);font-size:.92rem;margin-top:4px;overflow-wrap:anywhere}
.step.last{background:var(--ok-soft)}
.step.last .num{background:var(--ok);color:var(--surface)}

/* ---------- פירוט טעות ---------- */
.diag{margin-top:14px;border-inline-start:4px solid var(--bad);background:var(--bad-soft);
  border-radius:0 10px 10px 0;padding:12px 15px}
[dir="rtl"] .diag{border-radius:10px 0 0 10px}
.diag b{color:var(--bad)}
.hintbox{margin-top:14px;border-inline-start:4px solid var(--warn);background:var(--warn-soft);
  border-radius:0 10px 10px 0;padding:12px 15px}
.wd{border-radius:5px;padding:1px 3px}
.wd.hit{background:var(--hit);color:var(--hit-ink);font-weight:600}
/* כשמנוע הדיבור אינו מדווח על גבולות מילים — קורה הרבה בעברית
   באנדרואיד — אין מה להדגיש מילה־מילה, ואז מודגש כל האיבר. הכלל
   הזה חסר, ולכן ההדגשה החלופית לא נראתה כלל: מי שהמנוע שלו שקט
   קיבל טקסט בלי שום סימון והמשיך לחפש את המקום בעיניים. */
.now{background:var(--hit);color:var(--hit-ink);border-radius:8px;
  box-shadow:0 0 0 4px var(--hit)}
[dir="rtl"] .hintbox{border-radius:10px 0 0 10px}

/* ---------- מדדים ---------- */
.bar{height:7px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s,background .3s}
.bar.ok>i{background:var(--ok)}
.bar.mid>i{background:var(--warn)}
.bar.low>i{background:var(--bad)}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--surface2);border:1px solid var(--line)}
.dot.ok{background:var(--ok);border-color:var(--ok)}
.dot.no{background:var(--bad);border-color:var(--bad)}
.dot.hp{background:var(--warn);border-color:var(--warn)}
.tile{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--c,var(--accent));
  border-radius:12px;padding:14px;box-shadow:var(--shadow)}
.tile b{display:block;font-size:1.7rem;font-weight:800;line-height:1.2;color:var(--c,var(--ink))}
.tile span{color:var(--muted);font-size:.82rem}

/* ---------- כרטיס נושא ---------- */
.tpc{position:relative;display:flex;flex-direction:column;gap:9px;text-align:start;background:var(--surface);
  border:1px solid var(--line);border-inline-start:4px solid var(--c,var(--accent));
  border-radius:12px;padding:14px;transition:.15s;box-shadow:var(--shadow);min-width:0}
.tpc:hover{border-color:var(--c,var(--accent));transform:translateY(-2px);box-shadow:0 8px 22px -12px var(--c)}
.tpc:hover{border-inline-start-color:var(--c,var(--accent))}
.tpc.on{border-color:var(--c,var(--accent));background:var(--cs,var(--accent-soft))}
.tpc .tn{color:var(--c,var(--ink))}
.tpc .tn{font-weight:700;font-size:.98rem;overflow-wrap:anywhere}
.tpc .td{color:var(--muted);font-size:.8rem;overflow-wrap:anywhere}
.tpc .tm{display:flex;align-items:center;gap:7px;font-size:.74rem;color:var(--faint)}
.tpc .tm .bar{flex:1;min-width:0}

/* ---------- מתגים והגדרות ---------- */
.tog{display:flex;align-items:center;gap:13px;width:100%;text-align:start;background:var(--surface2);
  border:1px solid transparent;border-radius:12px;padding:13px 15px;transition:.15s;min-width:0}
.tog:hover{border-color:var(--line)}
.tog+.tog{margin-top:9px}
.tog .tt{flex:1;min-width:0}
.tog .tt b{display:block;font-size:.97rem;overflow-wrap:anywhere}
.tog .tt span{display:block;color:var(--muted);font-size:.82rem;overflow-wrap:anywhere}
.sw{position:relative;width:46px;height:27px;border-radius:99px;background:var(--line);flex-shrink:0;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:21px;height:21px;border-radius:50%;
  background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .2s}
.tog[aria-checked="true"] .sw{background:var(--accent)}
.tog[aria-checked="true"] .sw::after{transform:translateX(-19px)}
[dir="ltr"] .tog[aria-checked="true"] .sw::after{transform:translateX(19px)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 auto;min-width:0;border:1px solid var(--line);background:var(--surface);
  border-radius:10px;padding:10px 12px;font-weight:600;font-size:.9rem;color:var(--muted);transition:.15s}
.seg button.on{background:var(--c,var(--ink));color:#fff;border-color:transparent}
:root.hc .seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--accent)}
.field{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:11px;
  padding:12px 14px;font-size:1rem;outline:none}
.field:focus{border-color:var(--accent)}

/* ---------- דף נוסחאות ---------- */
.a-base{--c:var(--c-base);--cs:var(--cs-base)}
.a-alg{--c:var(--c-alg);--cs:var(--cs-alg)}
.a-geo{--c:var(--c-geo);--cs:var(--cs-geo)}
.a-data{--c:var(--c-data);--cs:var(--cs-data)}
.chip.area{background:var(--cs);color:var(--c);border-color:transparent}
.arh{display:flex;align-items:center;gap:9px}
.arh::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c);flex-shrink:0}
.fcard{background:var(--surface);border:1px solid var(--line);border-inline-start:4px solid var(--c,var(--line));
  border-radius:12px;padding:13px 15px;min-width:0}
.fcard .fm{color:var(--c,var(--ink))}
.fcard .ft{font-weight:700;font-size:.93rem}
.fcard .fm{margin-top:7px;font-size:1.05rem}
.fcard .fn{color:var(--muted);font-size:.82rem;margin-top:6px;overflow-wrap:anywhere}

/* ---------- שכבות ---------- */
.ov{position:fixed;inset:0;z-index:80;background:rgba(8,11,18,.62);backdrop-filter:blur(3px);
  display:grid;place-items:center;padding:14px}
.ovbox{background:var(--surface);border-radius:16px;width:100%;max-width:560px;max-height:92vh;
  overflow-y:auto;padding:20px;box-shadow:0 24px 70px rgba(0,0,0,.45)}
.ovx{width:36px;height:36px;border-radius:50%;background:var(--surface2);font-size:1.1rem;
  font-weight:700;color:var(--muted);flex-shrink:0;display:grid;place-items:center}

/* ---------- אנימציות מדודות ---------- */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes nudge{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.rise{animation:rise .3s ease both}
.nudge{animation:nudge .3s ease}

footer{border-top:1px solid var(--line);margin-top:auto;background:var(--surface)}
.fbar{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;
  padding-block:16px;font-size:.82rem;color:var(--muted)}
.skip{position:absolute;inset-inline-start:-9999px}
.skip:focus{position:static;display:inline-flex;align-items:center;min-height:44px;margin:8px;padding:8px 14px;background:var(--accent);color:var(--accent-ink);border-radius:8px}

/* יעד מגע לקישור התחתית. קישור טקסט בשורה יוצא בגובה הטקסט —
   15 פיקסלים — וזה קטן מדי לאצבע, גם כשהוא רק לתנאי השימוש. */
.lg-foot a{display:inline-flex;align-items:center;min-height:44px;padding-inline:6px}
/* ---------- מצב מורה ---------- */
.te-wrap{position:fixed;inset:0;z-index:2147482500;background:rgba(8,12,20,.72);
  display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto;
  font-family:system-ui,"Heebo","Rubik",Arial,sans-serif}
.te-box{background:#fff;color:#111827;max-width:26rem;width:100%;border-radius:18px;
  box-shadow:0 24px 70px -20px rgba(0,0,0,.6);padding:clamp(18px,4vw,26px);
  max-height:92vh;overflow-y:auto;font-size:16px;line-height:1.6}
.te-box h2{margin:0 0 6px;font-size:1.35rem;font-weight:800;line-height:1.25}
.te-lead{margin:0 0 10px;color:#374151}
.te-warn{margin:0 0 12px;font-size:.88rem;color:#7c2d12;background:#fef3c7;
  border-radius:10px;padding:9px 11px}
.te-lab{display:block;margin:10px 0 4px;font-weight:700;font-size:.92rem}
.te-in{width:100%;box-sizing:border-box;font:inherit;letter-spacing:.3em;
  border:1px solid #d1d5db;border-radius:11px;padding:.7rem .8rem;min-height:48px;
  background:#fff;color:#111827}
.te-in:focus-visible{outline:3px solid #2563eb;outline-offset:1px}
.te-chk{display:flex;align-items:center;gap:.5rem;margin-top:14px;min-height:44px;
  font-size:.94rem;cursor:pointer}
.te-chk input{width:20px;height:20px}
.te-note{margin:2px 0 0;font-size:.82rem;color:#6b7280}
.te-msg{margin:10px 0 0;font-size:.92rem;font-weight:700;color:#7f1d1d;
  background:#fee2e2;border-radius:10px;padding:9px 11px}
.te-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.te-btn{font:inherit;font-weight:700;border-radius:12px;padding:.75rem 1.2rem;
  cursor:pointer;border:1px solid #d1d5db;background:#fff;color:#111827;min-height:48px}
.te-btn.pri{background:#111827;color:#fff;border-color:#111827;flex:1 1 9rem}
.te-btn.pri[disabled]{opacity:.5;cursor:default}
.te-btn.link{border:0;background:none;text-decoration:underline;padding:.6rem .2rem;
  color:#374151;margin-top:8px;min-height:44px}
.te-btn:focus-visible{outline:3px solid #2563eb;outline-offset:2px}
@media (prefers-color-scheme:dark){
  .te-box{background:#141a24;color:#e8ecf4}
  .te-lead,.te-note{color:#b9c2d4}
  .te-warn{background:#3a2a10;color:#fcd9a5}
  .te-in{background:#1d2531;color:#e8ecf4;border-color:#2c3648}
  .te-msg{background:#4a1717;color:#ffd7d7}
  .te-btn{background:#1d2531;color:#e8ecf4;border-color:#2c3648}
  .te-btn.pri{background:#e8ecf4;color:#141a24;border-color:#e8ecf4}
  .te-btn.link{color:#b9c2d4}
}

بعده فقط نعمل على البسوط.","איבר כללי, הפרש וסכום":"الحدّ العامّ، الفرق والمجموع","איך לומדים כאן":"كيف نتعلّم هنا","אין איבר יחיד באמצע, אז לוקחים ממוצע של שני האמצעיים.":"لا يوجد حدّ مفرد في الوسط، لذلك نأخذ متوسّط الحدّين الأوسطين.","אין ניקוד שלילי — תשובה לא נכונה לא גורעת.":"لا خصم على الخطأ — الإجابة غير الصحيحة لا تنقص شيئًا.","איפוס":"تصفير","אלגברה":"جبر","אם השטח והאורך ידועים — מחלקים את השטח באורך.":"إذا كانت المساحة والطول معلومين — نقسم المساحة على الطول.","אם תמלאו — כפתור השליחה אצל התלמיד ייפתח ישר לצ׳אט איתכם. שימו לב: המספר יופיע בתוך הקישור שאתם משתפים.":"إذا ملأتموه — سيفتح زرّ الإرسال عند الطالب محادثة معكم مباشرةً. انتبهوا: الرقم يظهر داخل الرابط الذي تشاركونه.","אפס פירושו בלי טיימר. בתום הזמן המבחן מוגש מעצמו.":"الصفر يعني بلا مؤقّت. وفي نهاية الوقت يُسلَّم الامتحان تلقائيًّا.","אפשר גם ללחוץ Enter":"يمكن أيضًا الضغط على Enter","אפשר כל אחת מהשתיים — התוצאה זהה.":"يمكن اختيار أيّ منهما — النتيجة واحدة.","אפשר לבקש הקראה של כל שאלה.":"يمكن طلب قراءة أيّ سؤال بصوت عالٍ.","אפשר לחזור לכל שאלה ולשנות. אחרי ההגשה נוצר הקוד.":"يمكن العودة إلى أيّ سؤال وتغييره. وبعد التسليم يُنشَأ الرمز.","אפשר לעצור בכל שלב ולנסות להמשיך לבד.":"يمكن التوقّف في أيّ خطوة ومحاولة المتابعة وحدكم.","אפשר לשנות גם באמצע סבב":"يمكن التغيير حتّى في منتصف الجولة","ארבע מכפלות: ראשון·ראשון, ראשון·שני, שני·ראשון, שני·שני.":"أربعة جداءات: الأوّل·الأوّل، الأوّل·الثاني، الثاني·الأوّل، الثاني·الثاني.","בדיקת קול":"فحص الصوت","בוחרים את הפונקציה המתאימה":"نختار الدالّة المناسبة","בוחרים מה ייכנס לסבבי התרגול. בלי בחירה — כל נושאי המסלול נכנסים.":"نختار ما يدخل في جولات التدريب. وبلا اختيار — تدخل كلّ مواضيع المسار.","בוחרים נעלם לסלק":"نختار مجهولًا لحذفه","בוחרים תשובה שגויה ומקבלים בדיוק איזו טעות זו":"نختار إجابة خاطئة فنعرف بالضبط أيّ خطأ هو","בונים מבחן, שולחים קישור בוואטסאפ, ומקבלים בחזרה קוד תשובות לכל תלמיד. אין שרת ואין חשבון — הכול עובר דרך הקישור ודרך וואטסאפ.":"نبني امتحانًا، نرسل رابطًا عبر واتساب، ونستعيد رمز إجابات لكلّ طالب. لا خادم ولا حساب — كلّ شيء يمرّ عبر الرابط وواتساب.","בונים משוואה":"نبني معادلة","בחירת הכול":"اختيار الكلّ","בידוד x ומעבר אגפים":"عزل x ونقل الطرفين","בכפל אין צורך במכנה משותף. בחילוק הופכים את השבר השני.":"في الضرب لا حاجة إلى مقام مشترك. وفي القسمة نقلب الكسر الثاني.","בכפל ובחילוק הסימן נקבע לבד: זהים → פלוס, שונים → מינוס.":"في الضرب والقسمة تتحدّد الإشارة وحدها: متماثلتان → موجب، مختلفتان → سالب.","בכפל שברים אין צורך במכנה משותף":"في ضرب الكسور لا حاجة إلى مقام مشترك","בכפל: מונה כפול מונה, מכנה כפול מכנה. אין מכנה משותף.":"في الضرب: بسط في بسط، ومقام في مقام. بلا مقام مشترك.","במספר זוגי של איברים — ממוצע שני האמצעיים.":"عند عدد زوجيّ من الحدود — متوسّط الحدّين الأوسطين.","במשוואת יחסים מכפילים את הקצוות מול האמצעים.":"في معادلة التناسب نضرب الطرفين مقابل الوسطين.","במשולש שלפניכם, מהו cos α?":"في المثلّث الذي أمامكم، ما cos α؟","במשולש שלפניכם, מהו sin α?":"في المثلّث الذي أمامكم، ما sin α؟","במשולש שלפניכם, מהו tan α?":"في المثلّث الذي أمامكم، ما tan α؟","בסדר פעולות החשבון כפל וחילוק קודמים לחיבור וחיסור.":"في ترتيب العمليّات الحسابيّة يسبق الضربُ والقسمةُ الجمعَ والطرحَ.","בסוף תקבלו קוד — שולחים אותו למורה בוואטסאפ.":"في النهاية تحصلون على رمز — أرسلوه إلى المعلّم عبر واتساب.","בעיות מילוליות":"مسائل لفظيّة","בעיות מילוליות היה הנושא שהכי הפריע בסבב הזה. סבב ממוקד אחד בו יעשה יותר מעוד עשר שאלות מעורבות.":"المسائل اللفظيّة كانت الموضوع الأصعب في هذه الجولة. جولة واحدة مركّزة فيه تنفع أكثر من عشرة أسئلة مختلطة.","בפרופורציה a:b = c:x מתקיים a·x = b·c.":"في التناسب a:b = c:x يتحقّق a·x = b·c.","בשביל ללמוד מזה, לא בשביל הציון.":"للتعلّم منه، لا من أجل العلامة.","גודל האותיות":"حجم الحروف","גיאומטריה":"هندسة","גם על המספר וגם על ה-x. זו הטעות הכי נפוצה כאן.":"على العدد وعلى الـ x معًا. وهذا أشيع خطأ هنا.","דיוק":"دقّة","דיוק כולל":"دقّة إجماليّة","דיסקרימיננטה":"مميّز","דף הנוסחאות פתוח לאורך כל המבחן.":"ورقة القوانين مفتوحة طوال الامتحان.","האיבר האמצעי אחרי סידור":"الحدّ الأوسط بعد الترتيب","האלכסון של מלבן הוא היתר במשולש ישר זווית שצלעותיו הן האורך והרוחב.":"قطر المستطيل هو الوتر في مثلّث قائم الزاوية ضلعاه الطول والعرض.","האלכסון של מלבן יוצר משולש ישר זווית שצלעותיו הן שתי צלעות המלבן.":"قطر المستطيل يكوّن مثلّثًا قائم الزاوية ضلعاه ضلعا المستطيل.","האמצעי הוא סכום, האחרון הוא מכפלה.":"الأوسط مجموع، والأخير جداء.","הגבלת זמן:":"تحديد الوقت:","הגדרות טריגונומטריות":"تعريفات مثلّثيّة","הגובה חייב להיות מאונך לבסיס.":"يجب أن يكون الارتفاع عموديًّا على القاعدة.","הדבקת קוד תשובות":"إلصاق رمز الإجابات","ההסתברות למאורע המקורי":"احتمال الحدث الأصليّ","ההקראה בקול המכשיר. יש קול טבעי שנשמע כמו אדם":"القراءة بصوت الجهاز. وهناك صوت طبيعيّ يشبه صوت إنسان","הופכים את השבר השני — מונה ומכנה מתחלפים — ומכפילים.":"نقلب الكسر الثاني — البسط والمقام يتبادلان — ثمّ نضرب.","החזקה החיצונית חלה על כל מה שבסוגריים":"الأُسّ الخارجيّ يسري على كلّ ما بين القوسين","החזקה חלה על כל גורם בתוך הסוגריים, כולל המקדם.":"الأُسّ يسري على كلّ عامل داخل القوسين، بما في ذلك المعامل.","הישר y = mx + b":"المستقيم y = mx + b","הישר y = mx + b היה הנושא שהכי הפריע בסבב הזה. סבב ממוקד אחד בו יעשה יותר מעוד עשר שאלות מעורבות.":"المستقيم y = mx + b كان الموضوع الأصعب في هذه الجولة. جولة واحدة مركّزة فيه تنفع أكثر من عشرة أسئلة مختلطة.","היתר הוא הצלע מול הזווית הישרה: a² + b² = c².":"الوتر هو الضلع المقابل للزاوية القائمة: a² + b² = c².","היתר הוא הצלע שמול הזווית הישרה — תמיד הארוכה ביותר. כאן היא הנעלם.":"الوتر هو الضلع المقابل للزاوية القائمة — وهو الأطول دائمًا. وهنا هو المجهول.","הכול נשמר במכשיר הזה בלבד.":"كلّ شيء يُحفَظ في هذا الجهاز وحده.","הכלל: xᵃ ÷ xᵇ = xᵃ⁻ᵇ. כל x במכנה מצמצם x אחד במונה.":"القاعدة: xᵃ ÷ xᵇ = xᵃ⁻ᵇ. كلّ x في المقام يختصر x واحدًا في البسط.","המבחן מוכן":"الامتحان جاهز","המונה הוא הניצב שליד הזווית, המכנה הוא היתר.":"البسط هو الضلع المجاور للزاوية، والمقام هو الوتر.","המונה הוא הניצב שמול הזווית, המכנה הוא היתר.":"البسط هو الضلع المقابل للزاوية، والمقام هو الوتر.","המונה הוא הניצב שמול הזווית, המכנה הוא הניצב שליד הזווית.":"البسط هو الضلع المقابل للزاوية، والمقام هو الضلع المجاور لها.","המכנה הוא תמיד הערך ההתחלתי — לא החדש.":"المقام هو دائمًا القيمة الابتدائيّة — لا الجديدة.","המכנה הוא תמיד סך כל האפשרויות.":"المقام هو دائمًا مجموع كلّ الإمكانيّات.","המכנים כבר שווים":"المقامان متساويان أصلًا","המסלול שלי":"مساري","המספר שבחוץ מוכפל בכל אחד מהאיברים בפנים — בלי לדלג.":"العدد الخارجيّ يُضرب بكلّ حدّ في الداخل — بلا تخطٍّ.","המספר שבחוץ מוכפל בכל אחד משני האיברים שבפנים.":"العدد الخارجيّ يُضرب بكلّ من الحدّين في الداخل.","המספרים כאן הם כלי עבודה, לא ציון.":"الأرقام هنا أداة عمل، لا علامة.","המספרים לכיוונים הפוכים, אז מחסרים את הקטן מהגדול והתוצאה מקבלת את הסימן של הגדול.":"العددان في اتّجاهين متعاكسين، لذلك نطرح الأصغر من الأكبر وتأخذ النتيجة إشارة الأكبر.","הנוסחה":"القانون","הנוסחה המשולשת":"القانون الثلاثيّ","הסוגריים אומרים: כל מה שבפנים מוכפל במה שבחוץ. בלי לדלג על האיבר השני.":"القوسان يقولان: كلّ ما في الداخل يُضرب بما في الخارج. بلا تخطّي الحدّ الثاني.","הסתברות":"احتمال","הסתברות = כמה מקרים מתאימים, חלקי כמה מקרים אפשריים בסך הכול.":"الاحتمال = عدد الحالات الملائمة، على عدد الحالات الممكنة إجمالًا.","הסתברות = מבוקש חלקי הכול":"الاحتمال = المطلوب على الكلّ","הסתברות היה הנושא שהכי הפריע בסבב הזה. סבב ממוקד אחד בו יעשה יותר מעוד עשר שאלות מעורבות.":"الاحتمال كان الموضوع الأصعب في هذه الجولة. جولة واحدة مركّزة فيه تنفع أكثر من عشرة أسئلة مختلطة.","העתקת הקוד":"نسخ الرمز","העתקת הקישור":"نسخ الرابط","הפעולה ההפוכה לכפל היא חילוק.":"العمليّة العكسيّة للضرب هي القسمة.","הפתרון, צעד אחר צעד":"الحلّ، خطوة بخطوة","הצעד הבא":"الخطوة التالية","הקוד מכיל את השם ואת התשובות שסימנתם — המורה מחשב את הציון אצלו מחדש.":"الرمز يحوي الاسم والإجابات التي اخترتموها — والمعلّم يحسب العلامة عنده من جديد.","הקול הטבעי מגיע מגוגל. נכנסים ל-":"الصوت الطبيعيّ يأتي من غوغل. ادخلوا إلى","הקישור לא נקרא":"تعذّرت قراءة الرابط","הקראה":"القراءة","השאלות מתחלקות שווה בשווה בין הנושאים שנבחרו.":"تُقسَم الأسئلة بالتساوي بين المواضيع المختارة.","השלימו את הפרופורציה":"أكملوا التناسب","השם שלכם":"اسمكم","התאמות לנבחנים":"تسهيلات للممتحَنين","התוצאה של הראשון לא משפיעה על השני, ולכן מכפילים הסתברויות.":"نتيجة الأوّل لا تؤثّر في الثاني، ولذلك نضرب الاحتمالين.","ולסיום":"وفي الختام","ומכאן: סכום = ממוצע · מספר האיברים.":"ومن هنا: المجموع = المتوسّط · عدد الحدود.","זה לקראת זה — המהירויות מתחברות. מרדף — מחסרים.":"أحدهما نحو الآخر — تُجمع السرعتان. أمّا المطاردة — فنطرح.","זו ההגדרה: מחלקים את הכול שווה בשווה בין כל האיברים.":"هذا هو التعريف: نقسم الكلّ بالتساوي بين جميع الحدود.","זו הנקודה שהכי הרבה נופלים בה: המכנה הוא הערך הישן, לא החדש.":"هذه النقطة التي يقع فيها الأكثرون: المقام هو القيمة القديمة، لا الجديدة.","זוויות מיוחדות":"زوايا خاصّة","חוק הפילוג":"قانون التوزيع","חוק הפילוג וכינוס איברים דומים":"قانون التوزيع وجمع الحدود المتشابهة","חוקי חזקות":"قوانين الأُسس","חוקי חזקות היה הנושא שהכי הפריע בסבב הזה. סבב ממוקד אחד בו יעשה יותר מעוד עשר שאלות מעורבות.":"قوانين الأُسس كانت الموضوع الأصعب في هذه الجولة. جولة واحدة مركّزة فيه تنفع أكثر من عشرة أسئلة مختلطة.","חזקה של חזקה":"أُسّ الأُسّ","חזקה של חזקה — מכפילים מעריכים":"أُسّ الأُسّ — نضرب الأُسّين","חזרה":"رجوع","חיבור שברים":"جمع الكسور","חיבור, כפל, חילוק ומשוואה עם שבר":"جمع وضرب وقسمة ومعادلة فيها كسر","חייבים מכנה משותף. אסור לחבר מונה עם מונה ומכנה עם מכנה.":"لا بدّ من مقام مشترك. ولا يجوز جمع بسط مع بسط ومقام مع مقام.","חילוק בשבר = כפל בשבר ההפוך":"القسمة على كسر = ضرب بالكسر المقلوب","חילוק בשבר הוא כפל בשבר ההפוך.":"القسمة على كسر هي ضرب بالكسر المقلوب.","חילוק חזקות":"قسمة الأُسس","חיסור זה חיבור של ההפך. אחרי זה שאלו: שני המספרים לאותו כיוון או לכיוונים הפוכים?":"الطرح هو جمع للمعاكس. وبعده اسألوا: هل العددان في الاتّجاه نفسه أم في اتّجاهين متعاكسين؟","חיסור של מספר זה חיבור של ההפך שלו. מינוס ומינוס נותנים פלוס.":"طرح عدد هو جمع معاكسه. وسالب مع سالب يعطيان موجبًا.","חיפוש נוסחה — למשל: שיפוע, פיתגורס, אחוז":"البحث عن قانون — مثلًا: ميل، فيثاغورس، نسبة","חישוב, פישוט וכינוס שורשים":"حساب وتبسيط وجمع الجذور","חציון":"الوسيط","חציון = האיבר האמצעי אחרי סידור. במספר זוגי של איברים — ממוצע שני האמצעיים.":"الوسيط = الحدّ الأوسط بعد الترتيب. وعند عدد زوجيّ من الحدود — متوسّط الحدّين الأوسطين.","חציון בלי סידור הוא טעות כמעט ודאית. מסדרים מהקטן לגדול.":"الوسيط بلا ترتيب خطأ شبه مؤكّد. نرتّب من الأصغر إلى الأكبر.","חשבו וצמצמו":"احسبوا واختصروا","טריגונומטריה":"حساب المثلّثات","טריגונומטריה היה הנושא שהכי הפריע בסבב הזה. סבב ממוקד אחד בו יעשה יותר מעוד עשר שאלות מעורבות.":"حساب المثلّثات كان الموضوع الأصعب في هذه الجولة. جولة واحدة مركّزة فيه تنفع أكثر من عشرة أسئلة مختلطة.","טרפז":"شبه منحرف","יחס":"نسبة","יחס ופרופורציה":"نسبة وتناسب","יחס ופרופורציה היה הנושא שהכי הפריע בסבב הזה. סבב ממוקד אחד בו יעשה יותר מעוד עשר שאלות מעורבות.":"النسبة والتناسب كانا الموضوع الأصعب في هذه الجولة. جولة واحدة مركّزة فيه تنفع أكثر من عشرة أسئلة مختلطة.","יחס לא משתנה כשמחלקים את שני חלקיו באותו מספר.":"النسبة لا تتغيّر عند قسمة طرفيها على العدد نفسه.","יסודות":"أساسيّات","יש מספר זוגי של איברים":"عدد الحدود زوجيّ","יתר, ניצב ואלכסון":"وتر وضلع قائم وقطر","כבר יש כאן חיבור.":"هنا جمع أصلًا.","כדי שהמורה יידע מי ענה. השם לא נשלח לשום שרת — הוא נכנס לתוך הקוד.":"ليعرف المعلّم من أجاب. لا يُرسَل الاسم إلى أيّ خادم — بل يدخل داخل الرمز.","כותבים את המשוואה":"نكتب المعادلة","כותבים את המשפט כביטוי":"نكتب الجملة كتعبير","כותבים את הנוסחה עם הנעלם":"نكتب القانون مع المجهول","כותבים את זה כחיבור אחד":"نكتب ذلك كجمع واحد","כותבים כפרופורציה":"نكتب على صورة تناسب","כינוס שורשים":"جمع الجذور","כל איבר בשני האגפים, כולל המספרים בלי שבר.":"كلّ حدّ في الطرفين، بما في ذلك الأعداد بلا كسر.","כל איבר בתוך הסוגריים מוכפל במספר שבחוץ — גם ה-x וגם המספר.":"كلّ حدّ داخل القوسين يُضرب بالعدد الخارجيّ — الـ x والعدد معًا.","כל איבר שעובר אגף מחליף סימן. מחלקים במקדם רק בסוף.":"كلّ حدّ ينتقل طرفًا يغيّر إشارته. ونقسم على المعامل في النهاية فقط.","כל ה-x לצד אחד":"كلّ الـ x إلى طرف واحد","כל המספרים לצד השני":"كلّ الأعداد إلى الطرف الآخر","כל השאלות נענו":"أُجيب عن كلّ الأسئلة","כל שאלה כאן מגיעה עם פתרון מלא שנפתח שלב אחרי שלב, ועם הסבר מדויק לטעות שעשיתם — לא רק ״לא נכון״. דף נוסחאות תמיד פתוח, הקראה קולית, ובלי טיימר שרודף אחריכם.":"كلّ سؤال هنا يأتي بحلّ كامل ينفتح خطوة بعد خطوة، وبشرح دقيق للخطأ الذي وقعتم فيه — لا مجرّد «غير صحيح». ورقة قوانين مفتوحة دائمًا، وقراءة صوتيّة، وبلا مؤقّت يطاردكم.","כל שאלה נפתחת לשלבים קטנים, בקצב שלכם":"كلّ سؤال ينفتح إلى خطوات صغيرة، بإيقاعكم أنتم","כללי סימנים":"قواعد الإشارات","כמה פתרונות יש למשוואה?":"كم حلًّا للمعادلة؟","כן, למחוק":"نعم، احذفوا","כנסו איברים דומים":"اجمعوا الحدود المتشابهة","כפל באלכסון.":"ضرب تقاطعيّ.","כפל וחילוק שברים":"ضرب الكسور وقسمتها","כפל חזקות":"ضرب الأُسس","כפל תמיד לפני חיבור, גם אם הוא כתוב אחריו.":"الضرب دائمًا قبل الجمع، حتّى لو كُتب بعده.","כפל, חילוק, חזקה של חזקה ומעריך שלילי":"ضرب وقسمة وأُسّ الأُسّ وأُسّ سالب","כשהיתר ידוע והניצב חסר — מחסרים: a² = c² − b².":"عندما يكون الوتر معلومًا والضلع القائم ناقصًا — نطرح: a² = c² − b².","כשיש שברים במשוואה — מכפילים את כל המשוואה במכנה המשותף, והם נעלמים.":"عندما تكون في المعادلة كسور — نضرب المعادلة كلّها بالمقام المشترك، فتختفي.","כשמחברים אגף לאגף, ה-y מתבטל כי יש +y ו-−y.":"عند جمع الطرف إلى الطرف يُلغى الـ y لأنّ هناك ‎+y و‑−y.","כששני המכנים זהים אין מה להרחיב — עוברים ישר למונים.":"عندما يتساوى المقامان لا شيء نوسّعه — ننتقل مباشرةً إلى البسوط.","כששניים נוסעים זה לקראת זה, המהירויות מתחברות ואז מחלקים את המרחק בסכום.":"عندما يسير اثنان أحدهما نحو الآخر، تُجمع السرعتان ثمّ نقسم المسافة على المجموع.","לא חובה":"غير إلزاميّ","לא חובה. זה נשמר רק במכשיר שלכם.":"غير إلزاميّ. يُحفَظ في جهازكم وحده.","לא יודע/ת":"لا أعرف","לא נמצאו קולות במכשיר":"لم يُعثَر على أصوات في الجهاز","לא נפתרו":"لم تُحلّ","לאפליקציה":"إلى التطبيق","לאפליקציה עצמה — לתרגול חופשי":"إلى التطبيق نفسه — لتدريب حرّ","להפעיל":"تشغيل","להשתמש בדף נוסחאות זו לא רמאות — גם בבגרות נותנים אחד. מי שלא מבזבז זיכרון על שינון, פנוי לחשוב.":"استخدام ورقة القوانين ليس غشًّا — ففي امتحان البجروت أيضًا تُعطى واحدة. ومن لا يُنفق ذاكرته على الحفظ، يبقى متفرّغًا للتفكير.","להתקדמות":"إلى التقدّم","לפי נושא":"حسب الموضوع","לפני ההגשה":"قبل التسليم","לציונים":"إلى العلامات","לשמוע דוגמה":"سماع نموذج","לתלמידי תיכון שלומדים אחרת":"لطلّاب الثانويّة الذين يتعلّمون بطريقة أخرى","מאורע יחיד, משלים ושני ניסויים":"حدث مفرد، ومتمّم، وتجربتان","מאורע משלים":"حدث متمّم","מאתגר":"متحدٍّ","מבודדים b":"نعزل b","מבודדים את b":"نعزل الـ b","מבודדים את d":"نعزل الـ d","מבודדים את הצלע":"نعزل الضلع","מבודדים נעלם אחד":"نعزل مجهولًا واحدًا","מבודדים נעלם אחד מהמשוואה הפשוטה, ומציבים אותו במשוואה השנייה.":"نعزل مجهولًا واحدًا من المعادلة البسيطة، ونعوّضه في المعادلة الثانية.","מבחן חדש":"امتحان جديد","מבחן כיתתי":"امتحان صفّيّ","מגדירים נעלם":"نعرّف المجهول","מדביקים כאן את הקוד שהתלמיד שלח בוואטסאפ. הציון מחושב מחדש מהתשובות עצמן, ולא נלקח ממה שהתלמיד כתב.":"ألصقوا هنا الرمز الذي أرسله الطالب عبر واتساب. تُحسب العلامة من جديد من الإجابات نفسها، ولا تُؤخذ ممّا كتبه الطالب.","מה היה נכון":"ما كان صحيحًا","מה כדאי לתרגל עכשיו":"ما يجدر التدرّب عليه الآن","מה לקחת מכאן":"ما نأخذه من هنا","מה שמותר בבחינה עצמה. ההקראה ודף הנוסחאות אינם רמז — הם כלי נגישות.":"ما هو مسموح في الامتحان نفسه. القراءة الصوتيّة وورقة القوانين ليستا تلميحًا — بل أداتا وصول.","מה שמחפשים הוא ה-x. כל משפט בשאלה הופך לשורה.":"ما نبحث عنه هو الـ x. وكلّ جملة في السؤال تتحوّل إلى سطر.","מהו החציון?":"ما الوسيط؟","מהו הממוצע של המספרים?":"ما متوسّط الأعداد؟","מהו הערך המדויק?":"ما القيمة الدقيقة؟","מהירות דיבור —":"سرعة الكلام —","מהמשוואה השנייה קל לבודד את y.":"من المعادلة الثانية يسهل عزل الـ y.","מוחק את ההתקדמות, ההגדרות והנושאים שנבחרו במכשיר הזה. אין דרך לשחזר.":"يحذف التقدّم والإعدادات والمواضيع المختارة في هذا الجهاز. ولا سبيل إلى الاستعادة.","מונה כפול מונה, מכנה כפול מכנה.":"بسط في بسط، ومقام في مقام.","מוסיפים למחיר המקורי":"نضيف إلى السعر الأصليّ","מוצאים אותם":"نجدهما","מוצאים מכנה משותף":"نجد مقامًا مشتركًا","מוציאים את מה שאפשר":"نُخرج ما يمكن إخراجه","מוציאים שורש":"نُخرج الجذر","מזהים את היתר":"نحدّد الوتر","מזהים את המקדמים":"نحدّد المعاملات","מזהים את הצלעות ביחס לזווית α":"نحدّد الأضلاع بالنسبة إلى الزاوية α","מזהים מה חסר":"نحدّد ما هو ناقص","מחברים את כל המספרים":"نجمع كلّ الأعداد","מחברים את שתי המשוואות":"نجمع المعادلتين","מחברים ומקבלים משוואה אחת":"نجمع فنحصل على معادلة واحدة","מחברים מקדמים":"نجمع المعاملات","מחיקת הכול":"حذف الكلّ","מחיקת המבחן":"حذف الامتحان","מחיר לפני ההנחה":"السعر قبل الحسم","מחליפים כל y בביטוי שקיבלנו.":"نستبدل كلّ y بالتعبير الذي حصلنا عليه.","מחלקים את שני איברי היחס באותו מספר עד שאין להם מחלק משותף.":"نقسم طرفَي النسبة على العدد نفسه حتّى لا يبقى لهما قاسم مشترك.","מחלקים את שני האגפים":"نقسم الطرفين","מחלקים באחוז שנשאר. לא מוסיפים חזרה את אותו אחוז.":"نقسم على النسبة المتبقّية. ولا نعيد إضافة النسبة نفسها.","מחלקים בכמות":"نقسم على الكمّيّة","מחלקים בלי הסימנים.":"نقسم بلا إشارات.","מחלקים במקדם":"نقسم على المعامل","מחלקים במקדם של x":"نقسم على معامل الـ x","מחלקים בשיעור שנשאר":"نقسم على النسبة المتبقّية","מחסרים את המעריך של המכנה.":"نطرح أُسّ المقام.","מחסרים מהמחיר המקורי":"نطرح من السعر الأصليّ","מחסרים מעריכים":"نطرح الأُسّين","מחפשים את הניצב שליד הזווית, והיתר ידוע — לכן cos.":"نبحث عن الضلع المجاور للزاوية، والوتر معلوم — لذلك cos.","מחפשים את הניצב שמול הזווית, והיתר ידוע — לכן sin.":"نبحث عن الضلع المقابل للزاوية، والوتر معلوم — لذلك sin.","מחפשים מחלק משותף":"نبحث عن قاسم مشترك","מחפשים ריבוע שלם שמתחבא בתוך המספר, ומוציאים רק את השורש שלו.":"نبحث عن مربّع كامل مختبئ داخل العدد، ونُخرج جذره وحده.","מחפשים ריבוע שלם שמתחלק במספר שבשורש.":"نبحث عن مربّع كامل يقسم العدد الذي تحت الجذر.","מחפשים שני מספרים":"نبحث عن عددين","מחפשים שני מספרים עם סכום ומכפלה נתונים.":"نبحث عن عددين مجموعهما وجداؤهما معطيان.","מחפשים שני מספרים שמכפלתם היא האיבר החופשי וסכומם הוא מינוס המקדם של x.":"نبحث عن عددين جداؤهما الحدّ الحرّ ومجموعهما سالب معامل الـ x.","מחשבים x":"نحسب x","מחשבים x ואז y":"نحسب x ثمّ y","מחשבים את גודל השינוי":"نحسب مقدار التغيّر","מחשבים את האיבר האחרון":"نحسب الحدّ الأخير","מחשבים את הדיסקרימיננטה":"نحسب المميّز","מחשבים את המקדם":"نحسب المعامل","מחשבים את הסכום הידוע":"نحسب المجموع المعلوم","מחשבים את השינוי":"نحسب التغيّر","מחשבים דיסקרימיננטה":"نحسب المميّز","מחשבים כל מכפלה":"نحسب كلّ جداء","מחשבים כמה שווה חלק אחד":"نحسب كم يساوي جزء واحد","מטרה אחת: להגיע למשוואה עם נעלם יחיד.":"هدف واحد: الوصول إلى معادلة بمجهول واحد.","מכנסים איברים דומים":"نجمع الحدود المتشابهة","מכפילים את החלק במספר השלם.":"نضرب الجزء بالعدد الصحيح.","מכפילים את המספר שבחוץ בכל איבר בפנים":"نضرب العدد الخارجيّ بكلّ حدّ في الداخل","מכפילים את המספרים בלי הסימנים.":"نضرب الأعداد بلا إشارات.","מכפילים את כל המשוואה במכנה המשותף":"نضرب المعادلة كلّها بالمقام المشترك","מכפילים באלכסון":"نضرب تقاطعيًّا","מכפילים בכל מנה":"نضرب بكلّ حصّة","מכפילים כל איבר בכל איבר":"نضرب كلّ حدّ بكلّ حدّ","מכפילים כל משוואה כך שמקדמי ה-y יהיו הפוכים.":"نضرب كلّ معادلة بحيث يصير معاملا الـ y متعاكسين.","מכפילים מונה ומכנה באותו מספר — ערך השבר לא משתנה.":"نضرب البسط والمقام بالعدد نفسه — وقيمة الكسر لا تتغيّر.","מכפילים משוואה במספר כך שמקדמי אחד הנעלמים יהיו הפוכים, ואז מחברים.":"نضرب معادلة بعدد بحيث يصير معاملا أحد المجهولين متعاكسين، ثمّ نجمع.","מכפלה מתאפסת כשאחד הגורמים מתאפס":"الجداء يساوي صفرًا عندما يساوي أحد العوامل صفرًا","מכפלת שני בינומים":"جداء ذوَي حدّين","מלבן, משולש, מעגל וטרפז":"مستطيل ومثلّث ودائرة وشبه منحرف","ממוצע = סכום ÷ מספר האיברים":"المتوسّط = المجموع ÷ عدد الحدود","ממוצע = סכום חלקי כמות":"المتوسّط = المجموع على الكمّيّة","ממוצע = סכום כל המספרים חלקי כמה מספרים יש.":"المتوسّط = مجموع كلّ الأعداد على عددها.","ממוצע וחציון":"المتوسّط والوسيط","ממוצע וחציון היה הנושא שהכי הפריע בסבב הזה. סבב ממוקד אחד בו יעשה יותר מעוד עשר שאלות מעורבות.":"المتوسّط والوسيط كانا الموضوع الأصعب في هذه الجولة. جولة واحدة مركّزة فيه تنفع أكثر من عشرة أسئلة مختلطة.","ממוצע כפול כמות = הסכום הכולל. משם מחסרים את מה שכבר ידוע.":"المتوسّط في الكمّيّة = المجموع الكلّيّ. ومنه نطرح ما هو معلوم أصلًا.","ממוצע, חציון ומספר חסר":"المتوسّط والوسيط وعدد ناقص","ממשיכים בטבלה":"نتابع في الجدول","מסכמים":"نجمع","מסכמים את הצד הימני":"نجمع الطرف الأيمن","מסלול":"مسار","מסמנים ב-x את הנעלם, וכותבים כל משפט כביטוי":"نرمز بـ x للمجهول، ونكتب كلّ جملة كتعبير","מסמנים באות אחת את מה שמחפשים, וכותבים כל משפט בשאלה כביטוי עם אותה אות.":"نرمز بحرف واحد لما نبحث عنه، ونكتب كلّ جملة في السؤال كتعبير بذلك الحرف.","מסמנים באות אחת בדיוק את מה שמחפשים.":"نرمز بحرف واحد بالضبط لما نبحث عنه.","מספר האיברים כפול הממוצע של הראשון והאחרון.":"عدد الحدود في متوسّط الأوّل والأخير.","מספר הוואטסאפ שלכם (לא חובה)":"رقم واتساب الخاصّ بكم (غير إلزاميّ)","מספר שאלות:":"عدد الأسئلة:","מספרים מכוונים":"أعداد موجّهة","מספרים מכוונים היה הנושא שהכי הפריע בסבב הזה. סבב ממוקד אחד בו יעשה יותר מעוד עשר שאלות מעורבות.":"الأعداد الموجّهة كانت الموضوع الأصعب في هذه الجولة. جولة واحدة مركّزة فيه تنفع أكثر من عشرة أسئلة مختلطة.","מעבירים את x שמאלה, והוא מחליף סימן.":"ننقل الـ x يسارًا، فيغيّر إشارته.","מעבירים את המספר לצד השני":"ننقل العدد إلى الطرف الآخر","מעגל":"دائرة","מעריך שלילי אינו מספר שלילי — הוא אומר שהחזקה יורדת למכנה.":"الأُسّ السالب ليس عددًا سالبًا — بل يعني أنّ القوّة تنزل إلى المقام.","מעריך שלילי ואפס":"أُسّ سالب وصفر","מעריך שלילי יורד למכנה":"الأُسّ السالب ينزل إلى المقام","מעריך שלילי מוריד למכנה, הוא לא הופך את הסימן.":"الأُسّ السالب يُنزل إلى المقام، ولا يقلب الإشارة.","מערכת משוואות":"جملة معادلات","מערכת שתי משוואות":"جملة معادلتين","מערכת שתי משוואות היה הנושא שהכי הפריע בסבב הזה. סבב ממוקד אחד בו יעשה יותר מעוד עשר שאלות מעורבות.":"جملة المعادلتين كانت الموضوع الأصعب في هذه الجولة. جولة واحدة مركّزة فيه تنفع أكثر من عشرة أسئلة مختلطة.","מפרקים למכפלה עם ריבוע שלם":"نحلّل إلى جداء فيه مربّع كامل","מצאו את משוואת הישר העובר בשתי הנקודות":"جِدوا معادلة المستقيم المارّ بالنقطتين","מצאו את שיפוע הישר העובר בנקודות":"جِدوا ميل المستقيم المارّ بالنقطتين","מציבים את x ואת y של הנקודה בתוך y = mx + b, ומשאירים את b כנעלם.":"نعوّض x و‑y الخاصّتين بالنقطة في y = mx + b، ونُبقي b مجهولًا.","מציבים את הנקודה במשוואת הישר":"نعوّض النقطة في معادلة المستقيم","מציבים את הערך המדויק":"نعوّض القيمة الدقيقة","מציבים בביטוי הראשון":"نعوّض في التعبير الأوّل","מציבים בהגדרה":"نعوّض في التعريف","מציבים בחזרה ומחברים.":"نعوّض من جديد ونجمع.","מציבים בנוסחת השורשים":"نعوّض في قانون الحلّ","מציבים ומוצאים y":"نعوّض فنجد y","מציבים חזרה":"نعوّض من جديد","מציירים את המצב":"نرسم الوضع","מציירים ומזהים משולש ישר זווית":"نرسم ونحدّد مثلّثًا قائم الزاوية","מצמצמים יחס בחילוק בשני האיברים, לא בחיסור.":"نختصر النسبة بالقسمة على الطرفين، لا بالطرح.","מצמצמים כל איבר":"نختصر كلّ حدّ","מקבלים משוואה עם נעלם אחד":"نحصل على معادلة بمجهول واحد","מקור הקול":"مصدر الصوت","מרחיבים את שני השברים":"نوسّع الكسرين","מרחק = מהירות · זמן. מכאן גם: מהירות = מרחק ÷ זמן, וזמן = מרחק ÷ מהירות.":"المسافة = السرعة · الزمن. ومن هنا أيضًا: السرعة = المسافة ÷ الزمن، والزمن = المسافة ÷ السرعة.","מרחק = מהירות כפול זמן. שווה לזכור את המשולש: D למעלה, v ו-t למטה.":"المسافة = السرعة في الزمن. ويجدر تذكّر المثلّث: D في الأعلى، و‑v و‑t في الأسفل.","מרכזים x בצד אחד ומספרים בצד השני":"نجمع الـ x في طرف والأعداد في الطرف الآخر","מרכזים את כל איברי ה-x בצד אחד ואת כל המספרים בצד השני. כל מעבר צד הופך סימן.":"نجمع كلّ حدود الـ x في طرف وكلّ الأعداد في الطرف الآخر. وكلّ انتقال بين الطرفين يقلب الإشارة.","משוואה ממעלה ראשונה":"معادلة من الدرجة الأولى","משוואה עם שברים":"معادلة فيها كسور","משוואה ריבועית":"معادلة تربيعيّة","משוואה ריבועית היה הנושא שהכי הפריע בסבב הזה. סבב ממוקד אחד בו יעשה יותר מעוד עשר שאלות מעורבות.":"المعادلة التربيعيّة كانت الموضوع الأصعب في هذه الجولة. جولة واحدة مركّزة فيه تنفع أكثر من عشرة أسئلة مختلطة.","משוואות ממעלה ראשונה":"معادلات من الدرجة الأولى","משוואות ממעלה ראשונה היה הנושא שהכי הפריע בסבב הזה. סבב ממוקד אחד בו יעשה יותר מעוד עשר שאלות מעורבות.":"معادلات الدرجة الأولى كانت الموضوع الأصعب في هذه الجولة. جولة واحدة مركّزة فيه تنفع أكثر من عشرة أسئلة مختلطة.","משוואת ישר":"معادلة مستقيم","משולש":"مثلّث","משולש הזוויות המיוחדות":"مثلّث الزوايا الخاصّة","משפט פיתגורס":"نظريّة فيثاغورس","משפט פיתגורס היה הנושא שהכי הפריע בסבב הזה. סבב ממוקד אחד בו יעשה יותר מעוד עשר שאלות מעורבות.":"نظريّة فيثاغورس كانت الموضوع الأصعب في هذه الجولة. جولة واحدة مركّزة فيه تنفع أكثر من عشرة أسئلة مختلطة.","מתחילים סבב":"نبدأ جولة","מתמטיקה לתיכון":"رياضيات للثانوية","מתמטיקה, צעד אחר צעד.":"رياضيات، خطوة بعد خطوة.","מתרגמים את המשפט למשוואה":"نترجم الجملة إلى معادلة","מתרגמים ממוצע למשוואה":"نترجم المتوسّط إلى معادلة","נוסחאות כפל מקוצר":"قوانين الضرب المختصر","נוסחת היקף מעגל":"قانون محيط الدائرة","נוסחת השורשים":"قانون الحلّ","נוסחת השיפוע":"قانون الميل","נוסחת שטח טרפז":"قانون مساحة شبه المنحرف","נוסחת שטח מלבן":"قانون مساحة المستطيل","נוסחת שטח מעגל":"قانون مساحة الدائرة","נוסחת שטח משולש":"قانون مساحة المثلّث","נזכרים בהגדרות":"نستذكر التعريفات","ניקוי הבחירה":"مسح الاختيار","נכון לבד":"صحيح وحدكم","נקודות":"نقاط","נשלח…":"يُرسَل…","נתונים":"معطيات","סבב ממוקד באחוזים":"جولة مركّزة في النِسَب المئويّة","סבב ממוקד בבעיות מילוליות":"جولة مركّزة في المسائل اللفظيّة","סבב ממוקד בהישר y = mx + b":"جولة مركّزة في المستقيم y = mx + b","סבב ממוקד בהסתברות":"جولة مركّزة في الاحتمال","סבב ממוקד בחוקי חזקות":"جولة مركّزة في قوانين الأُسس","סבב ממוקד בטריגונומטריה":"جولة مركّزة في حساب المثلّثات","סבב ממוקד ביחס ופרופורציה":"جولة مركّزة في النسبة والتناسب","סבב ממוקד בממוצע וחציון":"جولة مركّزة في المتوسّط والوسيط","סבב ממוקד במספרים מכוונים":"جولة مركّزة في الأعداد الموجّهة","סבב ממוקד במערכת שתי משוואות":"جولة مركّزة في جملة معادلتين","סבב ממוקד במשוואה ריבועית":"جولة مركّزة في المعادلة التربيعيّة","סבב ממוקד במשוואות ממעלה ראשונה":"جولة مركّزة في معادلات الدرجة الأولى","סבב ממוקד במשפט פיתגורס":"جولة مركّزة في نظريّة فيثاغورس","סבב ממוקד בסדרה חשבונית":"جولة مركّزة في المتتالية الحسابيّة","סבב ממוקד בפתיחת סוגריים":"جولة مركّزة في فكّ الأقواس","סבב ממוקד בשברים":"جولة مركّزة في الكسور","סבב ממוקד בשורשים":"جولة مركّزة في الجذور","סבב ממוקד בשטחים והיקפים":"جولة مركّزة في المساحات والمحيطات","סבב נוסף":"جولة أخرى","סדר פעולות":"ترتيب العمليّات","סדר פעולות: קודם כפל וחילוק, ורק אחר כך חיבור וחיסור.":"ترتيب العمليّات: أوّلًا الضرب والقسمة، وبعدهما فقط الجمع والطرح.","סדרה חשבונית":"متتالية حسابيّة","סדרה חשבונית היה הנושא שהכי הפריע בסבב הזה. סבב ממוקד אחד בו יעשה יותר מעוד עשר שאלות מעורבות.":"المتتالية الحسابيّة كانت الموضوع الأصعب في هذه الجولة. جولة واحدة مركّزة فيه تنفع أكثر من عشرة أسئلة مختلطة.","סוגריים בחזקה: כל גורם בפנים מקבל את החזקה. ובחזקה של חזקה — מכפילים.":"القوسان في الأُسّ: كلّ عامل في الداخل يأخذ الأُسّ. وفي أُسّ الأُسّ — نضرب.","סוגריים ← חזקות ← כפל וחילוק ← חיבור וחיסור":"أقواس ← أُسس ← ضرب وقسمة ← جمع وطرح","סוכמים את מספרי היחס, מחלקים בסכום כדי לדעת כמה שווה חלק אחד, ואז מכפילים.":"نجمع أعداد النسبة، ونقسم على المجموع لنعرف كم يساوي جزء واحد، ثمّ نضرب.","סופרים את המקרים המבוקשים":"نعدّ الحالات المطلوبة","סופרים את כל האפשרויות":"نعدّ كلّ الإمكانيّات","סופרים חלקים":"نعدّ الأجزاء","סופרים לאמצע":"نعدّ حتّى المنتصف","סיימתי — ליצירת הקוד":"انتهيتُ — لإنشاء الرمز","סיימתם":"انتهيتم","סימן אחד שלילי — התוצאה שלילית.":"إشارة سالبة واحدة — النتيجة سالبة.","סימנים שונים — מחסרים":"إشارتان مختلفتان — نطرح","סינוס, קוסינוס, טנגנס וזוויות מיוחדות":"جيب وجيب تمام وظلّ وزوايا خاصّة","סכום סדרה חשבונית":"مجموع متتالية حسابيّة","סכום סדרה חשבונית = מספר האיברים כפול הממוצע של הראשון והאחרון.":"مجموع المتتالية الحسابيّة = عدد الحدود في متوسّط الأوّل والأخير.","עברית":"العبرية","עד שיוזן מפתח — ההקראה תעבוד עם קול המכשיר.":"إلى أن يُدخَل مفتاح — ستعمل القراءة بصوت الجهاز.","עוד לא יצרתם מבחן. אפשר להתחיל מ״מבחן חדש״.":"لم تُنشئوا امتحانًا بعد. يمكن البدء من «امتحان جديد».","עוד לא תרגלתם נושאים. אחרי הסבב הראשון תופיע כאן תמונה.":"لم تتدرّبوا على مواضيع بعد. وبعد الجولة الأولى ستظهر هنا صورة.","עכשיו החיבור":"والآن الجمع","עכשיו הסימן":"والآن الإشارة","עכשיו שולחים את הקוד למורה.":"والآن أرسِلوا الرمز إلى المعلّم.","עם פתרון מודרך":"مع حلّ موجَّه","עצירה":"إيقاف","ערכת צבע":"مجموعة الألوان","פועלים על המונים בלבד":"نعمل على البسوط وحدها","פותחים ומכנסים":"نفكّ ونجمع","פותחים כל זוג סוגריים בנפרד":"نفكّ كلّ زوج أقواس على حدة","פותחים סוגריים בשני הצדדים":"نفكّ الأقواس في الطرفين","פירוק טרינום":"تحليل ثلاثيّ الحدود","פירוק לגורמים, נוסחת השורשים ודיסקרימיננטה":"التحليل إلى عوامل، وقانون الحلّ، والمميّز","פישוט שורש":"تبسيط جذر","פעולות עם מינוס וסדר פעולות":"عمليّات مع السالب وترتيب العمليّات","פרופורציה":"تناسب","פרטים":"تفاصيل","פשטו את הביטוי":"بسّطوا التعبير","פשטו את השורש":"بسّطوا الجذر","פשטו והציגו בלי מעריך שלילי":"بسّطوا واعرضوا بلا أُسّ سالب","פשטו לחזקה אחת":"بسّطوا إلى أُسّ واحد","פתוח תמיד — כמו בבגרות, וזה בסדר גמור":"مفتوحة دائمًا — كما في البجروت، ولا بأس بذلك إطلاقًا","פתחו את הסוגריים":"افكّوا الأقواس","פתחו וכנסו איברים דומים":"افكّوا واجمعوا الحدود المتشابهة","פתיחת סוגריים":"فكّ الأقواس","פתיחת סוגריים היה הנושא שהכי הפריע בסבב הזה. סבב ממוקד אחד בו יעשה יותר מעוד עשר שאלות מעורבות.":"فكّ الأقواس كان الموضوع الأصعب في هذه الجولة. جولة واحدة مركّزة فيه تنفع أكثر من عشرة أسئلة مختلطة.","פתרו בעזרת נוסחת השורשים":"حُلّوا بقانون الحلّ","פתרו בשיטת ההצבה":"حُلّوا بطريقة التعويض","פתרון אחד":"حلّ واحد","ציונים":"العلامات","צמצום יחס, חלוקה ביחס, פרופורציה":"اختصار النسبة، والتقسيم بنسبة، والتناسب","צמצמו את היחס":"اختصروا النسبة","צרו את המבחן":"أنشئوا الامتحان","צריך מפתח חינמי פעם אחת":"يلزم مفتاح مجّانيّ مرّة واحدة","קובע אילו נושאים יוצעו לכם. אפשר לשנות בכל רגע.":"يحدّد أيّ المواضيع تُعرَض عليكم. ويمكن التغيير في أيّ لحظة.","קובע אילו נושאים מוצגים כאן":"يحدّد أيّ المواضيع تُعرَض هنا","קודם הגודל":"أوّلًا المقدار","קודם כול — מסדרים":"قبل كلّ شيء — نرتّب","קודם כפל":"أوّلًا الضرب","קודם מכניסים את כל המספרים לצד אחד ואת ה-x לצד השני, ורק בסוף מחלקים במקדם.":"أوّلًا ننقل كلّ الأعداد إلى طرف والـ x إلى الطرف الآخر، وفي النهاية فقط نقسم على المعامل.","קודם פותחים את שני זוגות הסוגריים, ורק אחר כך אוספים x עם x ומספר עם מספר.":"أوّلًا نفكّ زوجَي الأقواس، وبعد ذلك فقط نجمع x مع x وعددًا مع عدد.","קודם פותחים את שני זוגות הסוגריים, ורק אחר כך מעבירים אגפים.":"أوّلًا نفكّ زوجَي الأقواس، وبعد ذلك فقط ننقل بين الطرفين.","קודם שיפוע משתי הנקודות, אחר כך מציבים אחת מהן כדי למצוא את b.":"أوّلًا الميل من النقطتين، ثمّ نعوّض إحداهما لإيجاد b.","קודמת":"السابق","קול המכשיר":"صوت الجهاز","קול טבעי":"صوت طبيعيّ","קוראים את הסימן של Δ":"نقرأ إشارة Δ","קיצור דרך שכדאי להכיר":"اختصار يجدر معرفته","קליטה":"استلام","קריאה ונגישות":"القراءة وسهولة الوصول","ראיתם את כל הדרך. בפעם הבאה תנסו לבד.":"رأيتم الطريق كاملًا. وفي المرّة القادمة جرّبوا وحدكم.","רמה":"المستوى","רמז":"تلميح","רמת הקושי בתרגול:":"مستوى الصعوبة في التدريب:","רק איברים מאותו סוג מתחברים: x עם x, מספר עם מספר.":"لا يُجمع إلّا ما كان من النوع نفسه: x مع x، وعدد مع عدد.","רק כשהבסיס זהה.":"فقط عندما يتطابق الأساس.","רק שורשים זהים מתחברים, ומחברים אך ורק את המקדמים שלפניהם.":"لا تُجمع إلّا الجذور المتطابقة، ولا يُجمع إلّا معاملاتها التي أمامها.","רק שורשים זהים מתחברים, ורק המקדמים משתנים.":"لا تُجمع إلّا الجذور المتطابقة، ولا تتغيّر إلّا المعاملات.","שאלות":"أسئلة","שאלות שנפתרו":"أسئلة حُلَّت","שבועיים אחרונים":"الأسبوعان الأخيران","שברים":"كسور","שברים היה הנושא שהכי הפריע בסבב הזה. סבב ממוקד אחד בו יעשה יותר מעוד עשר שאלות מעורבות.":"الكسور كانت الموضوع الأصعب في هذه الجولة. جولة واحدة مركّزة فيه تنفع أكثر من عشرة أسئلة مختلطة.","שווה לנסות את הקול הטבעי, או להתקין קול עברי: באנדרואיד דרך הגדרות ← נגישות ← טקסט לדיבור ← התקנת קולות, ובווינדוס דרך הגדרות ← שעה ושפה ← דיבור.":"يجدر تجربة الصوت الطبيعيّ، أو تثبيت صوت عربيّ: على أندرويد عبر الإعدادات ← تسهيلات الوصول ← تحويل النصّ إلى كلام ← تثبيت الأصوات، وعلى ويندوز عبر الإعدادات ← الوقت واللغة ← الكلام.","שווה לשנן — חוזר כמעט בכל שאלה.":"يجدر حفظه — يتكرّر في كلّ سؤال تقريبًا.","שורש הוא הפעולה ההפוכה להעלאה בריבוע.":"الجذر هو العمليّة العكسيّة للتربيع.","שורש ריבועי":"جذر تربيعيّ","שורש ריבועי הוא הפעולה ההפוכה להעלאה בריבוע.":"الجذر التربيعيّ هو العمليّة العكسيّة للتربيع.","שורש של מכפלה = מכפלת השורשים":"جذر الجداء = جداء الجذرين","שורש של מספר הוא המספר שכשמכפילים אותו בעצמו מקבלים אותו מספר.":"جذر عدد هو العدد الذي إذا ضُرب بنفسه أعطى ذلك العدد.","שורשים":"جذور","שורשים היה הנושא שהכי הפריע בסבב הזה. סבב ממוקד אחד בו יעשה יותר מעוד עשר שאלות מעורבות.":"الجذور كانت الموضوع الأصعب في هذه الجولة. جولة واحدة مركّزة فيه تنفع أكثر من عشرة أسئلة مختلطة.","שורשים שווים מתנהגים כמו משתנה":"الجذور المتطابقة تتصرّف كمتغيّر","שטח = אורך · רוחב":"المساحة = الطول · العرض","שטח בסמ״ר, היקף בס״מ.":"المساحة بالسم²، والمحيط بالسم.","שטח מלבן = אורך כפול רוחב. היקף = סכום כל ארבע הצלעות.":"مساحة المستطيل = الطول في العرض. والمحيط = مجموع الأضلاع الأربعة.","שטחים והיקפים":"مساحات ومحيطات","שטחים והיקפים היה הנושא שהכי הפריע בסבב הזה. סבב ממוקד אחד בו יעשה יותר מעוד עשר שאלות מעורבות.":"المساحات والمحيطات كانت الموضوع الأصعب في هذه الجولة. جولة واحدة مركّزة فيه تنفع أكثر من عشرة أسئلة مختلطة.","שיטת החיבור · שיטת ההצבה":"طريقة الجمع · طريقة التعويض","שיטת החיבור ושיטת ההצבה":"طريقة الجمع وطريقة التعويض","שימושי כשקל יותר לספור את מה שלא רוצים.":"مفيد عندما يكون عدّ ما لا نريده أسهل.","שיפוע":"ميل","שיפוע = הפרש ה-y חלקי הפרש ה-x, ותמיד באותו סדר בשני החיסורים.":"الميل = فرق الـ y على فرق الـ x، ودائمًا بالترتيب نفسه في الطرحين.","שיפוע = כמה ה-y משתנה חלקי כמה ה-x משתנה.":"الميل = مقدار تغيّر الـ y على مقدار تغيّر الـ x.","שיפוע, נקודת חיתוך ומשוואת ישר":"الميل، ونقطة التقاطع، ومعادلة المستقيم","שישה נושאים לפי מה שעדיין לא יושב. לחיצה פותחת תרגול ממוקד.":"ستّة مواضيع حسب ما لم يترسّخ بعد. والنقر يفتح تدريبًا مركّزًا.","שלב":"شلاف","שלב · מתמטיקה לתיכון, צעד אחר צעד":"شلاف · رياضيات للثانويّة، خطوة بعد خطوة","שלב א: מחשבים שיפוע":"الخطوة الأولى: نحسب الميل","שלב ב: מציבים נקודה אחת":"الخطوة الثانية: نعوّض نقطة واحدة","שליחה בוואטסאפ":"إرسال عبر واتساب","שליחה שוב":"إرسال مرّة أخرى","שליטה לפי נושא":"التمكّن حسب الموضوع","שם המבחן":"اسم الامتحان","שני איברים ידועים":"حدّان معلومان","שני המספרים לאותו כיוון, אז מחברים את הגדלים ושומרים על הסימן.":"العددان في الاتّجاه نفسه، لذلك نجمع المقدارين ونحافظ على الإشارة.","שני מאורעות בלתי תלויים":"حدثان مستقلّان","שני ניסויים בלתי תלויים":"تجربتان مستقلّتان","שני סימנים זהים — התוצאה חיובית.":"إشارتان متماثلتان — النتيجة موجبة.","שני פתרונות":"حلّان","שני רכבים נוסעים זה לקראת זה. בכל שעה המרחק ביניהם מצטמצם בסכום המהירויות.":"مركبتان تسيران إحداهما نحو الأخرى. وفي كلّ ساعة تتقلّص المسافة بينهما بمقدار مجموع السرعتين.","שפה":"اللغة","שקלים ביחס":"شواكل بنسبة","תמיד ביחס לזווית שנשאלתם עליה.":"دائمًا بالنسبة إلى الزاوية المسؤول عنها.","תנועה":"حركة","תנועה, גילים ותרגום משפט למשוואה":"حركة، وأعمار، وترجمة جملة إلى معادلة","תרגול ממוקד":"تدريب مركّز","תרגול ממוקד: מספרים מכוונים":"تدريب مركّز: أعداد موجّهة","תרגום בעיה למשוואה":"ترجمة مسألة إلى معادلة","״וגם״ בשני ניסויים בלתי תלויים — מכפילים את ההסתברויות.":"«وأيضًا» في تجربتين مستقلّتين — نضرب الاحتمالين.","״וגם״ מכפיל. ״או״ (זרים) מחבר.":"«وأيضًا» تضرب. و«أو» (لحدثين متنافيين) تجمع.","״מ־״ במתמטיקה זה כפל":"«من» في الرياضيات تعني ضربًا","״מול״ היא הצלע שמעבר לזווית, ״ליד״ היא הצלע שנוגעת בה, והיתר הוא מול הזווית הישרה.":"«المقابل» هو الضلع الذي عبر الزاوية، و«المجاور» هو الضلع الملامس لها، والوتر مقابل الزاوية القائمة.","סימנתם: −":"اخترتم: −","מעבירים את −x שמאלה, והוא מחליף סימן.":"ننقل الـ −x يسارًا، فيغيّر إشارته.","\" data-a=\"engine\" data-n=\"device\">קול המכשיר</button>":"\" data-a=\"engine\" data-n=\"device\">صوت الجهاز</button>","\" data-a=\"engine\" data-n=\"gemini\">קול טבעי</button>":"\" data-a=\"engine\" data-n=\"gemini\">صوت طبيعي</button>","\" data-bind=\"name\" placeholder=\"לא חובה\" />":"\" data-bind=\"name\" placeholder=\"اختياري\" />","$1 חלקי $2":"$1 على $2",", יוצרים מפתח ומדביקים אותו כאן. הוא נשמר במכשיר בלבד ולא נשלח לשום מקום חוץ מגוגל.</div></div>":"، أنشئ مفتاحًا والصقه هنا. يُحفظ على هذا الجهاز فقط ولا يُرسل إلى أي جهة سوى جوجل.</div></div>","1. איך לקרוא לכם?":"1. بماذا نناديك؟","1–4 לבחירה, רווח להקראה, H רמז, S פתרון":"1–4 للاختيار، مسافة للاستماع، H تلميح، S الحل","3. איך נוח לכם לקרוא?":"3. كيف يريحك أن تقرأ؟","<input id=\"nm\" class=\"field\" style=\"margin-top:12px\" maxlength=\"18\" placeholder=\"שם או כינוי\" value=\"":"<input id=\"nm\" class=\"field\" style=\"margin-top:12px\" maxlength=\"18\" placeholder=\"اسم أو لقب\" value=\"","אאודה":"آودي","אבגדהוש":"حنثرخجس","אוטונואה":"أوتونوي","אורוס":"أوروس","אותיות פשוטות ורחבות, בלי קישוטים":"حروف بسيطة وعريضة بلا زخرفة","אותיות רחבות יותר, בלי קישוטים":"حروف أعرض بلا زخرفة","אין דרך לשחזר קוד — הוא לא נשמר בשום מקום. מחיקת נתוני האתר בדפדפן מסירה אותו, ואיתם גם ההתקדמות והמבחנים.":"لا توجد طريقة لاستعادة الرمز — فهو غير محفوظ في أيّ مكان. مسح بيانات الموقع من المتصفّح يزيله، ومعه التقدّم والامتحانات.","אין פתרון":"لا حلّ","מה קרה ר":"طرحتم العدد","הוספתם":"أضفتم","העברתם את":"نقلتم","העברתם את −":"نقلتم −","לצד השני בלי להחליף סימן.":"إلى الطرف الآخر بلا تغيير الإشارة.","התייחסתם ל":"اعتبرتم","גם התייחסתם ל":"أيضًا اعتبرتم","כאילו הם":"وكأنّها","שקלים.":"شيكلًا.","שקלים במקום":"شيكلًا بدل","אחוזים.":"بالمئة.","הוא לא":"ليست","מהסכום.":"من المبلغ.","יחידות.":"وحدة.","אומר שהחלקים לא שווים.":"تعني أنّ الأجزاء غير متساوية.","חיברתם את":"جمعتم",". פרופורציה נפתרת בכפל באלכסון, לא בחיבור.":". التناسب يُحلّ بالضرب التبادليّ، لا بالجمع.","הכפלתם באלכסון אבל שכחתם לחלק ב":"ضربتم تبادليًّا لكنّكم نسيتم القسمة على","הכפלתם את האלכסון ההפוך. שימו לב איזה איבר לא ידוע.":"ضربتم القطر المعاكس. انتبهوا أيّ حدّ هو المجهول.","חיסרתם במקום להכפיל. פרופורציה עובדת בכפל, לא בחיבור.":"طرحتم بدل الضرب. التناسب يعمل بالضرب، لا بالجمع.","הפכתם את סדר האיברים. הסדר ביחס משנה.":"قلبتم ترتيب الحدود. الترتيب في النسبة مهمّ.","חיסרתם את אותו מספר משני האגפים. ביחס מצמצמים בחילוק, לא בחיסור.":"طرحتم العدد نفسه من الطرفين. في النسبة نختصر بالقسمة، لا بالطرح.","זה הערך של פונקציה אחרת או של זווית אחרת בטבלת הזוויות המיוחדות.":"هذه قيمة دالّة أخرى أو زاوية أخرى في جدول الزوايا الخاصّة.",", שזה הערך של הפונקציה השנייה בזווית הזו.":"، وهي قيمة الدالّة الثانية في هذه الزاوية.","השתמשתם ב-√":"استخدمتم √","השתמשתם בהגדרה של פונקציה טריגונומטרית אחרת.":"استخدمتم تعريف دالّة مثلّثيّة أخرى.","זו ההגדרה של cos. ב-tan אין יתר בכלל — מול חלקי ליד.":"هذا تعريف cos. في tan لا وجود للوتر إطلاقًا — المقابل على المجاور.","זו מידת הזווית במעלות, לא אורך צלע.":"هذا قياس الزاوية بالدرجات، وليس طول ضلع.","התבלבלתם בין הניצב שמול הזווית לניצב שלידה.":"خلطتم بين الضلع المقابل للزاوية والضلع المجاور لها.","הכפלתם ביתר במקום לקחת ממנו חלק. ניצב תמיד קצר מהיתר.":"ضربتم بالوتر بدل أخذ جزء منه. الضلع القائم أقصر من الوتر دائمًا.","= x. המקדמים לא מסתכמים ל":"= x. المعاملات لا يبلغ مجموعها","אינו x/":"لا يساوي x/","חיברתם את המכנים: x/":"جمعتم المقامات: x/","חיברתם את השברים כאילו x/":"جمعتم الكسرين وكأنّ x/",". חיבור שברים לא מחבר מכנים.":". جمع الكسور لا يجمع المقامات.","לקחתם את ערך ה-y של הנקודה כ-b. b הוא מקום החיתוך עם ציר y, כלומר הערך כש-x שווה":"أخذتم قيمة y للنقطة على أنّها b. الـ b هو موضع التقاطع مع محور y، أي القيمة عندما يكون x يساوي","לקחתם ערך y של נקודה כ-b במקום לחשב אותו.":"أخذتم قيمة y لنقطة على أنّها b بدل حسابه.","החלפתם בין השיפוע לבין ערך ה-x של הנקודה.":"بدّلتم بين الميل وقيمة x للنقطة.","השיפוע יצא בסימן הפוך — בדקו את סדר החיסור.":"خرج الميل بإشارة معاكسة — تحقّقوا من ترتيب الطرح.","הפכתם את השבר. השינוי ב-y הוא המונה, השינוי ב-x הוא המכנה.":"قلبتم الكسر. التغيير في y هو البسط، والتغيير في x هو المقام.","עצרתם אחרי החיסור בלי לחלק בהפרש ה-x.":"توقّفتم بعد الطرح دون القسمة على فرق x.","זה הפרש ה-x. הוא המכנה בנוסחה, לא השיפוע עצמו.":"هذا فرق x. هو المقام في القانون، وليس الميل نفسه.","חיסרתם את ה-y בסדר ההפוך, וגם לא חילקתם בהפרש ה-x.":"طرحتم قيمتَي y بالترتيب المعاكس، وأيضًا لم تقسموا على فرق x.","טעות סימן בבידוד b.":"خطأ إشارة عند عزل b.","טעות סימן כשבידדתם את b.":"خطأ إشارة عندما عزلتم b.","הנחתם ש-y שווה אפס. אין לזה בסיס במשוואות.":"افترضتم أنّ y تساوي صفرًا. لا أساس لذلك في المعادلات.","עצרתם לפני הוצאת השורש —":"توقّفتم قبل استخراج الجذر —","זה c², לא c.":"هو c²، وليس c.","זה a², צריך להוציא שורש.":"هذا a²، يجب استخراج الجذر.","שכחתם להוציא שורש בסוף.":"نسيتم استخراج الجذر في النهاية.","חיברתם את הניצבים. פיתגורס עובד על הריבועים, לא על הצלעות עצמן.":"جمعتم الضلعين القائمين. فيثاغورس يعمل على المربّعات، لا على الأضلاع نفسها.","חיסרתם את הצלעות עצמן במקום את הריבועים שלהן.":"طرحتم الأضلاع نفسها بدل مربّعاتها.","חיברתם. כשמחפשים ניצב מחסרים את ריבוע הניצב הידוע מריבוע היתר.":"جمعتم. عند البحث عن ضلع قائم نطرح مربّع الضلع القائم المعلوم من مربّع الوتر.","חיסרתם במקום לחבר.":"طرحتم بدل الجمع.","חיסרתם במקום לחבר. מחסרים רק כשמחפשים ניצב, לא יתר.":"طرحتم بدل الجمع. نطرح فقط عند البحث عن ضلع قائم، لا عن الوتر.","חיברתם במקום לחסר.":"جمعتم بدل الطرح.","חיסרתם. האלכסון הוא היתר, ולכן מחברים.":"طرحتم. القطر هو الوتر، لذلك نجمع.","חיברתם את הצלעות. האלכסון תמיד קצר מסכום שתי הצלעות.":"جمعتم الضلعين. القطر أقصر دائمًا من مجموع الضلعين.","הוצאתם את הגורם הריבועי בלי לחשב את השורש שלו.":"أخرجتم العامل المربّع دون حساب جذره.","הוצאתם מהשורש את המספר הריבועי עצמו במקום את השורש שלו.":"أخرجتم من الجذر العدد المربّع نفسه بدل جذره.","הכפלתם את שני החלקים. המספר שיצא מהשורש נשאר מוכפל בשורש שנשאר, לא מתמזג איתו.":"ضربتم الجزأين. العدد الذي خرج من الجذر يبقى مضروبًا بالجذر المتبقّي، ولا يندمج معه.","חיברתם גם את המספרים שבתוך השורש. השורש הוא ה״שם״ של האיבר — הוא לא משתנה.":"جمعتم أيضًا الأعداد داخل الجذر. الجذر هو «اسم» الحدّ — وهو لا يتغيّر.","העליתם את השורש בריבוע.":"ربّعتم الجذر.","זה כפול השורש.":"هذا ضِعف الجذر.",". שורש הוא לא חצי — הוא המספר שמוכפל בעצמו נותן":". الجذر ليس نصفًا — هو العدد الذي إذا ضُرب بنفسه يعطي","בחזקה של חזקה מכפילים מעריכים, לא מחברים.":"في أُسّ الأُسّ نضرب الأُسُس، ولا نجمعها.","הכפלתם את המעריכים.":"ضربتم الأُسُس.","הכפלתם את המעריכים. בכפל של אותו בסיס המעריכים מתחברים.":"ضربتم الأُسُس. في ضرب الأساس نفسه تُجمع الأُسُس.","הכפלתם את המעריכים במקום לחסר.":"ضربتم الأُسُس بدل طرحها.","חיברתם את המעריכים. חיבור שייך לכפל, ובחילוק מחסרים.":"جمعتم الأُسُس. الجمع يخصّ الضرب، وفي القسمة نطرح.","חיסרתם את המעריכים. חיסור שייך לחילוק, לא לכפל.":"طرحتم الأُسُس. الطرح يخصّ القسمة، لا الضرب.","חיסרתם בכיוון ההפוך. מחסרים את המעריך של המכנה מזה של המונה.":"طرحتم بالاتّجاه المعاكس. نطرح أُسّ المقام من أُسّ البسط.","הכפלתם גם את הבסיס. הבסיס נשאר x — רק המעריך משתנה.":"ضربتم الأساس أيضًا. الأساس يبقى x — الأُسّ وحده يتغيّر.","הכפלתם את המקדם במעריך במקום להעלות אותו בחזקה.":"ضربتم المعامل بالأُسّ بدل رفعه إلى الأُسّ.","קיבלתם מעריך שלילי והורדתם ממנו את המינוס. מעריך שלילי הופך לשבר, לא נעלם.":"حصلتم على أُسّ سالب وحذفتم منه الإشارة السالبة. الأُسّ السالب يتحوّل إلى كسر، ولا يختفي.","המינוס עבר למקדם. מעריך שלילי לא הופך את הסימן של הביטוי, אלא מוריד אותו למכנה.":"انتقلت الإشارة السالبة إلى المعامل. الأُسّ السالب لا يقلب إشارة المقدار، بل ينزله إلى المقام.",", לא רק על ה-x.":"، وليس على x وحده.","חיברתם מונה עם מונה ומכנה עם מכנה. בחיבור וחיסור שברים חייבים מכנה משותף.":"جمعتم بسطًا مع بسط ومقامًا مع مقام. في جمع الكسور وطرحها يلزم مقام مشترك.","חיברתם מונים ומכנים. בכפל מכפילים מונה במונה ומכנה במכנה.":"جمعتم البسوط والمقامات. في الضرب نضرب بسطًا ببسط ومقامًا بمقام.","חיברתם מונים ומכנים. זו לא הפעולה שנדרשה כאן.":"جمعتم البسوط والمقامات. ليست هذه العمليّة المطلوبة هنا.","המונים הוכפלו אבל המכנים חוברו.":"البسوط ضُربت لكنّ المقامات جُمعت.","פעלתם על המונים אבל השארתם את המכנה של השבר הראשון.":"أجريتم العمليّة على البسطين لكنّكم أبقيتم مقام الكسر الأوّل.","הפכתם את השבר. המבוקש נמצא במונה.":"قلبتم الكسر. المطلوب موجود في البسط.","הפכתם את השבר. שימו לב מה במונה ומה במכנה בהגדרה.":"قلبتم الكسر. انتبهوا ما هو في البسط وما هو في المقام في التعريف.","הפכתם את השבר השני. הופכים רק בחילוק, לא בכפל.":"قلبتم الكسر الثاني. نقلب في القسمة فقط، لا في الضرب.","הפכתם את שני השברים. הופכים רק את זה שאחרי סימן החילוק.":"قلبتم الكسرين. نقلب فقط الكسر الذي بعد إشارة القسمة.","הפכתם את השבר הראשון במקום את השני.":"قلبتم الكسر الأوّل بدل الثاني.","הכפלתם ישר בלי להפוך את השבר השני. בחילוק חייבים להפוך.":"ضربتم مباشرة دون قلب الكسر الثاني. في القسمة يجب القلب.","הכפלתם את השברים במקום לחבר או לחסר אותם.":"ضربتم الكسرين بدل جمعهما أو طرحهما.","חיברתם את שני השברים במקום להכפיל אותם.":"جمعتم الكسرين بدل ضربهما.","חיברתם את שני השברים במקום לחלק ביניהם.":"جمعتم الكسرين بدل القسمة بينهما.","מצאתם מכנה משותף, אבל לא הרחבתם את המונים. כשהמכנה גדל — גם המונה חייב לגדול באותו יחס.":"وجدتم مقامًا مشتركًا، لكنّكم لم توسّعوا البسوط. عندما يكبر المقام — يجب أن يكبر البسط بالنسبة نفسها.","הרחבתם רק את השבר הראשון. שני השברים צריכים להגיע למכנה המשותף.":"وسّعتم الكسر الأوّل فقط. على الكسرين معًا الوصول إلى المقام المشترك.","הרחבתם רק את השבר השני. שני השברים צריכים להגיע למכנה המשותף.":"وسّعتم الكسر الثاني فقط. على الكسرين معًا الوصول إلى المقام المشترك.","לקחתם את מכפלת המכנים כמכנה, אבל הרחבתם את המונים לפי המכנה המשותף — שני מכנים שונים באותו חישוב.":"أخذتم حاصل ضرب المقامين مقامًا، لكنّكم وسّعتم البسطين وفق المقام المشترك — مقامان مختلفان في الحساب نفسه.","התשובה יצאה הפוכה — מונה ומכנה התחלפו בסוף.":"خرجت الإجابة مقلوبة — تبادل البسط والمقام في النهاية.","הכפלתם במכנה המשותף אבל שכחתם לחלק בסוף במקדם של x.":"ضربتم بالمقام المشترك لكنّكم نسيتم القسمة في النهاية على معامل x.","חילקתם בכיוון ההפוך.":"قسمتم بالاتّجاه المعاكس.","חילקתם. מרחק = מהירות כפול זמן.":"قسمتم. المسافة = السرعة في الزمن.","חיברתם מהירות עם זמן. אלה גדלים שונים — הם לא מתחברים.":"جمعتم السرعة مع الزمن. هذان مقداران مختلفان — ولا يُجمعان.","חיסרתם מהירויות. חיסור מתאים למרדף באותו כיוון, לא לנסיעה זה לקראת זה.":"طرحتم السرعتين. الطرح يناسب المطاردة بالاتّجاه نفسه، لا السير أحدهما نحو الآخر.","התייחסתם רק לרכב אחד. כששניהם נוסעים זה לקראת זה — המהירויות מתחברות.":"أخذتم مركبة واحدة فقط. عندما تسيران إحداهما نحو الأخرى — تُجمع السرعتان.","מיותר — לא צריך לחצות את המרחק.":"بلا داعٍ — لا حاجة إلى تنصيف المسافة.","התייחסתם רק לקובייה אחת.":"أخذتم مكعّبًا واحدًا فقط.","חיברתם את מספרי הפאות במקום להכפיל אותם.":"جمعتم عددَي الوجوه بدل ضربهما.","חיברתם הסתברויות. חיבור מתאים ל״או״, כפל מתאים ל״וגם״.":"جمعتم الاحتمالات. الجمع يناسب «أو»، والضرب يناسب «و».","זו ההסתברות דווקא כן להוציא שחור. השאלה מבקשת את המשלים.":"هذا احتمال سحب الأسود تحديدًا. السؤال يطلب الحدث المتمّم.","חילקתם במספר הכדורים שאינם אדומים. המכנה הוא תמיד סך כל האפשרויות.":"قسمتم على عدد الكرات غير الحمراء. المقام هو دائمًا مجموع كلّ الإمكانيّات.","חילקתם במספר השחורים במקום בסך הכול.":"قسمتم على عدد السوداء بدل المجموع الكلّيّ.","חילקתם במספר הצבעים ולא במספר הכדורים.":"قسمتم على عدد الألوان لا على عدد الكرات.","זה הסכום של כל המספרים, לא המספר החסר.":"هذا مجموع كلّ الأعداد، وليس العدد الناقص.","זה הסכום. נשאר לחלק במספר האיברים.":"هذا المجموع. بقي أن تقسموا على عدد الحدود.","זה המספר הגדול ביותר, לא הממוצע.":"هذا أكبر عدد، وليس المتوسّط.","זה הממוצע, לא החציון.":"هذا المتوسّط، وليس الوسيط.","חילקתם במספר איברים שגוי — יש כאן":"قسمتم على عدد حدود خاطئ — يوجد هنا","חיסרתם את הממוצע מהסכום הידוע במקום להשתמש בסכום הכולל.":"طرحتم المتوسّط من المجموع المعروف بدل استعمال المجموع الكلّيّ.","הנחתם שהמספר החסר שווה לממוצע. זה נכון רק אם כל המספרים שווים.":"افترضتم أنّ العدد الناقص يساوي المتوسّط. هذا صحيح فقط إذا كانت كلّ الأعداد متساوية.","לקחתם את האיבר האמצעי לפי הסדר שבו הם נכתבו. חייבים קודם לסדר.":"أخذتم الحدّ الأوسط حسب ترتيب كتابتها. يجب الترتيب أوّلًا.","לקחתם רק אחד משני האיברים האמצעיים. במספר זוגי לוקחים את הממוצע שלהם.":"أخذتم واحدًا فقط من الحدّين الأوسطين. في عدد زوجيّ نأخذ متوسّطهما.","ספרתם מקום אחד יותר מדי אחרי הסידור.":"عددتم مرتبة واحدة زائدة بعد الترتيب.","חילקתם את הסכום בכל מספר בנפרד. קודם צריך לחלק במספר החלקים הכולל.":"قسمتم المبلغ على كلّ عدد على حدة. أوّلًا يجب القسمة على عدد الأجزاء الكلّيّ.","זה ההפרש הכולל לאורך כל הסדרה, לא ההפרש בין שני איברים עוקבים.":"هذا الفرق الكلّيّ على امتداد المتتالية، وليس الفرق بين حدّين متتاليين.","הכפלתם ב-n במקום ב-n מינוס":"ضربتم بـ n بدل n ناقص",". מהאיבר הראשון לאיבר ה":". من الحدّ الأوّل إلى الحدّ الـ","חילקתם ב-n. מספר הצעדים בין האיבר הראשון לאיבר ה":"قسمتم على n. عدد الخطوات بين الحدّ الأوّل والحدّ الـ","הכפלתם את האיבר הראשון ב-n.":"ضربتم الحدّ الأوّل بـ n.","עצמו, לא הסכום של כולם.":"نفسه، وليس مجموع كلّ الحدود.","לקחתם רק את האיבר הראשון.":"أخذتم الحدّ الأوّل فقط.","טעות בהזזת נקודה עשרונית — חלקתם ב":"خطأ في إزاحة الفاصلة العشريّة — قسمتم على","חילקתם את המספר באחוז. אחוז זה כפל בשבר, לא חילוק.":"قسمتم العدد على النسبة. النسبة المئويّة ضرب بكسر، لا قسمة.","חישבתם את גודל ההנחה או התוספת, אבל השאלה מבקשת את המחיר עצמו.":"حسبتم مقدار الحسم أو الإضافة، لكنّ السؤال يطلب السعر نفسه.","הלכתם לכיוון ההפוך — הוספתם במקום להוריד.":"ذهبتم بالاتّجاه المعاكس — أضفتم بدل أن تخفضوا.","הלכתם לכיוון ההפוך — הורדתם במקום להוסיף.":"ذهبتم بالاتّجاه المعاكس — خفضتم بدل أن تضيفوا.","למחיר אחרי ההנחה. אחוז שמורידים ואחוז שמוסיפים לא מבטלים זה את זה.":"إلى السعر بعد الحسم. النسبة التي تُخصم والنسبة التي تُضاف لا تُلغي إحداهما الأخرى.","חילקתם באחוז ההנחה במקום באחוז שנשאר.":"قسمتم على نسبة الحسم بدل النسبة المتبقّية.","חילקתם בערך החדש. אחוז שינוי מחושב תמיד ביחס לערך ההתחלתי.":"قسمتم على القيمة الجديدة. نسبة التغيّر تُحسب دائمًا بالنسبة إلى القيمة الأصليّة.","זה גודל השינוי בשקלים, לא באחוזים.":"هذا مقدار التغيّر بالشيكل، لا بالنسبة المئويّة.","זה היחס בין המחירים. כדי לקבל את אחוז העלייה צריך להוריד":"هذه النسبة بين السعرين. للحصول على نسبة الارتفاع يجب طرح","זה ההיקף —":"هذا المحيط —","πr. שטח הוא πr².":"πr. المساحة هي πr².","זה השטח — πr². היקף הוא":"هذه المساحة — πr². المحيط هو","שכחתם את המכפלה ב":"نسيتم الضرب بـ",". ההיקף מחושב לפי הקוטר, שהוא פי שניים מהרדיוס.":". المحيط يُحسب وفق القطر، وهو ضِعف نصف القطر.","השתמשתם בקוטר במקום ברדיוס. בנוסחה r הוא הרדיוס — חצי מהקוטר.":"استخدمتم القطر بدل نصف القطر. في القانون r هو نصف القطر — نصف القطر الكامل.","זה ההיקף — סכום כל הצלעות. שטח הוא אורך כפול רוחב.":"هذا المحيط — مجموع كلّ الأضلاع. المساحة هي الطول في العرض.","חיברתם את הצלעות במקום להכפיל.":"جمعتم الأضلاع بدل ضربها.","הכפלתם במקום לחלק. כדי לחזור אחורה מנוסחת השטח מחלקים.":"ضربتم بدل القسمة. للعودة إلى الوراء من قانون المساحة نقسم.","חיסרתם. השטח נוצר מכפל, אז הפעולה ההפוכה היא חילוק.":"طرحتم. المساحة ناتجة عن ضرب، لذلك العمليّة العكسيّة هي القسمة.","חילקתם פעמיים.":"قسمتم مرّتين.","ללא צורך.":"بلا داعٍ.",". חצי מהמכפלה זה שטח משולש, לא מלבן.":". نصف حاصل الضرب هو مساحة مثلّث، لا مستطيل.",". משולש הוא בדיוק חצי מהמלבן שעוטף אותו.":". المثلّث هو بالضبط نصف المستطيل المحيط به.","הכפלתם את שני הבסיסים. בטרפז מחברים אותם, לא מכפילים.":"ضربتم القاعدتين. في شبه المنحرف نجمعهما، ولا نضربهما.","חישבתם רק את ממוצע הבסיסים בלי להכפיל בגובה.":"حسبتم متوسّط القاعدتين فقط دون الضرب بالارتفاع.","חישבתם ממוצע של הבסיס והגובה.":"حسبتم متوسّط القاعدة والارتفاع.","חישבתם משמאל לימין. כפל תמיד קודם לחיבור, גם אם הוא כתוב אחריו.":"حسبتم من اليسار إلى اليمين. الضرب يسبق الجمع دائمًا، حتّى لو كُتب بعده.","חיברתם את שלושת המספרים. באמצע יש כפל, ולא חיבור.":"جمعتم الأعداد الثلاثة. في الوسط ضرب، لا جمع.","חיברתם את שני המספרים במקום להכפיל. הסוגריים כאן מסמנים כפל.":"جمعتم العددين بدل ضربهما. القوسان هنا يدلّان على ضرب.","הכפלתם את הזוג הלא נכון. הכפל שכתוב הוא בין שני המספרים האחרונים.":"ضربتم الزوج الخطأ. الضرب المكتوب هو بين العددين الأخيرين.","הסימן התהפך. הכלל: שני סימנים זהים נותנים פלוס, סימנים שונים נותנים מינוס.":"انقلبت الإشارة. القاعدة: إشارتان متماثلتان تعطيان موجبًا، وإشارتان مختلفتان تعطيان سالبًا.","הפכתם את הסימן של התוצאה. שווה לבדוק שוב איזה מהמספרים גדול יותר בערכו המוחלט.":"قلبتم إشارة النتيجة. يستحقّ الأمر التحقّق مجدّدًا أيّ العددين أكبر بقيمته المطلقة.","טעות בגודל המכפלה. שווה לחשב שוב בלי הסימנים ורק אז להוסיף אותם.":"خطأ في مقدار حاصل الضرب. يستحقّ الأمر إعادة الحساب بلا إشارات ثمّ إضافتها.","חיסרתם בכיוון ההפוך — את המספר הראשון מהשני.":"طرحتم بالاتّجاه المعاكس — العدد الأوّل من الثاني.","החלפתם את סימן המכפלה בשלב החיבור.":"بدّلتم إشارة حاصل الضرب في مرحلة الجمع.","המספר לא החליף סימן כשעבר צד.":"العدد لم يغيّر إشارته عند انتقال الطرف.","עצרתם צעד מוקדם מדי — נשאר לחלק במקדם של x.":"توقّفتم قبل خطوة من النهاية — بقي أن تقسموا على معامل x.","הכפלתם במקדם במקום לחלק בו.":"ضربتم بالمعامل بدل القسمة عليه.","הסימן של התשובה התהפך בשלב החילוק.":"انقلبت إشارة الإجابة في مرحلة القسمة.","הסימן התהפך — כדאי לבדוק את החיסור של המקדמים.":"انقلبت الإشارة — يُستحسن التحقّق من طرح المعاملات.","חיברתם את מקדמי ה-x במקום לחסר אותם. איבר שעובר צד מחליף סימן.":"جمعتم معاملات x بدل طرحها. حدّ ينتقل إلى الطرف الآخر يغيّر إشارته.","חיברתם את מקדמי ה-x במקום לחסר. איבר שעובר צד מחליף סימן.":"جمعتم معاملات x بدل الطرح. حدّ ينتقل إلى الطرف الآخر يغيّر إشارته.","הכפלתם את מקדמי ה-x זה בזה במקום לחבר אותם.":"ضربتم معاملات x بعضها ببعض بدل جمعها.","בפתיחת הסוגריים בצד שמאל נשמר הסימן במקום להתהפך.":"عند فكّ القوسين في الطرف الأيسر بقيت الإشارة كما هي بدل أن تنقلب.","בסוגריים השניים הכפלתם רק את ה-x ולא את המספר.":"في القوسين الثانيين ضربتم x فقط ولم تضربوا العدد.","הכפלתם רק את ה-x ושכחתם להכפיל גם את המספר השני שבסוגריים.":"ضربتم x فقط ونسيتم ضرب العدد الثاني الذي بين القوسين.","טעות סימן כשפתחתם את הסוגריים השניים.":"خطأ إشارة عند فكّ القوسين الثانيين.","צמצמתם רק את האיבר השני. חייבים לחלק את שני האיברים באותו מספר."
