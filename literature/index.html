  Q("bk-1-03",{"he": "מהי עמדה מנומקת על יצירה?", "ar": "ما الرأي المعلَّل في عمل أدبي؟", "ru": "Что такое обоснованное мнение о произведении?", "en": "What is a reasoned opinion about a work?"},[{"he": "סיכום מלא של העלילה מן ההתחלה ועד הסוף, בלי לדלג על פרק", "ar": "تلخيص كامل للحبكة من البداية إلى النهاية دون تخطي أي فصل", "ru": "Полный пересказ сюжета от начала до конца без пропуска глав", "en": "A full summary of the plot from start to finish, skipping no chapter at all"}, {"he": "משפט כמו ״אהבתי״ או ״לא אהבתי״", "ar": "جملة مثل «أعجبني» أو «لم يعجبني»", "ru": "Фраза вроде «понравилось» или «не понравилось»", "en": "A sentence such as “I liked it” or “I didn’t”"}, {"he": "העתקה של דעת מבקר מן העיתון", "ar": "نسخ رأي ناقد من الصحيفة", "ru": "Пересказ мнения критика из газеты", "en": "Copying a critic’s view from a newspaper"}, {"he": "דעה אישית שנתמכת בדוגמה מן היצירה ובהסבר", "ar": "رأي شخصي مدعوم بمثال من العمل وبشرح", "ru": "Личное мнение с примером из текста и объяснением", "en": "A personal view backed by an example from the work and an explanation"}],3,{"he": "מה צריך להוסיף למילה ״לדעתי״ כדי שישכנע?", "ar": "ماذا نضيف إلى «برأيي» كي يُقنع؟", "ru": "Что нужно добавить к «по-моему», чтобы убедить?", "en": "What must follow “in my view” to make it convincing?"},{"he": "עמדה מנומקת בנויה משלושה חלקים: דעה, דוגמה מן היצירה, והסבר. הדוגמה מראה שהדעה נשענת על הטקסט. ההסבר מקשר בין השתיים.", "ar": "الرأي المعلّل من ثلاثة أجزاء: رأي، ومثال من العمل، وشرح. المثال يبيّن أن الرأي يستند إلى النص. والشرح يربط بينهما.", "ru": "Обоснованное мнение состоит из трёх частей: мнение, пример из текста, объяснение. Пример показывает опору на текст. Объяснение связывает их.", "en": "A reasoned opinion has three parts: a view, an example from the work, and an explanation. The example shows the view rests on the text. The explanation links the two."},null,[{"he": "סיכום מספר מה קרה, אבל אינו מביע עמדה.", "ar": "التلخيص يروي ما حدث، لكنه لا يعبّر عن رأي.", "ru": "Пересказ сообщает, что было, но не выражает мнения.", "en": "A summary tells what happened but gives no opinion."}, {"he": "יש כאן דעה, אבל אין נימוק ואין דוגמה.", "ar": "هنا رأي، لكن بلا تعليل ولا مثال.", "ru": "Мнение есть, но нет довода и примера.", "en": "There is an opinion, but no reason and no example."}, {"he": "זו דעה של אדם אחר, ולא עמדה של הכותב.", "ar": "هذا رأي شخص آخر، لا رأي الكاتب.", "ru": "Это мнение другого человека, а не своё.", "en": "That is someone else’s view, not the writer’s own."}, null]),
  Q("bk-1-04",{"he": "מה צריך כדי להשוות בין שתי יצירות?", "ar": "ماذا نحتاج لنقارن بين عملين؟", "ru": "Что нужно, чтобы сравнить два произведения?", "en": "What do you need to compare two works?"},[{"he": "קנה מידה משותף, כמו נושא או דמות, ודוגמה מכל יצירה", "ar": "معيار مشترك، كموضوع أو شخصية، ومثال من كل عمل", "ru": "Общий критерий, например тема или герой, и пример из каждого", "en": "A shared point, like a theme or character, and an example from each"}, {"he": "לספר את העלילה של כל יצירה בנפרד", "ar": "رواية حبكة كل عمل على حدة", "ru": "Пересказать сюжет каждого отдельно", "en": "Retell the plot of each work separately"}, {"he": "לכתוב איזו יצירה אהבתם יותר", "ar": "كتابة أي عمل أعجبكم أكثر", "ru": "Написать, какое понравилось больше", "en": "Write which work you liked more"}, {"he": "להשוות את מספר העמודים ואת שנת ההוצאה לאור של שני הספרים ולקבוע מי טוב יותר", "ar": "مقارنة عدد الصفحات وسنة النشر للكتابين وتحديد الأفضل منهما", "ru": "Сравнить число страниц и год издания обеих книг и решить, какая лучше", "en": "Compare the page count and year of publication of both books to decide which is better"}],0,{"he": "על מה בדיוק משווים? צריך משהו ששתי היצירות חולקות.", "ar": "على أي أساس نقارن؟ نحتاج شيئًا يشترك فيه العملان.", "ru": "По какому признаку сравнивать? Нужно то, что есть в обоих.", "en": "Compare on what exactly? You need something both works share."},{"he": "השוואה מתחילה בשאלה אחת ששתי היצירות עונות עליה. למשל: איך כל יצירה מציגה פרידה. אחר כך מביאים דוגמה מכל אחת ומראים דמיון או הבדל.", "ar": "تبدأ المقارنة بسؤال واحد يجيب عنه العملان. مثلًا: كيف يعرض كل عمل الفراق. ثم نأتي بمثال من كل منهما ونبيّن الشبه أو الاختلاف.", "ru": "Сравнение начинается с одного вопроса к обоим текстам. Например: как каждый показывает расставание. Затем даём пример из каждого и показываем сходство или разницу.", "en": "A comparison starts with one question both works answer. For example: how each work shows a parting. Then give an example from each and show a likeness or a difference."},null,[null, {"he": "שני סיכומים נפרדים אינם השוואה, כי אין ביניהם קשר.", "ar": "تلخيصان منفصلان ليسا مقارنة، لأنه لا صلة بينهما.", "ru": "Два отдельных пересказа — не сравнение: между ними нет связи.", "en": "Two separate summaries are not a comparison; nothing links them."}, {"he": "העדפה אישית אינה מראה במה היצירות דומות או שונות.", "ar": "التفضيل الشخصي لا يبيّن أوجه الشبه والاختلاف.", "ru": "Личный выбор не показывает сходства и различия.", "en": "A personal preference does not show how the works are alike or different."}, {"he": "עמודים ושנים אינם אומרים דבר על משמעות היצירה.", "ar": "عدد الصفحات والسنوات لا يقول شيئًا عن معنى العمل.", "ru": "Страницы и годы ничего не говорят о смысле.", "en": "Pages and years say nothing about a work’s meaning."}]),
  Q("bk-1-05",{"he": "מהו מניע של דמות?", "ar": "ما دافع الشخصية؟", "ru": "Что такое мотив персонажа?", "en": "What is a character’s motive?"},[{"he": "המעשה עצמו שהדמות עושה", "ar": "الفعل نفسه الذي تقوم به الشخصية", "ru": "Сам поступок героя", "en": "The action the character takes"}, {"he": "הסיבה שבגללה הדמות פועלת כפי שהיא פועלת", "ar": "السبب الذي يجعل الشخصية تتصرف كما تتصرف", "ru": "Причина, по которой герой поступает именно так", "en": "The reason a character acts the way it does"}, {"he": "התוצאה של המעשה בסוף הספר", "ar": "نتيجة الفعل في نهاية الكتاب", "ru": "Результат поступка в конце книги", "en": "The result of the action at the end of the book"}, {"he": "המקום והזמן שבהם מתרחשת העלילה, כמו עיר קטנה בשנות ה־50", "ar": "المكان والزمان اللذان تجري فيهما الحبكة، مثل بلدة صغيرة في الخمسينيات", "ru": "Место и время действия, например маленький город в 1950-е годы", "en": "The place and time of the plot, such as a small town in the 1950s"}],1,{"he": "חשבו על המילה ״למה״.", "ar": "فكروا في كلمة «لماذا».", "ru": "Подумайте о слове «почему».", "en": "Think about the word “why.”"},{"he": "מניע עונה על השאלה ״למה הדמות עשתה את זה?״. מניע יכול להיות פחד, אהבה, קנאה או חובה. כדי לנתח בחירה של דמות, מחפשים קודם את המניע.", "ar": "الدافع يجيب عن سؤال «لماذا فعلت الشخصية ذلك؟». قد يكون الدافع خوفًا أو حبًا أو غيرة أو واجبًا. لتحليل اختيار الشخصية نبحث أولًا عن الدافع.", "ru": "Мотив отвечает на вопрос «почему герой это сделал?». Это может быть страх, любовь, зависть или долг. Анализ выбора начинают с мотива.", "en": "A motive answers “why did the character do this?” It can be fear, love, jealousy or duty. To analyse a choice, look for the motive first."},null,[{"he": "המעשה הוא מה שהדמות עושה, והמניע הוא למה.", "ar": "الفعل هو ما تفعله الشخصية، والدافع هو لماذا.", "ru": "Поступок — что герой делает, а мотив — почему.", "en": "The action is what the character does; the motive is why."}, null, {"he": "התוצאה באה אחרי המעשה, והמניע בא לפניו.", "ar": "النتيجة تأتي بعد الفعل، والدافع يأتي قبله.", "ru": "Результат идёт после поступка, а мотив — до него.", "en": "The result comes after the action; the motive comes before it."}, {"he": "זה הרקע של העלילה, ולא הסיבה למעשה.", "ar": "هذه خلفية الحبكة، لا سبب الفعل.", "ru": "Это фон сюжета, а не причина поступка.", "en": "That is the setting, not the reason for an action."}]),
  Q("bk-1-06",{"he": "מה נחשב ראיה בתשובה על ספר קריאה?", "ar": "ما الذي يُعدّ قرينة في إجابة عن كتاب قراءة؟", "ru": "Что считается доказательством в ответе о прочитанной книге?", "en": "What counts as evidence in an answer about a reading book?"},[{"he": "דעה של חבר שקרא את הספר", "ar": "رأي صديق قرأ الكتاب", "ru": "Мнение друга, который читал книгу", "en": "The opinion of a friend who read the book"}, {"he": "תקציר קצר שמצאתם באינטרנט ומסביר את כל הספר בכמה שורות", "ar": "ملخص قصير وجدتموه على الإنترنت يشرح الكتاب كله في بضعة أسطر", "ru": "Краткое изложение из интернета, где вся книга в нескольких строках", "en": "A short summary found online that explains the whole book in a few lines"}, {"he": "פרט מדויק מן היצירה: מעשה, משפט או תיאור", "ar": "تفصيل دقيق من العمل: فعل أو جملة أو وصف", "ru": "Точная деталь из текста: поступок, фраза или описание", "en": "An exact detail from the work: an action, a line or a description"}, {"he": "תחושה כללית שהייתה לכם בזמן הקריאה", "ar": "شعور عام راودكم أثناء القراءة", "ru": "Общее чувство, которое было при чтении", "en": "A general feeling you had while reading"}],2,{"he": "האם אפשר להצביע על המקום בספר?", "ar": "هل يمكن الإشارة إلى الموضع في الكتاب؟", "ru": "Можно ли указать место в книге?", "en": "Can you point to the place in the book?"},{"he": "ראיה היא משהו שאפשר למצוא בתוך היצירה. זה יכול להיות מעשה של דמות, משפט שנאמר או תיאור של מקום. לא צריך לצטט מילה במילה; מספיק לתאר את הפרט במדויק.", "ar": "القرينة شيء نجده داخل العمل. قد تكون فعلًا لشخصية، أو جملة قيلت، أو وصفًا لمكان. لا يلزم الاقتباس حرفيًا؛ يكفي وصف التفصيل بدقة.", "ru": "Доказательство можно найти в самом тексте. Это поступок героя, сказанная фраза или описание места. Цитировать дословно не нужно — достаточно точно описать деталь.", "en": "Evidence is something found inside the work. It can be a character’s action, a line spoken or a description of a place. No need to quote word for word; describe the detail precisely."},null,[{"he": "דעה של אדם אחר אינה פרט מתוך הטקסט.", "ar": "رأي شخص آخر ليس تفصيلًا من النص.", "ru": "Чужое мнение — не деталь текста.", "en": "Another person’s view is not a detail from the text."}, {"he": "תקציר הוא מקור חיצוני, ולא פרט מן היצירה עצמה.", "ar": "الملخص مصدر خارجي، لا تفصيل من العمل نفسه.", "ru": "Краткое изложение — внешний источник, а не текст.", "en": "A summary is an outside source, not a detail from the work."}, null, {"he": "תחושה חשובה, אבל צריך להראות מה בטקסט יצר אותה.", "ar": "الشعور مهم، لكن يجب أن نبيّن ما الذي صنعه في النص.", "ru": "Чувство важно, но нужно показать, что в тексте его вызвало.", "en": "A feeling matters, but you must show what in the text caused it."}])],
 [
  Q("lit-books-8282-3",{"he": "איזה תיאור מתאים לסצנת מפתח?", "ar": "أي وصف يناسب مشهد محوري؟", "ru": "Какое описание подходит к «Ключевая сцена»?", "en": "Which description fits key scene?"},[{"he": "רצף של מצב פתיחה, סיבוך ותוצאה שהמעשים מחברים ביניהם.", "ar": "تسلسل من وضع أولي وتعقيد ونتيجة تصل بينها الأفعال.", "ru": "Последовательность завязки, осложнения и исхода, связанная действиями.", "en": "An opening situation, complication and outcome linked by actions."},{"he": "דמות שפועלת לצד הדמות המרכזית ויכולה לחשוף בה צד חדש.", "ar": "شخصية تعمل بجانب الرئيسية وقد تكشف جانبًا جديدًا منها.", "ru": "Персонаж рядом с главным героем, помогающий раскрыть его иначе.", "en": "A character beside the central one who can reveal another side of them."},{"he": "רגע שבו החלטה או גילוי משנים את הכיוון של הסיפור או המחזה.", "ar": "لحظة يغيّر فيها قرار أو كشف مسار القصة أو المسرحية.", "ru": "Момент, когда решение или открытие меняет ход истории или пьесы.", "en": "A moment when a decision or revelation changes the course of the story or play."},{"he": "משפט על משמעות היצירה שדורש דוגמה והסבר מן הטקסט.", "ar": "قول عن معنى العمل يحتاج مثالًا وشرحًا من النص.", "ru": "Суждение о смысле произведения, требующее примера и объяснения из текста.", "en": "A statement about meaning that needs an example and explanation from the text."}],2,{"he": "חפשו את הפרט שמבדיל אותו מן האחרים.", "ar": "ابحثوا عن التفصيل الذي يميزه عن غيره.", "ru": "Ищите отличие от остальных вариантов.", "en": "Look for the detail that separates it from the others."},{"he": "בחרו רגע שהשלכותיו ניכרות גם אחריו.", "ar": "اختاروا لحظة تظهر آثارها فيما بعدها.", "ru": "Выберите момент, последствия которого видны дальше.", "en": "Choose a moment with consequences visible later."},null,[{"he": "זה מתאר את ציר העלילה, לא את סצנת מפתח.", "ar": "هذا يصف مسار الحبكة، لا مشهد محوري.", "ru": "Это описание «Линия сюжета», а не «Ключевая сцена».", "en": "That describes plot arc, not key scene."},{"he": "זה מתאר את דמות משנה, לא את סצנת מפתח.", "ar": "هذا يصف شخصية ثانوية، لا مشهد محوري.", "ru": "Это описание «Второстепенный персонаж», а не «Ключевая сцена».", "en": "That describes supporting character, not key scene."},null,{"he": "זה מתאר את טענה פרשנית, לא את סצנת מפתח.", "ar": "هذا يصف حجة تفسيرية، لا مشهد محوري.", "ru": "Это описание «Интерпретационный тезис», а не «Ключевая сцена».", "en": "That describes interpretive claim, not key scene."}])
 ,Q("lit-books-soc",{"he": "איזה תיאור מתאים לרקע חברתי?", "ar": "أي وصف يناسب الخلفية الاجتماعية؟", "ru": "Какое описание подходит к социальный фон?", "en": "Which description fits a social background?"},[{"he": "דמות מורכבת בעלת פנים רבות, המשתנה ומתפתחת לאורך כל היצירה מראשיתה ועד סופה.", "ar": "شخصية مركّبة متعددة الأوجه، تتغير وتتطور على امتداد العمل كله من بدايته إلى نهايته.", "ru": "Сложный многогранный персонаж, меняющийся и развивающийся на протяжении всего произведения от начала до конца.", "en": "A complex, many-sided character who changes and develops all through the work, from its beginning to its end."},{"he": "התנאים החברתיים שבהם חיות הדמויות ושמשפיעים על בחירותיהן.", "ar": "الظروف الاجتماعية التي تعيش فيها الشخصيات وتؤثر في خياراتها.", "ru": "Социальные условия, в которых живут герои и которые влияют на их выбор.", "en": "The social conditions the characters live in, which shape their choices."},{"he": "האופן הייחודי שבו הכותב בונה משפטים ובוחר מילים.", "ar": "الطريقة المميزة التي يبني بها الكاتب الجمل ويختار الكلمات.", "ru": "Своеобразная манера автора строить фразы и выбирать слова.", "en": "The writer's distinctive way of building sentences and choosing words."},{"he": "רגע של מתח גבוה בתוך פרק, גם אם אינו שיא היצירה כולה.", "ar": "لحظة توتر عالٍ داخل فصل، حتى إن لم تكن ذروة العمل كله.", "ru": "Момент высокого напряжения внутри главы, даже если это не кульминация всего произведения.", "en": "A moment of high tension within a chapter, even if not the whole work's climax."}],1,{"he": "מה מעצב את הבחירות של הדמויות מבחוץ?", "ar": "ما الذي يشكّل خيارات الشخصيات من الخارج؟", "ru": "Что формирует выбор героев извне?", "en": "What shapes the characters' choices from outside?"},{"he": "הרקע החברתי מסביר בחירות. למשל דמות שאינה יכולה ללמוד כי עליה לפרנס את המשפחה.", "ar": "الخلفية الاجتماعية تفسّر الخيارات. مثال: شخصية لا تستطيع الدراسة لأن عليها إعالة الأسرة.", "ru": "Социальный фон объясняет выбор. Например, герой не может учиться, потому что должен кормить семью.", "en": "The social background explains choices. For example, a character who cannot study because they must support the family."},null,[{"he": "זה מתאר את דמות עגולה, לא את רקע חברתי.", "ar": "هذا يصف الشخصية المركّبة، لا الخلفية الاجتماعية.", "ru": "Это описание «круглого персонажа», а не «социальный фон».", "en": "That describes a round character, not a social background."},null,{"he": "זה מתאר את סגנון, לא את רקע חברתי.", "ar": "هذا يصف الأسلوب، لا الخلفية الاجتماعية.", "ru": "Это описание «стиль», а не «социальный фон».", "en": "That describes a style, not a social background."},{"he": "זה מתאר את שיא מקומי, לא את רקע חברתי.", "ar": "هذا يصف ذروة محلية، لا الخلفية الاجتماعية.", "ru": "Это описание «локальную кульминацию», а не «социальный фон».", "en": "That describes a local peak, not a social background."}]),Q("lit-books-soc-use",{"he": "בספר קריאה, דמות מסרבת לעבודה מכובדת כי היא מתנגדת לערכי המעמד שאליו היא שייכת. איזו הבנה תסביר את בחירתה?", "ar": "في كتاب قراءة، ترفض شخصية عملًا محترمًا لأنها تعارض قيم الطبقة التي تنتمي إليها. أي فهم يفسّر خيارها؟", "ru": "В книге для чтения героиня отказывается от почётной работы, потому что не принимает ценности своего класса. Какое понимание объяснит её выбор?", "en": "In a reader, a character refuses a respectable job because she opposes the values of her class. Which understanding explains her choice?"},[{"he": "הבנת הרקע החברתי שבו היא חיה ופועלת", "ar": "فهم الخلفية الاجتماعية التي تعيش فيها وتعمل", "ru": "Понимание социального фона, в котором она живёт и действует", "en": "Understanding the social background in which she lives and acts"},{"he": "מניין מדויק של מספר הבתים בכל אחד מפרקי הספר", "ar": "عدّ دقيق لعدد الأبيات في كل فصل من فصول الكتاب", "ru": "Точный подсчёт числа строк в каждой главе книги", "en": "An exact count of the number of lines in every chapter of the book"},{"he": "זיהוי החריזה בסצנה המרכזית", "ar": "تحديد القافية في المشهد المركزي", "ru": "Определение рифмы в центральной сцене", "en": "Identifying the rhyme in the central scene"},{"he": "שינוי סדר הפרקים בספר", "ar": "تغيير ترتيب الفصول في الكتاب", "ru": "Изменение порядка глав в книге", "en": "Changing the chapter order in the book"}],0,{"he": "מה ידוע על העולם שבו הדמות חיה?", "ar": "ماذا نعرف عن العالم الذي تعيش فيه الشخصية؟", "ru": "Что известно о мире, в котором живёт героиня?", "en": "What is known about the world the character lives in?"},{"he": "בחירה של דמות מובנת מתוך עולמה. למשל סירוב לעבודה ברור כשמכירים את ערכי המעמד שהיא גדלה בו.", "ar": "خيار الشخصية يُفهم من عالمها. مثال: رفض العمل يصبح واضحًا عند معرفة قيم الطبقة التي نشأت فيها.", "ru": "Выбор героя понятен из его мира. Например, отказ от работы ясен, когда знаешь ценности класса, в котором она выросла.", "en": "A character's choice is understood from her world. For example, refusing a job becomes clear once you know the values of the class she grew up in."},null,[null,{"he": "מניין שורות אינו מסביר החלטה של דמות.", "ar": "عدّ الأسطر لا يفسّر قرار شخصية.", "ru": "Подсчёт строк не объясняет решения персонажа.", "en": "Counting lines does not explain a character's decision."},{"he": "חריזה שייכת לשירה, ולא להבנת מניעים בפרוזה.", "ar": "القافية تخص الشعر لا فهم الدوافع في النثر.", "ru": "Рифма относится к поэзии, а не к пониманию мотивов в прозе.", "en": "Rhyme belongs to poetry, not to understanding motives in prose."},{"he": "סדר הפרקים קבוע בספר; הבחירה היא של הדמות, לא של העימוד.", "ar": "ترتيب الفصول ثابت، والخيار للشخصية لا للتصفيف.", "ru": "Порядок глав фиксирован; выбор принадлежит героине, а не вёрстке.", "en": "Chapter order is fixed; the choice is the character's, not the layout's."}]),
  Q("bk-2-01",{"he": "בספר מקורי, נער מוצא ארנק מלא כסף. הוא מתלבט יומיים, ובסוף מחזיר אותו לבעליו. מה הנושא של הסיפור?", "ar": "في كتاب أصلي يجد فتى محفظة مليئة بالمال. يتردد يومين، ثم يعيدها إلى صاحبها. ما موضوع القصة؟", "ru": "В новой книге подросток находит кошелёк с деньгами. Два дня он сомневается, а потом возвращает его. Какова тема?", "en": "In an original book, a boy finds a wallet full of money. He hesitates for two days, then returns it. What is the theme?"},[{"he": "נער מוצא ארנק ומחזיר אותו אחרי יומיים לבעליו", "ar": "فتى يجد محفظة ويعيدها إلى صاحبها بعد يومين", "ru": "Подросток находит кошелёк и через два дня возвращает его", "en": "A boy finds a wallet and returns it to its owner two days later"}, {"he": "ארנקים", "ar": "المحافظ", "ru": "Кошельки", "en": "Wallets"}, {"he": "כסף", "ar": "المال", "ru": "Деньги", "en": "Money"}, {"he": "יושר מול פיתוי", "ar": "الأمانة في مواجهة الإغراء", "ru": "Честность против соблазна", "en": "Honesty against temptation"}],3,{"he": "מה הנער מרגיש ביומיים שבהם הוא מתלבט?", "ar": "بماذا يشعر الفتى في اليومين اللذين يتردد فيهما؟", "ru": "Что чувствует подросток в эти два дня?", "en": "What does the boy feel during his two days of doubt?"},{"he": "העלילה היא מציאת הארנק והחזרתו. הנושא הוא מה שההתלבטות מראה: מאבק בין רצון לבין מה שנכון. נושא נכתב כרעיון כללי, ולא כרשימת אירועים.", "ar": "الحبكة هي إيجاد المحفظة وإعادتها. والموضوع هو ما يكشفه التردد: صراع بين الرغبة وما هو صواب. الموضوع يُكتب فكرة عامة لا قائمة أحداث.", "ru": "Сюжет — находка и возврат кошелька. Тема — то, что показывает сомнение: борьба желания и правильного. Тему пишут как общую идею, а не как список событий.", "en": "The plot is finding and returning the wallet. The theme is what his doubt shows: a struggle between desire and what is right. A theme is a general idea, not a list of events."},null,[{"he": "זו העלילה, כלומר מה שקרה, ולא הרעיון.", "ar": "هذه هي الحبكة، أي ما حدث، لا الفكرة.", "ru": "Это сюжет, то есть события, а не идея.", "en": "That is the plot, what happened, not the idea."}, {"he": "ארנק הוא חפץ בעלילה, ולא רעיון כללי.", "ar": "المحفظة شيء في الحبكة، لا فكرة عامة.", "ru": "Кошелёк — предмет в сюжете, а не идея.", "en": "A wallet is an object in the plot, not a general idea."}, {"he": "הכסף הוא הפיתוי, אבל הנושא הוא ההתלבטות סביבו.", "ar": "المال هو الإغراء، لكن الموضوع هو التردد حوله.", "ru": "Деньги — соблазн, но тема — выбор вокруг них.", "en": "Money is the temptation, but the theme is the struggle around it."}, null]),
  Q("bk-2-02",{"he": "ספר מקורי נקרא ״הגשר״. בסופו שני אחים שלא דיברו שנים נפגשים שוב. מה המשמעות הסבירה ביותר של השם?", "ar": "كتاب أصلي عنوانه «الجسر». في نهايته يلتقي أخوان لم يتكلما سنوات. ما المعنى الأرجح للعنوان؟", "ru": "Новая книга называется «Мост». В конце два брата, которые годами не говорили, снова встречаются. Каков наиболее вероятный смысл названия?", "en": "An original book is called “The Bridge.” At the end, two brothers who had not spoken for years meet again. What is the most likely meaning of the title?"},[{"he": "הגשר מסמל חיבור מחודש בין האחים", "ar": "الجسر يرمز إلى صلة جديدة بين الأخوين", "ru": "Мост — символ нового сближения братьев", "en": "The bridge stands for the brothers reconnecting"}, {"he": "הספר עוסק בהנדסה ובבניית גשרים", "ar": "الكتاب عن الهندسة وبناء الجسور", "ru": "Книга об инженерном деле и строительстве мостов", "en": "The book is about engineering and building bridges"}, {"he": "השם הוא רק שם של מקום, ואין לו שום משמעות נוספת בסיפור", "ar": "العنوان مجرد اسم مكان، ولا معنى إضافيًا له في القصة", "ru": "Это просто название места, без всякого другого смысла в истории", "en": "The title is only a place name with no further meaning in the story"}, {"he": "השם מרמז שהאחים יריבו שוב", "ar": "العنوان يلمّح إلى أن الأخوين سيتشاجران مجددًا", "ru": "Название намекает, что братья снова поссорятся", "en": "The title hints the brothers will fight again"}],0,{"he": "מה עושה גשר בין שני צדדים של נהר?", "ar": "ماذا يفعل الجسر بين ضفتي النهر؟", "ru": "Что делает мост между берегами реки?", "en": "What does a bridge do between two banks of a river?"},{"he": "גשר מחבר בין שני צדדים. בסוף הספר שני אחים רחוקים נפגשים. לכן השם מסמל את החיבור ביניהם.", "ar": "الجسر يصل بين جانبين. في نهاية الكتاب يلتقي أخوان متباعدان. لذلك يرمز العنوان إلى الصلة بينهما.", "ru": "Мост соединяет два берега. В конце книги встречаются отдалившиеся братья. Поэтому название — символ их сближения.", "en": "A bridge joins two sides. At the end, two distant brothers meet. So the title stands for their reconnection."},null,[null, {"he": "אין בתיאור שום פרט על בנייה; הסיפור עוסק באחים.", "ar": "لا تفصيل في الوصف عن البناء؛ القصة عن الأخوين.", "ru": "В описании нет ничего о стройке; история о братьях.", "en": "Nothing here mentions building; the story is about brothers."}, {"he": "הסוף מקשר את השם לפגישה, ולכן יש לו משמעות נוספת.", "ar": "النهاية تربط العنوان باللقاء، فله معنى إضافي.", "ru": "Финал связывает название со встречей, значит, смысл есть.", "en": "The ending links the title to the meeting, so it has more meaning."}, {"he": "גשר מחבר בין שני צדדים, ולא מפריד ביניהם.", "ar": "الجسر يصل بين ضفتين ولا يفصل بينهما.", "ru": "Мост соединяет берега, а не разделяет их.", "en": "A bridge joins two sides; it does not split them."}]),
  Q("bk-2-03",{"he": "תלמידה כותבת: ״הדמות הראשית אמיצה״. איזה משפט ישלים את התשובה בצורה הטובה ביותר?", "ar": "تكتب طالبة: «الشخصية الرئيسية شجاعة». أي جملة تكمل الإجابة أفضل إكمال؟", "ru": "Ученица пишет: «Главная героиня смелая». Какая фраза лучше всего дополнит ответ?", "en": "A student writes: “The main character is brave.” Which sentence best completes the answer?"},[{"he": "כי ככה אני מרגישה", "ar": "لأنني أشعر بذلك", "ru": "Потому что я так чувствую", "en": "Because that is how I feel"}, {"he": "למשל, היא סיפרה את האמת מול הכיתה, אף שפחדה", "ar": "مثلًا، قالت الحقيقة أمام الصف رغم خوفها", "ru": "Например, она сказала классу правду, хотя боялась", "en": "For example, she told the truth to the class, though she was afraid"}, {"he": "גם כל שאר הדמויות בספר אמיצות מאוד, כל אחת בדרך אחרת", "ar": "وكل الشخصيات الأخرى في الكتاب شجاعة جدًا، كلٌّ بطريقته", "ru": "И все остальные герои книги очень смелые, каждый по-своему", "en": "All the other characters in the book are very brave too, each in a different way"}, {"he": "הספר מעניין ומומלץ לכולם", "ar": "الكتاب ممتع وأنصح به الجميع", "ru": "Книга интересная, советую всем", "en": "The book is interesting and I recommend it to all"}],1,{"he": "מה עשתה הדמות שמראה אומץ?", "ar": "ماذا فعلت الشخصية مما يُظهر الشجاعة؟", "ru": "Какой поступок героини показывает смелость?", "en": "What did the character do that shows courage?"},{"he": "טענה צריכה ראיה מן היצירה. מעשה מסוים של הדמות מוכיח את הטענה. המילים ״אף שפחדה״ מסבירות למה זה אומץ.", "ar": "الادعاء يحتاج قرينة من العمل. فعل محدد للشخصية يثبت الادعاء. وعبارة «رغم خوفها» تشرح لماذا هذه شجاعة.", "ru": "Утверждению нужен довод из текста. Конкретный поступок героини его доказывает. Слова «хотя боялась» объясняют, почему это смелость.", "en": "A claim needs evidence from the work. A specific action proves it. The words “though she was afraid” explain why it is courage."},null,[{"he": "תחושה אישית אינה ראיה מן הטקסט.", "ar": "الشعور الشخصي ليس قرينة من النص.", "ru": "Личное чувство — не доказательство из текста.", "en": "A personal feeling is not evidence from the text."}, null, {"he": "המשפט עובר לדמויות אחרות, ואינו מוכיח דבר על הדמות הראשית.", "ar": "الجملة تنتقل إلى شخصيات أخرى، ولا تثبت شيئًا عن الرئيسية.", "ru": "Фраза уходит к другим героям и ничего не доказывает о главной.", "en": "It moves to other characters and proves nothing about the main one."}, {"he": "המלצה היא דעה על הספר, ולא הוכחה לאומץ.", "ar": "التوصية رأي في الكتاب، لا دليل على الشجاعة.", "ru": "Рекомендация — мнение о книге, а не доказательство смелости.", "en": "A recommendation is an opinion on the book, not proof of courage."}]),
  Q("bk-2-04",{"he": "במחזה מקורי, אחות מסתירה מכתב מאחיה כדי להגן עליו. מה צריך להסביר כדי לנתח את הבחירה שלה?", "ar": "في مسرحية أصلية تخفي أخت رسالة عن أخيها لتحميه. ماذا يجب أن نشرح لنحلل اختيارها؟", "ru": "В новой пьесе сестра прячет от брата письмо, чтобы защитить его. Что нужно объяснить, чтобы разобрать её выбор?", "en": "In an original play, a sister hides a letter from her brother to protect him. What must be explained to analyse her choice?"},[{"he": "כמה מערכות יש במחזה", "ar": "كم فصلًا في المسرحية", "ru": "Сколько действий в пьесе", "en": "How many acts the play has"}, {"he": "באיזה צבע היה המכתב ומה היה כתוב על המעטפה שלו", "ar": "ما لون الرسالة وماذا كُتب على مغلّفها", "ru": "Какого цвета было письмо и что написано на конверте", "en": "What colour the letter was and what was written on its envelope"}, {"he": "מה הניע אותה, ומה המחיר של ההסתרה", "ar": "ما الذي دفعها، وما ثمن الإخفاء", "ru": "Что ею двигало и какова цена тайны", "en": "What drove her, and what the hiding costs"}, {"he": "אם היא דמות טובה או רעה, בלי נימוק", "ar": "هل هي شخصية طيبة أم شريرة، بلا تعليل", "ru": "Хорошая она или плохая, без объяснения", "en": "Whether she is good or bad, with no reason given"}],2,{"he": "כל בחירה יש לה סיבה, ויש לה גם תוצאה.", "ar": "لكل اختيار سبب، وله أيضًا نتيجة.", "ru": "У каждого выбора есть причина и последствия.", "en": "Every choice has a reason, and it also has a result."},{"he": "ניתוח בחירה עונה על שתי שאלות: למה הדמות בחרה, ומה הבחירה עלתה לה. האחות רוצה להגן, אבל ההסתרה עלולה לפגוע באמון. כך רואים את המורכבות שלה.", "ar": "تحليل الاختيار يجيب عن سؤالين: لماذا اختارت الشخصية، وماذا كلّفها الاختيار. الأخت تريد الحماية، لكن الإخفاء قد يضر بالثقة. هكذا نرى تعقيدها.", "ru": "Анализ выбора отвечает на два вопроса: почему герой так решил и чего это стоило. Сестра хочет защитить, но тайна может разрушить доверие. Так видна её сложность.", "en": "Analysing a choice answers two questions: why the character chose, and what it cost. The sister wants to protect, but hiding may damage trust. That shows her complexity."},null,[{"he": "מבנה המחזה אינו מסביר החלטה של דמות.", "ar": "بناء المسرحية لا يفسر قرار شخصية.", "ru": "Строение пьесы не объясняет решения героини.", "en": "The play’s structure does not explain a character’s decision."}, {"he": "פרטים חיצוניים כאלה אינם נוגעים למניע.", "ar": "مثل هذه التفاصيل الخارجية لا تمس الدافع.", "ru": "Такие внешние детали не касаются мотива.", "en": "Outside details like these do not touch on the motive."}, null, {"he": "שיפוט בלי נימוק אינו ניתוח של בחירה.", "ar": "الحكم بلا تعليل ليس تحليلًا للاختيار.", "ru": "Оценка без довода — не анализ выбора.", "en": "A judgment without reasons is not an analysis of a choice."}]),
  Q("bk-2-05",{"he": "תלמיד משווה בין שני ספרים. בשניהם דמות עוזבת את הבית. איזה משפט השוואה הוא הטוב ביותר?", "ar": "يقارن طالب بين كتابين. في كليهما تغادر شخصية البيت. أي جملة مقارنة هي الأفضل؟", "ru": "Ученик сравнивает две книги. В обеих герой уходит из дома. Какая фраза сравнения лучшая?", "en": "A student compares two books. In both, a character leaves home. Which comparison sentence is best?"},[{"he": "שני הספרים יפים", "ar": "الكتابان جميلان", "ru": "Обе книги красивые", "en": "Both books are nice"}, {"he": "בספר הראשון 200 עמודים ובספר השני 300 עמודים, כך שהשני ארוך יותר", "ar": "في الكتاب الأول 200 صفحة وفي الثاني 300 صفحة، فالكتاب الثاني أطول بكثير", "ru": "В первой книге 200 страниц, во второй 300, значит, вторая длиннее", "en": "The first book has 200 pages and the second 300, so the second is longer"}, {"he": "בספר הראשון יש עזיבה. בספר השני יש עזיבה", "ar": "في الكتاب الأول مغادرة. في الكتاب الثاني مغادرة", "ru": "В первой книге есть уход. Во второй книге есть уход", "en": "The first book has a leaving. The second book has a leaving"}, {"he": "בשניהם העזיבה היא בריחה, אבל רק באחד היא מובילה לצמיחה", "ar": "المغادرة في الكتابين هروب، لكنها تقود إلى النضج في أحدهما فقط", "ru": "В обеих книгах уход — бегство, но рост лишь в одной", "en": "In both, leaving is escape, but only one leads to growth"}],3,{"he": "איזה משפט אומר משהו על משמעות העזיבה, ולא רק שהיא קרתה?", "ar": "أي جملة تقول شيئًا عن معنى المغادرة، لا أنها حدثت فقط؟", "ru": "Какая фраза говорит о смысле ухода, а не только о том, что он был?", "en": "Which sentence says something about what the leaving means, not just that it happened?"},{"he": "המשפט הנכון מוצא מכנה משותף: העזיבה כבריחה. אחר כך הוא מצביע על הבדל: רק באחד היא מובילה לצמיחה. זו השוואה שמסבירה, ולא רק מונה.", "ar": "الجملة الصحيحة تجد قاسمًا مشتركًا: المغادرة هروب. ثم تشير إلى فرق: في أحدهما فقط تقود إلى النضج. هذه مقارنة تشرح ولا تعدّد فقط.", "ru": "Верная фраза находит общее: уход как бегство. Затем она указывает на разницу: рост есть лишь в одной книге. Это сравнение объясняет, а не перечисляет.", "en": "The right sentence finds common ground: leaving as escape. Then it points to a difference: only in one does it lead to growth. This comparison explains, not just lists."},null,[{"he": "זו התרשמות כללית, בלי דמיון או הבדל מוסבר.", "ar": "هذا انطباع عام، بلا شبه أو اختلاف مشروح.", "ru": "Это общее впечатление без объяснённого сходства или различия.", "en": "That is a general impression, with no likeness or difference explained."}, {"he": "אורך הספר אינו קשור לנושא העזיבה.", "ar": "طول الكتاب لا يرتبط بموضوع المغادرة.", "ru": "Объём книги не связан с темой ухода.", "en": "The length of the book has nothing to do with leaving home."}, {"he": "המשפט מציין עובדה פעמיים, אבל לא אומר מה משותף או שונה.", "ar": "الجملة تذكر واقعة مرتين، ولا تقول ما المشترك أو المختلف.", "ru": "Фраза дважды называет факт, но не говорит, что общее и что разное.", "en": "It states a fact twice but says nothing about what is shared or different."}, null]),
  Q("bk-2-06",{"he": "איזו פסקה היא עמדה מנומקת על סוף של ספר?", "ar": "أي فقرة هي رأي معلّل في نهاية كتاب؟", "ru": "Какой отрывок — обоснованное мнение о финале книги?", "en": "Which passage is a reasoned opinion about a book’s ending?"},[{"he": "הסוף מאכזב, כי הדמות מוותרת בלי מאבק, אחרי שנאבקה כל הספר", "ar": "النهاية مخيّبة، لأن الشخصية تستسلم بلا صراع بعد أن قاومت طوال الكتاب", "ru": "Финал разочаровывает: герой сдаётся без борьбы, хотя боролся всю книгу", "en": "The ending disappoints, since the hero gives up without a fight after fighting all book"}, {"he": "לא אהבתי את הסוף", "ar": "لم تعجبني النهاية", "ru": "Мне не понравился финал", "en": "I did not like the ending"}, {"he": "הסוף מאכזב, וכולם יודעים את זה", "ar": "النهاية مخيّبة، والجميع يعرف ذلك", "ru": "Финал разочаровывает, это все знают", "en": "The ending disappoints, and everyone knows it"}, {"he": "בסוף הדמות חוזרת הביתה, פוגשת את המשפחה, והספר נגמר בארוחה משותפת וארוכה", "ar": "في النهاية تعود الشخصية إلى البيت وتلتقي العائلة، وينتهي الكتاب بوجبة مشتركة طويلة", "ru": "В конце герой возвращается домой, встречает семью, и книга заканчивается долгим общим ужином", "en": "At the end the hero returns home, meets the family, and the book closes with a long shared meal"}],0,{"he": "חפשו פסקה שיש בה גם דעה וגם ״כי״ שמבוסס על הספר.", "ar": "ابحثوا عن فقرة فيها رأي و«لأن» مبنية على الكتاب.", "ru": "Ищите отрывок, где есть и мнение, и «потому что», опирающееся на книгу.", "en": "Look for a passage with both a view and a “because” based on the book."},{"he": "עמדה מנומקת כוללת דעה ונימוק מן היצירה. כאן הנימוק משווה בין הסוף לבין מה שהדמות עשתה לאורך הספר. זה הופך את הדעה לטענה שאפשר לבדוק.", "ar": "الرأي المعلّل يضم رأيًا وتعليلًا من العمل. هنا يقارن التعليل بين النهاية وما فعلته الشخصية طوال الكتاب. هذا يجعل الرأي ادعاء يمكن فحصه.", "ru": "Обоснованное мнение включает оценку и довод из текста. Здесь довод сравнивает финал с тем, что герой делал всю книгу. Так мнение становится проверяемым.", "en": "A reasoned opinion has a view and a reason from the work. Here the reason compares the ending with what the hero did all along. That turns the view into a claim you can check."},null,[null, {"he": "יש כאן עמדה, אבל אין נימוק.", "ar": "هنا رأي، لكن بلا تعليل.", "ru": "Здесь есть мнение, но нет довода.", "en": "There is a view here, but no reason."}, {"he": "״כולם יודעים״ אינו נימוק מן היצירה.", "ar": "«الجميع يعرف» ليس تعليلًا من العمل.", "ru": "«Все знают» — не довод из текста.", "en": "“Everyone knows” is not a reason drawn from the work."}, {"he": "זה סיכום של הסוף, בלי שום עמדה.", "ar": "هذا تلخيص للنهاية، بلا أي رأي.", "ru": "Это пересказ финала без всякого мнения.", "en": "That is a summary of the ending, with no opinion."}])],
 [
  Q("lit-books-8282-4",{"he": "איזה תיאור מתאים לטענה פרשנית?", "ar": "أي وصف يناسب حجة تفسيرية؟", "ru": "Какое описание подходит к «Интерпретационный тезис»?", "en": "Which description fits interpretive claim?"},[{"he": "רצף של מצב פתיחה, סיבוך ותוצאה שהמעשים מחברים ביניהם.", "ar": "تسلسل من وضع أولي وتعقيد ونتيجة تصل بينها الأفعال.", "ru": "Последовательность завязки, осложнения и исхода, связанная действиями.", "en": "An opening situation, complication and outcome linked by actions."},{"he": "דמות שפועלת לצד הדמות המרכזית ויכולה לחשוף בה צד חדש.", "ar": "شخصية تعمل بجانب الرئيسية وقد تكشف جانبًا جديدًا منها.", "ru": "Персонаж рядом с главным героем, помогающий раскрыть его иначе.", "en": "A character beside the central one who can reveal another side of them."},{"he": "רגע שבו החלטה או גילוי משנים את הכיוון של הסיפור או המחזה.", "ar": "لحظة يغيّر فيها قرار أو كشف مسار القصة أو المسرحية.", "ru": "Момент, когда решение или открытие меняет ход истории или пьесы.", "en": "A moment when a decision or revelation changes the course of the story or play."},{"he": "משפט על משמעות היצירה שדורש דוגמה והסבר מן הטקסט.", "ar": "قول عن معنى العمل يحتاج مثالًا وشرحًا من النص.", "ru": "Суждение о смысле произведения, требующее примера и объяснения из текста.", "en": "A statement about meaning that needs an example and explanation from the text."}],3,{"he": "חפשו את הפרט שמבדיל אותו מן האחרים.", "ar": "ابحثوا عن التفصيل الذي يميزه عن غيره.", "ru": "Ищите отличие от остальных вариантов.", "en": "Look for the detail that separates it from the others."},{"he": "טענה טובה אינה מסתיימת ב\"אהבתי\" אלא מציגה ראיה.", "ar": "الحجة الجيدة لا تكتفي بـ«أعجبني» بل تقدم دليلًا.", "ru": "Сильный тезис не сводится к «мне понравилось», а содержит доказательство.", "en": "A useful claim goes beyond \"I liked it\" and offers evidence."},null,[{"he": "זה מתאר את ציר העלילה, לא את טענה פרשנית.", "ar": "هذا يصف مسار الحبكة، لا حجة تفسيرية.", "ru": "Это описание «Линия сюжета», а не «Интерпретационный тезис».", "en": "That describes plot arc, not interpretive claim."},{"he": "זה מתאר את דמות משנה, לא את טענה פרשנית.", "ar": "هذا يصف شخصية ثانوية، لا حجة تفسيرية.", "ru": "Это описание «Второстепенный персонаж», а не «Интерпретационный тезис».", "en": "That describes supporting character, not interpretive claim."},{"he": "זה מתאר את סצנת מפתח, לא את טענה פרשנית.", "ar": "هذا يصف مشهد محوري، لا حجة تفسيرية.", "ru": "Это описание «Ключевая сцена», а не «Интерпретационный тезис».", "en": "That describes key scene, not interpretive claim."},null])
 ,Q("lit-books-style",{"he": "איזה תיאור מתאים לסגנון?", "ar": "أي وصف يناسب الأسلوب؟", "ru": "Какое описание подходит к стиль?", "en": "Which description fits a style?"},[{"he": "דמות מורכבת בעלת פנים רבות, המשתנה ומתפתחת לאורך היצירה.", "ar": "شخصية مركّبة متعددة الأوجه، تتغير وتتطور على امتداد العمل.", "ru": "Сложный многогранный персонаж, меняющийся и развивающийся на протяжении произведения.", "en": "A complex, many-sided character who changes and develops through the work."},{"he": "התנאים החברתיים שבהם חיות הדמויות ושמשפיעים על בחירותיהן.", "ar": "الظروف الاجتماعية التي تعيش فيها الشخصيات وتؤثر في خياراتها.", "ru": "Социальные условия, в которых живут герои и которые влияют на их выбор.", "en": "The social conditions the characters live in, which shape their choices."},{"he": "האופן הייחודי שבו הכותב בונה משפטים ובוחר מילים.", "ar": "الطريقة المميزة التي يبني بها الكاتب الجمل ويختار الكلمات.", "ru": "Своеобразная манера автора строить фразы и выбирать слова.", "en": "The writer's distinctive way of building sentences and choosing words."},{"he": "רגע של מתח גבוה בתוך פרק, גם אם אינו שיא היצירה כולה.", "ar": "لحظة توتر عالٍ داخل فصل، حتى إن لم تكن ذروة العمل كله.", "ru": "Момент высокого напряжения внутри главы, даже если это не кульминация всего произведения.", "en": "A moment of high tension within a chapter, even if not the whole work's climax."}],2,{"he": "מה מייחד כותב אחד ממשנהו באופן הכתיבה?", "ar": "ما الذي يميّز كاتبًا عن غيره في طريقة الكتابة؟", "ru": "Что отличает одного автора от другого в манере письма?", "en": "What distinguishes one writer from another in the way of writing?"},{"he": "סגנון הוא חתימת הכתיבה. למשל כותב שמעדיף משפטים קצרים וחדים בזמן אקשן.", "ar": "الأسلوب توقيع الكتابة. مثال: كاتب يفضّل جملًا قصيرة حادة وقت الحركة.", "ru": "Стиль — подпись письма. Например, автор, предпочитающий короткие рубленые фразы во время действия.", "en": "Style is writing's signature. For example, a writer who favors short, sharp sentences during action."},null,[{"he": "זה מתאר את דמות עגולה, לא את סגנון.", "ar": "هذا يصف الشخصية المركّبة، لا الأسلوب.", "ru": "Это описание «круглого персонажа», а не «стиль».", "en": "That describes a round character, not a style."},{"he": "זה מתאר את רקע חברתי, לא את סגנון.", "ar": "هذا يصف الخلفية الاجتماعية، لا الأسلوب.", "ru": "Это описание «социальный фон», а не «стиль».", "en": "That describes a social background, not a style."},null,{"he": "זה מתאר את שיא מקומי, לא את סגנון.", "ar": "هذا يصف ذروة محلية، لا الأسلوب.", "ru": "Это описание «локальную кульминацию», а не «стиль».", "en": "That describes a local peak, not a style."}]),Q("lit-books-style-use",{"he": "תלמיד כותב: \"הסופר משתמש במשפטים קצרים בזמן המרדף ובמשפטים ארוכים בזמן הזיכרון\". מה עושה ההבחנה הזאת?", "ar": "يكتب طالب: «يستخدم الكاتب جملًا قصيرة وقت المطاردة وجملًا طويلة وقت الذكرى». ماذا تفعل هذه الملاحظة؟", "ru": "Ученик пишет: «Автор использует короткие фразы во время погони и длинные во время воспоминаний». Что делает это наблюдение?", "en": "A student writes: \"The author uses short sentences during the chase and long sentences during the memory.\" What does this observation do?"},[{"he": "היא מקשרת בין סגנון למשמעות, וזו קריאה פרשנית חזקה", "ar": "تربط بين الأسلوب والمعنى، وهذه قراءة تفسيرية قوية", "ru": "Она связывает стиль и смысл, и это сильное интерпретирующее чтение", "en": "It links style to meaning, and that is a strong interpretive reading"},{"he": "היא סופרת מילים בלי קשר לתוכן", "ar": "تعدّ الكلمات دون صلة بالمضمون", "ru": "Она считает слова без связи к содержанию", "en": "It counts words with no link to content"},{"he": "היא מוכיחה שהספר ארוך מדי", "ar": "تثبت أن الكتاب طويل جدًّا", "ru": "Она доказывает, что книга слишком длинная", "en": "It proves the book is too long"},{"he": "היא מספרת את העלילה מחדש במילים אחרות", "ar": "تعيد سرد الحبكة بكلمات أخرى", "ru": "Она пересказывает сюжет другими словами", "en": "It retells the plot in other words"}],0,{"he": "האם ההבחנה מסבירה משמעות או רק סופרת?", "ar": "هل تفسّر الملاحظة معنى أم تعدّ فقط؟", "ru": "Объясняет ли наблюдение смысл или только считает?", "en": "Does the observation explain meaning or merely count?"},{"he": "קריאה פרשנית קושרת צורה לתוכן. למשל משפט קצר מזרז קריאה ומתאים למרדף, ואילו משפט ארוך מאריך את הזיכרון.", "ar": "القراءة التفسيرية تربط الشكل بالمضمون. مثال: الجملة القصيرة تسرّع القراءة وتلائم المطاردة، بينما الجملة الطويلة تطيل الذكرى.", "ru": "Интерпретация связывает форму с содержанием. Например, короткая фраза ускоряет чтение и подходит погоне, а длинная растягивает воспоминание.", "en": "Interpretive reading ties form to content. For example, a short sentence speeds reading and fits a chase, while a long one stretches a memory."},null,[null,{"he": "ההבחנה עוסקת בבחירות שפה ובהשפעתן, לא במניין.", "ar": "الملاحظة عن خيارات اللغة وأثرها لا عن العدّ.", "ru": "Наблюдение о языковых выборах и их эффекте, а не о подсчёте.", "en": "The observation is about language choices and their effect, not counting."},{"he": "אין כאן שיקוף על אורך הספר אלא על קצב הקריאה.", "ar": "لا حديث عن طول الكتاب بل عن إيقاع القراءة.", "ru": "Речь не о длине книги, а о ритме чтения.", "en": "It says nothing about the book's length, only about reading pace."},{"he": "היא אינה מספרת את העלילה אלא מנתחת איך היא נכתבת.", "ar": "لا تعيد سرد الحبكة بل تحلّل كيف كُتبت.", "ru": "Она не пересказывает сюжет, а анализирует, как он написан.", "en": "It does not retell the plot but analyzes how it is written."}]),
  Q("bk-3-01",{"he": "בספר מקורי, נערה עוזבת את הכפר ללימודים בעיר. היא מצליחה, אבל מתגעגעת, ובסוף חוזרת לביקור ומרגישה זרה גם שם. איזה משפט מנסח את הנושא בצורה הטובה ביותר?", "ar": "في كتاب أصلي تغادر فتاة القرية للدراسة في المدينة. تنجح لكنها تشتاق، وفي النهاية تعود في زيارة فتشعر بالغربة هناك أيضًا. أي جملة تصوغ الموضوع أفضل صياغة؟", "ru": "В новой книге девушка уезжает из деревни учиться в город. Она успешна, но скучает, а приехав в гости, чувствует себя чужой и там. Какая фраза лучше формулирует тему?", "en": "In an original book, a girl leaves her village to study in the city. She succeeds but misses home, and on a visit back feels a stranger there too. Which sentence best states the theme?"},[{"he": "נערה עוברת לעיר, לומדת, מצליחה וחוזרת לבקר בכפר", "ar": "فتاة تنتقل إلى المدينة وتدرس وتنجح ثم تعود لزيارة القرية", "ru": "Девушка переезжает в город, учится, добивается успеха и навещает деревню", "en": "A girl moves to the city, studies, succeeds and returns to visit the village"}, {"he": "הכפר", "ar": "القرية", "ru": "Деревня", "en": "The village"}, {"he": "צריך תמיד להישאר בכפר שבו נולדת, כי העיר הגדולה הורסת כל אדם שמגיע אליה", "ar": "يجب أن تبقى دائمًا في القرية التي وُلدت فيها، لأن المدينة الكبيرة تفسد كل من يأتيها", "ru": "Всегда нужно оставаться в родной деревне: большой город губит каждого, кто туда приходит", "en": "You should always stay in your home village, because the big city ruins everyone who arrives"}, {"he": "המתח בין הרצון להתקדם לבין הצורך בשייכות", "ar": "التوتر بين الرغبة في التقدم والحاجة إلى الانتماء", "ru": "Напряжение между желанием двигаться вперёд и потребностью в принадлежности", "en": "The tension between the wish to move on and the need to belong"}],3,{"he": "מה הנערה מרגישה גם בעיר וגם בכפר?", "ar": "بماذا تشعر الفتاة في المدينة وفي القرية معًا؟", "ru": "Что девушка чувствует и в городе, и в деревне?", "en": "What does the girl feel both in the city and in the village?"},{"he": "נושא טוב הוא רעיון כללי שמתאים לכל העלילה. הנערה מצליחה, אבל אינה שייכת עד הסוף לאף מקום. לכן הנושא הוא מתח, ולא כלל מוסרי חד.", "ar": "الموضوع الجيد فكرة عامة تناسب الحبكة كلها. الفتاة تنجح، لكنها لا تنتمي تمامًا إلى أي مكان. لذلك الموضوع توتر، لا قاعدة أخلاقية قاطعة.", "ru": "Хорошая тема — общая идея, подходящая ко всему сюжету. Девушка успешна, но нигде не своя до конца. Поэтому тема — напряжение, а не жёсткое правило морали.", "en": "A good theme is a general idea that fits the whole plot. The girl succeeds but fully belongs nowhere. So the theme is a tension, not a strict moral rule."},null,[{"he": "זה סיכום של העלילה, ולא רעיון כללי.", "ar": "هذا تلخيص للحبكة، لا فكرة عامة.", "ru": "Это пересказ сюжета, а не общая идея.", "en": "That is a plot summary, not a general idea."}, {"he": "מילה אחת היא מקום בסיפור, ולא נושא מנוסח.", "ar": "كلمة واحدة هي مكان في القصة، لا موضوع مصوغ.", "ru": "Одно слово — это место действия, а не сформулированная тема.", "en": "One word is a place in the story, not a stated theme."}, {"he": "הנערה מצליחה בעיר, ולכן הספר אינו טוען שהעיר הורסת.", "ar": "الفتاة تنجح في المدينة، فالكتاب لا يدّعي أن المدينة تفسد.", "ru": "Девушка успешна в городе, значит, книга не говорит, что город губит.", "en": "The girl succeeds in the city, so the book does not claim the city ruins people."}, null]),
  Q("bk-3-02",{"he": "תלמיד טוען: ״האב משתנה לאורך הספר״. איזה זוג ראיות יתמוך בטענה בצורה הטובה ביותר?", "ar": "يدّعي طالب: «الأب يتغير على امتداد الكتاب». أي زوج من القرائن يدعم ذلك أفضل دعم؟", "ru": "Ученик пишет: «Отец меняется на протяжении книги». Какая пара доказательств лучше всего это подтвердит?", "en": "A student claims: “The father changes over the book.” Which pair of evidence best supports this?"},[{"he": "סצנה מן ההתחלה וסצנה מן הסוף שבהן הוא נוהג אחרת", "ar": "مشهدان من البداية والنهاية يتصرف فيهما بشكل مختلف", "ru": "Сцены из начала и из конца, где он ведёт себя по-разному", "en": "A scene from the start and one from the end where he acts differently"}, {"he": "שתי סצנות מאותו פרק, שבשתיהן הוא כועס", "ar": "مشهدان من الفصل نفسه، يغضب فيهما", "ru": "Две сцены из одной главы, где он сердится", "en": "Two scenes from the same chapter in which he is angry"}, {"he": "תיאור של המראה החיצוני שלו, של הבגדים שלו ושל הבית שבו הוא גר", "ar": "وصف لمظهره الخارجي ولملابسه وللبيت الذي يسكنه مع عائلته", "ru": "Описание его внешности, его одежды и дома, где он живёт с семьёй", "en": "A description of his looks, his clothes and the house he lives in with his family"}, {"he": "משפט של המספר באמצע הספר: ״הוא היה אדם קשה״", "ar": "جملة للراوي في منتصف الكتاب: «كان رجلًا قاسيًا»", "ru": "Фраза рассказчика в середине книги: «Он был трудным человеком»", "en": "A narrator’s line mid-book: “He was a hard man”"}],0,{"he": "כמה נקודות בזמן צריך כדי לראות שמשהו השתנה?", "ar": "كم لحظة زمنية تحتاجون كي تروا أن شيئًا تغيّر؟", "ru": "Сколько моментов во времени нужно, чтобы увидеть перемену?", "en": "How many points in time do you need to see that something changed?"},{"he": "כדי להוכיח שינוי, צריך שתי נקודות זמן. סצנה מן ההתחלה וסצנה מן הסוף מראות את ההבדל. ראיה מנקודה אחת יכולה לתאר דמות, אבל לא את השינוי שלה.", "ar": "لإثبات التغير نحتاج لحظتين زمنيتين. مشهد من البداية وآخر من النهاية يُظهران الفرق. القرينة من لحظة واحدة تصف الشخصية لا تغيرها.", "ru": "Чтобы доказать перемену, нужны две точки во времени. Сцены из начала и конца показывают разницу. Довод из одной точки описывает героя, но не его изменение.", "en": "To prove change you need two points in time. A scene from the start and one from the end show the difference. Evidence from one point can describe a character, not its change."},null,[null, {"he": "שתי סצנות שבהן הוא נוהג אותו דבר אינן מראות שינוי.", "ar": "مشهدان يتصرف فيهما بالشكل نفسه لا يُظهران تغيرًا.", "ru": "Две сцены с одинаковым поведением не показывают перемены.", "en": "Two scenes where he acts the same do not show change."}, {"he": "מראה חיצוני אינו מראה שינוי באופי או בהתנהגות.", "ar": "المظهر الخارجي لا يُظهر تغيرًا في الطبع أو السلوك.", "ru": "Внешность не показывает перемены характера.", "en": "Looks do not show a change in character or behaviour."}, {"he": "משפט אחד מנקודה אחת בזמן אינו יכול להוכיח שינוי.", "ar": "جملة واحدة من لحظة واحدة لا تثبت تغيرًا.", "ru": "Одна фраза из одного момента не докажет перемены.", "en": "One line from one point in time cannot prove change."}]),
  Q("bk-3-03",{"he": "במחזה מקורי, דמות אומרת ״אני בסדר גמור״, והוראת הבימוי היא: ״טורקת את הדלת״. מה הניתוח הטוב ביותר?", "ar": "في مسرحية أصلية تقول شخصية «أنا بخير تمامًا»، وإرشاد الإخراج: «تصفق الباب». ما أفضل تحليل؟", "ru": "В новой пьесе героиня говорит «У меня всё отлично», а ремарка: «хлопает дверью». Какой разбор лучший?", "en": "In an original play, a character says “I am perfectly fine,” and the stage direction reads: “slams the door.” What is the best analysis?"},[{"he": "היא באמת בסדר, כי כך היא אומרת", "ar": "هي بخير حقًا لأنها تقول ذلك", "ru": "Она правда в порядке, ведь она так говорит", "en": "She really is fine, because she says so"}, {"he": "הפער בין המילים למעשה חושף רגש שהיא מסתירה", "ar": "الفجوة بين الكلام والفعل تكشف شعورًا تخفيه", "ru": "Разрыв между словами и поступком выдаёт скрытое чувство", "en": "The gap between words and action reveals a feeling she hides"}, {"he": "הוראות בימוי אינן חלק מן המחזה, ולכן לא קוראים אותן ולא מתייחסים אליהן בתשובה", "ar": "إرشادات الإخراج ليست جزءًا من المسرحية، فلا نقرؤها ولا نتناولها في الإجابة", "ru": "Ремарки не часть пьесы, их не читают и не упоминают в ответе", "en": "Stage directions are not part of the play, so we do not read them or use them in an answer"}, {"he": "הדלת נטרקה בטעות בגלל רוח חזקה", "ar": "أُغلق الباب بقوة خطأً بسبب ريح شديدة", "ru": "Дверь хлопнула случайно из-за ветра", "en": "The door slammed by accident in a strong wind"}],1,{"he": "מה מאמינים יותר: למה שהדמות אומרת או למה שהיא עושה?", "ar": "ما الأصدق: ما تقوله الشخصية أم ما تفعله؟", "ru": "Чему верить больше: словам героини или её поступку?", "en": "Which do we trust more: what she says or what she does?"},{"he": "בדרמה הוראות הבימוי הן חלק מן הטקסט. כאן המעשה סותר את המילים. הפער מראה שהדמות כועסת או נפגעת, אבל מסתירה זאת.", "ar": "في المسرح إرشادات الإخراج جزء من النص. هنا الفعل يناقض الكلام. والفجوة تُظهر أن الشخصية غاضبة أو مجروحة لكنها تخفي ذلك.", "ru": "В драме ремарки — часть текста. Здесь поступок противоречит словам. Разрыв показывает, что героиня сердита или обижена, но скрывает это.", "en": "In drama, stage directions are part of the text. Here the action contradicts the words. The gap shows she is angry or hurt but hides it."},null,[{"he": "המעשה סותר את המילים, ולכן אין לקבל אותן כפשוטן.", "ar": "الفعل يناقض الكلام، فلا نأخذه بظاهره.", "ru": "Поступок противоречит словам, их нельзя понимать буквально.", "en": "The action contradicts the words, so we should not take them at face value."}, null, {"he": "הוראות בימוי הן חלק מן הטקסט, והן כלי חשוב לניתוח.", "ar": "إرشادات الإخراج جزء من النص وأداة مهمة للتحليل.", "ru": "Ремарки — часть текста и важный инструмент разбора.", "en": "Stage directions are part of the text and a key tool for analysis."}, {"he": "ההוראה אומרת שהדמות טורקת; אין בה רוח או מקרה.", "ar": "الإرشاد يقول إن الشخصية تصفق الباب؛ لا ريح ولا صدفة.", "ru": "Ремарка говорит, что хлопает она сама; ветра нет.", "en": "The direction says she slams it; there is no wind or accident."}]),
  Q("bk-3-04",{"he": "ספר מקורי נקרא ״שומר הסף״. הגיבור עובד כשומר בכניסה לבניין. בבית הוא לא נותן לאיש להתקרב אליו. מה הקריאה העשירה ביותר של השם?", "ar": "كتاب أصلي عنوانه «حارس العتبة». البطل يعمل حارسًا عند مدخل مبنى. وفي البيت لا يسمح لأحد بالاقتراب منه. ما أغنى قراءة للعنوان؟", "ru": "Новая книга называется «Привратник». Герой работает охранником у входа в здание. Дома он никого к себе не подпускает. Какое прочтение названия самое богатое?", "en": "An original book is called “The Gatekeeper.” The hero works as a guard at a building’s entrance. At home, he lets no one get close to him. What is the richest reading of the title?"},[{"he": "השם מתאר רק את העבודה שלו", "ar": "العنوان يصف عمله فقط", "ru": "Название описывает только его работу", "en": "The title only describes his job"}, {"he": "השם הוא רק דימוי, ולכן אין לו קשר לעבודה של הגיבור", "ar": "العنوان مجرد صورة مجازية، فلا صلة له بعمل البطل", "ru": "Название — лишь образ, и с работой героя оно не связано", "en": "The title is only an image, so it has no link to the hero’s job"}, {"he": "השם מתאר גם את עבודתו וגם את הדרך שבה הוא סוגר את עצמו", "ar": "العنوان يصف عمله ويصف أيضًا انغلاقه على نفسه", "ru": "Название описывает и его работу, и то, как он закрывается от людей", "en": "The title describes both his job and the way he shuts himself off"}, {"he": "השם נבחר באקראי, ואין טעם לפרש אותו או לחפש בו משמעות כלשהי בתשובה", "ar": "العنوان اختير عشوائيًا، ولا معنى لتفسيره أو البحث فيه عن أي دلالة في الإجابة", "ru": "Название выбрано случайно, его незачем толковать или искать в нём смысл", "en": "The title was chosen at random, so there is no point interpreting it or seeking any meaning"}],2,{"he": "איפה בספר הגיבור ״שומר על סף״, ואיפה עוד?", "ar": "أين في الكتاب «يحرس البطل العتبة»، وأين أيضًا؟", "ru": "Где герой «охраняет вход», и где ещё?", "en": "Where does the hero “guard a gate,” and where else?"},{"he": "לשם יש משמעות מילולית: הגיבור שומר בכניסה. יש לו גם משמעות מטפורית: הוא לא נותן לאיש להיכנס לחייו. קרי then what differs."},{"he": "לשתי היצירות נושא משותף: סליחה. ההבדל הוא בתוצאה של הבחירה. טענה טובה מחברת בין הדמיון להבדל ואינה שופטת את הדמויות.", "ar": "للعملين موضوع مشترك: التسامح. والفرق في نتيجة الاختيار. الادعاء الجيد يربط بين الشبه والاختلاف ولا يحاكم الشخصيات.", "ru": "У обоих произведений общая тема — прощение. Разница — в последствиях выбора. Хорошее утверждение связывает сходство и различие и не судит героев.", "en": "Both works share a theme: forgiveness. The difference lies in the result of the choice. A good claim links the likeness and the difference without judging the characters."},null,[null, {"he": "יש להן נושא משותף, הסליחה, ולכן יש מה להשוות.", "ar": "لهما موضوع مشترك هو التسامح، ففي المقارنة فائدة.", "ru": "У них общая тема — прощение, значит, сравнивать есть что.", "en": "They share a theme, forgiveness, so there is something to compare."}, {"he": "זו הכללה על סוגות, ולא טענה על שתי היצירות.", "ar": "هذا تعميم عن الأنواع الأدبية، لا ادعاء عن العملين.", "ru": "Это обобщение о жанрах, а не вывод о двух текстах.", "en": "That is a generalisation about genres, not a claim about these two works."}, {"he": "זה שיפוט מוסרי של דמות, ולא השוואה של משמעות.", "ar": "هذا حكم أخلاقي على شخصية، لا مقارنة للمعنى.", "ru": "Это моральная оценка героини, а не сравнение смысла.", "en": "That is a moral judgment of a character, not a comparison of meaning."}]),
  Q("bk-3-06",{"he": "מה הופך פסקת עמדה על ספר לחזקה ביותר?", "ar": "ما الذي يجعل فقرة رأي عن كتاب أقوى ما يمكن؟", "ru": "Что делает абзац с мнением о книге самым сильным?", "en": "What makes an opinion paragraph about a book strongest?"},[{"he": "הרבה מילים גבוהות", "ar": "كثرة الكلمات العالية", "ru": "Много высоких слов", "en": "Lots of fancy words"}, {"he": "עמדה חזקה מאוד, בלי להזכיר אף פעם שיש מי שחושב אחרת ממני על הספר", "ar": "رأي قوي جدًا، دون أن أذكر أبدًا أن هناك من يرى الكتاب بشكل مختلف", "ru": "Очень твёрдое мнение без упоминания, что кто-то думает о книге иначе", "en": "A very firm view that never mentions that anyone thinks differently about the book"}, {"he": "סיכום ארוך של העלילה", "ar": "تلخيص طويل للحبكة", "ru": "Длинный пересказ сюжета", "en": "A long summary of the plot"}, {"he": "עמדה, ראיה, הסבר, והתייחסות לעמדה הנגדית", "ar": "رأي، وقرينة، وشرح، وتناول للرأي المخالف", "ru": "Мнение, довод, объяснение и ответ на противоположный взгляд", "en": "A view, evidence, explanation, and a reply to the opposite view"}],3,{"he": "חשבו מה עושה כותב שרוצה לשכנע גם קורא ספקן.", "ar": "فكّروا ماذا يفعل الكاتب ليقنع حتى قارئًا متشككًا.", "ru": "Подумайте, что делает автор, чтобы убедить даже сомневающегося читателя.", "en": "Think about what a writer does to convince even a doubtful reader."},{"he": "פסקה חזקה מציגה עמדה ומבססת אותה בראיה ובהסבר. השלב הגבוה מוסיף מענה לעמדה הנגדית. כך הקורא רואה שהטענה נבדקה מכמה צדדים.", "ar": "الفقرة القوية تعرض رأيًا وتدعمه بقرينة وشرح. والمستوى الأعلى يضيف ردًا على الرأي المخالف. هكذا يرى القارئ أن الادعاء فُحص من عدة جوانب.", "ru": "Сильный абзац даёт мнение и подкрепляет его доводом и объяснением. Высший уровень добавляет ответ на противоположный взгляд. Так видно, что мысль проверена с разных сторон.", "en": "A strong paragraph states a view and backs it with evidence and explanation. The top level adds a reply to the opposite view. That shows the claim was tested from several sides."},null,[{"he": "מילים גבוהות אינן מח function itemId(tid,lv,i){return tid+"|"+lv+"|"+i}
function itemRec(id){
  if(!state.item[id])state.item[id]={n:0,ok:0};
  return state.item[id];
}
function poolOf(tp,lv){return (tp.L[lv-1]||tp.L[0]||[])}

/* בחירת פריט לתרגול. משקל גבוה לחדש, בינוני לנכשל, נמוך לנשלט. */
function chooseIndex(tid,lv,pool,avoid){
  var cand=[],i,w;
  for(i=0;i<pool.length;i++){
    if(avoid!==undefined&&i===avoid&&pool.length>1)continue;
    var r=state.item[itemId(tid,lv,i)];
    if(!r||!r.n)w=6;                            /* חדש */
    else if(r.ok<r.n)w=1+Math.min(4,r.n-r.ok);  /* נכשל בעבר */
    else w=1;                                   /* נשלט */
    for(var j=0;j<w;j++)cand.push(i);
  }
  if(!cand.length)return 0;
  return pick(cand);
}
/* בחירת פריט למבחן. אחידה, ואינה נוגעת ב-state כלל. */
function pureIndex(pool,avoid){
  var cand=[],i;
  for(i=0;i<pool.length;i++){
    if(avoid!==undefined&&i===avoid&&pool.length>1)continue;
    cand.push(i);
  }
  return cand.length?pick(cand):0;
}


/* ------------------------------------------------------------
   ניקוי להקראה בלבד. המסך אינו משתנה ממנו.

   הגרשיים העבריים משמשים לשני דברים: ראשי תיבות (חוק־יסוד,
   בג״ץ) ומירכאות (״מדינה יהודית״). המנוע מכיר רק את הראשון.
   הכלל שמפריד: בראשי תיבות באה אחרי הגרשיים אות עברית אחת
   בדיוק וסוף מילה. הסיכון א־סימטרי — מירכאה שהוסרה אינה
   יכולה להזיק, מירכאה שנשארה כן.

   המירכאות המסולסלות (“ ”) משמשות כאן לציטוט מונחים בלבד,
   ולכן הן נופלות תמיד. הקו המפריד הופך לפסיק, כדי שהקול
   ייעצר במקום לרוץ הלאה.
   ------------------------------------------------------------ */
function saySpell(x){
  return String(x==null?"":x)
    .replace(/[“”‘’]/g,"")
    .replace(/״/g,function(m,i,str){
      return /^[א-ת](?![א-ת])/.test(str.slice(i+1))?m:"";
    })
    .replace(/\s—\s/g,", ");
}

function O(html,ok,why){return {h:html,ok:!!ok,why:why||""}}

/* בונה שאלה מפריט אחד. סדר האפשרויות מעורבב בכל בנייה, ולכן
   האינדקס ok שבתוכן אינו מגיע למסך לעולם. */
function buildFromItem(it){
  var opts=it.o.map(function(o,i){return O(esc(gl(o)),i===it.ok,it.wrong&&it.wrong[i]?gl(it.wrong[i]):"")});
  var ans=gl(it.o[it.ok]);
  return {
    type:"mcq",
    prompt:t("qPick"),
    lead:gl(it.q),
    fig:figHtml(it.fig),
    opts:shuffle(opts),
    answer:ans,
    /* מה שנאמר אחרי המענה: השאלה, התשובה הנכונה, וההסבר.
       תשובה בלי ההסבר נשמעת כמו עובדה לשינון, וזה בדיוק מה
       שהאפליקציה הזאת קיימת כדי להחליף. */
    say:gl(it.q)+" "+ans+". "+gl(it.ex),
    reveal:it
  };
}
function buildQuestion(tid,lv,avoid,pure){
  var tp=topicOf(tid); if(!tp)return null;
  var pool=poolOf(tp,lv);
  if(!pool.length)return null;
  var idx=pure?pureIndex(pool,avoid):chooseIndex(tid,lv,pool,avoid);
  var it=pool[idx];
  if(!it)return null;
  var q=buildFromItem(it);
  q.tid=tid; q.lv=lv; q.idx=idx; q.id=itemId(tid,lv,idx);
  q.hint=gl(it.hint);
  return q;
}

/* ============================================================
   מבחן מדומה
   ------------------------------------------------------------
   עשרים שאלות מכל הנושאים ומכל הרמות, בחוברת אחת שגוללים בה —
   ולא שאלה־שאלה. מי שקורא לאט צריך לראות כמה נשאר, לחזור אחורה
   ולשנות תשובה; ניווט שמסתיר את שאר השאלות לוקח ממנו בדיוק את זה.

   המבחן אינו נשמר. הוא מצב זמני בזיכרון בלבד, ורענון הדף מתחיל
   אותו מחדש — זו הצהרה ולא פער: שעון שממשיך לרוץ בין ביקורים
   הוא בדיוק המקום שבו נולדים באגים שקשה לשחזר.
   ============================================================ */
var SIM_N=20, SIM_MIN=30;
var SIM={on:false,done:false,q:[],ans:[],end:0,tick:null};

function simStop(){if(SIM.tick){clearInterval(SIM.tick);SIM.tick=null}}
function simFmt(ms){
  if(ms<0)ms=0;
  var sec=Math.round(ms/1000),m=Math.floor(sec/60),c=sec%60;
  return m+":"+(c<10?"0":"")+c;
}
function simLeftN(){
  var n=0,i;
  for(i=0;i<SIM.ans.length;i++)if(SIM.ans[i]<0)n++;
  return n;
}
function simRight(){
  var n=0,i;
  for(i=0;i<SIM.q.length;i++)if(SIM.ans[i]>=0&&SIM.q[i].opts[SIM.ans[i]].ok)n++;
  return n;
}
function simStart(){
  var pairs=[],qs=[],i,q;
  TOPICS.forEach(function(tp){for(var l=1;l<=3;l++)pairs.push([tp.id,l])});
  shuffle(pairs);
  for(i=0;i<pairs.length&&qs.length<SIM_N;i++){
    q=buildQuestion(pairs[i][0],pairs[i][1],undefined,true);
    if(q)qs.push(q);
  }
  /* פחות צמדי נושא-רמה מ-SIM_N: סבב נוסף, בלי לחזור על אותו פריט. */
  var guard=0;
  while(qs.length<SIM_N&&guard<400){
    var pr=pairs[guard%pairs.length]; guard++;
    q=buildQuestion(pr[0],pr[1],undefined,true);
    if(!q)continue;
    var dup=false,k;
    for(k=0;k<qs.length;k++)if(qs[k].id===q.id){dup=true;break}
    if(!dup)qs.push(q);
  }
  SIM.q=qs;
  SIM.ans=qs.map(function(){return -1});
  SIM.on=true; SIM.done=false; SIM.end=Date.now()+SIM_MIN*60000;
  simArm();
}
function simArm(){
  simStop();
  if(SIM.on&&!SIM.done)SIM.tick=setInterval(simClock,1000);
}
function simClock(){
  var el=$("#simclock");
  /* המסך הוחלף — אין מה לעדכן, והשעון נעצר מעצמו. */
  if(!el){simStop();return}
  var left=SIM.end-Date.now();
  el.textContent=simFmt(left);
  if(left<=60000)el.classList.add("low");
  if(left<=0){simStop();simSubmit()}
}
/* ההגשה היא גם רגע הרישום: עד כאן לא נספרה אף תשובה, כדי
   שהמבחן לא ידחוף לבנק הטעויות שאלה שהנבחן עוד עמד לשנות. */
function simSubmit(){
  if(!SIM.on||SIM.done)return;
  simStop();
  var i;
  for(i=0;i<SIM.q.length;i++){
    var q=SIM.q[i],pk=SIM.ans[i];
    recordItem(q.tid,q.lv,q.id,pk>=0&&!!q.opts[pk].ok);
  }
  SIM.done=true; save(); render(); window.scrollTo(0,0);
}

function screenSim(){
  var h='<div class="wrap"><h2 style="margin:1.1rem 0 .3rem;font-size:1.4rem">'+esc(t("simT"))+"</h2>";
  if(!SIM.on){
    h+='<div class="card"><p style="margin:0 0 .8rem;color:var(--muted)">'+esc(t("simD"))+"</p>"+
       '<button class="btn pri" data-a="simstart">'+ic("play",16)+" "+esc(t("simStart"))+"</button></div>";
    return h+"</div>"+fbar();
  }
  if(SIM.done){
    var right=simRight(),pc=Math.round(100*right/Math.max(1,SIM.q.length));
    h+='<div class="card" style="text-align:center"><div style="font-size:2.2rem;font-weight:800">'+
       pc+'%</div><div style="color:var(--muted)">'+esc(t("simScore"))+" — "+right+" / "+SIM.q.length+"</div>"+
       '<div style="margin-top:.8rem"><button class="btn pri" data-a="simstart">'+
       ic("redo",16)+" "+esc(t("simAgain"))+"</button></div></div>";
    h+='<h3 style="margin:1.2rem 0 .2rem;font-size:1.1rem">'+esc(t("simReview"))+"</h3>";
    SIM.q.forEach(function(q,i){
      var pk=SIM.ans[i],ok=pk>=0&&!!q.opts[pk].ok;
      h+='<div class="simq"><div class="simn">'+esc(t("simQ"))+" "+(i+1)+" · "+
         esc(topicOf(q.tid)?tName(topicOf(q.tid)):"")+" · "+esc(t("lv"+q.lv))+"</div>";
      h+=askBox(q.lead||"");
      if(q.fig)h+=q.fig;
      h+='<div class="fb '+(ok?"ok":"bad")+'"><b>'+(ok?esc(t("correct")):esc(t("wrong")))+"</b>"+
         '<div class="body">'+esc(t("simYours"))+": <b>"+
         esc(pk>=0?plainOf(q.opts[pk].h):t("simNone"))+"</b><br>"+
         esc(t("answerIs"))+" <b>"+esc(q.answer)+"</b></div>";
      var wsim=pk>=0&&!ok&&q.opts[pk]?q.opts[pk].why:"";
      if(wsim)h+='<div class="why"><b>'+esc(t("whyT"))+":</b> "+esc(wsim)+"</div>";
      else if(q.reveal&&q.reveal.ex)
        h+='<div class="why"><b>'+esc(t("whyT"))+":</b> "+esc(gl(q.reveal.ex))+"</div>";
      h+="</div>";
      h+='<div style="display:flex;gap:.5rem;margin-top:.6rem">'+
         spkBtn(saySpell(q.say),state.lang,false,t("hearSent"))+
         spkBtn(saySpell(q.say),state.lang,true,t("hearSlow"))+spkStop()+"</div>";
      h+="</div>";
    });
    return h+"</div>"+fbar();
  }
  /* המבחן עצמו. השעון נדרך אחרי הציור, כי הוא מעדכן אלמנט
     שעדיין לא קיים בזמן שבניית ה-HTML רצה. */
  setTimeout(simArm,0);
  h+='<div class="simbar"><span class="clock" id="simclock">'+esc(simFmt(SIM.end-Date.now()))+"</span>"+
     '<span class="chip"><span id="simleft">'+simLeftN()+"</span> "+esc(t("simLeft"))+"</span>"+
     '<button class="btn pri" data-a="simsubmit" style="margin-inline-start:auto">'+
     esc(t("simSubmit"))+"</button></div>";
  SIM.q.forEach(function(q,i){
    h+='<div class="simq"><div class="simn">'+esc(t("simQ"))+" "+(i+1)+" / "+SIM.q.length+"</div>";
    h+=askBox(q.lead||"");
    if(q.fig)h+=q.fig;
    h+='<div class="opts">';
    q.opts.forEach(function(o,j){
      h+='<button class="opt'+(SIM.ans[i]===j?" sel":"")+'" data-a="simpick" data-i="'+i+
        '" data-j="'+j+'"><span class="k">'+String.fromCharCode(65+j)+"</span><span>"+o.h+"</span></button>";
    });
    h+="</div></div>";
  });
  h+='<div style="margin:1rem 0"><button class="btn pri" data-a="simsubmit">'+
     esc(t("simSubmit"))+"</button></div>";
  return h+"</div>"+fbar();
}

/* ============================================================
   מתאם למסכי המבחן
   ------------------------------------------------------------
   מסכי המבחן נכתבו לאפליקציות המתמטיקה. שם השאלה נראית אחרת —
   ask, options, topicName — וכאן היא prompt, lead ו-opts. גם
   הניווט שונה: שם משתנה view, וכאן state.screen. ההמרה נעשית
   כאן, במקום אחד, ולא בפיזור תנאים בתוך המסכים.
   ============================================================ */
var view="";   /* מסכי המבחן בלבד. שאר האפליקציה מנווטת ב-state.screen. */
/* שמות הרמות כבר מתורגמים באפליקציה (lv1..lv3). המסכים קוראים
   LVL[i] וגם LVL.map, ולכן זה חייב להיות מערך אמיתי — ומכיוון
   שהוא מערך, הוא מתרענן בכל ציור מסך, אחרת החלפת שפה לא הייתה
   משנה את מה שכתוב במבחן. */
var LVL=["","",""];
function lvlSync(){LVL[0]=t("lv1");LVL[1]=t("lv2");LVL[2]=t("lv3")}
var LVL_C=["var(--c-sound)","var(--c-words)","var(--c-talk)"];
/* מסכי המבחן שואלים אם ההקראה פעילה. באפליקציה הזאת אין מתג כזה —
   ההקראה זמינה תמיד דרך כפתורי ההשמעה — ולכן התשובה קבועה. */
if(!state.settings)state.settings={tts:true};
/* לא לכל אפליקציה יש דף נוסחאות. מקטע המבחן הגיע מאפליקציה שיש
   בה אחד, והציע אותו גם כאן — כפתור שמוביל למסך שאינו קיים. */
var HAS_FORMULAS=(typeof viewFormulas==="function");
function topicById(id){return topicOf(id)}
/* אין track ב-blankState של האפליקציה הזאת, ולכן בכניסה הראשונה
   הוא undefined ורשימת הנושאים הייתה יוצאת ריקה. נופלים למסלול
   הראשון במקום להציג מסך בלי כלום. */
function topicsForTrack(trk){
  if(!trk)trk=(TRACKS[0]||{}).id;
  return TOPICS.filter(function(x){return x.trk===trk});
}
function topicCls(id){var tp=topicOf(id);return tp?trackOf(tp.trk).cls:""}
function areaCls(id){return topicCls(id)}
/* טקסט נקי מתוך HTML — המסכים משווים ומדווחים תשובות כטקסט. */
function plainOf(h){
  var d=document.createElement("div"); d.innerHTML=String(h||"");
  return (d.textContent||"").replace(/\s+/g," ").trim();
}
function buildQ(tid,lv){
  /* pure=true — הבחירה כאן אינה מביטה בהתקדמות הלומד. זה מה
     שמאפשר לזרע אחד לייצר את אותה שאלה בדיוק אצל המורה ואצל
     התלמיד; ראו את ההסבר בראש סעיף 8. */
  var q=buildQuestion(tid,lv,undefined,true); if(!q)return null;
  var tp=topicOf(tid);
  return {topic:tid, topicName:tp?tName(tp):"", ask:esc(q.lead||""), expr:"", fig:q.fig||"",
          options:(q.opts||[]).map(function(o){
            return {h:o.h,t:plainOf(o.h),ok:!!o.ok,why:o.why||""}}),
          say:q.say||"", hint:q.hint||""};
}


/* ============================================================
   18. מבחן כיתתי — פרסום בוואטסאפ, קבלת תשובות וציונים
   ------------------------------------------------------------
   אין שרת, ואין כוונה שיהיה. לכן המבחן אינו נשלח לשום מקום:
   הוא *נארז לתוך הקישור*. המורה מקבל קישור, שולח אותו בוואטסאפ,
   והמכשיר של התלמיד בונה מהקישור בדיוק את אותן שאלות.

   מה שהופך את זה לאפשרי הוא שכל מחולל שאלות כאן משתמש ב-
   Math.random בלבד. אם מזרעים אותו, אותו זרע מייצר את אותן
   שאלות ואת אותו סדר תשובות — אצל המורה ואצל התלמיד. הקישור
   נושא זרע ורשימת נושאים, לא עשרים שאלות מלאות, ולכן הוא נשאר

/* --- מחולל מזורע. mulberry32: קצר, מהיר, ופיזור טוב דיו --- */
function withSeed(seed,fn){
  var real=Math.random,s=(seed>>>0)||1;
  Math.random=function(){
    s|=0; s=s+0x6D2B79F5|0;
    var t=Math.imul(s^s>>>15,1|s);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
  try{return fn()}finally{Math.random=real}
}
function hash32(str){
  var h=0x811c9dc5,i;
  for(i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193)}
  return (h>>>0);
}
/* base64url. הניקוי בפענוח אינו קוסמטי: וואטסאפ שובר מחרוזות
   ארוכות בשורות, ורווח אחד הורס את כל הקוד. */
function b64e(str){
  var bytes=new TextEncoder().encode(str),bin="",i;
  for(i=0;i<bytes.length;i+=8192)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));
  return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function b64d(s){
  s=String(s||"").replace(/[^A-Za-z0-9\-_]/g,"").replace(/-/g,"+").replace(/_/g,"/");
  while(s.length%4)s+="=";
  var bin=atob(s),bytes=new Uint8Array(bin.length),i;
  for(i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
/* הזרע של המשבצת נכנס למזהה: שני מבחנים באותם נושאים ובאותה
   רמה, שהמורה החליף באחד מהם שאלה, אינם אותו מבחן. מבחן ישן
   שאין לו זרעים מקבל בדיוק את המזהה שקיבל תמיד — אחרת ההגשות
   שכבר נקלטו אליו מתייתמות. */
function examId(spec){return hash32(spec.s+"|"+spec.q.map(function(x){
  return x[0]+x[1]+(x.length>2?"@"+x[2]:"")}).join(",")).toString(36)}
function encodeExam(spec){return b64e(JSON.stringify(spec))}
function decodeExam(code){
  try{

    if(!o||!o.q||!o.q.length||typeof o.s!=="number")return null;
    o.q=o.q.filter(function(x){return topicById(x[0])});
    return o.q.length?o:null;

}
/* בונה את שאלות המבחן. אותו זרע → אותן שאלות, גם אצל המורה
   כשהוא בודק וגם אצל התלמיד כשהוא נבחן. */
function examQuestions(spec){
  /* מסננים נושאים שאינם מוכרים לאפליקציה הזאת, בדיוק כמו decodeExam.
     בלי הסינון buildQ מחזיר null על נושא זר, והמסך נופל על
     q.topic של null. עדיף לדלג בשקט מאשר להתרסק. */
  var pairs=(spec.q||[]).filter(function(x){return !!topicById(x[0])});
  /* מבחן שנבנה עם זרע לכל משבצת נבנה משבצת אחרי משבצת, וכל
     שאלה תלויה בזרע שלה בלבד — כך המורה יכול להחליף אחת מהן.
     מבחן ישן, בלי זרעים, חייב להיבנות בדיוק כפי שנבנה ביום
     שנשלח: אחרת הציון של מי שכבר נבחן משתנה למפרע. */
  if(pairs.length&&pairs.every(function(x){return typeof x[2]==="number"}))
    return pairs.map(function(p){return exBuildSlot(p)})
                .filter(function(q){return !!q});
  return withSeed(spec.s,function(){
    return pairs.map(function(pair){return buildQ(pair[0],pair[1])})
                .filter(function(q){return !!q});
  });
}
/* --- בחירת השאלות בידי המורה ---------------------------------
   עד כאן המורה בחר נושאים, רמה ומספר שאלות — והשאלות עצמן הוגרלו
   מאחורי גבו. הוא ראה אותן לראשונה רק אחרי שהמבחן כבר היה אצל
   התלמידים. מעכשיו כל שאלה היא משבצת נפרדת עם זרע משלה: המורה
   רואה אותה לפני השליחה, מחליף אותה בשאלה אחרת מאותו נושא,
   מסיר אותה, או מוסיף שאלה מנושא שחסר לו.

   הזרע הנפרד לכל משבצת הוא מה שמאפשר את זה. בזרם אקראי אחד
   ומשותף, כפי שהיה עד כאן, החלפה של השאלה השלישית הייתה משנה
   גם את הרביעית ואת החמישית — כלומר לא "החלפה" אלא הגרלה מחדש
   של כל מה שאחריה.

   24 ביט ולא 32: הזרע נוסע בתוך הקישור שנשלח בוואטסאפ, וזרע
   קצר יותר הוא קישור קצר יותר. שישה־עשר מיליון אפשרויות למשבצת
   הן הרבה מעבר למה שהמחולל עצמו יודע לייצר. */
function exNewSeed(){return (Math.random()*16777215)>>>0}
function exSlot(topicId,level){return [topicId,level,exNewSeed()]}
/* אותו זרע → אותה שאלה בדיוק: אצל המורה כשהוא בוחר, ואצל
   התלמיד כשהוא נבחן. */
function exBuildSlot(slot){
  if(!slot||!topicById(slot[0]))return null;
  return withSeed(slot[2],function(){return buildQ(slot[0],slot[1])})||null;
}
/* מסך הבנייה מצייר את עצמו מחדש אחרי כל לחיצה, ובניית עשרים
   וחמש שאלות בכל ציור מיותרת. המטמון הוא לתצוגה בלבד — מי
   שנבחן בונה את שאלותיו מחדש, כדי שאיש לא יערוך בטעות אובייקט
   שגם מסך אחר מחזיק בו. */
var EXQCACHE={};
/* לכל אפליקציה מנגנון שפה משלה, ולא לכולן אותם שמות. הפנייה
   דרך window ולא בשם ישיר, כי שם שאינו קיים באפליקציה מסוימת
   הוא שגיאה בעיני הבודקים — רעש שמסתיר שגיאה אמיתית. */
function exLangKey(){
  try{
    var g=(typeof window!=="undefined")?window:{};
    if(typeof g.xlg==="function")return g.xlg();
    if(typeof g.LG==="string")return g.LG;
    return (state&&state.settings&&state.settings.lang)||"he";
  }catch(e){return "he"}
}
function exPreviewQ(slot){
  if(!slot)return null;
  var k=slot[0]+"|"+slot[1]+"|"+slot[2]+"|"+exLangKey();
  if(!(k in EXQCACHE)){
    /* מורה שמחליף שאלות שוב ושוב מייצר מפתח חדש בכל לחיצה.
       מטמון שרק גדל הוא דליפה; מרוקנים אותו ומתחילים מחדש. */
    if(Object.keys(EXQCACHE).length>400)EXQCACHE={};
    EXQCACHE[k]=exBuildSlot(slot);
  }
  return EXQCACHE[k];
}
function exTopicName(id){
  var t=topicById(id); if(!t)return "";

function exSlots(){

  if(!tops.length)tops=topicsForTrack(state.track).slice(0,3).map(function(t){return t.id});

function exAdoptLegacy(){

    var old=JSON.parse(raw); if(!old||!old.list||!old.list.length)return;
    var have={},i,ex;
    for(i=0;i<EX.list.length;i++)have[EX.list[i].id]=1;

}

    if(!o||!o.i||!o.a||!o.a.length)return null;
    o.ok=(o.c===hash32(JSON.stringify([o.i,o.n,o.a])).toString(36));

/* הציון מחושב כאן מחדש מתוך התשובות. מה שהתלמיד שלח הוא מה
   שסימן, לא כמה הוא קיבל. */
function gradeResult(spec,res){
  var qs=examQuestions(spec),per=[],ok=0,i,q,a;
  for(i=0;i<qs.length;i++){
    q=qs[i]; a=res.a[i];
    var right=(a>=0&&q.options[a]&&q.options[a].ok)?1:0;
    if(right)ok++;
    per.push({topic:q.topic,topicName:q.topicName,ok:right,
              picked:(a>=0&&q.options[a])?q.options[a].t:"—",
              answer:(q.options.filter(function(o){return o.ok})[0]||{}).t||""});
  }
  return {ok:ok,n:qs.length,pct:Math.round(100*ok/qs.length),per:per};

/* השאלות עצמן, על המסך של המורה, לפני שהמבחן נשלח. */
function viewExamSlots(){
  var ls=exSlots(),h="",tops=EB.topics.filter(function(x){return topicById(x)});
  h+='<div style="margin-top:18px"><b>'+esc(xt("exQs"))+'</b>'+
     '<p class="sub" style="margin:4px 0 8px">'+esc(xt("exQsNote"))+'</p>';
  h+='<div class="row" style="margin:0 0 10px">'+
     '<button class="xq-b" data-a="exqans" aria-pressed="'+(EB.ans?"true":"false")+'">'+
     (EB.ans?esc(xt("exQsHide")):esc(xt("exQsShow")))+'</button>'+
     '<button class="xq-b" data-a="exqreset">'+esc(xt("exQsReset"))+'</button></div>';
  h+='<ol class="xq-list">';
  ls.forEach(function(sl,i){
    var q=exPreviewQ(sl),ok=exRightAnswer(q);
    h+='<li class="xq"><div class="xq-top">'+
       '<span class="xq-n">'+(i+1)+'</span>'+
       '<span class="xq-tp">'+esc(q&&q.topicName?q.topicName:exTopicName(sl[0]))+'</span>'+
       '<span class="xq-acts">'+
       '<button class="xq-b" data-a="exqroll" data-i="'+i+'">'+esc(xt("exQsSwap"))+'</button>'+
       /* המבחן חייב להישאר עם שאלה אחת לפחות, ולכן הכפתור נעלם
          ולא מוצג כבוי: כפתור שאי אפשר ללחוץ עליו מבלבל. */
       (ls.length>1?'<button class="xq-b" data-a="exqdel" data-i="'+i+'">'+esc(xt("exQsDrop"))+'</button>':"")+
       '</span></div>';
    if(q){
