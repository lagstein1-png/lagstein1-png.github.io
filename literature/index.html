  {"he": "רומאן ונובלה: מבנה ודמות", "ar": "الرواية والنوفيلا: البناء والشخصية", "ru": "Роман и повесть: структура и герой", "en": "Novel and novella: form and character"},
  {"he": "עקבו אחר דמות, זמן ורמזים חוזרים", "ar": "تتبّعوا الشخصية والزمن والإشارات المتكررة", "ru": "Следите за персонажем, временем и повторениями", "en": "Trace character, time and repeated details"},
[ [
  Q("lit-novel-8281-1",{"he": "איזה תיאור מתאים להתפתחות דמות?", "ar": "أي وصف يناسب تطور الشخصية؟", "ru": "Какое описание подходит к «Развитие персонажа»?", "en": "Which description fits character development?"},[{"he": "שינוי בדמות שאפשר לזהות בהשוואה בין בחירותיה בתחילה ובסוף.", "ar": "تغيّر في الشخصية يظهر بمقارنة اختياراتها في البداية والنهاية.", "ru": "Перемена героя, заметная при сравнении выбора в начале и конце.", "en": "A change visible when comparing a character’s choices at the start and end."},{"he": "הסיפור עובר מתקופה אחת לאחרת בלי לתאר את כל מה שביניהן.", "ar": "تنتقل القصة من فترة إلى أخرى دون سرد كل ما بينهما.", "ru": "Повествование переносится в другое время, опуская промежуток.", "en": "The narrative moves to another time while skipping what lies between."},{"he": "פרט, צליל או חפץ החוזר בכמה מקומות ומקבל משמעות בהקשר.", "ar": "تفصيل أو صوت أو غرض يتكرر في مواضع ويكتسب معنى من السياق.", "ru": "Деталь, звук или предмет, повторяющийся и приобретающий смысл в контексте.", "en": "A detail, sound or object recurring and gaining meaning through context."},{"he": "קול המספר שאירועים אחרים בטקסט מעוררים ספק בדבריו.", "ar": "صوت راوٍ تجعل أحداث أخرى في النص كلامه موضع شك.", "ru": "Рассказчик, чьи слова вызывают сомнение из-за других событий текста.", "en": "A narrator whose account is cast into doubt by other events in the text."}],0,{"he": "חפשו את הפרט שמבדיל אותו מן האחרים.", "ar": "ابحثوا عن التفصيل الذي يميزه عن غيره.", "ru": "Ищите отличие от остальных вариантов.", "en": "Look for the detail that separates it from the others."},{"he": "שינוי נבדק במעשים ובהחלטות ולא רק בתיאור חיצוני.", "ar": "يظهر التغيّر في الأفعال والقرارات لا في الشكل فقط.", "ru": "Перемену выявляют поступки и решения, а не только внешний вид.", "en": "Actions and choices, not appearance alone, show change."},null,[null,{"he": "זה מתאר את קפיצה בזמן, לא את התפתחות דמות.", "ar": "هذا يصف قفزة زمنية، لا تطور الشخصية.", "ru": "Это описание «Временной скачок», а не «Развитие персонажа».", "en": "That describes time jump, not character development."},{"he": "זה מתאר את מוטיב חוזר, לא את התפתחות דמות.", "ar": "هذا يصف فكرة أو صورة متكررة، لا تطور الشخصية.", "ru": "Это описание «Повторяющийся мотив», а не «Развитие персонажа».", "en": "That describes recurring motif, not character development."},{"he": "זה מתאר את מספר לא מהימן, לא את התפתחות דמות.", "ar": "هذا يصف راوٍ غير موثوق، لا تطور الشخصية.", "ru": "Это описание «Ненадёжный рассказчик», а не «Развитие персонажа».", "en": "That describes unreliable narrator, not character development."}]),
  Q("lit-novel-8281-2",{"he": "איזה תיאור מתאים לקפיצה בזמן?", "ar": "أي وصف يناسب قفزة زمنية؟", "ru": "Какое описание подходит к «Временной скачок»?", "en": "Which description fits time jump?"},[{"he": "שינוי בדמות שאפשר לזהות בהשוואה בין בחירותיה בתחילה ובסוף.", "ar": "تغيّر في الشخصية يظهر بمقارنة اختياراتها في البداية والنهاية.", "ru": "Перемена героя, заметная при сравнении выбора в начале и конце.", "en": "A change visible when comparing a character’s choices at the start and end."},{"he": "הסיפור עובר מתקופה אחת לאחרת בלי לתאר את כל מה שביניהן.", "ar": "تنتقل القصة من فترة إلى أخرى دون سرد كل ما بينهما.", "ru": "Повествование переносится в другое время, опуская промежуток.", "en": "The narrative moves to another time while skipping what lies between."},{"he": "פרט, צליל או חפץ החוזר בכמה מקומות ומקבל משמעות בהקשר.", "ar": "تفصيل أو صوت أو غرض يتكرر في مواضع ويكتسب معنى من السياق.", "ru": "Деталь, звук или предмет, повторяющийся и приобретающий смысл в контексте.", "en": "A detail, sound or object recurring and gaining meaning through context."},{"he": "קול המספר שאירועים אחרים בטקסט מעוררים ספק בדבריו.", "ar": "صوت راوٍ تجعل أحداث أخرى في النص كلامه موضع شك.", "ru": "Рассказчик, чьи слова вызывают сомнение из-за других событий текста.", "en": "A narrator whose account is cast into doubt by other events in the text."}],1,{"he": "חפשו את הפרט שמבדיל אותו מן האחרים.", "ar": "ابحثوا عن التفصيل الذي يميزه عن غيره.", "ru": "Ищите отличие от остальных вариантов.", "en": "Look for the detail that separates it from the others."},{"he": "קפיצה משנה את זמן הסיפור, לא בהכרח את המקום.", "ar": "تغيّر القفزة زمن السرد، لا المكان بالضرورة.", "ru": "Скачок меняет время рассказа, не обязательно место.", "en": "A time jump changes narrative time, not necessarily place."},null,[{"he": "זה מתאר את התפתחות דמות, לא את קפיצה בזמן.", "ar": "هذا يصف تطور الشخصية، لا قفزة زمنية.", "ru": "Это описание «Развитие персонажа», а не «Временной скачок».", "en": "That describes character development, not time jump."},null,{"he": "זה מתאר את מוטיב חוזר, לא את קפיצה בזמן.", "ar": "هذا يصف فكرة أو صورة متكررة، لا قفزة زمنية.", "ru": "Это описание «Повторяющийся мотив», а не «Временной скачок».", "en": "That describes recurring motif, not time jump."},{"he": "זה מתאר את מספר לא מהימן, לא את קפיצה בזמן.", "ar": "هذا يصف راوٍ غير موثوق، لا قفزة زمنية.", "ru": "Это описание «Ненадёжный рассказчик», а не «Временной скачок».", "en": "That describes unreliable narrator, not time jump."}])
 ,Q("lit-novel-sub",{"he": "איזה תיאור מתאים לעלילת משנה?", "ar": "أي وصف يناسب حبكة فرعية؟", "ru": "Какое описание подходит к побочную линию?", "en": "Which description fits a subplot?"},[{"he": "קו סיפור נוסף הרץ לצד העלילה הראשית ומאיר אותה או את הדמויות.", "ar": "خط سردي إضافي يسير بجانب الحبكة الرئيسة ويسلّط الضوء عليها أو على الشخصيات.", "ru": "Дополнительная сюжетная линия рядом с основной, оттеняющая её или героев.", "en": "An extra story line running beside the main plot, highlighting it or the characters."},{"he": "אירוע המשנה את כיוון חיי הדמות הראשית ואת מסלול הסיפור כולו.", "ar": "حدث يغيّر مسار حياة الشخصية الرئيسة واتجاه القصة كلها.", "ru": "Событие, меняющее направление жизни героя и ход всей истории.", "en": "An event that changes the main character's life direction and the story's whole course."},{"he": "פריט או תמונה החוזרים ביצירה וטוענים משמעות נוספת מעבר לעצמם.", "ar": "عنصر أو صورة يتكرر في العمل ويحمل معنى إضافيًّا يتجاوز ذاته.", "ru": "Предмет или образ, повторяющийся в произведении и несущий смысл сверх самого себя.", "en": "An object or image that recurs in the work and carries meaning beyond itself."},{"he": "הזמן והמקום שבהם מתרחשת העלילה והמשפיעים על אופי ההתרחשות.", "ar": "الزمان والمكان اللذان تجري فيهما الحبكة ويؤثران في طبيعة الأحداث.", "ru": "Время и место действия, влияющие на характер происходящего.", "en": "The time and place where the plot happens, shaping how events unfold."}],0,{"he": "חפשו קו סיפור שני לצד הראשי.", "ar": "ابحثوا عن خط سردي ثانٍ بجانب الرئيس.", "ru": "Ищите вторую линию рядом с главной.", "en": "Look for a second story line beside the main one."},{"he": "עלילת משנה רצה במקביל. למשל סיפור אהבה של דמות שכנה בזמן שהעלילה הראשית עוסקת במסע.", "ar": "الحبكة الفرعية تجري بالتوازي. مثال: قصة حب لشخصية مجاورة بينما تركّز الحبكة الرئيسة على رحلة.", "ru": "Побочная линия идёт параллельно. Например, история любви соседки, пока основной сюжет о путешествии.", "en": "A subplot runs in parallel. For example, a neighbor's love story while the main plot follows a journey."},null,[null,{"he": "זה מתאר את נקודת מפנה, לא את עלילת משנה.", "ar": "هذا يصف نقطة التحول، لا حبكة فرعية.", "ru": "Это описание «переломный момент», а не «побочную линию».", "en": "That describes a turning point, not a subplot."},{"he": "זה מתאר את סמל, לא את עלילת משנה.", "ar": "هذا يصف رمز، لا حبكة فرعية.", "ru": "Это описание «символ», а не «побочную линию».", "en": "That describes a symbol, not a subplot."},{"he": "זה מתאר את רקע, לא את עלילת משנה.", "ar": "هذا يصف الخلفية، لا حبكة فرعية.", "ru": "Это описание «фон», а не «побочную линию».", "en": "That describes the setting, not a subplot."}]),
  Q("nv-1-01",{"he": "מהי נובלה?", "ar": "ما النوفيلا؟", "ru": "Что такое повесть (новелла)?", "en": "What is a novella?"},[{"he": "יצירת פרוזה קצרה מרומן, עם עלילה מרוכזת ומעט דמויות", "ar": "عمل نثري أقصر من الرواية، بحبكة مركّزة وشخصيات قليلة", "ru": "Прозаическое произведение короче романа, с плотным сюжетом и немногими героями", "en": "A prose work shorter than a novel, with a focused plot and few characters"}, {"he": "שיר ארוך הבנוי מבתים קבועים וחרוזים, המסופר כולו בגוף ראשון", "ar": "قصيدة طويلة مبنية من مقاطع ثابتة وقوافٍ، تُروى كلها بضمير المتكلم", "ru": "Длинное стихотворение из постоянных строф и рифм, рассказанное целиком от первого лица", "en": "A long poem built of fixed stanzas and rhymes, told entirely in the first person"}, {"he": "מחזה שנכתב לבמה וכולו דיאלוגים", "ar": "مسرحية كُتبت للخشبة وكلها حوارات", "ru": "Пьеса для сцены, целиком из диалогов", "en": "A play written for the stage, all in dialogue"}, {"he": "רומן שסופר כתב בתחילת דרכו", "ar": "رواية كتبها كاتب في بداية طريقه", "ru": "Роман, написанный автором в начале пути", "en": "A novel an author wrote early in their career"}],0,{"he": "השוו את האורך ואת מספר הדמויות לרומן.", "ar": "قارنوا الطول وعدد الشخصيات بالرواية.", "ru": "Сравните объём и число героев с романом.", "en": "Compare the length and the number of characters with a novel."},{"he": "נובלה היא סוגה של פרוזה. היא ארוכה מסיפור קצר וקצרה מרומן. לרוב יש בה קו עלילה אחד ומעט דמויות.", "ar": "النوفيلا نوع نثري. هي أطول من القصة القصيرة وأقصر من الرواية. وغالبًا فيها خط حبكة واحد وشخصيات قليلة.", "ru": "Повесть — жанр прозы. Она длиннее рассказа и короче романа. Обычно в ней одна сюжетная линия и немного героев.", "en": "A novella is a prose genre. It is longer than a short story and shorter than a novel. It usually has one plot line and few characters."},null,[null, {"he": "נובלה כתובה בפרוזה, לא בשורות שיר ובתים.", "ar": "النوفيلا مكتوبة نثرًا لا بأسطر شعرية ومقاطع.", "ru": "Повесть написана прозой, а не стихотворными строками и строфами.", "en": "A novella is written in prose, not in poetic lines and stanzas."}, {"he": "מחזה הוא סוגה אחרת, הנכתבת לבמה.", "ar": "المسرحية نوع آخر يُكتب للخشبة.", "ru": "Пьеса — другой жанр, она пишется для сцены.", "en": "A play is a different genre, written for the stage."}, {"he": "ההגדרה תלויה במבנה היצירה, לא בגיל הסופר.", "ar": "التعريف يتعلق ببناء العمل لا بعمر الكاتب.", "ru": "Определение зависит от строения произведения, а не от возраста автора.", "en": "The definition depends on the work's structure, not the author's age."}]),
  Q("nv-1-02",{"he": "מה ההבדל בין סיפור המעשה לבין העלילה?", "ar": "ما الفرق بين المتن الحكائي والحبكة؟", "ru": "В чём разница между фабулой и сюжетом?", "en": "What is the difference between the story and the plot?"},[{"he": "אין הבדל: שני המונחים מתארים את אותם אירועים באותו סדר בדיוק, מתחילה ועד סוף", "ar": "لا فرق: المصطلحان يصفان الأحداث نفسها بالترتيب نفسه تمامًا، من البداية إلى النهاية", "ru": "Разницы нет: оба термина описывают те же события в точно том же порядке, от начала до конца", "en": "No difference: both terms describe the same events in exactly the same order, from start to finish"}, {"he": "סיפור המעשה הוא סדר הזמן של האירועים; העלילה היא סדר הצגתם בטקסט", "ar": "المتن هو الأحداث بترتيبها الزمني، والحبكة ترتيب عرضها في النصّ", "ru": "Фабула — события по порядку времени; сюжет — порядок их подачи в тексте", "en": "The story is the events in time order; the plot is the order the text shows them"}, {"he": "העלילה היא רק פתיחת היצירה, וסיפור המעשה הוא הסוף שלה", "ar": "الحبكة هي بداية العمل فقط، والمتن هو نهايته", "ru": "Сюжет — только начало произведения, а фабула — его конец", "en": "The plot is only the opening of the work, and the story is its ending"}, {"he": "סיפור המעשה כולל דמויות, והעלילה כוללת רק תיאורי נוף ומקום ותאורה", "ar": "المتن يشمل الشخصيات، والحبكة تشمل أوصاف المنظر والمكان والإضاءة فقط", "ru": "Фабула включает героев, а сюжет — только описания пейзажа, места и освещения", "en": "The story includes characters, while the plot includes only scenery, place and lighting"}],1,{"he": "חשבו על רומן שמתחיל בסוף וחוזר אחורה.", "ar": "فكّروا في رواية تبدأ بالنهاية وتعود إلى الوراء.", "ru": "Вспомните роман, который начинается с конца и возвращается назад.", "en": "Think of a novel that starts at the end and goes back."},{"he": "סיפור המעשה הוא מה שקרה, לפי סדר הזמן. העלילה היא איך הסופר בחר לסדר ולקשר את האירועים. לכן אותו סיפור יכול להופיע בכמה עלילות שונות.", "ar": "المتن هو ما حدث بترتيبه الزمني. والحبكة هي كيف اختار الكاتب ترتيب الأحداث وربطها. لذلك يمكن أن تظهر الحكاية نفسها في حبكات مختلفة.", "ru": "Фабула — то, что произошло, по порядку времени. Сюжет — то, как автор расставил и связал события. Поэтому одна фабула может дать разные сюжеты.", "en": "The story is what happened, in time order. The plot is how the author chose to arrange and link the events. So one story can appear in several different plots."},null,[{"he": "יצירה יכולה להציג אירועים שלא לפי סדר הזמן, ואז השניים שונים.", "ar": "قد يعرض العمل الأحداث بغير ترتيبها الزمني، فيختلف الاثنان.", "ru": "Произведение может подать события не по порядку, и тогда они различаются.", "en": "A work can present events out of time order, and then the two differ."}, null, {"he": "שני המונחים חלים על היצירה כולה, לא על חלק ממנה.", "ar": "المصطلحان يشملان العمل كله لا جزءًا منه.", "ru": "Оба термина относятся ко всему произведению, а не к его части.", "en": "Both terms apply to the whole work, not to one part of it."}, {"he": "העלילה עוסקת באירועים ובדמויות, לא רק בנוף.", "ar": "الحبكة تتناول الأحداث والشخصيات لا المنظر فقط.", "ru": "Сюжет касается событий и героев, а не только пейзажа.", "en": "The plot deals with events and characters, not only scenery."}]),
  Q("nv-1-03",{"he": "מהי דמות עגולה?", "ar": "ما الشخصية المدوّرة؟", "ru": "Что такое объёмный (круглый) персонаж?", "en": "What is a round character?"},[{"he": "דמות שמופיעה רק פעם אחת בעלילה", "ar": "شخصية تظهر مرة واحدة فقط في الحبكة", "ru": "Персонаж, который появляется в сюжете только один раз", "en": "A character who appears only once in the plot"}, {"he": "דמות הבנויה סביב תכונה אחת בולטת, שאינה משתנה לאורך כל היצירה", "ar": "شخصية مبنية حول صفة واحدة بارزة لا تتغير طوال العمل كله", "ru": "Персонаж, построенный вокруг одной яркой черты, которая не меняется на протяжении всего произведения", "en": "A character built around one striking trait that never changes throughout the whole work"}, {"he": "דמות מורכבת, בעלת כמה צדדים, שיכולה להפתיע את הקורא", "ar": "شخصية مركّبة متعددة الجوانب، قد تفاجئ القارئ", "ru": "Сложный, многогранный персонаж, способный удивить читателя", "en": "A complex, many-sided character who can surprise the reader"}, {"he": "הדמות שמספרת את הסיפור בגוף ראשון", "ar": "الشخصية التي تروي القصة بضمير المتكلم", "ru": "Персонаж, который рассказывает историю от первого лица", "en": "The character who tells the story in the first person"}],2,{"he": "חשבו על דמות שקשה לתאר במילה אחת.", "ar": "فكّروا في شخصية يصعب وصفها بكلمة واحدة.", "ru": "Подумайте о персонаже, которого трудно описать одним словом.", "en": "Think of a character who is hard to describe in one word."},{"he": "לדמות עגולה יש כמה תכונות, ולפעמים הן סותרות. היא מגיבה בדרכים שהקורא לא תמיד צופה. ההפך שלה הוא דמות שטוחה.", "ar": "للشخصية المدوّرة صفات عدة، وأحيانًا متناقضة. وهي تتصرف بطرق لا يتوقعها القارئ دائمًا. وعكسها الشخصية المسطّحة.", "ru": "У объёмного персонажа несколько черт, иногда противоречивых. Он реагирует так, как читатель не всегда ожидает. Его противоположность — плоский персонаж.", "en": "A round character has several traits, sometimes contradictory. They react in ways the reader does not always expect. The opposite is a flat character."},null,[{"he": "מספר ההופעות אינו קובע אם הדמות מורכבת.", "ar": "عدد مرات الظهور لا يحدد إن كانت الشخصية مركّبة.", "ru": "Число появлений не определяет, сложен ли персонаж.", "en": "The number of appearances does not decide whether a character is complex."}, {"he": "זה תיאור של דמות שטוחה, ההפך מדמות עגולה.", "ar": "هذا وصف للشخصية المسطّحة، عكس المدوّرة.", "ru": "Это описание плоского персонажа, противоположного объёмному.", "en": "This describes a flat character, the opposite of a round one."}, null, {"he": "גם מספר וגם דמות משנית יכולים להיות עגולים או שטוחים.", "ar": "الراوي أو الشخصية الثانوية قد يكونان مدوّرين أو مسطّحين.", "ru": "И рассказчик, и второстепенный герой могут быть объёмными или плоскими.", "en": "A narrator or a minor character can be round or flat."}]),
  Q("nv-1-04",{"he": "מהו סיפור מסגרת?", "ar": "ما القصة الإطارية؟", "ru": "Что такое рамочная история (обрамление)?", "en": "What is a frame story?"},[{"he": "פרק הפתיחה, שמתאר רק את המקום ואת הזמן", "ar": "فصل الافتتاح الذي يصف المكان والزمان فقط", "ru": "Первая глава, описывающая только место и время", "en": "The opening chapter, which describes only place and time"}, {"he": "סיפור שכל פרקיו כתובים כמכתבים בין שתי דמויות רחוקות זו מזו", "ar": "قصة كل فصولها رسائل بين شخصيتين بعيدتين إحداهما عن الأخرى", "ru": "История, все главы которой — письма между двумя далёкими друг от друга героями", "en": "A story whose chapters are all letters between two characters far apart"}, {"he": "סיכום העלילה שמופיע על כריכת הספר", "ar": "ملخص الحبكة المكتوب على غلاف الكتاب", "ru": "Краткое содержание на обложке книги", "en": "The plot summary printed on the book cover"}, {"he": "סיפור חיצוני שבתוכו מסופר סיפור נוסף", "ar": "قصة خارجية تُروى في داخلها قصة أخرى", "ru": "Внешняя история, внутри которой рассказывается другая", "en": "An outer story inside which another story is told"}],3,{"he": "חשבו על קופסה שבתוכה יש קופסה.", "ar": "فكّروا في علبة في داخلها علبة.", "ru": "Представьте коробку внутри коробки.", "en": "Think of a box with another box inside it."},{"he": "בסיפור מסגרת יש שתי שכבות. הסיפור החיצוני מציג את מי שמספר ואת המצב. בתוכו מסופר הסיפור הפנימי, שהוא לרוב העיקר.", "ar": "في القصة الإطارية طبقتان. القصة الخارجية تعرض الراوي والموقف. وفي داخلها تُروى القصة الداخلية، وهي غالبًا الأساس.", "ru": "В рамочной истории два слоя. Внешний рассказ показывает рассказчика и ситуацию. Внутри звучит внутренняя история, обычно главная.", "en": "A frame story has two layers. The outer story shows who tells and the situation. Inside it the inner story is told, usually the main one."},null,[{"he": "פתיחה מציגה רקע, אבל אינה מכילה סיפור שלם נוסף.", "ar": "الافتتاح يعرض الخلفية لكنه لا يحوي قصة كاملة أخرى.", "ru": "Начало даёт фон, но не содержит ещё одной целой истории.", "en": "An opening gives background but does not hold another full story."}, {"he": "זה רומן מכתבים, מבנה אחר לגמרי.", "ar": "هذه رواية رسائل، وهي بناء مختلف تمامًا.", "ru": "Это роман в письмах, совсем другая форма.", "en": "That is an epistolary novel, a different form."}, {"he": "הכריכה אינה חלק מהיצירה עצמה.", "ar": "الغلاف ليس جزءًا من العمل نفسه.", "ru": "Обложка не является частью самого произведения.", "en": "The cover is not part of the work itself."}, null]),
  Q("nv-1-05",{"he": "מה התפקיד של האקספוזיציה (הפתיחה) ברומן?", "ar": "ما وظيفة العرض (التمهيد) في الرواية؟", "ru": "Какова роль экспозиции в романе?", "en": "What is the role of the exposition in a novel?"},[{"he": "לפתור את כל הקונפליקטים ולסיים את העלילה", "ar": "حلّ كل الصراعات وإنهاء الحبكة", "ru": "Разрешить все конфликты и закончить сюжет", "en": "To resolve all conflicts and end the plot"}, {"he": "להציג את הדמויות, המקום והמצב לפני שהעימות מתפתח", "ar": "تقديم الشخصيات والمكان والوضع قبل أن يتطوّر الصراع", "ru": "Представить героев, место и ситуацию до развития конфликта", "en": "To present the characters, place and situation before the conflict grows"}, {"he": "לחזור על המוטיב המרכזי בפעם האחרונה, רגע לפני סוף היצירה", "ar": "تكرار الموتيف المركزي للمرة الأخيرة قبيل نهاية العمل بقليل", "ru": "Повторить главный мотив в последний раз, перед самым концом произведения", "en": "To repeat the central motif one last time, just before the very end of the work"}, {"he": "להציג את דעתו של הסופר על הביקורת", "ar": "عرض رأي الكاتب في النقد", "ru": "Изложить мнение автора о критике", "en": "To present the author's opinion of the critics"}],1,{"he": "איפה בספר הקורא עוד לא מכיר אף אחד?", "ar": "في أي موضع من الكتاب لا يعرف القارئ أحدًا بعد؟", "ru": "В каком месте книги читатель ещё никого не знает?", "en": "Where in the book does the reader not yet know anyone?"},{"he": "האקספוזיציה באה בתחילת היצירה. היא נותנת לקורא את מה שצריך כדי להבין את ההמשך: מי, איפה ומה המצב. אחריה מתחיל העימות להתפתח.", "ar": "يأتي العرض في بداية العمل. وهو يعطي القارئ ما يحتاجه لفهم ما يلي: مَن وأين وما الوضع. وبعده يبدأ الصراع بالتطور.", "ru": "Экспозиция стоит в начале. Она даёт читателю то, что нужно для понимания дальнейшего: кто, где и какова ситуация. После неё развивается конфликт.", "en": "The exposition comes at the start. It gives the reader what is needed to follow the rest: who, where and what the situation is. Then the conflict develops."},null,[{"he": "פתרון הקונפליקטים בא בסוף, לא בפתיחה.", "ar": "حلّ الصراعات يأتي في النهاية لا في البداية.", "ru": "Развязка конфликтов бывает в конце, а не в начале.", "en": "Conflicts are resolved at the end, not at the opening."}, null, {"he": "האקספוזיציה נמצאת בתחילת היצירה, לא לפני הסוף.", "ar": "العرض في بداية العمل لا قبيل نهايته.", "ru": "Экспозиция находится в начале, а не перед концом.", "en": "The exposition is at the start, not just before the end."}, {"he": "האקספוזיציה היא חלק מהסיפור, לא דברי הסופר על מבקרים.", "ar": "العرض جزء من القصة لا كلام الكاتب عن النقاد.", "ru": "Экспозиция — часть истории, а не слова автора о критиках.", "en": "The exposition is part of the story, not the author's words on critics."}]),
  Q("nv-1-06",{"he": "מהו מספר יודע־כל?", "ar": "ما الراوي العليم؟", "ru": "Что такое всезнающий рассказчик?", "en": "What is an omniscient narrator?"},[{"he": "מספר שיודע מה חושבות ומרגישות כל הדמויות", "ar": "راوٍ يعرف ما تفكر فيه كل الشخصيات وما تشعر به", "ru": "Рассказчик, который знает мысли и чувства всех героев", "en": "A narrator who knows what all the characters think and feel"}, {"he": "מספר שהוא אחת הדמויות, ויודע רק מה שראה בעיניו", "ar": "راوٍ هو إحدى الشخصيات، ويعرف فقط ما رآه بعينيه", "ru": "Рассказчик-персонаж, знающий только то, что видел сам", "en": "A narrator who is one of the characters and knows only what he saw"}, {"he": "מספר שמשקר לקורא בכוונה", "ar": "راوٍ يكذب على القارئ عمدًا", "ru": "Рассказчик, который намеренно обманывает читателя", "en": "A narrator who lies to the reader on purpose"}, {"he": "הסופר עצמו, כשהוא מופיע בשמו המלא בתוך העלילה ומדבר אל הקורא", "ar": "الكاتب نفسه حين يظهر باسمه الكامل داخل الحبكة ويخاطب القارئ", "ru": "Сам автор, когда он появляется под полным именем внутри сюжета и обращается к читателю", "en": "The author himself, appearing under his full name in the plot and speaking to the reader"}],0,{"he": "שאלו: לתוך הראש של מי המספר יכול להיכנס?", "ar": "اسألوا: إلى رأس مَن يستطيع الراوي أن يدخل؟", "ru": "Спросите: в чью голову может заглянуть рассказчик?", "en": "Ask: whose head can the narrator get into?"},{"he": "מספר יודע־כל עומד מחוץ לעלילה. הוא יכול לתאר מחשבות ורגשות של כל דמות. הוא יודע גם מה קרה בעבר ובמקומות אחרים.", "ar": "الراوي العليم يقف خارج الحبكة. ويستطيع وصف أفكار كل شخصية ومشاعرها. ويعرف أيضًا ما حدث في الماضي وفي أماكن أخرى.", "ru": "Всезнающий рассказчик стоит вне сюжета. Он может описать мысли и чувства любого героя. Он знает и прошлое, и то, что происходит в других местах.", "en": "An omniscient narrator stands outside the plot. He can describe the thoughts and feelings of any character. He also knows the past and other places."},null,[null, {"he": "זה מספר בגוף ראשון, שהידיעה שלו מוגבלת.", "ar": "هذا راوٍ بضمير المتكلم، ومعرفته محدودة.", "ru": "Это рассказчик от первого лица с ограниченным знанием.", "en": "That is a first-person narrator with limited knowledge."}, {"he": "זה מספר לא מהימן; ידיעה מלאה אינה שקר.", "ar": "هذا راوٍ غير موثوق، والمعرفة الكاملة ليست كذبًا.", "ru": "Это ненадёжный рассказчик; полное знание — не обман.", "en": "That is an unreliable narrator; full knowledge is not lying."}, {"he": "המספר הוא קול בתוך היצירה, ואינו הסופר עצמו.", "ar": "الراوي صوت داخل العمل، وليس الكاتب نفسه.", "ru": "Рассказчик — голос внутри произведения, а не сам автор.", "en": "The narrator is a voice inside the work, not the author himself."}])],
 [
  Q("lit-novel-8281-3",{"he": "איזה תיאור מתאים למוטיב חוזר?", "ar": "أي وصف يناسب فكرة أو صورة متكررة؟", "ru": "Какое описание подходит к «Повторяющийся мотив»?", "en": "Which description fits recurring motif?"},[{"he": "שינוי בדמות שאפשר לזהות בהשוואה בין בחירותיה בתחילה ובסוף.", "ar": "تغيّر في الشخصية يظهر بمقارنة اختياراتها في البداية والنهاية.", "ru": "Перемена героя, заметная при сравнении выбора в начале и конце.", "en": "A change visible when comparing a character’s choices at the start and end."},{"he": "הסיפור עובר מתקופה אחת לאחרת בלי לתאר את כל מה שביניהן.", "ar": "تنتقل القصة من فترة إلى أخرى دون سرد كل ما بينهما.", "ru": "Повествование переносится в другое время, опуская промежуток.", "en": "The narrative moves to another time while skipping what lies between."},{"he": "פרט, צליל או חפץ החוזר בכמה מקומות ומקבל משמעות בהקשר.", "ar": "تفصيل أو صوت أو غرض يتكرر في مواضع ويكتسب معنى من السياق.", "ru": "Деталь, звук или предмет, повторяющийся и приобретающий смысл в контексте.", "en": "A detail, sound or object recurring and gaining meaning through context."},{"he": "קול המספר שאירועים אחרים בטקסט מעוררים ספק בדבריו.", "ar": "صوت راوٍ تجعل أحداث أخرى في النص كلامه موضع شك.", "ru": "Рассказчик, чьи слова вызывают сомнение из-за других событий текста.", "en": "A narrator whose account is cast into doubt by other events in the text."}],2,{"he": "חפשו את הפרט שמבדיל אותו מן האחרים.", "ar": "ابحثوا عن التفصيل الذي يميزه عن غيره.", "ru": "Ищите отличие от остальных вариантов.", "en": "Look for the detail that separates it from the others."},{"he": "החזרה וההקשר הופכים פרט למוטיב.", "ar": "التكرار والسياق يجعلان التفصيل فكرة متكررة.", "ru": "Повторение и контекст превращают деталь в мотив.", "en": "Repetition plus context makes a detail a motif."},null,[{"he": "זה מתאר את התפתחות דמות, לא את מוטיב חוזר.", "ar": "هذا يصف تطور الشخصية، لا فكرة أو صورة متكررة.", "ru": "Это описание «Развитие персонажа», а не «Повторяющийся мотив».", "en": "That describes character development, not recurring motif."},{"he": "זה מתאר את קפיצה בזמן, לא את מוטיב חוזר.", "ar": "هذا يصف قفزة زمنية، لا فكرة أو صورة متكررة.", "ru": "Это описание «Временной скачок», а не «Повторяющийся мотив».", "en": "That describes time jump, not recurring motif."},null,{"he": "זה מתאר את מספר לא מהימן, לא את מוטיב חוזר.", "ar": "هذا يصف راوٍ غير موثوق، لا فكرة أو صورة متكررة.", "ru": "Это описание «Ненадёжный рассказчик», а не «Повторяющийся мотив».", "en": "That describes unreliable narrator, not recurring motif."}])
 ,Q("lit-novel-turn",{"he": "איזה תיאור מתאים לנקודת מפנה?", "ar": "أي وصف يناسب نقطة التحول؟", "ru": "Какое описание подходит к переломный момент?", "en": "Which description fits a turning point?"},[{"he": "קו סיפור נוסף הרץ לצד העלילה הראשית ומאיר אותה או את הדמויות.", "ar": "خط سردي إضافي يسير بجانب الحبكة الرئيسة ويسلّط الضوء عليها أو على الشخصيات.", "ru": "Дополнительная сюжетная линия рядом с основной, оттеняющая её или героев.", "en": "An extra story line running beside the main plot, highlighting it or the characters."},{"he": "אירוע המשנה את כיוון חיי הדמות הראשית ואת מסלול הסיפור כולו.", "ar": "حدث يغيّر مسار حياة الشخصية الرئيسة واتجاه القصة كلها.", "ru": "Событие, меняющее направление жизни героя и ход всей истории.", "en": "An event that changes the main character's life direction and the story's whole course."},{"he": "פריט או תמונה החוזרים ביצירה וטוענים משמעות נוספת מעבר לעצמם.", "ar": "عنصر أو صورة يتكرر في العمل ويحمل معنى إضافيًّا يتجاوز ذاته.", "ru": "Предмет или образ, повторяющийся в произведении и несущий смысл сверх самого себя.", "en": "An object or image that recurs in the work and carries meaning beyond itself."},{"he": "הזמן והמקום שבהם מתרחשת העלילה והמשפיעים על אופי ההתרחשות.", "ar": "الزمان والمكان اللذان تجري فيهما الحبكة ويؤثران في طبيعة الأحداث.", "ru": "Время и место действия, влияющие на характер происходящего.", "en": "The time and place where the plot happens, shaping how events unfold."}],1,{"he": "חפשו אירוע שאחרי אין כמו לפני.", "ar": "ابحثوا عن حدث يصبح ما بعده مختلفًا عمّا قبله.", "ru": "Ищите событие, после которого всё иначе, чем прежде.", "en": "Look for an event after which nothing is as before."},{"he": "נקודת מפנה מחלקת את הסיפור ללפני ואחרי. למשל גילוי מכתב שמשנה את יחסי הדמויות.", "ar": "نقطة التحول تقسم القصة إلى قبل وبعد. مثال: اكتشاف رسالة يغيّر علاقات الشخصيات.", "ru": "Перелом делит историю на «до» и «после». Например, найденное письмо, меняющее отношения героев.", "en": "A turning point splits the story into before and after. For example, a discovered letter that changes the characters' relationships."},null,[{"he": "זה מתאר את עלילת משנה, לא את נקודת מפנה.", "ar": "هذا يصف حبكة فرعية، لا نقطة التحول.", "ru": "Это описание «побочную линию», а не «переломный момент».", "en": "That describes a subplot, not a turning point."},null,{"he": "זה מתאר את סמל, לא את נקודת מפנה.", "ar": "هذا يصف رمز، لا نقطة التحول.", "ru": "Это описание «символ», а не «переломный момент».", "en": "That describes a symbol, not a turning point."},{"he": "זה מתאר את רקע, לא את נקודת מפנה.", "ar": "هذا يصف الخلفية، لا نقطة التحول.", "ru": "Это описание «фон», а не «переломный момент».", "en": "That describes the setting, not a turning point."}]),Q("lit-novel-sub-use",{"he": "ברומן, פרק שלם עוקב אחר אחיו הקטן של הגיבור, החווה דילמה הדומה לשל אחיו. מה תפקיד הפרק?", "ar": "في رواية، يتبع فصل كامل الأخ الأصغر للبطل وهو يعيش معضلة تشبه معضلة أخيه. ما وظيفة هذا الفصل؟", "ru": "В романе целая глава следит за младшим братом героя, переживающим схожую дилемму. Какова роль этой главы?", "en": "In a novel, a whole chapter follows the hero's little brother facing a dilemma similar to his. What is the chapter's role?"},[{"he": "עלילת משנה המאירה את העלילה הראשית", "ar": "حبكة فرعية تسلّط الضوء على الحبكة الرئيسة", "ru": "Побочная линия, оттеняющая основной сюжет", "en": "A subplot highlighting the main plot"},{"he": "טעות דפוס שהוכנסה לספר", "ar": "خطأ طباعة دخل إلى الكتاب", "ru": "Типографская ошибка, попавшая в книгу", "en": "A printing error that got into the book"},{"he": "תקציר של סוף הרומן", "ar": "ملخص لنهاية الرواية", "ru": "Краткий пересказ конца романа", "en": "A summary of the novel's ending"},{"he": "רשימת דמויות לתחילת הספר", "ar": "قائمة شخصيات لمقدمة الكتاب", "ru": "Список персонажей для начала книги", "en": "A character list for the book's opening"}],0,{"he": "האם הפרק קשור לקו הראשי, ואם כן איך?", "ar": "هل يرتبط الفصل بالخط الرئيس؟ وكيف؟", "ru": "Связана ли глава с главной линией, и если да, то как?", "en": "Is the chapter tied to the main line, and if so, how?"},{"he": "עלילת משנה מקבילה לראשית ומאירה אותה. למשל דילמה דומה אצל האח מדגישה את בחירת הגיבור.", "ar": "الحبكة الفرعية توازي الرئيسة وتسلّط الضوء عليها. مثال: معضلة مشابهة لدى الأخ تبرز اختيار البطل.", "ru": "Побочная линия идёт параллельно основной и оттеняет её. Например, схожая дилемма брата подчёркивает выбор героя.", "en": "A subplot parallels the main plot and highlights it. For example, the brother's similar dilemma stresses the hero's choice."},null,[null,{"he": "הפרק כתוב בכוונה וקשור לדילמה המרכזית.", "ar": "الفصل مكتوب عن قصد ومرتبط بالمعضلة المركزية.", "ru": "Глава написана намеренно и связана с центральной дилеммой.", "en": "The chapter is deliberate and tied to the central dilemma."},{"he": "הפרק אינו מסכם דבר; הוא מוסיף קו סיפור חדש.", "ar": "الفصل لا يلخّص شيئًا بل يضيف خطًّا سرديًّا جديدًا.", "ru": "Глава ничего не подводит; она добавляет новую линию.", "en": "The chapter summarizes nothing; it adds a new story line."},{"he": "רשימת דמויות היא טבלה, לא פרק סיפורי.", "ar": "قائمة الشخصيات جدول وليست فصلًا سرديًّا.", "ru": "Список персонажей — таблица, а не narrative глава.", "en": "A character list is a table, not a narrative chapter."}]),
  Q("nv-2-01",{"he": "רומן נפתח בהלוויה של הגיבורה, ורק אחר כך חוזר לילדותה. מה אפשר לומר על המבנה?", "ar": "تبدأ رواية بجنازة البطلة، ثم تعود بعد ذلك إلى طفولتها. ماذا يمكن القول عن البناء؟", "ru": "Роман открывается похоронами героини и лишь потом возвращается к её детству. Что можно сказать о строении?", "en": "A novel opens with the heroine's funeral and only then goes back to her childhood. What can be said about its structure?"},[{"he": "זה סיפור מסגרת, כי יש בו שני מספרים שונים", "ar": "هذه قصة إطارية لأن فيها راويين مختلفين", "ru": "Это рамочная история, потому что в ней два разных рассказчика", "en": "It is a frame story, because it has two different narrators"}, {"he": "העלילה כרונולוגית לגמרי, מהלידה ועד המוות של הגיבורה", "ar": "الحبكة زمنية تمامًا، من ولادة البطلة إلى موتها", "ru": "Сюжет полностью хронологичен, от рождения героини до её смерти", "en": "The plot is fully chronological, from the heroine's birth to her death"}, {"he": "סדר העלילה שונה מסדר הזמן: היא פותחת בסוף וחוזרת אחורה", "ar": "ترتيب الحبكة يختلف عن الترتيب الزمني: تبدأ بالنهاية وتعود", "ru": "Порядок сюжета отличается от порядка времени: он начинается с конца", "en": "The plot order differs from time order: it opens at the end and goes back"}, {"he": "זה רומן מכתבים, כי ההלוויה מתוארת בגוף ראשון ובפירוט רב מאוד", "ar": "هذه رواية رسائل لأن الجنازة موصوفة بضمير المتكلم وبتفصيل كبير جدًا", "ru": "Это роман в письмах, потому что похороны описаны от первого лица и очень подробно", "en": "It is an epistolary novel, because the funeral is told in the first person and in great detail"}],2,{"he": "השוו את סדר הפרקים לסדר שבו הדברים קרו.", "ar": "قارنوا ترتيب الفصول بالترتيب الذي وقعت فيه الأمور.", "ru": "Сравните порядок глав с порядком, в котором всё случилось.", "en": "Compare the order of the chapters with the order in which things happened."},{"he": "בסדר הזמן, הילדות באה לפני המוות. העלילה הפכה את הסדר ופתחה בסוף. כך הקורא יודע מה יקרה, ושואל איך זה קרה.", "ar": "في الترتيب الزمني تأتي الطفولة قبل الموت. والحبكة قلبت الترتيب وبدأت بالنهاية. فيعرف القارئ ما سيحدث، ويسأل كيف حدث.", "ru": "По времени детство идёт раньше смерти. Сюжет перевернул порядок и начал с конца. Читатель знает, что случится, и спрашивает, как это произошло.", "en": "In time order, childhood comes before death. The plot reversed the order and opened at the end. The reader knows what will happen and asks how it happened."},null,[{"he": "השאלה אינה מזכירה שני מספרים או סיפור בתוך סיפור.", "ar": "السؤال لا يذكر راويين ولا قصة داخل قصة.", "ru": "В вопросе нет двух рассказчиков или истории в истории.", "en": "The question mentions no two narrators and no story within a story."}, {"he": "הרומן פותח במוות, ולכן הוא אינו מסודר לפי הזמן.", "ar": "الرواية تبدأ بالموت، فهي ليست مرتبة زمنيًا.", "ru": "Роман начинается со смерти, значит, он не идёт по порядку времени.", "en": "The novel opens with death, so it is not in time order."}, null, {"he": "גוף ראשון אינו הופך רומן לרומן מכתבים.", "ar": "ضمير المتكلم لا يجعل الرواية رواية رسائل.", "ru": "Первое лицо не делает роман романом в письмах.", "en": "First person does not make a novel epistolary."}]),
  Q("nv-2-02",{"he": "בתחילת נובלה דני מסרב לעזור לשכנים. בסוף הוא מארגן בעצמו עזרה לכל השכונה. מה זה מראה?", "ar": "في بداية نوفيلا يرفض داني مساعدة الجيران. وفي النهاية ينظّم بنفسه المساعدة للحي كله. ماذا يُظهر هذا؟", "ru": "В начале повести Дани отказывается помогать соседям. В конце он сам организует помощь всему району. Что это показывает?", "en": "At the start of a novella, Dani refuses to help his neighbors. At the end, he organizes help for the whole neighborhood himself. What does this show?"},[{"he": "דני הוא דמות שטוחה, כי הוא מופיע בכל אחד מפרקי הנובלה", "ar": "داني شخصية مسطّحة لأنه يظهر في كل فصل من فصول النوفيلا", "ru": "Дани — плоский персонаж, потому что он появляется в каждой главе этой повести", "en": "Dani is a flat character, because he appears in every chapter of the novella"}, {"he": "זו קפיצה בזמן, כי הסוף רחוק מההתחלה", "ar": "هذه قفزة زمنية لأن النهاية بعيدة عن البداية", "ru": "Это скачок во времени, потому что конец далёк от начала", "en": "It is a time jump, because the end is far from the start"}, {"he": "המספר אינו מהימן, כי שני המעשים סותרים", "ar": "الراوي غير موثوق لأن الفعلين متناقضان", "ru": "Рассказчик ненадёжен, потому что поступки противоречат друг другу", "en": "The narrator is unreliable, because the two acts contradict"}, {"he": "דני הוא דמות מתפתחת: היחס שלו לאחרים השתנה", "ar": "داني شخصية نامية: تغيّر موقفه من الآخرين", "ru": "Дани — развивающийся персонаж: его отношение к другим изменилось", "en": "Dani is a developing character: his attitude to others changed"}],3,{"he": "השוו את הבחירה של דני בהתחלה ובסוף.", "ar": "قارنوا اختيار داني في البداية والنهاية.", "ru": "Сравните выбор Дани в начале и в конце.", "en": "Compare Dani's choice at the start and at the end."},{"he": "דמות מתפתחת משתנה במהלך היצירה. רואים זאת כשמשווים את הבחירות שלה בהתחלה ובסוף. דני עבר מסירוב לעזרה פעילה.", "ar": "الشخصية النامية تتغير خلال العمل. ونرى ذلك حين نقارن اختياراتها في البداية والنهاية. انتقل داني من الرفض إلى المساعدة الفعّالة.", "ru": "Развивающийся персонаж меняется по ходу произведения. Это видно, если сравнить его выбор в начале и в конце. Дани перешёл от отказа к активной помощи.", "en": "A developing character changes during the work. We see it by comparing their choices at the start and the end. Dani moved from refusal to active help."},null,[{"he": "דמות שטוחה אינה משתנה, ודני השתנה מאוד.", "ar": "الشخصية المسطّحة لا تتغير، وداني تغيّر كثيرًا.", "ru": "Плоский персонаж не меняется, а Дани изменился сильно.", "en": "A flat character does not change, and Dani changed a lot."}, {"he": "השאלה עוסקת בשינוי בדמות, לא בדילוג על זמן.", "ar": "السؤال عن تغيّر الشخصية لا عن تخطّي الزمن.", "ru": "Вопрос о перемене в персонаже, а не о пропуске времени.", "en": "The question is about change in a character, not skipping time."}, {"he": "הסתירה היא בין התחלה לסוף, ולכן היא מראה שינוי ולא שקר.", "ar": "التناقض بين البداية والنهاية، فهو يدل على تغيّر لا على كذب.", "ru": "Противоречие между началом и концом говорит о перемене, а не о лжи.", "en": "The contrast is between start and end, so it shows change, not lying."}, null]),
  Q("nv-2-03",{"he": "ברומן, שעון עומד מופיע בבית הגיבור, בחלום שלו ובפרק האחרון. איך נכון לקרוא אותו?", "ar": "في رواية تظهر ساعة متوقفة في بيت البطل وفي حلمه وفي الفصل الأخير. كيف تصحّ قراءتها؟", "ru": "В романе остановившиеся часы появляются в доме героя, в его сне и в последней главе. Как их правильно читать?", "en": "In a novel, a stopped clock appears in the hero's house, in his dream and in the last chapter. How should it be read?"},[{"he": "כמוטיב: לבדוק מה קורה בכל הופעה ואיזו משמעות הוא צובר", "ar": "كموتيف: نفحص ما يحدث في كل ظهور وأي معنى يكتسب", "ru": "Как мотив: смотреть, что происходит при каждом появлении и какой смысл он набирает", "en": "As a motif: check what happens at each appearance and what meaning it gains"}, {"he": "כפרט רקע בלבד, כי שעונים מופיעים כמעט בכל בית ואין בהם שום דבר מיוחד", "ar": "كتفصيل خلفية فقط، لأن الساعات موجودة في كل بيت تقريبًا ولا شيء خاص فيها", "ru": "Как простую деталь фона, ведь часы есть почти в каждом доме и в них нет ничего особого", "en": "As mere background, since clocks are in almost every house and nothing is special about them"}, {"he": "כנקודת מפנה, כי הוא מופיע בפרק האחרון", "ar": "كنقطة تحوّل لأنها تظهر في الفصل الأخير", "ru": "Как поворотный момент, раз они есть в последней главе", "en": "As a turning point, because it appears in the last chapter"}, {"he": "כסימן שהסופר לא ערך את הספר כראוי", "ar": "كدليل على أن الكاتب لم يحرّر الكتاب كما يجب", "ru": "Как знак того, что автор плохо отредактировал книгу", "en": "As a sign that the author did not edit the book properly"}],0,{"he": "שימו לב לכך שהפרט מופיע שוב ושוב.", "ar": "انتبهوا إلى أن التفصيل يظهر مرة بعد مرة.", "ru": "Обратите внимание, что деталь появляется снова и снова.", "en": "Notice that the detail keeps coming back."},{"he": "פרט שחוזר בכמה מקומות חשובים הוא מוטיב. כדי לפרש אותו, בודקים את ההקשר של כל הופעה. שעון עומד יכול לרמוז, למשל, לגיבור שנתקע בעבר.", "ar": "التفصيل الذي يتكرر في مواضع مهمة هو موتيف. ولتفسيره نفحص سياق كل ظهور. فالساعة المتوقفة قد تلمّح مثلًا إلى بطل عالق في الماضي.", "ru": "Деталь, повторяющаяся в важных местах, — это мотив. Чтобы его истолковать, смотрят на контекст каждого появления. Остановившиеся часы могут намекать, например, на героя, застрявшего в прошлом.", "en": "A detail that recurs in key places is a motif. To interpret it, check the context of each appearance. A stopped clock may hint, for example, at a hero stuck in the past."},null,[null, {"he": "פרט שחוזר במקומות חשובים אינו רקע בלבד.", "ar": "التفصيل المتكرر في مواضع مهمة ليس مجرد خلفية.", "ru": "Деталь, повторяющаяся в важных местах, — не просто фон.", "en": "A detail that recurs in key places is not mere background."}, {"he": "נקודת מפנה היא אירוע שמשנה את הכיוון, לא חפץ שחוזר.", "ar": "نقطة التحوّل حدث يغيّر الاتجاه لا شيء يتكرر.", "ru": "Поворот — это событие, меняющее ход, а не повторяющийся предмет.", "en": "A turning point is an event that shifts direction, not a recurring object."}, {"he": "החזרה מכוונת ובונה משמעות; היא אינה טעות עריכה.", "ar": "التكرار مقصود ويبني المعنى، وليس خطأ تحرير.", "ru": "Повтор намеренный и создаёт смысл; это не ошибка редактуры.", "en": "The repetition is deliberate and builds meaning; it is no editing error."}]),
  Q("nv-2-04",{"he": "המספרת אומרת: \"אני אף פעם לא כועסת\". אבל בכל פרק היא טורקת דלתות וצועקת. מה המסקנה?", "ar": "تقول الراوية: «أنا لا أغضب أبدًا». لكنها في كل فصل تصفق الأبواب وتصرخ. ما الاستنتاج؟", "ru": "Рассказчица говорит: «Я никогда не злюсь». Но в каждой главе она хлопает дверями и кричит. Какой вывод?", "en": "The narrator says: \"I never get angry.\" But in every chapter she slams doors and shouts. What is the conclusion?"},[{"he": "זו מספרת יודעת־כל, ולכן אפשר לסמוך עליה", "ar": "هذه راوية عليمة، لذلك يمكن الوثوق بها", "ru": "Это всезнающая рассказчица, поэтому ей можно верить", "en": "She is an omniscient narrator, so she can be trusted"}, {"he": "המספרת אינה מהימנה: המעשים שלה סותרים את דבריה", "ar": "الراوية غير موثوقة: أفعالها تناقض كلامها", "ru": "Рассказчица ненадёжна: её поступки противоречат её словам", "en": "The narrator is unreliable: her actions contradict her words"}, {"he": "הסופר טעה, ולכן אין משמעות לסתירה", "ar": "أخطأ الكاتب، لذلك لا معنى للتناقض", "ru": "Автор ошибся, поэтому противоречие ничего не значит", "en": "The author made a mistake, so the contradiction means nothing"}, {"he": "טריקת הדלתות היא מוטיב שמסמל שמחה ושלווה בבית המשפחה", "ar": "صفق الأبواب موتيف يرمز إلى الفرح والهدوء في بيت العائلة", "ru": "Хлопанье дверями — мотив, символизирующий радость и покой в семейном доме", "en": "The door slamming is a motif that symbolizes joy and calm in the family home"}],1,{"he": "השוו בין מה שהיא אומרת לבין מה שהיא עושה.", "ar": "قارنوا بين ما تقوله وما تفعله.", "ru": "Сравните то, что она говорит, с тем, что она делает.", "en": "Compare what she says with what she does."},{"he": "כשהמעשים בטקסט סותרים את דברי המספרת, הקורא מבין שאסור לסמוך עליה לגמרי. זהו מספר לא מהימן. הפער עצמו מלמד משהו על הדמות.", "ar": "حين تناقض الأفعال في النص كلام الراوية، يفهم القارئ أنه لا يصح الوثوق بها تمامًا. هذا راوٍ غير موثوق. والفجوة نفسها تكشف شيئًا عن الشخصية.", "ru": "Когда поступки в тексте противоречат словам рассказчицы, читатель понимает, что ей нельзя полностью верить. Это ненадёжный рассказчик. Сам разрыв говорит о героине.", "en": "When actions in the text contradict the narrator's words, the reader sees she cannot be fully trusted. This is an unreliable narrator. The gap itself reveals the character."},null,[{"he": "היא מדברת על עצמה בגוף ראשון, והסתירה פוגעת באמינות.", "ar": "هي تتحدث عن نفسها بضمير المتكلم، والتناقض يضعف الثقة بها.", "ru": "Она говорит о себе от первого лица, и противоречие подрывает доверие.", "en": "She speaks of herself in the first person, and the contradiction undermines trust."}, null, {"he": "הסתירה חוזרת בכל פרק, ולכן היא מכוונת ולא טעות.", "ar": "التناقض يتكرر في كل فصل، فهو مقصود لا خطأ.", "ru": "Противоречие повторяется в каждой главе, значит, оно намеренное.", "en": "The contradiction recurs in every chapter, so it is deliberate."}, {"he": "טריקת דלתות וצעקות מבטאות כעס, לא שלווה.", "ar": "صفق الأبواب والصراخ يعبّران عن الغضب لا الهدوء.", "ru": "Хлопанье дверями и крики выражают злость, а не покой.", "en": "Slamming doors and shouting express anger, not calm."}]),
  Q("nv-2-05",{"he": "בנובלה, השכן מופיע רק כדי להתלונן על הרעש, ותמיד באותו משפט. איזו דמות זו?", "ar": "في نوفيلا يظهر الجار فقط ليشتكي من الضجيج، ودائمًا بالجملة نفسها. أي شخصية هذه؟", "ru": "В повести сосед появляется только чтобы пожаловаться на шум, и всегда одной и той же фразой. Что это за персонаж?", "en": "In a novella, the neighbor appears only to complain about noise, always with the same sentence. What kind of character is this?"},[{"he": "דמות עגולה, כי יש לה משפט קבוע שהקוראים זוכרים היטב", "ar": "شخصية مدوّرة لأن لها جملة ثابتة يتذكرها القرّاء جيدًا", "ru": "Объёмный персонаж, потому что у него есть фраза, которую читатели хорошо помнят", "en": "A round character, because he has a set phrase readers remember well"}, {"he": "דמות מתפתחת, כי היא מופיעה כמה פעמים", "ar": "شخصية نامية لأنها تظهر عدة مرات", "ru": "Развивающийся персонаж, потому что появляется несколько раз", "en": "A developing character, because he appears several times"}, {"he": "דמות שטוחה: תכונה אחת, בלי שינוי", "ar": "شخصية مسطّحة: صفة واحدة بلا تغيير", "ru": "Плоский персонаж: одна черта, без перемен", "en": "A flat character: one trait, no change"}, {"he": "המספר, כי הוא פונה ישר אל הקורא", "ar": "الراوي، لأنه يخاطب القارئ مباشرة", "ru": "Рассказчик, потому что обращается прямо к читателю", "en": "The narrator, because he speaks straight to the reader"}],2,{"he": "כמה צדדים של השכן הקורא מכיר?", "ar": "كم جانبًا من الجار يعرف القارئ؟", "ru": "Сколько сторон соседа знает читатель?", "en": "How many sides of the neighbor does the reader know?"},{"he": "לשכן יש תכונה אחת בלבד, והיא חוזרת בלי שינוי. זו דמות שטוחה. דמויות כאלה משמשות לרוב כרקע לדמויות הראשיות.", "ar": "للجار صفة واحدة فقط تتكرر بلا تغيير. هذه شخصية مسطّحة. ومثل هذه الشخصيات تخدم غالبًا كخلفية للشخصيات الرئيسية.", "ru": "У соседа только одна черта, и она повторяется без изменений. Это плоский персонаж. Такие герои обычно служат фоном для главных.", "en": "The neighbor has only one trait, repeated without change. This is a flat character. Such characters usually serve as background for the main ones."},null,[{"he": "משפט קבוע מראה צד אחד, ולא מורכבות של דמות עגולה.", "ar": "الجملة الثابتة تُظهر جانبًا واحدًا لا تعقيد الشخصية المدوّرة.", "ru": "Одна фраза показывает одну сторону, а не сложность объёмного героя.", "en": "A set phrase shows one side, not the complexity of a round character."}, {"he": "הוא מופיע כמה פעמים, אבל בכל פעם הוא אותו דבר.", "ar": "يظهر عدة مرات، لكنه في كل مرة هو نفسه.", "ru": "Он появляется несколько раз, но каждый раз одинаков.", "en": "He appears several times, but is the same each time."}, null, {"he": "השכן הוא דמות בעלילה, ולא הקול שמספר אותה.", "ar": "الجار شخصية في الحبكة لا الصوت الذي يرويها.", "ru": "Сосед — персонаж сюжета, а не голос, который его рассказывает.", "en": "The neighbor is a character in the plot, not the voice telling it."}]),
  Q("nv-2-06",{"he": "סבא יושב עם נכדתו ומספר לה על המסע שלו כנער. בסוף חוזרים לחדר שבו הם יושבים. מה המבנה?", "ar": "يجلس الجد مع حفيدته ويروي لها رحلته في صباه. وفي النهاية نعود إلى الغرفة التي يجلسان فيها. ما البناء؟", "ru": "Дедушка сидит с внучкой и рассказывает ей о своём путешествии в юности. В конце мы возвращаемся в комнату, где они сидят. Какое это строение?", "en": "A grandfather sits with his granddaughter and tells her about his journey as a boy. At the end we return to the room where they sit. What is the structure?"},[{"he": "עלילת משנה שאינה קשורה בכלל לעלילה הראשית של הרומן", "ar": "حبكة فرعية لا علاقة لها أبدًا بالحبكة الرئيسية للرواية", "ru": "Побочная сюжетная линия, которая никак не связана с главным сюжетом романа", "en": "A side subplot that has no link at all to the main plot of the novel"}, {"he": "עלילה כרונולוגית אחת בלי שבירה בזמן", "ar": "حبكة زمنية واحدة بلا كسر في الزمن", "ru": "Одна хронологическая линия без разрывов во времени", "en": "One chronological plot with no break in time"}, {"he": "מספר לא מהימן, כי הסבא זקן", "ar": "راوٍ غير موثوق لأن الجد مسنّ", "ru": "Ненадёжный рассказчик, потому что дедушка стар", "en": "An unreliable narrator, because the grandfather is old"}, {"he": "סיפור מסגרת: סיפור המסע משובץ בתוך הסצנה בחדר", "ar": "قصة إطارية: قصة الرحلة مدمجة داخل مشهد الغرفة", "ru": "Рамочная история: рассказ о путешествии вставлен в сцену в комнате", "en": "A frame story: the journey story is set inside the room scene"}],3,{"he": "כמה שכבות של סיפור יש כאן?", "ar": "كم طبقة من القصص هنا؟", "ru": "Сколько слоёв повествования здесь?", "en": "How many layers of story are there here?"},{"he": "הסצנה בחדר היא הסיפור החיצוני. סיפור המסע הוא הסיפור הפנימי. החזרה לחדר בסוף סוגרת את המסגרת.", "ar": "مشهد الغرفة هو القصة الخارجية. وقصة الرحلة هي القصة الداخلية. والعودة إلى الغرفة في النهاية تغلق الإطار.", "ru": "Сцена в комнате — внешняя история. Рассказ о путешествии — внутренняя. Возвращение в комнату в конце закрывает рамку.", "en": "The room scene is the outer story. The journey is the inner story. Returning to the room at the end closes the frame."},null,[{"he": "סיפור המסע הוא לב היצירה, לא קו צדדי.", "ar": "قصة الرحلة قلب العمل لا خط جانبي.", "ru": "Рассказ о путешествии — сердце произведения, а не побочная линия.", "en": "The journey story is the heart of the work, not a side line."}, {"he": "הסיפור קופץ מהווה לעבר וחוזר, ולכן הזמן נשבר.", "ar": "القصة تقفز من الحاضر إلى الماضي وتعود، فالزمن منكسر.", "ru": "История прыгает из настоящего в прошлое и обратно, время прерывается.", "en": "The story jumps from present to past and back, so time is broken."}, {"he": "גיל אינו סיבה לחוסר אמינות; צריך סתירה בטקסט.", "ar": "العمر ليس سببًا لعدم الموثوقية، بل يلزم تناقض في النص.", "ru": "Возраст — не причина ненадёжности; нужно противоречие в тексте.", "en": "Age is no reason for unreliability; a contradiction in the text is needed."}, null])],
 [
  Q("lit-novel-8281-4",{"he": "איזה תיאור מתאים למספר לא מהימן?", "ar": "أي وصف يناسب راوٍ غير موثوق؟", "ru": "Какое описание подходит к «Ненадёжный рассказчик»?", "en": "Which description fits unreliable narrator?"},[{"he": "שינוי בדמות שאפשר לזהות בהשוואה בין בחירותיה בתחילה ובסוף.", "ar": "تغيّر في الشخصية يظهر بمقارنة اختياراتها في البداية والنهاية.", "ru": "Перемена героя, заметная при сравнении выбора в начале и конце.", "en": "A change visible when comparing a character’s choices at the start and end."},{"he": "הסיפור עובר מתקופה אחת לאחרת בלי לתאר את כל מה שביניהן.", "ar": "تنتقل القصة من فترة إلى أخرى دون سرد كل ما بينهما.", "ru": "Повествование переносится в другое время, опуская промежуток.", "en": "The narrative moves to another time while skipping what lies between."},{"he": "פרט, צליל או חפץ החוזר בכמה מקומות ומקבל משמעות בהקשר.", "ar": "تفصيل أو صوت أو غرض يتكرر في مواضع ويكتسب معنى من السياق.", "ru": "Деталь, звук или предмет, повторяющийся и приобретающий смысл в контексте.", "en": "A detail, sound or object recurring and gaining meaning through context."},{"he": "קול המספר שאירועים אחרים בטקסט מעוררים ספק בדבריו.", "ar": "صوت راوٍ تجعل أحداث أخرى في النص كلامه موضع شك.", "ru": "Рассказчик, чьи слова вызывают сомнение из-за других событий текста.", "en": "A narrator whose account is cast into doubt by other events in the text."}],3,{"he": "חפשו את הפרט שמבדיל אותו מן האחרים.", "ar": "ابحثوا عن التفصيل الذي يميزه عن غيره.", "ru": "Ищите отличие от остальных вариантов.", "en": "Look for the detail that separates it from the others."},{"he": "סתירה בין דברי המספר לפרטים אחרים מזמינה בדיקה.", "ar": "التناقض بين روايته وتفاصيل أخرى يدعو إلى التحقق.", "ru": "Противоречие между рассказом и другими деталями требует проверки.", "en": "A contradiction between the account and other details invites scrutiny."},null,[{"he": "זה מתאר את התפתחות דמות, לא את מספר לא מהימן.", "ar": "هذا يصف تطور الشخصية، لا راوٍ غير موثوق.", "ru": "Это описание «Развитие персонажа», а не «Ненадёжный рассказчик».", "en": "That describes character development, not unreliable narrator."},{"he": "זה מתאר את קפיצה בזמן, לא את מספר לא מהימן.", "ar": "هذا يصف قفزة زمنية، لا راوٍ غير موثوق.", "ru": "Это описание «Временной скачок», а не «Ненадёжный рассказчик».", "en": "That describes time jump, not unreliable narrator."},{"he": "זה מתאר את מוטיב חוזר, לא את מספר לא מהימן.", "ar": "هذا يصف فكرة أو صورة متكررة، لا راوٍ غير موثوق.", "ru": "Это описание «Повторяющийся мотив», а не «Ненадёжный рассказчик».", "en": "That describes recurring motif, not unreliable narrator."},null])
 ,Q("lit-novel-sym",{"he": "איזה תיאור מתאים לסמל?", "ar": "أي وصف يناسب رمز؟", "ru": "Какое описание подходит к символ?", "en": "Which description fits a symbol?"},[{"he": "קו סיפור נוסף הרץ לצד העלילה הראשית ומאיר אותה או את הדמויות.", "ar": "خط سردي إضافي يسير بجانب الحبكة الرئيسة ويسلّط الضوء عليها أو على الشخصيات.", "ru": "Дополнительная сюжетная линия рядом с основной, оттеняющая её или героев.", "en": "An extra story line running beside the main plot, highlighting it or the characters."},{"he": "אירוע המשנה את כיוון חיי הדמות הראשית ואת מסלול הסיפור כולו.", "ar": "حدث يغيّر مسار حياة الشخصية الرئيسة واتجاه القصة كلها.", "ru": "Событие, меняющее направление жизни героя и ход всей истории.", "en": "An event that changes the main character's life direction and the story's whole course."},{"he": "פריט או תמונה החוזרים ביצירה וטוענים משמעות נוספת מעבר לעצמם.", "ar": "عنصر أو صورة يتكرر في العمل ويحمل معنى إضافيًّا يتجاوز ذاته.", "ru": "Предмет или образ, повторяющийся в произведении и несущий смысл сверх самого себя.", "en": "An object or image that recurs in the work and carries meaning beyond itself."},{"he": "הזמן והמקום שבהם מתרחשת העלילה והמשפיעים על אופי ההתרחשות.", "ar": "الزمان والمكان اللذان تجري فيهما الحبكة ويؤثران في طبيعة الأحداث.", "ru": "Время и место действия, влияющие на характер происходящего.", "en": "The time and place where the plot happens, shaping how events unfold."}],2,{"he": "מה חוזר וצובר משמעות?", "ar": "ما الذي يتكرر ويكتسب معنى؟", "ru": "Что повторяется и накапливает смысл?", "en": "What recurs and gathers meaning?"},{"he": "סמל טוען משמעות נוספת. למשל עץ שמופיע בכל מפנה ומסמל שורשים.", "ar": "الرمز يحمل معنى إضافيًّا. مثال: شجرة تظهر عند كل مفصل وترمز إلى الجذور.", "ru": "Символ несёт добавочный смысл. Например, дерево, появляющееся на каждом рубеже и означающее корни.", "en": "A symbol carries extra meaning. For example, a tree appearing at every turning point, standing for roots."},null,[{"he": "זה מתאר את עלילת משנה, לא את סמל.", "ar": "هذا يصف حبكة فرعية، لا رمز.", "ru": "Это описание «побочную линию», а не «символ».", "en": "That describes a subplot, not a symbol."},{"he": "זה מתאר את נקודת מפנה, לא את סמל.", "ar": "هذا يصف نقطة التحول، لا رمز.", "ru": "Это описание «переломный момент», а не «символ».", "en": "That describes a turning point, not a symbol."},null,{"he": "זה מתאר את רקע, לא את סמל.", "ar": "هذا يصف الخلفية، لا رمز.", "ru": "Это описание «фон», а не «символ».", "en": "That describes the setting, not a symbol."}]),Q("lit-novel-rain",{"he": "קורא טוען שהגשם ברומן \"הוא רק מזג אוויר\", ועמיתו משיב שהגשם מסמל טיהור. איזו עמדה מדויקת?", "ar": "يدّعي قارئ أن المطر في الرواية «مجرد طقس»، ويردّ زميله أنه يرمز إلى التطهير. أي موقف أدق؟", "ru": "Читатель считает дождь в романе «просто погодой», а его товарищ отвечает, что дождь символизирует очищение. Какая позиция точнее?", "en": "One reader says the rain in a novel is \"just weather\"; his peer answers it symbolizes cleansing. Which stance is accurate?"},[{"he": "הגשם תמיד מסמל טיהור בכל יצירה", "ar": "المطر يرمز دائمًا إلى التطهير في كل عمل", "ru": "Дождь всегда символизирует очищение в любом произведении", "en": "Rain always symbolizes cleansing in every work"},{"he": "שתי הקריאות אפשריות; סמל נקבע לפי ההקשר וחזרתו בטקסט", "ar": "كلتا القراءتين ممكنتان، فالرمز يتحدد بالسياق وتكراره في النصّ", "ru": "Обе трактовки возможны; символ определяется контекстом и повторяемостью в тексте", "en": "Both readings are possible; a symbol is set by context and recurrence in the text"},{"he": "מזג אוויר לעולם אינו סמל בספרות", "ar": "الطقس لا يكون رمزًا أبدًا في الأدب", "ru": "Погода никогда не бывает символом в литературе", "en": "Weather is never a symbol in literature"},{"he": "רק הסופר רשאי להחליט מה סמל", "ar": "الكاتب وحده يحق له تقرير ما هو رمز", "ru": "Только автор вправе решать, что является символом", "en": "Only the author may decide what is a symbol"}],1,{"he": "בדקו אם הפריט חוזר וצובר משמעות בהקשר.", "ar": "تحققوا إن كان العنصر يتكرر ويكتسب معنى في السياق.", "ru": "Проверьте, повторяется ли элемент и набирает ли смысл в контексте.", "en": "Check whether the element recurs and gains meaning in context."},{"he": "סמל אינו חוק קבוע אלא תבנית בטקסט. למשל גשם החוזר ברגעי שינוי ומתואר כמכבה אש יכול להיקרא כטיהור.", "ar": "الرمز ليس قاعدة ثابتة بل نمط في النصّ. مثال: مطر يتكرر في لحظات التغيير ويوصف كمُطفئ للنار قد يُقرأ كتطهير.", "ru": "Символ — не жёсткое правило, а узор в тексте. Например, дождь, повторяющийся в моменты перемен и гасящий огонь, можно читать как очищение.", "en": "A symbol is not a fixed rule but a pattern in the text. For example, rain recurring at moments of change and described as dousing fire can be read as cleansing."},null,[{"he": "אין משמעות קבועה לפריט; ההקשר קובע.", "ar": "لا معنى ثابت للعنصر، فالسياق يقرر.", "ru": "У элемента нет постоянного значения; решает контекст.", "en": "No element has a fixed meaning; context decides."},null,{"he": "דווקא מזג אוויר משמש סמל ביצירות רבות.", "ar": "الطقس يُستخدم رمزًا في أعمال كثيرة.", "ru": "Погода как раз часто служит символом во многих произведениях.", "en": "Weather serves as a symbol in many works."},{"he": "פרשנות סמל נבנית מהטקסט, לא מרשות של הסופר.", "ar": "قراءة الرمز تُبنى من النصّ لا من إذن الكاتب.", "ru": "Трактовка символа строится из текста, а не из разрешения автора.", "en": "A symbol's reading is built from the text, not the author's permission."}]),
  Q("nv-3-01",{"he": "למה סופר יבחר לספר רומן בעזרת מספר לא מהימן?", "ar": "لماذا يختار كاتب أن يروي رواية بواسطة راوٍ غير موثوق؟", "ru": "Зачем автору рассказывать роман через ненадёжного рассказчика?", "en": "Why would an author tell a novel through an unreliable narrator?"},[{"he": "כדי שהקורא יגלה בעצמו את הפער בין הדברים למציאות ויבין את הדמות", "ar": "كي يكتشف القارئ بنفسه الفجوة بين الكلام والواقع ويفهم الشخصية", "ru": "Чтобы читатель сам заметил разрыв между словами и реальностью и глубже понял героя", "en": "So the reader finds the gap between words and reality and understands the character"}, {"he": "כדי לבלבל את הקורא בלי שום מטרה", "ar": "لإرباك القارئ بلا أي هدف", "ru": "Чтобы запутать читателя без всякой цели", "en": "To confuse the reader for no purpose"}, {"he": "כי כל רומן חייב לכלול מספר לא מהימן", "ar": "لأن كل رواية يجب أن تضمّ راويًا غير موثوق", "ru": "Потому что в каждом романе должен быть ненадёжный рассказчик", "en": "Because every novel must include an unreliable narrator"}, {"he": "כדי לחסוך תיאורים של מקום וזמן, ולקצר את הרומן בכמה עשרות עמודים לפחות", "ar": "لتوفير وصف المكان والزمان، واختصار الرواية بعشرات الصفحات على الأقل", "ru": "Чтобы сэкономить на описаниях места и времени и сократить роман хотя бы на несколько десятков страниц", "en": "To save on descriptions of place and time and cut the novel by at least several dozen pages"}],0,{"he": "מה הקורא עושה כשהוא מגלה שאי אפשר לסמוך על הקול?", "ar": "ماذا يفعل القارئ حين يكتشف أنه لا يمكن الوثوق بالصوت؟", "ru": "Что делает читатель, когда понимает, что голосу нельзя верить?", "en": "What does the reader do on finding the voice cannot be trusted?"},{"he": "מספר לא מהימן הופך את הקורא לבלש. הוא משווה בין הדברים למעשים ומגלה פער. הפער חושף פחדים, אשמה או עיוורון של הדמות.", "ar": "الراوي غير الموثوق يجعل القارئ محققًا. فهو يقارن الكلام بالأفعال ويكتشف فجوة. والفجوة تكشف مخاوف الشخصية أو ذنبها أو عماها.", "ru": "Ненадёжный рассказчик превращает читателя в сыщика. Он сравнивает слова с поступками и находит разрыв. Разрыв раскрывает страхи, вину или слепоту героя.", "en": "An unreliable narrator turns the reader into a detective. The reader compares words with actions and finds a gap. The gap reveals the character's fears, guilt or blindness."},null,[null, {"he": "לבחירה יש מטרה: היא בונה משמעות דרך הפער.", "ar": "للاختيار هدف: فهو يبني المعنى عبر الفجوة.", "ru": "У этого выбора есть цель: он создаёт смысл через разрыв.", "en": "The choice has a purpose: it builds meaning through the gap."}, {"he": "רוב הרומנים משתמשים במספר מהימן; זו בחירה ולא חובה.", "ar": "معظم الروايات تستعمل راويًا موثوقًا، فهذا اختيار لا إلزام.", "ru": "Большинство романов используют надёжного рассказчика; это выбор, а не правило.", "en": "Most novels use a reliable narrator; this is a choice, not a rule."}, {"he": "סוג המספר אינו קשור לאורך הרומן או לתיאורי המקום.", "ar": "نوع الراوي لا علاقة له بطول الرواية أو بوصف المكان.", "ru": "Тип рассказчика не связан с объёмом романа или описаниями места.", "en": "The narrator type is unrelated to the novel's length or setting descriptions."}]),
  Q("nv-3-02",{"he": "ברומן, סיפור המסגרת מתרחש בבית חולים, והסיפור הפנימי מתרחש במלחמה לפני 40 שנה. מה יכול להיות תפקיד המסגרת?", "ar": "في رواية تجري القصة الإطارية في مستشفى، والقصة الداخلية في حرب قبل 40 سنة. ما الوظيفة الممكنة للإطار؟", "ru": "В романе рамка происходит в больнице, а внутренняя история — на войне 40 лет назад. Какой может быть роль рамки?", "en": "In a novel, the frame story takes place in a hospital, and the inner story in a war 40 years earlier. What might the frame's role be?"},[{"he": "לקצר את הרומן, כי המסגרת מחליפה את הסיפור הפנימי", "ar": "اختصار الرواية لأن الإطار يحلّ محل القصة الداخلية", "ru": "Сократить роман, потому что рамка заменяет внутреннюю историю", "en": "To shorten the novel, because the frame replaces the inner story"}, {"he": "להראות מבט מן ההווה: איך העבר עדיין משפיע על הדמות", "ar": "إظهار نظرة من الحاضر: كيف ما زال الماضي يؤثر في الشخصية", "ru": "Показать взгляд из настоящего: как прошлое всё ещё влияет на героя", "en": "To give a view from the present: how the past still affects the character"}, {"he": "להציג עובדות היסטוריות מדויקות על המלחמה, עם תאריכים, מפות ומספרי חיילים", "ar": "عرض حقائق تاريخية دقيقة عن الحرب، مع تواريخ وخرائط وأعداد الجنود", "ru": "Изложить точные исторические факты о войне — с датами, картами и числом солдат", "en": "To present exact historical facts about the war, with dates, maps and troop numbers"}, {"he": "אין לה תפקיד; היא קישוט בלבד", "ar": "لا وظيفة له، إنه مجرد زينة", "ru": "У неё нет роли; это только украшение", "en": "It has no role; it is decoration only"}],1,{"he": "מה הקשר בין המקום של ההווה לבין זיכרונות העבר?", "ar": "ما الصلة بين مكان الحاضر وذكريات الماضي؟", "ru": "Как связаны место в настоящем и воспоминания о прошлом?", "en": "How is the present-day place linked to memories of the past?"},{"he": "המסגרת מציבה את הזיכרון בהווה. בית החולים יכול לרמוז שהפצעים מהמלחמה לא נסגרו. כך המבנה עצמו אומר משהו על הדמות.", "ar": "الإطار يضع الذاكرة في الحاضر. والمستشفى قد يلمّح إلى أن جراح الحرب لم تلتئم. هكذا يقول البناء نفسه شيئًا عن الشخصية.", "ru": "Рамка помещает память в настоящее. Больница может намекать, что раны войны не зажили. Так само строение говорит что-то о герое.", "en": "The frame sets memory in the present. The hospital may hint that the war's wounds never healed. So the structure itself says something about the character."},null,[{"he": "המסגרת עוטפת את הסיפור הפנימי, ואינה מחליפה אותו.", "ar": "الإطار يحيط بالقصة الداخلية ولا يحلّ محلها.", "ru": "Рамка обрамляет внутреннюю историю, а не заменяет её.", "en": "The frame wraps the inner story; it does not replace it."}, null, {"he": "רומן הוא יצירה ספרותית, ולא ספר היסטוריה.", "ar": "الرواية عمل أدبي وليست كتاب تاريخ.", "ru": "Роман — художественное произведение, а не учебник истории.", "en": "A novel is a literary work, not a history book."}, {"he": "בחירה במבנה תורמת למשמעות, ואינה קישוט בלבד.", "ar": "اختيار البناء يسهم في المعنى وليس زينة.", "ru": "Выбор строения влияет на смысл, а не только украшает.", "en": "A choice of structure adds meaning; it is not decoration."}]),
  Q("nv-3-03",{"he": "רומן חושף רק בפרק האחרון סוד מהעבר של הגיבור, אף שהסוד קרה ראשון בזמן. מה ההשפעה של הבחירה הזאת?", "ar": "تكشف رواية في الفصل الأخير فقط سرًّا من ماضي البطل، مع أن السر وقع أولًا زمنيًا. ما أثر هذا الاختيار؟", "ru": "Роман раскрывает тайну из прошлого героя лишь в последней главе, хотя по времени она случилась первой. Каково действие этого выбора?", "en": "A novel reveals a secret from the hero's past only in the last chapter, although it happened first in time. What is the effect of this choice?"},[{"he": "אין השפעה, כי סדר הזמן וסדר העלילה תמיד זהים", "ar": "لا أثر، لأن الترتيب الزمني وترتيب الحبكة متطابقان دائمًا", "ru": "Никакого, потому что порядок времени и сюжета всегда совпадают", "en": "None, because time order and plot order are always the same"}, {"he": "הקורא מתבלבל, ולכן עליו לדלג על הפרק האחרון", "ar": "يرتبك القارئ، لذلك عليه أن يتخطى الفصل الأخير", "ru": "Читатель запутается, поэтому ему стоит пропустить последнюю главу", "en": "The reader gets confused, so he should skip the last chapter"}, {"he": "הבחירה יוצרת מתח, וגורמת לקורא לראות מחדש את מה שקרה קודם", "ar": "يخلق الاختيار توترًا، ويجعل القارئ يرى ما سبق من جديد", "ru": "Выбор создаёт напряжение и заставляет заново увидеть прежние события", "en": "It builds suspense and makes the reader see earlier events anew"}, {"he": "הסוד הופך לנקודת הפתיחה של העלילה, והקורא יודע אותו כבר מהעמוד הראשון", "ar": "يصبح السر نقطة انطلاق الحبكة، ويعرفه القارئ منذ الصفحة الأولى", "ru": "Тайна становится началом сюжета, и читатель знает её уже с первой страницы", "en": "The secret becomes the plot's starting point, and the reader knows it from page one"}],2,{"he": "חשבו מה הקורא יודע, ומתי הוא יודע את זה.", "ar": "فكّروا فيما يعرفه القارئ ومتى يعرفه.", "ru": "Подумайте, что знает читатель и когда он это узнаёт.", "en": "Think about what the reader knows, and when."},{"he": "העלילה דחתה אירוע מוקדם עד הסוף. כך נוצר מתח לאורך כל הספר. כשהסוד נחשף, פרקים קודמים מקבלים משמעות חדשה.", "ar": "أخّرت الحبكة حدثًا مبكرًا حتى النهاية. وهكذا يتولد توتر طوال الكتاب. وحين يُكشف السر تكتسب الفصول السابقة معنى جديدًا.", "ru": "Сюжет отложил раннее событие до конца. Так возникает напряжение на всю книгу. Когда тайна раскрыта, прежние главы получают новый смысл.", "en": "The plot held back an early event until the end. This creates suspense throughout the book. When the secret is revealed, earlier chapters gain new meaning."},null,[{"he": "כאן הסדרים שונים: מה שקרה ראשון מסופר אחרון.", "ar": "الترتيبان هنا مختلفان: ما وقع أولًا يُروى أخيرًا.", "ru": "Здесь порядки различаются: то, что было первым, рассказано последним.", "en": "Here the orders differ: what happened first is told last."}, {"he": "הפרק האחרון הוא המפתח להבנת כל מה שקדם לו.", "ar": "الفصل الأخير مفتاح فهم كل ما سبقه.", "ru": "Последняя глава — ключ к пониманию всего предыдущего.", "en": "The last chapter is the key to understanding all that came before."}, null, {"he": "הסוד נחשף בסוף, ולכן הקורא אינו יודע אותו בהתחלה.", "ar": "السر يُكشف في النهاية، فلا يعرفه القارئ في البداية.", "ru": "Тайна раскрывается в конце, значит, в начале читатель её не знает.", "en": "The secret is revealed at the end, so the reader does not know it at first."}]),
  Q("nv-3-04",{"he": "תלמידה כותבת: \"הגיבור לא השתנה, כי בסוף הוא עדיין גר באותו כפר.\" מה הבעיה בטענה?", "ar": "تكتب طالبة: «البطل لم يتغير، لأنه في النهاية ما زال يسكن القرية نفسها». ما المشكلة في هذا الادعاء؟", "ru": "Ученица пишет: «Герой не изменился, ведь в конце он живёт в той же деревне». В чём ошибка?", "en": "A student writes: \"The hero did not change, because at the end he still lives in the same village.\" What is wrong with this claim?"},[{"he": "אין בעיה: התפתחות נמדדת רק לפי מעבר דירה", "ar": "لا مشكلة: النموّ يُقاس فقط بالانتقال من السكن", "ru": "Ошибки нет: развитие измеряется только переездом", "en": "No problem: development is measured only by moving house"}, {"he": "הבעיה היא שהכפר הוא דמות שטוחה", "ar": "المشكلة أن القرية شخصية مسطّحة", "ru": "Ошибка в том, что деревня — плоский персонаж", "en": "The problem is that the village is a flat character"}, {"he": "הבעיה היא שהגיבור הוא תמיד מספר לא מהימן, ולכן אין לסמוך על שום פרט בסיפור", "ar": "المشكلة أن البطل راوٍ غير موثوق دائمًا، فلا يُوثق بأي تفصيل في القصة", "ru": "Ошибка в том, что герой всегда ненадёжный рассказчик и ни одной детали верить нельзя", "en": "The problem is that the hero is always unreliable, so no detail in the story can be trusted"}, {"he": "התפתחות נמדדת בהבנה ובבחירות של הדמות, לא רק במקום", "ar": "النموّ يُقاس بفهم الشخصية واختياراتها لا بالمكان فقط", "ru": "Развитие измеряется пониманием и выбором героя, а не только местом", "en": "Development is measured by understanding and choices, not just place"}],3,{"he": "מה עוד יכול להשתנות באדם, חוץ מהכתובת שלו?", "ar": "ماذا يمكن أن يتغير في الإنسان غير عنوانه؟", "ru": "Что ещё может измениться в человеке, кроме адреса?", "en": "What else can change in a person besides an address?"},{"he": "דמות יכולה להישאר באותו מקום ועדיין להשתנות. בודקים איך היא מבינה את העולם ומה היא בוחרת לעשות. שינוי פנימי הוא העיקר.", "ar": "قد تبقى الشخصية في المكان نفسه وتتغيّر مع ذلك. نفحص كيف تفهم العالم وماذا تختار أن تفعل. فالتغيّر الداخلي هو الأساس.", "ru": "Персонаж может остаться на месте и всё же измениться. Смотрят, как он понимает мир и что выбирает делать. Главное — внутренняя перемена.", "en": "A character can stay in one place and still change. We check how they understand the world and what they choose to do. Inner change is what matters."},null,[{"he": "מקום מגורים אינו המדד; השינוי הוא בעיקר פנימי.", "ar": "مكان السكن ليس المقياس، فالتغيّر داخلي أساسًا.", "ru": "Место жительства — не мерило; перемена в основном внутренняя.", "en": "Where one lives is not the measure; change is mainly inner."}, {"he": "כפר הוא מקום ההתרחשות, לא דמות.", "ar": "القرية مكان الأحداث لا شخصية.", "ru": "Деревня — место действия, а не персонаж.", "en": "The village is the setting, not a character."}, {"he": "השאלה אינה מזכירה מספר לא מהימן; הבעיה במדד לשינוי.", "ar": "السؤال لا يذكر راويًا غير موثوق، والمشكلة في مقياس التغيّر.", "ru": "В вопросе нет ненадёжного рассказчика; ошибка в мериле перемены.", "en": "The question mentions no unreliable narrator; the flaw is the measure of change."}, null]),
  Q("nv-3-05",{"he": "ברומן חוזר מוטיב הציפורים. בהתחלה הגיבורה מאכילה ציפור בכלוב, ובסוף היא פותחת את הכלוב. מה אפשר להסיק?", "ar": "يتكرر في رواية موتيف الطيور. في البداية تُطعم البطلة طائرًا في قفص، وفي النهاية تفتح القفص. ماذا يمكن الاستنتاج؟", "ru": "В романе повторяется мотив птиц. Вначале героиня кормит птицу в клетке, а в конце открывает клетку. Какой можно сделать вывод?", "en": "A bird motif recurs in a novel. At the start the heroine feeds a caged bird; at the end she opens the cage. What can be concluded?"},[{"he": "השינוי במוטיב מבטא את השינוי בגיבורה: מכליאה לחופש", "ar": "تغيّر الموتيف يعبّر عن تغيّر البطلة: من الأسر إلى الحرية", "ru": "Изменение мотива выражает перемену в героине: от неволи к свободе", "en": "The change in the motif mirrors the heroine's change: from captivity to freedom"}, {"he": "המוטיב מראה שהגיבורה אוהבת בעלי חיים, ותו לא", "ar": "الموتيف يُظهر أن البطلة تحب الحيوانات فقط لا غير", "ru": "Мотив показывает лишь то, что героиня любит животных", "en": "The motif shows only that the heroine likes animals"}, {"he": "מוטיב חייב להופיע בכל פעם באותה צורה בדיוק, ולכן כאן אין מוטיב בכלל", "ar": "يجب أن يظهر الموتيف كل مرة بالشكل نفسه تمامًا، لذلك لا موتيف هنا أصلًا", "ru": "Мотив должен каждый раз появляться в точно той же форме, поэтому здесь мотива нет вовсе", "en": "A motif must appear in exactly the same form each time, so there is no motif here at all"}, {"he": "הציפור היא דמות עגולה ברומן", "ar": "الطائر شخصية مدوّرة في الرواية", "ru": "Птица — объёмный персонаж романа", "en": "The bird is a round character in the novel"}],0,{"he": "השוו בין התמונה הראשונה לתמונה האחרונה.", "ar": "قارنوا بين الصورة الأولى والصورة الأخيرة.", "ru": "Сравните первую и последнюю картину.", "en": "Compare the first image with the last one."},{"he": "מוטיב יכול להשתנות לאורך היצירה. כאן הכלוב הסגור הופך לכלוב פתוח. השינוי מקביל לשינוי בגיבורה עצמה.", "ar": "قد يتغيّر الموتيف على امتداد العمل. هنا يتحول القفص المغلق إلى قفص مفتوح. والتغيّر يوازي تغيّر البطلة نفسها.", "ru": "Мотив может меняться по ходу произведения. Здесь закрытая клетка становится открытой. Перемена параллельна перемене в самой героине.", "en": "A motif can change during the work. Here the closed cage becomes an open one. The change parallels the change in the heroine herself."},null,[null, {"he": "פרט שחוזר ומשתנה נושא יותר מעובדה על תחביב.", "ar": "التفصيل الذي يتكرر ويتغيّر يحمل أكثر من معلومة عن هواية.", "ru": "Повторяющаяся и меняющаяся деталь значит больше, чем факт о хобби.", "en": "A detail that recurs and changes carries more than a fact about a hobby."}, {"he": "מוטיב יכול להשתנות, והשינוי עצמו נושא משמעות.", "ar": "يمكن أن يتغيّر الموتيف، والتغيّر نفسه يحمل معنى.", "ru": "Мотив может меняться, и сама перемена несёт смысл.", "en": "A motif can change, and the change itself carries meaning."}, {"he": "הציפור היא פרט סמלי, לא דמות בעלת עולם פנימי.", "ar": "الطائر تفصيل رمزي لا شخصية ذات عالم داخلي.", "ru": "Птица — символическая деталь, а не герой с внутренним миром.", "en": "The bird is a symbolic detail, not a character with an inner world."}]),
  Q("nv-3-06",{"he": "נובלה עוקבת אחרי יום אחד בחייה של אישה, עם מעט דמויות. מה היתרון של המבנה המרוכז?", "ar": "تتابع نوفيلا يومًا واحدًا في حياة امرأة، مع شخصيات قليلة. ما ميزة البناء المركّز؟", "ru": "Повесть следит за одним днём из жизни женщины, с немногими героями. В чём преимущество такого сжатого строения?", "en": "A novella follows one day in a woman's life, with few characters. What is the advantage of this focused structure?"},[{"he": "הוא מאפשר לתאר את כל חייה של הדמות מלידה ועד זקנה, בכל הפרטים", "ar": "يتيح وصف حياة الشخصية كلها من الولادة إلى الشيخوخة بكل التفاصيل", "ru": "Оно позволяет описать всю жизнь героини от рождения до старости во всех подробностях", "en": "It lets the author describe the character's whole life from birth to old age in full detail"}, {"he": "הוא ממקד את הקורא ברגע אחד של משבר ומעמיק בו", "ar": "يركّز القارئ على لحظة أزمة واحدة ويتعمق فيها", "ru": "Оно сосредоточивает читателя на одном моменте кризиса и углубляет его", "en": "It focuses the reader on one moment of crisis and goes deep into it"}, {"he": "אין לו יתרון; נובלה היא רק רומן שלא נגמר", "ar": "لا ميزة له، فالنوفيلا مجرد رواية لم تكتمل", "ru": "Преимущества нет; повесть — просто незаконченный роман", "en": "There is no advantage; a novella is just an unfinished novel"}, {"he": "הוא מחייב מספר יודע־כל", "ar": "يفرض راويًا عليمًا", "ru": "Оно требует всезнающего рассказчика", "en": "It requires an omniscient narrator"}],1,{"he": "מה קורה לתשומת הלב כשיש מעט זמן ומעט דמויות?", "ar": "ماذا يحدث للانتباه حين يكون الزمن قليلًا والشخصيات قليلة؟", "ru": "Что происходит с вниманием, когда мало времени и мало героев?", "en": "What happens to attention when there is little time and few characters?"},{"he": "בנובלה אין מקום לעלילות רבות. לכן היא מתמקדת ברגע אחד. כך הקורא רואה לעומק את הדמות ברגע הקשה שלה.", "ar": "لا مكان في النوفيلا لحبكات كثيرة. لذلك تركّز على لحظة واحدة. فيرى القارئ الشخصية بعمق في لحظتها الصعبة.", "ru": "В повести нет места для многих линий. Поэтому она сосредоточена на одном моменте. Так читатель глубоко видит героиню в её трудную минуту.", "en": "A novella has no room for many plot lines. So it focuses on one moment. The reader sees the character deeply at her hard moment."},null,[{"he": "יום אחד אינו מאפשר לתאר חיים שלמים בפירוט.", "ar": "يوم واحد لا يتيح وصف حياة كاملة بالتفصيل.", "ru": "Один день не позволяет подробно описать целую жизнь.", "en": "One day does not allow a whole life to be told in detail."}, null, {"he": "נובלה היא סוגה שלמה בפני עצמה, ולא רומן חסר.", "ar": "النوفيلا نوع مكتمل بذاته لا رواية ناقصة.", "ru": "Повесть — самостоятельный жанр, а не неполный роман.", "en": "A novella is a full genre in itself, not a lacking novel."}, {"he": "מבנה מרוכז מתאים לכל סוג של מספר.", "ar": "البناء المركّز يناسب أي نوع من الرواة.", "ru": "Сжатое строение подходит любому типу рассказчика.", "en": "A focused structure suits any type of narrator."}])]]);
