<style>
/* ============================================================
   ספרות — ספרות לבגרות
   קהל היעד לא "לא יודע אזרחות". הוא נכשל בה שוב ושוב, מפני
   שהמקצוע כולו טקסט ומושגים — ולכן כל החלטה כאן נמדדת בשאלה
   אחת: האם היא מורידה עומס, או מוסיפה.
   · כל שאלה נושאת רמז שאינו התשובה, והסבר שנפתח גם כשצדקו.
   · שום טקסט לא מוצג בלי שאפשר לשמוע אותו.
   · שפת האם אינה קישוט: מושג באזרחות נלמד קודם בשפה שחושבים בה.
   כל המידות ב-rem, כדי שהגדלת טקסט תגדיל את הכול יחד.
   ============================================================ */
:root{
  --font:"Heebo","Rubik",system-ui,"Segoe UI",Arial,sans-serif;
  --en:"Lexend","Heebo",system-ui,"Segoe UI",Arial,sans-serif;
  --ar:"Noto Sans Arabic",system-ui,"Segoe UI",Arial,sans-serif;
  --ru:"Noto Sans","Heebo",system-ui,"Segoe UI",Arial,sans-serif;   /* קירילית — Heebo אינו מכיל אותה */
  --bg:#f5f7fb; --surface:#ffffff; --surface2:#e8ecf6;
  --ink:#101828; --muted:#55607a; --faint:#6f7a95; --line:#dde3f0;
  --accent:#1d4ed8; --accent-ink:#ffffff; --accent-soft:#dbe4fe;
  --gold:#a16207; --gold-soft:#fbf0d5; --hit:#f5c451; --hit-ink:#1a1300;
  --ok:#15803d; --ok-soft:#dcfce7; --bad:#be123c; --bad-soft:#ffe4e9;
  --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px -12px rgba(16,24,40,.2);
  --r:14px;
  /* צבע לכל מסלול. לא קישוט: ארבעה סוגי לימוד שונים לגמרי, וצבע
     קבוע לכל אחד חוסך למי שמתקשה להתמצא את השאלה "איפה אני". */
  --c-sound:#0369a1; --cs-sound:#dbeefc;   /* צליל ואות   */
  --c-words:#15803d; --cs-words:#dcfce7;   /* מילים       */
  --c-talk:#b43a0a;  --cs-talk:#fde5d8;    /* מדוברת — #c2410c היה 4.28:1 על ה-cs (30.9) */
  --c-read:#6d28d9;  --cs-read:#eae2fd;    /* ספרותית     */
}
:root[data-theme="dark"]{
  --bg:#0e1425; --surface:#17203a; --surface2:#202c4d;
  --ink:#e8edf8; --muted:#9aa5c0; --faint:#78829e; --line:#2a3762;
  --accent:#93c5fd; --accent-ink:#0e1425; --accent-soft:#1b2a5c;
  --gold:#fbbf24; --gold-soft:#33270f; --hit:#ffd24d; --hit-ink:#241a00;
  --ok:#4ade80; --ok-soft:#132a1c; --bad:#fb7185; --bad-soft:#33161f;
  --warn:#fbbf24; --warn-soft:#33260f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  --c-sound:#7dd3fc; --cs-sound:#0b2a3d;
  --c-words:#86efac; --cs-words:#0f2a1a;
  --c-talk:#fdba74;  --cs-talk:#3a2113;
  --c-read:#c4b5fd;  --cs-read:#261a45;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1425; --surface:#17203a; --surface2:#202c4d;
    --ink:#e8edf8; --muted:#9aa5c0; --faint:#78829e; --line:#2a3762;
    --accent:#93c5fd; --accent-ink:#0e1425; --accent-soft:#1b2a5c;
    --gold:#fbbf24; --gold-soft:#33270f; --hit:#ffd24d; --hit-ink:#241a00;
    --ok:#4ade80; --ok-soft:#132a1c; --bad:#fb7185; --bad-soft:#33161f;
    --warn:#fbbf24; --warn-soft:#33260f;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
    --c-sound:#7dd3fc; --cs-sound:#0b2a3d;
    --c-words:#86efac; --cs-words:#0f2a1a;
    --c-talk:#fdba74;  --cs-talk:#3a2113;
    --c-read:#c4b5fd;  --cs-read:#261a45;
  }
}
/* ניגודיות גבוהה — שחור על לבן, מסגרות מלאות, בלי גוונים רכים */
:root.hc{
  --bg:#ffffff; --surface:#ffffff; --surface2:#ffffff;
  --ink:#000000; --muted:#1a1a1a; --faint:#333333; --line:#000000;
  --accent:#00434b; --accent-ink:#ffffff; --accent-soft:#e6f2f3;
  --gold:#5c3d00; --gold-soft:#f7efdf; --hit:#ffe600; --hit-ink:#000000;
  --ok:#0a5c2a; --ok-soft:#e6f4ea; --bad:#8c0f2c; --bad-soft:#fbe9ed;
  --warn:#6b3d00; --warn-soft:#f7efdf; --shadow:none;
  --c-sound:#00305c; --cs-sound:#e8eef7;
  --c-words:#0a5c2a; --cs-words:#e6f4ea;
  --c-talk:#7a2c00;  --cs-talk:#f9ece4;
  --c-read:#3d1a75;  --cs-read:#eee8f9;
}
:root.hc *{box-shadow:none!important}
:root.hc .card,:root.hc .btn,:root.hc .opt{border-width:2px!important}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs,17px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  font-size:1rem;line-height:1.65;-webkit-text-size-adjust:100%}
:root.clear body{font-family:"Verdana","Tahoma","Heebo",sans-serif;letter-spacing:.012em}
:root.spaced body{word-spacing:.22em;line-height:1.95}
:root.rm *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
h1,h2,h3{margin:0;line-height:1.3;font-weight:800}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}
/* כרטיס ״מבנה הבגרות״ (--gold-soft): הקישור לאתר משרד החינוך בלי צבע נפל לכחול ברירת המחדל — 1.55:1 בכהה (30.9) */
.gcard a{color:var(--accent)}
.skip{position:absolute;inset-inline-start:-9999px}
.skip:focus{position:static;display:inline-flex;align-items:center;min-height:44px;
  margin:8px;padding:8px 14px;background:#0b7c71;color:#fff;
  border-radius:8px;font-weight:700;text-decoration:none;z-index:100}

/* כל טקסט אנגלי — כיוון, גופן ומרווח משלו. unicode-bidi:isolate מונע
   מהמשפט האנגלי לגרור אחריו את סימני הפיסוק של המשפט העברי. */
.en{font-family:var(--en);direction:ltr;unicode-bidi:isolate;text-align:start}
.en-b{font-family:var(--en);direction:ltr;unicode-bidi:isolate;display:inline-block}

.wrap{max-width:56rem;margin:0 auto;padding:0 clamp(.9rem,3vw,1.5rem)}
.hbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-block:.6rem}
:root.hc .hbar{background:var(--bg);backdrop-filter:none}
.hrow{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
.brand{font-size:1.35rem;font-weight:800;letter-spacing:-.01em;display:flex;
  align-items:baseline;gap:.5rem;margin-inline-end:auto}
.brand small{font-size:.72rem;font-weight:600;color:var(--muted);letter-spacing:.06em}
.gbtn{display:inline-flex;align-items:center;gap:.4rem;background:var(--surface);
  border:1px solid var(--line);border-radius:999px;padding:.42rem .8rem;cursor:pointer;
  font-size:.86rem;font-weight:600;box-shadow:var(--shadow);min-height:44px}
.gbtn:hover{border-color:var(--accent)}
.gbtn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:1.1rem}
.grid{display:grid;gap:.85rem}
@media(min-width:640px){.g2{grid-template-columns:1fr 1fr}}
@media(min-width:900px){.g3{grid-template-columns:repeat(3,1fr)}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;
  border:1px solid var(--line);background:var(--surface);border-radius:12px;
  padding:.72rem 1.1rem;font-weight:700;cursor:pointer;box-shadow:var(--shadow);
  min-height:2.9rem;font-size:1rem}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;box-shadow:none}
.btn[disabled]{opacity:.45;cursor:default}
.btn.wide{width:100%}

.chip{display:inline-flex;align-items:center;gap:.35rem;border-radius:999px;
  padding:.22rem .6rem;font-size:.78rem;font-weight:700;background:var(--surface2);color:var(--muted)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}

/* גופני שפה: Heebo אינו מכיל ערבית וקירילית, ולכן שפת הממשק
   מחליפה גופן ולא רק כיוון. */
html[lang="ar"] body,html[lang="ar"] input,html[lang="ar"] button,
html[lang="ar"] textarea,html[lang="ar"] select{font-family:var(--ar)}
html[lang="ru"] body,html[lang="ru"] input,html[lang="ru"] button,
html[lang="ru"] textarea,html[lang="ru"] select{font-family:var(--ru)}
button[data-a="lang"][lang="ar"]{font-family:var(--ar)}
button[data-a="lang"][lang="ru"]{font-family:var(--ru)}

/* ===== מסלולים: הצבע נכנס ככרטיס, לא כרקע של טקסט ===== */
.trk{--c:var(--accent);--cs:var(--accent-soft)}
.t-sound{--c:var(--c-sound);--cs:var(--cs-sound)}
.t-words{--c:var(--c-words);--cs:var(--cs-words)}
.t-talk{--c:var(--c-talk); --cs:var(--cs-talk)}
.t-read{--c:var(--c-read); --cs:var(--cs-read)}
.tcard{border-inline-start:5px solid var(--c);cursor:pointer;text-align:start;width:100%;
  display:flex;flex-direction:column;gap:.4rem;align-items:stretch}
.tcard:hover{border-color:var(--c)}
.tcard h3{font-size:1.05rem}
.tcard .sub{font-size:.85rem;color:var(--muted)}
.tdot{width:.62rem;height:.62rem;border-radius:50%;background:var(--c);flex:none}
.thead{display:flex;align-items:center;gap:.5rem}
.tpill{background:var(--cs);color:var(--c);border-radius:999px;padding:.15rem .55rem;
  font-size:.72rem;font-weight:800}

/* ===== סרגל שליטה ברמות ===== */
.lvls{display:flex;gap:.4rem;flex-wrap:wrap}
.lvl{border:1px solid var(--line);background:var(--surface);border-radius:10px;
  padding:.4rem .7rem;font-size:.82rem;font-weight:700;cursor:pointer;
  display:inline-flex;align-items:center;gap:.4rem}
.lvl.on{background:var(--c,var(--accent));color:var(--accent-ink);border-color:var(--c,var(--accent))}
.bar{height:.42rem;border-radius:999px;background:var(--surface2);overflow:hidden;flex:1;min-width:3rem}
.bar i{display:block;height:100%;background:var(--c,var(--accent))}
.bar.b0 i{background:var(--bad)} .bar.b1 i{background:var(--warn)} .bar.b2 i{background:var(--ok)}

/* ===== תרגול ===== */
.qcard{border-top:5px solid var(--c,var(--accent))}
.qtop{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.7rem}
.qtext{font-size:1.12rem;font-weight:600;margin:.2rem 0 .3rem}
.qhint{color:var(--muted);font-size:.9rem}
/* המילה או המשפט שנלמדים. גדול, מרווח, ותמיד לצד כפתור השמעה. */
.subject{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;
  background:var(--surface2);border-radius:12px;padding:.85rem 1rem;margin:.5rem 0}
.subject .word{font-family:var(--en);direction:ltr;unicode-bidi:isolate;
  font-size:1.7rem;font-weight:700;letter-spacing:.01em;line-height:1.25}
.subject .ipa{font-family:var(--en);direction:ltr;unicode-bidi:isolate;
  color:var(--muted);font-size:.95rem}
.spk{border:1px solid var(--line);background:var(--surface);border-radius:999px;
  width:2.7rem;height:2.7rem;display:inline-flex;align-items:center;justify-content:center;
  cursor:pointer;flex:none;box-shadow:var(--shadow)}
.spk:hover{border-color:var(--accent);color:var(--accent)}
.spk.sm{width:2.1rem;height:2.1rem;background:#0b7c71;border-color:#0b7c71;color:#fff}
/* הרמקול הקטן — אותו ירוק של כפתור ההקראה הגדול, התקן המשותף */
.spk.sm:hover{background:#0b7c71;border-color:#0b7c71;color:#fff}
.spk.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.opts{display:grid;gap:.6rem;margin-top:.9rem}
.orow{display:flex;gap:.45rem;align-items:center;min-width:0}
/* min-width:0 — פריט grid נולד עם min-width:auto, ולכן משפט ארוך
   באפשרות היה מרחיב את השורה מעבר למכל ודוחף את הרמקול מחוץ למסך. */
.orow .opt{flex:1;min-width:0}
@media(min-width:560px){.opts.two{grid-template-columns:1fr 1fr}}
.opt{display:flex;align-items:center;gap:.6rem;text-align:start;width:100%;
  border:2px solid var(--line);background:var(--surface);border-radius:12px;
  padding:.8rem .9rem;cursor:pointer;font-size:1.02rem;font-weight:600;min-height:3.1rem}
.opt:hover{border-color:var(--accent)}
.opt .k{width:1.9rem;height:1.9rem;border-radius:8px;background:var(--surface2);
  display:inline-flex;align-items:center;justify-content:center;font-size:.85rem;
  font-weight:800;color:var(--muted);flex:none}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .k{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .k{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.55}
/* בחירה במבחן היא בחירה, לא תשובה נכונה. במסכי התרגול הצבע
   הירוק אומר "צדקת", ובמבחן אסור לו להופיע כלל — הוא נותן
   משוב שגוי לכל בחירה. ניטרלי, ורק מסמן מה סומן. */
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);margin-inline-start:3px}
.dot.ok{background:var(--ok);border-color:var(--ok)}
.dot.no{background:var(--bad);border-color:var(--bad)}
.dot.flag{box-shadow:0 0 0 2px var(--accent)}

/* אריחי בניית משפט. הסדר הוא התרגיל, ולכן האריח חייב להיראות כמשהו
   שאפשר להרים — מסגרת מלאה ורקע משלו, לא טקסט על רקע הכרטיס. */
.tiles{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:.7rem}
.tile{font-family:var(--en);direction:ltr;border:2px solid var(--line);
  background:var(--surface);border-radius:10px;padding:.5rem .8rem;font-weight:600;
  cursor:pointer;font-size:1.02rem;min-height:2.7rem}
.tile:hover{border-color:var(--accent)}
.slot{min-height:3.2rem;border:2px dashed var(--line);border-radius:12px;
  background:var(--surface2);padding:.5rem;display:flex;flex-wrap:wrap;gap:.45rem;
  align-items:center;direction:ltr}
.slot.ok{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.slot.bad{border-style:solid;border-color:var(--bad);background:var(--bad-soft)}
.slot .tile{background:var(--surface)}

/* ===== משוב ===== */
.fb{margin-top:.9rem;border-radius:12px;padding:.85rem 1rem;border:1px solid transparent}
.fb.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.fb.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.fb b{display:block;font-size:1.02rem;margin-bottom:.2rem}
.fb .body{color:var(--ink);font-weight:500;font-size:.95rem}
.why{margin-top:.55rem;padding-top:.55rem;border-top:1px dashed currentColor;color:var(--ink);
  font-weight:500;font-size:.93rem}

/* ===== קטע קריאה ===== */
/* איור בתוך כרטיס שאלה. הצבע יורש מ-color, ולכן אותו SVG נראה
   נכון גם בערכה הבהירה וגם בכהה בלי גרסה שנייה. */
.figure{margin:.7rem 0;padding:.6rem;border:1px solid var(--line);border-radius:12px;
  background:var(--surface2);color:var(--ink);overflow-x:auto}
.figure svg{display:block;max-width:100%}
/* המבחן המדומה: השאלות זו אחר זו, כמו חוברת בחינה. */
.simq{border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;margin:.8rem 0;
  background:var(--surface)}
.simq.miss{border-color:var(--warn)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.simn{font-weight:800;color:var(--muted);font-size:.86rem}
.simbar{position:sticky;top:0;z-index:5;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:.6rem .8rem;margin:.8rem 0;display:flex;gap:.6rem;
  align-items:center;flex-wrap:wrap;box-shadow:var(--shadow)}
.clock{font-weight:800;font-variant-numeric:tabular-nums;font-size:1.1rem}
.clock.low{color:var(--bad)}
.passage{background:var(--surface2);border-radius:12px;padding:1rem 1.1rem;margin:.6rem 0;
  font-family:var(--en);direction:ltr;unicode-bidi:isolate;font-size:1.08rem;line-height:2}
.passage .s{border-radius:5px;padding:.05em .12em;cursor:pointer}
.passage .s:hover{background:var(--accent-soft)}
.passage .s.now{background:var(--accent-soft);box-shadow:0 2px 0 var(--accent)}
.wd{border-radius:5px;padding:1px 3px}
.wd.hit{background:var(--hit);color:var(--hit-ink);font-weight:600}
/* כשמנוע הדיבור אינו מדווח על גבולות מילים — קורה הרבה בעברית
   באנדרואיד — אין מה להדגיש מילה־מילה, ואז מודגש כל האיבר. הכלל
   שקיים כאן מכוון למשפט בתוך קטע קריאה בלבד, ולכן ההדגשה החלופית
   על איבר אחר לא נראתה כלל. */
.wd.now,p.now,div.now,span.now,b.now{background:var(--hit);color:var(--hit-ink);
  border-radius:8px;box-shadow:0 0 0 4px var(--hit)}
.gloss{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.5rem}
.gword{border:1px solid var(--line);background:var(--surface);border-radius:999px;
  padding:.25rem .6rem;font-size:.85rem;cursor:pointer}
.gword b{font-family:var(--en);direction:ltr;unicode-bidi:isolate}

/* ===== סרגל מצב הקול ===== */
.vstrip{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;border-radius:10px;
  padding:.45rem .7rem;font-size:.85rem;font-weight:600;margin-bottom:.7rem}
.vstrip.ok{background:var(--ok-soft);color:var(--ok)}
.vstrip.warn{background:var(--warn-soft);color:var(--warn)}
.vstrip.bad{background:var(--bad-soft);color:var(--bad)}
.vstrip .btn{padding:.3rem .7rem;min-height:44px;font-size:.82rem}  /* 2.1rem היו 36 פיקסלים — מתחת ליעד המגע */

/* ===== הגדרות ===== */
.row{display:flex;align-items:center;justify-content:space-between;gap:.8rem;
  padding:.7rem 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row:last-child{border-bottom:0}
.row .lab{font-weight:700}
.row .desc{font-size:.85rem;color:var(--muted);font-weight:500}
.sw{width:3.2rem;height:1.8rem;border-radius:999px;background:var(--surface2);
  border:1px solid var(--line);position:relative;cursor:pointer;flex:none}
.sw i{position:absolute;top:.18rem;inset-inline-start:.2rem;width:1.3rem;height:1.3rem;
  border-radius:50%;background:var(--faint);transition:.15s}
.sw.on{background:var(--accent);border-color:var(--accent)}
.sw.on i{inset-inline-start:1.5rem;background:#fff}
.vgrid{display:grid;gap:.5rem;grid-template-columns:1fr}
@media(min-width:560px){.vgrid{grid-template-columns:1fr 1fr}}
.vopt{display:flex;align-items:center;gap:.6rem;border:2px solid var(--line);
  background:var(--surface);border-radius:12px;padding:.6rem .75rem;cursor:pointer;text-align:start}
.vopt.on{border-color:var(--accent);background:var(--accent-soft)}
.vopt .nm{font-weight:700}
.vopt .ds{font-size:.8rem;color:var(--muted)}
input[type=password],input[type=text]{font:inherit;background:var(--surface);color:var(--ink);
  border:1px solid var(--line);border-radius:10px;padding:.6rem .7rem;min-width:0;flex:1;
  direction:ltr;text-align:left}
input[type=range]{width:100%;accent-color:var(--accent)}

.fbar{border-top:1px solid var(--line);margin-top:2rem;padding-block:1rem;
  color:var(--muted);font-size:.82rem}   /* --faint יצא 2.96:1 */
.hidden{display:none!important}

/* ---------- שדה קלט של המבחן ----------
   מודול המבחן הועתק לכאן מאפליקציה שבה .field כבר היה מוגדר.
   בלי הכלל הזה שדה השם של הנבחן נשאר תיבת ברירת המחדל של
   הדפדפן — 21 פיקסלים גובה, הרבה מתחת ליעד המגע של 44. */
.field{width:100%;box-sizing:border-box;font:inherit;font-size:1rem;
  min-height:48px;padding:12px 14px;border-radius:11px;outline:none;background:var(--surface2);color:inherit;border:1px solid var(--line)}
.field:focus{border-color:var(--accent)}
textarea.field{min-height:96px;resize:vertical}

/* ---------- שורות המבחן ----------
   .tog הגיע ממודול המבחן שהועתק לכאן, ולא היה לו עיצוב כלל: השם
   והמידע שמתחתיו נדבקו לשורה אחת בלי רווח. */
.tog{display:flex;align-items:center;gap:13px;width:100%;text-align:start;
  background:var(--surface2);border:1px solid transparent;border-radius:12px;
  padding:13px 15px;min-width:0}
.tog:hover{border-color:var(--line)}
.tog+.tog{margin-top:9px}
.tog .tt{flex:1;min-width:0}
.tog .tt b{display:block;font-size:.97rem;overflow-wrap:anywhere}
.tog .tt span{display:block;color:var(--muted);font-size:.85rem;overflow-wrap:anywhere;margin-top:2px}

/* יעד מגע לקישור התחתית. קישור טקסט בשורה יוצא בגובה הטקסט —
   15 פיקסלים — וזה קטן מדי לאצבע, גם כשהוא רק לתנאי השימוש. */
.lg-foot a{display:inline-flex;align-items:center;min-height:44px;padding-inline:6px}

/* ---------- יעדי מגע ----------
   .lvl יצא 39 פיקסלים ומתג ה-.sw רק 31, שניהם מתחת ל-44 שהפרויקט
   מחייב את עצמו בהם. במתג לא מגדילים את המסילה — היא תיראה מגושמת —
   אלא מרחיבים את שטח הלחיצה סביבה. */
.lvl{min-height:44px}
.sw{position:relative}
.sw::after{content:"";position:absolute;inset-block:-7px;inset-inline:-4px}

/* ---------- מסך בניית המבחן ----------
   .seg ו-.tpc הגיעו עם מודול המבחן שהועתק לכאן, ולא היה להם עיצוב:
   כפתורי הבחירה יצאו 34 פיקסלים, וכרטיסי הנושאים 6 פיקסלים בלבד —
   כלומר המורה לא יכול היה לבחור נושאים בכלל. */
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 auto;min-width:0;min-height:44px;border:1px solid var(--line);
  background:var(--surface);border-radius:10px;padding:10px 12px;font:inherit;
  font-weight:600;font-size:.9rem;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.tpc{position:relative;display:flex;flex-direction:column;gap:9px;text-align:start;
  background:var(--surface);border:1px solid var(--line);
  border-inline-start:4px solid var(--c,var(--accent));border-radius:12px;padding:14px;
  box-shadow:var(--shadow);min-width:0;min-height:44px;cursor:pointer;font:inherit;color:inherit}
.tpc.on{border-color:var(--accent);background:var(--accent-soft)}
.tpc .tn{font-weight:700;font-size:.98rem;overflow-wrap:anywhere;color:var(--c,var(--ink))}
.tpc .td{color:var(--muted);font-size:.8rem;overflow-wrap:anywhere}

/* טקסט על רקע ההדגשה: --accent-ink ולא לבן קבוע. במצב כהה
   ההדגשה בהירה, ולבן עליה יצא 1.5–2.0:1 — כמעט בלתי קריא. */
/* ---------- מצב מורה ---------- */
.te-wrap{position:fixed;inset:0;z-index:2147482500;background:rgba(8,12,20,.72);
  display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto;
  font-family:system-ui,"Heebo","Rubik",Arial,sans-serif}

.te-in{width:100%;box-sizing:border-box;font:inherit;letter-spacing:.3em;

.te-note{margin:2px 0 0;font-size:.82rem;color:#6b7280}
.te-msg{margin:10px 0 0;font-size:.92rem;font-weight:700;color:#7f1d1d;

.te-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.te-btn{font:inherit;font-weight:700;border-radius:12px;padding:.75rem 1.2rem;

/* ---------- רשימת השאלות במסך בניית המבחן ---------- */
.xq-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.xq{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface2)}
.xq-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.xq-n{flex:0 0 auto;min-width:27px;height:27px;border-radius:8px;display:inline-flex;
  align-items:center;justify-content:center;font-weight:800;font-size:.85rem;background:var(--line)}
.xq-tp{font-weight:700;font-size:.88rem;color:var(--muted);overflow-wrap:anywhere}
.xq-acts{margin-inline-start:auto;display:flex;gap:6px;flex-wrap:wrap}
/* 44 פיקסלים גם כאן. כפתור קטן בתוך רשימה ארוכה הוא בדיוק
   הכפתור שנהג מבוגר או ילד עם ADHD לא מצליח לפגוע בו. */
.xq-b{padding:8px 13px;font-size:.88rem;font-weight:700;border-radius:10px;min-height:44px;
  border:1px solid var(--line);background:transparent;color:inherit;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:inherit}
.xq-b:hover{background:var(--line)}
.xq-b[aria-pressed="true"]{background:var(--line)}
.xq-q{margin-top:8px;line-height:1.5;overflow-wrap:anywhere}
.xq-e{margin-top:5px;font-weight:700;overflow-wrap:anywhere}
.xq-a{margin-top:7px;font-size:.92rem;color:var(--ok);overflow-wrap:anywhere}
.xq-add{margin-top:12px;gap:8px}
.xq-add .sub{margin:0}
/* שאלת מקור נושאת קטע שלם. בלי תקרה הוא דוחף את שאר הרשימה
   אל מחוץ למסך. */
.xq .passage{max-height:11rem;overflow:auto}
.hlang{display:flex;gap:4px;flex:none;align-items:center;flex-wrap:wrap}
.hlang button{border:1px solid #d4dbe7;background:transparent;color:inherit;border-radius:10px;padding:3px 9px;font:inherit;font-size:.82rem;cursor:pointer;min-height:36px}
.hlang button.on{border-color:#2f5fd8;color:#fff;background:#2f5fd8;font-weight:700}

/* ---------- יעדי מגע ≥44px — 1.10.2026 ----------
   נמדד בדפדפן ב-390px וב-360px, בדף הפתיחה ובשני צעדי לחיצה ממנו.
   הבלוק אחרון ב-style כדי לגבור על ההגדרות שמעליו. מגדילים בריפוד
   ובגובה מינימלי, לא בגובה קשיח — ערבית ורוסית ארוכות יותר. */
.hlang button{min-height:44px;padding-block:6px}
input[type=range]{min-height:44px}
.spk.sm{min-width:44px;min-height:44px}
.lvl{min-width:44px}

/* ---------- קישור בתוך טקסט — אזור נגיעה ≥44px · 2.10.2026 (O-110) ----------
   שני מקרים, ונמדדו שניהם ב-390px וב-360px:
   - קישור בתוך שורת טקסט רצה: ריפוד אנכי בלבד. ב-inline הוא מגדיל את
     אזור הנגיעה ואינו נכנס לגובה השורה — אף אלמנט לא זז.
   - קישורים זה מתחת לזה (<br>), וקישור בתוך פס ההקראה הקבוע: שם הריפוד
     חרג מהשורה וכיסה את הקישור או הכפתור שלידו, ולכן inline-flex
     בגובה 44 — כמו `.lg-foot a`. השורה גדלה, ואין חפיפה.
   לא `a` כללי: `.lg-foot a` ודומיו כבר 44px בבנייה אחרת. */
#tts-fail a,a[href*="education.gov.il"]{display:inline-flex;align-items:center;min-height:44px}

/* --- מנוע ההדגמה. הקוד כאן זהה בכל האפליקציות; רק DEMO_SCRIPT משתנה. --- */
var DEMO={on:false,i:0,timer:null,extra:[],bar:null,txt:null,step:null,fill:null,btn:null};

/* עוזרים לתסריט. כולם מחזירים false כשהאיבר אינו על המסך, כדי
   שצעד שלא מצא את מה שחיפש ידלג ולא יפיל את ההדגמה כולה. */
function demoEl(s){return typeof s==="string"?document.querySelector(s):s}
function demoShow(s){
  var e=demoEl(s); if(!e)return false;
  try{e.scrollIntoView({behavior:"smooth",block:"center"})}catch(err){try{e.scrollIntoView()}catch(err2){}}
  return true;
}
/* מדגיש את האיבר, ורק אז לוחץ — צופה שלא ראה לאן נלחץ לא הבין
   מה קרה. לכן אין צעד קצר מ-1200 אלפיות בתסריטים. */
function demoTap(s){
  var e=demoEl(s); if(!e||e.disabled)return false;
  demoShow(e);
  e.classList.add("demo-tap");
  DEMO.extra.push(setTimeout(function(){
    e.classList.remove("demo-tap");
    /* המסך מצטייר מחדש כל הזמן. אם האיבר שסומן כבר אינו במסמך,
       מחפשים אותו שוב לפי אותו בורר — לחיצה על איבר מת אינה
       עושה דבר, וזה בדיוק צעד שנראה כאילו נתקע. */
    var live=(typeof s==="string"&&!document.contains(e))?demoEl(s):e;
    if(DEMO.on&&live&&!live.disabled&&document.contains(live))try{live.click()}catch(err){}
  },430));
  return true;
}
function demoClick(s){
  var e=demoEl(s); if(!e||e.disabled)return false;
  try{e.click()}catch(err){return false}
  return true;
}
/* הקלדה אות אחר אות, עם אירוע input אמיתי — שדה חיפוש שמאזין
   ל-input לא היה מגיב להשמה ישירה ל-value. */
function demoType(s,text){
  var e=demoEl(s); if(!e)return false;
  demoShow(e); try{e.focus()}catch(err){}
  e.value=""; var i=0;
  var t=setInterval(function(){
    if(!DEMO.on||!e.parentNode){clearInterval(t);return}
    e.value=String(text).slice(0,++i);
    e.dispatchEvent(new Event("input",{bubbles:true}));
    if(i>=String(text).length)clearInterval(t);
  },85);
  DEMO.extra.push(t);
  return true;
}
function demoQuiet(){
  try{if(window.speechSynthesis)speechSynthesis.cancel()}catch(e){}
  try{if(typeof stopSpeak==="function")stopSpeak()}catch(e){}
}

function demoMountUI(){
  var st=document.createElement("style");
  st.id="demo-style"; st.textContent=DEMO_CSS;
  (document.head||document.documentElement).appendChild(st);

  var b=document.createElement("button");
  b.id="demo-start"; b.type="button";
  b.innerHTML='<span aria-hidden="true">▶</span><span>התחל הדגמה</span>';
  b.addEventListener("click",demoStart);
  document.body.appendChild(b);

  var bar=document.createElement("div");
  bar.id="demo-bar"; bar.hidden=true;
  bar.setAttribute("role","status");
  bar.setAttribute("aria-live","polite");
  bar.innerHTML='<div id="demo-sub"><p id="demo-txt"></p>'+
    '<div id="demo-meta"><span id="demo-step"></span>'+
    '<button id="demo-exit" type="button">יציאה · ESC</button></div>'+
    '<div id="demo-prog"><i></i></div></div>';
  document.body.appendChild(bar);

  DEMO.btn=b; DEMO.bar=bar;
  DEMO.txt=document.getElementById("demo-txt");
  DEMO.step=document.getElementById("demo-step");
  DEMO.fill=bar.querySelector("#demo-prog i");
  document.getElementById("demo-exit").addEventListener("click",function(){demoStop()});
  document.addEventListener("keydown",demoKey,true);
}

/* ESC יוצא. הקשבה בשלב הלכידה, כדי שמסך שכבר מטפל ב-Escape
   לא יבלע את המקש לפני שההדגמה ראתה אותו. */
function demoKey(e){
  if(!DEMO.on)return;
  if(e.key==="Escape"||e.keyCode===27){
    e.preventDefault(); e.stopPropagation();
    demoStop();
  }
}

function demoStart(){
  if(DEMO.on)return;
  DEMO.on=true; DEMO.i=0;
  DEMO.btn.hidden=true; DEMO.bar.hidden=false;
  document.documentElement.classList.add("demo-running");
  demoNext();
}

function demoNext(){
  if(!DEMO.on)return;
  if(DEMO.i>=DEMO_SCRIPT.length){demoStop();return}
  var it=DEMO_SCRIPT[DEMO.i++]||{};
  var d=Math.max(600,it.duration||3000);
  DEMO.txt.textContent=it.subtitle||"";
  DEMO.step.textContent=DEMO.i+" / "+DEMO_SCRIPT.length;
  DEMO.fill.style.transition="none"; DEMO.fill.style.width="0";
  void DEMO.fill.offsetWidth;
  DEMO.fill.style.transition="width "+d+"ms linear";
  DEMO.fill.style.width="100%";
  if(typeof it.action==="function"){
    try{it.action()}catch(err){if(window.console)console.warn("demo:",err)}
  }
  DEMO.timer=setTimeout(demoNext,d);
}

function demoStop(){
  DEMO.on=false;
  if(DEMO.timer){clearTimeout(DEMO.timer);DEMO.timer=null}
  DEMO.extra.forEach(function(t){clearTimeout(t);clearInterval(t)});
  DEMO.extra=[];
  var m=document.querySelectorAll(".demo-tap"),i;
  for(i=0;i<m.length;i++)m[i].classList.remove("demo-tap");
  if(DEMO.bar)DEMO.bar.hidden=true;
  if(DEMO.btn)DEMO.btn.hidden=false;
  document.documentElement.classList.remove("demo-running");
  demoQuiet();
}

function demoMount(){
  if(document.querySelector(".lg-wrap")){setTimeout(demoMount,500);return}
  if(!document.getElementById("demo-start"))demoMountUI();
}

if(DEMO_ON){
  if(document.readyState==="complete")setTimeout(demoMount,0);
  else window.addEventListener("load",function(){setTimeout(demoMount,0)});
}

function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){var i,j,t;for(i=a.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));
  t=a[i];a[i]=a[j];a[j]=t}return a}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function uniq(a){return a.filter(function(v,i){return a.indexOf(v)===i})}
function todayIso(){var d=new Date();return d.getFullYear()+"-"+

var state=blankState();

function load(){
  try{
    var raw=localStorage.getItem(SKEY); if(!raw)return;
    var o=JSON.parse(raw); if(!o||typeof o!=="object")return;
    Object.keys(blankState()).forEach(function(k){if(o[k]!==undefined)state[k]=o[k]});
  }catch(e){}
  if(!LANGS[state.lang])state.lang=guessLang();
  if(GEM_VOICES.every(function(v){return v.id!==state.gemVoice}))state.gemVoice="Kore";
  state.rate=clamp(Number(state.rate)||0.95,0.6,1.3);
}
function save(){try{localStorage.setItem(SKEY,JSON.stringify(state))}catch(e){}}

/* שפת הדפדפן, לא ברירת מחדל עברית. מי שפותח את האפליקציה במכשיר
   ברוסית לא אמור להיתקל קודם במסך בעברית שאינו יכול לקרוא. */
/* אנגלית אינה סימן. טלפון בישראל מדווח אנגלית כברירת מחדל של
   המכשיר, לא כבחירה, והאפליקציה נפתחה באנגלית למי שבא ללמוד
   בעברית. ערבית ורוסית כן נחשבות — שם זו שפת אם של ממש. מי
   שרוצה אנגלית בוחר אותה, והבחירה נשמרת. */
function guessLang(){
  var ls=(navigator.languages||[navigator.language||"he"]).map(function(x){
    return String(x).toLowerCase().split("-")[0]});
  for(var i=0;i<ls.length;i++){
    var c=ls[i]==="iw"?"he":ls[i];
    if(c==="en")continue;
    if(LANGS[c])return c;
  }
  return "he";
}
function touchDay(){
  var d=todayIso();
  if(state.day.d!==d){
    var y=new Date(Date.now()-86400000);
    var yi=y.getFullYear()+"-"+String(y.getMonth()+1).padStart(2,"0")+"-"+String(y.getDate()).padStart(2,"0");
    state.streak=(state.lastDay===yi)?(state.streak||0)+1:1;
    state.lastDay=d; state.day={d:d,n:0};
  }
}
function stKey(tid,lv){return tid+"|"+lv}
function stOf(tid,lv){
  var k=stKey(tid,lv);
  if(!state.stats[k])state.stats[k]={seen:0,ok:0,bad:0};
  return state.stats[k];
}
function mastery(tid,lv){
  var s=state.stats[stKey(tid,lv)];
  if(!s||!s.seen)return 0;
  return clamp(s.ok/Math.max(6,s.seen),0,1);
}
function barCls(m){return m>=.75?"b2":m>=.4?"b1":"b0"}

}

function allVoices(){try{return window.speechSynthesis?(speechSynthesis.getVoices()||[]):[]}catch(e){return[]}}
/* הקולות נטענים אסינכרונית, ורק אז נורה voiceschanged. מי שמקריא
   לפני כן מקבל את ברירת המחדל של הדפדפן — לרוב קול אנגלי, גם כשמותקן
   קול עברי טוב. onvoiceschanged לבדו אינו פתרון: הוא מרענן תפריט,
   הוא לא מעכב את האמירה הראשונה. */
var _voicesP=null;
function voicesReady(){
  if(_voicesP)return _voicesP;
  _voicesP=new Promise(function(done){
    if(!("speechSynthesis" in window)){done();return}
    if(allVoices().length){done();return}
    var poll=null,cap=null,fired=false;
    function finish(){
      if(fired)return; fired=true;
      clearInterval(poll); clearTimeout(cap);
      try{speechSynthesis.removeEventListener("voiceschanged",finish)}catch(e){}
      done();
    }
    try{speechSynthesis.addEventListener("voiceschanged",finish)}catch(e){}
    /* Safari לא תמיד יורה את האירוע — לכן גם דגימה */
    poll=setInterval(function(){if(allVoices().length)finish()},120);
    /* תקרה: יש מכשירים שמחזירים רשימה ריקה לצמיתות ומדברים מצוין.
       עדיף לדבר בקול ברירת מחדל מאשר לשתוק לנצח. */
    cap=setTimeout(finish,4000);
  });
  return _voicesP;
}
var LANG_HINT={he:/עברית|hebrew|ivrit/i,ar:/العربية|arabic/i,ru:/русский|russian/i,en:/english/i};
/* שמות שהמערכות באמת מתקינות. חסרו כאן קולות ערביים ורוסיים,
   ואז שניהם חזרו "לא ידוע" — איש מהם לא קיבל את בונוס המגדר,
   וההכרעה נפלה על התאמת אזור מדויקת. כך נבחר קול גברי כשקיים
   קול נשי באותה שפה. */
var V_F=/(הילה|כרמית|زارية|سلمى|أمينة|امينة|هدى|فاطمة|ليلى|نورا|светлана|дарья|ирина|екатерина|татьяна|елена|female|woman|#female|\bfem\b|carmit|hila|\bmiri\b|\bdana\b|shira|samantha|karen|moira|tessa|serena|victoria|\bava\b|allison|susan|vicki|nicky|\bzoe\b|fiona|\bkate\b|shelley|zira|hazel|aria|jenny|michelle|\bana\b|\beva\b|emma|libby|sonia|natasha|clara|\bamber\b|ashley|\bcora\b|elizabeth|monica|\bsara\b|\bsarah\b|\bjane\b|\bnancy\b|\bluna\b|\bmolly\b|irina|milena|svetlana|dariya|\belena\b|katja|ekaterina|\bkatya\b|tatyana|\balena\b|hoda|salma|zariyah|amina|\bhala\b|noura|laila|layla|fatima|zeina|\biman\b|\brana\b|\bsana\b|maryam|asma|heera|raveena|swara|neerja)/
var V_M=/(google[^a-z]{0,15}(arabic|العربية)|אברי|אסף|حامد|ماجد|طارق|ناصر|بسام|дмитрий|павел|юрий|максим|николай|\bmale\b|\bman\b|#male|asaf|avri|yoni|moshe|\balex\b|daniel|\bfred\b|\btom\b|aaron|arthur|oliver|rishi|gordon|\blee\b|ralph|bruce|david|\bmark\b|\bguy\b|ryan|christopher|\beric\b|brian|andrew|roger|steffan|liam|william|george|james|\bthomas\b|benjamin|brandon|\bjason\b|\btony\b|dmitry|pavel|\byuri\b|artemi|maxim|nikolai|maged|tarik|naayf|hamed|shakir|\bomar\b|tarek|\bali\b|bassel|\bmoaz\b|hamdan|saleh|abdullah|\btaim\b|fahed|rakan|yasser|hemant|madhur|prabhat)/
function vGender(v){var n=((v.name||"")+" "+(v.lang||"")).toLowerCase();
  return V_F.test(n)?"f":V_M.test(n)?"m":"?"}
function voicesFor(code){
  var base=String(code).split("-")[0].toLowerCase(),hint=LANG_HINT[base];
  return allVoices().filter(function(v){
    var l=String(v.lang||"").replace("_","-").toLowerCase();
    if(l.split("-")[0]===base)return true;
    return !l&&hint?hint.test(v.name||""):false;
  });
}
/* בורר קולות המכשיר. עד כה לא היה כזה בכלל: bestVoice בחר לבד,
   והמשתמש לא יכול היה להשפיע — כולל לבקש קול נשי. */
/* אין קול נשי בשפה שמוצגת? femLift מרים את הגובה, וזה כל מה
   שדפדפן יכול לעשות בלי הקלטות ובלי שירות חיצוני. ההודעה מסבירה
   את זה ומצרפת את ההוראות למערכת ההפעלה שהמשתמש נמצא בה — קול
   נשי שמותקן נבחר מיד, בלי שינוי הגובה ובלי הודעה. */
function femNote(pool){
  if(!pool||!pool.length)return "";
  for(var i=0;i<pool.length;i++)if(vGender(pool[i])==="f")return "";
  /* המסלול נכתב למערכת שהמשתמש נמצא בה עכשיו. אנדרואיד של גוגל
     מחזיק את ההגדרה תחת "נגישות" — "ניהול כללי" הוא מסלול של
     סמסונג בלבד; אייפד מדווח מאז iPadOS 13 כמו מק ונבדל ממנו רק
     במסך מגע; ומשתמש מק קיבל עד כה הוראות של ווינדוס, כי כל מה
     שאינו אנדרואיד או אייפון נפל לשם. */
  var ua=navigator.userAgent||"";
  var how=/Android/i.test(ua)?"femAndroid"
         :(/iPhone|iPad|iPod/i.test(ua)||(/Macintosh/i.test(ua)&&navigator.maxTouchPoints>1))?"femIos"
         :/Mac OS X|Macintosh/i.test(ua)?"femMac":"femWin";
  return t("femNone")+" "+t(how);
}
function devPicker(lgs){
  var out="";
  lgs.forEach(function(lg){
    var code=lg==="en"?EN_TTS:LANGS[lg].tts;
    var pool=voicesFor(code);
    if(lgs.length>1)out+='<p style="font-weight:700;margin:.9rem 0 .3rem">'+esc(LANGS[lg]?LANGS[lg].name:code)+"</p>";
    if(!pool.length){
      /* אומרים את זה במפורש. רשימה ריקה בלי הסבר נראית כמו תקלה. */
      out+='<p class="chip bad" style="margin:.4rem 0">'+esc(t("vNoneLang"))+"</p>";
      return;
    }
    /* אין קול נשי בשפה הזאת? הגובה מורם — וגם נאמר למה. בלי המשפט
       הזה הקול הגברי נראה כמו בחירה של האפליקציה ולא כמו מה שיש
       במכשיר, ואין שום רמז שאפשר להתקין קול נשי ולקבל אותו מיד. */
    var fnote=femNote(pool);
    if(fnote)out+='<p class="sub" style="margin:.4rem 0;line-height:1.5">'+esc(fnote)+"</p>";
    var cur=(state.devVoice||{})[code]||"";
    function row(v){
      var on=v?cur===v.voiceURI:!cur;
      var uri=v?v.voiceURI:"";
      return '<div class="vopt'+(on?" on":"")+'" data-a="devvoice" data-l="'+lg+'" data-u="'+esc(uri)+
        '" role="button" tabindex="0" aria-pressed="'+(on?"true":"false")+'">'+
        '<span style="flex:1"><span class="nm">'+esc(v?v.name:t("vAuto"))+'</span><br>'+
        '<span class="ds">'+esc(v?v.lang:t("vDevD"))+"</span></span>"+
        (v?'<button class="btn ghost" data-a="devsample" data-l="'+lg+'" data-u="'+esc(uri)+
           '" style="padding:.35rem .7rem;min-height:2.2rem;font-size:.82rem">'+
           ic("play",14)+" "+esc(t("vSample"))+"</button>":"")+"</div>";
    }
    out+='<div class="vgrid">'+row(null)+"</div>";

function vchkT(){ var g=state.lang||"he"; return VCHKMSG[g]||VCHKMSG.he }
function voiceCheck(){
  var M=vchkT();
  VCHK=M.sent; render();
  function show(m){ VCHK=m; render() }
  if(!("speechSynthesis" in window)){ show(M.noSup); return }
  var list=[]; try{ list=speechSynthesis.getVoices()||[] }catch(e){}
  try{ speechSynthesis.cancel() }catch(e){}
  var u;
  try{ u=new SpeechSynthesisUtterance(M.say) }
  catch(e){ show(M.mkFail+e.message); return }
  u.lang=(LANGS[state.lang||"he"]||LANGS.he).tts; u.volume=1; u.rate=1; u.pitch=1;
  var done=false;
  u.onstart=function(){ done=true; show(M.okN[0]+list.length+M.okN[1]) };
  u.onerror=function(e){ done=true;
    var er=(e&&e.error)||M.unk;
    if(er==="interrupted"||er==="canceled"){ show(M.ok); return }
    show(M.engine[0]+er+" · "+list.length+M.engine[1]); };
  try{ speechSynthesis.speak(u) }
  catch(e){ show(M.spFail+e.message); return }
  setTimeout(function(){ if(!done)
    show(M.timeout[0]+list.length+M.timeout[1]) },2000);
}

/* ------------------------------------------------------------
   דור ההקראה. speechSynthesis.cancel() אינו מבטל setTimeout:
   כרום יורה onend על האמירה שבוטלה, המקטע הבא נרשם בכל זאת,
   וכעבור SEG_GAP ההקראה הישנה חוזרת מעל החדשה — שני קולות
   במקביל. מונה אחד פותר את זה: כל הקראה מקבלת מספר, stopSpeak
   מקדם אותו, ומקטע מדור ישן פשוט אינו מדבר.
   ------------------------------------------------------------ */
var _sayGen=0;
function speakDevice(text,code,rate){
  if(!("speechSynthesis" in window))return false;
  try{speechSynthesis.cancel()}catch(e){}
  var my=++_sayGen;
  /* האמירה יוצאת מיד, בתוך הלחיצה. קודם היא נעטפה ב-voicesReady,
     שממתין לרשימת הקולות ועד ארבע שניות אם היא לא מגיעה — ואמירה
     שיוצאת ארבע שניות אחרי המגע נזרקת בשקט באנדרואיד ובספארי.
     כשהרשימה כבר כאן, בוחרים קול ומדברים. כשהיא ריקה — מדברים
     בכל זאת, עם u.lang בלבד: קול ברירת מחדל בשפה הנכונה עדיף על
     שתיקה, ויש מכשירים שמחזירים רשימה ריקה לצמיתות ומדברים היטב.
     voicesReady נשאר בשימוש למסך בחירת הקול, שם ההמתנה במקומה. */
  (function(){
    try{
      var v=bestVoice(code), lang=(v&&v.lang)||code;
      var segs=segments(String(text)), rt=tuneRate(lang,clamp(rate,0.55,1.4));
      var pit=femLift(v);
      (function sayseg(k){
        if(my!==_sayGen)return;   /* ההקראה הזאת בוטלה — המקטע הבא לא יוצא */
        if(k>=segs.length){ hlClear(); ttsOK(); return }
        var seg=segs[k];
        var u=new SpeechSynthesisUtterance(seg.text);
        u.lang=lang;
        if(v){ try{ u.voice=v }catch(e2){} }
        u.rate=rt; u.pitch=pit; u.volume=1;
        u.onboundary=function(e){if(!e.name||e.name==="word")hlAt(seg.start+e.charIndex)};
        u.onend=function(){
          if(k+1<segs.length) setTimeout(function(){sayseg(k+1)},SEG_GAP);
          else { hlClear(); ttsOK() }
        };
        u.onerror=function(e){ttsFail(e&&e.error)};
        speechSynthesis.speak(u);
      })(0);
    }catch(e){}
  })();
  return true;
}
/* lang: "en" לחומר הנלמד, או קוד שפת האם להוראה. */
function speak(text,lang,rateMul){
  /* כל טקסט שמגיע להקראה מנוקה מתגיות. חלק מהקריאות כבר מנקות
     לבד, וניקוי חוזר אינו משנה דבר — אבל בלעדיו כל מחרוזת שנשארה
     עם <sub> או <span class="frac"> הוקראה בקול כתגית: הסטודנט
     שמע "span class frac" באמצע השאלה. */
  text=plainOf(String(text||"")).trim(); if(!text)return;
  lang=lang||"en";
  var code=lang==="en"?EN_TTS:LANGS[lang].tts;
  var rate=clamp(state.rate*(rateMul||1),0.55,1.4);
  stopSpeak();
  var my=_sayGen;   /* גם תשובת רשת שמגיעה אחרי עצירה לא תושמע */
  /* שכבה 1 - קובץ מוקלט (המנוע של תאוריה מדברת). יש קובץ:
     מנגנים וזהו; אין: קול המכשיר כרגיל. מבדק חוסרים 30.9 סעיף 4. */
  if(typeof RECORDED!=="undefined"&&RECORDED.play(text,lang,{rate:state.rate,
      onError:function(){ if(my===_sayGen)speakDevice(text,code,rate) }})){
    return;
  }
  if(gemOn()){
    var vid=gvOf(state.gemVoice).id;
    var ck=lang+"|"+vid+"|"+rate.toFixed(2)+"|"+text;
    if(gCache[ck]){playUrl(gCache[ck],text,code,rate);return}
    gBusy=true; renderSpeakState();
    gSynth(text,vid,rate,lang).then(function(u){
      if(my!==_sayGen)return;
      gCache[ck]=u; gBusy=false; renderSpeakState(); playUrl(u,text,code,rate);
    }).catch(function(){
      gBusy=false; renderSpeakState(); speakDevice(text,code,rate);
    });
    return;
  }
  speakDevice(text,code,rate);
}
function playUrl(url,text,code,rate){
  gStop();
  /* משתמשים באלמנט ששוחרר במגע ולא יוצרים חדש. */
  if(!GEL)GEL=new Audio();
  gAudio=GEL; gAudio.src=url;
  gAudio.play().catch(function(){speakDevice(text,code,rate)});
}
function stopSpeak(){_sayGen++;gStop();if(typeof RECORDED!=="undefined")RECORDED.stop();hlClear();try{if(window.speechSynthesis)speechSynthesis.cancel()}catch(e){}}
/* עוזבים את הדף — הקול נעצר. בלעדיו הוא ממשיך ברקע אחרי מעבר לטאב
   אחר, ולפעמים נתקע עד סגירת הדפדפן. */
try{document.addEventListener("visibilitychange",function(){
  if(document.hidden)stopSpeak();
});}catch(e){}
/* iOS לא ישמיע כלום עד שאמירה אחת יצאה מתוך handler של מגע אמיתי.
   אמירה אוטומטית בטעינת הדף נבלעת בשקט — בלי חריגה, בלי לוג, בלי
   דרך לדעת. משחררים פעם אחת עם אמירה ריקה.
   חשוב: קריאה ישירה, בלי voicesReady — הבטחה שוברת את שרשרת המגע
   ו-Safari כבר לא יזהה את האמירה כיוזמת משתמש. */
try{document.addEventListener("pointerdown",function(){
  try{speechSynthesis.speak(new SpeechSynthesisUtterance(""))}catch(e){}
  /* ואותו דבר לאלמנט השמע: מקור שקט, play בתוך המגע עצמו. */
  try{
    if(!GEL)GEL=new Audio();
    GEL.src=SILENT_WAV;
    var pr=GEL.play();
    if(pr&&pr.then)pr.then(function(){try{GEL.pause();GEL.currentTime=0}catch(e){}},function(){});
  }catch(e){}
},{once:true});}catch(e){}
function renderSpeakState(){
  var b=document.querySelectorAll(".spk");
  for(var i=0;i<b.length;i++)b[i].classList.toggle("on",gBusy);

/* ============================================================
   7. תוכן
   ------------------------------------------------------------
   בנק שאלות כתוב, ולא מחולל. באזרחות אין נוסחה שממנה נגזרת
   שאלה: הניסוח המדויק הוא החומר הנלמד, ומסיח שנבנה אוטומטית
   מנוסח אחר היה יוצא או מופרך מדי או נכון בעצמו.

   Q(id, q, opts, ok, hint, ex, fig)
     id   — מזהה יציב לפריט. הוא נכנס לסטטיסטיקה של הלומד, ולכן
            אסור לו להשתנות כשמוסיפים פריט לפניו.
     q    — נוסח השאלה, בארבע שפות.
     opts — ארבע תשובות, כל אחת בארבע שפות. תמיד ארבע: שלוש
            אפשרויות הן ניחוש של אחד משלושה.
     ok   — אינדקס התשובה הנכונה במערך opts (0..3). הסדר על
            המסך מעורבב בכל הצגה, ולכן האינדקס אינו רמז.
     hint — רמז שמכוון לחשיבה ואינו מוסר את התשובה.
     ex   — ההסבר שנפתח אחרי המענה, גם כשענו נכון.
     fig  — מפתח איור מתוך FIGS, או null. אופציונלי בהגדרה:
            רוב השאלות באזרחות הן טקסט בלבד.

   כל שדה קיים בארבע השפות. אזרחות נלמדת בשפת האם — מי שקורא
   בקושי בעברית לא ילמד ממנה מדרג נורמות, ולכן התוכן עצמו
   מתורגם ולא רק הממשק.

   מקור: תוכנית הלימודים בספרות של משרד החינוך (בחירה ויצירה), ומבנה שאלונים 8281/8282. הניסוח מקורי של בקול, עם קרדיט וקישור למשרד החינוך.
   השאלות נכתבו לאפליקציה הזאת ואינן העתק של בחינה.
   ============================================================ */
function Q(id,q,opts,ok,hint,ex,fig,wrong){
  return {id:id,q:q,o:opts,ok:ok,hint:hint,ex:ex,fig:fig||null,wrong:wrong||null};
}

    'font-size="10" font-weight="700" fill="currentColor">'+esc(label)+'</text>'+

  {"he": "סיפור קצר: מספר ונקודת מבט", "ar": "القصة القصيرة: الراوي ووجهة النظر", "ru": "Рассказ: повествователь и точка зрения", "en": "Short fiction: narrator and viewpoint"},
  {"he": "זהו מי מספר ומה הוא יודע", "ar": "حدّد من يروي وما يعرفه", "ru": "Определите, кто рассказывает и что ему известно", "en": "Identify who speaks and what they know"},
[ [
  Q("lit-narrator",{"he": "בסיפור מקורי, \"לא ידעתי מדוע אחי נעל את הדלת\". מה אפשר להסיק על המספר?", "ar": "في قصة أصلية: «لم أعرف لماذا أقفل أخي الباب». ماذا نعرف عن الراوي؟", "ru": "В новом рассказе: «Я не знал, зачем брат запер дверь». Что известно о рассказчике?", "en": "In an original story: \"I did not know why my brother locked the door.\" What follows about the narrator?"},[{"he": "הוא יודע רק את מחשבותיו כאן", "ar": "يعرف أفكاره وحدها هنا", "ru": "Здесь он знает лишь свои мысли", "en": "Here he knows only his own thoughts"},{"he": "הוא יודע את מחשבות כולם", "ar": "يعرف أفكار الجميع", "ru": "Он знает мысли всех", "en": "He knows everyone’s thoughts"},{"he": "הוא אינו דמות בסיפור", "ar": "ليس شخصية في القصة", "ru": "Он не персонаж рассказа", "en": "He is not a character"},{"he": "הוא מדבר בשם המחבר האמיתי", "ar": "يتكلم باسم الكاتب الحقيقي", "ru": "Он говорит от лица автора", "en": "He speaks for the real author"}],0,{"he": "שימו לב למילים \"לא ידעתי\".", "ar": "انتبهوا إلى «لم أعرف».", "ru": "Обратите внимание на «не знал».", "en": "Notice \"did not know\"."},{"he": "גוף ראשון והודאה בחוסר ידיעה מגבילים את ידיעות המספר; אין בכך הוכחה מי המחבר.", "ar": "ضمير المتكلم والاعتراف بالجهل يحدان معرفة الراوي؛ ولا يكشفان هوية الكاتب.", "ru": "Первое лицо и признание незнания ограничивают знания рассказчика; об авторе это не говорит.", "en": "First person and admitted uncertainty limit the narrator’s knowledge; they do not identify the author."},null,[null,{"he": "הוא אומר שאינו יודע מדוע אחיו פעל.", "ar": "يقول إنه لا يعرف سبب فعل أخيه.", "ru": "Он прямо говорит, что не знает причины поступка брата.", "en": "He says he does not know his brother’s reason."},{"he": "המילה \"אני\" מציבה אותו בתוך האירוע.", "ar": "ضمير «أنا» يضعه داخل الحدث.", "ru": "Слово «я» помещает его в событие.", "en": "The word \"I\" places him in the scene."},{"he": "מספר בגוף ראשון אינו בהכרח המחבר.", "ar": "الراوي بضمير المتكلم ليس بالضرورة المؤلف.", "ru": "Рассказчик от первого лица не обязательно автор.", "en": "A first-person narrator is not necessarily the author."}]),
  Q("lit-evidence",{"he": "תלמידה טוענת שדמות מפחדת, אך הטקסט מתאר רק שהיא סוגרת חלון. מה יחזק את הטענה?", "ar": "تقول طالبة إن الشخصية خائفة، لكن النص يذكر فقط أنها تغلق نافذة. ما الذي يقوّي رأيها؟", "ru": "Ученица считает, что героиня боится, но в тексте она лишь закрывает окно. Что укрепит вывод?", "en": "A student says a character is afraid, but the text only says she shuts a window. What strengthens the claim?"},[{"he": "להצביע על רמזים נוספים, כגון רעד או מבט לעבר הדלת", "ar": "الإشارة إلى قرائن أخرى مثل الارتجاف أو النظر نحو الباب", "ru": "Указать другие признаки, например дрожь или взгляд на дверь", "en": "Point to other clues, such as trembling or looking at the door"},{"he": "לחזור על המילה \"מפחדת\" פעמים רבות", "ar": "تكرار كلمة «خائفة» مرارًا", "ru": "Повторять слово «боится»", "en": "Repeat the word \"afraid\""},{"he": "לטעון שכל חלון סגור מעיד על פחד", "ar": "القول إن كل نافذة مغلقة تدل على الخوف", "ru": "Сказать, что любое закрытое окно означает страх", "en": "Claim that every shut window means fear"},{"he": "לספר מה המחבר חשב כשכתב", "ar": "ذكر ما شعر به المؤلف حين كتب", "ru": "Пересказать чувства автора при написании", "en": "Report what the author felt while writing"}],0,{"he": "חפשו סימנים מתוך הסיפור עצמו.", "ar": "ابحثوا عن علامات داخل القصة نفسها.", "ru": "Ищите признаки в самом тексте.", "en": "Look for signs within the story."},{"he": "פרשנות נתמכת בדפוס של פרטים מן הטקסט, לא בחזרה על הטענה.", "ar": "يسند التفسير نمط من تفاصيل النص، لا تكرار الرأي.", "ru": "Толкование опирается на ряд деталей текста, а не на повторение вывода.", "en": "Interpretation needs a pattern of textual details, not repetition."},null,[null,{"he": "חזרה אינה מוסיפה ראיה.", "ar": "التكرار لا يضيف دليلاً.", "ru": "Повтор не добавляет доказательств.", "en": "Repetition adds no evidence."},{"he": "סגירת חלון עשויה לנבוע מקור או מרעש.", "ar": "قد يكون إغلاق النافذة بسبب البرد أو الضوضاء.", "ru": "Окно закрывают также от холода или шума.", "en": "A window can be shut because of cold or noise."},{"he": "אין לנו גישה ישירה לכוונת המחבר.", "ar": "لا نملك وصولاً مباشرًا إلى نية المؤلف.", "ru": "Нам недоступны мысли автора.", "en": "We cannot directly know the author’s thoughts."}])
 ,Q("lit-narr-know",{"he": "בסיפור מקורי, \"אמא אמרה שהכל בסדר, אבל ידיה רעדו כשסגרה את המזוודה\". מה המשפט מגלה בלי לומד זאת במפורש?", "ar": "في قصة أصلية: «قالت الأم إن كل شيء بخير، لكن يديها ارتجفتا وهي تغلق الحقيبة». ماذا تكشف الجملة دون أن تقوله صراحة؟", "ru": "В новом рассказе: «Мама сказала, что всё в порядке, но её руки дрожали, когда она закрывала чемодан». Что фраза раскрывает, не говоря прямо?", "en": "In an original story: \"Mom said everything was fine, but her hands shook as she closed the suitcase.\" What does the sentence reveal without saying it directly?"},[{"he": "שהאמא לחוצה למרות דבריה", "ar": "أن الأم متوترة رغم كلامها", "ru": "Что мама напряжена, несмотря на свои слова", "en": "That the mother is tense despite her words"},{"he": "שהמזוודה ישנה וכבדה", "ar": "أن الحقيبة قديمة وثقيلة", "ru": "Что чемодан старый и тяжёлый", "en": "That the suitcase is old and heavy"},{"he": "שהאמא מתרגשת לקראת חופשה", "ar": "أن الأم متحمسة لقضاء إجازة", "ru": "Что мама радуется предстоящему отпуску", "en": "That the mother is excited about a vacation"},{"he": "שהסיפור מסופר מפי האמא עצמה", "ar": "أن القصة تُروى بلسان الأم نفسها", "ru": "Что рассказ ведётся от лица самой мамы", "en": "That the story is told by the mother herself"}],0,{"he": "השוו בין מה שנאמר לבין מה שהגוף עושה.", "ar": "قارنوا بين ما يُقال وما يفعله الجسد.", "ru": "Сравните сказанное с тем, что делает тело.", "en": "Compare what is said with what the body does."},{"he": "הטקסט מגלה רגש דרך פעולה ולא דרך הצהרה. למשל ידיים הרועדות חושפות מתח שהמילה \"בסדר\" מנסה להסתיר.", "ar": "النصّ يكشف المشاعر عبر الفعل لا عبر التصريح. مثال: ارتجاف اليدين يكشف توترًا تحاول كلمة «بخير» إخفاءه.", "ru": "Текст раскрывает чувство через действие, а не через прямое заявление. Например, дрожащие руки выдают напряжение, которое слово «порядок» пытается скрыть.", "en": "The text reveals feeling through action, not statement. For example, shaking hands expose tension that the word \"fine\" tries to hide."},null,[null,{"he": "הטקסט לא עוסק במצב המזוודה אלא במצב האמא.", "ar": "النصّ لا يتحدث عن حال الحقيبة بل عن حال الأم.", "ru": "Текст говорит не о состоянии чемодана, а о состоянии мамы.", "en": "The text is about the mother's state, not the suitcase's."},{"he": "שום פרט בטקסט לא מדבר על חופשה או על התרגשות.", "ar": "لا شيء في النصّ يذكر إجازة أو حماسًا.", "ru": "Ни одна деталь не говорит об отпуске или радости.", "en": "No detail mentions a vacation or excitement."},{"he": "האמא מתוארת מבחוץ, ולכן היא אינה המספרת.", "ar": "الأم موصوفة من الخارج، فهي ليست الراوية.", "ru": "Мама описана со стороны, значит, она не рассказчик.", "en": "The mother is described from outside, so she is not the narrator."}]),
  Q("sh-1-01",{"he": "מהו מספר בגוף ראשון?", "ar": "ما الراوي بضمير المتكلم؟", "ru": "Что такое рассказчик от первого лица?", "en": "What is a first-person narrator?"},[{"he": "דמות בסיפור שמספרת במילה \"אני\"", "ar": "شخصية في القصة تروي بكلمة \"أنا\"", "ru": "Персонаж, который рассказывает словом «я»", "en": "A character in the story who tells it as \"I\""}, {"he": "קול שיודע את מחשבות כל הדמויות ואינו משתתף בעלילה", "ar": "صوت يعرف أفكار جميع الشخصيات ولا يشارك في الأحداث", "ru": "Голос, знающий мысли всех героев и не участвующий в сюжете", "en": "A voice that knows every character's thoughts and takes no part in the plot"}, {"he": "המחבר עצמו, שמספר תמיד על חייו", "ar": "المؤلف نفسه، يروي دائمًا عن حياته", "ru": "Сам автор, всегда пишущий о своей жизни", "en": "The author himself, always telling about his life"}, {"he": "דמות שמופיעה רק בדיאלוגים", "ar": "شخصية تظهر في الحوار فقط", "ru": "Персонаж, который есть только в диалогах", "en": "A character who appears only in dialogue"}],0,{"he": "שימו לב לכינוי הגוף שבו המספר משתמש.", "ar": "انتبهوا إلى الضمير الذي يستعمله الراوي.", "ru": "Обратите внимание на местоимение рассказчика.", "en": "Notice which pronoun the narrator uses."},{"he": "מספר בגוף ראשון הוא דמות בתוך הסיפור. הוא מספר על עצמו ועל מה שראה. הוא אינו בהכרח המחבר.", "ar": "الراوي بضمير المتكلم شخصية داخل القصة. يروي عن نفسه وعمّا رآه. وليس بالضرورة هو المؤلف.", "ru": "Рассказчик от первого лица — персонаж внутри истории. Он говорит о себе и о том, что видел. Это не обязательно автор.", "en": "A first-person narrator is a character inside the story. He tells about himself and what he saw. He is not necessarily the author."},null,[null, {"he": "כך מתואר מספר יודע־כול בגוף שלישי, לא מספר בגוף ראשון.", "ar": "هذا وصف الراوي العليم بضمير الغائب، لا الراوي بضمير المتكلم.", "ru": "Это всезнающий рассказчик в третьем лице, а не рассказчик от первого лица.", "en": "That describes an all-knowing third-person narrator, not a first-person one."}, {"he": "המספר הוא דמות בדויה, ואינו בהכרח המחבר האמיתי.", "ar": "الراوي شخصية متخيَّلة، وليس بالضرورة المؤلف الحقيقي.", "ru": "Рассказчик — вымышленный персонаж, не обязательно настоящий автор.", "en": "The narrator is an invented figure, not necessarily the real author."}, {"he": "מספר בגוף ראשון מספר גם מחוץ לדיאלוגים, לאורך כל הסיפור.", "ar": "الراوي بضمير المتكلم يروي خارج الحوار أيضًا، طوال القصة.", "ru": "Рассказчик от первого лица говорит и вне диалогов, во всей истории.", "en": "A first-person narrator speaks outside dialogue too, through the whole story."}]),
  Q("sh-1-02",{"he": "מה מאפיין מספר יודע־כול?", "ar": "ما الذي يميّز الراوي العليم؟", "ru": "Что отличает всезнающего рассказчика?", "en": "What marks an all-knowing (omniscient) narrator?"},[{"he": "הוא יודע רק מה שדמות אחת רואה ושומעת", "ar": "يعرف فقط ما تراه شخصية واحدة وتسمعه", "ru": "Он знает только то, что видит и слышит один герой", "en": "He knows only what one character sees and hears"}, {"he": "הוא יודע מחשבות ורגשות של כמה דמויות", "ar": "يعرف أفكار عدة شخصيات ومشاعرها", "ru": "Он знает мысли и чувства нескольких героев", "en": "He knows the thoughts and feelings of several characters"}, {"he": "הוא תמיד הדמות הראשית ומספר בגוף ראשון לאורך כל העלילה", "ar": "هو دائمًا الشخصية الرئيسية ويروي بضمير المتكلم طوال الأحداث", "ru": "Он всегда главный герой и рассказывает от первого лица весь сюжет", "en": "He is always the main character and speaks as \"I\" through the whole plot"}, {"he": "הוא מתאר רק מה שנראה מבחוץ, כמו מצלמה", "ar": "يصف ما يُرى من الخارج فقط، مثل الكاميرا", "ru": "Он описывает только внешнее, как камера", "en": "He describes only what is seen from outside, like a camera"}],1,{"he": "חשבו על השם: כמה הוא יודע?", "ar": "فكّروا في الاسم: كم يعرف؟", "ru": "Подумайте о названии: сколько он знает?", "en": "Think about the name: how much does he know?"},{"he": "מספר יודע־כול עומד מחוץ לעלילה. הוא יכול להיכנס לראש של כמה דמויות. לכן הקורא יודע יותר מכל דמות לבד.", "ar": "الراوي العليم يقف خارج الأحداث. يستطيع الدخول إلى أذهان عدة شخصيات. لذلك يعرف القارئ أكثر من أي شخصية وحدها.", "ru": "Всезнающий рассказчик стоит вне сюжета. Он может войти в мысли нескольких героев. Поэтому читатель знает больше любого героя.", "en": "An omniscient narrator stands outside the plot. He can enter the minds of several characters. So the reader knows more than any one character."},null,[{"he": "זה מספר מוגבל, שצמוד לדמות אחת בלבד.", "ar": "هذا راوٍ محدود يلتصق بشخصية واحدة فقط.", "ru": "Это ограниченный рассказчик, привязанный к одному герою.", "en": "That is a limited narrator, tied to one character only."}, null, {"he": "מספר יודע־כול נמצא בדרך כלל מחוץ לעלילה ומספר בגוף שלישי.", "ar": "الراوي العليم يكون عادة خارج الأحداث ويروي بضمير الغائب.", "ru": "Всезнающий рассказчик обычно вне сюжета и говорит в третьем лице.", "en": "An omniscient narrator is usually outside the plot and uses third person."}, {"he": "מספר שרואה רק מבחוץ אינו נכנס למחשבות, ולכן אינו יודע־כול.", "ar": "الراوي الذي يرى من الخارج فقط لا يدخل إلى الأفكار، فليس عليمًا.", "ru": "Рассказчик, видящий только внешнее, не знает мыслей — он не всезнающий.", "en": "A narrator who sees only the outside cannot read thoughts, so is not omniscient."}]),
  Q("sh-1-03",{"he": "מהו אפיון עקיף של דמות?", "ar": "ما التوصيف غير المباشر للشخصية؟", "ru": "Что такое косвенная характеристика героя?", "en": "What is indirect characterization?"},[{"he": "המספר כותב במפורש בתחילת הסיפור: \"הוא היה אדם נדיב\"", "ar": "يكتب الراوي صراحةً في بداية القصة: \"كان رجلاً كريمًا\"", "ru": "Рассказчик прямо пишет в начале: «он был щедрым человеком»", "en": "At the start the narrator states outright: \"he was a truly generous man\""}, {"he": "תיאור המקום והזמן שבהם הסיפור מתרחש", "ar": "وصف المكان والزمان اللذين تجري فيهما القصة", "ru": "Описание места и времени действия", "en": "A description of the place and time of the story"}, {"he": "הקורא לומד על הדמות ממעשיה ומדבריה", "ar": "يتعرّف القارئ على الشخصية من أفعالها وكلامها", "ru": "Читатель узнаёт героя по его делам и словам", "en": "The reader learns about the character from actions and words"}, {"he": "רשימת הדמויות בתחילת הסיפור", "ar": "قائمة الشخصيات في بداية القصة", "ru": "Список героев в начале рассказа", "en": "The list of characters at the start"}],2,{"he": "איך מכירים אדם בלי שמישהו יגיד לנו מי הוא?", "ar": "كيف نعرف شخصًا دون أن يخبرنا أحد من هو؟", "ru": "Как узнать человека, если о нём ничего не сказали?", "en": "How do we get to know someone nobody describes to us?"},{"he": "באפיון עקיף המספר אינו קובע מה הדמות. הקורא מסיק זאת ממה שהיא עושה ואומרת. בעזרת מעשים ודיבור הקורא מגיע למסקנה בעצמו.", "ar": "في التوصيف غير المباشر لا يحدّد الراوي صفات الشخصية. يستنتجها القارئ مما تفعله وتقوله. فيصل القارئ إلى الاستنتاج بنفسه.", "ru": "При косвенной характеристике рассказчик не называет черты героя. Читатель выводит их из поступков и слов. Он приходит к выводу сам.", "en": "In indirect characterization the narrator does not name the traits. The reader infers them from what the character does and says. The reader reaches the conclusion alone."},null,[{"he": "זה אפיון ישיר, כי המספר אומר את התכונה במפורש.", "ar": "هذا توصيف مباشر، لأن الراوي يذكر الصفة صراحةً.", "ru": "Это прямая характеристика: рассказчик прямо называет черту.", "en": "That is direct characterization, because the trait is stated outright."}, {"he": "זמן ומקום הם רקע הסיפור, לא אפיון של דמות.", "ar": "الزمان والمكان خلفية القصة، لا توصيف للشخصية.", "ru": "Время и место — фон рассказа, а не характеристика героя.", "en": "Time and place are the setting, not characterization."}, null, {"he": "רשימת שמות אינה מלמדת על אופי הדמויות.", "ar": "قائمة الأسماء لا تكشف طباع الشخصيات.", "ru": "Список имён ничего не говорит о характере.", "en": "A list of names reveals nothing about personality."}]),
  Q("sh-1-04",{"he": "מהו סמל בסיפור?", "ar": "ما الرمز في القصة؟", "ru": "Что такое символ в рассказе?", "en": "What is a symbol in a story?"},[{"he": "מילה קשה שצריך לחפש במילון", "ar": "كلمة صعبة يجب البحث عنها في المعجم", "ru": "Трудное слово, которое ищут в словаре", "en": "A hard word you must look up"}, {"he": "המשפט הראשון של הסיפור", "ar": "الجملة الأولى في القصة", "ru": "Первое предложение рассказа", "en": "The first sentence of the story"}, {"he": "דמות שמספרת את הסיפור בגוף שלישי לאורך כל העלילה", "ar": "شخصية تروي القصة بضمير الغائب طوال الأحداث", "ru": "Персонаж, который ведёт рассказ в третьем лице весь сюжет", "en": "A character who tells the story in third person throughout"}, {"he": "חפץ או פרט שמייצג רעיון רחב יותר", "ar": "شيء أو تفصيل يمثّل فكرة أوسع", "ru": "Предмет или деталь, обозначающие более широкую идею", "en": "An object or detail that stands for a wider idea"}],3,{"he": "חשבו על יונה ועלה זית: מה הם מביעים מעבר לעצמם?", "ar": "فكّروا في الحمامة وغصن الزيتون: ماذا يعبّران أبعد من نفسيهما؟", "ru": "Вспомните голубя с оливковой ветвью: что они выражают помимо себя?", "en": "Think of a dove with an olive branch: what do they express beyond themselves?"},{"he": "סמל הוא דבר מוחשי שיש לו גם משמעות נוספת. למשל, דלת נעולה יכולה לייצג בדידות. הקורא מגלה את המשמעות מתוך ההקשר.", "ar": "الرمز شيء ملموس له معنى إضافي. مثلًا، قد يمثّل باب مغلق الوحدة. يكتشف القارئ المعنى من السياق.", "ru": "Символ — конкретная вещь с дополнительным смыслом. Например, запертая дверь может означать одиночество. Смысл читатель находит из контекста.", "en": "A symbol is a concrete thing with an extra meaning. For example, a locked door can stand for loneliness. The reader finds the meaning from context."},null,[{"he": "מילה קשה היא בעיה של אוצר מילים, לא סמל.", "ar": "الكلمة الصعبة مسألة مفردات، لا رمز.", "ru": "Трудное слово — вопрос словаря, а не символ.", "en": "A hard word is a vocabulary issue, not a symbol."}, {"he": "המשפט הראשון הוא פתיחה, ואין לו בהכרח משמעות סמלית.", "ar": "الجملة الأولى افتتاحية، وليس لها بالضرورة معنى رمزي.", "ru": "Первое предложение — это начало, оно не обязательно символ.", "en": "The first sentence is an opening, not necessarily symbolic."}, {"he": "כך מתואר מספר, לא סמל.", "ar": "هذا وصف للراوي، لا للرمز.", "ru": "Так описывают рассказчика, а не символ.", "en": "That describes a narrator, not a symbol."}, null]),
  Q("sh-1-05",{"he": "מהי אירוניה של מצב?", "ar": "ما مفارقة الموقف (السخرية الموقفية)؟", "ru": "Что такое ирония ситуации?", "en": "What is situational irony?"},[{"he": "תוצאה הפוכה ממה שציפו לה", "ar": "نتيجة معاكسة لما كان متوقَّعًا", "ru": "Результат, противоположный ожидаемому", "en": "An outcome opposite to what was expected"}, {"he": "מצב שבו כל הדמויות מסכימות זו עם זו", "ar": "موقف تتفق فيه جميع الشخصيات بعضها مع بعض", "ru": "Ситуация, в которой все герои согласны друг с другом", "en": "A situation where all characters agree with each other"}, {"he": "תיאור ארוך ומפורט של נוף שקט בתחילת הסיפור", "ar": "وصف طويل ومفصّل لمنظر هادئ في بداية القصة", "ru": "Длинное подробное описание тихого пейзажа в начале", "en": "A long, detailed description of a calm landscape at the start"}, {"he": "חזרה של אותה מילה כמה פעמים", "ar": "تكرار الكلمة نفسها عدة مرات", "ru": "Повтор одного слова несколько раз", "en": "Repeating the same word several times"}],0,{"he": "חשבו על כבאי שביתו נשרף.", "ar": "فكّروا في رجل إطفاء احترق بيته.", "ru": "Вспомните пожарного, у которого сгорел дом.", "en": "Think of a firefighter whose own house burns down."},{"he": "באירוניה של מצב יש פער בין הצפוי לבין מה שקורה. הפער מפתיע ולפעמים מצחיק או כואב. הוא מזמין את הקורא לחשוב על המשמעות.", "ar": "في مفارقة الموقف فجوة بين المتوقَّع وما يحدث. الفجوة مفاجئة، وأحيانًا مضحكة أو مؤلمة. وتدعو القارئ إلى التفكير في المعنى.", "ru": "В иронии ситуации есть разрыв между ожидаемым и случившимся. Он удивляет, иногда смешит или ранит. Это заставляет читателя думать о смысле.", "en": "Situational irony is a gap between what is expected and what happens. It surprises, sometimes amuses or hurts. It invites the reader to think about meaning."},null,[null, {"he": "הסכמה בין דמויות אינה יוצרת פער בין ציפייה לתוצאה.", "ar": "اتفاق الشخصيات لا يخلق فجوة بين التوقع والنتيجة.", "ru": "Согласие героев не создаёт разрыва между ожиданием и итогом.", "en": "Agreement between characters creates no gap between expectation and result."}, {"he": "תיאור נוף הוא רקע, ואין בו היפוך של ציפייה.", "ar": "وصف المنظر خلفية، ولا قلب فيه للتوقع.", "ru": "Описание пейзажа — фон, в нём нет переворота ожиданий.", "en": "A landscape description is setting, with no reversal of expectation."}, {"he": "חזרה על מילה היא אמצעי לשוני אחר, לא אירוניה.", "ar": "تكرار الكلمة أسلوب لغوي آخر، لا مفارقة.", "ru": "Повтор слова — другой приём, а не ирония.", "en": "Repetition is a different device, not irony."}]),
  Q("sh-1-06",{"he": "מהי חזרה לעבר (פלאשבק) בסיפור?", "ar": "ما الاسترجاع (العودة إلى الماضي) في القصة؟", "ru": "Что такое ретроспекция (флешбэк) в рассказе?", "en": "What is a flashback in a story?"},[{"he": "רמז לאירוע שיקרה בהמשך", "ar": "تلميح إلى حدث سيقع لاحقًا", "ru": "Намёк на событие, которое случится позже", "en": "A hint at an event that will happen later"}, {"he": "קטע שמחזיר את העלילה לאירוע מוקדם", "ar": "مقطع يعيد الأحداث إلى حدث سابق", "ru": "Эпизод, возвращающий сюжет к прошлому событию", "en": "A passage that takes the plot back to an earlier event"}, {"he": "המשפט האחרון של הסיפור", "ar": "الجملة الأخيرة في القصة", "ru": "Последнее предложение рассказа", "en": "The last sentence of the story"}, {"he": "קטע שבו העלילה עוצרת והמספר מתאר נוף ארוך", "ar": "مقطع تتوقف فيه الأحداث ويصف الراوي منظرًا طويلًا", "ru": "Эпизод, где сюжет стоит, а рассказчик долго описывает пейзаж", "en": "A passage where the plot stops for a long landscape description"}],1,{"he": "חשבו על כיוון התנועה בזמן.", "ar": "فكّروا في اتجاه الحركة في الزمن.", "ru": "Подумайте о направлении движения во времени.", "en": "Think about which direction time moves."},{"he": "בחזרה לעבר הסיפור קופץ לאירוע שקרה קודם. כך הקורא מבין סיבות ורקע. אחר כך הסיפור חוזר להווה.", "ar": "في الاسترجاع تقفز القصة إلى حدث وقع سابقًا. هكذا يفهم القارئ الأسباب والخلفية. ثم تعود القصة إلى الحاضر.", "ru": "При ретроспекции рассказ переходит к прошлому событию. Так читатель понимает причины и фон. Потом рассказ возвращается в настоящее.", "en": "In a flashback the story jumps to an earlier event. This helps the reader understand causes and background. Then the story returns to the present."},null,[{"he": "רמז לעתיד נקרא הקדמה או רמיזה מקדימה, לא חזרה לעבר.", "ar": "التلميح إلى المستقبل استباق، لا استرجاع.", "ru": "Намёк на будущее — это предвосхищение, а не ретроспекция.", "en": "A hint at the future is foreshadowing, not a flashback."}, null, {"he": "סוף הסיפור אינו חוזר בהכרח לזמן מוקדם.", "ar": "نهاية القصة لا تعود بالضرورة إلى زمن سابق.", "ru": "Конец рассказа не обязательно возвращает в прошлое.", "en": "The ending does not necessarily go back in time."}, {"he": "עצירה לתיאור היא האטה של הזמן, לא קפיצה לעבר.", "ar": "التوقف للوصف إبطاء للزمن، لا قفز إلى الماضي.", "ru": "Остановка для описания замедляет время, а не переносит в прошлое.", "en": "Pausing to describe slows time; it does not jump back."}])],
 [
  Q("lit-shift",{"he": "בתחילת הסיפור רחוב מתואר בטוח; בסופו אותה דמות חוששת לעבור בו. מה כדאי לבדוק?", "ar": "في البداية يبدو الشارع آمنًا، وفي النهاية تخاف الشخصية عبوره. ماذا نفحص؟", "ru": "Сначала улица кажется безопасной, а в конце герой боится её перейти. Что стоит проверить?", "en": "At first a street feels safe; at the end the same character fears crossing it. What should we examine?"},[{"he": "מה קרה לדמות בין שני התיאורים", "ar": "ما الذي جرى للشخصية بين الوصفين", "ru": "Что произошло с героем между описаниями", "en": "What happened to the character between descriptions"},{"he": "רק את מספר המילים בכל פסקה", "ar": "عدد الكلمات في كل فقرة فقط", "ru": "Только число слов в абзацах", "en": "Only the word count of each paragraph"},{"he": "איזה תיאור ארוך יותר", "ar": "أي الوصفين أطول", "ru": "Какое описание длиннее", "en": "Which description is longer"},{"he": "אם הרחוב קיים במציאות", "ar": "هل يوجد الشارع في الواقع", "ru": "Существует ли улица на самом деле", "en": "Whether the street exists in real life"}],0,{"he": "השוו את נקודת המבט לפני ואחרי האירועים.", "ar": "قارنوا وجهة النظر قبل الأحداث وبعدها.", "ru": "Сравните взгляд до и после событий.", "en": "Compare viewpoint before and after events."},{"he": "שינוי בתיאור אותו מקום עשוי לשקף שינוי בתחושת הדמות; האירועים שביניהם מספקים ראיה.", "ar": "قد يعكس تغيّر وصف المكان نفسه تغيّر شعور الشخصية؛ والأحداث بينهما تقدّم دليلاً.", "ru": "Перемена описания одного места может отражать перемену чувств героя; промежуточные события дают основание.", "en": "A changed view of the same place may reflect a change in the character; intervening events provide evidence."},null,[null,{"he": "אורך הפסקה אינו מסביר את שינוי התחושה.", "ar": "طول الفقرة لا يفسّر تغيّر الشعور.", "ru": "Длина абзаца не объясняет смену чувства.", "en": "Paragraph length does not explain the shift."},{"he": "אורך התיאור אינו מצביע על סיבה.", "ar": "طول الوصف لا يبيّن السبب.", "ru": "Длина описания не указывает причину.", "en": "Description length does not identify a cause."},{"he": "קיום המקום אינו הכרחי להבנת נקודת המבט.", "ar": "وجود المكان الحقيقي غير لازم لفهم وجهة النظر.", "ru": "Реальность места не нужна для анализа взгляда.", "en": "The place need not be real to analyse viewpoint."}])
 ,Q("lit-evid-quote",{"he": "תלמידה טוענת שדמות מתביישת. איזה ציטוט מהסיפור יחזק את הטענה ביותר?", "ar": "تدّعي طالبة أن إحدى الشخصيات تشعر بالخجل. أي اقتباس من القصة يدعم الادعاء أكثر؟", "ru": "Ученица утверждает, что героиня смущается. Какая цитата из рассказа лучше всего подкрепит это?", "en": "A student claims a character is embarrassed. Which quote from the story best supports the claim?"},[{"he": "\"אכלנו ארוחת בוקר בשקט הרגיל של כל בוקר ביום חול\"", "ar": "«تناولنا فطورنا الصباحي بهدوء معتاد ككل صباح من أيام الأسبوع»", "ru": "«Мы позавтракали в обычной утренней тишине, как в любой будний день»", "en": "\"We had breakfast in the usual quiet of a weekday morning\""},{"he": "\"הבהיקה והסתירה את פניה מאחורי הספר\"", "ar": "«احمرّت وأخفت وجهها خلف الكتاب»", "ru": "«Она покраснела и спрятала лицо за книгой»", "en": "\"She blushed and hid her face behind the book\""},{"he": "\"השיעור התחיל בשמונה בבוקר\"", "ar": "«بدأ الدرس في الثامنة صباحًا»", "ru": "«Урок начался в восемь утра»", "en": "\"The lesson started at eight in the morning\""},{"he": "\"הכיתה הייתה גדולה ומוארת\"", "ar": "«كان الصف واسعًا ومضيئًا»", "ru": "«Класс был большой и светлый»", "en": "\"The classroom was big and bright\""}],1,{"he": "חפשו משפט שבו הגוף מסגיר את הרגש.", "ar": "ابحثوا عن جملة يكشف فيها الجسد الشعور.", "ru": "Ищите фразу, где тело выдаёт чувство.", "en": "Look for a sentence where the body gives away the feeling."},{"he": "ראיה טובה קשורה ישירות לטענה. למשל סימנים גופניים של בושה, כמו הסתרת פנים, תומכים בטענה טוב יותר מפרטי רקע.", "ar": "الدليل الجيد مرتبط مباشرة بالادعاء. مثال: علامات الخجل الجسدية كإخفاء الوجه تدعم الادعاء أكثر من تفاصيل الخلفية.", "ru": "Хорошее доказательство напрямую связано с тезисом. Например, телесные признаки смущения, как спрятанное лицо, подкрепляют лучше, чем детали фона.", "en": "Good evidence ties directly to the claim. For example, bodily signs of embarrassment, like hiding the face, support it better than background details."},null,[{"he": "ארוחת בוקר רגילה אינה מראה בושה.", "ar": "فطور عادي لا يُظهر خجلًا.", "ru": "Обычный завтрак не показывает смущения.", "en": "An ordinary breakfast shows no embarrassment."},null,{"he": "שעת השיעור היא פרט רקע ולא ראיה לרגש.", "ar": "وقت الدرس تفصيل خلفية وليس دليلًا على شعور.", "ru": "Время урока — фон, а не доказательство чувства.", "en": "The lesson time is background, not evidence of feeling."},{"he": "גודל הכיתה אינו קשור לרגשות הדמות.", "ar": "حجم الصف لا يتعلق بمشاعر الشخصية.", "ru": "Размер класса не связан с чувствами героини.", "en": "The room size is unrelated to the character's feelings."}]),Q("lit-sea-shift",{"he": "בתחילת סיפור הים מתואר כשקט ומזמין; בסופו, אחרי שהסירה טבעה, אותו ים מתואר כ\"שחור וסוער\". מה השינוי בתיאור עושה?", "ar": "في بداية قصة يوصف البحر بأنه هادئ وجذاب، وفي نهايتها، بعد غرق القارب، يوصف البحر نفسه بأنه «أسود وهائج». ماذا يفعل هذا التغيير في الوصف؟", "ru": "В начале рассказа море спокойное и манящее, а в конце, после гибели лодки, то же море «чёрное и бурное». Что даёт это изменение в описании?", "en": "At a story's start the sea is calm and inviting; at the end, after the boat sank, the same sea is \"black and stormy.\" What does this change in description do?"},[{"he": "מראה שהסופר התבלבל בין שני ימים שונים בעת כתיבת הסיפור", "ar": "يُظهر أن الكاتب خلط بين بحرين مختلفين تمامًا أثناء كتابة القصة", "ru": "Показывает, что автор перепутал два разных моря, когда писал рассказ", "en": "Shows the author confused two different seas while writing the story down"},{"he": "מוכיח שהסיפור התרחש במדינה אחרת", "ar": "يثبت أن القصة وقعت في بلد آخر", "ru": "Доказывает, что действие было в другой стране", "en": "Proves the story happened in another country"},{"he": "מחזק את התחושה שהעולם השתנה בעיני הדמות", "ar": "يعزّز الإحساس بأن العالم تغيّر في عيني الشخصية", "ru": "Усиливает ощущение, что мир изменился в глазах героя", "en": "Strengthens the sense that the world changed in the character's eyes"},{"he": "אומר שהים הוא הדמות הראשית בסיפור", "ar": "يعني أن البحر هو الشخصية الرئيسة", "ru": "Значит, море — главный герой рассказа", "en": "Means the sea is the story's main character"}],2,{"he": "חשבו מה השתנה בעיני מי שמסתכל על הים.", "ar": "فكروا بما تغيّر في عيني مَن ينظر إلى البحر.", "ru": "Подумайте, что изменилось в глазах смотрящего на море.", "en": "Think about what changed in the eyes of the one looking at the sea."},{"he": "תיאור הסביבה משקף את מצב הדמות. למשל ים שהיה מזמין נראה מאיים אחרי אובדן, והשינוי משרת את משמעות הסיפור.", "ar": "وصف البيئة يعكس حال الشخصية. مثال: بحر كان جذابًا يصبح مهدّدًا بعد فقدان، وهذا التغيير يخدم معنى القصة.", "ru": "Описание природы отражает состояние героя. Например, море, бывшее манящим, после потери кажется угрожающим, и это служит смыслу рассказа.", "en": "The setting mirrors the character's state. For example, a sea that was inviting looks threatening after a loss, and the change serves the story's meaning."},null,[{"he": "אין בטקסט שני ימים; זהו אותו ים במבט אחר.", "ar": "لا يوجد بحران في النصّ، بل البحر نفسه بنظرة مختلفة.", "ru": "В тексте нет двух морей; это то же море в другом взгляде.", "en": "There are not two seas; it is the same sea seen differently."},{"he": "שום פרט לא מעביר את הסיפור למדינה אחרת.", "ar": "لا تفصيل ينقل القصة إلى بلد آخر.", "ru": "Ни одна деталь не переносит действие в другую страну.", "en": "No detail moves the story to another country."},null,{"he": "השינוי עוסק בנקודת מבט של אדם, לא בים עצמו.", "ar": "التغيير يخص وجهة نظر الإنسان لا البحر نفسه.", "ru": "Изменение касается точки зрения человека, а не самого моря.", "en": "The change is about a person's viewpoint, not the sea itself."}]),
  Q("sh-2-01",{"he": "בסיפור מקורי: \"היא חשבה שהוא כועס. הוא, מצדו, רק היה עייף ולא ידע מה לומר.\" איזה מספר יש כאן?", "ar": "في قصة أصلية: \"ظنّت أنه غاضب. أما هو فكان متعبًا فقط ولم يعرف ماذا يقول.\" أيّ راوٍ هنا؟", "ru": "В оригинальном рассказе: «Она думала, что он злится. А он просто устал и не знал, что сказать». Какой здесь рассказчик?", "en": "In an original story: \"She thought he was angry. He, for his part, was only tired and didn't know what to say.\" What narrator is this?"},[{"he": "מספר בגוף ראשון שהוא אחת הדמויות", "ar": "راوٍ بضمير المتكلم هو إحدى الشخصيات", "ru": "Рассказчик от первого лица, один из героев", "en": "A first-person narrator who is one of the characters"}, {"he": "מספר שרואה רק מבחוץ ואינו יודע מה מישהו חושב או מרגיש", "ar": "راوٍ يرى من الخارج فقط ولا يعرف ما يفكر فيه أحد أو يشعر به", "ru": "Рассказчик, видящий лишь внешнее и не знающий ничьих мыслей и чувств", "en": "A narrator who sees only the outside and knows no one's thoughts or feelings"}, {"he": "מספר יודע־כול, שנכנס לראש של שניהם", "ar": "راوٍ عليم يدخل إلى ذهن الاثنين", "ru": "Всезнающий рассказчик, знающий мысли обоих", "en": "An omniscient narrator who enters both their minds"}, {"he": "אין מספר, כי זה דיאלוג", "ar": "لا يوجد راوٍ لأن هذا حوار", "ru": "Рассказчика нет, это диалог", "en": "There is no narrator; this is dialogue"}],2,{"he": "בדקו מחשבות של מי נחשפות במשפט.", "ar": "افحصوا أفكار مَن تنكشف في الجملة.", "ru": "Проверьте, чьи мысли раскрыты в отрывке.", "en": "Check whose inner thoughts are revealed."},{"he": "המספר יודע מה היא חושבת וגם מה הוא מרגיש באמת. רק מספר יודע־כול רואה את שני הצדדים. כך הקורא מבין את אי ההבנה ביניהם.", "ar": "يعرف الراوي ما تفكر فيه وما يشعر به هو حقًا. وحده الراوي العليم يرى الجانبين. هكذا يفهم القارئ سوء التفاهم بينهما.", "ru": "Рассказчик знает её мысли и его настоящие чувства. Только всезнающий видит обе стороны. Так читатель понимает их недоразумение.", "en": "The narrator knows her thoughts and his real feelings. Only an omniscient narrator sees both sides. So the reader grasps their misunderstanding."},null,[{"he": "אין כאן \"אני\"; המספר מדבר על \"היא\" ו\"הוא\".", "ar": "لا يوجد \"أنا\" هنا؛ الراوي يتحدث عن \"هي\" و\"هو\".", "ru": "Здесь нет «я»: рассказчик говорит «она» и «он».", "en": "There is no \"I\"; the narrator speaks of \"she\" and \"he\"."}, {"he": "המספר כן יודע מה היא חושבת ומה הוא מרגיש.", "ar": "الراوي يعرف فعلًا ما تفكر فيه وما يشعر به.", "ru": "Рассказчик как раз знает её мысли и его чувства.", "en": "The narrator does know her thoughts and his feelings."}, null, {"he": "אין כאן מירכאות של דיבור; זה תיאור של מספר.", "ar": "لا توجد علامات كلام هنا؛ هذا وصف من الراوي.", "ru": "Здесь нет прямой речи; это слова рассказчика.", "en": "There are no speech marks; this is narration."}]),
  Q("sh-2-02",{"he": "בסיפור מקורי: \"הכול היה ענק: השולחן, הכיסאות, הידיים של המורה.\" דרך עיני מי כנראה מוצג המקום?", "ar": "في قصة أصلية: \"كان كل شيء ضخمًا: الطاولة والكراسي ويدا المعلمة.\" من خلال عينَي مَن يُعرض المكان على الأرجح؟", "ru": "В оригинальном рассказе: «Всё было огромным: стол, стулья, руки учительницы». Чьими глазами, вероятно, показано место?", "en": "In an original story: \"Everything was huge: the table, the chairs, the teacher's hands.\" Through whose eyes is the place probably shown?"},[{"he": "דרך עיני המורה, שמכירה היטב כל פינה בכיתה", "ar": "من خلال عينَي المعلمة التي تعرف كل زاوية في الصف", "ru": "Глазами учительницы, которая знает каждый угол класса", "en": "Through the teacher's eyes, who knows every corner of the room"}, {"he": "דרך עיני נגר שבנה את הרהיטים", "ar": "من خلال عينَي نجّار صنع الأثاث", "ru": "Глазами плотника, сделавшего мебель", "en": "Through the eyes of a carpenter who built the furniture"}, {"he": "דרך עיני מספר שאינו רואה דבר", "ar": "من خلال عينَي راوٍ لا يرى شيئًا", "ru": "Глазами рассказчика, который ничего не видит", "en": "Through a narrator who sees nothing"}, {"he": "דרך עיניו של ילד קטן", "ar": "من خلال عينَي طفل صغير", "ru": "Глазами маленького ребёнка", "en": "Through a small child's eyes"}],3,{"he": "למי חפצים רגילים נראים גדולים מאוד?", "ar": "لِمَن تبدو الأشياء العادية كبيرة جدًا؟", "ru": "Кому обычные вещи кажутся очень большими?", "en": "To whom do ordinary objects look very big?"},{"he": "התיאור מסנן את המקום דרך נקודת מבט מסוימת. לילד קטן רהיטים וידיים של מבוגר נראים ענקיים. זהו מיקוד (פוקליזציה) דרך דמות.", "ar": "يعرض الوصف المكان عبر وجهة نظر محددة. يبدو الأثاث ويدا الكبار ضخمة لطفل صغير. هذا تبئير عبر شخصية.", "ru": "Описание пропускает место через определённый взгляд. Маленькому ребёнку мебель и руки взрослого кажутся огромными. Это фокализация через героя.", "en": "The description filters the place through a point of view. To a small child, furniture and adult hands look huge. This is focalizati
