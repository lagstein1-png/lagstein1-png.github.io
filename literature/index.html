  Q("dr-2-05",{"he": "במחזה מקורי. א: \"הקפה טעים?\" ב: \"יש לי הרבה עבודה היום.\" מה אפשר להבין מהתשובה של ב'?", "ar": "في مسرحية أصلية. أ: \"هل القهوة لذيذة؟\" ب: \"عندي عمل كثير اليوم.\" ماذا نفهم من جواب ب؟", "ru": "В оригинальной пьесе. А: «Кофе вкусный?» Б: «У меня сегодня много работы». Что можно понять из ответа Б?", "en": "In an original play. A: \"Is the coffee good?\" B: \"I have a lot of work today.\" What can we understand from B's answer?"},[{"he": "ב' עונה בבירור שהקפה טעים מאוד ושהוא נהנה לשתות אותו", "ar": "يجيب ب بوضوح أن القهوة لذيذة جدًا وأنه يستمتع بشربها", "ru": "Б ясно отвечает, что кофе очень вкусный и пить его приятно", "en": "B clearly answers that the coffee is very good and he enjoys it"}, {"he": "יש טעות בהדפסת המחזה", "ar": "يوجد خطأ في طباعة المسرحية", "ru": "В тексте пьесы опечатка", "en": "There is a misprint in the script"}, {"he": "ב' מתחמק, ואולי אינו רוצה לדבר", "ar": "ب يتهرّب، وربما لا يريد الكلام", "ru": "Б уклоняется и, может быть, не хочет говорить", "en": "B is avoiding the question and may not want to talk"}, {"he": "ב' מדבר אל הקהל, לא אל א'", "ar": "ب يتحدث إلى الجمهور، لا إلى أ", "ru": "Б говорит залу, а не А", "en": "B is speaking to the audience, not to A"}],2,{"he": "האם התשובה עונה על השאלה שנשאלה?", "ar": "هل الجواب يجيب عن السؤال الذي طُرح؟", "ru": "Отвечает ли ответ на заданный вопрос?", "en": "Does the answer fit the question that was asked?"},{"he": "התשובה אינה קשורה לשאלה. בדיאלוג דרמטי, תשובה כזאת רומזת על מה שלא נאמר. זה נקרא תת־טקסט.", "ar": "الجواب لا يرتبط بالسؤال. في الحوار الدرامي يلمّح مثل هذا الجواب إلى ما لم يُقل. يُسمّى هذا النص الضمني.", "ru": "Ответ не связан с вопросом. В драме такой ответ намекает на несказанное. Это называют подтекстом.", "en": "The answer does not match the question. In drama, such a reply hints at what is unsaid. This is called subtext."},null,[{"he": "ב' כלל לא מדבר על הקפה.", "ar": "ب لا يتحدث عن القهوة أصلًا.", "ru": "Б вообще не говорит о кофе.", "en": "B does not mention the coffee at all."}, {"he": "תשובה עקיפה היא בחירה של המחזאי, לא טעות.", "ar": "الجواب غير المباشر اختيار من الكاتب، لا خطأ.", "ru": "Уклончивый ответ — выбор драматурга, не ошибка.", "en": "An indirect reply is the playwright's choice, not an error."}, null, {"he": "ב' עונה לשאלה של א', ולכן הוא פונה אליו.", "ar": "ب يردّ على سؤال أ، فهو يتوجّه إليه.", "ru": "Б отвечает на вопрос А, значит, обращается к нему.", "en": "B replies to A's question, so he is addressing A."}]),
  Q("dr-2-06",{"he": "עיקרון מפורסם שמיוחס לצ'כוב: אם תלוי רובה על הקיר במערכה הראשונה, הוא צריך לירות בהמשך. מה העיקרון אומר?", "ar": "مبدأ مشهور يُنسب إلى تشيخوف: إذا عُلّقت بندقية على الجدار في الفصل الأول، فيجب أن تُطلق لاحقًا. ماذا يقول المبدأ؟", "ru": "Известный принцип, приписываемый Чехову: если в первом акте на стене висит ружьё, оно должно выстрелить. О чём этот принцип?", "en": "A famous principle attributed to Chekhov: if a gun hangs on the wall in Act One, it must fire later. What does it say?"},[{"he": "כל מחזה חייב לכלול נשק", "ar": "يجب أن تتضمّن كل مسرحية سلاحًا", "ru": "В каждой пьесе должно быть оружие", "en": "Every play must include a weapon"}, {"he": "אסור להציג אלימות על הבמה", "ar": "يُمنع عرض العنف على الخشبة", "ru": "На сцене нельзя показывать насилие", "en": "Violence must not be shown on stage"}, {"he": "התפאורה צריכה להיות מלאה בחפצים כדי שתיראה אמיתית", "ar": "يجب أن يمتلئ الديكور بالأغراض كي يبدو حقيقيًا", "ru": "Декорации должны быть полны вещей, чтобы выглядеть правдиво", "en": "The set should be full of many objects so that it looks real"}, {"he": "פרט שמוצג צריך לשמש את העלילה בהמשך", "ar": "التفصيل المعروض يجب أن يخدم الحبكة لاحقًا", "ru": "Показанная деталь должна потом сработать в сюжете", "en": "A detail that is shown should serve the plot later"}],3,{"he": "הרובה הוא רק דוגמה. למה הוא דוגמה?", "ar": "البندقية مجرد مثال. مثال على ماذا؟", "ru": "Ружьё — только пример. Пример чего?", "en": "The gun is just an example. Of what?"},{"he": "העיקרון עוסק בחיסכון: אין להציג פרטים מיותרים. מה שהקהל רואה צריך להיות חשוב לעלילה. הרובה הוא רק משל.", "ar": "يتعلق المبدأ بالاقتصاد: لا تُعرض تفاصيل زائدة. ما يراه الجمهور يجب أن يكون مهمًا للحبكة. والبندقية مجرد مثل.", "ru": "Принцип об экономии: не показывать лишнего. То, что видит зритель, должно быть важно для сюжета. Ружьё — лишь образ.", "en": "The principle is about economy: show nothing needless. What the audience sees should matter to the plot. The gun is only an image."},null,[{"he": "הרובה הוא דוגמה לפרט כלשהו, לא דרישה לנשק.", "ar": "البندقية مثال على أي تفصيل، لا مطلب لوجود سلاح.", "ru": "Ружьё — пример любой детали, а не требование оружия.", "en": "The gun stands for any detail; it is not a demand for weapons."}, {"he": "העיקרון עוסק בתפקיד של פרטים, לא באיסור על אלימות.", "ar": "المبدأ يتعلق بدور التفاصيل، لا بمنع العنف.", "ru": "Принцип о роли деталей, а не о запрете насилия.", "en": "The principle is about details' role, not a ban on violence."}, {"he": "העיקרון אומר להפך: לא להוסיף פרטים מיותרים.", "ar": "المبدأ يقول العكس: لا تُضف تفاصيل زائدة.", "ru": "Принцип говорит обратное: не добавлять лишних деталей.", "en": "The principle says the opposite: add no needless details."}, null])],
 [
  Q("lit-drama-8281-4",{"he": "איזה תיאור מתאים לאירוניה דרמטית?", "ar": "أي وصف يناسب المفارقة الدرامية؟", "ru": "Какое описание подходит к «Драматическая ирония»?", "en": "Which description fits dramatic irony?"},[{"he": "התנגשות בין רצונות או ערכים שמניעה את הפעולה.", "ar": "تصادم رغبات أو قيم يدفع الأحداث.", "ru": "Столкновение желаний или ценностей движет действием.", "en": "A clash of desires or values that drives the action."},{"he": "הנחיה כתובה לשחקנים על תנועה, הבעה או חלל הבמה.", "ar": "تعليمات مكتوبة للممثلين عن الحركة أو التعبير أو المكان.", "ru": "Указание актёрам о движении, выражении или сценическом пространстве.", "en": "A written instruction about movement, expression or stage space."},{"he": "שיחה בין דמויות שבה כל תגובה יכולה לשנות את היחסים ביניהן.", "ar": "حديث بين شخصيات قد يغيّر فيه كل رد علاقتها.", "ru": "Разговор персонажей, в котором ответы меняют отношения.", "en": "A conversation between characters whose replies can alter their relationship."},{"he": "פער שבו הקהל יודע פרט חשוב שדמות על הבמה אינה יודעת.", "ar": "حالة يعرف فيها الجمهور أمرًا مهمًا تجهله شخصية على الخشبة.", "ru": "Ситуация, в которой зритель знает важное, а персонаж нет.", "en": "A gap where the audience knows something important a character does not."}],3,{"he": "חפשו את הפרט שמבדיל אותו מן האחרים.", "ar": "ابحثوا عن التفصيل الذي يميزه عن غيره.", "ru": "Ищите отличие от остальных вариантов.", "en": "Look for the detail that separates it from the others."},{"he": "הפער בין ידיעת הקהל לידיעת הדמות יוצר את האירוניה.", "ar": "الفرق بين علم الجمهور وعلم الشخصية يصنع المفارقة.", "ru": "Разница между знанием зрителя и героя создаёт иронию.", "en": "The knowledge gap between audience and character creates the irony."},null,[{"he": "זה מתאר את קונפליקט דרמטי, לא את אירוניה דרמטית.", "ar": "هذا يصف الصراع الدرامي، لا المفارقة الدرامية.", "ru": "Это описание «Драматический конфликт», а не «Драматическая ирония».", "en": "That describes dramatic conflict, not dramatic irony."},{"he": "זה מתאר את הוראת במה, לא את אירוניה דרמטית.", "ar": "هذا يصف إرشاد مسرحي، لا المفارقة الدرامية.", "ru": "Это описание «Ремарка», а не «Драматическая ирония».", "en": "That describes stage direction, not dramatic irony."},{"he": "זה מתאר את דיאלוג, לא את אירוניה דרמטית.", "ar": "هذا يصف الحوار، لا المفارقة الدرامية.", "ru": "Это описание «Диалог», а не «Драматическая ирония».", "en": "That describes dialogue, not dramatic irony."},null])
 ,Q("lit-drama-supp",{"he": "איזה תיאור מתאים לדמות משנה?", "ar": "أي وصف يناسب شخصية ثانوية؟", "ru": "Какое описание подходит к второстепенного персонажа?", "en": "Which description fits a supporting character?"},[{"he": "דמות נשארת לבד על הבמה ואומרת בקול את מחשבותיה, כשהקהל שומע ואילו שאר הדמויות לא.", "ar": "تبقى الشخصية وحدها على المسرح وتقول أفكارها بصوت عالٍ، فيسمعها الجمهور دون بقية الشخصيات.", "ru": "Персонаж остаётся один на сцене и произносит свои мысли вслух: зрители слышат, а остальные герои нет.", "en": "A character stays alone on stage and speaks their thoughts aloud; the audience hears, the other characters do not."},{"he": "הרגע שבו המתח מגיע לקצה והדמות הראשית נדרשת להחלטה שאין ממנה חזרה.", "ar": "اللحظة التي يبلغ فيها التوتر أقصاه وتُطالب الشخصية الرئيسة بقرار لا رجوع عنه.", "ru": "Момент, когда напряжение достигает предела и главный герой должен принять решение, назад от которого нет пути.", "en": "The moment the tension peaks and the main character must make a decision with no way back."},{"he": "דמות שאינה במרכז העלילה, אך מעשיה מקדמים את הסיפור או מאירים את הדמות הראשית.", "ar": "شخصية ليست في مركز الحبكة، لكن أفعالها تدفع القصة أو تسلّط الضوء على الشخصية الرئيسة.", "ru": "Персонаж не в центре сюжета, но его поступки двигают историю или оттеняют главного героя.", "en": "A character not at the plot's center whose actions advance the story or highlight the main character."},{"he": "חלק של מחזה המחולק לתמונות, ובמהלכו מתקדמת העלילה או גדל המתח.", "ar": "جزء من المسرحية ينقسم إلى مشاهد، وفي أثنائه تتقدم الحبكة أو يزداد التوتر.", "ru": "Часть пьесы, делящаяся на сцены, в течение которой развивается сюжет или растёт напряжение.", "en": "A part of a play divided into scenes, during which the plot advances or the tension grows."}],2,{"he": "חשבו מי אינו במרכז אך עדיין חשוב.", "ar": "فكروا بمَن ليس في المركز لكنه مهم.", "ru": "Подумайте, кто не в центре, но всё же важен.", "en": "Think of who is not central but still matters."},{"he": "דמות משנה אינה הגיבור אך תורמת לעלילה. למשל שכנה שמוסרת מכתב ומשנה את כיוון הסיפור.", "ar": "الشخصية الثانوية ليست البطل لكنها تسهم في الحبكة. مثال: جارة تسلّم رسالة فتغيّر مجرى القصة.", "ru": "Второстепенный персонаж — не герой, но вносит вклад. Например, соседка, передавшая письмо и изменившая ход истории.", "en": "A supporting character is not the hero but contributes. For example, a neighbor who delivers a letter and changes the story's course."},null,[{"he": "זה מתאר את מונולוג, לא את דמות משנה.", "ar": "هذا يصف المونولوج، لا شخصية ثانوية.", "ru": "Это описание «монолог», а не «второстепенного персонажа».", "en": "That describes monologue, not a supporting character."},{"he": "זה מתאר את השיא, לא את דמות משנה.", "ar": "هذا يصف الذروة، لا شخصية ثانوية.", "ru": "Это описание «кульминацию», а не «второстепенного персонажа».", "en": "That describes the climax, not a supporting character."},null,{"he": "זה מתאר את מערכה, לא את דמות משנה.", "ar": "هذا يصف الفصل المسرحي، لا شخصية ثانوية.", "ru": "Это описание «акт», а не «второстепенного персонажа».", "en": "That describes an act, not a supporting character."}]),Q("lit-drama-ending",{"he": "מחבר מחזה בחר שהדמות היריבה תנצח בסוף. קורא טוען שזו טעות, כי \"הטוב חייב לנצח\". איזו תשובה מתאימה?", "ar": "اختار كاتب مسرحي أن تنتصر الشخصية المنافسة في النهاية. قارئ يدّعي أن هذا خطأ لأن «الخير يجب أن ينتصر». أي ردّ مناسب؟", "ru": "Драматург решил, что в финале победит соперник. Читатель считает это ошибкой: «добро должно победить». Какой ответ уместен?", "en": "A playwright chose to let the rival character win at the end. A reader claims this is wrong because \"good must win.\" Which reply fits?"},[{"he": "המחבר חייב לכתוב סוף טוב לכל מחזה", "ar": "على الكاتب كتابة نهاية سعيدة لكل مسرحية", "ru": "Драматург обязан писать счастливый финал для каждой пьесы", "en": "The playwright must write a happy ending for every play"},{"he": "היריב אינו יכול לנצח במחזה בשום מקרה", "ar": "المنافس لا يمكن أن ينتصر في مسرحية أبدًا", "ru": "Соперник не может победить в пьесе ни в коем случае", "en": "The rival can never win in a play under any circumstances"},{"he": "הבחירה חוקית אם היא נובעת מהעלילה ומשרתת את המסר", "ar": "الاختيار مشروع إذا نبع من الحبكة وخدم الرسالة", "ru": "Выбор правомерен, если он вытекает из сюжета и служит идее", "en": "The choice is valid if it grows from the plot and serves the message"},{"he": "הקהל הוא שמחליט איך מחזה מסתיים", "ar": "الجمهور هو مَن يقرر كيف تنتهي المسرحية", "ru": "Зрители решают, чем кончается пьеса", "en": "The audience decides how a play ends"}],2,{"he": "מה מחייב סופר: כלל חיצוני או הלוגיקה של הסיפור?", "ar": "ما الذي يلزم الكاتب: قاعدة خارجية أم منطق القصة؟", "ru": "Что обязывает автора: внешнее правило или логика истории?", "en": "What binds a writer: an outside rule or the story's logic?"},{"he": "סוף נמדד בנאמנותו לעלילה ולמסר. למשל ניצחון של יריב יכול לחדד ביקורת חברתית שהמחזה בונה לאורכו.", "ar": "تُقاس النهاية بصدقها مع الحبكة والرسالة. مثال: انتصار المنافس قد يشحذ نقدًا اجتماعيًّا تبنيه المسرحية.", "ru": "Финал оценивается верностью сюжету и идее. Например, победа соперника может обострить социальную критику, которую строит пьеса.", "en": "An ending is measured by its loyalty to plot and message. For example, the rival's victory can sharpen social criticism the play builds throughout."},null,[{"he": "אין כלל הקובע סוף טוב; הכלל הוא נאמנות לסיפור.", "ar": "لا قاعدة تفرض نهاية سعيدة، فالقاعدة هي الصدق مع القصة.", "ru": "Нет правила, требующего счастливого конца; правило — верность истории.", "en": "No rule demands a happy ending; the rule is loyalty to the story."},{"he": "דווקא ניצחון של יריב אפשרי ומקובל בדרמה.", "ar": "انتصار المنافس ممكن ومقبول في الدراما.", "ru": "Победа соперника как раз возможна и принята в драме.", "en": "The rival's victory is entirely possible and accepted in drama."},null,{"he": "המחבר קובע את הסוף; הקהל מפרש אותו.", "ar": "الكاتب يحدد النهاية والجمهور يفسّرها.", "ru": "Финал определяет автор; зрители его толкуют.", "en": "The author sets the ending; the audience interprets it."}]),
  Q("dr-3-01",{"he": "ב\"אדיפוס המלך\" של סופוקלס, אדיפוס מתעקש לגלות מי רצח את לאיוס, גם כשמזהירים אותו להפסיק. איך העקשנות קשורה לטרגדיה?", "ar": "في \"أوديب ملكًا\" لسوفوكليس، يصرّ أوديب على كشف قاتل لايوس، حتى حين يحذّرونه من الاستمرار. كيف يرتبط عناده بالمأساة؟", "ru": "В «Царе Эдипе» Софокла Эдип упорно ищет убийцу Лая, даже когда его просят остановиться. Как упрямство связано с трагедией?", "en": "In Sophocles' \"Oedipus the King\", Oedipus insists on finding Laius's killer even when warned to stop. How is his stubbornness tied to the tragedy?"},[{"he": "אותה תכונה שמניעה את החקירה מביאה לחורבנו", "ar": "الصفة نفسها التي تدفع التحقيق تجلب خرابه", "ru": "Та же черта, что движет поиском, ведёт его к гибели", "en": "The same trait that drives his search brings his ruin"}, {"he": "העקשנות אינה קשורה לסוף, כי הכול נקבע בידי האלים ולגיבור אין שום חלק", "ar": "العناد لا علاقة له بالنهاية، لأن الآلهة قرّرت كل شيء وليس للبطل أي دور", "ru": "Упрямство не связано с концом: всё решили боги, и герой ни при чём", "en": "His stubbornness has nothing to do with the end; the gods decided all and he plays no part"}, {"he": "העקשנות מוכיחה שאדיפוס הוא הנבל", "ar": "العناد يثبت أن أوديب هو الشرير", "ru": "Упрямство доказывает, что Эдип — злодей", "en": "His stubbornness proves Oedipus is the villain"}, {"he": "העקשנות מצילה אותו בסוף", "ar": "العناد ينقذه في النهاية", "ru": "Упрямство спасает его в конце", "en": "His stubbornness saves him in the end"}],0,{"he": "מה הייתה התוצאה של החיפוש אחר האמת?", "ar": "ماذا كانت نتيجة البحث عن الحقيقة؟", "ru": "К чему привели поиски правды?", "en": "What did the search for the truth lead to?"},{"he": "אדיפוס רוצה לגלות את האמת כדי להציל את העיר. אבל החקירה מגלה שהוא עצמו הרוצח, וזה מחריב אותו. תכונה טובה הופכת לסיבת הנפילה, וזה לב הטרגדיה.", "ar": "يريد أوديب كشف الحقيقة لينقذ المدينة. لكن التحقيق يكشف أنه هو القاتل، فيدمّره ذلك. صفة حسنة تصبح سبب السقوط، وهذا جوهر المأساة.", "ru": "Эдип ищет правду, чтобы спасти город. Но поиск открывает, что убийца — он сам, и это губит его. Достоинство становится причиной падения — в этом суть трагедии.", "en": "Oedipus seeks the truth to save the city. But the search reveals he is the killer, and this destroys him. A good trait becomes the cause of the fall, the heart of the tragedy."},null,[null, {"he": "גם אם הגורל נקבע, הבחירה של אדיפוס לחקור היא שחושפת את האמת.", "ar": "حتى لو كان القدر مقرّرًا، فاختيار أوديب للتحقيق هو ما يكشف الحقيقة.", "ru": "Даже при заданной судьбе именно выбор Эдипа искать раскрывает правду.", "en": "Even if fate is set, Oedipus's choice to investigate exposes the truth."}, {"he": "אדיפוס מחפש את האמת כדי להציל את העיר, ולא כדי להזיק.", "ar": "يبحث أوديب عن الحقيقة لينقذ المدينة، لا ليؤذي.", "ru": "Эдип ищет правду, чтобы спасти город, а не навредить.", "en": "Oedipus seeks the truth to save the city, not to do harm."}, {"he": "בסוף אדיפוס מעוור את עצמו ומבקש לצאת לגלות; הוא אינו ניצל.", "ar": "في النهاية يفقأ أوديب عينيه ويطلب النفي؛ لا ينجو.", "ru": "В конце Эдип ослепляет себя и просит изгнания — он не спасён.", "en": "At the end Oedipus blinds himself and begs for exile; he is not saved."}]),
  Q("dr-3-02",{"he": "ב\"רומאו ויוליה\" של שייקספיר, הקהל יודע שיוליה רק נראית מתה. רומאו אינו יודע זאת. מה עושה האירוניה הדרמטית בסצנה?", "ar": "في \"روميو وجولييت\" لشكسبير، يعرف الجمهور أن جولييت تبدو ميتة فقط. وروميو لا يعرف ذلك. ماذا تفعل المفارقة الدرامية في المشهد؟", "ru": "В «Ромео и Джульетте» Шекспира зрители знают, что Джульетта лишь кажется мёртвой. Ромео этого не знает. Что делает драматическая ирония в этой сцене?", "en": "In Shakespeare's \"Romeo and Juliet\", the audience knows Juliet only seems dead. Romeo does not know. What does dramatic irony do in the scene?"},[{"he": "מפחיתה את המתח, כי הקהל כבר יודע הכול ואין טעם להמשיך לצפות", "ar": "تخفّف التوتر، لأن الجمهور يعرف كل شيء ولا فائدة من متابعة المشاهدة", "ru": "Снижает напряжение: зрители всё знают, и смотреть дальше незачем", "en": "It lowers tension, since the audience knows everything and has no reason to keep watching"}, {"he": "מגבירה את הכאב, כי הקהל רואה את הטעות מתקרבת", "ar": "تزيد الألم، لأن الجمهور يرى الخطأ يقترب", "ru": "Усиливает боль: зрители видят, как приближается ошибка", "en": "It deepens the pain, as the audience watches the mistake approach"}, {"he": "הופכת את הסצנה לקומית", "ar": "تجعل المشهد كوميديًا", "ru": "Делает сцену комической", "en": "It makes the scene comic"}, {"he": "מראה שרומאו יודע את האמת", "ar": "تُظهر أن روميو يعرف الحقيقة", "ru": "Показывает, что Ромео знает правду", "en": "It shows Romeo knows the truth"}],1,{"he": "איך מרגיש מי שרואה אסון מתקרב ואינו יכול להזהיר?", "ar": "بماذا يشعر من يرى كارثة تقترب ولا يستطيع التحذير؟", "ru": "Что чувствует тот, кто видит беду и не может предупредить?", "en": "How does one feel watching a disaster approach without being able to warn?"},{"he": "הקהל יודע שיוליה חיה, ורומאו פועל כאילו היא מתה. הקהל רואה את הטעות ואינו יכול לעצור אותה. הפער הזה מגביר את המתח ואת הכאב.", "ar": "يعرف الجمهور أن جولييت حيّة، وروميو يتصرّف كأنها ميتة. يرى الجمهور الخطأ ولا يستطيع إيقافه. هذه الفجوة تزيد التوتر والألم.", "ru": "Зрители знают, что Джульетта жива, а Ромео ведёт себя так, будто она мертва. Зрители видят ошибку и не могут её остановить. Этот разрыв усиливает напряжение и боль.", "en": "The audience knows Juliet is alive, while Romeo acts as if she is dead. They see the mistake and cannot stop it. This gap raises tension and pain."},null,[{"he": "הידיעה המוקדמת דווקא מגבירה את המתח של הצופה.", "ar": "المعرفة المسبقة تزيد توتر المشاهد بالذات.", "ru": "Знание заранее, наоборот, усиливает напряжение зрителя.", "en": "Knowing in advance actually raises the viewer's tension."}, null, {"he": "זו סצנה טרגית; הפער יוצר כאב ולא צחוק.", "ar": "هذا مشهد مأساوي؛ الفجوة تصنع ألمًا لا ضحكًا.", "ru": "Это трагическая сцена: разрыв рождает боль, а не смех.", "en": "This is a tragic scene; the gap creates pain, not laughter."}, {"he": "האירוניה נוצרת דווקא מפני שרומאו אינו יודע.", "ar": "المفارقة تنشأ تحديدًا لأن روميو لا يعرف.", "ru": "Ирония возникает именно потому, что Ромео не знает.", "en": "The irony exists precisely because Romeo does not know."}]),
  Q("dr-3-03",{"he": "במחזה מקורי, דמות מחייכת ומסכימה עם כולם בדיאלוג. אבל במונולוג, לבד, היא אומרת שהיא מתכננת לעזוב. מה הפער מגלה?", "ar": "في مسرحية أصلية، تبتسم شخصية وتوافق الجميع في الحوار. لكن في المونولوج، وحدها، تقول إنها تخطط للرحيل. ماذا تكشف الفجوة؟", "ru": "В оригинальной пьесе героиня улыбается и со всеми соглашается в диалоге. Но в монологе, одна, она говорит, что собирается уйти. Что раскрывает этот разрыв?", "en": "In an original play, a character smiles and agrees with everyone in dialogue. But in a monologue, alone, she says she plans to leave. What does the gap reveal?"},[{"he": "שהדמות שכחה מה אמרה קודם", "ar": "أن الشخصية نسيت ما قالته سابقًا", "ru": "Что героиня забыла, что говорила раньше", "en": "That the character forgot what she said before"}, {"he": "שהמונולוג הוא טעות של המחזאי", "ar": "أن المونولوج خطأ من الكاتب", "ru": "Что монолог — ошибка драматурга", "en": "That the monologue is the playwright's mistake"}, {"he": "פער בין הפנים החיצוניות לבין העולם הפנימי", "ar": "فجوة بين الوجه الخارجي والعالم الداخلي", "ru": "Разрыв между внешним лицом и внутренним миром", "en": "A gap between her outer face and her inner world"}, {"he": "שהדמויות האחרות שומעות את המונולוג ומגיבות אליו מיד על הבמה", "ar": "أن الشخصيات الأخرى تسمع المونولوج وتردّ عليه فورًا على الخشبة", "ru": "Что другие герои слышат монолог и сразу отвечают на сцене", "en": "That the other characters hear the monologue and react right away on stage"}],2,{"he": "מה ההבדל בין מה שהיא מראה לאחרים לבין מה שהיא אומרת כשאיש אינו שומע?", "ar": "ما الفرق بين ما تُظهره للآخرين وما تقوله حين لا يسمعها أحد؟", "ru": "Чем то, что она показывает другим, отличается от сказанного наедине?", "en": "How does what she shows others differ from what she says when no one hears?"},{"he": "בדיאלוג הדמות מסתירה את כוונתה. במונולוג היא אומרת את האמת לקהל בלבד. הפער חושף עולם פנימי שהאחרים אינם רואים.", "ar": "في الحوار تُخفي الشخصية نيّتها. وفي المونولوج تقول الحقيقة للجمهور وحده. الفجوة تكشف عالمًا داخليًا لا يراه الآخرون.", "ru": "В диалоге героиня скрывает намерение. В монологе она говорит правду только зрителям. Разрыв раскрывает внутренний мир, которого другие не видят.", "en": "In dialogue the character hides her intent. In the monologue she tells only the audience the truth. The gap exposes an inner world others cannot see."},null,[{"he": "היא אינה שוכחת; היא מסתירה את כוונתה בכוונה.", "ar": "هي لا تنسى؛ بل تُخفي نيّتها عمدًا.", "ru": "Она не забыла, а намеренно скрывает намерение.", "en": "She has not forgotten; she hides her intent on purpose."}, {"he": "מונולוג הוא כלי מכוון לחשיפת מחשבות, לא טעות.", "ar": "المونولوج أداة مقصودة لكشف الأفكار، لا خطأ.", "ru": "Монолог — сознательный приём раскрытия мыслей, не ошибка.", "en": "A monologue is a deliberate tool to reveal thoughts, not a mistake."}, null, {"he": "היא לבד על הבמה, ולכן איש מהדמויות אינו שומע.", "ar": "هي وحدها على الخشبة، فلا تسمعها أي شخصية.", "ru": "Она одна на сцене, поэтому никто из героев не слышит.", "en": "She is alone on stage, so no character hears her."}]),
  Q("dr-3-04",{"he": "דמות אומרת: \"אני לא כועס בכלל.\" הוראת הבמה: \"(טורק את הדלת.)\" איך כדאי לפרש את הקטע?", "ar": "تقول شخصية: \"لست غاضبًا أبدًا.\" والإرشاد المسرحي: \"(يصفق الباب بقوة.)\" كيف يحسن تفسير المقطع؟", "ru": "Герой говорит: «Я совсем не злюсь». Ремарка: «(Хлопает дверью.)» Как лучше понять этот отрывок?", "en": "A character says, \"I'm not angry at all.\" Stage direction: \"(Slams the door.)\" How should we interpret this?"},[{"he": "הדמות רגועה, והדלת נטרקה בגלל רוח חזקה שנכנסה מהחלון", "ar": "الشخصية هادئة، والباب انصفق بسبب ريح قوية دخلت من النافذة", "ru": "Герой спокоен, а дверь хлопнула от сильного ветра из окна", "en": "The character is calm; the door slammed because of a strong wind from the window"}, {"he": "צריך להתעלם מהוראות במה", "ar": "يجب تجاهل الإرشادات المسرحية", "ru": "Ремарки нужно пропускать", "en": "Stage directions should be ignored"}, {"he": "הדמות מדברת אל הקהל", "ar": "الشخصية تتحدث إلى الجمهور", "ru": "Герой обращается к залу", "en": "The character speaks to the audience"}, {"he": "הפעולה סותרת את המילים ומגלה כעס", "ar": "الفعل يناقض الكلام ويكشف الغضب", "ru": "Действие противоречит словам и выдаёт злость", "en": "The action contradicts the words and reveals anger"}],3,{"he": "במה כדאי להאמין: במה שנאמר או במה שנעשה?", "ar": "بمَ نصدّق: بما يُقال أم بما يُفعل؟", "ru": "Чему верить: словам или поступку?", "en": "Which should we trust: what is said or what is done?"},{"he": "המילים מכחישות כעס, אבל הפעולה מראה אותו. במחזה, הוראת במה היא חלק מהטקסט. כשמעשה סותר דיבור, המעשה חושף את מה שהדמות מסתירה.", "ar": "الكلام ينفي الغضب، لكن الفعل يُظهره. في المسرحية، الإرشاد المسرحي جزء من النص. وحين يناقض الفعلُ الكلامَ، يكشف الفعل ما تُخفيه الشخصية.", "ru": "Слова отрицают злость, а поступок её показывает. В пьесе ремарка — часть текста. Когда действие противоречит словам, оно выдаёт скрытое.", "en": "The words deny anger, but the action shows it. In a play, a stage direction is part of the text. When action contradicts speech, it reveals what the character hides."},null,[{"he": "אין בטקסט רמז לרוח; הפעולה מיוחסת לדמות עצמה.", "ar": "لا تلميح في النص إلى ريح؛ الفعل منسوب إلى الشخصية نفسها.", "ru": "В тексте нет ветра; действие приписано самому герою.", "en": "Nothing mentions wind; the action is the character's own."}, {"he": "הוראת במה היא חלק מהמחזה ומוסיפה משמעות.", "ar": "الإرشاد المسرحي جزء من المسرحية ويضيف معنى.", "ru": "Ремарка — часть пьесы и добавляет смысл.", "en": "A stage direction is part of the play and adds meaning."}, {"he": "אין סימן לפנייה לקהל; זו תגובה רגשית במצב.", "ar": "لا دليل على التوجّه إلى الجمهور؛ هذا ردّ فعل عاطفي.", "ru": "Нет признаков обращения к залу; это эмоциональная реакция.", "en": "Nothing shows he addresses the audience; it is an emotional reaction."}, null]),
  Q("dr-3-05",{"he": "במחזה מקורי יש ארבעה שלבים: (1) אח ואחות רבים על ירושה. (2) האח מוצא צוואה נסתרת. (3) הוא מחליט אם לשרוף אותה. (4) המשפחה נפרדת. איזה שלב הוא השיא?", "ar": "في مسرحية أصلية أربع مراحل: (1) يتشاجر أخ وأخت على ميراث. (2) يجد الأخ وصية مخبّأة. (3) يقرّر هل يحرقها. (4) تتفرّق العائلة. أيّ مرحلة هي الذروة؟", "ru": "В оригинальной пьесе четыре этапа: (1) брат и сестра спорят о наследстве; (2) брат находит спрятанное завещание; (3) он решает, сжечь ли его; (4) семья распадается. Какой этап — кульминация?", "en": "An original play has four stages: (1) a brother and sister fight over an inheritance; (2) the brother finds a hidden will; (3) he decides whether to burn it; (4) the family splits. Which stage is the climax?"},[{"he": "שלב 1: פתיחת הריב", "ar": "المرحلة 1: بداية الشجار", "ru": "Этап 1: начало ссоры", "en": "Stage 1: the fight begins"}, {"he": "שלב 2: מציאת הצוואה", "ar": "المرحلة 2: العثور على الوصية", "ru": "Этап 2: находка завещания", "en": "Stage 2: the will is found"}, {"he": "שלב 3: רגע ההחלטה", "ar": "المرحلة 3: لحظة القرار", "ru": "Этап 3: момент решения", "en": "Stage 3: the moment of decision"}, {"he": "שלב 4: המשפחה נפרדת בסוף המחזה", "ar": "المرحلة 4: تفرّق العائلة في نهاية المسرحية", "ru": "Этап 4: распад семьи в конце пьесы", "en": "Stage 4: the family splits at the end of the play"}],2,{"he": "חפשו את הרגע שאחריו אין דרך חזרה.", "ar": "ابحثوا عن اللحظة التي لا عودة بعدها.", "ru": "Найдите момент, после которого пути назад нет.", "en": "Look for the point of no return."},{"he": "השיא הוא רגע המתח הגבוה ביותר, שבו נופלת הכרעה. כאן האח צריך להחליט מה יעשה בצוואה. אחריו העלילה יורדת אל התוצאה.", "ar": "الذروة لحظة أعلى توتر، حيث يقع الحسم. هنا يجب على الأخ أن يقرّر ماذا يفعل بالوصية. وبعدها تنحدر الحبكة نحو النتيجة.", "ru": "Кульминация — момент наивысшего напряжения и выбора. Здесь брат должен решить, что делать с завещанием. После этого сюжет идёт к итогу.", "en": "The climax is the point of highest tension, where a decision falls. Here the brother must decide what to do with the will. After it the plot descends to the outcome."},null,[{"he": "זו הפתיחה, שמציגה את הקונפליקט.", "ar": "هذا هو الافتتاح الذي يعرض الصراع.", "ru": "Это начало, которое вводит конфликт.", "en": "This is the opening, which presents the conflict."}, {"he": "המציאה מסבכת את העלילה ומעלה את המתח, אבל ההכרעה עוד לא באה.", "ar": "العثور يعقّد الحبكة ويرفع التوتر، لكن الحسم لم يأتِ بعد.", "ru": "Находка усложняет сюжет и растит напряжение, но выбора ещё нет.", "en": "The find complicates the plot and builds tension, but no decision yet."}, null, {"he": "זו ההתרה, התוצאה שבאה אחרי השיא.", "ar": "هذا هو الحلّ، النتيجة التي تأتي بعد الذروة.", "ru": "Это развязка — итог после кульминации.", "en": "This is the resolution, the outcome after the climax."}]),
  Q("dr-3-06",{"he": "ב\"אנטיגונה\" של סופוקלס, אנטיגונה קוברת את אחיה למרות איסור של המלך קריאון. מה מייחד את הקונפליקט?", "ar": "في \"أنتيغوني\" لسوفوكليس، تدفن أنتيغوني أخاها رغم منع الملك كريون. ما الذي يميّز الصراع؟", "ru": "В «Антигоне» Софокла Антигона хоронит брата вопреки запрету царя Креонта. Чем особен этот конфликт?", "en": "In Sophocles' \"Antigone\", Antigone buries her brother despite King Creon's ban. What is special about this conflict?"},[{"he": "אנטיגונה רוצה רק לפגוע בקריאון, ואין לה שום סיבה אחרת למעשה", "ar": "أنتيغوني تريد فقط إيذاء كريون، وليس لها أي سبب آخر لفعلها", "ru": "Антигона хочет лишь навредить Креонту, других причин у неё нет", "en": "Antigone only wants to hurt Creon and has no other reason for her act"}, {"he": "כל צד מחזיק בערך שנראה לו צודק", "ar": "كل طرف يتمسّك بقيمة يراها عادلة", "ru": "Каждая сторона держится ценности, которую считает верной", "en": "Each side holds a value it sees as right"}, {"he": "קריאון אינו מופיע במחזה", "ar": "كريون لا يظهر في المسرحية", "ru": "Креонт не появляется в пьесе", "en": "Creon does not appear in the play"}, {"he": "הקונפליקט נפתר בפשרה שמחה", "ar": "يُحلّ الصراع بتسوية سعيدة", "ru": "Конфликт решается счастливым компромиссом", "en": "The conflict ends in a happy compromise"}],1,{"he": "מה מניע את אנטיגונה, ומה מניע את קריאון?", "ar": "ما الذي يدفع أنتيغوني، وما الذي يدفع كريون؟", "ru": "Что движет Антигоной, а что — Креонтом?", "en": "What drives Antigone, and what drives Creon?"},{"he": "אנטיגונה נאמנה למשפחה ולחובה לקבור את המתים. קריאון נאמן לחוק המדינה ולסדר. התנגשות בין שני ערכים כאלה הופכת את הקונפליקט לעמוק וטרגי.", "ar": "أنتيغوني وفيّة للعائلة ولواجب دفن الموتى. وكريون وفيّ لقانون الدولة والنظام. تصادم قيمتين كهاتين يجعل الصراع عميقًا ومأساويًا.", "ru": "Антигона верна семье и долгу хоронить мёртвых. Креонт верен закону государства и порядку. Столкновение таких ценностей делает конфликт глубоким и трагическим.", "en": "Antigone is loyal to family and the duty to bury the dead. Creon is loyal to state law and order. A clash of two such values makes the conflict deep and tragic."},null,[{"he": "מניע אנטיגונה הוא החובה לקבור את אחיה, לא שנאה לקריאון.", "ar": "دافع أنتيغوني هو واجب دفن أخيها، لا كراهية كريون.", "ru": "Антигоной движет долг похоронить брата, а не ненависть к Креонту.", "en": "Antigone is driven by duty to bury her brother, not hatred of Creon."}, null, {"he": "קריאון הוא דמות מרכזית במחזה ומתעמת עם אנטיגונה.", "ar": "كريون شخصية مركزية في المسرحية ويواجه أنتيغوني.", "ru": "Креонт — главный персонаж пьесы и спорит с Антигоной.", "en": "Creon is a central character and confronts Antigone."}, {"he": "המחזה מסתיים באסון ובמוות, לא בפשרה.", "ar": "تنتهي المسرحية بكارثة وموت، لا بتسوية.", "ru": "Пьеса кончается бедой и смертью, а не компромиссом.", "en": "The play ends in disaster and death, not compromise."}])]]);
