  Q("pl-1-01",{"he": "מה מאפיין שיר שנכתב בשורה חופשית?", "ar": "ما الذي يميز القصيدة المكتوبة بالشعر الحر؟", "ru": "Что отличает стихотворение, написанное свободным стихом?", "en": "What marks a poem written in free verse?"},[{"he": "אין בו משקל קבוע ואין בו חריזה קבועה", "ar": "ليس فيها وزن ثابت ولا قافية ثابتة", "ru": "В нём нет постоянного размера и постоянной рифмы", "en": "It has no fixed meter and no fixed rhyme"}, {"he": "כל השורות בו חורזות זו עם זו בסופן", "ar": "كل أسطرها تنتهي بقافية واحدة", "ru": "Все его строки рифмуются между собой", "en": "All its lines rhyme with each other"}, {"he": "מותר לכתוב אותו רק על טבע ועל עונות השנה", "ar": "لا يجوز أن تُكتب إلا عن الطبيعة وفصول السنة", "ru": "Его можно писать только о природе и временах года", "en": "It may only be written about nature and the seasons"}, {"he": "כל בית בו בנוי מארבע שורות באותו אורך בדיוק", "ar": "كل مقطع فيها مؤلف من أربعة أسطر بالطول نفسه تمامًا", "ru": "Каждая строфа в нём состоит ровно из четырёх строк одной длины", "en": "Every stanza has exactly four lines of the same length"}],0,{"he": "חשבו על המילה ״חופשית״. ממה השורה משוחררת?", "ar": "فكروا في كلمة «حر». من ماذا تحرر السطر؟", "ru": "Подумайте о слове «свободный». От чего свободна строка?", "en": "Think about the word “free.” Free from what?"},{"he": "בשורה חופשית אורך השורה משתנה. אין בה חוק קבוע של משקל או חרוז. הקצב נוצר מן המשפטים עצמם.", "ar": "في الشعر الحر يتغير طول السطر. لا قاعدة ثابتة للوزن أو القافية. الإيقاع يأتي من الجمل نفسها.", "ru": "В свободном стихе длина строк меняется. Нет правила размера или рифмы. Ритм рождается из самих фраз.", "en": "In free verse, line length changes. There is no fixed rule of meter or rhyme. The rhythm comes from the sentences."},null,[null, {"he": "חריזה קבועה היא דווקא סימן של שיר מסורתי.", "ar": "القافية الثابتة علامة على القصيدة التقليدية لا الحرة.", "ru": "Постоянная рифма — признак традиционного стиха.", "en": "Fixed rhyme is a sign of traditional verse, not free verse."}, {"he": "שורה חופשית היא צורה, והיא אינה קובעת את הנושא.", "ar": "الشعر الحر شكل، ولا يحدد موضوع القصيدة.", "ru": "Свободный стих — это форма, он не задаёт тему.", "en": "Free verse is a form; it does not decide the topic."}, {"he": "מבנה קבוע של בתים שווים מתאים לשיר מסורתי.", "ar": "البناء الثابت للمقاطع المتساوية يناسب القصيدة التقليدية.", "ru": "Одинаковые строфы — черта традиционного стиха.", "en": "Equal fixed stanzas belong to traditional verse."}]),
  Q("pl-1-02",{"he": "בשיר כתוב: ״אני עייף מן העיר״. מי אומר כאן ״אני״?", "ar": "في قصيدة: «أنا متعب من المدينة». من يقول «أنا» هنا؟", "ru": "В стихотворении: «Я устал от города». Кто здесь говорит «я»?", "en": "A poem says: “I am tired of the city.” Who says “I” here?"},[{"he": "המשורר עצמו, תמיד ובכל שיר בלי יוצא מן הכלל", "ar": "الشاعر نفسه، دائمًا وفي كل قصيدة بلا استثناء", "ru": "Сам поэт, всегда и в каждом стихотворении без исключения", "en": "The poet himself, always and in every poem without exception"}, {"he": "הדובר בשיר, קול שהמשורר יצר", "ar": "المتكلم في القصيدة، صوت صنعه الشاعر", "ru": "Лирический говорящий, голос, созданный поэтом", "en": "The speaker, a voice the poet created"}, {"he": "הקורא שקורא את השיר", "ar": "القارئ الذي يقرأ القصيدة", "ru": "Читатель, который читает стихи", "en": "The reader who reads the poem"}, {"he": "המורה שמלמדת את השיר", "ar": "المعلمة التي تدرّس القصيدة", "ru": "Учительница, которая объясняет стихи", "en": "The teacher who teaches the poem"}],1,{"he": "האם ״אני״ בשיר הוא בהכרח אדם אמיתי?", "ar": "هل «أنا» في القصيدة شخص حقيقي بالضرورة؟", "ru": "Обязательно ли «я» в стихах — реальный человек?", "en": "Is the “I” in a poem always a real person?"},{"he": "הקול בשיר נקרא ״הדובר״. המשורר בונה אותו, כמו שסופר בונה דמות. לכן אומרים ״הדובר עייף״, ולא ״המשורר עייף״.", "ar": "الصوت في القصيدة يسمى «المتكلم». الشاعر يبنيه كما يبني الكاتب شخصية. لذلك نقول «المتكلم متعب» لا «الشاعر متعب».", "ru": "Голос в стихах называют «лирическим говорящим». Поэт создаёт его, как писатель — героя. Поэтому говорят «говорящий устал», а не «поэт устал».", "en": "The voice in a poem is called “the speaker.” The poet builds it, like a writer builds a character. So we say “the speaker is tired,” not “the poet is tired.”"},null,[{"he": "הדובר יכול להיות דומה למשורר, אבל אין לזהות ביניהם אוטומטית.", "ar": "قد يشبه المتكلم الشاعر، لكن لا نساوي بينهما تلقائيًا.", "ru": "Говорящий может походить на поэта, но их нельзя отождествлять сразу.", "en": "The speaker may resemble the poet, but they are not automatically the same."}, null, {"he": "הקורא שומע את הקול, אבל אינו זה שמדבר בשיר.", "ar": "القارئ يسمع الصوت، لكنه ليس من يتكلم في القصيدة.", "ru": "Читатель слышит голос, но говорит в стихах не он.", "en": "The reader hears the voice but is not the one speaking."}, {"he": "המורה מסבירה את השיר, אבל המילים אינן שלה.", "ar": "المعلمة تشرح القصيدة، لكن الكلمات ليست كلماتها.", "ru": "Учительница объясняет стихи, но слова не её.", "en": "The teacher explains the poem, but the words are not hers."}]),
  Q("pl-1-03",{"he": "מהי אינטרטקסטואליות?", "ar": "ما التناص؟", "ru": "Что такое интертекстуальность?", "en": "What is intertextuality?"},[{"he": "חזרה על אותה מילה בתחילת כמה שורות ברצף", "ar": "تكرار الكلمة نفسها في بداية عدة أسطر متتالية", "ru": "Повтор одного и того же слова в начале нескольких строк подряд", "en": "Repeating the same word at the start of several lines in a row"}, {"he": "תרגום של שיר משפה אחת לשפה אחרת", "ar": "ترجمة قصيدة من لغة إلى لغة أخرى", "ru": "Перевод стихотворения с одного языка на другой", "en": "Translating a poem from one language to another"}, {"he": "קשר בין טקסט אחד לטקסט אחר שקדם לו", "ar": "علاقة بين نص ونص آخر سبقه", "ru": "Связь между текстом и другим, более ранним текстом", "en": "A link between one text and an earlier text"}, {"he": "משפט שממשיך משורה אחת לשורה הבאה", "ar": "جملة تستمر من سطر إلى السطر التالي", "ru": "Фраза, которая переходит с одной строки на следующую", "en": "A sentence that runs on from one line into the next"}],2,{"he": "חשבו על החלק ״אינטר״, שפירושו ״בין״.", "ar": "فكروا: هل يخص المصطلح نصًا واحدًا أم أكثر؟", "ru": "Подумайте о части «интер», то есть «между».", "en": "Think of the part “inter,” which means “between.”"},{"he": "אינטרטקסטואליות היא שיח בין טקסטים. שיר חדש יכול לרמוז למקרא, לשיר ישן או לפתגם. הקורא שמזהה את המקור מבין משמעות נוספת.", "ar": "التناص حوار بين النصوص. قد تشير قصيدة جديدة إلى نص ديني قديم أو قصيدة قديمة أو مثل. القارئ الذي يعرف المصدر يفهم معنى إضافيًا.", "ru": "Интертекстуальность — это диалог текстов. Новое стихотворение может отсылать к Библии, старым стихам или пословице. Читатель, узнавший источник, видит новый смысл.", "en": "Intertextuality is a dialogue between texts. A new poem may point to the Bible, an old poem or a proverb. A reader who spots the source finds extra meaning."},null,[{"he": "זו חזרה בתוך אותו שיר, ולא קשר לטקסט אחר.", "ar": "هذا تكرار داخل القصيدة نفسها، لا علاقة بنص آخر.", "ru": "Это повтор внутри одного стихотворения, а не связь с другим текстом.", "en": "That is repetition inside one poem, not a link to another text."}, {"he": "תרגום מעביר שיר לשפה אחרת, אבל אינו יוצר שיח בין שני טקסטים.", "ar": "الترجمة تنقل القصيدة إلى لغة أخرى، ولا تخلق حوارًا بين نصين.", "ru": "Перевод переносит текст в другой язык, но не создаёт диалог текстов.", "en": "Translation moves a poem into another language; it does not create a dialogue between texts."}, null, {"he": "זו שורה גולשת, תופעה של צורה בתוך השיר.", "ar": "هذا تدوير، وهو ظاهرة شكلية داخل القصيدة.", "ru": "Это перенос строки, явление формы внутри стихотворения.", "en": "That is enjambment, a feature of form inside the poem."}]),
  Q("pl-1-04",{"he": "מה מאפיין לשון יומיומית בשירה מאוחרת?", "ar": "ما الذي يميز اللغة اليومية في الشعر الحديث؟", "ru": "Что характерно для разговорного языка в поздней поэзии?", "en": "What marks everyday language in later poetry?"},[{"he": "מילים גבוהות שנלקחו רק מן המקרא", "ar": "كلمات فصيحة مأخوذة من النصوص القديمة وحدها", "ru": "Только возвышенные слова из Библии", "en": "Only lofty words taken from the Bible"}, {"he": "חרוז קבוע בסוף כל שורה", "ar": "قافية ثابتة في نهاية كل سطر", "ru": "Постоянная рифма в конце каждой строки", "en": "A fixed rhyme at the end of every line"}, {"he": "משפטים ארוכים וחגיגיים בסגנון של נאום רשמי", "ar": "جمل طويلة واحتفالية بأسلوب خطاب رسمي", "ru": "Длинные торжественные фразы в стиле официальной речи", "en": "Long, solemn sentences in the style of an official speech"}, {"he": "מילים ומשפטים כמו בדיבור רגיל", "ar": "كلمات وجمل كما في الكلام العادي", "ru": "Слова и фразы, как в обычной речи", "en": "Words and sentences as in ordinary speech"}],3,{"he": "איך אנשים מדברים במטבח או באוטובוס?", "ar": "كيف يتكلم الناس في المطبخ أو في الحافلة؟", "ru": "Как люди говорят на кухне или в автобусе?", "en": "How do people talk in a kitchen or on a bus?"},{"he": "בשירה מאוחרת משוררים רבים כותבים כמו שמדברים. מילים פשוטות מקרבות את השיר לחיים. דווקא בפשטות הזאת יכול להסתתר רגש עמוק.", "ar": "في الشعر الحديث يكتب شعراء كثيرون كما يتكلمون. الكلمات البسيطة تقرّب القصيدة من الحياة. وفي هذه البساطة قد يختبئ شعور عميق.", "ru": "В поздней поэзии многие пишут так, как говорят. Простые слова приближают стихи к жизни. За этой простотой может скрываться сильное чувство.", "en": "In later poetry, many poets write the way people talk. Plain words bring the poem close to life. Deep feeling can hide in that plainness."},null,[{"he": "לשון גבוהה היא ההפך מלשון יומיומית.", "ar": "اللغة الفصيحة العالية عكس اللغة اليومية.", "ru": "Высокий стиль — противоположность разговорному.", "en": "Lofty language is the opposite of everyday language."}, {"he": "חרוז קבוע הוא עניין של צורה, ולא של סוג הלשון.", "ar": "القافية الثابتة مسألة شكل، لا نوع اللغة.", "ru": "Рифма — вопрос формы, а не типа языка.", "en": "Fixed rhyme is about form, not about the kind of language."}, {"he": "נאום רשמי רחוק מן הדיבור של כל יום.", "ar": "الخطاب الرسمي بعيد عن كلام كل يوم.", "ru": "Официальная речь далека от повседневной.", "en": "An official speech is far from daily talk."}, null]),
  Q("pl-1-05",{"he": "מהו הטון של שיר?", "ar": "ما نبرة القصيدة؟", "ru": "Что такое тон стихотворения?", "en": "What is the tone of a poem?"},[{"he": "היחס הרגשי של הדובר אל מה שהוא מתאר", "ar": "موقف المتكلم العاطفي مما يصفه", "ru": "Чувство говорящего к тому, что он описывает", "en": "The speaker’s feeling toward what he describes"}, {"he": "מספר השורות שיש בכל בית", "ar": "عدد الأسطر في كل مقطع", "ru": "Число строк в каждой строфе", "en": "The number of lines in each stanza"}, {"he": "הנושא שהשיר עוסק בו, כמו אהבה או מלחמה", "ar": "الموضوع الذي تتناوله القصيدة، مثل الحب أو الحرب", "ru": "Тема стихотворения, например любовь или война", "en": "The topic of the poem, such as love or war"}, {"he": "גובה הקול שבו קוראים את השיר בקול רם בכיתה", "ar": "ارتفاع الصوت الذي نقرأ به القصيدة بصوت عالٍ في الصف", "ru": "Громкость, с которой стихи читают вслух в классе", "en": "How loudly the poem is read aloud by students in class"}],0,{"he": "האם הדובר כועס, מתגעגע, או צוחק?", "ar": "هل المتكلم غاضب أم مشتاق أم ساخر؟", "ru": "Говорящий сердится, тоскует или смеётся?", "en": "Is the speaker angry, longing, or mocking?"},{"he": "הטון הוא הרגש שעולה מן המילים. אפשר לכתוב על אותו נושא בטון עצוב או בטון מתבדח. כדי לזהות טון, בודקים אילו מילים הדובר בוחר.", "ar": "النبرة هي الشعور الذي يظهر من الكلمات. يمكن الكتابة عن الموضوع نفسه بنبرة حزينة أو ساخرة. لنعرف النبرة نفحص الكلمات التي يختارها المتكلم.", "ru": "Тон — это чувство, которое идёт от слов. Об одной теме можно писать грустно или шутливо. Чтобы понять тон, смотрят, какие слова выбирает говорящий.", "en": "Tone is the feeling that comes from the words. One topic can be written in a sad tone or a joking one. To find the tone, look at the words the speaker chooses."},null,[null, {"he": "מספר שורות הוא מבנה, ולא רגש.", "ar": "عدد الأسطر بناء، لا شعور.", "ru": "Число строк — это строение, а не чувство.", "en": "The number of lines is structure, not feeling."}, {"he": "הנושא הוא על מה השיר, והטון הוא איך הדובר מרגיש כלפיו.", "ar": "الموضوع هو عمّ تتحدث القصيدة، والنبرة هي شعور المتكلم تجاهه.", "ru": "Тема — о чём стихи, а тон — как говорящий к этому относится.", "en": "The topic is what the poem is about; tone is how the speaker feels about it."}, {"he": "הטון נמצא במילים של השיר, ולא בעוצמת ההקראה.", "ar": "النبرة في كلمات القصيدة، لا في قوة صوت القارئ.", "ru": "Тон заложен в словах, а не в громкости чтения.", "en": "Tone lives in the words, not in how loudly they are read."}]),
  Q("pl-1-06",{"he": "מהי דו־משמעות בשיר?", "ar": "ما الالتباس أو ازدواج المعنى في القصيدة؟", "ru": "Что такое двусмысленность в стихотворении?", "en": "What is ambiguity in a poem?"},[{"he": "טעות של המשורר, שהעורך צריך לתקן לפני ההדפסה", "ar": "خطأ من الشاعر على المحرر أن يصححه قبل الطباعة", "ru": "Ошибка поэта, которую редактор должен исправить до печати", "en": "A mistake by the poet that the editor should fix before printing"}, {"he": "מילה או משפט שאפשר להבין בשתי דרכים", "ar": "كلمة أو جملة يمكن فهمها بطريقتين", "ru": "Слово или фраза, которые можно понять двумя способами", "en": "A word or sentence that can be read in two ways"}, {"he": "שתי שורות שחורזות זו עם זו", "ar": "سطران تتفق قافيتهما", "ru": "Две строки, которые рифмуются", "en": "Two lines that rhyme with each other"}, {"he": "שיר שנכתב בשתי שפות", "ar": "قصيدة كُتبت بلغتين", "ru": "Стихотворение, написанное на двух языках", "en": "A poem written in two languages"}],1,{"he": "חשבו על החלק ״דו״ בשם המושג.", "ar": "فكروا في كلمة «ازدواج»: شيئان معًا.", "ru": "Подумайте о части «дву-» в слове.", "en": "Think about the “two” hidden in the term."},{"he": "בדו־משמעות יש לשורה שתי קריאות אפשריות. למשל ״הלכתי הביתה״ יכול להיות מקום, וגם תחושה של שייכות. תשובה טובה מציגה את שתי הקריאות.", "ar": "في الالتباس للسطر قراءتان ممكنتان. مثلًا «عدت إلى البيت» قد يعني مكانًا، أو شعورًا بالانتماء. الإجابة الجيدة تعرض القراءتين.", "ru": "В двусмысленной строке два возможных прочтения. Например, «я пошёл домой» — это место и чувство принадлежности. Хороший ответ показывает оба прочтения.", "en": "An ambiguous line has two possible readings. For example, “I went home” can be a place, and also a sense of belonging. A good answer shows both readings."},null,[{"he": "דו־משמעות היא לרוב בחירה, והיא מעשירה את השיר.", "ar": "الالتباس غالبًا اختيار مقصود، وهو يغني القصيدة.", "ru": "Двусмысленность обычно задумана и обогащает стихи.", "en": "Ambiguity is usually a choice, and it enriches the poem."}, null, {"he": "חרוז הוא דמיון בצליל, ולא שתי משמעויות.", "ar": "القافية تشابه في الصوت، لا معنيان.", "ru": "Рифма — это сходство звуков, а не два смысла.", "en": "Rhyme is a likeness of sound, not two meanings."}, {"he": "שתי שפות אינן יוצרות בהכרח שתי משמעויות לאותה מילה.", "ar": "اللغتان لا تصنعان بالضرورة معنيين للكلمة نفسها.", "ru": "Два языка не дают одному слову два смысла.", "en": "Two languages do not by themselves give one word two meanings."}])],
 [
  Q("lit-poetry-8282-3",{"he": "איזה תיאור מתאים לשינוי בטון?", "ar": "أي وصف يناسب تحول النبرة؟", "ru": "Какое описание подходит к «Смена тона»?", "en": "Which description fits shift in tone?"},[{"he": "הקול שמדבר בשיר; אין לזהותו אוטומטית עם המשורר האמיתי.", "ar": "الصوت الذي يتكلم في القصيدة؛ ليس بالضرورة الشاعر الحقيقي.", "ru": "Голос в стихотворении, не обязательно сам реальный поэт.", "en": "The voice speaking in a poem, not automatically the real poet."},{"he": "מי שהדובר פונה אליו, אם יש פנייה בטקסט.", "ar": "من يوجّه إليه المتكلم كلامه إن وجد خطاب في النص.", "ru": "Тот, к кому обращается говорящий, если обращение есть.", "en": "The person or thing addressed by the speaker, when the poem makes an address."},{"he": "מעבר בעמדה הרגשית של הדובר, למשל מתקווה לספק.", "ar": "انتقال موقف المتكلم العاطفي، مثل الانتقال من الأمل إلى الشك.", "ru": "Переход в эмоциональном отношении говорящего, например от надежды к сомнению.", "en": "A change in the speaker’s attitude, for example from hope to doubt."},{"he": "מקום שבו הטקסט אינו מכריע פירוש אחד ויש לבסס אפשרויות בפרטים.", "ar": "موضع لا يحسم فيه النص معنى واحدًا وتحتاج فيه القراءات إلى قرائن.", "ru": "Место, где текст допускает разные прочтения, каждое с опорой на детали.", "en": "A place where the text leaves more than one reading possible, each needing evidence."}],2,{"he": "חפשו את הפרט שמבדיל אותו מן האחרים.", "ar": "ابحثوا عن التفصيل الذي يميزه عن غيره.", "ru": "Ищите отличие от остальных вариантов.", "en": "Look for the detail that separates it from the others."},{"he": "השוו מילים ועמדות לפני ואחרי נקודת המפנה.", "ar": "قارنوا الكلمات والمواقف قبل نقطة التحول وبعدها.", "ru": "Сравните слова и позицию до и после поворота.", "en": "Compare wording and attitude before and after the turn."},null,[{"he": "זה מתאר את דובר בשיר, לא את שינוי בטון.", "ar": "هذا يصف المتكلم في القصيدة، لا تحول النبرة.", "ru": "Это описание «Лирический говорящий», а не «Смена тона».", "en": "That describes speaker in a poem, not shift in tone."},{"he": "זה מתאר את נמען, לא את שינוי בטון.", "ar": "هذا يصف المخاطَب، لا تحول النبرة.", "ru": "Это описание «Адресат», а не «Смена тона».", "en": "That describes addressee, not shift in tone."},null,{"he": "זה מתאר את מרווח פרשנות, לא את שינוי בטון.", "ar": "هذا يصف مجال التأويل، لا تحول النبرة.", "ru": "Это описание «Пространство толкования», а не «Смена тона».", "en": "That describes room for interpretation, not shift in tone."}])
 ,Q("lit-poetry2-time",{"he": "איזה תיאור מתאים למעבר זמן?", "ar": "أي وصف يناسب الانتقال الزمني؟", "ru": "Какое описание подходит к переход во времени?", "en": "Which description fits a time shift?"},[{"he": "הפניה קצרה ליצירה או למקור אחר, שהקורא מוזמן לזהות.", "ar": "إحالة موجزة إلى عمل أو مصدر آخر، يُدعى القارئ للتعرف إليه.", "ru": "Краткое указание на другое произведение или источник, который читателю предлагается узнать.", "en": "A brief reference to another work or source that the reader is invited to recognize."},{"he": "מעבר בין עבר להווה בשיר, המשנה את נקודת המבט של הדובר.", "ar": "انتقال بين الماضي والحاضر في القصيدة يغيّر زاوية نظر المتحدث.", "ru": "Переход между прошлым и настоящим в стихотворении, меняющий точку зрения говорящего.", "en": "A move between past and present in the poem, changing the speaker's viewpoint."},{"he": "נוכחות של שתי תחושות מנוגדות כלפי אותו דבר, זו לצד זו.", "ar": "حضور شعورين متناقضين تجاه الشيء نفسه، جنبًا إلى جنب.", "ru": "Присутствие двух противоположных чувств к одному и тому же рядом друг с другом.", "en": "The presence of two opposing feelings toward the same thing, side by side."},{"he": "רגע שבו השיר פונה לכיוון ההפוך ממה שהקורא ציפה לו.", "ar": "لحظة تنعطف فيها القصيدة عكس ما توقعه القارئ.", "ru": "Момент, когда стихотворение поворачивает против читательского ожидания.", "en": "The moment the poem turns against what the reader expected."}],1,{"he": "מתי הדובר: בעבר, בהווה, או בשניהם?", "ar": "متى يتحدث المتحدث: في الماضي أم الحاضر أم كليهما؟", "ru": "Когда говорит лирический субъект: в прошлом, настоящем или в обоих?", "en": "When does the speaker speak: past, present, or both?"},{"he": "מעבר זמן מזיז את נקודת המבט. למשל שיר שפותח בילדות ומסתיים במבט של מבוגר.", "ar": "الانتقال الزمني يحرّك زاوية النظر. مثال: قصيدة تبدأ في الطفولة وتنتهي بنظرة شخص بالغ.", "ru": "Переход во времени двигает точку зрения. Например, стихотворение, начинающееся в детстве и кончающееся взглядом взрослого.", "en": "A time shift moves the viewpoint. For example, a poem opening in childhood and closing with an adult's gaze."},null,[{"he": "זה מתאר את רמיזה, לא את מעבר זמן.", "ar": "هذا يصف التلميح، لا الانتقال الزمني.", "ru": "Это описание «аллюзию», а не «переход во времени».", "en": "That describes an allusion, not a time shift."},null,{"he": "זה מתאר את אמביוולנטיות, לא את מעבר זמן.", "ar": "هذا يصف الازدواجية الوجدانية، لا الانتقال الزمني.", "ru": "Это описание «амбивалентность», а не «переход во времени».", "en": "That describes ambivalence, not a time shift."},{"he": "זה מתאר את שבירת ציפייה, לא את מעבר זמן.", "ar": "هذا يصف كسر التوقع، لا الانتقال الزمني.", "ru": "Это описание «слом ожидания», а не «переход во времени».", "en": "That describes a broken expectation, not a time shift."}]),Q("lit-poetry2-twist-use",{"he": "בשיר מקורי, שלוש שורות מתארות ארוחה חגיגית, והשורה האחרונה חושפת שהשולחן ריק. מה עשתה השורה האחרונה?", "ar": "في قصيدة أصلية، تصف ثلاثة أسطر وليمة احتفالية، ويكشف السطر الأخير أن المائدة فارغة. ماذا فعل السطر الأخير؟", "ru": "В новом стихотворении три строки описывают праздничный ужин, а последняя строка раскрывает, что стол пуст. Что сделала последняя строка?", "en": "In an original poem, three lines describe a festive meal, and the last line reveals that the table is empty. What did the last line do?"},[{"he": "שברה את הציפייה ושינתה את משמעות כל השורות שקדמו לה", "ar": "كسرت التوقع وغيّرت معنى كل الأسطر السابقة", "ru": "Сломала ожидание и изменила смысл всех предыдущих строк", "en": "Broke the expectation and changed the meaning of all the lines before it"},{"he": "הוסיפה עוד פרט רקע לארוחה", "ar": "أضافت تفصيل خلفية آخر للوجبة", "ru": "Добавила ещё одну фоновую деталь об ужине", "en": "Added another background detail about the meal"},{"he": "חיזקה את מה שנאמר בשורה הראשונה", "ar": "عزّزت ما قيل في السطر الأول", "ru": "Укрепила сказанное в первой строке", "en": "Reinforced what the first line said"},{"he": "אין לה משמעות; זו סתם שורת סיום", "ar": "لا معنى له، فهو مجرد سطر ختامي", "ru": "Ничего не значит; это просто завершающая строка", "en": "It means nothing; it is just a closing line"}],0,{"he": "מה קורה לתמונה כולה אחרי השורה האחרונה?", "ar": "ماذا يحدث للصورة كلها بعد السطر الأخير؟", "ru": "Что происходит со всей картиной после последней строки?", "en": "What happens to the whole picture after the last line?"},{"he": "שבירת ציפייה מאלצת קריאה מחדש. למשל שולחן שנראה עמוס מתברר כריק, וכל הפרטים הקודמים מקבלים משמעות אחרת.", "ar": "كسر التوقع يُلزم بإعادة القراءة. مثال: مائدة بدت عامرة تتضح فارغة، فتأخذ كل التفاصيل السابقة معنى آخر.", "ru": "Слом ожидания заставляет перечитать. Например, стол, казавшийся полным, оказывается пустым, и все прежние детали получают иной смысл.", "en": "A broken expectation forces a reread. For example, a table that looked full turns out empty, and every earlier detail takes on a different meaning."},null,[null,{"he": "השורה אינה עוד פרט אלא הפיכה של התמונה.", "ar": "السطر ليس تفصيلًا إضافيًّا بل قلب للصورة.", "ru": "Строка не ещё одна деталь, а переворот картины.", "en": "The line is not another detail but a reversal of the picture."},{"he": "היא סותרת את ההתחלה ולא מחזקת אותה.", "ar": "إنه يناقض البداية ولا يعزّزها.", "ru": "Она противоречит началу, а не укрепляет его.", "en": "It contradicts the opening rather than reinforcing it."},{"he": "דווקא כאן טמון כוח השיר; בלעדיה הוא היה תיאור רגיל.", "ar": "هنا بالضبط تكمن قوة القصيدة، ولولاه لكانت وصفًا عاديًّا.", "ru": "Именно здесь сила стихотворения; без неё оно было бы обычным описанием.", "en": "That is exactly where the poem's power lies; without it, it would be a plain description."}]),
  Q("pl-2-01",{"he": "בשיר מקורי: ״קניתי לחם. / שילמתי. / אמרתי תודה. / איש לא שאל מה שלומי.״ מה יוצר כאן את הרגש?", "ar": "في قصيدة أصلية: «اشتريت خبزًا. / دفعت. / قلت شكرًا. / لم يسألني أحد عن حالي.» ما الذي يصنع الشعور هنا؟", "ru": "В новом стихотворении: «Купил хлеб. / Заплатил. / Сказал спасибо. / Никто не спросил, как я.» Что создаёт здесь чувство?", "en": "An original poem: “I bought bread. / I paid. / I said thanks. / No one asked how I was.” What creates the feeling here?"},[{"he": "מילים גבוהות ונדירות שמרשימות את הקורא", "ar": "كلمات عالية ونادرة تبهر القارئ", "ru": "Редкие возвышенные слова, которые впечатляют", "en": "Rare, lofty words that impress the reader"}, {"he": "חרוז קבוע שמחבר בין כל ארבע השורות", "ar": "قافية ثابتة تربط الأسطر الأربعة", "ru": "Постоянная рифма, связывающая все четыре строки", "en": "A fixed rhyme that ties all four lines together"}, {"he": "לשון פשוטה, ושורה אחרונה שחושפת בדידות", "ar": "لغة بسيطة، وسطر أخير يكشف الوحدة", "ru": "Простой язык и последняя строка, открывающая одиночество", "en": "Plain words, and a last line that reveals loneliness"}, {"he": "אין רגש בשיר, כי הוא מתאר רק קנייה רגילה במכולת השכונתית", "ar": "لا شعور في القصيدة، فهي تصف شراء عاديًا في دكان الحي فقط", "ru": "В стихах нет чувства: это лишь обычная покупка в магазине у дома", "en": "There is no feeling; it only describes an ordinary purchase at the corner shop"}],2,{"he": "השוו את השורה האחרונה לשלוש שלפניה.", "ar": "قارنوا السطر الأخير بالأسطر الثلاثة قبله.", "ru": "Сравните последнюю строку с тремя первыми.", "en": "Compare the last line with the three before it."},{"he": "שלוש השורות הראשונות קצרות וענייניות. השורה הרביעית מגלה מה חסר לדובר: קשר עם אנשים. הלשון הפשוטה מבליטה את הבדידות.", "ar": "الأسطر الثلاثة الأولى قصيرة وعملية. السطر الرابع يكشف ما ينقص المتكلم: صلة بالناس. اللغة البسيطة تبرز الوحدة.", "ru": "Первые три строки короткие и деловые. Четвёртая показывает, чего не хватает: связи с людьми. Простой язык подчёркивает одиночество.", "en": "The first three lines are short and practical. The fourth shows what is missing: contact with people. The plain language makes the loneliness stand out."},null,[{"he": "המילים בשיר יומיומיות מאוד, ואין בהן לשון גבוהה.", "ar": "كلمات القصيدة يومية جدًا، ولا لغة عالية فيها.", "ru": "Слова в стихах самые будничные, высокого стиля нет.", "en": "The words are very everyday; there is no lofty language."}, {"he": "השורות אינן חורזות זו עם זו.", "ar": "الأسطر لا تتفق في القافية.", "ru": "Строки не рифмуются между собой.", "en": "The lines do not rhyme with each other."}, null, {"he": "השורה האחרונה הופכת את הקנייה לרגע של בדידות.", "ar": "السطر الأخير يحول الشراء إلى لحظة وحدة.", "ru": "Последняя строка превращает покупку в момент одиночества.", "en": "The last line turns the purchase into a moment of loneliness."}]),
  Q("pl-2-02",{"he": "בשיר מקורי יש שורה של מילה אחת, ואחריה שורה של 12 מילים. אין חרוזים. מה אפשר לומר על צורת השיר?", "ar": "في قصيدة أصلية سطر من كلمة واحدة، يليه سطر من 12 كلمة. لا قوافي. ماذا نقول عن شكل القصيدة؟", "ru": "В новом стихотворении строка из одного слова, затем строка из 12 слов. Рифм нет. Что можно сказать о форме?", "en": "An original poem has a one-word line, then a 12-word line. There is no rhyme. What can we say about its form?"},[{"he": "הוא סונטה", "ar": "هي سونيتة", "ru": "Это сонет", "en": "It is a sonnet"}, {"he": "הוא שיר מסורתי במשקל קבוע", "ar": "هي قصيدة تقليدية بوزن ثابت", "ru": "Это традиционный стих с постоянным размером", "en": "It is a traditional poem with fixed meter"}, {"he": "הוא פרוזה, כי שיר אמיתי חייב שורות באותו אורך", "ar": "هي نثر، لأن القصيدة الحقيقية تحتاج أسطرًا متساوية الطول", "ru": "Это проза: в настоящем стихе строки одной длины", "en": "It is prose, because a real poem needs lines of equal length"}, {"he": "הוא כתוב בשורה חופשית", "ar": "هي مكتوبة بالشعر الحر", "ru": "Он написан свободным стихом", "en": "It is written in free verse"}],3,{"he": "האם יש כאן חוק קבוע של אורך או של צליל?", "ar": "هل هنا قاعدة ثابتة للطول أو للصوت؟", "ru": "Есть ли здесь правило длины или звука?", "en": "Is there a fixed rule of length or sound here?"},{"he": "אורך השורות משתנה מאוד ואין חרוז. אלה שני סימנים של שורה חופשית. השיר עדיין בנוי בשורות, ולכן הוא שיר.", "ar": "طول الأسطر يتغير كثيرًا ولا قافية. هاتان علامتان للشعر الحر. والقصيدة ما زالت مبنية على أسطر، فهي شعر.", "ru": "Длина строк сильно меняется, рифмы нет. Это два признака свободного стиха. Текст делится на строки, значит, это стихи.", "en": "The line lengths change a lot and there is no rhyme. These are two signs of free verse. It is still built in lines, so it is a poem."},null,[{"he": "לסונטה יש מספר שורות קבוע וחריזה קבועה.", "ar": "للسونيتة عدد أسطر ثابت وقافية ثابتة.", "ru": "У сонета постоянное число строк и рифма.", "en": "A sonnet has a fixed number of lines and a fixed rhyme."}, {"he": "שורות באורך שונה מאוד אינן מתאימות למשקל קבוע.", "ar": "الأسطر المختلفة جدًا في الطول لا تناسب وزنًا ثابتًا.", "ru": "Строки очень разной длины не подходят к постоянному размеру.", "en": "Lines of very different length do not fit a fixed meter."}, {"he": "גם שיר בשורות לא שוות הוא שיר, כי הוא בנוי בשורות.", "ar": "القصيدة ذات الأسطر غير المتساوية قصيدة أيضًا، لأنها مبنية على أسطر.", "ru": "Стих с неравными строками — всё равно стих: он делится на строки.", "en": "A poem with unequal lines is still a poem, because it is built in lines."}, null]),
  Q("pl-2-03",{"he": "בשיר מקורי: ״שוב הגשם. שוב אני לבד. / איזה יופי, באמת.״ מה הטון של השורה השנייה?", "ar": "في قصيدة أصلية: «المطر مجددًا. وحدي مجددًا. / يا للروعة، حقًا.» ما نبرة السطر الثاني؟", "ru": "В новом стихотворении: «Опять дождь. Опять я один. / Какая красота, правда.» Каков тон второй строки?", "en": "An original poem: “Rain again. Alone again. / How lovely, really.” What is the tone of the second line?"},[{"he": "אירוני: המילים חיוביות, אבל הכוונה הפוכה", "ar": "ساخر: الكلمات إيجابية لكن المقصود عكسها", "ru": "Ироничный: слова хорошие, а смысл обратный", "en": "Ironic: kind words, but the opposite meaning"}, {"he": "שמח: הדובר באמת אוהב את הגשם", "ar": "فرِح: المتكلم يحب المطر حقًا", "ru": "Радостный: говорящий правда любит дождь", "en": "Happy: the speaker truly loves the rain"}, {"he": "ניטרלי: הדובר רק מדווח על מזג האוויר בלי להביע רגש", "ar": "محايد: المتكلم ينقل حالة الطقس فقط دون أن يعبّر عن شعور", "ru": "Нейтральный: говорящий лишь сообщает о погоде, без чувств", "en": "Neutral: the speaker only reports the weather and shows no feeling"}, {"he": "כועס על אדם מסוים", "ar": "غاضب من شخص معيّن", "ru": "Сердитый на определённого человека", "en": "Angry at a specific person"}],0,{"he": "קראו את השורה הראשונה. האם הדובר שמח?", "ar": "اقرأوا السطر الأول. هل المتكلم سعيد؟", "ru": "Прочтите первую строку. Говорящий рад?", "en": "Read the first line. Is the speaker happy?"},{"he": "השורה הראשונה מתארת בדידות. לכן ״איזה יופי״ אינו מחמאה. זו אירוניה: אומרים דבר אחד ומתכוונים להפך.", "ar": "السطر الأول يصف الوحدة. لذلك «يا للروعة» ليست مديحًا. هذه سخرية: نقول شيئًا ونقصد عكسه.", "ru": "Первая строка описывает одиночество. Поэтому «какая красота» — не похвала. Это ирония: говорят одно, а имеют в виду обратное.", "en": "The first line describes loneliness. So “how lovely” is not praise. This is irony: saying one thing and meaning the opposite."},null,[null, {"he": "״שוב אני לבד״ לפני כן מראה שאין כאן שמחה אמיתית.", "ar": "«وحدي مجددًا» قبلها تبيّن أنه لا فرح حقيقي.", "ru": "«Опять я один» показывает, что настоящей радости нет.", "en": "“Alone again” just before shows there is no real joy."}, {"he": "״איזה יופי, באמת״ הוא תגובה רגשית, ולא דיווח.", "ar": "«يا للروعة، حقًا» رد عاطفي، لا مجرد خبر.", "ru": "«Какая красота, правда» — это эмоция, а не сводка.", "en": "“How lovely, really” is an emotional reaction, not a report."}, {"he": "אין בשיר אדם שהדובר פונה אליו בכעס.", "ar": "لا يوجد في القصيدة شخص يخاطبه المتكلم بغضب.", "ru": "В стихах нет человека, на которого он сердится.", "en": "There is no person in the poem the speaker is angry at."}]),
  Q("pl-2-04",{"he": "בשיר מקורי: ״ויהי ערב ויהי בוקר, / ואני עדיין מחכה לטלפון.״ מה עושה השורה הראשונה?", "ar": "في قصيدة أصلية: «وكان مساء وكان صباح، / وما زلت أنتظر الهاتف.» ماذا يفعل السطر الأول؟", "ru": "В новом стихотворении: «И был вечер, и было утро, / а я всё жду звонка.» Что делает первая строка?", "en": "An original poem: “And there was evening and there was morning, / and I am still waiting for the phone.” What does the first line do?"},[{"he": "מתארת רק את השעה שבה הדובר קם בבוקר", "ar": "تصف فقط الساعة التي يستيقظ فيها المتكلم", "ru": "Лишь сообщает, когда говорящий проснулся", "en": "It only tells when the speaker woke up"}, {"he": "רומזת לסיפור הבריאה ויוצרת ניגוד להמתנה קטנה", "ar": "تشير إلى قصة الخلق وتصنع تضادًا مع انتظار صغير", "ru": "Отсылает к сотворению мира и контрастирует с мелким ожиданием", "en": "It points to the Creation story and contrasts with a small wait"}, {"he": "מוכיחה שהשיר הוא שיר דתי שנועד לתפילה בבית הכנסת", "ar": "تثبت أن القصيدة دينية كُتبت للصلاة في مكان العبادة", "ru": "Доказывает, что это религиозный текст, написанный для молитвы в синагоге", "en": "It proves the poem is a religious text meant for prayer in synagogue"}, {"he": "אין לה קשר לשורה השנייה", "ar": "لا علاقة له بالسطر الثاني", "ru": "Она никак не связана со второй строкой", "en": "It has no link to the second line"}],1,{"he": "היכן שמעתם כבר את המילים ״ויהי ערב ויהי בוקר״?", "ar": "أين سمعتم من قبل «وكان مساء وكان صباح»؟", "ru": "Где вы уже слышали «и был вечер, и было утро»?", "en": "Where have you heard “there was evening and there was morning” before?"},{"he": "המשפט לקוח מסיפור הבריאה בספר בראשית. שם בכל יום נברא חלק חדש של העולם. אצל הדובר עובר יום שלם, ורק מחכים לטלפון.", "ar": "الجملة مأخوذة من قصة الخلق في سفر التكوين. هناك يُخلق في كل يوم جزء جديد من العالم. أما المتكلم فيمر عليه يوم كامل وهو ينتظر الهاتف فقط.", "ru": "Фраза взята из рассказа о сотворении мира в книге Бытия. Там в каждый день творится новая часть мира. У говорящего проходит день, а он лишь ждёт звонка.", "en": "The phrase comes from the Creation story in Genesis. There, each day brings a new part of the world into being. For the speaker, a whole day passes in just waiting for a call."},null,[{"he": "המילים לקוחות ממקור מוכר, ולכן הן יותר מציון שעה.", "ar": "الكلمات مأخوذة من مصدر معروف، فهي أكثر من تحديد وقت.", "ru": "Слова взяты из известного источника, это больше, чем время суток.", "en": "The words come from a known source, so they are more than a time of day."}, null, {"he": "רמיזה למקרא אינה הופכת שיר לתפילה.", "ar": "الإشارة إلى نص ديني لا تجعل القصيدة صلاة.", "ru": "Отсылка к Библии не превращает стихи в молитву.", "en": "An allusion to the Bible does not turn a poem into a prayer."}, {"he": "הניגוד בין שתי השורות הוא בדיוק מה שיוצר את המשמעות.", "ar": "التضاد بين السطرين هو ما يصنع المعنى.", "ru": "Именно контраст двух строк и создаёт смысл.", "en": "The contrast between the two lines is exactly what makes the meaning."}]),
  Q("pl-2-05",{"he": "בשיר מקורי: ״הבית נשאר מאחור, / ואני לא יודע לאן אני שייך.״ תלמיד כותב: ״בית״ הוא רק בניין. מה התגובה הטובה ביותר?", "ar": "في قصيدة أصلية: «بقي البيت خلفي، / ولا أعرف إلى أين أنتمي.» يكتب طالب: «البيت» مبنى فقط. ما أفضل رد؟", "ru": "В новом стихотворении: «Дом остался позади, / и я не знаю, где моё место.» Ученик пишет: «дом» — это только здание. Какой ответ лучше?", "en": "An original poem: “The house stayed behind, / and I do not know where I belong.” A student writes: “house” is only a building. What is the best reply?"},[{"he": "התלמיד צודק, כי מילה בשיר יכולה לומר תמיד רק דבר אחד ולא יותר", "ar": "الطالب محق، لأن الكلمة في القصيدة لا تعني أبدًا إلا شيئًا واحدًا فقط", "ru": "Ученик прав: слово в стихах всегда может значить только что-то одно", "en": "The student is right, because a word in a poem can mean only one thing"}, {"he": "״בית״ הוא תמיד סמל של מוות בשירה", "ar": "«البيت» دائمًا رمز للموت في الشعر", "ru": "«Дом» в поэзии всегда символ смерти", "en": "“House” is always a symbol of death in poetry"}, {"he": "״בית״ רומז גם לשייכות, כמו שמראה השורה השנייה", "ar": "«البيت» يشير أيضًا إلى الانتماء، كما يبيّن السطر الثاني", "ru": "«Дом» означает и принадлежность, это видно по второй строке", "en": "“House” also suggests belonging, as the second line shows"}, {"he": "אי אפשר לדעת, ולכן לא כדאי לכתוב על זה", "ar": "لا يمكن أن نعرف، فلا داعي للكتابة عن ذلك", "ru": "Узнать нельзя, поэтому писать об этом не стоит", "en": "We cannot know, so it is better not to write about it"}],2,{"he": "מה אומרת השורה השנייה על הרגש של הדובר?", "ar": "ماذا يقول السطر الثاني عن شعور المتكلم؟", "ru": "Что вторая строка говорит о чувстве говорящего?", "en": "What does the second line say about the speaker’s feeling?"},{"he": "השורה השנייה עוסקת בשייכות, ולא במבנה. לכן ״בית״ הוא גם מקום וגם תחושה. קריאה טובה נשענת על מילה מן השיר.", "ar": "السطر الثاني عن الانتماء، لا عن مبنى. لذلك «البيت» مكان وشعور معًا. القراءة الجيدة تعتمد على كلمة من القصيدة.", "ru": "Вторая строка о принадлежности, а не о здании. Значит, «дом» — и место, и чувство. Хорошее прочтение опирается на слово из текста.", "en": "The second line is about belonging, not a building. So “house” is both a place and a feeling. A good reading rests on a word from the poem."},null,[{"he": "מילה בשיר יכולה לשאת יותר ממשמעות אחת.", "ar": "قد تحمل الكلمة في القصيدة أكثر من معنى.", "ru": "Слово в стихах может нести больше одного смысла.", "en": "A word in a poem can carry more than one meaning."}, {"he": "אין סמל קבוע לכל מילה; הפירוש בא מן ההקשר.", "ar": "لا رمز ثابتًا لكل كلمة؛ المعنى يأتي من السياق.", "ru": "У слова нет постоянного символа; смысл даёт контекст.", "en": "No word has one fixed symbol; meaning comes from context."}, null, {"he": "יש ראיה בשיר: המילה ״שייך״ בשורה השנייה.", "ar": "في القصيدة قرينة: كلمة «أنتمي» في السطر الثاني.", "ru": "В тексте есть опора: слово «место» во второй строке.", "en": "There is evidence in the poem: the word “belong” in line two."}]),
  Q("pl-2-06",{"he": "בשיר מקורי: ״את תמיד הולכת / לפני שאני מספיק לומר.״ אל מי פונה הדובר?", "ar": "في قصيدة أصلية: «أنتِ تذهبين دائمًا / قبل أن أتمكن من الكلام.» إلى من يتوجه المتكلم؟", "ru": "В новом стихотворении: «Ты всегда уходишь сама, / прежде чем я успею сказать.» К кому обращается говорящий?", "en": "An original poem (in a feminine “you”): “You always leave / before I manage to speak.” Whom does the speaker address?"},[{"he": "אל עצמו בלבד", "ar": "إلى نفسه فقط", "ru": "Только к самому себе", "en": "Only to himself"}, {"he": "אל הקורא, כי כל ״את״ בשיר פונה תמיד אל מי שקורא אותו", "ar": "إلى القارئ، لأن كل «أنتِ» في القصيدة موجّه دائمًا إلى من يقرأها", "ru": "К читателю: любое «ты» в стихах всегда обращено к читателю", "en": "To the reader, because every “you” in a poem always means whoever reads it"}, {"he": "אל המשורר שכתב את השיר", "ar": "إلى الشاعر الذي كتب القصيدة", "ru": "К поэту, который написал стихи", "en": "To the poet who wrote the poem"}, {"he": "אל אישה שהוא מדבר אליה בגוף שני", "ar": "إلى امرأة يخاطبها بضمير المخاطَب", "ru": "К женщине, к которой он обращается на «ты»", "en": "A woman he speaks to directly as “you”"}],3,{"he": "בדקו את כינוי הגוף בשורה הראשונה.", "ar": "افحصوا الضمير في السطر الأول.", "ru": "Посмотрите на местоимение в первой строке.", "en": "Check the pronoun in the first line."},{"he": "״את״ היא פנייה ישירה בלשון נקבה. מכאן שהנמענת היא אישה מסוימת. הדובר אף פעם אינו מספיק לומר לה את מה שרצה.", "ar": "«أنتِ» خطاب مباشر بصيغة المؤنث. إذن المخاطَبة امرأة معيّنة. المتكلم لا يتمكن أبدًا من قول ما أراد لها.", "ru": "«Сама» показывает, что «ты» здесь — женщина. Значит, адресат — конкретная женщина. Говорящий не успевает ей сказать.", "en": "The Hebrew “you” here is feminine and direct. So the addressee is a particular woman. The speaker never gets the chance to talk to her."},null,[{"he": "״את״ היא גוף שני, ולכן יש כאן מישהי אחרת.", "ar": "«أنتِ» ضمير مخاطَب، فهناك شخص آخر.", "ru": "«Ты» — второе лицо, значит, есть кто-то другой.", "en": "“You” is second person, so someone else is there."}, {"he": "״את״ בלשון נקבה מצביעה על דמות מסוימת, ולא על כל קורא.", "ar": "«أنتِ» بصيغة المؤنث تشير إلى شخصية معيّنة، لا إلى كل قارئ.", "ru": "Форма женского рода указывает на конкретного человека, а не на любого читателя.", "en": "The feminine “you” points to a specific person, not to any reader."}, {"he": "המשורר יצר את הקול, אבל הדובר אינו פונה אליו.", "ar": "الشاعر صنع الصوت، لكن المتكلم لا يخاطبه.", "ru": "Поэт создал голос, но говорящий обращается не к нему.", "en": "The poet created the voice, but the speaker does not address him."}, null])],
 [
  Q("lit-poetry-8282-4",{"he": "איזה תיאור מתאים למרווח פרשנות?", "ar": "أي وصف يناسب مجال التأويل؟", "ru": "Какое описание подходит к «Пространство толкования»?", "en": "Which description fits room for interpretation?"},[{"he": "הקול שמדבר בשיר; אין לזהותו אוטומטית עם המשורר האמיתי.", "ar": "الصوت الذي يتكلم في القصيدة؛ ليس بالضرورة الشاعر الحقيقي.", "ru": "Голос в стихотворении, не обязательно сам реальный поэт.", "en": "The voice speaking in a poem, not automatically the real poet."},{"he": "מי שהדובר פונה אליו, אם יש פנייה בטקסט.", "ar": "من يوجّه إليه المتكلم كلامه إن وجد خطاب في النص.", "ru": "Тот, к кому обращается говорящий, если обращение есть.", "en": "The person or thing addressed by the speaker, when the poem makes an address."},{"he": "מעבר בעמדה הרגשית של הדובר, למשל מתקווה לספק.", "ar": "انتقال موقف المتكلم العاطفي، مثل الانتقال من الأمل إلى الشك.", "ru": "Переход в эмоциональном отношении говорящего, например от надежды к сомнению.", "en": "A change in the speaker’s attitude, for example from hope to doubt."},{"he": "מקום שבו הטקסט אינו מכריע פירוש אחד ויש לבסס אפשרויות בפרטים.", "ar": "موضع لا يحسم فيه النص معنى واحدًا وتحتاج فيه القراءات إلى قرائن.", "ru": "Место, где текст допускает разные прочтения, каждое с опорой на детали.", "en": "A place where the text leaves more than one reading possible, each needing evidence."}],3,{"he": "חפשו את הפרט שמבדיל אותו מן האחרים.", "ar": "ابحثوا عن التفصيل الذي يميزه عن غيره.", "ru": "Ищите отличие от остальных вариантов.", "en": "Look for the detail that separates it from the others."},{"he": "אפשרויות שונות אינן רשות להתעלם ממילות השיר.", "ar": "تعدد القراءات لا يبيح تجاهل كلمات القصيدة.", "ru": "Разные прочтения не означают игнорирования слов стихотворения.", "en": "Multiple readings do not license ignoring the poem’s words."},null,[{"he": "זה מתאר את דובר בשיר, לא את מרווח פרשנות.", "ar": "هذا يصف المتكلم في القصيدة، لا مجال التأويل.", "ru": "Это описание «Лирический говорящий», а не «Пространство толкования».", "en": "That describes speaker in a poem, not room for interpretation."},{"he": "זה מתאר את נמען, לא את מרווח פרשנות.", "ar": "هذا يصف المخاطَب، لا مجال التأويل.", "ru": "Это описание «Адресат», а не «Пространство толкования».", "en": "That describes addressee, not room for interpretation."},{"he": "זה מתאר את שינוי בטון, לא את מרווח פרשנות.", "ar": "هذا يصف تحول النبرة، لا مجال التأويل.", "ru": "Это описание «Смена тона», а не «Пространство толкования».", "en": "That describes shift in tone, not room for interpretation."},null])
 ,Q("lit-poetry2-ambi",{"he": "איזה תיאור מתאים לאמביוולנטיות?", "ar": "أي وصف يناسب الازدواجية الوجدانية؟", "ru": "Какое описание подходит к амбивалентность?", "en": "Which description fits ambivalence?"},[{"he": "הפניה קצרה ליצירה או למקור אחר, שהקורא מוזמן לזהות.", "ar": "إحالة موجزة إلى عمل أو مصدر آخر، يُدعى القارئ للتعرف إليه.", "ru": "Краткое указание на другое произведение или источник, который читателю предлагается узнать.", "en": "A brief reference to another work or source that the reader is invited to recognize."},{"he": "מעבר בין עבר להווה בשיר, המשנה את נקודת המבט של הדובר.", "ar": "انتقال بين الماضي والحاضر في القصيدة يغيّر زاوية نظر المتحدث.", "ru": "Переход между прошлым и настоящим в стихотворении, меняющий точку зрения говорящего.", "en": "A move between past and present in the poem, changing the speaker's viewpoint."},{"he": "נוכחות של שתי תחושות מנוגדות כלפי אותו דבר, זו לצד זו.", "ar": "حضور شعورين متناقضين تجاه الشيء نفسه، جنبًا إلى جنب.", "ru": "Присутствие двух противоположных чувств к одному и тому же рядом друг с другом.", "en": "The presence of two opposing feelings toward the same thing, side by side."},{"he": "רגע שבו השיר פונה לכיוון ההפוך ממה שהקורא ציפה לו.", "ar": "لحظة تنعطف فيها القصيدة عكس ما توقعه القارئ.", "ru": "Момент, когда стихотворение поворачивает против читательского ожидания.", "en": "The moment the poem turns against what the reader expected."}],2,{"he": "האם אפשר לאהוב ולשנוא בו זמנית?", "ar": "هل يمكن الحب والكره في وقت واحد؟", "ru": "Можно ли любить и ненавидеть одновременно?", "en": "Can one love and hate at the same time?"},{"he": "אמביוולנטיות מחזיקה שני קטבים יחד. למשל געגוע לאדם שגם פגע בדובר.", "ar": "الازدواجية تجمع قطبين معًا. مثال: اشتياق لشخص جرح المتحدث أيضًا.", "ru": "Амбивалентность держит два полюса вместе. Например, тоска по человеку, который также ранил говорящего.", "en": "Ambivalence holds two poles together. For example, longing for a person who also hurt the speaker."},null,[{"he": "זה מתאר את רמיזה, לא את אמביוולנטיות.", "ar": "هذا يصف التلميح، لا الازدواجية الوجدانية.", "ru": "Это описание «аллюзию», а не «амбивалентность».", "en": "That describes an allusion, not ambivalence."},{"he": "זה מתאר את מעבר זמן, לא את אמביוולנטיות.", "ar": "هذا يصف الانتقال الزمني، لا الازدواجية الوجدانية.", "ru": "Это описание «переход во времени», а не «амбивалентность».", "en": "That describes a time shift, not ambivalence."},null,{"he": "זה מתאר את שבירת ציפייה, לא את אמביוולנטיות.", "ar": "هذا يصف كسر التوقع، لا الازدواجية الوجدانية.", "ru": "Это описание «слом ожидания», а не «амбивалентность».", "en": "That describes a broken expectation, not ambivalence."}]),Q("lit-poetry2-allu-use",{"he": "בשיר מופיע המשפט \"וכל הארץ מלאה קול שופר\". תלמידה אומרת שזו רמיזה למקור מקראי, וחברה טוען שאסור לפרש כך כי לא צוטט במפורש. מי צודק?", "ar": "في قصيدة يظهر السطر «وامتلأت الأرض كلها بصوت الشوفار». تقول طالبة إن هذا تلميح إلى مصدر توراتي، ويدّعي زميلها أنه لا يجوز تفسيره هكذا لأنه لم يُقتبس صراحة. مَن المحق؟", "ru": "В стихотворении есть строка «И вся земля наполнилась звуком шофара». Ученица считает это аллюзией на библейский источник, а её товарищ утверждает, что так толковать нельзя, ведь прямой цитаты нет. Кто прав?", "en": "A poem contains the line \"And the whole land filled with the sound of the shofar.\" A student says it alludes to a biblical source; her peer claims one may not read it that way because nothing is quoted outright. Who is right?"},[{"he": "רמיזה אינה ציטוט; די בכך שהקורא מזהה את המקור", "ar": "التلميح ليس اقتباسًا، ويكفي أن يتعرف القارئ إلى المصدر", "ru": "Аллюзия — не цитата; достаточно, что читатель узнаёт источник", "en": "An allusion is not a quotation; the reader recognizing the source is enough"},{"he": "רמיזה חייבת ציטוט מלא במרכאות, ואחרת אין לפרש את הטקסט כך", "ar": "التلميح يتطلب اقتباسًا كاملًا بين علامتي تنصيص، وإلا فلا يجوز تأويل النص على هذا النحو", "ru": "Аллюзия требует полной цитаты в кавычках, иначе текст нельзя толковать таким образом", "en": "An allusion requires a full quotation in quotes, otherwise the text cannot be read that way"},{"he": "אסור לקשר שיר חדש למקורות ישנים", "ar": "لا يجوز ربط قصيدة جديدة بمصادر قديمة", "ru": "Нельзя связывать новое стихотворение со старыми источниками", "en": "A new poem may not be linked to old sources"},{"he": "רק המשורר רשאי לאשר שקיימת רמיזה", "ar": "الشاعر وحده يحق له تأكيد وجود تلميح", "ru": "Только поэт вправе подтвердить наличие аллюзии", "en": "Only the poet may confirm that an allusion exists"}],0,{"he": "מה מבדיל רמיזה מציטוט?", "ar": "ما الذي يميّز التلميح عن الاقتباس؟", "ru": "Чем аллюзия отличается от цитаты?", "en": "What distinguishes an allusion from a quotation?"},{"he": "רמיזה בנויה על זיהוי של הקורא. למשל \"קול שופר\" מעורר מקור מוכר גם בלי מרכאות, והקשר בטקסט הוא שיקבע.", "ar": "التلميح مبني على تعرّف القارئ. مثال: «صوت الشوفار» يستدعي مصدرًا مألوفًا دون علامتي تنصيص، والسياق في النصّ هو الحكم.", "ru": "Аллюзия строится на узнавании читателем. Например, «звук шофара» вызывает известный источник и без кавычек, а контекст в тексте решает.", "en": "An allusion rests on the reader's recognition. For example, \"sound of the shofar\" evokes a familiar source even without quotation marks, and the text's context decides."},null,[null,{"he": "ציטוט מלא הוא דווקא הפך של רמיזה.", "ar": "الاقتباس الكامل هو عكس التلميح تمامًا.", "ru": "Полная цитата — как раз противоположность аллюзии.", "en": "A full quotation is exactly the opposite of an allusion."},{"he": "שירה חיה בשיח עם מקורות; זו אחת דרכיה.", "ar": "الشعر يحيا في حوار مع المصادر، وهذه إحدى طرقه.", "ru": "Поэзия живёт в диалоге с источниками; это один из её путей.", "en": "Poetry lives in dialogue with sources; this is one of its ways."},{"he": "הזיהוי נעשה בקריאה, ולא צריך רשות מהמשורר.", "ar": "التعرّف يحدث في القراءة ولا يحتاج إذن الشاعر.", "ru": "Узнавание происходит в чтении и не требует разрешения поэта.", "en": "Recognition happens in reading and needs no poet's permission."}]),
  Q("pl-3-01",{"he": "בשיר מקורי: ״החלון פתוח. / הציפור לא חזרה. / אני משאיר את החלון פתוח.״ איזו פרשנות נתמכת הכי טוב בטקסט?", "ar": "في قصيدة أصلية: «النافذة مفتوحة. / الطائر لم يعد. / أترك النافذة مفتوحة.» أي تفسير يدعمه النص أكثر؟", "ru": "В новом стихотворении: «Окно открыто. / Птица не вернулась. / Я оставляю окно открытым.» Какое толкование лучше всего опирается на текст?", "en": "An original poem: “The window is open. / The bird did not return. / I leave the window open.” Which reading is best supported by the text?"},[{"he": "הדובר עדיין מקווה, כי הוא בוחר להשאיר פתוח", "ar": "المتكلم ما زال يأمل، لأنه يختار ترك النافذة مفتوحة", "ru": "Он ещё надеется: он сам оставляет окно открытым", "en": "The speaker still hopes, since he chooses to leave it open"}, {"he": "הדובר כועס על הציפור ורוצה לגרש אותה", "ar": "المتكلم غاضب من الطائر ويريد طرده", "ru": "Говорящий злится на птицу и хочет прогнать её", "en": "The speaker is angry at the bird and wants to chase it away"}, {"he": "השיר עוסק בחום של הקיץ, ולכן החלון נשאר פתוח כל הלילה", "ar": "القصيدة عن حر الصيف، ولذلك تبقى النافذة مفتوحة طوال الليل", "ru": "Стихи о летней жаре, поэтому окно открыто всю ночь до утра", "en": "The poem is about summer heat, so the window stays open all night"}, {"he": "הדובר שכח לסגור את החלון", "ar": "المتكلم نسي إغلاق النافذة", "ru": "Говорящий забыл закрыть окно", "en": "The speaker forgot to close the window"}],0,{"he": "מה הדובר עושה בשורה האחרונה, ולמה זה חשוב?", "ar": "ماذا يفعل المتكلم في السطر الأخير، ولماذا يهم ذلك؟", "ru": "Что говорящий делает в последней строке и почему это важно?", "en": "What does the speaker do in the last line, and why does it matter?"},{"he": "הציפור לא חזרה, ובכל זאת הדובר משאיר את החלון פתוח. זו בחירה, ולא מקרה. לכן הקריאה ״הוא עדיין מקווה״ נשענת על מילה מן השיר.", "ar": "الطائر لم يعد، ومع ذلك يترك المتكلم النافذة مفتوحة. هذا اختيار، لا صدفة. لذلك قراءة «ما زال يأمل» تعتمد على كلمة من القصيدة.", "ru": "Птица не вернулась, но окно остаётся открытым. Это выбор, а не случай. Поэтому прочтение «он ещё надеется» опирается на слово из текста.", "en": "The bird did not return, yet the speaker leaves the window open. This is a choice, not chance. So the reading “he still hopes” rests on a word in the poem."},null,[null, {"he": "אין בשיר מילה של כעס; להפך, החלון נשאר פתוח לציפור.", "ar": "لا كلمة غضب في القصيدة؛ بل تبقى النافذة مفتوحة للطائر.", "ru": "В тексте нет гнева; напротив, окно оставлено для птицы.", "en": "There is no anger in the poem; the window is left open for the bird."}, {"he": "אין בשיר שום פרט על חום או על קיץ.", "ar": "لا تفصيل في القصيدة عن الحر أو الصيف.", "ru": "В стихах нет ни слова о жаре или лете.", "en": "Nothing in the poem mentions heat or summer."}, {"he": "״אני משאיר״ הוא פעולה מכוונת, ולא שכחה.", "ar": "«أترك» فعل مقصود، لا نسيان.", "ru": "«Я оставляю» — намеренное действие, а не забывчивость.", "en": "“I leave” is a deliberate act, not forgetting."}]),
  Q("pl-3-02",{"he": "בשיר מקורי הדובר כותב: ״אני כבר לא צריך אותך, / לא את הקול, לא את הצחוק.״ והשורה האחרונה: ״רק תגיד שאתה בסדר.״ מה חושף הסיום?", "ar": "في قصيدة أصلية يكتب المتكلم: «لم أعد أحتاجك، / لا صوتك ولا ضحكتك.» والسطر الأخير: «فقط قل إنك بخير.» ماذا تكشف الخاتمة؟", "ru": "В новом стихотворении: «Ты мне больше не нужен, / ни голос, ни смех.» А последняя строка: «Только скажи, что ты в порядке.» Что открывает конец?", "en": "An original poem says: “I don’t need you anymore, / not your voice, not your laugh.” The last line: “Just tell me you are okay.” What does the ending reveal?"},[{"he": "הדובר באמת שכח את האדם ואינו חושב עליו עוד בכלל", "ar": "المتكلم نسي الشخص حقًا ولم يعد يفكر فيه أبدًا بعد اليوم", "ru": "Говорящий правда забыл этого человека и больше о нём не думает", "en": "The speaker has truly forgotten the person and no longer thinks of him at all"}, {"he": "רגשות מעורבים: הדובר מתרחק, אך עדיין דואג", "ar": "مشاعر متضاربة: المتكلم يبتعد لكنه ما زال قلقًا", "ru": "Смешанные чувства: он отдаляется, но ещё тревожится", "en": "Mixed feelings: the speaker pulls away but still cares"}, {"he": "הדובר רוצה לנקום באדם", "ar": "المتكلم يريد الانتقام من الشخص", "ru": "Говорящий хочет отомстить", "en": "The speaker wants revenge on the person"}, {"he": "השורה האחרונה היא טעות, כי היא סותרת את ההתחלה", "ar": "السطر الأخير خطأ لأنه يناقض البداية", "ru": "Последняя строка — ошибка: она противоречит началу", "en": "The last line is a mistake, because it contradicts the opening"}],1,{"he": "האם השורה האחרונה מסכימה עם השורות הראשונות?", "ar": "هل يتفق السطر الأخير مع الأسطر الأولى؟", "ru": "Согласна ли последняя строка с первыми?", "en": "Does the last line agree with the first lines?"},{"he": "בהתחלה הדובר מצהיר שהוא לא צריך את האדם. בסוף הוא מבקש לדעת שהוא בסדר. הסתירה חושפת אמביוולנטיות: ריחוק ודאגה באותו הזמן.", "ar": "في البداية يعلن المتكلم أنه لا يحتاج الشخص. وفي النهاية يطلب أن يعرف أنه بخير. التناقض يكشف ازدواج الشعور: بُعد وقلق معًا.", "ru": "Сначала говорящий заявляет, что ему никто не нужен. В конце он просит сказать, что всё в порядке. Противоречие показывает амбивалентность: отдаление и забота сразу.", "en": "At first the speaker declares he does not need the person. At the end he asks to know he is okay. The contradiction shows ambivalence: distance and care at once."},null,[{"he": "מי ששכח לא היה מבקש לדעת שהאדם בסדר.", "ar": "من نسي لا يطلب أن يعرف أن الشخص بخير.", "ru": "Тот, кто забыл, не спрашивал бы, всё ли в порядке.", "en": "Someone who forgot would not ask whether the person is okay."}, null, {"he": "״תגיד שאתה בסדר״ היא בקשה של דאגה, לא של נקמה.", "ar": "«قل إنك بخير» طلب نابع من القلق، لا من الانتقام.", "ru": "«Скажи, что ты в порядке» — забота, а не месть.", "en": "“Tell me you are okay” is a request out of care, not revenge."}, {"he": "הסתירה מכוונת; היא מראה שני רגשות יחד.", "ar": "التناقض مقصود؛ يُظهر شعورين معًا.", "ru": "Противоречие намеренное: оно показывает два чувства сразу.", "en": "The contradiction is deliberate; it shows two feelings at once."}]),
  Q("pl-3-03",{"he": "תלמידה טוענת: ״הדובר מרגיש זר בעיר״. איזו ראיה מן השיר תתמוך בטענה בצורה הטובה ביותר?", "ar": "تكتب طالبة: «المتكلم يشعر بالغربة في المدينة». أي قرينة من القصيدة تدعم هذا أفضل دعم؟", "ru": "Ученица пишет: «Говорящий чувствует себя чужим в городе». Какое доказательство из стихов лучше всего это подтвердит?", "en": "A student claims: “The speaker feels like a stranger in the city.” Which evidence from the poem best supports this?"},[{"he": "השיר כתוב בשורות קצרות", "ar": "القصيدة مكتوبة بأسطر قصيرة", "ru": "Стихи написаны короткими строками", "en": "The poem is written in short lines"}, {"he": "המשורר נולד בכפר קטן, ולכן הוא בוודאי לא אהב את החיים בעיר", "ar": "وُلد الشاعر في قرية صغيرة، فهو بالتأكيد لم يحب حياة المدينة", "ru": "Поэт родился в деревне, значит, он точно не любил городскую жизнь", "en": "The poet was born in a small village, so he surely disliked city life"}, {"he": "השורה ״כולם יודעים לאן ללכת, חוץ ממני״", "ar": "السطر «الجميع يعرفون إلى أين يذهبون، إلا أنا»", "ru": "Строка «Все знают, куда идти, кроме меня»", "en": "The line “Everyone knows where to go, except me”"}, {"he": "המילה ״עיר״ מופיעה בשיר 3 פעמים", "ar": "كلمة «مدينة» تظهر في القصيدة 3 مرات", "ru": "Слово «город» встречается в стихах 3 раза", "en": "The word “city” appears in the poem 3 times"}],2,{"he": "חפשו ראיה שאומרת משהו על הרגש של הדובר.", "ar": "ابحثوا عن قرينة تقول شيئًا عن شعور المتكلم.", "ru": "Ищите довод, который говорит о чувстве говорящего.", "en": "Look for evidence that says something about the speaker’s feeling."},{"he": "ראיה טובה מחוברת ישירות לטענה. השורה ״חוץ ממני״ מראה שהדובר מרגיש בחוץ, כשכולם שייכים. פרטים על צורה או על חיי המשורר חלשים יותר.", "ar": "القرينة الجيدة ترتبط مباشرة بالادعاء. السطر «إلا أنا» يبيّن أن المتكلم يشعر بأنه خارج الجماعة. تفاصيل الشكل أو حياة الشاعر أضعف.", "ru": "Хороший довод прямо связан с утверждением. Строка «кроме меня» показывает, что говорящий вне общего круга. Форма или биография поэта — слабее.", "en": "Good evidence is tied directly to the claim. “Except me” shows the speaker feels left out while everyone belongs. Details about form or the poet’s life are weaker."},null,[{"he": "שורות קצרות לבדן אינן מעידות על תחושת זרות.", "ar": "الأسطر القصيرة وحدها لا تدل على الغربة.", "ru": "Короткие строки сами по себе не говорят о чуждости.", "en": "Short lines alone do not show a sense of being a stranger."}, {"he": "זו ביוגרפיה של המשורר, ולא ראיה מן השיר על הדובר.", "ar": "هذه سيرة الشاعر، لا قرينة من القصيدة عن المتكلم.", "ru": "Это биография поэта, а не доказательство из текста.", "en": "That is the poet’s biography, not evidence from the poem."}, null, {"he": "מספר מופעים מראה שהעיר חשובה, אבל לא מה הדובר מרגיש בה.", "ar": "عدد المرات يبيّن أهمية المدينة، لا شعور المتكلم فيها.", "ru": "Число повторов показывает важность города, но не чувство.", "en": "A count shows the city matters, not how the speaker feels there."}]),
  Q("pl-3-04",{"he": "בשיר מקורי: ״חלב. ביצים. / תרופות לאבא. / לא, כבר לא צריך.״ מה עושה השורה האחרונה?", "ar": "في قصيدة أصلية: «حليب. بيض. / أدوية لأبي. / لا، لم نعد بحاجة.» ماذا يفعل السطر الأخير؟", "ru": "В новом стихотворении: «Молоко. Яйца. / Лекарства для папы. / Нет, уже не нужно.» Что делает последняя строка?", "en": "An original poem: “Milk. Eggs. / Medicine for Dad. / No, not needed anymore.” What does the last line do?"},[{"he": "מראה שהדובר החליט לחסוך כסף בקניות", "ar": "تبيّن أن المتكلم قرر توفير المال في المشتريات", "ru": "Показывает, что говорящий решил сэкономить", "en": "It shows the speaker decided to save money on shopping"}, {"he": "מוכיחה שהאב החלים לגמרי ויצא מבית החולים בריא ושלם", "ar": "تثبت أن الأب شُفي تمامًا وخرج من المستشفى سالمًا", "ru": "Доказывает, что папа полностью выздоровел и вышел из больницы", "en": "It proves the father fully recovered and left the hospital well"}, {"he": "היא עוד פריט ברשימת הקניות, בלי משמעות מיוחדת", "ar": "هي بند آخر في قائمة المشتريات بلا معنى خاص", "ru": "Это ещё один пункт списка без особого смысла", "en": "It is one more item on the list, with no special meaning"}, {"he": "רומזת לאובדן של האב בלי לומר זאת במפורש", "ar": "تلمّح إلى فقدان الأب دون أن تقوله صراحة", "ru": "Намекает на потерю отца, не говоря об этом прямо", "en": "It hints at the father’s loss without saying it outright"}],3,{"he": "למה מישהו מוחק תרופות מרשימה, ומה המילה ״כבר״ מוסיפה?", "ar": "لماذا يحذف أحد الأدوية من القائمة، وماذا تضيف «لم نعد»؟", "ru": "Почему лекарства вычёркивают из списка и что добавляет «уже»?", "en": "Why would someone cross medicine off a list, and what does “anymore” add?"},{"he": "הלשון היא של רשימת קניות רגילה. השורה האחרונה מוחקת את התרופות, ו״כבר לא״ מרמז שהאב איננו. הפשטות הופכת את האובדן לחד יותר.", "ar": "اللغة لغة قائمة مشتريات عادية. السطر الأخير يحذف الأدوية، و«لم نعد» يوحي بأن الأب رحل. البساطة تجعل الفقد أشد.", "ru": "Язык — как у обычного списка покупок. Последняя строка вычёркивает лекарства, а «уже не» намекает, что отца нет. Простота делает потерю острее.", "en": "The language is that of a plain shopping list. The last line crosses out the medicine, and “not anymore” hints the father is gone. The plainness makes the loss sharper."},null,[{"he": "אין בשיר פרט על כסף או על חיסכון.", "ar": "لا تفصيل في القصيدة عن المال أو التوفير.", "ru": "В стихах нет ни слова о деньгах.", "en": "Nothing in the poem is about money or saving."}, {"he": "אין בשיר מילה על החלמה; ״כבר לא״ מרמז דווקא על סוף.", "ar": "لا كلمة عن الشفاء؛ «لم نعد» توحي بالنهاية.", "ru": "О выздоровлении ни слова; «уже не» намекает на конец.", "en": "Nothing mentions recovery; “not anymore” hints at an end."}, {"he": "השורה שוברת את הרשימה, ולכן היא אינה עוד פריט.", "ar": "السطر يكسر القائمة، فهو ليس بندًا آخر.", "ru": "Строка ломает список, это не очередной пункт.", "en": "The line breaks the list, so it is not just another item."}, null]),
  Q("pl-3-05",{"he": "בשיר מקורי: ״לא ירדתי אל גינת אגוז, / ירדתי אל החניון.״ השורה רומזת לשיר השירים: ״אל גנת אגוז ירדתי״. מה יוצר הפער?", "ar": "في قصيدة أصلية: «لم أنزل إلى جنة الجوز، / نزلت إلى موقف السيارات.» السطر يشير إلى نشيد الأنشاد: «نزلت إلى جنة الجوز». ماذا يصنع الفرق؟", "ru": "В новом стихотворении: «Я не сошёл в ореховый сад, / я сошёл на парковку.» Строка отсылает к Песни песней: «Я сошла в ореховый сад». Что создаёт разрыв?", "en": "An original poem: “I did not go down to the garden of nuts, / I went down to the parking lot.” It points to the Song of Songs: “I went down into the garden of nuts.” What does the gap create?"},[{"he": "הוכחה שהדובר אינו מכיר את המקרא", "ar": "دليلًا على أن المتكلم لا يعرف النص القديم", "ru": "Доказательство, что говорящий не знает Библию", "en": "Proof that the speaker does not know the Bible"}, {"he": "ניגוד בין עולם אהבה ציורי למציאות עירונית אפורה", "ar": "تضادًا بين عالم حب شاعري وواقع مدني رمادي", "ru": "Контраст между поэтичным миром любви и серым городом", "en": "A contrast between a lyrical world of love and grey city life"}, {"he": "תיאור מדויק של מקום החניה", "ar": "وصفًا دقيقًا لمكان الموقف", "ru": "Точное описание места парковки", "en": "An exact description of where the car is parked"}, {"he": "שבח לחניון, שהוא מקום יפה יותר מכל גן שמופיע בשירה הישנה", "ar": "مدحًا للموقف، فهو أجمل من أي بستان في الشعر القديم", "ru": "Похвалу парковке: она красивее любого сада из старой поэзии", "en": "Praise for the parking lot as more beautiful than any garden in old poetry"}],1,{"he": "השוו את המקום שבמקור למקום שאליו הגיע הדובר.", "ar": "قارنوا المكان في المصدر بالمكان الذي وصل إليه المتكلم.", "ru": "Сравните место в источнике и место, куда пришёл говорящий.", "en": "Compare the place in the source with where the speaker ended up."},{"he": "במקור הגן הוא מקום של אהבה ופריחה. הדובר מחליף אותו בחניון. הרמיזה מבליטה את מה שחסר בחייו של הדובר.", "ar": "في المصدر البستان مكان حب وازدهار. المتكلم يستبدل به موقف سيارات. الإشارة تبرز ما ينقص حياة المتكلم.", "ru": "В источнике сад — место любви и цветения. Говорящий меняет его на парковку. Отсылка подчёркивает, чего не хватает в его жизни.", "en": "In the source the garden is a place of love and blossoming. The speaker swaps it for a parking lot. The allusion highlights what is missing in his life."},null,[{"he": "מי שרומז למקור מכיר אותו; הוא משתמש בו בכוונה.", "ar": "من يشير إلى مصدر يعرفه؛ ويستعمله عن قصد.", "ru": "Кто делает отсылку, тот знает источник и использует его намеренно.", "en": "Someone who alludes to a source knows it and uses it on purpose."}, null, {"he": "הקריאה הזאת מתעלמת מן הרמיזה, שהיא עיקר השורה.", "ar": "هذه القراءة تتجاهل الإشارة، وهي جوهر السطر.", "ru": "Это прочтение не видит отсылки — главного в строке.", "en": "This reading ignores the allusion, which is the heart of the line."}, {"he": "המבנה ״לא... אלא...״ מראה אכזבה, ולא שבח.", "ar": "البناء «لم... بل...» يدل على خيبة، لا على مدح.", "ru": "Конструкция «не... а...» выражает разочарование, а не похвалу.", "en": "The “not... but...” pattern shows disappointment, not praise."}]),
  Q("pl-3-06",{"he": "בשיר מקורי הדובר אומר: ״אני לומד לשתוק.״ אפשר לקרוא זאת ככאב של מי שהשתיקו אותו, או כרוגע של מי שהתבגר. מה הדרך הנכונה לענות בבגרות?", "ar": "في قصيدة أصلية يقول المتكلم: «أتعلم أن أصمت.» يمكن قراءة ذلك ألمًا لمن أُسكت، أو هدوءًا لمن نضج. ما الطريقة الصحيحة للإجابة في البجروت؟", "ru": "В новом стихотворении: «Я учусь молчать». Это можно прочесть как боль того, кого заставили молчать, или как покой взрослого. Как правильно ответить на экзамене?", "en": "An original poem says: “I am learning to be silent.” It can be read as the pain of someone silenced, or the calm of someone who matured. What is the right way to answer in the exam?"},[{"he": "לבחור קריאה אחת ולהתעלם מן השנייה, כי לשאלה יש תמיד רק תשובה נכונה אחת", "ar": "اختيار قراءة واحدة وتجاهل الأخرى، لأن للسؤال دائمًا إجابة صحيحة واحدة", "ru": "Выбрать одно прочтение и забыть второе: правильный ответ всегда один", "en": "Pick one reading and ignore the other, since a question always has only one right answer"}, {"he": "לכתוב שהשיר לא ברור, ולכן אין לו משמעות", "ar": "الكتابة بأن القصيدة غامضة ولذلك لا معنى لها", "ru": "Написать, что стихи неясны и потому бессмысленны", "en": "Write that the poem is unclear, so it has no meaning"}, {"he": "להציג את שתי הקריאות ולבסס כל אחת בפרט מן השיר", "ar": "عرض القراءتين ودعم كل منهما بتفصيل من القصيدة", "ru": "Показать оба прочтения и подтвердить каждое деталью из текста", "en": "Present both readings and support each with a detail from the poem"}, {"he": "לחפש ראיון עם המשורר ולהעתיק את דבריו", "ar": "البحث عن مقابلة مع الشاعر ونسخ كلامه", "ru": "Найти интервью поэта и переписать его слова", "en": "Look for an interview with the poet and copy his words"}],2,{"he": "האם שיר חייב להכריע בין שתי האפשרויות?", "ar": "هل يجب أن تحسم القصيدة بين الاحتمالين؟", "ru": "Обязаны ли стихи выбрать одно из двух?", "en": "Must a poem decide between the two options?"},{"he": "כשיש דו־משמעות, תשובה חזקה מציגה את שתי הקריאות. כל קריאה צריכה פרט מן השיר שתומך בה. כך מראים הבנה, ולא רק דעה.", "ar": "حين يوجد ازدواج في المعنى، تعرض الإجابة القوية القراءتين. وكل قراءة تحتاج تفصيلًا من القصيدة يدعمها. هكذا نُظهر فهمًا لا مجرد رأي.", "ru": "При двусмысленности сильный ответ показывает оба прочтения. Каждому нужна опора в тексте. Так видно понимание, а не только мнение.", "en": "With ambiguity, a strong answer presents both readings. Each one needs a detail from the poem to support it. That shows understanding, not just opinion."},null,[{"he": "כשהשיר משאיר שתי אפשרויות, התעלמות מאחת מחלישה את התשובה.", "ar": "حين تترك القصيدة احتمالين، فتجاهل أحدهما يضعف الإجابة.", "ru": "Если текст допускает два прочтения, игнорировать одно — слабость.", "en": "When a poem leaves two options, ignoring one weakens the answer."}, {"he": "דו־משמעות היא משמעות עשירה, ולא חוסר משמעות.", "ar": "ازدواج المعنى غنى في المعنى، لا غياب له.", "ru": "Двусмысленность — это богатство смысла, а не его отсутствие.", "en": "Ambiguity is rich meaning, not a lack of meaning."}, null, {"he": "בבחינה מפרשים מתוך הטקסט, ולא מתוך דברי המשורר מחוצה לו.", "ar": "في الامتحان نفسّر من النص، لا من كلام الشاعر خارجه.", "ru": "На экзамене толкуют текст, а не слова поэта вне его.", "en": "In the exam we interpret from the text, not from the poet’s words outside it."}])]]);

topic("lit-books-8282","8282",
  {"he": "ספרי קריאה ודרמה: קריאה עצמאית", "ar": "كتب القراءة والمسرح: قراءة مستقلة", "ru": "Книги и драма: самостоятельное чтение", "en": "Books and drama: independent reading"},
  {"he": "השוו אירוע, דמות ורעיון בלי לשנן ציטוטים", "ar": "قارنوا الحدث والشخصية والفكرة دون حفظ اقتباسات", "ru": "Сравните событие, героя и идею без заучивания цитат", "en": "Compare event, character and idea without memorised quotations"},
[ [
  Q("lit-books-8282-1",{"he": "איזה תיאור מתאים לציר העלילה?", "ar": "أي وصف يناسب مسار الحبكة؟", "ru": "Какое описание подходит к «Линия сюжета»?", "en": "Which description fits plot arc?"},[{"he": "רצף של מצב פתיחה, סיבוך ותוצאה שהמעשים מחברים ביניהם.", "ar": "تسلسل من وضع أولي وتعقيد ونتيجة تصل بينها الأفعال.", "ru": "Последовательность завязки, осложнения и исхода, связанная действиями.", "en": "An opening situation, complication and outcome linked by actions."},{"he": "דמות שפועלת לצד הדמות המרכזית ויכולה לחשוף בה צד חדש.", "ar": "شخصية تعمل بجانب الرئيسية وقد تكشف جانبًا جديدًا منها.", "ru": "Персонаж рядом с главным героем, помогающий раскрыть его иначе.", "en": "A character beside the central one who can reveal another side of them."},{"he": "רגע שבו החלטה או גילוי משנים את הכיוון של הסיפור או המחזה.", "ar": "لحظة يغيّر فيها قرار أو كشف مسار القصة أو المسرحية.", "ru": "Момент, когда решение или открытие меняет ход истории или пьесы.", "en": "A moment when a decision or revelation changes the course of the story or play."},{"he": "משפט על משמעות היצירה שדורש דוגמה והסבר מן הטקסט.", "ar": "قول عن معنى العمل يحتاج مثالًا وشرحًا من النص.", "ru": "Суждение о смысле произведения, требующее примера и объяснения из текста.", "en": "A statement about meaning that needs an example and explanation from the text."}],0,{"he": "חפשו את הפרט שמבדיל אותו מן האחרים.", "ar": "ابحثوا عن التفصيل الذي يميزه عن غيره.", "ru": "Ищите отличие от остальных вариантов.", "en": "Look for the detail that separates it from the others."},{"he": "הקשר הסיבתי בין האירועים חשוב מן הרשימה בלבד.", "ar": "العلاقة السببية بين الأحداث أهم من مجرد تعدادها.", "ru": "Причинная связь событий важнее простого перечня.", "en": "Causal links matter more than a list of events."},null,[null,{"he": "זה מתאר את דמות משנה, לא את ציר העלילה.", "ar": "هذا يصف شخصية ثانوية، لا مسار الحبكة.", "ru": "Это описание «Второстепенный персонаж», а не «Линия сюжета».", "en": "That describes supporting character, not plot arc."},{"he": "זה מתאר את סצנת מפתח, לא את ציר העלילה.", "ar": "هذا يصف مشهد محوري، لا مسار الحبكة.", "ru": "Это описание «Ключевая сцена», а не «Линия сюжета».", "en": "That describes key scene, not plot arc."},{"he": "זה מתאר את טענה פרשנית, לא את ציר העלילה.", "ar": "هذا يصف حجة تفسيرية، لا مسار الحبكة.", "ru": "Это описание «Интерпретационный тезис», а не «Линия сюжета».", "en": "That describes interpretive claim, not plot arc."}]),
  Q("lit-books-8282-2",{"he": "איזה מונח מתאים לתיאור: מי שפועל לצד הגיבור המרכזי ויכול לחשוף בו צד חדש?", "ar": "أي مصطلح يناسب الوصف: مَن يعمل بجانب البطل الرئيس وقد يكشف فيه جانبًا جديدًا؟", "ru": "Какой термин подходит к описанию: тот, кто действует рядом с главным героем и может открыть в нём новую сторону?", "en": "Which term fits the description: someone who acts beside the main hero and can reveal a new side of them?"},[{"he": "ציר העלילה", "ar": "مسار الحبكة", "ru": "Линия сюжета", "en": "Plot arc"},{"he": "דמות משנה", "ar": "شخصية ثانوية", "ru": "Второстепенный персонаж", "en": "Supporting character"},{"he": "דמות ראשית", "ar": "شخصية رئيسة", "ru": "Главный персонаж", "en": "Main character"},{"he": "מספר כל־יודע", "ar": "راوٍ عليم بكل شيء", "ru": "Всезнающий рассказчик", "en": "Omniscient narrator"}],1,{"he": "שימו לב: הוא פועל לצד הגיבור, לא במקומו.", "ar": "انتبهوا: هو يعمل بجانب البطل، لا مكانه.", "ru": "Обратите внимание: он действует рядом с героем, а не вместо него.", "en": "Notice: they act beside the hero, not in the hero's place."},{"he": "דמות משנה אינה במרכז העלילה, אבל דרכה אפשר לראות צד חדש בגיבור. למשל חבר שהגיבור מתוודה בפניו חושף את פחדיו.", "ar": "الشخصية الثانوية ليست في مركز الحبكة، لكن من خلالها نرى جانبًا جديدًا في البطل. مثال: صديق يعترف أمامه البطل فيكشف مخاوفه.", "ru": "Второстепенный персонаж не в центре сюжета, но через него мы видим героя с новой стороны. Например, друг, которому герой признаётся, раскрывает его страхи.", "en": "A supporting character is not at the centre of the plot, but through them we see a new side of the hero. For example, a friend the hero confides in reveals the hero's fears."},null,[{"he": "ציר העלילה הוא רצף האירועים, לא אדם שפועל בסיפור.", "ar": "مسار الحبكة هو تسلسل الأحداث، لا شخص يعمل في القصة.", "ru": "Линия сюжета — это цепь событий, а не человек в истории.", "en": "The plot arc is the sequence of events, not a person in the story."}, null, {"he": "הדמות הראשית היא הגיבור עצמו, לא מי שפועל לצידו.", "ar": "الشخصية الرئيسة هي البطل نفسه، لا مَن يعمل بجانبه.", "ru": "Главный персонаж — это сам герой, а не тот, кто рядом с ним.", "en": "The main character is the hero, not someone beside the hero."}, {"he": "המספר הכל־יודע מספר את הסיפור מבחוץ, ואינו פועל לצד הגיבור.", "ar": "الراوي العليم يروي القصة من الخارج، ولا يعمل بجانب البطل.", "ru": "Всезнающий рассказчик рассказывает историю извне и не действует рядом с героем.", "en": "The omniscient narrator tells the story from outside and does not act beside the hero."}])
 ,Q("lit-books-round",{"he": "איזה תיאור מתאים לדמות עגולה?", "ar": "أي وصف يناسب الشخصية المركّبة؟", "ru": "Какое описание подходит к круглого персонажа?", "en": "Which description fits a round character?"},[{"he": "דמות מורכבת בעלת פנים רבות, המשתנה ומתפתחת לאורך היצירה.", "ar": "شخصية مركّبة متعددة الأوجه، تتغير وتتطور على امتداد العمل.", "ru": "Сложный многогранный персонаж, меняющийся и развивающийся на протяжении произведения.", "en": "A complex, many-sided character who changes and develops through the work."},{"he": "התנאים החברתיים שבהם חיות הדמויות ושמשפיעים על בחירותיהן.", "ar": "الظروف الاجتماعية التي تعيش فيها الشخصيات وتؤثر في خياراتها.", "ru": "Социальные условия, в которых живут герои и которые влияют на их выбор.", "en": "The social conditions the characters live in, which shape their choices."},{"he": "האופן הייחודי שבו הכותב בונה משפטים ובוחר מילים.", "ar": "الطريقة المميزة التي يبني بها الكاتب الجمل ويختار الكلمات.", "ru": "Своеобразная манера автора строить фразы и выбирать слова.", "en": "The writer's distinctive way of building sentences and choosing words."},{"he": "רגע של מתח גבוה בתוך פרק, גם אם אינו שיא היצירה כולה.", "ar": "لحظة توتر عالٍ داخل فصل، حتى إن لم تكن ذروة العمل كله.", "ru": "Момент высокого напряжения внутри главы, даже если это не кульминация всего произведения.", "en": "A moment of high tension within a chapter, even if not the whole work's climax."}],0,{"he": "מי משתנה ומתפתח לאורך הספר?", "ar": "مَن يتغير ويتطور على امتداد الكتاب؟", "ru": "Кто меняется и развивается на протяжении книги?", "en": "Who changes and develops through the book?"},{"he": "דמות עגולה היא רב-פנים. למשל דמות שפותחת כאנוכית ומסיימת כמי שלומדת להקשיב.", "ar": "الشخصية المركّبة متعددة الأوجه. مثال: شخصية تبدأ أنانية وتنتهي بمن تعلّم الإصغاء.", "ru": "Круглый персонаж многогранен. Например, герой, начинающийся эгоистом и кончающий тем, кто научился слушать.", "en": "A round character is many-sided. For example, a character who starts selfish and ends having learned to listen."},null,[null,{"he": "זה מתאר את רקע חברתי, לא את דמות עגולה.", "ar": "هذا يصف الخلفية الاجتماعية، لا الشخصية المركّبة.", "ru": "Это описание «социальный фон», а не «круглого персонажа».", "en": "That describes a social background, not a round character."},{"he": "זה מתאר את סגנון, לא את דמות עגולה.", "ar": "هذا يصف الأسلوب، لا الشخصية المركّبة.", "ru": "Это описание «стиль», а не «круглого персонажа».", "en": "That describes a style, not a round character."},{"he": "זה מתאר את שיא מקומי, לא את דמות עגולה.", "ar": "هذا يصف ذروة محلية، لا الشخصية المركّبة.", "ru": "Это описание «локальную кульминацию», а не «круглого персонажа».", "en": "That describes a local peak, not a round character."}]),
  Q("bk-1-01",{"he": "מה ההבדל בין עלילה לבין נושא של יצירה?", "ar": "ما الفرق بين الحبكة وموضوع العمل الأدبي؟", "ru": "Чем сюжет отличается от темы произведения?", "en": "What is the difference between the plot and the theme of a work?"},[{"he": "הנושא הוא מה שקורה; העלילה היא הרעיון", "ar": "الموضوع هو ما يحدث؛ والحبكة هي الفكرة", "ru": "Тема — то, что происходит; сюжет — это идея", "en": "The theme is what happens; the plot is the idea"}, {"he": "העלילה היא מה שקורה; הנושא הוא הרעיון שהיצירה בוחנת", "ar": "الحبكة هي ما يحدث؛ والموضوع هو الفكرة التي يبحثها العمل", "ru": "Сюжет — то, что происходит; тема — идея книги", "en": "The plot is what happens; the theme is the idea the work explores"}, {"he": "אין הבדל, אלה שתי מילים שונות לאותו דבר בדיוק בכל יצירה", "ar": "لا فرق، فهما كلمتان مختلفتان للشيء نفسه تمامًا في كل عمل أدبي", "ru": "Разницы нет: это два слова для одного и того же в любой книге", "en": "There is no difference; they are two words for exactly the same thing"}, {"he": "העלילה היא שם הספר; הנושא הוא שם הסופר", "ar": "الحبكة هي اسم الكتاب؛ والموضوع هو اسم الكاتب", "ru": "Сюжет — название книги; тема — имя автора", "en": "The plot is the book’s title; the theme is the author’s name"}],1,{"he": "מה מספרים כשמסכמים, ומה מבינים כששואלים ״על מה זה באמת?״", "ar": "ماذا نروي حين نلخّص، وماذا نفهم حين نسأل «عمّ يتحدث حقًا؟»", "ru": "Что мы пересказываем и что понимаем, спрашивая «о чём это на самом деле?»", "en": "What do we retell in a summary, and what do we grasp by asking “what is it really about?”"},{"he": "העלילה היא רצף האירועים. הנושא הוא רעיון כללי, כמו חברות או בגידה. מסיפור על ריב בין אחים אפשר לגזור נושא כמו סליחה.", "ar": "الحبكة هي تسلسل الأحداث. الموضوع فكرة عامة مثل الصداقة أو الخيانة. من قصة شجار بين أخوين يمكن استخراج موضوع مثل التسامح.", "ru": "Сюжет — цепь событий. Тема — общая идея, например дружба или предательство. Из истории о ссоре братьев можно вывести тему прощения.", "en": "The plot is the chain of events. The theme is a general idea, like friendship or betrayal. A story about brothers who quarrel can have forgiveness as its theme."},null,[{"he": "זה ההפך: האירועים הם העלילה.", "ar": "هذا العكس: الأحداث هي الحبكة.", "ru": "Наоборот: события — это сюжет.", "en": "It is the reverse: the events are the plot."}, null, {"he": "אפשר לספר אותה עלילה ולמצוא בה נושאים שונים.", "ar": "يمكن رواية الحبكة نفسها وإيجاد مواضيع مختلفة فيها.", "ru": "В одном сюжете можно найти разные темы.", "en": "The same plot can hold different themes."}, {"he": "שם הספר ושם הסופר אינם עלילה ואינם נושא.", "ar": "اسم الكتاب واسم الكاتب ليسا حبكة ولا موضوعًا.", "ru": "Название и имя автора — не сюжет и не тема.", "en": "The title and the author’s name are neither plot nor theme."}]),
  Q("bk-1-02",{"he": "למה כדאי לבדוק את שם היצירה כשכותבים עליה?", "ar": "لماذا يفيد فحص عنوان العمل حين نكتب عنه؟", "ru": "Зачем смотреть на название произведения, когда пишешь о нём?", "en": "Why is it worth checking a work’s title when writing about it?"},[{"he": "השם קובע כמה פרקים יש בספר", "ar": "العنوان يحدد عدد فصول الكتاب", "ru": "Название определяет число глав", "en": "The title sets the number of chapters"}, {"he": "השם מגלה תמיד את סוף העלילה", "ar": "العنوان يكشف دائمًا نهاية الحبكة", "ru": "Название всегда раскрывает конец сюжета", "en": "The title always gives away the ending"}, {"he": "השם יכול לרמוז על רעיון מרכזי או על דמות חשובה", "ar": "قد يلمّح العنوان إلى فكرة مركزية أو شخصية مهمة", "ru": "Название может намекать на главную идею или важного героя", "en": "The title can hint at a central idea or an important character"}, {"he": "אין טעם, כי את השם בוחרת תמיד ההוצאה לאור בלי קשר לתוכן הספר", "ar": "لا فائدة، لأن دار النشر تختار العنوان دائمًا دون صلة بمضمون الكتاب", "ru": "Незачем: название всегда выбирает издательство, без связи с содержанием", "en": "There is no point, since the publisher always picks the title with no link to the content"}],2,{"he": "מה הקורא רואה עוד לפני שהוא פותח את הספר?", "ar": "ماذا يرى القارئ قبل أن يفتح الكتاب؟", "ru": "Что читатель видит ещё до того, как откроет книгу?", "en": "What does the reader see even before opening the book?"},{"he": "השם הוא המילה הראשונה שהקורא פוגש. הוא יכול להצביע על רעיון, על מקום או על דמות. לפעמים משמעותו מתבררת רק בסוף.", "ar": "العنوان أول ما يلقاه القارئ. قد يشير إلى فكرة أو مكان أو شخصية. وأحيانًا لا يتضح معناه إلا في النهاية.", "ru": "Название — первое, что встречает читатель. Оно может указывать на идею, место или героя. Иногда его смысл ясен только в конце.", "en": "The title is the first thing a reader meets. It can point to an idea, a place or a character. Sometimes its meaning becomes clear only at the end."},null,[{"he": "מספר הפרקים אינו תלוי בשם הספר.", "ar": "عدد الفصول لا يرتبط بالعنوان.", "ru": "Число глав не зависит от названия.", "en": "The number of chapters does not depend on the title."}, {"he": "שם יכול לרמוז, אבל הוא אינו מספר את הסוף.", "ar": "قد يلمّح العنوان، لكنه لا يروي النهاية.", "ru": "Название может намекать, но не раскрывает финал.", "en": "A title may hint, but it does not tell the ending."}, null, {"he": "ברוב היצירות השם קשור לתוכן, וכדאי לבדוק איך.", "ar": "في أغلب الأعمال يرتبط العنوان بالمضمون، ويفيد فحص كيف.", "ru": "Обычно название связано с содержанием, и стоит понять как.", "en": "In most works the title links to the content, and it is worth asking how."}]),
