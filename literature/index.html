on through a character."},null,[{"he": "המורה רגילה לכיתה, ולה הרהיטים לא ייראו ענקיים.", "ar": "المعلمة معتادة على الصف، فلن يبدو لها الأثاث ضخمًا.", "ru": "Учительница привыкла к классу, мебель ей не кажется огромной.", "en": "The teacher is used to the room; furniture would not seem huge to her."}, {"he": "אין בטקסט סימן למבט מקצועי על רהיטים.", "ar": "لا يوجد في النص ما يدل على نظرة مهنية إلى الأثاث.", "ru": "В тексте нет признаков профессионального взгляда на мебель.", "en": "Nothing in the text suggests a professional view of furniture."}, {"he": "התיאור מלא בפרטים שנראים, ולכן מישהו רואה אותם.", "ar": "الوصف مليء بتفاصيل مرئية، فهناك من يراها.", "ru": "Описание полно видимых деталей — значит, кто-то их видит.", "en": "The description is full of visible details, so someone sees them."}, null]),
  Q("sh-2-03",{"he": "המספר כותב: \"כולם בכיתה אוהבים אותי.\" אבל בהמשך אף אחד לא מתיישב לידו. מה אפשר להסיק?", "ar": "يكتب الراوي: \"الجميع في الصف يحبونني.\" لكن لاحقًا لا يجلس أحد بجانبه. ماذا نستنتج؟", "ru": "Рассказчик пишет: «Все в классе меня любят». Но потом никто не садится рядом с ним. Какой вывод можно сделать?", "en": "The narrator writes: \"Everyone in class loves me.\" But later no one sits next to him. What can we infer?"},[{"he": "המספר אינו מהימן; המעשים סותרים את דבריו", "ar": "الراوي غير موثوق؛ الأفعال تناقض كلامه", "ru": "Рассказчик ненадёжен: поступки других противоречат его словам", "en": "The narrator is unreliable; the actions contradict his words"}, {"he": "המספר יודע־כול ולכן הוא צודק", "ar": "الراوي عليم ولذلك هو محق", "ru": "Рассказчик всезнающий, значит, он прав", "en": "The narrator is omniscient, so he is right"}, {"he": "הסיפור מבלבל בכוונה ולכן אין בו שום משמעות שאפשר להבין", "ar": "القصة مربكة عمدًا ولذلك لا معنى فيها يمكن فهمه", "ru": "Рассказ нарочно запутан, поэтому в нём вообще нет понятного смысла", "en": "The story confuses on purpose, so it has no meaning to understand"}, {"he": "שאר התלמידים אינם דמויות בסיפור", "ar": "بقية التلاميذ ليسوا شخصيات في القصة", "ru": "Остальные ученики — не персонажи рассказа", "en": "The other students are not characters in the story"}],0,{"he": "השוו בין מה שנאמר לבין מה שקורה.", "ar": "قارنوا بين ما يُقال وما يحدث.", "ru": "Сравните сказанное и происходящее.", "en": "Compare what is said with what happens."},{"he": "כשהמעשים בסיפור סותרים את דברי המספר, אפשר לפקפק בו. מספר כזה נקרא מספר לא מהימן. הקורא לומד להבין יותר ממה שהמספר מודה בו.", "ar": "عندما تناقض الأحداث كلام الراوي، يمكن الشك فيه. يسمّى هذا الراوي غير موثوق. يتعلّم القارئ أن يفهم أكثر مما يعترف به الراوي.", "ru": "Когда события противоречат словам рассказчика, ему можно не верить. Это ненадёжный рассказчик. Читатель понимает больше, чем рассказчик признаёт.", "en": "When events contradict the narrator, we can doubt him. This is an unreliable narrator. The reader understands more than the narrator admits."},null,[null, {"he": "הוא מדבר בגוף ראשון על עצמו, ולכן אינו יודע־כול.", "ar": "يتحدث بضمير المتكلم عن نفسه، فليس راويًا عليمًا.", "ru": "Он говорит о себе от первого лица, значит, он не всезнающий.", "en": "He speaks as \"I\" about himself, so he is not omniscient."}, {"he": "לפער יש משמעות: הוא מלמד על המספר.", "ar": "للفجوة معنى: إنها تكشف عن الراوي.", "ru": "У разрыва есть смысл: он раскрывает рассказчика.", "en": "The gap has meaning: it reveals the narrator."}, {"he": "התלמידים פועלים בסיפור, ולכן הם דמויות.", "ar": "التلاميذ يتصرفون في القصة، فهم شخصيات.", "ru": "Ученики действуют в рассказе, значит, они персонажи.", "en": "The students act in the story, so they are characters."}]),
  Q("sh-2-04",{"he": "בסיפור מקורי: \"דנה החזירה לקופאי את העודף שקיבלה בטעות, אף שאיש לא שם לב.\" מה המשפט מלמד על דנה?", "ar": "في قصة أصلية: \"أعادت دانا إلى أمين الصندوق الباقي الذي أخذته خطأً، مع أن أحدًا لم ينتبه.\" ماذا تكشف الجملة عن دانا؟", "ru": "В оригинальном рассказе: «Дана вернула кассиру сдачу, полученную по ошибке, хотя никто не заметил». Что фраза говорит о Дане?", "en": "In an original story: \"Dana returned the extra change to the cashier, though no one had noticed.\" What does this tell us about Dana?"},[{"he": "שהיא עשירה מאוד ואינה צריכה את הכסף בכלל", "ar": "أنها غنية جدًا ولا تحتاج إلى المال أبدًا", "ru": "Что она очень богата и деньги ей совсем не нужны", "en": "That she is very rich and does not need the money at all"}, {"he": "שהיא ישרה גם כשאיש אינו רואה", "ar": "أنها أمينة حتى حين لا يراها أحد", "ru": "Что она честна, даже когда никто не видит", "en": "That she is honest even when no one is watching"}, {"he": "שהקופאי חבר קרוב שלה", "ar": "أن أمين الصندوق صديق مقرّب لها", "ru": "Что кассир — её близкий друг", "en": "That the cashier is a close friend"}, {"he": "שהיא ממהרת מאוד", "ar": "أنها مستعجلة جدًا", "ru": "Что она очень спешит", "en": "That she is in a big hurry"}],1,{"he": "שימו לב לחלק \"אף שאיש לא שם לב\".", "ar": "انتبهوا إلى عبارة \"مع أن أحدًا لم ينتبه\".", "ru": "Обратите внимание на слова «хотя никто не заметил».", "en": "Notice the words \"though no one had noticed\"."},{"he": "זהו אפיון עקיף: המעשה מלמד על התכונה. דנה יכלה לשמור את הכסף בלי שיידעו. היא בחרה להחזיר אותו, וזה מראה יושר.", "ar": "هذا توصيف غير مباشر: الفعل يكشف الصفة. كان بإمكان دانا الاحتفاظ بالمال دون أن يعلم أحد. اختارت أن تعيده، وهذا يدل على الأمانة.", "ru": "Это косвенная характеристика: поступок раскрывает черту. Дана могла оставить деньги незаметно. Она вернула их — это честность.", "en": "This is indirect characterization: the act reveals the trait. Dana could have kept the money unseen. She chose to return it, which shows honesty."},null,[{"he": "אין בטקסט מידע על מצבה הכלכלי.", "ar": "لا معلومات في النص عن وضعها المالي.", "ru": "В тексте нет сведений о её достатке.", "en": "The text gives no information about her wealth."}, null, {"he": "אין בטקסט רמז לקשר אישי עם הקופאי.", "ar": "لا تلميح في النص إلى علاقة شخصية بأمين الصندوق.", "ru": "В тексте нет намёка на дружбу с кассиром.", "en": "Nothing hints at a personal tie with the cashier."}, {"he": "מי שממהר אינו עוצר להחזיר כסף.", "ar": "المستعجل لا يتوقف ليعيد المال.", "ru": "Тот, кто спешит, не остановится вернуть деньги.", "en": "Someone in a hurry would not stop to return money."}]),
  Q("sh-2-05",{"he": "בסיפור מקורי, כבאי עבד 30 שנה בלי להיפגע. ביום הפרישה הוא נפצע כשנפל מכיסא במסיבה. איזה אמצעי ספרותי בולט כאן?", "ar": "في قصة أصلية، عمل رجل إطفاء 30 سنة دون أن يُصاب. وفي يوم تقاعده أُصيب حين سقط عن كرسي في الحفلة. أيّ وسيلة أدبية بارزة هنا؟", "ru": "В оригинальном рассказе пожарный 30 лет работал без травм. В день ухода на пенсию он упал со стула на празднике и поранился. Какой приём здесь заметен?", "en": "In an original story, a firefighter worked 30 years unhurt. On his retirement day he fell off a chair at the party and got hurt. What device stands out?"},[{"he": "חזרה לעבר", "ar": "استرجاع", "ru": "Ретроспекция", "en": "A flashback"}, {"he": "מספר בגוף ראשון", "ar": "راوٍ بضمير المتكلم", "ru": "Рассказчик от первого лица", "en": "A first-person narrator"}, {"he": "אירוניה של מצב", "ar": "مفارقة الموقف", "ru": "Ирония ситуации", "en": "Situational irony"}, {"he": "אפיון ישיר של הדמות בידי המספר", "ar": "توصيف مباشر للشخصية على لسان الراوي", "ru": "Прямая характеристика героя рассказчиком", "en": "Direct characterization by the narrator"}],2,{"he": "איפה הסכנה הייתה צפויה, ואיפה הפגיעה קרתה בפועל?", "ar": "أين كان الخطر متوقعًا، وأين وقعت الإصابة فعلًا؟", "ru": "Где ждали опасности и где случилась травма?", "en": "Where was danger expected, and where did the injury happen?"},{"he": "ציפינו לסכנה בשריפות, אבל הפגיעה באה במסיבה בטוחה. זהו היפוך של ציפייה. היפוך כזה הוא אירוניה של מצב.", "ar": "توقعنا الخطر في الحرائق، لكن الإصابة جاءت في حفلة آمنة. هذا قلب للتوقع. ومثل هذا القلب مفارقة موقف.", "ru": "Опасности ждали на пожарах, а травма случилась на безопасном празднике. Это переворот ожиданий — ирония ситуации.", "en": "We expected danger in fires, but the injury came at a safe party. That reversal of expectation is situational irony."},null,[{"he": "האירועים מסופרים לפי הסדר, בלי קפיצה לעבר.", "ar": "تُروى الأحداث بالترتيب، دون قفز إلى الماضي.", "ru": "События идут по порядку, без возврата в прошлое.", "en": "Events are told in order, with no jump back."}, {"he": "הכבאי מתואר בגוף שלישי, לא כ\"אני\".", "ar": "يوصف رجل الإطفاء بضمير الغائب، لا بـ\"أنا\".", "ru": "О пожарном говорят в третьем лице, не «я».", "en": "The firefighter is described in third person, not as \"I\"."}, null, {"he": "המספר אינו מתאר כאן תכונה; הוא מספר מאורע מפתיע.", "ar": "الراوي لا يصف صفة هنا؛ بل يروي حدثًا مفاجئًا.", "ru": "Рассказчик не называет черту, а рассказывает неожиданный случай.", "en": "The narrator names no trait; he tells a surprising event."}]),
  Q("sh-2-06",{"he": "בסיפור מקורי, ילדה משקה כל יום עציץ שהשאירה לה סבתה שנפטרה. בסוף הסיפור העציץ פורח. מה העציץ מייצג כנראה?", "ar": "في قصة أصلية، تسقي طفلة كل يوم أصيصًا تركته لها جدّتها المتوفاة. في نهاية القصة يزهر الأصيص. ماذا يمثّل الأصيص على الأرجح؟", "ru": "В оригинальном рассказе девочка каждый день поливает цветок, оставленный умершей бабушкой. В конце цветок расцветает. Что он, вероятно, обозначает?", "en": "In an original story, a girl waters a plant every day that her late grandmother left her. At the end the plant blooms. What does the plant probably represent?"},[{"he": "תחביב חדש של הילדה", "ar": "هواية جديدة للطفلة", "ru": "Новое увлечение девочки", "en": "The girl's new hobby"}, {"he": "את מזג האוויר החם בעונת האביב שבה הסיפור מתרחש", "ar": "الطقس الدافئ في فصل الربيع الذي تجري فيه القصة", "ru": "Тёплую весеннюю погоду, в которую идёт действие", "en": "The warm spring weather in which the story is set"}, {"he": "שהילדה שוכחת את סבתה", "ar": "أن الطفلة تنسى جدّتها", "ru": "Что девочка забывает бабушку", "en": "That the girl is forgetting her grandmother"}, {"he": "את הקשר לסבתא, שממשיך לחיות", "ar": "صلتها بالجدّة، وهي صلة ما زالت حيّة", "ru": "Связь с бабушкой, и эта связь жива", "en": "The bond with the grandmother, which lives on"}],3,{"he": "ממי קיבלה הילדה את העציץ, ומה קורה לו בסוף?", "ar": "ممّن أخذت الطفلة الأصيص، وماذا يحدث له في النهاية؟", "ru": "От кого девочка получила цветок и что с ним в конце?", "en": "Who gave her the plant, and what happens to it at the end?"},{"he": "העציץ קשור לסבתא, והטיפול בו הוא מעשה של זיכרון. הפריחה מראה שהקשר ממשיך לחיות. כך חפץ רגיל הופך לסמל.", "ar": "الأصيص مرتبط بالجدّة، والعناية به فعل تذكّر. الإزهار يُظهر أن الصلة مستمرة. هكذا يصبح شيء عادي رمزًا.", "ru": "Цветок связан с бабушкой, уход за ним — акт памяти. Цветение показывает, что связь жива. Так обычный предмет становится символом.", "en": "The plant is tied to the grandmother, and caring for it is an act of memory. The bloom shows the bond lives on. So an ordinary object becomes a symbol."},null,[{"he": "זו קריאה מילולית שמתעלמת מהקשר לסבתא.", "ar": "هذه قراءة حرفية تتجاهل الصلة بالجدّة.", "ru": "Это буквальное прочтение, без связи с бабушкой.", "en": "This literal reading ignores the link to the grandmother."}, {"he": "אין בטקסט דגש על מזג האוויר.", "ar": "لا تركيز في النص على الطقس.", "ru": "В тексте нет акцента на погоде.", "en": "The text puts no stress on the weather."}, {"he": "ההשקיה היומית מראה שהיא זוכרת, לא שוכחת.", "ar": "السقي اليومي يدل على أنها تتذكر، لا تنسى.", "ru": "Ежедневный полив показывает память, а не забвение.", "en": "Daily watering shows she remembers, not forgets."}, null])],
 [
  Q("lit-openend",{"he": "סיפור מסתיים כשהדמות עומדת מול שתי דלתות, בלי לספר במה בחרה. איזו תשובה היא קריאה אחראית?", "ar": "تنتهي قصة والشخصية أمام بابين من دون أن نعرف اختيارها. أي قراءة مسؤولة؟", "ru": "Рассказ заканчивается у двух дверей без сообщения о выборе героя. Какой ответ обоснован?", "en": "A story ends with a character facing two doors, without telling which she chose. Which reading is responsible?"},[{"he": "להציג שתי אפשרויות ולבסס כל אחת ברמזים", "ar": "عرض احتمالين مع قرائن لكل منهما", "ru": "Предложить два варианта и подтвердить каждый намёками", "en": "Present two possibilities and support each with clues"},{"he": "לקבוע בוודאות שהיא בחרה בדלת הימנית", "ar": "الجزم بأنها اختارت الباب الأيمن", "ru": "Уверенно заявить, что она выбрала правую дверь", "en": "State with certainty she chose the right door"},{"he": "להגיד שאין לסיום משמעות כלל", "ar": "القول إن النهاية بلا معنى إطلاقًا", "ru": "Сказать, что финал вовсе не имеет смысла", "en": "Say the ending has no meaning"},{"he": "להמציא פרק המשך כאילו נכתב בסיפור", "ar": "اختراع فصل تالٍ وكأنه جزء من القصة", "ru": "Придумать продолжение как часть текста", "en": "Invent a sequel as if it were in the text"}],0,{"he": "מה הטקסט אומר, ומה הוא משאיר פתוח?", "ar": "ماذا يقول النص، وماذا يترك مفتوحًا؟", "ru": "Что сказано и что осталось открытым?", "en": "What is stated, and what remains open?"},{"he": "סיום פתוח אינו מונע פרשנות, אבל דורש לסמן את גבול הידיעה.", "ar": "النهاية المفتوحة تسمح بالتفسير، لكن تتطلب الاعتراف بحدود ما نعرفه.", "ru": "Открытый финал допускает толкование, но требует признать пределы знания.", "en": "An open ending permits interpretation while requiring us to mark what is unknown."},null,[null,{"he": "הבחירה אינה מופיעה בטקסט.", "ar": "الاختيار غير مذكور في النص.", "ru": "Выбор в тексте не указан.", "en": "The text does not state her choice."},{"he": "אי-ודאות יכולה להיות חלק ממשמעות הסיום.", "ar": "قد يكون الغموض جزءًا من معنى النهاية.", "ru": "Неопределённость может быть частью смысла финала.", "en": "Uncertainty can be part of the ending’s meaning."},{"he": "קטע מומצא אינו ראיה מתוך היצירה.", "ar": "الفصل المختلق ليس دليلاً من العمل.", "ru": "Выдуманный эпизод не является свидетельством текста.", "en": "An invented chapter is not textual evidence."}])
 ,Q("lit-open-mean",{"he": "סיפור מסתיים במשפט \"והיא נשארה עומדת על הגשר\". קורא אחד רואה בסוף תקווה, וקורא אחר רואה בו התלבטות. איזו עמדה מקובלת בקריאה ספרותית?", "ar": "تنتهي قصة بجملة «وبقيت واقفة على الجسر». قارئ يرى في النهاية أملًا وقارئ آخر يرى ترددًا. أي موقف مقبول في القراءة الأدبية؟", "ru": "Рассказ кончается фразой «И она осталась стоять на мосту». Один читатель видит в финале надежду, другой — нерешительность. Какая позиция принята в литературном чтении?", "en": "A story ends with \"And she remained standing on the bridge.\" One reader sees hope in the ending, another sees hesitation. Which stance is accepted in literary reading?"},[{"he": "שתי הקריאות יכולות להיות מוצדקות אם כל אחת נתמכת בטקסט", "ar": "كلتا القراءتين قد تكونان صحيحتين إذا استندتا إلى النصّ", "ru": "Обе трактовки могут быть верными, если каждая опирается на текст", "en": "Both readings can be valid if each is grounded in the text"},{"he": "רק הקריאה הראשונה נכונה כי היא נאמרה קודם", "ar": "القراءة الأولى فقط صحيحة لأنها قيلت أولًا", "ru": "Верна только первая трактовка, потому что она сказана первой", "en": "Only the first reading is right because it came first"},{"he": "לסוף פתוח אין משמעות והסופר פשוט הפסיק לכתוב", "ar": "النهاية المفتوحة بلا معنى والكاتب توقف عن الكتابة فحسب", "ru": "Открытый финал бессмыслен, автор просто перестал писать", "en": "An open ending is meaningless; the author simply stopped"},{"he": "המשמעות היא רק מה שהסופר התכוון אליו, ואי אפשר לדון בה", "ar": "المعنى هو فقط ما قصده الكاتب ولا يمكن مناقشته", "ru": "Смысл только в том, что задумал автор, и обсуждать это нельзя", "en": "The meaning is only what the author intended and cannot be discussed"}],0,{"he": "בדקו אם לכל פרשנות יש על מה לעמוד בטקסט.", "ar": "تحققوا إن كانت لكل قراءة ما تستند إليه في النصّ.", "ru": "Проверьте, есть ли у каждой трактовки опора в тексте.", "en": "Check whether each reading has support in the text."},{"he": "פרשנות ספרותית נשענת על ראיות ולא על הרגשה בלבד. למשל עמידה על גשר יכולה לסמל היסוס או התחלה חדשה, וכל קריאה זקוקה לציטוט שיתמוך בה.", "ar": "القراءة الأدبية تستند إلى أدلة لا إلى انطباع فقط. مثال: الوقوف على جسر قد يرمز إلى التردد أو إلى بداية جديدة، وكل قراءة تحتاج إلى اقتباس داعم.", "ru": "Литературная трактовка опирается на доказательства, а не только на впечатление. Например, стояние на мосту может значить нерешительность или новое начало, и каждой трактовке нужна цитата.", "en": "A literary reading rests on evidence, not impression alone. For example, standing on a bridge can signal hesitation or a new beginning, and each reading needs a supporting quote."},null,[null,{"he": "סדר הדיבור אינו קובע נכונות; הנכונות נמדדת בראיות.", "ar": "ترتيب الكلام لا يحدد الصواب، فالصواب يُقاس بالأدلة.", "ru": "Порядок высказывания не решает; верность меряется доказательствами.", "en": "Speaking order does not decide; correctness is measured by evidence."},{"he": "סוף פתוח הוא בחירה מודעת שמזמינה מחשבה, לא הפסקה באמצע.", "ar": "النهاية المفتوحة اختيار واعٍ يدعو للتفكير لا توقف في المنتصف.", "ru": "Открытый финал — осознанный выбор, зовущий думать, а не остановка на полпути.", "en": "An open ending is a deliberate choice inviting thought, not a stop midway."},{"he": "גם בלי לדעת מה התכוון הסופר, אפשר לבסס פרשנות על הטקסט.", "ar": "حتى دون معرفة قصد الكاتب يمكن بناء قراءة على النصّ.", "ru": "Даже не зная замысла автора, можно строить трактовку на тексте.", "en": "Even without knowing the author's intent, a reading can rest on the text."}]),Q("lit-perspective-add",{"he": "מחבר בחר לספר סיפור על שריפה מפי ילד ולא מפי כבאי. מה הבחירה נותנת לקורא?", "ar": "اختار مؤلف أن يروي قصة حريق بلسان طفل لا بلسان إطفائي. ماذا يعطي هذا الاختيار للقارئ؟", "ru": "Автор решил рассказать о пожаре от лица ребёнка, а не пожарного. Что это даёт читателю?", "en": "An author chose to tell a fire story through a child, not a firefighter. What does this choice give the reader?"},[{"he": "הסבר מקצועי מלא על שיטות כיבוי אש ועל הציוד שבו משתמשים הכבאים", "ar": "شرح مهني كامل عن طرق إطفاء الحرائق وعن المعدات التي يستخدمها رجال الإطفاء", "ru": "Полное профессиональное объяснение методов тушения пожаров и работы пожарной команды", "en": "A full professional explanation of firefighting methods and the equipment fire crews use"},{"he": "רשימה מדויקת של כללי בטיחות מפני שריפות", "ar": "قائمة دقيقة بقواعد السلامة من الحرائق", "ru": "Точный список правил пожарной безопасности", "en": "An exact list of fire safety rules"},{"he": "סיפור ארוך יותר בלי הבדל במשמעות", "ar": "قصة أطول دون فرق في المعنى", "ru": "Более длинный рассказ без разницы в смысле", "en": "A longer story with no difference in meaning"},{"he": "חוויה קרובה ואישית של האירוע, גם במחיר של ידע חלקי", "ar": "تجربة قريبة وشخصية للحدث ولو بثمن معرفة جزئية", "ru": "Близкое, личное переживание события, пусть и ценой частичного знания", "en": "A close, personal experience of the event, even at the cost of partial knowledge"}],3,{"he": "מה ילד רואה ומרגיש שאיש מקצוע לא היה מתאר?", "ar": "ما الذي يراه الطفل ويشعر به وما كان سيصفه المحترف؟", "ru": "Что ребёнок видит и чувствует, чего не описал бы профессионал?", "en": "What does a child see and feel that a professional would not describe?"},{"he": "בחירת המספר קובעת מה הקורא מקבל. למשל ילד מתאר ריח ופחד, ואילו כבאי היה מתאר את כיוון האש ואת הלחימה בה.", "ar": "اختيار الراوي يحدد ما يحصل عليه القارئ. مثال: الطفل يصف الرائحة والخوف، بينما كان الإطفائي سيصف اتجاه النار ومكافحتها.", "ru": "Выбор рассказчика определяет, что получает читатель. Например, ребёнок описывает запах и страх, а пожарный описал бы направление огня и борьбу с ним.", "en": "The choice of narrator sets what the reader gets. For example, a child describes the smell and the fear, while a firefighter would describe the fire's path and the fight against it."},null,[{"he": "ילד אינו מספק הסבר מקצועי; זו בדיוק הנקודה.", "ar": "الطفل لا يقدّم شرحًا مهنيًّا، وهذه هي النقطة بالضبط.", "ru": "Ребёнок не даёт профессионального объяснения; в этом и суть.", "en": "A child provides no professional explanation; that is exactly the point."},{"he": "רשימת כללים אינה סיפור ואינה מה שהילד מספר.", "ar": "قائمة القواعد ليست قصة وليست ما يرويه الطفل.", "ru": "Список правил — не рассказ и не то, о чём говорит ребёнок.", "en": "A rule list is not a story and not what the child tells."},{"he": "הבחירה במספר משנה את המשמעות, לא רק את האורך.", "ar": "اختيار الراوي يغيّر المعنى لا الطول فقط.", "ru": "Выбор рассказчика меняет смысл, а не только длину.", "en": "The narrator choice changes meaning, not just length."},null]),
  Q("sh-3-01",{"he": "סיפור מסופר בגוף שלישי, אבל רק דרך עיני האח הצעיר. בסוף מתברר שהאח הגדול היה חולה כל הזמן. למה הקורא מופתע?", "ar": "تُروى قصة بضمير الغائب، لكن من خلال عينَي الأخ الصغير فقط. في النهاية يتبيّن أن الأخ الأكبر كان مريضًا طوال الوقت. لماذا يُفاجأ القارئ؟", "ru": "Рассказ ведётся в третьем лице, но только глазами младшего брата. В конце выясняется, что старший брат всё время был болен. Почему читатель удивлён?", "en": "A story is told in third person, but only through the younger brother's eyes. At the end we learn the older brother was ill all along. Why is the reader surprised?"},[{"he": "כי הקורא ידע רק מה שהאח הצעיר ידע", "ar": "لأن القارئ عرف فقط ما عرفه الأخ الصغير", "ru": "Потому что читатель знал только то, что знал младший брат", "en": "Because the reader knew only what the younger brother knew"}, {"he": "כי המחבר שכח לספר על המחלה", "ar": "لأن المؤلف نسي أن يذكر المرض", "ru": "Потому что автор забыл рассказать о болезни", "en": "Because the author forgot to mention the illness"}, {"he": "כי מספר בגוף שלישי חייב תמיד להסתיר מידע חשוב מהקורא", "ar": "لأن الراوي بضمير الغائب يجب دائمًا أن يخفي معلومات مهمة عن القارئ", "ru": "Потому что рассказчик в третьем лице всегда обязан скрывать важное от читателя", "en": "Because a third-person narrator must always hide important facts from the reader"}, {"he": "כי האח הגדול הוא המספר", "ar": "لأن الأخ الأكبر هو الراوي", "ru": "Потому что рассказчик — старший брат", "en": "Because the older brother is the narrator"}],0,{"he": "חשבו על גבולות הידיעה של הדמות שדרכה רואים.", "ar": "فكّروا في حدود معرفة الشخصية التي نرى من خلالها.", "ru": "Подумайте о границах знания того героя, чьими глазами мы смотрим.", "en": "Think about the limits of what the viewing character knows."},{"he": "המבט צמוד לאח הצעיר, ולכן הקורא שותף לחוסר הידיעה שלו. כשהאמת מתגלה, הקורא מופתע יחד איתו. זו השפעה של מיקוד דרך דמות.", "ar": "النظرة ملتصقة بالأخ الصغير، فيشاركه القارئ جهله. وعندما تنكشف الحقيقة يُفاجأ القارئ معه. هذا أثر التبئير عبر شخصية.", "ru": "Взгляд привязан к младшему брату, и читатель разделяет его незнание. Когда правда открывается, читатель удивлён вместе с ним. Это эффект фокализации.", "en": "The view is tied to the younger brother, so the reader shares his ignorance. When the truth comes out, the reader is surprised with him. This is the effect of focalization."},null,[null, {"he": "ההסתרה היא בחירה מכוונת של נקודת המבט, לא שכחה.", "ar": "الإخفاء اختيار مقصود لوجهة النظر، لا نسيان.", "ru": "Скрытие — сознательный выбор точки зрения, а не забывчивость.", "en": "The hiding is a deliberate choice of viewpoint, not forgetting."}, {"he": "מספר בגוף שלישי יכול גם לגלות הכול; כאן הוא הוגבל בכוונה.", "ar": "الراوي بضمير الغائب قد يكشف كل شيء؛ هنا قُيِّد عمدًا.", "ru": "Рассказчик в третьем лице может раскрыть всё; здесь он ограничен намеренно.", "en": "A third-person narrator can reveal all; here he is limited on purpose."}, {"he": "המבט עובר דרך האח הצעיר, לא דרך האח הגדול.", "ar": "النظرة تمر عبر الأخ الصغير، لا الأخ الأكبر.", "ru": "Взгляд идёт через младшего брата, а не через старшего.", "en": "The view passes through the younger brother, not the older one."}]),
  Q("sh-3-02",{"he": "סיפור נפתח בסוף: \"ביום שבו עזבתי את הכפר, ירד גשם.\" אחר כך הוא חוזר לילדות של המספר. מה ההשפעה של המבנה הזה?", "ar": "تبدأ قصة بالنهاية: \"في اليوم الذي غادرتُ فيه القرية، كان المطر يهطل.\" ثم تعود إلى طفولة الراوي. ما أثر هذا البناء؟", "ru": "Рассказ начинается с конца: «В день, когда я уехал из деревни, шёл дождь». Затем он возвращается в детство рассказчика. Каков эффект такого построения?", "en": "A story opens with its ending: \"On the day I left the village, it rained.\" Then it goes back to the narrator's childhood. What is the effect?"},[{"he": "הקורא כבר יודע הכול מההתחלה, ולכן אין שום סיבה להמשיך לקרוא", "ar": "القارئ يعرف كل شيء منذ البداية، فلا سبب أبدًا لمواصلة القراءة", "ru": "Читатель уже с начала всё знает, и читать дальше совсем незачем", "en": "The reader already knows everything from the start, so there is no reason to read on"}, {"he": "השאלה משתנה מ\"מה יקרה?\" ל\"למה זה קרה?\"", "ar": "يتحوّل السؤال من \"ماذا سيحدث؟\" إلى \"لماذا حدث؟\"", "ru": "Вопрос меняется с «что будет?» на «почему так вышло?»", "en": "The question shifts from \"what will happen?\" to \"why did it happen?\""}, {"he": "הגשם הופך לדמות הראשית", "ar": "يصبح المطر الشخصية الرئيسية", "ru": "Дождь становится главным героем", "en": "The rain becomes the main character"}, {"he": "הסיפור מתרחש כולו ביום אחד", "ar": "تجري القصة كلها في يوم واحد", "ru": "Всё действие проходит за один день", "en": "The whole story takes place in one day"}],1,{"he": "כשהסוף ידוע, על מה הקורא עדיין סקרן?", "ar": "حين تكون النهاية معروفة، بمَ يبقى القارئ فضوليًا؟", "ru": "Если конец известен, что ещё интересно читателю?", "en": "When the end is known, what is the reader still curious about?"},{"he": "פתיחה בסוף מבטלת את המתח של \"מה יקרה\". במקומו נוצר מתח של סיבה: למה המספר עזב. החזרה לילדות עונה על השאלה הזאת.", "ar": "البدء بالنهاية يلغي تشويق \"ماذا سيحدث\". ويحلّ محلّه تشويق السبب: لماذا غادر الراوي. والعودة إلى الطفولة تجيب عن هذا السؤال.", "ru": "Начало с конца снимает напряжение «что будет». Вместо него — вопрос причины: почему рассказчик уехал. Возврат в детство отвечает на него.", "en": "Opening with the end removes the suspense of \"what next\". Instead comes the question of cause: why the narrator left. The return to childhood answers it."},null,[{"he": "הסוף ידוע, אבל הסיבות עדיין חסרות ומושכות לקרוא.", "ar": "النهاية معروفة، لكن الأسباب ما زالت ناقصة وتشدّ إلى القراءة.", "ru": "Конец известен, но причин ещё нет, и это тянет читать.", "en": "The end is known, but the causes are missing and pull us on."}, null, {"he": "הגשם הוא פרט של אווירה, לא דמות שפועלת.", "ar": "المطر تفصيل للجوّ، لا شخصية فاعلة.", "ru": "Дождь — деталь атмосферы, а не действующий герой.", "en": "The rain is a detail of mood, not an acting character."}, {"he": "הסיפור חוזר לילדות, כלומר הוא נמשך על פני שנים.", "ar": "القصة تعود إلى الطفولة، أي تمتد سنوات.", "ru": "Рассказ возвращается в детство, то есть охватывает годы.", "en": "The story returns to childhood, so it spans years."}]),
  Q("sh-3-03",{"he": "דמות רוצה לעבור לעיר גדולה כדי ללמוד. היא גם לא רוצה להשאיר את אמה החולה לבד. איזה קונפליקט מניע את הסיפור בעיקר?", "ar": "تريد شخصية الانتقال إلى مدينة كبيرة لتدرس. ولا تريد أيضًا أن تترك أمها المريضة وحدها. أيّ صراع يحرّك القصة أساسًا؟", "ru": "Героиня хочет переехать в большой город учиться. Но она не хочет оставлять больную мать одну. Какой конфликт главным образом движет рассказом?", "en": "A character wants to move to a big city to study. She also does not want to leave her sick mother alone. What conflict mainly drives the story?"},[{"he": "קונפליקט בין אדם לטבע", "ar": "صراع بين الإنسان والطبيعة", "ru": "Конфликт человека и природы", "en": "Person against nature"}, {"he": "ריב גלוי בין שתי דמויות שצועקות זו על זו", "ar": "شجار علني بين شخصيتين تصرخ كل منهما على الأخرى", "ru": "Открытая ссора двух героев, кричащих друг на друга", "en": "An open fight between two characters shouting at each other"}, {"he": "קונפליקט פנימי בין שני רצונות", "ar": "صراع داخلي بين رغبتين", "ru": "Внутренний конфликт двух желаний", "en": "An inner conflict between two wishes"}, {"he": "אין קונפליקט, כי איש לא נלחם", "ar": "لا صراع، لأن أحدًا لا يقاتل", "ru": "Конфликта нет, никто не борется", "en": "No conflict, since no one fights"}],2,{"he": "איפה נמצאים שני הכוחות שמושכים לכיוונים הפוכים?", "ar": "أين توجد القوتان اللتان تشدّان في اتجاهين متعاكسين؟", "ru": "Где находятся две силы, тянущие в разные стороны?", "en": "Where are the two forces pulling in opposite directions?"},{"he": "שני הרצונות שייכים לאותה דמות. היא נקרעת בין לימודים לבין אחריות לאמה. זה קונפליקט פנימי, גם בלי ריב גלוי.", "ar": "الرغبتان تعودان إلى الشخصية نفسها. إنها ممزقة بين الدراسة والمسؤولية تجاه أمها. هذا صراع داخلي، حتى دون شجار علني.", "ru": "Оба желания принадлежат одной героине. Она разрывается между учёбой и долгом перед матерью. Это внутренний конфликт, даже без ссоры.", "en": "Both wishes belong to the same character. She is torn between studies and duty to her mother. This is inner conflict, even without an open fight."},null,[{"he": "אין כאן מאבק בכוח טבע כמו סערה או מדבר.", "ar": "لا صراع هنا مع قوة طبيعية مثل عاصفة أو صحراء.", "ru": "Здесь нет борьбы с природой, вроде бури или пустыни.", "en": "There is no struggle with nature, like a storm or desert."}, {"he": "האם אינה מתנגדת לה; המאבק מתרחש בתוכה.", "ar": "الأم لا تعارضها؛ الصراع يجري في داخلها.", "ru": "Мать не спорит с ней; борьба идёт внутри героини.", "en": "The mother does not oppose her; the struggle is inside her."}, null, {"he": "קונפליקט אינו חייב מאבק גלוי; גם התלבטות היא קונפליקט.", "ar": "الصراع لا يتطلب قتالًا علنيًا؛ التردد صراع أيضًا.", "ru": "Конфликт не требует открытой борьбы; колебание — тоже конфликт.", "en": "Conflict needs no open fight; inner struggle counts too."}]),
  Q("sh-3-04",{"he": "בסיפור מקורי: \"'איזה יום נפלא,' אמר יוסי, כשהאוטובוס עבר בלי לעצור והגשם הרטיב אותו.\" מה יוצר את המשמעות במשפט?", "ar": "في قصة أصلية: \"'يا له من يوم رائع،' قال يوسي، بينما مرّت الحافلة دون أن تتوقف وبلّله المطر.\" ما الذي يصنع المعنى في الجملة؟", "ru": "В оригинальном рассказе: «„Какой чудесный день“, — сказал Йоси, когда автобус проехал не остановившись, а дождь его промочил». Что создаёт смысл фразы?", "en": "In an original story: \"'What a wonderful day,' said Yossi, as the bus passed without stopping and the rain soaked him.\" What creates the meaning?"},[{"he": "יוסי באמת שמח שהאוטובוס לא עצר", "ar": "يوسي سعيد فعلًا لأن الحافلة لم تتوقف", "ru": "Йоси правда рад, что автобус не остановился", "en": "Yossi is truly glad the bus did not stop"}, {"he": "תיאור טבע שאין לו שום קשר לדמות או לרגשות שלה בכלל", "ar": "وصف للطبيعة لا علاقة له بالشخصية ومشاعرها", "ru": "Описание природы, не связанное с героем и его чувствами", "en": "A nature description unrelated to the character or his feelings"}, {"he": "המספר מתבלבל בין שני ימים", "ar": "الراوي يخلط بين يومين", "ru": "Рассказчик путает два дня", "en": "The narrator confuses two days"}, {"he": "פער בין המילים לבין המצב: אירוניה מילולית", "ar": "فجوة بين الكلام والموقف: مفارقة لفظية", "ru": "Разрыв между словами и ситуацией: словесная ирония", "en": "A gap between words and situation: verbal irony"}],3,{"he": "האם המילים של יוסי מתאימות למה שקורה לו?", "ar": "هل تتلاءم كلمات يوسي مع ما يحدث له؟", "ru": "Подходят ли слова Йоси к тому, что с ним происходит?", "en": "Do Yossi's words fit what is happening to him?"},{"he": "יוסי אומר \"נפלא\" ברגע רע במיוחד. המילים אומרות דבר אחד, והמצב מראה את ההפך. זו אירוניה מילולית, והיא חושפת את התסכול שלו.", "ar": "يقول يوسي \"رائع\" في لحظة سيئة جدًا. الكلمات تقول شيئًا والموقف يُظهر عكسه. هذه مفارقة لفظية تكشف إحباطه.", "ru": "Йоси говорит «чудесный» в очень плохой момент. Слова говорят одно, ситуация — обратное. Это словесная ирония, она выдаёт его досаду.", "en": "Yossi says \"wonderful\" at a very bad moment. The words say one thing, the situation the opposite. This verbal irony reveals his frustration."},null,[{"he": "הוא נרטב והחמיץ את האוטובוס; אין סיבה לשמוח.", "ar": "تبلّل وفاتته الحافلة؛ لا سبب للفرح.", "ru": "Он промок и упустил автобус — радоваться нечему.", "en": "He got soaked and missed the bus; there is no reason for joy."}, {"he": "הגשם פוגע ביוסי עצמו, ולכן הוא קשור אליו ישירות.", "ar": "المطر يبلّل يوسي نفسه، فهو مرتبط به مباشرة.", "ru": "Дождь мочит самого Йоси, значит, он напрямую с ним связан.", "en": "The rain soaks Yossi himself, so it is directly linked to him."}, {"he": "הכול קורה ברגע אחד, ואין סימן לבלבול בזמן.", "ar": "كل شيء يحدث في لحظة واحدة، ولا دليل على خلط في الزمن.", "ru": "Всё происходит в один момент, путаницы во времени нет.", "en": "It all happens in one moment; there is no time confusion."}, null]),
  Q("sh-3-05",{"he": "סיפור מתרחש כולו בחדר קטן בלי חלונות. הדמות הראשית מרגישה שאין לה מוצא בחייה. מה תפקיד המקום בסיפור?", "ar": "تجري قصة كلها في غرفة صغيرة بلا نوافذ. تشعر الشخصية الرئيسية أنه لا مخرج لها في حياتها. ما دور المكان في القصة؟", "ru": "Всё действие идёт в маленькой комнате без окон. Героиня чувствует, что в её жизни нет выхода. Какова роль места в рассказе?", "en": "A story takes place entirely in a small windowless room. The main character feels her life has no way out. What is the role of the place?"},[{"he": "הוא משקף את תחושת הלכידות של הדמות", "ar": "يعكس شعور الشخصية بأنها محاصَرة", "ru": "Оно отражает чувство западни у героини", "en": "It mirrors the character's sense of being trapped"}, {"he": "הוא רק מראה שהסופר אוהב חדרים קטנים", "ar": "يُظهر فقط أن الكاتب يحب الغرف الصغيرة", "ru": "Оно лишь показывает, что автор любит маленькие комнаты", "en": "It only shows the writer likes small rooms"}, {"he": "הוא מוכיח שהסיפור קרה באמת", "ar": "يثبت أن القصة حدثت فعلًا", "ru": "Оно доказывает, что история была на самом деле", "en": "It proves the story really happened"}, {"he": "אין לו משמעות, כי בסיפור קצר רק הדמויות חשובות באמת", "ar": "لا معنى له، لأن الشخصيات وحدها مهمة فعلًا في القصة القصيرة", "ru": "Оно ничего не значит: в рассказе важны только герои", "en": "It has no meaning, since only the characters truly matter in a short story"}],0,{"he": "השוו בין מבנה החדר לבין מה שהדמות מרגישה.", "ar": "قارنوا بين شكل الغرفة وما تشعر به الشخصية.", "ru": "Сравните устройство комнаты и чувства героини.", "en": "Compare the room's shape with what the character feels."},{"he": "חדר סגור בלי חלונות דומה לחיים בלי מוצא. כך המקום מבטא את העולם הפנימי של הדמות. בסיפור קצר כל פרט נבחר בקפידה.", "ar": "الغرفة المغلقة بلا نوافذ تشبه حياة بلا مخرج. هكذا يعبّر المكان عن عالم الشخصية الداخلي. وفي القصة القصيرة يُختار كل تفصيل بعناية.", "ru": "Закрытая комната без окон похожа на жизнь без выхода. Так место выражает внутренний мир героини. В рассказе каждая деталь выбрана не случайно.", "en": "A closed room without windows resembles a life without exit. So the place expresses the character's inner world. In a short story every detail is chosen with care."},null,[null, {"he": "זו השערה על המחבר; הטקסט קושר את החדר לרגשות הדמות.", "ar": "هذا تخمين عن الكاتب؛ النص يربط الغرفة بمشاعر الشخصية.", "ru": "Это догадка об авторе; текст связывает комнату с чувствами героини.", "en": "That guesses about the writer; the text links the room to her feelings."}, {"he": "פרט מציאותי אינו מוכיח שהסיפור התרחש באמת.", "ar": "التفصيل الواقعي لا يثبت أن القصة وقعت فعلًا.", "ru": "Реалистичная деталь не доказывает, что история была.", "en": "A realistic detail does not prove the story happened."}, {"he": "בסיפור קצר גם המקום נושא משמעות ואינו רק רקע.", "ar": "في القصة القصيرة يحمل المكان معنى أيضًا، وليس خلفية فقط.", "ru": "В рассказе и место несёт смысл, а не только фон.", "en": "In a short story the place carries meaning too, not just background."}]),
  Q("sh-3-06",{"he": "בסוף סיפור מתגלה שהמכתבים שקיבלה הדמות נכתבו בידי אחיה, ולא בידי אביה. איך כדאי לקרוא את הסיפור מחדש?", "ar": "في نهاية قصة يتبيّن أن الرسائل التي تلقّتها الشخصية كتبها أخوها، لا أبوها. كيف يحسن أن نعيد قراءة القصة؟", "ru": "В конце рассказа выясняется, что письма героине писал брат, а не отец. Как стоит перечитать рассказ?", "en": "At the end of a story we learn the letters the character received were written by her brother, not her father. How should we reread the story?"},[{"he": "להתעלם מהסוף, כי הוא סותר את רוב מה שסופר קודם בסיפור", "ar": "أن نتجاهل النهاية، لأنها تناقض معظم ما رُوي سابقًا في القصة", "ru": "Не учитывать конец, ведь он противоречит почти всему рассказанному", "en": "Ignore the ending, since it contradicts most of what came before"}, {"he": "לחפש רמזים מוקדמים שמקבלים עכשיו משמעות חדשה", "ar": "أن نبحث عن تلميحات سابقة تكتسب الآن معنى جديدًا", "ru": "Искать ранние намёки, которые теперь получают новый смысл", "en": "Look for earlier clues that now take on a new meaning"}, {"he": "להסיק שהמחבר טעה בכתיבה", "ar": "أن نستنتج أن المؤلف أخطأ في الكتابة", "ru": "Решить, что автор ошибся", "en": "Conclude the author made a mistake"}, {"he": "לקבוע שהאב הוא הדמות הראשית", "ar": "أن نقرّر أن الأب هو الشخصية الرئيسية", "ru": "Решить, что главный герой — отец", "en": "Decide the father is the main character"}],1,{"he": "חשבו על פרטים שנראו קטנים בקריאה הראשונה.", "ar": "فكّروا في تفاصيل بدت صغيرة في القراءة الأولى.", "ru": "Вспомните детали, казавшиеся мелкими при первом чтении.", "en": "Think of details that seemed minor on first reading."},{"he": "גילוי בסוף משנה את הבנת כל מה שקדם לו. קריאה חוזרת מגלה רמזים שהוטמנו מראש. כך נבנית פרשנות שנשענת על הטקסט כולו.", "ar": "الكشف في النهاية يغيّر فهم كل ما سبقه. القراءة الثانية تكشف تلميحات زُرعت مسبقًا. هكذا يُبنى تفسير يستند إلى النص كله.", "ru": "Открытие в конце меняет понимание всего предыдущего. Перечитывание раскрывает заранее спрятанные намёки. Так строится толкование на всём тексте.", "en": "A reveal at the end changes how we understand everything before it. Rereading uncovers clues planted earlier. This builds a reading based on the whole text."},null,[{"he": "הסוף הוא חלק מהיצירה, ודווקא הוא מאיר את מה שקדם.", "ar": "النهاية جزء من العمل، وهي بالذات تضيء ما سبقها.", "ru": "Конец — часть произведения, и именно он освещает начало.", "en": "The ending is part of the work and sheds light on what came before."}, null, {"he": "גילוי מפתיע הוא בחירה מכוונת של המחבר, לא טעות.", "ar": "الكشف المفاجئ اختيار مقصود من المؤلف، لا خطأ.", "ru": "Неожиданная развязка — сознательный выбор автора, не ошибка.", "en": "A surprising reveal is a deliberate choice, not a mistake."}, {"he": "הגילוי עוסק בכותב המכתבים, ואינו הופך את האב לדמות הראשית.", "ar": "الكشف يتعلق بكاتب الرسائل، ولا يجعل الأب الشخصية الرئيسية.", "ru": "Раскрытие касается автора писем и не делает отца главным героем.", "en": "The reveal concerns who wrote the letters; it does not make the father central."}])]]);

topic("lit-drama-8281","8281",
  {"he": "דרמה: קונפליקט ובמה", "ar": "المسرحية: الصراع والخشبة", "ru": "Драма: конфликт и сцена", "en": "Drama: conflict and stage"},
  {"he": "זהו כיצד פעולה ודיבור בונים מחזה", "ar": "كيف تصنع الأفعال والحوار المسرحية", "ru": "Как действие и речь строят пьесу", "en": "Read how action and speech make a play"},
[ [
  Q("lit-drama-8281-1",{"he": "איזה תיאור מתאים לקונפליקט דרמטי?", "ar": "أي وصف يناسب الصراع الدرامي؟", "ru": "Какое описание подходит к «Драматический конфликт»?", "en": "Which description fits dramatic conflict?"},[{"he": "התנגשות בין רצונות או ערכים שמניעה את הפעולה.", "ar": "تصادم رغبات أو قيم يدفع الأحداث.", "ru": "Столкновение желаний или ценностей движет действием.", "en": "A clash of desires or values that drives the action."},{"he": "הנחיה כתובה לשחקנים על תנועה, הבעה או חלל הבמה.", "ar": "تعليمات مكتوبة للممثلين عن الحركة أو التعبير أو المكان.", "ru": "Указание актёрам о движении, выражении или сценическом пространстве.", "en": "A written instruction about movement, expression or stage space."},{"he": "שיחה בין דמויות שבה כל תגובה יכולה לשנות את היחסים ביניהן.", "ar": "حديث بين شخصيات قد يغيّر فيه كل رد علاقتها.", "ru": "Разговор персонажей, в котором ответы меняют отношения.", "en": "A conversation between characters whose replies can alter their relationship."},{"he": "פער שבו הקהל יודע פרט חשוב שדמות על הבמה אינה יודעת.", "ar": "حالة يعرف فيها الجمهور أمرًا مهمًا تجهله شخصية على الخشبة.", "ru": "Ситуация, в которой зритель знает важное, а персонаж нет.", "en": "A gap where the audience knows something important a character does not."}],0,{"he": "חפשו את הפרט שמבדיל אותו מן האחרים.", "ar": "ابحثوا عن التفصيل الذي يميزه عن غيره.", "ru": "Ищите отличие от остальных вариантов.", "en": "Look for the detail that separates it from the others."},{"he": "הקונפליקט הוא מקור המתח בין מטרות מתנגשות.", "ar": "الصراع مصدر التوتر بين أهداف متعارضة.", "ru": "Конфликт создаёт напряжение между несовместимыми целями.", "en": "Conflict creates tension between opposed aims."},null,[null,{"he": "זה מתאר את הוראת במה, לא את קונפליקט דרמטי.", "ar": "هذا يصف إرشاد مسرحي، لا الصراع الدرامي.", "ru": "Это описание «Ремарка», а не «Драматический конфликт».", "en": "That describes stage direction, not dramatic conflict."},{"he": "זה מתאר את דיאלוג, לא את קונפליקט דרמטי.", "ar": "هذا يصف الحوار، لا الصراع الدرامي.", "ru": "Это описание «Диалог», а не «Драматический конфликт».", "en": "That describes dialogue, not dramatic conflict."},{"he": "זה מתאר את אירוניה דרמטית, לא את קונפליקט דרמטי.", "ar": "هذا يصف المفارقة الدرامية، لا الصراع الدرامي.", "ru": "Это описание «Драматическая ирония», а не «Драматический конфликт».", "en": "That describes dramatic irony, not dramatic conflict."}]),
  Q("lit-drama-8281-2",{"he": "איזה תיאור מתאים להוראת במה?", "ar": "أي وصف يناسب إرشاد مسرحي؟", "ru": "Какое описание подходит к «Ремарка»?", "en": "Which description fits stage direction?"},[{"he": "התנגשות בין רצונות או ערכים שמניעה את הפעולה.", "ar": "تصادم رغبات أو قيم يدفع الأحداث.", "ru": "Столкновение желаний или ценностей движет действием.", "en": "A clash of desires or values that drives the action."},{"he": "הנחיה כתובה לשחקנים על תנועה, הבעה או חלל הבמה.", "ar": "تعليمات مكتوبة للممثلين عن الحركة أو التعبير أو المكان.", "ru": "Указание актёрам о движении, выражении или сценическом пространстве.", "en": "A written instruction about movement, expression or stage space."},{"he": "שיחה בין דמויות שבה כל תגובה יכולה לשנות את היחסים ביניהן.", "ar": "حديث بين شخصيات قد يغيّر فيه كل رد علاقتها.", "ru": "Разговор персонажей, в котором ответы меняют отношения.", "en": "A conversation between characters whose replies can alter their relationship."},{"he": "פער שבו הקהל יודע פרט חשוב שדמות על הבמה אינה יודעת.", "ar": "حالة يعرف فيها الجمهور أمرًا مهمًا تجهله شخصية على الخشبة.", "ru": "Ситуация, в которой зритель знает важное, а персонаж нет.", "en": "A gap where the audience knows something important a character does not."}],1,{"he": "חפשו את הפרט שמבדיל אותו מן האחרים.", "ar": "ابحثوا عن التفصيل الذي يميزه عن غيره.", "ru": "Ищите отличие от остальных вариантов.", "en": "Look for the detail that separates it from the others."},{"he": "הוראה זו מיועדת לביצוע על הבמה ולא נאמרת בדרך כלל כדיאלוג.", "ar": "هذا الإرشاد للأداء على المسرح، وليس عادة من الحوار المنطوق.", "ru": "Ремарка направляет постановку, а не звучит как реплика.", "en": "It guides performance and is not normally spoken dialogue."},null,[{"he": "זה מתאר את קונפליקט דרמטי, לא את הוראת במה.", "ar": "هذا يصف الصراع الدرامي، لا إرشاد مسرحي.", "ru": "Это описание «Драматический конфликт», а не «Ремарка».", "en": "That describes dramatic conflict, not stage direction."},null,{"he": "זה מתאר את דיאלוג, לא את הוראת במה.", "ar": "هذا يصف الحوار، لا إرشاد مسرحي.", "ru": "Это описание «Диалог», а не «Ремарка».", "en": "That describes dialogue, not stage direction."},{"he": "זה מתאר את אירוניה דרמטית, לא את הוראת במה.", "ar": "هذا يصف المفارقة الدرامية، لا إرشاد مسرحي.", "ru": "Это описание «Драматическая ирония», а не «Ремарка».", "en": "That describes dramatic irony, not stage direction."}])
 ,Q("lit-drama-mono",{"he": "איזה תיאור מתאים למונולוג?", "ar": "أي وصف يناسب المونولوج؟", "ru": "Какое описание подходит к монолог?", "en": "Which description fits monologue?"},[{"he": "דמות נשארת לבד על הבמה ואומרת בקול את מחשבותיה, כשהקהל שומע ואילו שאר הדמויות לא.", "ar": "تبقى الشخصية وحدها على المسرح وتقول أفكارها بصوت عالٍ، فيسمعها الجمهور دون بقية الشخصيات.", "ru": "Персонаж остаётся один на сцене и произносит свои мысли вслух: зрители слышат, а остальные герои нет.", "en": "A character stays alone on stage and speaks their thoughts aloud; the audience hears, the other characters do not."},{"he": "הרגע שבו המתח מגיע לקצה והדמות הראשית נדרשת להחלטה שאין ממנה חזרה.", "ar": "اللحظة التي يبلغ فيها التوتر أقصاه وتُطالب الشخصية الرئيسة بقرار لا رجوع عنه.", "ru": "Момент, когда напряжение достигает предела и главный герой должен принять решение, назад от которого нет пути.", "en": "The moment the tension peaks and the main character must make a decision with no way back."},{"he": "דמות שאינה במרכז העלילה, אך מעשיה מקדמים את הסיפור או מאירים את הדמות הראשית.", "ar": "شخصية ليست في مركز الحبكة، لكن أفعالها تدفع القصة أو تسلّط الضوء على الشخصية الرئيسة.", "ru": "Персонаж не в центре сюжета, но его поступки двигают историю или оттеняют главного героя.", "en": "A character not at the plot's center whose actions advance the story or highlight the main character."},{"he": "חלק של מחזה המחולק לתמונות, ובמהלכו מתקדמת העלילה או גדל המתח.", "ar": "جزء من المسرحية ينقسم إلى مشاهد، وفي أثنائه تتقدم الحبكة أو يزداد التوتر.", "ru": "Часть пьесы, делящаяся на сцены, в течение которой развивается сюжет или растёт напряжение.", "en": "A part of a play divided into scenes, during which the plot advances or the tension grows."}],0,{"he": "שימו לב מי שומע את הדברים ומי לא.", "ar": "لاحظوا مَن يسمع الكلام ومَن لا يسمعه.", "ru": "Обратите внимание, кто слышит слова, а кто нет.", "en": "Notice who hears the words and who does not."},{"he": "המבחין הוא שייכות הדברים: מונולוג נאמר לבד ולקהל. למשל דמות שמספרת בקול את פחדיה כשהיא לבד.", "ar": "المعيار هو لمن تُقال الكلمات: المونولوج يُقال في وِحدة أمام الجمهور. مثال: شخصية تبوح بمخاوفها وهي وحدها.", "ru": "Признак в том, кому адресованы слова: монолог произносится в одиночестве для зрителей. Например, герой вслух делится страхами, оставшись один.", "en": "The marker is who the words belong to: a monologue is spoken alone, to the audience. For example, a character voicing their fears while alone."},null,[null,{"he": "זה מתאר את השיא, לא את מונולוג.", "ar": "هذا يصف الذروة، لا المونولوج.", "ru": "Это описание «кульминацию», а не «монолог».", "en": "That describes the climax, not monologue."},{"he": "זה מתאר את דמות משנה, לא את מונולוג.", "ar": "هذا يصف شخصية ثانوية، لا المونولوج.", "ru": "Это описание «второстепенного персонажа», а не «монолог».", "en": "That describes a supporting character, not monologue."},{"he": "זה מתאר את מערכה, לא את מונולוג.", "ar": "هذا يصف الفصل المسرحي، لا المونولوج.", "ru": "Это описание «акт», а не «монолог».", "en": "That describes an act, not monologue."}]),
  Q("dr-1-01",{"he": "מהו \"דיבור הצידה\" (אסייד) בהצגה?", "ar": "ما \"الكلام الجانبي\" (المناجاة الجانبية) في المسرحية؟", "ru": "Что такое «реплика в сторону» в пьесе?", "en": "What is an \"aside\" in a play?"},[{"he": "משפט קצר שדמות אומרת לקהל, ושאר הדמויות כאילו לא שומעות", "ar": "جملة قصيرة تقولها شخصية للجمهور، وكأن بقية الشخصيات لا تسمعها", "ru": "Короткая фраза героя для зрителей, которую другие герои будто не слышат", "en": "A short line a character says to the audience, which the others seem not to hear"}, {"he": "שיחה ארוכה בין שתי דמויות שמתווכחות זו עם זו מול הקהל על הבמה", "ar": "حوار طويل بين شخصيتين تتجادلان بصوت عالٍ أمام الجمهور على خشبة المسرح", "ru": "Длинный разговор двух героев, которые спорят друг с другом на сцене перед залом", "en": "A long talk between two characters who argue with each other on stage before the audience"}, {"he": "הוראה בסוגריים לשחקן על תנועה", "ar": "إرشاد بين قوسين للممثل عن الحركة", "ru": "Ремарка в скобках о движении актёра", "en": "A note in brackets telling the actor how to move"}, {"he": "שיר שהמקהלה שרה", "ar": "أغنية تغنيها الجوقة", "ru": "Песня хора", "en": "A song the chorus sings"}],0,{"he": "למי הדמות פונה, ומי לא אמור לשמוע?", "ar": "إلى مَن تتوجه الشخصية، ومَن لا يُفترض أن يسمع؟", "ru": "К кому обращается герой и кто не должен слышать?", "en": "Whom does the character address, and who should not hear?"},{"he": "בדיבור הצידה הדמות משתפת את הקהל במחשבה. הדמויות האחרות על הבמה כאילו לא שומעות. כך הקהל יודע יותר מהן.", "ar": "في الكلام الجانبي تُشرك الشخصية الجمهور في فكرة. والشخصيات الأخرى على الخشبة كأنها لا تسمع. هكذا يعرف الجمهور أكثر منها.", "ru": "В реплике в сторону герой делится мыслью со зрителями. Другие герои на сцене будто не слышат. Так зрители знают больше них.", "en": "In an aside, a character shares a thought with the audience. The others on stage seem not to hear. So the audience knows more than they do."},null,[null, {"he": "זה דיאלוג, ובו הדמויות שומעות זו את זו.", "ar": "هذا حوار، وفيه تسمع الشخصيات بعضها بعضًا.", "ru": "Это диалог: герои слышат друг друга.", "en": "That is dialogue; the characters hear each other."}, {"he": "זו הוראת במה, והיא אינה נאמרת בקול.", "ar": "هذا إرشاد مسرحي، ولا يُقال بصوت عالٍ.", "ru": "Это ремарка, её не произносят вслух.", "en": "That is a stage direction; it is not spoken aloud."}, {"he": "שיר מקהלה אינו דברים שדמות אחת אומרת בסוד לקהל.", "ar": "أغنية الجوقة ليست كلامًا تقوله شخصية واحدة سرًّا للجمهور.", "ru": "Песня хора — не тайные слова одного героя залу.", "en": "A choral song is not one character's secret words to the audience."}]),
  Q("dr-1-02",{"he": "מה התפקיד של האקספוזיציה (הפתיחה) במחזה?", "ar": "ما دور العرض التمهيدي (الافتتاح) في المسرحية؟", "ru": "Какова роль экспозиции (начала) в пьесе?", "en": "What is the role of the exposition (opening) in a play?"},[{"he": "לפתור את כל הקונפליקטים", "ar": "حلّ جميع الصراعات", "ru": "Разрешить все конфликты", "en": "To resolve all the conflicts"}, {"he": "להציג דמויות, מקום ומצב פתיחה", "ar": "تقديم الشخصيات والمكان والوضع الأوّلي", "ru": "Представить героев, место и исходную ситуацию", "en": "To introduce characters, place and starting situation"}, {"he": "להגיע לרגע המתח הגבוה ביותר, שבו הגיבור מחליט", "ar": "الوصول إلى لحظة التوتر القصوى التي يقرر فيها البطل", "ru": "Дойти до момента наивысшего напряжения, когда герой решает", "en": "To reach the moment of highest tension, when the hero decides"}, {"he": "לסכם את המוסר של המחזה", "ar": "تلخيص العبرة من المسرحية", "ru": "Подвести мораль пьесы", "en": "To sum up the play's moral"}],1,{"he": "מה הקהל צריך לדעת כשהמסך עולה?", "ar": "ماذا يحتاج الجمهور أن يعرف حين يُرفع الستار؟", "ru": "Что нужно знать зрителям, когда поднимается занавес?", "en": "What does the audience need to know when the curtain rises?"},{"he": "האקספוזיציה פותחת את המחזה. היא מכירה לקהל את הדמויות, המקום והמצב. בלי הרקע הזה קשה להבין את הקונפליקט.", "ar": "العرض التمهيدي يفتتح المسرحية. يعرّف الجمهور بالشخصيات والمكان والوضع. وبدون هذه الخلفية يصعب فهم الصراع.", "ru": "Экспозиция открывает пьесу. Она знакомит зрителей с героями, местом и положением дел. Без этого трудно понять конфликт.", "en": "The exposition opens the play. It introduces the characters, place and situation. Without this background the conflict is hard to follow."},null,[{"he": "פתרון הקונפליקטים בא בסוף, בהתרה.", "ar": "حلّ الصراعات يأتي في النهاية، في الحلّ.", "ru": "Конфликты разрешаются в конце, в развязке.", "en": "Conflicts are resolved at the end, in the resolution."}, null, {"he": "זה תיאור של השיא, שבא מאוחר יותר.", "ar": "هذا وصف للذروة، وهي تأتي لاحقًا.", "ru": "Это описание кульминации, она бывает позже.", "en": "That describes the climax, which comes later."}, {"he": "סיכום מוסר, אם יש, בא בסוף ולא בפתיחה.", "ar": "تلخيص العبرة، إن وُجد، يأتي في النهاية لا في البداية.", "ru": "Мораль, если она есть, бывает в конце, а не в начале.", "en": "A moral, if any, comes at the end, not the opening."}]),
  Q("dr-1-03",{"he": "מהו \"פגם טרגי\" של גיבור?", "ar": "ما \"العيب المأساوي\" لدى البطل؟", "ru": "Что такое «трагическая вина» (изъян) героя?", "en": "What is a hero's \"tragic flaw\"?"},[{"he": "טעות כתיב בטקסט המחזה", "ar": "خطأ إملائي في نص المسرحية", "ru": "Опечатка в тексте пьесы", "en": "A spelling error in the script"}, {"he": "אויב חיצוני שתוקף אותו בלי שום קשר לאופי שלו", "ar": "عدوّ خارجي يهاجمه دون أي علاقة بطباعه", "ru": "Внешний враг, нападающий на него без всякой связи с его характером", "en": "An outside enemy who attacks him with no link to his character"}, {"he": "תכונה של הגיבור שתורמת לנפילתו", "ar": "صفة في البطل تُسهم في سقوطه", "ru": "Черта героя, которая ведёт к его падению", "en": "A trait of the hero that helps cause his downfall"}, {"he": "פציעה גופנית בסוף המחזה", "ar": "إصابة جسدية في نهاية المسرحية", "ru": "Физическая рана в конце пьесы", "en": "A physical wound at the end"}],2,{"he": "הפגם נמצא בתוך הגיבור, לא מחוצה לו.", "ar": "العيب موجود داخل البطل، لا خارجه.", "ru": "Изъян находится внутри героя, а не снаружи.", "en": "The flaw is inside the hero, not outside him."},{"he": "בטרגדיה, תכונה של הגיבור מובילה אותו לאסון. לעיתים זו גאווה או עקשנות. לכן הנפילה קשורה למי שהוא.", "ar": "في المأساة تقود صفةٌ البطلَ إلى الكارثة. قد تكون كبرياء أو عنادًا. لذلك يرتبط السقوط بمن هو.", "ru": "В трагедии черта героя ведёт его к беде. Это может быть гордость или упрямство. Поэтому падение связано с тем, кто он есть.", "en": "In tragedy, a trait of the hero leads him to disaster. It may be pride or stubbornness. So the fall is tied to who he is."},null,[{"he": "זה מונח ספרותי על אופי, לא שגיאה בהדפסה.", "ar": "هذا مصطلح أدبي عن الطبع، لا خطأ في الطباعة.", "ru": "Это литературный термин о характере, не опечатка.", "en": "It is a literary term about character, not a typo."}, {"he": "הפגם הוא חלק מהגיבור עצמו, ולא כוח חיצוני.", "ar": "العيب جزء من البطل نفسه، لا قوة خارجية.", "ru": "Изъян — часть самого героя, а не внешняя сила.", "en": "The flaw is part of the hero, not an outside force."}, null, {"he": "פציעה היא תוצאה אפשרית, לא תכונה של אופי.", "ar": "الإصابة نتيجة محتملة، لا صفة في الطبع.", "ru": "Рана — возможное следствие, а не черта характера.", "en": "A wound is a possible result, not a character trait."}]),
  Q("dr-1-04",{"he": "מה קורה בדרך כלל בהתרה, בסוף המחזה?", "ar": "ماذا يحدث عادةً في الحلّ، في نهاية المسرحية؟", "ru": "Что обычно происходит в развязке, в конце пьесы?", "en": "What usually happens in the resolution at the end of a play?"},[{"he": "הדמויות מוצגות לקהל בפעם הראשונה", "ar": "تُقدَّم الشخصيات للجمهور أول مرة", "ru": "Героев впервые представляют зрителям", "en": "The characters are introduced for the first time"}, {"he": "המתח רק מתחיל להיבנות", "ar": "التوتر يبدأ للتوّ في التصاعد", "ru": "Напряжение только начинает расти", "en": "Tension is only starting to build"}, {"he": "השחקנים מחליפים תפאורה בין המערכות בלי לדבר", "ar": "يغيّر الممثلون الديكور بين الفصول دون كلام", "ru": "Актёры молча меняют декорации между действиями", "en": "The actors silently change the set between acts"}, {"he": "הקונפליקט מגיע לפתרון או לתוצאה", "ar": "يصل الصراع إلى حلّ أو نتيجة", "ru": "Конфликт приходит к решению или итогу", "en": "The conflict reaches a solution or outcome"}],3,{"he": "חשבו מה קורה למתח אחרי השיא.", "ar": "فكّروا ماذا يحدث للتوتر بعد الذروة.", "ru": "Подумайте, что бывает с напряжением после кульминации.", "en": "Think about what happens to tension after the climax."},{"he": "ההתרה באה אחרי השיא. המתח יורד, והקונפליקט מגיע לתוצאה. התוצאה יכולה להיות שמחה או עצובה.", "ar": "يأتي الحلّ بعد الذروة. ينخفض التوتر ويصل الصراع إلى نتيجة. قد تكون النتيجة سعيدة أو حزينة.", "ru": "Развязка следует за кульминацией. Напряжение спадает, конфликт приходит к итогу. Итог может быть радостным или печальным.", "en": "The resolution follows the climax. Tension falls and the conflict reaches an outcome. The outcome can be happy or sad."},null,[{"he": "הצגת הדמויות שייכת לפתיחה, לא לסוף.", "ar": "تقديم الشخصيات يعود إلى الافتتاح، لا إلى النهاية.", "ru": "Знакомство с героями — это начало, а не конец.", "en": "Introducing characters belongs to the opening, not the end."}, {"he": "המתח נבנה באמצע; בסוף הוא יורד.", "ar": "يتصاعد التوتر في الوسط؛ وفي النهاية ينخفض.", "ru": "Напряжение растёт в середине, а в конце спадает.", "en": "Tension builds in the middle; at the end it falls."}, {"he": "החלפת תפאורה היא עניין טכני, לא שלב בעלילה.", "ar": "تغيير الديكور مسألة تقنية، لا مرحلة في الحبكة.", "ru": "Смена декораций — техника, а не этап сюжета.", "en": "Changing the set is technical, not a stage of the plot."}, null]),
  Q("dr-1-05",{"he": "מה תפקיד המקהלה בטרגדיה היוונית?", "ar": "ما دور الجوقة في المأساة اليونانية؟", "ru": "Какова роль хора в греческой трагедии?", "en": "What is the role of the chorus in Greek tragedy?"},[{"he": "להגיב על האירועים ולפרש אותם לקהל", "ar": "التعليق على الأحداث وتفسيرها للجمهور", "ru": "Откликаться на события и толковать их для зрителей", "en": "To comment on events and interpret them for the audience"}, {"he": "לנגן מוזיקה ברקע בלבד, בלי לומר אף מילה על העלילה", "ar": "العزف في الخلفية فقط، دون قول أي كلمة عن الأحداث", "ru": "Только играть музыку фоном, не говоря ни слова о сюжете", "en": "Only to play background music, without a word about the plot"}, {"he": "לשחק את הגיבור הראשי", "ar": "تمثيل دور البطل الرئيسي", "ru": "Играть главного героя", "en": "To play the main hero"}, {"he": "לבנות את התפאורה", "ar": "بناء الديكور", "ru": "Строить декорации", "en": "To build the set"}],0,{"he": "המקהלה היא קבוצה שמדברת ושרה. על מה?", "ar": "الجوقة مجموعة تتكلم وتغني. عن ماذا؟", "ru": "Хор — группа, которая говорит и поёт. О чём?", "en": "The chorus is a group that speaks and sings. About what?"},{"he": "המקהלה היוונית מגיבה למה שקורה על הבמה. היא מביעה פחד, רחמים או אזהרה. כך היא מנחה את הקהל בהבנת האירועים.", "ar": "تتفاعل الجوقة اليونانية مع ما يجري على الخشبة. تعبّر عن الخوف أو الشفقة أو التحذير. هكذا توجّه الجمهور في فهم الأحداث.", "ru": "Греческий хор откликается на происходящее на сцене. Он выражает страх, жалость или предупреждение. Так он помогает зрителям понять события.", "en": "The Greek chorus reacts to what happens on stage. It voices fear, pity or warning. So it guides the audience's understanding."},null,[null, {"he": "המקהלה מדברת ושרה מילים שקשורות לעלילה.", "ar": "الجوقة تتكلم وتغني كلمات مرتبطة بالأحداث.", "ru": "Хор говорит и поёт слова, связанные с сюжетом.", "en": "The chorus speaks and sings words tied to the plot."}, {"he": "הגיבור הוא דמות נפרדת; המקהלה היא קבוצה.", "ar": "البطل شخصية منفصلة؛ والجوقة مجموعة.", "ru": "Герой — отдельный персонаж, а хор — группа.", "en": "The hero is a separate figure; the chorus is a group."}, {"he": "המקהלה היא חלק מההצגה, לא צוות במה.", "ar": "الجوقة جزء من العرض، لا طاقم خشبة.", "ru": "Хор — часть спектакля, а не рабочие сцены.", "en": "The chorus is part of the play, not stage crew."}]),
  Q("dr-1-06",{"he": "במה מחזה שונה מסיפור קצר בדרך שבה הוא מוסר את העלילה?", "ar": "بمَ تختلف المسرحية عن القصة القصيرة في طريقة نقل الأحداث؟", "ru": "Чем пьеса отличается от рассказа в способе передачи сюжета?", "en": "How does a play differ from a short story in how it conveys the plot?"},[{"he": "במחזה תמיד יש מספר יודע־כול שמסביר לקהל את מחשבות כל הדמויות", "ar": "في المسرحية يوجد دائمًا راوٍ عليم يشرح للجمهور أفكار جميع الشخصيات", "ru": "В пьесе всегда есть всезнающий рассказчик, объясняющий мысли всех героев", "en": "A play always has an all-knowing narrator explaining every character's thoughts"}, {"he": "במחזה העלילה עוברת בעיקר דרך דיאלוג ופעולה", "ar": "في المسرحية تنتقل الأحداث أساسًا عبر الحوار والفعل", "ru": "В пьесе сюжет передаётся в основном через диалог и действие", "en": "In a play the plot comes mainly through dialogue and action"}, {"he": "מחזה נכתב תמיד בחרוזים", "ar": "تُكتب المسرحية دائمًا بالقافية", "ru": "Пьесу всегда пишут в рифму", "en": "A play is always written in rhyme"}, {"he": "במחזה אין דמויות", "ar": "لا توجد شخصيات في المسرحية", "ru": "В пьесе нет персонажей", "en": "A play has no characters"}],1,{"he": "חשבו מה הקהל באולם רואה ושומע.", "ar": "فكّروا فيما يراه الجمهور في القاعة ويسمعه.", "ru": "Подумайте, что зрители в зале видят и слышат.", "en": "Think about what the audience sees and hears."},{"he": "במחזה בדרך כלל אין קול של מספר. הקהל לומד על הדמויות ממה שהן אומרות ועושות. הוראות הבמה עוזרות לשחקנים, אבל אינן נאמרות.", "ar": "في المسرحية لا يوجد عادةً صوت راوٍ. يتعرّف الجمهور على الشخصيات مما تقوله وتفعله. الإرشادات المسرحية تساعد الممثلين لكنها لا تُقال.", "ru": "В пьесе обычно нет голоса рассказчика. Зрители узнают героев по их словам и делам. Ремарки помогают актёрам, но их не произносят.", "en": "A play usually has no narrator's voice. The audience learns from what characters say and do. Stage directions help actors but are not spoken."},null,[{"he": "במחזה בדרך כלל אין מספר; הדמויות מדברות בעצמן.", "ar": "في المسرحية لا يوجد راوٍ عادةً؛ الشخصيات تتكلم بنفسها.", "ru": "В пьесе обычно нет рассказчика; герои говорят сами.", "en": "A play usually has no narrator; the characters speak for themselves."}, null, {"he": "מחזות רבים כתובים בפרוזה, בלי חרוזים.", "ar": "كثير من المسرحيات مكتوبة نثرًا، دون قافية.", "ru": "Многие пьесы написаны прозой, без рифмы.", "en": "Many plays are in prose, without rhyme."}, {"he": "מחזה בנוי על דמויות שמדברות ופועלות.", "ar": "المسرحية مبنية على شخصيات تتكلم وتفعل.", "ru": "Пьеса строится на говорящих и действующих героях.", "en": "A play is built on characters who speak and act."}])],
 [
  Q("lit-drama-8281-3",{"he": "איזה תיאור מתאים לדיאלוג?", "ar": "أي وصف يناسب الحوار؟", "ru": "Какое описание подходит к «Диалог»?", "en": "Which description fits dialogue?"},[{"he": "התנגשות בין רצונות או ערכים שמניעה את הפעולה.", "ar": "تصادم رغبات أو قيم يدفع الأحداث.", "ru": "Столкновение желаний или ценностей движет действием.", "en": "A clash of desires or values that drives the action."},{"he": "הנחיה כתובה לשחקנים על תנועה, הבעה או חלל הבמה.", "ar": "تعليمات مكتوبة للممثلين عن الحركة أو التعبير أو المكان.", "ru": "Указание актёрам о движении, выражении или сценическом пространстве.", "en": "A written instruction about movement, expression or stage space."},{"he": "שיחה בין דמויות שבה כל תגובה יכולה לשנות את היחסים ביניהן.", "ar": "حديث بين شخصيات قد يغيّر فيه كل رد علاقتها.", "ru": "Разговор персонажей, в котором ответы меняют отношения.", "en": "A conversation between characters whose replies can alter their relationship."},{"he": "פער שבו הקהל יודע פרט חשוב שדמות על הבמה אינה יודעת.", "ar": "حالة يعرف فيها الجمهور أمرًا مهمًا تجهله شخصية على الخشبة.", "ru": "Ситуация, в которой зритель знает важное, а персонаж нет.", "en": "A gap where the audience knows something important a character does not."}],2,{"he": "חפשו את הפרט שמבדיל אותו מן האחרים.", "ar": "ابحثوا عن التفصيل الذي يميزه عن غيره.", "ru": "Ищите отличие от остальных вариантов.", "en": "Look for the detail that separates it from the others."},{"he": "דיאלוג נבנה מחילופי דברים בין דמויות.", "ar": "يتكون الحوار من تبادل الكلام بين الشخصيات.", "ru": "Диалог состоит из обмена репликами.", "en": "Dialogue consists of exchanged speech."},null,[{"he": "זה מתאר את קונפליקט דרמטי, לא את דיאלוג.", "ar": "هذا يصف الصراع الدرامي، لا الحوار.", "ru": "Это описание «Драматический конфликт», а не «Диалог».", "en": "That describes dramatic conflict, not dialogue."},{"he": "זה מתאר את הוראת במה, לא את דיאלוג.", "ar": "هذا يصف إرشاد مسرحي، لا الحوار.", "ru": "Это описание «Ремарка», а не «Диалог».", "en": "That describes stage direction, not dialogue."},null,{"he": "זה מתאר את אירוניה דרמטית, לא את דיאלוג.", "ar": "هذا يصف المفارقة الدرامية، لا الحوار.", "ru": "Это описание «Драматическая ирония», а не «Диалог».", "en": "That describes dramatic irony, not dialogue."}])
 ,Q("lit-drama-climax",{"he": "איזה תיאור מתאים להשיא?", "ar": "أي وصف يناسب الذروة؟", "ru": "Какое описание подходит к кульминацию?", "en": "Which description fits the climax?"},[{"he": "דמות נשארת לבד על הבמה ואומרת בקול את מחשבותיה, כשהקהל שומע ואילו שאר הדמויות לא.", "ar": "تبقى الشخصية وحدها على المسرح وتقول أفكارها بصوت عالٍ، فيسمعها الجمهور دون بقية الشخصيات.", "ru": "Персонаж остаётся один на сцене и произносит свои мысли вслух: зрители слышат, а остальные герои нет.", "en": "A character stays alone on stage and speaks their thoughts aloud; the audience hears, the other characters do not."},{"he": "הרגע שבו המתח מגיע לקצה והדמות הראשית נדרשת להחלטה שאין ממנה חזרה.", "ar": "اللحظة التي يبلغ فيها التوتر أقصاه وتُطالب الشخصية الرئيسة بقرار لا رجوع عنه.", "ru": "Момент, когда напряжение достигает предела и главный герой должен принять решение, назад от которого нет пути.", "en": "The moment the tension peaks and the main character must make a decision with no way back."},{"he": "דמות שאינה במרכז העלילה, אך מעשיה מקדמים את הסיפור או מאירים את הדמות הראשית.", "ar": "شخصية ليست في مركز الحبكة، لكن أفعالها تدفع القصة أو تسلّط الضوء على الشخصية الرئيسة.", "ru": "Персонаж не в центре сюжета, но его поступки двигают историю или оттеняют главного героя.", "en": "A character not at the plot's center whose actions advance the story or highlight the main character."},{"he": "חלק של מחזה המחולק לתמונות, ובמהלכו מתקדמת העלילה או גדל המתח.", "ar": "جزء من المسرحية ينقسم إلى مشاهد، وفي أثنائه تتقدم الحبكة أو يزداد التوتر.", "ru": "Часть пьесы, делящаяся на сцены, в течение которой развивается сюжет или растёт напряжение.", "en": "A part of a play divided into scenes, during which the plot advances or the tension grows."}],1,{"he": "חפשו את הרגע שאחרי אין דרך חזרה.", "ar": "ابحثوا عن اللحظة التي لا طريق للعودة بعدها.", "ru": "Ищите момент, после которого нет пути назад.", "en": "Look for the moment after which there is no way back."},{"he": "השיא הוא נקודת ההכרעה של המתח. למשל החלטה של הדמות הראשית משנה את המצב ואי אפשר לבטל אותה.", "ar": "الذروة هي نقطة حسم التوتر. مثال: قرار الشخصية الرئيسة يغيّر الوضع ولا يمكن التراجع عنه.", "ru": "Кульминация — точка развязки напряжения. Например, решение главного героя меняет положение, и отменить его нельзя.", "en": "The climax is where the tension breaks. For example, the main character's decision changes everything and cannot be undone."},null,[{"he": "זה מתאר את מונולוג, לא את השיא.", "ar": "هذا يصف المونولوج، لا الذروة.", "ru": "Это описание «монолог», а не «кульминацию».", "en": "That describes monologue, not the climax."},null,{"he": "זה מתאר את דמות משנה, לא את השיא.", "ar": "هذا يصف شخصية ثانوية، لا الذروة.", "ru": "Это описание «второстепенного персонажа», а не «кульминацию».", "en": "That describes a supporting character, not the climax."},{"he": "זה מתאר את מערכה, לא את השיא.", "ar": "هذا يصف الفصل المسرحي، لا الذروة.", "ru": "Это описание «акт», а не «кульминацию».", "en": "That describes an act, not the climax."}]),Q("lit-drama-mono-use",{"he": "במחזה מקורי, דמות נשארת לבד ואומרת: \"איש לא יודע מה עשיתי באותו לילה\". מה הקהל מקבל מהמשפט הזה?", "ar": "في مسرحية أصلية، تبقى الشخصية وحدها وتقول: «لا أحد يعرف ما فعلته تلك الليلة». ماذا يحصل عليه الجمهور من هذه الجملة؟", "ru": "В новой пьесе героиня остаётся одна и говорит: «Никто не знает, что я сделала той ночью». Что зрители получают от этой фразы?", "en": "In an original play, a character stays alone and says: \"No one knows what I did that night.\" What does the audience get from this line?"},[{"he": "מידע שהדמויות האחרות אינן יודעות", "ar": "معلومة لا تعرفها بقية الشخصيات", "ru": "Информацию, которой нет у остальных героев", "en": "Information the other characters do not have"},{"he": "הוראה לתאורן לכבות את האורות", "ar": "تعليمة للإضاءة بإطفاء الأنوار", "ru": "Указание осветителю погасить свет", "en": "A cue for the lighting operator to dim the lights"},{"he": "אות לסיום המערכה", "ar": "إشارة لنهاية الفصل", "ru": "Сигнал к концу акта", "en": "A signal that the act is ending"},{"he": "טעות של השחקנית בטקסט", "ar": "خطأ الممثلة في النصّ", "ru": "Ошибку актрисы в тексте", "en": "A mistake by the actress in the text"}],0,{"he": "מי שומע את המשפט ומי לא?", "ar": "مَن يسمع الجملة ومَن لا يسمعها؟", "ru": "Кто слышит фразу, а кто нет?", "en": "Who hears the line and who does not?"},{"he": "מונולוג חושף בפני הקהל מידע סודי. למשל כאן הקהל לומד על מעשה נסתר, והדמויות ממשיכות לפעול בלי לדעת.", "ar": "المونولوج يكشف للجمهور معلومة سرّية. مثال: هنا يعرف الجمهور بفعل خفي بينما تواصل الشخصيات التصرف دون علم.", "ru": "Монолог открывает зрителям тайну. Например, здесь зрители узнают о скрытом поступке, а герои продолжают действовать, не зная.", "en": "A monologue reveals secret information to the audience. For example, here the audience learns of a hidden act while the characters keep acting unaware."},null,[null,{"he": "המשפט הוא חלק מהדיאלוג של הדמות, לא הוראת במה.", "ar": "الجملة جزء من كلام الشخصية وليست تعليمة مسرحية.", "ru": "Фраза — часть реплики героини, а не сценическая ремарка.", "en": "The line is part of the character's speech, not a stage direction."},{"he": "שום סימן לא מצביע על סיום; הדמות באמצע חשיפה.", "ar": "لا إشارة إلى النهاية، فالشخصية في منتصف كشف.", "ru": "Ничто не указывает на конец; героиня посреди признания.", "en": "Nothing points to an ending; the character is mid-revelation."},{"he": "המשפט כתוב במחזה ומשרת את העלילה.", "ar": "الجملة مكتوبة في المسرحية وتخدم الحبكة.", "ru": "Фраза написана в пьесе и служит сюжету.", "en": "The line is written in the play and serves the plot."}]),
  Q("dr-2-01",{"he": "במחזה מקורי: \"(דנה שמה את המכתב בכיס, בלי לפתוח אותו.) דנה: אקרא אחר כך.\" מה הוראת הבמה מוסיפה?", "ar": "في مسرحية أصلية: \"(تضع دانا الرسالة في جيبها دون أن تفتحها.) دانا: سأقرؤها لاحقًا.\" ماذا يضيف الإرشاد المسرحي؟", "ru": "В оригинальной пьесе: «(Дана кладёт письмо в карман, не открывая.) Дана: Прочту потом». Что добавляет ремарка?", "en": "In an original play: \"(Dana puts the letter in her pocket without opening it.) Dana: I'll read it later.\" What does the stage direction add?"},[{"he": "הנחיה לתאורן להחשיך את הבמה", "ar": "توجيه لمسؤول الإضاءة بإطفاء الأضواء", "ru": "Указание осветителю затемнить сцену", "en": "An instruction to the lighting crew to dim the stage"}, {"he": "משפט שדנה אומרת לקהל", "ar": "جملة تقولها دانا للجمهور", "ru": "Фразу, которую Дана говорит залу", "en": "A line Dana says to the audience"}, {"he": "פעולה שמרמזת שדנה מהססת לקרוא", "ar": "فعل يلمّح إلى أن دانا تتردد في القراءة", "ru": "Действие, намекающее, что Дана не решается читать", "en": "An action hinting that Dana hesitates to read"}, {"he": "הסבר שדנה אינה יודעת לקרוא, ולכן היא לא פותחת מכתבים", "ar": "تفسير بأن دانا لا تعرف القراءة، ولذلك لا تفتح الرسائل", "ru": "Объяснение, что Дана не умеет читать и поэтому не открывает письма", "en": "An explanation that Dana cannot read, so she never opens letters"}],2,{"he": "מה דנה עושה בידיים, ומה זה אומר על רצונה?", "ar": "ماذا تفعل دانا بيديها، وماذا يدلّ ذلك عن رغبتها؟", "ru": "Что Дана делает руками и что это говорит о её желании?", "en": "What does Dana do with her hands, and what does it say about her wish?"},{"he": "הוראת הבמה מתארת פעולה, לא מחשבה. דנה דוחה את הקריאה, וזה רומז על היסוס או פחד. כך הפעולה מוסיפה משמעות לדברים.", "ar": "يصف الإرشاد المسرحي فعلًا لا فكرة. دانا تؤجّل القراءة، وهذا يلمّح إلى تردد أو خوف. هكذا يضيف الفعل معنى للكلام.", "ru": "Ремарка описывает действие, а не мысль. Дана откладывает чтение — это намёк на колебание или страх. Так действие добавляет смысл к словам.", "en": "The stage direction shows an action, not a thought. Dana delays reading, hinting at hesitation or fear. So the action adds meaning to the words."},null,[{"he": "ההוראה עוסקת במעשה של דנה, לא בתאורה.", "ar": "الإرشاد يتعلق بفعل دانا، لا بالإضاءة.", "ru": "Ремарка касается действия Даны, а не света.", "en": "The direction concerns Dana's action, not the lighting."}, {"he": "הוראת במה אינה נאמרת בקול על הבמה.", "ar": "الإرشاد المسرحي لا يُقال بصوت عالٍ على الخشبة.", "ru": "Ремарку не произносят вслух на сцене.", "en": "A stage direction is not spoken aloud on stage."}, null, {"he": "דנה אומרת \"אקרא\", ולכן היא יודעת לקרוא.", "ar": "تقول دانا \"سأقرؤها\"، فهي تعرف القراءة.", "ru": "Дана говорит «прочту», значит, она умеет читать.", "en": "Dana says \"I'll read it\", so she can read."}]),
  Q("dr-2-02",{"he": "הקהל ראה את רון מחביא מפתח. בתמונה הבאה אחותו מחפשת אותו ושואלת: \"אולי אתה יודע איפה הוא?\" רון עונה: \"אין לי מושג.\" מה נוצר כאן?", "ar": "رأى الجمهور رون يخبّئ مفتاحًا. في المشهد التالي تبحث أخته عنه وتسأل: \"هل تعرف أين هو؟\" يجيب رون: \"لا فكرة لديّ.\" ما الذي ينشأ هنا؟", "ru": "Зрители видели, как Рон прячет ключ. В следующей сцене сестра ищет его и спрашивает: «Ты не знаешь, где он?» Рон отвечает: «Понятия не имею». Что здесь возникает?", "en": "The audience saw Ron hide a key. In the next scene his sister searches and asks, \"Do you know where it is?\" Ron says, \"No idea.\" What is created here?"},[{"he": "מונולוג: רון לבד על הבמה ומגלה לקהל את כל מחשבותיו הסודיות", "ar": "مونولوج: رون وحده على الخشبة ويكشف للجمهور كل أفكاره السرية", "ru": "Монолог: Рон один на сцене и открывает залу все свои тайные мысли", "en": "A monologue: Ron alone on stage revealing all his secret thoughts"}, {"he": "אקספוזיציה: הצגה ראשונה של הדמויות", "ar": "عرض تمهيدي: أول تقديم للشخصيات", "ru": "Экспозиция: первое знакомство с героями", "en": "Exposition: the first introduction of characters"}, {"he": "התרה של הקונפליקט", "ar": "حلّ الصراع", "ru": "Развязка конфликта", "en": "The resolution of the conflict"}, {"he": "אירוניה דרמטית: הקהל יודע מה שהאחות אינה יודעת", "ar": "مفارقة درامية: يعرف الجمهور ما لا تعرفه الأخت", "ru": "Драматическая ирония: зрители знают то, чего не знает сестра", "en": "Dramatic irony: the audience knows what the sister does not"}],3,{"he": "מה ראה הקהל בתמונה הקודמת, ומה ראתה האחות?", "ar": "ماذا رأى الجمهور في المشهد السابق، وماذا رأت الأخت؟", "ru": "Что видели зрители в прошлой сцене, а что видела сестра?", "en": "What did the audience see in the previous scene, and what did the sister see?"},{"he": "הקהל ראה את רון מחביא את המפתח, והאחות לא ראתה. לכן הקהל מבין שרון משקר. פער ידיעה כזה בין הקהל לדמות נקרא אירוניה דרמטית.", "ar": "رأى الجمهور رون يخبّئ المفتاح، ولم تره الأخت. لذلك يفهم الجمهور أن رون يكذب. فجوة المعرفة هذه بين الجمهور والشخصية تسمى مفارقة درامية.", "ru": "Зрители видели, как Рон прятал ключ, а сестра — нет. Поэтому зрители понимают, что Рон лжёт. Такой разрыв знания — драматическая ирония.", "en": "The audience saw Ron hide the key; the sister did not. So the audience knows Ron is lying. This knowledge gap is dramatic irony."},null,[{"he": "רון מדבר עם אחותו, ולכן זה דיאלוג ולא מונולוג.", "ar": "رون يتحدث مع أخته، فهذا حوار لا مونولوج.", "ru": "Рон говорит с сестрой, значит, это диалог, а не монолог.", "en": "Ron talks with his sister, so this is dialogue, not a monologue."}, {"he": "הדמויות כבר מוכרות לקהל; זו אינה הפתיחה.", "ar": "الشخصيات معروفة للجمهور؛ هذا ليس الافتتاح.", "ru": "Герои уже знакомы зрителям; это не начало.", "en": "The characters are already known; this is not the opening."}, {"he": "הקונפליקט רק מחריף כאן, ואינו נפתר.", "ar": "الصراع يشتد هنا ولا يُحلّ.", "ru": "Конфликт здесь обостряется, а не разрешается.", "en": "The conflict sharpens here; it is not resolved."}, null]),
  Q("dr-2-03",{"he": "במחזה מקורי, בת רוצה להיות מוזיקאית. אביה דורש שתלמד רפואה. מה הקונפליקט המרכזי?", "ar": "في مسرحية أصلية، تريد ابنة أن تصبح موسيقية. ويطالبها أبوها بدراسة الطب. ما الصراع المركزي؟", "ru": "В оригинальной пьесе дочь хочет стать музыкантом. Отец требует, чтобы она училась медицине. Каков главный конфликт?", "en": "In an original play, a daughter wants to be a musician. Her father demands she study medicine. What is the central conflict?"},[{"he": "קונפליקט בין דמויות: רצון הבת מול דרישת האב", "ar": "صراع بين شخصيات: رغبة الابنة مقابل مطلب الأب", "ru": "Конфликт между героями: желание дочери против требования отца", "en": "A conflict between characters: the daughter's wish against the father's demand"}, {"he": "קונפליקט בין אדם לטבע", "ar": "صراع بين الإنسان والطبيعة", "ru": "Конфликт человека и природы", "en": "Person against nature"}, {"he": "אין קונפליקט, כי הם משפחה", "ar": "لا صراع، لأنهم عائلة", "ru": "Конфликта нет, ведь они семья", "en": "No conflict, since they are family"}, {"he": "קונפליקט בין המחבר לבין הקהל שצופה בהצגה באולם התיאטרון", "ar": "صراع بين المؤلف والجمهور الذي يشاهد العرض في قاعة المسرح", "ru": "Конфликт между автором и зрителями, смотрящими спектакль в театральном зале", "en": "A conflict between the author and the audience who sit watching the show in the theatre hall"}],0,{"he": "מי רוצה מה, והאם הרצונות מתנגשים?", "ar": "مَن يريد ماذا، وهل تتصادم الرغبات؟", "ru": "Кто чего хочет и сталкиваются ли желания?", "en": "Who wants what, and do the wishes clash?"},{"he": "שתי דמויות רוצות דברים שאינם מתיישבים זה עם זה. ההתנגשות בין הבת לאב מניעה את העלילה. זה קונפליקט בין דמויות.", "ar": "شخصيتان تريدان أمرين لا يتّفقان. والتصادم بين الابنة والأب يحرّك الحبكة. هذا صراع بين شخصيات.", "ru": "Два героя хотят несовместимого. Столкновение дочери и отца движет сюжетом. Это конфликт между героями.", "en": "Two characters want things that cannot fit together. The clash between daughter and father drives the plot. This is conflict between characters."},null,[null, {"he": "אין כאן מאבק בכוח טבע.", "ar": "لا صراع هنا مع قوة طبيعية.", "ru": "Здесь нет борьбы с природой.", "en": "There is no struggle with a force of nature here."}, {"he": "גם בתוך משפחה יכולים רצונות להתנגש.", "ar": "حتى داخل العائلة قد تتصادم الرغبات.", "ru": "И в семье желания могут сталкиваться.", "en": "Wishes can clash even within a family."}, {"he": "הקונפליקט נמצא בתוך המחזה, בין הדמויות.", "ar": "الصراع داخل المسرحية، بين الشخصيات.", "ru": "Конфликт внутри пьесы, между героями.", "en": "The conflict is inside the play, between characters."}]),
  Q("dr-2-04",{"he": "בתחילת \"המלט\" של שייקספיר, רוח האב מגלה להמלט שדודו רצח אותו. איזה תפקיד יש לגילוי הזה במבנה המחזה?", "ar": "في بداية \"هاملت\" لشكسبير، يكشف شبح الأب لهاملت أن عمّه قتله. ما دور هذا الكشف في بناء المسرحية؟", "ru": "В начале «Гамлета» Шекспира призрак отца открывает Гамлету, что его убил дядя. Какова роль этого открытия в строении пьесы?", "en": "Early in Shakespeare's \"Hamlet\", the father's ghost tells Hamlet that his uncle murdered him. What role does this reveal play in the structure?"},[{"he": "זהו השיא, הרגע שבו המתח הכי גבוה", "ar": "هذه الذروة، لحظة أعلى توتر", "ru": "Это кульминация, момент наивысшего напряжения", "en": "It is the climax, the moment of highest tension"}, {"he": "אירוע בפתיחה שמניע את העלילה", "ar": "حدث في الافتتاح يحرّك الحبكة", "ru": "Событие в начале, которое запускает сюжет", "en": "An early event that sets the plot in motion"}, {"he": "זו ההתרה, שבה כל הקונפליקטים נפתרים", "ar": "هذا الحلّ، حيث تُحلّ كل الصراعات", "ru": "Это развязка, где все конфликты решены", "en": "It is the resolution, where all conflicts end"}, {"he": "קטע שלא קשור לעלילה ונועד רק להפחיד את הקהל באולם", "ar": "مقطع لا علاقة له بالحبكة ويهدف فقط إلى تخويف الجمهور في القاعة", "ru": "Эпизод вне сюжета, нужный только чтобы напугать зрителей в зале", "en": "A scene unrelated to the plot, meant only to scare the audience in the hall"}],1,{"he": "מה המלט רוצה לעשות אחרי שהוא שומע את הדברים?", "ar": "ماذا يريد هاملت أن يفعل بعد أن يسمع الكلام؟", "ru": "Что Гамлет хочет сделать, услышав это?", "en": "What does Hamlet want to do after he hears this?"},{"he": "הגילוי בא במערכה הראשונה. הוא נותן להמלט מטרה: לנקום ברוצח. מכאן מתחילה העלילה לנוע.", "ar": "يأتي الكشف في الفصل الأول. يمنح هاملت هدفًا: الانتقام من القاتل. ومن هنا تبدأ الحبكة بالتحرك.", "ru": "Открытие происходит в первом действии. Оно даёт Гамлету цель — отомстить убийце. С этого начинается движение сюжета.", "en": "The reveal comes in the first act. It gives Hamlet a goal: revenge on the killer. From here the plot starts to move."},null,[{"he": "הגילוי בא בתחילת המחזה, והשיא בא הרבה אחר כך.", "ar": "الكشف يأتي في بداية المسرحية، والذروة بعده بكثير.", "ru": "Открытие — в начале пьесы, а кульминация намного позже.", "en": "The reveal is early; the climax comes much later."}, null, {"he": "הגילוי פותח קונפליקט, ואינו פותר אותו.", "ar": "الكشف يفتح صراعًا ولا يحلّه.", "ru": "Открытие начинает конфликт, а не решает его.", "en": "The reveal opens a conflict; it does not resolve it."}, {"he": "הגילוי מניע את כל הנקמה של המלט.", "ar": "الكشف يحرّك انتقام هاملت كله.", "ru": "Открытие движет всей местью Гамлета.", "en": "The reveal drives Hamlet's whole quest for revenge."}]),
