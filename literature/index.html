  {"he": "שירה: צורה ודימוי", "ar": "الشعر: الشكل والصورة", "ru": "Поэзия: форма и образ", "en": "Poetry: form and image"},
  {"he": "תרגלו הבחנה בין אמצעים בשיר", "ar": "ميّزوا وسائل التعبير في القصيدة", "ru": "Различайте поэтические приёмы", "en": "Distinguish devices in a poem"},
[ [
  Q("lit-poetry-8281-1",{"he": "איזה תיאור מתאים לדימוי?", "ar": "أي وصف يناسب التشبيه؟", "ru": "Какое описание подходит к «Сравнение»?", "en": "Which description fits simile?"},[{"he": "השוואה מפורשת בין שני דברים בעזרת מילה כגון \"כמו\".", "ar": "مقارنة صريحة بين شيئين بكلمة مثل «مثل».", "ru": "Явное сопоставление двух вещей со словом «как».", "en": "An explicit comparison using a word such as \"like\"."},{"he": "הצגת דבר אחד כאילו היה דבר אחר, בלי מילת השוואה מפורשת.", "ar": "تصوير شيء كأنه شيء آخر دون أداة تشبيه صريحة.", "ru": "Представление одного как другого без явного слова сравнения.", "en": "Presenting one thing as another without an explicit comparison word."},{"he": "המשך המשפט מעבר לסוף השורה השירית בלי עצירה תחבירית.", "ar": "استمرار الجملة بعد نهاية السطر الشعري دون وقفة نحوية.", "ru": "Продолжение предложения за конец строки без синтаксической паузы.", "en": "A sentence continuing past a poetic line break without a syntactic stop."},{"he": "שימוש חוזר במילה או במבנה כדי להבליט קשר או הבדל.", "ar": "عودة كلمة أو تركيب لإبراز صلة أو فرق.", "ru": "Повтор слова или конструкции, подчёркивающий связь или различие.", "en": "Repeated use of a word or pattern to stress a link or contrast."}],0,{"he": "חפשו את הפרט שמבדיל אותו מן האחרים.", "ar": "ابحثوا عن التفصيل الذي يميزه عن غيره.", "ru": "Ищите отличие от остальных вариантов.", "en": "Look for the detail that separates it from the others."},{"he": "מילת השוואה גלויה היא הסימן העיקרי כאן.", "ar": "كلمة المقارنة الصريحة هي العلامة الأساسية.", "ru": "Явное слово сравнения служит признаком.", "en": "An explicit comparison word is the key clue."},null,[null,{"he": "זה מתאר את מטאפורה, לא את דימוי.", "ar": "هذا يصف الاستعارة، لا التشبيه.", "ru": "Это описание «Метафора», а не «Сравнение».", "en": "That describes metaphor, not simile."},{"he": "זה מתאר את פסיחה, לא את דימוי.", "ar": "هذا يصف التدوير بين السطور، لا التشبيه.", "ru": "Это описание «Анжамбеман», а не «Сравнение».", "en": "That describes enjambment, not simile."},{"he": "זה מתאר את חזרה, לא את דימוי.", "ar": "هذا يصف التكرار، لا التشبيه.", "ru": "Это описание «Повтор», а не «Сравнение».", "en": "That describes repetition, not simile."}]),
  Q("lit-poetry-8281-2",{"he": "איזה תיאור מתאים למטאפורה?", "ar": "أي وصف يناسب الاستعارة؟", "ru": "Какое описание подходит к «Метафора»?", "en": "Which description fits metaphor?"},[{"he": "השוואה מפורשת בין שני דברים בעזרת מילה כגון \"כמו\".", "ar": "مقارنة صريحة بين شيئين بكلمة مثل «مثل».", "ru": "Явное сопоставление двух вещей со словом «как».", "en": "An explicit comparison using a word such as \"like\"."},{"he": "הצגת דבר אחד כאילו היה דבר אחר, בלי מילת השוואה מפורשת.", "ar": "تصوير شيء كأنه شيء آخر دون أداة تشبيه صريحة.", "ru": "Представление одного как другого без явного слова сравнения.", "en": "Presenting one thing as another without an explicit comparison word."},{"he": "המשך המשפט מעבר לסוף השורה השירית בלי עצירה תחבירית.", "ar": "استمرار الجملة بعد نهاية السطر الشعري دون وقفة نحوية.", "ru": "Продолжение предложения за конец строки без синтаксической паузы.", "en": "A sentence continuing past a poetic line break without a syntactic stop."},{"he": "שימוש חוזר במילה או במבנה כדי להבליט קשר או הבדל.", "ar": "عودة كلمة أو تركيب لإبراز صلة أو فرق.", "ru": "Повтор слова или конструкции, подчёркивающий связь или различие.", "en": "Repeated use of a word or pattern to stress a link or contrast."}],1,{"he": "חפשו את הפרט שמבדיל אותו מן האחרים.", "ar": "ابحثوا عن التفصيل الذي يميزه عن غيره.", "ru": "Ищите отличие от остальных вариантов.", "en": "Look for the detail that separates it from the others."},{"he": "בניגוד לדימוי, אין כאן מילת השוואה מפורשת.", "ar": "على خلاف التشبيه، لا توجد أداة مقارنة صريحة.", "ru": "В отличие от сравнения здесь нет явного «как».", "en": "Unlike a simile, it does not use an explicit comparison word."},null,[{"he": "זה מתאר את דימוי, לא את מטאפורה.", "ar": "هذا يصف التشبيه، لا الاستعارة.", "ru": "Это описание «Сравнение», а не «Метафора».", "en": "That describes simile, not metaphor."},null,{"he": "זה מתאר את פסיחה, לא את מטאפורה.", "ar": "هذا يصف التدوير بين السطور، لا الاستعارة.", "ru": "Это описание «Анжамбеман», а не «Метафора».", "en": "That describes enjambment, not metaphor."},{"he": "זה מתאר את חזרה, לא את מטאפורה.", "ar": "هذا يصف التكرار، لا الاستعارة.", "ru": "Это описание «Повтор», а не «Метафора».", "en": "That describes repetition, not metaphor."}])
 ,Q("lit-poetry1-rhyme",{"he": "איזה תיאור מתאים לחריזה?", "ar": "أي وصف يناسب القافية؟", "ru": "Какое описание подходит к рифму?", "en": "Which description fits rhyme?"},[{"he": "דמיון בצליל בסוף שורות השיר, המחבר בין הבתים ויוצר מנגינה.", "ar": "تشابه في الصوت عند نهايات أبيات القصيدة، يربط بينها ويخلق نغمة.", "ru": "Созвучие в конце строк стихотворения, связывающее строфы и создающее мелодику.", "en": "A similarity of sound at line endings, linking the stanzas and creating a melody."},{"he": "שורה אחת בשיר, ויחידת הבנייה הבסיסית של השירה.", "ar": "سطر واحد في القصيدة، وهو وحدة البناء الأساسية في الشعر.", "ru": "Одна строка стихотворения, базовая единица построения поэзии.", "en": "A single line of a poem, the basic building unit of poetry."},{"he": "אמירה שמתכוונת להפך ממשמעותה המילולית, לרוב לשם ביקורת או הומור.", "ar": "قول يقصد عكس معناه الحرفي، غالبًا للنقد أو الفكاهة.", "ru": "Высказывание, означающее обратное буквальному смыслу, обычно ради критики или юмора.", "en": "A statement meaning the opposite of its literal sense, usually for criticism or humor."},{"he": "תיאור הפונה לחוש כמו ריח או מגע, ולא רק לראייה.", "ar": "وصف يخاطب حاسة كالشم أو اللمس، لا البصر فقط.", "ru": "Описание, обращённое к чувству, как запах или осязание, а не только к зрению.", "en": "A description addressing a sense like smell or touch, not only sight."}],0,{"he": "הקשיבו לסוף השורות.", "ar": "أصغوا إلى نهايات الأبيات.", "ru": "Вслушайтесь в концы строк.", "en": "Listen to the line endings."},{"he": "חריזה היא משחק הצלילים בקצה הבתים. למשל \"אור\" ו\"שור\" בסוף שתי שורות סמוכות.", "ar": "القافية لعبة الأصوات عند نهايات الأبيات. مثال: كلمتان متشابهتا الصوت في نهاية سطرين متجاورين.", "ru": "Рифма — игра звуков в конце строк. Например, созвучные слова в конце двух соседних строк.", "en": "Rhyme is the play of sounds at line endings. For example, similar-sounding words ending two neighboring lines."},null,[null,{"he": "זה מתאר את בית שיר, לא את חריזה.", "ar": "هذا يصف بيت الشعر، لا القافية.", "ru": "Это описание «стихотворную строку», а не «рифму».", "en": "That describes a verse line, not rhyme."},{"he": "זה מתאר את אירוניה, לא את חריזה.", "ar": "هذا يصف السخرية (الإيرونيا)، لا القافية.", "ru": "Это описание «иронию», а не «рифму».", "en": "That describes irony, not rhyme."},{"he": "זה מתאר את דימוי חושי, לא את חריזה.", "ar": "هذا يصف الصورة الحسّية، لا القافية.", "ru": "Это описание «чувственный образ», а не «рифму».", "en": "That describes a sensory image, not rhyme."}]),
  Q("po-1-01",{"he": "באיזו שורה יש השוואה בעזרת מילת השוואה?", "ar": "في أي سطر توجد مقارنة بأداة تشبيه؟", "ru": "В какой строке есть сравнение со сравнительным словом?", "en": "Which line has a comparison using a comparison word?"},[{"he": "העיניים שלה כמו שני אגמים", "ar": "عيناها مثل بحيرتين", "ru": "Её глаза как два озера", "en": "Her eyes are like two lakes"}, {"he": "העיניים שלה הן שני אגמים", "ar": "عيناها بحيرتان", "ru": "Её глаза — два озера", "en": "Her eyes are two lakes"}, {"he": "הרוח לוחשת בין העצים", "ar": "الريح تهمس بين الأشجار", "ru": "Ветер шепчет среди деревьев", "en": "The wind whispers among the trees"}, {"he": "הלילה ירד על העיר השקטה ועל הגגות האדומים", "ar": "نزل الليل على المدينة الهادئة وعلى السطوح الحمراء", "ru": "Ночь опустилась на тихий город и на красные крыши", "en": "Night fell on the quiet town and on the red roofs"}],0,{"he": "חפשו מילה קטנה שמחברת בין שני דברים.", "ar": "ابحثوا عن كلمة صغيرة تربط بين شيئين.", "ru": "Ищите маленькое слово, которое связывает две вещи.", "en": "Look for a small word that links two things."},{"he": "דימוי משווה בין שני דברים בעזרת מילה כמו \"כמו\" או \"כ־\". בשורה הנכונה העיניים מושוות לאגמים במפורש. בלי מילת ההשוואה זו כבר מטאפורה.", "ar": "التشبيه يقارن بين شيئين بأداة مثل «مثل» أو «كـ». في السطر الصحيح تُشبَّه العينان بالبحيرتين صراحة. وبلا الأداة يصبح استعارة.", "ru": "Сравнение сопоставляет две вещи с помощью слова «как» или «словно». В верной строке глаза прямо сравниваются с озёрами. Без такого слова это уже метафора.", "en": "A simile compares two things with a word such as \"like\" or \"as\". In the right line the eyes are openly compared to lakes. Without that word it becomes a metaphor."},null,[null, {"he": "אין כאן מילת השוואה; זו מטאפורה.", "ar": "لا أداة تشبيه هنا، فهذه استعارة.", "ru": "Здесь нет сравнительного слова; это метафора.", "en": "There is no comparison word here; it is a metaphor."}, {"he": "לרוח ניתנה פעולה של אדם; זו האנשה, לא השוואה.", "ar": "أُعطيت الريح فعلًا بشريًا، فهذا تشخيص لا تشبيه.", "ru": "Ветру дано человеческое действие; это олицетворение, не сравнение.", "en": "The wind is given a human action; this is personification, not a simile."}, {"he": "זה תיאור ישיר, בלי שום השוואה.", "ar": "هذا وصف مباشر بلا أي مقارنة.", "ru": "Это прямое описание без всякого сравнения.", "en": "This is a direct description with no comparison."}]),
  Q("po-1-02",{"he": "מהי האנשה?", "ar": "ما التشخيص؟", "ru": "Что такое олицетворение?", "en": "What is personification?"},[{"he": "חזרה על אותו צליל בתחילת כמה מילים סמוכות", "ar": "تكرار الصوت نفسه في بداية عدة كلمات متجاورة", "ru": "Повтор одного звука в начале нескольких соседних слов", "en": "Repeating the same sound at the start of nearby words"}, {"he": "מתן תכונות של אדם לחפץ, לחיה או לרעיון", "ar": "إعطاء صفات بشرية لشيء أو حيوان أو فكرة", "ru": "Наделение предмета, животного или идеи человеческими чертами", "en": "Giving human qualities to an object, an animal or an idea"}, {"he": "השוואה בין שני דברים בעזרת המילה \"כמו\" או המילית \"כ־\"", "ar": "مقارنة بين شيئين باستعمال كلمة «مثل» أو حرف «الكاف»", "ru": "Сравнение двух вещей с помощью слов «как», «будто» или «словно» в строке", "en": "A comparison of two things using the word \"like\" or the word \"as\" in a line"}, {"he": "תיאור של אדם אמיתי שהמשורר הכיר", "ar": "وصف شخص حقيقي عرفه الشاعر", "ru": "Описание реального человека, знакомого поэту", "en": "A description of a real person the poet knew"}],1,{"he": "חשבו על שורה שבה השמש מחייכת.", "ar": "فكّروا في سطر تبتسم فيه الشمس.", "ru": "Вспомните строку, в которой солнце улыбается.", "en": "Think of a line in which the sun smiles."},{"he": "בהאנשה, מה שאינו אדם מקבל פעולה או רגש של אדם. למשל \"הים כועס\" או \"העץ מחכה\". כך השיר מקרב את הטבע אל עולם הרגש.", "ar": "في التشخيص يأخذ ما ليس إنسانًا فعلًا أو شعورًا بشريًا. مثلًا «البحر غاضب» أو «الشجرة تنتظر». هكذا تقرّب القصيدة الطبيعة من عالم المشاعر.", "ru": "При олицетворении нечеловек получает действие или чувство человека. Например, «море злится» или «дерево ждёт». Так стихи приближают природу к миру чувств.", "en": "In personification, something non-human gets a human action or feeling. For example, \"the sea is angry\" or \"the tree waits\". This brings nature close to feelings."},null,[{"he": "זו אליטרציה, תחבולה של צליל.", "ar": "هذا جناس استهلالي، وهو وسيلة صوتية.", "ru": "Это аллитерация, звуковой приём.", "en": "That is alliteration, a sound device."}, null, {"he": "זה דימוי, שבו יש מילת השוואה.", "ar": "هذا تشبيه فيه أداة تشبيه.", "ru": "Это сравнение, в нём есть сравнительное слово.", "en": "That is a simile, which uses a comparison word."}, {"he": "האנשה נותנת תכונות אנושיות למה שאינו אדם.", "ar": "التشخيص يعطي صفات بشرية لما ليس إنسانًا.", "ru": "Олицетворение даёт человеческие черты нечеловеку.", "en": "Personification gives human traits to what is not human."}]),
  Q("po-1-03",{"he": "מי הוא \"הדובר\" בשיר?", "ar": "مَن «المتكلم» في القصيدة؟", "ru": "Кто такой «лирический герой» (говорящий) в стихотворении?", "en": "Who is the \"speaker\" in a poem?"},[{"he": "תמיד המשורר עצמו, שמספר על חייו", "ar": "دائمًا الشاعر نفسه، يروي عن حياته", "ru": "Всегда сам поэт, рассказывающий о своей жизни", "en": "Always the poet himself, telling about his life"}, {"he": "הקורא, שמדבר אל השיר", "ar": "القارئ الذي يخاطب القصيدة", "ru": "Читатель, который обращается к стихотворению", "en": "The reader, who speaks to the poem"}, {"he": "הקול שמדבר בשיר, ואינו בהכרח המשורר", "ar": "الصوت الذي يتكلم في القصيدة، وليس بالضرورة الشاعر", "ru": "Голос, звучащий в стихотворении, не обязательно сам поэт", "en": "The voice speaking in the poem, not necessarily the poet"}, {"he": "האדם שמקריא את השיר בקול רם מול כל התלמידים בכיתה", "ar": "الشخص الذي يقرأ القصيدة بصوت عالٍ أمام كل طلاب الصف في المدرسة", "ru": "Человек, который читает стихотворение вслух перед всеми учениками класса", "en": "The person who reads the poem aloud in front of all the students in class"}],2,{"he": "גם שחקן אומר \"אני\" על הבמה.", "ar": "الممثل أيضًا يقول «أنا» على المسرح.", "ru": "Актёр тоже говорит «я» на сцене.", "en": "An actor also says \"I\" on stage."},{"he": "הדובר הוא הקול שהשיר יוצר. המשורר יכול לכתוב מפי ילד, זקן או אפילו חפץ. לכן לא מזהים אוטומטית בין הדובר למשורר.", "ar": "المتكلم هو الصوت الذي تصنعه القصيدة. ويمكن للشاعر أن يكتب على لسان طفل أو شيخ أو حتى شيء. لذلك لا نساوي تلقائيًا بين المتكلم والشاعر.", "ru": "Говорящий — это голос, созданный стихотворением. Поэт может писать от лица ребёнка, старика или даже вещи. Поэтому говорящего не отождествляют с поэтом автоматически.", "en": "The speaker is the voice the poem creates. A poet can write as a child, an old man or even an object. So the speaker is not automatically the poet."},null,[{"he": "המשורר יכול ליצור קול שונה ממנו.", "ar": "يمكن للشاعر أن يصنع صوتًا مختلفًا عنه.", "ru": "Поэт может создать голос, не похожий на свой.", "en": "A poet can create a voice unlike his own."}, {"he": "הקורא שומע את השיר; הוא אינו הקול שבתוכו.", "ar": "القارئ يسمع القصيدة، وليس الصوت الذي فيها.", "ru": "Читатель слушает стихи; он не голос внутри них.", "en": "The reader hears the poem; he is not the voice inside it."}, null, {"he": "המקריא רק משמיע את המילים; הדובר נמצא בתוך הטקסט.", "ar": "القارئ بصوت عالٍ ينطق الكلمات فقط، والمتكلم داخل النص.", "ru": "Чтец лишь произносит слова; говорящий находится внутри текста.", "en": "The reader-aloud only voices the words; the speaker is inside the text."}]),
  Q("po-1-04",{"he": "מהו מקצב בשיר?", "ar": "ما الإيقاع في القصيدة؟", "ru": "Что такое ритм в стихотворении?", "en": "What is rhythm in a poem?"},[{"he": "התאמה בצליל בין סופי השורות", "ar": "توافق صوتي بين أواخر الأسطر", "ru": "Созвучие окончаний строк", "en": "A match in sound between line endings"}, {"he": "מספר הבתים בשיר", "ar": "عدد المقاطع في القصيدة", "ru": "Число строф в стихотворении", "en": "The number of stanzas in a poem"}, {"he": "המנגינה שמלחין כתב לשיר אחרי שהשיר התפרסם בעיתון", "ar": "اللحن الذي كتبه ملحّن للقصيدة بعد أن نُشرت في صحيفة", "ru": "Мелодия, которую композитор написал к стихам после их публикации в газете", "en": "The tune a composer wrote for the poem after it appeared in a newspaper"}, {"he": "תבנית של הטעמות והפסקות שחוזרת ויוצרת תנועה", "ar": "نمط من النبرات والوقفات يتكرر ويخلق حركة", "ru": "Повторяющийся узор ударений и пауз, создающий движение", "en": "A repeating pattern of stresses and pauses that creates movement"}],3,{"he": "הקישו על השולחן בזמן שאתם קוראים בקול.", "ar": "انقروا على الطاولة وأنتم تقرؤون بصوت عالٍ.", "ru": "Постукивайте по столу, читая вслух.", "en": "Tap on the table while you read aloud."},{"he": "מקצב נוצר מחזרה של הברות מוטעמות ושל הפסקות. הוא נשמע בקריאה בקול. מקצב מהיר יכול לבטא שמחה, ומקצב איטי יכול לבטא עצב.", "ar": "ينشأ الإيقاع من تكرار المقاطع المنبورة والوقفات. ويُسمع عند القراءة بصوت عالٍ. الإيقاع السريع قد يعبّر عن الفرح، والبطيء عن الحزن.", "ru": "Ритм рождается из повтора ударных слогов и пауз. Он слышен при чтении вслух. Быстрый ритм может выражать радость, медленный — грусть.", "en": "Rhythm comes from repeating stressed syllables and pauses. It is heard when reading aloud. A fast rhythm can express joy, and a slow one sadness."},null,[{"he": "זו חריזה, לא מקצב.", "ar": "هذه قافية لا إيقاع.", "ru": "Это рифма, а не ритм.", "en": "That is rhyme, not rhythm."}, {"he": "מספר הבתים הוא חלוקה, לא תבנית של הטעמות.", "ar": "عدد المقاطع تقسيم لا نمط نبرات.", "ru": "Число строф — это деление, а не узор ударений.", "en": "The stanza count is a division, not a stress pattern."}, {"he": "המקצב נמצא במילים עצמן, גם בלי שום מנגינה.", "ar": "الإيقاع موجود في الكلمات نفسها حتى بلا لحن.", "ru": "Ритм есть в самих словах, даже без мелодии.", "en": "Rhythm is in the words themselves, even without music."}, null]),
  Q("po-1-05",{"he": "מהי אליטרציה?", "ar": "ما الجناس الاستهلالي (تكرار الأصوات)؟", "ru": "Что такое аллитерация?", "en": "What is alliteration?"},[{"he": "חזרה על אותו צליל עיצורי בכמה מילים סמוכות", "ar": "تكرار الصوت الساكن نفسه في كلمات متجاورة", "ru": "Повтор одного согласного звука в соседних словах", "en": "Repeating the same consonant sound in nearby words"}, {"he": "חזרה על שורה שלמה בסוף כל בית", "ar": "تكرار سطر كامل في نهاية كل مقطع", "ru": "Повтор целой строки в конце каждой строфы", "en": "Repeating a whole line at the end of each stanza"}, {"he": "שורה שממשיכה לשורה הבאה בלי עצירה ובלי סימן פיסוק בסופה", "ar": "سطر يستمر إلى السطر التالي بلا توقف ولا علامة ترقيم في آخره", "ru": "Строка, которая переходит в следующую без остановки и без знака препинания в конце", "en": "A line that runs on into the next one without a pause or punctuation at its end"}, {"he": "מילה שיש לה שתי משמעויות", "ar": "كلمة لها معنيان", "ru": "Слово с двумя значениями", "en": "A word with two meanings"}],0,{"he": "הקשיבו לצלילים בתחילת המילים.", "ar": "استمعوا إلى الأصوات في بداية الكلمات.", "ru": "Прислушайтесь к звукам в начале слов.", "en": "Listen to the sounds at the start of the words."},{"he": "אליטרציה היא תחבולה של צליל. אותו עיצור חוזר בכמה מילים קרובות, למשל \"שקט שוכן בשדה\". החזרה מושכת את האוזן ויכולה לחקות רעש.", "ar": "الجناس الاستهلالي وسيلة صوتية. يتكرر الصوت الساكن نفسه في كلمات قريبة. والتكرار يجذب الأذن وقد يحاكي ضجيجًا.", "ru": "Аллитерация — звуковой приём. Один согласный повторяется в близких словах. Повтор привлекает слух и может подражать шуму.", "en": "Alliteration is a sound device. The same consonant repeats in nearby words. The repetition catches the ear and can imitate noise."},null,[null, {"he": "זו חזרה על שורה (פזמון חוזר), לא על צליל.", "ar": "هذا تكرار لسطر (لازمة) لا لصوت.", "ru": "Это повтор строки (рефрен), а не звука.", "en": "That is a repeated line (refrain), not a repeated sound."}, {"he": "זו פסיחה, הקשורה לחלוקת השורות.", "ar": "هذا تضمين (انسياب السطر)، يتعلق بتقسيم الأسطر.", "ru": "Это перенос (анжамбеман), он связан с делением строк.", "en": "That is enjambment, which concerns how lines break."}, {"he": "זו דו־משמעות, תחבולה של משמעות ולא של צליל.", "ar": "هذا تورية، وهي وسيلة معنى لا صوت.", "ru": "Это двусмысленность — приём смысла, а не звука.", "en": "That is a double meaning, a device of sense, not sound."}]),
  Q("po-1-06",{"he": "למה הכוונה ב\"סגירה\" של שיר?", "ar": "ما المقصود بـ«خاتمة» القصيدة (الإقفال)؟", "ru": "Что имеется в виду под «концовкой» стихотворения?", "en": "What is meant by a poem's \"closure\"?"},[{"he": "הכותרת שהמשורר נתן לשיר", "ar": "العنوان الذي أعطاه الشاعر للقصيدة", "ru": "Название, которое поэт дал стихотворению", "en": "The title the poet gave the poem"}, {"he": "האופן שבו השורות האחרונות מסכמות, מפתיעות או חוזרות לפתיחה", "ar": "الطريقة التي تُلخّص بها الأسطر الأخيرة أو تفاجئ أو تعود إلى البداية", "ru": "То, как последние строки подводят итог, удивляют или возвращают к началу", "en": "How the last lines sum up, surprise, or return to the opening"}, {"he": "הנקודה שבסוף השורה האחרונה", "ar": "النقطة في آخر السطر الأخير", "ru": "Точка в конце последней строки", "en": "The full stop at the end of the last line"}, {"he": "השורה הראשונה של השיר, שבה המשורר מציג לקורא את כל הנושאים שיופיעו בהמשך", "ar": "السطر الأول من القصيدة، حيث يعرض الشاعر للقارئ كل المواضيع التي ستأتي لاحقًا", "ru": "Первая строка стихотворения, где поэт заранее представляет читателю все будущие темы", "en": "The poem's first line, where the poet presents to the reader all the topics that will come later"}],1,{"he": "חשבו על הרגע שבו השיר נגמר.", "ar": "فكّروا في اللحظة التي تنتهي فيها القصيدة.", "ru": "Подумайте о моменте, когда стихотворение заканчивается.", "en": "Think of the moment the poem ends."},{"he": "הסגירה היא הסוף של השיר והאפקט שלו. היא יכולה לסכם רעיון, להפתיע, או לחזור לשורה הראשונה. לפעמים היא פתוחה ומשאירה שאלה.", "ar": "الخاتمة هي نهاية القصيدة وأثرها. قد تلخّص فكرة أو تفاجئ أو تعود إلى السطر الأول. وأحيانًا تكون مفتوحة وتترك سؤالًا.", "ru": "Концовка — это конец стихотворения и его эффект. Она может подвести итог, удивить или вернуть к первой строке. Иногда она открыта и оставляет вопрос.", "en": "Closure is the poem's ending and its effect. It can sum up an idea, surprise, or return to the first line. Sometimes it stays open and leaves a question."},null,[{"he": "הכותרת באה לפני השיר, לא בסופו.", "ar": "العنوان يأتي قبل القصيدة لا في آخرها.", "ru": "Название стоит перед стихотворением, а не в конце.", "en": "The title comes before the poem, not at its end."}, null, {"he": "סגירה היא אפקט של משמעות, לא סימן פיסוק.", "ar": "الخاتمة أثر في المعنى لا علامة ترقيم.", "ru": "Концовка — это эффект смысла, а не знак препинания.", "en": "Closure is an effect of meaning, not a punctuation mark."}, {"he": "השורה הראשונה היא הפתיחה, ההפך מסגירה.", "ar": "السطر الأول هو الافتتاح، عكس الخاتمة.", "ru": "Первая строка — это начало, противоположность концовки.", "en": "The first line is the opening, the opposite of closure."}])],
 [
  Q("lit-poetry-8281-3",{"he": "איזה תיאור מתאים לפסיחה?", "ar": "أي وصف يناسب التدوير بين السطور؟", "ru": "Какое описание подходит к «Анжамбеман»?", "en": "Which description fits enjambment?"},[{"he": "השוואה מפורשת בין שני דברים בעזרת מילה כגון \"כמו\".", "ar": "مقارنة صريحة بين شيئين بكلمة مثل «مثل».", "ru": "Явное сопоставление двух вещей со словом «как».", "en": "An explicit comparison using a word such as \"like\"."},{"he": "הצגת דבר אחד כאילו היה דבר אחר, בלי מילת השוואה מפורשת.", "ar": "تصوير شيء كأنه شيء آخر دون أداة تشبيه صريحة.", "ru": "Представление одного как другого без явного слова сравнения.", "en": "Presenting one thing as another without an explicit comparison word."},{"he": "המשך המשפט מעבר לסוף השורה השירית בלי עצירה תחבירית.", "ar": "استمرار الجملة بعد نهاية السطر الشعري دون وقفة نحوية.", "ru": "Продолжение предложения за конец строки без синтаксической паузы.", "en": "A sentence continuing past a poetic line break without a syntactic stop."},{"he": "שימוש חוזר במילה או במבנה כדי להבליט קשר או הבדל.", "ar": "عودة كلمة أو تركيب لإبراز صلة أو فرق.", "ru": "Повтор слова или конструкции, подчёркивающий связь или различие.", "en": "Repeated use of a word or pattern to stress a link or contrast."}],2,{"he": "חפשו את הפרט שמבדיל אותו מן האחרים.", "ar": "ابحثوا عن التفصيل الذي يميزه عن غيره.", "ru": "Ищите отличие от остальных вариантов.", "en": "Look for the detail that separates it from the others."},{"he": "גבול השורה וגבול המשפט אינם חופפים.", "ar": "نهاية السطر لا تطابق نهاية الجملة.", "ru": "Граница строки не совпадает с границей предложения.", "en": "The line break and sentence ending do not coincide."},null,[{"he": "זה מתאר את דימוי, לא את פסיחה.", "ar": "هذا يصف التشبيه، لا التدوير بين السطور.", "ru": "Это описание «Сравнение», а не «Анжамбеман».", "en": "That describes simile, not enjambment."},{"he": "זה מתאר את מטאפורה, לא את פסיחה.", "ar": "هذا يصف الاستعارة، لا التدوير بين السطور.", "ru": "Это описание «Метафора», а не «Анжамбеман».", "en": "That describes metaphor, not enjambment."},null,{"he": "זה מתאר את חזרה, לא את פסיחה.", "ar": "هذا يصف التكرار، لا التدوير بين السطور.", "ru": "Это описание «Повтор», а не «Анжамбеман».", "en": "That describes repetition, not enjambment."}])
 ,Q("lit-poetry1-line",{"he": "איזה תיאור מתאים לבית שיר?", "ar": "أي وصف يناسب بيت الشعر؟", "ru": "Какое описание подходит к стихотворную строку?", "en": "Which description fits a verse line?"},[{"he": "דמיון בצליל בסוף שורות השיר, המחבר בין הבתים ויוצר מנגינה.", "ar": "تشابه في الصوت عند نهايات أبيات القصيدة، يربط بينها ويخلق نغمة.", "ru": "Созвучие в конце строк стихотворения, связывающее строфы и создающее мелодику.", "en": "A similarity of sound at line endings, linking the stanzas and creating a melody."},{"he": "שורה אחת בשיר, ויחידת הבנייה הבסיסית של השירה.", "ar": "سطر واحد في القصيدة، وهو وحدة البناء الأساسية في الشعر.", "ru": "Одна строка стихотворения, базовая единица построения поэзии.", "en": "A single line of a poem, the basic building unit of poetry."},{"he": "אמירה שמתכוונת להפך ממשמעותה המילולית, לרוב לשם ביקורת או הומור.", "ar": "قول يقصد عكس معناه الحرفي، غالبًا للنقد أو الفكاهة.", "ru": "Высказывание, означающее обратное буквальному смыслу, обычно ради критики или юмора.", "en": "A statement meaning the opposite of its literal sense, usually for criticism or humor."},{"he": "תיאור הפונה לחוש כמו ריח או מגע, ולא רק לראייה.", "ar": "وصف يخاطب حاسة كالشم أو اللمس، لا البصر فقط.", "ru": "Описание, обращённое к чувству, как запах или осязание, а не только к зрению.", "en": "A description addressing a sense like smell or touch, not only sight."}],1,{"he": "מהו הלבן הקטן ביותר שממנו בנוי שיר?", "ar": "ما أصغر لبنة يُبنى منها الشعر؟", "ru": "Что является мельчайшим кирпичиком стихотворения?", "en": "What is the smallest brick a poem is built from?"},{"he": "בית שיר הוא שורה אחת. למשל שיר של שמונה שורות בנוי משמונה בתים.", "ar": "بيت الشعر سطر واحد. مثال: قصيدة من ثمانية أسطر مبنية من ثمانية أبيات.", "ru": "Строка — одна строчка. Например, стихотворение из восьми строк состоит из восьми строк.", "en": "A verse line is a single line. For example, an eight-line poem is built of eight verse lines."},null,[{"he": "זה מתאר את חריזה, לא את בית שיר.", "ar": "هذا يصف القافية، لا بيت الشعر.", "ru": "Это описание «рифму», а не «стихотворную строку».", "en": "That describes rhyme, not a verse line."},null,{"he": "זה מתאר את אירוניה, לא את בית שיר.", "ar": "هذا يصف السخرية (الإيرونيا)، لا بيت الشعر.", "ru": "Это описание «иронию», а не «стихотворную строку».", "en": "That describes irony, not a verse line."},{"he": "זה מתאר את דימוי חושי, לא את בית שיר.", "ar": "هذا يصف الصورة الحسّية، لا بيت الشعر.", "ru": "Это описание «чувственный образ», а не «стихотворную строку».", "en": "That describes a sensory image, not a verse line."}]),Q("lit-poetry1-irony-use",{"he": "בשיר מקורי כתוב: \"כמה נחמד לצחוק / כשהלב בוכה\". איזו תופעה מופיעה כאן?", "ar": "في قصيدة أصلية مكتوب: «ما أجمل أن نضحك / والقلب يبكي». أي ظاهرة تظهر هنا؟", "ru": "В новом стихотворении написано: «Как мило смеяться, / когда сердце плачет». Какое явление здесь представлено?", "en": "In an original poem it says: \"How nice to laugh / while the heart weeps.\" Which phenomenon appears here?"},[{"he": "אירוניה: הדברים אומרים להפך מהתחושה", "ar": "سخرية: الكلام يقول عكس الشعور", "ru": "Ирония: слова говорят обратное чувству", "en": "Irony: the words say the opposite of the feeling"},{"he": "חריזה מלאה בין שתי השורות", "ar": "قافية تامة بين السطرين", "ru": "Полная рифма между двумя строками", "en": "A full rhyme between the two lines"},{"he": "כינוי גנאי כלפי הקורא", "ar": "لقب مهين للقارئ", "ru": "Оскорбительное прозвище читателя", "en": "An insulting nickname for the reader"},{"he": "תיאור של מזג אוויר סוער", "ar": "وصف طقس عاصف", "ru": "Описание бурной погоды", "en": "A description of stormy weather"}],0,{"he": "האם המילים מתארות את האמת או את היפוכה?", "ar": "هل تصف الكلمات الحقيقة أم عكسها؟", "ru": "Описывают ли слова правду или её противоположность?", "en": "Do the words describe the truth or its opposite?"},{"he": "אירוניה אומרת דבר ומתכוונת לשני. למשל כאן \"נחמד לצחוק\" מתיישב עם לב בוכה, והניגוד חושף את הביקורת.", "ar": "السخرية تقول شيئًا وتقصد نقيضه. مثال: «ما أجمل الضحك» مع قلب يبكي، والتناقض يكشف النقد.", "ru": "Ирония говорит одно, а значит другое. Например, здесь «мило смеяться» рядом с плачущим сердцем, и контраст раскрывает критику.", "en": "Irony says one thing and means the other. For example, \"nice to laugh\" beside a weeping heart, and the contrast exposes the critique."},null,[null,{"he": "\"לצחוק\" ו\"בוכה\" אינן חורזות; העניין הוא הניגוד, לא הצליל.", "ar": "«نضحك» و«يبكي» لا تتقافيان، فالقضية تناقض لا صوت.", "ru": "«Смеяться» и «плачет» не рифмуются; суть в контрасте, не в звуке.", "en": "\"Laugh\" and \"weeps\" do not rhyme; the point is contrast, not sound."},{"he": "אין כאן פגיעה בקורא אלא הצגת פנימיות של דובר.", "ar": "لا إساءة للقارئ هنا بل عرض لعالم المتحدث الداخلي.", "ru": "Здесь нет обиды читателю, а показан внутренний мир говорящего.", "en": "There is no insult to the reader here, but a view into the speaker."},{"he": "השורות עוסקות ברגש, לא בטבע.", "ar": "السطران عن الشعور لا عن الطبيعة.", "ru": "Строки о чувстве, а не о природе.", "en": "The lines are about feeling, not nature."}]),
  Q("po-2-01",{"he": "בשיר מקורי כתוב: \"השמש פוקחת עין / ומעירה את הרחוב\". איזו תופעה יש כאן?", "ar": "في قصيدة أصلية مكتوب: «الشمس تفتح عينها / وتوقظ الشارع». أي ظاهرة هنا؟", "ru": "В новом стихотворении написано: «Солнце открывает глаз / и будит улицу». Какое здесь явление?", "en": "An original poem says: \"The sun opens an eye / and wakes the street.\" Which device is this?"},[{"he": "דימוי, כי יש בשורות מילת השוואה", "ar": "تشبيه لأن في السطرين أداة تشبيه", "ru": "Сравнение, потому что в строках есть сравнительное слово", "en": "A simile, because the lines have a comparison word"}, {"he": "חריזה מלאה בין שתי השורות", "ar": "قافية تامة بين السطرين", "ru": "Полная рифма между двумя строками", "en": "A full rhyme between the two lines"}, {"he": "האנשה: לשמש יש פעולות של אדם", "ar": "تشخيص: للشمس أفعال إنسان", "ru": "Олицетворение: у солнца действия человека", "en": "Personification: the sun has human actions"}, {"he": "אליטרציה: אותו צליל חוזר בתחילת כל אחת מהמילים בשתי השורות", "ar": "جناس استهلالي: الصوت نفسه يتكرر في بداية كل كلمة في السطرين", "ru": "Аллитерация: один и тот же звук повторяется в начале каждого слова обеих строк", "en": "Alliteration: the same sound repeats at the start of every word in both lines"}],2,{"he": "מי בדרך כלל פוקח עין ומעיר מישהו?", "ar": "مَن عادةً يفتح عينه ويوقظ أحدًا؟", "ru": "Кто обычно открывает глаза и будит кого-то?", "en": "Who usually opens an eye and wakes someone?"},{"he": "פקיחת עין והערה הן פעולות של אדם. כאן הן ניתנות לשמש. זו האנשה, והיא הופכת את הבוקר לחי ופעיל.", "ar": "فتح العين والإيقاظ فعلان بشريان. وهنا أُعطيا للشمس. هذا تشخيص، وهو يجعل الصباح حيًّا ونشيطًا.", "ru": "Открыть глаз и разбудить — действия человека. Здесь они даны солнцу. Это олицетворение, и оно делает утро живым и деятельным.", "en": "Opening an eye and waking someone are human actions. Here they are given to the sun. This is personification, and it makes the morning alive and active."},null,[{"he": "אין כאן \"כמו\" או \"כ־\", ולכן אין דימוי.", "ar": "لا «مثل» ولا «كـ» هنا، فلا تشبيه.", "ru": "Здесь нет слов «как» или «словно», значит, сравнения нет.", "en": "There is no \"like\" or \"as\" here, so it is not a simile."}, {"he": "סופי השורות אינם חורזים זה עם זה.", "ar": "أواخر السطرين لا تتقافى.", "ru": "Концы строк не рифмуются друг с другом.", "en": "The line endings do not rhyme with each other."}, null, {"he": "המילים מתחילות בצלילים שונים.", "ar": "الكلمات تبدأ بأصوات مختلفة.", "ru": "Слова начинаются с разных звуков.", "en": "The words begin with different sounds."}]),
  Q("po-2-02",{"he": "בשיר מקורי כתוב: \"הזמן הוא נהר\". מה סוג הצירוף?", "ar": "في قصيدة أصلية مكتوب: «الزمن نهر». ما نوع هذا التركيب؟", "ru": "В новом стихотворении написано: «Время — река». Что это за приём?", "en": "An original poem says: \"Time is a river.\" What kind of device is this?"},[{"he": "דימוי, כי יש בו מילת השוואה", "ar": "تشبيه لأن فيه أداة تشبيه", "ru": "Сравнение, потому что есть сравнительное слово", "en": "A simile, because it has a comparison word"}, {"he": "האנשה, כי הנהר מדבר אל הקורא בגוף ראשון ומספר לו על הזמן", "ar": "تشخيص لأن النهر يخاطب القارئ بضمير المتكلم ويحدّثه عن الزمن", "ru": "Олицетворение, потому что река говорит с читателем от первого лица о времени", "en": "Personification, because the river talks to the reader in the first person about time"}, {"he": "חריזה פנימית בתוך השורה", "ar": "قافية داخلية في السطر", "ru": "Внутренняя рифма в строке", "en": "An internal rhyme within the line"}, {"he": "מטאפורה: הזמן מוצג כנהר בלי מילת השוואה", "ar": "استعارة: الزمن يُعرض نهرًا بلا أداة تشبيه", "ru": "Метафора: время показано рекой без сравнительного слова", "en": "A metaphor: time is shown as a river with no comparison word"}],3,{"he": "בדקו אם יש מילה שמחברת בין שני הדברים.", "ar": "تحققوا إن كانت هناك كلمة تربط بين الشيئين.", "ru": "Проверьте, есть ли слово, соединяющее две вещи.", "en": "Check whether a word links the two things."},{"he": "השורה אומרת שהזמן הוא נהר, ולא שהוא דומה לנהר. זו מטאפורה. היא מעבירה תכונות של נהר אל הזמן: זרימה בלי עצירה ובלי חזרה.", "ar": "السطر يقول إن الزمن نهر لا إنه يشبه النهر. هذه استعارة. وهي تنقل صفات النهر إلى الزمن: جريان بلا توقف ولا رجوع.", "ru": "Строка говорит, что время — река, а не что оно похоже на реку. Это метафора. Она переносит свойства реки на время: течение без остановки и без возврата.", "en": "The line says time is a river, not that it is like a river. This is a metaphor. It gives time the qualities of a river: flowing without stopping or returning."},null,[{"he": "אין בשורה \"כמו\" או \"כ־\".", "ar": "لا يوجد في السطر «مثل» أو «كـ».", "ru": "В строке нет слов «как» или «словно».", "en": "The line has no \"like\" or \"as\"."}, {"he": "הנהר אינו מדבר ואינו פועל כמו אדם.", "ar": "النهر لا يتكلم ولا يتصرف كإنسان.", "ru": "Река не говорит и не действует как человек.", "en": "The river neither speaks nor acts like a person."}, {"he": "אין בשורה מילים שחורזות זו עם זו.", "ar": "لا كلمات متقافية في السطر.", "ru": "В строке нет рифмующихся слов.", "en": "No words in the line rhyme with each other."}, null]),
  Q("po-2-03",{"he": "שיר כתוב בגוף ראשון מפי ילד בן 8. המשוררת הייתה בת 60 כשכתבה אותו. מה נכון?", "ar": "قصيدة مكتوبة بضمير المتكلم على لسان طفل عمره 8 سنوات. كانت الشاعرة في الستين حين كتبتها. ما الصحيح؟", "ru": "Стихотворение написано от первого лица 8-летнего ребёнка. Поэтессе было 60 лет, когда она его писала. Что верно?", "en": "A poem is written in the first person as an 8-year-old child. The poet was 60 when she wrote it. What is true?"},[{"he": "הדובר הוא הילד; המשוררת יצרה קול שונה ממנה", "ar": "المتكلم هو الطفل، والشاعرة صنعت صوتًا مختلفًا عنها", "ru": "Говорящий — ребёнок; поэтесса создала голос, не похожий на свой", "en": "The speaker is the child; the poet created a voice unlike her own"}, {"he": "הדובר הוא המשוררת, כי היא זו שכתבה את כל המילים בשיר", "ar": "المتكلم هو الشاعرة لأنها هي التي كتبت كل كلمات القصيدة", "ru": "Говорящий — поэтесса, ведь это она написала все слова стихотворения", "en": "The speaker is the poet, because she is the one who wrote all the words"}, {"he": "השיר שגוי, כי מבוגר אינו יכול לכתוב בקול של ילד", "ar": "القصيدة خاطئة لأن الراشد لا يستطيع الكتابة بصوت طفل", "ru": "Стихотворение ошибочно: взрослый не может писать голосом ребёнка", "en": "The poem is flawed, since an adult cannot write in a child's voice"}, {"he": "אין דובר בשיר הכתוב בגוף ראשון", "ar": "لا متكلم في قصيدة مكتوبة بضمير المتكلم", "ru": "В стихах от первого лица нет говорящего", "en": "A first-person poem has no speaker"}],0,{"he": "מי אומר \"אני\" בתוך השיר?", "ar": "مَن يقول «أنا» داخل القصيدة؟", "ru": "Кто говорит «я» внутри стихотворения?", "en": "Who says \"I\" inside the poem?"},{"he": "הדובר הוא הקול שבתוך השיר, כאן ילד. המשוררת בחרה לדבר דרכו. ההבחנה הזאת עוזרת לקרוא את השיר בלי לנחש על חיי המשוררת.", "ar": "المتكلم هو الصوت داخل القصيدة، وهنا هو طفل. اختارت الشاعرة أن تتكلم من خلاله. وهذا التمييز يساعد على قراءة القصيدة دون تخمين حياة الشاعرة.", "ru": "Говорящий — голос внутри стихотворения, здесь ребёнок. Поэтесса выбрала говорить через него. Это различие помогает читать стихи, не гадая о жизни автора.", "en": "The speaker is the voice inside the poem, here a child. The poet chose to speak through him. This distinction helps read the poem without guessing about the poet's life."},null,[null, {"he": "כתיבת המילים אינה הופכת את המשוררת לדובר.", "ar": "كتابة الكلمات لا تجعل الشاعرة هي المتكلم.", "ru": "То, что она написала слова, не делает её говорящим.", "en": "Writing the words does not make the poet the speaker."}, {"he": "משוררים כותבים בקולות רבים; זו בחירה אמנותית.", "ar": "الشعراء يكتبون بأصوات كثيرة، وهذا اختيار فني.", "ru": "Поэты пишут многими голосами; это художественный выбор.", "en": "Poets write in many voices; it is an artistic choice."}, {"he": "גוף ראשון הוא דווקא סימן ברור לדובר.", "ar": "ضمير المتكلم علامة واضحة على وجود المتكلم.", "ru": "Первое лицо как раз явный признак говорящего.", "en": "The first person is a clear sign of a speaker."}]),
  Q("po-2-04",{"he": "בבית של 4 שורות, שורה 1 חורזת עם שורה 3, ושורה 2 חורזת עם שורה 4. מהי תבנית החריזה?", "ar": "في مقطع من 4 أسطر يتقافى السطر 1 مع السطر 3، والسطر 2 مع السطر 4. ما نمط القافية؟", "ru": "В строфе из 4 строк строка 1 рифмуется со строкой 3, а строка 2 — со строкой 4. Какова схема рифмовки?", "en": "In a 4-line stanza, line 1 rhymes with line 3, and line 2 rhymes with line 4. What is the rhyme scheme?"},[{"he": "א־א־ב־ב", "ar": "أ-أ-ب-ب", "ru": "А-А-Б-Б", "en": "A-A-B-B"}, {"he": "א־ב־א־ב", "ar": "أ-ب-أ-ب", "ru": "А-Б-А-Б", "en": "A-B-A-B"}, {"he": "א־ב־ב־א", "ar": "أ-ب-ب-أ", "ru": "А-Б-Б-А", "en": "A-B-B-A"}, {"he": "א־א־א־א: כל השורות חורזות", "ar": "أ-أ-أ-أ: كل الأسطر متقافية", "ru": "А-А-А-А: рифмуются все строки", "en": "A-A-A-A: all lines rhyme"}],1,{"he": "תנו אות לכל צליל סיום, לפי הסדר.", "ar": "أعطوا حرفًا لكل صوت نهاية بالترتيب.", "ru": "Обозначьте каждый звук окончания буквой по порядку.", "en": "Give a letter to each ending sound, in order."},{"he": "מסמנים כל צליל סיום חדש באות חדשה. שורות 1 ו־3 מקבלות את אותה אות, וגם שורות 2 ו־4. זו חריזה מתחלפת.", "ar": "نرمز لكل صوت نهاية جديد بحرف جديد. السطران 1 و3 يأخذان الحرف نفسه، وكذلك 2 و4. هذه قافية متناوبة.", "ru": "Каждый новый звук окончания обозначают новой буквой. Строки 1 и 3 получают одну букву, строки 2 и 4 — другую. Это перекрёстная рифма.", "en": "Each new ending sound gets a new letter. Lines 1 and 3 share a letter, and so do lines 2 and 4. This is alternating rhyme."},null,[{"he": "בתבנית הזאת שורה 1 חורזת עם 2, ולא עם 3.", "ar": "في هذا النمط يتقافى السطر 1 مع 2 لا مع 3.", "ru": "В этой схеме строка 1 рифмуется со 2-й, а не с 3-й.", "en": "In this scheme line 1 rhymes with line 2, not line 3."}, null, {"he": "כאן שורה 1 חורזת עם 4, וזו חריזה חובקת.", "ar": "هنا يتقافى السطر 1 مع 4، وهذه قافية محتضنة.", "ru": "Здесь строка 1 рифмуется с 4-й; это опоясывающая рифма.", "en": "Here line 1 rhymes with line 4; that is enclosed rhyme."}, {"he": "יש שני צלילי סיום שונים, לא צליל אחד.", "ar": "هناك صوتا نهاية مختلفان لا صوت واحد.", "ru": "Здесь два разных звука окончания, а не один.", "en": "There are two different ending sounds, not one."}]),
  Q("po-2-05",{"he": "בשיר מקורי כתוב: \"רעם רועם, רוח רועדת\". מה התפקיד של הצליל ר החוזר?", "ar": "في قصيدة أصلية مكتوب: «رعدٌ يرعد، ريحٌ ترتجف». ما وظيفة صوت الراء المتكرر؟", "ru": "В новом стихотворении написано: «Гром грохочет, ветер дрожит». Какова роль повторяющегося звука «р»?", "en": "An original poem says: \"Rough thunder roars, the wind rattles.\" What is the role of the repeated r sound?"},[{"he": "לבנות חריזה מלאה בסופי השורות", "ar": "بناء قافية تامة في أواخر الأسطر", "ru": "Создать полную рифму в концах строк", "en": "To build a full rhyme at the line endings"}, {"he": "להראות שהדובר הוא ילד שמתקשה לבטא את הצליל ר כשהוא מדבר", "ar": "إظهار أن المتكلم طفل يصعب عليه نطق حرف الراء حين يتكلم", "ru": "Показать, что говорящий — ребёнок, которому трудно произносить звук «р»", "en": "To show the speaker is a child who finds it hard to say the r sound"}, {"he": "להשמיע את הסערה: הצליל מחקה רעש מתגלגל", "ar": "إسماع العاصفة: الصوت يحاكي ضجيجًا متدحرجًا", "ru": "Дать услышать бурю: звук подражает раскатистому шуму", "en": "To make the storm heard: the sound imitates a rolling noise"}, {"he": "להפוך את השורה למטאפורה", "ar": "تحويل السطر إلى استعارة", "ru": "Превратить строку в метафору", "en": "To turn the line into a metaphor"}],2,{"he": "קראו את השורה בקול והקשיבו.", "ar": "اقرؤوا السطر بصوت عالٍ واستمعوا.", "ru": "Прочитайте строку вслух и прислушайтесь.", "en": "Read the line aloud and listen."},{"he": "חזרה על אותו עיצור היא אליטרציה. הצליל ר נשמע מתגלגל ורועש. כך הצליל עצמו מחזק את תמונת הסערה.", "ar": "تكرار الصوت الساكن نفسه جناس استهلالي. وصوت الراء يُسمع متدحرجًا وصاخبًا. فيقوّي الصوت نفسه صورة العاصفة.", "ru": "Повтор одного согласного — аллитерация. Звук «р» звучит раскатисто и шумно. Так сам звук усиливает картину бури.", "en": "Repeating the same consonant is alliteration. The r sound rolls and sounds noisy. So the sound itself strengthens the image of the storm."},null,[{"he": "החזרה היא בתחילת המילים ובתוכן, לא בסוף השורות.", "ar": "التكرار في بداية الكلمات وداخلها لا في أواخر الأسطر.", "ru": "Повтор стоит в начале и внутри слов, а не в концах строк.", "en": "The repetition is at the start of words, not at line endings."}, {"he": "אין בשיר רמז לגיל הדובר; הצליל קשור לסערה.", "ar": "لا إشارة في القصيدة إلى عمر المتكلم، فالصوت مرتبط بالعاصفة.", "ru": "В стихах нет намёка на возраст говорящего; звук связан с бурей.", "en": "Nothing hints at the speaker's age; the sound fits the storm."}, null, {"he": "מטאפורה היא תחבולה של משמעות; כאן התחבולה היא צליל.", "ar": "الاستعارة وسيلة معنى، وهنا الوسيلة صوتية.", "ru": "Метафора — приём смысла, а здесь приём звуковой.", "en": "A metaphor is a device of meaning; here the device is sound."}]),
  Q("po-2-06",{"he": "בשיר מקורי כתוב: \"בחוץ חג ואורות / ובחדרי חושך ושקט\". מה יוצר את המשמעות?", "ar": "في قصيدة أصلية مكتوب: «في الخارج عيد وأضواء / وفي غرفتي ظلام وصمت». ما الذي يصنع المعنى؟", "ru": "В новом стихотворении написано: «Снаружи праздник и огни, / а в моей комнате тьма и тишина». Что создаёт смысл?", "en": "An original poem says: \"Outside, a holiday and lights / and in my room, darkness and silence.\" What creates the meaning?"},[{"he": "חריזה מלאה בין \"אורות\" לבין \"שקט\"", "ar": "قافية تامة بين «أضواء» و«صمت»", "ru": "Полная рифма между «огни» и «тишина»", "en": "A full rhyme between \"lights\" and \"silence\""}, {"he": "האנשה של החג, שמזמין את הדובר לצאת החוצה ולהצטרף לשמחה", "ar": "تشخيص العيد الذي يدعو المتكلم للخروج والانضمام إلى الفرح", "ru": "Олицетворение праздника, который зовёт говорящего выйти и присоединиться к веселью", "en": "Personification of the holiday, which invites the speaker to come out and join the joy"}, {"he": "דימוי של החדר לחג", "ar": "تشبيه الغرفة بالعيد", "ru": "Сравнение комнаты с праздником", "en": "A simile comparing the room to the holiday"}, {"he": "ניגוד בין חוץ שמח לפנים חשוך, שמבליט בדידות", "ar": "تضاد بين خارج فرِح وداخل مظلم يُبرز الوحدة", "ru": "Контраст между радостным «снаружи» и тёмным «внутри» подчёркивает одиночество", "en": "A contrast between a joyful outside and a dark inside, stressing loneliness"}],3,{"he": "השוו בין שתי השורות, מילה מול מילה.", "ar": "قارنوا بين السطرين، كلمة مقابل كلمة.", "ru": "Сравните две строки, слово против слова.", "en": "Compare the two lines, word against word."},{"he": "כל שורה עומדת מול חברתה: בחוץ מול בחדרי, אורות מול חושך, חג מול שקט. הניגוד מראה שהדובר מרגיש מחוץ לשמחה.", "ar": "كل سطر يقابل الآخر: الخارج مقابل غرفتي، أضواء مقابل ظلام، عيد مقابل صمت. والتضاد يُظهر أن المتكلم يشعر بأنه خارج الفرح.", "ru": "Строки противостоят друг другу: снаружи против комнаты, огни против тьмы, праздник против тишины. Контраст показывает, что говорящий чувствует себя вне радости.", "en": "The two lines face each other: outside against my room, lights against darkness, holiday against silence. The contrast shows the speaker feels shut out of the joy."},null,[{"he": "המילים האלה אינן חורזות; העיקר הוא ההיפוך במשמעות.", "ar": "هاتان الكلمتان لا تتقافيان، والأساس هو التضاد في المعنى.", "ru": "Эти слова не рифмуются; главное — противоположность смысла.", "en": "These words do not rhyme; the key is the opposite meaning."}, {"he": "החג אינו פועל או מדבר בשורות.", "ar": "العيد لا يفعل ولا يتكلم في السطرين.", "ru": "Праздник в строках не действует и не говорит.", "en": "The holiday neither acts nor speaks in the lines."}, {"he": "החדר אינו מושווה לחג אלא מוצג כהיפוכו.", "ar": "الغرفة لا تُشبَّه بالعيد بل تُعرض كنقيضه.", "ru": "Комнату не сравнивают с праздником, а противопоставляют ему.", "en": "The room is not compared to the holiday but set against it."}, null])],
 [
  Q("lit-poetry-8281-4",{"he": "איזה תיאור מתאים לחזרה?", "ar": "أي وصف يناسب التكرار؟", "ru": "Какое описание подходит к «Повтор»?", "en": "Which description fits repetition?"},[{"he": "השוואה מפורשת בין שני דברים בעזרת מילה כגון \"כמו\".", "ar": "مقارنة صريحة بين شيئين بكلمة مثل «مثل».", "ru": "Явное сопоставление двух вещей со словом «как».", "en": "An explicit comparison using a word such as \"like\"."},{"he": "הצגת דבר אחד כאילו היה דבר אחר, בלי מילת השוואה מפורשת.", "ar": "تصوير شيء كأنه شيء آخر دون أداة تشبيه صريحة.", "ru": "Представление одного как другого без явного слова сравнения.", "en": "Presenting one thing as another without an explicit comparison word."},{"he": "המשך המשפט מעבר לסוף השורה השירית בלי עצירה תחבירית.", "ar": "استمرار الجملة بعد نهاية السطر الشعري دون وقفة نحوية.", "ru": "Продолжение предложения за конец строки без синтаксической паузы.", "en": "A sentence continuing past a poetic line break without a syntactic stop."},{"he": "שימוש חוזר במילה או במבנה כדי להבליט קשר או הבדל.", "ar": "عودة كلمة أو تركيب لإبراز صلة أو فرق.", "ru": "Повтор слова или конструкции, подчёркивающий связь или различие.", "en": "Repeated use of a word or pattern to stress a link or contrast."}],3,{"he": "חפשו את הפרט שמבדיל אותו מן האחרים.", "ar": "ابحثوا عن التفصيل الذي يميزه عن غيره.", "ru": "Ищите отличие от остальных вариантов.", "en": "Look for the detail that separates it from the others."},{"he": "בדקו מה משתנה ומה נשאר קבוע בכל הופעה.", "ar": "انظروا ماذا يتغير وما يبقى ثابتًا في كل ظهور.", "ru": "Сравните, что меняется и что остаётся прежним.", "en": "Compare what changes and what remains constant on each return."},null,[{"he": "זה מתאר את דימוי, לא את חזרה.", "ar": "هذا يصف التشبيه، لا التكرار.", "ru": "Это описание «Сравнение», а не «Повтор».", "en": "That describes simile, not repetition."},{"he": "זה מתאר את מטאפורה, לא את חזרה.", "ar": "هذا يصف الاستعارة، لا التكرار.", "ru": "Это описание «Метафора», а не «Повтор».", "en": "That describes metaphor, not repetition."},{"he": "זה מתאר את פסיחה, לא את חזרה.", "ar": "هذا يصف التدوير بين السطور، لا التكرار.", "ru": "Это описание «Анжамбеман», а не «Повтор».", "en": "That describes enjambment, not repetition."},null])
 ,Q("lit-poetry1-sense",{"he": "איזה תיאור מתאים לדימוי חושי?", "ar": "أي وصف يناسب الصورة الحسّية؟", "ru": "Какое описание соответствует чувственному образу?", "en": "Which description fits a sensory image?"},[{"he": "דמיון בצליל בסוף שורות השיר, המחבר בין הבתים ויוצר מנגינה.", "ar": "تشابه في الصوت عند نهايات أبيات القصيدة، يربط بينها ويخلق نغمة.", "ru": "Созвучие в конце строк стихотворения, связывающее строфы и создающее мелодику.", "en": "A similarity of sound at line endings, linking the stanzas and creating a melody."},{"he": "שורה אחת בשיר, ויחידת הבנייה הבסיסית של השירה.", "ar": "سطر واحد في القصيدة، وهو وحدة البناء الأساسية في الشعر.", "ru": "Одна строка стихотворения, базовая единица построения поэзии.", "en": "A single line of a poem, the basic building unit of poetry."},{"he": "אמירה שמתכוונת להפך ממשמעותה המילולית, לרוב לשם ביקורת או הומור.", "ar": "قول يقصد عكس معناه الحرفي، غالبًا للنقد أو الفكاهة.", "ru": "Высказывание, означающее обратное буквальному смыслу, обычно ради критики или юмора.", "en": "A statement meaning the opposite of its literal sense, usually for criticism or humor."},{"he": "תיאור הפונה לחוש כמו ריח או מגע, ולא רק לראייה.", "ar": "وصف يخاطب حاسة كالشم أو اللمس، لا البصر فقط.", "ru": "Описание, обращённое к чувству, как запах или осязание, а не только к зрению.", "en": "A description addressing a sense like smell or touch, not only sight."}],3,{"he": "לאיזה חוש פונה התיאור?", "ar": "إلى أي حاسة يتوجه الوصف؟", "ru": "К какому чувству обращено описание?", "en": "Which sense does the description address?"},{"he": "דימוי חושי עובד דרך החושים. למשל \"הקור נעץ בעור כמו מחטים\" פונה למגע.", "ar": "الصورة الحسّية تعمل عبر الحواس. مثال: «البرد يوخز الجلد كإبر» يخاطب اللمس.", "ru": "Чувственный образ работает через ощущения. Например, «холод колет кожу, как иглы» обращён к осязанию.", "en": "A sensory image works through the senses. For example, \"the cold needles the skin\" addresses touch."},null,[{"he": "זה מתאר את חריזה, לא את דימוי חושי.", "ar": "هذا يصف القافية، لا الصورة الحسّية.", "ru": "Это описание «рифму», а не «чувственный образ».", "en": "That describes rhyme, not a sensory image."},{"he": "זה מתאר את בית שיר, לא את דימוי חושי.", "ar": "هذا يصف بيت الشعر، لا الصورة الحسّية.", "ru": "Это описание «стихотворную строку», а не «чувственный образ».", "en": "That describes a verse line, not a sensory image."},{"he": "זה מתאר את אירוניה, לא את דימוי חושי.", "ar": "هذا يصف السخرية (الإيرونيا)، لا الصورة الحسّية.", "ru": "Это описание «иронию», а не «чувственный образ».", "en": "That describes irony, not a sensory image."},null]),Q("lit-poetry1-needles",{"he": "משורר מתאר את הקור כ\"מחטים בעור\". תלמיד טוען שזו טעות, כי קור אינו מחט. איזו תשובה מתאימה?", "ar": "يصف شاعر البرد بأنه «إبر في الجلد». يدّعي طالب أن هذا خطأ لأن البرد ليس إبرة. أي ردّ مناسب؟", "ru": "Поэт описывает холод как «иглы в коже». Ученик считает это ошибкой, ведь холод — не игла. Какой ответ уместен?", "en": "A poet describes the cold as \"needles in the skin\". A student says this is a mistake, because cold is not a needle. What is a fitting answer?"},[{"he": "זה דימוי חושי המתאר תחושה ולא עובדה פיזית", "ar": "هذه صورة حسّية تصف إحساسًا لا حقيقة فيزيائية", "ru": "Это чувственный образ, передающий ощущение, а не физический факт", "en": "It is a sensory image describing a feeling, not a physical fact"},{"he": "התלמיד צודק ויש למחוק את השורה מהשיר", "ar": "الطالب محق ويجب حذف السطر من القصيدة", "ru": "Ученик прав, и строку следует удалить из стихотворения", "en": "The student is right and the line should be deleted"},{"he": "צריך לתקן ל\"כפפות בעור\" כדי שיהיה מדויק", "ar": "يجب التصحيح إلى «قفازات في الجلد» ليكون دقيقًا", "ru": "Нужно исправить на «перчатки на коже», чтобы было точно", "en": "It should be corrected to \"gloves on skin\" to be accurate"},{"he": "רק מדען רשאי לכתוב על קור", "ar": "العالم وحده يحق له الكتابة عن البرد", "ru": "Только учёному дозволено писать о холоде", "en": "Only a scientist may write about cold"}],0,{"he": "האם המשורר מדווח מדעית או מעביר תחושה?", "ar": "هل الشاعر يقدّم تقريرًا علميًّا أم ينقل إحساسًا؟", "ru": "Поэт сообщает научный факт или передаёт ощущение?", "en": "Is the poet reporting science or conveying a feeling?"},{"he": "שירה מעבירה חוויה ולא נתוני מעבדה. למשל \"מחטים בעור\" מתאר איך הקור מורגש, וזו תקפותו של הדימוי.", "ar": "الشعر ينقل تجربة لا بيانات مختبر. مثال: «إبر في الجلد» يصف كيف يُحسّ البرد، وهذه قوة الصورة.", "ru": "Поэзия передаёт переживание, а не лабораторные данные. Например, «иглы в коже» описывает, как чувствуется холод, и в этом сила образа.", "en": "Poetry conveys experience, not lab data. For example, \"needles in the skin\" describes how cold feels, and that is the image's strength."},null,[null,{"he": "הדימוי תקף כשפה ספרותית; אין מה למחוק.", "ar": "الصورة صحيحة كلغة أدبية، ولا شيء للحذف.", "ru": "Образ корректен как литературный язык; удалять нечего.", "en": "The image is valid literary language; there is nothing to delete."},{"he": "\"תיקון\" לדימוי הופך תחושה לפריט לבוש ומחסיר את המשמעות.", "ar": "«تصحيح» الصورة يحوّل الإحساس إلى قطعة ملبس ويفقد المعنى.", "ru": "«Исправление» превращает ощущение в одежду и теряет смысл.", "en": "\"Fixing\" the image turns a feeling into clothing and loses the meaning."},{"he": "שירה פתוחה לכל כותב; ההבדל הוא במטרה, לא ברשות.", "ar": "الشعر متاح لكل كاتب، والفرق في الهدف لا في الإذن.", "ru": "Поэзия открыта любому автору; разница в цели, не в разрешении.", "en": "Poetry is open to any writer; the difference is purpose, not permission."}]),
  Q("po-3-01",{"he": "בשיר, הבית הראשון והבית האחרון זהים. אבל בבתים שבאמצע הדובר מאבד אדם קרוב. איך משתנה המשמעות של החזרה?", "ar": "في قصيدة، المقطعان الأول والأخير متطابقان. لكن في المقاطع الوسطى يفقد المتكلم شخصًا قريبًا. كيف يتغيّر معنى التكرار؟", "ru": "В стихотворении первая и последняя строфы одинаковы. Но в средних строфах говорящий теряет близкого человека. Как меняется смысл повтора?", "en": "In a poem, the first and last stanzas are identical. But in the middle stanzas the speaker loses someone close. How does the meaning of the repetition change?"},[{"he": "אותן מילים נקראות אחרת בסוף, כי הקורא כבר יודע מה קרה", "ar": "الكلمات نفسها تُقرأ بشكل مختلف في النهاية لأن القارئ صار يعرف ما حدث", "ru": "В конце те же слова звучат иначе: читатель уже знает, что было", "en": "The same words read differently at the end, as the reader now knows what happened"}, {"he": "המשמעות אינה משתנה, כי המילים זהות", "ar": "المعنى لا يتغيّر لأن الكلمات متطابقة", "ru": "Смысл не меняется, потому что слова одинаковы", "en": "The meaning does not change, because the words are the same"}, {"he": "החזרה מראה שלמשורר לא היו מספיק מילים לכתוב סוף חדש ושונה לשיר", "ar": "التكرار يُظهر أن الشاعر لم تكن لديه كلمات كافية لكتابة نهاية جديدة ومختلفة", "ru": "Повтор показывает, что поэту не хватило слов для новой и совсем другой концовки", "en": "The repetition shows the poet lacked enough words to write a new and quite different ending"}, {"he": "החזרה הופכת את השיר לסיפור מסגרת", "ar": "التكرار يحوّل القصيدة إلى قصة إطارية", "ru": "Повтор превращает стихотворение в рамочную историю", "en": "The repetition turns the poem into a frame story"}],0,{"he": "מה הקורא יודע בבית האחרון, שלא ידע בבית הראשון?", "ar": "ماذا يعرف القارئ في المقطع الأخير مما لم يعرفه في الأول؟", "ru": "Что читатель знает в последней строфе, чего не знал в первой?", "en": "What does the reader know in the last stanza that he did not know in the first?"},{"he": "חזרה אינה רק שכפול. אחרי האובדן, אותן מילים נטענות בכאב. ההקשר החדש משנה את משמעות הבית.", "ar": "التكرار ليس مجرد نسخ. بعد الفقد تمتلئ الكلمات نفسها بالألم. والسياق الجديد يغيّر معنى المقطع.", "ru": "Повтор — не просто копия. После утраты те же слова наполняются болью. Новый контекст меняет смысл строфы.", "en": "Repetition is not mere copying. After the loss, the same words fill with pain. The new context changes the stanza's meaning."},null,[null, {"he": "ההקשר משתנה, ולכן גם משמעות המילים משתנה.", "ar": "السياق يتغيّر، فيتغيّر معنى الكلمات أيضًا.", "ru": "Контекст меняется, а с ним и смысл слов.", "en": "The context changes, so the meaning of the words changes too."}, {"he": "החזרה היא בחירה אמנותית מכוונת, לא מחסור.", "ar": "التكرار اختيار فني مقصود لا نقص.", "ru": "Повтор — намеренный художественный выбор, а не нехватка.", "en": "The repetition is a deliberate artistic choice, not a lack."}, {"he": "סיפור מסגרת הוא מבנה של פרוזה עם סיפור בתוך סיפור.", "ar": "القصة الإطارية بناء نثري فيه قصة داخل قصة.", "ru": "Рамочная история — форма прозы с историей внутри истории.", "en": "A frame story is a prose form with a story inside a story."}]),
  Q("po-3-02",{"he": "שיר נפתח בדימוי של עץ פורח, ונגמר בדימוי של עץ עירום. מה ההסבר המתאים?", "ar": "تبدأ قصيدة بصورة شجرة مزهرة وتنتهي بصورة شجرة عارية. ما التفسير المناسب؟", "ru": "Стихотворение начинается образом цветущего дерева, а кончается образом голого дерева. Какое объяснение подходит?", "en": "A poem opens with the image of a tree in bloom and ends with the image of a bare tree. Which explanation fits?"},[{"he": "השיר עוסק רק בבוטניקה ובעונות השנה", "ar": "القصيدة تتناول علم النبات وفصول السنة فقط", "ru": "Стихотворение только о ботанике и временах года", "en": "The poem is only about botany and the seasons"}, {"he": "הדימויים יוצרים מהלך: מחיים ושפע אל אובדן", "ar": "الصور تصنع مسارًا: من الحياة والوفرة إلى الفقد", "ru": "Образы создают движение: от жизни и изобилия к утрате", "en": "The images form a movement: from life and plenty to loss"}, {"he": "שני הדימויים סותרים זה את זה, ולכן אין לשיר משמעות אחת ברורה בכלל", "ar": "الصورتان متناقضتان، لذلك ليس للقصيدة أي معنى واحد واضح أصلًا", "ru": "Два образа противоречат друг другу, поэтому у стихотворения вообще нет ясного смысла", "en": "The two images contradict each other, so the poem has no single clear meaning at all"}, {"he": "זו חריזה בין תחילת השיר לסופו", "ar": "هذه قافية بين بداية القصيدة ونهايتها", "ru": "Это рифма между началом и концом стихотворения", "en": "It is a rhyme between the poem's start and end"}],1,{"he": "חשבו מה העץ יכול לייצג מעבר לעצמו.", "ar": "فكّروا فيما قد تمثّله الشجرة غير نفسها.", "ru": "Подумайте, что дерево может значить помимо себя самого.", "en": "Think about what the tree could stand for beyond itself."},{"he": "הדימוי הראשון והאחרון מתכתבים. המעבר מפריחה לעירום יוצר קו של שינוי. הוא יכול לבטא סוף של אהבה, נעורים או תקווה.", "ar": "الصورة الأولى والأخيرة تتحاوران. والانتقال من الإزهار إلى العري يصنع خط تغيّر. وقد يعبّر عن نهاية حب أو شباب أو أمل.", "ru": "Первый и последний образы перекликаются. Переход от цветения к наготе создаёт линию перемены. Он может выражать конец любви, юности или надежды.", "en": "The first and last images echo each other. The shift from bloom to bareness draws a line of change. It can express the end of love, youth or hope."},null,[{"he": "בשירה, תמונה מן הטבע נושאת לרוב גם משמעות רגשית.", "ar": "في الشعر تحمل صورة الطبيعة غالبًا معنى عاطفيًا.", "ru": "В поэзии образ природы обычно несёт и чувство.", "en": "In poetry, a nature image usually carries feeling too."}, null, {"he": "הניגוד בין הדימויים הוא מה שבונה את המשמעות.", "ar": "التضاد بين الصورتين هو ما يبني المعنى.", "ru": "Именно контраст образов создаёт смысл.", "en": "The contrast between the images is what builds the meaning."}, {"he": "חריזה היא התאמה בצליל, לא בתמונה.", "ar": "القافية توافق في الصوت لا في الصورة.", "ru": "Рифма — созвучие, а не сходство образов.", "en": "Rhyme is a match in sound, not in image."}]),
  Q("po-3-03",{"he": "תלמיד כותב: \"המשורר היה עצוב כשכתב את השיר, כי הדובר עצוב.\" מה הבעיה בטענה?", "ar": "يكتب طالب: «كان الشاعر حزينًا حين كتب القصيدة، لأن المتكلم حزين». ما المشكلة في هذا الادعاء؟", "ru": "Ученик пишет: «Поэт был грустен, когда писал стихи, ведь говорящий грустит». В чём ошибка?", "en": "A student writes: \"The poet was sad when he wrote the poem, because the speaker is sad.\" What is wrong with this claim?"},[{"he": "אין בעיה: הדובר והמשורר הם תמיד אותו אדם", "ar": "لا مشكلة: المتكلم والشاعر دائمًا الشخص نفسه", "ru": "Ошибки нет: говорящий и поэт всегда один человек", "en": "No problem: the speaker and the poet are always the same person"}, {"he": "הבעיה היא שעצב אינו נושא מתאים לשירה, ולכן הדובר אינו יכול להיות עצוב", "ar": "المشكلة أن الحزن ليس موضوعًا مناسبًا للشعر، لذلك لا يمكن أن يكون المتكلم حزينًا", "ru": "Ошибка в том, что грусть — неподходящая тема для поэзии, и говорящий не может грустить", "en": "The problem is that sadness is not a fit topic for poetry, so the speaker cannot be sad"}, {"he": "הוא מזהה את הדובר עם המשורר, אף שהשיר יכול להציג קול בדוי", "ar": "يساوي بين المتكلم والشاعر، مع أن القصيدة قد تعرض صوتًا متخيّلًا", "ru": "Он отождествляет говорящего с поэтом, хотя стихи могут дать вымышленный голос", "en": "He equates the speaker with the poet, though a poem can present an invented voice"}, {"he": "הבעיה היא שהשיר כתוב בגוף שלישי", "ar": "المشكلة أن القصيدة مكتوبة بضمير الغائب", "ru": "Ошибка в том, что стихи написаны от третьего лица", "en": "The problem is that the poem is in the third person"}],2,{"he": "האם שחקן שבוכה על הבמה עצוב גם בבית?", "ar": "هل الممثل الذي يبكي على المسرح حزين في بيته أيضًا؟", "ru": "Грустит ли дома актёр, который плачет на сцене?", "en": "Is an actor who cries on stage also sad at home?"},{"he": "הדובר הוא קול שהשיר יוצר. המשורר יכול לכתוב שיר עצוב גם ביום שמח. לכן מנתחים את הדובר מתוך הטקסט, בלי לנחש על חיי המשורר.", "ar": "المتكلم صوت تصنعه القصيدة. ويمكن للشاعر أن يكتب قصيدة حزينة في يوم سعيد. لذلك نحلّل المتكلم من النص دون تخمين حياة الشاعر.", "ru": "Говорящий — голос, созданный стихотворением. Поэт может написать грустные стихи и в счастливый день. Поэтому говорящего анализируют по тексту, не гадая о жизни поэта.", "en": "The speaker is a voice the poem creates. A poet can write a sad poem on a happy day. So we analyze the speaker from the text, without guessing about the poet's life."},null,[{"he": "המשורר יכול ליצור דובר שונה ממנו.", "ar": "يمكن للشاعر أن يصنع متكلمًا مختلفًا عنه.", "ru": "Поэт может создать говорящего, не похожего на себя.", "en": "A poet can create a speaker different from himself."}, {"he": "עצב הוא אחד הנושאים הנפוצים בשירה.", "ar": "الحزن من أكثر موضوعات الشعر شيوعًا.", "ru": "Грусть — одна из самых частых тем поэзии.", "en": "Sadness is one of the most common topics in poetry."}, null, {"he": "הבעיה אינה בגוף הדקדוקי אלא בזיהוי הדובר עם המשורר.", "ar": "المشكلة ليست في الضمير بل في المساواة بين المتكلم والشاعر.", "ru": "Ошибка не в грамматическом лице, а в смешении говорящего с поэтом.", "en": "The flaw is not the grammatical person but equating speaker and poet."}]),
  Q("po-3-04",{"he": "בשיר עם מקצב קבוע, השורה האחרונה קצרה פתאום ושוברת את המקצב. מה סביר שהשבירה עושה?", "ar": "في قصيدة ذات إيقاع ثابت، يأتي السطر الأخير قصيرًا فجأة ويكسر الإيقاع. ما الأثر المرجّح لهذا الكسر؟", "ru": "В стихотворении с ровным ритмом последняя строка вдруг коротка и ломает ритм. Что, вероятно, делает этот слом?", "en": "In a poem with a steady rhythm, the last line is suddenly short and breaks the rhythm. What does the break most likely do?"},[{"he": "מראה שהמשורר שכח לספור הברות", "ar": "يُظهر أن الشاعر نسي عدّ المقاطع", "ru": "Показывает, что поэт забыл посчитать слоги", "en": "Shows the poet forgot to count syllables"}, {"he": "הופך את השיר כולו לפרוזה", "ar": "يحوّل القصيدة كلها إلى نثر", "ru": "Превращает всё стихотворение в прозу", "en": "Turns the whole poem into prose"}, {"he": "מבטל את כל החרוזים שהופיעו קודם בבתים הקודמים של השיר", "ar": "يُلغي كل القوافي التي ظهرت من قبل في المقاطع السابقة من القصيدة", "ru": "Отменяет все рифмы, которые раньше были в прежних строфах стихотворения", "en": "Cancels all the rhymes that appeared earlier in the previous stanzas of the poem"}, {"he": "מושך תשומת לב לשורה ומדגיש את התוכן שלה", "ar": "يلفت الانتباه إلى السطر ويُبرز مضمونه", "ru": "Привлекает внимание к строке и выделяет её содержание", "en": "Draws attention to the line and stresses its content"}],3,{"he": "מה קורה לאוזן כשתבנית קבועה נעצרת פתאום?", "ar": "ماذا يحدث للأذن حين يتوقف نمط ثابت فجأة؟", "ru": "Что происходит со слухом, когда привычный узор вдруг обрывается?", "en": "What happens to the ear when a steady pattern suddenly stops?"},{"he": "הקורא מתרגל למקצב, ולכן שבירה שלו בולטת. השורה הקצרה נשמעת כמו עצירה. כך היא מדגישה רגע חשוב, למשל הלם או סוף.", "ar": "يعتاد القارئ الإيقاع، فيبرز كسره. والسطر القصير يُسمع كتوقف. فيُبرز لحظة مهمة، مثل صدمة أو نهاية.", "ru": "Читатель привыкает к ритму, поэтому его слом заметен. Короткая строка звучит как остановка. Так она выделяет важный момент, например потрясение или конец.", "en": "The reader gets used to the rhythm, so breaking it stands out. The short line sounds like a halt. It stresses an important moment, such as shock or an ending."},null,[{"he": "השבירה באה בסוף ובולטת, ולכן היא מכוונת.", "ar": "الكسر يأتي في النهاية ويبرز، فهو مقصود.", "ru": "Слом стоит в конце и бросается в глаза, значит, он намеренный.", "en": "The break comes at the end and stands out, so it is deliberate."}, {"he": "שורה אחת שונה אינה מבטלת את מבנה השיר כולו.", "ar": "سطر واحد مختلف لا يلغي بناء القصيدة كلها.", "ru": "Одна иная строка не отменяет строения всего стихотворения.", "en": "One different line does not undo the whole poem's form."}, {"he": "מקצב וחריזה הם שני דברים נפרדים.", "ar": "الإيقاع والقافية أمران منفصلان.", "ru": "Ритм и рифма — разные вещи.", "en": "Rhythm and rhyme are separate things."}, null]),
  Q("po-3-05",{"he": "שיר שכולו שאלות מסתיים בשאלה שאין לה תשובה. איזו סגירה זו, ומה היא עושה?", "ar": "قصيدة كلها أسئلة تنتهي بسؤال بلا جواب. أي خاتمة هذه، وماذا تفعل؟", "ru": "Стихотворение, целиком из вопросов, кончается вопросом без ответа. Какая это концовка и что она делает?", "en": "A poem made entirely of questions ends with a question that has no answer. What kind of closure is this, and what does it do?"},[{"he": "סגירה פתוחה: הקורא נשאר עם השאלה וחושב בעצמו", "ar": "خاتمة مفتوحة: يبقى القارئ مع السؤال ويفكّر بنفسه", "ru": "Открытая концовка: читатель остаётся с вопросом и думает сам", "en": "Open closure: the reader is left with the question and thinks for himself"}, {"he": "סגירה מלאה: השאלה האחרונה עונה על כל השאלות הקודמות", "ar": "خاتمة مغلقة: السؤال الأخير يجيب عن كل الأسئلة السابقة", "ru": "Закрытая концовка: последний вопрос отвечает на все прежние", "en": "Full closure: the last question answers all the earlier ones"}, {"he": "אין סגירה, כי שיר חייב להסתיים במשפט חיווי, בנקודה ובמסקנה ברורה לקורא", "ar": "لا خاتمة، لأن القصيدة يجب أن تنتهي بجملة خبرية ونقطة واستنتاج واضح للقارئ", "ru": "Концовки нет, ведь стихи должны кончаться утверждением, точкой и ясным выводом для читателя", "en": "There is no closure, since a poem must end with a statement, a full stop and a clear conclusion"}, {"he": "זו טעות של המשורר, ששכח לכתוב תשובה", "ar": "هذا خطأ من الشاعر الذي نسي كتابة الجواب", "ru": "Это ошибка поэта, забывшего написать ответ", "en": "It is the poet's mistake; he forgot to write an answer"}],0,{"he": "מה נשאר אצל הקורא אחרי השורה האחרונה?", "ar": "ماذا يبقى لدى القارئ بعد السطر الأخير؟", "ru": "Что остаётся у читателя после последней строки?", "en": "What stays with the reader after the last line?"},{"he": "שאלה בלי תשובה בסוף משאירה את השיר פתוח. הקורא ממשיך לחשוב גם אחרי הקריאה. זו בחירה שמתאימה לשיר שעוסק בספק.", "ar": "سؤال بلا جواب في النهاية يترك القصيدة مفتوحة. ويواصل القارئ التفكير بعد القراءة. وهذا اختيار يناسب قصيدة عن الشك.", "ru": "Вопрос без ответа в конце оставляет стихи открытыми. Читатель продолжает думать и после чтения. Такой выбор подходит стихам о сомнении.", "en": "An unanswered question at the end leaves the poem open. The reader keeps thinking after reading. This choice suits a poem about doubt."},null,[null, {"he": "שאלה אינה תשובה, ולכן הסוף אינו סוגר.", "ar": "السؤال ليس جوابًا، فالنهاية لا تُغلق.", "ru": "Вопрос — не ответ, поэтому конец не закрывает.", "en": "A question is not an answer, so the ending does not close."}, {"he": "אין חוק כזה; סגירה יכולה גם להיות פתוחה.", "ar": "لا قاعدة كهذه، فالخاتمة قد تكون مفتوحة.", "ru": "Такого правила нет; концовка может быть открытой.", "en": "There is no such rule; closure can also be open."}, {"he": "השיר כולו בנוי משאלות, ולכן הסוף מכוון.", "ar": "القصيدة كلها مبنية من أسئلة، فالنهاية مقصودة.", "ru": "Всё стихотворение из вопросов, значит, конец намеренный.", "en": "The whole poem is built of questions, so the ending is deliberate."}]),
  Q("po-3-06",{"he": "מה ההבדל באפקט בין \"אהבתי כמו אש\" לבין \"אהבתי היא אש\"?", "ar": "ما الفرق في الأثر بين «حبي مثل النار» و«حبي نار»؟", "ru": "В чём разница в эффекте между «моя любовь как огонь» и «моя любовь — огонь»?", "en": "What is the difference in effect between \"my love is like fire\" and \"my love is fire\"?"},[{"he": "אין הבדל, כי שני המשפטים מדברים על אש ועל אהבה", "ar": "لا فرق، لأن الجملتين تتحدثان عن النار والحب", "ru": "Разницы нет: обе фразы говорят об огне и любви", "en": "No difference, since both talk about fire and love"}, {"he": "המטאפורה מזהה את שני הדברים, ולכן היא חזקה ומוחלטת יותר", "ar": "الاستعارة تجعل الشيئين واحدًا، لذلك هي أقوى وأكثر حسمًا", "ru": "Метафора отождествляет две вещи, поэтому она сильнее и категоричнее", "en": "The metaphor makes the two one, so it is stronger and more absolute"}, {"he": "הדימוי חזק יותר, כי מילת ההשוואה \"כמו\" מוסיפה למשפט עוד מילה ולכן עוד משמעות", "ar": "التشبيه أقوى لأن أداة «مثل» تضيف إلى الجملة كلمة أخرى وبالتالي معنى آخر", "ru": "Сравнение сильнее, ведь слово «как» добавляет во фразу ещё одно слово, а значит, и смысл", "en": "The simile is stronger, because the word \"like\" adds one more word and so more meaning"}, {"he": "המשפט השני הוא האנשה של האש", "ar": "الجملة الثانية تشخيص للنار", "ru": "Вторая фраза — олицетворение огня", "en": "The second sentence personifies fire"}],1,{"he": "בדקו: האם האהבה רק דומה, או שהיא כבר הדבר עצמו?", "ar": "تحققوا: هل الحب يشبه فقط، أم صار الشيء نفسه؟", "ru": "Проверьте: любовь только похожа или она уже и есть сама вещь?", "en": "Check: is love only similar, or is it the thing itself?"},{"he": "בדימוי, מילת ההשוואה שומרת מרחק בין האהבה לאש. במטאפורה המרחק נעלם, והאהבה היא האש. לכן המטאפורה נשמעת עזה ונחרצת יותר.", "ar": "في التشبيه تحافظ أداة التشبيه على مسافة بين الحب والنار. وفي الاستعارة تختفي المسافة ويصير الحب نارًا. لذلك تبدو الاستعارة أشدّ وأكثر حسمًا.", "ru": "В сравнении слово «как» сохраняет дистанцию между любовью и огнём. В метафоре дистанция исчезает, и любовь становится огнём. Поэтому метафора звучит сильнее и решительнее.", "en": "In a simile, the word \"like\" keeps a distance between love and fire. In a metaphor the distance disappears, and love is fire. So the metaphor sounds fiercer and more decisive."},null,[{"he": "מילת ההשוואה משנה את היחס בין שני הדברים.", "ar": "أداة التشبيه تغيّر العلاقة بين الشيئين.", "ru": "Сравнительное слово меняет отношение между двумя вещами.", "en": "The comparison word changes the relation between the two things."}, null, {"he": "מספר המילים אינו קובע עוצמה; \"כמו\" דווקא מרחיק.", "ar": "عدد الكلمات لا يحدد القوة، و«مثل» تُبعد في الحقيقة.", "ru": "Число слов не определяет силу; «как» как раз отдаляет.", "en": "Word count does not set strength; \"like\" actually adds distance."}, {"he": "לאש אין כאן תכונה של אדם; האהבה מזוהה איתה.", "ar": "النار هنا بلا صفة بشرية، والحب يُجعل نارًا.", "ru": "Огню здесь не даны черты человека; любовь отождествлена с ним.", "en": "Fire gets no human trait here; love is equated with it."}])]]);

  {"he": "שירה מאוחרת: קול ופרשנות", "ar": "الشعر الحديث: الصوت والتفسير", "ru": "Поздняя поэзия: голос и толкование", "en": "Later poetry: voice and reading"},
  {"he": "מי הדובר, אל מי הוא פונה, ומה משתנה?", "ar": "من المتكلم ولمن يتوجه وما الذي يتغير؟", "ru": "Кто говорит, к кому и что меняется?", "en": "Who speaks, to whom, and what shifts?"},
[ [
  Q("lit-poetry-8282-1",{"he": "איזה תיאור מתאים לדובר בשיר?", "ar": "أي وصف يناسب المتكلم في القصيدة؟", "ru": "Какое описание подходит к «Лирический говорящий»?", "en": "Which description fits speaker in a poem?"},[{"he": "הקול שמדבר בשיר; אין לזהותו אוטומטית עם המשורר האמיתי.", "ar": "الصوت الذي يتكلم في القصيدة؛ ليس بالضرورة الشاعر الحقيقي.", "ru": "Голос в стихотворении, не обязательно сам реальный поэт.", "en": "The voice speaking in a poem, not automatically the real poet."},{"he": "מי שהדובר פונה אליו, אם יש פנייה בטקסט.", "ar": "من يوجّه إليه المتكلم كلامه إن وجد خطاب في النص.", "ru": "Тот, к кому обращается говорящий, если обращение есть.", "en": "The person or thing addressed by the speaker, when the poem makes an address."},{"he": "מעבר בעמדה הרגשית של הדובר, למשל מתקווה לספק.", "ar": "انتقال موقف المتكلم العاطفي، مثل الانتقال من الأمل إلى الشك.", "ru": "Переход в эмоциональном отношении говорящего, например от надежды к сомнению.", "en": "A change in the speaker’s attitude, for example from hope to doubt."},{"he": "מקום שבו הטקסט אינו מכריע פירוש אחד ויש לבסס אפשרויות בפרטים.", "ar": "موضع لا يحسم فيه النص معنى واحدًا وتحتاج فيه القراءات إلى قرائن.", "ru": "Место, где текст допускает разные прочтения, каждое с опорой на детали.", "en": "A place where the text leaves more than one reading possible, each needing evidence."}],0,{"he": "חפשו את הפרט שמבדיל אותו מן האחרים.", "ar": "ابحثوا عن التفصيل الذي يميزه عن غيره.", "ru": "Ищите отличие от остальных вариантов.", "en": "Look for the detail that separates it from the others."},{"he": "יש להבחין בין קול הטקסט לבין האדם שכתב אותו.", "ar": "ينبغي التفريق بين صوت النص ومؤلفه.", "ru": "Нужно различать голос текста и его автора.", "en": "Distinguish the voice in the text from its author."},null,[null,{"he": "זה מתאר את נמען, לא את דובר בשיר.", "ar": "هذا يصف المخاطَب، لا المتكلم في القصيدة.", "ru": "Это описание «Адресат», а не «Лирический говорящий».", "en": "That describes addressee, not speaker in a poem."},{"he": "זה מתאר את שינוי בטון, לא את דובר בשיר.", "ar": "هذا يصف تحول النبرة، لا المتكلم في القصيدة.", "ru": "Это описание «Смена тона», а не «Лирический говорящий».", "en": "That describes shift in tone, not speaker in a poem."},{"he": "זה מתאר את מרווח פרשנות, לא את דובר בשיר.", "ar": "هذا يصف مجال التأويل، لا المتكلم في القصيدة.", "ru": "Это описание «Пространство толкования», а не «Лирический говорящий».", "en": "That describes room for interpretation, not speaker in a poem."}]),
  Q("lit-poetry-8282-2",{"he": "איזה תיאור מתאים לנמען?", "ar": "أي وصف يناسب المخاطَب؟", "ru": "Какое описание подходит к «Адресат»?", "en": "Which description fits addressee?"},[{"he": "הקול שמדבר בשיר; אין לזהותו אוטומטית עם המשורר האמיתי.", "ar": "الصوت الذي يتكلم في القصيدة؛ ليس بالضرورة الشاعر الحقيقي.", "ru": "Голос в стихотворении, не обязательно сам реальный поэт.", "en": "The voice speaking in a poem, not automatically the real poet."},{"he": "מי שהדובר פונה אליו, אם יש פנייה בטקסט.", "ar": "من يوجّه إليه المتكلم كلامه إن وجد خطاب في النص.", "ru": "Тот, к кому обращается говорящий, если обращение есть.", "en": "The person or thing addressed by the speaker, when the poem makes an address."},{"he": "מעבר בעמדה הרגשית של הדובר, למשל מתקווה לספק.", "ar": "انتقال موقف المتكلم العاطفي، مثل الانتقال من الأمل إلى الشك.", "ru": "Переход в эмоциональном отношении говорящего, например от надежды к сомнению.", "en": "A change in the speaker’s attitude, for example from hope to doubt."},{"he": "מקום שבו הטקסט אינו מכריע פירוש אחד ויש לבסס אפשרויות בפרטים.", "ar": "موضع لا يحسم فيه النص معنى واحدًا وتحتاج فيه القراءات إلى قرائن.", "ru": "Место, где текст допускает разные прочтения, каждое с опорой на детали.", "en": "A place where the text leaves more than one reading possible, each needing evidence."}],1,{"he": "חפשו את הפרט שמבדיל אותו מן האחרים.", "ar": "ابحثوا عن التفصيل الذي يميزه عن غيره.", "ru": "Ищите отличие от остальных вариантов.", "en": "Look for the detail that separates it from the others."},{"he": "פנייה כגון \"אתה\" עשויה לגלות נמען, אך לא תמיד את זהותו.", "ar": "قد تكشف كلمة مثل «أنت» عن مخاطَب، لا عن هويته دائمًا.", "ru": "Обращение «ты» указывает адресата, но не всегда его личность.", "en": "\"You\" can signal an addressee without fixing their identity."},null,[{"he": "זה מתאר את דובר בשיר, לא את נמען.", "ar": "هذا يصف المتكلم في القصيدة، لا المخاطَب.", "ru": "Это описание «Лирический говорящий», а не «Адресат».", "en": "That describes speaker in a poem, not addressee."},null,{"he": "זה מתאר את שינוי בטון, לא את נמען.", "ar": "هذا يصف تحول النبرة، لا المخاطَب.", "ru": "Это описание «Смена тона», а не «Адресат».", "en": "That describes shift in tone, not addressee."},{"he": "זה מתאר את מרווח פרשנות, לא את נמען.", "ar": "هذا يصف مجال التأويل، لا المخاطَب.", "ru": "Это описание «Пространство толкования», а не «Адресат».", "en": "That describes room for interpretation, not addressee."}])
 ,Q("lit-poetry2-allu",{"he": "איזה תיאור מתאים לרמיזה?", "ar": "أي وصف يناسب التلميح؟", "ru": "Какое описание подходит к аллюзию?", "en": "Which description fits an allusion?"},[{"he": "הפניה קצרה ליצירה או למקור אחר, שהקורא מוזמן לזהות.", "ar": "إحالة موجزة إلى عمل أو مصدر آخر، يُدعى القارئ للتعرف إليه.", "ru": "Краткое указание на другое произведение или источник, который читателю предлагается узнать.", "en": "A brief reference to another work or source that the reader is invited to recognize."},{"he": "מעבר בין עבר להווה בשיר, המשנה את נקודת המבט של הדובר.", "ar": "انتقال بين الماضي والحاضر في القصيدة يغيّر زاوية نظر المتحدث.", "ru": "Переход между прошлым и настоящим в стихотворении, меняющий точку зрения говорящего.", "en": "A move between past and present in the poem, changing the speaker's viewpoint."},{"he": "נוכחות של שתי תחושות מנוגדות כלפי אותו דבר, זו לצד זו.", "ar": "حضور شعورين متناقضين تجاه الشيء نفسه، جنبًا إلى جنب.", "ru": "Присутствие двух противоположных чувств к одному и тому же рядом друг с другом.", "en": "The presence of two opposing feelings toward the same thing, side by side."},{"he": "רגע שבו השיר פונה לכיוון ההפוך ממה שהקורא ציפה לו.", "ar": "لحظة تنعطف فيها القصيدة عكس ما توقعه القارئ.", "ru": "Момент, когда стихотворение поворачивает против читательского ожидания.", "en": "The moment the poem turns against what the reader expected."}],0,{"he": "מה מזמין את הקורא להיזכר במקור אחר?", "ar": "ما الذي يدعو القارئ لتذكّر مصدر آخر؟", "ru": "Что предлагает читателю вспомнить другой источник?", "en": "What invites the reader to recall another source?"},{"he": "רמיזה פועלת בקיצור. למשל המילה \"תקוה\" בשיר יכולה לרמוז למקור מוכר בלי לצטט אותו.", "ar": "التلميح يعمل بإيجاز. مثال: كلمة في القصيدة قد تلمّح إلى مصدر مألوف دون اقتباسه.", "ru": "Аллюзия работает кратко. Например, слово в стихотворении может намекать на известный источник без цитаты.", "en": "An allusion works briefly. For example, a word in a poem can hint at a familiar source without quoting it."},null,[null,{"he": "זה מתאר את מעבר זמן, לא את רמיזה.", "ar": "هذا يصف الانتقال الزمني، لا التلميح.", "ru": "Это описание «переход во времени», а не «аллюзию».", "en": "That describes a time shift, not an allusion."},{"he": "זה מתאר את אמביוולנטיות, לא את רמיזה.", "ar": "هذا يصف الازدواجية الوجدانية، لا التلميح.", "ru": "Это описание «амбивалентность», а не «аллюзию».", "en": "That describes ambivalence, not an allusion."},{"he": "זה מתאר את שבירת ציפייה, לא את רמיזה.", "ar": "هذا يصف كسر التوقع، لا التلميح.", "ru": "Это описание «слом ожидания», а не «аллюзию».", "en": "That describes a broken expectation, not an allusion."}]),
