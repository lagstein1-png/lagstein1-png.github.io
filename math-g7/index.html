 coord1:[
  ST_("מערכת צירים היא שני קווים: ציר x לרוחב וציר y לגובה. הם נפגשים בנקודה שנקראת הראשית, והיא 0.","نظام المحورين خطّان: محور x أفقي ومحور y رأسي، يلتقيان في نقطة الأصل وهي 0.","Система координат — две прямые: ось x горизонтально и ось y вертикально. Они встречаются в начале координат, это 0.","A coordinate system is two lines: the x-axis across and the y-axis up. They meet at the origin, which is 0.",function(){return cpl({x0:0,x1:6,y0:0,y1:6,pts:[{x:0,y:0,l:"0",dx:8,dy:-8}]})}),
  ST_("כל נקודה מקבלת שני מספרים בסוגריים: (x, y). קודם ימינה, אחר כך למעלה. הנקודה A היא (4, 3).","لكل نقطة عددان بين قوسين: (x, y). أولًا يمينًا ثم إلى الأعلى. النقطة A هي (4, 3).","У каждой точки два числа в скобках: (x, y). Сначала вправо, потом вверх. Точка A — (4, 3).","Every point has two numbers in brackets: (x, y). First right, then up. Point A is (4, 3).",function(){return cpl({x0:0,x1:6,y0:0,y1:6,pts:[{x:4,y:3,l:"A (4, 3)"}]})}),
  ST_("הסדר חשוב. (4, 3) ו-(3, 4) הן שתי נקודות שונות.","الترتيب مهم. (4, 3) و(3, 4) نقطتان مختلفتان.","Порядок важен. (4, 3) и (3, 4) — разные точки.","Order matters. (4, 3) and (3, 4) are different points.",function(){return cpl({x0:0,x1:6,y0:0,y1:6,pts:[{x:4,y:3,l:"(4, 3)"},{x:3,y:4,l:"(3, 4)",c:COL.blue,dx:-62}]})}),
  ST_("נקודה על ציר x נראית כך: (5, 0). נקודה על ציר y נראית כך: (0, 4). מרחק בין שתי נקודות באותה שורה הוא ההפרש בין ה-x שלהן.","النقطة على محور x تبدو هكذا: (5, 0) وعلى محور y هكذا: (0, 4). المسافة بين نقطتين على نفس الصف هي فرق إحداثيي x.","Точка на оси x: (5, 0). Точка на оси y: (0, 4). Расстояние между точками в одной строке — разность их x.","A point on the x-axis looks like (5, 0). On the y-axis it looks like (0, 4). The distance between two points in one row is the difference of their x values.",function(){return cpl({x0:0,x1:6,y0:0,y1:6,pts:[{x:5,y:0,l:"(5, 0)",dy:-10},{x:0,y:4,l:"(0, 4)",c:COL.blue},{x:1,y:2,l:"A",c:COL.green},{x:5,y:2,l:"B",c:COL.green}]})})],
 neg:[
  ST_("מספרים שליליים מופיעים משמאל ל-0 על ציר המספרים. למשל טמפרטורה של 3 מעלות מתחת לאפס היא −3.","الأعداد السالبة على يسار 0 على خط الأعداد. مثلًا ثلاث درجات تحت الصفر هي −3.","Отрицательные числа слева от 0 на числовой оси. Например, 3 градуса ниже нуля — это −3.","Negative numbers are to the left of 0 on the number line. For example, 3 degrees below zero is −3.",function(){return nline(-6,6,[{v:-3,l:"−3"}])}),
  ST_("ככל שהמספר רחוק יותר שמאלה, הוא קטן יותר. לכן −5 קטן מ-−2.","كلما كان العدد أبعد إلى اليسار كان أصغر. لذلك −5 أصغر من −2.","Чем левее число, тем оно меньше. Поэтому −5 меньше, чем −2.","The farther left, the smaller. So −5 is smaller than −2.",function(){return nline(-6,6,[{v:-5,l:"−5"},{v:-2,l:"−2",c:COL.blue}])}),
  ST_("מספרים נגדיים נמצאים באותו מרחק מ-0, משני הצדדים. הנגדי של 4 הוא −4. המרחק הזה נקרא ערך מוחלט.","العددان المتقابلان على نفس البعد من 0 في جهتين. مقابل 4 هو −4. وهذا البعد يسمى القيمة المطلقة.","Противоположные числа на одном расстоянии от 0 по разные стороны. Противоположное для 4 — это −4. Это расстояние называется модулем.","Opposite numbers are the same distance from 0 on both sides. The opposite of 4 is −4. That distance is called the absolute value.",function(){return nline(-6,6,[{v:-4,l:"−4"},{v:4,l:"4",c:COL.blue}])}),
  ST_("כדי לספור כמה מספרים שלמים יש בין שני מספרים, אל תשכחו את 0 ואל תספרו את הקצוות.","لعدّ الأعداد الصحيحة بين عددين لا تنسوا 0 ولا تعدّوا الطرفين.","Чтобы посчитать целые числа между двумя числами, не забудь 0 и не считай концы.","To count whole numbers between two numbers, remember 0 and do not count the ends.",function(){return nline(-4,4,[{v:-3,l:"−3"},{v:3,l:"3",c:COL.blue}])})],
 addsub:[
  ST_("חיבור של מספר חיובי זז ימינה על הציר. חיבור של מספר שלילי זז שמאלה. דוגמה: 2 + (−5) מגיעים ל-−3.","جمع عدد موجب يعني التحرك يمينًا وجمع عدد سالب يعني التحرك يسارًا. مثال: 2 + (−5) نصل إلى −3.","Прибавить положительное — сдвиг вправо. Прибавить отрицательное — влево. Пример: 2 + (−5) даёт −3.","Adding a positive moves right. Adding a negative moves left. Example: 2 + (−5) lands on −3.",function(){return nline(-6,6,[{v:2,l:"2"},{v:-3,l:"−3",c:COL.blue}])}),
  ST_("חיסור הוא חיבור של הנגדי. 3 − (−2) = 3 + 2 = 5. מינוס ומינוס נותנים פלוס.","الطرح هو جمع المقابل. 3 − (−2) = 3 + 2 = 5. سالب وسالب يعطيان موجبًا.","Вычитание — это прибавление противоположного. 3 − (−2) = 3 + 2 = 5. Минус и минус дают плюс.","Subtracting is adding the opposite. 3 − (−2) = 3 + 2 = 5. Two minuses make a plus.",function(){return nline(-3,6,[{v:3,l:"3"},{v:5,l:"5",c:COL.blue}])}),
  ST_("בטמפרטורה: עלייה מוסיפה, ירידה מחסירה. מ-−2 עולים 7 ומגיעים ל-5.","في الحرارة: الارتفاع يجمع والانخفاض يطرح. من −2 نصعد 7 فنصل إلى 5.","С температурой: подъём прибавляет, спад вычитает. От −2 поднимаемся на 7 и получаем 5.","With temperature: rising adds, falling subtracts. From −2 rise 7 and reach 5.",function(){return nline(-4,7,[{v:-2,l:"−2"},{v:5,l:"5",c:COL.blue}])}),
  ST_("בחיבור אפשר להחליף סדר: 4 + (−9) = (−9) + 4. אותה תוצאה: −5.","في الجمع يمكن تبديل الترتيب: 4 + (−9) = (−9) + 4. النتيجة نفسها: −5.","В сумме можно менять порядок: 4 + (−9) = (−9) + 4. Результат тот же: −5.","In addition you can swap the order: 4 + (−9) = (−9) + 4. Same result: −5.",function(){return nline(-7,5,[{v:-5,l:"−5"}])})],
 coord4:[
  ST_("מרחיבים את הצירים. ציר x ממשיך שמאלה עם מספרים שליליים, וציר y ממשיך למטה.","نوسّع المحورين. محور x يمتد يسارًا بأعداد سالبة ومحور y يمتد إلى الأسفل.","Расширяем оси. Ось x продолжается влево отрицательными числами, ось y — вниз.","We extend the axes. The x-axis continues left with negative numbers, and the y-axis continues down.",function(){return cpl({x0:-4,x1:4,y0:-4,y1:4,pts:[{x:-3,y:2,l:"(−3, 2)",dx:-10,c:COL.blue}]})}),
  ST_("המישור מתחלק לארבעה רביעים. ראשון: ימין־למעלה. שני: שמאל־למעלה. שלישי: שמאל־למטה. רביעי: ימין־למטה.","ينقسم المستوى إلى أربعة أرباع. الأول: يمين-أعلى. الثاني: يسار-أعلى. الثالث: يسار-أسفل. الرابع: يمين-أسفل.","Плоскость делится на четыре четверти. I: справа-вверху. II: слева-вверху. III: слева-внизу. IV: справа-внизу.","The plane has four quadrants. I: top right. II: top left. III: bottom left. IV: bottom right.",function(){return cpl({x0:-4,x1:4,y0:-4,y1:4,pts:[{x:2,y:2,l:"I",c:COL.red},{x:-2,y:2,l:"II",c:COL.blue},{x:-2,y:-2,l:"III",c:COL.green},{x:2,y:-2,l:"IV",c:COL.orange}]})}),
  ST_("הסימנים קובעים את הרביע: (+, +) ראשון, (−, +) שני, (−, −) שלישי, (+, −) רביעי.","الإشارات تحدد الربع: (+، +) الأول و(−، +) الثاني و(−، −) الثالث و(+، −) الرابع.","Знаки определяют четверть: (+, +) — I, (−, +) — II, (−, −) — III, (+, −) — IV.","The signs tell the quadrant: (+, +) is I, (−, +) is II, (−, −) is III, (+, −) is IV.",function(){return cpl({x0:-4,x1:4,y0:-4,y1:4,pts:[{x:3,y:2,l:"(3, 2)"},{x:3,y:-2,l:"(3, −2)",c:COL.blue}]})}),
  ST_("שיקוף בציר x משנה את הסימן של y. שיקוף בציר y משנה את הסימן של x.","الانعكاس في محور x يغيّر إشارة y والانعكاس في محور y يغيّر إشارة x.","Отражение в оси x меняет знак y. Отражение в оси y меняет знак x.","Reflecting in the x-axis changes the sign of y. Reflecting in the y-axis changes the sign of x.",function(){return cpl({x0:-4,x1:4,y0:-4,y1:4,pts:[{x:3,y:2,l:"P"},{x:-3,y:2,l:"P′",c:COL.blue,dx:-22}]})})],
 coord5:[
  ST_("מערכת צירים תקינה: שני צירים מאונכים, מספרים לפי הסדר ומרווחים שווים בין המספרים.","نظام المحورين الصحيح: محوران متعامدان وأعداد مرتبة ومسافات متساوية بين الأعداد.","Правильная система: две перпендикулярные оси, числа по порядку и равные промежутки между ними.","A proper system has two perpendicular axes, numbers in order and equal gaps between the numbers."),
  ST_("נקודה על ציר x היא (מספר, 0). נקודה על ציר y היא (0, מספר). ראשית הצירים היא (0, 0).","النقطة على محور x هي (عدد، 0) وعلى محور y هي (0، عدد). نقطة الأصل (0، 0).","Точка на оси x — (число, 0). Точка на оси y — (0, число). Начало координат — (0, 0).","A point on the x-axis is (number, 0). A point on the y-axis is (0, number). The origin is (0, 0)."),
  ST_("אם לשתי נקודות יש אותו x, הקטע ביניהן אנכי, מקביל לציר y. אם יש להן אותו y, הוא אופקי, מקביל לציר x.","إذا كان للنقطتين x نفسه فالقطعة رأسية وموازية لمحور y. وإذا كان y نفسه فهي أفقية وموازية لمحور x.","Если у двух точек одинаковый x, отрезок вертикальный, параллельный оси y. Если одинаковый y — горизонтальный, параллельный оси x.","If two points have the same x, the segment is vertical, parallel to the y-axis. If they have the same y, it is horizontal, parallel to the x-axis."),
  ST_("המרחק של נקודה מציר x הוא הערך המוחלט של y. המרחק שלה מציר y הוא הערך המוחלט של x.","بُعد النقطة عن محور x هو القيمة المطلقة لـ y، وعن محور y هو القيمة المطلقة لـ x.","Расстояние от точки до оси x — модуль y. До оси y — модуль x.","A point's distance from the x-axis is the absolute value of y. Its distance from the y-axis is the absolute value of x.")],
 muldiv:[
  ST_("כפל הוא חיבור חוזר. 3 · (−2) = (−2) + (−2) + (−2) = −6. חיובי כפול שלילי נותן שלילי.","الضرب جمع متكرر. 3 · (−2) = (−2) + (−2) + (−2) = −6. موجب في سالب يعطي سالبًا.","Умножение — повторное сложение. 3 · (−2) = (−2) + (−2) + (−2) = −6. Плюс на минус даёт минус.","Multiplying is repeated adding. 3 · (−2) = (−2) + (−2) + (−2) = −6. Positive times negative is negative.",function(){return nline(-7,1,[{v:-6,l:"−6"}])}),
  ST_("שלילי כפול שלילי נותן חיובי: (−3) · (−4) = 12. סימנים זהים נותנים +, סימנים שונים נותנים −.","سالب في سالب يعطي موجبًا: (−3) · (−4) = 12. إشارتان متشابهتان تعطيان + ومختلفتان −.","Минус на минус даёт плюс: (−3) · (−4) = 12. Одинаковые знаки — плюс, разные — минус.","Negative times negative is positive: (−3) · (−4) = 12. Same signs give +, different signs give −.",function(){return ""}),
  ST_("חילוק הוא הפוך מכפל, ולכן אותם כללי סימנים: (−12) ÷ 3 = −4 ו-(−12) ÷ (−3) = 4.","القسمة عكس الضرب فنفس قواعد الإشارات: (−12) ÷ 3 = −4 و(−12) ÷ (−3) = 4.","Деление обратно умножению, правила знаков те же: (−12) ÷ 3 = −4 и (−12) ÷ (−3) = 4.","Division undoes multiplication, so the same sign rules apply: (−12) ÷ 3 = −4 and (−12) ÷ (−3) = 4.",function(){return ""}),
  ST_("סדר הפעולות: קודם כפל וחילוק, אחר כך חיבור וחיסור. −2 + 3 · (−4) = −2 + (−12) = −14.","ترتيب العمليات: الضرب والقسمة أولًا ثم الجمع والطرح. −2 + 3 · (−4) = −2 + (−12) = −14.","Порядок действий: сначала умножение и деление, потом сложение и вычитание. −2 + 3 · (−4) = −2 + (−12) = −14.","Order of operations: multiply and divide first, then add and subtract. −2 + 3 · (−4) = −2 + (−12) = −14.",function(){return ""})],
 angles:[
  ST_("זווית נוצרת משתי קרניים שיוצאות מאותה נקודה, הקודקוד. בשם הזווית ABC האות האמצעית היא הקודקוד.","تتكون الزاوية من شعاعين يخرجان من نقطة واحدة هي الرأس. في اسم الزاوية ABC الحرف الأوسط هو الرأس.","Угол образуют два луча из одной точки — вершины. В названии угла ABC средняя буква — вершина.","An angle is two rays from one point, the vertex. In the name ABC the middle letter is the vertex.",function(){return '<div class="nl">'+svg(200,140,ray(100,100,76,20)+ray(100,100,76,110)+arc(100,100,24,20,110)+ptxt(100,118,"B",{s:16,w:800})+ptxt(P2(100,100,88,20)[0]+6,P2(100,100,88,20)[1]+4,"A",{s:16,w:800})+ptxt(P2(100,100,88,110)[0],P2(100,100,88,110)[1]-2,"C",{s:16,w:800}),"")+'</div>'}),
  ST_("מודדים זוויות במעלות. זווית חדה קטנה מ-90°, ישרה היא 90°, קהה בין 90° ל-180°, ושטוחה היא 180°.","نقيس الزوايا بالدرجات. الحادة أقل من 90° والقائمة 90° والمنفرجة بين 90° و180° والمستقيمة 180°.","Углы измеряют в градусах. Острый меньше 90°, прямой равен 90°, тупой между 90° и 180°, развёрнутый равен 180°.","Angles are measured in degrees. Acute is under 90°, right is 90°, obtuse is between 90° and 180°, straight is 180°.",function(){return angD(40,{W:190,r:70})+angD(90,{W:190,r:70})+angD(130,{W:190,r:70})}),
  ST_("כך משתמשים במד־זווית: מניחים את המרכז על הקודקוד, הקרן התחתונה על 0, וקוראים איפה עוברת הקרן השנייה.","نستخدم المنقلة هكذا: نضع المركز على الرأس والشعاع السفلي على 0 ونقرأ أين يمرّ الشعاع الآخر.","Так пользуются транспортиром: центр на вершину, нижний луч на 0, читаем, где проходит второй луч.","To use a protractor: put the center on the vertex, the bottom ray on 0, and read where the other ray passes.",function(){return protr(50)}),
  ST_("אומדים בעזרת זווית ישרה: חצי ממנה הוא 45° וכמעט ישרה היא בערך 80°. על שעון, בין שני מספרים יש 30°.","نقدّر بمساعدة الزاوية القائمة: نصفها 45° وقريبة منها نحو 80°. على الساعة بين رقمين 30°.","Оценивай по прямому углу: половина — 45°, почти прямой — около 80°. На часах между двумя числами 30°.","Estimate with a right angle: half of it is 45°, almost right is about 80°. On a clock, two neighboring numbers are 30° apart.",function(){return clockVis(4,0)})],
 angop:[
  ST_("שתי זוויות סמוכות יוצרות זווית גדולה יותר: 30° + 40° = 70°.","زاويتان متجاورتان تكوّنان زاوية أكبر: 30° + 40° = 70°.","Два соседних угла образуют больший угол: 30° + 40° = 70°.","Two neighboring angles make a bigger angle: 30° + 40° = 70°.",function(){return splitAng(30,40,["30°","40°"])}),
  ST_("כשיודעים את כל הזווית ואת אחד החלקים, מחסירים: 70° − 30° = 40°.","عندما نعرف الزاوية كلها وأحد الجزأين نطرح: 70° − 30° = 40°.","Если знаем весь угол и одну часть — вычитаем: 70° − 30° = 40°.","If you know the whole angle and one part, subtract: 70° − 30° = 40°.",function(){return splitAng(30,40,["30°","?"])}),
  ST_("חוצה זווית הוא קרן שמחלקת את הזווית לשני חלקים שווים. חוצה של 80° נותן שתי זוויות של 40°.","منصّف الزاوية شعاع يقسمها إلى جزأين متساويين. منصّف 80° يعطي زاويتين 40°.","Биссектриса — луч, делящий угол на две равные части. Биссектриса угла 80° даёт два угла по 40°.","A bisector is a ray that splits an angle into two equal parts. Bisecting 80° gives two angles of 40°.",function(){return splitAng(40,40,["40°","40°"])}),
  ST_("אפשר לכתוב משוואה: אם החלקים הם x ו-(x + 10) וכולה 90°, אז 2x + 10 = 90 ו-x = 40.","يمكن كتابة معادلة: إذا كان الجزآن x و(x + 10) والكل 90° فإن 2x + 10 = 90 وx = 40.","Можно составить уравнение: части x и (x + 10), весь угол 90°, значит 2x + 10 = 90 и x = 40.","You can write an equation: if the parts are x and (x + 10) and the whole is 90°, then 2x + 10 = 90 and x = 40.",function(){return splitAng(50,40,["x+10","x"])})],
 adjvert:[
  ST_("זוויות צמודות חולקות צלע, והצלעות החיצוניות שלהן הן קו ישר. יחד הן 180°.","الزاويتان المتجاورتان تتشاركان ضلعًا وضلعاهما الخارجيان مستقيم. معًا 180°.","Смежные углы имеют общую сторону, а их внешние стороны образуют прямую. Вместе 180°.","Adjacent angles share a side, and their outer sides form a straight line. Together they are 180°.",function(){return adjVis(60,["60°","120°"])}),
  ST_("כששני ישרים נחתכים נוצרות זוויות קודקודיות. אלה שמול זו שוות: 60° ו-60°, 120° ו-120°.","عندما يتقاطع مستقيمان تتكوّن زوايا متقابلة بالرأس. المتقابلتان متساويتان: 60° و60° و120° و120°.","Когда прямые пересекаются, получаются вертикальные углы. Те, что напротив, равны: 60° и 60°, 120° и 120°.","When two lines cross, vertical angles appear. Opposite ones are equal: 60° and 60°, 120° and 120°.",function(){return vertVis(60,["60°","120°","60°","120°"])}),
  ST_("שלוש זוויות או יותר על קו ישר יחד הן 180°. סביב נקודה הן 360°.","ثلاث زوايا أو أكثر على مستقيم مجموعها 180° وحول نقطة 360°.","Несколько углов на прямой вместе дают 180°. Вокруг точки — 360°.","Several angles along a straight line add up to 180°. Around a point they add up to 360°.",function(){return adjVis(100,["100°","80°"])}),
  ST_("משוואה עוזרת: אם x ו-3x צמודות, אז 4x = 180 ו-x = 45.","المعادلة تساعد: إذا كانت x و3x متجاورتين فإن 4x = 180 وx = 45.","Уравнение помогает: если x и 3x смежные, то 4x = 180 и x = 45.","An equation helps: if x and 3x are adjacent, then 4x = 180 and x = 45.",function(){return adjVis(45,["x","3x"])})],
 tri:[
  ST_("סכום הזוויות בכל משולש הוא 180°. אם יודעים שתיים, השלישית היא 180° פחות הסכום שלהן.","مجموع زوايا أي مثلث 180°. إذا عرفنا زاويتين فالثالثة 180° ناقص مجموعهما.","Сумма углов любого треугольника 180°. Зная два угла, третий находим как 180° минус их сумма.","The angles of any triangle add up to 180°. If you know two, the third is 180° minus their sum.",function(){return triVis(50,60,["70°","50°","60°"])}),
  ST_("במשולש שווה־שוקיים שתי צלעות שוות, וגם זוויות הבסיס שוות. הסימנים האדומים מראים צלעות שוות.","في المثلث المتساوي الساقين ضلعان متساويان وزاويتا القاعدة متساويتان. العلامات الحمراء تدل على أضلاع متساوية.","В равнобедренном треугольнике две стороны равны и углы при основании равны. Красные чёрточки показывают равные стороны.","An isosceles triangle has two equal sides and equal base angles. The red marks show equal sides.",function(){return triVis(65,65,["50°","65°","65°"],{eq:[["A","B"],["A","C"]]})}),
  ST_("במשולש שווה־צלעות כל הזוויות 60°. במשולש ישר־זווית שתי הזוויות החדות מצטרפות ל-90°.","في المثلث المتساوي الأضلاع كل الزوايا 60°. في المثلث القائم الزاويتان الحادتان مجموعهما 90°.","В равностороннем треугольнике все углы по 60°. В прямоугольном два острых угла вместе дают 90°.","In an equilateral triangle every angle is 60°. In a right triangle the two acute angles add up to 90°.",function(){return triVis(60,60,["","",""],{eq:[["A","B"],["A","C"],["B","C"]]})+triVis(90,35,["","90°","35°"])}),
  ST_("במרובע סכום הזוויות הוא 360°. את המשולשים מסווגים לפי זוויות (חד, קהה, ישר) ולפי צלעות (שווה־צלעות, שווה־שוקיים, שונה־צלעות).","في الرباعي مجموع الزوايا 360°. نصنّف المثلثات حسب الزوايا (حاد ومنفرج وقائم) وحسب الأضلاع (متساوي الأضلاع ومتساوي الساقين ومختلف الأضلاع).","В четырёхугольнике сумма углов 360°. Треугольники делят по углам (остро-, тупо-, прямоугольный) и по сторонам (равносторонний, равнобедренный, разносторонний).","A quadrilateral's angles add up to 360°. Triangles are sorted by angles (acute, obtuse, right) and by sides (equilateral, isosceles, scalene).",function(){return quadVis(["90°","80°","100°","90°"])})],
 ratio:[
  ST_("יחס משווה בין שני מספרים. אם יש 2 תפוחים ו-3 תפוזים, היחס בין התפוחים לתפוזים הוא \u20662:3\u2069. כותבים עם נקודתיים.","النسبة تقارن بين عددين. إذا كان هناك تفاحتان و3 برتقالات فالنسبة بين التفاح والبرتقال \u20662:3\u2069. نكتبها بنقطتين.","Отношение сравнивает два числа. Если 2 яблока и 3 апельсина, то отношение яблок к апельсинам \u20662:3\u2069. Пишут через двоеточие.","A ratio compares two numbers. With 2 apples and 3 oranges, the ratio of apples to oranges is \u20662:3\u2069. We write it with a colon.",function(){return dotsVis(2,3,COL.red,COL.orange)}),
  ST_("הסדר חשוב. היחס בין התפוזים לתפוחים הוא \u20663:2\u2069, וזה לא אותו יחס. הדבר שנזכר ראשון נכתב ראשון.","الترتيب مهم. النسبة بين البرتقال والتفاح \u20663:2\u2069 وهي ليست النسبة نفسها. الشيء المذكور أولًا يُكتب أولًا.","Порядок важен. Отношение апельсинов к яблокам — \u20663:2\u2069, это другое отношение. Что названо первым, то и пишется первым.","Order matters. The ratio of oranges to apples is \u20663:2\u2069, which is a different ratio. What is named first is written first."),
  ST_("אפשר לצמצם יחס כמו שמצמצמים שבר. \u20666:9\u2069 מצטמצם ב-3 ל-\u20662:3\u2069. כשכופלים את שני המספרים באותו מספר מקבלים יחס שווה.","يمكن تبسيط النسبة كما نبسّط الكسر. \u20666:9\u2069 تُبسَّط بالقسمة على 3 إلى \u20662:3\u2069. وعند ضرب العددين في العدد نفسه نحصل على نسبة مساوية.","Отношение можно сократить, как дробь. \u20666:9\u2069 при делении на 3 даёт \u20662:3\u2069. Если умножить оба числа на одно число, получится равное отношение.","You can simplify a ratio like a fraction. \u20666:9\u2069 divided by 3 is \u20662:3\u2069. Multiplying both numbers by the same number gives an equal ratio."),
  ST_("מחברים את חלקי היחס כדי לדעת את השלם. ביחס \u20662:3\u2069 יש 5 חלקים, והתפוחים הם 2 מתוך 5, כלומר 2/5 מכל הפירות.","نجمع أجزاء النسبة لنعرف الكل. في النسبة \u20662:3\u2069 هناك 5 أجزاء والتفاح 2 من 5 أي 2/5 من كل الفواكه.","Складываем части отношения, чтобы узнать целое. В отношении \u20662:3\u2069 всего 5 частей, яблоки — 2 из 5, то есть 2/5 всех фруктов.","Add the parts of the ratio to get the whole. In \u20662:3\u2069 there are 5 parts, and the apples are 2 out of 5, which is 2/5 of all the fruit.")],
 prop:[
  ST_("פרופורציה היא שוויון בין שני יחסים: \u20662:3=4:6\u2069. מכפילים את שני הצדדים של היחס באותו מספר, וכך מוצאים מספר חסר.","التناسب هو تساوي نسبتين: \u20662:3=4:6\u2069. نضرب طرفي النسبة في العدد نفسه فنجد العدد الناقص.","Пропорция — это равенство двух отношений: \u20662:3=4:6\u2069. Умножаем обе части отношения на одно число и находим пропущенное.","A proportion says two ratios are equal: \u20662:3=4:6\u2069. Multiply both parts of a ratio by the same number to find a missing number."),
  ST_("כפל באלכסון: בפרופורציה המכפלות בצלב שוות. מ-\u2066x:4=6:8\u2069 מקבלים x · 8 = 4 · 6, ולכן x = 3.","الضرب بالتقاطع: في التناسب حاصلا الضرب بالتقاطع متساويان. من \u2066x:4=6:8\u2069 نحصل على x · 8 = 4 · 6 إذن x = 3.","Крест-накрест: в пропорции произведения по диагонали равны. Из \u2066x:4=6:8\u2069 получаем x · 8 = 4 · 6, значит x = 3.","Cross multiplication: in a proportion the cross products are equal. From \u2066x:4=6:8\u2069 we get x · 8 = 4 · 6, so x = 3."),
  ST_("חלוקה לפי יחס: מחברים את חלקי היחס, מחלקים את הסכום במספר החלקים, ואז כופלים. לדוגמה 40 ש״ח ביחס \u20663:5\u2069: 8 חלקים, חלק אחד 5, ולכן 15 ו-25.","التقسيم بنسبة: نجمع أجزاء النسبة ونقسم المبلغ على عدد الأجزاء ثم نضرب. مثلًا 40 شيكلًا بنسبة \u20663:5\u2069: 8 أجزاء والجزء 5 إذن 15 و25.","Деление в отношении: складываем части, делим сумму на число частей, потом умножаем. Например, 40 шекелей в отношении \u20663:5\u2069: 8 частей, одна часть 5, значит 15 и 25.","Sharing in a ratio: add the parts, divide the total by the number of parts, then multiply. For example 40 shekels in the ratio \u20663:5\u2069: 8 parts, one part is 5, so 15 and 25."),
  ST_("קנה מידה \u20661:100\u2069 אומר שכל 1 ס״מ בציור הוא 100 ס״מ, כלומר מטר אחד, במציאות. כדי לעבור לאורך אמיתי מכפילים, ולציור מחלקים.","مقياس الرسم \u20661:100\u2069 يعني أن كل 1 سم في الرسم هو 100 سم أي متر واحد في الواقع. للانتقال إلى الطول الحقيقي نضرب وللرسم نقسم.","Масштаб \u20661:100\u2069 значит, что 1 см на чертеже — это 100 см, то есть 1 метр, в реальности. К реальной длине переходим умножением, к чертежу — делением.","Scale \u20661:100\u2069 means every 1 cm in the drawing is 100 cm, or 1 meter, in real life. Multiply to get the real length and divide to get the drawing length.")],
 pow:[
  ST_("חזקה היא כפל חוזר של אותו מספר. 3² = 3 · 3 = 9. את 3 קוראים בסיס, ואת 2 מעריך.","القوة ضرب متكرر للعدد نفسه. 3² = 3 · 3 = 9. العدد 3 هو الأساس والعدد 2 هو الأس.","Степень — повторное умножение одного числа. 3² = 3 · 3 = 9. 3 — основание, 2 — показатель.","A power is repeated multiplication of the same number. 3² = 3 · 3 = 9. 3 is the base and 2 is the exponent.",function(){return sqGrid(3)}),
  ST_("ריבוע שצלעו 4 הוא 4² = 16 משבצות. לכן אומרים ״4 בריבוע״.","مربع ضلعه 4 فيه 4² = 16 مربعًا صغيرًا. لذلك نقول «4 تربيع».","Квадрат со стороной 4 состоит из 4² = 16 клеток. Поэтому говорят «4 в квадрате».","A square with side 4 has 4² = 16 small squares. That is why we say ‘4 squared’.",function(){return sqGrid(4)}),
  ST_("מעריך 3 אומר שלוש פעמים: 2³ = 2 · 2 · 2 = 8. שימו לב: 2³ אינו 2 · 3.","الأس 3 يعني ثلاث مرات: 2³ = 2 · 2 · 2 = 8. انتبهوا: 2³ لا يساوي 2 · 3.","Показатель 3 значит три раза: 2³ = 2 · 2 · 2 = 8. Внимание: 2³ — это не 2 · 3.","Exponent 3 means three times: 2³ = 2 · 2 · 2 = 8. Careful: 2³ is not 2 · 3.",function(){return ""}),
  ST_("שורש ריבועי הוא ההפך מריבוע. √25 = 5 כי 5² = 25. שורש של 30 נמצא בין 5 ל-6.","الجذر التربيعي عكس التربيع. √25 = 5 لأن 5² = 25. وجذر 30 بين 5 و6.","Квадратный корень — обратное действие к возведению в квадрат. √25 = 5, потому что 5² = 25. Корень из 30 между 5 и 6.","A square root undoes squaring. √25 = 5 because 5² = 25. The root of 30 is between 5 and 6.",function(){return sqGrid(5)})],
 pyth:[
  ST_("משולש ישר־זווית יש בו זווית אחת של 90°. שתי הצלעות שיוצרות אותה הן הניצבים. הצלע שמולה היא היתר, והיא הכי ארוכה.","المثلث القائم فيه زاوية واحدة 90°. الضلعان اللذان يكوّنانها هما القائمان، والضلع المقابل لها هو الوتر وهو الأطول.","В прямоугольном треугольнике один угол 90°. Стороны при нём — катеты. Напротив него — гипотенуза, самая длинная сторона.","A right triangle has one 90° angle. The two sides that form it are the legs. The side opposite it is the hypotenuse, and it is the longest.",function(){return rtVis(3,4,["A","B","C"],{h:"b",v:"a",c:"c"})}),
  ST_("על כל צלע אפשר לבנות ריבוע. משפט פיתגורס: שטח הריבוע על היתר שווה לסכום השטחים של שני הריבועים על הניצבים.","يمكن بناء مربع على كل ضلع. نظرية فيثاغورس: مساحة المربع على الوتر تساوي مجموع مساحتي المربعين على القائمين.","На каждой стороне можно построить квадрат. Теорема Пифагора: площадь квадрата на гипотенузе равна сумме площадей квадратов на катетах.","You can build a square on every side. Pythagoras: the area of the square on the hypotenuse equals the sum of the areas of the squares on the legs.",function(){return rtVis(3,4,null,{h:"b² = 16",v:"a² = 9",c:"c² = 25"})}),
  ST_("בכתיבה: a² + b² = c², כש-c הוא היתר. למשל 3² + 4² = 9 + 16 = 25, ולכן c = 5.","بالرموز: a² + b² = c² حيث c هو الوتر. مثلًا 3² + 4² = 9 + 16 = 25 إذن c = 5.","В записи: a² + b² = c², где c — гипотенуза. Например, 3² + 4² = 9 + 16 = 25, значит c = 5.","In symbols: a² + b² = c², where c is the hypotenuse. For example 3² + 4² = 9 + 16 = 25, so c = 5.",function(){return rtVis(3,4,null,{h:"b = 4",v:"a = 3",c:"c = 5"})}),
  ST_("אם יודעים את היתר ואחד הניצבים, מחסירים: b² = c² − a². אפשר גם לבדוק אם משולש ישר־זווית: אם a² + b² = c², כן.","إذا عرفنا الوتر وأحد القائمين نطرح: b² = c² − a². ونفحص إن كان المثلث قائمًا: إذا a² + b² = c² فنعم.","Если известны гипотенуза и катет, вычитаем: b² = c² − a². Проверка: если a² + b² = c², треугольник прямоугольный.","If you know the hypotenuse and one leg, subtract: b² = c² − a². To test a right triangle: if a² + b² = c², it is one.")],
 alg:[
  ST_("משתנה הוא אות, כמו x, שמחליפה מספר. ביטוי אלגברי הוא תרגיל עם משתנה, למשל 3x + 2.","المتغير حرف مثل x يمثل عددًا. التعبير الجبري عملية فيها متغير مثل 3x + 2.","Переменная — буква, например x, вместо числа. Алгебраическое выражение — запись с переменной, например 3x + 2.","A variable is a letter like x that stands for a number. An algebraic expression is a calculation with a variable, like 3x + 2.",function(){return ""}),
  ST_("הצבה היא לשים מספר במקום x. אם x = 4 אז 3x + 2 = 3 · 4 + 2 = 14.","التعويض هو وضع عدد مكان x. إذا كان x = 4 فإن 3x + 2 = 3 · 4 + 2 = 14.","Подстановка — вместо x ставим число. Если x = 4, то 3x + 2 = 3 · 4 + 2 = 14.","Substituting means putting a number in place of x. If x = 4 then 3x + 2 = 3 · 4 + 2 = 14.",function(){return ""}),
  ST_("אפשר לחבר רק איברים דומים: 2x + 5x = 7x. הביטוי x + x שווה 2x, ולא x².","نجمع الحدود المتشابهة فقط: 2x + 5x = 7x. التعبير x + x يساوي 2x وليس x².","Складывать можно подобные слагаемые: 2x + 5x = 7x. x + x равно 2x, а не x².","You can only add like terms: 2x + 5x = 7x. The expression x + x is 2x, not x².",function(){return ""}),
  ST_("שני ביטויים שווים אם התוצאה זהה לכל x. חוק הפילוג: 3(x + 2) = 3x + 6.","يتساوى تعبيران إذا أعطيا النتيجة نفسها لأي x. قانون التوزيع: 3(x + 2) = 3x + 6.","Два выражения равны, если дают один результат при любом x. Распределительный закон: 3(x + 2) = 3x + 6.","Two expressions are equal if they give the same result for every x. Distributive law: 3(x + 2) = 3x + 6.",function(){return ""})],
 area:[
  ST_("שטח מלבן הוא אורך כפול רוחב. מלבן 5 על 3 הוא 15 סמ״ר.","مساحة المستطيل = الطول × العرض. مستطيل 5 في 3 مساحته 15 سم².","Площадь прямоугольника — длина на ширину. Прямоугольник 5 на 3 — 15 см².","The area of a rectangle is length times width. A 5 by 3 rectangle has area 15 cm².",function(){return rectVis(5,3,[5,3])}),
  ST_("ריבוע הוא מלבן עם צלעות שוות. ריבוע שצלעו 4 הוא 16 סמ״ר.","المربع مستطيل أضلاعه متساوية. مربع ضلعه 4 مساحته 16 سم².","Квадрат — прямоугольник с равными сторонами. Квадрат со стороной 4 имеет площадь 16 см².","A square is a rectangle with equal sides. A square with side 4 has area 16 cm².",function(){return rectVis(4,4,[4,4])}),
  ST_("שטח משולש הוא בסיס כפול גובה, חלקי 2. הגובה מאונך לבסיס.","مساحة المثلث = القاعدة × الارتفاع ÷ 2. الارتفاع عمودي على القاعدة.","Площадь треугольника — основание на высоту, делённое на 2. Высота перпендикулярна основанию.","The area of a triangle is base times height, divided by 2. The height is perpendicular to the base.",function(){return triAreaVis(8,5)}),
  ST_("אם יודעים שטח ואחת הצלעות, מחלקים: אורך = שטח ÷ רוחב.","إذا عرفنا المساحة وأحد الضلعين نقسم: الطول = المساحة ÷ العرض.","Зная площадь и одну сторону, делим: длина = площадь ÷ ширина.","If you know the area and one side, divide: length = area ÷ width.",function(){return rectVis(6,4,["?",4])})],
 eq:[
  ST_("משוואה היא שוויון עם נעלם, למשל x + 3 = 8. פתרון הוא מספר שמציבים ב-x והשוויון נכון. כאן x = 5.","المعادلة تساوٍ فيه مجهول مثل x + 3 = 8. الحل عدد نضعه مكان x فيصح التساوي. هنا x = 5.","Уравнение — равенство с неизвестным, например x + 3 = 8. Решение — число, при подстановке которого равенство верно. Здесь x = 5.","An equation is an equality with an unknown, like x + 3 = 8. A solution is a number that makes it true. Here x = 5.",function(){return ""}),
