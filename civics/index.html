     en:"A temporary disagreement resolved at the next election."}],
   2,
   {he:"מה ההבדל בין ויכוח שנגמר לבין חלוקה שעוברת בירושה?",
    ar:"ما الفرق بين جدل ينتهي وانقسام يُورَّث؟",
    ru:"В чём разница между спором, который кончается, и делением, которое наследуется?",
    en:"What is the difference between an argument that ends and a division that is inherited?"},
   {he:"בישראל מקובל למנות ארבעה שסעים מרכזיים: לאומי (יהודים–ערבים), דתי (חילונים–דתיים–חרדים), עדתי (מזרחים–אשכנזים) וחברתי־כלכלי (מרכז–פריפריה, מבוססים–מוחלשים). שסעים חופפים מעמיקים את הפילוג; שסעים חוצים מרככים אותו.",
    ar:"يُعدّ في إسرائيل أربعة انقسامات مركزية: قوميّ (يهود–عرب)، دينيّ (علمانيون–متدينون–حريديم)، طائفيّ (شرقيون–أشكناز)، واجتماعيّ اقتصاديّ (مركز–أطراف، ميسورون–مستضعفون). الانقسامات المتطابقة تعمّق الشرخ، والمتقاطعة تليّنه.",
    ru:"В Израиле принято выделять четыре главных раскола: национальный (евреи–арабы), религиозный (светские–религиозные–харедим), этнический (мизрахим–ашкеназы) и социально-экономический (центр–периферия, обеспеченные–обездоленные). Совпадающие расколы углубляют раскол, пересекающиеся смягчают его.",
    en:"Israel is usually described as having four main cleavages: national (Jews–Arabs), religious (secular–religious–Haredi), ethnic (Mizrahi–Ashkenazi) and socio-economic (centre–periphery, well-off–disadvantaged). Overlapping cleavages deepen the split; crosscutting ones soften it."},
   null),
  Q("soc-local",
    {he:"מהו תפקידה של הרשות המקומית?",
     ar:"ما وظيفة السلطة المحلّية؟",
     ru:"Какова функция местного органа власти?",
     en:"What is the role of a local authority?"},
   [{he:"לספק לתושב שירותים מקומיים — חינוך, תברואה, רווחה, תכנון ובנייה — בסמכות שהוענקה לה בחוק ובפיקוח משרד הפנים.",
     ar:"تقديم خدمات محلّية للمقيم، تعليم، صحّة بيئية، رفاه، تخطيط وبناء، بصلاحية مُنحت لها بقانون وتحت رقابة وزارة الداخلية.",
     ru:"Оказывать жителю местные услуги: образование, санитарию, социальную помощь, планирование и строительство: в рамках полномочий, данных законом, под надзором МВД.",
     en:"To provide the resident with local services: education, sanitation, welfare, planning and building: under powers granted by statute and supervised by the interior ministry."},
    {he:"לחוקק חוקים מדינתיים בתחומה, שכן היא הזרוע המקומית של המחוקק ורשאית לקבוע כללים מחייבים לתושביה בכל נושא שהחוק אינו מסדיר.",
     ar:"أن تسنّ قوانين الدولة في نطاقها، إذ إنّها الذراع المحليّة للمشرّع ويحقّ لها وضع قواعد مُلزِمة لسكّانها في كلّ موضوع لا ينظّمه القانون.",
     ru:"Издавать государственные законы на своей территории, ведь она: местная рука законодателя и вправе устанавливать обязательные правила для жителей во всём, что не урегулировано законом.",
     en:"To enact state legislation within its area, since it is the legislature's local arm and may set binding rules for residents on anything the law leaves unregulated."},
    {he:"לשפוט עבירות פליליות שנעברו בתחומה בבית משפט עירוני — ולגבות מהנאשמים קנסות לפי חוקי העזר שקבעה מועצת העיר ולהעבירם לקופת המדינה.",
     ar:"أن تحاكم المخالفات الجنائية التي ارتُكبت في نطاقها أمام محكمة بلدية، وأن تجبي من المتّهمين غرامات وفق الأنظمة التي أقرّها مجلس المدينة وتحوّلها إلى خزينة الدولة.",
     ru:"Судить уголовные правонарушения на своей территории в городском суде и взыскивать с обвиняемых штрафы по правилам, принятым городским советом: перечисляя их в казну государства.",
     en:"To try criminal offences committed in its area in a municipal court and to collect fines under by-laws the city council enacted: passing them on to the state treasury."},
    {he:"לגבות מס הכנסה ולנהל את תקציב המדינה באזורה, ולהעביר לממשלה את היתרה שנותרה בתום שנת הכספים ולדווח עליה למבקר המדינה.",
     ar:"أن تجبي ضريبة الدخل وتدير ميزانية الدولة في منطقتها، وأن تحوّل إلى الحكومة الرصيد المتبقّي في نهاية السنة المالية وتبلّغ عنه مراقب الدولة.",
     ru:"Взимать подоходный налог, вести государственный бюджет в своём районе, передавать правительству остаток на конец финансового года и отчитываться о нём государственному контролёру.",
     en:"To collect income tax, run the state budget in its district, transfer the year-end balance to the government and report it to the state comptroller."}],
   0,
   {he:"מה אתם מקבלים מהעירייה, ומה מהמדינה?",
    ar:"ماذا تتلقّون من البلدية وماذا من الدولة؟",
    ru:"Что вы получаете от муниципалитета, а что от государства?",
    en:"What do you get from the municipality, and what from the state?"},
   {he:"ראש הרשות והמועצה נבחרים בבחירות מקומיות נפרדות, אחת לחמש שנים, וראש הרשות נבחר בבחירה ישירה. הרשות אינה “רשות שלטון” רביעית: היא חלק מהרשות המבצעת, ופועלת מכוח חוק ובפיקוח.",
    ar:"يُنتخب رئيس السلطة والمجلس في انتخابات محلّية منفصلة كلّ خمس سنوات، ورئيس السلطة بانتخاب مباشر. وليست السلطة المحلّية “سلطة حكم” رابعة: هي جزء من السلطة التنفيذية، تعمل بموجب القانون وتحت رقابة.",
    ru:"Глава органа и совет избираются на отдельных местных выборах раз в пять лет, а глава: прямым голосованием. Местная власть не «четвёртая ветвь»: она часть исполнительной власти, действует по закону и под надзором.",
    en:"The head of the authority and the council are elected in separate local elections every five years, the head by direct vote. A local authority is not a fourth branch of government: it is part of the executive, acting under statute and under supervision."},
   null),
  Q("soc-civilsoc",
    {he:"מהי החברה האזרחית, ומה תפקידה בדמוקרטיה?",
     ar:"ما هو المجتمع المدنيّ، وما دوره في الديمقراطية؟",
     ru:"Что такое гражданское общество и какова его роль в демократии?",
     en:"What is civil society, and what is its role in a democracy?"},
   [{he:"כלל האזרחים שהצביעו בבחירות האחרונות.",
     ar:"مجموع المواطنين الذين صوّتوا في الانتخابات الأخيرة.",
     ru:"Все граждане, голосовавшие на последних выборах.",
     en:"All the citizens who voted at the last election."},
    {he:"ארגונים התנדבותיים שאינם ממשלתיים ואינם עסקיים — עמותות, איגודים ותנועות. הם מספקים שירותים, מייצגים קבוצות ומפעילים ביקורת על השלטון.",
     ar:"منظمات تطوّعية غير حكومية وغير ربحية، جمعيات ونقابات وحركات. تقدّم خدمات وتمثّل مجموعات وتمارس رقابة على السلطة.",
     ru:"Добровольные организации, не государственные и не коммерческие, общества, союзы и движения. Они оказывают услуги, представляют группы и контролируют власть.",
     en:"Voluntary organisations that are neither governmental nor commercial: associations, unions and movements. They deliver services, represent groups and hold government to account."},
    {he:"מערכת בתי המשפט האזרחיים, להבדיל מהצבאיים.",
     ar:"منظومة المحاكم المدنية تمييزًا عن العسكرية.",
     ru:"Система гражданских судов в отличие от военных.",
     en:"The system of civil courts, as opposed to military ones."},
    {he:"משרדי הממשלה העוסקים ברווחה ובשירותים לאזרח — ובכללם משרד הרווחה, הביטוח הלאומי והמוסדות שהם מפעילים בקהילה, שכן הם הנותנים את המענה החברתי.",
     ar:"وزارات الحكومة المعنيّة بالرفاه وبالخدمات للمواطن، ومنها وزارة الرفاه والتأمين الوطنيّ والمؤسّسات التي يشغّلانها في المجتمع المحليّ، فهي التي تقدّم الاستجابة الاجتماعية.",
     ru:"Министерства, занимающиеся социальным обеспечением и услугами для граждан, министерство благосостояния, Ведомство национального страхования и учреждения, которые они содержат в общинах, ведь именно они дают социальный ответ.",
     en:"The government offices dealing with welfare and services to the citizen: the welfare ministry, national insurance and the institutions they run in the community, since they are the ones providing the social response."}],
   1,
   {he:"לא ממשלה ולא עסק. מה נשאר?",
    ar:"لا حكومة ولا مشروع تجاريّ. فماذا يبقى؟",
    ru:"Не государство и не бизнес. Что остаётся?",
    en:"Not government and not business. What is left?"},
   {he:"החברה האזרחית היא “המגזר השלישי”. היא ממלאת שלוש פונקציות דמוקרטיות: ייצוג של קבוצות שאין להן כוח פוליטי, אספקת שירותים שהמדינה אינה מספקת, וביקורת עצמאית על השלטון — ולכן חופש ההתאגדות הוא תנאי לקיומה.",
    ar:"المجتمع المدنيّ هو “القطاع الثالث”. يؤدّي ثلاث وظائف ديمقراطية: تمثيل مجموعات بلا قوّة سياسية، وتقديم خدمات لا توفّرها الدولة، ورقابة مستقلّة على السلطة، لذا حرّية التنظّم شرط لوجوده.",
    ru:"Гражданское общество: «третий сектор». Оно выполняет три демократические функции: представляет группы без политической силы, оказывает услуги, которых не даёт государство, и независимо контролирует власть: поэтому свобода объединений есть условие его существования.",
    en:"Civil society is the third sector. It performs three democratic functions: representing groups with no political power, supplying services the state does not, and exercising independent scrutiny of government: which is why freedom of association is a condition of its existence."},
   null),
  Q("sc-1-01",{"he": "מה עומד במרכז השסע הלאומי בישראל?", "ar": "ما الذي يقف في مركز الشرخ القومي في إسرائيل؟", "ru": "Что лежит в основе национального раскола в Израиле?", "en": "What is at the centre of the national cleavage in Israel?"},[{"he": "הפער בין עשירים לעניים.", "ar": "الفجوة بين الأغنياء والفقراء.", "ru": "Разрыв между богатыми и бедными.", "en": "The gap between rich and poor."}, {"he": "היחסים בין הרוב היהודי לבין המיעוט הערבי.", "ar": "العلاقات بين الأغلبية اليهودية والأقلية العربية.", "ru": "Отношения между еврейским большинством и арабским меньшинством.", "en": "The relations between the Jewish majority and the Arab minority."}, {"he": "הוויכוח בין דתיים לחילונים על מקומה של הדת בחיים הציבוריים ובחקיקה.", "ar": "الخلاف بين المتديّنين والعلمانيين حول مكانة الدين في الحياة العامة وفي التشريع.", "ru": "Спор между религиозными и светскими о месте религии в общественной жизни и в законах.", "en": "The dispute between religious and secular people over religion's place in public life and legislation."}, {"he": "היחסים בין עולים חדשים לוותיקים.", "ar": "العلاقات بين المهاجرين الجدد والقدامى.", "ru": "Отношения между новыми репатриантами и старожилами.", "en": "The relations between new immigrants and veteran residents."}],1,{"he": "השם של השסע רומז על סוג הזהות.", "ar": "اسم الشرخ يلمّح إلى نوع الهوية.", "ru": "Название раскола подсказывает тип идентичности.", "en": "The cleavage's name hints at the type of identity."},{"he": "השסע הלאומי הוא החלוקה בין שתי קבוצות לאום: הרוב היהודי והמיעוט הערבי. הוא נחשב לשסע העמוק בחברה הישראלית. הוא קשור גם לסכסוך הישראלי־ערבי.", "ar": "الشرخ القومي هو الانقسام بين مجموعتين قوميتين: الأغلبية اليهودية والأقلية العربية. ويُعَدّ الشرخ الأعمق في المجتمع الإسرائيلي. وهو مرتبط أيضًا بالصراع الإسرائيلي العربي.", "ru": "Национальный раскол — это деление между двумя национальными группами: еврейским большинством и арабским меньшинством. Он считается самым глубоким расколом в израильском обществе. Он связан и с израильско-арабским конфликтом.", "en": "The national cleavage is the division between two national groups: the Jewish majority and the Arab minority. It is seen as the deepest cleavage in Israeli society. It is also linked to the Israeli-Arab conflict."},null),
  Q("sc-1-02",{"he": "מי בוחר את ראש העירייה בישראל?", "ar": "مَن ينتخب رئيس البلدية في إسرائيل؟", "ru": "Кто выбирает мэра в Израиле?", "en": "Who elects the mayor in Israel?"},[{"he": "תושבי העיר, בבחירות ישירות.", "ar": "سكّان المدينة، في انتخابات مباشرة.", "ru": "Жители города, на прямых выборах.", "en": "The city's residents, in direct elections."}, {"he": "חברי מועצת העיר, מתוך עצמם.", "ar": "أعضاء مجلس المدينة، من بينهم.", "ru": "Члены городского совета, из своего состава.", "en": "The members of the city council, from among themselves."}, {"he": "שר הפנים ממנה אותו, אחרי התייעצות עם חברי הכנסת מהאזור ועם המועצה הנבחרת.", "ar": "وزير الداخلية يعيّنه بعد التشاور مع أعضاء الكنيست من المنطقة ومع المجلس المنتخب.", "ru": "Министр внутренних дел назначает его после консультаций с депутатами Кнессета от региона и с избранным советом.", "en": "The interior minister appoints him after consulting the region's Knesset members and the elected council."}, {"he": "הממשלה, בהצבעה בישיבה שלה.", "ar": "الحكومة، بتصويت في جلستها.", "ru": "Правительство, голосованием на своём заседании.", "en": "The government, by a vote at its meeting."}],0,{"he": "חשבו ממי ראש העירייה מקבל את הסמכות שלו.", "ar": "فكّروا ممّن يستمدّ رئيس البلدية صلاحيته.", "ru": "Подумайте, от кого мэр получает свои полномочия.", "en": "Think about where the mayor gets his authority from."},{"he": "מאז 1978 ראש העירייה נבחר בבחירות ישירות ואישיות של תושבי העיר. הבחירה בו נפרדת מהבחירה במועצה. כך יש לו מקור סמכות משלו מול המועצה.", "ar": "منذ عام 1978 يُنتخب رئيس البلدية في انتخابات مباشرة وشخصية من سكّان المدينة. وانتخابه منفصل عن انتخاب المجلس. وبذلك يكون له مصدر صلاحية خاص أمام المجلس.", "ru": "С 1978 года мэра выбирают жители города на прямых персональных выборах. Эти выборы отделены от выборов совета. Так у мэра есть свой источник власти перед советом.", "en": "Since 1978 the mayor has been chosen in direct, personal elections by the city's residents. This vote is separate from the council vote. So the mayor has his own source of authority facing the council."},null),
  Q("sc-1-03",{"he": "מה תפקידה של מועצת העירייה?", "ar": "ما دور مجلس البلدية؟", "ru": "Какова роль городского совета?", "en": "What is the role of the city council?"},[{"he": "לשפוט תושבים שעברו על החוק.", "ar": "محاكمة السكّان الذين خالفوا القانون.", "ru": "Судить жителей, нарушивших закон.", "en": "To try residents who broke the law."}, {"he": "לחוקק חוקים לכל המדינה.", "ar": "سنّ قوانين للدولة كلّها.", "ru": "Принимать законы для всей страны.", "en": "To pass laws for the whole country."}, {"he": "לפקח על בתי הספר בכל הארץ, לקבוע את תוכנית הלימודים ולמנות את המנהלים.", "ar": "الإشراف على المدارس في كلّ البلاد، وتحديد المنهاج الدراسي وتعيين المديرين.", "ru": "Надзирать за школами всей страны, утверждать учебную программу и назначать директоров.", "en": "To supervise schools across the country, set the curriculum and appoint principals."}, {"he": "לאשר את תקציב העיר ואת חוקי העזר שלה.", "ar": "إقرار ميزانية المدينة وقوانينها المساعدة.", "ru": "Утверждать бюджет города и его подзаконные акты.", "en": "To approve the city's budget and its bylaws."}],3,{"he": "זה גוף נבחר שפועל רק בתחום העיר.", "ar": "إنّه هيئة منتخبة تعمل داخل حدود المدينة فقط.", "ru": "Это выборный орган, который действует только в пределах города.", "en": "It is an elected body that acts only within the city."},{"he": "מועצת העירייה נבחרת בידי התושבים. היא מאשרת את התקציב, קובעת חוקי עזר ומפקחת על ראש העירייה. היא פועלת בתחום העיר ובפיקוח משרד הפנים.", "ar": "يُنتخب مجلس البلدية من قِبل السكّان. وهو يقرّ الميزانية ويضع القوانين المساعدة ويراقب رئيس البلدية. ويعمل داخل حدود المدينة وتحت رقابة وزارة الداخلية.", "ru": "Городской совет избирают жители. Он утверждает бюджет, принимает подзаконные акты и контролирует мэра. Он действует в пределах города под надзором МВД.", "en": "The city council is elected by the residents. It approves the budget, sets bylaws and oversees the mayor. It acts within the city, under the interior ministry's supervision."},null),
  Q("sc-1-04",{"he": "איזה מהגופים הבאים שייך לחברה האזרחית?", "ar": "أيّ من الهيئات التالية ينتمي إلى المجتمع المدني؟", "ru": "Какая из следующих организаций относится к гражданскому обществу?", "en": "Which of the following bodies belongs to civil society?"},[{"he": "משרד הרווחה.", "ar": "وزارة الرفاه.", "ru": "Министерство социального обеспечения.", "en": "The welfare ministry."}, {"he": "חברה פרטית שמוכרת מזון לסופרמרקטים ומחלקת רווחים לבעלי המניות שלה.", "ar": "شركة خاصة تبيع الطعام للمتاجر الكبرى وتوزّع الأرباح على المساهمين فيها.", "ru": "Частная компания, которая продаёт продукты супермаркетам и распределяет прибыль среди акционеров.", "en": "A private company that sells food to supermarkets and pays profits to its shareholders."}, {"he": "עמותת מתנדבים שמחלקת מזון למשפחות במצוקה.", "ar": "جمعية متطوّعين توزّع الطعام على العائلات المحتاجة.", "ru": "Волонтёрская организация, которая раздаёт продукты нуждающимся семьям.", "en": "A volunteer association that gives food to families in need."}, {"he": "משטרת ישראל.", "ar": "شرطة إسرائيل.", "ru": "Полиция Израиля.", "en": "The Israel Police."}],2,{"he": "חשבו מי הקים כל אחד מהגופים, ולשם מה הוא פועל.", "ar": "فكّروا: مَن أنشأ كلّ واحدة من الهيئات، ولأيّ غاية تعمل؟", "ru": "Подумайте, кто создал каждую из организаций и ради чего она работает.", "en": "Think about who set up each body, and what it works for."},{"he": "החברה האזרחית כוללת ארגונים שאינם ממשלתיים ואינם עסקיים. עמותת מתנדבים היא דוגמה טובה. משרד ממשלתי ומשטרה הם חלק מהמדינה, וחברה פרטית שייכת לשוק.", "ar": "يشمل المجتمع المدني منظّمات غير حكومية وغير تجارية. وجمعية المتطوّعين مثال جيّد. أمّا الوزارة والشرطة فهما جزء من الدولة، والشركة الخاصة تنتمي إلى السوق.", "ru": "Гражданское общество включает организации, которые не государственные и не коммерческие. Волонтёрская организация — хороший пример. Министерство и полиция — часть государства, а частная компания относится к рынку.", "en": "Civil society includes organisations that are neither governmental nor commercial. A volunteer association is a good example. A ministry and the police are part of the state, and a private company belongs to the market."},null)
 ],
 [ /* רמה 2 — הבנה */
  Q("soc-case1",
    {he:"מדוע נאמר ששסעים “חוצים” מחלישים את הקיטוב בחברה?",
     ar:"لماذا يُقال إن الانقسامات “المتقاطعة” تُضعف الاستقطاب في المجتمع؟",
     ru:"Почему говорят, что «пересекающиеся» расколы ослабляют поляризацию в обществе?",
     en:"Why are crosscutting cleavages said to weaken polarisation in a society?"},
   [{he:"מפני ששסע חוצה מבטל את השסעים האחרים.",
     ar:"لأن الانقسام المتقاطع يلغي سائر الانقسامات.",
     ru:"Потому что пересекающийся раскол упраздняет прочие.",
     en:"Because a crosscutting cleavage abolishes the other cleavages."},
    {he:"מפני שאדם נמצא באותה קבוצה בכל השסעים — למשל מיעוט גם בדת, גם בלאום וגם במעמד — וכך הקבוצות מתחזקות והזהות המשותפת מקטינה את הקיטוב.",
     ar:"لأنّ الإنسان يقع في المجموعة ذاتها في كلّ الشقوق، أقلّية في الدين وفي القومية وفي المكانة معًا، فتقوى المجموعات وتقلّل الهوية المشتركة من الاستقطاب.",
     ru:"Потому что человек оказывается в одной и той же группе по всем расколам: меньшинство и по религии, и по национальности, и по статусу, так группы крепнут, а общая идентичность снижает поляризацию.",
     en:"Because a person falls in the same group in every cleavage: a minority in religion, in nationality and in class alike, so the groups grow stronger and the shared identity reduces polarisation."},
    {he:"מפני שאדם יכול להיות ברוב בשסע אחד ובמיעוט בשסע אחר, ולכן אין מחנה קבוע שכל הזהויות שלו חופפות — וזה מקשה על עוינות מוחלטת בין קבוצות.",
     ar:"لأن الفرد قد يكون في الأغلبية في انقسام وفي الأقلية في آخر، فلا يوجد معسكر ثابت تتطابق فيه كلّ هويّاته، وهذا يعسّر العداء المطلق بين المجموعات.",
     ru:"Потому что человек может быть в большинстве по одному расколу и в меньшинстве по другому, и нет постоянного лагеря, где все его идентичности совпадают, а это затрудняет абсолютную вражду между группами.",
     en:"Because a person can be in the majority on one cleavage and in the minority on another, so there is no fixed camp in which all their identities coincide: which makes outright hostility between groups harder."},
    {he:"מפני ששסע חוצה מחליף מחלוקת ערכית במחלוקת כלכלית.",
     ar:"لأنّ الشقّ المتقاطع يستبدل خلافًا قيميًّا بخلاف اقتصاديّ.",
     ru:"Потому что пересекающийся раскол заменяет ценностный спор экономическим.",
     en:"Because a crosscutting cleavage replaces a values dispute with an economic one."}],
   2,
   {he:"אדם אחד יכול להשתייך לכמה קבוצות. מה קורה כשההשתייכויות אינן חופפות?",
    ar:"قد ينتمي الفرد إلى مجموعات عدّة. ماذا يحدث حين لا تتطابق الانتماءات؟",
    ru:"Один человек может принадлежать к нескольким группам. Что если принадлежности не совпадают?",
    en:"One person can belong to several groups. What happens when the belongings do not coincide?"},
   {he:"שסעים חופפים — שבהם אותה קבוצה נמצאת תמיד באותו צד — הם המסוכנים ביותר ליציבות. לכן מדיניות של תעסוקה משותפת, שירות משותף ומגורים מעורבים נחשבת ממתנת: היא יוצרת השתייכויות חוצות.",
    ar:"الانقسامات المتطابقة، حيث تقف المجموعة ذاتها دائمًا في الجانب نفسه، أخطرها على الاستقرار. لذلك تُعدّ سياسات التشغيل المشترك والخدمة المشتركة والسكن المختلط مهدّئة: تخلق انتماءات متقاطعة.",
    ru:"Совпадающие расколы, где одна и та же группа всегда на одной стороне, опаснее всего для стабильности. Поэтому политика совместной занятости, совместной службы и смешанного проживания считается смягчающей: она создаёт пересекающиеся принадлежности.",
    en:"Overlapping cleavages: where the same group is always on the same side: are the most dangerous to stability. That is why policies of shared employment, shared service and mixed neighbourhoods are seen as moderating: they create crosscutting affiliations."},
   null),
  Q("soc-case2",
    {he:"ראש עיר סירב להקצות מגרש לעמותה שמבקרת אותו, אף שהיא עומדת בכל הקריטריונים. מהי העילה המנהלית לפסילת ההחלטה?",
     ar:"رفض رئيس بلدية تخصيص قطعة أرض لجمعية تنتقده رغم استيفائها كلّ المعايير. ما السبب الإداريّ لإبطال القرار؟",
     ru:"Мэр отказался выделить участок организации, которая его критикует, хотя она отвечает всем критериям. Каково административное основание отменить решение?",
     en:"A mayor refused to allocate a plot to an association that criticises him, although it meets every criterion. What administrative ground voids the decision?"},
   [{he:"שיקולים זרים ופגיעה בשוויון: רשות מנהלית חייבת להחליט לפי אמות מידה ענייניות, ולא לפי יחסה לעותר.",
     ar:"اعتبارات دخيلة ومساس بالمساواة: على السلطة الإدارية أن تقرّر وفق معايير موضوعية لا وفق موقفها من مقدّم الطلب.",
     ru:"Посторонние соображения и нарушение равенства: административный орган обязан решать по предметным критериям, а не по своему отношению к заявителю.",
     en:"Extraneous considerations and breach of equality: an administrative authority must decide by relevant criteria, not by its attitude to the applicant."},
    {he:"אין עילה: הקצאת מגרש נתונה לשיקול דעתו של ראש העיר, ובית המשפט אינו מתערב בשיקוליו של נבחר ציבור שנבחר בקולות התושבים.",
     ar:"لا سبب للإبطال: تخصيص القسيمة متروك لتقدير رئيس البلدية، والمحكمة لا تتدخّل في اعتبارات منتخَب حصل على أصوات السكّان.",
     ru:"Основания нет: выделение участка отдано на усмотрение мэра, и суд не вмешивается в соображения избранника, получившего голоса жителей.",
     en:"There is no ground: allocating a plot is within the mayor's discretion, and the court does not interfere with the considerations of an official the residents elected."},
    {he:"העילה היא שהעמותה לא פנתה קודם למשרד הפנים.",
     ar:"السبب أن الجمعية لم تتوجّه أولًا إلى وزارة الداخلية.",
     ru:"Основание в том, что организация не обратилась сперва в МВД.",
     en:"The ground is that the association did not first apply to the interior ministry."},
    {he:"העילה היא שראש העיר לא נבחר ברוב מוחלט.",
     ar:"السبب أن رئيس البلدية لم يُنتخب بأغلبية مطلقة.",
     ru:"Основание в том, что мэр не избран абсолютным большинством.",
     en:"The ground is that the mayor was not elected by an absolute majority."}],
   0,
   {he:"על מה בדיוק התבססה ההחלטה — על הקריטריונים, או על משהו אחר?",
    ar:"على ماذا استند القرار بالضبط، على المعايير أم على شيء آخر؟",
    ru:"На чём именно основано решение: на критериях или на чём-то ином?",
    en:"What exactly did the decision rest on: the criteria, or something else?"},
   {he:"עילות הביקורת המנהליות המרכזיות הן חריגה מסמכות, שיקולים זרים, חוסר סבירות קיצוני, הפליה, ניגוד עניינים ופגיעה בזכות הטיעון. הן חלות על כל רשות ציבורית, ובכלל זה על רשות מקומית.",
    ar:"أبرز أسباب الرقابة الإدارية: تجاوز الصلاحية، اعتبارات دخيلة، لا معقولية متطرّفة، تمييز، تضارب مصالح، والمساس بحقّ الادّعاء. وتسري على كلّ سلطة عامّة، ومنها السلطة المحلّية.",
    ru:"Главные основания административного контроля: превышение полномочий, посторонние соображения, крайняя неразумность, дискриминация, конфликт интересов и нарушение права быть выслушанным. Они относятся к любому публичному органу, включая местный.",
    en:"The main grounds of administrative review are excess of authority, extraneous considerations, extreme unreasonableness, discrimination, conflict of interest and denial of the right to be heard. They apply to every public authority, local authorities included."},
   null),
  Q("soc-case3",
    {he:"תושבי שכונה בפריפריה מגלים שהתקציב לחוגים בשכונתם קטן פי שלושה מזה שבשכונה מבוססת באותה עיר. איזו טענה אזרחית עומדת לרשותם?",
     ar:"يكتشف سكّان حيّ في الأطراف أن ميزانية النشاطات في حيّهم أقلّ بثلاثة أضعاف من حيّ ميسور في المدينة ذاتها. أيّ ادّعاء مدنيّ متاح لهم؟",
     ru:"Жители периферийного квартала обнаружили, что бюджет кружков у них втрое меньше, чем в благополучном квартале того же города. Какой гражданский довод у них есть?",
     en:"Residents of a peripheral neighbourhood discover that the budget for after-school activities there is a third of that in a well-off neighbourhood of the same city. What civic claim is open to them?"},
   [{he:"אין להם טענה — חלוקת התקציב היא עניין פוליטי בלבד, והמועצה שנבחרה בקולות התושבים רשאית להעדיף שכונות שבהן שיעור ההשתתפות בחוגים גבוה.",
     ar:"لا ادّعاء لديهم، توزيع الميزانية شأن سياسيّ فقط، والمجلس المنتخَب بأصوات السكّان يحقّ له تفضيل أحياء تكون فيها نسبة المشاركة في الدورات مرتفعة.",
     ru:"Претензии у них нет: распределение бюджета: сугубо политический вопрос, и совет, избранный голосами жителей, вправе предпочесть районы с высоким участием в кружках.",
     en:"They have no claim: dividing the budget is a purely political matter, and a council elected by the residents may prefer neighbourhoods where participation in the classes is high."},
    {he:"טענה לפגיעה בשוויון בהקצאת משאבים ציבוריים, ולעיתים גם טענה לזכות חברתית — חינוך; אם ההבדל אינו נשען על שוני רלוונטי, זו הפליה.",
     ar:"ادّعاء بمساس بالمساواة في تخصيص الموارد العامّة، وأحيانًا بحقّ اجتماعيّ، التعليم؛ وإن لم يستند الفارق إلى شيء ذي صلة فهو تمييز.",
     ru:"Довод о нарушении равенства в распределении публичных ресурсов, а иногда и о социальном праве: образовании; если различие не опирается на релевантное отличие, это дискриминация.",
     en:"A claim of unequal allocation of public resources, and sometimes of a social right: education; if the difference rests on no relevant distinction, it is discrimination."},
    {he:"טענה לפגיעה בחופש העיסוק של מדריכי החוגים בשכונה, שכן צמצום התקציב מקטין את מספר המשרות הפנויות ופוגע בפרנסתם הקבועה לאורך זמן.",
     ar:"ادّعاء بالمسّ بحرّية عمل مرشدي الدورات في الحيّ، إذ إنّ تقليص الميزانية يقلّل عدد الوظائف المتاحة ويضرّ برزقهم الثابت على مدى الزمن.",
     ru:"Претензия о нарушении свободы занятий у руководителей кружков в районе, ведь урезание бюджета сокращает число свободных ставок и надолго бьёт по их постоянному заработку.",
     en:"A claim of harm to the freedom of occupation of the neighbourhood's instructors, since the budget cut reduces the posts available and lastingly damages their steady livelihood."},
    {he:"טענה שהעירייה חרגה מסמכותה בכך שהפעילה חוגים בכלל, שכן חינוך בלתי פורמלי אינו נמנה עם שירותי החובה המנויים בפקודת העיריות.",
     ar:"ادّعاء بأنّ البلدية تجاوزت صلاحيتها بتشغيلها الدورات أصلًا، إذ إنّ التعليم غير النظاميّ ليس ضمن الخدمات الإلزامية المذكورة في أمر البلديات.",
     ru:"Утверждение, что мэрия превысила полномочия, вообще открыв кружки, ведь неформальное образование не входит в число обязательных услуг, перечисленных в Указе о муниципалитетах.",
     en:"A claim that the municipality exceeded its powers by running classes at all, since non-formal education is not among the mandatory services listed in the municipalities ordinance."}],
   1,
   {he:"האם יש שוני רלוונטי בין הילדים בשתי השכונות?",
    ar:"أثمّة فارق ذو صلة بين أطفال الحيّين؟",
    ru:"Есть ли релевантное отличие между детьми двух кварталов?",
    en:"Is there a relevant difference between the children of the two neighbourhoods?"},
   {he:"השסע החברתי־כלכלי מתבטא בדיוק כאן: לא רק בהכנסה, אלא בנגישות לשירות ציבורי. הדרישה לשוויון בהקצאה חלה על המדינה ועל הרשות המקומית כאחת, וניתן לתקוף הפרה שלה בעתירה מנהלית.",
    ar:"يتجلّى الانقسام الاجتماعيّ الاقتصاديّ هنا بالضبط: ليس في الدخل فحسب بل في إتاحة الخدمة العامّة. ومطلب المساواة في التخصيص يسري على الدولة والسلطة المحلّية معًا، ويمكن الطعن في خرقه بالتماس إداريّ.",
    ru:"Социально-экономический раскол проявляется именно здесь: не только в доходе, но и в доступе к публичной услуге. Требование равенства при распределении относится и к государству, и к местной власти, а нарушение можно оспорить административным иском.",
    en:"The socio-economic cleavage shows itself exactly here: not only in income, but in access to public service. The demand for equality in allocation binds the state and the local authority alike, and a breach can be challenged by an administrative petition."},
   null),
  Q("sc-2-01",{"he": "בעיר מתווכחים אם לפתוח מרכזי קניות בשבת. לאיזה שסע שייך הוויכוח?", "ar": "يتجادلون في مدينة حول فتح المراكز التجارية يوم السبت. إلى أيّ شرخ ينتمي هذا الخلاف؟", "ru": "В городе спорят, открывать ли торговые центры в субботу. К какому расколу относится спор?", "en": "A city is debating whether to open shopping centres on Saturday. Which cleavage does the debate belong to?"},[{"he": "השסע הדתי־חילוני.", "ar": "الشرخ الديني العلماني.", "ru": "Религиозно-светский раскол.", "en": "The religious-secular cleavage."}, {"he": "השסע העדתי.", "ar": "الشرخ الطائفي.", "ru": "Этнический раскол между общинами.", "en": "The ethnic cleavage."}, {"he": "השסע הכלכלי־חברתי, כי מדובר בפרנסה של בעלי החנויות ובהכנסות של העירייה.", "ar": "الشرخ الاجتماعي الاقتصادي، لأنّ الأمر يتعلّق برزق أصحاب المحلّات وبدخل البلدية.", "ru": "Социально-экономический раскол, ведь речь идёт о заработке владельцев магазинов и доходах мэрии.", "en": "The socioeconomic cleavage, because it concerns shop owners' income and the city's revenue."}, {"he": "השסע הלאומי.", "ar": "الشرخ القومي.", "ru": "Национальный раскол.", "en": "The national cleavage."}],0,{"he": "מה מייחד את היום הזה בשבוע?", "ar": "ما الذي يميّز هذا اليوم من الأسبوع؟", "ru": "Чем особенен этот день недели?", "en": "What is special about this day of the week?"},{"he": "הוויכוח הוא על אופי השבת במרחב הציבורי. זו שאלה של מקום הדת בחיים המשותפים. לכן הוא שייך לשסע הדתי־חילוני, גם אם יש לו צד כלכלי.", "ar": "الخلاف حول طابع السبت في الحيّز العامّ. وهذه مسألة مكانة الدين في الحياة المشتركة. لذلك ينتمي إلى الشرخ الديني العلماني، حتى لو كان له جانب اقتصادي.", "ru": "Спор идёт о характере субботы в общественном пространстве. Это вопрос о месте религии в общей жизни. Поэтому он относится к религиозно-светскому расколу, даже если у него есть экономическая сторона.", "en": "The debate is about the character of Saturday in public space. That is a question of religion's place in shared life. So it belongs to the religious-secular cleavage, even if it has an economic side."},null),
  Q("sc-2-02",{"he": "בשנות ה-90 עלו לישראל כמיליון עולים מברית המועצות לשעבר. הם הקימו עיתונים ברוסית ומפלגות משלהם. מה זה ממחיש?", "ar": "في التسعينيات هاجر إلى إسرائيل نحو مليون مهاجر من الاتحاد السوفييتي السابق. وأقاموا صحفًا بالروسية وأحزابًا خاصة بهم. ماذا يوضّح ذلك؟", "ru": "В 1990-е годы в Израиль приехало около миллиона репатриантов из бывшего СССР. Они создали газеты на русском и свои партии. Что это показывает?", "en": "In the 1990s about a million immigrants came to Israel from the former Soviet Union. They founded Russian-language newspapers and their own parties. What does this show?"},[{"he": "שהעולים סירבו ללמוד עברית.", "ar": "أنّ المهاجرين رفضوا تعلّم العبرية.", "ru": "Что репатрианты отказывались учить иврит.", "en": "That the immigrants refused to learn Hebrew."}, {"he": "שאין בישראל חופש עיתונות.", "ar": "أنّه لا توجد حرية صحافة في إسرائيل.", "ru": "Что в Израиле нет свободы прессы.", "en": "That Israel has no freedom of the press."}, {"he": "ששסע העולים־ותיקים יכול להתבטא במוסדות ובייצוג משלהם.", "ar": "أنّ شرخ المهاجرين والقدامى قد يتجلّى في مؤسسات وتمثيل خاص بهم.", "ru": "Что раскол между репатриантами и старожилами может выражаться в своих учреждениях и представительстве.", "en": "That the immigrant-veteran cleavage can show itself in separate institutions and representation."}, {"he": "שהעולים היו חייבים לפי החוק להקים מפלגה נפרדת, כי אסור להם להצטרף למפלגות הוותיקות.", "ar": "أنّ المهاجرين كانوا ملزَمين قانونًا بإقامة حزب منفصل، لأنّه يُمنع عليهم الانضمام إلى الأحزاب القديمة.", "ru": "Что по закону репатрианты были обязаны создать отдельную партию, ведь им запрещено вступать в старые партии.", "en": "That by law the immigrants had to found a separate party, because they may not join the established parties."}],2,{"he": "שאלו: מה הקבוצה בנתה לעצמה, ולמה?", "ar": "اسألوا: ماذا بنت المجموعة لنفسها، ولماذا؟", "ru": "Спросите: что группа создала для себя и зачем?", "en": "Ask: what did the group build for itself, and why?"},{"he": "עלייה גדולה יוצרת קבוצה עם שפה, תרבות וצרכים משותפים. כשהקבוצה מקימה עיתונים ומפלגות, השסע מקבל ביטוי מוסדי ופוליטי. אין חוק שמחייב עולים להקים מפלגה נפרדת.", "ar": "الهجرة الكبيرة تُنشئ مجموعة ذات لغة وثقافة واحتياجات مشتركة. وعندما تقيم المجموعة صحفًا وأحزابًا، يحصل الشرخ على تعبير مؤسسي وسياسي. ولا يوجد قانون يُلزم المهاجرين بإقامة حزب منفصل.", "ru": "Большая алия создаёт группу с общим языком, культурой и нуждами. Когда группа основывает газеты и партии, раскол получает институциональное и политическое выражение. Нет закона, обязывающего репатриантов создавать отдельную партию.", "en": "A large wave of immigration creates a group with a shared language, culture and needs. When the group founds newspapers and parties, the cleavage gains an institutional and political expression. No law requires immigrants to form a separate party."},null),
  Q("sc-2-03",{"he": "בבחירות לעירייה כל בוחר מכניס למעטפות שני פתקים. למה?", "ar": "في انتخابات البلدية يضع كلّ ناخب ورقتين في المغلّفات. لماذا؟", "ru": "На выборах в мэрию каждый избиратель кладёт в конверты два бюллетеня. Почему?", "en": "In a city election each voter puts two ballots into envelopes. Why?"},[{"he": "פתק אחד לראש העיר ופתק שני לסגנו.", "ar": "ورقة لرئيس البلدية وورقة ثانية لنائبه.", "ru": "Один бюллетень за мэра, второй — за его заместителя.", "en": "One ballot for the mayor and another for his deputy."}, {"he": "פתק אחד לראש העירייה, ופתק שני לרשימה למועצה.", "ar": "ورقة لرئيس البلدية، وورقة ثانية لقائمة المجلس.", "ru": "Один бюллетень за мэра, второй — за список в совет.", "en": "One ballot for the mayor, and a second for a council list."}, {"he": "פתק אחד לכנסת ופתק אחד לעירייה, כי שתי הבחירות נערכות תמיד באותו יום ובאותה קלפי.", "ar": "ورقة للكنيست وورقة للبلدية، لأنّ الانتخابين يجريان دائمًا في اليوم نفسه وفي الصندوق نفسه.", "ru": "Один бюллетень в Кнессет, другой в мэрию, потому что оба голосования всегда проходят в один день и на одном участке.", "en": "One ballot for the Knesset and one for the city, because both votes are always held on the same day at the same booth."}, {"he": "שני פתקים לשני מועמדים לראשות העיר, לפי סדר עדיפות.", "ar": "ورقتان لمرشّحَين لرئاسة البلدية، حسب ترتيب الأفضلية.", "ru": "Два бюллетеня за двух кандидатов в мэры, по порядку предпочтения.", "en": "Two ballots for two mayoral candidates, in order of preference."}],1,{"he": "ברשות המקומית יש שני גופים נבחרים.", "ar": "في السلطة المحلّية هيئتان منتخبتان.", "ru": "В местном органе власти два выборных органа.", "en": "A local authority has two elected bodies."},{"he": "בבחירות לעירייה בוחרים בנפרד בראש העירייה ובחברי המועצה. לכן יש פתק לכל אחד מהם. הבחירות לכנסת ולרשויות המקומיות נערכות בדרך כלל במועדים שונים.", "ar": "في انتخابات البلدية يُنتخب رئيس البلدية وأعضاء المجلس بشكل منفصل. لذلك هناك ورقة لكلّ منهما. وتجري انتخابات الكنيست والسلطات المحلّية عادةً في مواعيد مختلفة.", "ru": "На выборах в мэрию мэра и членов совета выбирают отдельно. Поэтому для каждого есть свой бюллетень. Выборы в Кнессет и в местные органы обычно проходят в разные даты.", "en": "In a city election the mayor and the council members are chosen separately. So there is a ballot for each. Knesset and local elections are usually held on different dates."},null),
  Q("sc-2-04",{"he": "בעיר מסוימת ההכנסה הממוצעת בשכונה א' גבוהה פי 2 מבשכונה ב'. גם שיעור הזכאות לבגרות בשכונה א' גבוה יותר. איזה שסע הנתונים מתארים?", "ar": "في مدينة ما، متوسّط الدخل في الحيّ أ أعلى بمرّتين منه في الحيّ ب. ونسبة الاستحقاق للبجروت في الحيّ أ أعلى أيضًا. أيّ شرخ تصفه المعطيات؟", "ru": "В одном городе средний доход в районе А вдвое выше, чем в районе Б. И доля получающих аттестат зрелости в районе А тоже выше. Какой раскол описывают данные?", "en": "In one city, average income in neighbourhood A is twice that of neighbourhood B. The bagrut pass rate in A is also higher. Which cleavage do the data describe?"},[{"he": "השסע הלאומי.", "ar": "الشرخ القومي.", "ru": "Национальный раскол.", "en": "The national cleavage."}, {"he": "השסע העדתי, כי פערים בהכנסה נובעים תמיד ממוצא המשפחה ולא מסיבות אחרות.", "ar": "الشرخ الطائفي، لأنّ فجوات الدخل تنبع دائمًا من أصل العائلة وليس من أسباب أخرى.", "ru": "Этнический раскол, потому что разрыв в доходах всегда вызван происхождением семьи, а не другими причинами.", "en": "The ethnic cleavage, because income gaps always come from family origin and never from other causes."}, {"he": "השסע הדתי־חילוני.", "ar": "الشرخ الديني العلماني.", "ru": "Религиозно-светский раскол.", "en": "The religious-secular cleavage."}, {"he": "השסע הכלכלי־חברתי.", "ar": "الشرخ الاجتماعي الاقتصادي.", "ru": "Социально-экономический раскол.", "en": "The socioeconomic cleavage."}],3,{"he": "חשבו אילו מדדים מופיעים בנתונים, ולאיזה תחום בחיים הם שייכים.", "ar": "فكّروا: أيّ مؤشّرات تظهر في المعطيات، وإلى أيّ مجال في الحياة تنتمي؟", "ru": "Подумайте, какие показатели приведены в данных и к какой сфере жизни они относятся.", "en": "Think about which measures appear in the data, and which area of life they belong to."},{"he": "הכנסה והשכלה הם מדדים של מעמד כלכלי־חברתי. פער קבוע בהם בין קבוצות הוא סימן לשסע הכלכלי־חברתי. לעיתים השסע הזה חופף לשסעים אחרים, אבל לא תמיד.", "ar": "الدخل والتعليم مؤشّران على المكانة الاجتماعية الاقتصادية. والفجوة الثابتة فيهما بين المجموعات علامة على الشرخ الاجتماعي الاقتصادي. وأحيانًا يتداخل هذا الشرخ مع شروخ أخرى، لكن ليس دائمًا.", "ru": "Доход и образование — показатели социально-экономического положения. Устойчивый разрыв в них между группами — признак социально-экономического раскола. Иногда он совпадает с другими расколами, но не всегда.", "en": "Income and education are measures of socioeconomic status. A lasting gap in them between groups signals the socioeconomic cleavage. Sometimes it overlaps other cleavages, but not always."},null)
 ],
 [ /* רמה 3 — ניתוח */
  Q("soc-anal1",
    {he:"מהו “רב־תרבותיות”, ומהי הביקורת המרכזית עליו?",
     ar:"ما هي “التعدّدية الثقافية”، وما النقد المركزيّ لها؟",
     ru:"Что такое мультикультурализм и какова главная критика в его адрес?",
     en:"What is multiculturalism, and what is the main criticism of it?"},
   [{he:"תפיסה שלפיה על המדינה למחוק הבדלים תרבותיים לטובת תרבות אחת משותפת — בחינוך, בשפה ובסמלים. הביקורת: כור היתוך כזה נכשל בפועל, ונתפס כפגיעה בזהותן של קבוצות ותיקות ומהגרות כאחת.",
     ar:"تصوّر يوجب على الدولة محو الفوارق الثقافية لصالح ثقافة واحدة مشتركة، في التعليم واللغة والرموز. النقد: بوتقة الصهر هذه فشلت عمليًّا، ويُنظر إليها كمسّ بهوية مجموعات قديمة ومهاجرة على السواء.",
     ru:"Представление, по которому государство должно стереть культурные различия ради одной общей культуры: в образовании, языке и символах. Критика: такой плавильный котёл на деле провалился и воспринимается как удар по идентичности и старожилов, и репатриантов.",
     en:"The view that the state should erase cultural differences in favour of one shared culture: in education, language and symbols. The criticism: such a melting pot failed in practice and is felt as an attack on the identity of veteran and immigrant groups alike."},
    {he:"תפיסה שלפיה על המדינה להכיר בקבוצות תרבותיות ולאפשר להן לשמר את זהותן — למשל בחינוך ובשפה. הביקורת: הכרה בקבוצה עלולה לבוא על חשבון זכויות הפרט שבתוכה, ולהעמיק את ההיפרדות.",
     ar:"تصوّر يوجب على الدولة الاعتراف بمجموعات ثقافية وتمكينها من حفظ هويّتها، في التعليم واللغة مثلًا. النقد: الاعتراف بالمجموعة قد يأتي على حساب حقوق الفرد داخلها ويعمّق الانفصال.",
     ru:"Представление, по которому государство должно признавать культурные группы и позволять им сохранять идентичность: например, в образовании и языке. Критика: признание группы может идти в ущерб правам личности внутри неё и углублять обособление.",
     en:"The view that the state should recognise cultural groups and let them preserve their identity: in education and language, for instance. The criticism: recognising a group can come at the expense of individual rights within it, and deepen separation."},
    {he:"תפיסה שלפיה כל קבוצה תרבותית זכאית להסדר של הפרדה מרחבית ומוסדית. הביקורת: ההפרדה מנציחה פערים בין הקבוצות.",
     ar:"تصوّر يمنح كلّ مجموعة ثقافية ترتيبًا من الفصل المكانيّ والمؤسّسيّ. النقد: الفصل يُديم الفجوات بين المجموعات.",
     ru:"Представление, по которому каждая культурная группа получает пространственное и институциональное обособление. Критика: обособление закрепляет разрывы между группами.",
     en:"The view that every cultural group is entitled to spatial and institutional separation. The criticism: separation entrenches the gaps between the groups."},
    {he:"תפיסה שלפיה יש להחליף את הבחירות האישיות בייצוג קבוע לכל קבוצה. הביקורת: ייצוג קבוע מקבע זהויות ומונע ניידות פוליטית.",
     ar:"تصوّر يقضي باستبدال الانتخابات الشخصية بتمثيل ثابت لكلّ مجموعة. النقد: التمثيل الثابت يجمّد الهويات ويمنع الحراك السياسيّ.",
     ru:"Представление, по которому личные выборы следует заменить постоянным представительством каждой группы. Критика: постоянное представительство закрепляет идентичности и мешает политической подвижности.",
     en:"The view that personal elections should be replaced by fixed representation for each group. The criticism: fixed representation freezes identities and blocks political mobility."}],
   1,
   {he:"הכרה בקבוצה מגנה על מי — על הקבוצה, או על כל אחד בתוכה?",
    ar:"الاعتراف بالمجموعة يحمي مَن، المجموعة أم كلّ فرد فيها؟",
    ru:"Признание группы защищает кого: группу или каждого внутри неё?",
    en:"Recognising a group protects whom: the group, or each person inside it?"},
   {he:"המתח הזה מכונה “הבעיה של המיעוט שבתוך המיעוט”: אוטונומיה תרבותית עשויה להגן על הקבוצה ולפגוע בפרט — למשל בזכויות נשים או בזכות לעזוב את הקבוצה. הפתרון המקובל הוא הכרה מוגבלת בזכויות יסוד של הפרט.",
    ar:"يُسمّى هذا التوتّر “مشكلة الأقلية داخل الأقلية”: قد يحمي الاستقلال الثقافيّ المجموعة ويمسّ الفرد، كحقوق النساء أو حقّ مغادرة المجموعة. والحلّ المتّبع اعتراف مقيّد بحقوق الفرد الأساسية.",
    ru:"Это напряжение называют «проблемой меньшинства внутри меньшинства»: культурная автономия может защищать группу и ущемлять личность: например, права женщин или право выйти из группы. Принятое решение: признание, ограниченное основными правами личности.",
    en:"This tension is called the problem of the minority within the minority: cultural autonomy may protect the group while harming the individual: women's rights, say, or the right to leave the group. The usual answer is recognition bounded by the individual's basic rights."},
   null),
  Q("soc-anal2",
    {he:"מהו ההבדל בין “שילוב” (אינטגרציה) לבין “היטמעות” (אסימילציה), ומדוע ההבחנה חשובה למדיניות ציבורית?",
     ar:"ما الفرق بين “الاندماج” و“الانصهار”، ولماذا يهمّ التمييز للسياسة العامّة؟",
     ru:"В чём разница между интеграцией и ассимиляцией и почему это различие важно для публичной политики?",
     en:"What is the difference between integration and assimilation, and why does the distinction matter for public policy?"},
   [{he:"אין הבדל: שני המונחים מתארים את אותו תהליך של כניסת קבוצה לחברה הרחבה, והשימוש באחד מהם הוא עניין של סגנון בלבד ואינו משנה את המדיניות הנגזרת ממנו בחינוך, בדיור, בתעסוקה או בשירות הציבורי.",
     ar:"لا فرق: المصطلحان يصفان العملية ذاتها لدخول مجموعة إلى المجتمع الأوسع، واستخدام أحدهما مسألة أسلوب فقط لا تغيّر السياسة المشتقّة منه في التعليم أو الإسكان أو التشغيل أو الخدمة العامّة.",
     ru:"Разницы нет: оба термина описывают один и тот же процесс вхождения группы в широкое общество, а выбор слова: лишь вопрос стиля, не меняющий политики в образовании, жилье, занятости или на государственной службе.",
     en:"There is no difference: both terms describe the same process of a group entering the wider society, and using one or the other is purely a matter of style that changes no policy in education, housing, employment or public service."},
    {he:"שילוב הוא השתתפות מלאה בחיים המשותפים תוך שמירה על זהות ייחודית; היטמעות היא ויתור על הזהות המקורית. מדיניות שמכוונת להיטמעות תיתפס כפגיעה בזכויות תרבותיות, וגם תיכשל לעיתים קרובות.",
     ar:"الاندماج مشاركة كاملة في الحياة المشتركة مع حفظ هويّة مميّزة؛ والانصهار تخلٍّ عن الهويّة الأصلية. وسياسة تهدف للانصهار تُفهم مساسًا بالحقوق الثقافية، وكثيرًا ما تفشل أيضًا.",
     ru:"Интеграция: полное участие в общей жизни при сохранении особой идентичности; ассимиляция: отказ от исходной идентичности. Политика, нацеленная на ассимиляцию, воспринимается как посягательство на культурные права и часто проваливается.",
     en:"Integration is full participation in shared life while keeping a distinct identity; assimilation is giving up the original identity. A policy aimed at assimilation will be read as an infringement of cultural rights, and will often fail as well."},
    {he:"שילוב נוגע לכלכלה בלבד, והיטמעות לדת בלבד.",
     ar:"الاندماج يخصّ الاقتصاد فقط، والانصهار الدين فقط.",
     ru:"Интеграция касается только экономики, ассимиляция: только религии.",
     en:"Integration concerns only the economy, and assimilation only religion."},
    {he:"שילוב הוא מונח משפטי והיטמעות מונח דמוגרפי.",
     ar:"الاندماج مصطلح قانونيّ والانصهار مصطلح ديموغرافيّ.",
     ru:"Интеграция: юридический термин, ассимиляция: демографический.",
     en:"Integration is a legal term and assimilation a demographic one."}],
   1,
   {he:"בשני המקרים אדם נכנס לחברה. במה הוא נשאר, ובמה הוא מוותר?",
    ar:"في الحالتين يدخل الفرد المجتمع. بماذا يبقى وعمّ يتنازل؟",
    ru:"В обоих случаях человек входит в общество. Что он сохраняет и от чего отказывается?",
    en:"In both cases a person enters a society. What do they keep, and what do they give up?"},
   {he:"ההבחנה מסבירה למה מדיניות קליטה מוצלחת מתמקדת בשפה, בתעסוקה ובהשכלה — כלים להשתתפות — ולא בדרישה לוותר על מנהג, שפה או דת. היא רלוונטית לעולים חדשים בדיוק כמו למיעוטים ותיקים.",
    ar:"يفسّر التمييز لماذا تركّز سياسة استيعاب ناجحة على اللغة والتشغيل والتعليم، أدوات المشاركة، لا على مطالبة بالتخلّي عن عادة أو لغة أو دين. وهو وثيق الصلة بالقادمين الجدد كما بالأقليات القديمة.",
    ru:"Различение объясняет, почему успешная политика абсорбции сосредоточена на языке, занятости и образовании: инструментах участия, а не на требовании отказаться от обычая, языка или религии. Это верно и для репатриантов, и для давних меньшинств.",
    en:"The distinction explains why successful absorption policy focuses on language, employment and education: tools for participation: rather than demanding that a custom, language or religion be given up. It applies to new immigrants exactly as it does to long-standing minorities."},
   null),
  Q("soc-anal3",
    {he:"מדוע ריכוזיות תקציבית של השלטון המרכזי עלולה להעמיק פערים בין רשויות מקומיות?",
     ar:"لماذا قد تعمّق المركزية الميزانياتية للسلطة المركزية الفجوات بين السلطات المحلّية؟",
     ru:"Почему бюджетная централизация может углублять разрыв между местными властями?",
     en:"Why can budgetary centralisation by central government deepen gaps between local authorities?"},
   [{he:"מפני שרשות עשירה גובה יותר ארנונה מעסקים, ורשות ענייה תלויה במענקי איזון שהיקפם נתון להחלטה פוליטית — ולכן הפער אינו נסגר מאליו.",
     ar:"لأن السلطة الغنية تجبي أرنونا أكبر من الأعمال، والفقيرة تعتمد على منح موازنة يخضع حجمها لقرار سياسيّ، فلا تُسدّ الفجوة تلقائيًّا.",
     ru:"Потому что богатый муниципалитет собирает больше налога с бизнеса, а бедный зависит от выравнивающих грантов, размер которых: политическое решение; разрыв сам собой не закрывается.",
     en:"Because a wealthy authority collects more rates from businesses, while a poor one depends on equalisation grants whose size is a political decision, so the gap does not close by itself."},
    {he:"מפני שרשויות מקומיות אינן רשאיות לגבות מסים כלל — וכל הכנסותיהן מגיעות ממשרד הפנים לפי מפתח אחיד, בלי קשר לגודלן ולמצבן הכלכלי.",
     ar:"لأنّ السلطات المحلية لا يحقّ لها جباية الضرائب إطلاقًا، وكلّ مداخيلها تأتي من وزارة الداخلية وفق مفتاح موحّد، بغضّ النظر عن حجمها ووضعها الاقتصاديّ.",
     ru:"Потому что местные власти вовсе не вправе взимать налоги, и все их доходы поступают из МВД по единому ключу, независимо от их размера и экономического положения.",
     en:"Because local authorities may not levy taxes at all, and all their income comes from the interior ministry by a uniform key, regardless of their size or economic situation."},
    {he:"מפני שמשרד הפנים אינו מפקח על רשויות מקומיות.",
     ar:"لأن وزارة الداخلية لا تراقب السلطات المحلّية.",
     ru:"Потому что МВД не надзирает за местными властями.",
     en:"Because the interior ministry does not supervise local authorities."},
    {he:"מפני שהתקציב המקומי נקבע לפי מספר התושבים בלבד.",
     ar:"لأنّ الميزانية المحلية تُحدَّد بحسب عدد السكّان فقط.",
     ru:"Потому что местный бюджет определяется только по числу жителей.",
     en:"Because the local budget is set by the number of residents alone."}],
   0,
   {he:"מאיפה מגיע הכסף של עירייה — ומה קורה כשאין בתחומה אזור תעשייה?",
    ar:"من أين يأتي مال البلدية، وماذا يحدث حين لا منطقة صناعية في نطاقها؟",
    ru:"Откуда у муниципалитета деньги, и что если в нём нет промзоны?",
    en:"Where does a municipality's money come from, and what if it has no industrial zone?"},
   {he:"זהו מפגש בין השסע החברתי־כלכלי לשסע המרכז–פריפריה. מנגנוני איזון קיימים — מענקי איזון וקרנות אזוריות — אך היקפם משתנה עם התקציב, ולכן שוויון בשירות אינו מובטח מבנית אלא תלוי בהחלטה מתחדשת.",
    ar:"هذا تقاطع بين الانقسام الاجتماعيّ الاقتصاديّ وانقسام المركز–الأطراف. توجد آليات موازنة، منح موازنة وصناديق إقليمية، لكن حجمها يتبدّل مع الميزانية، فالمساواة في الخدمة غير مضمونة بنيويًّا بل مرهونة بقرار متجدّد.",
    ru:"Это пересечение социально-экономического раскола с расколом центр–периферия. Механизмы выравнивания есть: выравнивающие гранты и региональные фонды, но их объём меняется с бюджетом, поэтому равенство услуг не гарантировано структурно, а зависит от возобновляемого решения.",
    en:"This is where the socio-economic cleavage meets the centre–periphery one. Equalisation mechanisms exist: balancing grants and regional funds, but their size shifts with the budget, so equality of service is not structurally guaranteed but depends on a decision taken afresh."},
   null),
  Q("sc-3-01",{"he": "בשנים הראשונות של המדינה השסע העדתי, בין יוצאי אירופה ליוצאי ארצות האסלאם, היה בולט מאוד. חוקרים רבים מעריכים שכיום הוא חלש יותר. איזה תהליך עשוי להסביר זאת?", "ar": "في السنوات الأولى للدولة كان الشرخ الطائفي، بين القادمين من أوروبا والقادمين من بلاد الإسلام، بارزًا جدًّا. ويقدّر باحثون كثيرون أنّه اليوم أضعف. أيّ عملية قد تفسّر ذلك؟", "ru": "В первые годы государства этнический раскол между выходцами из Европы и выходцами из стран ислама был очень заметен. Многие исследователи считают, что сегодня он слабее. Какой процесс может это объяснить?", "en": "In the state's early years the ethnic cleavage, between Jews from Europe and Jews from Muslim countries, was very prominent. Many researchers judge it weaker today. Which process may explain this?"},[{"he": "חוק שאסר לדבר על מוצא.", "ar": "قانون منع الحديث عن الأصل.", "ru": "Закон, запретивший говорить о происхождении.", "en": "A law that banned talking about origin."}, {"he": "כל העולים מארצות האסלאם חזרו לארצות שמהן באו.", "ar": "عاد جميع المهاجرين من بلاد الإسلام إلى البلاد التي جاؤوا منها.", "ru": "Все репатрианты из стран ислама вернулись в страны, откуда приехали.", "en": "All immigrants from Muslim countries returned to where they came from."}, {"he": "ביטול הבחירות לכנסת לכמה שנים, כדי שהמפלגות לא יעסקו בשאלות של מוצא ושל עדה.", "ar": "إلغاء انتخابات الكنيست لعدّة سنوات، كي لا تنشغل الأحزاب بمسائل الأصل والطائفة.", "ru": "Отмена выборов в Кнессет на несколько лет, чтобы партии не занимались вопросами происхождения и общины.", "en": "Cancelling Knesset elections for some years, so that parties would not deal with questions of origin and community."}, {"he": "נישואים מעורבים וניידות חברתית, שמטשטשים את הגבולות בין הקבוצות.", "ar": "الزواج المختلط والحراك الاجتماعي، اللذان يطمسان الحدود بين المجموعات.", "ru": "Смешанные браки и социальная мобильность, которые размывают границы между группами.", "en": "Mixed marriages and social mobility, which blur the lines between the groups."}],3,{"he": "מה קורה לגבול בין קבוצות כשהן מתערבבות במשפחה ובעבודה?", "ar": "ماذا يحدث للحدّ بين المجموعات عندما تختلط في العائلة والعمل؟", "ru": "Что происходит с границей между группами, когда они смешиваются в семье и на работе?", "en": "What happens to the line between groups when they mix in families and at work?"},{"he": "שסע נחלש כשהגבולות בין הקבוצות מיטשטשים. נישואים בין בני עדות שונות יוצרים דור עם זהות מעורבת. ניידות בחינוך ובעבודה מצמצמת את הקשר בין מוצא למעמד, אף שפערים מסוימים עדיין נמדדים.", "ar": "يضعف الشرخ عندما تتلاشى الحدود بين المجموعات. فالزواج بين أبناء طوائف مختلفة يُنشئ جيلًا ذا هوية مختلطة. والحراك في التعليم والعمل يقلّص الصلة بين الأصل والمكانة، وإن كانت بعض الفجوات لا تزال تُقاس.", "ru": "Раскол слабеет, когда границы между группами размываются. Браки между выходцами из разных общин создают поколение со смешанной идентичностью. Мобильность в образовании и работе ослабляет связь между происхождением и положением, хотя некоторые разрывы ещё фиксируются.", "en": "A cleavage weakens when the lines between groups blur. Marriages across communities create a generation with a mixed identity. Mobility in education and work loosens the link between origin and status, though some gaps are still measured."},null),
  Q("sc-3-02",{"he": "שר הפנים פיזר מועצה של רשות מקומית בגלל גירעון גדול, ומינה במקומה ״ועדה קרואה״. איזה מתח דמוקרטי עולה כאן?", "ar": "حلّ وزير الداخلية مجلس سلطة محلّية بسبب عجز كبير، وعيّن مكانه «لجنة معيّنة». أيّ توتّر ديمقراطي يظهر هنا؟", "ru": "Министр внутренних дел распустил совет местного органа из-за большого дефицита и назначил вместо него «назначенную комиссию». Какое демократическое противоречие здесь возникает?", "en": "The interior minister dissolved a local council because of a large deficit and appointed an “appointed committee” instead. Which democratic tension arises here?"},[{"he": "אין כאן מתח, כי לרשויות מקומיות אין קשר לדמוקרטיה.", "ar": "لا توتّر هنا، لأنّ السلطات المحلّية لا علاقة لها بالديمقراطية.", "ru": "Противоречия нет, ведь местные органы не связаны с демократией.", "en": "There is no tension, because local authorities have nothing to do with democracy."}, {"he": "מתח בין הכנסת לבית המשפט על פירוש חוק.", "ar": "توتّر بين الكنيست والمحكمة حول تفسير قانون.", "ru": "Противоречие между Кнессетом и судом о толковании закона.", "en": "A tension between the Knesset and the court over interpreting a law."}, {"he": "מתח בין פיקוח על ניהול תקין לבין זכות התושבים לבחור את נציגיהם.", "ar": "توتّر بين الرقابة على الإدارة السليمة وحقّ السكّان في اختيار ممثّليهم.", "ru": "Противоречие между надзором за надлежащим управлением и правом жителей выбирать своих представителей.", "en": "A tension between oversight of proper management and residents' right to choose their representatives."}, {"he": "מתח בין חופש הדת לחופש העיסוק של עובדי העירייה, שחלקם מפוטרים כשהמועצה מתפזרת ומוחלפת.", "ar": "توتّر بين حرية الدين وحرية العمل لموظّفي البلدية، الذين يُفصل بعضهم عندما يُحَلّ المجلس ويُستبدل.", "ru": "Противоречие между свободой вероисповедания и свободой занятий служащих мэрии, часть которых увольняют при роспуске совета.", "en": "A tension between freedom of religion and the freedom of occupation of city staff, some of whom are fired when the council is dissolved and replaced."}],2,{"he": "מי בחר את המועצה, ומי מינה את מי שבא במקומה?", "ar": "مَن انتخب المجلس، ومَن عيّن مَن حلّ مكانه؟", "ru": "Кто избрал совет, и кто назначил тех, кто пришёл на его место?", "en": "Who elected the council, and who appointed those who replaced it?"},{"he": "החוק מאפשר לשר הפנים להחליף מועצה שלא מתפקדת בוועדה ממונה. כך המדינה שומרת על כספי ציבור ועל שירותים לתושבים. אבל הוועדה לא נבחרה בידי התושבים, ולכן יש פגיעה בעיקרון של שלטון נבחר.", "ar": "يتيح القانون لوزير الداخلية استبدال مجلس لا يؤدّي عمله بلجنة معيّنة. وبذلك تحافظ الدولة على المال العامّ وعلى الخدمات للسكّان. لكنّ اللجنة لم ينتخبها السكّان، ولذلك هناك مساس بمبدأ الحكم المنتخب.", "ru": "Закон позволяет министру внутренних дел заменить недееспособный совет назначенной комиссией. Так государство защищает общественные деньги и услуги жителям. Но комиссию не избирали жители, поэтому страдает принцип выборной власти.", "en": "The law lets the interior minister replace a failing council with an appointed committee. This protects public money and residents' services. But the residents did not elect the committee, so the principle of elected government is harmed."},null),
  Q("sc-3-03",{"he": "בישראל נערכות בחירות סדירות. מדוע בכל זאת חברה אזרחית חזקה נחשבת חשובה לדמוקרטיה?", "ar": "تُجرى في إسرائيل انتخابات منتظمة. لماذا مع ذلك يُعَدّ المجتمع المدني القوي مهمًّا للديمقراطية؟", "ru": "В Израиле проходят регулярные выборы. Почему же сильное гражданское общество всё равно считается важным для демократии?", "en": "Israel holds regular elections. Why is a strong civil society still considered important for democracy?"},[{"he": "כי בין בחירות לבחירות היא מאפשרת לאזרחים להתארגן ולהשפיע.", "ar": "لأنّه يتيح للمواطنين بين انتخابات وأخرى أن ينتظموا ويؤثّروا.", "ru": "Потому что между выборами оно позволяет гражданам объединяться и влиять.", "en": "Because between elections it lets citizens organise and have influence."}, {"he": "כי היא מחליפה את הכנסת כשהכנסת אינה מתכנסת.", "ar": "لأنّه يحلّ محلّ الكنيست عندما لا ينعقد.", "ru": "Потому что оно заменяет Кнессет, когда тот не заседает.", "en": "Because it replaces the Knesset when the Knesset is not in session."}, {"he": "כי היא בוחרת את השופטים.", "ar": "لأنّه يختار القضاة.", "ru": "Потому что оно выбирает судей.", "en": "Because it chooses the judges."}, {"he": "כי עמותות מקבלות סמכות לחוקק חוקים בתחומים שבהם הממשלה לא פועלת מספיק.", "ar": "لأنّ الجمعيات تحصل على صلاحية سنّ القوانين في المجالات التي لا تعمل فيها الحكومة بما يكفي.", "ru": "Потому что общественные организации получают право принимать законы там, где правительство действует недостаточно.", "en": "Because associations gain the power to pass laws in areas where the government does too little."}],0,{"he": "חשבו מה אזרח יכול לעשות ביום רגיל, כשאין קלפי.", "ar": "فكّروا فيما يستطيع المواطن فعله في يوم عادي، حين لا يوجد صندوق اقتراع.", "ru": "Подумайте, что гражданин может делать в обычный день, когда нет урны для голосования.", "en": "Think what a citizen can do on an ordinary day, when there is no ballot box."},{"he": "בחירות נותנות לאזרח קול פעם בכמה שנים. ארגוני החברה האזרחית פועלים כל הזמן: הם מספקים שירותים, מייצגים קבוצות ומבקר   Q("sc-3-04",{"he": "תושב קבע שאינו אזרח רשאי להצביע בבחירות לעירייה, אבל לא בבחירות לכנסת. מה ההיגיון בהבדל?", "ar": "يحقّ للمقيم الدائم غير المواطن أن يصوّت في انتخابات البلدية، لكن ليس في انتخابات الكنيست. ما المنطق في هذا الفرق؟", "ru": "Постоянный житель без гражданства может голосовать на выборах в мэрию, но не в Кнессет. В чём логика этой разницы?", "en": "A permanent resident who is not a citizen may vote in city elections but not in Knesset elections. What is the logic of the difference?"},[{"he": "זו טעות בחוק שעוד לא תוקנה.", "ar": "هذا خطأ في القانون لم يُصحَّح بعد.", "ru": "Это ошибка в законе, которую ещё не исправили.", "en": "It is a mistake in the law that has not yet been fixed."}, {"he": "העירייה משרתת את כל מי שגר בה, ולכן הבחירה בה תלויה במגורים.", "ar": "البلدية تخدم كلّ مَن يسكن فيها، ولذلك يرتبط التصويت فيها بالسكن.", "ru": "Мэрия обслуживает всех, кто в ней живёт, поэтому право голоса там зависит от проживания.", "en": "The city serves everyone who lives in it, so voting there depends on residence."}, {"he": "בבחירות לעירייה אין צורך בתעודת זהות.", "ar": "لا حاجة إلى بطاقة هوية في انتخابات البلدية.", "ru": "На выборах в мэрию не нужно удостоверение личности.", "en": "No identity card is needed in city elections."}, {"he": "ההחלטות של העירייה פחות חשובות, ולכן לא אכפת למדינה מי מצביע בבחירות המקומיות ומי לא.", "ar": "قرارات البلدية أقلّ أهمية، ولذلك لا يهمّ الدولة مَن يصوّت في الانتخابات المحلّية ومَن لا يصوّت.", "ru": "Решения мэрии менее важны, поэтому государству безразлично, кто голосует на местных выборах, а кто нет.", "en": "City decisions matter less, so the state does not care who votes in local elections and who does not."}],1,{"he": "במה עוסקת העירייה ביום־יום, ולמי היא נותנת שירות?", "ar": "بماذا تنشغل البلدية يوميًّا، ولمن تقدّم الخدمة؟", "ru": "Чем мэрия занимается каждый день, и кому она оказывает услуги?", "en": "What does the city deal with day to day, and whom does it serve?"},{"he": "הכנסת מחליטה על עניינים של כל המדינה, ולכן הזכות לבחור בה קשורה לאזרחות. העירייה מספקת שירותים כמו ניקיון, חינוך ותכנון לכל התושבים. לכן מי שגר בה דרך קבע משתתף בבחירתה.", "ar": "يقرّر الكنيست في شؤون الدولة كلّها، ولذلك يرتبط حقّ انتخابه بالمواطنة. أمّا البلدية فتقدّم خدمات مثل النظافة والتعليم والتخطيط لجميع السكّان. لذلك يشارك في انتخابها مَن يسكن فيها بشكل دائم.", "ru": "Кнессет решает вопросы всей страны, поэтому право выбирать его связано с гражданством. Мэрия оказывает всем жителям услуги: уборку, образование, планирование. Поэтому тот, кто постоянно в ней живёт, участвует в её выборах.", "en": "The Knesset decides matters for the whole country, so the right to elect it is tied to citizenship. The city provides services such as cleaning, education and planning to all residents. So whoever lives there permanently takes part in electing it."},null)

/* ============================================================
   8. מנוע התרגילים
   ------------------------------------------------------------
   הבנק כתוב, ולכן אין כאן מחולל מסיחים. תפקידו של המנוע צנוע
   יותר ומדויק יותר: לבחור איזה פריט להציג עכשיו, ולערבב את
   סדר התשובות כך שהאינדקס לא ילמד דבר.

   שני מצבי בחירה, וזה ההבדל המהותי בקובץ הזה:
   · בתרגול — חזרה מרווחת: קודם מה שעוד לא נראה, אחר כך מה
     שנכשל, ורק בסוף מה שכבר נשלט.
   · במבחן — בחירה אחידה, בלי להביט בהתקדמות הלומד.
   ההפרדה אינה קוסמטית. מבחן נארז לקישור כזרע, והתלמיד בונה
   ממנו את השאלות מחדש אצלו. אילו הבחירה הייתה תלויה בהיסטוריית
   הלמידה, אותו זרע היה מייצר שאלה אחת אצל המורה ושאלה אחרת
   אצל התלמיד — כלומר המבחן שהמורה ראה אינו המבחן שנשלח.
   ============================================================ */
function itemId(tid,lv,i){return tid+"|"+lv+"|"+i}
function itemRec(id){
  if(!state.item[id])state.item[id]={n:0,ok:0};
  return state.item[id];
}
function poolOf(tp,lv){return (tp.L[lv-1]||tp.L[0]||[])}

/* בחירת פריט לתרגול. משקל גבוה לחדש, בינוני לנכשל, נמוך לנשלט. */
function chooseIndex(tid,lv,pool,avoid){
  var cand=[],i,w;
  for(i=0;i<pool.length;i++){
    if(avoid!==undefined&&i===avoid&&pool.length>1)continue;
    var r=state.item[itemId(tid,lv,i)];
    if(!r||!r.n)w=6;                            /* חדש */
    else if(r.ok<r.n)w=1+Math.min(4,r.n-r.ok);  /* נכשל בעבר */
    else w=1;                                   /* נשלט */
    for(var j=0;j<w;j++)cand.push(i);
  }
  if(!cand.length)return 0;
  return pick(cand);
}
/* בחירת פריט למבחן. אחידה, ואינה נוגעת ב-state כלל. */
function pureIndex(pool,avoid){
  var cand=[],i;
  for(i=0;i<pool.length;i++){
    if(avoid!==undefined&&i===avoid&&pool.length>1)continue;
    cand.push(i);
  }
  return cand.length?pick(cand):0;
}

/* ------------------------------------------------------------
   ניקוי להקראה בלבד. המסך אינו משתנה ממנו.

   הגרשיים העבריים משמשים לשני דברים: ראשי תיבות (חוק־יסוד,
   בג״ץ) ומירכאות (״מדינה יהודית״). המנוע מכיר רק את הראשון.
   הכלל שמפריד: בראשי תיבות באה אחרי הגרשיים אות עברית אחת
   בדיוק וסוף מילה. הסיכון א־סימטרי — מירכאה שהוסרה אינה
   יכולה להזיק, מירכאה שנשארה כן.

   המירכאות המסולסלות (“ ”) משמשות כאן לציטוט מונחים בלבד,
   ולכן הן נופלות תמיד. הקו המפריד הופך לפסיק, כדי שהקול
   ייעצר במקום לרוץ הלאה.
   ------------------------------------------------------------ */
function saySpell(x){
  return String(x==null?"":x)
    .replace(/[“”‘’]/g,"")
    .replace(/״/g,function(m,i,str){
      return /^[א-ת](?![א-ת])/.test(str.slice(i+1))?m:"";
    })
    .replace(/\s—\s/g,", ");
}

function O(html,ok,why){return {h:html,ok:!!ok,why:why||""}}

/* בונה שאלה מפריט אחד. סדר האפשרויות מעורבב בכל בנייה, ולכן
   האינדקס ok שבתוכן אינו מגיע למסך לעולם. */
function buildFromItem(it){
  var opts=it.o.map(function(o,i){return O(esc(gl(o)),i===it.ok,"")});
  var ans=gl(it.o[it.ok]);
  return {
    type:"mcq",
    prompt:t("qPick"),
    lead:gl(it.q),
    fig:figHtml(it.fig),
    opts:shuffle(opts),
    answer:ans,
    /* מה שנאמר אחרי המענה: השאלה, התשובה הנכונה, וההסבר.
       תשובה בלי ההסבר נשמעת כמו עובדה לשינון, וזה בדיוק מה
       שהאפליקציה הזאת קיימת כדי להחליף. */
    say:gl(it.q)+" "+ans+". "+gl(it.ex),
    reveal:it
  };
}
function buildQuestion(tid,lv,avoid,pure){
  var tp=topicOf(tid); if(!tp)return null;
  var pool=poolOf(tp,lv);
  if(!pool.length)return null;
  var idx=pure?pureIndex(pool,avoid):chooseIndex(tid,lv,pool,avoid);
  var it=pool[idx];
  if(!it)return null;
  var q=buildFromItem(it);
  q.tid=tid; q.lv=lv; q.idx=idx; q.id=itemId(tid,lv,idx);
  q.hint=gl(it.hint);
  return q;
}

/* ============================================================
   מבחן מדומה
   ------------------------------------------------------------
   עשרים שאלות מכל הנושאים ומכל הרמות, בחוברת אחת שגוללים בה —
   ולא שאלה־שאלה. מי שקורא לאט צריך לראות כמה נשאר, לחזור אחורה
   ולשנות תשובה; ניווט שמסתיר את שאר השאלות לוקח ממנו בדיוק את זה.

   המבחן אינו נשמר. הוא מצב זמני בזיכרון בלבד, ורענון הדף מתחיל
   אותו מחדש — זו הצהרה ולא פער: שעון שממשיך לרוץ בין ביקורים
   הוא בדיוק המקום שבו נולדים באגים שקשה לשחזר.
   ============================================================ */
var SIM_N=20, SIM_MIN=30;
var SIM={on:false,done:false,q:[],ans:[],end:0,tick:null};

function simStop(){if(SIM.tick){clearInterval(SIM.tick);SIM.tick=null}}
function simFmt(ms){
  if(ms<0)ms=0;
  var sec=Math.round(ms/1000),m=Math.floor(sec/60),c=sec%60;
  return m+":"+(c<10?"0":"")+c;
}
function simLeftN(){
  var n=0,i;
  for(i=0;i<SIM.ans.length;i++)if(SIM.ans[i]<0)n++;
  return n;
}
function simRight(){
  var n=0,i;
  for(i=0;i<SIM.q.length;i++)if(SIM.ans[i]>=0&&SIM.q[i].opts[SIM.ans[i]].ok)n++;
  return n;
}
function simStart(){
  var pairs=[],qs=[],i,q;
  TOPICS.forEach(function(tp){for(var l=1;l<=3;l++)pairs.push([tp.id,l])});
  shuffle(pairs);
  for(i=0;i<pairs.length&&qs.length<SIM_N;i++){
    q=buildQuestion(pairs[i][0],pairs[i][1],undefined,true);
    if(q)qs.push(q);
  }
  /* פחות צמדי נושא-רמה מ-SIM_N: סבב נוסף, בלי לחזור על אותו פריט. */
  var guard=0;
  while(qs.length<SIM_N&&guard<400){
    var pr=pairs[guard%pairs.length]; guard++;
    q=buildQuestion(pr[0],pr[1],undefined,true);
    if(!q)continue;
    var dup=false,k;
    for(k=0;k<qs.length;k++)if(qs[k].id===q.id){dup=true;break}
    if(!dup)qs.push(q);
  }
  SIM.q=qs;
  SIM.ans=qs.map(function(){return -1});
  SIM.on=true; SIM.done=false; SIM.end=Date.now()+SIM_MIN*60000;
  simArm();
}
function simArm(){
  simStop();
  if(SIM.on&&!SIM.done)SIM.tick=setInterval(simClock,1000);
}
function simClock(){
  var el=$("#simclock");
  /* המסך הוחלף — אין מה לעדכן, והשעון נעצר מעצמו. */
  if(!el){simStop();return}
  var left=SIM.end-Date.now();
  el.textContent=simFmt(left);
  if(left<=60000)el.classList.add("low");
  if(left<=0){simStop();simSubmit()}
}
/* ההגשה היא גם רגע הרישום: עד כאן לא נספרה אף תשובה, כדי
   שהמבחן לא ידחוף לבנק הטעויות שאלה שהנבחן עוד עמד לשנות. */
function simSubmit(){
  if(!SIM.on||SIM.done)return;
  simStop();
  var i;
  for(i=0;i<SIM.q.length;i++){
    var q=SIM.q[i],pk=SIM.ans[i];
    recordItem(q.tid,q.lv,q.id,pk>=0&&!!q.opts[pk].ok);
  }
  SIM.done=true; save(); render(); window.scrollTo(0,0);
}

  var h='<div class="wrap"><h2 style="margin:1.1rem 0 .3rem;font-size:1.4rem">'+esc(t("simT"))+"</h2>";
  if(!SIM.on){

  if(SIM.done){
    var right=simRight(),pc=Math.round(100*right/Math.max(1,SIM.q.length));

      h+='<div class="simq"><div class="simn">'+esc(t("simQ"))+" "+(i+1)+" · "+

/* ============================================================
   18. מבחן כיתתי — פרסום בוואטסאפ, קבלת תשובות וציונים
   ------------------------------------------------------------
   אין שרת, ואין כוונה שיהיה. לכן המבחן אינו נשלח לשום מקום:
   הוא *נארז לתוך הקישור*. המורה מקבל קישור, שולח אותו בוואטסאפ,
   והמכשיר של התלמיד בונה מהקישור בדיוק את אותן שאלות.

   מה שהופך את זה לאפשרי הוא שכל מחולל שאלות כאן משתמש ב-
   Math.random בלבד. אם מזרעים אותו, אותו זרע מייצר את אותן
   שאלות ואת אותו סדר תשובות — אצל המורה ואצל התלמיד. הקישור
   נושא זרע ורשימת נושאים, לא עשרים שאלות מלאות, ולכן הוא נשאר
   קצר מספיק לוואטסאפ.

   שלוש מגבלות שנאמרות כאן במפורש כי הן חלק מהתכנון:
   · אין איסוף אוטומטי. התלמיד שולח קוד תשובות בוואטסאפ, והמורה
     מדביק אותו. זה המחיר של אפס שרת ואפס עלות.
   · אפשר לזייף קוד. הציון מחושב מחדש אצל המורה מתוך התשובות
     ולא נלקח מהתלמיד, אבל אין כאן הגנה קריפטוגרפית — זה מבחן
     כיתתי מעצב, לא בגרות.
   · שמות התלמידים נשארים במכשיר של המורה. הם לא עוברים דרך
     שום שרת, כי אין שרת.
   ============================================================ */
var GENV=2;                 /* גרסת המחוללים. מבחן שנוצר בגרסה אחרת
                               אינו נפתח — עדיף הודעה ברורה מאשר
                               עשרים שאלות אחרות בשקט. */
var EKEY="shlav-exams-civics-v1";   /* מפתח לאפליקציה הזאת בלבד */
var EKEY_OLD="shlav-exams-v1";  /* המפתח המשותף הישן. לקריאה בלבד, לא נמחק. */

/* --- מחולל מזורע. mulberry32: קצר, מהיר, ופיזור טוב דיו --- */
function withSeed(seed,fn){
  var real=Math.random,s=(seed>>>0)||1;
  Math.random=function(){
    s|=0; s=s+0x6D2B79F5|0;
    var t=Math.imul(s^s>>>15,1|s);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
  try{return fn()}finally{Math.random=real}
}
function hash32(str){
  var h=0x811c9dc5,i;
  for(i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193)}
  return (h>>>0);
}
/* base64url. הניקוי בפענוח אינו קוסמטי: וואטסאפ שובר מחרוזות
   ארוכות בשורות, ורווח אחד הורס את כל הקוד. */
function b64e(str){
  var bytes=new TextEncoder().encode(str),bin="",i;
  for(i=0;i<bytes.length;i+=8192)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));
  return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function b64d(s){
  s=String(s||"").replace(/[^A-Za-z0-9\-_]/g,"").replace(/-/g,"+").replace(/_/g,"/");
  while(s.length%4)s+="=";
  var bin=atob(s),bytes=new Uint8Array(bin.length),i;
  for(i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
/* הזרע של המשבצת נכנס למזהה: שני מבחנים באותם נושאים ובאותה
   רמה, שהמורה החליף באחד מהם שאלה, אינם אותו מבחן. מבחן ישן
   שאין לו זרעים מקבל בדיוק את המזהה שקיבל תמיד — אחרת ההגשות
   שכבר נקלטו אליו מתייתמות. */
function examId(spec){return hash32(spec.s+"|"+spec.q.map(function(x){
  return x[0]+x[1]+(x.length>2?"@"+x[2]:"")}).join(",")).toString(36)}
function encodeExam(spec){return b64e(JSON.stringify(spec))}
function decodeExam(code){
  try{
    var o=JSON.parse(b64d(code));
    if(!o||!o.q||!o.q.length||typeof o.s!=="number")return null;
    o.q=o.q.filter(function(x){return topicById(x[0])});
    return o.q.length?o:null;
  }catch(e){return null}
}
/* בונה את שאלות המבחן. אותו זרע → אותן שאלות, גם אצל המורה
   כשהוא בודק וגם אצל התלמיד כשהוא נבחן. */
function examQuestions(spec){
  /* מסננים נושאים שאינם מוכרים לאפליקציה הזאת, בדיוק כמו decodeExam.
     בלי הסינון buildQ מחזיר null על נושא זר, והמסך נופל על
     q.topic של null. עדיף לדלג בשקט מאשר להתרסק. */
  var pairs=(spec.q||[]).filter(function(x){return !!topicById(x[0])});
  /* מבחן שנבנה עם זרע לכל משבצת נבנה משבצת אחרי משבצת, וכל
     שאלה תלויה בזרע שלה בלבד — כך המורה יכול להחליף אחת מהן.
     מבחן ישן, בלי זרעים, חייב להיבנות בדיוק כפי שנבנה ביום
     שנשלח: אחרת הציון של מי שכבר נבחן משתנה למפרע. */
  if(pairs.length&&pairs.every(function(x){return typeof x[2]==="number"}))
    return pairs.map(function(p){return exBuildSlot(p)})
                .filter(function(q){return !!q});
  return withSeed(spec.s,function(){
    return pairs.map(function(pair){return buildQ(pair[0],pair[1])})
                .filter(function(q){return !!q});
  });
}
/* --- בחירת השאלות בידי המורה ---------------------------------
   עד כאן המורה בחר נושאים, רמה ומספר שאלות — והשאלות עצמן הוגרלו
   מאחורי גבו. הוא ראה אותן לראשונה רק אחרי שהמבחן כבר היה אצל
   התלמידים. מעכשיו כל שאלה היא משבצת נפרדת עם זרע משלה: המורה
   רואה אותה לפני השליחה, מחליף אותה בשאלה אחרת מאותו נושא,
   מסיר אותה, או מוסיף שאלה מנושא שחסר לו.

   הזרע הנפרד לכל משבצת הוא מה שמאפשר את זה. בזרם אקראי אחד
   ומשותף, כפי שהיה עד כאן, החלפה של השאלה השלישית הייתה משנה
   גם את הרביעית ואת החמישית — כלומר לא "החלפה" אלא הגרלה מחדש
   של כל מה שאחריה.

   24 ביט ולא 32: הזרע נוסע בתוך הקישור שנשלח בוואטסאפ, וזרע
   קצר יותר הוא קישור קצר יותר. שישה־עשר מיליון אפשרויות למשבצת
   הן הרבה מעבר למה שהמחולל עצמו יודע לייצר. */
function exNewSeed(){return (Math.random()*16777215)>>>0}
function exSlot(topicId,level){return [topicId,level,exNewSeed()]}
/* אותו זרע → אותה שאלה בדיוק: אצל המורה כשהוא בוחר, ואצל
   התלמיד כשהוא נבחן. */
function exBuildSlot(slot){
  if(!slot||!topicById(slot[0]))return null;
  return withSeed(slot[2],function(){return buildQ(slot[0],slot[1])})||null;
}
/* מסך הבנייה מצייר את עצמו מחדש אחרי כל לחיצה, ובניית עשרים
   וחמש שאלות בכל ציור מיותרת. המטמון הוא לתצוגה בלבד — מי
   שנבחן בונה את שאלותיו מחדש, כדי שאיש לא יערוך בטעות אובייקט
   שגם מסך אחר מחזיק בו. */
var EXQCACHE={};
/* לכל אפליקציה מנגנון שפה משלה, ולא לכולן אותם שמות. הפנייה
   דרך window ולא בשם ישיר, כי שם שאינו קיים באפליקציה מסוימת
   הוא שגיאה בעיני הבודקים — רעש שמסתיר שגיאה אמיתית. */
function exLangKey(){
  try{
    var g=(typeof window!=="undefined")?window:{};
    if(typeof g.xlg==="function")return g.xlg();
    if(typeof g.LG==="string")return g.LG;
    return (state&&state.settings&&state.settings.lang)||"he";
  }catch(e){return "he"}
}
function exPreviewQ(slot){
  if(!slot)return null;
  var k=slot[0]+"|"+slot[1]+"|"+slot[2]+"|"+exLangKey();
  if(!(k in EXQCACHE)){
    /* מורה שמחליף שאלות שוב ושוב מייצר מפתח חדש בכל לחיצה.
       מטמון שרק גדל הוא דליפה; מרוקנים אותו ומתחילים מחדש. */
    if(Object.keys(EXQCACHE).length>400)EXQCACHE={};
    EXQCACHE[k]=exBuildSlot(slot);
  }
  return EXQCACHE[k];
}
function exTopicName(id){
  var t=topicById(id); if(!t)return "";
  var g=(typeof window!=="undefined")?window:{};
  return (typeof g.tName==="function"?g.tName(t):t.name)||"";
}
function exRightAnswer(q){
  var i; if(!q||!q.options)return null;
  for(i=0;i<q.options.length;i++)if(q.options[i].ok)return q.options[i];
  return null;
}
/* המשבצות שהמורה עורך. נבנות מחדש רק כשנושא, רמה או מספר
   השאלות משתנים; עריכה של משבצת בודדת נשמרת. */
function exSlots(){
  if(EB.q&&EB.q.length)return EB.q;
  var tops=EB.topics.filter(function(x){return topicById(x)});
  if(!tops.length)tops=topicsForTrack(state.track).slice(0,3).map(function(t){return t.id});
  var q=[],i;
  for(i=0;i<EB.n;i++)q.push(exSlot(tops[i%tops.length],EB.level));
  /* מערבבים כאן ולא בשליחה: המורה רואה את הסדר הסופי ומאשר אותו. */
  EB.q=shuffle(q);
  return EB.q;
}
function examUrl(spec){
  var base=location.origin+location.pathname;
  return base+"#x="+encodeExam(spec);
}
function waLink(text,phone){
  var p=String(phone||"").replace(/[^0-9]/g,"");
  return "https://wa.me/"+p+"?text="+encodeURIComponent(text);
}

/* --- אחסון מבחנים והגשות, בנפרד מהתקדמות התלמיד --- */
var EX={list:[]};
/* --- הגירה מהמפתח המשותף הישן ---------------------------------
   עד הגרסה הזאת כל האפליקציות כתבו מבחנים לאותו מפתח localStorage
   ובאותו origin, ולכן מבחן שנבנה במתמטיקה הופיע ברשימת המבחנים של
   אנגלית והפיל את המסך. מעכשיו לכל אפליקציה מפתח משלה, ובטעינה
   מועתקות מהמפתח הישן רק רשומות שכל נושאיהן מוכרים כאן.
   המפתח הישן נשאר על כנו ואינו נמחק, כדי שגם אפליקציה אחרת תוכל
   לקלוט ממנו את המבחנים ששייכים לה. --------------------------- */
function exSpecKnown(spec){
  if(!spec||!spec.q||!spec.q.length)return false;
  for(var i=0;i<spec.q.length;i++){
    var pair=spec.q[i];
    if(!pair||!topicById(pair[0]))return false;
  }
  return true;
}
function exAdoptLegacy(){
  var added=0;
  try{
    var raw=localStorage.getItem(EKEY_OLD); if(!raw)return;
    var old=JSON.parse(raw); if(!old||!old.list||!old.list.length)return;
    var have={},i,ex;
    for(i=0;i<EX.list.length;i++)have[EX.list[i].id]=1;
    for(i=0;i<old.list.length;i++){
      ex=old.list[i];
      if(!ex||!ex.id||have[ex.id])continue;
      if(!exSpecKnown(ex.spec))continue;
      EX.list.push(ex); have[ex.id]=1; added++;
    }
  }catch(e){return}
  if(added)exSave();
}
function exLoad(){
  try{var r=localStorage.getItem(EKEY);if(r){var o=JSON.parse(r);if(o&&o.list)EX=o}}catch(e){}
  if(!EX.list)EX.list=[];
  exAdoptLegacy();
}
function exSave(){try{localStorage.setItem(EKEY,JSON.stringify(EX))}catch(e){}}
function exFind(id){for(var i=0;i<EX.list.length;i++)if(EX.list[i].id===id)return EX.list[i];return null}

/* --- קוד ההגשה של התלמיד --- */
function encodeResult(id,name,answers){
  var body={i:id,n:String(name||"").slice(0,40),a:answers,d:todayIso()};
  body.c=hash32(JSON.stringify([body.i,body.n,body.a])).toString(36);
  return b64e(JSON.stringify(body));
}
function decodeResult(code){
  try{
    var o=JSON.parse(b64d(code));
    if(!o||!o.i||!o.a||!o.a.length)return null;
    o.ok=(o.c===hash32(JSON.stringify([o.i,o.n,o.a])).toString(36));
    return o;
  }catch(e){return null}
}
/* הציון מחושב כאן מחדש מתוך התשובות. מה שהתלמיד שלח הוא מה
   שסימן, לא כמה הוא קיבל. */
function gradeResult(spec,res){
  var qs=examQuestions(spec),per=[],ok=0,i,q,a;
  for(i=0;i<qs.length;i++){
    q=qs[i]; a=res.a[i];
    var right=(a>=0&&q.options[a]&&q.options[a].ok)?1:0;
    if(right)ok++;
    per.push({topic:q.topic,topicName:q.topicName,ok:right,
              picked:(a>=0&&q.options[a])?q.options[a].t:"—",
              answer:(q.options.filter(function(o){return o.ok})[0]||{}).t||""});
  }
  return {ok:ok,n:qs.length,pct:Math.round(100*ok/qs.length),per:per};
}

/* ------------------------------------------------------------
   ייצוא CSV של ההגשות.
   העתקת הטבלה נותנת טקסט מופרד בטאבים — נוח להדבקה, אבל לא קובץ.
   מורה שרוצה למיין, לסנן או לחשב ממוצע צריך גיליון. שורה לכל תלמיד,
   ועמודה לכל שאלה, כדי שאפשר יהיה לראות מיד באיזו שאלה נפלה הכיתה.
   ה-BOM בהתחלה הוא מה שגורם לאקסל לקרוא עברית, ערבית ורוסית נכון
   במקום ג׳יבריש — בלעדיו הקובץ נפתח שבור בדיוק אצל מי שצריך אותו.
   ------------------------------------------------------------ */
function csvCell(v){
  var s=(v===undefined||v===null)?"":String(v);
  return /[",\n\r;\t]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function csvRow(a){ return a.map(csvCell).join(",") }
/* ============================================================
   מצב מורה.
   בונה המבחן ומסך הציונים נועדו למורה. על טאבלט כיתתי, או על
   טלפון שהילד לוקח לעצמו, אין סיבה שהם יהיו במרחק הקשה אחת:
   ילד יכול למחוק מבחן, לראות ציונים של חברים, או לפתוח מבחן
   ולראות מראש את השאלות.
   זו אינה אבטחה, ואסור להציג אותה ככזאת: מי שיודע לפתוח כלי
   פיתוח יעקוף אותה בשנייה. זו נעילה מפני יד סקרנית — בדיוק מה
   שצריך כאן, ולא יותר.
   כל עוד לא נבחר קוד, שום דבר לא משתנה והמסכים גלויים כתמיד.
   ============================================================ */
