     en:"An employer refused to hire a woman because she is the mother of young children. Which principle was breached, and what kind of discrimination is it?"},
   [{he:"לא הופר דבר: למעסיק חופש עיסוק, והוא רשאי לשקול את זמינותה של מועמדת לשעות נוספות ולנסיעות עבודה.",
     ar:"لم يُخرق شيء: لصاحب العمل حرية عمل، ويحقّ له أن يأخذ في الحسبان مدى تفرّغ المرشّحة لساعات إضافية وأسفار عمل.",
     ru:"Ничего не нарушено: у работодателя есть свобода занятия, и он вправе учитывать готовность кандидатки к сверхурочным и служебным поездкам.",
     en:"Nothing was breached: the employer has freedom of occupation and may weigh a candidate's availability for overtime and work travel."},
    {he:"הופר עקרון השוויון: זו הפליה פסולה, שכן ההורות אינה רלוונטית לכישורים לתפקיד.",
     ar:"خُرق مبدأ المساواة: هذا تمييز مرفوض، لأن الأمومة ليست ذات صلة بمؤهّلات الوظيفة.",
     ru:"Нарушен принцип равенства: это недопустимая дискриминация, поскольку родительство не относится к профессиональным качествам.",
     en:"The principle of equality was breached: this is wrongful discrimination, since parenthood is irrelevant to fitness for the job."},
    {he:"הופרה הזכות לפרטיות בלבד.",
     ar:"انتُهك حقّ الخصوصية فقط.",
     ru:"Нарушено только право на частную жизнь.",
     en:"Only the right to privacy was breached."},
    {he:"הופר עקרון חופש ההתאגדות.",
     ar:"خُرق مبدأ حرّية التنظّم.",
     ru:"Нарушен принцип свободы объединений.",
     en:"The principle of freedom of association was breached."}],
   1,
   {he:"שוויון אינו יחס זהה לכולם, אלא יחס שווה לשווים. שאלו אם ההבדל רלוונטי לתפקיד.",
    ar:"المساواة ليست معاملة متطابقة للجميع بل معاملة متساوية للمتساوين. اسألوا إن كان الفارق ذا صلة بالوظيفة.",
    ru:"Равенство — не одинаковое обращение со всеми, а равное обращение с равными. Спросите, относится ли различие к работе.",
    en:"Equality is not identical treatment for all, but equal treatment of equals. Ask whether the difference is relevant to the job."},
   {he:"ההבחנה המרכזית היא בין הבחנה מותרת להפליה אסורה. הבחנה מותרת נשענת על שוני רלוונטי (רישיון נהיגה לנהג אוטובוס); הפליה נשענת על שוני שאינו רלוונטי — מין, גזע, דת, מוצא, נטייה מינית או הורות.",
    ar:"التمييز الجوهريّ بين تفرقة جائزة وتمييز محظور. التفرقة الجائزة تستند إلى فارق ذي صلة (رخصة سياقة لسائق حافلة)؛ أما التمييز فيستند إلى فارق غير ذي صلة — جنس أو عرق أو دين أو أصل أو ميل جنسيّ أو أمومة.",
    ru:"Ключевое различие — между допустимым разграничением и запрещённой дискриминацией. Допустимое опирается на релевантное отличие (водительские права для водителя автобуса); дискриминация — на нерелевантное: пол, расу, религию, происхождение, ориентацию или родительство.",
    en:"The key distinction is between a permitted distinction and forbidden discrimination. A permitted distinction rests on a relevant difference (a driving licence for a bus driver); discrimination rests on an irrelevant one — sex, race, religion, origin, orientation or parenthood."},
   null),
  Q("rights-case3",
    {he:"בית ספר ביקש לפרסם את ציוני התלמידים על לוח המודעות, לפי שם. איזו זכות עומדת מול הרצון לעודד הישגים?",
     ar:"أرادت مدرسة نشر علامات الطلاب على لوح الإعلانات بأسمائهم. أيّ حقّ يقف أمام الرغبة في تشجيع التحصيل؟",
     ru:"Школа захотела вывесить оценки учеников на доске объявлений с именами. Какое право противостоит желанию поощрить успеваемость?",
     en:"A school wanted to post pupils' grades on the notice board, by name. Which right stands against the wish to encourage achievement?"},
   [{he:"הזכות לחינוך: פרסום הציונים עלול להרתיע תלמידים מתקשים מלהמשיך במסלול הלימודים המתקדם.",
     ar:"الحقّ في التعليم: نشر العلامات قد يردع الطلاب المتعثّرين عن مواصلة المسار التعليميّ المتقدّم.",
     ru:"Право на образование: публикация оценок может отпугнуть слабых учеников от продолжения в углублённой программе.",
     en:"The right to education: publishing the grades may deter struggling pupils from continuing in the advanced track."},
    {he:"הזכות לפרטיות ולכבוד: מידע אישי על אדם אינו מתפרסם בלי הסכמתו, גם כשהמטרה חינוכית.",
     ar:"الحقّ في الخصوصية والكرامة: لا يُنشر معلومات شخصية عن إنسان دون موافقته، حتى لو كانت الغاية تربوية.",
     ru:"Право на частную жизнь и достоинство: личные сведения о человеке не публикуют без его согласия, даже с воспитательной целью.",
     en:"The right to privacy and dignity: personal information about a person is not published without consent, even for an educational purpose."},
    {he:"חופש העיסוק של המורים.",ar:"حرّية عمل المعلّمين.",ru:"Свобода занятий учителей.",en:"The teachers' freedom of occupation."},
    {he:"הזכות לקניין רוחני על המבחן.",ar:"حقّ الملكية الفكرية على الامتحان.",ru:"Право интеллектуальной собственности на экзамен.",en:"Intellectual property in the exam paper."}],
   1,
   {he:"מה נחשף כאן על התלמיד, ולעיני מי?",
    ar:"ماذا يُكشف هنا عن الطالب، وأمام مَن؟",
    ru:"Что здесь раскрывается об ученике и перед кем?",
    en:"What is exposed here about the pupil, and to whom?"},
   {he:"הפרטיות מוגנת בחוק־יסוד: כבוד האדם וחירותו ובחוק הגנת הפרטיות. מטרה ראויה — עידוד לימודים — אינה מייתרת את השאלה אם היא מושגת באמצעי פוגעני פחות, למשל מסירת הציון לתלמיד בלבד.",
    ar:"الخصوصية محميّة في قانون أساس: كرامة الإنسان وحرّيته وفي قانون حماية الخصوصية. الغاية المشروعة — تشجيع التعلّم — لا تلغي السؤال إن كانت تتحقّق بوسيلة أقلّ مساسًا، كتسليم العلامة للطالب وحده.",
    ru:"Частная жизнь защищена Основным законом о достоинстве и свободе человека и Законом о защите частной жизни. Достойная цель — поощрение учёбы — не снимает вопроса, достижима ли она менее ущемляющим средством, например выдачей оценки лично ученику.",
    en:"Privacy is protected by Basic Law: Human Dignity and Liberty and by the Protection of Privacy Law. A worthy purpose — encouraging study — does not remove the question whether it can be achieved less intrusively, for instance by giving the grade to the pupil alone."},
   null)
 ],
 [ /* רמה 3 — ניתוח */
  Q("rights-anal1",
    {he:"עיתון מבקש לפרסם צילומים ממצלמות אבטחה של חשוד שטרם הורשע. אילו זכויות מתנגשות, וכיצד נהוג לאזן?",
     ar:"تريد صحيفة نشر لقطات كاميرات مراقبة لمشتبه به لم يُدَن بعد. أيّ حقوق تتصادم، وكيف تجري الموازنة عادةً؟",
     ru:"Газета хочет опубликовать кадры с камер наблюдения подозреваемого, ещё не осуждённого. Какие права сталкиваются и как принято их уравновешивать?",
     en:"A newspaper wants to publish CCTV footage of a suspect not yet convicted. Which rights collide, and how is the balance usually struck?"},
   [{he:"חופש הביטוי וזכות הציבור לדעת מול הזכות לשם טוב, לפרטיות ולחזקת החפות. מאזנים לפי מידת העניין הציבורי ומידת הפגיעה, ולעיתים בפרסום חלקי או באיסור זמני.",
     ar:"حرّية التعبير وحقّ الجمهور في المعرفة مقابل الحقّ في السمعة والخصوصية وقرينة البراءة. تجري الموازنة بحسب حجم المصلحة العامة وحجم المساس، وأحيانًا بنشر جزئيّ أو منع مؤقّت.",
     ru:"Свобода слова и право общества знать против права на доброе имя, частную жизнь и презумпции невиновности. Уравновешивают по мере общественного интереса и тяжести ущерба, иногда частичной публикацией или временным запретом.",
     en:"Freedom of expression and the public's right to know against the rights to reputation, privacy and the presumption of innocence. The balance turns on the weight of the public interest and of the harm, sometimes through partial publication or a temporary ban."},
    {he:"אין התנגשות: פרסום כל מידע שהגיע לעיתון מותר תמיד.",
     ar:"لا تصادم: نشر أيّ معلومة تصل الصحيفة جائز دائمًا.",
     ru:"Столкновения нет: публиковать любую попавшую в газету информацию всегда можно.",
     en:"There is no collision: publishing anything that reaches a newspaper is always permitted."},
    {he:"אין התנגשות: פרסום אסור תמיד עד להרשעה חלוטה.",
     ar:"لا تصادم: النشر ممنوع دائمًا حتى إدانة نهائية.",
     ru:"Столкновения нет: публикация всегда запрещена до окончательного приговора.",
     en:"There is no collision: publication is always forbidden until a final conviction."},
    {he:"ההתנגשות היא בין חופש העיסוק של העיתונאי לזכות הקניין של בעל המצלמה, ומכריעים בה לפי מי מימן את ההתקנה, מי מחזיק בהקלטה ומה נכתב בתנאי השימוש שבמקום.",
     ar:"التعارض هو بين حرية عمل الصحفيّ وحقّ الملكية لصاحب الكاميرا، ويُحسَم بحسب مَن موّل التركيب، ومَن يحتفظ بالتسجيل، وما ورد في شروط الاستخدام المعلنة في المكان.",
     ru:"Столкновение — между свободой занятия журналиста и правом собственности владельца камеры; решают его по тому, кто оплатил установку, у кого хранится запись и что сказано в правилах пользования на месте.",
     en:"The clash is between the journalist's freedom of occupation and the camera owner's property right, and it is settled by who paid for the installation, who holds the recording and what the posted terms of use say."}],
   0,
   {he:"שני צדדים, ולכל אחד זכות אמיתית. חפשו את התשובה שאינה מוחקת אף אחד מהם.",
    ar:"طرفان، ولكلٍّ حقّ حقيقيّ. ابحثوا عن الجواب الذي لا يمحو أيًّا منهما.",
    ru:"Две стороны, и у каждой настоящее право. Ищите ответ, который не стирает ни одну.",
    en:"Two sides, each with a genuine right. Look for the answer that erases neither."},
   {he:"התנגשות זכויות אינה נפתרת בהכרזה שזכות אחת “חשובה יותר”, אלא באיזון קונקרטי: מה עוצמת הפגיעה, מה תרומת הפרסום, והאם יש אמצעי ביניים. חזקת החפות מחייבת גם ניסוח זהיר — “חשוד” ולא “פושע”.",
    ar:"لا يُحلّ تصادم الحقوق بإعلان أن حقًّا “أهمّ”، بل بموازنة عيانية: ما شدّة المساس، وما إسهام النشر، وهل من وسيلة وسطى. وقرينة البراءة تفرض صياغة حذرة — “مشتبه به” لا “مجرم”.",
    ru:"Столкновение прав решается не объявлением одного «важнее», а конкретным взвешиванием: какова тяжесть ущерба, какова польза публикации, есть ли промежуточное средство. Презумпция невиновности требует и осторожных формулировок — «подозреваемый», а не «преступник».",
    en:"A clash of rights is not settled by declaring one right “more important”, but by a concrete balance: how severe the harm, what the publication contributes, and whether a middle course exists. The presumption of innocence also demands careful wording — “suspect”, not “criminal”."},
   null),
  Q("rights-anal2",
    {he:"מהי “העדפה מתקנת”, ומהו הטיעון המרכזי בעדה ומולה?",
     ar:"ما هو “التفضيل التصحيحيّ”، وما الحجّة المركزية معه وضدّه؟",
     ru:"Что такое «корректирующее предпочтение» и каков главный аргумент за и против?",
     en:"What is “affirmative action”, and what is the central argument for and against it?"},
   [{he:"מתן העדפה לקבוצה שסבלה מהפליה מתמשכת, כדי לקדם שוויון הזדמנויות מהותי. בעדה — תיקון עוול מבני; מולה — פגיעה בשוויון הפורמלי ובעקרון הכישורים.",
     ar:"منح أفضلية لمجموعة عانت تمييزًا متواصلًا، لتعزيز تكافؤ فرص جوهريّ. معه — تصحيح ظلم بنيويّ؛ ضدّه — مساس بالمساواة الشكلية وبمبدأ الكفاءة.",
     ru:"Предпочтение группе, долго страдавшей от дискриминации, ради содержательного равенства возможностей. За — исправление структурной несправедливости; против — ущерб формальному равенству и принципу заслуг.",
     en:"Preference for a group that has suffered sustained discrimination, to advance substantive equality of opportunity. For — repairing structural injustice; against — harm to formal equality and to merit."},
    {he:"חיוב המדינה לפצות כספית כל מי שהופלה בעבר, במקום לשנות את כללי הקבלה. בעדה — הפיצוי אישי ומדיד; מולה — עלות תקציבית גבוהה וקושי להוכיח הפליה שנים לאחר מעשה.",
     ar:"إلزام الدولة بتعويض ماليّ لكلّ مَن مُيّز ضدّه في الماضي، بدل تغيير قواعد القبول. معها — التعويض شخصيّ وقابل للقياس؛ ضدّها — كلفة ميزانياتية عالية وصعوبة إثبات التمييز بعد سنوات.",
     ru:"Обязанность государства выплатить компенсацию каждому, кого дискриминировали в прошлом, вместо изменения правил приёма. За — компенсация личная и измеримая; против — высокая бюджетная цена и трудность доказать дискриминацию спустя годы.",
     en:"Requiring the state to pay compensation to everyone discriminated against in the past, instead of changing the admission rules. For — the payment is personal and measurable; against — a high budget cost and the difficulty of proving discrimination years later."},
    {he:"איסור על פרסום נתונים סטטיסטיים לפי מוצא.",
     ar:"منع نشر معطيات إحصائية بحسب الأصل.",
     ru:"Запрет публиковать статистику по происхождению.",
     en:"A ban on publishing statistics by origin."},
    {he:"מדיניות שלפיה כל המשרות מאוישות בהגרלה.",
     ar:"سياسة تُملأ فيها كلّ الوظائف بالقرعة.",
     ru:"Политика, при которой все должности заполняются жеребьёвкой.",
     en:"A policy in which every post is filled by lottery."}],
   0,
   {he:"המילה “מתקנת” מרמזת שיש מה לתקן. מה?",
    ar:"كلمة “تصحيحيّ” تلمّح إلى وجود ما يُصحَّح. ما هو؟",
    ru:"Слово «корректирующее» намекает, что есть что исправлять. Что именно?",
    en:"The word “corrective” hints that something needs correcting. What?"},
   {he:"זהו מתח בין שוויון פורמלי (יחס זהה מכאן והלאה) לשוויון מהותי (תוצאה שוויונית בפועל). בישראל היא מעוגנת בחקיקה לגבי ייצוג הולם — לנשים, לערבים, לאנשים עם מוגבלות וליוצאי אתיופיה — בשירות הציבורי ובדירקטוריונים.",
    ar:"هذا توتّر بين مساواة شكلية (معاملة متطابقة من الآن) ومساواة جوهرية (نتيجة متساوية فعلًا). في إسرائيل هي مرسّخة تشريعيًّا في التمثيل الملائم — للنساء والعرب وذوي الإعاقة ويهود إثيوبيا — في الخدمة العامة ومجالس الإدارة.",
    ru:"Это напряжение между формальным равенством (одинаковое обращение отныне) и содержательным (фактически равный результат). В Израиле оно закреплено законом о надлежащем представительстве — женщин, арабов, людей с инвалидностью и выходцев из Эфиопии — в госслужбе и советах директоров.",
    en:"This is the tension between formal equality (identical treatment from now on) and substantive equality (an actually equal outcome). In Israel it is anchored in legislation on adequate representation — for women, Arabs, people with disabilities and Israelis of Ethiopian origin — in the civil service and on company boards."},
   null),
  Q("rights-anal3",
    {he:"מדינה מבקשת להתקין זיהוי פנים בכל מרחב ציבורי כדי לצמצם פשיעה. כיצד בוחנים את הפגיעה בזכויות?",
     ar:"تريد دولة نصب تمييز وجوه في كلّ حيّز عامّ لتقليل الجريمة. كيف يُفحص المساس بالحقوق؟",
     ru:"Государство хочет установить распознавание лиц во всех общественных местах ради снижения преступности. Как оценивать ущерб правам?",
     en:"A state wants facial recognition in every public space to cut crime. How is the infringement of rights assessed?"},
   [{he:"אין צורך בבחינה: מרחב ציבורי אינו פרטי, ומי שיוצא לרחוב מוותר מדעת על ציפייה לפרטיות, ולכן צילום פניו אינו פגיעה הטעונה הצדקה.",
     ar:"لا حاجة إلى فحص: الحيّز العامّ ليس خاصًّا، ومَن يخرج إلى الشارع يتنازل عن توقّع الخصوصية، ولذلك تصوير وجهه ليس مسًّا يستوجب تبريرًا.",
     ru:"Проверка не нужна: общественное пространство не является частным, и тот, кто выходит на улицу, сознательно отказывается от ожидания приватности, поэтому съёмка его лица не является нарушением, требующим оправдания.",
     en:"No examination is needed: public space is not private, and whoever steps into the street knowingly gives up any expectation of privacy, so filming his face is not an infringement that requires justification."},
    {he:"בוחנים רק אם המערכת מדויקת מבחינה טכנית.",
     ar:"يُفحص فقط إن كانت المنظومة دقيقة تقنيًّا.",
     ru:"Проверяют только техническую точность системы.",
     en:"Only the technical accuracy of the system is examined."},
    {he:"בפסקת ההגבלה: האם יש חוק מפורש, תכלית ראויה, והאם המעקב הגורף הוא האמצעי הפוגעני פחות — או שאפשר להסתפק במעקב ממוקד ומוגבל בזמן.",
     ar:"بفقرة التقييد: هل ثمّة قانون صريح وغاية مشروعة، وهل المراقبة الشاملة أقلّ الوسائل مساسًا — أم تكفي مراقبة مركّزة محدودة زمنيًّا.",
     ru:"По ограничительной оговорке: есть ли прямой закон, достойная цель, и является ли сплошная слежка наименее ущемляющим средством — или довольно точечной и ограниченной по времени.",

     en:"One checks whether a majority supports the move in a poll."}],
   2,
   {he:"יש כלי אחד קבוע לבחינת פגיעה בזכות. איך הוא נקרא, ומה ארבעת תנאיו?",
    ar:"ثمّة أداة ثابتة لفحص المساس بحقّ. ما اسمها، وما شروطها الأربعة؟",
    ru:"Есть один устойчивый инструмент проверки ущерба праву. Как он называется и каковы его четыре условия?",
    en:"There is one standard tool for testing an infringement of a right. What is it called, and what are its four conditions?"},
   {he:"פרטיות במרחב הציבורי מוגנת גם היא: ההבדל בין שוטר שרואה אותך לבין מערכת שזוכרת כל מקום שהיית בו הוא הבדל של מהות ולא של מידה. סקר תמיכה אינו חלק מפסקת ההגבלה — רוב אינו מכשיר פגיעה.",
    ar:"الخصوصية في الحيّز العامّ محميّة أيضًا: الفرق بين شرطيّ يراك ومنظومة تتذكّر كلّ مكان كنت فيه فرق جوهر لا درجة. واستطلاع التأييد ليس جزءًا من فقرة التقييد — الأغلبية لا تُجيز المساس.",

 ]

topic("basic","rig",
  {he:"חוקי היסוד ומדרג הנורמות",ar:"قوانين الأساس ومراتب المعايير",ru:"Основные законы и иерархия норм",en:"Basic laws and the hierarchy of norms"},
  {he:"למה אין בישראל חוקה, ומה גובר על מה",
   ar:"لماذا لا دستور في إسرائيل، وما الذي يعلو على ماذا",
   ru:"Почему в Израиле нет конституции и что над чем стоит",
   en:"Why Israel has no constitution, and what overrides what"},
[
 [ /* רמה 1 — ידע */
  Q("basic-hier",
    {he:"לפי מדרג הנורמות, מה גובר על מה?",
     ar:"وفق مراتب المعايير، ما الذي يعلو على ماذا؟",
     ru:"Согласно иерархии норм, что над чем стоит?",
     en:"According to the hierarchy of norms, what overrides what?"},
   [{he:"חוק יסוד גובר על חוק רגיל, חוק גובר על תקנה, ותקנה גוברת על הנחיה מנהלית.",
     ar:"قانون أساس يعلو على قانون عاديّ، والقانون على اللائحة، واللائحة على التعليمات الإدارية.",
     ru:"Основной закон выше обычного, закон выше постановления, постановление выше административной инструкции.",
     en:"A basic law overrides an ordinary statute, a statute overrides a regulation, and a regulation overrides an administrative directive."},
    {he:"תקנה גוברת על חוק, מפני שהיא מפורטת יותר ומותאמת למקרה הקונקרטי.",
     ar:"اللائحة تتغلّب على القانون، لأنّها أكثر تفصيلًا وملاءمةً للحالة المحدّدة.",
     ru:"Постановление важнее закона, потому что оно подробнее и лучше подходит к конкретному случаю.",
     en:"A regulation prevails over a statute, because it is more detailed and fitted to the concrete case."},
    {he:"פסק דין גובר על חוק יסוד.",
     ar:"الحكم القضائيّ يعلو على قانون الأساس.",
     ru:"Судебное решение выше основного закона.",
     en:"A judgment overrides a basic law."},
    {he:"אין מדרג: כל הנורמות שוות במעמדן.",
     ar:"لا مراتب: كلّ المعايير متساوية المكانة.",
     ru:"Иерархии нет: все нормы равны по статусу.",
     en:"There is no hierarchy: all norms are of equal standing."}],
   0,
   {he:"מי מחוקק כל אחת מהן — הכנסת, שר, או פקיד? ככל שהמחוקק “גבוה” יותר, כך הנורמה גבוהה יותר.",
    ar:"مَن يسنّ كلًّا منها — الكنيست أم وزير أم موظّف؟ كلّما علا المشرّع علت المرتبة.",
    ru:"Кто издаёт каждую — Кнессет, министр или чиновник? Чем «выше» законодатель, тем выше норма.",
    en:"Who makes each one — the Knesset, a minister, or an official? The higher the maker, the higher the norm."},
   {he:"המדרג אינו סדר יופי: תקנה שסותרת חוק בטלה, והנחיה מנהלית שסותרת תקנה בטלה. זו הדרך שבה ההחלטה של הפקיד נשארת כפופה למה שהכנסת החליטה.",
    ar:"المراتب ليست ترتيبًا جماليًّا: لائحة تناقض قانونًا باطلة، وتعليمات إدارية تناقض لائحة باطلة. هكذا يبقى قرار الموظّف خاضعًا لما قرّرته الكنيست.",
    ru:"Иерархия — не украшение: постановление, противоречащее закону, ничтожно, а инструкция, противоречащая постановлению, ничтожна. Так решение чиновника остаётся подчинено тому, что решил Кнессет.",
    en:"The hierarchy is not decorative: a regulation that contradicts a statute is void, and a directive that contradicts a regulation is void. That is how an official's decision stays subordinate to what the Knesset decided."},
   "pyramid"),
  Q("basic-why",
    {he:"מדוע אין בישראל חוקה שלמה כתובה?",
     ar:"لماذا لا يوجد في إسرائيل دستور كامل مكتوب؟",
     ru:"Почему в Израиле нет цельной писаной конституции?",
     en:"Why does Israel have no complete written constitution?"},
   [{he:"מפני שהחוק הבינלאומי אוסר על מדינות חדשות לכתוב חוקה.",
     ar:"لأن القانون الدوليّ يمنع الدول الجديدة من كتابة دستور.",
     ru:"Потому что международное право запрещает новым государствам писать конституцию.",
     en:"Because international law forbids new states from writing a constitution."},
    {he:"מפני שמגילת העצמאות היא חוקה מחייבת לכל דבר: היא מגדירה את ערכי המדינה, ובית המשפט פוסל לפיה חוקים הסותרים אותה, ולכן לא נדרש מסמך נוסף.",
     ar:"لأنّ وثيقة الاستقلال دستور مُلزِم بكلّ معنى: فهي تحدّد قيم الدولة، وتبطل المحكمة بموجبها القوانين المناقضة لها، ولذلك لم تعد هناك حاجة إلى وثيقة أخرى.",
     ru:"Потому что Декларация независимости — полноценная обязывающая конституция: она определяет ценности государства, суд отменяет по ней противоречащие законы, и потому другой документ не понадобился.",
     en:"Because the Declaration of Independence is a binding constitution in every sense: it defines the state's values, the court strikes down laws that contradict it, and so no further document was needed."},
    {he:"בשל מחלוקות עמוקות — בעיקר בענייני דת ומדינה וזהות המדינה. במקום זאת התקבלה “החלטת הררי” (1950), שלפיה החוקה תיכתב פרקים־פרקים כחוקי יסוד.",
     ar:"بسبب خلافات عميقة — خاصّة في الدين والدولة وهويّة الدولة. وبدلًا من ذلك أُقرّ “قرار هراري” (١٩٥٠): يُكتب الدستور فصلًا فصلًا كقوانين أساس.",
     ru:"Из-за глубоких разногласий — прежде всего о религии и государстве и о его идентичности. Вместо этого принято «решение Харари» (1950): конституция пишется главами, как основные законы.",
     en:"Because of deep disagreements — mainly over religion and state and the state's identity. Instead the Harari Decision (1950) was adopted: the constitution would be written chapter by chapter, as basic laws."},
    {he:"מפני שהכנסת הראשונה לא הספיקה להתכנס.",
     ar:"لأن الكنيست الأولى لم تتمكّن من الانعقاد.",
     ru:"Потому что первый Кнессет не успел собраться.",
     en:"Because the first Knesset never managed to convene."}],
   2,
   {he:"החלטה משנת 1950 קבעה פשרה: לא לוותר על חוקה, אבל גם לא לכתוב אותה בבת אחת.",
    ar:"قرار من ١٩٥٠ أرسى تسوية: لا التنازل عن دستور ولا كتابته دفعة واحدة.",
    ru:"Решение 1950 года закрепило компромисс: от конституции не отказываться, но и не писать её разом.",
    en:"A 1950 decision set a compromise: not to give up a constitution, but not to write it all at once either."},
   {he:"עד היום התקבלו כתריסר חוקי יסוד. שניים מהם — כבוד האדם וחירותו, וחופש העיסוק — הם “חוקי היסוד של הזכויות”, ורק הם כוללים פסקת הגבלה. חוקי יסוד אחרים עוסקים במוסדות: הכנסת, הממשלה, השפיטה.",
    ar:"حتى اليوم أُقرّ نحو اثني عشر قانون أساس. اثنان منها — كرامة الإنسان وحرّيته، وحرّية العمل — هما “قانونا أساس الحقوق”، وهما وحدهما يتضمّنان فقرة تقييد. أما البقية فتتناول المؤسّسات: الكنيست، الحكومة، القضاء.",
    ru:"К сегодняшнему дню принято около дюжины основных законов. Два из них — о достоинстве и свободе человека и о свободе занятий — «основные законы прав», и лишь они содержат ограничительную оговорку. Остальные касаются институтов: Кнессета, правительства, судебной власти.",
    en:"About a dozen basic laws have been enacted. Two of them — Human Dignity and Liberty, and Freedom of Occupation — are the “rights basic laws”, and only they contain a limitation clause. The rest deal with institutions: the Knesset, the government, the judiciary."},
   null),
  Q("basic-limit",
    {he:"מהי פסקת ההגבלה, ומה היא קובעת?",
     ar:"ما هي فقرة التقييد، وماذا تقرّر؟",
     ru:"Что такое ограничительная оговорка и что она устанавливает?",
     en:"What is the limitation clause, and what does it lay down?"},
   [{he:"סעיף האוסר על הכנסת לחוקק בשעת חירום, ומחייב אותה להעביר את סמכות החקיקה לממשלה עד שיוסר מצב החירום ותשוב הפעילות הסדירה.",
     ar:"بند يمنع الكنيست من التشريع في حالة الطوارئ، ويلزمها بنقل صلاحية التشريع إلى الحكومة حتى تُرفع حالة الطوارئ ويعود النشاط المنتظم.",
     ru:"Статья, запрещающая Кнессету законодательствовать в чрезвычайном положении и обязывающая передать законодательные полномочия правительству, пока положение не отменят и работа не вернётся в обычное русло.",
     en:"A clause barring the Knesset from legislating during an emergency and requiring it to hand legislative power to the government until the emergency is lifted and normal work resumes."},
    {he:"סעיף הקובע מתי מותר לפגוע בזכות שבחוק היסוד: בחוק, ההולם את ערכי המדינה, לתכלית ראויה, ובמידה שאינה עולה על הנדרש.",
     ar:"بند يحدّد متى يجوز المساس بحقّ في قانون الأساس: بقانون، يلائم قيم الدولة، لغاية مشروعة، وبقدر لا يتجاوز اللازم.",
     ru:"Статья, определяющая, когда можно ограничить право основного закона: законом, соответствующим ценностям государства, ради достойной цели и в мере, не превышающей необходимую.",
     en:"A section setting out when a right in the basic law may be infringed: by a statute befitting the values of the state, for a proper purpose, and to an extent no greater than required."},
    {he:"סעיף המגביל את מספר חברי הכנסת ל-120.",
     ar:"بند يحدّ عدد أعضاء الكنيست بـ١٢٠.",
     ru:"Статья, ограничивающая число депутатов Кнессета 120.",
     en:"A section limiting the number of Knesset members to 120."},
    {he:"סעיף המגביל את כהונת השופטים לעשר שנים.",
     ar:"بند يحدّ ولاية القضاة بعشر سنوات.",
     ru:"Статья, ограничивающая срок судей десятью годами.",
     en:"A section limiting judges' tenure to ten years."}],
   1,
   {he:"היא לא אוסרת פגיעה — היא קובעת תנאים לפגיעה. ארבעה.",
    ar:"لا تمنع المساس بل تشترط له شروطًا. أربعة.",
    ru:"Она не запрещает ограничение — она ставит условия. Их четыре.",
    en:"It does not forbid infringement — it sets conditions for it. Four of them."},
   {he:"פסקת ההגבלה היא הכלי המרכזי של הביקורת השיפוטית על חקיקה בישראל. היא מבטאת את התפיסה שזכויות אינן מוחלטות אך גם אינן הפקר: אפשר לפגוע, אך רק בדרך שנקבעה מראש ובמידה הנחוצה.",
    ar:"فقرة التقييد هي الأداة المركزية للرقابة القضائية على التشريع في إسرائيل. تعبّر عن أن الحقوق ليست مطلقة ولا مستباحة: يجوز المساس، لكن بالطريقة المحدّدة سلفًا وبالقدر اللازم.",
    ru:"Ограничительная оговорка — главный инструмент судебного контроля над законодательством в Израиле. Она выражает мысль, что права не абсолютны, но и не беззащитны: ограничить можно, но лишь заранее установленным путём и в необходимой мере.",
    en:"The limitation clause is the main instrument of judicial review of legislation in Israel. It expresses the idea that rights are neither absolute nor unprotected: they may be infringed, but only in the manner set in advance and to the extent necessary."},
   null)
 ],
 [ /* רמה 2 — הבנה */
  Q("basic-case1",
    {he:"שר התקין תקנה המחייבת אישור מיוחד לפתיחת עסק, אף שהחוק שמכוחו פעל אינו מזכיר אישור כזה. מה מעמד התקנה?",
     ar:"أصدر وزير لائحة توجب ترخيصًا خاصًّا لفتح مشروع، مع أن القانون الذي استند إليه لا يذكر ترخيصًا كهذا. ما مكانة اللائحة؟",
     ru:"Министр издал постановление, требующее особого разрешения для открытия дела, хотя закон, на который он опирался, такого разрешения не упоминает. Каков статус постановления?",
     en:"A minister made a regulation requiring a special permit to open a business, although the statute he acted under mentions no such permit. What is the regulation's standing?"},
   [{he:"התקנה תקפה: לשר סמכות רחבה בתחומו.",
     ar:"اللائحة سارية: للوزير صلاحية واسعة في مجاله.",
     ru:"Постановление действительно: у министра широкие полномочия в своей сфере.",
     en:"The regulation is valid: a minister has broad authority in his field."},
    {he:"התקנה תקפה עד שהכנסת תבטל אותה בחוק חדש, שכן חקיקת משנה של שר נחשבת חלק מהחקיקה כל עוד לא נקבע אחרת.",
     ar:"اللائحة سارية حتى تلغيها الكنيست بقانون جديد، إذ يُعدّ التشريع الفرعيّ الصادر عن وزير جزءًا من التشريع ما دام لم يُقرَّر خلاف ذلك.",
     ru:"Постановление действует, пока Кнессет не отменит его новым законом, ведь подзаконный акт министра считается частью законодательства, пока не решено иначе.",
     en:"The regulation stands until the Knesset repeals it in a new statute, since a minister's secondary legislation counts as legislation unless decided otherwise."},
    {he:"התקנה חורגת מסמכות: חקיקת משנה יונקת את כוחה מהחוק המסמיך, ואינה יכולה להוסיף עליו חובה חדשה.",
     ar:"اللائحة تجاوز للصلاحية: التشريع الفرعيّ يستمدّ قوّته من القانون المخوِّل ولا يضيف عليه واجبًا جديدًا.",
     ru:"Постановление вне полномочий: подзаконный акт черпает силу из уполномочивающего закона и не может добавлять к нему новую обязанность.",
     en:"The regulation is ultra vires: subordinate legislation draws its force from the enabling statute and cannot add a new duty to it."},
    {he:"התקנה תקפה אם פורסמה ברשומות.",
     ar:"اللائحة سارية إن نُشرت في الجريدة الرسمية.",
     ru:"Постановление действительно, если опубликовано в официальном вестнике.",
     en:"The regulation is valid if it was published in the official gazette."}],
   2,
   {he:"מאיפה שואב השר את הכוח להתקין תקנה? ומה קורה כשהוא חורג ממה שניתן לו?",
    ar:"من أين يستمدّ الوزير سلطة إصدار اللائحة؟ وماذا يحدث حين يتجاوز ما مُنح له؟",
    ru:"Откуда министр черпает право издавать постановление? И что если он выходит за данные ему рамки?",
    en:"Where does the minister get the power to make a regulation? And what happens when he exceeds what he was given?"},
   {he:"זה יישום ישיר של מדרג הנורמות. הכלל המנחה: “אין עונשין ואין מחייבים אלא לפי חוק”. הביקורת על חריגה מסמכות היא הליבה הוותיקה ביותר של המשפט המנהלי, והיא קדמה בישראל לביקורת על חוקים.",
    ar:"هذا تطبيق مباشر لمراتب المعايير. القاعدة: لا عقاب ولا إلزام إلا بقانون. والرقابة على تجاوز الصلاحية هي أقدم لبّ في القانون الإداريّ، وقد سبقت في إسرائيل الرقابة على القوانين.",
    ru:"Это прямое применение иерархии норм. Правило: наказывать и обязывать можно лишь по закону. Контроль за превышением полномочий — старейшее ядро административного права, и в Израиле он предшествовал контролю над законами.",
    en:"This is a direct application of the hierarchy of norms. The rule: no one is punished or bound except under statute. Review for excess of authority is the oldest core of administrative law, and in Israel it preceded review of statutes."},

  Q("basic-case2",
    {he:"הכנסת חוקקה חוק רגיל הפוגע בחופש העיסוק. אילו מבחנים יבחן בית המשפט לפני שיקבע אם החוק תקף?",
     ar:"سنّت الكنيست قانونًا عاديًّا يمسّ حرّية العمل. أيّ اختبارات ستفحصها المحكمة قبل أن تقرّر سريانه؟",
     ru:"Кнессет принял обычный закон, ограничивающий свободу занятий. Какие проверки применит суд, прежде чем решить, действителен ли закон?",
     en:"The Knesset passed an ordinary statute infringing freedom of occupation. What tests will the court apply before deciding whether the statute is valid?"},
   [{he:"רק את השאלה אם החוק עבר בשלוש קריאות.",
     ar:"فقط إن كان القانون أُقرّ بثلاث قراءات.",
     ru:"Только прошёл ли закон три чтения.",
     en:"Only whether the statute passed three readings."},
    {he:"רק את השאלה אם רוב הציבור מתנגד לחוק.",
     ar:"فقط إن كانت أغلبية الجمهور تعارض القانون.",
     ru:"Только выступает ли большинство против закона.",
     en:"Only whether most of the public opposes the statute."},
    {he:"את תנאי פסקת ההגבלה — הסמכה בחוק, התאמה לערכי המדינה, תכלית ראויה ומידתיות — ורק אם החוק אינו עומד בהם, יפסול אותו.",
     ar:"شروط فقرة التقييد — تخويل بقانون، ملاءمة لقيم الدولة، غاية مشروعة وتناسب — وإن لم يستوفِها القانون أبطلته.",
     ru:"Условия ограничительной оговорки — уполномочивание законом, соответствие ценностям государства, достойная цель и соразмерность — и лишь если закон им не отвечает, отменит его.",
     en:"The conditions of the limitation clause — statutory authority, conformity with the state's values, a proper purpose and proportionality — and only if the statute fails them will it be struck down."},
    {he:"את השאלה אם החוק תואם את מגילת העצמאות ואת ערכי היסוד שנקבעו בה, שכן היא המסמך המכונן שמכוחו בלבד אפשר לפסול חקיקה.",
     ar:"مسألة ما إذا كان القانون منسجمًا مع وثيقة الاستقلال والقيم الأساسية الواردة فيها، إذ هي الوثيقة التأسيسية التي وحدها تتيح إبطال تشريع.",
     ru:"Вопрос, соответствует ли закон Декларации независимости и закреплённым в ней базовым ценностям, ведь только этот учредительный документ позволяет отменить законодательство.",
     en:"Whether the statute fits the Declaration of Independence and the founding values in it, since that is the constitutive document and the only ground for striking legislation down."}],
   2,
   {he:"חוק היסוד מגן על הזכות, אבל לא באופן מוחלט. איזה סעיף בו מסביר מתי מותר לפגוע?",
    ar:"قانون الأساس يحمي الحقّ، لكن ليس مطلقًا. أيّ بند فيه يفسّر متى يجوز المساس؟",
    ru:"Основной закон защищает право, но не абсолютно. Какая его статья объясняет, когда ограничение допустимо?",
    en:"The basic law protects the right, but not absolutely. Which section explains when an infringement is allowed?"},
   {he:"סמכות בית המשפט לבטל חוק של הכנסת נקבעה בפסק דין בנק המזרחי (1995), והוסקה ממעמדם העליון של חוקי היסוד. חוק־יסוד: חופש העיסוק כולל גם “פסקת התגברות”: הכנסת יכולה לחוקק חוק סותר ברוב של 61, לתקופה מוגבלת.",
    ar:"صلاحية المحكمة بإبطال قانون للكنيست تقرّرت في حكم بنك همزراحي (١٩٩٥)، واستُنتجت من علوّ مكانة قوانين الأساس. وقانون أساس: حرّية العمل يتضمّن أيضًا “فقرة تغلّب”: للكنيست أن تسنّ قانونًا مناقضًا بأغلبية ٦١ ولفترة محدودة.",
    ru:"Полномочие суда отменить закон Кнессета установлено решением по делу «Банк ха-Мизрахи» (1995) и выведено из высшего статуса основных законов. Основной закон о свободе занятий содержит и «оговорку преодоления»: Кнессет может принять противоречащий закон большинством в 61 голос и на ограниченный срок.",
    en:"The court's power to strike down a Knesset statute was established in the Bank Mizrahi judgment (1995) and derived from the superior status of basic laws. Basic Law: Freedom of Occupation also contains an override clause: the Knesset may pass a conflicting statute by 61 votes, for a limited period."},

  Q("basic-case3",
    {he:"מה ההבדל המעשי בין ביקורת שיפוטית על חוק לבין ביקורת שיפוטית על החלטה מנהלית?",
     ar:"ما الفرق العمليّ بين الرقابة القضائية على قانون والرقابة على قرار إداريّ؟",
     ru:"В чём практическая разница между судебным контролем над законом и над административным решением?",
     en:"What is the practical difference between judicial review of a statute and of an administrative decision?"},
   [{he:"אין הבדל: בשני הסוגים בית המשפט בוחן אם הרשות פעלה בסמכות, בסבירות ובמידתיות, ולכן גם התוצאה זהה — ההחלטה או החוק מתבטלים.",
     ar:"لا فرق: في النوعين تفحص المحكمة إن عملت السلطة ضمن صلاحيتها وبمعقولية وتناسب، ولذلك النتيجة واحدة — يُبطَل القرار أو القانون.",
     ru:"Разницы нет: в обоих случаях суд проверяет, действовал ли орган в пределах полномочий, разумно и соразмерно, поэтому и результат один — решение или закон отменяются.",
     en:"There is no difference: in both the court asks whether the authority acted within its powers, reasonably and proportionately, so the outcome is the same — the decision or the law is annulled."},
    {he:"ביקורת על חוק בודקת אם הכנסת חרגה מחוקי היסוד, והיא נדירה; ביקורת מנהלית בודקת אם רשות פעלה בסמכות, בסבירות ובהגינות, והיא שגרתית.",
     ar:"الرقابة على قانون تفحص إن تجاوزت الكنيست قوانين الأساس، وهي نادرة؛ والرقابة الإدارية تفحص إن عملت السلطة ضمن صلاحيتها بمعقولية ونزاهة، وهي روتينية.",
     ru:"Контроль над законом проверяет, вышел ли Кнессет за рамки основных законов, и он редок; административный контроль проверяет законность, разумность и добросовестность действий органа, и он рутинен.",
     en:"Review of a statute asks whether the Knesset exceeded the basic laws, and it is rare; administrative review asks whether an authority acted within its powers, reasonably and fairly, and it is routine."},
    {he:"ביקורת מנהלית מתקיימת רק בבית המשפט העליון.",
     ar:"الرقابة الإدارية تجري في المحكمة العليا فقط.",
     ru:"Административный контроль возможен только в Верховном суде.",
     en:"Administrative review takes place only in the Supreme Court."},
    {he:"ביקורת על חוק אפשרית רק בשנה שלאחר חקיקתו.",
     ar:"الرقابة على قانون ممكنة في السنة التالية لسنّه فقط.",
     ru:"Контроль над законом возможен лишь в год после принятия.",
     en:"Review of a statute is possible only in the year after enactment."}],
   1,
   {he:"מי קיבל את ההחלטה בכל אחד מהמקרים — הכנסת או פקיד? ולפי איזו נורמה בוחנים אותו?",
    ar:"مَن اتّخذ القرار في كلّ حالة — الكنيست أم موظّف؟ ووفق أيّ معيار يُفحص؟",
    ru:"Кто принял решение в каждом случае — Кнессет или чиновник? И по какой норме его проверяют?",
    en:"Who took the decision in each case — the Knesset or an official? And against which norm is it tested?"},
   {he:"ההבדל נובע ישירות מהמדרג: חוק נבחן מול הנורמה שמעליו (חוק יסוד), והחלטה מנהלית נבחנת מול החוק והתקנות שמעליה. לכן ביטול חוק הוא מהלך חריג, ואילו ביטול החלטה מנהלית הוא עבודת היום־יום של בג״ץ ובתי המשפט לעניינים מנהליים.",
    ar:"الفرق ناتج مباشرةً عن المراتب: القانون يُفحص أمام المعيار الأعلى منه (قانون أساس)، والقرار الإداريّ أمام القانون واللوائح فوقه. لذلك إبطال قانون خطوة استثنائية، بينما إبطال قرار إداريّ عمل يوميّ للعليا ومحاكم الشؤون الإدارية.",
    ru:"Разница прямо вытекает из иерархии: закон проверяют против стоящей над ним нормы (основного закона), административное решение — против закона и постановлений над ним. Поэтому отмена закона — исключительный шаг, а отмена административного решения — повседневная работа БАГАЦ и судов по административным делам.",
    en:"The difference follows directly from the hierarchy: a statute is tested against the norm above it (a basic law), and an administrative decision against the statutes and regulations above it. So striking down a statute is exceptional, while quashing an administrative decision is the daily work of the High Court and the administrative courts."},

  Q("basic-anal1",
    {he:"טענה: “הכנסת היא הריבון, ולכן היא רשאית לחוקק כל חוק, ובית המשפט אינו רשאי לבטלו.” מהי התשובה החוקתית המקובלת בישראל?",
     ar:"ادّعاء: “الكنيست هي السيّدة، فلها أن تسنّ أيّ قانون، ولا يحقّ للمحكمة إبطاله.” ما الجواب الدستوريّ المتّبع في إسرائيل؟",
     ru:"Тезис: «Кнессет суверенен, поэтому вправе принять любой закон, а суд не вправе его отменить». Каков принятый в Израиле конституционный ответ?",

     ru:"Кнессет действует в двух качествах: как учредительная власть он принимает основные законы, как законодательная — им подчинён. Поэтому обычный закон, противоречащий основному, может быть отменён.",
     en:"The Knesset acts in two capacities: as a constituent authority it enacts basic laws, and as a legislature it is bound by them. So an ordinary statute contradicting a basic law may be annulled."},
    {he:"הטענה נכונה במלואה: בישראל אין ביקורת שיפוטית על חקיקה.",

    {he:"בית המשפט רשאי לבטל כל חוק שאינו מקובל עליו, בלי מבחן קבוע, שכן הביקורת השיפוטית נועדה לשקף את תפיסת הצדק של השופטים במקום את הרוב הפוליטי.",

     ru:"Суд вправе отменить любой неугодный ему закон без постоянного критерия, ведь судебный контроль призван отражать представление судей о справедливости вместо политического большинства.",
     en:"The court may annul any law it dislikes, with no fixed test, since judicial review exists to reflect the judges' sense of justice rather than the political majority."},
    {he:"רק בית הדין הגבוה לצדק בהרכב מלא של כל השופטים רשאי לבטל חוק.",

   {he:"אותו גוף מחוקק גם חוקי יסוד וגם חוקים רגילים. האם הוא עושה זאת באותה כובע?",
    ar:"الجسم نفسه يسنّ قوانين أساس وقوانين عادية. أيفعل ذلك بالصفة ذاتها؟",
    ru:"Один и тот же орган принимает и основные, и обычные законы. В одном ли качестве?",

   {he:"תורת שני הכובעים היא הבסיס לפסק דין בנק המזרחי. הביקורת עליה טוענת שהכנסת לא נבחרה כאסיפה מכוננת, ושאין הליך מיוחד לחקיקת חוק יסוד — ולכן ההבחנה מלאכותית. זו מחלוקת חוקתית פתוחה, לא עובדה מוסכמת.",
    ar:"نظرية الصفتين أساس حكم بنك همزراحي. ويقول نقدها إن الكنيست لم تُنتخب جمعية تأسيسية، وإنه لا إجراء خاصًّا لسنّ قانون أساس — فالتمييز مصطنع. هذا خلاف دستوريّ مفتوح لا حقيقة متّفق عليها.",
    ru:"Теория двух шляп — основа решения по «Банк ха-Мизрахи». Критика возражает, что Кнессет не избирался как учредительное собрание и что особой процедуры принятия основного закона нет, а значит различение искусственно. Это открытый конституционный спор, а не согласованный факт.",
    en:"The two-hats doctrine underlies the Bank Mizrahi judgment. Its critics reply that the Knesset was not elected as a constituent assembly and that there is no special procedure for enacting a basic law — so the distinction is artificial. This is an open constitutional dispute, not an agreed fact."},

  Q("basic-anal2",
    {he:"מהי “פסקת התגברות”, ומהו הוויכוח סביבה?",

     ru:"Что такое «оговорка преодоления» и в чём спор вокруг неё?",

   [{he:"סעיף המאפשר לממשלה לעקוף חוק בתקנה.",
     ar:"بند يتيح للحكومة الالتفاف على قانون بلائحة.",
     ru:"Статья, позволяющая правительству обойти закон постановлением.",
     en:"A clause letting the government bypass a statute by regulation."},
    {he:"סעיף המאפשר לבית המשפט לבטל חוק יסוד.",

    {he:"סעיף המאפשר לכנסת לחוקק חוק אף שהוא סותר חוק יסוד. בעדה — הכרעה סופית לנבחרי הציבור; נגדה — הזכויות מאבדות את ההגנה שלשמה עוגנו.",
     ar:"بند يتيح للكنيست سنّ قانون رغم مناقضته قانون أساس. معه — الحسم النهائيّ لمنتخبي الجمهور؛ ضدّه — تفقد الحقوق الحماية التي رُسّخت لأجلها.",
     ru:"Статья, позволяющая Кнессету принять закон вопреки основному. За — окончательное слово у избранников народа; против — права теряют ту защиту, ради которой их закрепляли.",

    {he:"סעיף המחייב משאל עם לפני כל שינוי בחוק יסוד. בעדו — שינוי חוקתי טעון הסכמת הציבור עצמו; נגדו — משאלי עם תכופים משתקים את עבודת החקיקה.",

     ru:"Статья, требующая референдума перед любым изменением Основного закона. За — конституционное изменение должно получить согласие самого общества; против — частые референдумы парализуют законодательную работу.",
     en:"A clause requiring a referendum before any change to a Basic Law. For — a constitutional change should need the public's own consent; against — frequent referendums paralyse legislative work."}],
   2,
   {he:"“להתגבר” — על מה? על פסיקה, או על חוק היסוד עצמו?",

    ru:"«Преодолеть» — что? Решение суда или сам основной закон?",

    ru:"Сравните число с израильским барьером.",
    en:"Compare the number with Israel's threshold."},
   {he:"קולות שלא עברו את אחוז החסימה נקראים “קולות אבודים”. ככל שהאחוז גבוה יותר, כך גדל מספרם — וזו הביקורת המרכזית על העלאתו. הסכמי עודפים בין רשימות אינם עוזרים למי שלא עבר את הרף.",
    ar:"تُسمّى الأصوات التي لم تجتز الحسم “أصواتًا ضائعة”. وكلّما ارتفعت النسبة زاد عددها — وهذا النقد المركزيّ لرفعها. واتفاقات فائض الأصوات لا تنفع من لم يجتز العتبة.",
    ru:"Голоса, не преодолевшие барьер, называют «потерянными». Чем выше барьер, тем их больше — в этом главная критика его повышения. Соглашения об излишках голосов не помогают тем, кто не взял планку.",
    en:"Votes that fail the threshold are called “wasted votes”. The higher the threshold, the more of them there are — the central criticism of raising it. Surplus-vote agreements do not help a list that fell short."},

  Q("elect-case2",
    {he:"חברת כנסת מהאופוזיציה מגישה שאילתה לשר על אופן חלוקת תקציב. איזה תפקיד של הכנסת היא ממלאת?",
     ar:"تقدّم عضوة كنيست من المعارضة سؤالًا برلمانيًّا لوزير حول توزيع ميزانية. أيّ وظيفة للكنيست تؤدّيها؟",
     ru:"Депутат от оппозиции подаёт министру запрос о распределении бюджета. Какую функцию Кнессета она исполняет?",
     en:"An opposition member submits a parliamentary question to a minister about how a budget was allocated. Which Knesset function is she performing?"},
   [{he:"תפקיד שיפוטי: היא שופטת את השר על אופן חלוקת התקציב ומחייבת אותו לתקן את החלוקה.",
     ar:"دور قضائيّ: هي تحاكم الوزير على طريقة توزيع الميزانية وتلزمه بتصحيح التوزيع.",
     ru:"Судебная роль: она судит министра за то, как он распределил бюджет, и обязывает его исправить распределение.",
     en:"A judicial role: she judges the minister over the way the budget was divided and orders him to correct it."},
    {he:"תפקיד מכונן: היא מחוקקת חוק יסוד.",
     ar:"وظيفة تأسيسية: تسنّ قانون أساس.",
     ru:"Учредительную: она принимает основной закон.",
     en:"A constituent function: she is enacting a basic law."},
    {he:"תפקיד ביצועי: היא מנהלת את משרד השר.",
     ar:"وظيفة تنفيذية: تدير وزارة الوزير.",
     ru:"Исполнительную: она управляет министерством.",
     en:"An executive function: she is running the minister's office."},
    {he:"תפקיד פיקוח: הכנסת מפקחת על הרשות המבצעת ומחייבת אותה לתת דין וחשבון.",
     ar:"وظيفة رقابية: الكنيست تراقب السلطة التنفيذية وتلزمها بتقديم حساب.",
     ru:"Контрольную: Кнессет надзирает за исполнительной властью и требует отчёта.",
     en:"A supervisory function: the Knesset oversees the executive and requires it to account for itself."}],
   3,
   {he:"היא אינה מחוקקת כאן דבר. מה היא כן עושה כלפי השר?",
    ar:"لا تسنّ هنا شيئًا. فماذا تفعل تجاه الوزير؟",
    ru:"Здесь она ничего не принимает. Что же она делает по отношению к министру?",
    en:"She is not legislating here. So what is she doing towards the minister?"},
   {he:"הפיקוח הפרלמנטרי הוא במידה רבה תפקידה של האופוזיציה: הקואליציה מזוהה עם הממשלה ואינה נוטה לחקור אותה. לכן זכויות האופוזיציה — זמן דיבור, ראשות ועדות ביקורת, זכות לשאילתה — הן חלק מהמנגנון הדמוקרטי ולא נדיבות.",
    ar:"الرقابة البرلمانية في جوهرها وظيفة المعارضة: الائتلاف متماهٍ مع الحكومة ولا يميل لمساءلتها. لذلك حقوق المعارضة — وقت الكلام، رئاسة لجان الرقابة، حقّ السؤال — جزء من الآلية الديمقراطية لا كرم.",
    ru:"Парламентский контроль во многом дело оппозиции: коалиция отождествляется с правительством и не склонна его проверять. Поэтому права оппозиции — время выступлений, председательство в контрольных комиссиях, право запроса — часть демократического механизма, а не любезность.",
    en:"Parliamentary oversight is largely the opposition's job: the coalition identifies with the government and is unlikely to investigate it. That is why opposition rights — speaking time, chairing scrutiny committees, the right to question — are part of the democratic machinery, not a courtesy."},
   null),
  Q("elect-case3",
    {he:"ראש מפלגה קבע לבדו את סדר המועמדים ברשימה, בלי בחירות פנימיות. מהי הבעיה מבחינת עקרונות הדמוקרטיה?",
     ar:"حدّد رئيس حزب وحده ترتيب المرشّحين في القائمة بلا انتخابات داخلية. ما المشكلة من زاوية مبادئ الديمقراطية؟",
     ru:"Лидер партии единолично определил порядок кандидатов в списке без внутренних выборов. В чём проблема с точки зрения демократических принципов?",
     en:"A party leader alone set the order of candidates on the list, with no internal election. What is the problem in terms of democratic principles?"},
   [{he:"אין בעיה: מפלגה היא התאגדות פרטית של חבריה, ומי שאינו מרוצה מסדר הרשימה רשאי לעזוב ולהקים מפלגה משלו — הציבור עצמו מכריע בקלפי בסופו של דבר.",
     ar:"لا مشكلة: الحزب هيئة خاصّة لأعضائه، ومَن لا يرضى بترتيب القائمة يستطيع أن يغادر ويؤسّس حزبًا خاصًّا به — والجمهور نفسه هو الذي يحسم في صندوق الاقتراع في النهاية.",
     ru:"Проблемы нет: партия — частное объединение своих членов, и недовольный порядком списка вправе уйти и создать свою партию, а в конечном счёте решает сам избиратель у урны.",
     en:"There is no problem: a party is a private association of its members, and anyone unhappy with the list order may leave and found his own party — in the end the public decides at the ballot box."},
    {he:"הבעיה היא רק שהרשימה עלולה להפסיד בבחירות.",
     ar:"المشكلة فقط أن القائمة قد تخسر الانتخابات.",
     ru:"Проблема лишь в том, что список может проиграть выборы.",
     en:"The only problem is that the list may lose the election."},
    {he:"בשיטה רשימתית סדר המועמדים קובע מי ייכנס לכנסת. ריכוז ההחלטה בידי אדם אחד פוגע בדמוקרטיה הפנים־מפלגתית ומחליש את אחריותיות הנבחר כלפי חברי המפלגה.",
     ar:"في نظام القوائم يحدّد ترتيب المرشّحين مَن يدخل الكنيست. وتركيز القرار بيد شخص واحد يمسّ الديمقراطية داخل الحزب ويضعف مساءلة المنتخَب أمام أعضائه.",
     ru:"В списочной системе порядок кандидатов решает, кто войдёт в Кнессет. Сосредоточение решения в одних руках подрывает внутрипартийную демократию и ослабляет подотчётность избранного перед членами партии.",
     en:"In a list system the order of candidates decides who enters the Knesset. Concentrating that decision in one person's hands harms internal party democracy and weakens the elected member's accountability to the party's members."},
    {he:"הבעיה היא שהחוק מחייב בחירות פנימיות בכל מפלגה, תמיד.",
     ar:"المشكلة أن القانون يوجب انتخابات داخلية في كلّ حزب دائمًا.",
     ru:"Проблема в том, что закон всегда обязывает партии проводить внутренние выборы.",
     en:"The problem is that the law always requires internal elections in every party."}],
   2,
   {he:"בשיטה רשימתית — למי בעצם הצביע האזרח, ומי קבע את הסדר?",
    ar:"في نظام القوائم — لمن صوّت المواطن فعلًا، ومَن حدّد الترتيب؟",
    ru:"В списочной системе — за кого на деле голосовал гражданин и кто установил порядок?",
    en:"In a list system — whom did the citizen actually vote for, and who set the order?"},
   {he:"החוק בישראל אינו מחייב פריימריז, אך מחייב שהמפלגה תפעל לפי תקנון ושוועדת הבחירות תאשר את הרשימה. מפלגות נבדלות זו מזו: יש פריימריז לחברי מפלגה, יש ועדה מסדרת, ויש מינוי בידי היושב־ראש.",
    ar:"لا يوجب القانون في إسرائيل انتخابات تمهيدية، لكنه يوجب عمل الحزب وفق نظامه الداخليّ ومصادقة لجنة الانتخابات على القائمة. وتتباين الأحزاب: تمهيدية لأعضاء الحزب، أو لجنة ترتيب، أو تعيين من الرئيس.",
    ru:"Израильский закон не обязывает проводить праймериз, но требует, чтобы партия действовала по уставу и чтобы список утвердила избирательная комиссия. Партии различаются: праймериз для членов, «упорядочивающая комиссия» или назначение председателем.",
    en:"Israeli law does not require primaries, but it does require a party to act under its constitution and the list to be approved by the elections committee. Parties differ: primaries for members, an arranging committee, or appointment by the chair."},
   null)
 ],
 [ /* רמה 3 — ניתוח */
  Q("elect-anal1",
    {he:"מוצע להעלות את אחוז החסימה ל-6%. נתחו את הטיעון בעד ואת הטיעון נגד.",
     ar:"يُقترح رفع نسبة الحسم إلى ٦٪. حلّلوا الحجّة مع والحجّة ضدّ.",
     ru:"Предлагается поднять барьер до 6%. Проанализируйте доводы за и против.",
     en:"It is proposed to raise the electoral threshold to 6%. Analyse the argument for and the argument against."},
   [{he:"בעד — פחות מפלגות וממשלה יציבה יותר; נגד — יותר קולות אבודים, ופגיעה חמורה בייצוג קבוצות מיעוט קטנות.",
     ar:"مع — أحزاب أقلّ وحكومة أكثر استقرارًا؛ ضدّ — أصوات ضائعة أكثر ومساس شديد بتمثيل مجموعات أقلية صغيرة.",
     ru:"За — меньше партий и устойчивее правительство; против — больше потерянных голосов и серьёзный удар по представительству малых меньшинств.",
     en:"For — fewer parties and a more stable government; against — more wasted votes and serious harm to the representation of small minority groups."},
    {he:"בעד — הבחירות יעלו פחות כסף; נגד — ספירת הקולות תארך יותר.",
     ar:"مع — الانتخابات أقلّ كلفة؛ ضدّ — فرز الأصوات يطول.",
     ru:"За — выборы обойдутся дешевле; против — подсчёт голосов затянется.",
     en:"For — the election will cost less; against — counting will take longer."},
    {he:"בעד — יותר מפלגות ייכנסו לכנסת והייצוג יתרחב; נגד — הממשלה תתחלף לעיתים קרובות ולא תוכל לתכנן לטווח ארוך.",
     ar:"معه — ستدخل أحزاب أكثر إلى الكنيست ويتّسع التمثيل؛ ضدّه — ستتبدّل الحكومة مرارًا ولن تتمكّن من التخطيط بعيد المدى.",
     ru:"За — в Кнессет пройдёт больше партий и представительство расширится; против — правительство будет часто меняться и не сможет планировать надолго.",
     en:"For — more parties will enter the Knesset and representation will widen; against — the government will change often and will not be able to plan for the long term."},
    {he:"בעד — השיטה תהפוך לאזורית; נגד — יידרש תיקון בחוק־יסוד: השפיטה.",
     ar:"مع — يتحوّل النظام إقليميًّا؛ ضدّ — يلزم تعديل قانون أساس: القضاء.",
     ru:"За — система станет окружной; против — понадобится поправка к Основному закону о судебной власти.",
     en:"For — the system becomes regional; against — it would require amending Basic Law: the Judiciary."}],
   0,
   {he:"מה מרוויחים ביציבות, ומה מפסידים בייצוג? זו אותה מטבע.",
    ar:"ماذا نربح في الاستقرار وماذا نخسر في التمثيل؟ إنها العملة ذاتها.",
    ru:"Что выигрывается в устойчивости и что теряется в представительности? Это одна и та же монета.",
    en:"What is gained in stability, and what is lost in representation? They are two sides of one coin."},
   {he:"זהו מתח קלאסי בין ייצוגיות ליעילות הממשל. חשוב לשים לב שההשפעה אינה שווה: רף גבוה פוגע קודם כול במפלגות של מיעוטים ושל קבוצות פרוסות דק — ולכן זו גם שאלה של שוויון ולא רק של יעילות.",
    ar:"هذا توتّر كلاسيكيّ بين التمثيل وفاعلية الحكم. والمهمّ أن الأثر ليس متساويًا: العتبة العالية تضرب أولًا أحزاب الأقليات والمجموعات المنتشرة رقيقًا — فهي مسألة مساواة لا فاعلية فحسب.",
    ru:"Это классическое напряжение между представительностью и эффективностью управления. Важно, что эффект неравномерен: высокий барьер бьёт прежде всего по партиям меньшинств и рассеянных групп — значит, это и вопрос равенства, а не только эффективности.",
    en:"This is the classic tension between representation and effective government. Note that the effect is not evenly spread: a high bar hits first the parties of minorities and thinly spread groups — so it is a question of equality too, not only of efficiency."},
   null),
  Q("elect-anal2",
    {he:"מדוע ריבוי מפלגות בשיטה יחסית מגדיל את כוחן של מפלגות קטנות מעבר לגודלן?",
     ar:"لماذا تُكبِر كثرةُ الأحزاب في النظام النسبيّ قوّةَ الأحزاب الصغيرة فوق حجمها؟",
     ru:"Почему множество партий при пропорциональной системе усиливает малые партии сверх их размера?",
     en:"Why does a multiplicity of parties under a proportional system give small parties power beyond their size?"},
   [{he:"מפני שהחוק מחייב לתת להן משרדי ממשלה.",
     ar:"لأن القانون يوجب منحها وزارات.",
     ru:"Потому что закон обязывает давать им министерства.",
     en:"Because the law requires giving them ministries."},
    {he:"מפני שאין רשימה בעלת רוב עצמאי, וכל מפלגה שקולותיה נחוצים להשלמת 61 יכולה להתנות את הצטרפותה בדרישות.",
     ar:"لأن لا قائمة تملك أغلبية مستقلّة، وكلّ حزب أصواته لازمة لإكمال ٦١ يستطيع اشتراط مطالب لانضمامه.",
     ru:"Потому что ни у одного списка нет самостоятельного большинства, и любая партия, чьи голоса нужны для 61, может выдвинуть условия.",
     en:"Because no list has a majority of its own, and any party whose votes are needed to reach 61 can attach conditions to joining."},
    {he:"מפני שמפלגות קטנות מקבלות יותר זמן שידור בתעמולה ומימון ציבורי גבוה יחסית לגודלן, וכך השפעתן על סדר היום גדלה.",
     ar:"لأنّ الأحزاب الصغيرة تحصل على وقت بثّ دعائيّ أكبر وتمويل عامّ مرتفع نسبةً إلى حجمها، فيتّسع تأثيرها على جدول الأعمال.",
     ru:"Потому что малые партии получают больше эфирного времени в агитации и относительно большое государственное финансирование, и их влияние на повестку растёт.",
     en:"Because small parties get more campaign broadcast time and relatively large public funding, so their influence over the agenda grows."},
    {he:"מפני שאחוז החסימה אינו חל עליהן.",
     ar:"لأن نسبة الحسم لا تسري عليها.",
     ru:"Потому что барьер на них не распространяется.",
     en:"Because the threshold does not apply to them."}],
   1,
   {he:"כמה מנדטים דרושים לממשלה, וכמה יש למפלגה הגדולה בפועל?",
    ar:"كم مقعدًا تلزم الحكومة، وكم للحزب الأكبر فعليًّا؟",
    ru:"Сколько мандатов нужно правительству и сколько на деле у крупнейшей партии?",
    en:"How many seats does a government need, and how many does the largest party actually hold?"},
   {he:"זה מכונה “כוח סחיטה קואליציוני”. הוא אינו פגם בשיטה אלא תוצאה ישירה שלה, והוא הטיעון המרכזי בעד רפורמות ממשל — אחוז חסימה גבוה, בחירות אזוריות או ממשלה נבחרת ישירות. לכל אחת מהן מחיר משלה בייצוגיות.",
    ar:"يُسمّى هذا “قوّة الابتزاز الائتلافيّ”. ليس عيبًا في النظام بل نتيجة مباشرة له، وهو الحجّة المركزية لإصلاحات الحكم — عتبة أعلى، انتخابات إقليمية، أو حكومة منتخبة مباشرة. ولكلٍّ ثمنه في التمثيل.",
    ru:"Это называют «коалиционной силой шантажа». Это не изъян системы, а её прямое следствие, и главный довод за реформы управления — высокий барьер, окружные выборы или прямо избираемое правительство. У каждой из них своя цена в представительности.",
    en:"This is called coalition blackmail power. It is not a flaw in the system but a direct result of it, and the central argument for governance reforms — a higher threshold, regional elections, or a directly elected government. Each carries its own price in representation."},
   null),
  Q("elect-anal3",
    {he:"בשנות התשעים נבחר ראש הממשלה בישראל בבחירה ישירה, והשיטה בוטלה. מה לימד הניסיון הזה?",
     ar:"في التسعينيات انتُخب رئيس الحكومة في إسرائيل انتخابًا مباشرًا، ثم أُلغي النظام. ماذا علّمت هذه التجربة؟",
     ru:"В 1990-е главу правительства Израиля избирали напрямую, но систему отменили. Чему научил этот опыт?",
     en:"In the 1990s Israel's prime minister was directly elected, and the system was abolished. What did that experiment teach?"},
   [{he:"שהבחירה הישירה מנעה לחלוטין קואליציות: ראש הממשלה יכול היה למנות ממשלה מטעמו בלי להישען על רוב בכנסת, ולכן השיטה בוטלה.",
     ar:"أنّ الانتخاب المباشر منع الائتلافات تمامًا: إذ استطاع رئيس الحكومة تعيين حكومة من طرفه دون الاستناد إلى أغلبية في الكنيست، ولذلك أُلغيت الطريقة.",
     ru:"Что прямые выборы полностью устранили коалиции: премьер мог назначить своё правительство, не опираясь на большинство в Кнессете, поэтому систему отменили.",
     en:"That direct election abolished coalitions altogether: the prime minister could appoint a government of his own without relying on a Knesset majority, and that is why the system was scrapped."},
    {he:"שהמצביעים פיצלו את הפתק: הצביעו לראש ממשלה מצד אחד ולמפלגה קטנה מצד שני, וכך המפלגות הגדולות נחלשו וכוח המיקוח של הקטנות גדל.",
     ar:"أن الناخبين شطروا التصويت: لرئيس حكومة من جهة ولحزب صغير من جهة أخرى، فضعفت الأحزاب الكبيرة وازدادت قوّة مساومة الصغيرة.",
     ru:"Что избиратели расщепили голос: за премьера с одной стороны и за малую партию с другой, отчего крупные партии ослабли, а торг малых усилился.",
     en:"That voters split their ballot: one vote for prime minister and another for a small party, so the big parties weakened and the small ones' bargaining power grew."},
    {he:"שהשיטה חייבה כתיבת חוקה מלאה.",
     ar:"أن النظام أوجب كتابة دستور كامل.",
     ru:"Что система потребовала написать полную конституцию.",
     en:"That the system required writing a full constitution."},
    {he:"שהשיטה העלתה את אחוז ההצבעה מעל תשעים אחוז.",
     ar:"أن النظام رفع نسبة التصويت فوق تسعين بالمئة.",
     ru:"Что система подняла явку выше девяноста процентов.",
     en:"That the system pushed turnout above ninety per cent."}],
   1,
   {he:"כשיש שני פתקים, אפשר להצביע בשניהם אחרת. מה זה עשה למפלגות הגדולות?",
    ar:"حين يوجد ورقتان يمكن التصويت في كلٍّ بشكل مختلف. ماذا فعل ذلك بالأحزاب الكبيرة؟",
    ru:"Когда бюллетеня два, в каждом можно голосовать по-разному. Что это сделало с крупными партиями?",
    en:"With two ballots you can vote differently in each. What did that do to the big parties?"},
   {he:"הלקח המרכזי הוא שרפורמה במוסד אחד משנה התנהגות במוסד אחר. שיטה שנועדה לחזק את ראש הממשלה החלישה את מפלגתו, ולכן החלישה גם אותו — דוגמה לכך שכללי משחק אינם ניטרליים.",
    ar:"الدرس المركزيّ أن إصلاح مؤسّسة واحدة يغيّر السلوك في أخرى. نظام قُصد به تقوية رئيس الحكومة أضعف حزبه، فأضعفه هو أيضًا — مثال على أن قواعد اللعبة ليست محايدة.",
    ru:"Главный урок: реформа одного института меняет поведение в другом. Система, задуманная усилить премьера, ослабила его партию, а значит и его самого — пример того, что правила игры не нейтральны.",
    en:"The main lesson is that reforming one institution changes behaviour in another. A system meant to strengthen the prime minister weakened his party, and so weakened him — an example of how rules of the game are never neutral."},
   null)
 ]
]);

 [ /* רמה 1 — ידע */

   1,

    ru:"Одна должность в государстве почти целиком представительская, и всё же здесь у неё есть реальное решение.",

   {he:"הנשיא מטיל את התפקיד על חבר הכנסת שלדעתו סיכוייו הטובים ביותר להרכיב ממשלה — לא בהכרח ראש הסיעה הגדולה. לאחר מכן הממשלה חייבת לקבל את אמון הכנסת ברוב של 61 לפחות.",

    ru:"Президент поручает это депутату, у которого, по его мнению, наилучшие шансы сформировать правительство, — не обязательно лидеру крупнейшей фракции. Затем правительство должно получить доверие Кнессета не менее чем 61 голосом.",

     en:"What is ministerial responsibility?"},
   [{he:"חובת השר לפצות מכיסו על נזק שנגרם במשרדו.",

     ar:"واجب الوزير أن يوقّع شخصيًّا على كلّ مستند يصدر عن وزارته، كي يعرف ما يجري فيها ويستطيع منع الأخطاء مسبقًا.",
     ru:"Обязанность министра лично подписывать каждый документ, выходящий из министерства, чтобы знать, что там делается, и заранее останавливать ошибки.",
     en:"The minister's duty to sign personally every document leaving his ministry, so that he knows what is done there and can stop mistakes in advance."},
    {he:"אחריות השר כלפי הכנסת והציבור לכל הנעשה במשרדו, גם למעשה של פקיד שלא ידע עליו.",
     ar:"مسؤولية الوزير أمام الكنيست والجمهور عن كلّ ما يجري في وزارته، حتى فعل موظّف لم يعلم به.",
     ru:"Ответственность министра перед Кнессетом и обществом за всё происходящее в его ведомстве, даже за действие чиновника, о котором он не знал.",
     en:"The minister's answerability to the Knesset and the public for everything done in his ministry, including an official's act he never knew of."},
    {he:"אחריות השר להצביע עם הקואליציה בכל הצבעה.",
     ar:"مسؤولية الوزير بالتصويت مع الائتلاف في كلّ اقتراع.",
     ru:"Обязанность министра голосовать с коалицией при любом голосовании.",
     en:"The minister's duty to vote with the coalition in every division."}],
   2,
   {he:"בפני מי השר נותן דין וחשבון, ועל מה בדיוק?",
    ar:"أمام مَن يقدّم الوزير حسابه، وعلى ماذا بالضبط؟",
    ru:"Перед кем министр отчитывается и за что именно?",
    en:"To whom does a minister answer, and for what exactly?"},
   {he:"האחריות המיניסטריאלית היא הצד השני של הפיקוח הפרלמנטרי: מפני שהשר אחראי, יש למי לפנות. היא כוללת אחריות ציבורית — התפטרות במקרים חמורים — ולא רק אחריות משפטית.",
    ar:"المسؤولية الوزارية هي الوجه الآخر للرقابة البرلمانية: لأن الوزير مسؤول، ثمّة مَن يُسأل. وتشمل مسؤولية عامّة — الاستقالة في الحالات الجسيمة — لا مسؤولية قانونية فحسب.",
    ru:"Министерская ответственность — обратная сторона парламентского контроля: раз министр отвечает, есть с кого спросить. Она включает и публичную ответственность — отставку в тяжёлых случаях, — а не только юридическую.",

   null),
  Q("exec-indep",
    {he:"מה מבטיח את עצמאות השופטים בישראל?",

     ru:"Что обеспечивает независимость судей в Израиле?",
     en:"What secures judicial independence in Israel?"},
   [{he:"השופטים נבחרים בבחירות כלליות אחת לארבע שנים.",
     ar:"يُنتخب القضاة في انتخابات عامّة كلّ أربع سنوات.",

     ar:"تعيين بلجنة اختيار القضاة، وولاية حتى سنّ التقاعد، ومنع التدخّل في التقدير القضائيّ.",

     ru:"Назначение одним министром юстиции на четыре года с возможностью продления и с утверждением комиссии Кнессета по конституции.",
     en:"Appointment by the justice minister alone for a renewable four-year term, subject to approval by the Knesset constitution committee."},
    {he:"בחירה בידי לשכת עורכי הדין בלבד.",

   1,
   {he:"שופט שיודע שיפוטר אחרי פסק דין לא נוח — האם הוא עצמאי?",

   {he:"הוועדה לבחירת שופטים מונה תשעה חברים: שלושה שופטי עליון, שני שרים, שני חברי כנסת ושני נציגי לשכת עורכי הדין. ההרכב המעורב נועד למנוע שליטה של גורם אחד — פוליטי או מקצועי — במינויים.",
    ar:"لجنة اختيار القضاة تسعة أعضاء: ثلاثة قضاة عليا، وزيران، عضوا كنيست، وممثّلان لنقابة المحامين. والتركيبة المختلطة تمنع سيطرة جهة واحدة — سياسية أو مهنية — على التعيينات.",
    ru:"Комиссия по отбору судей состоит из девяти членов: три судьи Верховного суда, два министра, два депутата и два представителя коллегии адвокатов. Смешанный состав не даёт одной стороне — политической или профессиональной — контролировать назначения.",
