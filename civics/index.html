  Q("ty-1-02",{"he": "מה עומד במרכז הגישה הליברלית לדמוקרטיה?", "ar": "ما الذي يقف في مركز النهج الليبراليّ للديمقراطية؟", "ru": "Что находится в центре либерального подхода к демократии?", "en": "What is at the centre of the liberal approach to democracy?"},[{"he": "הפרט, הזכויות שלו והחירות שלו לבחור את דרכו.", "ar": "الفرد وحقوقه وحرّيته في اختيار طريقه.", "ru": "Личность, её права и свобода выбирать свой путь.", "en": "The individual, their rights and their freedom to choose their own path."}, {"he": "טובת הכלל, שהפרט צריך לוותר למענה על רצונותיו.", "ar": "مصلحة المجموع، التي على الفرد أن يتنازل من أجلها عن رغباته.", "ru": "Общее благо, ради которого человек должен отказаться от своих желаний.", "en": "The common good, for which the individual must give up their wishes."}, {"he": "הדת, שקובעת את כללי ההתנהגות הנכונים לכל האזרחים ומכתיבה את חוקי המדינה.", "ar": "الدين، الذي يحدّد قواعد السلوك الصحيحة لجميع المواطنين ويُملي قوانين الدولة.", "ru": "Религия, которая устанавливает правила поведения для всех граждан и диктует законы государства.", "en": "Religion, which sets the proper rules of behaviour for all citizens and dictates the state's laws."}, {"he": "המדינה, שהיא חשובה יותר מכל אזרח.", "ar": "الدولة، فهي أهمّ من أيّ مواطن.", "ru": "Государство, которое важнее любого гражданина.", "en": "The state, which matters more than any citizen."}],0,{"he": "המילה \"ליברלי\" קרובה למילה הלטינית \"חופשי\".", "ar": "كلمة \"ليبراليّ\" قريبة من الكلمة اللاتينية التي تعني \"حرّ\".", "ru": "Слово «либеральный» близко к латинскому слову «свободный».", "en": "The word \"liberal\" is close to the Latin word for \"free\"."},{"he": "לפי הגישה הליברלית, המדינה קיימת כדי לשרת את האדם. תפקידה העיקרי הוא להגן על זכויותיו ועל חירותו. כל אדם מחליט בעצמו מהם חיים טובים עבורו.", "ar": "وفق النهج الليبراليّ، توجد الدولة لتخدم الإنسان. ومهمّتها الأساسية حماية حقوقه وحرّيته. وكلّ إنسان يقرّر بنفسه ما هي الحياة الجيّدة بالنسبة إليه.", "ru": "Согласно либеральному подходу, государство существует, чтобы служить человеку. Его главная задача — защищать его права и свободу. Каждый сам решает, какая жизнь для него хорошая.", "en": "In the liberal approach, the state exists to serve the person. Its main task is to protect their rights and freedom. Each person decides for themselves what a good life is."},null),
  Q("ty-1-03",{"he": "מה מדגישה הגישה הרפובליקנית לדמוקרטיה?", "ar": "ماذا يُبرز النهج الجمهوريّ للديمقراطية؟", "ru": "Что подчёркивает республиканский подход к демократии?", "en": "What does the republican approach to democracy emphasise?"},[{"he": "שלטון של נשיא נבחר, ולא של מלך.", "ar": "حكم رئيس منتخب، لا حكم ملك.", "ru": "Правление избранного президента, а не короля.", "en": "Rule by an elected president, not by a king."}, {"he": "השתתפות פעילה של האזרחים בחיים הציבוריים ומחויבות לטובת הכלל.", "ar": "مشاركة المواطنين الفعّالة في الحياة العامّة والالتزام بمصلحة المجموع.", "ru": "Активное участие граждан в общественной жизни и приверженность общему благу.", "en": "Citizens' active participation in public life and commitment to the common good."}, {"he": "חירות הפרט בלי שום מחויבות לקהילה.", "ar": "حرية الفرد دون أيّ التزام تجاه المجتمع.", "ru": "Свобода личности без всяких обязательств перед обществом.", "en": "Individual freedom with no commitment to the community."}, {"he": "הגנה על הרכוש הפרטי מכל התערבות של המדינה, גם כשהמדינה פועלת למען טובת הציבור כולו.", "ar": "حماية الملكية الخاصّة من أيّ تدخّل للدولة، حتى عندما تعمل الدولة لمصلحة الجمهور كلّه.", "ru": "Защита частной собственности от любого вмешательства государства, даже когда оно действует ради блага всего общества.", "en": "Protecting private property from any state interference, even when the state acts for the good of the whole public."}],1,{"he": "כאן השם מטעה. חשבו על אזרח שאכפת לו מהקהילה.", "ar": "هنا الاسم مضلِّل. فكّروا في مواطن يهتمّ بمجتمعه.", "ru": "Здесь название обманчиво. Подумайте о гражданине, которому небезразлично его сообщество.", "en": "The name is misleading here. Think of a citizen who cares about the community."},{"he": "הגישה הרפובליקנית רואה באזרח שותף, ולא רק בעל זכויות. אזרח טוב מעורב, מתנדב ופועל למען הכלל. השם אינו קשור לשאלה אם בראש המדינה עומד נשיא.", "ar": "النهج الجمهوريّ يرى في المواطن شريكًا، لا صاحب حقوق فقط. فالمواطن الصالح مشارك ومتطوّع ويعمل من أجل المجموع. ولا علاقة للاسم بمسألة هل يرأس الدولة رئيس.", "ru": "Республиканский подход видит в гражданине участника, а не только носителя прав. Хороший гражданин вовлечён, помогает добровольно и действует ради общего блага. Название не связано с тем, стоит ли во главе государства президент.", "en": "The republican approach sees the citizen as a partner, not only a holder of rights. A good citizen is involved, volunteers and acts for the common good. The name has nothing to do with whether a president heads the state."},null),
  Q("ty-1-04",{"he": "איזה מאפיין מתאים לתפיסה הפורמלית של הדמוקרטיה?", "ar": "أيّ سمة تناسب التصوّر الشكليّ للديمقراطية؟", "ru": "Какая черта соответствует формальному пониманию демократии?", "en": "Which feature fits the formal view of democracy?"},[{"he": "הגנה על זכויות המיעוט מפני החלטות הרוב.", "ar": "حماية حقوق الأقلية من قرارات الأغلبية.", "ru": "Защита прав меньшинства от решений большинства.", "en": "Protecting minority rights from majority decisions."}, {"he": "שוויון חברתי וכלכלי בין כל האזרחים, כולל צמצום פערים בהכנסה.", "ar": "مساواة اجتماعية واقتصادية بين جميع المواطنين، بما في ذلك تقليص الفجوات في الدخل.", "ru": "Социальное и экономическое равенство всех граждан, включая сокращение разрыва в доходах.", "en": "Social and economic equality among all citizens, including narrowing income gaps."}, {"he": "סובלנות ופלורליזם בחברה.", "ar": "التسامح والتعدّدية في المجتمع.", "ru": "Терпимость и плюрализм в обществе.", "en": "Tolerance and pluralism in society."}, {"he": "בחירות תקופתיות לפי כללים קבועים.", "ar": "انتخابات دورية وفق قواعد ثابتة.", "ru": "Периодические выборы по постоянным правилам.", "en": "Periodic elections under fixed rules."}],3,{"he": "\"פורמלי\" נוגע לצורה ולהליך, ולא לתוכן.", "ar": "\"شكليّ\" يتعلّق بالشكل والإجراء، لا بالمضمون.", "ru": "«Формальное» касается формы и процедуры, а не содержания.", "en": "\"Formal\" is about form and procedure, not content."},{"he": "התפיסה הפורמלית שואלת איך מחליטים: בחירות, הכרעת רוב וכללים ידועים מראש. זכויות, סובלנות ושוויון שייכים לתפיסה המהותית. היא שואלת מה מותר להחליט.", "ar": "التصوّر الشكليّ يسأل كيف نقرّر: الانتخابات، وحكم الأغلبية، وقواعد معروفة مسبقًا. أمّا الحقوق والتسامح والمساواة فتنتمي إلى التصوّر الجوهريّ. وهو يسأل ماذا يجوز أن نقرّر.", "ru": "Формальное понимание спрашивает, как принимаются решения: выборы, решение большинства и заранее известные правила. Права, терпимость и равенство относятся к содержательному пониманию. Оно спрашивает, что можно решать.", "en": "The formal view asks how decisions are made: elections, majority rule and rules known in advance. Rights, tolerance and equality belong to the substantive view. It asks what may be decided."},null)
 ],
 [ /* רמה 2 — הבנה */
  Q("types-case1",
    {he:"במדינה מסוימת מתקיימות בחירות כל ארבע שנים, אך ערוץ הטלוויזיה היחיד שייך למפלגת השלטון ומועמדי האופוזיציה אינם מקבלים בו זמן שידור. איך תסווגו את המשטר?",
     ar:"في دولة ما تجري انتخابات كلّ أربع سنوات، لكن القناة التلفزيونية الوحيدة ملك للحزب الحاكم ولا يحصل مرشّحو المعارضة على وقت بثّ. كيف تصنّفون النظام؟",
     ru:"В некой стране выборы проходят каждые четыре года, но единственный телеканал принадлежит правящей партии, и кандидаты оппозиции не получают эфира. Как вы классифицируете режим?",
     en:"In a certain country elections are held every four years, but the only television channel belongs to the ruling party and opposition candidates get no airtime. How would you classify the regime?"},
   [{he:"דמוקרטיה מלאה, מפני שהבחירות מתקיימות במועדן ואיש אינו מנוע מלהצביע או מלהתמודד בהן; זמן שידור אינו תנאי דמוקרטי.",
     ar:"ديمقراطية كاملة، لأنّ الانتخابات تجري في موعدها ولا أحد ممنوع من التصويت أو الترشّح فيها؛ ووقت البثّ ليس شرطًا ديمقراطيًّا.",
     ru:"Полная демократия, потому что выборы проходят в срок и никому не запрещено голосовать или баллотироваться; эфирное время не является демократическим условием.",
     en:"A full democracy, because elections are held on time and no one is barred from voting or running; broadcast time is not a democratic condition."},
    {he:"אינו דמוקרטי: מתקיים הליך בחירות, אך התחרות אינה הוגנת ואין לציבור מידע חלופי — כלומר יש צורה בלי מהות.",
     ar:"غير ديمقراطيّ: يجري إجراء انتخابيّ، لكن المنافسة غير عادلة ولا معلومات بديلة للجمهور، أي صورة بلا جوهر.",
     ru:"Недемократический: процедура выборов есть, но конкуренция нечестна и у общества нет альтернативной информации: форма без содержания.",
     en:"Not democratic: an electoral procedure exists, but the competition is unfair and the public has no alternative information: form without substance."},
    {he:"דמוקרטיה מהותית — מפני שהמדינה מממנת ערוץ ציבורי שבו מוצגות עמדות שונות, וזה מבטיח את מהות התחרות גם בלי שוויון בזמן השידור.",
     ar:"ديمقراطية جوهرية، لأنّ الدولة تموّل قناة عامّة تُعرض فيها مواقف مختلفة، وهذا يضمن جوهر التنافس حتى دون مساواة في وقت البثّ.",
     ru:"Содержательная демократия: поскольку государство финансирует общественный канал, где звучат разные позиции, и это обеспечивает суть конкуренции даже без равенства эфирного времени.",
     en:"A substantive democracy, because the state funds a public channel where different positions are aired, and that secures the essence of competition even without equal broadcast time."},
    {he:"אי אפשר לקבוע בלי לדעת את שיעור ההצבעה.",
     ar:"لا يمكن الحسم دون معرفة نسبة التصويت.",
     ru:"Определить нельзя, не зная явки.",
     en:"It cannot be determined without knowing the turnout."}],
   1,
   {he:"שאלו אם למצביע יש בכלל דרך לדעת מה מציעה האופוזיציה.",
    ar:"اسألوا إن كان للناخب أصلًا سبيل لمعرفة ما تطرحه المعارضة.",
    ru:"Спросите, есть ли у избирателя вообще способ узнать, что предлагает оппозиция.",
    en:"Ask whether the voter has any way at all of learning what the opposition offers."},
   {he:"בחירות חופשיות אינן רק יום הבחירות. הן כוללות תקופת בחירות שבה יש גישה שווה לתקשורת, חופש התאגדות וחופש ביטוי. בלעדיהם ההצבעה היא טקס, לא בחירה.",
    ar:"الانتخابات الحرّة ليست يوم الاقتراع فقط، بل تشمل فترة انتخابية فيها وصول متساوٍ إلى الإعلام وحرّية تنظيم وتعبير. بدونها التصويت طقس لا اختيار.",
    ru:"Свободные выборы: не только день голосования. Они включают предвыборный период с равным доступом к СМИ, свободой объединений и слова. Без этого голосование: ритуал, а не выбор.",
    en:"Free elections are not only election day. They include a campaign period with equal access to the media, freedom of association and freedom of expression. Without those, voting is a ceremony, not a choice."},
   null),
  Q("types-case2",
    {he:"פרלמנט נבחר כדין החליט ברוב של 61 מתוך 120 לבטל את זכות ההצבעה של קבוצת מיעוט. מה נכון לומר?",
     ar:"قرّر برلمان منتخب حسب الأصول، بأغلبية ٦١ من ١٢٠، إلغاء حقّ التصويت لمجموعة أقلية. ما القول الصحيح؟",
     ru:"Законно избранный парламент большинством 61 из 120 решил лишить группу меньшинства права голоса. Что верно сказать?",
     en:"A lawfully elected parliament decided, by 61 votes out of 120, to abolish the voting rights of a minority group. What is correct to say?"},
   [{he:"ההחלטה דמוקרטית — מפני שהתקבלה ברוב חוקי בפרלמנט נבחר, וכל עוד ההליך תקין אין ערכאה שרשאית להתערב בתוכנה.",
     ar:"القرار ديمقراطيّ، لأنّه اتُّخذ بأغلبية قانونية في برلمان منتخَب، وما دام الإجراء سليمًا فلا جهة قضائية يحقّ لها التدخّل في مضمونه.",
     ru:"Решение демократично: поскольку принято законным большинством в избранном парламенте, и пока процедура соблюдена, ни одна инстанция не вправе вмешиваться в его содержание.",
     en:"The decision is democratic, since it passed by a lawful majority in an elected parliament, and as long as the procedure was proper no court may interfere with its content."},
    {he:"ההחלטה בטלה מאליה, מפני שרוב של 61 אינו רוב.",
     ar:"القرار باطل تلقائيًّا لأن أغلبية ٦١ ليست أغلبية.",
     ru:"Решение ничтожно само по себе, ведь 61: не большинство.",
     en:"The decision is void of itself, because 61 is not a majority."},
    {he:"ההליך היה תקין מבחינה פורמלית, אך התוכן מנוגד לדמוקרטיה המהותית — שלילת זכות בסיסית מקבוצה בשל השתייכותה.",
     ar:"الإجراء سليم شكليًّا، لكن المضمون يناقض الديمقراطية الجوهرية، سلب حقّ أساسيّ من مجموعة بسبب انتمائها.",
     ru:"Процедура формально безупречна, но содержание противоречит содержательной демократии: лишение группы базового права из-за её принадлежности.",
     en:"The procedure was formally proper, but the content contradicts substantive democracy: stripping a group of a basic right because of who they are."},
    {he:"מדובר בהחלטה מנהלית ולא בחקיקה.",
     ar:"يتعلّق الأمر بقرار إداريّ لا بتشريع.",
     ru:"Это административное решение, а не законодательство.",
     en:"This is an administrative decision, not legislation."}],
   2,
   {he:"הפרידו בין השאלה “איך התקבלה ההחלטה” לשאלה “מה היא אומרת”.",
    ar:"افصلوا بين سؤال “كيف اتُّخذ القرار” وسؤال “ماذا يقول”.",
    ru:"Разделите вопрос «как принято решение» и вопрос «что оно говорит».",
    en:"Separate the question “how was the decision taken” from the question “what does it say”."},
   {he:"זהו המקרה הקלאסי שבו הליך תקין מייצר תוצאה בלתי דמוקרטית. הוא מסביר למה דמוקרטיות מעגנות זכויות בחוקה או בחוקי יסוד: כדי שרוב זמני לא יוכל לשנות את כללי המשחק בעצמו.",
    ar:"هذه هي الحالة الكلاسيكية التي يُنتج فيها إجراء سليم نتيجة غير ديمقراطية. وهي تفسّر لماذا ترسّخ الديمقراطيات الحقوق في دستور أو قوانين أساس: كي لا تستطيع أغلبية مؤقّتة تغيير قواعد اللعبة بنفسها.",
    ru:"Это классический случай, когда безупречная процедура даёт недемократический результат. Он объясняет, почему демократии закрепляют права в конституции или основных законах: чтобы временное большинство не могло само переписать правила игры.",
    en:"This is the classic case in which a proper procedure produces an undemocratic result. It explains why democracies entrench rights in a constitution or basic laws: so that a temporary majority cannot rewrite the rules of the game by itself."},
   null),
  Q("types-case3",
    {he:"מדינה מבטלת את בית המשפט העליון וקובעת שהפרלמנט הוא הפוסק האחרון בכל שאלה. מה הסיכון הדמוקרטי המרכזי?",
     ar:"تلغي دولة محكمتها العليا وتقرّر أن البرلمان هو الفاصل الأخير في كلّ مسألة. ما الخطر الديمقراطيّ المركزيّ؟",
     ru:"Государство упраздняет Верховный суд и постановляет, что парламент: последняя инстанция по любому вопросу. В чём главный демократический риск?",
     en:"A state abolishes its supreme court and rules that parliament has the final word on every question. What is the main democratic risk?"},
   [{he:"הסיכון הוא שהפרלמנט יעסוק בתיקים פרטניים במקום בחקיקה.",
     ar:"الخطر هو أن ينشغل البرلمان بملفّات فردية بدل التشريع.",
     ru:"Риск в том, что парламент займётся отдельными делами вместо законотворчества.",
     en:"The risk is that parliament will handle individual cases instead of legislating."},
    {he:"אין סיכון: פרלמנט נבחר מייצג את העם, ואם יטעה יחליף אותו הציבור בבחירות הבאות — וזה הבלם הדמוקרטי היחיד הדרוש.",
     ar:"لا خطر: البرلمان المنتخَب يمثّل الشعب، وإن أخطأ فسيستبدله الجمهور في الانتخابات القادمة، وهذا هو الكابح الديمقراطيّ الوحيد المطلوب.",
     ru:"Риска нет: избранный парламент представляет народ, а если ошибётся, общество сменит его на следующих выборах, и это единственный нужный демократический тормоз.",
     en:"There is no risk: an elected parliament represents the people, and if it errs the public will replace it at the next election. That is the only democratic check needed."},
    {he:"הסיכון הוא שהמדינה תאבד חברות בארגונים בינלאומיים המתנים אותה בקיום ביקורת שיפוטית, ותיפגע יכולתה להגן על אזרחיה בחו״ל.",
     ar:"الخطر هو أن تفقد الدولة عضويتها في منظّمات دولية تشترط وجود رقابة قضائية، فتتضرّر قدرتها على حماية مواطنيها في الخارج.",
     ru:"Риск в том, что государство лишится членства в международных организациях, которые требуют судебного контроля, и ослабнет его способность защищать граждан за рубежом.",
     en:"The risk is that the state will lose membership in international bodies that require judicial review, weakening its ability to protect its citizens abroad."},
    {he:"נשארת רשות אחת בלי בלם: אין מי שיבחן אם חוק פוגע בזכויות, והמיעוט מאבד את הכתובת היחידה שאינה תלויה ברוב.",
     ar:"تبقى سلطة واحدة بلا كابح: لا أحد يفحص إن كان القانون يمسّ الحقوق، وتفقد الأقلية العنوان الوحيد غير التابع للأغلبية.",
     ru:"Остаётся одна власть без тормоза: некому проверить, нарушает ли закон права, и меньшинство теряет единственную инстанцию, не зависящую от большинства.",
     en:"One branch is left with no brake: nobody examines whether a law violates rights, and the minority loses the one address that does not depend on the majority."}],
   3,
   {he:"חשבו לאן פונה מי שנפגע מחוק, אחרי הביטול.",
    ar:"فكّروا إلى أين يتوجّه من تضرّر من قانون، بعد الإلغاء.",
    ru:"Подумайте, куда обратится пострадавший от закона после упразднения.",
    en:"Think where someone harmed by a law goes, after the abolition."},
   {he:"ביקורת שיפוטית היא הבלם שהופך זכויות מהצהרה למגן. אפשר לעצב אותה אחרת — הרכב שונה, רוב מיוחד, עילות מצומצמות — אבל ביטולה המוחלט מותיר את הרוב ללא כל מגבלה מוסדית.",
    ar:"الرقابة القضائية هي الكابح الذي يحوّل الحقوق من إعلان إلى درع. يمكن تصميمها بشكل آخر، تركيبة مختلفة، أغلبية خاصة، أسباب محصورة، لكن إلغاءها التامّ يترك الأغلبية بلا أيّ قيد مؤسّسيّ.",
    ru:"Судебный контроль: тормоз, превращающий права из декларации в щит. Его можно устроить иначе: иной состав, особое большинство, узкие основания, но полная отмена оставляет большинство без всякого институционального ограничения.",
    en:"Judicial review is the brake that turns rights from a declaration into a shield. It can be designed differently: a different bench, a special majority, narrower grounds, but abolishing it altogether leaves the majority with no institutional limit at all."},
   null),
  Q("ty-2-01",{"he": "עירייה מעודדת תושבים להתנדב בשכונה, ומקיימת אספות תושבים קבועות על תקציב העיר. איזו גישה מתבטאת כאן?", "ar": "تشجّع بلدية السكّان على التطوّع في الحيّ، وتعقد اجتماعات دائمة للسكّان حول ميزانية المدينة. أيّ نهج يتجلّى هنا؟", "ru": "Муниципалитет поощряет жителей заниматься волонтёрством в районе и регулярно проводит собрания жителей о городском бюджете. Какой подход здесь проявляется?", "en": "A municipality encourages residents to volunteer in their neighbourhood and holds regular residents' meetings on the city budget. Which approach is expressed here?"},[{"he": "הגישה הרפובליקנית, שמעודדת מעורבות אזרחית למען הקהילה.", "ar": "النهج الجمهوريّ، الذي يشجّع المشاركة المدنية من أجل المجتمع.", "ru": "Республиканский подход, который поощряет гражданское участие ради общества.", "en": "The republican approach, which encourages civic involvement for the community."}, {"he": "הגישה הליברלית, שלפיה המדינה מתערבת מעט ככל האפשר בחיי הפרט.", "ar": "النهج الليبراليّ، الذي بحسبه تتدخّل الدولة أقلّ ما يمكن في حياة الفرد.", "ru": "Либеральный подход, согласно которому государство как можно меньше вмешивается в жизнь человека.", "en": "The liberal approach, in which the state interferes as little as possible in the individual's life."}, {"he": "דמוקרטיה מתגוננת.", "ar": "الديمقراطية الدفاعية.", "ru": "Защищающаяся демократия.", "en": "Defensive democracy."}, {"he": "דמוקרטיה פורמלית, מפני שאספות התושבים מחליפות את הבחירות לעירייה ואת חברי המועצה הנבחרים.", "ar": "الديمقراطية الشكلية، لأنّ اجتماعات السكّان تحلّ محلّ انتخابات البلدية وأعضاء المجلس المنتخَبين.", "ru": "Формальная демократия, потому что собрания жителей заменяют муниципальные выборы и избранных членов совета.", "en": "Formal democracy, because the residents' meetings replace the municipal elections and the elected council members."}],0,{"he": "מה העירייה מבקשת מהתושבים לתת לעיר?", "ar": "ماذا تطلب البلدية من السكّان أن يقدّموا للمدينة؟", "ru": "Что муниципалитет просит жителей дать городу?", "en": "What is the municipality asking residents to give the city?"},{"he": "הגישה הרפובליקנית רואה בהשתתפות חלק מהאזרחות עצמה. התנדבות ודיון משותף בתקציב מחזקים את הקשר בין האזרח לקהילה. האספות אינן מחליפות בחירות, אלא מוסיפות עליהן.", "ar": "النهج الجمهوريّ يرى في المشاركة جزءًا من المواطنة نفسها. والتطوّع والنقاش المشترك في الميزانية يقوّيان الصلة بين المواطن والمجتمع. والاجتماعات لا تحلّ محلّ الانتخابات، بل تضاف إليها.", "ru": "Республиканский подход считает участие частью самого гражданства. Волонтёрство и совместное обсуждение бюджета укрепляют связь гражданина с обществом. Собрания не заменяют выборы, а дополняют их.", "en": "The republican approach sees participation as part of citizenship itself. Volunteering and discussing the budget together strengthen the bond between citizen and community. The meetings do not replace elections; they add to them."},null),
  Q("ty-2-02",{"he": "אזרחית אומרת: \"המדינה לא צריכה להגיד לי איך לחיות. התפקיד שלה הוא לשמור על הזכויות שלי.\" לאיזו גישה מתאימה האמירה?", "ar": "تقول مواطنة: \"ليس على الدولة أن تقول لي كيف أعيش. مهمّتها أن تحمي حقوقي.\" لأيّ نهج يناسب هذا القول؟", "ru": "Гражданка говорит: «Государство не должно указывать мне, как жить. Его задача — охранять мои права». Какому подходу соответствует это высказывание?", "en": "A citizen says: \"The state should not tell me how to live. Its job is to protect my rights.\" Which approach fits this statement?"},[{"he": "הגישה הרפובליקנית, שמדגישה את חובות האזרח כלפי הקהילה.", "ar": "النهج الجمهوريّ، الذي يُبرز واجبات المواطن تجاه المجتمع.", "ru": "Республиканский подход, который подчёркивает обязанности гражданина перед обществом.", "en": "The republican approach, which stresses the citizen's duties to the community."}, {"he": "הגישה הליברלית, ששמה את הפרט ואת חירותו במרכז.", "ar": "النهج الليبراليّ، الذي يضع الفرد وحرّيته في المركز.", "ru": "Либеральный подход, который ставит в центр личность и её свободу.", "en": "The liberal approach, which puts the individual and their freedom at the centre."}, {"he": "דמוקרטיה ישירה, שבה האזרחים מצביעים בעצמם על כל חוק במשאל עם.", "ar": "الديمقراطية المباشرة، التي يصوّت فيها المواطنون بأنفسهم على كلّ قانون في استفتاء.", "ru": "Прямая демократия, при которой граждане сами голосуют за каждый закон на референдуме.", "en": "Direct democracy, in which citizens vote on every law themselves in a national referendum."}, {"he": "דמוקרטיה מתגוננת, שמגבילה פעולות נגד המדינה.", "ar": "الديمقراطية الدفاعية، التي تقيّد الأعمال ضدّ الدولة.", "ru": "Защищающаяся демократия, которая ограничивает действия против государства.", "en": "Defensive democracy, which restricts actions against the state."}],1,{"he": "מי במרכז האמירה — הקהילה או האדם היחיד?", "ar": "من في مركز هذا القول — المجتمع أم الإنسان الفرد؟", "ru": "Кто в центре высказывания — общество или отдельный человек?", "en": "Who is at the centre of the statement — the community or the single person?"},{"he": "האזרחית מצפה מהמדינה להגן עליה ולא להתערב בבחירות שלה. זה לב הגישה הליברלית: המדינה משרתת את הפרט. הגישה הרפובליקנית הייתה מוסיפה שגם לאזרחית יש חובות כלפי הכלל.", "ar": "المواطنة تتوقّع من الدولة أن تحميها وألّا تتدخّل في اختياراتها. هذا جوهر النهج الليبراليّ: الدولة تخدم الفرد. أمّا النهج الجمهوريّ فكان سيضيف أنّ على المواطنة أيضًا واجبات تجاه المجموع.", "ru": "Гражданка ждёт от государства защиты и невмешательства в её выбор. Это суть либерального подхода: государство служит личности. Республиканский подход добавил бы, что у гражданки есть и обязанности перед обществом.", "en": "The citizen expects the state to protect her and not interfere in her choices. That is the heart of the liberal approach: the state serves the individual. The republican approach would add that she also has duties to the community."},null),
  Q("ty-2-03",{"he": "איזו מן הדוגמאות הבאות מתאימה לדמוקרטיה מתגוננת?", "ar": "أيّ من الأمثلة التالية يناسب الديمقراطية الدفاعية؟", "ru": "Какой из следующих примеров соответствует защищающейся демократии?", "en": "Which of the following examples fits a defensive democracy?"},[{"he": "פסילת מפלגה משום שהיא מציעה להעלות מסים.", "ar": "شطب حزب لأنه يقترح رفع الضرائب.", "ru": "Снятие партии с выборов за то, что она предлагает повысить налоги.", "en": "Disqualifying a party because it proposes raising taxes."}, {"he": "הקמת מערך הגנה נגד טילים, כדי להגן על האזרחים בערים.", "ar": "إقامة منظومة دفاع ضدّ الصواريخ، لحماية المواطنين في المدن.", "ru": "Создание системы противоракетной обороны для защиты жителей городов.", "en": "Setting up a missile defence system to protect citizens in the cities."}, {"he": "איסור בחוק על הסתה לגזענות.", "ar": "حظر التحريض على العنصرية في القانون.", "ru": "Законодательный запрет подстрекательства к расизму.", "en": "A legal ban on incitement to racism."}, {"he": "דחיית הבחירות בכל פעם שהממשלה חוששת להפסיד בהן, כדי לשמור על יציבות.", "ar": "تأجيل الانتخابات في كلّ مرّة تخشى فيها الحكومة أن تخسرها، للحفاظ على الاستقرار.", "ru": "Перенос выборов каждый раз, когда правительство боится их проиграть, чтобы сохранить стабильность.", "en": "Postponing elections whenever the government fears losing them, to keep stability."}],2,{"he": "ההגנה כאן היא על ערכי הדמוקרטיה, לא על הגבולות ולא על השלטון.", "ar": "الحماية هنا لقيم الديمقراطية، لا للحدود ولا للحكم.", "ru": "Здесь защищают ценности демократии, а не границы и не власть.", "en": "The protection here is of democratic values, not of borders or of the government."},{"he": "הסתה לגזענות פוגעת בשוויון ובכבוד האדם, ולכן הדמוקרטיה מגבילה אותה. דעה כלכלית שונה היא חלק לגיטימי מהוויכוח. דחיית בחירות לטובת השלטון פוגעת בדמוקרטיה, ולא מגינה עליה.", "ar": "التحريض على العنصرية يمسّ بالمساواة وبكرامة الإنسان، ولذلك تقيّده الديمقراطية. أمّا الرأي الاقتصاديّ المختلف فهو جزء شرعيّ من النقاش. وتأجيل الانتخابات لمصلحة الحكم يضرّ بالديمقراطية ولا يحميها.", "ru": "Подстрекательство к расизму нарушает равенство и человеческое достоинство, поэтому демократия его ограничивает. Иное экономическое мнение — законная часть спора. Перенос выборов в интересах власти вредит демократии, а не защищает её.", "en": "Incitement to racism harms equality and human dignity, so democracy restricts it. A different economic view is a legitimate part of the debate. Postponing elections to benefit the government harms democracy rather than protecting it."},null),
  Q("ty-2-04",{"he": "במדינה מתקיימות בחירות חופשיות. יש בה חוקה שמגנה על זכויות אדם, ובית משפט עצמאי שאוכף אותה. איך תתארו את המשטר?", "ar": "في دولة ما تُجرى انتخابات حرّة. ولديها دستور يحمي حقوق الإنسان، ومحكمة مستقلّة تطبّقه. كيف تصفون النظام؟", "ru": "В стране проходят свободные выборы. В ней есть конституция, защищающая права человека, и независимый суд, который её применяет. Как вы опишете этот режим?", "en": "A country holds free elections. It has a constitution that protects human rights, and an independent court that enforces it. How would you describe the regime?"},[{"he": "דמוקרטיה פורמלית בלבד, כי יש בה בחירות.", "ar": "ديمقراطية شكلية فقط، لأنّ فيها انتخابات.", "ru": "Только формальная демократия, потому что в ней есть выборы.", "en": "Only a formal democracy, because it has elections."}, {"he": "דמוקרטיה מהותית בלבד, כי יש בה חוקה.", "ar": "ديمقراطية جوهرية فقط، لأنّ فيها دستورًا.", "ru": "Только содержательная демократия, потому что в ней есть конституция.", "en": "Only a substantive democracy, because it has a constitution."}, {"he": "אי אפשר לקבוע, כי חסר מידע על מספר המפלגות ועל אחוז ההצבעה בבחירות האחרונות.", "ar": "لا يمكن الحسم، لأنه تنقص معلومات عن عدد الأحزاب ونسبة التصويت في الانتخابات الأخيرة.", "ru": "Нельзя определить, потому что нет данных о числе партий и явке на последних выборах.", "en": "It cannot be determined, because information is missing on the number of parties and the turnout in the last election."}, {"he": "דמוקרטיה שעומדת גם בתנאים הפורמליים וגם בתנאים המהותיים.", "ar": "ديمقراطية تستوفي الشروط الشكلية والجوهرية معًا.", "ru": "Демократия, которая отвечает и формальным, и содержательным условиям.", "en": "A democracy that meets both the formal and the substantive conditions."}],3,{"he": "בדקו כל נתון בשאלה: לאיזו תפיסה הוא שייך?", "ar": "افحصوا كلّ معطى في السؤال: إلى أيّ تصوّر ينتمي؟", "ru": "Проверьте каждый факт в вопросе: к какому пониманию он относится?", "en": "Check each fact in the question: which view does it belong to?"},{"he": "בחירות חופשיות הן התנאי הפורמלי. חוקה שמגנה על זכויות ובית משפט עצמאי הם התנאים המהותיים. שתי התפיסות אינן סותרות: דמוקרטיה מלאה צריכה את שתיהן.", "ar": "الانتخابات الحرّة هي الشرط الشكليّ. والدستور الذي يحمي الحقوق والمحكمة المستقلّة هما الشرطان الجوهريان. والتصوّران لا يتناقضان: الديمقراطية الكاملة تحتاج إليهما معًا.", "ru": "Свободные выборы — формальное условие. Конституция, защищающая права, и независимый суд — содержательные условия. Эти понимания не противоречат друг другу: полной демократии нужны оба.", "en": "Free elections are the formal condition. A constitution protecting rights and an independent court are the substantive conditions. The two views do not conflict: a full democracy needs both."},null)
 ],
 [ /* רמה 3 — ניתוח */
  Q("types-anal1",
    {he:"טוענים כי “ככל שההליך דמוקרטי יותר, כך התוצאה דמוקרטית יותר”. מהי הביקורת החזקה ביותר על הטענה?",
     ar:"يُقال إن “كلّما كان الإجراء أكثر ديمقراطية كانت النتيجة أكثر ديمقراطية”. ما أقوى نقد لهذا الادّعاء؟",
     ru:"Утверждают: «чем демократичнее процедура, тем демократичнее результат». Какова сильнейшая критика этого тезиса?",
     en:"It is argued that “the more democratic the procedure, the more democratic the outcome”. What is the strongest criticism of that claim?"},
   [{he:"הביקורת היא שהליכים דמוקרטיים איטיים מדי, ולכן ההחלטה מתקבלת באיחור ואיכותה נפגעת.",
     ar:"النقد هو أنّ الإجراءات الديمقراطية بطيئة جدًّا، ولذلك يُتَّخذ القرار متأخّرًا وتتضرّر جودته.",
     ru:"Критика в том, что демократические процедуры слишком медленны, поэтому решение принимается с опозданием и его качество страдает.",
     en:"The criticism is that democratic procedures are too slow, so the decision comes late and its quality suffers."},
    {he:"הליך יכול להיות מושלם ותוצאתו לפגוע בזכויות יסוד. ההליך מודד מי החליט, לא מה הוחלט.",
     ar:"قد يكون الإجراء مثاليًّا ونتيجته تمسّ حقوقًا أساسية. الإجراء يقيس مَن قرّر، لا ما الذي تقرّر.",
     ru:"Процедура может быть безупречной, а результат: нарушать основные права. Процедура измеряет, кто решил, а не что решено.",
     en:"A procedure can be flawless and its outcome still violate basic rights. Procedure measures who decided, not what was decided."},
    {he:"הביקורת היא שרוב האזרחים אינם מצביעים, ולכן ההליך הדמוקרטי מייצג מיעוט מן הציבור בלבד.",
     ar:"النقد هو أنّ معظم المواطنين لا يصوّتون، ولذلك يمثّل الإجراء الديمقراطيّ أقلّية من الجمهور فقط.",
     ru:"Критика в том, что большинство граждан не голосуют, и потому демократическая процедура представляет лишь меньшинство общества.",
     en:"The criticism is that most citizens do not vote, so the democratic procedure represents only a minority of the public."},
    {he:"הביקורת היא שהליך דמוקרטי יקר יותר מהליך אחר, והמשאבים היו מועילים יותר בידי אנשי מקצוע.",
     ar:"النقد هو أنّ الإجراء الديمقراطيّ أغلى من غيره، وأنّ الموارد كانت ستنفع أكثر بأيدي أصحاب الاختصاص.",
     ru:"Критика в том, что демократическая процедура дороже иных, и ресурсы принесли бы больше пользы в руках профессионалов.",
     en:"The criticism is that a democratic procedure costs more than others, and the resources would do more good in professional hands."}],
   1,
   {he:"הטענה מחליפה בין שתי שאלות. אילו?",
    ar:"الادّعاء يخلط بين سؤالين. أيّهما؟",
    ru:"Тезис подменяет один вопрос другим. Какими?",
    en:"The claim conflates two questions. Which two?"},
   {he:"זו ההבחנה שבין דמוקרטיה פורמלית למהותית, מנוסחת כטיעון. משטר נמדד בשתיהן: הליך פגום פוסל תוצאה טובה, ותוכן פוגעני פוסל הליך תקין.",
    ar:"هذا هو التمييز بين الديمقراطية الشكلية والجوهرية، مصاغًا كحجّة. يُقاس النظام بكلتيهما: إجراء معيب يُبطل نتيجة جيّدة، ومضمون ماسّ يُبطل إجراءً سليمًا.",
    ru:"Это различение формальной и содержательной демократии, сформулированное как аргумент. Режим измеряется обеими: порочная процедура обесценивает хороший результат, а ущемляющее содержание: безупречную процедуру.",
    en:"This is the formal/substantive distinction put as an argument. A regime is measured by both: a flawed procedure discredits a good outcome, and harmful content discredits a proper procedure."},
   null),
  Q("types-anal2",
    {he:"מדוע דמוקרטיות רבות מקשות במיוחד על שינוי חוקה או חוקי יסוד — למשל ברוב מיוחד או בשתי קריאות בכנסות שונות?",
     ar:"لماذا تُصعّب ديمقراطيات كثيرة تغيير الدستور أو قوانين الأساس، مثلًا بأغلبية خاصة أو بقراءتين في برلمانين مختلفين؟",
     ru:"Почему многие демократии особенно затрудняют изменение конституции или основных законов: например, требуя особого большинства или двух чтений в разных созывах?",
     en:"Why do many democracies make changing a constitution or basic laws especially hard: for example by a special majority, or two readings in different parliaments?"},
   [{he:"כדי למנוע שינויים תכופים שיבלבלו את האזרחים.",
     ar:"كي تُمنع تغييرات متكرّرة تربك المواطنين.",
     ru:"Чтобы не допустить частых изменений, которые запутают граждан.",
     en:"To prevent frequent changes that would confuse citizens."},
    {he:"כדי שרוב זמני לא ישנה את כללי המשחק לטובתו, ושהשינוי ידרוש הסכמה רחבה ויציבה לאורך זמן.",
     ar:"كي لا تغيّر أغلبية مؤقّتة قواعد اللعبة لصالحها، وكي يستوجب التغيير توافقًا واسعًا ثابتًا عبر الزمن.",
     ru:"Чтобы временное большинство не переписало правила игры под себя и чтобы изменение требовало широкого и устойчивого согласия.",
     en:"So that a temporary majority cannot rewrite the rules in its own favour, and so that change requires broad, stable agreement over time."},
    {he:"כדי למנוע מבתי המשפט לפרש את החוקה.",
     ar:"لمنع المحاكم من تفسير الدستور.",
     ru:"Чтобы помешать судам толковать конституцию.",
     en:"To stop the courts from interpreting the constitution."},
    {he:"כדי לחייב את הממשלה להתייעץ עם ארגונים בינלאומיים לפני כל תיקון, שכן חוקה נבחנת גם בעיני מדינות אחרות.",
     ar:"كي تُلزَم الحكومة باستشارة منظّمات دولية قبل كلّ تعديل، لأنّ الدستور يُقاس أيضًا بأعين دول أخرى.",
     ru:"Чтобы обязать правительство советоваться с международными организациями перед каждой поправкой, ведь конституцию оценивают и другие государства.",
     en:"To force the government to consult international organisations before every amendment, since a constitution is judged by other states as well."}],
   1,
   {he:"מי מרוויח מכך שקל לשנות את הכללים — ומתי?",
    ar:"مَن يستفيد من سهولة تغيير القواعد، ومتى؟",
    ru:"Кто выигрывает от лёгкости изменения правил, и когда?",
    en:"Who gains when the rules are easy to change, and when?"},
   {he:"זה מכונה “נוקשות חוקתית”. בישראל היא חלקית בלבד: רק חלק מחוקי היסוד משוריינים, ולכן אפשר לעיתים לשנות כלל יסוד ברוב רגיל — נקודת מחלוקת מרכזית בשיח החוקתי הישראלי.",
    ar:"يُسمّى هذا “الجمود الدستوريّ”. في إسرائيل هو جزئيّ فقط: بعض قوانين الأساس محصّنة، فيمكن أحيانًا تغيير قاعدة أساسية بأغلبية عادية، وهي نقطة خلاف مركزية في النقاش الدستوريّ الإسرائيليّ.",
    ru:"Это называют «конституционной жёсткостью». В Израиле она лишь частичная: защищены не все основные законы, поэтому базовое правило порой можно изменить простым большинством: центральная точка спора в израильской конституционной дискуссии.",
    en:"This is called constitutional rigidity. In Israel it is only partial: not all basic laws are entrenched, so a foundational rule can sometimes be changed by an ordinary majority: a central point of dispute in Israeli constitutional debate."},
   null),
  Q("types-anal3",
    {he:"אזרח טוען: “אני מקיים את החוק, מצביע, ולא מתעניין בפוליטיקה מעבר לזה — זו אזרחות מלאה.” מהי הביקורת מנקודת המבט של הדמוקרטיה המהותית?",
     ar:"يقول مواطن: “ألتزم القانون وأصوّت ولا أهتمّ بالسياسة أكثر من ذلك، هذه مواطَنة كاملة.” ما النقد من زاوية الديمقراطية الجوهرية؟",
     ru:"Гражданин говорит: «Я соблюдаю закон, голосую и больше политикой не интересуюсь: это полноценное гражданство». Какова критика с точки зрения содержательной демократии?",
     en:"A citizen says: “I obey the law, I vote, and beyond that politics does not interest me. That is full citizenship.” What is the criticism from the substantive-democracy point of view?"},
   [{he:"אין ביקורת — הצבעה וקיום החוק ממצים את חובות האזרח, וכל דרישה נוספת היא כפייה של השקפה פוליטית על מי שבחר שלא לעסוק בה.",
     ar:"لا نقد، التصويت والالتزام بالقانون يستنفدان واجبات المواطن، وكلّ مطلب إضافيّ هو فرض موقف سياسيّ على مَن اختار ألّا ينشغل به.",
     ru:"Критики нет: голосование и соблюдение закона исчерпывают обязанности гражданина, а любое дополнительное требование: навязывание политических взглядов тому, кто решил ими не заниматься.",
     en:"There is no criticism: voting and obeying the law exhaust a citizen's duties, and any further demand imposes a political outlook on someone who chose not to engage with it."},
    {he:"הביקורת היא שהוא אינו מתנדב בקהילה שבה הוא חי.",
     ar:"النقد هو أنّه لا يتطوّع في المجتمع الذي يعيش فيه.",
     ru:"Критика в том, что он не волонтёрит в общине, где живёт.",
     en:"The criticism is that he does not volunteer in the community where he lives."},
    {he:"דמוקרטיה מהותית נשענת גם על השתתפות בין בחירות — ביקורת ציבורית, התאגדות ומעורבות. אזרחות פסיבית משאירה את השדה הציבורי בידי מי שכן פעיל בו.",
     ar:"الديمقراطية الجوهرية تستند أيضًا إلى مشاركة بين الانتخابات، نقد عامّ وتنظيم وانخراط. المواطَنة السلبية تترك الحيّز العامّ لمن ينشط فيه.",
     ru:"Содержательная демократия опирается и на участие между выборами: общественную критику, объединение, вовлечённость. Пассивное гражданство отдаёт публичное поле тем, кто в нём активен.",
     en:"Substantive democracy also rests on participation between elections: public criticism, association, involvement. Passive citizenship leaves the public field to whoever is active in it."},
    {he:"הביקורת היא שהצבעה אחת לארבע שנים אינה מקיימת את חובת ההשתתפות שנקבעה בחוק, ולכן על האזרח להצביע גם בבחירות המקומיות ובמשאלי עם.",
     ar:"النقد هو أنّ التصويت مرّة كلّ أربع سنوات لا يفي بواجب المشاركة المنصوص عليه في القانون، ولذلك على المواطن أن يصوّت أيضًا في الانتخابات المحلية والاستفتاءات.",
     ru:"Критика в том, что голосование раз в четыре года не выполняет установленную законом обязанность участия, и потому гражданин должен голосовать также на местных выборах и референдумах.",
     en:"The criticism is that voting once every four years does not satisfy the participation duty set in law, so the citizen must also vote in local elections and referendums."}],
   2,
   {he:"מה קורה בשלוש השנים ואחת־עשרה החודשים שבין הבחירות?",
    ar:"ماذا يحدث في السنوات الثلاث وأحد عشر شهرًا بين الانتخابات؟",
    ru:"Что происходит в те три года и одиннадцать месяцев между выборами?",
    en:"What happens in the three years and eleven months between elections?"},
   {he:"האזרחות הפורמלית היא מעמד משפטי; האזרחות המהותית היא פעולה. הבחנה זו מסבירה למה חופש ההתאגדות, חופש ההפגנה וחופש המידע נחשבים זכויות פוליטיות ולא רק חירויות פרטיות.",
    ar:"المواطَنة الشكلية مكانة قانونية؛ والجوهرية فعل. هذا التمييز يفسّر لماذا تُعدّ حرّية التنظيم والتظاهر والمعلومة حقوقًا سياسية لا حرّيات فردية فحسب.",
    ru:"Формальное гражданство: правовой статус; содержательное: действие. Это различение объясняет, почему свободу объединений, демонстраций и информации считают политическими правами, а не только частными свободами.",
    en:"Formal citizenship is a legal status; substantive citizenship is an activity. That distinction explains why freedom of association, of demonstration and of information count as political rights and not merely private liberties."},
   null),
  Q("ty-3-01",{"he": "מהי הדילמה המרכזית של הדמוקרטיה המתגוננת?", "ar": "ما المعضلة المركزية للديمقراطية الدفاعية؟", "ru": "В чём главная дилемма защищающейся демократии?", "en": "What is the central dilemma of defensive democracy?"},[{"he": "אם להשקיע את התקציב בצבא או בחינוך.", "ar": "هل تُستثمر الميزانية في الجيش أم في التعليم.", "ru": "Вкладывать ли бюджет в армию или в образование.", "en": "Whether to invest the budget in the army or in education."}, {"he": "כדי להגן על עצמה, היא מגבילה זכויות כמו חופש הביטוי, וכך עלולה לפגוע בערכים שעליהם היא מגינה.", "ar": "كي تحمي نفسها، تقيّد حقوقًا مثل حرية التعبير، فقد تمسّ بالقيم التي تحميها.", "ru": "Чтобы защитить себя, она ограничивает права, например свободу слова, и может навредить ценностям, которые защищает.", "en": "To protect itself, it restricts rights such as free speech, and so may harm the very values it protects."}, {"he": "אין דילמה: כל הגבלה על מפלגה מחזקת את הדמוקרטיה, ולכן כדאי להשתמש בה בכל פעם שמפלגה מעוררת מחלוקת חריפה בציבור.", "ar": "لا توجد معضلة: كلّ تقييد لحزب يقوّي الديمقراطية، ولذلك يُستحسن استخدامه كلّما أثار حزب خلافًا حادًّا في الجمهور.", "ru": "Дилеммы нет: любое ограничение партии укрепляет демократию, поэтому его стоит применять всякий раз, когда партия вызывает острые споры в обществе.", "en": "There is no dilemma: every restriction on a party strengthens democracy, so it should be used whenever a party stirs sharp public controversy."}, {"he": "אם לאפשר לאזרחים מחו\"ל להצביע בבחירות.", "ar": "هل يُسمح للمواطنين في الخارج بالتصويت في الانتخابات.", "ru": "Разрешать ли гражданам за границей голосовать на выборах.", "en": "Whether to let citizens abroad vote in elections."}],1,{"he": "מה הדמוקרטיה מוסרת כשהיא מגינה על עצמה?", "ar": "بماذا تضحّي الديمقراطية عندما تدافع عن نفسها؟", "ru": "Чем жертвует демократия, когда защищает себя?", "en": "What does democracy give up when it defends itself?"},{"he": "הדמוקרטיה מגינה על עצמה בכלים שפוגעים בזכויות. שימוש רחב מדי בכלים האלה הופך אותה לפחות דמוקרטית. לכן ההגבלה צריכה להיות חריגה, לפי עילות ברורות ובפיקוח של בית משפט.", "ar": "تحمي الديمقراطية نفسها بأدوات تمسّ بالحقوق. والاستخدام الواسع جدًّا لهذه الأدوات يجعلها أقلّ ديمقراطية. لذلك يجب أن يكون التقييد استثنائيًّا، وفق أسباب واضحة وتحت رقابة المحكمة.", "ru": "Демократия защищает себя средствами, которые ограничивают права. Слишком широкое их применение делает её менее демократичной. Поэтому ограничение должно быть исключением, по ясным основаниям и под контролем суда.", "en": "Democracy defends itself with tools that limit rights. Using them too widely makes it less democratic. So a restriction must be the exception, on clear grounds and under court supervision."},null),
  Q("ty-3-02",{"he": "מוצע לחייב כל אזרח בוגר להתנדב 50 שעות בשנה בקהילה. כיצד צפויות להגיב שתי הגישות?", "ar": "يُقترح إلزام كلّ مواطن بالغ بالتطوّع 50 ساعة في السنة في المجتمع. كيف يُتوقّع أن يردّ النهجان؟", "ru": "Предлагают обязать каждого взрослого гражданина 50 часов в год работать волонтёром в обществе. Как, скорее всего, отреагируют два подхода?", "en": "It is proposed to require every adult citizen to volunteer 50 hours a year in the community. How are the two approaches likely to respond?"},[{"he": "הליברלית תתמוך, כי היא מדגישה חובות כלפי המדינה. הרפובליקנית תתנגד, כי היא מעדיפה שהפרט יחליט לבד.", "ar": "سيؤيّد الليبراليّ، لأنه يُبرز الواجبات تجاه الدولة. وسيعارض الجمهوريّ، لأنه يفضّل أن يقرّر الفرد وحده.", "ru": "Либеральный поддержит, потому что подчёркивает обязанности перед государством. Республиканский выступит против, потому что предпочитает, чтобы человек решал сам.", "en": "The liberal will support it, because it stresses duties to the state. The republican will oppose it, because it prefers the individual to decide alone."}, {"he": "שתי הגישות יתמכו, כי שתיהן רואות בהתנדבות את הערך העליון.", "ar": "سيؤيّد النهجان، لأنّ كليهما يرى في التطوّع القيمة العليا.", "ru": "Оба подхода поддержат, потому что оба считают волонтёрство высшей ценностью.", "en": "Both approaches will support it, because both see volunteering as the highest value."}, {"he": "הרפובליקנית תתמוך, כי ההצעה מחזקת מעורבות למען הכלל. הליברלית תתנגד, כי חובה כזאת פוגעת בחירות הפרט.", "ar": "سيؤيّد الجمهوريّ، لأنّ الاقتراح يقوّي المشاركة من أجل المجموع. وسيعارض الليبراليّ، لأنّ واجبًا كهذا يمسّ بحرية الفرد.", "ru": "Республиканский поддержит, потому что предложение укрепляет участие ради общего блага. Либеральный выступит против, потому что такая обязанность ограничивает свободу личности.", "en": "The republican will support it, because it strengthens involvement for the common good. The liberal will oppose it, because such a duty limits individual freedom."}, {"he": "שתי הגישות יתנגדו, כי בדמוקרטיה אסור לחוקק שום חוק שמטיל חובות על האזרחים, וכל חובה כזאת פוגעת בהסכמת הנשלטים ובזכויות האדם.", "ar": "سيعارض النهجان، لأنه يُمنع في الديمقراطية سنّ أيّ قانون يفرض واجبات على المواطنين، وكلّ واجب كهذا يمسّ بموافقة المحكومين وبحقوق الإنسان.", "ru": "Оба подхода выступят против, потому что в демократии нельзя принимать никакой закон, возлагающий обязанности на граждан, и любая такая обязанность нарушает согласие управляемых и права человека.", "en": "Both approaches will oppose it, because in a democracy no law may impose duties on citizens, and any such duty violates the consent of the governed and basic human rights."}],2,{"he": "שאלו מה כל גישה שמה במקום הראשון: את החירות, או את התרומה לכלל?", "ar": "اسألوا: ماذا يضع كلّ نهج في المقام الأوّل — الحرية أم الإسهام في المجموع؟", "ru": "Спросите, что каждый подход ставит на первое место: свободу или вклад в общее благо?", "en": "Ask what each approach puts first: freedom, or contributing to the whole?"},{"he": "הגישה הרפובליקנית רואה במעורבות חלק מהאזרחות, ולכן היא נוטה לתמוך. הגישה הליברלית רואה בחובה כפויה פגיעה בחירות, ולכן היא נוטה להתנגד. גם ליברלים מקבלים חובות כמו מסים, אבל מגבילים אותן למינימום.", "ar": "النهج الجمهوريّ يرى في المشاركة جزءًا من المواطنة، ولذلك يميل إلى التأييد. والنهج الليبراليّ يرى في الواجب المفروض مسًّا بالحرية، ولذلك يميل إلى المعارضة. والليبراليون أيضًا يقبلون واجبات مثل الضرائب، لكنّهم يقلّصونها إلى الحدّ الأدنى.", "ru": "Республиканский подход считает участие частью гражданства, поэтому склонен поддержать. Либеральный подход видит в принудительной обязанности ограничение свободы, поэтому склонен возражать. Либералы тоже принимают обязанности, например налоги, но сводят их к минимуму.", "en": "The republican approach sees involvement as part of citizenship, so it tends to support. The liberal approach sees a forced duty as a limit on freedom, so it tends to oppose. Liberals also accept duties such as taxes, but keep them to a minimum."},null),
  Q("ty-3-03",{"he": "ב-1965 נפסלה רשימה מלהתמודד לכנסת, אף שלא היה בחוק סעיף מפורש לכך. ב-1985 נוסף לחוק־יסוד: הכנסת סעיף 7א, שקובע את עילות הפסילה. מה היתרון של עיגון העילות בחוק?", "ar": "في عام 1965 شُطبت قائمة من خوض انتخابات الكنيست، مع أنه لم يكن في القانون بند صريح لذلك. وفي عام 1985 أُضيف إلى قانون أساس: الكنيست البند 7أ، الذي يحدّد أسباب الشطب. ما فائدة تثبيت الأسباب في القانون؟", "ru": "В 1965 году список не допустили к выборам в Кнессет, хотя в законе не было прямой статьи об этом. В 1985 году в Основной закон о Кнессете добавили статью 7А, которая устанавливает основания для отстранения. В чём преимущество закрепить эти основания в законе?", "en": "In 1965 a list was barred from running for the Knesset, although no law explicitly allowed it. In 1985 section 7A, which sets the grounds for disqualification, was added to Basic Law: The Knesset. What is the advantage of setting the grounds in law?"},[{"he": "הוא מאפשר לוועדת הבחירות לפסול כל רשימה שרוב חבריה מתנגדים לה.", "ar": "يسمح للجنة الانتخابات بشطب أيّ قائمة تعارضها أغلبية أعضائها.", "ru": "Он позволяет избирательной комиссии отстранить любой список, против которого большинство её членов.", "en": "It lets the election committee disqualify any list that most of its members oppose."}, {"he": "אין לו יתרון, כי בית המשפט אינו מעורב בפסילת רשימות.", "ar": "لا فائدة منه، لأنّ المحكمة لا تشارك في شطب القوائم.", "ru": "Преимущества нет, потому что суд не участвует в отстранении списков.", "en": "It has no advantage, because the court plays no part in disqualifying lists."}, {"he": "הוא מבטיח שאף רשימה לא תיפסל לעולם, גם אם היא תומכת במאבק מזוין נגד המדינה, כי הזכות להתמודד היא מוחלטת.", "ar": "يضمن ألّا تُشطب أيّ قائمة أبدًا، حتى لو دعمت كفاحًا مسلّحًا ضدّ الدولة، لأنّ حقّ الترشّح حقّ مطلق لا يجوز تقييده.", "ru": "Он гарантирует, что ни один список никогда не отстранят, даже если он поддерживает вооружённую борьбу против государства, потому что право баллотироваться абсолютно.", "en": "It guarantees that no list will ever be disqualified, even if it supports armed struggle against the state, because the right to run is absolute."}, {"he": "הוא מגביל את שיקול הדעת: פוסלים רק לפי עילות ברורות שנקבעו מראש, ולא בגלל דעות לא אהודות.", "ar": "يقيّد السلطة التقديرية: لا يُشطب إلا وفق أسباب واضحة محدّدة مسبقًا، لا بسبب آراء غير محبوبة.", "ru": "Он ограничивает усмотрение: отстраняют только по ясным заранее установленным основаниям, а не за непопулярные взгляды.", "en": "It limits discretion: lists are disqualified only on clear grounds set in advance, not for unpopular views."}],3,{"he": "מה ההבדל בין כלל שכתוב מראש לבין החלטה שמתקבלת לפי תחושה?", "ar": "ما الفرق بين قاعدة مكتوبة مسبقًا وقرار يُتّخذ وفق الشعور؟", "ru": "Чем правило, записанное заранее, отличается от решения, принятого по ощущению?", "en": "What is the difference between a rule written in advance and a decision made on a feeling?"},{"he": "הפסילה פוגעת בזכות להיבחר ובזכות לבחור, ולכן היא צריכה בסיס ברור בחוק. עילות כתובות מגינות גם מפני שימוש לרעה בכלי. הן חלק משלטון החוק, גם בדמוקרטיה מתגוננת.", "ar": "الشطب يمسّ بحقّ الترشّح وحقّ الانتخاب، ولذلك يحتاج إلى أساس واضح في القانون. والأسباب المكتوبة تحمي أيضًا من إساءة استخدام هذه الأداة. وهي جزء من سيادة القانون، حتى في الديمقراطية الدفاعية.", "ru": "Отстранение нарушает право быть избранным и право выбирать, поэтому ему нужна ясная основа в законе. Записанные основания защищают и от злоупотребления этим средством. Они — часть верховенства закона даже в защищающейся демократии.", "en": "Disqualification harms the right to be elected and the right to vote, so it needs a clear basis in law. Written grounds also protect against misuse of the tool. They are part of the rule of law, even in a defensive democracy."},null),
  Q("ty-3-04",{"he": "מהי הביקורת של הגישה הרפובליקנית על הגישה הליברלית?", "ar": "ما نقد النهج الجمهوريّ للنهج الليبراليّ؟", "ru": "В чём критика республиканского подхода в адрес либерального?", "en": "What is the republican approach's criticism of the liberal approach?"},[{"he": "התמקדות בזכויות הפרט בלבד מחלישה את תחושת השותפות והאחריות לחברה.", "ar": "التركيز على حقوق الفرد وحدها يُضعف الشعور بالشراكة والمسؤولية تجاه المجتمع.", "ru": "Сосредоточенность только на правах личности ослабляет чувство общности и ответственности перед обществом.", "en": "Focusing only on individual rights weakens the sense of partnership and responsibility to society."}, {"he": "הגישה הליברלית אינה מכירה בזכויות אדם כלל.", "ar": "النهج الليبراليّ لا يعترف بحقوق الإنسان إطلاقًا.", "ru": "Либеральный подход вообще не признаёт права человека.", "en": "The liberal approach does not recognise human rights at all."}, {"he": "הגישה הליברלית נותנת למדינה כוח רב מדי לכפות על האזרחים דרך חיים אחת, ובכך מבטלת את החירות שהיא עצמה מגינה עליה.", "ar": "النهج الليبراليّ يمنح الدولة قوّة كبيرة جدًّا لفرض نمط حياة واحد على المواطنين، وبذلك يلغي الحرية التي يحميها هو نفسه.", "ru": "Либеральный подход даёт государству слишком много силы навязывать гражданам один образ жизни и тем самым отменяет свободу, которую сам защищает.", "en": "The liberal approach gives the state too much power to force one way of life on citizens, and so cancels the freedom it itself protects."}, {"he": "הגישה הליברלית מתנגדת לקיום בחירות.", "ar": "النهج الليبراليّ يعارض إجراء الانتخابات.", "ru": "Либеральный подход выступает против выборов.", "en": "The liberal approach opposes holding elections."}],0,{"he": "מה קורה לקהילה כשכל אחד דואג רק לזכויות שלו?", "ar": "ماذا يحدث للمجتمع عندما يهتمّ كلّ واحد بحقوقه فقط؟", "ru": "Что происходит с обществом, когда каждый заботится только о своих правах?", "en": "What happens to the community when everyone cares only about their own rights?"},{"he": "הגישה הרפובליקנית אינה מתנגדת לזכויות. היא טוענת שזכויות בלבד אינן מספיקות כדי לקיים דמוקרטיה. בלי אזרחים מעורבים ואכפתיים, המרחב הציבורי נחלש.", "ar": "النهج الجمهوريّ لا يعارض الحقوق. إنه يدّعي أنّ الحقوق وحدها لا تكفي للحفاظ على الديمقراطية. فبدون مواطنين مشاركين ومهتمّين يضعف الفضاء العامّ.", "ru": "Республиканский подход не против прав. Он утверждает, что одних прав недостаточно, чтобы сохранить демократию. Без вовлечённых и неравнодушных граждан общественное пространство слабеет.", "en": "The republican approach does not oppose rights. It argues that rights alone are not enough to sustain democracy. Without involved, caring citizens, the public sphere grows weak."},null)
 ]
]);

/* ---------- מסלול 2: זכויות ואזרחות ---------- */

topic("rights","rig",
  {he:"זכויות האדם והאזרח",ar:"حقوق الإنسان والمواطن",ru:"Права человека и гражданина",en:"Human and civil rights"},
  {he:"זכויות טבעיות, אזרחיות, פוליטיות וחברתיות — ומתי מותר להגבילן",
   ar:"حقوق طبيعية ومدنية وسياسية واجتماعية، ومتى يجوز تقييدها",
   ru:"Естественные, гражданские, политические и социальные права, и когда их можно ограничивать",
   en:"Natural, civil, political and social rights, and when they may be limited"},
[
 [ /* רמה 1 — ידע */
  Q("rights-nat",
    {he:"מהי זכות טבעית?",
     ar:"ما هو الحقّ الطبيعيّ؟",
     ru:"Что такое естественное право?",
     en:"What is a natural right?"},
   [{he:"זכות שהמדינה מעניקה לאזרחיה בחוק, ורשאית ליטול אותה באותו הליך חקיקה.",
     ar:"حقّ تمنحه الدولة لمواطنيها بقانون، ويحقّ لها سلبه بالإجراء التشريعيّ ذاته.",
     ru:"Право, которое государство даёт гражданам законом и может отнять той же законодательной процедурой.",
     en:"A right the state grants its citizens by statute and may take away by the same legislative process."},
    {he:"זכות שיש לאדם באשר הוא אדם, ולא מפני שמדינה כלשהי העניקה אותה לו.",
     ar:"حقّ للإنسان بما هو إنسان، لا لأن دولة ما منحته إيّاه.",
     ru:"Право, принадлежащее человеку как человеку, а не потому, что его дало государство.",
     en:"A right a person has simply as a human being, not because some state granted it."},
    {he:"זכות שנקבעה באמנה בינלאומית שהמדינה חתמה עליה ואשררה אותה בחקיקה של הכנסת.",
     ar:"حقّ نصّت عليه اتفاقية دولية وقّعت عليها الدولة وصادقت عليها بتشريع في الكنيست.",
     ru:"Право, установленное международной конвенцией, которую государство подписало и ратифицировало законом Кнессета.",
     en:"A right set out in an international treaty the state signed and ratified in Knesset legislation."},
    {he:"זכות שמוקנית לאזרח מגיל שמונה עשרה, עם קבלת זכות הבחירה והחובה לשרת.",
     ar:"حقّ يُمنح للمواطن من سنّ الثامنة عشرة، مع نيله حقّ الانتخاب وواجب الخدمة.",
     ru:"Право, которое гражданин получает с восемнадцати лет: вместе с правом голоса и обязанностью служить.",
     en:"A right granted to a citizen from the age of eighteen, along with the vote and the duty to serve."}],
   1,
   {he:"שאלו למי יש את הזכות: לאזרח, או לכל אדם?",
    ar:"اسألوا لمن الحقّ: للمواطن أم لكلّ إنسان؟",
    ru:"Спросите, у кого есть это право: у гражданина или у любого человека?",
    en:"Ask who holds the right: the citizen, or every human being?"},
   {he:"זכויות טבעיות — לחיים, לחירות, לכבוד ולקניין — קיימות לפי התפיסה הליברלית מעצם היות האדם אדם. תפקיד המדינה הוא להגן עליהן, לא להעניק אותן; לכן היא גם אינה רשאית לבטלן.",
    ar:"الحقوق الطبيعية، في الحياة والحرّية والكرامة والملكية، قائمة، وفق التصوّر الليبراليّ، لمجرّد كون الإنسان إنسانًا. دور الدولة حمايتها لا منحها؛ لذلك لا يحقّ لها إلغاؤها.",
    ru:"Естественные права: на жизнь, свободу, достоинство и собственность: существуют, согласно либеральной концепции, в силу самой человечности. Задача государства: защищать их, а не даровать; поэтому оно и не вправе их отменить.",
    en:"Natural rights: to life, liberty, dignity and property: exist, on the liberal view, simply because a person is a person. The state's role is to protect them, not to grant them; which is why it may not abolish them either."},
   null),
  Q("rights-pol",
    {he:"מהי זכות פוליטית, ומהי דוגמה מובהקת לה?",
     ar:"ما هو الحقّ السياسيّ، وما مثاله الأبرز؟",
     ru:"Что такое политическое право и каков его характерный пример?",
     en:"What is a political right, and what is a clear example of one?"},
   [{he:"הזכות לקבל שירותי בריאות — למשל ביטוח בריאות ממלכתי.",
     ar:"الحقّ في الخدمات الصحية، مثل تأمين صحّيّ حكوميّ.",
     ru:"Право на медицинские услуги: например, государственное медстрахование.",
     en:"The right to health services: for example, statutory health insurance."},
    {he:"הזכות לשם טוב — למשל הגנה מפני לשון הרע ברשת ובעיתונות.",
     ar:"الحقّ في السمعة الحسنة، مثل الحماية من التشهير في الشبكة والصحافة.",
     ru:"Право на доброе имя: например защита от клеветы в сети и прессе.",
     en:"The right to a good name: for example protection from defamation online and in the press."},
    {he:"הזכות להשתתף בעיצוב השלטון — למשל הזכות לבחור ולהיבחר.",
     ar:"الحقّ في المشاركة في تشكيل السلطة، مثل حقّ الانتخاب والترشّح.",
     ru:"Право участвовать в формировании власти: например, право избирать и быть избранным.",
     en:"The right to take part in shaping government: for example, the right to vote and to stand for election."},
    {he:"הזכות לחופש עיסוק — למשל לפתוח עסק בלי רישיון מיוחד מהמדינה.",
     ar:"الحقّ في حرّية العمل، مثل فتح مصلحة دون ترخيص خاصّ من الدولة.",
     ru:"Право на свободу занятий: например открыть дело без особой лицензии государства.",
     en:"Freedom of occupation: for example opening a business without a special state licence."}],
   2,
   {he:"“פוליטי” נוגע לשלטון. איזו זכות מחברת בין האזרח לשלטון?",
    ar:"“السياسيّ” يتعلّق بالسلطة. أيّ حقّ يربط المواطن بالسلطة؟",
    ru:"«Политическое» связано с властью. Какое право связывает гражданина с властью?",
    en:"“Political” concerns government. Which right links the citizen to government?"},
   {he:"הזכויות הפוליטיות — לבחור, להיבחר, להתאגד במפלגה, להפגין ולעתור — הן הזכויות שהופכות את התושב לשותף בשלטון. הן נתונות בדרך כלל לאזרחים, בעוד הזכויות הטבעיות נתונות לכל אדם.",
    ar:"الحقوق السياسية، الانتخاب والترشّح والتنظّم في حزب والتظاهر وتقديم الالتماس، هي ما يحوّل المقيم إلى شريك في الحكم. تُمنح عادةً للمواطنين، بينما الحقوق الطبيعية لكلّ إنسان.",
    ru:"Политические права: избирать, быть избранным, объединяться в партию, демонстрировать, подавать иск: превращают жителя в соучастника власти. Их обычно дают гражданам, тогда как естественные права есть у каждого человека.",
    en:"Political rights: to vote, to stand, to form a party, to demonstrate, to petition: turn a resident into a partner in government. They are normally given to citizens, whereas natural rights belong to every person."},
   null),
  Q("rights-soc",
    {he:"מהי זכות חברתית?",
     ar:"ما هو الحقّ الاجتماعيّ؟",
     ru:"Что такое социальное право?",
     en:"What is a social right?"},
   [{he:"זכות לתנאי קיום בסיסיים שהמדינה נדרשת לפעול כדי לאפשרם — חינוך, בריאות, דיור וקיום בכבוד.",
     ar:"حقّ في شروط عيش أساسية على الدولة أن تعمل لتوفيرها، تعليم وصحّة وسكن وعيش كريم.",
     ru:"Право на базовые условия существования, которые государство обязано обеспечивать: образование, здравоохранение, жильё и достойную жизнь.",
     en:"A right to basic conditions of life that the state must act to provide: education, health, housing and a dignified existence."},
    {he:"זכות להשתתף באירועים חברתיים ובאיגודים מקצועיים בלבד.",
     ar:"حقّ في المشاركة في فعاليات اجتماعية ونقابات مهنية فقط.",
     ru:"Право участвовать только в общественных мероприятиях и профсоюзах.",
     en:"A right to take part only in social events and trade unions."},
    {he:"זכות שאינה מחייבת את המדינה בדבר — אלא מציבה יעד שהיא שואפת אליו לפי יכולתה התקציבית.",
     ar:"حقّ لا يُلزم الدولة بشيء، بل يضع هدفًا تسعى إليه بحسب قدرتها الميزانياتية.",
     ru:"Право, которое ни к чему государство не обязывает: оно лишь ставит цель, к которой стремится по мере бюджетных возможностей.",
     en:"A right that binds the state to nothing, but sets a goal it aims at as its budget allows."},
    {he:"זכות הנתונה רק למי שעובד ומשלם מסים.",
     ar:"حقّ يُمنح فقط لمن يعمل ويدفع الضرائب.",
     ru:"Право, которое есть только у работающих и платящих налоги.",
     en:"A right held only by those who work and pay taxes."}],
   0,
   {he:"רוב הזכויות דורשות מהמדינה להימנע. אילו זכויות דורשות ממנה לפעול ולהוציא כסף?",
    ar:"أغلب الحقوق تطلب من الدولة الامتناع. أيّ حقوق تطلب منها أن تفعل وتنفق؟",
    ru:"Большинство прав требуют от государства воздержания. Какие требуют действовать и тратить?",
    en:"Most rights require the state to refrain. Which require it to act and to spend?"},
   {he:"ההבחנה המקובלת היא בין זכויות שליליות, שדורשות מהמדינה לא להתערב (חופש ביטוי), לזכויות חיוביות, שדורשות ממנה לספק (חינוך). זכויות חברתיות תלויות בתקציב, ולכן היקפן שנוי במחלוקת פוליטית — אך זכות לקיום בכבוד הוכרה בישראל כנגזרת מכבוד האדם.",
    ar:"التمييز الشائع بين حقوق سلبية تطلب من الدولة ألّا تتدخّل (حرّية التعبير) وحقوق إيجابية تطلب منها أن توفّر (التعليم). الحقوق الاجتماعية مرهونة بالميزانية، فيبقى مداها موضع خلاف سياسيّ، لكن الحقّ في العيش بكرامة اعتُرف به في إسرائيل مشتقًّا من كرامة الإنسان.",
    ru:"Принято различать негативные права, требующие невмешательства государства (свобода слова), и позитивные, требующие предоставления (образование). Социальные права зависят от бюджета, поэтому их объём политически спорен, но право на достойное существование признано в Израиле производным от человеческого достоинства.",
    en:"The usual distinction is between negative rights, which require the state not to interfere (free expression), and positive rights, which require it to provide (education). Social rights depend on budgets, so their scope is politically contested, but a right to a dignified existence has been recognised in Israel as derived from human dignity."},
   null),
  Q("rt-1-01",{"he": "איזו מהזכויות הבאות היא זכות אזרחית?", "ar": "أيّ من الحقوق التالية هو حقّ مدنيّ؟", "ru": "Какое из следующих прав является гражданским?", "en": "Which of the following is a civil right?"},[{"he": "הזכות לבחור לכנסת ולהיבחר אליה.", "ar": "حقّ الانتخاب للكنيست والترشّح لها.", "ru": "Право избирать в Кнессет и быть избранным в него.", "en": "The right to vote for the Knesset and to be elected to it."}, {"he": "הזכות לחינוך חינם ולשירותי בריאות שהמדינה מממנת לכל תושב.", "ar": "الحقّ في تعليم مجّانيّ وفي خدمات صحّية تموّلها الدولة لكلّ مقيم.", "ru": "Право на бесплатное образование и медицину, которые государство оплачивает каждому жителю.", "en": "The right to free education and to health services the state funds for every resident."}, {"he": "חופש התנועה: לנוע בתוך המדינה ולצאת ממנה.", "ar": "حرّية التنقّل: التنقّل داخل الدولة والخروج منها.", "ru": "Свобода передвижения: перемещаться по стране и выезжать из неё.", "en": "Freedom of movement: to travel within the state and to leave it."}, {"he": "הזכות לקצבת זקנה ולדמי אבטלה.", "ar": "الحقّ في مخصّصات الشيخوخة وبدل البطالة.", "ru": "Право на пенсию по старости и пособие по безработице.", "en": "The right to an old-age pension and unemployment benefits."}],2,{"he": "חפשו זכות שמגינה על הפרט מפני התערבות השלטון בחייו.", "ar": "ابحثوا عن حقّ يحمي الفرد من تدخّل السلطة في حياته.", "ru": "Ищите право, которое защищает человека от вмешательства власти в его жизнь.", "en": "Look for a right that shields the individual from state interference in their life."},{"he": "זכויות אזרחיות מגינות על חירות הפרט מפני השלטון: תנועה, ביטוי, דת וקניין. הזכות לבחור היא זכות פוליטית. חינוך, בריאות וקצבאות הן זכויות חברתיות.", "ar": "الحقوق المدنية تحمي حرّية الفرد من السلطة: التنقّل والتعبير والدين والملكية. حقّ الانتخاب حقّ سياسيّ. والتعليم والصحّة والمخصّصات حقوق اجتماعية.", "ru": "Гражданские права защищают свободу личности от власти: передвижение, слово, вера, собственность. Право голоса: политическое право. Образование, медицина и пособия: социальные права.", "en": "Civil rights protect individual liberty from the government: movement, expression, religion and property. The vote is a political right. Education, health and benefits are social rights."},null),
  Q("rt-1-02",{"he": "מהי זכות משפטית (זכות חוקית)?", "ar": "ما هو الحقّ القانونيّ؟", "ru": "Что такое юридическое (законное) право?", "en": "What is a legal right?"},[{"he": "זכות שנקבעה בחוק של המדינה, ולכן אפשר לתבוע אותה בבית משפט.", "ar": "حقّ نصّ عليه قانون الدولة، لذلك يمكن المطالبة به في المحكمة.", "ru": "Право, закреплённое законом государства, поэтому его можно требовать в суде.", "en": "A right set in the state's law, so it can be claimed in court."}, {"he": "זכות שיש לכל אדם מעצם היותו אדם, גם אם אף חוק לא מזכיר אותה ואף מדינה לא הכירה בה.", "ar": "حقّ لكلّ إنسان لكونه إنسانًا، حتى لو لم يذكره أيّ قانون ولم تعترف به أيّ دولة.", "ru": "Право, которое есть у каждого как у человека, даже если ни один закон его не упоминает и ни одно государство не признало.", "en": "A right every person has as a human being, even if no law mentions it and no state has recognised it."}, {"he": "זכות שרוב הציבור מסכים שהיא צודקת.", "ar": "حقّ يتّفق معظم الجمهور على أنه عادل.", "ru": "Право, которое большинство общества считает справедливым.", "en": "A right most of the public agrees is fair."}, {"he": "זכות שניתנת רק לעורכי דין ולשופטים.", "ar": "حقّ يُمنح للمحامين والقضاة فقط.", "ru": "Право, которое дано только адвокатам и судьям.", "en": "A right given only to lawyers and judges."}],0,{"he": "חשבו מי יוצר את הזכות הזאת, ואיפה היא כתובה.", "ar": "فكّروا: من ينشئ هذا الحقّ، وأين هو مكتوب؟", "ru": "Подумайте, кто создаёт это право и где оно записано.", "en": "Think about who creates this right, and where it is written."},{"he": "זכות משפטית קיימת כי החוק קבע אותה. לכן אפשר לדרוש אותה בבית משפט. זכות טבעית, לעומת זאת, קיימת גם בלי חוק.", "ar": "الحقّ القانونيّ قائم لأن القانون نصّ عليه. لذلك يمكن المطالبة به أمام المحكمة. أمّا الحقّ الطبيعيّ فقائم حتى دون قانون.", "ru": "Юридическое право существует, потому что его установил закон. Поэтому его можно требовать в суде. Естественное право, напротив, существует и без закона.", "en": "A legal right exists because the law set it. So it can be claimed in court. A natural right, by contrast, exists even without a law."},null),
  Q("rt-1-03",{"he": "מה קובע עקרון השוויון?", "ar": "ماذا يقرّر مبدأ المساواة؟", "ru": "Что устанавливает принцип равенства?", "en": "What does the principle of equality state?"},[{"he": "שכל אדם יקבל בדיוק אותו סכום כסף ואותם משאבים, בלי קשר לצרכיו.", "ar": "أن ينال كلّ إنسان المبلغ نفسه والموارد نفسها بالضبط، بغضّ النظر عن احتياجاته.", "ru": "Что каждый получает ровно ту же сумму денег и те же ресурсы, независимо от своих нужд.", "en": "That everyone gets exactly the same money and resources, whatever their personal needs may be."}, {"he": "שרק אזרחי המדינה שווים בפני החוק.", "ar": "أن مواطني الدولة وحدهم متساوون أمام القانون.", "ru": "Что только граждане государства равны перед законом.", "en": "That only the state's citizens are equal before the law."}, {"he": "שהרוב מחליט, ולכן קולו של הרוב שווה יותר.", "ar": "أن الأغلبية تقرّر، ولذلك صوتها أثمن.", "ru": "Что решает большинство, и потому его голос весит больше.", "en": "That the majority decides, so its voice is worth more."}, {"he": "שאין להפלות בין אנשים בגלל שוני שאינו רלוונטי לעניין.", "ar": "أنه لا يجوز التمييز بين الناس بسبب فرق لا صلة له بالأمر.", "ru": "Что нельзя различать людей из-за отличия, не относящегося к делу.", "en": "That people may not be treated differently for an irrelevant reason."}],3,{"he": "חשבו מתי מותר להתייחס לאנשים באופן שונה, ומתי אסור.", "ar": "فكّروا: متى يجوز معاملة الناس بشكل مختلف، ومتى لا يجوز؟", "ru": "Подумайте, когда можно относиться к людям по-разному, а когда нельзя.", "en": "Think about when it is allowed to treat people differently, and when it is not."},{"he": "שוויון אינו אומר שכולם מקבלים אותו דבר. הוא אוסר הפליה בגלל דת, מין, מוצא או לאום, כשהם לא קשורים לעניין. הבחנה לפי שוני רלוונטי מותרת.", "ar": "المساواة لا تعني أن ينال الجميع الشيء نفسه. إنها تمنع التمييز بسبب الدين أو الجنس أو الأصل أو القومية حين لا صلة لها بالأمر. أمّا التفريق بسبب فرق ذي صلة فمسموح.", "ru": "Равенство не значит, что все получают одно и то же. Оно запрещает дискриминацию по религии, полу, происхождению или национальности, когда они не относятся к делу. Различие по существенному признаку допустимо.", "en": "Equality does not mean everyone gets the same thing. It bans discrimination by religion, sex, origin or nationality when these are irrelevant. Distinguishing by a relevant difference is allowed."},null),
  Q("rt-1-04",{"he": "על מה מגינה הזכות לפרטיות?", "ar": "ماذا يحمي الحقّ في الخصوصية؟", "ru": "Что защищает право на неприкосновенность частной жизни?", "en": "What does the right to privacy protect?"},[{"he": "את הזכות להחזיק רכוש פרטי, כמו דירה או רכב.", "ar": "الحقّ في امتلاك ملكية خاصّة، مثل شقّة أو سيّارة.", "ru": "Право владеть частной собственностью, например квартирой или машиной.", "en": "The right to own private property, such as a flat or a car."}, {"he": "את חייו האישיים של אדם, את ביתו ואת המידע עליו, מפני חדירה בלי הסכמתו.", "ar": "حياة الإنسان الشخصية وبيته والمعلومات عنه، من التدخّل دون موافقته.", "ru": "Личную жизнь человека, его дом и сведения о нём от вторжения без его согласия.", "en": "A person's private life, home and information about them, from intrusion without consent."}, {"he": "את הזכות ללמוד בבית ספר פרטי במקום בבית ספר ממלכתי, על חשבון המדינה ובלי לשלם שכר לימוד.", "ar": "الحقّ في الدراسة في مدرسة خاصّة بدل مدرسة رسمية، على حساب الدولة ودون دفع رسوم.", "ru": "Право учиться в частной школе вместо государственной за счёт государства и без платы за обучение.", "en": "The right to study at a private school instead of a state school, at the state's expense and without fees."}, {"he": "את הזכות לא לדווח למס הכנסה.", "ar": "الحقّ في عدم التصريح لضريبة الدخل.", "ru": "Право не подавать декларацию в налоговую.", "en": "The right not to report to the tax authority."}],1,{"he": "חשבו על יומן סודי, על מכתבים ועל מצלמה שמכוונת לחלון.", "ar": "فكّروا في مذكّرات سرّية ورسائل وكاميرا موجّهة نحو نافذة.", "ru": "Подумайте о тайном дневнике, письмах и камере, направленной в окно.", "en": "Think of a secret diary, letters, and a camera aimed at a window."},{"he": "הזכות לפרטיות מגינה על המרחב האישי של אדם. אסור לחדור לביתו, לקרוא את מכתביו או לפרסם מידע עליו בלי הסכמתו. בישראל היא מעוגנת בחוק יסוד: כבוד האדם וחירותו.", "ar": "الحقّ في الخصوصية يحمي الحيّز الشخصيّ للإنسان. لا يجوز اقتحام بيته أو قراءة رسائله أو نشر معلومات عنه دون موافقته. وهو مثبّت في إسرائيل في قانون أساس: كرامة الإنسان وحرّيته.", "ru": "Право на частную жизнь защищает личное пространство человека. Нельзя вторгаться в его дом, читать его письма или публиковать сведения о нём без согласия. В Израиле оно закреплено в Основном законе о достоинстве и свободе человека.", "en": "The right to privacy protects a person's private space. No one may enter their home, read their letters or publish information about them without consent. In Israel it is anchored in Basic Law: Human Dignity and Liberty."},null)

  Q("rights-case1",
    {he:"עירייה אסרה על תושבים לחלק עלונים ברחוב הראשי, כדי לשמור על ניקיון. איזו זכות נפגעה, ומה השאלה שיש לבחון?",
     ar:"منعت بلدية السكّان من توزيع منشورات في الشارع الرئيسيّ حفاظًا على النظافة. أيّ حقّ مُسّ، وما السؤال الواجب فحصه؟",
     ru:"Муниципалитет запретил жителям раздавать листовки на главной улице ради чистоты. Какое право нарушено и какой вопрос надо проверить?",
     en:"A municipality banned residents from handing out leaflets on the main street, to keep it clean. Which right was infringed, and what question must be examined?"},
   [{he:"נפגעה הזכות לקניין, ויש לבחון מי בעל השטח ומי מוסמך להתיר בו פעילות של גורמים פרטיים.",
     ar:"مُسّ الحقّ في الملكية، وينبغي فحص مَن يملك المكان ومَن يخوَّل بالسماح فيه بنشاط جهات خاصّة.",
     ru:"Нарушено право собственности, и следует проверить, кому принадлежит участок и кто вправе разрешать на нём деятельность частных лиц.",
     en:"The right to property was harmed, and one must check who owns the space and who may permit private parties to act there."},
    {he:"נפגע חופש הביטוי, ויש לבחון אם ההגבלה מידתית — האם אין אמצעי פוגעני פחות שמשיג את הניקיון.",
     ar:"مُسّت حرّية التعبير، وينبغي فحص تناسب التقييد، هل من وسيلة أقلّ مساسًا تحقّق النظافة.",
     ru:"Нарушена свобода выражения, и надо проверить соразмерность ограничения: нет ли менее ущемляющего средства достичь чистоты.",
     en:"Freedom of expression was infringed, and one must ask whether the limit is proportionate: whether a less harmful measure achieves the cleanliness."},
    {he:"לא נפגעה זכות — לעירייה סמכות מלאה ברחוב, והיא רשאית לקבוע מי מחלק בו חומר כתוב ומתי.",
     ar:"لم يُمَسّ أيّ حقّ، للبلدية صلاحية كاملة في الشارع، ويحقّ لها تحديد مَن يوزّع فيه موادّ مكتوبة ومتى.",
     ru:"Никакое право не нарушено: у мэрии полная власть над улицей, и она вправе решать, кто и когда раздаёт там печатные материалы.",
     en:"No right was harmed: the municipality has full authority over the street and may decide who hands out printed material there and when."},
    {he:"נפגע חופש העיסוק, ויש לבחון אם למחלקים יש רישיון לחלוקת דברי דפוס ואם העירייה קבעה כללים אחידים לכל המחלקים.",
     ar:"مُسّت حرّية العمل، وينبغي فحص ما إذا كان لدى الموزّعين ترخيص لتوزيع المطبوعات وما إذا وضعت البلدية قواعد موحّدة لجميع الموزّعين.",
     ru:"Нарушена свобода занятий, и следует проверить, есть ли у распространителей разрешение на раздачу печатных материалов и установила ли мэрия единые правила для всех.",
     en:"Freedom of occupation was harmed, and one must check whether the distributors hold a licence to hand out printed matter and whether the municipality set uniform rules for everyone."}],
   1,
   {he:"חלוקת עלון היא דרך להביע דעה. ואם התכלית לגיטימית — האם כל אמצעי כשר?",
    ar:"توزيع المنشور طريقة للتعبير عن رأي. وإن كانت الغاية مشروعة، هل كلّ وسيلة جائزة؟",
    ru:"Раздача листовок: способ выразить мнение. И если цель законна, любое ли средство годится?",
    en:"Handing out a leaflet is a way of expressing an opinion. And if the purpose is legitimate: is any means acceptable?"},
   {he:"תכלית ראויה אינה מכשירה כל אמצעי. פסקת ההגבלה שבחוק־יסוד: כבוד האדם וחירותו דורשת ארבעה תנאים: חוק, ההולם את ערכי המדינה, לתכלית ראויה, ובמידה שאינה עולה על הנדרש.",
    ar:"الغاية المشروعة لا تُجيز كلّ وسيلة. فقرة التقييد في قانون أساس: كرامة الإنسان وحرّيته تشترط أربعة: قانون، يلائم قيم الدولة، لغاية مشروعة، وبقدر لا يتجاوز اللازم.",
    ru:"Достойная цель не оправдывает любое средство. Ограничительная оговорка Основного закона о достоинстве и свободе человека требует четырёх условий: закон, соответствующий ценностям государства, ради достойной цели и в мере, не превышающей необходимую.",
    en:"A worthy purpose does not justify any means. The limitation clause in Basic Law: Human Dignity and Liberty demands four conditions: a statute, befitting the values of the state, for a proper purpose, and to an extent no greater than required."},
   null),
  Q("rights-case2",
    {he:"מעסיק סירב לקבל עובדת לתפקיד משום שהיא אם לילדים קטנים. איזה עיקרון הופר, ומה סוג ההפליה?",
     ar:"رفض صاحب عمل تعيين عاملة لأنها أمّ لأطفال صغار. أيّ مبدأ خُرق، وما نوع التمييز؟",
     ru:"Работодатель отказал соискательнице, потому что она мать малолетних детей. Какой принцип нарушен и каков вид дискриминации?",
     en:"An employer refused to hire a woman because she is the mother of young children. Which principle was breached, and what kind of discrimination is it?"},
   [{he:"לא הופר דבר: למעסיק חופש עיסוק, והוא רשאי לשקול את זמינותה של מועמדת לשעות נוספות ולנסיעות עבודה.",
     ar:"لم يُخرق شيء: لصاحب العمل حرّية عمل، ويحقّ له أن يأخذ في الحسبان مدى تفرّغ المرشّحة لساعات إضافية وأسفار عمل.",
     ru:"Ничего не нарушено: у работодателя есть свобода занятий, и он вправе учитывать готовность кандидатки к сверхурочным и служебным поездкам.",
     en:"Nothing was breached: the employer has freedom of occupation and may weigh a candidate's availability for overtime and work travel."},
    {he:"הופר עקרון השוויון: זו הפליה פסולה, שכן ההורות אינה רלוונטית לכישורים לתפקיד.",
     ar:"خُرق مبدأ المساواة: هذا تمييز مرفوض، لأن الأمومة ليست ذات صلة بمؤهّلات الوظيفة.",
     ru:"Нарушен принцип равенства: это недопустимая дискриминация, поскольку родительство не относится к профессиональным качествам.",
     en:"The principle of equality was breached: this is wrongful discrimination, since parenthood is irrelevant to fitness for the job."},
    {he:"הופרה הזכות לפרטיות בלבד: המעסיק בירר את מצבה המשפחתי של המועמדת, ואין בכך יותר מכך.",
     ar:"خُرق الحقّ في الخصوصية فقط: استفسر صاحب العمل عن الوضع العائليّ للمرشّحة، ولا شيء أبعد من ذلك.",
     ru:"Нарушено только право на частную жизнь: работодатель выяснял семейное положение кандидатки, и не более того.",
     en:"Only the right to privacy was breached: the employer looked into the candidate's family situation, and nothing beyond that."},
    {he:"הופר עקרון חופש ההתאגדות.",
     ar:"خُرق مبدأ حرّية التنظّم.",
     ru:"Нарушен принцип свободы объединений.",
     en:"The principle of freedom of association was breached."}],
   1,
   {he:"שוויון אינו יחס זהה לכולם, אלא יחס שווה לשווים. שאלו אם ההבדל רלוונטי לתפקיד.",
    ar:"المساواة ليست معاملة متطابقة للجميع بل معاملة متساوية للمتساوين. اسألوا إن كان الفارق ذا صلة بالوظيفة.",
    ru:"Равенство: не одинаковое обращение со всеми, а равное обращение с равными. Спросите, относится ли различие к работе.",
    en:"Equality is not identical treatment for all, but equal treatment of equals. Ask whether the difference is relevant to the job."},
   {he:"ההבחנה המרכזית היא בין הבחנה מותרת להפליה אסורה. הבחנה מותרת נשענת על שוני רלוונטי (רישיון נהיגה לנהג אוטובוס); הפליה נשענת על שוני שאינו רלוונטי — מין, גזע, דת, מוצא, נטייה מינית או הורות.",
    ar:"التمييز الجوهريّ بين تفرقة جائزة وتمييز محظور. التفرقة الجائزة تستند إلى فارق ذي صلة (رخصة سياقة لسائق حافلة)؛ أما التمييز فيستند إلى فارق غير ذي صلة، جنس أو عرق أو دين أو أصل أو ميل جنسيّ أو أمومة.",
    ru:"Ключевое различие: между допустимым разграничением и запрещённой дискриминацией. Допустимое опирается на релевантное отличие (водительские права для водителя автобуса); дискриминация: на нерелевантное: пол, расу, религию, происхождение, ориентацию или родительство.",
    en:"The key distinction is between a permitted distinction and forbidden discrimination. A permitted distinction rests on a relevant difference (a driving licence for a bus driver); discrimination rests on an irrelevant one: sex, race, religion, origin, orientation or parenthood."},
   null),
  Q("rights-case3",
    {he:"בית ספר ביקש לפרסם את ציוני התלמידים על לוח המודעות, לפי שם. איזו זכות עומדת מול הרצון לעודד הישגים?",
     ar:"أرادت مدرسة نشر علامات الطلاب على لوح الإعلانات بأسمائهم. أيّ حقّ يقف أمام الرغبة في تشجيع التحصيل؟",
     ru:"Школа захотела вывесить оценки учеников на доске объявлений с именами. Какое право противостоит желанию поощрить успеваемость?",
     en:"A school wanted to post pupils' grades on the notice board, by name. Which right stands against the wish to encourage achievement?"},
   [{he:"הזכות לחינוך: פרסום הציונים עלול להרתיע תלמידים מתקשים מלהמשיך במסלול הלימודים המתקדם.",
     ar:"الحقّ في التعليم: نشر العلامات قد يردع الطلاب المتعثّرين عن مواصلة المسار التعليميّ المتقدّم.",
     ru:"Право на образование: публикация оценок может отпугнуть слабых учеников от продолжения в углублённой программе.",
     en:"The right to education: publishing the grades may deter struggling pupils from continuing in the advanced track."},
    {he:"הזכות לפרטיות ולכבוד: מידע אישי על אדם אינו מתפרסם בלי הסכמתו, גם כשהמטרה חינוכית.",
     ar:"الحقّ في الخصوصية والكرامة: لا يُنشر معلومات شخصية عن إنسان دون موافقته، حتى لو كانت الغاية تربوية.",
     ru:"Право на частную жизнь и достоинство: личные сведения о человеке не публикуют без его согласия, даже с воспитательной целью.",
