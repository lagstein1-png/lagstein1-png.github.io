    ru:"Кнессет: законодательная власть. А что ещё он делает по отношению к исполнительной?",
    en:"The Knesset is the legislature. And what else does it do towards the executive?"},
   {he:"הפיקוח נעשה בכלים מוגדרים: שאילתות, הצעות לסדר היום, ועדות הכנסת, ועדת חקירה פרלמנטרית, אישור התקציב, הבעת אי אמון והצבעה על חוקים. הכנסת גם בוחרת את מבקר המדינה.",
    ar:"تتمّ الرقابة بأدوات محدّدة: أسئلة برلمانية، اقتراحات لجدول الأعمال، لجان الكنيست، لجنة تحقيق برلمانية، إقرار الميزانية، حجب الثقة، والتصويت على القوانين. وتنتخب الكنيست أيضًا مراقب الدولة.",
    ru:"Контроль осуществляется определёнными средствами: запросы, предложения в повестку, комиссии Кнессета, парламентская следственная комиссия, утверждение бюджета, вотум недоверия и голосование по законам. Кнессет также избирает государственного контролёра.",
    en:"Supervision works through defined tools: parliamentary questions, motions for the agenda, Knesset committees, a parliamentary commission of inquiry, approving the budget, a vote of no confidence, and voting on legislation. The Knesset also elects the State Comptroller."},
   null),
  Q("el-1-01",{"he": "כמה חברים יש בכנסת?", "ar": "كم عضوًا في الكنيست؟", "ru": "Сколько членов в Кнессете?", "en": "How many members does the Knesset have?"},[{"he": "61 חברים, כמספר שדרוש לרוב בכנסת.", "ar": "61 عضوًا، وهو العدد اللازم للأغلبية في الكنيست.", "ru": "61 член: столько нужно для большинства в Кнессете.", "en": "61 members, the number needed for a majority in the Knesset."}, {"he": "120 חברי כנסת.", "ar": "120 عضو كنيست.", "ru": "120 членов Кнессета.", "en": "120 Knesset members."}, {"he": "150 חברים, נציג אחד לכל עיר.", "ar": "150 عضوًا، ممثّل واحد لكلّ مدينة.", "ru": "150 членов, по одному от каждого города.", "en": "150 members, one for each city."}, {"he": "90 חברים, 30 מכל מחוז.", "ar": "90 عضوًا، 30 من كلّ لواء.", "ru": "90 членов, по 30 от каждого округа.", "en": "90 members, 30 from each district."}],1,{"he": "זה גם מספר המושבים שמחלקים לפי הקולות.", "ar": "هذا أيضًا عدد المقاعد التي تُوزَّع بحسب الأصوات.", "ru": "Это же число мест делят по голосам.", "en": "This is also the number of seats shared out by the votes."},{"he": "בכנסת יש 120 חברים. רוב של 61 הוא מעל מחצית מהם. אין בישראל נציגים לפי ערים או מחוזות.", "ar": "في الكنيست 120 عضوًا. أغلبية 61 هي أكثر من نصفهم. لا يوجد في إسرائيل ممثّلون بحسب المدن أو الألوية.", "ru": "В Кнессете 120 членов. Большинство в 61 — это больше половины. В Израиле нет представителей от городов или округов.", "en": "The Knesset has 120 members. A majority of 61 is more than half of them. Israel has no representatives by city or district."},null),
  Q("el-1-02",{"he": "מה פירוש העיקרון שהבחירות הן חשאיות?", "ar": "ما معنى مبدأ سرّيّة الانتخابات؟", "ru": "Что означает принцип тайного голосования?", "en": "What does the principle of secret elections mean?"},[{"he": "שמות המועמדים נשמרים בסוד עד יום הבחירות.", "ar": "تبقى أسماء المرشّحين سرًّا حتى يوم الانتخابات.", "ru": "Имена кандидатов держат в тайне до дня выборов.", "en": "The candidates' names are kept secret until election day."}, {"he": "תוצאות הבחירות אינן מתפרסמות לציבור.", "ar": "لا تُنشَر نتائج الانتخابات للجمهور.", "ru": "Результаты выборов не публикуют.", "en": "The election results are not published."}, {"he": "איש אינו יודע למי הבוחר הצביע.", "ar": "لا أحد يعرف لمن صوّت الناخب.", "ru": "Никто не знает, за кого голосовал избиратель.", "en": "No one knows whom the voter voted for."}, {"he": "הקולות נספרים בלי משקיפים מהמפלגות, כדי שלא ילחצו על הסופרים.", "ar": "تُعَدّ الأصوات دون مراقبين من الأحزاب، كي لا يضغطوا على العادّين.", "ru": "Голоса считают без наблюдателей от партий, чтобы на счётчиков не давили.", "en": "Votes are counted without party observers, so no one pressures the counters."}],2,{"he": "חשבו על הפרגוד בקלפי. מה הוא מסתיר?", "ar": "فكّروا في الستارة عند صندوق الاقتراع. ماذا تُخفي؟", "ru": "Вспомните ширму на участке. Что она скрывает?", "en": "Think of the screen at the polling booth. What does it hide?"},{"he": "הבוחר מצביע לבד, מאחורי פרגוד. כך אי אפשר ללחוץ עליו או להעניש אותו. השמות והתוצאות דווקא גלויים לכולם.", "ar": "يصوّت الناخب وحده خلف ستارة. هكذا لا يمكن الضغط عليه أو معاقبته. أمّا الأسماء والنتائج فمعلنة للجميع.", "ru": "Избиратель голосует один, за ширмой. Так на него нельзя давить или наказать его. А имена и результаты открыты всем.", "en": "The voter votes alone, behind a screen. So no one can pressure or punish them. The names and the results are public."},null),
  Q("el-1-03",{"he": "מה פירוש העיקרון שהבחירות הן שוות?", "ar": "ما معنى مبدأ المساواة في الانتخابات؟", "ru": "Что означает принцип равных выборов?", "en": "What does the principle of equal elections mean?"},[{"he": "לכל בוחר יש קול אחד, ולכל קול אותו משקל.", "ar": "لكلّ ناخب صوت واحد، ولكلّ صوت الوزن نفسه.", "ru": "У каждого избирателя один голос, и все голоса весят одинаково.", "en": "Each voter has one vote, and every vote has the same weight."}, {"he": "כל המפלגות מקבלות אותו מספר מושבים, בלי קשר למספר הקולות.", "ar": "تنال كلّ الأحزاب عدد المقاعد نفسه، بغضّ النظر عن عدد الأصوات.", "ru": "Все партии получают одинаковое число мест, независимо от числа голосов.", "en": "All parties get the same number of seats, no matter how many votes they won."}, {"he": "לכל אזור בארץ יש אותו מספר נציגים.", "ar": "لكلّ منطقة في البلاد عدد الممثّلين نفسه.", "ru": "У каждого района страны одинаковое число представителей.", "en": "Every area of the country has the same number of representatives."}, {"he": "כל אזרח חייב להצביע, ומי שאינו מצביע משלם קנס.", "ar": "كلّ مواطن مُلزَم بالتصويت، ومن لا يصوّت يدفع غرامة.", "ru": "Каждый гражданин обязан голосовать, а кто не голосует, платит штраф.", "en": "Every citizen must vote, and anyone who does not pays a fine."}],0,{"he": "חשבו על קולו של שר מול קולו של סטודנט.", "ar": "فكّروا في صوت وزير مقابل صوت طالب.", "ru": "Сравните голос министра и голос студента.", "en": "Compare a minister's vote with a student's vote."},{"he": "השוויון הוא בין הבוחרים, לא בין המפלגות. קולו של כל אדם נספר בדיוק כמו קולו של אחר. בישראל אין חובה להצביע.", "ar": "المساواة بين الناخبين لا بين الأحزاب. يُحسَب صوت كلّ شخص تمامًا مثل صوت غيره. لا يوجد في إسرائيل إلزام بالتصويت.", "ru": "Равенство касается избирателей, а не партий. Голос каждого считается так же, как голос другого. В Израиле голосовать не обязательно.", "en": "Equality is between voters, not between parties. Each person's vote counts exactly like anyone else's. Voting is not compulsory in Israel."},null),
  Q("el-1-04",{"he": "מה פירוש העיקרון שהבחירות הן מחזוריות?", "ar": "ما معنى مبدأ دوريّة الانتخابات؟", "ru": "Что означает принцип периодичности выборов?", "en": "What does the principle of periodic elections mean?"},[{"he": "הבחירות נערכות רק כשהממשלה מחליטה שהגיע הזמן.", "ar": "تُجرى الانتخابات فقط حين تقرّر الحكومة أنّ الوقت قد حان.", "ru": "Выборы проводят, только когда правительство решит, что пора.", "en": "Elections are held only when the government decides it is time."}, {"he": "חבר כנסת נבחר פעם אחת ומכהן עד גיל פרישה, כמו שופט.", "ar": "يُنتخَب عضو الكنيست مرّة واحدة ويخدم حتى سنّ التقاعد، مثل القاضي.", "ru": "Депутата избирают один раз, и он служит до пенсии, как судья.", "en": "A member is elected once and serves until retirement age, like a judge."}, {"he": "הבחירות נערכות בכל שנה, כדי שהציבור יחליף את הכנסת לעיתים קרובות.", "ar": "تُجرى الانتخابات كلّ سنة، كي يغيّر الجمهور الكنيست كثيرًا.", "ru": "Выборы проводят каждый год, чтобы общество могло часто менять Кнессет.", "en": "Elections are held every year, so the public can replace the Knesset often."}, {"he": "הבחירות נערכות במועדים קבועים, ככלל אחת ל-4 שנים.", "ar": "تُجرى الانتخابات في مواعيد ثابتة، عادةً مرّة كلّ 4 سنوات.", "ru": "Выборы проходят в установленные сроки, как правило раз в 4 года.", "en": "Elections are held at set times, as a rule once every 4 years."}],3,{"he": "המילה באה מ״מחזור״ — משהו שחוזר שוב ושוב.", "ar": "الكلمة مأخوذة من الدورة: شيء يتكرّر مرّة بعد مرّة.", "ru": "Слово связано с циклом: тем, что повторяется снова и снова.", "en": "The word comes from a cycle: something that repeats again and again."},{"he": "הכנסת נבחרת לתקופה מוגבלת, ככלל 4 שנים. כך הנבחרים חוזרים לציבור ונותנים דין וחשבון. אפשר להקדים בחירות, אבל הממשלה אינה יכולה לדחות אותן כרצונה.", "ar": "تُنتخَب الكنيست لفترة محدودة، عادةً 4 سنوات. هكذا يعود المنتخَبون إلى الجمهور ويقدّمون الحساب. يمكن تقديم الانتخابات، لكنّ الحكومة لا تستطيع تأجيلها كما تشاء.", "ru": "Кнессет избирают на ограниченный срок, как правило на 4 года. Так избранники возвращаются к обществу и отчитываются. Выборы можно провести раньше, но правительство не может откладывать их по своему желанию.", "en": "The Knesset is elected for a limited term, as a rule 4 years. This way the elected return to the public and are held accountable. Elections can be brought forward, but the government cannot postpone them at will."},null)
 ],
 [ /* רמה 2 — הבנה */
  Q("elect-case1",
    {he:"רשימה קיבלה 2.9% מהקולות הכשרים. מה קורה לקולותיה?",
     ar:"نالت قائمة ٢.٩٪ من الأصوات الصحيحة. ماذا يحدث لأصواتها؟",
     ru:"Список получил 2,9% действительных голосов. Что происходит с этими голосами?",
     en:"A list won 2.9% of the valid votes. What happens to its votes?"},
   [{he:"היא מקבלת שלושה מנדטים לפי חלקה היחסי, שכן השיטה מחלקת מושבים לכל רשימה שקיבלה קולות כשרים.",
     ar:"تحصل على ثلاثة مقاعد بحسب حصّتها النسبية، إذ توزّع الطريقة مقاعد على كلّ قائمة نالت أصواتًا صحيحة.",
     ru:"Она получает три мандата по своей пропорциональной доле, ведь система распределяет места каждому списку, набравшему действительные голоса.",
     en:"It receives three seats according to its proportional share, since the system allots seats to every list that won valid votes."},
    {he:"היא אינה עוברת את אחוז החסימה, אינה מקבלת מנדטים, וקולותיה אינם מיוצגים בכנסת.",
     ar:"لا تجتاز نسبة الحسم ولا تنال مقاعد، وأصواتها غير ممثَّلة في الكنيست.",
     ru:"Он не преодолевает барьер, мандатов не получает, и его голоса в Кнессете не представлены.",
     en:"It fails the threshold, wins no seats, and its votes go unrepresented in the Knesset."},
    {he:"קולותיה עוברים אוטומטית לרשימה הגדולה ביותר, לפי הסכם עודפי הקולות שנחתם לפני הבחירות.",
     ar:"تنتقل أصواتها تلقائيًّا إلى القائمة الأكبر، وفق اتفاق فائض الأصوات الموقَّع قبل الانتخابات.",
     ru:"Её голоса автоматически переходят к самому крупному списку по соглашению об излишках голосов, подписанному до выборов.",
     en:"Its votes pass automatically to the largest list, under the surplus-vote agreement signed before the election."},
    {he:"הבחירות נערכות שוב באזור שבו הצביעו לה.",
     ar:"تُعاد الانتخابات في المنطقة التي صوّتت لها.",
     ru:"В районе, где за него голосовали, выборы проводятся заново.",
     en:"The election is rerun in the area that voted for it."}],
   1,
   {he:"השוו את המספר לאחוז החסימה בישראל.",
    ar:"قارنوا الرقم بنسبة الحسم في إسرائيل.",
    ru:"Сравните число с израильским барьером.",
    en:"Compare the number with Israel's threshold."},
   {he:"קולות שלא עברו את אחוז החסימה נקראים “קולות אבודים”. ככל שהאחוז גבוה יותר, כך גדל מספרם — וזו הביקורת המרכזית על העלאתו. הסכמי עודפים בין רשימות אינם עוזרים למי שלא עבר את הרף.",
    ar:"تُسمّى الأصوات التي لم تجتز الحسم “أصواتًا ضائعة”. وكلّما ارتفعت النسبة زاد عددها، وهذا النقد المركزيّ لرفعها. واتفاقات فائض الأصوات لا تنفع من لم يجتز العتبة.",
    ru:"Голоса, не преодолевшие барьер, называют «потерянными». Чем выше барьер, тем их больше: в этом главная критика его повышения. Соглашения об излишках голосов не помогают тем, кто не взял планку.",
    en:"Votes that fail the threshold are called “wasted votes”. The higher the threshold, the more of them there are: the central criticism of raising it. Surplus-vote agreements do not help a list that fell short."},
   null),
  Q("elect-case2",
    {he:"חברת כנסת מהאופוזיציה מגישה שאילתה לשר על אופן חלוקת תקציב. איזה תפקיד של הכנסת היא ממלאת?",
     ar:"تقدّم عضوة كنيست من المعارضة سؤالًا برلمانيًّا لوزير حول توزيع ميزانية. أيّ وظيفة للكنيست تؤدّيها؟",
     ru:"Депутат от оппозиции подаёт министру запрос о распределении бюджета. Какую функцию Кнессета она исполняет?",
     en:"An opposition member submits a parliamentary question to a minister about how a budget was allocated. Which Knesset function is she performing?"},
   [{he:"תפקיד שיפוטי: היא שופטת את השר על אופן חלוקת התקציב ומחייבת אותו לתקן את החלוקה.",
     ar:"دور قضائيّ: هي تحاكم الوزير على طريقة توزيع الميزانية وتلزمه بتصحيح التوزيع.",
     ru:"Судебная роль: она судит министра за то, как он распределил бюджет, и обязывает его исправить распределение.",
     en:"A judicial role: she judges the minister over the way the budget was divided and orders him to correct it."},
    {he:"תפקיד מכונן: היא מחוקקת חוק יסוד שיסדיר את אופן חלוקת התקציב במשרדים.",
     ar:"دور تأسيسيّ: هي تسنّ قانون أساس ينظّم طريقة توزيع الميزانية في الوزارات.",
     ru:"Учредительная роль: она принимает Основной закон, регулирующий порядок распределения бюджета в министерствах.",
     en:"A constitutive role: she legislates a Basic Law regulating how the budget is divided among ministries."},
    {he:"תפקיד ביצועי: היא מנהלת בפועל את משרד השר בכל הנוגע לחלוקת התקציב.",
     ar:"دور تنفيذيّ: هي تدير فعليًّا وزارة الوزير في كلّ ما يتعلّق بتوزيع الميزانية.",
     ru:"Исполнительная роль: она фактически управляет министерством в том, что касается распределения бюджета.",
     en:"An executive role: she actually runs the minister's office in everything to do with dividing the budget."},
    {he:"תפקיד פיקוח: הכנסת מפקחת על הרשות המבצעת ומחייבת אותה לתת דין וחשבון.",
     ar:"وظيفة رقابية: الكنيست تراقب السلطة التنفيذية وتلزمها بتقديم حساب.",
     ru:"Контрольную: Кнессет надзирает за исполнительной властью и требует отчёта.",
     en:"A supervisory function: the Knesset oversees the executive and requires it to account for itself."}],
   3,
   {he:"היא אינה מחוקקת כאן דבר. מה היא כן עושה כלפי השר?",
    ar:"لا تسنّ هنا شيئًا. فماذا تفعل تجاه الوزير؟",
    ru:"Здесь она ничего не принимает. Что же она делает по отношению к министру?",
    en:"She is not legislating here. So what is she doing towards the minister?"},
   {he:"הפיקוח הפרלמנטרי הוא במידה רבה תפקידה של האופוזיציה: הקואליציה מזוהה עם הממשלה ואינה נוטה לחקור אותה. לכן זכויות האופוזיציה — זמן דיבור, ראשות ועדות ביקורת, זכות לשאילתה — הן חלק מהמנגנון הדמוקרטי ולא נדיבות.",
    ar:"الرقابة البرلمانية في جوهرها وظيفة المعارضة: الائتلاف متماهٍ مع الحكومة ولا يميل لمساءلتها. لذلك حقوق المعارضة، وقت الكلام، رئاسة لجان الرقابة، حقّ السؤال، جزء من الآلية الديمقراطية لا كرم.",
    ru:"Парламентский контроль во многом дело оппозиции: коалиция отождествляется с правительством и не склонна его проверять. Поэтому права оппозиции: время выступлений, председательство в контрольных комиссиях, право запроса: часть демократического механизма, а не любезность.",
    en:"Parliamentary oversight is largely the opposition's job: the coalition identifies with the government and is unlikely to investigate it. That is why opposition rights: speaking time, chairing scrutiny committees, the right to question: are part of the democratic machinery, not a courtesy."},
   null),
  Q("elect-case3",
    {he:"ראש מפלגה קבע לבדו את סדר המועמדים ברשימה, בלי בחירות פנימיות. מהי הבעיה מבחינת עקרונות הדמוקרטיה?",
     ar:"حدّد رئيس حزب وحده ترتيب المرشّحين في القائمة بلا انتخابات داخلية. ما المشكلة من زاوية مبادئ الديمقراطية؟",
     ru:"Лидер партии единолично определил порядок кандидатов в списке без внутренних выборов. В чём проблема с точки зрения демократических принципов?",
     en:"A party leader alone set the order of candidates on the list, with no internal election. What is the problem in terms of democratic principles?"},
   [{he:"אין בעיה: מפלגה היא התאגדות פרטית של חבריה, ומי שאינו מרוצה מסדר הרשימה רשאי לעזוב ולהקים מפלגה משלו — הציבור עצמו מכריע בקלפי בסופו של דבר.",
     ar:"لا مشكلة: الحزب هيئة خاصّة لأعضائه، ومَن لا يرضى بترتيب القائمة يستطيع أن يغادر ويؤسّس حزبًا خاصًّا به، والجمهور نفسه هو الذي يحسم في صندوق الاقتراع في النهاية.",
     ru:"Проблемы нет: партия: частное объединение своих членов, и недовольный порядком списка вправе уйти и создать свою партию, а в конечном счёте решает сам избиратель у урны.",
     en:"There is no problem: a party is a private association of its members, and anyone unhappy with the list order may leave and found his own party: in the end the public decides at the ballot box."},
    {he:"הבעיה היא רק שהרשימה עלולה להפסיד בבחירות.",
     ar:"المشكلة فقط أن القائمة قد تخسر الانتخابات.",
     ru:"Проблема лишь в том, что список может проиграть выборы.",
     en:"The only problem is that the list may lose the election."},
    {he:"בשיטה רשימתית סדר המועמדים קובע מי ייכנס לכנסת. ריכוז ההחלטה בידי אדם אחד פוגע בדמוקרטיה הפנים־מפלגתית ומחליש את אחריותיות הנבחר כלפי חברי המפלגה.",
     ar:"في نظام القوائم يحدّد ترتيب المرشّحين مَن يدخل الكنيست. وتركيز القرار بيد شخص واحد يمسّ الديمقراطية داخل الحزب ويضعف مساءلة المنتخَب أمام أعضائه.",
     ru:"В списочной системе порядок кандидатов решает, кто войдёт в Кнессет. Сосредоточение решения в одних руках подрывает внутрипартийную демократию и ослабляет подотчётность избранного перед членами партии.",
     en:"In a list system the order of candidates decides who enters the Knesset. Concentrating that decision in one person's hands harms internal party democracy and weakens the elected member's accountability to the party's members."},
    {he:"הבעיה היא שהחוק מחייב בחירות פנימיות בכל מפלגה, תמיד.",
     ar:"المشكلة أن القانون يوجب انتخابات داخلية في كلّ حزب دائمًا.",
     ru:"Проблема в том, что закон всегда обязывает партии проводить внутренние выборы.",
     en:"The problem is that the law always requires internal elections in every party."}],
   2,
   {he:"בשיטה רשימתית — למי בעצם הצביע האזרח, ומי קבע את הסדר?",
    ar:"في نظام القوائم، لمن صوّت المواطن فعلًا، ومَن حدّد الترتيب؟",
    ru:"В списочной системе: за кого на деле голосовал гражданин и кто установил порядок?",
    en:"In a list system: whom did the citizen actually vote for, and who set the order?"},
   {he:"החוק בישראל אינו מחייב פריימריז, אך מחייב שהמפלגה תפעל לפי תקנון ושוועדת הבחירות תאשר את הרשימה. מפלגות נבדלות זו מזו: יש פריימריז לחברי מפלגה, יש ועדה מסדרת, ויש מינוי בידי היושב־ראש.",
    ar:"لا يوجب القانون في إسرائيل انتخابات تمهيدية، لكنه يوجب عمل الحزب وفق نظامه الداخليّ ومصادقة لجنة الانتخابات على القائمة. وتتباين الأحزاب: تمهيدية لأعضاء الحزب، أو لجنة ترتيب، أو تعيين من الرئيس.",
    ru:"Израильский закон не обязывает проводить праймериз, но требует, чтобы партия действовала по уставу и чтобы список утвердила избирательная комиссия. Партии различаются: праймериз для членов, «упорядочивающая комиссия» или назначение председателем.",
    en:"Israeli law does not require primaries, but it does require a party to act under its constitution and the list to be approved by the elections committee. Parties differ: primaries for members, an arranging committee, or appointment by the chair."},
   null),
  Q("el-2-01",{"he": "אזרחית בת 18 אינה בעלת רכוש ולא סיימה בגרות. לפי עקרון הבחירות הכלליות, האם היא רשאית להצביע?", "ar": "مواطنة عمرها 18 سنة لا تملك عقارًا ولم تُنهِ البجروت. بحسب مبدأ عموميّة الانتخابات، هل يحقّ لها التصويت؟", "ru": "Гражданке 18 лет, у неё нет имущества и нет аттестата багрут. По принципу всеобщих выборов, может ли она голосовать?", "en": "A citizen aged 18 owns no property and has not finished her matriculation exams. Under the principle of general elections, may she vote?"},[{"he": "לא, היא תוכל להצביע רק אחרי שתתחיל לשלם מס הכנסה.", "ar": "لا، تستطيع التصويت فقط بعد أن تبدأ بدفع ضريبة الدخل.", "ru": "Нет, она сможет голосовать только когда начнёт платить подоходный налог.", "en": "No, she can vote only after she starts paying income tax."}, {"he": "רק אם תסיים קודם את בחינות הבגרות.", "ar": "فقط إذا أنهت امتحانات البجروت أوّلًا.", "ru": "Только если сначала сдаст экзамены багрут.", "en": "Only if she first finishes her matriculation exams."}, {"he": "כן, כל אזרח מגיל 18 זכאי לבחור.", "ar": "نعم، يحقّ لكلّ مواطن من سنّ 18 أن ينتخب.", "ru": "Да, каждый гражданин с 18 лет имеет право голосовать.", "en": "Yes, every citizen aged 18 or over may vote."}, {"he": "לא, גיל ההצבעה בישראל הוא 21.", "ar": "لا، سنّ التصويت في إسرائيل هو 21.", "ru": "Нет, в Израиле голосуют с 21 года.", "en": "No, the voting age in Israel is 21."}],2,{"he": "״כלליות״ — כמה מהאזרחים הבוגרים כלולים?", "ar": "العموميّة: كم من المواطنين البالغين مشمولون؟", "ru": "Всеобщность: сколько взрослых граждан это охватывает?", "en": "General: how many adult citizens does it include?"},{"he": "עקרון הכלליות קובע שכל אזרח בוגר רשאי לבחור. אין תנאי של רכוש, השכלה, מין או דת. גיל ההצבעה לכנסת הוא 18.", "ar": "مبدأ العموميّة يقضي بأنّ لكلّ مواطن بالغ حقّ الانتخاب. لا شرط للملكية أو التعليم أو الجنس أو الدين. سنّ التصويت للكنيست هو 18.", "ru": "Принцип всеобщности: каждый взрослый гражданин может голосовать. Нет условий по имуществу, образованию, полу или религии. Голосовать на выборах в Кнессет можно с 18 лет.", "en": "The general principle says every adult citizen may vote. There is no condition of property, education, sex or religion. The voting age for the Knesset is 18."},null),
  Q("el-2-02",{"he": "אחוז החסימה הוא 3.25%. מהו בערך המספר הקטן ביותר של מנדטים שתקבל רשימה שעברה אותו?", "ar": "نسبة الحسم 3.25%. ما هو تقريبًا أصغر عدد من المقاعد تناله قائمة اجتازتها؟", "ru": "Барьер составляет 3,25%. Какое примерно наименьшее число мандатов получит список, прошедший его?", "en": "The threshold is 3.25%. Roughly what is the smallest number of seats a list that passes it will get?"},[{"he": "כ-4 מנדטים, כי 3.25% מ-120 הם כמעט 4.", "ar": "نحو 4 مقاعد، لأنّ 3.25% من 120 تساوي 4 تقريبًا.", "ru": "Около 4 мандатов: 3,25% от 120 — это почти 4.", "en": "About 4 seats, since 3.25% of 120 is almost 4."}, {"he": "מנדט אחד בלבד.", "ar": "مقعد واحد فقط.", "ru": "Всего один мандат.", "en": "Only one seat."}, {"he": "2 מנדטים, כי הקולות מתחלקים בין שתי רשימות.", "ar": "مقعدان، لأنّ الأصوات تُقسَم بين قائمتين.", "ru": "2 мандата, потому что голоса делят между двумя списками.", "en": "2 seats, because the votes are split between two lists."}, {"he": "10 מנדטים, המספר הקטן ביותר שמאפשר להקים סיעה בכנסת.", "ar": "10 مقاعد، وهو أصغر عدد يسمح بتشكيل كتلة في الكنيست.", "ru": "10 мандатов — минимум, чтобы создать фракцию в Кнессете.", "en": "10 seats, the smallest number that allows forming a faction in the Knesset."}],0,{"he": "חשבו: כמה זה 3 אחוזים ורבע מתוך 120 מושבים?", "ar": "احسبوا: كم تساوي 3 بالمئة وربع من 120 مقعدًا؟", "ru": "Посчитайте: сколько это 3 с четвертью процента от 120 мест?", "en": "Work it out: how much is 3 and a quarter percent of 120 seats?"},{"he": "3.25% מ-120 הם כ-3.9 מושבים. לכן רשימה שעברה את החסימה מקבלת בפועל לפחות כ-4 מנדטים. רשימה קטנה יותר אינה נכנסת כלל.", "ar": "3.25% من 120 تساوي نحو 3.9 مقعد. لذلك تنال القائمة التي اجتازت الحسم فعليًّا نحو 4 مقاعد على الأقلّ. القائمة الأصغر لا تدخل أبدًا.", "ru": "3,25% от 120 — это около 3,9 места. Поэтому список, прошедший барьер, на деле получает не меньше примерно 4 мандатов. Меньший список не проходит вовсе.", "en": "3.25% of 120 is about 3.9 seats. So a list that passes the threshold in practice gets at least about 4 seats. A smaller list does not get in at all."},null),
  Q("el-2-03",{"he": "אחרי הבחירות, 5 מפלגות שיש להן יחד 64 מנדטים הסכימו לתמוך בממשלה אחת. איך נקראת הקבוצה הזאת?", "ar": "بعد الانتخابات، اتّفقت 5 أحزاب لديها معًا 64 مقعدًا على دعم حكومة واحدة. ماذا تُسمّى هذه المجموعة؟", "ru": "После выборов 5 партий, у которых вместе 64 мандата, договорились поддержать одно правительство. Как называется эта группа?", "en": "After the elections, 5 parties with 64 seats together agreed to support one government. What is this group called?"},[{"he": "אופוזיציה, כי היא מורכבת מכמה מפלגות שונות.", "ar": "المعارضة، لأنّها مؤلّفة من عدّة أحزاب مختلفة.", "ru": "Оппозиция, потому что она состоит из нескольких разных партий.", "en": "The opposition, because it is made up of several different parties."}, {"he": "ועדת הכנסת.", "ar": "لجنة الكنيست.", "ru": "Комиссия Кнессета.", "en": "The House Committee."}, {"he": "סיעה אחת, שכל חבריה נבחרו באותה רשימה.", "ar": "كتلة واحدة، انتُخب جميع أعضائها في القائمة نفسها.", "ru": "Одна фракция, все члены которой избраны по одному списку.", "en": "A single faction, all of whose members were elected on the same list."}, {"he": "קואליציה, שהממשלה נשענת עליה.", "ar": "الائتلاف، الذي تستند إليه الحكومة.", "ru": "Коалиция, на которую опирается правительство.", "en": "A coalition, which the government relies on."}],3,{"he": "64 הם יותר ממחצית הכנסת. מי שיש לו רוב כזה תומך בשלטון.", "ar": "64 أكثر من نصف الكنيست. من لديه أغلبية كهذه يدعم الحكم.", "ru": "64 — больше половины Кнессета. Такое большинство поддерживает власть.", "en": "64 is more than half of the Knesset. Whoever has such a majority supports the government."},{"he": "מפלגות שמתחברות כדי לתמוך בממשלה יוצרות קואליציה. הממשלה צריכה את הרוב שלה כדי לפעול. המפלגות שאינן בקואליציה הן האופוזיציה.", "ar": "الأحزاب التي تتّحد لدعم الحكومة تشكّل ائتلافًا. تحتاج الحكومة إلى أغلبيّته كي تعمل. الأحزاب التي ليست في الائتلاف هي المعارضة.", "ru": "Партии, которые объединяются, чтобы поддержать правительство, образуют коалицию. Правительству нужно её большинство, чтобы действовать. Партии вне коалиции — это оппозиция.", "en": "Parties that join to support the government form a coalition. The government needs its majority in order to act. The parties outside the coalition are the opposition."},null),
  Q("el-2-04",{"he": "הצעת חוק עברה קריאה ראשונה בכנסת. איפה עובדים בדרך כלל על הנוסח המפורט שלה לפני הקריאה השנייה והשלישית?", "ar": "اجتاز اقتراح قانون القراءة الأولى في الكنيست. أين يُعمَل عادةً على صيغته المفصّلة قبل القراءتين الثانية والثالثة؟", "ru": "Законопроект прошёл первое чтение в Кнессете. Где обычно работают над его подробным текстом перед вторым и третьим чтением?", "en": "A bill has passed its first reading in the Knesset. Where is its detailed wording usually worked on before the second and third readings?"},[{"he": "בבית המשפט העליון, שבודק כל הצעת חוק לפני שהיא עוברת.", "ar": "في المحكمة العليا، التي تفحص كلّ اقتراح قانون قبل إقراره.", "ru": "В Верховном суде, который проверяет каждый законопроект до принятия.", "en": "In the Supreme Court, which checks every bill before it passes."}, {"he": "בוועדה של הכנסת שעוסקת בנושא.", "ar": "في لجنة الكنيست المختصّة بالموضوع.", "ru": "В комиссии Кнессета, которая занимается этой темой.", "en": "In the Knesset committee that deals with the subject."}, {"he": "אצל נשיא המדינה.", "ar": "عند رئيس الدولة.", "ru": "У президента государства.", "en": "With the President of the State."}, {"he": "במשרד הממשלתי שהציע אותה, בלי שהכנסת מעורבת בכך.", "ar": "في الوزارة التي اقترحته، دون أن تشارك الكنيست في ذلك.", "ru": "В министерстве, которое его предложило, без участия Кнессета.", "en": "In the ministry that proposed it, without the Knesset taking part."}],1,{"he": "בכנסת יש קבוצות קטנות של חברים, וכל אחת מתמחה בתחום אחר.", "ar": "في الكنيست مجموعات صغيرة من الأعضاء، وكلّ منها مختصّة بمجال آخر.", "ru": "В Кнессете есть небольшие группы депутатов, и каждая занимается своей областью.", "en": "The Knesset has small groups of members, each focused on a different field."},{"he": "אחרי הקריאה הראשונה ההצעה עוברת לוועדה מתאימה. שם דנים בה סעיף אחר סעיף ומכינים אותה לקריאה השנייה והשלישית. כך הכנסת מחוקקת בעיון ולא בחיפזון.", "ar": "بعد القراءة الأولى ينتقل الاقتراح إلى لجنة مناسبة. هناك يُناقَش بندًا بندًا ويُحضَّر للقراءتين الثانية والثالثة. هكذا تشرّع الكنيست بتمعّن لا بتسرّع.", "ru": "После первого чтения законопроект передают в подходящую комиссию. Там его обсуждают по статьям и готовят ко второму и третьему чтению. Так Кнессет принимает законы вдумчиво, а не наспех.", "en": "After the first reading the bill goes to a suitable committee. There it is discussed clause by clause and prepared for the second and third readings. This way the Knesset legislates with care, not in haste."},null)
 ],
 [ /* רמה 3 — ניתוח */
  Q("elect-anal1",
    {he:"מוצע להעלות את אחוז החסימה ל-6%. נתחו את הטיעון בעד ואת הטיעון נגד.",
     ar:"يُقترح رفع نسبة الحسم إلى ٦٪. حلّلوا الحجّة مع والحجّة ضدّ.",
     ru:"Предлагается поднять барьер до 6%. Проанализируйте доводы за и против.",
     en:"It is proposed to raise the electoral threshold to 6%. Analyse the argument for and the argument against."},
   [{he:"בעד — פחות מפלגות וממשלה יציבה יותר; נגד — יותר קולות אבודים, ופגיעה חמורה בייצוג קבוצות מיעוט קטנות.",
     ar:"مع، أحزاب أقلّ وحكومة أكثر استقرارًا؛ ضدّ، أصوات ضائعة أكثر ومساس شديد بتمثيل مجموعات أقلية صغيرة.",
     ru:"За: меньше партий и устойчивее правительство; против: больше потерянных голосов и серьёзный удар по представительству малых меньшинств.",
     en:"For: fewer parties and a more stable government; against: more wasted votes and serious harm to the representation of small minority groups."},
    {he:"בעד — הבחירות יעלו פחות כסף; נגד — ספירת הקולות תארך יותר.",
     ar:"مع، الانتخابات أقلّ كلفة؛ ضدّ، فرز الأصوات يطول.",
     ru:"За: выборы обойдутся дешевле; против: подсчёт голосов затянется.",
     en:"For: the election will cost less; against: counting will take longer."},
    {he:"בעד — יותר מפלגות ייכנסו לכנסת והייצוג יתרחב; נגד — הממשלה תתחלף לעיתים קרובות ולא תוכל לתכנן לטווח ארוך.",
     ar:"معه، ستدخل أحزاب أكثر إلى الكنيست ويتّسع التمثيل؛ ضدّه، ستتبدّل الحكومة مرارًا ولن تتمكّن من التخطيط بعيد المدى.",
     ru:"За: в Кнессет пройдёт больше партий и представительство расширится; против: правительство будет часто меняться и не сможет планировать надолго.",
     en:"For: more parties will enter the Knesset and representation will widen; against: the government will change often and will not be able to plan for the long term."},
    {he:"בעד — השיטה תהפוך לאזורית; נגד — יידרש תיקון בחוק־יסוד: השפיטה.",
     ar:"مع، يتحوّل النظام إقليميًّا؛ ضدّ، يلزم تعديل قانون أساس: القضاء.",
     ru:"За: система станет окружной; против: понадобится поправка к Основному закону о судебной власти.",
     en:"For: the system becomes regional; against. It would require amending Basic Law: the Judiciary."}],
   0,
   {he:"מה מרוויחים ביציבות, ומה מפסידים בייצוג? זו אותה מטבע.",
    ar:"ماذا نربح في الاستقرار وماذا نخسر في التمثيل؟ إنها العملة ذاتها.",
    ru:"Что выигрывается в устойчивости и что теряется в представительности? Это одна и та же монета.",
    en:"What is gained in stability, and what is lost in representation? They are two sides of one coin."},
   {he:"זהו מתח קלאסי בין ייצוגיות ליעילות הממשל. חשוב לשים לב שההשפעה אינה שווה: רף גבוה פוגע קודם כול במפלגות של מיעוטים ושל קבוצות פרוסות דק — ולכן זו גם שאלה של שוויון ולא רק של יעילות.",
    ar:"هذا توتّر كلاسيكيّ بين التمثيل وفاعلية الحكم. والمهمّ أن الأثر ليس متساويًا: العتبة العالية تضرب أولًا أحزاب الأقليات والمجموعات المنتشرة رقيقًا، فهي مسألة مساواة لا فاعلية فحسب.",
    ru:"Это классическое напряжение между представительностью и эффективностью управления. Важно, что эффект неравномерен: высокий барьер бьёт прежде всего по партиям меньшинств и рассеянных групп: значит, это и вопрос равенства, а не только эффективности.",
    en:"This is the classic tension between representation and effective government. Note that the effect is not evenly spread: a high bar hits first the parties of minorities and thinly spread groups, so it is a question of equality too, not only of efficiency."},
   null),
  Q("elect-anal2",
    {he:"מדוע ריבוי מפלגות בשיטה יחסית מגדיל את כוחן של מפלגות קטנות מעבר לגודלן?",
     ar:"لماذا تُكبِر كثرةُ الأحزاب في النظام النسبيّ قوّةَ الأحزاب الصغيرة فوق حجمها؟",
     ru:"Почему множество партий при пропорциональной системе усиливает малые партии сверх их размера?",
     en:"Why does a multiplicity of parties under a proportional system give small parties power beyond their size?"},
   [{he:"מפני שהחוק מחייב לתת להן משרדי ממשלה.",
     ar:"لأن القانون يوجب منحها وزارات.",
     ru:"Потому что закон обязывает давать им министерства.",
     en:"Because the law requires giving them ministries."},
    {he:"מפני שאין רשימה בעלת רוב עצמאי, וכל מפלגה שקולותיה נחוצים להשלמת 61 יכולה להתנות את הצטרפותה בדרישות.",
     ar:"لأن لا قائمة تملك أغلبية مستقلّة، وكلّ حزب أصواته لازمة لإكمال ٦١ يستطيع اشتراط مطالب لانضمامه.",
     ru:"Потому что ни у одного списка нет самостоятельного большинства, и любая партия, чьи голоса нужны для 61, может выдвинуть условия.",
     en:"Because no list has a majority of its own, and any party whose votes are needed to reach 61 can attach conditions to joining."},
    {he:"מפני שמפלגות קטנות מקבלות יותר זמן שידור בתעמולה ומימון ציבורי גבוה יחסית לגודלן, וכך השפעתן על סדר היום גדלה.",
     ar:"لأنّ الأحزاب الصغيرة تحصل على وقت بثّ دعائيّ أكبر وتمويل عامّ مرتفع نسبةً إلى حجمها، فيتّسع تأثيرها على جدول الأعمال.",
     ru:"Потому что малые партии получают больше эфирного времени в агитации и относительно большое государственное финансирование, и их влияние на повестку растёт.",
     en:"Because small parties get more campaign broadcast time and relatively large public funding, so their influence over the agenda grows."},
    {he:"מפני שאחוז החסימה אינו חל עליהן.",
     ar:"لأن نسبة الحسم لا تسري عليها.",
     ru:"Потому что барьер на них не распространяется.",
     en:"Because the threshold does not apply to them."}],
   1,
   {he:"כמה מנדטים דרושים לממשלה, וכמה יש למפלגה הגדולה בפועל?",
    ar:"كم مقعدًا تلزم الحكومة، وكم للحزب الأكبر فعليًّا؟",
    ru:"Сколько мандатов нужно правительству и сколько на деле у крупнейшей партии?",
    en:"How many seats does a government need, and how many does the largest party actually hold?"},
   {he:"זה מכונה “כוח סחיטה קואליציוני”. הוא אינו פגם בשיטה אלא תוצאה ישירה שלה, והוא הטיעון המרכזי בעד רפורמות ממשל — אחוז חסימה גבוה, בחירות אזוריות או ממשלה נבחרת ישירות. לכל אחת מהן מחיר משלה בייצוגיות.",
    ar:"يُسمّى هذا “قوّة الابتزاز الائتلافيّ”. ليس عيبًا في النظام بل نتيجة مباشرة له، وهو الحجّة المركزية لإصلاحات الحكم، عتبة أعلى، انتخابات إقليمية، أو حكومة منتخبة مباشرة. ولكلٍّ ثمنه في التمثيل.",
    ru:"Это называют «коалиционной силой шантажа». Это не изъян системы, а её прямое следствие, и главный довод за реформы управления: высокий барьер, окружные выборы или прямо избираемое правительство. У каждой из них своя цена в представительности.",
    en:"This is called coalition blackmail power. It is not a flaw in the system but a direct result of it, and the central argument for governance reforms: a higher threshold, regional elections, or a directly elected government. Each carries its own price in representation."},
   null),
  Q("elect-anal3",
    {he:"בשנות התשעים נבחר ראש הממשלה בישראל בבחירה ישירה, והשיטה בוטלה. מה לימד הניסיון הזה?",
     ar:"في التسعينيات انتُخب رئيس الحكومة في إسرائيل انتخابًا مباشرًا، ثم أُلغي النظام. ماذا علّمت هذه التجربة؟",
     ru:"В 1990-е главу правительства Израиля избирали напрямую, но систему отменили. Чему научил этот опыт?",
     en:"In the 1990s Israel's prime minister was directly elected, and the system was abolished. What did that experiment teach?"},
   [{he:"שהבחירה הישירה מנעה לחלוטין קואליציות: ראש הממשלה מינה ממשלה מטעמו בלי להישען על רוב בכנסת, וכך נשחקה עבודת הכנסת ואבד הפיקוח שלה.",
     ar:"أنّ الانتخاب المباشر منع الائتلافات تمامًا: عيّن رئيس الحكومة حكومة من طرفه دون الاستناد إلى أغلبية في الكنيست، فتآكل عمل الكنيست وضاعت رقابتها.",
     ru:"Что прямые выборы полностью устранили коалиции: премьер назначал своё правительство, не опираясь на большинство в Кнессете, работа Кнессета обесценилась, а его контроль исчез.",
     en:"That direct election abolished coalitions altogether: the prime minister appointed his own cabinet without a Knesset majority, the Knesset's work was eroded and its oversight disappeared."},
    {he:"שהמצביעים פיצלו את הפתק: הצביעו לראש ממשלה מצד אחד ולמפלגה קטנה מצד שני, וכך המפלגות הגדולות נחלשו וכוח המיקוח של הקטנות גדל.",
     ar:"أن الناخبين شطروا التصويت: لرئيس حكومة من جهة ولحزب صغير من جهة أخرى، فضعفت الأحزاب الكبيرة وازدادت قوّة مساومة الصغيرة.",
     ru:"Что избиратели расщепили голос: за премьера с одной стороны и за малую партию с другой, отчего крупные партии ослабли, а торг малых усилился.",
     en:"That voters split their ballot: one vote for prime minister and another for a small party, so the big parties weakened and the small ones' bargaining power grew."},
    {he:"שהשיטה חייבה כתיבת חוקה מלאה, שכן בחירה ישירה מחייבת הגדרה כתובה של סמכויות ראש הממשלה מול הכנסת, ובלי חוקה כזאת היא לא יכלה להתקיים.",
     ar:"أنّ الطريقة استوجبت كتابة دستور كامل، إذ يستلزم الانتخاب المباشر تحديدًا مكتوبًا لصلاحيات رئيس الحكومة مقابل الكنيست، وبدون دستور كهذا لم تكن لتستمرّ.",
     ru:"Что система потребовала написать полную конституцию, ведь прямые выборы требуют письменного определения полномочий премьера по отношению к Кнессету, и без такой конституции она не могла существовать.",
     en:"That the system required writing a full constitution, since direct election demands a written definition of the prime minister's powers against the Knesset, and without such a constitution it could not survive."},
    {he:"שהשיטה העלתה את אחוז ההצבעה מעל תשעים אחוז, מפני שהמצביעים הרגישו שקולם משפיע ישירות על זהות ראש הממשלה, ולכן נחשבה הצלחה דמוקרטית.",
     ar:"أنّ الطريقة رفعت نسبة التصويت فوق تسعين بالمئة، لأنّ المصوّتين شعروا أنّ صوتهم يؤثّر مباشرةً في هويّة رئيس الحكومة، ولذلك عُدّت نجاحًا ديمقراطيًّا.",
     ru:"Что система подняла явку выше девяноста процентов, ведь избиратели чувствовали, что их голос прямо решает, кто станет премьером, и потому её сочли демократическим успехом.",
     en:"That the system pushed turnout above ninety percent, because voters felt their ballot directly decided who would be prime minister, and so it was judged a democratic success."}],
   1,
   {he:"כשיש שני פתקים, אפשר להצביע בשניהם אחרת. מה זה עשה למפלגות הגדולות?",
    ar:"حين يوجد ورقتان يمكن التصويت في كلٍّ بشكل مختلف. ماذا فعل ذلك بالأحزاب الكبيرة؟",
    ru:"Когда бюллетеня два, в каждом можно голосовать по-разному. Что это сделало с крупными партиями?",
    en:"With two ballots you can vote differently in each. What did that do to the big parties?"},
   {he:"הלקח המרכזי הוא שרפורמה במוסד אחד משנה התנהגות במוסד אחר. שיטה שנועדה לחזק את ראש הממשלה החלישה את מפלגתו, ולכן החלישה גם אותו — דוגמה לכך שכללי משחק אינם ניטרליים.",
    ar:"الدرس المركزيّ أن إصلاح مؤسّسة واحدة يغيّر السلوك في أخرى. نظام قُصد به تقوية رئيس الحكومة أضعف حزبه، فأضعفه هو أيضًا، مثال على أن قواعد اللعبة ليست محايدة.",
    ru:"Главный урок: реформа одного института меняет поведение в другом. Система, задуманная усилить премьера, ослабила его партию, а значит и его самого: пример того, что правила игры не нейтральны.",
    en:"The main lesson is that reforming one institution changes behaviour in another. A system meant to strengthen the prime minister weakened his party, and so weakened him: an example of how rules of the game are never neutral."},
   null),
  Q("el-3-01",{"he": "בישראל מצביעים לרשימה ולא לאדם מסוים. האם הבחירות עדיין נחשבות ״ישירות״? נמקו.", "ar": "في إسرائيل يُصوَّت لقائمة لا لشخص معيّن. هل ما زالت الانتخابات تُعدّ مباشرة؟ علّلوا.", "ru": "В Израиле голосуют за список, а не за конкретного человека. Считаются ли выборы при этом прямыми? Объясните.", "en": "In Israel people vote for a list, not for a specific person. Are the elections still considered direct? Explain."},[{"he": "לא: הבוחר אינו כותב שם של מועמד, ולכן לפי החוק הבחירות נחשבות עקיפות.", "ar": "لا: لا يكتب الناخب اسم مرشّح، لذلك تُعدّ الانتخابات بحسب القانون غير مباشرة.", "ru": "Нет: избиратель не пишет имя кандидата, поэтому по закону выборы считаются косвенными.", "en": "No: the voter does not write a candidate's name, so by law the elections count as indirect."}, {"he": "כן, כי כל בוחר פוגש את המועמדים באופן אישי לפני הבחירות.", "ar": "نعم، لأنّ كلّ ناخب يلتقي بالمرشّحين شخصيًّا قبل الانتخابات.", "ru": "Да, потому что каждый избиратель лично встречается с кандидатами до выборов.", "en": "Yes, because every voter meets the candidates in person before the elections."}, {"he": "לא, כי נשיא המדינה בוחר את חברי הכנסת מתוך הרשימות.", "ar": "لا، لأنّ رئيس الدولة يختار أعضاء الكنيست من القوائم.", "ru": "Нет, потому что президент выбирает депутатов из списков.", "en": "No, because the President chooses the Knesset members from the lists."}, {"he": "כן: הקולות קובעים ישר את חלוקת המושבים, בלי גוף מתווך.", "ar": "نعم: تحدّد الأصوات مباشرةً توزيع المقاعد، دون هيئة وسيطة.", "ru": "Да: голоса прямо определяют места, без посредника.", "en": "Yes: the votes decide the seats directly, with no middle body."}],3,{"he": "מה ההבדל בין הצבעה לרשימה לבין הצבעה לאלקטורים?", "ar": "ما الفرق بين التصويت لقائمة والتصويت لمندوبين؟", "ru": "Чем голосование за список отличается от голосования за выборщиков?", "en": "How is voting for a list different from voting for electors?"},{"he": "״ישירות״ פירושו שאין שלב ביניים של נציגים שבוחרים במקום הציבור. הקולות עצמם קובעים כמה מושבים כל רשימה תקבל. העובדה שמצביעים לרשימה אינה הופכת את הבחירות לעקיפות.", "ar": "المباشرة تعني أنّه لا توجد مرحلة وسيطة لمندوبين يختارون بدل الجمهور. الأصوات نفسها تحدّد كم مقعدًا تنال كلّ قائمة. التصويت لقائمة لا يجعل الانتخابات غير مباشرة.", "ru": "Прямые выборы значат, что нет промежуточного этапа, где представители выбирают вместо общества. Сами голоса определяют, сколько мест получит каждый список. Голосование за список не делает выборы косвенными.", "en": "Direct means there is no middle stage of delegates choosing in the public's place. The votes themselves decide how many seats each list gets. Voting for a list does not make the elections indirect."},null),
  Q("el-3-02",{"he": "עובד חושש שהמעסיק שלו ירצה לדעת למי הצביע. מדוע עקרון החשאיות חשוב במיוחד במצב כזה?", "ar": "يخشى عامل أن يرغب صاحب العمل في معرفة لمن صوّت. لماذا مبدأ السرّيّة مهمّ خصوصًا في وضع كهذا؟", "ru": "Работник боится, что работодатель захочет узнать, за кого он голосовал. Почему тайна голосования особенно важна в такой ситуации?", "en": "A worker fears his employer will want to know whom he voted for. Why is the secret ballot especially important in such a case?"},[{"he": "כי החשאיות מקצרת את ספירת הקולות.", "ar": "لأنّ السرّيّة تختصر عدّ الأصوات.", "ru": "Потому что тайна ускоряет подсчёт голосов.", "en": "Because secrecy makes the vote count shorter."}, {"he": "כי אם איש אינו יודע איך הצביע, אי אפשר להעניש אותו, והוא בוחר לפי רצונו.", "ar": "لأنّه إذا لم يعرف أحد كيف صوّت، لا يمكن معاقبته، فيختار وفق إرادته.", "ru": "Потому что, если никто не знает, как он голосовал, его нельзя наказать, и он выбирает свободно.", "en": "Because if no one knows how he voted, he cannot be punished, and he chooses freely."}, {"he": "כי החשאיות מבטיחה שכל הרשימות יקבלו מספר דומה של קולות, בלי הבדל בין רשימה גדולה לקטנה.", "ar": "لأنّ السرّيّة تضمن أن تنال كلّ القوائم عددًا متقاربًا من الأصوات، دون فرق بين قائمة كبيرة وصغيرة.", "ru": "Потому что тайна гарантирует, что все списки получат похожее число голосов, без разницы между большим и малым.", "en": "Because secrecy ensures that all lists get a similar number of votes, with no difference between large and small ones."}, {"he": "כי בלי חשאיות הבחירות אינן ארציות.", "ar": "لأنّه دون السرّيّة لا تكون الانتخابات قُطريّة.", "ru": "Потому что без тайны выборы не будут общенациональными.", "en": "Because without secrecy the elections are not national."}],1,{"he": "חשבו על מה יכול לקרות לעובד אם הצבעתו גלויה.", "ar": "فكّروا فيما قد يحدث للعامل إذا كان تصويته مكشوفًا.", "ru": "Подумайте, что может случиться с работником, если его голос известен.", "en": "Think about what could happen to the worker if his vote were known."},{"he": "כשההצבעה גלויה, מי שיש לו כוח על הבוחר יכול ללחוץ עליו. החשאיות מגינה על הבוחר ומאפשרת לו בחירה חופשית. היא אינה קשורה למהירות הספירה או לגודל הרשימות.", "ar": "حين يكون التصويت مكشوفًا، يستطيع صاحب النفوذ على الناخب أن يضغط عليه. السرّيّة تحمي الناخب وتتيح له اختيارًا حرًّا. لا علاقة لها بسرعة العدّ أو بحجم القوائم.", "ru": "Когда голосование открыто, тот, у кого есть власть над избирателем, может на него давить. Тайна защищает избирателя и даёт ему свободный выбор. Она не связана со скоростью подсчёта или размером списков.", "en": "When voting is open, whoever has power over the voter can pressure him. Secrecy protects the voter and allows a free choice. It has nothing to do with the speed of the count or the size of the lists."},null),
  Q("el-3-03",{"he": "לאופוזיציה אין רוב בכנסת. מדוע בכל זאת חשוב שתהיה אופוזיציה פעילה?", "ar": "ليس للمعارضة أغلبية في الكنيست. لماذا من المهمّ مع ذلك وجود معارضة نشطة؟", "ru": "У оппозиции нет большинства в Кнессете. Почему всё же важно, чтобы она была активной?", "en": "The opposition has no majority in the Knesset. Why is an active opposition still important?"},[{"he": "היא מבקרת את הממשלה, חושפת ליקויים ומציעה דרך אחרת.", "ar": "تنتقد الحكومة وتكشف العيوب وتقترح طريقًا آخر.", "ru": "Она критикует правительство, вскрывает недостатки и предлагает другой путь.", "en": "It criticises the government, exposes failures and offers another way."}, {"he": "כי היא יכולה לבטל לבד כל החלטה של הממשלה, גם בלי רוב.", "ar": "لأنّها تستطيع وحدها إلغاء أيّ قرار للحكومة، حتى دون أغلبية.", "ru": "Потому что она может сама отменить любое решение правительства, даже без большинства.", "en": "Because it can cancel any government decision on its own, even without a majority."}, {"he": "כי היא ממנה את השופטים.", "ar": "لأنّها تعيّن القضاة.", "ru": "Потому что она назначает судей.", "en": "Because it appoints the judges."}, {"he": "כי לפי החוק היא מנהלת חצי ממשרדי הממשלה, וכך חולקת את השלטון עם הקואליציה.", "ar": "لأنّها بحسب القانون تدير نصف الوزارات، وهكذا تتقاسم الحكم مع الائتلاف.", "ru": "Потому что по закону она управляет половиной министерств и так делит власть с коалицией.", "en": "Because by law it runs half of the ministries, and so shares power with the coalition."}],0,{"he": "מי שאינו מחליט יכול עדיין לשאול שאלות ולהשמיע ביקורת.", "ar": "من لا يقرّر يستطيع مع ذلك أن يسأل وينتقد.", "ru": "Тот, кто не решает, всё равно может задавать вопросы и критиковать.", "en": "Someone who does not decide can still ask questions and criticise."},{"he": "לאופוזיציה אין כוח להחליט, אבל יש לה כלים לפקח: שאילתות, דיונים והצעות. כך הממשלה צריכה לתת דין וחשבון. האופוזיציה גם מציגה לציבור חלופה לבחירות הבאות.", "ar": "ليس للمعارضة قوّة القرار، لكن لديها أدوات للرقابة: استجوابات ونقاشات واقتراحات. هكذا تضطرّ الحكومة إلى تقديم الحساب. وتعرض المعارضة على الجمهور بديلًا للانتخابات القادمة.", "ru": "У оппозиции нет силы решать, но есть средства контроля: запросы, обсуждения и предложения. Так правительству приходится отчитываться. Оппозиция также предлагает обществу альтернативу на следующих выборах.", "en": "The opposition cannot decide, but it has tools to oversee: questions, debates and motions. So the government must give account. The opposition also offers the public an alternative for the next elections."},null),
  Q("el-3-04",{"he": "בשיטה אזורית, מפלגה יכולה לקבל 40% מהקולות ו-60% מהמושבים. על איזה עיקרון השיטה הישראלית שומרת טוב יותר, ומדוע?", "ar": "في النظام الإقليمي، قد ينال حزب 40% من الأصوات و60% من المقاعد. على أيّ مبدأ يحافظ النظام الإسرائيلي بشكل أفضل، ولماذا؟", "ru": "При системе по округам партия может получить 40% голосов и 60% мест. Какой принцип израильская система соблюдает лучше и почему?", "en": "Under a district system, a party can win 40% of the votes and 60% of the seats. Which principle does the Israeli system keep better, and why?"},[{"he": "חשאיות, כי בשיטה אזורית הבוחרים מצביעים בגלוי.", "ar": "السرّيّة، لأنّ الناخبين في النظام الإقليمي يصوّتون علنًا.", "ru": "Тайну, потому что при системе по округам голосуют открыто.", "en": "Secrecy, because in a district system voters vote openly."}, {"he": "מחזוריות, כי בשיטה אזורית אין מועד קבוע לבחירות, ולכן הנבחרים מכהנים בלי הגבלת זמן.", "ar": "الدوريّة، لأنّه لا موعد ثابتًا للانتخابات في النظام الإقليمي، لذا يخدم المنتخَبون دون حدّ زمني.", "ru": "Периодичность, потому что при системе по округам нет установленного срока выборов, и избранные служат без ограничения.", "en": "Periodicity, because a district system has no fixed election date, so the elected serve without a time limit."}, {"he": "יחסיות: חלק המפלגה בכנסת קרוב לחלקה בקולות.", "ar": "النسبيّة: حصّة الحزب في الكنيست قريبة من حصّته في الأصوات.", "ru": "Пропорциональность: доля партии в Кнессете близка к её доле голосов.", "en": "Proportionality: a party's share of the Knesset is close to its share of the vote."}, {"he": "כלליות, כי בשיטה אזורית רק בעלי רכוש מצביעים.", "ar": "العموميّة، لأنّه في النظام الإقليمي يصوّت أصحاب الأملاك فقط.", "ru": "Всеобщность, потому что при системе по округам голосуют только собственники.", "en": "Generality, because in a district system only property owners vote."}],2,{"he": "השוו את שני המספרים בשאלה. מה צריך להיות היחס ביניהם?", "ar": "قارنوا العددين في السؤال. ماذا يجب أن تكون العلاقة بينهما؟", "ru": "Сравните два числа в вопросе. Каким должно быть соотношение между ними?", "en": "Compare the two numbers in the question. What should the relation between them be?"},{"he": "בשיטה הישראלית רשימה מקבלת מושבים לפי חלקה בקולות. לכן 40% מהקולות יביאו בערך 40% מהמושבים. הפער שבשאלה נוצר בשיטה אזורית, ואינו קשור לחשאיות, למחזוריות או לכלליות.", "ar": "في النظام الإسرائيلي تنال القائمة مقاعد بحسب حصّتها من الأصوات. لذلك تجلب 40% من الأصوات نحو 40% من المقاعد. الفجوة في السؤال تنشأ في النظام الإقليمي، ولا علاقة لها بالسرّيّة أو الدوريّة أو العموميّة.", "ru": "В израильской системе список получает места по своей доле голосов. Поэтому 40% голосов дадут примерно 40% мест. Разрыв из вопроса возникает при системе по округам и не связан с тайной, периодичностью или всеобщностью.", "en": "In the Israeli system a list gets seats by its share of the vote. So 40% of the votes bring about 40% of the seats. The gap in the question comes from a district system and is not about secrecy, periodicity or generality."},null)
 ]
]);

topic("exec","gov",
  {he:"הממשלה והרשות השופטת",ar:"الحكومة والسلطة القضائية",ru:"Правительство и судебная власть",en:"The government and the judiciary"},
  {he:"הרכבת ממשלה, אחריות מיניסטריאלית, ועצמאות השופטים",
   ar:"تشكيل الحكومة، المسؤولية الوزارية، واستقلال القضاة",
   ru:"Формирование правительства, министерская ответственность и независимость судей",
   en:"Forming a government, ministerial responsibility, and judicial independence"},
[
 [ /* רמה 1 — ידע */
  Q("exec-form",
    {he:"מי מטיל את התפקיד להרכיב ממשלה בישראל?",
     ar:"مَن يكلّف بتشكيل الحكومة في إسرائيل؟",
     ru:"Кто поручает формирование правительства в Израиле?",
     en:"Who entrusts the task of forming a government in Israel?"},
   [{he:"יושב ראש הכנסת, לפי גודל הסיעות שנבחרו.",
     ar:"رئيس الكنيست، بحسب حجم الكتل التي انتُخبت.",
     ru:"Председатель Кнессета: по величине избранных фракций.",
     en:"The Speaker of the Knesset, according to the size of the elected factions."},
    {he:"נשיא המדינה, אחרי התייעצות עם נציגי הסיעות.",
     ar:"رئيس الدولة، بعد مشاورة ممثّلي الكتل.",
     ru:"Президент государства, после консультаций с представителями фракций.",
     en:"The president of the state, after consulting the factions' representatives."},
    {he:"נשיא בית המשפט העליון, בטקס שבו מושבעת הממשלה.",
     ar:"رئيس المحكمة العليا، في المراسم التي تؤدّي فيها الحكومة اليمين.",
     ru:"Председатель Верховного суда: на церемонии приведения правительства к присяге.",
     en:"The President of the Supreme Court, at the ceremony where the government is sworn in."},
    {he:"ראש הממשלה היוצא, עד שיושבע ההרכב החדש בכנסת.",
     ar:"رئيس الحكومة المنتهية ولايته، حتى يؤدّي التشكيل الجديد اليمين في الكنيست.",
     ru:"Уходящий премьер-министр: пока новый состав не принесёт присягу в Кнессете.",
     en:"The outgoing prime minister, until the new cabinet is sworn in before the Knesset."}],
   1,
   {he:"תפקיד אחד במדינה הוא ייצוגי ברובו, ובכל זאת יש לו כאן החלטה ממשית.",
    ar:"منصب واحد في الدولة تمثيليّ في أغلبه، ومع ذلك له هنا قرار فعليّ.",
    ru:"Одна должность в государстве почти целиком представительская, и всё же здесь у неё есть реальное решение.",
    en:"One office in the state is mostly ceremonial, and yet here it makes a real decision."},
   {he:"הנשיא מטיל את התפקיד על חבר הכנסת שלדעתו סיכוייו הטובים ביותר להרכיב ממשלה — לא בהכרח ראש הסיעה הגדולה. לאחר מכן הממשלה חייבת לקבל את אמון הכנסת ברוב של 61 לפחות.",
    ar:"يكلّف الرئيس عضو الكنيست الذي يرى حظوظه الأفضل في تشكيل حكومة، لا بالضرورة رئيس أكبر كتلة. ثم على الحكومة نيل ثقة الكنيست بأغلبية ٦١ على الأقلّ.",
    ru:"Президент поручает это депутату, у которого, по его мнению, наилучшие шансы сформировать правительство, не обязательно лидеру крупнейшей фракции. Затем правительство должно получить доверие Кнессета не менее чем 61 голосом.",
    en:"The president assigns the task to the member he judges most likely to form a government. Not necessarily the head of the largest faction. The government must then win the Knesset's confidence with at least 61 votes."},
   null),
  Q("exec-minres",
    {he:"מהי אחריות מיניסטריאלית?",
     ar:"ما هي المسؤولية الوزارية؟",
     ru:"Что такое министерская ответственность?",
     en:"What is ministerial responsibility?"},
   [{he:"חובת השר לפצות מכיסו על נזק שנגרם במשרדו, אם נמצא שהתרשל בפיקוח על עובדיו או לא בדק את עבודתם.",
     ar:"واجب الوزير أن يعوّض من جيبه عن ضرر وقع في وزارته، إذا تبيّن أنّه قصّر في الرقابة على موظّفيه أو لم يفحص عملهم.",
     ru:"Обязанность министра из своего кармана возместить ущерб в его министерстве, если выяснится, что он не следил за подчинёнными или не проверял их работу.",
     en:"The minister's duty to pay out of pocket for damage in his ministry, if he is found to have neglected supervision of his staff or failed to check their work."},
    {he:"חובת השר לחתום אישית על כל מסמך היוצא ממשרדו, כדי שיידע מה נעשה בו ויוכל לעצור טעויות מראש.",
     ar:"واجب الوزير أن يوقّع شخصيًّا على كلّ مستند يصدر عن وزارته، كي يعرف ما يجري فيها ويستطيع منع الأخطاء مسبقًا.",
     ru:"Обязанность министра лично подписывать каждый документ, выходящий из министерства, чтобы знать, что там делается, и заранее останавливать ошибки.",
     en:"The minister's duty to sign personally every document leaving his ministry, so that he knows what is done there and can stop mistakes in advance."},
    {he:"אחריות השר כלפי הכנסת והציבור לכל הנעשה במשרדו, גם למעשה של פקיד שלא ידע עליו.",
     ar:"مسؤولية الوزير أمام الكنيست والجمهور عن كلّ ما يجري في وزارته، حتى فعل موظّف لم يعلم به.",
     ru:"Ответственность министра перед Кнессетом и обществом за всё происходящее в его ведомстве, даже за действие чиновника, о котором он не знал.",
     en:"The minister's answerability to the Knesset and the public for everything done in his ministry, including an official's act he never knew of."},
    {he:"אחריות השר להצביע עם הקואליציה בכל הצבעה.",
     ar:"مسؤولية الوزير بالتصويت مع الائتلاف في كلّ اقتراع.",
     ru:"Обязанность министра голосовать с коалицией при любом голосовании.",
     en:"The minister's duty to vote with the coalition in every division."}],
   2,
   {he:"בפני מי השר נותן דין וחשבון, ועל מה בדיוק?",
    ar:"أمام مَن يقدّم الوزير حسابه، وعلى ماذا بالضبط؟",
    ru:"Перед кем министр отчитывается и за что именно?",
    en:"To whom does a minister answer, and for what exactly?"},
   {he:"האחריות המיניסטריאלית היא הצד השני של הפיקוח הפרלמנטרי: מפני שהשר אחראי, יש למי לפנות. היא כוללת אחריות ציבורית — התפטרות במקרים חמורים — ולא רק אחריות משפטית.",
    ar:"المسؤولية الوزارية هي الوجه الآخر للرقابة البرلمانية: لأن الوزير مسؤول، ثمّة مَن يُسأل. وتشمل مسؤولية عامّة، الاستقالة في الحالات الجسيمة، لا مسؤولية قانونية فحسب.",
    ru:"Министерская ответственность: обратная сторона парламентского контроля: раз министр отвечает, есть с кого спросить. Она включает и публичную ответственность: отставку в тяжёлых случаях, а не только юридическую.",
    en:"Ministerial responsibility is the other side of parliamentary oversight: because the minister is answerable, there is someone to turn to. It includes public responsibility: resignation in grave cases. Not only legal liability."},
   null),
  Q("exec-indep",
    {he:"מה מבטיח את עצמאות השופטים בישראל?",
     ar:"ما الذي يضمن استقلال القضاة في إسرائيل؟",
     ru:"Что обеспечивает независимость судей в Израиле?",
     en:"What secures judicial independence in Israel?"},
   [{he:"השופטים נבחרים בבחירות כלליות אחת לארבע שנים, יחד עם הבחירות לכנסת, ובכך הם נהנים מאמון הציבור.",
     ar:"يُنتخَب القضاة في انتخابات عامّة مرّة كلّ أربع سنوات، مع انتخابات الكنيست، فينالون بذلك ثقة الجمهور.",
     ru:"Судей избирают на всеобщих выборах раз в четыре года вместе с выборами в Кнессет, и так они получают доверие общества.",
     en:"Judges are chosen in a general election every four years, together with the Knesset election, and so enjoy the public's trust."},
    {he:"מינוי בידי ועדה לבחירת שופטים, כהונה עד גיל פרישה, ואיסור על התערבות בשיקול הדעת השיפוטי.",
     ar:"تعيين بلجنة اختيار القضاة، وولاية حتى سنّ التقاعد، ومنع التدخّل في التقدير القضائيّ.",
     ru:"Назначение комиссией по отбору судей, служба до пенсионного возраста и запрет вмешиваться в судейское усмотрение.",
     en:"Appointment by a judicial selection committee, tenure until retirement age, and a ban on interfering with judicial discretion."},
    {he:"מינוי בידי שר המשפטים לבדו, לתקופה של ארבע שנים שאפשר להאריכה, ובכפוף לאישור ועדת החוקה של הכנסת.",
     ar:"تعيين من وزير القضاء وحده، لمدّة أربع سنوات قابلة للتمديد، ورهنًا بمصادقة لجنة الدستور في الكنيست.",
     ru:"Назначение одним министром юстиции на четыре года с возможностью продления и с утверждением комиссии Кнессета по конституции.",
     en:"Appointment by the justice minister alone for a renewable four-year term, subject to approval by the Knesset constitution committee."},
    {he:"בחירה בידי לשכת עורכי הדין, מתוך רשימת מועמדים שהיא מגישה מדי שנה לוועדת החוקה.",
     ar:"اختيار من قِبَل نقابة المحامين، من قائمة مرشّحين تقدّمها سنويًّا إلى لجنة الدستور.",
     ru:"Избрание коллегией адвокатов из списка кандидатов, который она ежегодно подаёт в комиссию по конституции.",
     en:"Selection by the bar association, from a list of candidates it submits each year to the constitution committee."}],
   1,
   {he:"שופט שיודע שיפוטר אחרי פסק דין לא נוח — האם הוא עצמאי?",
    ar:"قاضٍ يعلم أنه سيُقال بعد حكم غير مريح، أمستقلّ هو؟",
    ru:"Судья, знающий, что его уволят после неудобного решения, независим ли он?",
    en:"A judge who knows he will be dismissed after an inconvenient ruling: is he independent?"},
   {he:"הוועדה לבחירת שופטים מונה תשעה חברים: שלושה שופטי עליון, שני שרים, שני חברי כנסת ושני נציגי לשכת עורכי הדין. ההרכב המעורב נועד למנוע שליטה של גורם אחד — פוליטי או מקצועי — במינויים.",
    ar:"لجنة اختيار القضاة تسعة أعضاء: ثلاثة قضاة عليا، وزيران، عضوا كنيست، وممثّلان لنقابة المحامين. والتركيبة المختلطة تمنع سيطرة جهة واحدة، سياسية أو مهنية، على التعيينات.",
    ru:"Комиссия по отбору судей состоит из девяти членов: три судьи Верховного суда, два министра, два депутата и два представителя коллегии адвокатов. Смешанный состав не даёт одной стороне: политической или профессиональной: контролировать назначения.",
    en:"The judicial selection committee has nine members: three Supreme Court justices, two ministers, two Knesset members and two bar representatives. The mixed composition is meant to stop any single side: political or professional: from controlling appointments."},
   null),
  Q("ex-1-01",{"he": "מהי האחריות המשותפת (הקולקטיבית) של הממשלה?", "ar": "ما هي المسؤولية المشتركة (الجماعية) للحكومة؟", "ru": "Что такое совместная (коллективная) ответственность правительства?", "en": "What is the joint (collective) responsibility of the government?"},[{"he": "כל השרים אחראים יחד להחלטות הממשלה, גם שר שהתנגד להן.", "ar": "كلّ الوزراء مسؤولون معًا عن قرارات الحكومة، حتى الوزير الذي عارضها.", "ru": "Все министры вместе отвечают за решения правительства, даже министр, который был против.", "en": "All ministers are responsible together for government decisions, even a minister who opposed them."}, {"he": "כל שר אחראי רק להחלטות שהוא עצמו הצביע בעדן.", "ar": "كلّ وزير مسؤول فقط عن القرارات التي صوّت لها بنفسه.", "ru": "Каждый министр отвечает только за решения, за которые сам голосовал.", "en": "Each minister is responsible only for decisions he himself voted for."}, {"he": "השרים משלמים יחד מכיסם את הוצאות הממשלה.", "ar": "يدفع الوزراء معًا من جيوبهم نفقات الحكومة.", "ru": "Министры вместе платят из своего кармана расходы правительства.", "en": "The ministers pay the government's expenses together out of their own pockets."}, {"he": "רק ראש הממשלה אחראי לכל החלטה, והשרים פטורים מאחריות כלפי הכנסת ומחובה לתת לה דין וחשבון.", "ar": "رئيس الحكومة وحده مسؤول عن كلّ قرار، والوزراء معفَون من المسؤولية أمام الكنيست ومن واجب تقديم الحساب لها.", "ru": "Только глава правительства отвечает за каждое решение, а министры освобождены от ответственности перед Кнессетом и от отчёта ему.", "en": "Only the prime minister is responsible for every decision, and ministers are exempt from responsibility to the Knesset and from reporting to it."}],0,{"he": "המילה ״משותפת״ רומזת על מי שנושא בה.", "ar": "كلمة مشتركة تشير إلى من يتحمّلها.", "ru": "Слово совместная подсказывает, кто её несёт.", "en": "The word joint hints at who carries it."},{"he": "הממשלה אחראית בפני הכנסת כגוף אחד. החלטה שהתקבלה מחייבת את כל השרים. שר שאינו יכול לעמוד מאחוריה צריך לשקול להתפטר.", "ar": "الحكومة مسؤولة أمام الكنيست كهيئة واحدة. القرار الذي اتُّخذ يُلزم كلّ الوزراء. الوزير الذي لا يستطيع دعمه عليه أن يفكّر في الاستقالة.", "ru": "Правительство отвечает перед Кнессетом как единый орган. Принятое решение обязывает всех министров. Министр, который не может его поддержать, должен подумать об отставке.", "en": "The government answers to the Knesset as one body. A decision that was made binds all ministers. A minister who cannot stand behind it should consider resigning."},null),
  Q("ex-1-02",{"he": "מי בוחר את מבקר המדינה?", "ar": "مَن ينتخب مراقب الدولة؟", "ru": "Кто избирает государственного контролёра?", "en": "Who elects the State Comptroller?"},[{"he": "ראש הממשלה.", "ar": "رئيس الحكومة.", "ru": "Глава правительства.", "en": "The prime minister."}, {"he": "הכנסת, בהצבעה חשאית.", "ar": "الكنيست، بتصويت سرّيّ.", "ru": "Кнессет, тайным голосованием.", "en": "The Knesset, by secret ballot."}, {"he": "הציבור, בבחירות כלליות שנערכות יחד עם הבחירות לכנסת.", "ar": "الجمهور، في انتخابات عامّة تُجرى مع انتخابات الكنيست.", "ru": "Граждане, на всеобщих выборах вместе с выборами в Кнессет.", "en": "The public, in general elections held together with the Knesset elections."}, {"he": "נשיא בית המשפט העליון, אחרי התייעצות עם שר המשפטים.", "ar": "رئيس المحكمة العليا، بعد التشاور مع وزير العدل.", "ru": "Председатель Верховного суда, после консультации с министром юстиции.", "en": "The President of the Supreme Court, after consulting the Minister of Justice."}],1,{"he": "המבקר בודק את הממשלה. מי יכול לבחור בו בלי ניגוד עניינים?", "ar": "المراقب يفحص الحكومة. مَن يستطيع انتخابه دون تضارب مصالح؟", "ru": "Контролёр проверяет правительство. Кто может выбрать его без конфликта интересов?", "en": "The Comptroller checks the government. Who can choose him without a conflict of interest?"},{"he": "מבקר המדינה נבחר בידי הכנסת, בהצבעה חשאית. הוא אחראי בפני הכנסת בלבד ואינו תלוי בממשלה. כך הוא יכול לבקר אותה בחופשיות.", "ar": "يُنتخَب مراقب الدولة من قِبل الكنيست بتصويت سرّيّ. هو مسؤول أمام الكنيست فقط ولا يتبع الحكومة. هكذا يستطيع مراقبتها بحرّيّة.", "ru": "Государственного контролёра избирает Кнессет тайным голосованием. Он отвечает только перед Кнессетом и не зависит от правительства. Так он может свободно его проверять.", "en": "The State Comptroller is elected by the Knesset by secret ballot. He answers only to the Knesset and does not depend on the government. So he can check it freely."},null),
  Q("ex-1-03",{"he": "מה עושה בית המשפט העליון כשהוא יושב כבית משפט גבוה לצדק (בג״ץ)?", "ar": "ماذا تفعل المحكمة العليا حين تنعقد كمحكمة عدل عليا؟", "ru": "Что делает Верховный суд, когда заседает как Высокий суд справедливости (БАГАЦ)?", "en": "What does the Supreme Court do when it sits as the High Court of Justice?"},[{"he": "דן רק בערעורים על פסקי דין של בתי משפט השלום, ובשום עניין אחר.", "ar": "تنظر فقط في الاستئنافات على أحكام محاكم الصلح، ولا شيء غير ذلك.", "ru": "Рассматривает только апелляции на решения мировых судов и больше ничего.", "en": "It hears only appeals against rulings of the magistrates' courts, and nothing else."}, {"he": "שופט חברי כנסת שהפרו את תקנון הכנסת.", "ar": "تحاكم أعضاء الكنيست الذين خالفوا نظام الكنيست.", "ru": "Судит депутатов, нарушивших регламент Кнессета.", "en": "It tries Knesset members who broke the Knesset's rules."}, {"he": "דן בעתירות נגד רשויות המדינה.", "ar": "تنظر في الالتماسات ضدّ سلطات الدولة.", "ru": "Рассматривает петиции против государственных органов.", "en": "It hears petitions against state authorities."}, {"he": "מחוקק חוקים כשהכנסת לא מצליחה להעביר אותם.", "ar": "تسنّ القوانين حين لا تنجح الكنيست في إقرارها.", "ru": "Принимает законы, когда Кнессету не удаётся их принять.", "en": "It makes laws when the Knesset fails to pass them."}],2,{"he": "אזרח שנפגע מהחלטה של משרד ממשלתי — לאן הוא פונה?", "ar": "مواطن تضرّر من قرار وزارة: إلى أين يتوجّه؟", "ru": "Гражданин пострадал от решения министерства. Куда он обращается?", "en": "A citizen is harmed by a ministry's decision. Where does he turn?"},{"he": "בבג״ץ אזרחים עותרים נגד הממשלה, משרדיה ורשויות אחרות. בית המשפט בודק אם הרשות פעלה לפי החוק. הוא אינו מחוקק ואינו שופט חברי כנסת על התנהגותם בכנסת.", "ar": "في محكمة العدل العليا يقدّم المواطنون التماسات ضدّ الحكومة ووزاراتها وسلطات أخرى. تفحص المحكمة هل عملت السلطة وفق القانون. هي لا تشرّع ولا تحاكم أعضاء الكنيست على سلوكهم فيها.", "ru": "В БАГАЦ граждане подают петиции против правительства, министерств и других органов. Суд проверяет, действовал ли орган по закону. Он не принимает законы и не судит депутатов за поведение в Кнессете.", "en": "At the High Court citizens petition against the government, its ministries and other authorities. The court checks whether the authority acted lawfully. It does not make laws or try members for their conduct in the Knesset."},null),
  Q("ex-1-04",{"he": "מהו סדר בתי המשפט הרגילים בישראל, מהנמוך לגבוה?", "ar": "ما هو ترتيب المحاكم العاديّة في إسرائيل، من الأدنى إلى الأعلى؟", "ru": "Каков порядок обычных судов в Израиле, от низшего к высшему?", "en": "What is the order of the regular courts in Israel, from lowest to highest?"},[{"he": "מחוזי, שלום, עליון.", "ar": "مركزية، صلح، عليا.", "ru": "Окружной, мировой, Верховный.", "en": "District, magistrates', Supreme."}, {"he": "עליון, מחוזי, שלום.", "ar": "عليا، مركزية، صلح.", "ru": "Верховный, окружной, мировой.", "en": "Supreme, district, magistrates'."}, {"he": "שלום, מחוזי, עליון, ומעליהם בית משפט חוקתי נפרד.", "ar": "صلح، مركزية، عليا، وفوقها محكمة دستورية منفصلة.", "ru": "Мировой, окружной, Верховный, а над ними отдельный конституционный суд.", "en": "Magistrates', district, Supreme, and above them a separate constitutional court."}, {"he": "שלום, מחוזי, עליון.", "ar": "صلح، مركزية، عليا.", "ru": "Мировой, окружной, Верховный.", "en": "Magistrates', district, Supreme."}],3,{"he": "התחילו מבית המשפט שדן בתיקים הקטנים ביותר.", "ar": "ابدؤوا من المحكمة التي تنظر في أصغر القضايا.", "ru": "Начните с суда, который рассматривает самые мелкие дела.", "en": "Start from the court that hears the smallest cases."},{"he": "בית משפט השלום דן ברוב התיקים הקטנים. מעליו בית המשפט המחוזי, ובראש עומד בית המשפט העליון. בישראל אין בית משפט חוקתי נפרד.", "ar": "تنظر محكمة الصلح في معظم القضايا الصغيرة. فوقها المحكمة المركزية، وفي القمّة المحكمة العليا. لا توجد في إسرائيل محكمة دستورية منفصلة.", "ru": "Мировой суд рассматривает большинство мелких дел. Над ним окружной суд, а на вершине Верховный суд. Отдельного конституционного суда в Израиле нет.", "en": "The magistrates' court hears most small cases. Above it is the district court, and at the top is the Supreme Court. Israel has no separate constitutional court."},null)

 [ /* רמה 2 — הבנה */
  Q("exec-case1",
    {he:"התגלה כי במשרד ממשלתי חולקו כספים ללא מכרז. השר טוען שלא ידע דבר. מה מתחייב מעקרון האחריות המיניסטריאלית?",
     ar:"تبيّن أن أموالًا وُزّعت في وزارة بلا مناقصة. يقول الوزير إنه لم يعلم شيئًا. ماذا يقتضي مبدأ المسؤولية الوزارية؟",
     ru:"Выяснилось, что в министерстве раздали средства без тендера. Министр говорит, что ничего не знал. Что следует из принципа министерской ответственности?",
     en:"It emerged that a ministry distributed funds without a tender. The minister says he knew nothing. What does ministerial responsibility require?"},
   [{he:"אי־הידיעה פוטרת את השר — אחריות מוטלת רק על מי שידע או היה עליו לדעת, והפקיד שחילק את הכספים הוא שיישא בה, לרבות בהליך משמעתי.",
     ar:"عدم العلم يعفي الوزير، المسؤولية تقع فقط على مَن علم أو كان عليه أن يعلم، والموظّف الذي وزّع الأموال هو مَن يتحمّلها، بما في ذلك في إجراء تأديبيّ.",
     ru:"Незнание освобождает министра: ответственность несёт лишь тот, кто знал или должен был знать, и нести её будет чиновник, распределивший средства, в том числе в дисциплинарном порядке.",
     en:"Not knowing clears the minister: responsibility falls only on whoever knew or should have known, and the official who handed out the money bears it, including in disciplinary proceedings."},
    {he:"השר אחראי כלפי הכנסת והציבור גם בלא ידיעה, ועליו לתקן, לתת דין וחשבון, ובמקרים חמורים להתפטר — נוסף לאחריות האישית של הפקיד.",
     ar:"الوزير مسؤول أمام الكنيست والجمهور حتى بلا علم، وعليه التصحيح وتقديم الحساب، وفي الحالات الجسيمة الاستقالة، إلى جانب المسؤولية الشخصية للموظّف.",
     ru:"Министр отвечает перед Кнессетом и обществом даже не зная, обязан исправить, отчитаться, а в тяжёлых случаях уйти в отставку: наряду с личной ответственностью чиновника.",
     en:"The minister answers to the Knesset and the public even without knowing; he must put it right, account for it, and in grave cases resign: alongside the official's personal liability."},
    {he:"על השר לפצות מכיסו את מי שלא זכה במכרז, שכן האחריות המיניסטריאלית היא אחריות אישית־כספית לכל נזק שנגרם במשרדו, ואינה מסתיימת בדיווח לכנסת.",
     ar:"على الوزير أن يعوّض من جيبه مَن لم يفز بالمناقصة، إذ إنّ المسؤولية الوزارية مسؤولية شخصية ماليّة عن كلّ ضرر وقع في وزارته، ولا تنتهي بتقرير للكنيست.",
     ru:"Министр должен из своего кармана возместить проигравшим тендер, ведь министерская ответственность: личная денежная ответственность за любой ущерб в ведомстве и не исчерпывается отчётом Кнессету.",
     en:"The minister must compensate from his own pocket those who lost the tender, since ministerial responsibility is a personal financial liability for any damage in his ministry and does not end with a report to the Knesset."},
    {he:"על מנכ״ל המשרד להתפטר במקום השר.",
     ar:"على مدير عامّ الوزارة أن يستقيل بدل الوزير.",
     ru:"Генеральный директор министерства должен уйти в отставку вместо министра.",
     en:"The ministry's director-general must resign in the minister's place."}],
   1,
   {he:"אם אי־ידיעה הייתה פוטרת, מה היה נשאר מהפיקוח על הממשלה?",
    ar:"لو أعفى عدم العلم، فماذا يبقى من الرقابة على الحكومة؟",
    ru:"Если бы незнание освобождало, что осталось бы от контроля над правительством?",
    en:"If not knowing exempted him, what would be left of oversight of the government?"},
   {he:"האחריות המיניסטריאלית מפרידה בין אחריות אישית (מי עשה) לאחריות ציבורית (מי אמור היה למנוע). היא נועדה בדיוק למקרה הזה: בלעדיה כל כשל היה נעצר בפקיד, והשר לא היה חייב דבר.",
    ar:"تفصل المسؤولية الوزارية بين مسؤولية شخصية (مَن فعل) ومسؤولية عامّة (مَن كان عليه المنع). وهي موضوعة لهذه الحالة تحديدًا: بدونها يتوقّف كلّ إخفاق عند الموظّف ولا يلزم الوزير شيء.",
    ru:"Министерская ответственность разделяет личную (кто сделал) и публичную (кто должен был предотвратить). Она и создана для такого случая: без неё любой провал застревал бы на чиновнике, а министр ничего бы не был должен.",
    en:"Ministerial responsibility separates personal liability (who did it) from public responsibility (who should have prevented it). It exists precisely for this case: without it every failure would stop at the official and the minister would owe nothing."},
   null),
  Q("exec-case2",
    {he:"שר לחץ על שופט לשנות החלטה בתיק תלוי ועומד. מה חומרת המעשה מבחינה חוקתית?",
     ar:"ضغط وزير على قاضٍ لتغيير قرار في ملفّ قائم. ما خطورة الفعل دستوريًّا؟",
     ru:"Министр давил на судью, чтобы тот изменил решение по текущему делу. Насколько это серьёзно конституционно?",
     en:"A minister pressed a judge to change a decision in a pending case. How serious is this constitutionally?"},
   [{he:"אין בעיה — השר הוא נבחר ציבור והשופט אינו, ולכן רשאי השר להביע עמדה בכל תיק שיש בו עניין ציבורי, ובלבד שלא איים על השופט.",
     ar:"لا مشكلة، الوزير منتخَب من الجمهور والقاضي ليس كذلك، ولذلك يحقّ للوزير إبداء موقفه في كلّ ملفّ ذي شأن عامّ، شرط ألّا يهدّد القاضي.",
     ru:"Проблемы нет: министр избран публикой, а судья нет, поэтому министр вправе высказывать позицию по любому делу общественной значимости, лишь бы он не угрожал судье.",
     en:"There is no problem: the minister is elected and the judge is not, so he may state a view on any case of public interest, as long as he did not threaten the judge."},
    {he:"מדובר בפגיעה בעצמאות השיפוטית ובהפרדת הרשויות — הרשות המבצעת מתערבת בהכרעה שיפוטית קונקרטית, וזה אסור גם כשהשר צודק לגופו של עניין.",
     ar:"هذا مساس باستقلال القضاء وبالفصل بين السلطات، السلطة التنفيذية تتدخّل في حكم قضائيّ عينيّ، وهو محظور حتى لو كان الوزير محقًّا في الموضوع.",
     ru:"Это посягательство на независимость суда и разделение властей: исполнительная власть вмешивается в конкретное судебное решение, что запрещено, даже если министр по существу прав.",
     en:"It is an assault on judicial independence and the separation of powers: the executive intervening in a specific judicial decision, which is forbidden even if the minister happens to be right on the merits."},
    {he:"הבעיה היא רק שהשיחה לא תועדה.",
     ar:"المشكلة فقط أن المحادثة لم تُوثَّق.",
     ru:"Проблема лишь в том, что разговор не запротоколирован.",
     en:"The only problem is that the conversation was not recorded."},
    {he:"הבעיה תלויה בשאלה אם השופט הסכים.",
     ar:"المشكلة مرهونة بموافقة القاضي.",
     ru:"Проблема зависит от того, согласился ли судья.",
     en:"The problem depends on whether the judge agreed."}],
   1,
   {he:"מה נשאר משפיטה עצמאית אם ההכרעה תלויה בשיחה עם שר?",
    ar:"ماذا يبقى من قضاء مستقلّ إن كان الحكم مرهونًا بمكالمة مع وزير؟",
    ru:"Что останется от независимого суда, если решение зависит от беседы с министром?",
    en:"What is left of an independent judiciary if a ruling turns on a phone call with a minister?"},
   {he:"הכלל הוא ששר רשאי לבקר פסיקה בפומבי אך לא להתערב בהליך. הביקורת הפומבית היא חלק מהשיח הדמוקרטי; לחץ ישיר על שופט בתיק פתוח הוא הפרה של הכלל שלפיו “בשפיטה אין מרות על שופט זולת מרותו של הדין”.",
    ar:"القاعدة أن للوزير انتقاد الأحكام علنًا لا التدخّل في الإجراء. النقد العلنيّ جزء من النقاش الديمقراطيّ؛ أما الضغط المباشر على قاضٍ في ملفّ مفتوح فخرق لقاعدة أن “لا سلطان على القاضي في القضاء غير سلطان القانون”.",
    ru:"Правило таково: министр может публично критиковать решения, но не вмешиваться в процесс. Публичная критика: часть демократической дискуссии; прямое давление на судью по открытому делу нарушает правило, что «в правосудии над судьёй нет власти, кроме власти закона».",
    en:"The rule is that a minister may criticise rulings publicly but not intervene in a proceeding. Public criticism is part of democratic debate; direct pressure on a judge in an open case breaches the rule that “in judging, a judge is subject to no authority but that of the law”."},
   null),
  Q("exec-case3",
    {he:"ממשלה הפסידה בהצבעת אי אמון קונסטרוקטיבית. מה קורה?",
     ar:"خسرت حكومة تصويت حجب ثقة بنّاء. ماذا يحدث؟",
     ru:"Правительство проиграло конструктивный вотум недоверия. Что происходит?",
     en:"A government lost a constructive no-confidence vote. What happens?"},
   [{he:"הכנסת מתפזרת מיד ונקבעות בחירות.",
     ar:"تُحلّ الكنيست فورًا وتُحدَّد انتخابات.",
     ru:"Кнессет немедленно распускается и назначаются выборы.",
     en:"The Knesset dissolves at once and elections are called."},
    {he:"הממשלה ממשיכה לכהן וההצבעה הצהרתית בלבד, שכן אי אמון מפיל ממשלה רק אם הצביעו בעדו שמונים חברי כנסת, ולכן אין לה תוצאה מעשית.",
     ar:"تواصل الحكومة ولايتها والتصويت إعلانيّ فقط، إذ لا يُسقط حجب الثقة حكومةً إلّا إذا صوّت معه ثمانون عضو كنيست، ولذلك لا نتيجة عملية له.",
     ru:"Правительство продолжает работать, а голосование лишь декларативно, ведь вотум недоверия свергает правительство только при восьмидесяти голосах, и потому практических последствий нет.",
     en:"The government stays in office and the vote is merely declaratory, since no-confidence topples a government only with eighty members in favour, so it has no practical effect."},
    {he:"נשיא המדינה ממנה ממשלת מומחים.",
     ar:"يعيّن رئيس الدولة حكومة خبراء.",
     ru:"Президент назначает правительство экспертов.",
     en:"The president appoints a government of experts."},
    {he:"בהצבעה כזאת רוב של 61 מצביע לא רק נגד הממשלה אלא גם בעד מועמד חלופי, ולכן הוא מתבקש להרכיב ממשלה חדשה בלי בחירות.",
     ar:"في تصويت كهذا تصوّت أغلبية ٦١ لا ضدّ الحكومة فحسب بل لمرشّح بديل، فيُطلب منه تشكيل حكومة جديدة بلا انتخابات.",
     ru:"При таком голосовании большинство в 61 голос выступает не только против правительства, но и за альтернативного кандидата, которому поручают сформировать новое правительство без выборов.",
     en:"In such a vote a majority of 61 votes not only against the government but also for an alternative candidate, who is then asked to form a new government without an election."}],
   3,
   {he:"המילה “קונסטרוקטיבית” — בונה. מה בדיוק היא דורשת שייבנה?",
    ar:"كلمة “بنّاء”، يبني. ماذا تشترط بالضبط أن يُبنى؟",
    ru:"Слово «конструктивный»: созидающий. Что именно он требует создать?",
    en:"The word “constructive” means building. What exactly does it require to be built?"},
   {he:"אי אמון קונסטרוקטיבי נועד למנוע הפלת ממשלה בלי חלופה, מצב שמוביל לבחירות תכופות. הוא מבטא את התפיסה שיציבות היא ערך שלטוני, ובה בעת שומר על יכולת הכנסת להחליף ממשלה.",
    ar:"حجب الثقة البنّاء يمنع إسقاط حكومة بلا بديل، وهو وضع يقود إلى انتخابات متكرّرة. ويعبّر عن أن الاستقرار قيمة حُكمية، مع الحفاظ على قدرة الكنيست على تبديل الحكومة.",
    ru:"Конструктивный вотум недоверия не даёт свалить правительство без альтернативы: состояния, ведущего к частым выборам. Он выражает мысль, что стабильность есть ценность управления, сохраняя при этом способность Кнессета сменить правительство.",
    en:"A constructive no-confidence vote prevents a government being toppled without an alternative, a situation that leads to frequent elections. It expresses the idea that stability is a governing value, while preserving the Knesset's ability to replace a government."},
   null),
