    ru:"Точная формулировка предотвращает две частые ошибки: отрицание напряжения и превращение его в абсолютное противоречие. В судебной практике принято взвешивать: придавать вес обоим элементам и искать наименьший ущерб, а не постановлять, что один всегда важнее.",
    en:"A precise formulation avoids two common errors: denying the tension, and turning it into an absolute contradiction. Case law tends to balance: giving weight to both elements and seeking the narrowest infringement: rather than ruling that one always prevails."},
   null),
  Q("jewdem-anal2",
    {he:"מהי “דמוקרטיה הסדרית” (קונסוציונלית), ואילו מאפיינים שלה קיימים בישראל?",
     ar:"ما هي “الديمقراطية التوافقية”، وأيّ ملامح منها قائمة في إسرائيل؟",
     ru:"Что такое консоциональная (согласительная) демократия и какие её черты есть в Израиле?",
     en:"What is consociational democracy, and which of its features exist in Israel?"},
   [{he:"משטר שבו חברה עמוקת שסעים נשמרת יציבה באמצעות הסדרים בין מנהיגי הקבוצות — אוטונומיה תרבותית, מפתח חלוקה וזכות וטו. בישראל: חינוך נפרד לזרמים, בתי דין דתיים והסדרי סטטוס קוו.",
     ar:"نظام تُحفظ فيه مجتمعات عميقة الانقسام مستقرّة بترتيبات بين قادة المجموعات، استقلال ثقافيّ، ومفتاح توزيع، وحقّ نقض. في إسرائيل: تعليم منفصل للتيّارات، ومحاكم دينية، وترتيبات وضع راهن.",
     ru:"Строй, в котором глубоко расколотое общество удерживается стабильным через соглашения лидеров групп: культурная автономия, ключ распределения и право вето. В Израиле: раздельное образование по течениям, религиозные суды и соглашения статус-кво.",
     en:"A regime in which a deeply divided society is kept stable through arrangements between group leaders: cultural autonomy, a distribution key and a veto. In Israel: separate education streams, religious courts and status quo arrangements."},
    {he:"משטר שבו כל ההחלטות העקרוניות מתקבלות במשאלי עם, כדי לעקוף את המחלוקות בין הקבוצות ולמנוע מהן כוח וטו. בישראל — חוק משאל עם, המחייב אישור ציבורי לוויתור על שטח שחל בו הדין הישראלי.",
     ar:"نظام تُتَّخذ فيه كلّ القرارات المبدئية باستفتاءات شعبية، تفاديًا للخلافات بين المجموعات ومنعًا لامتلاكها حقّ نقض. في إسرائيل، قانون الاستفتاء، الذي يوجب مصادقة الجمهور على التنازل عن أرض يسري فيها القانون الإسرائيليّ.",
     ru:"Режим, где все принципиальные решения принимаются на референдумах, чтобы обойти разногласия между группами и лишить их права вето. В Израиле: закон о референдуме, требующий общественного одобрения при отказе от территории, где действует израильское право.",
     en:"A regime in which every question of principle is decided by referendum, so as to bypass disputes between the groups and deny them a veto. In Israel: the referendum law, which requires public approval before ceding territory under Israeli law."},
    {he:"משטר שבו הצבא מכריע במחלוקות אזרחיות. בישראל: מועצת הביטחון הלאומי.",
     ar:"نظام يحسم فيه الجيش الخلافات المدنية. في إسرائيل: مجلس الأمن القوميّ.",
     ru:"Строй, где армия решает гражданские споры. В Израиле: Совет национальной безопасности.",
     en:"A regime in which the army settles civil disputes. In Israel: the National Security Council."},
    {he:"משטר שבו אין מפלגות אלא נציגי מקצועות. בישראל: ההסתדרות.",
     ar:"نظام بلا أحزاب بل ممثّلو مهن. في إسرائيل: الهستدروت.",
     ru:"Строй без партий, с представителями профессий. В Израиле: Гистадрут.",
     en:"A regime with no parties but representatives of professions. In Israel: the Histadrut."}],
   0,
   {he:"“הסדרית” — הסדר בין מי למי? חשבו על חברה שיש בה קבוצות שאינן מוותרות זו לזו.",
    ar:"“توافقية”، توافق بين مَن ومَن؟ فكّروا في مجتمع فيه مجموعات لا تتنازل لبعضها.",
    ru:"«Согласительная»: согласие между кем? Подумайте об обществе, где группы не уступают друг другу.",
    en:"“Consociational”: an accommodation between whom? Think of a society whose groups do not give way to each other."},
   {he:"המודל ההסדרי מסביר למה חלק מהפתרונות בישראל אינם “או־או” אלא הסדרים: הם נועדו לשמור על יציבות בחברה חצויה. הביקורת עליו: הוא משמר את החלוקה, מעניק כוח למנהיגי הקבוצות, ולעיתים פוגע בפרטים בתוך הקבוצה.",
    ar:"يفسّر النموذج التوافقيّ لماذا بعض الحلول في إسرائيل ليست “إما/أو” بل ترتيبات: غايتها حفظ الاستقرار في مجتمع منقسم. ونقده: يُبقي الانقسام، ويمنح قوّة لقادة المجموعات، وقد يمسّ أفرادًا داخلها.",
    ru:"Консоциональная модель объясняет, почему часть израильских решений: не «или-или», а соглашения: они призваны сохранять стабильность в расколотом обществе. Критика: она консервирует раскол, даёт власть лидерам групп и порой ущемляет отдельных людей внутри группы.",
    en:"The consociational model explains why some Israeli solutions are not either/or but arrangements: they are meant to preserve stability in a divided society. The criticism: it entrenches the division, empowers group leaders, and can harm individuals inside the group."},
   null),
  Q("jewdem-anal3",
    {he:"כיצד בוחנים טענה שלפיה סמל מדינה — דגל, המנון או לוח שנה רשמי — פוגע בשוויון?",
     ar:"كيف يُفحص ادّعاء أن رمزًا للدولة، علمًا أو نشيدًا أو تقويمًا رسميًّا، يمسّ المساواة؟",
     ru:"Как оценивать утверждение, что государственный символ: флаг, гимн или официальный календарь: нарушает равенство?",
     en:"How is a claim examined that a state symbol: flag, anthem or official calendar: harms equality?"},
   [{he:"בוחנים אם רוב האזרחים אוהבים את הסמל.",
     ar:"يُفحص إن كان أغلب المواطنين يحبّون الرمز.",
     ru:"Проверяют, нравится ли символ большинству граждан.",
     en:"By checking whether most citizens like the symbol."},
    {he:"מבחינים בין פגיעה סמלית בשייכות לבין פגיעה בזכות קונקרטית. סמלים משקפים את זהות הרוב ברוב מדינות הלאום; השאלה המשפטית מתחדדת כשהסמל מתורגם לפגיעה מעשית — למשל בימי מנוחה או בגישה לשירות.",
     ar:"يُميَّز بين مساس رمزيّ بالانتماء ومساس بحقّ عينيّ. الرموز تعكس هويّة الأغلبية في أغلب الدول القومية؛ ويحتدّ السؤال القانونيّ حين يُترجَم الرمز إلى مساس عمليّ، كأيام الراحة أو الوصول إلى خدمة.",
     ru:"Различают символический ущерб чувству принадлежности и ущерб конкретному праву. Символы отражают идентичность большинства в большинстве национальных государств; юридический вопрос обостряется, когда символ оборачивается практическим ущербом: например, в днях отдыха или доступе к услуге.",
     en:"By distinguishing symbolic harm to belonging from harm to a concrete right. Symbols reflect the majority's identity in most nation states; the legal question sharpens when the symbol translates into practical harm: days of rest, say, or access to a service."},
    {he:"בוחנים אם הסמל נקבע בחוק יסוד או בחוק רגיל: סמל שעוגן בחוק יסוד חסין מפני טענת אי־שוויון, וסמל שנקבע בחוק רגיל אפשר לתקוף בבית המשפט — וזו כל השאלה, בלי לבחון את תוכנו ואת השפעתו על התושבים.",
     ar:"يُفحص إن كان الرمز قد تقرّر في قانون أساس أو في قانون عاديّ: فالرمز المرسّخ في قانون أساس محصّن أمام ادّعاء عدم المساواة، والمقرّر في قانون عاديّ يمكن الطعن فيه أمام المحكمة، وهذه هي المسألة كلّها، دون فحص مضمونه وأثره على السكّان.",
     ru:"Проверяют, закреплён ли символ в Основном законе или в обычном: закреплённый в Основном законе защищён от претензии о неравенстве, а установленный обычным законом можно оспорить в суде, и в этом весь вопрос, без разбора его содержания и его влияния на жителей.",
     en:"One checks whether the symbol was set in a Basic Law or an ordinary statute: one anchored in a Basic Law is immune to an inequality claim, one set by ordinary statute can be challenged in court, and that is the whole question, without examining its content or its effect on residents."},
    {he:"אין דרך לבחון: סמלים אינם עניין לדיון אזרחי.",
     ar:"لا سبيل للفحص: الرموز ليست موضوع نقاش مدنيّ.",
     ru:"Оценить нельзя: символы не предмет гражданской дискуссии.",
     en:"There is no way to examine it: symbols are not a matter for civic debate."}],
   1,
   {he:"האם כל פגיעה בתחושת שייכות היא גם פגיעה בזכות? ומתי כן?",
    ar:"أكلّ مساس بشعور الانتماء مساس بحقّ؟ ومتى يكون كذلك؟",
    ru:"Всякий ли удар по чувству принадлежности есть нарушение права? И когда всё же да?",
    en:"Is every injury to a sense of belonging also an injury to a right? And when is it?"},
   {he:"ההבחנה הזאת מאפשרת לדון בשאלה בלי לקטב אותה. היא גם מסבירה למה חלק מהמענים בישראל הם הסדרים מעשיים — ימי מנוחה לפי דת, מערכת חינוך בערבית, סמלים מקומיים — ולא שינוי הסמלים הלאומיים.",
    ar:"يتيح هذا التمييز مناقشة المسألة بلا استقطاب. ويفسّر أيضًا لماذا بعض الحلول في إسرائيل ترتيبات عملية، أيام راحة حسب الدين، تعليم بالعربية، رموز محلية، لا تغيير الرموز الوطنية.",
    ru:"Это различение позволяет обсуждать вопрос без поляризации. Оно объясняет и почему часть израильских ответов: практические механизмы (дни отдыха по религии, образование на арабском, местная символика), а не смена национальных символов.",
    en:"This distinction allows the question to be discussed without polarising it. It also explains why some Israeli answers are practical arrangements: days of rest by religion, Arabic-language schooling, local symbols: rather than changing the national symbols."},
   null),
  Q("jd-3-01",{"he": "מגילת העצמאות מכריזה על ״מדינה יהודית״. באותו מסמך היא קוראת לתושבים הערבים ליטול חלק בבניין המדינה ״על יסוד אזרחות מלאה ושווה״. מה אפשר להסיק מכך?", "ar": "تعلن وثيقة الاستقلال عن «دولة يهودية». وفي الوثيقة نفسها تدعو السكّان العرب إلى المشاركة في بناء الدولة «على أساس مواطنة كاملة ومتساوية». ماذا يمكن أن نستنتج؟", "ru": "Декларация независимости провозглашает «еврейское государство». В том же документе она призывает арабских жителей участвовать в строительстве государства «на основе полного и равного гражданства». Какой вывод можно сделать?", "en": "The Declaration of Independence proclaims a “Jewish state”. In the same document it calls on the Arab inhabitants to take part in building the state “on the basis of full and equal citizenship”. What can we conclude?"},[{"he": "שהמנסחים העדיפו בבירור את האופי היהודי על פני השוויון.", "ar": "أنّ الواضعين فضّلوا بوضوح الطابع اليهودي على المساواة.", "ru": "Что авторы явно поставили еврейский характер выше равенства.", "en": "That the drafters clearly preferred the Jewish character over equality."}, {"he": "שהמנסחים ראו בשני הרכיבים חלק מאותו חזון, ולא בחירה ביניהם.", "ar": "أنّ الواضعين رأوا في المكوّنين جزءًا من الرؤية نفسها، لا خيارًا بينهما.", "ru": "Что авторы видели оба элемента частью одного замысла, а не выбором между ними.", "en": "That the drafters saw both elements as part of one vision, not as a choice between them."}, {"he": "שהשוויון נועד לחול רק אחרי שתיכתב חוקה.", "ar": "أنّ المساواة كان يُفترض أن تسري فقط بعد كتابة دستور.", "ru": "Что равенство должно было действовать только после принятия конституции.", "en": "That equality was meant to apply only after a constitution was written."}, {"he": "שהאזרחות המלאה נועדה רק לתושבים היהודים, ושאר התושבים יקבלו מעמד של תושבי קבע בלבד.", "ar": "أنّ المواطنة الكاملة كانت مخصّصة للسكّان اليهود فقط، وأنّ باقي السكّان سيحصلون على مكانة مقيمين دائمين فقط.", "ru": "Что полное гражданство предназначалось только жителям-евреям, а остальные получат лишь статус постоянных жителей.", "en": "That full citizenship was meant only for the Jewish inhabitants, and the others would get only permanent-resident status."}],1,{"he": "קראו שוב את המילים במירכאות. למי הן פונות?", "ar": "اقرؤوا الكلمات بين علامتي الاقتباس مرّة أخرى. إلى مَن تتوجّه؟", "ru": "Перечитайте слова в кавычках. К кому они обращены?", "en": "Reread the words in quotation marks. Who are they addressed to?"},{"he": "המגילה מחברת בין הגדרת המדינה כיהודית לבין הבטחה של אזרחות מלאה ושווה לכל תושביה. מכאן שבעיני המנסחים שני הרכיבים יכולים לחיות יחד. איך לאזן ביניהם בפועל — על כך יש עמדות שונות עד היום.", "ar": "تربط الوثيقة بين تعريف الدولة يهوديةً وبين وعد بمواطنة كاملة ومتساوية لجميع سكّانها. ومن هنا فإنّ الواضعين رأوا أنّ المكوّنين يمكن أن يتعايشا. أمّا كيفية الموازنة بينهما فعليًا، فعليها مواقف مختلفة حتى اليوم.", "ru": "Декларация соединяет определение государства как еврейского с обещанием полного и равного гражданства всем жителям. Значит, по мнению авторов, оба элемента могут существовать вместе. Как их уравновесить на практике — об этом до сих пор есть разные позиции.", "en": "The Declaration links defining the state as Jewish with a promise of full and equal citizenship to all its inhabitants. So in the drafters' view the two elements can live together. How to balance them in practice is still a matter of different positions."},null),
  Q("jd-3-02",{"he": "במגילת העצמאות נכתב: ״מדינת ישראל תהא פתוחה לעלייה יהודית ולקיבוץ גלויות.״ חוק השבות נחקק ב-1950. מה הקשר הנכון ביניהם?", "ar": "ورد في وثيقة الاستقلال: «ستكون دولة إسرائيل مفتوحة للهجرة اليهودية ولجمع الشتات». وقد سُنّ قانون العودة عام 1950. ما العلاقة الصحيحة بينهما؟", "ru": "В Декларации независимости сказано: «Государство Израиль будет открыто для еврейской репатриации и собирания изгнанников». Закон о возвращении принят в 1950 году. Какова верная связь между ними?", "en": "The Declaration of Independence says: “The State of Israel will be open to Jewish immigration and the ingathering of the exiles.” The Law of Return was passed in 1950. What is the correct link between them?"},[{"he": "החוק מעגן בחוק מחייב עיקרון שהופיע כבר במגילה.", "ar": "القانون يرسّخ في تشريع ملزم مبدأً ورد في الوثيقة من قبل.", "ru": "Закон закрепляет в обязательной форме принцип, который уже был в Декларации.", "en": "The law turns a principle already in the Declaration into binding law."}, {"he": "חוק השבות נחקק לפני המגילה, והמגילה רק ציטטה אותו.", "ar": "سُنّ قانون العودة قبل الوثيقة، والوثيقة اقتبسته فقط.", "ru": "Закон о возвращении принят раньше Декларации, а она лишь процитировала его.", "en": "The Law of Return was passed before the Declaration, which only quoted it."}, {"he": "המגילה אוסרת על הגירה של מי שאינו יהודי, וחוק השבות רק חוזר על האיסור הזה במילים אחרות.", "ar": "الوثيقة تحظر هجرة غير اليهود، وقانون العودة يكرّر هذا الحظر فقط بكلمات أخرى.", "ru": "Декларация запрещает иммиграцию неевреев, а Закон о возвращении лишь повторяет этот запрет другими словами.", "en": "The Declaration bans immigration by non-Jews, and the Law of Return merely repeats that ban in other words."}, {"he": "חוק השבות ביטל את סעיף העלייה שבמגילה.", "ar": "ألغى قانون العودة بند الهجرة الوارد في الوثيقة.", "ru": "Закон о возвращении отменил пункт о репатриации в Декларации.", "en": "The Law of Return cancelled the immigration clause in the Declaration."}],0,{"he": "שימו לב לסדר השנים, ולמה שכל מסמך עושה.", "ar": "انتبهوا إلى ترتيب السنوات، وإلى ما تفعله كلّ وثيقة.", "ru": "Обратите внимание на порядок лет и на то, что делает каждый документ.", "en": "Notice the order of the years, and what each document does."},{"he": "המגילה נכתבה ב-1948 והציגה עיקרון: המדינה פתוחה לעלייה יהודית. חוק השבות נחקק שנתיים אחר כך והפך את העיקרון לזכות מחייבת. המגילה אינה אוסרת הגירה של אחרים; זה נקבע בחוקים אחרים.", "ar": "كُتبت الوثيقة عام 1948 وطرحت مبدأً: الدولة مفتوحة للهجرة اليهودية. وسُنّ قانون العودة بعد سنتين وحوّل المبدأ إلى حقّ ملزم. الوثيقة لا تحظر هجرة الآخرين، فهذا تحدّده قوانين أخرى.", "ru": "Декларация написана в 1948 году и выдвинула принцип: государство открыто для еврейской репатриации. Закон о возвращении принят через два года и сделал принцип обязательным правом. Декларация не запрещает иммиграцию других: это регулируют другие законы.", "en": "The Declaration was written in 1948 and set out a principle: the state is open to Jewish immigration. The Law of Return came two years later and made the principle a binding right. The Declaration does not ban others from immigrating; other laws deal with that."},null),
  Q("jd-3-03",{"he": "בוויכוח על סמלי המדינה מישהו אומר: ״בדגלים של נורווגיה, שוודיה ובריטניה יש צלב, ויש בהן מיעוטים.״ איזו טענה הוא מבסס כך?", "ar": "في نقاش حول رموز الدولة يقول أحدهم: «في أعلام النرويج والسويد وبريطانيا صليب، وفيها أقليات». أيّ ادّعاء يدعمه بذلك؟", "ru": "В споре о государственных символах кто-то говорит: «На флагах Норвегии, Швеции и Британии есть крест, и там живут меньшинства». Какой довод он так обосновывает?", "en": "In a debate on state symbols someone says: “The flags of Norway, Sweden and Britain have a cross, and they have minorities.” Which claim is he supporting?"},[{"he": "שבמדינות האלה אין מיעוטים דתיים כלל.", "ar": "أنّه لا توجد في هذه الدول أقليات دينية أصلًا.", "ru": "Что в этих странах вообще нет религиозных меньшинств.", "en": "That these countries have no religious minorities at all."}, {"he": "שעל ישראל להחליף את הדגל שלה.", "ar": "أنّ على إسرائيل أن تغيّر علمها.", "ru": "Что Израиль должен сменить свой флаг.", "en": "That Israel should change its flag."}, {"he": "שהצלב הוא סמל בלי שום משמעות דתית, ולכן הוא לא נוגע למיעוטים באף מדינה.", "ar": "أنّ الصليب رمز بلا أيّ معنى ديني على الإطلاق، ولذلك لا يمسّ الأقليات في أيّ دولة من الدول.", "ru": "Что крест — символ без всякого религиозного смысла, поэтому он не касается меньшинств ни в одной стране.", "en": "That the cross is a symbol with no religious meaning, so it does not concern minorities in any country of the world."}, {"he": "שבדמוקרטיות רבות הסמלים משקפים את זהות הרוב, גם כשיש בהן מיעוטים.", "ar": "أنّ الرموز في ديمقراطيات كثيرة تعكس هويّة الأغلبية، حتى عندما توجد فيها أقليات.", "ru": "Что во многих демократиях символы отражают идентичность большинства, даже если там есть меньшинства.", "en": "That in many democracies the symbols reflect the majority's identity, even when there are minorities."}],3,{"he": "מה משותף לשלוש המדינות, ומה זה אמור להוכיח על ישראל?", "ar": "ما المشترك بين الدول الثلاث، وماذا يُفترض أن يثبت ذلك عن إسرائيل؟", "ru": "Что общего у трёх стран, и что это должно доказать об Израиле?", "en": "What do the three countries share, and what is that meant to show about Israel?"},{"he": "הדובר משווה את ישראל לדמוקרטיות ותיקות שהסמלים שלהן נושאים סמל דתי של הרוב. מכאן הוא טוען שסמלים יהודיים אינם חריגים. יש מי שמשיבים שבישראל המיעוט גדול יותר והסכסוך הלאומי חריף יותר; זה ויכוח בין עמדות.", "ar": "يقارن المتحدّث إسرائيل بديمقراطيات عريقة تحمل رموزها رمزًا دينيًا للأغلبية. ومن هنا يدّعي أنّ الرموز اليهودية ليست استثناءً. وهناك من يردّ بأنّ الأقلية في إسرائيل أكبر والصراع القومي أشدّ؛ وهذا نقاش بين مواقف.", "ru": "Говорящий сравнивает Израиль со старыми демократиями, чьи символы несут религиозный знак большинства. Отсюда он делает вывод, что еврейские символы не исключение. Другие отвечают, что в Израиле меньшинство больше, а национальный конфликт острее; это спор позиций.", "en": "The speaker compares Israel to established democracies whose symbols carry the majority's religious sign. From this he argues that Jewish symbols are not unusual. Others reply that Israel's minority is larger and the national conflict sharper; this is a debate between positions."},null),
  Q("jd-3-04",{"he": "אורי: ״ישראל צריכה להיות מדינת כל אזרחיה, בלי אופי לאומי.״ נועה: ״ישראל צריכה להיות מדינה יהודית ודמוקרטית.״ איזו קביעה מדויקת?", "ar": "أوري: «يجب أن تكون إسرائيل دولة جميع مواطنيها، دون طابع قومي». نوعا: «يجب أن تكون إسرائيل دولة يهودية وديمقراطية». أيّ قول دقيق؟", "ru": "Ури: «Израиль должен быть государством всех своих граждан, без национального характера». Ноа: «Израиль должен быть еврейским и демократическим государством». Какое утверждение точно?", "en": "Uri: “Israel should be a state of all its citizens, with no national character.” Noa: “Israel should be a Jewish and democratic state.” Which statement is accurate?"},[{"he": "שתי העמדות זהות, והן נבדלות רק בניסוח.", "ar": "الموقفان متطابقان، ويختلفان في الصياغة فقط.", "ru": "Обе позиции одинаковы и различаются лишь формулировкой.", "en": "The two positions are the same and differ only in wording."}, {"he": "עמדתה של נועה סותרת את חוקי היסוד, שאינם מזכירים בכלל את אופי המדינה ואת ערכיה.", "ar": "موقف نوعا يناقض قوانين الأساس، التي لا تذكر أصلًا طابع الدولة وقيمها.", "ru": "Позиция Ноа противоречит Основным законам, которые вообще не упоминают характер и ценности государства.", "en": "Noa's position contradicts the Basic Laws, which do not mention the state's character and values at all."}, {"he": "נועה מתארת את ההגדרה שבחוקי היסוד, ואורי מציע לשנות אותה.", "ar": "نوعا تصف التعريف الوارد في قوانين الأساس، وأوري يقترح تغييره.", "ru": "Ноа описывает определение из Основных законов, а Ури предлагает его изменить.", "en": "Noa describes the definition in the Basic Laws, and Uri proposes changing it."}, {"he": "אורי ונועה מתווכחים על שיטת הבחירות.", "ar": "أوري ونوعا يتجادلان حول طريقة الانتخابات.", "ru": "Ури и Ноа спорят о системе выборов.", "en": "Uri and Noa are arguing about the electoral system."}],2,{"he": "איך מגדיר חוק־יסוד: כבוד האדם וחירותו את ערכי המדינה?", "ar": "كيف يعرّف قانون أساس: كرامة الإنسان وحرّيته قيم الدولة؟", "ru": "Как Основной закон о достоинстве и свободе человека определяет ценности государства?", "en": "How does Basic Law: Human Dignity and Liberty define the state's values?"},{"he": "חוקי היסוד משנת 1992 מגדירים את ערכי ישראל כ״מדינה יהודית ודמוקרטית״. נועה מתארת את ההגדרה הקיימת, ואורי מציע הגדרה אחרת. אלה שתי עמדות של אנשים שונים בוויכוח על אופי המדינה.", "ar": "تعرّف قوانين الأساس من عام 1992 قيم إسرائيل بأنّها «دولة يهودية وديمقراطية». نوعا تصف التعريف القائم، وأوري يقترح تعريفًا آخر. هذان موقفان لأشخاص مختلفين في النقاش حول طابع الدولة.", "ru": "Основные законы 1992 года определяют ценности Израиля как ценности «еврейского и демократического государства». Ноа описывает действующее определение, а Ури предлагает другое. Это две позиции разных людей в споре о характере государства.", "en": "The 1992 Basic Laws define Israel's values as those of a “Jewish and democratic state”. Noa describes the existing definition, and Uri proposes a different one. These are two positions held by different people in the debate on the state's character."},null)
 ]
]);

topic("soc","isr",

     ar:"فجوة اجتماعية اقتصادية بين الأغنياء والفقراء، تُقاس بحسب الدخل وحجم الأملاك لدى كلّ مجموعة، وهي تتقلّص من تلقاء نفسها حين ينمو الاقتصاد.",
     ru:"Социально-экономический разрыв между богатыми и бедными: измеряемый по доходу и имуществу каждой группы, который сам собой сокращается при росте экономики.",
     en:"A socio-economic gap between rich and poor: measured by income and by each group's assets, which closes by itself as the economy grows."},

     ar:"انقسام عميق وثابت للمجتمع إلى مجموعات لها هويّة متمايزة ومؤسّسات وأحيانًا أحزاب خاصّة، ويمتدّ أجيالًا.",

     en:"A deep and stable division of society into groups with a distinct identity, their own institutions and sometimes their own parties: one that lasts across generations."},
