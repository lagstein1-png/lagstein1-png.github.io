  Q("ex-2-01",{"he": "חבר כנסת קיבל מהנשיא את התפקיד להרכיב ממשלה, וגיבש רשימת שרים. מה צריך לקרות כדי שהממשלה תיכנס לתפקיד?", "ar": "تلقّى عضو كنيست من الرئيس مهمّة تشكيل الحكومة، وأعدّ قائمة وزراء. ماذا يجب أن يحدث كي تتولّى الحكومة مهامّها؟", "ru": "Депутат получил от президента поручение сформировать правительство и составил список министров. Что должно произойти, чтобы правительство вступило в должность?", "en": "A Knesset member was given the task of forming a government by the President and drew up a list of ministers. What must happen for the government to take office?"},[{"he": "נשיא המדינה חותם על רשימת השרים, ואין צורך בהצבעה בכנסת.", "ar": "يوقّع رئيس الدولة على قائمة الوزراء، ولا حاجة لتصويت في الكنيست.", "ru": "Президент подписывает список министров, и голосование в Кнессете не нужно.", "en": "The President signs the list of ministers, and no Knesset vote is needed."}, {"he": "בית המשפט העליון מאשר את הרכב הממשלה.", "ar": "تصادق المحكمة العليا على تشكيلة الحكومة.", "ru": "Верховный суд утверждает состав правительства.", "en": "The Supreme Court approves the government's make-up."}, {"he": "הציבור, במשאל עם.", "ar": "الجمهور، في استفتاء.", "ru": "Граждане, на референдуме.", "en": "The public, in a referendum."}, {"he": "הכנסת מצביעה אמון בממשלה.", "ar": "تصوّت الكنيست بالثقة للحكومة.", "ru": "Кнессет выражает правительству доверие.", "en": "The Knesset votes confidence in the government."}],3,{"he": "בשיטה פרלמנטרית הממשלה נשענת על הגוף הנבחר.", "ar": "في النظام البرلماني تستند الحكومة إلى الهيئة المنتخَبة.", "ru": "В парламентской системе правительство опирается на избранный орган.", "en": "In a parliamentary system the government rests on the elected body."},{"he": "הממשלה צריכה את אמון הכנסת כדי לכהן. רק אחרי הצבעת האמון השרים נכנסים לתפקידם. לא הנשיא, לא בית המשפט ולא משאל עם מאשרים אותה.", "ar": "تحتاج الحكومة إلى ثقة الكنيست كي تعمل. فقط بعد التصويت بالثقة يتولّى الوزراء مناصبهم. لا الرئيس ولا المحكمة ولا الاستفتاء يصادقون عليها.", "ru": "Правительству нужно доверие Кнессета, чтобы работать. Только после голосования о доверии министры вступают в должность. Его не утверждают ни президент, ни суд, ни референдум.", "en": "The government needs the Knesset's confidence to serve. Only after the confidence vote do the ministers take office. It is not approved by the President, a court or a referendum."},null),
  Q("ex-2-02",{"he": "אזרח עתר לבג״ץ נגד החלטה של הממשלה. מי מייצג את עמדת המדינה בבית המשפט, ועומד גם בראש התביעה הכללית?", "ar": "قدّم مواطن التماسًا لمحكمة العدل العليا ضدّ قرار حكومي. مَن يمثّل موقف الدولة في المحكمة، ويرأس أيضًا النيابة العامّة؟", "ru": "Гражданин подал петицию в БАГАЦ против решения правительства. Кто представляет позицию государства в суде и также возглавляет прокуратуру?", "en": "A citizen petitioned the High Court against a government decision. Who presents the state's position in court and also heads the public prosecution?"},[{"he": "היועץ המשפטי לממשלה.", "ar": "المستشار القضائي للحكومة.", "ru": "Юридический советник правительства.", "en": "The Attorney General."}, {"he": "שר המשפטים.", "ar": "وزير العدل.", "ru": "Министр юстиции.", "en": "The Minister of Justice."}, {"he": "נשיא בית המשפט העליון, שמכיר היטב את התיק.", "ar": "رئيس المحكمة العليا، الذي يعرف الملفّ جيّدًا.", "ru": "Председатель Верховного суда, который хорошо знает дело.", "en": "The President of the Supreme Court, who knows the case well."}, {"he": "מבקר המדינה, שבודק את חוקיות פעולות הממשלה ומדווח עליהן לכנסת.", "ar": "مراقب الدولة، الذي يفحص قانونيّة أعمال الحكومة ويرفع تقاريره إلى الكنيست.", "ru": "Государственный контролёр, который проверяет законность действий правительства и докладывает Кнессету.", "en": "The State Comptroller, who checks the legality of government actions and reports to the Knesset."}],0,{"he": "זה משפטן, לא פוליטיקאי, והוא מייעץ לממשלה כולה.", "ar": "هو قانونيّ وليس سياسيًّا، ويقدّم المشورة للحكومة كلّها.", "ru": "Это юрист, а не политик, и он консультирует всё правительство.", "en": "This is a lawyer, not a politician, and he advises the whole government."},{"he": "היועץ המשפטי לממשלה מייעץ לממשלה ומייצג אותה בבתי המשפט. הוא גם עומד בראש התביעה הכללית. שופט אינו יכול לייצג צד בתיק, ומבקר המדינה אינו מייצג את הממשלה.", "ar": "المستشار القضائي للحكومة يقدّم لها المشورة ويمثّلها في المحاكم. وهو أيضًا يرأس النيابة العامّة. القاضي لا يمثّل طرفًا في قضية، ومراقب الدولة لا يمثّل الحكومة.", "ru": "Юридический советник консультирует правительство и представляет его в судах. Он также возглавляет прокуратуру. Судья не может представлять сторону в деле, а контролёр не представляет правительство.", "en": "The Attorney General advises the government and represents it in court. He also heads the public prosecution. A judge cannot represent a party in a case, and the Comptroller does not represent the government."},null),
  Q("ex-2-03",{"he": "בדוח נמצא שמשרד ממשלתי בזבז כסף ציבורי. מי מפרסם דוח כזה, ולמי הוא מגיש אותו?", "ar": "وُجد في تقرير أنّ وزارة حكومية بدّدت مالًا عامًّا. مَن ينشر تقريرًا كهذا، ولمن يقدّمه؟", "ru": "В докладе обнаружено, что министерство растратило общественные деньги. Кто публикует такой доклад и кому его подаёт?", "en": "A report found that a ministry wasted public money. Who publishes such a report, and to whom is it submitted?"},[{"he": "היועץ המשפטי לממשלה, והוא מגיש אותו לבית המשפט.", "ar": "المستشار القضائي للحكومة، ويقدّمه إلى المحكمة.", "ru": "Юридический советник правительства, и он подаёт его в суд.", "en": "The Attorney General, who submits it to the court."}, {"he": "מבקר המדינה, והוא מגיש אותו לכנסת.", "ar": "مراقب الدولة، ويقدّمه إلى الكنيست.", "ru": "Государственный контролёр, и он подаёт его в Кнессет.", "en": "The State Comptroller, who submits it to the Knesset."}, {"he": "נשיא המדינה, והוא מגיש אותו לממשלה כדי שתחליט אם לפטר את השר.", "ar": "رئيس الدولة، ويقدّمه إلى الحكومة كي تقرّر هل تُقيل الوزير.", "ru": "Президент, и он подаёт его правительству, чтобы оно решило, увольнять ли министра.", "en": "The President, who submits it to the government so it can decide whether to dismiss the minister."}, {"he": "בית המשפט העליון, והוא מגיש אותו לשר האוצר.", "ar": "المحكمة العليا، وتقدّمه إلى وزير المالية.", "ru": "Верховный суд, и он подаёт его министру финансов.", "en": "The Supreme Court, which submits it to the Minister of Finance."}],1,{"he": "חפשו את הגוף שתפקידו לבדוק אם הכסף הציבורי נוצל כראוי.", "ar": "ابحثوا عن الهيئة التي وظيفتها فحص حسن استعمال المال العامّ.", "ru": "Ищите орган, задача которого проверять, правильно ли расходуются общественные деньги.", "en": "Look for the body whose job is to check whether public money was used properly."},{"he": "מבקר המדינה בודק את פעולות הממשלה וגופים ציבוריים. הוא מפרסם דוחות ומגיש אותם לכנסת. כך הכנסת יכולה לפקח על הממשלה ולדרוש תיקון.", "ar": "يفحص مراقب الدولة أعمال الحكومة والهيئات العامّة. ينشر تقارير ويقدّمها إلى الكنيست. هكذا تستطيع الكنيست مراقبة الحكومة والمطالبة بالتصحيح.", "ru": "Государственный контролёр проверяет работу правительства и общественных органов. Он публикует доклады и подаёт их в Кнессет. Так Кнессет может контролировать правительство и требовать исправлений.", "en": "The State Comptroller checks the actions of the government and public bodies. He publishes reports and submits them to the Knesset. So the Knesset can oversee the government and demand corrections."},null),
  Q("ex-2-04",{"he": "שר התנגד בישיבת הממשלה להחלטה, אבל היא התקבלה ברוב. לפי עקרון האחריות המשותפת, מה מצופה ממנו?", "ar": "عارض وزير قرارًا في جلسة الحكومة، لكنّه اتُّخذ بالأغلبية. بحسب مبدأ المسؤولية المشتركة، ماذا يُتوقَّع منه؟", "ru": "Министр выступил на заседании правительства против решения, но его приняли большинством. Чего от него ждут по принципу совместной ответственности?", "en": "A minister opposed a decision at a cabinet meeting, but it passed by majority. Under joint responsibility, what is expected of him?"},[{"he": "לפעול נגד ההחלטה בגלוי ולהישאר שר, כי היא מחייבת רק את מי שהצביע בעדה.", "ar": "أن يعمل ضدّ القرار علنًا ويبقى وزيرًا، لأنّه يُلزم فقط من صوّت له.", "ru": "Открыто действовать против решения и остаться министром, ведь оно обязывает только тех, кто голосовал за.", "en": "To act openly against the decision and stay in office, since it binds only those who voted for it."}, {"he": "לפנות לבית המשפט כדי שיבטל את ההחלטה.", "ar": "أن يتوجّه إلى المحكمة كي تُلغي القرار.", "ru": "Обратиться в суд, чтобы тот отменил решение.", "en": "To go to court so it will cancel the decision."}, {"he": "לשאת באחריות להחלטה, או להתפטר.", "ar": "أن يتحمّل المسؤولية عن القرار، أو أن يستقيل.", "ru": "Нести ответственность за решение или уйти в отставку.", "en": "To share responsibility for the decision, or resign."}, {"he": "לבקש מנשיא המדינה להטיל וטו על ההחלטה.", "ar": "أن يطلب من رئيس الدولة استعمال الفيتو على القرار.", "ru": "Попросить президента наложить вето на решение.", "en": "To ask the President to veto the decision."}],2,{"he": "הממשלה פועלת כגוף אחד מול הכנסת.", "ar": "تعمل الحكومة كهيئة واحدة أمام الكنيست.", "ru": "Правительство действует перед Кнессетом как единое целое.", "en": "The government acts as one body before the Knesset."},{"he": "החלטה של הממשלה מחייבת את כל השרים. שר שאינו יכול לעמוד מאחוריה יכול להתפטר. לנשיא אין זכות וטו על החלטות הממשלה.", "ar": "قرار الحكومة يُلزم كلّ الوزراء. الوزير الذي لا يستطيع دعمه يمكنه أن يستقيل. ليس للرئيس حقّ الفيتو على قرارات الحكومة.", "ru": "Решение правительства обязывает всех министров. Министр, который не может его поддержать, может уйти в отставку. У президента нет права вето на решения правительства.", "en": "A government decision binds all ministers. A minister who cannot stand behind it may resign. The President has no veto over government decisions."},null)
 ],
 [ /* רמה 3 — ניתוח */
  Q("exec-anal1",
    {he:"מדוע נאמר שבשיטה הפרלמנטרית הישראלית הפרדת הרשויות בין המחוקקת למבצעת חלשה יחסית?",
     ar:"لماذا يُقال إن الفصل بين التشريعية والتنفيذية في النظام البرلمانيّ الإسرائيليّ ضعيف نسبيًّا؟",
     ru:"Почему говорят, что в израильской парламентской системе разделение законодательной и исполнительной власти относительно слабо?",
     en:"Why is the separation between legislature and executive said to be relatively weak in Israel's parliamentary system?"},
   [{he:"מפני שהכנסת מתכנסת רק חצי שנה בשנה.",
     ar:"لأن الكنيست تنعقد نصف سنة فقط.",
     ru:"Потому что Кнессет заседает лишь полгода в году.",
     en:"Because the Knesset sits only half the year."},
    {he:"מפני שהממשלה נשענת על רוב בכנסת, השרים הם על פי רוב חברי כנסת, ומשמעת קואליציונית גורמת לרוב לתמוך בממשלה — כך שהמפקח והמפוקח חופפים בחלקם.",
     ar:"لأن الحكومة تستند إلى أغلبية في الكنيست، والوزراء غالبًا أعضاء كنيست، والانضباط الائتلافيّ يدفع الأغلبية لدعم الحكومة، فيتداخل الرقيب والمراقَب.",
     ru:"Потому что правительство опирается на большинство в Кнессете, министры обычно депутаты, а коалиционная дисциплина заставляет большинство поддерживать правительство: контролирующий и подконтрольный частично совпадают.",
     en:"Because the government rests on a Knesset majority, ministers are usually members of the Knesset, and coalition discipline keeps the majority supporting the government, so overseer and overseen partly overlap."},
    {he:"מפני שבית המשפט העליון ממנה את השרים ומאשר את הרכב הממשלה — ולכן הרשות השופטת שותפה בפועל להרכבתה ואינה יכולה לפקח עליה אחר כך בלי ניגוד עניינים.",
     ar:"لأنّ المحكمة العليا تعيّن الوزراء وتصادق على تشكيلة الحكومة، فتكون السلطة القضائية شريكة فعليًّا في تركيبها ولا تستطيع مراقبتها لاحقًا دون تضارب مصالح.",
     ru:"Потому что Верховный суд назначает министров и утверждает состав правительства, а значит фактически участвует в его формировании и не может потом контролировать его без конфликта интересов.",
     en:"Because the Supreme Court appoints the ministers and approves the cabinet's composition, so the judiciary actually helps form it and cannot later supervise it without a conflict of interest."},
    {he:"מפני שהאופוזיציה אינה מקבלת ראשות ועדות בכנסת.",
     ar:"لأنّ المعارضة لا تحصل على رئاسة لجان في الكنيست.",
     ru:"Потому что оппозиция не получает председательства в комиссиях Кнессета.",
     en:"Because the opposition is not given committee chairs in the Knesset."}],
   1,
   {he:"מי מרכיב את הרוב שאמור לפקח על הממשלה?",
    ar:"مَن يشكّل الأغلبية التي يُفترض أن تراقب الحكومة؟",
    ru:"Кто составляет то большинство, которое должно контролировать правительство?",
    en:"Who makes up the majority that is supposed to supervise the government?"},
   {he:"בשיטה נשיאותית הרשויות נבחרות בנפרד ולכן מופרדות חדות יותר. בשיטה פרלמנטרית ההפרדה חלשה מלכתחילה, ולכן חשיבותם של איזונים חיצוניים — בית משפט עצמאי, מבקר מדינה, יועץ משפטי לממשלה ותקשורת חופשית — גדולה יותר.",
    ar:"في النظام الرئاسيّ تُنتخب السلطات منفصلة فيكون الفصل أحدّ. أما في البرلمانيّ فالفصل ضعيف ابتداءً، ومن هنا تعاظم أهمّية موازين خارجية، محكمة مستقلّة، مراقب دولة، مستشار قضائيّ للحكومة، وإعلام حرّ.",
    ru:"В президентской системе ветви избираются раздельно, поэтому разделены резче. В парламентской разделение изначально слабее, и потому важнее внешние противовесы: независимый суд, государственный контролёр, юридический советник правительства и свободная пресса.",
    en:"In a presidential system the branches are elected separately and so are more sharply divided. In a parliamentary system the separation is weak to begin with, which makes external counterweights more important: an independent court, a state comptroller, an attorney general and a free press."},
   null),
  Q("exec-anal2",
    {he:"מהי הביקורת על “אקטיביזם שיפוטי”, ומהי התשובה לה?",
     ar:"ما نقد “النشاط القضائيّ”، وما الردّ عليه؟",
     ru:"В чём критика «судебного активизма» и каков ответ на неё?",
     en:"What is the criticism of “judicial activism”, and what is the answer to it?"},
   [{he:"הביקורת: השופטים מרחיבים את עילת הסבירות לכל החלטה מנהלית. התשובה: הסבירות היא כלל משפטי ותיק, ולא המצאה חדשה.",
     ar:"النقد: يوسّع القضاة سبب المعقولية ليشمل كلّ قرار إداريّ. الردّ: المعقولية قاعدة قانونية قديمة، وليست اختراعًا جديدًا.",
     ru:"Критика: судьи распространяют основание разумности на любое административное решение. Ответ: разумность: давнее правовое правило, а не новое изобретение.",
     en:"The criticism: judges stretch the reasonableness ground to every administrative decision. The answer: reasonableness is a long-standing legal rule, not a new invention."},
    {he:"הביקורת: בית משפט לא נבחר מכריע בשאלות ערכיות שהמקום להכריע בהן הוא הכנסת. התשובה: הכרעה בזכויות היא תפקידו המובהק, ובלעדיה למיעוט אין הגנה מפני הרוב.",
     ar:"النقد: محكمة غير منتخبة تحسم مسائل قيمية مكانها الكنيست. الردّ: الحسم في الحقوق وظيفتها الأصيلة، وبدونه لا حماية للأقلية من الأغلبية.",
     ru:"Критика: неизбранный суд решает ценностные вопросы, место которым в Кнессете. Ответ: решать о правах: его прямая задача, без неё у меньшинства нет защиты от большинства.",
     en:"The criticism: an unelected court decides value questions that belong in the Knesset. The answer: deciding on rights is its proper role, and without it the minority has no protection from the majority."},
    {he:"הביקורת: פסקי הדין ארוכים ומורכבים מדי, והאזרח הממוצע אינו מבין מה נפסק בעניינו. התשובה: ההנמקה המפורטת היא שמאפשרת לבקר את השופט ולערער על פסיקתו בערכאה גבוהה יותר.",
     ar:"النقد: الأحكام طويلة ومعقّدة أكثر ممّا ينبغي، والمواطن العاديّ لا يفهم ما قُضي في شأنه. الردّ: التعليل المفصّل هو ما يتيح نقد القاضي واستئناف حكمه أمام محكمة أعلى.",
     ru:"Критика: решения слишком длинны и сложны, и средний гражданин не понимает, что постановили по его делу. Ответ: именно подробная мотивировка позволяет критиковать судью и обжаловать решение в вышестоящей инстанции.",
     en:"The criticism: judgments are far too long and complex, and the average citizen cannot tell what was decided in his case. The answer: it is the detailed reasoning that makes it possible to criticise the judge and appeal to a higher court."},
    {he:"הביקורת: יש יותר מדי ערכאות. התשובה: כל ערכאה מטפלת בסוג אחר של תיקים.",
     ar:"النقد: كثرة درجات التقاضي. الردّ: لكلّ درجة نوع ملفّات مختلف.",
     ru:"Критика: слишком много инстанций. Ответ: каждая ведёт свой тип дел.",
     en:"The criticism: there are too many instances. The answer: each handles a different kind of case."}],
   1,
   {he:"מי נבחר ומי לא, ומה עומד מנגד כשהרוב פוגע במיעוט?",
    ar:"مَن مُنتخَب ومَن ليس كذلك، وما الذي يقف بالمقابل حين تمسّ الأغلبية بالأقلية؟",
    ru:"Кто избран, а кто нет, и что стоит на другой чаше, когда большинство ущемляет меньшинство?",
    en:"Who is elected and who is not, and what stands on the other side when the majority harms the minority?"},
   {he:"זהו “הקושי האנטי־רובני”: כל ביקורת שיפוטית על חקיקה היא במידה מסוימת התערבות של גוף לא נבחר. המחלוקת אינה אם ההתערבות קיימת, אלא מה גבולותיה — עילת הסבירות, זכות העמידה ושפיטוּת הן בדיוק שדות המחלוקת האלה.",
    ar:"هذه هي “الصعوبة المضادّة للأغلبية”: كلّ رقابة قضائية على التشريع تدخّلٌ ما من جسم غير منتخَب. والخلاف ليس في وجود التدخّل بل في حدوده، سبب المعقولية، وحقّ الوقوف، وقابلية التقاضي هي بالضبط ميادين هذا الخلاف.",
    ru:"Это «контрмажоритарная трудность»: всякий судебный контроль над законом есть в известной мере вмешательство неизбранного органа. Спорят не о наличии вмешательства, а о его границах: основание разумности, право на обращение и судебная подведомственность и есть поля этого спора.",
    en:"This is the counter-majoritarian difficulty: any judicial review of legislation is to some degree intervention by an unelected body. The dispute is not whether it exists, but where its limits lie: reasonableness as a ground, standing, and justiciability are precisely those battlegrounds."},
   null),
  Q("exec-anal3",
    {he:"מדוע ליועץ המשפטי לממשלה יש מעמד מיוחד, ומה המתח המובנה בתפקידו?",
     ar:"لماذا للمستشار القضائيّ للحكومة مكانة خاصّة، وما التوتّر البنيويّ في منصبه؟",
     ru:"Почему у юридического советника правительства особый статус и в чём встроенное напряжение его должности?",
     en:"Why does the attorney general hold a special standing, and what is the built-in tension in the role?"},
   [{he:"הוא שופט של הממשלה: מעמדו כשל בית משפט פנימי, החלטתו סופית ואין עליה ערעור, ולכן אינו נדרש לייצג את עמדתה בבית המשפט העליון ואינו נושא באחריות לתביעה הכללית.",
     ar:"هو قاضٍ للحكومة: مكانته كمحكمة داخلية، وقراره نهائيّ لا استئناف عليه، ولذلك لا يُطلب منه تمثيل موقفها أمام المحكمة العليا ولا يتحمّل مسؤولية النيابة العامّة.",
     ru:"Он судья правительства: его статус: внутренний суд, решение окончательно и обжалованию не подлежит, поэтому он не обязан представлять его позицию в Верховном суде и не отвечает за государственное обвинение.",
     en:"He is the government's judge: his standing is that of an internal court, his ruling is final and unappealable, so he need not present its position in the Supreme Court and bears no responsibility for the prosecution service."},
    {he:"הוא גם היועץ של הממשלה וגם ראש התביעה הכללית ושומר על שלטון החוק: עליו לסייע לממשלה לממש מדיניות, ובה בעת לומר לה מתי המדיניות אינה חוקית.",
     ar:"هو مستشار الحكومة ورئيس النيابة العامّة وحارس سيادة القانون معًا: عليه مساعدة الحكومة على تنفيذ سياستها، وفي الوقت ذاته إخبارها متى تكون السياسة غير قانونية.",
     ru:"Он одновременно советник правительства, глава прокуратуры и страж верховенства закона: он должен помогать правительству проводить политику и в то же время говорить ему, когда она незаконна.",
     en:"He is at once the government's counsel, head of the public prosecution, and guardian of the rule of law: he must help the government carry out policy while telling it when that policy is unlawful."},
    {he:"הוא נבחר בבחירות כלליות, ולכן הוא נציג הציבור.",
     ar:"يُنتخب في انتخابات عامّة، فهو ممثّل الجمهور.",
     ru:"Его избирают на всеобщих выборах, поэтому он представитель общества.",
     en:"He is chosen in a general election, so he represents the public."},
    {he:"הוא כפוף לשר המשפטים בכל החלטותיו.",
     ar:"يخضع لوزير القضاء في كلّ قراراته.",
     ru:"Он подчинён министру юстиции во всех решениях.",
     en:"He is subordinate to the justice minister in all his decisions."}],
   1,
   {he:"שני כובעים שסותרים לפעמים זה את זה. מה הם?",
    ar:"صفتان تتناقضان أحيانًا. ما هما؟",
    ru:"Две роли, порой противоречащие друг другу. Какие?",
    en:"Two hats that sometimes contradict each other. What are they?"},
   {he:"בישראל חוות דעתו של היועץ מחייבת את הממשלה כל עוד לא נקבע אחרת בבית משפט — הסדר שאינו קיים בכל דמוקרטיה, ושנוי במחלוקת. הטיעון בעדו: בלי גורם מקצועי מחייב, בדיקת חוקיות תלויה ברצון הנבחר עצמו.",
    ar:"في إسرائيل تُلزم فتوى المستشار الحكومةَ ما لم تقرّر محكمة خلاف ذلك، ترتيب غير قائم في كلّ ديمقراطية وموضع خلاف. والحجّة معه: بلا جهة مهنية مُلزِمة يبقى فحص القانونية رهن رغبة المنتخَب نفسه.",
    ru:"В Израиле заключение советника обязательно для правительства, пока суд не решит иначе, порядок, существующий не во всякой демократии и спорный. Довод в его пользу: без обязывающей профессиональной инстанции проверка законности зависит от воли самого избранника.",
    en:"In Israel the attorney general's opinion binds the government unless a court rules otherwise: an arrangement not found in every democracy, and a contested one. The argument for it: without a binding professional check, testing legality depends on the will of the elected official himself."},
   null),
  Q("ex-3-01",{"he": "מדוע שופטים בישראל מכהנים עד גיל פרישה, ולא לתקופה קצובה שאפשר להאריך?", "ar": "لماذا يخدم القضاة في إسرائيل حتى سنّ التقاعد، لا لفترة محدّدة يمكن تمديدها؟", "ru": "Почему судьи в Израиле служат до пенсионного возраста, а не на срок, который можно продлить?", "en": "Why do judges in Israel serve until retirement age, rather than for a term that can be extended?"},[{"he": "כדי לחסוך בהוצאות על מינוי שופטים חדשים.", "ar": "لتوفير نفقات تعيين قضاة جدد.", "ru": "Чтобы сэкономить на назначении новых судей.", "en": "To save the cost of appointing new judges."}, {"he": "כדי שיוכלו להתמודד לכנסת בזמן הכהונה, בלי לוותר על מקומם בבית המשפט.", "ar": "كي يستطيعوا الترشّح للكنيست أثناء الخدمة، دون التخلّي عن مكانهم في المحكمة.", "ru": "Чтобы они могли баллотироваться в Кнессет во время службы, не теряя места в суде.", "en": "So they can run for the Knesset while serving, without giving up their place in court."}, {"he": "כדי שלא ינסו לרצות את מי שמחליט על הארכת כהונתם.", "ar": "كي لا يحاولوا إرضاء من يقرّر تمديد خدمتهم.", "ru": "Чтобы они не пытались угодить тому, кто решает о продлении их срока.", "en": "So they will not try to please whoever decides on extending their term."}, {"he": "כי החוק אוסר על שופטים לשנות את דעתם.", "ar": "لأنّ القانون يمنع القضاة من تغيير رأيهم.", "ru": "Потому что закон запрещает судьям менять своё мнение.", "en": "Because the law forbids judges to change their minds."}],2,{"he": "חשבו על שופט שיודע שבעוד שנה יחליטו אם להשאיר אותו.", "ar": "فكّروا في قاضٍ يعرف أنّه بعد سنة سيُقرَّر هل يبقى.", "ru": "Представьте судью, который знает, что через год решат, оставить ли его.", "en": "Think of a judge who knows that in a year they will decide whether to keep him."},{"he": "שופט שתלוי בהארכה עלול לפסוק כך שימצא חן בעיני מי שמאריך. כהונה עד גיל פרישה משחררת אותו מהלחץ הזה. כך הוא פוסק לפי החוק בלבד, וזו עצמאות שיפוטית.", "ar": "القاضي الذي يتعلّق بالتمديد قد يحكم بما يُرضي من يمدّد له. الخدمة حتى التقاعد تحرّره من هذا الضغط. هكذا يحكم وفق القانون فقط، وهذا هو استقلال القضاء.", "ru": "Судья, зависящий от продления, может судить так, чтобы угодить тому, кто продлевает. Служба до пенсии освобождает его от этого давления. Так он судит только по закону, и в этом независимость суда.", "en": "A judge who depends on an extension may rule to please whoever extends it. Serving until retirement frees him from that pressure. So he rules by the law alone, and that is judicial independence."},null),
  Q("ex-3-02",{"he": "מדוע מבקר המדינה אחראי בפני הכנסת בלבד, ואינו תלוי בממשלה?", "ar": "لماذا مراقب الدولة مسؤول أمام الكنيست فقط، ولا يتبع الحكومة؟", "ru": "Почему государственный контролёр отвечает только перед Кнессетом и не зависит от правительства?", "en": "Why does the State Comptroller answer only to the Knesset and not depend on the government?"},[{"he": "כי הוא בודק את הממשלה, וגוף בודק אינו יכול להיות תלוי בגוף שהוא בודק.", "ar": "لأنّه يفحص الحكومة، والهيئة الفاحصة لا يمكن أن تتبع الهيئة التي تفحصها.", "ru": "Потому что он проверяет правительство, а проверяющий не может зависеть от проверяемого.", "en": "Because he checks the government, and a checking body cannot depend on the body it checks."}, {"he": "כי המבקר הוא חבר כנסת.", "ar": "لأنّ المراقب عضو كنيست.", "ru": "Потому что контролёр является депутатом.", "en": "Because the Comptroller is a Knesset member."}, {"he": "כי הכנסת מחליטה כל שנה אם להשאיר אותו בתפקיד, לפי מספר הליקויים שמצא באותה שנה.", "ar": "لأنّ الكنيست تقرّر كلّ سنة هل تُبقيه في منصبه، بحسب عدد العيوب التي وجدها في تلك السنة.", "ru": "Потому что Кнессет каждый год решает, оставить ли его, по числу недостатков, найденных за год.", "en": "Because the Knesset decides every year whether to keep him, based on how many failures he found that year."}, {"he": "כי לממשלה אסור לקרוא את הדוחות שלו.", "ar": "لأنّه يُمنَع على الحكومة قراءة تقاريره.", "ru": "Потому что правительству запрещено читать его доклады.", "en": "Because the government is not allowed to read his reports."}],0,{"he": "מה היה קורה אם מי שנבדק היה גם הבוס של הבודק?", "ar": "ماذا كان سيحدث لو كان المفحوص هو أيضًا رئيس الفاحص؟", "ru": "Что было бы, если бы проверяемый был начальником проверяющего?", "en": "What would happen if the one being checked were also the checker's boss?"},{"he": "המבקר צריך לחשוף ליקויים בממשלה בלי לחשוש ממנה. לכן הוא נבחר בידי הכנסת ואחראי בפניה בלבד. הוא מכהן תקופה אחת קבועה, ואין הצבעה שנתית על המשך כהונתו.", "ar": "يجب أن يكشف المراقب عيوب الحكومة دون أن يخشاها. لذلك تنتخبه الكنيست وهو مسؤول أمامها فقط. يخدم فترة واحدة ثابتة، ولا يوجد تصويت سنويّ على استمرار خدمته.", "ru": "Контролёр должен вскрывать недостатки правительства, не боясь его. Поэтому его избирает Кнессет, и он отвечает только перед ним. Он служит один установленный срок, и ежегодного голосования о его продлении нет.", "en": "The Comptroller must expose government failures without fearing it. So he is elected by the Knesset and answers only to it. He serves one fixed term, and there is no yearly vote on keeping him."},null),
  Q("ex-3-03",{"he": "הכנסת חוקקה חוק. אזרח עתר לבג״ץ וטען שהחוק פוגע בזכות שמוגנת בחוק יסוד. איזה רעיון דמוקרטי בא כאן לידי ביטוי?", "ar": "سنّت الكنيست قانونًا. قدّم مواطن التماسًا لمحكمة العدل العليا مدّعيًا أنّ القانون يمسّ حقًّا يحميه قانون أساس. أيّ فكرة ديمقراطية تظهر هنا؟", "ru": "Кнессет принял закон. Гражданин подал петицию в БАГАЦ, утверждая, что закон нарушает право, защищённое Основным законом. Какая демократическая идея здесь проявляется?", "en": "The Knesset passed a law. A citizen petitioned the High Court, claiming the law harms a right protected by a Basic Law. Which democratic idea is shown here?"},[{"he": "אחריות מיניסטריאלית: השר שהציע את החוק אחראי לו.", "ar": "المسؤولية الوزارية: الوزير الذي اقترح القانون مسؤول عنه.", "ru": "Министерская ответственность: министр, предложивший закон, отвечает за него.", "en": "Ministerial responsibility: the minister who proposed the law is responsible for it."}, {"he": "מחזוריות: האזרח מבקש להקדים את הבחירות.", "ar": "الدوريّة: يطلب المواطن تقديم الانتخابات.", "ru": "Периодичность: гражданин просит провести выборы раньше.", "en": "Periodicity: the citizen asks to bring the elections forward."}, {"he": "שלטון הרוב: בית המשפט מבטל חוק רק אם רוב הציבור מתנגד לו בסקר דעת קהל.", "ar": "حكم الأغلبية: تُلغي المحكمة القانون فقط إذا عارضته أغلبية الجمهور في استطلاع رأي.", "ru": "Власть большинства: суд отменяет закон, только если большинство граждан против него в опросе.", "en": "Majority rule: the court cancels a law only if most of the public opposes it in an opinion poll."}, {"he": "איזונים ובלמים: רשות אחת מגבילה רשות אחרת, כדי להגן על זכויות.", "ar": "الضوابط والتوازنات: سلطة تقيّد سلطة أخرى لحماية الحقوق.", "ru": "Сдержки и противовесы: одна власть ограничивает другую, чтобы защитить права.", "en": "Checks and balances: one branch limits another to protect rights."}],3,{"he": "כמה רשויות מעורבות כאן, ומה האחת עושה לשנייה?", "ar": "كم سلطة مشاركة هنا، وماذا تفعل إحداها بالأخرى؟", "ru": "Сколько ветвей власти здесь участвует, и что одна делает с другой?", "en": "How many branches are involved here, and what does one do to the other?"},{"he": "הרשות המחוקקת חוקקה, והרשות השופטת בודקת אם החוק עומד בחוקי היסוד. זו ביקורת שיפוטית, חלק מאיזונים ובלמים. כך גם רוב בכנסת מוגבל כשמדובר בזכויות יסוד.", "ar": "السلطة التشريعية سنّت، والسلطة القضائية تفحص هل يتلاءم القانون مع قوانين الأساس. هذه رقابة قضائية، وهي جزء من الضوابط والتوازنات. هكذا حتى أغلبية الكنيست مقيّدة حين يتعلّق الأمر بالحقوق الأساسية.", "ru": "Законодательная власть приняла закон, а судебная проверяет, соответствует ли он Основным законам. Это судебный контроль, часть системы сдержек и противовесов. Так даже большинство в Кнессете ограничено, когда речь идёт об основных правах.", "en": "The legislature passed the law, and the judiciary checks whether it fits the Basic Laws. This is judicial review, part of checks and balances. So even a Knesset majority is limited when basic rights are at stake."},null),
  Q("ex-3-04",{"he": "ממשלה איבדה את הרוב שלה בכנסת, אבל לא הוחלפה בהצבעת אי אמון. מה המצב שלה?", "ar": "فقدت حكومة أغلبيّتها في الكنيست، لكنّها لم تُستبدَل بتصويت حجب ثقة. ما وضعها؟", "ru": "Правительство потеряло большинство в Кнессете, но его не сменили вотумом недоверия. В каком оно положении?", "en": "A government lost its majority in the Knesset, but was not replaced by a no-confidence vote. What is its situation?"},[{"he": "היא מפסיקה לכהן מיד, וראש האופוזיציה הופך לראש הממשלה.", "ar": "تتوقّف عن العمل فورًا، ويصبح رئيس المعارضة رئيسًا للحكومة.", "ru": "Оно сразу прекращает работу, и лидер оппозиции становится главой правительства.", "en": "It stops serving at once, and the opposition leader becomes prime minister."}, {"he": "היא ממשיכה לכהן, אבל מתקשה להעביר חוקים ותקציב.", "ar": "تستمرّ في العمل، لكنّها تجد صعوبة في تمرير القوانين والميزانية.", "ru": "Оно продолжает работать, но ему трудно принимать законы и бюджет.", "en": "It goes on serving, but struggles to pass laws and a budget."}, {"he": "אין לה שום קושי, כי הממשלה אינה זקוקה לכנסת כדי להעביר חוקים ותקציב.", "ar": "لا تواجه أيّ صعوبة، لأنّ الحكومة لا تحتاج إلى الكنيست لتمرير القوانين والميزانية.", "ru": "Никаких трудностей нет, ведь правительству не нужен Кнессет, чтобы принимать законы и бюджет.", "en": "It has no difficulty, because the government does not need the Knesset to pass laws and a budget."}, {"he": "בית המשפט העליון ממנה ממשלה זמנית.", "ar": "تعيّن المحكمة العليا حكومة مؤقّتة.", "ru": "Верховный суд назначает временное правительство.", "en": "The Supreme Court appoints a temporary government."}],1,{"he": "מי מצביע על חוקים ועל התקציב, ומה קורה בלי רוב שם?", "ar": "مَن يصوّت على القوانين والميزانية، وماذا يحدث دون أغلبية هناك؟", "ru": "Кто голосует за законы и бюджет, и что бывает без большинства там?", "en": "Who votes on laws and the budget, and what happens without a majority there?"},{"he": "ממשלה נופלת באי אמון רק כשרוב מצביע בעד ממשלה אחרת. בלי זה היא ממשיכה לכהן. אבל חוקים ותקציב עוברים בכנסת, ובלי רוב קשה לה מאוד לפעול.", "ar": "تسقط الحكومة بحجب الثقة فقط حين تصوّت أغلبية لصالح حكومة أخرى. دون ذلك تستمرّ في العمل. لكنّ القوانين والميزانية تُقَرّ في الكنيست، ودون أغلبية يصعب عليها جدًّا أن تعمل.", "ru": "Правительство падает по вотуму недоверия, только если большинство голосует за другое правительство. Без этого оно продолжает работать. Но законы и бюджет принимает Кнессет, и без большинства ему очень трудно действовать.", "en": "A government falls by no-confidence only when a majority votes for another government. Without that it goes on serving. But laws and the budget pass in the Knesset, and without a majority it is very hard for it to act."},null)
 ]
]);

/* ---------- מסלול 4: מדינת ישראל וחברה ---------- */

topic("jewdem","isr",
  {he:"מדינה יהודית ודמוקרטית",ar:"دولة يهودية وديمقراطية",ru:"Еврейское и демократическое государство",en:"A Jewish and democratic state"},
  {he:"מגילת העצמאות, חוק השבות, והמתח בין שני חלקי ההגדרה",
   ar:"وثيقة الاستقلال، قانون العودة، والتوتّر بين شقّي التعريف",
   ru:"Декларация независимости, Закон о возвращении и напряжение между двумя частями определения",
   en:"The Declaration of Independence, the Law of Return, and the tension inside the definition"},
[
 [ /* רמה 1 — ידע */
  Q("jewdem-decl",
    {he:"מה מעמדה המשפטי של מגילת העצמאות?",
     ar:"ما المكانة القانونية لوثيقة الاستقلال؟",
     ru:"Каков юридический статус Декларации независимости?",
     en:"What is the legal status of the Declaration of Independence?"},
   [{he:"היא חוקה מלאה ומחייבת: כל חוק הסותר אותה בטל, בית המשפט פוסל לפיה חקיקה מאז קום המדינה, והיא מחייבת גם את בתי הדין הדתיים.",
     ar:"هي دستور كامل ومُلزِم: كلّ قانون يناقضها باطل، وتبطل المحكمة بموجبها تشريعات منذ قيام الدولة، وهي مُلزِمة أيضًا للمحاكم الدينية.",
     ru:"Это полноценная обязывающая конституция: любой противоречащий ей закон недействителен, суд отменяет по ней законы со дня основания государства, и она обязывает также религиозные суды.",
     en:"It is a full, binding constitution: any contradicting law is void, the court has struck down legislation under it since the state was founded, and it binds the religious courts as well."},
    {he:"אין לה כל מעמד משפטי, והיא מסמך היסטורי בלבד שאין להסתמך עליו בפרשנות חוקים או בהכרעה בעתירות, גם כשהחוק שותק לחלוטין בעניין.",
     ar:"ليس لها أيّ مكانة قانونية، وهي وثيقة تاريخية فقط لا يجوز الاستناد إليها في تفسير القوانين أو الحسم في الالتماسات، حتى حين يسكت القانون تمامًا في الأمر.",
     ru:"У неё нет никакого правового статуса: это лишь исторический документ, на который нельзя опираться при толковании законов или разрешении петиций, даже когда закон полностью молчит по этому вопросу.",
     en:"It has no legal standing at all: only a historical document that may not be relied on in interpreting laws or deciding petitions, even where the statute is completely silent on the matter."},
    {he:"אינה חוקה ואינה מחייבת כשלעצמה, אך היא מקור פרשני מרכזי: חוקי היסוד מפנים לערכיה, ובתי המשפט נעזרים בה בפירוש חוקים.",
     ar:"ليست دستورًا ولا مُلزمة بذاتها، لكنها مصدر تفسيريّ مركزيّ: قوانين الأساس تحيل إلى قيمها، والمحاكم تستعين بها في تفسير القوانين.",
     ru:"Она не конституция и сама по себе не обязывает, но это ключевой источник толкования: основные законы отсылают к её ценностям, а суды опираются на неё при толковании законов.",
     en:"It is neither a constitution nor binding in itself, but it is a central interpretive source: the basic laws refer to its values and courts draw on it when construing statutes."},
    {he:"היא חוק יסוד לכל דבר ועניין, ולכן פסקת ההגבלה חלה עליה וכל פגיעה בערכיה נבחנת במבחני המידתיות, גם בלי שנקבע כך בכותרתה.",
     ar:"هي قانون أساس بكلّ معنى، ولذلك تسري عليها فقرة التقييد وكلّ مساس بقيمها يُفحص بمعايير التناسب، حتى دون أن يُنصّ على ذلك في عنوانها.",
     ru:"Это Основной закон во всех отношениях, поэтому к ней применима ограничительная оговорка, и всякое ущемление её ценностей проверяется тестами соразмерности, даже если в заголовке это не сказано.",
     en:"It is a Basic Law in every respect, so the limitation clause applies and any infringement of its values is tested for proportionality, even though its title does not say so."}],
   2,
   {he:"אילו הייתה חוקה, לא היה צורך בהחלטת הררי. אבל היא גם אינה סתם נאום.",
    ar:"لو كانت دستورًا لما لزم قرار هراري. لكنها ليست مجرّد خطاب أيضًا.",
    ru:"Будь она конституцией, решение Харари было бы не нужно. Но и просто речью она не является.",
    en:"Were it a constitution, the Harari Decision would have been unnecessary. But it is not a mere speech either."},
   {he:"מגילת העצמאות מכריזה על מדינה יהודית ומבטיחה שוויון זכויות חברתי ומדיני לכל אזרחיה, חופש דת, מצפון, לשון, חינוך ותרבות. חוק־יסוד: כבוד האדם וחירותו קובע שתכליתו לעגן את ערכיה של מדינת ישראל כמדינה יהודית ודמוקרטית — וכך היא נכנסה אל תוך המשפט.",
    ar:"تعلن وثيقة الاستقلال قيام دولة يهودية وتَعِد بمساواة تامّة في الحقوق الاجتماعية والسياسية لكلّ مواطنيها، وبحرّية الدين والضمير واللغة والتعليم والثقافة. وينصّ قانون أساس: كرامة الإنسان وحرّيته على أن غايته ترسيخ قيم دولة إسرائيل كدولة يهودية وديمقراطية، وهكذا دخلت الوثيقة إلى القانون.",
    ru:"Декларация независимости провозглашает еврейское государство и обещает полное равенство общественных и политических прав всем его гражданам, свободу религии, совести, языка, образования и культуры. Основной закон о достоинстве и свободе человека гласит, что его цель: закрепить ценности Государства Израиль как еврейского и демократического; так Декларация вошла в право.",
    en:"The Declaration proclaims a Jewish state and promises complete equality of social and political rights to all its inhabitants, and freedom of religion, conscience, language, education and culture. Basic Law: Human Dignity and Liberty states that its purpose is to anchor the values of the State of Israel as a Jewish and democratic state, and so the Declaration entered the law."},
   null),
  Q("jewdem-return",
    {he:"מה קובע חוק השבות?",
     ar:"ماذا يقرّر قانون العودة؟",
     ru:"Что устанавливает Закон о возвращении?",
     en:"What does the Law of Return provide?"},
   [{he:"שכל אדם בעולם רשאי לקבל אזרחות ישראלית לפי בקשה שיגיש למשרד הפנים ותאושר בוועדה מיוחדת.",
     ar:"أنّ كلّ إنسان في العالم يحقّ له نيل الجنسية الإسرائيلية بطلب يقدّمه إلى وزارة الداخلية وتصادق عليه لجنة خاصّة.",
     ru:"Что любой человек в мире вправе получить израильское гражданство по заявлению в МВД, утверждённому особой комиссией.",
     en:"That anyone in the world may receive Israeli citizenship by a request to the interior ministry that a special committee approves."},
    {he:"שכל יהודי זכאי לעלות לישראל ולקבל אזרחות מכוח שיבה, וכך גם בן זוגו, ילדיו ונכדיו.",
     ar:"أن لكلّ يهوديّ حقّ الهجرة إلى إسرائيل ونيل الجنسية بحكم العودة، وكذلك زوجه وأولاده وأحفاده.",
     ru:"Что каждый еврей вправе репатриироваться в Израиль и получить гражданство по возвращении, как и его супруг, дети и внуки.",
     en:"That every Jew is entitled to immigrate to Israel and receive citizenship by return, as are the spouse, children and grandchildren."},
    {he:"שכל אזרח ישראלי רשאי לשוב לישראל אחרי שהות ממושכת בחו״ל ולחדש את מעמדו.",
     ar:"أنّ كلّ مواطن إسرائيليّ يحقّ له العودة إلى إسرائيل بعد إقامة طويلة في الخارج وتجديد مكانته.",
     ru:"Что любой израильский гражданин вправе вернуться в Израиль после долгого пребывания за границей и восстановить свой статус.",
     en:"That any Israeli citizen may return to Israel after a long stay abroad and renew his status."},
    {he:"שהמדינה מחזירה רכוש שהולאם לבעליו הקודמים או ליורשיהם, לפי בקשה שתוגש למשרד האוצר.",
     ar:"أنّ الدولة تعيد الأملاك المؤمّمة إلى أصحابها السابقين أو إلى ورثتهم، وفق طلب يُقدَّم إلى وزارة المالية.",
     ru:"Что государство возвращает национализированное имущество прежним владельцам или их наследникам по заявлению в министерство финансов.",
     en:"That the state returns nationalised property to its former owners or their heirs, on a request filed with the finance ministry."}],
   1,
   {he:"“שבות” היא שיבה. של מי, ולאן?",
    ar:"“العودة” رجوع. لمن، وإلى أين؟",
    ru:"«Возвращение»: это возврат. Чей и куда?",
    en:"“Return” means coming back. Whose, and to where?"},
   {he:"חוק השבות (1950) הוא הביטוי המובהק ביותר לאופייה היהודי של המדינה: הוא קובע קריטריון הגירה על בסיס לאום. אזרחות אפשר לקבל גם בדרכים אחרות — לידה, התאזרחות ומגורים — לפי חוק האזרחות.",
    ar:"قانون العودة (١٩٥٠) أوضح تعبير عن الطابع اليهوديّ للدولة: يضع معيار هجرة على أساس قوميّ. ويمكن نيل الجنسية بطرق أخرى، الولادة والتجنّس والإقامة، وفق قانون الجنسية.",
    ru:"Закон о возвращении (1950): самое явное выражение еврейского характера государства: он устанавливает иммиграционный критерий по национальной принадлежности. Гражданство можно получить и иначе: по рождению, натурализации и проживанию: согласно Закону о гражданстве.",
    en:"The Law of Return (1950) is the clearest expression of the state's Jewish character: it sets an immigration criterion on a national basis. Citizenship may also be acquired in other ways: birth, naturalisation and residence: under the Citizenship Law."},
   null),
  Q("jewdem-mean",
    {he:"מהן שתי המשמעויות המקובלות של “מדינה יהודית” בשיח האזרחות?",
     ar:"ما المعنيان المتداولان لـ“دولة يهودية” في نقاش المدنيات؟",
     ru:"Каковы два принятых значения выражения «еврейское государство» в гражданствоведении?",
     en:"What are the two accepted meanings of “a Jewish state” in civics?"},
   [{he:"משמעות לאומית — מדינת הלאום של העם היהודי, ומשמעות דתית — מדינה שערכי היהדות וההלכה מעצבים בה את החיים הציבוריים.",
     ar:"معنى قوميّ، دولة قومية للشعب اليهوديّ، ومعنى دينيّ، دولة تصوغ قيم اليهودية والشريعة فيها الحياة العامّة.",
     ru:"Национальное: национальное государство еврейского народа, и религиозное: государство, где ценности иудаизма и Галахи формируют публичную жизнь.",
     en:"A national meaning: the nation state of the Jewish people; and a religious meaning: a state whose public life is shaped by Jewish values and religious law."},
    {he:"משמעות כלכלית — מדינה המקיימת כלכלה עצמאית משלה, ומשמעות ביטחונית — מדינה המשמשת מקלט בטוח ליהודים בכל העולם בעת סכנה.",
     ar:"معنى اقتصاديّ، دولة تقيم اقتصادًا مستقلًّا خاصًّا بها، ومعنى أمنيّ، دولة تشكّل ملاذًا آمنًا ليهود العالم كلّه عند الخطر.",
     ru:"Экономическое значение: государство с собственной самостоятельной экономикой, и значение безопасности: государство как надёжное убежище для евреев всего мира в час опасности.",
     en:"An economic sense: a state maintaining an independent economy of its own; and a security sense: a state serving as a safe haven for Jews everywhere in time of danger."},
    {he:"משמעות היסטורית — מדינה שנוסדה בעקבות השואה, ומשמעות גיאוגרפית — מדינה שגבולותיה נגזרים ממפת ארץ ישראל ההיסטורית.",
     ar:"معنى تاريخيّ، دولة أُقيمت في أعقاب المحرقة، ومعنى جغرافيّ، دولة تُشتقّ حدودها من خريطة أرض إسرائيل التاريخية.",
     ru:"Историческое значение: государство, основанное после Катастрофы, и географическое: государство, границы которого выводятся с карты исторической Земли Израиля.",
     en:"A historical sense: a state founded after the Holocaust; and a geographical sense: a state whose borders are drawn from the map of the historic Land of Israel."},
    {he:"משמעות משפטית — מדינה שחוקיה נגזרים מן ההלכה, ומשמעות מנהלית — מדינה שרשויותיה פועלות לפי לוח השנה העברי ובעברית בלבד.",
     ar:"معنى قانونيّ، دولة تُشتقّ قوانينها من الشريعة اليهودية، ومعنى إداريّ، دولة تعمل سلطاتها وفق التقويم العبريّ وبالعبرية فقط.",
     ru:"Правовое значение: государство, чьи законы выводятся из галахи, и административное: государство, органы которого работают по еврейскому календарю и только на иврите.",
     en:"A legal sense: a state whose laws derive from religious law; and an administrative sense: a state whose offices work by the Hebrew calendar and in Hebrew alone."}],
   0,
   {he:"“יהודי” יכול לתאר עם, ויכול לתאר דת. שתי הקריאות קיימות בשיח.",
    ar:"“يهوديّ” قد يصف شعبًا وقد يصف دينًا. القراءتان قائمتان في النقاش.",
    ru:"«Еврейский» может описывать народ и может: религию. Оба прочтения бытуют в дискуссии.",
    en:"“Jewish” can describe a people and can describe a religion. Both readings exist in the debate."},
   {he:"ההבחנה חשובה מפני שהמתח עם הדמוקרטיה שונה בכל אחת: המשמעות הלאומית מעוררת שאלות של שוויון אזרחי בין רוב למיעוט, והמשמעות הדתית מעוררת שאלות של חופש דת ומצפון — גם בתוך הרוב היהודי.",
    ar:"التمييز مهمّ لأن التوتّر مع الديمقراطية يختلف في كلٍّ: المعنى القوميّ يثير أسئلة المساواة المدنية بين أغلبية وأقلية، والمعنى الدينيّ يثير أسئلة حرّية الدين والضمير، حتى داخل الأغلبية اليهودية.",
    ru:"Различение важно, поскольку напряжение с демократией в каждом случае своё: национальное значение поднимает вопросы гражданского равенства большинства и меньшинства, религиозное: вопросы свободы религии и совести, в том числе внутри еврейского большинства.",
    en:"The distinction matters because the tension with democracy differs in each: the national meaning raises questions of civic equality between majority and minority, while the religious meaning raises questions of freedom of religion and conscience: including within the Jewish majority."},
   null),
  Q("jd-1-01",{"he": "מתי ואיפה הוכרזה הקמת מדינת ישראל?", "ar": "متى وأين أُعلن قيام دولة إسرائيل؟", "ru": "Когда и где было провозглашено создание Государства Израиль?", "en": "When and where was the establishment of the State of Israel declared?"},[{"he": "ב-14 במאי 1948, בתל אביב.", "ar": "في 14 أيار 1948، في تل أبيب.", "ru": "14 мая 1948 года, в Тель-Авиве.", "en": "On 14 May 1948, in Tel Aviv."}, {"he": "ב-29 בנובמבר 1947, בעצרת האו״ם בניו יורק, יחד עם ההחלטה על החלוקה.", "ar": "في 29 تشرين الثاني 1947، في الجمعية العامة للأمم المتحدة في نيويورك، مع قرار التقسيم.", "ru": "29 ноября 1947 года, на Генассамблее ООН в Нью-Йорке, вместе с решением о разделе.", "en": "On 29 November 1947, at the UN General Assembly in New York, together with the partition decision."}, {"he": "ב-1950, בישיבה הראשונה של הכנסת בירושלים.", "ar": "في عام 1950، في الجلسة الأولى للكنيست في القدس.", "ru": "В 1950 году, на первом заседании Кнессета в Иерусалиме.", "en": "In 1950, at the first session of the Knesset in Jerusalem."}, {"he": "ב-1897, בקונגרס הציוני הראשון בבזל.", "ar": "في عام 1897، في المؤتمر الصهيوني الأول في بازل.", "ru": "В 1897 году, на Первом сионистском конгрессе в Базеле.", "en": "In 1897, at the First Zionist Congress in Basel."}],0,{"he": "חשבו על היום שבו הסתיים המנדט הבריטי.", "ar": "فكّروا في اليوم الذي انتهى فيه الانتداب البريطاني.", "ru": "Вспомните день, когда закончился британский мандат.", "en": "Think of the day the British Mandate ended."},{"he": "דוד בן־גוריון קרא את מגילת העצמאות ב-14 במאי 1948, ה' באייר תש״ח, בתל אביב. זה היה יום לפני סיום המנדט הבריטי. החלטת האו״ם מ-1947 קדמה להכרזה, אבל היא לא הקימה את המדינה.", "ar": "قرأ دافيد بن غوريون وثيقة الاستقلال في 14 أيار 1948 في تل أبيب. كان ذلك قبل يوم من انتهاء الانتداب البريطاني. سبق قرار الأمم المتحدة من عام 1947 الإعلان، لكنه لم يُقِم الدولة.", "ru": "Давид Бен-Гурион зачитал Декларацию независимости 14 мая 1948 года в Тель-Авиве. Это было за день до окончания британского мандата. Решение ООН 1947 года было раньше, но само государство оно не создало.", "en": "David Ben-Gurion read the Declaration of Independence on 14 May 1948 in Tel Aviv. It was one day before the British Mandate ended. The 1947 UN decision came earlier, but it did not establish the state."},null),
  Q("jd-1-02",{"he": "מה מבטיחה מגילת העצמאות לכל אזרחי המדינה?", "ar": "ماذا تضمن وثيقة الاستقلال لجميع مواطني الدولة؟", "ru": "Что Декларация независимости обещает всем гражданам государства?", "en": "What does the Declaration of Independence promise all citizens of the state?"},[{"he": "שוויון זכויות לאזרחים היהודים בלבד.", "ar": "المساواة في الحقوق للمواطنين اليهود فقط.", "ru": "Равноправие только для граждан-евреев.", "en": "Equal rights for Jewish citizens only."}, {"he": "שוויון זכויות חברתי ומדיני, בלי הבדל דת, גזע ומין.", "ar": "مساواة تامة في الحقوق الاجتماعية والسياسية، دون تمييز في الدين والعرق والجنس.", "ru": "Полное социальное и политическое равноправие, без различия религии, расы и пола.", "en": "Full social and political equal rights, regardless of religion, race and sex."}, {"he": "המגילה אינה עוסקת בשוויון כלל, והשוויון נקבע לראשונה רק בחוק יסוד שנחקק ב-1992.", "ar": "الوثيقة لا تتناول المساواة إطلاقًا، والمساواة نُصّ عليها لأول مرة فقط في قانون أساس سُنّ عام 1992.", "ru": "Декларация вообще не говорит о равенстве, и оно впервые закреплено лишь в Основном законе 1992 года.", "en": "The Declaration does not deal with equality at all; equality was first set only in a Basic Law passed in 1992."}, {"he": "חובת שירות צבאי שווה לכל אזרח.", "ar": "واجب خدمة عسكرية متساوٍ لكل مواطن.", "ru": "Одинаковую обязанность военной службы для каждого гражданина.", "en": "An equal duty of military service for every citizen."}],1,{"he": "המגילה מונה כמה הבדלים בין בני אדם — ומה הם לא ישנו.", "ar": "تذكر الوثيقة عدّة فروق بين البشر، وما الذي لن تغيّره.", "ru": "Декларация перечисляет различия между людьми — и чего они не изменят.", "en": "The Declaration lists several differences between people — and what they will not change."},{"he": "המגילה קובעת שהמדינה תקיים שוויון זכויות חברתי ומדיני גמור לכל אזרחיה. היא מוסיפה: בלי הבדל דת, גזע ומין. זה עיקרון דמוקרטי מרכזי במגילה.", "ar": "تنصّ الوثيقة على أنّ الدولة ستقيم مساواة تامة في الحقوق الاجتماعية والسياسية لجميع مواطنيها. وتضيف: دون تمييز في الدين والعرق والجنس. هذا مبدأ ديمقراطي مركزي فيها.", "ru": "Декларация устанавливает, что государство обеспечит полное социальное и политическое равноправие всем гражданам. Она добавляет: без различия религии, расы и пола. Это главный демократический принцип документа.", "en": "The Declaration states that the state will ensure full social and political equality for all its citizens. It adds: regardless of religion, race and sex. This is a central democratic principle in it."},null),
  Q("jd-1-03",{"he": "מהם שלושת סמלי המדינה הרשמיים של ישראל?", "ar": "ما هي رموز دولة إسرائيل الرسمية الثلاثة؟", "ru": "Каковы три официальных государственных символа Израиля?", "en": "What are the three official state symbols of Israel?"},[{"he": "הדגל, ההמנון ומגילת העצמאות.", "ar": "العلم والنشيد ووثيقة الاستقلال.", "ru": "Флаг, гимн и Декларация независимости.", "en": "The flag, the anthem and the Declaration of Independence."}, {"he": "הדגל, הכנסת והנשיא — כל אחד מהם מייצג רשות אחרת של השלטון.", "ar": "العلم والكنيست والرئيس، وكلّ منها يمثّل سلطة مختلفة من سلطات الحكم.", "ru": "Флаг, Кнессет и президент — каждый из них представляет другую ветвь власти.", "en": "The flag, the Knesset and the President — each one represents a different branch of government."}, {"he": "הדגל, הסמל (המנורה) וההמנון ״התקווה״.", "ar": "العلم والشعار (الشمعدان) والنشيد «هتكفا».", "ru": "Флаг, герб (менора) и гимн «Атиква».", "en": "The flag, the emblem (the menorah) and the anthem “Hatikvah”."}, {"he": "המנורה, מגן דוד והשופר.", "ar": "الشمعدان ونجمة داود والشوفار.", "ru": "Менора, звезда Давида и шофар.", "en": "The menorah, the Star of David and the shofar."}],2,{"he": "חפשו את התשובה שכל פריט בה הוא סמל, ולא מוסד או מסמך.", "ar": "ابحثوا عن الإجابة التي كلّ بند فيها رمز، لا مؤسّسة ولا وثيقة.", "ru": "Ищите ответ, в котором каждый пункт — символ, а не учреждение и не документ.", "en": "Look for the answer in which every item is a symbol, not an institution or a document."},{"he": "חוק הדגל, הסמל וההמנון קובע את שלושת סמלי המדינה. הדגל כחול־לבן עם מגן דוד, והסמל הוא מנורה עם ענפי זית. ההמנון הוא ״התקווה״.", "ar": "يحدّد قانون العلم والشعار والنشيد رموز الدولة الثلاثة. العلم أزرق وأبيض مع نجمة داود، والشعار شمعدان مع غصني زيتون. والنشيد هو «هتكفا».", "ru": "Закон о флаге, гербе и гимне определяет три государственных символа. Флаг бело-голубой со звездой Давида, герб — менора с оливковыми ветвями. Гимн — «Атиква».", "en": "The Flag, Emblem and Anthem Law sets the three state symbols. The flag is blue and white with a Star of David, and the emblem is a menorah with olive branches. The anthem is “Hatikvah”."},null),
  Q("jd-1-04",{"he": "מהו ״מיעוט לאומי״?", "ar": "ما هي «الأقلية القومية»؟", "ru": "Что такое «национальное меньшинство»?", "en": "What is a “national minority”?"},[{"he": "קבוצת תיירים ששוהה במדינה זמן קצר.", "ar": "مجموعة سيّاح تقيم في الدولة لفترة قصيرة.", "ru": "Группа туристов, которая ненадолго находится в стране.", "en": "A group of tourists staying in the country for a short time."}, {"he": "אזרחים שמצביעים למפלגה קטנה, שלא עברה את אחוז החסימה בבחירות האחרונות לכנסת.", "ar": "مواطنون يصوّتون لحزب صغير لم يتجاوز نسبة الحسم في آخر انتخابات للكنيست.", "ru": "Граждане, голосующие за маленькую партию, не прошедшую электоральный барьер на последних выборах в Кнессет.", "en": "Citizens who vote for a small party that did not pass the threshold in the last Knesset election."}, {"he": "כל קבוצה שמונה פחות ממיליון איש.", "ar": "أيّ مجموعة يقلّ عددها عن مليون شخص.", "ru": "Любая группа численностью меньше миллиона человек.", "en": "Any group of fewer than one million people."}, {"he": "אזרחים שזהותם הלאומית שונה מזו של רוב האזרחים במדינה.", "ar": "مواطنون تختلف هويّتهم القومية عن هويّة أغلبية المواطنين في الدولة.", "ru": "Граждане, чья национальная идентичность отличается от идентичности большинства граждан страны.", "en": "Citizens whose national identity differs from that of most citizens of the state."}],3,{"he": "המילה ״לאומי״ רומזת על סוג השוני בין הקבוצה לבין הרוב.", "ar": "كلمة «قومية» تلمّح إلى نوع الاختلاف بين المجموعة والأغلبية.", "ru": "Слово «национальное» подсказывает, в чём именно группа отличается от большинства.", "en": "The word \"national\" hints at the kind of difference between the group and the majority."},{"he": "מיעוט לאומי הוא קבוצה של אזרחים עם זהות לאומית משלה, שונה מזו של הרוב. בישראל המיעוט הלאומי הגדול הוא הערבים אזרחי המדינה. בני המיעוט הם אזרחים בעלי זכויות אזרח.", "ar": "الأقلية القومية مجموعة من المواطنين لها هويّة قومية خاصة تختلف عن هويّة الأغلبية. في إسرائيل الأقلية القومية الكبرى هي المواطنون العرب. وأبناء الأقلية مواطنون لهم حقوق المواطن.", "ru": "Национальное меньшинство — это граждане со своей национальной идентичностью, отличной от идентичности большинства. В Израиле крупнейшее национальное меньшинство — арабские граждане. Члены меньшинства — граждане с гражданскими правами.", "en": "A national minority is a group of citizens with its own national identity, different from the majority's. In Israel the largest national minority is the Arab citizens. Members of the minority are citizens with civil rights."},null)
 ],
 [ /* רמה 2 — הבנה */
  Q("jewdem-case1",
    {he:"אזרח ישראלי שאינו יהודי מבקש להביא בן זוג מחו״ל. הוא טוען שחוק השבות מפלה אותו. מהי הצגה מדויקת של המחלוקת?",
     ar:"مواطن إسرائيليّ غير يهوديّ يريد إحضار شريكه من الخارج، ويقول إن قانون العودة يميّز ضدّه. ما العرض الدقيق للخلاف؟",
     ru:"Израильский гражданин-нееврей хочет привезти супруга из-за границы и утверждает, что Закон о возвращении его дискриминирует. Как точно изложить спор?",
     en:"A non-Jewish Israeli citizen wants to bring a spouse from abroad and argues that the Law of Return discriminates against him. How is the dispute accurately stated?"},
   [{he:"אין מחלוקת: כל הבחנה על בסיס לאום היא הפליה, בכל מדינה ובכל הקשר.",
     ar:"لا خلاف: كلّ تفرقة على أساس قوميّ تمييز، في كلّ دولة وكلّ سياق.",
     ru:"Спора нет: любое различение по национальному признаку: дискриминация, в любой стране и в любом контексте.",
     en:"There is no dispute: any distinction on a national basis is discrimination, in every state and context."},
    {he:"אין מחלוקת: כל מדינה קובעת את מדיניות ההגירה שלה כראות עיניה, וזכות זו מוכרת במשפט הבינלאומי, ולכן שאלת השוויון אינה מתעוררת כלל בענייני כניסה לארץ, אשרות שהייה ואיחוד משפחות.",
     ar:"لا خلاف: كلّ دولة تحدّد سياسة الهجرة لديها كما ترى، وهذا الحقّ معترف به في القانون الدوليّ، ولذلك لا تُطرح مسألة المساواة إطلاقًا في شؤون الدخول إلى البلاد وتأشيرات الإقامة ولمّ الشمل.",
     ru:"Спора нет: каждое государство определяет свою иммиграционную политику по своему усмотрению, это право признано международным правом, и потому вопрос равенства вообще не встаёт в делах о въезде в страну, о визах на пребывание и о воссоединении семей.",
     en:"There is no dispute: every state sets its own immigration policy, the right is recognised in international law, and so the equality question does not arise at all in entry, residence visas or family reunification."},
    {he:"טענה אחת: זו הבחנה לגיטימית הנובעת מהגדרת המדינה כמדינת לאום. טענה נגדית: מדיניות הגירה משפיעה על חיי המשפחה של אזרחים, ולכן היא נבחנת גם במבחני שוויון. שתיהן טענות אזרחות מוכרות.",
     ar:"ادّعاء: تفرقة مشروعة نابعة من تعريف الدولة كدولة قومية. وادّعاء مضادّ: سياسة الهجرة تمسّ حياة عائلات مواطنين، فتُفحص أيضًا بمعايير المساواة. وكلاهما ادّعاءان معروفان في المدنيات.",
     ru:"Одна позиция: это правомерное различение, вытекающее из определения государства как национального. Встречная: иммиграционная политика влияет на семейную жизнь граждан, поэтому проверяется и на равенство. Обе: признанные позиции в гражданствоведении.",
     en:"One claim: this is a legitimate distinction flowing from the state's definition as a nation state. The counter-claim: immigration policy affects citizens' family life, so it is also tested for equality. Both are recognised civics positions."},
    {he:"המחלוקת היא רק על גובה האגרה שגובה משרד הפנים.",
     ar:"الخلاف على قيمة الرسم الذي تجبيه وزارة الداخلية فقط.",
     ru:"Спор лишь о размере пошлины МВД.",
     en:"The dispute is only about the fee charged by the interior ministry."}],
   2,
   {he:"חוק השבות משרת מטרה מסוימת, והוא גם פוגע במישהו. מהי המטרה? ומי נפגע?",
    ar:"قانون العودة يخدم غاية معينة وهو يمسّ بأحدهم أيضًا. ما الغاية؟ ومن يتضرر؟",
    ru:"Закон о возвращении служит определённой цели и при этом кого-то задевает. Какая цель? И кто страдает?",
    en:"The Law of Return serves a certain purpose, and it also harms someone. What is the purpose? And who is harmed?"},
   {he:"תוכנית הלימודים מלמדת את המתח הזה כמתח, ולא כתשובה אחת. מדינות לאום רבות מפעילות קריטריון לאומי בהגירה; היקף ההשלכה שלו על שוויון אזרחי הוא בדיוק נקודת המחלוקת.",
    ar:"يعلّم المنهاج هذا التوتّر كتوتّر لا كجواب واحد. دول قومية كثيرة تُعمل معيارًا قوميًّا في الهجرة؛ ومدى أثره على المساواة المدنية هو بالضبط موضع الخلاف.",
    ru:"Учебная программа преподаёт это напряжение как напряжение, а не как единственный ответ. Многие национальные государства применяют национальный критерий в иммиграции; мера его влияния на гражданское равенство и есть точка спора.",
    en:"The curriculum teaches this tension as a tension, not as a single answer. Many nation states apply a national criterion in immigration; how far it bears on civic equality is precisely the point at issue."},
   null),
  Q("jewdem-case2",
    {he:"עיריית עיר מעורבת מבקשת לקבוע שהשילוט העירוני יהיה בעברית בלבד. איזו שאלה אזרחית מתעוררת?",
     ar:"تريد بلدية مدينة مختلطة أن تكون اللافتات بالعبرية فقط. أيّ سؤال مدنيّ يُطرح؟",
     ru:"Муниципалитет смешанного города хочет, чтобы вывески были только на иврите. Какой гражданский вопрос возникает?",
     en:"The municipality of a mixed city wants street signage in Hebrew only. What civic question arises?"},
   [{he:"שאלה תקציבית בלבד: כמה עולה שילוט דו־לשוני.",
     ar:"سؤال ماليّ فقط: كم تكلّف اللافتات ثنائية اللغة.",
     ru:"Только бюджетный: сколько стоят двуязычные вывески.",
     en:"A purely budgetary one: how much bilingual signage costs."},
    {he:"שאלה של זכויות תרבותיות ושל נגישות לשירות ציבורי: האם שירות עירוני שאינו נגיש בשפת חלק מהתושבים מקיים את חובת השוויון.",
     ar:"سؤال حقوق ثقافية وإتاحة خدمة عامّة: هل خدمة بلدية غير متاحة بلغة قسم من السكّان تستوفي واجب المساواة.",
     ru:"Вопрос культурных прав и доступности публичной услуги: отвечает ли обязанности равенства услуга, недоступная на языке части жителей.",
     en:"A question of cultural rights and access to public service: does a municipal service inaccessible in the language of some residents meet the duty of equality."},
    {he:"שאלה של חופש עיסוק של מתקיני השילוט.",
     ar:"سؤال حرّية عمل مركّبي اللافتات.",
     ru:"Вопрос свободы занятий монтажников вывесок.",
     en:"A question of the sign installers' freedom of occupation."},
    {he:"אין שאלה: לעירייה סמכות מלאה בענייני שילוט, והיא רשאית לקבוע את שפת השילוט ברוב רגיל של המועצה הנבחרת, כמו בכל החלטה עירונית אחרת.",
     ar:"لا مسألة هنا: للبلدية صلاحية كاملة في شؤون اللافتات، ويحقّ لها تحديد لغة اللافتات بأغلبية عادية في المجلس المنتخَب، كأيّ قرار بلديّ آخر.",
     ru:"Вопроса нет: у мэрии полная компетенция в вопросах вывесок, и она вправе определить их язык простым большинством избранного совета, как и любое другое городское решение.",
     en:"No question arises: the municipality has full authority over signage and may set its language by a simple majority of the elected council, like any other municipal decision."}],
   1,
   {he:"מי גר בעיר, ומי צריך לקרוא את השלט כדי להגיע למרפאה?",
    ar:"مَن يسكن المدينة، ومَن يحتاج قراءة اللافتة للوصول إلى العيادة؟",
    ru:"Кто живёт в городе и кому нужно прочесть вывеску, чтобы дойти до поликлиники?",
    en:"Who lives in the city, and who needs to read the sign to reach the clinic?"},
   {he:"עד 2018 היו העברית והערבית שפות רשמיות. חוק־יסוד: ישראל — מדינת הלאום של העם היהודי קבע את העברית כשפת המדינה ולערבית מעמד מיוחד, והוסיף כי אין בכך כדי לפגוע במעמד שהיה לה בפועל. השאלה המעשית — נגישות השירות — נותרה חיה.",
    ar:"حتى ٢٠١٨ كانت العبرية والعربية لغتين رسميتين. وقرّر قانون أساس: إسرائيل، الدولة القومية للشعب اليهوديّ أن العبرية لغة الدولة وللعربية مكانة خاصّة، وأضاف أن ذلك لا يمسّ المكانة التي كانت لها عمليًّا. أما السؤال العمليّ، إتاحة الخدمة، فبقي قائمًا.",
    ru:"До 2018 года иврит и арабский были официальными языками. Основной закон «Израиль: национальное государство еврейского народа» установил иврит языком государства, а арабскому: особый статус, добавив, что это не умаляет фактически имевшегося у него положения. Практический вопрос: доступность услуги: остался живым.",
    en:"Until 2018 Hebrew and Arabic were official languages. Basic Law: Israel: the Nation State of the Jewish People made Hebrew the state language and gave Arabic a special status, adding that this does not impair the standing it had in practice. The practical question: access to services: remains live."},
   null),
  Q("jewdem-case3",
    {he:"תושב מבקש להינשא בנישואין אזרחיים בישראל. מדוע אין זו אפשרות קיימת, ובאיזה מתח מדובר?",
     ar:"يريد مقيم الزواج مدنيًّا في إسرائيل. لماذا لا يتوفّر ذلك، وأيّ توتّر يتعلّق الأمر به؟",
     ru:"Житель хочет заключить гражданский брак в Израиле. Почему такой возможности нет и о каком напряжении речь?",
     en:"A resident wishes to marry in a civil ceremony in Israel. Why is that not available, and what tension is involved?"},
   [{he:"מפני שאין בישראל משרד רישום נישואין; זו בעיה טכנית.",
     ar:"لأنه لا يوجد في إسرائيل مكتب تسجيل زواج؛ إنها مشكلة تقنية.",
     ru:"Потому что в Израиле нет органа регистрации браков; это техническая проблема.",
     en:"Because Israel has no marriage registry office; it is a technical problem."},
    {he:"מפני שענייני נישואין וגירושין נתונים לבתי הדין הדתיים לפי דין הקהילה. זהו מתח בין אופייה היהודי־דתי של המדינה לחופש הדת ולזכות למשפחה.",
     ar:"لأن شؤون الزواج والطلاق من اختصاص المحاكم الدينية وفق دين الطائفة. وهذا توتّر بين الطابع اليهوديّ الدينيّ للدولة وحرّية الدين والحقّ في الأسرة.",
     ru:"Потому что вопросы брака и развода отнесены к религиозным судам по закону общины. Это напряжение между еврейско-религиозным характером государства и свободой религии и правом на семью.",
     en:"Because marriage and divorce are assigned to the religious courts under each community's law. This is a tension between the state's Jewish-religious character and freedom of religion and the right to family life."},
    {he:"מפני שחוק־יסוד: כבוד האדם וחירותו אוסר על נישואין אזרחיים כדי למנוע פגיעה ברגשות דתיים, ולכן כל זוג נדרש להינשא בבית דין דתי המוכר בחוק.",
     ar:"لأنّ قانون أساس: كرامة الإنسان وحرّيته يمنع الزواج المدنيّ منعًا للمسّ بالمشاعر الدينية، ولذلك يُطلب من كلّ زوجين الزواج في محكمة دينية معترف بها في القانون.",
     ru:"Потому что Основной закон о достоинстве и свободе человека запрещает гражданский брак, чтобы не задевать религиозные чувства, и поэтому каждая пара обязана вступать в брак в признанном законом религиозном суде.",
     en:"Because Basic Law: Human Dignity and Liberty forbids civil marriage in order to avoid offending religious feelings, so every couple must marry in a religious court recognised by law."},
    {he:"מפני שבית המשפט העליון ביטל את הנישואין האזרחיים ב-1995.",
     ar:"لأن المحكمة العليا ألغت الزواج المدنيّ عام ١٩٩٥.",
     ru:"Потому что Верховный суд отменил гражданский брак в 1995 году.",
     en:"Because the Supreme Court abolished civil marriage in 1995."}],
   1,
   {he:"מי מוסמך בישראל להשיא, ולפי איזה דין?",
    ar:"مَن المخوَّل بعقد الزواج في إسرائيل، ووفق أيّ دين؟",
    ru:"Кто в Израиле уполномочен заключать брак и по какому закону?",
    en:"Who in Israel is authorised to marry people, and under which law?"},
   {he:"זהו חלק ממה שמכונה “הסדרי הסטטוס קוו” בענייני דת ומדינה. בפועל נישואין אזרחיים שנערכו בחו״ל נרשמים במרשם האוכלוסין, וקיים גם מוסד “ברית הזוגיות” לחסרי דת — פתרונות עקיפים למתח שלא הוכרע.",
    ar:"هذا جزء ممّا يُسمّى “ترتيبات الوضع الراهن” في الدين والدولة. عمليًّا يُسجَّل الزواج المدنيّ المعقود في الخارج في سجلّ السكّان، وثمّة أيضًا “ميثاق الزوجية” لمن لا دين لهم، حلول التفافية لتوتّر لم يُحسم.",
    ru:"Это часть так называемых «соглашений статус-кво» в вопросах религии и государства. На практике гражданский брак, заключённый за границей, регистрируется в реестре населения, а для не принадлежащих к религии существует «союз супружества»: обходные решения нерешённого напряжения.",
    en:"This is part of the so-called status quo arrangements on religion and state. In practice a civil marriage performed abroad is registered in the population registry, and a “covenant of partnership” exists for those of no religion: indirect solutions to an unresolved tension."},
   null),
  Q("jd-2-01",{"he": "עולה מצרפת קיבל אזרחות ישראלית ביום שעלה לארץ. מכוח מה קיבל אותה, ומה זה מבטא?", "ar": "حصل مهاجر يهودي من فرنسا على الجنسية الإسرائيلية يوم وصوله إلى البلاد. بموجب ماذا حصل عليها، وعلامَ يدلّ ذلك؟", "ru": "Репатриант из Франции получил израильское гражданство в день приезда. На каком основании, и что это выражает?", "en": "An immigrant from France received Israeli citizenship on the day he arrived. On what basis, and what does this express?"},[{"he": "מכוח לידה, כי מי שנולד ליהודי נחשב כאילו נולד בישראל.", "ar": "بموجب الولادة، لأنّ من وُلد لأب يهودي يُعَدّ كأنّه وُلد في إسرائيل.", "ru": "По рождению: кто родился у еврея, считается рождённым в Израиле.", "en": "By birth, because anyone born to a Jew counts as born in Israel."}, {"he": "מכוח החלטה מיוחדת של הכנסת, שמצביעה על כל עולה בנפרד.", "ar": "بموجب قرار خاص من الكنيست الذي يصوّت على كلّ مهاجر على حدة.", "ru": "По особому решению Кнессета, который голосует по каждому репатрианту отдельно.", "en": "By a special Knesset decision, which votes on each immigrant separately."}, {"he": "מכוח השבות. זה מבטא את הקשר בין המדינה לעם היהודי.", "ar": "بموجب «العودة». وهذا يعبّر عن الصلة بين الدولة والشعب اليهودي.", "ru": "На основании возвращения. Это выражает связь государства с еврейским народом.", "en": "By virtue of return. This expresses the link between the state and the Jewish people."}, {"he": "מכוח התאזרחות רגילה, שדורשת שנים של מגורים בארץ וידיעה בסיסית של השפה העברית.", "ar": "بموجب تجنّس عادي يتطلّب سنوات من السكن في البلاد ومعرفة أساسية باللغة العبرية.", "ru": "Путём обычной натурализации, которая требует нескольких лет жизни в стране и базового знания иврита.", "en": "By regular naturalisation, which requires years of living in the country and basic knowledge of Hebrew."}],2,{"he": "הוא קיבל אותה מיד, בלי לחכות שנים.", "ar": "حصل عليها فورًا، دون انتظار سنوات.", "ru": "Он получил его сразу, не ожидая годами.", "en": "He received it at once, without waiting years."},{"he": "חוק השבות וחוק האזרחות נותנים ליהודי שעולה לישראל אזרחות מכוח שבות. ההתאזרחות הרגילה דורשת תנאים כמו מגורים של כמה שנים. ההסדר מבטא את הגדרת ישראל כמדינת הלאום של העם היהודי.", "ar": "يمنح قانونا العودة والجنسية اليهوديَّ المهاجر إلى إسرائيل جنسية بموجب العودة. أمّا التجنّس العادي فيتطلّب شروطًا مثل السكن عدّة سنوات. ويعبّر هذا الترتيب عن تعريف إسرائيل دولةَ القومية للشعب اليهودي.", "ru": "Закон о возвращении и Закон о гражданстве дают еврею-репатрианту гражданство на основании возвращения. Обычная натурализация требует условий, например нескольких лет проживания. Это выражает определение Израиля как национального государства еврейского народа.", "en": "The Law of Return and the Citizenship Law give a Jew who immigrates citizenship by virtue of return. Regular naturalisation requires conditions such as several years of residence. This reflects Israel's definition as the nation-state of the Jewish people."},null),
  Q("jd-2-02",{"he": "השבת היא יום המנוחה הרשמי בישראל. מה קובע החוק לגבי עובדים שאינם יהודים?", "ar": "السبت هو يوم الراحة الرسمي في إسرائيل. ماذا يقرّر القانون بشأن العاملين غير اليهود؟", "ru": "Суббота — официальный день отдыха в Израиле. Что закон устанавливает для работников-неевреев?", "en": "Saturday is Israel's official day of rest. What does the law say about workers who are not Jewish?"},[{"he": "הם חייבים לעבוד בשבת, כי אינם שומרים אותה.", "ar": "يجب عليهم العمل يوم السبت لأنهم لا يحفظونه.", "ru": "Они обязаны работать в субботу, потому что не соблюдают её.", "en": "They must work on Saturday, because they do not keep it."}, {"he": "הם זכאים לנוח ביום המקובל בדתם, למשל שישי או ראשון.", "ar": "يحقّ لهم الراحة في اليوم المتّبع في دينهم، مثل الجمعة أو الأحد.", "ru": "Они вправе отдыхать в день, принятый в их религии, например в пятницу или воскресенье.", "en": "They may rest on the day customary in their religion, such as Friday or Sunday."}, {"he": "אין להם יום מנוחה קבוע.", "ar": "ليس لهم يوم راحة ثابت.", "ru": "У них нет постоянного дня отдыха.", "en": "They have no fixed day of rest."}, {"he": "הם חייבים לנוח בשבת כמו כל העובדים, ואינם רשאים לבחור יום אחר בשום מקרה.", "ar": "يجب عليهم الراحة يوم السبت مثل جميع العاملين، ولا يحقّ لهم اختيار يوم آخر في أيّ حال.", "ru": "Они обязаны отдыхать в субботу, как все работники, и ни в коем случае не могут выбрать другой день.", "en": "They must rest on Saturday like all workers, and may never choose another day under any circumstances."}],1,{"he": "לכל דת יש יום קדוש משלה בשבוע.", "ar": "لكلّ دين يوم مقدّس خاص به في الأسبوع.", "ru": "У каждой религии есть свой святой день недели.", "en": "Each religion has its own holy day of the week."},{"he": "השבת והחגים היהודיים הם ימי המנוחה הרשמיים, וזה ביטוי לאופי היהודי של המדינה. החוק מאפשר לעובד שאינו יהודי לנוח ביום המנוחה של דתו. כך החוק מכבד גם את זכויות המיעוטים.", "ar": "السبت والأعياد اليهودية هي أيّام الراحة الرسمية، وهذا تعبير عن الطابع اليهودي للدولة. ويتيح القانون للعامل غير اليهودي أن يرتاح في يوم راحة دينه. وبذلك يحترم القانون حقوق الأقليات أيضًا.", "ru": "Суббота и еврейские праздники — официальные дни отдыха, и это выражение еврейского характера государства. Закон позволяет работнику-нееврею отдыхать в день отдыха своей религии. Так закон уважает и права меньшинств.", "en": "Saturday and the Jewish holidays are the official days of rest, which reflects the state's Jewish character. The law lets a worker who is not Jewish rest on their own religion's day of rest. In this way the law also respects minority rights."},null),
  Q("jd-2-03",{"he": "דוד אומר: ״במדינה יהודית החוק צריך להתבסס על ההלכה.״ רות אומרת: ״יהדות המדינה היא בעיקר שפה, לוח שנה והיסטוריה משותפת.״ מה נכון לגבי שתי העמדות?", "ar": "يقول دافيد: «في الدولة اليهودية يجب أن يستند القانون إلى الشريعة اليهودية». وتقول روت: «يهودية الدولة هي أساسًا لغة وتقويم وتاريخ مشترك». ما الصحيح بشأن الموقفين؟", "ru": "Давид говорит: «В еврейском государстве закон должен опираться на галаху». Рут говорит: «Еврейский характер государства — это прежде всего язык, календарь и общая история». Что верно об этих позициях?", "en": "David says: “In a Jewish state the law should be based on halakha.” Ruth says: “The state's Jewishness is mainly a shared language, calendar and history.” What is true about the two positions?"},[{"he": "רק עמדתו של דוד מתארת מדינה יהודית.", "ar": "موقف دافيد وحده يصف دولة يهودية.", "ru": "Только позиция Давида описывает еврейское государство.", "en": "Only David's position describes a Jewish state."}, {"he": "שניהם מתווכחים על שיטת הבחירות.", "ar": "كلاهما يتجادلان حول طريقة الانتخابات.", "ru": "Они оба спорят о системе выборов.", "en": "They are both arguing about the electoral system."}, {"he": "אין ביניהם מחלוקת, והם רק מנסחים את אותה עמדה במילים אחרות שמתאימות לקהלים שונים.", "ar": "لا خلاف بينهما أبدًا، بل هما يصوغان الموقف نفسه بكلمات مختلفة تناسب جماهير مختلفة في المجتمع.", "ru": "Между ними нет спора: они лишь формулируют одну и ту же позицию разными словами для разной аудитории в обществе.", "en": "There is no dispute: they only phrase the same position in different words to suit different audiences in society."}, {"he": "דוד מדגיש משמעות דתית ורות משמעות לאומית־תרבותית; שתי העמדות קיימות בציבור.", "ar": "دافيد يؤكّد المعنى الديني وروت المعنى القومي الثقافي؛ والموقفان موجودان في المجتمع.", "ru": "Давид подчёркивает религиозный смысл, а Рут — национально-культурный; обе позиции есть в обществе.", "en": "David stresses a religious meaning and Ruth a national-cultural one; both positions exist in society."}],3,{"he": "שאלו את עצמכם: על מה כל אחד מהם שם את הדגש?", "ar": "اسألوا أنفسكم: على ماذا يضع كلّ منهما التركيز؟", "ru": "Спросите себя: на что каждый из них делает упор?", "en": "Ask yourself: what does each of them put the stress on?"},{"he": "למונח ״מדינה יהודית״ יש כמה פירושים. יש המדגישים את הדת וההלכה, ויש המדגישים את הלאום, השפה והתרבות. אלה עמדות של אנשים שונים, ושתיהן חלק מהוויכוח הציבורי בישראל.", "ar": "لمصطلح «دولة يهودية» عدّة تفسيرات. هناك من يؤكّد الدين والشريعة، وهناك من يؤكّد القومية واللغة والثقافة. هذه مواقف أشخاص مختلفين، وكلاهما جزء من النقاش العامّ في إسرائيل.", "ru": "У понятия «еврейское государство» несколько толкований. Одни подчёркивают религию и галаху, другие — нацию, язык и культуру. Это позиции разных людей, и обе — часть общественного спора в Израиле.", "en": "The term “Jewish state” has several readings. Some stress religion and halakha, others stress nationhood, language and culture. These are positions held by different people, and both are part of the public debate in Israel."},null),
  Q("jd-2-04",{"he": "ביישוב ערבי בישראל בית ספר ממלכתי מלמד בערבית ומלמד גם את תרבות הקהילה. איזו זכות זה מבטא?", "ar": "في بلدة عربية في إسرائيل، تدرّس مدرسة رسمية باللغة العربية وتعلّم ثقافة المجتمع أيضًا. أيّ حقّ يعبّر عنه ذلك؟", "ru": "В арабском населённом пункте Израиля государственная школа учит на арабском и преподаёт культуру общины. Какое право это выражает?", "en": "In an Arab town in Israel, a state school teaches in Arabic and also teaches the community's culture. Which right does this express?"},[{"he": "זכות של מיעוט לשמור על השפה והתרבות שלו.", "ar": "حقّ الأقلية في الحفاظ على لغتها وثقافتها.", "ru": "Право меньшинства сохранять свой язык и культуру.", "en": "A minority's right to preserve its language and culture."}, {"he": "חופש העיסוק של המורים.", "ar": "حرية العمل للمعلّمين.", "ru": "Свобода занятий учителей.", "en": "The teachers' freedom of occupation."}, {"he": "הזכות להצביע בבחירות לכנסת.", "ar": "الحقّ في التصويت في انتخابات الكنيست.", "ru": "Право голосовать на выборах в Кнессет.", "en": "The right to vote in Knesset elections."}, {"he": "הזכות לשכר מינימום, שהמדינה מבטיחה לכל עובד בלי הבדל דת ולאום.", "ar": "الحقّ في الحدّ الأدنى للأجور، الذي تضمنه الدولة لكلّ عامل دون تمييز في الدين والقومية.", "ru": "Право на минимальную зарплату, которую государство гарантирует каждому работнику без различия религии и национальности.", "en": "The right to a minimum wage, which the state guarantees every worker regardless of religion or nationality."}],0,{"he": "מה הקבוצה מקבלת כאן — כסף, קול בבחירות, או משהו שקשור לזהות?", "ar": "ماذا تحصل المجموعة هنا: مال أم صوت في الانتخابات أم شيء يتعلّق بالهوية؟", "ru": "Что здесь получает группа — деньги, голос на выборах или что-то, связанное с идентичностью?", "en": "What does the group get here — money, a vote, or something tied to identity?"},{"he": "מערכת החינוך הממלכתית כוללת בתי ספר שמלמדים בערבית. זו זכות קיבוצית של המיעוט: לשמור על השפה, על התרבות ועל הזהות שלו. זכויות כאלה ניתנות לקבוצה, ולא רק לאדם יחיד.", "ar": "يشمل جهاز التعليم الرسمي مدارس تدرّس باللغة العربية. هذا حقّ جماعي للأقلية: الحفاظ على لغتها وثقافتها وهويتها. تُمنح مثل هذه الحقوق للمجموعة، لا للفرد وحده.", "ru": "Государственная система образования включает школы с обучением на арабском. Это коллективное право меньшинства: сохранять свой язык, культуру и идентичность. Такие права даются группе, а не только отдельному человеку.", "en": "The state school system includes schools that teach in Arabic. This is a collective right of the minority: to keep its language, culture and identity. Such rights are given to a group, not only to an individual."},null)
 ],
 [ /* רמה 3 — ניתוח */
  Q("jewdem-anal1",
    {he:"כיצד מנוסח המתח בין “יהודית” ל“דמוקרטית” בצורתו המדויקת ביותר?",
     ar:"كيف يُصاغ التوتّر بين “يهودية” و“ديمقراطية” بأدقّ صورة؟",
     ru:"Как точнее всего сформулировать напряжение между «еврейским» и «демократическим»?",
     en:"How is the tension between “Jewish” and “democratic” most precisely stated?"},
   [{he:"אין מתח: שני המונחים אומרים בדיוק אותו דבר.",
     ar:"لا توتّر: المصطلحان يقولان الشيء ذاته تمامًا.",
     ru:"Напряжения нет: оба понятия означают ровно одно и то же.",
     en:"There is no tension: the two terms say exactly the same thing."},
    {he:"המתח מוחלט — מדינת לאום שמעניקה מעמד מיוחד לקבוצה אחת אינה יכולה להיות דמוקרטית, ולכן על המדינה לבחור בין הגדרתה היהודית לבין משטרה הדמוקרטי ולוותר על אחד מהם.",
     ar:"التوتّر مطلق، دولة قومية تمنح مكانة خاصّة لمجموعة واحدة لا يمكن أن تكون ديمقراطية، ولذلك على الدولة أن تختار بين تعريفها اليهوديّ ونظامها الديمقراطيّ وتتنازل عن أحدهما.",
     ru:"Напряжение абсолютно: национальное государство, дающее особый статус одной группе, не может быть демократическим, поэтому государству надо выбрать между еврейским определением и демократическим строем и от одного отказаться.",
     en:"The tension is absolute: a nation state that grants one group a special status cannot be democratic, so the state must choose between its Jewish definition and its democratic regime and give one of them up."},
    {he:"המתח מתעורר בנקודות מסוימות — סמלים, הגירה, שפה, דת ומדינה — שבהן מרכיב לאומי או דתי של הרוב פוגש את דרישת השוויון האזרחי; בשאר התחומים אין ביניהם סתירה.",
     ar:"يظهر التوتّر في نقاط بعينها، الرموز، الهجرة، اللغة، الدين والدولة، حيث يلتقي مركّب قوميّ أو دينيّ للأغلبية بمطلب المساواة المدنية؛ وفي سائر المجالات لا تناقض بينهما.",
     ru:"Напряжение возникает в определённых точках: символы, иммиграция, язык, религия и государство, где национальный или религиозный компонент большинства встречается с требованием гражданского равенства; в остальном противоречия нет.",
     en:"The tension appears at particular points: symbols, immigration, language, religion and state: where a national or religious element of the majority meets the demand for civic equality; elsewhere there is no contradiction between them."},
    {he:"המתח קיים רק בשאלת ההגירה.",
     ar:"التوتّر قائم في مسألة الهجرة فقط.",
     ru:"Напряжение существует только в вопросе иммиграции.",
     en:"The tension exists only over immigration."}],
   2,
   {he:"האם המתח קיים בכל שאלה, או רק בשאלות מסוימות? חשבו על חוק התעבורה מול חוק השבות.",
    ar:"أيوجد التوتّر في كلّ مسألة أم في مسائل بعينها؟ قارنوا قانون السير بقانون العودة.",
    ru:"Возникает ли напряжение в любом вопросе или лишь в некоторых? Сравните правила дорожного движения и Закон о возвращении.",
    en:"Does the tension arise in every question, or only in some? Compare the traffic laws with the Law of Return."},
   {he:"ניסוח מדויק מונע שתי טעויות נפוצות: הכחשת המתח, והפיכתו לסתירה מוחלטת. בפסיקה מקובל לאזן — לתת משקל לשני המרכיבים ולחפש את הפגיעה המצומצמת — ולא להכריע שאחד גובר תמיד.",
    ar:"الصياغة الدقيقة تمنع خطأين شائعين: إنكار التوتّر، وتحويله تناقضًا مطلقًا. وفي الاجتهاد يُعتاد الموازنة، إعطاء وزن للمركّبين والبحث عن أقلّ مساس، لا الحسم بأن أحدهما يتفوّق دائمًا.",
