topic("princ","dem",
  {he:"עקרונות הדמוקרטיה",ar:"مبادئ الديمقراطية",ru:"Принципы демократии",en:"The principles of democracy"},
  {he:"הכרעת רוב, שלטון החוק והפרדת רשויות",
   ar:"حكم الأغلبية، سيادة القانون والفصل بين السلطات",
   ru:"Решение большинства, верховенство закона и разделение властей",
   en:"Majority rule, the rule of law and the separation of powers"},
[
 [ /* רמה 1 — ידע */
  Q("princ-maj",
    {he:"מהו עקרון הכרעת הרוב בדמוקרטיה?",
     ar:"ما هو مبدأ حكم الأغلبية في الديمقراطية؟",
     ru:"Что такое принцип решения большинства в демократии?",
     en:"What is the principle of majority rule in a democracy?"},
   [{he:"ההחלטה מתקבלת לפי דעת הרוב, והמיעוט מקבל אותה ושומר על זכויותיו ועל זכותו להיאבק בדרכי שלום.",
     ar:"يُتَّخذ القرار وفق رأي الأغلبية، وتقبله الأقلية مع حفاظها على حقوقها وعلى حقّها في النضال بالطرق السلمية.",
     ru:"Решение принимается по мнению большинства, а меньшинство принимает его, сохраняя свои права и право бороться мирными средствами.",
     en:"The decision follows the majority, and the minority accepts it while keeping its rights and its right to campaign by peaceful means."},
    {he:"הרוב רשאי לבטל את זכויות המיעוט, מפני שההצבעה היא שהכריעה והמיעוט הפסיד בה.",
     ar:"يحقّ للأغلبية إلغاء حقوق الأقلية، لأنّ التصويت هو الذي حسم والأقلية خسرت فيه.",
     ru:"Большинство вправе отменить права меньшинства, потому что вопрос решило голосование, а меньшинство в нём проиграло.",
     en:"The majority may cancel the minority's rights, because the vote decided the matter and the minority lost it."},
    {he:"כל החלטה מחייבת הסכמה של כל האזרחים ללא יוצא מן הכלל.",
     ar:"كلّ قرار يستوجب موافقة جميع المواطنين دون استثناء.",
     ru:"Любое решение требует согласия всех граждан без исключения.",
     en:"Every decision requires the agreement of every citizen without exception."},
    {he:"ההחלטה מתקבלת בידי מומחים, מפני שהם יודעים טוב יותר מהציבור מה נכון, והרוב אינו בקיא בפרטים.",
     ar:"يُتَّخذ القرار على يد خبراء، لأنّهم أدرى من الجمهور بما هو صحيح، والأغلبية غير ملمّة بالتفاصيل.",
     ru:"Решение принимают эксперты, потому что они лучше общества знают, как правильно, а большинство не разбирается в деталях.",
     en:"The decision is taken by experts, because they know better than the public what is right, and the majority does not master the details."}],
   0,
   {he:"שאלו את עצמכם מה קורה למיעוט אחרי ההצבעה, ולא רק מי ניצח בה.",
    ar:"اسألوا أنفسكم ماذا يحدث للأقلية بعد التصويت، لا مَن فاز فيه فقط.",
    ru:"Спросите себя, что происходит с меньшинством после голосования, а не только кто победил.",
    en:"Ask yourself what happens to the minority after the vote, not only who won it."},
   {he:"הכרעת הרוב היא כלל הכרעה, לא היתר לפגוע. המיעוט מקבל את ההחלטה, ממשיך לשכנע בדרכי שלום, ויכול להפוך לרוב בבחירות הבאות — ולכן הגנת זכויותיו היא חלק מהעיקרון ולא חריג לו.",
    ar:"حكم الأغلبية قاعدة حسم لا رخصة للمساس. تقبل الأقلية القرار، وتواصل الإقناع بالطرق السلمية، وقد تصبح أغلبية في الانتخابات القادمة، لذلك حماية حقوقها جزء من المبدأ لا استثناء منه.",
    ru:"Решение большинства: правило принятия решений, а не разрешение ущемлять. Меньшинство принимает решение, продолжает убеждать мирно и может стать большинством на следующих выборах: поэтому защита его прав входит в сам принцип, а не является исключением.",
    en:"Majority rule is a decision rule, not a licence to harm. The minority accepts the decision, keeps persuading peacefully, and may become the majority at the next election: which is why protecting its rights is part of the principle, not an exception to it."},
   null),
  Q("princ-law",
    {he:"מהו עקרון שלטון החוק?",
     ar:"ما هو مبدأ سيادة القانون؟",
     ru:"Что такое принцип верховенства закона?",
     en:"What is the rule of law?"},
   [{he:"החוק מחייב את האזרחים בלבד, והשלטון פועל לפי שיקול דעתו.",
     ar:"القانون يُلزم المواطنين فقط، والسلطة تعمل وفق تقديرها.",
     ru:"Закон обязывает только граждан, а власть действует по своему усмотрению.",
     en:"The law binds citizens only, and the government acts as it sees fit."},
    {he:"החוק מחייב את כולם, ובכללם את השלטון עצמו ואת נבחריו.",
     ar:"القانون يُلزم الجميع، بمن فيهم السلطة نفسها ومنتخبوها.",
     ru:"Закон обязывает всех, включая саму власть и её избранников.",
     en:"The law binds everyone, the government and its elected officials included."},
    {he:"החוק מחייב רק כאשר בית המשפט הכריז עליו כתקף בפסק דין מנחה.",
     ar:"القانون يُلزم فقط حين تعلن المحكمة سريانه في حكم إرشاديّ.",
     ru:"Закон обязывает лишь тогда, когда суд признал его действующим в руководящем решении.",
     en:"The law binds only once a court has declared it valid in a leading judgment."},
    {he:"החוק מחייב את מי שהצביע בעד הממשלה המכהנת.",
     ar:"القانون يُلزم من صوّت للحكومة القائمة.",
     ru:"Закон обязывает тех, кто голосовал за действующее правительство.",
     en:"The law binds those who voted for the sitting government."}],
   1,
   {he:"העיקרון נועד להגביל מישהו. את מי הוא היה מיותר אילו הגביל אזרחים בלבד?",
    ar:"المبدأ وُضع ليقيّد أحدًا. مَن هو، إذا كان تقييد المواطنين وحدهم يجعله بلا معنى؟",
    ru:"Принцип создан, чтобы кого-то ограничить. Кого именно, если ограничение одних граждан лишало бы его смысла?",
    en:"The principle exists to limit someone. Whom, if limiting citizens alone would make it pointless?"},
   {he:"שלטון החוק יש לו שני פנים: פורמלי — הכול פועלים לפי החוק הכתוב, ומהותי — גם תוכן החוק עצמו חייב לכבד זכויות אדם. שר שאינו נחקר מפני שהוא שר הוא הפרה של שניהם.",
    ar:"لسيادة القانون وجهان: شكليّ، الجميع يعملون وفق القانون المكتوب، وجوهريّ، مضمون القانون نفسه عليه أن يحترم حقوق الإنسان. وزير لا يُحقَّق معه لأنه وزير خرقٌ للاثنين.",
    ru:"У верховенства закона две стороны: формальная: все действуют по писаному закону, и содержательная: само содержание закона должно уважать права человека. Министр, которого не расследуют потому что он министр, нарушает обе.",
    en:"The rule of law has two faces: formal: everyone acts under the written law; and substantive: the content of the law must itself respect human rights. A minister not investigated because he is a minister breaches both."},
   null),
  Q("princ-sep",
    {he:"מהי הפרדת רשויות, ולשם מה היא קיימת?",
     ar:"ما هو الفصل بين السلطات، ولماذا يوجد؟",
     ru:"Что такое разделение властей и зачем оно нужно?",
     en:"What is the separation of powers, and what is it for?"},
   [{he:"חלוקת עבודה טכנית בין משרדי הממשלה, כדי שכל משרד יטפל בתחומו שלו ולא תיווצר כפילות בעבודת השלטון.",
     ar:"تقسيم عمل تقنيّ بين وزارات الحكومة، كي تعالج كلّ وزارة مجالها ولا تنشأ ازدواجية في عمل السلطة.",
     ru:"Техническое разделение труда между министерствами, чтобы каждое занималось своей сферой и не возникало дублирования в работе власти.",
     en:"A technical division of labour between ministries, so that each handles its own field and no duplication arises in the work of government."},
    {he:"הפרדה בין המדינה לדת, כדי שלא תהיה דת רשמית ושהחקיקה לא תיגזר מכללי ההלכה של קהילה אחת.",
     ar:"فصل بين الدولة والدين، لئلّا يكون دين رسميّ ولئلّا يُشتقّ التشريع من أحكام شريعة طائفة واحدة.",
     ru:"Отделение государства от религии, чтобы не было официальной религии и чтобы законы не выводились из религиозных правил одной общины.",
     en:"A separation of state and religion, so that there is no official religion and legislation is not derived from one community's religious rules."},
    {he:"חלוקת הסמכות בין מחוקקת, מבצעת ושופטת, כדי שאף רשות לא תרכז את כל הכוח ותפקח על השאר.",
     ar:"تقسيم الصلاحية بين تشريعية وتنفيذية وقضائية، كي لا تُركّز سلطة واحدة كلّ القوة وكي تراقب كلٌّ الأخرى.",
     ru:"Разделение полномочий между законодательной, исполнительной и судебной властью, чтобы ни одна не сосредоточила всю власть и каждая контролировала другие.",
     en:"A division of authority between the legislature, the executive and the judiciary, so that no branch holds all the power and each checks the others."},
    {he:"הפרדה בין השלטון המרכזי לרשויות המקומיות.",
     ar:"فصل بين السلطة المركزية والسلطات المحلية.",
     ru:"Разделение между центральной властью и местным самоуправлением.",
     en:"A separation between central government and local authorities."}],
   2,
   {he:"המטרה היא שאף אחד לא יחזיק את כל הכוח. איך מחלקים אותו כדי שכל צד ירסן את האחר?",
    ar:"الهدف ألا يمسك أحدٌ بكل السلطة. كيف نوزّعها كي يردع كل طرفٍ الآخر؟",
    ru:"Цель - чтобы никто не держал всю власть. Как её разделить, чтобы каждая сторона сдерживала другую?",
    en:"The goal is that no one holds all the power. How can it be divided so each side checks the other?"},
   {he:"ההפרדה אינה נתק: הרשויות מפקחות זו על זו. הכנסת מפקחת על הממשלה, בית המשפט בוחן את חוקיות מעשיה, והממשלה מציעה חוקים. זו מערכת של איזונים ובלמים.",
    ar:"الفصل ليس انفصالًا: السلطات تراقب بعضها. الكنيست تراقب الحكومة، والمحكمة تفحص قانونية أفعالها، والحكومة تقترح القوانين. هذه منظومة ضوابط وتوازنات.",
    ru:"Разделение: не разрыв: власти контролируют друг друга. Кнессет контролирует правительство, суд проверяет законность его действий, правительство предлагает законы. Это система сдержек и противовесов.",
    en:"Separation is not disconnection: the branches check one another. The Knesset supervises the government, the court examines the legality of its acts, and the government proposes laws. This is a system of checks and balances."},
   "branches"),
  Q("pr-1-01",{"he": "מהו עקרון שלטון העם?", "ar": "ما هو مبدأ حكم الشعب؟", "ru": "Что такое принцип народовластия?", "en": "What is the principle of government by the people?"},[{"he": "השלטון שייך למי שנולד במשפחת השליט, והוא עובר בירושה מדור לדור.", "ar": "الحكم لمن وُلد في عائلة الحاكم، ويُورَّث من جيل إلى جيل.", "ru": "Власть принадлежит тому, кто родился в семье правителя, и передаётся по наследству.", "en": "Power belongs to whoever is born into the ruler's family, and it passes down by inheritance."}, {"he": "העם הוא מקור הסמכות של השלטון, והוא בוחר את נציגיו.", "ar": "الشعب هو مصدر صلاحية الحكم، وهو الذي ينتخب ممثّليه.", "ru": "Народ — источник власти правительства, и он избирает своих представителей.", "en": "The people are the source of the government's authority, and they elect their representatives."}, {"he": "השלטון שייך לצבא, מפני שהוא מגן על המדינה ועל גבולותיה מפני כל אויב מבחוץ.", "ar": "الحكم للجيش، لأنه يحمي الدولة وحدودها من كلّ عدوّ خارجيّ.", "ru": "Власть принадлежит армии, потому что она защищает государство и его границы от любого внешнего врага.", "en": "Power belongs to the army, because it protects the state and its borders from every enemy outside."}, {"he": "השלטון שייך לשופטים, כי הם מכירים את החוק.", "ar": "الحكم للقضاة، لأنهم يعرفون القانون.", "ru": "Власть принадлежит судьям, потому что они знают закон.", "en": "Power belongs to the judges, because they know the law."}],1,{"he": "חשבו מאיפה השלטון מקבל את הזכות לשלוט.", "ar": "فكّروا: من أين يحصل الحكم على حقّه في أن يحكم؟", "ru": "Подумайте, откуда власть получает право управлять.", "en": "Think about where the government gets its right to rule."},{"he": "בדמוקרטיה הסמכות באה מהאזרחים. הם בוחרים נציגים לזמן קצוב, ויכולים להחליף אותם בבחירות הבאות. זו גם הסכמת הנשלטים: השלטון חוקי כי הציבור הסכים לו.", "ar": "في الديمقراطية تأتي الصلاحية من المواطنين. فهم ينتخبون ممثّلين لمدّة محدّدة، ويستطيعون تغييرهم في الانتخابات التالية. وهذه هي موافقة المحكومين: الحكم شرعيّ لأنّ الجمهور وافق عليه.", "ru": "В демократии власть исходит от граждан. Они избирают представителей на определённый срок и могут сменить их на следующих выборах. Это и есть согласие управляемых: власть законна, потому что граждане согласились на неё.", "en": "In a democracy, authority comes from the citizens. They elect representatives for a fixed term and can replace them at the next election. This is the consent of the governed: the government is legitimate because the public agreed to it."},null),
  Q("pr-1-02",{"he": "מהו פלורליזם?", "ar": "ما هي التعدّدية؟", "ru": "Что такое плюрализм?", "en": "What is pluralism?"},[{"he": "מצב שבו כל האזרחים חייבים להחזיק באותה דעה.", "ar": "وضع يجب فيه على جميع المواطنين أن يحملوا الرأي نفسه.", "ru": "Положение, при котором все граждане обязаны придерживаться одного мнения.", "en": "A situation in which all citizens must hold the same opinion."}, {"he": "חלוקת הסמכות בין שלוש רשויות השלטון.", "ar": "توزيع الصلاحيات بين سلطات الحكم الثلاث.", "ru": "Распределение полномочий между тремя ветвями власти.", "en": "Dividing authority among the three branches of government."}, {"he": "הכרה בכך שיש בחברה דעות ואורחות חיים שונים, ושלכולם יש מקום לגיטימי.", "ar": "الاعتراف بأنّ في المجتمع آراء وأنماط حياة مختلفة، وأنّ لها جميعًا مكانًا شرعيًّا.", "ru": "Признание того, что в обществе есть разные мнения и образы жизни и у всех них есть законное место.", "en": "Recognising that society has different opinions and ways of life, and that all of them have a legitimate place."}, {"he": "שיטה שבה המדינה מעדיפה תרבות אחת ומעודדת את כל הקבוצות לאמץ אותה, כדי לחזק את האחדות הלאומית.", "ar": "نهج تفضّل فيه الدولة ثقافة واحدة وتشجّع جميع المجموعات على تبنّيها، من أجل تعزيز الوحدة الوطنية.", "ru": "Подход, при котором государство отдаёт предпочтение одной культуре и побуждает все группы принять её, чтобы укрепить национальное единство.", "en": "An approach in which the state prefers one culture and encourages every group to adopt it, to strengthen national unity."}],2,{"he": "המילה באה מהמילה הלטינית \"רבים\".", "ar": "الكلمة مشتقّة من الكلمة اللاتينية التي تعني \"كثيرون\".", "ru": "Слово происходит от латинского слова «многие».", "en": "The word comes from the Latin word for \"many\"."},{"he": "פלורליזם מכיר בריבוי של דעות, אמונות ותרבויות. הוא רואה בשונות דבר לגיטימי, ולא איום. לכן בדמוקרטיה יכולות להתקיים מפלגות, עיתונים וקהילות שונים זה לצד זה.", "ar": "التعدّدية تعترف بتعدّد الآراء والمعتقدات والثقافات. وهي ترى في الاختلاف أمرًا شرعيًّا وليس تهديدًا. لذلك يمكن في الديمقراطية أن توجد أحزاب وصحف وجماعات مختلفة جنبًا إلى جنب.", "ru": "Плюрализм признаёт множество мнений, убеждений и культур. Он считает различия законными, а не угрозой. Поэтому в демократии рядом существуют разные партии, газеты и общины.", "en": "Pluralism recognises many opinions, beliefs and cultures. It sees difference as legitimate, not as a threat. That is why different parties, newspapers and communities can exist side by side in a democracy."},null),
  Q("pr-1-03",{"he": "מהי שקיפות שלטונית?", "ar": "ما هي الشفافية الحكومية؟", "ru": "Что такое прозрачность власти?", "en": "What is government transparency?"},[{"he": "מידע על פעולות השלטון פתוח לציבור, כדי שאפשר יהיה לבקר אותו.", "ar": "المعلومات عن أعمال الحكم مفتوحة للجمهور، كي يمكن انتقادها ومراقبتها.", "ru": "Информация о действиях власти открыта для общества, чтобы её можно было критиковать.", "en": "Information about the government's actions is open to the public, so that it can be scrutinised."}, {"he": "השלטון מחליט בחדרים סגורים, והציבור שומע רק על התוצאה.", "ar": "يتّخذ الحكم قراراته في غرف مغلقة، ولا يسمع الجمهور إلا بالنتيجة.", "ru": "Власть принимает решения за закрытыми дверями, а общество узнаёт только результат.", "en": "The government decides behind closed doors, and the public hears only the result."}, {"he": "השלטון מפרסם רק את ההחלטות שהצליחו, כדי לשמור על אמון הציבור ולמנוע ויכוחים מיותרים בתקשורת.", "ar": "ينشر الحكم القرارات الناجحة فقط، كي يحافظ على ثقة الجمهور ويمنع نقاشات لا داعي لها في الإعلام.", "ru": "Власть публикует только удачные решения, чтобы сохранить доверие общества и избежать лишних споров в СМИ.", "en": "The government publishes only the decisions that succeeded, to keep public trust and avoid needless arguments in the media."}, {"he": "כל אזרח רשאי להשתתף בישיבות הממשלה ולהצביע בהן.", "ar": "يحقّ لكلّ مواطن أن يشارك في جلسات الحكومة وأن يصوّت فيها.", "ru": "Каждый гражданин вправе участвовать в заседаниях правительства и голосовать на них.", "en": "Every citizen may take part in cabinet meetings and vote in them."}],0,{"he": "חשבו על חלון זכוכית: מה רואים דרכו?", "ar": "فكّروا في نافذة زجاجية: ماذا نرى من خلالها؟", "ru": "Представьте стеклянное окно: что сквозь него видно?", "en": "Think of a glass window: what can you see through it?"},{"he": "שקיפות פירושה שהציבור יכול לדעת מה השלטון עושה ולמה. בלי מידע אי אפשר לבקר את השלטון או להחליט בבחירות. בישראל חוק חופש המידע נותן לכל אדם זכות לבקש מידע מרשויות ציבוריות.", "ar": "الشفافية تعني أنّ الجمهور يستطيع أن يعرف ماذا يفعل الحكم ولماذا. فبدون معلومات لا يمكن انتقاد الحكم أو اتّخاذ قرار في الانتخابات. وفي إسرائيل يمنح قانون حرية المعلومات كلّ شخص حقّ طلب المعلومات من السلطات العامّة.", "ru": "Прозрачность означает, что общество может знать, что делает власть и почему. Без информации нельзя критиковать власть или сделать выбор на выборах. В Израиле закон о свободе информации даёт каждому право запрашивать сведения у государственных органов.", "en": "Transparency means the public can know what the government does and why. Without information you cannot criticise the government or decide in an election. In Israel, the Freedom of Information Law gives every person the right to request information from public authorities."},null),
  Q("pr-1-04",{"he": "מהו עקרון הסובלנות?", "ar": "ما هو مبدأ التسامح؟", "ru": "Что такое принцип терпимости?", "en": "What is the principle of tolerance?"},[{"he": "הסכמה עם כל דעה שאדם אחר משמיע.", "ar": "الموافقة على كلّ رأي يقوله شخص آخر.", "ru": "Согласие с любым мнением, которое высказывает другой человек.", "en": "Agreeing with every opinion another person expresses."}, {"he": "איסור על ויכוח ציבורי בנושאים שנויים במחלוקת.", "ar": "منع النقاش العامّ في المواضيع الخلافية.", "ru": "Запрет на публичный спор по спорным вопросам.", "en": "A ban on public debate about controversial issues."}, {"he": "חובה לשתוק כשמישהו משמיע דעה שונה, כדי לא לפגוע ברגשותיו ולא ליצור מתח בין קבוצות בחברה.", "ar": "واجب الصمت عندما يقول أحد رأيًا مختلفًا، كي لا تُجرح مشاعره ولا ينشأ توتّر بين مجموعات المجتمع.", "ru": "Обязанность молчать, когда кто-то высказывает иное мнение, чтобы не задеть его чувства и не создать напряжение между группами общества.", "en": "A duty to stay silent when someone expresses a different opinion, so as not to hurt their feelings or create tension between groups in society."}, {"he": "נכונות לקבל את זכותו של אחר להחזיק בדעה ולחיות בדרך שאינן מקובלות עליי.", "ar": "الاستعداد لقبول حقّ الآخر في أن يحمل رأيًا ويعيش بطريقة لا أقبلهما.", "ru": "Готовность признать право другого иметь мнение и жить так, как мне не нравится.", "en": "Being willing to accept another person's right to hold views and live in ways I do not accept."}],3,{"he": "אפשר לא להסכים עם מישהו, ועדיין לכבד משהו שלו. מה?", "ar": "يمكن ألّا نوافق شخصًا، ومع ذلك نحترم شيئًا عنده. ما هو؟", "ru": "Можно не соглашаться с человеком и всё же уважать что-то, что у него есть. Что?", "en": "You can disagree with someone and still respect something of theirs. What?"},{"he": "סובלנות אינה הסכמה. היא כבוד לזכותו של האחר לחשוב ולחיות אחרת. אני יכול להתווכח איתו, אבל לא לשלול ממנו את הזכות הזאת.", "ar": "التسامح ليس موافقة. إنه احترام حقّ الآخر في أن يفكّر ويعيش بشكل مختلف. أستطيع أن أجادله، لكن لا أن أسلبه هذا الحقّ.", "ru": "Терпимость — это не согласие. Это уважение к праву другого думать и жить иначе. Я могу с ним спорить, но не лишать его этого права.", "en": "Tolerance is not agreement. It is respect for another person's right to think and live differently. I can argue with them, but not take that right away."},null)
 ],
 [ /* רמה 2 — הבנה */
  Q("princ-press",
    {he:"הכנסת חוקקה חוק האוסר על עיתונים לפרסם ביקורת על שר מכהן. איזה עיקרון דמוקרטי נפגע כאן בראש ובראשונה?",
     ar:"سنّت الكنيست قانونًا يمنع الصحف من نشر انتقاد لوزير في منصبه. أيّ مبدأ ديمقراطيّ يُمَسّ هنا أولًا؟",
     ru:"Кнессет принял закон, запрещающий газетам критиковать действующего министра. Какой демократический принцип нарушается здесь в первую очередь?",
     en:"The Knesset passed a law forbidding newspapers to criticise a serving minister. Which democratic principle is breached here first of all?"},
   [{he:"עקרון הפדרליזם, שלפיו סמכויות השלטון מחולקות בין השלטון המרכזי לאזורים.",
     ar:"مبدأ الفدرالية، الذي تُقسَّم بموجبه صلاحيات الحكم بين السلطة المركزية والأقاليم.",
     ru:"Принцип федерализма, по которому полномочия власти делятся между центром и регионами.",
     en:"The federal principle, under which powers are divided between central government and the regions."},
    {he:"חופש הביטוי, ובתוכו חופש העיתונות והביקורת על השלטון.",
     ar:"حرية التعبير، وفي صلبها حرية الصحافة ونقد السلطة.",
     ru:"Свобода выражения, а в её сердцевине: свобода печати и критики власти.",
     en:"Freedom of expression, and within it the freedom of the press to criticise those in power."},
    {he:"עקרון חשאיות הבחירות.",ar:"مبدأ سرّية الانتخابات.",ru:"Принцип тайного голосования.",en:"The principle of the secret ballot."},
    {he:"עקרון החסינות הפרלמנטרית, שנועד להגן על נבחרי הציבור מפני פרסומים שעלולים לשבש את עבודתם.",
     ar:"مبدأ الحصانة البرلمانية، الذي وُضع لحماية منتخَبي الجمهور من منشورات قد تعرقل عملهم.",
     ru:"Принцип парламентской неприкосновенности, призванный защитить избранников от публикаций, способных помешать их работе.",
     en:"The principle of parliamentary immunity, meant to shield elected officials from publications that might disrupt their work."}],
   1,
   {he:"שאלו מה האזרח מפסיד כשאסור לפרסם — ולא מה השר מרוויח.",
    ar:"اسألوا ماذا يخسر المواطن حين يُمنع النشر، لا ماذا يربح الوزير.",
    ru:"Спросите, что теряет гражданин, когда публиковать запрещено, а не что выигрывает министр.",
    en:"Ask what the citizen loses when publication is forbidden, not what the minister gains."},
   {he:"חופש הביטוי אינו רק זכות של העיתון. הוא התנאי לבחירה מודעת: אזרח שאינו יודע מה עשה השר אינו יכול להחליט אם לבחור בו שוב. לכן ביקורת על השלטון היא הליבה המוגנת ביותר של חופש הביטוי.",
    ar:"حرية التعبير ليست حقّ الصحيفة فحسب، بل شرط الاختيار الواعي: مواطن لا يعرف ما فعله الوزير لا يستطيع أن يقرّر إن كان سينتخبه ثانية. لذلك نقد السلطة هو اللبّ الأكثر حماية في حرية التعبير.",
    ru:"Свобода выражения: не только право газеты. Это условие осознанного выбора: гражданин, не знающий, что сделал министр, не может решить, избирать ли его снова. Поэтому критика власти: самое защищённое ядро свободы слова.",
    en:"Freedom of expression is not only the newspaper's right. It is the condition for an informed choice: a citizen who does not know what the minister did cannot decide whether to elect him again. That is why criticism of those in power is the most protected core of free expression."},
   null),
  Q("princ-nocase",
    {he:"שר הורה למשטרה שלא לחקור חשד לשוחד נגד חבר מפלגתו. איזה עיקרון הופר?",
     ar:"أمر وزيرٌ الشرطةَ بعدم التحقيق في شبهة رشوة ضدّ زميله في الحزب. أيّ مبدأ خُرق؟",
     ru:"Министр приказал полиции не расследовать подозрение во взятке против однопартийца. Какой принцип нарушен?",
     en:"A minister ordered the police not to investigate a bribery suspicion against a member of his own party. Which principle was breached?"},
   [{he:"שלטון החוק ושוויון בפני החוק — החוק חל על כולם באותה מידה.",
     ar:"سيادة القانون والمساواة أمامه، القانون يسري على الجميع بالقدر ذاته.",
     ru:"Верховенство закона и равенство перед ним: закон одинаково распространяется на всех.",
     en:"The rule of law and equality before it: the law applies to everyone alike."},
    {he:"עקרון הכרעת הרוב — הציבור בחר בשר, ולכן הוא שמחליט אילו חקירות ייפתחו ואילו ייסגרו.",
     ar:"مبدأ حكم الأغلبية، الجمهور انتخب الوزير، ولذلك هو مَن يقرّر أيّ التحقيقات تُفتح وأيّها تُغلق.",
     ru:"Принцип решения большинства: общество избрало министра, поэтому именно он решает, какие расследования открывать, а какие закрывать.",
     en:"Majority rule: the public elected the minister, so he is the one who decides which investigations are opened and which are closed."},
    {he:"עקרון הבחירות היחסיות, המחייב שכל מפלגה תיוצג גם בגופי האכיפה.",
     ar:"مبدأ الانتخابات النسبية، الذي يوجب تمثيل كلّ حزب أيضًا في أجهزة إنفاذ القانون.",
     ru:"Принцип пропорциональных выборов, требующий представительства каждой партии и в органах правопорядка.",
     en:"The principle of proportional elections, which requires every party to be represented in law-enforcement bodies too."},
    {he:"עקרון חופש התנועה של חשודים בהליך פלילי.",
     ar:"مبدأ حرية التنقّل للمشتبه بهم في إجراء جنائيّ.",
     ru:"Принцип свободы передвижения подозреваемых в уголовном деле.",
     en:"The freedom of movement of suspects in criminal proceedings."}],
   0,
   {he:"התשובה נמצאת בשאלה מי פטור כאן מהחוק, ולמה.",
    ar:"الجواب في السؤال: مَن أُعفي هنا من القانون، ولماذا.",
    ru:"Ответ в вопросе: кто здесь освобождён от закона и почему.",
    en:"The answer lies in asking who is exempted from the law here, and why."},
   {he:"מי שנחקר או לא נחקר לפי שיוכו הפוליטי הופך את החוק לכלי בידי השלטון. עצמאות אכיפת החוק — משטרה ופרקליטות שאינן כפופות לשיקול פוליטי בתיק מסוים — היא הביטוי המעשי של שלטון החוק.",
    ar:"حين يُحقَّق مع أحد أو لا يُحقَّق بحسب انتمائه السياسيّ، يتحوّل القانون أداة بيد السلطة. استقلال إنفاذ القانون، شرطة ونيابة لا تخضعان لاعتبار سياسيّ في ملفّ بعينه، هو التعبير العمليّ عن سيادة القانون.",
    ru:"Когда расследуют или не расследуют по политической принадлежности, закон становится инструментом власти. Независимость правоприменения: полиция и прокуратура, не подчинённые политическому расчёту в конкретном деле, это практическое выражение верховенства закона.",
    en:"When someone is investigated, or not, according to political affiliation, the law becomes a tool in the government's hands. Independent law enforcement: police and prosecutors not subject to political calculation in a given file: is the practical expression of the rule of law."},
   null),
  Q("princ-cand",
    {he:"ועדת הבחירות ביקשה לפסול מועמד משום שדעותיו הכלכליות אינן מקובלות על רוב חבריה. מדוע פסילה כזאת אינה דמוקרטית?",
     ar:"طلبت لجنة الانتخابات شطب مرشّح لأن آراءه الاقتصادية لا تروق لأغلبية أعضائها. لماذا هذا الشطب غير ديمقراطيّ؟",
     ru:"Избирательная комиссия захотела снять кандидата, потому что его экономические взгляды не нравятся большинству её членов. Почему такое снятие недемократично?",
     en:"The elections committee sought to disqualify a candidate because most of its members dislike his economic views. Why is such a disqualification undemocratic?"},
   [{he:"מפני שרק בית המשפט העליון מוסמך לפסול מועמד, וועדת הבחירות רשאית רק להמליץ לפניו על פסילה.",
     ar:"لأنّ المحكمة العليا وحدها مخوّلة بشطب مرشّح، ولجنة الانتخابات لا تملك سوى التوصية أمامها بالشطب.",
     ru:"Потому что только Верховный суд вправе снять кандидата, а избирательная комиссия может лишь рекомендовать ему такое решение.",
     en:"Because only the Supreme Court may disqualify a candidate, and the elections committee may merely recommend disqualification to it."},
    {he:"מפני שפסילה מותרת רק בשנת בחירות.",
     ar:"لأن الشطب جائز في سنة انتخابات فقط.",
     ru:"Потому что снятие допустимо только в год выборов.",
     en:"Because disqualification is allowed only in an election year."},
    {he:"מפני שהיא פוגעת בזכות להיבחר ובפלורליזם: הציבור, ולא ועדה, מחליט אם דעה מקובלת עליו.",
     ar:"لأنه يمسّ حقّ الترشّح والتعدّدية: الجمهور، لا لجنة، يقرّر إن كان الرأي مقبولًا عليه.",
     ru:"Потому что оно нарушает право быть избранным и плюрализм: приемлемость взглядов решает общество, а не комиссия.",
     en:"Because it harms the right to stand for election and pluralism: the public, not a committee, decides whether it accepts a view."},
    {he:"מפני שהמועמד לא הגיש את מצעו במועד שקבעה ועדת הבחירות, ופסילה מטעם זה מחייבת שימוע מוקדם.",
     ar:"لأنّ المرشّح لم يقدّم برنامجه في الموعد الذي حدّدته لجنة الانتخابات، والشطب لهذا السبب يستوجب جلسة استماع مسبقة.",
     ru:"Потому что кандидат не подал программу в срок, установленный избирательной комиссией, а снятие по такой причине требует предварительного слушания.",
     en:"Because the candidate did not file his platform by the date the elections committee set, and disqualification on that ground requires a prior hearing."}],
   2,
   {he:"מי אמור להכריע אם דעה ראויה — ועדה או המצביעים?",
    ar:"مَن يُفترض أن يقرّر إن كان الرأي جديرًا، لجنة أم الناخبون؟",
    ru:"Кто должен решать, достоин ли взгляд, комиссия или избиратели?",
    en:"Who is supposed to decide whether a view is worthy: a committee, or the voters?"},
   {he:"בישראל אפשר לפסול רשימה או מועמד רק בעילות מצומצמות הקבועות בחוק — שלילת קיום המדינה כיהודית ודמוקרטית, הסתה לגזענות, ותמיכה במאבק מזוין נגד המדינה — ובאישור בית המשפט העליון. דעה כלכלית אינה עילה.",
    ar:"في إسرائيل لا يجوز شطب قائمة أو مرشّح إلا بأسباب محصورة يحدّدها القانون، نفي وجود الدولة كيهودية وديمقراطية، التحريض على العنصرية، ودعم كفاح مسلّح ضدّ الدولة، وبمصادقة المحكمة العليا. الرأي الاقتصاديّ ليس سببًا.",
    ru:"В Израиле список или кандидата можно снять лишь по узким основаниям, установленным законом, отрицание существования государства как еврейского и демократического, подстрекательство к расизму и поддержка вооружённой борьбы против государства, и с утверждения Верховного суда. Экономические взгляды основанием не являются.",
    en:"In Israel a list or a candidate may be disqualified only on narrow statutory grounds: denying the state's existence as Jewish and democratic, incitement to racism, and support for armed struggle against the state, and with the Supreme Court's approval. An economic view is not a ground."},
   null),
  Q("pr-2-01",{"he": "שר נדרש להופיע בוועדה של הכנסת ולהסביר מדוע פרויקט שבאחריותו נכשל. איזה עיקרון בא כאן לידי ביטוי?", "ar": "طُلب من وزير أن يمثل أمام لجنة في الكنيست ويشرح لماذا فشل مشروع تحت مسؤوليته. أيّ مبدأ يتجلّى هنا؟", "ru": "Министра вызвали в комиссию Кнессета, чтобы он объяснил, почему провалился проект, за который он отвечает. Какой принцип здесь проявляется?", "en": "A minister is required to appear before a Knesset committee and explain why a project under his responsibility failed. Which principle is expressed here?"},[{"he": "אחריותיות — השלטון חייב לתת דין וחשבון על מעשיו.", "ar": "المساءلة — على الحكم أن يقدّم حسابًا عن أعماله.", "ru": "Подотчётность — власть обязана отчитываться за свои действия.", "en": "Accountability — the government must answer for its actions."}, {"he": "הכרעת הרוב — הוועדה מצביעה אם השר צדק.", "ar": "حكم الأغلبية — تصوّت اللجنة هل كان الوزير على حقّ.", "ru": "Решение большинства — комиссия голосует, прав ли министр.", "en": "Majority rule — the committee votes on whether the minister was right."}, {"he": "חסינות — השר מוגן מפני ביקורת על החלטות שקיבל בתפקידו, ולכן ההופעה בוועדה היא רשות בלבד.", "ar": "الحصانة — الوزير محميّ من النقد على قرارات اتّخذها في منصبه، ولذلك فالمثول أمام اللجنة اختياريّ فقط.", "ru": "Иммунитет — министр защищён от критики за решения, принятые на посту, поэтому явка в комиссию — лишь по желанию.", "en": "Immunity — the minister is protected from criticism of decisions made in office, so appearing before the committee is only optional."}, {"he": "פלורליזם — לכל חבר בוועדה יש דעה אחרת.", "ar": "التعدّدية — لكلّ عضو في اللجنة رأي مختلف.", "ru": "Плюрализм — у каждого члена комиссии своё мнение.", "en": "Pluralism — every committee member has a different opinion."}],0,{"he": "מי שקיבל כוח מהציבור צריך גם להסביר לציבור. איך קוראים לזה?", "ar": "من حصل على قوّة من الجمهور عليه أن يشرح للجمهور أيضًا. ماذا نسمّي ذلك؟", "ru": "Тот, кто получил власть от общества, должен и объясняться перед ним. Как это называется?", "en": "Whoever gets power from the public must also explain themselves to the public. What is that called?"},{"he": "אחריותיות פירושה שבעלי תפקיד חייבים להסביר את מעשיהם ולשאת בתוצאות. הכנסת מפקחת על הממשלה, למשל בוועדות ובשאילתות. כך הציבור יודע מי אחראי למה.", "ar": "المساءلة تعني أنّ أصحاب المناصب ملزَمون بشرح أعمالهم وتحمّل نتائجها. والكنيست يراقب الحكومة، مثلًا في اللجان وفي الاستجوابات. وهكذا يعرف الجمهور من المسؤول عن ماذا.", "ru": "Подотчётность означает, что должностные лица обязаны объяснять свои действия и отвечать за последствия. Кнессет контролирует правительство, например через комиссии и депутатские запросы. Так общество знает, кто за что отвечает.", "en": "Accountability means officials must explain their actions and bear the results. The Knesset oversees the government, for example through committees and parliamentary questions. This way the public knows who is responsible for what."},null),
  Q("pr-2-02",{"he": "מועצת עיר החליטה ברוב קולות לאסור על קבוצת מיעוט לקיים טקסים דתיים בעיר. מה נכון לומר?", "ar": "قرّر مجلس بلدية بأغلبية الأصوات منع مجموعة أقلية من إقامة شعائر دينية في المدينة. ما الصحيح؟", "ru": "Городской совет большинством голосов запретил группе меньшинства проводить религиозные обряды в городе. Что верно?", "en": "A city council decided by a majority vote to ban a minority group from holding religious ceremonies in the city. What is correct?"},[{"he": "ההחלטה תקינה, כי היא התקבלה ברוב קולות ובהליך שנקבע בחוק, ולכן גם המיעוט חייב לקבל אותה בלי ערעור.", "ar": "القرار سليم، لأنه اتُّخذ بأغلبية الأصوات وبالإجراء الذي حدّده القانون، ولذلك على الأقلية أيضًا أن تقبله دون اعتراض.", "ru": "Решение правомерно, потому что принято большинством голосов и по установленной законом процедуре, поэтому меньшинство обязано принять его без обжалования.", "en": "The decision is valid, because it passed by a majority vote and by the procedure set in law, so the minority must accept it without appeal."}, {"he": "ההחלטה פסולה: הכרעת רוב אינה יכולה לשלול מהמיעוט זכויות יסוד, כמו חופש הדת.", "ar": "القرار باطل: حكم الأغلبية لا يستطيع أن يسلب الأقلية حقوقها الأساسية، مثل حرية الدين.", "ru": "Решение недопустимо: решение большинства не может лишить меньшинство основных прав, таких как свобода религии.", "en": "The decision is invalid: majority rule cannot take basic rights, such as freedom of religion, away from the minority."}, {"he": "ההחלטה תקינה רק אם המיעוט קטן מעשרה אחוזים מתושבי העיר.", "ar": "القرار سليم فقط إذا كانت الأقلية أقلّ من عشرة بالمئة من سكّان المدينة.", "ru": "Решение правомерно, только если меньшинство составляет меньше десяти процентов жителей города.", "en": "The decision is valid only if the minority is less than ten percent of the city's residents."}, {"he": "ההחלטה פסולה, כי מועצת עיר אינה רשאית להצביע על שום נושא.", "ar": "القرار باطل، لأنّ مجلس البلدية لا يحقّ له التصويت على أيّ موضوع.", "ru": "Решение недопустимо, потому что городской совет вообще не вправе голосовать ни по какому вопросу.", "en": "The decision is invalid, because a city council may not vote on any issue at all."}],1,{"he": "הרוב מחליט הרבה דברים. האם יש דברים שגם הוא לא יכול לקחת?", "ar": "الأغلبية تقرّر أمورًا كثيرة. هل هناك أمور لا تستطيع حتى هي أن تأخذها؟", "ru": "Большинство решает многое. Есть ли то, что даже оно не может отнять?", "en": "The majority decides many things. Is there anything even it cannot take away?"},{"he": "הכרעת הרוב היא דרך להחליט, לא רשות לפגוע. זכויות יסוד של המיעוט מוגנות גם מפני רוב גדול. מועצה רשאית להסדיר שעות או מקום, אבל לא לאסור על קבוצה לקיים את דתה.", "ar": "حكم الأغلبية طريقة لاتّخاذ القرار، لا إذن بالإيذاء. فالحقوق الأساسية للأقلية محميّة حتى من أغلبية كبيرة. يحقّ للمجلس أن ينظّم الأوقات أو المكان، لكن لا أن يمنع مجموعة من ممارسة دينها.", "ru": "Решение большинства — это способ принимать решения, а не разрешение причинять вред. Основные права меньшинства защищены даже от большого большинства. Совет может регулировать время или место, но не запрещать группе исповедовать свою религию.", "en": "Majority rule is a way to decide, not a licence to harm. The minority's basic rights are protected even from a large majority. A council may regulate times or places, but not ban a group from practising its religion."},null),
  Q("pr-2-03",{"he": "ראש ממשלה מציע לבטל את הבחירות הבאות ולהמשיך לכהן בלי הגבלת זמן. איזה עיקרון נפגע בעיקר?", "ar": "يقترح رئيس حكومة إلغاء الانتخابات القادمة والاستمرار في منصبه دون حدّ زمنيّ. أيّ مبدأ يتضرّر بالأساس؟", "ru": "Премьер-министр предлагает отменить следующие выборы и оставаться у власти без ограничения срока. Какой принцип нарушается прежде всего?", "en": "A prime minister proposes cancelling the next election and staying in office with no time limit. Which principle is mainly harmed?"},[{"he": "עקרון הסובלנות, כי ראש הממשלה אינו מוכן לשמוע ביקורת אישית.", "ar": "مبدأ التسامح، لأنّ رئيس الحكومة غير مستعدّ لسماع نقد شخصيّ.", "ru": "Принцип терпимости, потому что премьер-министр не готов слушать личную критику.", "en": "The principle of tolerance, because the prime minister will not listen to personal criticism."}, {"he": "עקרון השקיפות, כי ההצעה לא פורסמה לציבור לפני הדיון בה.", "ar": "مبدأ الشفافية، لأنّ الاقتراح لم يُنشر للجمهور قبل مناقشته.", "ru": "Принцип прозрачности, потому что предложение не опубликовали до обсуждения.", "en": "The principle of transparency, because the proposal was not published before it was discussed."}, {"he": "הגבלת השלטון: השלטון ניתן לזמן קצוב, והעם מחדש אותו בבחירות.", "ar": "تقييد الحكم: يُمنح الحكم لمدّة محدّدة، والشعب يجدّده في الانتخابات.", "ru": "Ограничение власти: власть даётся на определённый срок, и народ обновляет её на выборах.", "en": "Limited government: power is given for a fixed term, and the people renew it in elections."}, {"he": "שום עיקרון אינו נפגע, אם ראש הממשלה זוכה לתמיכה רחבה בסקרים ובהפגנות של תומכיו ברחבי הארץ.", "ar": "لا يتضرّر أيّ مبدأ، إذا كان رئيس الحكومة يحظى بتأييد واسع في الاستطلاعات وفي مظاهرات مؤيّديه في أنحاء البلاد.", "ru": "Никакой принцип не нарушается, если премьер-министра широко поддерживают в опросах и на демонстрациях сторонников по всей стране.", "en": "No principle is harmed, if the prime minister has wide support in polls and in rallies of supporters across the country."}],2,{"he": "מה מבטיח שהציבור יוכל להחליף את מי שמחזיק בכוח?", "ar": "ما الذي يضمن أن يستطيع الجمهور تغيير من يمسك بالقوّة؟", "ru": "Что гарантирует, что общество сможет сменить того, у кого власть?", "en": "What ensures the public can replace whoever holds power?"},{"he": "בדמוקרטיה השלטון מוגבל בזמן ובסמכויות. בחירות תקופתיות מחייבות את השלטון לחזור לציבור ולבקש אמון מחדש. סקר או הפגנה אינם תחליף לבחירות.", "ar": "في الديمقراطية يكون الحكم مقيّدًا بالزمن وبالصلاحيات. والانتخابات الدورية تُلزم الحكم بالعودة إلى الجمهور وطلب الثقة من جديد. الاستطلاع أو المظاهرة ليسا بديلًا عن الانتخابات.", "ru": "В демократии власть ограничена во времени и в полномочиях. Периодические выборы заставляют власть снова обращаться к обществу за доверием. Опрос или демонстрация не заменяют выборы.", "en": "In a democracy, power is limited in time and in authority. Periodic elections force the government to return to the public and ask for trust again. A poll or a rally is no substitute for an election."},null),
  Q("pr-2-04",{"he": "שתי מפלגות חלוקות בחריפות בנושא כלכלי. שתיהן מקבלות את תוצאות הבחירות ופותרות את המחלוקת בדרכי שלום. איזה עיקרון מתבטא כאן?", "ar": "حزبان مختلفان بشدّة في قضية اقتصادية. كلاهما يقبل نتائج الانتخابات ويحلّ الخلاف بالطرق السلمية. أيّ مبدأ يتجلّى هنا؟", "ru": "Две партии резко расходятся по экономическому вопросу. Обе принимают итоги выборов и решают спор мирным путём. Какой принцип здесь проявляется?", "en": "Two parties strongly disagree on an economic issue. Both accept the election results and settle the dispute peacefully. Which principle is expressed here?"},[{"he": "פלורליזם — כל המפלגות חייבות להגיע לאותה מדיניות.", "ar": "التعدّدية — على جميع الأحزاب أن تصل إلى السياسة نفسها.", "ru": "Плюрализм — все партии обязаны прийти к одной и той же политике.", "en": "Pluralism — all parties must arrive at the same policy."}, {"he": "הפרדת רשויות — כל מפלגה שולטת ברשות אחרת.", "ar": "الفصل بين السلطات — كلّ حزب يسيطر على سلطة مختلفة.", "ru": "Разделение властей — каждая партия управляет своей ветвью власти.", "en": "Separation of powers — each party controls a different branch."}, {"he": "שלטון החוק — המפלגות מצייתות לבית המשפט, ולכן אינן רשאיות להתווכח זו עם זו בפומבי ובתקשורת.", "ar": "سيادة القانون — الأحزاب تطيع المحكمة، ولذلك لا يحقّ لها أن تتجادل علنًا وفي الإعلام.", "ru": "Верховенство закона — партии подчиняются суду, поэтому им нельзя спорить друг с другом публично и в СМИ.", "en": "The rule of law — the parties obey the court, so they may not argue with each other in public or in the media."}, {"he": "הסכמיות — הסכמה על כללי המשחק, גם כשיש מחלוקת על התוכן.", "ar": "التوافقية — الاتّفاق على قواعد اللعبة، حتى عندما يوجد خلاف على المضمون.", "ru": "Согласие — договорённость о правилах игры, даже когда есть спор о содержании.", "en": "Consensus — agreement on the rules of the game, even when there is disagreement about content."}],3,{"he": "הן לא מסכימות על הפתרון. על מה בכל זאת הן מסכימות?", "ar": "هما لا يتّفقان على الحلّ. على ماذا يتّفقان مع ذلك؟", "ru": "Они не согласны в решении. О чём же они всё-таки договорились?", "en": "They do not agree on the solution. What do they still agree on?"},{"he": "דמוקרטיה אינה דורשת שכולם יסכימו על הכול. היא דורשת הסכמה על הדרך: בחירות, חוק ופתרון מחלוקות בלי אלימות. זה עקרון ההסכמיות.", "ar": "الديمقراطية لا تطلب أن يتّفق الجميع على كلّ شيء. إنها تطلب الاتّفاق على الطريق: الانتخابات، والقانون، وحلّ الخلافات دون عنف. هذا هو مبدأ التوافقية.", "ru": "Демократия не требует, чтобы все соглашались во всём. Она требует согласия о пути: выборы, закон и решение споров без насилия. Это принцип согласия.", "en": "Democracy does not require everyone to agree on everything. It requires agreement on the way: elections, law, and settling disputes without violence. This is the principle of consensus."},null)

 [ /* רמה 3 — ניתוח */
  Q("princ-demo",
    {he:"הפגנה גדולה חוסמת כביש ראשי לשלוש שעות. איזה איזון נדרש כאן, ומה הכלל המנחה?",
     ar:"مظاهرة كبيرة تُغلق شارعًا رئيسيًّا ثلاث ساعات. أيّ موازنة مطلوبة هنا، وما القاعدة الموجِّهة؟",
     ru:"Крупная демонстрация перекрывает главную дорогу на три часа. Какое равновесие требуется здесь и каково руководящее правило?",
     en:"A large demonstration blocks a main road for three hours. What balance is required here, and what is the guiding rule?"},
   [{he:"אין כאן איזון: חופש ההפגנה מוחלט, ואין להגבילו בשום מצב.",
     ar:"لا موازنة هنا: حرية التظاهر مطلقة ولا تُقيَّد بأيّ حال.",
     ru:"Здесь нет равновесия: свобода демонстраций абсолютна и не ограничивается никогда.",
     en:"There is no balance here: the freedom to demonstrate is absolute and may never be limited."},
    {he:"אין כאן איזון אלא ספירה — חופש התנועה של אלפי נהגים גובר על חופש ההפגנה של מאות מפגינים, ולכן די בכך שהכביש ראשי כדי לאסור בו הפגנה, בלי בחינה נוספת.",
     ar:"لا توازن هنا بل إحصاء، حرية تنقّل آلاف السائقين تتغلّب على حرية تظاهر مئات المتظاهرين، ولذلك يكفي أن يكون الشارع رئيسيًّا كي يُمنع التظاهر فيه، دون فحص إضافيّ.",
     ru:"Здесь не баланс, а подсчёт: свобода передвижения тысяч водителей перевешивает свободу демонстрации сотен участников, и потому достаточно того, что дорога главная, чтобы запретить на ней демонстрацию без дальнейшей проверки.",
     en:"There is no balance here but a count: the freedom of movement of thousands of drivers outweighs the protest rights of hundreds, so the road being a main road is reason enough to ban the demonstration, with no further examination."},
    {he:"איזון בין חופש ההפגנה לחופש התנועה. מגבילים במידה — מסלול, שעה ומשך — ולא אוסרים כליל, כי הגבלה חייבת להיות המצומצמת ביותר שמשיגה את התכלית.",
     ar:"موازنة بين حرية التظاهر وحرية التنقّل. يُقيَّد بالقدر المناسب، مسار وساعة ومدّة، ولا يُمنع كليًّا، لأن التقييد يجب أن يكون الأضيق الذي يحقّق الغاية.",
     ru:"Равновесие между свободой демонстраций и свободой передвижения. Ограничивают соразмерно: маршрут, время, длительность, а не запрещают вовсе, ибо ограничение должно быть наименьшим из достигающих цели.",
     en:"A balance between the freedom to demonstrate and the freedom of movement. You limit proportionately: route, hour, duration: rather than ban outright, because a limit must be the narrowest one that achieves the purpose."},
    {he:"האיזון נקבע לפי מספר המפגינים: הפגנה גדולה גוברת תמיד.",
     ar:"تُحسم الموازنة بعدد المتظاهرين: المظاهرة الكبيرة تتفوّق دائمًا.",
     ru:"Равновесие определяется числом демонстрантов: большая демонстрация всегда важнее.",
     en:"The balance is decided by the number of demonstrators: a large demonstration always prevails."}],
   2,
   {he:"שתי זכויות מתנגשות. חפשו את התשובה שמצמצמת פגיעה במקום לבטל זכות.",
    ar:"حقّان يتصادمان. ابحثوا عن الجواب الذي يقلّل المساس بدل أن يلغي حقًّا.",
    ru:"Сталкиваются два права. Ищите ответ, который уменьшает ущерб, а не отменяет право.",
    en:"Two rights collide. Look for the answer that narrows the harm instead of cancelling a right."},
   {he:"זכויות אינן מוחלטות והן מתנגשות זו בזו. מבחן המידתיות שואל שלוש שאלות: האם האמצעי מתאים לתכלית, האם הוא הפוגעני פחות מבין האפשריים, והאם התועלת עולה על הנזק. איסור גורף נכשל בשאלה השנייה.",
    ar:"الحقوق ليست مطلقة وهي تتصادم. اختبار التناسب يسأل ثلاثة أسئلة: هل الوسيلة ملائمة للغاية، وهل هي الأقلّ مساسًا بين الممكن، وهل الفائدة تفوق الضرر. المنع الشامل يفشل في السؤال الثاني.",
    ru:"Права не абсолютны и сталкиваются друг с другом. Проверка соразмерности задаёт три вопроса: подходит ли средство цели, наименее ли оно ущемляющее из возможных, и превышает ли польза вред. Сплошной запрет проваливает второй вопрос.",
    en:"Rights are not absolute, and they collide. The proportionality test asks three questions: is the measure suited to the purpose, is it the least harmful available, and does the benefit outweigh the damage. A blanket ban fails the second."},
   null),
  Q("princ-emerg",
    {he:"ממשלה מבקשת להאריך שוב ושוב מצב חירום, ולהשתמש בו כדי לחוקק בתקנות שעת חירום במקום בחוק. מהי הבעיה הדמוקרטית העיקרית?",
     ar:"تطلب حكومة تمديد حالة الطوارئ مرارًا، واستخدامها للتشريع بأنظمة طوارئ بدل قانون. ما المشكلة الديمقراطية الأساسية؟",
     ru:"Правительство раз за разом продлевает чрезвычайное положение и использует его, чтобы издавать чрезвычайные постановления вместо законов. В чём главная демократическая проблема?",
     en:"A government repeatedly extends a state of emergency and uses it to legislate by emergency regulations instead of by statute. What is the main democratic problem?"},
   [{he:"אין בעיה — מצב החירום מוכרז בידי הכנסת ומוארך רק באישורה, ולכן הפיקוח הפרלמנטרי נשמר גם כשהממשלה מחוקקת בתקנות, והכנסת יכולה לבטלן בכל עת.",
     ar:"لا مشكلة، حالة الطوارئ تُعلنها الكنيست ولا تُمدَّد إلّا بمصادقتها، ولذلك تبقى الرقابة البرلمانية قائمة حتى حين تشرّع الحكومة بلوائح، وبإمكان الكنيست إلغاؤها في أيّ وقت.",
     ru:"Проблемы нет: чрезвычайное положение объявляет Кнессет и продлевает только с его согласия, поэтому парламентский контроль сохраняется и тогда, когда правительство издаёт постановления, а Кнессет может их отменить в любой момент.",
     en:"There is no problem: the state of emergency is declared by the Knesset and extended only with its approval, so parliamentary oversight survives even when the government legislates by regulation, and the Knesset can repeal those regulations at any time."},
    {he:"הבעיה תקציבית בעיקרה: תקנות שעת חירום מחייבות הוצאה מיידית בלי אישור ועדת הכספים, והכנסת מאבדת את הפיקוח על ההוצאה הציבורית.",
     ar:"المشكلة ميزانياتية أساسًا: لوائح الطوارئ تفرض إنفاقًا فوريًّا دون مصادقة لجنة المالية، فتفقد الكنيست رقابتها على الإنفاق العامّ.",
     ru:"Проблема прежде всего бюджетная: чрезвычайные постановления требуют немедленных расходов без утверждения финансовой комиссии, и Кнессет теряет контроль над публичными тратами.",
     en:"The problem is mainly budgetary: emergency regulations force immediate spending without the finance committee's approval, and the Knesset loses its control over public expenditure."},
    {he:"הרשות המבצעת נוטלת לעצמה סמכות חקיקה, והפיקוח של הכנסת ושל בית המשפט נחלש — כלומר הפרדת הרשויות נשחקת מבלי שהוכרז על כך.",
     ar:"السلطة التنفيذية تنتزع صلاحية التشريع، فتضعف رقابة الكنيست والمحكمة، أي أن الفصل بين السلطات يتآكل دون إعلان.",
     ru:"Исполнительная власть присваивает законодательные полномочия, а контроль Кнессета и суда слабеет: то есть разделение властей размывается без всякого объявления.",
     en:"The executive takes legislative power for itself and the oversight of the Knesset and the courts weakens: the separation of powers is eroded without anyone declaring it."},
    {he:"הבעיה היא שתקנות חירום אינן מתפרסמות ברשומות.",
     ar:"المشكلة أن أنظمة الطوارئ لا تُنشر في الجريدة الرسمية.",
     ru:"Проблема в том, что чрезвычайные постановления не публикуются в официальном вестнике.",
     en:"The problem is that emergency regulations are not published in the official gazette."}],
   2,
   {he:"מי אמור לחוקק, ומי חוקק כאן בפועל?",
    ar:"مَن يُفترض أن يشرّع، ومَن يشرّع هنا فعليًّا؟",
    ru:"Кто должен издавать законы и кто издаёт их здесь на деле?",
    en:"Who is supposed to legislate, and who is actually legislating here?"},
   {he:"מצב חירום נועד לאירוע חריג וקצר. הארכה קבועה הופכת את החריג לשגרה, ומעבירה כוח מהכנסת לממשלה בלי בחירות ובלי דיון פומבי. ההגנה הדמוקרטית היא הגבלת המשך בזמן, ביקורת שיפוטית, ואישור מחודש של הכנסת.",
    ar:"حالة الطوارئ وُضعت لحدث استثنائيّ قصير. التمديد الدائم يحوّل الاستثناء إلى قاعدة، وينقل القوة من الكنيست إلى الحكومة بلا انتخابات وبلا نقاش علنيّ. الحماية الديمقراطية هي تحديد المدّة، والرقابة القضائية، ومصادقة الكنيست المتجدّدة.",
    ru:"Чрезвычайное положение рассчитано на исключительное и краткое событие. Постоянное продление превращает исключение в норму и передаёт власть от Кнессета правительству без выборов и без публичного обсуждения. Демократическая защита: это срок, судебный контроль и повторное утверждение Кнессетом.",
    en:"A state of emergency is meant for a short, exceptional event. Permanent extension turns the exception into the norm and moves power from the Knesset to the government without an election and without public debate. The democratic safeguard is a time limit, judicial review, and renewed Knesset approval."},
   null),
  Q("princ-tyranny",
    {he:"מהי “עריצות הרוב”, ומהו הבלם המרכזי מפניה במשטר דמוקרטי?",
     ar:"ما هي “استبداد الأغلبية”، وما الكابح المركزيّ ضدّها في نظام ديمقراطيّ؟",
     ru:"Что такое «тирания большинства» и каков главный тормоз против неё в демократическом строе?",
     en:"What is “tyranny of the majority”, and what is the main brake against it in a democracy?"},
   [{he:"מצב שבו הרוב מנצל את כוחו כדי לשלול זכויות מן המיעוט. הבלם המרכזי הוא זכויות אדם מעוגנות וביקורת שיפוטית עליהן.",
     ar:"وضع تستغلّ فيه الأغلبية قوّتها لسلب حقوق الأقلية. الكابح المركزيّ حقوق إنسان مرسّخة ورقابة قضائية عليها.",
     ru:"Положение, при котором большинство пользуется своей силой, чтобы лишить меньшинство прав. Главный тормоз: закреплённые права человека и судебный контроль над ними.",
     en:"A situation in which the majority uses its power to strip the minority of rights. The main brake is entrenched human rights and judicial review of them."},
    {he:"מצב שבו המיעוט חוסם את הרוב בעזרת עתירות לבית המשפט ובעזרת כוח מיקוח קואליציוני. הבלם המרכזי הוא העלאת אחוז החסימה, שתקטין את כוחן של מפלגות קטנות.",
     ar:"وضع تعرقل فيه الأقلية الأغلبية عبر التماسات إلى المحكمة وعبر قوة مساومة ائتلافية. الكابح المركزي هو رفع نسبة الحسم، ما يقلّص قوة الأحزاب الصغيرة.",
     ru:"Положение, при котором меньшинство блокирует большинство через обращения в суд и коалиционный торг. Главный тормоз: повышение электорального барьера, снижающего силу малых партий.",
     en:"A situation in which the minority blocks the majority through court petitions and coalition bargaining. The main check is raising the electoral threshold, which shrinks the power of small parties."},
    {he:"מצב שבו אחוז ההצבעה נמוך מדי. הבלם המרכזי הוא הצבעה חובה.",
     ar:"وضع تكون فيه نسبة التصويت منخفضة جدًّا. الكابح المركزيّ التصويت الإلزاميّ.",
     ru:"Положение, при котором явка слишком низка. Главный тормоз: обязательное голосование.",
     en:"A situation in which turnout is too low. The main brake is compulsory voting."},
    {he:"מצב שבו יש יותר מדי מפלגות. הבלם המרכזי הוא בחירות אזוריות.",
     ar:"وضع تكثر فيه الأحزاب. الكابح المركزيّ الانتخابات الإقليمية.",
     ru:"Положение, при котором партий слишком много. Главный тормоз: окружные выборы.",
     en:"A situation in which there are too many parties. The main brake is regional elections."}],
   0,
   {he:"השם עצמו מגלה מי הפוגע. שאלו מה מגן על הנפגע.",
    ar:"الاسم نفسه يكشف مَن يمسّ. اسألوا ما الذي يحمي المتضرّر.",
    ru:"Само название выдаёт, кто причиняет вред. Спросите, что защищает пострадавшего.",
    en:"The name itself says who does the harm. Ask what protects the one harmed."},
   {he:"דמוקרטיה פורמלית מסתפקת בבחירות; דמוקרטיה מהותית דורשת גם גבולות לכוחו של הרוב. בלי זכויות מוגנות אפשר להצביע פה אחד על שלילת זכויות — הליך תקין שתוצאתו אינה דמוקרטית.",
    ar:"الديمقراطية الشكلية تكتفي بالانتخابات؛ أما الجوهرية فتشترط حدودًا لقوة الأغلبية. بلا حقوق محميّة يمكن التصويت بالإجماع على سلب الحقوق، إجراء سليم ونتيجته غير ديمقراطية.",
    ru:"Формальная демократия довольствуется выборами; содержательная требует и границ для власти большинства. Без защищённых прав можно единогласно проголосовать за их лишение: процедура безупречна, а результат недемократичен.",
    en:"Formal democracy is satisfied with elections; substantive democracy also demands limits on the majority's power. Without protected rights a parliament can vote unanimously to strip rights: a proper procedure with an undemocratic result."},
   null),
  Q("pr-3-01",{"he": "קבוצה קוראת בגלוי לאלימות נגד בני דת אחרת. יש הטוענים שעקרון הסובלנות מחייב לתת לה לפעול בחופשיות. מהי הביקורת החזקה ביותר על הטענה?", "ar": "مجموعة تدعو علنًا إلى العنف ضدّ أبناء دين آخر. يدّعي البعض أنّ مبدأ التسامح يُلزم بالسماح لها بالعمل بحرية. ما أقوى نقد لهذا الادّعاء؟", "ru": "Группа открыто призывает к насилию против людей другой религии. Некоторые утверждают, что принцип терпимости требует позволить ей свободно действовать. Какова самая сильная критика этого утверждения?", "en": "A group openly calls for violence against members of another religion. Some argue that the principle of tolerance requires letting it act freely. What is the strongest criticism of this claim?"},[{"he": "סובלנות אינה חלה על מי שפועל לפגוע בזכויות של אחרים ולהרוס את הסובלנות עצמה.", "ar": "التسامح لا يشمل من يعمل على المسّ بحقوق الآخرين وتدمير التسامح نفسه.", "ru": "Терпимость не распространяется на тех, кто стремится нарушить права других и уничтожить саму терпимость.", "en": "Tolerance does not extend to those who act to harm others' rights and destroy tolerance itself."}, {"he": "סובלנות היא ערך פרטי, ואין לה מקום בחיים הציבוריים.", "ar": "التسامح قيمة شخصية، ولا مكان لها في الحياة العامّة.", "ru": "Терпимость — частная ценность, и ей нет места в общественной жизни.", "en": "Tolerance is a private value and has no place in public life."}, {"he": "הקבוצה קטנה, ולכן אין צורך להתייחס אליה כלל, וממילא היא לא תשפיע על הציבור הרחב ועל ההחלטות במדינה.", "ar": "المجموعة صغيرة، ولذلك لا حاجة إلى الاهتمام بها إطلاقًا، وهي على أيّ حال لن تؤثّر في الجمهور الواسع وفي قرارات الدولة.", "ru": "Группа маленькая, поэтому на неё вообще не нужно обращать внимания, и она всё равно не повлияет на широкую публику и решения государства.", "en": "The group is small, so there is no need to deal with it at all, and it will not affect the wider public or state decisions anyway."}, {"he": "סובלנות חלה רק על דעות שרוב הציבור מסכים איתן.", "ar": "التسامح يشمل فقط الآراء التي توافق عليها أغلبية الجمهور.", "ru": "Терпимость распространяется только на мнения, с которыми согласно большинство.", "en": "Tolerance applies only to opinions that most of the public agrees with."}],0,{"he": "מה יקרה לסובלנות אם ניתן לכל אחד להשתמש בה כדי לחסל אותה?", "ar": "ماذا سيحدث للتسامح إذا سمحنا لكلّ أحد أن يستخدمه للقضاء عليه؟", "ru": "Что станет с терпимостью, если позволить любому использовать её, чтобы её же уничтожить?", "en": "What happens to tolerance if anyone may use it to wipe it out?"},{"he": "זה \"פרדוקס הסובלנות\": סובלנות בלי גבול עלולה לאפשר את חיסולה. לכן מותר להגביל הסתה לאלימות ולגזענות. סובלנות כלפי דעות שאינן אהודות נשמרת, כל עוד הן אינן קוראות לפגוע באחרים.", "ar": "هذه \"مفارقة التسامح\": التسامح بلا حدود قد يسمح بالقضاء عليه. لذلك يجوز تقييد التحريض على العنف والعنصرية. ويبقى التسامح تجاه الآراء غير المحبوبة، ما دامت لا تدعو إلى إيذاء الآخرين.", "ru": "Это «парадокс терпимости»: безграничная терпимость может привести к её уничтожению. Поэтому можно ограничивать подстрекательство к насилию и расизму. Терпимость к непопулярным мнениям сохраняется, пока они не призывают вредить другим.", "en": "This is the \"paradox of tolerance\": unlimited tolerance can allow its own destruction. So incitement to violence and racism may be restricted. Tolerance of unpopular views remains, as long as they do not call for harming others."},null),
  Q("pr-3-02",{"he": "עיתונאי ביקש לפי חוק חופש המידע מסמכים על הוצאות של משרד ממשלתי. המשרד סירב, ונימק רק ש\"זה עניין פנימי\". מה נכון לומר?", "ar": "طلب صحفيّ وفق قانون حرية المعلومات وثائق عن مصروفات وزارة حكومية. رفضت الوزارة، وكان تبريرها الوحيد أنّ \"هذا شأن داخليّ\". ما الصحيح؟", "ru": "Журналист по закону о свободе информации запросил документы о расходах министерства. Министерство отказало, объяснив лишь, что «это внутреннее дело». Что верно?", "en": "Under the Freedom of Information Law, a journalist asked for documents on a ministry's spending. The ministry refused, saying only that \"it is an internal matter\". What is correct?"},[{"he": "המשרד צודק: הוצאות הממשלה הן עניין שלה בלבד, והציבור יוכל לשפוט אותה בבחירות הבאות לפי תוצאות המדיניות שלה בכל תחום.", "ar": "الوزارة محقّة: مصروفات الحكومة شأنها وحدها، والجمهور يستطيع أن يحاسبها في الانتخابات القادمة وفق نتائج سياستها في كلّ مجال.", "ru": "Министерство право: расходы правительства — только его дело, а общество сможет оценить его на следующих выборах по результатам политики во всех сферах.", "en": "The ministry is right: government spending is its own business, and the public can judge it at the next election by the results of its policy in every field."}, {"he": "גילוי המידע הוא הכלל. אפשר לסרב רק מסיבה שהחוק מכיר בה, כמו ביטחון או פרטיות.", "ar": "الكشف عن المعلومات هو القاعدة. يمكن الرفض فقط لسبب يعترف به القانون، مثل الأمن أو الخصوصية.", "ru": "Раскрытие информации — правило. Отказать можно только по причине, которую признаёт закон, например безопасность или частная жизнь.", "en": "Disclosure is the rule. A refusal is allowed only for a reason the law recognises, such as security or privacy."}, {"he": "העיתונאי צודק, וכל מסמך ממשלתי חייב להתפרסם, גם מסמך ביטחוני סודי.", "ar": "الصحفيّ محقّ، ويجب نشر كلّ وثيقة حكومية، حتى الوثيقة الأمنية السرّية.", "ru": "Журналист прав, и любой правительственный документ должен быть опубликован, даже секретный документ по безопасности.", "en": "The journalist is right, and every government document must be published, even a secret security document."}, {"he": "רק חבר כנסת רשאי לבקש מידע מהממשלה.", "ar": "عضو الكنيست وحده يحقّ له طلب المعلومات من الحكومة.", "ru": "Только депутат Кнессета вправе запрашивать информацию у правительства.", "en": "Only a Knesset member may request information from the government."}],1,{"he": "שקיפות היא ברירת המחדל. מתי מותר לסטות ממנה?", "ar": "الشفافية هي الوضع الافتراضيّ. متى يجوز الخروج عنها؟", "ru": "Прозрачность — правило по умолчанию. Когда от неё можно отступить?", "en": "Transparency is the default. When may one depart from it?"},{"he": "כסף ציבורי שייך לציבור, ולכן הוא רשאי לדעת איך הוצא. השקיפות אינה מוחלטת: החוק מאפשר לסרב כדי להגן על ביטחון המדינה או על פרטיות. אבל הסירוב חייב להישען על סיבה כזאת, ולא על רצון להסתיר.", "ar": "المال العامّ ملك للجمهور، ولذلك يحقّ له أن يعرف كيف صُرف. والشفافية ليست مطلقة: يسمح القانون بالرفض لحماية أمن الدولة أو الخصوصية. لكن الرفض يجب أن يستند إلى سبب كهذا، لا إلى الرغبة في الإخفاء.", "ru": "Государственные деньги принадлежат обществу, поэтому оно вправе знать, как их потратили. Прозрачность не абсолютна: закон позволяет отказать ради безопасности государства или частной жизни. Но отказ должен опираться на такую причину, а не на желание скрыть.", "en": "Public money belongs to the public, so it has the right to know how it was spent. Transparency is not absolute: the law allows refusal to protect state security or privacy. But a refusal must rest on such a reason, not on a wish to hide."},null),
  Q("pr-3-03",{"he": "במדינה מסוימת אותה מפלגה שולטת בפרלמנט ובממשלה, וגם ממנה לבדה את כל השופטים. מדוע זה מסוכן, גם אם כל המינויים נעשו לפי החוק?", "ar": "في دولة ما يسيطر الحزب نفسه على البرلمان والحكومة، ويعيّن وحده أيضًا جميع القضاة. لماذا هذا خطير، حتى لو تمّت كلّ التعيينات وفق القانون؟", "ru": "В одной стране одна и та же партия контролирует парламент и правительство и сама назначает всех судей. Почему это опасно, даже если все назначения законны?", "en": "In a certain country the same party controls parliament and the government, and alone appoints all the judges. Why is this dangerous, even if every appointment followed the law?"},[{"he": "כי מפלגה אחת אינה מסוגלת לנהל כמה משרדים בבת אחת.", "ar": "لأنّ حزبًا واحدًا لا يستطيع إدارة عدّة وزارات في آن واحد.", "ru": "Потому что одна партия не способна управлять несколькими министерствами сразу.", "en": "Because one party cannot run several ministries at once."}, {"he": "כי בכל מדינה דמוקרטית השופטים חייבים להיבחר בבחירות כלליות.", "ar": "لأنّ القضاة في كلّ دولة ديمقراطية يجب أن يُنتخبوا في انتخابات عامّة.", "ru": "Потому что в любой демократии судьи обязаны избираться на всеобщих выборах.", "en": "Because in every democracy judges must be chosen in general elections."}, {"he": "כי הרשויות כבר אינן מפקחות זו על זו, וכל הכוח מתרכז בידי קבוצה אחת.", "ar": "لأنّ السلطات لم تعد تراقب بعضها بعضًا، وتتركّز كلّ القوّة في يد مجموعة واحدة.", "ru": "Потому что ветви власти больше не контролируют друг друга, и вся сила сосредоточена в руках одной группы.", "en": "Because the branches no longer check one another, and all power is concentrated in one group's hands."}, {"he": "אין סכנה, כי המינויים חוקיים, והפרדת רשויות פירושה רק שכל רשות יושבת בבניין נפרד ויש לה תקציב משלה.", "ar": "لا خطر، لأنّ التعيينات قانونية، والفصل بين السلطات يعني فقط أنّ لكلّ سلطة مبنى منفصلًا وميزانية خاصّة بها.", "ru": "Опасности нет, потому что назначения законны, а разделение властей означает лишь, что у каждой ветви своё здание и свой бюджет.", "en": "There is no danger, because the appointments are legal, and separation of powers only means each branch has its own building and budget."}],2,{"he": "שאלו מי יבדוק את הממשלה אם היא טועה.", "ar": "اسألوا: من سيراقب الحكومة إذا أخطأت؟", "ru": "Спросите себя, кто проверит правительство, если оно ошибётся.", "en": "Ask who will check the government if it makes a mistake."},{"he": "הפרדת רשויות נועדה לבלמים ואיזונים: כל רשות מגבילה את האחרות. כשאותה קבוצה שולטת בכולן, הבלמים נשארים רק על הנייר. חוקיות המינויים אינה מספיקה, אם התוצאה היא ריכוז כוח.", "ar": "الفصل بين السلطات وُجد من أجل الضوابط والتوازنات: كلّ سلطة تقيّد الأخرى. وعندما تسيطر المجموعة نفسها عليها جميعًا، تبقى الضوابط على الورق فقط. قانونية التعيينات لا تكفي إذا كانت النتيجة تركيز القوّة.", "ru": "Разделение властей нужно для системы сдержек и противовесов: каждая ветвь ограничивает другие. Когда одна группа контролирует все, сдержки остаются лишь на бумаге. Законности назначений недостаточно, если в итоге власть сосредоточена в одних руках.", "en": "Separation of powers exists for checks and balances: each branch limits the others. When one group controls all of them, the checks remain only on paper. Legal appointments are not enough if the result is concentrated power."},null),
  Q("pr-3-04",{"he": "מדינה מחליטה ללמד בכל בתי הספר תוכנית תרבות אחת בלבד, בלי מקום למסורות של קבוצות שונות, כדי \"לחזק את האחדות\". נתחו את ההחלטה לפי עקרון הפלורליזם.", "ar": "تقرّر دولة أن تدرّس في جميع المدارس برنامجًا ثقافيًّا واحدًا فقط، دون مكان لتقاليد المجموعات المختلفة، من أجل \"تعزيز الوحدة\". حلّلوا القرار وفق مبدأ التعدّدية.", "ru": "Государство решает преподавать во всех школах только одну культурную программу, без места для традиций разных групп, чтобы «укрепить единство». Проанализируйте решение с точки зрения плюрализма.", "en": "A state decides that all schools will teach only one culture programme, with no room for the traditions of different groups, to \"strengthen unity\". Analyse the decision using the principle of pluralism."},[{"he": "אין כאן בעיה: פלורליזם פירושו שכל הקבוצות לומדות בדיוק את אותו הדבר.", "ar": "لا مشكلة هنا: التعدّدية تعني أنّ جميع المجموعات تتعلّم الشيء نفسه بالضبط.", "ru": "Здесь нет проблемы: плюрализм означает, что все группы изучают одно и то же.", "en": "There is no problem: pluralism means all groups learn exactly the same thing."}, {"he": "ההחלטה מחזקת את הפלורליזם, כי כולם מקבלים אותו חינוך, ואיש אינו מופלה לרעה או זוכה ליתרון על פני אחרים.", "ar": "القرار يعزّز التعدّدية، لأنّ الجميع يحصلون على التعليم نفسه، ولا يُميَّز أحد ضدّه ولا يحظى بأفضلية على غيره.", "ru": "Решение укрепляет плюрализм, потому что все получают одинаковое образование и никто не ущемлён и не получает преимущества перед другими.", "en": "The decision strengthens pluralism, because everyone gets the same education, and no one is disadvantaged or gains an edge over others."}, {"he": "פלורליזם חל רק על מפלגות, ולא על חינוך ותרבות.", "ar": "التعدّدية تنطبق على الأحزاب فقط، لا على التعليم والثقافة.", "ru": "Плюрализм касается только партий, а не образования и культуры.", "en": "Pluralism applies only to parties, not to education and culture."}, {"he": "יש מתח בין אחדות לפלורליזם. מחיקה של כל המסורות פוגעת בזכות של קבוצות לשמור על זהותן.", "ar": "هناك توتّر بين الوحدة والتعدّدية. محو جميع التقاليد يمسّ بحقّ المجموعات في الحفاظ على هويّتها.", "ru": "Есть напряжение между единством и плюрализмом. Стирание всех традиций нарушает право групп сохранять свою идентичность.", "en": "There is a tension between unity and pluralism. Erasing all traditions harms groups' right to keep their identity."}],3,{"he": "אפשר לבנות בסיס משותף. מה קורה כשהבסיס מוחק את כל השאר?", "ar": "يمكن بناء أساس مشترك. ماذا يحدث عندما يمحو هذا الأساس كلّ ما سواه؟", "ru": "Можно создать общую основу. Что происходит, когда она стирает всё остальное?", "en": "A common base can be built. What happens when that base erases everything else?"},{"he": "מדינה רשאית לבנות מכנה משותף לכל התלמידים, כמו שפה וערכים אזרחיים. פלורליזם דורש שלצד זה יהיה מקום גם לזהויות השונות. אחדות שנבנית על ביטול השונות סותרת את הפלורליזם.", "ar": "يحقّ للدولة أن تبني قاسمًا مشتركًا لجميع الطلاب، مثل اللغة والقيم المدنية. والتعدّدية تتطلّب أن يكون إلى جانب ذلك مكان للهويّات المختلفة أيضًا. الوحدة التي تُبنى على إلغاء الاختلاف تتناقض مع التعدّدية.", "ru": "Государство вправе создать общую основу для всех учеников, например язык и гражданские ценности. Плюрализм требует, чтобы рядом с этим было место и для разных идентичностей. Единство, построенное на отмене различий, противоречит плюрализму.", "en": "A state may build common ground for all students, such as language and civic values. Pluralism requires that alongside this there is room for different identities. Unity built on abolishing difference contradicts pluralism."},null)
 ]
]);

topic("types","dem",
  {he:"דמוקרטיה פורמלית ומהותית",ar:"ديمقراطية شكلية وجوهرية",ru:"Формальная и содержательная демократия",en:"Formal and substantive democracy"},
  {he:"מה מבדיל דמוקרטיה ממשטר שיש בו בחירות בלבד",
   ar:"ما الذي يميّز الديمقراطية عن نظام فيه انتخابات فقط",
   ru:"Что отличает демократию от режима, в котором есть лишь выборы",
   en:"What separates a democracy from a regime that merely holds elections"},
[
 [ /* רמה 1 — ידע */
  Q("types-formal",
    {he:"מהי דמוקרטיה פורמלית?",
     ar:"ما هي الديمقراطية الشكلية؟",
     ru:"Что такое формальная демократия?",
     en:"What is formal democracy?"},
   [{he:"תפיסה שלפיה די בכללי המשחק — בחירות תקופתיות, חופשיות ושוות — כדי שמשטר ייחשב דמוקרטי.",
     ar:"تصوّر يرى أن قواعد اللعبة، انتخابات دورية حرّة ومتساوية، تكفي كي يُعتبر النظام ديمقراطيًّا.",
     ru:"Представление, по которому достаточно правил игры: периодических, свободных и равных выборов, чтобы режим считался демократическим.",
     en:"The view that the rules of the game: periodic, free and equal elections: are enough for a regime to count as democratic."},
    {he:"תפיסה שלפיה על המדינה לספק לכל אזרח שכר שווה ורמת חיים דומה.",
     ar:"تصوّر يوجب على الدولة أن توفّر لكلّ مواطن أجرًا متساويًا ومستوى معيشة مشابهًا.",
     ru:"Представление, по которому государство обязано обеспечить каждому равную зарплату и схожий уровень жизни.",
     en:"The view that the state must give every citizen an equal wage and a similar standard of living."},
    {he:"תפיסה שלפיה החוקה חייבת להיות כתובה במסמך אחד ומאושרת במשאל עם.",
     ar:"تصوّر يقضي بأن يكون الدستور مكتوبًا في وثيقة واحدة ومصادقًا عليه في استفتاء شعبيّ.",
     ru:"Представление, по которому конституция должна быть записана в одном документе и утверждена на референдуме.",
     en:"The view that a constitution must be written in a single document and approved in a referendum."},
    {he:"תפיסה שלפיה השלטון נבחר בידי מועצת חכמים המייצגת את הידע המקצועי — ולא בבחירות כלליות.",
     ar:"تصوّر يُنتخَب بموجبه الحكم على يد مجلس حكماء يمثّل المعرفة المهنية، لا في انتخابات عامّة.",
     ru:"Представление, по которому власть избирается советом мудрецов: представителями профессионального знания, а не на всеобщих выборах.",
     en:"The view that the government is chosen by a council of sages representing professional knowledge: rather than in a general election."}],
   0,
   {he:"“פורמלי” הוא מה שנוגע לצורה ולהליך. מה ההליך המרכזי בדמוקרטיה?",
    ar:"“الشكليّ” هو ما يتعلّق بالصورة والإجراء. ما الإجراء المركزيّ في الديمقراطية؟",
    ru:"«Формальное»: то, что относится к форме и процедуре. Какова главная процедура демократии?",
    en:"“Formal” is what concerns form and procedure. What is the central procedure of a democracy?"},
   {he:"הדמוקרטיה הפורמלית עונה על השאלה “איך מחליטים”. היא הכרחית — בלי בחירות חופשיות אין דמוקרטיה — אבל אינה מספיקה: אפשר לבחור בהליך תקין שלטון שיפגע בזכויות.",
    ar:"الديمقراطية الشكلية تجيب عن سؤال “كيف نقرّر”. هي ضرورية، بلا انتخابات حرّة لا ديمقراطية، لكنها غير كافية: يمكن أن تُنتخب بإجراء سليم سلطةٌ تمسّ الحقوق.",
    ru:"Формальная демократия отвечает на вопрос «как решают». Она необходима: без свободных выборов демократии нет, но недостаточна: безупречной процедурой можно избрать власть, которая нарушит права.",
    en:"Formal democracy answers the question “how do we decide”. It is necessary, without free elections there is no democracy, but not sufficient: a proper procedure can elect a government that violates rights."},
   null),
  Q("types-subst",
    {he:"מהי דמוקרטיה מהותית?",
     ar:"ما هي الديمقراطية الجوهرية؟",
     ru:"Что такое содержательная демократия?",
     en:"What is substantive democracy?"},
   [{he:"משטר שבו הרוב רשאי להחליט כל דבר, ובלבד שההחלטה התקבלה בהצבעה חופשית ובהליך שנקבע בחוק — תוכן ההחלטה עצמו אינו נבדק.",
     ar:"نظام يحقّ فيه للأغلبية أن تقرّر أيّ شيء، شرط أن يُتَّخذ القرار بتصويت حرّ وبإجراء حدّده القانون، أمّا مضمون القرار نفسه فلا يُفحص.",
     ru:"Режим, в котором большинство вправе решить что угодно, лишь бы решение было принято свободным голосованием по установленной законом процедуре, а само содержание решения не проверяется.",
     en:"A regime in which the majority may decide anything, provided the decision was taken in a free vote by the procedure the law lays down: the content itself is never examined."},
    {he:"משטר שבו מספר המפלגות אינו מוגבל.",
     ar:"نظام لا يُحدَّد فيه عدد الأحزاب.",
     ru:"Режим, в котором число партий не ограничено.",
     en:"A regime in which the number of parties is unlimited."},
    {he:"תפיסה שלפיה דמוקרטיה נמדדת גם בערכיה: זכויות אדם, שוויון, סובלנות ופלורליזם — ולא רק בהליך הבחירות.",
     ar:"تصوّر يرى أن الديمقراطية تُقاس أيضًا بقيمها: حقوق الإنسان، المساواة، التسامح والتعدّدية، لا بإجراء الانتخابات وحده.",
     ru:"Представление, по которому демократия измеряется и своими ценностями: права человека, равенство, терпимость и плюрализм, а не только процедурой выборов.",
     en:"The view that a democracy is measured by its values too: human rights, equality, tolerance and pluralism, and not only by the electoral procedure."},
    {he:"משטר שבו ראש הממשלה נבחר ישירות בידי הציבור, וכך רצון הבוחר מתבטא במלואו בלי תיווך של מפלגות ובלי מיקוח קואליציוני.",
     ar:"نظام يُنتخَب فيه رئيس الحكومة مباشرةً من الجمهور، فتتجلّى إرادة الناخب كاملةً دون وساطة الأحزاب ودون مساومة ائتلافية.",
     ru:"Режим, в котором премьер-министра избирают прямым голосованием, так что воля избирателя выражается полностью: без посредничества партий и без коалиционного торга.",
     en:"A regime in which the prime minister is elected directly by the public, so the voter's will is expressed in full, with no party mediation and no coalition bargaining."}],
   2,
   {he:"“מהותי” הוא מה שנוגע לתוכן. מה התוכן שדמוקרטיה מגנה עליו?",
    ar:"“الجوهريّ” هو ما يتعلّق بالمضمون. ما المضمون الذي تحميه الديمقراطية؟",
    ru:"«Содержательное» относится к содержанию. Какое содержание защищает демократия?",
    en:"“Substantive” concerns content. What content does a democracy protect?"},
   {he:"הדמוקרטיה המהותית עונה על השאלה “מה מותר להחליט”. היא הסיבה שיש זכויות שאי אפשר לבטל ברוב רגיל, ושבתי משפט בוחנים חוקים ולא רק מעשי מנהל.",
    ar:"الديمقراطية الجوهرية تجيب عن سؤال “ماذا يجوز أن نقرّر”. لذلك توجد حقوق لا تُلغى بأغلبية عادية، ولذلك تفحص المحاكم القوانين لا الأعمال الإدارية فحسب.",
    ru:"Содержательная демократия отвечает на вопрос «что можно решать». Поэтому существуют права, которые нельзя отменить простым большинством, и поэтому суды проверяют законы, а не только административные акты.",
    en:"Substantive democracy answers the question “what may be decided”. It is why some rights cannot be repealed by an ordinary majority, and why courts review statutes and not only administrative acts."},
   null),
  Q("types-nondem",
    {he:"מה מאפיין משטר לא־דמוקרטי, גם כשמתקיימות בו בחירות?",
     ar:"ما الذي يميّز نظامًا غير ديمقراطيّ، حتى حين تجري فيه انتخابات؟",
     ru:"Что характерно для недемократического режима, даже когда в нём проходят выборы?",
     en:"What marks a non-democratic regime, even when it holds elections?"},
   [{he:"מספר המצביעים בו נמוך מחמישים אחוז, ולכן הנבחרים אינם מייצגים באמת את רוב הציבור.",
     ar:"عدد المصوّتين فيه أقلّ من خمسين بالمئة، ولذلك لا يمثّل المنتخَبون حقًّا أغلبية الجمهور.",
     ru:"Явка в нём ниже пятидесяти процентов, поэтому избранные на деле не представляют большинство общества.",
     en:"Turnout in it is below fifty percent, so those elected do not really represent the majority of the public."},
    {he:"אין בו תחרות אמיתית: התקשורת נשלטת, אופוזיציה נרדפת, ותוצאת הבחירות ידועה מראש.",
     ar:"لا منافسة حقيقية فيه: الإعلام مسيطَر عليه، والمعارضة مُلاحقة، ونتيجة الانتخابات معروفة سلفًا.",
     ru:"В нём нет настоящей конкуренции: СМИ под контролем, оппозицию преследуют, результат выборов известен заранее.",
     en:"There is no real competition: the media is controlled, the opposition is persecuted, and the result is known in advance."},
    {he:"יש בו יותר משתי מפלגות, וכך הקולות מתפזרים ואין רוב יציב שיכול לשלוט.",
     ar:"فيه أكثر من حزبين، فتتشتّت الأصوات ولا توجد أغلبية ثابتة قادرة على الحكم.",
     ru:"В нём больше двух партий, голоса распыляются, и устойчивого большинства для правления нет.",
     en:"It has more than two parties, so votes scatter and no stable majority can govern."},
    {he:"הוא אינו חבר בארגון האומות המאוחדות, ולכן משטרו אינו מקבל הכרה בינלאומית.",
     ar:"ليس عضوًا في منظّمة الأمم المتّحدة، ولذلك لا يحظى نظامه باعتراف دوليّ.",
     ru:"Он не состоит в Организации Объединённых Наций, поэтому его строй не получает международного признания.",
     en:"It is not a member of the United Nations, so its regime receives no international recognition."}],
   1,
   {he:"בחירות הן תנאי, אבל לא כל בחירות שוות. מה חייב להיות בהן כדי שיהיו אמיתיות?",
    ar:"الانتخابات شرط، لكن ليست كلّ الانتخابات سواء. ما الذي يجب أن يتوفّر فيها كي تكون حقيقية؟",
    ru:"Выборы: условие, но не всякие выборы равны. Что должно в них быть, чтобы они были настоящими?",
    en:"Elections are a condition, but not all elections are equal. What must they contain to be real?"},
   {he:"בחירות דמוקרטיות חייבות להיות כלליות, שוות, חשאיות, ישירות ותקופתיות — וגם חופשיות, כלומר עם אפשרות ממשית להחליף את השלטון. משטר שמקיים טקס בחירות בלי אפשרות כזאת נקרא לעיתים “דמוקרטיה למראית עין”.",
    ar:"الانتخابات الديمقراطية يجب أن تكون عامّة ومتساوية وسرّية ومباشرة ودورية، وحرّة أيضًا، أي مع إمكانية فعلية لتغيير السلطة. نظام يقيم طقسًا انتخابيًّا بلا هذه الإمكانية يُسمّى أحيانًا “ديمقراطية مظهرية”.",
    ru:"Демократические выборы должны быть всеобщими, равными, тайными, прямыми и периодическими, и свободными, то есть с реальной возможностью сменить власть. Режим, устраивающий ритуал выборов без такой возможности, называют иногда «фасадной демократией».",
    en:"Democratic elections must be general, equal, secret, direct and periodic, and free, meaning that changing the government is genuinely possible. A regime that stages an electoral ritual without that possibility is sometimes called a “facade democracy”."},
   null),
  Q("ty-1-01",{"he": "מהי דמוקרטיה מתגוננת?", "ar": "ما هي الديمقراطية الدفاعية؟", "ru": "Что такое защищающаяся демократия?", "en": "What is a defensive democracy?"},[{"he": "דמוקרטיה שיש לה צבא חזק ומערך ביטחון גדול.", "ar": "ديمقراطية لديها جيش قويّ وجهاز أمنيّ كبير.", "ru": "Демократия, у которой сильная армия и большая система безопасности.", "en": "A democracy that has a strong army and a large security system."}, {"he": "דמוקרטיה שאוסרת כל ביקורת על השלטון בזמן מלחמה, כדי לשמור על האחדות ועל מצב הרוח של הציבור.", "ar": "ديمقراطية تمنع كلّ نقد للحكم في زمن الحرب، كي تحافظ على الوحدة وعلى معنويات الجمهور.", "ru": "Демократия, которая запрещает любую критику власти во время войны, чтобы сохранить единство и настроение общества.", "en": "A democracy that bans all criticism of the government in wartime, to protect unity and public morale."}, {"he": "דמוקרטיה שמגבילה מי שמנצל את כלי הדמוקרטיה כדי לפגוע בה עצמה.", "ar": "ديمقراطية تقيّد من يستغلّ أدوات الديمقراطية كي يمسّ بها هي نفسها.", "ru": "Демократия, которая ограничивает тех, кто использует её инструменты, чтобы навредить ей самой.", "en": "A democracy that restricts those who use democratic tools to harm democracy itself."}, {"he": "דמוקרטיה שאינה מקיימת בחירות בזמן מצב חירום.", "ar": "ديمقراطية لا تُجري انتخابات في حالة الطوارئ.", "ru": "Демократия, которая не проводит выборы во время чрезвычайного положения.", "en": "A democracy that holds no elections during a state of emergency."}],2,{"he": "ממה בדיוק היא מתגוננת — מאויב בחוץ, או מסכנה מבפנים?", "ar": "ممّ تدافع بالضبط — من عدوّ في الخارج، أم من خطر في الداخل؟", "ru": "От чего именно она защищается — от внешнего врага или от опасности изнутри?", "en": "What exactly does it defend against — an enemy outside, or a danger from within?"},{"he": "גופים אנטי־דמוקרטיים יכולים לנצל בחירות וחופש ביטוי כדי לעלות לשלטון ולבטל אותם. דמוקרטיה מתגוננת מציבה להם גבול. בישראל, למשל, אפשר לפסול רשימה שמסיתה לגזענות.", "ar": "يمكن لجهات معادية للديمقراطية أن تستغلّ الانتخابات وحرية التعبير لتصل إلى الحكم ثم تلغيهما. والديمقراطية الدفاعية تضع لها حدًّا. في إسرائيل، مثلًا، يمكن شطب قائمة تحرّض على العنصرية.", "ru": "Антидемократические силы могут использовать выборы и свободу слова, чтобы прийти к власти и отменить их. Защищающаяся демократия ставит им предел. В Израиле, например, можно снять с выборов список, который подстрекает к расизму.", "en": "Anti-democratic groups can use elections and free speech to gain power and then abolish them. A defensive democracy sets a limit for them. In Israel, for example, a list that incites racism can be disqualified."},null),
