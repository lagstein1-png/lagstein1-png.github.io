<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>אזרח — אזרחות לבגרות</title>
<meta name="description" content="אזרחות לבגרות למי שלומד אחרת: כל שאלה עם רמז, הסבר והקראה — עקרונות הדמוקרטיה, זכויות, חוקי יסוד, רשויות השלטון וחברה בישראל. בעברית, ערבית, רוסית ואנגלית." />
<meta name="theme-color" content="#f5f7fb" media="(prefers-color-scheme:light)" />
<meta name="theme-color" content="#0e1425" media="(prefers-color-scheme:dark)" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   אזרח — אזרחות לבגרות
   קהל היעד לא "לא יודע אזרחות". הוא נכשל בה שוב ושוב, מפני
   שהמקצוע כולו טקסט ומושגים — ולכן כל החלטה כאן נמדדת בשאלה
   אחת: האם היא מורידה עומס, או מוסיפה.
   · כל שאלה נושאת רמז שאינו התשובה, והסבר שנפתח גם כשצדקו.
   · שום טקסט לא מוצג בלי שאפשר לשמוע אותו.
   · שפת האם אינה קישוט: מושג באזרחות נלמד קודם בשפה שחושבים בה.
   כל המידות ב-rem, כדי שהגדלת טקסט תגדיל את הכול יחד.
   ============================================================ */
:root{
  --font:"Heebo","Rubik",system-ui,"Segoe UI",Arial,sans-serif;
  --en:"Lexend","Heebo",system-ui,"Segoe UI",Arial,sans-serif;
  --bg:#f5f7fb; --surface:#ffffff; --surface2:#e8ecf6;
  --ink:#101828; --muted:#55607a; --faint:#6f7a95; --line:#dde3f0;
  --accent:#1d4ed8; --accent-ink:#ffffff; --accent-soft:#dbe4fe;
  --gold:#a16207; --gold-soft:#fbf0d5; --hit:#f5c451; --hit-ink:#1a1300;
  --ok:#15803d; --ok-soft:#dcfce7; --bad:#be123c; --bad-soft:#ffe4e9;
  --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px -12px rgba(16,24,40,.2);
  --r:14px;
  /* צבע לכל מסלול. לא קישוט: ארבעה סוגי לימוד שונים לגמרי, וצבע
     קבוע לכל אחד חוסך למי שמתקשה להתמצא את השאלה "איפה אני". */
  --c-sound:#0369a1; --cs-sound:#dbeefc;   /* צליל ואות   */
  --c-words:#15803d; --cs-words:#dcfce7;   /* מילים       */
  --c-talk:#c2410c;  --cs-talk:#fde5d8;    /* מדוברת      */
  --c-read:#6d28d9;  --cs-read:#eae2fd;    /* ספרותית     */
}
:root[data-theme="dark"]{
  --bg:#0e1425; --surface:#17203a; --surface2:#202c4d;
  --ink:#e8edf8; --muted:#9aa5c0; --faint:#78829e; --line:#2a3762;
  --accent:#93c5fd; --accent-ink:#0e1425; --accent-soft:#1b2a5c;
  --gold:#fbbf24; --gold-soft:#33270f; --hit:#ffd24d; --hit-ink:#241a00;
  --ok:#4ade80; --ok-soft:#132a1c; --bad:#fb7185; --bad-soft:#33161f;
  --warn:#fbbf24; --warn-soft:#33260f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  --c-sound:#7dd3fc; --cs-sound:#0b2a3d;
  --c-words:#86efac; --cs-words:#0f2a1a;
  --c-talk:#fdba74;  --cs-talk:#3a2113;
  --c-read:#c4b5fd;  --cs-read:#261a45;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1425; --surface:#17203a; --surface2:#202c4d;
    --ink:#e8edf8; --muted:#9aa5c0; --faint:#78829e; --line:#2a3762;
    --accent:#93c5fd; --accent-ink:#0e1425; --accent-soft:#1b2a5c;
    --gold:#fbbf24; --gold-soft:#33270f; --hit:#ffd24d; --hit-ink:#241a00;
    --ok:#4ade80; --ok-soft:#132a1c; --bad:#fb7185; --bad-soft:#33161f;
    --warn:#fbbf24; --warn-soft:#33260f;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
    --c-sound:#7dd3fc; --cs-sound:#0b2a3d;
    --c-words:#86efac; --cs-words:#0f2a1a;
    --c-talk:#fdba74;  --cs-talk:#3a2113;
    --c-read:#c4b5fd;  --cs-read:#261a45;
  }
}
/* ניגודיות גבוהה — שחור על לבן, מסגרות מלאות, בלי גוונים רכים */
:root.hc{
  --bg:#ffffff; --surface:#ffffff; --surface2:#ffffff;
  --ink:#000000; --muted:#1a1a1a; --faint:#333333; --line:#000000;
  --accent:#00434b; --accent-ink:#ffffff; --accent-soft:#e6f2f3;
  --gold:#5c3d00; --gold-soft:#f7efdf; --hit:#ffe600; --hit-ink:#000000;
  --ok:#0a5c2a; --ok-soft:#e6f4ea; --bad:#8c0f2c; --bad-soft:#fbe9ed;
  --warn:#6b3d00; --warn-soft:#f7efdf; --shadow:none;
  --c-sound:#00305c; --cs-sound:#e8eef7;
  --c-words:#0a5c2a; --cs-words:#e6f4ea;
  --c-talk:#7a2c00;  --cs-talk:#f9ece4;
  --c-read:#3d1a75;  --cs-read:#eee8f9;
}
:root.hc *{box-shadow:none!important}
:root.hc .card,:root.hc .btn,:root.hc .opt{border-width:2px!important}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs,17px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  font-size:1rem;line-height:1.65;-webkit-text-size-adjust:100%}
:root.clear body{font-family:"Verdana","Tahoma","Heebo",sans-serif;letter-spacing:.012em}
:root.spaced body{word-spacing:.22em;line-height:1.95}
:root.rm *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
h1,h2,h3{margin:0;line-height:1.3;font-weight:800}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* כל טקסט אנגלי — כיוון, גופן ומרווח משלו. unicode-bidi:isolate מונע
   מהמשפט האנגלי לגרור אחריו את סימני הפיסוק של המשפט העברי. */
.en{font-family:var(--en);direction:ltr;unicode-bidi:isolate;text-align:start}
.en-b{font-family:var(--en);direction:ltr;unicode-bidi:isolate;display:inline-block}

.wrap{max-width:56rem;margin:0 auto;padding:0 clamp(.9rem,3vw,1.5rem)}
.hbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-block:.6rem}
:root.hc .hbar{background:var(--bg);backdrop-filter:none}
.hrow{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
.brand{font-size:1.35rem;font-weight:800;letter-spacing:-.01em;display:flex;
  align-items:baseline;gap:.5rem;margin-inline-end:auto}
.brand small{font-size:.72rem;font-weight:600;color:var(--muted);letter-spacing:.06em}
.gbtn{display:inline-flex;align-items:center;gap:.4rem;background:var(--surface);
  border:1px solid var(--line);border-radius:999px;padding:.42rem .8rem;cursor:pointer;
  font-size:.86rem;font-weight:600;box-shadow:var(--shadow);min-height:44px}
.gbtn:hover{border-color:var(--accent)}
.gbtn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:1.1rem}
.grid{display:grid;gap:.85rem}
@media(min-width:640px){.g2{grid-template-columns:1fr 1fr}}
@media(min-width:900px){.g3{grid-template-columns:repeat(3,1fr)}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;
  border:1px solid var(--line);background:var(--surface);border-radius:12px;
  padding:.72rem 1.1rem;font-weight:700;cursor:pointer;box-shadow:var(--shadow);
  min-height:2.9rem;font-size:1rem}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;box-shadow:none}
.btn[disabled]{opacity:.45;cursor:default}
.btn.wide{width:100%}

.chip{display:inline-flex;align-items:center;gap:.35rem;border-radius:999px;
  padding:.22rem .6rem;font-size:.78rem;font-weight:700;background:var(--surface2);color:var(--muted)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}

/* ===== מסלולים: הצבע נכנס ככרטיס, לא כרקע של טקסט ===== */
.trk{--c:var(--accent);--cs:var(--accent-soft)}
.t-sound{--c:var(--c-sound);--cs:var(--cs-sound)}
.t-words{--c:var(--c-words);--cs:var(--cs-words)}
.t-talk{--c:var(--c-talk); --cs:var(--cs-talk)}
.t-read{--c:var(--c-read); --cs:var(--cs-read)}
.tcard{border-inline-start:5px solid var(--c);cursor:pointer;text-align:start;width:100%;
  display:flex;flex-direction:column;gap:.4rem;align-items:stretch}
.tcard:hover{border-color:var(--c)}
.tcard h3{font-size:1.05rem}
.tcard .sub{font-size:.85rem;color:var(--muted)}
.tdot{width:.62rem;height:.62rem;border-radius:50%;background:var(--c);flex:none}
.thead{display:flex;align-items:center;gap:.5rem}
.tpill{background:var(--cs);color:var(--c);border-radius:999px;padding:.15rem .55rem;
  font-size:.72rem;font-weight:800}

/* ===== סרגל שליטה ברמות ===== */
.lvls{display:flex;gap:.4rem;flex-wrap:wrap}
.lvl{border:1px solid var(--line);background:var(--surface);border-radius:10px;
  padding:.4rem .7rem;font-size:.82rem;font-weight:700;cursor:pointer;
  display:inline-flex;align-items:center;gap:.4rem}
.lvl.on{background:var(--c,var(--accent));color:var(--accent-ink);border-color:var(--c,var(--accent))}
.bar{height:.42rem;border-radius:999px;background:var(--surface2);overflow:hidden;flex:1;min-width:3rem}
.bar i{display:block;height:100%;background:var(--c,var(--accent))}
.bar.b0 i{background:var(--bad)} .bar.b1 i{background:var(--warn)} .bar.b2 i{background:var(--ok)}

/* ===== תרגול ===== */
.qcard{border-top:5px solid var(--c,var(--accent))}
.qtop{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.7rem}
.qtext{font-size:1.12rem;font-weight:600;margin:.2rem 0 .3rem}
.qhint{color:var(--muted);font-size:.9rem}
/* המילה או המשפט שנלמדים. גדול, מרווח, ותמיד לצד כפתור השמעה. */
.subject{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;
  background:var(--surface2);border-radius:12px;padding:.85rem 1rem;margin:.5rem 0}
.subject .word{font-family:var(--en);direction:ltr;unicode-bidi:isolate;
  font-size:1.7rem;font-weight:700;letter-spacing:.01em;line-height:1.25}
.subject .ipa{font-family:var(--en);direction:ltr;unicode-bidi:isolate;
  color:var(--muted);font-size:.95rem}
.spk{border:1px solid var(--line);background:var(--surface);border-radius:999px;
  width:2.7rem;height:2.7rem;display:inline-flex;align-items:center;justify-content:center;
  cursor:pointer;flex:none;box-shadow:var(--shadow)}
.spk:hover{border-color:var(--accent);color:var(--accent)}
.spk.sm{width:2.1rem;height:2.1rem}
.spk.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.opts{display:grid;gap:.6rem;margin-top:.9rem}
@media(min-width:560px){.opts.two{grid-template-columns:1fr 1fr}}
.opt{display:flex;align-items:center;gap:.6rem;text-align:start;width:100%;
  border:2px solid var(--line);background:var(--surface);border-radius:12px;
  padding:.8rem .9rem;cursor:pointer;font-size:1.02rem;font-weight:600;min-height:3.1rem}
.opt:hover{border-color:var(--accent)}
.opt .k{width:1.9rem;height:1.9rem;border-radius:8px;background:var(--surface2);
  display:inline-flex;align-items:center;justify-content:center;font-size:.85rem;
  font-weight:800;color:var(--muted);flex:none}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .k{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .k{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.55}
/* בחירה במבחן היא בחירה, לא תשובה נכונה. במסכי התרגול הצבע
   הירוק אומר "צדקת", ובמבחן אסור לו להופיע כלל — הוא נותן
   משוב שגוי לכל בחירה. ניטרלי, ורק מסמן מה סומן. */
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);margin-inline-start:3px}
.dot.ok{background:var(--ok);border-color:var(--ok)}
.dot.no{background:var(--bad);border-color:var(--bad)}
.dot.flag{box-shadow:0 0 0 2px var(--accent)}

/* אריחי בניית משפט. הסדר הוא התרגיל, ולכן האריח חייב להיראות כמשהו
   שאפשר להרים — מסגרת מלאה ורקע משלו, לא טקסט על רקע הכרטיס. */
.tiles{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:.7rem}
.tile{font-family:var(--en);direction:ltr;border:2px solid var(--line);
  background:var(--surface);border-radius:10px;padding:.5rem .8rem;font-weight:600;
  cursor:pointer;font-size:1.02rem;min-height:2.7rem}
.tile:hover{border-color:var(--accent)}
.slot{min-height:3.2rem;border:2px dashed var(--line);border-radius:12px;
  background:var(--surface2);padding:.5rem;display:flex;flex-wrap:wrap;gap:.45rem;
  align-items:center;direction:ltr}
.slot.ok{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.slot.bad{border-style:solid;border-color:var(--bad);background:var(--bad-soft)}
.slot .tile{background:var(--surface)}

/* ===== משוב ===== */
.fb{margin-top:.9rem;border-radius:12px;padding:.85rem 1rem;border:1px solid transparent}
.fb.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.fb.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.fb b{display:block;font-size:1.02rem;margin-bottom:.2rem}
.fb .body{color:var(--ink);font-weight:500;font-size:.95rem}
.why{margin-top:.55rem;padding-top:.55rem;border-top:1px dashed currentColor;color:var(--ink);
  font-weight:500;font-size:.93rem}

/* ===== קטע קריאה ===== */
/* איור בתוך כרטיס שאלה. הצבע יורש מ-color, ולכן אותו SVG נראה
   נכון גם בערכה הבהירה וגם בכהה בלי גרסה שנייה. */
.figure{margin:.7rem 0;padding:.6rem;border:1px solid var(--line);border-radius:12px;
  background:var(--surface2);color:var(--ink);overflow-x:auto}
.figure svg{display:block;max-width:100%}
/* המבחן המדומה: השאלות זו אחר זו, כמו חוברת בחינה. */
.simq{border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;margin:.8rem 0;
  background:var(--surface)}
.simq.miss{border-color:var(--warn)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.simn{font-weight:800;color:var(--muted);font-size:.86rem}
.simbar{position:sticky;top:0;z-index:5;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:.6rem .8rem;margin:.8rem 0;display:flex;gap:.6rem;
  align-items:center;flex-wrap:wrap;box-shadow:var(--shadow)}
.clock{font-weight:800;font-variant-numeric:tabular-nums;font-size:1.1rem}
.clock.low{color:var(--bad)}
.passage{background:var(--surface2);border-radius:12px;padding:1rem 1.1rem;margin:.6rem 0;
  font-family:var(--en);direction:ltr;unicode-bidi:isolate;font-size:1.08rem;line-height:2}
.passage .s{border-radius:5px;padding:.05em .12em;cursor:pointer}
.passage .s:hover{background:var(--accent-soft)}
.passage .s.now{background:var(--accent-soft);box-shadow:0 2px 0 var(--accent)}
.wd{border-radius:5px;padding:1px 3px}
.wd.hit{background:var(--hit);color:var(--hit-ink);font-weight:600}
/* כשמנוע הדיבור אינו מדווח על גבולות מילים — קורה הרבה בעברית
   באנדרואיד — אין מה להדגיש מילה־מילה, ואז מודגש כל האיבר. הכלל
   שקיים כאן מכוון למשפט בתוך קטע קריאה בלבד, ולכן ההדגשה החלופית
   על איבר אחר לא נראתה כלל. */
.wd.now,p.now,div.now,span.now,b.now{background:var(--hit);color:var(--hit-ink);
  border-radius:8px;box-shadow:0 0 0 4px var(--hit)}
.gloss{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.5rem}
.gword{border:1px solid var(--line);background:var(--surface);border-radius:999px;
  padding:.25rem .6rem;font-size:.85rem;cursor:pointer}
.gword b{font-family:var(--en);direction:ltr;unicode-bidi:isolate}

/* ===== סרגל מצב הקול ===== */
.vstrip{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;border-radius:10px;
  padding:.45rem .7rem;font-size:.85rem;font-weight:600;margin-bottom:.7rem}
.vstrip.ok{background:var(--ok-soft);color:var(--ok)}
.vstrip.warn{background:var(--warn-soft);color:var(--warn)}
.vstrip.bad{background:var(--bad-soft);color:var(--bad)}
.vstrip .btn{padding:.3rem .7rem;min-height:44px;font-size:.82rem}  /* 2.1rem היו 36 פיקסלים — מתחת ליעד המגע */

/* ===== הגדרות ===== */
.row{display:flex;align-items:center;justify-content:space-between;gap:.8rem;
  padding:.7rem 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row:last-child{border-bottom:0}
.row .lab{font-weight:700}
.row .desc{font-size:.85rem;color:var(--muted);font-weight:500}
.sw{width:3.2rem;height:1.8rem;border-radius:999px;background:var(--surface2);
  border:1px solid var(--line);position:relative;cursor:pointer;flex:none}
.sw i{position:absolute;top:.18rem;inset-inline-start:.2rem;width:1.3rem;height:1.3rem;
  border-radius:50%;background:var(--faint);transition:.15s}
.sw.on{background:var(--accent);border-color:var(--accent)}
.sw.on i{inset-inline-start:1.5rem;background:#fff}
.vgrid{display:grid;gap:.5rem;grid-template-columns:1fr}
@media(min-width:560px){.vgrid{grid-template-columns:1fr 1fr}}
.vopt{display:flex;align-items:center;gap:.6rem;border:2px solid var(--line);
  background:var(--surface);border-radius:12px;padding:.6rem .75rem;cursor:pointer;text-align:start}
.vopt.on{border-color:var(--accent);background:var(--accent-soft)}
.vopt .nm{font-weight:700}
.vopt .ds{font-size:.8rem;color:var(--muted)}
input[type=password],input[type=text]{font:inherit;background:var(--surface);color:var(--ink);
  border:1px solid var(--line);border-radius:10px;padding:.6rem .7rem;min-width:0;flex:1;
  direction:ltr;text-align:left}
input[type=range]{width:100%;accent-color:var(--accent)}

var DEMO={on:false,i:0,timer:null,extra:[],bar:null,txt:null,step:null,fill:null,btn:null};

/* עוזרים לתסריט. כולם מחזירים false כשהאיבר אינו על המסך, כדי
   שצעד שלא מצא את מה שחיפש ידלג ולא יפיל את ההדגמה כולה. */
function demoEl(s){return typeof s==="string"?document.querySelector(s):s}

  var e=demoEl(s); if(!e)return false;
  try{e.scrollIntoView({behavior:"smooth",block:"center"})}catch(err){try{e.scrollIntoView()}catch(err2){}}
  return true;
}

   מה קרה. לכן אין צעד קצר מ-1200 אלפיות בתסריטים. */

  var e=demoEl(s); if(!e||e.disabled)return false;
  demoShow(e);
  e.classList.add("demo-tap");
  DEMO.extra.push(setTimeout(function(){
    e.classList.remove("demo-tap");

/* ESC יוצא. הקשבה בשלב הלכידה, כדי שמסך שכבר מטפל ב-Escape
   לא יבלע את המקש לפני שההדגמה ראתה אותו. */
function demoKey(e){
  if(!DEMO.on)return;
  if(e.key==="Escape"||e.keyCode===27){
    e.preventDefault(); e.stopPropagation();
    demoStop();
  }
}

function demoStart(){
  if(DEMO.on)return;
  DEMO.on=true; DEMO.i=0;
  DEMO.btn.hidden=true; DEMO.bar.hidden=false;
  document.documentElement.classList.add("demo-running");
  demoNext();
}

function demoNext(){
  if(!DEMO.on)return;
  if(DEMO.i>=DEMO_SCRIPT.length){demoStop();return}
  var it=DEMO_SCRIPT[DEMO.i++]||{};
  var d=Math.max(600,it.duration||3000);
  DEMO.txt.textContent=it.subtitle||"";
  DEMO.step.textContent=DEMO.i+" / "+DEMO_SCRIPT.length;
  DEMO.fill.style.transition="none"; DEMO.fill.style.width="0";
  void DEMO.fill.offsetWidth;
  DEMO.fill.style.transition="width "+d+"ms linear";
  DEMO.fill.style.width="100%";
  if(typeof it.action==="function"){
    try{it.action()}catch(err){if(window.console)console.warn("demo:",err)}
  }
  DEMO.timer=setTimeout(demoNext,d);
}

function demoStop(){
  DEMO.on=false;
  if(DEMO.timer){clearTimeout(DEMO.timer);DEMO.timer=null}
  DEMO.extra.forEach(function(t){clearTimeout(t);clearInterval(t)});
  DEMO.extra=[];
  var m=document.querySelectorAll(".demo-tap"),i;
  for(i=0;i<m.length;i++)m[i].classList.remove("demo-tap");
  if(DEMO.bar)DEMO.bar.hidden=true;
  if(DEMO.btn)DEMO.btn.hidden=false;
  document.documentElement.classList.remove("demo-running");
  demoQuiet();
}

/* שער התנאים הוא חלון מודאלי מעל הכול. כפתור הדגמה מתחתיו היה
   מפעיל אפליקציה שאי אפשר לראות, ולכן ממתינים שייסגר. */
function demoMount(){
  if(document.querySelector(".lg-wrap")){setTimeout(demoMount,500);return}
  if(!document.getElementById("demo-start"))demoMountUI();
}

if(DEMO_ON){
  if(document.readyState==="complete")setTimeout(demoMount,0);
  else window.addEventListener("load",function(){setTimeout(demoMount,0)});
}

function blankState(){
  return {
    lang:null,            /* נקבע לפי שפת הדפדפן בהפעלה הראשונה */
    screen:"home", topic:null, level:1,
    voiceMode:"device",   /* "device" | "gem" */
    gemVoice:"Kore",
    devVoice:{},          /* קוד שפה → voiceURI שנבחר ידנית */
    rate:0.95,
    big:false, clear:false, spaced:false, hc:false, rm:false, theme:"auto",
    stats:{},             /* topic|level → {seen,ok,bad} */
    item:{},              /* מזהה פריט → {n,ok} — בסיס לחזרה מרווחת */
    /* בנק הטעויות. מזהה פריט → מספר התשובות הנכונות ברצף מאז
       הטעות. הפריט יוצא מהבנק בשתיים, ולא באחת: תשובה נכונה
       אחת אחרי טעות היא לרוב זיכרון של המסך הקודם. */
    bad:{},
    day:{d:"",n:0}, streak:0, lastDay:"", totalOk:0, totalAsk:0
  };
}
var state=blankState();

function load(){
  try{
    var raw=localStorage.getItem(SKEY); if(!raw)return;
    var o=JSON.parse(raw); if(!o||typeof o!=="object")return;
    Object.keys(blankState()).forEach(function(k){if(o[k]!==undefined)state[k]=o[k]});
  }catch(e){}
  if(!LANGS[state.lang])state.lang=guessLang();
  if(GEM_VOICES.every(function(v){return v.id!==state.gemVoice}))state.gemVoice="Kore";
  state.rate=clamp(Number(state.rate)||0.95,0.6,1.3);
}
function save(){try{localStorage.setItem(SKEY,JSON.stringify(state))}catch(e){}}

/* שפת הדפדפן, לא ברירת מחדל עברית. מי שפותח את האפליקציה במכשיר
   ברוסית לא אמור להיתקל קודם במסך בעברית שאינו יכול לקרוא. */
/* אנגלית אינה סימן. טלפון בישראל מדווח אנגלית כברירת מחדל של
   המכשיר, לא כבחירה, והאפליקציה נפתחה באנגלית למי שבא ללמוד
   בעברית. ערבית ורוסית כן נחשבות — שם זו שפת אם של ממש. מי
   שרוצה אנגלית בוחר אותה, והבחירה נשמרת. */
function guessLang(){
  var ls=(navigator.languages||[navigator.language||"he"]).map(function(x){
    return String(x).toLowerCase().split("-")[0]});
  for(var i=0;i<ls.length;i++){
    var c=ls[i]==="iw"?"he":ls[i];
    if(c==="en")continue;
    if(LANGS[c])return c;
  }
  return "he";
}
function touchDay(){
  var d=todayIso();
  if(state.day.d!==d){
    var y=new Date(Date.now()-86400000);
    var yi=y.getFullYear()+"-"+String(y.getMonth()+1).padStart(2,"0")+"-"+String(y.getDate()).padStart(2,"0");
    state.streak=(state.lastDay===yi)?(state.streak||0)+1:1;
    state.lastDay=d; state.day={d:d,n:0};
  }
}
function stKey(tid,lv){return tid+"|"+lv}
function stOf(tid,lv){
  var k=stKey(tid,lv);
  if(!state.stats[k])state.stats[k]={seen:0,ok:0,bad:0};
  return state.stats[k];
}
function mastery(tid,lv){
  var s=state.stats[stKey(tid,lv)];
  if(!s||!s.seen)return 0;
  return clamp(s.ok/Math.max(6,s.seen),0,1);
}
function barCls(m){return m>=.75?"b2":m>=.4?"b1":"b0"}

function applyModes(){
  var r=document.documentElement;

  r.style.setProperty("--fs",state.big?"20px":"17px");

  r.classList.toggle("spaced",!!state.spaced);
  r.classList.toggle("hc",!!state.hc);
  r.classList.toggle("rm",!!state.rm);
  if(state.theme==="auto")r.removeAttribute("data-theme");
  else r.setAttribute("data-theme",state.theme);
  /* הכותרת נשארה עברית קשיחה מה-HTML גם אחרי החלפת שפה: הכיווניות

     האפליקציה המותקנת נשארו בעברית. השם והתיאור כבר מתורגמים. */
  try{ document.title=t("app")+" — "+t("tagline") }catch(e){}
}

function bestVoice(code){
  var pool=voicesFor(code); if(!pool.length)return null;
  /* בחירה ידנית גוברת על הניקוד. היא נשמרת לכל שפה בנפרד:
     קול שנבחר לעברית אינו רלוונטי כשמדברים אנגלית. */
  var want0=(state.devVoice||{})[code];
  if(want0){var hit=pool.filter(function(v){return v.voiceURI===want0})[0]; if(hit)return hit}
  var want=String(code).toLowerCase();
  var pref=state.gemVoice&&gvOf(state.gemVoice).g==="m"?"m":"f";
  function score(v){
    var s=0,n=((v.name||"")+" "+(v.lang||"")).toLowerCase();
    if(String(v.lang||"").replace("_","-").toLowerCase()===want)s+=12;
    if(/\b(google|microsoft|apple)\b/.test(n))s+=30;
    if(/natural|neural|enhanced|premium|wavenet|siri/.test(n))s+=22;
    if(/espeak|compact|pico/.test(n))s-=40;
    if(v.default)s+=4;
    return s;
  }
  /* המגדר אינו עוד סעיף בתוך הניקוד אלא המיון הראשון. עשר נקודות
     נבלעו מול שלושים על שם יצרן, וקול גברי ממותג ניצח קול נשי
     שקיים באותו מכשיר — בדיוק מה שהעדפת המגדר הייתה אמורה למנוע.
     קודם הקולות במגדר המבוקש, אחריהם מי שלא זוהה, ורק אז ההפוך;
     ובתוך כל קבוצה מכריעה האיכות. */
  function grank(v){var g=vGender(v);return g===pref?2:g==="?"?1:0}
  return pool.slice().sort(function(a,b){
    var d=grank(b)-grank(a); return d||score(b)-score(a);
  })[0];
}

function pcmToWav(b64){
  try{
    var bin=atob(b64),len=bin.length,buf=new Uint8Array(len),i;
    for(i=0;i<len;i++)buf[i]=bin.charCodeAt(i);
    var sr=24000,ch=1,bits=16,dl=len,hdr=new ArrayBuffer(44+dl),v=new DataView(hdr);
    function ws(o,s){for(var j=0;j<s.length;j++)v.setUint8(o+j,s.charCodeAt(j))}
    ws(0,"RIFF");v.setUint32(4,36+dl,true);ws(8,"WAVE");ws(12,"fmt ");
    v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,ch,true);
    v.setUint32(24,sr,true);v.setUint32(28,sr*ch*bits/8,true);
    v.setUint16(32,ch*bits/8,true);v.setUint16(34,bits,true);
    ws(36,"data");v.setUint32(40,dl,true);
    new Uint8Array(hdr,44).set(buf);
    var bytes=new Uint8Array(hdr),out="";
    for(var k=0;k<bytes.length;k+=8192)out+=String.fromCharCode.apply(null,bytes.subarray(k,k+8192));
    return "data:audio/wav;base64,"+btoa(out);
  }catch(e){return null}
}

function gSynth(text,voiceName,rate,lang){
  var L=GEM_LEAD[lang]||GEM_LEAD.en;
  var lead=rate<=0.7?L.slow:rate<=0.9?L.soft:rate>=1.15?L.fast:L.norm;
  var body={contents:[{parts:[{text:lead+text}]}],
    generationConfig:{responseModalities:["AUDIO"],
      speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:voiceName}}}}};
  return fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key="+
      encodeURIComponent(GKEY),
    {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})
  .then(function(r){
    if(r.ok)return r.json();
    return r.text().then(function(tx){
      var m="";try{var j=JSON.parse(tx);m=(j.error&&j.error.message)||""}catch(e){m=String(tx).slice(0,140)}
      throw new Error(r.status+(m?" — "+m:""));
    });
  })
  .then(function(d){
    var parts=(d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts)||[];
    for(var i=0;i<parts.length;i++){
      var pd=parts[i].inlineData;
      if(pd&&pd.data){
        var mt=pd.mimeType||"";
        if(mt.indexOf("wav")>=0||mt.indexOf("pcm")>=0||mt.indexOf("L16")>=0)
          return pcmToWav(pd.data)||("data:audio/wav;base64,"+pd.data);
        return "data:audio/mp3;base64,"+pd.data;

var HL={el:null,raw:"",spans:[],map:[],timer:null,got:false,added:false};
function hlClear(){
  if(HL.timer){clearTimeout(HL.timer);HL.timer=null}
  if(HL.el){try{HL.el.innerHTML=HL.raw;HL.el.classList.remove("now")}catch(e){}}
  HL={el:null,raw:"",spans:[],map:[],timer:null,got:false,added:false};
}
/* האיבר שמציג בדיוק את המחרוזת הזאת. מדלגים על איברים שמכילים
   כפתור — החלפת ה-HTML שלהם הייתה מוחקת את כפתור ההשמעה עצמו. */
function hlFind(btn,text){
  var want=String(text||"").replace(/\s+/g," ").trim();
  if(!want||!btn)return null;
  var box=(btn.closest&&btn.closest(".subject,.qcard,.fb,.passage,.card"))||document.body;
  var cand=box.querySelectorAll(".word,.s,span,p,b");
  for(var i=0;i<cand.length;i++){
    if(cand[i].querySelector("button"))continue;
    if((cand[i].textContent||"").replace(/\s+/g," ").trim()===want)return cand[i];
  }
  return null;
}
/* כשאין איבר יחיד שמציג בדיוק את המחרוזת — למשל בפאנל התשובה,
   שבו המשפט הנאמר מורכב מכותרת ומתיאור בשני איברים — אי אפשר
   למפות מילים. מדגישים את הכרטיס כולו, כדי שיהיה משוב כלשהו
   במקום שום דבר. */
function hlWhole(el){
  hlClear();
  if(!el)return;
  HL.el=el; HL.raw=el.innerHTML; HL.added=true;
  el.classList.add("now");
}
function hlPrep(el,text){
  hlClear();
  if(!el||!text)return;
  HL.el=el; HL.raw=el.innerHTML;
  var parts=String(text).split(/(\s+)/),html="",pos=0,idx=0;
  HL.map=[];
  for(var i=0;i<parts.length;i++){
    var pt=parts[i];
    if(!pt.length)continue;
    if(/^\s+$/.test(pt)){html+=pt;pos+=pt.length;continue}
    HL.map.push({from:pos,to:pos+pt.length,i:idx});
    html+='<span class="wd" data-i="'+idx+'">'+esc(pt)+'</span>';
    pos+=pt.length; idx++;
  }
  if(!HL.map.length){hlClear();return}
  el.innerHTML=html;
  HL.spans=el.querySelectorAll(".wd");
  HL.timer=setTimeout(function(){if(!HL.got&&HL.el){HL.added=true;HL.el.classList.add("now")}},1500);
}
function hlAt(c){
  if(!HL.el||!HL.map.length)return;
  HL.got=true;
  if(HL.timer){clearTimeout(HL.timer);HL.timer=null}
  if(HL.added){HL.el.classList.remove("now");HL.added=false}
  for(var k=0;k<HL.map.length;k++){
    if(c>=HL.map[k].from&&c<HL.map[k].to){
      for(var j=0;j<HL.spans.length;j++)HL.spans[j].classList.toggle("hit",j===HL.map[k].i);
      return;
    }
  }
}

function ttsFail(err){
  /* "interrupted" ו-"canceled" אינן תקלות: זה מה שהמנוע מדווח על
     אמירה שבוטלה כדי לפנות מקום לאמירה הבאה — כלומר מהלך תקין
     לגמרי, שקורה בכל לחיצה שנייה. הצגתן כשגיאה הבהילה משתמש
     ואמרה לו שהמכשיר שלו שבור בזמן שהוא עבד.
     גם ניקוי ההדגשה חייב לבוא אחרי היציאה הזאת ולא לפניה: הביטול
     של האמירה הקודמת מגיע אחרי שהאמירה החדשה כבר הכינה את ההדגשה
     שלה, וניקוי כאן מחק אותה מיד. */
  if(err==="interrupted"||err==="canceled")return;
  try{ hlClear() }catch(e){}
  if(_ttsBar)return;
  var _g="he"; try{_g=state.lang||"he"}catch(e){} if(!TTSMSG[_g])_g="he";
  var TT=TTSMSG[_g];
  var m=document.createElement("div");
  m.setAttribute("role","alert");
  m.id="tts-fail";
  m.dir=TT.dir;
  m.style.cssText="position:fixed;inset-inline:10px;bottom:10px;z-index:99999;"+
    "background:#7f1d1d;color:#fff;padding:13px 15px;border-radius:12px;"+
    "font:600 15px/1.55 system-ui,Arial,sans-serif;box-shadow:0 10px 34px rgba(0,0,0,.45);"+
    "display:flex;gap:10px;align-items:flex-start";
  var t=document.createElement("div");
  t.style.cssText="flex:1;min-width:0";
  t.innerHTML=TT.msg+
    (err?" <span dir=ltr>("+String(err)+")</span>":"")+
    TT.tail+
    '<a href="/voice/" style="color:#fff">'+TT.link+'</a>';
  var x=document.createElement("button");
  x.type="button"; x.textContent="✕"; x.setAttribute("aria-label",TT.close);
  x.style.cssText="min-width:44px;min-height:44px;border:0;border-radius:9px;"+
    "background:rgba(255,255,255,.16);color:#fff;font-size:16px;cursor:pointer";
  x.onclick=function(){ if(_ttsBar&&_ttsBar.parentNode)_ttsBar.parentNode.removeChild(_ttsBar); _ttsBar=null };
  m.appendChild(t); m.appendChild(x);
  document.body.appendChild(m); _ttsBar=m;
}
/* הקראה שהצליחה מסירה את ההודעה — המצב השתנה */
function ttsOK(){ if(_ttsBar&&_ttsBar.parentNode){_ttsBar.parentNode.removeChild(_ttsBar);_ttsBar=null} }


/* ------------------------------------------------------------
   פיצול לאמירות קצרות — הועתק מ"תאוריה מדברת", שם ההקראה נשמעת
   הכי טוב. מנועי מכשיר מאיצים ובולעים סופי מילים במשפט ארוך;
   כאן נשלחה שאלה שלמה באמירה אחת, לפעמים 300 תווים.
   כל מקטע נושא את ההיסט שלו במחרוזת המלאה, כי charIndex מתאפס
   בכל אמירה ובלעדיו ההדגשה קופצת לתחילת המשפט בכל מקטע.
   ------------------------------------------------------------ */
var SEG_MAX=90, SEG_GAP=260;
/* סימן פיסוק בין שתי ספרות הוא חלק מהמספר ולא מקום לחתוך בו:
   בלי הבדיקה הזאת "3,500" נשבר והמנוע קורא "שלוש, חמש מאות". */
function insideNumber(str,i){
  return i>0&&i+1<str.length&&/[0-9]/.test(str[i-1])&&/[0-9]/.test(str[i+1]);
}
function segments(spoken){
  var out=[],parts=[],from=0,i,j;
  function push(t,start){ if(String(t).trim())out.push({text:t,start:start}) }
  for(i=0;i<spoken.length;i++){
    if(".!?:;".indexOf(spoken[i])<0)continue;
    if(insideNumber(spoken,i))continue;
    j=i+1; while(j<spoken.length&&/\s/.test(spoken[j]))j++;
    parts.push({text:spoken.slice(from,j),start:from});
    from=j; i=j-1;
  }
  if(from<spoken.length)parts.push({text:spoken.slice(from),start:from});
  for(var k=0;k<parts.length;k++){
    var p=parts[k];
    if(p.text.length<=SEG_MAX){ push(p.text,p.start); continue }
    var rest=p.text,base=p.start;
    while(rest.length>SEG_MAX){
      var cut=rest.lastIndexOf(",",SEG_MAX);
      while(cut>0&&insideNumber(rest,cut))cut=rest.lastIndexOf(",",cut-1);
      if(cut<SEG_MAX*0.4)cut=rest.lastIndexOf(" ",SEG_MAX);
      if(cut<=0)break;
      push(rest.slice(0,cut+1),base);
      base+=cut+1; rest=rest.slice(cut+1);
    }
    push(rest,base);
  }
  /* מקטע זעיר — "12." או ")" — עם הפסקה של רבע שנייה אחריו נשמע
     כמו גמגום. מאחדים אותו לזה שאחריו. */
  var merged=[];
  for(i=0;i<out.length;i++){
    if(merged.length&&out[i].text.trim().length<12&&
       merged[merged.length-1].text.length+out[i].text.length<=SEG_MAX*1.4){
      merged[merged.length-1].text+=out[i].text; continue;
    }
    if(out[i].text.trim().length<12&&i+1<out.length){
      out[i+1]={text:out[i].text+out[i+1].text,start:out[i].start}; continue;
    }
    merged.push(out[i]);
  }
  out=merged;
  return out.length?out:[{text:spoken,start:0}];
}
/* קצב לפי שפה — אותם ערכים שנבחרו בתאוריה מדברת אחרי האזנה */
var VOICE_TUNE={he:0.82,ar:0.85,en:0.90,ru:0.88};
function tuneRate(lang,rate){
  var t=VOICE_TUNE[String(lang||"he").split("-")[0].toLowerCase()]||0.88;
  var r=t*(rate||1);
  return Math.max(0.5,Math.min(1.6,Math.round(r*100)/100));
}


/* ------------------------------------------------------------
   כשאין במכשיר קול נשי בשפה הנוכחית — ווינדוס עם Asaf בלבד הוא
   המקרה הנפוץ בעברית — מרימים את גובה הקול. זה לא קול נשי אמיתי,
   וגם לא מתיימר להיות: זו הדרך היחידה בדפדפן להזיז קול גברי לכיוון
   הנשי בלי הקלטות ובלי שירות חיצוני. מי שמתקין קול נשי מקבל אותו
   מיד ובלי שינוי הגובה.
   ------------------------------------------------------------ */
var FEM_PITCH=1.35;
function femLift(v){
  if(!v)return 1;
  try{ return vGender(v)==="m"?FEM_PITCH:1 }catch(e){ return 1 }
}


/* ------------------------------------------------------------
   בדיקת קול בתוך האפליקציה. הפשוטה ביותר שאפשר: אמירה אחת,
   בתוך הלחיצה, בלי מילון, בלי בחירת קול ובלי שום שכבה — ומדווחת
   על המסך מה קרה. יום שלם אבד כי כשלא היה קול, שום דבר לא אמר למה.
   ------------------------------------------------------------ */
var VCHK="";
/* ------------------------------------------------------------
   תוצאת בדיקת הקול, בארבע שפות. הכפתור היה מתורגם והתשובה לא:
   מי שהקול לא עובד לו ואינו קורא עברית קיבל הודעת תקלה בעברית —
   בדיוק המשתמש שהבדיקה נועדה לו. טבלה נפרדת ולא TR_KEYS, כדי לא
   להזיז אינדקסים, ומפני ש-math-teen מתרגם לערבית בלבד.
   ------------------------------------------------------------ */
var VCHKMSG={
  he:{sent:"נשלח…",noSup:"✗ הדפדפן הזה לא תומך בהקראה",mkFail:"✗ יצירת האמירה נכשלה: ",
      okN:["✓ הקול פועל — "," קולות במכשיר"],ok:"✓ הקול פועל",unk:"לא ידוע",
      engine:["✗ המנוע החזיר "," קולות · זו תקלה במכשיר, לא באפליקציה"],
      spFail:"✗ speak נכשל: ",timeout:["✗ שתי שניות ואין תגובה מהמנוע · "," קולות במכשיר"],
      say:"שלום, זו בדיקת קול"},
  ar:{sent:"جارٍ الإرسال…",noSup:"✗ هذا المتصفّح لا يدعم القراءة الصوتية",mkFail:"✗ فشل إنشاء النطق: ",
      okN:["✓ الصوت يعمل — "," صوتًا في الجهاز"],ok:"✓ الصوت يعمل",unk:"غير معروف",
      engine:["✗ أعاد المحرّك "," صوتًا · هذا عطل في الجهاز، لا في التطبيق"],
      spFail:"✗ فشل speak: ",timeout:["✗ ثانيتان بلا ردّ من المحرّك · "," صوتًا في الجهاز"],
      say:"مرحبًا، هذا فحص صوت"},
  ru:{sent:"Отправляем…",noSup:"✗ Этот браузер не поддерживает озвучивание",mkFail:"✗ Не удалось создать реплику: ",
      okN:["✓ Голос работает — голосов: ",""],ok:"✓ Голос работает",unk:"неизвестно",
      engine:["✗ Синтезатор вернул "," голосов · это неполадка устройства, а не приложения"],
      spFail:"✗ speak не сработал: ",timeout:["✗ Две секунды без ответа от синтезатора · "," голосов"],
      say:"Здравствуйте, это проверка голоса"},
  en:{sent:"Sending…",noSup:"✗ This browser does not support read-aloud",mkFail:"✗ Could not create the utterance: ",
      okN:["✓ The voice works — "," voices on this device"],ok:"✓ The voice works",unk:"unknown",
      engine:["✗ The engine returned "," voices · this is a device fault, not an app fault"],
      spFail:"✗ speak failed: ",timeout:["✗ Two seconds and no response from the engine · "," voices on this device"],
      say:"Hello, this is a voice check"}
};
function vchkT(){ var g=state.lang||"he"; return VCHKMSG[g]||VCHKMSG.he }
function voiceCheck(){
  var M=vchkT();
  VCHK=M.sent; render();
  function show(m){ VCHK=m; render() }
  if(!("speechSynthesis" in window)){ show(M.noSup); return }
  var list=[]; try{ list=speechSynthesis.getVoices()||[] }catch(e){}
  try{ speechSynthesis.cancel() }catch(e){}
  var u;
  try{ u=new SpeechSynthesisUtterance(M.say) }
  catch(e){ show(M.mkFail+e.message); return }
  u.lang=(LANGS[state.lang||"he"]||LANGS.he).tts; u.volume=1; u.rate=1; u.pitch=1;
  var done=false;
  u.onstart=function(){ done=true; show(M.okN[0]+list.length+M.okN[1]) };
  u.onerror=function(e){ done=true;
    var er=(e&&e.error)||M.unk;
    if(er==="interrupted"||er==="canceled"){ show(M.ok); return }
    show(M.engine[0]+er+" · "+list.length+M.engine[1]); };
  try{ speechSynthesis.speak(u) }
  catch(e){ show(M.spFail+e.message); return }
  setTimeout(function(){ if(!done)
    show(M.timeout[0]+list.length+M.timeout[1]) },2000);
}

/* ------------------------------------------------------------
   דור ההקראה. speechSynthesis.cancel() אינו מבטל setTimeout:
   כרום יורה onend על האמירה שבוטלה, המקטע הבא נרשם בכל זאת,
   וכעבור SEG_GAP ההקראה הישנה חוזרת מעל החדשה — שני קולות
   במקביל. מונה אחד פותר את זה: כל הקראה מקבלת מספר, stopSpeak
   מקדם אותו, ומקטע מדור ישן פשוט אינו מדבר.
   ------------------------------------------------------------ */
var _sayGen=0;
function speakDevice(text,code,rate){
  if(!("speechSynthesis" in window))return false;
  try{speechSynthesis.cancel()}catch(e){}
  var my=++_sayGen;
  /* האמירה יוצאת מיד, בתוך הלחיצה. קודם היא נעטפה ב-voicesReady,
     שממתין לרשימת הקולות ועד ארבע שניות אם היא לא מגיעה — ואמירה
     שיוצאת ארבע שניות אחרי המגע נזרקת בשקט באנדרואיד ובספארי.
     כשהרשימה כבר כאן, בוחרים קול ומדברים. כשהיא ריקה — מדברים
     בכל זאת, עם u.lang בלבד: קול ברירת מחדל בשפה הנכונה עדיף על
     שתיקה, ויש מכשירים שמחזירים רשימה ריקה לצמיתות ומדברים היטב.
     voicesReady נשאר בשימוש למסך בחירת הקול, שם ההמתנה במקומה. */
  (function(){
    try{
      var v=bestVoice(code), lang=(v&&v.lang)||code;
      var segs=segments(String(text)), rt=tuneRate(lang,clamp(rate,0.55,1.4));
      var pit=femLift(v);
      (function sayseg(k){
        if(my!==_sayGen)return;   /* ההקראה הזאת בוטלה — המקטע הבא לא יוצא */
        if(k>=segs.length){ hlClear(); ttsOK(); return }
        var seg=segs[k];
        var u=new SpeechSynthesisUtterance(seg.text);
        u.lang=lang;
        if(v){ try{ u.voice=v }catch(e2){} }
        u.rate=rt; u.pitch=pit; u.volume=1;
        u.onboundary=function(e){if(!e.name||e.name==="word")hlAt(seg.start+e.charIndex)};
        u.onend=function(){
          if(k+1<segs.length) setTimeout(function(){sayseg(k+1)},SEG_GAP);
          else { hlClear(); ttsOK() }
        };
        u.onerror=function(e){ttsFail(e&&e.error)};
        speechSynthesis.speak(u);
      })(0);
    }catch(e){}
  })();
  return true;
}
/* lang: "en" לחומר הנלמד, או קוד שפת האם להוראה. */
function speak(text,lang,rateMul){
  /* כל טקסט שמגיע להקראה מנוקה מתגיות. חלק מהקריאות כבר מנקות
     לבד, וניקוי חוזר אינו משנה דבר — אבל בלעדיו כל מחרוזת שנשארה
     עם <sub> או <span class="frac"> הוקראה בקול כתגית: הסטודנט
     שמע "span class frac" באמצע השאלה. */
  text=plainOf(String(text||"")).trim(); if(!text)return;
  lang=lang||"en";
  var code=lang==="en"?EN_TTS:LANGS[lang].tts;
  var rate=clamp(state.rate*(rateMul||1),0.55,1.4);
  stopSpeak();
  var my=_sayGen;   /* גם תשובת רשת שמגיעה אחרי עצירה לא תושמע */
  if(gemOn()){
    var vid=gvOf(state.gemVoice).id;
    var ck=lang+"|"+vid+"|"+rate.toFixed(2)+"|"+text;
    if(gCache[ck]){playUrl(gCache[ck],text,code,rate);return}
    gBusy=true; renderSpeakState();
    gSynth(text,vid,rate,lang).then(function(u){
      if(my!==_sayGen)return;
      gCache[ck]=u; gBusy=false; renderSpeakState(); playUrl(u,text,code,rate);
    }).catch(function(){
      gBusy=false; renderSpeakState(); speakDevice(text,code,rate);
    });
    return;
  }
  speakDevice(text,code,rate);
}
function playUrl(url,text,code,rate){
  gStop();
  /* משתמשים באלמנט ששוחרר במגע ולא יוצרים חדש. */
  if(!GEL)GEL=new Audio();
  gAudio=GEL; gAudio.src=url;
  gAudio.play().catch(function(){speakDevice(text,code,rate)});
}
function stopSpeak(){_sayGen++;gStop();hlClear();try{if(window.speechSynthesis)speechSynthesis.cancel()}catch(e){}}
/* עוזבים את הדף — הקול נעצר. בלעדיו הוא ממשיך ברקע אחרי מעבר לטאב
   אחר, ולפעמים נתקע עד סגירת הדפדפן. */
try{document.addEventListener("visibilitychange",function(){
  if(document.hidden)stopSpeak();
});}catch(e){}
/* iOS לא ישמיע כלום עד שאמירה אחת יצאה מתוך handler של מגע אמיתי.
   אמירה אוטומטית בטעינת הדף נבלעת בשקט — בלי חריגה, בלי לוג, בלי
   דרך לדעת. משחררים פעם אחת עם אמירה ריקה.
   חשוב: קריאה ישירה, בלי voicesReady — הבטחה שוברת את שרשרת המגע
   ו-Safari כבר לא יזהה את האמירה כיוזמת משתמש. */
try{document.addEventListener("pointerdown",function(){
  try{speechSynthesis.speak(new SpeechSynthesisUtterance(""))}catch(e){}
  /* ואותו דבר לאלמנט השמע: מקור שקט, play בתוך המגע עצמו. */
  try{
    if(!GEL)GEL=new Audio();
    GEL.src=SILENT_WAV;
    var pr=GEL.play();
    if(pr&&pr.then)pr.then(function(){try{GEL.pause();GEL.currentTime=0}catch(e){}},function(){});
  }catch(e){}
},{once:true});}catch(e){}
function renderSpeakState(){
  var b=document.querySelectorAll(".spk");
  for(var i=0;i<b.length;i++)b[i].classList.toggle("on",gBusy);
}

/* ============================================================
   7. תוכן
   ------------------------------------------------------------
   בנק שאלות כתוב, ולא מחולל. באזרחות אין נוסחה שממנה נגזרת
   שאלה: הניסוח המדויק הוא החומר הנלמד, ומסיח שנבנה אוטומטית
   מנוסח אחר היה יוצא או מופרך מדי או נכון בעצמו.

   Q(id, q, opts, ok, hint, ex, fig)
     id   — מזהה יציב לפריט. הוא נכנס לסטטיסטיקה של הלומד, ולכן
            אסור לו להשתנות כשמוסיפים פריט לפניו.
     q    — נוסח השאלה, בארבע שפות.
     opts — ארבע תשובות, כל אחת בארבע שפות. תמיד ארבע: שלוש
            אפשרויות הן ניחוש של אחד משלושה.
     ok   — אינדקס התשובה הנכונה במערך opts (0..3). הסדר על
            המסך מעורבב בכל הצגה, ולכן האינדקס אינו רמז.
     hint — רמז שמכוון לחשיבה ואינו מוסר את התשובה.
     ex   — ההסבר שנפתח אחרי המענה, גם כשענו נכון.
     fig  — מפתח איור מתוך FIGS, או null. אופציונלי בהגדרה:
            רוב השאלות באזרחות הן טקסט בלבד.

   כל שדה קיים בארבע השפות. אזרחות נלמדת בשפת האם — מי שקורא
   בקושי בעברית לא ילמד ממנה מדרג נורמות, ולכן התוכן עצמו
   מתורגם ולא רק הממשק.

   מקור: תוכנית הלימודים באזרחות של משרד החינוך, "להיות אזרחים
   בישראל". השאלות נכתבו לאפליקציה הזאת ואינן העתק של בחינה.
   ============================================================ */
function Q(id,q,opts,ok,hint,ex,fig){
  return {id:id,q:q,o:opts,ok:ok,hint:hint,ex:ex,fig:fig||null};
}

/* ------------------------------------------------------------
   איורים. SVG בקוד ולא קובץ תמונה: אין בקשת רשת, הם עובדים
   אופליין מהרגע הראשון, והם מקבלים את צבעי הערכה — כולל הכהה.
   הטקסט שבתוכם עובר דרך gl(), ולכן איור נקרא בשפת הלומד.
   ------------------------------------------------------------ */
function figBox(x,y,w,h,label,sub){
  return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="6" '+
    'fill="var(--surface2)" stroke="currentColor" stroke-width="1.2"/>'+
    '<text x="'+(x+w/2)+'" y="'+(y+(sub?h/2-2:h/2+4))+'" text-anchor="middle" '+
    'font-size="10" font-weight="700" fill="currentColor">'+esc(label)+'</text>'+
    (sub?'<text x="'+(x+w/2)+'" y="'+(y+h/2+11)+'" text-anchor="middle" '+

  branches:function(){

      figBox(6,20,88,56,gl(L[0]),gl(S[0]))+
      figBox(106,20,88,56,gl(L[1]),gl(S[1]))+
      figBox(206,20,88,56,gl(L[2]),gl(S[2]))+
      '<path d="M94 48h12M194 48h12" stroke="currentColor" stroke-width="1.2"/>'+
      '</svg>';
  },
  /* מדרג הנורמות — מה גובר על מה */
  pyramid:function(){
    var L=[{he:"חוקי יסוד",ar:"قوانين أساس",ru:"Основные законы",en:"Basic Laws"},
           {he:"חוק",ar:"قانون",ru:"Закон",en:"Statute"},
           {he:"תקנה",ar:"لائحة",ru:"Постановление",en:"Regulation"},
           {he:"הנחיה מנהלית",ar:"تعليمات إدارية",ru:"Административная инструкция",en:"Administrative directive"}];
    var h="",i,w;
    for(i=0;i<4;i++){
      w=90+i*54;
      h+=figBox(150-w/2,6+i*24,w,20,gl(L[i]),"");
    }
    return '<svg viewBox="0 0 300 104" role="img" width="100%" height="104">'+h+'</svg>';
  },
  /* אחוז החסימה: קו אחד, וכל מה שמתחתיו אינו נכנס לכנסת */
  threshold:function(){
    var bars=[["A",7.4],["B",5.1],["C",3.9],["D",2.8],["E",1.6]],h="",i,x,ht;
    for(i=0;i<bars.length;i++){
      x=20+i*54; ht=Math.round(bars[i][1]*8);
      h+='<rect x="'+x+'" y="'+(84-ht)+'" width="34" height="'+ht+'" rx="3" fill="'+
        (bars[i][1]>=3.25?"currentColor":"var(--surface2)")+'" stroke="currentColor" stroke-width="1"/>'+
        '<text x="'+(x+17)+'" y="95" text-anchor="middle" font-size="8" fill="currentColor">'+
        bars[i][1]+'%</text>';
    }
    h+='<path d="M8 58h284" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3"/>'+
       '<text x="8" y="54" font-size="8" fill="currentColor">3.25%</text>';
    return '<svg viewBox="0 0 300 100" role="img" width="100%" height="100" dir="ltr">'+h+'</svg>';
  }
};
function figHtml(k){
  var f=k&&FIGS[k]; if(!f)return "";

}

   [{he:"שלטון החוק ושוויון בפני החוק — החוק חל על כולם באותה מידה.",
     ar:"سيادة القانون والمساواة أمامه — القانون يسري على الجميع بالقدر ذاته.",
     ru:"Верховенство закона и равенство перед ним — закон одинаково распространяется на всех.",
     en:"The rule of law and equality before it — the law applies to everyone alike."},
    {he:"עקרון הכרעת הרוב — הציבור בחר בשר, ולכן הוא שמחליט אילו חקירות ייפתחו ואילו ייסגרו.",
     ar:"مبدأ حكم الأغلبية — الجمهور انتخب الوزير، ولذلك هو مَن يقرّر أيّ التحقيقات تُفتح وأيّها تُغلق.",
     ru:"Принцип решения большинства — общество избрало министра, поэтому именно он решает, какие расследования открывать, а какие закрывать.",
     en:"Majority rule — the public elected the minister, so he is the one who decides which investigations are opened and which are closed."},
    {he:"עקרון הבחירות היחסיות.",ar:"مبدأ الانتخابات النسبية.",ru:"Принцип пропорциональных выборов.",en:"The principle of proportional elections."},
    {he:"עקרון חופש התנועה של חשודים בהליך פלילי.",
     ar:"مبدأ حرية التنقّل للمشتبه بهم في إجراء جنائيّ.",
     ru:"Принцип свободы передвижения подозреваемых в уголовном деле.",
     en:"The freedom of movement of suspects in criminal proceedings."}],
   0,
   {he:"התשובה נמצאת בשאלה מי פטור כאן מהחוק, ולמה.",
    ar:"الجواب في السؤال: مَن أُعفي هنا من القانون، ولماذا.",
    ru:"Ответ в вопросе: кто здесь освобождён от закона и почему.",
    en:"The answer lies in asking who is exempted from the law here, and why."},
   {he:"מי שנחקר או לא נחקר לפי שיוכו הפוליטי הופך את החוק לכלי בידי השלטון. עצמאות אכיפת החוק — משטרה ופרקליטות שאינן כפופות לשיקול פוליטי בתיק מסוים — היא הביטוי המעשי של שלטון החוק.",
    ar:"حين يُحقَّق مع أحد أو لا يُحقَّق بحسب انتمائه السياسيّ، يتحوّل القانون أداة بيد السلطة. استقلال إنفاذ القانون — شرطة ونيابة لا تخضعان لاعتبار سياسيّ في ملفّ بعينه — هو التعبير العمليّ عن سيادة القانون.",
    ru:"Когда расследуют или не расследуют по политической принадлежности, закон становится инструментом власти. Независимость правоприменения — полиция и прокуратура, не подчинённые политическому расчёту в конкретном деле, — это практическое выражение верховенства закона.",
    en:"When someone is investigated, or not, according to political affiliation, the law becomes a tool in the government's hands. Independent law enforcement — police and prosecutors not subject to political calculation in a given file — is the practical expression of the rule of law."},
   null),
  Q("princ-cand",
    {he:"ועדת הבחירות ביקשה לפסול מועמד משום שדעותיו הכלכליות אינן מקובלות על רוב חבריה. מדוע פסילה כזאת אינה דמוקרטית?",
     ar:"طلبت لجنة الانتخابات شطب مرشّح لأن آراءه الاقتصادية لا تروق لأغلبية أعضائها. لماذا هذا الشطب غير ديمقراطيّ؟",
     ru:"Избирательная комиссия захотела снять кандидата, потому что его экономические взгляды не нравятся большинству её членов. Почему такое снятие недемократично?",
     en:"The elections committee sought to disqualify a candidate because most of its members dislike his economic views. Why is such a disqualification undemocratic?"},
   [{he:"מפני שרק בית המשפט העליון מוסמך לפסול מועמד, וועדת הבחירות רשאית רק להמליץ לפניו על פסילה.",
     ar:"لأنّ المحكمة العليا وحدها مخوّلة بشطب مرشّح، ولجنة الانتخابات لا تملك سوى التوصية أمامها بالشطب.",
     ru:"Потому что только Верховный суд вправе снять кандидата, а избирательная комиссия может лишь рекомендовать ему такое решение.",
     en:"Because only the Supreme Court may disqualify a candidate, and the elections committee may merely recommend disqualification to it."},
    {he:"מפני שפסילה מותרת רק בשנת בחירות.",
     ar:"لأن الشطب جائز في سنة انتخابات فقط.",
     ru:"Потому что снятие допустимо только в год выборов.",
     en:"Because disqualification is allowed only in an election year."},
    {he:"מפני שהיא פוגעת בזכות להיבחר ובפלורליזם: הציבור, ולא ועדה, מחליט אם דעה מקובלת עליו.",
     ar:"لأنه يمسّ حقّ الترشّح والتعدّدية: الجمهور، لا لجنة، يقرّر إن كان الرأي مقبولًا عليه.",
     ru:"Потому что оно нарушает право быть избранным и плюрализм: приемлемость взглядов решает общество, а не комиссия.",
     en:"Because it harms the right to stand for election and pluralism: the public, not a committee, decides whether it accepts a view."},
    {he:"מפני שהמועמד לא הגיש את מצעו במועד.",
     ar:"لأن المرشّح لم يقدّم برنامجه في موعده.",
     ru:"Потому что кандидат не подал программу вовремя.",
     en:"Because the candidate did not submit his platform on time."}],
   2,
   {he:"מי אמור להכריע אם דעה ראויה — ועדה או המצביעים?",
    ar:"مَن يُفترض أن يقرّر إن كان الرأي جديرًا — لجنة أم الناخبون؟",
    ru:"Кто должен решать, достоин ли взгляд, — комиссия или избиратели?",
    en:"Who is supposed to decide whether a view is worthy — a committee, or the voters?"},
   {he:"בישראל אפשר לפסול רשימה או מועמד רק בעילות מצומצמות הקבועות בחוק — שלילת קיום המדינה כיהודית ודמוקרטית, הסתה לגזענות, ותמיכה במאבק מזוין נגד המדינה — ובאישור בית המשפט העליון. דעה כלכלית אינה עילה.",
    ar:"في إسرائيل لا يجوز شطب قائمة أو مرشّح إلا بأسباب محصورة يحدّدها القانون — نفي وجود الدولة كيهودية وديمقراطية، التحريض على العنصرية، ودعم كفاح مسلّح ضدّ الدولة — وبمصادقة المحكمة العليا. الرأي الاقتصاديّ ليس سببًا.",
    ru:"В Израиле список или кандидата можно снять лишь по узким основаниям, установленным законом, — отрицание существования государства как еврейского и демократического, подстрекательство к расизму и поддержка вооружённой борьбы против государства — и с утверждения Верховного суда. Экономические взгляды основанием не являются.",
    en:"In Israel a list or a candidate may be disqualified only on narrow statutory grounds — denying the state's existence as Jewish and democratic, incitement to racism, and support for armed struggle against the state — and with the Supreme Court's approval. An economic view is not a ground."},
   null)
 ],
 [ /* רמה 3 — ניתוח */
  Q("princ-demo",
    {he:"הפגנה גדולה חוסמת כביש ראשי לשלוש שעות. איזה איזון נדרש כאן, ומה הכלל המנחה?",
     ar:"مظاهرة كبيرة تُغلق شارعًا رئيسيًّا ثلاث ساعات. أيّ موازنة مطلوبة هنا، وما القاعدة الموجِّهة؟",
     ru:"Крупная демонстрация перекрывает главную дорогу на три часа. Какое равновесие требуется здесь и каково руководящее правило?",
     en:"A large demonstration blocks a main road for three hours. What balance is required here, and what is the guiding rule?"},
   [{he:"אין כאן איזון: חופש ההפגנה מוחלט, ואין להגבילו בשום מצב.",
     ar:"لا موازنة هنا: حرية التظاهر مطلقة ولا تُقيَّد بأيّ حال.",
     ru:"Здесь нет равновесия: свобода демонстраций абсолютна и не ограничивается никогда.",
     en:"There is no balance here: the freedom to demonstrate is absolute and may never be limited."},
    {he:"אין כאן איזון אלא ספירה: חופש התנועה של אלפי נהגים גובר על חופש ההפגנה של מאות מפגינים, ולכן די בכך שהכביש ראשי כדי לאסור בו הפגנה, בלי בחינה נוספת.",
     ar:"لا توازن هنا بل إحصاء: حرية تنقّل آلاف السائقين تتغلّب على حرية تظاهر مئات المتظاهرين، ولذلك يكفي أن يكون الشارع رئيسيًّا كي يُمنع التظاهر فيه، دون فحص إضافيّ.",
     ru:"Здесь не баланс, а подсчёт: свобода передвижения тысяч водителей перевешивает свободу демонстрации сотен участников, и потому достаточно того, что дорога главная, чтобы запретить на ней демонстрацию без дальнейшей проверки.",
     en:"There is no balance here but a count: the freedom of movement of thousands of drivers outweighs the protest rights of hundreds, so the road being a main road is reason enough to ban the demonstration, with no further examination."},
    {he:"איזון בין חופש ההפגנה לחופש התנועה. מגבילים במידה — מסלול, שעה ומשך — ולא אוסרים כליל, כי הגבלה חייבת להיות המצומצמת ביותר שמשיגה את התכלית.",
     ar:"موازنة بين حرية التظاهر وحرية التنقّل. يُقيَّد بالقدر المناسب — مسار وساعة ومدّة — ولا يُمنع كليًّا، لأن التقييد يجب أن يكون الأضيق الذي يحقّق الغاية.",
     ru:"Равновесие между свободой демонстраций и свободой передвижения. Ограничивают соразмерно — маршрут, время, длительность, — а не запрещают вовсе, ибо ограничение должно быть наименьшим из достигающих цели.",
     en:"A balance between the freedom to demonstrate and the freedom of movement. You limit proportionately — route, hour, duration — rather than ban outright, because a limit must be the narrowest one that achieves the purpose."},
    {he:"האיזון נקבע לפי מספר המפגינים: הפגנה גדולה גוברת תמיד.",
     ar:"تُحسم الموازنة بعدد المتظاهرين: المظاهرة الكبيرة تتفوّق دائمًا.",
     ru:"Равновесие определяется числом демонстрантов: большая демонстрация всегда важнее.",
     en:"The balance is decided by the number of demonstrators: a large demonstration always prevails."}],
   2,
   {he:"שתי זכויות מתנגשות. חפשו את התשובה שמצמצמת פגיעה במקום לבטל זכות.",
    ar:"حقّان يتصادمان. ابحثوا عن الجواب الذي يقلّل المساس بدل أن يلغي حقًّا.",
    ru:"Сталкиваются два права. Ищите ответ, который уменьшает ущерб, а не отменяет право.",
    en:"Two rights collide. Look for the answer that narrows the harm instead of cancelling a right."},
   {he:"זכויות אינן מוחלטות והן מתנגשות זו בזו. מבחן המידתיות שואל שלוש שאלות: האם האמצעי מתאים לתכלית, האם הוא הפוגעני פחות מבין האפשריים, והאם התועלת עולה על הנזק. איסור גורף נכשל בשאלה השנייה.",
    ar:"الحقوق ليست مطلقة وهي تتصادم. اختبار التناسب يسأل ثلاثة أسئلة: هل الوسيلة ملائمة للغاية، وهل هي الأقلّ مساسًا بين الممكن، وهل الفائدة تفوق الضرر. المنع الشامل يفشل في السؤال الثاني.",
    ru:"Права не абсолютны и сталкиваются друг с другом. Проверка соразмерности задаёт три вопроса: подходит ли средство цели, наименее ли оно ущемляющее из возможных, и превышает ли польза вред. Сплошной запрет проваливает второй вопрос.",
    en:"Rights are not absolute, and they collide. The proportionality test asks three questions: is the measure suited to the purpose, is it the least harmful available, and does the benefit outweigh the damage. A blanket ban fails the second."},
   null),
  Q("princ-emerg",
    {he:"ממשלה מבקשת להאריך שוב ושוב מצב חירום, ולהשתמש בו כדי לחוקק בתקנות שעת חירום במקום בחוק. מהי הבעיה הדמוקרטית העיקרית?",
     ar:"تطلب حكومة تمديد حالة الطوارئ مرارًا، واستخدامها للتشريع بأنظمة طوارئ بدل قانون. ما المشكلة الديمقراطية الأساسية؟",
     ru:"Правительство раз за разом продлевает чрезвычайное положение и использует его, чтобы издавать чрезвычайные постановления вместо законов. В чём главная демократическая проблема?",
     en:"A government repeatedly extends a state of emergency and uses it to legislate by emergency regulations instead of by statute. What is the main democratic problem?"},
   [{he:"אין בעיה: מצב החירום מוכרז בידי הכנסת ומוארך רק באישורה, ולכן הפיקוח הפרלמנטרי נשמר גם כשהממשלה מחוקקת בתקנות, והכנסת יכולה לבטלן בכל עת.",
     ar:"لا مشكلة: حالة الطوارئ تُعلنها الكنيست ولا تُمدَّد إلّا بمصادقتها، ولذلك تبقى الرقابة البرلمانية قائمة حتى حين تشرّع الحكومة بلوائح، وبإمكان الكنيست إلغاؤها في أيّ وقت.",
     ru:"Проблемы нет: чрезвычайное положение объявляет Кнессет и продлевает только с его согласия, поэтому парламентский контроль сохраняется и тогда, когда правительство издаёт постановления, а Кнессет может их отменить в любой момент.",
     en:"There is no problem: the state of emergency is declared by the Knesset and extended only with its approval, so parliamentary oversight survives even when the government legislates by regulation, and the Knesset can repeal those regulations at any time."},
    {he:"הבעיה היא רק תקציבית — תקנות חירום עולות כסף רב.",
     ar:"المشكلة ماليّة فقط — أنظمة الطوارئ مكلفة.",
     ru:"Проблема лишь бюджетная — чрезвычайные постановления дорого обходятся.",
     en:"The problem is only budgetary — emergency regulations cost a great deal."},
    {he:"הרשות המבצעת נוטלת לעצמה סמכות חקיקה, והפיקוח של הכנסת ושל בית המשפט נחלש — כלומר הפרדת הרשויות נשחקת מבלי שהוכרז על כך.",
     ar:"السلطة التنفيذية تنتزع صلاحية التشريع، فتضعف رقابة الكنيست والمحكمة — أي أن الفصل بين السلطات يتآكل دون إعلان.",
     ru:"Исполнительная власть присваивает законодательные полномочия, а контроль Кнессета и суда слабеет — то есть разделение властей размывается без всякого объявления.",
     en:"The executive takes legislative power for itself and the oversight of the Knesset and the courts weakens — the separation of powers is eroded without anyone declaring it."},
    {he:"הבעיה היא שתקנות חירום אינן מתפרסמות ברשומות.",
     ar:"المشكلة أن أنظمة الطوارئ لا تُنشر في الجريدة الرسمية.",
     ru:"Проблема в том, что чрезвычайные постановления не публикуются в официальном вестнике.",
     en:"The problem is that emergency regulations are not published in the official gazette."}],
   2,
   {he:"מי אמור לחוקק, ומי חוקק כאן בפועל?",
    ar:"مَن يُفترض أن يشرّع، ومَن يشرّع هنا فعليًّا؟",
    ru:"Кто должен издавать законы и кто издаёт их здесь на деле?",
    en:"Who is supposed to legislate, and who is actually legislating here?"},
   {he:"מצב חירום נועד לאירוע חריג וקצר. הארכה קבועה הופכת את החריג לשגרה, ומעבירה כוח מהכנסת לממשלה בלי בחירות ובלי דיון פומבי. ההגנה הדמוקרטית היא הגבלת המשך בזמן, ביקורת שיפוטית, ואישור מחודש של הכנסת.",
    ar:"حالة الطوارئ وُضعت لحدث استثنائيّ قصير. التمديد الدائم يحوّل الاستثناء إلى قاعدة، وينقل القوة من الكنيست إلى الحكومة بلا انتخابات وبلا نقاش علنيّ. الحماية الديمقراطية هي تحديد المدّة، والرقابة القضائية، ومصادقة الكنيست المتجدّدة.",
    ru:"Чрезвычайное положение рассчитано на исключительное и краткое событие. Постоянное продление превращает исключение в норму и передаёт власть от Кнессета правительству без выборов и без публичного обсуждения. Демократическая защита — это срок, судебный контроль и повторное утверждение Кнессетом.",
    en:"A state of emergency is meant for a short, exceptional event. Permanent extension turns the exception into the norm and moves power from the Knesset to the government without an election and without public debate. The democratic safeguard is a time limit, judicial review, and renewed Knesset approval."},
   null),
  Q("princ-tyranny",
    {he:"מהי “עריצות הרוב”, ומהו הבלם המרכזי מפניה במשטר דמוקרטי?",
     ar:"ما هي “استبداد الأغلبية”، وما الكابح المركزيّ ضدّها في نظام ديمقراطيّ؟",
     ru:"Что такое «тирания большинства» и каков главный тормоз против неё в демократическом строе?",
     en:"What is “tyranny of the majority”, and what is the main brake against it in a democracy?"},
   [{he:"מצב שבו הרוב מנצל את כוחו כדי לשלול זכויות מן המיעוט. הבלם המרכזי הוא זכויות אדם מעוגנות וביקורת שיפוטית עליהן.",
     ar:"وضع تستغلّ فيه الأغلبية قوّتها لسلب حقوق الأقلية. الكابح المركزيّ حقوق إنسان مرسّخة ورقابة قضائية عليها.",
     ru:"Положение, при котором большинство пользуется своей силой, чтобы лишить меньшинство прав. Главный тормоз — закреплённые права человека и судебный контроль над ними.",
     en:"A situation in which the majority uses its power to strip the minority of rights. The main brake is entrenched human rights and judicial review of them."},
    {he:"מצב שבו המיעוט חוסם את הרוב בעזרת עתירות לבית המשפט ובעזרת כוח מיקוח קואליציוני. הבלם המרכזי הוא העלאת אחוז החסימה, שתקטין את כוחן של מפלגות קטנות.",

    ru:"Свободные выборы — не только день голосования. Они включают предвыборный период с равным доступом к СМИ, свободой объединений и слова. Без этого голосование — ритуал, а не выбор.",
    en:"Free elections are not only election day. They include a campaign period with equal access to the media, freedom of association and freedom of expression. Without those, voting is a ceremony, not a choice."},
   null),
  Q("types-case2",
    {he:"פרלמנט נבחר כדין החליט ברוב של 61 מתוך 120 לבטל את זכות ההצבעה של קבוצת מיעוט. מה נכון לומר?",
     ar:"قرّر برلمان منتخب حسب الأصول، بأغلبية ٦١ من ١٢٠، إلغاء حقّ التصويت لمجموعة أقلية. ما القول الصحيح؟",
     ru:"Законно избранный парламент большинством 61 из 120 решил лишить группу меньшинства права голоса. Что верно сказать?",
     en:"A lawfully elected parliament decided, by 61 votes out of 120, to abolish the voting rights of a minority group. What is correct to say?"},
   [{he:"ההחלטה דמוקרטית, מפני שהתקבלה ברוב חוקי בפרלמנט נבחר, וכל עוד ההליך תקין אין ערכאה שרשאית להתערב בתוכנה.",
     ar:"القرار ديمقراطيّ، لأنّه اتُّخذ بأغلبية قانونية في برلمان منتخَب، وما دام الإجراء سليمًا فلا جهة قضائية يحقّ لها التدخّل في مضمونه.",
     ru:"Решение демократично, поскольку принято законным большинством в избранном парламенте, и пока процедура соблюдена, ни одна инстанция не вправе вмешиваться в его содержание.",
     en:"The decision is democratic, since it passed by a lawful majority in an elected parliament, and as long as the procedure was proper no court may interfere with its content."},
    {he:"ההחלטה בטלה מאליה, מפני שרוב של 61 אינו רוב.",
     ar:"القرار باطل تلقائيًّا لأن أغلبية ٦١ ليست أغلبية.",
     ru:"Решение ничтожно само по себе, ведь 61 — не большинство.",
     en:"The decision is void of itself, because 61 is not a majority."},
    {he:"ההליך היה תקין מבחינה פורמלית, אך התוכן מנוגד לדמוקרטיה המהותית — שלילת זכות בסיסית מקבוצה בשל השתייכותה.",
     ar:"الإجراء سليم شكليًّا، لكن المضمون يناقض الديمقراطية الجوهرية — سلب حقّ أساسيّ من مجموعة بسبب انتمائها.",
     ru:"Процедура формально безупречна, но содержание противоречит содержательной демократии — лишение группы базового права из-за её принадлежности.",
     en:"The procedure was formally proper, but the content contradicts substantive democracy — stripping a group of a basic right because of who they are."},
    {he:"מדובר בהחלטה מנהלית ולא בחקיקה.",
     ar:"يتعلّق الأمر بقرار إداريّ لا بتشريع.",
     ru:"Это административное решение, а не законодательство.",
     en:"This is an administrative decision, not legislation."}],
   2,
   {he:"הפרידו בין השאלה “איך התקבלה ההחלטה” לשאלה “מה היא אומרת”.",
    ar:"افصلوا بين سؤال “كيف اتُّخذ القرار” وسؤال “ماذا يقول”.",
    ru:"Разделите вопрос «как принято решение» и вопрос «что оно говорит».",
    en:"Separate the question “how was the decision taken” from the question “what does it say”."},
   {he:"זהו המקרה הקלאסי שבו הליך תקין מייצר תוצאה בלתי דמוקרטית. הוא מסביר למה דמוקרטיות מעגנות זכויות בחוקה או בחוקי יסוד: כדי שרוב זמני לא יוכל לשנות את כללי המשחק בעצמו.",
    ar:"هذه هي الحالة الكلاسيكية التي يُنتج فيها إجراء سليم نتيجة غير ديمقراطية. وهي تفسّر لماذا ترسّخ الديمقراطيات الحقوق في دستور أو قوانين أساس: كي لا تستطيع أغلبية مؤقّتة تغيير قواعد اللعبة بنفسها.",
    ru:"Это классический случай, когда безупречная процедура даёт недемократический результат. Он объясняет, почему демократии закрепляют права в конституции или основных законах: чтобы временное большинство не могло само переписать правила игры.",
    en:"This is the classic case in which a proper procedure produces an undemocratic result. It explains why democracies entrench rights in a constitution or basic laws: so that a temporary majority cannot rewrite the rules of the game by itself."},
   null),
  Q("types-case3",
    {he:"מדינה מבטלת את בית המשפט העליון וקובעת שהפרלמנט הוא הפוסק האחרון בכל שאלה. מה הסיכון הדמוקרטי המרכזי?",
     ar:"تلغي دولة محكمتها العليا وتقرّر أن البرلمان هو الفاصل الأخير في كلّ مسألة. ما الخطر الديمقراطيّ المركزيّ؟",
     ru:"Государство упраздняет Верховный суд и постановляет, что парламент — последняя инстанция по любому вопросу. В чём главный демократический риск?",
     en:"A state abolishes its supreme court and rules that parliament has the final word on every question. What is the main democratic risk?"},
   [{he:"הסיכון הוא עומס תיקים על בתי משפט השלום.",
     ar:"الخطر هو ازدحام الملفّات في محاكم الصلح.",
     ru:"Риск — перегрузка мировых судов делами.",
     en:"The risk is a caseload burden on the magistrates' courts."},
    {he:"אין סיכון: פרלמנט נבחר מייצג את העם, ואם יטעה יחליף אותו הציבור בבחירות הבאות — וזה הבלם הדמוקרטי היחיד הדרוש.",
     ar:"لا خطر: البرلمان المنتخَب يمثّل الشعب، وإن أخطأ فسيستبدله الجمهور في الانتخابات القادمة — وهذا هو الكابح الديمقراطيّ الوحيد المطلوب.",
     ru:"Риска нет: избранный парламент представляет народ, а если ошибётся — общество сменит его на следующих выборах, и это единственный нужный демократический тормоз.",
     en:"There is no risk: an elected parliament represents the people, and if it errs the public will replace it at the next election — that is the only democratic check needed."},
    {he:"הסיכון הוא שהמדינה תאבד חברות בארגונים בינלאומיים.",
     ar:"الخطر أن تفقد الدولة عضويتها في منظمات دولية.",
     ru:"Риск в том, что государство утратит членство в международных организациях.",
     en:"The risk is that the state will lose membership in international organisations."},
    {he:"נשארת רשות אחת בלי בלם: אין מי שיבחן אם חוק פוגע בזכויות, והמיעוט מאבד את הכתובת היחידה שאינה תלויה ברוב.",
     ar:"تبقى سلطة واحدة بلا كابح: لا أحد يفحص إن كان القانون يمسّ الحقوق، وتفقد الأقلية العنوان الوحيد غير التابع للأغلبية.",
     ru:"Остаётся одна власть без тормоза: некому проверить, нарушает ли закон права, и меньшинство теряет единственную инстанцию, не зависящую от большинства.",
     en:"One branch is left with no brake: nobody examines whether a law violates rights, and the minority loses the one address that does not depend on the majority."}],
   3,
   {he:"חשבו לאן פונה מי שנפגע מחוק, אחרי הביטול.",
    ar:"فكّروا إلى أين يتوجّه من تضرّر من قانون، بعد الإلغاء.",
    ru:"Подумайте, куда обратится пострадавший от закона после упразднения.",
    en:"Think where someone harmed by a law goes, after the abolition."},
   {he:"ביקורת שיפוטית היא הבלם שהופך זכויות מהצהרה למגן. אפשר לעצב אותה אחרת — הרכב שונה, רוב מיוחד, עילות מצומצמות — אבל ביטולה המוחלט מותיר את הרוב ללא כל מגבלה מוסדית.",
    ar:"الرقابة القضائية هي الكابح الذي يحوّل الحقوق من إعلان إلى درع. يمكن تصميمها بشكل آخر — تركيبة مختلفة، أغلبية خاصة، أسباب محصورة — لكن إلغاءها التامّ يترك الأغلبية بلا أيّ قيد مؤسّسيّ.",
    ru:"Судебный контроль — тормоз, превращающий права из декларации в щит. Его можно устроить иначе — иной состав, особое большинство, узкие основания, — но полная отмена оставляет большинство без всякого институционального ограничения.",
    en:"Judicial review is the brake that turns rights from a declaration into a shield. It can be designed differently — a different bench, a special majority, narrower grounds — but abolishing it altogether leaves the majority with no institutional limit at all."},
   null)
 ],
 [ /* רמה 3 — ניתוח */
  Q("types-anal1",
    {he:"טוענים כי “ככל שההליך דמוקרטי יותר, כך התוצאה דמוקרטית יותר”. מהי הביקורת החזקה ביותר על הטענה?",
     ar:"يُقال إن “كلّما كان الإجراء أكثر ديمقراطية كانت النتيجة أكثر ديمقراطية”. ما أقوى نقد لهذا الادّعاء؟",
     ru:"Утверждают: «чем демократичнее процедура, тем демократичнее результат». Какова сильнейшая критика этого тезиса?",
     en:"It is argued that “the more democratic the procedure, the more democratic the outcome”. What is the strongest criticism of that claim?"},
   [{he:"הביקורת היא שהליכים דמוקרטיים איטיים מדי, ולכן ההחלטה מתקבלת באיחור ואיכותה נפגעת.",
     ar:"النقد هو أنّ الإجراءات الديمقراطية بطيئة جدًّا، ولذلك يُتَّخذ القرار متأخّرًا وتتضرّر جودته.",
     ru:"Критика в том, что демократические процедуры слишком медленны, поэтому решение принимается с опозданием и его качество страдает.",
     en:"The criticism is that democratic procedures are too slow, so the decision comes late and its quality suffers."},
    {he:"הליך יכול להיות מושלם ותוצאתו לפגוע בזכויות יסוד. ההליך מודד מי החליט, לא מה הוחלט.",
     ar:"قد يكون الإجراء مثاليًّا ونتيجته تمسّ حقوقًا أساسية. الإجراء يقيس مَن قرّر، لا ما الذي تقرّر.",
     ru:"Процедура может быть безупречной, а результат — нарушать основные права. Процедура измеряет, кто решил, а не что решено.",
     en:"A procedure can be flawless and its outcome still violate basic rights. Procedure measures who decided, not what was decided."},
    {he:"הביקורת היא שרוב האזרחים אינם מצביעים.",
     ar:"النقد أن أغلبية المواطنين لا يصوّتون.",
     ru:"Критика в том, что большинство граждан не голосует.",
     en:"The criticism is that most citizens do not vote."},
    {he:"הביקורת היא שהליך דמוקרטי יקר יותר מהליך אחר.",
     ar:"النقد أن الإجراء الديمقراطيّ أغلى من غيره.",
     ru:"Критика в том, что демократическая процедура дороже прочих.",
     en:"The criticism is that a democratic procedure costs more than the alternatives."}],
   1,
   {he:"הטענה מחליפה בין שתי שאלות. אילו?",
    ar:"الادّعاء يخلط بين سؤالين. أيّهما؟",
    ru:"Тезис подменяет один вопрос другим. Какими?",
    en:"The claim conflates two questions. Which two?"},
   {he:"זו ההבחנה שבין דמוקרטיה פורמלית למהותית, מנוסחת כטיעון. משטר נמדד בשתיהן: הליך פגום פוסל תוצאה טובה, ותוכן פוגעני פוסל הליך תקין.",
    ar:"هذا هو التمييز بين الديمقراطية الشكلية والجوهرية، مصاغًا كحجّة. يُقاس النظام بكلتيهما: إجراء معيب يُبطل نتيجة جيّدة، ومضمون ماسّ يُبطل إجراءً سليمًا.",
    ru:"Это различение формальной и содержательной демократии, сформулированное как аргумент. Режим измеряется обеими: порочная процедура обесценивает хороший результат, а ущемляющее содержание — безупречную процедуру.",
    en:"This is the formal/substantive distinction put as an argument. A regime is measured by both: a flawed procedure discredits a good outcome, and harmful content discredits a proper procedure."},
   null),
  Q("types-anal2",
    {he:"מדוע דמוקרטיות רבות מקשות במיוחד על שינוי חוקה או חוקי יסוד — למשל ברוב מיוחד או בשתי קריאות בכנסות שונות?",
     ar:"لماذا تُصعّب ديمقراطيات كثيرة تغيير الدستور أو قوانين الأساس — مثلًا بأغلبية خاصة أو بقراءتين في برلمانين مختلفين؟",
     ru:"Почему многие демократии особенно затрудняют изменение конституции или основных законов — например, требуя особого большинства или двух чтений в разных созывах?",
     en:"Why do many democracies make changing a constitution or basic laws especially hard — for example by a special majority, or two readings in different parliaments?"},
   [{he:"כדי לצמצם את עלות ההדפסה של ספר החוקים.",
     ar:"لتقليل كلفة طباعة مدوّنة القوانين.",
     ru:"Чтобы сократить расходы на печать свода законов.",
     en:"To reduce the printing cost of the statute book."},
    {he:"כדי שרוב זמני לא ישנה את כללי המשחק לטובתו, ושהשינוי ידרוש הסכמה רחבה ויציבה לאורך זמן.",
     ar:"كي لا تغيّر أغلبية مؤقّتة قواعد اللعبة لصالحها، وكي يستوجب التغيير توافقًا واسعًا ثابتًا عبر الزمن.",
     ru:"Чтобы временное большинство не переписало правила игры под себя и чтобы изменение требовало широкого и устойчивого согласия.",
     en:"So that a temporary majority cannot rewrite the rules in its own favour, and so that change requires broad, stable agreement over time."},
    {he:"כדי למנוע מבתי המשפט לפרש את החוקה.",
     ar:"لمنع المحاكم من تفسير الدستور.",
     ru:"Чтобы помешать судам толковать конституцию.",
     en:"To stop the courts from interpreting the constitution."},
    {he:"כדי לחייב את הממשלה להתייעץ עם ארגונים בינלאומיים לפני כל תיקון, שכן חוקה נבחנת גם בעיני מדינות אחרות.",
     ar:"كي تُلزَم الحكومة باستشارة منظّمات دولية قبل كلّ تعديل، لأنّ الدستور يُقاس أيضًا بأعين دول أخرى.",
     ru:"Чтобы обязать правительство советоваться с международными организациями перед каждой поправкой, ведь конституцию оценивают и другие государства.",
     en:"To force the government to consult international organisations before every amendment, since a constitution is judged by other states as well."}],
   1,
   {he:"מי מרוויח מכך שקל לשנות את הכללים — ומתי?",
    ar:"مَن يستفيد من سهولة تغيير القواعد — ومتى؟",
    ru:"Кто выигрывает от лёгкости изменения правил — и когда?",
    en:"Who gains when the rules are easy to change — and when?"},
   {he:"זה מכונה “נוקשות חוקתית”. בישראל היא חלקית בלבד: רק חלק מחוקי היסוד משוריינים, ולכן אפשר לעיתים לשנות כלל יסוד ברוב רגיל — נקודת מחלוקת מרכזית בשיח החוקתי הישראלי.",
    ar:"يُسمّى هذا “الجمود الدستوريّ”. في إسرائيل هو جزئيّ فقط: بعض قوانين الأساس محصّنة، فيمكن أحيانًا تغيير قاعدة أساسية بأغلبية عادية — وهي نقطة خلاف مركزية في النقاش الدستوريّ الإسرائيليّ.",
    ru:"Это называют «конституционной жёсткостью». В Израиле она лишь частичная: защищены не все основные законы, поэтому базовое правило порой можно изменить простым большинством — центральная точка спора в израильской конституционной дискуссии.",
    en:"This is called constitutional rigidity. In Israel it is only partial: not all basic laws are entrenched, so a foundational rule can sometimes be changed by an ordinary majority — a central point of dispute in Israeli constitutional debate."},
   null),
  Q("types-anal3",
    {he:"אזרח טוען: “אני מקיים את החוק, מצביע, ולא מתעניין בפוליטיקה מעבר לזה — זו אזרחות מלאה.” מהי הביקורת מנקודת המבט של הדמוקרטיה המהותית?",
     ar:"يقول مواطن: “ألتزم القانون وأصوّت ولا أهتمّ بالسياسة أكثر من ذلك — هذه مواطَنة كاملة.” ما النقد من زاوية الديمقراطية الجوهرية؟",
     ru:"Гражданин говорит: «Я соблюдаю закон, голосую и больше политикой не интересуюсь — это полноценное гражданство». Какова критика с точки зрения содержательной демократии?",
     en:"A citizen says: “I obey the law, I vote, and beyond that politics does not interest me — that is full citizenship.” What is the criticism from the substantive-democracy point of view?"},
   [{he:"אין ביקורת: הצבעה וקיום החוק ממצים את חובות האזרח, וכל דרישה נוספת היא כפייה של השקפה פוליטית על מי שבחר שלא לעסוק בה.",
     ar:"لا نقد: التصويت والالتزام بالقانون يستنفدان واجبات المواطن، وكلّ مطلب إضافيّ هو فرض موقف سياسيّ على مَن اختار ألّا ينشغل به.",
     ru:"Критики нет: голосование и соблюдение закона исчерпывают обязанности гражданина, а любое дополнительное требование — навязывание политических взглядов тому, кто решил ими не заниматься.",
     en:"There is no criticism: voting and obeying the law exhaust a citizen's duties, and any further demand imposes a political outlook on someone who chose not to engage with it."},
    {he:"הביקורת היא שהוא אינו משלם מסים.",
     ar:"النقد أنه لا يدفع الضرائب.",
     ru:"Критика в том, что он не платит налогов.",
     en:"The criticism is that he does not pay taxes."},
