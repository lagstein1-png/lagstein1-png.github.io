  Q("bs-2-04",{"he": "באיזה רוב מקבלת הכנסת חוק יסוד חדש שאין בו סעיף משוריין?", "ar": "بأيّ أغلبية تُقرّ الكنيست قانون أساس جديدًا لا بند محصَّنًا فيه؟", "ru": "Каким большинством Кнессет принимает новый основной закон без защищённых статей?", "en": "By what majority does the Knesset pass a new Basic Law with no entrenched clause?"},[{"he": "ברוב של שני שלישים מחברי הכנסת, כלומר 80 חברים לפחות.", "ar": "بأغلبية ثلثي أعضاء الكنيست، أي 80 عضوًا على الأقلّ.", "ru": "Большинством в две трети депутатов, то есть не менее 80.", "en": "By a two-thirds majority of Knesset members, that is at least 80."}, {"he": "במשאל עם של כל האזרחים, אחרי אישור בכנסת.", "ar": "باستفتاء لكلّ المواطنين، بعد إقراره في الكنيست.", "ru": "Референдумом всех граждан после одобрения в Кнессете.", "en": "By a referendum of all citizens, after Knesset approval."}, {"he": "ברוב רגיל של המשתתפים בהצבעה, כמו חוק רגיל.", "ar": "بأغلبية عادية من المشاركين في التصويت، كالقانون العاديّ.", "ru": "Простым большинством голосующих, как обычный закон.", "en": "By a simple majority of those voting, like an ordinary law."}, {"he": "ברוב של 61 חברי כנסת ובאישור של נשיא המדינה ושל בית המשפט העליון, שבודקים את נוסח החוק לפני שהוא מתפרסם.", "ar": "بأغلبية 61 عضو كنيست وبموافقة رئيس الدولة والمحكمة العليا، اللذين يفحصان نصّ القانون قبل نشره.", "ru": "Большинством в 61 депутата и с одобрением президента и Верховного суда, которые проверяют текст закона до публикации.", "en": "By 61 Knesset members and with the approval of the President and the Supreme Court, who check the wording before it is published."}],2,{"he": "האם קיים בישראל הליך מיוחד לחקיקת חוקי יסוד?", "ar": "هل يوجد في إسرائيل إجراء خاصّ لسنّ قوانين الأساس؟", "ru": "Есть ли в Израиле особая процедура принятия основных законов?", "en": "Is there a special procedure in Israel for passing Basic Laws?"},{"he": "בישראל אין הליך מיוחד לחקיקת חוק יסוד. הכנסת מקבלת אותו בשלוש קריאות וברוב רגיל, בדיוק כמו חוק רגיל. רוב מיוחד נדרש רק כדי לשנות סעיף משוריין.", "ar": "لا يوجد في إسرائيل إجراء خاصّ لسنّ قانون أساس. تُقرّه الكنيست بثلاث قراءات وبأغلبية عادية، تمامًا كالقانون العاديّ. الأغلبية الخاصّة مطلوبة فقط لتغيير بند محصَّن.", "ru": "В Израиле нет особой процедуры принятия основного закона. Кнессет принимает его в трёх чтениях простым большинством, как и обычный закон. Особое большинство нужно только для изменения защищённой статьи.", "en": "Israel has no special procedure for passing a Basic Law. The Knesset passes it in three readings by a simple majority, just like an ordinary law. A special majority is needed only to change an entrenched clause."},null)
 ],
 [ /* רמה 3 — ניתוח */
  Q("basic-anal1",
    {he:"טענה: “הכנסת היא הריבון, ולכן היא רשאית לחוקק כל חוק, ובית המשפט אינו רשאי לבטלו.” מהי התשובה החוקתית המקובלת בישראל?",
     ar:"ادّعاء: “الكنيست هي السيّدة، فلها أن تسنّ أيّ قانون، ولا يحقّ للمحكمة إبطاله.” ما الجواب الدستوريّ المتّبع في إسرائيل؟",
     ru:"Тезис: «Кнессет суверенен, поэтому вправе принять любой закон, а суд не вправе его отменить». Каков принятый в Израиле конституционный ответ?",
     en:"Claim: “The Knesset is sovereign, so it may pass any statute, and the court may not annul it.” What is the accepted constitutional answer in Israel?"},
   [{he:"הכנסת פועלת בשני כובעים: כרשות מכוננת היא מחוקקת חוקי יסוד, וכרשות מחוקקת היא כפופה להם. לכן חוק רגיל הסותר חוק יסוד עשוי להתבטל.",
     ar:"تعمل الكنيست بصفتين: كسلطة مؤسِّسة تسنّ قوانين أساس، وكسلطة مشرِّعة تخضع لها. لذلك قد يُبطَل قانون عاديّ يناقض قانون أساس.",
     ru:"Кнессет действует в двух качествах: как учредительная власть он принимает основные законы, как законодательная: им подчинён. Поэтому обычный закон, противоречащий основному, может быть отменён.",
     en:"The Knesset acts in two capacities: as a constituent authority it enacts basic laws, and as a legislature it is bound by them. So an ordinary statute contradicting a basic law may be annulled."},
    {he:"הטענה נכונה במלואה: בישראל אין ביקורת שיפוטית על חקיקה, ובית המשפט מוסמך לפרש חוקים בלבד ולא לבטלם, ולכן חוק שעבר בכנסת אינו נבחן עוד.",
     ar:"الادّعاء صحيح تمامًا: لا توجد في إسرائيل رقابة قضائية على التشريع، والمحكمة مخوّلة بتفسير القوانين لا بإبطالها، ولذلك لا يُفحص قانون أقرّته الكنيست بعد ذلك.",
     ru:"Утверждение полностью верно: в Израиле нет судебного контроля над законодательством, суд лишь толкует законы и не отменяет их, поэтому принятый Кнессетом закон больше не проверяется.",
     en:"The claim is entirely correct: Israel has no judicial review of legislation, the court may only interpret statutes and not annul them, so a law passed by the Knesset is never examined again."},
    {he:"בית המשפט רשאי לבטל כל חוק שאינו מקובל עליו, בלי מבחן קבוע, שכן הביקורת השיפוטית נועדה לשקף את תפיסת הצדק של השופטים במקום את הרוב הפוליטי.",
     ar:"يحقّ للمحكمة إبطال أيّ قانون لا يروق لها، دون معيار ثابت، إذ إنّ الرقابة القضائية وُضعت لتعكس تصوّر القضاة للعدالة بدل الأغلبية السياسية.",
     ru:"Суд вправе отменить любой неугодный ему закон без постоянного критерия, ведь судебный контроль призван отражать представление судей о справедливости вместо политического большинства.",
     en:"The court may annul any law it dislikes, with no fixed test, since judicial review exists to reflect the judges' sense of justice rather than the political majority."},
    {he:"רק בית הדין הגבוה לצדק בהרכב מלא של כל השופטים רשאי לבטל חוק.",
     ar:"لا يُبطل القانون إلا العليا بهيئة كاملة من كلّ القضاة.",
     ru:"Отменить закон может лишь БАГАЦ полным составом всех судей.",
     en:"Only the High Court sitting with every one of its justices may annul a statute."}],
   0,
   {he:"אותו גוף מחוקק גם חוקי יסוד וגם חוקים רגילים. האם הוא עושה זאת באותה כובע?",
    ar:"الجسم نفسه يسنّ قوانين أساس وقوانين عادية. أيفعل ذلك بالصفة ذاتها؟",
    ru:"Один и тот же орган принимает и основные, и обычные законы. В одном ли качестве?",
    en:"The same body enacts both basic laws and ordinary statutes. Does it do so wearing the same hat?"},
   {he:"תורת שני הכובעים היא הבסיס לפסק דין בנק המזרחי. הביקורת עליה טוענת שהכנסת לא נבחרה כאסיפה מכוננת, ושאין הליך מיוחד לחקיקת חוק יסוד — ולכן ההבחנה מלאכותית. זו מחלוקת חוקתית פתוחה, לא עובדה מוסכמת.",
    ar:"نظرية الصفتين أساس حكم بنك همزراحي. ويقول نقدها إن الكنيست لم تُنتخب جمعية تأسيسية، وإنه لا إجراء خاصًّا لسنّ قانون أساس، فالتمييز مصطنع. هذا خلاف دستوريّ مفتوح لا حقيقة متّفق عليها.",
    ru:"Теория двух шляп: основа решения по «Банк ха-Мизрахи». Критика возражает, что Кнессет не избирался как учредительное собрание и что особой процедуры принятия основного закона нет, а значит различение искусственно. Это открытый конституционный спор, а не согласованный факт.",
    en:"The two-hats doctrine underlies the Bank Mizrahi judgment. Its critics reply that the Knesset was not elected as a constituent assembly and that there is no special procedure for enacting a basic law, so the distinction is artificial. This is an open constitutional dispute, not an agreed fact."},
   null),
  Q("basic-anal2",
    {he:"מהי “פסקת התגברות”, ומהו הוויכוח סביבה?",
     ar:"ما هي “فقرة التغلّب”، وما الجدل حولها؟",
     ru:"Что такое «оговорка преодоления» и в чём спор вокруг неё?",
     en:"What is an “override clause”, and what is the argument about it?"},
   [{he:"סעיף המאפשר לממשלה לעקוף חוק בתקנה.",
     ar:"بند يتيح للحكومة الالتفاف على قانون بلائحة.",
     ru:"Статья, позволяющая правительству обойти закон постановлением.",
     en:"A clause letting the government bypass a statute by regulation."},
    {he:"סעיף המאפשר לבית המשפט לבטל חוק יסוד.",
     ar:"بند يتيح للمحكمة إبطال قانون أساس.",
     ru:"Статья, позволяющая суду отменить основной закон.",
     en:"A clause letting the court annul a basic law."},
    {he:"סעיף המאפשר לכנסת לחוקק חוק אף שהוא סותר חוק יסוד. בעדה — הכרעה סופית לנבחרי הציבור; נגדה — הזכויות מאבדות את ההגנה שלשמה עוגנו.",
     ar:"بند يتيح للكنيست سنّ قانون رغم مناقضته قانون أساس. معه، الحسم النهائيّ لمنتخبي الجمهور؛ ضدّه، تفقد الحقوق الحماية التي رُسّخت لأجلها.",
     ru:"Статья, позволяющая Кнессету принять закон вопреки основному. За: окончательное слово у избранников народа; против: права теряют ту защиту, ради которой их закрепляли.",
     en:"A clause letting the Knesset enact a statute even though it contradicts a basic law. For: the final word rests with the people's representatives; against: rights lose the very protection they were entrenched to have."},
    {he:"סעיף המחייב משאל עם לפני כל שינוי בחוק יסוד. בעדו — שינוי חוקתי טעון הסכמת הציבור עצמו; נגדו — משאלי עם תכופים משתקים את עבודת החקיקה.",
     ar:"بند يوجب استفتاءً شعبيًّا قبل كلّ تغيير في قانون أساس. معه، التغيير الدستوريّ يستوجب موافقة الجمهور نفسه؛ ضدّه، الاستفتاءات المتكرّرة تشلّ عمل التشريع.",
     ru:"Статья, требующая референдума перед любым изменением Основного закона. За: конституционное изменение должно получить согласие самого общества; против: частые референдумы парализуют законодательную работу.",
     en:"A clause requiring a referendum before any change to a Basic Law. For: a constitutional change should need the public's own consent; against: frequent referendums paralyse legislative work."}],
   2,
   {he:"“להתגבר” — על מה? על פסיקה, או על חוק היסוד עצמו?",
    ar:"“التغلّب”، على ماذا؟ على حكم قضائيّ أم على قانون الأساس نفسه؟",
    ru:"«Преодолеть», что? Решение суда или сам основной закон?",
    en:"“Override”: what? A ruling, or the basic law itself?"},
   {he:"בישראל קיימת פסקת התגברות רק בחוק־יסוד: חופש העיסוק, וברוב של 61 ולתקופה מוגבלת. ההצעות להרחיבה לכבוד האדם וחירותו הן לב הוויכוח החוקתי: המחלוקת אינה על קיום הזכויות אלא על מי מכריע כשהן מתנגשות עם חוק.",
    ar:"في إسرائيل توجد فقرة تغلّب في قانون أساس: حرّية العمل وحده، بأغلبية ٦١ ولفترة محدودة. ومقترحات توسيعها إلى كرامة الإنسان وحرّيته لبّ الجدل الدستوريّ: الخلاف ليس على وجود الحقوق بل على مَن يحسم حين تتصادم مع قانون.",
    ru:"В Израиле оговорка преодоления есть лишь в Основном законе о свободе занятий: большинством в 61 голос и на ограниченный срок. Предложения распространить её на достоинство и свободу человека: сердцевина конституционного спора: спорят не о существовании прав, а о том, кто решает при их столкновении с законом.",
    en:"In Israel an override clause exists only in Basic Law: Freedom of Occupation, by 61 votes and for a limited period. Proposals to extend it to Human Dignity and Liberty are the heart of the constitutional argument: the dispute is not over whether rights exist, but over who decides when they clash with a statute."},
   null),
  Q("basic-anal3",
    {he:"מדוע העובדה שאותה כנסת מחוקקת גם חוקי יסוד וגם חוקים רגילים, באותו רוב, נחשבת חולשה חוקתית?",
     ar:"لماذا يُعدّ كون الكنيست ذاتها تسنّ قوانين أساس وقوانين عادية بالأغلبية نفسها ضعفًا دستوريًّا؟",
     ru:"Почему то, что один и тот же Кнессет тем же большинством принимает и основные, и обычные законы, считают конституционной слабостью?",
     en:"Why is it seen as a constitutional weakness that the same Knesset enacts both basic laws and ordinary statutes, by the same majority?"},
   [{he:"מפני שהדבר מאריך את הליכי החקיקה: כל חוק יסוד נדון בקריאות נוספות, והכנסת אינה פנויה לחקיקה רגילה, ובכך נפגעת יעילות עבודתה.",
     ar:"لأنّ ذلك يطيل إجراءات التشريع: كلّ قانون أساس يُناقَش في قراءات إضافية، ولا تتفرّغ الكنيست للتشريع العاديّ، فتتضرّر نجاعة عملها.",
     ru:"Потому что это удлиняет законодательный процесс: каждый Основной закон проходит дополнительные чтения, Кнессет не успевает заниматься обычными законами, и эффективность его работы падает.",
     en:"Because it lengthens the legislative process: every Basic Law goes through extra readings, the Knesset has no time for ordinary legislation, and its efficiency suffers."},
    {he:"מפני שהמדרג נשען על הבדל שאין לו עוגן פרוצדורלי: רוב מזדמן יכול לשנות את הנורמה העליונה עצמה, ולכן ההגנה על זכויות תלויה בריסון עצמי.",
     ar:"لأن المراتب تستند إلى فارق بلا مرتكز إجرائيّ: أغلبية عابرة قادرة على تغيير المعيار الأعلى نفسه، فتغدو حماية الحقوق رهن ضبط النفس.",
     ru:"Потому что иерархия опирается на различие без процедурной опоры: случайное большинство может изменить саму высшую норму, и защита прав держится на самоограничении.",
     en:"Because the hierarchy rests on a distinction with no procedural anchor: a chance majority can change the supreme norm itself, so the protection of rights depends on self-restraint."},
    {he:"מפני שהדבר מחייב את נשיא המדינה לחתום פעמיים.",
     ar:"لأن ذلك يوجب توقيع رئيس الدولة مرّتين.",
     ru:"Потому что это обязывает президента подписывать дважды.",
     en:"Because it requires the president to sign twice."},
    {he:"מפני שהוא מחייב את הכנסת לדון פעמיים באותו נושא.",
     ar:"لأنّه يُلزم الكنيست بمناقشة الموضوع ذاته مرّتين.",
     ru:"Потому что это заставляет Кнессет дважды обсуждать один и тот же вопрос.",
     en:"Because it forces the Knesset to debate the same subject twice."}],
   1,
   {he:"מה מבדיל, מבחינה מעשית, בין חקיקת חוק יסוד לחקיקת חוק רגיל בישראל?",
    ar:"ما الذي يفرّق عمليًّا بين سنّ قانون أساس وسنّ قانون عاديّ في إسرائيل؟",
    ru:"Что на практике отличает принятие основного закона от обычного в Израиле?",
    en:"What, in practice, distinguishes enacting a basic law from enacting an ordinary statute in Israel?"},
   {he:"ברוב הדמוקרטיות שינוי חוקתי דורש רוב מיוחד, שתי כנסות או משאל עם. בישראל אין דרישה כזאת לרוב חוקי היסוד, ולכן נטען שהם “חוקה שאפשר לשנות בערב אחד”. זהו הרקע להצעות לעגן הליך מיוחד לחקיקת חוקי יסוד.",
    ar:"في أغلب الديمقراطيات يستوجب التغيير الدستوريّ أغلبية خاصة أو برلمانين أو استفتاء. في إسرائيل لا اشتراط كهذا لأغلب قوانين الأساس، فيُقال إنها “دستور يمكن تغييره في مساء واحد”. هذه خلفية مقترحات ترسيخ إجراء خاصّ لسنّها.",
    ru:"В большинстве демократий конституционное изменение требует особого большинства, двух созывов или референдума. В Израиле для большинства основных законов такого требования нет, поэтому говорят о «конституции, которую можно изменить за один вечер». Отсюда предложения закрепить особую процедуру их принятия.",
    en:"In most democracies constitutional change requires a special majority, two parliaments or a referendum. In Israel no such requirement applies to most basic laws, so they are said to be “a constitution that can be changed in one evening”. This is the background to proposals for a special enactment procedure."},
   null),
  Q("bs-3-01",{"he": "מה ההבדל בין חוק יסוד: חופש העיסוק לבין חוק יסוד: כבוד האדם וחירותו מבחינת השריון?", "ar": "ما الفرق بين قانون أساس: حرّية العمل وقانون أساس: كرامة الإنسان وحرّيته من حيث التحصين؟", "ru": "Чем отличаются Основной закон о свободе занятий и Основной закон о достоинстве и свободе человека в вопросе защищённости?", "en": "How do Basic Law: Freedom of Occupation and Basic Law: Human Dignity and Liberty differ in entrenchment?"},[{"he": "שניהם משוריינים באותה מידה, ושינוי של כל אחד מהם דורש 80 חברי כנסת.", "ar": "كلاهما محصَّن بالقدر نفسه، وتغيير أيّ منهما يتطلّب 80 عضو كنيست.", "ru": "Оба защищены одинаково, и изменение любого из них требует 80 депутатов.", "en": "Both are equally entrenched, and changing either one needs 80 Knesset members."}, {"he": "את חופש העיסוק אפשר לשנות רק ברוב של חברי הכנסת, ואילו כבוד האדם וחירותו אינו משוריין כך.", "ar": "حرّية العمل لا يمكن تغييره إلا بأغلبية أعضاء الكنيست، أمّا كرامة الإنسان وحرّيته فليس محصَّنًا هكذا.", "ru": "Закон о свободе занятий можно изменить только большинством всех депутатов, а закон о достоинстве и свободе так не защищён.", "en": "Freedom of Occupation can be changed only by a majority of all Knesset members, while Human Dignity and Liberty is not entrenched this way."}, {"he": "כבוד האדם וחירותו משוריין, וחופש העיסוק אינו משוריין כלל.", "ar": "كرامة الإنسان وحرّيته محصَّن، وحرّية العمل غير محصَّن إطلاقًا.", "ru": "Закон о достоинстве и свободе защищён, а закон о свободе занятий не защищён совсем.", "en": "Human Dignity and Liberty is entrenched, and Freedom of Occupation is not entrenched at all."}, {"he": "אין ביניהם הבדל, כי אף חוק יסוד בישראל אינו משוריין, ואפשר לשנות כל אחד מהם ברוב רגיל של המשתתפים בהצבעה.", "ar": "لا فرق بينهما، لأن أيّ قانون أساس في إسرائيل غير محصَّن، ويمكن تغيير كلّ واحد منها بأغلبية عادية من المشاركين في التصويت.", "ru": "Разницы нет: ни один основной закон в Израиле не защищён, и любой из них можно изменить простым большинством голосующих в пленуме.", "en": "There is no difference, since no Basic Law in Israel is entrenched, and each can be changed by a simple majority of those voting in the plenum."}],1,{"he": "חפשו בכל אחד מהחוקים סעיף שמדבר על הדרך לשנות אותו.", "ar": "ابحثوا في كلّ من القانونين عن بند يتحدّث عن طريقة تغييره.", "ru": "Найдите в каждом из законов статью о том, как его можно изменить.", "en": "Look in each law for a section about how it may be changed."},{"he": "בחוק יסוד: חופש העיסוק יש סעיף שקובע שאפשר לשנותו רק ברוב של חברי הכנסת, כלומר 61. בחוק יסוד: כבוד האדם וחירותו אין דרישה כזו. לכן, מבחינה פורמלית, חופש העיסוק מוגן יותר מפני שינוי.", "ar": "في قانون أساس: حرّية العمل بند يقرّر أنه لا يُغيَّر إلا بأغلبية أعضاء الكنيست، أي 61. وليس في قانون أساس: كرامة الإنسان وحرّيته شرط كهذا. لذلك، من الناحية الشكلية، حرّية العمل محميّ أكثر من التغيير.", "ru": "В Основном законе о свободе занятий есть статья: его можно изменить только большинством депутатов, то есть 61. В Основном законе о достоинстве и свободе человека такого требования нет. Поэтому формально закон о свободе занятий лучше защищён от изменений.", "en": "Basic Law: Freedom of Occupation has a section saying it can be changed only by a majority of Knesset members, that is 61. Basic Law: Human Dignity and Liberty has no such requirement. So, formally, Freedom of Occupation is better protected from change."},null),
  Q("bs-3-02",{"he": "חוק משנת 1980 פוגע בחירות של אדם. האדם עותר ומבקש לבטל את החוק לפי חוק יסוד: כבוד האדם וחירותו. מה יקבע בית המשפט?", "ar": "قانون من سنة 1980 يمسّ حرّية شخص. يقدّم الشخص التماسًا ويطلب إبطال القانون استنادًا إلى قانون أساس: كرامة الإنسان وحرّيته. ماذا ستقرّر المحكمة؟", "ru": "Закон 1980 года ограничивает свободу человека. Человек подаёт петицию и просит отменить закон на основании Основного закона о достоинстве и свободе человека. Что решит суд?", "en": "A law from 1980 harms a person's liberty. The person petitions to void it under Basic Law: Human Dignity and Liberty. What will the court decide?"},[{"he": "יבטל את החוק מיד, כי כל חוק שפוגע בחירות בטל.", "ar": "ستُبطل القانون فورًا، لأن كلّ قانون يمسّ الحرّية باطل.", "ru": "Сразу отменит закон, ведь любой закон, ограничивающий свободу, ничтожен.", "en": "It will void the law at once, since any law that harms liberty is void."}, {"he": "יבטל את החוק, כי חוק ישן תמיד נדחה מפני חוק יסוד חדש.", "ar": "ستُبطل القانون، لأن القانون القديم يتراجع دائمًا أمام قانون أساس جديد.", "ru": "Отменит закон, ведь старый закон всегда уступает новому основному закону.", "en": "It will void the law, since an old law always gives way to a new Basic Law."}, {"he": "ידחה את העתירה, כי בית המשפט אינו רשאי לפרש חוקים של הכנסת או לבדוק אותם בשום מקרה ובשום דרך.", "ar": "سترفض الالتماس، لأن المحكمة لا يحقّ لها تفسير قوانين الكنيست أو فحصها في أيّ حال وبأيّ طريقة.", "ru": "Отклонит петицию, ведь суд не вправе толковать законы Кнессета или проверять их ни в каком случае и никаким способом.", "en": "It will reject the petition, since the court may never interpret or examine Knesset laws, in any case or in any way at all."}, {"he": "לא יבטל אותו, בגלל סעיף שמירת הדינים, אבל יפרש אותו ברוח חוק היסוד.", "ar": "لن تُبطله، بسبب بند حفظ القوانين، لكنها ستفسّره بروح قانون الأساس.", "ru": "Не отменит его из-за статьи о сохранении законов, но истолкует в духе основного закона.", "en": "It will not void it, because of the preservation of laws clause, but will read it in the spirit of the Basic Law."}],3,{"he": "מה קובע חוק היסוד לגבי חוקים שהיו קיימים לפני שהוא נחקק?", "ar": "ماذا يقرّر قانون الأساس بشأن القوانين التي كانت قائمة قبل سنّه؟", "ru": "Что говорит основной закон о законах, которые существовали до его принятия?", "en": "What does the Basic Law say about laws that existed before it was passed?"},{"he": "סעיף שמירת הדינים קובע שחוק היסוד אינו פוגע בתוקפם של חוקים שהיו קיימים לפני 1992. לכן בית המשפט לא יבטל חוק כזה. אבל הוא יפרש אותו כך שיפגע בזכויות כמה שפחות.", "ar": "بند حفظ القوانين يقرّر أن قانون الأساس لا يمسّ سريان القوانين التي كانت قائمة قبل 1992. لذلك لن تُبطل المحكمة قانونًا كهذا. لكنها ستفسّره بحيث يمسّ الحقوق بأقلّ قدر ممكن.", "ru": "Статья о сохранении законов устанавливает, что основной закон не затрагивает силу законов, существовавших до 1992 года. Поэтому суд не отменит такой закон. Но он истолкует его так, чтобы он как можно меньше ущемлял права.", "en": "The preservation of laws clause says the Basic Law does not affect the validity of laws that existed before 1992. So the court will not void such a law. But it will interpret it so that it harms rights as little as possible."},null),
  Q("bs-3-03",{"he": "מהו הטיעון המרכזי בעד ביקורת שיפוטית על חוקים, ומהו הטיעון המרכזי נגדה?", "ar": "ما الحجّة المركزية لصالح الرقابة القضائية على القوانين، وما الحجّة المركزية ضدّها؟", "ru": "Каков главный довод за судебный контроль над законами и каков главный довод против него?", "en": "What is the main argument for judicial review of laws, and what is the main argument against it?"},[{"he": "בעד: היא מקצרת את הליכי החקיקה. נגד: היא מייקרת את עבודת בתי המשפט.", "ar": "لصالحها: تختصر إجراءات التشريع. ضدّها: ترفع كلفة عمل المحاكم.", "ru": "За: он сокращает процесс законодательства. Против: он удорожает работу судов.", "en": "For: it shortens the legislative process. Against: it makes the courts' work more costly."}, {"he": "בעד: היא מחזקת את הממשלה. נגד: היא מחלישה את בית המשפט.", "ar": "لصالحها: تقوّي الحكومة. ضدّها: تُضعف المحكمة.", "ru": "За: он усиливает правительство. Против: он ослабляет суд.", "en": "For: it strengthens the government. Against: it weakens the court."}, {"he": "בעד: היא מגינה על זכויות המיעוט מפני הרוב. נגד: שופטים שלא נבחרו מבטלים החלטות של נבחרי הציבור.", "ar": "لصالحها: تحمي حقوق الأقلية من الأغلبية. ضدّها: قضاة غير منتخَبين يُبطلون قرارات ممثّلي الجمهور المنتخَبين.", "ru": "За: он защищает права меньшинства от большинства. Против: неизбранные судьи отменяют решения избранных представителей.", "en": "For: it protects minority rights from the majority. Against: unelected judges overturn decisions of elected representatives."}, {"he": "בעד: היא מאפשרת לאזרחים לבחור את השופטים בבחירות ישירות. נגד: היא מבטלת את הצורך בכנסת ומעבירה את כל סמכויות החקיקה לבית המשפט העליון.", "ar": "لصالحها: تتيح للمواطنين انتخاب القضاة انتخابًا مباشرًا. ضدّها: تُلغي الحاجة إلى الكنيست وتنقل كلّ صلاحيات التشريع إلى المحكمة العليا.", "ru": "За: он позволяет гражданам выбирать судей прямым голосованием. Против: он отменяет нужду в Кнессете и передаёт все законодательные полномочия Верховному суду.", "en": "For: it lets citizens choose judges in direct elections. Against: it removes the need for the Knesset and moves all lawmaking powers to the Supreme Court."}],2,{"he": "חשבו מי מחליט בסוף, ומי עלול להיפגע מההחלטה.", "ar": "فكّروا: من يقرّر في النهاية، ومن قد يتضرّر من القرار؟", "ru": "Подумайте, кто решает в итоге и кто может пострадать от решения.", "en": "Think about who decides in the end, and who might be hurt by the decision."},{"he": "התומכים אומרים שבלי ביקורת שיפוטית, רוב בכנסת יכול לפגוע בזכויות של מיעוט. המתנגדים אומרים שההכרעה צריכה להיות בידי מי שהציבור בחר. הוויכוח הזה הוא חלק מרכזי בשיח החוקתי בישראל.", "ar": "يقول المؤيّدون إنه دون رقابة قضائية تستطيع أغلبية في الكنيست أن تمسّ حقوق أقلية. ويقول المعارضون إن الحسم يجب أن يكون بيد من انتخبهم الجمهور. هذا الجدل جزء مركزيّ من الخطاب الدستوريّ في إسرائيل.", "ru": "Сторонники говорят, что без судебного контроля большинство в Кнессете может ущемить права меньшинства. Противники говорят, что решать должны те, кого выбрал народ. Этот спор: центральная часть конституционной дискуссии в Израиле.", "en": "Supporters say that without judicial review, a Knesset majority can harm the rights of a minority. Opponents say the decision should rest with those the public elected. This debate is a central part of constitutional discussion in Israel."},null),
  Q("bs-3-04",{"he": "פסקת ההגבלה דורשת שפגיעה בזכות תהיה 'בחוק או לפי חוק'. מה ההיגיון בדרישה הזו?", "ar": "تشترط فقرة التقييد أن يكون المسّ بالحقّ «بقانون أو بموجب قانون». ما المنطق في هذا الشرط؟", "ru": "Ограничительная оговорка требует, чтобы ущемление права было «законом или на основании закона». В чём смысл этого требования?", "en": "The limitation clause requires that harm to a right be \"by a law or under a law\". What is the logic of this requirement?"},[{"he": "שנבחרי הציבור בכנסת יקבעו מתי מותר לפגוע בזכות, ולא פקיד או שר בלי הסמכה.", "ar": "أن يحدّد ممثّلو الجمهور في الكنيست متى يجوز المسّ بحقّ، لا موظّف أو وزير دون تخويل.", "ru": "Чтобы избранники в Кнессете решали, когда можно ущемить право, а не чиновник или министр без полномочий.", "en": "So that elected Knesset members decide when a right may be harmed, not an official or minister without authority."}, {"he": "שכל פגיעה בזכות תאושר במשאל עם.", "ar": "أن يُصادَق على كلّ مسّ بحقّ في استفتاء عامّ.", "ru": "Чтобы каждое ущемление права утверждалось референдумом.", "en": "So that every harm to a right is approved by referendum."}, {"he": "שבית המשפט יוכל לחוקק בעצמו חוקים שמגבילים זכויות, כאשר הוא סבור שהכנסת אינה פועלת מספיק מהר כדי להגן על הציבור.", "ar": "أن تستطيع المحكمة أن تسنّ بنفسها قوانين تقيّد الحقوق، حين ترى أن الكنيست لا تعمل بسرعة كافية لحماية الجمهور.", "ru": "Чтобы суд мог сам принимать законы, ограничивающие права, когда считает, что Кнессет действует недостаточно быстро для защиты общества.", "en": "So that the court can itself pass laws limiting rights, when it thinks the Knesset is not acting fast enough to protect the public."}, {"he": "שהפגיעה תהיה מותרת רק אם עברה יותר משנה מחקיקת חוק היסוד.", "ar": "أن يكون المسّ مسموحًا فقط إذا مرّت أكثر من سنة على سنّ قانون الأساس.", "ru": "Чтобы ущемление допускалось, только если с принятия основного закона прошло больше года.", "en": "So that harm is allowed only if more than a year has passed since the Basic Law was enacted."}],0,{"he": "איזו רשות שלטון מייצגת את הציבור באופן הישיר ביותר?", "ar": "أيّ سلطة تمثّل الجمهور بالشكل الأكثر مباشرة؟", "ru": "Какая ветвь власти наиболее прямо представляет общество?", "en": "Which branch of government represents the public most directly?"},{"he": "הדרישה מבטאת את עקרון שלטון החוק. פגיעה בזכות היא החלטה כבדה, ולכן הכנסת צריכה לקבל אותה או להסמיך אליה במפורש. כך הרשות המבצעת אינה יכולה לפגוע בזכויות על דעת עצמה.", "ar": "يعبّر الشرط عن مبدأ سيادة القانون. المسّ بحقّ قرار ثقيل، لذلك على الكنيست أن تتّخذه أو تخوّل به صراحةً. هكذا لا تستطيع السلطة التنفيذية المسّ بالحقوق من تلقاء نفسها.", "ru": "Требование выражает принцип верховенства закона. Ущемление права: тяжёлое решение, поэтому Кнессет должен принять его сам или прямо уполномочить на него. Так исполнительная власть не может ущемлять права по собственному усмотрению.", "en": "The requirement expresses the rule of law. Harming a right is a weighty decision, so the Knesset must make it or expressly authorise it. That way the executive cannot harm rights on its own initiative."},null)
 ]
]);

     ar:"انتخابات نسبية قُطرية بقوائم: الدولة كلّها دائرة واحدة، وتنال كلّ قائمة مقاعد بحسب حصّتها النسبية من الأصوات.",

     ar:"انتخابات مباشرة لرئيس الحكومة فقط، دون انتخاب كنيست، بحيث تستند الحكومة إلى تفويض شخصيّ من الجمهور، بينما تُعيَّن الكنيست من قِبَل الأحزاب.",

    ar:"ميزة النظام النسبيّ تمثيل واسع: حتى المجموعة الصغيرة تصل الكنيست. وعيبه كثرة الأحزاب وائتلافات واسعة وصعوبة تشكيل حكومة مستقرّة، وانقطاع بين عضو الكنيست وناخب منطقة بعينها.",

     ru:"Минимальная доля голосов, необходимая списку для входа в Кнессет. Цель: сократить число партий и стабилизировать управление.",

    {he:"שיעור המצביעים המזערי הדרוש כדי שהבחירות יהיו תקפות; אם לא הושג, נערכות בחירות חוזרות בתוך שלושה חודשים.",
     ar:"النسبة الدنيا من المصوّتين اللازمة لصحّة الانتخابات؛ وإذا لم تتحقّق تُجرى انتخابات معادة خلال ثلاثة أشهر.",
     ru:"Минимальная доля проголосовавших, необходимая для действительности выборов; если она не достигнута, в течение трёх месяцев проводят повторные выборы.",

     ar:"نسبة أعضاء الكنيست اللازمة لإسقاط حكومة بحجب الثقة ونقل تشكيلها إلى مرشّح آخر من المعارضة.",
     ru:"Доля депутатов Кнессета, необходимая, чтобы свергнуть правительство вотумом недоверия и передать его формирование другому кандидату от оппозиции.",
     en:"The share of Knesset members needed to topple a government in a no-confidence vote and hand its formation to another candidate from the opposition."},

    ru:"Барьер в Израиле с годами рос и сегодня составляет 3,25%: около четырёх мандатов. Он создаёт встроенное напряжение: способствует стабильности, но вредит представительности, ведь голоса не преодолевших его вовсе не представлены.",
