     en:"The right to privacy and dignity: personal information about a person is not published without consent, even for an educational purpose."},
    {he:"חופש העיסוק של המורים.",ar:"حرّية عمل المعلّمين.",ru:"Свобода занятий учителей.",en:"The teachers' freedom of occupation."},
    {he:"הזכות לקניין רוחני על שאלות המבחן: פרסום הציונים חושף את אופן הניקוד ופוגע באפשרות להשתמש במבחן שוב.",
     ar:"الحقّ في الملكية الفكرية لأسئلة الامتحان: نشر العلامات يكشف طريقة التنقيط ويضرّ بإمكانية استخدام الامتحان ثانيةً.",
     ru:"Право интеллектуальной собственности на вопросы теста: публикация оценок раскрывает систему баллов и мешает использовать тест повторно.",
     en:"Intellectual property in the exam questions: publishing the grades exposes the marking scheme and undermines reusing the exam."}],
   1,
   {he:"מה נחשף כאן על התלמיד, ולעיני מי?",
    ar:"ماذا يُكشف هنا عن الطالب، وأمام مَن؟",
    ru:"Что здесь раскрывается об ученике и перед кем?",
    en:"What is exposed here about the pupil, and to whom?"},
   {he:"הפרטיות מוגנת בחוק־יסוד: כבוד האדם וחירותו ובחוק הגנת הפרטיות. מטרה ראויה — עידוד לימודים — אינה מייתרת את השאלה אם היא מושגת באמצעי פוגעני פחות, למשל מסירת הציון לתלמיד בלבד.",
    ar:"الخصوصية محميّة في قانون أساس: كرامة الإنسان وحرّيته وفي قانون حماية الخصوصية. الغاية المشروعة، تشجيع التعلّم، لا تلغي السؤال إن كانت تتحقّق بوسيلة أقلّ مساسًا، كتسليم العلامة للطالب وحده.",
    ru:"Частная жизнь защищена Основным законом о достоинстве и свободе человека и Законом о защите частной жизни. Достойная цель: поощрение учёбы: не снимает вопроса, достижима ли она менее ущемляющим средством, например выдачей оценки лично ученику.",
    en:"Privacy is protected by Basic Law: Human Dignity and Liberty and by the Protection of Privacy Law. A worthy purpose: encouraging study: does not remove the question whether it can be achieved less intrusively, for instance by giving the grade to the pupil alone."},
   null),
  Q("rt-2-01",{"he": "סבטלנה היא תושבת קבע בישראל, אבל אינה אזרחית. באילו בחירות היא רשאית להצביע?", "ar": "سفيتلانا مقيمة دائمة في إسرائيل، لكنها ليست مواطنة. في أيّ انتخابات يحقّ لها التصويت؟", "ru": "Светлана имеет статус постоянной жительницы Израиля, но не гражданство. На каких выборах она может голосовать?", "en": "Svetlana is a permanent resident of Israel but not a citizen. In which elections may she vote?"},[{"he": "בבחירות לכנסת בלבד.", "ar": "في انتخابات الكنيست فقط.", "ru": "Только на выборах в Кнессет.", "en": "Only in Knesset elections."}, {"he": "בבחירות לרשות המקומית, אבל לא בבחירות לכנסת.", "ar": "في انتخابات السلطة المحلية، لا في انتخابات الكنيست.", "ru": "На выборах в местную власть, но не в Кнессет.", "en": "In local authority elections, but not in Knesset elections."}, {"he": "בכל הבחירות, כי כל מי שגר בישראל ומשלם מסים נהנה מכל הזכויות הפוליטיות במלואן.", "ar": "في كلّ الانتخابات، لأن كلّ من يسكن في إسرائيل ويدفع الضرائب يتمتّع بكلّ الحقوق السياسية كاملة.", "ru": "На всех выборах, ведь каждый, кто живёт в Израиле и платит налоги, пользуется всеми политическими правами.", "en": "In all elections, since anyone who lives in Israel and pays taxes enjoys every political right in full."}, {"he": "באף בחירות, עד שתשרת בצבא.", "ar": "لا في أيّ انتخابات، حتى تخدم في الجيش.", "ru": "Ни на каких, пока не отслужит в армии.", "en": "In none, until she serves in the army."}],1,{"he": "זכות הבחירה לפרלמנט קשורה בדרך כלל למעמד מסוים. איזה?", "ar": "حقّ انتخاب البرلمان يرتبط عادةً بمكانة معيّنة. أيّ مكانة؟", "ru": "Право выбирать парламент обычно связано с определённым статусом. Каким?", "en": "The right to elect parliament is usually tied to a certain status. Which one?"},{"he": "הזכות לבחור לכנסת היא זכות פוליטית השמורה לאזרחים. תושב קבע אינו אזרח, ולכן אינו מצביע לכנסת. אבל הוא רשאי להצביע בבחירות לרשות המקומית שבה הוא גר.", "ar": "حقّ انتخاب الكنيست حقّ سياسيّ مقصور على المواطنين. المقيم الدائم ليس مواطنًا، لذلك لا يصوّت للكنيست. لكن يحقّ له التصويت في انتخابات السلطة المحلية التي يسكن فيها.", "ru": "Право выбирать Кнессет: политическое право граждан. Постоянный житель не гражданин, поэтому не голосует на выборах в Кнессет. Но он может голосовать на выборах местной власти, где живёт.", "en": "Voting for the Knesset is a political right reserved for citizens. A permanent resident is not a citizen, so does not vote for the Knesset. But they may vote in elections for the local authority where they live."},null),
  Q("rt-2-02",{"he": "קבוצה מפגינה בכל לילה בחצות, עם רמקולים, מתחת לבית של שר. השכנים מתלוננים שאינם יכולים לישון. אילו זכויות מתנגשות כאן?", "ar": "تتظاهر مجموعة كلّ ليلة عند منتصف الليل، بمكبّرات صوت، تحت بيت وزير. يشكو الجيران أنهم لا يستطيعون النوم. أيّ حقوق تتصادم هنا؟", "ru": "Группа каждую ночь в полночь проводит демонстрацию с громкоговорителями под домом министра. Соседи жалуются, что не могут спать. Какие права здесь сталкиваются?", "en": "A group protests every night at midnight, with loudspeakers, under a minister's home. The neighbours complain they cannot sleep. Which rights clash here?"},[{"he": "הזכות לשוויון מול חופש הדת.", "ar": "الحقّ في المساواة مقابل حرّية الدين.", "ru": "Право на равенство против свободы вероисповедания.", "en": "The right to equality against freedom of religion."}, {"he": "חופש העיסוק של השר מול הזכות לקניין של השכנים.", "ar": "حرّية العمل للوزير مقابل حقّ الملكية للجيران.", "ru": "Свобода занятий министра против права собственности соседей.", "en": "The minister's freedom of occupation against the neighbours' property right."}, {"he": "חופש הביטוי וההפגנה מול הזכות לפרטיות ולשקט בבית.", "ar": "حرّية التعبير والتظاهر مقابل الحقّ في الخصوصية والهدوء في البيت.", "ru": "Свобода слова и демонстраций против права на частную жизнь и покой дома.", "en": "Freedom of expression and protest against the right to privacy and quiet at home."}, {"he": "אין כאן התנגשות, כי הפגנה מול בית של איש ציבור מותרת תמיד, בכל שעה ובכל עוצמת רעש.", "ar": "لا تصادم هنا، لأن التظاهر أمام بيت شخصية عامة مسموح دائمًا، في أيّ ساعة وبأيّ مستوى ضجيج.", "ru": "Здесь нет столкновения: демонстрация у дома публичного лица разрешена всегда, в любой час и с любой громкостью.", "en": "There is no clash, since a protest outside a public figure's home is always allowed, at any hour and any volume."}],2,{"he": "שאלו מה רוצים המפגינים לעשות, ומה רוצים השכנים לשמור.", "ar": "اسألوا: ماذا يريد المتظاهرون أن يفعلوا، وماذا يريد الجيران أن يحفظوا؟", "ru": "Спросите, что хотят делать протестующие и что хотят сохранить соседи.", "en": "Ask what the protesters want to do, and what the neighbours want to keep."},{"he": "המפגינים מממשים את חופש הביטוי וההפגנה. השכנים רוצים פרטיות ושקט בביתם. בדרך כלל מאזנים ביניהם בהגבלה של שעות ושל עוצמת הרעש, ולא באיסור מלא.", "ar": "المتظاهرون يمارسون حرّية التعبير والتظاهر. والجيران يريدون الخصوصية والهدوء في بيوتهم. عادةً يُوازَن بينهما بتقييد الساعات ومستوى الضجيج، لا بمنع كامل.", "ru": "Протестующие пользуются свободой слова и демонстраций. Соседи хотят покоя и частной жизни дома. Обычно баланс ищут через ограничение часов и громкости, а не через полный запрет.", "en": "The protesters exercise freedom of expression and protest. The neighbours want privacy and quiet at home. Usually the balance is limits on hours and volume, not a full ban."},null),
  Q("rt-2-03",{"he": "יוסף גדל במשפחה דתית. בגיל 25 החליט שלא לקיים מצוות. מה אומר חופש הדת על ההחלטה שלו?", "ar": "نشأ يوسف في عائلة متديّنة. في سنّ 25 قرّر ألّا يمارس الفرائض الدينية. ماذا تقول حرّية الدين عن قراره؟", "ru": "Йосеф вырос в религиозной семье. В 25 лет он решил не соблюдать религиозные заповеди. Что говорит свобода вероисповедания о его решении?", "en": "Yosef grew up in a religious family. At 25 he decided not to keep religious commandments. What does freedom of religion say about his choice?"},[{"he": "חופש הדת מגן רק על מי שמקיים דת, ולא על מי שעוזב אותה.", "ar": "حرّية الدين تحمي من يمارس دينًا فقط، لا من يتركه.", "ru": "Свобода вероисповедания защищает только верующих, а не тех, кто уходит от религии.", "en": "Freedom of religion protects only those who practise a religion, not those who leave it."}, {"he": "המשפחה רשאית לחייב אותו לקיים מצוות כל עוד הוא גר בביתה.", "ar": "يحقّ للعائلة أن تُلزمه بالفرائض ما دام يسكن في بيتها.", "ru": "Семья вправе обязать его соблюдать заповеди, пока он живёт в её доме.", "en": "His family may require him to keep commandments as long as he lives in their home."}, {"he": "ההחלטה דורשת אישור של בית דין דתי, ולכן הוא חייב להגיש בקשה רשמית ולחכות לתשובה.", "ar": "القرار يحتاج إلى موافقة محكمة دينية، لذلك عليه تقديم طلب رسميّ وانتظار الردّ.", "ru": "Решение требует одобрения религиозного суда, поэтому он должен подать официальную просьбу и ждать ответа.", "en": "The decision needs a religious court's approval, so he must file a formal request and wait for an answer."}, {"he": "זו זכותו: חופש הדת כולל גם את החופש שלא לקיים דת.", "ar": "هذا حقّه: حرّية الدين تشمل أيضًا حرّية عدم ممارسة الدين.", "ru": "Это его право: свобода вероисповедания включает и свободу не исповедовать религию.", "en": "It is his right: freedom of religion also includes freedom not to practise one."}],3,{"he": "האם החופש לבחור כולל גם את האפשרות לבחור 'לא'?", "ar": "هل تشمل حرّية الاختيار أيضًا إمكانية أن نختار «لا»؟", "ru": "Включает ли свобода выбора и возможность выбрать «нет»?", "en": "Does the freedom to choose also include choosing \"no\"?"},{"he": "חופש הדת הוא החופש לקיים דת כפי שאדם בוחר. הוא כולל גם את החופש מדת: לא לקיים מצוות ולא להשתייך לדת. איש אינו רשאי לכפות על אדם בוגר אמונה או מנהג.", "ar": "حرّية الدين هي حرّية ممارسة الدين كما يختار الإنسان. وتشمل أيضًا الحرّية من الدين: ألّا يمارس الفرائض وألّا ينتمي إلى دين. لا يحقّ لأحد أن يفرض على شخص بالغ عقيدة أو عادة.", "ru": "Свобода вероисповедания: это свобода исповедовать религию так, как выбирает человек. Она включает и свободу от религии: не соблюдать заповеди и не принадлежать к религии. Никто не вправе навязывать взрослому веру или обычай.", "en": "Freedom of religion is the freedom to practise religion as one chooses. It also includes freedom from religion: not keeping commandments and not belonging to a faith. No one may force an adult into a belief or custom."},null),
  Q("rt-2-04",{"he": "אומרים שזכויות האדם הן 'יחסיות' ולא 'מוחלטות'. מה הכוונה?", "ar": "يُقال إن حقوق الإنسان «نسبية» لا «مطلقة». ما المقصود؟", "ru": "Говорят, что права человека «относительны», а не «абсолютны». Что это значит?", "en": "Human rights are said to be \"relative\", not \"absolute\". What does that mean?"},[{"he": "אפשר להגביל אותן כשהן מתנגשות בזכויות של אחרים או באינטרס ציבורי חשוב.", "ar": "يمكن تقييدها حين تتصادم مع حقوق الآخرين أو مع مصلحة عامة مهمّة.", "ru": "Их можно ограничить, когда они сталкиваются с правами других или с важным общественным интересом.", "en": "They may be limited when they clash with others' rights or with an important public interest."}, {"he": "הן חלות רק על חלק מהאנשים.", "ar": "تسري على بعض الناس فقط.", "ru": "Они действуют только для части людей.", "en": "They apply only to some people."}, {"he": "הממשלה רשאית לבטל אותן בכל רגע, בהחלטה פשוטה ובלי לנמק, אם היא סבורה שהדבר נחוץ לה.", "ar": "يحقّ للحكومة إلغاؤها في أيّ لحظة، بقرار بسيط ودون تعليل، إذا رأت ذلك ضروريًّا لها.", "ru": "Правительство может отменить их в любой момент простым решением и без объяснений, если сочтёт это нужным.", "en": "The government may cancel them at any moment, by a simple decision and with no reason, if it thinks it needs to."}, {"he": "הן תלויות בדעת הקהל, ומשתנות לפי הסקרים.", "ar": "إنها تابعة للرأي العام وتتغيّر وفق الاستطلاعات.", "ru": "Они зависят от общественного мнения и меняются по опросам.", "en": "They depend on public opinion and change with the polls."}],0,{"he": "מה קורה כששתי זכויות לא יכולות להתקיים במלואן באותו זמן?", "ar": "ماذا يحدث حين لا يمكن لحقّين أن يتحقّقا كاملين في الوقت نفسه؟", "ru": "Что происходит, когда два права не могут полностью осуществиться одновременно?", "en": "What happens when two rights cannot both be fully realised at the same time?"},{"he": "זכות יחסית אינה בלתי מוגבלת. כשהיא פוגעת בזכות של אחר או בטובת הציבור, אפשר להגביל אותה. אבל ההגבלה צריכה להיות בחוק, לתכלית ראויה ובמידה הנדרשת בלבד.", "ar": "الحقّ النسبيّ ليس بلا حدود. حين يمسّ حقّ آخر أو مصلحة الجمهور، يمكن تقييده. لكن التقييد يجب أن يكون بقانون، ولغاية مشروعة، وبالقدر اللازم فقط.", "ru": "Относительное право не безгранично. Когда оно задевает право другого или общее благо, его можно ограничить. Но ограничение должно быть в законе, с достойной целью и только в необходимой мере.", "en": "A relative right is not unlimited. When it harms another's right or the public good, it can be limited. But the limit must be in law, for a proper purpose, and no more than needed."},null)
 ],
 [ /* רמה 3 — ניתוח */
  Q("rights-anal1",
    {he:"עיתון מבקש לפרסם צילומים ממצלמות אבטחה של חשוד שטרם הורשע. אילו זכויות מתנגשות, וכיצד נהוג לאזן?",
     ar:"تريد صحيفة نشر لقطات كاميرات مراقبة لمشتبه به لم يُدَن بعد. أيّ حقوق تتصادم، وكيف تجري الموازنة عادةً؟",
     ru:"Газета хочет опубликовать кадры с камер наблюдения подозреваемого, ещё не осуждённого. Какие права сталкиваются и как принято их уравновешивать?",
     en:"A newspaper wants to publish CCTV footage of a suspect not yet convicted. Which rights collide, and how is the balance usually struck?"},
   [{he:"חופש הביטוי וזכות הציבור לדעת מול הזכות לשם טוב, לפרטיות ולחזקת החפות. מאזנים לפי מידת העניין הציבורי ומידת הפגיעה, ולעיתים בפרסום חלקי או באיסור זמני.",
     ar:"حرّية التعبير وحقّ الجمهور في المعرفة مقابل الحقّ في السمعة والخصوصية وقرينة البراءة. تجري الموازنة بحسب حجم المصلحة العامة وحجم المساس، وأحيانًا بنشر جزئيّ أو منع مؤقّت.",
     ru:"Свобода слова и право общества знать против права на доброе имя, частную жизнь и презумпции невиновности. Уравновешивают по мере общественного интереса и тяжести ущерба, иногда частичной публикацией или временным запретом.",
     en:"Freedom of expression and the public's right to know against the rights to reputation, privacy and the presumption of innocence. The balance turns on the weight of the public interest and of the harm, sometimes through partial publication or a temporary ban."},
    {he:"אין התנגשות: פרסום כל מידע שהגיע לעיתון מותר תמיד.",
     ar:"لا تصادم: نشر أيّ معلومة تصل الصحيفة جائز دائمًا.",
     ru:"Столкновения нет: публиковать любую попавшую в газету информацию всегда можно.",
     en:"There is no collision: publishing anything that reaches a newspaper is always permitted."},
    {he:"אין התנגשות: פרסום אסור תמיד עד להרשעה חלוטה.",
     ar:"لا تصادم: النشر ممنوع دائمًا حتى إدانة نهائية.",
     ru:"Столкновения нет: публикация всегда запрещена до окончательного приговора.",
     en:"There is no collision: publication is always forbidden until a final conviction."},
    {he:"ההתנגשות היא בין חופש העיסוק של העיתונאי לזכות הקניין של בעל המצלמה, ומכריעים בה לפי מי מימן את ההתקנה, מי מחזיק בהקלטה ומה נכתב בתנאי השימוש שבמקום.",
     ar:"التعارض هو بين حرّية عمل الصحفيّ وحقّ الملكية لصاحب الكاميرا، ويُحسَم بحسب مَن موّل التركيب، ومَن يحتفظ بالتسجيل، وما ورد في شروط الاستخدام المعلنة في المكان.",
     ru:"Столкновение: между свободой занятий журналиста и правом собственности владельца камеры; решают его по тому, кто оплатил установку, у кого хранится запись и что сказано в правилах пользования на месте.",
     en:"The clash is between the journalist's freedom of occupation and the camera owner's property right, and it is settled by who paid for the installation, who holds the recording and what the posted terms of use say."}],
   0,
   {he:"שני צדדים, ולכל אחד זכות אמיתית. חפשו את התשובה שאינה מוחקת אף אחד מהם.",
    ar:"طرفان، ولكلٍّ حقّ حقيقيّ. ابحثوا عن الجواب الذي لا يمحو أيًّا منهما.",
    ru:"Две стороны, и у каждой настоящее право. Ищите ответ, который не стирает ни одну.",
    en:"Two sides, each with a genuine right. Look for the answer that erases neither."},
   {he:"התנגשות זכויות אינה נפתרת בהכרזה שזכות אחת “חשובה יותר”, אלא באיזון קונקרטי: מה עוצמת הפגיעה, מה תרומת הפרסום, והאם יש אמצעי ביניים. חזקת החפות מחייבת גם ניסוח זהיר — “חשוד” ולא “פושע”.",
    ar:"لا يُحلّ تصادم الحقوق بإعلان أن حقًّا “أهمّ”، بل بموازنة عيانية: ما شدّة المساس، وما إسهام النشر، وهل من وسيلة وسطى. وقرينة البراءة تفرض صياغة حذرة، “مشتبه به” لا “مجرم”.",
    ru:"Столкновение прав решается не объявлением одного «важнее», а конкретным взвешиванием: какова тяжесть ущерба, какова польза публикации, есть ли промежуточное средство. Презумпция невиновности требует и осторожных формулировок: «подозреваемый», а не «преступник».",
    en:"A clash of rights is not settled by declaring one right “more important”, but by a concrete balance: how severe the harm, what the publication contributes, and whether a middle course exists. The presumption of innocence also demands careful wording: “suspect”, not “criminal”."},
   null),
  Q("rights-anal2",
    {he:"מהי “העדפה מתקנת”, ומהו הטיעון המרכזי בעדה ומולה?",
     ar:"ما هو “التفضيل التصحيحيّ”، وما الحجّة المركزية معه وضدّه؟",
     ru:"Что такое «корректирующее предпочтение» и каков главный аргумент за и против?",
     en:"What is “affirmative action”, and what is the central argument for and against it?"},
   [{he:"מתן העדפה לקבוצה שסבלה מהפליה מתמשכת, כדי לקדם שוויון הזדמנויות מהותי. בעדה — תיקון עוול מבני; מולה — פגיעה בשוויון הפורמלי ובעקרון הכישורים.",
     ar:"منح أفضلية لمجموعة عانت تمييزًا متواصلًا، لتعزيز تكافؤ فرص جوهريّ. معه، تصحيح ظلم بنيويّ؛ ضدّه، مساس بالمساواة الشكلية وبمبدأ الكفاءة.",
     ru:"Предпочтение группе, долго страдавшей от дискриминации, ради содержательного равенства возможностей. За: исправление структурной несправедливости; против: ущерб формальному равенству и принципу заслуг.",
     en:"Preference for a group that has suffered sustained discrimination, to advance substantive equality of opportunity. For: repairing structural injustice; against: harm to formal equality and to merit."},
    {he:"חיוב המדינה לפצות כספית כל מי שהופלה בעבר, במקום לשנות את כללי הקבלה. בעדה — הפיצוי אישי ומדיד; מולה — עלות תקציבית גבוהה וקושי להוכיח הפליה שנים לאחר מעשה.",
     ar:"إلزام الدولة بتعويض ماليّ لكلّ مَن مُيّز ضدّه في الماضي، بدل تغيير قواعد القبول. معها، التعويض شخصيّ وقابل للقياس؛ ضدّها، كلفة ميزانياتية عالية وصعوبة إثبات التمييز بعد سنوات.",
     ru:"Обязанность государства выплатить компенсацию каждому, кого дискриминировали в прошлом, вместо изменения правил приёма. За: компенсация личная и измеримая; против: высокая бюджетная цена и трудность доказать дискриминацию спустя годы.",
     en:"Requiring the state to pay compensation to everyone discriminated against in the past, instead of changing the admission rules. For: the payment is personal and measurable; against: a high budget cost and the difficulty of proving discrimination years later."},
    {he:"איסור על פרסום נתונים סטטיסטיים לפי מוצא. בעדו — נתונים כאלה מזינים דעות קדומות; נגדו — בלי נתונים אי אפשר להוכיח הפליה, ולכן גם אי אפשר לתקן אותה.",
     ar:"منع نشر معطيات إحصائية بحسب الأصل. معه، هذه المعطيات تغذّي الأحكام المسبقة؛ ضدّه، بدون معطيات لا يمكن إثبات التمييز، ولذلك لا يمكن تصحيحه أيضًا.",
     ru:"Запрет публиковать статистику по происхождению. За: такие данные питают предрассудки; против: без данных нельзя доказать дискриминацию, а значит нельзя её и исправить.",
     en:"A ban on publishing statistics by ethnic origin. For: such data feed prejudice; against, without data discrimination cannot be proved, and therefore cannot be corrected either."},
    {he:"מדיניות המבטלת את מבחני הקבלה עבור כל המועמדים.",
     ar:"سياسة تلغي امتحانات القبول لجميع المرشّحين.",
     ru:"Политика, отменяющая вступительные экзамены для всех кандидатов.",
     en:"A policy that abolishes admission tests for all candidates."}],
   0,
   {he:"המילה “מתקנת” מרמזת שיש מה לתקן. מה?",
    ar:"كلمة “تصحيحيّ” تلمّح إلى وجود ما يُصحَّح. ما هو؟",
    ru:"Слово «корректирующее» намекает, что есть что исправлять. Что именно?",
    en:"The word “corrective” hints that something needs correcting. What?"},
   {he:"זהו מתח בין שוויון פורמלי (יחס זהה מכאן והלאה) לשוויון מהותי (תוצאה שוויונית בפועל). בישראל היא מעוגנת בחקיקה לגבי ייצוג הולם — לנשים, לערבים, לאנשים עם מוגבלות וליוצאי אתיופיה — בשירות הציבורי ובדירקטוריונים.",
    ar:"هذا توتّر بين مساواة شكلية (معاملة متطابقة من الآن) ومساواة جوهرية (نتيجة متساوية فعلًا). في إسرائيل هي مرسّخة تشريعيًّا في التمثيل الملائم، للنساء والعرب وذوي الإعاقة ويهود إثيوبيا، في الخدمة العامة ومجالس الإدارة.",
    ru:"Это напряжение между формальным равенством (одинаковое обращение отныне) и содержательным (фактически равный результат). В Израиле оно закреплено законом о надлежащем представительстве: женщин, арабов, людей с инвалидностью и выходцев из Эфиопии: в госслужбе и советах директоров.",
    en:"This is the tension between formal equality (identical treatment from now on) and substantive equality (an actually equal outcome). In Israel it is anchored in legislation on adequate representation: for women, Arabs, people with disabilities and Israelis of Ethiopian origin: in the civil service and on company boards."},
   null),
  Q("rights-anal3",
    {he:"מדינה מבקשת להתקין זיהוי פנים בכל מרחב ציבורי כדי לצמצם פשיעה. כיצד בוחנים את הפגיעה בזכויות?",
     ar:"تريد دولة نصب تمييز وجوه في كلّ حيّز عامّ لتقليل الجريمة. كيف يُفحص المساس بالحقوق؟",
     ru:"Государство хочет установить распознавание лиц во всех общественных местах ради снижения преступности. Как оценивать ущерб правам?",
     en:"A state wants facial recognition in every public space to cut crime. How is the infringement of rights assessed?"},
   [{he:"אין צורך בבחינה — מרחב ציבורי אינו פרטי, ומי שיוצא לרחוב מוותר מדעת על ציפייה לפרטיות, ולכן צילום פניו אינו פגיעה הטעונה הצדקה.",
     ar:"لا حاجة إلى فحص، الحيّز العامّ ليس خاصًّا، ومَن يخرج إلى الشارع يتنازل عن توقّع الخصوصية، ولذلك تصوير وجهه ليس مسًّا يستوجب تبريرًا.",
     ru:"Проверка не нужна: общественное пространство не является частным, и тот, кто выходит на улицу, сознательно отказывается от ожидания приватности, поэтому съёмка его лица не является нарушением, требующим оправдания.",
     en:"No examination is needed: public space is not private, and whoever steps into the street knowingly gives up any expectation of privacy, so filming his face is not an infringement that requires justification."},
    {he:"בוחנים רק אם המערכת מדויקת מבחינה טכנית.",
     ar:"يُفحص فقط إن كانت المنظومة دقيقة تقنيًّا.",
     ru:"Проверяют только техническую точность системы.",
     en:"Only the technical accuracy of the system is examined."},
    {he:"בפסקת ההגבלה: האם יש חוק מפורש, תכלית ראויה, והאם המעקב הגורף הוא האמצעי הפוגעני פחות — או שאפשר להסתפק במעקב ממוקד ומוגבל בזמן.",
     ar:"بفقرة التقييد: هل ثمّة قانون صريح وغاية مشروعة، وهل المراقبة الشاملة أقلّ الوسائل مساسًا، أم تكفي مراقبة مركّزة محدودة زمنيًّا.",
     ru:"По ограничительной оговорке: есть ли прямой закон, достойная цель, и является ли сплошная слежка наименее ущемляющим средством, или довольно точечной и ограниченной по времени.",
     en:"By the limitation clause: is there an explicit statute, a proper purpose, and is blanket surveillance the least harmful means, or would targeted, time-limited monitoring suffice."},
    {he:"בוחנים אם רוב הציבור תומך במהלך בסקר.",
     ar:"يُفحص إن كانت أغلبية الجمهور تؤيّد الخطوة في استطلاع.",
     ru:"Проверяют, поддерживает ли шаг большинство в опросе.",
     en:"One checks whether a majority supports the move in a poll."}],
   2,
   {he:"יש כלי אחד קבוע לבחינת פגיעה בזכות. איך הוא נקרא, ומה ארבעת תנאיו?",
    ar:"ثمّة أداة ثابتة لفحص المساس بحقّ. ما اسمها، وما شروطها الأربعة؟",
    ru:"Есть один устойчивый инструмент проверки ущерба праву. Как он называется и каковы его четыре условия?",
    en:"There is one standard tool for testing an infringement of a right. What is it called, and what are its four conditions?"},
   {he:"פרטיות במרחב הציבורי מוגנת גם היא: ההבדל בין שוטר שרואה אותך לבין מערכת שזוכרת כל מקום שהיית בו הוא הבדל של מהות ולא של מידה. סקר תמיכה אינו חלק מפסקת ההגבלה — רוב אינו מכשיר פגיעה.",
    ar:"الخصوصية في الحيّز العامّ محميّة أيضًا: الفرق بين شرطيّ يراك ومنظومة تتذكّر كلّ مكان كنت فيه فرق جوهر لا درجة. واستطلاع التأييد ليس جزءًا من فقرة التقييد، الأغلبية لا تُجيز المساس.",
    ru:"Частная жизнь защищена и в общественном пространстве: разница между полицейским, который тебя видит, и системой, которая помнит каждое твоё место, качественная, а не количественная. Опрос поддержки в ограничительную оговорку не входит: большинство не узаконивает ущерб.",
    en:"Privacy in public space is protected too: the difference between a policeman who sees you and a system that remembers everywhere you have been is one of kind, not degree. A supportive poll is no part of the limitation clause: a majority does not license an infringement."},
   null),
  Q("rt-3-01",{"he": "חוק חדש אוסר על נהגי מוניות לנהוג יותר מ-12 שעות ברצף, כדי למנוע תאונות. נהג טוען שהחוק פוגע בזכותו. איך בית המשפט יבחן את הטענה?", "ar": "قانون جديد يمنع سائقي سيّارات الأجرة من القيادة أكثر من 12 ساعة متواصلة، لمنع الحوادث. يدّعي سائق أن القانون يمسّ حقّه. كيف ستفحص المحكمة الادّعاء؟", "ru": "Новый закон запрещает таксистам водить больше 12 часов подряд, чтобы предотвратить аварии. Водитель утверждает, что закон нарушает его право. Как суд рассмотрит это утверждение?", "en": "A new law bans taxi drivers from driving more than 12 hours in a row, to prevent accidents. A driver claims the law harms his right. How will the court examine the claim?"},[{"he": "יפסול את החוק מיד: כל הגבלה על חופש העיסוק אסורה.", "ar": "ستُبطل القانون فورًا: كلّ تقييد لحرّية العمل ممنوع.", "ru": "Сразу отменит закон: любое ограничение свободы занятий запрещено.", "en": "It will strike the law down at once: any limit on freedom of occupation is forbidden."}, {"he": "יבדוק אם הפגיעה בחופש העיסוק היא לתכלית ראויה, כמו בטיחות, ואם היא מידתית.", "ar": "ستفحص إن كان المسّ بحرّية العمل لغاية مشروعة، كالسلامة، وإن كان تناسبيًّا.", "ru": "Проверит, служит ли ограничение свободы занятий достойной цели, например безопасности, и соразмерно ли оно.", "en": "It will check whether the limit on freedom of occupation serves a proper purpose, such as safety, and is proportionate."}, {"he": "לא יבדוק דבר: חוק שהכנסת חוקקה אינו נתון לביקורת של בית משפט, גם כשהוא פוגע בזכות שבחוק יסוד.", "ar": "لن تفحص شيئًا: القانون الذي سنّته الكنيست لا يخضع لرقابة المحكمة، حتى حين يمسّ حقًّا في قانون أساس.", "ru": "Ничего не проверит: закон Кнессета не подлежит судебному контролю, даже если он нарушает право из основного закона.", "en": "It will examine nothing: a law passed by the Knesset is never subject to court review, even when it harms a right set in a Basic Law."}, {"he": "ידחה את הטענה: לא נפגעה זכות, כי הנהג יכול לבחור מקצוע אחר.", "ar": "سترفض الادّعاء: لم يُمسّ أيّ حقّ، لأن السائق يستطيع اختيار مهنة أخرى.", "ru": "Отклонит жалобу: право не нарушено, ведь водитель может выбрать другую профессию.", "en": "It will reject the claim: no right was harmed, since the driver can choose another job."}],1,{"he": "זכות שאינה מוחלטת אפשר להגביל, אבל רק בתנאים. אילו?", "ar": "يمكن تقييد الحقّ غير المطلق، لكن بشروط فقط. ما هي؟", "ru": "Неабсолютное право можно ограничить, но только при условиях. Каких?", "en": "A right that is not absolute can be limited, but only on conditions. Which ones?"},{"he": "החוק פוגע בחופש העיסוק, ולכן הוא נבחן לפי פסקת ההגבלה. בטיחות בדרכים היא תכלית ראויה. בית המשפט ישאל אם ההגבלה אינה רחבה יותר מהנדרש.", "ar": "القانون يمسّ حرّية العمل، لذلك يُفحص وفق فقرة التقييد. السلامة على الطرق غاية مشروعة. والمحكمة ستسأل إن كان التقييد أوسع من اللازم.", "ru": "Закон ограничивает свободу занятий, поэтому его проверяют по ограничительной оговорке. Безопасность на дорогах: достойная цель. Суд спросит, не шире ли ограничение, чем нужно.", "en": "The law limits freedom of occupation, so it is tested under the limitation clause. Road safety is a proper purpose. The court will ask whether the limit goes further than needed."},null),
  Q("rt-3-02",{"he": "אוניברסיטה נותנת זמן נוסף בבחינה לסטודנטים עם דיסלקציה. סטודנט אחר טוען שזו פגיעה בשוויון. מהי התשובה המקובלת?", "ar": "تمنح جامعة وقتًا إضافيًّا في الامتحان للطلّاب ذوي عسر القراءة. يدّعي طالب آخر أن هذا مسّ بالمساواة. ما الجواب المقبول؟", "ru": "Университет даёт студентам с дислексией дополнительное время на экзамене. Другой студент утверждает, что это нарушает равенство. Какой ответ общепринят?", "en": "A university gives students with dyslexia extra exam time. Another student claims this harms equality. What is the accepted answer?"},[{"he": "הוא צודק: שוויון פירושו שכולם נבחנים בדיוק באותם תנאים, בלי שום יוצא מן הכלל ובלי התחשבות במצבו של איש.", "ar": "إنه محقّ: المساواة تعني أن يُمتحن الجميع بالشروط نفسها تمامًا، دون أيّ استثناء ودون مراعاة حال أحد.", "ru": "Он прав: равенство значит, что все сдают экзамен в одних и тех же условиях, без исключений и без учёта чьего-либо положения.", "en": "He is right: equality means everyone sits the exam under exactly the same conditions, with no exceptions and no regard for anyone's situation."}, {"he": "הוא צודק, אבל ההטבה מותרת כי האוניברסיטה פרטית.", "ar": "إنه محقّ، لكن الامتياز مسموح لأن الجامعة خاصّة.", "ru": "Он прав, но льгота разрешена, потому что университет частный.", "en": "He is right, but the benefit is allowed because the university is private."}, {"he": "אין פגיעה: יחס שונה בגלל שוני רלוונטי מקדם שוויון הזדמנויות אמיתי.", "ar": "لا مسّ: المعاملة المختلفة بسبب فرق ذي صلة تعزّز تكافؤ فرص حقيقيًّا.", "ru": "Нарушения нет: иное отношение из-за существенного отличия создаёт реальное равенство возможностей.", "en": "No harm: different treatment due to a relevant difference promotes real equality of opportunity."}, {"he": "אין פגיעה, כי לשוויון אין מקום במוסדות להשכלה.", "ar": "لا مسّ، لأن لا مكان للمساواة في مؤسّسات التعليم العالي.", "ru": "Нарушения нет, ведь равенству нет места в вузах.", "en": "No harm, because equality has no place in higher education."}],2,{"he": "האם יחס זהה לאנשים במצב שונה תמיד יוצר הוגנות?", "ar": "هل تُحقّق المعاملة المتطابقة لأناس في أوضاع مختلفة العدلَ دائمًا؟", "ru": "Всегда ли одинаковое отношение к людям в разном положении справедливо?", "en": "Does identical treatment of people in different situations always produce fairness?"},{"he": "שוויון פורמלי מתייחס לכולם אותו דבר. שוויון מהותי מתחשב בשוני רלוונטי, כמו לקות למידה. הזמן הנוסף מפצה על קושי, ולכן הוא מקדם שוויון ולא פוגע בו.", "ar": "المساواة الشكلية تعامل الجميع بالطريقة نفسها. أمّا المساواة الجوهرية فتراعي الفرق ذا الصلة، كعسر التعلّم. الوقت الإضافيّ يعوّض صعوبة، لذلك يعزّز المساواة ولا يمسّها.", "ru": "Формальное равенство обращается со всеми одинаково. Сущностное учитывает существенное отличие, например нарушение обучаемости. Дополнительное время компенсирует трудность, поэтому продвигает равенство, а не нарушает его.", "en": "Formal equality treats everyone the same. Substantive equality takes relevant differences into account, such as a learning disability. Extra time offsets a difficulty, so it advances equality rather than harming it."},null),
  Q("rt-3-03",{"he": "מדוע קשה יותר לאכוף זכות חברתית, כמו הזכות לדיור, מאשר זכות אזרחית, כמו חופש הביטוי?", "ar": "لماذا يصعب فرض حقّ اجتماعيّ، كالحقّ في السكن، أكثر من حقّ مدنيّ، كحرّية التعبير؟", "ru": "Почему социальное право, например право на жильё, труднее обеспечить, чем гражданское, например свободу слова?", "en": "Why is a social right, like the right to housing, harder to enforce than a civil right, like freedom of expression?"},[{"he": "כי זכויות חברתיות שייכות רק לאזרחים ותיקים.", "ar": "لأن الحقوق الاجتماعية تخصّ المواطنين القدامى فقط.", "ru": "Потому что социальные права есть только у давних граждан.", "en": "Because social rights belong only to long-standing citizens."}, {"he": "כי אף מדינה בעולם אינה מכירה בזכויות חברתיות.", "ar": "لأن أيّ دولة في العالم لا تعترف بالحقوق الاجتماعية.", "ru": "Потому что ни одна страна в мире не признаёт социальных прав.", "en": "Because no country in the world recognises social rights."}, {"he": "כי זכויות אזרחיות נקבעות בבית המשפט, ואילו זכויות חברתיות נקבעות רק בהסכמים קיבוציים בין עובדים למעסיקים במשק.", "ar": "لأن الحقوق المدنية تقرّرها المحكمة، أمّا الحقوق الاجتماعية فتُقرَّر فقط في اتفاقيات عمل جماعية بين العمّال وأصحاب العمل في الاقتصاد.", "ru": "Потому что гражданские права устанавливает суд, а социальные: только коллективные договоры между работниками и работодателями в экономике.", "en": "Because civil rights are set by the courts, while social rights are set only in collective agreements between workers and their employers."}, {"he": "כי זכות אזרחית דורשת בעיקר שהמדינה לא תתערב, וזכות חברתית דורשת ממנה לפעול ולהקצות תקציב.", "ar": "لأن الحقّ المدنيّ يتطلّب أساسًا ألّا تتدخّل الدولة، أمّا الحقّ الاجتماعيّ فيتطلّب منها أن تعمل وتخصّص ميزانية.", "ru": "Потому что гражданское право требует в основном невмешательства государства, а социальное: действий и выделения бюджета.", "en": "Because a civil right mainly requires the state not to interfere, while a social right requires it to act and allocate a budget."}],3,{"he": "השוו: מה המדינה צריכה לעשות כדי שאדם יוכל לדבר? ומה כדי שיהיה לו בית?", "ar": "قارنوا: ماذا على الدولة أن تفعل كي يستطيع الإنسان الكلام؟ وماذا كي يكون له بيت؟", "ru": "Сравните: что должно сделать государство, чтобы человек мог говорить? А чтобы у него был дом?", "en": "Compare: what must the state do so a person can speak? And so they have a home?"},{"he": "כדי לשמור על חופש הביטוי, די שהמדינה לא תשתיק אנשים. כדי לספק דיור, היא צריכה לבנות, לסבסד ולהקצות כסף. זו הכרעה על סדרי עדיפויות, ולכן בתי משפט נזהרים מלהתערב בה.", "ar": "لحماية حرّية التعبير يكفي ألّا تُسكت الدولة الناس. أمّا لتوفير السكن فعليها أن تبني وتدعم وتخصّص المال. هذا قرار في سلّم الأولويات، لذلك تتحفّظ المحاكم من التدخّل فيه.", "ru": "Для свободы слова достаточно, чтобы государство не заставляло людей молчать. Для жилья ему нужно строить, субсидировать и выделять деньги. Это решение о приоритетах, поэтому суды осторожны с вмешательством.", "en": "To protect free speech, it is enough that the state does not silence people. To provide housing, it must build, subsidise and allocate money. That is a decision about priorities, so courts are wary of stepping in."},null),
  Q("rt-3-04",{"he": "חופש הביטוי הוא זכות יסוד. מדוע בכל זאת מותר להגביל ביטוי שקורא לפגוע באנשים?", "ar": "حرّية التعبير حقّ أساسيّ. لماذا يجوز مع ذلك تقييد تعبير يدعو إلى إيذاء الناس؟", "ru": "Свобода слова: основное право. Почему всё же можно ограничить высказывание, призывающее причинить вред людям?", "en": "Freedom of expression is a basic right. Why may speech that calls for harming people still be limited?"},[{"he": "כי הוא יוצר סכנה ממשית לחיים ולביטחון של אחרים, וזכויות אלה גוברות במקרה כזה.", "ar": "لأنه يخلق خطرًا حقيقيًّا على حياة الآخرين وأمنهم، وهذه الحقوق تتغلّب في حالة كهذه.", "ru": "Потому что оно создаёт реальную угрозу жизни и безопасности других, и эти права в таком случае перевешивают.", "en": "Because it creates a real danger to other people's lives and safety, and those rights prevail in such a case."}, {"he": "כי חופש הביטוי מגן רק על דעות שהרוב מסכים איתן.", "ar": "لأن حرّية التعبير تحمي فقط الآراء التي توافق عليها الأغلبية.", "ru": "Потому что свобода слова защищает только мнения, с которыми согласно большинство.", "en": "Because freedom of expression protects only views the majority agrees with."}, {"he": "כי חופש הביטוי חל רק על חברי כנסת בזמן נאום במליאה, ולא על אזרחים רגילים ברחוב, בעיתון או ברשתות החברתיות.", "ar": "لأن حرّية التعبير تسري فقط على أعضاء الكنيست أثناء الخطابة في الهيئة العامة، لا على المواطنين العاديين في الشارع أو الصحف أو الشبكات الاجتماعية.", "ru": "Потому что свобода слова распространяется только на депутатов Кнессета во время речи в пленуме, а не на обычных граждан на улице, в газетах или соцсетях.", "en": "Because freedom of expression covers only Knesset members speaking in the plenum, not ordinary citizens in the street, in newspapers or on social media."}, {"he": "כי מותר להגביל כל ביטוי שפוגע ברגשות של מישהו.", "ar": "لأنه يجوز تقييد كلّ تعبير يجرح مشاعر أحد.", "ru": "Потому что можно ограничить любое высказывание, задевающее чьи-то чувства.", "en": "Because any speech that hurts someone's feelings may be limited."}],0,{"he": "חשבו מה עלול לקרות לאחרים אם הקריאה תתממש.", "ar": "فكّروا: ماذا قد يحدث للآخرين إذا تحقّقت الدعوة؟", "ru": "Подумайте, что может случиться с другими, если призыв осуществится.", "en": "Think about what could happen to others if the call were carried out."},{"he": "חופש הביטוי מגן גם על דעות לא פופולריות ופוגעניות. אבל קריאה לאלימות מסכנת חיים, והזכות לחיים ולביטחון גוברת. לכן ההגבלה כאן מוצדקת, בתנאי שהיא מידתית.", "ar": "حرّية التعبير تحمي أيضًا الآراء غير الشعبية والجارحة. لكن الدعوة إلى العنف تعرّض الحياة للخطر، والحقّ في الحياة والأمن يتغلّب. لذلك التقييد هنا مبرَّر، بشرط أن يكون تناسبيًّا.", "ru": "Свобода слова защищает и непопулярные, и обидные мнения. Но призыв к насилию угрожает жизни, а право на жизнь и безопасность перевешивает. Поэтому ограничение здесь оправдано, если оно соразмерно.", "en": "Freedom of expression also protects unpopular and offensive views. But a call to violence endangers life, and the right to life and safety prevails. So a limit here is justified, provided it is proportionate."},null)
 ]
]);

topic("basic","rig",
  {he:"חוקי היסוד ומדרג הנורמות",ar:"قوانين الأساس ومراتب المعايير",ru:"Основные законы и иерархия норм",en:"Basic laws and the hierarchy of norms"},
  {he:"למה אין בישראל חוקה, ומה גובר על מה",
   ar:"لماذا لا دستور في إسرائيل، وما الذي يعلو على ماذا",
   ru:"Почему в Израиле нет конституции и что над чем стоит",
   en:"Why Israel has no constitution, and what overrides what"},
[
 [ /* רמה 1 — ידע */
  Q("basic-hier",
    {he:"לפי מדרג הנורמות, מה גובר על מה?",
     ar:"وفق مراتب المعايير، ما الذي يعلو على ماذا؟",
     ru:"Согласно иерархии норм, что над чем стоит?",
     en:"According to the hierarchy of norms, what overrides what?"},
   [{he:"חוק יסוד גובר על חוק רגיל, חוק גובר על תקנה, ותקנה גוברת על הנחיה מנהלית.",
     ar:"قانون أساس يعلو على قانون عاديّ، والقانون على اللائحة، واللائحة على التعليمات الإدارية.",
     ru:"Основной закон выше обычного, закон выше постановления, постановление выше административной инструкции.",
     en:"A basic law overrides an ordinary statute, a statute overrides a regulation, and a regulation overrides an administrative directive."},
    {he:"תקנה גוברת על חוק, מפני שהיא מפורטת יותר, מותאמת למקרה הקונקרטי ומעודכנת יותר.",
     ar:"اللائحة تعلو على القانون، لأنّها أكثر تفصيلًا وملاءمةً للحالة المحدّدة وأحدث عهدًا.",
     ru:"Постановление выше закона, потому что оно подробнее, ближе к конкретному случаю и новее по времени.",
     en:"A regulation prevails over a statute, because it is more detailed, fitted to the concrete case and more recent."},
    {he:"פסק דין גובר על חוק יסוד, מפני שהוא ניתן מאוחר יותר ומחייב את הצדדים שהתדיינו בו.",
     ar:"الحكم القضائيّ يعلو على قانون أساس، لأنّه صدر لاحقًا ويُلزم الأطراف التي تقاضت فيه.",
     ru:"Судебное решение выше Основного закона, потому что вынесено позже и обязывает стороны спора.",
     en:"A judgment prevails over a Basic Law, because it was given later and binds the parties who litigated."},
    {he:"אין מדרג: כל הנורמות שוות במעמדן, וההכרעה ביניהן נעשית לפי מועד קבלתן ולפי הגוף שקבע אותן.",
     ar:"لا تراتبية: كلّ المعايير متساوية في مكانتها، والحسم بينها يجري بحسب تاريخ إقرارها وبحسب الجهة التي أقرّتها.",
     ru:"Иерархии нет: все нормы равны по статусу, а спор между ними решается по дате принятия и по органу, который их принял.",
     en:"There is no hierarchy: all norms rank equally, and conflicts are settled by their date of enactment and by the body that enacted them."}],
   0,
   {he:"מי מחוקק כל אחת מהן — הכנסת, שר, או פקיד? ככל שהמחוקק “גבוה” יותר, כך הנורמה גבוהה יותר.",
    ar:"مَن يسنّ كلًّا منها، الكنيست أم وزير أم موظّف؟ كلّما علا المشرّع علت المرتبة.",
    ru:"Кто издаёт каждую: Кнессет, министр или чиновник? Чем «выше» законодатель, тем выше норма.",
    en:"Who makes each one: the Knesset, a minister, or an official? The higher the maker, the higher the norm."},
   {he:"המדרג אינו סדר יופי: תקנה שסותרת חוק בטלה, והנחיה מנהלית שסותרת תקנה בטלה. זו הדרך שבה ההחלטה של הפקיד נשארת כפופה למה שהכנסת החליטה.",
    ar:"المراتب ليست ترتيبًا جماليًّا: لائحة تناقض قانونًا باطلة، وتعليمات إدارية تناقض لائحة باطلة. هكذا يبقى قرار الموظّف خاضعًا لما قرّرته الكنيست.",
    ru:"Иерархия: не украшение: постановление, противоречащее закону, ничтожно, а инструкция, противоречащая постановлению, ничтожна. Так решение чиновника остаётся подчинено тому, что решил Кнессет.",
    en:"The hierarchy is not decorative: a regulation that contradicts a statute is void, and a directive that contradicts a regulation is void. That is how an official's decision stays subordinate to what the Knesset decided."},
   "pyramid"),
  Q("basic-why",
    {he:"מדוע אין בישראל חוקה שלמה כתובה?",
     ar:"لماذا لا يوجد في إسرائيل دستور كامل مكتوب؟",
     ru:"Почему в Израиле нет цельной писаной конституции?",
     en:"Why does Israel have no complete written constitution?"},
   [{he:"מפני שהחוק הבינלאומי אוסר על מדינות חדשות לכתוב חוקה.",
     ar:"لأن القانون الدوليّ يمنع الدول الجديدة من كتابة دستور.",
     ru:"Потому что международное право запрещает новым государствам писать конституцию.",
     en:"Because international law forbids new states from writing a constitution."},
    {he:"מפני שמגילת העצמאות היא חוקה מחייבת לכל דבר — היא מגדירה את ערכי המדינה, ובית המשפט פוסל לפיה חוקים הסותרים אותה, ולכן לא נדרש מסמך נוסף.",
     ar:"لأنّ وثيقة الاستقلال دستور مُلزِم بكلّ معنى، فهي تحدّد قيم الدولة، وتبطل المحكمة بموجبها القوانين المناقضة لها، ولذلك لم تعد هناك حاجة إلى وثيقة أخرى.",
     ru:"Потому что Декларация независимости: полноценная обязывающая конституция: она определяет ценности государства, суд отменяет по ней противоречащие законы, и потому другой документ не понадобился.",
     en:"Because the Declaration of Independence is a binding constitution in every sense. It defines the state's values, the court strikes down laws that contradict it, and so no further document was needed."},
    {he:"בשל מחלוקות עמוקות — בעיקר בענייני דת ומדינה וזהות המדינה. במקום זאת התקבלה “החלטת הררי” (1950), שלפיה החוקה תיכתב פרקים־פרקים כחוקי יסוד.",
     ar:"بسبب خلافات عميقة، خاصّة في الدين والدولة وهويّة الدولة. وبدلًا من ذلك أُقرّ “قرار هراري” (١٩٥٠): يُكتب الدستور فصلًا فصلًا كقوانين أساس.",
     ru:"Из-за глубоких разногласий: прежде всего о религии и государстве и о его идентичности. Вместо этого принято «решение Харари» (1950): конституция пишется главами, как основные законы.",
     en:"Because of deep disagreements: mainly over religion and state and the state's identity. Instead the Harari Decision (1950) was adopted: the constitution would be written chapter by chapter, as basic laws."},
    {he:"מפני שהכנסת הראשונה התפזרה בטרם השלימה את נוסח החוקה.",
     ar:"لأنّ الكنيست الأولى حُلّت قبل أن تُنجز صياغة الدستور.",
     ru:"Потому что первый Кнессет распустился, не успев завершить текст конституции.",
     en:"Because the first Knesset dissolved before it finished drafting the constitution."}],
   2,
   {he:"בשביל חוקה צריכים הסכמה רחבה מאוד. על מה הכי קשה להסכים בחברה הישראלית?",
    ar:"لكي يكون دستور نحتاج إلى توافق واسع جدًا. ما الأصعب اتفاقًا عليه في المجتمع الإسرائيلي؟",
    ru:"Для конституции нужно очень широкое согласие. О чём труднее всего договориться в израильском обществе?",
    en:"A constitution needs very broad agreement. What is hardest to agree on in Israeli society?"},
   {he:"עד היום התקבלו כתריסר חוקי יסוד. שניים מהם — כבוד האדם וחירותו, וחופש העיסוק — הם “חוקי היסוד של הזכויות”, ורק הם כוללים פסקת הגבלה. חוקי יסוד אחרים עוסקים במוסדות: הכנסת, הממשלה, השפיטה.",
    ar:"حتى اليوم أُقرّ نحو اثني عشر قانون أساس. اثنان منها، كرامة الإنسان وحرّيته، وحرّية العمل، هما “قانونا أساس الحقوق”، وهما وحدهما يتضمّنان فقرة تقييد. أما البقية فتتناول المؤسّسات: الكنيست، الحكومة، القضاء.",
    ru:"К сегодняшнему дню принято около дюжины основных законов. Два из них: о достоинстве и свободе человека и о свободе занятий: «основные законы прав», и лишь они содержат ограничительную оговорку. Остальные касаются институтов: Кнессета, правительства, судебной власти.",
    en:"About a dozen basic laws have been enacted. Two of them: Human Dignity and Liberty, and Freedom of Occupation: are the “rights basic laws”, and only they contain a limitation clause. The rest deal with institutions: the Knesset, the government, the judiciary."},
   null),
  Q("basic-limit",
    {he:"מהי פסקת ההגבלה, ומה היא קובעת?",
     ar:"ما هي فقرة التقييد، وماذا تقرّر؟",
     ru:"Что такое ограничительная оговорка и что она устанавливает?",
     en:"What is the limitation clause, and what does it lay down?"},
   [{he:"סעיף האוסר על הכנסת לחוקק בשעת חירום, ומחייב אותה להעביר את סמכות החקיקה לממשלה עד שיוסר מצב החירום ותשוב הפעילות הסדירה.",
     ar:"بند يمنع الكنيست من التشريع في حالة الطوارئ، ويلزمها بنقل صلاحية التشريع إلى الحكومة حتى تُرفع حالة الطوارئ ويعود النشاط المنتظم.",
     ru:"Статья, запрещающая Кнессету законодательствовать в чрезвычайном положении и обязывающая передать законодательные полномочия правительству, пока положение не отменят и работа не вернётся в обычное русло.",
     en:"A clause barring the Knesset from legislating during an emergency and requiring it to hand legislative power to the government until the emergency is lifted and normal work resumes."},
    {he:"סעיף הקובע מתי מותר לפגוע בזכות שבחוק היסוד: בחוק, ההולם את ערכי המדינה, לתכלית ראויה, ובמידה שאינה עולה על הנדרש.",
     ar:"بند يحدّد متى يجوز المساس بحقّ في قانون الأساس: بقانون، يلائم قيم الدولة، لغاية مشروعة، وبقدر لا يتجاوز اللازم.",
     ru:"Статья, определяющая, когда можно ограничить право основного закона: законом, соответствующим ценностям государства, ради достойной цели и в мере, не превышающей необходимую.",
     en:"A section setting out when a right in the basic law may be infringed: by a statute befitting the values of the state, for a proper purpose, and to an extent no greater than required."},
    {he:"סעיף המגביל את מספר חברי הכנסת ל-120, וקובע שאין לפגוע בזכות שבחוק יסוד אלא בהסכמת שני שלישים מהם ובקריאה אחת.",
     ar:"بند يحدّد عدد أعضاء الكنيست بـ120، ويقرّر أنّه لا يجوز المسّ بحقّ ورد في قانون أساس إلّا بموافقة ثلثيهم وفي قراءة واحدة.",
     ru:"Статья, ограничивающая число депутатов Кнессета ста двадцатью и требующая для ущемления права из Основного закона согласия двух третей из них в одном чтении.",
     en:"A clause capping the Knesset at 120 members and providing that a right in a Basic Law may be infringed only with two thirds of them consenting in a single reading."},
    {he:"סעיף המגביל את כהונת השופטים לעשר שנים.",
     ar:"بند يحدّ ولاية القضاة بعشر سنوات.",
     ru:"Статья, ограничивающая срок судей десятью годами.",
     en:"A section limiting judges' tenure to ten years."}],
   1,
   {he:"חשבו: האם מותר לפגוע בזכות בלי כללים בכלל? מה הסעיף דורש כדי שפגיעה תהיה מותרת?",
    ar:"فكروا: هل يجوز المساس بحق دون أي قواعد؟ ماذا يشترط البند كي يكون المساس جائزًا؟",
    ru:"Подумайте: можно ли нарушать право без всяких правил? Что требует статья, чтобы нарушение было допустимым?",
    en:"Think: may a right be harmed with no rules at all? What does the clause require for a harm to be allowed?"},
   {he:"פסקת ההגבלה היא הכלי המרכזי של הביקורת השיפוטית על חקיקה בישראל. היא מבטאת את התפיסה שזכויות אינן מוחלטות אך גם אינן הפקר: אפשר לפגוע, אך רק בדרך שנקבעה מראש ובמידה הנחוצה.",
    ar:"فقرة التقييد هي الأداة المركزية للرقابة القضائية على التشريع في إسرائيل. تعبّر عن أن الحقوق ليست مطلقة ولا مستباحة: يجوز المساس، لكن بالطريقة المحدّدة سلفًا وبالقدر اللازم.",
    ru:"Ограничительная оговорка: главный инструмент судебного контроля над законодательством в Израиле. Она выражает мысль, что права не абсолютны, но и не беззащитны: ограничить можно, но лишь заранее установленным путём и в необходимой мере.",
    en:"The limitation clause is the main instrument of judicial review of legislation in Israel. It expresses the idea that rights are neither absolute nor unprotected: they may be infringed, but only in the manner set in advance and to the extent necessary."},
   null),
  Q("bs-1-01",{"he": "באיזו שנה חוקקה הכנסת את חוק יסוד: כבוד האדם וחירותו?", "ar": "في أيّ سنة سنّت الكنيست قانون أساس: كرامة الإنسان وحرّيته؟", "ru": "В каком году Кнессет принял Основной закон о достоинстве и свободе человека?", "en": "In what year did the Knesset pass Basic Law: Human Dignity and Liberty?"},[{"he": "בשנת 1948, יחד עם הכרזת העצמאות של המדינה.", "ar": "في سنة 1948، مع إعلان استقلال الدولة.", "ru": "В 1948 году, вместе с Декларацией независимости.", "en": "In 1948, together with the state's Declaration of Independence."}, {"he": "בשנת 1950, בהחלטת הררי.", "ar": "في سنة 1950، في قرار هراري.", "ru": "В 1950 году, в решении Харари.", "en": "In 1950, in the Harari Decision."}, {"he": "בשנת 1992, כחלק מחקיקת חוקי יסוד על זכויות.", "ar": "في سنة 1992، ضمن سنّ قوانين أساس عن الحقوق.", "ru": "В 1992 году, в рамках принятия основных законов о правах.", "en": "In 1992, as part of passing Basic Laws on rights."}, {"he": "בשנת 1958, כאשר נחקק חוק היסוד הראשון של מדינת ישראל.", "ar": "في سنة 1958، حين سُنّ أوّل قانون أساس في دولة إسرائيل.", "ru": "В 1958 году, когда был принят первый основной закон Государства Израиль.", "en": "In 1958, when the very first Basic Law of the State of Israel was passed."}],2,{"he": "החוק נחקק כשהכנסת התחילה לעגן זכויות אדם בחוקי יסוד, עשרות שנים אחרי קום המדינה.", "ar": "سُنّ القانون حين بدأت الكنيست تثبيت حقوق الإنسان في قوانين أساس، بعد عقود من قيام الدولة.", "ru": "Закон приняли, когда Кнессет начал закреплять права человека в основных законах, через десятилетия после создания государства.", "en": "The law was passed when the Knesset began anchoring human rights in Basic Laws, decades after the state was founded."},{"he": "חוק יסוד: כבוד האדם וחירותו נחקק בשנת 1992. באותה שנה נחקק גם חוק יסוד: חופש העיסוק, ובשנת 1994 נחקקה לו גרסה חדשה. שני החוקים מעגנים זכויות אדם ברמה חוקתית.", "ar": "سُنّ قانون أساس: كرامة الإنسان وحرّيته سنة 1992. وفي السنة نفسها سُنّ قانون أساس: حرّية العمل، وفي 1994 سُنّت له صيغة جديدة. القانونان يثبّتان حقوق الإنسان على مستوى دستوريّ.", "ru": "Основной закон о достоинстве и свободе человека принят в 1992 году. В том же году принят Основной закон о свободе занятий, а в 1994 году его новая редакция. Оба закона закрепляют права человека на конституционном уровне.", "en": "Basic Law: Human Dignity and Liberty was passed in 1992. Basic Law: Freedom of Occupation was passed that year too, with a new version in 1994. Both anchor human rights at a constitutional level."},null),
  Q("bs-1-02",{"he": "מהי תקנה?", "ar": "ما هي اللائحة؟", "ru": "Что такое постановление (подзаконный акт)?", "en": "What is a regulation?"},[{"he": "חוק שהכנסת מקבלת בשלוש קריאות במליאה.", "ar": "قانون تُقرّه الكنيست بثلاث قراءات في الهيئة العامة.", "ru": "Закон, который Кнессет принимает в трёх чтениях на пленуме.", "en": "A law the Knesset passes in three readings in the plenum."}, {"he": "פסק דין של בית המשפט העליון.", "ar": "حكم صادر عن المحكمة العليا.", "ru": "Решение Верховного суда.", "en": "A ruling of the Supreme Court."}, {"he": "סעיף בחוק יסוד שקובע את זכויות האזרח, ואי אפשר לשנות אותו אלא ברוב מיוחד של חברי הכנסת.", "ar": "بند في قانون أساس يحدّد حقوق المواطن، ولا يمكن تغييره إلا بأغلبية خاصّة من أعضاء الكنيست.", "ru": "Статья основного закона о правах гражданина, которую можно изменить только особым большинством депутатов.", "en": "A clause in a Basic Law setting citizens' rights, which can be changed only by a special majority of Knesset members."}, {"he": "חקיקת משנה שקובע שר או רשות, מכוח חוק שהסמיך אותם.", "ar": "تشريع فرعيّ يضعه وزير أو سلطة، بموجب قانون خوّلهم ذلك.", "ru": "Подзаконный акт, который издаёт министр или орган на основании уполномочивающего закона.", "en": "Secondary legislation made by a minister or authority, under a law that empowered them."}],3,{"he": "מי כותב אותה: חברי הכנסת, השופטים, או מישהו ברשות המבצעת?", "ar": "من يكتبها: أعضاء الكنيست، أم القضاة، أم جهة في السلطة التنفيذية؟", "ru": "Кто его пишет: депутаты, судьи или кто-то в исполнительной власти?", "en": "Who writes it: Knesset members, judges, or someone in the executive?"},{"he": "תקנה היא חקיקת משנה. הכנסת מסמיכה בחוק שר או רשות לקבוע פרטים, והם מתקינים תקנות. במדרג הנורמות התקנה נמצאת מתחת לחוק, ואסור לה לסתור אותו.", "ar": "اللائحة تشريع فرعيّ. الكنيست تخوّل بقانون وزيرًا أو سلطة لتحديد التفاصيل، فيصدرون لوائح. في مراتب المعايير تقع اللائحة تحت القانون، ولا يجوز أن تناقضه.", "ru": "Постановление: подзаконный акт. Кнессет законом уполномочивает министра или орган определить детали, и они издают постановления. В иерархии норм постановление стоит ниже закона и не может ему противоречить.", "en": "A regulation is secondary legislation. The Knesset empowers a minister or authority by law to set details, and they make regulations. In the hierarchy of norms a regulation sits below statute and may not contradict it."},null),
  Q("bs-1-03",{"he": "מהו סעיף משוריין?", "ar": "ما هو البند المحصَّن؟", "ru": "Что такое защищённая (укреплённая) статья?", "en": "What is an entrenched clause?"},[{"he": "סעיף שאפשר לשנות רק ברוב מיוחד, למשל 61 חברי כנסת.", "ar": "بند لا يمكن تغييره إلا بأغلبية خاصّة، مثلًا 61 عضو كنيست.", "ru": "Статья, которую можно изменить только особым большинством, например 61 депутатом.", "en": "A clause that can be changed only by a special majority, for example 61 Knesset members."}, {"he": "סעיף שחל רק בזמן מלחמה.", "ar": "بند يسري في زمن الحرب فقط.", "ru": "Статья, действующая только во время войны.", "en": "A clause that applies only in wartime."}, {"he": "סעיף שרק נשיא המדינה רשאי לשנות.", "ar": "بند لا يحقّ تغييره إلا لرئيس الدولة.", "ru": "Статья, которую может изменить только президент.", "en": "A clause only the President may change."}, {"he": "סעיף שעוסק בביטחון המדינה, ולכן הוא נשמר בסוד ואינו מתפרסם ברשומות לעיני הציבור.", "ar": "بند يتعلّق بأمن الدولة، لذلك يبقى سرّيًّا ولا يُنشر في الجريدة الرسمية أمام الجمهور.", "ru": "Статья о безопасности государства, поэтому она секретна и не публикуется в официальном вестнике.", "en": "A clause about state security, so it is kept secret and not published in the official gazette for the public."}],0,{"he": "חשבו על המילה 'שריון': ממה הסעיף מוגן?", "ar": "فكّروا في كلمة «محصَّن»: ممّ هذا البند محميّ؟", "ru": "Подумайте о слове «защищённая»: от чего защищена статья?", "en": "Think of the word \"entrenched\": what is the clause shielded from?"},{"he": "סעיף משוריין מוגן מפני שינוי ברוב מקרי. למשל, סעיף 4 בחוק יסוד: הכנסת, על שיטת הבחירות, דורש רוב של 61 חברי כנסת כדי לשנותו. כך נשמרים כללי יסוד גם מול רוב זמני.", "ar": "البند المحصَّن محميّ من التغيير بأغلبية عابرة. مثلًا، البند 4 في قانون أساس: الكنيست، عن طريقة الانتخابات، يتطلّب أغلبية 61 عضو كنيست لتغييره. هكذا تُحفظ القواعد الأساسية أمام أغلبية مؤقّتة.", "ru": "Защищённая статья ограждена от изменения случайным большинством. Например, статья 4 Основного закона о Кнессете, о системе выборов, требует для изменения большинства в 61 депутата. Так основные правила сохраняются и перед временным большинством.", "en": "An entrenched clause is shielded from change by a chance majority. For example, section 4 of Basic Law: The Knesset, on the electoral system, needs 61 Knesset members to change it. This keeps basic rules safe from a passing majority."},null),
  Q("bs-1-04",{"he": "מהי ביקורת שיפוטית?", "ar": "ما هي الرقابة القضائية؟", "ru": "Что такое судебный контроль?", "en": "What is judicial review?"},[{"he": "פיקוח של מבקר המדינה על הוצאות הממשלה.", "ar": "رقابة مراقب الدولة على نفقات الحكومة.", "ru": "Надзор государственного контролёра за расходами правительства.", "en": "The State Comptroller's oversight of government spending."}, {"he": "סמכות בית המשפט לבדוק אם חוק או פעולה של השלטון תואמים נורמה עליונה, ולפסול אותם אם לא.", "ar": "صلاحية المحكمة لفحص ما إذا كان قانون أو عمل للسلطة يتوافق مع معيار أعلى، وإبطاله إن لم يتوافق.", "ru": "Полномочие суда проверять, соответствует ли закон или действие власти высшей норме, и отменять их, если нет.", "en": "The court's power to check whether a law or government act fits a higher norm, and to strike it down if not."}, {"he": "בדיקה שעושים שופטים לעבודתם של שופטים אחרים.", "ar": "فحص يجريه قضاة لعمل قضاة آخرين.", "ru": "Проверка, которую судьи проводят над работой других судей.", "en": "A check judges carry out on the work of other judges."}, {"he": "דיון בוועדה של הכנסת שבו חברי הכנסת בודקים כל פסק דין של בית המשפט העליון ומחליטים אם לאשר אותו לפני שהוא נכנס לתוקף.", "ar": "نقاش في لجنة بالكنيست يفحص فيه الأعضاء كلّ حكم للمحكمة العليا ويقرّرون إن كانوا سيصادقون عليه قبل أن يسري.", "ru": "Обсуждение в комиссии Кнессета, где депутаты проверяют каждое решение Верховного суда и решают, утвердить ли его до вступления в силу.", "en": "A Knesset committee session where members review every Supreme Court ruling and decide whether to approve it before it takes effect."}],1,{"he": "חשבו על הקשר בין מדרג הנורמות לבין תפקיד בתי המשפט.", "ar": "فكّروا في الصلة بين مراتب المعايير ودور المحاكم.", "ru": "Подумайте о связи между иерархией норм и ролью судов.", "en": "Think about the link between the hierarchy of norms and the role of the courts."},{"he": "ביקורת שיפוטית שומרת על מדרג הנורמות. בית המשפט בודק אם תקנה תואמת את החוק, ואם חוק תואם את חוקי היסוד. מה שסותר נורמה גבוהה ממנו עלול להתבטל.", "ar": "الرقابة القضائية تحمي مراتب المعايير. تفحص المحكمة إن كانت اللائحة تتوافق مع القانون، وإن كان القانون يتوافق مع قوانين الأساس. وما يناقض معيارًا أعلى منه قد يُبطَل.", "ru": "Судебный контроль охраняет иерархию норм. Суд проверяет, соответствует ли постановление закону, а закон: основным законам. То, что противоречит более высокой норме, может быть отменено.", "en": "Judicial review protects the hierarchy of norms. The court checks whether a regulation fits the statute, and whether a statute fits the Basic Laws. What contradicts a higher norm may be voided."},null)
 ],
 [ /* רמה 2 — הבנה */
  Q("basic-case1",
    {he:"שר התקין תקנה המחייבת אישור מיוחד לפתיחת עסק, אף שהחוק שמכוחו פעל אינו מזכיר אישור כזה. מה מעמד התקנה?",
     ar:"أصدر وزير لائحة توجب ترخيصًا خاصًّا لفتح مشروع، مع أن القانون الذي استند إليه لا يذكر ترخيصًا كهذا. ما مكانة اللائحة؟",
     ru:"Министр издал постановление, требующее особого разрешения для открытия дела, хотя закон, на который он опирался, такого разрешения не упоминает. Каков статус постановления?",
     en:"A minister made a regulation requiring a special permit to open a business, although the statute he acted under mentions no such permit. What is the regulation's standing?"},
   [{he:"התקנה תקפה: לשר סמכות רחבה בתחומו.",
     ar:"اللائحة سارية: للوزير صلاحية واسعة في مجاله.",
     ru:"Постановление действительно: у министра широкие полномочия в своей сфере.",
     en:"The regulation is valid: a minister has broad authority in his field."},
    {he:"התקנה תקפה עד שהכנסת תבטל אותה בחוק חדש, שכן חקיקת משנה של שר נחשבת חלק מהחקיקה כל עוד לא נקבע אחרת.",
     ar:"اللائحة سارية حتى تلغيها الكنيست بقانون جديد، إذ يُعدّ التشريع الفرعيّ الصادر عن وزير جزءًا من التشريع ما دام لم يُقرَّر خلاف ذلك.",
     ru:"Постановление действует, пока Кнессет не отменит его новым законом, ведь подзаконный акт министра считается частью законодательства, пока не решено иначе.",
     en:"The regulation stands until the Knesset repeals it in a new statute, since a minister's secondary legislation counts as legislation unless decided otherwise."},
    {he:"התקנה חורגת מסמכות: חקיקת משנה יונקת את כוחה מהחוק המסמיך, ואינה יכולה להוסיף עליו חובה חדשה.",
     ar:"اللائحة تجاوز للصلاحية: التشريع الفرعيّ يستمدّ قوّته من القانون المخوِّل ولا يضيف عليه واجبًا جديدًا.",
     ru:"Постановление вне полномочий: подзаконный акт черпает силу из уполномочивающего закона и не может добавлять к нему новую обязанность.",
     en:"The regulation is ultra vires: subordinate legislation draws its force from the enabling statute and cannot add a new duty to it."},
    {he:"התקנה תקפה אם פורסמה ברשומות, שכן הפרסום הוא שמעניק לחקיקת משנה תוקף מחייב כלפי הציבור, גם כשהחוק המסמיך שותק.",
     ar:"اللائحة سارية إذا نُشرت في الجريدة الرسمية، إذ إنّ النشر هو ما يمنح التشريع الفرعيّ قوّة إلزام تجاه الجمهور، حتى حين يسكت القانون المخوِّل.",
     ru:"Постановление действительно, если опубликовано в официальном вестнике, ведь именно публикация придаёт подзаконному акту обязывающую силу, даже когда уполномочивающий закон молчит.",
     en:"The regulation is valid if published in the official gazette, since publication is what gives secondary legislation binding force, even where the empowering statute is silent."}],
   2,
   {he:"מאיפה שואב השר את הכוח להתקין תקנה? ומה קורה כשהוא חורג ממה שניתן לו?",
    ar:"من أين يستمدّ الوزير سلطة إصدار اللائحة؟ وماذا يحدث حين يتجاوز ما مُنح له؟",
    ru:"Откуда министр черпает право издавать постановление? И что если он выходит за данные ему рамки?",
    en:"Where does the minister get the power to make a regulation? And what happens when he exceeds what he was given?"},
   {he:"זה יישום ישיר של מדרג הנורמות. הכלל המנחה: “אין עונשין ואין מחייבים אלא לפי חוק”. הביקורת על חריגה מסמכות היא הליבה הוותיקה ביותר של המשפט המנהלי, והיא קדמה בישראל לביקורת על חוקים.",
    ar:"هذا تطبيق مباشر لمراتب المعايير. القاعدة: لا عقاب ولا إلزام إلا بقانون. والرقابة على تجاوز الصلاحية هي أقدم لبّ في القانون الإداريّ، وقد سبقت في إسرائيل الرقابة على القوانين.",
    ru:"Это прямое применение иерархии норм. Правило: наказывать и обязывать можно лишь по закону. Контроль за превышением полномочий: старейшее ядро административного права, и в Израиле он предшествовал контролю над законами.",
    en:"This is a direct application of the hierarchy of norms. The rule: no one is punished or bound except under statute. Review for excess of authority is the oldest core of administrative law, and in Israel it preceded review of statutes."},
   null),
  Q("basic-case2",
    {he:"הכנסת חוקקה חוק רגיל הפוגע בחופש העיסוק. אילו מבחנים יבחן בית המשפט לפני שיקבע אם החוק תקף?",
     ar:"سنّت الكنيست قانونًا عاديًّا يمسّ حرّية العمل. أيّ اختبارات ستفحصها المحكمة قبل أن تقرّر سريانه؟",
     ru:"Кнессет принял обычный закон, ограничивающий свободу занятий. Какие проверки применит суд, прежде чем решить, действителен ли закон?",
     en:"The Knesset passed an ordinary statute infringing freedom of occupation. What tests will the court apply before deciding whether the statute is valid?"},
   [{he:"רק את השאלה אם החוק עבר בשלוש קריאות.",
     ar:"فقط إن كان القانون أُقرّ بثلاث قراءات.",
     ru:"Только прошёл ли закон три чтения.",
     en:"Only whether the statute passed three readings."},
    {he:"רק את השאלה אם רוב הציבור מתנגד לחוק.",
     ar:"فقط إن كانت أغلبية الجمهور تعارض القانون.",
     ru:"Только выступает ли большинство против закона.",
     en:"Only whether most of the public opposes the statute."},
    {he:"את תנאי פסקת ההגבלה — הסמכה בחוק, התאמה לערכי המדינה, תכלית ראויה ומידתיות — ורק אם החוק אינו עומד בהם, יפסול אותו.",
     ar:"شروط فقرة التقييد، تخويل بقانون، ملاءمة لقيم الدولة، غاية مشروعة وتناسب، وإن لم يستوفِها القانون أبطلته.",
     ru:"Условия ограничительной оговорки: уполномочивание законом, соответствие ценностям государства, достойная цель и соразмерность, и лишь если закон им не отвечает, отменит его.",
     en:"The conditions of the limitation clause: statutory authority, conformity with the state's values, a proper purpose and proportionality, and only if the statute fails them will it be struck down."},
    {he:"את השאלה אם החוק תואם את מגילת העצמאות ואת ערכי היסוד שנקבעו בה — שכן היא המסמך המכונן שמכוחו בלבד אפשר לפסול חקיקה.",
     ar:"مسألة ما إذا كان القانون منسجمًا مع وثيقة الاستقلال والقيم الأساسية الواردة فيها، إذ هي الوثيقة التأسيسية التي وحدها تتيح إبطال تشريع.",
     ru:"Вопрос: соответствует ли закон Декларации независимости и закреплённым в ней базовым ценностям, ведь только этот учредительный документ позволяет отменить законодательство.",
     en:"Whether the statute fits the Declaration of Independence and the founding values in it, since that is the constitutive document and the only ground for striking legislation down."}],
   2,
   {he:"חוק היסוד מגן על הזכות, אבל לא באופן מוחלט. איזה סעיף בו מסביר מתי מותר לפגוע?",
    ar:"قانون الأساس يحمي الحقّ، لكن ليس مطلقًا. أيّ بند فيه يفسّر متى يجوز المساس؟",
    ru:"Основной закон защищает право, но не абсолютно. Какая его статья объясняет, когда ограничение допустимо?",
    en:"The basic law protects the right, but not absolutely. Which section explains when an infringement is allowed?"},
   {he:"סמכות בית המשפט לבטל חוק של הכנסת נקבעה בפסק דין בנק המזרחי (1995), והוסקה ממעמדם העליון של חוקי היסוד. חוק־יסוד: חופש העיסוק כולל גם “פסקת התגברות”: הכנסת יכולה לחוקק חוק סותר ברוב של 61, לתקופה מוגבלת.",
    ar:"صلاحية المحكمة بإبطال قانون للكنيست تقرّرت في حكم بنك همزراحي (١٩٩٥)، واستُنتجت من علوّ مكانة قوانين الأساس. وقانون أساس: حرّية العمل يتضمّن أيضًا “فقرة تغلّب”: للكنيست أن تسنّ قانونًا مناقضًا بأغلبية ٦١ ولفترة محدودة.",
    ru:"Полномочие суда отменить закон Кнессета установлено решением по делу «Банк ха-Мизрахи» (1995) и выведено из высшего статуса основных законов. Основной закон о свободе занятий содержит и «оговорку преодоления»: Кнессет может принять противоречащий закон большинством в 61 голос и на ограниченный срок.",
    en:"The court's power to strike down a Knesset statute was established in the Bank Mizrahi judgment (1995) and derived from the superior status of basic laws. Basic Law: Freedom of Occupation also contains an override clause: the Knesset may pass a conflicting statute by 61 votes, for a limited period."},
   null),
  Q("basic-case3",
    {he:"מה ההבדל המעשי בין ביקורת שיפוטית על חוק לבין ביקורת שיפוטית על החלטה מנהלית?",
     ar:"ما الفرق العمليّ بين الرقابة القضائية على قانون والرقابة على قرار إداريّ؟",
     ru:"В чём практическая разница между судебным контролем над законом и над административным решением?",
     en:"What is the practical difference between judicial review of a statute and of an administrative decision?"},
   [{he:"אין הבדל: בשני הסוגים בית המשפט בוחן אם הרשות פעלה בסמכות, בסבירות ובמידתיות, ולכן גם התוצאה זהה — ההחלטה או החוק מתבטלים.",
     ar:"لا فرق: في النوعين تفحص المحكمة إن عملت السلطة ضمن صلاحيتها وبمعقولية وتناسب، ولذلك النتيجة واحدة، يُبطَل القرار أو القانون.",
     ru:"Разницы нет: в обоих случаях суд проверяет, действовал ли орган в пределах полномочий, разумно и соразмерно, поэтому и результат один: решение или закон отменяются.",
     en:"There is no difference: in both the court asks whether the authority acted within its powers, reasonably and proportionately, so the outcome is the same: the decision or the law is annulled."},
    {he:"ביקורת על חוק בודקת אם הכנסת חרגה מחוקי היסוד, והיא נדירה; ביקורת מנהלית בודקת אם רשות פעלה בסמכות, בסבירות ובהגינות, והיא שגרתית.",
     ar:"الرقابة على قانون تفحص إن تجاوزت الكنيست قوانين الأساس، وهي نادرة؛ والرقابة الإدارية تفحص إن عملت السلطة ضمن صلاحيتها بمعقولية ونزاهة، وهي روتينية.",
     ru:"Контроль над законом проверяет, вышел ли Кнессет за рамки основных законов, и он редок; административный контроль проверяет законность, разумность и добросовестность действий органа, и он рутинен.",
     en:"Review of a statute asks whether the Knesset exceeded the basic laws, and it is rare; administrative review asks whether an authority acted within its powers, reasonably and fairly, and it is routine."},
    {he:"ביקורת מנהלית מתקיימת רק בבית המשפט העליון.",
     ar:"الرقابة الإدارية تجري في المحكمة العليا فقط.",
     ru:"Административный контроль возможен только в Верховном суде.",
     en:"Administrative review takes place only in the Supreme Court."},
    {he:"ביקורת על חוק אפשרית רק בשנה שלאחר חקיקתו.",
     ar:"الرقابة على قانون ممكنة في السنة التالية لسنّه فقط.",
     ru:"Контроль над законом возможен лишь в год после принятия.",
     en:"Review of a statute is possible only in the year after enactment."}],
   1,
   {he:"מי קיבל את ההחלטה בכל אחד מהמקרים — הכנסת או פקיד? ולפי איזו נורמה בוחנים אותו?",
    ar:"مَن اتّخذ القرار في كلّ حالة، الكنيست أم موظّف؟ ووفق أيّ معيار يُفحص؟",
    ru:"Кто принял решение в каждом случае: Кнессет или чиновник? И по какой норме его проверяют?",
    en:"Who took the decision in each case: the Knesset or an official? And against which norm is it tested?"},
   {he:"ההבדל נובע ישירות מהמדרג: חוק נבחן מול הנורמה שמעליו (חוק יסוד), והחלטה מנהלית נבחנת מול החוק והתקנות שמעליה. לכן ביטול חוק הוא מהלך חריג, ואילו ביטול החלטה מנהלית הוא עבודת היום־יום של בג״ץ ובתי המשפט לעניינים מנהליים.",
    ar:"الفرق ناتج مباشرةً عن المراتب: القانون يُفحص أمام المعيار الأعلى منه (قانون أساس)، والقرار الإداريّ أمام القانون واللوائح فوقه. لذلك إبطال قانون خطوة استثنائية، بينما إبطال قرار إداريّ عمل يوميّ للعليا ومحاكم الشؤون الإدارية.",
    ru:"Разница прямо вытекает из иерархии: закон проверяют против стоящей над ним нормы (основного закона), административное решение: против закона и постановлений над ним. Поэтому отмена закона: исключительный шаг, а отмена административного решения: повседневная работа БАГАЦ и судов по административным делам.",
    en:"The difference follows directly from the hierarchy: a statute is tested against the norm above it (a basic law), and an administrative decision against the statutes and regulations above it. So striking down a statute is exceptional, while quashing an administrative decision is the daily work of the High Court and the administrative courts."},
   null),
  Q("bs-2-01",{"he": "חוק חדש קובע שרק מי שגר בעיר יותר מ-10 שנים רשאי לפתוח בה מספרה. ספר שעבר לעיר רוצה לעתור נגד החוק. על איזה חוק יסוד יסתמך בעיקר?", "ar": "قانون جديد يقرّر أن من يسكن في المدينة أكثر من 10 سنوات وحده يحقّ له فتح صالون حلاقة فيها. حلّاق انتقل إلى المدينة يريد تقديم التماس ضدّ القانون. على أيّ قانون أساس سيعتمد أساسًا؟", "ru": "Новый закон разрешает открыть парикмахерскую в городе только тем, кто прожил в нём больше 10 лет. Парикмахер, который недавно переехал, хочет оспорить закон. На какой основной закон он опирается в первую очередь?", "en": "A new law says only someone who has lived in a city over 10 years may open a barbershop there. A barber who moved there wants to petition against it. Which Basic Law will he mainly rely on?"},[{"he": "חוק יסוד: הכנסת, כי הכנסת היא שחוקקה את החוק.", "ar": "قانون أساس: الكنيست، لأن الكنيست هي التي سنّت القانون.", "ru": "Основной закон о Кнессете, ведь именно Кнессет принял этот закон.", "en": "Basic Law: The Knesset, since the Knesset is the one that passed the law."}, {"he": "חוק יסוד: חופש העיסוק, שמגן על הזכות לבחור מקצוע ולעסוק בו.", "ar": "قانون أساس: حرّية العمل، الذي يحمي حقّ اختيار المهنة والعمل فيها.", "ru": "Основной закон о свободе занятий, который защищает право выбрать профессию и работать по ней.", "en": "Basic Law: Freedom of Occupation, which protects the right to choose a trade and work in it."}, {"he": "חוק יסוד: הממשלה.", "ar": "قانون أساس: الحكومة.", "ru": "Основной закон о правительстве.", "en": "Basic Law: The Government."}, {"he": "חוק יסוד: השפיטה, שקובע את סמכויות בתי המשפט ואת הדרך שבה מגישים אליהם עתירה.", "ar": "قانون أساس: القضاء، الذي يحدّد صلاحيات المحاكم والطريقة التي يُقدَّم بها الالتماس إليها.", "ru": "Основной закон о судебной власти, который определяет полномочия судов и порядок подачи в них петиции.", "en": "Basic Law: The Judiciary, which sets the courts' powers and the way a petition is filed with them."}],1,{"he": "איזו זכות נפגעת כשמונעים מאדם לעבוד במקצוע שלו?", "ar": "أيّ حقّ يُمسّ حين يُمنع شخص من العمل في مهنته؟", "ru": "Какое право нарушается, когда человеку не дают работать по профессии?", "en": "Which right is harmed when someone is barred from working in their trade?"},{"he": "החוק מגביל את הזכות לעבוד במקצוע, ולכן הספר יסתמך על חוק יסוד: חופש העיסוק. בית המשפט יבדוק אם ההגבלה עומדת בפסקת ההגבלה. חוקי היסוד האחרים עוסקים במבנה השלטון, ולא בזכות הזאת.", "ar": "القانون يقيّد حقّ العمل في المهنة، لذلك سيعتمد الحلّاق على قانون أساس: حرّية العمل. وستفحص المحكمة إن كان التقييد يستوفي فقرة التقييد. أمّا قوانين الأساس الأخرى فتتناول مبنى السلطة، لا هذا الحقّ.", "ru": "Закон ограничивает право работать по профессии, поэтому парикмахер сошлётся на Основной закон о свободе занятий. Суд проверит, соответствует ли ограничение ограничительной оговорке. Остальные основные законы касаются устройства власти, а не этого права.", "en": "The law limits the right to work in a trade, so the barber will rely on Basic Law: Freedom of Occupation. The court will check whether the limit meets the limitation clause. The other Basic Laws deal with the structure of government, not this right."},null),
  Q("bs-2-02",{"he": "חוק עזר של עירייה סותר חוק של הכנסת. מה גובר?", "ar": "قانون مساعد لبلدية يناقض قانونًا للكنيست. أيّهما يتغلّب؟", "ru": "Подзаконный акт муниципалитета противоречит закону Кнессета. Что имеет приоритет?", "en": "A municipal bylaw contradicts a Knesset law. Which prevails?"},[{"he": "חוק העזר, כי העירייה מכירה את צורכי התושבים טוב יותר.", "ar": "القانون المساعد، لأن البلدية تعرف احتياجات السكّان أفضل.", "ru": "Муниципальный акт, ведь муниципалитет лучше знает нужды жителей.", "en": "The bylaw, since the city knows its residents' needs better."}, {"he": "מה שנחקק מאוחר יותר, בלי קשר למי חוקק אותו.", "ar": "ما سُنّ لاحقًا، بغضّ النظر عمّن سنّه.", "ru": "Тот акт, что принят позже, независимо от того, кто его принял.", "en": "Whichever was passed later, no matter who passed it."}, {"he": "שניהם תקפים באותה מידה, וכל אזרח רשאי לבחור לפי איזה מהם לנהוג, בהתאם לעיר שבה הוא נמצא באותו רגע.", "ar": "كلاهما ساريان بالقدر نفسه، ويحقّ لكلّ مواطن أن يختار أيّهما يتّبع، بحسب المدينة التي يوجد فيها في تلك اللحظة.", "ru": "Оба действуют одинаково, и каждый гражданин вправе выбрать, каким руководствоваться, в зависимости от города, где он сейчас находится.", "en": "Both are equally valid, and each citizen may choose which one to follow, depending on the city they are in at that moment."}, {"he": "חוק הכנסת, כי חוק עזר הוא חקיקת משנה ונמוך ממנו במדרג.", "ar": "قانون الكنيست، لأن القانون المساعد تشريع فرعيّ وأدنى منه في المراتب.", "ru": "Закон Кнессета, ведь муниципальный акт: подзаконный и стоит ниже в иерархии.", "en": "The Knesset law, since a bylaw is secondary legislation and ranks below it."}],3,{"he": "חשבו מי הסמיך את העירייה לחוקק חוקי עזר מלכתחילה.", "ar": "فكّروا: من خوّل البلدية أصلًا سنّ قوانين مساعدة؟", "ru": "Подумайте, кто вообще дал муниципалитету право издавать такие акты.", "en": "Think about who empowered the city to make bylaws in the first place."},{"he": "חוק עזר עירוני הוא חקיקת משנה. העירייה מתקינה אותו מכוח חוק של הכנסת. לכן הוא נמוך מהחוק, ואם הוא סותר אותו, החוק גובר. הכלל 'המאוחר גובר' חל רק בין נורמות באותה דרגה.", "ar": "القانون المساعد البلديّ تشريع فرعيّ. تُصدره البلدية بموجب قانون للكنيست. لذلك هو أدنى من القانون، وإذا ناقضه يتغلّب القانون. قاعدة «اللاحق يتغلّب» تسري فقط بين معايير من الدرجة نفسها.", "ru": "Муниципальный акт: подзаконный. Муниципалитет издаёт его на основании закона Кнессета. Поэтому он ниже закона, и при противоречии закон побеждает. Правило «позднейший акт главнее» действует только между нормами одного уровня.", "en": "A municipal bylaw is secondary legislation. The city makes it under a Knesset law. So it ranks below the law, and if it contradicts it, the law prevails. The rule that the later norm prevails applies only between norms of the same rank."},null),
  Q("bs-2-03",{"he": "מה נקבע בפסק הדין בעניין בנק המזרחי (1995)?", "ar": "ماذا تقرّر في حكم بنك همزراحي (1995)؟", "ru": "Что было установлено в решении по делу «Банк ха-Мизрахи» (1995)?", "en": "What was decided in the Bank Mizrahi judgment (1995)?"},[{"he": "שלחוקי היסוד מעמד גבוה מחוק רגיל, ובית המשפט רשאי לבטל חוק שסותר אותם.", "ar": "أن لقوانين الأساس مكانة أعلى من القانون العاديّ، وأن للمحكمة أن تُبطل قانونًا يناقضها.", "ru": "Что основные законы стоят выше обычного закона, и суд может отменить закон, который им противоречит.", "en": "That Basic Laws rank above ordinary statutes, and the court may void a statute that contradicts them."}, {"he": "שישראל תכתוב חוקה שלמה תוך שנה.", "ar": "أن تكتب إسرائيل دستورًا كاملًا خلال سنة.", "ru": "Что Израиль напишет полную конституцию за год.", "en": "That Israel would write a full constitution within a year."}, {"he": "שבנקים פטורים מחוק יסוד: חופש העיסוק.", "ar": "أن البنوك معفاة من قانون أساس: حرّية العمل.", "ru": "Что банки освобождены от Основного закона о свободе занятий.", "en": "That banks are exempt from Basic Law: Freedom of Occupation."}, {"he": "שחוקי היסוד הם הצהרות בלבד, בלי כוח מחייב, ולכן בית המשפט אינו רשאי להסתמך עליהם כשהוא דן בחוקים של הכנסת.", "ar": "أن قوانين الأساس مجرّد إعلانات بلا قوّة ملزمة، لذلك لا يحقّ للمحكمة الاستناد إليها حين تنظر في قوانين الكنيست.", "ru": "Что основные законы: лишь декларации без обязательной силы, поэтому суд не вправе опираться на них, рассматривая законы Кнессета.", "en": "That Basic Laws are mere declarations with no binding force, so the court may not rely on them when it reviews Knesset statutes."}],0,{"he": "לפסק הדין הזה קוראים לפעמים 'המהפכה החוקתית'. מה הוא שינה?", "ar": "يُسمّى هذا الحكم أحيانًا «الثورة الدستورية». ماذا غيّر؟", "ru": "Это решение иногда называют «конституционной революцией». Что оно изменило?", "en": "This judgment is sometimes called the \"constitutional revolution\". What did it change?"},{"he": "בפסק דין בנק המזרחי קבע בית המשפט העליון שחוקי היסוד הם חלק מחוקה שנכתבת בהדרגה. לכן הם גוברים על חוק רגיל. חוק שפוגע בזכות שבהם ואינו עומד בפסקת ההגבלה עלול להתבטל.", "ar": "في حكم بنك همزراحي قرّرت المحكمة العليا أن قوانين الأساس جزء من دستور يُكتب تدريجيًّا. لذلك تتغلّب على القانون العاديّ. والقانون الذي يمسّ حقًّا فيها ولا يستوفي فقرة التقييد قد يُبطَل.", "ru": "В решении по делу «Банк ха-Мизрахи» Верховный суд установил, что основные законы: часть конституции, которая пишется постепенно. Поэтому они выше обычного закона. Закон, нарушающий право из них и не отвечающий ограничительной оговорке, может быть отменён.", "en": "In the Bank Mizrahi judgment the Supreme Court held that Basic Laws are part of a constitution being written in stages. So they prevail over an ordinary statute. A statute that harms a right in them and fails the limitation clause may be voided."},null),
