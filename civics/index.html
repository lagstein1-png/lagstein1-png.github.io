 ],
 [ /* רמה 2 — הבנה */
  Q("exec-case1",
    {he:"התגלה כי במשרד ממשלתי חולקו כספים ללא מכרז. השר טוען שלא ידע דבר. מה מתחייב מעקרון האחריות המיניסטריאלית?",
     ar:"تبيّن أن أموالًا وُزّعت في وزارة بلا مناقصة. يقول الوزير إنه لم يعلم شيئًا. ماذا يقتضي مبدأ المسؤولية الوزارية؟",
     ru:"Выяснилось, что в министерстве раздали средства без тендера. Министр говорит, что ничего не знал. Что следует из принципа министерской ответственности?",
     en:"It emerged that a ministry distributed funds without a tender. The minister says he knew nothing. What does ministerial responsibility require?"},
   [{he:"אי־הידיעה פוטרת את השר: אחריות מוטלת רק על מי שידע או היה עליו לדעת, והפקיד שחילק את הכספים הוא שיישא בה, לרבות בהליך משמעתי.",
     ar:"عدم العلم يعفي الوزير: المسؤولية تقع فقط على مَن علم أو كان عليه أن يعلم، والموظّف الذي وزّع الأموال هو مَن يتحمّلها، بما في ذلك في إجراء تأديبيّ.",
     ru:"Незнание освобождает министра: ответственность несёт лишь тот, кто знал или должен был знать, и нести её будет чиновник, распределивший средства, в том числе в дисциплинарном порядке.",
     en:"Not knowing clears the minister: responsibility falls only on whoever knew or should have known, and the official who handed out the money bears it, including in disciplinary proceedings."},
    {he:"השר אחראי כלפי הכנסת והציבור גם בלא ידיעה, ועליו לתקן, לתת דין וחשבון, ובמקרים חמורים להתפטר — נוסף לאחריות האישית של הפקיד.",
     ar:"الوزير مسؤول أمام الكنيست والجمهور حتى بلا علم، وعليه التصحيح وتقديم الحساب، وفي الحالات الجسيمة الاستقالة — إلى جانب المسؤولية الشخصية للموظّف.",
     ru:"Министр отвечает перед Кнессетом и обществом даже не зная, обязан исправить, отчитаться, а в тяжёлых случаях уйти в отставку — наряду с личной ответственностью чиновника.",
     en:"The minister answers to the Knesset and the public even without knowing; he must put it right, account for it, and in grave cases resign — alongside the official's personal liability."},
    {he:"על השר לפצות מכיסו את מי שלא זכה במכרז.",
     ar:"على الوزير أن يعوّض من جيبه من لم يفز بالمناقصة.",
     ru:"Министр должен из своего кармана возместить проигравшим тендер.",
     en:"The minister must compensate from his own pocket those who lost the tender."},
    {he:"הכנסת חייבת לפזר את עצמה.",
     ar:"على الكنيست حلّ نفسها.",
     ru:"Кнессет обязан самораспуститься.",
     en:"The Knesset must dissolve itself."}],
   1,
   {he:"אם אי־ידיעה הייתה פוטרת, מה היה נשאר מהפיקוח על הממשלה?",
    ar:"لو أعفى عدم العلم، فماذا يبقى من الرقابة على الحكومة؟",
    ru:"Если бы незнание освобождало, что осталось бы от контроля над правительством?",
    en:"If not knowing exempted him, what would be left of oversight of the government?"},
   {he:"האחריות המיניסטריאלית מפרידה בין אחריות אישית (מי עשה) לאחריות ציבורית (מי אמור היה למנוע). היא נועדה בדיוק למקרה הזה: בלעדיה כל כשל היה נעצר בפקיד, והשר לא היה חייב דבר.",
    ar:"تفصل المسؤولية الوزارية بين مسؤولية شخصية (مَن فعل) ومسؤولية عامّة (مَن كان عليه المنع). وهي موضوعة لهذه الحالة تحديدًا: بدونها يتوقّف كلّ إخفاق عند الموظّف ولا يلزم الوزير شيء.",
    ru:"Министерская ответственность разделяет личную (кто сделал) и публичную (кто должен был предотвратить). Она и создана для такого случая: без неё любой провал застревал бы на чиновнике, а министр ничего бы не был должен.",
    en:"Ministerial responsibility separates personal liability (who did it) from public responsibility (who should have prevented it). It exists precisely for this case: without it every failure would stop at the official and the minister would owe nothing."},
   null),
  Q("exec-case2",
    {he:"שר לחץ על שופט לשנות החלטה בתיק תלוי ועומד. מה חומרת המעשה מבחינה חוקתית?",
     ar:"ضغط وزير على قاضٍ لتغيير قرار في ملفّ قائم. ما خطورة الفعل دستوريًّا؟",
     ru:"Министр давил на судью, чтобы тот изменил решение по текущему делу. Насколько это серьёзно конституционно?",
     en:"A minister pressed a judge to change a decision in a pending case. How serious is this constitutionally?"},
   [{he:"אין בעיה: השר הוא נבחר ציבור והשופט אינו, ולכן רשאי השר להביע עמדה בכל תיק שיש בו עניין ציבורי, ובלבד שלא איים על השופט.",
     ar:"لا مشكلة: الوزير منتخَب من الجمهور والقاضي ليس كذلك، ولذلك يحقّ للوزير إبداء موقفه في كلّ ملفّ ذي شأن عامّ، شرط ألّا يهدّد القاضي.",
     ru:"Проблемы нет: министр избран публикой, а судья нет, поэтому министр вправе высказывать позицию по любому делу общественной значимости, лишь бы он не угрожал судье.",
     en:"There is no problem: the minister is elected and the judge is not, so he may state a view on any case of public interest, as long as he did not threaten the judge."},
    {he:"מדובר בפגיעה בעצמאות השיפוטית ובהפרדת הרשויות — הרשות המבצעת מתערבת בהכרעה שיפוטית קונקרטית, וזה אסור גם כשהשר צודק לגופו של עניין.",
     ar:"هذا مساس باستقلال القضاء وبالفصل بين السلطات — السلطة التنفيذية تتدخّل في حكم قضائيّ عينيّ، وهو محظور حتى لو كان الوزير محقًّا في الموضوع.",
     ru:"Это посягательство на независимость суда и разделение властей: исполнительная власть вмешивается в конкретное судебное решение, что запрещено, даже если министр по существу прав.",
     en:"It is an assault on judicial independence and the separation of powers — the executive intervening in a specific judicial decision, which is forbidden even if the minister happens to be right on the merits."},
    {he:"הבעיה היא רק שהשיחה לא תועדה.",
     ar:"المشكلة فقط أن المحادثة لم تُوثَّق.",
     ru:"Проблема лишь в том, что разговор не запротоколирован.",
     en:"The only problem is that the conversation was not recorded."},
    {he:"הבעיה תלויה בשאלה אם השופט הסכים.",
     ar:"المشكلة مرهونة بموافقة القاضي.",
     ru:"Проблема зависит от того, согласился ли судья.",
     en:"The problem depends on whether the judge agreed."}],
   1,
   {he:"מה נשאר משפיטה עצמאית אם ההכרעה תלויה בשיחה עם שר?",
    ar:"ماذا يبقى من قضاء مستقلّ إن كان الحكم مرهونًا بمكالمة مع وزير؟",
    ru:"Что останется от независимого суда, если решение зависит от беседы с министром?",
    en:"What is left of an independent judiciary if a ruling turns on a phone call with a minister?"},
   {he:"הכלל הוא ששר רשאי לבקר פסיקה בפומבי אך לא להתערב בהליך. הביקורת הפומבית היא חלק מהשיח הדמוקרטי; לחץ ישיר על שופט בתיק פתוח הוא הפרה של הכלל שלפיו “בשפיטה אין מרות על שופט זולת מרותו של הדין”.",
    ar:"القاعدة أن للوزير انتقاد الأحكام علنًا لا التدخّل في الإجراء. النقد العلنيّ جزء من النقاش الديمقراطيّ؛ أما الضغط المباشر على قاضٍ في ملفّ مفتوح فخرق لقاعدة أن “لا سلطان على القاضي في القضاء غير سلطان القانون”.",
    ru:"Правило таково: министр может публично критиковать решения, но не вмешиваться в процесс. Публичная критика — часть демократической дискуссии; прямое давление на судью по открытому делу нарушает правило, что «в правосудии над судьёй нет власти, кроме власти закона».",
    en:"The rule is that a minister may criticise rulings publicly but not intervene in a proceeding. Public criticism is part of democratic debate; direct pressure on a judge in an open case breaches the rule that “in judging, a judge is subject to no authority but that of the law”."},
   null),
  Q("exec-case3",
    {he:"ממשלה הפסידה בהצבעת אי אמון קונסטרוקטיבית. מה קורה?",
     ar:"خسرت حكومة تصويت حجب ثقة بنّاء. ماذا يحدث؟",
     ru:"Правительство проиграло конструктивный вотум недоверия. Что происходит?",
     en:"A government lost a constructive no-confidence vote. What happens?"},
   [{he:"הכנסת מתפזרת מיד ונקבעות בחירות.",
     ar:"تُحلّ الكنيست فورًا وتُحدَّد انتخابات.",
     ru:"Кнессет немедленно распускается и назначаются выборы.",
     en:"The Knesset dissolves at once and elections are called."},
    {he:"הממשלה ממשיכה לכהן וההצבעה הצהרתית בלבד, שכן אי אמון מפיל ממשלה רק אם הצביעו בעדו שמונים חברי כנסת, ולכן אין לה תוצאה מעשית.",
     ar:"تواصل الحكومة ولايتها والتصويت إعلانيّ فقط، إذ لا يُسقط حجب الثقة حكومةً إلّا إذا صوّت معه ثمانون عضو كنيست، ولذلك لا نتيجة عملية له.",
     ru:"Правительство продолжает работать, а голосование лишь декларативно, ведь вотум недоверия свергает правительство только при восьмидесяти голосах, и потому практических последствий нет.",
     en:"The government stays in office and the vote is merely declaratory, since no-confidence topples a government only with eighty members in favour, so it has no practical effect."},
    {he:"נשיא המדינה ממנה ממשלת מומחים.",
     ar:"يعيّن رئيس الدولة حكومة خبراء.",
     ru:"Президент назначает правительство экспертов.",
     en:"The president appoints a government of experts."},
    {he:"בהצבעה כזאת רוב של 61 מצביע לא רק נגד הממשלה אלא גם בעד מועמד חלופי, ולכן הוא מתבקש להרכיב ממשלה חדשה בלי בחירות.",
     ar:"في تصويت كهذا تصوّت أغلبية ٦١ لا ضدّ الحكومة فحسب بل لمرشّح بديل، فيُطلب منه تشكيل حكومة جديدة بلا انتخابات.",
     ru:"При таком голосовании большинство в 61 голос выступает не только против правительства, но и за альтернативного кандидата, которому поручают сформировать новое правительство без выборов.",
     en:"In such a vote a majority of 61 votes not only against the government but also for an alternative candidate, who is then asked to form a new government without an election."}],
   3,
   {he:"המילה “קונסטרוקטיבית” — בונה. מה בדיוק היא דורשת שייבנה?",
    ar:"كلمة “بنّاء” — يبني. ماذا تشترط بالضبط أن يُبنى؟",
    ru:"Слово «конструктивный» — созидающий. Что именно он требует создать?",
    en:"The word “constructive” means building. What exactly does it require to be built?"},
   {he:"אי אמון קונסטרוקטיבי נועד למנוע הפלת ממשלה בלי חלופה, מצב שמוביל לבחירות תכופות. הוא מבטא את התפיסה שיציבות היא ערך שלטוני, ובה בעת שומר על יכולת הכנסת להחליף ממשלה.",
    ar:"حجب الثقة البنّاء يمنع إسقاط حكومة بلا بديل، وهو وضع يقود إلى انتخابات متكرّرة. ويعبّر عن أن الاستقرار قيمة حُكمية، مع الحفاظ على قدرة الكنيست على تبديل الحكومة.",
    ru:"Конструктивный вотум недоверия не даёт свалить правительство без альтернативы — состояния, ведущего к частым выборам. Он выражает мысль, что стабильность есть ценность управления, сохраняя при этом способность Кнессета сменить правительство.",
    en:"A constructive no-confidence vote prevents a government being toppled without an alternative, a situation that leads to frequent elections. It expresses the idea that stability is a governing value, while preserving the Knesset's ability to replace a government."},
   null)
 ],
 [ /* רמה 3 — ניתוח */
  Q("exec-anal1",
    {he:"מדוע נאמר שבשיטה הפרלמנטרית הישראלית הפרדת הרשויות בין המחוקקת למבצעת חלשה יחסית?",
     ar:"لماذا يُقال إن الفصل بين التشريعية والتنفيذية في النظام البرلمانيّ الإسرائيليّ ضعيف نسبيًّا؟",
     ru:"Почему говорят, что в израильской парламентской системе разделение законодательной и исполнительной власти относительно слабо?",
     en:"Why is the separation between legislature and executive said to be relatively weak in Israel's parliamentary system?"},
   [{he:"מפני שהכנסת מתכנסת רק חצי שנה בשנה.",
     ar:"لأن الكنيست تنعقد نصف سنة فقط.",
     ru:"Потому что Кнессет заседает лишь полгода в году.",
     en:"Because the Knesset sits only half the year."},
    {he:"מפני שהממשלה נשענת על רוב בכנסת, השרים הם על פי רוב חברי כנסת, ומשמעת קואליציונית גורמת לרוב לתמוך בממשלה — כך שהמפקח והמפוקח חופפים בחלקם.",
     ar:"لأن الحكومة تستند إلى أغلبية في الكنيست، والوزراء غالبًا أعضاء كنيست، والانضباط الائتلافيّ يدفع الأغلبية لدعم الحكومة — فيتداخل الرقيب والمراقَب.",
     ru:"Потому что правительство опирается на большинство в Кнессете, министры обычно депутаты, а коалиционная дисциплина заставляет большинство поддерживать правительство — контролирующий и подконтрольный частично совпадают.",
     en:"Because the government rests on a Knesset majority, ministers are usually members of the Knesset, and coalition discipline keeps the majority supporting the government — so overseer and overseen partly overlap."},
    {he:"מפני שבית המשפט העליון ממנה את השרים ומאשר את הרכב הממשלה, ולכן הרשות השופטת שותפה בפועל להרכבתה ואינה יכולה לפקח עליה אחר כך בלי ניגוד עניינים.",
     ar:"لأنّ المحكمة العليا تعيّن الوزراء وتصادق على تشكيلة الحكومة، فتكون السلطة القضائية شريكة فعليًّا في تركيبها ولا تستطيع مراقبتها لاحقًا دون تضارب مصالح.",
     ru:"Потому что Верховный суд назначает министров и утверждает состав правительства, а значит фактически участвует в его формировании и не может потом контролировать его без конфликта интересов.",
     en:"Because the Supreme Court appoints the ministers and approves the cabinet's composition, so the judiciary actually helps form it and cannot later supervise it without a conflict of interest."},
    {he:"מפני שאין בישראל אופוזיציה.",
     ar:"لأنه لا معارضة في إسرائيل.",
     ru:"Потому что в Израиле нет оппозиции.",
     en:"Because Israel has no opposition."}],
   1,
   {he:"מי מרכיב את הרוב שאמור לפקח על הממשלה?",
    ar:"مَن يشكّل الأغلبية التي يُفترض أن تراقب الحكومة؟",
    ru:"Кто составляет то большинство, которое должно контролировать правительство?",
    en:"Who makes up the majority that is supposed to supervise the government?"},
   {he:"בשיטה נשיאותית הרשויות נבחרות בנפרד ולכן מופרדות חדות יותר. בשיטה פרלמנטרית ההפרדה חלשה מלכתחילה, ולכן חשיבותם של איזונים חיצוניים — בית משפט עצמאי, מבקר מדינה, יועץ משפטי לממשלה ותקשורת חופשית — גדולה יותר.",
    ar:"في النظام الرئاسيّ تُنتخب السلطات منفصلة فيكون الفصل أحدّ. أما في البرلمانيّ فالفصل ضعيف ابتداءً، ومن هنا تعاظم أهمّية موازين خارجية — محكمة مستقلّة، مراقب دولة، مستشار قضائيّ للحكومة، وإعلام حرّ.",
    ru:"В президентской системе ветви избираются раздельно, поэтому разделены резче. В парламентской разделение изначально слабее, и потому важнее внешние противовесы — независимый суд, государственный контролёр, юридический советник правительства и свободная пресса.",
    en:"In a presidential system the branches are elected separately and so are more sharply divided. In a parliamentary system the separation is weak to begin with, which makes external counterweights more important — an independent court, a state comptroller, an attorney general and a free press."},
   null),
  Q("exec-anal2",
    {he:"מהי הביקורת על “אקטיביזם שיפוטי”, ומהי התשובה לה?",
     ar:"ما نقد “النشاط القضائيّ”، وما الردّ عليه؟",
     ru:"В чём критика «судебного активизма» и каков ответ на неё?",
     en:"What is the criticism of “judicial activism”, and what is the answer to it?"},
   [{he:"הביקורת: השופטים מרחיבים את עילת הסבירות לכל החלטה מנהלית. התשובה: הסבירות היא כלל משפטי ותיק, ולא המצאה חדשה.",
     ar:"النقد: يوسّع القضاة سبب المعقولية ليشمل كلّ قرار إداريّ. الردّ: المعقولية قاعدة قانونية قديمة، وليست اختراعًا جديدًا.",
     ru:"Критика: судьи распространяют основание разумности на любое административное решение. Ответ: разумность — давнее правовое правило, а не новое изобретение.",
     en:"The criticism: judges stretch the reasonableness ground to every administrative decision. The answer: reasonableness is a long-standing legal rule, not a new invention."},
    {he:"הביקורת: בית משפט לא נבחר מכריע בשאלות ערכיות שהמקום להכריע בהן הוא הכנסת. התשובה: הכרעה בזכויות היא תפקידו המובהק, ובלעדיה למיעוט אין הגנה מפני הרוב.",
     ar:"النقد: محكمة غير منتخبة تحسم مسائل قيمية مكانها الكنيست. الردّ: الحسم في الحقوق وظيفتها الأصيلة، وبدونه لا حماية للأقلية من الأغلبية.",
     ru:"Критика: неизбранный суд решает ценностные вопросы, место которым в Кнессете. Ответ: решать о правах — его прямая задача, без неё у меньшинства нет защиты от большинства.",
     en:"The criticism: an unelected court decides value questions that belong in the Knesset. The answer: deciding on rights is its proper role, and without it the minority has no protection from the majority."},
    {he:"הביקורת: פסקי הדין ארוכים ומורכבים מדי, והאזרח הממוצע אינו מבין מה נפסק בעניינו. התשובה: ההנמקה המפורטת היא שמאפשרת לבקר את השופט ולערער על פסיקתו בערכאה גבוהה יותר.",
     ar:"النقد: الأحكام طويلة ومعقّدة أكثر ممّا ينبغي، والمواطن العاديّ لا يفهم ما قُضي في شأنه. الردّ: التعليل المفصّل هو ما يتيح نقد القاضي واستئناف حكمه أمام محكمة أعلى.",
     ru:"Критика: решения слишком длинны и сложны, и средний гражданин не понимает, что постановили по его делу. Ответ: именно подробная мотивировка позволяет критиковать судью и обжаловать решение в вышестоящей инстанции.",
     en:"The criticism: judgments are far too long and complex, and the average citizen cannot tell what was decided in his case. The answer: it is the detailed reasoning that makes it possible to criticise the judge and appeal to a higher court."},
    {he:"הביקורת: יש יותר מדי ערכאות. התשובה: כל ערכאה מטפלת בסוג אחר של תיקים.",
     ar:"النقد: كثرة درجات التقاضي. الردّ: لكلّ درجة نوع ملفّات مختلف.",
     ru:"Критика: слишком много инстанций. Ответ: каждая ведёт свой тип дел.",
     en:"The criticism: there are too many instances. The answer: each handles a different kind of case."}],
   1,
   {he:"מי נבחר ומי לא, ומה עומד מנגד כשהרוב פוגע במיעוט?",
    ar:"مَن مُنتخَب ومَن ليس كذلك، وما الذي يقف بالمقابل حين تمسّ الأغلبية بالأقلية؟",
    ru:"Кто избран, а кто нет, и что стоит на другой чаше, когда большинство ущемляет меньшинство?",
    en:"Who is elected and who is not, and what stands on the other side when the majority harms the minority?"},
   {he:"זהו “הקושי האנטי־רובני”: כל ביקורת שיפוטית על חקיקה היא במידה מסוימת התערבות של גוף לא נבחר. המחלוקת אינה אם ההתערבות קיימת, אלא מה גבולותיה — עילת הסבירות, זכות העמידה ושפיטוּת הן בדיוק שדות המחלוקת האלה.",
    ar:"هذه هي “الصعوبة المضادّة للأغلبية”: كلّ رقابة قضائية على التشريع تدخّلٌ ما من جسم غير منتخَب. والخلاف ليس في وجود التدخّل بل في حدوده — سبب المعقولية، وحقّ الوقوف، وقابلية التقاضي هي بالضبط ميادين هذا الخلاف.",
    ru:"Это «контрмажоритарная трудность»: всякий судебный контроль над законом есть в известной мере вмешательство неизбранного органа. Спорят не о наличии вмешательства, а о его границах — основание разумности, право на обращение и судебная подведомственность и есть поля этого спора.",
    en:"This is the counter-majoritarian difficulty: any judicial review of legislation is to some degree intervention by an unelected body. The dispute is not whether it exists, but where its limits lie — reasonableness as a ground, standing, and justiciability are precisely those battlegrounds."},
   null),
  Q("exec-anal3",
    {he:"מדוע ליועץ המשפטי לממשלה יש מעמד מיוחד, ומה המתח המובנה בתפקידו?",
     ar:"لماذا للمستشار القضائيّ للحكومة مكانة خاصّة، وما التوتّر البنيويّ في منصبه؟",
     ru:"Почему у юридического советника правительства особый статус и в чём встроенное напряжение его должности?",
     en:"Why does the attorney general hold a special standing, and what is the built-in tension in the role?"},
   [{he:"הוא שופט של הממשלה: מעמדו כשל בית משפט פנימי, החלטתו סופית ואין עליה ערעור, ולכן אינו נדרש לייצג את עמדתה בבית המשפט העליון ואינו נושא באחריות לתביעה הכללית.",

     ar:"ادّعاء: تفرقة مشروعة نابعة من تعريف الدولة كدولة قومية. وادّعاء مضادّ: سياسة الهجرة تمسّ حياة عائلات مواطنين، فتُفحص أيضًا بمعايير المساواة. وكلاهما ادّعاءان معروفان في المدنيات.",
     ru:"Одна позиция: это правомерное различение, вытекающее из определения государства как национального. Встречная: иммиграционная политика влияет на семейную жизнь граждан, поэтому проверяется и на равенство. Обе — признанные позиции в гражданствоведении.",
     en:"One claim: this is a legitimate distinction flowing from the state's definition as a nation state. The counter-claim: immigration policy affects citizens' family life, so it is also tested for equality. Both are recognised civics positions."},
    {he:"המחלוקת היא רק על גובה האגרה שגובה משרד הפנים.",
     ar:"الخلاف على قيمة الرسم الذي تجبيه وزارة الداخلية فقط.",
     ru:"Спор лишь о размере пошлины МВД.",
     en:"The dispute is only about the fee charged by the interior ministry."}],
   2,
   {he:"שאלה שנויה במחלוקת אינה שאלה בלי תשובה — אבל התשובה הנכונה כאן היא זו שמציגה את שני הצדדים כפי שהם.",
    ar:"مسألة خلافية ليست بلا جواب — لكن الجواب الصحيح هنا هو الذي يعرض الطرفين كما هما.",
    ru:"Спорный вопрос — не вопрос без ответа, но верный ответ здесь тот, что излагает обе стороны как есть.",
    en:"A contested question is not a question without an answer — but the right answer here is the one that states both sides as they are."},
   {he:"תוכנית הלימודים מלמדת את המתח הזה כמתח, ולא כתשובה אחת. מדינות לאום רבות מפעילות קריטריון לאומי בהגירה; היקף ההשלכה שלו על שוויון אזרחי הוא בדיוק נקודת המחלוקת.",
    ar:"يعلّم المنهاج هذا التوتّر كتوتّر لا كجواب واحد. دول قومية كثيرة تُعمل معيارًا قوميًّا في الهجرة؛ ومدى أثره على المساواة المدنية هو بالضبط موضع الخلاف.",
    ru:"Учебная программа преподаёт это напряжение как напряжение, а не как единственный ответ. Многие национальные государства применяют национальный критерий в иммиграции; мера его влияния на гражданское равенство и есть точка спора.",
    en:"The curriculum teaches this tension as a tension, not as a single answer. Many nation states apply a national criterion in immigration; how far it bears on civic equality is precisely the point at issue."},
   null),
  Q("jewdem-case2",
    {he:"עיריית עיר מעורבת מבקשת לקבוע שהשילוט העירוני יהיה בעברית בלבד. איזו שאלה אזרחית מתעוררת?",
     ar:"تريد بلدية مدينة مختلطة أن تكون اللافتات بالعبرية فقط. أيّ سؤال مدنيّ يُطرح؟",
     ru:"Муниципалитет смешанного города хочет, чтобы вывески были только на иврите. Какой гражданский вопрос возникает?",
     en:"The municipality of a mixed city wants street signage in Hebrew only. What civic question arises?"},
   [{he:"שאלה תקציבית בלבד: כמה עולה שילוט דו־לשוני.",
     ar:"سؤال ماليّ فقط: كم تكلّف اللافتات ثنائية اللغة.",
     ru:"Только бюджетный: сколько стоят двуязычные вывески.",
     en:"A purely budgetary one: how much bilingual signage costs."},
    {he:"שאלה של זכויות תרבותיות ושל נגישות לשירות ציבורי: האם שירות עירוני שאינו נגיש בשפת חלק מהתושבים מקיים את חובת השוויון.",
     ar:"سؤال حقوق ثقافية وإتاحة خدمة عامّة: هل خدمة بلدية غير متاحة بلغة قسم من السكّان تستوفي واجب المساواة.",
     ru:"Вопрос культурных прав и доступности публичной услуги: отвечает ли обязанности равенства услуга, недоступная на языке части жителей.",
     en:"A question of cultural rights and access to public service: does a municipal service inaccessible in the language of some residents meet the duty of equality."},
    {he:"שאלה של חופש עיסוק של מתקיני השילוט.",
     ar:"سؤال حرّية عمل مركّبي اللافتات.",
     ru:"Вопрос свободы занятий монтажников вывесок.",
     en:"A question of the sign installers' freedom of occupation."},
    {he:"אין שאלה: לעירייה סמכות מלאה בענייני שילוט, והיא רשאית לקבוע את שפת השילוט ברוב רגיל של המועצה הנבחרת, כמו בכל החלטה עירונית אחרת.",
     ar:"لا مسألة هنا: للبلدية صلاحية كاملة في شؤون اللافتات، ويحقّ لها تحديد لغة اللافتات بأغلبية عادية في المجلس المنتخَب، كأيّ قرار بلديّ آخر.",
     ru:"Вопроса нет: у мэрии полная компетенция в вопросах вывесок, и она вправе определить их язык простым большинством избранного совета, как и любое другое городское решение.",
     en:"No question arises: the municipality has full authority over signage and may set its language by a simple majority of the elected council, like any other municipal decision."}],
   1,
   {he:"מי גר בעיר, ומי צריך לקרוא את השלט כדי להגיע למרפאה?",
    ar:"مَن يسكن المدينة، ومَن يحتاج قراءة اللافتة للوصول إلى العيادة؟",
    ru:"Кто живёт в городе и кому нужно прочесть вывеску, чтобы дойти до поликлиники?",
    en:"Who lives in the city, and who needs to read the sign to reach the clinic?"},
   {he:"עד 2018 היו העברית והערבית שפות רשמיות. חוק־יסוד: ישראל — מדינת הלאום של העם היהודי קבע את העברית כשפת המדינה ולערבית מעמד מיוחד, והוסיף כי אין בכך כדי לפגוע במעמד שהיה לה בפועל. השאלה המעשית — נגישות השירות — נותרה חיה.",
    ar:"حتى ٢٠١٨ كانت العبرية والعربية لغتين رسميتين. وقرّر قانون أساس: إسرائيل — الدولة القومية للشعب اليهوديّ أن العبرية لغة الدولة وللعربية مكانة خاصّة، وأضاف أن ذلك لا يمسّ المكانة التي كانت لها عمليًّا. أما السؤال العمليّ — إتاحة الخدمة — فبقي قائمًا.",
    ru:"До 2018 года иврит и арабский были официальными языками. Основной закон «Израиль — национальное государство еврейского народа» установил иврит языком государства, а арабскому — особый статус, добавив, что это не умаляет фактически имевшегося у него положения. Практический вопрос — доступность услуги — остался живым.",
    en:"Until 2018 Hebrew and Arabic were official languages. Basic Law: Israel — the Nation State of the Jewish People made Hebrew the state language and gave Arabic a special status, adding that this does not impair the standing it had in practice. The practical question — access to services — remains live."},
   null),
  Q("jewdem-case3",
    {he:"תושב מבקש להינשא בנישואין אזרחיים בישראל. מדוע אין זו אפשרות קיימת, ובאיזה מתח מדובר?",
     ar:"يريد مقيم الزواج مدنيًّا في إسرائيل. لماذا لا يتوفّر ذلك، وأيّ توتّر يتعلّق الأمر به؟",
     ru:"Житель хочет заключить гражданский брак в Израиле. Почему такой возможности нет и о каком напряжении речь?",
     en:"A resident wishes to marry in a civil ceremony in Israel. Why is that not available, and what tension is involved?"},
   [{he:"מפני שאין בישראל משרד רישום נישואין; זו בעיה טכנית.",
     ar:"لأنه لا يوجد في إسرائيل مكتب تسجيل زواج؛ إنها مشكلة تقنية.",
     ru:"Потому что в Израиле нет органа регистрации браков; это техническая проблема.",
     en:"Because Israel has no marriage registry office; it is a technical problem."},
    {he:"מפני שענייני נישואין וגירושין נתונים לבתי הדין הדתיים לפי דין הקהילה. זהו מתח בין אופייה היהודי־דתי של המדינה לחופש הדת ולזכות למשפחה.",
     ar:"لأن شؤون الزواج والطلاق من اختصاص المحاكم الدينية وفق دين الطائفة. وهذا توتّر بين الطابع اليهوديّ الدينيّ للدولة وحرّية الدين والحقّ في الأسرة.",
     ru:"Потому что вопросы брака и развода отнесены к религиозным судам по закону общины. Это напряжение между еврейско-религиозным характером государства и свободой религии и правом на семью.",
     en:"Because marriage and divorce are assigned to the religious courts under each community's law. This is a tension between the state's Jewish-religious character and freedom of religion and the right to family life."},
    {he:"מפני שחוק־יסוד: כבוד האדם וחירותו אוסר על נישואין אזרחיים כדי למנוע פגיעה ברגשות דתיים, ולכן כל זוג נדרש להינשא בבית דין דתי המוכר בחוק.",
     ar:"لأنّ قانون أساس: كرامة الإنسان وحرّيته يمنع الزواج المدنيّ منعًا للمسّ بالمشاعر الدينية، ولذلك يُطلب من كلّ زوجين الزواج في محكمة دينية معترف بها في القانون.",
     ru:"Потому что Основной закон о достоинстве и свободе человека запрещает гражданский брак, чтобы не задевать религиозные чувства, и поэтому каждая пара обязана вступать в брак в признанном законом религиозном суде.",
     en:"Because Basic Law: Human Dignity and Liberty forbids civil marriage in order to avoid offending religious feelings, so every couple must marry in a religious court recognised by law."},
    {he:"מפני שבית המשפט העליון ביטל את הנישואין האזרחיים ב-1995.",
     ar:"لأن المحكمة العليا ألغت الزواج المدنيّ عام ١٩٩٥.",
     ru:"Потому что Верховный суд отменил гражданский брак в 1995 году.",
     en:"Because the Supreme Court abolished civil marriage in 1995."}],
   1,
   {he:"מי מוסמך בישראל להשיא, ולפי איזה דין?",
    ar:"مَن المخوَّل بعقد الزواج في إسرائيل، ووفق أيّ دين؟",
    ru:"Кто в Израиле уполномочен заключать брак и по какому закону?",
    en:"Who in Israel is authorised to marry people, and under which law?"},
   {he:"זהו חלק ממה שמכונה “הסדרי הסטטוס קוו” בענייני דת ומדינה. בפועל נישואין אזרחיים שנערכו בחו״ל נרשמים במרשם האוכלוסין, וקיים גם מוסד “ברית הזוגיות” לחסרי דת — פתרונות עקיפים למתח שלא הוכרע.",
    ar:"هذا جزء ممّا يُسمّى “ترتيبات الوضع الراهن” في الدين والدولة. عمليًّا يُسجَّل الزواج المدنيّ المعقود في الخارج في سجلّ السكّان، وثمّة أيضًا “ميثاق الزوجية” لمن لا دين لهم — حلول التفافية لتوتّر لم يُحسم.",
    ru:"Это часть так называемых «соглашений статус-кво» в вопросах религии и государства. На практике гражданский брак, заключённый за границей, регистрируется в реестре населения, а для не принадлежащих к религии существует «союз супружества» — обходные решения нерешённого напряжения.",
    en:"This is part of the so-called status quo arrangements on religion and state. In practice a civil marriage performed abroad is registered in the population registry, and a “covenant of partnership” exists for those of no religion — indirect solutions to an unresolved tension."},
   null)
 ],
 [ /* רמה 3 — ניתוח */
  Q("jewdem-anal1",
    {he:"כיצד מנוסח המתח בין “יהודית” ל“דמוקרטית” בצורתו המדויקת ביותר?",
     ar:"كيف يُصاغ التوتّر بين “يهودية” و“ديمقراطية” بأدقّ صورة؟",
     ru:"Как точнее всего сформулировать напряжение между «еврейским» и «демократическим»?",
     en:"How is the tension between “Jewish” and “democratic” most precisely stated?"},
   [{he:"אין מתח: שני המונחים אומרים בדיוק אותו דבר.",
     ar:"لا توتّر: المصطلحان يقولان الشيء ذاته تمامًا.",
     ru:"Напряжения нет: оба понятия означают ровно одно и то же.",
     en:"There is no tension: the two terms say exactly the same thing."},
    {he:"המתח מוחלט: מדינת לאום שמעניקה מעמד מיוחד לקבוצה אחת אינה יכולה להיות דמוקרטית, ולכן על המדינה לבחור בין הגדרתה היהודית לבין משטרה הדמוקרטי ולוותר על אחד מהם.",
     ar:"التوتّر مطلق: دولة قومية تمنح مكانة خاصّة لمجموعة واحدة لا يمكن أن تكون ديمقراطية، ولذلك على الدولة أن تختار بين تعريفها اليهوديّ ونظامها الديمقراطيّ وتتنازل عن أحدهما.",
     ru:"Напряжение абсолютно: национальное государство, дающее особый статус одной группе, не может быть демократическим, поэтому государству надо выбрать между еврейским определением и демократическим строем и от одного отказаться.",
     en:"The tension is absolute: a nation state that grants one group a special status cannot be democratic, so the state must choose between its Jewish definition and its democratic regime and give one of them up."},
    {he:"המתח מתעורר בנקודות מסוימות — סמלים, הגירה, שפה, דת ומדינה — שבהן מרכיב לאומי או דתי של הרוב פוגש את דרישת השוויון האזרחי; בשאר התחומים אין ביניהם סתירה.",
     ar:"يظهر التوتّر في نقاط بعينها — الرموز، الهجرة، اللغة، الدين والدولة — حيث يلتقي مركّب قوميّ أو دينيّ للأغلبية بمطلب المساواة المدنية؛ وفي سائر المجالات لا تناقض بينهما.",
     ru:"Напряжение возникает в определённых точках — символы, иммиграция, язык, религия и государство, — где национальный или религиозный компонент большинства встречается с требованием гражданского равенства; в остальном противоречия нет.",
     en:"The tension appears at particular points — symbols, immigration, language, religion and state — where a national or religious element of the majority meets the demand for civic equality; elsewhere there is no contradiction between them."},
    {he:"המתח קיים רק בזמן מלחמה.",
     ar:"التوتّر قائم في زمن الحرب فقط.",
     ru:"Напряжение существует только во время войны.",
     en:"The tension exists only in wartime."}],
   2,
   {he:"האם המתח קיים בכל שאלה, או רק בשאלות מסוימות? חשבו על חוק התעבורה מול חוק השבות.",
    ar:"أيوجد التوتّر في كلّ مسألة أم في مسائل بعينها؟ قارنوا قانون السير بقانون العودة.",
    ru:"Возникает ли напряжение в любом вопросе или лишь в некоторых? Сравните правила дорожного движения и Закон о возвращении.",
    en:"Does the tension arise in every question, or only in some? Compare the traffic laws with the Law of Return."},
   {he:"ניסוח מדויק מונע שתי טעויות נפוצות: הכחשת המתח, והפיכתו לסתירה מוחלטת. בפסיקה מקובל לאזן — לתת משקל לשני המרכיבים ולחפש את הפגיעה המצומצמת — ולא להכריע שאחד גובר תמיד.",
    ar:"الصياغة الدقيقة تمنع خطأين شائعين: إنكار التوتّر، وتحويله تناقضًا مطلقًا. وفي الاجتهاد يُعتاد الموازنة — إعطاء وزن للمركّبين والبحث عن أقلّ مساس — لا الحسم بأن أحدهما يتفوّق دائمًا.",
    ru:"Точная формулировка предотвращает две частые ошибки: отрицание напряжения и превращение его в абсолютное противоречие. В судебной практике принято взвешивать — придавать вес обоим элементам и искать наименьший ущерб, — а не постановлять, что один всегда важнее.",
    en:"A precise formulation avoids two common errors: denying the tension, and turning it into an absolute contradiction. Case law tends to balance — giving weight to both elements and seeking the narrowest infringement — rather than ruling that one always prevails."},
   null),
  Q("jewdem-anal2",
    {he:"מהי “דמוקרטיה הסדרית” (קונסוציונלית), ואילו מאפיינים שלה קיימים בישראל?",
     ar:"ما هي “الديمقراطية التوافقية”، وأيّ ملامح منها قائمة في إسرائيل؟",
     ru:"Что такое консоциональная (согласительная) демократия и какие её черты есть в Израиле?",
     en:"What is consociational democracy, and which of its features exist in Israel?"},
   [{he:"משטר שבו חברה עמוקת שסעים נשמרת יציבה באמצעות הסדרים בין מנהיגי הקבוצות — אוטונומיה תרבותית, מפתח חלוקה וזכות וטו. בישראל: חינוך נפרד לזרמים, בתי דין דתיים והסדרי סטטוס קוו.",
     ar:"نظام تُحفظ فيه مجتمعات عميقة الانقسام مستقرّة بترتيبات بين قادة المجموعات — استقلال ثقافيّ، ومفتاح توزيع، وحقّ نقض. في إسرائيل: تعليم منفصل للتيّارات، ومحاكم دينية، وترتيبات وضع راهن.",
     ru:"Строй, в котором глубоко расколотое общество удерживается стабильным через соглашения лидеров групп — культурная автономия, ключ распределения и право вето. В Израиле: раздельное образование по течениям, религиозные суды и соглашения статус-кво.",
     en:"A regime in which a deeply divided society is kept stable through arrangements between group leaders — cultural autonomy, a distribution key and a veto. In Israel: separate education streams, religious courts and status quo arrangements."},
    {he:"משטר שבו כל ההחלטות העקרוניות מתקבלות במשאלי עם, כדי לעקוף את המחלוקות בין הקבוצות ולמנוע מהן כוח וטו. בישראל: חוק משאל עם, המחייב אישור ציבורי לוויתור על שטח שחל בו הדין הישראלי.",
     ar:"نظام تُتَّخذ فيه كلّ القرارات المبدئية باستفتاءات شعبية، تفاديًا للخلافات بين المجموعات ومنعًا لامتلاكها حقّ نقض. في إسرائيل: قانون الاستفتاء، الذي يوجب مصادقة الجمهور على التنازل عن أرض يسري فيها القانون الإسرائيليّ.",
     ru:"Режим, где все принципиальные решения принимаются на референдумах, чтобы обойти разногласия между группами и лишить их права вето. В Израиле: закон о референдуме, требующий общественного одобрения при отказе от территории, где действует израильское право.",
     en:"A regime in which every question of principle is decided by referendum, so as to bypass disputes between the groups and deny them a veto. In Israel: the referendum law, which requires public approval before ceding territory under Israeli law."},
    {he:"משטר שבו הצבא מכריע במחלוקות אזרחיות. בישראל: מועצת הביטחון הלאומי.",
     ar:"نظام يحسم فيه الجيش الخلافات المدنية. في إسرائيل: مجلس الأمن القوميّ.",
     ru:"Строй, где армия решает гражданские споры. В Израиле: Совет национальной безопасности.",
     en:"A regime in which the army settles civil disputes. In Israel: the National Security Council."},
    {he:"משטר שבו אין מפלגות אלא נציגי מקצועות. בישראל: ההסתדרות.",
     ar:"نظام بلا أحزاب بل ممثّلو مهن. في إسرائيل: الهستدروت.",
     ru:"Строй без партий, с представителями профессий. В Израиле: Гистадрут.",
     en:"A regime with no parties but representatives of professions. In Israel: the Histadrut."}],
   0,
   {he:"“הסדרית” — הסדר בין מי למי? חשבו על חברה שיש בה קבוצות שאינן מוותרות זו לזו.",
    ar:"“توافقية” — توافق بين مَن ومَن؟ فكّروا في مجتمع فيه مجموعات لا تتنازل لبعضها.",
    ru:"«Согласительная» — согласие между кем? Подумайте об обществе, где группы не уступают друг другу.",
    en:"“Consociational” — an accommodation between whom? Think of a society whose groups do not give way to each other."},
   {he:"המודל ההסדרי מסביר למה חלק מהפתרונות בישראל אינם “או־או” אלא הסדרים: הם נועדו לשמור על יציבות בחברה חצויה. הביקורת עליו: הוא משמר את החלוקה, מעניק כוח למנהיגי הקבוצות, ולעיתים פוגע בפרטים בתוך הקבוצה.",
    ar:"يفسّر النموذج التوافقيّ لماذا بعض الحلول في إسرائيل ليست “إما/أو” بل ترتيبات: غايتها حفظ الاستقرار في مجتمع منقسم. ونقده: يُبقي الانقسام، ويمنح قوّة لقادة المجموعات، وقد يمسّ أفرادًا داخلها.",
    ru:"Консоциональная модель объясняет, почему часть израильских решений — не «или-или», а соглашения: они призваны сохранять стабильность в расколотом обществе. Критика: она консервирует раскол, даёт власть лидерам групп и порой ущемляет отдельных людей внутри группы.",
    en:"The consociational model explains why some Israeli solutions are not either/or but arrangements: they are meant to preserve stability in a divided society. The criticism: it entrenches the division, empowers group leaders, and can harm individuals inside the group."},
   null),
  Q("jewdem-anal3",
    {he:"כיצד בוחנים טענה שלפיה סמל מדינה — דגל, המנון או לוח שנה רשמי — פוגע בשוויון?",
     ar:"كيف يُفحص ادّعاء أن رمزًا للدولة — علمًا أو نشيدًا أو تقويمًا رسميًّا — يمسّ المساواة؟",
     ru:"Как оценивать утверждение, что государственный символ — флаг, гимн или официальный календарь — нарушает равенство?",
     en:"How is a claim examined that a state symbol — flag, anthem or official calendar — harms equality?"},
   [{he:"בוחנים אם רוב האזרחים אוהבים את הסמל.",
     ar:"يُفحص إن كان أغلب المواطنين يحبّون الرمز.",
     ru:"Проверяют, нравится ли символ большинству граждан.",
     en:"By checking whether most citizens like the symbol."},
    {he:"מבחינים בין פגיעה סמלית בשייכות לבין פגיעה בזכות קונקרטית. סמלים משקפים את זהות הרוב ברוב מדינות הלאום; השאלה המשפטית מתחדדת כשהסמל מתורגם לפגיעה מעשית — למשל בימי מנוחה או בגישה לשירות.",
     ar:"يُميَّز بين مساس رمزيّ بالانتماء ومساس بحقّ عينيّ. الرموز تعكس هويّة الأغلبية في أغلب الدول القومية؛ ويحتدّ السؤال القانونيّ حين يُترجَم الرمز إلى مساس عمليّ — كأيام الراحة أو الوصول إلى خدمة.",
     ru:"Различают символический ущерб чувству принадлежности и ущерб конкретному праву. Символы отражают идентичность большинства в большинстве национальных государств; юридический вопрос обостряется, когда символ оборачивается практическим ущербом — например, в днях отдыха или доступе к услуге.",
     en:"By distinguishing symbolic harm to belonging from harm to a concrete right. Symbols reflect the majority's identity in most nation states; the legal question sharpens when the symbol translates into practical harm — days of rest, say, or access to a service."},
    {he:"בוחנים אם הסמל נקבע בחוק יסוד או בחוק רגיל: סמל שעוגן בחוק יסוד חסין מפני טענת אי־שוויון, וסמל שנקבע בחוק רגיל אפשר לתקוף בבית המשפט — וזו כל השאלה, בלי לבחון את תוכנו ואת השפעתו על התושבים.",
     ar:"يُفحص إن كان الرمز قد تقرّر في قانون أساس أو في قانون عاديّ: فالرمز المرسّخ في قانون أساس محصّن أمام ادّعاء عدم المساواة، والمقرّر في قانون عاديّ يمكن الطعن فيه أمام المحكمة — وهذه هي المسألة كلّها، دون فحص مضمونه وأثره على السكّان.",
     ru:"Проверяют, закреплён ли символ в Основном законе или в обычном: закреплённый в Основном законе защищён от претензии о неравенстве, а установленный обычным законом можно оспорить в суде — и в этом весь вопрос, без разбора его содержания и его влияния на жителей.",
     en:"One checks whether the symbol was set in a Basic Law or an ordinary statute: one anchored in a Basic Law is immune to an inequality claim, one set by ordinary statute can be challenged in court — and that is the whole question, without examining its content or its effect on residents."},
    {he:"אין דרך לבחון: סמלים אינם עניין לדיון אזרחי.",
     ar:"لا سبيل للفحص: الرموز ليست موضوع نقاش مدنيّ.",
     ru:"Оценить нельзя: символы не предмет гражданской дискуссии.",
     en:"There is no way to examine it: symbols are not a matter for civic debate."}],
   1,
   {he:"האם כל פגיעה בתחושת שייכות היא גם פגיעה בזכות? ומתי כן?",
    ar:"أكلّ مساس بشعور الانتماء مساس بحقّ؟ ومتى يكون كذلك؟",
    ru:"Всякий ли удар по чувству принадлежности есть нарушение права? И когда всё же да?",
    en:"Is every injury to a sense of belonging also an injury to a right? And when is it?"},
   {he:"ההבחנה הזאת מאפשרת לדון בשאלה בלי לקטב אותה. היא גם מסבירה למה חלק מהמענים בישראל הם הסדרים מעשיים — ימי מנוחה לפי דת, מערכת חינוך בערבית, סמלים מקומיים — ולא שינוי הסמלים הלאומיים.",
    ar:"يتيح هذا التمييز مناقشة المسألة بلا استقطاب. ويفسّر أيضًا لماذا بعض الحلول في إسرائيل ترتيبات عملية — أيام راحة حسب الدين، تعليم بالعربية، رموز محلية — لا تغيير الرموز الوطنية.",
    ru:"Это различение позволяет обсуждать вопрос без поляризации. Оно объясняет и почему часть израильских ответов — практические механизмы (дни отдыха по религии, образование на арабском, местная символика), а не смена национальных символов.",
    en:"This distinction allows the question to be discussed without polarising it. It also explains why some Israeli answers are practical arrangements — days of rest by religion, Arabic-language schooling, local symbols — rather than changing the national symbols."},
   null)
 ]
]);

 [ /* רמה 1 — ידע */

     ar:"فجوة اجتماعية اقتصادية بين الأغنياء والفقراء، تُقاس بحسب الدخل وحجم الأملاك لدى كلّ مجموعة، وهي تتقلّص من تلقاء نفسها حين ينمو الاقتصاد.",

    {he:"חלוקה עמוקה ויציבה של החברה לקבוצות, שיש להן זהות נבדלת, מוסדות משלהן ולעיתים מפלגות משלהן — והיא נמשכת לאורך דורות.",

    ru:"В чём разница между спором, который кончается, и делением, которое наследуется?",
    en:"What is the difference between an argument that ends and a division that is inherited?"},
   {he:"בישראל מקובל למנות ארבעה שסעים מרכזיים: לאומי (יהודים–ערבים), דתי (חילונים–דתיים–חרדים), עדתי (מזרחים–אשכנזים) וחברתי־כלכלי (מרכז–פריפריה, מבוססים–מוחלשים). שסעים חופפים מעמיקים את הפילוג; שסעים חוצים מרככים אותו.",
    ar:"يُعدّ في إسرائيل أربعة انقسامات مركزية: قوميّ (يهود–عرب)، دينيّ (علمانيون–متدينون–حريديم)، طائفيّ (شرقيون–أشكناز)، واجتماعيّ اقتصاديّ (مركز–أطراف، ميسورون–مستضعفون). الانقسامات المتطابقة تعمّق الشرخ، والمتقاطعة تليّنه.",

  Q("soc-local",

     en:"What is the role of a local authority?"},
   [{he:"לספק לתושב שירותים מקומיים — חינוך, תברואה, רווחה, תכנון ובנייה — בסמכות שהוענקה לה בחוק ובפיקוח משרד הפנים.",

    {he:"ארגונים התנדבותיים שאינם ממשלתיים ואינם עסקיים — עמותות, איגודים ותנועות. הם מספקים שירותים, מייצגים קבוצות ומפעילים ביקורת על השלטון.",
     ar:"منظمات تطوّعية غير حكومية وغير ربحية — جمعيات ونقابات وحركات. تقدّم خدمات وتمثّل مجموعات وتمارس رقابة على السلطة.",
     ru:"Добровольные организации, не государственные и не коммерческие, — общества, союзы и движения. Они оказывают услуги, представляют группы и контролируют власть.",
     en:"Voluntary organisations that are neither governmental nor commercial — associations, unions and movements. They deliver services, represent groups and hold government to account."},
    {he:"מערכת בתי המשפט האזרחיים, להבדיל מהצבאיים.",
     ar:"منظومة المحاكم المدنية تمييزًا عن العسكرية.",
     ru:"Система гражданских судов в отличие от военных.",
     en:"The system of civil courts, as opposed to military ones."},
    {he:"משרדי הממשלה העוסקים ברווחה ובשירותים לאזרח — ובכללם משרד הרווחה, הביטוח הלאומי והמוסדות שהם מפעילים בקהילה, שכן הם הנותנים את המענה החברתי.",
     ar:"وزارات الحكومة المعنيّة بالرفاه وبالخدمات للمواطن — ومنها وزارة الرفاه والتأمين الوطنيّ والمؤسّسات التي يشغّلانها في المجتمع المحليّ، فهي التي تقدّم الاستجابة الاجتماعية.",
     ru:"Министерства, занимающиеся социальным обеспечением и услугами для граждан, — министерство благосостояния, Ведомство национального страхования и учреждения, которые они содержат в общинах, ведь именно они дают социальный ответ.",
     en:"The government offices dealing with welfare and services to the citizen — the welfare ministry, national insurance and the institutions they run in the community — since they are the ones providing the social response."}],
   1,
   {he:"לא ממשלה ולא עסק. מה נשאר?",
    ar:"لا حكومة ولا مشروع تجاريّ. فماذا يبقى؟",
    ru:"Не государство и не бизнес. Что остаётся?",
    en:"Not government and not business. What is left?"},
   {he:"החברה האזרחית היא “המגזר השלישי”. היא ממלאת שלוש פונקציות דמוקרטיות: ייצוג של קבוצות שאין להן כוח פוליטי, אספקת שירותים שהמדינה אינה מספקת, וביקורת עצמאית על השלטון — ולכן חופש ההתאגדות הוא תנאי לקיומה.",
    ar:"المجتمع المدنيّ هو “القطاع الثالث”. يؤدّي ثلاث وظائف ديمقراطية: تمثيل مجموعات بلا قوّة سياسية، وتقديم خدمات لا توفّرها الدولة، ورقابة مستقلّة على السلطة — لذا حرّية التنظّم شرط لوجوده.",
    ru:"Гражданское общество — «третий сектор». Оно выполняет три демократические функции: представляет группы без политической силы, оказывает услуги, которых не даёт государство, и независимо контролирует власть — поэтому свобода объединений есть условие его существования.",
    en:"Civil society is the third sector. It performs three democratic functions: representing groups with no political power, supplying services the state does not, and exercising independent scrutiny of government — which is why freedom of association is a condition of its existence."},
   null)
 ],
 [ /* רמה 2 — הבנה */
  Q("soc-case1",
    {he:"מדוע נאמר ששסעים “חוצים” מחלישים את הקיטוב בחברה?",
     ar:"لماذا يُقال إن الانقسامات “المتقاطعة” تُضعف الاستقطاب في المجتمع؟",
     ru:"Почему говорят, что «пересекающиеся» расколы ослабляют поляризацию в обществе?",
     en:"Why are crosscutting cleavages said to weaken polarisation in a society?"},
   [{he:"מפני ששסע חוצה מבטל את השסעים האחרים.",
     ar:"لأن الانقسام المتقاطع يلغي سائر الانقسامات.",
     ru:"Потому что пересекающийся раскол упраздняет прочие.",
     en:"Because a crosscutting cleavage abolishes the other cleavages."},
    {he:"מפני שאדם נמצא באותה קבוצה בכל השסעים — למשל מיעוט גם בדת, גם בלאום וגם במעמד — וכך הקבוצות מתחזקות והזהות המשותפת מקטינה את הקיטוב.",
     ar:"لأنّ الإنسان يقع في المجموعة ذاتها في كلّ الشقوق — أقلّية في الدين وفي القومية وفي المكانة معًا — فتقوى المجموعات وتقلّل الهوية المشتركة من الاستقطاب.",
     ru:"Потому что человек оказывается в одной и той же группе по всем расколам — меньшинство и по религии, и по национальности, и по статусу, — так группы крепнут, а общая идентичность снижает поляризацию.",
     en:"Because a person falls in the same group in every cleavage — a minority in religion, in nationality and in class alike — so the groups grow stronger and the shared identity reduces polarisation."},
    {he:"מפני שאדם יכול להיות ברוב בשסע אחד ובמיעוט בשסע אחר, ולכן אין מחנה קבוע שכל הזהויות שלו חופפות — וזה מקשה על עוינות מוחלטת בין קבוצות.",
     ar:"لأن الفرد قد يكون في الأغلبية في انقسام وفي الأقلية في آخر، فلا يوجد معسكر ثابت تتطابق فيه كلّ هويّاته — وهذا يعسّر العداء المطلق بين المجموعات.",
     ru:"Потому что человек может быть в большинстве по одному расколу и в меньшинстве по другому, и нет постоянного лагеря, где все его идентичности совпадают, — а это затрудняет абсолютную вражду между группами.",
     en:"Because a person can be in the majority on one cleavage and in the minority on another, so there is no fixed camp in which all their identities coincide — which makes outright hostility between groups harder."},
    {he:"מפני ששסעים חוצים קיימים רק במדינות קטנות.",
     ar:"لأن الانقسامات المتقاطعة توجد في الدول الصغيرة فقط.",
     ru:"Потому что пересекающиеся расколы бывают лишь в малых странах.",
     en:"Because crosscutting cleavages exist only in small countries."}],
   2,
   {he:"אדם אחד יכול להשתייך לכמה קבוצות. מה קורה כשההשתייכויות אינן חופפות?",
    ar:"قد ينتمي الفرد إلى مجموعات عدّة. ماذا يحدث حين لا تتطابق الانتماءات؟",
    ru:"Один человек может принадлежать к нескольким группам. Что если принадлежности не совпадают?",
    en:"One person can belong to several groups. What happens when the belongings do not coincide?"},
   {he:"שסעים חופפים — שבהם אותה קבוצה נמצאת תמיד באותו צד — הם המסוכנים ביותר ליציבות. לכן מדיניות של תעסוקה משותפת, שירות משותף ומגורים מעורבים נחשבת ממתנת: היא יוצרת השתייכויות חוצות.",
    ar:"الانقسامات المتطابقة — حيث تقف المجموعة ذاتها دائمًا في الجانب نفسه — أخطرها على الاستقرار. لذلك تُعدّ سياسات التشغيل المشترك والخدمة المشتركة والسكن المختلط مهدّئة: تخلق انتماءات متقاطعة.",
    ru:"Совпадающие расколы, где одна и та же группа всегда на одной стороне, опаснее всего для стабильности. Поэтому политика совместной занятости, совместной службы и смешанного проживания считается смягчающей: она создаёт пересекающиеся принадлежности.",
    en:"Overlapping cleavages — where the same group is always on the same side — are the most dangerous to stability. That is why policies of shared employment, shared service and mixed neighbourhoods are seen as moderating: they create crosscutting affiliations."},
   null),
  Q("soc-case2",
    {he:"ראש עיר סירב להקצות מגרש לעמותה שמבקרת אותו, אף שהיא עומדת בכל הקריטריונים. מהי העילה המנהלית לפסילת ההחלטה?",
     ar:"رفض رئيس بلدية تخصيص قطعة أرض لجمعية تنتقده رغم استيفائها كلّ المعايير. ما السبب الإداريّ لإبطال القرار؟",
     ru:"Мэр отказался выделить участок организации, которая его критикует, хотя она отвечает всем критериям. Каково административное основание отменить решение?",
     en:"A mayor refused to allocate a plot to an association that criticises him, although it meets every criterion. What administrative ground voids the decision?"},
   [{he:"שיקולים זרים ופגיעה בשוויון: רשות מנהלית חייבת להחליט לפי אמות מידה ענייניות, ולא לפי יחסה לעותר.",
     ar:"اعتبارات دخيلة ومساس بالمساواة: على السلطة الإدارية أن تقرّر وفق معايير موضوعية لا وفق موقفها من مقدّم الطلب.",
     ru:"Посторонние соображения и нарушение равенства: административный орган обязан решать по предметным критериям, а не по своему отношению к заявителю.",
     en:"Extraneous considerations and breach of equality: an administrative authority must decide by relevant criteria, not by its attitude to the applicant."},
    {he:"אין עילה: הקצאת מגרש נתונה לשיקול דעתו של ראש העיר, ובית המשפט אינו מתערב בשיקוליו של נבחר ציבור שנבחר בקולות התושבים.",
     ar:"لا سبب للإبطال: تخصيص القسيمة متروك لتقدير رئيس البلدية، والمحكمة لا تتدخّل في اعتبارات منتخَب حصل على أصوات السكّان.",
     ru:"Основания нет: выделение участка отдано на усмотрение мэра, и суд не вмешивается в соображения избранника, получившего голоса жителей.",
     en:"There is no ground: allocating a plot is within the mayor's discretion, and the court does not interfere with the considerations of an official the residents elected."},
    {he:"העילה היא שהעמותה לא פנתה קודם למשרד הפנים.",
     ar:"السبب أن الجمعية لم تتوجّه أولًا إلى وزارة الداخلية.",
     ru:"Основание в том, что организация не обратилась сперва в МВД.",
     en:"The ground is that the association did not first apply to the interior ministry."},
    {he:"העילה היא שראש העיר לא נבחר ברוב מוחלט.",
     ar:"السبب أن رئيس البلدية لم يُنتخب بأغلبية مطلقة.",
     ru:"Основание в том, что мэр не избран абсолютным большинством.",
     en:"The ground is that the mayor was not elected by an absolute majority."}],
   0,
   {he:"על מה בדיוק התבססה ההחלטה — על הקריטריונים, או על משהו אחר?",
    ar:"على ماذا استند القرار بالضبط — على المعايير أم على شيء آخر؟",
    ru:"На чём именно основано решение — на критериях или на чём-то ином?",
    en:"What exactly did the decision rest on — the criteria, or something else?"},
   {he:"עילות הביקורת המנהליות המרכזיות הן חריגה מסמכות, שיקולים זרים, חוסר סבירות קיצוני, הפליה, ניגוד עניינים ופגיעה בזכות הטיעון. הן חלות על כל רשות ציבורית, ובכלל זה על רשות מקומית.",
    ar:"أبرز أسباب الرقابة الإدارية: تجاوز الصلاحية، اعتبارات دخيلة، لا معقولية متطرّفة، تمييز، تضارب مصالح، والمساس بحقّ الادّعاء. وتسري على كلّ سلطة عامّة، ومنها السلطة المحلّية.",
    ru:"Главные основания административного контроля: превышение полномочий, посторонние соображения, крайняя неразумность, дискриминация, конфликт интересов и нарушение права быть выслушанным. Они относятся к любому публичному органу, включая местный.",
    en:"The main grounds of administrative review are excess of authority, extraneous considerations, extreme unreasonableness, discrimination, conflict of interest and denial of the right to be heard. They apply to every public authority, local authorities included."},
   null),
  Q("soc-case3",
    {he:"תושבי שכונה בפריפריה מגלים שהתקציב לחוגים בשכונתם קטן פי שלושה מזה שבשכונה מבוססת באותה עיר. איזו טענה אזרחית עומדת לרשותם?",
     ar:"يكتشف سكّان حيّ في الأطراف أن ميزانية النشاطات في حيّهم أقلّ بثلاثة أضعاف من حيّ ميسور في المدينة ذاتها. أيّ ادّعاء مدنيّ متاح لهم؟",
     ru:"Жители периферийного квартала обнаружили, что бюджет кружков у них втрое меньше, чем в благополучном квартале того же города. Какой гражданский довод у них есть?",
     en:"Residents of a peripheral neighbourhood discover that the budget for after-school activities there is a third of that in a well-off neighbourhood of the same city. What civic claim is open to them?"},
   [{he:"אין להם טענה: חלוקת התקציב היא עניין פוליטי, והמועצה הנבחרת רשאית להעדיף שכונות שבהן שיעור ההשתתפות בחוגים גבוה יותר.",
     ar:"لا ادّعاء لديهم: توزيع الميزانية شأن سياسيّ، ويحقّ للمجلس المنتخَب تفضيل أحياء تكون فيها نسبة المشاركة في الدورات أعلى.",
     ru:"Претензии у них нет: распределение бюджета — политический вопрос, и избранный совет вправе отдавать предпочтение районам, где участие в кружках выше.",
     en:"They have no claim: dividing the budget is a political matter, and the elected council may prefer neighbourhoods where participation in the classes is higher."},
    {he:"טענה לפגיעה בשוויון בהקצאת משאבים ציבוריים, ולעיתים גם טענה לזכות חברתית — חינוך; אם ההבדל אינו נשען על שוני רלוונטי, זו הפליה.",
     ar:"ادّعاء بمساس بالمساواة في تخصيص الموارد العامّة، وأحيانًا بحقّ اجتماعيّ — التعليم؛ وإن لم يستند الفارق إلى شيء ذي صلة فهو تمييز.",
     ru:"Довод о нарушении равенства в распределении публичных ресурсов, а иногда и о социальном праве — образовании; если различие не опирается на релевантное отличие, это дискриминация.",
     en:"A claim of unequal allocation of public resources, and sometimes of a social right — education; if the difference rests on no relevant distinction, it is discrimination."},
    {he:"טענה לפגיעה בחופש העיסוק של מדריכי החוגים.",
     ar:"ادّعاء بمساس بحرّية عمل مرشدي النشاطات.",
     ru:"Довод о нарушении свободы занятий руководителей кружков.",
     en:"A claim that the instructors' freedom of occupation is infringed."},
    {he:"טענה שהעירייה חרגה מסמכותה בכך שהפעילה חוגים בכלל.",
     ar:"ادّعاء بأن البلدية تجاوزت صلاحيتها بتشغيل نشاطات أصلًا.",
     ru:"Довод, что муниципалитет вышел за полномочия, вообще проводя кружки.",
     en:"A claim that the municipality exceeded its powers by running activities at all."}],
   1,
   {he:"האם יש שוני רלוונטי בין הילדים בשתי השכונות?",
    ar:"أثمّة فارق ذو صلة بين أطفال الحيّين؟",
    ru:"Есть ли релевантное отличие между детьми двух кварталов?",
    en:"Is there a relevant difference between the children of the two neighbourhoods?"},
   {he:"השסע החברתי־כלכלי מתבטא בדיוק כאן: לא רק בהכנסה, אלא בנגישות לשירות ציבורי. הדרישה לשוויון בהקצאה חלה על המדינה ועל הרשות המקומית כאחת, וניתן לתקוף הפרה שלה בעתירה מנהלית.",
    ar:"يتجلّى الانقسام الاجتماعيّ الاقتصاديّ هنا بالضبط: ليس في الدخل فحسب بل في إتاحة الخدمة العامّة. ومطلب المساواة في التخصيص يسري على الدولة والسلطة المحلّية معًا، ويمكن الطعن في خرقه بالتماس إداريّ.",
    ru:"Социально-экономический раскол проявляется именно здесь: не только в доходе, но и в доступе к публичной услуге. Требование равенства при распределении относится и к государству, и к местной власти, а нарушение можно оспорить административным иском.",
    en:"The socio-economic cleavage shows itself exactly here: not only in income, but in access to public service. The demand for equality in allocation binds the state and the local authority alike, and a breach can be challenged by an administrative petition."},
   null)
 ],
 [ /* רמה 3 — ניתוח */
  Q("soc-anal1",
    {he:"מהו “רב־תרבותיות”, ומהי הביקורת המרכזית עליו?",
     ar:"ما هي “التعدّدية الثقافية”، وما النقد المركزيّ لها؟",
     ru:"Что такое мультикультурализм и какова главная критика в его адрес?",
     en:"What is multiculturalism, and what is the main criticism of it?"},
   [{he:"תפיסה שלפיה על המדינה למחוק הבדלים תרבותיים לטובת תרבות אחת משותפת — בחינוך, בשפה ובסמלים. הביקורת: כור היתוך כזה נכשל בפועל, ונתפס כפגיעה בזהותן של קבוצות ותיקות ומהגרות כאחת.",
     ar:"تصوّر يوجب على الدولة محو الفوارق الثقافية لصالح ثقافة واحدة مشتركة — في التعليم واللغة والرموز. النقد: بوتقة الصهر هذه فشلت عمليًّا، ويُنظر إليها كمسّ بهوية مجموعات قديمة ومهاجرة على السواء.",
     ru:"Представление, по которому государство должно стереть культурные различия ради одной общей культуры — в образовании, языке и символах. Критика: такой плавильный котёл на деле провалился и воспринимается как удар по идентичности и старожилов, и репатриантов.",
     en:"The view that the state should erase cultural differences in favour of one shared culture — in education, language and symbols. The criticism: such a melting pot failed in practice and is felt as an attack on the identity of veteran and immigrant groups alike."},

/* ============================================================
   8. מנוע התרגילים
   ------------------------------------------------------------
   הבנק כתוב, ולכן אין כאן מחולל מסיחים. תפקידו של המנוע צנוע
   יותר ומדויק יותר: לבחור איזה פריט להציג עכשיו, ולערבב את
   סדר התשובות כך שהאינדקס לא ילמד דבר.

   שני מצבי בחירה, וזה ההבדל המהותי בקובץ הזה:
   · בתרגול — חזרה מרווחת: קודם מה שעוד לא נראה, אחר כך מה
     שנכשל, ורק בסוף מה שכבר נשלט.
   · במבחן — בחירה אחידה, בלי להביט בהתקדמות הלומד.
   ההפרדה אינה קוסמטית. מבחן נארז לקישור כזרע, והתלמיד בונה
   ממנו את השאלות מחדש אצלו. אילו הבחירה הייתה תלויה בהיסטוריית
   הלמידה, אותו זרע היה מייצר שאלה אחת אצל המורה ושאלה אחרת
   אצל התלמיד — כלומר המבחן שהמורה ראה אינו המבחן שנשלח.
   ============================================================ */
function itemId(tid,lv,i){return tid+"|"+lv+"|"+i}
function itemRec(id){
  if(!state.item[id])state.item[id]={n:0,ok:0};
  return state.item[id];
}
function poolOf(tp,lv){return (tp.L[lv-1]||tp.L[0]||[])}

/* בחירת פריט לתרגול. משקל גבוה לחדש, בינוני לנכשל, נמוך לנשלט. */
function chooseIndex(tid,lv,pool,avoid){
  var cand=[],i,w;
  for(i=0;i<pool.length;i++){
    if(avoid!==undefined&&i===avoid&&pool.length>1)continue;
    var r=state.item[itemId(tid,lv,i)];
    if(!r||!r.n)w=6;                            /* חדש */
    else if(r.ok<r.n)w=1+Math.min(4,r.n-r.ok);  /* נכשל בעבר */
    else w=1;                                   /* נשלט */
    for(var j=0;j<w;j++)cand.push(i);
  }
  if(!cand.length)return 0;
  return pick(cand);
}
/* בחירת פריט למבחן. אחידה, ואינה נוגעת ב-state כלל. */
function pureIndex(pool,avoid){
  var cand=[],i;
  for(i=0;i<pool.length;i++){
    if(avoid!==undefined&&i===avoid&&pool.length>1)continue;
    cand.push(i);
  }
  return cand.length?pick(cand):0;
}

/* ------------------------------------------------------------
   ניקוי להקראה בלבד. המסך אינו משתנה ממנו.

   הגרשיים העבריים משמשים לשני דברים: ראשי תיבות (חוק־יסוד,
   בג״ץ) ומירכאות (״מדינה יהודית״). המנוע מכיר רק את הראשון.
   הכלל שמפריד: בראשי תיבות באה אחרי הגרשיים אות עברית אחת
   בדיוק וסוף מילה. הסיכון א־סימטרי — מירכאה שהוסרה אינה
   יכולה להזיק, מירכאה שנשארה כן.

   המירכאות המסולסלות (“ ”) משמשות כאן לציטוט מונחים בלבד,
   ולכן הן נופלות תמיד. הקו המפריד הופך לפסיק, כדי שהקול
   ייעצר במקום לרוץ הלאה.
   ------------------------------------------------------------ */
function saySpell(x){
  return String(x==null?"":x)
    .replace(/[“”‘’]/g,"")
    .replace(/״/g,function(m,i,str){
      return /^[א-ת](?![א-ת])/.test(str.slice(i+1))?m:"";
    })
    .replace(/\s—\s/g,", ");
}

function O(html,ok,why){return {h:html,ok:!!ok,why:why||""}}

/* בונה שאלה מפריט אחד. סדר האפשרויות מעורבב בכל בנייה, ולכן
   האינדקס ok שבתוכן אינו מגיע למסך לעולם. */
function buildFromItem(it){
  var opts=it.o.map(function(o,i){return O(esc(gl(o)),i===it.ok,"")});
  var ans=gl(it.o[it.ok]);
  return {
    type:"mcq",
    prompt:t("qPick"),
    lead:gl(it.q),
    fig:figHtml(it.fig),
    opts:shuffle(opts),
    answer:ans,
    /* מה שנאמר אחרי המענה: השאלה, התשובה הנכונה, וההסבר.
       תשובה בלי ההסבר נשמעת כמו עובדה לשינון, וזה בדיוק מה
       שהאפליקציה הזאת קיימת כדי להחליף. */
    say:gl(it.q)+" "+ans+". "+gl(it.ex),
    reveal:it
  };
}
function buildQuestion(tid,lv,avoid,pure){
  var tp=topicOf(tid); if(!tp)return null;
  var pool=poolOf(tp,lv);
  if(!pool.length)return null;
  var idx=pure?pureIndex(pool,avoid):chooseIndex(tid,lv,pool,avoid);
  var it=pool[idx];
  if(!it)return null;
  var q=buildFromItem(it);
  q.tid=tid; q.lv=lv; q.idx=idx; q.id=itemId(tid,lv,idx);
  q.hint=gl(it.hint);
  return q;
}

  var s=state.screen;

/* ============================================================
   מבחן מדומה
   ------------------------------------------------------------
   עשרים שאלות מכל הנושאים ומכל הרמות, בחוברת אחת שגוללים בה —
   ולא שאלה־שאלה. מי שקורא לאט צריך לראות כמה נשאר, לחזור אחורה
   ולשנות תשובה; ניווט שמסתיר את שאר השאלות לוקח ממנו בדיוק את זה.

   המבחן אינו נשמר. הוא מצב זמני בזיכרון בלבד, ורענון הדף מתחיל
   אותו מחדש — זו הצהרה ולא פער: שעון שממשיך לרוץ בין ביקורים
   הוא בדיוק המקום שבו נולדים באגים שקשה לשחזר.
   ============================================================ */
var SIM_N=20, SIM_MIN=30;
var SIM={on:false,done:false,q:[],ans:[],end:0,tick:null};

function simStop(){if(SIM.tick){clearInterval(SIM.tick);SIM.tick=null}}
function simFmt(ms){
  if(ms<0)ms=0;
  var sec=Math.round(ms/1000),m=Math.floor(sec/60),c=sec%60;
  return m+":"+(c<10?"0":"")+c;
}
function simLeftN(){
  var n=0,i;
  for(i=0;i<SIM.ans.length;i++)if(SIM.ans[i]<0)n++;
  return n;
}
function simRight(){
  var n=0,i;
  for(i=0;i<SIM.q.length;i++)if(SIM.ans[i]>=0&&SIM.q[i].opts[SIM.ans[i]].ok)n++;
  return n;
}
function simStart(){
  var pairs=[],qs=[],i,q;
  TOPICS.forEach(function(tp){for(var l=1;l<=3;l++)pairs.push([tp.id,l])});
  shuffle(pairs);
  for(i=0;i<pairs.length&&qs.length<SIM_N;i++){
    q=buildQuestion(pairs[i][0],pairs[i][1],undefined,true);
    if(q)qs.push(q);
  }
  /* פחות צמדי נושא-רמה מ-SIM_N: סבב נוסף, בלי לחזור על אותו פריט. */
  var guard=0;
  while(qs.length<SIM_N&&guard<400){
    var pr=pairs[guard%pairs.length]; guard++;
    q=buildQuestion(pr[0],pr[1],undefined,true);
    if(!q)continue;
    var dup=false,k;
    for(k=0;k<qs.length;k++)if(qs[k].id===q.id){dup=true;break}
    if(!dup)qs.push(q);
  }
  SIM.q=qs;
  SIM.ans=qs.map(function(){return -1});
  SIM.on=true; SIM.done=false; SIM.end=Date.now()+SIM_MIN*60000;
  simArm();
}
function simArm(){
  simStop();
  if(SIM.on&&!SIM.done)SIM.tick=setInterval(simClock,1000);
}
function simClock(){
  var el=$("#simclock");
  /* המסך הוחלף — אין מה לעדכן, והשעון נעצר מעצמו. */
  if(!el){simStop();return}
  var left=SIM.end-Date.now();
  el.textContent=simFmt(left);
  if(left<=60000)el.classList.add("low");
  if(left<=0){simStop();simSubmit()}
}
/* ההגשה היא גם רגע הרישום: עד כאן לא נספרה אף תשובה, כדי
   שהמבחן לא ידחוף לבנק הטעויות שאלה שהנבחן עוד עמד לשנות. */
function simSubmit(){
  if(!SIM.on||SIM.done)return;
  simStop();
  var i;
  for(i=0;i<SIM.q.length;i++){
    var q=SIM.q[i],pk=SIM.ans[i];
    recordItem(q.tid,q.lv,q.id,pk>=0&&!!q.opts[pk].ok);
  }
  SIM.done=true; save(); render(); window.scrollTo(0,0);
}

function screenSim(){
  var h='<div class="wrap"><h2 style="margin:1.1rem 0 .3rem;font-size:1.4rem">'+esc(t("simT"))+"</h2>";
  if(!SIM.on){
    h+='<div class="card"><p style="margin:0 0 .8rem;color:var(--muted)">'+esc(t("simD"))+"</p>"+
       '<button class="btn pri" data-a="simstart">'+ic("play",16)+" "+esc(t("simStart"))+"</button></div>";
    return h+"</div>"+fbar();
  }
  if(SIM.done){
    var right=simRight(),pc=Math.round(100*right/Math.max(1,SIM.q.length));
    h+='<div class="card" style="text-align:center"><div style="font-size:2.2rem;font-weight:800">'+
       pc+'%</div><div style="color:var(--muted)">'+esc(t("simScore"))+" — "+right+" / "+SIM.q.length+"</div>"+
       '<div style="margin-top:.8rem"><button class="btn pri" data-a="simstart">'+
       ic("redo",16)+" "+esc(t("simAgain"))+"</button></div></div>";
    h+='<h3 style="margin:1.2rem 0 .2rem;font-size:1.1rem">'+esc(t("simReview"))+"</h3>";
    SIM.q.forEach(function(q,i){
      var pk=SIM.ans[i],ok=pk>=0&&!!q.opts[pk].ok;
      h+='<div class="simq"><div class="simn">'+esc(t("simQ"))+" "+(i+1)+" · "+
         esc(topicOf(q.tid)?tName(topicOf(q.tid)):"")+" · "+esc(t("lv"+q.lv))+"</div>";
      h+=askBox(q.lead||"");
      if(q.fig)h+=q.fig;
      h+='<div class="fb '+(ok?"ok":"bad")+'"><b>'+(ok?esc(t("correct")):esc(t("wrong")))+"</b>"+
         '<div class="body">'+esc(t("simYours"))+": <b>"+
         esc(pk>=0?plainOf(q.opts[pk].h):t("simNone"))+"</b><br>"+
         esc(t("answerIs"))+" <b>"+esc(q.answer)+"</b></div>";
      if(q.reveal&&q.reveal.ex)
        h+='<div class="why"><b>'+esc(t("whyT"))+":</b> "+esc(gl(q.reveal.ex))+"</div>";
      h+="</div>";
      h+='<div style="display:flex;gap:.5rem;margin-top:.6rem">'+
         spkBtn(saySpell(q.say),state.lang,false,t("hearSent"))+
         spkBtn(saySpell(q.say),state.lang,true,t("hearSlow"))+"</div>";
      h+="</div>";
    });
    return h+"</div>"+fbar();
  }
  /* המבחן עצמו. השעון נדרך אחרי הציור, כי הוא מעדכן אלמנט
     שעדיין לא קיים בזמן שבניית ה-HTML רצה. */
  setTimeout(simArm,0);
  h+='<div class="simbar"><span class="clock" id="simclock">'+esc(simFmt(SIM.end-Date.now()))+"</span>"+
     '<span class="chip"><span id="simleft">'+simLeftN()+"</span> "+esc(t("simLeft"))+"</span>"+
     '<button class="btn pri" data-a="simsubmit" style="margin-inline-start:auto">'+
     esc(t("simSubmit"))+"</button></div>";
  SIM.q.forEach(function(q,i){
    h+='<div class="simq"><div class="simn">'+esc(t("simQ"))+" "+(i+1)+" / "+SIM.q.length+"</div>";
    h+=askBox(q.lead||"");
    if(q.fig)h+=q.fig;
    h+='<div class="opts">';
    q.opts.forEach(function(o,j){
      h+='<button class="opt'+(SIM.ans[i]===j?" sel":"")+'" data-a="simpick" data-i="'+i+
        '" data-j="'+j+'"><span class="k">'+String.fromCharCode(65+j)+"</span><span>"+o.h+"</span></button>";
    });
    h+="</div></div>";
  });
  h+='<div style="margin:1rem 0"><button class="btn pri" data-a="simsubmit">'+
     esc(t("simSubmit"))+"</button></div>";
  return h+"</div>"+fbar();
}

/* אין track ב-blankState של האפליקציה הזאת, ולכן בכניסה הראשונה
   הוא undefined ורשימת הנושאים הייתה יוצאת ריקה. נופלים למסלול

/* טקסט נקי מתוך HTML — המסכים משווים ומדווחים תשובות כטקסט. */
function plainOf(h){

function buildQ(tid,lv){
  /* pure=true — הבחירה כאן אינה מביטה בהתקדמות הלומד. זה מה
     שמאפשר לזרע אחד לייצר את אותה שאלה בדיוק אצל המורה ואצל

          say:q.say||"", hint:q.hint||""};

/* ============================================================
   18. מבחן כיתתי — פרסום בוואטסאפ, קבלת תשובות וציונים
   ------------------------------------------------------------
   אין שרת, ואין כוונה שיהיה. לכן המבחן אינו נשלח לשום מקום:
   הוא *נארז לתוך הקישור*. המורה מקבל קישור, שולח אותו בוואטסאפ,
   והמכשיר של התלמיד בונה מהקישור בדיוק את אותן שאלות.

   מה שהופך את זה לאפשרי הוא שכל מחולל שאלות כאן משתמש ב-
   Math.random בלבד. אם מזרעים אותו, אותו זרע מייצר את אותן
   שאלות ואת אותו סדר תשובות — אצל המורה ואצל התלמיד. הקישור
   נושא זרע ורשימת נושאים, לא עשרים שאלות מלאות, ולכן הוא נשאר
   קצר מספיק לוואטסאפ.

   שלוש מגבלות שנאמרות כאן במפורש כי הן חלק מהתכנון:
   · אין איסוף אוטומטי. התלמיד שולח קוד תשובות בוואטסאפ, והמורה
     מדביק אותו. זה המחיר של אפס שרת ואפס עלות.
   · אפשר לזייף קוד. הציון מחושב מחדש אצל המורה מתוך התשובות
     ולא נלקח מהתלמיד, אבל אין כאן הגנה קריפטוגרפית — זה מבחן
     כיתתי מעצב, לא בגרות.
   · שמות התלמידים נשארים במכשיר של המורה. הם לא עוברים דרך
     שום שרת, כי אין שרת.
   ============================================================ */
var GENV=2;                 /* גרסת המחוללים. מבחן שנוצר בגרסה אחרת
                               אינו נפתח — עדיף הודעה ברורה מאשר
                               עשרים שאלות אחרות בשקט. */
var EKEY="shlav-exams-civics-v1";   /* מפתח לאפליקציה הזאת בלבד */
var EKEY_OLD="shlav-exams-v1";  /* המפתח המשותף הישן. לקריאה בלבד, לא נמחק. */

/* --- מחולל מזורע. mulberry32: קצר, מהיר, ופיזור טוב דיו --- */
function withSeed(seed,fn){
  var real=Math.random,s=(seed>>>0)||1;
  Math.random=function(){
    s|=0; s=s+0x6D2B79F5|0;
    var t=Math.imul(s^s>>>15,1|s);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
  try{return fn()}finally{Math.random=real}
}
function hash32(str){
  var h=0x811c9dc5,i;
  for(i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193)}
  return (h>>>0);
}
/* base64url. הניקוי בפענוח אינו קוסמטי: וואטסאפ שובר מחרוזות
   ארוכות בשורות, ורווח אחד הורס את כל הקוד. */
function b64e(str){
  var bytes=new TextEncoder().encode(str),bin="",i;
  for(i=0;i<bytes.length;i+=8192)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));
  return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function b64d(s){
  s=String(s||"").replace(/[^A-Za-z0-9\-_]/g,"").replace(/-/g,"+").replace(/_/g,"/");
  while(s.length%4)s+="=";
  var bin=atob(s),bytes=new Uint8Array(bin.length),i;
  for(i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
/* הזרע של המשבצת נכנס למזהה: שני מבחנים באותם נושאים ובאותה
   רמה, שהמורה החליף באחד מהם שאלה, אינם אותו מבחן. מבחן ישן
   שאין לו זרעים מקבל בדיוק את המזהה שקיבל תמיד — אחרת ההגשות
   שכבר נקלטו אליו מתייתמות. */
function examId(spec){return hash32(spec.s+"|"+spec.q.map(function(x){
  return x[0]+x[1]+(x.length>2?"@"+x[2]:"")}).join(",")).toString(36)}
function encodeExam(spec){return b64e(JSON.stringify(spec))}
function decodeExam(code){
  try{
    var o=JSON.parse(b64d(code));
    if(!o||!o.q||!o.q.length||typeof o.s!=="number")return null;
    o.q=o.q.filter(function(x){return topicById(x[0])});
    return o.q.length?o:null;
  }catch(e){return null}
}
/* בונה את שאלות המבחן. אותו זרע → אותן שאלות, גם אצל המורה
   כשהוא בודק וגם אצל התלמיד כשהוא נבחן. */
function examQuestions(spec){
  /* מסננים נושאים שאינם מוכרים לאפליקציה הזאת, בדיוק כמו decodeExam.
     בלי הסינון buildQ מחזיר null על נושא זר, והמסך נופל על
     q.topic של null. עדיף לדלג בשקט מאשר להתרסק. */
  var pairs=(spec.q||[]).filter(function(x){return !!topicById(x[0])});
  /* מבחן שנבנה עם זרע לכל משבצת נבנה משבצת אחרי משבצת, וכל
     שאלה תלויה בזרע שלה בלבד — כך המורה יכול להחליף אחת מהן.
     מבחן ישן, בלי זרעים, חייב להיבנות בדיוק כפי שנבנה ביום
     שנשלח: אחרת הציון של מי שכבר נבחן משתנה למפרע. */
  if(pairs.length&&pairs.every(function(x){return typeof x[2]==="number"}))
    return pairs.map(function(p){return exBuildSlot(p)})
                .filter(function(q){return !!q});
  return withSeed(spec.s,function(){
    return pairs.map(function(pair){return buildQ(pair[0],pair[1])})
                .filter(function(q){return !!q});
  });
}
/* --- בחירת השאלות בידי המורה ---------------------------------
   עד כאן המורה בחר נושאים, רמה ומספר שאלות — והשאלות עצמן הוגרלו
   מאחורי גבו. הוא ראה אותן לראשונה רק אחרי שהמבחן כבר היה אצל
   התלמידים. מעכשיו כל שאלה היא משבצת נפרדת עם זרע משלה: המורה
   רואה אותה לפני השליחה, מחליף אותה בשאלה אחרת מאותו נושא,
   מסיר אותה, או מוסיף שאלה מנושא שחסר לו.

   הזרע הנפרד לכל משבצת הוא מה שמאפשר את זה. בזרם אקראי אחד
   ומשותף, כפי שהיה עד כאן, החלפה של השאלה השלישית הייתה משנה
   גם את הרביעית ואת החמישית — כלומר לא "החלפה" אלא הגרלה מחדש
   של כל מה שאחריה.

   24 ביט ולא 32: הזרע נוסע בתוך הקישור שנשלח בוואטסאפ, וזרע
   קצר יותר הוא קישור קצר יותר. שישה־עשר מיליון אפשרויות למשבצת
   הן הרבה מעבר למה שהמחולל עצמו יודע לייצר. */
function exNewSeed(){return (Math.random()*16777215)>>>0}
function exSlot(topicId,level){return [topicId,level,exNewSeed()]}
/* אותו זרע → אותה שאלה בדיוק: אצל המורה כשהוא בוחר, ואצל
   התלמיד כשהוא נבחן. */
function exBuildSlot(slot){
  if(!slot||!topicById(slot[0]))return null;
  return withSeed(slot[2],function(){return buildQ(slot[0],slot[1])})||null;
}
/* מסך הבנייה מצייר את עצמו מחדש אחרי כל לחיצה, ובניית עשרים
   וחמש שאלות בכל ציור מיותרת. המטמון הוא לתצוגה בלבד — מי
   שנבחן בונה את שאלותיו מחדש, כדי שאיש לא יערוך בטעות אובייקט
   שגם מסך אחר מחזיק בו. */
var EXQCACHE={};
/* לכל אפליקציה מנגנון שפה משלה, ולא לכולן אותם שמות. הפנייה
   דרך window ולא בשם ישיר, כי שם שאינו קיים באפליקציה מסוימת
   הוא שגיאה בעיני הבודקים — רעש שמסתיר שגיאה אמיתית. */
function exLangKey(){
  try{
    var g=(typeof window!=="undefined")?window:{};
    if(typeof g.xlg==="function")return g.xlg();
    if(typeof g.LG==="string")return g.LG;
    return (state&&state.settings&&state.settings.lang)||"he";
  }catch(e){return "he"}
}
function exPreviewQ(slot){
  if(!slot)return null;
  var k=slot[0]+"|"+slot[1]+"|"+slot[2]+"|"+exLangKey();
  if(!(k in EXQCACHE)){
    /* מורה שמחליף שאלות שוב ושוב מייצר מפתח חדש בכל לחיצה.
       מטמון שרק גדל הוא דליפה; מרוקנים אותו ומתחילים מחדש. */
    if(Object.keys(EXQCACHE).length>400)EXQCACHE={};
    EXQCACHE[k]=exBuildSlot(slot);
  }
  return EXQCACHE[k];
}
function exTopicName(id){
  var t=topicById(id); if(!t)return "";
  var g=(typeof window!=="undefined")?window:{};
  return (typeof g.tName==="function"?g.tName(t):t.name)||"";
}
function exRightAnswer(q){
  var i; if(!q||!q.options)return null;
  for(i=0;i<q.options.length;i++)if(q.options[i].ok)return q.options[i];
  return null;
}
/* המשבצות שהמורה עורך. נבנות מחדש רק כשנושא, רמה או מספר
   השאלות משתנים; עריכה של משבצת בודדת נשמרת. */
function exSlots(){
  if(EB.q&&EB.q.length)return EB.q;
  var tops=EB.topics.filter(function(x){return topicById(x)});
  if(!tops.length)tops=topicsForTrack(state.track).slice(0,3).map(function(t){return t.id});
  var q=[],i;
  for(i=0;i<EB.n;i++)q.push(exSlot(tops[i%tops.length],EB.level));
  /* מערבבים כאן ולא בשליחה: המורה רואה את הסדר הסופי ומאשר אותו. */
  EB.q=shuffle(q);
  return EB.q;
}
function examUrl(spec){
  var base=location.origin+location.pathname;
  return base+"#x="+encodeExam(spec);
}
function waLink(text,phone){
  var p=String(phone||"").replace(/[^0-9]/g,"");
  return "https://wa.me/"+p+"?text="+encodeURIComponent(text);

var EX={list:[]};
/* --- הגירה מהמפתח המשותף הישן ---------------------------------
   עד הגרסה הזאת כל האפליקציות כתבו מבחנים לאותו מפתח localStorage
   ובאותו origin, ולכן מבחן שנבנה במתמטיקה הופיע ברשימת המבחנים של
   אנגלית והפיל את המסך. מעכשיו לכל אפליקציה מפתח משלה, ובטעינה
   מועתקות מהמפתח הישן רק רשומות שכל נושאיהן מוכרים כאן.
   המפתח הישן נשאר על כנו ואינו נמחק, כדי שגם אפליקציה אחרת תוכל
   לקלוט ממנו את המבחנים ששייכים לה. --------------------------- */
function exSpecKnown(spec){
  if(!spec||!spec.q||!spec.q.length)return false;
  for(var i=0;i<spec.q.length;i++){
    var pair=spec.q[i];
    if(!pair||!topicById(pair[0]))return false;
  }
  return true;
}
function exAdoptLegacy(){
  var added=0;
  try{
    var raw=localStorage.getItem(EKEY_OLD); if(!raw)return;
    var old=JSON.parse(raw); if(!old||!old.list||!old.list.length)return;
    var have={},i,ex;
    for(i=0;i<EX.list.length;i++)have[EX.list[i].id]=1;
    for(i=0;i<old.list.length;i++){
      ex=old.list[i];
      if(!ex||!ex.id||have[ex.id])continue;
      if(!exSpecKnown(ex.spec))continue;
      EX.list.push(ex); have[ex.id]=1; added++;
    }
  }catch(e){return}
  if(added)exSave();
}
function exLoad(){
  try{var r=localStorage.getItem(EKEY);if(r){var o=JSON.parse(r);if(o&&o.list)EX=o}}catch(e){}
  if(!EX.list)EX.list=[];
  exAdoptLegacy();
}
function exSave(){try{localStorage.setItem(EKEY,JSON.stringify(EX))}catch(e){}}
function exFind(id){for(var i=0;i<EX.list.length;i++)if(EX.list[i].id===id)return EX.list[i];return null}

/* --- קוד ההגשה של התלמיד --- */
function encodeResult(id,name,answers){
  var body={i:id,n:String(name||"").slice(0,40),a:answers,d:todayIso()};
  body.c=hash32(JSON.stringify([body.i,body.n,body.a])).toString(36);
  return b64e(JSON.stringify(body));
}
function decodeResult(code){
  try{
    var o=JSON.parse(b64d(code));
    if(!o||!o.i||!o.a||!o.a.length)return null;
    o.ok=(o.c===hash32(JSON.stringify([o.i,o.n,o.a])).toString(36));
    return o;
  }catch(e){return null}
}
/* הציון מחושב כאן מחדש מתוך התשובות. מה שהתלמיד שלח הוא מה
   שסימן, לא כמה הוא קיבל. */
function gradeResult(spec,res){
  var qs=examQuestions(spec),per=[],ok=0,i,q,a;
  for(i=0;i<qs.length;i++){
    q=qs[i]; a=res.a[i];
    var right=(a>=0&&q.options[a]&&q.options[a].ok)?1:0;
    if(right)ok++;
    per.push({topic:q.topic,topicName:q.topicName,ok:right,
              picked:(a>=0&&q.options[a])?q.options[a].t:"—",
              answer:(q.options.filter(function(o){return o.ok})[0]||{}).t||""});
  }
  return {ok:ok,n:qs.length,pct:Math.round(100*ok/qs.length),per:per};
}

function viewExamSlots(){
  var ls=exSlots(),h="",tops=EB.topics.filter(function(x){return topicById(x)});
  h+='<div style="margin-top:18px"><b>'+esc(xt("exQs"))+'</b>'+
     '<p class="sub" style="margin:4px 0 8px">'+esc(xt("exQsNote"))+'</p>';
  h+='<div class="row" style="margin:0 0 10px">'+
     '<button class="xq-b" data-a="exqans" aria-pressed="'+(EB.ans?"true":"false")+'">'+
     (EB.ans?esc(xt("exQsHide")):esc(xt("exQsShow")))+'</button>'+
     '<button class="xq-b" data-a="exqreset">'+esc(xt("exQsReset"))+'</button></div>';
  h+='<ol class="xq-list">';
  ls.forEach(function(sl,i){
    var q=exPreviewQ(sl),ok=exRightAnswer(q);
    h+='<li class="xq"><div class="xq-top">'+
       '<span class="xq-n">'+(i+1)+'</span>'+
       '<span class="xq-tp">'+esc(q&&q.topicName?q.topicName:exTopicName(sl[0]))+'</span>'+
       '<span class="xq-acts">'+
       '<button class="xq-b" data-a="exqroll" data-i="'+i+'">'+esc(xt("exQsSwap"))+'</button>'+
       /* המבחן חייב להישאר עם שאלה אחת לפחות, ולכן הכפתור נעלם
          ולא מוצג כבוי: כפתור שאי אפשר ללחוץ עליו מבלבל. */
       (ls.length>1?'<button class="xq-b" data-a="exqdel" data-i="'+i+'">'+esc(xt("exQsDrop"))+'</button>':"")+
       '</span></div>';
    if(q){
      h+='<div class="xq-q">'+q.ask+(q.expr?'<div class="xq-e">'+q.expr+'</div>':"")+'</div>';
      if(EB.ans&&ok)h+='<div class="xq-a"><b>'+esc(xt("exQsAns"))+'</b> '+ok.h+'</div>';
    }else h+='<div class="xq-q sub">'+esc(xt("exQsFail"))+'</div>';
    h+='</li>';
  });
  h+='</ol>';
  /* כפתור לכל נושא שנבחר, כדי שהמורה יוסיף בדיוק את מה שחסר לו
     ולא שאלה אקראית מנושא כלשהו. */
  if(tops.length){
    h+='<div class="row xq-add"><span class="sub">'+esc(xt("exQsAdd"))+'</span>';
    tops.forEach(function(id){
      h+='<button class="xq-b" data-a="exqadd" data-t="'+esc(id)+'">'+
         '<b aria-hidden="true">+</b> <span>'+esc(exTopicName(id))+'</span></button>';
    });
    h+='</div>';
  }
  return h+'</div>';
}
