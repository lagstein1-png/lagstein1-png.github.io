<style>
/* ============================================================
   דף הבית. ערכי הצבע נתונים ואינם משתנים לפי מצב — רק נדרסים
   בבלוק הכהה, כדי ששני המצבים יישארו זהים במבנה.
   כל המידות לוגיות (inset-inline, margin-inline) ולא ימין/שמאל:
   הדף מתחלף בין ארבע שפות, ושתיים מהן נכתבות לשמאל.
   ============================================================ */
:root{
  --bg:#f6f7fb; --bg-elev:#ffffff; --text:#14181f; --text-soft:#4a5464;
  --line:#e2e6ef; --brand:#2f5fd8; --brand-ink:#ffffff; --brand-soft:#eaf0ff; --radius:18px;
  --shadow:0 1px 2px rgba(20,24,31,.04),0 10px 30px -18px rgba(20,24,31,.25);
  --shadow-lg:0 2px 4px rgba(20,24,31,.05),0 22px 48px -26px rgba(20,24,31,.45);
  --c-math:#2f5fd8; --c-lang:#0f766e; --c-life:#a1520d;
  --ring:color-mix(in srgb,var(--brand) 26%,transparent);
}
:root[data-theme="dark"]{
  --bg:#0b0f17; --bg-elev:#131926; --text:#eef2f9; --text-soft:#aab4c6;
  --line:#222c3d; --brand:#7ba2ff; --brand-ink:#0b0f17; --brand-soft:#18233a;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 34px -20px rgba(0,0,0,.8);
  --shadow-lg:0 2px 4px rgba(0,0,0,.55),0 26px 54px -26px rgba(0,0,0,.9);
  --c-math:#8fb0ff; --c-lang:#6ee7d5; --c-life:#f0b866;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b0f17; --bg-elev:#131926; --text:#eef2f9; --text-soft:#aab4c6;
    --line:#222c3d; --brand:#7ba2ff; --brand-ink:#0b0f17; --brand-soft:#18233a;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 34px -20px rgba(0,0,0,.8);
    --shadow-lg:0 2px 4px rgba(0,0,0,.55),0 26px 54px -26px rgba(0,0,0,.9);
    --c-math:#8fb0ff; --c-lang:#6ee7d5; --c-life:#f0b866;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--text);
  font:400 18px/1.65 Heebo,"Segoe UI",system-ui,Arial,sans-serif;
  -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased;
}
/* Heebo אינו מכיל גליפים ערביים, והממשק הערבי נפל עד היום לגופן
   ברירת המחדל של המערכת. Noto Sans Arabic נטען מאותה בקשה, וקבצי
   הפונט עצמם נמשכים רק כשבאמת מוצג טקסט ערבי. */
html[lang="ar"] body,html[lang="ar"] .lang button,html[lang="ar"] .chip,
html[lang="ar"] .btn,html[lang="ar"] .t{
  font-family:"Noto Sans Arabic",Heebo,"Segoe UI",system-ui,Arial,sans-serif;
}
/* וגם לא קיריליים. הרוסית נפלה לאותו מקום, ונמדדה ב-7.9 — Noto Sans
   נטען מאותה בקשה, ונמשך רק כשבאמת מוצג טקסט רוסי. */
html[lang="ru"] body,html[lang="ru"] .lang button,html[lang="ru"] .chip,
html[lang="ru"] .btn,html[lang="ru"] .t{
  font-family:"Noto Sans",Heebo,"Segoe UI",system-ui,Arial,sans-serif;
}
.wrap{max-width:1080px; margin-inline:auto; padding-inline:clamp(14px,4vw,26px)}
.sr{position:absolute; inline-size:1px; block-size:1px; overflow:hidden; clip-path:inset(50%)}
.skip{
  position:absolute; inset-block-start:-100px; inset-inline-start:12px; z-index:9;
  background:var(--brand); color:var(--brand-ink); padding:12px 18px; border-radius:12px;
  text-decoration:none; font-weight:700;
}
.skip:focus{inset-block-start:12px}

/* --- סרגל עליון --- */
.topbar{
  position:sticky; inset-block-start:0; z-index:8;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px); border-block-end:1px solid var(--line);
}
.topbar .wrap{
  display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px;
  min-block-size:64px; padding-block:8px;
}
/* המעטפת היא פריט ה-flex ולא הקישור עצמו. בסיס 0 אומר לסרגל שהלוגו
   דורש רק את המילה הארוכה שלו (min-inline-size:auto), ולכן שם ארוך
   נשבר לשתי שורות בתוך המקום שנשאר במקום לדחוק את הניווט לשורה
   שנייה — ברוסית ״Учёба, которую слышно״ הוא 288px, ועם הניווט הרוסי
   זה עבר את 1080px ושבר את הסרגל. הקישור עצמו נשאר צמוד לתוכן ולא
   נמתח על כל הרווח. */
.logo-slot{flex:1 1 0; margin-inline-end:auto}
.logo{
  display:inline-flex; align-items:center; gap:11px; text-decoration:none;
  color:inherit; font-weight:800; font-size:1.05rem; line-height:1.15;
  min-block-size:44px; max-inline-size:100%;
}
/* שם האתר: ״למידה שנשמעת״, ובאנגלית Learning That Sounds — השם של
   האתר בוויקס (5.9.2026). מתחת ל-1000px השם מוסתר והסמל נשאר: נמדד
   בכרום — ב-721px נשארו לשם 16px באנגלית, וב-360px לוגו + ארבע שפות +
   מצב כהה לא נכנסו וכפתור מצב כהה נדחק לשורה משלו. הקישור שומר על
   שם נגיש ב-paint() גם כשהטקסט מוסתר. */
@media (max-width:999px){#me{display:none}}
.mark{
  inline-size:38px; block-size:38px; border-radius:12px; flex:none;
  display:grid; place-items:center; color:var(--brand-ink);
  background:linear-gradient(145deg,var(--brand),color-mix(in srgb,var(--brand) 72%,#000));
  box-shadow:0 2px 8px -2px color-mix(in srgb,var(--brand) 55%,transparent);
}
.mark svg{inline-size:22px; block-size:22px}
.nav{display:flex; flex-wrap:wrap; gap:2px}
.nav a{
  display:inline-flex; align-items:center; min-block-size:44px; padding-inline:11px;
  color:var(--text-soft); text-decoration:none; font-weight:600; font-size:.95rem;
  border-radius:10px;
}
.nav a:hover{color:var(--text); background:var(--brand-soft)}
/* בצר מסך: שורה אחת ללוגו, לשפות ולמצב הכהה, ושורה שנייה לניווט
   שנגללת לרוחב. בלי זה כפתור מצב הכהה נדחק לשורה משלו והסרגל
   הדביק אכל שליש ממסך הטלפון. */
@media (max-width:720px){
  /* מצמצמים ברוחב ולא בגובה: 44 פיקסלים הוא יעד המגע, וכל ירידה
     ממנו פוגעת קודם כול במי שהאפליקציות האלה נבנו בשבילו. */
  .topbar .wrap{min-block-size:0; gap:8px}
  .logo{font-size:.98rem; gap:8px; min-block-size:44px}
  .mark{inline-size:34px; block-size:34px; border-radius:11px}
  .mark svg{inline-size:20px; block-size:20px}
  .ico{min-block-size:44px; min-inline-size:44px; border-radius:11px}
  /* הניווט נשבר לשורה שנייה ולא נגלל: גלילה לרוחב עם פס גלילה מוסתר
     חתכה את הפריט האחרון — "צרו קשר" בעברית, Contact באנגלית — בלי
     שום רמז שיש עוד. */
  .nav{order:9; inline-size:100%; flex-wrap:wrap; gap:0 2px}
  .nav a{flex:none; min-block-size:44px; font-size:.9rem; padding-inline:8px}
}

/* --- כפתורי שפה ומצב כהה --- */
/* ארבעה לחצנים נפרדים, כל אחד לבדו, עם השם המלא של השפה — כמו בשער
   התנאים ובהגדרות של כל אפליקציה. הגלולה המחוברת עם "עב · ع · Ру · EN"
   ערבבה ארבעה כתבים בארבעה גדלים בשורה אחת, ותפריט נפתח הסתיר אותן. */
.lang{display:flex; gap:6px; flex-wrap:wrap}
.lang button{
  min-block-size:44px; padding-inline:12px; border:1px solid var(--line);
  border-radius:12px; background:var(--bg-elev); color:var(--text-soft);
  cursor:pointer; font:700 .9rem/1 Heebo,system-ui,sans-serif;
}
.lang button:hover{color:var(--text); border-color:color-mix(in srgb,var(--brand) 45%,var(--line))}
.lang button[aria-pressed="true"]{background:var(--brand); color:var(--brand-ink); border-color:var(--brand)}
/* Heebo אינו מכיל ערבית ואינו מכיל קירילית. הגופן נקבע לפי lang של
   הלחצן עצמו ולא לפי שפת הדף — "العربية" ו-"Русский" מופיעות בכל שפה.
   בלי זה הן נופלות לגופן ברירת המחדל של המערכת, שהמידות שלו אחרות,
   והלחצן נראה בגודל אחר משלושת האחרים. הכלל של html[lang=…] שלמעלה
   אינו מכסה את זה: הוא חל רק כשהדף כולו באותה שפה. */
.lang button[lang="ar"]{font-family:"Noto Sans Arabic",Heebo,system-ui,sans-serif}
.lang button[lang="ru"]{font-family:"Noto Sans",Heebo,system-ui,sans-serif}
/* בטלפון ארבעת הלחצנים בשורה משלהם, ברוחב שווה. נמדד בכרום ב-360px:
   כשחלקו שורה עם הסמל וכפתור מצב כהה כל לחצן קיבל 59px, "Русский"
   ו-"English" נחתכו, וכפתור מצב כהה נדחק לשורה משלו. שלוש שורות
   (סמל, שפות, ניווט) הן 160px — ולכן בטלפון הסרגל אינו דביק, אלא
   נגלל עם הדף. */
@media (max-width:720px){
  .topbar{position:static}
  .lang{order:8; inline-size:100%; flex:none; gap:6px; flex-wrap:nowrap}
  .lang button{flex:1; min-inline-size:0; padding-inline:6px; font-size:.86rem}
  section.blk{scroll-margin-block-start:16px}
}
@media (max-width:340px){.lang button{font-size:.8rem; padding-inline:3px}}
/* ברוסית במחשב הכול לא נכנס בשורה אחת בשום רוחב — נמדד בכרום: שם האתר
   142 + ניווט 517 + ארבעה לחצנים 337 + מצב כהה 44 + רווחים 48 = 1088,
   מול 1028 שיש בתוך הסרגל (מוגבל ל-1080). בלי זה השם נשבר לשלוש
   שורות וכפתור מצב כהה נופל מתחת. ברוסית בלבד הניווט יורד לשורה משלו. */
@media (min-width:721px){html[lang="ru"] .nav{order:9; inline-size:100%}}
[hidden]{display:none !important}
.ico{
  min-block-size:44px; min-inline-size:44px; border-radius:12px; cursor:pointer;
  border:1px solid var(--line); background:var(--bg-elev); color:var(--text-soft);
  font-size:1.05rem; line-height:1;
}

/* --- גיבור --- */
/* overflow-x:clip — הזוהר שלמטה חורג 24vw לכל צד, ובלי החיתוך הדף כולו
   נגלל לרוחב ובטלפון הסרגל העליון זז יחד איתו. clip ולא hidden, כדי
   שהציר האנכי יישאר visible. */
.hero{position:relative; padding-block:clamp(34px,7vw,72px) clamp(22px,4vw,38px); overflow-x:clip}
/* הזוהר הוא קישוט בלבד: 12% מצבע המותג על הרקע, הרחק מתחת לטקסט,
   ולכן אינו נוגע ביחס הניגודיות של אף מילה. */
.hero::before{
  content:""; position:absolute; z-index:0; pointer-events:none;
  inset-block-start:-140px; inset-inline:-24vw; block-size:520px;
  background:
    radial-gradient(46% 58% at 62% 42%,color-mix(in srgb,var(--brand) 13%,transparent),transparent 72%),
    radial-gradient(38% 52% at 22% 30%,color-mix(in srgb,var(--c-lang) 10%,transparent),transparent 70%);
}
.hero>*{position:relative; z-index:1}
.badge{
  display:inline-flex; align-items:center; gap:9px; margin:0 0 20px;
  background:var(--brand-soft); color:var(--brand); border-radius:999px;
  padding:9px 17px; font-weight:700; font-size:.88rem;
  border:1px solid color-mix(in srgb,var(--brand) 22%,transparent);
}
.badge::before{content:""; inline-size:8px; block-size:8px; border-radius:50%;
  background:var(--brand); flex:none}
.hero h1{
  margin:0; font-size:clamp(2.1rem,7vw,3.7rem); font-weight:800;
  letter-spacing:-.03em; line-height:1.1; max-inline-size:16ch;
}
.hero h1 em{font-style:normal; color:var(--brand)}
.lead{
  margin:22px 0 0; color:var(--text-soft); max-inline-size:60ch;
  font-size:clamp(1.02rem,2.5vw,1.18rem); line-height:1.7;
}
.cta{display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-block-start:28px}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  min-block-size:52px; padding-inline:26px; border-radius:14px;
  font:700 1rem/1 Heebo,system-ui,sans-serif; text-decoration:none; cursor:pointer;
  border:1px solid var(--brand); background:var(--brand); color:var(--brand-ink);
  box-shadow:0 2px 10px -3px color-mix(in srgb,var(--brand) 60%,transparent);
  transition:transform .16s ease, box-shadow .16s ease;
}
.btn:hover{transform:translateY(-1px);
  box-shadow:0 6px 18px -6px color-mix(in srgb,var(--brand) 70%,transparent)}
.btn.ghost{background:var(--bg-elev); color:var(--text); border-color:var(--line);
  box-shadow:var(--shadow)}
.btn.ghost:hover{border-color:color-mix(in srgb,var(--brand) 45%,var(--line))}
.noads{margin:14px 0 0; color:var(--text-soft); font-size:.9rem}

/* --- מספרים --- */
/* ארבע קופסאות נפרדות משכו יותר תשומת לב מהאפליקציות עצמן. לוח אחד
   עם קווי הפרדה אומר את אותם מספרים ברבע מהמשקל הוויזואלי. */
.stats{
  display:grid; grid-template-columns:repeat(4,1fr); gap:0;
  margin-block:clamp(22px,5vw,40px);
  background:var(--bg-elev); border:1px solid var(--line);
  border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden;
}
.stat{padding:20px clamp(14px,2.4vw,24px); border-inline-start:1px solid var(--line)}
.stat:first-child{border-inline-start:0}
.stat b{display:block; font-size:clamp(1.6rem,4vw,2.05rem); font-weight:800;
  letter-spacing:-.03em; color:var(--brand); font-variant-numeric:tabular-nums;
  line-height:1.15; margin-block-end:4px}
.stat span{color:var(--text-soft); font-size:.9rem; line-height:1.45; display:block}
@media (max-width:640px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat:nth-child(odd){border-inline-start:0}
  .stat:nth-child(n+3){border-block-start:1px solid var(--line)}
}

/* --- מקטע --- */
section.blk{padding-block:clamp(26px,5vw,48px); scroll-margin-block-start:78px}
.h2{margin:0; font-size:clamp(1.5rem,4vw,2.05rem); font-weight:800;
  letter-spacing:-.025em; position:relative; padding-block-start:18px}
.h2::before{content:""; position:absolute; inset-block-start:2px; inset-inline-start:0;
  inline-size:40px; block-size:4px; border-radius:999px; background:var(--brand)}
.h2s{margin:8px 0 0; color:var(--text-soft)}
.prose{margin:16px 0 0; color:var(--text-soft); max-inline-size:66ch}
/* קישור בתוך טקסט רץ ירש את הכחול של הדפדפן, שעל רקע כהה יצא
   2.04:1. --brand מוגדר לשני המצבים ומגיע ל-7.7 בכהה. */
.prose a,footer.site a[href^="mailto"]{color:var(--brand); text-underline-offset:3px}

/* --- שורת כלים --- */
.tools{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-block:22px 6px}
.search{
  flex:1 1 240px; min-inline-size:0; display:flex; align-items:center; gap:9px;
  background:var(--bg-elev); border:1px solid var(--line); border-radius:14px;
  padding-inline:14px; min-block-size:48px;
}
.search input{flex:1; min-inline-size:0; border:0; background:none; color:inherit;
  font:inherit; min-block-size:46px}
.search input:focus{outline:none}
.search:focus-within{border-color:var(--brand); box-shadow:0 0 0 3px var(--ring)}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{
  min-block-size:44px; padding-inline:16px; border-radius:999px; cursor:pointer;
  border:1px solid var(--line); background:var(--bg-elev); color:var(--text-soft);
  font:600 .95rem/1 Heebo,system-ui,sans-serif;
}
.chip[aria-pressed="true"]{background:var(--brand); border-color:var(--brand); color:var(--brand-ink)}
.count{color:var(--text-soft); font-size:.92rem; margin-block:14px 0}

/* --- כרטיסים --- */
.grid{display:grid; gap:16px; padding-block:14px 8px;
  grid-template-columns:repeat(auto-fill,minmax(276px,1fr))}
.card{
  position:relative; display:flex; flex-direction:column; gap:10px;
  background:var(--bg-elev); border:1px solid var(--line);
  border-radius:var(--radius); padding:20px 22px;
  box-shadow:var(--shadow); overflow:hidden;
  transition:transform .18s ease, box-shadow .18s ease;
}
/* פס הצבע — תמיד בצד הפתיחה של הטקסט, ולכן inset-inline-start */
.card::before{content:""; position:absolute; inset-block:0; inset-inline-start:0;
  inline-size:4px; background:var(--c)}
.card::after{content:""; position:absolute; inset:0; background:var(--c);

/* שורת הכותרת: סמל ושם זה לצד זה. הסמל מצויר ידנית ב-SVG,
   נושא את צבע התחום, ו-aria-hidden כי הוא חוזר על השם. */
.crow{position:relative; display:flex; flex-direction:column;
  align-items:flex-start; gap:13px}
.ic{
  flex:none; inline-size:44px; block-size:44px; border-radius:13px;
  display:grid; place-items:center; color:var(--c);

}
.ic svg{inline-size:25px; block-size:25px}
.card h3{margin:0; font-size:1.18rem; font-weight:700; position:relative;
  letter-spacing:-.015em; line-height:1.3; text-wrap:balance}
.card p{margin:0; color:var(--text-soft); font-size:.96rem; position:relative}
.tags{display:flex; flex-wrap:wrap; gap:6px; position:relative; margin-block-start:2px}

  border:1px solid color-mix(in srgb,var(--c) 26%,transparent);
}
/* תגית המחיר: מלאה בצבע התחום, כדי שתיבדל משאר התוויות במבט אחד */
.t.price{background:var(--c); color:var(--brand-ink); border-color:var(--c); unicode-bidi:isolate}
.go{
  margin-block-start:auto; position:relative; align-self:flex-start;
  display:inline-flex; align-items:center; gap:7px; min-block-size:44px;
  color:var(--c); font-weight:700; text-decoration:none;
}
.card a.go::after{content:""; position:absolute; inset:0}
.go .arw{
  transition:transform .18s ease, background .18s ease, color .18s ease;
  display:grid; place-items:center; inline-size:27px; block-size:27px;

.card:hover .go .arw{background:var(--c); color:var(--brand-ink)}

/* החץ מצביע לכיוון הקריאה. ב-RTL הוא מסתובב, ולא מוחלף בתו אחר —

/* שתי פעולות בכרטיס: להיכנס, ולהתקין את האפליקציה הזאת בנפרד.
   ה-::after של .go פרוש על כל שטח הכרטיס, ולכן ההתקנה חייבת לשבת
   מעליו — אחרת הלחיצה עליה נבלעת ומובילה לכניסה. */
.act{margin-block-start:auto; display:flex; flex-wrap:wrap; align-items:center; gap:8px 16px}

.get{

.get svg{inline-size:17px; block-size:17px; flex:none}
.get:hover{color:var(--c); border-color:color-mix(in srgb,var(--c) 45%,transparent)}
html[dir="ltr"] .arw{transform:scaleX(-1)}

/* --- איך זה עובד --- */

<script>
/* ============================================================
   מצב הדגמה — נכנס אך ורק דרך ?demo=1 בכתובת.
   ------------------------------------------------------------
   התסריט הוא נתון, לא קוד שפזור במסכים: כל פריט אומר מה נכתב
   בכתוביות (subtitle), מה נעשה על המסך (action) וכמה זמן הצופה
   נשאר עם המסך הזה (duration, באלפיות שנייה).

   ההדגמה מפעילה את האפליקציה האמיתית — היא לוחצת על אותם
   כפתורים שהמשתמש לוחץ עליהם. אין כאן מסך מזויף ואין תוכן
   שנכתב במיוחד להדגמה, ולכן היא גם לא יכולה להראות משהו
   שהאפליקציה לא באמת עושה.

   בלי ?demo=1 שום שורה כאן אינה רצה: המשתנים מוגדרים ונשארים
   בלי שימוש, לא נרשם אף מאזין אירועים, ולא נוסף דבר למסך.
   ============================================================ */
var DEMO_ON=/(^|[?&])demo=1(&|$)/.test(location.search||"");

var DEMO_SCRIPT=[
  {subtitle:"יהושע לגשטיין — תשע אפליקציות לימוד. הכול נפתח בדפדפן, בלי הורדה, בלי הרשמה ובלי עלות.",
   action:function(){window.scrollTo(0,0)}, duration:4200},

  {subtitle:"סינון לפי תחום. כאן רק המתמטיקה — מארבע פעולות החשבון ועד השנה השלישית בתואר.",
   action:function(){demoTap('#chips [data-c="math"]')}, duration:4400},

  {subtitle:"וכאן הכלים לחיים: מקריא קולי ותאוריה לנהיגה.",
   action:function(){demoTap('#chips [data-c="life"]')}, duration:3800},

  {subtitle:"חיפוש חופשי. הוא רץ גם על מילות מפתח בעברית, כך שמי שמחפש ״חדו״א״ מוצא גם כשהממשק אנגלי.",
   action:function(){demoTap('#chips [data-c="all"]');demoType("#q","היסטוריה")}, duration:5200},

  {subtitle:"מנקים, וכל האפליקציות חוזרות.",
   action:function(){var e=demoEl("#q");if(e){e.value="";e.dispatchEvent(new Event("input",{bubbles:true}))}}, duration:2800},

  {subtitle:"ארבע שפות ממשק. אותו דף ואותו סדר — רק השפה והכיוון מתחלפים.",
   action:function(){demoTap('#lang [data-l="ru"]')}, duration:4400},

  {subtitle:"ערבית נכתבת לימין, רוסית ואנגלית לשמאל. הפריסה בנויה במידות לוגיות, ולכן היא לא נשברת.",
   action:function(){demoTap('#lang [data-l="ar"]')}, duration:4600},

  {subtitle:"וחזרה לעברית.",
   action:function(){demoTap('#lang [data-l="he"]')}, duration:2800},

  {subtitle:"מצב כהה, לפי העדפת המערכת או בבחירה ידנית.",
   action:function(){demoTap("#theme")}, duration:3600},

  {subtitle:"וחזרה למצב בהיר.",
   action:function(){demoTap("#theme")}, duration:2800},

  {subtitle:"איך זה עובד: נכנסים מהדפדפן, בוחרים נושא ורמה, וההתקדמות נשמרת במכשיר בלבד.",
   action:function(){demoShow("#how")}, duration:5000},

  {subtitle:"זהו. כניסה לכל אפליקציה — ישירות מהכרטיס שלה.",
   action:function(){demoShow("#apps")}, duration:4200}
];

/* --- מנוע ההדגמה. הקוד כאן זהה בכל האפליקציות; רק DEMO_SCRIPT משתנה. --- */
var DEMO={on:false,i:0,timer:null,extra:[],bar:null,txt:null,step:null,fill:null,btn:null};

/* עוזרים לתסריט. כולם מחזירים false כשהאיבר אינו על המסך, כדי
   שצעד שלא מצא את מה שחיפש ידלג ולא יפיל את ההדגמה כולה. */
function demoEl(s){return typeof s==="string"?document.querySelector(s):s}
function demoShow(s){
  var e=demoEl(s); if(!e)return false;
  try{e.scrollIntoView({behavior:"smooth",block:"center"})}catch(err){try{e.scrollIntoView()}catch(err2){}}
  return true;
}
/* מדגיש את האיבר, ורק אז לוחץ — צופה שלא ראה לאן נלחץ לא הבין
   מה קרה. לכן אין צעד קצר מ-1200 אלפיות בתסריטים. */
function demoTap(s){
  var e=demoEl(s); if(!e||e.disabled)return false;
  demoShow(e);
  e.classList.add("demo-tap");
  DEMO.extra.push(setTimeout(function(){
    e.classList.remove("demo-tap");
    /* המסך מצטייר מחדש כל הזמן. אם האיבר שסומן כבר אינו במסמך,
       מחפשים אותו שוב לפי אותו בורר — לחיצה על איבר מת אינה
       עושה דבר, וזה בדיוק צעד שנראה כאילו נתקע. */
    var live=(typeof s==="string"&&!document.contains(e))?demoEl(s):e;
    if(DEMO.on&&live&&!live.disabled&&document.contains(live))try{live.click()}catch(err){}
  },430));
  return true;
}
function demoClick(s){
  var e=demoEl(s); if(!e||e.disabled)return false;
  try{e.click()}catch(err){return false}
  return true;
}
/* הקלדה אות אחר אות, עם אירוע input אמיתי — שדה חיפוש שמאזין
   ל-input לא היה מגיב להשמה ישירה ל-value. */
function demoType(s,text){
  var e=demoEl(s); if(!e)return false;
  demoShow(e); try{e.focus()}catch(err){}
  e.value=""; var i=0;
  var t=setInterval(function(){
    if(!DEMO.on||!e.parentNode){clearInterval(t);return}
    e.value=String(text).slice(0,++i);
    e.dispatchEvent(new Event("input",{bubbles:true}));
    if(i>=String(text).length)clearInterval(t);
  },85);
  DEMO.extra.push(t);
  return true;
}
function demoQuiet(){
  try{if(window.speechSynthesis)speechSynthesis.cancel()}catch(e){}
  try{if(typeof stopSpeak==="function")stopSpeak()}catch(e){}
}

/* --- שכבת הכתוביות וכפתור ההפעלה --- */
var DEMO_CSS=''+
'.demo-tap{outline:3px solid #ffd23f!important;outline-offset:3px;'+
'  box-shadow:0 0 0 7px rgba(255,210,63,.30)!important;border-radius:12px}'+
'#demo-start{position:fixed;z-index:2147481000;'+
'  inset-block-end:calc(14px + env(safe-area-inset-bottom));'+
'  inset-inline-start:calc(14px + env(safe-area-inset-left));'+
'  display:flex;align-items:center;gap:.5rem;font:inherit;font-size:.92rem;font-weight:700;'+
'  background:#0d1220;color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:999px;'+
'  padding:.7rem 1.15rem;cursor:pointer;box-shadow:0 10px 26px -8px rgba(0,0,0,.55)}'+
'#demo-start[hidden],#demo-bar[hidden]{display:none!important}'+
'#demo-bar{position:fixed;z-index:2147481000;inset-inline:0;'+
'  inset-block-end:calc(14px + env(safe-area-inset-bottom));'+
'  display:flex;justify-content:center;padding:0 14px;pointer-events:none}'+
'#demo-sub{max-width:46rem;width:100%;background:rgba(9,13,22,.93);color:#f4f7ff;'+
'  border:1px solid rgba(255,255,255,.14);border-radius:16px;overflow:hidden;'+
'  box-shadow:0 18px 50px -16px rgba(0,0,0,.75);backdrop-filter:blur(4px)}'+
'#demo-txt{margin:0;padding:14px 18px 10px;font:inherit;font-size:clamp(1rem,2.6vw,1.22rem);'+
'  font-weight:600;line-height:1.5;text-align:center}'+
'#demo-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;'+
'  padding:0 14px 10px;font-size:.78rem;color:#aab6cc}'+
'#demo-exit{pointer-events:auto;font:inherit;font-size:.78rem;font-weight:700;cursor:pointer;'+
'  background:transparent;color:#aab6cc;border:1px solid rgba(255,255,255,.22);'+
'  border-radius:999px;padding:.3rem .7rem}'+
'#demo-prog{height:3px;background:rgba(255,255,255,.12)}'+
'#demo-prog i{display:block;height:100%;width:0;background:#ffd23f}'+
'html.demo-running .lg-install{display:none!important}'+
'@media (prefers-reduced-motion:reduce){#demo-prog i{transition:none!important}}';

function demoMountUI(){
  var st=document.createElement("style");
  st.id="demo-style"; st.textContent=DEMO_CSS;
  (document.head||document.documentElement).appendChild(st);

  var b=document.createElement("button");
  b.id="demo-start"; b.type="button";
  b.innerHTML='<span aria-hidden="true">▶</span><span>התחל הדגמה</span>';
  b.addEventListener("click",demoStart);
  document.body.appendChild(b);

  var bar=document.createElement("div");
  bar.id="demo-bar"; bar.hidden=true;
  bar.setAttribute("role","status");
  bar.setAttribute("aria-live","polite");
  bar.innerHTML='<div id="demo-sub"><p id="demo-txt"></p>'+
    '<div id="demo-meta"><span id="demo-step"></span>'+
    '<button id="demo-exit" type="button">יציאה · ESC</button></div>'+
    '<div id="demo-prog"><i></i></div></div>';
  document.body.appendChild(bar);

  DEMO.btn=b; DEMO.bar=bar;
  DEMO.txt=document.getElementById("demo-txt");
  DEMO.step=document.getElementById("demo-step");
  DEMO.fill=bar.querySelector("#demo-prog i");
  document.getElementById("demo-exit").addEventListener("click",function(){demoStop()});
  document.addEventListener("keydown",demoKey,true);
}

/* ESC יוצא. הקשבה בשלב הלכידה, כדי שמסך שכבר מטפל ב-Escape
   לא יבלע את המקש לפני שההדגמה ראתה אותו. */
function demoKey(e){
  if(!DEMO.on)return;
  if(e.key==="Escape"||e.keyCode===27){
    e.preventDefault(); e.stopPropagation();
    demoStop();
  }
}

function demoStart(){
  if(DEMO.on)return;
  DEMO.on=true; DEMO.i=0;
  DEMO.btn.hidden=true; DEMO.bar.hidden=false;
  document.documentElement.classList.add("demo-running");
  demoNext();
}

function demoNext(){

function applyTheme(v){
  var r=document.documentElement;
  if(v)r.setAttribute("data-theme",v); else r.removeAttribute("data-theme");
  var dark=v?v==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
  var b=$("#theme");
  b.textContent=dark?"☀":"☾";
  b.setAttribute("aria-label",dark?S.light:S.dark);
  b.setAttribute("aria-pressed",dark?"true":"false");
}
$("#theme").addEventListener("click",function(){
  var dark=document.documentElement.getAttribute("data-theme")==="dark"||
           (!savedTheme()&&matchMedia("(prefers-color-scheme:dark)").matches);
  var next=dark?"light":"dark";
  try{localStorage.setItem(TKEY,next)}catch(e){}
  applyTheme(next);
});

        '<a class="go" href="'+(a.u||("/"+a.id+"/"))+'">'+esc(S.enter)+
          '<span class="arw" aria-hidden="true">←</span></a>'+
        /* שם נגיש נפרד לכל אחת: "התקנה" לבדו חוזר זהה בשתים-עשרה
           כרטיסים, ולקורא מסך זו רשימה של מילים זהות. */
        '<a class="get" href="'+installUrl(a.u||("/"+a.id+"/"))+'" '+
          'aria-label="'+esc(S.getAppOf.replace("{n}",a.n[LG]))+'">'+
          IC(DLIC)+'<span>'+esc(S.getApp)+'</span></a>'+
      '</div>'+
    '</article>';
  }).join("");
  $("#count").textContent=S.count.replace("{n}",list.length).replace("{t}",APPS.length);
  $("#empty").textContent=S.none;
  $("#empty").hidden=list.length>0;
}

function paint(){
  S=TR[LG];
  var r=document.documentElement;
  r.setAttribute("lang",LG); r.setAttribute("dir",S.dirv);
  document.title=S.me+" — "+S.title;

  $("#me").textContent=S.me;
  $(".logo").setAttribute("aria-label",S.me);
  $("#skip").textContent=S.nApps;
  /* ״מחירים״ הוא דף נפרד (/pricing/), ולכן הכתובת מלאה ולא עוגן. */
  $("#nav").innerHTML=[["#apps","nApps"],["/pricing/","nPricing"],["#how","nHow"],["#about","nAbout"],["#contact","nContact"]]
    .map(function(x){return '<a href="'+x[0]+'">'+esc(S[x[1]])+"</a>"}).join("");
  $("#badge").textContent=S.badge;
  /* שלושה חלקים ולא משפט אחד: המילה האמצעית צבועה, והחלוקה
     לחלקים מאפשרת לכל שפה לשמור על סדר המילים שלה. */
  $("#h1").innerHTML=esc(S.h1a)+" <em>"+esc(S.h1b)+"</em> "+esc(S.h1c);
  $("#lead").textContent=S.lead;
  $("#ctaApps").textContent=S.ctaApps;
  $("#ctaContact").textContent=S.ctaContact;
  $("#install").textContent=S.install;
  $("#installLink").textContent=S.installLink;
  $("#installT").textContent=S.install;
  $("#installLead").textContent=S.installLead;
  $("#installSteps").innerHTML=["installAndroid","installIos","installPc"].map(function(k,i){
    return '<div class="step"><b dir="ltr">'+(i+1)+"</b>"+esc(S[k])+"</div>"}).join("");
  $("#noads").textContent=S.noAds;
  /* כרום על ווינדוס רואה רק את קולות המערכת, ובעברית יש שם קול אחד,
     גברי. Edge נושא קולות טבעיים משלו, ולכן ההקראה בכל האפליקציות
     טובה בו יותר. הסכימה microsoft-edge: פותחת את אותה כתובת ב-Edge
     מתוך כל דפדפן בווינדוס — אותו קישור שיש בכל אפליקציה, וכאן הוא
     מוצג לפני שנכנסים. מחוץ לווינדוס, ובתוך Edge, השורה נסתרת. */
  var ed=$("#edge");
  ed.hidden=!isWinNotEdge();
  ed.innerHTML=esc(S.edgeHas)+" <a href=\"microsoft-edge:"+esc(location.href.split("#")[0])+
    "\" style=\"font-weight:700;color:inherit\">"+esc(S.openEdge)+"</a> · <a href=\"#voices\">"+esc(S.voicesWhy)+"</a>";
  $("#voicesT").textContent=S.voicesT;
  $("#voicesLead").textContent=S.voicesLead;
  $("#voicesSteps").innerHTML=["voicesWin","voicesAndroid","voicesApple"].map(function(k,i){
    return '<div class="step"><b dir="ltr">'+(i+1)+"</b>"+esc(S[k])+"</div>"}).join("");
  /* הקישור נשאר קישור microsoft-edge: רק בווינדוס מחוץ ל-Edge — במק,
     באנדרואיד ובאייפון הוא לא פותח כלום. בתוך Edge בווינדוס: משפט
     אחד במקום קישור. בשאר המערכות הפסקה נסתרת וההסבר לבדו נשאר. */
  var isWin=/Windows/i.test(navigator.userAgent||""), vc=$("#voicesCta");
  vc.hidden=!isWin;
  vc.innerHTML=isWinNotEdge()
    ? '<a class="btn" href="microsoft-edge:'+esc(location.href.split("#")[0])+'">'+esc(S.openEdge)+"</a>"
    : '<p class="prose" style="margin:0">'+esc(S.inEdge)+"</p>";
  /* מספר החינמיות נגזר משדה price ב-DATA.APPS, ולא נכתב ביד. */
  $("#stats").innerHTML=[[String(APPS.length),S.s1],[String(LANGS.length),S.s2],
                         ["100%",S.s3],[String(APPS.filter(function(a){return a.price===0}).length),S.s4]]
    .map(function(x){return '<div class="stat"><b dir="ltr">'+esc(x[0])+"</b><span>"+
      esc(x[1])+"</span></div>"}).join("");
  $("#ttl").textContent=S.title;
  $("#sub").textContent=S.sub;
  $("#qlab").textContent=S.searchLabel;
  $("#q").placeholder=S.searchPh;
  $("#q").setAttribute("aria-label",S.searchLabel);
  $("#chips").setAttribute("aria-label",S.catLabel);
  $("#chips").innerHTML=CATS.map(function(c){
    return '<button class="chip" type="button" data-c="'+c+'" aria-pressed="'+
      (c===cat)+'">'+esc(S[c])+"</button>"}).join("");
  $("#howT").textContent=S.howT;
  $("#steps").innerHTML=[1,2,3].map(function(i){
    return '<div class="step"><b dir="ltr">'+i+"</b>"+esc(S["how"+i])+"</div>"}).join("");
  $("#aboutT").textContent=S.aboutT;
  $("#aboutP").textContent=S.about;
  $("#contactT").textContent=S.contactT;
  $("#contactL").textContent=S.contactL+" ";
  $("#foot").textContent=S.foot;
  $("#terms").textContent=S.terms;
  $("#lang").setAttribute("aria-label",S.langLabel);
  $("#lang").innerHTML=LANGS.map(function(x){
    return '<button type="button" data-l="'+x[0]+'" aria-pressed="'+(x[0]===LG)+
      '" lang="'+x[0]+'">'+esc(x[1])+"</button>"}).join("");
  applyTheme(savedTheme());
  draw();
}

/* --- הוספה למסך הבית --- */
/* המנגנון עצמו יושב ב-legal/protect.js, המשותף לכל האפליקציות: סרגל
   צף שנעלם לתמיד אחרי ✕ אחד. הכפתור כאן הוא דרך קבועה לאותה פעולה
   — LEGAL.install() פותח את דיאלוג ההתקנה של הדפדפן, ובספארי את
   ההוראות. אין כפתור כשאין דרך להתקין, וכשהדף כבר רץ כאפליקציה.
   protect.js נטען אחרי הסקריפט הזה, ולכן הבדיקה נדחית ל-load ולסוף
   התור של beforeinstallprompt. */
function showInstall(){
  var L=window.LEGAL;
  var standalone=navigator.standalone===true||matchMedia("(display-mode:standalone)").matches;
  $("#install").hidden=standalone||!(L&&L.canInstall&&L.canInstall());
}
window.addEventListener("load",showInstall);
window.addEventListener("beforeinstallprompt",function(){setTimeout(showInstall,0)});
window.addEventListener("appinstalled",function(){$("#install").hidden=true});
$("#install").addEventListener("click",function(){
  var L=window.LEGAL; if(L&&L.install)L.install();
  showInstall();
});

function boot(){
  document.addEventListener("click",function(e){
    var l=e.target.closest("#lang [data-l]");
    if(l){ LG=l.getAttribute("data-l");
      try{localStorage.setItem(LKEY,LG)}catch(err){}
      paint(); return; }
    var b=e.target.closest("#chips [data-c]");
    if(b){ cat=b.getAttribute("data-c");
      Array.prototype.forEach.call($("#chips").children,function(x){
        x.setAttribute("aria-pressed",String(x.getAttribute("data-c")===cat))});
      draw(); }
  });
  $("#q").addEventListener("input",function(){q=this.value.trim().toLowerCase();draw()});
  /* שער התנאים נפתח לפני הכול ויש בו בורר שפה משלו. בלי המאזין הזה
     המשתמש בוחר בשער אנגלית, מאשר, ונוחת על דף בית בעברית. */
  window.addEventListener("legal:lang",function(e){
    var k=e&&e.detail; if(!k||!TR[k]||k===LG)return;
    LG=k; try{localStorage.setItem(LKEY,LG)}catch(err){}
    paint();
  });
  paint();
}
boot();
