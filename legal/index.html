<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>תנאי שימוש וזכויות יוצרים</title>
<meta name="description" content="תנאי השימוש וזכויות היוצרים של אפליקציות הלימוד של יהושע לגשטיין — בעברית, ערבית, רוסית ואנגלית." />
<meta name="theme-color" content="#111827" />
<meta name="copyright" content="© 2026 יהושע לגשטיין. כל הזכויות שמורות." />
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#111827;--muted:#4b5563;--line:#e5e7eb}
@media(prefers-color-scheme:dark){
  :root{--bg:#0e1117;--card:#161b26;--ink:#e8ecf4;--muted:#9aa4ba;--line:#28313f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.7;
  font-family:"Heebo","Rubik",system-ui,"Segoe UI",Arial,sans-serif;font-size:17px}
.wrap{max-width:46rem;margin:0 auto;padding:clamp(18px,4vw,40px)}
h1{font-size:clamp(1.5rem,5vw,2rem);margin:0 0 .3rem;line-height:1.25}
h2{font-size:1.06rem;margin:1.5rem 0 .2rem}
p{margin:0 0 .2rem;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:clamp(16px,3.5vw,28px);margin-top:16px}
.langs{display:flex;gap:.5rem;flex-wrap:wrap;margin:1rem 0 0}
.langs button{font:inherit;font-weight:700;cursor:pointer;border:1px solid var(--line);
  background:var(--card);color:var(--ink);border-radius:999px;padding:.5rem 1rem;min-height:2.8rem}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.meta{font-size:.85rem;color:var(--muted);margin-top:1.4rem;
  border-top:1px solid var(--line);padding-top:1rem}
a{color:inherit}
:focus-visible{outline:3px solid #2563eb;outline-offset:2px;border-radius:8px}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="ttl">תנאי שימוש וזכויות יוצרים</h1>
  <p id="intro"></p>
  <div class="langs" id="langs"></div>
  <div class="card" id="body"></div>
  <p class="meta" id="meta"></p>
</div>
<script src="terms.js"></script>
<script>
(function(){
  var L=window.LEGAL, cur="he";
  function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
  function owner(){return cur==="he"?L.owner:L.ownerEn}
  function fill(s){return String(s).replace(/\{owner\}/g,owner()).replace(/\{email\}/g,L.email)}
  function draw(){
    var t=L[cur];
    document.documentElement.lang=cur;
    document.documentElement.dir=t.dir;
    document.title=t.title;
    document.getElementById("ttl").textContent=t.title;
    document.getElementById("intro").textContent=t.intro;
    document.getElementById("body").innerHTML=t.sections.map(function(s){
      return "<h2>"+esc(fill(s[0]))+"</h2><p>"+esc(fill(s[1]))+"</p>";
    }).join("");
    document.getElementById("meta").innerHTML=
      esc(L.version)+" · "+esc(L.updated)+" · © "+new Date().getFullYear()+" "+esc(owner())+
      ' · <a href="mailto:'+esc(L.email)+'">'+esc(L.email)+"</a>";
    [].forEach.call(document.querySelectorAll("#langs button"),function(b){
      b.setAttribute("aria-pressed", b.dataset.l===cur ? "true":"false");
    });
  }
  document.getElementById("langs").innerHTML=
    [["he","עברית"],["ar","العربية"],["ru","Русский"],["en","English"]].map(function(x){
      return '<button data-l="'+x[0]+'" lang="'+x[0]+'">'+x[1]+'</button>';
    }).join("");
  document.getElementById("langs").addEventListener("click",function(e){
    var b=e.target.closest("button"); if(!b)return; cur=b.dataset.l; draw();
  });
  /* שפת הדפדפן קודם, כדי שמי שאינו קורא עברית לא ייתקל בעברית */
  var pref=(navigator.languages||[navigator.language||"he"]);
  for(var i=0;i<pref.length;i++){
    var c=String(pref[i]).toLowerCase().split("-")[0];
    if(c==="iw")c="he";
    if(L[c]){cur=c;break}
  }
  draw();
})();
</script>
</body>
</html>
