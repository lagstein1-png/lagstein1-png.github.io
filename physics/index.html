var LESSONS={
kin:[
 ST_("מהירות אומרת כמה מרחק עוברים בכל שנייה. מכונית ב-20 m/s עוברת 20 מטרים בשנייה. תאוצה אומרת כמה המהירות משתנה בכל שנייה.","السرعة تقول كم مسافة نقطع في كل ثانية. سيارة بسرعة 20 m/s تقطع 20 مترًا في الثانية. والتسارع يقول كم تتغير السرعة في كل ثانية.","Скорость показывает, какой путь проходят за секунду. Машина со скоростью 20 m/s проходит 20 метров в секунду. Ускорение показывает, насколько меняется скорость за секунду.","Speed tells how far you go each second. A car at 20 m/s covers 20 meters every second. Acceleration tells how much the speed changes each second."),
 ST_("בתאוצה קבועה a המהירות גדלה בצעדים שווים: v = v₀ + a·t. אם מתחילים ממנוחה בתאוצה 3 m/s², אחרי 4 שניות המהירות 12 m/s.","مع تسارع ثابت a تزداد السرعة بخطوات متساوية: v = v₀ + a·t. إذا بدأنا من السكون بتسارع 3 m/s² فبعد 4 ثوانٍ تصبح السرعة 12 m/s.","При постоянном ускорении a скорость растёт равными шагами: v = v₀ + a·t. Из покоя с ускорением 3 m/s² через 4 с скорость 12 m/s.","With constant acceleration a the speed grows in equal steps: v = v₀ + a·t. From rest at 3 m/s², after 4 seconds the speed is 12 m/s."),
 ST_("בגרף מהירות־זמן המרחק הוא השטח מתחת לגרף. המרחק בתאוצה קבועה: x = v₀·t + ½·a·t².","في رسم السرعة والزمن المسافة هي المساحة تحت الرسم. المسافة مع تسارع ثابت: x = v₀·t + ½·a·t².","На графике скорости путь — это площадь под графиком. Путь при постоянном ускорении: x = v₀·t + ½·a·t².","In a velocity-time graph the distance is the area under the graph. With constant acceleration: x = v₀·t + ½·a·t².",function(){return vtVis(0,12,4)}),
 ST_("בנפילה חופשית כל הגופים מאיצים באותה תאוצה g = 10 m/s². אחרי שנייה 10 m/s, אחרי שתיים 20 m/s. גובה הנפילה: h = ½·g·t² = 5·t².","في السقوط الحر تتسارع كل الأجسام بالتسارع نفسه g = 10 m/s². بعد ثانية 10 m/s وبعد ثانيتين 20 m/s. ارتفاع السقوط: h = ½·g·t² = 5·t².","При свободном падении все тела ускоряются одинаково: g = 10 m/s². Через секунду 10 m/s, через две 20 m/s. Высота падения: h = ½·g·t² = 5·t².","In free fall all bodies accelerate the same, g = 10 m/s². After 1 second 10 m/s, after 2 seconds 20 m/s. Fall height: h = ½·g·t² = 5·t².")],
newton:[
 ST_("כוח הוא דחיפה או משיכה. הוא נמדד בניוטון (N). כשאין כוח שקול, גוף במנוחה נשאר במנוחה וגוף נע ממשיך בקו ישר במהירות קבועה. זה החוק הראשון.","القوة دفع أو سحب. تقاس بالنيوتن (N). عندما لا توجد قوة محصلة يبقى الجسم الساكن ساكنًا ويستمر الجسم المتحرك في خط مستقيم بسرعة ثابتة. هذا القانون الأول.","Сила — это толчок или притяжение. Измеряется в ньютонах (N). Если равнодействующей нет, покоящееся тело остаётся в покое, а движущееся продолжает прямолинейно с постоянной скоростью. Это первый закон.","A force is a push or a pull, measured in newtons (N). With no net force, a body at rest stays at rest and a moving body keeps going straight at constant speed. That is the first law."),
 ST_("החוק השני: הכוח השקול גורם לתאוצה. F = m · a. אותו כוח על גוף כבד נותן תאוצה קטנה יותר.","القانون الثاني: القوة المحصلة تسبب تسارعًا. F = m · a. نفس القوة على جسم أثقل تعطي تسارعًا أصغر.","Второй закон: равнодействующая вызывает ускорение. F = m · a. Та же сила даёт тяжёлому телу меньшее ускорение.","The second law: the net force causes acceleration. F = m · a. The same force gives a heavy body less acceleration.",function(){return forceVis(20,8,3)}),
 ST_("קודם מוצאים כוח שקול: כוחות לאותו כיוון מחברים, בכיוונים הפוכים מחסרים. 20 N ימינה ו-8 N שמאלה נותנים 12 N ימינה. משקל: W = m·g.","أولًا نجد القوة المحصلة: نجمع القوى في الاتجاه نفسه ونطرح المتعاكسة. 20 N يمينًا و8 N يسارًا تعطي 12 N يمينًا. الوزن: W = m·g.","Сначала находим равнодействующую: силы одного направления складываем, противоположных вычитаем. 20 N вправо и 8 N влево дают 12 N вправо. Вес: W = m·g.","First find the net force: add forces in the same direction, subtract opposite ones. 20 N right and 8 N left give 12 N right. Weight: W = m·g."),
 ST_("החוק השלישי: כשגוף א׳ מפעיל כוח על גוף ב׳, גוף ב׳ מפעיל על א׳ כוח שווה והפוך. שני הכוחות פועלים על גופים שונים. במישור משופע הרכיב לאורך המישור הוא m·g·sin θ.","القانون الثالث: عندما يؤثر جسم أ بقوة على جسم ب يؤثر ب على أ بقوة مساوية ومعاكسة. القوتان تؤثران على جسمين مختلفين. على المستوى المائل المركّبة على امتداد المستوى هي m·g·sin θ.","Третий закон: если тело A действует на тело B с силой, то B действует на A с равной и противоположной силой. Силы приложены к разным телам. На наклонной плоскости составляющая вдоль плоскости равна m·g·sin θ.","The third law: if body A pushes body B, B pushes A with an equal and opposite force. The two forces act on different bodies. On an incline the component along the slope is m·g·sin θ.",function(){return inclineVis(4,30)})],
energy:[
 ST_("כשכוח מזיז גוף, הוא עושה עבודה: W = F·d (הכוח בכיוון התנועה). היחידה ג׳אול (J). 10 N לאורך 3 m הם 30 J.","عندما تحرك قوة جسمًا فهي تبذل شغلًا: W = F·d (القوة باتجاه الحركة). الوحدة جول (J). 10 N على طول 3 m تساوي 30 J.","Когда сила перемещает тело, она совершает работу: W = F·d (сила вдоль движения). Единица — джоуль (J). 10 N на 3 m дают 30 J.","When a force moves a body it does work: W = F·d (force along the motion). The unit is the joule (J). 10 N over 3 m is 30 J."),
 ST_("אנרגיה קינטית היא אנרגיית תנועה: Ek = ½·m·v². כשהמהירות מוכפלת פי 2, האנרגיה גדלה פי 4.","الطاقة الحركية طاقة الحركة: Ek = ½·m·v². عندما تتضاعف السرعة مرتين تزداد الطاقة 4 مرات.","Кинетическая энергия — энергия движения: Ek = ½·m·v². Если скорость вдвое больше, энергия вчетверо больше.","Kinetic energy is the energy of motion: Ek = ½·m·v². Double the speed and the energy becomes 4 times bigger."),
 ST_("אנרגיה פוטנציאלית כובדית: Ep = m·g·h. גוף גבוה יותר שומר יותר אנרגיה. כשהוא נופל, האנרגיה הזאת הופכת לקינטית.","طاقة الوضع الجاذبية: Ep = m·g·h. الجسم الأعلى يختزن طاقة أكبر. عندما يسقط تتحول هذه الطاقة إلى حركية.","Потенциальная энергия тяжести: Ep = m·g·h. Чем выше тело, тем больше энергии. При падении она переходит в кинетическую.","Gravitational potential energy: Ep = m·g·h. A higher body stores more energy. When it falls, that energy turns into kinetic energy."),
 ST_("בלי חיכוך האנרגיה הכוללת נשמרת: Ek + Ep קבוע. נפילה מגובה h נותנת v = √(2·g·h). הספק הוא קצב העבודה: P = W ÷ t, ביחידות ואט (W).","بدون احتكاك تبقى الطاقة الكلية ثابتة: Ek + Ep ثابتة. السقوط من ارتفاع h يعطي v = √(2·g·h). الاستطاعة هي معدل الشغل: P = W ÷ t بوحدة الواط (W).","Без трения полная энергия сохраняется: Ek + Ep постоянна. Падение с высоты h даёт v = √(2·g·h). Мощность — это скорость работы: P = W ÷ t, в ваттах (W).","Without friction the total energy is conserved: Ek + Ep stays constant. A fall from height h gives v = √(2·g·h). Power is the rate of work: P = W ÷ t, in watts (W).")],
mom:[
 ST_("תנע הוא כמה קשה לעצור גוף נע: p = m·v. יחידה kg·m/s. משאית איטית יכולה להיות עם תנע גדול כמו מכונית מהירה.","الزخم هو مدى صعوبة إيقاف جسم متحرك: p = m·v. الوحدة kg·m/s. شاحنة بطيئة قد يكون زخمها كبيرًا مثل سيارة سريعة.","Импульс показывает, насколько трудно остановить движущееся тело: p = m·v. Единица kg·m/s. Медленный грузовик может иметь такой же импульс, как быстрая машина.","Momentum tells how hard it is to stop a moving body: p = m·v. Unit: kg·m/s. A slow truck can have as much momentum as a fast car."),
 ST_("כוח שפועל פרק זמן משנה תנע: F·Δt = Δp. זה המתקף. לכן כשנוחתים מקפיצה מכופפים ברכיים: הזמן ארוך יותר והכוח קטן יותר.","القوة التي تؤثر خلال زمن تغيّر الزخم: F·Δt = Δp. هذا هو الدفع. لذلك نثني الركبتين عند الهبوط: الزمن أطول والقوة أصغر.","Сила, действующая некоторое время, меняет импульс: F·Δt = Δp. Это импульс силы. Поэтому при приземлении сгибают колени: время дольше, сила меньше.","A force acting for some time changes momentum: F·Δt = Δp. This is the impulse. That is why we bend our knees when landing: longer time, smaller force."),
 ST_("במערכת סגורה התנע הכולל נשמר: סכום התנעים לפני שווה לסכום אחרי. בהתנגשות פלסטית שני הגופים נדבקים: m₁·v₁ = (m₁ + m₂)·V.","في نظام مغلق يُحفظ الزخم الكلي: مجموع الزخوم قبل يساوي مجموعها بعد. في التصادم عديم المرونة يلتصق الجسمان: m₁·v₁ = (m₁ + m₂)·V.","В замкнутой системе полный импульс сохраняется: сумма импульсов до равна сумме после. При слипании тел: m₁·v₁ = (m₁ + m₂)·V.","In a closed system total momentum is conserved: the sum before equals the sum after. In a sticky collision: m₁·v₁ = (m₁ + m₂)·V."),
 ST_("ברתיעה ובפיצוץ התנע ההתחלתי אפס, ולכן הגופים נעים בכיוונים הפוכים עם תנעים שווים בגודלם: m₁·v₁ = m₂·v₂. לגוף הקל יש מהירות גדולה יותר.","في الارتداد والانفجار يكون الزخم الابتدائي صفرًا، فيتحرك الجسمان في اتجاهين متعاكسين بزخمين متساويين في المقدار: m₁·v₁ = m₂·v₂. الجسم الأخف أسرع.","При отдаче и взрыве начальный импульс равен нулю, поэтому тела движутся в противоположные стороны с равными по модулю импульсами: m₁·v₁ = m₂·v₂. Лёгкое тело быстрее.","In recoil and explosions the starting momentum is zero, so the bodies move in opposite directions with equal momenta: m₁·v₁ = m₂·v₂. The lighter body moves faster.")],
circ:[
 ST_("בתנועה מעגלית קבועה הגוף חוזר על עצמו. זמן מחזור T הוא הזמן לסיבוב אחד. תדירות f היא כמה סיבובים בשנייה: f = 1 ÷ T.","في الحركة الدائرية المنتظمة يكرر الجسم حركته. زمن الدورة T هو زمن دورة واحدة. التردد f هو عدد الدورات في الثانية: f = 1 ÷ T.","При равномерном движении по окружности тело повторяет движение. Период T — время одного оборота. Частота f — число оборотов в секунду: f = 1 ÷ T.","In uniform circular motion the body repeats itself. The period T is the time for one turn. The frequency f is turns per second: f = 1 ÷ T."),
 ST_("גם כשהמהירות קבועה, הכיוון משתנה, ולכן יש תאוצה. התאוצה הצנטריפטלית מכוונת למרכז: a = v² ÷ r.","حتى عندما تكون السرعة ثابتة يتغير الاتجاه، لذلك يوجد تسارع. التسارع المركزي يتجه نحو المركز: a = v² ÷ r.","Даже при постоянной скорости направление меняется, поэтому есть ускорение. Центростремительное ускорение направлено к центру: a = v² ÷ r.","Even at constant speed the direction changes, so there is acceleration. The centripetal acceleration points to the center: a = v² ÷ r."),
 ST_("כדי שגוף יסתובב צריך כוח אל המרכז: F = m·v² ÷ r. הוא יכול להיות מתח חוט, חיכוך או כוח הכבידה. זה לא כוח חדש, זה תפקיד של כוח קיים.","لكي يدور الجسم نحتاج قوة نحو المركز: F = m·v² ÷ r. قد تكون شدّ خيط أو احتكاكًا أو قوة جاذبية. ليست قوة جديدة بل دور لقوة موجودة.","Чтобы тело вращалось, нужна сила к центру: F = m·v² ÷ r. Это может быть натяжение нити, трение или тяготение. Это не новая сила, а роль существующей.","To keep turning, a body needs a force toward the center: F = m·v² ÷ r. It can be string tension, friction or gravity. It is not a new force, it is a role of an existing one."),
 ST_("חוק הכבידה של ניוטון: F = G·M·m ÷ r². הכוח קטן עם ריבוע המרחק: מרחק כפול נותן רבע מהכוח. גם g קטן כך כשמתרחקים מכדור הארץ.","قانون نيوتن للجاذبية: F = G·M·m ÷ r². تقل القوة مع مربع المسافة: ضعف المسافة يعطي ربع القوة. وكذلك يقل g عند الابتعاد عن الأرض.","Закон всемирного тяготения: F = G·M·m ÷ r². Сила убывает с квадратом расстояния: вдвое дальше — в 4 раза слабее. Так же убывает и g при удалении от Земли.","Newton's law of gravitation: F = G·M·m ÷ r². The force falls with the square of distance: twice as far gives a quarter of the force. g falls the same way as we leave Earth.")],
circuit:[
 ST_("זרם חשמלי הוא מטענים שזורמים (A, אמפר). מתח הוא ה״דחיפה״ שמניעה אותם (V, וולט). התנגדות היא כמה הנגד מקשה על הזרם (Ω, אום).","التيار الكهربائي شحنات تتدفق (A، أمبير). الجهد هو ما يدفعها (V، فولت). المقاومة هي مدى إعاقة المقاوم للتيار (Ω، أوم).","Электрический ток — движение зарядов (A, ампер). Напряжение — то, что их толкает (V, вольт). Сопротивление — насколько резистор мешает току (Ω, ом).","Electric current is moving charge (A, ampere). Voltage is the push that moves it (V, volt). Resistance is how much a resistor hinders the current (Ω, ohm).",function(){return circVis(12,[4])}),
 ST_("חוק אוהם: V = I·R. במתח 12 V ובנגד 4 Ω הזרם הוא 3 A. אפשר לחשב כל אחד מהשלושה מהשניים האחרים.","قانون أوم: V = I·R. عند جهد 12 V ومقاومة 4 Ω يكون التيار 3 A. يمكن حساب أي من الثلاثة من الاثنين الآخرين.","Закон Ома: V = I·R. При 12 V и 4 Ω ток равен 3 A. Любую из трёх величин можно найти по двум другим.","Ohm's law: V = I·R. At 12 V and 4 Ω the current is 3 A. You can find any of the three from the other two."),
 ST_("בטור: אותו זרם בכל הנגדים וההתנגדויות מצטברות: R = R₁ + R₂. במקביל: אותו מתח על כל הנגדים, והזרמים מצטברים: 1 ÷ R = 1 ÷ R₁ + 1 ÷ R₂.","على التوالي: التيار نفسه في كل المقاومات وتُجمع المقاومات: R = R₁ + R₂. على التوازي: الجهد نفسه على كل المقاومات وتُجمع التيارات: 1 ÷ R = 1 ÷ R₁ + 1 ÷ R₂.","Последовательно: одинаковый ток, сопротивления складываются: R = R₁ + R₂. Параллельно: одинаковое напряжение, токи складываются: 1 ÷ R = 1 ÷ R₁ + 1 ÷ R₂.","In series: the same current everywhere and resistances add: R = R₁ + R₂. In parallel: the same voltage on each and currents add: 1 ÷ R = 1 ÷ R₁ + 1 ÷ R₂.",function(){return circVis(12,[6,3],true)}),
 ST_("הספק חשמלי: P = V·I. חוקי קירכהוף: בצומת סכום הזרמים הנכנסים שווה לסכום היוצאים, ובלולאה סכום עליות המתח שווה לסכום הירידות.","الاستطاعة الكهربائية: P = V·I. قانونا كيرشهوف: عند العقدة مجموع التيارات الداخلة يساوي الخارجة، وفي الحلقة مجموع ارتفاعات الجهد يساوي مجموع الهبوطات.","Электрическая мощность: P = V·I. Правила Кирхгофа: в узле сумма входящих токов равна сумме выходящих, в контуре сумма подъёмов напряжения равна сумме падений.","Electric power: P = V·I. Kirchhoff's rules: at a junction the current in equals the current out, and around a loop the voltage rises equal the voltage drops.")],
field:[
 ST_("מטען חשמלי יכול להיות חיובי או שלילי. מטענים שווים דוחים ומטענים שונים מושכים. היחידה קולון (C).","الشحنة الكهربائية موجبة أو سالبة. الشحنات المتشابهة تتنافر والمختلفة تتجاذب. الوحدة كولوم (C).","Электрический заряд бывает положительным и отрицательным. Одноимённые отталкиваются, разноимённые притягиваются. Единица — кулон (C).","Electric charge is positive or negative. Like charges repel and unlike charges attract. The unit is the coulomb (C)."),
 ST_("שדה חשמלי הוא האזור שבו מטען מרגיש כוח. עוצמתו: E = F ÷ q, ביחידות N/C. כיוון השדה הוא כיוון הכוח על מטען חיובי.","المجال الكهربائي هو المنطقة التي تشعر فيها الشحنة بقوة. شدته: E = F ÷ q بوحدة N/C. اتجاه المجال هو اتجاه القوة على شحنة موجبة.","Электрическое поле — область, где на заряд действует сила. Напряжённость: E = F ÷ q, в N/C. Направление поля — направление силы на положительный заряд.","An electric field is a region where a charge feels a force. Its strength: E = F ÷ q, in N/C. The field points the way a positive charge would be pushed."),
 ST_("מטען נקודתי Q יוצר שדה E = k·Q ÷ r², כש-k = 9·10⁹ N·m²/C². השדה קטן עם ריבוע המרחק.","شحنة نقطية Q تولّد مجالًا E = k·Q ÷ r² حيث k = 9·10⁹ N·m²/C². يقل المجال مع مربع المسافة.","Точечный заряд Q создаёт поле E = k·Q ÷ r², где k = 9·10⁹ N·m²/C². Поле убывает с квадратом расстояния.","A point charge Q creates a field E = k·Q ÷ r², with k = 9·10⁹ N·m²/C². The field falls with distance squared."),
 ST_("מתח (הפרש פוטנציאלים) V הוא האנרגיה ליחידת מטען. עבודת השדה: W = q·V. בשדה אחיד בין לוחות: E = V ÷ d.","الجهد (فرق الجهد) V هو الطاقة لكل وحدة شحنة. شغل المجال: W = q·V. في مجال منتظم بين لوحين: E = V ÷ d.","Напряжение (разность потенциалов) V — энергия на единицу заряда. Работа поля: W = q·V. В однородном поле между пластинами: E = V ÷ d.","Voltage (potential difference) V is energy per unit charge. The work of the field: W = q·V. In a uniform field between plates: E = V ÷ d.")],
magnet:[
 ST_("מגנט יוצר שדה מגנטי B (ביחידות טסלה, T). גם זרם חשמלי בתיל יוצר שדה מגנטי סביבו. קטבים שווים דוחים וקטבים שונים מושכים.","المغناطيس يولّد مجالًا مغناطيسيًا B (بوحدة تسلا T). والتيار الكهربائي في سلك يولّد مجالًا حوله أيضًا. الأقطاب المتشابهة تتنافر والمختلفة تتجاذب.","Магнит создаёт магнитное поле B (в теслах, T). Ток в проводе тоже создаёт поле вокруг. Одноимённые полюса отталкиваются, разноимённые притягиваются.","A magnet creates a magnetic field B (in tesla, T). A current in a wire also creates a field around it. Like poles repel and unlike poles attract."),
 ST_("על תיל עם זרם בתוך שדה פועל כוח: F = B·I·L (כשהתיל ניצב לשדה). כיוון הכוח נקבע בכלל יד ימין והוא ניצב גם לזרם וגם לשדה.","على سلك يحمل تيارًا داخل مجال تؤثر قوة: F = B·I·L (عندما يكون السلك عموديًا على المجال). اتجاه القوة بقاعدة اليد اليمنى وهو عمودي على التيار وعلى المجال.","На провод с током в поле действует сила: F = B·I·L (когда провод перпендикулярен полю). Направление силы определяют правилом правой руки, она перпендикулярна и току, и полю.","A wire carrying current in a field feels a force: F = B·I·L (wire perpendicular to the field). The direction follows the right-hand rule and is perpendicular to both the current and the field."),
 ST_("חלקיק טעון שנע בשדה: F = q·v·B·sin θ. כשהוא נע במקביל לשדה אין כוח. הכוח ניצב למהירות, ולכן הוא משנה כיוון ולא מהירות.","جسيم مشحون يتحرك في مجال: F = q·v·B·sin θ. عندما يتحرك موازيًا للمجال لا توجد قوة. القوة عمودية على السرعة فتغيّر الاتجاه لا مقدار السرعة.","Заряженная частица в поле: F = q·v·B·sin θ. При движении параллельно полю силы нет. Сила перпендикулярна скорости, поэтому меняет направление, а не величину скорости.","A charged particle in a field: F = q·v·B·sin θ. Moving parallel to the field gives no force. The force is perpendicular to the velocity, so it changes direction, not speed."),
 ST_("כששטף מגנטי משתנה נוצר מתח מושרה: ε = ΔΦ ÷ Δt (חוק פרדיי). מוט שנע בשדה: ε = B·L·v. כך עובדים גנרטורים.","عندما يتغير التدفق المغناطيسي تنشأ قوة دافعة محتثة: ε = ΔΦ ÷ Δt (قانون فاراداي). ساق تتحرك في مجال: ε = B·L·v. هكذا تعمل المولدات.","Когда магнитный поток меняется, возникает ЭДС индукции: ε = ΔΦ ÷ Δt (закон Фарадея). Стержень в поле: ε = B·L·v. Так работают генераторы.","When magnetic flux changes, an emf is induced: ε = ΔΦ ÷ Δt (Faraday's law). A rod moving in a field: ε = B·L·v. This is how generators work.")],
wave:[
 ST_("גל מעביר אנרגיה בלי להעביר חומר. אורך גל λ הוא המרחק בין שני שיאים סמוכים. תדירות f היא כמה גלים עוברים בשנייה (Hz).","الموجة تنقل الطاقة دون نقل المادة. الطول الموجي λ هو المسافة بين قمتين متتاليتين. التردد f هو عدد الموجات في الثانية (Hz).","Волна переносит энергию, а не вещество. Длина волны λ — расстояние между соседними гребнями. Частота f — число волн в секунду (Hz).","A wave carries energy without carrying matter. The wavelength λ is the distance between two neighboring crests. The frequency f is how many waves pass per second (Hz).",function(){return waveVis(4,"m")}),
 ST_("מהירות הגל: v = λ·f. זמן המחזור: T = 1 ÷ f. אם מגדילים את התדירות באותו חומר, אורך הגל קטן.","سرعة الموجة: v = λ·f. زمن الدورة: T = 1 ÷ f. إذا زدنا التردد في الوسط نفسه يقل الطول الموجي.","Скорость волны: v = λ·f. Период: T = 1 ÷ f. Если увеличить частоту в той же среде, длина волны уменьшится.","Wave speed: v = λ·f. Period: T = 1 ÷ f. Raise the frequency in the same medium and the wavelength shrinks."),
 ST_("החזרה: זווית הפגיעה שווה לזווית ההחזרה (מהניצב). שבירה: אור משנה כיוון כשהוא עובר בין חומרים. מקדם השבירה n = c ÷ v, ו-n ≥ 1.","الانعكاس: زاوية السقوط تساوي زاوية الانعكاس (من العمود). الانكسار: يغيّر الضوء اتجاهه عند انتقاله بين مادتين. معامل الانكسار n = c ÷ v و n ≥ 1.","Отражение: угол падения равен углу отражения (от нормали). Преломление: свет меняет направление при переходе между средами. Показатель n = c ÷ v, n ≥ 1.","Reflection: the angle of incidence equals the angle of reflection (from the normal). Refraction: light bends when it passes between materials. The refractive index n = c ÷ v, and n ≥ 1."),
 ST_("עדשה מרכזת: 1 ÷ f = 1 ÷ u + 1 ÷ v, כש-u מרחק העצם, v מרחק הדמות ו-f המרחק המוקדי. עצם רחוק מהמוקד יוצר דמות אמיתית והפוכה.","عدسة لامّة: 1 ÷ f = 1 ÷ u + 1 ÷ v حيث u بعد الجسم و v بعد الصورة و f البعد البؤري. جسم بعيد عن البؤرة يعطي صورة حقيقية مقلوبة.","Собирающая линза: 1 ÷ f = 1 ÷ u + 1 ÷ v, где u — расстояние до предмета, v — до изображения, f — фокусное. Предмет дальше фокуса даёт действительное перевёрнутое изображение.","A converging lens: 1 ÷ f = 1 ÷ u + 1 ÷ v, where u is the object distance, v the image distance and f the focal length. An object beyond the focus gives a real, inverted image.")],
quantum:[
 ST_("אור מגיע במנות קטנות שנקראות פוטונים. אנרגיית פוטון: E = h·f. בקיצור שימושי: E(eV) = 1240 ÷ λ(nm). אור כחול נושא יותר אנרגיה מאדום.","يصل الضوء في حِزم صغيرة تسمى الفوتونات. طاقة الفوتون: E = h·f. اختصار مفيد: E(eV) = 1240 ÷ λ(nm). الضوء الأزرق يحمل طاقة أكبر من الأحمر.","Свет приходит маленькими порциями — фотонами. Энергия фотона: E = h·f. Удобно: E(eV) = 1240 ÷ λ(nm). Синий свет несёт больше энергии, чем красный.","Light comes in small packets called photons. Photon energy: E = h·f. Handy form: E(eV) = 1240 ÷ λ(nm). Blue light carries more energy than red."),
 ST_("אפקט פוטואלקטרי: אור מוציא אלקטרונים ממתכת רק אם אנרגיית הפוטון גדולה מפונקציית העבודה W. אז Ek = hf − W. עוצמה גדולה יותר נותנת יותר אלקטרונים, לא מהירים יותר.","الظاهرة الكهروضوئية: يُخرج الضوء إلكترونات من فلز فقط إذا كانت طاقة الفوتون أكبر من دالة الشغل W. عندها Ek = hf − W. شدة أكبر تعطي إلكترونات أكثر لا أسرع.","Фотоэффект: свет выбивает электроны из металла, только если энергия фотона больше работы выхода W. Тогда Ek = hf − W. Большая яркость даёт больше электронов, а не более быстрые.","The photoelectric effect: light ejects electrons from a metal only if the photon energy is above the work function W. Then Ek = hf − W. More intensity gives more electrons, not faster ones."),
 ST_("באטום בוהר לאלקטרון יש רמות אנרגיה מסוימות בלבד. במימן: E = −13.6 ÷ n² (eV). n = 1 היא רמת היסוד.","في ذرة بور للإلكترون مستويات طاقة محددة فقط. في الهيدروجين: E = −13.6 ÷ n² (eV). n = 1 هو المستوى الأساسي.","В атоме Бора у электрона только определённые уровни энергии. Для водорода: E = −13.6 ÷ n² (eV). n = 1 — основное состояние.","In the Bohr atom the electron has only certain energy levels. For hydrogen: E = −13.6 ÷ n² (eV). n = 1 is the ground state."),
 ST_("כשאלקטרון יורד מרמה לרמה נפלט פוטון בדיוק בהפרש האנרגיות. גרעין רדיואקטיבי דועך: בכל זמן מחצית חיים נשארת חצי מהכמות, N = N₀ ÷ 2ⁿ.","عندما ينتقل الإلكترون من مستوى إلى أدنى ينبعث فوتون طاقته تساوي فرق الطاقة بالضبط. النواة المشعة تضمحل: في كل عمر نصف تبقى نصف الكمية، N = N₀ ÷ 2ⁿ.","Когда электрон переходит на нижний уровень, излучается фотон ровно с энергией разности уровней. Радиоактивное ядро распадается: за каждый период полураспада остаётся половина, N = N₀ ÷ 2ⁿ.","When an electron drops from one level to a lower one, a photon with exactly the energy difference is emitted. A radioactive nucleus decays: every half-life leaves half the amount, N = N₀ ÷ 2ⁿ.")]
};
