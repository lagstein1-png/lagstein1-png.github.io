 ,Q("bib-choice61-bones",{"he": "מה קורה לעצמות בחזון העצמות היבשות של יחזקאל?", "ar": "ماذا يحدث للعظام في رؤيا العظام اليابسة لحزقيال؟", "ru": "Что происходит с костями в видении сухих костей Иезекииля?", "en": "What happens to the bones in Ezekiel's vision of the dry bones?"},[{"he": "הן מתחברות, מתכסות בגידים ובשר, ורוח חיים נכנסת בהן", "ar": "تتصل وتُغطى بالأوتار واللحم، وتدخل فيها روح الحياة", "ru": "Они соединяются, покрываются жилами и плотью, и в них входит дух жизни", "en": "They join together, are covered with sinews and flesh, and the breath of life enters them"},{"he": "הן נאספות ונקברות בבור", "ar": "تُجمع وتُدفن في حفرة", "ru": "Их собирают и хоронят в яме", "en": "They are gathered and buried in a pit"},{"he": "הן הופכות לאבנים בביקעה", "ar": "تتحول إلى حجارة في البقعة", "ru": "Они превращаются в камни в долине", "en": "They turn into stones in the valley"},{"he": "הן נשרפות באש גדולה", "ar": "تُحرق بنار عظيمة", "ru": "Они сгорают в большом огне", "en": "They are burned in a great fire"}],0,{"he": "עקבו אחרי שלבי החזון לפי הסדר.", "ar": "تتبّعوا مراحل الرؤيا بالترتيب.", "ru": "Проследите этапы видения по порядку.", "en": "Follow the stages of the vision in order."},{"he": "ביחזקאל ל\"ז העצמות עוברות שלבים: רעש, חיבור עצם אל עצם, גידים ובשר, ולבסוף 'ותבוא בהם הרוח ויחיו'. דוגמה: החזון הופך לסמל לתקומה של עם ישראל מן הגלות.", "ar": "في حزقيال 37 تمر العظام بمراحل: صوت، اتصال عظم بعظم، أوتار ولحم، وأخيرًا «فدخل فيها الروح فحييت». مثال: تصبح الرؤيا رمزًا لنهضة شعب إسرائيل من المنفى.", "ru": "В Иезекииле 37 кости проходят этапы: шум, соединение кости к кости, жилы и плоть, и наконец «вошёл в них дух, и они ожили». Пример: видение становится символом возрождения народа Израиля из изгнания.", "en": "In Ezekiel 37 the bones pass through stages: a noise, bone joining bone, sinews and flesh, and finally \"the breath came into them and they lived\". Example: the vision becomes a symbol of Israel's revival from exile."},null,[null,{"he": "אין קבורה בחזון; התהליך הוא ההפך - ממות לחיים.", "ar": "لا دفن في الرؤيا؛ المسار عكسي - من موت إلى حياة.", "ru": "В видении нет погребения; процесс обратный - от смерти к жизни.", "en": "There is no burial in the vision; the process is the reverse - from death to life."},{"he": "העצמות אינן הופכות לאבנים; הן חוזרות לחיים.", "ar": "العظام لا تتحول حجارة؛ تعود إلى الحياة.", "ru": "Кости не превращаются в камни; они возвращаются к жизни.", "en": "The bones do not turn to stones; they return to life."},{"he": "אין שריפה בחזון; הרוח מחיה את העצמות.", "ar": "لا حريق في الرؤيا؛ الروح تحيي العظام.", "ru": "В видении нет сожжения; дух оживляет кости.", "en": "There is no burning in the vision; the breath revives the bones."}]),
  Q("ch61-1-01",{"he": "למי היה שייך הכרם שאחאב רצה לקנות (מלכים א כ״א)?", "ar": "لمن كان الكرم الذي أراد أخآب أن يشتريه (الملوك الأول 21)؟", "ru": "Кому принадлежал виноградник, который хотел купить Ахав (3 Царств 21)?", "en": "Who owned the vineyard that Ahab wanted to buy (1 Kings 21)?"},[{"he": "לנבות היזרעאלי", "ar": "لنابوت اليزرعيلي", "ru": "Навуфею Изреелитянину", "en": "Naboth the Jezreelite"}, {"he": "לאוריה החתי", "ar": "لأوريا الحثي", "ru": "Урии Хеттеянину", "en": "Uriah the Hittite"}, {"he": "למיכיהו בן ימלה", "ar": "لميخا بن يملة", "ru": "Михею, сыну Иемвлая", "en": "Micaiah son of Imlah"}, {"he": "לעובדיה, האיש שהיה ממונה על בית המלך", "ar": "لعوبديا، الرجل الذي كان على بيت الملك", "ru": "Авдию, который управлял домом царя", "en": "Obadiah, the man in charge of the king's house"}],0,{"he": "הכרם נמצא ביזרעאל, ליד ארמון המלך.", "ar": "الكرم في يزرعيل، قرب قصر الملك.", "ru": "Виноградник был в Изрееле, рядом с дворцом царя.", "en": "The vineyard was in Jezreel, next to the king's palace."},{"he": "הכרם היה של נבות היזרעאלי. נבות סירב למכור אותו, כי זו נחלת אבותיו. בסוף הוא נרצח בעלילה של איזבל.", "ar": "كان الكرم لنابوت اليزرعيلي. رفض نابوت بيعه لأنه ميراث آبائه. وفي النهاية قُتل بمكيدة إيزابل.", "ru": "Виноградник принадлежал Навуфею. Он отказался его продать, потому что это наследие отцов. В итоге его убили по замыслу Иезавели.", "en": "The vineyard belonged to Naboth. He refused to sell it because it was his family inheritance. In the end he was killed through Jezebel's plot."},null,[null, {"he": "אוריה החתי שייך לסיפור דוד ובת שבע, לא לסיפור הכרם.", "ar": "أوريا الحثي من قصة داود وبثشبع، لا من قصة الكرم.", "ru": "Урия связан с историей Давида и Вирсавии, а не с виноградником.", "en": "Uriah belongs to the story of David and Bathsheba, not the vineyard."}, {"he": "מיכיהו הוא נביא שמופיע בפרק אחר, ולא בעל הכרם.", "ar": "ميخا نبي يظهر في أصحاح آخر، وليس صاحب الكرم.", "ru": "Михей — пророк из другой главы, а не владелец виноградника.", "en": "Micaiah is a prophet in another chapter, not the vineyard's owner."}, {"he": "עובדיה הוא איש בחצר אחאב (פרק י״ח), ולא בעל הכרם.", "ar": "عوبديا رجل في بلاط أخآب (أصحاح 18)، وليس صاحب الكرم.", "ru": "Авдий служит при дворе Ахава (глава 18), он не владелец виноградника.", "en": "Obadiah serves in Ahab's court (chapter 18); he does not own the vineyard."}]),
  Q("ch61-1-02",{"he": "מה היה עמוס לפני שהיה לנביא, לפי דבריו (עמוס ז׳)?", "ar": "ماذا كان عاموس قبل أن يصبح نبيًا، بحسب كلامه (عاموس 7)؟", "ru": "Кем был Амос до того, как стал пророком, по его словам (Амос 7)?", "en": "What was Amos before he became a prophet, by his own words (Amos 7)?"},[{"he": "כוהן במקדש בית אל", "ar": "كاهن في هيكل بيت إيل", "ru": "священником в храме Вефиля", "en": "a priest at the Bethel temple"}, {"he": "רועה בקר ובולס שקמים", "ar": "راعي بقر وجاني جمّيز", "ru": "пастухом и собирателем сикомор", "en": "a herdsman who tended sycamore figs"}, {"he": "סופר בחצר המלך", "ar": "كاتب في بلاط الملك", "ru": "писцом при царском дворе", "en": "a scribe at the royal court"}, {"he": "תלמיד בחבורה של בני הנביאים בבית אל", "ar": "تلميذ في جماعة بني الأنبياء في بيت إيل", "ru": "учеником в общине сынов пророков в Вефиле", "en": "a student in a band of the sons of the prophets"}],1,{"he": "עמוס עונה לאמציה ומספר מאיפה ה׳ לקח אותו.", "ar": "يجيب عاموس أمصيا ويروي من أين أخذه الرب.", "ru": "Амос отвечает Амасии и рассказывает, откуда Господь взял его.", "en": "Amos answers Amaziah and tells where the LORD took him from."},{"he": "עמוס אומר: ״לא נביא אנכי ולא בן נביא אנכי״. הוא היה בוקר ובולס שקמים. לפי דבריו, ה׳ לקח אותו מאחרי הצאן.", "ar": "يقول عاموس إنه ليس نبيًا ولا ابن نبي. كان راعي بقر وجاني جمّيز. وبحسب كلامه أخذه الرب من وراء الغنم.", "ru": "Амос говорит, что он не пророк и не сын пророка. Он был пастухом и собирал плоды сикоморы. По его словам, Господь взял его от стада.", "en": "Amos says he is not a prophet nor a prophet's son. He was a herdsman and tended sycamore figs. By his words, the LORD took him from the flock."},null,[{"he": "הכוהן בבית אל הוא אמציה, שמתעמת עם עמוס.", "ar": "الكاهن في بيت إيل هو أمصيا، الذي يواجه عاموس.", "ru": "Священник Вефиля — Амасия, который спорит с Амосом.", "en": "The priest of Bethel is Amaziah, who confronts Amos."}, null, {"he": "עמוס לא מספר על עבודה בחצר המלך.", "ar": "لا يذكر عاموس أنه عمل في بلاط الملك.", "ru": "Амос не говорит о службе при дворе.", "en": "Amos says nothing about working at the royal court."}, {"he": "עמוס אומר שהוא לא נביא ולא בן נביא.", "ar": "يقول عاموس إنه ليس نبيًا ولا ابن نبي.", "ru": "Амос говорит, что он не пророк и не сын пророка.", "en": "Amos says he is neither a prophet nor a prophet's son."}]),
  Q("ch61-1-03",{"he": "לפי מיכה ו׳, מה ה׳ דורש מן האדם?", "ar": "بحسب ميخا 6، ماذا يطلب الرب من الإنسان؟", "ru": "Чего, согласно Михею 6, Господь требует от человека?", "en": "According to Micah 6, what does the LORD require of a person?"},[{"he": "להביא אלפי אילים ורבבות נחלי שמן אל המקדש בכל שנה", "ar": "أن يقدّم ألوف الكباش وربوات أنهار الزيت للهيكل كل سنة", "ru": "приносить в храм тысячи овнов и тьмы потоков елея каждый год", "en": "to bring thousands of rams and rivers of oil to the temple every year"}, {"he": "להקריב את בנו הבכור כדי לכפר על חטאיו", "ar": "أن يقدّم ابنه البكر ليكفّر عن خطاياه", "ru": "принести в жертву своего первенца ради искупления грехов", "en": "to offer his firstborn son to atone for his sins"}, {"he": "לעשות משפט, לאהוב חסד וללכת בצניעות עם אלוהים", "ar": "أن يصنع الحق ويحب الرحمة ويسلك متواضعًا مع إلهه", "ru": "творить суд, любить милость и смиренно ходить с Богом", "en": "to do justice, love kindness and walk humbly with God"}, {"he": "לצום שבעה ימים בכל שנה ולהתפלל בקול רם", "ar": "أن يصوم سبعة أيام كل سنة ويصلّي بصوت عالٍ", "ru": "поститься семь дней каждый год и громко молиться в храме", "en": "to fast seven days each year and pray out loud"}],2,{"he": "התשובה באה אחרי רשימת קורבנות, והיא קצרה מהם.", "ar": "يأتي الجواب بعد قائمة قرابين، وهو أقصر منها.", "ru": "Ответ идёт после списка жертв и он короче него.", "en": "The answer follows a list of offerings and is shorter than it."},{"he": "מיכה שואל במה לבוא לפני ה׳: עולות, אילים, שמן ואפילו בכור. התשובה פשוטה: ״עשות משפט ואהבת חסד והצנע לכת עם אלהיך״.", "ar": "يسأل ميخا بماذا يتقدّم أمام الرب: محرقات وكباش وزيت وحتى البكر. والجواب بسيط: صنع الحق ومحبة الرحمة والسلوك بتواضع مع الله.", "ru": "Михей спрашивает, с чем прийти к Господу: всесожжения, овны, елей и даже первенец. Ответ прост: справедливость, милосердие и смиренный путь с Богом.", "en": "Micah asks what to bring before the LORD: offerings, rams, oil, even a firstborn. The answer is simple: do justice, love kindness, walk humbly with God."},null,[{"he": "הנביא מזכיר אילים ושמן כשאלה, ודוחה אותם כתשובה.", "ar": "يذكر النبي الكباش والزيت كسؤال، ثم يرفضها كجواب.", "ru": "Пророк упоминает овнов и елей в вопросе и отвергает их как ответ.", "en": "The prophet raises rams and oil as a question and rejects them as the answer."}, {"he": "הבכור מוזכר בשאלה הקיצונית ביותר, והתשובה דוחה אותו.", "ar": "يُذكر البكر في أشد الأسئلة تطرفًا، والجواب يرفضه.", "ru": "Первенец упомянут в самом крайнем вопросе, и ответ это отвергает.", "en": "The firstborn appears in the most extreme question, and the answer rejects it."}, null, {"he": "צום ותפילה בקול אינם מופיעים בתשובה של מיכה.", "ar": "الصوم والصلاة بصوت عالٍ لا يظهران في جواب ميخا.", "ru": "Пост и громкая молитва не входят в ответ Михея.", "en": "Fasting and loud prayer are not part of Micah's answer."}]),
  Q("ch61-1-04",{"he": "איפה עומד ירמיהו כשהוא נושא את נאומו בפרק ז׳?", "ar": "أين يقف إرميا عندما يلقي خطبته في الأصحاح 7؟", "ru": "Где стоит Иеремия, когда произносит речь в главе 7?", "en": "Where does Jeremiah stand when he gives his speech in chapter 7?"},[{"he": "על הר הכרמל מול נביאי הבעל", "ar": "على جبل الكرمل أمام أنبياء البعل", "ru": "на горе Кармил перед пророками Ваала и народом", "en": "on Mount Carmel facing the prophets of Baal and the people"}, {"he": "על נהר כבר בארץ בבל", "ar": "عند نهر خابور في أرض بابل", "ru": "у реки Ховар в Вавилонии", "en": "by the river Chebar in Babylonia"}, {"he": "בשער העיר שומרון", "ar": "عند باب مدينة السامرة", "ru": "у ворот города Самарии", "en": "at the gate of the city of Samaria"}, {"he": "בשער בית ה׳ בירושלים", "ar": "عند باب بيت الرب في أورشليم", "ru": "у ворот дома Господня в Иерусалиме", "en": "at the gate of the LORD's house in Jerusalem"}],3,{"he": "הנאום פונה לאנשים שבאים להשתחוות.", "ar": "الخطبة موجهة إلى من يأتون للسجود.", "ru": "Речь обращена к тем, кто приходит поклониться.", "en": "The speech is aimed at people coming to worship."},{"he": "ה׳ מצווה את ירמיהו לעמוד בשער בית ה׳. שם הוא פונה לכל הבאים להשתחוות. המקום מתאים לתוכן: ביקורת על ביטחון במקדש.", "ar": "يأمر الرب إرميا أن يقف عند باب بيت الرب. وهناك يخاطب كل الآتين للسجود. المكان يناسب المضمون: نقد الثقة بالهيكل.", "ru": "Господь велит Иеремии встать у ворот храма. Там он обращается ко всем, кто приходит поклониться. Место подходит к теме: критика упования на храм.", "en": "The LORD tells Jeremiah to stand at the gate of the temple. There he speaks to all who come to worship. The place fits the message: a critique of trusting the temple."},null,[{"he": "הר הכרמל הוא מקום העימות של אליהו, לא של ירמיהו.", "ar": "جبل الكرمل مكان مواجهة إيليا، لا إرميا.", "ru": "Кармил — место противостояния Илии, а не Иеремии.", "en": "Mount Carmel is where Elijah's contest took place, not Jeremiah's."}, {"he": "נהר כבר קשור ליחזקאל בגלות, לא לירמיהו.", "ar": "نهر خابور مرتبط بحزقيال في السبي، لا بإرميا.", "ru": "Река Ховар связана с Иезекиилем в изгнании, а не с Иеремией.", "en": "The river Chebar is linked to Ezekiel in exile, not to Jeremiah."}, {"he": "ירמיהו מדבר אל באי המקדש ביהודה, לא בשומרון.", "ar": "يخاطب إرميا الداخلين إلى الهيكل في يهوذا، لا في السامرة.", "ru": "Иеремия обращается к входящим в храм в Иудее, а не в Самарии.", "en": "Jeremiah speaks to those entering the temple in Judah, not in Samaria."}, null]),
  Q("ch61-1-05",{"he": "לפי ההסבר ביחזקאל ל״ז, את מי מייצגות העצמות?", "ar": "بحسب التفسير في حزقيال 37، مَن تمثّل العظام؟", "ru": "Кого, согласно объяснению в Иезекииле 37, представляют кости?", "en": "According to the explanation in Ezekiel 37, whom do the bones represent?"},[{"he": "את כל בית ישראל", "ar": "كل بيت إسرائيل", "ru": "весь дом Израилев", "en": "the whole house of Israel"}, {"he": "את חיילי מצרים שטבעו בים", "ar": "جنود مصر الذين غرقوا في البحر", "ru": "утонувших в море воинов Египта", "en": "the soldiers of Egypt who drowned in the sea"}, {"he": "את נביאי הבעל", "ar": "أنبياء البعل", "ru": "пророков Ваала", "en": "the prophets of Baal"}, {"he": "את מלכי יהודה בלבד", "ar": "ملوك يهوذا فقط", "ru": "только царей Иудеи", "en": "only the kings of Judah"}],0,{"he": "חפשו את הפסוק שבו ה׳ מפרש את החזון.", "ar": "ابحثوا عن الآية التي يفسّر فيها الرب الرؤيا.", "ru": "Найдите стих, где Господь объясняет видение.", "en": "Find the verse where the LORD explains the vision."},{"he": "אחרי החזון ה׳ אומר: ״העצמות האלה כל בית ישראל המה״. העם בגלות מרגיש מת וחסר תקווה. החזון אומר לו שיש תקומה.", "ar": "بعد الرؤيا يقول الرب إن هذه العظام هي كل بيت إسرائيل. الشعب في السبي يشعر أنه ميت بلا رجاء. والرؤيا تقول له إن هناك قيامة.", "ru": "После видения Господь говорит: эти кости — весь дом Израилев. Народ в изгнании чувствует себя мёртвым и без надежды. Видение говорит ему о возрождении.", "en": "After the vision the LORD says these bones are the whole house of Israel. The exiled people feel dead and hopeless. The vision tells them renewal is possible."},null,[null, {"he": "מצרים לא מוזכרת בחזון; ההסבר מדבר על ישראל.", "ar": "مصر غير مذكورة في الرؤيا؛ التفسير يتحدث عن إسرائيل.", "ru": "Египет в видении не упоминается; объяснение говорит об Израиле.", "en": "Egypt is not in the vision; the explanation speaks of Israel."}, {"he": "נביאי הבעל שייכים לסיפור אליהו, לא לחזון הזה.", "ar": "أنبياء البعل من قصة إيليا، لا من هذه الرؤيا.", "ru": "Пророки Ваала — из истории Илии, а не из этого видения.", "en": "The prophets of Baal belong to Elijah's story, not this vision."}, {"he": "ההסבר מדבר על העם כולו, לא רק על המלכים.", "ar": "التفسير يتحدث عن الشعب كله، لا عن الملوك وحدهم.", "ru": "Объяснение говорит обо всём народе, а не только о царях.", "en": "The explanation speaks of the whole people, not only kings."}]),
  Q("ch61-1-06",{"he": "לפי ישעיהו א׳, על מי העם צריך להגן?", "ar": "بحسب إشعياء 1، مَن يجب على الشعب أن يحمي؟", "ru": "Кого, согласно Исаии 1, должен защищать народ?", "en": "According to Isaiah 1, whom must the people defend?"},[{"he": "על הכוהנים והלוויים שבמקדש", "ar": "الكهنة واللاويين في الهيكل", "ru": "священников и левитов", "en": "the priests and the Levites in the temple"}, {"he": "על היתום והאלמנה", "ar": "اليتيم والأرملة", "ru": "сироту и вдову", "en": "the orphan and the widow"}, {"he": "על המלך ושריו", "ar": "الملك ورؤساءه", "ru": "царя и его вельмож", "en": "the king and his officials"}, {"he": "על הסוחרים בשוק", "ar": "التجار في السوق", "ru": "торговцев на рынке", "en": "the merchants in the market"}],1,{"he": "חשבו על מי שאין לו מי שיגן עליו.", "ar": "فكّروا في من ليس له من يحميه.", "ru": "Подумайте о тех, у кого нет защитника.", "en": "Think of people who have no one to protect them."},{"he": "ישעיהו קורא: ״דרשו משפט... שפטו יתום ריבו אלמנה״. יתום ואלמנה הם בלי משפחה שתגן עליהם. לפי הנביא, משפט צודק מתחיל בהם.", "ar": "يدعو إشعياء إلى طلب الحق وإنصاف اليتيم والدفاع عن الأرملة. اليتيم والأرملة بلا عائلة تحميهما. وبحسب النبي يبدأ العدل بهما.", "ru": "Исаия призывает искать правды, защищать сироту и вступаться за вдову. У них нет семьи, которая их защитит. По словам пророка, справедливость начинается с них.", "en": "Isaiah calls to seek justice, defend the orphan and plead for the widow. They have no family to protect them. By the prophet's words, justice starts with them."},null,[{"he": "ישעיהו לא מבקש כאן להגן על הכוהנים.", "ar": "لا يطلب إشعياء هنا حماية الكهنة.", "ru": "Исаия не просит здесь защищать священников.", "en": "Isaiah does not ask here to defend the priests."}, null, {"he": "המלך והשרים חזקים, והנביא מבקש להגן על החלשים.", "ar": "الملك والرؤساء أقوياء، والنبي يطلب حماية الضعفاء.", "ru": "Царь и вельможи сильны, а пророк требует защищать слабых.", "en": "The king and officials are strong; the prophet asks to protect the weak."}, {"he": "הסוחרים אינם מוזכרים בקריאה הזאת של ישעיהו.", "ar": "التجار غير مذكورين في هذا النداء لإشعياء.", "ru": "Торговцы не упомянуты в этом призыве Исаии.", "en": "Merchants are not mentioned in this call of Isaiah."}])],
 [
  Q("bib-choice-1261-3",{"he": "איזה תיאור מתאים לחוק על יחס לחלש?", "ar": "أي وصف يناسب قانون معاملة الضعيف؟", "ru": "Какое описание подходит к «Закон о защите слабого»?", "en": "Which description fits law on treatment of the vulnerable?"},[{"he": "ביחזקאל ל״ז חזון העצמות מציג תחייה כדימוי לתקווה לעם מיואש.", "ar": "في حزقيال 37 تعرض رؤيا العظام حياة جديدة صورةً لأمل شعب يائس.", "ru": "В Иезекииле 37 оживление костей служит образом надежды для отчаявшегося народа.", "en": "In Ezekiel 37 the bones’ revival pictures hope for a despairing people."},{"he": "בירמיהו א׳ הנביא חושש שאינו יודע לדבר מפני שהוא צעיר, ונענה שלא יישאר לבדו.", "ar": "في إرميا 1 يخاف النبي لأنه فتى لا يحسن الكلام، فيُطمأن بأنه ليس وحده.", "ru": "В Иеремии 1 пророк опасается, что молод и не умеет говорить, и получает заверение в поддержке.", "en": "In Jeremiah 1 the prophet worries that he is young and cannot speak; he is reassured of support."},{"he": "בחוקי התורה חוזרת הדרישה להגן על גר, יתום ואלמנה.", "ar": "تتكرر في قوانين التوراة مطالب حماية الغريب واليتيم والأرملة.", "ru": "В законах Торы повторяется требование защищать пришельца, сироту и вдову.", "en": "Torah laws repeatedly call for protecting the stranger, orphan and widow."},{"he": "בקהלת א׳ תנועות חוזרות בטבע משמשות רקע לשאלת התועלת בעמל האדם.", "ar": "في الجامعة 1 تشكل حركات الطبيعة المتكررة خلفية للسؤال عن جدوى تعب الإنسان.", "ru": "В Екклесиасте 1 повторяющиеся движения природы служат фоном вопроса о пользе человеческого труда.", "en": "In Ecclesiastes 1 recurring motions of nature frame a question about the gain from human toil."}],2,{"he": "חפשו את הפרט שמבדיל אותו מן האחרים.", "ar": "ابحثوا عن التفصيل الذي يميزه عن غيره.", "ru": "Ищите отличие от остальных вариантов.", "en": "Look for the detail that separates it from the others."},{"he": "זו תמה חוקית-חברתית, ולא תיאור של חלום אישי.", "ar": "هذا موضوع قانوني اجتماعي لا وصف حلم شخصي.", "ru": "Это правовая и общественная тема, а не описание личного сна.", "en": "This is a social-legal theme, not a personal dream."},null,[{"he": "זה מתאר את חזון העצמות היבשות, לא את חוק על יחס לחלש.", "ar": "هذا يصف رؤيا العظام اليابسة، لا قانون معاملة الضعيف.", "ru": "Это описание «Видение сухих костей», а не «Закон о защите слабого».", "en": "That describes vision of dry bones, not law on treatment of the vulnerable."},{"he": "זה מתאר את הקדשת ירמיהו, לא את חוק על יחס לחלש.", "ar": "هذا يصف تكليف إرميا، لا قانون معاملة الضعيف.", "ru": "Это описание «Призвание Иеремии», а не «Закон о защите слабого».", "en": "That describes Jeremiah’s calling, not law on treatment of the vulnerable."},null,{"he": "זה מתאר את קהלת והמחזוריות, לא את חוק על יחס לחלש.", "ar": "هذا يصف الجامعة ودورات الطبيعة، لا قانون معاملة الضعيف.", "ru": "Это описание «Екклесиаст и циклы», а не «Закон о защите слабого».", "en": "That describes Ecclesiastes and cycles, not law on treatment of the vulnerable."}])
 ,Q("bib-choice61-jeremiah",{"he": "מהו רגע המפנה בפרק ההקדשה של ירמיהו (ירמיהו א')?", "ar": "ما لحظة التحول في فصل تكريس إرميا (إرميا 1)؟", "ru": "Каков переломный момент в главе призвания Иеремии (Иеремия 1)?", "en": "What is the turning point in Jeremiah's call chapter (Jeremiah 1)?"},[{"he": "אלוהים ממנה את ירמיהו נביא לגויים, אף שהוא טוען 'נער אנוכי'", "ar": "الله يعيّن إرميا نبيًا للأمم رغم قوله «إني فتى»", "ru": "Бог назначает Иеремию пророком для народов, хотя тот говорит «я юноша»", "en": "God appoints Jeremiah a prophet to the nations, though he says \"I am a youth\""},{"he": "ירמיהו בורח לתרשיש כדי להימנע מהשליחות, בדיוק כפי שעשה יונה לפניו", "ar": "يرميا يهرب إلى ترشيش ليتجنب الرسالة، تمامًا كما فعل يونان قبله", "ru": "Иеремия бежит в Таршиш, чтобы избежать поручения, совсем как Иона до него", "en": "Jeremiah flees to Tarshish to avoid the mission, just as Jonah did before him"},{"he": "ירמיהו מתמנה לכהן בבית המקדש", "ar": "يرميا يُعيَّن كاهنًا في الهيكل", "ru": "Иеремия назначается священником в Храме", "en": "Jeremiah is appointed a priest in the Temple"},{"he": "ירמיהו מקבל ספר וקורא אותו לעם", "ar": "يرميا يتلقى سفرًا ويقرؤه للشعب", "ru": "Иеремия получает свиток и читает его народу", "en": "Jeremiah receives a scroll and reads it to the people"}],0,{"he": "חפשו את המענה לטענה 'נער אנוכי'.", "ar": "ابحثوا عن الرد على قوله «إني فتى».", "ru": "Найдите ответ на слова «я юноша».", "en": "Look for the answer to \"I am a youth\"."},{"he": "ירמיהו מתנגד בפסוק ו': 'אהה... נער אנוכי'. המענה בא מיד: 'אל תאמר נער אנוכי... נתתי דברי בפיך'. דוגמה: כמו משה, גם ירמיהו מקבל שליחות למרות התנגדות - דפוס מוכר של פרקי הקדשה.", "ar": "يعترض إرميا في الآية 6: «آه... إني فتى». يأتي الرد فورًا: «لا تقل إني فتى... جعلت كلامي في فمك». مثال: مثل موسى، يتلقى إرميا الرسالة رغم الاعتراض - نمط معروف في فصول الدعوة.", "ru": "Иеремия возражает в стихе 6: «я юноша». Ответ следует сразу: «не говори: я юноша... вложил слова Мои в уста твои». Пример: как Моисей, Иеремия получает поручение несмотря на возражение - известный образец глав призвания.", "en": "Jeremiah objects in verse 6: \"I am a youth\". The answer comes at once: \"Do not say I am a youth... I have put My words in your mouth\". Example: like Moses, Jeremiah receives the mission despite his objection - a known pattern in call chapters."},null,[null,{"he": "הבריחה לתרשיש היא סיפורו של יונה, לא של ירמיהו.", "ar": "الهروب إلى ترشيش قصة يونان لا إرميا.", "ru": "Бегство в Таршиш - история Ионы, а не Иеремии.", "en": "The flight to Tarshish is Jonah's story, not Jeremiah's."},{"he": "השליחות היא נבואה לגויים, לא כהונה במקדש.", "ar": "الرسالة نبوة للأمم لا كهانة في الهيكل.", "ru": "Поручение - пророчество для народов, а не священство в Храме.", "en": "The mission is prophecy to the nations, not Temple priesthood."},{"he": "קריאת ספר לעם שייכת לפרקים אחרים; כאן השליחות ניתנת ישירות.", "ar": "قراءة سفر للشعب تخص فصولًا أخرى؛ هنا تُعطى الرسالة مباشرة.", "ru": "Чтение свитка народу относится к другим главам; здесь поручение даётся напрямую.", "en": "Reading a scroll to the people belongs to other chapters; here the mission is given directly."}]),Q("bib-choice61-weak",{"he": "מה משותף לחוקי המקרא העוסקים בגר, ביתום ובאלמנה?", "ar": "ما المشترك بين شرائع التوراة عن الغريب واليتيم والأرملة؟", "ru": "Что общего у законов Торы о пришельце, сироте и вдове?", "en": "What do the Torah's laws about the stranger, the orphan and the widow have in common?"},[{"he": "הם מגינים על חלשים בלי עורכין, בנימוק 'כי גרים הייתם במצרים'", "ar": "تحمي ضعفاء لا سند لهم، بعلة «لأنكم كنتم غرباء في مصر»", "ru": "Они защищают слабых без заступников, обосновывая: «ибо пришельцами были вы в Египте»", "en": "They protect the weak who have no backing, grounded in \"for you were strangers in Egypt\""},{"he": "החוקים האלה עוסקים רק במסים ובתשלומים שמוטלים על כל תושבי הארץ", "ar": "هذه الشرائع تتعلق فقط بالضرائب والمدفوعات المفروضة على كل سكان الأرض", "ru": "Эти законы касаются только налогов и платежей, налагаемых на всех жителей страны", "en": "These laws deal only with taxes and payments imposed on all the inhabitants of the land"},{"he": "הם חלים רק על בני שבט יהודה", "ar": "تسري فقط على بني سبط يهوذا", "ru": "Они действуют только для колена Иуды", "en": "They apply only to the tribe of Judah"},{"he": "הם ניתנו כדי לפצות את הכוהנים", "ar": "أُعطيت لتعويض الكهنة", "ru": "Они даны, чтобы возместить священникам", "en": "They were given to compensate the priests"}],0,{"he": "חפשו את המשפט שמסביר למה דווקא אנחנו צריכים להגן.", "ar": "ابحثوا عن الجملة التي تفسر لماذا نحن تحديدًا يجب أن نحمي.", "ru": "Найдите фразу, объясняющую, почему именно мы должны защищать.", "en": "Look for the sentence that explains why we in particular must protect."},{"he": "החוקים חוזרים ומזכירים: 'גר לא תונה... כי גרים הייתם בארץ מצרים' (שמות כ\"ב). דוגמה: הזיכרון הלאומי של עבדות הופך לבסיס מוסרי להגנה על החלש היום.", "ar": "تكرر الشرائع: «لا تظلم الغريب... لأنكم كنتم غرباء في أرض مصر» (الخروج 22). مثال: الذاكرة القومية للعبودية تصبح أساسًا أخلاقيًا لحماية الضعيف اليوم.", "ru": "Законы повторяют: «пришельца не притесняй... ибо пришельцами были вы в земле Египетской» (Исход 22). Пример: национальная память о рабстве становится моральной основой защиты слабого сегодня.", "en": "The laws repeat: \"do not wrong a stranger... for you were strangers in the land of Egypt\" (Exodus 22). Example: the national memory of slavery becomes a moral basis for protecting the weak today."},null,[null,{"he": "החוקים עוסקים ביחס אנושי, לא בכספים.", "ar": "الشرائع عن المعاملة الإنسانية لا عن المال.", "ru": "Законы о человеческом отношении, а не о деньгах.", "en": "The laws are about human treatment, not money."},{"he": "החוקים חלים על כל העם ועל כל החלשים, ללא קשר לשבט.", "ar": "تسري على كل الشعب وكل الضعفاء بصرف النظر عن السبط.", "ru": "Они действуют для всего народа и всех слабых, независимо от колена.", "en": "They apply to the whole people and all the weak, regardless of tribe."},{"he": "הנימוק הוא זיכרון הגרות במצרים, לא פיצוי לכוהנים.", "ar": "العلة ذكرى الغربة في مصر لا تعويض الكهنة.", "ru": "Обоснование - память о пришельчестве в Египте, а не компенсация священникам.", "en": "The ground is the memory of being strangers in Egypt, not compensation for priests."}]),
  Q("ch61-2-01",{"he": "אליהו אומר לאחאב: ״הרצחת וגם ירשת״. במה הוא מאשים אותו?", "ar": "يقول إيليا لأخآب: «هل قتلتَ وورثتَ أيضًا؟». بماذا يتهمه؟", "ru": "Илия говорит Ахаву: «Ты убил и ещё вступаешь в наследство?» В чём он его обвиняет?", "en": "Elijah tells Ahab: \"Have you killed and also taken possession?\" What does he accuse him of?"},[{"he": "שאחאב הרג את נבות במו ידיו בקרב ליד העיר", "ar": "أن أخآب قتل نابوت بيده في معركة قرب المدينة", "ru": "Ахав сам убил Навуфея в бою недалеко от своего города Самарии", "en": "Ahab killed Naboth with his own hands in a battle near the city"}, {"he": "שאחאב גנב זהב מאוצר המקדש", "ar": "أن أخآب سرق ذهبًا من خزانة الهيكل", "ru": "Ахав тайно украл золото из сокровищницы храма", "en": "Ahab stole gold from the temple treasury"}, {"he": "שנבות נרצח בעלילה, ואחאב לקח את הכרם", "ar": "أن نابوت قُتل بمكيدة، وأخذ أخآب الكرم", "ru": "Навуфея убили по навету, а Ахав забрал виноградник", "en": "Naboth was killed by a plot, and Ahab took the vineyard"}, {"he": "שאחאב קנה את הכרם במחיר נמוך מדי", "ar": "أن أخآب اشترى الكرم بثمن زهيد جدًا", "ru": "Ахав купил виноградник у Навуфея слишком дёшево", "en": "Ahab bought the vineyard for too low a price"}],2,{"he": "בשאלה יש שני פעלים. כל אחד מתאר מעשה אחר.", "ar": "في السؤال فعلان، وكل منهما يصف فعلًا مختلفًا.", "ru": "В вопросе два глагола, и каждый описывает отдельный поступок.", "en": "The question has two verbs, and each describes a different act."},{"he": "איזבל ארגנה משפט שקר, ונבות נסקל. אחר כך אחאב ירד לרשת את הכרם. אליהו מאשים את אחאב בשני המעשים, גם אם לא הרג בעצמו.", "ar": "دبّرت إيزابل محاكمة كاذبة فرُجم نابوت. ثم نزل أخآب ليرث الكرم. يتهم إيليا أخآب بالفعلين، حتى لو لم يقتل بيده.", "ru": "Иезавель устроила ложный суд, и Навуфея побили камнями. Потом Ахав пошёл завладеть виноградником. Илия обвиняет Ахава в обоих делах, хотя он не убивал сам.", "en": "Jezebel arranged a false trial, and Naboth was stoned. Then Ahab went to take the vineyard. Elijah blames Ahab for both acts, even though he did not kill with his own hands."},null,[{"he": "נבות לא נהרג בקרב; הוא נסקל אחרי משפט שקר.", "ar": "لم يُقتل نابوت في معركة؛ بل رُجم بعد محاكمة كاذبة.", "ru": "Навуфей погиб не в бою; его побили камнями после ложного суда.", "en": "Naboth did not die in battle; he was stoned after a false trial."}, {"he": "הפרק עוסק בכרם של נבות, לא באוצר המקדש.", "ar": "الأصحاح يتناول كرم نابوت، لا خزانة الهيكل.", "ru": "Глава о винограднике Навуфея, а не о сокровищнице храма.", "en": "The chapter is about Naboth's vineyard, not the temple treasury."}, null, {"he": "לא הייתה מכירה; נבות סירב, והכרם נלקח אחרי מותו.", "ar": "لم يكن بيع؛ رفض نابوت، وأُخذ الكرم بعد موته.", "ru": "Продажи не было: Навуфей отказал, и виноградник взяли после его смерти.", "en": "There was no sale; Naboth refused, and the vineyard was taken after his death."}]),
  Q("ch61-2-02",{"he": "למה נבות מסרב למכור את הכרם לאחאב?", "ar": "لماذا يرفض نابوت بيع الكرم لأخآب؟", "ru": "Почему Навуфей отказывается продать виноградник Ахаву?", "en": "Why does Naboth refuse to sell the vineyard to Ahab?"},[{"he": "כי אחאב הציע לו מחיר נמוך מדי בעבור הכרם שלו", "ar": "لأن أخآب عرض عليه ثمنًا منخفضًا جدًا مقابل الكرم", "ru": "потому что Ахав предложил слишком низкую цену", "en": "because Ahab offered him too low a price for the vineyard"}, {"he": "כי הוא כבר הבטיח למכור אותו לאיזבל", "ar": "لأنه وعد ببيعه لإيزابل", "ru": "потому что уже обещал продать его Иезавели", "en": "because he already promised it to Jezebel"}, {"he": "כי אליהו הנביא אסר עליו למכור אותו", "ar": "لأن إيليا منعه من البيع", "ru": "потому что Илия запретил ему продавать", "en": "because the prophet Elijah forbade him to sell it"}, {"he": "כי זו נחלת אבותיו, ואינו רוצה לתת אותה", "ar": "لأنه ميراث آبائه، ولا يريد أن يتخلى عنه", "ru": "потому что это наследие его отцов", "en": "because it is his ancestral inheritance"}],3,{"he": "קראו את תשובת נבות. איזו מילה מתארת את הקרקע?", "ar": "اقرؤوا جواب نابوت. أي كلمة تصف الأرض؟", "ru": "Прочитайте ответ Навуфея. Каким словом названа земля?", "en": "Read Naboth's answer. Which word describes the land?"},{"he": "נבות עונה: ״חלילה לי מה׳ מתתי את נחלת אבתי לך״. בשבילו הכרם אינו סחורה. הוא חלק מהמשפחה ומהקשר לארץ.", "ar": "يجيب نابوت أن الرب يحفظه من أن يعطي ميراث آبائه. الكرم عنده ليس سلعة. إنه جزء من العائلة ومن الارتباط بالأرض.", "ru": "Навуфей отвечает: да сохранит меня Господь, чтобы я отдал тебе наследие отцов. Для него виноградник — не товар. Это часть семьи и связи с землёй.", "en": "Naboth answers: the LORD forbid that I give you my fathers' inheritance. For him the vineyard is not goods for sale. It is part of family and of the tie to the land."},null,[{"he": "אחאב הציע כרם טוב יותר או כסף, ונבות סירב בכל זאת.", "ar": "عرض أخآب كرمًا أفضل أو مالًا، ومع ذلك رفض نابوت.", "ru": "Ахав предлагал лучший виноградник или деньги, но Навуфей всё равно отказал.", "en": "Ahab offered a better vineyard or money, and Naboth still refused."}, {"he": "נבות לא מציע את הכרם לאף אחד אחר.", "ar": "لا يعرض نابوت الكرم على أحد آخر.", "ru": "Навуфей никому другому виноградник не предлагает.", "en": "Naboth does not offer the vineyard to anyone else."}, {"he": "אליהו מופיע רק אחרי מות נבות, ולא מדבר איתו.", "ar": "يظهر إيليا بعد موت نابوت فقط، ولا يكلّمه.", "ru": "Илия появляется только после смерти Навуфея и с ним не говорит.", "en": "Elijah appears only after Naboth's death and never speaks with him."}, null]),
  Q("ch61-2-03",{"he": "עמוס מוכיח את ישראל על ״מכרם בכסף צדיק ואביון בעבור נעלים״. על מה הביקורת?", "ar": "يوبّخ عاموس إسرائيل لأنهم «باعوا البار بالفضة والبائس لأجل نعلين». ما موضوع النقد؟", "ru": "Амос обличает Израиль за то, что «продают праведника за серебро и бедного за пару сандалий». Что он критикует?", "en": "Amos rebukes Israel for \"selling the righteous for silver and the needy for a pair of sandals.\" What is the critique?"},[{"he": "ניצול של העני ומכירתו בשביל רווח קטן", "ar": "استغلال الفقير وبيعه لأجل ربح صغير", "ru": "эксплуатацию бедного ради мелкой выгоды", "en": "exploiting the poor and selling them for a small gain"}, {"he": "מחיר גבוה מדי של נעליים ובגדים בשוק העיר", "ar": "ارتفاع ثمن الأحذية والثياب في سوق المدينة", "ru": "слишком высокую цену обуви и одежды на рынке", "en": "shoe and clothing prices being too high in the city market"}, {"he": "מעט מדי קורבנות שהעם מביא למקדש", "ar": "قلة القرابين التي يقدّمها الشعب للهيكل", "ru": "слишком мало жертв в храме", "en": "too few sacrifices brought to the temple"}, {"he": "מלחמה של ישראל נגד העמים השכנים", "ar": "حرب إسرائيل على الشعوب المجاورة", "ru": "войну Израиля с соседями", "en": "Israel's war against the neighboring nations"}],0,{"he": "מה שווה זוג נעליים לעומת חיי אדם?", "ar": "كم يساوي زوج نعلين مقارنةً بحياة إنسان؟", "ru": "Сколько стоит пара сандалий по сравнению с жизнью человека?", "en": "What is a pair of sandals worth compared to a human life?"},{"he": "עמוס מתאר אנשים שמוכרים את החלש בכסף, ואפילו בשביל זוג נעליים. הדימוי מראה כמה זול נחשב העני. לפי הנביא, זה חטא חמור.", "ar": "يصف عاموس أناسًا يبيعون الضعيف بالفضة، بل لأجل نعلين. الصورة تُظهر كم يُعدّ الفقير رخيصًا. وبحسب النبي، هذه خطيئة خطيرة.", "ru": "Амос описывает людей, продающих слабого за серебро и даже за пару сандалий. Образ показывает, как дёшево ценят бедного. По словам пророка, это тяжкий грех.", "en": "Amos describes people who sell the weak for silver, even for a pair of sandals. The image shows how cheap the poor are made. By the prophet's words, this is a grave sin."},null,[null, {"he": "הנעליים הן דימוי לסכום קטן, לא נושא כלכלי.", "ar": "النعلان صورة لمبلغ صغير، لا موضوع اقتصادي.", "ru": "Сандалии — образ ничтожной суммы, а не тема о ценах.", "en": "The sandals are an image of a tiny sum, not a topic about prices."}, {"he": "הביקורת היא על יחס לאדם, לא על מספר הקורבנות.", "ar": "النقد يتعلق بمعاملة الإنسان، لا بعدد القرابين.", "ru": "Критика касается отношения к людям, а не числа жертв.", "en": "The critique is about treating people, not the number of offerings."}, {"he": "הפסוק מדבר על עוול בתוך העם, לא על מלחמה.", "ar": "الآية تتحدث عن ظلم داخل الشعب، لا عن حرب.", "ru": "Стих говорит о несправедливости внутри народа, а не о войне.", "en": "The verse speaks of injustice within the people, not of war."}]),
  Q("ch61-2-04",{"he": "ירמיהו מזהיר מפני האמירה ״היכל ה׳ היכל ה׳ היכל ה׳ המה״. ממה הוא מזהיר?", "ar": "يحذّر إرميا من القول «هيكل الرب، هيكل الرب، هيكل الرب هو». ممّ يحذّر؟", "ru": "Иеремия предостерегает от слов «Здесь храм Господень, храм Господень, храм Господень». От чего он предостерегает?", "en": "Jeremiah warns against saying \"The temple of the LORD, the temple of the LORD, the temple of the LORD.\" What is he warning against?"},[{"he": "מבניית מקדש שני ומתחרה במקום אחר רחוק בארץ יהודה", "ar": "من بناء هيكل ثانٍ منافس في مكان آخر بعيد من أرض يهوذا", "ru": "от постройки второго, соперничающего храма в другом месте страны", "en": "from building a second, rival temple elsewhere in the land of Judah"}, {"he": "מביטחון שהמקדש יגן עליהם בלי תיקון המעשים", "ar": "من الثقة بأن الهيكل سيحميهم دون إصلاح أعمالهم", "ru": "от уверенности, что храм защитит их без исправления дел", "en": "from trusting the temple to save them despite their deeds"}, {"he": "מאמירת שם ה׳ בקול רם ליד שערי המקדש", "ar": "من نطق اسم الرب بصوت عالٍ قرب الهيكل", "ru": "от громкого произнесения имени Господа у храма", "en": "from saying the LORD's name aloud near the temple gates"}, {"he": "מכניסה של זרים ושל נוכרים לחצר המקדש", "ar": "من دخول الغرباء إلى ساحة الهيكل", "ru": "от входа чужеземцев во двор храма", "en": "from letting foreigners and strangers into the temple court"}],1,{"he": "מה האנשים חושבים שיקרה להם בזכות המקום?", "ar": "ماذا يظن الناس أنه سيحدث لهم بفضل المكان؟", "ru": "Что, по мнению людей, место им гарантирует?", "en": "What do the people think the place will do for them?"},{"he": "העם חזר על המילים כמו קמע. ירמיהו אומר שמי שגונב, רוצח ועושק לא יינצל בזכות המקדש. לפי הנביא, הבית הפך ל״מערת פרצים״.", "ar": "كرّر الشعب الكلمات كأنها تعويذة. يقول إرميا إن من يسرق ويقتل ويظلم لن ينجو بفضل الهيكل. وبحسب النبي صار البيت «مغارة لصوص».", "ru": "Народ повторял эти слова как оберег. Иеремия говорит: кто крадёт, убивает и притесняет, не спасётся благодаря храму. По словам пророка, дом стал «вертепом разбойников».", "en": "The people repeated the words like a charm. Jeremiah says those who steal, murder and oppress will not be saved by the temple. By the prophet's words, the house became a \"den of robbers.\""},null,[{"he": "ירמיהו לא מדבר על מקדש נוסף, אלא על המקדש הקיים.", "ar": "لا يتحدث إرميا عن هيكل آخر، بل عن الهيكل القائم.", "ru": "Иеремия говорит не о другом храме, а о существующем.", "en": "Jeremiah is not speaking of another temple but of the existing one."}, null, {"he": "הבעיה אינה בקול, אלא בביטחון ריק שבמילים.", "ar": "المشكلة ليست في الصوت، بل في الثقة الفارغة في الكلمات.", "ru": "Проблема не в громкости, а в пустой уверенности этих слов.", "en": "The problem is not the volume but the empty confidence in the words."}, {"he": "בפרק ז׳ הביקורת היא על מעשי העם עצמו, לא על זרים.", "ar": "في الأصحاح 7 النقد موجّه لأعمال الشعب نفسه، لا للغرباء.", "ru": "В главе 7 критика направлена на дела самого народа, а не на чужеземцев.", "en": "In chapter 7 the critique targets the people's own deeds, not foreigners."}]),
  Q("ch61-2-05",{"he": "ביחזקאל ל״ז העם אומר: ״יבשו עצמותינו ואבדה תקותנו״. מה המשפט מלמד על מצבו?", "ar": "في حزقيال 37 يقول الشعب: «يبست عظامنا وهلك رجاؤنا». ماذا تعلّمنا الجملة عن حاله؟", "ru": "В Иезекииле 37 народ говорит: «Иссохли кости наши, и погибла надежда наша». Что это говорит о его состоянии?", "en": "In Ezekiel 37 the people say: \"Our bones are dried up and our hope is lost.\" What does this show about their state?"},[{"he": "העם סובל ממחלה ממשית בעצמות", "ar": "الشعب يعاني مرضًا حقيقيًا في العظام", "ru": "народ страдает настоящей болезнью костей", "en": "the people suffer from a real bone disease"}, {"he": "העם בטוח שישוב מהר לארצו", "ar": "الشعب واثق أنه سيعود قريبًا إلى أرضه", "ru": "народ уверен, что скоро вернётся на родину", "en": "the people are sure they will soon return home"}, {"he": "העם בגלות מיואש ומרגיש שאין לו עתיד", "ar": "الشعب في السبي يائس ويشعر أنه بلا مستقبل", "ru": "народ в изгнании отчаялся и не видит будущего", "en": "the exiled people are in despair and feel they have no future"}, {"he": "העם כועס על הנביא ודורש ממנו לשתוק ולעזוב", "ar": "الشعب غاضب على النبي ويطالبه بالصمت والرحيل فورًا", "ru": "народ сердится на пророка и требует, чтобы он молчал и ушёл", "en": "the people are angry at the prophet and demand his silence and exit"}],2,{"he": "מה המשמעות של עצם יבשה לגמרי?", "ar": "ما معنى عظم يابس تمامًا؟", "ru": "Что значит совсем сухая кость?", "en": "What does a completely dry bone mean?"},{"he": "העצמות היבשות הן דימוי לעם שאיבד תקווה בגלות. החזון עונה בדיוק על התחושה הזאת. לפי הנביא, גם ממצב כזה אפשר לקום.", "ar": "العظام اليابسة صورة لشعب فقد الرجاء في السبي. والرؤيا تجيب على هذا الشعور بالذات. وبحسب النبي يمكن النهوض حتى من حال كهذه.", "ru": "Сухие кости — образ народа, потерявшего надежду в изгнании. Видение отвечает именно на это чувство. По словам пророка, подняться можно даже из такого состояния.", "en": "The dry bones picture a people that lost hope in exile. The vision answers exactly this feeling. By the prophet's words, rising is possible even from such a state."},null,[{"he": "העצמות היבשות הן דימוי לייאוש, לא תיאור רפואי.", "ar": "العظام اليابسة صورة لليأس، لا وصف طبي.", "ru": "Сухие кости — образ отчаяния, а не медицинское описание.", "en": "The dry bones are an image of despair, not a medical report."}, {"he": "״אבדה תקותנו״ אומר את ההפך מביטחון בשיבה.", "ar": "«هلك رجاؤنا» تقول عكس الثقة بالعودة.", "ru": "«Погибла надежда наша» — противоположность уверенности в возвращении.", "en": "\"Our hope is lost\" says the opposite of confidence in return."}, null, {"he": "במשפט אין פנייה לנביא ואין כעס עליו.", "ar": "لا توجد في الجملة مخاطبة للنبي ولا غضب عليه.", "ru": "В этих словах нет обращения к пророку и нет гнева на него.", "en": "The sentence does not address the prophet or show anger at him."}]),
  Q("ch61-2-06",{"he": "אמציה כוהן בית אל אומר לעמוס לברוח לארץ יהודה (עמוס ז׳). מה העימות מלמד על תפקיד הנביא?", "ar": "يقول أمصيا كاهن بيت إيل لعاموس أن يهرب إلى أرض يهوذا (عاموس 7). ماذا تعلّمنا المواجهة عن دور النبي؟", "ru": "Амасия, священник Вефиля, велит Амосу бежать в Иудею (Амос 7). Что этот спор говорит о роли пророка?", "en": "Amaziah the priest of Bethel tells Amos to flee to Judah (Amos 7). What does the clash show about the prophet's role?"},[{"he": "הנביא הוא עובד של המקדש ומקבל ממנו שכר קבוע", "ar": "النبي موظف في الهيكل ويتقاضى منه أجرًا ثابتًا كل شهر", "ru": "пророк — служитель храма и получает там постоянную плату", "en": "the prophet is a temple employee who gets a steady wage from it"}, {"he": "הנביא תמיד מסכים עם הכוהנים", "ar": "النبي يوافق الكهنة دائمًا", "ru": "пророк всегда согласен со священниками", "en": "the prophet always agrees with the priests"}, {"he": "הנביא מדבר רק בארץ שבה נולד", "ar": "النبي يتكلم فقط في البلد الذي وُلد فيه", "ru": "пророк говорит только в своей родной стране", "en": "the prophet speaks only in the land of his birth"}, {"he": "הנביא אומר דברים קשים גם מול כוהן ומלך", "ar": "النبي يتكلم بقسوة حتى أمام الكاهن والملك", "ru": "пророк говорит резко даже с царём и священником", "en": "the prophet speaks hard words even to priest and king"}],3,{"he": "מי שולט במקדש בבית אל, ולמה הוא רוצה שעמוס ילך?", "ar": "من يسيطر على هيكل بيت إيل، ولماذا يريد رحيل عاموس؟", "ru": "Кто распоряжается храмом в Вефиле и почему хочет, чтобы Амос ушёл?", "en": "Who controls the Bethel temple, and why does he want Amos gone?"},{"he": "אמציה רוצה להרחיק את עמוס, כי דבריו מאיימים על המלך ועל המקדש. עמוס לא נסוג. לפי הסיפור, הנביא נאמן לשליחות ולא לבעלי הכוח.", "ar": "يريد أمصيا إبعاد عاموس لأن كلامه يهدد الملك والهيكل. لا يتراجع عاموس. وبحسب القصة، النبي أمين لرسالته لا لأصحاب السلطة.", "ru": "Амасия хочет удалить Амоса, потому что его слова угрожают царю и храму. Амос не отступает. По рассказу, пророк верен поручению, а не власти.", "en": "Amaziah wants Amos gone because his words threaten the king and the temple. Amos does not back down. By the story, the prophet is loyal to his mission, not to the powerful."},null,[{"he": "עמוס אומר שאינו נביא מקצועי, ולא מתפרנס מנבואה.", "ar": "يقول عاموس إنه ليس نبيًا محترفًا ولا يعتاش من النبوة.", "ru": "Амос говорит, что не профессиональный пророк и не живёт пророчеством.", "en": "Amos says he is no professional prophet and does not live off prophecy."}, {"he": "הפרק מתאר דווקא עימות חריף בין עמוס לכוהן.", "ar": "الأصحاح يصف مواجهة حادة بين عاموس والكاهن.", "ru": "Глава описывает как раз острый спор Амоса со священником.", "en": "The chapter describes a sharp clash between Amos and the priest."}, {"he": "עמוס בא מתקוע שביהודה, ומנבא בממלכת ישראל.", "ar": "جاء عاموس من تقوع في يهوذا، وتنبأ في مملكة إسرائيل.", "ru": "Амос родом из Фекои в Иудее, а пророчествует в Израиле.", "en": "Amos comes from Tekoa in Judah and prophesies in the kingdom of Israel."}, null])],
 [
  Q("bib-choice-1261-4",{"he": "איזה תיאור מתאים לקהלת והמחזוריות?", "ar": "أي وصف يناسب الجامعة ودورات الطبيعة؟", "ru": "Какое описание подходит к «Екклесиаст и циклы»?", "en": "Which description fits Ecclesiastes and cycles?"},[{"he": "ביחזקאל ל״ז חזון העצמות מציג תחייה כדימוי לתקווה לעם מיואש.", "ar": "في حزقيال 37 تعرض رؤيا العظام حياة جديدة صورةً لأمل شعب يائس.", "ru": "В Иезекииле 37 оживление костей служит образом надежды для отчаявшегося народа.", "en": "In Ezekiel 37 the bones’ revival pictures hope for a despairing people."},{"he": "בירמיהו א׳ הנביא חושש שאינו יודע לדבר מפני שהוא צעיר, ונענה שלא יישאר לבדו.", "ar": "في إرميا 1 يخاف النبي لأنه فتى لا يحسن الكلام، فيُطمأن بأنه ليس وحده.", "ru": "В Иеремии 1 пророк опасается, что молод и не умеет говорить, и получает заверение в поддержке.", "en": "In Jeremiah 1 the prophet worries that he is young and cannot speak; he is reassured of support."},{"he": "בחוקי התורה חוזרת הדרישה להגן על גר, יתום ואלמנה.", "ar": "تتكرر في قوانين التوراة مطالب حماية الغريب واليتيم والأرملة.", "ru": "В законах Торы повторяется требование защищать пришельца, сироту и вдову.", "en": "Torah laws repeatedly call for protecting the stranger, orphan and widow."},{"he": "בקהלת א׳ תנועות חוזרות בטבע משמשות רקע לשאלת התועלת בעמל האדם.", "ar": "في الجامعة 1 تشكل حركات الطبيعة المتكررة خلفية للسؤال عن جدوى تعب الإنسان.", "ru": "В Екклесиасте 1 повторяющиеся движения природы служат фоном вопроса о пользе человеческого труда.", "en": "In Ecclesiastes 1 recurring motions of nature frame a question about the gain from human toil."}],3,{"he": "חפשו את הפרט שמבדיל אותו מן האחרים.", "ar": "ابحثوا عن التفصيل الذي يميزه عن غيره.", "ru": "Ищите отличие от остальных вариантов.", "en": "Look for the detail that separates it from the others."},{"he": "הטבע החוזר מציב את שאלת חיי האדם בהקשר רחב.", "ar": "تضع دورات الطبيعة سؤال حياة الإنسان في سياق أوسع.", "ru": "Повторяемость природы задаёт более широкий контекст вопросу о жизни.", "en": "Nature’s cycles set a wider frame for the question of human life."},null,[{"he": "זה מתאר את חזון העצמות היבשות, לא את קהלת והמחזוריות.", "ar": "هذا يصف رؤيا العظام اليابسة، لا الجامعة ودورات الطبيعة.", "ru": "Это описание «Видение сухих костей», а не «Екклесиаст и циклы».", "en": "That describes vision of dry bones, not Ecclesiastes and cycles."},{"he": "זה מתאר את הקדשת ירמיהו, לא את קהלת והמחזוריות.", "ar": "هذا يصف تكليف إرميا، لا الجامعة ودورات الطبيعة.", "ru": "Это описание «Призвание Иеремии», а не «Екклесиаст и циклы».", "en": "That describes Jeremiah’s calling, not Ecclesiastes and cycles."},{"he": "זה מתאר את חוק על יחס לחלש, לא את קהלת והמחזוריות.", "ar": "هذا يصف قانون معاملة الضعيف، لا الجامعة ودورات الطبيعة.", "ru": "Это описание «Закон о защите слабого», а не «Екклесиаст и циклы».", "en": "That describes law on treatment of the vulnerable, not Ecclesiastes and cycles."},null])
 ,Q("bib-choice61-kohelet",{"he": "מה מלמדת טענתו של קהלת 'אין כל חדש תחת השמש'?", "ar": "ماذا تعلّم مقولة الجامعة «لا جديد تحت الشمس»؟", "ru": "Чему учит утверждение Экклезиаста «нет ничего нового под солнцем»?", "en": "What does Ecclesiastes' claim \"there is nothing new under the sun\" teach?"},[{"he": "המחזוריות מזמינה ענווה: מה שנראה לנו חדש כבר היה, ולכן כדאי ללמוד מן העבר", "ar": "الدورية تدعو إلى التواضع: ما يبدو لنا جديدًا كان من قبل، لذا يستحسن التعلم من الماضي", "ru": "Цикличность приглашает к смирению: то, что кажется новым, уже было, и потому стоит учиться у прошлого", "en": "The cyclical view invites humility: what seems new has already been, so it pays to learn from the past"},{"he": "אסור לחדש דבר בעולם", "ar": "يُمنع ابتكار أي شيء في العالم", "ru": "Запрещено создавать что-либо новое в мире", "en": "It is forbidden to invent anything in the world"},{"he": "הטבע עצמו אינו משתנה לעולם", "ar": "الطبيعة نفسها لا تتغير أبدًا", "ru": "Сама природа никогда не меняется", "en": "Nature itself never changes"},{"he": "קהלת מספק הוכחה מדעית למחזוריות", "ar": "الجامعة يقدم برهانًا علميًا على الدورية", "ru": "Экклезиаст даёт научное доказательство цикличности", "en": "Ecclesiastes provides scientific proof of cyclicality"}],0,{"he": "חשבו איזו עמדה כלפי החיים נובעת מהמחזוריות.", "ar": "فكّروا أي موقف من الحياة ينتج عن الدورية.", "ru": "Подумайте, какое отношение к жизни следует из цикличности.", "en": "Think about what attitude to life follows from cyclicality."},{"he": "קהלת א' פותח במחזורי הטבע והדורות: 'מה שהיה הוא שיהיה'. דוגמה: דור חושב שהמציא הכל, והקטע מזכיר שגם לפנינו חשבו כך. זו לא איסור חדוש אלא קריאה לפרופורציה.", "ar": "يفتتح الجامعة 1 بدورات الطبيعة والأجيال: «ما كان هو ما يكون». مثال: جيل يظن أنه اخترع كل شيء، والمقطع يذكّر أن من قبلنا ظنوا ذلك أيضًا. هذه ليست منعًا للابتكار بل دعوة إلى التواضع.", "ru": "Экклезиаст 1 открывается циклами природы и поколений: «что было, то и будет». Пример: поколение думает, что изобрело всё, а текст напоминает, что и до нас так думали. Это не запрет новизны, а призыв к мере.", "en": "Ecclesiastes 1 opens with the cycles of nature and generations: \"what has been is what will be\". Example: a generation thinks it invented everything, and the passage reminds us that those before us thought so too. It is not a ban on novelty but a call for proportion."},null,[null,{"he": "הקטע אינו צו; הוא תיאור שמזמין עמדה, לא איסור.", "ar": "المقطع ليس أمرًا؛ هو وصف يدعو إلى موقف لا منعًا.", "ru": "Текст не предписание; это описание, приглашающее к отношению, а не запрет.", "en": "The passage is not a command; it is a description inviting an attitude, not a ban."},{"he": "קהלת מדבר על מעשה האדם ודורותיו, לא על קיבוע הטבע.", "ar": "الجامعة يتكلم عن فعل الإنسان وأجياله لا عن تجميد الطبيعة.", "ru": "Экклезиаст говорит о делах человека и поколениях, а не о застывшей природе.", "en": "Ecclesiastes speaks of human deeds and generations, not of frozen nature."},{"he": "זהו טקסט חכמה, לא ניסוי מדעי; ה'הוכחה' היא שקילה על החיים.", "ar": "هذا نص حكمة لا تجربة علمية؛ «البرهان» تأمل في الحياة.", "ru": "Это текст мудрости, а не научный опыт; «доказательство» - размышление о жизни.", "en": "This is wisdom literature, not a scientific experiment; the \"proof\" is a reflection on life."}]),Q("bib-choice61-prophet-now",{"he": "תלמיד טוען שהנביאים דיברו רק על העתיד הרחוק. איזו התייחסות הולמת?", "ar": "يدّعي طالب أن الأنبياء تكلموا فقط عن المستقبل البعيد. أي معالجة مناسبة؟", "ru": "Ученик утверждает, что пророки говорили только о далёком будущем. Какой подход уместен?", "en": "A student claims the prophets spoke only about the far future. Which response is fitting?"},[{"he": "הנבואה פונה קודם לדור שלה: ביקורת חברתית ומוסרית על ההווה, לצד ציפייה לעתיד", "ar": "النبوة تخاطب أولًا جيلها: نقد اجتماعي وأخلاقي للحاضر، مع تطلع للمستقبل", "ru": "Пророчество обращено прежде всего к своему поколению: социальная и нравственная критика настоящего, наряду с ожиданием будущего", "en": "Prophecy addresses its own generation first: social and moral criticism of the present, alongside hope for the future"},{"he": "הטענה נכונה לחלוטין", "ar": "الادعاء صحيح تمامًا", "ru": "Утверждение совершенно верно", "en": "The claim is entirely correct"},{"he": "הנביאים דיברו רק על העבר", "ar": "الأنبياء تكلموا فقط عن الماضي", "ru": "Пророки говорили только о прошлом", "en": "The prophets spoke only about the past"},{"he": "אין בנבואה שום התייחסות לחברה", "ar": "لا توجد في النبوة أي إشارة إلى المجتمع", "ru": "В пророчестве нет никакого отношения к обществу", "en": "Prophecy has no reference to society at all"}],0,{"he": "מצאו נביא שפונה לאנשי זמנו על מעשיהם.", "ar": "ابحثوا عن نبي يخاطب أهل زمانه عن أفعالهم.", "ru": "Найдите пророка, обращающегося к современникам об их делах.", "en": "Find a prophet addressing his contemporaries about their deeds."},{"he": "ישעיהו א' למשל פונה ישירות לדורו: 'ידע שור קונהו... ישראל לא ידע'. דוגמה: הביקורת על עוול חברתי היא בלב הנבואה, והחזון העתידי נשען עליה. לכן 'רק עתיד רחוק' מחמיצ את העיקר.", "ar": "إشعياء 1 مثلًا يخاطب جيله مباشرة: «عرف الثور قانيه... إسرائيل لم يعرف». مثال: النقد على الظلم الاجتماعي في قلب النبوة، والرؤيا المستقبلية تستند إليه. لذلك «فقط مستقبل بعيد» يفوّت الجوهر.", "ru": "Исаия 1, например, обращается прямо к своему поколению: «вол знает владетеля своего... а Израиль не знает». Пример: критика социальной несправедливости - в сердце пророчества, и будущее видение опирается на неё. Поэтому «только далёкое будущее» упускает главное.", "en": "Isaiah 1, for example, addresses his generation directly: \"the ox knows its owner... Israel does not know\". Example: criticism of social wrongs is at prophecy's heart, and the future vision rests on it. So \"only the far future\" misses the core."},null,[null,{"he": "הטקסטים עצמם מראים פנייה ישירה להווה; הטענה אינה נכונה.", "ar": "النصوص نفسها تُظهر مخاطبة مباشرة للحاضر؛ الادعاء غير صحيح.", "ru": "Сами тексты показывают прямое обращение к настоящему; утверждение неверно.", "en": "The texts themselves show direct address to the present; the claim is not correct."},{"he": "העבר מוזכר, אך הדגש הוא על ההווה והעתיד.", "ar": "الماضي يُذكر، لكن التأكيد على الحاضر والمستقبل.", "ru": "Прошлое упоминается, но акцент - на настоящем и будущем.", "en": "The past is mentioned, but the stress is on present and future."},{"he": "דווקא ההתייחסות לחברה היא ממוקדי הנבואה.", "ar": "الإشارة إلى المجتمع هي بالذات من محاور النبوة.", "ru": "Именно отношение к обществу - один из центров пророчества.", "en": "Reference to society is precisely one of prophecy's cores."}]),
  Q("ch61-3-01",{"he": "ישעיהו א׳, עמוס, מיכה ו׳ וירמיהו ז׳ מדברים על פולחן. מהי הטענה המשותפת להם?", "ar": "يتحدث إشعياء 1 وعاموس وميخا 6 وإرميا 7 عن العبادة. ما الفكرة المشتركة بينهم؟", "ru": "Исаия 1, Амос, Михей 6 и Иеремия 7 говорят о культе. Какова их общая мысль?", "en": "Isaiah 1, Amos, Micah 6 and Jeremiah 7 speak about worship. What claim do they share?"},[{"he": "פולחן אינו מתקבל כשהוא בא במקום צדק ויושר", "ar": "العبادة لا تُقبل عندما تأتي بدل العدل والاستقامة", "ru": "культ не принимается, когда он заменяет справедливость", "en": "worship is not accepted when it replaces justice and honesty"}, {"he": "קורבנות חשובים יותר מן היחס לחלש", "ar": "القرابين أهم من طريقة معاملة الضعيف", "ru": "жертвы важнее отношения к слабым", "en": "sacrifices matter more than how the weak are treated"}, {"he": "רק המלך ושריו אחראים לעוול שנעשה בארץ, ולא העם", "ar": "الملك ورؤساؤه وحدهم مسؤولون عن الظلم في البلاد، لا الشعب", "ru": "только царь и вельможи отвечают за несправедливость в стране, а не народ", "en": "only the king and his officials are responsible for injustice, not the people"}, {"he": "הנביאים מבקשים להפסיק כל תפילה וכל קורבן", "ar": "الأنبياء يطلبون وقف كل صلاة وكل قربان", "ru": "пророки требуют прекратить всякую молитву и жертву", "en": "the prophets ask to stop all prayer and all offerings"}],0,{"he": "שימו לב למה הנביאים מעמידים מול הקורבנות.", "ar": "انتبهوا إلى ما يضعه الأنبياء مقابل القرابين.", "ru": "Обратите внимание, что пророки противопоставляют жертвам.", "en": "Notice what the prophets set against the offerings."},{"he": "כל הנביאים האלה מעמידים את הקורבן מול המעשים. לפיהם, מי שעושק את החלש לא יכול לקנות קרבה לאלוהים בקורבן. המוסר הוא התנאי לפולחן.", "ar": "كل هؤلاء الأنبياء يضعون القربان مقابل الأعمال. بحسبهم، من يظلم الضعيف لا يستطيع شراء القرب من الله بقربان. الأخلاق شرط للعبادة.", "ru": "Все эти пророки противопоставляют жертву делам. По их словам, притеснитель слабого не купит близость к Богу жертвой. Мораль — условие культа.", "en": "All these prophets set the offering against deeds. By their words, one who oppresses the weak cannot buy closeness to God with a sacrifice. Ethics is the condition for worship."},null,[null, {"he": "הנביאים טוענים את ההפך: בלי צדק, הקורבן לא רצוי.", "ar": "يقول الأنبياء العكس: بلا عدل، القربان غير مقبول.", "ru": "Пророки утверждают обратное: без справедливости жертва неугодна.", "en": "The prophets claim the opposite: without justice the offering is unwanted."}, {"he": "הנביאים פונים לכל העם, לא רק למלך.", "ar": "الأنبياء يخاطبون الشعب كله، لا الملك وحده.", "ru": "Пророки обращаются ко всему народу, а не только к царю.", "en": "The prophets address the whole people, not only the king."}, {"he": "הביקורת היא על פולחן ללא מוסר, לא על התפילה עצמה.", "ar": "النقد موجّه لعبادة بلا أخلاق، لا للصلاة نفسها.", "ru": "Критика направлена на культ без морали, а не на саму молитву.", "en": "The critique targets worship without ethics, not prayer itself."}]),
  Q("ch61-3-02",{"he": "מה משותף לאליהו מול אחאב (כרם נבות) ולנתן מול דוד (שמואל ב י״ב)?", "ar": "ما المشترك بين إيليا أمام أخآب (كرم نابوت) وناثان أمام داود (صموئيل الثاني 12)؟", "ru": "Что общего между Илией перед Ахавом (виноградник Навуфея) и Нафаном перед Давидом (2 Царств 12)?", "en": "What do Elijah facing Ahab (Naboth's vineyard) and Nathan facing David (2 Samuel 12) have in common?"},[{"he": "נביא עוזר למלך לנצח במלחמה נגד אויב", "ar": "نبي يساعد الملك على الانتصار في حرب", "ru": "пророк помогает царю победить в войне", "en": "a prophet helps a king win a war against an enemy"}, {"he": "נביא מוכיח מלך שניצל את כוחו נגד אדם חלש ממנו", "ar": "نبي يوبّخ ملكًا استغل سلطته ضد إنسان أضعف منه", "ru": "пророк обличает царя за насилие над слабым", "en": "a prophet rebukes a king who abused a weaker man"}, {"he": "נביא ממנה מלך חדש במקום המלך החוטא", "ar": "نبي يمسح ملكًا جديدًا بدل الملك الخاطئ", "ru": "пророк помазывает нового царя вместо согрешившего", "en": "a prophet anoints a new king in place of the sinner"}, {"he": "נביא מסכים לחטא, כי לדעתו המלך עומד מעל החוק והמשפט", "ar": "نبي يقبل الخطيئة لأنه يرى أن الملك فوق القانون والقضاء", "ru": "пророк мирится с грехом, ведь царь стоит выше закона", "en": "a prophet accepts the sin since the king stands above the law"}],1,{"he": "השוו מי חזק ומי חלש בכל סיפור.", "ar": "قارنوا من القوي ومن الضعيف في كل قصة.", "ru": "Сравните, кто сильный и кто слабый в каждом рассказе.", "en": "Compare who is strong and who is weak in each story."},{"he": "דוד לקח את בת שבע וגרם למות אוריה. אחאב לקח את כרם נבות אחרי שנרצח. בשני הסיפורים הנביא עומד מול המלך ואומר לו שהוא אשם.", "ar": "أخذ داود بثشبع وتسبب بموت أوريا. وأخذ أخآب كرم نابوت بعد قتله. في القصتين يقف النبي أمام الملك ويقول له إنه مذنب.", "ru": "Давид взял Вирсавию и погубил Урию. Ахав забрал виноградник убитого Навуфея. В обоих рассказах пророк встаёт перед царём и называет его виновным.", "en": "David took Bathsheba and caused Uriah's death. Ahab took Naboth's vineyard after his murder. In both stories the prophet faces the king and tells him he is guilty."},null,[{"he": "בשני הסיפורים אין מלחמה; העוול נעשה נגד אזרח.", "ar": "لا حرب في القصتين؛ الظلم وقع على مواطن.", "ru": "В обоих рассказах нет войны: зло причинено подданному.", "en": "Neither story is about war; the wrong is done to a subject."}, null, {"he": "בשני הסיפורים הנביא מוכיח את המלך, ולא ממנה מלך אחר.", "ar": "في القصتين يوبّخ النبي الملك، ولا يمسح ملكًا آخر.", "ru": "В обоих рассказах пророк обличает царя, а не помазывает другого.", "en": "In both stories the prophet rebukes the king; he anoints no one else."}, {"he": "שני הנביאים טוענים שגם המלך כפוף לצדק.", "ar": "يرى النبيان أن الملك أيضًا خاضع للعدل.", "ru": "Оба пророка утверждают, что и царь подчинён справедливости.", "en": "Both prophets claim the king too is bound by justice."}]),
  Q("ch61-3-03",{"he": "עמוס אומר: ״ויגל כמים משפט וצדקה כנחל איתן״. מה הדימוי מוסיף?", "ar": "يقول عاموس: «ليجرِ الحق كالمياه والبرّ كنهر دائم». ماذا تضيف الصورة؟", "ru": "Амос говорит: «Пусть, как вода, течёт суд, и правда — как сильный поток». Что добавляет образ?", "en": "Amos says: \"Let justice roll down like waters, and righteousness like an ever-flowing stream.\" What does the image add?"},[{"he": "שיש לבנות תעלות מים חדשות בכל ערי ארץ ישראל", "ar": "أنه يجب بناء قنوات مياه جديدة في كل مدن أرض إسرائيل", "ru": "что нужно строить новые каналы во всех городах Земли Израиля", "en": "that water channels must be built in every town of the land of Israel"}, {"he": "שהצדק חזק כמו שיטפון ומחריב את הכול", "ar": "أن العدل قوي كالفيضان ويهدم كل شيء", "ru": "что справедливость, как потоп, всё разрушает", "en": "that justice is like a flood that destroys everything"}, {"he": "שהצדק צריך לזרום תמיד, ולא רק לפעמים", "ar": "أن العدل يجب أن يجري دائمًا، لا أحيانًا فقط", "ru": "что справедливость должна течь всегда, а не изредка", "en": "that justice must flow all the time, not only now and then"}, {"he": "שהמשפט צריך להיעשות רק ליד נהר", "ar": "أن القضاء يجب أن يجري قرب نهر فقط", "ru": "что суд должен проходить только у реки", "en": "that trials should be held only beside a river"}],2,{"he": "מה ההבדל בין נחל שמתייבש בקיץ לנחל איתן?", "ar": "ما الفرق بين نهر يجف في الصيف ونهر دائم؟", "ru": "Чем ручей, пересыхающий летом, отличается от неиссякающего?", "en": "How is a stream that dries in summer different from an ever-flowing one?"},{"he": "בארץ ישראל רוב הנחלים מתייבשים בקיץ. נחל איתן זורם כל השנה. לפי עמוס, הצדק צריך להיות כזה: קבוע ובשפע, ולא מעשה חד־פעמי.", "ar": "في أرض إسرائيل تجف معظم الأنهار في الصيف. أما النهر الدائم فيجري طوال السنة. وبحسب عاموس يجب أن يكون العدل كذلك: ثابتًا وغزيرًا، لا فعلًا لمرة واحدة.", "ru": "В Земле Израиля большинство ручьёв летом пересыхает. Неиссякающий поток течёт весь год. По Амосу, справедливость должна быть такой: постоянной и обильной, а не разовой.", "en": "In the land of Israel most streams dry up in summer. An ever-flowing stream runs all year. By Amos, justice should be like that: constant and abundant, not a one-time act."},null,[{"he": "המים הם דימוי לצדק, לא הוראה הנדסית.", "ar": "المياه صورة للعدل، لا تعليمات هندسية.", "ru": "Вода — образ справедливости, а не инженерное указание.", "en": "The water is an image of justice, not an engineering instruction."}, {"he": "״נחל איתן״ הוא נחל שלא מתייבש, לא שיטפון הורס.", "ar": "«النهر الدائم» نهر لا يجف، لا فيضان مدمّر.", "ru": "Неиссякающий поток не пересыхает; это не разрушительный потоп.", "en": "An ever-flowing stream never dries up; it is not a destructive flood."}, null, {"he": "הדימוי מתאר את אופי הצדק, לא את מקום המשפט.", "ar": "الصورة تصف طبيعة العدل، لا مكان القضاء.", "ru": "Образ описывает характер справедливости, а не место суда.", "en": "The image describes the nature of justice, not where trials are held."}]),
  Q("ch61-3-04",{"he": "ביחזקאל ל״ז החזון בא קודם, וההסבר בא אחריו. מה ההסבר מגלה על החזון?", "ar": "في حزقيال 37 تأتي الرؤيا أولًا ثم التفسير. ماذا يكشف التفسير عن الرؤيا؟", "ru": "В Иезекииле 37 сначала видение, а потом объяснение. Что объяснение раскрывает о видении?", "en": "In Ezekiel 37 the vision comes first and the explanation after it. What does the explanation reveal?"},[{"he": "שהחזון הוא תיאור של קרב גדול שהתרחש בבקעה הזאת", "ar": "أن الرؤيا وصف لمعركة كبيرة جرت قديمًا في ذلك الوادي", "ru": "что видение описывает большую битву, бывшую в этой долине", "en": "that the vision describes a great battle once fought in the valley"}, {"he": "שהחזון הוא אזהרה מפני מגפה שתבוא", "ar": "أن الرؤيا تحذير من وباء قادم", "ru": "что видение предупреждает о грядущей эпидемии", "en": "that the vision warns of a coming plague"}, {"he": "שהחזון מלמד איך לקבור מתים כראוי", "ar": "أن الرؤيا تعلّم كيف يُدفن الموتى كما يجب", "ru": "что видение учит, как правильно хоронить умерших", "en": "that the vision teaches how to bury the dead properly"}, {"he": "שהחזון הוא סמל לשיבת העם מהגלות לאדמתו", "ar": "أن الرؤيا رمز لعودة الشعب من السبي إلى أرضه", "ru": "что это символ возвращения народа из изгнания", "en": "that it symbolizes the people's return from exile"}],3,{"he": "קראו את דברי ה׳ אחרי שהעצמות קמות.", "ar": "اقرؤوا كلام الرب بعد أن تقوم العظام.", "ru": "Прочитайте слова Господа после того, как кости встают.", "en": "Read the LORD's words after the bones rise."},{"he": "בפסוקים 11–14 ה׳ מפרש את החזון. העצמות הן העם, והקברים הם הגלות. לפי הטקסט, ה׳ מבטיח: ״והבאתי אתכם אל אדמת ישראל״.", "ar": "في الآيات 11–14 يفسّر الرب الرؤيا. العظام هي الشعب، والقبور هي السبي. وبحسب النص يعد الرب بأن يأتي بهم إلى أرض إسرائيل.", "ru": "В стихах 11–14 Господь объясняет видение. Кости — это народ, а гробы — изгнание. По тексту, Господь обещает привести их в землю Израилеву.", "en": "In verses 11–14 the LORD explains the vision. The bones are the people, and the graves are the exile. By the text, the LORD promises to bring them to the land of Israel."},null,[{"he": "הפרק לא מספר על קרב; העצמות הן דימוי לעם.", "ar": "الأصحاح لا يروي معركة؛ العظام صورة للشعب.", "ru": "Глава не рассказывает о битве; кости — образ народа.", "en": "The chapter tells of no battle; the bones are an image of the people."}, {"he": "ההסבר מדבר על תקווה ותקומה, לא על מגפה.", "ar": "التفسير يتحدث عن رجاء وقيامة، لا عن وباء.", "ru": "Объяснение говорит о надежде и возрождении, а не об эпидемии.", "en": "The explanation speaks of hope and renewal, not of plague."}, {"he": "החזון מתאר חזרה לחיים, לא דיני קבורה.", "ar": "الرؤيا تصف عودة إلى الحياة، لا أحكام دفن.", "ru": "Видение описывает возвращение к жизни, а не правила погребения.", "en": "The vision describes return to life, not burial rules."}, null]),
  Q("ch61-3-05",{"he": "איזבל מכריזה על צום ומביאה שני עדים נגד נבות. מה המשמעות של הפרטים האלה?", "ar": "تعلن إيزابل صومًا وتأتي بشاهدين ضد نابوت. ما معنى هذه التفاصيل؟", "ru": "Иезавель объявляет пост и приводит двух свидетелей против Навуфея. Что означают эти детали?", "en": "Jezebel proclaims a fast and brings two witnesses against Naboth. What do these details mean?"},[{"he": "העוול מוסתר מאחורי טקס דתי ומשפט שנראה חוקי", "ar": "الظلم مخفي وراء طقس ديني ومحاكمة تبدو قانونية", "ru": "зло спрятано за религиозным обрядом и законным на вид судом", "en": "a wrong hidden behind a rite and a lawful-looking trial"}, {"he": "איזבל באמת חושבת שנבות חטא ומבקשת משפט הוגן ושקט", "ar": "إيزابل تظن حقًا أن نابوت أخطأ وتريد محاكمة عادلة وهادئة", "ru": "Иезавель правда считает Навуфея виновным и хочет честного и тихого суда", "en": "Jezebel truly thinks Naboth sinned and wants a fair and quiet trial"}, {"he": "העם צם כדי להתאבל על נבות לפני המשפט", "ar": "الشعب يصوم حزنًا على نابوت قبل المحاكمة", "ru": "народ постится в трауре по Навуфею до суда", "en": "the people fast to mourn Naboth before the trial"}, {"he": "הפרטים מראים שאחאב ניהל את המשפט בעצמו", "ar": "التفاصيل تُظهر أن أخآب أدار المحاكمة بنفسه", "ru": "детали показывают, что Ахав сам вёл суд", "en": "the details show Ahab ran the trial himself"}],0,{"he": "מי כתב את המכתבים, ומי נבחר להעיד?", "ar": "من كتب الرسائل، ومن اختير للشهادة؟", "ru": "Кто написал письма и кого выбрали в свидетели?", "en": "Who wrote the letters, and who was chosen to testify?"},{"he": "לפי התורה צריך שני עדים כדי להרשיע. איזבל משתמשת בכלל הזה, אבל העדים משקרים. כך הרצח נראה כמו צדק, והעוול חמור יותר.", "ar": "بحسب التوراة يلزم شاهدان للإدانة. تستخدم إيزابل هذه القاعدة، لكن الشاهدين يكذبان. هكذا يبدو القتل كأنه عدل، ويصبح الظلم أشد.", "ru": "По Торе для осуждения нужны два свидетеля. Иезавель использует это правило, но свидетели лгут. Так убийство выглядит как правосудие, и зло становится тяжелее.", "en": "By the Torah, two witnesses are needed to convict. Jezebel uses this rule, but the witnesses lie. So the murder looks like justice, which makes the wrong worse."},null,[null, {"he": "איזבל מבקשת ״בני בליעל״ כעדים, כלומר עדי שקר.", "ar": "تطلب إيزابل رجالًا أشرارًا شهودًا، أي شهود زور.", "ru": "Иезавель велит найти негодных людей, то есть лжесвидетелей.", "en": "Jezebel asks for worthless men as witnesses, that is, false witnesses."}, {"he": "הצום נקבע לפני ההאשמה, ונבות עוד חי.", "ar": "أُعلن الصوم قبل الاتهام، وكان نابوت لا يزال حيًا.", "ru": "Пост объявлен до обвинения, когда Навуфей ещё жив.", "en": "The fast is set before the charge, while Naboth is still alive."}, {"he": "איזבל כותבת את המכתבים בשם אחאב, ואחאב לא פועל.", "ar": "تكتب إيزابل الرسائل باسم أخآب، وأخآب لا يفعل شيئًا.", "ru": "Иезавель пишет письма от имени Ахава, а он сам бездействует.", "en": "Jezebel writes the letters in Ahab's name, and Ahab does not act."}]),
  Q("ch61-3-06",{"he": "במיכה ו׳ השואל מציע קורבנות שהולכים וגדלים, עד הבכור. מה תפקיד הרשימה?", "ar": "في ميخا 6 يعرض السائل قرابين تكبر شيئًا فشيئًا حتى البكر. ما دور هذه القائمة؟", "ru": "В Михее 6 спрашивающий предлагает всё большие жертвы, вплоть до первенца. Какова роль этого списка?", "en": "In Micah 6 the speaker offers ever larger sacrifices, up to the firstborn. What is the list's role?"},[{"he": "לקבוע איזה קורבן הוא המכובד ביותר בעיני ה׳", "ar": "تحديد أي قربان هو الأكرم عند الرب", "ru": "определить, какая жертва самая почётная перед Господом", "en": "to decide which offering the LORD honors most"}, {"he": "להראות שריבוי קורבנות אינו התשובה הנכונה", "ar": "إظهار أن كثرة القرابين ليست الجواب", "ru": "показать, что обилие жертв — не ответ", "en": "to show that more offerings are not the answer"}, {"he": "ללמד את דיני הקורבנות לפי הסדר שבתורה", "ar": "تعليم أحكام القرابين بالترتيب الذي في التوراة", "ru": "изложить законы о жертвах по порядку Торы", "en": "to teach the laws of sacrifice in Torah order"}, {"he": "להראות שה׳ דורש מן האדם את הקורבן היקר ביותר שיש לו", "ar": "إظهار أن الرب يطلب من الإنسان أغلى قربان يملكه", "ru": "показать, что Господь требует от человека самой дорогой жертвы", "en": "to show the LORD demands the costliest offering a person has"}],1,{"he": "השוו את אורך הרשימה לאורך התשובה.", "ar": "قارنوا طول القائمة بطول الجواب.", "ru": "Сравните длину списка с длиной ответа.", "en": "Compare the length of the list with the length of the answer."},{"he": "השאלות עולות מעגלים בני שנה לאלפי אילים ועד הבכור. ההגזמה מראה שכיוון החשיבה שגוי. אז באה תשובה קצרה: משפט, חסד וצניעות.", "ar": "تتصاعد الأسئلة من عجول حولية إلى ألوف الكباش حتى البكر. المبالغة تُظهر أن اتجاه التفكير خاطئ. ثم يأتي جواب قصير: الحق والرحمة والتواضع.", "ru": "Вопросы растут от годовалых тельцов к тысячам овнов и до первенца. Преувеличение показывает, что мысль идёт не туда. Затем звучит краткий ответ: правда, милость, смирение.", "en": "The questions grow from year-old calves to thousands of rams, up to the firstborn. The excess shows the thinking is wrong. Then comes a short answer: justice, kindness, humility."},null,[{"he": "הרשימה לא מדרגת קורבנות; היא מובילה לדחייה שלהם.", "ar": "القائمة لا ترتّب القرابين؛ بل تقود إلى رفضها.", "ru": "Список не ранжирует жертвы; он подводит к их отказу.", "en": "The list does not rank offerings; it leads to rejecting them."}, null, {"he": "הפסוקים הם שאלה ספרותית, לא חוקי קורבנות.", "ar": "الآيات سؤال أدبي، لا أحكام قرابين.", "ru": "Эти стихи — литературный вопрос, а не законы о жертвах.", "en": "The verses are a literary question, not sacrificial law."}, {"he": "התשובה של הנביא דוחה את הקורבנות ודורשת משפט וחסד.", "ar": "جواب النبي يرفض القرابين ويطلب الحق والرحمة.", "ru": "Ответ пророка отвергает жертвы и требует правды и милосердия.", "en": "The prophet's answer rejects the offerings and asks for justice and kindness."}])]]);

[ [
  Q("bib-unseen-1261-1",{"he": "איזה תיאור מתאים למילת מפתח חוזרת?", "ar": "أي وصف يناسب كلمة مفتاحية مكررة؟", "ru": "Какое описание подходит к «Повторяющееся ключевое слово»?", "en": "Which description fits repeated key word?"},[{"he": "מילה שמופיעה כמה פעמים ויכולה לקשר בין חלקי הקטע.", "ar": "كلمة تتكرر وقد تربط بين أجزاء المقطع.", "ru": "Слово, повторяющееся и связывающее части отрывка.", "en": "A word recurring across a passage that can link its parts."},{"he": "דמות אומרת דבר אחד ועושה אחר; הפער עשוי ללמד על מניע או שינוי.", "ar": "تقول الشخصية شيئًا وتفعل غيره؛ وقد يكشف الفرق دافعًا أو تغيرًا.", "ru": "Герой говорит одно, а делает другое; расхождение может показать мотив или перемену.", "en": "A character says one thing but does another; the gap may reveal motive or change."},{"he": "טענה של דמות היא דבריה שלה; לא תמיד זו עמדת הסיפור כולו.", "ar": "قول الشخصية يعبر عنها؛ وليس بالضرورة موقف السرد كله.", "ru": "Слова персонажа выражают его взгляд, но не всегда позицию всего рассказа.", "en": "A character’s claim is their own and not always the stance of the whole narrative."},{"he": "פירוש פרט לא ברור באמצעות מה שקודם לו ומה שבא אחריו.", "ar": "تفسير تفصيل غير واضح بما يسبقه وما يليه.", "ru": "Толкование неясной детали по тому, что до и после неё.", "en": "Reading an unclear detail in light of what comes before and after."}],0,{"he": "חפשו את הפרט שמבדיל אותו מן האחרים.", "ar": "ابحثوا عن التفصيل الذي يميزه عن غيره.", "ru": "Ищите отличие от остальных вариантов.", "en": "Look for the detail that separates it from the others."},{"he": "החזרה מזמינה בדיקה של משמעות בכל הופעה.", "ar": "يدعو التكرار إلى فحص معناها في كل موضع.", "ru": "Повторение предлагает сравнить значение в каждом случае.", "en": "Repetition invites comparison of each occurrence."},null,[null,{"he": "זה מתאר את הבדל בין דיבור למעשה, לא את מילת מפתח חוזרת.", "ar": "هذا يصف فرق القول والعمل، لا كلمة مفتاحية مكررة.", "ru": "Это описание «Разница между словом и делом», а не «Повторяющееся ключевое слово».", "en": "That describes speech-action gap, not repeated key word."},{"he": "זה מתאר את דמות ונקודת מבטה, לא את מילת מפתח חוזרת.", "ar": "هذا يصف الشخصية ومنظورها، لا كلمة مفتاحية مكررة.", "ru": "Это описание «Персонаж и его взгляд», а не «Повторяющееся ключевое слово».", "en": "That describes character viewpoint, not repeated key word."},{"he": "זה מתאר את הסקה מן ההקשר, לא את מילת מפתח חוזרת.", "ar": "هذا يصف استنتاج من السياق، لا كلمة مفتاحية مكررة.", "ru": "Это описание «Вывод из контекста», а не «Повторяющееся ключевое слово».", "en": "That describes inference from context, not repeated key word."}]),
