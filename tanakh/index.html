<style>
/* ============================================================
   תנ״ך — תנ״ך לבגרות
   קהל היעד לא "לא יודע אזרחות". הוא נכשל בה שוב ושוב, מפני
   שהמקצוע כולו טקסט ומושגים — ולכן כל החלטה כאן נמדדת בשאלה
   אחת: האם היא מורידה עומס, או מוסיפה.
   · כל שאלה נושאת רמז שאינו התשובה, והסבר שנפתח גם כשצדקו.
   · שום טקסט לא מוצג בלי שאפשר לשמוע אותו.
   · שפת האם אינה קישוט: מושג באזרחות נלמד קודם בשפה שחושבים בה.
   כל המידות ב-rem, כדי שהגדלת טקסט תגדיל את הכול יחד.
   ============================================================ */
:root{
  --font:"Heebo","Rubik",system-ui,"Segoe UI",Arial,sans-serif;
  --en:"Lexend","Heebo",system-ui,"Segoe UI",Arial,sans-serif;
  --ar:"Noto Sans Arabic",system-ui,"Segoe UI",Arial,sans-serif;
  --ru:"Noto Sans","Heebo",system-ui,"Segoe UI",Arial,sans-serif;   /* קירילית — Heebo אינו מכיל אותה */
  --bg:#f5f7fb; --surface:#ffffff; --surface2:#e8ecf6;
  --ink:#101828; --muted:#55607a; --faint:#6f7a95; --line:#dde3f0;
  --accent:#1d4ed8; --accent-ink:#ffffff; --accent-soft:#dbe4fe;
  --gold:#a16207; --gold-soft:#fbf0d5; --hit:#f5c451; --hit-ink:#1a1300;
  --ok:#15803d; --ok-soft:#dcfce7; --bad:#be123c; --bad-soft:#ffe4e9;
  --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px -12px rgba(16,24,40,.2);
  --r:14px;
  /* צבע לכל מסלול. לא קישוט: ארבעה סוגי לימוד שונים לגמרי, וצבע
     קבוע לכל אחד חוסך למי שמתקשה להתמצא את השאלה "איפה אני". */
  --c-sound:#0369a1; --cs-sound:#dbeefc;   /* צליל ואות   */
  --c-words:#15803d; --cs-words:#dcfce7;   /* מילים       */
  --c-talk:#b43a0a;  --cs-talk:#fde5d8;    /* מדוברת — #c2410c היה 4.28:1 על ה-cs (30.9) */
  --c-read:#6d28d9;  --cs-read:#eae2fd;    /* ספרותית     */
}
:root[data-theme="dark"]{
  --bg:#0e1425; --surface:#17203a; --surface2:#202c4d;
  --ink:#e8edf8; --muted:#9aa5c0; --faint:#78829e; --line:#2a3762;
  --accent:#93c5fd; --accent-ink:#0e1425; --accent-soft:#1b2a5c;
  --gold:#fbbf24; --gold-soft:#33270f; --hit:#ffd24d; --hit-ink:#241a00;
  --ok:#4ade80; --ok-soft:#132a1c; --bad:#fb7185; --bad-soft:#33161f;
  --warn:#fbbf24; --warn-soft:#33260f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  --c-sound:#7dd3fc; --cs-sound:#0b2a3d;
  --c-words:#86efac; --cs-words:#0f2a1a;
  --c-talk:#fdba74;  --cs-talk:#3a2113;
  --c-read:#c4b5fd;  --cs-read:#261a45;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1425; --surface:#17203a; --surface2:#202c4d;
    --ink:#e8edf8; --muted:#9aa5c0; --faint:#78829e; --line:#2a3762;
    --accent:#93c5fd; --accent-ink:#0e1425; --accent-soft:#1b2a5c;
    --gold:#fbbf24; --gold-soft:#33270f; --hit:#ffd24d; --hit-ink:#241a00;
    --ok:#4ade80; --ok-soft:#132a1c; --bad:#fb7185; --bad-soft:#33161f;
    --warn:#fbbf24; --warn-soft:#33260f;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
    --c-sound:#7dd3fc; --cs-sound:#0b2a3d;
    --c-words:#86efac; --cs-words:#0f2a1a;
    --c-talk:#fdba74;  --cs-talk:#3a2113;
    --c-read:#c4b5fd;  --cs-read:#261a45;
  }
}
/* ניגודיות גבוהה — שחור על לבן, מסגרות מלאות, בלי גוונים רכים */
:root.hc{
  --bg:#ffffff; --surface:#ffffff; --surface2:#ffffff;
  --ink:#000000; --muted:#1a1a1a; --faint:#333333; --line:#000000;
  --accent:#00434b; --accent-ink:#ffffff; --accent-soft:#e6f2f3;
  --gold:#5c3d00; --gold-soft:#f7efdf; --hit:#ffe600; --hit-ink:#000000;
  --ok:#0a5c2a; --ok-soft:#e6f4ea; --bad:#8c0f2c; --bad-soft:#fbe9ed;
  --warn:#6b3d00; --warn-soft:#f7efdf; --shadow:none;
  --c-sound:#00305c; --cs-sound:#e8eef7;
  --c-words:#0a5c2a; --cs-words:#e6f4ea;
  --c-talk:#7a2c00;  --cs-talk:#f9ece4;
  --c-read:#3d1a75;  --cs-read:#eee8f9;
}
:root.hc *{box-shadow:none!important}
:root.hc .card,:root.hc .btn,:root.hc .opt{border-width:2px!important}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs,17px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  font-size:1rem;line-height:1.65;-webkit-text-size-adjust:100%}
:root.clear body{font-family:"Verdana","Tahoma","Heebo",sans-serif;letter-spacing:.012em}
:root.spaced body{word-spacing:.22em;line-height:1.95}
:root.rm *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
h1,h2,h3{margin:0;line-height:1.3;font-weight:800}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}
/* כרטיס ״מבנה הבגרות״ (--gold-soft): הקישור לאתר משרד החינוך בלי צבע נפל לכחול ברירת המחדל — 1.55:1 בכהה (30.9) */
.gcard a{color:var(--accent)}
.skip{position:absolute;inset-inline-start:-9999px}
.skip:focus{position:static;display:inline-flex;align-items:center;min-height:44px;
  margin:8px;padding:8px 14px;background:#0b7c71;color:#fff;
  border-radius:8px;font-weight:700;text-decoration:none;z-index:100}

/* כל טקסט אנגלי — כיוון, גופן ומרווח משלו. unicode-bidi:isolate מונע
   מהמשפט האנגלי לגרור אחריו את סימני הפיסוק של המשפט העברי. */
.en{font-family:var(--en);direction:ltr;unicode-bidi:isolate;text-align:start}
.en-b{font-family:var(--en);direction:ltr;unicode-bidi:isolate;display:inline-block}

.wrap{max-width:56rem;margin:0 auto;padding:0 clamp(.9rem,3vw,1.5rem)}
.hbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-block:.6rem}
:root.hc .hbar{background:var(--bg);backdrop-filter:none}
.hrow{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
.brand{font-size:1.35rem;font-weight:800;letter-spacing:-.01em;display:flex;
  align-items:baseline;gap:.5rem;margin-inline-end:auto}
.brand small{font-size:.72rem;font-weight:600;color:var(--muted);letter-spacing:.06em}
.gbtn{display:inline-flex;align-items:center;gap:.4rem;background:var(--surface);
  border:1px solid var(--line);border-radius:999px;padding:.42rem .8rem;cursor:pointer;
  font-size:.86rem;font-weight:600;box-shadow:var(--shadow);min-height:44px}
.gbtn:hover{border-color:var(--accent)}
.gbtn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:1.1rem}
.grid{display:grid;gap:.85rem}
@media(min-width:640px){.g2{grid-template-columns:1fr 1fr}}
@media(min-width:900px){.g3{grid-template-columns:repeat(3,1fr)}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;
  border:1px solid var(--line);background:var(--surface);border-radius:12px;
  padding:.72rem 1.1rem;font-weight:700;cursor:pointer;box-shadow:var(--shadow);
  min-height:2.9rem;font-size:1rem}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;box-shadow:none}
.btn[disabled]{opacity:.45;cursor:default}
.btn.wide{width:100%}

.chip{display:inline-flex;align-items:center;gap:.35rem;border-radius:999px;
  padding:.22rem .6rem;font-size:.78rem;font-weight:700;background:var(--surface2);color:var(--muted)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}

/* גופני שפה: Heebo אינו מכיל ערבית וקירילית, ולכן שפת הממשק
   מחליפה גופן ולא רק כיוון. */
html[lang="ar"] body,html[lang="ar"] input,html[lang="ar"] button,
html[lang="ar"] textarea,html[lang="ar"] select{font-family:var(--ar)}
html[lang="ru"] body,html[lang="ru"] input,html[lang="ru"] button,
html[lang="ru"] textarea,html[lang="ru"] select{font-family:var(--ru)}
button[data-a="lang"][lang="ar"]{font-family:var(--ar)}
button[data-a="lang"][lang="ru"]{font-family:var(--ru)}

/* ===== מסלולים: הצבע נכנס ככרטיס, לא כרקע של טקסט ===== */
.trk{--c:var(--accent);--cs:var(--accent-soft)}
.t-sound{--c:var(--c-sound);--cs:var(--cs-sound)}
.t-words{--c:var(--c-words);--cs:var(--cs-words)}
.t-talk{--c:var(--c-talk); --cs:var(--cs-talk)}
.t-read{--c:var(--c-read); --cs:var(--cs-read)}
.tcard{border-inline-start:5px solid var(--c);cursor:pointer;text-align:start;width:100%;
  display:flex;flex-direction:column;gap:.4rem;align-items:stretch}
.tcard:hover{border-color:var(--c)}
.tcard h3{font-size:1.05rem}
.tcard .sub{font-size:.85rem;color:var(--muted)}
.tdot{width:.62rem;height:.62rem;border-radius:50%;background:var(--c);flex:none}
.thead{display:flex;align-items:center;gap:.5rem}
.tpill{background:var(--cs);color:var(--c);border-radius:999px;padding:.15rem .55rem;
  font-size:.72rem;font-weight:800}

/* ===== סרגל שליטה ברמות ===== */
.lvls{display:flex;gap:.4rem;flex-wrap:wrap}
.lvl{border:1px solid var(--line);background:var(--surface);border-radius:10px;
  padding:.4rem .7rem;font-size:.82rem;font-weight:700;cursor:pointer;
  display:inline-flex;align-items:center;gap:.4rem}
.lvl.on{background:var(--c,var(--accent));color:var(--accent-ink);border-color:var(--c,var(--accent))}
.bar{height:.42rem;border-radius:999px;background:var(--surface2);overflow:hidden;flex:1;min-width:3rem}
.bar i{display:block;height:100%;background:var(--c,var(--accent))}
.bar.b0 i{background:var(--bad)} .bar.b1 i{background:var(--warn)} .bar.b2 i{background:var(--ok)}

/* ===== תרגול ===== */
.qcard{border-top:5px solid var(--c,var(--accent))}
.qtop{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.7rem}
.qtext{font-size:1.12rem;font-weight:600;margin:.2rem 0 .3rem}
.qhint{color:var(--muted);font-size:.9rem}
/* המילה או המשפט שנלמדים. גדול, מרווח, ותמיד לצד כפתור השמעה. */
.subject{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;
  background:var(--surface2);border-radius:12px;padding:.85rem 1rem;margin:.5rem 0}
.subject .word{font-family:var(--en);direction:ltr;unicode-bidi:isolate;
  font-size:1.7rem;font-weight:700;letter-spacing:.01em;line-height:1.25}
.subject .ipa{font-family:var(--en);direction:ltr;unicode-bidi:isolate;
  color:var(--muted);font-size:.95rem}
.spk{border:1px solid var(--line);background:var(--surface);border-radius:999px;
  width:2.7rem;height:2.7rem;display:inline-flex;align-items:center;justify-content:center;
  cursor:pointer;flex:none;box-shadow:var(--shadow)}
.spk:hover{border-color:var(--accent);color:var(--accent)}
.spk.sm{width:2.1rem;height:2.1rem;background:#0b7c71;border-color:#0b7c71;color:#fff}
/* הרמקול הקטן — אותו ירוק של כפתור ההקראה הגדול, התקן המשותף */
.spk.sm:hover{background:#0b7c71;border-color:#0b7c71;color:#fff}
.spk.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.opts{display:grid;gap:.6rem;margin-top:.9rem}
.orow{display:flex;gap:.45rem;align-items:center;min-width:0}
/* min-width:0 — פריט grid נולד עם min-width:auto, ולכן משפט ארוך
   באפשרות היה מרחיב את השורה מעבר למכל ודוחף את הרמקול מחוץ למסך. */
.orow .opt{flex:1;min-width:0}
@media(min-width:560px){.opts.two{grid-template-columns:1fr 1fr}}
.opt{display:flex;align-items:center;gap:.6rem;text-align:start;width:100%;
  border:2px solid var(--line);background:var(--surface);border-radius:12px;
  padding:.8rem .9rem;cursor:pointer;font-size:1.02rem;font-weight:600;min-height:3.1rem}
.opt:hover{border-color:var(--accent)}
.opt .k{width:1.9rem;height:1.9rem;border-radius:8px;background:var(--surface2);
  display:inline-flex;align-items:center;justify-content:center;font-size:.85rem;
  font-weight:800;color:var(--muted);flex:none}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .k{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .k{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.55}
/* בחירה במבחן היא בחירה, לא תשובה נכונה. במסכי התרגול הצבע
   הירוק אומר "צדקת", ובמבחן אסור לו להופיע כלל — הוא נותן
   משוב שגוי לכל בחירה. ניטרלי, ורק מסמן מה סומן. */
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);margin-inline-start:3px}
.dot.ok{background:var(--ok);border-color:var(--ok)}
.dot.no{background:var(--bad);border-color:var(--bad)}
.dot.flag{box-shadow:0 0 0 2px var(--accent)}

/* אריחי בניית משפט. הסדר הוא התרגיל, ולכן האריח חייב להיראות כמשהו
   שאפשר להרים — מסגרת מלאה ורקע משלו, לא טקסט על רקע הכרטיס. */
.tiles{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:.7rem}
.tile{font-family:var(--en);direction:ltr;border:2px solid var(--line);
  background:var(--surface);border-radius:10px;padding:.5rem .8rem;font-weight:600;
  cursor:pointer;font-size:1.02rem;min-height:2.7rem}
.tile:hover{border-color:var(--accent)}
.slot{min-height:3.2rem;border:2px dashed var(--line);border-radius:12px;
  background:var(--surface2);padding:.5rem;display:flex;flex-wrap:wrap;gap:.45rem;
  align-items:center;direction:ltr}
.slot.ok{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.slot.bad{border-style:solid;border-color:var(--bad);background:var(--bad-soft)}
.slot .tile{background:var(--surface)}

/* ===== משוב ===== */
.fb{margin-top:.9rem;border-radius:12px;padding:.85rem 1rem;border:1px solid transparent}
.fb.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.fb.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.fb b{display:block;font-size:1.02rem;margin-bottom:.2rem}
.fb .body{color:var(--ink);font-weight:500;font-size:.95rem}
.why{margin-top:.55rem;padding-top:.55rem;border-top:1px dashed currentColor;color:var(--ink);
  font-weight:500;font-size:.93rem}

/* ===== קטע קריאה ===== */
/* איור בתוך כרטיס שאלה. הצבע יורש מ-color, ולכן אותו SVG נראה
   נכון גם בערכה הבהירה וגם בכהה בלי גרסה שנייה. */
.figure{margin:.7rem 0;padding:.6rem;border:1px solid var(--line);border-radius:12px;
  background:var(--surface2);color:var(--ink);overflow-x:auto}
.figure svg{display:block;max-width:100%}
/* המבחן המדומה: השאלות זו אחר זו, כמו חוברת בחינה. */
.simq{border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;margin:.8rem 0;
  background:var(--surface)}
.simq.miss{border-color:var(--warn)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.simn{font-weight:800;color:var(--muted);font-size:.86rem}
.simbar{position:sticky;top:0;z-index:5;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:.6rem .8rem;margin:.8rem 0;display:flex;gap:.6rem;
  align-items:center;flex-wrap:wrap;box-shadow:var(--shadow)}
.clock{font-weight:800;font-variant-numeric:tabular-nums;font-size:1.1rem}
.clock.low{color:var(--bad)}
.passage{background:var(--surface2);border-radius:12px;padding:1rem 1.1rem;margin:.6rem 0;
  font-family:var(--en);direction:ltr;unicode-bidi:isolate;font-size:1.08rem;line-height:2}
.passage .s{border-radius:5px;padding:.05em .12em;cursor:pointer}
.passage .s:hover{background:var(--accent-soft)}
.passage .s.now{background:var(--accent-soft);box-shadow:0 2px 0 var(--accent)}
.wd{border-radius:5px;padding:1px 3px}
.wd.hit{background:var(--hit);color:var(--hit-ink);font-weight:600}

   באנדרואיד — אין מה להדגיש מילה־מילה, ואז מודגש כל האיבר. הכלל
   שקיים כאן מכוון למשפט בתוך קטע קריאה בלבד, ולכן ההדגשה החלופית
   על איבר אחר לא נראתה כלל. */
.wd.now,p.now,div.now,span.now,b.now{background:var(--hit);color:var(--hit-ink);
  border-radius:8px;box-shadow:0 0 0 4px var(--hit)}
.gloss{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.5rem}

.vstrip{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;border-radius:10px;

.row{display:flex;align-items:center;justify-content:space-between;gap:.8rem;

.sw{width:3.2rem;height:1.8rem;border-radius:999px;background:var(--surface2);
  border:1px solid var(--line);position:relative;cursor:pointer;flex:none}
.sw i{position:absolute;top:.18rem;inset-inline-start:.2rem;width:1.3rem;height:1.3rem;
  border-radius:50%;background:var(--faint);transition:.15s}
.sw.on{background:var(--accent);border-color:var(--accent)}

  direction:ltr;text-align:left}
input[type=range]{width:100%;accent-color:var(--accent)}

.fbar{border-top:1px solid var(--line);margin-top:2rem;padding-block:1rem;

/* ---------- שדה קלט של המבחן ----------
   מודול המבחן הועתק לכאן מאפליקציה שבה .field כבר היה מוגדר.
   בלי הכלל הזה שדה השם של הנבחן נשאר תיבת ברירת המחדל של
   הדפדפן — 21 פיקסלים גובה, הרבה מתחת ליעד המגע של 44. */
.field{width:100%;box-sizing:border-box;font:inherit;font-size:1rem;
  min-height:48px;padding:12px 14px;border-radius:11px;outline:none;background:var(--surface2);color:inherit;border:1px solid var(--line)}

/* ---------- שורות המבחן ----------
   .tog הגיע ממודול המבחן שהועתק לכאן, ולא היה לו עיצוב כלל: השם
   והמידע שמתחתיו נדבקו לשורה אחת בלי רווח. */
.tog{display:flex;align-items:center;gap:13px;width:100%;text-align:start;

  padding:13px 15px;min-width:0}

   .lvl יצא 39 פיקסלים ומתג ה-.sw רק 31, שניהם מתחת ל-44 שהפרויקט
   מחייב את עצמו בהם. במתג לא מגדילים את המסילה — היא תיראה מגושמת —
   אלא מרחיבים את שטח הלחיצה סביבה. */
.lvl{min-height:44px}
.sw{position:relative}

/* ---------- מסך בניית המבחן ----------
   .seg ו-.tpc הגיעו עם מודול המבחן שהועתק לכאן, ולא היה להם עיצוב:

.seg{display:flex;gap:6px;flex-wrap:wrap}

/* --- מנוע ההדגמה. הקוד כאן זהה בכל האפליקציות; רק DEMO_SCRIPT משתנה. --- */
var DEMO={on:false,i:0,timer:null,extra:[],bar:null,txt:null,step:null,fill:null,btn:null};

/* עוזרים לתסריט. כולם מחזירים false כשהאיבר אינו על המסך, כדי
   שצעד שלא מצא את מה שחיפש ידלג ולא יפיל את ההדגמה כולה. */
function demoEl(s){return typeof s==="string"?document.querySelector(s):s}
function demoShow(s){
  var e=demoEl(s); if(!e)return false;
  try{e.scrollIntoView({behavior:"smooth",block:"center"})}catch(err){try{e.scrollIntoView()}catch(err2){}}
  return true;
}
/* מדגיש את האיבר, ורק אז לוחץ — צופה שלא ראה לאן נלחץ לא הבין
   מה קרה. לכן אין צעד קצר מ-1200 אלפיות בתסריטים. */
function demoTap(s){
  var e=demoEl(s); if(!e||e.disabled)return false;
  demoShow(e);
  e.classList.add("demo-tap");
  DEMO.extra.push(setTimeout(function(){
    e.classList.remove("demo-tap");
    /* המסך מצטייר מחדש כל הזמן. אם האיבר שסומן כבר אינו במסמך,
       מחפשים אותו שוב לפי אותו בורר — לחיצה על איבר מת אינה
       עושה דבר, וזה בדיוק צעד שנראה כאילו נתקע. */
    var live=(typeof s==="string"&&!document.contains(e))?demoEl(s):e;
    if(DEMO.on&&live&&!live.disabled&&document.contains(live))try{live.click()}catch(err){}
  },430));
  return true;
}
function demoClick(s){
  var e=demoEl(s); if(!e||e.disabled)return false;
  try{e.click()}catch(err){return false}
  return true;
}
/* הקלדה אות אחר אות, עם אירוע input אמיתי — שדה חיפוש שמאזין
   ל-input לא היה מגיב להשמה ישירה ל-value. */
function demoType(s,text){
  var e=demoEl(s); if(!e)return false;
  demoShow(e); try{e.focus()}catch(err){}
  e.value=""; var i=0;
  var t=setInterval(function(){
    if(!DEMO.on||!e.parentNode){clearInterval(t);return}
    e.value=String(text).slice(0,++i);
    e.dispatchEvent(new Event("input",{bubbles:true}));
    if(i>=String(text).length)clearInterval(t);
  },85);
  DEMO.extra.push(t);
  return true;
}
function demoQuiet(){
  try{if(window.speechSynthesis)speechSynthesis.cancel()}catch(e){}
  try{if(typeof stopSpeak==="function")stopSpeak()}catch(e){}
}

function demoMountUI(){
  var st=document.createElement("style");
  st.id="demo-style"; st.textContent=DEMO_CSS;
  (document.head||document.documentElement).appendChild(st);

  var b=document.createElement("button");
  b.id="demo-start"; b.type="button";
  b.innerHTML='<span aria-hidden="true">▶</span><span>התחל הדגמה</span>';
  b.addEventListener("click",demoStart);
  document.body.appendChild(b);

  var bar=document.createElement("div");
  bar.id="demo-bar"; bar.hidden=true;
  bar.setAttribute("role","status");
  bar.setAttribute("aria-live","polite");
  bar.innerHTML='<div id="demo-sub"><p id="demo-txt"></p>'+
    '<div id="demo-meta"><span id="demo-step"></span>'+
    '<button id="demo-exit" type="button">יציאה · ESC</button></div>'+
    '<div id="demo-prog"><i></i></div></div>';
  document.body.appendChild(bar);

  DEMO.btn=b; DEMO.bar=bar;
  DEMO.txt=document.getElementById("demo-txt");
  DEMO.step=document.getElementById("demo-step");
  DEMO.fill=bar.querySelector("#demo-prog i");
  document.getElementById("demo-exit").addEventListener("click",function(){demoStop()});
  document.addEventListener("keydown",demoKey,true);
}

/* ESC יוצא. הקשבה בשלב הלכידה, כדי שמסך שכבר מטפל ב-Escape
   לא יבלע את המקש לפני שההדגמה ראתה אותו. */
function demoKey(e){
  if(!DEMO.on)return;
  if(e.key==="Escape"||e.keyCode===27){
    e.preventDefault(); e.stopPropagation();
    demoStop();
  }
}

function demoStart(){
  if(DEMO.on)return;
  DEMO.on=true; DEMO.i=0;
  DEMO.btn.hidden=true; DEMO.bar.hidden=false;
  document.documentElement.classList.add("demo-running");
  demoNext();
}

function demoNext(){
  if(!DEMO.on)return;
  if(DEMO.i>=DEMO_SCRIPT.length){demoStop();return}
  var it=DEMO_SCRIPT[DEMO.i++]||{};
  var d=Math.max(600,it.duration||3000);
  DEMO.txt.textContent=it.subtitle||"";
  DEMO.step.textContent=DEMO.i+" / "+DEMO_SCRIPT.length;
  DEMO.fill.style.transition="none"; DEMO.fill.style.width="0";
  void DEMO.fill.offsetWidth;
  DEMO.fill.style.transition="width "+d+"ms linear";
  DEMO.fill.style.width="100%";
  if(typeof it.action==="function"){
    try{it.action()}catch(err){if(window.console)console.warn("demo:",err)}
  }
  DEMO.timer=setTimeout(demoNext,d);
}

function demoStop(){
  DEMO.on=false;
  if(DEMO.timer){clearTimeout(DEMO.timer);DEMO.timer=null}
  DEMO.extra.forEach(function(t){clearTimeout(t);clearInterval(t)});
  DEMO.extra=[];
  var m=document.querySelectorAll(".demo-tap"),i;
  for(i=0;i<m.length;i++)m[i].classList.remove("demo-tap");
  if(DEMO.bar)DEMO.bar.hidden=true;
  if(DEMO.btn)DEMO.btn.hidden=false;
  document.documentElement.classList.remove("demo-running");
  demoQuiet();
}

}

      if(cut<SEG_MAX*0.4)cut=rest.lastIndexOf(" ",SEG_MAX);

function vchkT(){ var g=state.lang||"he"; return VCHKMSG[g]||VCHKMSG.he }
function voiceCheck(){
  var M=vchkT();
  VCHK=M.sent; render();
  function show(m){ VCHK=m; render() }
  if(!("speechSynthesis" in window)){ show(M.noSup); return }
  var list=[]; try{ list=speechSynthesis.getVoices()||[] }catch(e){}
  try{ speechSynthesis.cancel() }catch(e){}
  var u;
  try{ u=new SpeechSynthesisUtterance(M.say) }
  catch(e){ show(M.mkFail+e.message); return }
  u.lang=(LANGS[state.lang||"he"]||LANGS.he).tts; u.volume=1; u.rate=1; u.pitch=1;
  var done=false;
  u.onstart=function(){ done=true; show(M.okN[0]+list.length+M.okN[1]) };
  u.onerror=function(e){ done=true;
    var er=(e&&e.error)||M.unk;
    if(er==="interrupted"||er==="canceled"){ show(M.ok); return }
    show(M.engine[0]+er+" · "+list.length+M.engine[1]); };
  try{ speechSynthesis.speak(u) }
  catch(e){ show(M.spFail+e.message); return }
  setTimeout(function(){ if(!done)
    show(M.timeout[0]+list.length+M.timeout[1]) },2000);
}

/* ------------------------------------------------------------
   דור ההקראה. speechSynthesis.cancel() אינו מבטל setTimeout:
   כרום יורה onend על האמירה שבוטלה, המקטע הבא נרשם בכל זאת,
   וכעבור SEG_GAP ההקראה הישנה חוזרת מעל החדשה — שני קולות
   במקביל. מונה אחד פותר את זה: כל הקראה מקבלת מספר, stopSpeak
   מקדם אותו, ומקטע מדור ישן פשוט אינו מדבר.
   ------------------------------------------------------------ */
var _sayGen=0;
function speakDevice(text,code,rate){
  if(!("speechSynthesis" in window))return false;
  try{speechSynthesis.cancel()}catch(e){}
  var my=++_sayGen;
  /* האמירה יוצאת מיד, בתוך הלחיצה. קודם היא נעטפה ב-voicesReady,
     שממתין לרשימת הקולות ועד ארבע שניות אם היא לא מגיעה — ואמירה
     שיוצאת ארבע שניות אחרי המגע נזרקת בשקט באנדרואיד ובספארי.
     כשהרשימה כבר כאן, בוחרים קול ומדברים. כשהיא ריקה — מדברים
     בכל זאת, עם u.lang בלבד: קול ברירת מחדל בשפה הנכונה עדיף על
     שתיקה, ויש מכשירים שמחזירים רשימה ריקה לצמיתות ומדברים היטב.
     voicesReady נשאר בשימוש למסך בחירת הקול, שם ההמתנה במקומה. */
  (function(){
    try{
      var v=bestVoice(code), lang=(v&&v.lang)||code;
      var segs=segments(String(text)), rt=tuneRate(lang,clamp(rate,0.55,1.4));
      var pit=femLift(v);
      (function sayseg(k){
        if(my!==_sayGen)return;   /* ההקראה הזאת בוטלה — המקטע הבא לא יוצא */
        if(k>=segs.length){ hlClear(); ttsOK(); return }
        var seg=segs[k];
        var u=new SpeechSynthesisUtterance(seg.text);
        u.lang=lang;
        if(v){ try{ u.voice=v }catch(e2){} }
        u.rate=rt; u.pitch=pit; u.volume=1;
        u.onboundary=function(e){if(!e.name||e.name==="word")hlAt(seg.start+e.charIndex)};
        u.onend=function(){
          if(k+1<segs.length) setTimeout(function(){sayseg(k+1)},SEG_GAP);
          else { hlClear(); ttsOK() }
        };
        u.onerror=function(e){ttsFail(e&&e.error)};
        speechSynthesis.speak(u);
      })(0);
    }catch(e){}
  })();
  return true;
}
/* lang: "en" לחומר הנלמד, או קוד שפת האם להוראה. */
function speak(text,lang,rateMul){
  /* כל טקסט שמגיע להקראה מנוקה מתגיות. חלק מהקריאות כבר מנקות
     לבד, וניקוי חוזר אינו משנה דבר — אבל בלעדיו כל מחרוזת שנשארה
     עם <sub> או <span class="frac"> הוקראה בקול כתגית: הסטודנט
     שמע "span class frac" באמצע השאלה. */
  text=plainOf(String(text||"")).trim(); if(!text)return;
  lang=lang||"en";
  var code=lang==="en"?EN_TTS:LANGS[lang].tts;
  var rate=clamp(state.rate*(rateMul||1),0.55,1.4);
  stopSpeak();
  var my=_sayGen;   /* גם תשובת רשת שמגיעה אחרי עצירה לא תושמע */
  /* שכבה 1 - קובץ מוקלט (המנוע של תאוריה מדברת). יש קובץ:
     מנגנים וזהו; אין: קול המכשיר כרגיל. מבדק חוסרים 30.9 סעיף 4. */
  if(typeof RECORDED!=="undefined"&&RECORDED.play(text,lang,{rate:state.rate,
      onError:function(){ if(my===_sayGen)speakDevice(text,code,rate) }})){
    return;
  }
  if(gemOn()){
    var vid=gvOf(state.gemVoice).id;
    var ck=lang+"|"+vid+"|"+rate.toFixed(2)+"|"+text;
    if(gCache[ck]){playUrl(gCache[ck],text,code,rate);return}
    gBusy=true; renderSpeakState();
    gSynth(text,vid,rate,lang).then(function(u){
      if(my!==_sayGen)return;
      gCache[ck]=u; gBusy=false; renderSpeakState(); playUrl(u,text,code,rate);
    }).catch(function(){
      gBusy=false; renderSpeakState(); speakDevice(text,code,rate);
    });
    return;
  }
  speakDevice(text,code,rate);
}
function playUrl(url,text,code,rate){
  gStop();
  /* משתמשים באלמנט ששוחרר במגע ולא יוצרים חדש. */
  if(!GEL)GEL=new Audio();
  gAudio=GEL; gAudio.src=url;
  gAudio.play().catch(function(){speakDevice(text,code,rate)});
}
function stopSpeak(){_sayGen++;gStop();if(typeof RECORDED!=="undefined")RECORDED.stop();hlClear();try{if(window.speechSynthesis)speechSynthesis.cancel()}catch(e){}}
/* עוזבים את הדף — הקול נעצר. בלעדיו הוא ממשיך ברקע אחרי מעבר לטאב
   אחר, ולפעמים נתקע עד סגירת הדפדפן. */
try{document.addEventListener("visibilitychange",function(){
  if(document.hidden)stopSpeak();
});}catch(e){}
/* iOS לא ישמיע כלום עד שאמירה אחת יצאה מתוך handler של מגע אמיתי.
   אמירה אוטומטית בטעינת הדף נבלעת בשקט — בלי חריגה, בלי לוג, בלי
   דרך לדעת. משחררים פעם אחת עם אמירה ריקה.
   חשוב: קריאה ישירה, בלי voicesReady — הבטחה שוברת את שרשרת המגע
   ו-Safari כבר לא יזהה את האמירה כיוזמת משתמש. */
try{document.addEventListener("pointerdown",function(){
  try{speechSynthesis.speak(new SpeechSynthesisUtterance(""))}catch(e){}
  /* ואותו דבר לאלמנט השמע: מקור שקט, play בתוך המגע עצמו. */
  try{
    if(!GEL)GEL=new Audio();
    GEL.src=SILENT_WAV;
    var pr=GEL.play();
    if(pr&&pr.then)pr.then(function(){try{GEL.pause();GEL.currentTime=0}catch(e){}},function(){});
  }catch(e){}
},{once:true});}catch(e){}
function renderSpeakState(){
  var b=document.querySelectorAll(".spk");
  for(var i=0;i<b.length;i++)b[i].classList.toggle("on",gBusy);

/* ============================================================
   7. תוכן
   ------------------------------------------------------------
   בנק שאלות כתוב, ולא מחולל. באזרחות אין נוסחה שממנה נגזרת
   שאלה: הניסוח המדויק הוא החומר הנלמד, ומסיח שנבנה אוטומטית
   מנוסח אחר היה יוצא או מופרך מדי או נכון בעצמו.

   Q(id, q, opts, ok, hint, ex, fig)
     id   — מזהה יציב לפריט. הוא נכנס לסטטיסטיקה של הלומד, ולכן
            אסור לו להשתנות כשמוסיפים פריט לפניו.
     q    — נוסח השאלה, בארבע שפות.
     opts — ארבע תשובות, כל אחת בארבע שפות. תמיד ארבע: שלוש
            אפשרויות הן ניחוש של אחד משלושה.
     ok   — אינדקס התשובה הנכונה במערך opts (0..3). הסדר על
            המסך מעורבב בכל הצגה, ולכן האינדקס אינו רמז.
     hint — רמז שמכוון לחשיבה ואינו מוסר את התשובה.
     ex   — ההסבר שנפתח אחרי המענה, גם כשענו נכון.
     fig  — מפתח איור מתוך FIGS, או null. אופציונלי בהגדרה:
            רוב השאלות באזרחות הן טקסט בלבד.

   כל שדה קיים בארבע השפות. אזרחות נלמדת בשפת האם — מי שקורא
   בקושי בעברית לא ילמד ממנה מדרג נורמות, ולכן התוכן עצמו
   מתורגם ולא רק הממשק.

   מקור: תוכנית הלימודים בתנ״ך של משרד החינוך, ומבנה שאלונים 1261/1262. הניסוח מקורי של בקול, עם קרדיט וקישור למשרד החינוך.
   השאלות נכתבו לאפליקציה הזאת ואינן העתק של בחינה.
   ============================================================ */
function Q(id,q,opts,ok,hint,ex,fig,wrong){
  return {id:id,q:q,o:opts,ok:ok,hint:hint,ex:ex,fig:fig||null,wrong:wrong||null};
}

 пути.", "en": "In Genesis 12 Abraham is called to go \"to the land I will show you\", with no place named. Example: he leaves without knowing the exact destination, which is part of the chapter's point about faith. Egypt comes only later because of famine, and Haran is a stop along the way."},null,[null,{"he": "מצרים מופיעה רק אחר כך, בעקבות הרעב, ולא במקריאה הראשונה.", "ar": "مصر تظهر فقط لاحقًا بسبب الجوع، لا في الدعوة الأولى.", "ru": "Египет появляется только позже, из-за голода, а не в первом призыве.", "en": "Egypt appears only later, because of the famine, not in the first call."},{"he": "חרן היא תחנה בדרך של המשפחה, לא מטרת היציאה.", "ar": "حاران محطة عائلية في الطريق، لا هدف الخروج.", "ru": "Харран - семейная остановка в пути, а не цель ухода.", "en": "Haran is a family stop on the way, not the goal of the journey."},{"he": "שם הארץ לא נמסר מראש; זו בדיוק הנקודה.", "ar": "اسم الأرض لم يُذكر مسبقًا؛ هذه بالضبط الفكرة.", "ru": "Название земли не было дано заранее; в этом и суть.", "en": "The land's name was not given in advance; that is exactly the point."}])],

  Q("bib-genesis-1261-3",{"he": "איזה תיאור מתאים לחלומות פרעה ופירוש יוסף?", "ar": "أي وصف يناسب أحلام فرعون وتفسير يوسف؟", "ru": "Какое описание подходит к «Сны фараона и толкование Иосифа»?", "en": "Which description fits Pharaoh’s dreams and Joseph’s reading?"},[{"he": "בבראשית י״ב מסופר על קריאה לצאת מארצו והבטחה לזרע ולברכה.", "ar": "في التكوين 12 ترد دعوة للخروج من الأرض ووعد بالنسل والبركة.", "ru": "В Бытии 12 рассказаны призыв оставить страну и обещание потомства и благословения.", "en": "Genesis 12 recounts a call to leave his land and a promise of descendants and blessing."},{"he": "בבראשית כ״ג אברהם קונה מקום לקבורת שרה במשא ומתן גלוי.", "ar": "في التكوين 23 يشتري إبراهيم موضعًا لدفن سارة في تفاوض علني.", "ru": "В Бытии 23 Авраам покупает место для погребения Сарры путём открытых переговоров.", "en": "In Genesis 23 Abraham buys a burial place for Sarah through public negotiation."},{"he": "בבראשית מ״א יוסף מפרש את החלומות כשנות שובע ואחריהן שנות רעב ומציע להיערך מראש.", "ar": "في التكوين 41 يفسر يوسف الحلمين بسنوات خصب تليها سنوات جوع ويقترح الاستعداد.", "ru": "В Бытии 41 Иосиф толкует сны как годы изобилия, затем голода, и предлагает подготовиться.", "en": "In Genesis 41 Joseph reads the dreams as years of plenty followed by famine and proposes preparation."},{"he": "בבראשית מ״ב ואילך האחים באים למצרים לקנות מזון ואינם מזהים תחילה את יוסף.", "ar": "في التكوين 42 وما بعده يأتي الإخوة إلى مصر لشراء الطعام ولا يعرفون يوسف أولًا.", "ru": "В Бытии 42 и далее братья приходят за пищей в Египет и сначала не узнают Иосифа.", "en": "In Genesis 42 onward the brothers travel to Egypt for food and at first do not recognise Joseph."}],2,{"he": "חפשו את הפרט שמבדיל אותו מן האחרים.", "ar": "ابحثوا عن التفصيل الذي يميزه عن غيره.", "ru": "Ищите отличие от остальных вариантов.", "en": "Look for the detail that separates it from the others."},{"he": "הפירוש מוביל להצעה מעשית לאגור מזון בשנות השובע.", "ar": "يؤدي التفسير إلى خطة عملية لتخزين الطعام زمن الخصب.", "ru": "Толко  ,Q("bib-gen-machpela",{"he": "מדוע חשוב שאברהם משלם מחיר מלא על מערת המכפלה?", "ar": "لماذا من المهم أن يدفع إبراهيم الثمن كاملًا مقابل مغارة المكفيلة؟", "ru": "Почему важно, что Авраам платит полную цену за пещеру Махпела?", "en": "Why does it matter that Abraham pays the full price for the cave of Machpelah?"},[{"he": "תשלום מלא מעגן זכות קבועה בארץ, בלי תלות בטובה של אחרים", "ar": "الدفع الكامل يرسّخ حقًا ثابتًا في الأرض دون الاعتماد على معروف من الآخرين", "ru": "Полная оплата закрепляет постоянное право на землю, без зависимости от чужой любезности", "en": "Full payment secures a permanent right to the land, without depending on anyone's favor"},{"he": "התשלום המלא מראה לכל תושבי הארץ והסובבים אותה שאברהם איש עשיר ביותר", "ar": "الدفع الكامل يُظهر لكل سكان الأرض ومَن حولها أن إبراهيم رجل غني للغاية", "ru": "Полная оплата показывает всем жителям страны и её соседям, что Авраам человек очень богатый", "en": "The full payment shows all the land's inhabitants and its neighbors that Abraham is a very wealthy man"},{"he": "העסקה נועדה למנוע ריב עם בני חת", "ar": "الصفقة تهدف إلى منع نزاع مع بني حث", "ru": "Сделка призвана предотвратить ссору с сынами Хета", "en": "The deal is meant to prevent a quarrel with the Hittites"},{"he": "המערה היא המקום היחיד שמתאים לקבורה בארץ", "ar": "المغارة هي المكان الوحيد المناسب للدفن في الأرض", "ru": "Пещера - единственное подходящее место для погребения в стране", "en": "The cave is the only burial-suitable place in the land"}],0,{"he": "חשבו מה קנייה בכסף מלא נותנת שמתנה אינה נותנת.", "ar": "فكّروا ما الذي يعطيه الشراء بثمن كامل ولا تعطيه الهدية.", "ru": "Подумайте, что даёт покупка за полную цену и чего не даёт подарок.", "en": "Think about what buying at full price gives that a gift does not."},{"he": "בני חת מציעים את השדה במתנה, אך אברהם מתעקש לשלם ארבע מאות שקל כסף. דוגמה: כששדה ניתן במתנה, הזכות בו תלויה בטוב לב של הנותן; כשמשלמים, הזכות קבועה. לכן הפרק מדגיש את המשא ומתן הגלוי.", "ar": "بنو حث يعرضون الحقل هدية، لكن إبراهيم يصر على دفع أربعمائة شاقل. مثال: حين يُعطى الحقل هدية يبقى الحق معلقًا بحسن نية المعطي؛ حين يُدفع الثمن يصبح الحق ثابتًا. لذلك يؤكد الفصل على التفاوض العلني.", "ru": "Сыновья Хета предлагают поле в дар, но Авраам настаивает на уплате четырехсот сиклей. Пример: когда поле дарят, право зависит от доброй воли дарителя; когда платят, право становится постоянным. Поэтому глава подчёркивает открытые переговоры.", "en": "The Hittites offer the field as a gift, but Abraham insists on paying four hundred shekels. Example: when a field is a gift, the right to it depends on the giver's goodwill; when it is paid for, the right is permanent. That is why the chapter stresses the open negotiation."},null,[null,{"he": "העושר אינו הנושא; הפרק עוסק בזכות, לא בהצגת כסף.", "ar": "الغنى ليس الموضوع؛ الفصل عن الحق لا عن إظهار المال.", "ru": "Богатство не тема; глава о праве, а не о демонстрации денег.", "en": "Wealth is not the subject; the chapter is about rights, not showing money."},{"he": "לא היה ריב; בני חת הציעו מתנה, ואברהם בחר לשלם.", "ar": "لم يكن نزاع؛ بنو حث عرضوا هدية واختار إبراهيم الدفع.", "ru": "Ссоры не было; сыновья Хета предложили дар, а Авраам решил заплатить.", "en": "There was no quarrel; the Hittites offered a gift and Abraham chose to pay."},{"he": "המקום מצוין, אבל הדגש של הפרק הוא על אופן הרכישה.", "ar": "المكان ممتاز، لكن تأكيد الفصل على طريقة الشراء.", "ru": "Место прекрасно, но акцент главы - на способе приобретения.", "en": "The place is excellent, but the chapter's stress is on the way it was acquired."}]),Q("bib-gen-sodom",{"he": "מה מלמד עמידתו של אברהם מול אלוהים בעניין סדום בבראשית י\"ח?", "ar": "ماذا يعلّم وقوف إبراهيم أمام الله في شأن سدوم في التكوين 18؟", "ru": "Чему учит стояние Авраама перед Богом по вопросу Содома в Бытии 18?", "en": "What does Abraham's standing before God over Sodom in Genesis 18 teach?"},[{"he": "שאפשר וצריך לבקש צדק, בלשון ענווה והתעקשות כאחת", "ar": "أنه يمكن ويجب طلب العدل، بلغة تواضع وإصرار معًا", "ru": "Что можно и нужно просить о справедливости, сочетая смирение и настойчивость", "en": "That one may and should plead for justice, combining humility and persistence"},{"he": "אברהם פוחד מפני בני סדום ומפני בני עמורה, ולכן הוא מתחנן לפני אלוהים", "ar": "إبراهيم يخاف من أهل سدوم وعمورة، ولذلك يتوسل أمام الله", "ru": "Авраам боится жителей Содома и Гоморры, и потому умоляет перед Богом", "en": "Abraham fears the people of Sodom and Gomorrah, and so he pleads before God"},{"he": "שאלוהים משנה את דעתו בקלות רבה", "ar": "أن الله يغيّر رأيه بسهولة كبيرة", "ru": "Что Бог легко меняет своё мнение", "en": "That God easily changes His mind"},{"he": "שאברהם רצה להציל רק את לוט", "ar": "أن إبراهيم أراد إنقاذ لوط فقط", "ru": "Что Авраам хотел спасти только Лота", "en": "That Abraham wanted to save only Lot"}],0,{"he": "שימו לטון הדברים ולדפוס החוזר של השאלות.", "ar": "انتبهوا إلى نبرة الكلام ونمط الأسئلة المتكرر.", "ru": "Обратите внимание на тон речи и повторяющийся образец вопросов.", "en": "Notice the tone of the speech and the repeating pattern of the questions."},{"he": "אברהם שואל שוב ושוב: 'אולי יימצאון חמישים צדיקים' ואחר כך ארבעים, שלושים. דוגמה ללשון: 'הנני עפר ואפר'. הוא מבקש צדק לכולם, לא רק לקרוביו, ומדבר בענווה אך בלי לוותר.", "ar": "يسأل إبراهيم مرارًا: «لعله يوجد خمسون صدّيقًا» ثم أربعين فثلاثين. مثال على اللغة: «إنما أنا تراب ورماد». يطلب العدل للجميع لا لأقاربه فقط، ويتكلم بتواضع دون أن يستسلم.", "ru": "Авраам спрашивает снова и снова: «может быть, есть там пятьдесят праведников», затем сорок, тридцать. Пример языка: «я прах и пепел». Он просит справедливости для всех, не только для близких, и говорит смиренно, но не отступает.", "en": "Abraham asks again and again: \"perhaps there are fifty righteous\", then forty, thirty. A language example: \"I am but dust and ashes\". He pleads for justice for everyone, not only his kin, and speaks humbly but does not give up."},null,[null,{"he": "אין בפרק פחד מפני אנשים; אברהם פונה לאלוהים ישירות.", "ar": "لا خوف من الناس في الفصل؛ إبراهيم يخاطب الله مباشرة.", "ru": "В главе нет страха перед людьми; Авраам обращается к Богу напрямую.", "en": "There is no fear of people in the chapter; Abraham addresses God directly."},{"he": "ההדגשה היא על הצדק ועל בקשתו, לא על שינוי דעת.", "ar": "التأكيد على العدل وطلبه، لا على تغيير الرأي.", "ru": "Акцент на справедливости и просьбе о ней, а не на смене мнения.", "en": "The stress is on justice and pleading for it, not on a change of mind."},{"he": "לוט אינו מוזכר בדיאלוג; אברהם מדבר על הצדיקים שבעיר.", "ar": "لوط لا يُذكر في الحوار؛ إبراهيم يتكلم عن الصدّيقين في المدينة.", "ru": "Лот не упомянут в диалоге; Авраам говорит о праведниках в городе.", "en": "Lot is not mentioned in the dialogue; Abraham speaks of the righteous in the city."}])],

 ,Q("bib-gen-joseph-change",{"he": "איזו בחירה של יוסף מראית את השינוי הפנימי שהוא עבר?", "ar": "أي اختيار ليوسف يُظهر التغيير الداخلي الذي مرّ به؟", "ru": "Какой выбор Иосифа показывает его внутреннюю перемену?", "en": "Which choice of Joseph shows the inner change he went through?"},[{"he": "הוא בוחר לסלוח ומסביר את מה שקרה כתוכנית גדולה יותר, במקום לנקום", "ar": "يختار أن يغفر ويفسر ما حدث كخطة أكبر، بدلًا من الانتقام", "ru": "Он выбирает простить и объясняет случившееся как больший план, вместо мести", "en": "He chooses to forgive and explains what happened as a larger plan, instead of taking revenge"},{"he": "הוא מעניש את האחים בדיוק כפי שהם עשו לו", "ar": "يعاقب إخوته تمامًا كما فعلوا به", "ru": "Он наказывает братьев ровно так, как они поступили с ним", "en": "He punishes the brothers exactly as they did to him"},{"he": "הוא דורש כסף רב על המזון שהוא נותן להם", "ar": "يطلب مالًا كثيرًا مقابل الطعام الذي يعطيهم", "ru": "Он требует много денег за пищу, которую даёт им", "en": "He demands much money for the food he gives them"},{"he": "הוא שולח את בנימין למצרים לבדו", "ar": "يرسل بنيامين إلى مصر وحده", "ru": "Он отправляет Вениамина в Египет одного", "en": "He sends Benjamin to Egypt alone"}],0,{"he": "השוו את התנהגותו עכשיו למה שהיה סביב המכירה.", "ar": "قارنوا سلوكه الآن بما كان عند البيع.", "ru": "Сравните его поведение теперь с тем, что было при продаже.", "en": "Compare his behavior now with what happened around the sale."},{"he": "יוסף אומר לאחיו: 'אל תעצבו... אלוהים שלחני לפניכם למחיה' (בראשית מ\"ה). דוגמה: במקום לנקום, הוא מספר את הסיפור מחדש כהצלה של המשפחה כולה. זו בחירה מודעת, ולא שכחה של העבר.", "ar": "يقول يوسف لإخوته: «لا تحزنوا... الله أرسلني أمامكم للحياة» (التكوين 45). مثال: بدل الانتقام، يروي القصة من جديد كإنقاذ للعائلة كلها. هذا اختيار واعٍ وليس نسيانًا للماضي.", "ru": "Иосиф говорит братьям: «не печальтесь... Бог послал меня перед вами для жизни» (Бытие 45). Пример: вместо мести он пересказывает историю как спасение всей семьи. Это осознанный выбор, а не забвение прошлого.", "en": "Joseph tells his brothers: \"do not be grieved... God sent me before you to preserve life\" (Genesis 45). Example: instead of revenge, he retells the story as the rescue of the whole family. It is a conscious choice, not forgetting the past."},null,[null,{"he": "הנקמה לא מתרחשת; האחים מוזמנים לגור במצרים בכבוד.", "ar": "الانتقام لا يحدث؛ يُدعى الإخوة للسكن في مصر بكرامة.", "ru": "Мести не происходит; братьев приглашают жить в Египте с почётом.", "en": "No revenge happens; the brothers are invited to live in Egypt with honor."},{"he": "הכסף הוחזר לשקיהם; יוסף לא גובה על המזון.", "ar": "أُعيد المال إلى حقائبهم؛ يوسف لا يتقاضى ثمن الطعام.", "ru": "Деньги вернули в их мешки; Иосиф не берёт плату за пищу.", "en": "The money was returned to their sacks; Joseph does not charge for the food."},{"he": "בנימין בא עם האחים; יוסף לא שולח אותו לבדו.", "ar": "بنيامين يأتي مع الإخوة؛ يوسف لا يرسله وحده.", "ru": "Вениамин приходит с братьями; Иосиф не отправляет его одного.", "en": "Benjamin comes with the brothers; Joseph does not send him alone."}]),Q("bib-gen-luck",{"he": "תלמיד טוען שסיפור יוסף ואחיו הוא בעיקר סיפור על מזל. איזו התייחסות הולמת?", "ar": "يدّعي طالب أن قصة يوسف وإخوته أساسًا قصة حظ. أي معالجة مناسبة؟", "ru": "Ученик утверждает, что история Иосифа и его братьев - в основном история о везении. Какой подход уместен?", "en": "A student claims the story of Joseph and his brothers is mainly a story about luck. Which response is fitting?"},[{"he": "לראות שרשרת של בחירות אנושיות שדרכן מתממשת תוצאה משמעותית", "ar": "رؤية سلسلة من الاختيارات البشرية التي تتحقق عبرها نتيجة ذات معنى", "ru": "Увидеть цепь человеческих выборов, через которые осуществляется значимый результат", "en": "To see a chain of human choices through which a meaningful outcome comes about"},{"he": "לקבל את הטענה, כי הכל באמת קרה במקרה", "ar": "قبول الادعاء لأن كل شيء حدث صدفة حقًا", "ru": "Принять утверждение, ведь всё действительно случайность", "en": "To accept the claim, since everything really happened by chance"},{"he": "לדחות את הטענה, כי אין בסיפור שום תוצאה משמעותית", "ar": "رفض الادعاء لأنه لا توجد في القصة أي نتيجة ذات معنى", "ru": "Отвергнуть утверждение, ведь в истории нет никакого значимого результата", "en": "To reject the claim, since the story has no meaningful outcome at all"},{"he": "לומר שהטענה נכונה רק לגבי מלכים", "ar": "القول إن الادعاء صحيح فقط عن الملوك", "ru": "Сказать, что утверждение верно только о царях", "en": "To say the claim is true only about kings"}],0,{"he": "מצאו דוגמה שבה בחירה של אדם משנה את התוצאה.", "ar": "ابحثوا عن مثال يغيّر فيه اختيار إنسان النتيجة.", "ru": "Найдите пример, где выбор человека меняет результат.", "en": "Find an example where a person's choice changes the outcome."},{"he": "הסיפור מלא בבחירות: יעקב בוחר לשלוח את האחים, יוסף בוחר שלא לנקום, וכל בחירה מניעה את העלילה. דוגמה: בלי בחירתו של יוסף לסלוח, המשפחה לא הייתה ניצלת. לכן 'מזל' אינו הסבר מספק.", "ar": "القصة مليئة بالاختيارات: يعقوب يختار إرسال الإخوة، ويوسف يختار ألا ينتقم، وكل اختيار يحرك الحبكة. مثال: دون اختيار يوسف المغفرة لما نجت العائلة. لذلك «الحظ» ليس تفسيرًا كافيًا.", "ru": "История полна выборов: Иаков решает отправить братьев, Иосиф решает не мстить, и каждый выбор двигает сюжет. Пример: без решения Иосифа простить, семья не спаслась бы. Поэтому «везение» - недостаточное объяснение.", "en": "The story is full of choices: Jacob chooses to send the brothers, Joseph chooses not to take revenge, and every choice moves the plot. Example: without Joseph's choice to forgive, the family would not have been saved. So \"luck\" is not a sufficient explanation."},null,[null,{"he": "'מקרה' מתעלם משרשרת הבחירות שהסיפור מדגיש.", "ar": "«الصدفة» تتجاهل سلسلة الاختيارات التي تؤكدها القصة.", "ru": "«Случайность» игнорирует цепь выборов, которую история подчёркивает.", "en": "\"Chance\" ignores the chain of choices the story stresses."},{"he": "יש תוצאה משמעותית: הצלת המשפחה וישיבתה במצרים.", "ar": "توجد نتيجة ذات معنى: إنقاذ العائلة وإسكانها في مصر.", "ru": "Значимый результат есть: спасение семьи и её поселение в Египте.", "en": "There is a meaningful outcome: the family's rescue and settlement in Egypt."},{"he": "מלכים אינם נושא הטענה כלל.", "ar": "الملوك ليسوا موضوع الادعاء إطلاقًا.", "ru": "Цари вообще не тема утверждения.", "en": "Kings are not the subject of the claim at all."}])]]);

  Q("bib-exodus-1261-1",{"he": "איזה תיאור מתאים ללידת משה?", "ar": "أي وصف يناسب ولادة موسى؟", "ru": "Какое описание подходит к «Рождение Моисея»?", "en": "Which description fits birth of Moses?"},[{"he": "בשמות ב׳ התינוק מוסתר, מונח בתיבה על היאור ונמצא בידי בת פרעה.", "ar": "في الخروج 2 يُخفى الرضيع ويوضع في سلة على النهر وتعثر عليه ابنة فرعون.", "ru": "В Исходе 2 младенца прячут, кладут в корзину у Нила, и его находит дочь фараона.", "en": "In Exodus 2 the infant is hidden, placed in a basket by the Nile and found by Pharaoh’s daughter."},{"he": "בשמות ג׳ משה נתקל בסנה בוער שאינו נשרף, ונקרא לשליחות.", "ar": "في الخروج 3 يرى موسى عليقة تشتعل ولا تحترق ويُدعى إلى مهمة.", "ru": "В Исходе 3 Моисей видит куст, который горит и не сгорает, и получает поручение.", "en": "In Exodus 3 Moses encounters a bush that burns without being consumed and receives a mission."},{"he": "בשמות י״ב מתוארת המכה האחרונה במצרים, ואחריה פרעה קורא לישראל לצאת.", "ar": "في الخروج 12 ترد الضربة الأخيرة في مصر، وبعدها يأمر فرعون بني إسرائيل بالخروج.", "ru": "В Исходе 12 описана последняя казнь в Египте, после которой фараон велит израильтянам уйти.", "en": "Exodus 12 describes the final plague in Egypt, after which Pharaoh tells the Israelites to leave."},{"he": "בשמות י״ד העם עובר בים לאחר מרדף המצרים; המים שבים עם סיום המעבר.", "ar": "في الخروج 14 يعبر الشعب البحر بعد ملاحقة المصريين، ثم تعود المياه.", "ru": "В Исходе 14 народ переходит море при преследовании египтян; затем воды возвращаются.", "en": "In Exodus 14 the people cross the sea under Egyptian pursuit; the waters then return."}],0,{"he": "חפשו את הפרט שמבדיל אותו מן האחרים.", "ar": "ابحثوا عن التفصيل الذي يميزه عن غيره.", "ru": "Ищите отличие от остальных вариантов.", "en": "Look for the detail that separates it from the others."},{"he": "הסיפור קושר פעולות של כמה נשים להצלת התינוק.", "ar": "يربط السرد أفعال عدة نساء بإنقاذ الرضيع.", "ru": "Повествование связывает действия нескольких женщин со спасением ребёнка.", "en": "The story   Q("bib-exodus-1261-2",{"he": "איזה תיאור מתאים להסנה הבוער?", "ar": "أي وصف يناسب العليقة المشتعلة؟", "ru": "Какое описание подходит к «Горящий куст»?", "en": "Which description fits burning bush?"},[{"he": "בשמות ב׳ התינוק מוסתר, מונח בתיבה על היאור ונמצא בידי בת פרעה.", "ar": "في الخروج 2 يُخفى الرضيع ويوضع في سلة على النهر وتعثر عليه ابنة فرعون.", "ru": "В Исходе 2 младенца прячут, кладут в корзину у Нила, и его находит дочь фараона.", "en": "In Exodus 2 the infant is hidden, placed in a basket by the Nile and found by Pharaoh’s daughter."},{"he": "בשמות ג׳ משה נתקל בסנה בוער שאינו נשרף, ונקרא לשליחות.", "ar": "في الخروج 3 يرى موسى عليقة تشتعل ولا تحترق ويُدعى إلى مهمة.", "ru": "В Исходе 3 Моисей видит куст, который горит и не сгорает, и получает поручение.", "en": "In Exodus 3 Moses encounters a bush that burns without being consumed and receives a mission."},{"he": "בשמות י״ב מתוארת המכה האחרונה במצרים, ואחריה פרעה קורא לישראל לצאת.", "ar": "في الخروج 12 ترد الضربة الأخيرة في مصر، وبعدها يأمر فرعون بني إسرائيل بالخروج.", "ru": "В Исходе 12 описана последняя казнь в Египте, после которой фараон велит израильтянам уйти.", "en": "Exodus 12 describes the final plague in Egypt, after which Pharaoh tells the Israelites to leave."},{"he": "בשמות י״ד העם עובר בים לאחר מרדף המצרים; המים שבים עם סיום המעבר.", "ar": "في الخروج 14 يعبر الشعب البحر بعد ملاحقة المصريين، ثم تعود المياه.", "ru": "В Исходе 14 народ переходит море при преследовании египтян; затем воды возвращаются.", "en": "In Exodus 14 the people cross the sea under Egyptian pursuit; the waters then return."}],1,{"he": "חפשו את הפרט שמבדיל אותו מן האחרים.", "ar": "ابحثوا عن التفصيل الذي يميزه عن غيره.", "ru": "Ищите отличие от остальных вариантов.", "en": "Look for the detail that separates it from the others."},{"he": "המפגש מציג את הקריאה למשה ואת תגובתו לשליחות.", "ar": "يقدّم اللقاء دعوة موسى وردّه على المهمة.", "ru": "Встреча представляет призвание Моисея и его ответ.", "en": "The encounter introduces Moses’s calling and response."},null,[{"he": "זה מתאר את לידת משה, לא את הסנה הבוער.", "ar": "هذا يصف ولادة موسى، لا العليقة المشتعلة.", "ru": "Это описание «Рождение Моисея», а не «Горящий куст».", "en": "That describes birth of Moses, not burning bush."},null,{"he": "זה מתאר את מכת בכורות, לא את הסנה הבוער.", "ar": "هذا يصف ضربة الأبكار، لا العليقة المشتعلة.", "ru": "Это описание «Поражение первенцев», а не «Горящий куст».", "en": "That describes plague of the firstborn, not burning bush."},{"he": "זה מתאר את חציית ים סוף, לא את הסנה הבוער.", "ar": "هذا يصف عبور بحر سوف، لا العليقة المشتعلة.", "ru": "Это описание «Переход через море Суф», а не «Горящий куст».", "en": "That describes crossing the Sea of Reeds, not burning bush."}])
 ,Q("bib-exo-moses-raised",{"he": "מי גידל את משה אחרי שנמשה מן היאור?", "ar": "مَن ربّى موسى بعد أن أُخرج من النيل؟", "ru": "Кто вырастил Моисея после того, как его вынули из Нила?", "en": "Who raised Moses after he was drawn out of the Nile?"},[{"he": "תחילה אמו, שהוחכרה כמיניקה, ואחר כך בת פרעה בארמון", "ar": "أولًا أمه التي استُؤجرت مرضعة، ثم ابنة فرعون في القصر", "ru": "Сначала его мать, нанятая кормилицей, а затем дочь фараона во дворце", "en": "First his mother, hired as a wet nurse, and then Pharaoh's daughter in the palace"},{"he": "שפחה מצרית שמצאה אותו בנהר", "ar": "جارية مصرية وجدته في النهر", "ru": "Египетская служанка, нашедшая его в реке", "en": "An Egyptian maid who found him in the river"},{"he": "יתרו, כהן מדיין, מיום הולדתו", "ar": "يترو كاهن مديان منذ يوم مولده", "ru": "Иетро, священник Мадиана, со дня рождения", "en": "Jethro, priest of Midian, from his birthday"},{"he": "אהרן אחיו, בבית אביו", "ar": "هرون أخوه في بيت أبيه", "ru": "Его брат Аарон, в доме отца", "en": "His brother Aaron, in his father's house"}],0,{"he": "קראו שוב את הרצף מן היאור ועד הארמון.", "ar": "أعيدوا قراءة التسلسل من النيل إلى القصر.", "ru": "Перечитайте последовательность от Нила до дворца.", "en": "Read again the sequence from the Nile to the palace."},{"he": "בשמות ב' בת פרעה מוצאת את התינוק, ומירים מציעה להביא מיניקה עברית - והמיניקה היא אמו של משה. דוגמה: כך משה גדל קודם בבית ישראלי ואחר כך בארמון מצרי, ושני העולמות האלה ילוו אותו.", "ar": "في الخروج 2 تجد ابنة فرعون الطفل، وتقترح مريم إحضار مرضعة عبرية - والمرضعة هي أم موسى. مثال: هكذا يكبر موسى أولًا في بيت عبراني ثم في قصر مصري، وسيرافقه هذان العالمان.", "ru": "В Исходе 2 дочь фараона находит младенца, и Мирьям предлагает привести еврейскую кормилицу - ею оказывается мать Моисея. Пример: так Моисей растёт сначала в еврейском доме, а затем в египетском дворце, и оба мира будут сопровождать его.", "en": "In Exodus 2 Pharaoh's daughter finds the baby, and Miriam offers to bring a Hebrew wet nurse - who turns out to be Moses' own mother. Example: so Moses grows up first in an Israelite home and then in an Egyptian palace, and both worlds will accompany him."},null,[null,{"he": "המוצאת היא בת פרעה עצמה, לא שפחה.", "ar": "الواجدة هي ابنة فرعون نفسها لا جارية.", "ru": "Нашедшая - сама дочь фараона, а не служанка.", "en": "The finder is Pharaoh's daughter herself, not a maid."},{"he": "יתרו נכנס לסיפור רק כשמשה בוגר ובורח למדיין.", "ar": "يترو يدخل القصة فقط حين يكبر موسى ويهرب إلى مديان.", "ru": "Иетро появляется только когда взрослый Моисей бежит в Мадиан.", "en": "Jethro enters the story only when adult Moses flees to Midian."},{"he": "אהרן אינו מוזכר כמי שגידל את משה.", "ar": "هرون لا يُذكر كمَن ربّى موسى.", "ru": "Аарон не упомянут как воспитавший Моисея.", "en": "Aaron is not mentioned as the one who raised Moses."}])],

gue precedes the departure."},null,[{"he": "זה מתאר את לידת משה, לא את מכת בכורות.", "ar": "هذا يصف ولادة موسى، لا ضربة الأبكار.", "ru": "Это описание «Рождение Моисея», а не «Поражение первенцев».", "en": "That describes birth of Moses, not plague of the firstborn."},{"he": "זה מתאר את הסנה הבוער, לא את מכת בכורות.", "ar": "هذا يصف العليقة المشتعلة، لا ضربة الأبكار.", "ru": "Это описание «Горящий куст», а не «Поражение первенцев».", "en": "That describes burning bush, not plague of the firstborn."},null,{"he": "זה מתאר את חציית ים סוף, לא את מכת בכורות.", "ar": "هذا يصف عبور بحر سوف، لا ضربة الأبكار.", "ru": "Это описание «Переход через море Суф», а не «Поражение первенцев».", "en": "That describes crossing the Sea of Reeds, not plague of the firstborn."}])
 ,Q("bib-exo-reluctant",{"he": "מדוע משה מתלבט לקבל את השליחות בסנה הבוער?", "ar": "لماذا يتردد موسى في قبول الرسالة عند العليقة المشتعلة؟", "ru": "Почему Моисей колеблется принять поручение у горящего куста?", "en": "Why does Moses hesitate to accept the mission at the burning bush?"},[{"he": "הוא מרגיש שאינו מתאים ומבקש שישלחו שליח אחר", "ar": "يشعر أنه غير مناسب ويطلب أن يُرسل رسول آخر", "ru": "Он чувствует себя неподходящим и просит послать другого", "en": "He feels unfit and asks that someone else be sent"},{"he": "הוא פוחד מפני פרעה ומפני הצבא המצרי, ורק בגלל זה הוא מתלבט", "ar": "يخاف من فرعون ومن الجيش المصري، ولهذا وحده يتردد", "ru": "Он боится фараона и египетского войска, и только поэтому колеблется", "en": "He fears Pharaoh and the Egyptian army, and for that reason alone he hesitates"},{"he": "הוא רוצה להישאר רועה לעד", "ar": "يريد أن يبقى راعيًا إلى الأبد", "ru": "Он хочет навсегда остаться пастухом", "en": "He wants to remain a shepherd forever"},{"he": "הוא אינו מאמין במה שהוא רואה", "ar": "لا يؤمن بما يراه", "ru": "Он не верит в то, что видит", "en": "He does not believe what he sees"}],0,{"he": "חפשו את המילים שבהן הוא אומר 'מי אנוכי'.", "ar": "ابحثوا عن الكلمات التي يقول فيها «مَن أنا».", "ru": "Найдите слова, в которых он говорит «кто я».", "en": "Look for the words in which he says \"who am I\"."},{"he": "משה אומר: 'מי אנוכי כי אלך אל פרעה' (שמות ג'). דוגמה: הוא מונה סיבות - לא איש דברים, מי יאמינו לי - ומבקש 'שלח נא ביד תשלח'. ההתלבטות היא חלק מדמותו, לא סוף השליחות.", "ar": "يقول موسى: «مَن أنا حتى أذهب إلى فرعون» (الخروج 3). مثال: يعدّد أسبابًا - لست رجل كلام، مَن سيصدقني - ويطلب «أرسل بيد مَن ترسل». التردد جزء من شخصيته لا نهاية الرسالة.", "ru": "Моисей говорит: «кто я, чтобы идти к фараону» (Исход 3). Пример: он перечисляет причины - не человек речи, кто поверит мне - и просит «пошли того, кого пошлёшь». Колебание - часть его образа, а не конец поручения.", "en": "Moses says: \"Who am I that I should go to Pharaoh\" (Exodus 3). Example: he lists reasons - not a man of words, who will believe me - and asks \"send someone else\". The hesitation is part of his character, not the end of the mission."},null,[null,{"he": "הפחד מפרעה אינו מה שמשה מציג; הוא מדבר על חוסר התאמה עצמית.", "ar": "الخوف من فرعون ليس ما يعرضه موسى؛ يتكلم عن عدم ملاءمة ذاتية.", "ru": "Страх перед фараоном не то, что выдвигает Моисей; он говорит о собственной непригодности.", "en": "Fear of Pharaoh is not what Moses raises; he speaks of his own unfitness."},{"he": "אין רמז שהוא רוצה להישאר; הוא שואל שאלות על השליחות עצמה.", "ar": "لا إشارة إلى أنه يريد البقاء؛ يسأل عن الرسالة نفسها.", "ru": "Нет намёка, что он хочет остаться; он задаёт вопросы о самом поручении.", "en": "There is no hint he wants to stay; he asks questions about the mission itself."},{"he": "הוא רואה ומאמין בסנה; ההתלבטות היא על היכולת שלו.", "ar": "يرى العليقة ويؤمن بها؛ التردد حول قدرته هو.", "ru": "Он видит куст и верит; колебание - о его собственной способности.", "en": "He sees and believes the bush; the hesitation is about his own ability."}]),Q("bib-exo-plagues-goal",{"he": "מה מטרת המכות כפי שהסיפור מציג אותה?", "ar": "ما هدف الضربات كما تعرضه القصة؟", "ru": "Какова цель казней, как её представляет рассказ?", "en": "What is the goal of the plagues as the story presents it?"},[{"he": "שחרור ישראל והכרה: 'וידעו מצרים כי אני ה'', ובישראל אף הם", "ar": "تحرير إسرائيل والمعرفة: «فيعلم المصريون أني أنا الرب»، وكذلك في إسرائيل", "ru": "Освобождение Израиля и познание: «и узнают египтяне, что я Господь», а также в Израиле", "en": "Israel's release and recognition: \"the Egyptians shall know that I am the Lord\", and in Israel too"},{"he": "המכות הן עונש למצרים בלבד, בלי שום מטרה נוספת מעבר לעונש עצמו", "ar": "الضربات عقاب للمصريين فقط، دون أي هدف إضافي وراء العقاب نفسه", "ru": "Казни - только наказание египтянам, без какой-либо иной цели сверх самого наказания", "en": "The plagues are a punishment for Egypt only, with no further goal beyond the punishment itself"},{"he": "הפגנת כוח בלי קשר לשחרור", "ar": "استعراض قوة لا صلة له بالتحرير", "ru": "Демонстрация силы, не связанная с освобождением", "en": "A show of force unrelated to the release"},{"he": "להכניע את משה לפני העם", "ar": "إذلال موسى أمام الشعب", "ru": "Уничижить Моисея перед народом", "en": "To humble Moses before the people"}],0,{"he": "חפשו פסוק שאומר למה זה קורה, לא רק מה קורה.", "ar": "ابحثوا عن آية تقول لماذا يحدث هذا لا فقط ماذا يحدث.", "ru": "Найдите стих, объясняющий, зачем это происходит, а не только что происходит.", "en": "Look for a verse that says why this happens, not only what happens."},{"he": "המכות חוזרות עם נוסח קבוע: 'בזאת תדע כי אני ה'' (למשל שמות ז'). דוגמה: המטרה כפולה - להוציא את ישראל, ושגם מצרים וגם ישראל יכירו. לכן 'עונש בלבד' אינו מספיק.", "ar": "تتكرر الضربات بصيغة ثابتة: «بهذا تعلم أني أنا الرب» (مثل الخروج 7). مثال: الهدف مزدوج - إخراج إسرائيل، وأن يعرف المصريون وإسرائيل معًا. لذلك «عقاب فقط» غير كافٍ.", "ru": "Казни повторяются с постоянной формулой: «из сего узнаешь, что я Господь» (например, Исход 7). Пример: цель двойная - вывести Израиль и чтобы узнали и египтяне, и Израиль. Поэтому «только наказание» недостаточно.", "en": "The plagues repeat a fixed formula: \"by this you shall know that I am the Lord\" (for example Exodus 7). Example: the goal is double - to bring Israel out, and that both Egypt and Israel will know. So \"punishment only\" is not enough."},null,[null,{"he": "הנוסח החוזר מראה שיש מטרה מעבר לעונש.", "ar": "الصيغة المتكررة تُظهر أن هناك هدفًا وراء العقاب.", "ru": "Повторяющаяся формула показывает цель сверх наказания.", "en": "The repeating formula shows a goal beyond punishment."},{"he": "המכות קשורות ישירות לדרישה לשחרר את העם.", "ar": "الضربات مرتبطة مباشرة بمطلب إطلاق الشعب.", "ru": "Казни напрямую связаны с требованием отпустить народ.", "en": "The plagues are directly tied to the demand to free the people."},{"he": "משה הוא שליח המכות, לא מושא ההכנעה.", "ar": "موسى رسول الضربات لا موضوع الإذلال.", "ru": "Моисей - посланник казней, а не объект уничижения.", "en": "Moses is the plagues' messenger, not the object of humbling."}])],

  Q("bib-exodus-1261-4",{"he": "איזה תיאור מתאים לחציית ים סוף?", "ar": "أي وصف يناسب عبور بحر سوف؟", "ru": "Какое описание подходит к «Переход через море Суф»?", "en": "Which description fits crossing the Sea of Reeds?"},[{"he": "בשמות ב׳ התינוק מוסתר, מונח בתיבה על היאור ונמצא בידי בת פרעה.", "ar": "في الخروج 2 يُخفى الرضيع ويوضع في سلة على النهر وتعثر عليه ابنة فرعون.", "ru": "В Исходе 2 младенца прячут, кладут в корзину у Нила, и его находит дочь фараона.", "en": "In Exodus 2 the infant is hidden, placed in a basket by the Nile and found by Pharaoh’s daughter."},{"he": "בשמות ג׳ משה נתקל בסנה בוער שאינו נשרף, ונקרא לשליחות.", "ar": "في الخروج 3 يرى موسى عليقة تشتعل ولا تحترق ويُدعى إلى مهمة.", "ru": "В Исходе 3 Моисей видит куст, который горит и не сгорает, и получает поручение.", "en": "In Exodus 3 Moses encounters a bush that burns without being consumed and receives a mission."},{"he": "בשמות י״ב מתוארת המכה האחרונה במצרים, ואחריה פרעה קורא לישראל לצאת.", "ar": "في الخروج 12 ترد الضربة الأخيرة في مصر، وبعدها يأمر فرعون بني إسرائيل بالخروج.", "ru": "В Исходе 12 описана последняя казнь в Египте, после которой фараон велит израильтянам уйти.", "en": "Exodus 12 describes the final plague in Egypt, after which Pharaoh tells the Israelites to leave."},{"he": "בשמות י״ד העם עובר בים לאחר מרדף המצרים; המים שבים עם סיום המעבר.", "ar": "في الخروج 14 يعبر الشعب البحر بعد ملاحقة المصريين، ثم تعود المياه.", "ru": "В Исходе 14 народ переходит море при преследовании египтян; затем воды возвращаются.", "en": "In Exodus 14 the people cross the sea under Egyptian pursuit; the waters then return."}],3,{"he": "חפשו את הפרט שמבדיל אותו מן האחרים.", "ar": "ابحثوا عن التفصيل الذي يميزه عن غيره.", "ru": "Ищите отличие от остальных вариантов.", "en": "Look for the detail that separates it from the others."},{"he": "המרדף והמעבר בים מתוארים כחלק מאותו רצף.", "ar": "المطاردة وعبور البحر جزء من تسلسل واحد.", "ru": "Погоня и переход через море составляют одну последовательность.", "en": "Pursuit and crossing belong to the same narrative sequence."},null,[{"he": "זה מתאר את לידת משה, לא את חציית ים סוף.", "ar": "هذا يصف ولادة موسى، لا عبور بحر سوف.", "ru": "Это описание «Рождение Моисея», а не «Переход через море Суф».", "en": "That describes birth of Moses, not crossing the Sea of Reeds."},{"he": "זה מתאר את הסנה הבוער, לא את חציית ים סוף.", "ar": "هذا يصف العليقة المشتعلة، لا عبور بحر سوف.", "ru": "Это описание «Горящий куст», а не «Переход через море Суф».", "en": "That describes burning bush, not crossing the Sea of Reeds."},{"he": "זה מתאר את מכת בכורות, לא את חציית ים סוף.", "ar": "هذا يصف ضربة الأبكار، لا عبور بحر سوف.", "ru": "Это описание «Поражение первенцев», а не «Переход через море Суф».", "en": "That describes plague of the firstborn, not crossing the Sea of Reeds."},null])
 ,Q("bib-exo-argue",{"he": "מה מלמד הדיאלוג בסנה על דמותו של משה כמנהיג?", "ar": "ماذا يعلّمنا حوار العليقة عن شخصية موسى كقائد؟", "ru": "Чему учит диалог у куста о Моисее как лидере?", "en": "What does the bush dialogue teach about Moses as a leader?"},[{"he": "שמנהיג רשאי לשאול ולהתלבט, ועדיין לצאת לשליחות", "ar": "أن القائد يحق له أن يسأل ويتردد، ومع ذلك ينطلق في رسالته", "ru": "Что лидер вправе спрашивать и колебаться, и всё же отправиться выполнять поручение", "en": "That a leader may ask and hesitate, and still go on the mission"},{"he": "שמי שמתלבט אינו ראוי להיות מנהיג", "ar": "أن مَن يتردد لا يصلح قائدًا", "ru": "Что колеблющийся не годится в лидеры", "en": "That one who hesitates is unfit to lead"},{"he": "שהוויכוח מבטל את השליחות", "ar": "أن الجدال يلغي الرسالة", "ru": "Что спор отменяет поручение", "en": "That the argument cancels the mission"},{"he": "שרק ציות מלא בלי שאלות מקובל", "ar": "أن الطاعة الكاملة دون أسئلة وحدها المقبولة", "ru": "Что принято только полное послушание без вопросов", "en": "That only full obedience without questions is accepted"}],0,{"he": "שימו לב איך הדיאלוג מסתיים בפועל.", "ar": "انتبهوا كيف ينتهي الحوار فعليًا.", "ru": "Обратите внимание, чем диалог заканчивается на деле.", "en": "Notice how the dialogue actually ends."},{"he": "משה שואל, מתלבט ומבקש - ובסוף יוצא למצרים. דוגמה: אחרי כל השאלות הוא לוקח את מטהו ואת משפחתו. המסקנה של הסיפור היא שהתלבטות אינה סותרת מנהיגות.", "ar": "يسأل موسى ويتردد ويطلب - وفي النهاية ينطلق إلى مصر. مثال: بعد كل الأسئلة يأخذ عصاه وعائلته. خلاصة القصة أن التردد لا يناقض القيادة.", "ru": "Моисей спрашивает, колеблется и просит - и в конце отправляется в Египет. Пример: после всех вопросов он берёт свой посох и семью. Вывод рассказа: колебание не противоречит лидерству.", "en": "Moses asks, hesitates and pleads - and in the end sets out for Egypt. Example: after all the questions he takes his staff and his family. The story's conclusion is that hesitation does not contradict leadership."},null,[null,{"he": "הסיפור ממשיך ומשלח אותו למרות ההתלבטות.", "ar": "القصة تتابع وترسله رغم التردد.", "ru": "Рассказ продолжается и посылает его несмотря на колебание.", "en": "The story goes on and sends him despite the hesitation."},{"he": "השליחות מתקיימת; הדיאלוג אינו מבטל אותה.", "ar": "الرسالة تتحقق؛ الحوار لا يلغيها.", "ru": "Поручение исполняется; диалог его не отменяет.", "en": "The mission is carried out; the dialogue does not cancel it."},{"he": "השאלות מופיעות בטקסט עצמו; הן חלק מהדרך.", "ar": "الأسئلة واردة في النص نفسه؛ هي جزء من الطريق.", "ru": "Вопросы присутствуют в самом тексте; они часть пути.", "en": "The questions appear in the text itself; they are part of the way."}]),Q("bib-exo-sea-faith",{"he": "תלמידה טוענת שקריעת ים סוף באה רק כדי להציל את ישראל. מה עוד רואה הטקסט?", "ar": "تقول طالبة إن شق بحر القصب جاء فقط لإنقاذ إسرائيل. ماذا يرى النص أيضًا؟", "ru": "Ученица утверждает, что переход через море был только ради спасения Израиля. Что ещё видит текст?", "en": "A student claims the sea crossing came only to rescue Israel. What else does the text see?"},[{"he": "שהאירוע מביא את העם לשירה ולאמונה: 'ויאמינו בה' ובמשה עבדו'", "ar": "أن الحدث يقود الشعب إلى النشيد والإيمان: «فآمنوا بالرب وبموسى عبده»", "ru": "Что событие приводит народ к песне и вере: «и поверили в Господа и в Моисея, раба Его»", "en": "That the event leads the people to song and faith: \"they believed in the Lord and in Moses His servant\""},{"he": "שהים נשאר פתוח לנצח", "ar": "أن البحر بقي مفتوحًا إلى الأبد", "ru": "Что море осталось разверстым навсегда", "en": "That the sea stayed open forever"},{"he": "שהמטרה הייתה מלחמה נוספת", "ar": "أن الهدف كان حربًا إضافية", "ru": "Что целью была ещё одна война", "en": "That the goal was another war"},{"he": "שהטקסט אומר שזה סוף הסיפור כולו", "ar": "أن النص يقول إن هذه نهاية القصة كلها", "ru": "Что текст говорит, будто это конец всей истории", "en": "That the text says this is the end of the whole story"}],0,{"he": "חפשו מה קורה מיד אחרי החצייה.", "ar": "ابحثوا عمّا يحدث مباشرة بعد العبور.", "ru": "Найдите, что происходит сразу после перехода.", "en": "Look at what happens right after the crossing."},{"he": "אחרי הים בא שירת הים, ובסופה: 'ויאמינו בה' ובמשה עבדו' (שמות י\"ד). דוגמה: ההצלה הופכת גם לרגע של אמונה משותפת, לא רק לבריחה. לכן 'רק כדי להציל' מחמיצה חלק מהמשמעות.", "ar": "بعد البحر يأتي نشيد البحر، وفي خاتمته: «فآمنوا بالرب وبموسى عبده» (الخروج 14). مثال: الإنقاذ يصبح أيضًا لحظة إيمان مشترك لا مجرد هروب. لذلك «فقط للإنقاذ» يفوّت جزءًا من المعنى.", "ru": "После моря следует Песнь моря, завершающаяся словами: «и поверили в Господа и в Моисея, раба Его» (Исход 14). Пример: спасение становится также моментом общей веры, а не только бегством. Поэтому «только ради спасения» упускает часть смысла.", "en": "After the sea comes the Song of the Sea, ending: \"they believed in the Lord and in Moses His servant\" (Exodus 14). Example: the rescue also becomes a moment of shared faith, not only an escape. So \"only to rescue\" misses part of the meaning."},null,[null,{"he": "המים חוזרים למצואנם בסוף הפרק.", "ar": "تعود المياه إلى مجراها في نهاية الفصل.", "ru": "Воды возвращаются в конце главы.", "en": "The waters return at the end of the chapter."},{"he": "אין מלחמה נוספת בפרק; התוצאה היא שירה ואמונה.", "ar": "لا حرب إضافية في الفصل؛ النتيجة نشيد وإيمان.", "ru": "В главе нет ещё одной войны; результат - песнь и вера.", "en": "There is no further war in the chapter; the outcome is song and faith."},{"he": "הסיפור ממשיך למדבר ולסיני; זו אינה הסוף.", "ar": "القصة تتابع إلى البرية وسيناء؛ هذه ليست النهاية.", "ru": "История продолжается в пустыне и у Синая; это не конец.", "en": "The story continues to the wilderness and Sinai; this is not the end."}])]]);

  Q("bib-choice-1261-1",{"he": "איזה תיאור מתאים לחזון העצמות היבשות?", "ar": "أي وصف يناسب رؤيا العظام اليابسة؟", "ru": "Какое описание подходит к «Видение сухих костей»?", "en": "Which description fits vision of dry bones?"},[{"he": "ביחזקאל ל״ז חזון העצמות מציג תחייה כדימוי לתקווה לעם מיואש.", "ar": "في حزقيال 37 تعرض رؤيا العظام حياة جديدة صورةً لأمل شعب يائس.", "ru": "В Иезекииле 37 оживление костей служит образом надежды для отчаявшегося народа.", "en": "In Ezekiel 37 the bones’ revival pictures hope for a despairing people."},{"he": "בירמיהו א׳ הנביא חושש שאינו יודע לדבר מפני שהוא צעיר, ונענה שלא יישאר לבדו.", "ar": "في إرميا 1 يخاف النبي لأنه فتى لا يحسن الكلام، فيُطمأن بأنه ليس وحده.", "ru": "В Иеремии 1 пророк опасается, что молод и не умеет говорить, и получает заверение в поддержке.", "en": "In Jeremiah 1 the prophet worries that he is young and cannot speak; he is reassured of support."},{"he": "בחוקי התורה חוזרת הדרישה להגן על גר, יתום ואלמנה.", "ar": "تتكرر في قوانين التوراة مطالب حماية الغريب واليتيم والأرملة.", "ru": "В законах Торы повторяется требование защищать пришельца, сироту и вдову.", "en": "Torah laws repeatedly call for protecting the stranger, orphan and widow."},{"he": "בקהלת א׳ תנועות חוזרות בטבע משמשות רקע לשאלת התועלת בעמל האדם.", "ar": "في الجامعة 1 تشكل حركات الطبيعة المتكررة خلفية للسؤال عن جدوى تعب الإنسان.", "ru": "В Екклесиасте 1 повторяющиеся движения природы служат фоном вопроса о пользе человеческого труда.", "en": "In Ecclesiastes 1 recurring motions of nature frame a question about the gain from human toil."}],0,{"he": "חפשו את הפרט שמבדיל אותו מן האחרים.", "ar": "ابحثوا عن التفصيل الذي يميزه عن غيره.", "ru": "Ищите отличие от остальных вариантов.", "en": "Look for the detail that separates it from the others."},{"he": "הנביא מסביר את החזון בהקשר של מצב העם.", "ar": "يشرح النبي الرؤيا في سياق حال الشعب.", "ru": "Пророк объясняет видение в связи с состоянием народа.", "en": "The prophet explains the vision in relation to the   Q("bib-choice-1261-2",{"he": "איזה תיאור מתאים להקדשת ירמיהו?", "ar": "أي وصف يناسب تكليف إرميا؟", "ru": "Какое описание подходит к «Призвание Иеремии»?", "en": "Which description fits Jeremiah’s calling?"},[{"he": "ביחזקאל ל״ז חזון העצמות מציג תחייה כדימוי לתקווה לעם מיואש.", "ar": "في حزقيال 37 تعرض رؤيا العظام حياة جديدة صورةً لأمل شعب يائس.", "ru": "В Иезекииле 37 оживление костей служит образом надежды для отчаявшегося народа.", "en": "In Ezekiel 37 the bones’ revival pictures hope for a despairing people."},{"he": "בירמיהו א׳ הנביא חושש שאינו יודע לדבר מפני שהוא צעיר, ונענה שלא יישאר לבדו.", "ar": "في إرميا 1 يخاف النبي لأنه فتى لا يحسن الكلام، فيُطمأن بأنه ليس وحده.", "ru": "В Иеремии 1 пророк опасается, что молод и не умеет говорить, и получает заверение в поддержке.", "en": "In Jeremiah 1 the prophet worries that he is young and cannot speak; he is reassured of support."},{"he": "בחוקי התורה חוזרת הדרישה להגן על גר, יתום ואלמנה.", "ar": "تتكرر في قوانين التوراة مطالب حماية الغريب واليتيم والأرملة.", "ru": "В законах Торы повторяется требование защищать пришельца, сироту и вдову.", "en": "Torah laws repeatedly call for protecting the stranger, orphan and widow."},{"he": "בקהלת א׳ תנועות חוזרות בטבע משמשות רקע לשאלת התועלת בעמל האדם.", "ar": "في الجامعة 1 تشكل حركات الطبيعة المتكررة خلفية للسؤال عن جدوى تعب الإنسان.", "ru": "В Екклесиасте 1 повторяющиеся движения природы служат фоном вопроса о пользе человеческого труда.", "en": "In Ecclesiastes 1 recurring motions of nature frame a question about the gain from human toil."}],1,{"he": "חפשו את הפרט שמבדיל אותו מן האחרים.", "ar": "ابحثوا عن التفصيل الذي يميزه عن غيره.", "ru": "Ищите отличие от остальных вариантов.", "en": "Look for the detail that separates it from the others."},{"he": "הפער בין חשש לשליחות עומד במרכז התיאור.", "ar": "التوتر بين الخوف والمهمة محور المشهد.", "ru": "Напряжение между страхом и поручением составляет суть эпизода.", "en": "The tension between fear and mission is central."},null,[{"he": "זה מתאר את חזון העצמות היבשות, לא את הקדשת ירמיהו.", "ar": "هذا يصف رؤيا العظام اليابسة، لا تكليف إرميا.", "ru": "Это описание «Видение сухих костей», а не «Призвание Иеремии».", "en": "That describes vision of dry bones, not Jeremiah’s calling."},null,{"he": "זה מתאר את חוק על יחס לחלש, לא את הקדשת ירמיהו.", "ar": "هذا يصف قانون معاملة الضعيف، لا تكليف إرميا.", "ru": "Это описание «Закон о защите слабого», а не «Призвание Иеремии».", "en": "That describes law on treatment of the vulnerable, not Jeremiah’s calling."},{"he": "זה מתאר את קהלת והמחזוריות, לא את הקדשת ירמיהו.", "ar": "هذا يصف الجامعة ودورات الطبيعة، لا تكليف إرميا.", "ru": "Это описание «Екклесиаст и циклы», а не «Призвание Иеремии».", "en": "That describes Ecclesiastes and cycles, not Jeremiah’s calling."}])
 ,Q("bib-choice61-bones",{"he": "מה קורה לעצמות בחזון העצמות היבשות של יחזקאל?", "ar": "ماذا يحدث للعظام في رؤيا العظام اليابسة لحزقيال؟", "ru": "Что происходит с костями в видении сухих костей Иезекииля?", "en": "What happens to the bones in Ezekiel's vision of the dry bones?"},[{"he": "הן מתחברות, מתכסות בגידים ובשר, ורוח חיים נכנסת בהן", "ar": "تتصل وتُغطى بالأوتار واللحم، وتدخل فيها روح الحياة", "ru": "Они соединяются, покрываются жилами и плотью, и в них входит дух жизни", "en": "They join together, are covered with sinews and flesh, and the breath of life enters them"},{"he": "הן נאספות ונקברות בבור", "ar": "تُجمع وتُدفن في حفرة", "ru": "Их собирают и хоронят в яме", "en": "They are gathered and buried in a pit"},{"he": "הן הופכות לאבנים בביקעה", "ar": "تتحول إلى حجارة في البقعة", "ru": "Они превращаются в камни в долине", "en": "They turn into stones in the valley"},{"he": "הן נשרפות באש גדולה", "ar": "تُحرق بنار عظيمة", "ru": "Они сгорают в большом огне", "en": "They are burned in a great fire"}],0,{"he": "עקבו אחרי שלבי החזון לפי הסדר.", "ar": "تتبّعوا مراحل الرؤيا بالترتيب.", "ru": "Проследите этапы видения по порядку.", "en": "Follow the stages of the vision in order."},{"he": "ביחזקאל ל\"ז העצמות עוברות שלבים: רעש, חיבור עצם אל עצם, גידים ובשר, ולבסוף 'ותבוא בהם הרוח ויחיו'. דוגמה: החזון הופך לסמל לתקומה של עם ישראל מן הגלות.", "ar": "في حزقيال 37 تمر العظام بمراحل: صوت، اتصال عظم بعظم، أوتار ولحم، وأخيرًا «فدخل فيها الروح فحييت». مثال: تصبح الرؤيا رمزًا لنهضة شعب إسرائيل من المنفى.", "ru": "В Иезекииле 37 кости проходят этапы: шум, соединение кости к кости, жилы и плоть, и наконец «вошёл в них дух, и они ожили». Пример: видение становится символом возрождения народа Израиля из изгнания.", "en": "In Ezekiel 37 the bones pass through stages: a noise, bone joining bone, sinews and flesh, and finally \"the breath came into them and they lived\". Example: the vision becomes a symbol of Israel's revival from exile."},null,[null,{"he": "אין קבורה בחזון; התהליך הוא ההפך - ממות לחיים.", "ar": "لا دفن في الرؤيا؛ المسار عكسي - من موت إلى حياة.", "ru": "В видении нет погребения; процесс обратный - от смерти к жизни.", "en": "There is no burial in the vision; the process is the reverse - from death to life."},{"he": "העצמות אינן הופכות לאבנים; הן חוזרות לחיים.", "ar": "العظام لا تتحول حجارة؛ تعود إلى الحياة.", "ru": "Кости не превращаются в камни; они возвращаются к жизни.", "en": "The bones do not turn to stones; they return to life."},{"he": "אין שריפה בחזון; הרוח מחיה את העצמות.", "ar": "لا حريق في الرؤيا؛ الروح تحيي العظام.", "ru": "В видении нет сожжения; дух оживляет кости.", "en": "There is no burning in the vision; the breath revives the bones."}])],
