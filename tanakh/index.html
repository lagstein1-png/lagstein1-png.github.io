  {"he": "קראו את הרצף כסיפור המסופר בטקסט", "ar": "اقرؤوا التسلسل كما يرويه النص", "ru": "Читайте последовательность как рассказ текста", "en": "Read the sequence as told in the text"},
[ [
  Q("bib-exodus-1261-1",{"he": "איזה תיאור מתאים ללידת משה?", "ar": "أي وصف يناسب ولادة موسى؟", "ru": "Какое описание подходит к «Рождение Моисея»?", "en": "Which description fits birth of Moses?"},[{"he": "בשמות ב׳ התינוק מוסתר, מונח בתיבה על היאור ונמצא בידי בת פרעה.", "ar": "في الخروج 2 يُخفى الرضيع ويوضع في سلة على النهر وتعثر عليه ابنة فرعون.", "ru": "В Исходе 2 младенца прячут, кладут в корзину у Нила, и его находит дочь фараона.", "en": "In Exodus 2 the infant is hidden, placed in a basket by the Nile and found by Pharaoh’s daughter."},{"he": "בשמות ג׳ משה נתקל בסנה בוער שאינו נשרף, ונקרא לשליחות.", "ar": "في الخروج 3 يرى موسى عليقة تشتعل ولا تحترق ويُدعى إلى مهمة.", "ru": "В Исходе 3 Моисей видит куст, который горит и не сгорает, и получает поручение.", "en": "In Exodus 3 Moses encounters a bush that burns without being consumed and receives a mission."},{"he": "בשמות י״ב מתוארת המכה האחרונה במצרים, ואחריה פרעה קורא לישראל לצאת.", "ar": "في الخروج 12 ترد الضربة الأخيرة في مصر، وبعدها يأمر فرعون بني إسرائيل بالخروج.", "ru": "В Исходе 12 описана последняя казнь в Египте, после которой фараон велит израильтянам уйти.", "en": "Exodus 12 describes the final plague in Egypt, after which Pharaoh tells the Israelites to leave."},{"he": "בשמות י״ד העם עובר בים לאחר מרדף המצרים; המים שבים עם סיום המעבר.", "ar": "في الخروج 14 يعبر الشعب البحر بعد ملاحقة المصريين، ثم تعود المياه.", "ru": "В Исходе 14 народ переходит море при преследовании египтян; затем воды возвращаются.", "en": "In Exodus 14 the people cross the sea under Egyptian pursuit; the waters then return."}],0,{"he": "חפשו את הפרט שמבדיל אותו מן האחרים.", "ar": "ابحثوا عن التفصيل الذي يميزه عن غيره.", "ru": "Ищите отличие от остальных вариантов.", "en": "Look for the detail that separates it from the others."},{"he": "הסיפור קושר פעולות של כמה נשים להצלת התינוק.", "ar": "يربط السرد أفعال عدة نساء بإنقاذ الرضيع.", "ru": "Повествование связывает действия нескольких женщин со спасением ребёнка.", "en": "The story links the actions of several women to the infant’s survival."},null,[null,{"he": "זה מתאר את הסנה הבוער, לא את לידת משה.", "ar": "هذا يصف العليقة المشتعلة، لا ولادة موسى.", "ru": "Это описание «Горящий куст», а не «Рождение Моисея».", "en": "That describes burning bush, not birth of Moses."},{"he": "זה מתאר את מכת בכורות, לא את לידת משה.", "ar": "هذا يصف ضربة الأبكار، لا ولادة موسى.", "ru": "Это описание «Поражение первенцев», а не «Рождение Моисея».", "en": "That describes plague of the firstborn, not birth of Moses."},{"he": "זה מתאר את חציית ים סוף, לא את לידת משה.", "ar": "هذا يصف عبور بحر سوف، لا ولادة موسى.", "ru": "Это описание «Переход через море Суф», а не «Рождение Моисея».", "en": "That describes crossing the Sea of Reeds, not birth of Moses."}]),
  Q("bib-exodus-1261-2",{"he": "איזה תיאור מתאים להסנה הבוער?", "ar": "أي وصف يناسب العليقة المشتعلة؟", "ru": "Какое описание подходит к «Горящий куст»?", "en": "Which description fits burning bush?"},[{"he": "בשמות ב׳ התינוק מוסתר, מונח בתיבה על היאור ונמצא בידי בת פרעה.", "ar": "في الخروج 2 يُخفى الرضيع ويوضع في سلة على النهر وتعثر عليه ابنة فرعون.", "ru": "В Исходе 2 младенца прячут, кладут в корзину у Нила, и его находит дочь фараона.", "en": "In Exodus 2 the infant is hidden, placed in a basket by the Nile and found by Pharaoh’s daughter."},{"he": "בשמות ג׳ משה נתקל בסנה בוער שאינו נשרף, ונקרא לשליחות.", "ar": "في الخروج 3 يرى موسى عليقة تشتعل ولا تحترق ويُدعى إلى مهمة.", "ru": "В Исходе 3 Моисей видит куст, который горит и не сгорает, и получает поручение.", "en": "In Exodus 3 Moses encounters a bush that burns without being consumed and receives a mission."},{"he": "בשמות י״ב מתוארת המכה האחרונה במצרים, ואחריה פרעה קורא לישראל לצאת.", "ar": "في الخروج 12 ترد الضربة الأخيرة في مصر، وبعدها يأمر فرعون بني إسرائيل بالخروج.", "ru": "В Исходе 12 описана последняя казнь в Египте, после которой фараон велит израильтянам уйти.", "en": "Exodus 12 describes the final plague in Egypt, after which Pharaoh tells the Israelites to leave."},{"he": "בשמות י״ד העם עובר בים לאחר מרדף המצרים; המים שבים עם סיום המעבר.", "ar": "في الخروج 14 يعبر الشعب البحر بعد ملاحقة المصريين، ثم تعود المياه.", "ru": "В Исходе 14 народ переходит море при преследовании египтян; затем воды возвращаются.", "en": "In Exodus 14 the people cross the sea under Egyptian pursuit; the waters then return."}],1,{"he": "חפשו את הפרט שמבדיל אותו מן האחרים.", "ar": "ابحثوا عن التفصيل الذي يميزه عن غيره.", "ru": "Ищите отличие от остальных вариантов.", "en": "Look for the detail that separates it from the others."},{"he": "המפגש מציג את הקריאה למשה ואת תגובתו לשליחות.", "ar": "يقدّم اللقاء دعوة موسى وردّه على المهمة.", "ru": "Встреча представляет призвание Моисея и его ответ.", "en": "The encounter introduces Moses’s calling and response."},null,[{"he": "זה מתאר את לידת משה, לא את הסנה הבוער.", "ar": "هذا يصف ولادة موسى، لا العليقة المشتعلة.", "ru": "Это описание «Рождение Моисея», а не «Горящий куст».", "en": "That describes birth of Moses, not burning bush."},null,{"he": "זה מתאר את מכת בכורות, לא את הסנה הבוער.", "ar": "هذا يصف ضربة الأبكار، لا العليقة المشتعلة.", "ru": "Это описание «Поражение первенцев», а не «Горящий куст».", "en": "That describes plague of the firstborn, not burning bush."},{"he": "זה מתאר את חציית ים סוף, לא את הסנה הבוער.", "ar": "هذا يصف عبور بحر سوف، لا العليقة المشتعلة.", "ru": "Это описание «Переход через море Суф», а не «Горящий куст».", "en": "That describes crossing the Sea of Reeds, not burning bush."}])
 ,Q("bib-exo-moses-raised",{"he": "מי גידל את משה אחרי שנמשה מן היאור?", "ar": "مَن ربّى موسى بعد أن أُخرج من النيل؟", "ru": "Кто вырастил Моисея после того, как его вынули из Нила?", "en": "Who raised Moses after he was drawn out of the Nile?"},[{"he": "תחילה אמו, שהוחכרה כמיניקה, ואחר כך בת פרעה בארמון", "ar": "أولًا أمه التي استُؤجرت مرضعة، ثم ابنة فرعون في القصر", "ru": "Сначала его мать, нанятая кормилицей, а затем дочь фараона во дворце", "en": "First his mother, hired as a wet nurse, and then Pharaoh's daughter in the palace"},{"he": "שפחה מצרית שמצאה אותו בנהר", "ar": "جارية مصرية وجدته في النهر", "ru": "Египетская служанка, нашедшая его в реке", "en": "An Egyptian maid who found him in the river"},{"he": "יתרו, כהן מדיין, מיום הולדתו", "ar": "يترو كاهن مديان منذ يوم مولده", "ru": "Иетро, священник Мадиана, со дня рождения", "en": "Jethro, priest of Midian, from his birthday"},{"he": "אהרן אחיו, בבית אביו", "ar": "هرون أخوه في بيت أبيه", "ru": "Его брат Аарон, в доме отца", "en": "His brother Aaron, in his father's house"}],0,{"he": "קראו שוב את הרצף מן היאור ועד הארמון.", "ar": "أعيدوا قراءة التسلسل من النيل إلى القصر.", "ru": "Перечитайте последовательность от Нила до дворца.", "en": "Read again the sequence from the Nile to the palace."},{"he": "בשמות ב' בת פרעה מוצאת את התינוק, ומירים מציעה להביא מיניקה עברית - והמיניקה היא אמו של משה. דוגמה: כך משה גדל קודם בבית ישראלי ואחר כך בארמון מצרי, ושני העולמות האלה ילוו אותו.", "ar": "في الخروج 2 تجد ابنة فرعون الطفل، وتقترح مريم إحضار مرضعة عبرية - والمرضعة هي أم موسى. مثال: هكذا يكبر موسى أولًا في بيت عبراني ثم في قصر مصري، وسيرافقه هذان العالمان.", "ru": "В Исходе 2 дочь фараона находит младенца, и Мирьям предлагает привести еврейскую кормилицу - ею оказывается мать Моисея. Пример: так Моисей растёт сначала в еврейском доме, а затем в египетском дворце, и оба мира будут сопровождать его.", "en": "In Exodus 2 Pharaoh's daughter finds the baby, and Miriam offers to bring a Hebrew wet nurse - who turns out to be Moses' own mother. Example: so Moses grows up first in an Israelite home and then in an Egyptian palace, and both worlds will accompany him."},null,[null,{"he": "המוצאת היא בת פרעה עצמה, לא שפחה.", "ar": "الواجدة هي ابنة فرعون نفسها لا جارية.", "ru": "Нашедшая - сама дочь фараона, а не служанка.", "en": "The finder is Pharaoh's daughter herself, not a maid."},{"he": "יתרו נכנס לסיפור רק כשמשה בוגר ובורח למדיין.", "ar": "يترو يدخل القصة فقط حين يكبر موسى ويهرب إلى مديان.", "ru": "Иетро появляется только когда взрослый Моисей бежит в Мадиан.", "en": "Jethro enters the story only when adult Moses flees to Midian."},{"he": "אהרן אינו מוזכר כמי שגידל את משה.", "ar": "هرون لا يُذكر كمَن ربّى موسى.", "ru": "Аарон не упомянут как воспитавший Моисея.", "en": "Aaron is not mentioned as the one who raised Moses."}]),
  Q("exo-1-01",{"he": "איך נקראו המיילדות שלא צייתו לפרעה בשמות א׳?", "ar": "ما اسما القابلتين اللتين لم تطيعا فرعون في الخروج 1؟", "ru": "Как звали повитух, которые не послушались фараона в Исходе 1?", "en": "What were the names of the midwives who disobeyed Pharaoh in Exodus 1?"},[{"he": "מרים ויוכבד", "ar": "مريم ويوكابد", "ru": "Мариам и Иохаведа", "en": "Miriam and Jochebed"}, {"he": "שפרה ופועה", "ar": "شفرة وفوعة", "ru": "Шифра и Пуа", "en": "Shiphrah and Puah"}, {"he": "צפורה ומרים", "ar": "صفورة ومريم", "ru": "Сепфора и Мариам", "en": "Zipporah and Miriam"}, {"he": "אלישבע ויוכבד", "ar": "أليشابع ويوكابد", "ru": "Елисавета и Иохаведа", "en": "Elisheba and Jochebed"}],1,{"he": "השמות מופיעים מיד כשפרעה פונה אליהן.", "ar": "الاسمان يظهران حين يخاطبهما فرعون مباشرة.", "ru": "Имена звучат сразу, когда фараон к ним обращается.", "en": "The names appear as soon as Pharaoh speaks to them."},{"he": "בשמות א׳ פרעה מצווה על המיילדות להמית את הבנים. הכתוב אומר שהן יראו את האלוהים ולא עשו זאת. שמותיהן הם שפרה ופועה.", "ar": "في الخروج 1 يأمر فرعون القابلتين بقتل الذكور. يقول النص إنهما خافتا الله ولم تفعلا. اسماهما شفرة وفوعة.", "ru": "В Исходе 1 фараон велит повитухам умерщвлять мальчиков. Текст говорит, что они боялись Бога и не сделали этого. Их звали Шифра и Пуа.", "en": "In Exodus 1 Pharaoh orders the midwives to kill the boys. The text says they feared God and did not do it. Their names were Shiphrah and Puah."},null,[{"he": "מרים היא אחות משה, ויוכבד היא אמו. הן אינן המיילדות.", "ar": "مريم أخت موسى، ويوكابد أمه. ليستا القابلتين.", "ru": "Мариам — сестра Моисея, Иохаведа — его мать. Они не повитухи.", "en": "Miriam is Moses' sister and Jochebed is his mother. They are not the midwives."}, null, {"he": "צפורה היא אשת משה, והוא פוגש אותה רק במדין, בפרק ב׳.", "en": "Zipporah is Moses' wife; he meets her only later, in Midian (ch. 2).", "ru": "Сепфора — жена Моисея; он встречает её позже, в Мадиаме (гл. 2).", "ar": "صفورة زوجة موسى، ويلتقيها لاحقًا فقط في مديان (الإصحاح 2)."}, {"he": "אלישבע היא אשת אהרן, ואינה מוזכרת בפרק א׳.", "ar": "أليشابع زوجة هارون، ولا تُذكر في الإصحاح 1.", "ru": "Елисавета — жена Аарона, в главе 1 её нет.", "en": "Elisheba is Aaron's wife and is not mentioned in chapter 1."}]),
  Q("exo-1-02",{"he": "מדוע ברח משה ממצרים אל מדין?", "ar": "لماذا هرب موسى من مصر إلى مديان؟", "ru": "Почему Моисей бежал из Египта в Мадиам?", "en": "Why did Moses flee from Egypt to Midian?"},[{"he": "בת פרעה שלחה אותו להביא שם אישה", "ar": "ابنة فرعون أرسلته ليأتي بزوجة من هناك", "ru": "Дочь фараона послала его найти там жену", "en": "Pharaoh's daughter sent him there to find a wife"}, {"he": "רעב כבד פרץ בכל ארץ מצרים ובארצות סביבה", "ar": "وقع جوع شديد في كل أرض مصر وفي البلدان حولها", "ru": "Во всём Египте и в соседних странах начался сильный голод", "en": "A severe famine broke out across Egypt and the lands around it"}, {"he": "אלוהים ציווה עליו ללכת אל יתרו", "ar": "أمره الله أن يذهب إلى يثرون", "ru": "Бог велел ему идти к Иофору", "en": "God commanded him to go to Jethro"}, {"he": "הוא הרג מצרי, ופרעה ביקש להרוג אותו", "ar": "قتل مصريًا، وطلب فرعون قتله", "ru": "Он убил египтянина, и фараон хотел его убить", "en": "He killed an Egyptian, and Pharaoh sought to kill him"}],3,{"he": "בדקו מה משה עשה כשראה מצרי מכה עברי.", "ar": "تحقّقوا مما فعله موسى حين رأى مصريًا يضرب عبرانيًا.", "ru": "Посмотрите, что сделал Моисей, увидев, как египтянин бьёт еврея.", "en": "Check what Moses did when he saw an Egyptian beating a Hebrew."},{"he": "בשמות ב׳ משה רואה מצרי מכה איש עברי, ומכה את המצרי. למחרת הוא מבין שהדבר נודע. פרעה מבקש להרוג אותו, ומשה בורח למדין.", "ar": "في الخروج 2 يرى موسى مصريًا يضرب رجلًا عبرانيًا، فيقتل المصري. في اليوم التالي يفهم أن الأمر انكشف. يطلب فرعون قتله، فيهرب موسى إلى مديان.", "ru": "В Исходе 2 Моисей видит, как египтянин бьёт еврея, и убивает египтянина. На следующий день он понимает, что это стало известно. Фараон хочет его убить, и Моисей бежит в Мадиам.", "en": "In Exodus 2 Moses sees an Egyptian beating a Hebrew and strikes the Egyptian down. The next day he realizes it is known. Pharaoh seeks to kill him, and Moses flees to Midian."},null,[{"he": "משה לא נשלח. הוא ברח, ופגש את צפורה רק במדין.", "ar": "موسى لم يُرسَل. بل هرب، والتقى صفورة في مديان فقط.", "ru": "Моисея не посылали. Он бежал и встретил Сепфору уже в Мадиаме.", "en": "Moses was not sent. He fled, and met Zipporah only in Midian."}, {"he": "רעב מביא את משפחת יעקב למצרים בבראשית, לא את משה למדין.", "ar": "الجوع جاء بعائلة يعقوب إلى مصر في التكوين، لا بموسى إلى مديان.", "ru": "Голод привёл семью Иакова в Египет в Бытии, а не Моисея в Мадиам.", "en": "Famine brings Jacob's family to Egypt in Genesis, not Moses to Midian."}, {"he": "הקריאה של אלוהים למשה באה רק אחרי שנים, בסנה.", "ar": "دعوة الله لموسى تأتي بعد سنين، عند العليقة.", "ru": "Божий призыв приходит к Моисею лишь спустя годы, у куста.", "en": "God's call comes to Moses only years later, at the bush."}, null]),
  Q("exo-1-03",{"he": "עם מי התחתן משה במדין?", "ar": "بمَن تزوّج موسى في مديان؟", "ru": "На ком женился Моисей в Мадиаме?", "en": "Whom did Moses marry in Midian?"},[{"he": "עם צפורה, בת כהן מדין", "ar": "صفورة، ابنة كاهن مديان", "ru": "На Сепфоре, дочери мадиамского священника", "en": "Zipporah, daughter of the priest of Midian"}, {"he": "עם מרים, בת עמרם", "ar": "مريم، ابنة عمرام", "ru": "На Мариам, дочери Амрама", "en": "Miriam, daughter of Amram"}, {"he": "עם אלישבע, בת עמינדב", "ar": "أليشابع، ابنة عميناداب", "ru": "На Елисавете, дочери Аминадава", "en": "Elisheba, daughter of Amminadab"}, {"he": "עם בת פרעה, שגידלה אותו", "ar": "ابنة فرعون التي ربّته", "ru": "На дочери фараона, вырастившей его", "en": "Pharaoh's daughter, who raised him"}],0,{"he": "היא אחת משבע הבנות שמשה הושיע ליד הבאר.", "ar": "هي إحدى البنات السبع اللواتي أنقذهن موسى عند البئر.", "ru": "Это одна из семи дочерей, которых Моисей защитил у колодца.", "en": "She is one of the seven daughters Moses helped at the well."},{"he": "בשמות ב׳ משה מושיע את שבע בנות כהן מדין מן הרועים. אביהן מזמין אותו לביתו. משה נשאר שם ומקבל לאישה את צפורה.", "ar": "في الخروج 2 ينقذ موسى بنات كاهن مديان السبع من الرعاة. يدعوه أبوهن إلى بيته. يبقى موسى هناك ويأخذ صفورة زوجة.", "ru": "В Исходе 2 Моисей защищает семь дочерей мадиамского священника от пастухов. Их отец приглашает его в дом. Моисей остаётся там и получает в жёны Сепфору.", "en": "In Exodus 2 Moses saves the seven daughters of the priest of Midian from the shepherds. Their father invites him home. Moses stays and is given Zipporah as his wife."},null,[null, {"he": "מרים היא אחותו של משה, ולא אשתו.", "ar": "مريم أخت موسى، لا زوجته.", "ru": "Мариам — сестра Моисея, а не жена.", "en": "Miriam is Moses' sister, not his wife."}, {"he": "אלישבע היא אשתו של אהרן, אחי משה.", "ar": "أليشابع زوجة هارون، أخي موسى.", "ru": "Елисавета — жена Аарона, брата Моисея.", "en": "Elisheba is the wife of Aaron, Moses' brother."}, {"he": "בת פרעה גידלה את משה כבן. היא אינה אשתו.", "ar": "ابنة فرعون ربّت موسى كابن. ليست زوجته.", "ru": "Дочь фараона растила Моисея как сына. Она не жена ему.", "en": "Pharaoh's daughter raised Moses as a son. She is not his wife."}]),
  Q("exo-1-04",{"he": "מה ירד לעם במדבר בכל בוקר, וביום השישי לקטו ממנו כפליים?", "ar": "ماذا نزل على الشعب في البرية كل صباح، وفي اليوم السادس جمعوا منه ضعفين؟", "ru": "Что выпадало народу в пустыне каждое утро, а в шестой день собирали вдвое?", "en": "What came down for the people in the desert each morning, and on the sixth day they gathered double?"},[{"he": "השליו", "ar": "السلوى", "ru": "Перепела", "en": "The quail"}, {"he": "מים מן הצור", "ar": "الماء من الصخرة", "ru": "Вода из скалы", "en": "Water from the rock"}, {"he": "המן", "ar": "المنّ", "ru": "Манна", "en": "The manna"}, {"he": "לחם ממצרים", "ar": "خبز من مصر", "ru": "Хлеб из Египта", "en": "Bread from Egypt"}],2,{"he": "הוא היה לבן, וטעמו כצפיחית בדבש.", "en": "It was white, and tasted like wafers with honey.", "ru": "Она была белая, а на вкус — как лепёшка с мёдом.", "ar": "كان أبيض، وطعمه كرقاقة بعسل."},{"he": "בשמות ט״ז יורד בכל בוקר לחם מן השמים. העם קורא לו מן. ביום השישי לוקטים כפליים, כי בשבת הוא אינו יורד.", "ar": "في الخروج 16 ينزل كل صباح خبز من السماء. يسمّيه الشعب المنّ. وفي اليوم السادس يجمعون ضعفين، لأنه لا ينزل في السبت.", "ru": "В Исходе 16 каждое утро с неба выпадает хлеб. Народ называет его манной. В шестой день собирают вдвое, потому что в субботу она не выпадает.", "en": "In Exodus 16 bread from heaven comes down every morning. The people call it manna. On the sixth day they gather double, because it does not come on the Sabbath."},null,[{"he": "השליו הגיע בערב, ולא נאמר עליו שלקטו כפליים בשישי.", "ar": "السلوى جاءت في المساء، ولم يُقل إنهم جمعوا منها ضعفين في السادس.", "ru": "Перепела прилетели вечером; о двойной порции в шестой день о них не сказано.", "en": "The quail came in the evening, and nothing says they gathered double on the sixth day."}, {"he": "המים מן הצור באים בפרק י״ז, ואינם יורדים כל בוקר.", "ar": "الماء من الصخرة يأتي في الإصحاح 17، ولا ينزل كل صباح.", "ru": "Вода из скалы появляется в главе 17 и не выпадает каждое утро.", "en": "Water from the rock comes in chapter 17, and does not fall each morning."}, null, {"he": "העם רק מתגעגע ללחם של מצרים. שום לחם לא מגיע משם.", "ar": "الشعب يشتاق فقط إلى خبز مصر. لا يصل أي خبز من هناك.", "ru": "Народ лишь тоскует по хлебу Египта. Оттуда хлеб не приходит.", "en": "The people only miss the bread of Egypt. No bread arrives from there."}]),
  Q("exo-1-05",{"he": "מה הייתה המכה הראשונה במצרים?", "ar": "ما كانت الضربة الأولى في مصر؟", "ru": "Какой была первая казнь в Египте?", "en": "What was the first plague in Egypt?"},[{"he": "מי היאור הפכו לדם", "ar": "مياه النيل تحوّلت إلى دم", "ru": "Воды Нила превратились в кровь", "en": "The Nile's water turned to blood"}, {"he": "צפרדעים כיסו את הארץ", "ar": "الضفادع غطّت الأرض", "ru": "Жабы покрыли землю", "en": "Frogs covered the land"}, {"he": "חושך כבד ירד על מצרים", "ar": "ظلام كثيف حلّ على مصر", "ru": "Густая тьма опустилась на Египет", "en": "Thick darkness fell on Egypt"}, {"he": "כינים עלו מעפר הארץ", "ar": "البعوض خرج من تراب الأرض", "ru": "Мошки поднялись из праха земли", "en": "Lice came up from the dust of the land"}],0,{"he": "המכה הראשונה פוגעת במקור החיים של מצרים.", "ar": "الضربة الأولى تصيب مصدر حياة مصر.", "ru": "Первая казнь бьёт по источнику жизни Египта.", "en": "The first plague strikes Egypt's source of life."},{"he": "בשמות ז׳ מכים במטה את מי היאור, לעיני פרעה. המים הופכים לדם, והדגה מתה. המצרים אינם יכולים לשתות מן היאור.", "ar": "في الخروج 7 تُضرب مياه النيل بالعصا أمام فرعون. تتحوّل المياه إلى دم، ويموت السمك. ولا يستطيع المصريون الشرب من النيل.", "ru": "В Исходе 7 на глазах фараона жезлом ударяют по водам Нила. Вода становится кровью, рыба умирает. Египтяне не могут пить из Нила.", "en": "In Exodus 7 the Nile's water is struck with the staff before Pharaoh. The water turns to blood and the fish die. The Egyptians cannot drink from the Nile."},null,[null, {"he": "הצפרדעים הן המכה השנייה, אחרי הדם.", "ar": "الضفادع هي الضربة الثانية، بعد الدم.", "ru": "Жабы — вторая казнь, после крови.", "en": "The frogs are the second plague, after the blood."}, {"he": "החושך הוא המכה התשיעית, לפני מכת בכורות.", "ar": "الظلام هو الضربة التاسعة، قبل ضربة الأبكار.", "ru": "Тьма — девятая казнь, перед казнью первенцев.", "en": "Darkness is the ninth plague, before the death of the firstborn."}, {"he": "הכינים הן המכה השלישית.", "ar": "البعوض هو الضربة الثالثة.", "ru": "Мошки — третья казнь.", "en": "The lice are the third plague."}]),
  Q("exo-1-06",{"he": "מי הוביל את הלוחמים מול עמלק ברפידים?", "ar": "مَن قاد المحاربين ضد عماليق في رفيديم؟", "ru": "Кто вёл воинов против Амалика в Рефидиме?", "en": "Who led the fighters against Amalek at Rephidim?"},[{"he": "אהרן", "ar": "هارون", "ru": "Аарон", "en": "Aaron"}, {"he": "חור", "ar": "حور", "ru": "Ор", "en": "Hur"}, {"he": "יהושע", "ar": "يشوع", "ru": "Иисус Навин", "en": "Joshua"}, {"he": "כלב", "ar": "كالب", "ru": "Халев", "en": "Caleb"}],2,{"he": "זה המשרת של משה, שיוביל את העם אחריו.", "ar": "إنه خادم موسى الذي سيقود الشعب بعده.", "ru": "Это помощник Моисея, который потом поведёт народ.", "en": "This is Moses' aide, who will lead the people after him."},{"he": "בשמות י״ז משה אומר ליהושע לבחור אנשים ולצאת להילחם. משה עולה לראש הגבעה. אהרן וחור תומכים בידיו עד שקיעת השמש.", "ar": "في الخروج 17 يقول موسى ليشوع أن يختار رجالًا ويخرج للقتال. يصعد موسى إلى رأس التلة. هارون وحور يسندان يديه حتى غروب الشمس.", "ru": "В Исходе 17 Моисей велит Иисусу Навину выбрать людей и выйти на бой. Моисей поднимается на холм. Аарон и Ор поддерживают его руки до заката.", "en": "In Exodus 17 Moses tells Joshua to choose men and go out to fight. Moses goes up to the hilltop. Aaron and Hur hold up his hands until sunset."},null,[{"he": "אהרן עמד עם משה על ראש הגבעה ותמך בידיו.", "ar": "هارون وقف مع موسى على رأس التلة وسند يديه.", "ru": "Аарон стоял с Моисеем на вершине холма и поддерживал его руки.", "en": "Aaron stood with Moses on the hilltop and held up his hands."}, {"he": "גם חור היה על הגבעה ותמך בידי משה, ולא לחם.", "ar": "حور أيضًا كان على التلة وسند يدي موسى، ولم يقاتل.", "ru": "Ор тоже был на холме и поддерживал руки Моисея, а не сражался.", "en": "Hur too was on the hill holding up Moses' hands, not fighting."}, null, {"he": "כלב מופיע בסיפור המרגלים בספר במדבר, לא כאן.", "ar": "كالب يظهر في قصة الجواسيس في سفر العدد، لا هنا.", "ru": "Халев появляется в истории разведчиков в книге Чисел, а не здесь.", "en": "Caleb appears in the spies story in Numbers, not here."}])],
 [
  Q("bib-exodus-1261-3",{"he": "איזה תיאור מתאים למכת בכורות?", "ar": "أي وصف يناسب ضربة الأبكار؟", "ru": "Какое описание подходит к «Поражение первенцев»?", "en": "Which description fits plague of the firstborn?"},[{"he": "בשמות ב׳ התינוק מוסתר, מונח בתיבה על היאור ונמצא בידי בת פרעה.", "ar": "في الخروج 2 يُخفى الرضيع ويوضع في سلة على النهر وتعثر عليه ابنة فرعون.", "ru": "В Исходе 2 младенца прячут, кладут в корзину у Нила, и его находит дочь фараона.", "en": "In Exodus 2 the infant is hidden, placed in a basket by the Nile and found by Pharaoh’s daughter."},{"he": "בשמות ג׳ משה נתקל בסנה בוער שאינו נשרף, ונקרא לשליחות.", "ar": "في الخروج 3 يرى موسى عليقة تشتعل ولا تحترق ويُدعى إلى مهمة.", "ru": "В Исходе 3 Моисей видит куст, который горит и не сгорает, и получает поручение.", "en": "In Exodus 3 Moses encounters a bush that burns without being consumed and receives a mission."},{"he": "בשמות י״ב מתוארת המכה האחרונה במצרים, ואחריה פרעה קורא לישראל לצאת.", "ar": "في الخروج 12 ترد الضربة الأخيرة في مصر، وبعدها يأمر فرعون بني إسرائيل بالخروج.", "ru": "В Исходе 12 описана последняя казнь в Египте, после которой фараон велит израильтянам уйти.", "en": "Exodus 12 describes the final plague in Egypt, after which Pharaoh tells the Israelites to leave."},{"he": "בשמות י״ד העם עובר בים לאחר מרדף המצרים; המים שבים עם סיום המעבר.", "ar": "في الخروج 14 يعبر الشعب البحر بعد ملاحقة المصريين، ثم تعود المياه.", "ru": "В Исходе 14 народ переходит море при преследовании египтян; затем воды возвращаются.", "en": "In Exodus 14 the people cross the sea under Egyptian pursuit; the waters then return."}],2,{"he": "חפשו את הפרט שמבדיל אותו מן האחרים.", "ar": "ابحثوا عن التفصيل الذي يميزه عن غيره.", "ru": "Ищите отличие от остальных вариантов.", "en": "Look for the detail that separates it from the others."},{"he": "בטקסט המכה הזאת קודמת ליציאה ממצרים.", "ar": "في النص تسبق هذه الضربة الخروج من مصر.", "ru": "В тексте эта казнь предшествует исходу из Египта.", "en": "In the narrative this plague precedes the departure."},null,[{"he": "זה מתאר את לידת משה, לא את מכת בכורות.", "ar": "هذا يصف ولادة موسى، لا ضربة الأبكار.", "ru": "Это описание «Рождение Моисея», а не «Поражение первенцев».", "en": "That describes birth of Moses, not plague of the firstborn."},{"he": "זה מתאר את הסנה הבוער, לא את מכת בכורות.", "ar": "هذا يصف العليقة المشتعلة، لا ضربة الأبكار.", "ru": "Это описание «Горящий куст», а не «Поражение первенцев».", "en": "That describes burning bush, not plague of the firstborn."},null,{"he": "זה מתאר את חציית ים סוף, לא את מכת בכורות.", "ar": "هذا يصف عبور بحر سوف، لا ضربة الأبكار.", "ru": "Это описание «Переход через море Суф», а не «Поражение первенцев».", "en": "That describes crossing the Sea of Reeds, not plague of the firstborn."}])
 ,Q("bib-exo-reluctant",{"he": "מדוע משה מתלבט לקבל את השליחות בסנה הבוער?", "ar": "لماذا يتردد موسى في قبول الرسالة عند العليقة المشتعلة؟", "ru": "Почему Моисей колеблется принять поручение у горящего куста?", "en": "Why does Moses hesitate to accept the mission at the burning bush?"},[{"he": "הוא מרגיש שאינו מתאים ומבקש שישלחו שליח אחר", "ar": "يشعر أنه غير مناسب ويطلب أن يُرسل رسول آخر", "ru": "Он чувствует себя неподходящим и просит послать другого", "en": "He feels unfit and asks that someone else be sent"},{"he": "הוא פוחד מפני פרעה ומפני הצבא המצרי, ורק בגלל זה הוא מתלבט", "ar": "يخاف من فرعون ومن الجيش المصري، ولهذا وحده يتردد", "ru": "Он боится фараона и египетского войска, и только поэтому колеблется", "en": "He fears Pharaoh and the Egyptian army, and for that reason alone he hesitates"},{"he": "הוא רוצה להישאר רועה לעד", "ar": "يريد أن يبقى راعيًا إلى الأبد", "ru": "Он хочет навсегда остаться пастухом", "en": "He wants to remain a shepherd forever"},{"he": "הוא אינו מאמין במה שהוא רואה", "ar": "لا يؤمن بما يراه", "ru": "Он не верит в то, что видит", "en": "He does not believe what he sees"}],0,{"he": "חפשו את המילים שבהן הוא אומר 'מי אנוכי'.", "ar": "ابحثوا عن الكلمات التي يقول فيها «مَن أنا».", "ru": "Найдите слова, в которых он говорит «кто я».", "en": "Look for the words in which he says \"who am I\"."},{"he": "משה אומר: 'מי אנוכי כי אלך אל פרעה' (שמות ג'). דוגמה: הוא מונה סיבות - לא איש דברים, מי יאמינו לי - ומבקש 'שלח נא ביד תשלח'. ההתלבטות היא חלק מדמותו, לא סוף השליחות.", "ar": "يقول موسى: «مَن أنا حتى أذهب إلى فرعون» (الخروج 3). مثال: يعدّد أسبابًا - لست رجل كلام، مَن سيصدقني - ويطلب «أرسل بيد مَن ترسل». التردد جزء من شخصيته لا نهاية الرسالة.", "ru": "Моисей говорит: «кто я, чтобы идти к фараону» (Исход 3). Пример: он перечисляет причины - не человек речи, кто поверит мне - и просит «пошли того, кого пошлёшь». Колебание - часть его образа, а не конец поручения.", "en": "Moses says: \"Who am I that I should go to Pharaoh\" (Exodus 3). Example: he lists reasons - not a man of words, who will believe me - and asks \"send someone else\". The hesitation is part of his character, not the end of the mission."},null,[null,{"he": "הפחד מפרעה אינו מה שמשה מציג; הוא מדבר על חוסר התאמה עצמית.", "ar": "الخوف من فرعون ليس ما يعرضه موسى؛ يتكلم عن عدم ملاءمة ذاتية.", "ru": "Страх перед фараоном не то, что выдвигает Моисей; он говорит о собственной непригодности.", "en": "Fear of Pharaoh is not what Moses raises; he speaks of his own unfitness."},{"he": "אין רמז שהוא רוצה להישאר; הוא שואל שאלות על השליחות עצמה.", "ar": "لا إشارة إلى أنه يريد البقاء؛ يسأل عن الرسالة نفسها.", "ru": "Нет намёка, что он хочет остаться; он задаёт вопросы о самом поручении.", "en": "There is no hint he wants to stay; he asks questions about the mission itself."},{"he": "הוא רואה ומאמין בסנה; ההתלבטות היא על היכולת שלו.", "ar": "يرى العليقة ويؤمن بها؛ التردد حول قدرته هو.", "ru": "Он видит куст и верит; колебание - о его собственной способности.", "en": "He sees and believes the bush; the hesitation is about his own ability."}]),Q("bib-exo-plagues-goal",{"he": "מה מטרת המכות כפי שהסיפור מציג אותה?", "ar": "ما هدف الضربات كما تعرضه القصة؟", "ru": "Какова цель казней, как её представляет рассказ?", "en": "What is the goal of the plagues as the story presents it?"},[{"he": "שחרור ישראל והכרה: 'וידעו מצרים כי אני ה'', ובישראל אף הם", "ar": "تحرير إسرائيل والمعرفة: «فيعلم المصريون أني أنا الرب»، وكذلك في إسرائيل", "ru": "Освобождение Израиля и познание: «и узнают египтяне, что я Господь», а также в Израиле", "en": "Israel's release and recognition: \"the Egyptians shall know that I am the Lord\", and in Israel too"},{"he": "המכות הן עונש למצרים בלבד, בלי שום מטרה נוספת מעבר לעונש עצמו", "ar": "الضربات عقاب للمصريين فقط، دون أي هدف إضافي وراء العقاب نفسه", "ru": "Казни - только наказание египтянам, без какой-либо иной цели сверх самого наказания", "en": "The plagues are a punishment for Egypt only, with no further goal beyond the punishment itself"},{"he": "הפגנת כוח בלי קשר לשחרור", "ar": "استعراض قوة لا صلة له بالتحرير", "ru": "Демонстрация силы, не связанная с освобождением", "en": "A show of force unrelated to the release"},{"he": "להכניע את משה לפני העם", "ar": "إذلال موسى أمام الشعب", "ru": "Уничижить Моисея перед народом", "en": "To humble Moses before the people"}],0,{"he": "חפשו פסוק שאומר למה זה קורה, לא רק מה קורה.", "ar": "ابحثوا عن آية تقول لماذا يحدث هذا لا فقط ماذا يحدث.", "ru": "Найдите стих, объясняющий, зачем это происходит, а не только что происходит.", "en": "Look for a verse that says why this happens, not only what happens."},{"he": "המכות חוזרות עם נוסח קבוע: 'בזאת תדע כי אני ה'' (למשל שמות ז'). דוגמה: המטרה כפולה - להוציא את ישראל, ושגם מצרים וגם ישראל יכירו. לכן 'עונש בלבד' אינו מספיק.", "ar": "تتكرر الضربات بصيغة ثابتة: «بهذا تعلم أني أنا الرب» (مثل الخروج 7). مثال: الهدف مزدوج - إخراج إسرائيل، وأن يعرف المصريون وإسرائيل معًا. لذلك «عقاب فقط» غير كافٍ.", "ru": "Казни повторяются с постоянной формулой: «из сего узнаешь, что я Господь» (например, Исход 7). Пример: цель двойная - вывести Израиль и чтобы узнали и египтяне, и Израиль. Поэтому «только наказание» недостаточно.", "en": "The plagues repeat a fixed formula: \"by this you shall know that I am the Lord\" (for example Exodus 7). Example: the goal is double - to bring Israel out, and that both Egypt and Israel will know. So \"punishment only\" is not enough."},null,[null,{"he": "הנוסח החוזר מראה שיש מטרה מעבר לעונש.", "ar": "الصيغة المتكررة تُظهر أن هناك هدفًا وراء العقاب.", "ru": "Повторяющаяся формула показывает цель сверх наказания.", "en": "The repeating formula shows a goal beyond punishment."},{"he": "המכות קשורות ישירות לדרישה לשחרר את העם.", "ar": "الضربات مرتبطة مباشرة بمطلب إطلاق الشعب.", "ru": "Казни напрямую связаны с требованием отпустить народ.", "en": "The plagues are directly tied to the demand to free the people."},{"he": "משה הוא שליח המכות, לא מושא ההכנעה.", "ar": "موسى رسول الضربات لا موضوع الإذلال.", "ru": "Моисей - посланник казней, а не объект уничижения.", "en": "Moses is the plagues' messenger, not the object of humbling."}]),
  Q("exo-2-01",{"he": "לפי שמות א׳, מדוע החליט פרעה לשעבד את בני ישראל?", "ar": "بحسب الخروج 1، لماذا قرّر فرعون استعباد بني إسرائيل؟", "ru": "Почему, согласно Исходу 1, фараон решил поработить израильтян?", "en": "According to Exodus 1, why did Pharaoh decide to enslave the Israelites?"},[{"he": "רצה לנקום במשפחת יוסף על שנות הרעב", "ar": "أراد الانتقام من عائلة يوسف بسبب سنوات الجوع", "ru": "Хотел отомстить семье Иосифа за годы голода", "en": "He wanted revenge on Joseph's family for the famine years"}, {"he": "בני ישראל סירבו לשלם מס למלך", "ar": "بنو إسرائيل رفضوا دفع الضريبة للملك", "ru": "Израильтяне отказались платить царю подать", "en": "The Israelites refused to pay taxes to the king"}, {"he": "בני ישראל מרדו בו בגלוי", "ar": "بنو إسرائيل تمرّدوا عليه علنًا", "ru": "Израильтяне открыто восстали против него", "en": "The Israelites openly rebelled against him"}, {"he": "חשש שירבו ויצטרפו לאויביו במלחמה", "ar": "خشي أن يكثروا وينضمّوا إلى أعدائه في الحرب", "ru": "Боялся, что они умножатся и примкнут к врагам на войне", "en": "He feared they would multiply and join his enemies in war"}],3,{"he": "פרעה מדבר על מה שעלול לקרות בעתיד.", "ar": "فرعون يتكلم عمّا قد يحدث في المستقبل.", "ru": "Фараон говорит о том, что может случиться в будущем.", "en": "Pharaoh speaks about what might happen in the future."},{"he": "בשמות א׳ פרעה אומר לעמו שבני ישראל רבים ועצומים. הוא חושש שבמלחמה יצטרפו לשונאי מצרים. לכן הוא שם עליהם מסים ועבודה קשה.", "ar": "في الخروج 1 يقول فرعون لشعبه إن بني إسرائيل كثيرون وأقوياء. يخشى أن ينضمّوا في الحرب إلى أعداء مصر. لذلك يفرض عليهم التسخير والعمل الشاق.", "ru": "В Исходе 1 фараон говорит народу, что израильтян много и они сильны. Он боится, что в войне они примкнут к врагам Египта. Поэтому он обременяет их тяжким трудом.", "en": "In Exodus 1 Pharaoh tells his people the Israelites are many and mighty. He fears that in war they will join Egypt's enemies. So he puts them to hard labor."},null,[{"he": "המלך החדש ״לא ידע את יוסף״. אין בכתוב נקמה.", "ar": "الملك الجديد لم يعرف يوسف. لا انتقام في النص.", "ru": "Новый царь «не знал Иосифа». О мести текст не говорит.", "en": "The new king 'did not know Joseph'. The text speaks of no revenge."}, {"he": "הכתוב אינו מזכיר סירוב או מס. השעבוד בא מפחד.", "ar": "النص لا يذكر رفضًا أو ضريبة. الاستعباد نابع من الخوف.", "ru": "Текст не упоминает ни отказа, ни подати. Рабство вызвано страхом.", "en": "The text mentions no refusal or tax. The slavery comes from fear."}, {"he": "אין מרד בפרק א׳. פרעה פוחד ממה שעלול לקרות.", "ar": "لا تمرّد في الإصحاح 1. فرعون يخاف مما قد يحدث.", "ru": "В главе 1 нет восстания. Фараон боится того, что может случиться.", "en": "There is no revolt in chapter 1. Pharaoh fears what might happen."}, null]),
  Q("exo-2-02",{"he": "איזו בעיה ראה יתרו בדרך שבה משה שפט את העם?", "ar": "ما المشكلة التي رآها يثرون في طريقة قضاء موسى للشعب؟", "ru": "Какую проблему увидел Иофор в том, как Моисей судил народ?", "en": "What problem did Jethro see in the way Moses judged the people?"},[{"he": "משה פוסק בלי לשמוע את שני הצדדים", "ar": "موسى يحكم دون أن يسمع الطرفين", "ru": "Моисей решает, не выслушав обе стороны", "en": "Moses rules without hearing both sides"}, {"he": "משה שופט לבד מבוקר עד ערב, ויישחק", "ar": "موسى يقضي وحده من الصباح إلى المساء، وسيُنهَك", "ru": "Моисей судит один с утра до вечера и изнурит себя", "en": "Moses judges alone from morning to evening and will wear out"}, {"he": "העם אינו בא אל משה עם שאלותיו", "ar": "الشعب لا يأتي إلى موسى بأسئلته", "ru": "Народ не приходит к Моисею со своими вопросами", "en": "The people do not come to Moses with their questions"}, {"he": "משה מסרב ללמד את העם חוקים", "ar": "موسى يرفض أن يعلّم الشعب الشرائع", "ru": "Моисей отказывается учить народ законам", "en": "Moses refuses to teach the people laws"}],1,{"he": "חשבו מה יקרה למשה אם ימשיך כך שנים.", "ar": "فكّروا بما سيحدث لموسى إن استمرّ هكذا سنين.", "ru": "Подумайте, что будет с Моисеем, если так пойдёт годами.", "en": "Think about what will happen to Moses if this goes on for years."},{"he": "בשמות י״ח יתרו אומר: ״לא טוב הדבר אשר אתה עשה, נבל תבל״. הוא מציע למנות שרי אלפים, מאות, חמישים ועשרות. רק הדבר הגדול יגיע אל משה.", "ar": "في الخروج 18 يقول يثرون إن هذا الأمر ليس جيدًا، وإن موسى سيُنهَك. ويقترح تعيين رؤساء ألوف ومئات وخماسين وعشرات. فقط الأمر الكبير يصل إلى موسى.", "ru": "В Исходе 18 Иофор говорит: нехорошо ты делаешь, ты изнуришь себя. Он советует поставить тысяченачальников, сотников, пятидесятников и десятников. Только большие дела будут доходить до Моисея.", "en": "In Exodus 18 Jethro says: what you are doing is not good, you will wear yourself out. He advises appointing chiefs of thousands, hundreds, fifties and tens. Only major matters will reach Moses."},null,[{"he": "יתרו אינו טוען שהמשפט לא הוגן. הבעיה היא העומס.", "ar": "يثرون لا يقول إن القضاء غير عادل. المشكلة هي العبء.", "ru": "Иофор не говорит, что суд несправедлив. Беда в перегрузке.", "en": "Jethro does not say the judging is unfair. The problem is the load."}, null, {"he": "זה ההפך: העם עומד סביב משה כל היום.", "ar": "هذا هو العكس: الشعب يقف حول موسى طوال اليوم.", "ru": "Всё наоборот: народ стоит вокруг Моисея весь день.", "en": "It is the opposite: the people stand around Moses all day."}, {"he": "משה מלמד את העם חוקים, ויתרו אף מעודד אותו להמשיך בכך.", "ar": "موسى يعلّم الشعب الشرائع، ويثرون يشجعه على الاستمرار.", "ru": "Моисей учит народ законам, и Иофор даже советует продолжать.", "en": "Moses does teach the laws, and Jethro even encourages him to go on."}]),
  Q("exo-2-03",{"he": "לפי שמות ל״ב, מה הניע את העם לבקש מאהרן ״אלהים״?", "ar": "بحسب الخروج 32، ما الذي دفع الشعب إلى أن يطلب من هارون إلهًا؟", "ru": "Что, согласно Исходу 32, побудило народ просить у Аарона «бога»?", "en": "According to Exodus 32, what drove the people to ask Aaron for a god?"},[{"he": "אהרן הציע להם לבנות פסל של זהב", "ar": "هارون اقترح عليهم صنع تمثال من ذهب", "ru": "Аарон сам предложил им сделать золотого идола", "en": "Aaron suggested they make a golden statue"}, {"he": "לא היו להם מים לשתות במדבר", "ar": "لم يكن لديهم ماء للشرب في البرية", "ru": "У них не было воды в пустыне", "en": "They had no water to drink in the desert"}, {"he": "משה התעכב בהר, והם לא ידעו מה קרה לו", "ar": "موسى تأخّر على الجبل، ولم يعرفوا ماذا حلّ به", "ru": "Моисей задержался на горе, и они не знали, что с ним", "en": "Moses was delayed on the mountain, and they did not know what happened to him"}, {"he": "הם רצו לחזור מיד למצרים", "ar": "أرادوا العودة فورًا إلى مصر", "ru": "Они хотели немедленно вернуться в Египет", "en": "They wanted to go back to Egypt at once"}],2,{"he": "קראו את הפסוק הראשון בפרק ל״ב.", "ar": "اقرأوا الآية الأولى من الإصحاح 32.", "ru": "Прочитайте первый стих главы 32.", "en": "Read the first verse of chapter 32."},{"he": "בשמות ל״ב העם רואה ״כי בשש משה לרדת מן ההר״. הם אומרים שאינם יודעים מה היה לו. בלי המנהיג הם מבקשים משהו שילך לפניהם.", "ar": "في الخروج 32 يرى الشعب أن موسى أبطأ في النزول من الجبل. يقولون إنهم لا يعرفون ماذا أصابه. ومن دون القائد يطلبون شيئًا يسير أمامهم.", "ru": "В Исходе 32 народ видит, что Моисей долго не сходит с горы. Они говорят, что не знают, что с ним случилось. Без вождя они просят того, кто пойдёт перед ними.", "en": "In Exodus 32 the people see that Moses is slow to come down. They say they do not know what became of him. Without their leader they ask for something to go before them."},null,[{"he": "העם פונה ראשון אל אהרן. רק אחר כך הוא אוסף את הזהב.", "ar": "الشعب يتوجّه أولًا إلى هارون. وبعدها فقط يجمع الذهب.", "ru": "Народ первым обращается к Аарону. Лишь потом он собирает золото.", "en": "The people approach Aaron first. Only then does he collect the gold."}, {"he": "המחסור במים הוא סיפור מסה ומריבה, בפרק י״ז.", "ar": "نقص الماء هو قصة مسّة ومريبة، في الإصحاح 17.", "ru": "Нехватка воды — это история Массы и Меривы, в главе 17.", "en": "The lack of water is the story of Massah and Meribah, in chapter 17."}, null, {"he": "בפסוק הפתיחה של פרק ל״ב אין בקשה לחזור למצרים.", "ar": "في آية افتتاح الإصحاح 32 لا طلب للعودة إلى مصر.", "ru": "В начальном стихе главы 32 нет просьбы вернуться в Египет.", "en": "The opening verse of chapter 32 has no request to return to Egypt."}]),
  Q("exo-2-04",{"he": "מה הייתה התוצאה של הפנייה הראשונה של משה ואהרן לפרעה?", "ar": "ما كانت نتيجة أول توجّه لموسى وهارون إلى فرعون؟", "ru": "Чем закончилось первое обращение Моисея и Аарона к фараону?", "en": "What was the result of Moses and Aaron's first appeal to Pharaoh?"},[{"he": "פרעה הפסיק לתת תבן, והעבודה הוחמרה", "ar": "فرعون أوقف إعطاء التبن، فاشتدّ العمل", "ru": "Фараон перестал давать солому, и труд стал тяжелее", "en": "Pharaoh stopped giving straw, and the work got harder"}, {"he": "פרעה הרשה לעם לצאת לשלושה ימים", "ar": "فرعون سمح للشعب بالخروج ثلاثة أيام", "ru": "Фараон отпустил народ на три дня", "en": "Pharaoh let the people go for three days"}, {"he": "פרעה השליך את משה ואת אהרן אל הכלא", "ar": "فرعون ألقى موسى وهارون في السجن", "ru": "Фараон бросил Моисея и Аарона в тюрьму", "en": "Pharaoh threw Moses and Aaron into prison"}, {"he": "מכת הדם החלה באותו יום עצמו", "ar": "ضربة الدم بدأت في اليوم نفسه", "ru": "Казнь кровью началась в тот же день", "en": "The plague of blood began that very day"}],0,{"he": "בדקו למה השוטרים כועסים על משה בסוף הפרק.", "ar": "تحقّقوا لماذا يغضب المشرفون على موسى في آخر الإصحاح.", "ru": "Посмотрите, почему надсмотрщики злятся на Моисея в конце главы.", "en": "Check why the officers are angry at Moses at the end of the chapter."},{"he": "בשמות ה׳ פרעה מסרב ומחמיר: אין תבן, ומכסת הלבנים נשארת. שוטרי בני ישראל מוכים. הם מאשימים את משה ואהרן, ומשה פונה לאלוהים בטענה.", "ar": "في الخروج 5 يرفض فرعون ويشدّد: لا تبن، وعدد اللبن يبقى كما هو. يُضرب مشرفو بني إسرائيل. فيلومون موسى وهارون، ويشكو موسى إلى الله.", "ru": "В Исходе 5 фараон отказывает и ужесточает: соломы нет, а норма кирпичей прежняя. Израильских надсмотрщиков бьют. Они винят Моисея и Аарона, и Моисей обращается к Богу с упрёком.", "en": "In Exodus 5 Pharaoh refuses and gets harsher: no straw, but the same brick quota. The Israelite officers are beaten. They blame Moses and Aaron, and Moses complains to God."},null,[null, {"he": "פרעה סירב ואמר: ״מי ה׳ אשר אשמע בקלו״.", "ar": "فرعون رفض وقال: مَن هو الرب حتى أسمع لقوله؟", "ru": "Фараон отказал и сказал: кто такой Господь, чтобы мне слушаться Его?", "en": "Pharaoh refused, saying: who is the LORD that I should obey Him?"}, {"he": "משה ואהרן אינם נכלאים. העונש נופל על העם.", "ar": "موسى وهارون لا يُسجنان. العقاب يقع على الشعب.", "ru": "Моисея и Аарона не сажают в тюрьму. Наказание падает на народ.", "en": "Moses and Aaron are not imprisoned. The punishment falls on the people."}, {"he": "מכת הדם מגיעה רק בפרק ז׳, אחרי פגישות נוספות.", "ar": "ضربة الدم تأتي في الإصحاح 7، بعد لقاءات أخرى.", "ru": "Казнь кровью приходит только в главе 7, после новых встреч.", "en": "The plague of blood comes only in chapter 7, after more meetings."}]),
  Q("exo-2-05",{"he": "לפי שמות י״ז, מדוע נקרא המקום ״מסה ומריבה״?", "ar": "بحسب الخروج 17، لماذا سُمّي المكان «مسّة ومريبة»؟", "ru": "Почему, согласно Исходу 17, место названо «Масса и Мерива»?", "en": "According to Exodus 17, why was the place called 'Massah and Meribah'?"},[{"he": "המים היו מרים, ומשה המתיק אותם", "ar": "المياه كانت مُرّة، وموسى حلّاها", "ru": "Вода была горькой, и Моисей сделал её сладкой", "en": "The water was bitter, and Moses made it sweet"}, {"he": "העם רב עם משה וניסה את ה׳", "ar": "الشعب خاصم موسى وجرّب الرب", "ru": "Народ спорил с Моисеем и искушал Господа", "en": "The people quarreled with Moses and tested the LORD"}, {"he": "שם ירד המן לראשונה מן השמים", "ar": "هناك نزل المنّ أول مرة من السماء", "ru": "Там впервые выпала манна с неба", "en": "There the manna first fell from heaven"}, {"he": "שם ניצחו בני ישראל את עמלק", "ar": "هناك انتصر بنو إسرائيل على عماليق", "ru": "Там израильтяне победили Амалика", "en": "There the Israelites defeated Amalek"}],1,{"he": "בשם יש שני חלקים, ולכל אחד פעולה של העם.", "ar": "في الاسم جزءان، ولكلٍّ منهما فعل من الشعب.", "ru": "В названии две части, и каждая — о поступке народа.", "en": "The name has two parts, each tied to something the people did."},{"he": "ברפידים אין מים, והעם רב עם משה. משה מכה בצור ויוצאים מים. הכתוב מסביר: מריבה על הריב, ומסה על ש״נסו״ את ה׳.", "ar": "في رفيديم لا ماء، فيخاصم الشعب موسى. يضرب موسى الصخرة فيخرج الماء. ويوضح النص: مريبة بسبب الخصام، ومسّة لأنهم جرّبوا الرب.", "ru": "В Рефидиме нет воды, и народ спорит с Моисеем. Моисей ударяет в скалу, и выходит вода. Текст объясняет: Мерива — от спора, Масса — от того, что искушали Господа.", "en": "At Rephidim there is no water, and the people quarrel with Moses. Moses strikes the rock and water comes out. The text explains: Meribah for the quarrel, Massah for testing the LORD."},null,[{"he": "המים המרים שהומתקו הם סיפור מרה, בפרק ט״ו.", "ar": "المياه المُرّة التي حُلّيت هي قصة مارة، في الإصحاح 15.", "ru": "Горькая вода, ставшая сладкой, — это Мерра, в главе 15.", "en": "The bitter water made sweet is the story of Marah, in chapter 15."}, null, {"he": "המן יורד בפרק ט״ז, במדבר סין, לפני רפידים.", "ar": "المنّ ينزل في الإصحاح 16، في برية سين، قبل رفيديم.", "ru": "Манна выпадает в главе 16, в пустыне Син, до Рефидима.", "en": "The manna falls in chapter 16, in the wilderness of Sin, before Rephidim."}, {"he": "הקרב עם עמלק בא אחר כך, והשם אינו מוסבר בו.", "ar": "المعركة مع عماليق تأتي بعد ذلك، والاسم لا يُفسَّر بها.", "ru": "Битва с Амаликом идёт потом, и имя не объясняется ею.", "en": "The battle with Amalek comes afterwards, and the name is not explained by it."}]),
  Q("exo-2-06",{"he": "מה חוזר שוב ושוב כשמכה מוסרת מעל מצרים?", "ar": "ما الذي يتكرّر مرة بعد مرة حين تُرفع ضربة عن مصر؟", "ru": "Что повторяется снова и снова, когда казнь снимают с Египта?", "en": "What happens again and again when a plague is lifted from Egypt?"},[{"he": "פרעה משחרר חלק מן העם בכל פעם", "ar": "فرعون يطلق جزءًا من الشعب كل مرة", "ru": "Фараон каждый раз отпускает часть народа", "en": "Pharaoh releases part of the people each time"}, {"he": "המצרים מורדים בפרעה ומדיחים אותו", "ar": "المصريون يتمرّدون على فرعون ويخلعونه", "ru": "Египтяне восстают и свергают фараона", "en": "The Egyptians revolt and depose Pharaoh"}, {"he": "משה מוותר ומפסיק לבוא אל פרעה", "ar": "موسى يستسلم ويتوقف عن المجيء إلى فرعون", "ru": "Моисей сдаётся и перестаёт приходить к фараону", "en": "Moses gives up and stops coming to Pharaoh"}, {"he": "פרעה מכביד את לבו ואינו משלח את העם", "ar": "فرعون يقسّي قلبه ولا يطلق الشعب", "ru": "Фараон ожесточает сердце и не отпускает народ", "en": "Pharaoh hardens his heart and does not let the people go"}],3,{"he": "השוו את דברי פרעה בזמן המכה ואחריה.", "ar": "قارنوا كلام فرعون أثناء الضربة وبعدها.", "ru": "Сравните слова фараона во время казни и после неё.", "en": "Compare Pharaoh's words during a plague and after it."},{"he": "בזמן המכה פרעה מבקש עזרה ולפעמים מבטיח לשלח. אחרי הצפרדעים הכתוב אומר: ״וירא פרעה כי היתה הרוחה והכבד את לבו״. הדפוס הזה חוזר עד מכת בכורות.", "ar": "أثناء الضربة يطلب فرعون العون وأحيانًا يعد بالإطلاق. بعد الضفادع يقول النص إن فرعون رأى الفرج فقسّى قلبه. ويتكرّر هذا النمط حتى ضربة الأبكار.", "ru": "Во время казни фараон просит помощи и иногда обещает отпустить. После жаб текст говорит: фараон увидел облегчение и ожесточил сердце. Так повторяется до казни первенцев.", "en": "During a plague Pharaoh asks for help and sometimes promises to let them go. After the frogs the text says Pharaoh saw relief and hardened his heart. The pattern repeats until the death of the firstborn."},null,[{"he": "איש אינו יוצא לפני מכת בכורות. ההבטחות לא מתקיימות.", "ar": "لا يخرج أحد قبل ضربة الأبكار. الوعود لا تتحقق.", "ru": "Никто не уходит до казни первенцев. Обещания не исполняются.", "en": "No one leaves before the death of the firstborn. The promises are not kept."}, {"he": "עבדי פרעה מפצירים בו, אבל אין מרד ואין הדחה.", "ar": "عبيد فرعون يلحّون عليه، لكن لا تمرّد ولا خلع.", "ru": "Слуги фараона уговаривают его, но нет ни мятежа, ни свержения.", "en": "Pharaoh's servants urge him, but there is no revolt or overthrow."}, {"he": "משה חוזר אל פרעה שוב ושוב, עד המכה האחרונה.", "ar": "موسى يعود إلى فرعون مرة بعد مرة، حتى الضربة الأخيرة.", "ru": "Моисей приходит к фараону снова и снова, до последней казни.", "en": "Moses returns to Pharaoh again and again, until the last plague."}, null])],
 [
  Q("bib-exodus-1261-4",{"he": "איזה תיאור מתאים לחציית ים סוף?", "ar": "أي وصف يناسب عبور بحر سوف؟", "ru": "Какое описание подходит к «Переход через море Суф»?", "en": "Which description fits crossing the Sea of Reeds?"},[{"he": "בשמות ב׳ התינוק מוסתר, מונח בתיבה על היאור ונמצא בידי בת פרעה.", "ar": "في الخروج 2 يُخفى الرضيع ويوضع في سلة على النهر وتعثر عليه ابنة فرعون.", "ru": "В Исходе 2 младенца прячут, кладут в корзину у Нила, и его находит дочь фараона.", "en": "In Exodus 2 the infant is hidden, placed in a basket by the Nile and found by Pharaoh’s daughter."},{"he": "בשמות ג׳ משה נתקל בסנה בוער שאינו נשרף, ונקרא לשליחות.", "ar": "في الخروج 3 يرى موسى عليقة تشتعل ولا تحترق ويُدعى إلى مهمة.", "ru": "В Исходе 3 Моисей видит куст, который горит и не сгорает, и получает поручение.", "en": "In Exodus 3 Moses encounters a bush that burns without being consumed and receives a mission."},{"he": "בשמות י״ב מתוארת המכה האחרונה במצרים, ואחריה פרעה קורא לישראל לצאת.", "ar": "في الخروج 12 ترد الضربة الأخيرة في مصر، وبعدها يأمر فرعون بني إسرائيل بالخروج.", "ru": "В Исходе 12 описана последняя казнь в Египте, после которой фараон велит израильтянам уйти.", "en": "Exodus 12 describes the final plague in Egypt, after which Pharaoh tells the Israelites to leave."},{"he": "בשמות י״ד העם עובר בים לאחר מרדף המצרים; המים שבים עם סיום המעבר.", "ar": "في الخروج 14 يعبر الشعب البحر بعد ملاحقة المصريين، ثم تعود المياه.", "ru": "В Исходе 14 народ переходит море при преследовании египтян; затем воды возвращаются.", "en": "In Exodus 14 the people cross the sea under Egyptian pursuit; the waters then return."}],3,{"he": "חפשו את הפרט שמבדיל אותו מן האחרים.", "ar": "ابحثوا عن التفصيل الذي يميزه عن غيره.", "ru": "Ищите отличие от остальных вариантов.", "en": "Look for the detail that separates it from the others."},{"he": "המרדף והמעבר בים מתוארים כחלק מאותו רצף.", "ar": "المطاردة وعبور البحر جزء من تسلسل واحد.", "ru": "Погоня и переход через море составляют одну последовательность.", "en": "Pursuit and crossing belong to the same narrative sequence."},null,[{"he": "זה מתאר את לידת משה, לא את חציית ים סוף.", "ar": "هذا يصف ولادة موسى، لا عبور بحر سوف.", "ru": "Это описание «Рождение Моисея», а не «Переход через море Суф».", "en": "That describes birth of Moses, not crossing the Sea of Reeds."},{"he": "זה מתאר את הסנה הבוער, לא את חציית ים סוף.", "ar": "هذا يصف العليقة المشتعلة، لا عبور بحر سوف.", "ru": "Это описание «Горящий куст», а не «Переход через море Суф».", "en": "That describes burning bush, not crossing the Sea of Reeds."},{"he": "זה מתאר את מכת בכורות, לא את חציית ים סוף.", "ar": "هذا يصف ضربة الأبكار، لا عبور بحر سوف.", "ru": "Это описание «Поражение первенцев», а не «Переход через море Суф».", "en": "That describes plague of the firstborn, not crossing the Sea of Reeds."},null])
 ,Q("bib-exo-argue",{"he": "מה מלמד הדיאלוג בסנה על דמותו של משה כמנהיג?", "ar": "ماذا يعلّمنا حوار العليقة عن شخصية موسى كقائد؟", "ru": "Чему учит диалог у куста о Моисее как лидере?", "en": "What does the bush dialogue teach about Moses as a leader?"},[{"he": "שמנהיג רשאי לשאול ולהתלבט, ועדיין לצאת לשליחות", "ar": "أن القائد يحق له أن يسأل ويتردد، ومع ذلك ينطلق في رسالته", "ru": "Что лидер вправе спрашивать и колебаться, и всё же отправиться выполнять поручение", "en": "That a leader may ask and hesitate, and still go on the mission"},{"he": "שמי שמתלבט אינו ראוי להיות מנהיג", "ar": "أن مَن يتردد لا يصلح قائدًا", "ru": "Что колеблющийся не годится в лидеры", "en": "That one who hesitates is unfit to lead"},{"he": "שהוויכוח מבטל את השליחות", "ar": "أن الجدال يلغي الرسالة", "ru": "Что спор отменяет поручение", "en": "That the argument cancels the mission"},{"he": "שרק ציות מלא בלי שאלות מקובל", "ar": "أن الطاعة الكاملة دون أسئلة وحدها المقبولة", "ru": "Что принято только полное послушание без вопросов", "en": "That only full obedience without questions is accepted"}],0,{"he": "שימו לב איך הדיאלוג מסתיים בפועל.", "ar": "انتبهوا كيف ينتهي الحوار فعليًا.", "ru": "Обратите внимание, чем диалог заканчивается на деле.", "en": "Notice how the dialogue actually ends."},{"he": "משה שואל, מתלבט ומבקש - ובסוף יוצא למצרים. דוגמה: אחרי כל השאלות הוא לוקח את מטהו ואת משפחתו. המסקנה של הסיפור היא שהתלבטות אינה סותרת מנהיגות.", "ar": "يسأل موسى ويتردد ويطلب - وفي النهاية ينطلق إلى مصر. مثال: بعد كل الأسئلة يأخذ عصاه وعائلته. خلاصة القصة أن التردد لا يناقض القيادة.", "ru": "Моисей спрашивает, колеблется и просит - и в конце отправляется в Египет. Пример: после всех вопросов он берёт свой посох и семью. Вывод рассказа: колебание не противоречит лидерству.", "en": "Moses asks, hesitates and pleads - and in the end sets out for Egypt. Example: after all the questions he takes his staff and his family. The story's conclusion is that hesitation does not contradict leadership."},null,[null,{"he": "הסיפור ממשיך ומשלח אותו למרות ההתלבטות.", "ar": "القصة تتابع وترسله رغم التردد.", "ru": "Рассказ продолжается и посылает его несмотря на колебание.", "en": "The story goes on and sends him despite the hesitation."},{"he": "השליחות מתקיימת; הדיאלוג אינו מבטל אותה.", "ar": "الرسالة تتحقق؛ الحوار لا يلغيها.", "ru": "Поручение исполняется; диалог его не отменяет.", "en": "The mission is carried out; the dialogue does not cancel it."},{"he": "השאלות מופיעות בטקסט עצמו; הן חלק מהדרך.", "ar": "الأسئلة واردة في النص نفسه؛ هي جزء من الطريق.", "ru": "Вопросы присутствуют в самом тексте; они часть пути.", "en": "The questions appear in the text itself; they are part of the way."}]),Q("bib-exo-sea-faith",{"he": "תלמידה טוענת שקריעת ים סוף באה רק כדי להציל את ישראל. מה עוד רואה הטקסט?", "ar": "تقول طالبة إن شق بحر القصب جاء فقط لإنقاذ إسرائيل. ماذا يرى النص أيضًا؟", "ru": "Ученица утверждает, что переход через море был только ради спасения Израиля. Что ещё видит текст?", "en": "A student claims the sea crossing came only to rescue Israel. What else does the text see?"},[{"he": "שהאירוע מביא את העם לשירה ולאמונה: 'ויאמינו בה' ובמשה עבדו'", "ar": "أن الحدث يقود الشعب إلى النشيد والإيمان: «فآمنوا بالرب وبموسى عبده»", "ru": "Что событие приводит народ к песне и вере: «и поверили в Господа и в Моисея, раба Его»", "en": "That the event leads the people to song and faith: \"they believed in the Lord and in Moses His servant\""},{"he": "שהים נשאר פתוח לנצח", "ar": "أن البحر بقي مفتوحًا إلى الأبد", "ru": "Что море осталось разверстым навсегда", "en": "That the sea stayed open forever"},{"he": "שהמטרה הייתה מלחמה נוספת", "ar": "أن الهدف كان حربًا إضافية", "ru": "Что целью была ещё одна война", "en": "That the goal was another war"},{"he": "שהטקסט אומר שזה סוף הסיפור כולו", "ar": "أن النص يقول إن هذه نهاية القصة كلها", "ru": "Что текст говорит, будто это конец всей истории", "en": "That the text says this is the end of the whole story"}],0,{"he": "חפשו מה קורה מיד אחרי החצייה.", "ar": "ابحثوا عمّا يحدث مباشرة بعد العبور.", "ru": "Найдите, что происходит сразу после перехода.", "en": "Look at what happens right after the crossing."},{"he": "אחרי הים בא שירת הים, ובסופה: 'ויאמינו בה' ובמשה עבדו' (שמות י\"ד). דוגמה: ההצלה הופכת גם לרגע של אמונה משותפת, לא רק לבריחה. לכן 'רק כדי להציל' מחמיצה חלק מהמשמעות.", "ar": "بعد البحر يأتي نشيد البحر، وفي خاتمته: «فآمنوا بالرب وبموسى عبده» (الخروج 14). مثال: الإنقاذ يصبح أيضًا لحظة إيمان مشترك لا مجرد هروب. لذلك «فقط للإنقاذ» يفوّت جزءًا من المعنى.", "ru": "После моря следует Песнь моря, завершающаяся словами: «и поверили в Господа и в Моисея, раба Его» (Исход 14). Пример: спасение становится также моментом общей веры, а не только бегством. Поэтому «только ради спасения» упускает часть смысла.", "en": "After the sea comes the Song of the Sea, ending: \"they believed in the Lord and in Moses His servant\" (Exodus 14). Example: the rescue also becomes a moment of shared faith, not only an escape. So \"only to rescue\" misses part of the meaning."},null,[null,{"he": "המים חוזרים למצואנם בסוף הפרק.", "ar": "تعود المياه إلى مجراها في نهاية الفصل.", "ru": "Воды возвращаются в конце главы.", "en": "The waters return at the end of the chapter."},{"he": "אין מלחמה נוספת בפרק; התוצאה היא שירה ואמונה.", "ar": "لا حرب إضافية في الفصل؛ النتيجة نشيد وإيمان.", "ru": "В главе нет ещё одной войны; результат - песнь и вера.", "en": "There is no further war in the chapter; the outcome is song and faith."},{"he": "הסיפור ממשיך למדבר ולסיני; זו אינה הסוף.", "ar": "القصة تتابع إلى البرية وسيناء؛ هذه ليست النهاية.", "ru": "История продолжается в пустыне и у Синая; это не конец.", "en": "The story continues to the wilderness and Sinai; this is not the end."}]),
  Q("exo-3-01",{"he": "הפועל ״וירא״ מופיע בשמות ב׳ גם אצל משה וגם אצל אלוהים. מה מלמד החיבור?", "ar": "الفعل «رأى» يرد في الخروج 2 عن موسى وعن الله. ماذا يعلّم هذا الربط؟", "ru": "Глагол «увидел» в Исходе 2 сказан и о Моисее, и о Боге. Чему учит эта связь?", "en": "The verb 'saw' appears in Exodus 2 for both Moses and God. What does the link teach?"},[{"he": "משה פוחד שיראו אותו, ולכן אינו מתערב כלל", "ar": "موسى يخاف أن يراه أحد، لذلك لا يتدخل أبدًا", "ru": "Моисей боится, что его увидят, и поэтому вовсе не вмешивается", "en": "Moses fears being seen, so he does not intervene at all"}, {"he": "משה רואה את הסבל, אבל אינו מבין אותו", "ar": "موسى يرى المعاناة، لكنه لا يفهمها", "ru": "Моисей видит страдания, но не понимает их", "en": "Moses sees the suffering but does not understand it"}, {"he": "ראיית משה מקבילה לראיית האל ומכינה לשליחות", "ar": "رؤية موسى توازي رؤية الله وتمهّد لرسالته", "ru": "Взгляд Моисея подобен взгляду Бога и готовит его к миссии", "en": "Moses' seeing parallels God's seeing and prepares his mission"}, {"he": "המילה מופיעה רק בתיאור הסנה הבוער", "ar": "الكلمة ترد فقط في وصف العليقة المشتعلة", "ru": "Слово встречается только в рассказе о горящем кусте", "en": "The word appears only in the burning bush scene"}],2,{"he": "השוו את תחילת פרק ב׳ לסופו.", "ar": "قارنوا بداية الإصحاح 2 بنهايته.", "ru": "Сравните начало главы 2 с её концом.", "en": "Compare the start of chapter 2 with its end."},{"he": "משה יוצא אל אחיו ״וירא בסבלתם״. בסוף הפרק נאמר: ״וירא אלהים את בני ישראל״. המילה המנחה מקשרת בין המנהיג לבין האל, ומכינה את הקריאה בסנה.", "ar": "يخرج موسى إلى إخوته ويرى أثقالهم. وفي آخر الإصحاح يُقال إن الله نظر إلى بني إسرائيل. الكلمة المفتاحية تربط القائد بالله، وتمهّد للدعوة عند العليقة.", "ru": "Моисей выходит к братьям и видит их тяжкие работы. В конце главы сказано: и увидел Бог сынов Израилевых. Ключевое слово связывает вождя с Богом и готовит призыв у куста.", "en": "Moses goes out to his brothers and sees their burdens. At the chapter's end: God saw the Israelites. The leitwort links the leader with God and prepares the call at the bush."},null,[{"he": "משה כן מתערב, שלוש פעמים בפרק אחד.", "ar": "موسى يتدخل فعلًا، ثلاث مرات في إصحاح واحد.", "ru": "Моисей вмешивается, и трижды за одну главу.", "en": "Moses does intervene, three times in one chapter."}, {"he": "משה מגיב מיד למה שראה, ולכן הבין אותו.", "ar": "موسى يتصرف فورًا بحسب ما رأى، فقد فهمه إذن.", "ru": "Моисей сразу действует, значит, он понял увиденное.", "en": "Moses acts at once on what he saw, so he understood it."}, null, {"he": "״וירא״ מופיע כבר בפרק ב׳, לפני הסנה.", "ar": "الفعل «رأى» يرد في الإصحاح 2، قبل العليقة.", "ru": "«Увидел» звучит уже в главе 2, до куста.", "en": "'Saw' already appears in chapter 2, before the bush."}]),
  Q("exo-3-02",{"he": "פרעה ציווה להשליך כל בן ליאור. מה האירוניה בהצלת משה?", "ar": "أمر فرعون بإلقاء كل ابن في النيل. ما المفارقة في نجاة موسى؟", "ru": "Фараон велел бросать всех мальчиков в Нил. В чём ирония спасения Моисея?", "en": "Pharaoh ordered every son thrown into the Nile. What is the irony in Moses' rescue?"},[{"he": "בת פרעה מצילה מן היאור את מי שיוציא את העם", "ar": "ابنة فرعون تنقذ من النيل مَن سيُخرج الشعب", "ru": "Дочь фараона спасает из Нила того, кто выведет народ", "en": "Pharaoh's daughter saves from the Nile the one who will lead the people out"}, {"he": "פרעה עצמו מוצא את התינוק ביאור ומאמץ אותו", "ar": "فرعون نفسه يجد الطفل في النيل ويتبنّاه", "ru": "Фараон сам находит младенца в Ниле и усыновляет его", "en": "Pharaoh himself finds the baby in the Nile and adopts him"}, {"he": "משה ניצל כי אמו צייתה לגזירה", "ar": "موسى نجا لأن أمه أطاعت الأمر", "ru": "Моисей спасся, потому что мать подчинилась указу", "en": "Moses was saved because his mother obeyed the decree"}, {"he": "היאור מתייבש, ולכן התינוק אינו טובע", "ar": "النيل يجفّ، ولذلك لا يغرق الطفل", "ru": "Нил пересыхает, поэтому младенец не тонет", "en": "The Nile dries up, so the baby does not drown"}],0,{"he": "חשבו איפה גדל משה ובבית של מי.", "ar": "فكّروا أين نشأ موسى وفي بيت مَن.", "ru": "Подумайте, где и в чьём доме вырос Моисей.", "en": "Think about where Moses grew up, and in whose house."},{"he": "הגזירה של פרעה הופכת את היאור למקום של מוות. דווקא שם בתו מצילה את משה, ומגדלת אותו בבית פרעה. הגואל של העם גדל בבית מי שמשעבד אותו.", "ar": "أمر فرعون يجعل النيل مكانًا للموت. وهناك بالذات تنقذ ابنته موسى، وتربّيه في بيت فرعون. مخلّص الشعب ينشأ في بيت مستعبِده.", "ru": "Указ фараона делает Нил местом смерти. Именно там его дочь спасает Моисея и растит его во дворце. Избавитель народа растёт в доме поработителя.", "en": "Pharaoh's decree makes the Nile a place of death. Right there his daughter saves Moses and raises him in Pharaoh's house. The people's redeemer grows up in the oppressor's home."},null,[null, {"he": "את התינוק מוצאת בת פרעה, ולא פרעה.", "ar": "ابنة فرعون هي التي تجد الطفل، لا فرعون.", "ru": "Младенца находит дочь фараона, а не фараон.", "en": "Pharaoh's daughter finds the baby, not Pharaoh."}, {"he": "אמו הסתירה אותו שלושה חודשים, כלומר לא צייתה.", "ar": "أمه خبّأته ثلاثة أشهر، أي لم تطع.", "ru": "Мать прятала его три месяца, то есть не подчинилась.", "en": "His mother hid him for three months, so she did not obey."}, {"he": "היאור אינו מתייבש. התיבה צפה בין הסוף.", "ar": "النيل لا يجفّ. السفط يطفو بين الحلفاء.", "ru": "Нил не пересыхает. Корзинка плывёт в тростнике.", "en": "The Nile does not dry up. The basket floats among the reeds."}]),
  Q("exo-3-03",{"he": "משה מתערב שלוש פעמים בשמות ב׳. מה משותף לשלושת המקרים?", "ar": "يتدخّل موسى ثلاث مرات في الخروج 2. ما المشترك بين الحالات الثلاث؟", "ru": "Моисей вмешивается трижды в Исходе 2. Что общего у трёх случаев?", "en": "Moses intervenes three times in Exodus 2. What do the three cases share?"},[{"he": "הוא מתערב רק כשעברי נפגע", "ar": "يتدخل فقط حين يتأذّى عبراني", "ru": "Он вмешивается, только когда страдает еврей", "en": "He intervenes only when a Hebrew is hurt"}, {"he": "בכל פעם הוא מכה את מי שפוגע", "ar": "في كل مرة يضرب المعتدي", "ru": "Каждый раз он бьёт обидчика", "en": "Each time he strikes the attacker"}, {"he": "בכל פעם מודים לו על העזרה", "ar": "في كل مرة يشكرونه على المساعدة", "ru": "Каждый раз его благодарят за помощь", "en": "Each time he is thanked for his help"}, {"he": "בכל פעם הוא מגן על החלש", "ar": "في كل مرة يحمي الضعيف", "ru": "Каждый раз он защищает слабого", "en": "Each time he protects the weaker side"}],3,{"he": "בדקו מי פוגע במי בכל אחד מן המקרים.", "ar": "تحقّقوا مَن يعتدي على مَن في كل حالة.", "ru": "Посмотрите, кто кого обижает в каждом случае.", "en": "Check who is harming whom in each case."},{"he": "פעם מצרי מכה עברי, פעם עברי מכה עברי, ופעם רועים מגרשים נשים מדיניות. בכל המקרים משה מגן על הנפגע. פרשנים רואים בזה את חוש הצדק שמכשיר אותו להנהגה.", "ar": "مرة يضرب مصري عبرانيًا، ومرة عبراني عبرانيًا، ومرة يطرد رعاةٌ نساءً مديانيات. في كل الحالات يدافع موسى عن المظلوم. ويرى المفسرون في ذلك حسّ العدل الذي يؤهّله للقيادة.", "ru": "Раз египтянин бьёт еврея, раз еврей еврея, раз пастухи прогоняют мадиамских девушек. Во всех случаях Моисей защищает обиженного. Комментаторы видят в этом чувство справедливости, готовящее его к лидерству.", "en": "Once an Egyptian beats a Hebrew, once a Hebrew beats a Hebrew, once shepherds drive off Midianite women. In every case Moses defends the victim. Commentators see here the sense of justice that fits him to lead."},null,[{"he": "במדין הוא מושיע בנות כהן מדין, שאינן עבריות.", "ar": "في مديان ينقذ بنات كاهن مديان، وهنّ لسن عبرانيات.", "ru": "В Мадиаме он защищает дочерей мадиамского священника, а не евреек.", "en": "In Midian he saves the Midianite priest's daughters, who are not Hebrews."}, {"he": "רק את המצרי הוא מכה. לעברי הנִצי הוא רק אומר מילים.", "ar": "يضرب المصري فقط. أما العبراني المتشاجر فيكلّمه فقط.", "ru": "Бьёт он только египтянина. Дерущемуся еврею он лишь говорит.", "en": "He strikes only the Egyptian. To the quarreling Hebrew he only speaks."}, {"he": "העברי השני דוחה אותו: ״מי שמך לאיש שר ושפט עלינו?״.", "ar": "العبراني الثاني يرفضه ويسأله: مَن جعلك رئيسًا وقاضيًا علينا؟", "ru": "Второй еврей отталкивает его: кто поставил тебя начальником и судьёй?", "en": "The second Hebrew rejects him: who made you a ruler and judge over us?"}, null]),
  Q("exo-3-04",{"he": "העם אומר במדבר: ״בשבתנו על סיר הבשר״. מה מלמדים הדברים?", "ar": "يقول الشعب في البرية إنهم كانوا جالسين عند قدور اللحم. ماذا يعلّم هذا الكلام؟", "ru": "В пустыне народ говорит: «когда мы сидели у котлов с мясом». Чему учат эти слова?", "en": "In the desert the people say, 'when we sat by the pots of meat'. What do these words teach?"},[{"he": "בני ישראל באמת חיו בשפע במצרים", "ar": "بنو إسرائيل عاشوا فعلًا في رخاء في مصر", "ru": "Израильтяне действительно жили в Египте в изобилии", "en": "The Israelites really lived in plenty in Egypt"}, {"he": "הקושי במדבר מייפה את זיכרון העבדות", "ar": "مشقّة البرية تجمّل ذكرى العبودية", "ru": "Трудности пустыни приукрашивают память о рабстве", "en": "Hardship in the desert beautifies the memory of slavery"}, {"he": "משה הבטיח להם בשר, ולא קיים", "ar": "موسى وعدهم باللحم ولم يفِ", "ru": "Моисей обещал им мясо и не сдержал слова", "en": "Moses promised them meat and did not deliver"}, {"he": "העם מבקש לחזור למצרים מיד, באותו יום", "ar": "الشعب يطلب العودة إلى مصر فورًا، في اليوم نفسه", "ru": "Народ требует вернуться в Египет немедленно, в тот же день", "en": "The people demand to go back to Egypt that very day"}],1,{"he": "השוו את מה שהם זוכרים למה שמתואר בשמות א׳.", "ar": "قارنوا ما يتذكرونه بما يصفه الخروج 1.", "ru": "Сравните то, что они вспоминают, с описанием в Исходе 1.", "en": "Compare what they remember with what Exodus 1 describes."},{"he": "בשמות ט״ז העם רעב ונזכר בבשר ובלחם של מצרים. אבל בשמות א׳ החיים שם הם עבודה קשה ומרה. הזיכרון היפה מראה כמה קשה המעבר לחירות.", "ar": "في الخروج 16 يجوع الشعب ويتذكّر لحم مصر وخبزها. لكن في الخروج 1 الحياة هناك عمل شاق ومرّ. الذكرى الجميلة تُظهر صعوبة الانتقال إلى الحرية.", "ru": "В Исходе 16 народ голоден и вспоминает мясо и хлеб Египта. Но в Исходе 1 жизнь там — тяжкий горький труд. Красивое воспоминание показывает, как труден путь к свободе.", "en": "In Exodus 16 the people are hungry and recall Egypt's meat and bread. But in Exodus 1 life there is hard, bitter labor. The rosy memory shows how hard the move to freedom is."},null,[{"he": "שמות א׳ מתאר עבודת פרך ומרירות, לא שפע.", "ar": "الخروج 1 يصف عملًا قاسيًا ومرارة، لا رخاء.", "ru": "Исход 1 описывает тяжкий труд и горечь, а не изобилие.", "en": "Exodus 1 describes harsh labor and bitterness, not plenty."}, null, {"he": "משה לא הבטיח בשר לפני התלונה. השליו בא אחריה.", "ar": "موسى لم يعد باللحم قبل التذمّر. السلوى جاءت بعده.", "ru": "Моисей не обещал мяса до ропота. Перепела пришли после него.", "en": "Moses promised no meat before the complaint. The quail came after it."}, {"he": "העם מתלונן ומתגעגע, אבל אינו יוצא חזרה למצרים.", "ar": "الشعب يتذمّر ويحنّ، لكنه لا يعود إلى مصر.", "ru": "Народ ропщет и тоскует, но не уходит обратно в Египет.", "en": "The people complain and long for Egypt, but do not go back."}]),
  Q("exo-3-05",{"he": "בשמות כ״ד העם אומר ״נעשה ונשמע״. מה מבליט סיפור העגל בהשוואה לכך?", "ar": "في الخروج 24 يقول الشعب إنهم سيعملون ويسمعون. ماذا تُبرز قصة العجل مقارنةً بذلك؟", "ru": "В Исходе 24 народ говорит «сделаем и услышим». Что подчёркивает история тельца по сравнению с этим?", "en": "In Exodus 24 the people say 'we will do and we will hear'. What does the calf story highlight by comparison?"},[{"he": "העגל נעשה לפני מעמד הר סיני", "ar": "العجل صُنع قبل الوقوف عند جبل سيناء", "ru": "Телец был сделан до события у горы Синай", "en": "The calf was made before the event at Mount Sinai"}, {"he": "רק משה הבטיח, ולא העם", "ar": "موسى وحده وعد، لا الشعب", "ru": "Обещал только Моисей, а не народ", "en": "Only Moses made the promise, not the people"}, {"he": "זמן קצר אחרי ההבטחה העם עושה עגל", "ar": "بعد الوعد بقليل يصنع الشعب عجلًا", "ru": "Вскоре после обещания народ делает тельца", "en": "Soon after the promise, the people make a calf"}, {"he": "העגל הוא קיום מדויק של ההבטחה", "ar": "العجل تحقيق دقيق للوعد", "ru": "Телец — точное исполнение обещания", "en": "The calf is an exact fulfillment of the promise"}],2,{"he": "חשבו כמה זמן עבר בין שני האירועים.", "ar": "فكّروا كم من الوقت مرّ بين الحدثين.", "ru": "Подумайте, сколько времени прошло между событиями.", "en": "Think about how much time passed between the two events."},{"he": "בשמות כ״ד העם מתחייב: ״כל אשר דבר ה׳ נעשה ונשמע״. בזמן שמשה בהר, בשמות ל״ב, העם עושה עגל. הניגוד מראה כמה שברירית ההתחייבות בלי המנהיג.", "ar": "في الخروج 24 يتعهّد الشعب بأن يعمل ويسمع كل ما قاله الرب. وحين يكون موسى على الجبل، في الخروج 32، يصنع الشعب عجلًا. التناقض يُظهر هشاشة التعهّد بلا القائد.", "ru": "В Исходе 24 народ обязуется: всё, что сказал Господь, сделаем и услышим. Пока Моисей на горе, в Исходе 32, народ делает тельца. Контраст показывает, как хрупко обязательство без вождя.", "en": "In Exodus 24 the people pledge: all the LORD has spoken we will do and hear. While Moses is on the mountain, in Exodus 32, they make a calf. The contrast shows how fragile the pledge is without the leader."},null,[{"he": "העגל נעשה בזמן שמשה בהר, אחרי ההבטחה.", "ar": "العجل صُنع حين كان موسى على الجبل، بعد الوعد.", "ru": "Тельца сделали, когда Моисей был на горе, после обещания.", "en": "The calf was made while Moses was on the mountain, after the promise."}, {"he": "הכתוב אומר שהעם הוא שאמר את הדברים.", "ar": "النص يقول إن الشعب هو الذي قال الكلام.", "ru": "Текст говорит, что эти слова сказал народ.", "en": "The text says the people themselves said these words."}, null, {"he": "לפי הסיפור העגל הוא הפרה של הברית, ולכן משה שובר את הלוחות.", "ar": "بحسب القصة العجل نقضٌ للعهد، لذلك يكسر موسى اللوحين.", "ru": "По рассказу телец нарушает завет, поэтому Моисей разбивает скрижали.", "en": "In the story the calf breaks the covenant, so Moses smashes the tablets."}]),
  Q("exo-3-06",{"he": "מה מלמדת תגובת משה בשמות ל״ב, כשאלוהים מציע לעשות אותו לגוי גדול?", "ar": "ماذا يعلّم ردّ موسى في الخروج 32، حين يعرض الله أن يجعله أمة عظيمة؟", "ru": "Чему учит ответ Моисея в Исходе 32, когда Бог предлагает сделать его великим народом?", "en": "What does Moses' response in Exodus 32 teach, when God offers to make him a great nation?"},[{"he": "הוא מוותר על כבוד אישי ומגן על העם", "ar": "يتنازل عن المجد الشخصي ويدافع عن الشعب", "ru": "Он отказывается от личной славы и защищает народ", "en": "He gives up personal glory and defends the people"}, {"he": "הוא מקבל את ההצעה ומתחיל עם חדש ממשפחתו", "ar": "يقبل العرض ويبدأ شعبًا جديدًا من عائلته", "ru": "Он принимает предложение и начинает новый народ из своей семьи", "en": "He accepts the offer and starts a new people from his own family"}, {"he": "הוא מבקש להעניש רק את אהרן", "ar": "يطلب معاقبة هارون وحده", "ru": "Он просит наказать только Аарона", "en": "He asks that only Aaron be punished"}, {"he": "הוא עוזב את העם וחוזר למדין", "ar": "يترك الشعب ويعود إلى مديان", "ru": "Он оставляет народ и возвращается в Мадиам", "en": "He leaves the people and returns to Midian"}],0,{"he": "קראו מה משה אומר על ״ספרך אשר כתבת״.", "ar": "اقرأوا ما يقوله موسى عن «كتابك الذي كتبت».", "ru": "Прочитайте, что Моисей говорит о «книге Твоей, которую Ты написал».", "en": "Read what Moses says about 'Your book that You have written'."},{"he": "אלוהים מציע לכלות את העם ולעשות ממשה גוי גדול. משה מסרב ומתחנן על העם. הוא אומר: ״ואם אין מחני נא מספרך אשר כתבת״.", "ar": "يعرض الله أن يُفني الشعب ويجعل من موسى أمة عظيمة. يرفض موسى ويتوسّل من أجل الشعب. ويقول: وإلّا فامحني من كتابك الذي كتبت.", "ru": "Бог предлагает истребить народ и произвести от Моисея великий народ. Моисей отказывается и молится за народ. Он говорит: если нет, изгладь меня из книги Твоей, которую Ты написал.", "en": "God offers to destroy the people and make a great nation of Moses. Moses refuses and pleads for the people. He says: if not, blot me out of Your book that You have written."},null,[null, {"he": "משה אינו מקבל. הוא מתחנן על העם הקיים.", "ar": "موسى لا يقبل. بل يتوسّل من أجل الشعب الموجود.", "ru": "Моисей не соглашается. Он молится за нынешний народ.", "en": "Moses does not accept. He pleads for the existing people."}, {"he": "משה אינו מבקש עונש לאהרן. הוא מבקש סליחה לעם.", "ar": "موسى لا يطلب عقاب هارون. بل يطلب الصفح للشعب.", "ru": "Моисей не просит наказать Аарона. Он просит прощения для народа.", "en": "Moses does not ask to punish Aaron. He asks forgiveness for the people."}, {"he": "משה נשאר עם העם וממשיך להנהיג אותו.", "ar": "موسى يبقى مع الشعب ويستمر في قيادته.", "ru": "Моисей остаётся с народом и продолжает его вести.", "en": "Moses stays with the people and goes on leading them."}])]]);

  Q("bib-choice-1261-1",{"he": "איזה תיאור מתאים לחזון העצמות היבשות?", "ar": "أي وصف يناسب رؤيا العظام اليابسة؟", "ru": "Какое описание подходит к «Видение сухих костей»?", "en": "Which description fits vision of dry bones?"},[{"he": "ביחזקאל ל״ז חזון העצמות מציג תחייה כדימוי לתקווה לעם מיואש.", "ar": "في حزقيال 37 تعرض رؤيا العظام حياة جديدة صورةً لأمل شعب يائس.", "ru": "В Иезекииле 37 оживление костей служит образом надежды для отчаявшегося народа.", "en": "In Ezekiel 37 the bones’ revival pictures hope for a despairing people."},{"he": "בירמיהו א׳ הנביא חושש שאינו יודע לדבר מפני שהוא צעיר, ונענה שלא יישאר לבדו.", "ar": "في إرميا 1 يخاف النبي لأنه فتى لا يحسن الكلام، فيُطمأن بأنه ليس وحده.", "ru": "В Иеремии 1 пророк опасается, что молод и не умеет говорить, и получает заверение в поддержке.", "en": "In Jeremiah 1 the prophet worries that he is young and cannot speak; he is reassured of support."},{"he": "בחוקי התורה חוזרת הדרישה להגן על גר, יתום ואלמנה.", "ar": "تتكرر في قوانين التوراة مطالب حماية الغريب واليتيم والأرملة.", "ru": "В законах Торы повторяется требование защищать пришельца, сироту и вдову.", "en": "Torah laws repeatedly call for protecting the stranger, orphan and widow."},{"he": "בקהלת א׳ תנועות חוזרות בטבע משמשות רקע לשאלת התועלת בעמל האדם.", "ar": "في الجامعة 1 تشكل حركات الطبيعة المتكررة خلفية للسؤال عن جدوى تعب الإنسان.", "ru": "В Екклесиасте 1 повторяющиеся движения природы служат фоном вопроса о пользе человеческого труда.", "en": "In Ecclesiastes 1 recurring motions of nature frame a question about the gain from human toil."}],0,{"he": "חפשו את הפרט שמבדיל אותו מן האחרים.", "ar": "ابحثوا عن التفصيل الذي يميزه عن غيره.", "ru": "Ищите отличие от остальных вариантов.", "en": "Look for the detail that separates it from the others."},{"he": "הנביא מסביר את החזון בהקשר של מצב העם.", "ar": "يشرح النبي الرؤيا في سياق حال الشعب.", "ru": "Пророк объясняет видение в связи с состоянием народа.", "en": "The prophet explains the vision in relation to the people’s plight."},null,[null,{"he": "זה מתאר את הקדשת ירמיהו, לא את חזון העצמות היבשות.", "ar": "هذا يصف تكليف إرميا، لا رؤيا العظام اليابسة.", "ru": "Это описание «Призвание Иеремии», а не «Видение сухих костей».", "en": "That describes Jeremiah’s calling, not vision of dry bones."},{"he": "זה מתאר את חוק על יחס לחלש, לא את חזון העצמות היבשות.", "ar": "هذا يصف قانون معاملة الضعيف، لا رؤيا العظام اليابسة.", "ru": "Это описание «Закон о защите слабого», а не «Видение сухих костей».", "en": "That describes law on treatment of the vulnerable, not vision of dry bones."},{"he": "זה מתאר את קהלת והמחזוריות, לא את חזון העצמות היבשות.", "ar": "هذا يصف الجامعة ودورات الطبيعة، لا رؤيا العظام اليابسة.", "ru": "Это описание «Екклесиаст и циклы», а не «Видение сухих костей».", "en": "That describes Ecclesiastes and cycles, not vision of dry bones."}]),
  Q("bib-choice-1261-2",{"he": "איזה תיאור מתאים להקדשת ירמיהו?", "ar": "أي وصف يناسب تكليف إرميا؟", "ru": "Какое описание подходит к «Призвание Иеремии»?", "en": "Which description fits Jeremiah’s calling?"},[{"he": "ביחזקאל ל״ז חזון העצמות מציג תחייה כדימוי לתקווה לעם מיואש.", "ar": "في حزقيال 37 تعرض رؤيا العظام حياة جديدة صورةً لأمل شعب يائس.", "ru": "В Иезекииле 37 оживление костей служит образом надежды для отчаявшегося народа.", "en": "In Ezekiel 37 the bones’ revival pictures hope for a despairing people."},{"he": "בירמיהו א׳ הנביא חושש שאינו יודע לדבר מפני שהוא צעיר, ונענה שלא יישאר לבדו.", "ar": "في إرميا 1 يخاف النبي لأنه فتى لا يحسن الكلام، فيُطمأن بأنه ليس وحده.", "ru": "В Иеремии 1 пророк опасается, что молод и не умеет говорить, и получает заверение в поддержке.", "en": "In Jeremiah 1 the prophet worries that he is young and cannot speak; he is reassured of support."},{"he": "בחוקי התורה חוזרת הדרישה להגן על גר, יתום ואלמנה.", "ar": "تتكرر في قوانين التوراة مطالب حماية الغريب واليتيم والأرملة.", "ru": "В законах Торы повторяется требование защищать пришельца, сироту и вдову.", "en": "Torah laws repeatedly call for protecting the stranger, orphan and widow."},{"he": "בקהלת א׳ תנועות חוזרות בטבע משמשות רקע לשאלת התועלת בעמל האדם.", "ar": "في الجامعة 1 تشكل حركات الطبيعة المتكررة خلفية للسؤال عن جدوى تعب الإنسان.", "ru": "В Екклесиасте 1 повторяющиеся движения природы служат фоном вопроса о пользе человеческого труда.", "en": "In Ecclesiastes 1 recurring motions of nature frame a question about the gain from human toil."}],1,{"he": "חפשו את הפרט שמבדיל אותו מן האחרים.", "ar": "ابحثوا عن التفصيل الذي يميزه عن غيره.", "ru": "Ищите отличие от остальных вариантов.", "en": "Look for the detail that separates it from the others."},{"he": "הפער בין חשש לשליחות עומד במרכז התיאור.", "ar": "التوتر بين الخوف والمهمة محور المشهد.", "ru": "Напряжение между страхом и поручением составляет суть эпизода.", "en": "The tension between fear and mission is central."},null,[
