egal theme, not a personal dream."},null,[{"he": "זה מתאר את חזון העצמות היבשות, לא את חוק על יחס לחלש.", "ar": "هذا يصف رؤيا العظام اليابسة، لا قانون معاملة الضعيف.", "ru": "Это описание «Видение сухих костей», а не «Закон о защите слабого».", "en": "That describes vision of dry bones, not law on treatment of the vulnerable."},{"he": "זה מתאר את הקדשת ירמיהו, לא את חוק על יחס לחלש.", "ar": "هذا يصف تكليف إرميا، لا قانون معاملة الضعيف.", "ru": "Это описание «Призвание Иеремии», а не «Закон о защите слабого».", "en": "That describes Jeremiah’s calling, not law on treatment of the vulnerable."},null,{"he": "זה מתאר את קהלת והמחזוריות, לא את חוק על יחס לחלש.", "ar": "هذا يصف الجامعة ودورات الطبيعة، لا قانون معاملة الضعيف.", "ru": "Это описание «Екклесиаст и циклы», а не «Закон о защите слабого».", "en": "That describes Ecclesiastes and cycles, not law on treatment of the vulnerable."}])
 ,Q("bib-choice61-jeremiah",{"he": "מהו רגע המפנה בפרק ההקדשה של ירמיהו (ירמיהו א')?", "ar": "ما لحظة التحول في فصل تكريس إرميا (إرميا 1)؟", "ru": "Каков переломный момент в главе призвания Иеремии (Иеремия 1)?", "en": "What is the turning point in Jeremiah's call chapter (Jeremiah 1)?"},[{"he": "אלוהים ממנה את ירמיהו נביא לגויים, אף שהוא טוען 'נער אנוכי'", "ar": "الله يعيّن إرميا نبيًا للأمم رغم قوله «إني فتى»", "ru": "Бог назначает Иеремию пророком для народов, хотя тот говорит «я юноша»", "en": "God appoints Jeremiah a prophet to the nations, though he says \"I am a youth\""},{"he": "ירמיהו בורח לתרשיש כדי להימנע מהשליחות, בדיוק כפי שעשה יונה לפניו", "ar": "يرميا يهرب إلى ترشيش ليتجنب الرسالة، تمامًا كما فعل يونان قبله", "ru": "Иеремия бежит в Таршиш, чтобы избежать поручения, совсем как Иона до него", "en": "Jeremiah flees to Tarshish to avoid the mission, just as Jonah did before him"},{"he": "ירמיהו מתמנה לכהן בבית המקדש", "ar": "يرميا يُعيَّن كاهنًا في الهيكل", "ru": "Иеремия назначается священником в Храме", "en": "Jeremiah is appointed a priest in the Temple"},{"he": "ירמיהו מקבל ספר וקורא אותו לעם", "ar": "يرميا يتلقى سفرًا ويقرؤه للشعب", "ru": "Иеремия получает свиток и читает его народу", "en": "Jeremiah receives a scroll and reads it to the people"}],0,{"he": "חפשו את המענה לטענה 'נער אנוכי'.", "ar": "ابحثوا عن الرد على قوله «إني فتى».", "ru": "Найдите ответ на слова «я юноша».", "en": "Look for the answer to \"I am a youth\"."},{"he": "ירמיהו מתנגד בפסוק ו': 'אהה... נער אנוכי'. המענה בא מיד: 'אל תאמר נער אנוכי... נתתי דברי בפיך'. דוגמה: כמו משה, גם ירמיהו מקבל שליחות למרות התנגדות - דפוס מוכר של פרקי הקדשה.", "ar": "يعترض إرميا في الآية 6: «آه... إني فتى». يأتي الرد فورًا: «لا تقل إني فتى... جعلت كلامي في فمك». مثال: مثل موسى، يتلقى إرميا الرسالة رغم الاعتراض - نمط معروف في فصول الدعوة.", "ru": "Иеремия возражает в стихе 6: «я юноша». Ответ следует сразу: «не говори: я юноша... вложил слова Мои в уста твои». Пример: как Моисей, Иеремия получает поручение несмотря на возражение - известный образец глав призвания.", "en": "Jeremiah objects in verse 6: \"I am a youth\". The answer comes at once: \"Do not say I am a youth... I have put My words in your mouth\". Example: like Moses, Jeremiah receives the mission despite his objection - a known pattern in call chapters."},null,[null,{"he": "הבריחה לתרשיש היא סיפורו של יונה, לא של ירמיהו.", "ar": "الهروب إلى ترشيش قصة يونان لا إرميا.", "ru": "Бегство в Таршиш - история Ионы, а не Иеремии.", "en": "The flight to Tarshish is Jonah's story, not Jeremiah's."},{"he": "השליחות היא נבואה לגויים, לא כהונה במקדש.", "ar": "الرسالة نبوة للأمم لا كهانة في الهيكل.", "ru": "Поручение - пророчество для народов, а не священство в Храме.", "en": "The mission is prophecy to the nations, not Temple priesthood."},{"he": "קריאת ספר לעם שייכת לפרקים אחרים; כאן השליחות ניתנת ישירות.", "ar": "قراءة سفر للشعب تخص فصولًا أخرى؛ هنا تُعطى الرسالة مباشرة.", "ru": "Чтение свитка народу относится к другим главам; здесь поручение даётся напрямую.", "en": "Reading a scroll to the people belongs to other chapters; here the mission is given directly."}]),Q("bib-choice61-weak",{"he": "מה משותף לחוקי המקרא העוסקים בגר, ביתום ובאלמנה?", "ar": "ما المشترك بين شرائع التوراة عن الغريب واليتيم والأرملة؟", "ru": "Что общего у законов Торы о пришельце, сироте и вдове?", "en": "What do the Torah's laws about the stranger, the orphan and the widow have in common?"},[{"he": "הם מגינים על חלשים בלי עורכין, בנימוק 'כי גרים הייתם במצרים'", "ar": "تحمي ضعفاء لا سند لهم، بعلة «لأنكم كنتم غرباء في مصر»", "ru": "Они защищают слабых без заступников, обосновывая: «ибо пришельцами были вы в Египте»", "en": "They protect the weak who have no backing, grounded in \"for you were strangers in Egypt\""},{"he": "החוקים האלה עוסקים רק במסים ובתשלומים שמוטלים על כל תושבי הארץ", "ar": "هذه الشرائع تتعلق فقط بالضرائب والمدفوعات المفروضة على كل سكان الأرض", "ru": "Эти законы касаются только налогов и платежей, налагаемых на всех жителей страны", "en": "These laws deal only with taxes and payments imposed on all the inhabitants of the land"},{"he": "הם חלים רק על בני שבט יהודה", "ar": "تسري فقط على بني سبط يهوذا", "ru": "Они действуют только для колена Иуды", "en": "They apply only to the tribe of Judah"},{"he": "הם ניתנו כדי לפצות את הכוהנים", "ar": "أُعطيت لتعويض الكهنة", "ru": "Они даны, чтобы возместить священникам", "en": "They were given to compensate the priests"}],0,{"he": "חפשו את המשפט שמסביר למה דווקא אנחנו צריכים להגן.", "ar": "ابحثوا عن الجملة التي تفسر لماذا نحن تحديدًا يجب أن نحمي.", "ru": "Найдите фразу, объясняющую, почему именно мы должны защищать.", "en": "Look for the sentence that explains why we in particular must protect."},{"he": "החוקים חוזרים ומזכירים: 'גר לא תונה... כי גרים הייתם בארץ מצרים' (שמות כ\"ב). דוגמה: הזיכרון הלאומי של עבדות הופך לבסיס מוסרי להגנה על החלש היום.", "ar": "تكرر الشرائع: «لا تظلم الغريب... لأنكم كنتم غرباء في أرض مصر» (الخروج 22). مثال: الذاكرة القومية للعبودية تصبح أساسًا أخلاقيًا لحماية الضعيف اليوم.", "ru": "Законы повторяют: «пришельца не притесняй... ибо пришельцами были вы в земле Египетской» (Исход 22). Пример: национальная память о рабстве становится моральной основой защиты слабого сегодня.", "en": "The laws repeat: \"do not wrong a stranger... for you were strangers in the land of Egypt\" (Exodus 22). Example: the national memory of slavery becomes a moral basis for protecting the weak today."},null,[null,{"he": "החוקים עוסקים ביחס אנושי, לא בכספים.", "ar": "الشرائع عن المعاملة الإنسانية لا عن المال.", "ru": "Законы о человеческом отношении, а не о деньгах.", "en": "The laws are about human treatment, not money."},{"he": "החוקים חלים על כל העם ועל כל החלשים, ללא קשר לשבט.", "ar": "تسري على كل الشعب وكل الضعفاء بصرف النظر عن السبط.", "ru": "Они действуют для всего народа и всех слабых, независимо от колена.", "en": "They apply to the whole people and all the weak, regardless of tribe."},{"he": "הנימוק הוא זיכרון הגרות במצרים, לא פיצוי לכוהנים.", "ar": "العلة ذكرى الغربة في مصر لا تعويض الكهنة.", "ru": "Обоснование - память о пришельчестве в Египте, а не компенсация священникам.", "en": "The ground is the memory of being strangers in Egypt, not compensation for priests."}])],

  Q("bib-choice-1261-4",{"he": "איזה תיאור מתאים לקהלת והמחזוריות?", "ar": "أي وصف يناسب الجامعة ودورات الطبيعة؟", "ru": "Какое описание подходит к «Екклесиаст и циклы»?", "en": "Which description fits Ecclesiastes and cycles?"},[{"he": "ביחזקאל ל״ז חזון העצמות מציג תחייה כדימוי לתקווה לעם מיואש.", "ar": "في حزقيال 37 تعرض رؤيا العظام حياة جديدة صورةً لأمل شعب يائس.", "ru": "В Иезекииле 37 оживление костей служит образом надежды для отчаявшегося народа.", "en": "In Ezekiel 37 the bones’ revival pictures hope for a despairing people."},{"he": "בירמיהו א׳ הנביא חושש שאינו יודע לדבר מפני שהוא צעיר, ונענה שלא יישאר לבדו.", "ar": "في إرميا 1 يخاف النبي لأنه فتى لا يحسن الكلام، فيُطمأن بأنه ليس وحده.", "ru": "В Иеремии 1 пророк опасается, что молод и не умеет говорить, и получает заверение в поддержке.", "en": "In Jeremiah 1 the prophet worries that he is young and cannot speak; he is reassured of support."},{"he": "בחוקי התורה חוזרת הדרישה להגן על גר, יתום ואלמנה.", "ar": "تتكرر في قوانين التوراة مطالب حماية الغريب واليتيم والأرملة.", "ru": "В законах Торы повторяется требование защищать пришельца, сироту и вдову.", "en": "Torah laws repeatedly call for protecting the stranger, orphan and widow."},{"he": "בקהלת א׳ תנועות חוזרות בטבע משמשות רקע לשאלת התועלת בעמל האדם.", "ar": "في الجامعة 1 تشكل حركات الطبيعة المتكررة خلفية للسؤال عن جدوى تعب الإنسان.", "ru": "В Екклесиасте 1 повторяющиеся движения природы служат фоном вопроса о пользе человеческого труда.", "en": "In Ecclesiastes 1 recurring motions of nature frame a question about the gain from human toil."}],3,{"he": "חפשו את הפרט שמבדיל אותו מן האחרים.", "ar": "ابحثوا عن التفصيل الذي يميزه عن غيره.", "ru": "Ищите отличие от остальных вариантов.", "en": "Look for the detail that separates it from the others."},{"he": "הטבע החוזר מציב את שאלת חיי האדם בהקשר רחב.", "ar": "تضع دورات الطبيعة سؤال حياة الإنسان في سياق أوسع.", "ru": "Повторяемость природы задаёт более широкий контекст вопросу о жизни.", "en": "Nature’s cycles set a wider frame for the question of human life."},null,[{"he": "זה מתאר את חזון העצמות היבשות, לא את קהלת והמחזוריות.", "ar": "هذا يصف رؤيا العظام اليابسة، لا الجامعة ودورات الطبيعة.", "ru": "Это описание «Видение сухих костей», а не «Екклесиаст и циклы».", "en": "That describes vision of dry bones, not Ecclesiastes and cycles."},{"he": "זה מתאר את הקדשת ירמיהו, לא את קהלת והמחזוריות.", "ar": "هذا يصف تكليف إرميا، لا الجامعة ودورات الطبيعة.", "ru": "Это описание «Призвание Иеремии», а не «Екклесиаст и циклы».", "en": "That describes Jeremiah’s calling, not Ecclesiastes and cycles."},{"he": "זה מתאר את חוק על יחס לחלש, לא את קהלת והמחזוריות.", "ar": "هذا يصف قانون معاملة الضعيف، لا الجامعة ودورات الطبيعة.", "ru": "Это описание «Закон о защите слабого», а не «Екклесиаст и циклы».", "en": "That describes law on treatment of the vulnerable, not Ecclesiastes and cycles."},null])
 ,Q("bib-choice61-kohelet",{"he": "מה מלמדת טענתו של קהלת 'אין כל חדש תחת השמש'?", "ar": "ماذا تعلّم مقولة الجامعة «لا جديد تحت الشمس»؟", "ru": "Чему учит утверждение Экклезиаста «нет ничего нового под солнцем»?", "en": "What does Ecclesiastes' claim \"there is nothing new under the sun\" teach?"},[{"he": "המחזוריות מזמינה ענווה: מה שנראה לנו חדש כבר היה, ולכן כדאי ללמוד מן העבר", "ar": "الدورية تدعو إلى التواضع: ما يبدو لنا جديدًا كان من قبل، لذا يستحسن التعلم من الماضي", "ru": "Цикличность приглашает к смирению: то, что кажется новым, уже было, и потому стоит учиться у прошлого", "en": "The cyclical view invites humility: what seems new has already been, so it pays to learn from the past"},{"he": "אסור לחדש דבר בעולם", "ar": "يُمنع ابتكار أي شيء في العالم", "ru": "Запрещено создавать что-либо новое в мире", "en": "It is forbidden to invent anything in the world"},{"he": "הטבע עצמו אינו משתנה לעולם", "ar": "الطبيعة نفسها لا تتغير أبدًا", "ru": "Сама природа никогда не меняется", "en": "Nature itself never changes"},{"he": "קהלת מספק הוכחה מדעית למחזוריות", "ar": "الجامعة يقدم برهانًا علميًا على الدورية", "ru": "Экклезиаст даёт научное доказательство цикличности", "en": "Ecclesiastes provides scientific proof of cyclicality"}],0,{"he": "חשבו איזו עמדה כלפי החיים נובעת מהמחזוריות.", "ar": "فكّروا أي موقف من الحياة ينتج عن الدورية.", "ru": "Подумайте, какое отношение к жизни следует из цикличности.", "en": "Think about what attitude to life follows from cyclicality."},{"he": "קהלת א' פותח במחזורי הטבע והדורות: 'מה שהיה הוא שיהיה'. דוגמה: דור חושב שהמציא הכל, והקטע מזכיר שגם לפנינו חשבו כך. זו לא איסור חדוש אלא קריאה לפרופורציה.", "ar": "يفتتح الجامعة 1 بدورات الطبيعة والأجيال: «ما كان هو ما يكون». مثال: جيل يظن أنه اخترع كل شيء، والمقطع يذكّر أن من قبلنا ظنوا ذلك أيضًا. هذه ليست منعًا للابتكار بل دعوة إلى التواضع.", "ru": "Экклезиаст 1 открывается циклами природы и поколений: «что было, то и будет». Пример: поколение думает, что изобрело всё, а текст напоминает, что и до нас так думали. Это не запрет новизны, а призыв к мере.", "en": "Ecclesiastes 1 opens with the cycles of nature and generations: \"what has been is what will be\". Example: a generation thinks it invented everything, and the passage reminds us that those before us thought so too. It is not a ban on novelty but a call for proportion."},null,[null,{"he": "הקטע אינו צו; הוא תיאור שמזמין עמדה, לא איסור.", "ar": "المقطع ليس أمرًا؛ هو وصف يدعو إلى موقف لا منعًا.", "ru": "Текст не предписание; это описание, приглашающее к отношению, а не запрет.", "en": "The passage is not a command; it is a description inviting an attitude, not a ban."},{"he": "קהלת מדבר על מעשה האדם ודורותיו, לא על קיבוע הטבע.", "ar": "الجامعة يتكلم عن فعل الإنسان وأجياله لا عن تجميد الطبيعة.", "ru": "Экклезиаст говорит о делах человека и поколениях, а не о застывшей природе.", "en": "Ecclesiastes speaks of human deeds and generations, not of frozen nature."},{"he": "זהו טקסט חכמה, לא ניסוי מדעי; ה'הוכחה' היא שקילה על החיים.", "ar": "هذا نص حكمة لا تجربة علمية؛ «البرهان» تأمل في الحياة.", "ru": "Это текст мудрости, а не научный опыт; «доказательство» - размышление о жизни.", "en": "This is wisdom literature, not a scientific experiment; the \"proof\" is a reflection on life."}]),Q("bib-choice61-prophet-now",{"he": "תלמיד טוען שהנביאים דיברו רק על העתיד הרחוק. איזו התייחסות הולמת?", "ar": "يدّعي طالب أن الأنبياء تكلموا فقط عن المستقبل البعيد. أي معالجة مناسبة؟", "ru": "Ученик утверждает, что пророки говорили только о далёком будущем. Какой подход уместен?", "en": "A student claims the prophets spoke only about the far future. Which response is fitting?"},[{"he": "הנבואה פונה קודם לדור שלה: ביקורת חברתית ומוסרית על ההווה, לצד ציפייה לעתיד", "ar": "النبوة تخاطب أولًا جيلها: نقد اجتماعي وأخلاقي للحاضر، مع تطلع للمستقبل", "ru": "Пророчество обращено прежде всего к своему поколению: социальная и нравственная критика настоящего, наряду с ожиданием будущего", "en": "Prophecy addresses its own generation first: social and moral criticism of the present, alongside hope for the future"},{"he": "הטענה נכונה לחלוטין", "ar": "الادعاء صحيح تمامًا", "ru": "Утверждение совершенно верно", "en": "The claim is entirely correct"},{"he": "הנביאים דיברו רק על העבר", "ar": "الأنبياء تكلموا فقط عن الماضي", "ru": "Пророки говорили только о прошлом", "en": "The prophets spoke only about the past"},{"he": "אין בנבואה שום התייחסות לחברה", "ar": "لا توجد في النبوة أي إشارة إلى المجتمع", "ru": "В пророчестве нет никакого отношения к обществу", "en": "Prophecy has no reference to society at all"}],0,{"he": "מצאו נביא שפונה לאנשי זמנו על מעשיהם.", "ar": "ابحثوا عن نبي يخاطب أهل زمانه عن أفعالهم.", "ru": "Найдите пророка, обращающегося к современникам об их делах.", "en": "Find a prophet addressing his contemporaries about their deeds."},{"he": "ישעיהו א' למשל פונה ישירות לדורו: 'ידע שור קונהו... ישראל לא ידע'. דוגמה: הביקורת על עוול חברתי היא בלב הנבואה, והחזון העתידי נשען עליה. לכן 'רק עתיד רחוק' מחמיצ את העיקר.", "ar": "إشعياء 1 مثلًا يخاطب جيله مباشرة: «عرف الثور قانيه... إسرائيل لم يعرف». مثال: النقد على الظلم الاجتماعي في قلب النبوة، والرؤيا المستقبلية تستند إليه. لذلك «فقط مستقبل بعيد» يفوّت الجوهر.", "ru": "Исаия 1, например, обращается прямо к своему поколению: «вол знает владетеля своего... а Израиль не знает». Пример: критика социальной несправедливости - в сердце пророчества, и будущее видение опирается на неё. Поэтому «только далёкое будущее» упускает главное.", "en": "Isaiah 1, for example, addresses his generation directly: \"the ox knows its owner... Israel does not know\". Example: criticism of social wrongs is at prophecy's heart, and the future vision rests on it. So \"only the far future\" misses the core."},null,[null,{"he": "הטקסטים עצמם מראים פנייה ישירה להווה; הטענה אינה נכונה.", "ar": "النصوص نفسها تُظهر مخاطبة مباشرة للحاضر؛ الادعاء غير صحيح.", "ru": "Сами тексты показывают прямое обращение к настоящему; утверждение неверно.", "en": "The texts themselves show direct address to the present; the claim is not correct."},{"he": "העבר מוזכר, אך הדגש הוא על ההווה והעתיד.", "ar": "الماضي يُذكر، لكن التأكيد على الحاضر والمستقبل.", "ru": "Прошлое упоминается, но акцент - на настоящем и будущем.", "en": "The past is mentioned, but the stress is on present and future."},{"he": "דווקא ההתייחסות לחברה היא ממוקדי הנבואה.", "ar": "الإشارة إلى المجتمع هي بالذات من محاور النبوة.", "ru": "Именно отношение к обществу - один из центров пророчества.", "en": "Reference to society is precisely one of prophecy's cores."}])]]);

  Q("bib-unseen-1261-1",{"he": "איזה תיאור מתאים למילת מפתח חוזרת?", "ar": "أي وصف يناسب كلمة مفتاحية مكررة؟", "ru": "Какое описание подходит к «Повторяющееся ключевое слово»?", "en": "Which description fits repeated key word?"},[{"he": "מילה שמופיעה כמה פעמים ויכולה לקשר בין חלקי הקטע.", "ar": "كلمة تتكرر وقد تربط بين أجزاء المقطع.", "ru": "Слово, повторяющееся и связывающее части отрывка.", "en": "A word recurring across a passage that can link its parts."},{"he": "דמות אומרת דבר אחד ועושה אחר; הפער עשוי ללמד על מניע או שינוי.", "ar": "تقول الشخصية شيئًا وتفعل غيره؛ وقد يكشف الفرق دافعًا أو تغيرًا.", "ru": "Герой говорит одно, а делает другое; расхождение может показать мотив или перемену.", "en": "A character says one thing but does another; the gap may reveal motive or change."},{"he": "טענה של דמות היא דבריה שלה; לא תמיד זו עמדת הסיפור כולו.", "ar": "قول الشخصية يعبر عنها؛ وليس بالضرورة موقف السرد كله.", "ru": "Слова персонажа выражают его взгляд, но не всегда позицию всего рассказа.", "en": "A character’s claim is their own and not always the stance of the whole narrative."},{"he": "פירוש פרט לא ברור באמצעות מה שקודם לו ומה שבא אחריו.", "ar": "تفسير تفصيل غير واضح بما يسبقه وما يليه.", "ru": "Толкование неясной детали по тому, что до и после неё.", "en": "Reading an unclear detail in light of what comes before and after."}],0,{"he": "חפשו את הפרט שמבדיל אותו מן האחרים.", "ar": "ابحثوا عن التفصيل الذي يميزه عن غيره.", "ru": "Ищите отличие от остальных вариантов.", "en": "Look for the detail that separates it from the others."},{"he": "החזרה מזמינה בדיקה של משמעות בכל הופעה.", "ar": "يدعو التكرار إلى فحص معناها في كل موضع.", "ru": "Повторение предлагает сравнить значение в каждом случае.", "en": "Repetition invites comparison of each occurrence."},null,[null,{"he": "זה מתאר את הבדל בין דיבור למעשה, לא את מילת מפתח חוזרת.", "ar": "هذا يصف فرق القول والعمل، لا كلمة مفتاحية مكررة.", "ru": "Это описание «Разница между словом и делом», а не «Повторяющееся ключевое сл   Q("bib-unseen-1261-2",{"he": "איזה תיאור מתאים להבדל בין דיבור למעשה?", "ar": "أي وصف يناسب فرق القول والعمل؟", "ru": "Какое описание подходит к «Разница между словом и делом»?", "en": "Which description fits speech-action gap?"},[{"he": "מילה שמופיעה כמה פעמים ויכולה לקשר בין חלקי הקטע.", "ar": "كلمة تتكرر وقد تربط بين أجزاء المقطع.", "ru": "Слово, повторяющееся и связывающее части отрывка.", "en": "A word recurring across a passage that can link its parts."},{"he": "דמות אומרת דבר אחד ועושה אחר; הפער עשוי ללמד על מניע או שינוי.", "ar": "تقول الشخصية شيئًا وتفعل غيره؛ وقد يكشف الفرق دافعًا أو تغيرًا.", "ru": "Герой говорит одно, а делает другое; расхождение может показать мотив или перемену.", "en": "A character says one thing but does another; the gap may reveal motive or change."},{"he": "טענה של דמות היא דבריה שלה; לא תמיד זו עמדת הסיפור כולו.", "ar": "قول الشخصية يعبر عنها؛ وليس بالضرورة موقف السرد كله.", "ru": "Слова персонажа выражают его взгляд, но не всегда позицию всего рассказа.", "en": "A character’s claim is their own and not always the stance of the whole narrative."},{"he": "פירוש פרט לא ברור באמצעות מה שקודם לו ומה שבא אחריו.", "ar": "تفسير تفصيل غير واضح بما يسبقه وما يليه.", "ru": "Толкование неясной детали по тому, что до и после неё.", "en": "Reading an unclear detail in light of what comes before and after."}],1,{"he": "חפשו את הפרט שמבדיל אותו מן האחרים.", "ar": "ابحثوا عن التفصيل الذي يميزه عن غيره.", "ru": "Ищите отличие от остальных вариантов.", "en": "Look for the detail that separates it from the others."},{"he": "בדקו את שני המקומות בטקסט לפני הסקת המסקנה.", "ar": "افحصوا الموضعين قبل الاستنتاج.", "ru": "Проверьте оба места текста до вывода.", "en": "Check both passages before drawing a conclusion."},null,[{"he": "זה מתאר את מילת מפתח חוזרת, לא את הבדל בין דיבור למעשה.", "ar": "هذا يصف كلمة مفتاحية مكررة، لا فرق القول والعمل.", "ru": "Это описание «Повторяющееся ключевое слово», а не «Разница между словом и делом».", "en": "That describes repeated key word, not speech-action gap."},null,{"he": "זה מתאר את דמות ונקודת מבטה, לא את הבדל בין דיבור למעשה.", "ar": "هذا يصف الشخصية ومنظورها، لا فرق القول والعمل.", "ru": "Это описание «Персонаж и его взгляд», а не «Разница между словом и делом».", "en": "That describes character viewpoint, not speech-action gap."},{"he": "זה מתאר את הסקה מן ההקשר, לא את הבדל בין דיבור למעשה.", "ar": "هذا يصف استنتاج من السياق، لا فرق القول والعمل.", "ru": "Это описание «Вывод из контекста», а не «Разница между словом и делом».", "en": "That describes inference from context, not speech-action gap."}])
 ,Q("bib-unseen-keyword",{"he": "בקטע מקראי חדש המילה 'אמת' חוזרת חמש פעמים. מה כדאי לעשות קודם?", "ar": "في مقطع توراتي جديد تتكرر كلمة «أمت» (صدق) خمس مرات. ما الأفضل فعله أولًا؟", "ru": "В новом библейском отрывке слово «правда» повторяется пять раз. Что стоит сделать сначала?", "en": "In a new biblical passage the word \"truth\" repeats five times. What is best to do first?"},[{"he": "לסמן את ההופעות ולבדוק מה משתנה סביבן - כך מוצאים מילת מפתח", "ar": "تعليم المواضع وفحص ما يتغير حولها - هكذا نجد الكلمة المفتاح", "ru": "Отметить вхождения и проверить, что меняется вокруг них - так находят ключевое слово", "en": "Mark the occurrences and check what changes around them - that is how a keyword is found"},{"he": "לדלג עליה - חזרה אינה משנה", "ar": "تجاوزها - التكرار لا يهم", "ru": "Пропустить его - повтор не важен", "en": "Skip it - repetition does not matter"},{"he": "להחליף אותה במילה אחרת", "ar": "استبدالها بكلمة أخرى", "ru": "Заменить его другим словом", "en": "Replace it with another word"},{"he": "לספור אותה ולעבור הלאה בלי לקרוא", "ar": "عدّها والانتقال دون قراءة", "ru": "Посчитать его и идти дальше, не читая", "en": "Count it and move on without reading"}],0,{"he": "חזרה בטקסט מקראי היא לרוב סימן דרך.", "ar": "التكرار في النص التوراتي غالبًا إشارة طريق.", "ru": "Повтор в библейском тексте - обычно указатель.", "en": "Repetition in a biblical text is usually a signpost."},{"he": "מילה החוזרת פעמים רבות היא כמעט תמיד מילת מפתח. דוגמה: אם 'אמת' מופיעה בכל פעם שדמות מתלבטת, היא כנראה מרכז הנושא של הקטע, וכל הופעה מוסיפה ניואנס.", "ar": "الكلمة المتكررة كثيرًا هي غالبًا كلمة مفتاح. مثال: إذا ظهرت «صدق» كلما ترددت شخصية، فهي على الأرجح مركز موضوع المقطع، وكل موضع يضيف معنى.", "ru": "Многократно повторяющееся слово - почти всегда ключевое. Пример: если «правда» появляется всякий раз, когда герой сомневается, она, вероятно, центр темы отрывка, и каждое вхождение добавляет оттенок.", "en": "A word repeating many times is almost always a keyword. Example: if \"truth\" appears whenever a character wavers, it is likely the passage's central theme, and each occurrence adds a nuance."},null,[null,{"he": "דילוג מפסיד את אות הדרך שהמחבר שם בכוונה.", "ar": "التجاوز يفوّت إشارة الطريق التي وضعها المؤلف قصدًا.", "ru": "Пропуск теряет указатель, который автор поставил намеренно.", "en": "Skipping loses the signpost the author placed deliberately."},{"he": "החלפה מוחקת את הראיה במקום לפרש אותה.", "ar": "الاستبدال يمحو الدليل بدل تفسيره.", "ru": "Замена стирает улику вместо её толкования.", "en": "Replacing erases the evidence instead of interpreting it."},{"he": "ספירה בלי קריאה נותנת מספר, לא משמעות.", "ar": "العد دون قراءة يعطي رقمًا لا معنى.", "ru": "Подсчёт без чтения даёт число, а не смысл.", "en": "Counting without reading gives a number, not meaning."}])],

escribes repeated key word, not character viewpoint."},{"he": "זה מתאר את הבדל בין דיבור למעשה, לא את דמות ונקודת מבטה.", "ar": "هذا يصف فرق القول والعمل، لا الشخصية ومنظورها.", "ru": "Это описание «Разница между словом и делом», а не «Персонаж и его взгляд».", "en": "That describes speech-action gap, not character viewpoint."},null,{"he": "זה מתאר את הסקה מן ההקשר, לא את דמות ונקודת מבטה.", "ar": "هذا يصف استنتاج من السياق، لا الشخصية ومنظورها.", "ru": "Это описание «Вывод из контекста», а не «Персонаж и его взгляд».", "en": "That describes inference from context, not character viewpoint."}])
 ,Q("bib-unseen-gap",{"he": "דמות בקטע אומרת 'אעשה ככל דברך' אך מיד פועלת ההפך. מה הדרך הנכונה לקרוא זאת?", "ar": "شخصية في المقطع تقول «سأفعل كل ما تقول» لكنها تفعل العكس فورًا. ما القراءة الصحيحة؟", "ru": "Персонаж в отрывке говорит «сделаю всё, что ты скажешь», но тут же поступает наоборот. Как это правильно читать?", "en": "A character in a passage says \"I will do all you say\" but immediately does the opposite. How should this be read?"},[{"he": "כפער מכוון בין דיבור למעשה, המלמד על הדמות", "ar": "كفجوة مقصودة بين القول والفعل تكشف عن الشخصية", "ru": "Как намеренный разрыв между словом и делом, раскрывающий персонажа", "en": "As a deliberate gap between speech and action that reveals the character"},{"he": "כטעות של המחבר", "ar": "كخطأ من المؤلف", "ru": "Как ошибку автора", "en": "As the author's mistake"},{"he": "כהוכחה שהדמות אמרה את האמת", "ar": "كدليل أن الشخصية صدقت", "ru": "Как доказательство, что персонаж говорил правду", "en": "As proof the character told the truth"},{"he": "כפרט שאין לו משמעות", "ar": "كتفصيل بلا معنى", "ru": "Как незначащую деталь", "en": "As a meaningless detail"}],0,{"he": "כשהטקסט שם דיבור ומעשה זה מול זה, שאלו למה.", "ar": "حين يضع النص القول والفعل متقابلين، اسألوا لماذا.", "ru": "Когда текст ставит слово и дело рядом, спросите зачем.", "en": "When the text places speech and action side by side, ask why."},{"he": "פער בין דיבור למעשה הוא כלי ספרותי ידוע. דוגמה: דמות המבטיחה ומפרה מיד נחשפת ככזבנית או כמתלבטת - והקורא לומד עליה יותר מאשר מתיאור ישיר.", "ar": "الفجوة بين القول والفعل أداة أدبية معروفة. مثال: شخصية تَعِد وتخلف فورًا تنكشف كاذبة أو مترددة - والقارئ يتعلم عنها أكثر مما يعلمه الوصف المباشر.", "ru": "Разрыв между словом и делом - известный литературный приём. Пример: персонаж, обещающий и тут же нарушающий, раскрывается как лжец или как сомневающийся - и читатель узнаёт о нём больше, чем из прямого описания.", "en": "A gap between speech and action is a known literary tool. Example: a character who promises and immediately breaks it is exposed as a liar or as conflicted - and the reader learns more than from direct description."},null,[null,{"he": "כתיבה עתיקה מכוונת; ההנחה היא שהפער נועד ללמד.", "ar": "الكتابة القديمة مقصودة؛ الافتراض أن الفجوة تُقصد للتعليم.", "ru": "Древний текст намеренен; предполагается, что разрыв призван учить.", "en": "Ancient writing is deliberate; the assumption is the gap is meant to teach."},{"he": "המעשה סותר את הדיבור; זו בדיוק הנקודה.", "ar": "الفعل يناقض القول؛ هذه بالضبط النقطة.", "ru": "Дело противоречит слову; в этом и суть.", "en": "The action contradicts the speech; that is exactly the point."},{"he": "הצמדת דיבור ומעשה הופכת פרט 'קטן' לחשוב.", "ar": "جمع القول والفعل يحوّل تفصيلًا «صغيرًا» إلى مهم.", "ru": "Соседство слова и дела превращает «мелкую» деталь в важную.", "en": "Placing speech beside action turns a \"small\" detail into an important one."}]),Q("bib-unseen-pov",{"he": "כיצד מזהים מנקודת מבט של דמות בקטע מקראי?", "ar": "كيف نحدد وجهة نظر شخصية في مقطع توراتي؟", "ru": "Как определить точку зрения персонажа в библейском отрывке?", "en": "How do you identify a character's point of view in a biblical passage?"},[{"he": "עוקבים אחרי מילות הרגש, הערכה והפנייה שלה, ומשווים לדברי דמויות אחרות", "ar": "نتتبع كلمات العاطفة والتقييم والنداء لديها، ونقارن بكلام شخصيات أخرى", "ru": "Следим за её словами чувства, оценки и обращения и сравниваем со словами других персонажей", "en": "Track her words of feeling, judgment and address, and compare with other characters' speech"},{"he": "סופרים כמה פעמים שמה מופיע", "ar": "نعدّ كم مرة يظهر اسمها", "ru": "Считаем, сколько раз появляется её имя", "en": "Count how many times her name appears"},{"he": "מנחשים לפי סוף הקטע", "ar": "نخمّن من نهاية المقطع", "ru": "Угадываем по концу отрывка", "en": "Guess from the end of the passage"},{"he": "מסתמכים על מה שאומרים עליה בלבד", "ar": "نعتمد فقط على ما يقوله عنها الآخرون", "ru": "Полагаемся только на то, что о ней говорят", "en": "Rely only on what others say about her"}],0,{"he": "המילים של הדמות עצמה הן הרמז הראשי.", "ar": "كلمات الشخصية نفسها هي الدليل الرئيس.", "ru": "Слова самого персонажа - главная подсказка.", "en": "The character's own words are the main clue."},{"he": "נקודת מבט נבנית מבחירות לשוניות. דוגמה: אם דמות קוראת לאחיה 'אדוני' אך חושבת 'אחי הבכור', המילים החוזרות חושפות עמדה. השוואה לדמות אחרת מחדדת את ההבדל.", "ar": "وجهة النظر تُبنى من اختيارات لغوية. مثال: إذا نادت شخصية أخاها «سيدي» لكنها تفكر «أخي البكر»، تكشف الكلمات المتكررة موقفًا. المقارنة بشخصية أخرى توضح الفرق.", "ru": "Точка зрения строится из языковых выборов. Пример: если персонаж зовёт брата «господин мой», но думает «старший брат мой», повторяющиеся слова раскрывают позицию. Сравнение с другим персонажем заостряет различие.", "en": "Point of view is built from language choices. Example: if a character calls her brother \"my lord\" but thinks \"my elder brother\", the recurring words reveal a stance. Comparing with another character sharpens the difference."},null,[null,{"he": "מניין שמות אומר על תדירות, לא על עמדה.", "ar": "عدّ الأسماء يقول شيئًا عن التكرار لا عن الموقف.", "ru": "Подсчёт имён говорит о частоте, а не о позиции.", "en": "Counting names tells frequency, not stance."},{"he": "נקודת מבט נבנית לאורך הקטע, לא מניחוש על סופו.", "ar": "وجهة النظر تُبنى عبر المقطع لا من تخمين نهايته.", "ru": "Точка зрения строится по ходу отрывка, а не угадывается по концу.", "en": "Point of view builds through the passage, not from guessing its end."},{"he": "דברי אחרים מוסיפים זווית, אך המילים שלה הן הראיה הראשונה.", "ar": "كلام الآخرين يضيف زاوية، لكن كلماتها هي الدليل الأول.", "ru": "Слова других добавляют угол, но её слова - первое свидетельство.", "en": "Others' words add an angle, but her own words are the first evidence."}])],

  Q("bib-unseen-1261-4",{"he": "איזה תיאור מתאים להסקה מן ההקשר?", "ar": "أي وصف يناسب استنتاج من السياق؟", "ru": "Какое описание подходит к «Вывод из контекста»?", "en": "Which description fits inference from context?"},[{"he": "מילה שמופיעה כמה פעמים ויכולה לקשר בין חלקי הקטע.", "ar": "كلمة تتكرر وقد تربط بين أجزاء المقطع.", "ru": "Слово, повторяющееся и связывающее части отрывка.", "en": "A word recurring across a passage that can link its parts."},{"he": "דמות אומרת דבר אחד ועושה אחר; הפער עשוי ללמד על מניע או שינוי.", "ar": "تقول الشخصية شيئًا وتفعل غيره؛ وقد يكشف الفرق دافعًا أو تغيرًا.", "ru": "Герой говорит одно, а делает другое; расхождение может показать мотив или перемену.", "en": "A character says one thing but does another; the gap may reveal motive or change."},{"he": "טענה של דמות היא דבריה שלה; לא תמיד זו עמדת הסיפור כולו.", "ar": "قول الشخصية يعبر عنها؛ وليس بالضرورة موقف السرد كله.", "ru": "Слова персонажа выражают его взгляд, но не всегда позицию всего рассказа.", "en": "A character’s claim is their own and not always the stance of the whole narrative."},{"he": "פירוש פרט לא ברור באמצעות מה שקודם לו ומה שבא אחריו.", "ar": "تفسير تفصيل غير واضح بما يسبقه وما يليه.", "ru": "Толкование неясной детали по тому, что до и после неё.", "en": "Reading an unclear detail in light of what comes before and after."}],3,{"he": "חפשו את הפרט שמבדיל אותו מן האחרים.", "ar": "ابحثوا عن التفصيل الذي يميزه عن غيره.", "ru": "Ищите отличие от остальных вариантов.", "en": "Look for the detail that separates it from the others."},{"he": "הקשר מצמצם אפשרויות, אך אין להמציא בו מידע חסר.", "ar": "يضيق السياق الاحتمالات لكنه لا يجيز اختراع معلومات.", "ru": "Контекст сужает варианты, но не позволяет додумывать факты.", "en": "Context narrows possibilities without licensing invented facts."},null,[{"he": "זה מתאר את מילת מפתח חוזרת, לא את הסקה מן ההקשר.", "ar": "هذا يصف كلمة مفتاحية مكررة، لا استنتاج من السياق.", "ru": "Это описание «Повторяющееся ключевое слово», а не «Вывод из контекста».", "en": "That describes repeated key word, not inference from context."},{"he": "זה מתאר את הבדל בין דיבור למעשה, לא את הסקה מן ההקשר.", "ar": "هذا يصف فرق القول والعمل، لا استنتاج من السياق.", "ru": "Это описание «Разница между словом и делом», а не «Вывод из контекста».", "en": "That describes speech-action gap, not inference from context."},{"he": "זה מתאר את דמות ונקודת מבטה, לא את הסקה מן ההקשר.", "ar": "هذا يصف الشخصية ومنظورها، لا استنتاج من السياق.", "ru": "Это описание «Персонаж и его взгляд», а не «Вывод из контекста».", "en": "That describes character viewpoint, not inference from context."},null])
 ,Q("bib-unseen-infer",{"he": "בקטע נאמר שדמות 'ירדה אל הגת בבוקר מוקדם' פעמיים, בלי הסבר. מה אפשר להסיק בזהירות?", "ar": "ورد في المقطع أن شخصية «نزلت إلى المعصرة باكرًا» مرتين دون شرح. ما الذي يمكن استنتاجه بحذر؟", "ru": "В отрывке дважды сказано, что персонаж «спустился к точилу рано утром», без объяснения. Что можно осторожно вывести?", "en": "A passage says twice that a character \"went down to the press early in the morning\", with no explanation. What can be cautiously inferred?"},[{"he": "שיש לה עניין קבוע במקום או באדם הקשור אליו - הסקה שיש לבסס בפרטים נוספים", "ar": "أن لديها اهتمامًا ثابتًا بالمكان أو بشخص مرتبط به - استنتاج يجب تدعيمه بتفاصيل أخرى", "ru": "Что у неё постоянный интерес к месту или связанному с ним человеку - вывод, который надо подкрепить другими деталями", "en": "That she has a steady interest in the place or in someone tied to it - an inference to support with further details"},{"he": "שהיא בהכרח אשמה במשהו", "ar": "أنها بالضرورة مذنبة بشيء ما", "ru": "Что она непременно в чём-то виновата", "en": "That she is necessarily guilty of something"},{"he": "שאין לחזרה שום משמעות", "ar": "أن التكرار بلا أي معنى", "ru": "Что повтор лишён смысла", "en": "That the repetition has no meaning"},{"he": "שהמחבר שכח לכתוב הסבר", "ar": "أن المؤلف نسي كتابة تفسير", "ru": "Что автор забыл написать объяснение", "en": "That the author forgot to write an explanation"}],0,{"he": "הסקה טובה מתחילה בפרט חוזר ונבדקת מול שאר הקטע.", "ar": "الاستنتاج الجيد يبدأ بتفصيل متكرر ويُفحص مع باقي المقطع.", "ru": "Хороший вывод начинается с повторяющейся детали и проверяется по всему отрывку.", "en": "A good inference starts with a recurring detail and is checked against the rest of the passage."},{"he": "הסקה מן ההקשר היא מיומנות מרכזית. דוגמה: חזרה על 'ירדה אל הגת' בזמנים קבועים מרמזת על מטרה חוזרת; אך רק פרטים נוספים (עם מי נפגשת, מה נאמר) יכריעו למה.", "ar": "الاستنتاج من السياق مهارة مركزية. مثال: تكرار «نزلت إلى المعصرة» في أوقات ثابتة يلمّح إلى غاية متكررة؛ لكن فقط تفاصيل أخرى (مع مَن تلتقي، ماذا يُقال) ستحسم لماذا.", "ru": "Вывод из контекста - центральный навык. Пример: повтор «спустилась к точилу» в одно и то же время намекает на повторяющуюся цель; но только другие детали (с кем встречается, что сказано) решат, зачем.", "en": "Inference from context is a core skill. Example: the repeated \"went down to the press\" at fixed times hints at a recurring purpose; but only further details (whom she meets, what is said) will decide why."},null,[null,{"he": "זו הסקה קפיצית; פרט אחד אינו הוכחה לאשמה.", "ar": "هذا استنتاج متسرّع؛ تفصيل واحد ليس برهان ذنب.", "ru": "Это поспешный вывод; одна деталь не доказательство вины.", "en": "That is a leaping inference; one detail is not proof of guilt."},{"he": "חזרה מכוונת היא סימן משמעות, לא רעש.", "ar": "التكرار المقصود علامة معنى لا ضجيج.", "ru": "Намеренный повтор - знак смысла, а не шум.", "en": "Deliberate repetition is a sign of meaning, not noise."},{"he": "ההנחה בקריאה היא שהטקסט מכוון; חיפוש ההסבר הוא עבודת הקורא.", "ar": "الافتراض في القراءة أن النص مقصود؛ البحث عن التفسير عمل القارئ.", "ru": "При чтении предполагается, что текст намеренен; поиск объяснения - работа читателя.", "en": "The reading assumption is that the text is deliberate; finding the explanation is the reader's work."}]),Q("bib-unseen-method",{"he": "תלמידה קוראת קטע מקראי חדש ומסתמכת רק על פירוש מוכר מהבית. מה חסר בעבודה שלה?", "ar": "طالبة تقرأ مقطعًا توراتيًا جديدًا وتعتمد فقط على تفسير معروف من البيت. ما الناقص في عملها؟", "ru": "Ученица читает новый библейский отрывок и опирается только на знакомое домашнее толкование. Чего не хватает в её работе?", "en": "A student reads a new biblical passage and relies only on a familiar interpretation from home. What is missing in her work?"},[{"he": "בדיקה עצמית של הטקסט עצמו - פרטים, מילות מפתח והקשר - לפני שמוסיפים פרשנות חיצונית", "ar": "فحص ذاتي للنص نفسه - تفاصيل وكلمات مفتاح وسياق - قبل إضافة تفسير خارجي", "ru": "Самостоятельная проверка самого текста - детали, ключевые слова и контекст - прежде чем добавлять внешнее толкование", "en": "Her own examination of the text itself - details, keywords and context - before adding an outside interpretation"},{"he": "שום דבר - פירוש מוכר תמיד נכון", "ar": "لا شيء - التفسير المعروف صحيح دائمًا", "ru": "Ничего - знакомое толкование всегда верно", "en": "Nothing - a familiar interpretation is always right"},{"he": "שהייתה צריכה לזכור יותר פירושים", "ar": "كان عليها حفظ مزيد من التفسيرات", "ru": "Ей следовало запомнить больше толкований", "en": "She should have memorized more interpretations"},{"he": "שקטעים חדשים אסור לקרוא בלי מורה", "ar": "أنه يُمنع قراءة مقاطع جديدة دون معلم", "ru": "Что новые отрывки нельзя читать без учителя", "en": "That new passages may not be read without a teacher"}],0,{"he": "מה ההבדל בין לקרוא טקסט לבין לצטט דעה עליו?", "ar": "ما الفرق بين قراءة النص وبين الاستشهاد برأي عنه؟", "ru": "В чём разница между чтением текста и цитированием мнения о нём?", "en": "What is the difference between reading a text and quoting an opinion about it?"},{"he": "מיומנות הקריאה מתחילה בטקסט עצמו. דוגמה: תלמידה שמוצאת בעצמה מילת מפתח או פער בין דיבור למעשה מגיעה לפירוש מבוסס; פירוש מוכר שימושי אחר כך כביקורת על הקריאה שלה.", "ar": "مهارة القراءة تبدأ من النص نفسه. مثال: طالبة تجد بنفسها كلمة مفتاح أو فجوة بين قول وفعل تصل إلى تفسير مؤسس؛ التفسير المعروف يفيد لاحقًا كنقد لقراءتها.", "ru": "Навык чтения начинается с самого текста. Пример: ученица, сама нашедшая ключевое слово или разрыв между словом и делом, приходит к обоснованному толкованию; знакомое толкование полезно позже как проверка её чтения.", "en": "Reading skill starts with the text itself. Example: a student who finds a keyword or a speech-action gap on her own reaches a grounded interpretation; a familiar interpretation is useful later as a check on her reading."},null,[null,{"he": "גם פירוש נכון אינו מחליף קריאה עצמית של הטקסט.", "ar": "حتى التفسير الصحيح لا يغني عن قراءة ذاتية للنص.", "ru": "Даже верное толкование не заменяет самостоятельного чтения текста.", "en": "Even a correct interpretation does not replace reading the text oneself."},{"he": "שינון פרשנויות אינו המיומנות; היכולת לבסס מן הטקסט היא המטרה.", "ar": "حفظ التفسيرات ليس المهارة؛ القدرة على التأسيس من النص هي الهدف.", "ru": "Заучивание толкований - не навык; цель - умение обосновывать из текста.", "en": "Memorizing interpretations is not the skill; grounding from the text is the goal."},{"he": "המיומנות נועדה בדיוק לאפשר קריאה עצמאית.", "ar": "المهارة قُصدت تمامًا لتمكين قراءة مستقلة.", "ru": "Навык предназначен именно для самостоятельного чтения.", "en": "The skill is meant precisely to enable independent reading."}])]]);

 ,Q("bib-origin-tree",{"he": "מה עומד במרכז הסיפור על עץ הדעת?", "ar": "ما الذي يقف في مركز قصة شجرة المعرفة؟", "ru": "Что стоит в центре истории о древе познания?", "en": "What stands at the center of the tree of knowledge story?"},[{"he": "בחירה אנושית מול גבול שניתן, והשלכותיה על האדם", "ar": "اختيار إنساني مقابل حدّ مُعطى، وعواقبه على الإنسان", "ru": "Человеческий выбор против заданной границы и его последствия для человека", "en": "A human choice against a given boundary, and its consequences for humankind"},{"he": "מתכון ביתי מפורט להכנת ריבת תאנים משובחת בשיטת הבישול האיטי", "ar": "وصفة بيتية مفصلة لتحضير مربى تين فاخر بطريقة الطهي البطيء", "ru": "Подробный домашний рецепт отличного варенья из инжира способом медленного варения", "en": "A detailed home recipe for excellent fig jam using the slow-cooking method"},{"he": "מלחמה בין שני גנים", "ar": "حرب بين جنتين", "ru": "Война между двумя садами", "en": "A war between two gardens"},{"he": "הוראות לנטיעת עצים", "ar": "تعليمات لغرس الأشجار", "ru": "Инструкции по посадке деревьев", "en": "Instructions for planting trees"}],0,{"he": "חפשו את הרגע שבו נעשית בחירה.", "ar": "ابحثوا عن اللحظة التي يُتخذ فيها اختيار.", "ru": "Найдите момент, когда делается выбор.", "en": "Look for the moment when a choice is made."},{"he": "הסיפור בבראשית ג' נפתח באיסור ברור ('מעץ הדעת טוב ורע לא תאכל') וממשיך בבחירה, בחשיפה ובהשלכות. דוגמה: אחרי האכילה 'ותפקחנה עיני שניהם' - השינוי הוא פנימי, לא קולינרי.", "ar": "تُفتتح القصة في التكوين 3 بمنع واضح («من شجرة معرفة الخير والشر لا تأكل») وتتابع بالاختيار والانكشاف والعواقب. مثال: بعد الأكل «انفتحت عيناهما» - التغيير داخلي لا طعامي.", "ru": "История в Бытии 3 открывается ясным запретом («от дерева познания добра и зла не ешь») и продолжается выбором, раскрытием и последствиями. Пример: после вкушения «открылись глаза у них обоих» - перемена внутренняя, а не кулинарная.", "en": "The story in Genesis 3 opens with a clear prohibition (\"of the tree of knowledge of good and evil you shall not eat\") and continues with a choice, an exposure and consequences. Example: after the eating \"the eyes of both were opened\" - the change is internal, not culinary."},null,[null,{"he": "הפרי והעלי משרתים את הסיפור; הם אינם נושאו.", "ar": "الثمرة والورق يخدمان القصة؛ ليسا موضوعها.", "ru": "Плод и листва служат истории; они не её тема.", "en": "The fruit and leaves serve the story; they are not its subject."},{"he": "יש גן אחד בסיפור, לא מלחמת גנים.", "ar": "في القصة جنة واحدة لا حرب جنان.", "ru": "В истории один сад, а не война садов.", "en": "There is one garden in the story, not a war of gardens."},{"he": "העץ מוצב כגבול ולא כמדריך גינון.", "ar": "الشجرة موضوعة كحدّ لا كدليل زراعة.", "ru": "Дерево поставлено как граница, а не как руководство по садоводству.", "en": "The tree is set as a boundary, not as a gardening guide."}]),Q("bib-origin-cain",{"he": "מה מלמד שיחת ה' עם קין לפני הרצח?", "ar": "ماذا يعلّم حديث الله مع قايين قبل القتل؟", "ru": "Чему учит разговор Бога с Каином перед убийством?", "en": "What does God's conversation with Cain before the murder teach?"},[{"he": "שיש לאדם בחירה: 'הלוא אם תיטיב שאת' - האחריות על המעשה היא שלו", "ar": "أن للإنسان اختيارًا: «أليس إن أحسنتَ رفعًا» - المسؤولية عن الفعل عليه", "ru": "Что у человека есть выбор: «если делаешь доброе...» - ответственность за поступок на нём", "en": "That a person has a choice: \"if you do well, uplift\" - responsibility for the act is his"},{"he": "שקין נידון לדין מראש ולא יכול היה לבחור בדרך אחרת בשום שלב שהוא", "ar": "أن قايين حُكم عليه سلفًا ولم يكن بوسعه اختيار طريق آخر في أي مرحلة", "ru": "Что Каин был осуждён заранее и не мог выбрать иной путь ни на каком этапе", "en": "That Cain was pre-judged and could not choose another path at any stage"},{"he": "שהשיחה עוסקת בחוקי קרבנות בלבד", "ar": "أن الحديث عن شرائع القرابين فقط", "ru": "Что разговор только о законах жертвоприношений", "en": "That the conversation is only about sacrifice laws"},{"he": "שהבל התכוון להקניט את אחיו", "ar": "أن هابيل قصد إغاظة أخيه", "ru": "Что Авель намеревался дразнить брата", "en": "That Abel meant to tease his brother"}],0,{"he": "קראו את המשפט שמופיע ממש לפני המעשה.", "ar": "اقرأوا الجملة الواردة مباشرة قبل الفعل.", "ru": "Прочитайте фразу, стоящую непосредственно перед поступком.", "en": "Read the sentence that comes right before the act."},{"he": "לפני הרצח נאמר לקין: 'לפתח חטאת רובץ, ואתה תמשל בו' (בראשית ד'). דוגמה: הטקסט שם את הכוח לבחור בידי קין - ולכן האחריות כפולה: על המעשה ועל התשובה 'השומר אחי אנוכי'.", "ar": "قبل القتل يُقال لقايين: «عند الباب خطيئة رابضة، وأنت تتسلط عليها» (التكوين 4). مثال: يضع النص قدرة الاختيار بيد قايين - لذلك المسؤولية مضاعفة: عن الفعل وعن الإجابة «أحارس أخي أنا؟».", "ru": "Перед убийством Каину сказано: «у дверей грех лежит, а ты господствуй над ним» (Бытие 4). Пример: текст вкладывает силу выбора в руки Каина - поэтому ответственность двойная: за поступок и за ответ «разве я сторож брату моему?».", "en": "Before the murder Cain is told: \"sin crouches at the door, and you shall master it\" (Genesis 4). Example: the text places the power to choose in Cain's hands - so the responsibility is double: for the act and for the answer \"am I my brother's keeper?\"."},null,[null,{"he": "הפנייה עצמה מוכיחה שהבחירה פתוחה; אין גזירה מוקדמת.", "ar": "المخاطبة نفسها تثبت أن الاختيار مفتوح؛ لا حكم مسبق.", "ru": "Само обращение доказывает, что выбор открыт; нет заранее вынесенного приговора.", "en": "The very address proves the choice is open; there is no prior verdict."},{"he": "הקרבנות הם רקע; הליבה היא הבחירה והקנאה.", "ar": "القرابين خلفية؛ الجوهر هو الاختيار والغيرة.", "ru": "Жертвы - фон; суть - выбор и ревность.", "en": "The sacrifices are background; the core is choice and jealousy."},{"he": "אין בטקסט הוכחה להקניטה; ההדגשה על קין.", "ar": "لا دليل في النص على الإغاظة؛ التأكيد على قايين.", "ru": "В тексте нет свидетельства дразнения; акцент на Каине.", "en": "The text has no evidence of teasing; the stress is on Cain."}])],

  Q("bib-origin-1262-4",{"he": "איזה תיאור מתאים למגדל בבל?", "ar": "أي وصف يناسب برج بابل؟", "ru": "Какое описание подходит к «Вавилонская башня»?", "en": "Which description fits Tower of Babel?"},[{"he": "בראשית א׳ מציג סדר של ימי בריאה; בראשית ב׳ מתמקד באדם ובגן.", "ar": "يعرض التكوين 1 ترتيب أيام الخلق، ويركز التكوين 2 على الإنسان والحديقة.", "ru": "Бытие 1 описывает последовательность дней, а Бытие 2 сосредоточено на человеке и саде.", "en": "Genesis 1 orders creation by days; Genesis 2 focuses on the human and the garden."},{"he": "בבראשית ג׳ אכילה מן העץ האסור מובילה לשאלות על בחירה ואחריות.", "ar": "في التكوين 3 يقود الأكل من الشجرة المحرمة إلى أسئلة الاختيار والمسؤولية.", "ru": "В Бытии 3 вкушение от запретного дерева ставит вопросы выбора и ответственности.", "en": "In Genesis 3 eating from the forbidden tree raises questions of choice and responsibility."},{"he": "בבראשית ד׳ קנאה ורצח אח מלוּוים בשאלה על אחריותו של אדם לאחיו.", "ar": "في التكوين 4 تصاحب الغيرة وقتل الأخ مسألة مسؤولية الإنسان عن أخيه.", "ru": "В Бытии 4 зависть и убийство брата ставят вопрос об ответственности за ближнего.", "en": "In Genesis 4 jealousy and fratricide are tied to responsibility for a brother."},{"he": "בבראשית י״א מסופר על בניית מגדל ועל בלבול השפות.", "ar": "في التكوين 11 قصة بناء البرج واختلاط الألسنة.", "ru": "В Бытии 11 рассказ о строительстве башни и смешении языков.", "en": "Genesis 11 tells of building a tower and the confusion of tongues."}],3,{"he": "חפשו את הפרט שמבדיל אותו מן האחרים.", "ar": "ابحثوا عن التفصيل الذي يميزه عن غيره.", "ru": "Ищите отличие от остальных вариантов.", "en": "Look for the detail that separates it from the others."},{"he": "הדיבור המשותף והפסקתו קושרים בין אחדות לפיזור.", "ar": "يجمع اللسان الواحد وتغيّره بين الوحدة والتفرق.", "ru": "Общий язык и его утрата связывают единство с рассеянием.", "en": "Shared speech and its disruption connect unity and dispersion."},null,[{"he": "זה מתאר את שני תיאורי הבריאה, לא את מגדל בבל.", "ar": "هذا يصف  ,Q("bib-origin-babel",{"he": "מה מבקר סיפור מגדל בבל?", "ar": "ماذا تنتقد قصة برج بابل؟", "ru": "Что критикует история о Вавилонской башне?", "en": "What does the Tower of Babel story criticize?"},[{"he": "ריכוז כוח לשם תהילה עצמית, במקום מטרה משותפת", "ar": "تمركز القوة لمجد ذاتي بدل غاية مشتركة", "ru": "Сосредоточение силы ради собственной славы вместо общей цели", "en": "A concentration of power for self-glory instead of a shared purpose"},{"he": "הבנייה בלבנים במקום באבנים הייתה שגיאה הנדסית של הבונים", "ar": "البناء باللبن بدل الحجارة كان خطأ هندسيًا من البنائين", "ru": "Строительство из кирпичей вместо камней было инженерной ошибкой строителей", "en": "Building with bricks instead of stones was an engineering mistake by the builders"},{"he": "דיבור בשפה אחת", "ar": "التحدث بلغة واحدة", "ru": "Речь на одном языке", "en": "Speaking one language"},{"he": "מגורים בעמק", "ar": "السكن في السهل", "ru": "Жительство в долине", "en": "Living in a valley"}],0,{"he": "שימו לב מה הבונים אומרים על עצמם.", "ar": "انتبهوا ماذا يقول البناؤون عن أنفسهم.", "ru": "Обратите внимание, что строители говорят о себе.", "en": "Notice what the builders say about themselves."},{"he": "הבונים אומרים: 'נעשה לנו שם, פן נפוץ' (בראשית י\"א). דוגמה: הבעיה אינה הטכנולוגיה (לבנים נזכרות כפרט) אלא המטרה - תהילה עצמית וריכוז. התוצאה, פיזור ושפות, היא היפוך ישיר של התוכנית.", "ar": "يقول البناؤون: «لنصنع لنا اسمًا لئلا نتبدد» (التكوين 11). مثال: المشكلة ليست التقنية (اللبن يُذكر كتفصيل) بل الغاية - مجد ذاتي وتمركز. النتيجة، تشتت ولغات، هي عكس مباشر للخطة.", "ru": "Строители говорят: «сделаем себе имя, чтобы не рассеяться» (Бытие 11). Пример: проблема не в технологии (кирпичи упомянуты как деталь), а в цели - собственная слава и сосредоточение. Результат, рассеяние и языки, - прямой разворот плана.", "en": "The builders say: \"let us make a name for ourselves, lest we scatter\" (Genesis 11). Example: the problem is not the technology (bricks are mentioned as a detail) but the goal - self-glory and صة عن أسماك فقط", "ru": "Потоп - история только о рыбах", "en": "The flood is a story only about fish"},{"he": "נח נענש בסוף הסיפור", "ar": "نوح عوقب في نهاية القصة", "ru": "Ной наказан в конце истории", "en": "Noah is punished at the end of the story"}],0,{"he": "בדקו מה קורה לדמות המרכזית ומה מובטח בסוף.", "ar": "افحصوا ما يحدث للشخصية المركزية وما يُوعد في النهاية.", "ru": "Проверьте, что происходит с главным героем и что обещано в конце.", "en": "Check what happens to the central character and what is promised at the end."},{"he": "הטקסט פותח את הסיפור ב'נח איש צדיק תמים היה בדורותיו' (בראשית ו'). דוגמה: ההצלה עצמה מבוססת על הליכה כראוי, וברית הקשת מוסיפה הבטחה: 'עוד לא אוסיף לקלל את האדמה'. מסקנת הסיפור הפוכה מהטענה.", "ar": "يفتتح النص القصة بـ«نوح رجل صدّيق تام كان في أجياله» (التكوين 6). مثال: النجاة نفسها مؤسسة على السلوك القويم، وعهد القوس يضيف وعدًا: «لن أعود ألعن الأرض». خلاصة القصة معاكسة للادعاء.", "ru": "Текст открывает историю словами «Ной был человек праведный и непорочный в поколениях своих» (Бытие 6). Пример: само спасение основано на достойной жизни, а завет радуги добавляет обещание: «не буду больше проклинать землю». Вывод истории противоположен утверждению.", "en": "The text opens the story with \"Noah was a righteous man, blameless in his generations\" (Genesis 6). Example: the rescue itself rests on right living, and the rainbow covenant adds a promise: \"I will not again curse the ground\". The story's conclusion is the opposite of the claim."},null,[null,{"he": "נח מוצג כצדיק ממש בפתיחת הסיפור.", "ar": "نوح يُعرض كصدّيق في افتتاح القصة نفسها.", "ru": "Ной представлен праведником в самом открытии истории.", "en": "Noah is presented as righteous in the story's very opening."},{"he": "הגשת הסיפור ככזה 'על דגים' מחמיצה את מהלך המשפט והברית.", "ar": "عرض القصة كأنها «عن أسماك» يفوّت مسار الحكم والعهد.", "ru": "Представление истории как «о рыбах» упускает ход суда и завета.", "en": "Framing the story as being \"about fish\" misses the course of   Q("bib-choice-1262-1",{"he": "איזה תיאור מתאים להשוואת סיפורים?", "ar": "أي وصف يناسب مقارنة القصص؟", "ru": "Какое описание подходит к «Сопоставление рассказов»?", "en": "Which description fits comparing stories?"},[{"he": "בחינת אירועים דומים בשני סיפורים וזיהוי פרט ששונה ומשנה פירוש.", "ar": "فحص أحداث متشابهة في قصتين وتحديد فرق يغيّر الفهم.", "ru": "Сравнение похожих событий двух рассказов и значимой детали различия.", "en": "Examining similar events in two accounts and a difference that changes their meaning."},{"he": "אמירה נבואית המצביעה על מעשה פסול ודורשת שינוי בחברה.", "ar": "قول نبوي يبيّن فعلًا خاطئًا ويطالب بتغيير اجتماعي.", "ru": "Пророческая речь указывает на проступок и требует перемен в обществе.", "en": "Prophetic speech names wrongdoing and calls for social change."},{"he": "החלת כלל מן הכתוב על מצב מסוים, תוך בדיקה של תנאיו.", "ar": "تطبيق قاعدة من النص على حالة محددة مع فحص شروطها.", "ru": "Применение текстового правила к случаю с проверкой условий.", "en": "Applying a textual rule to a specific case while checking its conditions."},{"he": "תגובה של דמות או מספר המעמידה לצד עמדה אחת נקודת מבט נוספת.", "ar": "رد شخصية أو راوٍ يضع منظورًا آخر بجانب موقف معين.", "ru": "Ответ героя или рассказчика, дающий иную точку зрения рядом с первой.", "en": "A character’s or narrator’s response offering another viewpoint beside the first."}],0,{"he": "חפשו את הפרט שמבדיל אותו מן האחרים.", "ar": "ابحثوا عن التفصيل الذي يميزه عن غيره.", "ru": "Ищите отличие от остальных вариантов.", "en": "Look for the detail that separates it from the others."},{"he": "השוואה צריכה לכלול דמיון וגם הבדל מבוסס בטקסט.", "ar": "تحتاج المقارنة إلى شبه واختلاف تدعمهما النصوص.", "ru": "Сравнение требует сходства и подтверждённого текстом различия.", "en": "A comparison needs both a similarity and a text-based difference."},null,[null,{"he": "זה מתאר את נבואה וביקורת, לא את השוואת סיפורים.", "ar": "هذا يصف النبوة والنقد، لا مقارنة القصص.", "ru": "Это описание «Пророчество и критика», а не «Сопоставление рассказов».", "en": "That describes prophecy and critique, not comparing stories."},{"he": "זה מתאר את חוק ומקרה, לא את השוואת סיפורים.", "ar": "هذا يصف قانون وحالة، لا مقارنة القصص.", "ru": "Это описание «Закон и случай», а не «Сопоставление рассказов».", "en": "That describes law and case, not comparing stories."},{"he": "זה מתאר את קול אחר במקרא, לא את השוואת סיפורים.", "ar": "هذا يصف صوت آخر في النص، لا مقارنة القصص.", "ru": "Это описание «Другой голос в тексте», а не «Сопоставление рассказов».", "en": "That describes another voice in the text, not comparing stories."}]),
  Q("bib-choice-1262-2",{"he": "איזה תיאור מתאים לנבואה וביקורת?", "ar": "أي وصف يناسب النبوة والنقد؟", "ru": "Какое описание подходит к «Пророчество и критика»?", "en": "Which description fits prophecy and critique?"},[{"he": "בחינת אירועים דומים בשני סיפורים וזיהוי פרט ששונה ומשנה פירוש.", "ar": "فحص أحداث متشابهة في قصتين وتحديد فرق يغيّر الفهم.", "ru": "Сравнение похожих событий двух рассказов и значимой детали различия.", "en": "Examining similar events in two accounts and a difference that changes their meaning."},{"he": "אמירה נבואית המצביעה על מעשה פסול ודורשת שינוי בחברה.", "ar": "قول نبوي يبيّن فعلًا خاطئًا ويطالب بتغيير اجتماعي.", "ru": "Пророческая речь указывает на проступок и требует перемен в обществе.", "en": "Prophetic speech names wrongdoing and calls for social change."},{"he": "החלת כלל מן הכתוב על מצב מסוים, תוך בדיקה של תנאיו.", "ar": "تطبيق قاعدة من النص على حالة محددة مع فحص شروطها.", "ru": "Применение текстового правила к случаю с проверкой условий.", "en": "Applying a textual rule to a specific case while checking its conditions."},{"he": "תגובה של דמות או מספר המעמידה לצד עמדה אחת נקודת מבט נוספת.", "ar": "رد شخصية أو راوٍ يضع منظورًا آخر بجانب موقف معين.", "ru": "Ответ героя или рассказчика, дающий иную точку зрения рядом с первой.", "en": "A character’s or narrator’s response offering another viewpoint beside the first."}],1,{"he": "חפשו את הפרט שמבדיל אותו מן האחרים.", "ar": "ابحثوا عن التفصيل الذي يميزه عن غيره.", "ru": "Ищите отличие от остальных вариантов.", "en": "Look for the detail that separates it from the others."},{"he": "בדקו כלפי מי מופנית הביקורת ומה השינוי שנדרש.", "ar": "افحصوا إلى من يوجّه النقد وما التغيير المطلوب.", "ru": "Уточните адресата критики и требуемую перемену.", "en": "Ask whom the critique addresses and what change it demands."},null,[{"he": "זה מתאר את השוואת סיפורים, לא את נבואה וביקורת.", "ar": "هذا يصف مقارنة القصص، لا النبوة والنقد.", "ru": "Это описание «Сопоставление рассказов», а не «Пророчество и критика».", "en": "That describes comparing stories, not prophecy and critique."},null,{"he": "זה מתאר את חוק ומקרה, לא את נבואה וביקורת.", "ar": "هذا يصف قانون وحالة، لا النبوة والنقد.", "ru": "Это описание «Закон и случай», а не «Пророчество и критика».", "en": "That describes law and case, not prophecy and critique."},{"he": "זה מתאר את קול אחר במקרא, לא את נבואה וביקורת.", "ar": "هذا يصف صوت آخر في النص، لا النبوة والنقد.", "ru": "Это описание «Другой голос в тексте», а не «Пророчество и критика».", "en": "That describes another voice in the text, not prophecy and critique."}])
 ,Q("bib-choice62-compare",{"he": "מהו הצעד הראשון בהשוואה בין שני סיפורים מקראיים דומים?", "ar": "ما الخطوة الأولى في مقارنة قصتين توراتيتين متشابهتين؟", "ru": "Каков первый шаг в сравнении двух похожих библейских историй?", "en": "What is the first step in comparing two similar biblical stories?"},[{"he": "למפות מה משותף ומה שונה בכל סיפור בנפרד, ורק אז להסיק", "ar": "رسم ما هو مشترك وما هو مختلف في كل قصة على حدة، ثم الاستنتاج", "ru": "Отметить, что общего и что различно в каждой истории отдельно, и только затем выводить", "en": "Map what is shared and what differs in each story separately, and only then infer"},{"he": "להחליט מראש שהם זהים", "ar": "الحكم مسبقًا أنهما متماثلتان", "ru": "Заранее решить, что они тождественны", "en": "Decide in advance they are identical"},{"he": "לבחור את הסיפור הארוך יותר", "ar": "اختيار القصة الأطول", "ru": "Выбрать более длинную историю", "en": "Pick the longer story"},{"he": "לדלג על הקריאה ולשאול אחרים", "ar": "تجاوز القراءة وسؤال الآخرين", "ru": "Пропустить чтение и спросить других", "en": "Skip reading and ask others"}],0,{"he": "השוואה מתחילה בסימון, לא במסקנה.", "ar": "المقارنة تبدأ بالتعليم لا بالخلاصة.", "ru": "Сравнение начинается с отметок, а не с вывода.", "en": "Comparison starts with marking, not with a conclusion."},{"he": "שיטת ההשוואה עובדת בשלבים: קודם טבלה של מרכיבים (דמויות, מקום, מפנה, סוף) לכל סיפור. דוגמה: סיפורי יציאה דומים חוזרים במקרא, ורק מיפוי מדויק חושף מה כל אחד מדגיש.", "ar": "طريقة المقارنة تعمل بمراحل: أولًا جدول عناصر (شخصيات، مكان، تحول، نهاية) لكل قصة. مثال: قصص الخروج المتشابهة تتكرر في التوراة، وفقط رسم دقيق يكشف ما يؤكده كل منها.", "ru": "Метод сравнения работает по этапам: сначала таблица элементов (персонажи, место, перелом, конец) для каждой истории. Пример: похожие истории исхода повторяются в Писании, и только точная разметка раскрывает, что подчёркивает каждая.", "en": "The comparison method works in stages: first a table of elements (characters, place, turning point, ending) for each story. Example: similar exodus stories repeat in the Bible, and only precise mapping reveals what each one stresses."},null,[null,{"he": "דמיון כללי מסתיר את ההבדלים המשמעותיים שההשוואה באה לחשוף.", "ar": "التشابه العام يحجب الفروق المهمة التي جاءت المقارنة لتكشفها.", "ru": "Общее сходство скрывает значимые различия, которые сравнение призвано раскрыть.", "en": "General similarity hides the significant differences the comparison comes to reveal."},{"he": "אורך אינו קריטריון; תוכן ומבנה הם הבסיס.", "ar": "الطول ليس معيارًا؛ المضمون والبنية هما الأساس.", "ru": "Длина не критерий; содержание и структура - основа.", "en": "Length is not a criterion; content and structure are the basis."},{"he": "דילוג מונע בדיקה עצמית שהיא לב המיומנות.", "ar": "التجاوز يمنع الفحص الذاتي الذي هو لب المهارة.", "ru": "Пропуск отменяет самостоятельную проверку, которая есть ядро навыка.", "en": "Skipping prevents the independent examination that is the core of the skill."}])],

 ,Q("bib-choice62-nathan",{"he": "כיצד מצליחה משל נתן (שמואל ב' י\"ב) להעביר ביקורת על דוד?", "ar": "كيف ينجح مثل ناثان (صموئيل الثاني 12) في تمرير نقد لداود؟", "ru": "Как удаётся притче Нафана (2 Царств 12) донести критику до Давида?", "en": "How does Nathan's parable (2 Samuel 12) succeed in delivering criticism to David?"},[{"he": "המשל גורם לדוד לשפוט מקרה אחר בכעס, ואז נחשף שהוא שפט את עצמו", "ar": "المثل يجعل داود يحكم بغضب على قضية أخرى، ثم ينكشف أنه حكم على نفسه", "ru": "Притча заставляет Давида гневно судить чужой случай, и затем выясняется, что он судил себя", "en": "The parable makes David angrily judge another case, and then it is exposed that he judged himself"},{"he": "נתן מאיים על דוד בחורב", "ar": "ناثان يهدد داود بالسيف", "ru": "Нафан угрожает Давиду мечом", "en": "Nathan threatens David with a sword"},{"he": "דוד מבין מיד בלי משל", "ar": "داود يفهم فورًا دون مثل", "ru": "Давид понимает сразу, без притчи", "en": "David understands at once, with no parable"},{"he": "המשל מסופר לעם ולא לדוד", "ar": "المثل يُروى للشعب لا لداود", "ru": "Притча рассказана народу, а не Давиду", "en": "The parable is told to the people, not to David"}],0,{"he": "עקבו מי שופט את מי במהלך הפרק.", "ar": "تتبّعوا مَن يحكم على مَن خلال الفصل.", "ru": "Проследите, кто судит кого на протяжении главы.", "en": "Track who judges whom through the chapter."},{"he": "נתן מספר על עשיר שלקח כבשת רש, ודוד כועס: 'בן מוות האיש'. אז בא 'אתה הגבר'. דוגמה: הביקורת עובדת כי דוד נוקט עמדה מוסרית לפני שהוא יודע שהיא עליו - כך המשל עוקף את ההגנות.", "ar": "يروي ناثان عن غني أخذ حَمَل الفقير، فيغضب داود: «ابن الموت ذلك الرجل». ثم يأتي «أنت هو الرجل». مثال: النقد ينجح لأن داود يتخذ موقفًا أخلاقيًا قبل أن يعرف أنه عنه - هكذا يتجاوز المثل الدفاعات.", "ru": "Нафан рассказывает о богаче, взявшем агницу бедняка, и Давид гневается: «смерти достоин этот человек». Затем звучит «ты - этот человек». Пример: критика работает, потому что Давид занимает нравственную позицию, не зная, что она о нём, - так притча обходит защиту.", "en": "Nathan tells of a rich man who took a poor man's lamb, and David is angry: \"that man deserves death\". Then comes \"you are the man\". Example: the criticism works because David takes a moral stand before knowing it is about him - so the parable bypasses his defenses."},null,[null,{"he": "אין איום פיזי; הכוח של המשל הוא מוסרי.", "ar": "لا تهديد جسدي؛ قوة المثل أخلاقية.", "ru": "Нет физической угрозы; сила притчи нравственная.", "en": "There is no physical threat; the parable's power is moral."},{"he": "דווקא המשל הוא שפותח את הדרך להכרה.", "ar": "المثل بالذات هو الذي يفتح الطريق إلى الإدراك.", "ru": "Именно притча открывает путь к признанию.", "en": "It is precisely the parable that opens the way to recognition."},{"he": "המשל מופנה ישירות אל דוד המלך.", "ar": "المثل موجه مباشرة إلى الملك داود.", "ru": "Притча обращена прямо к царю Давиду.", "en": "The parable is addressed directly to King David."}]),Q("bib-choice62-lawcase",{"he": "מהו עקרון 'חוק ומקרה' בלימוד מקרא?", "ar": "ما مبدأ «شريعة وحالة» في دراسة التوراة؟", "ru": "Что такое принцип «закон и случай» в изучении Писания?", "en": "What is the \"law and case\" principle in Bible study?"},[{"he": "בודקים כיצד חוק כללי מתממש במקרה סיפורי קונקרטי, ומה המתח ביניהם מלמד", "ar": "فحص كيف تتجسد شريعة عامة في حالة قصصية محددة، وماذا يعلّم التوتر بينهما", "ru": "Проверяют, как общий закон осуществляется в конкретном сюжетном случае, и чему учит напряжение между ними", "en": "Examine how a general law plays out in a concrete narrative case, and what the tension between them teaches"},{"he": "קוראים רק חוקים בלי סיפורים", "ar": "قراءة الشرائع فقط دون قصص", "ru": "Читают только законы без историй", "en": "Read only laws without stories"},{"he": "מחליפים את החוק במקרה", "ar": "استبدال الشريعة بالحالة", "ru": "Заменяют закон случаем", "en": "Replace the law with the case"},{"he": "כל מקרה מבטל את החוק", "ar": "كل حالة تلغي الشريعة", "ru": "Каждый случай отменяет закон", "en": "Every case cancels the law"}],0,{"he": "חשבו על חוק ככלל ועל סיפור כבחינה שלו.", "ar": "فكّروا في الشريعة كقاعدة وفي القصة كاختبار لها.", "ru": "Думайте о законе как правиле и об истории как его проверке.", "en": "Think of the law as a rule and of the story as its test."},{"he": "למשל חוק 'עין תחת עין' מול סיפור של פציעה בפועל. דוגמה: המקרה הסיפורי מכריע איך הכלל פועל במציאות - ולעיתים מחדד למה נכתב כך. המתח בין כלל למקרה הוא מקום הלמידה.", "ar": "مثلًا شريعة «عين بعين» مقابل قصة إصابة واقعية. مثال: الحالة القصصية تحسم كيف تعمل القاعدة في الواقع - وأحيانًا توضح لماذا كُتبت هكذا. التوتر بين القاعدة والحالة هو موضع التعلم.", "ru": "Например, закон «око за око» против истории реального увечья. Пример: сюжетный случай решает, как правило работает в реальности, - и порой уточняет, почему оно так записано. Напряжение между правилом и случаем - место обучения.", "en": "For example the law \"eye for an eye\" against a story of an actual injury. Example: the narrative case decides how the rule works in reality - and sometimes clarifies why it was written so. The tension between rule and case is the place of learning."},null,[null,{"he": "השיטה דורשת דווקא את שניהם יחד: כלל ומקרה.", "ar": "الطريقة تتطلب بالذات كليهما معًا: قاعدة وحالة.", "ru": "Метод требует как раз обоих вместе: правила и случая.", "en": "The method requires precisely both together: rule and case."},{"he": "המקרה בוחן את החוק, לא מחליף אותו.", "ar": "الحالة تختبر الشريعة لا تستبدلها.", "ru": "Случай проверяет закон, а не заменяет его.", "en": "The case tests the law, not replaces it."},{"he": "מקרה מאתגר מלמד על גבולות הכלל, לא מבטל אותו אוטומטית.", "ar": "حالة صعبة تعلّم عن حدود القاعدة لا تلغيها تلقائيًا.", "ru": "Сложный случай учит о границах правила, а не отменяет его автоматически.", "en": "A challenging case teaches about the rule's limits, not automatically cancels it."}])],
 [
  Q("bib-choice-1262-4",{"he": "איזה תיאור מתאים לקול אחר במקרא?", "ar": "أي وصف يناسب صوت آخر في النص؟", "ru": "Какое описание подходит к «Другой голос в тексте»?", "en": "Which description fits another voice in the text?"},[{"he": "בחינת אירועים דומים בשני סיפורים וזיהוי פרט ששונה ומשנה פירוש.", "ar": "فحص أحداث متشابهة في قصتين وتحديد فرق يغيّر الفهم.", "ru": "Сравнение похожих событий двух рассказов и значимой детали различия.", "en": "Examining similar events in two accounts and a difference that changes their meaning."},{"he": "אמירה נבואית המצביעה על מעשה פסול ודורשת שינוי בחברה.", "ar": "قول نبوي يبيّن فعلًا خاطئًا ويطالب بتغيير اجتماعي.", "ru": "Пророческая речь указывает на проступок и требует перемен в обществе.", "en": "Prophetic speech names wrongdoing and calls for social change."},{"he": "החלת כלל מן הכתוב על מצב מסוים, תוך בדיקה של תנאיו.", "ar": "تطبيق قاعدة من النص على حالة محددة مع فحص شروطها.", "ru": "Применение текстового правила к случаю с проверкой условий.", "en": "Applying a textual rule to a specific case while checking its conditions."},{"he": "תגובה של דמות או מספר המעמידה לצד עמדה אחת נקודת מבט נוספת.", "ar": "رد شخصية أو راوٍ يضع منظورًا آخر بجانب موقف معين.", "ru": "Ответ героя или рассказчика, дающий иную точку зрения рядом с первой.", "en": "A character’s or narrator’s response offering another viewpoint beside the first."}],3,{"he": "חפשו את הפרט שמבדיל אותו מן האחרים.", "ar": "ابحثوا عن التفصيل الذي يميزه عن غيره.", "ru": "Ищите отличие от остальных вариантов.", "en": "Look for the detail that separates it from the others."},{"he": "כדי לזהות קול נוסף יש לשאול מי מדבר ובאיזה הקשר.", "ar": "لتحديد الصوت الآخر اسألوا من يتكلم وفي أي سياق.", "ru": "Чтобы услышать другой голос, спросите, кто говорит и в каком контексте.", "en": "To identify another voice, ask who speaks and in what context."},null,[{"he": "זה מתאר את השוואת סיפורים, לא את קול אחר במקרא.", "ar": "هذا يصف مقارنة القصص، لا صوت آخر في النص.", "ru": "Это описание «Сопоставление рассказов», а не «Другой голос в тексте».", "en": "That describes comparing stories, not another voice in the text."},{"he": "זה מתאר את נבואה וביקורת, לא את קול אחר במקרא.", "ar": "هذا يصف النبوة والنقد، لا صوت آخر في النص.", "ru": "Это описание «Пророчество и критика», а не «Другой голос в тексте».", "en": "That describes prophecy and critique, not another voice in the text."},{"he": "זה מתאר את חוק ומקרה, לא את קול אחר במקרא.", "ar": "هذا يصف قانون وحالة، لا صوت آخر في النص.", "ru": "Это описание «Закон и случай», а не «Другой голос в тексте».", "en": "That describes law and case, not another voice in the text."},null])
 ,Q("bib-choice62-voice",{"he": "מה הרווח בקריאת 'קול אחר' במקרא - למשל קהלת לצד ספרי הנבואה?", "ar": "ما الفائدة من قراءة «صوت آخر» في التوراة - كالجامعة بجانب كتب النبوة؟", "ru": "Какова польза чтения «иного голоса» в Писании - например, Экклезиаста рядом с пророческими книгами?", "en": "What is gained by reading \"another voice\" in the Bible - for example Ecclesiastes alongside the prophetic books?"},[{"he": "המגוון מלמד שהמקרא מכיל שיח פנימי של עמדות", "ar": "التنوع يعلّم أن التوراة تحوي حوارًا داخليًا للمواقف", "ru": "Разнообразие учит, что Писание содержит внутренний диалог позиций", "en": "The variety teaches that the Bible contains an inner dialogue of positions"},{"he": "מוכיח שרק אחד מהספרים צודק", "ar": "يثبت أن كتابًا واحدًا فقط محق", "ru": "Доказывает, что только одна из книг права", "en": "Proves that only one of the books is right"},{"he": "מראה שהספרים נכתבו בטעות", "ar": "يُظهر أن الكتب كُتبت خطأ", "ru": "Показывает, что книги написаны по ошибке", "en": "Shows the books were written by mistake"},{"he": "אין רווח; עדיף ספר אחד", "ar": "لا فائدة؛ كتاب واحد أفضل", "ru": "Пользы нет; лучше одна книга", "en": "No gain; one book is better"}],0,{"he": "חשבו מה קורה כששתי עמדות נפגשות.", "ar": "فكّروا ماذا يحدث حين يلتقي موقفان.", "ru": "Подумайте, что происходит, когда встречаются две позиции.", "en": "Think about what happens when two positions meet."},{"he": "קהלת אומר 'אין כל חדש', והנביאים קוראים לשינוי דחוף. דוגמה: קריאה משותפת מגלה שכל ספר מתמודד עם שאלה דומה מזווית אחרת - והקורא מרוויח תמונה רב ממדית במקום קול יחיד.", "ar": "الجامعة يقول «لا جديد»، والأنبياء يدعون إلى تغيير عاجل. مثال: القراءة المشتركة تكشف أن كل كتاب يعالج سؤالًا مشابهًا من زاوية أخرى - والقارئ يربح صورة متعددة الأبعاد بدل صوت واحد.", "ru": "Экклезиаст говорит «нет ничего нового», а пророки зовут к срочной перемене. Пример: совместное чтение раскрывает, что каждая книга отвечает на похожий вопрос с иного угла, - и читатель получает объёмную картину вместо одного голоса.", "en": "Ecclesiastes says \"nothing new\", while the prophets call for urgent change. Example: reading them together reveals that each book tackles a similar question from another angle - and the reader gains a multidimensional picture instead of a single voice."},null,[null,{"he": "הקריאה אינה תחרות; היא מחפשת הבנה, לא מנצח.", "ar": "القراءة ليست منافسة؛ تبحث عن فهم لا عن فائز.", "ru": "Чтение не соревнование; оно ищет понимания, а не победителя.", "en": "The reading is not a contest; it seeks understanding, not a winner."},{"he": "המגוון מכוון במסורת העריכה; הוא חלק מטיב הקנון.", "ar": "التنوع مقصود في التقليد التحريري؛ هو جزء من طبيعة القانون.", "ru": "Разнообразие намеренно в редакционной традиции; оно часть природы канона.", "en": "The variety is deliberate in the editorial tradition; it is part of the canon's nature."},{"he": "השיח בין הספרים הוא עצם הרווח; ביטולו מפסיד אותו.", "ar": "الحوار بين الكتب هو الفائدة ذاتها؛ إلغاؤه يضيّعها.", "ru": "Диалог между книгами и есть польза; его отмена теряет её.", "en": "The dialogue between the books is the very gain; cancelling it loses it."}]),Q("bib-choice62-method",{"he": "תלמיד משווה שני סיפורים וכותב רק 'הם דומים'. מה חסר בעבודתו?", "ar": "طالب يقارن قصتين ويكتب فقط «هما متشابهتان». ما الناقص في عمله؟", "ru": "Ученик сравнивает две истории и пишет только «они похожи». Чего не хватает в его работе?", "en": "A student compares two stories and writes only \"they are similar\". What is missing in his work?"},[{"he": "הבדלים מפורטים ומבוססים בציטוטים, ומסקנה: מה כל סיפור מדגיש באמצעותם", "ar": "فروق مفصلة مؤسسة على اقتباسات، وخلاصة: ماذا تؤكد كل قصة من خلالها", "ru": "Подробные различия, обоснованные цитатами, и вывод: что каждая история подчёркивает с их помощью", "en": "Detailed differences grounded in quotations, and a conclusion: what each story stresses through them"},{"he": "שום דבר לא חסר בעבודתו; לכתוב בסך הכל שהסיפורים דומים זה מספיק לחלוטין למטרה", "ar": "لا ينقص عمله شيء؛ كتابة أن القصتين متشابهتان تكفي تمامًا لهذا الغرض", "ru": "В его работе ничего не недостаёт; написать просто, что истории похожи, вполне достаточно для цели", "en": "Nothing is missing in his work; simply writing that the stories are similar is quite enough for the purpose"},{"he": "שהיה צריך לכתוב ארוך יותר", "ar": "كان عليه الكتابة أطول فقط", "ru": "Ему следовало просто писать длиннее", "en": "He should simply have written longer"},{"he": "שהשוואה אינה מותרת במקרא", "ar": "أن المقارنة غير مسموحة في التوراة", "ru": "Что сравнение не разрешено в Писании", "en": "That comparison is not allowed in the Bible"}],0,{"he": "מה ההבדל בין טענה לבין עבודת השוואה?", "ar": "ما الفرق بين ادعاء وبين عمل مقارنة؟", "ru": "В чём разница между утверждением и работой сравнения?", "en": "What is the difference between a claim and comparison work?"},{"he": "כתיבת 'דומים' היא טענה בלי ראיות. דוגמה לעבודה מלאה: שני סיפורי הצלה דומים - אך באחד הגיבור פועל בשקט ובשני בגלוי, וההבדל הזה משנה את המסר. הציטוטים הם הבסיס למסקנה.", "ar": "كتابة «متشابهتان» ادعاء بلا أدلة. مثال لعمل كامل: قصتا إنقاذ متشابهتان - لكن في إحداهما يعمل البطل بصمت وفي الأخرى علنًا، وهذا الفرق يغيّر الرسالة. الاقتباسات أساس الخلاصة.", "ru": "Написать «похожи» - утверждение без свидетельств. Пример полной работы: две похожие истории спасения, - но в одной герой действует тихо, а в другой открыто, и это различие меняет послание. Цитаты - основа вывода.", "en": "Writing \"similar\" is a claim without evidence. Example of full work: two similar rescue stories, but in one the hero acts quietly and in the other openly, and that difference changes the message. The quotations ground the conclusion."},null,[null,{"he": "טענה כללית אינה מספיקה בעבודה ביקורתית; נדרש בסיס מן הטקסט.", "ar": "الادعاء العام لا يكفي في العمل النقدي؛ يلزم أساس من النص.", "ru": "Общего утверждения недостаточно в аналитической работе; нужна основа из текста.", "en": "A general claim does not suffice in analytical work; grounding from the text is required."},{"he": "האורך אינו המדד; הדיוק והבסיס הם המדד.", "ar": "الطول ليس المقياس؛ الدقة والأساس هما المقياس.", "ru": "Длина не мерило; точность и обоснованность - мерило.", "en": "Length is not the measure; precision and grounding are."},{"he": "השוואה היא כלי לימוד מקובל ומרכזי.", "ar": "المقارنة أداة تعلم مقبولة ومركزية.", "ru": "Сравнение - принятый и центральный учебный инструмент.", "en": "Comparison is an accepted and central learning tool."}])]]);

  return state.item[id];
}

/* בחירת פריט לתרגול. משקל גבוה לחדש, בינוני לנכשל, נמוך לנשלט. */
function chooseIndex(tid,lv,pool,avoid){
  var cand=[],i,w;
  for(i=0;i<pool.length;i++){
    if(avoid!==undefined&&i===avoid&&pool.length>1)continue;
    var r=state.item[itemId(tid,lv,i)];
    if(!r||!r.n)w=6;                            /* חדש */
    else if(r.ok<r.n)w=1+Math.min(4,r.n-r.ok);  /* נכשל בעבר */
    else w=1;                                   /* נשלט */
    for(var j=0;j<w;j++)cand.push(i);
  }
  if(!cand.length)return 0;
  return pick(cand);
}
/* בחירת פריט למבחן. אחידה, ואינה נוגעת ב-state כלל. */
function pureIndex(pool,avoid){
  var cand=[],i;
  for(i=0;i<pool.length;i++){
    if(avoid!==undefined&&i===avoid&&pool.length>1)continue;
    cand.push(i);
  }
  return cand.length?pick(cand):0;
}


/* ------------------------------------------------------------
   ניקוי להקראה בלבד. המסך אינו משתנה ממנו.

   הגרשיים העבריים משמשים לשני דברים: ראשי תיבות (חוק־יסוד,
   בג״ץ) ומירכאות (״מדינה יהודית״). המנוע מכיר רק את הראשון.
   הכלל שמפריד: בראשי תיבות באה אחרי הגרשיים אות עברית אחת
   בדיוק וסוף מילה. הסיכון א־סימטרי — מירכאה שהוסרה אינה
   יכולה להזיק, מירכאה שנשארה כן.

   המירכאות המסולסלות (“ ”) משמשות כאן לציטוט מונחים בלבד,
   ולכן הן נופלות תמיד. הקו המפריד הופך לפסיק, כדי שהקול
   ייעצר במקום לרוץ הלאה.
   ------------------------------------------------------------ */
function saySpell(x){
  return String(x==null?"":x)
    .replace(/[“”‘’]/g,"")
    .replace(/״/g,function(m,i,str){
      return /^[א-ת](?![א-ת])/.test(str.slice(i+1))?m:"";
    })
    .replace(/\s—\s/g,", ");
}

function O(html,ok,why){return {h:html,ok:!!ok,why:why||""}}

/* בונה שאלה מפריט אחד. סדר האפשרויות מעורבב בכל בנייה, ולכן
   האינדקס ok שבתוכן אינו מגיע למסך לעולם. */
function buildFromItem(it){
  var opts=it.o.map(function(o,i){return O(esc(gl(o)),i===it.ok,it.wrong&&it.wrong[i]?gl(it.wrong[i]):"")});
  var ans=gl(it.o[it.ok]);
  return {
    type:"mcq",
    prompt:t("qPick"),
    lead:gl(it.q),
    fig:figHtml(it.fig),
    opts:shuffle(opts),
    answer:ans,
    /* מה שנאמר אחרי המענה: השאלה, התשובה הנכונה, וההסבר.
       תשובה בלי ההסבר נשמעת כמו עובדה לשינון, וזה בדיוק מה
       שהאפליקציה הזאת קיימת כדי להחליף. */
    say:gl(it.q)+" "+ans+". "+gl(it.ex),
    reveal:it
  };
}
function buildQuestion(tid,lv,avoid,pure){
  var tp=topicOf(tid); if(!tp)return null;
  var pool=poolOf(tp,lv);
  if(!pool.length)return null;
  var idx=pure?pureIndex(pool,avoid):chooseIndex(tid,lv,pool,avoid);
  var it=pool[idx];
  if(!it)return null;
  var q=buildFromItem(it);
  q.tid=tid; q.lv=lv; q.idx=idx; q.id=itemId(tid,lv,idx);
  q.hint=gl(it.hint);
  return q;
}
