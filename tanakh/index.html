  {"he": "נושאי בחירה: קריאה בין ספרים", "ar": "موضوعات الاختيار: قراءة بين الأسفار", "ru": "Темы по выбору: сопоставление книг", "en": "Choice topics: reading across books"},
  {"he": "דוגמאות בלבד: התאימו לרשימת הבחירה העדכנית בבית הספר", "ar": "أمثلة فقط: طابقوها مع قائمة المدرسة الحالية", "ru": "Лишь примеры: сверьте со списком школы", "en": "Examples only: check the school’s current selection"},
[ [
  Q("bib-choice-1262-1",{"he": "איזה תיאור מתאים להשוואת סיפורים?", "ar": "أي وصف يناسب مقارنة القصص؟", "ru": "Какое описание подходит к «Сопоставление рассказов»?", "en": "Which description fits comparing stories?"},[{"he": "בחינת אירועים דומים בשני סיפורים וזיהוי פרט ששונה ומשנה פירוש.", "ar": "فحص أحداث متشابهة في قصتين وتحديد فرق يغيّر الفهم.", "ru": "Сравнение похожих событий двух рассказов и значимой детали различия.", "en": "Examining similar events in two accounts and a difference that changes their meaning."},{"he": "אמירה נבואית המצביעה על מעשה פסול ודורשת שינוי בחברה.", "ar": "قول نبوي يبيّن فعلًا خاطئًا ويطالب بتغيير اجتماعي.", "ru": "Пророческая речь указывает на проступок и требует перемен в обществе.", "en": "Prophetic speech names wrongdoing and calls for social change."},{"he": "החלת כלל מן הכתוב על מצב מסוים, תוך בדיקה של תנאיו.", "ar": "تطبيق قاعدة من النص على حالة محددة مع فحص شروطها.", "ru": "Применение текстового правила к случаю с проверкой условий.", "en": "Applying a textual rule to a specific case while checking its conditions."},{"he": "תגובה של דמות או מספר המעמידה לצד עמדה אחת נקודת מבט נוספת.", "ar": "رد شخصية أو راوٍ يضع منظورًا آخر بجانب موقف معين.", "ru": "Ответ героя или рассказчика, дающий иную точку зрения рядом с первой.", "en": "A character’s or narrator’s response offering another viewpoint beside the first."}],0,{"he": "חפשו את הפרט שמבדיל אותו מן האחרים.", "ar": "ابحثوا عن التفصيل الذي يميزه عن غيره.", "ru": "Ищите отличие от остальных вариантов.", "en": "Look for the detail that separates it from the others."},{"he": "השוואה צריכה לכלול דמיון וגם הבדל מבוסס בטקסט.", "ar": "تحتاج المقارنة إلى شبه واختلاف تدعمهما النصوص.", "ru": "Сравнение требует сходства и подтверждённого текстом различия.", "en": "A comparison needs both a similarity and a text-based difference."},null,[null,{"he": "זה מתאר את נבואה וביקורת, לא את השוואת סיפורים.", "ar": "هذا يصف النبوة والنقد، لا مقارنة القصص.", "ru": "Это описание «Пророчество и критика», а не «Сопоставление рассказов».", "en": "That describes prophecy and critique, not comparing stories."},{"he": "זה מתאר את חוק ומקרה, לא את השוואת סיפורים.", "ar": "هذا يصف قانون وحالة، لا مقارنة القصص.", "ru": "Это описание «Закон и случай», а не «Сопоставление рассказов».", "en": "That describes law and case, not comparing stories."},{"he": "זה מתאר את קול אחר במקרא, לא את השוואת סיפורים.", "ar": "هذا يصف صوت آخر في النص، لا مقارنة القصص.", "ru": "Это описание «Другой голос в тексте», а не «Сопоставление рассказов».", "en": "That describes another voice in the text, not comparing stories."}]),
  Q("bib-choice-1262-2",{"he": "איזה תיאור מתאים לנבואה וביקורת?", "ar": "أي وصف يناسب النبوة والنقد؟", "ru": "Какое описание подходит к «Пророчество и критика»?", "en": "Which description fits prophecy and critique?"},[{"he": "בחינת אירועים דומים בשני סיפורים וזיהוי פרט ששונה ומשנה פירוש.", "ar": "فحص أحداث متشابهة في قصتين وتحديد فرق يغيّر الفهم.", "ru": "Сравнение похожих событий двух рассказов и значимой детали различия.", "en": "Examining similar events in two accounts and a difference that changes their meaning."},{"he": "אמירה נבואית המצביעה על מעשה פסול ודורשת שינוי בחברה.", "ar": "قول نبوي يبيّن فعلًا خاطئًا ويطالب بتغيير اجتماعي.", "ru": "Пророческая речь указывает на проступок и требует перемен в обществе.", "en": "Prophetic speech names wrongdoing and calls for social change."},{"he": "החלת כלל מן הכתוב על מצב מסוים, תוך בדיקה של תנאיו.", "ar": "تطبيق قاعدة من النص على حالة محددة مع فحص شروطها.", "ru": "Применение текстового правила к случаю с проверкой условий.", "en": "Applying a textual rule to a specific case while checking its conditions."},{"he": "תגובה של דמות או מספר המעמידה לצד עמדה אחת נקודת מבט נוספת.", "ar": "رد شخصية أو راوٍ يضع منظورًا آخر بجانب موقف معين.", "ru": "Ответ героя или рассказчика, дающий иную точку зрения рядом с первой.", "en": "A character’s or narrator’s response offering another viewpoint beside the first."}],1,{"he": "חפשו את הפרט שמבדיל אותו מן האחרים.", "ar": "ابحثوا عن التفصيل الذي يميزه عن غيره.", "ru": "Ищите отличие от остальных вариантов.", "en": "Look for the detail that separates it from the others."},{"he": "בדקו כלפי מי מופנית הביקורת ומה השינוי שנדרש.", "ar": "افحصوا إلى من يوجّه النقد وما التغيير المطلوب.", "ru": "Уточните адресата критики и требуемую перемену.", "en": "Ask whom the critique addresses and what change it demands."},null,[{"he": "זה מתאר את השוואת סיפורים, לא את נבואה וביקורת.", "ar": "هذا يصف مقارنة القصص، لا النبوة والنقد.", "ru": "Это описание «Сопоставление рассказов», а не «Пророчество и критика».", "en": "That describes comparing stories, not prophecy and critique."},null,{"he": "זה מתאר את חוק ומקרה, לא את נבואה וביקורת.", "ar": "هذا يصف قانون وحالة، لا النبوة والنقد.", "ru": "Это описание «Закон и случай», а не «Пророчество и критика».", "en": "That describes law and case, not prophecy and critique."},{"he": "זה מתאר את קול אחר במקרא, לא את נבואה וביקורת.", "ar": "هذا يصف صوت آخر في النص، لا النبوة والنقد.", "ru": "Это описание «Другой голос в тексте», а не «Пророчество и критика».", "en": "That describes another voice in the text, not prophecy and critique."}])
 ,Q("bib-choice62-compare",{"he": "מהו הצעד הראשון בהשוואה בין שני סיפורים מקראיים דומים?", "ar": "ما الخطوة الأولى في مقارنة قصتين توراتيتين متشابهتين؟", "ru": "Каков первый шаг в сравнении двух похожих библейских историй?", "en": "What is the first step in comparing two similar biblical stories?"},[{"he": "למפות מה משותף ומה שונה בכל סיפור בנפרד, ורק אז להסיק", "ar": "رسم ما هو مشترك وما هو مختلف في كل قصة على حدة، ثم الاستنتاج", "ru": "Отметить, что общего и что различно в каждой истории отдельно, и только затем выводить", "en": "Map what is shared and what differs in each story separately, and only then infer"},{"he": "להחליט מראש שהם זהים", "ar": "الحكم مسبقًا أنهما متماثلتان", "ru": "Заранее решить, что они тождественны", "en": "Decide in advance they are identical"},{"he": "לבחור את הסיפור הארוך יותר", "ar": "اختيار القصة الأطول", "ru": "Выбрать более длинную историю", "en": "Pick the longer story"},{"he": "לדלג על הקריאה ולשאול אחרים", "ar": "تجاوز القراءة وسؤال الآخرين", "ru": "Пропустить чтение и спросить других", "en": "Skip reading and ask others"}],0,{"he": "השוואה מתחילה בסימון, לא במסקנה.", "ar": "المقارنة تبدأ بالتعليم لا بالخلاصة.", "ru": "Сравнение начинается с отметок, а не с вывода.", "en": "Comparison starts with marking, not with a conclusion."},{"he": "שיטת ההשוואה עובדת בשלבים: קודם טבלה של מרכיבים (דמויות, מקום, מפנה, סוף) לכל סיפור. דוגמה: סיפורי יציאה דומים חוזרים במקרא, ורק מיפוי מדויק חושף מה כל אחד מדגיש.", "ar": "طريقة المقارنة تعمل بمراحل: أولًا جدول عناصر (شخصيات، مكان، تحول، نهاية) لكل قصة. مثال: قصص الخروج المتشابهة تتكرر في التوراة، وفقط رسم دقيق يكشف ما يؤكده كل منها.", "ru": "Метод сравнения работает по этапам: сначала таблица элементов (персонажи, место, перелом, конец) для каждой истории. Пример: похожие истории исхода повторяются в Писании, и только точная разметка раскрывает, что подчёркивает каждая.", "en": "The comparison method works in stages: first a table of elements (characters, place, turning point, ending) for each story. Example: similar exodus stories repeat in the Bible, and only precise mapping reveals what each one stresses."},null,[null,{"he": "דמיון כללי מסתיר את ההבדלים המשמעותיים שההשוואה באה לחשוף.", "ar": "التشابه العام يحجب الفروق المهمة التي جاءت المقارنة لتكشفها.", "ru": "Общее сходство скрывает значимые различия, которые сравнение призвано раскрыть.", "en": "General similarity hides the significant differences the comparison comes to reveal."},{"he": "אורך אינו קריטריון; תוכן ומבנה הם הבסיס.", "ar": "الطول ليس معيارًا؛ المضمون والبنية هما الأساس.", "ru": "Длина не критерий; содержание и структура - основа.", "en": "Length is not a criterion; content and structure are the basis."},{"he": "דילוג מונע בדיקה עצמית שהיא לב המיומנות.", "ar": "التجاوز يمنع الفحص الذاتي الذي هو لب المهارة.", "ru": "Пропуск отменяет самостоятельную проверку, которая есть ядро навыка.", "en": "Skipping prevents the independent examination that is the core of the skill."}]),
  Q("ch62-1-01",{"he": "מאיזה עם הייתה רות?", "ar": "من أي شعب كانت راعوث؟", "ru": "Из какого народа была Руфь?", "en": "Which people did Ruth come from?"},[{"he": "מאדום", "ar": "من أدوم", "ru": "Из Едома", "en": "From Edom"}, {"he": "ממואב", "ar": "من موآب", "ru": "Из Моава", "en": "From Moab"}, {"he": "מפלשת", "ar": "من فلسطيا", "ru": "Из Филистии", "en": "From Philistia"}, {"he": "ממצרים", "ar": "من مصر", "ru": "Из Египта", "en": "From Egypt"}],1,{"he": "לשם עברה משפחתה של נעמי בזמן הרעב.", "ar": "إلى هناك انتقلت عائلة نُعمي وقت المجاعة.", "ru": "Туда переселилась семья Ноемини во время голода.", "en": "Naomi's family moved there during the famine."},{"he": "בזמן רעב עוברת משפחת נעמי לשדות מואב. שם נושא אחד הבנים את רות. לכן המגילה קוראת לה ״רות המואבייה״.", "ar": "وقت المجاعة تنتقل عائلة نُعمي إلى بلاد موآب. هناك يتزوج أحد الابنين راعوث. لذلك يسمّيها السفر «راعوث الموآبية».", "ru": "Во время голода семья Ноемини переселяется в поля Моава. Там один из сыновей женится на Руфи. Поэтому книга называет её «Руфь-моавитянка».", "en": "During a famine Naomi's family moves to the fields of Moab. There one son marries Ruth. So the book calls her 'Ruth the Moabite'."},null,[{"he": "במגילה רות נקראת ״המואבייה״, לא אדומית.", "ar": "في السفر تُسمّى راعوث «الموآبية»، لا الأدومية.", "ru": "В книге Руфь названа «моавитянкой», а не идумеянкой.", "en": "In the book Ruth is called 'the Moabite', not an Edomite."}, null, {"he": "הפלשתים אינם מופיעים במגילת רות.", "ar": "الفلسطينيون لا يظهرون في سفر راعوث.", "ru": "Филистимляне не появляются в книге Руфь.", "en": "The Philistines do not appear in the Book of Ruth."}, {"he": "נעמי ומשפחתה עברו למואב, לא למצרים.", "ar": "نُعمي وعائلتها انتقلوا إلى موآب، لا إلى مصر.", "ru": "Ноеминь и её семья переселились в Моав, а не в Египет.", "en": "Naomi's family moved to Moab, not to Egypt."}]),
  Q("ch62-1-02",{"he": "לאיזו עיר נשלח יונה להזהיר את תושביה?", "ar": "إلى أي مدينة أُرسل يونان لينذر أهلها؟", "ru": "В какой город Иона был послан предостеречь жителей?", "en": "Which city was Jonah sent to warn?"},[{"he": "לנינוה", "ar": "إلى نينوى", "ru": "В Ниневию", "en": "To Nineveh"}, {"he": "לתרשיש", "ar": "إلى ترشيش", "ru": "В Фарсис", "en": "To Tarshish"}, {"he": "לירושלים", "ar": "إلى أورشليم", "ru": "В Иерусалим", "en": "To Jerusalem"}, {"he": "לבבל", "ar": "إلى بابل", "ru": "В Вавилон", "en": "To Babylon"}],0,{"he": "העיר מתוארת בספר כ״העיר הגדולה״.", "ar": "تُوصف المدينة في السفر بأنها «المدينة العظيمة».", "ru": "В книге город назван «великим городом».", "en": "The book calls it 'the great city'."},{"he": "ה׳ שולח את יונה לנינוה, העיר הגדולה. יונה בורח באונייה לכיוון תרשיש. רק אחרי הסערה והדג הוא הולך לנינוה.", "ar": "يرسل الرب يونان إلى نينوى، المدينة العظيمة. يهرب يونان في سفينة نحو ترشيش. وبعد العاصفة والحوت فقط يذهب إلى نينوى.", "ru": "Господь посылает Иону в Ниневию, великий город. Иона бежит на корабле в сторону Фарсиса. Лишь после бури и рыбы он идёт в Ниневию.", "en": "The LORD sends Jonah to Nineveh, the great city. Jonah flees by ship toward Tarshish. Only after the storm and the fish does he go to Nineveh."},null,[null, {"he": "לתרשיש יונה ניסה לברוח, ולא נשלח אליה.", "ar": "إلى ترشيش حاول يونان الهرب، ولم يُرسل إليها.", "ru": "В Фарсис Иона пытался бежать, туда его не посылали.", "en": "Jonah tried to flee to Tarshish; he was not sent there."}, {"he": "ספר יונה אינו עוסק בירושלים. העיר בספר היא עיר נוכרית.", "ar": "سفر يونان لا يتناول أورشليم، فالمدينة فيه مدينة أجنبية.", "ru": "Книга Ионы не о Иерусалиме: город в ней чужеземный.", "en": "The Book of Jonah is not about Jerusalem; its city is foreign."}, {"he": "בבל אינה מוזכרת בספר יונה.", "ar": "بابل غير مذكورة في سفر يونان.", "ru": "Вавилон не упоминается в книге Ионы.", "en": "Babylon is not mentioned in the Book of Jonah."}]),
  Q("ch62-1-03",{"he": "על איזה הר נאבק אליהו בנביאי הבעל, לפי מלכים א׳ י״ח?", "ar": "على أي جبل واجه إيليا أنبياء البعل، بحسب الملوك الأول 18؟", "ru": "На какой горе Илия противостоял пророкам Ваала, согласно 3 Царств 18?", "en": "On which mountain did Elijah face the prophets of Baal, in 1 Kings 18?"},[{"he": "הר תבור", "ar": "جبل طابور", "ru": "Гора Фавор", "en": "Mount Tabor"}, {"he": "הר נבו", "ar": "جبل نبو", "ru": "Гора Нево", "en": "Mount Nebo"}, {"he": "הר הכרמל", "ar": "جبل الكرمل", "ru": "Гора Кармил", "en": "Mount Carmel"}, {"he": "הר הגלבוע", "ar": "جبل جلبوع", "ru": "Гора Гелвуй", "en": "Mount Gilboa"}],2,{"he": "ההר נמצא ליד הים, בצפון הארץ.", "ar": "الجبل قريب من البحر، في شمال البلاد.", "ru": "Эта гора у моря, на севере страны.", "en": "The mountain is near the sea, in the north of the land."},{"he": "אליהו מכנס את העם ואת נביאי הבעל אל הר הכרמל. שם הוא מציע מבחן: על איזה מזבח תרד אש. לפי הסיפור, האש יורדת על המזבח של אליהו.", "ar": "يجمع إيليا الشعب وأنبياء البعل إلى جبل الكرمل. هناك يقترح امتحانًا: على أي مذبح تنزل النار. وبحسب القصة، تنزل النار على مذبح إيليا.", "ru": "Илия собирает народ и пророков Ваала на гору Кармил. Там он предлагает испытание: на какой жертвенник сойдёт огонь. По рассказу, огонь сходит на жертвенник Илии.", "en": "Elijah gathers the people and Baal's prophets on Mount Carmel. There he proposes a test: on which altar fire will fall. In the story, fire falls on Elijah's altar."},null,[{"he": "הר תבור קשור לסיפור דבורה וברק, לא לאליהו.", "ar": "جبل طابور مرتبط بقصة دبورة وباراق، لا بإيليا.", "ru": "Гора Фавор связана с Деворой и Вараком, а не с Илией.", "en": "Mount Tabor is linked to Deborah and Barak, not Elijah."}, {"he": "מהר נבו ראה משה את הארץ לפני מותו.", "ar": "من جبل نبو رأى موسى الأرض قبل موته.", "ru": "С горы Нево Моисей увидел землю перед смертью.", "en": "From Mount Nebo Moses saw the land before he died."}, null, {"he": "על הר הגלבוע נפלו שאול ובניו בקרב.", "ar": "على جبل جلبوع سقط شاول وبنوه في المعركة.", "ru": "На горе Гелвуй пали в бою Саул и его сыновья.", "en": "On Mount Gilboa Saul and his sons fell in battle."}]),
  Q("ch62-1-04",{"he": "כמה רעים באו לנחם את איוב בתחילת הספר?", "ar": "كم صديقًا جاء ليعزّي أيوب في بداية السفر؟", "ru": "Сколько друзей пришли утешить Иова в начале книги?", "en": "How many friends came to comfort Job at the start of the book?"},[{"he": "שניים", "ar": "اثنان", "ru": "Двое", "en": "Two"}, {"he": "שלושה", "ar": "ثلاثة", "ru": "Трое", "en": "Three"}, {"he": "ארבעה", "ar": "أربعة", "ru": "Четверо", "en": "Four"}, {"he": "שבעה", "ar": "سبعة", "ru": "Семеро", "en": "Seven"}],1,{"he": "מנו את השמות שמופיעים בפרק ב׳.", "ar": "عدّوا الأسماء التي تظهر في الفصل 2.", "ru": "Сосчитайте имена в главе 2.", "en": "Count the names that appear in chapter 2."},{"he": "בפרק ב׳ באים אליפז התימני, בלדד השוחי וצופר הנעמתי. הם יושבים עם איוב שבעה ימים בשתיקה. אחר כך כל אחד מהם מדבר.", "ar": "في الفصل 2 يأتي أليفاز التيماني وبلدد الشوحي وصوفر النعماتي. يجلسون مع أيوب سبعة أيام صامتين. ثم يتكلم كل واحد منهم.", "ru": "В главе 2 приходят Елифаз Феманитянин, Вилдад Савхеянин и Софар Наамитянин. Семь дней они молча сидят с Иовом. Потом каждый из них говорит.", "en": "In chapter 2 Eliphaz the Temanite, Bildad the Shuhite and Zophar the Naamathite come. They sit with Job seven days in silence. Then each of them speaks."},null,[{"he": "באים שלושה: אליפז, בלדד וצופר.", "ar": "جاء ثلاثة: أليفاز وبلدد وصوفر.", "ru": "Пришли трое: Елифаз, Вилдад и Софар.", "en": "Three come: Eliphaz, Bildad and Zophar."}, null, {"he": "אליהוא מופיע רק מאוחר יותר. בהתחלה באים שלושה.", "ar": "أليهو يظهر لاحقًا فقط، وفي البداية جاء ثلاثة.", "ru": "Элиуй появляется только позже; вначале пришли трое.", "en": "Elihu appears only later; at the start three come."}, {"he": "שבעה הוא מספר הימים שבהם ישבו בשתיקה, לא מספר הרעים.", "ar": "سبعة هو عدد الأيام التي جلسوا فيها صامتين، لا عدد الأصدقاء.", "ru": "Семь — это число дней, когда они сидели молча, а не число друзей.", "en": "Seven is the number of days they sat silent, not the number of friends."}]),
  Q("ch62-1-05",{"he": "מאיזה שבט היה שאול, המלך הראשון?", "ar": "من أي سبط كان شاول، الملك الأول؟", "ru": "Из какого колена был Саул, первый царь?", "en": "Which tribe was Saul, the first king, from?"},[{"he": "משבט יהודה", "ar": "من سبط يهوذا", "ru": "Из колена Иуды", "en": "From the tribe of Judah"}, {"he": "משבט לוי", "ar": "من سبط لاوي", "ru": "Из колена Левия", "en": "From the tribe of Levi"}, {"he": "משבט אפרים", "ar": "من سبط أفرايم", "ru": "Из колена Ефрема", "en": "From the tribe of Ephraim"}, {"he": "משבט בנימין", "ar": "من سبط بنيامين", "ru": "Из колена Вениамина", "en": "From the tribe of Benjamin"}],3,{"he": "זה השבט הקטן ביותר, ושאול עצמו מזכיר זאת.", "ar": "إنه أصغر الأسباط، وشاول نفسه يذكر ذلك.", "ru": "Это самое малое колено, и Саул сам об этом говорит.", "en": "It is the smallest tribe, and Saul says so himself."},{"he": "שאול הוא בנו של קיש, איש מבנימין. כששמואל פונה אליו, שאול אומר שהוא מן השבט הקטן בישראל. דוד, המלך שבא אחריו, הוא משבט יהודה.", "ar": "شاول هو ابن قيس، رجل من بنيامين. عندما يخاطبه صموئيل يقول شاول إنه من أصغر أسباط إسرائيل. وداود، الملك الذي بعده، من سبط يهوذا.", "ru": "Саул — сын Киса из колена Вениамина. Когда Самуил обращается к нему, Саул говорит, что он из меньшего колена Израиля. Давид, следующий царь, — из колена Иуды.", "en": "Saul is the son of Kish, a Benjaminite. When Samuel speaks to him, Saul says he is from the smallest tribe. David, the next king, is from Judah."},null,[{"he": "משבט יהודה בא דוד, לא שאול.", "ar": "من سبط يهوذا جاء داود، لا شاول.", "ru": "Из колена Иуды происходил Давид, а не Саул.", "en": "David came from Judah, not Saul."}, {"he": "שבט לוי משרת בקודש. שאול אינו לוי.", "ar": "سبط لاوي يخدم في القدس، وشاول ليس لاويًّا.", "ru": "Колено Левия служит при святилище; Саул не левит.", "en": "The tribe of Levi serves in the sanctuary; Saul is not a Levite."}, {"he": "אביו של שאול, קיש, הוא איש מבנימין.", "ar": "أبو شاول، قيس، رجل من بنيامين.", "ru": "Отец Саула, Кис, был из Вениамина.", "en": "Saul's father, Kish, is a man of Benjamin."}, null]),
  Q("ch62-1-06",{"he": "מי גידל את אסתר אחרי מות הוריה?", "ar": "من ربّى أستير بعد موت والديها؟", "ru": "Кто воспитал Есфирь после смерти её родителей?", "en": "Who raised Esther after her parents died?"},[{"he": "מרדכי", "ar": "مردخاي", "ru": "Мардохей", "en": "Mordecai"}, {"he": "הגי", "ar": "هيجاي", "ru": "Гегай", "en": "Hegai"}, {"he": "המן", "ar": "هامان", "ru": "Аман", "en": "Haman"}, {"he": "אחשוורוש", "ar": "أحشويروش", "ru": "Ахашверош", "en": "Ahasuerus"}],0,{"he": "הוא קרוב משפחה שלה, ויושב בשער המלך.", "ar": "إنه قريبها، ويجلس عند باب الملك.", "ru": "Это её родственник, он сидит у царских ворот.", "en": "He is her relative and sits at the king's gate."},{"he": "מרדכי הוא בן דודה של אסתר. כשהוריה מתו, הוא לקח אותה לבת. לאורך המגילה הוא מייעץ לה ומעודד אותה לפעול.", "ar": "مردخاي هو ابن عمّ أستير. عندما مات والداها أخذها ابنة له. وطوال السفر ينصحها ويشجعها على العمل.", "ru": "Мардохей — двоюродный брат Есфири. Когда её родители умерли, он взял её к себе как дочь. На протяжении книги он советует ей и побуждает действовать.", "en": "Mordecai is Esther's cousin. When her parents died, he took her as a daughter. Throughout the book he advises her and urges her to act."},null,[null, {"he": "הגי שמר על הנשים בבית המלך. הוא לא גידל את אסתר.", "ar": "هيجاي كان حارس النساء في بيت الملك، ولم يربِّ أستير.", "ru": "Гегай был стражем женщин в доме царя, он не воспитывал Есфирь.", "en": "Hegai kept the women in the king's house; he did not raise Esther."}, {"he": "המן הוא האויב שרוצה להשמיד את היהודים.", "ar": "هامان هو العدو الذي يريد إبادة اليهود.", "ru": "Аман — враг, который хочет уничтожить иудеев.", "en": "Haman is the enemy who wants to destroy the Jews."}, {"he": "אחשוורוש הוא המלך שבחר באסתר למלכה.", "ar": "أحشويروش هو الملك الذي اختار أستير ملكة.", "ru": "Ахашверош — царь, который выбрал Есфирь в царицы.", "en": "Ahasuerus is the king who chose Esther as queen."}])],
 [
  Q("bib-choice-1262-3",{"he": "איזה תיאור מתאים לחוק ומקרה?", "ar": "أي وصف يناسب قانون وحالة؟", "ru": "Какое описание подходит к «Закон и случай»?", "en": "Which description fits law and case?"},[{"he": "בחינת אירועים דומים בשני סיפורים וזיהוי פרט ששונה ומשנה פירוש.", "ar": "فحص أحداث متشابهة في قصتين وتحديد فرق يغيّر الفهم.", "ru": "Сравнение похожих событий двух рассказов и значимой детали различия.", "en": "Examining similar events in two accounts and a difference that changes their meaning."},{"he": "אמירה נבואית המצביעה על מעשה פסול ודורשת שינוי בחברה.", "ar": "قول نبوي يبيّن فعلًا خاطئًا ويطالب بتغيير اجتماعي.", "ru": "Пророческая речь указывает на проступок и требует перемен в обществе.", "en": "Prophetic speech names wrongdoing and calls for social change."},{"he": "החלת כלל מן הכתוב על מצב מסוים, תוך בדיקה של תנאיו.", "ar": "تطبيق قاعدة من النص على حالة محددة مع فحص شروطها.", "ru": "Применение текстового правила к случаю с проверкой условий.", "en": "Applying a textual rule to a specific case while checking its conditions."},{"he": "תגובה של דמות או מספר המעמידה לצד עמדה אחת נקודת מבט נוספת.", "ar": "رد شخصية أو راوٍ يضع منظورًا آخر بجانب موقف معين.", "ru": "Ответ героя или рассказчика, дающий иную точку зрения рядом с первой.", "en": "A character’s or narrator’s response offering another viewpoint beside the first."}],2,{"he": "חפשו את הפרט שמבדיל אותו מן האחרים.", "ar": "ابحثوا عن التفصيل الذي يميزه عن غيره.", "ru": "Ищите отличие от остальных вариантов.", "en": "Look for the detail that separates it from the others."},{"he": "מילה קטנה בחוק יכולה להגביל למי ומתי הוא חל.", "ar": "قد تحدد كلمة صغيرة في القانون متى وعلى من ينطبق.", "ru": "Небольшое слово в законе может ограничить, к кому и когда он относится.", "en": "A small word in a law may limit whom and when it covers."},null,[{"he": "זה מתאר את השוואת סיפורים, לא את חוק ומקרה.", "ar": "هذا يصف مقارنة القصص، لا قانون وحالة.", "ru": "Это описание «Сопоставление рассказов», а не «Закон и случай».", "en": "That describes comparing stories, not law and case."},{"he": "זה מתאר את נבואה וביקורת, לא את חוק ומקרה.", "ar": "هذا يصف النبوة والنقد، لا قانون وحالة.", "ru": "Это описание «Пророчество и критика», а не «Закон и случай».", "en": "That describes prophecy and critique, not law and case."},null,{"he": "זה מתאר את קול אחר במקרא, לא את חוק ומקרה.", "ar": "هذا يصف صوت آخر في النص، لا قانون وحالة.", "ru": "Это описание «Другой голос в тексте», а не «Закон и случай».", "en": "That describes another voice in the text, not law and case."}])
 ,Q("bib-choice62-nathan",{"he": "כיצד מצליחה משל נתן (שמואל ב' י\"ב) להעביר ביקורת על דוד?", "ar": "كيف ينجح مثل ناثان (صموئيل الثاني 12) في تمرير نقد لداود؟", "ru": "Как удаётся притче Нафана (2 Царств 12) донести критику до Давида?", "en": "How does Nathan's parable (2 Samuel 12) succeed in delivering criticism to David?"},[{"he": "המשל גורם לדוד לשפוט מקרה אחר בכעס, ואז נחשף שהוא שפט את עצמו", "ar": "المثل يجعل داود يحكم بغضب على قضية أخرى، ثم ينكشف أنه حكم على نفسه", "ru": "Притча заставляет Давида гневно судить чужой случай, и затем выясняется, что он судил себя", "en": "The parable makes David angrily judge another case, and then it is exposed that he judged himself"},{"he": "נתן מאיים על דוד בחורב", "ar": "ناثان يهدد داود بالسيف", "ru": "Нафан угрожает Давиду мечом", "en": "Nathan threatens David with a sword"},{"he": "דוד מבין מיד בלי משל", "ar": "داود يفهم فورًا دون مثل", "ru": "Давид понимает сразу, без притчи", "en": "David understands at once, with no parable"},{"he": "המשל מסופר לעם ולא לדוד", "ar": "المثل يُروى للشعب لا لداود", "ru": "Притча рассказана народу, а не Давиду", "en": "The parable is told to the people, not to David"}],0,{"he": "עקבו מי שופט את מי במהלך הפרק.", "ar": "تتبّعوا مَن يحكم على مَن خلال الفصل.", "ru": "Проследите, кто судит кого на протяжении главы.", "en": "Track who judges whom through the chapter."},{"he": "נתן מספר על עשיר שלקח כבשת רש, ודוד כועס: 'בן מוות האיש'. אז בא 'אתה הגבר'. דוגמה: הביקורת עובדת כי דוד נוקט עמדה מוסרית לפני שהוא יודע שהיא עליו - כך המשל עוקף את ההגנות.", "ar": "يروي ناثان عن غني أخذ حَمَل الفقير، فيغضب داود: «ابن الموت ذلك الرجل». ثم يأتي «أنت هو الرجل». مثال: النقد ينجح لأن داود يتخذ موقفًا أخلاقيًا قبل أن يعرف أنه عنه - هكذا يتجاوز المثل الدفاعات.", "ru": "Нафан рассказывает о богаче, взявшем агницу бедняка, и Давид гневается: «смерти достоин этот человек». Затем звучит «ты - этот человек». Пример: критика работает, потому что Давид занимает нравственную позицию, не зная, что она о нём, - так притча обходит защиту.", "en": "Nathan tells of a rich man who took a poor man's lamb, and David is angry: \"that man deserves death\". Then comes \"you are the man\". Example: the criticism works because David takes a moral stand before knowing it is about him - so the parable bypasses his defenses."},null,[null,{"he": "אין איום פיזי; הכוח של המשל הוא מוסרי.", "ar": "لا تهديد جسدي؛ قوة المثل أخلاقية.", "ru": "Нет физической угрозы; сила притчи нравственная.", "en": "There is no physical threat; the parable's power is moral."},{"he": "דווקא המשל הוא שפותח את הדרך להכרה.", "ar": "المثل بالذات هو الذي يفتح الطريق إلى الإدراك.", "ru": "Именно притча открывает путь к признанию.", "en": "It is precisely the parable that opens the way to recognition."},{"he": "המשל מופנה ישירות אל דוד המלך.", "ar": "المثل موجه مباشرة إلى الملك داود.", "ru": "Притча обращена прямо к царю Давиду.", "en": "The parable is addressed directly to King David."}]),Q("bib-choice62-lawcase",{"he": "מהו עקרון 'חוק ומקרה' בלימוד מקרא?", "ar": "ما مبدأ «شريعة وحالة» في دراسة التوراة؟", "ru": "Что такое принцип «закон и случай» в изучении Писания?", "en": "What is the \"law and case\" principle in Bible study?"},[{"he": "בודקים כיצד חוק כללי מתממש במקרה סיפורי קונקרטי, ומה המתח ביניהם מלמד", "ar": "فحص كيف تتجسد شريعة عامة في حالة قصصية محددة، وماذا يعلّم التوتر بينهما", "ru": "Проверяют, как общий закон осуществляется в конкретном сюжетном случае, и чему учит напряжение между ними", "en": "Examine how a general law plays out in a concrete narrative case, and what the tension between them teaches"},{"he": "קוראים רק חוקים בלי סיפורים", "ar": "قراءة الشرائع فقط دون قصص", "ru": "Читают только законы без историй", "en": "Read only laws without stories"},{"he": "מחליפים את החוק במקרה", "ar": "استبدال الشريعة بالحالة", "ru": "Заменяют закон случаем", "en": "Replace the law with the case"},{"he": "כל מקרה מבטל את החוק", "ar": "كل حالة تلغي الشريعة", "ru": "Каждый случай отменяет закон", "en": "Every case cancels the law"}],0,{"he": "חשבו על חוק ככלל ועל סיפור כבחינה שלו.", "ar": "فكّروا في الشريعة كقاعدة وفي القصة كاختبار لها.", "ru": "Думайте о законе как правиле и об истории как его проверке.", "en": "Think of the law as a rule and of the story as its test."},{"he": "למשל חוק 'עין תחת עין' מול סיפור של פציעה בפועל. דוגמה: המקרה הסיפורי מכריע איך הכלל פועל במציאות - ולעיתים מחדד למה נכתב כך. המתח בין כלל למקרה הוא מקום הלמידה.", "ar": "مثلًا شريعة «عين بعين» مقابل قصة إصابة واقعية. مثال: الحالة القصصية تحسم كيف تعمل القاعدة في الواقع - وأحيانًا توضح لماذا كُتبت هكذا. التوتر بين القاعدة والحالة هو موضع التعلم.", "ru": "Например, закон «око за око» против истории реального увечья. Пример: сюжетный случай решает, как правило работает в реальности, - и порой уточняет, почему оно так записано. Напряжение между правилом и случаем - место обучения.", "en": "For example the law \"eye for an eye\" against a story of an actual injury. Example: the narrative case decides how the rule works in reality - and sometimes clarifies why it was written so. The tension between rule and case is the place of learning."},null,[null,{"he": "השיטה דורשת דווקא את שניהם יחד: כלל ומקרה.", "ar": "الطريقة تتطلب بالذات كليهما معًا: قاعدة وحالة.", "ru": "Метод требует как раз обоих вместе: правила и случая.", "en": "The method requires precisely both together: rule and case."},{"he": "המקרה בוחן את החוק, לא מחליף אותו.", "ar": "الحالة تختبر الشريعة لا تستبدلها.", "ru": "Случай проверяет закон, а не заменяет его.", "en": "The case tests the law, not replaces it."},{"he": "מקרה מאתגר מלמד על גבולות הכלל, לא מבטל אותו אוטומטית.", "ar": "حالة صعبة تعلّم عن حدود القاعدة لا تلغيها تلقائيًا.", "ru": "Сложный случай учит о границах правила, а не отменяет его автоматически.", "en": "A challenging case teaches about the rule's limits, not automatically cancels it."}]),
  Q("ch62-2-01",{"he": "לפי יונה ד׳, למה ברח יונה מן השליחות?", "ar": "بحسب يونان 4، لماذا هرب يونان من المهمة؟", "ru": "Согласно Ионе 4, почему Иона бежал от поручения?", "en": "According to Jonah 4, why did Jonah flee his mission?"},[{"he": "פחד מן הים ומן הסערה הגדולה בדרך", "ar": "خاف من البحر ومن العاصفة", "ru": "Боялся моря и бури", "en": "He feared the sea and the storm"}, {"he": "רצה לסחור ולהתעשר בעיר תרשיש", "ar": "أراد أن يتاجر في مدينة ترشيش", "ru": "Хотел торговать в Фарсисе", "en": "He wanted to trade in Tarshish"}, {"he": "לא שמע ולא הבין את הציווי של ה׳", "ar": "لم يسمع أمر الرب", "ru": "Не услышал повеления Господа", "en": "He did not hear the LORD's command"}, {"he": "ידע שה׳ רחום ועלול לסלוח לנינוה", "ar": "علم أن الرب رحيم وقد يغفر لنينوى", "ru": "Знал, что Господь милостив и может простить Ниневию", "en": "He knew the LORD is merciful and might forgive Nineveh"}],3,{"he": "קראו את מה שיונה אומר לה׳ אחרי שנינוה ניצלה.", "ar": "اقرأوا ما يقوله يونان للرب بعد نجاة نينوى.", "ru": "Прочитайте, что Иона говорит Господу после спасения Ниневии.", "en": "Read what Jonah says to the LORD after Nineveh is saved."},{"he": "רק בפרק ד׳ יונה מסביר את הבריחה. הוא אומר ״כי ידעתי כי אתה אל חנון ורחום״. הוא חשש שנינוה תחזור בתשובה ותינצל.", "ar": "في الفصل 4 فقط يفسّر يونان هروبه. يقول إنه علم أن الرب إله رؤوف ورحيم. لقد خشي أن تتوب نينوى فتنجو.", "ru": "Только в главе 4 Иона объясняет бегство. Он говорит: «я знал, что Ты Бог благой и милосердный». Он боялся, что Ниневия раскается и спасётся.", "en": "Only in chapter 4 does Jonah explain his flight. He says, 'I knew that you are a gracious and merciful God'. He feared Nineveh would repent and be saved."},null,[{"he": "יונה בורח דווקא בים, והסערה באה אחרי הבריחה.", "ar": "يونان هرب عبر البحر نفسه، والعاصفة جاءت بعد الهرب.", "ru": "Иона бежит как раз по морю, а буря приходит после бегства.", "en": "Jonah flees by sea, and the storm comes after he flees."}, {"he": "אין בספר שום רמז למסחר. תרשיש היא רק מקום מפלט.", "ar": "لا يوجد في السفر أي تلميح إلى التجارة، فترشيش مجرد ملجأ.", "ru": "В книге нет и намёка на торговлю: Фарсис — лишь убежище.", "en": "The book has no hint of trade; Tarshish is just an escape."}, {"he": "יונה שמע היטב. הוא עצמו אומר שידע מה יקרה.", "ar": "يونان سمع جيدًا، وهو نفسه يقول إنه علم ما سيحدث.", "ru": "Иона хорошо слышал: он сам говорит, что знал, что будет.", "en": "Jonah heard well; he himself says he knew what would happen."}, null]),
  Q("ch62-2-02",{"he": "איזה רעיון חוזר בדברי רעי איוב?", "ar": "أي فكرة تتكرر في كلام أصدقاء أيوب؟", "ru": "Какая мысль повторяется в речах друзей Иова?", "en": "Which idea keeps returning in the speeches of Job's friends?"},[{"he": "סבל בא במקרה, בלי סיבה", "ar": "المعاناة تأتي صدفة، بلا سبب", "ru": "Страдание приходит случайно, без причины", "en": "Suffering comes by chance, for no reason"}, {"he": "איוב צודק, וה׳ טעה בדינו", "ar": "أيوب على حق، والرب أخطأ في حكمه", "ru": "Иов прав, а Господь ошибся в суде", "en": "Job is right, and the LORD judged wrongly"}, {"he": "סבל בא כעונש, ולכן איוב חטא", "ar": "المعاناة تأتي عقابًا، إذن أيوب أخطأ", "ru": "Страдание — это наказание, значит, Иов согрешил", "en": "Suffering is punishment, so Job must have sinned"}, {"he": "צריך לשתוק ולא לדבר על הסבל", "ar": "يجب الصمت وعدم الكلام عن المعاناة", "ru": "Нужно молчать и не говорить о страдании", "en": "One should stay silent and not discuss suffering"}],2,{"he": "חשבו מה הרעים מבקשים שאיוב יעשה.", "ar": "فكّروا فيما يطلبه الأصدقاء من أيوب.", "ru": "Подумайте, чего друзья хотят от Иова.", "en": "Think about what the friends want Job to do."},{"he": "הרעים מאמינים שהעולם מתנהל לפי צדק פשוט. לכן, לדעתם, אם איוב סובל — הוא חטא. הם קוראים לו לחזור בתשובה, ואיוב מתעקש שהוא נקי.", "ar": "يؤمن الأصدقاء أن العالم يسير وفق عدل بسيط. لذلك، برأيهم، إن تألم أيوب فقد أخطأ. يدعونه إلى التوبة، وأيوب يصرّ على براءته.", "ru": "Друзья верят, что мир устроен по простой справедливости. Поэтому, по их мнению, раз Иов страдает, он согрешил. Они зовут его покаяться, а Иов настаивает на своей невинности.", "en": "The friends believe the world runs on simple justice. So, in their view, if Job suffers, he sinned. They urge him to repent, and Job insists he is innocent."},null,[{"he": "הרעים מחפשים סיבה לסבל. הם אינם רואים בו מקרה.", "ar": "الأصدقاء يبحثون عن سبب للمعاناة، ولا يرونها صدفة.", "ru": "Друзья ищут причину страдания и не считают его случайным.", "en": "The friends look for a reason; they do not see suffering as chance."}, {"he": "זו אינה עמדת הרעים. הם מגינים על צדק הדין.", "ar": "هذا ليس موقف الأصدقاء، فهم يدافعون عن عدل الحكم.", "ru": "Это не позиция друзей: они защищают справедливость суда.", "en": "This is not the friends' view; they defend the justice of the judgment."}, null, {"he": "הרעים שותקים רק שבעה ימים. אחר כך הם מדברים הרבה.", "ar": "الأصدقاء صمتوا سبعة أيام فقط، ثم تكلموا كثيرًا.", "ru": "Друзья молчат лишь семь дней, а потом говорят много.", "en": "The friends are silent only seven days; then they speak at length."}]),
  Q("ch62-2-03",{"he": "לפי שמואל א׳ ט״ו, למה נדחה שאול מן המלוכה?", "ar": "بحسب صموئيل الأول 15، لماذا رُفض شاول من المُلك؟", "ru": "Согласно 1 Царств 15, почему Саул был отвергнут от царства?", "en": "According to 1 Samuel 15, why was Saul rejected as king?"},[{"he": "לא קיים את הציווי במלחמת עמלק", "ar": "لم ينفّذ الأمر في الحرب على عماليق", "ru": "Не исполнил повеления в войне с Амаликом", "en": "He did not obey the command in the war on Amalek"}, {"he": "סירב לצאת למלחמה בפלשתים", "ar": "رفض الخروج لمحاربة الفلسطينيين", "ru": "Отказался воевать с филистимлянами", "en": "He refused to fight the Philistines"}, {"he": "לקח לעצמו את אשתו של אחר", "ar": "أخذ لنفسه امرأة رجل آخر", "ru": "Взял себе чужую жену", "en": "He took another man's wife"}, {"he": "ברח מפני גוליית בעמק האלה", "ar": "هرب من جليات في وادي البطم", "ru": "Бежал от Голиафа в долине Дуба", "en": "He fled from Goliath in the Valley of Elah"}],0,{"he": "חפשו מה שאול השאיר בחיים, למרות הציווי.", "ar": "ابحثوا عمّا أبقاه شاول حيًّا رغم الأمر.", "ru": "Найдите, что Саул оставил в живых вопреки повелению.", "en": "Look for what Saul kept alive despite the command."},{"he": "שאול נצטווה להחרים את עמלק. הוא חס על אגג המלך ועל מיטב הצאן. שמואל אומר לו ששמיעה בקול ה׳ חשובה יותר מקרבן.", "ar": "أُمر شاول أن يُحرّم عماليق. لكنه أبقى أجاج الملك وخيار الغنم. يقول له صموئيل إن الاستماع لصوت الرب أهم من الذبيحة.", "ru": "Саулу велено предать Амалика заклятию. Он пощадил царя Агага и лучший скот. Самуил говорит ему, что послушание Господу лучше жертвы.", "en": "Saul was told to destroy Amalek entirely. He spared King Agag and the best of the flocks. Samuel tells him obeying the LORD matters more than sacrifice."},null,[null, {"he": "שאול נלחם בפלשתים פעמים רבות. בפרק ט״ו מדובר בעמלק.", "ar": "حارب شاول الفلسطينيين مرارًا، والفصل 15 يتناول عماليق.", "ru": "Саул много раз воевал с филистимлянами; глава 15 — об Амалике.", "en": "Saul fought the Philistines often; chapter 15 is about Amalek."}, {"he": "זה חטאו של דוד עם בת שבע, לא של שאול.", "ar": "هذه خطيئة داود مع بثشبع، لا خطيئة شاول.", "ru": "Это грех Давида с Вирсавией, а не Саула.", "en": "That is David's sin with Bathsheba, not Saul's."}, {"he": "הטקסט אינו מספר ששאול ברח. בכל מקרה, אין זו סיבת הדחייה.", "ar": "النص لا يقول إن شاول هرب، وعلى أي حال ليس هذا سبب الرفض.", "ru": "Текст не говорит, что Саул бежал; и это не причина отвержения.", "en": "The text does not say Saul fled; anyway, it is not the reason for rejection."}]),
  Q("ch62-2-04",{"he": "מה מיוחד במגילת אסתר בהשוואה לרוב ספרי המקרא?", "ar": "ما المميّز في سفر أستير مقارنة بمعظم أسفار الكتاب المقدس؟", "ru": "Чем особенна книга Есфирь по сравнению с большинством книг Библии?", "en": "What is special about the Book of Esther compared to most biblical books?"},[{"he": "היא כתובה כולה בארמית", "ar": "مكتوب كله بالآرامية", "ru": "Она целиком написана по-арамейски", "en": "It is written entirely in Aramaic"}, {"he": "שם ה׳ אינו מופיע בה כלל", "ar": "اسم الرب لا يظهر فيه أبدًا", "ru": "Имя Господа в ней не упоминается вовсе", "en": "God's name does not appear in it at all"}, {"he": "אין בה מלך או שלטון", "ar": "لا يوجد فيه ملك أو حكم", "ru": "В ней нет царя и власти", "en": "It has no king or government"}, {"he": "היא מתרחשת כולה בירושלים", "ar": "تجري أحداثه كلها في أورشليم", "ru": "Её действие целиком в Иерусалиме", "en": "It all takes place in Jerusalem"}],1,{"he": "חפשו מה חסר בטקסט, ולא מה יש בו.", "ar": "ابحثوا عمّا ينقص في النص، لا عمّا فيه.", "ru": "Ищите, чего в тексте нет, а не что в нём есть.", "en": "Look for what is missing from the text, not what is there."},{"he": "במגילת אסתר שם ה׳ אינו נזכר אף פעם. ההצלה מתרחשת דרך מעשים של אנשים וצירופי מקרים. קוראים רבים שואלים מה המסר של היעדר זה.", "ar": "في سفر أستير لا يُذكر اسم الرب ولا مرة. يحدث الخلاص عبر أفعال البشر والمصادفات. ويسأل قرّاء كثيرون عن معنى هذا الغياب.", "ru": "В книге Есфирь имя Господа не упоминается ни разу. Спасение приходит через поступки людей и совпадения. Многие читатели спрашивают, что значит это отсутствие.", "en": "In Esther, God's name is never mentioned. Rescue comes through human acts and coincidences. Many readers ask what this absence means."},null,[{"he": "המגילה כתובה בעברית. חלקים בארמית יש בדניאל ובעזרא.", "ar": "السفر مكتوب بالعبرية، وأجزاء بالآرامية توجد في دانيال وعزرا.", "ru": "Книга написана на иврите; арамейские части есть в Данииле и Ездре.", "en": "The book is in Hebrew; Aramaic parts are in Daniel and Ezra."}, null, {"he": "המלך אחשוורוש וחצרו עומדים במרכז העלילה.", "ar": "الملك أحشويروش وبلاطه في قلب الأحداث.", "ru": "Царь Ахашверош и его двор — в центре сюжета.", "en": "King Ahasuerus and his court are at the center of the plot."}, {"he": "העלילה מתרחשת בשושן, בירת פרס.", "ar": "تجري الأحداث في شوشن، عاصمة فارس.", "ru": "Действие происходит в Сузах, столице Персии.", "en": "The story takes place in Shushan, the Persian capital."}]),
  Q("ch62-2-05",{"he": "ספר משלי פונה לקורא שוב ושוב: ״שמע בני״. מה מלמדת הפנייה הזאת על הספר?", "ar": "سفر الأمثال يخاطب القارئ مرارًا: «اسمع يا ابني». ماذا تُعلّم هذه المخاطبة عن السفر؟", "ru": "Книга Притчей снова и снова обращается: «Слушай, сын мой». Что это говорит о книге?", "en": "Proverbs keeps addressing the reader: 'Hear, my son'. What does this show about the book?"},[{"he": "הספר הוא סיפור על אב ובנו", "ar": "السفر قصة عن أب وابنه", "ru": "Книга — это рассказ об отце и сыне", "en": "The book is a story about a father and son"}, {"he": "הספר נכתב רק בשביל ילדים קטנים", "ar": "السفر كُتب للأطفال الصغار فقط", "ru": "Книга написана только для маленьких детей", "en": "The book is written only for small children"}, {"he": "הספר הוא אוסף חוקים לשופטים", "ar": "السفر قوانين للقضاة", "ru": "Книга — это законы для судей", "en": "The book is a set of laws for judges"}, {"he": "הספר בנוי כהדרכה של מבוגר לצעיר", "ar": "السفر مبنيّ كإرشاد من كبير لصغير", "ru": "Книга построена как наставление старшего младшему", "en": "The book is built as guidance from an elder to a youth"}],3,{"he": "חשבו מי בדרך כלל אומר ״בני״, ולמה.", "ar": "فكّروا من يقول عادةً «ابني»، ولماذا.", "ru": "Подумайте, кто обычно говорит «сын мой» и зачем.", "en": "Think about who usually says 'my son', and why."},{"he": "משלי פותח ב״שמע בני מוסר אביך ואל תטוש תורת אמך״. הקול בספר הוא של מורה או הורה. הוא מעביר לצעיר חוכמה מעשית לחיים.", "ar": "يبدأ الأمثال بدعوة الابن ليسمع تأديب أبيه ولا يترك شريعة أمه. الصوت في السفر صوت معلّم أو والد. ينقل للشاب حكمة عملية للحياة.", "ru": "Притчи начинаются словами: «Слушай, сын мой, наставление отца твоего и не отвергай завета матери твоей». Голос книги — голос учителя или родителя. Он передаёт молодому практическую мудрость.", "en": "Proverbs opens with 'Hear, my son, your father's instruction, and do not forsake your mother's teaching'. The voice is a teacher's or parent's. It passes practical wisdom to the young."},null,[{"he": "במשלי אין עלילה. הוא אוסף של אמרות ועצות.", "ar": "لا توجد حبكة في الأمثال، فهو مجموعة أقوال ونصائح.", "ru": "В Притчах нет сюжета: это собрание изречений и советов.", "en": "Proverbs has no plot; it is a collection of sayings and advice."}, {"he": "״בני״ היא פנייה של מורה לתלמיד, לא רק לילד קטן.", "ar": "«ابني» مخاطبة معلّم لتلميذ، لا لطفل صغير فقط.", "ru": "«Сын мой» — обращение учителя к ученику, а не только к ребёнку.", "en": "'My son' is a teacher's address to a pupil, not only to a small child."}, {"he": "משלי עוסק בחוכמת חיים, לא בחוקים לבתי משפט.", "ar": "الأمثال يتناول حكمة الحياة، لا قوانين المحاكم.", "ru": "Притчи — о житейской мудрости, а не о законах для судов.", "en": "Proverbs deals with life wisdom, not laws for courts."}, null]),
  Q("ch62-2-06",{"he": "מהו הנושא המרכזי של מגילת איכה?", "ar": "ما الموضوع الرئيسي لسفر المراثي؟", "ru": "Какова главная тема Плача Иеремии?", "en": "What is the main subject of the Book of Lamentations?"},[{"he": "השמחה על בניין המקדש", "ar": "الفرح ببناء الهيكل", "ru": "Радость о построении Храма", "en": "Joy at the building of the Temple"}, {"he": "יציאת בני ישראל ממצרים", "ar": "خروج بني إسرائيل من مصر", "ru": "Исход израильтян из Египта", "en": "The Israelites' exodus from Egypt"}, {"he": "האבל על חורבן ירושלים", "ar": "الحزن على خراب أورشليم", "ru": "Скорбь о разрушении Иерусалима", "en": "Mourning the destruction of Jerusalem"}, {"he": "עצות מעשיות לחיי יום יום", "ar": "نصائح عملية للحياة اليومية", "ru": "Практические советы на каждый день", "en": "Practical advice for daily life"}],2,{"he": "שם המגילה הוא גם המילה הפותחת אותה.", "ar": "اسم السفر بالعبرية هو أيضًا كلمته الأولى.", "ru": "Еврейское название книги — это её первое слово.", "en": "The book's Hebrew name is also its first word."},{"he": "איכה נפתחת ב״איכה ישבה בדד העיר״. המגילה מתארת את ירושלים החרבה כאישה בודדה ואבלה. היא נקראת בתשעה באב.", "ar": "يبدأ سفر المراثي بوصف المدينة جالسة وحدها. يصوّر أورشليم الخربة كامرأة وحيدة حزينة. ويُقرأ في التاسع من آب.", "ru": "Плач начинается словами «Как одиноко сидит город». Книга изображает разрушенный Иерусалим одинокой скорбящей женщиной. Её читают в 9 ава.", "en": "Lamentations opens, 'How lonely sits the city'. It pictures ruined Jerusalem as a lonely, mourning woman. It is read on the Ninth of Av."},null,[{"he": "איכה מתארת חורבן, לא בנייה ושמחה.", "ar": "المراثي يصف الخراب، لا البناء والفرح.", "ru": "Плач описывает разрушение, а не строительство и радость.", "en": "Lamentations describes ruin, not building and joy."}, {"he": "יציאת מצרים מסופרת בספר שמות, לא באיכה.", "ar": "الخروج من مصر يُروى في سفر الخروج، لا في المراثي.", "ru": "Исход рассказан в книге Исход, а не в Плаче.", "en": "The Exodus is told in the Book of Exodus, not Lamentations."}, null, {"he": "עצות לחיים יש בספר משלי. איכה היא קינה.", "ar": "النصائح للحياة في سفر الأمثال، والمراثي رثاء.", "ru": "Советы для жизни — в Притчах; Плач — это плач.", "en": "Life advice is in Proverbs; Lamentations is a lament."}])],
 [
  Q("bib-choice-1262-4",{"he": "איזה תיאור מתאים לקול אחר במקרא?", "ar": "أي وصف يناسب صوت آخر في النص؟", "ru": "Какое описание подходит к «Другой голос в тексте»?", "en": "Which description fits another voice in the text?"},[{"he": "בחינת אירועים דומים בשני סיפורים וזיהוי פרט ששונה ומשנה פירוש.", "ar": "فحص أحداث متشابهة في قصتين وتحديد فرق يغيّر الفهم.", "ru": "Сравнение похожих событий двух рассказов и значимой детали различия.", "en": "Examining similar events in two accounts and a difference that changes their meaning."},{"he": "אמירה נבואית המצביעה על מעשה פסול ודורשת שינוי בחברה.", "ar": "قول نبوي يبيّن فعلًا خاطئًا ويطالب بتغيير اجتماعي.", "ru": "Пророческая речь указывает на проступок и требует перемен в обществе.", "en": "Prophetic speech names wrongdoing and calls for social change."},{"he": "החלת כלל מן הכתוב על מצב מסוים, תוך בדיקה של תנאיו.", "ar": "تطبيق قاعدة من النص على حالة محددة مع فحص شروطها.", "ru": "Применение текстового правила к случаю с проверкой условий.", "en": "Applying a textual rule to a specific case while checking its conditions."},{"he": "תגובה של דמות או מספר המעמידה לצד עמדה אחת נקודת מבט נוספת.", "ar": "رد شخصية أو راوٍ يضع منظورًا آخر بجانب موقف معين.", "ru": "Ответ героя или рассказчика, дающий иную точку зрения рядом с первой.", "en": "A character’s or narrator’s response offering another viewpoint beside the first."}],3,{"he": "חפשו את הפרט שמבדיל אותו מן האחרים.", "ar": "ابحثوا عن التفصيل الذي يميزه عن غيره.", "ru": "Ищите отличие от остальных вариантов.", "en": "Look for the detail that separates it from the others."},{"he": "כדי לזהות קול נוסף יש לשאול מי מדבר ובאיזה הקשר.", "ar": "لتحديد الصوت الآخر اسألوا من يتكلم وفي أي سياق.", "ru": "Чтобы услышать другой голос, спросите, кто говорит и в каком контексте.", "en": "To identify another voice, ask who speaks and in what context."},null,[{"he": "זה מתאר את השוואת סיפורים, לא את קול אחר במקרא.", "ar": "هذا يصف مقارنة القصص، لا صوت آخر في النص.", "ru": "Это описание «Сопоставление рассказов», а не «Другой голос в тексте».", "en": "That describes comparing stories, not another voice in the text."},{"he": "זה מתאר את נבואה וביקורת, לא את קול אחר במקרא.", "ar": "هذا يصف النبوة والنقد، لا صوت آخر في النص.", "ru": "Это описание «Пророчество и критика», а не «Другой голос в тексте».", "en": "That describes prophecy and critique, not another voice in the text."},{"he": "זה מתאר את חוק ומקרה, לא את קול אחר במקרא.", "ar": "هذا يصف قانون وحالة، لا صوت آخر في النص.", "ru": "Это описание «Закон и случай», а не «Другой голос в тексте».", "en": "That describes law and case, not another voice in the text."},null])
 ,Q("bib-choice62-voice",{"he": "מה הרווח בקריאת 'קול אחר' במקרא - למשל קהלת לצד ספרי הנבואה?", "ar": "ما الفائدة من قراءة «صوت آخر» في التوراة - كالجامعة بجانب كتب النبوة؟", "ru": "Какова польза чтения «иного голоса» в Писании - например, Экклезиаста рядом с пророческими книгами?", "en": "What is gained by reading \"another voice\" in the Bible - for example Ecclesiastes alongside the prophetic books?"},[{"he": "המגוון מלמד שהמקרא מכיל שיח פנימי של עמדות", "ar": "التنوع يعلّم أن التوراة تحوي حوارًا داخليًا للمواقف", "ru": "Разнообразие учит, что Писание содержит внутренний диалог позиций", "en": "The variety teaches that the Bible contains an inner dialogue of positions"},{"he": "מוכיח שרק אחד מהספרים צודק", "ar": "يثبت أن كتابًا واحدًا فقط محق", "ru": "Доказывает, что только одна из книг права", "en": "Proves that only one of the books is right"},{"he": "מראה שהספרים נכתבו בטעות", "ar": "يُظهر أن الكتب كُتبت خطأ", "ru": "Показывает, что книги написаны по ошибке", "en": "Shows the books were written by mistake"},{"he": "אין רווח; עדיף ספר אחד", "ar": "لا فائدة؛ كتاب واحد أفضل", "ru": "Пользы нет; лучше одна книга", "en": "No gain; one book is better"}],0,{"he": "חשבו מה קורה כששתי עמדות נפגשות.", "ar": "فكّروا ماذا يحدث حين يلتقي موقفان.", "ru": "Подумайте, что происходит, когда встречаются две позиции.", "en": "Think about what happens when two positions meet."},{"he": "קהלת אומר 'אין כל חדש', והנביאים קוראים לשינוי דחוף. דוגמה: קריאה משותפת מגלה שכל ספר מתמודד עם שאלה דומה מזווית אחרת - והקורא מרוויח תמונה רב ממדית במקום קול יחיד.", "ar": "الجامعة يقول «لا جديد»، والأنبياء يدعون إلى تغيير عاجل. مثال: القراءة المشتركة تكشف أن كل كتاب يعالج سؤالًا مشابهًا من زاوية أخرى - والقارئ يربح صورة متعددة الأبعاد بدل صوت واحد.", "ru": "Экклезиаст говорит «нет ничего нового», а пророки зовут к срочной перемене. Пример: совместное чтение раскрывает, что каждая книга отвечает на похожий вопрос с иного угла, - и читатель получает объёмную картину вместо одного голоса.", "en": "Ecclesiastes says \"nothing new\", while the prophets call for urgent change. Example: reading them together reveals that each book tackles a similar question from another angle - and the reader gains a multidimensional picture instead of a single voice."},null,[null,{"he": "הקריאה אינה תחרות; היא מחפשת הבנה, לא מנצח.", "ar": "القراءة ليست منافسة؛ تبحث عن فهم لا عن فائز.", "ru": "Чтение не соревнование; оно ищет понимания, а не победителя.", "en": "The reading is not a contest; it seeks understanding, not a winner."},{"he": "המגוון מכוון במסורת העריכה; הוא חלק מטיב הקנון.", "ar": "التنوع مقصود في التقليد التحريري؛ هو جزء من طبيعة القانون.", "ru": "Разнообразие намеренно в редакционной традиции; оно часть природы канона.", "en": "The variety is deliberate in the editorial tradition; it is part of the canon's nature."},{"he": "השיח בין הספרים הוא עצם הרווח; ביטולו מפסיד אותו.", "ar": "الحوار بين الكتب هو الفائدة ذاتها؛ إلغاؤه يضيّعها.", "ru": "Диалог между книгами и есть польза; его отмена теряет её.", "en": "The dialogue between the books is the very gain; cancelling it loses it."}]),Q("bib-choice62-method",{"he": "תלמיד משווה שני סיפורים וכותב רק 'הם דומים'. מה חסר בעבודתו?", "ar": "طالب يقارن قصتين ويكتب فقط «هما متشابهتان». ما الناقص في عمله؟", "ru": "Ученик сравнивает две истории и пишет только «они похожи». Чего не хватает в его работе?", "en": "A student compares two stories and writes only \"they are similar\". What is missing in his work?"},[{"he": "הבדלים מפורטים ומבוססים בציטוטים, ומסקנה: מה כל סיפור מדגיש באמצעותם", "ar": "فروق مفصلة مؤسسة على اقتباسات، وخلاصة: ماذا تؤكد كل قصة من خلالها", "ru": "Подробные различия, обоснованные цитатами, и вывод: что каждая история подчёркивает с их помощью", "en": "Detailed differences grounded in quotations, and a conclusion: what each story stresses through them"},{"he": "שום דבר לא חסר בעבודתו; לכתוב בסך הכל שהסיפורים דומים זה מספיק לחלוטין למטרה", "ar": "لا ينقص عمله شيء؛ كتابة أن القصتين متشابهتان تكفي تمامًا لهذا الغرض", "ru": "В его работе ничего не недостаёт; написать просто, что истории похожи, вполне достаточно для цели", "en": "Nothing is missing in his work; simply writing that the stories are similar is quite enough for the purpose"},{"he": "שהיה צריך לכתוב ארוך יותר", "ar": "كان عليه الكتابة أطول فقط", "ru": "Ему следовало просто писать длиннее", "en": "He should simply have written longer"},{"he": "שהשוואה אינה מותרת במקרא", "ar": "أن المقارنة غير مسموحة في التوراة", "ru": "Что сравнение не разрешено в Писании", "en": "That comparison is not allowed in the Bible"}],0,{"he": "מה ההבדל בין טענה לבין עבודת השוואה?", "ar": "ما الفرق بين ادعاء وبين عمل مقارنة؟", "ru": "В чём разница между утверждением и работой сравнения?", "en": "What is the difference between a claim and comparison work?"},{"he": "כתיבת 'דומים' היא טענה בלי ראיות. דוגמה לעבודה מלאה: שני סיפורי הצלה דומים - אך באחד הגיבור פועל בשקט ובשני בגלוי, וההבדל הזה משנה את המסר. הציטוטים הם הבסיס למסקנה.", "ar": "كتابة «متشابهتان» ادعاء بلا أدلة. مثال لعمل كامل: قصتا إنقاذ متشابهتان - لكن في إحداهما يعمل البطل بصمت وفي الأخرى علنًا، وهذا الفرق يغيّر الرسالة. الاقتباسات أساس الخلاصة.", "ru": "Написать «похожи» - утверждение без свидетельств. Пример полной работы: две похожие истории спасения, - но в одной герой действует тихо, а в другой открыто, и это различие меняет послание. Цитаты - основа вывода.", "en": "Writing \"similar\" is a claim without evidence. Example of full work: two similar rescue stories, but in one the hero acts quietly and in the other openly, and that difference changes the message. The quotations ground the conclusion."},null,[null,{"he": "טענה כללית אינה מספיקה בעבודה ביקורתית; נדרש בסיס מן הטקסט.", "ar": "الادعاء العام لا يكفي في العمل النقدي؛ يلزم أساس من النص.", "ru": "Общего утверждения недостаточно в аналитической работе; нужна основа из текста.", "en": "A general claim does not suffice in analytical work; grounding from the text is required."},{"he": "האורך אינו המדד; הדיוק והבסיס הם המדד.", "ar": "الطول ليس المقياس؛ الدقة والأساس هما المقياس.", "ru": "Длина не мерило; точность и обоснованность - мерило.", "en": "Length is not the measure; precision and grounding are."},{"he": "השוואה היא כלי לימוד מקובל ומרכזי.", "ar": "المقارنة أداة تعلم مقبولة ومركزية.", "ru": "Сравнение - принятый и центральный учебный инструмент.", "en": "Comparison is an accepted and central learning tool."}]),
  Q("ch62-3-01",{"he": "ספר שופטים מסתיים ב״איש הישר בעיניו יעשה״. איך מגילת רות, מאותה תקופה, מתקשרת לכך?", "ar": "ينتهي سفر القضاة بأن «كل واحد عمل ما حسن في عينيه». كيف يرتبط سفر راعوث، من الفترة نفسها، بذلك؟", "ru": "Книга Судей кончается словами «каждый делал то, что ему казалось справедливым». Как с этим связана книга Руфь из того же времени?", "en": "Judges ends with 'everyone did what was right in his own eyes'. How does Ruth, set in the same era, relate to this?"},[{"he": "היא מציגה דמויות של חסד, בניגוד לסוף שופטים", "ar": "يعرض شخصيات تتصرف بالإحسان، خلافًا للصورة في القضاة", "ru": "Она показывает людей, поступающих милосердно, в отличие от Судей", "en": "It shows people acting with kindness, unlike the picture in Judges"}, {"he": "היא מתארת אותה אלימות בדיוק, כמו בסוף שופטים", "ar": "يصف العنف نفسه تمامًا كما في نهاية القضاة", "ru": "Она описывает то же насилие, что и конец Судей", "en": "It describes the same violence as the end of Judges"}, {"he": "היא מתרחשת בזמן המלכים, אחרי שופטים", "ar": "تجري في زمن الملوك، بعد القضاة", "ru": "Её действие — во времена царей, после Судей", "en": "It is set in the time of the kings, after Judges"}, {"he": "אין בה שום קשר לתקופה או לספר שופטים", "ar": "لا صلة له بسفر القضاة", "ru": "Она никак не связана с книгой Судей", "en": "It has no link at all to Judges"}],0,{"he": "השוו את מעשי בועז ורות לסיפורים בסוף שופטים.", "ar": "قارنوا أفعال بوعز وراعوث بالقصص في نهاية القضاة.", "ru": "Сравните поступки Вооза и Руфи с рассказами в конце Судей.", "en": "Compare what Boaz and Ruth do with the stories at the end of Judges."},{"he": "סוף שופטים מתאר אלימות ופירוק, ״איש הישר בעיניו יעשה״. רות פותחת ״בימי שפוט השופטים״, אבל הדמויות בה נוהגות בחסד. רות נאמנה לנעמי, ובועז דואג לחלשים. כך המגילה מציעה תמונה אחרת של אותה תקופה.", "ar": "نهاية القضاة تصف العنف والتفكك. سفر راعوث يبدأ في أيام القضاة، لكن شخصياته تتصرف بالإحسان. هكذا يقدّم صورة أخرى للفترة نفسها.", "ru": "Конец Судей описывает насилие и распад. Книга Руфь начинается «во дни судей», но её герои поступают милосердно. Так книга даёт другую картину того же времени.", "en": "The end of Judges shows violence and breakdown. Ruth opens 'in the days of the judges', but its people act with kindness. So the book offers another picture of the same era."},null,[null, {"he": "במגילת רות אין מלחמות או אלימות. יש בה נאמנות ועזרה.", "ar": "لا حروب ولا عنف في سفر راعوث، بل وفاء ومساعدة.", "ru": "В книге Руфь нет войн и насилия, а есть верность и помощь.", "en": "Ruth has no wars or violence; it has loyalty and help."}, {"he": "המגילה נפתחת ״בימי שפוט השופטים״, באותה תקופה.", "ar": "يبدأ السفر «في أيام حكم القضاة»، في الفترة نفسها.", "ru": "Книга начинается: «во дни, когда управляли судьи» — в то же время.", "en": "The book opens 'in the days when the judges ruled', the same era."}, {"he": "המגילה עצמה ממקמת את עצמה בתקופת השופטים, וזה קשר מפורש.", "ar": "السفر نفسه يضع أحداثه في زمن القضاة، وهذه صلة صريحة.", "ru": "Книга сама помещает себя во время судей — это явная связь.", "en": "The book itself places itself in the judges' era, an explicit link."}]),
  Q("ch62-3-02",{"he": "גם יונה וגם אליהו מבקשים למות. מה ההבדל בסיבה?", "ar": "يطلب يونان وإيليا كلاهما الموت. ما الفرق في السبب؟", "ru": "И Иона, и Илия просят смерти. В чём разница причин?", "en": "Both Jonah and Elijah ask to die. How do their reasons differ?"},[{"he": "שניהם מבקשים למות כי נכשלו בשליחות", "ar": "كلاهما يطلب الموت لأنه فشل", "ru": "Оба просят смерти, потому что потерпели неудачу", "en": "Both ask to die because they failed"}, {"he": "אליהו חש שנכשל; יונה כועס כי נינוה ניצלה", "ar": "إيليا يشعر أنه فشل، ويونان غاضب لأن نينوى نجت", "ru": "Илия чувствует провал; Иона злится, что Ниневия спасена", "en": "Elijah feels he failed; Jonah is angry Nineveh was saved"}, {"he": "אליהו כועס כי עם ישראל חזר בתשובה", "ar": "إيليا غاضب لأن الشعب تاب", "ru": "Илия злится, потому что народ покаялся", "en": "Elijah is angry because the people repented"}, {"he": "שניהם חולים מאוד ומבקשים רק מנוחה", "ar": "كلاهما مريض ويطلب الراحة", "ru": "Оба больны и хотят покоя", "en": "Both are ill and want rest"}],1,{"he": "בדקו מה קרה לשליחות של כל נביא לפני הבקשה.", "ar": "انظروا ماذا حدث لمهمة كل نبي قبل الطلب.", "ru": "Посмотрите, что стало с миссией каждого пророка до этой просьбы.", "en": "Check what happened to each prophet's mission before the request."},{"he": "אליהו בורח מאיזבל ואומר ״קח נפשי כי לא טוב אנוכי מאבותיי״. הוא מרגיש שמאבקו לא שינה דבר. יונה אומר ״טוב מותי מחיי״ דווקא אחרי שנינוה ניצלה.", "ar": "يهرب إيليا من إيزابل ويطلب أن يأخذ الرب نفسه لأنه ليس خيرًا من آبائه. يشعر أن نضاله لم يغيّر شيئًا. أما يونان فيقول إن موته خير من حياته بعد نجاة نينوى بالذات.", "ru": "Илия бежит от Иезавели и говорит: «возьми душу мою, ибо я не лучше отцов моих». Он чувствует, что его борьба ничего не изменила. Иона же говорит «лучше мне умереть, нежели жить» именно после спасения Ниневии.", "en": "Elijah flees Jezebel and says 'take my life, for I am no better than my fathers'. He feels his struggle changed nothing. Jonah says 'death is better than life' right after Nineveh is saved."},null,[{"he": "שליחותו של יונה הצליחה: נינוה חזרה בתשובה.", "ar": "مهمة يونان نجحت، فقد تابت نينوى.", "ru": "Миссия Ионы удалась: Ниневия раскаялась.", "en": "Jonah's mission succeeded: Nineveh repented."}, null, {"he": "זו הסיבה של יונה ביחס לנינוה, לא של אליהו.", "ar": "هذا سبب يونان تجاه نينوى، لا سبب إيليا.", "ru": "Это причина Ионы в отношении Ниневии, а не Илии.", "en": "That is Jonah's reason about Nineveh, not Elijah's."}, {"he": "הטקסטים אינם מדברים על מחלה, אלא על משבר בשליחות.", "ar": "النصوص لا تتحدث عن مرض، بل عن أزمة في المهمة.", "ru": "Тексты говорят не о болезни, а о кризисе миссии.", "en": "The texts speak not of illness but of a crisis in the mission."}]),
  Q("ch62-3-03",{"he": "שאול ודוד שומעים ביקורת מנביא. מה ההבדל בתגובה שלהם?", "ar": "يسمع شاول وداود توبيخًا من نبي. ما الفرق في ردّهما؟", "ru": "Саул и Давид слышат обличение от пророка. Чем различается их реакция?", "en": "Saul and David are rebuked by a prophet. How do their responses differ?"},[{"he": "שאול מודה מיד; דוד מאשים את נתן הנביא", "ar": "شاول يعترف فورًا، وداود يلوم ناثان النبي", "ru": "Саул сразу признаёт вину; Давид винит пророка Нафана", "en": "Saul admits at once; David blames Nathan the prophet"}, {"he": "שניהם מכחישים את החטא ואינם מודים בדבר", "ar": "كلاهما ينكر ولا يعترف بشيء", "ru": "Оба отрицают и ни в чём не признаются", "en": "Both deny and admit nothing"}, {"he": "שניהם מגיבים באותה צורה בדיוק", "ar": "كلاهما يردّ بالطريقة نفسها تمامًا", "ru": "Оба реагируют совершенно одинаково", "en": "Both respond in exactly the same way"}, {"he": "דוד מודה מיד; שאול מתרץ ומאשים את העם", "ar": "داود يعترف فورًا، وشاول يبرّر نفسه ويلوم الشعب", "ru": "Давид сразу признаёт вину; Саул оправдывается и винит народ", "en": "David admits at once; Saul justifies himself and blames the people"}],3,{"he": "השוו את המילים הראשונות של כל מלך אחרי הביקורת.", "ar": "قارنوا الكلمات الأولى لكل ملك بعد التوبيخ.", "ru": "Сравните первые слова каждого царя после обличения.", "en": "Compare each king's first words after the rebuke."},{"he": "שאול טוען תחילה שקיים את דבר ה׳, ותולה בעם את לקיחת הצאן. רק אחר כך הוא אומר ״חטאתי״, ומבקש כבוד לפני הזקנים. דוד שומע ״אתה האיש״ ועונה מיד ״חטאתי לה׳״.", "ar": "يدّعي شاول أولًا أنه نفّذ كلام الرب، ويلقي على الشعب أخذ الغنم. ثم فقط يقول «أخطأت» ويطلب الكرامة أمام الشيوخ. أما داود فيسمع «أنت هو الرجل» ويجيب فورًا «أخطأت إلى الرب».", "ru": "Саул сначала утверждает, что исполнил слово Господа, и винит народ за скот. Лишь потом он говорит «согрешил я» и просит почтить его перед старейшинами. Давид слышит «ты — тот человек» и сразу отвечает «согрешил я пред Господом».", "en": "Saul first claims he obeyed and blames the people for taking the flocks. Only later does he say 'I have sinned' and ask for honor before the elders. David hears 'You are the man' and answers at once, 'I have sinned against the LORD'."},null,[{"he": "זה הפוך. דוד אומר מיד ״חטאתי לה׳״.", "ar": "هذا معكوس، فداود يقول فورًا «أخطأت إلى الرب».", "ru": "Наоборот: Давид сразу говорит «согрешил я пред Господом».", "en": "It is reversed; David says at once 'I have sinned against the LORD'."}, {"he": "דוד מודה מיד, וגם שאול אומר בסוף ״חטאתי״.", "ar": "داود يعترف فورًا، وشاول أيضًا يقول في النهاية «أخطأت».", "ru": "Давид признаётся сразу, и Саул в конце тоже говорит «согрешил я».", "en": "David admits at once, and Saul too finally says 'I have sinned'."}, {"he": "שאול מתחיל בתירוצים, ודוד אינו מתרץ דבר.", "ar": "شاول يبدأ بالأعذار، وداود لا يقدّم أي عذر.", "ru": "Саул начинает с оправданий, а Давид не оправдывается.", "en": "Saul starts with excuses, while David makes none."}, null]),
  Q("ch62-3-04",{"he": "בסוף ספר איוב אומר ה׳ לרעים: ״לא דיברתם אליי נכונה כעבדי איוב״. מה זה מלמד על עמדת הרעים?", "ar": "في نهاية سفر أيوب يقول الرب للأصدقاء إنهم لم يقولوا فيه الصواب كعبده أيوب. ماذا يُعلّم ذلك عن موقفهم؟", "ru": "В конце книги Иова Господь говорит друзьям: «вы говорили обо Мне не так верно, как раб Мой Иов». Чему это учит о позиции друзей?", "en": "At the end of Job the LORD tells the friends: 'you have not spoken of me what is right, as my servant Job has'. What does this show?"},[{"he": "הספר מאשר שהרעים צדקו בכל דבריהם לאיוב", "ar": "السفر يؤكد أن الأصدقاء أصابوا في كل كلامهم", "ru": "Книга подтверждает, что друзья были во всём правы", "en": "The book confirms the friends were right in everything"}, {"he": "הספר מלמד שאיוב חטא באמת ונענש בצדק", "ar": "السفر يعلّم أن أيوب أخطأ وعوقب بعدل", "ru": "Книга учит, что Иов согрешил и наказан справедливо", "en": "The book teaches that Job sinned and was justly punished"}, {"he": "הספר דוחה את הטענה שכל סבל הוא עונש על חטא", "ar": "السفر يرفض القول بأن كل معاناة عقاب على خطيئة", "ru": "Книга отвергает мысль, что всякое страдание — наказание за грех", "en": "The book rejects the claim that all suffering punishes sin"}, {"he": "הספר אינו מכריע כלל בין איוב לבין רעיו", "ar": "السفر لا يحسم بين أيوب والأصدقاء", "ru": "Книга не решает спор между Иовом и друзьями", "en": "The book does not decide between Job and the friends"}],2,{"he": "חשבו מה טענו הרעים לאורך כל הוויכוח.", "ar": "فكّروا فيما ادّعاه الأصدقاء طوال الجدال.", "ru": "Вспомните, что утверждали друзья на протяжении всего спора.", "en": "Recall what the friends claimed throughout the debate."},{"he": "הרעים טענו שאיוב סובל כי חטא. בסוף ה׳ אומר שהם לא דיברו נכונה, ואיוב כן. כך הספר דוחה את ההסבר הפשוט שכל סבל הוא עונש.", "ar": "ادّعى الأصدقاء أن أيوب يتألم لأنه أخطأ. وفي النهاية يقول الرب إنهم لم يقولوا الصواب وأيوب قاله. هكذا يرفض السفر التفسير البسيط بأن كل معاناة عقاب.", "ru": "Друзья утверждали, что Иов страдает за грех. В конце Господь говорит, что они говорили неверно, а Иов — верно. Так книга отвергает простое объяснение, что всякое страдание — наказание.", "en": "The friends argued Job suffers because he sinned. In the end God says they spoke wrongly and Job rightly. So the book rejects the simple idea that all suffering is punishment."},null,[{"he": "ה׳ אומר במפורש שהרעים לא דיברו נכונה.", "ar": "الرب يقول صراحةً إن الأصدقاء لم يقولوا الصواب.", "ru": "Господь прямо говорит, что друзья говорили неверно.", "en": "The LORD says plainly that the friends did not speak rightly."}, {"he": "הספר פותח בכך שאיוב ״תם וישר״, וה׳ משבח אותו בסוף.", "ar": "يبدأ السفر بأن أيوب «كامل ومستقيم»، والرب يمدحه في النهاية.", "ru": "Книга начинается с того, что Иов «непорочен и справедлив», и Господь хвалит его в конце.", "en": "The book opens with Job as 'blameless and upright', and God praises him at the end."}, null, {"he": "הפסוק הזה מכריע במפורש לטובת איוב.", "ar": "هذه الآية تحسم صراحةً لصالح أيوب.", "ru": "Этот стих прямо решает спор в пользу Иова.", "en": "This verse explicitly decides in Job's favor."}]),
  Q("ch62-3-05",{"he": "איך מסתיימת מגילת איכה, בהשוואה למזמורי קינה רבים בתהלים?", "ar": "كيف ينتهي سفر المراثي مقارنةً بكثير من مزامير الرثاء؟", "ru": "Чем заканчивается Плач Иеремии по сравнению со многими псалмами-плачами?", "en": "How does Lamentations end, compared with many lament psalms?"},[{"he": "בשיר תודה שמח על הישועה", "ar": "بنشيد شكر فرِح بالخلاص", "ru": "Радостной благодарственной песнью о спасении", "en": "With a joyful song of thanks for rescue"}, {"he": "בבקשה ובספק, בלי מעבר ברור לשבח", "ar": "بطلب وشكّ، بلا انتقال واضح إلى التسبيح", "ru": "Просьбой и сомнением, без ясного перехода к хвале", "en": "With a plea and doubt, without a clear turn to praise"}, {"he": "באותה צורה בדיוק כמו כל מזמור", "ar": "بالطريقة نفسها تمامًا كأي مزمور", "ru": "Точно так же, как любой псалом", "en": "Exactly the same way as every psalm"}, {"he": "בחוק חדש על שמירת השבת", "ar": "بشريعة جديدة عن حفظ السبت", "ru": "Новым законом о соблюдении субботы", "en": "With a new law about keeping the Sabbath"}],1,{"he": "קראו את שני הפסוקים האחרונים במגילה.", "ar": "اقرأوا الآيتين الأخيرتين في السفر.", "ru": "Прочитайте два последних стиха книги.", "en": "Read the last two verses of the book."},{"he": "מזמורי קינה רבים מתחילים בצער ומסיימים בביטחון ובשבח. איכה מסיימת ב״השיבנו ה׳ אליך ונשובה״, ומיד אחר כך בחשש שה׳ מאס בעם. הסוף נשאר פתוח וכואב.", "ar": "كثير من مزامير الرثاء تبدأ بالحزن وتنتهي بالثقة والتسبيح. أما المراثي فينتهي بطلب أن يردّ الرب شعبه إليه، ثم بخوف من أن يكون قد رفضه. فتبقى النهاية مفتوحة ومؤلمة.", "ru": "Многие псалмы-плачи начинаются скорбью и кончаются упованием и хвалой. Плач кончается словами «Обрати нас к Тебе, Господи, и мы обратимся», а затем страхом, что Бог отверг народ. Конец остаётся открытым и болезненным.", "en": "Many lament psalms begin in grief and end in trust and praise. Lamentations ends with 'Turn us back to you, LORD, and we shall return', then a fear that God has rejected the people. The ending stays open and painful."},null,[{"he": "איכה אינה מתארת ישועה שכבר באה. היא מסיימת בתחינה.", "ar": "المراثي لا يصف خلاصًا قد جاء، بل ينتهي بتضرّع.", "ru": "Плач не описывает уже пришедшее спасение; он кончается мольбой.", "en": "Lamentations describes no rescue that has come; it ends in a plea."}, null, {"he": "מזמורי קינה רבים עוברים בסוף לביטחון. באיכה אין מעבר כזה.", "ar": "كثير من مزامير الرثاء تنتقل في النهاية إلى الثقة، والمراثي لا.", "ru": "Многие псалмы-плачи в конце переходят к упованию, а Плач — нет.", "en": "Many lament psalms end in trust; Lamentations does not."}, {"he": "איכה היא קינה. אין בה חוקים.", "ar": "المراثي رثاء، ولا شرائع فيه.", "ru": "Плач — это плач; законов в нём нет.", "en": "Lamentations is a lament; it contains no laws."}]),
  Q("ch62-3-06",{"he": "רות ואסתר הן שתי נשים שעל שמן נקראו מגילות. מה ההבדל המרכזי במצבן?", "ar": "راعوث وأستير امرأتان سُمّي باسمهما سفران. ما الفرق الرئيسي في وضعهما؟", "ru": "Руфь и Есфирь — две женщины, чьими именами названы книги. В чём главное различие их положения?", "en": "Ruth and Esther are two women with books named after them. What is the main difference in their situations?"},[{"he": "רות נוכרייה שמצטרפת לעם; אסתר יהודייה בחצר זרה", "ar": "راعوث غريبة تنضم إلى الشعب، وأستير يهودية في بلاط ملك أجنبي", "ru": "Руфь — чужеземка, примкнувшая к народу; Есфирь — иудейка при чужом дворе", "en": "Ruth is a foreigner who joins the people; Esther is a Jew in a foreign court"}, {"he": "רות יהודייה בפרס; אסתר נוכרייה שמגיעה לבית לחם", "ar": "راعوث يهودية في فارس، وأستير غريبة تصل إلى بيت لحم", "ru": "Руфь — иудейка в Персии; Есфирь — чужеземка, пришедшая в Вифлеем", "en": "Ruth is a Jew in Persia; Esther is a foreigner who reaches Bethlehem"}, {"he": "שתיהן מלכות שחיות בארמון של מלך נוכרי", "ar": "كلتاهما ملكتان تعيشان في قصر ملك", "ru": "Обе — царицы, живущие во дворце царя", "en": "Both are queens living in a king's palace"}, {"he": "שתיהן נביאות שמוכיחות את העם", "ar": "كلتاهما نبيّتان توبّخان الشعب", "ru": "Обе — пророчицы, обличающие народ", "en": "Both are prophets who rebuke the people"}],0,{"he": "שאלו לגבי כל אחת: מאיזה עם היא, ואיפה היא חיה?", "ar": "اسألوا عن كل واحدة: من أي شعب هي، وأين تعيش؟", "ru": "Спросите о каждой: из какого она народа и где живёт?", "en": "Ask about each: which people is she from, and where does she live?"},{"he": "רות היא מואבייה שבוחרת ללכת עם נעמי ואומרת ״עמך עמי״. אסתר היא יהודייה שחיה בשושן ומסתירה בהתחלה את מוצאה. ההשוואה מציגה שני כיוונים: הצטרפות לעם, ושמירה עליו בגולה.", "ar": "راعوث موآبية تختار الذهاب مع نُعمي وتقول «شعبك شعبي». وأستير يهودية تعيش في شوشن وتخفي أصلها في البداية. المقارنة تُظهر اتجاهين: الانضمام إلى الشعب، وحمايته في المنفى.", "ru": "Руфь — моавитянка, которая идёт с Ноеминью и говорит: «твой народ будет моим народом». Есфирь — иудейка в Сузах, которая сначала скрывает своё происхождение. Сравнение показывает два пути: присоединение к народу и защиту его в изгнании.", "en": "Ruth is a Moabite who goes with Naomi and says 'your people shall be my people'. Esther is a Jew in Shushan who at first hides her origin. The comparison shows two paths: joining the people, and protecting it in exile."},null,[null, {"he": "זה הפוך. רות מואבייה שבאה לבית לחם, ואסתר חיה בשושן.", "ar": "هذا معكوس: راعوث موآبية جاءت إلى بيت لحم، وأستير عاشت في شوشن.", "ru": "Наоборот: Руфь — моавитянка, пришедшая в Вифлеем, а Есфирь жила в Сузах.", "en": "It is reversed: Ruth is a Moabite who comes to Bethlehem; Esther lives in Shushan."}, {"he": "רות אינה מלכה. היא מלקטת שיבולים בשדה של בועז.", "ar": "راعوث ليست ملكة، بل تلتقط السنابل في حقل بوعز.", "ru": "Руфь не царица: она собирает колосья на поле Вооза.", "en": "Ruth is not a queen; she gleans grain in Boaz's field."}, {"he": "אף אחת מהן אינה מתוארת כנביאה במגילה שלה.", "ar": "لا تُوصف أيّ منهما بأنها نبيّة في سفرها.", "ru": "Ни одна из них не названа пророчицей в своей книге.", "en": "Neither is described as a prophet in her book."}])]]);

function itemId(tid,lv,i){return tid+"|"+lv+"|"+i}
function itemRec(id){
  if(!state.item[id])state.item[id]={n:0,ok:0};
  return state.item[id];
}
function poolOf(tp,lv){return (tp.L[lv-1]||tp.L[0]||[])}

/* בחירת פריט לתרגול. משקל גבוה לחדש, בינוני לנכשל, נמוך לנשלט. */
function chooseIndex(tid,lv,pool,avoid){
  var cand=[],i,w;
  for(i=0;i<pool.length;i++){
    if(avoid!==undefined&&i===avoid&&pool.length>1)continue;
    var r=state.item[itemId(tid,lv,i)];
    if(!r||!r.n)w=6;                            /* חדש */
    else if(r.ok<r.n)w=1+Math.min(4,r.n-r.ok);  /* נכשל בעבר */
    else w=1;                                   /* נשלט */
    for(var j=0;j<w;j++)cand.push(i);
  }
  if(!cand.length)return 0;
  return pick(cand);
}
/* בחירת פריט למבחן. אחידה, ואינה נוגעת ב-state כלל. */
function pureIndex(pool,avoid){
  var cand=[],i;
  for(i=0;i<pool.length;i++){
    if(avoid!==undefined&&i===avoid&&pool.length>1)continue;
    cand.push(i);
  }
  return cand.length?pick(cand):0;
}


/* ------------------------------------------------------------
   ניקוי להקראה בלבד. המסך אינו משתנה ממנו.

   הגרשיים העבריים משמשים לשני דברים: ראשי תיבות (חוק־יסוד,
   בג״ץ) ומירכאות (״מדינה יהודית״). המנוע מכיר רק את הראשון.
   הכלל שמפריד: בראשי תיבות באה אחרי הגרשיים אות עברית אחת
   בדיוק וסוף מילה. הסיכון א־סימטרי — מירכאה שהוסרה אינה
   יכולה להזיק, מירכאה שנשארה כן.

   המירכאות המסולסלות (“ ”) משמשות כאן לציטוט מונחים בלבד,
   ולכן הן נופלות תמיד. הקו המפריד הופך לפסיק, כדי שהקול
   ייעצר במקום לרוץ הלאה.
   ------------------------------------------------------------ */
function saySpell(x){
  return String(x==null?"":x)
    .replace(/[“”‘’]/g,"")
    .replace(/״/g,function(m,i,str){
      return /^[א-ת](?![א-ת])/.test(str.slice(i+1))?m:"";
    })
    .replace(/\s—\s/g,", ");
}

function O(html,ok,why){return {h:html,ok:!!ok,why:why||""}}

/* בונה שאלה מפריט אחד. סדר האפשרויות מעורבב בכל בנייה, ולכן
   האינדקס ok שבתוכן אינו מגיע למסך לעולם. */
function buildFromItem(it){
  var opts=it.o.map(function(o,i){return O(esc(gl(o)),i===it.ok,it.wrong&&it.wrong[i]?gl(it.wrong[i]):"")});
  var ans=gl(it.o[it.ok]);
  return {
    type:"mcq",
    prompt:t("qPick"),
    lead:gl(it.q),
    fig:figHtml(it.fig),
    opts:shuffle(opts),
    answer:ans,
    /* מה שנאמר אחרי המענה: השאלה, התשובה הנכונה, וההסבר.
       תשובה בלי ההסבר נשמעת כמו עובדה לשינון, וזה בדיוק מה
       שהאפליקציה הזאת קיימת כדי להחליף. */
    say:gl(it.q)+" "+ans+". "+gl(it.ex),
    reveal:it
  };
}
function buildQuestion(tid,lv,avoid,pure){
  var tp=topicOf(tid); if(!tp)return null;
  var pool=poolOf(tp,lv);
  if(!pool.length)return null;
  var idx=pure?pureIndex(pool,avoid):chooseIndex(tid,lv,pool,avoid);
  var it=pool[idx];
  if(!it)return null;
  var q=buildFromItem(it);
  q.tid=tid; q.lv=lv; q.idx=idx; q.id=itemId(tid,lv,idx);
  q.hint=gl(it.hint);
  return q;
}

/* ============================================================
   מבחן מדומה
   ------------------------------------------------------------
   עשרים שאלות מכל הנושאים ומכל הרמות, בחוברת אחת שגוללים בה —
   ולא שאלה־שאלה. מי שקורא לאט צריך לראות כמה נשאר, לחזור אחורה
   ולשנות תשובה; ניווט שמסתיר את שאר השאלות לוקח ממנו בדיוק את זה.

   המבחן אינו נשמר. הוא מצב זמני בזיכרון בלבד, ורענון הדף מתחיל
   אותו מחדש — זו הצהרה ולא פער: שעון שממשיך לרוץ בין ביקורים
   הוא בדיוק המקום שבו נולדים באגים שקשה לשחזר.
   ============================================================ */
var SIM_N=20, SIM_MIN=30;
var SIM={on:false,done:false,q:[],ans:[],end:0,tick:null};

function simStop(){if(SIM.tick){clearInterval(SIM.tick);SIM.tick=null}}
function simFmt(ms){
  if(ms<0)ms=0;
  var sec=Math.round(ms/1000),m=Math.floor(sec/60),c=sec%60;
  return m+":"+(c<10?"0":"")+c;
}
function simLeftN(){
  var n=0,i;
  for(i=0;i<SIM.ans.length;i++)if(SIM.ans[i]<0)n++;
  return n;
}
function simRight(){
  var n=0,i;
  for(i=0;i<SIM.q.length;i++)if(SIM.ans[i]>=0&&SIM.q[i].opts[SIM.ans[i]].ok)n++;
  return n;
}
function simStart(){
  var pairs=[],qs=[],i,q;
  TOPICS.forEach(function(tp){for(var l=1;l<=3;l++)pairs.push([tp.id,l])});
  shuffle(pairs);
  for(i=0;i<pairs.length&&qs.length<SIM_N;i++){
    q=buildQuestion(pairs[i][0],pairs[i][1],undefined,true);
    if(q)qs.push(q);
  }
  /* פחות צמדי נושא-רמה מ-SIM_N: סבב נוסף, בלי לחזור על אותו פריט. */
  var guard=0;
  while(qs.length<SIM_N&&guard<400){
    var pr=pairs[guard%pairs.length]; guard++;
    q=buildQuestion(pr[0],pr[1],undefined,true);
    if(!q)continue;
    var dup=false,k;
    for(k=0;k<qs.length;k++)if(qs[k].id===q.id){dup=true;break}
    if(!dup)qs.push(q);
  }
  SIM.q=qs;
  SIM.ans=qs.map(function(){return -1});
  SIM.on=true; SIM.done=false; SIM.end=Date.now()+SIM_MIN*60000;
  simArm();
}
function simArm(){
  simStop();
  if(SIM.on&&!SIM.done)SIM.tick=setInterval(simClock,1000);
}
function simClock(){
  var el=$("#simclock");
  /* המסך הוחלף — אין מה לעדכן, והשעון נעצר מעצמו. */
  if(!el){simStop();return}
  var left=SIM.end-Date.now();
  el.textContent=simFmt(left);
  if(left<=60000)el.classList.add("low");
  if(left<=0){simStop();simSubmit()}
}
/* ההגשה היא גם רגע הרישום: עד כאן לא נספרה אף תשובה, כדי
   שהמבחן לא ידחוף לבנק הטעויות שאלה שהנבחן עוד עמד לשנות. */
function simSubmit(){
  if(!SIM.on||SIM.done)return;
  simStop();
  var i;
  for(i=0;i<SIM.q.length;i++){
    var q=SIM.q[i],pk=SIM.ans[i];
    recordItem(q.tid,q.lv,q.id,pk>=0&&!!q.opts[pk].ok);
  }
  SIM.done=true; save(); render(); window.scrollTo(0,0);
}

  var h='<div class="wrap"><h2 style="margin:1.1rem 0 .3rem;font-size:1.4rem">'+esc(t("simT"))+"</h2>";

    h+='<div class="card" style="text-align:center"><div style="font-size:2.2rem;font-weight:800">'+

  }
  /* המבחן עצמו. השעון נדרך אחרי הציור, כי הוא מעדכן אלמנט
     שעדיין לא קיים בזמן שבניית ה-HTML רצה. */
  setTimeout(simArm,0);
  h+='<div class="simbar"><span class="clock" id="simclock">'+esc(simFmt(SIM.end-Date.now()))+"</span>"+
     '<span class="chip"><span id="simleft">'+simLeftN()+"</span> "+esc(t("simLeft"))+"</span>"+
     '<button class="btn pri" data-a="simsubmit" style="margin-inline-start:auto">'+
     esc(t("simSubmit"))+"</button></div>";
  SIM.q.forEach(function(q,i){
    h+='<div class="simq"><div class="simn">'+esc(t("simQ"))+" "+(i+1)+" / "+SIM.q.length+"</div>";
    h+=askBox(q.lead||"");
    if(q.fig)h+=q.fig;
    h+='<div class="opts">';
    q.opts.forEach(function(o,j){
      h+='<button class="opt'+(SIM.ans[i]===j?" sel":"")+'" data-a="simpick" data-i="'+i+
        '" data-j="'+j+'"><span class="k">'+String.fromCharCode(65+j)+"</span><span>"+o.h+"</span></button>";
    });
    h+="</div></div>";
  });
  h+='<div style="margin:1rem 0"><button class="btn pri" data-a="simsubmit">'+
     esc(t("simSubmit"))+"</button></div>";
  return h+"</div>"+fbar();
}
