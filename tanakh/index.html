<script>
/* INTERNAL-GATE — שער פנימי. ראו .claude/qa/internal-gate.html.
   המפתח נשמר במגירה משל האפליקציה (shlav-internal-tanakh) ולא
   במגירה המשותפת shlav-internal, כדי שפתיחת אזרח לא תסגור את
   מתח ולהפך. */
var INTERNAL_KEY="shlav-internal-tanakh";
var INTERNAL_OK=(function(){
  try{
    var q=(location.search.match(/[?&]internal=([^&]*)/)||[])[1];
    if(q) localStorage.setItem("shlav-internal-tanakh", decodeURIComponent(q));
    return localStorage.getItem("shlav-internal-tanakh")===INTERNAL_KEY;
  }catch(e){ return false }   /* localStorage חסום — סגור, לא פתוח */
})();
</script>

<style>
/* ============================================================
   תנ״ך — תנ״ך לבגרות
   קהל היעד לא "לא יודע אזרחות". הוא נכשל בה שוב ושוב, מפני
   שהמקצוע כולו טקסט ומושגים — ולכן כל החלטה כאן נמדדת בשאלה
   אחת: האם היא מורידה עומס, או מוסיפה.
   · כל שאלה נושאת רמז שאינו התשובה, והסבר שנפתח גם כשצדקו.
   · שום טקסט לא מוצג בלי שאפשר לשמוע אותו.
   · שפת האם אינה קישוט: מושג באזרחות נלמד קודם בשפה שחושבים בה.
   כל המידות ב-rem, כדי שהגדלת טקסט תגדיל את הכול יחד.
   ============================================================ */
:root{
  --font:"Heebo","Rubik",system-ui,"Segoe UI",Arial,sans-serif;
  --en:"Lexend","Heebo",system-ui,"Segoe UI",Arial,sans-serif;
  --ar:"Noto Sans Arabic",system-ui,"Segoe UI",Arial,sans-serif;
  --ru:"Noto Sans","Heebo",system-ui,"Segoe UI",Arial,sans-serif;   /* קירילית — Heebo אינו מכיל אותה */
  --bg:#f5f7fb; --surface:#ffffff; --surface2:#e8ecf6;
  --ink:#101828; --muted:#55607a; --faint:#6f7a95; --line:#dde3f0;
  --accent:#1d4ed8; --accent-ink:#ffffff; --accent-soft:#dbe4fe;
  --gold:#a16207; --gold-soft:#fbf0d5; --hit:#f5c451; --hit-ink:#1a1300;
  --ok:#15803d; --ok-soft:#dcfce7; --bad:#be123c; --bad-soft:#ffe4e9;
  --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px -12px rgba(16,24,40,.2);
  --r:14px;
  /* צבע לכל מסלול. לא קישוט: ארבעה סוגי לימוד שונים לגמרי, וצבע
     קבוע לכל אחד חוסך למי שמתקשה להתמצא את השאלה "איפה אני". */
  --c-sound:#0369a1; --cs-sound:#dbeefc;   /* צליל ואות   */
  --c-words:#15803d; --cs-words:#dcfce7;   /* מילים       */
  --c-talk:#c2410c;  --cs-talk:#fde5d8;    /* מדוברת      */
  --c-read:#6d28d9;  --cs-read:#eae2fd;    /* ספרותית     */
}
:root[data-theme="dark"]{
  --bg:#0e1425; --surface:#17203a; --surface2:#202c4d;
  --ink:#e8edf8; --muted:#9aa5c0; --faint:#78829e; --line:#2a3762;
  --accent:#93c5fd; --accent-ink:#0e1425; --accent-soft:#1b2a5c;
  --gold:#fbbf24; --gold-soft:#33270f; --hit:#ffd24d; --hit-ink:#241a00;
  --ok:#4ade80; --ok-soft:#132a1c; --bad:#fb7185; --bad-soft:#33161f;
  --warn:#fbbf24; --warn-soft:#33260f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  --c-sound:#7dd3fc; --cs-sound:#0b2a3d;
  --c-words:#86efac; --cs-words:#0f2a1a;
  --c-talk:#fdba74;  --cs-talk:#3a2113;
  --c-read:#c4b5fd;  --cs-read:#261a45;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1425; --surface:#17203a; --surface2:#202c4d;
    --ink:#e8edf8; --muted:#9aa5c0; --faint:#78829e; --line:#2a3762;
    --accent:#93c5fd; --accent-ink:#0e1425; --accent-soft:#1b2a5c;
    --gold:#fbbf24; --gold-soft:#33270f; --hit:#ffd24d; --hit-ink:#241a00;
    --ok:#4ade80; --ok-soft:#132a1c; --bad:#fb7185; --bad-soft:#33161f;
    --warn:#fbbf24; --warn-soft:#33260f;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
    --c-sound:#7dd3fc; --cs-sound:#0b2a3d;
    --c-words:#86efac; --cs-words:#0f2a1a;
    --c-talk:#fdba74;  --cs-talk:#3a2113;
    --c-read:#c4b5fd;  --cs-read:#261a45;
  }
}
/* ניגודיות גבוהה — שחור על לבן, מסגרות מלאות, בלי גוונים רכים */
:root.hc{
  --bg:#ffffff; --surface:#ffffff; --surface2:#ffffff;
  --ink:#000000; --muted:#1a1a1a; --faint:#333333; --line:#000000;
  --accent:#00434b; --accent-ink:#ffffff; --accent-soft:#e6f2f3;
  --gold:#5c3d00; --gold-soft:#f7efdf; --hit:#ffe600; --hit-ink:#000000;
  --ok:#0a5c2a; --ok-soft:#e6f4ea; --bad:#8c0f2c; --bad-soft:#fbe9ed;
  --warn:#6b3d00; --warn-soft:#f7efdf; --shadow:none;
  --c-sound:#00305c; --cs-sound:#e8eef7;
  --c-words:#0a5c2a; --cs-words:#e6f4ea;
  --c-talk:#7a2c00;  --cs-talk:#f9ece4;
  --c-read:#3d1a75;  --cs-read:#eee8f9;
}
:root.hc *{box-shadow:none!important}
:root.hc .card,:root.hc .btn,:root.hc .opt{border-width:2px!important}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs,17px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  font-size:1rem;line-height:1.65;-webkit-text-size-adjust:100%}
:root.clear body{font-family:"Verdana","Tahoma","Heebo",sans-serif;letter-spacing:.012em}
:root.spaced body{word-spacing:.22em;line-height:1.95}
:root.rm *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
h1,h2,h3{margin:0;line-height:1.3;font-weight:800}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* כל טקסט אנגלי — כיוון, גופן ומרווח משלו. unicode-bidi:isolate מונע
   מהמשפט האנגלי לגרור אחריו את סימני הפיסוק של המשפט העברי. */
.en{font-family:var(--en);direction:ltr;unicode-bidi:isolate;text-align:start}
.en-b{font-family:var(--en);direction:ltr;unicode-bidi:isolate;display:inline-block}

.wrap{max-width:56rem;margin:0 auto;padding:0 clamp(.9rem,3vw,1.5rem)}
.hbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-block:.6rem}
:root.hc .hbar{background:var(--bg);backdrop-filter:none}
.hrow{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
.brand{font-size:1.35rem;font-weight:800;letter-spacing:-.01em;display:flex;
  align-items:baseline;gap:.5rem;margin-inline-end:auto}
.brand small{font-size:.72rem;font-weight:600;color:var(--muted);letter-spacing:.06em}
.gbtn{display:inline-flex;align-items:center;gap:.4rem;background:var(--surface);
  border:1px solid var(--line);border-radius:999px;padding:.42rem .8rem;cursor:pointer;
  font-size:.86rem;font-weight:600;box-shadow:var(--shadow);min-height:44px}
.gbtn:hover{border-color:var(--accent)}
.gbtn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:1.1rem}
.grid{display:grid;gap:.85rem}
@media(min-width:640px){.g2{grid-template-columns:1fr 1fr}}
@media(min-width:900px){.g3{grid-template-columns:repeat(3,1fr)}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;
  border:1px solid var(--line);background:var(--surface);border-radius:12px;
  padding:.72rem 1.1rem;font-weight:700;cursor:pointer;box-shadow:var(--shadow);
  min-height:2.9rem;font-size:1rem}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;box-shadow:none}
.btn[disabled]{opacity:.45;cursor:default}
.btn.wide{width:100%}

.chip{display:inline-flex;align-items:center;gap:.35rem;border-radius:999px;
  padding:.22rem .6rem;font-size:.78rem;font-weight:700;background:var(--surface2);color:var(--muted)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}

/* גופני שפה: Heebo אינו מכיל ערבית וקירילית, ולכן שפת הממשק
   מחליפה גופן ולא רק כיוון. */
html[lang="ar"] body,html[lang="ar"] input,html[lang="ar"] button,
html[lang="ar"] textarea,html[lang="ar"] select{font-family:var(--ar)}
html[lang="ru"] body,html[lang="ru"] input,html[lang="ru"] button,
html[lang="ru"] textarea,html[lang="ru"] select{font-family:var(--ru)}
button[data-a="lang"][lang="ar"]{font-family:var(--ar)}
button[data-a="lang"][lang="ru"]{font-family:var(--ru)}

/* ===== מסלולים: הצבע נכנס ככרטיס, לא כרקע של טקסט ===== */
.trk{--c:var(--accent);--cs:var(--accent-soft)}
.t-sound{--c:var(--c-sound);--cs:var(--cs-sound)}
.t-words{--c:var(--c-words);--cs:var(--cs-words)}
.t-talk{--c:var(--c-talk); --cs:var(--cs-talk)}
.t-read{--c:var(--c-read); --cs:var(--cs-read)}
.tcard{border-inline-start:5px solid var(--c);cursor:pointer;text-align:start;width:100%;
  display:flex;flex-direction:column;gap:.4rem;align-items:stretch}
.tcard:hover{border-color:var(--c)}
.tcard h3{font-size:1.05rem}
.tcard .sub{font-size:.85rem;color:var(--muted)}
.tdot{width:.62rem;height:.62rem;border-radius:50%;background:var(--c);flex:none}
.thead{display:flex;align-items:center;gap:.5rem}
.tpill{background:var(--cs);color:var(--c);border-radius:999px;padding:.15rem .55rem;
  font-size:.72rem;font-weight:800}

/* ===== סרגל שליטה ברמות ===== */
.lvls{display:flex;gap:.4rem;flex-wrap:wrap}
.lvl{border:1px solid var(--line);background:var(--surface);border-radius:10px;
  padding:.4rem .7rem;font-size:.82rem;font-weight:700;cursor:pointer;
  display:inline-flex;align-items:center;gap:.4rem}
.lvl.on{background:var(--c,var(--accent));color:var(--accent-ink);border-color:var(--c,var(--accent))}
.bar{height:.42rem;border-radius:999px;background:var(--surface2);overflow:hidden;flex:1;min-width:3rem}
.bar i{display:block;height:100%;background:var(--c,var(--accent))}
.bar.b0 i{background:var(--bad)} .bar.b1 i{background:var(--warn)} .bar.b2 i{background:var(--ok)}

/* ===== תרגול ===== */
.qcard{border-top:5px solid var(--c,var(--accent))}
.qtop{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.7rem}
.qtext{font-size:1.12rem;font-weight:600;margin:.2rem 0 .3rem}
.qhint{color:var(--muted);font-size:.9rem}
/* המילה או המשפט שנלמדים. גדול, מרווח, ותמיד לצד כפתור השמעה. */
.subject{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;
  background:var(--surface2);border-radius:12px;padding:.85rem 1rem;margin:.5rem 0}
.subject .word{font-family:var(--en);direction:ltr;unicode-bidi:isolate;
  font-size:1.7rem;font-weight:700;letter-spacing:.01em;line-height:1.25}
.subject .ipa{font-family:var(--en);direction:ltr;unicode-bidi:isolate;
  color:var(--muted);font-size:.95rem}
.spk{border:1px solid var(--line);background:var(--surface);border-radius:999px;
  width:2.7rem;height:2.7rem;display:inline-flex;align-items:center;justify-content:center;
  cursor:pointer;flex:none;box-shadow:var(--shadow)}
.spk:hover{border-color:var(--accent);color:var(--accent)}
.spk.sm{width:2.1rem;height:2.1rem;background:#0e9c8d;border-color:#0b7c71;color:#fff}
/* הרמקול הקטן — אותו ירוק של כפתור ההקראה הגדול, התקן המשותף */
.spk.sm:hover{background:#0b7c71;border-color:#0b7c71;color:#fff}
.spk.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.opts{display:grid;gap:.6rem;margin-top:.9rem}
.orow{display:flex;gap:.45rem;align-items:center;min-width:0}
/* min-width:0 — פריט grid נולד עם min-width:auto, ולכן משפט ארוך
   באפשרות היה מרחיב את השורה מעבר למכל ודוחף את הרמקול מחוץ למסך. */
.orow .opt{flex:1;min-width:0}
@media(min-width:560px){.opts.two{grid-template-columns:1fr 1fr}}
.opt{display:flex;align-items:center;gap:.6rem;text-align:start;width:100%;
  border:2px solid var(--line);background:var(--surface);border-radius:12px;
  padding:.8rem .9rem;cursor:pointer;font-size:1.02rem;font-weight:600;min-height:3.1rem}
.opt:hover{border-color:var(--accent)}
.opt .k{width:1.9rem;height:1.9rem;border-radius:8px;background:var(--surface2);
  display:inline-flex;align-items:center;justify-content:center;font-size:.85rem;
  font-weight:800;color:var(--muted);flex:none}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .k{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .k{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.55}
/* בחירה במבחן היא בחירה, לא תשובה נכונה. במסכי התרגול הצבע
   הירוק אומר "צדקת", ובמבחן אסור לו להופיע כלל — הוא נותן
   משוב שגוי לכל בחירה. ניטרלי, ורק מסמן מה סומן. */
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);margin-inline-start:3px}
.dot.ok{background:var(--ok);border-color:var(--ok)}
.dot.no{background:var(--bad);border-color:var(--bad)}
.dot.flag{box-shadow:0 0 0 2px var(--accent)}

/* אריחי בניית משפט. הסדר הוא התרגיל, ולכן האריח חייב להיראות כמשהו
   שאפשר להרים — מסגרת מלאה ורקע משלו, לא טקסט על רקע הכרטיס. */
.tiles{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:.7rem}
.tile{font-family:var(--en);direction:ltr;border:2px solid var(--line);
  background:var(--surface);border-radius:10px;padding:.5rem .8rem;font-weight:600;
  cursor:pointer;font-size:1.02rem;min-height:2.7rem}
.tile:hover{border-color:var(--accent)}
.slot{min-height:3.2rem;border:2px dashed var(--line);border-radius:12px;
  background:var(--surface2);padding:.5rem;display:flex;flex-wrap:wrap;gap:.45rem;
  align-items:center;direction:ltr}
.slot.ok{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.slot.bad{border-style:solid;border-color:var(--bad);background:var(--bad-soft)}
.slot .tile{background:var(--surface)}

/* ===== משוב ===== */
.fb{margin-top:.9rem;border-radius:12px;padding:.85rem 1rem;border:1px solid transparent}
.fb.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.fb.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.fb b{display:block;font-size:1.02rem;margin-bottom:.2rem}
.fb .body{color:var(--ink);font-weight:500;font-size:.95rem}
.why{margin-top:.55rem;padding-top:.55rem;border-top:1px dashed currentColor;color:var(--ink);
  font-weight:500;font-size:.93rem}

/* ===== קטע קריאה ===== */
/* איור בתוך כרטיס שאלה. הצבע יורש מ-color, ולכן אותו SVG נראה
   נכון גם בערכה הבהירה וגם בכהה בלי גרסה שנייה. */
.figure{margin:.7rem 0;padding:.6rem;border:1px solid var(--line);border-radius:12px;
  background:var(--surface2);color:var(--ink);overflow-x:auto}
.figure svg{display:block;max-width:100%}
/* המבחן המדומה: השאלות זו אחר זו, כמו חוברת בחינה. */
.simq{border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;margin:.8rem 0;
  background:var(--surface)}
.simq.miss{border-color:var(--warn)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.simn{font-weight:800;color:var(--muted);font-size:.86rem}
.simbar{position:sticky;top:0;z-index:5;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:.6rem .8rem;margin:.8rem 0;display:flex;gap:.6rem;
  align-items:center;flex-wrap:wrap;box-shadow:var(--shadow)}
.clock{font-weight:800;font-variant-numeric:tabular-nums;font-size:1.1rem}
.clock.low{color:var(--bad)}
.passage{background:var(--surface2);border-radius:12px;padding:1rem 1.1rem;margin:.6rem 0;
  font-family:var(--en);direction:ltr;unicode-bidi:isolate;font-size:1.08rem;line-height:2}
.passage .s{border-radius:5px;padding:.05em .12em;cursor:pointer}

/* --- מנוע ההדגמה. הקוד כאן זהה בכל האפליקציות; רק DEMO_SCRIPT משתנה. --- */
var DEMO={on:false,i:0,timer:null,extra:[],bar:null,txt:null,step:null,fill:null,btn:null};

/* עוזרים לתסריט. כולם מחזירים false כשהאיבר אינו על המסך, כדי
   שצעד שלא מצא את מה שחיפש ידלג ולא יפיל את ההדגמה כולה. */
function demoEl(s){return typeof s==="string"?document.querySelector(s):s}
function demoShow(s){
  var e=demoEl(s); if(!e)return false;
  try{e.scrollIntoView({behavior:"smooth",block:"center"})}catch(err){try{e.scrollIntoView()}catch(err2){}}
  return true;
}
/* מדגיש את האיבר, ורק אז לוחץ — צופה שלא ראה לאן נלחץ לא הבין
   מה קרה. לכן אין צעד קצר מ-1200 אלפיות בתסריטים. */
function demoTap(s){
  var e=demoEl(s); if(!e||e.disabled)return false;
  demoShow(e);
  e.classList.add("demo-tap");
  DEMO.extra.push(setTimeout(function(){
    e.classList.remove("demo-tap");
    /* המסך מצטייר מחדש כל הזמן. אם האיבר שסומן כבר אינו במסמך,
       מחפשים אותו שוב לפי אותו בורר — לחיצה על איבר מת אינה
       עושה דבר, וזה בדיוק צעד שנראה כאילו נתקע. */
    var live=(typeof s==="string"&&!document.contains(e))?demoEl(s):e;
    if(DEMO.on&&live&&!live.disabled&&document.contains(live))try{live.click()}catch(err){}
  },430));
  return true;
}
function demoClick(s){
  var e=demoEl(s); if(!e||e.disabled)return false;
  try{e.click()}catch(err){return false}
  return true;
}
/* הקלדה אות אחר אות, עם אירוע input אמיתי — שדה חיפוש שמאזין
   ל-input לא היה מגיב להשמה ישירה ל-value. */
function demoType(s,text){
  var e=demoEl(s); if(!e)return false;
  demoShow(e); try{e.focus()}catch(err){}
  e.value=""; var i=0;
  var t=setInterval(function(){
    if(!DEMO.on||!e.parentNode){clearInterval(t);return}
    e.value=String(text).slice(0,++i);
    e.dispatchEvent(new Event("input",{bubbles:true}));
    if(i>=String(text).length)clearInterval(t);
  },85);
  DEMO.extra.push(t);
  return true;
}
function demoQuiet(){
  try{if(window.speechSynthesis)speechSynthesis.cancel()}catch(e){}
  try{if(typeof stopSpeak==="function")stopSpeak()}catch(e){}
}

function demoMountUI(){
  var st=document.createElement("style");
  st.id="demo-style"; st.textContent=DEMO_CSS;
  (document.head||document.documentElement).appendChild(st);

  var b=document.createElement("button");
  b.id="demo-start"; b.type="button";
  b.innerHTML='<span aria-hidden="true">▶</span><span>התחל הדגמה</span>';
  b.addEventListener("click",demoStart);
  document.body.appendChild(b);

  var bar=document.createElement("div");
  bar.id="demo-bar"; bar.hidden=true;
  bar.setAttribute("role","status");
  bar.setAttribute("aria-live","polite");
  bar.innerHTML='<div id="demo-sub"><p id="demo-txt"></p>'+
    '<div id="demo-meta"><span id="demo-step"></span>'+
    '<button id="demo-exit" type="button">יציאה · ESC</button></div>'+
    '<div id="demo-prog"><i></i></div></div>';
  document.body.appendChild(bar);

  DEMO.btn=b; DEMO.bar=bar;
  DEMO.txt=document.getElementById("demo-txt");
  DEMO.step=document.getElementById("demo-step");
  DEMO.fill=bar.querySelector("#demo-prog i");
  document.getElementById("demo-exit").addEventListener("click",function(){demoStop()});
  document.addEventListener("keydown",demoKey,true);
}

/* ESC יוצא. הקשבה בשלב הלכידה, כדי שמסך שכבר מטפל ב-Escape
   לא יבלע את המקש לפני שההדגמה ראתה אותו. */
function demoKey(e){
  if(!DEMO.on)return;
  if(e.key==="Escape"||e.keyCode===27){
    e.preventDefault(); e.stopPropagation();
    demoStop();
  }
}

function demoStart(){
  if(DEMO.on)return;
  DEMO.on=true; DEMO.i=0;
  DEMO.btn.hidden=true; DEMO.bar.hidden=false;
  document.documentElement.classList.add("demo-running");
  demoNext();
}

function demoNext(){
  if(!DEMO.on)return;
  if(DEMO.i>=DEMO_SCRIPT.length){demoStop();return}
  var it=DEMO_SCRIPT[DEMO.i++]||{};
  var d=Math.max(600,it.duration||3000);
  DEMO.txt.textContent=it.subtitle||"";
  DEMO.step.textContent=DEMO.i+" / "+DEMO_SCRIPT.length;
  DEMO.fill.style.transition="none"; DEMO.fill.style.width="0";
  void DEMO.fill.offsetWidth;
  DEMO.fill.style.transition="width "+d+"ms linear";
  DEMO.fill.style.width="100%";
  if(typeof it.action==="function"){
    try{it.action()}catch(err){if(window.console)console.warn("demo:",err)}
  }
  DEMO.timer=setTimeout(demoNext,d);
}

function demoStop(){
  DEMO.on=false;
  if(DEMO.timer){clearTimeout(DEMO.timer);DEMO.timer=null}
  DEMO.extra.forEach(function(t){clearTimeout(t);clearInterval(t)});
  DEMO.extra=[];
  var m=document.querySelectorAll(".demo-tap"),i;
  for(i=0;i<m.length;i++)m[i].classList.remove("demo-tap");
  if(DEMO.bar)DEMO.bar.hidden=true;
  if(DEMO.btn)DEMO.btn.hidden=false;
  document.documentElement.classList.remove("demo-running");
  demoQuiet();
}

  if(!document.getElementById("demo-start"))demoMountUI();
}

  else window.addEventListener("load",function(){setTimeout(demoMount,0)});
}

  var ls=(navigator.languages||[navigator.language||"he"]).map(function(x){

}

    state.streak=(state.lastDay===yi)?(state.streak||0)+1:1;

  if(_voicesP)return _voicesP;

    poll=setInterval(function(){if(allVoices().length)finish()},120);
    /* תקרה: יש מכשירים שמחזירים רשימה ריקה לצמיתות ומדברים מצוין.
       עדיף לדבר בקול ברירת מחדל מאשר לשתוק לנצח. */
    cap=setTimeout(finish,4000);

var LANG_HINT={he:/עברית|hebrew|ivrit/i,ar:/العربية|arabic/i,ru:/русский|russian/i,en:/english/i};

   נשי שמותקן נבחר מיד, בלי שינוי הגובה ובלי הודעה. */
function femNote(pool){
  if(!pool||!pool.length)return "";
  for(var i=0;i<pool.length;i++)if(vGender(pool[i])==="f")return "";

     מחזיק את ההגדרה תחת "נגישות" — "ניהול כללי" הוא מסלול של
     סמסונג בלבד; אייפד מדווח מאז iPadOS 13 כמו מק ונבדל ממנו רק
     במסך מגע; ומשתמש מק קיבל עד כה הוראות של ווינדוס, כי כל מה
     שאינו אנדרואיד או אייפון נפל לשם. */

         :(/iPhone|iPad|iPod/i.test(ua)||(/Macintosh/i.test(ua)&&navigator.maxTouchPoints>1))?"femIos"

  if(!("speechSynthesis" in window)){ show(M.noSup); return }
  var list=[]; try{ list=speechSynthesis.getVoices()||[] }catch(e){}
  try{ speechSynthesis.cancel() }catch(e){}
  var u;
  try{ u=new SpeechSynthesisUtterance(M.say) }
  catch(e){ show(M.mkFail+e.message); return }
  u.lang=(LANGS[state.lang||"he"]||LANGS.he).tts; u.volume=1; u.rate=1; u.pitch=1;
  var done=false;
  u.onstart=function(){ done=true; show(M.okN[0]+list.length+M.okN[1]) };
  u.onerror=function(e){ done=true;
    var er=(e&&e.error)||M.unk;
    if(er==="interrupted"||er==="canceled"){ show(M.ok); return }
    show(M.engine[0]+er+" · "+list.length+M.engine[1]); };
  try{ speechSynthesis.speak(u) }
  catch(e){ show(M.spFail+e.message); return }

/* ------------------------------------------------------------
   דור ההקראה. speechSynthesis.cancel() אינו מבטל setTimeout:
   כרום יורה onend על האמירה שבוטלה, המקטע הבא נרשם בכל זאת,
   וכעבור SEG_GAP ההקראה הישנה חוזרת מעל החדשה — שני קולות
   במקביל. מונה אחד פותר את זה: כל הקראה מקבלת מספר, stopSpeak
   מקדם אותו, ומקטע מדור ישן פשוט אינו מדבר.
   ------------------------------------------------------------ */
var _sayGen=0;
function speakDevice(text,code,rate){
  if(!("speechSynthesis" in window))return false;
  try{speechSynthesis.cancel()}catch(e){}
  var my=++_sayGen;
  /* האמירה יוצאת מיד, בתוך הלחיצה. קודם היא נעטפה ב-voicesReady,
     שממתין לרשימת הקולות ועד ארבע שניות אם היא לא מגיעה — ואמירה
     שיוצאת ארבע שניות אחרי המגע נזרקת בשקט באנדרואיד ובספארי.
     כשהרשימה כבר כאן, בוחרים קול ומדברים. כשהיא ריקה — מדברים
     בכל זאת, עם u.lang בלבד: קול ברירת מחדל בשפה הנכונה עדיף על
     שתיקה, ויש מכשירים שמחזירים רשימה ריקה לצמיתות ומדברים היטב.
     voicesReady נשאר בשימוש למסך בחירת הקול, שם ההמתנה במקומה. */
  (function(){
    try{
      var v=bestVoice(code), lang=(v&&v.lang)||code;
      var segs=segments(String(text)), rt=tuneRate(lang,clamp(rate,0.55,1.4));
      var pit=femLift(v);
      (function sayseg(k){
        if(my!==_sayGen)return;   /* ההקראה הזאת בוטלה — המקטע הבא לא יוצא */
        if(k>=segs.length){ hlClear(); ttsOK(); return }
        var seg=segs[k];
        var u=new SpeechSynthesisUtterance(seg.text);
        u.lang=lang;
        if(v){ try{ u.voice=v }catch(e2){} }
        u.rate=rt; u.pitch=pit; u.volume=1;
        u.onboundary=function(e){if(!e.name||e.name==="word")hlAt(seg.start+e.charIndex)};
        u.onend=function(){
          if(k+1<segs.length) setTimeout(function(){sayseg(k+1)},SEG_GAP);
          else { hlClear(); ttsOK() }
        };
        u.onerror=function(e){ttsFail(e&&e.error)};
        speechSynthesis.speak(u);
      })(0);
    }catch(e){}
  })();
  return true;
}
/* lang: "en" לחומר הנלמד, או קוד שפת האם להוראה. */
function speak(text,lang,rateMul){
  /* כל טקסט שמגיע להקראה מנוקה מתגיות. חלק מהקריאות כבר מנקות
     לבד, וניקוי חוזר אינו משנה דבר — אבל בלעדיו כל מחרוזת שנשארה
     עם <sub> או <span class="frac"> הוקראה בקול כתגית: הסטודנט
     שמע "span class frac" באמצע השאלה. */
  text=plainOf(String(text||"")).trim(); if(!text)return;
  lang=lang||"en";
  var code=lang==="en"?EN_TTS:LANGS[lang].tts;
  var rate=clamp(state.rate*(rateMul||1),0.55,1.4);
  stopSpeak();
  var my=_sayGen;   /* גם תשובת רשת שמגיעה אחרי עצירה לא תושמע */
  if(gemOn()){
    var vid=gvOf(state.gemVoice).id;
    var ck=lang+"|"+vid+"|"+rate.toFixed(2)+"|"+text;
    if(gCache[ck]){playUrl(gCache[ck],text,code,rate);return}
    gBusy=true; renderSpeakState();
    gSynth(text,vid,rate,lang).then(function(u){
      if(my!==_sayGen)return;
      gCache[ck]=u; gBusy=false; renderSpeakState(); playUrl(u,text,code,rate);
    }).catch(function(){
      gBusy=false; renderSpeakState(); speakDevice(text,code,rate);
    });
    return;
  }
  speakDevice(text,code,rate);
}
function playUrl(url,text,code,rate){
  gStop();
  /* משתמשים באלמנט ששוחרר במגע ולא יוצרים חדש. */
  if(!GEL)GEL=new Audio();
  gAudio=GEL; gAudio.src=url;
  gAudio.play().catch(function(){speakDevice(text,code,rate)});
}
function stopSpeak(){_sayGen++;gStop();hlClear();try{if(window.speechSynthesis)speechSynthesis.cancel()}catch(e){}}
/* עוזבים את הדף — הקול נעצר. בלעדיו הוא ממשיך ברקע אחרי מעבר לטאב
   אחר, ולפעמים נתקע עד סגירת הדפדפן. */
try{document.addEventListener("visibilitychange",function(){
  if(document.hidden)stopSpeak();

/* iOS לא ישמיע כלום עד שאמירה אחת יצאה מתוך handler של מגע אמיתי.
   אמירה אוטומטית בטעינת הדף נבלעת בשקט — בלי חריגה, בלי לוג, בלי
   דרך לדעת. משחררים פעם אחת עם אמירה ריקה.
   חשוב: קריאה ישירה, בלי voicesReady — הבטחה שוברת את שרשרת המגע
   ו-Safari כבר לא יזהה את האמירה כיוזמת משתמש. */
try{document.addEventListener("pointerdown",function(){
  try{speechSynthesis.speak(new SpeechSynthesisUtterance(""))}catch(e){}
  /* ואותו דבר לאלמנט השמע: מקור שקט, play בתוך המגע עצמו. */
  try{
    if(!GEL)GEL=new Audio();
    GEL.src=SILENT_WAV;
    var pr=GEL.play();
    if(pr&&pr.then)pr.then(function(){try{GEL.pause();GEL.currentTime=0}catch(e){}},function(){});
  }catch(e){}
},{once:true});}catch(e){}

/* ============================================================
   7. תוכן
   ------------------------------------------------------------
   בנק שאלות כתוב, ולא מחולל. באזרחות אין נוסחה שממנה נגזרת
   שאלה: הניסוח המדויק הוא החומר הנלמד, ומסיח שנבנה אוטומטית
   מנוסח אחר היה יוצא או מופרך מדי או נכון בעצמו.

   Q(id, q, opts, ok, hint, ex, fig)
     id   — מזהה יציב לפריט. הוא נכנס לסטטיסטיקה של הלומד, ולכן
            אסור לו להשתנות כשמוסיפים פריט לפניו.
     q    — נוסח השאלה, בארבע שפות.
     opts — ארבע תשובות, כל אחת בארבע שפות. תמיד ארבע: שלוש
            אפשרויות הן ניחוש של אחד משלושה.
     ok   — אינדקס התשובה הנכונה במערך opts (0..3). הסדר על
            המסך מעורבב בכל הצגה, ולכן האינדקס אינו רמז.
     hint — רמז שמכוון לחשיבה ואינו מוסר את התשובה.
     ex   — ההסבר שנפתח אחרי המענה, גם כשענו נכון.
     fig  — מפתח איור מתוך FIGS, או null. אופציונלי בהגדרה:
            רוב השאלות באזרחות הן טקסט בלבד.

   כל שדה קיים בארבע השפות. אזרחות נלמדת בשפת האם — מי שקורא
   בקושי בעברית לא ילמד ממנה מדרג נורמות, ולכן התוכן עצמו
   מתורגם ולא רק הממשק.

   מקור: תוכנית הלימודים בתנ״ך של משרד החינוך, ומבנה שאלונים 1261/1262. הניסוח מקורי של בקול, עם קרדיט וקישור למשרד החינוך.
   השאלות נכתבו לאפליקציה הזאת ואינן העתק של בחינה.
   ============================================================ */
function Q(id,q,opts,ok,hint,ex,fig,wrong){
  return {id:id,q:q,o:opts,ok:ok,hint:hint,ex:ex,fig:fig||null,wrong:wrong||null};
}

  Q("bib-genesis-1261-1",{"he": "איזה תיאור מתאים להבטחה לאברהם?", "ar": "أي وصف يناسب الوعد لإبراهيم؟", "ru": "Какое описание подходит к «Обещание Аврааму»?", "en": "Which description fits promise to Abraham?"},[{"he": "בבראשית י״ב מסופר על קריאה לצאת מארצו והבטחה לזרע ולברכה.", "ar": "في التكوين 12 ترد دعوة للخروج من الأرض ووعد بالنسل والبركة.", "ru": "В Бытии 12 рассказаны призыв оставить страну и обещание потомства и благословения.", "en": "Genesis 12 recounts a call to leave his land and a promise of descendants and blessing."},{"he": "בבראשית כ״ג אברהם קונה מקום לקבורת שרה במשא ומתן גלוי.", "ar": "في التكوين 23 يشتري إبراهيم موضعًا لدفن سارة في تفاوض علني.", "ru": "В Бытии 23 Авраам покупает место для погребения Сарры путём открытых переговоров.", "en": "In Genesis 23 Abraham buys a burial place for Sarah through public negotiation."},{"he": "בבראשית מ״א יוסף מפרש את החלומות כשנות שובע ואחריהן שנות רעב ומציע להיערך מראש.", "ar": "في التكوين 41 يفسر يوسف الحلمين بسنوات خصب تليها سنوات جوع ويقترح الاستعداد.", "ru": "В Бытии 41 Иосиф толкует сны как годы изобилия, затем голода, и предлагает подготовиться.", "en": "In Genesis 41 Joseph reads the dreams as years of plenty followed by famine and proposes preparation."},{"he": "בבראשית מ״ב ואילך האחים באים למצרים לקנות מזון ואינם מזהים תחילה את יוסף.", "ar": "في التكوين 42 وما بعده يأتي الإخوة إلى مصر لشراء الطعام ولا يعرفون يوسف أولًا.", "ru": "В Бытии 42 и далее братья приходят за пищей в Египет и сначала не узнают Иосифа.", "en": "In Genesis 42 onward the brothers travel to Egypt for food and at first do not recognise Joseph."}],0,{"he": "חפשו את הפרט שמבדיל אותו מן האחרים.", "ar": "ابحثوا عن التفصيل الذي يميزه عن غيره.", "ru": "Ищите отличие от остальных вариантов.", "en": "Look for the detail that separates it from the others."},{"he": "הבטחה זו ניתנת עם הקריאה לאברהם ללכת מארצו.", "ar": "يأتي الوعد مع دعوة إبراهيم إلى مغادرة أرضه.", "ru": "Обещание сопровождает призыв Авраама покинуть родину.", "en": "The promi   Q("bib-exodus-1261-1",{"he": "איזה תיאור מתאים ללידת משה?", "ar": "أي وصف يناسب ولادة موسى؟", "ru": "Какое описание подходит к «Рождение Моисея»?", "en": "Which description fits birth of Moses?"},[{"he": "בשמות ב׳ התינוק מוסתר, מונח בתיבה על היאור ונמצא בידי בת פרעה.", "ar": "في الخروج 2 يُخفى الرضيع ويوضع في سلة على النهر وتعثر عليه ابنة فرعون.", "ru": "В Исходе 2 младенца прячут, кладут в корзину у Нила, и его находит дочь фараона.", "en": "In Exodus 2 the infant is hidden, placed in a basket by the Nile and found by Pharaoh’s daughter."},{"he": "בשמות ג׳ משה נתקל בסנה בוער שאינו נשרף, ונקרא לשליחות.", "ar": "في الخروج 3 يرى موسى عليقة تشتعل ولا تحترق ويُدعى إلى مهمة.", "ru": "В Исходе 3 Моисей видит куст, который горит и не сгорает, и получает поручение.", "en": "In Exodus 3 Moses encounters a bush that burns without being consumed and receives a mission."},{"he": "בשמות י״ב מתוארת המכה האחרונה במצרים, ואחריה פרעה קורא לישראל לצאת.", "ar": "في الخروج 12 ترد الضربة الأخيرة في مصر، وبعدها يأمر فرعون بني إسرائيل بالخروج.", "ru": "В Исходе 12 описана последняя казнь в Египте, после которой фараон велит израильтянам уйти.", "en": "Exodus 12 describes the final plague in Egypt, after which Pharaoh tells the Israelites to leave."},{"he": "בשמות י״ד העם עובר בים לאחר מרדף המצרים; המים שבים עם סיום המעבר.", "ar": "في الخروج 14 يعبر الشعب البحر بعد ملاحقة المصريين، ثم تعود المياه.", "ru": "В Исходе 14 народ переходит море при преследовании египтян; затем воды возвращаются.", "en": "In Exodus 14 the people cross the sea under Egyptian pursuit; the waters then return."}],0,{"he": "חפשו את הפרט שמבדיל אותו מן האחרים.", "ar": "ابحثوا عن التفصيل الذي يميزه عن غيره.", "ru": "Ищите отличие от остальных вариантов.", "en": "Look for the detail that separates it from the others."},{"he": "הסיפור קושר פעולות של כמה נשים להצלת התינוק.", "ar": "يربط السرد أفعال عدة نساء بإنقاذ الرضيع.", "ru": "Повествование связывает действия нескольких женщин со спасением ребёнка.", "en": "The story   Q("bib-choice-1261-1",{"he": "איזה תיאור מתאים לחזון העצמות היבשות?", "ar": "أي وصف يناسب رؤيا العظام اليابسة؟", "ru": "Какое описание подходит к «Видение сухих костей»?", "en": "Which description fits vision of dry bones?"},[{"he": "ביחזקאל ל״ז חזון העצמות מציג תחייה כדימוי לתקווה לעם מיואש.", "ar": "في حزقيال 37 تعرض رؤيا العظام حياة جديدة صورةً لأمل شعب يائس.", "ru": "В Иезекииле 37 оживление костей служит образом надежды для отчаявшегося народа.", "en": "In Ezekiel 37 the bones’ revival pictures hope for a despairing people."},{"he": "בירמיהו א׳ הנביא חושש שאינו יודע לדבר מפני שהוא צעיר, ונענה שלא יישאר לבדו.", "ar": "في إرميا 1 يخاف النبي لأنه فتى لا يحسن الكلام، فيُطمأن بأنه ليس وحده.", "ru": "В Иеремии 1 пророк опасается, что молод и не умеет говорить, и получает заверение в поддержке.", "en": "In Jeremiah 1 the prophet worries that he is young and cannot speak; he is reassured of support."},{"he": "בחוקי התורה חוזרות דרישות להגן על מי שאין לו כוח חברתי, כגון גר, יתום ואלמנה.", "ar": "تتكرر في قوانين التوراة مطالب بحماية من يفتقر إلى القوة الاجتماعية كالوافد واليتيم والأرملة.", "ru": "В законах Торы повторяется требование защищать уязвимых, включая пришельца, сироту и вдову.", "en": "Torah laws repeatedly call for protecting those with little social power, such as the stranger, orphan and widow."},{"he": "בקהלת א׳ תנועות חוזרות בטבע משמשות רקע לשאלת התועלת בעמל האדם.", "ar": "في الجامعة 1 تشكل حركات الطبيعة المتكررة خلفية للسؤال عن جدوى تعب الإنسان.", "ru": "В Екклесиасте 1 повторяющиеся движения природы служат фоном вопроса о пользе человеческого труда.", "en": "In Ecclesiastes 1 recurring motions of nature frame a question about the gain from human toil."}],0,{"he": "חפשו את הפרט שמבדיל אותו מן האחרים.", "ar": "ابحثوا عن التفصيل الذي يميزه عن غيره.", "ru": "Ищите отличие от остальных вариантов.", "en": "Look for the detail that separates it from the others."},{"he": "הנביא מסביר את החזון בהקשר של מצב העם.", "ar": "يشرح النبي الرؤيا في سياق حال الشعب.", "r function itemId(tid,lv,i){return tid+"|"+lv+"|"+i}
function itemRec(id){
  if(!state.item[id])state.item[id]={n:0,ok:0};
  return state.item[id];
}
function poolOf(tp,lv){return (tp.L[lv-1]||tp.L[0]||[])}

/* בחירת פריט לתרגול. משקל גבוה לחדש, בינוני לנכשל, נמוך לנשלט. */
function chooseIndex(tid,lv,pool,avoid){
  var cand=[],i,w;
  for(i=0;i<pool.length;i++){
    if(avoid!==undefined&&i===avoid&&pool.length>1)continue;
    var r=state.item[itemId(tid,lv,i)];
    if(!r||!r.n)w=6;                            /* חדש */
    else if(r.ok<r.n)w=1+Math.min(4,r.n-r.ok);  /* נכשל בעבר */
    else w=1;                                   /* נשלט */
    for(var j=0;j<w;j++)cand.push(i);
  }
  if(!cand.length)return 0;
  return pick(cand);
}
/* בחירת פריט למבחן. אחידה, ואינה נוגעת ב-state כלל. */
function pureIndex(pool,avoid){
  var cand=[],i;
  for(i=0;i<pool.length;i++){
    if(avoid!==undefined&&i===avoid&&pool.length>1)continue;
    cand.push(i);
  }
  return cand.length?pick(cand):0;
}


/* ------------------------------------------------------------
   ניקוי להקראה בלבד. המסך אינו משתנה ממנו.

   הגרשיים העבריים משמשים לשני דברים: ראשי תיבות (חוק־יסוד,
   בג״ץ) ומירכאות (״מדינה יהודית״). המנוע מכיר רק את הראשון.
   הכלל שמפריד: בראשי תיבות באה אחרי הגרשיים אות עברית אחת
   בדיוק וסוף מילה. הסיכון א־סימטרי — מירכאה שהוסרה אינה
   יכולה להזיק, מירכאה שנשארה כן.

   המירכאות המסולסלות (“ ”) משמשות כאן לציטוט מונחים בלבד,
   ולכן הן נופלות תמיד. הקו המפריד הופך לפסיק, כדי שהקול
   ייעצר במקום לרוץ הלאה.
   ------------------------------------------------------------ */
function saySpell(x){
  return String(x==null?"":x)
    .replace(/[“”‘’]/g,"")
    .replace(/״/g,function(m,i,str){
      return /^[א-ת](?![א-ת])/.test(str.slice(i+1))?m:"";
    })
    .replace(/\s—\s/g,", ");
}

function O(html,ok,why){return {h:html,ok:!!ok,why:why||""}}

/* בונה שאלה מפריט אחד. סדר האפשרויות מעורבב בכל בנייה, ולכן
   האינדקס ok שבתוכן אינו מגיע למסך לעולם. */
function buildFromItem(it){
  var opts=it.o.map(function(o,i){return O(esc(gl(o)),i===it.ok,it.wrong&&it.wrong[i]?gl(it.wrong[i]):"")});
  var ans=gl(it.o[it.ok]);
  return {
    type:"mcq",
    prompt:t("qPick"),
    lead:gl(it.q),
    fig:figHtml(it.fig),
    opts:shuffle(opts),
    answer:ans,
    /* מה שנאמר אחרי המענה: השאלה, התשובה הנכונה, וההסבר.
       תשובה בלי ההסבר נשמעת כמו עובדה לשינון, וזה בדיוק מה
       שהאפליקציה הזאת קיימת כדי להחליף. */
    say:gl(it.q)+" "+ans+". "+gl(it.ex),
    reveal:it
  };
}
function buildQuestion(tid,lv,avoid,pure){
  var tp=topicOf(tid); if(!tp)return null;
  var pool=poolOf(tp,lv);
  if(!pool.length)return null;
  var idx=pure?pureIndex(pool,avoid):chooseIndex(tid,lv,pool,avoid);
  var it=pool[idx];
  if(!it)return null;
  var q=buildFromItem(it);
  q.tid=tid; q.lv=lv; q.idx=idx; q.id=itemId(tid,lv,idx);
  q.hint=gl(it.hint);
  return q;
}

/* ============================================================
   מבחן מדומה
   ------------------------------------------------------------
   עשרים שאלות מכל הנושאים ומכל הרמות, בחוברת אחת שגוללים בה —
   ולא שאלה־שאלה. מי שקורא לאט צריך לראות כמה נשאר, לחזור אחורה
   ולשנות תשובה; ניווט שמסתיר את שאר השאלות לוקח ממנו בדיוק את זה.

   המבחן אינו נשמר. הוא מצב זמני בזיכרון בלבד, ורענון הדף מתחיל
   אותו מחדש — זו הצהרה ולא פער: שעון שממשיך לרוץ בין ביקורים
   הוא בדיוק המקום שבו נולדים באגים שקשה לשחזר.
   ============================================================ */
var SIM_N=20, SIM_MIN=30;
var SIM={on:false,done:false,q:[],ans:[],end:0,tick:null};

function simStop(){if(SIM.tick){clearInterval(SIM.tick);SIM.tick=null}}
function simFmt(ms){
  if(ms<0)ms=0;
  var sec=Math.round(ms/1000),m=Math.floor(sec/60),c=sec%60;
  return m+":"+(c<10?"0":"")+c;
}
function simLeftN(){
  var n=0,i;
  for(i=0;i<SIM.ans.length;i++)if(SIM.ans[i]<0)n++;
  return n;
}
function simRight(){
  var n=0,i;
  for(i=0;i<SIM.q.length;i++)if(SIM.ans[i]>=0&&SIM.q[i].opts[SIM.ans[i]].ok)n++;
  return n;
}
function simStart(){
  var pairs=[],qs=[],i,q;
  TOPICS.forEach(function(tp){for(var l=1;l<=3;l++)pairs.push([tp.id,l])});
  shuffle(pairs);
  for(i=0;i<pairs.length&&qs.length<SIM_N;i++){
    q=buildQuestion(pairs[i][0],pairs[i][1],undefined,true);
    if(q)qs.push(q);
  }
  /* פחות צמדי נושא-רמה מ-SIM_N: סבב נוסף, בלי לחזור על אותו פריט. */
  var guard=0;
  while(qs.length<SIM_N&&guard<400){
    var pr=pairs[guard%pairs.length]; guard++;
    q=buildQuestion(pr[0],pr[1],undefined,true);
    if(!q)continue;
    var dup=false,k;
    for(k=0;k<qs.length;k++)if(qs[k].id===q.id){dup=true;break}
    if(!dup)qs.push(q);
  }
  SIM.q=qs;
  SIM.ans=qs.map(function(){return -1});
  SIM.on=true; SIM.done=false; SIM.end=Date.now()+SIM_MIN*60000;
  simArm();
}
function simArm(){
  simStop();
  if(SIM.on&&!SIM.done)SIM.tick=setInterval(simClock,1000);
}
function simClock(){
  var el=$("#simclock");
  /* המסך הוחלף — אין מה לעדכן, והשעון נעצר מעצמו. */
  if(!el){simStop();return}
  var left=SIM.end-Date.now();
  el.textContent=simFmt(left);
  if(left<=60000)el.classList.add("low");
  if(left<=0){simStop();simSubmit()}
}
/* ההגשה היא גם רגע הרישום: עד כאן לא נספרה אף תשובה, כדי
   שהמבחן לא ידחוף לבנק הטעויות שאלה שהנבחן עוד עמד לשנות. */
function simSubmit(){
  if(!SIM.on||SIM.done)return;
  simStop();
  var i;
  for(i=0;i<SIM.q.length;i++){
    var q=SIM.q[i],pk=SIM.ans[i];
    recordItem(q.tid,q.lv,q.id,pk>=0&&!!q.opts[pk].ok);
  }
  SIM.done=true; save(); render(); window.scrollTo(0,0);
}

function screenSim(){
  var h='<div class="wrap"><h2 style="margin:1.1rem 0 .3rem;font-size:1.4rem">'+esc(t("simT"))+"</h2>";
  if(!SIM.on){
    h+='<div class="card"><p style="margin:0 0 .8rem;color:var(--muted)">'+esc(t("simD"))+"</p>"+
       '<button class="btn pri" data-a="simstart">'+ic("play",16)+" "+esc(t("simStart"))+"</button></div>";
    return h+"</div>"+fbar();
  }
  if(SIM.done){

     להיבחן לא בהכרח פתח את האפליקציה הזאת אי פעם. */
  /* תלמיד שפתח את דף המושגים באמצע מבחן חייב דרך חזרה מפורשת.
     סרגל הניווט הרגיל לא מכיר את המבחן ולא יחזיר אותו אליו. */
  if(view==="formulas"&&SIT.spec){
    $("#app").innerHTML=hdr()+'<div class="wrap" style="padding-top:14px"><div class="row">'+

  var body=state.screen==="prog"?screenProg():
           state.screen==="sim" ?screenSim():

/* ============================================================
   מתאם למסכי המבחן
   ------------------------------------------------------------
   מסכי המבחן נכתבו לאפליקציות המתמטיקה. שם השאלה נראית אחרת —
   ask, options, topicName — וכאן היא prompt, lead ו-opts. גם
   הניווט שונה: שם משתנה view, וכאן state.screen. ההמרה נעשית
   כאן, במקום אחד, ולא בפיזור תנאים בתוך המסכים.
   ============================================================ */
var view="";   /* מסכי המבחן בלבד. שאר האפליקציה מנווטת ב-state.screen. */
/* שמות הרמות כבר מתורגמים באפליקציה (lv1..lv3). המסכים קוראים
   LVL[i] וגם LVL.map, ולכן זה חייב להיות מערך אמיתי — ומכיוון
   שהוא מערך, הוא מתרענן בכל ציור מסך, אחרת החלפת שפה לא הייתה
   משנה את מה שכתוב במבחן. */
var LVL=["","",""];
function lvlSync(){LVL[0]=t("lv1");LVL[1]=t("lv2");LVL[2]=t("lv3")}
var LVL_C=["var(--c-sound)","var(--c-words)","var(--c-talk)"];
/* מסכי המבחן שואלים אם ההקראה פעילה. באפליקציה הזאת אין מתג כזה —
   ההקראה זמינה תמיד דרך כפתורי ההשמעה — ולכן התשובה קבועה. */
if(!state.settings)state.settings={tts:true};
/* לא לכל אפליקציה יש דף נוסחאות. מקטע המבחן הגיע מאפליקציה שיש
   בה אחד, והציע אותו גם כאן — כפתור שמוביל למסך שאינו קיים. */
var HAS_FORMULAS=(typeof viewFormulas==="function");
function topicById(id){return topicOf(id)}
/* אין track ב-blankState של האפליקציה הזאת, ולכן בכניסה הראשונה
   הוא undefined ורשימת הנושאים הייתה יוצאת ריקה. נופלים למסלול
   הראשון במקום להציג מסך בלי כלום. */
function topicsForTrack(trk){
  if(!trk)trk=(TRACKS[0]||{}).id;
  return TOPICS.filter(function(x){return x.trk===trk});
}
function topicCls(id){var tp=topicOf(id);return tp?trackOf(tp.trk).cls:""}
function areaCls(id){return topicCls(id)}
/* טקסט נקי מתוך HTML — המסכים משווים ומדווחים תשובות כטקסט. */
function plainOf(h){
  var d=document.createElement("div"); d.innerHTML=String(h||"");
  return (d.textContent||"").replace(/\s+/g," ").trim();
}
function buildQ(tid,lv){
  /* pure=true — הבחירה כאן אינה מביטה בהתקדמות הלומד. זה מה
     שמאפשר לזרע אחד לייצר את אותה שאלה בדיוק אצל המורה ואצל
     התלמיד; ראו את ההסבר בראש סעיף 8. */
  var q=buildQuestion(tid,lv,undefined,true); if(!q)return null;
  var tp=topicOf(tid);
  return {topic:tid, topicName:tp?tName(tp):"", ask:esc(q.lead||""), expr:"", fig:q.fig||"",
          options:(q.opts||[]).map(function(o){
            return {h:o.h,t:plainOf(o.h),ok:!!o.ok,why:o.why||""}}),
          say:q.say||"", hint:q.hint||""};
}


/* ============================================================
   18. מבחן כיתתי — פרסום בוואטסאפ, קבלת תשובות וציונים
   ------------------------------------------------------------
   אין שרת, ואין כוונה שיהיה. לכן המבחן אינו נשלח לשום מקום:
   הוא *נארז לתוך הקישור*. המורה מקבל קישור, שולח אותו בוואטסאפ,
   והמכשיר של התלמיד בונה מהקישור בדיוק את אותן שאלות.

   מה שהופך את זה לאפשרי הוא שכל מחולל שאלות כאן משתמש ב-
   Math.random בלבד. אם מזרעים אותו, אותו זרע מייצר את אותן
   שאלות ואת אותו סדר תשובות — אצל המורה ואצל התלמיד. הקישור
   נושא זרע ורשימת נושאים, לא עשרים שאלות מלאות, ולכן הוא נשאר
   קצר מספיק לוואטסאפ.

   שלוש מגבלות שנאמרות כאן במפורש כי הן חלק מהתכנון:
   · אין איסוף אוטומטי. התלמיד שולח קוד תשובות בוואטסאפ, והמורה
     מדביק אותו. זה המחיר של אפס שרת ואפס עלות.
   · אפשר לזייף קוד. הציון מחושב מחדש אצל המורה מתוך התשובות
     ולא נלקח מהתלמיד, אבל אין כאן הגנה קריפטוגרפית — זה מבחן
     כיתתי מעצב, לא בגרות.
   · שמות התלמידים נשארים במכשיר של המורה. הם לא עוברים דרך
     שום שרת, כי אין שרת.
   ============================================================ */
var GENV=2;                 /* גרסת המחוללים. מבחן שנוצר בגרסה אחרת
                               אינו נפתח — עדיף הודעה ברורה מאשר
                               עשרים שאלות אחרות בשקט. */
var EKEY="shlav-exams-tanakh-v1";   /* מפתח לאפליקציה הזאת בלבד */

/* --- מחולל מזורע. mulberry32: קצר, מהיר, ופיזור טוב דיו --- */
function withSeed(seed,fn){
  var real=Math.random,s=(seed>>>0)||1;
  Math.random=function(){
    s|=0; s=s+0x6D2B79F5|0;
    var t=Math.imul(s^s>>>15,1|s);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
  try{return fn()}finally{Math.random=real}
}
function hash32(str){
  var h=0x811c9dc5,i;
  for(i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193)}
  return (h>>>0);
}
/* base64url. הניקוי בפענוח אינו קוסמטי: וואטסאפ שובר מחרוזות
   ארוכות בשורות, ורווח אחד הורס את כל הקוד. */
function b64e(str){
  var bytes=new TextEncoder().encode(str),bin="",i;
  for(i=0;i<bytes.length;i+=8192)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));
  return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function b64d(s){
  s=String(s||"").replace(/[^A-Za-z0-9\-_]/g,"").replace(/-/g,"+").replace(/_/g,"/");
  while(s.length%4)s+="=";
  var bin=atob(s),bytes=new Uint8Array(bin.length),i;
  for(i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
/* הזרע של המשבצת נכנס למזהה: שני מבחנים באותם נושאים ובאותה
   רמה, שהמורה החליף באחד מהם שאלה, אינם אותו מבחן. מבחן ישן
   שאין לו זרעים מקבל בדיוק את המזהה שקיבל תמיד — אחרת ההגשות
   שכבר נקלטו אליו מתייתמות. */
function examId(spec){return hash32(spec.s+"|"+spec.q.map(function(x){
  return x[0]+x[1]+(x.length>2?"@"+x[2]:"")}).join(",")).toString(36)}
function encodeExam(spec){return b64e(JSON.stringify(spec))}
function decodeExam(code){
  try{
    var o=JSON.parse(b64d(code));
    if(!o||!o.q||!o.q.length||typeof o.s!=="number")return null;
    o.q=o.q.filter(function(x){return topicById(x[0])});
    return o.q.length?o:null;
  }catch(e){return null}
}
/* בונה את שאלות המבחן. אותו זרע → אותן שאלות, גם אצל המורה
   כשהוא בודק וגם אצל התלמיד כשהוא נבחן. */
function examQuestions(spec){
  /* מסננים נושאים שאינם מוכרים לאפליקציה הזאת, בדיוק כמו decodeExam.
     בלי הסינון buildQ מחזיר null על נושא זר, והמסך נופל על
     q.topic של null. עדיף לדלג בשקט מאשר להתרסק. */
  var pairs=(spec.q||[]).filter(function(x){return !!topicById(x[0])});
  /* מבחן שנבנה עם זרע לכל משבצת נבנה משבצת אחרי משבצת, וכל
     שאלה תלויה בזרע שלה בלבד — כך המורה יכול להחליף אחת מהן.
     מבחן ישן, בלי זרעים, חייב להיבנות בדיוק כפי שנבנה ביום
     שנשלח: אחרת הציון של מי שכבר נבחן משתנה למפרע. */
  if(pairs.length&&pairs.every(function(x){return typeof x[2]==="number"}))
    return pairs.map(function(p){return exBuildSlot(p)})
                .filter(function(q){return !!q});
  return withSeed(spec.s,function(){
    return pairs.map(function(pair){return buildQ(pair[0],pair[1])})
                .filter(function(q){return !!q});
  });
}
/* --- בחירת השאלות בידי המורה ---------------------------------
   עד כאן המורה בחר נושאים, רמה ומספר שאלות — והשאלות עצמן הוגרלו
   מאחורי גבו. הוא ראה אותן לראשונה רק אחרי שהמבחן כבר היה אצל
   התלמידים. מעכשיו כל שאלה היא משבצת נפרדת עם זרע משלה: המורה
   רואה אותה לפני השליחה, מחליף אותה בשאלה אחרת מאותו נושא,
   מסיר אותה, או מוסיף שאלה מנושא שחסר לו.

   הזרע הנפרד לכל משבצת הוא מה שמאפשר את זה. בזרם אקראי אחד
   ומשותף, כפי שהיה עד כאן, החלפה של השאלה השלישית הייתה משנה
   גם את הרביעית ואת החמישית — כלומר לא "החלפה" אלא הגרלה מחדש
   של כל מה שאחריה.

   24 ביט ולא 32: הזרע נוסע בתוך הקישור שנשלח בוואטסאפ, וזרע
   קצר יותר הוא קישור קצר יותר. שישה־עשר מיליון אפשרויות למשבצת
   הן הרבה מעבר למה שהמחולל עצמו יודע לייצר. */
function exNewSeed(){return (Math.random()*16777215)>>>0}
function exSlot(topicId,level){return [topicId,level,exNewSeed()]}
/* אותו זרע → אותה שאלה בדיוק: אצל המורה כשהוא בוחר, ואצל
   התלמיד כשהוא נבחן. */
function exBuildSlot(slot){
  if(!slot||!topicById(slot[0]))return null;
  return withSeed(slot[2],function(){return buildQ(slot[0],slot[1])})||null;
}
/* מסך הבנייה מצייר את עצמו מחדש אחרי כל לחיצה, ובניית עשרים
   וחמש שאלות בכל ציור מיותרת. המטמון הוא לתצוגה בלבד — מי
   שנבחן בונה את שאלותיו מחדש, כדי שאיש לא יערוך בטעות אובייקט
   שגם מסך אחר מחזיק בו. */
var EXQCACHE={};
/* לכל אפליקציה מנגנון שפה משלה, ולא לכולן אותם שמות. הפנייה
   דרך window ולא בשם ישיר, כי שם שאינו קיים באפליקציה מסוימת
   הוא שגיאה בעיני הבודקים — רעש שמסתיר שגיאה אמיתית. */
function exLangKey(){
  try{
    var g=(typeof window!=="undefined")?window:{};
    if(typeof g.xlg==="function")return g.xlg();
    if(typeof g.LG==="string")return g.LG;
    return (state&&state.settings&&state.settings.lang)||"he";
  }catch(e){return "he"}
}
function exPreviewQ(slot){
  if(!slot)return null;
  var k=slot[0]+"|"+slot[1]+"|"+slot[2]+"|"+exLangKey();
  if(!(k in EXQCACHE)){
    /* מורה שמחליף שאלות שוב ושוב מייצר מפתח חדש בכל לחיצה.
       מטמון שרק גדל הוא דליפה; מרוקנים אותו ומתחילים מחדש. */
    if(Object.keys(EXQCACHE).length>400)EXQCACHE={};
    EXQCACHE[k]=exBuildSlot(slot);
  }
  return EXQCACHE[k];
}
function exTopicName(id){
  var t=topicById(id); if(!t)return "";
  var g=(typeof window!=="undefined")?window:{};
  return (typeof g.tName==="function"?g.tName(t):t.name)||"";
}
function exRightAnswer(q){
  var i; if(!q||!q.options)return null;
  for(i=0;i<q.options.length;i++)if(q.options[i].ok)return q.options[i];
  return null;
}
/* המשבצות שהמורה עורך. נבנות מחדש רק כשנושא, רמה או מספר
   השאלות משתנים; עריכה של משבצת בודדת נשמרת. */
function exSlots(){
  if(EB.q&&EB.q.length)return EB.q;
  var tops=EB.topics.filter(function(x){return topicById(x)});
  if(!tops.length)tops=topicsForTrack(state.track).slice(0,3).map(function(t){return t.id});
  var q=[],i;
  for(i=0;i<EB.n;i++)q.push(exSlot(tops[i%tops.length],EB.level));
  /* מערבבים כאן ולא בשליחה: המורה רואה את הסדר הסופי ומאשר אותו. */
  EB.q=shuffle(q);
  return EB.q;
}

/* --- הגירה מהמפתח המשותף הישן ---------------------------------
   עד הגרסה הזאת כל האפליקציות כתבו מבחנים לאותו מפתח localStorage
   ובאותו origin, ולכן מבחן שנבנה במתמטיקה הופיע ברשימת המבחנים של
   אנגלית והפיל את המסך. מעכשיו לכל אפליקציה מפתח משלה, ובטעינה
   מועתקות מהמפתח הישן רק רשומות שכל נושאיהן מוכרים כאן.
   המפתח הישן נשאר על כנו ואינו נמחק, כדי שגם אפליקציה אחרת תוכל
   לקלוט ממנו את המבחנים ששייכים לה. --------------------------- */
function exSpecKnown(spec){
  if(!spec||!spec.q||!spec.q.length)return false;
  for(var i=0;i<spec.q.length;i++){
    var pair=spec.q[i];
    if(!pair||!topicById(pair[0]))return false;
  }
  return true;
}
function exAdoptLegacy(){
  var added=0;
  try{
    var raw=localStorage.getItem(EKEY_OLD); if(!raw)return;
    var old=JSON.parse(raw); if(!old||!old.list||!old.list.length)return;
    var have={},i,ex;
    for(i=0;i<EX.list.length;i++)have[EX.list[i].id]=1;
    for(i=0;i<old.list.length;i++){
      ex=old.list[i];
      if(!ex||!ex.id||have[ex.id])continue;
      if(!exSpecKnown(ex.spec))continue;
      EX.list.push(ex); have[ex.id]=1; added++;
    }
  }catch(e){return}
  if(added)exSave();
}
function exLoad(){
  try{var r=localStorage.getItem(EKEY);if(r){var o=JSON.parse(r);if(o&&o.list)EX=o}}catch(e){}
  if(!EX.list)EX.list=[];
  exAdoptLegacy();
}
function exSave(){try{localStorage.setItem(EKEY,JSON.stringify(EX))}catch(e){}}
function exFind(id){for(var i=0;i<EX.list.length;i++)if(EX.list[i].id===id)return EX.list[i];return null}

/* --- קוד ההגשה של התלמיד --- */
function encodeResult(id,name,answers){
  var body={i:id,n:String(name||"").slice(0,40),a:answers,d:todayIso()};
  body.c=hash32(JSON.stringify([body.i,body.n,body.a])).toString(36);
  return b64e(JSON.stringify(body));
}
function decodeResult(code){
  try{
    var o=JSON.parse(b64d(code));
    if(!o||!o.i||!o.a||!o.a.length)return null;
    o.ok=(o.c===hash32(JSON.stringify([o.i,o.n,o.a])).toString(36));
    return o;
  }catch(e){return null}
}
/* הציון מחושב כאן מחדש מתוך התשובות. מה שהתלמיד שלח הוא מה
   שסימן, לא כמה הוא קיבל. */
function gradeResult(spec,res){
  var qs=examQuestions(spec),per=[],ok=0,i,q,a;
  for(i=0;i<qs.length;i++){
    q=qs[i]; a=res.a[i];
    var right=(a>=0&&q.options[a]&&q.options[a].ok)?1:0;
    if(right)ok++;
    per.push({topic:q.topic,topicName:q.topicName,ok:right,
              picked:(a>=0&&q.options[a])?q.options[a].t:"—",
              answer:(q.options.filter(function(o){return o.ok})[0]||{}).t||""});
  }
  return {ok:ok,n:qs.length,pct:Math.round(100*ok/qs.length),per:per};
}

/* השאלות עצמן, על המסך של המורה, לפני שהמבחן נשלח. */
function viewExamSlots(){
  var ls=exSlots(),h="",tops=EB.topics.filter(function(x){return topicById(x)});
  h+='<div style="margin-top:18px"><b>'+esc(xt("exQs"))+'</b>'+
     '<p class="sub" style="margin:4px 0 8px">'+esc(xt("exQsNote"))+'</p>';
  h+='<div class="row" style="margin:0 0 10px">'+
     '<button class="xq-b" data-a="exqans" aria-pressed="'+(EB.ans?"true":"false")+'">'+
     (EB.ans?esc(xt("exQsHide")):esc(xt("exQsShow")))+'</button>'+
     '<button class="xq-b" data-a="exqreset">'+esc(xt("exQsReset"))+'</button></div>';
  h+='<ol class="xq-list">';
  ls.forEach(function(sl,i){
    var q=exPreviewQ(sl),ok=exRightAnswer(q);
    h+='<li class="xq"><div class="xq-top">'+
       '<span class="xq-n">'+(i+1)+'</span>'+
       '<span class="xq-tp">'+esc(q&&q.topicName?q.topicName:exTopicName(sl[0]))+'</span>'+
       '<span class="xq-acts">'+
       '<button class="xq-b" data-a="exqroll" data-i="'+i+'">'+esc(xt("exQsSwap"))+'</button>'+
       /* המבחן חייב להישאר עם שאלה אחת לפחות, ולכן הכפתור נעלם
          ולא מוצג כבוי: כפתור שאי אפשר ללחוץ עליו מבלבל. */
       (ls.length>1?'<button class="xq-b" data-a="exqdel" data-i="'+i+'">'+esc(xt("exQsDrop"))+'</button>':"")+
       '</span></div>';
    if(q){

/* ------------------------------------------------------------
   ייצוא CSV של ההגשות.
   העתקת הטבלה נותנת טקסט מופרד בטאבים — נוח להדבקה, אבל לא קובץ.
   מורה שרוצה למיין, לסנן או לחשב ממוצע צריך גיליון. שורה לכל תלמיד,
   ועמודה לכל שאלה, כדי שאפשר יהיה לראות מיד באיזו שאלה נפלה הכיתה.
   ה-BOM בהתחלה הוא מה שגורם לאקסל לקרוא עברית, ערבית ורוסית נכון
   במקום ג׳יבריש — בלעדיו הקובץ נפתח שבור בדיוק אצל מי שצריך אותו.
   ------------------------------------------------------------ */
function csvCell(v){
  var s=(v===undefined||v===null)?"":String(v);
  return /[",\n\r;\t]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function csvRow(a){ return a.map(csvCell).join(",") }
/* ============================================================
   מצב מורה.
   בונה המבחן ומסך הציונים נועדו למורה. על טאבלט כיתתי, או על
   טלפון שהילד לוקח לעצמו, אין סיבה שהם יהיו במרחק הקשה אחת:
   ילד יכול למחוק מבחן, לראות ציונים של חברים, או לפתוח מבחן
   ולראות מראש את השאלות.
   זו אינה אבטחה, ואסור להציג אותה ככזאת: מי שיודע לפתוח כלי
   פיתוח יעקוף אותה בשנייה. זו נעילה מפני יד סקרנית — בדיוק מה
   שצריך כאן, ולא יותר.
   כל עוד לא נבחר קוד, שום דבר לא משתנה והמסכים גלויים כתמיד.
   ============================================================ */
var TE={ask:false,mode:"",msg:"",busy:false};
function teRead(){try{return JSON.parse(localStorage.getItem("ezrach-teacher")||"null")}catch(e){return null}}
function teWrite(o){try{o===null?localStorage.removeItem("ezrach-teacher"):localStorage.setItem("ezrach-teacher",JSON.stringify(o))}catch(e){}}
function teHas(){var r=teRead();return !!(r&&r.h)}
function teOpen(){
  if(!teHas())return true;
  try{if(sessionStorage.getItem("ezrach-teacher"+"-open")==="1")return true}catch(e){}
  try{if(localStorage.getItem("ezrach-teacher"+"-open")==="1")return true}catch(e){}
  return false;
}
function teSetOpen(on,remember){
  try{sessionStorage.removeItem("ezrach-teacher"+"-open")}catch(e){}
  try{localStorage.removeItem("ezrach-teacher"+"-open")}catch(e){}
  if(!on)return;
  try{(remember?localStorage:sessionStorage).setItem("ezrach-teacher"+"-open","1")}catch(e){}
}
/* גיבוב חלש כגיבוי בלבד. SubtleCrypto קיים בכל דפדפן מודרני
   בהקשר מאובטח, ו-GitHub Pages הוא כזה. */
function teWeak(s){var h=5381,i;for(i=0;i<s.length;i++)h=((h*33)^s.charCodeAt(i))>>>0;return "w"+h.toString(16)}
function teHash(pin,salt,cb){
  var msg=salt+"|"+pin;
  try{
    if(window.crypto&&crypto.subtle&&crypto.subtle.digest&&window.TextEncoder){
      crypto.subtle.digest("SHA-256",new TextEncoder().encode(msg)).then(function(d){
        var a=Array.prototype.slice.call(new Uint8Array(d));
        cb(a.map(function(b){return ("0"+b.toString(16)).slice(-2)}).join(""));
      },function(){cb(teWeak(msg))});
      return;
    }
  }catch(e){}
  cb(teWeak(msg));
}
function teSalt(){
  var s="";
  try{
    var a=new Uint8Array(8);crypto.getRandomValues(a);
    s=Array.prototype.slice.call(a).map(function(b){return ("0"+b.toString(16)).slice(-2)}).join("");
  }catch(e){ s=String(Date.now())+Math.random().toString(36).slice(2) }
  return s;
}
/* השהיה אחרי ניסיונות כושלים. ארבע ספרות הן עשרת אלפים
   אפשרויות, וילד סבלני יכול לנסות הרבה. */
function teWait(){
  var r=teRead();if(!r||!r.bad||r.bad<3)return 0;
  var pen=Math.min(300,Math.pow(2,r.bad-3)*5)*1000;
  var left=Math.ceil(((r.badAt||0)+pen-Date.now())/1000);
  return left>0?left:0;
}
function teDialog(){
  var wrap=document.getElementById("te-wrap");
  if(wrap&&wrap.parentNode)wrap.parentNode.removeChild(wrap);
  if(!TE.ask)return;
  var setting=(TE.mode==="set"||TE.mode==="change"||!teHas());
  var dirv=(LANGS[state.lang]&&LANGS[state.lang].dir)||"rtl";
  var w=document.createElement("div");
  w.id="te-wrap"; w.className="te-wrap"; w.dir=dirv;
  w.setAttribute("role","dialog"); w.setAttribute("aria-modal","true");
  var wait=teWait();
  w.innerHTML='<div class="te-box" tabindex="-1">'+
    '<h2>'+esc(setting?xt("teSet"):xt("teTitle"))+'</h2>'+
    '<p class="te-lead">'+esc(setting?xt("teLead"):xt("teEnter"))+'</p>'+
    (setting?'<p class="te-warn">'+esc(xt("teWarn"))+'</p>':'')+
    '<label class="te-lab" for="te-pin">'+esc(xt("tePin"))+'</label>'+
    '<input id="te-pin" class="te-in" type="password" inputmode="numeric" '+
      'autocomplete="off" maxlength="8" dir="ltr">'+
    (setting?'<label class="te-lab" for="te-pin2">'+esc(xt("teAgain"))+'</label>'+
      '<input id="te-pin2" class="te-in" type="password" inputmode="numeric" '+
      'autocomplete="off" maxlength="8" dir="ltr">':'')+
    '<label class="te-chk"><input type="checkbox" id="te-rem"> '+esc(xt("teRemember"))+'</label>'+
    '<p class="te-note">'+esc(xt("teRememberNote"))+'</p>'+
    (TE.msg?'<p class="te-msg" role="alert">'+esc(TE.msg)+'</p>':'')+
    (wait?'<p class="te-msg" role="alert">'+esc(xf("teWaitN",wait))+'</p>':'')+
    '<div class="te-row">'+
      '<button class="te-btn pri" id="te-ok"'+(wait?' disabled':'')+'>'+esc(xt("teOk"))+'</button>'+
      '<button class="te-btn" id="te-no">'+esc(xt("teCancel"))+'</button>'+
    '</div>'+
    (!setting&&teHas()?'<button class="te-btn link" id="te-forgot">'+esc(xt("teForgot"))+'</button>':'')+
    '</div>';
  document.body.appendChild(w);
  var box=w.firstChild, pin=document.getElementById("te-pin");
  box.focus(); if(pin&&!wait)pin.focus();
  /* מלכודת פוקוס, כמו בשער התנאים */
  w.addEventListener("keydown",function(e){
    if(e.key==="Escape"){teClose();return}
    if(e.key==="Enter"){e.preventDefault();teSubmit();return}
    if(e.key!=="Tab")return;
    var f=box.querySelectorAll("button:not([disabled]),input");
    if(!f.length)return;
    var a=f[0],z=f[f.length-1];
    if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}
    else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}
  });
  document.getElementById("te-no").onclick=teClose;
  document.getElementById("te-ok").onclick=teSubmit;
  var fg=document.getElementById("te-forgot");
  if(fg)fg.onclick=function(){ TE.msg=xt("teForgotHow"); teDialog() };
}
function teClose(){ TE.ask=false; TE.mode=""; TE.msg=""; teDialog(); }
function teSubmit(){
  if(TE.busy)return;
  var setting=(TE.mode==="set"||TE.mode==="change"||!teHas());
  var pin=(document.getElementById("te-pin")||{}).value||"";
  var rem=!!(document.getElementById("te-rem")||{}).checked;
  if(!/^[0-9]{4,8}$/.test(pin)){TE.msg=xt("teShort");teDialog();return}
  if(setting){
    var p2=(document.getElementById("te-pin2")||{}).value||"";
    if(pin!==p2){TE.msg=xt("teMismatch");teDialog();return}
    var salt=teSalt();
    TE.busy=true;
    teHash(pin,salt,function(h){
      TE.busy=false;
      teWrite({h:h,s:salt,bad:0,badAt:0});
      teSetOpen(true,rem);
      TE.ask=false;TE.mode="";TE.msg="";
      teDialog(); render();
    });
    return;
  }
  if(teWait()){teDialog();return}
  var rec=teRead(); if(!rec){teClose();return}
  TE.busy=true;
  teHash(pin,rec.s,function(h){
    TE.busy=false;
    if(h===rec.h){
      rec.bad=0;rec.badAt=0;teWrite(rec);
      teSetOpen(true,rem);
      TE.ask=false;TE.mode="";TE.msg="";
      teDialog(); render();
    }else{
      rec.bad=(rec.bad||0)+1;rec.badAt=Date.now();teWrite(rec);
      TE.msg=xt("teBad"); teDialog();
    }
  });
}
function teAsk(mode){ TE.ask=true; TE.mode=mode||""; TE.msg=""; teDialog() }
function teLock(){ teSetOpen(false); render() }
function teRemove(){ teWrite(null); teSetOpen(false); render() }
/* נעילה אוטומטית אחרי שהאפליקציה הייתה מוסתרת זמן־מה.
   מורה שבנה מבחן ומסר את הטאבלט בלי ללחוץ "יציאה" השאיר אותו
   פתוח, וזה בדיוק המצב שהתכונה אמורה למנוע. שתי דקות מספיקות
   כדי לא להפריע לעבודה רצופה, ולנעול כשהמכשיר עבר יד.
   נעילה שנשמרה כ"לזכור במכשיר הזה" היא בחירה מפורשת ולא נוגעים בה. */
var TE_HID=0;
try{
  document.addEventListener("visibilitychange",function(){
    if(document.hidden){ TE_HID=Date.now(); return }
    if(!TE_HID||!teHas())return;
    var away=Date.now()-TE_HID; TE_HID=0;
    if(away<120000)return;
    var kept=false;
    try{ kept=localStorage.getItem("ezrach-teacher"+"-open")==="1" }catch(e){}
    if(kept)return;
    try{ if(sessionStorage.getItem("ezrach-teacher"+"-open")!=="1")return }catch(e){ return }
    teSetOpen(false); render();
  });
}catch(e){}

/* ?teacher=1 פותח את החלון, והפרמטר מוסר מיד מהכתובת כדי שלא
   יישאר בקישור ששותף או בהיסטוריה. */
(function(){
  try{
    var u=new URL(location.href);
    if(u.searchParams.get("teacher")==="1"){
      u.searchParams.delete("teacher");
      history.replaceState(null,"",u.pathname+(u.searchParams.toString()?"?"+u.searchParams:"")+u.hash);
      /* שער התנאים יושב מעל הכול, וכך צריך להיות: אי־אפשר להשתמש
         באפליקציה לפני שהוסכם עליהם. חלון הקוד ממתין לו במקום
         להיפתח מתחתיו ולהיראות תקוע. */
      var tries=0;
      (function waitLegal(){
        if(tries++>=600){ teAsk(teHas()?"":"set"); return }
        /* LEGAL.accepted נוצר רק כש-protect.js מאותחל. עד אז אין
           עדיין מה לבדוק, ובדיקה של ".lg-wrap" לבדה מחזירה "אין
           שער" בדיוק ברגע שלפני שהוא נבנה. */
        var ready=false;
        try{ ready=!!(window.LEGAL&&window.LEGAL.accepted) }catch(e){}
        if(!ready){ setTimeout(waitLegal,200); return }
        var ok=true;
        try{ ok=!!window.LEGAL.accepted() }catch(e){ ok=true }
        if(!ok){ setTimeout(waitLegal,200); return }
        teAsk(teHas()?"":"set");
      })();
    }
  }catch(e){}
})();

function marksCsv(ex){
  var subs=(ex.subs||[]).slice().sort(function(a,b){return b.pct-a.pct});
  var n=ex.spec.q.length,i;
  var head=[xt("mkCsvName"),xt("mkCsvPct"),xt("mkCsvOk"),xt("mkCsvTotal"),
            xt("mkCsvDate"),xt("mkCsvValid")];
  for(i=0;i<n;i++)head.push(xf("mkCsvQ",i+1));
  var rows=[csvRow(head)];
  subs.forEach(function(s){
    var r=[s.name||xt("mkNoName"),s.pct,s.ok,s.n,s.date||"",
           s.valid?xt("mkCsvYes"):xt("mkCsvNo")];
    for(i=0;i<n;i++){
      var p=s.per&&s.per[i];
      r.push(p?(p.ok?xt("mkCsvYes"):xt("mkCsvNo")):"");
    }
    rows.push(csvRow(r));
  });
  return "\ufeff"+rows.join("\r\n")+"\r\n";
}
/* כרום מוחק את שם הקובץ כולו ברגע שיש בו תו אחד שאינו ASCII —
   לא רק עברית: גם é או מקף ארוך. מה שיורד נקרא "download", בלי
   סיומת, ואקסל לא יודע לפתוח אותו. מורה שקרא למבחן שלו בעברית
   קיבל קובץ בלי שם ובלי סוג. לכן השם מתועתק ללטינית. */
var TRLIT={
  "א":"a","ב":"b","ג":"g","ד":"d","ה":"h","ו":"v","ז":"z","ח":"ch","ט":"t","י":"y",
  "כ":"k","ך":"k","ל":"l","מ":"m","ם":"m","נ":"n","ן":"n","ס":"s","ע":"","פ":"f",
  "ף":"f","צ":"tz","ץ":"tz","ק":"k","ר":"r","ש":"sh","ת":"t",
  "ا":"a","ب":"b","ت":"t","ث":"th","ج":"j","ح":"h","خ":"kh","د":"d","ذ":"dh","ر":"r",
  "ز":"z","س":"s","ش":"sh","ص":"s","ض":"d","ط":"t","ظ":"z","ع":"","غ":"gh","ف":"f",
  "ق":"q","ك":"k","ل":"l","م":"m","ن":"n","ه":"h","و":"w","ي":"y","ة":"h","ى":"a","ء":"",
  "أ":"a","إ":"i","آ":"a","ؤ":"w","ئ":"y",
  "а":"a","б":"b","в":"v","г":"g","д":"d","е":"e","ё":"e","ж":"zh","з":"z","и":"i",
  "й":"y","к":"k","л":"l","м":"m","н":"n","о":"o","п":"p","р":"r","с":"s","т":"t",
  "у":"u","ф":"f","х":"kh","ц":"ts","ч":"ch","ш":"sh","щ":"sch","ъ":"","ы":"y","ь":"",
  "э":"e","ю":"yu","я":"ya"
};
function asciiName(s){
  var i,c,out="";
  /* é ו-ü הם אות לטינית ועוד סימן מצורף. פירוק והסרת הסימן משאיר e ו-u. */
  try{ s=s.normalize("NFD").replace(/[\u0300-\u036f]/g,"") }catch(e){}
  for(i=0;i<s.length;i++){
    c=s.charAt(i);
    if(/[A-Za-z0-9]/.test(c)){ out+=c; continue }
    var lower=c.toLowerCase();
    if(TRLIT[lower]!==undefined){ out+=TRLIT[lower]; continue }
    out+=" ";                     /* כל השאר — רווח, שיתכווץ בהמשך */
  }
  return out.replace(/\s+/g," ").trim();
}
function csvFileName(ex){
  var t=asciiName(String(ex.spec.t||"")).slice(0,60).trim();
  var d=String(ex.date||todayIso()).replace(/[^0-9-]/g,"");
  /* כשלא נשאר כלום קריא, מזהה המבחן הוא מה שמבדיל בין שני קבצים
     שירדו באותו יום. */
  if(!t) t="exam "+String(ex.id||"").slice(0,6);
  return (t+" "+d).trim()+".csv";
}
function downloadCsv(ex){
  var txt=marksCsv(ex),url=null,a=document.createElement("a");
  try{
    url=URL.createObjectURL(new Blob([txt],{type:"text/csv;charset=utf-8"}));
  }catch(e){
    url="data:text/csv;charset=utf-8,"+encodeURIComponent(txt);
  }
  a.href=url; a.download=csvFileName(ex);
  a.style.cssText="position:fixed;inset-inline-start:-9999px";
  document.body.appendChild(a); a.click();
  setTimeout(function(){
    if(a.parentNode)a.parentNode.removeChild(a);
    if(url&&url.indexOf("blob:")===0){try{URL.revokeObjectURL(url)}catch(e){}}
  },400);
}
function marksTable(ex){
  var out=(ex.spec.t||xt("exam"))+"\n";
  out+=xt("mkTblHead")+"\n";
  (ex.subs||[]).slice().sort(function(a,b){return b.pct-a.pct}).forEach(function(s){
    var wrong=uniq(s.per.filter(function(p){return !p.ok}).map(function(p){return p.topicName}));
    out+=(s.name||xt("mkNoName"))+"\t"+s.pct+"\t"+s.ok+"/"+s.n+"\t"+wrong.join(", ")+"\n";
  });
  return out;
}

/* ------------------------------------------------------------
   מסך התלמיד — מבחן מתוך קישור
   ------------------------------------------------------------ */
var SIT={spec:null,id:"",qs:[],i:0,name:"",answers:[],flags:[],
         t0:0,tick:null,phase:"intro",code:"",copied:false};

/* ------------------------------------------------------------
   מבחן שנפתח מחדש — ריענון, שיחה נכנסת, נעילת מסך
   ------------------------------------------------------------
   תלמיד שדפדפן שלו רענן באמצע מבחן איבד עד כה את הכול. התשובות
   נשמרות עכשיו במכשיר, לפי מזהה המבחן, יחד עם שעת ההתחלה — כדי
   שגם טיימר לא יתאפס ויעניק זמן נוסף. השמירה מקומית בלבד.
   ------------------------------------------------------------ */
function sitKey(){return EKEY+"-run-"+SIT.id}
function sitSave(){
  if(!SIT.id)return;
  try{localStorage.setItem(sitKey(),JSON.stringify({
    n:SIT.name,a:SIT.answers,f:SIT.flags,t:SIT.t0,i:SIT.i,p:SIT.phase}))}catch(e){}
}
function sitKeyOld(){return EKEY_OLD+"-run-"+SIT.id}
function sitDrop(){try{localStorage.removeItem(sitKey());localStorage.removeItem(sitKeyOld())}catch(e){}}
function sitRestore(){
  if(!SIT.id)return false;
  try{
    /* מבחן שהתחיל לפני פיצול המפתחות נשמר תחת המפתח הישן. */
    var o=JSON.parse(localStorage.getItem(sitKey())||localStorage.getItem(sitKeyOld())||"null");
    if(!o||!o.a||!o.a.length)return false;
    SIT.qs=examQuestions(SIT.spec);
    if(o.a.length!==SIT.qs.length)return false;   /* מבחן אחר תחת אותו מזהה */
    SIT.name=o.n||""; SIT.answers=o.a;
    SIT.flags=o.f&&o.f.length===o.a.length?o.f:SIT.qs.map(function(){return false});
    SIT.t0=o.t||0; SIT.i=Math.min(Math.max(0,o.i|0),SIT.qs.length-1);
    SIT.phase=o.p==="done"?"done":"ask";
    if(SIT.phase==="done")SIT.code=encodeResult(SIT.id,SIT.name,SIT.answers);
    return true;
  }catch(e){return false}
}
/* שניות שנותרו, או null כשלא הוגדרה הגבלת זמן */
function sitLeft(){
  var m=SIT.spec&&SIT.spec.m;
  if(!m||!SIT.t0)return null;
  return Math.max(0,Math.round((SIT.t0+m*60000-Date.now())/1000));
}
function sitClock(){
  var l=sitLeft(); if(l===null)return "";
  var mm=Math.floor(l/60),ss=l%60;
  return mm+":"+(ss<10?"0":"")+ss;
}
/* הזמן נגמר — מגישים. לא מבקשים אישור: אישור שאיש לא לוחץ עליו
   פירושו מבחן שנשאר פתוח לנצח. */
function sitTimerOn(){
  sitTimerOff();
  if(sitLeft()===null)return;
  SIT.tick=setInterval(function(){
    if(SIT.phase!=="ask"){sitTimerOff();return}
    if(sitLeft()<=0){sitTimerOff();sitFinish();return}
    var el=$("#sitclock"); if(el)el.textContent=sitClock();
  },1000);
}
function sitTimerOff(){if(SIT.tick){clearInterval(SIT.tick);SIT.tick=null}}

function sitStart(){
  var nm=$("#sitName"); SIT.name=nm?nm.value.trim():"";
  SIT.qs=examQuestions(SIT.spec);
  /* אם לא נותרה אף שאלה שאפשר לבנות (למשל מבחן של אפליקציה אחרת),
     מציגים את מסך המבחן השבור במקום ליפול על שאלה שאינה קיימת. */
  if(!SIT.qs.length){view="badexam"; render(); return}
  SIT.answers=SIT.qs.map(function(){return -1});
  SIT.flags=SIT.qs.map(function(){return false});
  SIT.i=0; SIT.phase="ask"; SIT.t0=Date.now();
  sitSave(); sitTimerOn();
  window.scrollTo(0,0); render();
}
function sitAnswer(i){
  if(SIT.phase!=="ask")return;
  SIT.answers[SIT.i]=i;
  sitSave();
  sitNext();
}
/* סימון לחזרה אינו תשובה ואינו משנה אותה — הוא רק מסמן. */
function sitFlag(){
  if(SIT.phase!=="ask")return;
  SIT.flags[SIT.i]=!SIT.flags[SIT.i];
  sitSave(); render();
}
function sitNext(){
  if(SIT.i+1<SIT.qs.length){SIT.i++;window.scrollTo(0,0);render();return}
  /* לא מגישים בלחיצה על תשובה. לחיצה בטעות על האפשרות האחרונה
     אינה אמורה לסיים מבחן. */
  SIT.phase="review"; stopSpeak(); window.scrollTo(0,0); render();
}
function sitGo(i){
  SIT.i=clamp(i,0,SIT.qs.length-1); SIT.phase="ask";
  window.scrollTo(0,0); render();
}
function sitFinish(){
  SIT.phase="done";
  sitTimerOff();
  SIT.code=encodeResult(SIT.id,SIT.name,SIT.answers);
  sitSave();
  stopSpeak(); window.scrollTo(0,0); render();
}
function sitGrade(){
  var ok=0,i;
  for(i=0;i<SIT.qs.length;i++){
    var a=SIT.answers[i];
    if(a>=0&&SIT.qs[i].options[a]&&SIT.qs[i].options[a].ok)ok++;
  }
  return {ok:ok,n:SIT.qs.length,pct:Math.round(100*ok/SIT.qs.length)};
}

function copyText(txt,done){
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(done,function(){fallbackCopy(txt,done)});
      return;
    }
  }catch(e){}
  fallbackCopy(txt,done);
}
function fallbackCopy(txt,done){
  try{
    var ta=document.createElement("textarea");
    ta.value=txt; ta.setAttribute("readonly","");
    ta.style.position="fixed"; ta.style.top="-1000px";
    document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); document.body.removeChild(ta);
    done();
  }catch(e){}
}
function examAction(a,el){

  }
  if(a==="exflag"){var f=el.getAttribute("data-f");EB[f]=!EB[f];EB.built=null;render();return true}
  /* --- בחירת השאלות --- */
  if(a==="exqans"){EB.ans=!EB.ans;render();return true}
  if(a==="exqreset"){EB.q=null;EB.built=null;render();return true}
  if(a==="exqroll"){
    var qi=parseInt(el.getAttribute("data-i"),10),ql=exSlots();
    /* משבצת חדשה ולא רק זרע חדש, כדי שהמערך יישאר בן שלושה
       איברים גם אם מישהו יוסיף שדה בעתיד. */
    if(ql[qi])
      {ql[qi]=exSlot(ql[qi][0],ql[qi][1]);EB.built=null}
    render();return true;
  }
  if(a==="exqdel"){
    var di=parseInt(el.getAttribute("data-i"),10),dl=exSlots();
    /* מבחן בלי שאלות אינו מבחן. משאירים אחת. */
    if(dl.length>1&&di>=0&&di<dl.length){dl.splice(di,1);EB.n=dl.length;EB.built=null}
    render();return true;
  }
  if(a==="exqadd"){
    var at=el.getAttribute("data-t"),al=exSlots();
    /* עשרים וחמש — גם הגבול של המחוון, וגם מבחן ארוך דיו. */
    if(topicById(at)&&al.length<25){al.push(exSlot(at,EB.level));EB.n=al.length;EB.built=null}
    render();return true;
  }
  if(a==="exbuild"){
    var ti=$("#exTitle"),ph=$("#exPhone");
    EB.title=ti?ti.value.trim():""; EB.phone=ph?ph.value.trim():"";
    /* המבחן נארז מהמשבצות שעל המסך — אותן שאלות ואותו סדר
       שהמורה אישר. ערבוב כאן היה מסדר מחדש מבחן שכבר נבדק. */
    var q=exSlots().slice();
    var spec={v:GENV,t:EB.title||xt("exam"),s:(Math.random()*4294967295)>>>0,l:EB.level,
              q:q,r:!!EB.tts,f:!!EB.formulas,w:true,m:EB.mins||0};
    if(EB.phone)spec.p=EB.phone.replace(/[^0-9]/g,"");
    EB.built=spec; EB.copied="";
    var id=examId(spec);
    if(!exFind(id)){EX.list.unshift({id:id,spec:spec,date:todayIso(),subs:[]});exSave()}
    render(); return true;
  }
  if(a==="excopy"){var u=el.getAttribute("data-v");copyText(u,function(){EB.copied="url";render()});return true}

  /* --- ציונים --- */
  if(a==="mkopen"){var i2=el.getAttribute("data-i");MK.open=MK.open===i2?"":i2;MK.msg=null;render();return true}
  /* מחיקה מוחקת גם את כל ההגשות. שאלה אחת לפני זה היא לא נימוס —
     היא ההבדל בין טעות לבין אובדן של כיתה שלמה. */
  if(a==="mkdel"){MK.del=el.getAttribute("data-i");render();return true}
  if(a==="mkdelno"){MK.del="";render();return true}
  if(a==="mkdelyes"){
    var id3=el.getAttribute("data-i");
    EX.list=EX.list.filter(function(x){return x.id!==id3});
    exSave(); MK.open=""; MK.del=""; render(); return true;
  }
  if(a==="teask"){ teAsk(teHas()?"":"set"); return true }
  if(a==="techange"){ teAsk("change"); return true }
  if(a==="telock"){ teLock(); return true }
  if(a==="teremove"){ teRemove(); return true }
  if(a==="mkcsv"){
    var exc=exFind(el.getAttribute("data-i")); if(!exc)return true;
    downloadCsv(exc);
    MK.msg={id:exc.id,ok:true,m:xt("mkCsvDone")}; render();
    return true;
  }
  if(a==="mkcopy"){
    var ex4=exFind(el.getAttribute("data-i")); if(!ex4)return true;
    copyText(marksTable(ex4),function(){MK.msg={id:ex4.id,ok:true,m:xt("mkTblCopied")};render()});
    return true;
  }
  if(a==="mkadd"){
    var ex=exFind(el.getAttribute("data-i")); if(!ex)return true;
    var ta=$("#mkPaste"),raw=ta?ta.value:"";
    var res=decodeResult(raw);
    if(!res){MK.msg={id:ex.id,ok:false,m:xt("mkErrRead")};render();return true}
    if(res.i!==ex.id){
      var other=exFind(res.i);
      MK.msg={id:ex.id,ok:false,m:other?xf("mkErrOther",other.spec.t||xt("exam")):xt("mkErrUnknown")};
      render(); return true;
    }
    if(res.a.length!==ex.spec.q.length){
      MK.msg={id:ex.id,ok:false,m:xt("mkErrCount")};render();return true}
    var g=gradeResult(ex.spec,res);
    var sub={name:res.n||"",date:res.d||todayIso(),ok:g.ok,n:g.n,pct:g.pct,per:g.per,valid:!!res.ok};
    /* הגשה חוזרת של אותו תלמיד מחליפה את הקודמת ולא מצטברת לידה */
    /* הגשה חדשה מחליפה קודמת רק כששני השמות זהים אחרי נירמול, והשם
       אינו ריק. בלי זה כל ההגשות בלי שם נראו כאותו תלמיד ודרסו זו את
       זו בשקט, וגם "דני" מול "דני  " (רווח כפול פנימי) נחשבו לשניים. */
    var nrm=function(x){return String(x==null?"":x).replace(/\s+/g," ").trim()};
    var sn=nrm(sub.name);
    var k2=sn?(ex.subs||[]).findIndex(function(s){return nrm(s.name)===sn}):-1;
    if(!ex.subs)ex.subs=[];
    if(k2>=0)ex.subs[k2]=sub; else ex.subs.push(sub);
    exSave();
    MK.msg={id:ex.id,ok:true,m:(sub.name||xt("student"))+" "+xt("mkTaken")+" · "+g.pct+" ("+g.ok+"/"+g.n+")"+
      (sub.valid?"":" · "+xt("mkNoteBad"))};
    if(ta)ta.value="";
    render(); return true;
  }

  /* --- התלמיד --- */
  if(a==="sitstart"){sitStart();return true}
  if(a==="sitans"){sitAnswer(parseInt(el.getAttribute("data-i"),10));return true}
  if(a==="sitskip"){SIT.answers[SIT.i]=-1;sitSave();sitNext();return true}
  if(a==="sitflag"){sitFlag();return true}
  if(a==="sitprev"){sitGo(SIT.i-1);return true}
  if(a==="sitfwd"){sitNext();return true}
  if(a==="sitgo"){sitGo(parseInt(el.getAttribute("data-i"),10));return true}
  if(a==="sitfinish"){sitFinish();return true}
  /* בלי שפה מפורשת speak נופל ל-"en", ושאלת מבחן בעברית, בערבית
     או ברוסית הוקראה בקול אנגלי. כאן החומר עצמו בשפת הממשק. */
  /* say נבנה במפורש כ"השאלה והתשובה עליה" ונועד להישמע *אחרי*
     המענה. במבחן הכפתור זמין *לפני*, ולכן הוא הקריא לתלמיד את
     התשובה. כאן מוקרא מה שעל המסך — הכותרת והמקור — והאפשרויות
     ממילא אינן חלק ממנו. */
  if(a==="sitread"){var q2=SIT.qs[SIT.i];
    if(q2)speak(saySpell(plainOf(q2.ask||"")+" "+plainOf(q2.expr||"")),state.lang);
    return true}
  if(a==="sitform"){view="formulas";render();window.scrollTo(0,0);return true}
  if(a==="sitcopy"){copyText(SIT.code,function(){SIT.copied=true;render()});return true}
  if(a==="sitback"){view="sit";render();window.scrollTo(0,0);return true}
  return false;
}

function examFromUrl(){

  if(!sp){
    view="badexam"; return true;

  if(sp.v!==GENV){view="oldexam";return true}

  /* מבחן שכבר התחיל במכשיר הזה נמשך מהמקום שבו נעצר, עם הזמן
     שכבר חלף. בלי זה ריענון היה מוחק תשובות ומאפס טיימר. */
  if(sitRestore()&&SIT.phase==="ask")sitTimerOn();
  view="sit"; return true;
}

function newQuestion(){
  var prev=P.q?P.q.idx:undefined;
  P.q=buildQuestion(state.topic,state.level,prev);
  P.picked=-1; P.done=false; P.ok=false; P.hint=false;
  render();
}
/* רישום תשובה אחת: סטטיסטיקה, חזרה מרווחת ובנק הטעויות.
   נקרא גם מהתרגול וגם מהגשת המבחן המדומה, ולכן הוא מקבל את
   הפריט במפורש ואינו קורא ל-P. */
function recordItem(tid,lv,id,ok){
  var st=stOf(tid,lv); st.seen++; ok?st.ok++:st.bad++;
  var r=itemRec(id); r.n++; if(ok)r.ok++;
  if(!state.bad)state.bad={};
  if(!ok)state.bad[id]=0;
  else if(state.bad[id]!==undefined){
    state.bad[id]=(state.bad[id]||0)+1;
    if(state.bad[id]>=2)delete state.bad[id];
  }
  touchDay(); state.day.n=(state.day.n||0)+1;
  state.totalAsk++; if(ok)state.totalOk++;
}
function record(ok){
  var q=P.q; if(!q)return;
  recordItem(q.tid,q.lv,q.id,ok);
  save();
}
/* מזהה פריט → הפריט עצמו. הבנק שומר מזהים בלבד, כדי שהוא
   ישרוד שינוי בתוכן ולא יחזיק עותק של שאלה שכבר נערכה. */
function itemAt(id){
  var a=String(id||"").split("|");
  var tp=topicOf(a[0]); if(!tp)return null;
  var lv=parseInt(a[1],10), idx=parseInt(a[2],10);
  var pool=poolOf(tp,lv);
  return (pool&&pool[idx])?{tp:tp,lv:lv,idx:idx,it:pool[idx]}:null;
}
function badList(){
  var out=[],k;
  if(!state.bad)return out;
  for(k in state.bad){
    if(!Object.prototype.hasOwnProperty.call(state.bad,k))continue;
    var r=itemAt(k); if(r)out.push({id:k,tp:r.tp,lv:r.lv,idx:r.idx,it:r.it,s:state.bad[k]||0});
  }
  return out;
}
/* שאלה מפריט מסוים, ולא מהגרלה. משמש את בנק הטעויות. */
function questionAt(id){
  var r=itemAt(id); if(!r)return null;
  var q=buildFromItem(r.it);
  q.tid=r.tp.id; q.lv=r.lv; q.idx=r.idx; q.id=id; q.hint=gl(r.it.hint);
  return q;
}
function answer(i){
  if(P.done)return;
  var q=P.q,o=q.opts[i];
  P.picked=i; P.done=true; P.ok=!!(o&&o.ok);
  record(P.ok);
  render();
  announce(P.ok?t("correct"):t("wrong")+". "+t("answerIs")+" "+q.answer);
  /* המשפט המלא נשמע מיד, גם כשטעו — במיוחד כשטעו. שמיעה של
     המשפט השלם היא מה שקושר את התאריך לסיפור. */
  setTimeout(function(){speak(saySpell(q.say),state.lang)},P.ok?200:420);
}
