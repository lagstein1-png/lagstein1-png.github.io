 ,Q("bib-unseen-keyword",{"he": "בקטע מקראי חדש המילה 'אמת' חוזרת חמש פעמים. מה כדאי לעשות קודם?", "ar": "في مقطع توراتي جديد تتكرر كلمة «أمت» (صدق) خمس مرات. ما الأفضل فعله أولًا؟", "ru": "В новом библейском отрывке слово «правда» повторяется пять раз. Что стоит сделать сначала?", "en": "In a new biblical passage the word \"truth\" repeats five times. What is best to do first?"},[{"he": "לסמן את ההופעות ולבדוק מה משתנה סביבן - כך מוצאים מילת מפתח", "ar": "تعليم المواضع وفحص ما يتغير حولها - هكذا نجد الكلمة المفتاح", "ru": "Отметить вхождения и проверить, что меняется вокруг них - так находят ключевое слово", "en": "Mark the occurrences and check what changes around them - that is how a keyword is found"},{"he": "לדלג עליה - חזרה אינה משנה", "ar": "تجاوزها - التكرار لا يهم", "ru": "Пропустить его - повтор не важен", "en": "Skip it - repetition does not matter"},{"he": "להחליף אותה במילה אחרת", "ar": "استبدالها بكلمة أخرى", "ru": "Заменить его другим словом", "en": "Replace it with another word"},{"he": "לספור אותה ולעבור הלאה בלי לקרוא", "ar": "عدّها والانتقال دون قراءة", "ru": "Посчитать его и идти дальше, не читая", "en": "Count it and move on without reading"}],0,{"he": "חזרה בטקסט מקראי היא לרוב סימן דרך.", "ar": "التكرار في النص التوراتي غالبًا إشارة طريق.", "ru": "Повтор в библейском тексте - обычно указатель.", "en": "Repetition in a biblical text is usually a signpost."},{"he": "מילה החוזרת פעמים רבות היא כמעט תמיד מילת מפתח. דוגמה: אם 'אמת' מופיעה בכל פעם שדמות מתלבטת, היא כנראה מרכז הנושא של הקטע, וכל הופעה מוסיפה ניואנס.", "ar": "الكلمة المتكررة كثيرًا هي غالبًا كلمة مفتاح. مثال: إذا ظهرت «صدق» كلما ترددت شخصية، فهي على الأرجح مركز موضوع المقطع، وكل موضع يضيف معنى.", "ru": "Многократно повторяющееся слово - почти всегда ключевое. Пример: если «правда» появляется всякий раз, когда герой сомневается, она, вероятно, центр темы отрывка, и каждое вхождение добавляет оттенок.", "en": "A word repeating many times is almost always a keyword. Example: if \"truth\" appears whenever a character wavers, it is likely the passage's central theme, and each occurrence adds a nuance."},null,[null,{"he": "דילוג מפסיד את אות הדרך שהמחבר שם בכוונה.", "ar": "التجاوز يفوّت إشارة الطريق التي وضعها المؤلف قصدًا.", "ru": "Пропуск теряет указатель, который автор поставил намеренно.", "en": "Skipping loses the signpost the author placed deliberately."},{"he": "החלפה מוחקת את הראיה במקום לפרש אותה.", "ar": "الاستبدال يمحو الدليل بدل تفسيره.", "ru": "Замена стирает улику вместо её толкования.", "en": "Replacing erases the evidence instead of interpreting it."},{"he": "ספירה בלי קריאה נותנת מספר, לא משמעות.", "ar": "العد دون قراءة يعطي رقمًا لا معنى.", "ru": "Подсчёт без чтения даёт число, а не смысл.", "en": "Counting without reading gives a number, not meaning."}]),
  Q("un61-1-01",{"he": "מהי תקבולת בשירה המקראית?", "ar": "ما التوازي في الشعر الكتابي؟", "ru": "Что такое параллелизм в библейской поэзии?", "en": "What is parallelism in biblical poetry?"},[{"he": "שתי צלעות בפסוק שאומרות רעיון קרוב במילים אחרות", "ar": "شطران في الآية يقولان فكرة متقاربة بكلمات مختلفة", "ru": "две половины стиха, выражающие близкую мысль разными словами", "en": "two halves of a verse that say a close idea in other words"}, {"he": "מילה אחת שחוזרת שוב ושוב בכל פסוק ופסוק בפרק", "ar": "كلمة واحدة تتكرر في كل آية من الأصحاح", "ru": "одно слово, повторяющееся в каждом стихе главы", "en": "one word that repeats in every verse of the chapter"}, {"he": "סיפור שמתרחש בשני מקומות שונים באותו הזמן", "ar": "قصة تجري في مكانين في الوقت نفسه", "ru": "рассказ, который идёт в двух местах одновременно", "en": "a story that takes place in two places at once"}, {"he": "שיר שכל שורה בו מתחילה באות אחרת לפי סדר אותיות האלף־בית", "ar": "قصيدة يبدأ كل سطر فيها بحرف مختلف حسب ترتيب حروف الأبجدية", "ru": "стихотворение, где строки начинаются с букв по порядку еврейского алфавита", "en": "a poem whose lines start with letters following the alphabetical order"}],0,{"he": "חלקו פסוק שירי לשני חצאים והשוו ביניהם.", "ar": "قسّموا آية شعرية إلى نصفين وقارنوا بينهما.", "ru": "Разделите поэтический стих на две половины и сравните их.", "en": "Split a poetic verse into two halves and compare them."},{"he": "בשירה המקראית פסוק נחלק לרוב לשתי צלעות. הצלע השנייה חוזרת על הרעיון, מנגידה אותו או משלימה אותו. זו תקבולת.", "ar": "في الشعر الكتابي تنقسم الآية غالبًا إلى شطرين. الشطر الثاني يكرر الفكرة أو يقابلها أو يكملها. هذا هو التوازي.", "ru": "В библейской поэзии стих обычно делится на две половины. Вторая повторяет мысль, противопоставляет её или дополняет. Это параллелизм.", "en": "In biblical poetry a verse usually splits into two halves. The second repeats, contrasts or completes the idea. This is parallelism."},null,[null, {"he": "זו מילה מנחה, ולא תקבולת בין שתי צלעות.", "ar": "هذه كلمة موجِّهة، وليست توازيًا بين شطرين.", "ru": "Это ведущее слово, а не параллелизм двух половин.", "en": "That is a leading word, not parallelism between two halves."}, {"he": "תקבולת היא מבנה של פסוק, לא מבנה של עלילה.", "ar": "التوازي بنية للآية، لا بنية للحبكة.", "ru": "Параллелизм — строение стиха, а не сюжета.", "en": "Parallelism is the structure of a verse, not of a plot."}, {"he": "זה תיאור של שיר אלפביתי, לא של תקבולת.", "ar": "هذا وصف لقصيدة أبجدية، لا للتوازي.", "ru": "Это описание алфавитного стихотворения, а не параллелизма.", "en": "That describes an alphabetic poem, not parallelism."}]),
  Q("un61-1-02",{"he": "ישעיהו פותח: ״שמעו שמים והאזיני ארץ״. אל מי הוא פונה?", "ar": "يفتتح إشعياء: «اسمعي أيتها السماوات وأصغي أيتها الأرض». إلى من يتوجّه؟", "ru": "Исаия начинает: «Слушайте, небеса, и внимай, земля». К кому он обращается?", "en": "Isaiah opens: \"Hear, O heavens, and give ear, O earth.\" Whom does he address?"},[{"he": "אל מלך יהודה", "ar": "إلى ملك يهوذا", "ru": "к царю Иудеи", "en": "the king of Judah"}, {"he": "אל השמים ואל הארץ", "ar": "إلى السماوات والأرض", "ru": "к небесам и к земле", "en": "the heavens and the earth"}, {"he": "אל הכוהנים שמשרתים במקדש", "ar": "إلى الكهنة الذين يخدمون في الهيكل", "ru": "к священникам, служащим в храме", "en": "the priests who serve in the temple"}, {"he": "אל עמי הסביבה", "ar": "إلى الشعوب المجاورة", "ru": "к соседним народам", "en": "the neighboring nations"}],1,{"he": "חפשו את המילים שבאות מיד אחרי ״שמעו״ ו״האזיני״.", "ar": "ابحثوا عن الكلمتين بعد فعلَي «اسمعي» و«أصغي».", "ru": "Найдите слова сразу после «слушайте» и «внимай».", "en": "Look for the words right after \"hear\" and \"give ear.\""},{"he": "הנמען הוא מי שאליו מדברים. כאן הנביא קורא לשמים ולארץ להקשיב, כמו עדים. כך הוא פותח בטון חגיגי של משפט.", "ar": "المخاطَب هو من يُوجَّه إليه الكلام. هنا يدعو النبي السماوات والأرض للإصغاء كأنها شهود. وهكذا يفتتح بنبرة احتفالية لمحاكمة.", "ru": "Адресат — тот, к кому обращена речь. Здесь пророк призывает небо и землю слушать, как свидетелей. Так он открывает речь торжественным тоном суда.", "en": "The addressee is the one being spoken to. Here the prophet calls heaven and earth to listen, like witnesses. He opens with the solemn tone of a trial."},null,[{"he": "המלך לא מוזכר בפתיחה הזאת.", "ar": "الملك غير مذكور في هذه الافتتاحية.", "ru": "Царь в этом начале не упоминается.", "en": "The king is not mentioned in this opening."}, null, {"he": "אין בפסוק פנייה לכוהנים.", "ar": "لا توجد في الآية مخاطبة للكهنة.", "ru": "В стихе нет обращения к священникам.", "en": "The verse does not address the priests."}, {"he": "הפנייה היא לשמים ולארץ, לא לעמים.", "ar": "المخاطبة للسماوات والأرض، لا للشعوب.", "ru": "Обращение к небу и земле, а не к народам.", "en": "The address is to heaven and earth, not to nations."}]),
  Q("un61-1-03",{"he": "״והאיש משה ענו מאד״ (במדבר י״ב). איזה סוג אפיון זה?", "ar": "«وكان الرجل موسى حليمًا جدًا» (العدد 12). أي نوع من التوصيف هذا؟", "ru": "«Моисей же был человек кротчайший» (Числа 12). Какой это вид характеристики?", "en": "\"Now the man Moses was very humble\" (Numbers 12). What kind of characterization is this?"},[{"he": "אפיון עקיף: לומדים על משה מתוך מעשיו", "ar": "توصيف غير مباشر: نعرف موسى من أفعاله", "ru": "косвенная: мы узнаём о Моисее по поступкам", "en": "indirect: we learn about Moses from his deeds"}, {"he": "אפיון דרך הדברים שמשה עצמו אומר על אופיו ועל מעשיו", "ar": "توصيف عبر الكلام الذي يقوله موسى نفسه عن طبعه", "ru": "характеристика через слова Моисея о своём характере", "en": "characterization through Moses' own words about himself"}, {"he": "אפיון ישיר: המספר אומר את התכונה במפורש", "ar": "توصيف مباشر: الراوي يذكر الصفة صراحة", "ru": "прямая: рассказчик прямо называет черту", "en": "direct: the narrator states the trait outright"}, {"he": "אפיון דרך דמות אחרת שמדברת עליו", "ar": "توصيف عبر شخصية أخرى تتحدث عنه", "ru": "характеристика через слова другого героя о нём", "en": "characterization through another character speaking of him"}],2,{"he": "מי אומר את המשפט: דמות או המספר?", "ar": "من يقول الجملة: شخصية أم الراوي؟", "ru": "Кто произносит фразу: персонаж или рассказчик?", "en": "Who says the sentence: a character or the narrator?"},{"he": "באפיון ישיר המספר קובע תכונה במילים, למשל ״ענו מאד״. באפיון עקיף לומדים מן המעשים ומן הדיבור. במקרא האפיון הישיר נדיר יחסית.", "ar": "في التوصيف المباشر يحدد الراوي الصفة بالكلمات، مثل «حليم جدًا». وفي غير المباشر نتعلم من الأفعال والكلام. والتوصيف المباشر نادر نسبيًا في الكتاب.", "ru": "При прямой характеристике рассказчик называет черту словами, например «кротчайший». При косвенной мы судим по делам и речи. В Библии прямая характеристика сравнительно редка.", "en": "In direct characterization the narrator names a trait, like \"very humble.\" In indirect, we learn from deeds and speech. Direct characterization is fairly rare in the Bible."},null,[{"he": "כאן אין מעשה; יש קביעה של המספר.", "ar": "لا يوجد هنا فعل؛ بل حكم من الراوي.", "ru": "Здесь нет поступка, есть утверждение рассказчика.", "en": "There is no deed here; there is a statement by the narrator."}, {"he": "משה לא אומר את המשפט; המספר אומר אותו.", "ar": "موسى لا يقول هذه الجملة؛ الراوي يقولها.", "ru": "Эти слова говорит не Моисей, а рассказчик.", "en": "Moses does not say this sentence; the narrator does."}, null, {"he": "אף דמות אינה אומרת זאת; זה קולו של המספר.", "ar": "لا تقول ذلك أي شخصية؛ إنه صوت الراوي.", "ru": "Это говорит не персонаж, а голос рассказчика.", "en": "No character says it; it is the narrator's voice."}]),
  Q("un61-1-04",{"he": "מהי כותרת טובה לקטע מקראי?", "ar": "ما العنوان الجيد لمقطع كتابي؟", "ru": "Какой заголовок хорош для библейского отрывка?", "en": "What makes a good title for a biblical passage?"},[{"he": "כותרת שמתארת פרט אחד מעניין במיוחד מתוך אמצע הקטע", "ar": "عنوان يصف تفصيلًا واحدًا ممتعًا جدًا من وسط المقطع", "ru": "заголовок об одной особенно интересной детали отрывка", "en": "a title describing one especially interesting detail of the passage"}, {"he": "כותרת ארוכה שמסכמת כל פסוק בנפרד", "ar": "عنوان طويل يلخّص كل آية على حدة", "ru": "длинный заголовок, пересказывающий каждый стих", "en": "a long title summing up each verse separately"}, {"he": "כותרת שמביעה את דעת הקורא על הדמויות", "ar": "عنوان يعبّر عن رأي القارئ في الشخصيات", "ru": "заголовок с мнением читателя о героях", "en": "a title expressing the reader's opinion of the characters"}, {"he": "כותרת קצרה שמתאימה לרעיון המרכזי של כל הקטע", "ar": "عنوان قصير يناسب الفكرة المركزية للمقطع كله", "ru": "короткий заголовок о главной мысли всего отрывка", "en": "a short title that fits the main idea of the whole passage"}],3,{"he": "בדקו אם הכותרת מתאימה גם להתחלה וגם לסוף.", "ar": "تحققوا هل يناسب العنوان البداية والنهاية معًا.", "ru": "Проверьте, подходит ли заголовок и к началу, и к концу.", "en": "Check whether the title fits both the start and the end."},{"he": "כותרת טובה קצרה וממוקדת. היא מתאימה לכל חלקי הקטע ולא רק לחלק אחד. אם היא מתאימה רק לפסוק אחד, היא צרה מדי.", "ar": "العنوان الجيد قصير ومركّز. يناسب كل أجزاء المقطع لا جزءًا واحدًا فقط. وإن ناسب آية واحدة فقط فهو ضيق جدًا.", "ru": "Хороший заголовок короткий и точный. Он подходит ко всем частям отрывка, а не к одной. Если он подходит лишь к одному стиху, он слишком узок.", "en": "A good title is short and focused. It fits all parts of the passage, not just one. If it fits only one verse, it is too narrow."},null,[{"he": "פרט אחד לא מייצג את הקטע כולו.", "ar": "تفصيل واحد لا يمثّل المقطع كله.", "ru": "Одна деталь не представляет весь отрывок.", "en": "One detail does not represent the whole passage."}, {"he": "כותרת היא תמצית, לא סיכום של כל פסוק.", "ar": "العنوان خلاصة، لا تلخيص لكل آية.", "ru": "Заголовок — суть, а не пересказ каждого стиха.", "en": "A title is the gist, not a summary of every verse."}, {"he": "הכותרת צריכה לשקף את הטקסט, לא את דעת הקורא.", "ar": "يجب أن يعكس العنوان النص، لا رأي القارئ.", "ru": "Заголовок должен отражать текст, а не мнение читателя.", "en": "A title should reflect the text, not the reader's opinion."}, null]),
  Q("un61-1-05",{"he": "מהו מבנה מסגרת בקטע מקראי?", "ar": "ما البنية الإطارية في مقطع كتابي؟", "ru": "Что такое рамочная композиция в библейском отрывке?", "en": "What is a frame structure in a biblical passage?"},[{"he": "אותן מילים מופיעות בפתיחת הקטע ובסיומו", "ar": "الكلمات نفسها تظهر في بداية المقطع ونهايته", "ru": "одни и те же слова стоят в начале и в конце отрывка", "en": "the same words appear at the start and end of the passage"}, {"he": "הקטע מסתיים בשאלה שאין לה תשובה ברורה", "ar": "ينتهي المقطع بسؤال لا جواب واضحًا له", "ru": "отрывок заканчивается вопросом без ответа", "en": "the passage ends with a question that has no answer"}, {"he": "כל פסוק בקטע בנוי משתי צלעות מקבילות ושוות", "ar": "كل آية في المقطع مبنية من شطرين متوازيين ومتساويين", "ru": "каждый стих отрывка состоит из двух равных параллельных половин", "en": "every verse in the passage has two equal, parallel halves of text"}, {"he": "הדמות הראשית מופיעה רק באמצע הקטע", "ar": "الشخصية الرئيسية تظهر في وسط المقطع فقط", "ru": "главный герой появляется только в середине", "en": "the main character appears only in the middle"}],0,{"he": "השוו את השורה הראשונה לשורה האחרונה.", "ar": "قارنوا السطر الأول بالسطر الأخير.", "ru": "Сравните первую строку с последней.", "en": "Compare the first line with the last line."},{"he": "במבנה מסגרת הקטע נפתח ונסגר באותן מילים. כך הוא נראה כיחידה אחת. דוגמה: תהלים ח׳ נפתח ונגמר ב״ה׳ אדנינו מה אדיר שמך בכל הארץ״.", "ar": "في البنية الإطارية يبدأ المقطع وينتهي بالكلمات نفسها. فيبدو وحدة واحدة. مثال: المزمور 8 يبدأ وينتهي بعبارة «أيها الرب سيدنا، ما أمجد اسمك في كل الأرض».", "ru": "В рамочной композиции отрывок начинается и кончается одними словами. Так он выглядит единым целым. Пример: Псалом 8 открывается и закрывается словами «Господи, Боже наш! как величественно имя Твоё по всей земле».", "en": "In a frame structure the passage opens and closes with the same words. This makes it one unit. Example: Psalm 8 opens and ends with \"O LORD, our Lord, how majestic is your name in all the earth.\""},null,[null, {"he": "שאלה פתוחה בסוף אינה יוצרת מסגרת.", "ar": "السؤال المفتوح في النهاية لا يصنع إطارًا.", "ru": "Открытый вопрос в конце не создаёт рамки.", "en": "An open question at the end does not create a frame."}, {"he": "זה תיאור של תקבולת, לא של מסגרת.", "ar": "هذا وصف للتوازي، لا للإطار.", "ru": "Это описание параллелизма, а не рамки.", "en": "That describes parallelism, not a frame."}, {"he": "מסגרת נוצרת מחזרה בקצוות, לא ממקום הדמות.", "ar": "الإطار يُصنع بتكرار عند الطرفين، لا بموقع الشخصية.", "ru": "Рамка создаётся повтором по краям, а не местом героя.", "en": "A frame comes from repetition at the edges, not the character's position."}]),
  Q("un61-1-06",{"he": "בקטע עם הרבה דיבור, איך מזהים מי הדובר?", "ar": "في مقطع فيه حوار كثير، كيف نعرف المتكلم؟", "ru": "Как в отрывке с множеством реплик понять, кто говорит?", "en": "In a passage with a lot of dialogue, how do you identify the speaker?"},[{"he": "מניחים שהדמות הראשונה בפרק היא תמיד המדברת", "ar": "نفترض أن أول شخصية في الأصحاح هي المتكلمة دائمًا", "ru": "считаем, что всегда говорит первый герой, названный в главе", "en": "assume the first character in the chapter is always the one who speaks"}, {"he": "מחפשים פועל של אמירה ואת השם שבא אחריו", "ar": "نبحث عن فعل قول والاسم الذي يليه", "ru": "ищем глагол речи и имя после него", "en": "look for a verb of saying and the name after it"}, {"he": "בוחרים בדמות החשובה ביותר בסיפור", "ar": "نختار أهم شخصية في القصة", "ru": "выбираем самого важного героя рассказа", "en": "choose the most important character in the story"}, {"he": "סופרים כמה מילים יש בכל משפט", "ar": "نعدّ كم كلمة في كل جملة", "ru": "считаем слова в каждой фразе", "en": "count how many words each sentence has"}],1,{"he": "במקרא דיבור נפתח לרוב במילה ״ויאמר״.", "ar": "في الكتاب يبدأ الكلام غالبًا بكلمة «وقال».", "ru": "В Библии речь обычно вводится словом «и сказал».", "en": "In the Bible speech usually opens with \"and he said.\""},{"he": "פעלים כמו ״ויאמר״ או ״ויען״ מסמנים דיבור. אחריהם בא לרוב שם הדובר. כשאין שם, בודקים מי דיבר קודם ואל מי פנו.", "ar": "أفعال مثل «وقال» أو «فأجاب» تدل على الكلام. وبعدها يأتي غالبًا اسم المتكلم. وإن لم يُذكر الاسم نفحص من تكلّم قبل ومن خوطب.", "ru": "Глаголы «и сказал» или «и ответил» вводят речь. После них обычно стоит имя говорящего. Если имени нет, смотрим, кто говорил раньше и к кому обращались.", "en": "Verbs like \"and he said\" or \"and he answered\" mark speech. The speaker's name usually follows. If there is no name, check who spoke before and who was addressed."},null,[{"he": "הדובר מתחלף בדיאלוג, ולכן אי אפשר להניח זאת.", "ar": "يتبدّل المتكلم في الحوار، فلا يصح هذا الافتراض.", "ru": "В диалоге говорящие сменяются, так что это неверно.", "en": "Speakers change in dialogue, so you cannot assume this."}, null, {"he": "חשיבות הדמות אינה אומרת מי מדבר כרגע.", "ar": "أهمية الشخصية لا تحدد من يتكلم الآن.", "ru": "Важность героя не говорит, кто говорит сейчас.", "en": "A character's importance does not tell who is speaking now."}, {"he": "מספר המילים לא מגלה מי אומר אותן.", "ar": "عدد الكلمات لا يكشف من يقولها.", "ru": "Число слов не показывает, кто их произносит.", "en": "The number of words does not reveal who says them."}])],
 [
  Q("bib-unseen-1261-3",{"he": "איזה תיאור מתאים לדמות ונקודת מבטה?", "ar": "أي وصف يناسب الشخصية ومنظورها؟", "ru": "Какое описание подходит к «Персонаж и его взгляд»?", "en": "Which description fits character viewpoint?"},[{"he": "מילה שמופיעה כמה פעמים ויכולה לקשר בין חלקי הקטע.", "ar": "كلمة تتكرر وقد تربط بين أجزاء المقطع.", "ru": "Слово, повторяющееся и связывающее части отрывка.", "en": "A word recurring across a passage that can link its parts."},{"he": "דמות אומרת דבר אחד ועושה אחר; הפער עשוי ללמד על מניע או שינוי.", "ar": "تقول الشخصية شيئًا وتفعل غيره؛ وقد يكشف الفرق دافعًا أو تغيرًا.", "ru": "Герой говорит одно, а делает другое; расхождение может показать мотив или перемену.", "en": "A character says one thing but does another; the gap may reveal motive or change."},{"he": "טענה של דמות היא דבריה שלה; לא תמיד זו עמדת הסיפור כולו.", "ar": "قول الشخصية يعبر عنها؛ وليس بالضرورة موقف السرد كله.", "ru": "Слова персонажа выражают его взгляд, но не всегда позицию всего рассказа.", "en": "A character’s claim is their own and not always the stance of the whole narrative."},{"he": "פירוש פרט לא ברור באמצעות מה שקודם לו ומה שבא אחריו.", "ar": "تفسير تفصيل غير واضح بما يسبقه وما يليه.", "ru": "Толкование неясной детали по тому, что до и после неё.", "en": "Reading an unclear detail in light of what comes before and after."}],2,{"he": "חפשו את הפרט שמבדיל אותו מן האחרים.", "ar": "ابحثوا عن التفصيل الذي يميزه عن غيره.", "ru": "Ищите отличие от остальных вариантов.", "en": "Look for the detail that separates it from the others."},{"he": "יש להפריד בין קול הדמות לבין מה שהמספר מתאר.", "ar": "ميّزوا صوت الشخصية عما يرويه السارد.", "ru": "Отделяйте голос героя от сообщения рассказчика.", "en": "Separate a character’s voice from the narrator’s account."},null,[{"he": "זה מתאר את מילת מפתח חוזרת, לא את דמות ונקודת מבטה.", "ar": "هذا يصف كلمة مفتاحية مكررة، لا الشخصية ومنظورها.", "ru": "Это описание «Повторяющееся ключевое слово», а не «Персонаж и его взгляд».", "en": "That describes repeated key word, not character viewpoint."},{"he": "זה מתאר את הבדל בין דיבור למעשה, לא את דמות ונקודת מבטה.", "ar": "هذا يصف فرق القول والعمل، لا الشخصية ومنظورها.", "ru": "Это описание «Разница между словом и делом», а не «Персонаж и его взгляд».", "en": "That describes speech-action gap, not character viewpoint."},null,{"he": "זה מתאר את הסקה מן ההקשר, לא את דמות ונקודת מבטה.", "ar": "هذا يصف استنتاج من السياق، لا الشخصية ومنظورها.", "ru": "Это описание «Вывод из контекста», а не «Персонаж и его взгляд».", "en": "That describes inference from context, not character viewpoint."}])
 ,Q("bib-unseen-gap",{"he": "דמות בקטע אומרת 'אעשה ככל דברך' אך מיד פועלת ההפך. מה הדרך הנכונה לקרוא זאת?", "ar": "شخصية في المقطع تقول «سأفعل كل ما تقول» لكنها تفعل العكس فورًا. ما القراءة الصحيحة؟", "ru": "Персонаж в отрывке говорит «сделаю всё, что ты скажешь», но тут же поступает наоборот. Как это правильно читать?", "en": "A character in a passage says \"I will do all you say\" but immediately does the opposite. How should this be read?"},[{"he": "כפער מכוון בין דיבור למעשה, המלמד על הדמות", "ar": "كفجوة مقصودة بين القول والفعل تكشف عن الشخصية", "ru": "Как намеренный разрыв между словом и делом, раскрывающий персонажа", "en": "As a deliberate gap between speech and action that reveals the character"},{"he": "כטעות של המחבר", "ar": "كخطأ من المؤلف", "ru": "Как ошибку автора", "en": "As the author's mistake"},{"he": "כהוכחה שהדמות אמרה את האמת", "ar": "كدليل أن الشخصية صدقت", "ru": "Как доказательство, что персонаж говорил правду", "en": "As proof the character told the truth"},{"he": "כפרט שאין לו משמעות", "ar": "كتفصيل بلا معنى", "ru": "Как незначащую деталь", "en": "As a meaningless detail"}],0,{"he": "כשהטקסט שם דיבור ומעשה זה מול זה, שאלו למה.", "ar": "حين يضع النص القول والفعل متقابلين، اسألوا لماذا.", "ru": "Когда текст ставит слово и дело рядом, спросите зачем.", "en": "When the text places speech and action side by side, ask why."},{"he": "פער בין דיבור למעשה הוא כלי ספרותי ידוע. דוגמה: דמות המבטיחה ומפרה מיד נחשפת ככזבנית או כמתלבטת - והקורא לומד עליה יותר מאשר מתיאור ישיר.", "ar": "الفجوة بين القول والفعل أداة أدبية معروفة. مثال: شخصية تَعِد وتخلف فورًا تنكشف كاذبة أو مترددة - والقارئ يتعلم عنها أكثر مما يعلمه الوصف المباشر.", "ru": "Разрыв между словом и делом - известный литературный приём. Пример: персонаж, обещающий и тут же нарушающий, раскрывается как лжец или как сомневающийся - и читатель узнаёт о нём больше, чем из прямого описания.", "en": "A gap between speech and action is a known literary tool. Example: a character who promises and immediately breaks it is exposed as a liar or as conflicted - and the reader learns more than from direct description."},null,[null,{"he": "כתיבה עתיקה מכוונת; ההנחה היא שהפער נועד ללמד.", "ar": "الكتابة القديمة مقصودة؛ الافتراض أن الفجوة تُقصد للتعليم.", "ru": "Древний текст намеренен; предполагается, что разрыв призван учить.", "en": "Ancient writing is deliberate; the assumption is the gap is meant to teach."},{"he": "המעשה סותר את הדיבור; זו בדיוק הנקודה.", "ar": "الفعل يناقض القول؛ هذه بالضبط النقطة.", "ru": "Дело противоречит слову; в этом и суть.", "en": "The action contradicts the speech; that is exactly the point."},{"he": "הצמדת דיבור ומעשה הופכת פרט 'קטן' לחשוב.", "ar": "جمع القول والفعل يحوّل تفصيلًا «صغيرًا» إلى مهم.", "ru": "Соседство слова и дела превращает «мелкую» деталь в важную.", "en": "Placing speech beside action turns a \"small\" detail into an important one."}]),Q("bib-unseen-pov",{"he": "כיצד מזהים מנקודת מבט של דמות בקטע מקראי?", "ar": "كيف نحدد وجهة نظر شخصية في مقطع توراتي؟", "ru": "Как определить точку зрения персонажа в библейском отрывке?", "en": "How do you identify a character's point of view in a biblical passage?"},[{"he": "עוקבים אחרי מילות הרגש, הערכה והפנייה שלה, ומשווים לדברי דמויות אחרות", "ar": "نتتبع كلمات العاطفة والتقييم والنداء لديها، ونقارن بكلام شخصيات أخرى", "ru": "Следим за её словами чувства, оценки и обращения и сравниваем со словами других персонажей", "en": "Track her words of feeling, judgment and address, and compare with other characters' speech"},{"he": "סופרים כמה פעמים שמה מופיע", "ar": "نعدّ كم مرة يظهر اسمها", "ru": "Считаем, сколько раз появляется её имя", "en": "Count how many times her name appears"},{"he": "מנחשים לפי סוף הקטע", "ar": "نخمّن من نهاية المقطع", "ru": "Угадываем по концу отрывка", "en": "Guess from the end of the passage"},{"he": "מסתמכים על מה שאומרים עליה בלבד", "ar": "نعتمد فقط على ما يقوله عنها الآخرون", "ru": "Полагаемся только на то, что о ней говорят", "en": "Rely only on what others say about her"}],0,{"he": "המילים של הדמות עצמה הן הרמז הראשי.", "ar": "كلمات الشخصية نفسها هي الدليل الرئيس.", "ru": "Слова самого персонажа - главная подсказка.", "en": "The character's own words are the main clue."},{"he": "נקודת מבט נבנית מבחירות לשוניות. דוגמה: אם דמות קוראת לאחיה 'אדוני' אך חושבת 'אחי הבכור', המילים החוזרות חושפות עמדה. השוואה לדמות אחרת מחדדת את ההבדל.", "ar": "وجهة النظر تُبنى من اختيارات لغوية. مثال: إذا نادت شخصية أخاها «سيدي» لكنها تفكر «أخي البكر»، تكشف الكلمات المتكررة موقفًا. المقارنة بشخصية أخرى توضح الفرق.", "ru": "Точка зрения строится из языковых выборов. Пример: если персонаж зовёт брата «господин мой», но думает «старший брат мой», повторяющиеся слова раскрывают позицию. Сравнение с другим персонажем заостряет различие.", "en": "Point of view is built from language choices. Example: if a character calls her brother \"my lord\" but thinks \"my elder brother\", the recurring words reveal a stance. Comparing with another character sharpens the difference."},null,[null,{"he": "מניין שמות אומר על תדירות, לא על עמדה.", "ar": "عدّ الأسماء يقول شيئًا عن التكرار لا عن الموقف.", "ru": "Подсчёт имён говорит о частоте, а не о позиции.", "en": "Counting names tells frequency, not stance."},{"he": "נקודת מבט נבנית לאורך הקטע, לא מניחוש על סופו.", "ar": "وجهة النظر تُبنى عبر المقطع لا من تخمين نهايته.", "ru": "Точка зрения строится по ходу отрывка, а не угадывается по концу.", "en": "Point of view builds through the passage, not from guessing its end."},{"he": "דברי אחרים מוסיפים זווית, אך המילים שלה הן הראיה הראשונה.", "ar": "كلام الآخرين يضيف زاوية، لكن كلماتها هي الدليل الأول.", "ru": "Слова других добавляют угол, но её слова - первое свидетельство.", "en": "Others' words add an angle, but her own words are the first evidence."}]),
  Q("un61-2-01",{"he": "״בן חכם ישמח אב ובן כסיל תוגת אמו״ (משלי י׳). איזו תקבולת זו?", "ar": "«الابن الحكيم يُفرح أباه والابن الجاهل حزن أمه» (الأمثال 10). أي توازٍ هذا؟", "ru": "«Мудрый сын радует отца, а глупый сын — огорчение для матери» (Притчи 10). Какой это параллелизм?", "en": "\"A wise son makes a glad father, but a foolish son is a grief to his mother\" (Proverbs 10). What parallelism is this?"},[{"he": "תקבולת נרדפת: שתי הצלעות אומרות אותו דבר", "ar": "توازٍ ترادفي: الشطران يقولان الشيء نفسه", "ru": "синонимический: обе половины говорят одно и то же", "en": "synonymous: both halves say the same thing"}, {"he": "אין כאן תקבולת, כי מדובר בשני הורים שונים ולא באחד", "ar": "لا يوجد توازٍ هنا لأن الحديث عن والدين لا عن واحد", "ru": "здесь нет параллелизма, ведь речь о двух родителях, а не об одном", "en": "there is no parallelism, since two parents are named, not just one"}, {"he": "תקבולת ניגודית: חכם מול כסיל, שמחה מול צער", "ar": "توازٍ تضادّي: حكيم مقابل جاهل، وفرح مقابل حزن", "ru": "антитетический: мудрый против глупого, радость против горя", "en": "antithetic: wise against foolish, joy against grief"}, {"he": "תקבולת משלימה: הצלע השנייה ממשיכה סיפור", "ar": "توازٍ تكميلي: الشطر الثاني يكمل قصة", "ru": "дополняющий: вторая половина продолжает рассказ", "en": "completing: the second half continues a story"}],2,{"he": "השוו מילה מול מילה: בן מול בן, חכם מול...?", "ar": "قارنوا كلمة بكلمة: ابن مقابل ابن، حكيم مقابل...؟", "ru": "Сравните слово со словом: сын — сын, мудрый — ...?", "en": "Compare word to word: son with son, wise with...?"},{"he": "כל מילה בצלע הראשונה מקבילה למילה בשנייה. חכם מול כסיל, ישמח מול תוגה, אב מול אם. הניגוד מבליט את המסר: לבחירות של הבן יש תוצאה.", "ar": "كل كلمة في الشطر الأول تقابل كلمة في الثاني. حكيم مقابل جاهل، ويُفرح مقابل حزن، وأب مقابل أم. والتضاد يُبرز الرسالة: لاختيارات الابن نتيجة.", "ru": "Каждое слово первой половины соответствует слову второй. Мудрый — глупый, радует — горе, отец — мать. Контраст подчёркивает мысль: выбор сына имеет последствия.", "en": "Each word in the first half matches one in the second. Wise and foolish, glad and grief, father and mother. The contrast stresses the message: the son's choices have results."},null,[{"he": "הצלעות מנוגדות זו לזו, ולא אומרות אותו דבר.", "ar": "الشطران متضادان، ولا يقولان الشيء نفسه.", "ru": "Половины противоположны, а не повторяют одно и то же.", "en": "The halves are opposed; they do not say the same thing."}, {"he": "אב ואם הם זוג מקביל; זה חלק מן התקבולת.", "ar": "الأب والأم زوج متوازٍ؛ وهذا جزء من التوازي.", "ru": "Отец и мать — параллельная пара; это часть параллелизма.", "en": "Father and mother are a parallel pair; that is part of the parallelism."}, null, {"he": "אין כאן סיפור; יש שני מצבים הפוכים.", "ar": "لا قصة هنا؛ بل حالتان متعاكستان.", "ru": "Здесь нет рассказа, есть два противоположных случая.", "en": "There is no story here; there are two opposite cases."}]),
  Q("un61-2-02",{"he": "תהלים ח׳ נפתח ונגמר באותן מילים. מה החזרה הזאת עושה למזמור?", "ar": "يبدأ المزمور 8 وينتهي بالكلمات نفسها. ماذا يفعل هذا التكرار بالمزمور؟", "ru": "Псалом 8 начинается и заканчивается одними и теми же словами. Что даёт этот повтор?", "en": "Psalm 8 opens and ends with the same words. What does this repetition do?"},[{"he": "מראה שהמשורר שכח מה הוא כתב בשורה הראשונה של המזמור", "ar": "يُظهر أن الشاعر نسي ما كتبه في بداية المزمور", "ru": "показывает, что автор забыл, что писал в начале псалма", "en": "it shows the poet forgot what he wrote at the start of the psalm"}, {"he": "מחלקת את המזמור לשני שירים שונים", "ar": "يقسم المزمور إلى قصيدتين مختلفتين", "ru": "делит псалом на два разных стихотворения", "en": "it splits the psalm into two different poems"}, {"he": "מסמנת שהמזמור הוא סיפור עם עלילה", "ar": "يدل على أن المزمور قصة لها حبكة", "ru": "указывает, что псалом — рассказ с сюжетом", "en": "it marks the psalm as a story with a plot"}, {"he": "יוצרת מסגרת של שבח שעוטפת את כל המזמור", "ar": "يصنع إطارًا من التسبيح يحيط بالمزمور كله", "ru": "создаёт рамку хвалы вокруг всего псалма", "en": "it creates a frame of praise around the whole psalm"}],3,{"he": "מה קורה לתוכן שנמצא בין שתי שורות זהות?", "ar": "ماذا يحدث للمضمون الواقع بين سطرين متطابقين؟", "ru": "Что происходит с содержанием между двумя одинаковыми строками?", "en": "What happens to the content between two identical lines?"},{"he": "המילים ״ה׳ אדנינו מה אדיר שמך בכל הארץ״ פותחות וסוגרות. כל מה שבאמצע, גם על האדם, נקרא בתוך השבח לאלוהים. המסגרת נותנת למזמור אחדות.", "ar": "الآية «أيها الرب سيدنا، ما أمجد اسمك في كل الأرض» تفتح وتختم. كل ما في الوسط، حتى عن الإنسان، يُقرأ ضمن تسبيح الله. والإطار يمنح المزمور وحدة.", "ru": "Стих «Господи, Боже наш! как величественно имя Твоё по всей земле» открывает и закрывает псалом. Всё, что посередине, даже о человеке, читается внутри хвалы Богу. Рамка придаёт псалму единство.", "en": "The verse \"O LORD, our Lord, how majestic is your name in all the earth\" opens and closes. Everything between, even about humans, is read inside the praise of God. The frame gives the psalm unity."},null,[{"he": "חזרה בקצוות היא בחירה מכוונת, לא שכחה.", "ar": "التكرار عند الطرفين اختيار مقصود، لا نسيان.", "ru": "Повтор по краям — намеренный выбор, а не забывчивость.", "en": "Repetition at both ends is a deliberate choice, not forgetfulness."}, {"he": "המסגרת מאחדת את המזמור, ולא מחלקת אותו.", "ar": "الإطار يوحّد المزمور، ولا يقسمه.", "ru": "Рамка объединяет псалом, а не делит его.", "en": "The frame unifies the psalm; it does not divide it."}, {"he": "המזמור הוא שיר שבח, ואין בו עלילה.", "ar": "المزمور قصيدة تسبيح، ولا حبكة فيه.", "ru": "Псалом — хвалебная песнь, в нём нет сюжета.", "en": "The psalm is a hymn of praise with no plot."}, null]),
  Q("un61-2-03",{"he": "״ידע שור קנהו וחמור אבוס בעליו, ישראל לא ידע״ (ישעיהו א׳). איזה כלי ספרותי בולט כאן?", "ar": "«الثور يعرف قانيه والحمار معلف صاحبه، أما إسرائيل فلا يعرف» (إشعياء 1). أي أداة أدبية بارزة هنا؟", "ru": "«Вол знает владетеля своего, и осёл — ясли господина своего; а Израиль не знает» (Исаия 1). Какой приём здесь заметен?", "en": "\"The ox knows its owner, and the donkey its master's crib, but Israel does not know\" (Isaiah 1). What literary device stands out?"},[{"he": "ניגוד: בהמות מכירות את בעליהן, והעם לא", "ar": "تضاد: البهائم تعرف أصحابها، والشعب لا", "ru": "контраст: животные знают хозяина, а народ — нет", "en": "contrast: animals know their owner, but the people do not"}, {"he": "תיאור טבע שאין בו ביקורת על העם", "ar": "وصف للطبيعة لا نقد فيه للشعب", "ru": "описание природы без упрёка народу", "en": "a nature scene with no criticism of the people"}, {"he": "שבח לעם על שהוא דומה לבהמות בית נאמנות ושקטות", "ar": "مدح للشعب لأنه يشبه بهائم بيت وفيّة وهادئة", "ru": "похвала народу за сходство с верными и смирными животными", "en": "praise of the people for being like loyal and quiet farm animals"}, {"he": "חוק שעוסק בבעלות על שור וחמור", "ar": "قانون يتناول ملكية الثور والحمار", "ru": "закон о праве собственности на вола и осла", "en": "a law about owning an ox and a donkey"}],0,{"he": "מה יודעות החיות, ומה העם לא יודע?", "ar": "ماذا تعرف الحيوانات، وماذا لا يعرف الشعب؟", "ru": "Что знают животные и чего не знает народ?", "en": "What do the animals know, and what do the people not know?"},{"he": "אפילו שור וחמור יודעים מי מאכיל אותם. לפי הנביא, העם לא מכיר את אלוהיו. הניגוד מבליט את חומרת הביקורת.", "ar": "حتى الثور والحمار يعرفان من يطعمهما. وبحسب النبي، الشعب لا يعرف إلهه. والتضاد يُبرز شدة النقد.", "ru": "Даже вол и осёл знают, кто их кормит. По словам пророка, народ не знает своего Бога. Контраст усиливает упрёк.", "en": "Even an ox and a donkey know who feeds them. By the prophet's words, the people do not know their God. The contrast sharpens the rebuke."},null,[null, {"he": "החיות מוזכרות כדי להוכיח את העם, לא כתיאור טבע.", "ar": "تُذكر الحيوانات لتوبيخ الشعب، لا لوصف الطبيعة.", "ru": "Животные упомянуты, чтобы обличить народ, а не описать природу.", "en": "The animals serve to rebuke the people, not to describe nature."}, {"he": "״ישראל לא ידע״ הוא ביקורת, ולא שבח.", "ar": "«إسرائيل لا يعرف» نقد، لا مدح.", "ru": "«Израиль не знает» — это упрёк, а не похвала.", "en": "\"Israel does not know\" is criticism, not praise."}, {"he": "זה פסוק בנבואה שירית, לא חוק בעלות.", "ar": "هذه آية في نبوة شعرية، لا قانون ملكية.", "ru": "Это стих поэтического пророчества, а не закон о собственности.", "en": "This is a line of poetic prophecy, not a property law."}]),
  Q("un61-2-04",{"he": "תלמיד לא מכיר את המילה ״האזיני״ בפסוק ״שמעו שמים והאזיני ארץ״. איך התקבולת עוזרת לו?", "ar": "طالب لا يعرف معنى «أصغي» في «اسمعي أيتها السماوات وأصغي أيتها الأرض». كيف يساعده التوازي؟", "ru": "Ученик не знает слова «внимай» в стихе «Слушайте, небеса, и внимай, земля». Как помогает параллелизм?", "en": "A student does not know \"give ear\" in \"Hear, O heavens, and give ear, O earth.\" How does parallelism help?"},[{"he": "״האזיני״ מקבילה ל״ארץ״, ולכן זו מילה לאדמה", "ar": "«أصغي» تقابل «الأرض»، لذلك هي كلمة للتراب", "ru": "«внимай» стоит параллельно «земля», значит это о почве", "en": "\"give ear\" parallels \"earth,\" so it is a word for soil"}, {"he": "״האזיני״ מקבילה ל״שמעו״, ולכן פירושה דומה", "ar": "«أصغي» تقابل «اسمعي»، لذلك معناها قريب", "ru": "«внимай» стоит параллельно «слушайте», значит смысл близок", "en": "\"give ear\" parallels \"hear,\" so its meaning is similar"}, {"he": "התקבולת לא עוזרת; צריך מילון בלבד", "ar": "التوازي لا يساعد؛ يلزم القاموس فقط", "ru": "параллелизм не поможет, нужен только словарь", "en": "parallelism does not help; only a dictionary does"}, {"he": "״האזיני״ היא ההפך של ״שמעו״, כי זו תקבולת ניגודית", "ar": "«أصغي» عكس «اسمعي» لأن هذا توازٍ تضادّي واضح", "ru": "«внимай» противоположно «слушайте», раз это антитетический параллелизм", "en": "\"give ear\" is the opposite of \"hear,\" since this is antithetic parallelism"}],1,{"he": "חפשו מילה בצלע הראשונה שעומדת באותו מקום.", "ar": "ابحثوا عن كلمة في الشطر الأول تقف في الموضع نفسه.", "ru": "Найдите слово первой половины, стоящее на том же месте.", "en": "Find the word in the first half that stands in the same slot."},{"he": "בתקבולת נרדפת כל מילה עומדת מול מילה דומה. ״שמעו״ מול ״האזיני״, ״שמים״ מול ״ארץ״. מכאן אפשר להבין: האזיני פירושה הקשיבי.", "ar": "في التوازي الترادفي تقف كل كلمة مقابل كلمة قريبة. «اسمعي» مقابل «أصغي»، و«السماوات» مقابل «الأرض». ومن هنا نفهم أن «أصغي» تعني استمعي.", "ru": "В синонимическом параллелизме каждое слово стоит против близкого. «Слушайте» — «внимай», «небеса» — «земля». Отсюда ясно: «внимай» значит «слушай».", "en": "In synonymous parallelism each word faces a similar one. \"Hear\" with \"give ear,\" \"heavens\" with \"earth.\" So \"give ear\" means listen."},null,[{"he": "״ארץ״ מקבילה ל״שמים״, ו״האזיני״ מקבילה לפועל ״שמעו״.", "ar": "«الأرض» تقابل «السماوات»، و«أصغي» تقابل فعل «اسمعي».", "ru": "«Земля» параллельна «небесам», а «внимай» — глаголу «слушайте».", "en": "\"Earth\" parallels \"heavens,\" and \"give ear\" parallels the verb \"hear.\""}, null, {"he": "התקבולת היא כלי מוכר להבנת מילה לא מוכרת.", "ar": "التوازي أداة معروفة لفهم كلمة غير مألوفة.", "ru": "Параллелизм — известный способ понять незнакомое слово.", "en": "Parallelism is a known tool for understanding an unfamiliar word."}, {"he": "כאן התקבולת נרדפת, לא ניגודית; שתי הצלעות קוראות להקשיב.", "ar": "التوازي هنا ترادفي لا تضادّي؛ الشطران يدعوان للإصغاء.", "ru": "Здесь параллелизм синонимический: обе половины зовут слушать.", "en": "Here the parallelism is synonymous; both halves call to listen."}]),
  Q("un61-2-05",{"he": "״ויאכל וישת ויקם וילך ויבז עשו את הבכרה״ (בראשית כ״ה). מה רצף הפעלים מלמד על עשו?", "ar": "«فأكل وشرب وقام ومضى، فاحتقر عيسو البكورية» (التكوين 25). ماذا تعلّمنا سلسلة الأفعال عن عيسو؟", "ru": "«И он ел и пил, и встал и пошёл; и пренебрёг Исав первородством» (Бытие 25). Что ряд глаголов говорит об Исаве?", "en": "\"He ate and drank, rose and went his way; thus Esau despised his birthright\" (Genesis 25). What does the chain of verbs show about Esau?"},[{"he": "שהוא התלבט זמן רב לפני שהחליט", "ar": "أنه تردّد طويلًا قبل أن يتخذ قراره", "ru": "что он долго колебался, прежде чем решить", "en": "that he hesitated a long time before deciding"}, {"he": "שהוא כעס מאוד על יעקב ודיבר איתו בחריפות רבה", "ar": "أنه غضب على يعقوب وكلّمه بحدّة شديدة وبصوت عالٍ", "ru": "что он сильно рассердился на Иакова и очень резко с ним говорил", "en": "that he grew very angry at Jacob and spoke to him very harshly"}, {"he": "שהוא פעל במהירות, בלי לחשוב על מה שוויתר", "ar": "أنه تصرّف بسرعة، دون تفكير فيما تنازل عنه", "ru": "что он действовал быстро, не думая, от чего отказался", "en": "that he acted fast, without thinking about what he gave up"}, {"he": "שהוא הצטער מיד ורצה לבטל את המכירה", "ar": "أنه ندم فورًا وأراد أن يلغي البيع كله", "ru": "что он сразу пожалел и хотел отменить сделку", "en": "that he regretted it at once and wanted to undo the sale"}],2,{"he": "קראו את הפעלים בקול. כמה זמן לוקח כל אחד?", "ar": "اقرؤوا الأفعال بصوت عالٍ. كم يستغرق كل منها؟", "ru": "Прочитайте глаголы вслух. Сколько времени занимает каждый?", "en": "Read the verbs aloud. How long does each one take?"},{"he": "ארבעה פעלים קצרים ברצף, בלי מילה אחת של דיבור. הקצב המהיר מראה שעשו לא עצר לחשוב. זה אפיון עקיף דרך מעשים.", "ar": "أربعة أفعال قصيرة متتالية، بلا كلمة كلام واحدة. الإيقاع السريع يُظهر أن عيسو لم يتوقف ليفكر. هذا توصيف غير مباشر عبر الأفعال.", "ru": "Четыре коротких глагола подряд и ни одного слова речи. Быстрый ритм показывает, что Исав не остановился подумать. Это косвенная характеристика через поступки.", "en": "Four short verbs in a row, without a word of speech. The fast pace shows Esau did not stop to think. This is indirect characterization through actions."},null,[{"he": "רצף פעלים קצרים מראה מהירות, לא התלבטות.", "ar": "سلسلة أفعال قصيرة تدل على السرعة، لا التردد.", "ru": "Ряд коротких глаголов говорит о спешке, а не о колебании.", "en": "A chain of short verbs shows speed, not hesitation."}, {"he": "בפסוק הזה עשו לא מדבר בכלל, רק פועל.", "ar": "في هذه الآية لا يتكلم عيسو أبدًا، بل يفعل فقط.", "ru": "В этом стихе Исав вовсе не говорит, только действует.", "en": "In this verse Esau does not speak at all; he only acts."}, null, {"he": "אין בפסוק שום סימן לחרטה.", "ar": "لا توجد في الآية أي علامة على الندم.", "ru": "В стихе нет никакого признака сожаления.", "en": "The verse shows no sign of regret."}]),
  Q("un61-2-06",{"he": "בבראשית כ״ב חוזר המשפט ״וילכו שניהם יחדו״ פעמיים. מה החזרה מדגישה?", "ar": "في التكوين 22 تتكرر جملة «فذهبا كلاهما معًا» مرتين. ماذا يُبرز التكرار؟", "ru": "В Бытии 22 дважды повторяется «и шли оба вместе». Что подчёркивает повтор?", "en": "In Genesis 22 the phrase \"and the two of them walked on together\" repeats twice. What does this stress?"},[{"he": "את אורך הדרך מבאר שבע לירושלים", "ar": "طول الطريق من بئر السبع إلى أورشليم", "ru": "длину пути от Беэр-Шевы до Иерусалима", "en": "the distance from Beersheba to Jerusalem"}, {"he": "שהנערים הלכו יחד עם אברהם עד ראש ההר במוריה", "ar": "أن الغلامين ذهبا مع إبراهيم حتى رأس الجبل في المريا", "ru": "что слуги шли с Авраамом до самой вершины горы", "en": "that the servants walked with Abraham up to the mountain top"}, {"he": "שאברהם ויצחק רבו בדרך זה עם זה", "ar": "أن إبراهيم وإسحاق تخاصما في الطريق", "ru": "что Авраам и Исаак поссорились в пути", "en": "that Abraham and Isaac quarreled on the way"}, {"he": "את הקשר בין אברהם ליצחק בדרך הקשה", "ar": "الرابط بين إبراهيم وإسحاق في الطريق الصعب", "ru": "связь Авраама и Исаака на трудном пути", "en": "the bond between Abraham and Isaac on the hard road"}],3,{"he": "מי הם ״שניהם״, ומה אומרת המילה ״יחדו״?", "ar": "من هما «كلاهما»، وماذا تقول كلمة «معًا»؟", "ru": "Кто такие «оба» и что значит слово «вместе»?", "en": "Who are \"the two,\" and what does \"together\" say?"},{"he": "המשפט בא פעם לפני שאלת יצחק על השה ופעם אחריה. החזרה מראה שהם ממשיכים יחד גם אחרי השאלה. כך הטקסט מבליט את הקשר ביניהם.", "ar": "تأتي الجملة مرة قبل سؤال إسحاق عن الحمل ومرة بعده. يُظهر التكرار أنهما يستمران معًا حتى بعد السؤال. وهكذا يُبرز النص الرابط بينهما.", "ru": "Фраза звучит до вопроса Исаака об агнце и после него. Повтор показывает, что они идут вместе и после вопроса. Так текст подчёркивает их связь.", "en": "The phrase comes once before Isaac's question about the lamb and once after. The repetition shows they go on together even after the question. So the text stresses their bond."},null,[{"he": "החזרה לא עוסקת במרחק, אלא במי שהולכים.", "ar": "التكرار لا يتناول المسافة، بل من يسيران.", "ru": "Повтор говорит не о расстоянии, а о тех, кто идёт.", "en": "The repetition is not about distance but about who is walking."}, {"he": "הנערים נשארו מאחור; ״שניהם״ הם אברהם ויצחק.", "ar": "بقي الغلامان في الخلف؛ «كلاهما» هما إبراهيم وإسحاق.", "ru": "Слуги остались позади; «оба» — это Авраам и Исаак.", "en": "The servants stayed behind; \"the two\" are Abraham and Isaac."}, {"he": "אין בפרק מריבה; המילה ״יחדו״ אומרת את ההפך.", "ar": "لا خصام في الأصحاح؛ وكلمة «معًا» تقول العكس.", "ru": "В главе нет ссоры; слово «вместе» говорит об обратном.", "en": "There is no quarrel; the word \"together\" says the opposite."}, null])],
 [
  Q("bib-unseen-1261-4",{"he": "איזה תיאור מתאים להסקה מן ההקשר?", "ar": "أي وصف يناسب استنتاج من السياق؟", "ru": "Какое описание подходит к «Вывод из контекста»?", "en": "Which description fits inference from context?"},[{"he": "מילה שמופיעה כמה פעמים ויכולה לקשר בין חלקי הקטע.", "ar": "كلمة تتكرر وقد تربط بين أجزاء المقطع.", "ru": "Слово, повторяющееся и связывающее части отрывка.", "en": "A word recurring across a passage that can link its parts."},{"he": "דמות אומרת דבר אחד ועושה אחר; הפער עשוי ללמד על מניע או שינוי.", "ar": "تقول الشخصية شيئًا وتفعل غيره؛ وقد يكشف الفرق دافعًا أو تغيرًا.", "ru": "Герой говорит одно, а делает другое; расхождение может показать мотив или перемену.", "en": "A character says one thing but does another; the gap may reveal motive or change."},{"he": "טענה של דמות היא דבריה שלה; לא תמיד זו עמדת הסיפור כולו.", "ar": "قول الشخصية يعبر عنها؛ وليس بالضرورة موقف السرد كله.", "ru": "Слова персонажа выражают его взгляд, но не всегда позицию всего рассказа.", "en": "A character’s claim is their own and not always the stance of the whole narrative."},{"he": "פירוש פרט לא ברור באמצעות מה שקודם לו ומה שבא אחריו.", "ar": "تفسير تفصيل غير واضح بما يسبقه وما يليه.", "ru": "Толкование неясной детали по тому, что до и после неё.", "en": "Reading an unclear detail in light of what comes before and after."}],3,{"he": "חפשו את הפרט שמבדיל אותו מן האחרים.", "ar": "ابحثوا عن التفصيل الذي يميزه عن غيره.", "ru": "Ищите отличие от остальных вариантов.", "en": "Look for the detail that separates it from the others."},{"he": "הקשר מצמצם אפשרויות, אך אין להמציא בו מידע חסר.", "ar": "يضيق السياق الاحتمالات لكنه لا يجيز اختراع معلومات.", "ru": "Контекст сужает варианты, но не позволяет додумывать факты.", "en": "Context narrows possibilities without licensing invented facts."},null,[{"he": "זה מתאר את מילת מפתח חוזרת, לא את הסקה מן ההקשר.", "ar": "هذا يصف كلمة مفتاحية مكررة، لا استنتاج من السياق.", "ru": "Это описание «Повторяющееся ключевое слово», а не «Вывод из контекста».", "en": "That describes repeated key word, not inference from context."},{"he": "זה מתאר את הבדל בין דיבור למעשה, לא את הסקה מן ההקשר.", "ar": "هذا يصف فرق القول والعمل، لا استنتاج من السياق.", "ru": "Это описание «Разница между словом и делом», а не «Вывод из контекста».", "en": "That describes speech-action gap, not inference from context."},{"he": "זה מתאר את דמות ונקודת מבטה, לא את הסקה מן ההקשר.", "ar": "هذا يصف الشخصية ومنظورها، لا استنتاج من السياق.", "ru": "Это описание «Персонаж и его взгляд», а не «Вывод из контекста».", "en": "That describes character viewpoint, not inference from context."},null])
 ,Q("bib-unseen-infer",{"he": "בקטע נאמר שדמות 'ירדה אל הגת בבוקר מוקדם' פעמיים, בלי הסבר. מה אפשר להסיק בזהירות?", "ar": "ورد في المقطع أن شخصية «نزلت إلى المعصرة باكرًا» مرتين دون شرح. ما الذي يمكن استنتاجه بحذر؟", "ru": "В отрывке дважды сказано, что персонаж «спустился к точилу рано утром», без объяснения. Что можно осторожно вывести?", "en": "A passage says twice that a character \"went down to the press early in the morning\", with no explanation. What can be cautiously inferred?"},[{"he": "שיש לה עניין קבוע במקום או באדם הקשור אליו - הסקה שיש לבסס בפרטים נוספים", "ar": "أن لديها اهتمامًا ثابتًا بالمكان أو بشخص مرتبط به - استنتاج يجب تدعيمه بتفاصيل أخرى", "ru": "Что у неё постоянный интерес к месту или связанному с ним человеку - вывод, который надо подкрепить другими деталями", "en": "That she has a steady interest in the place or in someone tied to it - an inference to support with further details"},{"he": "שהיא בהכרח אשמה במשהו", "ar": "أنها بالضرورة مذنبة بشيء ما", "ru": "Что она непременно в чём-то виновата", "en": "That she is necessarily guilty of something"},{"he": "שאין לחזרה שום משמעות", "ar": "أن التكرار بلا أي معنى", "ru": "Что повтор лишён смысла", "en": "That the repetition has no meaning"},{"he": "שהמחבר שכח לכתוב הסבר", "ar": "أن المؤلف نسي كتابة تفسير", "ru": "Что автор забыл написать объяснение", "en": "That the author forgot to write an explanation"}],0,{"he": "הסקה טובה מתחילה בפרט חוזר ונבדקת מול שאר הקטע.", "ar": "الاستنتاج الجيد يبدأ بتفصيل متكرر ويُفحص مع باقي المقطع.", "ru": "Хороший вывод начинается с повторяющейся детали и проверяется по всему отрывку.", "en": "A good inference starts with a recurring detail and is checked against the rest of the passage."},{"he": "הסקה מן ההקשר היא מיומנות מרכזית. דוגמה: חזרה על 'ירדה אל הגת' בזמנים קבועים מרמזת על מטרה חוזרת; אך רק פרטים נוספים (עם מי נפגשת, מה נאמר) יכריעו למה.", "ar": "الاستنتاج من السياق مهارة مركزية. مثال: تكرار «نزلت إلى المعصرة» في أوقات ثابتة يلمّح إلى غاية متكررة؛ لكن فقط تفاصيل أخرى (مع مَن تلتقي، ماذا يُقال) ستحسم لماذا.", "ru": "Вывод из контекста - центральный навык. Пример: повтор «спустилась к точилу» в одно и то же время намекает на повторяющуюся цель; но только другие детали (с кем встречается, что сказано) решат, зачем.", "en": "Inference from context is a core skill. Example: the repeated \"went down to the press\" at fixed times hints at a recurring purpose; but only further details (whom she meets, what is said) will decide why."},null,[null,{"he": "זו הסקה קפיצית; פרט אחד אינו הוכחה לאשמה.", "ar": "هذا استنتاج متسرّع؛ تفصيل واحد ليس برهان ذنب.", "ru": "Это поспешный вывод; одна деталь не доказательство вины.", "en": "That is a leaping inference; one detail is not proof of guilt."},{"he": "חזרה מכוונת היא סימן משמעות, לא רעש.", "ar": "التكرار المقصود علامة معنى لا ضجيج.", "ru": "Намеренный повтор - знак смысла, а не шум.", "en": "Deliberate repetition is a sign of meaning, not noise."},{"he": "ההנחה בקריאה היא שהטקסט מכוון; חיפוש ההסבר הוא עבודת הקורא.", "ar": "الافتراض في القراءة أن النص مقصود؛ البحث عن التفسير عمل القارئ.", "ru": "При чтении предполагается, что текст намеренен; поиск объяснения - работа читателя.", "en": "The reading assumption is that the text is deliberate; finding the explanation is the reader's work."}]),Q("bib-unseen-method",{"he": "תלמידה קוראת קטע מקראי חדש ומסתמכת רק על פירוש מוכר מהבית. מה חסר בעבודה שלה?", "ar": "طالبة تقرأ مقطعًا توراتيًا جديدًا وتعتمد فقط على تفسير معروف من البيت. ما الناقص في عملها؟", "ru": "Ученица читает новый библейский отрывок и опирается только на знакомое домашнее толкование. Чего не хватает в её работе?", "en": "A student reads a new biblical passage and relies only on a familiar interpretation from home. What is missing in her work?"},[{"he": "בדיקה עצמית של הטקסט עצמו - פרטים, מילות מפתח והקשר - לפני שמוסיפים פרשנות חיצונית", "ar": "فحص ذاتي للنص نفسه - تفاصيل وكلمات مفتاح وسياق - قبل إضافة تفسير خارجي", "ru": "Самостоятельная проверка самого текста - детали, ключевые слова и контекст - прежде чем добавлять внешнее толкование", "en": "Her own examination of the text itself - details, keywords and context - before adding an outside interpretation"},{"he": "שום דבר - פירוש מוכר תמיד נכון", "ar": "لا شيء - التفسير المعروف صحيح دائمًا", "ru": "Ничего - знакомое толкование всегда верно", "en": "Nothing - a familiar interpretation is always right"},{"he": "שהייתה צריכה לזכור יותר פירושים", "ar": "كان عليها حفظ مزيد من التفسيرات", "ru": "Ей следовало запомнить больше толкований", "en": "She should have memorized more interpretations"},{"he": "שקטעים חדשים אסור לקרוא בלי מורה", "ar": "أنه يُمنع قراءة مقاطع جديدة دون معلم", "ru": "Что новые отрывки нельзя читать без учителя", "en": "That new passages may not be read without a teacher"}],0,{"he": "מה ההבדל בין לקרוא טקסט לבין לצטט דעה עליו?", "ar": "ما الفرق بين قراءة النص وبين الاستشهاد برأي عنه؟", "ru": "В чём разница между чтением текста и цитированием мнения о нём?", "en": "What is the difference between reading a text and quoting an opinion about it?"},{"he": "מיומנות הקריאה מתחילה בטקסט עצמו. דוגמה: תלמידה שמוצאת בעצמה מילת מפתח או פער בין דיבור למעשה מגיעה לפירוש מבוסס; פירוש מוכר שימושי אחר כך כביקורת על הקריאה שלה.", "ar": "مهارة القراءة تبدأ من النص نفسه. مثال: طالبة تجد بنفسها كلمة مفتاح أو فجوة بين قول وفعل تصل إلى تفسير مؤسس؛ التفسير المعروف يفيد لاحقًا كنقد لقراءتها.", "ru": "Навык чтения начинается с самого текста. Пример: ученица, сама нашедшая ключевое слово или разрыв между словом и делом, приходит к обоснованному толкованию; знакомое толкование полезно позже как проверка её чтения.", "en": "Reading skill starts with the text itself. Example: a student who finds a keyword or a speech-action gap on her own reaches a grounded interpretation; a familiar interpretation is useful later as a check on her reading."},null,[null,{"he": "גם פירוש נכון אינו מחליף קריאה עצמית של הטקסט.", "ar": "حتى التفسير الصحيح لا يغني عن قراءة ذاتية للنص.", "ru": "Даже верное толкование не заменяет самостоятельного чтения текста.", "en": "Even a correct interpretation does not replace reading the text oneself."},{"he": "שינון פרשנויות אינו המיומנות; היכולת לבסס מן הטקסט היא המטרה.", "ar": "حفظ التفسيرات ليس المهارة؛ القدرة على التأسيس من النص هي الهدف.", "ru": "Заучивание толкований - не навык; цель - умение обосновывать из текста.", "en": "Memorizing interpretations is not the skill; grounding from the text is the goal."},{"he": "המיומנות נועדה בדיוק לאפשר קריאה עצמאית.", "ar": "المهارة قُصدت تمامًا لتمكين قراءة مستقلة.", "ru": "Навык предназначен именно для самостоятельного чтения.", "en": "The skill is meant precisely to enable independent reading."}]),
  Q("un61-3-01",{"he": "בקטע: מלך רוצה כרם, בעליו מסרב, המלכה מארגנת עדי שקר, ונביא מוכיח את המלך. מהי הכותרת המתאימה ביותר?", "ar": "في المقطع: ملك يريد كرمًا، صاحبه يرفض، الملكة تدبّر شهود زور، ونبي يوبّخ الملك. ما العنوان الأنسب؟", "ru": "В отрывке: царь хочет виноградник, хозяин отказывает, царица устраивает лжесвидетелей, пророк обличает царя. Какой заголовок лучше всего?", "en": "In a passage: a king wants a vineyard, the owner refuses, the queen arranges false witnesses, and a prophet rebukes the king. What is the best title?"},[{"he": "כוח השלטון מול זכות החלש, והנביא שמגן עליו", "ar": "سلطة الحكم مقابل حق الضعيف، والنبي الذي يدافع عنه", "ru": "власть против права слабого и пророк-защитник", "en": "royal power against the weak, and the prophet who defends them"}, {"he": "הכרם היפה והירוק שליד ארמון המלך בעיר יזרעאל שבעמק", "ar": "الكرم الجميل الأخضر الواقع قرب قصر الملك في مدينة يزرعيل", "ru": "красивый зелёный виноградник у царского дворца в Изрееле", "en": "the lovely green vineyard beside the king's palace in the city of Jezreel"}, {"he": "המכתבים שכתבה המלכה אל זקני העיר וחוריה", "ar": "الرسائل التي كتبتها الملكة لشيوخ المدينة وأشرافها", "ru": "письма царицы к старейшинам и знатным людям города", "en": "the letters the queen wrote to the city's elders and nobles"}, {"he": "איך קונים ומוכרים קרקע בממלכה העתיקה", "ar": "كيف كانت الأرض تُشترى وتُباع في المملكة القديمة", "ru": "как покупали и продавали землю в древнем царстве", "en": "how land was bought and sold in the ancient kingdom"}],0,{"he": "בדקו איזו כותרת מתאימה גם להתחלה, גם לאמצע וגם לסוף.", "ar": "تحققوا أي عنوان يناسب البداية والوسط والنهاية معًا.", "ru": "Проверьте, какой заголовок подходит к началу, середине и концу.", "en": "Check which title fits the beginning, middle and end."},{"he": "הכותרת צריכה לכסות את כל שלבי הקטע: הרצון, הסירוב, העוול והתוכחה. רק כותרת על כוח, חולשה ונביא מכסה את כולם. השאר מתארות פרט אחד.", "ar": "يجب أن يغطي العنوان كل مراحل المقطع: الرغبة والرفض والظلم والتوبيخ. فقط عنوان عن السلطة والضعف والنبي يغطيها كلها. والباقي يصف تفصيلًا واحدًا.", "ru": "Заголовок должен охватывать все этапы: желание, отказ, злодеяние и обличение. Только заголовок о власти, слабом и пророке охватывает всё. Остальные описывают одну деталь.", "en": "The title must cover every stage: the desire, the refusal, the wrong and the rebuke. Only the title on power, weakness and the prophet covers them all. The others describe one detail."},null,[null, {"he": "הכרם הוא רקע, והכותרת מחמיצה את העוול ואת התגובה.", "ar": "الكرم خلفية، والعنوان يُغفل الظلم والرد عليه.", "ru": "Виноградник — фон; заголовок упускает зло и ответ на него.", "en": "The vineyard is background; the title misses the wrong and the response."}, {"he": "המכתבים הם שלב אחד בעלילה, לא הרעיון המרכזי.", "ar": "الرسائل مرحلة واحدة في الحبكة، لا الفكرة المركزية.", "ru": "Письма — лишь один этап сюжета, а не главная мысль.", "en": "The letters are one stage of the plot, not the main idea."}, {"he": "הקנייה לא קרתה; הקטע עוסק בעוול, לא במסחר.", "ar": "الشراء لم يحدث؛ المقطع عن الظلم لا عن التجارة.", "ru": "Покупки не было; отрывок о зле, а не о торговле.", "en": "No purchase happened; the passage is about injustice, not trade."}]),
  Q("un61-3-02",{"he": "״אם תאבו ושמעתם טוב הארץ תאכלו, ואם תמאנו ומריתם חרב תאכלו״ (ישעיהו א׳). מה מלמדת החזרה על ״תאכלו״?", "ar": "«إن شئتم وسمعتم تأكلون خير الأرض، وإن أبيتم وتمردتم تُؤكَلون بالسيف» (إشعياء 1). ماذا يعلّم تكرار الفعل «أكل»؟", "ru": "«Если захотите и послушаетесь, будете вкушать блага земли; если же отречётесь и будете упорствовать, то меч пожрёт вас» (Исаия 1). Что даёт повтор корня «есть»?", "en": "\"If you are willing and obedient, you shall eat the good of the land; but if you refuse and rebel, you shall be eaten by the sword\" (Isaiah 1). What does the repeated verb \"eat\" teach?"},[{"he": "היא מראה שהנביא חוזר על עצמו בלי כוונה מיוחדת", "ar": "يُظهر أن النبي يكرر نفسه دون قصد أو هدف خاص", "ru": "показывает, что пророк повторяется без особого умысла", "en": "it shows the prophet repeats himself without any special intent"}, {"he": "היא מציבה שתי דרכים הפוכות ותוצאה לכל אחת", "ar": "يضع طريقين متعاكسين ونتيجة لكل منهما", "ru": "он ставит два противоположных пути и итог каждого", "en": "it sets two opposite paths, each with its outcome"}, {"he": "היא מלמדת שהעם סבל אז מרעב קשה", "ar": "يعلّم أن الشعب عانى آنذاك من جوع شديد", "ru": "учит, что народ тогда страдал от голода", "en": "it teaches that the people were then in a famine"}, {"he": "היא מבטיחה שכר טוב בכל מקרה", "ar": "يَعِد بجزاء حسن في كل الأحوال", "ru": "обещает добрую награду в любом случае", "en": "it promises a good reward in every case"}],1,{"he": "השוו מי אוכל בצלע הראשונה, ומי נאכל בשנייה.", "ar": "قارنوا من يأكل في الشطر الأول، ومن يُؤكَل في الثاني.", "ru": "Сравните, кто ест в первой половине, а кого «съедают» во второй.", "en": "Compare who eats in the first half and who is eaten in the second."},{"he": "אותו שורש מופיע בשתי הצלעות, אבל בתפקיד הפוך. בדרך אחת העם אוכל את טוב הארץ. בדרך השנייה החרב ״אוכלת״ אותו. כך הנביא מציב בחירה ברורה.", "ar": "يظهر الجذر نفسه في الشطرين لكن بدور معاكس. في طريق يأكل الشعب خير الأرض. وفي الطريق الآخر «يأكله» السيف. هكذا يضع النبي اختيارًا واضحًا.", "ru": "Один корень стоит в обеих половинах, но с обратной ролью. На одном пути народ ест блага земли. На другом меч «пожирает» его. Так пророк ставит ясный выбор.", "en": "The same root appears in both halves, but in opposite roles. On one path the people eat the good of the land. On the other, the sword \"eats\" them. So the prophet sets a clear choice."},null,[{"he": "חזרה על שורש בשתי צלעות היא משחק מילים מכוון.", "ar": "تكرار الجذر في الشطرين تلاعب لفظي مقصود.", "ru": "Повтор корня в двух половинах — намеренная игра слов.", "en": "Repeating a root in both halves is deliberate wordplay."}, null, {"he": "הפסוק עוסק בבחירה ובתוצאה, לא בתיאור רעב.", "ar": "الآية تتناول الاختيار والنتيجة، لا وصف مجاعة.", "ru": "Стих о выборе и его последствии, а не о голоде.", "en": "The verse is about choice and outcome, not a famine report."}, {"he": "הצלע השנייה מתארת תוצאה רעה, לא שכר.", "ar": "الشطر الثاني يصف نتيجة سيئة، لا جزاءً.", "ru": "Вторая половина описывает беду, а не награду.", "en": "The second half describes a bad outcome, not a reward."}]),
  Q("un61-3-03",{"he": "״הגיד לך אדם מה טוב ומה ה׳ דורש ממך״ (מיכה ו׳). מי הדובר, ומה מגלה זאת?", "ar": "«قد أخبرك أيها الإنسان ما هو صالح، وماذا يطلب منك الرب» (ميخا 6). من المتكلم، وما الذي يكشف ذلك؟", "ru": "«О человек! сказано тебе, что добро и чего требует от тебя Господь» (Михей 6). Кто говорит и что это выдаёт?", "en": "\"He has told you, O man, what is good, and what the LORD requires of you\" (Micah 6). Who is the speaker, and what reveals it?"},[{"he": "ה׳; הוא מדבר על עצמו בגוף ראשון ומצווה על העם כולו", "ar": "الرب؛ يتكلم عن نفسه بضمير المتكلم ويأمر الشعب كله بالطاعة", "ru": "Господь: он говорит о себе в первом лице и повелевает всему народу Израиля", "en": "the LORD; he speaks of himself in first person and commands the whole people"}, {"he": "העם; הוא שואל את עצמו מה עליו לעשות כדי לרצות", "ar": "الشعب؛ يسأل نفسه ماذا يجب أن يفعل ليُرضي الرب", "ru": "народ: он спрашивает себя, что делать, чтобы угодить Богу", "en": "the people; they ask themselves how to please God"}, {"he": "הנביא; הוא מזכיר את ה׳ בגוף שלישי ופונה ל״אדם״", "ar": "النبي؛ يذكر الرب بضمير الغائب ويخاطب «الإنسان»", "ru": "пророк: он говорит о Господе в третьем лице и обращается к «человеку»", "en": "the prophet; he names the LORD in third person and addresses \"man\""}, {"he": "הכוהן; הוא מלמד את העם את דיני הקורבנות במקדש", "ar": "الكاهن؛ يعلّم الشعب أحكام القرابين في الهيكل", "ru": "священник: он учит народ законам о жертвах в храме", "en": "the priest; he teaches the people the temple's sacrifice laws"}],2,{"he": "בדקו את הגוף: מי ״אני״, מי ״אתה״, ומי ״הוא״?", "ar": "افحصوا الضمائر: من «أنا»، ومن «أنت»، ومن «هو»؟", "ru": "Проверьте лица: кто «я», кто «ты», а кто «он»?", "en": "Check the persons: who is \"I,\" who is \"you,\" and who is \"he\"?"},{"he": "הדובר פונה ל״אדם״ במילה ״לך״, כלומר בגוף שני. את ה׳ הוא מזכיר בגוף שלישי: ״ה׳ דורש ממך״. לכן הדובר הוא הנביא, שמוסר את הדברים.", "ar": "يخاطب المتكلم «الإنسان» بكلمة «لك»، أي بضمير المخاطب. ويذكر الرب بضمير الغائب: «يطلب منك الرب». لذلك المتكلم هو النبي الذي ينقل الكلام.", "ru": "Говорящий обращается к «человеку» словом «тебе», то есть во втором лице. О Господе он говорит в третьем лице: «требует от тебя Господь». Значит, говорит пророк, передающий слово.", "en": "The speaker addresses \"man\" with \"you,\" in second person. He names the LORD in third person: \"the LORD requires of you.\" So the speaker is the prophet, passing on the message."},null,[{"he": "ה׳ מוזכר בגוף שלישי, ולכן הוא אינו הדובר כאן.", "ar": "يُذكر الرب بضمير الغائب، لذلك ليس هو المتكلم هنا.", "ru": "Господь упомянут в третьем лице, значит говорит не он.", "en": "The LORD is named in third person, so he is not the speaker."}, {"he": "הפסוק פונה ל״אדם״ בגוף שני; הוא תשובה, לא שאלה.", "ar": "الآية تخاطب «الإنسان» بضمير المخاطب؛ إنها جواب لا سؤال.", "ru": "Стих обращён к «человеку» во втором лице; это ответ, а не вопрос.", "en": "The verse addresses \"man\" in second person; it is an answer, not a question."}, null, {"he": "הדובר דוחה קורבנות, ולא מלמד את דיניהם.", "ar": "المتكلم يرفض القرابين، ولا يعلّم أحكامها.", "ru": "Говорящий отвергает жертвы, а не учит их законам.", "en": "The speaker rejects offerings rather than teaching their laws."}]),
  Q("un61-3-04",{"he": "בבראשית כ״ה עשו פועל ארבעה פעלים, ואז נאמר ״ויבז עשו את הבכרה״. איך משולבים כאן שני סוגי האפיון?", "ar": "في التكوين 25 يقوم عيسو بأربعة أفعال، ثم يُقال «فاحتقر عيسو البكورية». كيف يُدمج هنا نوعا التوصيف؟", "ru": "В Бытии 25 Исав совершает четыре действия, а затем сказано: «пренебрёг Исав первородством». Как здесь соединены два вида характеристики?", "en": "In Genesis 25 Esau does four actions, then we read \"Esau despised his birthright.\" How are the two kinds of characterization combined?"},[{"he": "עשו מתאר את עצמו, ויעקב מאשר את דבריו", "ar": "عيسو يصف نفسه، ويعقوب يؤكد كلامه", "ru": "Исав описывает себя, а Иаков подтверждает", "en": "Esau describes himself, and Jacob confirms it"}, {"he": "יש כאן רק אפיון ישיר, בלי שום מעשה", "ar": "يوجد هنا توصيف مباشر فقط، بلا أي فعل", "ru": "здесь только прямая характеристика, без поступков", "en": "there is only direct characterization here, with no action"}, {"he": "המספר משבח את עשו, והמעשים סותרים את דבריו", "ar": "الراوي يمدح عيسو، والأفعال تناقض كلامه عنه", "ru": "рассказчик хвалит Исава, а его поступки это опровергают", "en": "the narrator praises Esau, and the actions contradict his words"}, {"he": "המעשים מראים, ואז המספר שופט במפורש", "ar": "الأفعال تُظهر، ثم يحكم الراوي صراحة", "ru": "поступки показывают, а затем рассказчик прямо судит", "en": "the actions show, and then the narrator judges outright"}],3,{"he": "הפרידו בין מה שעשו עושה לבין מה שהמספר אומר.", "ar": "افصلوا بين ما يفعله عيسو وما يقوله الراوي.", "ru": "Разделите то, что делает Исав, и то, что говорит рассказчик.", "en": "Separate what Esau does from what the narrator says."},{"he": "ארבעת הפעלים הם אפיון עקיף: לומדים מן המעשים. ״ויבז״ הוא אפיון ישיר: המספר קובע עמדה. השילוב מחזק את המסר, כי המעשים כבר הכינו את הקורא.", "ar": "الأفعال الأربعة توصيف غير مباشر: نتعلم من الأعمال. و«فاحتقر» توصيف مباشر: الراوي يحدد موقفًا. والدمج يقوّي الرسالة لأن الأفعال هيّأت القارئ.", "ru": "Четыре глагола — косвенная характеристика: судим по делам. «Пренебрёг» — прямая: рассказчик выносит оценку. Сочетание усиливает мысль, ведь поступки уже подготовили читателя.", "en": "The four verbs are indirect characterization: we learn from deeds. \"Despised\" is direct: the narrator states a view. Together they strengthen the message, since the deeds prepared the reader."},null,[{"he": "עשו לא מדבר על עצמו בפסוק, ויעקב שותק.", "ar": "عيسو لا يتكلم عن نفسه في الآية، ويعقوب صامت.", "ru": "Исав в этом стихе о себе не говорит, Иаков молчит.", "en": "Esau does not speak about himself in the verse, and Jacob is silent."}, {"he": "ארבעת הפעלים הם מעשים, כלומר אפיון עקיף.", "ar": "الأفعال الأربعة أعمال، أي توصيف غير مباشر.", "ru": "Четыре глагола — это поступки, то есть косвенная характеристика.", "en": "The four verbs are actions, which is indirect characterization."}, {"he": "״ויבז״ הוא שיפוט שלילי, לא שבח.", "ar": "«فاحتقر» حكم سلبي، لا مدح.", "ru": "«Пренебрёг» — это осуждение, а не похвала.", "en": "\"Despised\" is a negative judgment, not praise."}, null]),
  Q("un61-3-05",{"he": "ביונה א׳ חוזר השורש י־ר־ד: ״וירד יפו״, ״וירד בה״, ״ירד אל ירכתי הספינה״. מה מרמזת המילה המנחה?", "ar": "في يونان 1 يتكرر الجذر «نزل»: نزل إلى يافا، ونزل في السفينة، ونزل إلى جوفها. إلامَ تلمّح الكلمة الموجِّهة؟", "ru": "В Ионе 1 повторяется корень «спускаться»: сошёл в Иоппию, сошёл на корабль, спустился во внутренность корабля. На что намекает ведущее слово?", "en": "In Jonah 1 the root \"go down\" repeats: down to Joppa, down into the ship, down into its hold. What does the leading word hint at?"},[{"he": "שבריחת יונה היא גם ירידה והתרחקות מן השליחות", "ar": "أن هروب يونان هو أيضًا نزول وابتعاد عن الرسالة", "ru": "что бегство Ионы — это и падение, и уход от поручения", "en": "that Jonah's flight is also a descent away from his mission"}, {"he": "שיונה היה ימאי מנוסה שאהב מאוד את הים הגדול והרחב", "ar": "أن يونان كان بحّارًا ماهرًا يحب البحر الكبير الواسع", "ru": "что Иона был опытным моряком и очень любил большое, широкое море", "en": "that Jonah was a skilled sailor who deeply loved the great, wide sea"}, {"he": "שהעיר יפו נמצאת במקום נמוך מאוד במפת הארץ", "ar": "أن مدينة يافا تقع في مكان منخفض جدًا على الخريطة", "ru": "что город Иоппия лежит очень низко на карте страны", "en": "that the city of Joppa lies very low on the map"}, {"he": "שהספינה התחילה לשקוע מיד כשיצאה לים מיפו", "ar": "أن السفينة بدأت تغرق فور إبحارها من يافا", "ru": "что корабль стал тонуть, едва отплыв из Иоппии", "en": "that the ship began to sink as soon as it left Joppa"}],0,{"he": "לאן יונה אמור ללכת, ולאן הוא הולך בפועל?", "ar": "إلى أين يُفترض أن يذهب يونان، وإلى أين يذهب فعلًا؟", "ru": "Куда Иона должен идти и куда он идёт на деле?", "en": "Where should Jonah go, and where does he actually go?"},{"he": "ה׳ אומר ליונה ״קום לך״ לנינוה. יונה קם, אבל רק כדי לברוח, ואז יורד שוב ושוב. החזרה על י־ר־ד מראה תנועה הפוכה לשליחות, מטה והלאה.", "ar": "يقول الرب ليونان: قم واذهب إلى نينوى. يقوم يونان لكن ليهرب، ثم ينزل مرة بعد مرة. وتكرار «نزل» يُظهر حركة معاكسة للرسالة: إلى أسفل وبعيدًا.", "ru": "Господь говорит Ионе: встань, иди в Ниневию. Иона встаёт, но чтобы бежать, и затем спускается снова и снова. Повтор корня показывает движение против поручения: вниз и прочь.", "en": "The LORD tells Jonah to arise and go to Nineveh. Jonah rises only to flee, then goes down again and again. The repeated root shows movement against the mission: down and away."},null,[null, {"he": "אין בפרק סימן שיונה ימאי; הוא נוסע שבורח.", "ar": "لا دليل في الأصحاح أن يونان بحّار؛ إنه راكب هارب.", "ru": "В главе нет намёка, что Иона моряк; он беглый пассажир.", "en": "Nothing shows Jonah is a sailor; he is a fleeing passenger."}, {"he": "החזרה היא סימן ספרותי, לא מידע גאוגרפי.", "ar": "التكرار علامة أدبية، لا معلومة جغرافية.", "ru": "Повтор — литературный знак, а не сведения о географии.", "en": "The repetition is a literary signal, not geographic data."}, {"he": "הסערה באה אחר כך, והספינה לא שוקעת בפרק.", "ar": "جاءت العاصفة لاحقًا، والسفينة لا تغرق في الأصحاح.", "ru": "Буря приходит позже, и корабль в главе не тонет.", "en": "The storm comes later, and the ship does not sink in the chapter."}]),
  Q("un61-3-06",{"he": "טענה: ״במלכים א כ״א אחאב פסיבי, ואיזבל פועלת״. איזו ראיה מן הטקסט תומכת בה הכי טוב?", "ar": "ادعاء: «في الملوك الأول 21 أخآب سلبي، وإيزابل تعمل». أي دليل من النص يدعمه أفضل دعم؟", "ru": "Утверждение: «В 3 Царств 21 Ахав пассивен, а Иезавель действует». Какое свидетельство текста лучше всего это подтверждает?", "en": "Claim: \"In 1 Kings 21 Ahab is passive while Jezebel acts.\" Which evidence from the text best supports it?"},[{"he": "אחאב מציע לנבות כרם טוב יותר או כסף תמורתו", "ar": "أخآب يعرض على نابوت كرمًا أفضل أو مالًا بدله", "ru": "Ахав предлагает Навуфею лучший виноградник или деньги", "en": "Ahab offers Naboth a better vineyard or money for it"}, {"he": "אחאב שוכב על מטתו, ואיזבל כותבת מכתבים בשמו", "ar": "أخآب يضطجع على سريره، وإيزابل تكتب رسائل باسمه", "ru": "Ахав лежит на постели, а Иезавель пишет письма от его имени", "en": "Ahab lies on his bed, and Jezebel writes letters in his name"}, {"he": "אליהו בא אל אחאב ופוגש אותו בכרם של נבות ביזרעאל", "ar": "إيليا يأتي إلى أخآب ويلقاه في كرم نابوت الذي في يزرعيل", "ru": "Илия приходит к Ахаву и встречает его в винограднике Навуфея в Изрееле", "en": "Elijah comes to Ahab and meets him in Naboth's vineyard in Jezreel"}, {"he": "נבות מסרב למלך ואומר שזו נחלת אבותיו", "ar": "نابوت يرفض الملك ويقول إنه ميراث آبائه", "ru": "Навуфей отказывает царю: это наследие отцов", "en": "Naboth refuses the king, saying it is his fathers' inheritance"}],1,{"he": "ראיה טובה מראה את שתי הדמויות זו מול זו.", "ar": "الدليل الجيد يُظهر الشخصيتين وجهًا لوجه.", "ru": "Хорошее свидетельство показывает обоих героев рядом.", "en": "Good evidence shows both characters side by side."},{"he": "אחרי הסירוב אחאב שוכב, מסב את פניו ולא אוכל. איזבל לוקחת פיקוד ושולחת מכתבים בשם המלך. הראיה מציגה את שתי הדמויות יחד, ולכן היא החזקה ביותר.", "ar": "بعد الرفض يضطجع أخآب ويحوّل وجهه ولا يأكل. وتتولى إيزابل الأمر وترسل رسائل باسم الملك. الدليل يعرض الشخصيتين معًا، لذلك هو الأقوى.", "ru": "После отказа Ахав ложится, отворачивается и не ест. Иезавель берёт дело в свои руки и шлёт письма от имени царя. Это свидетельство показывает обоих героев, поэтому оно самое сильное.", "en": "After the refusal Ahab lies down, turns his face away and does not eat. Jezebel takes charge and sends letters in the king's name. This evidence shows both characters together, so it is the strongest."},null,[{"he": "כאן אחאב דווקא פועל ומציע, ולכן זה לא תומך בטענה.", "ar": "هنا أخآب يبادر ويعرض، فلا يدعم هذا الادعاء.", "ru": "Здесь Ахав как раз действует и предлагает; это не подтверждает тезис.", "en": "Here Ahab actually acts and offers, so this does not support the claim."}, null, {"he": "זה פרט על אליהו, ואין בו השוואה בין אחאב לאיזבל.", "ar": "هذا تفصيل عن إيليا، ولا مقارنة فيه بين أخآب وإيزابل.", "ru": "Это деталь об Илии, без сравнения Ахава и Иезавели.", "en": "This is a detail about Elijah, with no comparison of Ahab and Jezebel."}, {"he": "זה מתאר את נבות, ולא את אחאב או את איזבל.", "ar": "هذا يصف نابوت، لا أخآب ولا إيزابل.", "ru": "Это описывает Навуфея, а не Ахава или Иезавель.", "en": "This describes Naboth, not Ahab or Jezebel."}])]]);

[ [
  Q("bib-origin-1262-1",{"he": "איזה תיאור מתאים לשני תיאורי הבריאה?", "ar": "أي وصف يناسب روايتا الخلق؟", "ru": "Какое описание подходит к «Два рассказа о творении»?", "en": "Which description fits two creation accounts?"},[{"he": "בראשית א׳ מציג סדר של ימי בריאה; בראשית ב׳ מתמקד באדם ובגן.", "ar": "يعرض التكوين 1 ترتيب أيام الخلق، ويركز التكوين 2 على الإنسان والحديقة.", "ru": "Бытие 1 описывает последовательность дней, а Бытие 2 сосредоточено на человеке и саде.", "en": "Genesis 1 orders creation by days; Genesis 2 focuses on the human and the garden."},{"he": "בבראשית ג׳ אכילה מן העץ האסור מובילה לשאלות על בחירה ואחריות.", "ar": "في التكوين 3 يقود الأكل من الشجرة المحرمة إلى أسئلة الاختيار والمسؤولية.", "ru": "В Бытии 3 вкушение от запретного дерева ставит вопросы выбора и ответственности.", "en": "In Genesis 3 eating from the forbidden tree raises questions of choice and responsibility."},{"he": "בבראשית ד׳ קנאה ורצח אח מלוּוים בשאלה על אחריותו של אדם לאחיו.", "ar": "في التكوين 4 تصاحب الغيرة وقتل الأخ مسألة مسؤولية الإنسان عن أخيه.", "ru": "В Бытии 4 зависть и убийство брата ставят вопрос об ответственности за ближнего.", "en": "In Genesis 4 jealousy and fratricide are tied to responsibility for a brother."},{"he": "בבראשית י״א מסופר על בניית מגדל ועל בלבול השפות.", "ar": "في التكوين 11 قصة بناء البرج واختلاط الألسنة.", "ru": "В Бытии 11 рассказ о строительстве башни и смешении языков.", "en": "Genesis 11 tells of building a tower and the confusion of tongues."}],0,{"he": "חפשו את הפרט שמבדיל אותו מן האחרים.", "ar": "ابحثوا عن التفصيل الذي يميزه عن غيره.", "ru": "Ищите отличие от остальных вариантов.", "en": "Look for the detail that separates it from the others."},{"he": "הבדלי מיקוד וסדר הם נקודת פתיחה להשוואת הסיפורים.", "ar": "اختلاف التركيز والترتيب نقطة بدء للمقارنة.", "ru": "Разные акценты и порядок дают отправную точку сравнения.", "en": "Differences of focus and order start a comparison."},null,[null,{"he": "זה מתאר את עץ הדעת, לא את שני תיאורי הבריאה.", "ar": "هذا يصف شجرة المعرفة، لا روايتا الخلق.", "ru": "Это описание «Дерево познания», а не «Два рассказа о творении».", "en": "That describes tree of knowledge, not two creation accounts."},{"he": "זה מתאר את קין והבל, לא את שני תיאורי הבריאה.", "ar": "هذا يصف قابيل وهابيل، لا روايتا الخلق.", "ru": "Это описание «Каин и Авель», а не «Два рассказа о творении».", "en": "That describes Cain and Abel, not two creation accounts."},{"he": "זה מתאר את מגדל בבל, לא את שני תיאורי הבריאה.", "ar": "هذا يصف برج بابل، لا روايتا الخلق.", "ru": "Это описание «Вавилонская башня», а не «Два рассказа о творении».", "en": "That describes Tower of Babel, not two creation accounts."}]),
  Q("bib-origin-1262-2",{"he": "איזה תיאור מתאים לעץ הדעת?", "ar": "أي وصف يناسب شجرة المعرفة؟", "ru": "Какое описание подходит к «Дерево познания»?", "en": "Which description fits tree of knowledge?"},[{"he": "בראשית א׳ מציג סדר של ימי בריאה; בראשית ב׳ מתמקד באדם ובגן.", "ar": "يعرض التكوين 1 ترتيب أيام الخلق، ويركز التكوين 2 على الإنسان والحديقة.", "ru": "Бытие 1 описывает последовательность дней, а Бытие 2 сосредоточено на человеке и саде.", "en": "Genesis 1 orders creation by days; Genesis 2 focuses on the human and the garden."},{"he": "בבראשית ג׳ אכילה מן העץ האסור מובילה לשאלות על בחירה ואחריות.", "ar": "في التكوين 3 يقود الأكل من الشجرة المحرمة إلى أسئلة الاختيار والمسؤولية.", "ru": "В Бытии 3 вкушение от запретного дерева ставит вопросы выбора и ответственности.", "en": "In Genesis 3 eating from the forbidden tree raises questions of choice and responsibility."},{"he": "בבראשית ד׳ קנאה ורצח אח מלוּוים בשאלה על אחריותו של אדם לאחיו.", "ar": "في التكوين 4 تصاحب الغيرة وقتل الأخ مسألة مسؤولية الإنسان عن أخيه.", "ru": "В Бытии 4 зависть и убийство брата ставят вопрос об ответственности за ближнего.", "en": "In Genesis 4 jealousy and fratricide are tied to responsibility for a brother."},{"he": "בבראשית י״א מסופר על בניית מגדל ועל בלבול השפות.", "ar": "في التكوين 11 قصة بناء البرج واختلاط الألسنة.", "ru": "В Бытии 11 рассказ о строительстве башни и смешении языков.", "en": "Genesis 11 tells of building a tower and the confusion of tongues."}],1,{"he": "חפשו את הפרט שמבדיל אותו מן האחרים.", "ar": "ابحثوا عن التفصيل الذي يميزه عن غيره.", "ru": "Ищите отличие от остальных вариантов.", "en": "Look for the detail that separates it from the others."},{"he": "זהו סיפור על ציווי, בחירה ותוצאותיה לפי המסופר.", "ar": "هذه قصة عن أمر واختيار ونتائجه بحسب النص.", "ru": "Это рассказ о запрете, выборе и его последствиях.", "en": "The account concerns command, choice and consequences."},null,[{"he": "זה מתאר את שני תיאורי הבריאה, לא את עץ הדעת.", "ar": "هذا يصف روايتا الخلق، ل
