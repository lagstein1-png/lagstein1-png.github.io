 ,Q("bib-origin-two",{"he": "מה ההבדל המרכזי בין שני תיאורי הבריאה בבראשית א'-ב'?", "ar": "ما الفرق المركزي بين وصفي الخلق في التكوين 1-2؟", "ru": "В чём главное различие двух описаний творения в Бытии 1-2?", "en": "What is the main difference between the two creation accounts in Genesis 1-2?"},[{"he": "הראשון מסודר לפי ימים ורואה את הכלל; השני ממקד באדם, בגן ובזוגיות", "ar": "الأول مرتب بحسب الأيام ويرى الكل؛ الثاني يركز على الإنسان والجنة والزوجية", "ru": "Первое упорядочено по дням и охватывает целое; второе сосредоточено на человеке, саде и супружестве", "en": "The first is ordered by days and sees the whole; the second focuses on the human, the garden and the couple"},{"he": "הראשון מדבר על מצרים והשני על כנען", "ar": "الأول عن مصر والثاني عن كنعان", "ru": "Первое о Египте, второе о Ханаане", "en": "The first is about Egypt and the second about Canaan"},{"he": "הראשון נכתב באנגלית והשני בעברית", "ar": "الأول كُتب بالإنجليزية والثاني بالعبرية", "ru": "Первое написано по-английски, второе по-древнееврейски", "en": "The first was written in English and the second in Hebrew"},{"he": "אין הבדל - זהו אותו תיאור בדיוק", "ar": "لا فرق - إنهما الوصف نفسه تمامًا", "ru": "Различия нет - это в точности одно описание", "en": "No difference - they are exactly the same account"}],0,{"he": "שימו לב מה עומד במרכז כל תיאור.", "ar": "انتبهوا ما الذي يقف في مركز كل وصف.", "ru": "Обратите внимание, что стоит в центре каждого описания.", "en": "Notice what stands at the center of each account."},{"he": "בראשית א' בונה עולם בשישה ימים, והאדם נברא בתוכו 'זכר ונקבה'. בראשית ב' המצלמה מקרבת: אדם מן העפר, גן, חיה, ובניית האישה. דוגמה: כמו תצלום רחב לעומת תצלום קרוב של אותה זריקה.", "ar": "التكوين 1 يبني العالم في ستة أيام، ويُخلق الإنسان فيه «ذكرًا وأنثى». التكوين 2 يقرّب الكاميرا: إنسان من التراب، جنة، حيوان، وبناء المرأة. مثال: كصورة واسعة مقابل صورة قريبة للمشهد نفسه.", "ru": "Бытие 1 строит мир за шесть дней, и человек сотворён в нём «мужчиной и женщиной». Бытие 2 приближает камеру: человек из праха, сад, животные, создание женщины. Пример: как широкий кадр против крупного плана той же съёмки.", "en": "Genesis 1 builds the world in six days, with the human created \"male and female\". Genesis 2 zooms in: a human from the dust, a garden, animals, the building of the woman. Example: like a wide shot versus a close-up of the same scene."},null,[null,{"he": "שני התיאורים עוסקים בבריאת העולם, לא בארצות מוגדרות.", "ar": "كلا الوصفين عن خلق العالم لا عن أراضٍ محددة.", "ru": "Оба описания о творении мира, а не об определённых странах.", "en": "Both accounts are about the creation of the world, not about specific lands."},{"he": "שניהם נכתבו בעברית; השפה אינה ההבדל.", "ar": "كلاهما كُتب بالعبرية؛ اللغة ليست الفرق.", "ru": "Оба написаны на древнееврейском; язык не различие.", "en": "Both were written in Hebrew; language is not the difference."},{"he": "יש הבדלים ברורים במבנה ובמוקד; זהו חלק ממה שחוקרים בפרקים האלה.", "ar": "توجد فروق واضحة في البنية والتركيز؛ هذا جزء مما يُدرس في هذين الفصلين.", "ru": "Есть ясные различия в структуре и фокусе; это часть того, что изучают в этих главах.", "en": "There are clear differences in structure and focus; that is part of what these chapters study."}]),
  Q("or62-1-01",{"he": "לפי בראשית א׳, באיזה יום נברא האדם?", "ar": "بحسب التكوين 1، في أي يوم خُلق الإنسان؟", "ru": "Согласно Бытию 1, в какой день был сотворён человек?", "en": "According to Genesis 1, on which day was the human created?"},[{"he": "ביום הראשון", "ar": "في اليوم الأول", "ru": "В первый день", "en": "On the first day"}, {"he": "ביום הרביעי", "ar": "في اليوم الرابع", "ru": "В четвёртый день", "en": "On the fourth day"}, {"he": "ביום השישי", "ar": "في اليوم السادس", "ru": "В шестой день", "en": "On the sixth day"}, {"he": "ביום השביעי", "ar": "في اليوم السابع", "ru": "В седьмой день", "en": "On the seventh day"}],2,{"he": "האדם נברא אחרי חיות היבשה.", "ar": "خُلق الإنسان بعد حيوانات البر.", "ru": "Человек создан после сухопутных животных.", "en": "The human comes after the land animals."},{"he": "לפי בראשית א׳, האדם נברא ביום השישי. הוא נברא אחרי החיות, בסוף מעשי הבריאה. ביום השביעי אלוהים שובת.", "ar": "بحسب التكوين 1، خُلق الإنسان في اليوم السادس. خُلق بعد الحيوانات، في نهاية أعمال الخلق. وفي اليوم السابع يستريح الله.", "ru": "Согласно Бытию 1, человек сотворён в шестой день. Он создан после животных, в конце творения. В седьмой день Бог почиет.", "en": "According to Genesis 1, the human is created on the sixth day. This comes after the animals, at the end of creation. On the seventh day God rests."},null,[{"he": "ביום הראשון נברא האור, לא האדם.", "ar": "في اليوم الأول خُلق النور، لا الإنسان.", "ru": "В первый день был сотворён свет, а не человек.", "en": "On the first day light was created, not the human."}, {"he": "ביום הרביעי נבראו המאורות: השמש, הירח והכוכבים.", "ar": "في اليوم الرابع خُلقت الأنوار: الشمس والقمر والنجوم.", "ru": "В четвёртый день были созданы светила: солнце, луна и звёзды.", "en": "On the fourth day the lights were made: sun, moon and stars."}, null, {"he": "ביום השביעי אין בריאה. לפי הסיפור, אלוהים שובת בו.", "ar": "في اليوم السابع لا يوجد خلق، فبحسب القصة يستريح الله فيه.", "ru": "В седьмой день творения нет: по рассказу, Бог в этот день почил.", "en": "There is no creation on the seventh day; in the story God rests on it."}]),
  Q("or62-1-02",{"he": "לפי בראשית ב׳, ממה יוצר האדם?", "ar": "بحسب التكوين 2، من أي شيء جُبل الإنسان؟", "ru": "Согласно Бытию 2, из чего создан человек?", "en": "According to Genesis 2, what is the human formed from?"},[{"he": "מאבן ההר", "ar": "من حجر الجبل", "ru": "Из горного камня", "en": "From mountain stone"}, {"he": "מעפר האדמה", "ar": "من تراب الأرض", "ru": "Из праха земного", "en": "From the dust of the ground"}, {"he": "ממי הנהר", "ar": "من مياه النهر", "ru": "Из речной воды", "en": "From river water"}, {"he": "מצלע של חיה", "ar": "من ضلع حيوان", "ru": "Из ребра животного", "en": "From an animal's rib"}],1,{"he": "חפשו את הקשר בין המילה ״אדם״ למילה ״אדמה״.", "ar": "ابحثوا عن الصلة بين كلمتي «آدم» و«أدماه» (الأرض) بالعبرية.", "ru": "Ищите связь между словами «адам» (человек) и «адама» (земля) на иврите.", "en": "Look for the link between Hebrew 'adam' (human) and 'adamah' (ground)."},{"he": "בבראשית ב׳ אלוהים יוצר את האדם מעפר האדמה. אחר כך הוא נופח באפיו נשמת חיים. השם ״אדם״ קשור למילה ״אדמה״.", "ar": "في التكوين 2 يجبل الله الإنسان من تراب الأرض. ثم ينفخ في أنفه نسمة حياة. واسم «آدم» مرتبط بكلمة «أدماه» أي الأرض.", "ru": "В Бытии 2 Бог создаёт человека из праха земли. Затем вдыхает в него дыхание жизни. Имя «Адам» связано со словом «адама» — земля.", "en": "In Genesis 2 God forms the human from the dust of the ground. Then God breathes the breath of life into him. The name 'adam' is linked to 'adamah', ground."},null,[{"he": "בטקסט אין אבן. האדם יוצר מן העפר.", "ar": "لا يوجد حجر في النص، فالإنسان جُبل من التراب.", "ru": "В тексте нет камня: человек создан из праха.", "en": "There is no stone in the text; the human is formed from dust."}, null, {"he": "הנהר יוצא מעדן, אבל האדם אינו נוצר ממנו.", "ar": "النهر يخرج من عدن، لكن الإنسان لم يُجبل منه.", "ru": "Река выходит из Эдема, но человек создан не из неё.", "en": "A river flows from Eden, but the human is not made from it."}, {"he": "הצלע מופיעה בבריאת האישה, והיא צלע של האדם.", "ar": "الضلع يظهر في خلق المرأة، وهو ضلع الإنسان.", "ru": "Ребро появляется при создании женщины, и это ребро человека.", "en": "The rib appears when the woman is made, and it is the human's rib."}]),
  Q("or62-1-03",{"he": "לפי בראשית ד׳, מה היה עיסוקו של הבל?", "ar": "بحسب التكوين 4، ماذا كان عمل هابيل؟", "ru": "Согласно Бытию 4, чем занимался Авель?", "en": "According to Genesis 4, what was Abel's occupation?"},[{"he": "רועה צאן", "ar": "راعي غنم", "ru": "Пастух овец", "en": "A keeper of sheep"}, {"he": "עובד אדמה", "ar": "فلّاح يعمل الأرض", "ru": "Земледелец", "en": "A tiller of the soil"}, {"he": "בונה עיר", "ar": "باني مدينة", "ru": "Строитель города", "en": "A city builder"}, {"he": "צייד ביער", "ar": "صيّاد في الغابة", "ru": "Охотник в лесу", "en": "A hunter in the forest"}],0,{"he": "חשבו מה הבל הביא כקרבן.", "ar": "فكّروا فيما قدّمه هابيل قربانًا.", "ru": "Подумайте, что Авель принёс в жертву.", "en": "Think about what Abel brought as an offering."},{"he": "בבראשית ד׳ נאמר שהבל היה רועה צאן וקין היה עובד אדמה. כל אחד מביא קרבן ממה שהוא עושה. הבל מביא מבכורות צאנו.", "ar": "في التكوين 4 يُقال إن هابيل كان راعي غنم وقايين كان فلاحًا. كل منهما يقدّم قربانًا من عمله. هابيل يقدّم من أبكار غنمه.", "ru": "В Бытии 4 сказано: Авель был пастухом, а Каин — земледельцем. Каждый приносит жертву от своего труда. Авель приносит первенцев стада.", "en": "Genesis 4 says Abel kept sheep and Cain tilled the soil. Each brings an offering from his own work. Abel brings firstlings of his flock."},null,[null, {"he": "עובד האדמה היה קין, אחיו של הבל.", "ar": "الفلّاح كان قايين، أخا هابيل.", "ru": "Земледельцем был Каин, брат Авеля.", "en": "The tiller of the soil was Cain, Abel's brother."}, {"he": "קין, ולא הבל, בנה עיר וקרא לה חנוך.", "ar": "قايين، لا هابيل، بنى مدينة وسمّاها أخنوخ.", "ru": "Город построил Каин, а не Авель, и назвал его Енох.", "en": "Cain, not Abel, built a city and named it Enoch."}, {"he": "בבראשית ד׳ אין ציד. הבל מביא קרבן מן הצאן.", "ar": "لا يوجد صيد في التكوين 4، فهابيل يقدّم قربانًا من الغنم.", "ru": "В Бытии 4 нет охоты: Авель приносит жертву от стада.", "en": "There is no hunting in Genesis 4; Abel offers from his flock."}]),
  Q("or62-1-04",{"he": "לפי בראשית ח׳, איזו ציפור שלח נח ראשונה מן התיבה?", "ar": "بحسب التكوين 8، أي طائر أرسله نوح أولًا من الفلك؟", "ru": "Согласно Бытию 8, какую птицу Ной выпустил из ковчега первой?", "en": "According to Genesis 8, which bird did Noah send out of the ark first?"},[{"he": "יונה", "ar": "حمامة", "ru": "Голубя", "en": "A dove"}, {"he": "נשר", "ar": "نسر", "ru": "Орла", "en": "An eagle"}, {"he": "דרור", "ar": "عصفور", "ru": "Воробья", "en": "A sparrow"}, {"he": "עורב", "ar": "غراب", "ru": "Ворона", "en": "A raven"}],3,{"he": "הציפור המפורסמת עם עלה הזית לא הייתה הראשונה.", "ar": "الطائر المشهور مع ورقة الزيتون لم يكن الأول.", "ru": "Знаменитая птица с масличным листом была не первой.", "en": "The famous bird with the olive leaf was not the first."},{"he": "נח שולח קודם את העורב. אחריו הוא שולח את היונה. בפעם השנייה היונה חוזרת עם עלה זית.", "ar": "يرسل نوح الغراب أولًا. ثم يرسل الحمامة. وفي المرة الثانية تعود الحمامة بورقة زيتون.", "ru": "Сначала Ной выпускает ворона. Потом он выпускает голубя. Во второй раз голубь возвращается с масличным листом.", "en": "Noah first sends out the raven. Then he sends the dove. The second time, the dove returns with an olive leaf."},null,[{"he": "היונה נשלחה אחרי העורב, כמה פעמים.", "ar": "الحمامة أُرسلت بعد الغراب، عدة مرات.", "ru": "Голубь был выпущен после ворона, несколько раз.", "en": "The dove was sent after the raven, several times."}, {"he": "נשר אינו מוזכר בסיפור שילוח הציפורים.", "ar": "النسر غير مذكور في قصة إرسال الطيور.", "ru": "Орёл не упоминается в рассказе о выпуске птиц.", "en": "An eagle is not mentioned in the sending of the birds."}, {"he": "דרור אינו מוזכר בסיפור המבול.", "ar": "العصفور غير مذكور في قصة الطوفان.", "ru": "Воробей не упоминается в рассказе о потопе.", "en": "A sparrow is not mentioned in the Flood story."}, null]),
  Q("or62-1-05",{"he": "לפי בראשית ט׳, מהו אות הברית בין אלוהים לנח ולכל החיים?", "ar": "بحسب التكوين 9، ما علامة العهد بين الله ونوح وكل الأحياء؟", "ru": "Согласно Бытию 9, что является знаком завета между Богом, Ноем и всем живым?", "en": "According to Genesis 9, what is the sign of the covenant between God, Noah and all life?"},[{"he": "מזבח של אבנים", "ar": "مذبح من حجارة", "ru": "Каменный жертвенник", "en": "An altar of stones"}, {"he": "ברית המילה", "ar": "الختان", "ru": "Обрезание", "en": "Circumcision"}, {"he": "כוכב בשמיים", "ar": "نجم في السماء", "ru": "Звезда на небе", "en": "A star in the sky"}, {"he": "הקשת בענן", "ar": "قوس في السحاب", "ru": "Радуга в облаке", "en": "The bow in the cloud"}],3,{"he": "האות נראה בעננים אחרי הגשם.", "ar": "العلامة تُرى في الغيوم بعد المطر.", "ru": "Этот знак виден в облаках после дождя.", "en": "The sign is seen in the clouds after rain."},{"he": "אחרי המבול אלוהים כורת ברית עם נח ועם כל החיים. הוא מבטיח שלא יהיה עוד מבול שישחית את הארץ. הקשת בענן היא אות הברית.", "ar": "بعد الطوفان يقطع الله عهدًا مع نوح ومع كل الأحياء. ويعد بألّا يكون طوفان آخر يُهلك الأرض. والقوس في السحاب علامة العهد.", "ru": "После потопа Бог заключает завет с Ноем и со всем живым. Он обещает, что больше не будет потопа, губящего землю. Радуга в облаке — знак завета.", "en": "After the Flood God makes a covenant with Noah and all life. God promises no more flood to destroy the earth. The bow in the cloud is the sign."},null,[{"he": "נח בונה מזבח, אבל הוא אינו אות הברית.", "ar": "بنى نوح مذبحًا، لكنه ليس علامة العهد.", "ru": "Ной строит жертвенник, но это не знак завета.", "en": "Noah builds an altar, but it is not the covenant sign."}, {"he": "ברית המילה ניתנת לאברהם, בבראשית י״ז.", "ar": "الختان أُعطي لإبراهيم، في التكوين 17.", "ru": "Обрезание дано Аврааму, в Бытии 17.", "en": "Circumcision is given to Abraham, in Genesis 17."}, {"he": "כוכבים מופיעים בהבטחה לאברהם, לא בברית עם נח.", "ar": "النجوم تظهر في الوعد لإبراهيم، لا في العهد مع نوح.", "ru": "Звёзды появляются в обещании Аврааму, а не в завете с Ноем.", "en": "Stars appear in the promise to Abraham, not in the covenant with Noah."}, null]),
  Q("or62-1-06",{"he": "מי היו שלושת בניו של נח?", "ar": "من هم أبناء نوح الثلاثة؟", "ru": "Кто были три сына Ноя?", "en": "Who were Noah's three sons?"},[{"he": "שם, חם ויפת", "ar": "سام وحام ويافث", "ru": "Сим, Хам и Иафет", "en": "Shem, Ham and Japheth"}, {"he": "קין, הבל ושת", "ar": "قايين وهابيل وشيث", "ru": "Каин, Авель и Сиф", "en": "Cain, Abel and Seth"}, {"he": "אברם, נחור והרן", "ar": "أبرام وناحور وهاران", "ru": "Аврам, Нахор и Аран", "en": "Abram, Nahor and Haran"}, {"he": "חנוך, מתושלח ולמך", "ar": "أخنوخ ومتوشالح ولامك", "ru": "Енох, Мафусаил и Ламех", "en": "Enoch, Methuselah and Lamech"}],0,{"he": "מבנים אלה יוצאים העמים אחרי המבול.", "ar": "من هؤلاء الأبناء تخرج الشعوب بعد الطوفان.", "ru": "От этих сыновей после потопа происходят народы.", "en": "From these sons the nations come after the Flood."},{"he": "לנח היו שלושה בנים: שם, חם ויפת. הם נכנסים איתו לתיבה. בבראשית י׳ מכל אחד מהם יוצאים עמים.", "ar": "كان لنوح ثلاثة أبناء: سام وحام ويافث. دخلوا معه الفلك. وفي التكوين 10 تخرج من كل واحد منهم شعوب.", "ru": "У Ноя было три сына: Сим, Хам и Иафет. Они входят с ним в ковчег. В Бытии 10 от каждого из них происходят народы.", "en": "Noah had three sons: Shem, Ham and Japheth. They enter the ark with him. In Genesis 10 nations come from each of them."},null,[null, {"he": "קין, הבל ושת הם בני אדם וחוה.", "ar": "قايين وهابيل وشيث هم أبناء آدم وحواء.", "ru": "Каин, Авель и Сиф — сыновья Адама и Евы.", "en": "Cain, Abel and Seth are the sons of Adam and Eve."}, {"he": "אברם, נחור והרן הם בני תרח, בבראשית י״א.", "ar": "أبرام وناحور وهاران هم أبناء تارح، في التكوين 11.", "ru": "Аврам, Нахор и Аран — сыновья Фарры, в Бытии 11.", "en": "Abram, Nahor and Haran are Terah's sons, in Genesis 11."}, {"he": "אלה שלושה דורות שונים ברשימה של בראשית ה׳, לא אחים.", "ar": "هؤلاء ثلاثة أجيال في قائمة التكوين 5، لا إخوة.", "ru": "Это три поколения из списка Бытия 5, а не братья.", "en": "These are three generations in the Genesis 5 list, not brothers."}])],
 [
  Q("bib-origin-1262-3",{"he": "איזה תיאור מתאים לקין והבל?", "ar": "أي وصف يناسب قابيل وهابيل؟", "ru": "Какое описание подходит к «Каин и Авель»?", "en": "Which description fits Cain and Abel?"},[{"he": "בראשית א׳ מציג סדר של ימי בריאה; בראשית ב׳ מתמקד באדם ובגן.", "ar": "يعرض التكوين 1 ترتيب أيام الخلق، ويركز التكوين 2 على الإنسان والحديقة.", "ru": "Бытие 1 описывает последовательность дней, а Бытие 2 сосредоточено на человеке и саде.", "en": "Genesis 1 orders creation by days; Genesis 2 focuses on the human and the garden."},{"he": "בבראשית ג׳ אכילה מן העץ האסור מובילה לשאלות על בחירה ואחריות.", "ar": "في التكوين 3 يقود الأكل من الشجرة المحرمة إلى أسئلة الاختيار والمسؤولية.", "ru": "В Бытии 3 вкушение от запретного дерева ставит вопросы выбора и ответственности.", "en": "In Genesis 3 eating from the forbidden tree raises questions of choice and responsibility."},{"he": "בבראשית ד׳ קנאה ורצח אח מלוּוים בשאלה על אחריותו של אדם לאחיו.", "ar": "في التكوين 4 تصاحب الغيرة وقتل الأخ مسألة مسؤولية الإنسان عن أخيه.", "ru": "В Бытии 4 зависть и убийство брата ставят вопрос об ответственности за ближнего.", "en": "In Genesis 4 jealousy and fratricide are tied to responsibility for a brother."},{"he": "בבראשית י״א מסופר על בניית מגדל ועל בלבול השפות.", "ar": "في التكوين 11 قصة بناء البرج واختلاط الألسنة.", "ru": "В Бытии 11 рассказ о строительстве башни и смешении языков.", "en": "Genesis 11 tells of building a tower and the confusion of tongues."}],2,{"he": "חפשו את הפרט שמבדיל אותו מן האחרים.", "ar": "ابحثوا عن التفصيل الذي يميزه عن غيره.", "ru": "Ищите отличие от остальных вариантов.", "en": "Look for the detail that separates it from the others."},{"he": "הפגיעה באח עומדת במרכז העימות והמענה אליו.", "ar": "الأذى الواقع على الأخ جوهر الصراع والرد عليه.", "ru": "Насилие над братом лежит в центре конфликта и ответа на него.", "en": "Harm to a brother is central to the conflict and its aftermath."},null,[{"he": "זה מתאר את שני תיאורי הבריאה, לא את קין והבל.", "ar": "هذا يصف روايتا الخلق، لا قابيل وهابيل.", "ru": "Это описание «Два рассказа о творении», а не «Каин и Авель».", "en": "That describes two creation accounts, not Cain and Abel."},{"he": "זה מתאר את עץ הדעת, לא את קין והבל.", "ar": "هذا يصف شجرة المعرفة، لا قابيل وهابيل.", "ru": "Это описание «Дерево познания», а не «Каин и Авель».", "en": "That describes tree of knowledge, not Cain and Abel."},null,{"he": "זה מתאר את מגדל בבל, לא את קין והבל.", "ar": "هذا يصف برج بابل، لا قابيل وهابيل.", "ru": "Это описание «Вавилонская башня», а не «Каин и Авель».", "en": "That describes Tower of Babel, not Cain and Abel."}])
 ,Q("bib-origin-tree",{"he": "מה עומד במרכז הסיפור על עץ הדעת?", "ar": "ما الذي يقف في مركز قصة شجرة المعرفة؟", "ru": "Что стоит в центре истории о древе познания?", "en": "What stands at the center of the tree of knowledge story?"},[{"he": "בחירה אנושית מול גבול שניתן, והשלכותיה על האדם", "ar": "اختيار إنساني مقابل حدّ مُعطى، وعواقبه على الإنسان", "ru": "Человеческий выбор против заданной границы и его последствия для человека", "en": "A human choice against a given boundary, and its consequences for humankind"},{"he": "מתכון ביתי מפורט להכנת ריבת תאנים משובחת בשיטת הבישול האיטי", "ar": "وصفة بيتية مفصلة لتحضير مربى تين فاخر بطريقة الطهي البطيء", "ru": "Подробный домашний рецепт отличного варенья из инжира способом медленного варения", "en": "A detailed home recipe for excellent fig jam using the slow-cooking method"},{"he": "מלחמה בין שני גנים", "ar": "حرب بين جنتين", "ru": "Война между двумя садами", "en": "A war between two gardens"},{"he": "הוראות לנטיעת עצים", "ar": "تعليمات لغرس الأشجار", "ru": "Инструкции по посадке деревьев", "en": "Instructions for planting trees"}],0,{"he": "חפשו את הרגע שבו נעשית בחירה.", "ar": "ابحثوا عن اللحظة التي يُتخذ فيها اختيار.", "ru": "Найдите момент, когда делается выбор.", "en": "Look for the moment when a choice is made."},{"he": "הסיפור בבראשית ג' נפתח באיסור ברור ('מעץ הדעת טוב ורע לא תאכל') וממשיך בבחירה, בחשיפה ובהשלכות. דוגמה: אחרי האכילה 'ותפקחנה עיני שניהם' - השינוי הוא פנימי, לא קולינרי.", "ar": "تُفتتح القصة في التكوين 3 بمنع واضح («من شجرة معرفة الخير والشر لا تأكل») وتتابع بالاختيار والانكشاف والعواقب. مثال: بعد الأكل «انفتحت عيناهما» - التغيير داخلي لا طعامي.", "ru": "История в Бытии 3 открывается ясным запретом («от дерева познания добра и зла не ешь») и продолжается выбором, раскрытием и последствиями. Пример: после вкушения «открылись глаза у них обоих» - перемена внутренняя, а не кулинарная.", "en": "The story in Genesis 3 opens with a clear prohibition (\"of the tree of knowledge of good and evil you shall not eat\") and continues with a choice, an exposure and consequences. Example: after the eating \"the eyes of both were opened\" - the change is internal, not culinary."},null,[null,{"he": "הפרי והעלי משרתים את הסיפור; הם אינם נושאו.", "ar": "الثمرة والورق يخدمان القصة؛ ليسا موضوعها.", "ru": "Плод и листва служат истории; они не её тема.", "en": "The fruit and leaves serve the story; they are not its subject."},{"he": "יש גן אחד בסיפור, לא מלחמת גנים.", "ar": "في القصة جنة واحدة لا حرب جنان.", "ru": "В истории один сад, а не война садов.", "en": "There is one garden in the story, not a war of gardens."},{"he": "העץ מוצב כגבול ולא כמדריך גינון.", "ar": "الشجرة موضوعة كحدّ لا كدليل زراعة.", "ru": "Дерево поставлено как граница, а не как руководство по садоводству.", "en": "The tree is set as a boundary, not as a gardening guide."}]),Q("bib-origin-cain",{"he": "מה מלמד שיחת ה' עם קין לפני הרצח?", "ar": "ماذا يعلّم حديث الله مع قايين قبل القتل؟", "ru": "Чему учит разговор Бога с Каином перед убийством?", "en": "What does God's conversation with Cain before the murder teach?"},[{"he": "שיש לאדם בחירה: 'הלוא אם תיטיב שאת' - האחריות על המעשה היא שלו", "ar": "أن للإنسان اختيارًا: «أليس إن أحسنتَ رفعًا» - المسؤولية عن الفعل عليه", "ru": "Что у человека есть выбор: «если делаешь доброе...» - ответственность за поступок на нём", "en": "That a person has a choice: \"if you do well, uplift\" - responsibility for the act is his"},{"he": "שקין נידון לדין מראש ולא יכול היה לבחור בדרך אחרת בשום שלב שהוא", "ar": "أن قايين حُكم عليه سلفًا ولم يكن بوسعه اختيار طريق آخر في أي مرحلة", "ru": "Что Каин был осуждён заранее и не мог выбрать иной путь ни на каком этапе", "en": "That Cain was pre-judged and could not choose another path at any stage"},{"he": "שהשיחה עוסקת בחוקי קרבנות בלבד", "ar": "أن الحديث عن شرائع القرابين فقط", "ru": "Что разговор только о законах жертвоприношений", "en": "That the conversation is only about sacrifice laws"},{"he": "שהבל התכוון להקניט את אחיו", "ar": "أن هابيل قصد إغاظة أخيه", "ru": "Что Авель намеревался дразнить брата", "en": "That Abel meant to tease his brother"}],0,{"he": "קראו את המשפט שמופיע ממש לפני המעשה.", "ar": "اقرأوا الجملة الواردة مباشرة قبل الفعل.", "ru": "Прочитайте фразу, стоящую непосредственно перед поступком.", "en": "Read the sentence that comes right before the act."},{"he": "לפני הרצח נאמר לקין: 'לפתח חטאת רובץ, ואתה תמשל בו' (בראשית ד'). דוגמה: הטקסט שם את הכוח לבחור בידי קין - ולכן האחריות כפולה: על המעשה ועל התשובה 'השומר אחי אנוכי'.", "ar": "قبل القتل يُقال لقايين: «عند الباب خطيئة رابضة، وأنت تتسلط عليها» (التكوين 4). مثال: يضع النص قدرة الاختيار بيد قايين - لذلك المسؤولية مضاعفة: عن الفعل وعن الإجابة «أحارس أخي أنا؟».", "ru": "Перед убийством Каину сказано: «у дверей грех лежит, а ты господствуй над ним» (Бытие 4). Пример: текст вкладывает силу выбора в руки Каина - поэтому ответственность двойная: за поступок и за ответ «разве я сторож брату моему?».", "en": "Before the murder Cain is told: \"sin crouches at the door, and you shall master it\" (Genesis 4). Example: the text places the power to choose in Cain's hands - so the responsibility is double: for the act and for the answer \"am I my brother's keeper?\"."},null,[null,{"he": "הפנייה עצמה מוכיחה שהבחירה פתוחה; אין גזירה מוקדמת.", "ar": "المخاطبة نفسها تثبت أن الاختيار مفتوح؛ لا حكم مسبق.", "ru": "Само обращение доказывает, что выбор открыт; нет заранее вынесенного приговора.", "en": "The very address proves the choice is open; there is no prior verdict."},{"he": "הקרבנות הם רקע; הליבה היא הבחירה והקנאה.", "ar": "القرابين خلفية؛ الجوهر هو الاختيار والغيرة.", "ru": "Жертвы - фон; суть - выбор и ревность.", "en": "The sacrifices are background; the core is choice and jealousy."},{"he": "אין בטקסט הוכחה להקניטה; ההדגשה על קין.", "ar": "لا دليل في النص على الإغاظة؛ التأكيد على قايين.", "ru": "В тексте нет свидетельства дразнения; акцент на Каине.", "en": "The text has no evidence of teasing; the stress is on Cain."}]),
  Q("or62-2-01",{"he": "לפי בראשית ו׳, למה מביא אלוהים את המבול?", "ar": "بحسب التكوين 6، لماذا يجلب الله الطوفان؟", "ru": "Согласно Бытию 6, почему Бог посылает потоп?", "en": "According to Genesis 6, why does God bring the Flood?"},[{"he": "כי בני האדם בנו מגדל גבוה", "ar": "لأن البشر بنوا برجًا عاليًا", "ru": "Потому что люди построили высокую башню", "en": "Because people built a tall tower"}, {"he": "כי הארץ התמלאה ברשע ובחמס", "ar": "لأن الأرض امتلأت شرًّا وظلمًا", "ru": "Потому что земля наполнилась злом и насилием", "en": "Because the earth was filled with evil and violence"}, {"he": "כי אדם וחוה אכלו מעץ הדעת", "ar": "لأن آدم وحواء أكلا من شجرة المعرفة", "ru": "Потому что Адам и Ева ели от древа познания", "en": "Because Adam and Eve ate from the tree of knowledge"}, {"he": "כי האדמה לא נתנה יבול", "ar": "لأن الأرض لم تُعطِ غلّة", "ru": "Потому что земля не давала урожая", "en": "Because the ground gave no crops"}],1,{"he": "קראו מה נאמר על הארץ ועל מעשי בני האדם.", "ar": "اقرأوا ما يُقال عن الأرض وعن أعمال البشر.", "ru": "Прочитайте, что сказано о земле и о делах людей.", "en": "Read what is said about the earth and human deeds."},{"he": "בבראשית ו׳ נאמר שרעת האדם רבה בארץ. הארץ מלאה חמס, כלומר אלימות ועוול. לכן, לפי הסיפור, אלוהים מחליט להביא מבול.", "ar": "في التكوين 6 يُقال إن شرّ الإنسان كثر في الأرض. امتلأت الأرض ظلمًا وعنفًا. لذلك، بحسب القصة، يقرر الله جلب الطوفان.", "ru": "В Бытии 6 сказано, что велико развращение людей на земле. Земля наполнилась насилием и несправедливостью. Поэтому, по рассказу, Бог решает послать потоп.", "en": "Genesis 6 says human evil was great on the earth. The earth was full of violence and wrongdoing. So, in the story, God decides to bring a flood."},null,[{"he": "המגדל מופיע בבראשית י״א, אחרי המבול.", "ar": "البرج يظهر في التكوين 11، بعد الطوفان.", "ru": "Башня появляется в Бытии 11, после потопа.", "en": "The tower appears in Genesis 11, after the Flood."}, null, {"he": "על האכילה הם גורשו מן הגן, ולא היה מבול.", "ar": "بسبب الأكل طُردا من الجنة، ولم يكن طوفان.", "ru": "За это их изгнали из сада, а потопа не было.", "en": "For eating they were sent out of the garden; there was no flood."}, {"he": "הטקסט מדבר על רשע בני האדם, לא על בצורת.", "ar": "النص يتحدث عن شرّ البشر، لا عن جفاف.", "ru": "Текст говорит о злобе людей, а не о засухе.", "en": "The text speaks of human evil, not drought."}]),
  Q("or62-2-02",{"he": "לפי בראשית י״א, על מה מרמז השם ״בבל״?", "ar": "بحسب التكوين 11، إلامَ يشير اسم «بابل»؟", "ru": "Согласно Бытию 11, на что намекает имя «Бавель» (Вавилон)?", "en": "According to Genesis 11, what does the name 'Babel' hint at?"},[{"he": "על גובה המגדל שנבנה", "ar": "على ارتفاع البرج الذي بُني", "ru": "На высоту построенной башни", "en": "The height of the tower built"}, {"he": "על שמו של המלך שבנה", "ar": "على اسم الملك الذي بنى", "ru": "На имя царя-строителя", "en": "The name of the king who built it"}, {"he": "על בלבול השפות במקום", "ar": "على بلبلة الألسن في المكان", "ru": "На смешение языков в этом месте", "en": "The confusing of languages there"}, {"he": "על הנהר שזרם בעמק", "ar": "على النهر الذي جرى في الوادي", "ru": "На реку, текущую в долине", "en": "The river flowing in the valley"}],2,{"he": "חפשו מילה בפסוק שנשמעת דומה לשם המקום.", "ar": "ابحثوا في الآية عن كلمة عبرية تشبه اسم المكان في لفظها.", "ru": "Найдите в стихе еврейское слово, похожее по звучанию на название места.", "en": "Find a Hebrew word in the verse that sounds like the place name."},{"he": "הסיפור מסביר את השם במשחק מילים. ״בבל״ נשמע כמו ״בלל״, כלומר ערבב. שם, לפי הסיפור, ה׳ בלל את שפת כל הארץ.", "ar": "تفسّر القصة الاسم بتلاعب لفظي. «بابل» يشبه الفعل العبري «بَلَل» أي خلط. هناك، بحسب القصة، بلبل الرب لسان كل الأرض.", "ru": "Рассказ объясняет имя игрой слов. «Бавель» звучит как «балаль» — смешал. Там, по рассказу, Господь смешал язык всей земли.", "en": "The story explains the name with wordplay. 'Babel' sounds like 'balal', to mix. There, in the story, the LORD confused the language of all the earth."},null,[{"he": "הטקסט קושר את השם לבלבול, לא לגובה.", "ar": "النص يربط الاسم بالبلبلة، لا بالارتفاع.", "ru": "Текст связывает имя со смешением, а не с высотой.", "en": "The text links the name to confusion, not height."}, {"he": "בסיפור אין מלך. הבונים מדברים כקבוצה.", "ar": "لا يوجد ملك في القصة، فالبناة يتكلمون كجماعة.", "ru": "В рассказе нет царя: строители говорят как группа.", "en": "There is no king in the story; the builders speak as a group."}, null, {"he": "בסיפור יש בקעה בארץ שנער, אבל אין נהר.", "ar": "في القصة سهل في أرض شنعار، لكن لا نهر.", "ru": "В рассказе есть равнина в земле Сеннаар, но нет реки.", "en": "The story has a plain in Shinar, but no river."}]),
  Q("or62-2-03",{"he": "ה׳ שואל את האדם אם אכל מן העץ. איך האדם מגיב לפי בראשית ג׳?", "ar": "يسأل الرب الإنسان هل أكل من الشجرة. كيف يجيب بحسب التكوين 3؟", "ru": "Господь спрашивает человека, ел ли он от дерева. Как он отвечает, согласно Бытию 3?", "en": "The LORD asks the man if he ate from the tree. How does he respond in Genesis 3?"},[{"he": "הוא מטיל את האשמה על האישה", "ar": "يُلقي اللوم على المرأة", "ru": "Он перекладывает вину на женщину", "en": "He puts the blame on the woman"}, {"he": "הוא מודה מיד ומבקש סליחה", "ar": "يعترف فورًا ويطلب الصفح", "ru": "Он сразу признаётся и просит прощения", "en": "He admits at once and asks forgiveness"}, {"he": "הוא מטיל את האשמה על הנחש", "ar": "يُلقي اللوم على الحية", "ru": "Он перекладывает вину на змея", "en": "He puts the blame on the serpent"}, {"he": "הוא שותק ואינו עונה דבר", "ar": "يصمت ولا يجيب بشيء", "ru": "Он молчит и ничего не отвечает", "en": "He stays silent and says nothing"}],0,{"he": "שימו לב: כל דמות מפנה אל דמות אחרת.", "ar": "لاحظوا أن كل شخصية تشير إلى شخصية أخرى.", "ru": "Обратите внимание: каждый персонаж указывает на другого.", "en": "Notice that each character points to another character."},{"he": "האדם אומר שהאישה שאלוהים נתן לו נתנה לו מן העץ. האישה אומרת שהנחש השיא אותה. כל אחד מעביר את האחריות הלאה.", "ar": "يقول الإنسان إن المرأة التي أعطاه الله إياها أعطته من الشجرة. وتقول المرأة إن الحية أغوتها. كل واحد ينقل المسؤولية إلى غيره.", "ru": "Человек говорит, что жена, данная ему Богом, дала ему от дерева. Женщина говорит, что змей обольстил её. Каждый перекладывает ответственность дальше.", "en": "The man says the woman God gave him gave him fruit. The woman says the serpent tricked her. Each one passes the responsibility on."},null,[null, {"he": "האדם אינו מבקש סליחה. הוא מסביר שהאישה נתנה לו.", "ar": "الإنسان لا يطلب الصفح، بل يقول إن المرأة أعطته.", "ru": "Человек не просит прощения: он говорит, что женщина дала ему.", "en": "The man does not ask forgiveness; he says the woman gave it to him."}, {"he": "את הנחש מאשימה האישה, לא האדם.", "ar": "المرأة هي التي تلوم الحية، لا الإنسان.", "ru": "Змея обвиняет женщина, а не мужчина.", "en": "It is the woman who blames the serpent, not the man."}, {"he": "האדם עונה. הוא אומר שהאישה נתנה לו מן העץ.", "ar": "الإنسان يجيب، ويقول إن المرأة أعطته من الشجرة.", "ru": "Человек отвечает: он говорит, что женщина дала ему от дерева.", "en": "The man answers; he says the woman gave him fruit from the tree."}]),
  Q("or62-2-04",{"he": "בבראשית א׳ חוזר הביטוי ״וירא אלוהים כי טוב״. מה הוא מדגיש בסיפור?", "ar": "في التكوين 1 تتكرر عبارة «ورأى الله ذلك أنه حسن». ماذا تُبرز في القصة؟", "ru": "В Бытии 1 повторяется «И увидел Бог, что это хорошо». Что это подчёркивает в рассказе?", "en": "Genesis 1 repeats 'And God saw that it was good'. What does this stress in the story?"},[{"he": "שהאדם חטא כבר בתחילה", "ar": "أن الإنسان أخطأ منذ البداية", "ru": "Что человек согрешил уже в начале", "en": "That the human sinned from the start"}, {"he": "שהבריאה לא הצליחה כמתוכנן", "ar": "أن الخلق لم ينجح كما خُطط له", "ru": "Что творение не удалось, как задумано", "en": "That creation did not work as planned"}, {"he": "שהעולם עומד להיחרב בקרוב", "ar": "أن العالم على وشك الخراب", "ru": "Что миру скоро грозит гибель", "en": "That the world is about to be destroyed"}, {"he": "שהעולם נברא טוב ומסודר", "ar": "أن العالم خُلق حسنًا ومنظّمًا", "ru": "Что мир создан хорошим и упорядоченным", "en": "That the world is created good and orderly"}],3,{"he": "חשבו מה מרגיש מי שמסתכל על עבודה שסיים.", "ar": "فكّروا بما يشعر به من ينظر إلى عمل أتمّه.", "ru": "Подумайте, что чувствует тот, кто смотрит на законченную работу.", "en": "Think how someone feels looking at work they finished."},{"he": "אחרי מעשי בריאה רבים נאמר ״וירא אלוהים כי טוב״. החזרה יוצרת קצב קבוע ותחושת סדר. בסוף היום השישי נאמר ״טוב מאוד״.", "ar": "بعد كثير من أعمال الخلق يُقال «ورأى الله ذلك أنه حسن». التكرار يخلق إيقاعًا ثابتًا وشعورًا بالنظام. وفي نهاية اليوم السادس يُقال «حسن جدًّا».", "ru": "После многих дел творения сказано: «И увидел Бог, что это хорошо». Повтор создаёт ровный ритм и ощущение порядка. В конце шестого дня сказано: «хорошо весьма».", "en": "After many acts of creation the text says 'God saw that it was good'. The repetition makes a steady rhythm and a sense of order. At the end of day six it says 'very good'."},null,[{"he": "בבראשית א׳ אין חטא. החטא מופיע רק בבראשית ג׳.", "ar": "لا توجد خطيئة في التكوين 1، فهي تظهر في التكوين 3.", "ru": "В Бытии 1 нет греха: он появляется только в Бытии 3.", "en": "There is no sin in Genesis 1; it appears only in Genesis 3."}, {"he": "הביטוי מביע שביעות רצון, לא כישלון.", "ar": "العبارة تعبّر عن الرضا، لا عن الفشل.", "ru": "Фраза выражает одобрение, а не неудачу.", "en": "The phrase expresses approval, not failure."}, {"he": "החורבן במבול מגיע רק בבראשית ו׳, בגלל רשע האדם.", "ar": "الدمار بالطوفان يأتي في التكوين 6، بسبب شرّ الإنسان.", "ru": "Гибель в потопе приходит лишь в Бытии 6, из-за зла людей.", "en": "Destruction by flood comes only in Genesis 6, due to human evil."}, null]),
  Q("or62-2-05",{"he": "לפי בראשית ב׳, למה נבראת האישה?", "ar": "بحسب التكوين 2، لماذا خُلقت المرأة؟", "ru": "Согласно Бытию 2, почему была создана женщина?", "en": "According to Genesis 2, why was the woman created?"},[{"he": "כדי לשמור לבדה על הגן", "ar": "لكي تحرس الجنة وحدها", "ru": "Чтобы одной охранять сад", "en": "To guard the garden by herself"}, {"he": "כעונש על האכילה מן העץ", "ar": "عقابًا على الأكل من الشجرة", "ru": "В наказание за вкушение от дерева", "en": "As punishment for eating from the tree"}, {"he": "כי ״לא טוב היות האדם לבדו״", "ar": "لأنه «ليس حسنًا أن يكون آدم وحده»", "ru": "Потому что «нехорошо быть человеку одному»", "en": "Because 'it is not good for the man to be alone'"}, {"he": "כדי לתת שמות לבעלי החיים", "ar": "لكي تسمّي الحيوانات", "ru": "Чтобы дать имена животным", "en": "To give names to the animals"}],2,{"he": "חשבו מה חסר לאדם בגן, גם כשיש לו הכול.", "en": "Think about what the man lacks in the garden, even with everything there.", "ru": "Подумайте, чего не хватает человеку в саду, хотя у него всё есть.", "ar": "فكّروا فيما ينقص الإنسان في الجنة، مع أن لديه كل شيء."},{"he": "בבראשית ב׳ אלוהים אומר ״לא טוב היות האדם לבדו״. האדם נותן שמות לחיות, אבל לא נמצא לו עזר כנגדו. לכן נבנית האישה מצלע האדם.", "ar": "في التكوين 2 يقول الله «ليس حسنًا أن يكون آدم وحده». يسمّي الإنسان الحيوانات، لكنه لا يجد معينًا نظيره. لذلك تُبنى المرأة من ضلع الإنسان.", "ru": "В Бытии 2 Бог говорит: «Нехорошо быть человеку одному». Человек даёт имена животным, но помощника под стать ему нет. Поэтому женщина создаётся из ребра человека.", "en": "In Genesis 2 God says 'it is not good for the man to be alone'. The man names the animals, but finds no fitting helper. So the woman is built from the man's rib."},null,[{"he": "את התפקיד לעבוד ולשמור את הגן מקבל האדם.", "ar": "مهمة فلاحة الجنة وحراستها أُعطيت للإنسان.", "ru": "Задачу возделывать и хранить сад получает человек.", "en": "The task to work and keep the garden is given to the man."}, {"he": "האישה נבראת לפני האכילה מן העץ, לא אחריה.", "ar": "المرأة خُلقت قبل الأكل من الشجرة، لا بعده.", "ru": "Женщина создана до вкушения от дерева, а не после.", "en": "The woman is created before the eating, not after it."}, null, {"he": "את השמות לבעלי החיים נותן האדם עצמו.", "ar": "الإنسان نفسه هو من يسمّي الحيوانات.", "ru": "Имена животным даёт сам человек.", "en": "The man himself names the animals."}]),
  Q("or62-2-06",{"he": "ברשימת הדורות בבראשית ה׳ חוזרת המילה ״וימת״. על מי לא נאמרת המילה הזאת?", "ar": "في قائمة الأجيال في التكوين 5 تتكرر كلمة «ومات». عمّن لا تُقال هذه الكلمة؟", "ru": "В списке поколений в Бытии 5 повторяется «и он умер». О ком это не сказано?", "en": "In the Genesis 5 genealogy the words 'and he died' repeat. Of whom is this not said?"},[{"he": "על מתושלח", "ar": "عن متوشالح", "ru": "О Мафусаиле", "en": "Methuselah"}, {"he": "על חנוך", "ar": "عن أخنوخ", "ru": "О Енохе", "en": "Enoch"}, {"he": "על שת", "ar": "عن شيث", "ru": "О Сифе", "en": "Seth"}, {"he": "על אדם", "ar": "عن آدم", "ru": "Об Адаме", "en": "Adam"}],1,{"he": "חפשו דמות שעליה נאמר שהתהלך עם האלוהים.", "ar": "ابحثوا عن شخصية قيل إنها سارت مع الله.", "ru": "Найдите того, о ком сказано, что он ходил пред Богом.", "en": "Look for the one who is said to have walked with God."},{"he": "ברשימה כל דור מסתיים במילה ״וימת״. חנוך יוצא דופן: נאמר שהתהלך עם האלוהים ״ואיננו״. החריגה בולטת דווקא בגלל החזרה הקבועה.", "ar": "في القائمة ينتهي كل جيل بكلمة «ومات». أخنوخ استثناء: قيل إنه سار مع الله «ولم يوجد». الاستثناء يبرز بسبب التكرار الثابت.", "ru": "В списке каждое поколение кончается словами «и он умер». Енох — исключение: он ходил пред Богом, «и не стало его». Исключение заметно именно из-за постоянного повтора.", "en": "In the list each generation ends with 'and he died'. Enoch is the exception: he walked with God, 'and he was not'. The exception stands out because of the steady repetition."},null,[{"he": "מתושלח חי הכי הרבה שנים, אבל גם עליו נאמר ״וימת״.", "ar": "عاش متوشالح أطول عمر، لكن قيل عنه أيضًا «ومات».", "ru": "Мафусаил прожил дольше всех, но и о нём сказано «и он умер».", "en": "Methuselah lived longest, but 'and he died' is said of him too."}, null, {"he": "גם על שת, בנו של אדם, נאמר ״וימת״.", "ar": "قيل أيضًا عن شيث، ابن آدم، «ومات».", "ru": "И о Сифе, сыне Адама, сказано «и он умер».", "en": "'And he died' is also said of Seth, Adam's son."}, {"he": "הרשימה פותחת באדם, וגם עליו נאמר ״וימת״.", "ar": "القائمة تبدأ بآدم، وقيل عنه أيضًا «ومات».", "ru": "Список начинается с Адама, и о нём тоже сказано «и он умер».", "en": "The list opens with Adam, and 'and he died' is said of him too."}])],
 [
  Q("bib-origin-1262-4",{"he": "איזה תיאור מתאים למגדל בבל?", "ar": "أي وصف يناسب برج بابل؟", "ru": "Какое описание подходит к «Вавилонская башня»?", "en": "Which description fits Tower of Babel?"},[{"he": "בראשית א׳ מציג סדר של ימי בריאה; בראשית ב׳ מתמקד באדם ובגן.", "ar": "يعرض التكوين 1 ترتيب أيام الخلق، ويركز التكوين 2 على الإنسان والحديقة.", "ru": "Бытие 1 описывает последовательность дней, а Бытие 2 сосредоточено на человеке и саде.", "en": "Genesis 1 orders creation by days; Genesis 2 focuses on the human and the garden."},{"he": "בבראשית ג׳ אכילה מן העץ האסור מובילה לשאלות על בחירה ואחריות.", "ar": "في التكوين 3 يقود الأكل من الشجرة المحرمة إلى أسئلة الاختيار والمسؤولية.", "ru": "В Бытии 3 вкушение от запретного дерева ставит вопросы выбора и ответственности.", "en": "In Genesis 3 eating from the forbidden tree raises questions of choice and responsibility."},{"he": "בבראשית ד׳ קנאה ורצח אח מלוּוים בשאלה על אחריותו של אדם לאחיו.", "ar": "في التكوين 4 تصاحب الغيرة وقتل الأخ مسألة مسؤولية الإنسان عن أخيه.", "ru": "В Бытии 4 зависть и убийство брата ставят вопрос об ответственности за ближнего.", "en": "In Genesis 4 jealousy and fratricide are tied to responsibility for a brother."},{"he": "בבראשית י״א מסופר על בניית מגדל ועל בלבול השפות.", "ar": "في التكوين 11 قصة بناء البرج واختلاط الألسنة.", "ru": "В Бытии 11 рассказ о строительстве башни и смешении языков.", "en": "Genesis 11 tells of building a tower and the confusion of tongues."}],3,{"he": "חפשו את הפרט שמבדיל אותו מן האחרים.", "ar": "ابحثوا عن التفصيل الذي يميزه عن غيره.", "ru": "Ищите отличие от остальных вариантов.", "en": "Look for the detail that separates it from the others."},{"he": "הדיבור המשותף והפסקתו קושרים בין אחדות לפיזור.", "ar": "يجمع اللسان الواحد وتغيّره بين الوحدة والتفرق.", "ru": "Общий язык и его утрата связывают единство с рассеянием.", "en": "Shared speech and its disruption connect unity and dispersion."},null,[{"he": "זה מתאר את שני תיאורי הבריאה, לא את מגדל בבל.", "ar": "هذا يصف روايتا الخلق، لا برج بابل.", "ru": "Это описание «Два рассказа о творении», а не «Вавилонская башня».", "en": "That describes two creation accounts, not Tower of Babel."},{"he": "זה מתאר את עץ הדעת, לא את מגדל בבל.", "ar": "هذا يصف شجرة المعرفة، لا برج بابل.", "ru": "Это описание «Дерево познания», а не «Вавилонская башня».", "en": "That describes tree of knowledge, not Tower of Babel."},{"he": "זה מתאר את קין והבל, לא את מגדל בבל.", "ar": "هذا يصف قابيل وهابيل، لا برج بابل.", "ru": "Это описание «Каин и Авель», а не «Вавилонская башня».", "en": "That describes Cain and Abel, not Tower of Babel."},null])
 ,Q("bib-origin-babel",{"he": "מה מבקר סיפור מגדל בבל?", "ar": "ماذا تنتقد قصة برج بابل؟", "ru": "Что критикует история о Вавилонской башне?", "en": "What does the Tower of Babel story criticize?"},[{"he": "ריכוז כוח לשם תהילה עצמית, במקום מטרה משותפת", "ar": "تمركز القوة لمجد ذاتي بدل غاية مشتركة", "ru": "Сосредоточение силы ради собственной славы вместо общей цели", "en": "A concentration of power for self-glory instead of a shared purpose"},{"he": "הבנייה בלבנים במקום באבנים הייתה שגיאה הנדסית של הבונים", "ar": "البناء باللبن بدل الحجارة كان خطأ هندسيًا من البنائين", "ru": "Строительство из кирпичей вместо камней было инженерной ошибкой строителей", "en": "Building with bricks instead of stones was an engineering mistake by the builders"},{"he": "דיבור בשפה אחת", "ar": "التحدث بلغة واحدة", "ru": "Речь на одном языке", "en": "Speaking one language"},{"he": "מגורים בעמק", "ar": "السكن في السهل", "ru": "Жительство в долине", "en": "Living in a valley"}],0,{"he": "שימו לב מה הבונים אומרים על עצמם.", "ar": "انتبهوا ماذا يقول البناؤون عن أنفسهم.", "ru": "Обратите внимание, что строители говорят о себе.", "en": "Notice what the builders say about themselves."},{"he": "הבונים אומרים: 'נעשה לנו שם, פן נפוץ' (בראשית י\"א). דוגמה: הבעיה אינה הטכנולוגיה (לבנים נזכרות כפרט) אלא המטרה - תהילה עצמית וריכוז. התוצאה, פיזור ושפות, היא היפוך ישיר של התוכנית.", "ar": "يقول البناؤون: «لنصنع لنا اسمًا لئلا نتبدد» (التكوين 11). مثال: المشكلة ليست التقنية (اللبن يُذكر كتفصيل) بل الغاية - مجد ذاتي وتمركز. النتيجة، تشتت ولغات، هي عكس مباشر للخطة.", "ru": "Строители говорят: «сделаем себе имя, чтобы не рассеяться» (Бытие 11). Пример: проблема не в технологии (кирпичи упомянуты как деталь), а в цели - собственная слава и сосредоточение. Результат, рассеяние и языки, - прямой разворот плана.", "en": "The builders say: \"let us make a name for ourselves, lest we scatter\" (Genesis 11). Example: the problem is not the technology (bricks are mentioned as a detail) but the goal - self-glory and concentration. The outcome, scattering and languages, is a direct reversal of the plan."},null,[null,{"he": "חומרי הבנייה הם פרט טכני; הביקורת אינה עליהם.", "ar": "مواد البناء تفصيل تقني؛ النقد ليس عليها.", "ru": "Материалы - техническая деталь; критика не о них.", "en": "The materials are a technical detail; the criticism is not about them."},{"he": "השפה האחת אינה מוצגת כבעיה; היא כלי של היוזמה.", "ar": "اللغة الواحدة لا تُعرض كمشكلة؛ هي أداة المبادرة.", "ru": "Один язык не представлен как проблема; он инструмент затеи.", "en": "The single language is not presented as the problem; it is the project's tool."},{"he": "המקום ניטרלי; הבחירה והמטרה הן מוקד הביקורת.", "ar": "المكان محايد؛ الاختيار والغاية هما محور النقد.", "ru": "Место нейтрально; выбор и цель - фокус критики.", "en": "The place is neutral; the choice and the goal are the focus of criticism."}]),Q("bib-origin-flood-justice",{"he": "תלמיד טוען שסיפור המבול מראה שאין טעם לנהוג כראוי. איזו התייחסות הולמת?", "ar": "يدّعي طالب أن قصة الطوفان تُظهر أن لا جدوى من التصرف كما ينبغي. أي معالجة مناسبة؟", "ru": "Ученик утверждает, что история потопа показывает бессмысленность достойного поведения. Какой подход уместен?", "en": "A student claims the flood story shows there is no point in behaving rightly. Which response is fitting?"},[{"he": "ההפך: נח הצדיק ניצל, והברית מבטיחה סדר עולם יציב", "ar": "العكس: نوح الصدّيق نجا، والعهد يعد بنظام عالم ثابت", "ru": "Напротив: праведный Ной спасён, и завет обещает устойчивый порядок", "en": "The opposite: righteous Noah is saved, and the covenant promises a stable order"},{"he": "הטענה נכונה לחלוטין; בטקסט אין שום התייחסות לצדיקים או לברית", "ar": "الادعاء صحيح تمامًا؛ لا توجد في النص أي إشارة إلى صدّيقين أو إلى عهد", "ru": "Утверждение совершенно верно; в тексте нет никакого отношения ни к праведным, ни к завету", "en": "The claim is entirely correct; the text has no reference at all to the righteous or to a covenant"},{"he": "המבול הוא סיפור על דגים בלבד", "ar": "الطوفان قصة عن أسماك فقط", "ru": "Потоп - история только о рыбах", "en": "The flood is a story only about fish"},{"he": "נח נענש בסוף הסיפור", "ar": "نوح عوقب في نهاية القصة", "ru": "Ной наказан в конце истории", "en": "Noah is punished at the end of the story"}],0,{"he": "בדקו מה קורה לדמות המרכזית ומה מובטח בסוף.", "ar": "افحصوا ما يحدث للشخصية المركزية وما يُوعد في النهاية.", "ru": "Проверьте, что происходит с главным героем и что обещано в конце.", "en": "Check what happens to the central character and what is promised at the end."},{"he": "הטקסט פותח את הסיפור ב'נח איש צדיק תמים היה בדורותיו' (בראשית ו'). דוגמה: ההצלה עצמה מבוססת על הליכה כראוי, וברית הקשת מוסיפה הבטחה: 'עוד לא אוסיף לקלל את האדמה'. מסקנת הסיפור הפוכה מהטענה.", "ar": "يفتتح النص القصة بـ«نوح رجل صدّيق تام كان في أجياله» (التكوين 6). مثال: النجاة نفسها مؤسسة على السلوك القويم، وعهد القوس يضيف وعدًا: «لن أعود ألعن الأرض». خلاصة القصة معاكسة للادعاء.", "ru": "Текст открывает историю словами «Ной был человек праведный и непорочный в поколениях своих» (Бытие 6). Пример: само спасение основано на достойной жизни, а завет радуги добавляет обещание: «не буду больше проклинать землю». Вывод истории противоположен утверждению.", "en": "The text opens the story with \"Noah was a righteous man, blameless in his generations\" (Genesis 6). Example: the rescue itself rests on right living, and the rainbow covenant adds a promise: \"I will not again curse the ground\". The story's conclusion is the opposite of the claim."},null,[null,{"he": "נח מוצג כצדיק ממש בפתיחת הסיפור.", "ar": "نوح يُعرض كصدّيق في افتتاح القصة نفسها.", "ru": "Ной представлен праведником в самом открытии истории.", "en": "Noah is presented as righteous in the story's very opening."},{"he": "הגשת הסיפור ככזה 'על דגים' מחמיצה את מהלך המשפט והברית.", "ar": "عرض القصة كأنها «عن أسماك» يفوّت مسار الحكم والعهد.", "ru": "Представление истории как «о рыбах» упускает ход суда и завета.", "en": "Framing the story as being \"about fish\" misses the course of judgment and covenant."},{"he": "נח אינו נענש; הוא מקבל ברכה וברית.", "ar": "نوح لا يُعاقب؛ ينال بركة وعهدًا.", "ru": "Ной не наказан; он получает благословение и завет.", "en": "Noah is not punished; he receives a blessing and a covenant."}]),
  Q("or62-3-01",{"he": "מה ההבדל בין בראשית א׳ לבראשית ב׳ בבריאת האיש והאישה?", "ar": "ما الفرق بين التكوين 1 والتكوين 2 في خلق الرجل والمرأة؟", "ru": "В чём разница между Бытием 1 и Бытием 2 в создании мужчины и женщины?", "en": "How do Genesis 1 and Genesis 2 differ on creating man and woman?"},[{"he": "בפרק א׳ נבראים יחד; בפרק ב׳ האישה נבנית אחר כך מצלע", "ar": "في الفصل 1 يُخلقان معًا، وفي الفصل 2 تُبنى المرأة لاحقًا من ضلع", "ru": "В главе 1 они созданы вместе; в главе 2 женщина создана позже из ребра", "en": "In chapter 1 they are made together; in chapter 2 the woman is built later from a rib"}, {"he": "בפרק א׳ האישה נבנית מצלע; בפרק ב׳ הם נבראים יחד", "ar": "في الفصل 1 تُبنى المرأة من ضلع، وفي الفصل 2 يُخلقان معًا", "ru": "В главе 1 женщина из ребра; в главе 2 они созданы вместе", "en": "In chapter 1 the woman comes from a rib; in chapter 2 they are made together"}, {"he": "בשני הפרקים האישה נבנית מצלע של האדם הראשון", "ar": "في الفصلين تُبنى المرأة من ضلع الإنسان", "ru": "В обеих главах женщина создана из ребра человека", "en": "In both chapters the woman is built from the man's rib"}, {"he": "בפרק א׳ נברא רק איש; בפרק ב׳ נבראת רק אישה", "ar": "في الفصل 1 خُلق رجل فقط، وفي الفصل 2 امرأة فقط", "ru": "В главе 1 создан только мужчина; в главе 2 только женщина", "en": "In chapter 1 only a man is made; in chapter 2 only a woman"}],0,{"he": "השוו מתי מופיעה האישה בכל אחד מהפרקים.", "ar": "قارنوا متى تظهر المرأة في كل فصل.", "ru": "Сравните, когда появляется женщина в каждой главе.", "en": "Compare when the woman appears in each chapter."},{"he": "בבראשית א׳ נאמר ״זכר ונקבה ברא אותם״, באותו מעשה. בבראשית ב׳ האדם נוצר קודם, והאישה נבנית מצלעו. ההבדל הזה מעיד על שני תיאורים שונים, וכל אחד מדגיש דבר אחר.", "ar": "في التكوين 1 يُقال «ذكرًا وأنثى خلقهم» في فعل واحد. وفي التكوين 2 يُجبل الإنسان أولًا ثم تُبنى المرأة من ضلعه. هذا الفرق يدل على روايتين مختلفتين، لكل منهما تركيز آخر.", "ru": "В Бытии 1 сказано «мужчину и женщину сотворил их» — одним действием. В Бытии 2 сначала создан человек, а женщина — из его ребра. Это различие указывает на два рассказа с разными акцентами.", "en": "Genesis 1 says 'male and female He created them' in one act. In Genesis 2 the man is formed first, and the woman is built from his rib. This difference points to two accounts, each with its own focus."},null,[null, {"he": "זה הפוך. הצלע מופיעה בבראשית ב׳, ו״זכר ונקבה״ בבראשית א׳.", "ar": "هذا معكوس: الضلع في التكوين 2، و«ذكرًا وأنثى» في التكوين 1.", "ru": "Наоборот: ребро в Бытии 2, а «мужчину и женщину» — в Бытии 1.", "en": "It is reversed: the rib is in Genesis 2, 'male and female' in Genesis 1."}, {"he": "בבראשית א׳ אין צלע. נאמר שם ״זכר ונקבה ברא אותם״.", "ar": "لا ضلع في التكوين 1، بل يُقال «ذكرًا وأنثى خلقهم».", "ru": "В Бытии 1 нет ребра: там сказано «мужчину и женщину сотворил их».", "en": "Genesis 1 has no rib; it says 'male and female He created them'."}, {"he": "בפרק א׳ נבראים זכר ונקבה, ובפרק ב׳ נבראים שניהם.", "ar": "في الفصل 1 يُخلق ذكر وأنثى، وفي الفصل 2 يُخلق الاثنان.", "ru": "В главе 1 созданы мужчина и женщина, и в главе 2 — оба.", "en": "Chapter 1 creates male and female, and chapter 2 creates both too."}]),
  Q("or62-3-02",{"he": "אחרי המבול נח ובניו מתברכים: ״פרו ורבו ומלאו את הארץ״. מה מלמד הקשר לבראשית א׳?", "ar": "بعد الطوفان يُبارَك نوح وبنوه: «أثمروا واكثروا واملأوا الأرض». ماذا تُعلّم الصلة بالتكوين 1؟", "ru": "После потопа Ной и сыновья получают благословение: «плодитесь и размножайтесь и наполняйте землю». Чему учит связь с Бытием 1?", "en": "After the Flood Noah and his sons are blessed: 'be fruitful, multiply, fill the earth'. What does the link to Genesis 1 show?"},[{"he": "שהמבול לא שינה דבר בעולם", "ar": "أن الطوفان لم يغيّر شيئًا في العالم", "ru": "Что потоп ничего не изменил в мире", "en": "That the Flood changed nothing in the world"}, {"he": "שנח הוא האדם הראשון שנברא", "ar": "أن نوحًا هو أول إنسان خُلق", "ru": "Что Ной — первый сотворённый человек", "en": "That Noah is the first human created"}, {"he": "שהברכה ניתנת כאן בפעם הראשונה במקרא", "ar": "أن البركة أُعطيت الآن لأول مرة", "ru": "Что благословение дано теперь впервые", "en": "That the blessing is given now for the first time"}, {"he": "שאחרי המבול העולם מתחיל כמו מחדש", "ar": "أن العالم يبدأ من جديد بعد الطوفان، كما في الخلق", "ru": "Что после потопа мир начинается заново, как при творении", "en": "That after the Flood the world starts again, as at creation"}],3,{"he": "חפשו בבראשית א׳ את אותן מילים בדיוק.", "ar": "ابحثوا في التكوين 1 عن الكلمات نفسها تمامًا.", "ru": "Найдите в Бытии 1 те же самые слова.", "en": "Look for the very same words in Genesis 1."},{"he": "אותה ברכה נאמרת לאדם בבראשית א׳. החזרה עליה בבראשית ט׳ מציגה את נח כמעין אדם שני. העולם, לפי הסיפור, נברא כמו מחדש.", "ar": "البركة نفسها قيلت للإنسان في التكوين 1. تكرارها في التكوين 9 يقدّم نوحًا كآدم ثانٍ. والعالم، بحسب القصة، يُخلق من جديد تقريبًا.", "ru": "То же благословение звучит для человека в Бытии 1. Повтор в Бытии 9 представляет Ноя как второго Адама. Мир, по рассказу, словно создаётся заново.", "en": "The same blessing is said to the human in Genesis 1. Repeating it in Genesis 9 presents Noah as a kind of second Adam. In the story, the world is as if created anew."},null,[{"he": "המבול השמיד כמעט את כל החיים, ולכן נדרשת ברכה מחדש.", "ar": "الطوفان أهلك معظم الحياة، ولذلك تلزم بركة جديدة.", "ru": "Потоп уничтожил почти всё живое, поэтому нужно новое благословение.", "en": "The Flood wiped out almost all life, so a new blessing is needed."}, {"he": "נח אינו נברא. הוא הדור העשירי מאדם.", "ar": "نوح لم يُخلق، بل هو الجيل العاشر من آدم.", "ru": "Ной не сотворён: он десятое поколение от Адама.", "en": "Noah is not created; he is the tenth generation from Adam."}, {"he": "אותה ברכה כבר ניתנה לאדם ולאישה בבראשית א׳.", "ar": "البركة نفسها أُعطيت للرجل والمرأة في التكوين 1.", "ru": "То же благословение уже дано мужчине и женщине в Бытии 1.", "en": "The same blessing was already given to man and woman in Genesis 1."}, null]),
  Q("or62-3-03",{"he": "איך קשור סיפור מגדל בבל לברכה ״ומלאו את הארץ״?", "ar": "كيف ترتبط قصة برج بابل ببركة «واملأوا الأرض»؟", "ru": "Как рассказ о Вавилонской башне связан с благословением «наполняйте землю»?", "en": "How does the Tower of Babel story relate to the blessing 'fill the earth'?"},[{"he": "הבונים יוצאים למלא את הארץ, ולכן מקבלים שכר", "ar": "البناة يخرجون ليملأوا الأرض، فيُكافأون", "ru": "Строители идут наполнять землю и получают награду", "en": "The builders go out to fill the earth and are rewarded"}, {"he": "הבונים רוצים להישאר במקום אחד, ובסוף מופצים", "ar": "البناة يريدون البقاء معًا في مكان واحد، وفي النهاية يُشتَّتون", "ru": "Строители хотят остаться в одном месте, а в конце их рассеивают", "en": "The builders want to stay in one place, and in the end they are scattered"}, {"he": "אין שום קשר, כי הסיפור עוסק רק בבניית המגדל", "ar": "لا صلة، فالقصة تتناول البناء فقط", "ru": "Связи нет: рассказ только о строительстве", "en": "There is no link; the story is only about building"}, {"he": "הבונים נענשים כי עזבו את המגדל", "ar": "يُعاقَب البناة لأنهم تركوا البرج", "ru": "Строителей наказывают за то, что они бросили башню", "en": "The builders are punished for leaving the tower"}],1,{"he": "השוו את מה שהבונים מפחדים ממנו למה שקורה בסוף.", "ar": "قارنوا ما يخشاه البناة بما يحدث في النهاية.", "ru": "Сравните, чего боятся строители, с тем, что происходит в конце.", "en": "Compare what the builders fear with what happens at the end."},{"he": "הבונים אומרים ״פן נפוץ על פני כל הארץ״. הם רוצים להישאר יחד, בניגוד לברכה למלא את הארץ. בסוף ה׳ מפיץ אותם, ומה שפחדו ממנו קורה.", "ar": "يقول البناة «لئلا نتبدّد على وجه كل الأرض». يريدون البقاء معًا، خلافًا لبركة ملء الأرض. وفي النهاية يبدّدهم الرب، فيحدث ما خافوا منه.", "ru": "Строители говорят: «чтобы нам не рассеяться по лицу всей земли». Они хотят держаться вместе, вопреки благословению наполнить землю. В конце Господь рассеивает их — сбывается то, чего они боялись.", "en": "The builders say 'lest we be scattered over the whole earth'. They want to stay together, against the blessing to fill the earth. In the end the LORD scatters them, and what they feared happens."},null,[{"he": "הבונים אומרים ״פן נפוץ״. הם רוצים דווקא לא להתפזר.", "ar": "يقول البناة «لئلا نتبدّد»، فهم لا يريدون التشتت.", "ru": "Строители говорят «чтобы нам не рассеяться» — они не хотят расходиться.", "en": "The builders say 'lest we be scattered'; they want not to spread."}, null, {"he": "פיזור על פני הארץ הוא חלק מרכזי בפתיחה ובסוף הסיפור.", "ar": "التشتت على وجه الأرض جزء مركزي في بداية القصة ونهايتها.", "ru": "Рассеяние по земле — главная часть начала и конца рассказа.", "en": "Scattering over the earth is central at the start and end of the story."}, {"he": "הם מפסיקים לבנות בגלל הבלבול. העזיבה היא תוצאה, לא חטא.", "ar": "توقفوا عن البناء بسبب البلبلة، فالترك نتيجة لا خطيئة.", "ru": "Они перестают строить из-за смешения; уход — следствие, а не грех.", "en": "They stop building because of the confusion; leaving is a result, not a sin."}]),
  Q("or62-3-04",{"he": "מה משותף לסיפור הגן ולסיפור קין, אחרי העונש?", "ar": "ما المشترك بين قصة الجنة وقصة قايين بعد العقاب؟", "ru": "Что общего у рассказа о саде и рассказа о Каине после наказания?", "en": "What do the garden story and the Cain story share after the punishment?"},[{"he": "בשניהם מי שחטא מת מיד אחרי העונש", "ar": "في الاثنتين يموت المخطئ فورًا", "ru": "В обоих согрешивший сразу умирает", "en": "In both the sinner dies at once"}, {"he": "בשניהם החוטא אינו נענש כלל", "ar": "في الاثنتين لا يُعاقَب المخطئ أبدًا", "ru": "В обоих согрешивший вовсе не наказан", "en": "In both the sinner is not punished at all"}, {"he": "לצד העונש, אלוהים גם דואג לנענשים", "ar": "إلى جانب العقاب، يعتني الله أيضًا بالمعاقَبين", "ru": "Наряду с наказанием Бог заботится о наказанных", "en": "Alongside punishment, God also cares for those punished"}, {"he": "בשניהם העונש הוא מבול על הארץ", "ar": "في الاثنتين العقاب طوفان على الأرض", "ru": "В обоих наказание — потоп на земле", "en": "In both the punishment is a flood on the earth"}],2,{"he": "חפשו מעשה של אלוהים שבא מיד אחרי גזר הדין.", "ar": "ابحثوا عن فعل لله يأتي مباشرة بعد الحكم.", "ru": "Найдите действие Бога сразу после приговора.", "en": "Look for something God does right after the sentence."},{"he": "אחרי הגירוש מן הגן, אלוהים עושה לאדם ולאישה כתנות עור. קין נענש בנדודים, אבל מקבל אות כדי שלא יפגעו בו. בשני הסיפורים, לפי הטקסט, יש עונש וגם חסד.", "ar": "بعد الطرد من الجنة، يصنع الله لآدم وامرأته أقمصة من جلد. ويُعاقَب قايين بالتيه، لكنه ينال علامة لئلا يؤذيه أحد. في القصتين، بحسب النص، يوجد عقاب ورحمة معًا.", "ru": "После изгнания из сада Бог делает человеку и жене одежды из кожи. Каин наказан скитаниями, но получает знак, чтобы его не убили. В обоих рассказах, по тексту, есть и наказание, и милость.", "en": "After the exile from the garden, God makes garments of skin for the man and woman. Cain is punished with wandering but gets a sign so no one harms him. In both stories, by the text, there is punishment and also mercy."},null,[{"he": "אדם, חוה וקין נשארים בחיים אחרי העונש.", "ar": "آدم وحواء وقايين يبقون أحياء بعد العقاب.", "ru": "Адам, Ева и Каин остаются живы после наказания.", "en": "Adam, Eve and Cain stay alive after the punishment."}, {"he": "יש עונש: גירוש מן הגן, ונדודים לקין.", "ar": "هناك عقاب: الطرد من الجنة، والتيه لقايين.", "ru": "Наказание есть: изгнание из сада и скитания Каина.", "en": "There is punishment: exile from the garden, and wandering for Cain."}, null, {"he": "המבול הוא סיפור נפרד, בבראשית ו׳ עד ט׳.", "ar": "الطوفان قصة منفصلة، في التكوين 6 إلى 9.", "ru": "Потоп — отдельный рассказ, в Бытии 6–9.", "en": "The Flood is a separate story, in Genesis 6 to 9."}]),
  Q("or62-3-05",{"he": "אחרי האכילה ה׳ שואל ״איכה?״, ואחרי הרצח ״אי הבל אחיך?״. מה התפקיד של שאלות אלה בסיפור?", "ar": "بعد الأكل يسأل الرب «أين أنت؟»، وبعد القتل «أين هابيل أخوك؟». ما دور هذين السؤالين في القصة؟", "ru": "После вкушения Господь спрашивает «Где ты?», а после убийства — «Где Авель, брат твой?». Какова роль этих вопросов в рассказе?", "en": "After the eating the LORD asks 'Where are you?', after the murder 'Where is Abel your brother?'. What role do these questions play?"},[{"he": "הן נותנות הזדמנות להודות ולקחת אחריות", "ar": "يمنحان الإنسان فرصة للاعتراف وتحمّل المسؤولية", "ru": "Они дают человеку шанс признаться и взять ответственность", "en": "They give the person a chance to admit and take responsibility"}, {"he": "הן מראות שה׳ אינו יודע מה קרה", "ar": "يُظهران أن الرب لا يعلم ما حدث", "ru": "Они показывают, что Господь не знает, что случилось", "en": "They show the LORD does not know what happened"}, {"he": "הן עוסקות רק במקום שבו נמצאת הדמות", "ar": "يتعلّقان فقط بمكان وجود الشخصية", "ru": "Они касаются только того, где находится персонаж", "en": "They are only about where the character is located"}, {"he": "הן פונות לקורא בלבד ולא לדמויות בסיפור", "ar": "يتوجّهان إلى القارئ لا إلى الشخصيات", "ru": "Они обращены к читателю, а не к персонажам", "en": "They address the reader, not the characters"}],0,{"he": "בדקו מה הדמות יכולה לעשות אחרי שנשאלה.", "ar": "انظروا ماذا تستطيع الشخصية أن تفعل بعد السؤال.", "ru": "Посмотрите, что персонаж может сделать после вопроса.", "en": "Check what the character can do after being asked."},{"he": "בשני הסיפורים ה׳ פותח בשאלה ולא בעונש. השאלה פותחת פתח להודאה, אבל האדם מאשים את האישה, וקין עונה ״לא ידעתי״. כך הסיפורים מבליטים את שאלת האחריות.", "ar": "في القصتين يبدأ الرب بسؤال لا بعقاب. السؤال يفتح بابًا للاعتراف. الإنسان يلوم المرأة، وقايين يجيب «لا أعلم». هكذا تُبرز القصتان مسألة المسؤولية.", "ru": "В обоих рассказах Господь начинает с вопроса, а не с наказания. Вопрос открывает путь к признанию. Человек винит жену, а Каин отвечает «не знаю». Так рассказы выдвигают вопрос ответственности.", "en": "In both stories the LORD opens with a question, not a punishment. The question opens a way to confess. The man blames the woman, and Cain answers 'I do not know'. So the stories highlight responsibility."},null,[null, {"he": "בהמשך ה׳ מראה שהוא יודע, למשל ״קול דמי אחיך צועקים״.", "ar": "في الاستمرار يُظهر الرب أنه يعلم، مثل «صوت دم أخيك صارخ».", "ru": "Дальше Господь показывает, что знает: «голос крови брата твоего вопиет».", "en": "Next the LORD shows he knows, e.g. 'your brother's blood cries out'."}, {"he": "השאלות מובילות לשיחה על המעשה, לא על מקום.", "ar": "السؤالان يقودان إلى حديث عن الفعل، لا عن المكان.", "ru": "Вопросы ведут к разговору о поступке, а не о месте.", "en": "The questions lead to talk about the deed, not about a place."}, {"he": "השאלות מופנות ישירות לאדם ולקין, והם עונים עליהן.", "ar": "السؤالان موجّهان مباشرة إلى آدم وقايين، وهما يجيبان.", "ru": "Вопросы обращены прямо к Адаму и Каину, и они отвечают.", "en": "The questions go directly to Adam and Cain, and they answer."}]),
  Q("or62-3-06",{"he": "בבראשית ו׳ נח מצווה להביא ״שניים מכל״. בבראשית ז׳ — שבעה שבעה מן הבהמה הטהורה. מה הסבר אפשרי להבדל?", "ar": "في التكوين 6 يُؤمر نوح بإدخال «اثنين من كلٍّ». وفي التكوين 7 سبعة سبعة من البهائم الطاهرة. ما تفسير ممكن للفرق؟", "ru": "В Бытии 6 Ною велено взять «по паре от всех». В Бытии 7 — по семь от чистых животных. Какое возможное объяснение разницы?", "en": "In Genesis 6 Noah must bring 'two of every kind'. In Genesis 7, seven pairs of the clean animals. What is a possible explanation?"},[{"he": "שני הציוויים זהים, ואין ביניהם הבדל", "ar": "لا يوجد أي فرق بين الأمرين", "ru": "Между двумя повелениями нет никакой разницы", "en": "There is no difference between the two commands"}, {"he": "נח סירב לציווי הראשון וקיבל ציווי אחר", "ar": "رفض نوح الأمر الأول فتلقّى أمرًا آخر", "ru": "Ной отказался от первого повеления и получил другое", "en": "Noah refused the first command and got another"}, {"he": "הבהמות הטהורות נשארו מחוץ לתיבה", "ar": "البهائم الطاهرة بقيت خارج الفلك", "ru": "Чистые животные остались вне ковчега", "en": "The clean animals stayed outside the ark"}, {"he": "הנוספות משמשות לקרבן של נח אחרי המבול", "ar": "البهائم الطاهرة الإضافية يستخدمها نوح للقربان بعد الطوفان", "ru": "Лишние чистые животные нужны Ною для жертвы после потопа", "en": "The extra clean animals serve Noah's offering after the Flood"}],3,{"he": "חפשו מה נח עושה מיד כשהוא יוצא מן התיבה.", "ar": "ابحثوا عمّا يفعله نوح فور خروجه من الفلك.", "ru": "Найдите, что Ной делает сразу после выхода из ковчега.", "en": "Look at what Noah does right after leaving the ark."},{"he": "בבראשית ח׳ נח בונה מזבח ומקריב עולות מן הבהמה הטהורה ומן העוף הטהור. לכן אפשר לקרוא את הפירוט בפרק ז׳ כהכנה לקרבן. יש גם קוראים שרואים בו סימן לשני מקורות.", "ar": "في التكوين 8 يبني نوح مذبحًا ويقدّم محرقات من البهائم والطيور الطاهرة. لذلك يمكن قراءة تفصيل الفصل 7 تمهيدًا للقربان. وبعض القرّاء يرون فيه علامة على مصدرين.", "ru": "В Бытии 8 Ной строит жертвенник и приносит всесожжения от чистого скота и птиц. Поэтому деталь из главы 7 можно читать как подготовку к жертве. Некоторые читатели видят в ней след двух источников.", "en": "In Genesis 8 Noah builds an altar and offers clean animals and birds. So the detail in chapter 7 can be read as preparing for the offering. Some readers see it as a sign of two sources."},null,[{"he": "יש הבדל במספר: שניים מול שבעה שבעה.", "ar": "هناك فرق في العدد: اثنان مقابل سبعة سبعة.", "ru": "Разница в числе есть: по паре против семи пар.", "en": "There is a difference in number: two versus seven pairs."}, {"he": "נח אינו מסרב. נאמר שהוא עשה ככל אשר ציווה.", "ar": "نوح لم يرفض، بل قيل إنه فعل كل ما أُمر به.", "ru": "Ной не отказывался: сказано, что он сделал всё, как велено.", "en": "Noah does not refuse; it says he did all he was commanded."}, {"he": "הטהורות נכנסות לתיבה, ובמספר גדול יותר.", "ar": "البهائم الطاهرة دخلت الفلك، وبعدد أكبر.", "ru": "Чистые животные входят в ковчег, и в большем числе.", "en": "The clean animals enter the ark, and in greater numbers."}, null])]]);
