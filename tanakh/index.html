<style>
/* ============================================================
   תנ״ך — תנ״ך לבגרות
   קהל היעד לא "לא יודע אזרחות". הוא נכשל בה שוב ושוב, מפני
   שהמקצוע כולו טקסט ומושגים — ולכן כל החלטה כאן נמדדת בשאלה
   אחת: האם היא מורידה עומס, או מוסיפה.
   · כל שאלה נושאת רמז שאינו התשובה, והסבר שנפתח גם כשצדקו.
   · שום טקסט לא מוצג בלי שאפשר לשמוע אותו.
   · שפת האם אינה קישוט: מושג באזרחות נלמד קודם בשפה שחושבים בה.
   כל המידות ב-rem, כדי שהגדלת טקסט תגדיל את הכול יחד.
   ============================================================ */
:root{
  --font:"Heebo","Rubik",system-ui,"Segoe UI",Arial,sans-serif;
  --en:"Lexend","Heebo",system-ui,"Segoe UI",Arial,sans-serif;
  --ar:"Noto Sans Arabic",system-ui,"Segoe UI",Arial,sans-serif;
  --ru:"Noto Sans","Heebo",system-ui,"Segoe UI",Arial,sans-serif;   /* קירילית — Heebo אינו מכיל אותה */
  --bg:#f5f7fb; --surface:#ffffff; --surface2:#e8ecf6;
  --ink:#101828; --muted:#55607a; --faint:#6f7a95; --line:#dde3f0;
  --accent:#1d4ed8; --accent-ink:#ffffff; --accent-soft:#dbe4fe;
  --gold:#a16207; --gold-soft:#fbf0d5; --hit:#f5c451; --hit-ink:#1a1300;
  --ok:#15803d; --ok-soft:#dcfce7; --bad:#be123c; --bad-soft:#ffe4e9;
  --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px -12px rgba(16,24,40,.2);
  --r:14px;
  /* צבע לכל מסלול. לא קישוט: ארבעה סוגי לימוד שונים לגמרי, וצבע
     קבוע לכל אחד חוסך למי שמתקשה להתמצא את השאלה "איפה אני". */
  --c-sound:#0369a1; --cs-sound:#dbeefc;   /* צליל ואות   */
  --c-words:#15803d; --cs-words:#dcfce7;   /* מילים       */
  --c-talk:#b43a0a;  --cs-talk:#fde5d8;    /* מדוברת — #c2410c היה 4.28:1 על ה-cs (30.9) */
  --c-read:#6d28d9;  --cs-read:#eae2fd;    /* ספרותית     */
}
:root[data-theme="dark"]{
  --bg:#0e1425; --surface:#17203a; --surface2:#202c4d;
  --ink:#e8edf8; --muted:#9aa5c0; --faint:#78829e; --line:#2a3762;
  --accent:#93c5fd; --accent-ink:#0e1425; --accent-soft:#1b2a5c;
  --gold:#fbbf24; --gold-soft:#33270f; --hit:#ffd24d; --hit-ink:#241a00;
  --ok:#4ade80; --ok-soft:#132a1c; --bad:#fb7185; --bad-soft:#33161f;
  --warn:#fbbf24; --warn-soft:#33260f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  --c-sound:#7dd3fc; --cs-sound:#0b2a3d;
  --c-words:#86efac; --cs-words:#0f2a1a;
  --c-talk:#fdba74;  --cs-talk:#3a2113;
  --c-read:#c4b5fd;  --cs-read:#261a45;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1425; --surface:#17203a; --surface2:#202c4d;
    --ink:#e8edf8; --muted:#9aa5c0; --faint:#78829e; --line:#2a3762;
    --accent:#93c5fd; --accent-ink:#0e1425; --accent-soft:#1b2a5c;
    --gold:#fbbf24; --gold-soft:#33270f; --hit:#ffd24d; --hit-ink:#241a00;
    --ok:#4ade80; --ok-soft:#132a1c; --bad:#fb7185; --bad-soft:#33161f;
    --warn:#fbbf24; --warn-soft:#33260f;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
    --c-sound:#7dd3fc; --cs-sound:#0b2a3d;
    --c-words:#86efac; --cs-words:#0f2a1a;
    --c-talk:#fdba74;  --cs-talk:#3a2113;
    --c-read:#c4b5fd;  --cs-read:#261a45;
  }
}
/* ניגודיות גבוהה — שחור על לבן, מסגרות מלאות, בלי גוונים רכים */
:root.hc{
  --bg:#ffffff; --surface:#ffffff; --surface2:#ffffff;
  --ink:#000000; --muted:#1a1a1a; --faint:#333333; --line:#000000;
  --accent:#00434b; --accent-ink:#ffffff; --accent-soft:#e6f2f3;
  --gold:#5c3d00; --gold-soft:#f7efdf; --hit:#ffe600; --hit-ink:#000000;
  --ok:#0a5c2a; --ok-soft:#e6f4ea; --bad:#8c0f2c; --bad-soft:#fbe9ed;
  --warn:#6b3d00; --warn-soft:#f7efdf; --shadow:none;
  --c-sound:#00305c; --cs-sound:#e8eef7;
  --c-words:#0a5c2a; --cs-words:#e6f4ea;
  --c-talk:#7a2c00;  --cs-talk:#f9ece4;
  --c-read:#3d1a75;  --cs-read:#eee8f9;
}
:root.hc *{box-shadow:none!important}
:root.hc .card,:root.hc .btn,:root.hc .opt{border-width:2px!important}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs,17px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  font-size:1rem;line-height:1.65;-webkit-text-size-adjust:100%}
:root.clear body{font-family:"Verdana","Tahoma","Heebo",sans-serif;letter-spacing:.012em}
:root.spaced body{word-spacing:.22em;line-height:1.95}
:root.rm *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
h1,h2,h3{margin:0;line-height:1.3;font-weight:800}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}
/* כרטיס ״מבנה הבגרות״ (--gold-soft): הקישור לאתר משרד החינוך בלי צבע נפל לכחול ברירת המחדל — 1.55:1 בכהה (30.9) */
.gcard a{color:var(--accent)}
.skip{position:absolute;inset-inline-start:-9999px}
.skip:focus{position:static;display:inline-flex;align-items:center;min-height:44px;
  margin:8px;padding:8px 14px;background:#0b7c71;color:#fff;
  border-radius:8px;font-weight:700;text-decoration:none;z-index:100}

/* כל טקסט אנגלי — כיוון, גופן ומרווח משלו. unicode-bidi:isolate מונע
   מהמשפט האנגלי לגרור אחריו את סימני הפיסוק של המשפט העברי. */
.en{font-family:var(--en);direction:ltr;unicode-bidi:isolate;text-align:start}
.en-b{font-family:var(--en);direction:ltr;unicode-bidi:isolate;display:inline-block}

.wrap{max-width:56rem;margin:0 auto;padding:0 clamp(.9rem,3vw,1.5rem)}
.hbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-block:.6rem}
:root.hc .hbar{background:var(--bg);backdrop-filter:none}
.hrow{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
.brand{font-size:1.35rem;font-weight:800;letter-spacing:-.01em;display:flex;
  align-items:baseline;gap:.5rem;margin-inline-end:auto}
.brand small{font-size:.72rem;font-weight:600;color:var(--muted);letter-spacing:.06em}
.gbtn{display:inline-flex;align-items:center;gap:.4rem;background:var(--surface);
  border:1px solid var(--line);border-radius:999px;padding:.42rem .8rem;cursor:pointer;
  font-size:.86rem;font-weight:600;box-shadow:var(--shadow);min-height:44px}
.gbtn:hover{border-color:var(--accent)}
.gbtn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:1.1rem}
.grid{display:grid;gap:.85rem}
@media(min-width:640px){.g2{grid-template-columns:1fr 1fr}}
@media(min-width:900px){.g3{grid-template-columns:repeat(3,1fr)}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;
  border:1px solid var(--line);background:var(--surface);border-radius:12px;
  padding:.72rem 1.1rem;font-weight:700;cursor:pointer;box-shadow:var(--shadow);
  min-height:2.9rem;font-size:1rem}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;box-shadow:none}
.btn[disabled]{opacity:.45;cursor:default}
.btn.wide{width:100%}

.chip{display:inline-flex;align-items:center;gap:.35rem;border-radius:999px;
  padding:.22rem .6rem;font-size:.78rem;font-weight:700;background:var(--surface2);color:var(--muted)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}

/* גופני שפה: Heebo אינו מכיל ערבית וקירילית, ולכן שפת הממשק
   מחליפה גופן ולא רק כיוון. */
html[lang="ar"] body,html[lang="ar"] input,html[lang="ar"] button,
html[lang="ar"] textarea,html[lang="ar"] select{font-family:var(--ar)}
html[lang="ru"] body,html[lang="ru"] input,html[lang="ru"] button,
html[lang="ru"] textarea,html[lang="ru"] select{font-family:var(--ru)}
button[data-a="lang"][lang="ar"]{font-family:var(--ar)}
button[data-a="lang"][lang="ru"]{font-family:var(--ru)}

/* ===== מסלולים: הצבע נכנס ככרטיס, לא כרקע של טקסט ===== */
.trk{--c:var(--accent);--cs:var(--accent-soft)}
.t-sound{--c:var(--c-sound);--cs:var(--cs-sound)}
.t-words{--c:var(--c-words);--cs:var(--cs-words)}
.t-talk{--c:var(--c-talk); --cs:var(--cs-talk)}
.t-read{--c:var(--c-read); --cs:var(--cs-read)}
.tcard{border-inline-start:5px solid var(--c);cursor:pointer;text-align:start;width:100%;
  display:flex;flex-direction:column;gap:.4rem;align-items:stretch}
.tcard:hover{border-color:var(--c)}
.tcard h3{font-size:1.05rem}
.tcard .sub{font-size:.85rem;color:var(--muted)}
.tdot{width:.62rem;height:.62rem;border-radius:50%;background:var(--c);flex:none}
.thead{display:flex;align-items:center;gap:.5rem}
.tpill{background:var(--cs);color:var(--c);border-radius:999px;padding:.15rem .55rem;
  font-size:.72rem;font-weight:800}

/* ===== סרגל שליטה ברמות ===== */
.lvls{display:flex;gap:.4rem;flex-wrap:wrap}
.lvl{border:1px solid var(--line);background:var(--surface);border-radius:10px;
  padding:.4rem .7rem;font-size:.82rem;font-weight:700;cursor:pointer;
  display:inline-flex;align-items:center;gap:.4rem}
.lvl.on{background:var(--c,var(--accent));color:var(--accent-ink);border-color:var(--c,var(--accent))}
.bar{height:.42rem;border-radius:999px;background:var(--surface2);overflow:hidden;flex:1;min-width:3rem}
.bar i{display:block;height:100%;background:var(--c,var(--accent))}
.bar.b0 i{background:var(--bad)} .bar.b1 i{background:var(--warn)} .bar.b2 i{background:var(--ok)}

/* ===== תרגול ===== */
.qcard{border-top:5px solid var(--c,var(--accent))}
.qtop{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.7rem}
.qtext{font-size:1.12rem;font-weight:600;margin:.2rem 0 .3rem}
.qhint{color:var(--muted);font-size:.9rem}
/* המילה או המשפט שנלמדים. גדול, מרווח, ותמיד לצד כפתור השמעה. */
.subject{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;
  background:var(--surface2);border-radius:12px;padding:.85rem 1rem;margin:.5rem 0}
.subject .word{font-family:var(--en);direction:ltr;unicode-bidi:isolate;
  font-size:1.7rem;font-weight:700;letter-spacing:.01em;line-height:1.25}
.subject .ipa{font-family:var(--en);direction:ltr;unicode-bidi:isolate;
  color:var(--muted);font-size:.95rem}
.spk{border:1px solid var(--line);background:var(--surface);border-radius:999px;
  width:2.7rem;height:2.7rem;display:inline-flex;align-items:center;justify-content:center;
  cursor:pointer;flex:none;box-shadow:var(--shadow)}
.spk:hover{border-color:var(--accent);color:var(--accent)}
.spk.sm{width:2.1rem;height:2.1rem;background:#0b7c71;border-color:#0b7c71;color:#fff}
/* הרמקול הקטן — אותו ירוק של כפתור ההקראה הגדול, התקן המשותף */
.spk.sm:hover{background:#0b7c71;border-color:#0b7c71;color:#fff}
.spk.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.opts{display:grid;gap:.6rem;margin-top:.9rem}
.orow{display:flex;gap:.45rem;align-items:center;min-width:0}
/* min-width:0 — פריט grid נולד עם min-width:auto, ולכן משפט ארוך
   באפשרות היה מרחיב את השורה מעבר למכל ודוחף את הרמקול מחוץ למסך. */
.orow .opt{flex:1;min-width:0}
@media(min-width:560px){.opts.two{grid-template-columns:1fr 1fr}}
.opt{display:flex;align-items:center;gap:.6rem;text-align:start;width:100%;
  border:2px solid var(--line);background:var(--surface);border-radius:12px;
  padding:.8rem .9rem;cursor:pointer;font-size:1.02rem;font-weight:600;min-height:3.1rem}
.opt:hover{border-color:var(--accent)}
.opt .k{width:1.9rem;height:1.9rem;border-radius:8px;background:var(--surface2);
  display:inline-flex;align-items:center;justify-content:center;font-size:.85rem;
  font-weight:800;color:var(--muted);flex:none}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .k{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .k{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.55}
/* בחירה במבחן היא בחירה, לא תשובה נכונה. במסכי התרגול הצבע
   הירוק אומר "צדקת", ובמבחן אסור לו להופיע כלל — הוא נותן
   משוב שגוי לכל בחירה. ניטרלי, ורק מסמן מה סומן. */
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);margin-inline-start:3px}
.dot.ok{background:var(--ok);border-color:var(--ok)}
.dot.no{background:var(--bad);border-color:var(--bad)}
.dot.flag{box-shadow:0 0 0 2px var(--accent)}

/* אריחי בניית משפט. הסדר הוא התרגיל, ולכן האריח חייב להיראות כמשהו
   שאפשר להרים — מסגרת מלאה ורקע משלו, לא טקסט על רקע הכרטיס. */
.tiles{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:.7rem}
.tile{font-family:var(--en);direction:ltr;border:2px solid var(--line);
  background:var(--surface);border-radius:10px;padding:.5rem .8rem;font-weight:600;
  cursor:pointer;font-size:1.02rem;min-height:2.7rem}
.tile:hover{border-color:var(--accent)}
.slot{min-height:3.2rem;border:2px dashed var(--line);border-radius:12px;
  background:var(--surface2);padding:.5rem;display:flex;flex-wrap:wrap;gap:.45rem;
  align-items:center;direction:ltr}
.slot.ok{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.slot.bad{border-style:solid;border-color:var(--bad);background:var(--bad-soft)}
.slot .tile{background:var(--surface)}

/* ===== משוב ===== */
.fb{margin-top:.9rem;border-radius:12px;padding:.85rem 1rem;border:1px solid transparent}
.fb.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.fb.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.fb b{display:block;font-size:1.02rem;margin-bottom:.2rem}
.fb .body{color:var(--ink);font-weight:500;font-size:.95rem}
.why{margin-top:.55rem;padding-top:.55rem;border-top:1px dashed currentColor;color:var(--ink);
  font-weight:500;font-size:.93rem}

/* ===== קטע קריאה ===== */
/* איור בתוך כרטיס שאלה. הצבע יורש מ-color, ולכן אותו SVG נראה
   נכון גם בערכה הבהירה וגם בכהה בלי גרסה שנייה. */
.figure{margin:.7rem 0;padding:.6rem;border:1px solid var(--line);border-radius:12px;
  background:var(--surface2);color:var(--ink);overflow-x:auto}
.figure svg{display:block;max-width:100%}
/* המבחן המדומה: השאלות זו אחר זו, כמו חוברת בחינה. */
.simq{border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;margin:.8rem 0;
  background:var(--surface)}
.simq.miss{border-color:var(--warn)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.simn{font-weight:800;color:var(--muted);font-size:.86rem}
.simbar{position:sticky;top:0;z-index:5;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:.6rem .8rem;margin:.8rem 0;display:flex;gap:.6rem;
  align-items:center;flex-wrap:wrap;box-shadow:var(--shadow)}
.clock{font-weight:800;font-variant-numeric:tabular-nums;font-size:1.1rem}
.clock.low{color:var(--bad)}
.passage{background:var(--surface2);border-radius:12px;padding:1rem 1.1rem;margin:.6rem 0;
  font-family:var(--en);direction:ltr;unicode-bidi:isolate;font-size:1.08rem;line-height:2}
.passage .s{border-radius:5px;padding:.05em .12em;cursor:pointer}
.passage .s:hover{background:var(--accent-soft)}
.passage .s.now{background:var(--accent-soft);box-shadow:0 2px 0 var(--accent)}
.wd{border-radius:5px;padding:1px 3px}
.wd.hit{background:var(--hit);color:var(--hit-ink);font-weight:600}
/* כשמנוע הדיבור אינו מדווח על גבולות מילים — קורה הרבה בעברית
   באנדרואיד — אין מה להדגיש מילה־מילה, ואז מודגש כל האיבר. הכלל
   שקיים כאן מכוון למשפט בתוך קטע קריאה בלבד, ולכן ההדגשה החלופית
   על איבר אחר לא נראתה כלל. */
.wd.now,p.now,div.now,span.now,b.now{background:var(--hit);color:var(--hit-ink);
  border-radius:8px;box-shadow:0 0 0 4px var(--hit)}
.gloss{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.5rem}
.gword{border:1px solid var(--line);background:var(--surface);border-radius:999px;
  padding:.25rem .6rem;font-size:.85rem;cursor:pointer}
.gword b{font-family:var(--en);direction:ltr;unicode-bidi:isolate}

/* ===== סרגל מצב הקול ===== */
.vstrip{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;border-radius:10px;
  padding:.45rem .7rem;font-size:.85rem;font-weight:600;margin-bottom:.7rem}
.vstrip.ok{background:var(--ok-soft);color:var(--ok)}
.vstrip.warn{background:var(--warn-soft);color:var(--warn)}
.vstrip.bad{background:var(--bad-soft);color:var(--bad)}
.vstrip .btn{padding:.3rem .7rem;min-height:44px;font-size:.82rem}  /* 2.1rem היו 36 פיקסלים — מתחת ליעד המגע */

/* ===== הגדרות ===== */
.row{display:flex;align-items:center;justify-content:space-between;gap:.8rem;
  padding:.7rem 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row:last-child{border-bottom:0}
.row .lab{font-weight:700}
.row .desc{font-size:.85rem;color:var(--muted);font-weight:500}
.sw{width:3.2rem;height:1.8rem;border-radius:999px;background:var(--surface2);
  border:1px solid var(--line);position:relative;cursor:pointer;flex:none}
.sw i{position:absolute;top:.18rem;inset-inline-start:.2rem;width:1.3rem;height:1.3rem;
  border-radius:50%;background:var(--faint);transition:.15s}
.sw.on{background:var(--accent);border-color:var(--accent)}
.sw.on i{inset-inline-start:1.5rem;background:#fff}
.vgrid{display:grid;gap:.5rem;grid-template-columns:1fr}
@media(min-width:560px){.vgrid{grid-template-columns:1fr 1fr}}
.vopt{display:flex;align-items:center;gap:.6rem;border:2px solid var(--line);
  background:var(--surface);border-radius:12px;padding:.6rem .75rem;cursor:pointer;text-align:start}
.vopt.on{border-color:var(--accent);background:var(--accent-soft)}
.vopt .nm{font-weight:700}
.vopt .ds{font-size:.8rem;color:var(--muted)}
input[type=password],input[type=text]{font:inherit;background:var(--surface);color:var(--ink);
  border:1px solid var(--line);border-radius:10px;padding:.6rem .7rem;min-width:0;flex:1;
  direction:ltr;text-align:left}
input[type=range]{width:100%;accent-color:var(--accent)}

.fbar{border-top:1px solid var(--line);margin-top:2rem;padding-block:1rem;
  color:var(--muted);font-size:.82rem}   /* --faint יצא 2.96:1 */
.hidden{display:none!important}

/* ---------- שדה קלט של המבחן ----------
   מודול המבחן הועתק לכאן מאפליקציה שבה .field כבר היה מוגדר.
   בלי הכלל הזה שדה השם של הנבחן נשאר תיבת ברירת המחדל של
   הדפדפן — 21 פיקסלים גובה, הרבה מתחת ליעד המגע של 44. */
.field{width:100%;box-sizing:border-box;font:inherit;font-size:1rem;
  min-height:48px;padding:12px 14px;border-radius:11px;outline:none;background:var(--surface2);color:inherit;border:1px solid var(--line)}
.field:focus{border-color:var(--accent)}
textarea.field{min-height:96px;resize:vertical}

/* ---------- שורות המבחן ----------
   .tog הגיע ממודול המבחן שהועתק לכאן, ולא היה לו עיצוב כלל: השם
   והמידע שמתחתיו נדבקו לשורה אחת בלי רווח. */
.tog{display:flex;align-items:center;gap:13px;width:100%;text-align:start;
  background:var(--surface2);border:1px solid transparent;border-radius:12px;
  padding:13px 15px;min-width:0}
.tog:hover{border-color:var(--line)}
.tog+.tog{margin-top:9px}
.tog .tt{flex:1;min-width:0}
.tog .tt b{display:block;font-size:.97rem;overflow-wrap:anywhere}
.tog .tt span{display:block;color:var(--muted);font-size:.85rem;overflow-wrap:anywhere;margin-top:2px}

/* יעד מגע לקישור התחתית. קישור טקסט בשורה יוצא בגובה הטקסט —
   15 פיקסלים — וזה קטן מדי לאצבע, גם כשהוא רק לתנאי השימוש. */
.lg-foot a{display:inline-flex;align-items:center;min-height:44px;padding-inline:6px}

/* ---------- יעדי מגע ----------
   .lvl יצא 39 פיקסלים ומתג ה-.sw רק 31, שניהם מתחת ל-44 שהפרויקט
   מחייב את עצמו בהם. במתג לא מגדילים את המסילה — היא תיראה מגושמת —
   אלא מרחיבים את שטח הלחיצה סביבה. */
.lvl{min-height:44px}
.sw{position:relative}
.sw::after{content:"";position:absolute;inset-block:-7px;inset-inline:-4px}

/* ---------- מסך בניית המבחן ----------
   .seg ו-.tpc הגיעו עם מודול המבחן שהועתק לכאן, ולא היה להם עיצוב:
   כפתורי הבחירה יצאו 34 פיקסלים, וכרטיסי הנושאים 6 פיקסלים בלבד —
   כלומר המורה לא יכול היה לבחור נושאים בכלל. */
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 auto;min-width:0;min-height:44px;border:1px solid var(--line);
  background:var(--surface);border-radius:10px;padding:10px 12px;font:inherit;
  font-weight:600;font-size:.9rem;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.tpc{position:relative;display:flex;flex-direction:column;gap:9px;text-align:start;
  background:var(--surface);border:1px solid var(--line);
  border-inline-start:4px solid var(--c,var(--accent));border-radius:12px;padding:14px;
  box-shadow:var(--shadow);min-width:0;min-height:44px;cursor:pointer;font:inherit;color:inherit}
.tpc.on{border-color:var(--accent);background:var(--accent-soft)}
.tpc .tn{font-weight:700;font-size:.98rem;overflow-wrap:anywhere;color:var(--c,var(--ink))}
.tpc .td{color:var(--muted);font-size:.8rem;overflow-wrap:anywhere}

/* טקסט על רקע ההדגשה: --accent-ink ולא לבן קבוע. במצב כהה
   ההדגשה בהירה, ולבן עליה יצא 1.5–2.0:1 — כמעט בלתי קריא. */
/* ---------- מצב מורה ---------- */
.te-wrap{position:fixed;inset:0;z-index:2147482500;background:rgba(8,12,20,.72);
  display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto;
  font-family:system-ui,"Heebo","Rubik",Arial,sans-serif}
.te-box{background:#fff;color:#111827;max-width:26rem;width:100%;border-radius:18px;
  box-shadow:0 24px 70px -20px rgba(0,0,0,.6);padding:clamp(18px,4vw,26px);
  max-height:92vh;overflow-y:auto;font-size:16px;line-height:1.6}
.te-box h2{margin:0 0 6px;font-size:1.35rem;font-weight:800;line-height:1.25}
.te-lead{margin:0 0 10px;color:#374151}
.te-warn{margin:0 0 12px;font-size:.88rem;color:#7c2d12;background:#fef3c7;
  border-radius:10px;padding:9px 11px}
.te-lab{display:block;margin:10px 0 4px;font-weight:700;font-size:.92rem}
.te-in{width:100%;box-sizing:border-box;font:inherit;letter-spacing:.3em;
  border:1px solid #d1d5db;border-radius:11px;padding:.7rem .8rem;min-height:48px;
  background:#fff;color:#111827}
.te-in:focus-visible{outline:3px solid #2563eb;outline-offset:1px}
.te-chk{display:flex;align-items:center;gap:.5rem;margin-top:14px;min-height:44px;
  font-size:.94rem;cursor:pointer}
.te-chk input{width:20px;height:20px}
.te-note{margin:2px 0 0;font-size:.82rem;color:#6b7280}
.te-msg{margin:10px 0 0;font-size:.92rem;font-weight:700;color:#7f1d1d;
  background:#fee2e2;border-radius:10px;padding:9px 11px}
.te-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.te-btn{font:inherit;font-weight:700;border-radius:12px;padding:.75rem 1.2rem;
  cursor:pointer;border:1px solid #d1d5db;background:#fff;color:#111827;min-height:48px}
.te-btn.pri{background:#111827;color:#fff;border-color:#111827;flex:1 1 9rem}
.te-btn.pri[disabled]{opacity:.5;cursor:default}
.te-btn.link{border:0;background:none;text-decoration:underline;padding:.6rem .2rem;
  color:#374151;margin-top:8px;min-height:44px}
.te-btn:focus-visible{outline:3px solid #2563eb;outline-offset:2px}
@media (prefers-color-scheme:dark){
  .te-box{background:#141a24;color:#e8ecf4}
  .te-lead,.te-note{color:#b9c2d4}
  .te-warn{background:#3a2a10;color:#fcd9a5}
  .te-in{background:#1d2531;color:#e8ecf4;border-color:#2c3648}
  .te-msg{background:#4a1717;color:#ffd7d7}
  .te-btn{background:#1d2531;color:#e8ecf4;border-color:#2c3648}
  .te-btn.pri{background:#e8ecf4;color:#141a24;border-color:#e8ecf4}
  .te-btn.link{color:#b9c2d4}
}

/* ---------- רשימת השאלות במסך בניית המבחן ---------- */
.xq-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.xq{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface2)}
.xq-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.xq-n{flex:0 0 auto;min-width:27px;height:27px;border-radius:8px;display:inline-flex;
  align-items:center;justify-content:center;font-weight:800;font-size:.85rem;background:var(--line)}
.xq-tp{font-weight:700;font-size:.88rem;color:var(--muted);overflow-wrap:anywhere}
.xq-acts{margin-inline-start:auto;display:flex;gap:6px;flex-wrap:wrap}
/* 44 פיקסלים גם כאן. כפתור קטן בתוך רשימה ארוכה הוא בדיוק
   הכפתור שנהג מבוגר או ילד עם ADHD לא מצליח לפגוע בו. */
.xq-b{padding:8px 13px;font-size:.88rem;font-weight:700;border-radius:10px;min-height:44px;
  border:1px solid var(--line);background:transparent;color:inherit;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:inherit}
.xq-b:hover{background:var(--line)}
.xq-b[aria-pressed="true"]{background:var(--line)}
.xq-q{margin-top:8px;line-height:1.5;overflow-wrap:anywhere}
.xq-e{margin-top:5px;font-weight:700;overflow-wrap:anywhere}
.xq-a{margin-top:7px;font-size:.92rem;color:var(--ok);overflow-wrap:anywhere}
.xq-add{margin-top:12px;gap:8px}
.xq-add .sub{margin:0}
/* שאלת מקור נושאת קטע שלם. בלי תקרה הוא דוחף את שאר הרשימה
   אל מחוץ למסך. */
.xq .passage{max-height:11rem;overflow:auto}
.hlang{display:flex;gap:4px;flex:none;align-items:center;flex-wrap:wrap}
.hlang button{border:1px solid #d4dbe7;background:transparent;color:inherit;border-radius:10px;padding:3px 9px;font:inherit;font-size:.82rem;cursor:pointer;min-height:36px}
.hlang button.on{border-color:#2f5fd8;color:#fff;background:#2f5fd8;font-weight:700}
@keyframes calmGlow{0%{box-shadow:0 0 0 0 rgba(180,140,40,0)}35%{box-shadow:0 0 26px 6px rgba(180,140,40,.45)}100%{box-shadow:0 0 0 0 rgba(180,140,40,0)}}
.card.calm-glow{animation:calmGlow 2.6s ease-out 1}
.calm-praise{text-align:center;font-weight:600;color:#7c5e10;margin:16px 0 0}
@media (prefers-reduced-motion:reduce){.card.calm-glow{animation:none}}

/* ---------- יעדי מגע ≥44px — 1.10.2026 ----------
   נמדד בדפדפן ב-390px וב-360px, בדף הפתיחה ובשני צעדי לחיצה ממנו.
   הבלוק אחרון ב-style כדי לגבור על ההגדרות שמעליו. מגדילים בריפוד
   ובגובה מינימלי, לא בגובה קשיח — ערבית ורוסית ארוכות יותר. */
.hlang button{min-height:44px;padding-block:6px}
input[type=range]{min-height:44px}
.spk.sm{min-width:44px;min-height:44px}
.lvl{min-width:44px}

/* ---------- קישור בתוך טקסט — אזור נגיעה ≥44px · 2.10.2026 (O-110) ----------
   שני מקרים, ונמדדו שניהם ב-390px וב-360px:
   - קישור בתוך שורת טקסט רצה: ריפוד אנכי בלבד. ב-inline הוא מגדיל את
     אזור הנגיעה ואינו נכנס לגובה השורה — אף אלמנט לא זז.
   - קישורים זה מתחת לזה (<br>), וקישור בתוך פס ההקראה הקבוע: שם הריפוד
     חרג מהשורה וכיסה את הקישור או הכפתור שלידו, ולכן inline-flex
     בגובה 44 — כמו `.lg-foot a`. השורה גדלה, ואין חפיפה.
   לא `a` כללי: `.lg-foot a` ודומיו כבר 44px בבנייה אחרת. */
#tts-fail a,a[href*="education.gov.il"]{display:inline-flex;align-items:center;min-height:44px}
</style>

.spk:not(.sm){border-radius:12px;background:#0b7c71;border-color:#0b7c71;color:#fff;font-weight:700;min-height:46px;width:auto;height:auto;padding:8px 18px;font-size:1.02rem;gap:.4rem}

   ״הכפתורים רמז הקראה וכו קטנים יש להסיף צבע״). ירוק הקראה, אדום עצירה,

.btn[data-a="guide"]:hover{background:#1e40af!important;color:#fff!important}
.btn[data-a="rule"]{background:#334155!important;border-color:#1e293b!important;color:#fff!important;font-weight:700;min-height:46px;padding:10px 16px!important;font-size:1rem!important}
.btn[data-a="rule"]:hover{background:#1e293b!important;color:#fff!important}
/* רמקול לכל תשובה — מי שקורא בקושי בוחר באוזן (אותו תקן של history) */
.opts .orow{display:flex;gap:6px;align-items:stretch}
.opts .orow .opt{flex:1 1 auto}
.optspk{flex:0 0 auto;min-width:46px;min-height:46px;border:2px solid #0b7c71;border-radius:12px;background:#0b7c71;color:#fff;font:inherit;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:8px 10px}
.optspk:hover{background:#0b7c71}

/* ============================================================
   מצב הדגמה — נכנס אך ורק דרך ?demo=1 בכתובת.
   ------------------------------------------------------------
   התסריט הוא נתון, לא קוד שפזור במסכים: כל פריט אומר מה נכתב
   בכתוביות (subtitle), מה נעשה על המסך (action) וכמה זמן הצופה
   נשאר עם המסך הזה (duration, באלפיות שנייה).

   ההדגמה מפעילה את האפליקציה האמיתית — היא לוחצת על אותם
   כפתורים שהמשתמש לוחץ עליהם. אין כאן מסך מזויף ואין תוכן
   שנכתב במיוחד להדגמה, ולכן היא גם לא יכולה להראות משהו
   שהאפליקציה לא באמת עושה.

   בלי ?demo=1 שום שורה כאן אינה רצה: המשתנים מוגדרים ונשארים
   בלי שימוש, לא נרשם אף מאזין אירועים, ולא נוסף דבר למסך.
   ============================================================ */
var DEMO_ON=/(^|[?&])demo=1(&|$)/.test(location.search||"");

/* בוחר אפשרות לפי נכונותה. התסריט לא מקודד תשובה: הוא שואל את
   השאלה שעל המסך עכשיו, ולכן הוא עובד גם כשההגרלה שינתה אותה. */
/* כאן לכל שאלה יש כפתור השמעה, ולכן אין צורך להגריל שאלה אחרת
   כדי למצוא אחד. הלולאה נשארה כרשת ביטחון בלבד. */
function demoHear(){

    try{newQuestion()}catch(e){break}
  }
  return demoTap('[data-a="say"]');
}
function demoPick(right){
  var q=(typeof P!=="undefined")?P.q:null;

var DEMO={on:false,i:0,timer:null,extra:[],bar:null,txt:null,step:null,fill:null,btn:null};

/* עוזרים לתסריט. כולם מחזירים false כשהאיבר אינו על המסך, כדי
   שצעד שלא מצא את מה שחיפש ידלג ולא יפיל את ההדגמה כולה. */
function demoEl(s){return typeof s==="string"?document.querySelector(s):s}
function demoShow(s){
  var e=demoEl(s); if(!e)return false;
  try{e.scrollIntoView({behavior:"smooth",block:"center"})}catch(err){try{e.scrollIntoView()}catch(err2){}}
  return true;
}
/* מדגיש את האיבר, ורק אז לוחץ — צופה שלא ראה לאן נלחץ לא הבין
   מה קרה. לכן אין צעד קצר מ-1200 אלפיות בתסריטים. */
function demoTap(s){
  var e=demoEl(s); if(!e||e.disabled)return false;
  demoShow(e);
  e.classList.add("demo-tap");
  DEMO.extra.push(setTimeout(function(){
    e.classList.remove("demo-tap");
    /* המסך מצטייר מחדש כל הזמן. אם האיבר שסומן כבר אינו במסמך,
       מחפשים אותו שוב לפי אותו בורר — לחיצה על איבר מת אינה
       עושה דבר, וזה בדיוק צעד שנראה כאילו נתקע. */
    var live=(typeof s==="string"&&!document.contains(e))?demoEl(s):e;
    if(DEMO.on&&live&&!live.disabled&&document.contains(live))try{live.click()}catch(err){}
  },430));
  return true;
}
function demoClick(s){
  var e=demoEl(s); if(!e||e.disabled)return false;
  try{e.click()}catch(err){return false}
  return true;
}
/* הקלדה אות אחר אות, עם אירוע input אמיתי — שדה חיפוש שמאזין
   ל-input לא היה מגיב להשמה ישירה ל-value. */
function demoType(s,text){
  var e=demoEl(s); if(!e)return false;
  demoShow(e); try{e.focus()}catch(err){}
  e.value=""; var i=0;
  var t=setInterval(function(){
    if(!DEMO.on||!e.parentNode){clearInterval(t);return}
    e.value=String(text).slice(0,++i);
    e.dispatchEvent(new Event("input",{bubbles:true}));
    if(i>=String(text).length)clearInterval(t);
  },85);
  DEMO.extra.push(t);
  return true;
}
function demoQuiet(){
  try{if(window.speechSynthesis)speechSynthesis.cancel()}catch(e){}
  try{if(typeof stopSpeak==="function")stopSpeak()}catch(e){}
}

  DEMO.step=document.getElementById("demo-step");

/* ESC יוצא. הקשבה בשלב הלכידה, כדי שמסך שכבר מטפל ב-Escape
   לא יבלע את המקש לפני שההדגמה ראתה אותו. */
function demoKey(e){
  if(!DEMO.on)return;
  if(e.key==="Escape"||e.keyCode===27){
    e.preventDefault(); e.stopPropagation();
    demoStop();
  }
}

function demoStart(){
  if(DEMO.on)return;
  DEMO.on=true; DEMO.i=0;
  DEMO.btn.hidden=true; DEMO.bar.hidden=false;
  document.documentElement.classList.add("demo-running");
  demoNext();
}

function demoNext(){
  if(!DEMO.on)return;
  if(DEMO.i>=DEMO_SCRIPT.length){demoStop();return}
  var it=DEMO_SCRIPT[DEMO.i++]||{};
  var d=Math.max(600,it.duration||3000);
  DEMO.txt.textContent=it.subtitle||"";
  DEMO.step.textContent=DEMO.i+" / "+DEMO_SCRIPT.length;
  DEMO.fill.style.transition="none"; DEMO.fill.style.width="0";
  void DEMO.fill.offsetWidth;
  DEMO.fill.style.transition="width "+d+"ms linear";
  DEMO.fill.style.width="100%";
  if(typeof it.action==="function"){
    try{it.action()}catch(err){if(window.console)console.warn("demo:",err)}
  }
  DEMO.timer=setTimeout(demoNext,d);
}

function demoStop(){
  DEMO.on=false;
  if(DEMO.timer){clearTimeout(DEMO.timer);DEMO.timer=null}
  DEMO.extra.forEach(function(t){clearTimeout(t);clearInterval(t)});
  DEMO.extra=[];
  var m=document.querySelectorAll(".demo-tap"),i;
  for(i=0;i<m.length;i++)m[i].classList.remove("demo-tap");
  if(DEMO.bar)DEMO.bar.hidden=true;
  if(DEMO.btn)DEMO.btn.hidden=false;
  document.documentElement.classList.remove("demo-running");
  demoQuiet();
}

   המכשיר, לא כבחירה, והאפליקציה נפתחה באנגלית למי שבא ללמוד
   בעברית. ערבית ורוסית כן נחשבות — שם זו שפת אם של ממש. מי

function guessLang(){
  var ls=(navigator.languages||[navigator.language||"he"]).map(function(x){
    return String(x).toLowerCase().split("-")[0]});
  for(var i=0;i<ls.length;i++){

    if(c==="en")continue;
    if(LANGS[c])return c;
  }
  return "he";
}
function touchDay(){
  var d=todayIso();

    var y=new Date(Date.now()-86400000);
    var yi=y.getFullYear()+"-"+String(y.getMonth()+1).padStart(2,"0")+"-"+String(y.getDate()).padStart(2,"0");
    state.streak=(state.lastDay===yi)?(state.streak||0)+1:1;
    state.lastDay=d; state.day={d:d,n:0};
  }
}
function stKey(tid,lv){return tid+"|"+lv}

function mastery(tid,lv){

function allVoices(){try{return window.speechSynthesis?(speechSynthesis.getVoices()||[]):[]}catch(e){return[]}}

   לפני כן מקבל את ברירת המחדל של הדפדפן — לרוב קול אנגלי, גם כשמותקן
   קול עברי טוב. onvoiceschanged לבדו אינו פתרון: הוא מרענן תפריט,
   הוא לא מעכב את האמירה הראשונה. */
var _voicesP=null;
function voicesReady(){
  if(_voicesP)return _voicesP;
  _voicesP=new Promise(function(done){
    if(!("speechSynthesis" in window)){done();return}
    if(allVoices().length){done();return}
    var poll=null,cap=null,fired=false;
    function finish(){
      if(fired)return; fired=true;
      clearInterval(poll); clearTimeout(cap);
      try{speechSynthesis.removeEventListener("voiceschanged",finish)}catch(e){}
      done();
    }
    try{speechSynthesis.addEventListener("voiceschanged",finish)}catch(e){}
    /* Safari לא תמיד יורה את האירוע — לכן גם דגימה */
    poll=setInterval(function(){if(allVoices().length)finish()},120);
    /* תקרה: יש מכשירים שמחזירים רשימה ריקה לצמיתות ומדברים מצוין.
       עדיף לדבר בקול ברירת מחדל מאשר לשתוק לנצח. */
    cap=setTimeout(finish,4000);
  });
  return _voicesP;
}

   נשי שמותקן נבחר מיד, בלי שינוי הגובה ובלי הודעה. */
function femNote(pool){
  if(!pool||!pool.length)return "";
  for(var i=0;i<pool.length;i++)if(vGender(pool[i])==="f")return "";
  /* המסלול נכתב למערכת שהמשתמש נמצא בה עכשיו. אנדרואיד של גוגל
     מחזיק את ההגדרה תחת "נגישות" — "ניהול כללי" הוא מסלול של
     סמסונג בלבד; אייפד מדווח מאז iPadOS 13 כמו מק ונבדל ממנו רק
     במסך מגע; ומשתמש מק קיבל עד כה הוראות של ווינדוס, כי כל מה

         :(/iPhone|iPad|iPod/i.test(ua)||(/Macintosh/i.test(ua)&&navigator.maxTouchPoints>1))?"femIos"

function vchkT(){ var g=state.lang||"he"; return VCHKMSG[g]||VCHKMSG.he }
function voiceCheck(){
  var M=vchkT();
  VCHK=M.sent; render();
  function show(m){ VCHK=m; render() }
  if(!("speechSynthesis" in window)){ show(M.noSup); return }
  var list=[]; try{ list=speechSynthesis.getVoices()||[] }catch(e){}
  try{ speechSynthesis.cancel() }catch(e){}
  var u;
  try{ u=new SpeechSynthesisUtterance(M.say) }
  catch(e){ show(M.mkFail+e.message); return }
  u.lang=(LANGS[state.lang||"he"]||LANGS.he).tts; u.volume=1; u.rate=1; u.pitch=1;
  var done=false;
  u.onstart=function(){ done=true; show(M.okN[0]+list.length+M.okN[1]) };
  u.onerror=function(e){ done=true;
    var er=(e&&e.error)||M.unk;
    if(er==="interrupted"||er==="canceled"){ show(M.ok); return }
    show(M.engine[0]+er+" · "+list.length+M.engine[1]); };
  try{ speechSynthesis.speak(u) }
  catch(e){ show(M.spFail+e.message); return }
  setTimeout(function(){ if(!done)
    show(M.timeout[0]+list.length+M.timeout[1]) },2000);
}

/* ------------------------------------------------------------
   דור ההקראה. speechSynthesis.cancel() אינו מבטל setTimeout:
   כרום יורה onend על האמירה שבוטלה, המקטע הבא נרשם בכל זאת,
   וכעבור SEG_GAP ההקראה הישנה חוזרת מעל החדשה — שני קולות
   במקביל. מונה אחד פותר את זה: כל הקראה מקבלת מספר, stopSpeak
   מקדם אותו, ומקטע מדור ישן פשוט אינו מדבר.
   ------------------------------------------------------------ */
var _sayGen=0;
function speakDevice(text,code,rate){
  if(!("speechSynthesis" in window))return false;
  try{speechSynthesis.cancel()}catch(e){}
  var my=++_sayGen;
  /* האמירה יוצאת מיד, בתוך הלחיצה. קודם היא נעטפה ב-voicesReady,
     שממתין לרשימת הקולות ועד ארבע שניות אם היא לא מגיעה — ואמירה
     שיוצאת ארבע שניות אחרי המגע נזרקת בשקט באנדרואיד ובספארי.
     כשהרשימה כבר כאן, בוחרים קול ומדברים. כשהיא ריקה — מדברים
     בכל זאת, עם u.lang בלבד: קול ברירת מחדל בשפה הנכונה עדיף על
     שתיקה, ויש מכשירים שמחזירים רשימה ריקה לצמיתות ומדברים היטב.
     voicesReady נשאר בשימוש למסך בחירת הקול, שם ההמתנה במקומה. */
  (function(){
    try{
      var v=bestVoice(code), lang=(v&&v.lang)||code;
      var segs=segments(String(text)), rt=tuneRate(lang,clamp(rate,0.55,1.4));
      var pit=femLift(v);
      (function sayseg(k){
        if(my!==_sayGen)return;   /* ההקראה הזאת בוטלה — המקטע הבא לא יוצא */
        if(k>=segs.length){ hlClear(); ttsOK(); return }
        var seg=segs[k];
        var u=new SpeechSynthesisUtterance(seg.text);
        u.lang=lang;
        if(v){ try{ u.voice=v }catch(e2){} }
        u.rate=rt; u.pitch=pit; u.volume=1;
        u.onboundary=function(e){if(!e.name||e.name==="word")hlAt(seg.start+e.charIndex)};
        u.onend=function(){
          if(k+1<segs.length) setTimeout(function(){sayseg(k+1)},SEG_GAP);
          else { hlClear(); ttsOK() }
        };
        u.onerror=function(e){ttsFail(e&&e.error)};
        speechSynthesis.speak(u);
      })(0);
    }catch(e){}
  })();
  return true;
}
/* lang: "en" לחומר הנלמד, או קוד שפת האם להוראה. */
function speak(text,lang,rateMul){
  /* כל טקסט שמגיע להקראה מנוקה מתגיות. חלק מהקריאות כבר מנקות
     לבד, וניקוי חוזר אינו משנה דבר — אבל בלעדיו כל מחרוזת שנשארה
     עם <sub> או <span class="frac"> הוקראה בקול כתגית: הסטודנט
     שמע "span class frac" באמצע השאלה. */
  text=plainOf(String(text||"")).trim(); if(!text)return;
  lang=lang||"en";
  var code=lang==="en"?EN_TTS:LANGS[lang].tts;
  var rate=clamp(state.rate*(rateMul||1),0.55,1.4);
  stopSpeak();
  var my=_sayGen;   /* גם תשובת רשת שמגיעה אחרי עצירה לא תושמע */
  /* שכבה 1 - קובץ מוקלט (המנוע של תאוריה מדברת). יש קובץ:
     מנגנים וזהו; אין: קול המכשיר כרגיל. מבדק חוסרים 30.9 סעיף 4. */
  if(typeof RECORDED!=="undefined"&&RECORDED.play(text,lang,{rate:state.rate,
      onError:function(){ if(my===_sayGen)speakDevice(text,code,rate) }})){
    return;
  }
  if(gemOn()){
    var vid=gvOf(state.gemVoice).id;
    var ck=lang+"|"+vid+"|"+rate.toFixed(2)+"|"+text;
    if(gCache[ck]){playUrl(gCache[ck],text,code,rate);return}
    gBusy=true; renderSpeakState();
    gSynth(text,vid,rate,lang).then(function(u){
      if(my!==_sayGen)return;
      gCache[ck]=u; gBusy=false; renderSpeakState(); playUrl(u,text,code,rate);
    }).catch(function(){
      gBusy=false; renderSpeakState(); speakDevice(text,code,rate);
    });
    return;
  }
  speakDevice(text,code,rate);
}
function playUrl(url,text,code,rate){
  gStop();
  /* משתמשים באלמנט ששוחרר במגע ולא יוצרים חדש. */
  if(!GEL)GEL=new Audio();
  gAudio=GEL; gAudio.src=url;
  gAudio.play().catch(function(){speakDevice(text,code,rate)});
}
function stopSpeak(){_sayGen++;gStop();if(typeof RECORDED!=="undefined")RECORDED.stop();hlClear();try{if(window.speechSynthesis)speechSynthesis.cancel()}catch(e){}}
/* עוזבים את הדף — הקול נעצר. בלעדיו הוא ממשיך ברקע אחרי מעבר לטאב
   אחר, ולפעמים נתקע עד סגירת הדפדפן. */
try{document.addEventListener("visibilitychange",function(){
  if(document.hidden)stopSpeak();
});}catch(e){}
/* iOS לא ישמיע כלום עד שאמירה אחת יצאה מתוך handler של מגע אמיתי.
   אמירה אוטומטית בטעינת הדף נבלעת בשקט — בלי חריגה, בלי לוג, בלי
   דרך לדעת. משחררים פעם אחת עם אמירה ריקה.
   חשוב: קריאה ישירה, בלי voicesReady — הבטחה שוברת את שרשרת המגע
   ו-Safari כבר לא יזהה את האמירה כיוזמת משתמש. */
try{document.addEventListener("pointerdown",function(){
  try{speechSynthesis.speak(new SpeechSynthesisUtterance(""))}catch(e){}
  /* ואותו דבר לאלמנט השמע: מקור שקט, play בתוך המגע עצמו. */
  try{
    if(!GEL)GEL=new Audio();
    GEL.src=SILENT_WAV;
    var pr=GEL.play();
    if(pr&&pr.then)pr.then(function(){try{GEL.pause();GEL.currentTime=0}catch(e){}},function(){});
  }catch(e){}
},{once:true});}catch(e){}
function renderSpeakState(){
  var b=document.querySelectorAll(".spk");
  for(var i=0;i<b.length;i++)b[i].classList.toggle("on",gBusy);

/* ============================================================
   7. תוכן
   ------------------------------------------------------------
   בנק שאלות כתוב, ולא מחולל. באזרחות אין נוסחה שממנה נגזרת
   שאלה: הניסוח המדויק הוא החומר הנלמד, ומסיח שנבנה אוטומטית
   מנוסח אחר היה יוצא או מופרך מדי או נכון בעצמו.

   Q(id, q, opts, ok, hint, ex, fig)
     id   — מזהה יציב לפריט. הוא נכנס לסטטיסטיקה של הלומד, ולכן
            אסור לו להשתנות כשמוסיפים פריט לפניו.
     q    — נוסח השאלה, בארבע שפות.
     opts — ארבע תשובות, כל אחת בארבע שפות. תמיד ארבע: שלוש
            אפשרויות הן ניחוש של אחד משלושה.
     ok   — אינדקס התשובה הנכונה במערך opts (0..3). הסדר על
            המסך מעורבב בכל הצגה, ולכן האינדקס אינו רמז.
     hint — רמז שמכוון לחשיבה ואינו מוסר את התשובה.
     ex   — ההסבר שנפתח אחרי המענה, גם כשענו נכון.
     fig  — מפתח איור מתוך FIGS, או null. אופציונלי בהגדרה:
            רוב השאלות באזרחות הן טקסט בלבד.

   כל שדה קיים בארבע השפות. אזרחות נלמדת בשפת האם — מי שקורא
   בקושי בעברית לא ילמד ממנה מדרג נורמות, ולכן התוכן עצמו
   מתורגם ולא רק הממשק.

   מקור: תוכנית הלימודים בתנ״ך של משרד החינוך, ומבנה שאלונים 1261/1262. הניסוח מקורי של בקול, עם קרדיט וקישור למשרד החינוך.
   השאלות נכתבו לאפליקציה הזאת ואינן העתק של בחינה.
   ============================================================ */
function Q(id,q,opts,ok,hint,ex,fig,wrong){
  return {id:id,q:q,o:opts,ok:ok,hint:hint,ex:ex,fig:fig||null,wrong:wrong||null};
}

    'font-size="10" font-weight="700" fill="currentColor">'+esc(label)+'</text>'+

[ [
  Q("bib-genesis-1261-1",{"he": "איזה תיאור מתאים להבטחה לאברהם?", "ar": "أي وصف يناسب الوعد لإبراهيم؟", "ru": "Какое описание подходит к «Обещание Аврааму»?", "en": "Which description fits promise to Abraham?"},[{"he": "בבראשית י״ב מסופר על קריאה לצאת מארצו והבטחה לזרע ולברכה.", "ar": "في التكوين 12 ترد دعوة للخروج من الأرض ووعد بالنسل والبركة.", "ru": "В Бытии 12 рассказаны призыв оставить страну и обещание потомства и благословения.", "en": "Genesis 12 recounts a call to leave his land and a promise of descendants and blessing."},{"he": "בבראשית כ״ג אברהם קונה מקום לקבורת שרה במשא ומתן גלוי.", "ar": "في التكوين 23 يشتري إبراهيم موضعًا لدفن سارة في تفاوض علني.", "ru": "В Бытии 23 Авраам покупает место для погребения Сарры путём открытых переговоров.", "en": "In Genesis 23 Abraham buys a burial place for Sarah through public negotiation."},{"he": "בבראשית מ״א יוסף מפרש את החלומות כשנות שובע ואחריהן שנות רעב ומציע להיערך מראש.", "ar": "في التكوين 41 يفسر يوسف الحلمين بسنوات خصب تليها سنوات جوع ويقترح الاستعداد.", "ru": "В Бытии 41 Иосиф толкует сны как годы изобилия, затем голода, и предлагает подготовиться.", "en": "In Genesis 41 Joseph reads the dreams as years of plenty followed by famine and proposes preparation."},{"he": "בבראשית מ״ב ואילך האחים באים למצרים לקנות מזון ואינם מזהים תחילה את יוסף.", "ar": "في التكوين 42 وما بعده يأتي الإخوة إلى مصر لشراء الطعام ولا يعرفون يوسف أولًا.", "ru": "В Бытии 42 и далее братья приходят за пищей в Египет и сначала не узнают Иосифа.", "en": "In Genesis 42 onward the brothers travel to Egypt for food and at first do not recognise Joseph."}],0,{"he": "חפשו את הפרט שמבדיל אותו מן האחרים.", "ar": "ابحثوا عن التفصيل الذي يميزه عن غيره.", "ru": "Ищите отличие от остальных вариантов.", "en": "Look for the detail that separates it from the others."},{"he": "הבטחה זו ניתנת עם הקריאה לאברהם ללכת מארצו.", "ar": "يأتي الوعد مع دعوة إبراهيم إلى مغادرة أرضه.", "ru": "Обещание сопровождает призыв Авраама покинуть родину.", "en": "The promi  ,Q("bib-gen-call",{"he": "מה נאמר לאברהם על מטרת היציאה מארצו בבראשית י\"ב?", "ar": "ماذا قيل لإبراهيم عن هدف خروجه من أرضه في التكوين 12؟", "ru": "Что было сказано Аврааму о цели ухода из его страны в Бытии 12?", "en": "What was Abraham told about the goal of leaving his land in Genesis 12?"},[{"he": "ללכת אל הארץ אשר תראה לו, בלי שם מקום מראש", "ar": "أن يذهب إلى الأرض التي ستُرى له، دون ذكر اسمها مسبقًا", "ru": "Идти в землю, которая будет ему указана, без названия заранее", "en": "To go to the land that would be shown to him, with no name given in advance"},{"he": "לרדת מיד למצרים בגלל הרעב", "ar": "أن ينزل فورًا إلى مصر بسبب الجوع", "ru": "Немедленно спуститься в Египет из-за голода", "en": "To go down to Egypt at once because of the famine"},{"he": "לחזור לחרן, לבית משפחתו", "ar": "أن يعود إلى حاران، إلى بيت عائلته", "ru": "Вернуться в Харран, к дому его семьи", "en": "To return to Haran, to his family home"},{"he": "ללכת אל כנען, ששמה נאמר לו במפורש", "ar": "أن يذهب إلى كنعان التي ذُكر اسمها صراحة له", "ru": "Идти в Ханаан, чьё имя было прямо названо ему", "en": "To go to Canaan, whose name was explicitly told to him"}],0,{"he": "שימו לב איך היעד מתואר בפסוק עצמו.", "ar": "انتبهوا كيف توصف الوجهة في الآية نفسها.", "ru": "Обратите внимание, как сама цель описана в стихе.", "en": "Notice how the destination itself is described in the verse."},{"he": "בבראשית י\"ב אברהם נקרא לצאת 'אל הארץ אשר אראך' - בלי שם מקום. דוגמה: הוא יוצא בלי לדעת את היעד המדויק, וזה חלק מנקודת האמונה של הפרק. מצרים באה רק אחר כך בעקבות רעב, וחרן היא תחנה בדרך.", "ar": "في التكوين 12 يُدعى إبراهيم للخروج «إلى الأرض التي سأريك» دون اسم مكان. مثال: يخرج دون معرفة الوجهة الدقيقة، وهذا جزء من فكرة الإيمان في الفصل. مصر تأتي لاحقًا بسبب الجوع، وحاران محطة في الطريق.", "ru": "В Бытии 12 Авраам призван идти «в землю, которую я укажу тебе», без названия места. Пример: он выходит, не зная точной цели, и это часть идеи веры в этой главе. Египет появляется позже из-за голода, а Харран - остановка в пути.", "en": "In Genesis 12 Abraham is called to go \"to the land I will show you\", with no place named. Example: he leaves without knowing the exact destination, which is part of the chapter's point about faith. Egypt comes only later because of famine, and Haran is a stop along the way."},null,[null,{"he": "מצרים מופיעה רק אחר כך, בעקבות הרעב, ולא במקריאה הראשונה.", "ar": "مصر تظهر فقط لاحقًا بسبب الجوع، لا في الدعوة الأولى.", "ru": "Египет появляется только позже, из-за голода, а не в первом призыве.", "en": "Egypt appears only later, because of the famine, not in the first call."},{"he": "חרן היא תחנה בדרך של המשפחה, לא מטרת היציאה.", "ar": "حاران محطة عائلية في الطريق، لا هدف الخروج.", "ru": "Харран - семейная остановка в пути, а не цель ухода.", "en": "Haran is a family stop on the way, not the goal of the journey."},{"he": "שם הארץ לא נמסר מראש; זו בדיוק הנקודה.", "ar": "اسم الأرض لم يُذكر مسبقًا؛ هذه بالضبط الفكرة.", "ru": "Название земли не было дано заранее; в этом и суть.", "en": "The land's name was not given in advance; that is exactly the point."}]),
  Q("gen-1-01",{"he": "לאן נשלח אברהם עם יצחק בבראשית כ״ב?", "ar": "إلى أين أُرسل إبراهيم مع إسحاق في التكوين 22؟", "ru": "Куда был послан Авраам с Исааком в Бытии 22?", "en": "Where was Abraham sent with Isaac in Genesis 22?"},[{"he": "אל הר סיני", "ar": "إلى جبل سيناء", "ru": "К горе Синай", "en": "To Mount Sinai"}, {"he": "אל באר שבע", "ar": "إلى بئر السبع", "ru": "В Беэр-Шеву", "en": "To Beersheba"}, {"he": "אל ארץ המוריה", "ar": "إلى أرض المريّا", "ru": "В землю Мориа", "en": "To the land of Moriah"}, {"he": "אל חרן", "ar": "إلى حاران", "ru": "В Харран", "en": "To Haran"}],2,{"he": "השם מופיע כבר בציווי, בתחילת הפרק.", "ar": "الاسم يرد في الأمر نفسه، في بداية الإصحاح.", "ru": "Название звучит уже в самом повелении, в начале главы.", "en": "The name appears already in the command, at the start of the chapter."},{"he": "בבראשית כ״ב נאמר לאברהם ללכת אל ארץ המוריה. שם, על אחד ההרים, הוא בונה מזבח. אחר כך הוא חוזר לבאר שבע.", "ar": "في التكوين 22 يُقال لإبراهيم أن يذهب إلى أرض المريّا. هناك، على أحد الجبال، يبني مذبحًا. ثم يعود إلى بئر السبع.", "ru": "В Бытии 22 Аврааму велено идти в землю Мориа. Там, на одной из гор, он строит жертвенник. Потом он возвращается в Беэр-Шеву.", "en": "In Genesis 22 Abraham is told to go to the land of Moriah. There, on one of the mountains, he builds an altar. Then he returns to Beersheba."},null,[{"he": "הר סיני מופיע רק בספר שמות, בימי משה.", "ar": "جبل سيناء يظهر فقط في سفر الخروج، في زمن موسى.", "ru": "Гора Синай появляется только в Исходе, во времена Моисея.", "en": "Mount Sinai appears only in Exodus, in the time of Moses."}, {"he": "באר שבע היא המקום שאליו אברהם חוזר אחרי המעשה.", "ar": "بئر السبع هي المكان الذي يعود إليه إبراهيم بعد الحادثة.", "ru": "В Беэр-Шеву Авраам возвращается уже после этого события.", "en": "Beersheba is where Abraham returns after the event."}, null, {"he": "חרן היא המקום שאברהם עזב בבראשית י״ב, ולא יעד הניסיון.", "ar": "حاران هي المكان الذي تركه إبراهيم في التكوين 12، لا مكان الامتحان.", "ru": "Харран   Q("gen-1-02",{"he": "את מי פגש עבד אברהם ליד הבאר בבראשית כ״ד?", "ar": "مَن التقى خادم إبراهيم عند البئر في التكوين 24؟", "ru": "Кого встретил раб Авраама у колодца в Бытии 24?", "en": "Whom did Abraham's servant meet at the well in Genesis 24?"},[{"he": "את רבקה, נכדתו של נחור", "ar": "رفقة، حفيدة ناحور", "ru": "Ревекку, внучку Нахора", "en": "Rebekah, Nahor's granddaughter"}, {"he": "את רחל, בתו הצעירה של לבן", "ar": "راحيل، ابنة لابان الصغرى", "ru": "Рахиль, младшую дочь Лавана", "en": "Rachel, Laban's younger daughter"}, {"he": "את הגר, שפחת שרה", "ar": "هاجر، جارية سارة", "ru": "Агарь, служанку Сарры", "en": "Hagar, Sarah's maidservant"}, {"he": "את לאה, הבת הבכורה", "ar": "ليئة، الابنة الكبرى", "ru": "Лию, старшую дочь", "en": "Leah, the elder daughter"}],0,{"he": "הסיפור עוסק במציאת אישה ליצחק.", "ar": "القصة تدور حول إيجاد زوجة لإسحاق.", "ru": "История о поиске жены для Исаака.", "en": "The story is about finding a wife for Isaac."},{"he": "העבד מבקש סימן: נערה שתשקה גם את הגמלים. רבקה עושה זאת בדיוק. היא בת בתואל, בנו של נחור, אחי אברהם.", "ar": "يطلب الخادم علامة: فتاة تسقي الجمال أيضًا. رفقة تفعل ذلك بالضبط. هي ابنة بتوئيل بن ناحور، أخي إبراهيم.", "ru": "Раб просит знак: девушка, которая напоит и верблюдов. Ревекка делает именно это. Она дочь Вафуила, сына Нахора, брата Авраама.", "en": "The servant asks for a sign: a girl who will water the camels too. Rebekah does exactly that. She is the daughter of Bethuel, son of Nahor, Abraham's brother."},null,[null, {"he": "את רחל פוגש יעקב ליד באר, בבראשית כ״ט.", "ar": "راحيل يلتقيها يعقوب عند بئر، في التكوين 29.", "ru": "Рахиль встречает Иаков у колодца, в Бытии 29.", "en": "Jacob is the one who meets Rachel at a well, in Genesis 29."}, {"he": "הגר פוגשת מלאך ליד מעיין, בסיפור אחר לגמרי.", "ar": "هاجر تلتقي ملاكًا عند عين ماء، في قصة مختلفة تمامًا.", "ru": "Агарь встречает ангела у источника, в совсем другой истории.", "en": "Hagar meets an angel by a spring, in a completely different story."}, {"he": "לאה מופיעה רק בסיפור יעקב ולבן, דור אחד אחרי.", "ar": "ليئة تظهر فقط في قصة يعقوب ولابان، بعد جيل واحد.", "ru": "Лия появляется только в истории Иакова и Лавана, поколением позже.", "en": "Leah appears only in the story of Jacob and Laban, a generation later."}]),
  Q("gen-1-03",{"he": "מה מכר עשו ליעקב תמורת נזיד עדשים?", "ar": "ماذا باع عيسو ليعقوب مقابل طبيخ العدس؟", "ru": "Что Исав продал Иакову за чечевичную похлёбку?", "en": "What did Esau sell to Jacob for lentil stew?"},[{"he": "את ברכת אביו", "ar": "بركة أبيه", "ru": "Благословение отца", "en": "His father's blessing"}, {"he": "את חלקו בשדה", "ar": "نصيبه في الحقل", "ru": "Свою долю поля", "en": "His share of the field"}, {"he": "את עדר הצאן שלו", "ar": "قطيع غنمه", "ru": "Своё стадо овец", "en": "His flock of sheep"}, {"he": "את הבכורה שלו", "ar": "بكوريّته", "ru": "Своё первородство", "en": "His birthright"}],3,{"he": "מה שייך לבן הנולד ראשון?", "ar": "ما الذي يخصّ الابن المولود أولًا؟", "ru": "Что принадлежит сыну, родившемуся первым?", "en": "What belongs to the son born first?"},{"he": "בבראשית כ״ה עשו חוזר רעב מן השדה. יעקב מבקש ממנו למכור את הבכורה, ועשו מסכים. הכתוב מסכם: ״ויבז עשו את הבכורה״.", "ar": "في التكوين 25 يعود عيسو جائعًا من الحقل. يطلب يعقوب أن يبيعه البكورية، فيوافق عيسو. ويختم النص بأن عيسو احتقر البكورية.", "ru": "В Бытии 25 Исав возвращается с поля голодным. Иаков просит продать ему первородство, и Исав соглашается. Текст подытоживает: Исав пренебрёг первородством.", "en": "In Genesis 25 Esau comes home hungry from the field. Jacob asks him to sell the birthright, and Esau agrees. The text sums up: Esau despised the birthright."},null,[{"he": "את הברכה יעקב לוקח בערמה בפרק כ״ז, ולא קונה אותה.", "ar": "البركة يأخذها يعقوب بالحيلة في الإصحاح 27، ولا يشتريها.", "ru": "Благословение Иаков берёт хитростью в главе 27, а не покупает.", "en": "Jacob takes the blessing by trickery in chapter 27; he does not buy it."}, {"he": "בפרק כ״ה לא נמכר שום שדה.", "ar": "في الإصحاح 25 لا يُباع أي حقل.", "ru": "В главе 25 никакое поле не продаётся.", "en": "No field is sold in chapter 25."}, {"he": "עשו הוא צייד, והצאן אינו חלק מן העסקה.", "ar": "عيسو صيّاد، والغنم ليست جزءًا من الصفقة.", "ru": "Исав охотник, и овцы не входят в сделку.", "en": "Esau is a hunter, and sheep are not part of the deal."}, null]),
  Q("gen-1-04",{"he": "איזה שם נתן יעקב למקום שבו חלם על הסולם?", "ar": "أي اسم أطلقه يعقوب على المكان الذي حلم فيه بالسلّم؟", "ru": "Как Иаков назвал место, где ему приснилась лестница?", "en": "What name did Jacob give the place where he dreamed of the ladder?"},[{"he": "פניאל", "ar": "فنيئيل", "ru": "Пенуэл", "en": "Peniel"}, {"he": "בית אל", "ar": "بيت إيل", "ru": "Вефиль", "en": "Bethel"}, {"he": "באר שבע", "ar": "بئر السبع", "ru": "Беэр-Шева", "en": "Beersheba"}, {"he": "שכם", "ar": "شكيم", "ru": "Сихем", "en": "Shechem"}],1,{"he": "השם קשור למה שיעקב הבין כשהתעורר.", "ar": "الاسم مرتبط بما فهمه يعقوب حين استيقظ.", "ru": "Название связано с тем, что Иаков понял, проснувшись.", "en": "The name is linked to what Jacob realized when he woke up."},{"he": "בבראשית כ״ח יעקב מתעורר ואומר שהמקום הוא בית אלוהים. לכן הוא קורא לו בית אל. קודם קראו למקום לוז.", "ar": "في التكوين 28 يستيقظ يعقوب ويقول إن المكان بيت الله. لذلك يسميه بيت إيل. وكان اسمه قبل ذلك لوز.", "ru": "В Бытии 28 Иаков просыпается и говорит, что это дом Божий. Поэтому он называет место Вефиль. Раньше оно называлось Луз.", "en": "In Genesis 28 Jacob wakes and says the place is the house of God. So he calls it Bethel. Before, it was called Luz."},null,[{"he": "פניאל הוא המקום שבו יעקב נאבק עם האיש, בפרק ל״ב.", "ar": "فنيئيل هو مكان صراع يعقوب مع الرجل، في الإصحاح 32.", "ru": "Пенуэл — место, где Иаков боролся с человеком, в главе 32.", "en": "Peniel is where Jacob wrestles with the man, in chapter 32."}, null, {"he": "מבאר שבע יעקב יוצא לדרך, לפני החלום.", "ar": "من بئر السبع يخرج يعقوب، قبل الحلم.", "ru": "Из Беэр-Шевы Иаков выходит в путь ещё до сна.", "en": "Jacob sets out from Beersheba, before the dream."}, {"he": "שכם מופיעה מאוחר יותר, כשיעקב חוזר לארץ.", "ar": "شكيم تظهر لاحقًا، عندما يعود يعقوب إلى البلاد.", "ru": "Сихем появляется позже, когда Иаков возвращается в страну.", "en": "Shechem appears later, when Jacob returns to the land."}]),
  Q("gen-1-05",{"he": "מי מן האחים הציע להשליך את יוסף לבור, ולא להרוג אותו?", "ar": "مَن من الإخوة اقترح أن يُلقى يوسف في البئر بدل قتله؟", "ru": "Кто из братьев предложил бросить Иосифа в яму, а не убивать?", "en": "Which brother suggested throwing Joseph into a pit instead of killing him?"},[{"he": "יהודה", "ar": "يهوذا", "ru": "Иуда", "en": "Judah"}, {"he": "שמעון", "ar": "شمعون", "ru": "Симеон", "en": "Simeon"}, {"he": "ראובן", "ar": "رأوبين", "ru": "Рувим", "en": "Reuben"}, {"he": "בנימין", "ar": "بنيامين", "ru": "Вениамин", "en": "Benjamin"}],2,{"he": "זה האח שרצה להחזיר את יוסף לאביו.", "ar": "هو الأخ الذي أراد أن يعيد يوسف إلى أبيه.", "ru": "Это брат, который хотел вернуть Иосифа отцу.", "en": "This is the brother who wanted to return Joseph to his father."},{"he": "בבראשית ל״ז ראובן אומר לאחים לא לשפוך דם. הוא מציע להשליך את יוסף לבור. הכתוב מסביר שרצה להציל אותו ולהשיב אותו לאביו.", "ar": "في التكوين 37 يقول رأوبين للإخوة ألا يسفكوا دمًا. ويقترح إلقاء يوسف في البئر. ويوضح النص أنه أراد إنقاذه وإعادته إلى أبيه.", "ru": "В Бытии 37 Рувим говорит братьям не проливать крови. Он предлагает бросить Иосифа в яму. Текст объясняет: он хотел спасти его и вернуть отцу.", "en": "In Genesis 37 Reuben tells the brothers not to shed blood. He suggests throwing Joseph into a pit. The text explains he wanted to save him and return him to his father."},null,[{"he": "יהודה הציע אחר כך למכור את יוסף לישמעאלים.", "ar": "يهوذا اقترح لاحقًا بيع يوسف للإسماعيليين.", "ru": "Иуда позже предложил продать Иосифа измаильтянам.", "en": "Judah later suggested selling Joseph to the Ishmaelites."}, {"he": "שמעון אינו מדבר בסצנה הזו. בהמשך יוסף אוסר אותו במצרים.", "ar": "شمعون لا يتكلم في هذا المشهد. لاحقًا يسجنه يوسف في مصر.", "ru": "Симеон в этой сцене молчит. Позже Иосиф заключает его в Египте.", "en": "Simeon does not speak in this scene. Later Joseph imprisons him in Egypt."}, null, {"he": "בנימין אינו מוזכר בין האחים שבשדה.", "ar": "بنيامين لا يُذكر بين الإخوة الذين في الحقل.", "ru": "Вениамин не упомянут среди братьев в поле.", "en": "Benjamin is not mentioned among the brothers in the field."}]),
  Q("gen-1-06",{"he": "את מי קיבל יעקב לאישה אחרי שבע שנות העבודה הראשונות?", "ar": "مَن أخذ يعقوب زوجةً بعد سنوات العمل السبع الأولى؟", "ru": "Кого Иаков получил в жёны после первых семи лет работы?", "en": "Whom did Jacob receive as a wife after the first seven years of work?"},[{"he": "את לאה", "ar": "ليئة", "ru": "Лию", "en": "Leah"}, {"he": "את רחל", "ar": "راحيل", "ru": "Рахиль", "en": "Rachel"}, {"he": "את זלפה", "ar": "زلفة", "ru": "Зелфу", "en": "Zilpah"}, {"he": "את בלהה", "ar": "بلهة", "ru": "Валлу", "en": "Bilhah"}],0,{"he": "יעקב ביקש אחת, אבל קיבל אחרת.", "ar": "طلب يعقوب واحدة، لكنه أخذ أخرى.", "ru": "Иаков просил одну, а получил другую.", "en": "Jacob asked for one, but got another."},{"he": "בבראשית כ״ט יעקב עובד שבע שנים בשביל רחל. בבוקר שאחרי החתונה הוא מגלה שזו לאה. לבן מסביר שלא נותנים את הצעירה לפני הבכירה.", "ar": "في التكوين 29 يعمل يعقوب سبع سنين من أجل راحيل. وفي صباح ما بعد العرس يكتشف أنها ليئة. ويشرح لابان أن الصغرى لا تُعطى قبل الكبرى.", "ru": "В Бытии 29 Иаков работает семь лет за Рахиль. Утром после свадьбы он видит, что это Лия. Лаван объясняет: младшую не выдают прежде старшей.", "en": "In Genesis 29 Jacob works seven years for Rachel. The morning after the wedding he finds it is Leah. Laban explains that the younger is not given before the elder."},null,[null, {"he": "את רחל קיבל רק אחרי שבוע, והתחייב לעבוד עוד שבע שנים.", "ar": "راحيل أخذها بعد أسبوع فقط، والتزم بالعمل سبع سنين أخرى.", "ru": "Рахиль он получил лишь через неделю и обязался работать ещё семь лет.", "en": "He got Rachel only a week later, and agreed to work seven more years."}, {"he": "זלפה היא השפחה שלבן נתן ללאה.", "ar": "زلفة هي الجارية التي أعطاها لابان لليئة.", "ru": "Зелфа — служанка, которую Лаван дал Лии.", "en": "Zilpah is the maidservant Laban gave to Leah."}, {"he": "בלהה היא השפחה שלבן נתן לרחל.", "ar": "بلهة هي الجارية التي أعطاها لابان لراحيل.", "ru": "Валла — служанка, которую Лаван дал Рахили.", "en": "Bilhah is the maidservant Laban gave to Rachel."}])],
 [
  Q("bib-genesis-1261-3",{"he": "איזה תיאור מתאים לחלומות פרעה ופירוש יוסף?", "ar": "أي وصف يناسب أحلام فرعون وتفسير يوسف؟", "ru": "Какое описание подходит к «Сны фараона и толкование Иосифа»?", "en": "Which description fits Pharaoh’s dreams and Joseph’s reading?"},[{"he": "בבראשית י״ב מסופר על קריאה לצאת מארצו והבטחה לזרע ולברכה.", "ar": "في التكوين 12 ترد دعوة للخروج من الأرض ووعد بالنسل والبركة.", "ru": "В Бытии 12 рассказаны призыв оставить страну и обещание потомства и благословения.", "en": "Genesis 12 recounts a call to leave his land and a promise of descendants and blessing."},{"he": "בבראשית כ״ג אברהם קונה מקום לקבורת שרה במשא ומתן גלוי.", "ar": "في التكوين 23 يشتري إبراهيم موضعًا لدفن سارة في تفاوض علني.", "ru": "В Бытии 23 Авраам покупает место для погребения Сарры путём открытых переговоров.", "en": "In Genesis 23 Abraham buys a burial place for Sarah through public negotiation."},{"he": "בבראשית מ״א יוסף מפרש את החלומות כשנות שובע ואחריהן שנות רעב ומציע להיערך מראש.", "ar": "في التكوين 41 يفسر يوسف الحلمين بسنوات خصب تليها سنوات جوع ويقترح الاستعداد.", "ru": "В Бытии 41 Иосиф толкует сны как годы изобилия, затем голода, и предлагает подготовиться.", "en": "In Genesis 41 Joseph reads the dreams as years of plenty followed by famine and proposes preparation."},{"he": "בבראשית מ״ב ואילך האחים באים למצרים לקנות מזון ואינם מזהים תחילה את יוסף.", "ar": "في التكوين 42 وما بعده يأتي الإخوة إلى مصر لشراء الطعام ولا يعرفون يوسف أولًا.", "ru": "В Бытии 42 и далее братья приходят за пищей в Египет и сначала не узнают Иосифа.", "en": "In Genesis 42 onward the brothers travel to Egypt for food and at first do not recognise Joseph."}],2,{"he": "חפשו את הפרט שמבדיל אותו מן האחרים.", "ar": "ابحثوا عن التفصيل الذي يميزه عن غيره.", "ru": "Ищите отличие от остальных вариантов.", "en": "Look for the detail that separates it from the others."},{"he": "הפירוש מוביל להצעה מעשית לאגור מזון בשנות השובע.", "ar": "يؤدي التفسير إلى خطة عملية لتخزين الطعام زمن الخصب.", "ru": "Толкование ведёт к практическому плану запаса продовольствия.", "en": "The reading leads to a plan to store food during plenty."},null,[{"he": "זה מתאר את הבטחה לאברהם, לא את חלומות פרעה ופירוש יוסף.", "ar": "هذا يصف الوعد لإبراهيم، لا أحلام فرعون وتفسير يوسف.", "ru": "Это описание «Обещание Аврааму», а не «Сны фараона и толкование Иосифа».", "en": "That describes promise to Abraham, not Pharaoh’s dreams and Joseph’s reading."},{"he": "זה מתאר את קניית מערת המכפלה, לא את חלומות פרעה ופירוש יוסף.", "ar": "هذا يصف شراء مغارة المكفيلة، لا أحلام فرعون وتفسير يوسف.", "ru": "Это описание «Покупка пещеры Махпела», а не «Сны фараона и толкование Иосифа».", "en": "That describes purchase of Machpelah, not Pharaoh’s dreams and Joseph’s reading."},null,{"he": "זה מתאר את מפגש יוסף ואחיו, לא את חלומות פרעה ופירוש יוסף.", "ar": "هذا يصف لقاء يوسف بإخوته، لا أحلام فرعون وتفسير يوسف.", "ru": "Это описание «Встреча Иосифа с братьями», а не «Сны фараона и толкование Иосифа».", "en": "That describes Joseph meets his brothers, not Pharaoh’s dreams and Joseph’s reading."}])
 ,Q("bib-gen-machpela",{"he": "מדוע חשוב שאברהם משלם מחיר מלא על מערת המכפלה?", "ar": "لماذا من المهم أن يدفع إبراهيم الثمن كاملًا مقابل مغارة المكفيلة؟", "ru": "Почему важно, что Авраам платит полную цену за пещеру Махпела?", "en": "Why does it matter that Abraham pays the full price for the cave of Machpelah?"},[{"he": "תשלום מלא מעגן זכות קבועה בארץ, בלי תלות בטובה של אחרים", "ar": "الدفع الكامل يرسّخ حقًا ثابتًا في الأرض دون الاعتماد على معروف من الآخرين", "ru": "Полная оплата закрепляет постоянное право на землю, без зависимости от чужой любезности", "en": "Full payment secures a permanent right to the land, without depending on anyone's favor"},{"he": "התשלום המלא מראה לכל תושבי הארץ והסובבים אותה שאברהם איש עשיר ביותר", "ar": "الدفع الكامل يُظهر لكل سكان الأرض ومَن حولها أن إبراهيم رجل غني للغاية", "ru": "Полная оплата показывает всем жителям страны и её соседям, что Авраам человек очень богатый", "en": "The full payment shows all the land's inhabitants and its neighbors that Abraham is a very wealthy man"},{"he": "העסקה נועדה למנוע ריב עם בני חת", "ar": "الصفقة تهدف إلى منع نزاع مع بني حث", "ru": "Сделка призвана предотвратить ссору с сынами Хета", "en": "The deal is meant to prevent a quarrel with the Hittites"},{"he": "המערה היא המקום היחיד שמתאים לקבורה בארץ", "ar": "المغارة هي المكان الوحيد المناسب للدفن في الأرض", "ru": "Пещера - единственное подходящее место для погребения в стране", "en": "The cave is the only burial-suitable place in the land"}],0,{"he": "חשבו מה קנייה בכסף מלא נותנת שמתנה אינה נותנת.", "ar": "فكّروا ما الذي يعطيه الشراء بثمن كامل ولا تعطيه الهدية.", "ru": "Подумайте, что даёт покупка за полную цену и чего не даёт подарок.", "en": "Think about what buying at full price gives that a gift does not."},{"he": "בני חת מציעים את השדה במתנה, אך אברהם מתעקש לשלם ארבע מאות שקל כסף. דוגמה: כששדה ניתן במתנה, הזכות בו תלויה בטוב לב של הנותן; כשמשלמים, הזכות קבועה. לכן הפרק מדגיש את המשא ומתן הגלוי.", "ar": "بنو حث يعرضون الحقل هدية، لكن إبراهيم يصر على دفع أربعمائة شاقل. مثال: حين يُعطى الحقل هدية يبقى الحق معلقًا بحسن نية المعطي؛ حين يُدفع الثمن يصبح الحق ثابتًا. لذلك يؤكد الفصل على التفاوض العلني.", "ru": "Сыновья Хета предлагают поле в дар, но Авраам настаивает на уплате четырехсот сиклей. Пример: когда поле дарят, право зависит от доброй воли дарителя; когда платят, право становится постоянным. Поэтому глава подчёркивает открытые переговоры.", "en": "The Hittites offer the field as a gift, but Abraham insists on paying four hundred shekels. Example: when a field is a gift, the right to it depends on the giver's goodwill; when it is paid for, the right is permanent. That is why the chapter stresses the open negotiation."},null,[null,{"he": "העושר אינו הנושא; הפרק עוסק בזכות, לא בהצגת כסף.", "ar": "الغنى ليس الموضوع؛ الفصل عن الحق لا عن إظهار المال.", "ru": "Богатство не тема; глава о праве, а не о демонстрации денег.", "en": "Wealth is not the subject; the chapter is about rights, not showing money."},{"he": "לא היה ריב; בני חת הציעו מתנה, ואברהם בחר לשלם.", "ar": "لم يكن نزاع؛ بنو حث عرضوا هدية واختار إبراهيم الدفع.", "ru": "Ссоры не было; сыновья Хета предложили дар, а Авраам решил заплатить.", "en": "There was no quarrel; the Hittites offered a gift and Abraham chose to pay."},{"he": "המקום מצוין, אבל הדגש של הפרק הוא על אופן הרכישה.", "ar": "المكان ممتاز، لكن تأكيد الفصل على طريقة الشراء.", "ru": "Место прекрасно, но акцент главы - на способе приобретения.", "en": "The place is excellent, but the chapter's stress is on the way it was acquired."}]),Q("bib-gen-sodom",{"he": "מה מלמד עמידתו של אברהם מול אלוהים בעניין סדום בבראשית י\"ח?", "ar": "ماذا يعلّم وقوف إبراهيم أمام الله في شأن سدوم في التكوين 18؟", "ru": "Чему учит стояние Авраама перед Богом по вопросу Содома в Бытии 18?", "en": "What does Abraham's standing before God over Sodom in Genesis 18 teach?"},[{"he": "שאפשר וצריך לבקש צדק, בלשון ענווה והתעקשות כאחת", "ar": "أنه يمكن ويجب طلب العدل، بلغة تواضع وإصرار معًا", "ru": "Что можно и нужно просить о справедливости, сочетая смирение и настойчивость", "en": "That one may and should plead for justice, combining humility and persistence"},{"he": "אברהם פוחד מפני בני סדום ומפני בני עמורה, ולכן הוא מתחנן לפני אלוהים", "ar": "إبراهيم يخاف من أهل سدوم وعمورة، ولذلك يتوسل أمام الله", "ru": "Авраам боится жителей Содома и Гоморры, и потому умоляет перед Богом", "en": "Abraham fears the people of Sodom and Gomorrah, and so he pleads before God"},{"he": "שאלוהים משנה את דעתו בקלות רבה", "ar": "أن الله يغيّر رأيه بسهولة كبيرة", "ru": "Что Бог легко меняет своё мнение", "en": "That God easily changes His mind"},{"he": "שאברהם רצה להציל רק את לוט", "ar": "أن إبراهيم أراد إنقاذ لوط فقط", "ru": "Что Авраам хотел спасти только Лота", "en": "That Abraham wanted to save only Lot"}],0,{"he": "שימו לטון הדברים ולדפוס החוזר של השאלות.", "ar": "انتبهوا إلى نبرة الكلام ونمط الأسئلة المتكرر.", "ru": "Обратите внимание на тон речи и повторяющийся образец вопросов.", "en": "Notice the tone of the speech and the repeating pattern of the questions."},{"he": "אברהם שואל שוב ושוב: 'אולי יימצאון חמישים צדיקים' ואחר כך ארבעים, שלושים. דוגמה ללשון: 'הנני עפר ואפר'. הוא מבקש צדק לכולם, לא רק לקרוביו, ומדבר בענווה אך בלי לוותר.", "ar": "يسأل إبراهيم مرارًا: «لعله يوجد خمسون صدّيقًا» ثم أربعين فثلاثين. مثال على اللغة: «إنما أنا تراب ورماد». يطلب العدل للجميع لا لأقاربه فقط، ويتكلم بتواضع دون أن يستسلم.", "ru": "Авраам спрашивает снова и снова: «может быть, есть там пятьдесят праведников», затем сорок, тридцать. Пример языка: «я прах и пепел». Он просит справедливости для всех, не только для близких, и говорит смиренно, но не отступает.", "en": "Abraham asks again and again: \"perhaps there are fifty righteous\", then forty, thirty. A language example: \"I am but dust and ashes\". He pleads for justice for everyone, not only his kin, and speaks humbly but does not give up."},null,[null,{"he": "אין בפרק פחד מפני אנשים; אברהם פונה לאלוהים ישירות.", "ar": "لا خوف من الناس في الفصل؛ إبراهيم يخاطب الله مباشرة.", "ru": "В главе нет страха перед людьми; Авраам обращается к Богу напрямую.", "en": "There is no fear of people in the chapter; Abraham addresses God directly."},{"he": "ההדגשה היא על הצדק ועל בקשתו, לא על שינוי דעת.", "ar": "التأكيد على العدل وطلبه، لا على تغيير الرأي.", "ru": "Акцент на справедливости и просьбе о ней, а не на смене мнения.", "en": "The stress is on justice and pleading for it, not on a change of mind."},{"he": "לוט אינו מוזכר בדיאלוג; אברהם מדבר על הצדיקים שבעיר.", "ar": "لوط لا يُذكر في الحوار؛ إبراهيم يتكلم عن الصدّيقين في المدينة.", "ru": "Лот не упомянут в диалоге; Авраам говорит о праведниках в городе.", "en": "Lot is not mentioned in the dialogue; Abraham speaks of the righteous in the city."}]),
  Q("gen-2-01",{"he": "לפי דברי רבקה ליעקב, מדוע עליו לברוח אל לבן?", "ar": "بحسب كلام رفقة ليعقوب، لماذا عليه أن يهرب إلى لابان؟", "ru": "Почему, по словам Ревекки Иакову, он должен бежать к Лавану?", "en": "According to Rebekah's words to Jacob, why must he flee to Laban?"},[{"he": "כדי לשאת אישה ממשפחת אמו", "ar": "ليتزوج امرأة من عائلة أمه", "ru": "Чтобы жениться на девушке из семьи матери", "en": "To marry a woman from his mother's family"}, {"he": "עשו מתכנן להרוג אותו בגלל הברכה", "ar": "عيسو يخطط لقتله بسبب البركة", "ru": "Исав замышляет убить его из-за благословения", "en": "Esau plans to kill him because of the blessing"}, {"he": "כי רעב כבד פרץ בארץ כנען", "ar": "لأن جوعًا شديدًا وقع في أرض كنعان", "ru": "Потому что в Ханаане начался сильный голод", "en": "Because a severe famine broke out in Canaan"}, {"he": "כי יצחק ציווה עליו לעבוד אצל לבן", "ar": "لأن إسحاق أمره أن يعمل عند لابان", "ru": "Потому что Исаак велел ему работать у Лавана", "en": "Because Isaac ordered him to work for Laban"}],1,{"he": "חשבו מה עשו הרגיש אחרי שאיבד את הברכה.", "ar": "فكّروا بما شعر به عيسو بعد أن خسر البركة.", "ru": "Подумайте, что чувствовал Исав, потеряв благословение.", "en": "Think about how Esau felt after losing the blessing."},{"he": "בבראשית כ״ז עשו שונא את יעקב ומתכנן להרוג אותו. רבקה שומעת ואומרת ליעקב לברוח לחרן. לפני יצחק היא מציגה סיבה אחרת: מציאת אישה.", "ar": "في التكوين 27 يكره عيسو يعقوب ويخطط لقتله. تسمع رفقة وتقول ليعقوب أن يهرب إلى حاران. وأمام إسحاق تذكر سببًا آخر: إيجاد زوجة.", "ru": "В Бытии 27 Исав ненавидит Иакова и замышляет убить его. Ревекка узнаёт и велит Иакову бежать в Харран. Исааку она называет другую причину: найти жену.", "en": "In Genesis 27 Esau hates Jacob and plans to kill him. Rebekah hears and tells Jacob to flee to Haran. To Isaac she gives another reason: finding a wife."},null,[{"he": "על אישה רבקה מדברת עם יצחק. ליעקב היא מדברת על הסכנה מעשו.", "ar": "عن الزوجة تتكلم رفقة مع إسحاق. أما ليعقوب فتتكلم عن الخطر من عيسو.", "ru": "О жене Ревекка говорит с Исааком. Иакову она говорит об опасности от Исава.", "en": "Rebekah talks about a wife with Isaac. To Jacob she speaks about the danger from Esau."}, null, {"he": "רעב אינו מוזכר כאן. זו סיבה מסיפורים אחרים בבראשית.", "ar": "الجوع لا يُذكر هنا. هذا سبب من قصص أخرى في التكوين.", "ru": "Голод здесь не упоминается. Это причина из других историй Бытия.", "en": "Famine is not mentioned here. That reason comes from other Genesis stories."}, {"he": "יצחק לא ציווה לעבוד. העבודה אצל לבן מתחילה רק בגלל רחל.", "ar": "إسحاق لم يأمره بالعمل. العمل عند لابان يبدأ فقط بسبب راحيل.", "ru": "Исаак не велел работать. Работа у Лавана начинается только из-за Рахили.", "en": "Isaac did not order any work. The work for Laban begins only because of Rachel."}]),
  Q("gen-2-02",{"he": "לפי בראשית ל״ז, מה הוסיף לשנאת האחים כלפי יוסף?", "ar": "بحسب التكوين 37، ما الذي زاد كراهية الإخوة ليوسف؟", "ru": "Что, согласно Бытию 37, усилило ненависть братьев к Иосифу?", "en": "According to Genesis 37, what added to the brothers' hatred of Joseph?"},[{"he": "סירובו לרעות עמם את הצאן", "ar": "رفضه أن يرعى الغنم معهم", "ru": "Его отказ пасти с ними скот", "en": "His refusal to tend the flock with them"}, {"he": "קבלת הבכורה מידי אביו", "ar": "حصوله على البكورية من أبيه", "ru": "Получение первородства от отца", "en": "Receiving the birthright from his father"}, {"he": "נישואיו לאישה מצרית", "ar": "زواجه من امرأة مصرية", "ru": "Его женитьба на египтянке", "en": "His marriage to an Egyptian woman"}, {"he": "החלומות שסיפר להם", "ar": "الأحلام التي رواها لهم", "ru": "Сны, которые он им рассказал", "en": "The dreams he told them"}],3,{"he": "חפשו מה יוסף עשה בלילה וסיפר בבוקר.", "ar": "ابحثوا عمّا فعله يوسف في الليل وحكاه في الصباح.", "ru": "Найдите, что Иосиф «делал» ночью и рассказывал утром.", "en": "Look for what Joseph did at night and told in the morning."},{"he": "האחים כבר שנאו את יוסף בגלל אהבת האב והכתונת. אחרי שסיפר את חלומו, הכתוב אומר שהוסיפו לשנוא אותו. בחלום האלומות שלהם משתחוות לאלומה שלו.", "ar": "كان الإخوة يكرهون يوسف بسبب محبة الأب والقميص. وبعد أن روى حلمه، يقول النص إنهم ازدادوا كراهية له. في الحلم تسجد حزمهم لحزمته.", "ru": "Братья уже ненавидели Иосифа из-за любви отца и рубашки. После его сна текст говорит, что они возненавидели его ещё больше. Во сне их снопы кланяются его снопу.", "en": "The brothers already hated Joseph because of their father's love and the coat. After he told his dream, the text says they hated him even more. In the dream their sheaves bow to his sheaf."},null,[{"he": "יוסף רעה עם אחיו, ויצא אליהם כשאביו שלח אותו.", "ar": "يوسف رعى مع إخوته، وخرج إليهم حين أرسله أبوه.", "ru": "Иосиф пас с братьями и пошёл к ним, когда отец его послал.", "en": "Joseph tended sheep with his brothers and went to them when his father sent him."}, {"he": "בפרק ל״ז אין שום העברה של בכורה. זו הכתונת, לא הבכורה.", "ar": "لا انتقال للبكورية في الإصحاح 37. هذا القميص، لا البكورية.", "ru": "В главе 37 первородство не передаётся. Речь о рубашке, а не о первородстве.", "en": "No birthright is passed on in chapter 37. It is the coat, not the birthright."}, {"he": "יוסף מתחתן רק בפרק מ״א, הרבה אחרי המכירה.", "ar": "يوسف يتزوج في الإصحاح 41 فقط، بعد البيع بكثير.", "ru": "Иосиф женится только в главе 41, намного позже продажи.", "en": "Joseph marries only in chapter 41, long after the sale."}, null]),
  Q("gen-2-03",{"he": "לפי בראשית ל״ב, מדוע נקרא יעקב בשם ישראל?", "ar": "بحسب التكوين 32، لماذا دُعي يعقوب إسرائيل؟", "ru": "Почему, согласно Бытию 32, Иаков назван Израилем?", "en": "According to Genesis 32, why is Jacob named Israel?"},[{"he": "כי נאבק עם אלוהים ועם אנשים, ויכול", "ar": "لأنه جاهد مع الله ومع الناس وقدر", "ru": "Потому что боролся с Богом и людьми и одолел", "en": "Because he struggled with God and with men, and prevailed"}, {"he": "כי ראה את אלוהים פנים אל פנים ונשאר חי", "ar": "لأنه رأى الله وجهًا لوجه ونجت نفسه", "ru": "Потому что видел Бога лицом к лицу и остался жив", "en": "Because he saw God face to face and survived"}, {"he": "כי הוא אבי שנים־עשר השבטים", "ar": "لأنه أبو الأسباط الاثني عشر", "ru": "Потому что он отец двенадцати колен", "en": "Because he is the father of the twelve tribes"}, {"he": "כי קיבל את הברכה מיצחק אביו", "ar": "لأنه نال البركة من إسحاق أبيه", "ru": "Потому что получил благословение от Исаака", "en": "Because he received the blessing from his father Isaac"}],0,{"he": "השם ניתן מיד אחרי המאבק בלילה.", "ar": "الاسم أُعطي مباشرة بعد الصراع في الليل.", "ru": "Имя дано сразу после ночной борьбы.", "en": "The name is given right after the night struggle."},{"he": "בבראשית ל״ב יעקב נאבק עם איש עד עלות השחר. האיש אומר: ״כי שרית עם אלהים ועם אנשים ותוכל״. מן הפועל ״שרית״ בא השם ישראל.", "ar": "في التكوين 32 يصارع يعقوب رجلًا حتى طلوع الفجر. يقول الرجل إنه جاهد مع الله والناس وقدر. ومن فعل «الجهاد» هذا يأتي اسم إسرائيل.", "ru": "В Бытии 32 Иаков борется с человеком до зари. Тот говорит: ты боролся с Богом и людьми и одолел. От этого глагола «боролся» и идёт имя Израиль.", "en": "In Genesis 32 Jacob wrestles with a man until dawn. The man says he struggled with God and men and prevailed. The name Israel comes from that verb, to struggle."},null,[null, {"he": "זה ההסבר לשם המקום פניאל, ולא לשם ישראל.", "ar": "هذا تفسير اسم المكان فنيئيل، لا اسم إسرائيل.", "ru": "Так объясняется название места Пенуэл, а не имя Израиль.", "en": "That explains the place name Peniel, not the name Israel."}, {"he": "זו עובדה נכונה, אבל הכתוב אינו מסביר בה את השם.", "ar": "هذه حقيقة صحيحة، لكن النص لا يفسّر بها الاسم.", "ru": "Это верно, но текст не так объясняет имя.", "en": "That is true, but the text does not explain the name this way."}, {"he": "הברכה מיצחק קרתה שנים קודם, ולא בה נקשר השם.", "ar": "البركة من إسحاق كانت قبل سنين، ولا يرتبط بها الاسم.", "ru": "Благословение Исаака было за годы до этого; имя с ним не связано.", "en": "Isaac's blessing came years earlier; the name is not tied to it."}]),
  Q("gen-2-04",{"he": "מה מסביר יוסף לאשת פוטיפר כשהוא מסרב לה?", "ar": "بماذا يعلّل يوسف لامرأة فوطيفار حين يرفضها؟", "ru": "Чем Иосиф объясняет жене Потифара свой отказ?", "en": "How does Joseph explain his refusal to Potiphar's wife?"},[{"he": "הוא חושש שאחד מעבדי הבית יראה אותם", "ar": "يخشى أن يراهما أحد عبيد البيت", "ru": "Он боится, что их увидит кто-то из слуг", "en": "He fears one of the household servants will see them"}, {"he": "הוא רוצה לחזור בקרוב אל בית אביו", "ar": "يريد أن يعود قريبًا إلى بيت أبيه", "ru": "Он хочет скоро вернуться в дом отца", "en": "He wants to return soon to his father's house"}, {"he": "אדוניו סמך עליו, וזה חטא לאלוהים", "ar": "سيده وثق به، وهذا خطيئة إلى الله", "ru": "Господин доверял ему, и это грех перед Богом", "en": "His master trusted him, and it is a sin against God"}, {"he": "הוא כבר נשוי לאישה אחרת", "ar": "هو متزوج بامرأة أخرى", "ru": "Он уже женат на другой", "en": "He is already married to another woman"}],2,{"he": "יוסף מדבר על שני צדדים: אדם ואלוהים.", "ar": "يوسف يتكلم عن جهتين: إنسان والله.", "ru": "Иосиф говорит о двух сторонах: о человеке и о Боге.", "en": "Joseph speaks about two sides: a person and God."},{"he": "בבראשית ל״ט יוסף אומר שאדוניו מסר הכול בידו. הוא שואל: ״ואיך אעשה הרעה הגדלה הזאת וחטאתי לאלהים״. הסירוב נשען על נאמנות לאדם ולאלוהים.", "ar": "في التكوين 39 يقول يوسف إن سيده سلّمه كل شيء. ويسأل كيف يصنع هذا الشر العظيم ويخطئ إلى الله. الرفض قائم على الأمانة للإنسان ولله.", "ru": "В Бытии 39 Иосиф говорит, что господин доверил ему всё. Он спрашивает: как сделаю я это великое зло и согрешу перед Богом? Отказ основан на верности человеку и Богу.", "en": "In Genesis 39 Joseph says his master put everything in his hands. He asks how he could do this great wickedness and sin against God. The refusal rests on loyalty to a person and to God."},null,[{"he": "הכתוב מדגיש שאיש מאנשי הבית לא היה שם.", "ar": "النص يؤكد أنه لم يكن أحد من أهل البيت هناك.", "ru": "Текст подчёркивает, что никого из домашних там не бы
