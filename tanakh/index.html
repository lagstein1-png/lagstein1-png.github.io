  Q("gen-2-05",{"he": "מה ביקש אברהם מעבדו כשנשלח למצוא אישה ליצחק?", "ar": "ماذا طلب إبراهيم من خادمه حين أرسله ليجد زوجة لإسحاق؟", "ru": "О чём Авраам попросил раба, посылая его найти жену Исааку?", "en": "What did Abraham ask of his servant when sending him to find a wife for Isaac?"},[{"he": "לקחת את יצחק לחרן, כדי שיבחר אישה בעצמו", "ar": "أن يأخذ إسحاق إلى حاران ليختار زوجة بنفسه", "ru": "Отвести Исаака в Харран, чтобы он сам выбрал жену", "en": "Take Isaac to Haran so he can choose a wife himself"}, {"he": "לבחור אישה מבנות הכנעני, שגרות קרוב אליהם", "ar": "أن يختار زوجة من بنات الكنعانيين القريبات منهم", "ru": "Выбрать жену из дочерей ханаанеев, живущих рядом с ними", "en": "Choose a wife from the Canaanite women living near them"}, {"he": "למצוא אישה במצרים, ארצה של הגר", "ar": "أن يجد زوجة في مصر، أرض هاجر", "ru": "Найти жену в Египте, на родине Агари", "en": "Find a wife in Egypt, Hagar's homeland"}, {"he": "להביא אישה ממשפחתו, בלי להחזיר לשם את יצחק", "ar": "أن يأتي بزوجة من عشيرته دون أن يعيد إسحاق إلى هناك", "ru": "Привести жену из его родни, не возвращая туда Исаака", "en": "Bring a wife from his family, without taking Isaac back there"}],3,{"he": "יש בבקשה שני חלקים: מאיפה האישה, ולאן לא הולך יצחק.", "ar": "في الطلب جزءان: من أين الزوجة، وإلى أين لا يذهب إسحاق.", "ru": "В просьбе две части: откуда жена и куда Исаак не идёт.", "en": "The request has two parts: where the wife comes from, and where Isaac must not go."},{"he": "בבראשית כ״ד העבד נשבע לא לקחת ליצחק אישה מבנות הכנעני. עליו ללכת לארצו ולמשפחתו של אברהם. ואם האישה תסרב לבוא, אסור להשיב את יצחק לשם.", "ar": "في التكوين 24 يقسم الخادم ألّا يأخذ لإسحاق زوجة من بنات الكنعانيين. عليه أن يذهب إلى أرض إبراهيم وعشيرته. وإن رفضت المرأة المجيء، فلا يُعاد إسحاق إلى هناك.", "ru": "В Бытии 24 раб клянётся не брать Исааку жену из дочерей ханаанеев. Он должен идти на родину Авраама, к его родне. А если женщина не захочет прийти, Исаака туда не возвращать.", "en": "In Genesis 24 the servant swears not to take Isaac a Canaanite wife. He must go to Abraham's land and family. If the woman refuses to come, Isaac must not be taken back there."},null,[{"he": "אברהם מזהיר את העבד במפורש לא להשיב את יצחק לשם.", "ar": "إبراهيم يحذّر الخادم صراحة ألا يعيد إسحاق إلى هناك.", "ru": "Авраам прямо запрещает рабу возвращать туда Исаака.", "en": "Abraham explicitly warns the servant not to take Isaac back there."}, {"he": "זה ההפך מן השבועה: לא לקחת אישה מבנות הכנעני.", "ar": "هذا عكس القسم: ألّا يأخذ زوجة من بنات الكنعانيين.", "ru": "Это противоположно клятве: не брать жену из дочерей ханаанеев.", "en": "That is the opposite of the oath: not to take a wife from the Canaanites."}, {"he": "מצרים אינה מוזכרת בציווי. אישה ממצרים לוקח דווקא ישמעאל.", "ar": "مصر لا تُذكر في الأمر. إسماعيل هو من يأخذ زوجة من مصر.", "ru": "Египет в поручении не упоминается. Жену из Египта берёт как раз Измаил.", "en": "Egypt is not in the instruction. It is Ishmael who takes a wife from Egypt."}, null]),

и тогда Агарь убежала.", "en": "That happened in chapter 16, before Ishmael was born, and made Hagar run away."}, null, {"he": "הכתוב אומר רק שישמעאל ״מצחק״. הוא אינו מתאר פגיעה.", "ar": "النص يقول فقط إن إسماعيل كان «يمزح». لا يصف أذى.", "ru": "Текст говорит лишь, что Измаил «насмехался». Вреда он не описывает.", "en": "The text only says Ishmael was 'laughing'. It does not describe harm."}, {"he": "שרה מבקשת ראשונה. רק אחר כך אלוהים אומר לאברהם לשמוע לה.", "ar": "سارة تطلب أولًا. وبعد ذلك فقط يقول الله لإبراهيم أن يسمع لها.", "ru": "Сарра просит первой. Лишь потом Бог говорит Аврааму послушать её.", "en": "Sarah asks first. Only then does God tell Abraham to listen to her."}])],

  Q("bib-genesis-1261-4",{"he": "איזה תיאור מתאים למפגש יוסף ואחיו?", "ar": "أي وصف يناسب لقاء يوسف بإخوته؟", "ru": "Какое описание подходит к «Встреча Иосифа с братьями»?", "en": "Which description fits Joseph meets his brothers?"},[{"he": "בבראשית י״ב מסופר על קריאה לצאת מארצו והבטחה לזרע ולברכה.", "ar": "في التكوين 12 ترد دعوة للخروج من الأرض ووعد بالنسل والبركة.", "ru": "В Бытии 12 рассказаны призыв оставить страну и обещание потомства и благословения.", "en": "Genesis 12 recounts a call to leave his land and a promise of descendants and blessing."},{"he": "בבראשית כ״ג אברהם קונה מקום לקבורת שרה במשא ומתן גלוי.", "ar": "في التكوين 23 يشتري إبراهيم موضعًا لدفن سارة في تفاوض علني.", "ru": "В Бытии 23 Авраам покупает место для погребения Сарры путём открытых переговоров.", "en": "In Genesis 23 Abraham buys a burial place for Sarah through public negotiation."},{"he": "בבראשית מ״א יוסף מפרש את החלומות כשנות שובע ואחריהן שנות רעב ומציע להיערך מראש.", "ar": "في التكوين 41 يفسر يوسف الحلمين بسنوات خصب تليها سنوات جوع ويقترح الاستعداد.", "ru": "В Бытии 41 Иосиф толкует сны как годы изобилия, затем голода, и предлагает подготовиться.", "en": "In Genesis 41 Joseph reads the dreams as years of plenty followed by famine and proposes preparation."},{"he": "בבראשית מ״ב ואילך האחים באים למצרים לקנות מזון ואינם מזהים תחילה את יוסף.", "ar": "في التكوين 42 وما بعده يأتي الإخوة إلى مصر لشراء الطعام ولا يعرفون يوسف أولًا.", "ru": "В Бытии 42 и далее братья приходят за пищей в Египет и сначала не узнают Иосифа.", "en": "In Genesis 42 onward the brothers travel to Egypt for food and at first do not recognise Joseph."}],3,{"he": "חפשו את הפרט שמבדיל אותו מן האחרים.", "ar": "ابحثوا عن التفصيل الذي يميزه عن غيره.", "ru": "Ищите отличие от остальных вариантов.", "en": "Look for the detail that separates it from the others."},{"he": "פער הידיעה בין יוסף לאחים מניע את המפגשים.", "ar": "اختلاف المعرفة بين يوسف وإخوته يدفع اللقاءات.", "ru": "Разница в знаниях Иосифа и братьев движет встречами.", "en": "The knowledge gap between Joseph and his brothers drives their encounters."},null,[{"he": "זה מתאר את הבטחה לאברהם, לא את מפגש יוסף ואחיו.", "ar": "هذا يصف الوعد لإبراهيم، لا لقاء يوسف بإخوته.", "ru": "Это описание «Обещание Аврааму», а не «Встреча Иосифа с братьями».", "en": "That describes promise to Abraham, not Joseph meets his brothers."},{"he": "זה מתאר את קניית מערת המכפלה, לא את מפגש יוסף ואחיו.", "ar": "هذا يصف شراء مغارة المكفيلة، لا لقاء يوسف بإخوته.", "ru": "Это описание «Покупка пещеры Махпела», а не «Встреча Иосифа с братьями».", "en": "That describes purchase of Machpelah, not Joseph meets his brothers."},{"he": "זה מתאר את חלומות פרעה ופירוש יוסף, לא את מפגש יוסף ואחיו.", "ar": "هذا يصف أحلام فرعون وتفسير يوسف، لا لقاء يوسف بإخوته.", "ru": "Это описание «Сны фараона и толкование Иосифа», а не «Встреча Иосифа с братьями».", "en": "That describes Pharaoh’s dreams and Joseph’s reading, not Joseph meets his brothers."},null])
 ,Q("bib-gen-joseph-change",{"he": "איזו בחירה של יוסף מראית את השינוי הפנימי שהוא עבר?", "ar": "أي اختيار ليوسف يُظهر التغيير الداخلي الذي مرّ به؟", "ru": "Какой выбор Иосифа показывает его внутреннюю перемену?", "en": "Which choice of Joseph shows the inner change he went through?"},[{"he": "הוא בוחר לסלוח ומסביר את מה שקרה כתוכנית גדולה יותר, במקום לנקום", "ar": "يختار أن يغفر ويفسر ما حدث كخطة أكبر، بدلًا من الانتقام", "ru": "Он выбирает простить и объясняет случившееся как больший план, вместо мести", "en": "He chooses to forgive and explains what happened as a larger plan, instead of taking revenge"},{"he": "הוא מעניש את האחים בדיוק כפי שהם עשו לו", "ar": "يعاقب إخوته تمامًا كما فعلوا به", "ru": "Он наказывает братьев ровно так, как они поступили с ним", "en": "He punishes the brothers exactly as they did to him"},{"he": "הוא דורש כסף רב על המזון שהוא נותן להם", "ar": "يطلب مالًا كثيرًا مقابل الطعام الذي يعطيهم", "ru": "Он требует много денег за пищу, которую даёт им", "en": "He demands much money for the food he gives them"},{"he": "הוא שולח את בנימין למצרים לבדו", "ar": "يرسل بنيامين إلى مصر وحده", "ru": "Он отправляет Вениамина в Египет одного", "en": "He sends Benjamin to Egypt alone"}],0,{"he": "השוו את התנהגותו עכשיו למה שהיה סביב המכירה.", "ar": "قارنوا سلوكه الآن بما كان عند البيع.", "ru": "Сравните его поведение теперь с тем, что было при продаже.", "en": "Compare his behavior now with what happened around the sale."},{"he": "יוסף אומר לאחיו: 'אל תעצבו... אלוהים שלחני לפניכם למחיה' (בראשית מ\"ה). דוגמה: במקום לנקום, הוא מספר את הסיפור מחדש כהצלה של המשפחה כולה. זו בחירה מודעת, ולא שכחה של העבר.", "ar": "يقول يوسف لإخوته: «لا تحزنوا... الله أرسلني أمامكم للحياة» (التكوين 45). مثال: بدل الانتقام، يروي القصة من جديد كإنقاذ للعائلة كلها. هذا اختيار واعٍ وليس نسيانًا للماضي.", "ru": "Иосиф говорит братьям: «не печальтесь... Бог послал меня перед вами для жизни» (Бытие 45). Пример: вместо мести он пересказывает историю как спасение всей семьи. Это осознанный выбор, а не забвение прошлого.", "en": "Joseph tells his brothers: \"do not be grieved... God sent me before you to preserve life\" (Genesis 45). Example: instead of revenge, he retells the story as the rescue of the whole family. It is a conscious choice, not forgetting the past."},null,[null,{"he": "הנקמה לא מתרחשת; האחים מוזמנים לגור במצרים בכבוד.", "ar": "الانتقام لا يحدث؛ يُدعى الإخوة للسكن في مصر بكرامة.", "ru": "Мести не происходит; братьев приглашают жить в Египте с почётом.", "en": "No revenge happens; the brothers are invited to live in Egypt with honor."},{"he": "הכסף הוחזר לשקיהם; יוסף לא גובה על המזון.", "ar": "أُعيد المال إلى حقائبهم؛ يوسف لا يتقاضى ثمن الطعام.", "ru": "Деньги вернули в их мешки; Иосиф не берёт плату за пищу.", "en": "The money was returned to their sacks; Joseph does not charge for the food."},{"he": "בנימין בא עם האחים; יוסף לא שולח אותו לבדו.", "ar": "بنيامين يأتي مع الإخوة؛ يوسف لا يرسله وحده.", "ru": "Вениамин приходит с братьями; Иосиф не отправляет его одного.", "en": "Benjamin comes with the brothers; Joseph does not send him alone."}]),Q("bib-gen-luck",{"he": "תלמיד טוען שסיפור יוסף ואחיו הוא בעיקר סיפור על מזל. איזו התייחסות הולמת?", "ar": "يدّعي طالب أن قصة يوسف وإخوته أساسًا قصة حظ. أي معالجة مناسبة؟", "ru": "Ученик утверждает, что история Иосифа и его братьев - в основном история о везении. Какой подход уместен?", "en": "A student claims the story of Joseph and his brothers is mainly a story about luck. Which response is fitting?"},[{"he": "לראות שרשרת של בחירות אנושיות שדרכן מתממשת תוצאה משמעותית", "ar": "رؤية سلسلة من الاختيارات البشرية التي تتحقق عبرها نتيجة ذات معنى", "ru": "Увидеть цепь человеческих выборов, через которые осуществляется значимый результат", "en": "To see a chain of human choices through which a meaningful outcome comes about"},{"he": "לקבל את הטענה, כי הכל באמת קרה במקרה", "ar": "قبول الادعاء لأن كل شيء حدث صدفة حقًا", "ru": "Принять утверждение, ведь всё действительно случайность", "en": "To accept the claim, since everything really happened by chance"},{"he": "לדחות את הטענה, כי אין בסיפור שום תוצאה משמעותית", "ar": "رفض الادعاء لأنه لا توجد في القصة أي نتيجة ذات معنى", "ru": "Отвергнуть утверждение, ведь в истории нет никакого значимого результата", "en": "To reject the claim, since the story has no meaningful outcome at all"},{"he": "לומר שהטענה נכונה רק לגבי מלכים", "ar": "القول إن الادعاء صحيح فقط عن الملوك", "ru": "Сказать, что утверждение верно только о царях", "en": "To say the claim is true only about kings"}],0,{"he": "מצאו דוגמה שבה בחירה של אדם משנה את התוצאה.", "ar": "ابحثوا عن مثال يغيّر فيه اختيار إنسان النتيجة.", "ru": "Найдите пример, где выбор человека меняет результат.", "en": "Find an example where a person's choice changes the outcome."},{"he": "הסיפור מלא בבחירות: יעקב בוחר לשלוח את האחים, יוסף בוחר שלא לנקום, וכל בחירה מניעה את העלילה. דוגמה: בלי בחירתו של יוסף לסלוח, המשפחה לא הייתה ניצלת. לכן 'מזל' אינו הסבר מספק.", "ar": "القصة مليئة بالاختيارات: يعقوب يختار إرسال الإخوة، ويوسف يختار ألا ينتقم، وكل اختيار يحرك الحبكة. مثال: دون اختيار يوسف المغفرة لما نجت العائلة. لذلك «الحظ» ليس تفسيرًا كافيًا.", "ru": "История полна выборов: Иаков решает отправить братьев, Иосиф решает не мстить, и каждый выбор двигает сюжет. Пример: без решения Иосифа простить, семья не спаслась бы. Поэтому «везение» - недостаточное объяснение.", "en": "The story is full of choices: Jacob chooses to send the brothers, Joseph chooses not to take revenge, and every choice moves the plot. Example: without Joseph's choice to forgive, the family would not have been saved. So \"luck\" is not a sufficient explanation."},null,[null,{"he": "'מקרה' מתעלם משרשרת הבחירות שהסיפור מדגיש.", "ar": "«الصدفة» تتجاهل سلسلة الاختيارات التي تؤكدها القصة.", "ru": "«Случайность» игнорирует цепь выборов, которую история подчёркивает.", "en": "\"Chance\" ignores the chain of choices the story stresses."},{"he": "יש תוצאה משמעותית: הצלת המשפחה וישיבתה במצרים.", "ar": "توجد نتيجة ذات معنى: إنقاذ العائلة وإسكانها في مصر.", "ru": "Значимый результат есть: спасение семьи и её поселение в Египте.", "en": "There is a meaningful outcome: the family's rescue and settlement in Egypt."},{"he": "מלכים אינם נושא הטענה כלל.", "ar": "الملوك ليسوا موضوع الادعاء إطلاقًا.", "ru": "Цари вообще не тема утверждения.", "en": "Kings are not the subject of the claim at all."}]),
  Q("gen-3-01",{"he": "הצירוף ״הכר נא״ מופיע בבראשית ל״ז ובבראשית ל״ח. מה הקשר בין שני המקומות?", "ar": "تعبير «تحقّقْ» يرد في التكوين 37 و38. ما الصلة بين الموضعين؟", "ru": "Выражение «узнай же» звучит в Бытии 37 и 38. Что связывает эти места?", "en": "The phrase 'please recognize' appears in Genesis 37 and 38. What links the two places?"},[{"he": "מי שהטעה בראיה נדרש עכשיו להכיר בראיה", "ar": "مَن خدع بدليل يُطلب منه الآن أن يعترف بدليل", "ru": "Тот, кто обманул уликой, теперь должен признать улику", "en": "The one who deceived with evidence must now recognize evidence"}, {"he": "בשני המקומות מישהו מזהה את יוסף אחרי שנים", "ar": "في الموضعين يتعرّف أحدٌ على يوسف بعد سنين", "ru": "В обоих местах кто-то узнаёт Иосифа спустя годы", "en": "In both places someone recognizes Joseph after many years"}, {"he": "בשני המקומות הפנייה היא אל פרעה, מלך מצרים", "ar": "في الموضعين يكون الخطاب لفرعون ملك مصر", "ru": "В обоих местах обращаются к фараону", "en": "In both places the words are addressed to Pharaoh"}, {"he": "זו אותה סצנה, שמסופרת פעמיים במילים שונות", "ar": "هذا المشهد نفسه، يُروى مرتين بكلمات مختلفة", "ru": "Это одна сцена, рассказанная дважды разными словами", "en": "It is the same scene, told twice in different words"}],0,{"he": "השוו מי אומר ״הכר נא״, ולמי.", "ar": "قارنوا مَن يقول «تحقّقْ»، ولمن.", "ru": "Сравните, кто говорит «узнай же» и кому.", "en": "Compare who says 'please recognize', and to whom."},{"he": "בפרק ל״ז האחים שולחים ליעקב את הכתונת ואומרים ״הכר נא״. בפרק ל״ח תמר שולחת ליהודה את חפציו באותן מילים. פרשנים רואים כאן מידה כנגד מידה: מי שהטעה בראיה נדרש להודות בראיה.", "ar": "في الإصحاح 37 يرسل الإخوة القميص ليعقوب ويقولون «تحقّقْ». وفي 38 ترسل تامار ليهوذا أغراضه بالكلمات نفسها. يرى المفسرون هنا جزاءً من جنس العمل.", "ru": "В главе 37 братья присылают Иакову рубашку со словами «узнай же». В главе 38 Фамарь присылает Иуде его вещи с теми же словами. Комментаторы видят здесь «мера за меру».", "en": "In chapter 37 the brothers send Jacob the coat and say 'please recognize'. In chapter 38 Tamar sends Judah his items with the same words. Commentators see measure for measure here."},null,[null, {"he": "יוסף אינו מופיע בפרק ל״ח. מזהים שם חפצים של יהודה.", "ar": "يوسف لا يظهر في الإصحاح 38. هناك يُتعرَّف على أغراض يهوذا.", "ru": "Иосифа нет в главе 38. Там узнают вещи Иуды.", "en": "Joseph is not in chapter 38. There, Judah's belongings are recognized."}, {"he": "בפרק ל״ז הפנייה ליעקב, ובפרק ל״ח ליהודה.", "ar": "في الإصحاح 37 الخطاب ليعقوب، وفي 38 ليهوذا.", "ru": "В главе 37 обращаются к Иакову, а в главе 38 к Иуде.", "en": "In chapter 37 the words go to Jacob, and in chapter 38 to Judah."}, {"he": "אלה שני אירועים שונים, עם דמויות וחפצים אחרים.", "ar": "هذان حدثان مختلفان، بشخصيات وأغراض أخرى.", "ru": "Это два разных события, с другими героями и предметами.", "en": "These are two different events, with other characters and objects."}]),
  Q("gen-3-02",{"he": "לבן אומר: ״לא יעשה כן במקומנו לתת הצעירה לפני הבכירה״. מה האירוניה בדבריו?", "ar": "يقول لابان إنه لا يُفعل عندهم أن تُعطى الصغرى قبل الكبرى. ما المفارقة في كلامه؟", "ru": "Лаван говорит: у нас не выдают младшую прежде старшей. В чём ирония его слов?", "en": "Laban says that in their place the younger is not given before the elder. What is the irony?"},[{"he": "לבן מודה שטעה, ומבקש מיעקב סליחה", "ar": "لابان يعترف بخطئه ويطلب من يعقوب الصفح", "ru": "Лаван признаёт ошибку и просит у Иакова прощения", "en": "Laban admits his mistake and asks Jacob's forgiveness"}, {"he": "יעקב מקבל בסוף בדיוק את מה שביקש מלבן", "ar": "يعقوب ينال في النهاية بالضبط ما طلبه من لابان", "ru": "Иаков в итоге получает ровно то, что просил у Лавана", "en": "In the end Jacob gets exactly what he asked Laban for"}, {"he": "הצעיר שרימה את אביו מרומה בשם הבכירה", "ar": "الأصغر الذي خدع أباه يُخدع باسم البكورية", "ru": "Младший, обманувший отца, обманут во имя старшинства", "en": "The younger son who deceived his father is deceived in the name of seniority"}, {"he": "לבן מגן על רחל מפני יעקב", "ar": "لابان يحمي راحيل من يعقوب", "ru": "Лаван защищает Рахиль от Иакова", "en": "Laban protects Rachel from Jacob"}],2,{"he": "היזכרו איך קיבל יעקב את ברכת הבכור מיצחק.", "ar": "تذكّروا كيف نال يعقوب بركة البكر من إسحاق.", "ru": "Вспомните, как Иаков получил от Исаака благословение первенца.", "en": "Recall how Jacob got the firstborn's blessing from Isaac."},{"he": "בפרק כ״ז יעקב, הבן הצעיר, מתחפש לעשו הבכור ומרמה את אביו. בפרק כ״ט לבן מרמה אותו בשם זכות הבכירה. המרמה הופך למרומה, וזו האירוניה.", "ar": "في الإصحاح 27 يتنكّر يعقوب، الابن الأصغر، في هيئة عيسو البكر ويخدع أباه. وفي الإصحاح 29 يخدعه لابان باسم حق البكورية. المخادع يصير مخدوعًا، وهذه هي المفارقة.", "ru": "В главе 27 младший Иаков выдаёт себя за старшего Исава и обманывает отца. В главе 29 Лаван обманывает его во имя права старшей. Обманщик становится обманутым — в этом ирония.", "en": "In chapter 27 Jacob, the younger son, disguises himself as Esau the firstborn and deceives his father. In chapter 29 Laban deceives him in the name of the elder's right. The deceiver is deceived, and that is the irony."},null,[{"he": "לבן אינו מתנצל. הוא מצדיק את המעשה ודורש עוד שבע שנים.", "ar": "لابان لا يعتذر. يبرّر فعله ويطلب سبع سنين أخرى.", "ru": "Лаван не извиняется. Он оправдывается и требует ещё семь лет.", "en": "Laban does not apologize. He justifies the act and demands seven more years."}, {"he": "יעקב ביקש את רחל וקיבל את לאה. זה ההפך.", "ar": "يعقوب طلب راحيل وأخذ ليئة. هذا هو العكس.", "ru": "Иаков просил Рахиль, а получил Лию. Всё наоборот.", "en": "Jacob asked for Rachel and got Leah. It is the opposite."}, null, {"he": "לבן נותן גם את רחל אחרי שבוע. אין כאן הגנה עליה.", "ar": "لابان يعطي راحيل أيضًا بعد أسبوع. لا حماية لها هنا.", "ru": "Лаван отдаёт и Рахиль через неделю. Защиты здесь нет.", "en": "Laban gives Rachel too after a week. There is no protection of her here."}]),
  Q("gen-3-03",{"he": "הצירוף ״לך לך״ מופיע בבראשית י״ב ובבראשית כ״ב. מה מלמד החיבור ביניהם?", "ar": "تعبير «اذهب» يرد في التكوين 12 وفي التكوين 22. ماذا يعلّمنا الربط بينهما؟", "ru": "Слова «иди» (лех леха) звучат в Бытии 12 и 22. Чему учит эта связь?", "en": "The phrase 'go forth' (lekh lekha) appears in Genesis 12 and 22. What does the link teach?"},[{"he": "בשני המקומות אברהם יוצא אל אותו יעד", "ar": "في الموضعين يخرج إبراهيم إلى الوجهة نفسها", "ru": "В обоих местах Авраам идёт к одной цели", "en": "In both places Abraham sets out to the same destination"}, {"he": "שני ניסיונות: ויתור על העבר, ואחר כך על העתיד", "ar": "امتحانان: التخلّي عن الماضي، ثم عن المستقبل", "ru": "Два испытания: отказ от прошлого, а потом от будущего", "en": "Two tests: giving up the past, then the future"}, {"he": "בשני המקרים אברהם מסרב בתחילה ומתווכח עם אלוהים", "ar": "في الحالتين يرفض إبراهيم أولًا ويجادل الله", "ru": "В обоих случаях Авраам сначала отказывается и спорит с Богом", "en": "In both cases Abraham first refuses and argues with God"}, {"he": "הביטוי מופיע רק כשמישהו בורח מסכנה", "ar": "التعبير يظهر فقط حين يهرب أحد من خطر", "ru": "Выражение звучит только тогда, когда кто-то бежит от опасности", "en": "The phrase appears only when someone flees danger"}],1,{"he": "חשבו על מה אברהם מוותר בכל פעם.", "ar": "فكّروا بما يتخلّى عنه إبراهيم في كل مرة.", "ru": "Подумайте, от чего Авраам отказывается каждый раз.", "en": "Think about what Abraham gives up each time."},{"he": "בפרק י״ב אברהם עוזב ארץ, משפחה ובית אב, כלומר את העבר. בפרק כ״ב הוא נדרש לתת את יצחק, כלומר את העתיד. אותה מילה פותחת וסוגרת את מסע הניסיונות.", "ar": "في الإصحاح 12 يترك إبراهيم أرضه وعشيرته وبيت أبيه، أي الماضي. وفي 22 يُطلب منه أن يقدّم إسحاق، أي المستقبل. الكلمة نفسها تفتتح مسيرة الامتحانات وتختمها.", "ru": "В главе 12 Авраам оставляет землю, родню и отчий дом — то есть прошлое. В главе 22 от него требуют Исаака — то есть будущее. Одни и те же слова открывают и закрывают путь испытаний.", "en": "In chapter 12   Q("gen-3-04",{"he": "האחים אומרים: ״ונראה מה יהיו חלמתיו״ (בראשית ל״ז). מה האירוניה בהמשך?", "ar": "يقول الإخوة: «فنرى ماذا تكون أحلامه» (التكوين 37). ما المفارقة لاحقًا؟", "ru": "Братья говорят: «посмотрим, что будет из его снов» (Бытие 37). В чём ирония дальше?", "en": "The brothers say, 'we shall see what becomes of his dreams' (Genesis 37). What is the irony later?"},[{"he": "החלומות אינם מתגשמים בסוף, והאחים צדקו בדבריהם", "ar": "الأحلام لا تتحقق في النهاية، والإخوة كانوا محقّين في كلامهم", "ru": "Сны в итоге не сбываются, и братья были правы в своих словах", "en": "In the end the dreams never come true, and the brothers were right"}, {"he": "יוסף שוכח את חלומותיו ואינו נזכר בהם", "ar": "يوسف ينسى أحلامه ولا يتذكرها", "ru": "Иосиф забывает свои сны и не вспоминает о них", "en": "Joseph forgets his dreams and never recalls them"}, {"he": "האחים שולטים ביוסף גם אחרי שירד למצרים", "ar": "الإخوة يتسلّطون على يوسف حتى بعد نزوله إلى مصر", "ru": "Братья властвуют над Иосифом и после его ухода в Египет", "en": "The brothers rule over Joseph even after he goes down to Egypt"}, {"he": "המכירה, שנועדה לבטל את החלומות, הגשימה אותם", "ar": "البيع الذي قُصد به إبطال الأحلام حقّقها", "ru": "Продажа, задуманная, чтобы отменить сны, исполнила их", "en": "The sale, meant to cancel the dreams, fulfilled them"}],3,{"he": "בדקו מה קורה כשהאחים באים לקנות אוכל.", "ar": "تحقّقوا مما يحدث حين يأتي الإخوة لشراء الطعام.", "ru": "Посмотрите, что происходит, когда братья приходят за едой.", "en": "Check what happens when the brothers come to buy food."},{"he": "האחים מוכרים את יוסף כדי לבטל את חלומותיו. אבל המכירה מביאה אותו למצרים, ושם הוא עולה לגדולה. בפרק מ״ב הם משתחווים לו, בדיוק כמו בחלום.", "ar": "يبيع الإخوة يوسف ليُبطلوا أحلامه. لكن البيع يوصله إلى مصر، وهناك يرتفع شأنه. وفي الإصحاح 42 يسجدون له، تمامًا كما في الحلم.", "ru": "Братья продают Иосифа, чтобы его сны не сбылись. Но продажа приводит его в Египет, где он возвышается. В главе 42 они кланяются ему, точно как во сне.", "en": "The brothers sell Joseph to cancel his dreams. But the sale brings him to Egypt, where he rises to power. In chapter 42 they bow to him, just as in the dream."},null,[{"he": "בפרק מ״ב האחים משתחווים ליוסף אפיים ארצה.", "ar": "في الإصحاح 42 يسجد الإخوة ليوسف بوجوههم إلى الأرض.", "ru": "В главе 42 братья кланяются Иосифу лицом до земли.", "en": "In chapter 42 the brothers bow to Joseph with their faces to the ground."}, {"he": "הכתוב אומר שיוסף נזכר בחלומות כשראה את אחיו.", "ar": "النص يقول إن يوسف تذكّر الأحلام حين رأى إخوته.", "ru": "Текст говорит, что Иосиф вспомнил сны, увидев братьев.", "en": "The text says Joseph remembered the dreams when he saw his brothers."}, {"he": "במצרים יוסף הוא השליט, והאחים תלויים בו.", "ar": "في مصر يوسف هو الحاكم، والإخوة يعتمدون عليه.", "ru": "В Египте правитель — Иосиф, и братья зависят от него.", "en": "In Egypt Joseph is the ruler, and the brothers depend on him."}, null]),
  Q("gen-3-05",{"he": "בגדים חוזרים בסיפור יוסף: הכתונת, הבגד אצל אשת פוטיפר ובגדי השש. מה תפקידם?", "ar": "الثياب تتكرر في قصة يوسف: القميص، الثوب عند امرأة فوطيفار، وثياب الكتّان. ما دورها؟", "ru": "Одежда повторяется в истории Иосифа: рубашка, одежда у жены Потифара, льняные одежды. Какова её роль?", "en": "Clothing recurs in Joseph's story: the coat, the garment left with Potiphar's wife, the linen robes. What is its role?"},[{"he": "הם מסמנים כל ירידה וכל עלייה במעמדו", "ar": "تشير إلى كل هبوط وكل صعود في مكانته", "ru": "Они отмечают каждое падение и каждый подъём его положения", "en": "They mark every fall and every rise in his status"}, {"he": "הם מראים שיוסף עצמו בוחר כל פעם להחליף בגד", "ar": "تُظهر أن يوسف نفسه يختار تبديل ثوبه كل مرة", "ru": "Они показывают, что Иосиф сам каждый раз меняет одежду", "en": "They show that Joseph himself chooses each time to change clothes"}, {"he": "הם מסמנים רק את רגעי ההצלחה של יוסף", "ar": "تشير فقط إلى لحظات نجاح يوسف", "ru": "Они отмечают только моменты успеха Иосифа", "en": "They mark only Joseph's moments of success"}, {"he": "הם מראים שיוסף מסתיר את זהותו בעזרת תחפושת", "ar": "تُظهر أن يوسف يخفي هويته بالتنكّر", "ru": "Они показывают, что Иосиф скрывает себя переодеванием", "en": "They show that Joseph hides his identity with a disguise"}],0,{"he": "בדקו מה קורה ליוסף מיד אחרי כל בגד.", "ar": "تحقّقوا مما يحدث ليوسف بعد كل ثوب مباشرة.", "ru": "Посмотрите, что происходит с Иосифом сразу после каждой одежды.", "en": "Check what happens to Joseph right after each garment."},{"he": "הפשטת הכתונת מובילה לבור ולמכירה. הבגד שנשאר אצל אשת פוטיפר מוביל לכלא. בגדי השש מפרעה מסמנים את עלייתו לשלטון.", "ar": "نزع القميص يقود إلى البئر والبيع. والثوب الذي بقي عند امرأة فوطيفار يقود إلى السجن. وثياب الكتّان من فرعون تشير إلى صعوده إلى الحكم.", "ru": "Снятая рубашка ведёт к яме и продаже. Одежда, оставленная у жены Потифара, ведёт в тюрьму. Льняные одежды от фараона знаменуют его возвышение.", "en": "Stripping the coat leads to the pit and the sale. The garment left with Potiphar's wife leads to prison. Pharaoh's linen robes mark his rise to power."},null,[null, {"he": "אחרים מפשיטים ומלבישים אותו: האחים, האישה ופרעה.", "ar": "آخرون ينزعون عنه ويلبسونه: الإخوة، والمرأة، وفرعون.", "ru": "Раздевают и одевают его другие: братья, женщина, фараон.", "en": "Others strip and dress him: the brothers, the woman and Pharaoh."}, {"he": "גם הירידות מסומנות בבגד: הבור והכלא.", "ar": "الهبوط أيضًا يُشار إليه بالثوب: البئر والسجن.", "ru": "Падения тоже отмечены одеждой: яма и тюрьма.", "en": "The falls are marked by clothing too: the pit and the prison."}, {"he": "הכתוב אינו מתאר תחפושת. האחים לא מזהים אותו מסיבות אחרות.", "ar": "النص لا يصف تنكّرًا. الإخوة لا يعرفونه لأسباب أخرى.", "ru": "Текст не описывает переодевания. Братья не узнают его по другим причинам.", "en": "The text describes no disguise. The brothers fail to recognize him for other reasons."}]),
  Q("gen-3-06",{"he": "יהודה הציע בעבר למכור את יוסף. מה משתנה בנאומו בבראשית מ״ד?", "ar": "يهوذا اقترح سابقًا بيع يوسف. ما الذي يتغيّر في خطابه في التكوين 44؟", "ru": "Иуда когда-то предложил продать Иосифа. Что меняется в его речи в Бытии 44?", "en": "Judah once suggested selling Joseph. What changes in his speech in Genesis 44?"},[{"he": "הוא מאשים את בנימין בגניבת הגביע", "ar": "يتّهم بنيامين بسرقة الكأس", "ru": "Он обвиняет Вениамина в краже чаши", "en": "He accuses Benjamin of stealing the cup"}, {"he": "הוא מאיים להילחם בשליט המצרי", "ar": "يهدّد بمحاربة الحاكم المصري", "ru": "Он грозит войной египетскому правителю", "en": "He threatens to fight the Egyptian ruler"}, {"he": "הוא מציע כסף רב כדי לפדות את בנימין", "ar": "يعرض مالًا كثيرًا لفداء بنيامين", "ru": "Он предлагает много денег за выкуп Вениамина", "en": "He offers a lot of money to ransom Benjamin"}, {"he": "הוא מציע את עצמו כעבד במקום בנימין", "ar": "يعرض نفسه عبدًا بدل بنيامين", "ru": "Он предлагает себя в рабы вместо Вениамина", "en": "He offers himself as a slave instead of Benjamin"}],3,{"he": "השוו את יחסו לאח הצעיר אז ועכשיו.", "ar": "قارنوا موقفه من الأخ الأصغر آنذاك والآن.", "ru": "Сравните его отношение к младшему брату тогда и теперь.", "en": "Compare his attitude to the younger brother then and now."},{"he": "בפרק ל״ז יהודה מציע למכור את יוסף. בפרק מ״ד הוא אומר: ״ישב נא עבדך תחת הנער עבד לאדני״. מיד אחרי הנאום יוסף אינו יכול להתאפק ומתגלה לאחיו.", "ar": "في الإصحاح 37 يقترح يهوذا بيع يوسف. وفي 44 يطلب أن يبقى هو عبدًا بدل الغلام. وبعد الخطاب مباشرة لا يستطيع يوسف أن يضبط نفسه ويكشف نفسه لإخوته.", "ru": "В главе 37 Иуда предлагает продать Иосифа. В главе 44 он просит оставить рабом его вместо отрока. Сразу после речи Иосиф не может сдержаться и открывается братьям.", "en": "In chapter 37 Judah suggests selling Joseph. In chapter 44 he asks to remain a slave instead of the boy. Right after the speech Joseph cannot hold back and reveals himself."},null,[{"he": "יהודה אינו מאשים את בנימין. הוא לוקח אחריות על כל האחים.", "ar": "يهوذا لا يتّهم بنيامين. بل يتحمّل المسؤولية عن الإخوة كلهم.", "ru": "Иуда не обвиняет Вениамина. Он берёт ответственность за всех братьев.", "en": "Judah does not accuse Benjamin. He takes responsibility for all the brothers."}, {"he": "בנאום אין איום. יהודה מדבר בכבוד ומכנה את עצמו עבד.", "ar": "لا تهديد في الخطاب. يهوذا يتكلم باحترام ويسمّي نفسه عبدًا.", "ru": "В речи нет угрозы. Иуда говорит почтительно и называет себя рабом.", "en": "There is no threat in the speech. Judah speaks respectfully and calls himself a servant."}, {"he": "יהודה אינו מציע כסף. הוא מציע את עצמו.", "ar": "يهوذا لا يعرض مالًا. بل يعرض نفسه.", "ru": "Иуда не предлагает денег. Он предлагает себя.", "en": "Judah offers no money. He offers himself."}, null])]]);
