["eco",2,{"he":["ציפור בונה קן בעץ ליד שדה מלא זרעים ונחל קטן. למה המקום הזה טוב לה?","כי בו יש מזון, מים ומחסה. כל מה שהיא צריכה קרוב לקן","כי עצים גבוהים יפים לציפורים","כי שדות רועשים ומעירים אותה בבוקר","כי נחלים מושכים חתולים שמצחיקים אותה","עברו על הרשימה של הצרכים: מזון? מים? מחסה? איפה כל אחד נמצא בסיפור?","בית גידול טוב עונה על שלוש שאלות. נסו למנות את שלוש התשובות בסיפור.","העץ נותן מחסה לקן, השדה נותן זרעים לאכול, והנחל נותן מים. שלושתם יחד הופכים את המקום לבית גידול מצוין."],"en":["A bird builds a nest in a tree next to a field full of seeds and a small stream. Why is this place good for her?","Because it has food, water, and shelter: everything she needs close to the nest","Because tall trees are pretty for birds","Because fields are noisy and wake her in the morning","Because streams attract cats that make her laugh","Go over the needs list: food? water? shelter? Where is each one found in the story?","A good habitat answers three questions. Try to name the three answers in the story.","The tree gives shelter for the nest, the field gives seeds to eat, and the stream gives water. All three together make the place an excellent habitat."],"ru":["Птица строит гнездо на дереве рядом с полем, полным семян, и маленьким ручьём. Почему это место хорошо для неё?","Потому что там есть еда, вода и укрытие: всё, что ей нужно, рядом с гнездом","Потому что высокие деревья красивы для птиц","Потому что поля шумные и будят её по утрам","Потому что ручьи привлекают кошек, которые её смешат","Пройди по списку потребностей: еда? вода? укрытие? Где каждая находится в рассказе?","Хорошая среда обитания отвечает на три вопроса. Попробуй назвать три ответа в рассказе.","Дерево даёт укрытие для гнезда, поле: семена для еды, а ручей. Воду. Все три вместе делают место отличной средой обитания."],"ar":["يبني العصفور عشًّا في شجرة بجانب حقل مليء بالبذور وجدول صغير. لماذا هذا المكان جيّد له؟","لأن فيه طعامًا وماءً وملجأ: كلّ ما يحتاجه قريب من العشّ","لأن الأشجار العالية جميلة للعصافير","لأن الحقول صاخبة وتوقظه في الصباح","لأن الجداول تجذب قططًا تُضحكه","راجعوا قائمة الحاجات: طعام؟ ماء؟ ملجأ؟ أين يوجد كلّ واحد في القصة؟","الموطن الجيّد يجيب عن ثلاثة أسئلة. حاولوا ذكر الإجابات الثلاث في القصة.","الشجرة تعطي ملجأ للعشّ، والحقل يعطي بذورًا للأكل، والجدول يعطي ماءً. الثلاثة معًا تجعل المكان موطنًا ممتازًا."]}],
["eco",3,{"he":["שטח של יער נכרת ונבנה בו כביש. מה צפוי לקרות לחיות שחיו שם?","הן יאלצו לעזוב או לא לשרוד, כי בית הגידול שנתן להן מזון ומחסה נפגע","הן ילמדו לחיות בתוך מכוניות","כלום לא ישתנה. חיות לא שמות לב","הן יעברו לגור מתחת לכביש","מה היער נתן לחיות, ומה קורה כשהוא נעלם?","חשבו על שלושת הצרכים: מזון, מים, מחסה. מה קורה לכל אחד מהם אחרי הכריתה?","חיות תלויות בבית הגידול שלהן: מזון, מים ומחסה. כשהיער נכרת אלה נעלמים, והחיות חייבות למצוא בית חדש או שהן לא שורדות."],"en":["An area of forest is cut down and a road is built there. What is expected to happen to the animals that lived there?","They will have to leave or not survive, because the habitat that gave them food and shelter was damaged","They will learn to live inside cars","Nothing will change: animals do not notice","They will move to live under the road","What did the forest give the animals, and what happens when it disappears?","Think about the three needs: food, water, shelter. What happens to each of them after the cutting?","Animals depend on their habitat: food, water, and shelter. When the forest is cut down these disappear, and the animals must find a new home or they do not survive."],"ru":["Участок леса вырубили и построили там дорогу. Что, как ожидается, случится с животными, которые там жили?","Им придётся уйти или погибнуть, потому что среда обитания, дававшая им еду и укрытие, разрушена","Они научатся жить внутри машин","Ничего не изменится: животные не замечают","Они переедут жить под дорогу","Что лес давал животным, и что происходит, когда он исчезает?","Подумай о трёх потребностях: еда, вода, укрытие. Что случится с каждой после вырубки?","Животные зависят от своей среды обитания: еда, вода и укрытие. Когда лес вырубают, они исчезают, и животные должны найти новый дом, иначе они не выживают."],"ar":["قُطعت مساحة من الغابة وبُني فيها طريق. ما المتوقَّع أن يحدث للحيوانات التي عاشت هناك؟","ستضطرّ إلى الرحيل أو إلى الهلاك، لأن الموطن الذي وفّر لها الطعام والملجأ تضرّر","ستتعلّم العيش داخل السيارات","لن يتغيّر شيء: الحيوانات لا تنتبه","ستنتقل للعيش تحت الطريق","ماذا كانت الغابة تعطي الحيوانات، وماذا يحدث عندما تختفي؟","فكّروا في الحاجات الثلاث: طعام، ماء، ملجأ. ماذا يحدث لكلّ واحدة منها بعد القطع؟","الحيوانات تعتمد على موطنها: طعام وماء وملجأ. عندما تُقطع الغابة تختفي هذه، ويجب على الحيوانات أن تجد بيتًا جديدًا وإلّا فلن تصمد."]}],
["mat",1,{"he":["ממה עושים חלון, ולמה דווקא מזה?","מזכוכית, כי היא שקופה ואפשר לראות דרכה","מעץ, כי הוא חם וחזק","מבד, כי הוא רך ונעים","מנייר, כי הוא קל","מה התפקיד של חלון? איזו תכונה הוא חייב לקבל מהחומר?","דמיינו חלון מנייר או מבד. מה לא יעבוד?","חלון צריך להכניס אור ולתת לראות החוצה, לכן בוחרים זכוכית, חומר שקוף. בוחרים חומר לפי התכונות שלו."],"en":["What are windows made of, and why exactly that?","Glass, because it is transparent and you can see through it","Wood, because it is warm and strong","Fabric, because it is soft and pleasant","Paper, because it is light","What is a window's job? Which property must it get from the material?","Imagine a window made of paper or fabric. What would not work?","A window must let in light and let us see outside, so we choose glass: a transparent material. We choose a material by its properties."],"ru":["Из чего делают окна и почему именно из этого?","Из стекла, потому что оно прозрачное и через него видно","Из дерева, потому что оно тёплое и крепкое","Из ткани, потому что она мягкая и приятная","Из бумаги, потому что она лёгкая","Какова задача окна? Какое свойство оно обязательно должно получить от материала?","Представь окно из бумаги или ткани. Что не будет работать?","Окно должно впускать свет и позволять видеть улицу, поэтому выбирают стекло: прозрачный материал. Материал выбирают по его свойствам."],"ar":["ممّا تصنع النوافذ، ولماذا من هذا بالذات؟","من الزجاج، لأنه شفاف ويمكن الرؤية من خلاله","من الخشب، لأنه دافئ وقويّ","من القماش، لأنه ناعم ولطيف","من الورق، لأنه خفيف","ما وظيفة النافذة؟ أيّ خاصّية يجب أن تحصل عليها من المادّة؟","تخيّلوا نافذة من ورق أو قماش. ما الذي لن يعمل؟","النافذة يجب أن تُدخل الضوء وتسمح برؤية الخارج، لذلك نختار الزجاج: مادّة شفافة. نختار المادّة بحسب خصائصها."]}],
["mat",1,{"he":["כדור שחוקים עשוי מגומי ולא מזכוכית. למה?","כי גומי גמיש וקופץ, וזכוכית הייתה נשברת","כי גומי זול יותר תמיד","כי זכוכית כבדה מדי לשחק איתה","כי גומי שקוף וזה יפה בכדור","מה הכדור צריך לעשות במשחק, ומה קורה לזכוכית כשמכים אותה ברצפה?","חשבו על התכונות: איזה חומר קופץ ולא נשבר?","לכדור צריך חומר גמיש שקופץ ולא נשבר: גומי. זכוכית קשה אבל שבירה, ולכן לא מתאימה למשחק."],"en":["A playground ball is made of rubber and not glass. Why?","Because rubber is flexible and bouncy, and glass would break","Because rubber is always cheaper","Because glass is too heavy to play with","Because rubber is transparent and that looks nice in a ball","What must the ball do during the game, and what happens to glass when it hits the floor?","Think about the properties: which material bounces and does not break?","A ball needs a flexible material that bounces and does not break: rubber. Glass is hard but breakable, so it does not fit a game."],"ru":["Игровой мяч сделан из резины, а не из стекла. Почему?","Потому что резина гибкая и прыгучая, а стекло разбилось бы","Потому что резина всегда дешевле","Потому что стекло слишком тяжёлое для игры","Потому что резина прозрачная, и это красиво в мяче","Что мяч должен делать в игре, и что происходит со стеклом, когда оно ударяется об пол?","Подумай о свойствах: какой материал прыгает и не ломается?","Мячу нужен гибкий материал, который прыгает и не ломается,: резина. Стекло твёрдое, но хрупкое, поэтому для игры не подходит."],"ar":["كرة اللعب مصنوعة من المطاط وليس من الزجاج. لماذا؟","لأن المطاط مرن ويقفز، والزجاج كان سينكسر","لأن المطاط أرخص دائمًا","لأن الزجاج ثقيل جدًّا للّعب به","لأن المطاط شفاف وهذا جميل في الكرة","ما الذي يجب أن تفعله الكرة في اللعبة، وماذا يحدث للزجاج عندما يضرب الأرض؟","فكّروا في الخصائص: أيّ مادّة تقفز ولا تنكسر؟","الكرة تحتاج مادّة مرنة تقفز ولا تنكسر: المطاط. الزجاج صلب لكنه قابل للكسر، لذلك لا يناسب اللعب."]}],
["mat",2,{"he":["מטרייה צריכה לעצור גשם. איזו תכונה חייבת להיות לבד שלה?","לא סופג מים. המים מחליקים עליו ולא עוברים","שקוף, כדי לראות את הגשם","כבד, כדי לא לעוף ברוח","רך, כדי לקפל בקלות","מה קורה לבד רגיל בגשם? מה אנחנו רוצים שיקרה במקום זה?","חשבו על המים: האם אנחנו רוצים שהבד ישתה אותם או יגרום להם להחליק?","מטרייה עשויה מבד שאינו סופג מים: הטיפות מחליקות עליו ויורדות, והראש נשאר יבש. גם כאן בוחרים חומר לפי התכונה."],"en":["An umbrella must stop rain. Which property must its fabric have?","Not absorb water: the water slides off it and does not pass through","Transparent, so you can see the rain","Heavy, so it will not fly away in the wind","Soft, so it folds easily","What happens to ordinary fabric in the rain? What do we want to happen instead?","Think about the water: do we want the fabric to drink it, or to make it slide off?","An umbrella is made of fabric that does not absorb water: the drops slide off and fall, and the head stays dry. Again: we choose a material by its property."],"ru":["Зонт должен останавливать дождь. Какое свойство обязательно должно быть у его ткани?","Не впитывать воду: вода скатывается с неё и не проходит сквозь","Прозрачность, чтобы видеть дождь","Тяжесть, чтобы не улетел на ветру","Мягкость, чтобы легко складывался","Что происходит с обычной тканью под дождём? Что мы хотим, чтобы происходило вместо этого?","Подумай о воде: мы хотим, чтобы ткань её впитывала или чтобы заставляла скатываться?","Зонт сделан из ткани, которая не впитывает воду: капли скатываются и падают, а голова остаётся сухой. Снова: материал выбирают по свойству."],"ar":["المظلّة يجب أن توقف المطر. أيّ خاصّية يجب أن تكون في قماشها؟","ألّا يمتصّ الماء: الماء ينزلق عنه ولا يخترقه","أن يكون شفافًا، لنرى المطر","أن يكون ثقيلًا، حتى لا يطير في الريح","أن يكون ناعمًا، ليُطوى بسهولة","ماذا يحدث للقماش العاديّ تحت المطر؟ ما الذي نريد أن يحدث بدلًا من ذلك؟","فكّروا في الماء: هل نريد أن يشربه القماش أم أن يجعله ينزلق؟","المظلّة مصنوعة من قماش لا يمتصّ الماء: القطرات تنزلق عنه وتسقط، والرأس يبقى جافًّا. ومرّة أخرى: نختار المادّة بحسب الخاصّية."]}],
["mat",3,{"he":["גשר להולכי רגל בנו מבטון וברזל ולא מעץ. כתבו שתי תכונות שהיו חשובות לבוני הגשר.","חוזק גדול ועמידות ארוכה בכל מזג אוויר","שקיפות וקלות","ריח טוב וצבע ירוק","רכות וגמישות כמו ספוג","מה הגשר צריך לסבול כל יום, שנה אחר שנה?","דמיינו גשר מעץ אחרי עשר שנות גשם. מה עלול לקרות לעץ?","גשר נושא אנשים רבים ועומד בחוץ בגשם ובשמש שנים. בטון וברזל חזקים ועמידים; עץ עלול להירקב. שוב בוחרים חומר לפי תכונות."],"en":["A footbridge was built from concrete and iron, not wood. Name two properties that mattered to the bridge builders.","Great strength and long durability in all weather","Transparency and lightness","A nice smell and a green color","Softness and flexibility like a sponge","What must the bridge bear every day, year after year?","Imagine a wooden bridge after ten years of rain. What might happen to the wood?","A bridge carries many people and stands outside in rain and sun for years. Concrete and iron are strong and durable; wood can rot. Again we choose a material by its properties."],"ru":["Пешеходный мост построили из бетона и железа, а не из дерева. Назови два свойства, которые были важны строителям моста.","Большая прочность и долгая стойкость в любую погоду","Прозрачность и лёгкость","Хороший запах и зелёный цвет","Мягкость и гибкость, как у губки","Что мост должен выдерживать каждый день, год за годом?","Представь деревянный мост после десяти лет дождя. Что может случиться с деревом?","Мост несёт много людей и стоит на улице под дождём и солнцем годами. Бетон и железо прочные и стойкие; дерево может сгнить. Снова выбираем материал по свойствам."],"ar":["بُني جسر للمشاة من الباطون والحديد وليس من الخشب. اذكروا خاصّيتين كانتا مهمّتين لبنّائي الجسر.","قوّة كبيرة ومتانة طويلة في كلّ الأجواء","الشفافية والخفّة","رائحة طيّبة ولون أخضر","النعومة والمرونة كالإسفنج","ما الذي يجب أن يتحمّله الجسر كلّ يوم، سنة بعد سنة؟","تخيّلوا جسرًا من خشب بعد عشر سنوات من المطر. ماذا قد يحدث للخشب؟","الجسر يحمل كثيرًا من الناس ويقف في الخارج تحت المطر والشمس سنوات. الباطون والحديد قويّان ومتينان؛ أمّا الخشب فقد يتعفّن. ومرّة أخرى نختار المادّة بحسب خصائصها."]}],
["erg",1,{"he":["ניב בנה מעגל: סוללה, חוטים ונורה. הנורה לא מאירה. מה כדאי לבדוק קודם?","שהמעגל סגור, כלומר שהחוטים מחוברים בלי הפסקה מהסוללה לנורה ובחזרה","שהנורה יפה מספיק","שהחוטים באותו צבע","שהסוללה חדשה לגמרי ויקרה","זכרו את הכלל: מתי נורה מאירה?","עקבו עם האצבע על דרך החשמל מהסוללה לנורה ובחזרה. האם יש הפסקה בדרך?","נורה מאירה רק במעגל סגור: דרך שלמה מהסוללה לנורה ובחזרה. חוט משוחרר אחד עוצר את הכול."],"en":["Niv built a circuit: a battery, wires, and a bulb. The bulb does not light. What should he check first?","That the circuit is closed: that the wires are connected without a break from the battery to the bulb and back","That the bulb is pretty enough","That the wires are the same color","That the battery is brand new and expensive","Remember the rule: when does a bulb light?","Trace with your finger the electricity's path from the battery to the bulb and back. Is there a break on the way?","A bulb lights only in a closed circuit: a complete path from the battery to the bulb and back. One loose wire stops everything."],"ru":["Нив собрал цепь: батарейку, провода и лампочку. Лампочка не горит. Что стоит проверить сначала?","Что цепь замкнута: провода соединены без разрыва от батарейки к лампочке и обратно","Что лампочка достаточно красивая","Что провода одного цвета","Что батарейка совсем новая и дорогая","Вспомни правило: когда лампочка горит?","Проведи пальцем путь электричества от батарейки к лампочке и обратно. Есть ли разрыв на пути?","Лампочка горит только в замкнутой цепи: полный путь от батарейки к лампочке и обратно. Один отсоединённый провод останавливает всё."],"ar":["بنى نيف دائرة: بطارية وأسلاكًا ومصباحًا. المصباح لا يضيء. ما الأفضل أن يفحص أوّلًا؟","أن الدائرة مغلقة: أن الأسلاك موصولة دون انقطاع من البطارية إلى المصباح وبالعكس","أن المصباح جميل بما يكفي","أن الأسلاك باللون نفسه","أن البطارية جديدة تمامًا وغالية","تذكّروا القاعدة: متى يضيء المصباح؟","تتبّعوا بإصبعكم طريق الكهرباء من البطارية إلى المصباح وبالعكس. هل يوجد انقطاع في الطريق؟","يضيء المصباح فقط في دائرة مغلقة: طريق كامل من البطارية إلى المصباح وبالعكس. سلك واحد مفكوك يوقف كلّ شيء."]}],
["erg",1,{"he":["מה תפקידו של המתג במעגל חשמלי?","לפתוח ולסגור את המעגל, וכך לכבות ולהדליק את הנורה","לחמם את החוטים","לייפות את המעגל","לשמור את הסוללה מגשם","מה קורה לנורה כשלוחצים על המתג? מה המתג משנה בדרך של החשמל?","חשבו על המתג כמו על גשר קטן: מה קורה כשהגשר למעלה ומה כשהוא למטה?","המתג פותח וסוגר את המעגל: כשהוא סגור, הדרך שלמה והנורה מאירה. כשהוא פתוח, יש הפסקה והנורה כבויה."],"en":["What is the job of the switch in an electric circuit?","To open and close the circuit: to turn the bulb off and on","To heat the wires","To make the circuit pretty","To keep the battery safe from rain","What happens to the bulb when you press the switch? What does the switch change in the electricity's path?","Think of the switch as a small bridge: what happens when the bridge is up and when it is down?","The switch opens and closes the circuit: when it is closed. The path is complete and the bulb lights; when it is open: there is a break and the bulb is dark."],"ru":["Какова задача выключателя в электрической цепи?","Размыкать и замыкать цепь: гасить и зажигать лампочку","Нагревать провода","Украшать цепь","Хранить батарейку от дождя","Что происходит с лампочкой, когда нажимают выключатель? Что выключатель меняет на пути электричества?","Подумай о выключателе как о маленьком мостике: что происходит, когда мост поднят, и когда опущен?","Выключатель размыкает и замыкает цепь: когда замкнута. Путь цел и лампочка горит; когда разомкнута: есть разрыв и лампочка не горит."],"ar":["ما وظيفة المفتاح في الدائرة الكهربائية؟","فتح الدائرة وإغلاقها: إطفاء المصباح وإضاءته","تسخين الأسلاك","تجميل الدائرة","حماية البطارية من المطر","ماذا يحدث للمصباح عند الضغط على المفتاح؟ ما الذي يغيّره المفتاح في طريق الكهرباء؟","فكّروا في المفتاح كجسر صغير: ماذا يحدث عندما يكون الجسر مرفوعًا وماذا عندما يكون منخفضًا؟","المفتاح يفتح الدائرة ويغلقها: عندما تكون مغلقة. الطريق كامل والمصباح يضيء؛ وعندما تكون مفتوحة: يوجد انقطاع والمصباح مطفأ."]}],
["erg",2,{"he":["במעגל אחד מחוברים סוללה, מתג סגור ושתי נורות זו אחר זו. נורה אחת נשרפה ויצאה מכלל שימוש. מה יקרה לנורה השנייה?","גם היא תכבה, כי המעגל נפתח במקום השרוף","היא תאיר חזק יותר","היא תמשיך להאיר כרגיל","היא תהפוך למתג חדש","כשהנורות זו אחר זו, האם לחשמל יש שתי דרכים או דרך אחת?","דמיינו רכבת במסילה אחת ארוכה. מה קורה כשמקום אחד במסילה שבור?","בשתי נורות זו אחר זו יש דרך אחת לחשמל. נורה שרופה שוברת את הדרך, המעגל נפתח, וגם הנורה השנייה כבה."],"en":["In one circuit, a battery, a closed switch, and two bulbs one after the other are connected. One bulb burned out and stopped working. What will happen to the second bulb?","It will also go dark, because the circuit opened at the burnt spot","It will shine brighter","It will keep shining as usual","It will turn into a new switch","When the bulbs are one after the other, does the electricity have two paths or one?","Imagine a train on one long track. What happens when one spot on the track is broken?","With two bulbs one after the other, the electricity has one path. A burnt bulb breaks the path, the circuit opens, and the second bulb also goes dark."],"ru":["В одной цепи соединены батарейка, замкнутый выключатель и две лампочки одна за другой. Одна лампочка перегорела и вышла из строя. Что будет со второй лампочкой?","Она тоже погаснет, потому что цепь разомкнулась в перегоревшем месте","Она будет светить сильнее","Она продолжит светить как обычно","Она превратится в новый выключатель","Когда лампочки одна за другой, у электричества два пути или один?","Представь поезд на одном длинном пути. Что происходит, когда одно место на пути сломано?","При двух лампочках одна за другой у электричества один путь. Перегоревшая лампочка разрывает путь, цепь размыкается, и вторая лампочка тоже гаснет."],"ar":["في دائرة واحدة موصولة بطارية ومفتاح مغلق ومصباحان واحد بعد الآخر. احترق أحد المصباحين وخرج عن العمل. ماذا يحدث للمصباح الثاني؟","سينطفئ أيضًا، لأن الدائرة انفتحت في المكان المحروق","سيضيء بقوّة أكبر","سيستمرّ بالإضاءة كالمعتاد","سيتحوّل إلى مفتاح جديد","عندما يكون المصباحان واحدًا بعد الآخر، هل للكهرباء طريقان أم طريق واحد؟","تخيّلوا قطارًا على سكّة واحدة طويلة. ماذا يحدث عندما ينكسر مكان واحد في السكّة؟","عند وجود مصباحين واحد بعد الآخر يكون للكهرباء طريق واحد. المصباح المحروق يكسر الطريق، فتنفتح الدائرة وينطفئ المصباح الثاني أيضًا."]}],
["erg",3,{"he":["חבר מציע לבדוק אם יש חשמל בשקע בקיר בעזרת חוט ונורה קטנה. מה התשובה הנכונה?","אסור בשום פנים! מתנסים רק עם סוללות. החשמל בשקע מסוכן מאוד","מותר, אם הנורה קטנה וחמודה","מותר, אם מבוגר עומד בחדר","מותר, רק ביום חמישי","זכרו את כלל הבטיחות מהשיעור: עם מה מותר להתנסות?","חשבו: האם חשמל חזק ומסוכן הופך בטוח בגלל נורה קטנה או מבוגר בחדר?","החשמל בשקע חזק ומסוכן מאוד, ואסור לגעת בו אף פעם, גם לא עם חוט ונורה. מתנסים בחשמל רק עם סוללות."],"en":["A friend suggests checking whether the wall socket has electricity using a wire and a small bulb. What is the right answer?","Absolutely not: we experiment only with batteries; the electricity in a socket is very dangerous","It is allowed if the bulb is small and cute","It is allowed if an adult is standing in the room","It is allowed only on Thursdays","Remember the safety rule from the lesson: what are we allowed to experiment with?","Think: does strong, dangerous electricity become safe because of a small bulb or an adult in the room?","The electricity in a socket is strong and very dangerous, and you must never touch it: not even with a wire and a bulb. We experiment with electricity only with batteries."],"ru":["Друг предлагает проверить, есть ли электричество в настенной розетке, с помощью провода и маленькой лампочки. Каков правильный ответ?","Ни в коем случае: экспериментируем только с батарейками; электричество в розетке очень опасно","Можно, если лампочка маленькая и миленькая","Можно, если взрослый стоит в комнате","Можно только по четвергам","Вспомни правило безопасности из урока: с чем разрешено экспериментировать?","Подумай: становится ли сильное и опасное электричество безопасным из-за маленькой лампочки или взрослого в комнате?","Электричество в розетке сильное и очень опасное, и трогать его нельзя никогда: даже проводом и лампочкой. Экспериментируют с электричеством только на батарейках."],"ar":["يقترح صديق فحص ما إذا كانت الكهرباء موجودة في مقبس الحائط باستخدام سلك ومصباح صغير. ما الجواب الصحيح؟","ممنوع بتاتًا: نتجرّب فقط مع البطاريات؛ الكهرباء في المقبس خطيرة جدًّا","مسموح إذا كان المصباح صغيرًا ولطيفًا","مسموح إذا وقف شخص بالغ في الغرفة","مسموح فقط يوم الخميس","تذكّروا قاعدة الأمان من الدرس: بأيّ شيء مسموح أن نتجرّب؟","فكّروا: هل تصبح الكهرباء القويّة والخطيرة آمنة بسبب مصباح صغير أو وجود بالغ في الغرفة؟","الكهرباء في المقبس قويّة وخطيرة جدًّا، وممنوع لمسها أبدًا. ولا حتى بسلك ومصباح. نتجرّب بالكهرباء فقط مع البطاريات."]}],
["mat",1,{"he":["קוביית קרח נשכחה על השולחן. מה יקרה לה אחרי שעה?","תנמס ותהפוך למים, כי החום במטבח ממיס אותה","תישאר קובייה קשה לנצח","תהפוך ישר לאדים","תגדל ותהיה קובייה ענקית","מה הטמפרטורה במטבח לעומת המקפיא? מה חום עושה לקרח?","זכרו את הכלל: חימום מעביר חומר ממצב אחד למצב הבא. מאיזה מצב לאיזה?","קרח הוא מים במצב מוצק. חום המטבח מחמם אותו, והוא נמס לנוזל: מים. חימום מעביר ממוצק לנוזל."],"en":["An ice cube was forgotten on the table. What will happen to it after an hour?","It will melt and turn into water, because the heat in the kitchen melts it","It will stay a hard cube forever","It will turn straight into vapor","It will grow into a giant cube","What is the temperature in the kitchen compared to the freezer? What does heat do to ice?","Remember the rule: heating moves a material from one state to the next. From which state to which?","Ice is water in a solid state. The kitchen's heat warms it, and it melts into a liquid: water. Heating moves from solid to liquid."],"ru":["Кубик льда забыли на столе. Что с ним случится через час?","Он растает и превратится в воду, потому что тепло на кухне плавит его","Он останется твёрдым кубиком навсегда","Он сразу превратится в пар","Он вырастет в гигантский кубик","Какая температура на кухне по сравнению с морозилкой? Что тепло делает со льдом?","Вспомни правило: нагревание переводит вещество из одного состояния в следующее. Из какого в какое?","Лёд: это вода в твёрдом состоянии. Тепло кухни нагревает его, и он тает в жидкость: воду. Нагревание переводит из твёрдого в жидкое."],"ar":["نُسيت مكعّبة ثلج على الطاولة. ماذا سيحدث لها بعد ساعة؟","ستذوب وتتحوّل إلى ماء، لأن حرارة المطبخ تُذيبها","ستبقى مكعّبة صلبة إلى الأبد","ستتحوّل مباشرة إلى بخار","ستكبر وتصبح مكعّبة عملاقة","ما حرارة المطبخ مقارنة بالمجمّد؟ ماذا تفعل الحرارة بالثلج؟","تذكّروا القاعدة: التسخين ينقل المادّة من حالة إلى الحالة التالية. من أيّ حالة إلى أيّ حالة؟","الثلج هو ماء في حالة صلبة. حرارة المطبخ تسخّنه فيذوب إلى سائل: ماء. التسخين ينقل من صلب إلى سائل."]}],
["mat",1,{"he":["אמא מרתיחה מים בסיר. מה הענן הלבן שעולה מן הסיר?","אדים. מים שהפכו לגז בגלל החום","עשן מהכיריים","אבק מהמים","קרח קטן מעופף","מה קורה למים כשמחממים אותם חזק מאוד?","זכרו: חימום מעביר מנוזל לאיזה מצב צבירה?","כשמים רותחים הם הופכים לאדים, מים במצב גז. גם זה מים, רק במצב אחר."],"en":["Mom is boiling water in a pot. What is the white cloud rising from the pot?","Vapor: water that turned into gas because of the heat","Smoke from the stove","Dust from the water","Tiny flying ice","What happens to water when it is heated very strongly?","Remember: heating moves from liquid to which state?","When water boils it turns into vapor: water in a gas state. It is still water, just in another state."],"ru":["Мама кипятит воду в кастрюле. Что за белое облачко поднимается из кастрюли?","Пар: вода, превратившаяся в газ из-за нагрева","Дым от плиты","Пыль из воды","Маленький летающий лёд","Что происходит с водой, когда её очень сильно нагревают?","Вспомни: нагревание переводит из жидкого в какое состояние?","Когда вода кипит, она превращается в пар: воду в газообразном состоянии. Это всё ещё вода, просто в другом состоянии."],"ar":["الأمّ تغلي الماء في قدر. ما السحابة البيضاء التي تصعد من القدر؟","بخار: ماء تحوّل إلى غاز بسبب الحرارة","دخان من الموقد","غبار من الماء","ثلج صغير يطير","ماذا يحدث للماء عندما نسخّنه بقوّة كبيرة؟","تذكّروا: التسخين ينقل من سائل إلى أيّ حالة؟","عندما يغلي الماء يتحوّل إلى بخار: ماء في حالة غازية. هو ما زال ماءً، لكن في حالة أخرى."]}],
["mat",2,{"he":["על חלון הכיתה בבוקר חורף יש טיפות מים מבפנים. מאיפה הן באות?","האדים באוויר החם של הכיתה התקררו על הזכוכית הקרה וחזרו להיות מים","גשם חדר דרך הזכוכית","מישהו שפך מים על החלון","הזכוכית מייצרת מים בלילה","חשבו על ההפך מחימום: מה קירור עושה לאדים?","זכרו את הכלל: קירור מחזיר אחורה. מגז לאיזה מצב?","באוויר הכיתה יש אדים. הזכוכית קרה, והקירור הופך אותם חזרה לטיפות נוזל. בדיוק ההפך מהרתיחה בסיר."],"en":["On the classroom window on a winter morning there are drops of water on the inside. Where did they come from?","The vapor in the classroom's warm air cooled on the cold glass and turned back into water","Rain got through the glass","Someone spilled water on the window","The glass makes water at night","Think about the opposite of heating: what does cooling do to vapor?","Remember the rule: cooling moves backward. From gas to which state?","The classroom air has vapor. The glass is cold, and cooling turns it back into liquid drops: exactly the opposite of boiling in the pot."],"ru":["На окне класса зимним утром есть капли воды изнутри. Откуда они взялись?","Пар в тёплом воздухе класса охладился на холодном стекле и снова стал водой","Дождь пробрался сквозь стекло","Кто-то пролил воду на окно","Стекло производит воду ночью","Подумай о противоположности нагреванию: что охлаждение делает с паром?","Вспомни правило: охлаждение возвращает назад. Из газа в какое состояние?","В воздухе класса есть пар. Стекло холодное, и охлаждение превращает его обратно в капли жидкости: ровно наоборот кипячению в кастрюле."],"ar":["على نافذة الصفّ في صباح شتويّ توجد قطرات ماء من الداخل. من أين أتت؟","البخار في هواء الصفّ الدافئ تبرّد على الزجاج البارد وعاد ماءً","المطر تسلّل عبر الزجاج","أحد ما سكب ماءً على النافذة","الزجاج يصنع الماء في الليل","فكّروا في عكس التسخين: ماذا يفعل التبريد بالبخار؟","تذكّروا القاعدة: التبريد يعيد إلى الوراء. من غاز إلى أيّ حالة؟","في هواء الصفّ يوجد بخار. الزجاج بارد، والتبريد يحوّله مجدّدًا إلى قطرات سائلة: تمامًا عكس الغلي في القدر."]}],
["mat",3,{"he":["מדענית רוצה להפוך גז חזרה לנוזל ואז למוצק. מה עליה לעשות בשתי הפעולות, ובאיזה סדר?","לקרר, ואז לקרר עוד","לחמם, ואז לקרר","לקרר, ואז לחמם","לחמם, ואז לחמם עוד","חשבו על סולם המצבים: מוצק, נוזל, גז. לאיזה כיוון הולכים בקירור?","לרדת מגז לנוזל ואז למוצק זה תמיד ללכת לאותו כיוון בסולם. איזה כיוון?","המעבר מגז לנוזל ומנוזל למוצק הוא תמיד בקירור: קודם מקררים את הגז לנוזל, ואז מקררים עוד, עד למוצק."],"en":["A scientist wants to turn gas back into liquid and then into solid. What must she do in the two steps, and in what order?","Cool. And then cool more","Heat. And then cool","Cool. And then heat","Heat. And then heat more","Think about the ladder of states: solid, liquid, gas. Which direction do we go when cooling?","Going down from gas to liquid and then to solid always means going the same direction on the ladder. Which direction?","The move from gas to liquid and from liquid to solid is always by cooling: first cool the gas into liquid, then cool more. Into solid."],"ru":["Учёная хочет превратить газ обратно в жидкость, а затем в твёрдое тело. Что она должна сделать в двух действиях и в каком порядке?","Охладить: а потом охладить ещё","Нагреть: а потом охладить","Охладить: а потом нагреть","Нагреть: а потом нагреть ещё","Подумай о лесенке состояний: твёрдое, жидкое, газ. В какую сторону идём при охлаждении?","Спуститься от газа к жидкости, а затем к твёрдому: это всегда движение в одну и ту же сторону лесенки. В какую?","Переход от газа к жидкости и от жидкости к твёрдому: это всегда охлаждение: сначала охлаждаем газ до жидкости, потом ещё. До твёрдого."],"ar":["تريد عالمة أن تحوّل الغاز مجدّدًا إلى سائل ثم إلى صلب. ماذا عليها أن تفعل في الخطوتين، وبأيّ ترتيب؟","تبرّد, ثم تبرّد أكثر","تسخّن, ثم تبرّد","تبرّد, ثم تسخّن","تسخّن, ثم تسخّن أكثر","فكّروا في سلّم الحالات: صلب، سائل، غاز. إلى أيّ اتجاه نذهب عند التبريد؟","النزول من غاز إلى سائل ثم إلى صلب هو دائمًا سير في الاتجاه نفسه في السلّم. أيّ اتجاه؟","الانتقال من غاز إلى سائل ومن سائل إلى صلب يكون دائمًا بالتبريد: أوّلًا نبرّد الغاز إلى سائل، ثم نبرّد أكثر. إلى صلب."]}],
["bio",1,{"he":["סוס, כריש ונשר נכנסים לקבוצה אחת גדולה של בעלי חיים. מה משותף לשלושתם?","לכולם יש שלד ועמוד שדרה. כולם בעלי חוליות","כולם יודעים לעוף","כולם חיים במים","לכולם יש ארבע רגליים","מה יש בתוך הגוף של כל אחד מהם, אפילו שחי במקום אחר?","חשבו על השלד שלכם: האם גם לדג ולציפור יש משהו דומה?","בעלי חוליות הם בעלי חיים עם שלד ועמוד שדרה. סוס, כריש ונשר שונים מאוד מבחוץ, אבל לשלושתם יש שלד בפנים."],"en":["A horse, a shark, and an eagle all belong to one big group of animals. What do all three share?","They all have a skeleton and a backbone: they are all vertebrates","They all know how to fly","They all live in water","They all have four legs","What is inside the body of each of them, even though each lives in a different place?","Think about your own skeleton: do a fish and a bird also have something similar?","Vertebrates are animals with a skeleton and a backbone. A horse, a shark, and an eagle look very different outside, but all three have a skeleton inside."],"ru":["Лошадь, акула и орёл входят в одну большую группу животных. Что общего у всех троих?","У всех есть скелет и позвоночник: все они позвоночные","Все они умеют летать","Все они живут в воде","У всех четыре ноги","Что есть внутри тела у каждого из них, хотя каждый живёт в другом месте?","Подумай о своём скелете: есть ли у рыбы и птицы что-то похожее?","Позвоночные: животные со скелетом и позвоночником. Лошадь, акула и орёл очень разные снаружи, но у всех троих есть скелет внутри."],"ar":["الحصان والقرش والنسر ينتمون إلى مجموعة واحدة كبيرة من الحيوانات. ما المشترك بين الثلاثة؟","لدى جميعها هيكل عظميّ وعمود فقريّ: جميعها من الفقاريات","جميعها تعرف الطيران","جميعها تعيش في الماء","لدى جميعها أربع أرجل","ما الموجود داخل جسم كلّ واحد منها، حتى لو كان يعيش في مكان مختلف؟","فكّروا في هيكلكم العظميّ: هل لدى السمكة والطائر شيء مشابه؟","الفقاريات حيوانات لها هيكل عظميّ وعمود فقريّ. الحصان والقرش والنسر مختلفة جدًّا من الخارج، لكن لدى الثلاثة هيكل في الداخل."]}],
["bio",1,{"he":["איזו חיה מכוסה נוצות?","תרנגולת","פרה","דולפין","נחש","עברו על הקבוצות: מי מכוסה פרווה, מי קשקשים, ומי נוצות?","חשבו על חצר עם עופות. מי משם לובש \"מעיל\" של נוצות?","לעופות, כלומר ציפורים, יש נוצות. תרנגולת היא עוף, ולכן היא מכוסה נוצות."],"en":["Which animal is covered with feathers?","A hen","A cow","A dolphin","A snake","Go over the groups: who is covered with fur, who with scales, and who with feathers?","Think about a yard with poultry. Who there wears a \"coat\" of feathers?","Birds have feathers. A hen is a bird, so it is covered with feathers."],"ru":["Какое животное покрыто перьями?","Курица","Корова","Дельфин","Змея","Пройди по группам: кто покрыт шерстью, кто чешуёй, а кто перьями?","Подумай о дворе с домашней птицей. Кто там носит «пальто» из перьев?","У птиц есть перья. Курица: птица, поэтому она покрыта перьями."],"ar":["أيّ حيوان مغطّى بالريش؟","الدجاجة","البقرة","الدولفين","الأفعى","راجعوا المجموعات: من المغطّى بالفراء، ومن بالحراشف، ومن بالريش؟","فكّروا في ساحة فيها دواجن. من هناك يلبس \"معطفًا\" من الريش؟","للطيور ريش. الدجاجة طائر، ولذلك هي مغطّاة بالريش."]}],
["bio",2,{"he":["סנאית מניקה את הגורים שלה בחלב. לאיזו קבוצת חוליות היא שייכת?","יונקים - בעלי חיים עם פרווה, שהאם מניקה את הגור","דגים - חיים במים","זוחלים - מכוסים קשקשים","עופות - מכוסים נוצות","ההנקה היא סימן ההיכר של קבוצה אחת. איזו?","חשבו על שם הקבוצה: איזו קבוצה קרויה על שם החלב שהאם נותנת?","יונקים הם בעלי חוליות עם פרווה, והאם מניקה את הגור בחלב. סנאים, כלבים וגם בני אדם. כולם יונקים."],"en":["A squirrel nurses her babies with milk. Which vertebrate group does she belong to?","Mammals: animals with fur whose mother nurses the babies","Fish: live in water","Reptiles: covered with scales","Birds: covered with feathers","Nursing is the trademark of one group. Which one?","Think about the group's name: which group is named after the milk the mother gives?","Mammals are vertebrates with fur, and the mother nurses the babies with milk. Squirrels, dogs, and also humans: all are mammals."],"ru":["Белка кормит своих детёнышей молоком. К какой группе позвоночных она относится?","Млекопитающие: животные с шерстью, чья мама кормит детёнышей молоком","Рыбы: живут в воде","Рептилии: покрыты чешуёй","Птицы: покрыты перьями","Кормление молоком: отличительный знак одной группы. Какой?","Подумай о названии группы: какая группа названа по молоку, которое даёт мать?","Млекопитающие: позвоночные с шерстью, и мать кормит детёнышей молоком. Белки, собаки и даже люди: все млекопитающие."],"ar":["ترضع السنجابة صغارها بالحليب. إلى أيّ مجموعة من الفقاريات تنتمي؟","الثدييات: حيوانات لها فراء والأمّ ترضع الصغار","الأسماك: تعيش في الماء","الزواحف: مغطّاة بالحراشف","الطيور: مغطّاة بالريش","الإرضاع هو العلامة المميّزة لمجموعة واحدة. أيّها؟","فكّروا في اسم المجموعة: أيّ مجموعة سُمّيت على اسم الحليب الذي تعطيه الأمّ؟","الثدييات فقاريات لها فراء، والأمّ ترضع الصغار بالحليب. السناجب والكلاب وأيضًا البشر: جميعهم ثدييات."]}],
["bio",3,{"he":["לוויתן חי בים ונושם אוויר דרך פתח בראשו, והאם מניקה את הגור. האם הוא דג? נמקו.","לא. הוא יונק, כי הוא נושם אוויר והאם מניקה, בלי קשר לזה שהוא חי בים","כן. כל מה שחי בים הוא דג","כן. כי הוא גדול ושוחה מהר","לא. הוא זוחל, כי אין לו רגליים","בדקו את סימני הקבוצות אחד־אחד: נשימה? הנקה? קשקשים או פרווה?","איזו עובדה חזקה יותר: איפה הוא חי, או איך הגוף שלו עובד?","הקבוצה נקבעת לפי תכונות הגוף, לא לפי המקום. לוויתן נושם אוויר, יש לו עור חלק בלי קשקשים, והאם מניקה. הוא יונק שחי בים."],"en":["A whale lives in the sea and breathes air through a hole on its head, and the mother nurses the calf. Is it a fish? Explain.","No, it is a mammal, because it breathes air and the mother nurses, no matter that it lives in the sea","Yes, everything that lives in the sea is a fish","Yes, because it is big and swims fast","No, it is a reptile, because it has no legs","Check the group signs one by one: breathing? nursing? scales or fur?","Which fact is stronger: where it lives, or how its body works?","The group is decided by body features, not by place. A whale breathes air, has smooth skin without scales, and the mother nurses: it is a mammal that lives in the sea."],"ru":["Кит живёт в море и дышит воздухом через отверстие на голове, а мама кормит детёныша молоком. Он рыба? Объясни.","Нет, он млекопитающее, потому что дышит воздухом и мама кормит молоком, независимо от того, что живёт в море","Да, всё, что живёт в море, рыба","Да, потому что он большой и быстро плавает","Нет, он рептилия, потому что у него нет ног","Проверь признаки групп по одному: дыхание? кормление молоком? чешуя или шерсть?","Какой факт сильнее: где он живёт или как устроено его тело?","Группа определяется по свойствам тела, а не по месту. Кит дышит воздухом, у него гладкая кожа без чешуи, и мама кормит молоком: это млекопитающее, живущее в море."],"ar":["يعيش الحوت في البحر ويتنفّس الهواء عبر فتحة في رأسه، والأمّ ترضع الصغير. هل هو سمكة؟ علّلوا.","لا, هو من الثدييات، لأنه يتنفّس الهواء والأمّ ترضع، بغضّ النظر عن أنه يعيش في البحر","نعم, كلّ ما يعيش في البحر هو سمكة","نعم, لأنه كبير ويسبح بسرعة","لا, هو زاحف، لأنه بلا أرجل","افحصوا علامات المجموعات واحدة واحدة: التنفّس؟ الإرضاع؟ حراشف أم فراء؟","أيّ حقيقة أقوى: أين يعيش، أم كيف يعمل جسمه؟","تُحدَّد المجموعة بحسب خصائص الجسم، لا بحسب المكان. الحوت يتنفّس الهواء، وجلده أملس بلا حراشف، والأمّ ترضع: هو ثديّ يعيش في البحر."]}],
["bio",1,{"he":["איזה מסלול עושה האוויר כשאנחנו שואפים?","אף, קנה הנשימה, ריאות","פה, קיבה, מעיים","אוזניים, גרון, קיבה","ריאות, קנה הנשימה, אף","מאיפה האוויר נכנס, ולאן הוא מגיע בסוף?","עקבו אחרי נשימה עמוקה: נכנס באף, יורד בצינור, מתמלא...","בשאיפה האוויר נכנס דרך האף, עובר בקנה הנשימה ומגיע לריאות, שם הגוף לוקח ממנו חמצן."],"en":["Which path does the air take when we inhale?","Nose, windpipe, lungs","Mouth, stomach, intestines","Ears, throat, stomach","Lungs, windpipe, nose","Where does the air enter, and where does it finally arrive?","Follow a deep breath: enters through the nose, goes down a tube, fills...","When we inhale, air enters through the nose, passes through the windpipe, and reaches the lungs, where the body takes oxygen from it."],"ru":["Какой путь проходит воздух, когда мы вдыхаем?","Нос, трахея, лёгкие","Рот, желудок, кишечник","Уши, горло, желудок","Лёгкие, трахея, нос","Откуда воздух входит и куда он в итоге попадает?","Проследи глубокий вдох: входит через нос, спускается по трубке, наполняет...","При вдохе воздух входит через нос, проходит по трахее и попадает в лёгкие, где тело забирает из него кислород."],"ar":["ما المسار الذي يسلكه الهواء عندما نتنشّق؟","الأنف، القصبة الهوائية، الرئتان","الفم، المعدة، الأمعاء","الأذنان، الحلق، المعدة","الرئتان، القصبة الهوائية، الأنف","من أين يدخل الهواء، وإلى أين يصل في النهاية؟","تتبّعوا نَفَسًا عميقًا: يدخل من الأنف، ينزل في الأنبوب، يمتلئ...","عند الشهيق يدخل الهواء من الأنف، ويمرّ في القصبة الهوائية، ويصل إلى الرئتين، وهناك يأخذ الجسم منه الأكسجين."]}],
["bio",1,{"he":["מה הגוף לוקח מן האוויר בשאיפה?","חמצן, שכל תא בגוף צריך כדי לחיות","פחמן דו־חמצני","אדים","אבק","חשבו מה הגוף צריך, ולא מה הוא פולט החוצה.","מה הגוף שולח החוצה בנשיפה? ההפך הוא מה שהוא לוקח בשאיפה.","בשאיפה נכנס אוויר עם חמצן, והגוף לוקח אותו לתאים. בנשיפה יוצא פחמן דו־חמצני שהגוף לא צריך."],"en":["What does the body take from the air when we inhale?","Oxygen, which every cell in the body needs to live","Carbon dioxide","Vapor","Dust","Think about what the body needs, not what it pushes out.","What does the body send out when we exhale? The opposite is what it takes in when we inhale.","Inhaling brings in air with oxygen, and the body takes it to the cells. Exhaling lets out carbon dioxide that the body does not need."],"ru":["Что тело забирает из воздуха при вдохе?","Кислород, который нужен каждой клетке тела для жизни","Углекислый газ","Пар","Пыль","Подумай, что телу нужно, а не что оно выталкивает наружу.","Что тело выводит при выдохе? Противоположное: то, что оно забирает при вдохе.","При вдохе входит воздух с кислородом, и тело забирает его клеткам. При выдохе выходит углекислый газ, который телу не нужен."],"ar":["ما الذي يأخذه الجسم من الهواء عند الشهيق؟","الأكسجين، الذي تحتاجه كلّ خليّة في الجسم لتعيش","ثاني أكسيد الكربون","البخار","الغبار","فكّروا في ما يحتاجه الجسم، وليس في ما يخرجه.","ما الذي يخرجه الجسم عند الزفير؟ العكس هو ما يأخذه عند الشهيق.","عند الشهيق يدخل هواء فيه أكسجين، ويأخذه الجسم إلى الخلايا. وعند الزفير يخرج ثاني أكسيد الكربون الذي لا يحتاجه الجسم."]}],
["bio",2,{"he":["למה אחרי עלייה במדרגות אנחנו נושמים מהר יותר?","השרירים עבדו קשה וצריכים יותר חמצן, אז הנשימה מאיצה להביא אותו","הריאות נהיות קטנות מהמאמץ","האף נסגר וצריך לנשום דרך הפה","הגוף מתאמן לשכוח לנשום","מה השרירים צריכים כדי לעבוד? מאיפה הוא מגיע?","חשבו על הריאות כמו על משאבה: מה קורה למשאבה כשצריכים הרבה יותר?","במאמץ השרירים צריכים יותר חמצן, ולכן קצב הנשימה עולה כדי לשאוב יותר אוויר, ואיתו יותר חמצן."],"en":["Why do we breathe faster after climbing stairs?","The muscles worked hard and need more oxygen, so breathing speeds up to bring it","The lungs become small from the effort","The nose closes and we must breathe through the mouth","The body practices forgetting to breathe","What do the muscles need in order to work? Where does it come from?","Think of the lungs as a pump: what happens to the pump when much more is needed?","During effort the muscles need more oxygen, so the breathing rate rises to pull in more air. And with it more oxygen."],"ru":["Почему после подъёма по лестнице мы дышим быстрее?","Мышцы усердно работали и нуждаются в большем количестве кислорода, поэтому дыхание ускоряется, чтобы его доставить","Лёгкие становятся маленькими от нагрузки","Нос закрывается, и нужно дышать через рот","Тело тренируется забывать дышать","Что нужно мышцам для работы? Откуда это приходит?","Подумай о лёгких как о насосе: что происходит с насосом, когда нужно намного больше?","При нагрузке мышцам нужно больше кислорода, поэтому темп дыхания растёт, чтобы втянуть больше воздуха. И вместе с ним больше кислорода."],"ar":["لماذا نتنفّس أسرع بعد صعود الدرج؟","العضلات عملت بجهد وتحتاج إلى مزيد من الأكسجين، فيتسارع التنفّس لجلبه","الرئتان تصغران من الجهد","الأنف يُغلق ويجب التنفّس من الفم","الجسم يتدرّب على نسيان التنفّس","ما الذي تحتاجه العضلات لتعمل؟ من أين يأتي؟","فكّروا في الرئتين كمضخّة: ماذا يحدث للمضخّة عندما نحتاج إلى أكثر بكثير؟","عند الجهد تحتاج العضلات إلى مزيد من الأكسجين، ولذلك يرتفع معدّل التنفّس لسحب مزيد من الهواء. ومعه مزيد من الأكسجين."]}],
["bio",3,{"he":["חבר אומר: ״אנחנו נושמים החוצה אוויר בלי שום דבר בו, סתם אוויר ריק״. מה נכון לומר לו?","בנשיפה יוצא אוויר עם פחמן דו־חמצני שהגוף פלט. הוא לא ריק בכלל","נכון. בנשיפה יוצא אוויר ריק לגמרי","לא נכון. בנשיפה יוצא רק חמצן","לא נכון. בנשיפה יוצאים אדים בלבד","חשבו: הגוף לוקח חמצן. מה הוא נותן בתמורה?","איזה גז הגוף מייצר ולא צריך? לאן הוא הולך?","הנשיפה מוציאה אוויר עם פחמן דו־חמצני שהגוף ייצר ולא צריך. בלי הנשיפה הגז הזה היה מצטבר בגוף."],"en":["A friend says: \"We breathe out air with nothing in it. Just empty air.\" What is correct to tell him?","Exhaled air carries carbon dioxide that the body released: it is not empty at all","True, exhaled air is completely empty","Not true: exhaled air is only oxygen","Not true: exhaled air is only vapor","Think: the body takes oxygen. What does it give in return?","Which gas does the body produce and not need? Where does it go?","Exhaling pushes out air with carbon dioxide that the body produced and does not need. Without exhaling, this gas would build up in the body."],"ru":["Друг говорит: «Мы выдыхаем воздух, в котором ничего нет,. Просто пустой воздух». Что правильно ему сказать?","При выдохе выходит воздух с углекислым газом, который тело выделило,: он совсем не пустой","Верно, при выдохе выходит совсем пустой воздух","Неверно, при выдохе выходит только кислород","Неверно, при выдохе выходит только пар","Подумай: тело забирает кислород. Что оно отдаёт взамен?","Какой газ тело производит и в котором не нуждается? Куда он уходит?","Выдох выводит воздух с углекислым газом, который тело произвело и которое ему не нужно. Без выдоха этот газ накапливался бы в теле."],"ar":["يقول صديق: \"نحن نخرج بالزفير هواءً لا شيء فيه. هواء فارغًا\". ما الصحيح أن نقول له؟","في الزفير يخرج هواء مع ثاني أكسيد الكربون الذي طرحه الجسم. وهو ليس فارغًا إطلاقًا","صحيح, في الزفير يخرج هواء فارغ تمامًا","غير صحيح, في الزفير يخرج أكسجين فقط","غير صحيح, في الزفير يخرج بخار فقط","فكّروا: الجسم يأخذ الأكسجين. فماذا يعطي في المقابل؟","أيّ غاز ينتجه الجسم ولا يحتاجه؟ إلى أين يذهب؟","الزفير يُخرج هواءً مع ثاني أكسيد الكربون الذي أنتجه الجسم ولا يحتاجه. بدون الزفير كان هذا الغاز سيتجمّع في الجسم."]}],
["mat",1,{"he":["איזה משאב לא ייגמר אף פעם, גם אם נשתמש בו כל יום?","שמש","נפט","פחם","גז","חשבו: מה חוזר כל בוקר מחדש בלי שנעשה דבר?","זכרו את הכלל: משאב מתחדש הוא כזה שלא נגמר. מה מהרשימה לא תלוי בכמות שיש באדמה?","השמש היא משאב מתחדש. היא זורחת כל יום ולא נגמרת. נפט, פחם וגז נמצאים בכמות מוגבלת באדמה ונגמרים אחרי שימוש."],"en":["Which resource will never run out, even if we use it every day?","The sun","Oil","Coal","Gas","Think: what comes back new every morning without us doing anything?","Remember the rule: a renewable resource is one that does not run out. Which item on the list does not depend on how much is in the ground?","The sun is a renewable resource: it rises every day and does not run out. Oil, coal, and gas exist in a limited amount in the ground and run out after use."],"ru":["Какой ресурс никогда не кончится, даже если пользоваться им каждый день?","Солнце","Нефть","Уголь","Газ","Подумай: что возвращается новым каждое утро без наших действий?","Вспомни правило: возобновляемый ресурс. Тот, что не кончается. Что из списка не зависит от количества в земле?","Солнце: возобновляемый ресурс: оно встаёт каждый день и не кончается. Нефть, уголь и газ есть в земле в ограниченном количестве и кончаются после использования."],"ar":["أيّ مورد لن ينفد أبدًا، حتى لو استخدمناه كلّ يوم؟","الشمس","النفط","الفحم","الغاز","فكّروا: ما الذي يعود جديدًا كلّ صباح دون أن نفعل شيئًا؟","تذكّروا القاعدة: المورد المتجدّد هو الذي لا ينفد. أيّ عنصر في القائمة لا يعتمد على الكمّية الموجودة في الأرض؟","الشمس مورد متجدّد: تشرق كلّ يوم ولا تنفد. النفط والفحم والغاز موجودون بكمّية محدودة في الأرض وينفدون بعد الاستخدام."]}],
["mat",1,{"he":["מה המשותף לנפט ולפחם?","שניהם משאבים מתכלים. הכמות שלהם מוגבלת ונגמרת אחרי שימוש","שניהם מתחדשים כל שנה","שניהם נקיים ולא מזהמים","שניהם נמצאים בים בלבד","חשבו על הכמות שלהם באדמה: האם היא מתמלאת מחדש?","זכרו את שני סוגי המשאבים. לאיזה סוג שייכים דלקים שנשרפים?","נפט ופחם הם משאבים מתכלים: יש מהם כמות מוגבלת באדמה, וכל שימוש מקטין אותה. גם שריפתם מזהמת את האוויר."],"en":["What do oil and coal have in common?","Both are exhaustible resources: their amount is limited and runs out after use","Both renew every year","Both are clean and do not pollute","Both are found only in the sea","Think about their amount in the ground: does it refill?","Remember the two types of resources. Which type do fuels that get burned belong to?","Oil and coal are exhaustible resources: there is a limited amount of them in the ground, and every use makes it smaller. Burning them also pollutes the air."],"ru":["Что общего у нефти и угля?","Оба: исчерпаемые ресурсы: их количество ограничено и кончается после использования","Оба возобновляются каждый год","Оба чистые и не загрязняют","Оба находятся только в море","Подумай об их количестве в земле: пополняется ли оно?","Вспомни два типа ресурсов. К какому типу относится топливо, которое сжигают?","Нефть и уголь: исчерпаемые ресурсы: в земле их ограниченное количество, и каждое использование уменьшает его. Их сжигание также загрязняет воздух."],"ar":["ما القاسم المشترك بين النفط والفحم؟","كلاهما موارد نافدة: كمّيتهما محدودة وتنفد بعد الاستخدام","كلاهما يتجدّد كلّ سنة","كلاهما نظيف ولا يُلوّث","كلاهما موجود في البحر فقط","فكّروا في كمّيتهما في الأرض: هل تتجدّد؟","تذكّروا نوعي الموارد. إلى أيّ نوع تنتمي الوقودات التي تُحرق؟","النفط والفحم موارد نافدة: توجد منهما كمّية محدودة في الأرض، وكلّ استخدام يقلّلها. واحتراقهما يُلوّث الهواء أيضًا."]}],
["mat",2,{"he":["עיר מחליפה תחנת כוח על פחם בתחנת כוח רוח. שתי סיבות טובות לשינוי:","רוח לא נגמרת, והפקת חשמל ממנה לא מזהמת את האוויר","רוח זולה יותר בסופרמרקט","טורבינות רוח יפות יותר באלבומי תמונות","פחם מסריח, ורוח ריחנית","בדקו את שני סוגי המשאבים: לאיזה סוג פחם, ולאיזה סוג רוח? ומה קורה לאוויר בכל אחד?","אחת הסיבות על הכמות (מתכלה מול מתחדש), והשנייה על האוויר. נסחו את שתיהן.","רוח היא משאב מתחדש שלא נגמר, בניגוד לפחם. ובניגוד לשריפת פחם, הפקת חשמל מרוח לא מזהמת את האוויר."],"en":["A city replaces a coal power station with a wind power station. Two good reasons for the change:","Wind never runs out, and making electricity from it does not pollute the air","Wind is cheaper at the supermarket","Wind turbines look nicer in photo albums","Coal smells bad and wind smells nice","Check the two resource types: which type is coal, and which type is wind? And what happens to the air with each?","One reason is about the amount (exhaustible versus renewable), and the other is about the air. Phrase both.","Wind is a renewable resource that does not run out, unlike coal. And unlike burning coal, making electricity from wind does not pollute the air."],"ru":["Город заменяет угольную электростанцию на ветряную. Две хорошие причины для перемены:","Ветер не кончается, и производство электричества из него не загрязняет воздух","Ветер дешевле в супермаркете","Ветряные турбины красивее в фотоальбомах","Уголь воняет, а ветер пахнет приятно","Проверь два типа ресурсов: к какому типу уголь и к какому ветер? И что происходит с воздухом в каждом случае?","Одна причина про количество (исчерпаемый против возобновляемого), а вторая про воздух. Сформулируй обе.","Ветер: возобновляемый ресурс, который не кончается, в отличие от угля. И в отличие от сжигания угля, производство электричества из ветра не загрязняет воздух."],"ar":["تستبدل مدينة محطّة كهرباء على الفحم بمحطّة كهرباء رياح. سببان جيّدان للتغيير:","الريح لا تنفد، وإنتاج الكهرباء منها لا يُلوّث الهواء","الريح أرخص في السوبرماركت","توربينات الريح أجمل في ألبومات الصور","الفحم رائحته كريهة والريح عطرة","افحصوا نوعي الموارد: إلى أيّ نوع ينتمي الفحم، وإلى أيّ نوع الريح؟ وماذا يحدث للهواء في كلّ واحد؟","أحد السببين عن الكمّية (نافد مقابل متجدّد)، والثاني عن الهواء. صيغوهما كليهما.","الريح مورد متجدّد لا ينفد، بخلاف الفحم. وبخلاف حرق الفحم، فإن إنتاج الكهرباء من الريح لا يُلوّث الهواء."]}],
["mat",3,{"he":["ממשלה רוצה לחסוך נפט. איזו פעולה באמת חוסכת נפט, ולא רק נשמעת טוב?","מעבר לאוטובוסים חשמליים שנטענים מחשמל סולארי","צביעת מיכלי הנפט בירוק","הגדלת מספר תחנות הדלק בעיר","יום הולדת לאומי לנפט","נפט נשרף בעיקר לתחבורה ולחשמל. מה מפחית שריפה אמיתית?","חשבו: איזו פעולה מחליפה שימוש בנפט בשימוש במשאב אחר?","אוטובוס חשמלי על חשמל סולארי מחליף דלק מנפט באנרגיית שמש מתחדשת. חיסכון אמיתי. צבע ומסיבות לא משנים כמה נפט נשרף."],"en":["A government wants to save oil. Which action really saves oil, and not just sounds good?","Switching to electric buses charged from solar electricity","Painting the oil tanks green","Building more gas stations in the city","A national birthday party for oil","Oil is burned mostly for transport and electricity. What reduces real burning?","Think: which action replaces oil use with the use of another resource?","An electric bus running on solar electricity replaces fuel from oil with renewable sun energy: real saving. Paint and parties do not change how much oil is burned."],"ru":["Правительство хочет экономить нефть. Какое действие действительно экономит нефть, а не просто хорошо звучит?","Переход на электрические автобусы, заряжаемые от солнечной электроэнергии","Покраска нефтяных цистерн в зелёный цвет","Увеличение числа заправок в городе","Национальный день рождения нефти","Нефть сжигают в основном для транспорта и электричества. Что уменьшает настоящее сжигание?","Подумай: какое действие заменяет использование нефти использованием другого ресурса?","Электрический автобус на солнечной электроэнергии заменяет топливо из нефти возобновляемой энергией солнца: настоящая экономия. Краска и праздники не меняют, сколько нефти сжигается."],"ar":["تريد حكومة توفير النفط. أيّ إجراء يوفّر النفط حقًّا، وليس فقط يبدو جميلًا؟","الانتقال إلى حافلات كهربائية تُشحن بكهرباء شمسية","طلاء خزّانات النفط بالأخضر","زيادة عدد محطّات الوقود في المدينة","عيد ميلاد وطنيّ للنفط","يُحرق النفط غالبًا للمواصلات والكهرباء. ما الذي يقلّل الحرق الحقيقيّ؟","فكّروا: أيّ إجراء يستبدل استخدام النفط باستخدام مورد آخر؟","الحافلة الكهربائية العاملة بكهرباء شمسية تستبدل وقود النفط بطاقة شمسية متجدّدة: توفير حقيقيّ. أمّا الطلاء والاحتفالات فلا تغيّر كمّية النفط المحروقة."]}],
["eco",1,{"he":["עם מי מתחילה כל שרשרת מזון?","צמח, שמייצר מזון מאור השמש","אריה, המלך של החיות","חולדה קטנה","פטרייה ביער","מי מייצר את המזון בטבע, בלי לאכול אף אחד אחר?","זכרו: היצרן מייצר מזון מאור השמש. מי מסוגל לעשות את זה?","שרשרת מזון מתחילה תמיד בצמח, היצרן, שמייצר מזון מאור השמש. כל השאר אוכלים אחד את השני."],"en":["Who does every food chain start with?","A plant, which makes food from sunlight","A lion, the king of the animals","A small rat","A mushroom in the forest","Who makes food in nature without eating anyone else?","Remember: the producer makes food from sunlight. Who is able to do that?","A food chain always starts with a plant: the producer. Which makes food from sunlight. All the rest eat one another."],"ru":["С кого начинается любая пищевая цепочка?","С растения, которое производит еду из солнечного света","Со льва, царя зверей","С маленькой крысы","С гриба в лесу","Кто производит еду в природе, не поедая никого другого?","Вспомни: производитель делает еду из солнечного света. Кто способен на это?","Пищевая цепочка всегда начинается с растения: производителя, которое делает еду из солнечного света. Все остальные едят друг друга."],"ar":["بمن تبدأ كلّ سلسلة غذاء؟","بنبات يصنع الغذاء من ضوء الشمس","بالأسد، ملك الحيوانات","بجرذ صغير","بفطر في الغابة","من يصنع الغذاء في الطبيعة دون أن يأكل أحدًا آخر؟","تذكّروا: المنتِج يصنع الغذاء من ضوء الشمس. من يستطيع فعل ذلك؟","سلسلة الغذاء تبدأ دائمًا بنبات: المنتِج. الذي يصنع الغذاء من ضوء الشمس. أمّا الباقون فيأكل بعضهم بعضًا."]}],
["eco",1,{"he":["ארנב אוכל עשב. איזה תפקיד יש לארנב בשרשרת המזון?","צרכן - בעל חיים שאוכל את הצמח","יצרן - מייצר מזון מאור","שמש קטנה","הוא לא בשרשרת בכלל","מייצר הארנב מזון בעצמו, או אוכל מזון שמישהו אחר ייצר?","חשבו על שני התפקידים: יצרן מול צרכן. מי עושה מה?","הארנב הוא צרכן: הוא אוכל את העשב שהוא היצרן. כך המזון עובר מן הצמח אל החיה."],"en":["A rabbit eats grass. What role does the rabbit have in the food chain?","Consumer: an animal that eats the plant","Producer: makes food from light","A small sun","It is not in the chain at all","Does the rabbit make food itself, or eat food that someone else made?","Think about the two roles: producer versus consumer. Who does what?","The rabbit is a consumer: it eats the grass, which is the producer. That is how food passes from the plant to the animal."],"ru":["Кролик ест траву. Какова роль кролика в пищевой цепочке?","Потребитель: животное, которое ест растение","Производитель: делает еду из света","Маленькое солнце","Его вообще нет в цепочке","Производит ли кролик еду сам или ест еду, которую произвёл кто-то другой?","Подумай о двух ролях: производитель против потребителя. Кто что делает?","Кролик: потребитель: он ест траву, которая является производителем. Так еда переходит от растения к животному."],"ar":["يأكل الأرنب العشب. ما دور الأرنب في سلسلة الغذاء؟","مستهلِك: حيوان يأكل النبات","منتِج: يصنع الغذاء من الضوء","شمس صغيرة","ليس في السلسلة إطلاقًا","هل يصنع الأرنب الغذاء بنفسه، أم يأكل غذاءً صنعه غيره؟","فكّروا في الدورين: منتِج مقابل مستهلِك. من يفعل ماذا؟","الأرنب مستهلِك: يأكل العشب الذي هو المنتِج. هكذا ينتقل الغذاء من النبات إلى الحيوان."]}],
["eco",2,{"he":["מה יקרה לשועלים באזור שבו כל הארנבים עזבו?","יתקשו למצוא מזון, כי ארנבים הם חוליה חשובה בשרשרת שלהם","יהפכו לצמחונים מיד","לא יקרה כלום. שועלים אוכלים אוויר","יגדלו להיות צמחים","מה השועל אוכל? מה קורה לטורף כשהטרף נעלם?","חשבו על השרשרת: צמח, ארנב, שועל. מה קורה לחוליה האחרונה כשהאמצעית נשברת?","שועלים אוכלים ארנבים. בלי ארנבים אין להם מזון. כך כל חוליה בשרשרת חשובה לאלה שמעליה."],"en":["What will happen to the foxes in an area where all the rabbits left?","They will struggle to find food, because rabbits are an important link in their chain","They will become vegetarians immediately","Nothing will happen: foxes eat air","They will grow into plants","What does the fox eat? What happens to a predator when the prey disappears?","Think about the chain: plant, rabbit, fox. What happens to the last link when the middle one breaks?","Foxes eat rabbits. Without rabbits they have no food: that is how every link in the chain matters to those above it."],"ru":["Что случится с лисами в местности, откуда ушли все кролики?","Им будет трудно найти еду, потому что кролики: важное звено в их цепочке","Они сразу станут вегетарианцами","Ничего не случится: лисы едят воздух","Они вырастут и станут растениями","Что ест лиса? Что происходит с хищником, когда добыча исчезает?","Подумай о цепочке: растение, кролик, лиса. Что происходит с последним звеном, когда среднее рвётся?","Лисы едят кроликов. Без кроликов у них нет еды: так каждое звено цепочки важно для тех, кто выше."],"ar":["ماذا سيحدث للثعالب في منطقة غادرتها كلّ الأرانب؟","ستجد صعوبة في إيجاد الغذاء، لأن الأرانب حلقة مهمّة في سلسلتها","ستصبح نباتية فورًا","لن يحدث شيء: الثعالب تأكل الهواء","ستكبر وتصبح نباتات","ماذا يأكل الثعلب؟ ماذا يحدث للمفترس عندما تختفي الفريسة؟","فكّروا في السلسلة: نبات، أرنب، ثعلب. ماذا يحدث للحلقة الأخيرة عندما تنكسر الوسطى؟","الثعالب تأكل الأرانب. بدون أرانب لا يكون لها غذاء: هكذا كلّ حلقة في السلسلة مهمّة لمن فوقها."]}],
["eco",3,{"he":["מדביר רצה להשמיד את כל הצרעות בעיר \"כי הן מעצבנות\". למה מדענית תתריע נגד?","צרעות הן חוליה בשרשרת. הן טורפות חרקים אחרים, והיעלמותן תשנה את כל השרשרת","צרעות חמודות מדי כדי להשמיד","צרעות מייצרות חמצן כמו עצים","אין סיבה. צריך להשמיד אותן","חשבו: מי אוכל את הצרעות, ומה הצרעות אוכלות? מה קורה כשחוליה נעלמת?","זכרו את הכלל על כל חוליה בשרשרת. מה קרה לארנבים ולשועלים כשחוליה נשברה?","כל חוליה בשרשרת חשובה: צרעות שולטות במספר החרקים, וציפורים אוכלות צרעות. היעלמותן תפר את האיזון של כולם."],"en":["An exterminator wants to wipe out all the wasps in the city \"because they are annoying.\" Why would a scientist warn against it?","Wasps are a link in the chain: they hunt other insects, and their disappearance would change the whole chain","Wasps are too cute to exterminate","Wasps make oxygen like trees","There is no reason: they should be exterminated","Think: who eats the wasps, and what do the wasps eat? What happens when a link disappears?","Remember the rule about every link in the chain. What happened to the rabbits and foxes when a link broke?","Every link in the chain matters: wasps control the number of insects, and birds eat wasps. Their disappearance would break everyone's balance."],"ru":["Дезинсектор хочет уничтожить всех ос в городе, «потому что они надоедают». Почему учёная будет предостерегать против этого?","Осы: звено в цепочке: они охотятся на других насекомых, и их исчезновение изменит всю цепочку","Осы слишком милые, чтобы их уничтожать","Осы производят кислород, как деревья","Нет причины: их нужно уничтожить","Подумай: кто ест ос, и кого едят осы? Что происходит, когда звено исчезает?","Вспомни правило о каждом звене цепочки. Что случилось с кроликами и лисами, когда звено порвалось?","Каждое звено цепочки важно: осы контролируют число насекомых, а птицы едят ос. Их исчезновение нарушит равновесие всех."],"ar":["يريد مُبيد أن يقضي على كلّ الدبابير في المدينة \"لأنها مزعجة\". لماذا ستحذّر عالمة من ذلك؟","الدبابير حلقة في السلسلة: تفترس حشرات أخرى، واختفاؤها سيغيّر السلسلة كلّها","الدبابير لطيفة جدًّا لإبادتها","الدبابير تنتج الأكسجين مثل الأشجار","لا سبب: يجب إبادتها","فكّروا: من يأكل الدبابير، وماذا تأكل الدبابير؟ ماذا يحدث عندما تختفي حلقة؟","تذكّروا القاعدة عن كلّ حلقة في السلسلة. ماذا حدث للأرانب والثعالب عندما انكسرت حلقة؟","كلّ حلقة في السلسلة مهمّة: الدبابير تتحكّم في عدد الحشرات، والطيور تأكل الدبابير. اختفاؤها سيُخلّ بتوازن الجميع."]}],
["bio",1,{"he":["מה הדם מוביל לתאי הגוף?","חמצן ומזון שהם צריכים כדי לחיות","רק מים","חול קטן","אור שמש","חשבו מה התאים צריכים כדי לחיות ולעבוד. מי מביא להם את זה?","הגוף לוקח דברים משני מקומות: מן האוויר שאנחנו נושמים ומן האוכל שאנחנו אוכלים. מי מחלק אותם לכל התאים?","הדם הוא רכבת ההובלה של הגוף: הוא נושא לתאים חמצן מהריאות וחומרי מזון מהעיכול. בלעדיהם התאים לא יכולים לחיות."],"en":["What does the blood carry to the body's cells?","Oxygen and food that they need to live","Only water","A little sand","Sunlight","Think about what the cells need to live and work. Who brings it to them?","The body takes things from two places: from the air we breathe and from the food we eat. Who delivers them to all the cells?","Blood is the body's delivery train: it carries the cells oxygen from the lungs and nutrients from digestion. Without them the cells cannot live."],"ru":["Что кровь переносит к клеткам тела?","Кислород и питание, которые им нужны для жизни","Только воду","Немного песка","Солнечный свет","Подумай, что нужно клеткам для жизни и работы. Кто им это приносит?","Тело получает вещества из двух мест: из воздуха, которым дышим, и из еды, которую едим. Кто разносит их всем клеткам?","Кровь: транспортный поезд тела: она несёт клеткам кислород из лёгких и питательные вещества из пищеварения. Без них клетки не могут жить."],"ar":["ما الذي ينقله الدمّ إلى خلايا الجسم؟","الأكسجين والغذاء اللذين تحتاجهما لتعيش","الماء فقط","قليل من الرمل","ضوء الشمس","فكّروا في ما تحتاجه الخلايا لتعيش وتعمل. من يجلبه إليها؟","يأخذ الجسم أشياء من مكانين: من الهواء الذي نتنفّسه ومن الطعام الذي نأكله. من يوزّعها على كلّ الخلايا؟","الدمّ هو قطار النقل في الجسم: ينقل إلى الخلايا الأكسجين من الرئتين والموادّ الغذائية من الهضم. وبدونها لا تستطيع الخلايا العيش."]}],
["bio",1,{"he":["דרך מה זורם הדם בגוף?","כלי דם - עורקים וורידים","העצמות","קנה הנשימה","העור","חשבו על צינורות קטנים שמוליכים נוזל. איך קוראים להם בגוף?","שני סוגי צינורות: אלה שמובילים מהלב ואלה שמחזירים אליו.","הדם זורם בכלי הדם: העורקים מובילים דם מהלב לגוף, והוורידים מחזירים אותו ללב. מעגל שלם."],"en":["Through what does blood flow in the body?","Blood vessels: arteries and veins","The bones","The windpipe","The skin","Think about small tubes that carry liquid. What are they called in the body?","Two kinds of tubes: those that lead away from the heart and those that bring back to it.","Blood flows in the blood vessels: the arteries carry blood from the heart to the body, and the veins return it to the heart. A complete circle."],"ru":["По чему течёт кровь в теле?","По кровеносным сосудам: артериям и венам","По костям","По трахее","По коже","Подумай о маленьких трубочках, несущих жидкость. Как они называются в теле?","Два вида трубочек: одни ведут от сердца, другие возвращают к нему.","Кровь течёт по сосудам: артерии несут кровь от сердца к телу, а вены возвращают её к сердцу. Полный круг."],"ar":["عبر ماذا يجري الدمّ في الجسم؟","الأوعية الدموية: الشرايين والأوردة","العظام","القصبة الهوائية","الجلد","فكّروا في أنابيب صغيرة تنقل سائلًا. ماذا تُسمّى في الجسم؟","نوعان من الأنابيب: تلك التي تنقل من القلب وتلك التي تُرجع إليه.","الدمّ يجري في الأوعية الدموية: الشرايين تنقل الدمّ من القلب إلى الجسم، والأوردة تُرجعه إلى القلب. دائرة كاملة."]}],
["bio",2,{"he":["מה קורה לדופק אחרי ריצה, ולמה?","הלב פועם מהר יותר, כי השרירים צריכים יותר חמצן והוא שולח דם מהר יותר","הלב מפסיק לפעום לנוח","הדופק נשאר בדיוק אותו דבר תמיד","הלב פועם לאט יותר כדי לחסוך דם","מה השרירים צריכים במאמץ, ומי מספק את זה בדם?","חשבו על משאבה בבית: מה היא עושה כשצריכים הרבה יותר מים, מהר יותר?","במאמץ השרירים צריכים יותר חמצן, והלב מאיץ את הפעימות כדי לשלוח אליהם דם מהר יותר. לכן הדופק עולה אחרי ריצה."],"en":["What happens to the pulse after running, and why?","The heart beats faster, because the muscles need more oxygen and it sends blood faster","The heart stops beating to rest","The pulse stays exactly the same always","The heart beats slower to save blood","What do the muscles need during effort, and who supplies it in the blood?","Think about a pump at home: what does it do when much more water is needed, much faster?","During effort the muscles need more oxygen, and the heart speeds up its beats to send them blood faster. That is why the pulse rises after running."],"ru":["Что происходит с пульсом после бега и почему?","Сердце бьётся быстрее, потому что мышцам нужно больше кислорода, и оно посылает кровь быстрее","Сердце перестаёт биться, чтобы отдохнуть","Пульс всегда остаётся точно таким же","Сердце бьётся медленнее, чтобы сэкономить кровь","Что нужно мышцам при нагрузке, и кто поставляет это в крови?","Подумай о домашнем насосе: что он делает, когда нужно намного больше воды, намного быстрее?","При нагрузке мышцам нужно больше кислорода, и сердце ускоряет удары, чтобы быстрее посылать им кровь. Поэтому пульс растёт после бега."],"ar":["ماذا يحدث للنبض بعد الركض، ولماذا؟","القلب ينبض أسرع، لأن العضلات تحتاج إلى مزيد من الأكسجين فيرسل الدمّ أسرع","القلب يتوقّف عن النبض ليرتاح","النبض يبقى كما هو تمامًا دائمًا","القلب ينبض أبطأ ليوفّر الدمّ","ما الذي تحتاجه العضلات عند الجهد، ومن يوفّره في الدمّ؟","فكّروا في مضخّة في البيت: ماذا تفعل عندما نحتاج إلى ماء أكثر بكثير وأسرع بكثير؟","عند الجهد تحتاج العضلات إلى مزيد من الأكسجين، فيُسرع القلب النبضات ليرسل إليها الدمّ أسرع. لذلك يرتفع النبض بعد الركض."]}],
["bio",3,{"he":["למה נכון לומר שהלב הוא \"שריר שאינו נח אף פעם\"?","כי הוא פועם ושואב דם כל הזמן, גם בשינה. בלעדיו אין לתאים חמצן ומזון","כי הוא עשוי מברזל ולא מתעייף","כי הוא לא מחובר לשום מקום","זה לא נכון. הלב נח כל לילה","מתי הגוף צריך דם? האם יש זמן שבו התאים יכולים בלי חמצן?","חשבו מה יקרה לתאים אם ההובלה תיעצר לכמה דקות.","התאים צריכים חמצן ומזון כל רגע, גם בשינה. לכן הלב שואב דם בלי הפסקה כל החיים. הוא שריר, אבל שריר מיוחד שלא נח."],"en":["Why is it correct to say that the heart is \"a muscle that never rests\"?","Because it beats and pumps blood all the time: even in sleep. And without it the cells have no oxygen and food","Because it is made of iron and does not get tired","Because it is not connected to anything","That is not correct: the heart rests every night","When does the body need blood? Is there a time when the cells can go without oxygen?","Think about what would happen to the cells if the delivery stopped for a few minutes.","The cells need oxygen and food every moment, even in sleep. So the heart pumps blood without stopping for a whole lifetime: it is a muscle, but a special muscle that does not rest."],"ru":["Почему правильно говорить, что сердце: «мышца, которая никогда не отдыхает»?","Потому что оно бьётся и качает кровь всё время: даже во сне. И без него у клеток нет кислорода и питания","Потому что оно сделано из железа и не устаёт","Потому что оно ни к чему не подключено","Это неправильно: сердце отдыхает каждую ночь","Когда телу нужна кровь? Бывает ли время, когда клетки могут без кислорода?","Подумай, что случится с клетками, если доставка остановится на несколько минут.","Клеткам нужны кислород и питание каждое мгновение, даже во сне. Поэтому сердце качает кровь без остановки всю жизнь: это мышца, но особенная мышца, которая не отдыхает."],"ar":["لماذا يصحّ القول إن القلب \"عضلة لا ترتاح أبدًا\"؟","لأنه ينبض ويضخّ الدمّ طوال الوقت: حتى في النوم. وبدونه لا يحصل الخلايا على أكسجين وغذاء","لأنه مصنوع من الحديد ولا يتعب","لأنه غير متّصل بأيّ مكان","هذا غير صحيح, القلب يرتاح كلّ ليلة","متى يحتاج الجسم إلى الدمّ؟ هل يوجد وقت تستطيع فيه الخلايا الاستغناء عن الأكسجين؟","فكّروا في ما سيحدث للخلايا لو توقّف النقل بضع دقائق.","تحتاج الخلايا إلى الأكسجين والغذاء كلّ لحظة، حتى في النوم. لذلك يضخّ القلب الدمّ بلا توقّف طوال العمر: هو عضلة، لكن عضلة خاصّة لا ترتاح."]}],
["erg",1,{"he":["מאיפה מגיע החשמל לשקע בבית?","מתחנות כוח שמפיקות אותו","מהעננים ביום גשום","מהחנות שמוכרת מנורות","הוא נולד בתוך הקיר","חשבו: החוטים מהבית מחוברים למקום אחד גדול. איזה?","איזה מקום \"יוצר\" חשמל ושולח אותו בעמודים וחוטים לערים?","החשמל מופק בתחנות כוח, ומשם זורם בחוטים לערים, לבתים ולשקע בקיר."],"en":["Where does the electricity in the home socket come from?","From power stations that produce it","From the clouds on a rainy day","From the store that sells lamps","It is born inside the wall","Think: the wires from the house are connected to one big place. Which?","Which place \"creates\" electricity and sends it on poles and wires to the cities?","Electricity is produced in power stations, and from there it flows through wires to cities, homes, and the wall socket."],"ru":["Откуда приходит электричество в домашнюю розетку?","Из электростанций, которые его производят","Из облаков в дождливый день","Из магазина, который продаёт лампы","Оно рождается внутри стены","Подумай: провода из дома подключены к одному большому месту. К какому?","Какое место «создаёт» электричество и посылает его по столбам и проводам в города?","Электричество производится на электростанциях, а оттуда течёт по проводам в города, дома и в настенную розетку."],"ar":["من أين تأتي الكهرباء إلى المقبس في البيت؟","من محطّات توليد تنتجها","من الغيوم في يوم ممطر","من المتجر الذي يبيع المصابيح","تولد داخل الحائط","فكّروا: الأسلاك من البيت متّصلة بمكان واحد كبير. أيّ مكان؟","أيّ مكان \"يصنع\" الكهرباء ويرسلها على الأعمدة والأسلاك إلى المدن؟","تُنتَج الكهرباء في محطّات التوليد، ومن هناك تجري في الأسلاك إلى المدن والبيوت وإلى مقبس الحائط."]}],
["erg",1,{"he":["איזו דרך להפיק חשמל לא מזהמת את האוויר?","לוחות שמש על הגגות","שריפת פחם","שריפת נפט","שריפת פחמים למנגל","חשבו: איזו דרך משתמשת במשאב מתחדש בלי שריפה?","מה משותף לכל התשובות עם שריפה? ומה מיוחד בלוחות שמש?","לוחות שמש הופכים אור לחשמל בלי שריפה ולכן בלי זיהום. שריפת פחם ונפט פולטת גזים שמזהמים את האוויר ומחממים את כדור הארץ."],"en":["Which way of making electricity does not pollute the air?","Solar panels on the roofs","Burning coal","Burning oil","Burning charcoal for a barbecue","Think: which way uses a renewable resource without burning?","What do all the answers with burning share? And what is special about solar panels?","Solar panels turn light into electricity without burning, and therefore without pollution. Burning coal and oil releases gases that pollute the air and warm the Earth."],"ru":["Какой способ производства электричества не загрязняет воздух?","Солнечные панели на крышах","Сжигание угля","Сжигание нефти","Сжигание углей для мангала","Подумай: какой способ использует возобновляемый ресурс без сжигания?","Что общего у всех ответов со сжиганием? И что особенного в солнечных панелях?","Солнечные панели превращают свет в электричество без сжигания, а значит без загрязнения. Сжигание угля и нефти выделяет газы, которые загрязняют воздух и нагревают Землю."],"ar":["أيّ طريقة لإنتاج الكهرباء لا تُلوّث الهواء؟","ألواح شمسية على الأسطح","حرق الفحم","حرق النفط","حرق الفحم النباتيّ للشواء","فكّروا: أيّ طريقة تستخدم موردًا متجدّدًا دون حرق؟","ما المشترك بين كلّ الإجابات التي فيها حرق؟ وما المميّز في الألواح الشمسية؟","الألواح الشمسية تحوّل الضوء إلى كهرباء دون حرق، وبالتالي دون تلويث. حرق الفحم والنفط يُطلق غازات تُلوّث الهواء وتسخّن الأرض."]}],
["erg",2,{"he":["מדוע שריפת דלקים לחשמל מזיקה לאקלים?","הגזים שנפלטים מחממים את כדור הארץ ומשנים את האקלים","היא עושה רעש חזק שמפחיד ציפורים","היא גורמת לרעידות אדמה","היא הורסת את הירח לאט לאט","מה יוצא מן הארובות של תחנת כוח על דלקים, ומה הוא עושה לאוויר?","זכרו: שריפה פולטת גזים. מה הגזים עושים לחום של כדור הארץ?","שריפת נפט ופחם פולטת גזים שמזהמים את האוויר ומחממים את כדור הארץ, וכך פוגעים באקלים. לכן עדיף להפיק חשמל ממקורות מתחדשים."],"en":["Why does burning fuels for electricity harm the climate?","The gases that are released warm the Earth and change the climate","It makes a loud noise that scares birds","It causes earthquakes","It slowly destroys the moon","What comes out of the chimneys of a fuel power station, and what does it do to the air?","Remember: burning releases gases. What do the gases do to the Earth's heat?","Burning oil and coal releases gases that pollute the air and warm the Earth. And so they harm the climate. That is why it is better to make electricity from renewable sources."],"ru":["Почему сжигание топлива для электричества вредит климату?","Выделяющиеся газы нагревают Землю и меняют климат","Оно создаёт громкий шум, пугающий птиц","Оно вызывает землетрясения","Оно потихоньку разрушает Луну","Что выходит из труб топливной электростанции, и что это делает с воздухом?","Вспомни: сжигание выделяет газы. Что газы делают с теплом Земли?","Сжигание нефти и угля выделяет газы, которые загрязняют воздух и нагревают Землю,. И так вредят климату. Поэтому лучше производить электричество из возобновляемых источников."],"ar":["لماذا يضرّ حرق الوقود لإنتاج الكهرباء بالمناخ؟","الغازات المنبعثة تسخّن الأرض وتغيّر المناخ","يصدر ضجيجًا قويًّا يُخيف العصافير","يسبّب زلازل","يدمّر القمر شيئًا فشيئًا","ما الذي يخرج من مداخن محطّة كهرباء على الوقود، وماذا يفعل بالهواء؟","تذكّروا: الحرق يُطلق غازات. ماذا تفعل الغازات بحرارة الأرض؟","حرق النفط والفحم يُطلق غازات تُلوّث الهواء وتسخّن الأرض. وهكذا تضرّ بالمناخ. لذلك الأفضل إنتاج الكهرباء من مصادر متجدّدة."]}],
["erg",3,{"he":["עיר מחליטה: \"עד 2035 רוב החשמל שלנו יהיה ממקורות מתחדשים\". מה צפוי להשתנות באוויר העירוני, ולמה?","יהיה נקי יותר, כי שמש ורוח מפיקים חשמל בלי שריפה ובלי גזים מזהמים","יהיה מזוהם יותר, כי טורבינות רוח מפליטות עשן","לא ישתנה כלום. חשמל הוא חשמל","יהפוך כחול כמו השמיים","חשבו מה ההבדל בין הפקת חשמל מדלקים לבין הפקה משמש ורוח, מבחינת מה שיוצא לאוויר.","איזו דרך פולטת גזים ואיזו לא? מה עושה פחות שריפה לאוויר?","חשמל משמש ורוח מופק בלי שריפה, ולכן בלי הגזים שמזהמים. ככל שהעיר תשתמש יותר במקורות מתחדשים, כך האוויר יהיה נקי יותר."],"en":["A city decides: \"By 2035 most of our electricity will be from renewable sources.\" What is expected to change in the city's air, and why?","It will be cleaner, because sun and wind make electricity without burning and without polluting gases","It will be more polluted, because wind turbines release smoke","Nothing will change: electricity is electricity","It will turn blue like the sky","Think about the difference between making electricity from fuels and making it from sun and wind, in terms of what goes into the air.","Which way releases gases and which does not? What does less burning do to the air?","Electricity from sun and wind is made without burning, and therefore without the polluting gases. The more the city uses renewable sources, the cleaner the air will be."],"ru":["Город решает: «К 2035 году большая часть нашей электроэнергии будет из возобновляемых источников». Что должно измениться в воздухе города и почему?","Он станет чище, потому что солнце и ветер производят электричество без сжигания и без загрязняющих газов","Он станет грязнее, потому что ветряные турбины выделяют дым","Ничего не изменится: электричество есть электричество","Он станет голубым, как небо","Подумай, в чём разница между производством электричества из топлива и из солнца и ветра с точки зрения того, что попадает в воздух.","Какой способ выделяет газы, а какой нет? Что меньшее сжигание делает с воздухом?","Электричество из солнца и ветра производится без сжигания, а значит без загрязняющих газов. Чем больше город использует возобновляемые источники, тем чище будет воздух."],"ar":["تقرّر مدينة: \"حتى 2035 ستكون معظم كهربائنا من مصادر متجدّدة\". ما المتوقَّع أن يتغيّر في هواء المدينة، ولماذا؟","سيصبح أنظف، لأن الشمس والريح تنتجان الكهرباء دون حرق ودون غازات مُلوِّثة","سيصبح أشدّ تلوّثًا، لأن توربينات الريح تُطلق دخانًا","لن يتغيّر شيء: الكهرباء هي الكهرباء","سيصبح أزرق كالسماء","فكّروا في الفرق بين إنتاج الكهرباء من الوقود وإنتاجها من الشمس والريح، من حيث ما يخرج إلى الهواء.","أيّ طريقة تُطلق غازات وأيّها لا؟ ماذا يفعل تقليل الحرق بالهواء؟","كهرباء الشمس والريح تُنتَج دون حرق، وبالتالي دون الغازات المُلوِّثة. كلّما استخدمت المدينة أكثر المصادر المتجدّدة: كان الهواء أنظف."]}]];;;;;;;

/* מנוע השאלות החדש: במקום תרגילי חשבון — שאלות מדע מהמאגר.
   d (רמה 1-6) ממופה לדלי: 1-2 יסוד, 3-4 הבנה, 5-6 אתגר.
   בתוך דלי בוחרים שאלה שלא נשאלה בסשן; כשהדלי נגמר מרחיבים לתחום,
   וכשהתחום נגמר מתחילים מחזור חדש. */
function genQ(id,d,lang,force){
  var kind;
  if(force)kind=force;            /* תרגול ממוקד — כופה תחום אחד */
  else{var ks=["bio","eco","mat","erg"];kind=ks[Math.floor(Math.random()*ks.length)];}
  var bucket=d<=2?1:(d<=4?2:3);
  if(!P.usedRows)P.usedRows={};
  var i,pool=[];
  for(i=0;i<SCIBANK.length;i++)if(SCIBANK[i][0]===kind&&SCIBANK[i][1]===bucket&&!P.usedRows[i])pool.push(i);
  if(!pool.length)for(i=0;i<SCIBANK.length;i++)if(SCIBANK[i][0]===kind&&!P.usedRows[i])pool.push(i);
  if(!pool.length){P.usedRows={};for(i=0;i<SCIBANK.length;i++)if(SCIBANK[i][0]===kind)pool.push(i);}
  var idx=pool[Math.floor(Math.random()*pool.length)];
  P.usedRows[idx]=1;
  var row=SCIBANK[idx],L=row[2][lang]||row[2].he;
  var opts=[L[1],L[2],L[3],L[4]];
  /* ערבוב פישר־ייטס של מחרוזות האפשרויות — אותו עיקרון כמו במספרים:
     התשובה הנכונה לא נוחתת תמיד באותו מקום. */
  for(var si=opts.length-1;si>0;si--){var sj=Math.floor(Math.random()*(si+1)),st=opts[si];opts[si]=opts[sj];opts[sj]=st}
  return {id:id,text:L[0],expr:null,answer:L[1],a:0,b:0,kind:row[0],d:row[1],options:opts,
    hints:[L[5],L[6],L[7]],
    explain:L[7]};
}

function genSession(n,d,lang){var arr=[];for(var i=0;i<n;i++)arr.push(genQ(i,d,lang));return arr}

var TENS=["","","עֶשְׂרִים","שְׁלוֹשִׁים","אַרְבָּעִים","חֲמִשִּׁים","שִׁשִּׁים","שִׁבְעִים","שְׁמוֹנִים","תִּשְׁעִים"];
var HUND=["","מֵאָה","מָאתַיִם","שְׁלוֹשׁ מֵאוֹת","אַרְבַּע מֵאוֹת","חֲמֵשׁ מֵאוֹת","שֵׁשׁ מֵאוֹת","שְׁבַע מֵאוֹת","שְׁמוֹנֶה מֵאוֹת","תְּשַׁע מֵאוֹת"];
var THOU=["","אֶלֶף","אַלְפַּיִם","שְׁלוֹשֶׁת אֲלָפִים","אַרְבַּעַת אֲלָפִים","חֲמֵשֶׁת אֲלָפִים","שֵׁשֶׁת אֲלָפִים","שִׁבְעַת אֲלָפִים","שְׁמוֹנַת אֲלָפִים","תִּשְׁעַת אֲלָפִים"];
function numHeb(n){
  n=Math.round(Math.abs(n));if(isNaN(n)||n>999999)return String(n);
  if(n<20)return ONES[n];
  var p=[],th=Math.floor(n/1000);
  if(th>0)p.push(th<10?THOU[th]:numHeb(th)+" אֲלָפִים");
  var rest=n%1000,h=Math.floor(rest/100);
  if(h>0)p.push(HUND[h]);

  if(two>0){if(two<20)p.push(ONES[two]);else{var tt=Math.floor(two/10),o=two%10;p.push(o===0?TENS[tt]:TENS[tt]+" וְ"+ONES[o])}}

/* מנוע ההגייה העברי — /tutor/he-speech.js, 17.9.2026.
   **עברית בלבד**, בהוראת הבעלים. הקובץ לא נטען — הטקסט חוזר
   כמות שהוא, ואין שגיאה. */
function heSpoken(t){
  if(typeof HESPEECH==="undefined")return t;
  try{ return HESPEECH.spoken(t) }catch(e){ return t }
}
function toSpoken(text,lang){
  if(lang!=="he")return text;
  var s=text;
  s=s.replace(/\+(\d)/g,"$1");
  s=s.replace(/[+＋]/g," ועוד ").replace(/\s[−–]\s/g," פחות ").replace(/[×✕＊]/g," כפול ").replace(/÷/g," חלקי ").replace(/=/g," שווה ").replace(/\?/g,"").replace(/%/g," אחוז ");
  /* פסיק נכנס למספר רק בין ספרות ("1,250"). קודם הביטוי בלע גם פסיק
     שאחרי מספר — "מ־5, והגענו" נאמר בלי ההפסקה. */
  s=s.replace(/\d(?:[\d,]*\d)?/g,function(m){return numHeb(parseInt(m.replace(/,/g,""),10))});
  /* שכבת ההגייה העברית נכנסת **כאן**, בתוך toSpoken, ולא ליד
     האמירה: hlAlign מתרגם כל מילה מוצגת לחוד ומשווה לתרגום המשפט
     השלם, ושכבה שרצה רק באחד מהשניים הייתה מפרקת את ההשוואה.
     HESPEECH פועל על אסימון בודד, ולכן שני המסלולים מקבלים אותו
     דבר וההדגשה נשארת מיושרת. */
  s=heSpoken(s);
  return s.replace(/\s{2,}/g," ").replace(/\s+([,.!?])/g,"$1").trim();
}

function allVoices(){try{return speechSynthesis.getVoices()}catch(e){return[]}}

   לפני כן מקבל את ברירת המחדל של הדפדפן — לרוב קול אנגלי, גם כשמותקן
   קול עברי טוב. onvoiceschanged לבדו אינו פתרון: הוא מרענן תפריט,
   הוא לא מעכב את האמירה הראשונה. */

    if(!("speechSynthesis" in window)){done();return}

    poll=setInterval(function(){if(allVoices().length)finish()},120);

       עדיף לדבר בקול ברירת מחדל מאשר לשתוק לנצח. */

/* שם השפה כפי שהוא מופיע בשם הקול — גם בשפה עצמה וגם בלועזית. יש
   מכשירים שבהם v.lang ריק והשם הוא הרמז היחיד. */
/* ar-SA ולא ar-XA. האחרון הוא קוד של Google Cloud ואינו שפה
   שדפדפן מכיר: כשלא נמצא קול ערבי, האמירה נשארה עם תג שפה
   שאינו קיים, הדפדפן התעלם ממנו ודיבר בקול ברירת המחדל —
   שהוא אנגלי. כך ערבית נשמעה אנגלית. */
var LANG_HINT={he:/עברית|hebrew|ivrit/i,en:/english/i,ru:/русский|russian/i,ar:/العربية|arabic/i};

   שפה — ילד שלמד באנגלית קיבל קול עברי שמבטא מילים אנגליות. */

     שאינה בשפה הנוכחית חוזרת לבחירה אוטומטית, ומי שיחזור לשפה

/* הדירוג הוצא מ-pickVoice כדי שגם הרשימה שבמסך ההגדרות תשתמש בו:
   שני סדרים שונים לאותם קולות פירושו מסך שמראה משהו אחר ממה
   שהאפליקציה באמת מקריאה. */
function voiceOrder(pool,prefer,code){
  code=String(code||"").toLowerCase();
  function score(v){
    var s=0,n=(v.name+" "+v.lang).toLowerCase();
    if((v.lang||"").replace("_","-").toLowerCase()===code)s+=12;
    if(/\b(google|microsoft)\b/.test(n))s+=30;
    if(/natural|neural|enhanced|premium|wavenet/.test(n))s+=22;
    /* קול רשת — הנוירליים של Edge הם כאלה — נשמע טוב יותר כשיש
       רשת, וזה כל מה שנקבע כאן. מה קורה כשאין רשת נקבע ב-voiceUsable,
       שהוא מיון קודם: קנס בתוך הניקוד לא הצליח להתגבר על שם היצרן. */

    if(/espeak|compact|pico/.test(n))s-=40;
    if(v.default)s+=5;
