     ושתיים נקודות על שם יצרן ועל ברירת מחדל שקלו בדיוק כמו בונוס
     המגדר, ואז "Google עברית" שמגדרו אינו ידוע ניצח קול נשי מזוהה
     שקיים באותו מכשיר. קודם הקולות במגדר המבוקש, אחריהם מי שלא
     זוהה, ורק אז ההפוך; ובתוך כל קבוצה מכריעה האיכות. */

    "background:#7f1d1d;color:#fff;padding:13px 15px;border-radius:12px;"+

/* ================= מעקב טעויות חוזרות =================
   רושמים את התוצאות של השאלות האחרונות בכל פעולה (חלון נע),
   ולא את כל ההיסטוריה. ילד ששלט בחיבור לפני חודש ומתקשה בו היום
   צריך לקבל עזרה היום — ולהפך, קושי ישן לא צריך לרדוף אחריו.
   ===================================================== */
var WEAK_WINDOW=8;    /* כמה שאלות אחרונות זוכרים לכל פעולה */
var WEAK_TRIGGER=3;   /* כמה טעויות בתוך החלון מפעילות הצעת תרגול */
var WEAK_NEAR=2;      /* טעות במרחק כזה מהתשובה נחשבת "קרובה" */

/* רושם תוצאה של שאלה אחת. dist = כמה רחוקה הייתה התשובה השגויה. */
function noteResult(kind,ok,dist){
  var w=state.weak&&state.weak[kind];
  if(!w)return;
  w.r.push(ok?1:0);
  if(w.r.length>WEAK_WINDOW)w.r.shift();
  if(!ok){ if(dist<=WEAK_NEAR)w.near++; else w.far++; }
  save();
}
/* כמה טעויות יש בחלון הנוכחי של פעולה מסוימת */
function weakMisses(kind){
  var w=state.weak&&state.weak[kind];
  if(!w)return 0;
  var n=0;for(var i=0;i<w.r.length;i++)if(!w.r[i])n++;
  return n;
}
/* הפעולה שהכי מתקשים בה כרגע — או null אם הכול בסדר */
function weakestOp(){
  var best=null,bestN=WEAK_TRIGGER-1;
  ["bio","eco","mat","erg"].forEach(function(k){
    var n=weakMisses(k);
    if(n>bestN){bestN=n;best=k}
  });
  return best;
}
/* האם רוב הטעויות בפעולה הזאת היו "קרובות"?
   קרוב = כנראה החלקה בספירה. רחוק = כנראה לא הבינו את הפעולה. */
function weakIsNear(kind){
  var w=state.weak&&state.weak[kind];
  return !!(w&&w.near>w.far);
}
/* מתחיל סבב תרגול ממוקד: 5 שאלות מאותה פעולה, שתי רמות קלות יותר */
function startFocus(kind){
  var lvl=Math.max(1,activeLevel()-2);
  P.ses=[];
  for(var i=0;i<5;i++)P.ses.push(genQ(i,lvl,state.settings.lang||"he",kind));
  P.qi=0;P.phase="ask";P.wrong=[];P.flash=null;P.hints=0;P.results=[];P.ok=0;P.visual=false;
  P.focus=kind;P.t0=Date.now();
  /* מאפסים את החלון — הסבב הזה עצמו יהיה העדות החדשה */
  if(state.weak[kind])state.weak[kind].r=[];
  save();
}

    dots='<div style="display:flex;gap:26px;align-items:center;justify-content:center;flex-wrap:wrap"><span class="visgrid">'+dotN(Math.min(q.a,cap),"var(--teal)")+'</span><span class="fd" style="font-size:2rem;font-weight:700;color:var(--ink)">+</span><span class="visgrid">'+dotN(Math.min(q.b,cap),"var(--sky)")+'</span></div>';
  }else if(q.kind==="sub"){
    var keep=Math.max(0,q.a-q.b),cross=Math.min(q.b,cap-keep>0?cap:q.b);
    dots='<div class="visgrid">'+dotN(Math.min(keep,cap),"var(--teal)")+dotX(Math.min(q.b,cap))+'</div>';
  }else if(q.kind==="mul"){
    var r=Math.min(q.a,6),c=Math.min(q.b,8),rows="";

    dots='<div style="display:grid;gap:5px">'+rows+'</div>';

    dots='<div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">'+g+'</div>';

}
function dotN(n,color){var s="";for(var i=0;i<n;i++)s+='<span class="visdot" style="background:'+color+'"></span>';return s}
function dotX(n){var s="";for(var i=0;i<n;i++)s+='<span class="visdot x"></span>';return s}

/* ================= מצב "למידה איטית" =================
   מפרק תרגיל לצעדים קטנים, עם ספירה מונפשת ועיגולים.
   פתיחה:  SlowMode.open(q)   — q היא שאלה שנוצרה ב-genQ
   כרגע: חיבור (add) וחיסור (sub) בלבד. כפל וחילוק יתווספו בשלב הבא.
   ===================================================== */
var SlowMode=(function(){
  var el=null,steps=[],idx=0,timer=null,lineTo=10,isOn=false;

  /* מעל המספר הזה עוברים מספירה של אחד־אחד לקפיצות של עשר.
     56 צעדים זה לא עזרה — זה עונש. */
  var JUMP_MIN=12;

  /* ספירה בקפיצות: 18 + 56 הופך לחמש קפיצות של עשר ואז שש של אחד.
     המספרים מוצגים כמוטות של עשר ועיגולים בודדים, וכשמצטברים
     עשרה עיגולים הם נאספים לבד למוט — בדיוק הרעיון של יחידות ועשרות. */
  function planJump(t,a,b,isAdd){
    var out=[],i,v=a,sign=isAdd?1:-1;
    var tens=Math.floor(b/10),ones=b%10;
    function blk(val,cap,pulse,end){
      return {j:1,t10:Math.floor(val/10),o1:val%10,v:val,cap:cap,pulse:pulse,end:end};
    }
    out.push(blk(a,fmt(t.slowHave,{a:a})));
    out.push(blk(a,fmt(isAdd?t.slowPlus:t.slowMinus,{b:b})));
    if(tens){
      out.push(blk(v,fmt(t.slowByTens,{n:tens})));
      for(i=0;i<tens;i++){v+=sign*10;out.push(blk(v,String(v),1))}
    }
    if(ones){
      out.push(blk(v,fmt(t.slowByOnes,{n:ones})));
      for(i=0;i<ones;i++){v+=sign;out.push(blk(v,String(v),1))}
    }
    out.push(blk(v,fmt(isAdd?t.slowGotAdd:t.slowGotSub,{r:v}),0,1));
    return out;
  }

  /* --- בונה את רשימת הצעדים מתוך השאלה --- */
  function plan(q){
    var t=T(),out=[],i,v,a=q.a,b=q.b;
    /* מספר שני גדול? עוברים לקפיצות של עשר במקום ספירה אחד־אחד */
    if((q.kind==="add"||q.kind==="sub")&&b>JUMP_MIN)return planJump(t,a,b,q.kind==="add");
    if(q.kind==="add"){
      out.push({d:a,base:a,gone:0,v:a,cap:fmt(t.slowHave,{a:a})});          /* יש לנו a */
      out.push({d:a,base:a,gone:0,v:a,cap:fmt(t.slowPlus,{b:b})});          /* נוסיף b  */
      for(i=1;i<=b;i++){v=a+i;out.push({d:v,base:a,gone:0,v:v,cap:String(v),pulse:1})}
      v=a+b;out.push({d:v,base:a,gone:0,v:v,cap:fmt(t.slowGotAdd,{r:v}),end:1});
    }else if(q.kind==="sub"){
      out.push({d:a,base:a,gone:0,v:a,cap:fmt(t.slowHave,{a:a})});
      out.push({d:a,base:a,gone:0,v:a,cap:fmt(t.slowMinus,{b:b})});
      for(i=1;i<=b;i++){v=a-i;out.push({d:a,base:a,gone:i,v:v,cap:String(v),pulse:1})}
      v=a-b;out.push({d:a,base:a,gone:b,v:v,cap:fmt(t.slowGotSub,{r:v}),end:1});

    }else if(q.kind==="mul"){
      /* כפל = {a} קבוצות, ובכל אחת {b}.
         ממלאים קבוצה שלמה בכל צעד, והמספר קופץ בקפיצות של {b}: 8, 16, 24, 32 ... */
      var g=[];for(i=0;i<a;i++)g.push(0);
      out.push({g:g.slice(),cap:fmt(t.slowGroups,{a:a})});
      out.push({g:g.slice(),cap:fmt(t.slowEach,{b:b})});
      for(i=0;i<a;i++){
        g[i]=b;
        out.push({g:g.slice(),gf:i,per:b,cap:String((i+1)*b),pulse:1});
      }
      out.push({g:g.slice(),cap:fmt(t.slowGotMul,{a:a,b:b,r:a*b}),end:1});

    }else{
      /* חילוק = מחלקים {a} ל-{b} קבוצות שוות.
         בכל צעד נותנים עיגול אחד לכל קבוצה — חלוקה הוגנת אמיתית.
         כך התשובה מתגלה לילד לבד, במקום להינתן לו מוכנה. */
      var ansv=q.answer!=null?q.answer:Math.round(a/b);
      var gd=[];for(i=0;i<b;i++)gd.push(0);
      out.push({g:gd.slice(),pile:a,cap:fmt(t.slowHave,{a:a})});
      out.push({g:gd.slice(),pile:a,cap:fmt(t.slowSplit,{a:a,b:b})});
      for(i=1;i<=ansv;i++){
        for(var j=0;j<b;j++)gd[j]=i;
        out.push({g:gd.slice(),pile:a-i*b,gf:-1,per:1,cap:fmt(t.slowRound,{n:i}),pulse:1});
      }
      out.push({g:gd.slice(),pile:0,cap:fmt(t.slowGotDiv,{r:ansv}),end:1});
    }
    return out;
  }

  /* --- בונה את החלון פעם אחת בלבד --- */
  function make(){
    var ov=document.createElement("div");
    ov.className="sm-ov";ov.style.display="none";
    ov.innerHTML='<div class="sm-box" role="dialog" aria-modal="true"><div class="sm-head"><h2 class="fd" style="font-size:1.25rem"></h2><button class="sm-x" aria-label="'+esc(((TTSMSG[(state.settings&&state.settings.lang)||"he"]||TTSMSG.he).close))+'">&#10005;</button></div><div class="sm-ex"></div><div class="sm-cap" aria-live="polite"></div><div class="sm-dots"></div><div class="sm-line"></div><div class="sm-pb"><i></i></div><div class="sm-ctl"><button class="bk"></button><button class="pl"></button><button class="go nx"></button></div></div>';
    document.body.appendChild(ov);
    el={ov:ov,box:ov.querySelector(".sm-box"),ttl:ov.querySelector("h2"),ex:ov.querySelector(".sm-ex"),
        cap:ov.querySelector(".sm-cap"),dots:ov.querySelector(".sm-dots"),line:ov.querySelector(".sm-line"),
        pb:ov.querySelector(".sm-pb>i"),bk:ov.querySelector(".bk"),pl:ov.querySelector(".pl"),
        nx:ov.querySelector(".nx"),x:ov.querySelector(".sm-x")};
    el.nx.onclick=function(){stop();go(idx+1)};
    el.bk.onclick=function(){stop();go(idx-1)};
    el.pl.onclick=function(){timer?stop():play()};
    el.x.onclick=close;
    ov.onclick=function(e){if(e.target===ov)close()};
    document.addEventListener("keydown",function(e){
      if(!isOn)return;
      if(e.key==="Escape"){close()}
      else if(e.key===" "||e.key==="ArrowRight"||e.key==="ArrowDown"){e.preventDefault();stop();go(idx+1)}
      else if(e.key==="ArrowLeft"||e.key==="ArrowUp"){e.preventDefault();stop();go(idx-1)}
    });
  }

  /* --- מצייר צעד אחד --- */
  function draw(){
    var s=steps[idx],t=T(),i,n,d,tk;
    if(!s)return;
    el.cap.textContent=s.cap;

    /* --- מצב קפיצות של עשר (חיבור וחיסור עם מספרים גדולים) --- */
    if(s.j){
      el.line.innerHTML="";
      var hb='<div class="sm-b10">';
      for(i=0;i<s.t10;i++)hb+='<span class="sm-rod'+((s.pulse&&s.o1===0&&i===s.t10-1)?" p":"")+'"></span>';
      for(i=0;i<s.o1;i++)hb+='<span class="sm-d'+((s.pulse&&i===s.o1-1)?" p":"")+'"></span>';
      el.dots.innerHTML=hb+'</div>';
      el.pb.style.width=Math.round(idx/(steps.length-1)*100)+"%";
      el.bk.disabled=(idx===0);
      el.bk.textContent=t.slowBack;
      el.nx.textContent=s.end?t.slowAgain:t.slowNext;
      speak(s.cap);
      if(s.end&&state.settings.soundFx)sfxCorrect();
      return;
    }

    /* --- מצב קבוצות (כפל וחילוק) --- */
    if(s.g){
      el.line.innerHTML="";
      var html="";
      /* הערימה שעוד לא חולקה */
      if(s.pile>0){
        html+='<div class="sm-pile">';
        for(i=0;i<s.pile;i++)html+='<span class="sm-d"></span>';
        html+='</div>';
      }
      html+='<div class="sm-grp">';
      for(i=0;i<s.g.length;i++){
        var isFresh=!!(s.pulse&&(s.gf===-1||s.gf===i));
        html+='<div class="sm-g'+(isFresh?" fresh":"")+'">';
        for(n=0;n<s.g[i];n++){
          var isNew=isFresh&&n>=s.g[i]-(s.per||1);
          html+='<span class="sm-d n'+(isNew?" p":"")+'"></span>';
        }
        html+='</div>';
      }
      html+='</div>';
      el.dots.innerHTML=html;
      el.pb.style.width=Math.round(idx/(steps.length-1)*100)+"%";
      el.bk.disabled=(idx===0);
      el.bk.textContent=t.slowBack;
      el.nx.textContent=s.end?t.slowAgain:t.slowNext;
      speak(s.cap);
      if(s.end&&state.settings.soundFx)sfxCorrect();
      return;
    }

    /* --- מצב עיגולים בשורה (חיבור וחיסור) --- */
    el.dots.innerHTML="";
    var last=s.gone?s.d-s.gone:s.d-1;
    for(i=0;i<s.d;i++){
      d=document.createElement("span");
      d.className="sm-d"+(i>=s.base?" n":"")+(s.gone&&i>=s.d-s.gone?" g":"")+(s.pulse&&i===last?" p":"");
      el.dots.appendChild(d);
    }
    /* ציר המספרים */
    el.line.innerHTML="";
    var from=0,to=lineTo;
    if(lineTo>18){from=Math.max(0,s.v-7);to=Math.min(lineTo,from+15)}
    for(n=from;n<=to;n++){
      tk=document.createElement("span");
      tk.className="sm-t"+(n===s.v?" on":(n<s.v?" pv":""));
      tk.textContent=n;el.line.appendChild(tk);
    }
    var cur=el.line.querySelector(".sm-t.on");
    if(cur&&cur.scrollIntoView)cur.scrollIntoView({block:"nearest",inline:"center"});
    /* פס התקדמות + כפתורים */
    el.pb.style.width=Math.round(idx/(steps.length-1)*100)+"%";
    el.bk.disabled=(idx===0);
    el.bk.textContent=t.slowBack;
    el.nx.textContent=s.end?t.slowAgain:t.slowNext;
    /* הקראה — משתמש במנוע ההקראה הקיים של האפליקציה */
    speak(s.cap);
    if(s.end&&state.settings.soundFx)sfxCorrect();
  }

  function go(n){
    if(n<0)return;
    if(n>=steps.length){go(0);return}
    idx=n;draw();
  }
  /* מצב "הפעלה" — מתקדם לבד. 2100 = 2.1 שניות בין צעד לצעד */
  function play(){el.pl.textContent=T().slowStop;timer=setInterval(function(){
    if(idx>=steps.length-1){stop();return}go(idx+1)},2100)}
  function stop(){if(timer){clearInterval(timer);timer=null}if(el)el.pl.textContent=T().slowPlay}

  /* האם אפשר לפרק את השאלה הזאת? נשמר ציבורי כדי שמסך התרגול
     ידע אם להציג את הכפתור בכלל. */
  function can(q){
    if(!q)return false;
    var a=q.a,b=q.b;
    if(q.kind==="add"||q.kind==="sub")return b>=0&&b<=99;   /* מעל 12 עוברים לקפיצות של עשר */
    if(q.kind==="mul")return a>=1&&a<=12&&b>=1&&b<=12;
    if(q.kind==="div"){var v=q.answer!=null?q.answer:Math.round(a/b);return b>=1&&b<=12&&v>=1&&v<=12}
    return false;
  }

  function open(q){
    if(!can(q))return false;
    if(!el)make();
    var t=T();
    steps=plan(q);
    lineTo=Math.max(10,q.kind==="add"?q.a+q.b:q.a);
    el.box.setAttribute("dir",LANGS[state.settings.lang||"he"].dir);
    el.ttl.textContent={add:t.slowAdd,sub:t.slowSub,mul:t.slowMul,div:t.slowDiv}[q.kind];
    el.ex.textContent=(q.expr||(q.a+" ? "+q.b))+" = ?";
    el.pl.textContent=t.slowPlay;
    idx=0;isOn=true;el.ov.style.display="grid";
    draw();
    return true;
  }
  function close(){stop();isOn=false;stopSpeak();if(el)el.ov.style.display="none"}

  return {open:open,close:close,can:can,isOpen:function(){return isOn}};
})();

  /* main grid */
  h+='<div class="cols pr-cols" style="margin-top:18px;padding-bottom:60px"><div class="'+lc("card opcard op-"+q.kind)+'" style="padding:26px">';
  h+='<div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><span class="fd opchip"><span class="opdot"></span>'+esc(tName({id:q.kind}))+(q.d===3?' <span style="background:#b45309;color:#fff;border-radius:8px;padding:1px 8px;font-weight:700">'+esc(t.challenge)+'</span>':"")+' · '+esc(names[al-1])+'</span><button class="chip" data-a="listen" style="color:var(--sky-deep);background:var(--sky-soft);border-color:rgba(88,183,224,.4)">'+ic("speaker",16)+' '+esc(t.listen)+'</button></div>';

/* בוחרת כותרת, משפט וכוכבים לפי התוצאה בפועל.

   וסבב תרגול ממוקד הוא 5 — ובשניהם 100% צריך להיות 3 כוכבים. */
function doneLines(){
  var t=T(),n=P.ses.length||1,ratio=P.ok/n;
  var tier=ratio<0.3?"Low":(ratio<0.75?"Mid":"High");
  return {
    tier:tier,
    stars:ratio>=0.75?3:(ratio>=0.5?2:1),
    title:t["done"+tier]||t.doneTitle,
    sub:fmt(t["sub"+tier]||t.doneSub,{a:P.ok,b:n})
  };
}

var lastBubble="";
/* ============================================================
   מתאם למסכי המבחן
   ------------------------------------------------------------
   האפליקציה הזאת בנויה אחרת מכל השאר: אין בה נושאים ומסלולים
   אלא ארבע פעולות חשבון, ואין שלוש רמות אלא שש. המסכים מדברים
   בשפה של נושא/רמה, ולכן פעולה מוצגת להם כנושא ושש הרמות
   נמסרות כפי שהן.
   ============================================================ */
function clamp(v,a,b){return v<a?a:v>b?b:v}
function shuffle(a){var r=a.slice(),i,j,x;
  for(i=r.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));x=r[i];r[i]=r[j];r[j]=x}
  return r}
function uniq(a){var o=[],i;for(i=0;i<a.length;i++)if(o.indexOf(a[i])<0)o.push(a[i]);return o}
var HAS_FORMULAS=(typeof viewFormulas==="function");
var TRACKS=[{id:"ops",cls:"t-ops"}];
var TOPICS=[{id:"bio",trk:"ops"},{id:"eco",trk:"ops"},
            {id:"mat",trk:"ops"},{id:"erg",trk:"ops"}];
function topicOf(id){for(var i=0;i<TOPICS.length;i++)if(TOPICS[i].id===id)return TOPICS[i];return null}
function topicById(id){return topicOf(id)}
function topicsForTrack(){return TOPICS}
function topicCls(id){return "op-"+id}
function areaCls(id){return topicCls(id)}
function tName(tp){
  var t=T(),k=tp&&tp.id;
  return t["kind"+(k?k.charAt(0).toUpperCase()+k.slice(1):"")]||k||"";
}
function plainOf(h){
  var d=document.createElement("div"); d.innerHTML=String(h||"");
  return (d.textContent||"").replace(/\s+/g," ").trim();
}
/* שש רמות, בשמות שכבר מתורגמים באפליקציה. מתרעננות בכל ציור
   מסך, כי המסכים קוראים LVL[i] וגם LVL.map. */
var LVL=["","","","","",""];
function lvlSync(){var t=T();for(var i=1;i<=6;i++)LVL[i-1]=t["lvl"+i]||String(i)}
var LVL_C=["var(--teal)","var(--sky)","var(--amber)","var(--coral)","var(--violet)","var(--ink)"];

function buildQ(topicId,level){
  var lang=state.settings.lang||"he";
  /* **המבחן הכיתתי אינו מביט בהתקדמות הלומד.** `genQ` מדלג על כל
     שורה שכבר נשאלה בסשן (`P.usedRows`), ולכן המאגר שממנו הוא
     מגריל שונה בין מכשיר למכשיר — גם כשהזרע זהה. ההבטחה שמעל
     `examQuestions` ("אותו זרע ← אותן שאלות, גם אצל המורה וגם אצל
     התלמיד") נשברה בשקט: `startRound` רץ בטעינה ומסמן שמונה שורות
     אקראיות, שונות בכל מכשיר. נמדד על המאגר הזה: 675 מתוך 2000
     שאלות שונות בין מורה לתלמיד, ב-199 מתוך 200 מבחנים.
     כאן המאגר ריק תמיד, ולכן הגרלת המבחן תלויה בזרע בלבד.
     בדרך אגב זה גם מפסיק לזהם את סבב התרגול: בניית מבחן בן
     עשרים שאלות סימנה עשרים שורות כ"נשאלו". */
  var keep=P.usedRows,q;
  P.usedRows={};
  try{ q=genQ(0,clamp(level||1,1,6),lang,topicId) }
  finally{ P.usedRows=keep }
  if(!q)return null;
  /* האפשרויות כאן הן מספרים, לא אובייקטים.
     ואין להן `why`: מסיח כאן הוא מספר, והסכימה של math-app —
     hint1/hint2/explain — אינה מגדירה הסבר למסיח. `why:""` שהיה
     כאן היה ריפוד צורה בלבד, איש לא קרא אותו (אפס מופעים של
     `.why` בקובץ), והוא זה שייצר "100% מהמסיחים בלי הסבר"
     בדוח התוכן — התראה שאין עריכת תוכן שסוגרת אותה. */
  var opts=(q.options||[]).map(function(n){
    return {h:String(n),t:String(n),ok:n===q.answer}});
  return {topic:topicId, topicName:tName(topicOf(topicId)),
          /* הרמז הראשון מתוך שלושת הרמזים ש-genQ בונה. מסך המבחן
             אינו מציג רמז ואינו קורא את השדה; הוא כאן כדי שהמתאם
             ידווח על התוכן כפי שהוא — הלומד מקבל שלושה רמזים
             בלחיצה על כפתור הנורה, והדוח קרא כאן "בלי רמז". */
          hint:(q.hints&&q.hints[0])||"",
          /* השאלה מכילה את התרגיל בתוך משפט עברי, ושם הכיוון הופך את
             סדר המספרים: "כמה זה 29 − 7?" נראה "כמה זה 7 − 29?". התרגיל
             עצמו זהה למחרוזת expr, ולכן עוטפים בדיוק אותו בקטע שמאל־לימין. */
          ask:q.expr?esc(q.text||"").split(esc(q.expr||"")).join('<span dir="ltr">'+esc(q.expr||"")+'</span>'):esc(q.text||""),
          expr:esc(q.expr||""), fig:"",
          say:q.text||"", options:opts};
}


/* ============================================================
   18. מבחן כיתתי — פרסום בוואטסאפ, קבלת תשובות וציונים
   ------------------------------------------------------------
   אין שרת, ואין כוונה שיהיה. לכן המבחן אינו נשלח לשום מקום:
   הוא *נארז לתוך הקישור*. המורה מקבל קישור, שולח אותו בוואטסאפ,
   והמכשיר של התלמיד בונה מהקישור בדיוק את אותן שאלות.

   מה שהופך את זה לאפשרי הוא שכל מחולל שאלות כאן משתמש ב-
   Math.random בלבד. אם מזרעים אותו, אותו זרע מייצר את אותן
   שאלות ואת אותו סדר תשובות — אצל המורה ואצל התלמיד. הקישור
   נושא זרע ורשימת נושאים, לא עשרים שאלות מלאות, ולכן הוא נשאר
   קצר מספיק לוואטסאפ.

   שלוש מגבלות שנאמרות כאן במפורש כי הן חלק מהתכנון:
   · אין איסוף אוטומטי. התלמיד שולח קוד תשובות בוואטסאפ, והמורה
     מדביק אותו. זה המחיר של אפס שרת ואפס עלות.
   · אפשר לזייף קוד. הציון מחושב מחדש אצל המורה מתוך התשובות
     ולא נלקח מהתלמיד, אבל אין כאן הגנה קריפטוגרפית — זה מבחן

/* --- מחולל מזורע. mulberry32: קצר, מהיר, ופיזור טוב דיו --- */
function withSeed(seed,fn){
  var real=Math.random,s=(seed>>>0)||1;
  Math.random=function(){
    s|=0; s=s+0x6D2B79F5|0;
    var t=Math.imul(s^s>>>15,1|s);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };

function hash32(str){
  var h=0x811c9dc5,i;
  for(i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193)}
  return (h>>>0);

/* base64url. הניקוי בפענוח אינו קוסמטי: וואטסאפ שובר מחרוזות

function b64e(str){
  var bytes=new TextEncoder().encode(str),bin="",i;
  for(i=0;i<bytes.length;i+=8192)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));

function b64d(s){
  s=String(s||"").replace(/[^A-Za-z0-9\-_]/g,"").replace(/-/g,"+").replace(/_/g,"/");
  while(s.length%4)s+="=";
  var bin=atob(s),bytes=new Uint8Array(bin.length),i;
  for(i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);

   שאין לו זרעים מקבל בדיוק את המזהה שקיבל תמיד — אחרת ההגשות
   שכבר נקלטו אליו מתייתמות. */
function examId(spec){return hash32(spec.s+"|"+spec.q.map(function(x){

   כשהוא בודק וגם אצל התלמיד כשהוא נבחן. */
function examQuestions(spec){
  /* מסננים נושאים שאינם מוכרים לאפליקציה הזאת, בדיוק כמו decodeExam.
     בלי הסינון buildQ מחזיר null על נושא זר, והמסך נופל על
     q.topic של null. עדיף לדלג בשקט מאשר להתרסק. */
  var pairs=(spec.q||[]).filter(function(x){return !!topicById(x[0])});
  /* מבחן שנבנה עם זרע לכל משבצת נבנה משבצת אחרי משבצת, וכל
     שאלה תלויה בזרע שלה בלבד — כך המורה יכול להחליף אחת מהן.
     מבחן ישן, בלי זרעים, חייב להיבנות בדיוק כפי שנבנה ביום
     שנשלח: אחרת הציון של מי שכבר נבחן משתנה למפרע. */

  return withSeed(slot[2],function(){return buildQ(slot[0],slot[1])})||null;

    if(Object.keys(EXQCACHE).length>400)EXQCACHE={};

function exSlots(){
  if(EB.q&&EB.q.length)return EB.q;
  var tops=EB.topics.filter(function(x){return topicById(x)});
  if(!tops.length)tops=topicsForTrack(state.track).slice(0,3).map(function(t){return t.id});
  /* אותה שאלה פעמיים באותו מבחן היא שאלה מבוזבזת, והיא ודאית כשברמה
     ארבעה פריטים והמורה ביקש עשר שאלות: הזרע נבחר באקראי ובלי זיכרון,
     ונמדד מבחן שבו אותו מושג הופיע ארבע פעמים מתוך עשר. מגלגלים מחדש
     עד שתים־עשרה פעמים, ואם כל השאלות האפשריות כבר נלקחו — משאירים
     כפילות במקום להיתקע. */
  var q=[],seen={},i,tries,sl,pq,key;

/* ------------------------------------------------------------
   ייצוא CSV של ההגשות.
   העתקת הטבלה נותנת טקסט מופרד בטאבים — נוח להדבקה, אבל לא קובץ.
   מורה שרוצה למיין, לסנן או לחשב ממוצע צריך גיליון. שורה לכל תלמיד,
   ועמודה לכל שאלה, כדי שאפשר יהיה לראות מיד באיזו שאלה נפלה הכיתה.
   ה-BOM בהתחלה הוא מה שגורם לאקסל לקרוא עברית, ערבית ורוסית נכון
   במקום ג׳יבריש — בלעדיו הקובץ נפתח שבור בדיוק אצל מי שצריך אותו.
   ------------------------------------------------------------ */
function csvCell(v){
  var s=(v===undefined||v===null)?"":String(v);
  return /[",\n\r;\t]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function csvRow(a){ return a.map(csvCell).join(",") }
/* ============================================================
   מצב מורה.
   בונה המבחן ומסך הציונים נועדו למורה. על טאבלט כיתתי, או על
   טלפון שהילד לוקח לעצמו, אין סיבה שהם יהיו במרחק הקשה אחת:
   ילד יכול למחוק מבחן, לראות ציונים של חברים, או לפתוח מבחן
   ולראות מראש את השאלות.
   זו אינה אבטחה, ואסור להציג אותה ככזאת: מי שיודע לפתוח כלי
   פיתוח יעקוף אותה בשנייה. זו נעילה מפני יד סקרנית — בדיוק מה
   שצריך כאן, ולא יותר.
   כל עוד לא נבחר קוד, שום דבר לא משתנה והמסכים גלויים כתמיד.
   ============================================================ */

/* גיבוב חלש כגיבוי בלבד. SubtleCrypto קיים בכל דפדפן מודרני
   בהקשר מאובטח, ו-GitHub Pages הוא כזה. */
function teWeak(s){var h=5381,i;for(i=0;i<s.length;i++)h=((h*33)^s.charCodeAt(i))>>>0;return "w"+h.toString(16)}
function teHash(pin,salt,cb){
  var msg=salt+"|"+pin;
  try{
    if(window.crypto&&crypto.subtle&&crypto.subtle.digest&&window.TextEncoder){
      crypto.subtle.digest("SHA-256",new TextEncoder().encode(msg)).then(function(d){
        var a=Array.prototype.slice.call(new Uint8Array(d));
        cb(a.map(function(b){return ("0"+b.toString(16)).slice(-2)}).join(""));
      },function(){cb(teWeak(msg))});
      return;
    }
  }catch(e){}
  cb(teWeak(msg));
}
function teSalt(){
  var s="";
  try{
    var a=new Uint8Array(8);crypto.getRandomValues(a);
    s=Array.prototype.slice.call(a).map(function(b){return ("0"+b.toString(16)).slice(-2)}).join("");
  }catch(e){ s=String(Date.now())+Math.random().toString(36).slice(2) }
  return s;
}
/* השהיה אחרי ניסיונות כושלים. ארבע ספרות הן עשרת אלפים
   אפשרויות, וילד סבלני יכול לנסות הרבה. */
function teWait(){
  var r=teRead();if(!r||!r.bad||r.bad<3)return 0;
  var pen=Math.min(300,Math.pow(2,r.bad-3)*5)*1000;
  var left=Math.ceil(((r.badAt||0)+pen-Date.now())/1000);
  return left>0?left:0;
}

    (!setting&&teHas()?'<button class="te-btn link" id="te-forgot">'+esc(xt("teForgot"))+'</button>':'')+

  document.body.appendChild(w);

  /* מלכודת פוקוס, כמו בשער התנאים */
  w.addEventListener("keydown",function(e){
    if(e.key==="Escape"){teClose();return}
    if(e.key==="Enter"){e.preventDefault();teSubmit();return}
    if(e.key!=="Tab")return;
    var f=box.querySelectorAll("button:not([disabled]),input");
    if(!f.length)return;
    var a=f[0],z=f[f.length-1];
    if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}
    else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}
  });

  document.getElementById("te-ok").onclick=teSubmit;
  var fg=document.getElementById("te-forgot");
  if(fg)fg.onclick=function(){ TE.msg=xt("teForgotHow"); teDialog() };

function teClose(){ TE.ask=false; TE.mode=""; TE.msg=""; teDialog(); }
function teSubmit(){
  if(TE.busy)return;
  var setting=(TE.mode==="set"||TE.mode==="change"||!teHas());
  var pin=(document.getElementById("te-pin")||{}).value||"";
  var rem=!!(document.getElementById("te-rem")||{}).checked;
  if(!/^[0-9]{4,8}$/.test(pin)){TE.msg=xt("teShort");teDialog();return}
  if(setting){
    var p2=(document.getElementById("te-pin2")||{}).value||"";
    if(pin!==p2){TE.msg=xt("teMismatch");teDialog();return}
    var salt=teSalt();
    TE.busy=true;
    teHash(pin,salt,function(h){
      TE.busy=false;
      teWrite({h:h,s:salt,bad:0,badAt:0});
      teSetOpen(true,rem);
      TE.ask=false;TE.mode="";TE.msg="";
      teDialog(); render();
    });
    return;
  }
  if(teWait()){teDialog();return}
  var rec=teRead(); if(!rec){teClose();return}
  TE.busy=true;
  teHash(pin,rec.s,function(h){
    TE.busy=false;
    if(h===rec.h){
      rec.bad=0;rec.badAt=0;teWrite(rec);
      teSetOpen(true,rem);
      TE.ask=false;TE.mode="";TE.msg="";
      teDialog(); render();
    }else{
      rec.bad=(rec.bad||0)+1;rec.badAt=Date.now();teWrite(rec);
      TE.msg=xt("teBad"); teDialog();
    }
  });
}
function teAsk(mode){ TE.ask=true; TE.mode=mode||""; TE.msg=""; teDialog() }
function teLock(){ teSetOpen(false); render() }
function teRemove(){ teWrite(null); teSetOpen(false); render() }
/* נעילה אוטומטית אחרי שהאפליקציה הייתה מוסתרת זמן־מה.
   מורה שבנה מבחן ומסר את הטאבלט בלי ללחוץ "יציאה" השאיר אותו
   פתוח, וזה בדיוק המצב שהתכונה אמורה למנוע. שתי דקות מספיקות
   כדי לא להפריע לעבודה רצופה, ולנעול כשהמכשיר עבר יד.
   נעילה שנשמרה כ"לזכור במכשיר הזה" היא בחירה מפורשת ולא נוגעים בה. */
var TE_HID=0;
try{
  document.addEventListener("visibilitychange",function(){
    if(document.hidden){ TE_HID=Date.now(); return }
    if(!TE_HID||!teHas())return;
    var away=Date.now()-TE_HID; TE_HID=0;
    if(away<120000)return;
    var kept=false;
    try{ kept=localStorage.getItem("sciapp-teacher"+"-open")==="1" }catch(e){}
    if(kept)return;
    try{ if(sessionStorage.getItem("sciapp-teacher"+"-open")!=="1")return }catch(e){ return }
    teSetOpen(false); render();
  });
}catch(e){}

/* ?teacher=1 פותח את החלון, והפרמטר מוסר מיד מהכתובת כדי שלא
   יישאר בקישור ששותף או בהיסטוריה. */
(function(){
  try{
    var u=new URL(location.href);
    if(u.searchParams.get("teacher")==="1"){
      u.searchParams.delete("teacher");
      history.replaceState(null,"",u.pathname+(u.searchParams.toString()?"?"+u.searchParams:"")+u.hash);
      /* שער התנאים יושב מעל הכול, וכך צריך להיות: אי־אפשר להשתמש
         באפליקציה לפני שהוסכם עליהם. חלון הקוד ממתין לו במקום
         להיפתח מתחתיו ולהיראות תקוע. */
      var tries=0;
      (function waitLegal(){
        if(tries++>=600){ teAsk(teHas()?"":"set"); return }
        /* LEGAL.accepted נוצר רק כש-protect.js מאותחל. עד אז אין
           עדיין מה לבדוק, ובדיקה של ".lg-wrap" לבדה מחזירה "אין
           שער" בדיוק ברגע שלפני שהוא נבנה. */
        var ready=false;
        try{ ready=!!(window.LEGAL&&window.LEGAL.accepted) }catch(e){}
        if(!ready){ setTimeout(waitLegal,200); return }
        var ok=true;
        try{ ok=!!window.LEGAL.accepted() }catch(e){ ok=true }
        if(!ok){ setTimeout(waitLegal,200); return }
        teAsk(teHas()?"":"set");
      })();
    }
  }catch(e){}
})();

function marksCsv(ex){
  var subs=(ex.subs||[]).slice().sort(function(a,b){return b.pct-a.pct});
  var n=ex.spec.q.length,i;
  var head=[xt("mkCsvName"),xt("mkCsvPct"),xt("mkCsvOk"),xt("mkCsvTotal"),
            xt("mkCsvDate"),xt("mkCsvValid")];
  for(i=0;i<n;i++)head.push(xf("mkCsvQ",i+1));
  var rows=[csvRow(head)];
  subs.forEach(function(s){
    var r=[s.name||xt("mkNoName"),s.pct,s.ok,s.n,s.date||"",
           s.valid?xt("mkCsvYes"):xt("mkCsvNo")];
    for(i=0;i<n;i++){
      var p=s.per&&s.per[i];
      r.push(p?(p.ok?xt("mkCsvYes"):xt("mkCsvNo")):"");
    }
    rows.push(csvRow(r));
  });
  return "\ufeff"+rows.join("\r\n")+"\r\n";
}
/* כרום מוחק את שם הקובץ כולו ברגע שיש בו תו אחד שאינו ASCII —
   לא רק עברית: גם é או מקף ארוך. מה שיורד נקרא "download", בלי
   סיומת, ואקסל לא יודע לפתוח אותו. מורה שקרא למבחן שלו בעברית
   קיבל קובץ בלי שם ובלי סוג. לכן השם מתועתק ללטינית. */
var TRLIT={
  "א":"a","ב":"b","ג":"g","ד":"d","ה":"h","ו":"v","ז":"z","ח":"ch","ט":"t","י":"y",
  "כ":"k","ך":"k","ל":"l","מ":"m","ם":"m","נ":"n","ן":"n","ס":"s","ע":"","פ":"f",
  "ף":"f","צ":"tz","ץ":"tz","ק":"k","ר":"r","ש":"sh","ת":"t",
  "ا":"a","ب":"b","ت":"t","ث":"th","ج":"j","ح":"h","خ":"kh","د":"d","ذ":"dh","ر":"r",
  "ز":"z","س":"s","ش":"sh","ص":"s","ض":"d","ط":"t","ظ":"z","ع":"","غ":"gh","ف":"f",
  "ق":"q","ك":"k","ل":"l","م":"m","ن":"n","ه":"h","و":"w","ي":"y","ة":"h","ى":"a","ء":"",
  "أ":"a","إ":"i","آ":"a","ؤ":"w","ئ":"y",
  "а":"a","б":"b","в":"v","г":"g","д":"d","е":"e","ё":"e","ж":"zh","з":"z","и":"i",
  "й":"y","к":"k","л":"l","м":"m","н":"n","о":"o","п":"p","р":"r","с":"s","т":"t",
  "у":"u","ф":"f","х":"kh","ц":"ts","ч":"ch","ш":"sh","щ":"sch","ъ":"","ы":"y","ь":"",
  "э":"e","ю":"yu","я":"ya"
};
function asciiName(s){
  var i,c,out="";
  /* é ו-ü הם אות לטינית ועוד סימן מצורף. פירוק והסרת הסימן משאיר e ו-u. */
  try{ s=s.normalize("NFD").replace(/[\u0300-\u036f]/g,"") }catch(e){}
  for(i=0;i<s.length;i++){
    c=s.charAt(i);
    if(/[A-Za-z0-9]/.test(c)){ out+=c; continue }
    var lower=c.toLowerCase();
    if(TRLIT[lower]!==undefined){ out+=TRLIT[lower]; continue }
    out+=" ";                     /* כל השאר — רווח, שיתכווץ בהמשך */
  }
  return out.replace(/\s+/g," ").trim();
}
function csvFileName(ex){
  var t=asciiName(String(ex.spec.t||"")).slice(0,60).trim();
  var d=String(ex.date||todayIso()).replace(/[^0-9-]/g,"");
  /* כשלא נשאר כלום קריא, מזהה המבחן הוא מה שמבדיל בין שני קבצים
     שירדו באותו יום. */
  if(!t) t="exam "+String(ex.id||"").slice(0,6);
  return (t+" "+d).trim()+".csv";
}
function downloadCsv(ex){
  var txt=marksCsv(ex),url=null,a=document.createElement("a");
  try{
    url=URL.createObjectURL(new Blob([txt],{type:"text/csv;charset=utf-8"}));
  }catch(e){
    url="data:text/csv;charset=utf-8,"+encodeURIComponent(txt);
  }
  a.href=url; a.download=csvFileName(ex);
  a.style.cssText="position:fixed;inset-inline-start:-9999px";
  document.body.appendChild(a); a.click();
  setTimeout(function(){
    if(a.parentNode)a.parentNode.removeChild(a);
    if(url&&url.indexOf("blob:")===0){try{URL.revokeObjectURL(url)}catch(e){}}
  },400);
}
function marksTable(ex){
  var out=(ex.spec.t||xt("exam"))+"\n";
  out+=xt("mkTblHead")+"\n";
  (ex.subs||[]).slice().sort(function(a,b){return b.pct-a.pct}).forEach(function(s){
    var wrong=uniq(s.per.filter(function(p){return !p.ok}).map(function(p){return p.topicName}));
    out+=(s.name||xt("mkNoName"))+"\t"+s.pct+"\t"+s.ok+"/"+s.n+"\t"+wrong.join(", ")+"\n";
  });
  return out;
}

   מסך התלמיד — מבחן מתוך קישור

var SIT={spec:null,id:"",qs:[],i:0,name:"",answers:[],phase:"intro",code:"",copied:false};

function sitStart(){
  var nm=$("#sitName"); SIT.name=nm?nm.value.trim():"";
  SIT.qs=examQuestions(SIT.spec);
  /* אם לא נותרה אף שאלה שאפשר לבנות (למשל מבחן של אפליקציה אחרת),
     מציגים את מסך המבחן השבור במקום ליפול על שאלה שאינה קיימת. */
  if(!SIT.qs.length){view="badexam"; render(); return}
  SIT.answers=SIT.qs.map(function(){return -1});
  SIT.i=0; SIT.phase="ask";
  window.scrollTo(0,0); render();
}
function sitAnswer(i){
  if(SIT.phase!=="ask")return;
  SIT.answers[SIT.i]=i;
  sitNext();
}
function sitNext(){
  if(SIT.i+1<SIT.qs.length){SIT.i++;window.scrollTo(0,0);render();return}
  /* לא מגישים בלחיצה על תשובה. לחיצה בטעות על האפשרות האחרונה
     אינה אמורה לסיים מבחן. */
  SIT.phase="review"; stopSpeak(); window.scrollTo(0,0); render();
}
function sitGo(i){
  SIT.i=clamp(i,0,SIT.qs.length-1); SIT.phase="ask";
  window.scrollTo(0,0); render();
}
/* התוצאה נשלחת כקישור ולא כקוד: המורה לוחץ, האפליקציה נפתחת אצלו
   וקולטת. הקוד עצמו יושב אחרי #r=, ולכן גם הדבקה של הקישור השלם
   בתיבת הקוד עובדת — codeOf מחלץ אותו משם. */
function resultUrl(code){return location.origin+location.pathname+"#r="+code}
function codeOf(raw){
  var m=String(raw||"").match(/#r=([A-Za-z0-9\-_]+)/);
  return (m?m[1]:String(raw||"")).trim();
}
function sitFinish(){
  SIT.phase="done";
  SIT.code=encodeResult(SIT.id,SIT.name,SIT.answers);
  stopSpeak(); window.scrollTo(0,0); render();
}
function sitGrade(){
  var ok=0,i;
  for(i=0;i<SIT.qs.length;i++){
    var a=SIT.answers[i];
    if(a>=0&&SIT.qs[i].options[a]&&SIT.qs[i].options[a].ok)ok++;
  }
  return {ok:ok,n:SIT.qs.length,pct:Math.round(100*ok/SIT.qs.length)};
}

function copyText(txt,done){
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(done,function(){fallbackCopy(txt,done)});
      return;
    }
  }catch(e){}
  fallbackCopy(txt,done);
}
function fallbackCopy(txt,done){
  try{
    var ta=document.createElement("textarea");
    ta.value=txt; ta.setAttribute("readonly","");
    ta.style.position="fixed"; ta.style.top="-1000px";
    document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); document.body.removeChild(ta);
    done();
  }catch(e){}
}
function examAction(a,el){

       שהמורה אישר. ערבוב כאן היה מסדר מחדש מבחן שכבר נבדק. */

              q:q,r:!!EB.tts,f:!!EB.formulas,w:true};
    if(EB.phone)spec.p=EB.phone.replace(/[^0-9]/g,"");
    EB.built=spec; EB.copied="";

    if(!exFind(id)){EX.list.unshift({id:id,spec:spec,date:todayIso(),subs:[]});exSave()}
    render(); return true;
  }
  if(a==="excopy"){var u=el.getAttribute("data-v");copyText(u,function(){EB.copied="url";render()});return true}

  /* --- ציונים --- */
  if(a==="mkopen"){var i2=el.getAttribute("data-i");MK.open=MK.open===i2?"":i2;MK.msg=null;render();return true}
  /* מחיקה מוחקת גם את כל ההגשות. שאלה אחת לפני זה היא לא נימוס —
     היא ההבדל בין טעות לבין אובדן של כיתה שלמה. */

    copyText(marksTable(ex4),function(){MK.msg={id:ex4.id,ok:true,m:xt("mkTblCopied")};render()});
    return true;
  }

    var ex=exFind(el.getAttribute("data-i")); if(!ex)return true;

    if(mkImport(ex,res)&&ta)ta.value="";

  if(a==="sitstart"){sitStart();return true}
  if(a==="sitans"){sitAnswer(parseInt(el.getAttribute("data-i"),10));return true}
  if(a==="sitskip"){SIT.answers[SIT.i]=-1;sitNext();return true}

  if(a==="sitgo"){sitGo(parseInt(el.getAttribute("data-i"),10));return true}
  if(a==="sitfinish"){sitFinish();return true}
  if(a==="sitread"){var q2=SIT.qs[SIT.i];if(q2)speak(q2.say);return true}
  if(a==="sitform"){view="formulas";render();window.scrollTo(0,0);return true}
  if(a==="sitcopy"){copyText(SIT.code,function(){SIT.copied=true;render()});return true}
  if(a==="sitback"){view="sit";render();window.scrollTo(0,0);return true}
  return false;
}

/* קליטת מבחן מהכתובת. עושים את זה לפני ה-render הראשון, אחרת
   התלמיד רואה לרגע את מסך הבית של אפליקציה שהוא לא מכיר. */
/* קולט תוצאה אחת למבחן. מחזיר true כשנשמרה; בכל מקרה משאיר הודעה
   ב-MK.msg למסך הציונים. משמש גם את תיבת ההדבקה וגם את הקישור. */
function mkImport(ex,res){
    if(res.i!==ex.id){
      var other=exFind(res.i);
      MK.msg={id:ex.id,ok:false,m:other?xf("mkErrOther",other.spec.t||xt("exam")):xt("mkErrUnknown")};
      return false;
    }
    if(res.a.length!==ex.spec.q.length){
      MK.msg={id:ex.id,ok:false,m:xt("mkErrCount")};return false}
    var g=gradeResult(ex.spec,res);
    var sub={name:res.n||"",date:res.d||todayIso(),ok:g.ok,n:g.n,pct:g.pct,per:g.per,valid:!!res.ok};
    /* הגשה חוזרת של אותו תלמיד מחליפה את הקודמת ולא מצטברת לידה */
    /* הגשה חדשה מחליפה קודמת רק כששני השמות זהים אחרי נירמול, והשם
       אינו ריק. בלי זה כל ההגשות בלי שם נראו כאותו תלמיד ודרסו זו את
       זו בשקט, וגם "דני" מול "דני  " (רווח כפול פנימי) נחשבו לשניים. */
    var nrm=function(x){return String(x==null?"":x).replace(/\s+/g," ").trim()};
    var sn=nrm(sub.name);
    var k2=sn?(ex.subs||[]).findIndex(function(s){return nrm(s.name)===sn}):-1;
    if(!ex.subs)ex.subs=[];
    if(k2>=0)ex.subs[k2]=sub; else ex.subs.push(sub);
    exSave();
    MK.msg={id:ex.id,ok:true,m:(sub.name||xt("student"))+" "+xt("mkTaken")+" · "+g.pct+" ("+g.ok+"/"+g.n+")"+
      (sub.valid?"":" · "+xt("mkNoteBad"))};
    return true;
}
/* קליטת תוצאה מהכתובת — הצד של המורה. הכתובת מנוקה מיד, כדי שרענון
   לא יקלוט שוב; קליטה חוזרת של אותו תלמיד הייתה מחליפה ולא מכפילה,
   אבל אין סיבה להשאיר קוד בשורת הכתובת. */

function wrapMain(h){return '<main id="main" tabindex="-1">'+(h||"")+'</main>'}

/* המסכים שבהם הגלאי כבוי. **המבחן הכיתתי אסור בגלאי** — ההנחיה
   מפורשת, והנימוק מבני: בונה המבחן אורז זרע והתלמיד בונה ממנו את
   אותן שאלות אצלו, ולכן כל דבר שמשתנה מלומד ללומד מפצל את המבחן
   לשניים. זה כבר קרה כאן דרך `chooseIndex` — 39 שאלות מתוך 200

/* השרת של המורה חותך כל שדה הקשר ל-400 תווים (tutor-api/worker.js,

   משפט, מתחת ל-400. משפט ראשון ארוך מהתקרה נחתך בגבול מילה עם ״…״. */
function tutorCut(t,max){t=String(t||"").replace(/\s+/g," ").trim();max=max||380;if(t.length<=max)return t;
  var s=t.match(/[^.!?]+[.!?]+["״”'’)]*\s*/g)||[],o="";

  o=o.trim();if(!o){o=t.slice(0,max-1);var k=o.lastIndexOf(" ");if(k>max*0.6)o=o.slice(0,k);o+="…"}
  return o}

/* stickers award */
function awardStickers(){
  var earned=earnedStickers(state.stats),fresh=[];
  earned.forEach(function(id){if(state.stickers.indexOf(id)<0)fresh.push(id)});
  if(fresh.length){
    state.stickers=state.stickers.concat(fresh);
    if(state.settings.soundFx)sfxSticker();
  }
}

/* ================= actions ================= */
function recordAnswer(correct,kind){
  var s=state.stats;
  s.attempts++;
  if(kind&&s.ops[kind]){s.ops[kind].total++;if(correct)s.ops[kind].ok++}
  if(correct){s.correct++;s.xp+=10;s.streak++;s.bestStreak=Math.max(s.bestStreak,s.streak)}
  else s.streak=0;
  awardStickers();save();
}
function finishRound(){
  state.sessionHistory.push({date:todayIso(),correct:P.ok,total:P.ses.length,level:activeLevel()});
  if(state.sessionHistory.length>30)state.sessionHistory=state.sessionHistory.slice(-30);
  state.stats.sessions++;state.stats.xp+=15;
  var d=todayIso();
  if(state.stats.days.indexOf(d)<0){state.stats.days.push(d);if(state.stats.days.length>60)state.stats.days=state.stats.days.slice(-60)}
  awardStickers();save();
}
function advance(){
  if(P.qi+1>=P.ses.length){
    finishRound();P.phase="done";
    var DL=doneLines();
    /* חוגגים רק כשיש מה לחגוג. בסבב חלש הכותרת אומרת "היה קשה היום" —
       קונפטי וצליל ניצחון באותו רגע היו סותרים אותה. */
    if(DL.tier==="Low"){ sfxHint(); }
    else { confetti(true); sfxWin(); }
    speak(DL.sub,true);render();return;
  }
  P.qi++;P.phase="ask";P.wrong=[];P.flash=null;P.hints=0;P.visual=false;BT.text="";BT.shown=0;
  P.t0=Date.now();
  render();
}
function onAns(opt){
  var q=P.ses[P.qi],t=T();
  if(P.phase!=="ask")return;
  if(opt===q.answer){
    recordAnswer(true,q.kind);
    jsAnswer(true);
    /* נחשב "ידע" רק אם לא לחצו קודם על תשובה שגויה */
    noteResult(q.kind,P.wrong.length===0,0);
    P.results.push("ok");P.ok++;
    if(P.qi===0&&!state.dailyDates.includes(todayIso())){
      state.dailyDates.push(todayIso());state.stats.dailies++;state.stats.xp+=25;awardStickers();save();
    }
    /* חגיגה מוגברת לילדים: פיצוץ קונפטי מהמרכז, +10 מרחף, ומאגר
       מחמאות מתחלף. רצף של חמש נכונות מקבל חגיגה גדולה וצליל ניצחון. */
    sfxCorrect();confetti(false,true);xpPop("+10");
    var stk=0;for(var ri=P.results.length-1;ri>=0&&P.results[ri]==="ok";ri--)stk++;
    var msg;
    if(stk>0&&stk%5===0){confetti(true,true);sfxWin();msg=(t.streakMsg||"{n} ברצף!").replace("{n}",String(stk));}
    else{var pool=[t.praise,t.effort,t.praise2,t.praise3,t.praise4,t.praise5].filter(Boolean);msg=pool[Math.floor(Math.random()*pool.length)];}
    speak(msg+" +10",true);
    announce(msg);
    /* קודם עמד כאן setTimeout(advance,1000): תשובה נכונה קפצה לשאלה
       הבאה מעצמה אחרי שנייה אחת. תלמיד שקורא לאט לא הספיק לקרוא את
       "מעולה", ההקראה נקטעה באמצע המשפט על ידי השאלה הבאה, ולא היה
       שום דבר ללחוץ עליו כדי להמשיך בקצב שלו.

       שמונה האפליקציות האחרות כולן עוצרות על כפתור "ממשיכים הלאה"
       גם בתשובה נכונה — math-app הייתה היחידה שלא, וזה סתר את מה
       שדף הבית מבטיח: "קצב שנקבע על ידי הלומד". */
    P.phase="reveal";
    setBubble(msg,"cheer");
    render();
  }else{
    if(P.wrong.indexOf(opt)>=0)return;
    P.wrong.push(opt);sfxWrong();
    var el2=document.querySelector('[data-o="'+opt+'"]');if(el2){el2.className="opt wrong shake";el2.disabled=true}
    /* הטעות הראשונה אינה חושפת את הפתרון. עד כאן "מצב רגוע" — שהוא
       ברירת המחדל — נתן את התשובה מיד אחרי לחיצה שגויה אחת, ותלמיד
       שטעה בטעות סתם לא קיבל הזדמנות לחשוב. עכשיו תמיד יש ניסיון שני:
       במצב רגוע הטעות הראשונה פותחת רמז לבד, ובלעדיו רק מעודדים.
       הפתרון המלא מגיע אחרי הטעות השנייה. */
    if(P.wrong.length>=2){
      recordAnswer(false,q.kind);
      /* כאן, ולא בלחיצה הראשונה: השאלה נסגרה עכשיו. */
      jsAnswer(false);
      noteResult(q.kind,false,typeof opt==="number"&&typeof q.answer==="number"?Math.abs(opt-q.answer):0);
      P.results.push("no");P.phase="reveal";P.mood="happy";
      setBubble(q.explain,"happy");
      announce(fmt(t.revealPre,{a:q.answer})+" "+q.explain);
      speak(fmt(t.revealPre,{a:q.answer})+" "+q.explain);
      render();
    }else{
      recordAnswer(false,q.kind);
      if(state.settings.calmMode&&P.hints<1&&q.hints&&q.hints[0]){
        P.hints=1;
        if(jsOn())JOSHSTATE.hint();
        setBubble(t.enc+" "+q.hints[0],"think");speak(t.enc+" "+q.hints[0]);render();
      }else{setBubble(t.enc,"think");speak(t.enc)}
    }
  }
}

en:{"s7Title":"Lesson: solid, liquid, gas","s7Goal":"The goal: know the three states of matter - solid, liquid and gas - and that heating and cooling change the state of a material.","s7Start":"Start","s7Step":"Step {0} of 5","s7V1":"One small ice cube. What will happen to it if we heat it slowly? Press the button and find out.","s7Heat":"Heat more","s7V2":"The ice melted into water, and the water heated up and turned into steam. The same material - three states!","s7Q":"What happens to ice when we heat it?","s7A0":"It stays ice forever","s7A1":"It melts and becomes water","s7A2":"It turns into a stone","s7Why0":"When ice is heated above zero degrees it melts.","s7Why2":"Ice melts into water - it does not become a stone.","s7Rule":"The rule: materials have three states of matter - solid (like ice), liquid (like water) and gas (like steam). Heating moves from solid to liquid and from liquid to gas, and cooling moves back.","s7RuleEx":"The other way too: when we cool water in a freezer it freezes into ice.","s7P1":"We put a cup of water in the freezer. What will happen to the water?","s7P1a0":"It will freeze and become ice","s7P1a1":"It will become steam","s7P1a2":"Nothing will happen","s7P2":"Steam is water in the state of...","s7P2a0":"gas","s7P2a1":"liquid","s7P2a2":"solid","s7Sum":"Done! Today we learned: materials have three states of matter - solid, liquid and gas - and heating and cooling move the material between them.","s7Again":"From the start","s7Next":"Next","s7Hear":"Listen","s7Correct":"Correct!","s7Wrong":"Not yet. You can try again.","s7Check":"Understanding check","s7Ice":"ice - solid","s7Water":"water - liquid","s7Steam":"steam - gas","s7PrevLesson":"Previous lesson","s7HintQ":"Ice is frozen water. What happens to frozen water when it is warm?","s7HintP1":"The freezer is very cold - exactly the opposite of heating!","s7HintP2":"Liquid water flows and ice is hard. Steam scatters in the air in every direction - which state of matter fits that?","s7Fwd" ru:{"s7Title":"Урок: твёрдое, жидкое, газ","s7Goal":"Цель: узнать три состояния вещества - твёрдое, жидкое и газообразное - и что нагревание и охлаждение меняют состояние вещества.","s7Start":"Начинаем","s7Step":"Шаг {0} из 5","s7V1":"Один маленький кубик льда. Что с ним будет, если нагревать его медленно? Нажмите кнопку и узнайте.","s7Heat":"Нагреть ещё","s7V2":"Лёд растаял и стал водой, а вода нагрелась и превратилась в пар. То же вещество - три состояния!","s7Q":"Что происходит со льдом, когда его нагревают?","s7A0":"Он остаётся льдом навсегда","s7A1":"Он тает и становится водой","s7A2":"Он превращается в камень","s7Why0":"Когда лёд нагревают выше нуля градусов, он тает.","s7Why2":"Лёд тает и становится водой - он не превращается в камень.","s7Rule":"Правило: у веществ есть три состояния - твёрдое (как лёд), жидкое (как вода) и газообразное (как пар). Нагревание переводит из твёрдого в жидкое и из жидкого в газ, а охлаждение возвращает обратно.","s7RuleEx":"И наоборот: когда воду охлаждают в морозилке, она замерзает и становится льдом.","s7P1":"Мы поставили стакан воды в морозилку. Что будет с водой?","s7P1a0":"Она замёрзнет и станет льдом","s7P1a1":"Она станет паром","s7P1a2":"Ничего не будет","s7P2":"Пар - это вода в состоянии...","s7P2a0":"газ","s7P2a1":"жидкость","s7P2a2":"твёрдое тело","s7Sum":"Готово! Сегодня мы узнали: у веществ есть три состояния - твёрдое, жидкое и газообразное - и нагревание и охлаждение переводят вещество между ними.","s7Again":"Сначала","s7Next":"Дальше","s7Hear":"Слушать","s7Correct":"Верно!","s7Wrong":"Пока нет. Можно ещё раз.","s7Check":"Проверка понимания","s7Ice":"лёд - твёрдое","s7Water":"вода - жидкость","s7Steam":"пар - газ","s7PrevLesson":"Прошлый урок","s7HintQ":"Лёд - это замёрзшая вода. Что происходит с ней, когда тепло?","s7HintP1":"В морозилке очень холодно - прямая противоположность нагреву!","s7HintP2":"Жидкая вода течёт, а лёд твёрдый. Пар разлетается в воздухе во все стороны - какое состояние вещества этому подходит?","s7Fwd":"Следующий урок"},

he:{"s9Title":"שיעור: איך אנחנו נושמים?","s9Goal":"בשיעור הזה נכיר את מערכת הנשימה, ונבין שהיא מכניסה חמצן מהאוויר לגוף.","s9Start":"מתחילים","s9Step":"שלב {0} מתוך 5","s9V1":"כל רגע אנחנו נושמים, גם בלי לשים לב. לאן הולך האוויר שאנחנו שואפים? לחצו על הכפתור ושאפו איתנו נשימה עמוקה.","s9Breathe":"שאפו אוויר","s9V2":"האוויר נכנס דרך האף, עובר בקנה הנשימה ומגיע לריאות. הריאות מעבירות את החמצן לדם, והדם מוביל אותו לכל הגוף.","s9Q":"מה הריאות מעבירות לדם?","s9A0":"מים","s9A1":"חמצן מהאוויר","s9A2":"מזון","s9Why0":"מים אנחנו שותים, לא שואפים.","s9Why2":"מזון מגיע לקיבה דרך ושט האוכל, לא דרך הריאות.","s9Rule":"הכלל: מערכת הנשימה כוללת את האף, קנה הנשימה והריאות. בשאיפה נכנס אוויר עם חמצן, ובנשיפה יוצא אוויר עם פחמן דו-חמצני שהגוף לא צריך.","s9RuleEx":"בזמן מאמץ, למשל ריצה, השרירים צריכים יותר חמצן, ולכן קצב הנשימה עולה.","s9P1":"רצנו במהירות במדרגות. מה יקרה לקצב הנשימה?","s9P1a0":"יעלה - השרירים צריכים יותר חמצן","s9P1a1":"ירד לאפס","s9P1a2":"לא ישתנה בכלל","s9P2":"באיזו דרך עובר האוויר בגוף?","s9P2a0":"אף ← קנה הנשימה ← ריאות","s9P2a1":"קיבה ← לב ← ריאות","s9P2a2":"ריאות ← אף ← קנה הנשימה","s9Sum":"כל הכבוד, סיימתם! היום למדנו: מערכת הנשימה מכניסה חמצן מהאוויר לריאות ולדם, ומוציאה פחמן דו-חמצני. במאמץ קצב הנשימה עולה.","s9Again":"מההתחלה","s9Next":"הבא","s9Hear":"השמיעו","s9Correct":"נכון!","s9Wrong":"עוד לא. אפשר לנסות שוב.","s9Check":"בדיקת הבנה","s9Nose":"אף","s9Trachea":"קנה הנשימה","s9Lungs":"ריאות","s9PrevLesson":"לשיעור הקודם","s9HintQ":"אנחנו נושמים אוויר - איזה חלק של האוויר הגוף חייב לקבל?","s9HintP1":"בריצה השרירים צריכים יותר חמצן - מה הגוף עושה כדי להשיג יותר?","s9HintP2":"עקבו אחרי האוויר: דרך מה הוא נכנס לגוף? באיזה צינור הוא יורד? ולאן הוא מגיע בסוף?","s9Fwd":"לשיעור הבא"},
en:{"s9Title":"Lesson: how do we breathe?","s9Goal":"The goal: know the respiratory system and understand that it brings oxygen from the air into the body.","s9Start":"Start","s9Step":"Step {0} of 5","s9V1":"Every moment we breathe - even without noticing. Where does the air we inhale go? Press the button and take a deep breath.","s9Breathe":"Inhale","s9V2":"Air enters through the nose, passes through the windpipe and reaches the lungs. The lungs pass the oxygen to the blood, and the blood carries it to the whole body.","s9Q":"What do the lungs pass to the blood?","s9A0":"Water","s9A1":"Oxygen from the air","s9A2":"Food","s9Why0":"We drink water - we do not inhale it.","s9Why2":"Food reaches the stomach through the food pipe, not through the lungs.","s9Rule":"The rule: the respiratory system includes the nose, the windpipe and the lungs. When we inhale, air with oxygen enters; when we exhale, air with carbon dioxide that the body does not need leaves.","s9RuleEx":"During effort, like running, the muscles need more oxygen - so the breathing rate goes up.","s9P1":"We ran quickly up the stairs. What will happen to the breathing rate?","s9P1a0":"It will rise - the muscles need more oxygen","s9P1a1":"It will drop to zero","s9P1a2":"It will not change at all","s9P2":"Which path does air take in the body?","s9P2a0":"Nose → windpipe → lungs","s9P2a1":"Stomach → heart → lungs","s9P2a2":"Lungs → nose → windpipe","s9Sum":"Done! Today we learned: the respiratory system brings oxygen from the air into the lungs and the blood, and removes carbon dioxide. During effort the breathing rate rises.","s9Again":"From the start","s9Next":"Next","s9Hear":"Listen","s9Correct":"Correct!","s9Wrong":"Not yet. You can try again.","s9Check":"Understanding check","s9Nose":"nose","s9Trachea":"windpipe","s9Lungs":"lungs","s9PrevLesson":"Previous lesson","s9HintQ":"We breathe air - which part of the air must the body get?","s9HintP1":"When running, the muscles need more oxygen - what does the body ru:{"s9Title":"Урок: как мы дышим?","s9Goal":"Цель: познакомиться с дыхательной системой и понять, что она доставляет кислород из воздуха в тело.","s9Start":"Начинаем","s9Step":"Шаг {0} из 5","s9V1":"Мы дышим каждое мгновение - даже не замечая этого. Куда идёт воздух, который мы вдыхаем? Нажмите кнопку и сделайте глубокий вдох.","s9Breathe":"Вдохнуть","s9V2":"Воздух входит через нос, проходит по дыхательному горлу и попадает в лёгкие. Лёгкие передают кислород в кровь, а кровь разносит его по всему телу.","s9Q":"Что лёгкие передают крови?","s9A0":"Воду","s9A1":"Кислород из воздуха","s9A2":"Еду","s9Why0":"Воду мы пьём - не вдыхаем.","s9Why2":"Еда попадает в желудок через пищевод, а не через лёгкие.","s9Rule":"Правило: дыхательная система включает нос, дыхательное горло (трахею) и лёгкие. На вдохе входит воздух с кислородом, а на выдохе выходит воздух с углекислым газом, который телу не нужен.","s9RuleEx":"При нагрузке, например при беге, мышцам нужно больше кислорода - поэтому дыхание учащается.","s9P1":"Мы быстро поднялись по лестнице. Что будет с дыханием?","s9P1a0":"Участится - мышцам нужно больше кислорода","s9P1a1":"Остановится","s9P1a2":"Не изменится совсем","s9P2":"Какой путь проходит воздух в теле?","s9P2a0":"Нос → трахея → лёгкие","s9P2a1":"Желудок → сердце → лёгкие","s9P2a2":"Лёгкие → нос → трахея","s9Sum":"Готово! Сегодня мы узнали: дыхательная система доставляет кислород из воздуха в лёгкие и кровь и выводит углекислый газ. При нагрузке дыхание учащается.","s9Again":"Сначала","s9Next":"Дальше","s9Hear":"Слушать","s9Correct":"Верно!","s9Wrong":"Пока нет. Можно ещё раз.","s9Check":"Проверка понимания","s9Nose":"нос","s9Trachea":"трахея","s9Lungs":"лёгкие","s9PrevLesson":"Прошлый урок","s9HintQ":"Мы дышим воздухом - какая часть воздуха нужна телу?","s9HintP1":"При беге мышцам нужно больше кислорода - что делает тело, чтобы получить больше?","s9HintP2":"Проследите за воздухом: через что он входит в тело? По какой трубе спускается? И куда попадает в конце?","s9Fwd":"Следующий урок"},

he:{"s10Title":"שיעור: משאבי טבע - מתכלים או מתחדשים?","s10Goal":"בשיעור הזה נלמד שהטבע נותן לנו משאבים, ונמיין אותם למשאבים מתכלים ולמשאבים מתחדשים.","s10Start":"מתחילים","s10Step":"שלב {0} מתוך 5","s10V1":"נפט, פחם, שמש ורוח. כולם משאבי טבע שהאדם משתמש בהם. אבל יש ביניהם הבדל גדול. לחצו על הכפתור ובדקו.","s10Reveal":"בואו נבדוק את ההבדל","s10V2":"נפט ופחם הם משאבים מתכלים. הכמות שלהם מוגבלת והם נגמרים. שמש ורוח הם משאבים מתחדשים. הם לא נגמרים.","s10Q":"איזה משאב הוא מתחדש - לא נגמר?","s10A0":"נפט","s10A1":"שמש","s10A2":"פחם","s10Why0":"הנפט נגמר כשמשתמשים בו. הוא משאב מתכלה.","s10Why2":"הפחם נגמר כששורפים אותו. הוא משאב מתכלה.","s10Rule":"הכלל: משאב מתכלה נמצא בכמות מוגבלת ונגמר אחרי שימוש, כמו נפט ופחם. משאב מתחדש לא נגמר, כמו שמש ורוח. לכן חשוב לחסוך במשאבים מתכלים ולהשתמש יותר במשאבים מתחדשים.","s10RuleEx":"שריפת נפט ופחם גם מזהמת את האוויר. עוד סיבה להעדיף שמש ורוח.","s10P1":"פחם הוא משאב...","s10P1a0":"מתכלה - הוא נגמר אחרי ששורפים אותו","s10P1a1":"מתחדש - הוא לא נגמר אף פעם","s10P1a2":"מלאכותי - האדם מייצר אותו במפעל","s10P2":"למה כדאי להשתמש באנרגיית שמש?","s10P2a0":"כי היא לא נגמרת ולא מזהמת","s10P2a1":"כי היא נגמרת מהר","s10P2a2":"כי היא מזהמת את האוויר","s10Sum":"כל הכבוד, סיימתם! היום למדנו: משאבי טבע מתחלקים למתכלים (נפט, פחם) ולמתחדשים (שמש, רוח). כדאי להשתמש יותר במתחדשים.","s10Again":"מההתחלה","s10Next":"הבא","s10Hear":"השמיעו","s10Correct":"נכון!","s10Wrong":"עוד לא. אפשר לנסות שוב.","s10Check":"בדיקת הבנה","s10Oil":"נפט","s10Coal":"פחם","s10Sun":"שמש","s10Wind":"רוח","s10Used":"מתכלה","s10Renew":"מתחדש","s10PrevLesson":"לשיעור הקודם","s10HintQ":"נפט ופחם נגמרים יום אחד - מי מהאפשרויות יהיה כאן תמיד, גם עוד אלף שנה?","s10HintP1":"פחם נוצר במשך מיליוני שנים. מה קורה אחרי ששורפים אותו - האם אפשר להשתמש בו שוב?","s10HintP2":"חשבו על שתי שאלות: האם היא נגמרת? והאם היא מלכלכת את האוויר?","s10Fwd":"לשיעור הבא"},
en:{"s10Title":"Lesson: natural resources - exhaustible or renewable?","s10Goal":"The goal: know that nature gives us resources, and sort them into exhaustible and renewable resources.","s10Start":"Start","s10Step":"Step {0} of 5","s10V1":"Oil, coal, sun and wind - all are natural resources that people use. But there is a big difference between them. Press the button and find out.","s10Reveal":"Reveal the difference","s10V2":"Oil and coal are exhaustible resources - their amount is limited and they run out. Sun and wind are renewable resources - they never run out.","s10Q":"Which resource is renewable - never runs out?","s10A0":"Oil","s10A1":"Sun","s10A2":"Coal","s10Why0":"Oil runs out when we use it - it is an exhaustible resource.","s10Why2":"Coal runs out when we burn it - it is an exhaustible resource.","s10Rule":"The rule: an exhaustible resource exists in a limited amount and runs out after use, like oil and coal. A renewable resource never runs out, like sun and wind. So it is important to save exhaustible resources and use more renewable ones.","s10RuleEx":"Burning oil and coal also pollutes the air - another reason to prefer sun and wind.","s10P1":"Coal is a resource that is...","s10P1a0":"Exhaustible - it runs out after we burn it","s10P1a1":"Renewable - it never runs out","s10P1a2":"Man-made - people produce it in a factory","s10P2":"Why should we use solar energy?","s10P2a0":"Because it never runs out and does not pollute","s10P2a1":"Because it runs out quickly","s10P2a2":"Because it pollutes the air","s10Sum":"Done! Today we learned: natural resources are divided into exhaustible (oil, coal) and renewable (sun, wind) - and it is better to use more renewable ones.","s10Again":"From the start","s10Next":"Next","s10Hear":"Listen","s10Correct":"Correct!","s10Wrong":"Not yet. You can try again.","s10Check":"Understanding check","s10Oil":"oil","s10Coal":"coal","s10Sun":"sun","s10Wind":"wind","s10Used":"exhaustible","s10Renew":"renewable","s10PrevLesson":"Previous lesson","s10HintQ":"Oil and coal will run out one day - which of the options will always be here, even in a thousand years?","s10HintP1":"Coal formed over millions of years. What happens after we burn it - can it be used again?","s10HintP2":"Think of two questions: does it run out? does it dirty the air?","s10Fwd":"Next lesson"},
ru:{"s10Title":"Урок: природные ресурсы - исчерпаемые или возобновимые?","s10Goal":"Цель: узнать, что природа даёт нам ресурсы, и разделить их на исчерпаемые и возобновимые.","s10Start":"Начинаем","s10Step":"Шаг {0} из 5","s10V1":"Нефть, уголь, солнце и ветер - все это природные ресурсы, которые использует человек. Но между ними есть большая разница. Нажмите кнопку и узнайте.","s10Reveal":"Узнать разницу","s10V2":"Нефть и уголь - исчерпаемые ресурсы: их количество ограничено и они заканчиваются. Солнце и ветер - возобновимые ресурсы: они не заканчиваются.","s10Q":"Какой ресурс возобновимый - не заканчивается?","s10A0":"Нефть","s10A1":"Солнце","s10A2":"Уголь","s10Why0":"Нефть заканчивается, когда мы её используем - это исчерпаемый ресурс.","s10Why2":"Уголь заканчивается, когда мы его сжигаем - это исчерпаемый ресурс.","s10Rule":"Правило: исчерпаемый ресурс существует в ограниченном количестве и заканчивается после использования, как нефть и уголь. Возобновимый ресурс не заканчивается, как солнце и ветер. Поэтому важно беречь исчерпаемые ресурсы и больше использовать возобновимые.","s10RuleEx":"Сжигание нефти и угля ещё и загрязняет воздух - ещё одна причина выбирать солнце и ветер.","s10P1":"Уголь - это ресурс...","s10P1a0":"Исчерпаемый - он заканчивается после сжигания","s10P1a1":"Возобновимый - он не заканчивается никогда","s10P1a2":"Искусственный - человек производит его на заводе","s10P2":"Почему стоит использовать энергию солнца?","s10P2a0":"Потому что она не заканчивается и не загрязняет","s10P2a1":"Потому что она быстро заканчивается","s10P2a2":"Потому что она загрязняет воздух","s10Sum":"Готово! Сегодня мы узнали: природные ресурсы делятся на исчерпаемые (нефть, уголь) и возобновимые (солнце, ветер) - и лучше больше использовать возобновимые.","s10Again":"Сначала","s10Next":"Дальше","s10Hear":"Слушать","s10Correct":"Верно!","s10Wrong":"Пока нет. Можно ещё раз.","s10Check":"Проверка понимания","s10Oil":"нефть","s10Coal":"уголь","s10Sun":"солнце","s10Wind":"ветер","s10Used":"исчерпаемый","s10Renew":"возобновимый","s10PrevLesson":"Прошлый урок","s10HintQ":"Нефть и уголь однажды закончатся - что из вариантов будет здесь всегда, даже через тысячу лет?","s10HintP1":"Уголь образовался за миллионы лет. Что происходит после того, как его сжигают - можно ли использовать его снова?","s10HintP2":"Подумайте о двух вопросах: кончается ли она? пачкает ли воздух?","s10Fwd":"Следующий урок"},

en:{"s12Title":"Lesson: the heart and blood circulation","s12Goal":"The goal: know that the heart pumps blood to all parts of the body, and that blood carries oxygen and food to the cells.","s12Start":"Start","s12Step":"Step {0} of 5","s12V1":"Our heart beats all the time - without stopping even for a moment. Why? Press the button and make the heart beat.","s12Beat":"Beat","s12V2":"With every beat the heart pumps blood through the blood vessels to all parts of the body. The blood brings the cells oxygen and food, and collects waste on the way back.","s12Q":"What is the heart's job?","s12A0":"To digest food","s12A1":"To pump blood to the whole body","s12A2":"To clean the air","s12Why0":"Digesting food is the stomach's job, not the heart's.","s12Why2":"The respiratory system handles the air, not the heart.","s12Rule":"The rule: the heart is a muscle that beats and pumps blood through the blood vessels - arteries and veins - to all parts of the body and back. The blood carries oxygen and food that the cells need to live.","s12RuleEx":"During effort the muscles need more oxygen, so the heart beats faster. Try feeling your pulse after a run!","s12P1":"What does the blood carry to the body's cells?","s12P1a0":"Oxygen and food","s12P1a1":"Only water","s12P1a2":"Sunlight","s12P2":"Why does the heart beat faster when running?","s12P2a0":"Because the muscles need more oxygen","s12P2a1":"Because the heart is tired","s12P2a2":"No reason - it is random","s12Sum":"Done! Today we learned: the heart pumps blood through the blood vessels to the whole body, and the blood carries oxygen and food to the cells. During effort the heart beats faster.","s12Again":"From the start","s12Next":"Next","s12Hear":"Listen","s12Correct":"Correct!","s12Wrong":"Not yet. You can try again.","s12Check":"Understanding check","s12Heart":"heart","s12Blood":"blood","s12Body":"whole body","s12PrevLesson":"Previous lesson","s12HintQ":"The heart beats without stopping all our lives - what does it move through ергии - а что им приносит кровь для этого?","s12Fwd":"Следующий урок"},

    q:function(){
      if(view==="lesson")return lessonTutorContext();
      var x=P&&P.ses?P.ses[P.qi]:null;
      return x?{expr:x.expr||x.text,ans:x.answer,level:"רמה "+activeLevel()+" מתוך 6"}:null;
    },
    stopHost:function(){try{stopSpeak()}catch(e){}}
  });
  /* ---- מנוע לימור — המתאם של האפליקציה (16.9.2026) ----
     getScreenContext מחזיר מה שמוצג עכשיו; actions הן מה שלימור
     רשאי לעשות כאן, וכל אחת מחזירה true רק כשבאמת קרה משהו.
     math-app היא התבנית לשאר האפליקציות. */
  if(window.BARAK)BARAK.register({
    app:"science",
    getScreenContext:function(){
      if(view==="lesson"){var c=lessonTutorContext();return c?{id:location.search+"|"+c.expr,type:"lesson",q:c.expr,options:[],correct:null,topic:c.topic}:null}
      var q=P&&P.ses?P.ses[P.qi]:null;
      if(!q||view!=="practice"||P.phase==="done")return null;
      var t=T(),kind=tName({id:q.kind})||q.kind;
      return {id:"r"+P.qi+"-"+(q.expr||q.text).slice(0,24), type:P.phase==="ask"?"mcq":"reveal",
        q:q.expr?q.text+" ("+q.expr+")":q.text, options:q.options.map(String),
        correct:String(q.answer), student:P.wrong.length?String(P.wrong[P.wrong.length-1]):null,
        topic:kind, level:"רמה "+activeLevel()+" מתוך 6",
        curriculum:"מדע וטכנולוגיה ליסודי, כיתות ג׳–ו׳: "+kind};
    },
    actions:{
      next_question:{desc:"עובר לשאלה הבאה; באמצע שאלה: מדלג עליה",
        run:function(){
          if(view!=="practice"||P.phase==="done")return false;
          if(P.phase==="reveal"){advance();return true}
          onAction("skip",null);return true;
        }},
      show_hint:{desc:"מציג את הרמז הבא לשאלה שעל המסך",
        run:function(){
          if(view!=="practice"||P.phase!=="ask"||P.hints>=3)return false;
          var n=P.hints;onAction("hint",null);return P.hints>n;
        }},
      read_aloud:{desc:"מקריא את השאלה בקול",
        run:function(){
          if(view!=="practice"||!P.ses[P.qi]||P.phase==="done")return false;
          onAction("listen",null);return true;
        }},
      highlight_option:{desc:"מדגיש במסך אחת מארבע האפשרויות, לפי מקומה (0 עד 3)",
        params:{index:{type:"integer",min:0,max:3,required:true}},
        run:function(a){
          var q=P.ses[P.qi];if(!q||P.phase!=="ask")return false;
          return BARAK.highlight(document.querySelector('[data-o="'+q.options[a.index]+'"]'));
        }},
      explain_again:{desc:"מציג ומקריא שוב את ההסבר, אחרי שהשאלה נענתה",
        run:function(){
          var q=P.ses[P.qi];if(!q||P.phase!=="reveal")return false;
          setBubble(q.explain,"think");speak(q.explain);return true;
        }},
      go_screen:{desc:"עובר למסך אחר של האפליקציה",
        params:{name:{type:"string",enum:["practice","progress","records","settings"],required:true}},
        run:function(a){
          if(!state.pet||P.brk)return false;
          stopSpeak();view=a.name;
          if(view!=="practice")startRound(activeLevel());
          render();window.scrollTo(0,0);return view===a.name;
        }},
      slow_mode:{desc:"פותח את המצב האיטי: אותה שאלה צעד אחר צעד, עם עיגולים",
        run:function(){
          var q=P.ses[P.qi];if(!q||!q.expr||P.phase!=="ask"||!SlowMode.can(q))return false;
          if(state.settings.soundFx)sfxHint();SlowMode.open(q);return true;
        }}
    }
  });
  try{render()}catch(e){}
}
</script>
