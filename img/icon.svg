<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img">
<title>יהושע לגשטיין — למידה נגישה</title>
<!-- ============================================================
     אייקון דף הבית. אותן מידות בית של שמונת האחרים: קנבס לבן
     אטום, אריח 460×460 בהיסט 26, רדיוס 98, גרדיאנט אנכי, גליף
     לבן שמרכזו ב-50% אופקית ו-51% אנכית.

     הגרדיאנט עודכן לצבע המותג החדש (#2f5fd8) במקום שאריות הפלטה
     הישנה (#174c7e), כדי שהאייקון ומסך הפתיחה יהיו אותו כחול.

     הגליף הוא יו״ד אמיתית ולא עמוד באמצע: הראש כבד ותופס 60%
     מגובה האות, הרגל קצרה (40%) ונוטה שמאלה, והפינה השמאלית
     העליונה נחתכת באלכסון — הראש רחב יותר בתחתיתו מאשר בקצהו
     העליון. זה הדגל של היו״ד, והוא מה שמונע ממנה להיקרא ד׳ או ר׳.
     ראה את ההסתייגות שבדיווח.
     ============================================================ -->
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2f5fd8"/>
    <stop offset="1" stop-color="#1e3fa0"/>
  </linearGradient>
</defs>

<rect width="512" height="512" fill="#ffffff"/>
<rect x="26" y="26" width="460" height="460" rx="98" ry="98" fill="url(#g)"/>

<!-- י׳ — תיבה 176×172, מרכז (256, 260) -->
<path fill="#ffffff" d="M194 174
  L344 174 L344 278 L334 346 L250 346 L260 278 L168 278 Z"/>
</svg>
