/* ---------- 14. קומבינטוריקה ---------- */
function genComb(L){
  var n,k,steps;
  if(L===1){
    n=ri(4,7);
    return {ask:_f("בכמה סדרים שונים אפשר להושיב {0} אנשים בשורה?", n),expr:"",
      ans:W(String(fact(n))),
      wrong:[
        W(String(n*n),_("הכפלתם ב-n בכל מקום. אחרי שאדם התיישב הוא כבר לא זמין, ולכן המספר יורד באחד בכל שלב.")),
        W(String(Math.pow(2,n)),_("זה מספר תת־הקבוצות, לא מספר הסדרים.")),
        W(String(n*(n-1)),_("עצרתם אחרי שני מקומות. צריך להמשיך עד המקום האחרון."))
      ],
      steps:[
        S(_("סופרים מקום אחרי מקום"),_f("למקום הראשון יש {0} מועמדים. אחרי שאחד התיישב נשארו {1}, וכן הלאה.", n, (n-1)),
          n+" · "+(n-1)+" · … · 1"),
        S(_("זו בדיוק העצרת"),"","n! = "+n+"!"),
        S(_("מחשבים"),"","= "+fact(n))
      ],rule:"perm",hint:_("סידור של כל האנשים בשורה הוא n עצרת.")};
  }
  if(L===2){
    n=ri(5,9);k=ri(2,Math.min(4,n-1));
    var c=Cnk(n,k),p=Math.round(fact(n)/fact(n-k));
    return {ask:_f("בוחרים ועדה של {0} אנשים מתוך {1}. בכמה דרכים?", k, n),expr:"",
      ans:W(String(c)),
      wrong:[
        W(String(p),_f("ספרתם גם את הסדר. בוועדה אין תפקידים, ולכן צריך לחלק ב-{0}! כדי לא לספור את אותה קבוצה שוב ושוב.", k)),
        W(String(n*k),_("הכפלתם את המספרים. זו לא נוסחת הבחירה.")),
        W(String(Cnk(n,k-1)),_f("בחרתם {0} אנשים במקום {1}.", (k-1), k))
      ],
      steps:[
        S(_("סדר או לא סדר — זו השאלה"),_("בוועדה כל החברים שווים, ולכן הסדר לא משנה. במקרה כזה משתמשים בצירופים."),
          "C(n,k) = n! / (k!·(n−k)!)"),
        S(_("מציבים"),"","C("+n+","+k+") = "+n+"! / ("+k+"!·"+(n-k)+"!)"),
        S(_("מחשבים"),"","= "+c),
        S(_f("למה מחלקים ב-{0}!", k),_f("אילו ספרנו בסדר היינו מקבלים {0}, וכל ועדה הייתה נספרת {1} פעמים.", p, fact(k)),
          p+" ÷ "+fact(k)+" = "+c)
      ],rule:"comb",hint:_("אין סדר — צירופים. יש סדר — חליפות.")};
  }
  n=ri(4,6);k=ri(2,3);
  var perm=Math.round(fact(n)/fact(n-k));
  return {ask:_f("בוחרים {0} אנשים מתוך {1} לתפקידים שונים. בכמה דרכים?", k, n),expr:"",
    ans:W(String(perm)),
    wrong:[
      W(String(Cnk(n,k)),_("התעלמתם מהסדר. תפקידים שונים פירושם שהסדר כן משנה, ולכן חליפות ולא צירופים.")),
      W(String(fact(n)),_f("סידרתם את כולם. בוחרים רק {0} מתוך {1}.", k, n)),
      W(String(Math.pow(n,k)),_("אותו אדם לא יכול למלא שני תפקידים, ולכן אין החזרה."))
    ],
    steps:[
      S(_("כאן הסדר משנה"),_("מי שקיבל תפקיד א׳ אינו במצב זהה למי שקיבל תפקיד ב׳, ולכן זו חליפה."),
        "P(n,k) = n! / (n−k)!"),
      S(_("סופרים"),"",_f("למקום הראשון {0} אפשרויות, לשני {1}, וכן הלאה", n, (n-1))),
      S(_("מחשבים"),"","= "+perm)
    ],rule:"perm",hint:_("תפקידים שונים = הסדר משנה = חליפות.")};
}

/* ---------- 15. הסתברות מותנית ובייס ---------- */
function genCondProb(L){
  var a,b,ab,tot,steps;
  if(L===1){
    tot=pick([40,50,60,80,100]);
    a=Math.round(tot*pick([0.3,0.4,0.5,0.6]));
    b=Math.round(tot*pick([0.3,0.4,0.5]));
    ab=Math.round(Math.min(a,b)*pick([0.4,0.5,0.6]));
    var p=fr(ab,b);
    return {ask:_f("מתוך {0} סטודנטים, {1} לומדים סטטיסטיקה ו-{2} מהם לומדים גם אלגברה. סטודנט נבחר באקראי מבין לומדי הסטטיסטיקה — מה ההסתברות שהוא לומד גם אלגברה?", tot, b, ab),
      expr:"",ans:W(p.html()),
      wrong:[
        W(fr(ab,tot).html(),_("חילקתם בכלל הסטודנטים. בהסתברות מותנית המכנה מצטמצם לתנאי בלבד.")),
        W(fr(b,tot).html(),_("זו ההסתברות ללמוד סטטיסטיקה, ולא ההסתברות המבוקשת.")),
        W(fr(b,ab).html(),_("הפכתם את השבר."))
      ],
      steps:[
        S(_("הגדרת הסתברות מותנית"),_("המכנה מצטמצם: כבר ידוע שהסטודנט מקבוצת הסטטיסטיקה, ולכן זה כל המרחב שלנו."),
          "P(A|B) = P(A∩B) / P(B)"),
        S(_("סופרים"),"",_f("החיתוך: {0}   ,   התנאי: {1}", ab, b)),
        S(_("מחלקים"),"",fr(ab,b).html())
      ],rule:"cond",hint:_("בהסתברות מותנית המכנה הוא התנאי, לא כל המרחב.")};
  }
  if(L===2){
    var pd=pick([2,4,5]),sens=pick([90,95]),fp=pick([5,10]);
    var pop=1000,sick=pop/pd/10*1;
    sick=Math.round(pop*pd/100);
    var tp=Math.round(sick*sens/100),fpN=Math.round((pop-sick)*fp/100);
    var post=fr(tp,tp+fpN);
    return {ask:_f("מחלה מופיעה אצל {0}% מהאוכלוסייה. בדיקה מזהה חולה בהסתברות {1}%, ונותנת תוצאה חיובית שגויה אצל {2}% מהבריאים. אדם קיבל תוצאה חיובית — מה ההסתברות שהוא חולה?", pd, sens, fp),
      expr:"",ans:W(post.html()+" ≈ "+Math.round(post.val()*100)+"%"),
      wrong:[
        W(sens+"%",_("זו רגישות הבדיקה — ההסתברות לתוצאה חיובית בהינתן מחלה. השאלה מבקשת את הכיוון ההפוך.")),
        W(pd+"%",_("זו השכיחות באוכלוסייה, לפני שהתקבל מידע מהבדיקה.")),
        W((100-fp)+"%",_("זו הסגוליות של הבדיקה, לא ההסתברות המבוקשת."))
      ],
      steps:[
        S(_("למה האינטואיציה נכשלת כאן"),_("הבריאים הם רוב עצום, ולכן גם אחוז קטן של טעויות אצלם מייצר הרבה תוצאות חיוביות שגויות."),
          _("רוב החיוביים מגיעים דווקא מהבריאים")),
        S(_f("סופרים על {0} אנשים", pop),"",	_f("חולים: {0}   ,   בריאים: {1}", sick, (pop-sick))),
        S(_("כמה חיוביים מכל קבוצה"),"",	_f("חולים חיוביים: {0}   ,   בריאים חיוביים בטעות: {1}", tp, fpN)),
        S(_("מחלקים"),"",tp+" ÷ ("+tp+" + "+fpN+") = "+post.html()+" ≈ "+Math.round(post.val()*100)+"%")
      ],rule:"bayes",hint:_("סופרים על אוכלוסייה שלמה: כמה חיוביים אמיתיים מול כמה חיוביים שגויים.")};
  }
  var pa=pick([2,3,4,5]),pb=pick([2,3,4,5]);
  var indep=Math.random()<0.5;
  var pAB=indep?fr(1,pa*pb):fr(1,pa*pb+1);
  return {ask:_f("נתון P(A) = {0} , P(B) = {1} , P(A∩B) = {2}. האם המאורעות בלתי תלויים?", fr(1,pa).html(), fr(1,pb).html(), pAB.html()),
    expr:"",ans:W(indep?_("בלתי תלויים"):_("תלויים")),
    wrong:[
      W(indep?_("תלויים"):_("בלתי תלויים"),_f("מכפלת ההסתברויות היא {0}, והחיתוך הוא {1}. {2}", fr(1,pa*pb).html(), pAB.html(), (indep?_("הם שווים, ולכן בלתי תלויים."):_("הם שונים, ולכן תלויים.")))),
      W(_("זרים"),_("מאורעות זרים הם כאלה שהחיתוך שלהם ריק. כאן החיתוך שונה מאפס.")),
      W(_("אי אפשר לקבוע"),_("אפשר בהחלט — משווים את החיתוך למכפלת ההסתברויות."))
    ],
    steps:[
      S(_("מבחן אי־התלות"),_("אי־תלות אינה עניין של תחושה אלא של שוויון מספרי אחד."),_("A,B בלתי תלויים ⇔ P(A∩B) = P(A)·P(B)")),
      S(_("מחשבים את המכפלה"),"",fr(1,pa).html()+" · "+fr(1,pb).html()+" = "+fr(1,pa*pb).html()),
      S(_("משווים לחיתוך"),"",pAB.html()+(indep?" = ":" ≠ ")+fr(1,pa*pb).html()),
      S(_("מסקנה"),"",indep?_("בלתי תלויים"):_("תלויים"))
    ],rule:"indep",hint:_("בלתי תלויים אם ורק אם ההסתברות של החיתוך שווה למכפלת ההסתברויות.")};
}

/* ---------- 16. תוחלת ושונות ---------- */
function genExpVar(L){
  var vals,probs,i,E,steps;
  if(L===1){
    var n=3,den=pick([4,6,8,10]);
    var p1=ri(1,den-2),p2=ri(1,den-p1-1),p3=den-p1-p2;
    vals=[rnz(-5,10),rnz(-5,10),rnz(-5,10)];
    while(vals[1]===vals[0])vals[1]=rnz(-5,10);
    while(vals[2]===vals[0]||vals[2]===vals[1])vals[2]=rnz(-5,10);
    probs=[fr(p1,den),fr(p2,den),fr(p3,den)];
    E=(vals[0]*p1+vals[1]*p2+vals[2]*p3)/den;
    return {ask:_("חשבו את התוחלת"),
      expr:"x:  "+vals.map(num).join(" , ")+"<br>P:  "+probs.map(function(f){return f.html()}).join(" , "),
      ans:W(num(Math.round(E*1000)/1000)),
      wrong:[
        W(num(Math.round((vals[0]+vals[1]+vals[2])/3*1000)/1000),_("חישבתם ממוצע פשוט. בתוחלת כל ערך מקבל משקל לפי ההסתברות שלו.")),
        W(num(vals[0]+vals[1]+vals[2]),_("חיברתם את הערכים בלי להכפיל בהסתברויות.")),
        W(num(Math.round((p1+p2+p3)/den*1000)/1000),_("סכמתם את ההסתברויות. הן תמיד מסתכמות ל-1."))
      ],
      steps:[
        S(_("תוחלת היא ממוצע משוקלל"),_("כל ערך נכנס לחישוב לפי ההסתברות שלו, ולא בחלקים שווים."),"E(X) = Σ xᵢ·P(xᵢ)"),
        S(_("מכפילים כל ערך בהסתברות"),"",vals.map(function(v,ix){return num(v)+"·"+[p1,p2,p3][ix]+"/"+den}).join(" + ")),
        S(_("מחברים"),"","E(X) = "+num(Math.round(E*1000)/1000))
      ],rule:"exp",hint:_("תוחלת = סכום של ערך כפול ההסתברות שלו.")};
  }
  if(L===2){
    var a=ri(1,6),b=a+ri(1,6);
    /* משתנה עם שני ערכים בהסתברות חצי־חצי — שונות פשוטה לבדיקה */
    E=(a+b)/2;
    var E2=(a*a+b*b)/2,V=E2-E*E;
    return {ask:_f("משתנה מקרי מקבל את הערכים {0} ו-{1}, כל אחד בהסתברות חצי. חשבו את השונות.", a, b),
      expr:"",ans:W(num(Math.round(V*1000)/1000)),
      wrong:[
        W(num(Math.round(E*1000)/1000),_("זו התוחלת, לא השונות.")),
        W(num(Math.round((E2)*1000)/1000),_("זו E(X²). צריך עוד לחסר ממנה את התוחלת בריבוע.")),
        W(num(Math.round(Math.sqrt(V)*1000)/1000),_("זו סטיית התקן — שורש השונות."))
      ],
      steps:[
        S(_("נוסחת השונות"),_("V(X) = E(X²) − [E(X)]². שימו לב: קודם מרבעים ואז ממצעים, ולא להפך."),
          "V(X) = E(X²) − E(X)²"),
        S(_("מחשבים תוחלת"),"","E(X) = ("+a+" + "+b+") / 2 = "+num(E)),
        S(_("מחשבים E(X²)"),"","E(X²) = ("+(a*a)+" + "+(b*b)+") / 2 = "+num(E2)),
        S(_("מחסרים"),"","V = "+num(E2)+" − "+pn(E)+"² = "+num(Math.round(V*1000)/1000))
      ],rule:"var",hint:_("שונות = תוחלת הריבוע פחות ריבוע התוחלת.")};
  }
  var m=ri(2,8),v=ri(2,6),k=ri(2,5),c=rnz(-6,6);
  return {ask:_f("נתון E(X) = {0} ו-V(X) = {1}. חשבו את השונות של {2}X{3}.", m, v, k, sgn(c)),
    expr:"",ans:W(String(k*k*v)),
    wrong:[
      W(String(k*v),_("הכפלתם ב-k פעם אחת. בשונות המקדם עולה בריבוע, כי השונות עצמה מדודה ביחידות בריבוע.")),
      W(String(k*k*v+c),_("הוספתם את הקבוע. הזזה לא משנה את הפיזור, ולכן היא לא משפיעה על השונות.")),
      W(String(k*m+c),_("זו התוחלת של הביטוי, לא השונות."))
    ],
    steps:[
      S(_("שני כללים"),_("התוחלת לינארית לגמרי. השונות מתעלמת מהזזה ומעלה את המקדם בריבוע."),
        "E(aX+b) = aE(X)+b   ,   V(aX+b) = a²V(X)"),
      S(_("למה הקבוע נעלם"),_("הוספת קבוע מזיזה את כל ההתפלגות, אבל לא משנה כמה היא מפוזרת."),
        "V(X + b) = V(X)"),
      S(_("מציבים"),"","V("+k+"X"+sgn(c)+") = "+k+"²·"+v+" = "+(k*k*v))
    ],rule:"var",hint:_("בשונות: הקבוע נעלם, והמקדם עולה בריבוע.")};
}

/* ---------- 17. התפלגות בינומית ---------- */
function genBinom(L){
  var n,k,den,steps;
  if(L===1){
    n=ri(3,6);k=ri(1,n-1);den=pick([2,3,4]);
    var c=Cnk(n,k);
    var p=fr(c*Math.pow(den-1,n-k),Math.pow(den,n));
    return {ask:_f("מבצעים {0} ניסויים בלתי תלויים, בכל אחד הסתברות הצלחה {1}. מה ההסתברות ל-{2} הצלחות בדיוק?", n, fr(1,den).html(), k),
      expr:"",ans:W(p.html()),
      wrong:[
        W(fr(Math.pow(den-1,n-k),Math.pow(den,n)).html(),_f("שכחתם את מקדם הבחירה. יש {0} סדרים שונים שבהם {1} ההצלחות יכולות להופיע.", c, k)),
        W(fr(c,Math.pow(den,n)).html(),_("התייחסתם לכישלונות כאילו הסתברותם 1.")),
        W(fr(k,n).html(),_("זה היחס בין מספר ההצלחות למספר הניסויים, ולא הסתברות."))
      ],
      steps:[
        S(_("נוסחת ההתפלגות הבינומית"),_("שלושה חלקים: כמה סדרים, ההסתברות להצלחות, וההסתברות לכישלונות."),
          "P(X=k) = C(n,k)·pᵏ·(1−p)ⁿ⁻ᵏ"),
        S(_("מספר הסדרים"),"","C("+n+","+k+") = "+c),
        S(_("הסתברות הרצף"),"",fr(1,den).html()+"<sup>"+k+"</sup> · "+fr(den-1,den).html()+"<sup>"+(n-k)+"</sup>"),
        S(_("מכפילים"),"",p.html())
      ],rule:"binom",hint:_("מקדם בינומי, כפול ההצלחות, כפול הכישלונות.")};
  }
  if(L===2){
    n=ri(10,40);den=pick([2,4,5,10]);
    var E=n/den,V=n*(1/den)*(1-1/den);
    return {ask:_f("משתנה מקרי בינומי עם n = {0} ו-p = {1}. חשבו את התוחלת ואת השונות.", n, fr(1,den).html()),
      expr:"",ans:W("E = "+num(E)+" , V = "+num(Math.round(V*100)/100)),
      wrong:[
        W("E = "+num(E)+" , V = "+num(E),_("בלבלתם בין בינומית לפואסונית. בבינומית השונות היא np(1−p), והיא תמיד קטנה מהתוחלת.")),
        W("E = "+num(n)+" , V = "+num(Math.round(V*100)/100),_("התוחלת היא n כפול p, לא n.")),
        W("E = "+num(Math.round(V*100)/100)+" , V = "+num(E),_("החלפתם בין השניים."))
      ],
      steps:[
        S(_("נוסחאות ההתפלגות הבינומית"),"","E(X) = np   ,   V(X) = np(1−p)"),
        S(_("מציבים בתוחלת"),"","E = "+n+" · "+fr(1,den).html()+" = "+num(E)),
        S(_("מציבים בשונות"),"","V = "+n+" · "+fr(1,den).html()+" · "+fr(den-1,den).html()+" = "+num(Math.round(V*100)/100)),
        S(_("בדיקת סבירות"),_("השונות תמיד קטנה מהתוחלת בבינומית, כי (1−p) קטן מ-1."),"")
      ],rule:"binom",hint:_("E = np, ו-V = np(1−p).")};
  }
  n=ri(3,6);den=pick([2,3,4]);
  var pNone=fr(Math.pow(den-1,n),Math.pow(den,n));
  var pAtLeast=fr(1,1).sub(pNone);
  return {ask:_f("מבצעים {0} ניסויים בלתי תלויים, בכל אחד הסתברות הצלחה {1}. מה ההסתברות שתהיה לפחות הצלחה אחת?", n, fr(1,den).html()),
    expr:"",ans:W(pAtLeast.html()),
    wrong:[
      W(pNone.html(),_("זו ההסתברות לאפס הצלחות. השאלה מבקשת את המשלים שלה.")),
      W(fr(n,den).html(),_("חיברתם הסתברויות. מאורעות ״לפחות אחת״ אינם זרים, ולכן אי אפשר לחבר.")),
      W(fr(1,den).html(),_("זו ההסתברות בניסוי בודד."))
    ],
    steps:[
      S(_("״לפחות אחת״ נפתר דרך המשלים"),_("לספור אחת, שתיים, שלוש הצלחות זו עבודה מיותרת. יש רק מקרה אחד לשלול."),
        _("P(לפחות 1) = 1 − P(אף אחת)")),
      S(_("ההסתברות לאפס הצלחות"),_f("כל {0} הניסויים נכשלים.", n),fr(den-1,den).html()+"<sup>"+n+"</sup> = "+pNone.html()),
      S(_("משלימים ל-1"),"","1 − "+pNone.html()+" = "+pAtLeast.html())
    ],rule:"binom",hint:_("״לפחות אחת״ = 1 פחות ההסתברות לאף אחת.")};
}

/* ---------- 18. התפלגות נורמלית ---------- */
function genNormal(L){
  var mu,sig,x,z,steps;
  if(L===1){
    mu=pick([50,70,80,100,120]);sig=pick([4,5,8,10,15,20]);
    z=pick([-2,-1.5,-1,1,1.5,2,2.5]);
    x=mu+z*sig;
    return {ask:_("תקננו את הערך"),expr:"X ~ N("+mu+" , "+(sig*sig)+")  ,  x = "+num(x),
      ans:W("z = "+num(z)),
      wrong:[
        W("z = "+num(-z),_("טעות סימן. מחסרים את התוחלת מהערך, ולא להפך.")),
        W("z = "+num(Math.round((x-mu)/(sig*sig)*1000)/1000),_("חילקתם בשונות. בתקנון מחלקים בסטיית התקן, שהיא השורש שלה.")),
        W("z = "+num(x-mu),_("עצרתם אחרי החיסור, בלי לחלק בסטיית התקן."))
      ],
      steps:[
        S(_("מה עושה התקנון"),_("הוא מתרגם ״כמה רחוק״ ליחידות של סטיות תקן, וכך אפשר להשוות בין התפלגויות שונות."),
          "z = (x − μ) / σ"),
        S(_("שימו לב לסימון"),_f("N({0} , {1}) — המספר השני הוא השונות, וסטיית התקן היא השורש שלו.", mu, (sig*sig)),
          "σ = √"+(sig*sig)+" = "+sig),
        S(_("מציבים"),"","z = ("+num(x)+" − "+mu+") / "+sig),
        S(_("מחשבים"),"","z = "+num(z))
      ],rule:"znorm",hint:_("מחסרים תוחלת ומחלקים בסטיית תקן — לא בשונות.")};
  }
  if(L===2){
    var zz=pick([0.5,1,1.5,2]);
    var phi={"0.5":0.6915,"1":0.8413,"1.5":0.9332,"2":0.9772}[String(zz)];
    return {ask:_f("נתון Φ({0}) = {1}. חשבו את Φ(−{2}).", zz, phi, zz),expr:"",
      ans:W(num(Math.round((1-phi)*10000)/10000)),
      wrong:[
        W(num(-phi),_("הסתברות לעולם אינה שלילית. הסימטריה עובדת על ההשלמה ל-1, לא על הסימן.")),
        W(num(phi),_("Φ אינה זוגית. הערך בצד השלילי הוא המשלים.")),
        W(num(Math.round((phi-0.5)*10000)/10000),_f("זו ההסתברות בין 0 ל-{0}, ולא Φ(−{1}).", zz, zz))
      ],
      steps:[
        S(_("ההתפלגות סימטרית סביב אפס"),_("השטח משמאל ל-−z שווה בדיוק לשטח מימין ל-z."),"Φ(−z) = 1 − Φ(z)"),
        S(_("מציבים"),"","Φ(−"+zz+") = 1 − "+phi),
        S(_("מחשבים"),"","= "+num(Math.round((1-phi)*10000)/10000))
      ],rule:"znorm",hint:_("Φ(−z) = 1 פחות Φ(z), מתוך הסימטריה.")};
  }
  mu=pick([60,80,100]);sig=pick([5,10,20]);
  z=pick([1,1.5,2,-1,-2]);
  x=mu+z*sig;
  return {ask:_f("בהתפלגות N({0} , {1}), איזה ערך של x מתאים ל-z = {2}?", mu, (sig*sig), num(z)),
    expr:"",ans:W("x = "+num(x)),
    wrong:[
      W("x = "+num(mu-z*sig),_("טעות סימן. מהנוסחה z=(x−μ)/σ נובע x = μ + zσ.")),
      W("x = "+num(mu+z),_("שכחתם להכפיל בסטיית התקן. z נמדד ביחידות של σ.")),
      W("x = "+num(mu+z*sig*sig),_("הכפלתם בשונות במקום בסטיית התקן."))
    ],
    steps:[
      S(_("מבודדים את x"),_("מתחילים מנוסחת התקנון ומעבירים אגפים."),"z = (x−μ)/σ  →  x = μ + z·σ"),
      S(_("מציבים"),"","x = "+mu+" + "+pn(z)+"·"+sig),
      S(_("מחשבים"),"","x = "+num(x))
    ],rule:"znorm",hint:_("x = μ ועוד z כפול σ.")};
}

/* ---------- 19. לוגיקה ---------- */
function genLogic(L){
  var p,q,steps;
  if(L===1){
    p=Math.random()<0.5;q=Math.random()<0.5;
    var op=pick(["∧","∨","⇒"]);
    var res=op==="∧"?(p&&q):op==="∨"?(p||q):(!p||q);
    var TF=function(v){return v?_("אמת"):_("שקר")};
    return {ask:_f("נתון p = {0} ו-q = {1}. מהו ערך האמת של הפסוק?", TF(p), TF(q)),
      expr:"p "+op+" q",ans:W(TF(res)),
      wrong:[
        W(TF(!res),op==="⇒"?_("גרירה שקרית רק במקרה אחד: כשההנחה אמת והמסקנה שקר. בכל שאר המקרים היא אמת.")
          :op==="∧"?_("וגם דורש ששניהם יהיו אמת.")
          :_("או דורש שלפחות אחד יהיה אמת.")),
        W(_("תלוי"),_("ערכי p ו-q נתונים, ולכן לפסוק יש ערך אמת יחיד ומוגדר.")),
        W(_("לא מוגדר"),_("כל צירוף של ערכי אמת מוגדר היטב בטבלת האמת."))
      ],
      steps:[
        S(_("מזכירים את הכלל"),op==="∧"?_("וגם אמת רק כששני הצדדים אמת."):op==="∨"?_("או אמת אם לפחות צד אחד אמת."):_("גרירה שקרית רק כאשר ההנחה אמת והמסקנה שקר."),
          op==="∧"?_("T∧T=T, אחרת F"):op==="∨"?_("F∨F=F, אחרת T"):_("T⇒F=F, אחרת T")),
        S(_("מציבים"),"",TF(p)+" "+op+" "+TF(q)),
        S(_("התוצאה"),"",TF(res))
      ],rule:"logic",hint:_("גרירה שקרית רק כשההנחה אמת והמסקנה שקר.")};
  }
  if(L===2){
    return {ask:_("איזה פסוק שקול לוגית ל-p ⇒ q?"),expr:"p ⇒ q",
      ans:W("¬p ∨ q"),
      wrong:[
        W("p ∨ ¬q",_("זו לא השקילות. בדקו בטבלת אמת: כאשר p שקר ו-q שקר, הפסוק הזה שקר והגרירה אמת.")),
        W("¬q ⇒ ¬p"+"",_("זו אמנם שקילות נכונה — הפסוק המנוגד — אבל השאלה מבקשת את הצורה עם ״או״.")),
        W("q ⇒ p",_("זו הגרירה ההפוכה, והיא אינה שקולה למקורית."))
      ],
      steps:[
        S(_("מתי גרירה שקרית"),_("רק כשההנחה אמת והמסקנה שקר. בכל שאר המקרים היא אמת."),_("p⇒q שקר ⇔ p אמת ו-q שקר")),
        S(_("מנסחים אחרת"),_("״לא קורה ש-p אמת ו-q שקר״ הוא בדיוק ״p שקר או q אמת״."),"¬(p ∧ ¬q) ≡ ¬p ∨ q"),
        S(_("בדיקה בטבלה"),_("ארבע השורות יוצאות זהות בשני הפסוקים."),"p⇒q ≡ ¬p ∨ q")
      ],rule:"logic",hint:_("p⇒q שקול ל-״לא p או q״.")};
  }
  return {ask:_("מהי השלילה של הפסוק p ∧ q?"),expr:"¬(p ∧ q)",
    ans:W("¬p ∨ ¬q"),
    wrong:[
      W("¬p ∧ ¬q",_("שללתם כל צד אבל השארתם ״וגם״. לפי דה־מורגן הקשר מתהפך.")),
      W("p ∨ q",_("לא שללתם את הצדדים כלל.")),
      W("¬(p) ∧ q",_("שללתם רק צד אחד."))
    ],
    steps:[
      S(_("חוקי דה־מורגן"),_("כששוללים, כל צד נשלל וגם הקשר מתהפך: ״וגם״ נעשה ״או״ ולהפך."),
        "¬(p ∧ q) ≡ ¬p ∨ ¬q"),
      S(_("למה זה הגיוני"),_("אם לא נכון ששניהם מתקיימים, אז לפחות אחד מהם אינו מתקיים."),""),
      S(_("התשובה"),"","¬p ∨ ¬q")
    ],rule:"demorgan",hint:_("דה־מורגן: שוללים כל צד והקשר מתהפך.")};
}

/* ---------- 20. קבוצות ---------- */
function genSets(L){
  var A,B,AB,U,steps;
  if(L===1){
    A=ri(10,30);B=ri(10,30);AB=ri(2,Math.min(A,B)-1);
    return {ask:_f("בקבוצה A יש {0} איברים, ב-B יש {1}, ובחיתוך {2}. כמה איברים באיחוד?", A, B, AB),
      expr:"|A ∪ B| = ?",ans:W(String(A+B-AB)),
      wrong:[
        W(String(A+B),_("חיברתם בלי לחסר את החיתוך, ולכן ספרתם את האיברים המשותפים פעמיים.")),
        W(String(A+B+AB),_("הוספתם את החיתוך במקום לחסר אותו.")),
        W(String(AB),_("זה גודל החיתוך, לא האיחוד."))
      ],
      steps:[
        S(_("עקרון ההכלה וההדחה"),_("כשמחברים שתי קבוצות, האיברים המשותפים נספרים פעמיים — ולכן מחסרים אותם פעם אחת."),
          "|A∪B| = |A| + |B| − |A∩B|"),
        S(_("מציבים"),"",A+" + "+B+" − "+AB),
        S(_("מחשבים"),"","= "+(A+B-AB))
      ],rule:"sets",hint:_("מחברים ומחסרים את החיתוך פעם אחת.")};
  }
  if(L===2){
    U=ri(40,80);A=ri(10,U-15);
    return {ask:_f("בקבוצה האוניברסלית {0} איברים ובקבוצה A יש {1}. כמה איברים במשלים של A?", U, A),
      expr:"|A<sup>c</sup>| = ?",ans:W(String(U-A)),
      wrong:[
        W(String(U+A),_("חיברתם. המשלים הוא מה שנשאר, ולכן מחסרים.")),
        W(String(A),_("זו הקבוצה עצמה, לא המשלים.")),
        W(String(U),_("זו הקבוצה האוניברסלית כולה."))
      ],
      steps:[
        S(_("הגדרת המשלים"),_("כל מה שנמצא בקבוצה האוניברסלית ואינו ב-A."),"Aᶜ = U \\ A"),
        S(_("מחשבים"),"",U+" − "+A+" = "+(U-A)),
        S(_("בדיקה"),_("הקבוצה ומשלימה מכסות יחד בדיוק את הכול."),A+" + "+(U-A)+" = "+U)
      ],rule:"sets",hint:_("משלים = הכול פחות הקבוצה.")};
  }
  return {ask:_("מהי הצורה השקולה?"),expr:"(A ∪ B)<sup>c</sup>",
    ans:W("A<sup>c</sup> ∩ B<sup>c</sup>"),
    wrong:[
      W("A<sup>c</sup> ∪ B<sup>c</sup>",_("שמרתם על האיחוד. לפי דה־מורגן לקבוצות, הפעולה מתהפכת.")),
      W("A ∩ B",_("לא לקחתם משלימים בכלל.")),
      W("(A ∩ B)<sup>c</sup>",_("זה המשלים של החיתוך, וזו טענה אחרת."))
    ],
    steps:[
      S(_("דה־מורגן לקבוצות"),_("זהה בדיוק לדה־מורגן בלוגיקה: כל קבוצה מוחלפת במשלימה, והפעולה מתהפכת."),
        "(A∪B)ᶜ = Aᶜ ∩ Bᶜ"),
      S(_("למה"),_("אם איבר אינו באיחוד — הוא לא ב-A וגם לא ב-B."),""),
      S(_("התשובה"),"","Aᶜ ∩ Bᶜ")
    ],rule:"demorgan",hint:_("משלים של איחוד הוא חיתוך המשלימים.")};
}

/* ---------- 21. סדרות וטורים ---------- */
function genSeries(L){
  var a1,q,n,steps;
  if(L===1){
    a1=rnz(1,6);q=pick([2,3,-2,-3]);n=ri(3,6);
    var an=a1*Math.pow(q,n-1);
    return {ask:_f("בסדרה הנדסית a₁ = {0} ו-q = {1}. מהו האיבר ה-{2}?", num(a1), num(q), n),
      expr:"",ans:W(num(an)),
      wrong:[
        W(num(a1*Math.pow(q,n)),_f("השתמשתם ב-n במקום ב-n מינוס 1. מהאיבר הראשון ל-n עושים {0} הכפלות.", (n-1))),
        W(num(a1+(n-1)*q),_("זו נוסחת הסדרה החשבונית. בהנדסית מכפילים, לא מחברים.")),
        W(num(a1*q*n),_("הכפלתם ב-n במקום להעלות בחזקה."))
      ],
      steps:[
        S(_("נוסחת האיבר הכללי"),_("aₙ = a₁·qⁿ⁻¹. שימו לב למינוס אחד בחזקה — הוא מספר ההכפלות, לא מספר האיברים."),
          "aₙ = a₁·qⁿ⁻¹"),
        S(_("מציבים"),"","a"+n+" = "+num(a1)+" · "+pn(q)+"<sup>"+(n-1)+"</sup>"),
        S(_("מחשבים"),"","= "+num(an))
      ],rule:"geo",hint:_("בהנדסית מכפילים במנה, והחזקה היא n מינוס אחת.")};
  }
  if(L===2){
    a1=rnz(1,5);q=pick([2,3]);n=ri(3,6);
    var Sn=a1*(Math.pow(q,n)-1)/(q-1);
    return {ask:_f("חשבו את סכום {0} האיברים הראשונים של סדרה הנדסית עם a₁ = {1} ו-q = {2}.", n, num(a1), q),
      expr:"",ans:W(num(Sn)),
      wrong:[
        W(num(a1*Math.pow(q,n-1)),_f("זה האיבר ה-{0} עצמו, לא הסכום.", n)),
        W(num(a1*n),_("זה היה נכון אילו כל האיברים היו שווים.")),
        W(num(a1*(Math.pow(q,n)-1)),_("שכחתם לחלק ב-(q−1)."))
      ],
      steps:[
        S(_("נוסחת הסכום"),_("Sₙ = a₁·(qⁿ − 1) ÷ (q − 1), תקפה לכל q ששונה מ-1."),"Sₙ = a₁(qⁿ−1)/(q−1)"),
        S(_("מציבים"),"","S"+n+" = "+num(a1)+"·("+q+"<sup>"+n+"</sup> − 1) / ("+q+" − 1)"),
        S(_("מחשבים"),"","= "+num(a1)+"·"+(Math.pow(q,n)-1)+" / "+(q-1)+" = "+num(Sn))
      ],rule:"geosum",hint:_("סכום סדרה הנדסית: a₁ כפול (qⁿ פחות 1) חלקי (q פחות 1).")};
  }
  var den=pick([2,3,4,5]);
  var conv=Math.random()<0.6;
  a1=rnz(1,6);
  var qq=conv?fr(1,den):fr(den,1);
  var ansTxt=conv?fr(a1*den,den-1).html():_("הטור מתבדר");
  return {ask:_("האם הטור ההנדסי האינסופי מתכנס, ואם כן — לכמה?"),
    expr:"a₁ = "+num(a1)+"  ,  q = "+qq.html(),
    ans:W(ansTxt),
    wrong:conv?[
      W(_("הטור מתבדר"),_("מנה שערכה המוחלט קטן מ-1 גורמת לאיברים לדעוך, והטור מתכנס.")),
      W(fr(a1,den-1).html(),_("שכחתם את a₁ במונה או טעיתם בחישוב 1 פחות q.")),
      W(fr(a1*den,den+1).html(),_("במכנה צריך 1 פחות q, ולא 1 ועוד q."))
    ]:[
      W(fr(a1,1-den===0?1:1-den).html(),_("הצבתם בנוסחת הסכום בלי לבדוק את תנאי ההתכנסות. עם q גדול מ-1 היא לא תקפה.")),
      W(num(a1),_("זה האיבר הראשון בלבד.")),
      W("0",_("האיברים גדלים ולא דועכים."))
    ],
    steps:[
      S(_("קודם בודקים התכנסות"),_("טור הנדסי אינסופי מתכנס אם ורק אם הערך המוחלט של המנה קטן מ-1."),
        _("|q| < 1 ⇔ מתכנס")),
      S(_("כאן"),"","|q| = "+qq.html()+" → "+(conv?_("קטן מ-1, מתכנס"):_("גדול מ-1, מתבדר"))),
      S(conv?_("מציבים בנוסחת הסכום"):_("אין סכום סופי"),
        conv?"S = a₁ / (1 − q)":_("האיברים גדלים ללא גבול, ולכן אין ערך סופי."),
        conv?"S = "+num(a1)+" / (1 − "+qq.html()+") = "+ansTxt:_("מתבדר"))
    ],rule:"geoinf",hint:_("טור אינסופי מתכנס רק כשהערך המוחלט של המנה קטן מ-1.")};
}

/* ---------- 22. לוגריתמים ---------- */
function genLogs(L){
  var b,n,steps;
  if(L===1){
    b=pick([2,3,5,10]);n=ri(2,5);
    var val=Math.pow(b,n);
    return {ask:_("חשבו"),expr:"log<sub>"+b+"</sub> "+val,ans:W(String(n)),
      wrong:[
        W(String(val/b),_("זה המספר חלקי הבסיס. לוגריתם שואל באיזו חזקה, ולא כמה פעמים.")),
        W(String(b*n),_("הכפלתם את הבסיס במעריך.")),
        W(String(val),_("זה המספר עצמו."))
      ],
      steps:[
        S(_("מה לוגריתם שואל"),_f("באיזו חזקה צריך להעלות את {0} כדי לקבל {1}?", b, val),"log_b(x) = y ⇔ bʸ = x"),
        S(_("בודקים"),"",b+"<sup>"+n+"</sup> = "+val),
        S(_("התשובה"),"",String(n))
      ],rule:"log",hint:_("לוגריתם הוא החזקה שאליה מעלים את הבסיס.")};
  }
  if(L===2){
    b=pick([2,3,10]);var u=ri(2,6),v=ri(2,6);
    var lg="log<sub>"+b+"</sub>";
    return {ask:_f("נתון {0}(a) = {1} ו-{2}(c) = {3}. חשבו את {4}(a·c).", lg, u, lg, v, lg),
      expr:"",ans:W(String(u+v)),
      wrong:[
        W(String(u*v),_("הכפלתם את הלוגריתמים. לוג של מכפלה הוא סכום הלוגים, לא מכפלתם.")),
        W(num(u-v),_("חיסור מתאים ללוג של מנה, לא של מכפלה.")),
        W(String(Math.pow(u,v)),_("העלאה בחזקה מתאימה ללוג של חזקה."))
      ],
      steps:[
        S(_("חוק הלוג של מכפלה"),_("הלוגריתם מתרגם כפל לחיבור — זו כל התועלת שלו."),"log(a·c) = log a + log c"),
        S(_("מציבים"),"",u+" + "+v),
        S(_("מחשבים"),"","= "+(u+v))
      ],rule:"logrules",hint:_("לוג של מכפלה = סכום הלוגים. של מנה = הפרש.")};
  }
  b=pick([2,3,5]);n=ri(2,5);
  var target=Math.pow(b,n);
  return {ask:_("פתרו את המשוואה"),expr:b+"<sup>x</sup> = "+target,
    ans:W("x = "+n),
    wrong:[
      W("x = "+num(target/b),_("חילקתם בבסיס. משוואה מעריכית נפתרת בלוגריתם, לא בחילוק.")),
      W("x = "+num(target-b),_("חיסרתם.")),
      W("x = "+num(Math.round(target/n*100)/100),_("חילקתם במעריך."))
    ],
    steps:[
      S(_("הנעלם נמצא בחזקה"),_("כשהנעלם במעריך, הכלי הוא לוגריתם — הוא הפעולה ההפוכה להעלאה בחזקה."),
        b+"ˣ = "+target),
      S(_("מפעילים לוג על שני האגפים"),"","x = log<sub>"+b+"</sub>("+target+")"),
      S(_("מחשבים"),"",b+"<sup>"+n+"</sup> = "+target+"  →  x = "+n)
    ],rule:"log",hint:_("נעלם בחזקה — מפעילים לוגריתם על שני האגפים.")};
}

/* ---------- 23. מספרים מרוכבים ---------- */
function genComplex(L){
  var a,b,c,d,steps;
  function cx(re,im){
    if(im===0)return num(re);
    if(re===0)return (im===1?"":im===-1?"−":num(im))+"i";
    return num(re)+(im<0?" − ":" + ")+(Math.abs(im)===1?"":Math.abs(im))+"i";
  }
  if(L===1){
    a=rnz(-6,6);b=rnz(-6,6);c=rnz(-6,6);d=rnz(-6,6);
    return {ask:_("חשבו את הסכום"),expr:"("+cx(a,b)+") + ("+cx(c,d)+")",
      ans:W(cx(a+c,b+d)),
      wrong:[
        W(cx(a+c+b+d,0),_("חיברתם הכול יחד. החלק הממשי והחלק המדומה נשארים נפרדים.")),
        W(cx(a+d,b+c),_("החלפתם בין החלקים.")),
        W(cx(a*c,b*d),_("הכפלתם במקום לחבר."))
      ],
      steps:[
        S(_("מחברים חלק ממשי עם ממשי"),_("i הוא כמו משתנה — מחברים רק איברים דומים."),"(a+bi)+(c+di) = (a+c)+(b+d)i"),
        S(_("החלק הממשי"),"",num(a)+" + "+pn(c)+" = "+num(a+c)),
        S(_("החלק המדומה"),"",num(b)+" + "+pn(d)+" = "+num(b+d)),
        S(_("התוצאה"),"",cx(a+c,b+d))
      ],rule:"cxadd",hint:_("ממשי עם ממשי, מדומה עם מדומה.")};
  }
  if(L===2){
    a=rnz(-5,5);b=rnz(-5,5);c=rnz(-5,5);d=rnz(-5,5);
    var re=a*c-b*d,im=a*d+b*c;
    return {ask:_("חשבו את המכפלה"),expr:"("+cx(a,b)+")("+cx(c,d)+")",
      ans:W(cx(re,im)),
      wrong:[
        W(cx(a*c+b*d,im),_("שכחתם ש-i בריבוע שווה מינוס אחת. bd·i² הופך ל-−bd, ולכן מחסרים.")),
        W(cx(a*c,b*d),_("הכפלתם חלק בחלק. צריך לפתוח סוגריים במלואם, ארבע מכפלות.")),
        W(cx(re,a*c+b*d),_("החלק המדומה מורכב מ-ad ועוד bc."))
      ],
      steps:[
        S(_("פותחים סוגריים כרגיל"),_("ארבע מכפלות, בדיוק כמו במכפלת בינומים."),
          "ac + adi + bci + bd·i²"),
        S(_("כאן נכנס הכלל היחיד שצריך לזכור"),_("i בריבוע שווה מינוס אחת, ולכן האיבר האחרון משנה סימן."),
          "i² = −1  →  bd·i² = −bd"),
        S(_("מכנסים"),"","("+num(a*c)+" − "+pn(b*d)+") + ("+num(a*d)+" + "+pn(b*c)+")i"),
        S(_("התוצאה"),"",cx(re,im))
      ],rule:"cxmul",hint:_("פותחים סוגריים כרגיל, וזוכרים ש-i בריבוע הוא מינוס אחת.")};
  }
  var TRIP2=[[3,4,5],[6,8,10],[5,12,13],[8,15,17]];
  var t=pick(TRIP2);
  a=t[0]*pick([1,-1]);b=t[1]*pick([1,-1]);
  return {ask:_("חשבו את הערך המוחלט"),expr:"|"+cx(a,b)+"|",
    ans:W(String(t[2])),
    wrong:[
      W(num(Math.abs(a)+Math.abs(b)),_("חיברתם את החלקים. הערך המוחלט מחושב לפי פיתגורס.")),
      W(num(t[2]*t[2]),_("עצרתם לפני הוצאת השורש.")),
      W(num(a),_("זה החלק הממשי בלבד."))
    ],
    steps:[
      S(_("הערך המוחלט הוא מרחק"),_("במישור המרוכב זהו המרחק מהראשית, כלומר בדיוק פיתגורס."),
        "|a+bi| = √(a² + b²)"),
      S(_("מציבים"),"","√("+pn(a)+"² + "+pn(b)+"²) = √("+(a*a)+" + "+(b*b)+")"),
      S(_("מחשבים"),"","√"+(t[2]*t[2])+" = "+t[2])
    ],rule:"cxabs",hint:_("ערך מוחלט של מרוכב = שורש של סכום ריבועי החלקים.")};
}

/* טבלאות הנתונים נבנות פעם אחת בטעינה, ולכן תרגום שנקרא בתוכן היה
   נקפא בשפה שהייתה פעילה באותו רגע. השדות המוצגים הופכים לגטרים:
   הערך העברי נשמר, והתרגום נקרא ברגע הקריאה ולא ברגע הבנייה. */
function lazyTr(obj,fields){
  fields.forEach(function(k){
    var raw=obj[k];
    if(typeof raw!=="string")return;
    Object.defineProperty(obj,k,{enumerable:true,configurable:true,
      get:function(){return _(raw)}});
  });
}

/* ============================================================
   12. בניית שאלה
   מנרמל את מה שהמחולל החזיר: מסנן מסיחים כפולים או פגומים,
   מערבב, ומכין גם טקסט להקראה.
   ============================================================ */
function badStr(s){return !s||/NaN|Infinity|undefined|null/.test(s)}

function buildQ(topicId,level){
  var t=topicById(topicId);
  if(!t)t=TOPICS[0];
  var raw=null,tries=0,opts,i,p,seen,ansP;
  while(tries<8){
    tries++;
    try{raw=t.gen(level)}catch(e){raw=null}
    if(!raw||!raw.ans||badStr(plainOf(raw.ans.h)))continue;
    ansP=plainOf(raw.ans.h);
    seen={};seen[ansP]=1;
    opts=[{h:raw.ans.h,t:ansP,ok:true,why:""}];
    for(i=0;i<(raw.wrong||[]).length;i++){
      p=plainOf(raw.wrong[i].h);
      if(badStr(p)||seen[p])continue;
      seen[p]=1;
      opts.push({h:raw.wrong[i].h,t:p,ok:false,why:raw.wrong[i].why||""});
    }
    if(opts.length>=3)break;
  }
  if(!raw)raw={ask:_("חשבו"),expr:"1 + 1",ans:W("2"),wrong:[W("1"),W("3"),W("11")],steps:[S(_("חיבור"),"","1 + 1 = 2")],hint:"",rule:"order"};
  if(!opts||opts.length<2){
    ansP=plainOf(raw.ans.h);
    opts=[{h:raw.ans.h,t:ansP,ok:true,why:""}];
  }
  shuffle(opts);
  var sayTxt=raw.ask+(raw.expr?". "+speakMath(plainOf(raw.expr)):"");
  return {
    topic:t.id,topicName:t.name,level:level,
    ask:raw.ask,expr:raw.expr||"",fig:raw.fig||"",
    options:opts,steps:raw.steps||[],hint:raw.hint||"",rule:raw.rule||"",
    say:sayTxt
  };
}

var P={list:[],i:0,q:null,phase:"ask",picked:[],hints:0,steps:0,usedHelp:false,results:[],startedAt:0};

function mastery(id){
  var m=state.mastery[id];
  if(!m){m={seen:0,ok:0,help:0,m:0};state.mastery[id]=m}
  return m;
}
function activeTopics(){
  var chosen=state.topics.filter(function(id){return !!topicById(id)});
  if(chosen.length)return chosen;
  return topicsForTrack(state.track).map(function(t){return t.id});
}
/* בחירת הנושא הבא: מי שחלש יותר מקבל יותר תורות, ומדי כמה
   שאלות חוזר נושא שנפלו בו קודם. ככה החזרה קורית לבד. */
function nextTopic(idx){
  var pool=activeTopics();
  if(idx>0&&idx%3===2&&state.wrongBank.length){
    var w=state.wrongBank[state.wrongBank.length-1-Math.floor(Math.random()*Math.min(5,state.wrongBank.length))];
    if(w&&pool.indexOf(w.topic)>=0)return w.topic;
  }
  var weights=pool.map(function(id){return 110-mastery(id).m}),total=0,i;
  for(i=0;i<weights.length;i++)total+=weights[i];
  var r=Math.random()*total;
  for(i=0;i<pool.length;i++){r-=weights[i];if(r<=0)return pool[i]}
  return pool[pool.length-1];
}
function startRound(forceTopic){
  var n=state.settings.roundLen,i;
  P.list=[];
  for(i=0;i<n;i++)P.list.push(forceTopic||nextTopic(i));
  P.i=0;P.results=[];P.startedAt=Date.now();
  loadQ();
}
function loadQ(){
  P.q=buildQ(P.list[P.i],state.level);
  P.phase="ask";P.picked=[];P.hints=0;P.steps=0;P.usedHelp=false;
  if(state.settings.autoSteps)P.steps=1;
}
function roundDone(){return P.i>=P.list.length}

/* השליטה בנושא נמדדת כממוצע נע של הביצועים האחרונים, ולא
   כמונה שמטפס לאט. תלמיד שענה נכון צריך לראות מספר שמשקף
   את זה מיד — אחרת המדד מתסכל במקום לעזור. */
function scoreAnswer(ok){
  var m=mastery(P.q.topic),d=dayRec(),score;
  m.seen++;d.a++;state.stats.answered++;
  touchDay();
  if(ok&&!P.usedHelp&&P.picked.length===1){
    m.ok++;d.c++;state.stats.correct++;state.stats.xp+=10;
    score=1;P.results.push("ok");
  }else if(ok&&!P.usedHelp){
    m.ok++;d.c++;state.stats.correct++;state.stats.xp+=4;
    score=0.7;P.results.push("ok");
  }else if(P.usedHelp){
    m.help++;state.stats.helped++;state.stats.xp+=2;
    score=0.35;P.results.push("hp");
  }else{
    score=0;P.results.push("no");
  }
  m.m=m.seen===1?Math.round(score*100):Math.round(m.m*0.6+score*40);
  if(!ok||P.usedHelp){
    state.wrongBank.push({topic:P.q.topic,ts:Date.now()});
    if(state.wrongBank.length>40)state.wrongBank.shift();
  }
  save();
}

     (wt?'<button class="btn btn-g w" style="margin-top:9px" data-a="starttopic" data-t="'+wt.id+'">'+
_f("{0} תרגול ממוקד: {1}</button>", ic("target",17), wt.name):"")+
     '</div>';
  if(wt&&mastery(wt.id).seen){

_f("{0}{1} עדיין תופס. הרבה פעמים זה לא הנושא עצמו אלא מה שמתחתיו — כאן זה {2}. שווה לתרגל אותו קודם.</p>", '<p class="sub sm">'+_('נראה ש-'), wt.name, pre.name)+
_f("{0}{1}{2}{3} לתרגל {4}</button></div>", '<button class="btn btn-g" style="margin-top:10px" data-a="starttopic" data-t="', pre.id, '">', ic("arrow",16), pre.name);
    }
  }
  var byNeed=pool.slice().sort(function(a,b){
    var ma=mastery(a),mb=mastery(b);
    if(!ma.seen&&!mb.seen)return 0;
    if(!ma.seen)return 1;
    if(!mb.seen)return -1;
    return ma.m-mb.m;
  }).slice(0,6);
  h+='<h2 class="h2" style="margin-top:26px">'+_('מה כדאי לתרגל עכשיו')+'</h2>'+
     '<p class="sub sm">'+_('שישה נושאים לפי מה שעדיין לא יושב. לחיצה פותחת תרגול ממוקד.')+'</p>'+
     '<div class="grid g3" style="margin-top:12px">'+
     byNeed.map(function(id){

         '<span class="tn">'+tp.name+'</span><span class="td">'+tp.desc+'</span>'+masteryBar(id)+'</button>';
     }).join("")+'</div>';
  h+=_f("{0}{1} כל {2} הנושאים</button>", '<div class="row" style="margin-top:20px"><button class="btn btn-g" data-a="go" data-v="topics">', ic("list",17), pool.length)+
_f("{0}{1} דף נוסחאות</button></div>", '<button class="btn btn-g" data-a="go" data-v="formulas">', ic("book",17));
  return h+'</main>';
}
/* ---------- תרגול ---------- */
/* מצב הקול חייב להיות במסך התרגול עצמו. הודעה שמסבירה למה
   הקול לא מה שביקשת חסרת ערך אם היא מוסתרת בהגדרות. */
function voiceStrip(){
  var s=state.settings;
  if(!s.tts)return "";
  if(s.engine==="gemini"&&hasKey()&&ttsState!=="err"){
    if(ttsState!=="ok")return "";      /* עוד לא הושמע דבר — אין מה להודיע */
    return _f("{0}{1}<span>קול טבעי · {2}</span>", '<div class="vstrip ok">', ic("speaker",15), gvName(s.gvoice).t)+
      '<button class="btn btn-g" data-a="go" data-v="settings">'+_('להחליף')+'</button></div>';
  }
  if(ttsState==="err")
    return _f("{0}{1}<span>הקול הטבעי לא הגיב, ההקראה עברה לקול המכשיר</span>", '<div class="vstrip bad">', ic("speaker",15))+
      '<button class="btn btn-g" data-a="go" data-v="settings">'+_('לבדוק')+'</button></div>';
  return _f("{0}{1}<span>ההקראה בקול המכשיר. יש קול טבעי שנשמע כמו אדם</span>", '<div class="vstrip warn">', ic("speaker",15))+
    '<button class="btn btn-g" data-a="go" data-v="settings">'+_('להפעיל')+'</button></div>';
}
function viewPractice(){
  if(!P.q)startRound();
  if(P.phase==="done")return viewSummary();
  var q=P.q,calm=state.settings.calm;
  var h='<main id="main" class="wrap" style="padding-top:18px;padding-bottom:44px">';
  /* שורת מצב */
  h+='<div class="spread">'+
      '<div class="row"><span class="chip area '+topicCls(q.topic)+'">'+q.topicName+'</span>'+
_f("{0}{1} מתוך {2}</span></div>", '<span class="chip">'+_('שאלה')+' ', (P.i+1), P.list.length)+
      '<div class="row"><span class="dots">'+
        P.list.map(function(ignored,i){
          var c=i<P.results.length?(P.results[i]==="ok"?"ok":P.results[i]==="hp"?"hp":"no"):"";
          return '<span class="dot '+c+'"></span>';
        }).join("")+'</span>'+
_f("{0}{1} עצירה</button></div>", '<button class="btn btn-g" style="padding:8px 12px;font-size:.85rem" data-a="stop">', ic("pause",15))+
     '</div>';
  h+=voiceStrip();
  h+='<div class="grid" style="grid-template-columns:minmax(0,1fr);margin-top:14px">';
  /* כרטיס השאלה */
  h+='<div class="card pad rise '+topicCls(q.topic)+'" style="border-top:3px solid var(--c)">';
  h+='<p style="font-size:clamp(1rem,3.6vw,1.15rem);font-weight:600">'+q.ask+'</p>';
  if(q.expr)h+='<p class="mline" style="margin-top:14px">'+q.expr+'</p>';
  if(q.fig)h+=q.fig;
  /* כפתורי עזר */
  h+='<div class="row" style="margin-top:16px;gap:8px">'+
     (state.settings.tts?_f("{0}{1} הקראה</button>", '<button class="btn btn-g" style="padding:9px 13px;font-size:.88rem" data-a="read">', ic("speaker",16)):"")+
_f("{0}{1}>{2} רמז</button>", '<button class="btn btn-g" style="padding:9px 13px;font-size:.88rem" data-a="hint"', (P.hints>0?" disabled":""), ic("bulb",16))+
_f("{0}{1}>{2} פתרון מודרך</button>", '<button class="btn btn-g" style="padding:9px 13px;font-size:.88rem" data-a="guide"', (P.steps>0?" disabled":""), ic("steps",16))+
     (q.rule?_f("{0}{1}{2}{3} הנוסחה</button>", '<button class="btn btn-g" style="padding:9px 13px;font-size:.88rem" data-a="rule" data-r="', q.rule, '">', ic("book",16)):"")+
     '</div>';
  if(P.hints>0&&q.hint)h+='<div class="hintbox rise"><b>'+_('רמז')+'</b><div class="sm hintxt" style="margin-top:3px">'+q.hint+'</div></div>';
  /* תשובות */
  var keys=["1","2","3","4"];
  h+='<div class="opts">'+q.options.map(function(o,i){
    var cls="opt",dis="";
    var wasPicked=P.picked.indexOf(i)>=0;
    if(P.phase==="reveal"){
      dis=" disabled";
      if(o.ok)cls+=" right";
      else if(wasPicked)cls+=calm?" gone":" wrong";
      else cls+=" dim";
    }else if(wasPicked){cls+=calm?" gone":" wrong";dis=" disabled"}
    return '<button class="'+cls+'"'+dis+' data-a="ans" data-i="'+i+'">'+
      '<span class="k">'+keys[i]+'</span><span class="m">'+o.h+'</span></button>';
  }).join("")+'</div>';
  /* אבחון הטעות האחרונה */
  if(P.lastWhy&&P.phase!=="reveal"){
    h+='<div class="diag rise"><b>'+_('מה קרה כאן')+'</b><div class="sm" style="margin-top:3px">'+P.lastWhy+'</div></div>';
  }
  h+='</div>';
  /* פתרון מודרך */
  if(P.steps>0||P.phase==="reveal"){
    var showAll=P.phase==="reveal";
    var shown=showAll?q.steps.length:Math.min(P.steps,q.steps.length);
    h+=_f("{0}{1}{2}{3} הפתרון, צעד אחר צעד</div>", '<div class="card pad rise ', topicCls(q.topic), '"><div class="spread"><div class="h2" style="color:var(--c)">', ic("steps",18))+
       (state.settings.tts?_f("{0}{1} הקראה</button>", '<button class="btn btn-g" style="padding:8px 12px;font-size:.85rem" data-a="readsteps">', ic("speaker",15)):"")+'</div>';
    h+='<div class="steps">'+q.steps.map(function(s,i){
      if(i>=shown)return "";
      return '<div class="step'+(i===q.steps.length-1?" last":"")+'"><div class="st"><span class="num">'+(i+1)+'</span>'+s.t+'</div>'+
        (s.d?'<div class="sd">'+s.d+'</div>':"")+
        (s.m?'<div class="mstep">'+s.m+'</div>':"")+'</div>';
    }).join("")+'</div>';
    if(!showAll&&shown<q.steps.length){
      h+='<button class="btn btn-p w" style="margin-top:12px" data-a="nextstep">'+_('הצעד הבא')+' '+ic("arrow",17)+'</button>';
      h+='<p class="sub xs" style="text-align:center;margin-top:8px">'+_('אפשר לעצור בכל שלב ולנסות להמשיך לבד.')+'</p>';
    }
    h+='</div>';
  }
  /* פס תחתון אחרי מענה */
  if(P.phase==="reveal"){
    var kind=P.results[P.results.length-1];
    h+='<div class="card pad rise" style="border-inline-start:4px solid var(--'+(kind==="ok"?"ok":kind==="hp"?"accent":"bad")+')">'+
       '<div class="row">'+ic(kind==="ok"?"check":"bulb",19)+'<b>'+lineFor(kind)+'</b></div>'+
       '<button class="btn btn-p w" style="margin-top:12px;padding:14px" data-a="next">'+
         (P.i+1>=P.list.length?_("לסיכום הסבב"):_("לשאלה הבאה"))+' '+ic("arrow",18)+'</button>'+
       (state.settings.keys?'<p class="sub xs" style="text-align:center;margin-top:8px">'+_('אפשר גם ללחוץ Enter')+'</p>':"")+
       '</div>';
  }
  h+='</div>';
  if(state.settings.keys&&P.phase==="ask")
    h+='<p class="sub xs" style="margin-top:14px;text-align:center">'+_('מקלדת: 1–4 תשובה · רווח הקראה · H רמז · S פתרון')+'</p>';
  return h+'</main>';
}

/* ---------- סיכום סבב ---------- */
function viewSummary(){
  var ok=P.results.filter(function(r){return r==="ok"}).length;
  var hp=P.results.filter(function(r){return r==="hp"}).length;
  var no=P.results.length-ok-hp;
  var pct=Math.round(ok/Math.max(1,P.results.length)*100);
  var byTopic={},i;
  for(i=0;i<P.list.length&&i<P.results.length;i++){
    var id=P.list[i];
    if(!byTopic[id])byTopic[id]={ok:0,n:0};
    byTopic[id].n++;if(P.results[i]==="ok")byTopic[id].ok++;
  }
  var worst=null;
  for(var k in byTopic)if(byTopic[k].n>=2&&(!worst||byTopic[k].ok/byTopic[k].n<byTopic[worst].ok/byTopic[worst].n))worst=k;
  var title=pct>=85?_("סבב חזק."):pct>=60?_("סבב טוב."):pct>=35?_("סבב עם עבודה."):_("סבב קשה — וזה בסדר.");
  var sub=pct>=85?_("אתם שולטים ברוב מה שתרגלתם כאן.")
       :pct>=60?_("רוב הדברים במקום. יש נקודה אחת או שתיים שכדאי לחדד.")
       :pct>=35?_("חלק מהחומר עוד לא יושב. זה בדיוק מה שמדידה כזאת נועדה להראות.")
       :_("סבב כזה לא אומר עליכם כלום חוץ מזה שהחומר הזה חדש. שווה לרדת רמה ולבנות מלמטה.");
  var h='<main id="main" class="wrap" style="padding-top:26px;padding-bottom:44px;max-width:760px">';
  h+='<div class="card pad rise"><h1 class="h1">'+title+'</h1><p class="sub">'+sub+'</p>'+
     '<div class="grid g4" style="margin-top:18px">'+
_f("{0}{1}</b><span>נכון לבד</span></div>", '<div class="tile" style="--c:var(--ok)"><b>', ok)+
_f("{0}{1}</b><span>עם פתרון מודרך</span></div>", '<div class="tile" style="--c:var(--c-alg)"><b>', hp)+
_f("{0}{1}</b><span>לא נפתרו</span></div>", '<div class="tile" style="--c:var(--bad)"><b>', no)+
_f("{0}{1}%</b><span>דיוק</span></div>", '<div class="tile" style="--c:var(--c-geo)"><b>', pct)+
     '</div>';
  h+='<hr class="sep"><div class="h2">'+_('לפי נושא')+'</div><div class="grid" style="margin-top:10px">'+
     Object.keys(byTopic).map(function(id){
       var b=byTopic[id],tp=topicById(id);
       return '<div class="spread '+topicCls(id)+'" style="gap:8px"><span class="arh">'+tp.name+'</span>'+
_f("{0}{1}{2}{3} מתוך {4}</span></div>", '<span class="chip ', (b.ok===b.n?"ok":b.ok===0?"bad":"warn"), '">', b.ok, b.n);
     }).join("")+'</div>';
  if(worst&&byTopic[worst].ok<byTopic[worst].n){
    var wt=topicById(worst);
    h+='<div class="card pad" style="margin-top:16px;background:var(--surface2)">'+
_f("{0}{1}<b>מה לקחת מכאן</b></div>", '<div class="row">', ic("target",17))+
_f("{0}{1} היה הנושא שהכי הפריע בסבב הזה. סבב ממוקד אחד בו יעשה יותר מעוד עשר שאלות מעורבות.</p>", '<p class="sub sm">', wt.name)+
_f("{0}{1}{2}{3} סבב ממוקד ב{4}</button></div>", '<button class="btn btn-p" style="margin-top:10px" data-a="starttopic" data-t="', worst, '">', ic("pencil",16), wt.name);
  }
  h+='<div class="row" style="margin-top:18px">'+
_f("{0}{1} סבב נוסף</button>", '<button class="btn btn-p" data-a="start">', ic("refresh",17))+
_f("{0}{1} לדף הבית</button>", '<button class="btn btn-g" data-a="go" data-v="home">', ic("home",17))+
_f("{0}{1} להתקדמות</button></div>", '<button class="btn btn-g" data-a="go" data-v="progress">', ic("chart",17));
  return h+'</div></main>';
}

/* ---------- התקדמות ---------- */
function viewProgress(){
  var st=state.stats;
  var acc=st.answered?Math.round(st.correct/st.answered*100):0;
  var days=[],i,d=new Date();
  for(i=13;i>=0;i--){
    var dd=new Date(d.getTime()-i*86400000);
    var key=dd.getFullYear()+"-"+String(dd.getMonth()+1).padStart(2,"0")+"-"+String(dd.getDate()).padStart(2,"0");
    days.push({k:key,r:state.days[key]||{a:0,c:0},lbl:_("אבגדהוש").charAt(dd.getDay())});
  }
  var maxA=Math.max.apply(null,days.map(function(x){return x.r.a}).concat([1]));
  var seen=TOPICS.filter(function(t){return mastery(t.id).seen>0});
  var h='<main id="main" class="wrap" style="padding-top:22px;padding-bottom:44px">';
  h+='<h1 class="h1">'+_('התקדמות')+'</h1><p class="sub">'+_('המספרים כאן הם כלי עבודה, לא ציון.')+'</p>';
  h+='<div class="grid g4" style="margin-top:16px">'+
_f("{0}{1}</b><span>שאלות שנפתרו</span></div>", '<div class="tile" style="--c:var(--c-base)"><b>', st.answered)+
_f("{0}{1}%</b><span>דיוק כולל</span></div>", '<div class="tile" style="--c:var(--ok)"><b>', acc)+
_f("{0}{1}</b><span>עם פתרון מודרך</span></div>", '<div class="tile" style="--c:var(--c-alg)"><b>', st.helped)+
_f("{0}{1}</b><span>נקודות</span></div></div>", '<div class="tile" style="--c:var(--c-geo)"><b>', st.xp);
  h+='<div class="card pad" style="margin-top:16px"><div class="h2">'+_('שבועיים אחרונים')+'</div>'+
     '<div style="display:flex;gap:5px;align-items:flex-end;height:120px;margin-top:14px;direction:ltr">'+
     days.map(function(x){

/* ============================================================
   18. מבחן כיתתי — פרסום בוואטסאפ, קבלת תשובות וציונים
   ------------------------------------------------------------
   אין שרת, ואין כוונה שיהיה. לכן המבחן אינו נשלח לשום מקום:
   הוא *נארז לתוך הקישור*. המורה מקבל קישור, שולח אותו בוואטסאפ,
   והמכשיר של התלמיד בונה מהקישור בדיוק את אותן שאלות.

   מה שהופך את זה לאפשרי הוא שכל מחולל שאלות כאן משתמש ב-
   Math.random בלבד. אם מזרעים אותו, אותו זרע מייצר את אותן
   שאלות ואת אותו סדר תשובות — אצל המורה ואצל התלמיד. הקישור
   נושא זרע ורשימת נושאים, לא עשרים שאלות מלאות, ולכן הוא נשאר
   קצר מספיק לוואטסאפ.

   שלוש מגבלות שנאמרות כאן במפורש כי הן חלק מהתכנון:
   · אין איסוף אוטומטי. התלמיד שולח קוד תשובות בוואטסאפ, והמורה
     מדביק אותו. זה המחיר של אפס שרת ואפס עלות.
   · אפשר לזייף קוד. הציון מחושב מחדש אצל המורה מתוך התשובות
     ולא נלקח מהתלמיד, אבל אין כאן הגנה קריפטוגרפית — זה מבחן
     כיתתי מעצב, לא בגרות.
   · שמות התלמידים נשארים במכשיר של המורה. הם לא עוברים דרך
     שום שרת, כי אין שרת.
   ============================================================ */
var GENV=1;                 /* גרסת המחוללים. מבחן שנוצר בגרסה אחרת
                               אינו נפתח — עדיף הודעה ברורה מאשר
                               עשרים שאלות אחרות בשקט. */
var EKEY="shlav-exams-v1";

/* --- מחולל מזורע. mulberry32: קצר, מהיר, ופיזור טוב דיו --- */
function withSeed(seed,fn){
  var real=Math.random,s=(seed>>>0)||1;
  Math.random=function(){
    s|=0; s=s+0x6D2B79F5|0;
    var t=Math.imul(s^s>>>15,1|s);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
  try{return fn()}finally{Math.random=real}
}
function hash32(str){
  var h=0x811c9dc5,i;
  for(i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193)}
  return (h>>>0);
}
/* base64url. הניקוי בפענוח אינו קוסמטי: וואטסאפ שובר מחרוזות
   ארוכות בשורות, ורווח אחד הורס את כל הקוד. */
function b64e(str){
  var bytes=new TextEncoder().encode(str),bin="",i;
  for(i=0;i<bytes.length;i+=8192)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));
  return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function b64d(s){
  s=String(s||"").replace(/[^A-Za-z0-9\-_]/g,"").replace(/-/g,"+").replace(/_/g,"/");
  while(s.length%4)s+="=";
  var bin=atob(s),bytes=new Uint8Array(bin.length),i;
  for(i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function examId(spec){return hash32(spec.s+"|"+spec.q.map(function(x){return x[0]+x[1]}).join(",")).toString(36)}
function encodeExam(spec){return b64e(JSON.stringify(spec))}
function decodeExam(code){
  try{
    var o=JSON.parse(b64d(code));
    if(!o||!o.q||!o.q.length||typeof o.s!=="number")return null;
    o.q=o.q.filter(function(x){return topicById(x[0])});
    return o.q.length?o:null;
  }catch(e){return null}
}
/* בונה את שאלות המבחן. אותו זרע → אותן שאלות, גם אצל המורה
   כשהוא בודק וגם אצל התלמיד כשהוא נבחן. */
function examQuestions(spec){
  return withSeed(spec.s,function(){
    return spec.q.map(function(pair){return buildQ(pair[0],pair[1])});
  });
}
function examUrl(spec){
  var base=location.origin+location.pathname;
  return base+"#x="+encodeExam(spec);
}
function waLink(text,phone){
  var p=String(phone||"").replace(/[^0-9]/g,"");
  return "https://wa.me/"+p+"?text="+encodeURIComponent(text);
}

/* --- אחסון מבחנים והגשות, בנפרד מהתקדמות התלמיד --- */
var EX={list:[]};
function exLoad(){
  try{var r=localStorage.getItem(EKEY);if(r){var o=JSON.parse(r);if(o&&o.list)EX=o}}catch(e){}
  if(!EX.list)EX.list=[];
}
function exSave(){try{localStorage.setItem(EKEY,JSON.stringify(EX))}catch(e){}}
function exFind(id){for(var i=0;i<EX.list.length;i++)if(EX.list[i].id===id)return EX.list[i];return null}

/* --- קוד ההגשה של התלמיד --- */
function encodeResult(id,name,answers){
  var body={i:id,n:String(name||"").slice(0,40),a:answers,d:todayIso()};
  body.c=hash32(JSON.stringify([body.i,body.n,body.a])).toString(36);
  return b64e(JSON.stringify(body));
}
function decodeResult(code){
  try{
    var o=JSON.parse(b64d(code));
    if(!o||!o.i||!o.a||!o.a.length)return null;
    o.ok=(o.c===hash32(JSON.stringify([o.i,o.n,o.a])).toString(36));
    return o;
  }catch(e){return null}
}
/* הציון מחושב כאן מחדש מתוך התשובות. מה שהתלמיד שלח הוא מה
   שסימן, לא כמה הוא קיבל. */
function gradeResult(spec,res){
  var qs=examQuestions(spec),per=[],ok=0,i,q,a;
  for(i=0;i<qs.length;i++){
    q=qs[i]; a=res.a[i];
    var right=(a>=0&&q.options[a]&&q.options[a].ok)?1:0;
    if(right)ok++;
    per.push({topic:q.topic,topicName:q.topicName,ok:right,
              picked:(a>=0&&q.options[a])?q.options[a].t:"—",
              answer:(q.options.filter(function(o){return o.ok})[0]||{}).t||""});
  }
  return {ok:ok,n:qs.length,pct:Math.round(100*ok/qs.length),per:per};
}

         '<button class="btn btn-g" data-a="mkdelno">'+esc(xt("mkCancel"))+'</button></span>':

      });
      h+='</div>';
      /* לפי נושא — זה מה שמורה באמת צריך: לא מי נכשל, אלא מה ללמד שוב */
      var byT={};
      subs.forEach(function(s){s.per.forEach(function(p){

      });
      h+='</div>';
    }
    h+='</div>';
  });
  return h+'</div>';

function marksTable(ex){
  var out=(ex.spec.t||xt("exam"))+"\n";
  out+=xt("mkTblHead")+"\n";
  (ex.subs||[]).slice().sort(function(a,b){return b.pct-a.pct}).forEach(function(s){
    var wrong=uniq(s.per.filter(function(p){return !p.ok}).map(function(p){return p.topicName}));
    out+=(s.name||xt("mkNoName"))+"\t"+s.pct+"\t"+s.ok+"/"+s.n+"\t"+wrong.join(", ")+"\n";
  });
  return out;
}

var SIT={spec:null,id:"",qs:[],i:0,name:"",answers:[],flags:[],
         t0:0,tick:null,phase:"intro",code:"",copied:false};

/* ------------------------------------------------------------
   מבחן שנפתח מחדש — ריענון, שיחה נכנסת, נעילת מסך
   ------------------------------------------------------------
   תלמיד שדפדפן שלו רענן באמצע מבחן איבד עד כה את הכול. התשובות
   נשמרות עכשיו במכשיר, לפי מזהה המבחן, יחד עם שעת ההתחלה — כדי
   שגם טיימר לא יתאפס ויעניק זמן נוסף. השמירה מקומית בלבד.
   ------------------------------------------------------------ */
function sitKey(){return EKEY+"-run-"+SIT.id}
function sitSave(){
  if(!SIT.id)return;
  try{localStorage.setItem(sitKey(),JSON.stringify({
    n:SIT.name,a:SIT.answers,f:SIT.flags,t:SIT.t0,i:SIT.i,p:SIT.phase}))}catch(e){}
}
function sitDrop(){try{localStorage.removeItem(sitKey())}catch(e){}}
function sitRestore(){
  if(!SIT.id)return false;
  try{
    var o=JSON.parse(localStorage.getItem(sitKey())||"null");
    if(!o||!o.a||!o.a.length)return false;
    SIT.qs=examQuestions(SIT.spec);
    if(o.a.length!==SIT.qs.length)return false;   /* מבחן אחר תחת אותו מזהה */
    SIT.name=o.n||""; SIT.answers=o.a;
    SIT.flags=o.f&&o.f.length===o.a.length?o.f:SIT.qs.map(function(){return false});
    SIT.t0=o.t||0; SIT.i=Math.min(Math.max(0,o.i|0),SIT.qs.length-1);
    SIT.phase=o.p==="done"?"done":"ask";
    if(SIT.phase==="done")SIT.code=encodeResult(SIT.id,SIT.name,SIT.answers);
    return true;
  }catch(e){return false}
}
/* שניות שנותרו, או null כשלא הוגדרה הגבלת זמן */
function sitLeft(){
  var m=SIT.spec&&SIT.spec.m;
  if(!m||!SIT.t0)return null;
  return Math.max(0,Math.round((SIT.t0+m*60000-Date.now())/1000));
}
function sitClock(){
  var l=sitLeft(); if(l===null)return "";
  var mm=Math.floor(l/60),ss=l%60;
  return mm+":"+(ss<10?"0":"")+ss;
}
/* הזמן נגמר — מגישים. לא מבקשים אישור: אישור שאיש לא לוחץ עליו
   פירושו מבחן שנשאר פתוח לנצח. */
function sitTimerOn(){
  sitTimerOff();
  if(sitLeft()===null)return;
  SIT.tick=setInterval(function(){
    if(SIT.phase!=="ask"){sitTimerOff();return}
    if(sitLeft()<=0){sitTimerOff();sitFinish();return}
    var el=$("#sitclock"); if(el)el.textContent=sitClock();
  },1000);
}
function sitTimerOff(){if(SIT.tick){clearInterval(SIT.tick);SIT.tick=null}}

function sitStart(){
  var nm=$("#sitName"); SIT.name=nm?nm.value.trim():"";
  SIT.qs=examQuestions(SIT.spec);
  SIT.answers=SIT.qs.map(function(){return -1});
  SIT.flags=SIT.qs.map(function(){return false});
  SIT.i=0; SIT.phase="ask"; SIT.t0=Date.now();
  sitSave(); sitTimerOn();
  window.scrollTo(0,0); render();
}
function sitAnswer(i){
  if(SIT.phase!=="ask")return;
  SIT.answers[SIT.i]=i;
  sitSave();
  sitNext();
}
/* סימון לחזרה אינו תשובה ואינו משנה אותה — הוא רק מסמן. */
function sitFlag(){
  if(SIT.phase!=="ask")return;
  SIT.flags[SIT.i]=!SIT.flags[SIT.i];
  sitSave(); render();
}
function sitNext(){
  if(SIT.i+1<SIT.qs.length){SIT.i++;window.scrollTo(0,0);render();return}
  /* לא מגישים בלחיצה על תשובה. לחיצה בטעות על האפשרות האחרונה
     אינה אמורה לסיים מבחן. */
  SIT.phase="review"; stopSpeak(); window.scrollTo(0,0); render();
}
function sitGo(i){
  SIT.i=clamp(i,0,SIT.qs.length-1); SIT.phase="ask";
  window.scrollTo(0,0); render();
}
function sitFinish(){
  SIT.phase="done";
  sitTimerOff();
  SIT.code=encodeResult(SIT.id,SIT.name,SIT.answers);
  sitSave();
  stopSpeak(); window.scrollTo(0,0); render();
}
function sitGrade(){
  var ok=0,i;
  for(i=0;i<SIT.qs.length;i++){
    var a=SIT.answers[i];
    if(a>=0&&SIT.qs[i].options[a]&&SIT.qs[i].options[a].ok)ok++;
  }
  return {ok:ok,n:SIT.qs.length,pct:Math.round(100*ok/SIT.qs.length)};
}

function copyText(txt,done){
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(done,function(){fallbackCopy(txt,done)});
      return;
    }
  }catch(e){}
  fallbackCopy(txt,done);
}
function fallbackCopy(txt,done){
  try{
    var ta=document.createElement("textarea");
    ta.value=txt; ta.setAttribute("readonly","");
    ta.style.position="fixed"; ta.style.top="-1000px";
    document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); document.body.removeChild(ta);
    done();
  }catch(e){}
}
function examAction(a,el){
  /* --- בניית מבחן --- */
  if(a==="exlvl"){EB.level=parseInt(el.getAttribute("data-l"),10)||2;EB.built=null;render();return true}
  if(a==="extopic"){
    var id=el.getAttribute("data-t"),k=EB.topics.indexOf(id);
    if(k>=0)EB.topics.splice(k,1);else EB.topics.push(id);
    EB.built=null;render();return true;
  }
  if(a==="exflag"){var f=el.getAttribute("data-f");EB[f]=!EB[f];EB.built=null;render();return true}
  if(a==="exbuild"){
    var ti=$("#exTitle"),ph=$("#exPhone");
    EB.title=ti?ti.value.trim():""; EB.phone=ph?ph.value.trim():"";
    var tops=EB.topics.filter(function(x){return topicById(x)});
    if(!tops.length)tops=topicsForTrack(state.track).slice(0,3).map(function(t){return t.id});
    /* חלוקה שווה בין הנושאים, ואז ערבוב — כדי שלא יגיעו בגושים */
    var q=[],i;
    for(i=0;i<EB.n;i++)q.push([tops[i%tops.length],EB.level]);
    var spec={v:GENV,t:EB.title||xt("exam"),s:(Math.random()*4294967295)>>>0,l:EB.level,
              q:shuffle(q),r:!!EB.tts,f:!!EB.formulas,w:true,m:EB.mins||0};
    if(EB.phone)spec.p=EB.phone.replace(/[^0-9]/g,"");
    EB.built=spec; EB.copied="";
    var id=examId(spec);
    if(!exFind(id)){EX.list.unshift({id:id,spec:spec,date:todayIso(),subs:[]});exSave()}
    render(); return true;
  }
  if(a==="excopy"){var u=el.getAttribute("data-v");copyText(u,function(){EB.copied="url";render()});return true}

  /* --- ציונים --- */
  if(a==="mkopen"){var i2=el.getAttribute("data-i");MK.open=MK.open===i2?"":i2;MK.msg=null;render();return true}
  /* מחיקה מוחקת גם את כל ההגשות. שאלה אחת לפני זה היא לא נימוס —
     היא ההבדל בין טעות לבין אובדן של כיתה שלמה. */
  if(a==="mkdel"){MK.del=el.getAttribute("data-i");render();return true}
  if(a==="mkdelno"){MK.del="";render();return true}
  if(a==="mkdelyes"){
    var id3=el.getAttribute("data-i");
    EX.list=EX.list.filter(function(x){return x.id!==id3});
    exSave(); MK.open=""; MK.del=""; render(); return true;
  }
  if(a==="mkcopy"){
    var ex4=exFind(el.getAttribute("data-i")); if(!ex4)return true;
    copyText(marksTable(ex4),function(){MK.msg={id:ex4.id,ok:true,m:xt("mkTblCopied")};render()});
    return true;
  }
  if(a==="mkadd"){
    var ex=exFind(el.getAttribute("data-i")); if(!ex)return true;
    var ta=$("#mkPaste"),raw=ta?ta.value:"";
    var res=decodeResult(raw);
    if(!res){MK.msg={id:ex.id,ok:false,m:xt("mkErrRead")};render();return true}
    if(res.i!==ex.id){
      var other=exFind(res.i);
      MK.msg={id:ex.id,ok:false,m:other?xf("mkErrOther",other.spec.t||xt("exam")):xt("mkErrUnknown")};
      render(); return true;
    }
    if(res.a.length!==ex.spec.q.length){
      MK.msg={id:ex.id,ok:false,m:xt("mkErrCount")};render();return true}
    var g=gradeResult(ex.spec,res);
    var sub={name:res.n||"",date:res.d||todayIso(),ok:g.ok,n:g.n,pct:g.pct,per:g.per,valid:!!res.ok};
    /* הגשה חוזרת של אותו תלמיד מחליפה את הקודמת ולא מצטברת לידה */
    var k2=(ex.subs||[]).findIndex(function(s){return s.name===sub.name});
    if(!ex.subs)ex.subs=[];
    if(k2>=0)ex.subs[k2]=sub; else ex.subs.push(sub);
    exSave();
    MK.msg={id:ex.id,ok:true,m:(sub.name||xt("student"))+" "+xt("mkTaken")+" · "+g.pct+" ("+g.ok+"/"+g.n+")"+
      (sub.valid?"":" · "+xt("mkNoteBad"))};
    if(ta)ta.value="";
    render(); return true;
  }

  /* --- התלמיד --- */
  if(a==="sitstart"){sitStart();return true}
  if(a==="sitans"){sitAnswer(parseInt(el.getAttribute("data-i"),10));return true}
  if(a==="sitskip"){SIT.answers[SIT.i]=-1;sitSave();sitNext();return true}
  if(a==="sitflag"){sitFlag();return true}
  if(a==="sitprev"){sitGo(SIT.i-1);return true}
  if(a==="sitfwd"){sitNext();return true}
  if(a==="sitgo"){sitGo(parseInt(el.getAttribute("data-i"),10));return true}
  if(a==="sitfinish"){sitFinish();return true}
  if(a==="sitread"){var q2=SIT.qs[SIT.i];if(q2)speak(q2.say);return true}
  if(a==="sitform"){view="formulas";render();window.scrollTo(0,0);return true}
  if(a==="sitcopy"){copyText(SIT.code,function(){SIT.copied=true;render()});return true}
  if(a==="sitback"){view="sit";render();window.scrollTo(0,0);return true}
  return false;
}

/* קליטת מבחן מהכתובת. עושים את זה לפני ה-render הראשון, אחרת
   התלמיד רואה לרגע את מסך הבית של אפליקציה שהוא לא מכיר. */
function examFromUrl(){
  var m=String(location.hash||"").match(/^#x=(.+)$/);
  if(!m)return false;
  var sp=decodeExam(m[1]);
  if(!sp){
    view="badexam"; return true;
  }
  if(sp.v!==GENV){view="oldexam";return true}
  SIT.spec=sp; SIT.id=examId(sp); SIT.phase="intro";
  /* מבחן שכבר התחיל במכשיר הזה נמשך מהמקום שבו נעצר, עם הזמן
     שכבר חלף. בלי זה ריענון היה מוחק תשובות ומאפס טיימר. */
  if(sitRestore()&&SIT.phase==="ask")sitTimerOn();
  view="sit"; return true;
}
function viewBadExam(msg){
  return '<div class="wrap" style="padding-block:40px;max-width:520px"><div class="card pad">'+
    '<h1 class="h1">'+esc(xt("badLink"))+'</h1><p class="sub">'+esc(msg)+'</p>'+
    '<a class="btn btn-p" style="margin-top:14px" href="'+esc(location.origin+location.pathname)+
    '">'+esc(xt("toApp"))+'</a></div></div>';
}

var pendingScroll=null;
function render(){
  var html="";
  /* תלמיד שפתח את דף הנוסחאות באמצע מבחן חייב דרך חזרה מפורשת.
     סרגל הניווט הרגיל לא מכיר את המבחן ולא יחזיר אותו אליו. */
  if(view==="formulas"&&SIT.spec&&SIT.phase==="ask"){
    $("#app").innerHTML=header()+
      '<div class="wrap" style="padding-top:14px"><div class="row">'+
      '<button class="btn btn-p" data-a="sitback">'+ic("back",17)+' '+
      esc(xf("stBackTo",SIT.i+1,SIT.qs.length))+'</button></div></div>'+viewFormulas();
    afterRender(); return;
  }
  /* מבחן שהגיע מקישור עוקף הכול, כולל מסך הפתיחה: מי שנכנס להיבחן
     לא בהכרח פתח את האפליקציה הזאת אי פעם. */
  if(view==="sit"&&SIT.spec){ $("#app").innerHTML=viewSit(); afterRender(); return; }
  if(view==="badexam"||view==="oldexam"){
    $("#app").innerHTML=viewBadExam(view==="oldexam"?
      xt("exOld"):xt("exBroken"));
    afterRender(); return;
  }
  if(!state.onboarded){
    html=viewOnboard();
  }else{
    html=header();
    if(view==="home")html+=viewHome();
    else if(view==="practice")html+=viewPractice();
    else if(view==="topics")html+=viewTopics();
    else if(view==="formulas")html+=viewFormulas();
    else if(view==="progress")html+=viewProgress();
    else if(view==="settings")html+=viewSettings();
    else if(view==="exam")html+=viewExamNew();
    else if(view==="marks")html+=viewMarks();
    html+='<footer><div class="wrap fbar">'+
      _f("<span>אקסיומה · מתמטיקה לתואר ראשון, צעד אחר צעד</span>")+
      '<span class="faint">'+_('הכול נשמר במכשיר הזה ·')+' '+BUILD+'</span></div></footer>';
  }
  $("#app").innerHTML=html;
  afterRender();
}
function afterRender(){
  if(pendingScroll){
    var el=document.getElementById(pendingScroll);
    if(el){
      el.scrollIntoView({block:"center",behavior:state.settings.rm?"auto":"smooth"});
      el.style.outline="3px solid var(--accent)";el.style.outlineOffset="3px";
      setTimeout(function(){el.style.outline="";},2600);
    }
    pendingScroll=null;
  }
}

   17. פעולות
   ============================================================ */
function goto(v){
  if(view===v)return;
  view=v;stopSpeak();
  window.scrollTo(0,0);
  render();
}
function readQuestion(){
  if(!P.q)return;
  var body=P.q.expr;
  if(body&&body.indexOf("<br>")>=0){
    var eqs=body.split("<br>");
    body=eqs.map(function(e,i){return (i===0?_("משוואה ראשונה: "):_("משוואה שנייה: "))+speakMath(plainOf(e))}).join(". ");
  }else body=body?speakMath(plainOf(body)):"";
  var head=speakProse(plainOf(P.q.ask)).replace(/\s+$/,"");
  var sep=/[.?!]$/.test(head)?" ":". ";
  var txt=head+(body?sep+body:"")+
    _f(". האפשרויות: {0}", P.q.options.map(function(o,i){return _f("אפשרות {0}. {1}", (i+1), speakMath(o.t))}).join(", "));
  speak(txt);
}
function readSteps(){
  if(!P.q)return;
  var shown=P.phase==="reveal"?P.q.steps.length:Math.min(P.steps,P.q.steps.length);
  var txt=P.q.steps.slice(0,shown).map(function(s){
    return s.t+". "+speakProse(s.d||"")+" "+(s.m?speakMath(plainOf(s.m)):"");
  }).join(". ");
  speak(txt);
}
function onAnswer(i){
  if(P.phase!=="ask"||!P.q)return;
  if(P.picked.indexOf(i)>=0)return;
  var o=P.q.options[i];
  P.picked.push(i);
  if(o.ok){
    P.lastWhy="";
    P.phase="reveal";
    scoreAnswer(true);
    announce(_("נכון"));
    if(state.settings.tts)speak(lineFor(P.results[P.results.length-1]));
  }else{
    P.lastWhy=o.why||_("התשובה הזו לא נכונה. שווה לפתוח את הפתרון המודרך ולראות איפה הדרך מתפצלת.");
    announce(_f("לא נכון. {0}", P.lastWhy));
    if(state.settings.tts)speak(P.lastWhy);
    /* אם נגמרו האפשרויות — עוברים לחשיפה ולא משאירים תקועים */
    if(P.picked.length>=P.q.options.length-1){
      P.phase="reveal";
      scoreAnswer(false);
    }
  }
  render();
}
function advance(){
  P.i++;
  P.lastWhy="";
  if(roundDone()){P.phase="done";state.stats.rounds++;save();render();return}
  loadQ();
  window.scrollTo(0,0);
  render();
}
var VOICE_SAMPLE="פותרים את המשוואה: שלוש איקס ועוד חמש שווה עשרים. מעבירים את החמש לצד השני, ומחלקים בשלוש.";
function onAction(a,el){
  if(examAction(a,el))return;
  var s=state.settings;
  if(a==="go"){goto(el.getAttribute("data-v"));return}
  if(a==="lvl"){state.level=parseInt(el.getAttribute("data-l"),10);save();if(view==="practice"&&P.phase==="ask")loadQ();render();return}
  if(a==="track"){state.track=parseInt(el.getAttribute("data-t"),10);
    state.topics=state.topics.filter(function(id){var t=topicById(id);return t&&t.tracks.indexOf(state.track)>=0});
    save();render();return}
  if(a==="start"){startRound();view="practice";window.scrollTo(0,0);render();return}
  if(a==="starttopic"){var tid=el.getAttribute("data-t");startRound(tid);view="practice";window.scrollTo(0,0);render();return}
  if(a==="ans"){onAnswer(parseInt(el.getAttribute("data-i"),10));return}
  if(a==="next"){advance();return}
  if(a==="stop"){
    if(P.results.length===0){goto("home");return}
    P.list=P.list.slice(0,P.results.length);P.phase="done";save();window.scrollTo(0,0);render();return}
  if(a==="hint"){
    P.hints=1;render();
    if(s.tts&&P.q.hint){
      speak(P.q.hint);
      /* אחרי speak — הוא קורא ל-stopSpeak שמנקה הדגשה קודמת. */
      hlPrep(document.querySelector(".hintxt"),P.q.hint);
    }
    return;
  }
  if(a==="guide"){
    P.steps=1;P.usedHelp=true;
    render();if(s.tts)readSteps();return}
  if(a==="nextstep"){
    P.steps++;P.usedHelp=true;
    if(P.steps>=P.q.steps.length&&P.phase==="ask"){P.phase="reveal";scoreAnswer(false)}
    render();
    if(s.tts&&P.q.steps[P.steps-1]){
      var st=P.q.steps[P.steps-1];
      speak(st.t+". "+speakProse(st.d||"")+" "+(st.m?speakMath(plainOf(st.m)):""));
    }
    return}
  if(a==="read"){readQuestion();return}
  if(a==="readsteps"){readSteps();return}
  if(a==="rule"){fq="";view="formulas";pendingScroll="f-"+el.getAttribute("data-r");window.scrollTo(0,0);render();return}
  if(a==="tog"){var k=el.getAttribute("data-k");s[k]=!s[k];save();applyModes();render();return}
  if(a==="lang"){
    var lg=el.getAttribute("data-n");
    if(LANGS[lg]&&lg!==s.lang){
      s.lang=lg;save();applyModes();stopSpeak();
      /* שאלה נבנית פעם אחת, וכל הטקסט שלה — השאלה, הרמז, הצעדים
         ואבחון הטעות — נקבע בשפה שהייתה פעילה אז. החלפת שפה באמצע
         שאלה הייתה משאירה מסך חצי מתורגם, ולכן נבנית שאלה חדשה. */
      if(P.q&&!roundDone()){P.lastWhy="";loadQ()}
      render();window.scrollTo(0,0);
    }
    return}
  if(a==="ts"){s.ts=parseInt(el.getAttribute("data-n"),10);save();applyModes();render();return}
  if(a==="theme"){s.theme=el.getAttribute("data-n");save();applyModes();render();return}
  if(a==="rlen"){s.roundLen=parseInt(el.getAttribute("data-n"),10);save();render();return}
  if(a==="engine"){s.engine=el.getAttribute("data-n");ttsErr="";ttsState="";gDead=false;save();render();speak(_(VOICE_SAMPLE));return}
  if(a==="gvoice"){s.gvoice=el.getAttribute("data-n");ttsErr="";ttsState="";save();render();speak(_(VOICE_SAMPLE));return}
  if(a==="clearkey"){saveKey("");ttsErr="";render();return}
  if(a==="voice"){
    var uri=el.getAttribute("data-u");
    s.voice=uri;
    if(!s.voiceByLang)s.voiceByLang={};
    s.voiceByLang[LG]=uri;
    s.engine="device";save();render();speak(_(VOICE_SAMPLE));return}
  if(a==="vcheck"){voiceCheck();return}
  if(a==="test"){speak(_(VOICE_SAMPLE));return}
  if(a==="pick"){
    var id=el.getAttribute("data-t"),ix=state.topics.indexOf(id);
    if(ix>=0)state.topics.splice(ix,1);else state.topics.push(id);
    save();render();return}
  if(a==="selall"){state.topics=topicsForTrack(state.track).map(function(t){return t.id});save();render();return}
  if(a==="selnone"){state.topics=[];save();render();return}
  if(a==="fclear"){fq="";render();return}
  if(a==="obnext"){
    P.obStep=(P.obStep||1)+1;
    if(P.obStep>3){state.onboarded=true;save();applyModes();view="home";window.scrollTo(0,0)}
    save();render();return}
  if(a==="obback"){P.obStep=Math.max(1,(P.obStep||1)-1);render();return}
  if(a==="reset"){
    if(!P.confirmReset){P.confirmReset=true;el.textContent=_("לוחצים שוב כדי למחוק סופית");return}
    try{localStorage.removeItem(KEY)}catch(e){}
    state=blankState();P=({list:[],i:0,q:null,phase:"ask",picked:[],hints:0,steps:0,usedHelp:false,results:[]});
    applyModes();view="home";render();return}
}

document.addEventListener("click",function(e){
  var el=e.target.closest("[data-a]");
  if(el&&!el.disabled)onAction(el.getAttribute("data-a"),el);
});
document.addEventListener("input",function(e){
  var el=e.target;
  if(!el.dataset)return;
  if(el.dataset.bind==="name"){state.name=el.value;save();return}
  if(el.dataset.bind==="gkey"){
    var k=String(el.value||"").trim();
    /* מציירים מחדש רק כשהמפתח נראה שלם, אחרת הפוקוס קופץ בכל תו */
    if(/^AIza[\w-]{25,}$/.test(k)){saveKey(k);ttsErr="";render();speak(_(VOICE_SAMPLE))}
    return}
  if(el.dataset.bind==="fq"){fq=el.value;
    var pos=el.selectionStart;render();
    var again=document.querySelector('[data-bind="fq"]');
    if(again){again.focus();try{again.setSelectionRange(pos,pos)}catch(x){}}
    return}
  /* מחווני בונה המבחן. exn היה קיים בלי מטפל מאז ומעולם, ולכן
     מספר השאלות תמיד נשאר על ברירת המחדל ולא משנה מה נגרר.
     מעדכנים תווית בלבד ולא מציירים מסך — ציור מחדש בונה את
     המחוון מאפס ומנתק את הגרירה באמצע. */
  if(el.dataset.slide==="exn"){
    EB.n=parseInt(el.value,10)||10;
    var ln=$("#exNlab"); if(ln)ln.textContent=EB.n;
    EB.built=null;
    return}
  if(el.dataset.slide==="exm"){
    EB.mins=parseInt(el.value,10)||0;
    var lm=$("#exMlab"); if(lm)lm.textContent=EB.mins?EB.mins+" דקות":"ללא";
    EB.built=null;
    return}
  if(el.dataset.slide==="rate"){
    state.settings.rate=parseFloat(el.value);save();
    var lab=$("#ratev");if(lab)lab.textContent=state.settings.rate.toFixed(2);
    return}
});
document.addEventListener("keydown",function(e){
  if(!state.settings.keys)return;
  if(e.target.closest("input,textarea,select"))return;
  if(!state.onboarded||view!=="practice"||!P.q)return;
  if(P.phase==="ask"&&/^[1-4]$/.test(e.key)){
    var i=parseInt(e.key,10)-1;
    if(P.q.options[i]){e.preventDefault();onAnswer(i)}
    return;
  }
  if(e.key===" "){e.preventDefault();readQuestion();return}
  if(e.key==="h"||e.key==="H"){e.preventDefault();if(P.phase==="ask"&&!P.hints)onAction("hint",document.body);return}
  if(e.key==="s"||e.key==="S"){e.preventDefault();if(!P.steps)onAction("guide",document.body);else onAction("nextstep",document.body);return}
  if(e.key==="Enter"&&P.phase==="reveal"){e.preventDefault();advance();return}
});
