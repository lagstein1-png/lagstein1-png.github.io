<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>אקסיומה — מתמטיקה לתואר ראשון, צעד אחר צעד</title>
<meta name="description" content="תרגול מתמטיקה לשנה א׳ באוניברסיטה: חדו״א, אלגברה לינארית, הסתברות ובדידה. כל שאלה עם פתרון מודרך צעד־צעד, זיהוי הטעות, דף נוסחאות והקראה בקול טבעי." />
<meta name="theme-color" content="#0e1117" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   אקסיומה — מתמטיקה לתואר ראשון
   אותו עיקרון של ״שלב״, בחומר של שנה א׳: חדו״א, אלגברה לינארית,
   הסתברות ובדידה. סטודנט שמתקשה לא צריך פחות חומר — הוא צריך
   לראות את הצעדים שבין שורה לשורה.
   ============================================================ */
:root{
  --font:"Heebo","Rubik",system-ui,"Segoe UI",Arial,sans-serif;
  --bg:#f5f7fb; --surface:#ffffff; --surface2:#eef1f7;
  --ink:#101828; --muted:#5b6478; --faint:#687080; --line:#e0e4ee;
  --accent:#4f46e5; --accent-ink:#ffffff; --accent-soft:#e9e8fd;
  /* צהוב ההדגשה — אותו צהוב של מקריא קולי, כדי שמעקב ההקראה
     ייראה אותו דבר בכל האתר. */
  --hit:#f5c451; --hit-ink:#1a1300;
  --cyan:#0e7490; --cyan-soft:#dcf3f8;
  --ok:#15803d; --ok-soft:#dcfce7; --bad:#be123c; --bad-soft:#ffe4e9;
  --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px -12px rgba(16,24,40,.18);
  --r:14px;
  /* צבע לכל תחום לימוד. זה לא קישוט — זה עוזר לזהות מיד באיזה
     סוג חומר מדובר, וזה בדיוק מה שעוזר למי שמתקשה להתמצא. */
  --c-base:#0a6f66; --cs-base:#d2f4ef;
  --c-alg:#4a45c9;  --cs-alg:#e6e5fe;
  --c-geo:#9a4708;  --cs-geo:#fbecd3;
  --c-data:#be185d; --cs-data:#fbdfeb;
}
:root[data-theme="dark"]{
  --bg:#0e1117; --surface:#161b26; --surface2:#1e2532;
  --ink:#e8ecf4; --muted:#9aa4ba; --faint:#8f99ae; --line:#28313f;
  --accent:#818cf8; --accent-ink:#0e1117; --accent-soft:#232842;
  --hit:#ffd24d; --hit-ink:#241a00;
  --cyan:#22d3ee; --cyan-soft:#132b33;
  --ok:#4ade80; --ok-soft:#132a1c; --bad:#fb7185; --bad-soft:#33161f;
  --warn:#fbbf24; --warn-soft:#33260f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  --c-base:#2dd4bf; --cs-base:#0f2e2b;
  --c-alg:#a5b4fc;  --cs-alg:#1e2140;
  --c-geo:#fbbf24;  --cs-geo:#33270f;
  --c-data:#f472b6; --cs-data:#33162a;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1117; --surface:#161b26; --surface2:#1e2532;
    --ink:#e8ecf4; --muted:#9aa4ba; --faint:#8f99ae; --line:#28313f;
    --accent:#818cf8; --accent-ink:#0e1117; --accent-soft:#232842;
    --hit:#ffd24d; --hit-ink:#241a00;
    --cyan:#22d3ee; --cyan-soft:#132b33;
    --ok:#4ade80; --ok-soft:#132a1c; --bad:#fb7185; --bad-soft:#33161f;
    --warn:#fbbf24; --warn-soft:#33260f;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  --c-base:#2dd4bf; --cs-base:#0f2e2b;
  --c-alg:#a5b4fc;  --cs-alg:#1e2140;
  --c-geo:#fbbf24;  --cs-geo:#33270f;
  --c-data:#f472b6; --cs-data:#33162a;
  }
}
/* ניגודיות גבוהה — שחור על לבן, מסגרות מלאות, בלי גוונים רכים */
:root.hc{
  --bg:#ffffff; --surface:#ffffff; --surface2:#ffffff;
  --ink:#000000; --muted:#1a1a1a; --faint:#333333; --line:#000000;
  --accent:#00308f; --accent-ink:#ffffff; --accent-soft:#e8edf8;
  --hit:#ffe600; --hit-ink:#000000;
  --cyan:#004b57; --cyan-soft:#e6f2f4;
  --ok:#0a5c2a; --ok-soft:#e6f4ea; --bad:#8c0f2c; --bad-soft:#fbe9ed;
  --warn:#6b3d00; --warn-soft:#f7efdf; --shadow:none;
  --c-base:#00308f; --cs-base:#e8edf8; --c-alg:#00308f; --cs-alg:#e8edf8;
  --c-geo:#00308f;  --cs-geo:#e8edf8;  --c-data:#00308f; --cs-data:#e8edf8;
}
:root.hc .card,:root.hc .opt,:root.hc .btn,:root.hc .chip,:root.hc .tile{border:2px solid #000}
:root.hc .deco{display:none}

*{box-sizing:border-box;margin:0}
html{font-size:100%}
html.ts2{font-size:112%}
html.ts3{font-size:126%}
/* פונט ברור לקריאה: Tahoma ו-Verdana קיימים כמעט בכל מכשיר וכוללים עברית */
html.clearfont{--font:Tahoma,Verdana,Arial,sans-serif}
/* ריווח מוגדל — עוזר לקוראים עם דיסלקציה */
html.spaced body{letter-spacing:.03em;word-spacing:.16em;line-height:1.95}
html.rm *,html.rm *::before,html.rm *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.65;
  -webkit-text-size-adjust:100%;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:inherit}
input,select,textarea{font:inherit;color:var(--ink)}
a{color:var(--accent)}
::selection{background:var(--accent);color:var(--accent-ink)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---------- שלד ---------- */
#app{min-height:100vh;display:flex;flex-direction:column}
/* בלי זה כרום מותח כל מסך לרוחב המינימלי של התוכן שלו והעמוד גולש בטלפון */
#app>*{min-width:0;width:100%}
.wrap{max-width:1120px;margin:0 auto;padding:0 clamp(12px,4vw,22px)}
.deco{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.85;
  background:
    radial-gradient(760px 380px at 92% -6%,var(--cs-alg),transparent 62%),
    radial-gradient(620px 340px at 2% 18%,var(--cs-data),transparent 58%),
    radial-gradient(700px 380px at 10% 102%,var(--cs-base),transparent 60%),
    radial-gradient(520px 300px at 96% 78%,var(--cs-geo),transparent 58%)}
#app{position:relative;z-index:1}

/* ---------- כותרת עליונה ---------- */
header{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:10px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand .mk{width:38px;height:38px;border-radius:11px;
  background:linear-gradient(140deg,var(--c-alg),var(--c-data) 55%,var(--c-geo));color:#fff;
  display:grid;place-items:center;font-weight:800;font-size:1.05rem;flex-shrink:0}
:root.hc .brand .mk{background:var(--ink)}
.brand b{display:block;font-size:1rem;line-height:1.15;font-weight:800}
.brand small{display:block;color:var(--muted);font-size:.72rem;font-weight:500}
nav{display:flex;gap:4px;margin-inline-start:auto;flex-wrap:wrap}
.nb{display:inline-flex;align-items:center;gap:6px;border-radius:10px;padding:8px 12px;
  font-size:.9rem;font-weight:600;color:var(--muted);border:1px solid transparent;transition:.15s}
.nb:hover{background:var(--surface2);color:var(--ink)}
.nb.on{background:var(--accent);color:var(--accent-ink)}
:root.hc .nb.on{background:var(--ink);color:var(--bg)}
.nb svg{flex-shrink:0}
@media(max-width:560px){.nb span{display:none}.nb{padding:9px 11px}}

/* ---------- רכיבי בסיס ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:clamp(14px,3.4vw,22px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:11px;
  font-weight:700;padding:12px 18px;transition:.15s;border:1px solid transparent;line-height:1.3}
.btn-p{background:linear-gradient(135deg,var(--accent),var(--c-data));color:#fff}
.btn-p:hover{filter:brightness(1.1)}
:root.hc .btn-p{background:var(--accent)}
.btn-d{background:var(--ink);color:var(--bg)}
.btn-g{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-g:hover{background:var(--surface2)}
.btn[disabled]{opacity:.42;cursor:not-allowed}
.btn.w{width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;
  font-size:.82rem;font-weight:600;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.chip.a{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.h1{font-size:clamp(1.5rem,5.2vw,2.05rem);font-weight:800;line-height:1.2;overflow-wrap:anywhere}
.h2{font-size:clamp(1.1rem,3.6vw,1.3rem);font-weight:700;overflow-wrap:anywhere}
.sub{color:var(--muted);margin-top:5px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.sm{font-size:.85rem}
.xs{font-size:.76rem}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
/* רשימת הקולות: שתי עמודות רק כשבאמת יש מקום, אחרת השמות נקטעים */
.vgrid{grid-template-columns:repeat(auto-fit,minmax(min(100%,215px),1fr));gap:8px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
hr.sep{border:none;border-top:1px solid var(--line);margin:16px 0}

/* ---------- מתמטיקה: תמיד משמאל לימין, מבודד מהעברית ---------- */
.m{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums}
.mline{direction:ltr;unicode-bidi:isolate;text-align:center;font-weight:700;
  font-size:clamp(1.55rem,7vw,2.5rem);letter-spacing:.01em;line-height:1.35;overflow-wrap:anywhere}
.mstep{direction:ltr;unicode-bidi:isolate;text-align:center;font-weight:700;
  font-size:clamp(1.05rem,4.6vw,1.35rem);background:var(--surface2);border-radius:10px;
  padding:9px 12px;margin-top:8px;overflow-wrap:anywhere}
sup{font-size:.62em;vertical-align:super;line-height:0}
sub{font-size:.62em;vertical-align:sub;line-height:0}
/* ---------- מטריצה ווקטור ---------- */
.mtx{display:inline-flex;align-items:stretch;gap:7px;vertical-align:middle;
  padding:3px 10px;margin:0 .2em;position:relative;direction:ltr}
.mtx::before,.mtx::after{content:"";position:absolute;top:0;bottom:0;width:7px;
  border-top:2px solid currentColor;border-bottom:2px solid currentColor}
.mtx::before{inset-inline-start:0;border-inline-start:2px solid currentColor}
.mtx::after{inset-inline-end:0;border-inline-end:2px solid currentColor}
.mtx .mcol{display:flex;flex-direction:column;gap:3px;text-align:center;min-width:1.5em}
.mtx .mcol>span{padding:1px 4px;font-variant-numeric:tabular-nums}
.vec{display:inline-flex;gap:9px;padding:2px 11px;margin:0 .16em;direction:ltr;
  border-inline-start:2px solid currentColor;border-inline-end:2px solid currentColor;border-radius:9px}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;
  line-height:1.05;margin:0 .18em;font-size:.86em}
.frac>span:first-child{border-bottom:.09em solid currentColor;padding:0 .22em}
.frac>span:last-child{padding:0 .22em}

/* ---------- תשובות ---------- */
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
@media(max-width:430px){.opts{grid-template-columns:minmax(0,1fr)}}
.opt{position:relative;border:2px solid var(--line);background:var(--surface);border-radius:12px;
  padding:15px 14px 15px 44px;font-weight:700;font-size:clamp(1rem,4vw,1.2rem);transition:.14s;min-height:58px;
  display:flex;align-items:center;gap:10px}
[dir="rtl"] .opt{padding:15px 44px 15px 14px}
.opt:hover:not([disabled]){border-color:var(--c,var(--accent));background:var(--cs,var(--accent-soft))}
.opt .k{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);
  width:24px;height:24px;border-radius:7px;background:var(--cs,var(--surface2));color:var(--c,var(--faint));
  display:grid;place-items:center;font-size:.76rem;font-weight:700}
/* currentColor כאן היה נפתר לצבע שנקבע באותה הצהרה עצמה,
   ולכן הרקע והטקסט יצאו זהים והספרה נעלמה. */
.opt.right .k{background:var(--ok);color:var(--surface)}
.opt.wrong .k{background:var(--bad);color:var(--surface)}
.opt.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
/* בחירה במבחן היא בחירה, לא תשובה נכונה. במסכי התרגול הצבע
   הירוק אומר "צדקת", ובמבחן אסור לו להופיע כלל — הוא נותן
   משוב שגוי לכל בחירה. ניטרלי, ורק מסמן מה סומן. */
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.opt.dim{opacity:.4}
.opt.gone{opacity:.35;text-decoration:line-through}

/* ---------- פתרון מודרך ---------- */
.steps{margin-top:16px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.step{padding:13px 15px;border-top:1px solid var(--line);background:var(--surface)}
.step:first-child{border-top:none}
.step.future{display:none}
.step .st{display:flex;align-items:center;gap:9px;font-weight:700;font-size:.95rem}
.step .num{width:23px;height:23px;border-radius:50%;background:var(--c,var(--accent));color:var(--accent-ink);
  display:grid;place-items:center;font-size:.76rem;flex-shrink:0;font-weight:700}
.step .sd{color:var(--muted);font-size:.92rem;margin-top:4px;overflow-wrap:anywhere}
.step.last{background:var(--ok-soft)}
.step.last .num{background:var(--ok);color:var(--surface)}

/* ---------- פירוט טעות ---------- */
.diag{margin-top:14px;border-inline-start:4px solid var(--bad);background:var(--bad-soft);
  border-radius:0 10px 10px 0;padding:12px 15px}
[dir="rtl"] .diag{border-radius:10px 0 0 10px}
.diag b{color:var(--bad)}
.hintbox{margin-top:14px;border-inline-start:4px solid var(--warn);background:var(--warn-soft);
  border-radius:0 10px 10px 0;padding:12px 15px}
.wd{border-radius:5px;padding:1px 3px}
.wd.hit{background:var(--hit);color:var(--hit-ink);font-weight:600}
[dir="rtl"] .hintbox{border-radius:10px 0 0 10px}

/* ---------- מדדים ---------- */
.bar{height:7px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s,background .3s}
.bar.ok>i{background:var(--ok)}
.bar.mid>i{background:var(--warn)}
.bar.low>i{background:var(--bad)}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--surface2);border:1px solid var(--line)}
.dot.ok{background:var(--ok);border-color:var(--ok)}
.dot.no{background:var(--bad);border-color:var(--bad)}
.dot.flag{box-shadow:0 0 0 2px var(--accent)}
.dot.hp{background:var(--warn);border-color:var(--warn)}
.tile{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--c,var(--accent));
  border-radius:12px;padding:14px;box-shadow:var(--shadow)}
.tile b{display:block;font-size:1.7rem;font-weight:800;line-height:1.2;color:var(--c,var(--ink))}
.tile span{color:var(--muted);font-size:.82rem}

/* ---------- כרטיס נושא ---------- */
.tpc{position:relative;display:flex;flex-direction:column;gap:9px;text-align:start;background:var(--surface);
  border:1px solid var(--line);border-inline-start:4px solid var(--c,var(--accent));
  border-radius:12px;padding:14px;transition:.15s;box-shadow:var(--shadow);min-width:0}
.tpc:hover{border-color:var(--c,var(--accent));transform:translateY(-2px);box-shadow:0 8px 22px -12px var(--c)}
.tpc:hover{border-inline-start-color:var(--c,var(--accent))}
.tpc.on{border-color:var(--c,var(--accent));background:var(--cs,var(--accent-soft))}
.tpc .tn{color:var(--c,var(--ink))}
.tpc .tn{font-weight:700;font-size:.98rem;overflow-wrap:anywhere}
.tpc .td{color:var(--muted);font-size:.8rem;overflow-wrap:anywhere}
.tpc .tm{display:flex;align-items:center;gap:7px;font-size:.74rem;color:var(--faint)}
.tpc .tm .bar{flex:1;min-width:0}

/* ---------- מתגים והגדרות ---------- */
.tog{display:flex;align-items:center;gap:13px;width:100%;text-align:start;background:var(--surface2);
  border:1px solid transparent;border-radius:12px;padding:13px 15px;transition:.15s;min-width:0}
.tog:hover{border-color:var(--line)}
.tog+.tog{margin-top:9px}
.tog .tt{flex:1;min-width:0}
.tog .tt b{display:block;font-size:.97rem;overflow-wrap:anywhere}
.tog .tt span{display:block;color:var(--muted);font-size:.82rem;overflow-wrap:anywhere}
.sw{position:relative;width:46px;height:27px;border-radius:99px;background:var(--line);flex-shrink:0;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:21px;height:21px;border-radius:50%;
  background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .2s}
.tog[aria-checked="true"] .sw{background:var(--accent)}
.tog[aria-checked="true"] .sw::after{transform:translateX(-19px)}
[dir="ltr"] .tog[aria-checked="true"] .sw::after{transform:translateX(19px)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 auto;min-width:0;border:1px solid var(--line);background:var(--surface);
  border-radius:10px;padding:10px 12px;font-weight:600;font-size:.9rem;color:var(--muted);transition:.15s}
.seg button.on{background:var(--c,var(--ink));color:var(--bg);border-color:transparent}
:root.hc .seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--accent)}
.field{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:11px;
  padding:12px 14px;font-size:1rem;outline:none}
.field:focus{border-color:var(--accent)}

/* ---------- דף נוסחאות ---------- */
.a-base{--c:var(--c-base);--cs:var(--cs-base)}
.a-alg{--c:var(--c-alg);--cs:var(--cs-alg)}
.a-geo{--c:var(--c-geo);--cs:var(--cs-geo)}
.a-data{--c:var(--c-data);--cs:var(--cs-data)}
.chip.area{background:var(--cs);color:var(--c);border-color:transparent}
.arh{display:flex;align-items:center;gap:9px}
.arh::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c);flex-shrink:0}
.fcard{background:var(--surface);border:1px solid var(--line);border-inline-start:4px solid var(--c,var(--line));
  border-radius:12px;padding:13px 15px;min-width:0}
.fcard .fm{color:var(--c,var(--ink))}
.fcard .ft{font-weight:700;font-size:.93rem}
.fcard .fm{margin-top:7px;font-size:1.05rem}
.fcard .fn{color:var(--muted);font-size:.82rem;margin-top:6px;overflow-wrap:anywhere}

/* ---------- שורת מצב הקול ---------- */
.vstrip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;
  padding:9px 13px;border-radius:11px;font-size:.86rem;font-weight:600;line-height:1.5}
.vstrip>span{flex:1;min-width:0}
.vstrip .btn{padding:6px 12px;font-size:.8rem;background:var(--surface);border-color:currentColor}
.vstrip.ok{background:var(--ok-soft);color:var(--ok)}
.vstrip.warn{background:var(--warn-soft);color:var(--warn)}
.vstrip.bad{background:var(--bad-soft);color:var(--bad)}
.vstrip svg{flex-shrink:0}

/* ---------- שכבות ---------- */
.ov{position:fixed;inset:0;z-index:80;background:rgba(8,11,18,.62);backdrop-filter:blur(3px);
  display:grid;place-items:center;padding:14px}
.ovbox{background:var(--surface);border-radius:16px;width:100%;max-width:560px;max-height:92vh;
  overflow-y:auto;padding:20px;box-shadow:0 24px 70px rgba(0,0,0,.45)}
.ovx{width:36px;height:36px;border-radius:50%;background:var(--surface2);font-size:1.1rem;
  font-weight:700;color:var(--muted);flex-shrink:0;display:grid;place-items:center}

/* ---------- אנימציות מדודות ---------- */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes nudge{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.rise{animation:rise .3s ease both}
.nudge{animation:nudge .3s ease}

footer{border-top:1px solid var(--line);margin-top:auto;background:var(--surface)}
.fbar{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;
  padding-block:16px;font-size:.82rem;color:var(--muted)}
.skip{position:absolute;inset-inline-start:-9999px}
.skip:focus{position:static;display:inline-flex;align-items:center;min-height:44px;margin:8px;padding:8px 14px;background:var(--accent);color:var(--accent-ink);border-radius:8px}

function term(c,v){

function pw(base,e){
  if(e===1)return base;
  if(e===0)return "1";
  return base+"<sup>"+num(e)+"</sup>";

function mat(rows){

/* פולינום ממערך מקדמים מהחזקה הגבוהה לנמוכה: poly([2,0,-5,1]) */
function poly(cs,v){
  v=v||"x";
  var n=cs.length-1,out="",i,c,p,t;

var LANGS={
  he:{name:"עברית",   dir:"rtl", tts:"he-IL"},
  ar:{name:"العربية", dir:"rtl", tts:"ar-SA"},
  ru:{name:"Русский", dir:"ltr", tts:"ru-RU"},
  en:{name:"English", dir:"ltr", tts:"en-US"}
};
var LG="he";
var TR={};
function _(h){
  if(LG==="he")return h;
  var d=TR[LG];
  if(!d)return h;
  var v=d[h];
  return v===undefined?h:v;
}
/* תבנית עם ערכים מוצבים. סדר החלקים אינו זהה בכל שפה, ולכן משפט
   שמשולב בו מספר נשמר כתבנית שלמה ולא כשני חלקים מודבקים. */
function _f(h){
  var t=_(h),i,args=arguments;
  for(i=1;i<args.length;i++)t=t.split("{"+(i-1)+"}").join(String(args[i]));
  return t;
}
/* אנגלית אינה סימן. טלפון בישראל מדווח אנגלית כברירת מחדל של
   המכשיר, לא כבחירה, והאפליקציה נפתחה באנגלית למי שבא ללמוד
   בעברית. ערבית ורוסית כן נחשבות — שם זו שפת אם של ממש. מי
   שרוצה אנגלית בוחר אותה, והבחירה נשמרת. */
function guessLang(){
  var ls=(navigator.languages||[navigator.language||"he"]);
  for(var i=0;i<ls.length;i++){
    var c=String(ls[i]).toLowerCase().split("-")[0];
    if(c==="iw")c="he";
    if(c==="en")continue;
    if(LANGS[c])return c;
  }
  return "he";
}

var state=blankState();

function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(!raw)return false;
    var s=JSON.parse(raw);
    if(!s||typeof s!=="object")return false;
    var base=blankState(),k;
    for(k in base)if(!(k in s))s[k]=base[k];
    for(k in base.settings)if(!(k in s.settings))s.settings[k]=base.settings[k];
    for(k in base.stats)if(!(k in s.stats))s.stats[k]=base.stats[k];
    state=s;
    return true;
  }catch(e){return false}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}

/* רצף ימים — נספר רק כשבאמת תרגלו, ובמצב רגוע לא מוצג בכלל */
function touchDay(){
  var d=todayIso(),st=state.stats;
  if(st.lastDay===d)return;
  if(st.lastDay&&daysBetween(st.lastDay,d)===1)st.streakDays++;
  else st.streakDays=1;
  st.lastDay=d;
}
function dayRec(){
  var d=todayIso();
  if(!state.days[d])state.days[d]={a:0,c:0};
  return state.days[d];
}

/* ------------------------------------------------------------
   פיצול לאמירות קצרות — הועתק מ"תאוריה מדברת", שם ההקראה נשמעת
   הכי טוב. מנועי מכשיר מאיצים ובולעים סופי מילים במשפט ארוך;
   כאן נשלחה שאלה שלמה באמירה אחת, לפעמים 300 תווים.
   כל מקטע נושא את ההיסט שלו במחרוזת המלאה, כי charIndex מתאפס
   בכל אמירה ובלעדיו ההדגשה קופצת לתחילת המשפט בכל מקטע.
   ------------------------------------------------------------ */
var SEG_MAX=90, SEG_GAP=260;
/* סימן פיסוק בין שתי ספרות הוא חלק מהמספר ולא מקום לחתוך בו:
   בלי הבדיקה הזאת "3,500" נשבר והמנוע קורא "שלוש, חמש מאות". */
function insideNumber(str,i){
  return i>0&&i+1<str.length&&/[0-9]/.test(str[i-1])&&/[0-9]/.test(str[i+1]);
}
function segments(spoken){
  var out=[],parts=[],from=0,i,j;
  function push(t,start){ if(String(t).trim())out.push({text:t,start:start}) }
  for(i=0;i<spoken.length;i++){
    if(".!?:;".indexOf(spoken[i])<0)continue;
    if(insideNumber(spoken,i))continue;
    j=i+1; while(j<spoken.length&&/\s/.test(spoken[j]))j++;
    parts.push({text:spoken.slice(from,j),start:from});
    from=j; i=j-1;
  }
  if(from<spoken.length)parts.push({text:spoken.slice(from),start:from});
  for(var k=0;k<parts.length;k++){
    var p=parts[k];
    if(p.text.length<=SEG_MAX){ push(p.text,p.start); continue }
    var rest=p.text,base=p.start;
    while(rest.length>SEG_MAX){
      var cut=rest.lastIndexOf(",",SEG_MAX);
      while(cut>0&&insideNumber(rest,cut))cut=rest.lastIndexOf(",",cut-1);
      if(cut<SEG_MAX*0.4)cut=rest.lastIndexOf(" ",SEG_MAX);
      if(cut<=0)break;
      push(rest.slice(0,cut+1),base);
      base+=cut+1; rest=rest.slice(cut+1);
    }
    push(rest,base);
  }
  /* מקטע זעיר — "12." או ")" — עם הפסקה של רבע שנייה אחריו נשמע
     כמו גמגום. מאחדים אותו לזה שאחריו. */
  var merged=[];
  for(i=0;i<out.length;i++){
    if(merged.length&&out[i].text.trim().length<12&&
       merged[merged.length-1].text.length+out[i].text.length<=SEG_MAX*1.4){
      merged[merged.length-1].text+=out[i].text; continue;
    }
    if(out[i].text.trim().length<12&&i+1<out.length){
      out[i+1]={text:out[i].text+out[i+1].text,start:out[i].start}; continue;
    }
    merged.push(out[i]);
  }
  out=merged;
  return out.length?out:[{text:spoken,start:0}];
}
/* קצב לפי שפה — אותם ערכים שנבחרו בתאוריה מדברת אחרי האזנה */
var VOICE_TUNE={he:0.82,ar:0.85,en:0.90,ru:0.88};
function tuneRate(lang,rate){
  var t=VOICE_TUNE[String(lang||"he").split("-")[0].toLowerCase()]||0.88;
  var r=t*(rate||1);
  return Math.max(0.5,Math.min(1.6,Math.round(r*100)/100));
}

  [/\bp\b/g," פי "],[/\bq\b/g," קיו "],[/\bi\b/g," אי "],
  [/\bS\b/g," אס "],[/\bA\b/g," איי "],[/\bB\b/g," בי "],[/\bU\b/g," יו "],
  /* סוגריים: "בסוגריים" לפתיחה, ופסיק לסגירה. הניסוח הקודם,
     "סוגריים ... סוף סוגריים", הפך כל ביטוי קצר לנאום. */
  [/\(/g," בסוגריים "],[/\)/g," , "]
];
function speakMath(plain){
  var s=" "+String(plain)+" ",i;
  for(i=0;i<SAY_MAP.length;i++)s=s.replace(SAY_MAP[i][0],_(SAY_MAP[i][1]));
  /* פסיקים רצופים נוצרים כשסוגר נסגר מיד לפני מפריד */
  s=s.replace(/(\s*,\s*){2,}/g," , ");
  return s.replace(/\s+/g," ").trim();
}
/* טקסט הסבר הוא עברית רגילה שמשובצים בה סימנים בודדים. כאן מתרגמים
   רק את מה שחד־משמעי — מקף בעברית הוא מקף, לא מינוס. */
var PROSE_MAP=[
  [/\(([^()]{1,10})\)\/\(([^()]{1,10})\)/g,"$1 חלקי $2"],
  [/\bP\(([^()]{1,12})\)/g," ההסתברות ל $1 "],
  [/\bE\(([^()]{1,12})\)/g," התוחלת של $1 "],
  [/\bV\(([^()]{1,12})\)/g," השונות של $1 "],
  [/lim/gi," הגבול "],[/∞/g," אינסוף "],[/∫/g," אינטגרל "],
  [/∈/g," שייך ל "],[/∪/g," איחוד "],[/∩/g," חיתוך "],[/∅/g," הקבוצה הריקה "],
  [/¬/g," לא "],[/∧/g," וגם "],[/∨/g," או "],[/⇒/g," גורר "],[/⇔/g," אם ורק אם "],
  [/λ/g," למדה "],[/μ/g," מיו "],[/σ/g," סיגמא "],[/Φ/g," פי גדולה "],
  [/²/g," בריבוע "],[/³/g," בשלישית "],[/₁/g," אחת "],[/₂/g," שתיים "],[/ₙ/g," אן "],
  /* מעריכים מוגבהים ביוניקוד, כמו x⁻ᵃ */
  [/⁻/g," מינוס "],[/⁺/g," ועוד "],[/ᵃ/g," איי "],[/ᵇ/g," בי "],[/⁰/g," אפס "],[/¹/g," אחת "],
  [/√/g," שורש של "],[/π/g," פאי "],[/°/g," מעלות "],[/Δ/g," דלתא "],
  [/α/g," אלפא "],[/[×·]/g," כפול "],[/÷/g," חלקי "],[/≈/g," בערך "],
  /* מינוס טיפוגרפי ו-en dash לא מופיעים בעברית, ולכן בטוח לתרגם.
     מקף רגיל נשאר מקף — "ה-3" הוא לא חיסור. */
  [/[−–]/g," מינוס "],[/=/g," שווה "],[/\+/g," ועוד "],[/\//g," חלקי "],
  [/\bsin/gi," סינוס "],[/\bcos/gi," קוסינוס "],[/\btan/gi," טנגנס "]
];
function speakProse(t){
  var s=String(t||""),i;
  for(i=0;i<PROSE_MAP.length;i++)s=s.replace(PROSE_MAP[i][0],_(PROSE_MAP[i][1]));
  return s.replace(/\s+/g," ").trim();
}

/* ============================================================
   8. עזרי בנייה למחוללים
   ============================================================ */
function S(t,d,m){return {t:t,d:d||"",m:m||""}}         /* צעד בפתרון */
function W(h,why){return {h:String(h),why:why||""}}      /* מסיח + הטעות שהוא מייצג */

/* ============================================================
   9. מחוללי השאלות — חדו״א
   כל מחולל מחזיר שאלה שלמה: ניסוח, תשובה, מסיחים שכל אחד מהם
   הוא טעות אמיתית שסטודנטים עושים, ופתרון מלא צעד־צעד.
   ============================================================ */
function pn(v){return v<0?"("+num(v)+")":String(v)}
function fact(n){var r=1,i;for(i=2;i<=n;i++)r*=i;return r}
function Cnk(n,k){if(k<0||k>n)return 0;return Math.round(fact(n)/(fact(k)*fact(n-k)))}

/* ---------- 1. גבולות ---------- */
function genLimits(L){
  var a,b,c,r,steps;
  if(L===1){
    a=rnz(-4,4);b=rnz(-6,6);c=rnz(-9,9);r=rnz(-3,3);
    var val=a*r*r+b*r+c;
    return {ask:_("חשבו את הגבול"),expr:"lim<sub>x→"+num(r)+"</sub> ("+poly([a,b,c])+")",
      ans:W(num(val)),
      wrong:[
        W(num(a*r+b*r+c),_f("העליתם בריבוע רק חלק מהביטוי. מציבים {0} בכל מקום שבו מופיע x.", num(r))),
        W(num(c),_f("הצבתם אפס במקום {0}.", num(r))),
        W(num(-val),_("טעות סימן בהצבה. שימו לב לסוגריים סביב מספר שלילי.")),
        W(_("הגבול לא קיים"),_("הפונקציה כאן פולינום, והיא רציפה בכל נקודה — לפולינום תמיד יש גבול."))
      ],
      steps:[
        S(_("הפונקציה רציפה בנקודה"),_("פולינום רציף בכל הישר, ולכן הגבול הוא פשוט ההצבה. אין כאן שום דבר מסובך."),
          "lim f(x) = f("+num(r)+")"),
        S(_("מציבים"),"",num(a)+"·"+pn(r)+"² + "+num(b)+"·"+pn(r)+" + "+num(c)),
        S(_("מחשבים"),"",num(a*r*r)+" + "+num(b*r)+" + "+num(c)+" = "+num(val))
      ],rule:"limsub",hint:_("פולינום רציף בכל נקודה, אז מציבים ישירות.")};
  }
  if(L===2){
    r=rnz(-6,6);var q=rnz(-6,6);
    while(q===r)q=rnz(-6,6);
    var num2=[1,-(r+q),r*q];
    return {ask:_("חשבו את הגבול"),
      expr:'lim<sub>x→'+num(r)+'</sub> <span class="frac"><span>'+poly(num2)+'</span><span>x'+sgn(-r)+'</span></span>',
      ans:W(num(r-q)),
      wrong:[
        W("0",_("קיבלתם 0 חלקי 0 והסקתם שהתוצאה אפס. 0/0 הוא ביטוי לא מוגדר — הוא לא ערך, הוא סימן שצריך לפרק.")),
        W(_("הגבול לא קיים"),_("0/0 לא אומר שאין גבול, אלא שצריך לפרק לגורמים ולצמצם.")),
        W(num(q-r),_f("טעות סימן בפירוק. הגורם הוא (x − {0}), והשורש שלו הוא {1}.", num(q), num(q))),
        W(num(r*q),_("זו מכפלת השורשים, כלומר האיבר החופשי — לא הגבול."))
      ],
      steps:[
        S(_("בודקים הצבה ישירה"),_f("מציבים x = {0} ומקבלים 0 חלקי 0. זה לא ערך — זו הודעה שצריך לעבוד.", num(r)),
          "0 / 0"),
        S(_("מפרקים את המונה לגורמים"),_f("מחפשים שני מספרים שסכומם {0} ומכפלתם {1}.", num(r+q), num(r*q)),
          poly(num2)+" = (x"+sgn(-r)+")(x"+sgn(-q)+")"),
        S(_("מצמצמים"),_f("הגורם (x{0}) מופיע במונה ובמכנה. מותר לצמצם אותו כי x שואף ל-{1} אבל אינו שווה לו.", sgn(-r), num(r)),
          "x"+sgn(-q)),
        S(_("מציבים בביטוי המצומצם"),"",num(r)+sgn(-q)+" = "+num(r-q))
      ],rule:"lim00",hint:_("0/0 היא לא תשובה. מפרקים לגורמים, מצמצמים, ורק אז מציבים.")};
  }
  var n1=ri(1,3),n2=ri(1,3);
  a=rnz(-6,6);b=rnz(-6,6);
  var ansTxt,why1,why2,why3;
  if(n1===n2){ansTxt=fr(a,b).html();why1=_("דרגות המונה והמכנה שוות, ולכן הגבול הוא יחס המקדמים המובילים — לא אפס.");}
  else if(n1<n2){ansTxt="0";why1=_("דרגת המכנה גבוהה יותר, ולכן המכנה גדל מהר יותר והמנה שואפת לאפס.");}
  else{ansTxt="∞";why1=_("דרגת המונה גבוהה יותר, ולכן הביטוי גדל ללא גבול.");}
  var others=[fr(a,b).html(),"0","∞"].filter(function(v){return v!==ansTxt});
  return {ask:_("חשבו את הגבול"),
    expr:'lim<sub>x→∞</sub> <span class="frac"><span>'+(a===1?"":num(a))+pw("x",n1)+' + 3</span><span>'+(b===1?"":num(b))+pw("x",n2)+' − 1</span></span>',
    ans:W(ansTxt),
    wrong:others.map(function(v){return W(v,why1)}).concat([
      W(fr(b,a).html(),_("הפכתם את יחס המקדמים. המונה נשאר במונה."))
    ]),
    steps:[
      S(_("מסתכלים רק על הדרגות הגבוהות"),_("באינסוף האיברים הקטנים לא משנים כלום. מה שקובע הוא החזקה הגבוהה בכל צד."),
        _f("דרגת מונה: {0}   דרגת מכנה: {1}", n1, n2)),
      S(_("משווים דרגות"),_("דרגת מונה גדולה יותר ← אינסוף. שווה ← יחס המקדמים המובילים. קטנה יותר ← אפס."),
        n1>n2?_("גדולה"):n1===n2?_("שווה"):_("קטנה")),
      S(_("התשובה"),"",ansTxt)
    ],rule:"liminf",hint:_("באינסוף משווים את דרגות המונה והמכנה, ורק אז מסתכלים על המקדמים.")};
}

/* ---------- 2. נגזרות בסיסיות ---------- */
function genDeriv(L){
  var a,b,c,n,steps;
  if(L===1){
    a=rnz(-6,6);n=ri(2,6);b=rnz(-8,8);c=rnz(-9,9);
    var d1=a*n,d2=b;
    return {ask:_("גזרו את הפונקציה"),expr:"f(x) = "+num(a)+pw("x",n)+term(b,"x")+sgn(c),
      ans:W("f'(x) = "+num(d1)+pw("x",n-1)+sgn(b)),
      wrong:[
        W("f'(x) = "+num(d1)+pw("x",n)+sgn(b),_("הורדתם את המעריך למקדם אבל לא הפחתתם אותו ב-1.")),
        W("f'(x) = "+num(a)+pw("x",n-1)+sgn(b),_("הפחתתם את המעריך אבל שכחתם להכפיל בו את המקדם.")),
        W("f'(x) = "+num(d1)+pw("x",n-1)+sgn(b)+sgn(c),_("האיבר החופשי לא נעלם. נגזרת של קבוע היא תמיד אפס."))
      ],
      steps:[
        S(_("כלל החזקה"),_("(xⁿ)' = n·xⁿ⁻¹ — המעריך יורד ונעשה מקדם, והחזקה קטנה באחת."),"(xⁿ)' = n·xⁿ⁻¹"),
        S(_("גוזרים איבר איבר"),"",num(a)+pw("x",n)+" → "+num(d1)+pw("x",n-1)),
        S(_("האיבר הלינארי והקבוע"),_f("נגזרת של {0}x היא {1}, ונגזרת של קבוע היא אפס.", num(b), num(b)),
          num(b)+"x → "+num(b)+"   ,   "+num(c)+" → 0"),
        S(_("מחברים"),"","f'(x) = "+num(d1)+pw("x",n-1)+sgn(b))
      ],rule:"dpow",hint:_("כל איבר בנפרד: המעריך יורד למקדם והחזקה קטנה באחת. קבוע נעלם.")};
  }
  if(L===2){
    a=rnz(-5,5);
    var kind=pick(["exp","ln","sqrt","inv"]);
    var f,df,why=[];
    if(kind==="exp"){f=num(a)+"e<sup>x</sup>";df=num(a)+"e<sup>x</sup>";
      why=[W("f'(x) = "+num(a)+"x·e<sup>x</sup>",_("גזרתם את e^x כאילו הוא חזקה של x. הנגזרת של eˣ היא eˣ עצמה.")),
           W("f'(x) = e<sup>x</sup>",_("איבדתם את המקדם. מקדם קבוע נשאר בנגזרת.")),
           W("f'(x) = "+num(a)+"e<sup>x−1</sup>",_("הורדתם את המעריך באחת. זה כלל החזקה, והוא לא חל על eˣ."))];}
    else if(kind==="ln"){f=num(a)+"ln x";df='<span class="frac"><span>'+num(a)+'</span><span>x</span></span>';
      why=[W("f'(x) = "+num(a)+"ln x",_("לא גזרתם בכלל.")),
           W('f\'(x) = <span class="frac"><span>1</span><span>x</span></span>',_f("איבדתם את המקדם {0}.", num(a))),
           W("f'(x) = "+num(a)+"x",_("הפכתם את הכלל. הנגזרת של ln x היא 1 חלקי x."))];}
    else if(kind==="sqrt"){f=num(a)+"√x";df='<span class="frac"><span>'+num(a)+'</span><span>2√x</span></span>';
      why=[W("f'(x) = "+num(a)+"√x",_("לא גזרתם.")),
           W('f\'(x) = <span class="frac"><span>1</span><span>2√x</span></span>',_("איבדתם את המקדם.")),
           W('f\'(x) = <span class="frac"><span>'+num(a)+'</span><span>√x</span></span>',_("שכחתם את ה-2 במכנה. √x הוא x בחזקת חצי, והחצי יורד למקדם."))];}
    else{f='<span class="frac"><span>'+num(a)+'</span><span>x</span></span>';
      df='<span class="frac"><span>'+num(-a)+'</span><span>x<sup>2</sup></span></span>';
      why=[W('f\'(x) = <span class="frac"><span>'+num(a)+'</span><span>x<sup>2</sup></span></span>',_("שכחתם את המינוס. הנגזרת של 1/x היא מינוס 1 חלקי x².")),
           W('f\'(x) = <span class="frac"><span>'+num(-a)+'</span><span>x</span></span>',_("המכנה צריך להיות x בריבוע.")),
           W("f'(x) = "+num(a)+"ln x",_f("זה האינטגרל של {0}/x, לא הנגזרת.", num(a)))];}
    return {ask:_("גזרו את הפונקציה"),expr:"f(x) = "+f,ans:W("f'(x) = "+df),wrong:why,
      steps:[
        S(_("מזהים את הפונקציה הבסיסית"),"",kind==="exp"?"(eˣ)' = eˣ":kind==="ln"?"(ln x)' = 1/x":kind==="sqrt"?"(√x)' = 1 / (2√x)":"(1/x)' = −1/x²"),
        S(_("המקדם נשאר"),_("מקדם קבוע פשוט מוכפל בנגזרת — הוא לא משתתף בגזירה."),"(c·f)' = c·f'"),
        S(_("התשובה"),"","f'(x) = "+df)
      ],rule:"dbasic",hint:_("קודם הנגזרת של הפונקציה הבסיסית, והמקדם פשוט נשאר מוכפל.")};
  }
  a=rnz(-5,5);b=rnz(-5,5);
  var tk=pick(["sin","cos"]);
  var dtk=tk==="sin"?num(a)+"cos x":num(-a)+"sin x";
  return {ask:_("גזרו את הפונקציה"),expr:"f(x) = "+num(a)+tk+" x"+term(b,"x"),

      W("f'(x) = "+num(a)+tk+" x"+sgn(b),_("לא גזרתם את הפונקציה הטריגונומטרית.")),
      W("f'(x) = "+dtk,_f("שכחתם לגזור את האיבר הלינארי. הנגזרת של {0}x היא {1}.", num(b), num(b)))
    ],
    steps:[
      S(_("נגזרות טריגונומטריות"),_("(sin x)' = cos x, ו-(cos x)' = −sin x. המינוס נמצא רק אצל הקוסינוס."),
        "(sin x)' = cos x   ,   (cos x)' = −sin x"),
      S(_("גוזרים איבר איבר"),"",num(a)+tk+" x → "+dtk),
      S(_("האיבר הלינארי"),"",num(b)+"x → "+num(b)),
      S(_("מחברים"),"","f'(x) = "+dtk+sgn(b))
    ],rule:"dtrig",hint:_("סינוס גוזר לקוסינוס, וקוסינוס גוזר למינוס סינוס.")};
}

/* ---------- 3. כלל השרשרת ---------- */
function genChain(L){
  var a,b,n,steps;
  if(L===1){
    a=rnz(-5,5);b=rnz(-8,8);n=ri(2,6);
    return {ask:_("גזרו את הפונקציה"),expr:"f(x) = (" + coef(a,"x")+sgn(b)+")<sup>"+n+"</sup>",
      ans:W("f'(x) = "+num(n*a)+"("+coef(a,"x")+sgn(b)+")<sup>"+(n-1)+"</sup>"),
      wrong:[
        W("f'(x) = "+n+"("+coef(a,"x")+sgn(b)+")<sup>"+(n-1)+"</sup>",
          _f("שכחתם להכפיל בנגזרת הפנימית. הנגזרת של {0}{1} היא {2}, וצריך להכפיל בה.", coef(a,"x"), sgn(b), num(a))),
        W("f'(x) = "+num(n*a)+"("+coef(a,"x")+sgn(b)+")<sup>"+n+"</sup>",_("לא הפחתתם את המעריך.")),
        W("f'(x) = "+num(n*a)+pw("x",n-1),_("גזרתם כאילו בפנים יש רק x. הביטוי הפנימי כולו נשאר בסוגריים."))
      ],
      steps:[
        S(_("מזהים חיצוני ופנימי"),_f("החיצונית היא ״משהו בחזקת {0}״, והפנימית היא {1}{2}.", n, coef(a,"x"), sgn(b)),
          "f = uⁿ  ,  u = "+coef(a,"x")+sgn(b)),
        S(_("כלל השרשרת"),_("גוזרים את החיצונית ומשאירים את הפנימית כמו שהיא, ואז מכפילים בנגזרת הפנימית."),
          "f' = n·uⁿ⁻¹ · u'"),
        S(_("מציבים"),"","f' = "+n+"("+coef(a,"x")+sgn(b)+")<sup>"+(n-1)+"</sup> · "+num(a)),
        S(_("מסדרים"),"","f'(x) = "+num(n*a)+"("+coef(a,"x")+sgn(b)+")<sup>"+(n-1)+"</sup>")
      ],rule:"chain",hint:_("אחרי שגוזרים את החיצונית — חייבים להכפיל בנגזרת של מה שבפנים.")};
  }
  if(L===2){
    a=rnz(-5,5);b=rnz(-8,8);
    var k=pick(["exp","ln","sin"]);
    var inner=coef(a,"x")+sgn(b);
    var f,df,ws;
    if(k==="exp"){f="e<sup>"+inner+"</sup>";df=num(a)+"e<sup>"+inner+"</sup>";
      ws=[W("f'(x) = e<sup>"+inner+"</sup>",_("שכחתם את הנגזרת הפנימית. eᵘ גוזר ל-eᵘ·u′.")),
          W("f'(x) = "+num(a)+"e<sup>"+coef(a,"x")+"</sup>",_("שיניתם את המעריך. הוא נשאר בדיוק כמו שהוא.")),
          W("f'(x) = "+num(a)+"("+inner+")e<sup>"+inner+"</sup>",_("הכפלתם בביטוי הפנימי במקום בנגזרת שלו."))];}
    else if(k==="ln"){f="ln("+inner+")";df='<span class="frac"><span>'+num(a)+'</span><span>'+inner+'</span></span>';
      ws=[W('f\'(x) = <span class="frac"><span>1</span><span>'+inner+'</span></span>',_("שכחתם את הנגזרת הפנימית במונה.")),
          W('f\'(x) = <span class="frac"><span>'+num(a)+'</span><span>x</span></span>',_("המכנה הוא כל הביטוי הפנימי, לא רק x.")),
          W("f'(x) = "+num(a)+"ln("+inner+")",_("לא גזרתם את הלוגריתם."))];}
    else{f="sin("+inner+")";df=num(a)+"cos("+inner+")";
      ws=[W("f'(x) = cos("+inner+")",_("שכחתם להכפיל בנגזרת הפנימית.")),
          W("f'(x) = "+num(-a)+"cos("+inner+")",_("הוספתם מינוס. המינוס שייך לנגזרת של קוסינוס.")),
          W("f'(x) = "+num(a)+"cos x",_("הביטוי הפנימי נשאר בתוך הקוסינוס."))];}
    return {ask:_("גזרו את הפונקציה"),expr:"f(x) = "+f,ans:W("f'(x) = "+df),wrong:ws,
      steps:[
        S(_("מפרקים לשתי שכבות"),_f("הפנימית היא {0}, והנגזרת שלה היא {1}.", inner, num(a)),"u = "+inner+"  ,  u' = "+num(a)),
        S(_("גוזרים את החיצונית"),"",k==="exp"?"(eᵘ)' = eᵘ·u'":k==="ln"?"(ln u)' = u'/u":"(sin u)' = cos u · u'"),
        S(_("מציבים"),"","f'(x) = "+df)
      ],rule:"chain",hint:_("שתי שכבות: גוזרים את החיצונית על הפנימית כמו שהיא, ומכפילים בנגזרת הפנימית.")};
  }
  a=rnz(2,6);b=rnz(-9,9);
  return {ask:_("גזרו את הפונקציה"),expr:"f(x) = √(" + num(a)+"x"+sgn(b)+")",
    ans:W('f\'(x) = <span class="frac"><span>'+num(a)+'</span><span>2√('+num(a)+'x'+sgn(b)+')</span></span>'),
    wrong:[
      W('f\'(x) = <span class="frac"><span>1</span><span>2√('+num(a)+'x'+sgn(b)+')</span></span>',_f("שכחתם את הנגזרת הפנימית {0}.", num(a))),
      W('f\'(x) = <span class="frac"><span>'+num(a)+'</span><span>√('+num(a)+'x'+sgn(b)+')</span></span>',_("חסר ה-2 במכנה — שורש הוא חזקת חצי, והחצי נשאר.")),
      W('f\'(x) = <span class="frac"><span>'+num(a)+'</span><span>2√x</span></span>',_("הביטוי הפנימי נשאר שלם בתוך השורש."))
    ],
    steps:[
      S(_("כותבים את השורש כחזקה"),_("√u הוא u בחזקת חצי, וכך רואים שזה בדיוק כלל השרשרת."),"f = u^(1/2)  ,  u = "+num(a)+"x"+sgn(b)),
      S(_("גוזרים"),"","f' = ½·u^(−1/2) · u' = u' / (2√u)"),
      S(_("מציבים"),"","f'(x) = "+num(a)+" / (2√("+num(a)+"x"+sgn(b)+"))")
    ],rule:"chain",hint:_("√u גוזר ל-u′ חלקי 2√u. הנגזרת הפנימית עולה למונה.")};
}

/* ---------- 4. כלל המכפלה והמנה ---------- */
function genProdQuo(L){
  var a,b,n,steps;
  if(L===1){
    n=ri(2,4);a=rnz(-4,4);
    /* f = xⁿ · e^x  →  f' = xⁿ⁻¹·e^x·(n + x) */
    return {ask:_("גזרו את הפונקציה"),expr:"f(x) = "+pw("x",n)+"e<sup>x</sup>",
      ans:W("f'(x) = "+n+pw("x",n-1)+"e<sup>x</sup> + "+pw("x",n)+"e<sup>x</sup>"),
      wrong:[
        W("f'(x) = "+n+pw("x",n-1)+"e<sup>x</sup>",
          _("גזרתם כל גורם בנפרד והכפלתם. נגזרת של מכפלה איננה מכפלת הנגזרות — צריך שני איברים.")),
        W("f'(x) = "+pw("x",n)+"e<sup>x</sup>",_("גזרתם רק את הגורם השני.")),
        W("f'(x) = "+n+pw("x",n-1)+"e<sup>x</sup> · "+pw("x",n)+"e<sup>x</sup>",_("הכפלתם את שני האיברים במקום לחבר אותם."))
      ],
      steps:[
        S(_("כלל המכפלה"),_("(f·g)' = f'g + fg'. שני איברים, לא אחד — וזו הטעות הנפוצה ביותר כאן."),"(f·g)' = f'g + fg'"),
        S(_("מזהים את שני הגורמים"),"","f = "+pw("x",n)+"  ,  g = eˣ"),
        S(_("גוזרים כל אחד"),"","f' = "+n+pw("x",n-1)+"  ,  g' = eˣ"),
        S(_("מציבים"),"","f'(x) = "+n+pw("x",n-1)+"e<sup>x</sup> + "+pw("x",n)+"e<sup>x</sup>")
      ],rule:"prod",hint:_("נגזרת של מכפלה נותנת סכום של שני איברים.")};
  }
  if(L===2){
    a=rnz(-6,6);b=rnz(-6,6);
    /* f = (ax+b)/x  →  f' = −b/x²   (כי ax/x = a קבוע) */
    while(b===0)b=rnz(-6,6);
    return {ask:_("גזרו את הפונקציה"),
      expr:'f(x) = <span class="frac"><span>'+coef(a,"x")+sgn(b)+'</span><span>x</span></span>',
      ans:W('f\'(x) = <span class="frac"><span>'+num(-b)+'</span><span>x<sup>2</sup></span></span>'),
      wrong:[
        W('f\'(x) = <span class="frac"><span>'+num(b)+'</span><span>x<sup>2</sup></span></span>',
          _("טעות סימן. בכלל המנה המונה הוא f′g פחות fg′ — הסדר קובע את הסימן.")),
        W('f\'(x) = <span class="frac"><span>'+num(a)+'</span><span>1</span></span>',
          _("גזרתם מונה ומכנה בנפרד וחילקתם. נגזרת של מנה אינה מנת הנגזרות.")),
        W('f\'(x) = <span class="frac"><span>'+num(-b)+'</span><span>x</span></span>',
          _("שכחתם להעלות את המכנה בריבוע. בכלל המנה המכנה הוא g²."))
      ],
      steps:[
        S(_("כלל המנה"),_("(f/g)' = (f'g − fg') ÷ g². הסדר במונה קריטי, והמכנה עולה בריבוע."),"(f/g)' = (f'g − fg') / g²"),
        S(_("מזהים"),"","f = "+coef(a,"x")+sgn(b)+"  ,  g = x"),
        S(_("גוזרים"),"","f' = "+num(a)+"  ,  g' = 1"),
        S(_("מציבים במונה"),"",num(a)+"·x − ("+coef(a,"x")+sgn(b)+")·1 = "+num(-b)),
        S(_("מחלקים ב-g²"),"",'f\'(x) = '+num(-b)+' / x²')
      ],rule:"quo",hint:_("כלל המנה: f′g פחות fg′, והכול חלקי g בריבוע.")};
  }
  a=rnz(2,5);b=rnz(-6,6);
  /* f = x·ln x + b  →  f' = ln x + 1 */
  return {ask:_("גזרו את הפונקציה"),expr:"f(x) = x·ln x"+sgn(b),
    ans:W("f'(x) = ln x + 1"),
    wrong:[
      W("f'(x) = ln x",_("גזרתם רק את הגורם השני. בכלל המכפלה יש שני איברים.")),
      W('f\'(x) = <span class="frac"><span>1</span><span>x</span></span>',_("הכפלתם את הנגזרות במקום להשתמש בכלל המכפלה.")),
      W("f'(x) = ln x + 1"+sgn(b),_("האיבר החופשי נעלם בגזירה."))
    ],
    steps:[
      S(_("כלל המכפלה"),"","(f·g)' = f'g + fg'"),
      S(_("מזהים וגוזרים"),"","f = x → f' = 1   ,   g = ln x → g' = 1/x"),
      S(_("מציבים"),"","1·ln x + x·(1/x)"),
      S(_("מפשטים"),_("x כפול 1 חלקי x מצטמצם ל-1."),"f'(x) = ln x + 1")
    ],rule:"prod",hint:_("x·ln x הוא מכפלה. אחרי ההצבה, x חלקי x מצטמצם.")};
}

/* ---------- 5. נקודות קיצון ---------- */
function genExtrema(L){
  var a,b,c,r1,r2,steps;
  if(L===1){
    a=rnz(-4,4);r1=rnz(-6,6);
    b=-2*a*r1;c=rnz(-9,9);
    return {ask:_("מצאו את שיעור ה-x של נקודת הקיצון"),expr:"f(x) = "+poly([a,b,c]),
      ans:W("x = "+num(r1)),
      wrong:[
        W("x = "+num(-r1),_("טעות סימן בפתרון f′(x)=0.")),
        W("x = "+num(c),_("האיבר החופשי לא משפיע על מיקום הקיצון — הוא רק מזיז את הגרף מעלה ומטה.")),
        W("x = "+num(b),_("זה המקדם של x, לא הפתרון של המשוואה."))
      ],
      steps:[
        S(_("קיצון נמצא היכן שהנגזרת מתאפסת"),_("זו ההגדרה: בנקודת קיצון המשיק אופקי, כלומר השיפוע אפס."),"f'(x) = 0"),
        S(_("גוזרים"),"","f'(x) = "+num(2*a)+"x"+sgn(b)),
        S(_("משווים לאפס"),"",num(2*a)+"x"+sgn(b)+" = 0"),
        S(_("פותרים"),"","x = "+num(-b)+" ÷ "+pn(2*a)+" = "+num(r1))
      ],rule:"extr",hint:_("גוזרים, משווים לאפס ופותרים. האיבר החופשי לא משתתף.")};
  }
  if(L===2){
    r1=rnz(-5,5);r2=rnz(-5,5);
    while(r2===r1)r2=rnz(-5,5);
    var lo=Math.min(r1,r2),hi=Math.max(r1,r2);
    /* f' = 3(x−r1)(x−r2) = 3x² −3(r1+r2)x + 3r1r2 → f = x³ − 1.5(r1+r2)x² + 3r1r2 x */
    var B=-3*(r1+r2)/2, Cc=3*r1*r2;
    if(Math.round(B)!==B){r2=r1+2;lo=Math.min(r1,r2);hi=Math.max(r1,r2);B=-3*(r1+r2)/2;Cc=3*r1*r2}
    return {ask:_("כמה נקודות קיצון יש לפונקציה, ומהם שיעורי ה-x שלהן?"),
      expr:"f(x) = x<sup>3</sup>"+term(B,"x<sup>2</sup>")+term(Cc,"x"),
      ans:W("x = "+num(lo)+" , x = "+num(hi)),
      wrong:[
        W("x = "+num(-lo)+" , x = "+num(-hi),_("טעות סימן בפתרון המשוואה הריבועית.")),
        W("x = 0",_("הנחתם שהקיצון תמיד באפס. צריך לפתור את f′(x)=0.")),
        W("x = "+num(lo),_("מצאתם פתרון אחד. למשוואה ריבועית עם דיסקרימיננטה חיובית יש שניים."))
      ],
      steps:[
        S(_("גוזרים"),_("נגזרת של פונקציה ממעלה שלישית היא ריבועית, ולכן ייתכנו שתי נקודות קיצון."),
          "f'(x) = 3x²"+term(2*B,"x")+sgn(Cc)),
        S(_("משווים לאפס ומחלקים ב-3"),"","x²"+term(2*B/3,"x")+sgn(Cc/3)+" = 0"),
        S(_("מפרקים לגורמים"),"","(x"+sgn(-lo)+")(x"+sgn(-hi)+") = 0"),
        S(_("שני הפתרונות"),"","x = "+num(lo)+"   ,   x = "+num(hi))
      ],rule:"extr",hint:_("נגזרת של פונקציה ממעלה שלישית היא ריבועית — פותרים אותה ומקבלים עד שתי נקודות.")};
  }
  a=pick([1,-1]);r1=rnz(-6,6);
  b=-2*a*r1;c=rnz(-9,9);
  var isMin=a>0;
  return {ask:_("איזה סוג קיצון יש לפונקציה?"),expr:"f(x) = "+poly([a,b,c]),
    ans:W(isMin?_("מינימום"):_("מקסימום")),
    wrong:[
      W(isMin?_("מקסימום"):_("מינימום"),_f("הסתכלו על סימן הנגזרת השנייה: f″ = {0}, והוא {1}.", num(2*a), (isMin?_("חיובי ולכן מינימום"):_("שלילי ולכן מקסימום")))),
      W(_("נקודת פיתול"),_("נקודת פיתול היא מקום שבו הנגזרת השנייה מתאפסת. כאן היא קבועה ושונה מאפס.")),
      W(_("אין קיצון"),_("לפרבולה תמיד יש נקודת קיצון אחת."))
    ],
    steps:[
      S(_("גוזרים פעמיים"),_("הנגזרת הראשונה מוצאת את המיקום, השנייה מספרת איזה סוג."),
        "f'(x) = "+num(2*a)+"x"+sgn(b)+"   ,   f''(x) = "+num(2*a)),
      S(_("קוראים את הסימן"),_("f″ חיובי ← הפונקציה קמורה ← מינימום. f″ שלילי ← קעורה ← מקסימום."),
        "f'' = "+num(2*a)+" → "+(isMin?_("מינימום"):_("מקסימום"))),
      S(_("התשובה"),"",isMin?_("מינימום"):_("מקסימום"))
    ],rule:"extr2",hint:_("הנגזרת השנייה קובעת את הסוג: חיובית מינימום, שלילית מקסימום.")};
}

/* ---------- 6. אינטגרל לא מסוים ---------- */
function genIntegral(L){
  var a,n,b,steps;
  if(L===1){
    a=rnz(-6,6);n=ri(1,5);b=rnz(-8,8);
    var co=fr(a,n+1);
    return {ask:_("חשבו את האינטגרל"),expr:"∫ ("+num(a)+pw("x",n)+sgn(b)+") dx",
      ans:W(co.html()+pw("x",n+1)+term(b,"x")+" + C"),
      wrong:[
        W(co.html()+pw("x",n+1)+term(b,"x"),_("שכחתם את קבוע האינטגרציה. באינטגרל לא מסוים חייבים +C.")),
        W(num(a)+pw("x",n+1)+term(b,"x")+" + C",_("העליתם את החזקה אבל לא חילקתם בחזקה החדשה.")),
        W(num(a*n)+pw("x",n-1)+sgn(b)+" + C",_("גזרתם במקום לאנטגרל. הפעולות הפוכות זו לזו."))
      ],
      steps:[
        S(_("כלל האינטגרל של חזקה"),_("∫xⁿ dx = xⁿ⁺¹ ÷ (n+1) + C — החזקה עולה באחת ומחלקים בחזקה החדשה."),
          "∫xⁿ dx = xⁿ⁺¹/(n+1) + C"),
        S(_("מאנטגרלים איבר איבר"),"",num(a)+pw("x",n)+" → "+co.html()+pw("x",n+1)),
        S(_("האיבר הקבוע"),"",num(b)+" → "+num(b)+"x"),
        S(_("לא שוכחים את C"),_("אינטגרל לא מסוים מייצג משפחה שלמה של פונקציות, ולכן תמיד מוסיפים קבוע."),
          co.html()+pw("x",n+1)+term(b,"x")+" + C")
      ],rule:"intpow",hint:_("החזקה עולה באחת ומחלקים בה. ותמיד +C.")};
  }
  if(L===2){
    a=rnz(-5,5);
    var k=pick(["exp","inv","sin","cos"]);
    var f,F,ws;
    if(k==="exp"){f=num(a)+"e<sup>x</sup>";F=num(a)+"e<sup>x</sup> + C";
      ws=[W(num(a)+"e<sup>x</sup>",_("חסר קבוע האינטגרציה.")),
          W(fr(a,2).html()+"e<sup>2x</sup> + C",_("הוספתם חזקה שלא קיימת. eˣ הוא האינטגרל של עצמו.")),
          W(num(a)+"x·e<sup>x</sup> + C",_("התייחסתם ל-eˣ כמו לחזקה של x."))];}
    else if(k==="inv"){f='<span class="frac"><span>'+num(a)+'</span><span>x</span></span>';F=num(a)+"ln|x| + C";
      ws=[W(num(a)+"ln x + C",_("הערך המוחלט חשוב: ln מוגדר רק לחיוביים, והאינטגרל תקף גם לשליליים.")),
          W(fr(a,2).html()+"x<sup>−2</sup> + C",_("הפעלתם את כלל החזקה. הוא לא תקף כאשר החזקה היא מינוס אחת.")),
          W('<span class="frac"><span>'+num(-a)+'</span><span>x<sup>2</sup></span></span> + C',_("גזרתם במקום לאנטגרל."))];}
    else if(k==="sin"){f=num(a)+"sin x";F=num(-a)+"cos x + C";
      ws=[W(num(a)+"cos x + C",_("חסר המינוס. האינטגרל של סינוס הוא מינוס קוסינוס.")),
          W(num(a)+"sin x + C",_("לא ביצעתם אינטגרציה.")),
          W(num(a)+"cos x",_("גם המינוס וגם ה-C חסרים."))];}
    else{f=num(a)+"cos x";F=num(a)+"sin x + C";
      ws=[W(num(-a)+"sin x + C",_("הוספתם מינוס. המינוס שייך לאינטגרל של סינוס, לא של קוסינוס.")),
          W(num(-a)+"cos x + C",_("זו הנגזרת, לא האינטגרל.")),
          W(num(a)+"sin x",_("חסר קבוע האינטגרציה."))];}
    return {ask:_("חשבו את האינטגרל"),expr:"∫ "+f+" dx",ans:W(F),wrong:ws,
      steps:[
        S(_("אינטגרל הוא הפעולה ההפוכה לגזירה"),_("שואלים: איזו פונקציה גוזרת למה שכתוב כאן?"),
          k==="exp"?"(eˣ)' = eˣ":k==="inv"?"(ln|x|)' = 1/x":k==="sin"?"(−cos x)' = sin x":"(sin x)' = cos x"),
        S(_("המקדם נשאר"),"","∫c·f = c·∫f"),
        S(_("ומוסיפים C"),"",F)
      ],rule:"intbasic",hint:_("שואלים איזו פונקציה גוזרת לזה, ולא שוכחים את הקבוע.")};
  }
  a=rnz(2,5);b=rnz(-8,8);n=ri(2,4);
  return {ask:_("חשבו את האינטגרל"),expr:"∫ ("+num(a)+"x"+sgn(b)+")<sup>"+n+"</sup> dx",
    ans:W('<span class="frac"><span>('+num(a)+'x'+sgn(b)+')<sup>'+(n+1)+'</sup></span><span>'+(a*(n+1))+'</span></span> + C'),
    wrong:[
      W('<span class="frac"><span>('+num(a)+'x'+sgn(b)+')<sup>'+(n+1)+'</sup></span><span>'+(n+1)+'</span></span> + C',
        _f("חילקתם רק בחזקה החדשה ושכחתם לחלק גם בנגזרת הפנימית {0}.", num(a))),
      W("("+num(a)+"x"+sgn(b)+")<sup>"+(n+1)+"</sup> + C",_("לא חילקתם בכלל.")),
      W(num(a*n)+"("+num(a)+"x"+sgn(b)+")<sup>"+(n-1)+"</sup> + C",_("גזרתם במקום לאנטגרל."))
    ],
    steps:[
      S(_("הצבה"),_f("מסמנים u = {0}x{1}, ואז du = {2}dx, כלומר dx = du/{3}.", num(a), sgn(b), num(a), num(a)),
        "u = "+num(a)+"x"+sgn(b)),
      S(_("מחליפים משתנה"),"","∫ uⁿ du / "+num(a)),
      S(_("מאנטגרלים"),"","u<sup>"+(n+1)+"</sup> / ("+num(a)+"·"+(n+1)+")"),
      S(_("חוזרים ל-x"),"","("+num(a)+"x"+sgn(b)+")<sup>"+(n+1)+"</sup> / "+(a*(n+1))+" + C")
    ],rule:"intsub",hint:_("מחלקים גם בחזקה החדשה וגם בנגזרת הפנימית.")};
}

/* ---------- 7. אינטגרל מסוים ושטח ---------- */
function genDefInt(L){
  var a,b,n,lo,hi,steps;
  if(L===1){
    n=ri(1,3);a=rnz(1,4);lo=ri(0,2);hi=lo+ri(1,3);
    var F=function(x){return a*Math.pow(x,n+1)/(n+1)};
    var val=F(hi)-F(lo);
    if(Math.round(val*6)!==val*6){a=n+1;val=F(hi)-F(lo)}
    val=a*(Math.pow(hi,n+1)-Math.pow(lo,n+1))/(n+1);
    return {ask:_("חשבו את האינטגרל המסוים"),
      expr:"∫<sub>"+lo+"</sub><sup>"+hi+"</sup> "+(a===1?"":num(a))+pw("x",n)+" dx",
      ans:W(num(Math.round(val*1000)/1000)),
      wrong:[
        W(num(Math.round((F(lo)-F(hi))*1000)/1000),_("הפכתם את סדר הגבולות. מציבים את הגבול העליון פחות התחתון.")),
        W(num(Math.round(F(hi)*1000)/1000),_("הצבתם רק את הגבול העליון ושכחתם לחסר את התחתון.")),
        W(num(a*(Math.pow(hi,n)-Math.pow(lo,n))),_("הצבתם בפונקציה המקורית במקום בפונקציה הקדומה."))
      ],
      steps:[
        S(_("מוצאים פונקציה קדומה"),_("באינטגרל מסוים אין צורך ב-C — הוא מתבטל בחיסור."),
          "F(x) = "+fr(a,n+1).html()+pw("x",n+1)),
        S(_("משפט ניוטון־לייבניץ"),_("מציבים את הגבול העליון ומחסרים את התחתון."),"F("+hi+") − F("+lo+")"),
        S(_("מציבים"),"",num(Math.round(F(hi)*1000)/1000)+" − "+pn(Math.round(F(lo)*1000)/1000)),
        S(_("מחשבים"),"",num(Math.round(val*1000)/1000))
      ],rule:"defint",hint:_("פונקציה קדומה, ואז עליון פחות תחתון.")};
  }
  if(L===2){
    a=ri(1,4);hi=ri(2,5);
    /* שטח מתחת ל-y = a·x בין 0 ל-hi — משולש, כדי שאפשר לבדוק גיאומטרית */
    var area=a*hi*hi/2;
    return {ask:_f("חשבו את השטח הכלוא בין הפונקציה, ציר ה-x והישרים x=0 ו-x={0}", hi),
      expr:"y = "+coef(a,"x"),
      ans:W(num(area)),
      wrong:[
        W(num(a*hi),_("זה ערך הפונקציה בנקודה, לא השטח.")),
        W(num(a*hi*hi),_("שכחתם לחלק ב-2 — האינטגרל של ax הוא ax²/2.")),
        W(num(hi*hi/2),_f("איבדתם את המקדם {0}.", a))
      ],
      steps:[
        S(_("שטח הוא אינטגרל מסוים"),_("כשהפונקציה חיובית בקטע, השטח שווה בדיוק לאינטגרל."),
          "S = ∫<sub>0</sub><sup>"+hi+"</sup> "+coef(a,"x")+" dx"),
        S(_("פונקציה קדומה"),"","F(x) = "+fr(a,2).html()+"x²"),
        S(_("מציבים גבולות"),"","F("+hi+") − F(0) = "+num(area)+" − 0"),
        S(_("בדיקה גיאומטרית"),_f("הצורה כאן היא משולש עם בסיס {0} וגובה {1}, ושטחו {2} — מתאים.", hi, num(a*hi), num(area)),
          "S = "+num(area))
      ],rule:"area",hint:_("שטח מתחת לגרף הוא האינטגרל המסוים בין הגבולות.")};
  }
  a=ri(1,3);lo=-ri(1,3);hi=ri(1,3);
  /* אינטגרל של פונקציה אי־זוגית בקטע סימטרי מתאפס */
  return {ask:_("חשבו את האינטגרל המסוים"),
    expr:"∫<sub>"+num(-hi)+"</sub><sup>"+hi+"</sup> "+(a===1?"":num(a))+"x<sup>3</sup> dx",
    ans:W("0"),
    wrong:[
      W(num(a*Math.pow(hi,4)/2),_("חישבתם רק את החלק החיובי. בקטע סימטרי החלק השלילי מבטל אותו.")),
      W(num(a*Math.pow(hi,4)/4),_("זה הערך של הפונקציה הקדומה בגבול העליון, לא ההפרש.")),
      W(num(2*a*Math.pow(hi,4)/4),_("חיברתם את שני החלקים במקום לחסר."))
    ],
    steps:[
      S(_("שמים לב לסימטריה"),_("x³ היא פונקציה אי־זוגית: f(−x) = −f(x). הקטע סימטרי סביב אפס."),
        "f(−x) = −f(x)"),
      S(_("מה זה אומר"),_("כל תרומה מצד ימין מתקזזת בדיוק מול צד שמאל."),_("∫ מקטע סימטרי = 0")),
      S(_("בדיקה בחישוב"),"","F(x) = "+fr(a,4).html()+"x⁴  →  F("+hi+") − F("+num(-hi)+") = 0")
    ],rule:"defint",hint:_("פונקציה אי־זוגית בקטע סימטרי סביב אפס — האינטגרל מתאפס.")};
}

/* ---------- 8. פעולות במטריצות ---------- */
function genMatOps(L){
  var A,B,i,j,steps;
  function m2(){return [[rnz(-6,6),rnz(-6,6)],[rnz(-6,6),rnz(-6,6)]]}
  if(L===1){
    A=m2();B=m2();
    var S1=[[A[0][0]+B[0][0],A[0][1]+B[0][1]],[A[1][0]+B[1][0],A[1][1]+B[1][1]]];
    return {ask:_("חשבו את סכום המטריצות"),expr:mat(A)+" + "+mat(B),ans:W(mat(S1)),
      wrong:[
        W(mat([[A[0][0]-B[0][0],A[0][1]-B[0][1]],[A[1][0]-B[1][0],A[1][1]-B[1][1]]]),_("חיסרתם במקום לחבר.")),
        W(mat([[A[0][0]+B[0][0],A[0][1]+B[1][0]],[A[1][0]+B[0][1],A[1][1]+B[1][1]]]),_("החלפתם אינדקסים באלכסון. בחיבור כל איבר מתחבר עם האיבר שבאותו מקום בדיוק.")),
        W(mat([[A[0][0]*B[0][0],A[0][1]*B[0][1]],[A[1][0]*B[1][0],A[1][1]*B[1][1]]]),_("הכפלתם איבר באיבר. זו לא הפעולה שנדרשה, וגם לא כפל מטריצות."))
      ],
      steps:[
        S(_("חיבור מטריצות הוא איבר־איבר"),_("זו הפעולה הפשוטה מבין השתיים: כל איבר מתחבר עם זה שבאותו מקום."),
          "(A+B)ᵢⱼ = Aᵢⱼ + Bᵢⱼ"),
        S(_("שורה ראשונה"),"",num(A[0][0])+" + "+pn(B[0][0])+" = "+num(A[0][0]+B[0][0])+"   ,   "+num(A[0][1])+" + "+pn(B[0][1])+" = "+num(A[0][1]+B[0][1])),
        S(_("שורה שנייה"),"",num(A[1][0])+" + "+pn(B[1][0])+" = "+num(A[1][0]+B[1][0])+"   ,   "+num(A[1][1])+" + "+pn(B[1][1])+" = "+num(A[1][1]+B[1][1])),
        S(_("התוצאה"),"",mat(S1))
      ],rule:"matadd",hint:_("בחיבור מטריצות כל איבר מתחבר עם האיבר שבאותו מקום.")};
  }
  if(L===2){
    A=m2();var k=rnz(-5,5);
    var K=[[A[0][0]*k,A[0][1]*k],[A[1][0]*k,A[1][1]*k]];
    return {ask:_("חשבו"),expr:num(k)+" · "+mat(A),ans:W(mat(K)),
      wrong:[
        W(mat([[A[0][0]*k,A[0][1]],[A[1][0],A[1][1]]]),_("הכפלתם רק את האיבר הראשון. בכפל בסקלר כל איבר מוכפל.")),
        W(mat([[A[0][0]+k,A[0][1]+k],[A[1][0]+k,A[1][1]+k]]),_("חיברתם את הסקלר לכל איבר במקום להכפיל בו.")),
        W(mat([[A[0][0]*k,A[0][1]*k],[A[1][0],A[1][1]]]),_("הכפלתם רק את השורה הראשונה."))
      ],
      steps:[
        S(_("כפל בסקלר"),_("כל איבר במטריצה מוכפל במספר — בלי יוצאים מן הכלל."),"(cA)ᵢⱼ = c·Aᵢⱼ"),
        S(_("מכפילים"),"",num(k)+"·"+pn(A[0][0])+" = "+num(A[0][0]*k)+"   ,   "+num(k)+"·"+pn(A[0][1])+" = "+num(A[0][1]*k)),
        S(_("וכך בשורה השנייה"),"",num(k)+"·"+pn(A[1][0])+" = "+num(A[1][0]*k)+"   ,   "+num(k)+"·"+pn(A[1][1])+" = "+num(A[1][1]*k)),
        S(_("התוצאה"),"",mat(K))
      ],rule:"matadd",hint:_("סקלר מוכפל בכל אחד מאיברי המטריצה.")};
  }
  A=[[rnz(-4,4),rnz(-4,4)],[rnz(-4,4),rnz(-4,4)]];
  B=[[rnz(-4,4),rnz(-4,4)],[rnz(-4,4),rnz(-4,4)]];
  var P=[[A[0][0]*B[0][0]+A[0][1]*B[1][0], A[0][0]*B[0][1]+A[0][1]*B[1][1]],
         [A[1][0]*B[0][0]+A[1][1]*B[1][0], A[1][0]*B[0][1]+A[1][1]*B[1][1]]];
  var elem=[[A[0][0]*B[0][0],A[0][1]*B[0][1]],[A[1][0]*B[1][0],A[1][1]*B[1][1]]];
  var BA=[[B[0][0]*A[0][0]+B[0][1]*A[1][0], B[0][0]*A[0][1]+B[0][1]*A[1][1]],
          [B[1][0]*A[0][0]+B[1][1]*A[1][0], B[1][0]*A[0][1]+B[1][1]*A[1][1]]];
  return {ask:_("חשבו את מכפלת המטריצות"),expr:mat(A)+" · "+mat(B),ans:W(mat(P)),
    wrong:[
      W(mat(elem),_("הכפלתם איבר באיבר. בכפל מטריצות כל איבר בתוצאה הוא מכפלה סקלרית של שורה בעמודה.")),
      W(mat(BA),_("הכפלתם בסדר ההפוך. כפל מטריצות אינו חילופי — A·B ו-B·A בדרך כלל שונים.")),
      W(mat([[P[0][0],P[1][0]],[P[0][1],P[1][1]]]),_("שחלפתם את התוצאה — החלפתם בין שורות לעמודות."))
    ],
    steps:[
      S(_("כל איבר הוא שורה כפול עמודה"),_("האיבר במקום (i,j) נבנה משורה i של A ומעמודה j של B — לא מהאיברים שבאותו מקום."),
        "Cᵢⱼ = Σ Aᵢₖ·Bₖⱼ"),
      S(_("האיבר בפינה השמאלית העליונה"),"",num(A[0][0])+"·"+pn(B[0][0])+" + "+num(A[0][1])+"·"+pn(B[1][0])+" = "+num(P[0][0])),
      S(_("וכך שאר האיברים"),"",num(P[0][1])+"  ,  "+num(P[1][0])+"  ,  "+num(P[1][1])),
      S(_("התוצאה"),"",mat(P))
    ],rule:"matmul",hint:_("שורה של הראשונה כפול עמודה של השנייה, איבר איבר ומחברים.")};
}

/* ---------- 9. דטרמיננטה ---------- */
function genDet(L){
  var a,b,c,d,steps;
  if(L===1){
    a=rnz(-8,8);b=rnz(-8,8);c=rnz(-8,8);d=rnz(-8,8);
    var det=a*d-b*c;
    return {ask:_("חשבו את הדטרמיננטה"),expr:"det "+mat([[a,b],[c,d]]),ans:W(num(det)),
      wrong:[
        W(num(a*d+b*c),_("חיברתם את שתי המכפלות. באלכסון המשני יש מינוס.")),
        W(num(b*c-a*d),_("הפכתם את הסדר. מתחילים מהאלכסון הראשי ומחסרים ממנו את המשני.")),
        W(num(a*b-c*d),_("הכפלתם שורות במקום אלכסונים."))
      ],
      steps:[
        S(_("נוסחת הדטרמיננטה למטריצה 2×2"),_("מכפלת האלכסון הראשי פחות מכפלת האלכסון המשני."),"det = ad − bc"),
        S(_("האלכסון הראשי"),"",num(a)+"·"+pn(d)+" = "+num(a*d)),
        S(_("האלכסון המשני"),"",num(b)+"·"+pn(c)+" = "+num(b*c)),
        S(_("מחסרים"),"",num(a*d)+" − "+pn(b*c)+" = "+num(det))
      ],rule:"det2",hint:_("אלכסון ראשי פחות אלכסון משני.")};
  }
  if(L===2){
    var M=[[rnz(-4,4),rnz(-4,4),rnz(-4,4)],[rnz(-4,4),rnz(-4,4),rnz(-4,4)],[rnz(-4,4),rnz(-4,4),rnz(-4,4)]];
    var p1=M[0][0]*(M[1][1]*M[2][2]-M[1][2]*M[2][1]);
    var p2=M[0][1]*(M[1][0]*M[2][2]-M[1][2]*M[2][0]);
    var p3=M[0][2]*(M[1][0]*M[2][1]-M[1][1]*M[2][0]);
    var det3=p1-p2+p3;
    return {ask:_("חשבו את הדטרמיננטה"),expr:"det "+mat(M),ans:W(num(det3)),
      wrong:[
        W(num(p1+p2+p3),_("חיברתם את שלושת האיברים. בפיתוח לפי שורה הסימנים מתחלפים: פלוס, מינוס, פלוס.")),
        W(num(p1-p2-p3),_("הסימן של האיבר השלישי צריך להיות פלוס.")),
        W(num(M[0][0]*M[1][1]*M[2][2]),_("הכפלתם רק את האלכסון הראשי. זה נכון רק במטריצה משולשת."))
      ],
      steps:[
        S(_("מפתחים לפי השורה הראשונה"),_("כל איבר מוכפל בדטרמיננטה של המטריצה שנשארת כשמוחקים את שורתו ועמודתו."),
          "det = a₁₁·M₁₁ − a₁₂·M₁₂ + a₁₃·M₁₃"),
        S(_("שימו לב לסימנים"),_("הם מתחלפים: פלוס, מינוס, פלוס. זה מקור טעות נפוץ מאוד."),"+ , − , +"),
        S(_("שלושת האיברים"),"",num(p1)+"  ,  "+num(p2)+"  ,  "+num(p3)),
        S(_("מחברים לפי הסימנים"),"",num(p1)+" − "+pn(p2)+" + "+pn(p3)+" = "+num(det3))
      ],rule:"det3",hint:_("פיתוח לפי שורה, וסימנים מתחלפים פלוס מינוס פלוס.")};
  }
  a=rnz(-6,6);b=rnz(-6,6);c=rnz(-6,6);d=rnz(-6,6);
  var D=a*d-b*c,k=rnz(2,4);
  return {ask:_f("נתון שהדטרמיננטה של מטריצה A בגודל 2×2 היא {0}. מהי הדטרמיננטה של {1}A?", num(D), k),
    expr:"det("+k+"A) = ?",ans:W(num(k*k*D)),
    wrong:[
      W(num(k*D),_("הכפלתם ב-k פעם אחת. כפל בסקלר מכפיל כל שורה, ובמטריצה n×n יש n שורות — לכן k בחזקת n.")),
      W(num(D),_("כפל בסקלר כן משנה את הדטרמיננטה.")),
      W(num(k*k*k*D),_("החזקה היא לפי סדר המטריצה. כאן 2×2, ולכן k בריבוע."))
    ],
    steps:[
      S(_("מה קורה כשמכפילים מטריצה בסקלר"),_("כל אחת מהשורות מוכפלת ב-k, וכל שורה כזאת מוציאה k מחוץ לדטרמיננטה."),
        "det(kA) = kⁿ · det(A)"),
      S(_("כאן n שווה 2"),"",	"det("+k+"A) = "+k+"² · "+num(D)),
      S(_("מחשבים"),"",num(k*k)+" · "+num(D)+" = "+num(k*k*D))
    ],rule:"detprop",hint:_("det(kA) = k בחזקת סדר המטריצה, כפול det(A).")};
}

/* ---------- 10. מטריצה הופכית ---------- */
function genInverse(L){
  var a,b,c,d,steps;
  if(L===1){
    /* det = 1 כדי שההופכית תצא שלמה */
    a=rnz(-4,4);b=rnz(-4,4);
    var tries=0;c=rnz(-4,4);d=0;
    while(tries<200){c=rnz(-4,4);if(a!==0&&(1+b*c)%a===0){d=(1+b*c)/a;if(Math.abs(d)<=9)break}tries++}
    if(tries>=200){a=1;b=2;c=1;d=3}
    var det=a*d-b*c;
    var inv=[[d/det,-b/det],[-c/det,a/det]];
    return {ask:_("מצאו את המטריצה ההופכית"),expr:"A = "+mat([[a,b],[c,d]]),ans:W(mat(inv)),
      wrong:[
        W(mat([[a,-b],[-c,d]]),_("החלפתם סימנים אבל לא החלפתם בין האיברים שעל האלכסון הראשי.")),
        W(mat([[d,b],[c,a]]),_("החלפתם בין a ל-d אבל שכחתם את המינוסים על האלכסון המשני.")),
        W(mat([[1/a,1/b],[1/c,1/d]].map(function(r){return r.map(function(v){return Math.round(v*100)/100})})),
          _("הפכתם כל איבר בנפרד. הופכית של מטריצה איננה מטריצת ההופכיים."))
      ],
      steps:[
        S(_("בודקים שהמטריצה הפיכה"),_("מטריצה הפיכה אם ורק אם הדטרמיננטה שלה שונה מאפס."),"det = "+num(a)+"·"+pn(d)+" − "+pn(b)+"·"+pn(c)+" = "+num(det)),
        S(_("נוסחת ההופכית ל-2×2"),_("מחליפים בין a ל-d, הופכים סימן ל-b ול-c, ומחלקים בדטרמיננטה."),
          "A⁻¹ = (1/det)·[[d, −b], [−c, a]]"),
        S(_("מציבים"),"",mat([[d,-b],[-c,a]])),
        S(_f("הדטרמיננטה כאן היא {0}", num(det)),"","A⁻¹ = "+mat(inv))
      ],rule:"inv2",hint:_("מחליפים a ו-d, הופכים סימן ל-b ול-c, ומחלקים בדטרמיננטה.")};
  }
  if(L===2){
    a=rnz(-5,5);b=rnz(-5,5);c=rnz(-5,5);d=rnz(-5,5);
    var D2=a*d-b*c;
    while(D2===0){d=rnz(-5,5);D2=a*d-b*c}
    return {ask:_("מהי הדטרמיננטה שבמכנה של המטריצה ההופכית?"),expr:"A = "+mat([[a,b],[c,d]]),
      ans:W(num(D2)),
      wrong:[
        W(num(a*d+b*c),_("סימן שגוי — האלכסון המשני מחוסר.")),
        W(num(a+d),_("זה העקבה, סכום האלכסון הראשי, ולא הדטרמיננטה.")),
        W(num(1/D2===Math.round(1/D2)?1/D2:Math.round(100/D2)/100),_("זה כבר ההופכי של הדטרמיננטה. השאלה מבקשת אותה עצמה."))
      ],
      steps:[
        S(_("ההופכית מוגדרת רק כשהדטרמיננטה שונה מאפס"),_("היא מופיעה במכנה, ולכן אפס היה הופך את הביטוי לחסר משמעות."),
          "A⁻¹ = (1/det)·adj(A)"),
        S(_("מחשבים"),"",	"det = "+num(a)+"·"+pn(d)+" − "+pn(b)+"·"+pn(c)),
        S(_("התוצאה"),"",num(D2))
      ],rule:"inv2",hint:_("הדטרמיננטה היא ad פחות bc, והיא זו שיושבת במכנה.")};
  }
  a=rnz(-5,5);b=rnz(-5,5);
  var k2=rnz(2,4);c=a*k2;d=b*k2;    /* שורות תלויות → det = 0 */
  return {ask:_("האם המטריצה הפיכה?"),expr:"A = "+mat([[a,b],[c,d]]),
    ans:W(_("לא הפיכה")),
    wrong:[
      W(_("הפיכה"),_f("הדטרמיננטה כאן היא אפס: השורה השנייה היא בדיוק פי {0} מהראשונה, ולכן השורות תלויות לינארית.", k2)),
      W(_("הפיכה רק אם a שונה מאפס"),_("התנאי היחיד הוא שהדטרמיננטה תהיה שונה מאפס, ולא תנאי על איבר בודד.")),
      W(_("אי אפשר לדעת"),_("אפשר בהחלט — מחשבים דטרמיננטה ובודקים אם היא אפס."))
    ],
    steps:[
      S(_("התנאי להפיכות"),_("מטריצה הפיכה אם ורק אם הדטרמיננטה שלה שונה מאפס."),_("A הפיכה ⇔ det(A) ≠ 0")),
      S(_("מחשבים"),"",	"det = "+num(a)+"·"+pn(d)+" − "+pn(b)+"·"+pn(c)+" = "+num(a*d-b*c)),
      S(_("מה זה אומר"),_f("השורה השנייה היא פי {0} מהראשונה — השורות תלויות, ולכן הדטרמיננטה מתאפסת.", k2),
        _("det = 0 → לא הפיכה"))
    ],rule:"inv2",hint:_("בודקים דטרמיננטה. אפס פירושו שהשורות תלויות ואין הופכית.")};
}

/* ---------- 11. מערכת משוואות ודירוג ---------- */
function genLinEq(L){
  var x,y,a1,b1,c1,a2,b2,c2,steps;
  if(L===1){
    x=rnz(-7,7);y=rnz(-7,7);
    a1=rnz(-4,4);b1=rnz(-4,4);a2=rnz(-4,4);b2=rnz(-4,4);
    var t=0;
    while(a1*b2-a2*b1===0&&t<60){a2=rnz(-4,4);b2=rnz(-4,4);t++}
    if(a1*b2-a2*b1===0){a1=1;b1=1;a2=1;b2=-1}
    c1=a1*x+b1*y;c2=a2*x+b2*y;
    return {ask:_("פתרו את המערכת"),
      expr:coef(a1,"x")+term(b1,"y")+" = "+num(c1)+"<br>"+coef(a2,"x")+term(b2,"y")+" = "+num(c2),
      ans:W("x = "+num(x)+" , y = "+num(y)),
      wrong:[
        W("x = "+num(y)+" , y = "+num(x),_("החלפתם בין הנעלמים בסוף.")),
        W("x = "+num(-x)+" , y = "+num(y),_("טעות סימן בשלב הסילוק.")),
        W(_("אין פתרון"),_f("הדטרמיננטה של מטריצת המקדמים היא {0}, שונה מאפס, ולכן יש פתרון יחיד.", num(a1*b2-a2*b1)))
      ],
      steps:[
        S(_("כותבים כמטריצה מורחבת"),_("זו בדיוק אותה מערכת, רק בלי לכתוב שוב ושוב x ו-y."),
          mat([[a1,b1,c1],[a2,b2,c2]])),
        S(_("מסלקים נעלם"),_("מכפילים שורות כך שמקדמי y יתבטלו בחיבור."),
          num(a1*b2-a2*b1)+"x = "+num(c1*b2-c2*b1)),
        S(_("מוצאים x"),"","x = "+num(x)),
        S(_("מציבים חזרה ומוצאים y"),"","y = "+num(y))
      ],rule:"gauss",hint:_("מסלקים נעלם אחד, פותרים לשני, ומציבים חזרה.")};
  }
  if(L===2){
    a1=rnz(-4,4);b1=rnz(-4,4);
    var k=rnz(2,3);
    var kind=pick(["one","none","inf"]);
    a2=a1*k;b2=b1*k;c1=rnz(-9,9);
    if(kind==="one"){a2=b1;b2=-a1;c2=rnz(-9,9)}     /* דטרמיננטה שונה מאפס */
    else if(kind==="inf"){c2=c1*k}
    else{c2=c1*k+rnz(1,4)}
    var ansTxt=kind==="one"?_("פתרון יחיד"):kind==="inf"?_("אינסוף פתרונות"):_("אין פתרון");
    var det=a1*b2-a2*b1;
    return {ask:_("כמה פתרונות יש למערכת?"),
      expr:coef(a1,"x")+term(b1,"y")+" = "+num(c1)+"<br>"+coef(a2,"x")+term(b2,"y")+" = "+num(c2),
      ans:W(ansTxt),
      wrong:[_("פתרון יחיד"),_("אינסוף פתרונות"),_("אין פתרון")].filter(function(v){return v!==ansTxt})
        .map(function(v){return W(v,
          kind==="one"?_f("הדטרמיננטה היא {0}, שונה מאפס, ולכן הפתרון יחיד.", num(det))
          :kind==="inf"?_f("המשוואה השנייה היא בדיוק המשוואה הראשונה כפול {0} — אותה משוואה פעמיים, ולכן אינסוף פתרונות.", k)
          :_("המקדמים פרופורציוניים אבל האגפים הימניים לא — שתי משוואות סותרות, ולכן אין פתרון."))}),
      steps:[
        S(_("בודקים את הדטרמיננטה"),_("det שונה מאפס פירושו פתרון יחיד. det אפס דורש בדיקה נוספת."),
          "det = "+num(a1)+"·"+pn(b2)+" − "+pn(a2)+"·"+pn(b1)+" = "+num(det)),
        S(det!==0?_("דטרמיננטה שונה מאפס"):_("דטרמיננטה מתאפסת"),
          det!==0?_("השורות בלתי תלויות, והמערכת נחתכת בנקודה אחת בדיוק.")
                 :_("השורות פרופורציוניות. עכשיו בודקים אם גם האגפים הימניים באותו יחס."),
          det!==0?_("פתרון יחיד"):(kind==="inf"?_f("גם האגפים ביחס {0} → אותה משוואה", k):_("האגפים לא ביחס → סתירה"))),
        S(_("התשובה"),"",ansTxt)
      ],rule:"gauss",hint:_("דטרמיננטה שונה מאפס — פתרון יחיד. אפס — בודקים אם המשוואות זהות או סותרות.")};
  }
  a1=rnz(-4,4);b1=rnz(-4,4);
  var k3=rnz(2,4);a2=a1*k3;b2=b1*k3;
  return {ask:_("למערכת ההומוגנית הבאה יש פתרון לא טריוויאלי. מדוע?"),
    expr:coef(a1,"x")+term(b1,"y")+" = 0<br>"+coef(a2,"x")+term(b2,"y")+" = 0",
    ans:W(_("כי הדטרמיננטה מתאפסת")),
    wrong:[
      W(_("כי האגפים הימניים אפס"),_("לכל מערכת הומוגנית יש אגף ימני אפס, וברוב המקרים הפתרון היחיד הוא הטריוויאלי.")),
      W(_("כי יש שתי משוואות ושני נעלמים"),_("מספר שווה של משוואות ונעלמים דווקא מרמז על פתרון יחיד.")),
      W(_("כי המקדמים שליליים"),_("סימן המקדמים לא קובע דבר בעניין הזה."))
    ],
    steps:[
      S(_("מערכת הומוגנית תמיד פתירה"),_("הפתרון x=0, y=0 תמיד מקיים אותה. השאלה היא אם יש גם פתרון אחר."),
        _("x = 0 , y = 0 תמיד פתרון")),
      S(_("מתי יש פתרון נוסף"),_("בדיוק כאשר הדטרמיננטה מתאפסת, כלומר כשהשורות תלויות לינארית."),
        "det = "+num(a1*b2-a2*b1)),
      S(_("כאן"),_f("השורה השנייה היא פי {0} מהראשונה, ולכן יש למעשה משוואה אחת ואינסוף פתרונות.", k3),
        _("פתרון לא טריוויאלי קיים"))
    ],rule:"gauss",hint:_("למערכת הומוגנית יש פתרון לא טריוויאלי בדיוק כשהדטרמיננטה אפס.")};
}

/* ---------- 12. וקטורים ---------- */
function genVectors(L){
  var u,v,steps;
  var TRIP=[[3,4,5],[6,8,10],[5,12,13],[8,15,17],[9,12,15],[7,24,25]];
  if(L===1){
    var t=pick(TRIP);
    u=[t[0]*pick([1,-1]),t[1]*pick([1,-1])];
    return {ask:_("חשבו את אורך הווקטור"),expr:"u = "+vecH(u),ans:W(String(t[2])),
      wrong:[
        W(num(Math.abs(u[0])+Math.abs(u[1])),_("חיברתם את הרכיבים. האורך מחושב לפי פיתגורס, על הריבועים.")),
        W(num(t[2]*t[2]),_("עצרתם לפני הוצאת השורש.")),
        W(num(Math.abs(u[0]*u[1])),_("הכפלתם את הרכיבים."))
      ],
      steps:[
        S(_("נורמה היא פיתגורס"),_("האורך הוא שורש סכום ריבועי הרכיבים. הסימנים נעלמים בהעלאה בריבוע."),
          "|u| = √(u₁² + u₂²)"),
        S(_("מציבים"),"","√("+pn(u[0])+"² + "+pn(u[1])+"²) = √("+(u[0]*u[0])+" + "+(u[1]*u[1])+")"),
        S(_("מחשבים"),"","√"+(t[2]*t[2])+" = "+t[2])
      ],rule:"norm",hint:_("אורך וקטור = שורש של סכום ריבועי הרכיבים.")};
  }
  if(L===2){
    u=[rnz(-6,6),rnz(-6,6)];v=[rnz(-6,6),rnz(-6,6)];
    var dot=u[0]*v[0]+u[1]*v[1];
    return {ask:_("חשבו את המכפלה הסקלרית"),expr:"u = "+vecH(u)+" ,  v = "+vecH(v),
      ans:W(num(dot)),
      wrong:[
        W(vecH([u[0]*v[0],u[1]*v[1]]),_("התוצאה של מכפלה סקלרית היא מספר, לא וקטור. אחרי הכפל מחברים.")),
        W(num(u[0]*v[0]-u[1]*v[1]),_("חיסרתם בין המכפלות. במכפלה סקלרית מחברים.")),
        W(num(u[0]*v[1]+u[1]*v[0]),_("הצלבתם רכיבים. מכפילים רכיב ראשון ברכיב ראשון ושני בשני."))
      ],
      steps:[
        S(_("הגדרת המכפלה הסקלרית"),_("מכפילים רכיבים מתאימים ומחברים. התוצאה היא מספר יחיד."),
          "u·v = u₁v₁ + u₂v₂"),
        S(_("מציבים"),"",pn(u[0])+"·"+pn(v[0])+" + "+pn(u[1])+"·"+pn(v[1])),
        S(_("מחשבים"),"",num(u[0]*v[0])+" + "+pn(u[1]*v[1])+" = "+num(dot)),
        S(_("מה זה אומר"),dot===0?_("מכפלה סקלרית אפס פירושה שהווקטורים מאונכים."):_("המכפלה שונה מאפס, ולכן הווקטורים אינם מאונכים."),"")
      ],rule:"dot",hint:_("רכיב כפול רכיב, ואז מחברים. התוצאה מספר.")};
  }
  u=[rnz(-6,6),rnz(-6,6)];
  var w=[-u[1],u[0]];        /* מאונך לפי בנייה */
  var wNot=[u[0],rnz(-6,6)];
  while(u[0]*wNot[0]+u[1]*wNot[1]===0)wNot[1]=rnz(-6,6);
  return {ask:_("איזה מהווקטורים מאונך ל-u?"),expr:"u = "+vecH(u),
    ans:W(vecH(w)),
    wrong:[
      W(vecH([u[0],u[1]]),_("זה הווקטור עצמו. וקטור מאונך לעצמו רק אם הוא וקטור האפס.")),
      W(vecH([-u[0],-u[1]]),_("זה הווקטור ההפוך — הוא מקביל ל-u, לא מאונך לו.")),
      W(vecH(wNot),_f("המכפלה הסקלרית כאן היא {0} ולא אפס.", num(u[0]*wNot[0]+u[1]*wNot[1])))
    ],
    steps:[
      S(_("תנאי הניצבות"),_("שני וקטורים מאונכים בדיוק כאשר המכפלה הסקלרית שלהם מתאפסת."),"u·v = 0 ⇔ u ⊥ v"),
      S(_("בונים מאונך במישור"),_("מחליפים בין הרכיבים והופכים סימן לאחד מהם."),"u = (a,b) → (−b,a)"),
      S(_("בודקים"),"",pn(u[0])+"·"+pn(w[0])+" + "+pn(u[1])+"·"+pn(w[1])+" = 0")
    ],rule:"dot",hint:_("מאונכים כשהמכפלה הסקלרית אפס. במישור: מחליפים רכיבים והופכים סימן לאחד.")};
}

/* ---------- 13. ערכים עצמיים ---------- */
function genEigen(L){
  var l1,l2,a,b,c,d,steps;
  if(L===1){
    l1=rnz(-5,5);l2=rnz(-5,5);
    while(l2===l1)l2=rnz(-5,5);
    a=l1;d=l2;b=rnz(-4,4);c=0;      /* משולשת — הערכים העצמיים על האלכסון */
    return {ask:_("מצאו את הערכים העצמיים"),expr:"A = "+mat([[a,b],[c,d]]),
      ans:W("λ = "+num(l1)+" , λ = "+num(l2)),
      wrong:[
        W("λ = "+num(b)+" , λ = "+num(a),_("לקחתם איברים שאינם על האלכסון. במטריצה משולשת הערכים העצמיים הם בדיוק איברי האלכסון.")),
        W("λ = "+num(a+d)+" , λ = "+num(a*d),_("אלה העקבה והדטרמיננטה, ולא הערכים העצמיים עצמם.")),
        W("λ = "+num(-l1)+" , λ = "+num(-l2),_("טעות סימן. במשוואה det(A−λI)=0 המינוס כבר נלקח בחשבון."))
      ],
      steps:[
        S(_("המשוואה האופיינית"),_("מחפשים λ שעבורו המטריצה A מינוס λI מאבדת הפיכות."),"det(A − λI) = 0"),
        S(_("כותבים את המטריצה"),"",mat([["a−λ",b],[c,"d−λ"]])),
        S(_("המטריצה משולשת"),_("כשיש אפס מתחת לאלכסון, הדטרמיננטה היא מכפלת האלכסון."),
          "("+num(a)+" − λ)("+num(d)+" − λ) = 0"),
        S(_("הפתרונות"),"","λ = "+num(l1)+"   ,   λ = "+num(l2))
      ],rule:"eigen",hint:_("במטריצה משולשת הערכים העצמיים יושבים על האלכסון.")};
  }
  l1=rnz(-4,4);l2=rnz(-4,4);
  while(l2===l1)l2=rnz(-4,4);
  var tr=l1+l2,de=l1*l2;
  a=rnz(-4,4);d=tr-a;
  b=rnz(1,4);c=(a*d-de)/b;
  var t2=0;
  while((Math.round(c)!==c||Math.abs(c)>9)&&t2<120){a=rnz(-4,4);d=tr-a;b=rnz(1,4);c=(a*d-de)/b;t2++}
  if(Math.round(c)!==c){a=l1;d=l2;b=0;c=0}
  if(L===2){
    return {ask:_("מצאו את הערכים העצמיים"),expr:"A = "+mat([[a,b],[c,d]]),
      ans:W("λ = "+num(Math.min(l1,l2))+" , λ = "+num(Math.max(l1,l2))),
      wrong:[
        W("λ = "+num(a)+" , λ = "+num(d),_("לקחתם את איברי האלכסון. זה נכון רק במטריצה משולשת.")),
        W("λ = "+num(-Math.min(l1,l2))+" , λ = "+num(-Math.max(l1,l2)),_("טעות סימן בפתרון המשוואה הריבועית.")),
        W("λ = "+num(tr)+" , λ = "+num(de),_("אלה סכום ומכפלת הערכים העצמיים, לא הם עצמם."))
      ],
      steps:[
        S(_("שתי עובדות שחוסכות עבודה"),_("סכום הערכים העצמיים הוא העקבה, ומכפלתם היא הדטרמיננטה."),
          "λ₁+λ₂ = "+num(tr)+"   ,   λ₁·λ₂ = "+num(de)),
        S(_("המשוואה האופיינית"),"","λ²"+term(-tr,"λ")+sgn(de)+" = 0"),
        S(_("מפרקים לגורמים"),"","(λ"+sgn(-l1)+")(λ"+sgn(-l2)+") = 0"),
        S(_("הפתרונות"),"","λ = "+num(Math.min(l1,l2))+"   ,   λ = "+num(Math.max(l1,l2)))
      ],rule:"eigen",hint:_("סכום הערכים העצמיים הוא העקבה, ומכפלתם הדטרמיננטה.")};
  }
  return {ask:_("סכום הערכים העצמיים של מטריצה שווה תמיד ל־"),expr:"",
    ans:W(_("עקבת המטריצה")),
    wrong:[
      W(_("דטרמיננטת המטריצה"),_("הדטרמיננטה שווה למכפלת הערכים העצמיים, לא לסכומם.")),
      W(_("סכום כל איברי המטריצה"),_("רק איברי האלכסון הראשי נספרים בעקבה.")),
      W(_("מספר השורות"),_("זה נכון רק במקרה פרטי של מטריצת היחידה."))
    ],
    steps:[
      S(_("שני קשרים שכדאי לזכור"),_("הם חוסכים פתרון מלא של המשוואה האופיינית, ומאפשרים לבדוק תשובה בשנייה."),
        "Σλ = trace(A)   ,   Πλ = det(A)"),
      S(_("העקבה"),_("סכום איברי האלכסון הראשי בלבד."),"trace = a₁₁ + a₂₂"),
      S(_("שימוש מעשי"),_("אם חישבתם ערכים עצמיים והסכום לא יוצא כמו העקבה — יש טעות."),"")
    ],rule:"eigen",hint:_("עקבה = סכום האלכסון הראשי = סכום הערכים העצמיים.")};
}
