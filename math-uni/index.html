/* ---------- 14. קומבינטוריקה ---------- */
function genComb(L){
  var n,k,steps;
  if(L===1){
    n=ri(4,7);
    return {ask:"בכמה סדרים שונים אפשר להושיב "+n+" אנשים בשורה?",expr:"",
      ans:W(String(fact(n))),
      wrong:[
        W(String(n*n),"הכפלתם ב-n בכל מקום. אחרי שאדם התיישב הוא כבר לא זמין, ולכן המספר יורד באחד בכל שלב."),
        W(String(Math.pow(2,n)),"זה מספר תת־הקבוצות, לא מספר הסדרים."),
        W(String(n*(n-1)),"עצרתם אחרי שני מקומות. צריך להמשיך עד המקום האחרון.")
      ],
      steps:[
        S("סופרים מקום אחרי מקום","למקום הראשון יש "+n+" מועמדים. אחרי שאחד התיישב נשארו "+(n-1)+", וכן הלאה.",
          n+" · "+(n-1)+" · … · 1"),
        S("זו בדיוק העצרת","","n! = "+n+"!"),
        S("מחשבים","","= "+fact(n))
      ],rule:"perm",hint:"סידור של כל האנשים בשורה הוא n עצרת."};
  }
  if(L===2){
    n=ri(5,9);k=ri(2,Math.min(4,n-1));
    var c=Cnk(n,k),p=Math.round(fact(n)/fact(n-k));
    return {ask:"בוחרים ועדה של "+k+" אנשים מתוך "+n+". בכמה דרכים?",expr:"",
      ans:W(String(c)),
      wrong:[
        W(String(p),"ספרתם גם את הסדר. בוועדה אין תפקידים, ולכן צריך לחלק ב-"+k+"! כדי לא לספור את אותה קבוצה שוב ושוב."),
        W(String(n*k),"הכפלתם את המספרים. זו לא נוסחת הבחירה."),
        W(String(Cnk(n,k-1)),"בחרתם "+(k-1)+" אנשים במקום "+k+".")
      ],
      steps:[
        S("סדר או לא סדר — זו השאלה","בוועדה כל החברים שווים, ולכן הסדר לא משנה. במקרה כזה משתמשים בצירופים.",
          "C(n,k) = n! / (k!·(n−k)!)"),
        S("מציבים","","C("+n+","+k+") = "+n+"! / ("+k+"!·"+(n-k)+"!)"),
        S("מחשבים","","= "+c),
        S("למה מחלקים ב-"+k+"!","אילו ספרנו בסדר היינו מקבלים "+p+", וכל ועדה הייתה נספרת "+fact(k)+" פעמים.",
          p+" ÷ "+fact(k)+" = "+c)
      ],rule:"comb",hint:"אין סדר — צירופים. יש סדר — חליפות."};
  }
  n=ri(4,6);k=ri(2,3);
  var perm=Math.round(fact(n)/fact(n-k));
  return {ask:"בוחרים "+k+" אנשים מתוך "+n+" לתפקידים שונים. בכמה דרכים?",expr:"",
    ans:W(String(perm)),
    wrong:[
      W(String(Cnk(n,k)),"התעלמתם מהסדר. תפקידים שונים פירושם שהסדר כן משנה, ולכן חליפות ולא צירופים."),
      W(String(fact(n)),"סידרתם את כולם. בוחרים רק "+k+" מתוך "+n+"."),
      W(String(Math.pow(n,k)),"אותו אדם לא יכול למלא שני תפקידים, ולכן אין החזרה.")
    ],
    steps:[
      S("כאן הסדר משנה","מי שקיבל תפקיד א׳ אינו במצב זהה למי שקיבל תפקיד ב׳, ולכן זו חליפה.",
        "P(n,k) = n! / (n−k)!"),
      S("סופרים","","למקום הראשון "+n+" אפשרויות, לשני "+(n-1)+", וכן הלאה"),
      S("מחשבים","","= "+perm)
    ],rule:"perm",hint:"תפקידים שונים = הסדר משנה = חליפות."};
}

/* ---------- 15. הסתברות מותנית ובייס ---------- */
function genCondProb(L){
  var a,b,ab,tot,steps;
  if(L===1){
    tot=pick([40,50,60,80,100]);
    a=Math.round(tot*pick([0.3,0.4,0.5,0.6]));
    b=Math.round(tot*pick([0.3,0.4,0.5]));
    ab=Math.round(Math.min(a,b)*pick([0.4,0.5,0.6]));
    var p=fr(ab,b);
    return {ask:"מתוך "+tot+" סטודנטים, "+b+" לומדים סטטיסטיקה ו-"+ab+" מהם לומדים גם אלגברה. סטודנט נבחר באקראי מבין לומדי הסטטיסטיקה — מה ההסתברות שהוא לומד גם אלגברה?",
      expr:"",ans:W(p.html()),
      wrong:[
        W(fr(ab,tot).html(),"חילקתם בכלל הסטודנטים. בהסתברות מותנית המכנה מצטמצם לתנאי בלבד."),
        W(fr(b,tot).html(),"זו ההסתברות ללמוד סטטיסטיקה, ולא ההסתברות המבוקשת."),
        W(fr(b,ab).html(),"הפכתם את השבר.")
      ],
      steps:[
        S("הגדרת הסתברות מותנית","המכנה מצטמצם: כבר ידוע שהסטודנט מקבוצת הסטטיסטיקה, ולכן זה כל המרחב שלנו.",
          "P(A|B) = P(A∩B) / P(B)"),
        S("סופרים","","החיתוך: "+ab+"   ,   התנאי: "+b),
        S("מחלקים","",fr(ab,b).html())
      ],rule:"cond",hint:"בהסתברות מותנית המכנה הוא התנאי, לא כל המרחב."};
  }
  if(L===2){
    var pd=pick([2,4,5]),sens=pick([90,95]),fp=pick([5,10]);
    var pop=1000,sick=pop/pd/10*1;
    sick=Math.round(pop*pd/100);
    var tp=Math.round(sick*sens/100),fpN=Math.round((pop-sick)*fp/100);
    var post=fr(tp,tp+fpN);
    return {ask:"מחלה מופיעה אצל "+pd+"% מהאוכלוסייה. בדיקה מזהה חולה בהסתברות "+sens+"%, ונותנת תוצאה חיובית שגויה אצל "+fp+"% מהבריאים. אדם קיבל תוצאה חיובית — מה ההסתברות שהוא חולה?",
      expr:"",ans:W(post.html()+" ≈ "+Math.round(post.val()*100)+"%"),
      wrong:[
        W(sens+"%","זו רגישות הבדיקה — ההסתברות לתוצאה חיובית בהינתן מחלה. השאלה מבקשת את הכיוון ההפוך."),
        W(pd+"%","זו השכיחות באוכלוסייה, לפני שהתקבל מידע מהבדיקה."),
        W((100-fp)+"%","זו הסגוליות של הבדיקה, לא ההסתברות המבוקשת.")
      ],
      steps:[
        S("למה האינטואיציה נכשלת כאן","הבריאים הם רוב עצום, ולכן גם אחוז קטן של טעויות אצלם מייצר הרבה תוצאות חיוביות שגויות.",
          "רוב החיוביים מגיעים דווקא מהבריאים"),
        S("סופרים על "+pop+" אנשים","",	"חולים: "+sick+"   ,   בריאים: "+(pop-sick)),
        S("כמה חיוביים מכל קבוצה","",	"חולים חיוביים: "+tp+"   ,   בריאים חיוביים בטעות: "+fpN),
        S("מחלקים","",tp+" ÷ ("+tp+" + "+fpN+") = "+post.html()+" ≈ "+Math.round(post.val()*100)+"%")
      ],rule:"bayes",hint:"סופרים על אוכלוסייה שלמה: כמה חיוביים אמיתיים מול כמה חיוביים שגויים."};
  }
  var pa=pick([2,3,4,5]),pb=pick([2,3,4,5]);
  var indep=Math.random()<0.5;
  var pAB=indep?fr(1,pa*pb):fr(1,pa*pb+1);
  return {ask:"נתון P(A) = "+fr(1,pa).html()+" , P(B) = "+fr(1,pb).html()+" , P(A∩B) = "+pAB.html()+". האם המאורעות בלתי תלויים?",
    expr:"",ans:W(indep?"בלתי תלויים":"תלויים"),
    wrong:[
      W(indep?"תלויים":"בלתי תלויים","מכפלת ההסתברויות היא "+fr(1,pa*pb).html()+", והחיתוך הוא "+pAB.html()+". "+(indep?"הם שווים, ולכן בלתי תלויים.":"הם שונים, ולכן תלויים.")),
      W("זרים","מאורעות זרים הם כאלה שהחיתוך שלהם ריק. כאן החיתוך שונה מאפס."),
      W("אי אפשר לקבוע","אפשר בהחלט — משווים את החיתוך למכפלת ההסתברויות.")
    ],
    steps:[
      S("מבחן אי־התלות","אי־תלות אינה עניין של תחושה אלא של שוויון מספרי אחד.","A,B בלתי תלויים ⇔ P(A∩B) = P(A)·P(B)"),
      S("מחשבים את המכפלה","",fr(1,pa).html()+" · "+fr(1,pb).html()+" = "+fr(1,pa*pb).html()),
      S("משווים לחיתוך","",pAB.html()+(indep?" = ":" ≠ ")+fr(1,pa*pb).html()),
      S("מסקנה","",indep?"בלתי תלויים":"תלויים")
    ],rule:"indep",hint:"בלתי תלויים אם ורק אם ההסתברות של החיתוך שווה למכפלת ההסתברויות."};
}

/* ---------- 16. תוחלת ושונות ---------- */
function genExpVar(L){
  var vals,probs,i,E,steps;
  if(L===1){
    var n=3,den=pick([4,6,8,10]);
    var p1=ri(1,den-2),p2=ri(1,den-p1-1),p3=den-p1-p2;
    vals=[rnz(-5,10),rnz(-5,10),rnz(-5,10)];
    while(vals[1]===vals[0])vals[1]=rnz(-5,10);
    while(vals[2]===vals[0]||vals[2]===vals[1])vals[2]=rnz(-5,10);
    probs=[fr(p1,den),fr(p2,den),fr(p3,den)];
    E=(vals[0]*p1+vals[1]*p2+vals[2]*p3)/den;
    return {ask:"חשבו את התוחלת",
      expr:"x:  "+vals.map(num).join(" , ")+"<br>P:  "+probs.map(function(f){return f.html()}).join(" , "),
      ans:W(num(Math.round(E*1000)/1000)),
      wrong:[
        W(num(Math.round((vals[0]+vals[1]+vals[2])/3*1000)/1000),"חישבתם ממוצע פשוט. בתוחלת כל ערך מקבל משקל לפי ההסתברות שלו."),
        W(num(vals[0]+vals[1]+vals[2]),"חיברתם את הערכים בלי להכפיל בהסתברויות."),
        W(num(Math.round((p1+p2+p3)/den*1000)/1000),"סכמתם את ההסתברויות. הן תמיד מסתכמות ל-1.")
      ],
      steps:[
        S("תוחלת היא ממוצע משוקלל","כל ערך נכנס לחישוב לפי ההסתברות שלו, ולא בחלקים שווים.","E(X) = Σ xᵢ·P(xᵢ)"),
        S("מכפילים כל ערך בהסתברות","",vals.map(function(v,ix){return num(v)+"·"+[p1,p2,p3][ix]+"/"+den}).join(" + ")),
        S("מחברים","","E(X) = "+num(Math.round(E*1000)/1000))
      ],rule:"exp",hint:"תוחלת = סכום של ערך כפול ההסתברות שלו."};
  }
  if(L===2){
    var a=ri(1,6),b=a+ri(1,6);
    /* משתנה עם שני ערכים בהסתברות חצי־חצי — שונות פשוטה לבדיקה */
    E=(a+b)/2;
    var E2=(a*a+b*b)/2,V=E2-E*E;
    return {ask:"משתנה מקרי מקבל את הערכים "+a+" ו-"+b+", כל אחד בהסתברות חצי. חשבו את השונות.",
      expr:"",ans:W(num(Math.round(V*1000)/1000)),
      wrong:[
        W(num(Math.round(E*1000)/1000),"זו התוחלת, לא השונות."),
        W(num(Math.round((E2)*1000)/1000),"זו E(X²). צריך עוד לחסר ממנה את התוחלת בריבוע."),
        W(num(Math.round(Math.sqrt(V)*1000)/1000),"זו סטיית התקן — שורש השונות.")
      ],
      steps:[
        S("נוסחת השונות","V(X) = E(X²) − [E(X)]². שימו לב: קודם מרבעים ואז ממצעים, ולא להפך.",
          "V(X) = E(X²) − E(X)²"),
        S("מחשבים תוחלת","","E(X) = ("+a+" + "+b+") / 2 = "+num(E)),
        S("מחשבים E(X²)","","E(X²) = ("+(a*a)+" + "+(b*b)+") / 2 = "+num(E2)),
        S("מחסרים","","V = "+num(E2)+" − "+pn(E)+"² = "+num(Math.round(V*1000)/1000))
      ],rule:"var",hint:"שונות = תוחלת הריבוע פחות ריבוע התוחלת."};
  }
  var m=ri(2,8),v=ri(2,6),k=ri(2,5),c=rnz(-6,6);
  return {ask:"נתון E(X) = "+m+" ו-V(X) = "+v+". חשבו את השונות של "+k+"X"+sgn(c)+".",
    expr:"",ans:W(String(k*k*v)),
    wrong:[
      W(String(k*v),"הכפלתם ב-k פעם אחת. בשונות המקדם עולה בריבוע, כי השונות עצמה מדודה ביחידות בריבוע."),
      W(String(k*k*v+c),"הוספתם את הקבוע. הזזה לא משנה את הפיזור, ולכן היא לא משפיעה על השונות."),
      W(String(k*m+c),"זו התוחלת של הביטוי, לא השונות.")
    ],
    steps:[
      S("שני כללים","התוחלת לינארית לגמרי. השונות מתעלמת מהזזה ומעלה את המקדם בריבוע.",
        "E(aX+b) = aE(X)+b   ,   V(aX+b) = a²V(X)"),
      S("למה הקבוע נעלם","הוספת קבוע מזיזה את כל ההתפלגות, אבל לא משנה כמה היא מפוזרת.",
        "V(X + b) = V(X)"),
      S("מציבים","","V("+k+"X"+sgn(c)+") = "+k+"²·"+v+" = "+(k*k*v))
    ],rule:"var",hint:"בשונות: הקבוע נעלם, והמקדם עולה בריבוע."};
}

/* ---------- 17. התפלגות בינומית ---------- */
function genBinom(L){
  var n,k,den,steps;
  if(L===1){
    n=ri(3,6);k=ri(1,n-1);den=pick([2,3,4]);
    var c=Cnk(n,k);
    var p=fr(c*Math.pow(den-1,n-k),Math.pow(den,n));
    return {ask:"מבצעים "+n+" ניסויים בלתי תלויים, בכל אחד הסתברות הצלחה "+fr(1,den).html()+". מה ההסתברות ל-"+k+" הצלחות בדיוק?",
      expr:"",ans:W(p.html()),
      wrong:[
        W(fr(Math.pow(den-1,n-k),Math.pow(den,n)).html(),"שכחתם את מקדם הבחירה. יש "+c+" סדרים שונים שבהם "+k+" ההצלחות יכולות להופיע."),
        W(fr(c,Math.pow(den,n)).html(),"התייחסתם לכישלונות כאילו הסתברותם 1."),
        W(fr(k,n).html(),"זה היחס בין מספר ההצלחות למספר הניסויים, ולא הסתברות.")
      ],
      steps:[
        S("נוסחת ההתפלגות הבינומית","שלושה חלקים: כמה סדרים, ההסתברות להצלחות, וההסתברות לכישלונות.",
          "P(X=k) = C(n,k)·pᵏ·(1−p)ⁿ⁻ᵏ"),
        S("מספר הסדרים","","C("+n+","+k+") = "+c),
        S("הסתברות הרצף","",fr(1,den).html()+"<sup>"+k+"</sup> · "+fr(den-1,den).html()+"<sup>"+(n-k)+"</sup>"),
        S("מכפילים","",p.html())
      ],rule:"binom",hint:"מקדם בינומי, כפול ההצלחות, כפול הכישלונות."};
  }
  if(L===2){
    n=ri(10,40);den=pick([2,4,5,10]);
    var E=n/den,V=n*(1/den)*(1-1/den);
    return {ask:"משתנה מקרי בינומי עם n = "+n+" ו-p = "+fr(1,den).html()+". חשבו את התוחלת ואת השונות.",
      expr:"",ans:W("E = "+num(E)+" , V = "+num(Math.round(V*100)/100)),
      wrong:[
        W("E = "+num(E)+" , V = "+num(E),"בלבלתם בין בינומית לפואסונית. בבינומית השונות היא np(1−p), והיא תמיד קטנה מהתוחלת."),
        W("E = "+num(n)+" , V = "+num(Math.round(V*100)/100),"התוחלת היא n כפול p, לא n."),
        W("E = "+num(Math.round(V*100)/100)+" , V = "+num(E),"החלפתם בין השניים.")
      ],
      steps:[
        S("נוסחאות ההתפלגות הבינומית","","E(X) = np   ,   V(X) = np(1−p)"),
        S("מציבים בתוחלת","","E = "+n+" · "+fr(1,den).html()+" = "+num(E)),
        S("מציבים בשונות","","V = "+n+" · "+fr(1,den).html()+" · "+fr(den-1,den).html()+" = "+num(Math.round(V*100)/100)),
        S("בדיקת סבירות","השונות תמיד קטנה מהתוחלת בבינומית, כי (1−p) קטן מ-1.","")
      ],rule:"binom",hint:"E = np, ו-V = np(1−p)."};
  }
  n=ri(3,6);den=pick([2,3,4]);
  var pNone=fr(Math.pow(den-1,n),Math.pow(den,n));
  var pAtLeast=fr(1,1).sub(pNone);
  return {ask:"מבצעים "+n+" ניסויים בלתי תלויים, בכל אחד הסתברות הצלחה "+fr(1,den).html()+". מה ההסתברות שתהיה לפחות הצלחה אחת?",
    expr:"",ans:W(pAtLeast.html()),
    wrong:[
      W(pNone.html(),"זו ההסתברות לאפס הצלחות. השאלה מבקשת את המשלים שלה."),
      W(fr(n,den).html(),"חיברתם הסתברויות. מאורעות ״לפחות אחת״ אינם זרים, ולכן אי אפשר לחבר."),
      W(fr(1,den).html(),"זו ההסתברות בניסוי בודד.")
    ],
    steps:[
      S("״לפחות אחת״ נפתר דרך המשלים","לספור אחת, שתיים, שלוש הצלחות זו עבודה מיותרת. יש רק מקרה אחד לשלול.",
        "P(לפחות 1) = 1 − P(אף אחת)"),
      S("ההסתברות לאפס הצלחות","כל "+n+" הניסויים נכשלים.",fr(den-1,den).html()+"<sup>"+n+"</sup> = "+pNone.html()),
      S("משלימים ל-1","","1 − "+pNone.html()+" = "+pAtLeast.html())
    ],rule:"binom",hint:"״לפחות אחת״ = 1 פחות ההסתברות לאף אחת."};
}

/* ---------- 18. התפלגות נורמלית ---------- */
function genNormal(L){
  var mu,sig,x,z,steps;
  if(L===1){
    mu=pick([50,70,80,100,120]);sig=pick([4,5,8,10,15,20]);
    z=pick([-2,-1.5,-1,1,1.5,2,2.5]);
    x=mu+z*sig;
    return {ask:"תקננו את הערך",expr:"X ~ N("+mu+" , "+(sig*sig)+")  ,  x = "+num(x),
      ans:W("z = "+num(z)),
      wrong:[
        W("z = "+num(-z),"טעות סימן. מחסרים את התוחלת מהערך, ולא להפך."),
        W("z = "+num(Math.round((x-mu)/(sig*sig)*1000)/1000),"חילקתם בשונות. בתקנון מחלקים בסטיית התקן, שהיא השורש שלה."),
        W("z = "+num(x-mu),"עצרתם אחרי החיסור, בלי לחלק בסטיית התקן.")
      ],
      steps:[
        S("מה עושה התקנון","הוא מתרגם ״כמה רחוק״ ליחידות של סטיות תקן, וכך אפשר להשוות בין התפלגויות שונות.",
          "z = (x − μ) / σ"),
        S("שימו לב לסימון","N("+mu+" , "+(sig*sig)+") — המספר השני הוא השונות, וסטיית התקן היא השורש שלו.",
          "σ = √"+(sig*sig)+" = "+sig),
        S("מציבים","","z = ("+num(x)+" − "+mu+") / "+sig),
        S("מחשבים","","z = "+num(z))
      ],rule:"znorm",hint:"מחסרים תוחלת ומחלקים בסטיית תקן — לא בשונות."};
  }
  if(L===2){
    var zz=pick([0.5,1,1.5,2]);
    var phi={"0.5":0.6915,"1":0.8413,"1.5":0.9332,"2":0.9772}[String(zz)];
    return {ask:"נתון Φ("+zz+") = "+phi+". חשבו את Φ(−"+zz+").",expr:"",
      ans:W(num(Math.round((1-phi)*10000)/10000)),
      wrong:[
        W(num(-phi),"הסתברות לעולם אינה שלילית. הסימטריה עובדת על ההשלמה ל-1, לא על הסימן."),
        W(num(phi),"Φ אינה זוגית. הערך בצד השלילי הוא המשלים."),
        W(num(Math.round((phi-0.5)*10000)/10000),"זו ההסתברות בין 0 ל-"+zz+", ולא Φ(−"+zz+").")
      ],
      steps:[
        S("ההתפלגות סימטרית סביב אפס","השטח משמאל ל-−z שווה בדיוק לשטח מימין ל-z.","Φ(−z) = 1 − Φ(z)"),
        S("מציבים","","Φ(−"+zz+") = 1 − "+phi),
        S("מחשבים","","= "+num(Math.round((1-phi)*10000)/10000))
      ],rule:"znorm",hint:"Φ(−z) = 1 פחות Φ(z), מתוך הסימטריה."};
  }
  mu=pick([60,80,100]);sig=pick([5,10,20]);
  z=pick([1,1.5,2,-1,-2]);
  x=mu+z*sig;
  return {ask:"בהתפלגות N("+mu+" , "+(sig*sig)+"), איזה ערך של x מתאים ל-z = "+num(z)+"?",
    expr:"",ans:W("x = "+num(x)),
    wrong:[
      W("x = "+num(mu-z*sig),"טעות סימן. מהנוסחה z=(x−μ)/σ נובע x = μ + zσ."),
      W("x = "+num(mu+z),"שכחתם להכפיל בסטיית התקן. z נמדד ביחידות של σ."),
      W("x = "+num(mu+z*sig*sig),"הכפלתם בשונות במקום בסטיית התקן.")
    ],
    steps:[
      S("מבודדים את x","מתחילים מנוסחת התקנון ומעבירים אגפים.","z = (x−μ)/σ  →  x = μ + z·σ"),
      S("מציבים","","x = "+mu+" + "+pn(z)+"·"+sig),
      S("מחשבים","","x = "+num(x))
    ],rule:"znorm",hint:"x = μ ועוד z כפול σ."};
}

/* ---------- 19. לוגיקה ---------- */
function genLogic(L){
  var p,q,steps;
  if(L===1){
    p=Math.random()<0.5;q=Math.random()<0.5;
    var op=pick(["∧","∨","⇒"]);
    var res=op==="∧"?(p&&q):op==="∨"?(p||q):(!p||q);
    var TF=function(v){return v?"אמת":"שקר"};
    return {ask:"נתון p = "+TF(p)+" ו-q = "+TF(q)+". מהו ערך האמת של הפסוק?",
      expr:"p "+op+" q",ans:W(TF(res)),
      wrong:[
        W(TF(!res),op==="⇒"?"גרירה שקרית רק במקרה אחד: כשההנחה אמת והמסקנה שקר. בכל שאר המקרים היא אמת."
          :op==="∧"?"וגם דורש ששניהם יהיו אמת."
          :"או דורש שלפחות אחד יהיה אמת."),
        W("תלוי","ערכי p ו-q נתונים, ולכן לפסוק יש ערך אמת יחיד ומוגדר."),
        W("לא מוגדר","כל צירוף של ערכי אמת מוגדר היטב בטבלת האמת.")
      ],
      steps:[
        S("מזכירים את הכלל",op==="∧"?"וגם אמת רק כששני הצדדים אמת.":op==="∨"?"או אמת אם לפחות צד אחד אמת.":"גרירה שקרית רק כאשר ההנחה אמת והמסקנה שקר.",
          op==="∧"?"T∧T=T, אחרת F":op==="∨"?"F∨F=F, אחרת T":"T⇒F=F, אחרת T"),
        S("מציבים","",TF(p)+" "+op+" "+TF(q)),
        S("התוצאה","",TF(res))
      ],rule:"logic",hint:"גרירה שקרית רק כשההנחה אמת והמסקנה שקר."};
  }
  if(L===2){
    return {ask:"איזה פסוק שקול לוגית ל-p ⇒ q?",expr:"p ⇒ q",
      ans:W("¬p ∨ q"),
      wrong:[
        W("p ∨ ¬q","זו לא השקילות. בדקו בטבלת אמת: כאשר p שקר ו-q שקר, הפסוק הזה שקר והגרירה אמת."),
        W("¬q ⇒ ¬p"+"","זו אמנם שקילות נכונה — הפסוק המנוגד — אבל השאלה מבקשת את הצורה עם ״או״."),
        W("q ⇒ p","זו הגרירה ההפוכה, והיא אינה שקולה למקורית.")
      ],
      steps:[
        S("מתי גרירה שקרית","רק כשההנחה אמת והמסקנה שקר. בכל שאר המקרים היא אמת.","p⇒q שקר ⇔ p אמת ו-q שקר"),
        S("מנסחים אחרת","״לא קורה ש-p אמת ו-q שקר״ הוא בדיוק ״p שקר או q אמת״.","¬(p ∧ ¬q) ≡ ¬p ∨ q"),
        S("בדיקה בטבלה","ארבע השורות יוצאות זהות בשני הפסוקים.","p⇒q ≡ ¬p ∨ q")
      ],rule:"logic",hint:"p⇒q שקול ל-״לא p או q״."};
  }
  return {ask:"מהי השלילה של הפסוק p ∧ q?",expr:"¬(p ∧ q)",
    ans:W("¬p ∨ ¬q"),
    wrong:[
      W("¬p ∧ ¬q","שללתם כל צד אבל השארתם ״וגם״. לפי דה־מורגן הקשר מתהפך."),
      W("p ∨ q","לא שללתם את הצדדים כלל."),
      W("¬(p) ∧ q","שללתם רק צד אחד.")
    ],
    steps:[
      S("חוקי דה־מורגן","כששוללים, כל צד נשלל וגם הקשר מתהפך: ״וגם״ נעשה ״או״ ולהפך.",
        "¬(p ∧ q) ≡ ¬p ∨ ¬q"),
      S("למה זה הגיוני","אם לא נכון ששניהם מתקיימים, אז לפחות אחד מהם אינו מתקיים.",""),
      S("התשובה","","¬p ∨ ¬q")
    ],rule:"demorgan",hint:"דה־מורגן: שוללים כל צד והקשר מתהפך."};
}

/* ---------- 20. קבוצות ---------- */
function genSets(L){
  var A,B,AB,U,steps;
  if(L===1){
    A=ri(10,30);B=ri(10,30);AB=ri(2,Math.min(A,B)-1);
    return {ask:"בקבוצה A יש "+A+" איברים, ב-B יש "+B+", ובחיתוך "+AB+". כמה איברים באיחוד?",
      expr:"|A ∪ B| = ?",ans:W(String(A+B-AB)),
      wrong:[
        W(String(A+B),"חיברתם בלי לחסר את החיתוך, ולכן ספרתם את האיברים המשותפים פעמיים."),
        W(String(A+B+AB),"הוספתם את החיתוך במקום לחסר אותו."),
        W(String(AB),"זה גודל החיתוך, לא האיחוד.")
      ],
      steps:[
        S("עקרון ההכלה וההדחה","כשמחברים שתי קבוצות, האיברים המשותפים נספרים פעמיים — ולכן מחסרים אותם פעם אחת.",
          "|A∪B| = |A| + |B| − |A∩B|"),
        S("מציבים","",A+" + "+B+" − "+AB),
        S("מחשבים","","= "+(A+B-AB))
      ],rule:"sets",hint:"מחברים ומחסרים את החיתוך פעם אחת."};
  }
  if(L===2){
    U=ri(40,80);A=ri(10,U-15);
    return {ask:"בקבוצה האוניברסלית "+U+" איברים ובקבוצה A יש "+A+". כמה איברים במשלים של A?",
      expr:"|A<sup>c</sup>| = ?",ans:W(String(U-A)),
      wrong:[
        W(String(U+A),"חיברתם. המשלים הוא מה שנשאר, ולכן מחסרים."),
        W(String(A),"זו הקבוצה עצמה, לא המשלים."),
        W(String(U),"זו הקבוצה האוניברסלית כולה.")
      ],
      steps:[
        S("הגדרת המשלים","כל מה שנמצא בקבוצה האוניברסלית ואינו ב-A.","Aᶜ = U \\ A"),
        S("מחשבים","",U+" − "+A+" = "+(U-A)),
        S("בדיקה","הקבוצה ומשלימה מכסות יחד בדיוק את הכול.",A+" + "+(U-A)+" = "+U)
      ],rule:"sets",hint:"משלים = הכול פחות הקבוצה."};
  }
  return {ask:"מהי הצורה השקולה?",expr:"(A ∪ B)<sup>c</sup>",
    ans:W("A<sup>c</sup> ∩ B<sup>c</sup>"),
    wrong:[
      W("A<sup>c</sup> ∪ B<sup>c</sup>","שמרתם על האיחוד. לפי דה־מורגן לקבוצות, הפעולה מתהפכת."),
      W("A ∩ B","לא לקחתם משלימים בכלל."),
      W("(A ∩ B)<sup>c</sup>","זה המשלים של החיתוך, וזו טענה אחרת.")
    ],
    steps:[
      S("דה־מורגן לקבוצות","זהה בדיוק לדה־מורגן בלוגיקה: כל קבוצה מוחלפת במשלימה, והפעולה מתהפכת.",
        "(A∪B)ᶜ = Aᶜ ∩ Bᶜ"),
      S("למה","אם איבר אינו באיחוד — הוא לא ב-A וגם לא ב-B.",""),
      S("התשובה","","Aᶜ ∩ Bᶜ")
    ],rule:"demorgan",hint:"משלים של איחוד הוא חיתוך המשלימים."};
}

/* ---------- 21. סדרות וטורים ---------- */
function genSeries(L){
  var a1,q,n,steps;
  if(L===1){
    a1=rnz(1,6);q=pick([2,3,-2,-3]);n=ri(3,6);
    var an=a1*Math.pow(q,n-1);
    return {ask:"בסדרה הנדסית a₁ = "+num(a1)+" ו-q = "+num(q)+". מהו האיבר ה-"+n+"?",
      expr:"",ans:W(num(an)),
      wrong:[
        W(num(a1*Math.pow(q,n)),"השתמשתם ב-n במקום ב-n מינוס 1. מהאיבר הראשון ל-n עושים "+(n-1)+" הכפלות."),
        W(num(a1+(n-1)*q),"זו נוסחת הסדרה החשבונית. בהנדסית מכפילים, לא מחברים."),
        W(num(a1*q*n),"הכפלתם ב-n במקום להעלות בחזקה.")
      ],
      steps:[
        S("נוסחת האיבר הכללי","aₙ = a₁·qⁿ⁻¹. שימו לב למינוס אחד בחזקה — הוא מספר ההכפלות, לא מספר האיברים.",
          "aₙ = a₁·qⁿ⁻¹"),
        S("מציבים","","a"+n+" = "+num(a1)+" · "+pn(q)+"<sup>"+(n-1)+"</sup>"),
        S("מחשבים","","= "+num(an))
      ],rule:"geo",hint:"בהנדסית מכפילים במנה, והחזקה היא n מינוס אחת."};
  }
  if(L===2){
    a1=rnz(1,5);q=pick([2,3]);n=ri(3,6);
    var Sn=a1*(Math.pow(q,n)-1)/(q-1);
    return {ask:"חשבו את סכום "+n+" האיברים הראשונים של סדרה הנדסית עם a₁ = "+num(a1)+" ו-q = "+q+".",
      expr:"",ans:W(num(Sn)),
      wrong:[
        W(num(a1*Math.pow(q,n-1)),"זה האיבר ה-"+n+" עצמו, לא הסכום."),
        W(num(a1*n),"זה היה נכון אילו כל האיברים היו שווים."),
        W(num(a1*(Math.pow(q,n)-1)),"שכחתם לחלק ב-(q−1).")
      ],
      steps:[
        S("נוסחת הסכום","Sₙ = a₁·(qⁿ − 1) ÷ (q − 1), תקפה לכל q ששונה מ-1.","Sₙ = a₁(qⁿ−1)/(q−1)"),
        S("מציבים","","S"+n+" = "+num(a1)+"·("+q+"<sup>"+n+"</sup> − 1) / ("+q+" − 1)"),
        S("מחשבים","","= "+num(a1)+"·"+(Math.pow(q,n)-1)+" / "+(q-1)+" = "+num(Sn))
      ],rule:"geosum",hint:"סכום סדרה הנדסית: a₁ כפול (qⁿ פחות 1) חלקי (q פחות 1)."};
  }
  var den=pick([2,3,4,5]);
  var conv=Math.random()<0.6;
  a1=rnz(1,6);
  var qq=conv?fr(1,den):fr(den,1);
  var ansTxt=conv?fr(a1*den,den-1).html():"הטור מתבדר";
  return {ask:"האם הטור ההנדסי האינסופי מתכנס, ואם כן — לכמה?",
    expr:"a₁ = "+num(a1)+"  ,  q = "+qq.html(),
    ans:W(ansTxt),
    wrong:conv?[
      W("הטור מתבדר","מנה שערכה המוחלט קטן מ-1 גורמת לאיברים לדעוך, והטור מתכנס."),
      W(fr(a1,den-1).html(),"שכחתם את a₁ במונה או טעיתם בחישוב 1 פחות q."),
      W(fr(a1*den,den+1).html(),"במכנה צריך 1 פחות q, ולא 1 ועוד q.")
    ]:[
      W(fr(a1,1-den===0?1:1-den).html(),"הצבתם בנוסחת הסכום בלי לבדוק את תנאי ההתכנסות. עם q גדול מ-1 היא לא תקפה."),
      W(num(a1),"זה האיבר הראשון בלבד."),
      W("0","האיברים גדלים ולא דועכים.")
    ],
    steps:[
      S("קודם בודקים התכנסות","טור הנדסי אינסופי מתכנס אם ורק אם הערך המוחלט של המנה קטן מ-1.",
        "|q| < 1 ⇔ מתכנס"),
      S("כאן","","|q| = "+qq.html()+" → "+(conv?"קטן מ-1, מתכנס":"גדול מ-1, מתבדר")),
      S(conv?"מציבים בנוסחת הסכום":"אין סכום סופי",
        conv?"S = a₁ / (1 − q)":"האיברים גדלים ללא גבול, ולכן אין ערך סופי.",
        conv?"S = "+num(a1)+" / (1 − "+qq.html()+") = "+ansTxt:"מתבדר")
    ],rule:"geoinf",hint:"טור אינסופי מתכנס רק כשהערך המוחלט של המנה קטן מ-1."};
}

/* ---------- 22. לוגריתמים ---------- */
function genLogs(L){
  var b,n,steps;
  if(L===1){
    b=pick([2,3,5,10]);n=ri(2,5);
    var val=Math.pow(b,n);
    return {ask:"חשבו",expr:"log<sub>"+b+"</sub> "+val,ans:W(String(n)),
      wrong:[
        W(String(val/b),"זה המספר חלקי הבסיס. לוגריתם שואל באיזו חזקה, ולא כמה פעמים."),
        W(String(b*n),"הכפלתם את הבסיס במעריך."),
        W(String(val),"זה המספר עצמו.")
      ],
      steps:[
        S("מה לוגריתם שואל","באיזו חזקה צריך להעלות את "+b+" כדי לקבל "+val+"?","log_b(x) = y ⇔ bʸ = x"),
        S("בודקים","",b+"<sup>"+n+"</sup> = "+val),
        S("התשובה","",String(n))
      ],rule:"log",hint:"לוגריתם הוא החזקה שאליה מעלים את הבסיס."};
  }
  if(L===2){
    b=pick([2,3,10]);var u=ri(2,6),v=ri(2,6);
    var lg="log<sub>"+b+"</sub>";
    return {ask:"נתון "+lg+"(a) = "+u+" ו-"+lg+"(c) = "+v+". חשבו את "+lg+"(a·c).",
      expr:"",ans:W(String(u+v)),
      wrong:[
        W(String(u*v),"הכפלתם את הלוגריתמים. לוג של מכפלה הוא סכום הלוגים, לא מכפלתם."),
        W(num(u-v),"חיסור מתאים ללוג של מנה, לא של מכפלה."),
        W(String(Math.pow(u,v)),"העלאה בחזקה מתאימה ללוג של חזקה.")
      ],
      steps:[
        S("חוק הלוג של מכפלה","הלוגריתם מתרגם כפל לחיבור — זו כל התועלת שלו.","log(a·c) = log a + log c"),
        S("מציבים","",u+" + "+v),
        S("מחשבים","","= "+(u+v))
      ],rule:"logrules",hint:"לוג של מכפלה = סכום הלוגים. של מנה = הפרש."};
  }
  b=pick([2,3,5]);n=ri(2,5);
  var target=Math.pow(b,n);
  return {ask:"פתרו את המשוואה",expr:b+"<sup>x</sup> = "+target,
    ans:W("x = "+n),
    wrong:[
      W("x = "+num(target/b),"חילקתם בבסיס. משוואה מעריכית נפתרת בלוגריתם, לא בחילוק."),
      W("x = "+num(target-b),"חיסרתם."),
      W("x = "+num(Math.round(target/n*100)/100),"חילקתם במעריך.")
    ],
    steps:[
      S("הנעלם נמצא בחזקה","כשהנעלם במעריך, הכלי הוא לוגריתם — הוא הפעולה ההפוכה להעלאה בחזקה.",
        b+"ˣ = "+target),
      S("מפעילים לוג על שני האגפים","","x = log<sub>"+b+"</sub>("+target+")"),
      S("מחשבים","",b+"<sup>"+n+"</sup> = "+target+"  →  x = "+n)
    ],rule:"log",hint:"נעלם בחזקה — מפעילים לוגריתם על שני האגפים."};
}

/* ---------- 23. מספרים מרוכבים ---------- */
function genComplex(L){
  var a,b,c,d,steps;
  function cx(re,im){
    if(im===0)return num(re);
    if(re===0)return (im===1?"":im===-1?"−":num(im))+"i";
    return num(re)+(im<0?" − ":" + ")+(Math.abs(im)===1?"":Math.abs(im))+"i";
  }
  if(L===1){
    a=rnz(-6,6);b=rnz(-6,6);c=rnz(-6,6);d=rnz(-6,6);
    return {ask:"חשבו את הסכום",expr:"("+cx(a,b)+") + ("+cx(c,d)+")",
      ans:W(cx(a+c,b+d)),
      wrong:[
        W(cx(a+c+b+d,0),"חיברתם הכול יחד. החלק הממשי והחלק המדומה נשארים נפרדים."),
        W(cx(a+d,b+c),"החלפתם בין החלקים."),
        W(cx(a*c,b*d),"הכפלתם במקום לחבר.")
      ],
      steps:[
        S("מחברים חלק ממשי עם ממשי","i הוא כמו משתנה — מחברים רק איברים דומים.","(a+bi)+(c+di) = (a+c)+(b+d)i"),
        S("החלק הממשי","",num(a)+" + "+pn(c)+" = "+num(a+c)),
        S("החלק המדומה","",num(b)+" + "+pn(d)+" = "+num(b+d)),
        S("התוצאה","",cx(a+c,b+d))
      ],rule:"cxadd",hint:"ממשי עם ממשי, מדומה עם מדומה."};
  }
  if(L===2){
    a=rnz(-5,5);b=rnz(-5,5);c=rnz(-5,5);d=rnz(-5,5);
    var re=a*c-b*d,im=a*d+b*c;
    return {ask:"חשבו את המכפלה",expr:"("+cx(a,b)+")("+cx(c,d)+")",
      ans:W(cx(re,im)),
      wrong:[
        W(cx(a*c+b*d,im),"שכחתם ש-i בריבוע שווה מינוס אחת. bd·i² הופך ל-−bd, ולכן מחסרים."),
        W(cx(a*c,b*d),"הכפלתם חלק בחלק. צריך לפתוח סוגריים במלואם, ארבע מכפלות."),
        W(cx(re,a*c+b*d),"החלק המדומה מורכב מ-ad ועוד bc.")
      ],
      steps:[
        S("פותחים סוגריים כרגיל","ארבע מכפלות, בדיוק כמו במכפלת בינומים.",
          "ac + adi + bci + bd·i²"),
        S("כאן נכנס הכלל היחיד שצריך לזכור","i בריבוע שווה מינוס אחת, ולכן האיבר האחרון משנה סימן.",
          "i² = −1  →  bd·i² = −bd"),
        S("מכנסים","","("+num(a*c)+" − "+pn(b*d)+") + ("+num(a*d)+" + "+pn(b*c)+")i"),
        S("התוצאה","",cx(re,im))
      ],rule:"cxmul",hint:"פותחים סוגריים כרגיל, וזוכרים ש-i בריבוע הוא מינוס אחת."};
  }
  var TRIP2=[[3,4,5],[6,8,10],[5,12,13],[8,15,17]];
  var t=pick(TRIP2);
  a=t[0]*pick([1,-1]);b=t[1]*pick([1,-1]);
  return {ask:"חשבו את הערך המוחלט",expr:"|"+cx(a,b)+"|",
    ans:W(String(t[2])),
    wrong:[
      W(num(Math.abs(a)+Math.abs(b)),"חיברתם את החלקים. הערך המוחלט מחושב לפי פיתגורס."),
      W(num(t[2]*t[2]),"עצרתם לפני הוצאת השורש."),
      W(num(a),"זה החלק הממשי בלבד.")
    ],
    steps:[
      S("הערך המוחלט הוא מרחק","במישור המרוכב זהו המרחק מהראשית, כלומר בדיוק פיתגורס.",
        "|a+bi| = √(a² + b²)"),
      S("מציבים","","√("+pn(a)+"² + "+pn(b)+"²) = √("+(a*a)+" + "+(b*b)+")"),
      S("מחשבים","","√"+(t[2]*t[2])+" = "+t[2])
    ],rule:"cxabs",hint:"ערך מוחלט של מרוכב = שורש של סכום ריבועי החלקים."};
}

/* ============================================================
   12. בניית שאלה
   מנרמל את מה שהמחולל החזיר: מסנן מסיחים כפולים או פגומים,
   מערבב, ומכין גם טקסט להקראה.
   ============================================================ */
function badStr(s){return !s||/NaN|Infinity|undefined|null/.test(s)}

function buildQ(topicId,level){
  var t=topicById(topicId);
  if(!t)t=TOPICS[0];
  var raw=null,tries=0,opts,i,p,seen,ansP;
  while(tries<8){
    tries++;
    try{raw=t.gen(level)}catch(e){raw=null}
    if(!raw||!raw.ans||badStr(plainOf(raw.ans.h)))continue;
    ansP=plainOf(raw.ans.h);
    seen={};seen[ansP]=1;
    opts=[{h:raw.ans.h,t:ansP,ok:true,why:""}];
    for(i=0;i<(raw.wrong||[]).length;i++){
      p=plainOf(raw.wrong[i].h);
      if(badStr(p)||seen[p])continue;
      seen[p]=1;
      opts.push({h:raw.wrong[i].h,t:p,ok:false,why:raw.wrong[i].why||""});
    }
    if(opts.length>=3)break;
  }
  if(!raw)raw={ask:"חשבו",expr:"1 + 1",ans:W("2"),wrong:[W("1"),W("3"),W("11")],steps:[S("חיבור","","1 + 1 = 2")],hint:"",rule:"order"};
  if(!opts||opts.length<2){
    ansP=plainOf(raw.ans.h);
    opts=[{h:raw.ans.h,t:ansP,ok:true,why:""}];
  }
  shuffle(opts);
  var sayTxt=raw.ask+(raw.expr?". "+speakMath(plainOf(raw.expr)):"");
  return {
    topic:t.id,topicName:t.name,level:level,
    ask:raw.ask,expr:raw.expr||"",fig:raw.fig||"",
    options:opts,steps:raw.steps||[],hint:raw.hint||"",rule:raw.rule||"",
    say:sayTxt
  };
}

var P={list:[],i:0,q:null,phase:"ask",picked:[],hints:0,steps:0,usedHelp:false,results:[],startedAt:0};

function mastery(id){
  var m=state.mastery[id];
  if(!m){m={seen:0,ok:0,help:0,m:0};state.mastery[id]=m}
  return m;
}
function activeTopics(){
  var chosen=state.topics.filter(function(id){return !!topicById(id)});
  if(chosen.length)return chosen;
  return topicsForTrack(state.track).map(function(t){return t.id});
}
/* בחירת הנושא הבא: מי שחלש יותר מקבל יותר תורות, ומדי כמה
   שאלות חוזר נושא שנפלו בו קודם. ככה החזרה קורית לבד. */
function nextTopic(idx){
  var pool=activeTopics();
  if(idx>0&&idx%3===2&&state.wrongBank.length){
    var w=state.wrongBank[state.wrongBank.length-1-Math.floor(Math.random()*Math.min(5,state.wrongBank.length))];
    if(w&&pool.indexOf(w.topic)>=0)return w.topic;
  }
  var weights=pool.map(function(id){return 110-mastery(id).m}),total=0,i;
  for(i=0;i<weights.length;i++)total+=weights[i];
  var r=Math.random()*total;
  for(i=0;i<pool.length;i++){r-=weights[i];if(r<=0)return pool[i]}
  return pool[pool.length-1];
}
function startRound(forceTopic){
  var n=state.settings.roundLen,i;
  P.list=[];
  for(i=0;i<n;i++)P.list.push(forceTopic||nextTopic(i));
  P.i=0;P.results=[];P.startedAt=Date.now();
  loadQ();
}
function loadQ(){
  P.q=buildQ(P.list[P.i],state.level);
  P.phase="ask";P.picked=[];P.hints=0;P.steps=0;P.usedHelp=false;
  if(state.settings.autoSteps)P.steps=1;
}
function roundDone(){return P.i>=P.list.length}

/* השליטה בנושא נמדדת כממוצע נע של הביצועים האחרונים, ולא
   כמונה שמטפס לאט. תלמיד שענה נכון צריך לראות מספר שמשקף
   את זה מיד — אחרת המדד מתסכל במקום לעזור. */
function scoreAnswer(ok){
  var m=mastery(P.q.topic),d=dayRec(),score;
  m.seen++;d.a++;state.stats.answered++;
  touchDay();
  if(ok&&!P.usedHelp&&P.picked.length===1){
    m.ok++;d.c++;state.stats.correct++;state.stats.xp+=10;
    score=1;P.results.push("ok");
  }else if(ok&&!P.usedHelp){
    m.ok++;d.c++;state.stats.correct++;state.stats.xp+=4;
    score=0.7;P.results.push("ok");
  }else if(P.usedHelp){
    m.help++;state.stats.helped++;state.stats.xp+=2;
    score=0.35;P.results.push("hp");
  }else{
    score=0;P.results.push("no");
  }
  m.m=m.seen===1?Math.round(score*100):Math.round(m.m*0.6+score*40);
  if(!ok||P.usedHelp){
    state.wrongBank.push({topic:P.q.topic,ts:Date.now()});
    if(state.wrongBank.length>40)state.wrongBank.shift();
  }
  save();
}

function viewHome(){
  var t=todayIso(),d=state.days[t]||{a:0,c:0};
  var pool=activeTopics();
  var weak=pool.slice().sort(function(a,b){
    var ma=mastery(a),mb=mastery(b);
    if(!ma.seen&&mb.seen)return 1;
    if(ma.seen&&!mb.seen)return -1;
    return ma.m-mb.m;
  })[0];
  var wt=topicById(weak);
  var hello=state.name?"היי "+esc(state.name)+".":"היי.";
  var h='<main id="main" class="wrap" style="padding-top:22px;padding-bottom:40px">';
  h+='<div class="spread"><div><h1 class="h1">'+hello+'</h1>'+
     '<p class="sub">'+(d.a?"היום פתרתם "+d.a+" שאלות, "+d.c+" מהן נכון.":"אפשר להתחיל מתי שנוח.")+'</p></div>'+
     '<div class="row">'+
       (!state.settings.calm&&state.stats.streakDays>1?'<span class="chip warn">'+ic("flame",14)+' '+state.stats.streakDays+' ימים ברצף</span>':"")+
       '<span class="chip">'+ic("star",14)+' '+state.stats.xp+' נק\'</span>'+
     '</div></div>';
  h+='<div class="card pad" style="margin-top:18px">'+
     '<div class="spread"><div style="min-width:0"><div class="h2">תרגול</div>'+
     '<p class="sub sm">'+state.settings.roundLen+' שאלות · '+LVL[state.level-1]+' · '+pool.length+' נושאים</p></div>'+
     levelPicker()+'</div>'+
     '<button class="btn btn-p w" style="margin-top:14px;padding:15px;font-size:1.1rem" data-a="start">'+
       ic("pencil",19)+' מתחילים סבב</button>'+
     (wt?'<button class="btn btn-g w" style="margin-top:9px" data-a="starttopic" data-t="'+wt.id+'">'+
       ic("target",17)+' תרגול ממוקד: '+wt.name+'</button>':"")+
     '</div>';
  if(wt&&mastery(wt.id).seen){
    var pre=wt.pre&&wt.pre.length?topicById(wt.pre[0]):null;
    if(pre&&mastery(wt.id).m<40&&mastery(pre.id).m<70){
      h+='<div class="card pad" style="margin-top:14px;border-inline-start:4px solid var(--warn)">'+
        '<div class="row">'+ic("bulb",18)+'<b>הצעה</b></div>'+
        '<p class="sub sm">נראה ש-'+wt.name+' עדיין תופס. הרבה פעמים זה לא הנושא עצמו אלא מה שמתחתיו — כאן זה '+pre.name+'. שווה לתרגל אותו קודם.</p>'+
        '<button class="btn btn-g" style="margin-top:10px" data-a="starttopic" data-t="'+pre.id+'">'+ic("arrow",16)+' לתרגל '+pre.name+'</button></div>';
    }
  }
  var byNeed=pool.slice().sort(function(a,b){
    var ma=mastery(a),mb=mastery(b);
    if(!ma.seen&&!mb.seen)return 0;
    if(!ma.seen)return 1;
    if(!mb.seen)return -1;
    return ma.m-mb.m;
  }).slice(0,6);
  h+='<h2 class="h2" style="margin-top:26px">מה כדאי לתרגל עכשיו</h2>'+

     }).join("")+'</div>';
  h+='<div class="row" style="margin-top:20px"><button class="btn btn-g" data-a="go" data-v="topics">'+ic("list",17)+' כל '+pool.length+' הנושאים</button>'+

/* מצב הקול חייב להיות במסך התרגול עצמו. הודעה שמסבירה למה
   הקול לא מה שביקשת חסרת ערך אם היא מוסתרת בהגדרות. */
function voiceStrip(){
  var s=state.settings;
  if(!s.tts)return "";
  if(s.engine==="gemini"&&hasKey()&&ttsState!=="err"){
    if(ttsState!=="ok")return "";      /* עוד לא הושמע דבר — אין מה להודיע */
    return '<div class="vstrip ok">'+ic("speaker",15)+'<span>קול טבעי · '+gvName(s.gvoice).t+'</span>'+
      '<button class="btn btn-g" data-a="go" data-v="settings">להחליף</button></div>';
  }
  if(ttsState==="err")
    return '<div class="vstrip bad">'+ic("speaker",15)+'<span>הקול הטבעי לא הגיב, ההקראה עברה לקול המכשיר</span>'+
      '<button class="btn btn-g" data-a="go" data-v="settings">לבדוק</button></div>';
  return '<div class="vstrip warn">'+ic("speaker",15)+'<span>ההקראה בקול המכשיר. יש קול טבעי שנשמע כמו אדם</span>'+
    '<button class="btn btn-g" data-a="go" data-v="settings">להפעיל</button></div>';
}
function viewPractice(){
  if(!P.q)startRound();
  if(P.phase==="done")return viewSummary();
  var q=P.q,calm=state.settings.calm;
  var h='<main id="main" class="wrap" style="padding-top:18px;padding-bottom:44px">';
  /* שורת מצב */
  h+='<div class="spread">'+
      '<div class="row"><span class="chip area '+topicCls(q.topic)+'">'+q.topicName+'</span>'+
      '<span class="chip">שאלה '+(P.i+1)+' מתוך '+P.list.length+'</span></div>'+
      '<div class="row"><span class="dots">'+
        P.list.map(function(_,i){
          var c=i<P.results.length?(P.results[i]==="ok"?"ok":P.results[i]==="hp"?"hp":"no"):"";
          return '<span class="dot '+c+'"></span>';
        }).join("")+'</span>'+
      '<button class="btn btn-g" style="padding:8px 12px;font-size:.85rem" data-a="stop">'+ic("pause",15)+' עצירה</button></div>'+
     '</div>';
  h+=voiceStrip();
  h+='<div class="grid" style="grid-template-columns:minmax(0,1fr);margin-top:14px">';
  /* כרטיס השאלה */
  h+='<div class="card pad rise '+topicCls(q.topic)+'" style="border-top:3px solid var(--c)">';
  h+='<p style="font-size:clamp(1rem,3.6vw,1.15rem);font-weight:600">'+q.ask+'</p>';
  if(q.expr)h+='<p class="mline" style="margin-top:14px">'+q.expr+'</p>';
  if(q.fig)h+=q.fig;
  /* כפתורי עזר */
  h+='<div class="row" style="margin-top:16px;gap:8px">'+
     (state.settings.tts?'<button class="btn btn-g" style="padding:9px 13px;font-size:.88rem" data-a="read">'+ic("speaker",16)+' הקראה</button>':"")+
     '<button class="btn btn-g" style="padding:9px 13px;font-size:.88rem" data-a="hint"'+(P.hints>0?" disabled":"")+'>'+ic("bulb",16)+' רמז</button>'+
     '<button class="btn btn-g" style="padding:9px 13px;font-size:.88rem" data-a="guide"'+(P.steps>0?" disabled":"")+'>'+ic("steps",16)+' פתרון מודרך</button>'+
     (q.rule?'<button class="btn btn-g" style="padding:9px 13px;font-size:.88rem" data-a="rule" data-r="'+q.rule+'">'+ic("book",16)+' הנוסחה</button>':"")+
     '</div>';
  if(P.hints>0&&q.hint)h+='<div class="hintbox rise"><b>רמז</b><div class="sm" style="margin-top:3px">'+q.hint+'</div></div>';
  /* תשובות */
  var keys=["1","2","3","4"];
  h+='<div class="opts">'+q.options.map(function(o,i){
    var cls="opt",dis="";
    var wasPicked=P.picked.indexOf(i)>=0;
    if(P.phase==="reveal"){
      dis=" disabled";
      if(o.ok)cls+=" right";
      else if(wasPicked)cls+=calm?" gone":" wrong";
      else cls+=" dim";
    }else if(wasPicked){cls+=calm?" gone":" wrong";dis=" disabled"}
    return '<button class="'+cls+'"'+dis+' data-a="ans" data-i="'+i+'">'+
      '<span class="k">'+keys[i]+'</span><span class="m">'+o.h+'</span></button>';
  }).join("")+'</div>';
  /* אבחון הטעות האחרונה */
  if(P.lastWhy&&P.phase!=="reveal"){
    h+='<div class="diag rise"><b>מה קרה כאן</b><div class="sm" style="margin-top:3px">'+P.lastWhy+'</div></div>';
  }
  h+='</div>';
  /* פתרון מודרך */
  if(P.steps>0||P.phase==="reveal"){
    var showAll=P.phase==="reveal";
    var shown=showAll?q.steps.length:Math.min(P.steps,q.steps.length);
    h+='<div class="card pad rise '+topicCls(q.topic)+'"><div class="spread"><div class="h2" style="color:var(--c)">'+ic("steps",18)+' הפתרון, צעד אחר צעד</div>'+
       (state.settings.tts?'<button class="btn btn-g" style="padding:8px 12px;font-size:.85rem" data-a="readsteps">'+ic("speaker",15)+' הקראה</button>':"")+'</div>';
    h+='<div class="steps">'+q.steps.map(function(s,i){
      if(i>=shown)return "";
      return '<div class="step'+(i===q.steps.length-1?" last":"")+'"><div class="st"><span class="num">'+(i+1)+'</span>'+s.t+'</div>'+
        (s.d?'<div class="sd">'+s.d+'</div>':"")+
        (s.m?'<div class="mstep">'+s.m+'</div>':"")+'</div>';
    }).join("")+'</div>';
    if(!showAll&&shown<q.steps.length){
      h+='<button class="btn btn-p w" style="margin-top:12px" data-a="nextstep">הצעד הבא '+ic("arrow",17)+'</button>';
      h+='<p class="sub xs" style="text-align:center;margin-top:8px">אפשר לעצור בכל שלב ולנסות להמשיך לבד.</p>';
    }
    h+='</div>';
  }
  /* פס תחתון אחרי מענה */
  if(P.phase==="reveal"){
    var kind=P.results[P.results.length-1];
    h+='<div class="card pad rise" style="border-inline-start:4px solid var(--'+(kind==="ok"?"ok":kind==="hp"?"accent":"bad")+')">'+
       '<div class="row">'+ic(kind==="ok"?"check":"bulb",19)+'<b>'+lineFor(kind)+'</b></div>'+
       '<button class="btn btn-p w" style="margin-top:12px;padding:14px" data-a="next">'+
         (P.i+1>=P.list.length?"לסיכום הסבב":"לשאלה הבאה")+' '+ic("arrow",18)+'</button>'+
       (state.settings.keys?'<p class="sub xs" style="text-align:center;margin-top:8px">אפשר גם ללחוץ Enter</p>':"")+
       '</div>';
  }
  h+='</div>';
  if(state.settings.keys&&P.phase==="ask")
    h+='<p class="sub xs" style="margin-top:14px;text-align:center">מקלדת: 1–4 תשובה · רווח הקראה · H רמז · S פתרון</p>';
  return h+'</main>';
}

/* ---------- סיכום סבב ---------- */
function viewSummary(){
  var ok=P.results.filter(function(r){return r==="ok"}).length;
  var hp=P.results.filter(function(r){return r==="hp"}).length;
  var no=P.results.length-ok-hp;
  var pct=Math.round(ok/Math.max(1,P.results.length)*100);
  var byTopic={},i;
  for(i=0;i<P.list.length&&i<P.results.length;i++){
    var id=P.list[i];
    if(!byTopic[id])byTopic[id]={ok:0,n:0};
    byTopic[id].n++;if(P.results[i]==="ok")byTopic[id].ok++;
  }
  var worst=null;
  for(var k in byTopic)if(byTopic[k].n>=2&&(!worst||byTopic[k].ok/byTopic[k].n<byTopic[worst].ok/byTopic[worst].n))worst=k;
  var title=pct>=85?"סבב חזק.":pct>=60?"סבב טוב.":pct>=35?"סבב עם עבודה.":"סבב קשה — וזה בסדר.";
  var sub=pct>=85?"אתם שולטים ברוב מה שתרגלתם כאן."
       :pct>=60?"רוב הדברים במקום. יש נקודה אחת או שתיים שכדאי לחדד."
       :pct>=35?"חלק מהחומר עוד לא יושב. זה בדיוק מה שמדידה כזאת נועדה להראות."
       :"סבב כזה לא אומר עליכם כלום חוץ מזה שהחומר הזה חדש. שווה לרדת רמה ולבנות מלמטה.";
  var h='<main id="main" class="wrap" style="padding-top:26px;padding-bottom:44px;max-width:760px">';
  h+='<div class="card pad rise"><h1 class="h1">'+title+'</h1><p class="sub">'+sub+'</p>'+
     '<div class="grid g4" style="margin-top:18px">'+
       '<div class="tile" style="--c:var(--ok)"><b>'+ok+'</b><span>נכון לבד</span></div>'+
       '<div class="tile" style="--c:var(--c-alg)"><b>'+hp+'</b><span>עם פתרון מודרך</span></div>'+
       '<div class="tile" style="--c:var(--bad)"><b>'+no+'</b><span>לא נפתרו</span></div>'+
       '<div class="tile" style="--c:var(--c-geo)"><b>'+pct+'%</b><span>דיוק</span></div>'+
     '</div>';
  h+='<hr class="sep"><div class="h2">לפי נושא</div><div class="grid" style="margin-top:10px">'+
     Object.keys(byTopic).map(function(id){
       var b=byTopic[id],tp=topicById(id);
       return '<div class="spread '+topicCls(id)+'" style="gap:8px"><span class="arh">'+tp.name+'</span>'+
         '<span class="chip '+(b.ok===b.n?"ok":b.ok===0?"bad":"warn")+'">'+b.ok+' מתוך '+b.n+'</span></div>';
     }).join("")+'</div>';
  if(worst&&byTopic[worst].ok<byTopic[worst].n){
    var wt=topicById(worst);
    h+='<div class="card pad" style="margin-top:16px;background:var(--surface2)">'+
       '<div class="row">'+ic("target",17)+'<b>מה לקחת מכאן</b></div>'+
       '<p class="sub sm">'+wt.name+' היה הנושא שהכי הפריע בסבב הזה. סבב ממוקד אחד בו יעשה יותר מעוד עשר שאלות מעורבות.</p>'+
       '<button class="btn btn-p" style="margin-top:10px" data-a="starttopic" data-t="'+worst+'">'+ic("pencil",16)+' סבב ממוקד ב'+wt.name+'</button></div>';
  }
  h+='<div class="row" style="margin-top:18px">'+
     '<button class="btn btn-p" data-a="start">'+ic("refresh",17)+' סבב נוסף</button>'+
     '<button class="btn btn-g" data-a="go" data-v="home">'+ic("home",17)+' לדף הבית</button>'+
     '<button class="btn btn-g" data-a="go" data-v="progress">'+ic("chart",17)+' להתקדמות</button></div>';
  return h+'</div></main>';
}

/* ---------- התקדמות ---------- */
function viewProgress(){
  var st=state.stats;
  var acc=st.answered?Math.round(st.correct/st.answered*100):0;
  var days=[],i,d=new Date();
  for(i=13;i>=0;i--){
    var dd=new Date(d.getTime()-i*86400000);
    var key=dd.getFullYear()+"-"+String(dd.getMonth()+1).padStart(2,"0")+"-"+String(dd.getDate()).padStart(2,"0");
    days.push({k:key,r:state.days[key]||{a:0,c:0},lbl:"אבגדהוש".charAt(dd.getDay())});
  }
  var maxA=Math.max.apply(null,days.map(function(x){return x.r.a}).concat([1]));
  var seen=TOPICS.filter(function(t){return mastery(t.id).seen>0});
  var h='<main id="main" class="wrap" style="padding-top:22px;padding-bottom:44px">';
  h+='<h1 class="h1">התקדמות</h1><p class="sub">המספרים כאן הם כלי עבודה, לא ציון.</p>';
  h+='<div class="grid g4" style="margin-top:16px">'+
     '<div class="tile" style="--c:var(--c-base)"><b>'+st.answered+'</b><span>שאלות שנפתרו</span></div>'+
     '<div class="tile" style="--c:var(--ok)"><b>'+acc+'%</b><span>דיוק כולל</span></div>'+
     '<div class="tile" style="--c:var(--c-alg)"><b>'+st.helped+'</b><span>עם פתרון מודרך</span></div>'+
     '<div class="tile" style="--c:var(--c-geo)"><b>'+st.xp+'</b><span>נקודות</span></div></div>';
  h+='<div class="card pad" style="margin-top:16px"><div class="h2">שבועיים אחרונים</div>'+
     '<div style="display:flex;gap:5px;align-items:flex-end;height:120px;margin-top:14px;direction:ltr">'+
     days.map(function(x){
       var hh=Math.round(x.r.a/maxA*88);
       return '<div style="flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%">'+
         '<i style="display:block;width:100%;border-radius:5px 5px 0 0;background:'+(x.r.a?"linear-gradient(180deg,var(--c-alg),var(--c-data))":"var(--surface2)")+';height:'+Math.max(hh,4)+'px" title="'+x.r.a+' שאלות"></i>'+
         '<span class="xs faint">'+x.lbl+'</span></div>';
     }).join("")+'</div></div>';
  h+='<div class="card pad" style="margin-top:16px"><div class="h2">שליטה לפי נושא</div>';
  if(!seen.length)h+='<p class="sub sm">עוד לא תרגלתם נושאים. אחרי הסבב הראשון תופיע כאן תמונה.</p>';
  else h+='<div class="grid" style="margin-top:12px;gap:11px">'+seen.sort(function(a,b){return mastery(a.id).m-mastery(b.id).m}).map(function(tp){
    var m=mastery(tp.id);
    return '<div class="'+areaCls(tp.area)+'"><div class="spread" style="gap:8px"><span class="arh" style="font-weight:600">'+tp.name+'</span>'+
      '<span class="xs faint">'+m.ok+' מתוך '+m.seen+(m.help?" · "+m.help+" עם עזרה":"")+'</span></div>'+
      '<div class="bar '+barCls(m)+'" style="margin-top:5px"><i style="width:'+m.m+'%"></i></div></div>';
  }).join("")+'</div>';

var pendingScroll=null;
function render(){
  var html="";
  if(!state.onboarded){
    html=viewOnboard();
  }else{
    html=header();
    if(view==="home")html+=viewHome();
    else if(view==="practice")html+=viewPractice();
    else if(view==="topics")html+=viewTopics();
    else if(view==="formulas")html+=viewFormulas();
    else if(view==="progress")html+=viewProgress();
    else if(view==="settings")html+=viewSettings();
    html+='<footer><div class="wrap fbar">'+
      '<span>אקסיומה · מתמטיקה לתואר ראשון, צעד אחר צעד</span>'+
      '<span class="faint">הכול נשמר במכשיר הזה · '+BUILD+'</span></div></footer>';
  }
  $("#app").innerHTML=html;
  afterRender();
}
function afterRender(){
  if(pendingScroll){
    var el=document.getElementById(pendingScroll);
    if(el){
      el.scrollIntoView({block:"center",behavior:state.settings.rm?"auto":"smooth"});
      el.style.outline="3px solid var(--accent)";el.style.outlineOffset="3px";
      setTimeout(function(){el.style.outline="";},2600);
    }
    pendingScroll=null;
  }
}

/* ============================================================
   17. פעולות
   ============================================================ */
function goto(v){
  if(view===v)return;
  view=v;stopSpeak();
  window.scrollTo(0,0);
  render();
}
function readQuestion(){
  if(!P.q)return;
  var body=P.q.expr;
  if(body&&body.indexOf("<br>")>=0){
    var eqs=body.split("<br>");
    body=eqs.map(function(e,i){return (i===0?"משוואה ראשונה: ":"משוואה שנייה: ")+speakMath(plainOf(e))}).join(". ");
  }else body=body?speakMath(plainOf(body)):"";
  var head=speakProse(plainOf(P.q.ask)).replace(/\s+$/,"");
  var sep=/[.?!]$/.test(head)?" ":". ";
  var txt=head+(body?sep+body:"")+
    ". האפשרויות: "+P.q.options.map(function(o,i){return "אפשרות "+(i+1)+". "+speakMath(o.t)}).join(", ");
  speak(txt);
}
function readSteps(){
  if(!P.q)return;
  var shown=P.phase==="reveal"?P.q.steps.length:Math.min(P.steps,P.q.steps.length);
  var txt=P.q.steps.slice(0,shown).map(function(s){
    return s.t+". "+speakProse(s.d||"")+" "+(s.m?speakMath(plainOf(s.m)):"");
  }).join(". ");
  speak(txt);
}
function onAnswer(i){
  if(P.phase!=="ask"||!P.q)return;
  if(P.picked.indexOf(i)>=0)return;
  var o=P.q.options[i];
  P.picked.push(i);
  if(o.ok){
    P.lastWhy="";
    P.phase="reveal";
    scoreAnswer(true);
    announce("נכון");
    if(state.settings.tts)speak(lineFor(P.results[P.results.length-1]));
  }else{
    P.lastWhy=o.why||"התשובה הזו לא נכונה. שווה לפתוח את הפתרון המודרך ולראות איפה הדרך מתפצלת.";
    announce("לא נכון. "+P.lastWhy);
    if(state.settings.tts)speak(P.lastWhy);
    /* אם נגמרו האפשרויות — עוברים לחשיפה ולא משאירים תקועים */
    if(P.picked.length>=P.q.options.length-1){
      P.phase="reveal";
      scoreAnswer(false);
    }
  }
  render();
}
function advance(){
  P.i++;
  P.lastWhy="";
  if(roundDone()){P.phase="done";state.stats.rounds++;save();render();return}
  loadQ();
  window.scrollTo(0,0);
  render();
}
var VOICE_SAMPLE="פותרים את המשוואה: שלוש איקס ועוד חמש שווה עשרים. מעבירים את החמש לצד השני, ומחלקים בשלוש.";
function onAction(a,el){
  var s=state.settings;
  if(a==="go"){goto(el.getAttribute("data-v"));return}
  if(a==="lvl"){state.level=parseInt(el.getAttribute("data-l"),10);save();if(view==="practice"&&P.phase==="ask")loadQ();render();return}
  if(a==="track"){state.track=parseInt(el.getAttribute("data-t"),10);
    state.topics=state.topics.filter(function(id){var t=topicById(id);return t&&t.tracks.indexOf(state.track)>=0});
    save();render();return}
  if(a==="start"){startRound();view="practice";window.scrollTo(0,0);render();return}
  if(a==="starttopic"){var tid=el.getAttribute("data-t");startRound(tid);view="practice";window.scrollTo(0,0);render();return}
  if(a==="ans"){onAnswer(parseInt(el.getAttribute("data-i"),10));return}
  if(a==="next"){advance();return}
  if(a==="stop"){
    if(P.results.length===0){goto("home");return}
    P.list=P.list.slice(0,P.results.length);P.phase="done";save();window.scrollTo(0,0);render();return}
  if(a==="hint"){P.hints=1;render();if(s.tts&&P.q.hint)speak(P.q.hint);return}
  if(a==="guide"){
    P.steps=1;P.usedHelp=true;
    render();if(s.tts)readSteps();return}
  if(a==="nextstep"){
    P.steps++;P.usedHelp=true;
    if(P.steps>=P.q.steps.length&&P.phase==="ask"){P.phase="reveal";scoreAnswer(false)}
    render();
    if(s.tts&&P.q.steps[P.steps-1]){
      var st=P.q.steps[P.steps-1];
      speak(st.t+". "+speakProse(st.d||"")+" "+(st.m?speakMath(plainOf(st.m)):""));
    }
    return}
  if(a==="read"){readQuestion();return}
  if(a==="readsteps"){readSteps();return}
  if(a==="rule"){fq="";view="formulas";pendingScroll="f-"+el.getAttribute("data-r");window.scrollTo(0,0);render();return}
  if(a==="tog"){var k=el.getAttribute("data-k");s[k]=!s[k];save();applyModes();render();return}
  if(a==="ts"){s.ts=parseInt(el.getAttribute("data-n"),10);save();applyModes();render();return}
  if(a==="theme"){s.theme=el.getAttribute("data-n");save();applyModes();render();return}
  if(a==="rlen"){s.roundLen=parseInt(el.getAttribute("data-n"),10);save();render();return}
  if(a==="engine"){s.engine=el.getAttribute("data-n");ttsErr="";ttsState="";save();render();speak(VOICE_SAMPLE);return}
  if(a==="gvoice"){s.gvoice=el.getAttribute("data-n");ttsErr="";ttsState="";save();render();speak(VOICE_SAMPLE);return}
  if(a==="clearkey"){saveKey("");ttsErr="";render();return}
  if(a==="voice"){s.voice=el.getAttribute("data-u");s.engine="device";save();render();speak(VOICE_SAMPLE);return}
  if(a==="test"){speak(VOICE_SAMPLE);return}
  if(a==="pick"){
    var id=el.getAttribute("data-t"),ix=state.topics.indexOf(id);
    if(ix>=0)state.topics.splice(ix,1);else state.topics.push(id);
    save();render();return}
  if(a==="selall"){state.topics=topicsForTrack(state.track).map(function(t){return t.id});save();render();return}
  if(a==="selnone"){state.topics=[];save();render();return}
  if(a==="fclear"){fq="";render();return}
  if(a==="obnext"){
    P.obStep=(P.obStep||1)+1;
    if(P.obStep>3){state.onboarded=true;save();applyModes();view="home";window.scrollTo(0,0)}
    save();render();return}
  if(a==="obback"){P.obStep=Math.max(1,(P.obStep||1)-1);render();return}
  if(a==="reset"){
    if(!P.confirmReset){P.confirmReset=true;el.textContent="לוחצים שוב כדי למחוק סופית";return}
    try{localStorage.removeItem(KEY)}catch(e){}
    state=blankState();P=({list:[],i:0,q:null,phase:"ask",picked:[],hints:0,steps:0,usedHelp:false,results:[]});
    applyModes();view="home";render();return}
}

/* ============================================================
   18. אירועים
   ============================================================ */
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-a]");
  if(el&&!el.disabled)onAction(el.getAttribute("data-a"),el);
});
document.addEventListener("input",function(e){
  var el=e.target;
  if(!el.dataset)return;
  if(el.dataset.bind==="name"){state.name=el.value;save();return}
  if(el.dataset.bind==="gkey"){
    var k=String(el.value||"").trim();
    /* מציירים מחדש רק כשהמפתח נראה שלם, אחרת הפוקוס קופץ בכל תו */
    if(/^AIza[\w-]{25,}$/.test(k)){saveKey(k);ttsErr="";render();speak(VOICE_SAMPLE)}
    return}
  if(el.dataset.bind==="fq"){fq=el.value;
    var pos=el.selectionStart;render();
    var again=document.querySelector('[data-bind="fq"]');
    if(again){again.focus();try{again.setSelectionRange(pos,pos)}catch(x){}}
    return}
  if(el.dataset.slide==="rate"){
    state.settings.rate=parseFloat(el.value);save();
    var lab=$("#ratev");if(lab)lab.textContent=state.settings.rate.toFixed(2);
    return}
});
document.addEventListener("keydown",function(e){
  if(!state.settings.keys)return;
  if(e.target.closest("input,textarea,select"))return;
  if(!state.onboarded||view!=="practice"||!P.q)return;
  if(P.phase==="ask"&&/^[1-4]$/.test(e.key)){
    var i=parseInt(e.key,10)-1;
    if(P.q.options[i]){e.preventDefault();onAnswer(i)}
    return;
  }
  if(e.key===" "){e.preventDefault();readQuestion();return}
  if(e.key==="h"||e.key==="H"){e.preventDefault();if(P.phase==="ask"&&!P.hints)onAction("hint",document.body);return}
  if(e.key==="s"||e.key==="S"){e.preventDefault();if(!P.steps)onAction("guide",document.body);else onAction("nextstep",document.body);return}
  if(e.key==="Enter"&&P.phase==="reveal"){e.preventDefault();advance();return}
});
window.addEventListener("error",function(){
  try{
    $("#app").innerHTML='<div class="wrap" style="padding-block:60px;max-width:520px">'+
      '<div class="card pad"><h1 class="h1">משהו נתקע</h1>'+
      '<p class="sub">זו תקלה שלנו, לא שלכם. ההתקדמות שמורה.</p>'+
      '<button class="btn btn-p" style="margin-top:14px" onclick="location.reload()">לטעון מחדש</button></div></div>';
  }catch(e){}
});

/* ============================================================
   19. הפעלה
   ============================================================ */
load();
loadKey();
applyModes();
try{if(window.speechSynthesis)speechSynthesis.onvoiceschanged=function(){if(view==="settings")render()}}catch(e){}
render();
</script>
</body>
