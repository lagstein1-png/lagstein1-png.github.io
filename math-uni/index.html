<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>אקסיומה — מתמטיקה לתואר ראשון, צעד אחר צעד</title>
<meta name="description" content="תרגול מתמטיקה לשנה א׳ באוניברסיטה: חדו״א, אלגברה לינארית, הסתברות ובדידה. כל שאלה עם פתרון מודרך צעד־צעד, זיהוי הטעות, דף נוסחאות והקראה בקול טבעי." />
<meta name="theme-color" content="#0e1117" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   אקסיומה — מתמטיקה לתואר ראשון
   אותו עיקרון של ״שלב״, בחומר של שנה א׳: חדו״א, אלגברה לינארית,
   הסתברות ובדידה. סטודנט שמתקשה לא צריך פחות חומר — הוא צריך
   לראות את הצעדים שבין שורה לשורה.
   ============================================================ */
:root{
  --font:"Heebo","Rubik",system-ui,"Segoe UI",Arial,sans-serif;
  --bg:#f5f7fb; --surface:#ffffff; --surface2:#eef1f7;
  --ink:#101828; --muted:#5b6478; --faint:#8b93a7; --line:#e0e4ee;
  --accent:#4f46e5; --accent-ink:#ffffff; --accent-soft:#e9e8fd;
  --cyan:#0e7490; --cyan-soft:#dcf3f8;
  --ok:#15803d; --ok-soft:#dcfce7; --bad:#be123c; --bad-soft:#ffe4e9;
  --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px -12px rgba(16,24,40,.18);
  --r:14px;
  /* צבע לכל תחום לימוד. זה לא קישוט — זה עוזר לזהות מיד באיזה
     סוג חומר מדובר, וזה בדיוק מה שעוזר למי שמתקשה להתמצא. */
  --c-base:#0d9488; --cs-base:#d2f4ef;
  --c-alg:#5b56e0;  --cs-alg:#e6e5fe;
  --c-geo:#b45309;  --cs-geo:#fbecd3;
  --c-data:#be185d; --cs-data:#fbdfeb;
}
:root[data-theme="dark"]{
  --bg:#0e1117; --surface:#161b26; --surface2:#1e2532;
  --ink:#e8ecf4; --muted:#9aa4ba; --faint:#6f7a91; --line:#28313f;
  --accent:#818cf8; --accent-ink:#0e1117; --accent-soft:#232842;
  --cyan:#22d3ee; --cyan-soft:#132b33;
  --ok:#4ade80; --ok-soft:#132a1c; --bad:#fb7185; --bad-soft:#33161f;
  --warn:#fbbf24; --warn-soft:#33260f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  --c-base:#2dd4bf; --cs-base:#0f2e2b;
  --c-alg:#a5b4fc;  --cs-alg:#1e2140;
  --c-geo:#fbbf24;  --cs-geo:#33270f;
  --c-data:#f472b6; --cs-data:#33162a;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1117; --surface:#161b26; --surface2:#1e2532;
    --ink:#e8ecf4; --muted:#9aa4ba; --faint:#6f7a91; --line:#28313f;
    --accent:#818cf8; --accent-ink:#0e1117; --accent-soft:#232842;
    --cyan:#22d3ee; --cyan-soft:#132b33;
    --ok:#4ade80; --ok-soft:#132a1c; --bad:#fb7185; --bad-soft:#33161f;
    --warn:#fbbf24; --warn-soft:#33260f;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  --c-base:#2dd4bf; --cs-base:#0f2e2b;
  --c-alg:#a5b4fc;  --cs-alg:#1e2140;
  --c-geo:#fbbf24;  --cs-geo:#33270f;
  --c-data:#f472b6; --cs-data:#33162a;
  }
}
/* ניגודיות גבוהה — שחור על לבן, מסגרות מלאות, בלי גוונים רכים */
:root.hc{
  --bg:#ffffff; --surface:#ffffff; --surface2:#ffffff;
  --ink:#000000; --muted:#1a1a1a; --faint:#333333; --line:#000000;
  --accent:#00308f; --accent-ink:#ffffff; --accent-soft:#e8edf8;
  --cyan:#004b57; --cyan-soft:#e6f2f4;
  --ok:#0a5c2a; --ok-soft:#e6f4ea; --bad:#8c0f2c; --bad-soft:#fbe9ed;
  --warn:#6b3d00; --warn-soft:#f7efdf; --shadow:none;
  --c-base:#00308f; --cs-base:#e8edf8; --c-alg:#00308f; --cs-alg:#e8edf8;
  --c-geo:#00308f;  --cs-geo:#e8edf8;  --c-data:#00308f; --cs-data:#e8edf8;
}
:root.hc .card,:root.hc .opt,:root.hc .btn,:root.hc .chip,:root.hc .tile{border:2px solid #000}
:root.hc .deco{display:none}

*{box-sizing:border-box;margin:0}
html{font-size:100%}
html.ts2{font-size:112%}
html.ts3{font-size:126%}
/* פונט ברור לקריאה: Tahoma ו-Verdana קיימים כמעט בכל מכשיר וכוללים עברית */
html.clearfont{--font:Tahoma,Verdana,Arial,sans-serif}
/* ריווח מוגדל — עוזר לקוראים עם דיסלקציה */
html.spaced body{letter-spacing:.03em;word-spacing:.16em;line-height:1.95}
html.rm *,html.rm *::before,html.rm *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.65;
  -webkit-text-size-adjust:100%;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:inherit}
input,select,textarea{font:inherit;color:var(--ink)}
a{color:var(--accent)}
::selection{background:var(--accent);color:var(--accent-ink)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---------- שלד ---------- */
#app{min-height:100vh;display:flex;flex-direction:column}
/* בלי זה כרום מותח כל מסך לרוחב המינימלי של התוכן שלו והעמוד גולש בטלפון */
#app>*{min-width:0;width:100%}
.wrap{max-width:1120px;margin:0 auto;padding:0 clamp(12px,4vw,22px)}
.deco{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.85;
  background:
    radial-gradient(760px 380px at 92% -6%,var(--cs-alg),transparent 62%),
    radial-gradient(620px 340px at 2% 18%,var(--cs-data),transparent 58%),
    radial-gradient(700px 380px at 10% 102%,var(--cs-base),transparent 60%),
    radial-gradient(520px 300px at 96% 78%,var(--cs-geo),transparent 58%)}
#app{position:relative;z-index:1}

/* ---------- כותרת עליונה ---------- */
header{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:10px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand .mk{width:38px;height:38px;border-radius:11px;
  background:linear-gradient(140deg,var(--c-alg),var(--c-data) 55%,var(--c-geo));color:#fff;
  display:grid;place-items:center;font-weight:800;font-size:1.05rem;flex-shrink:0}
:root.hc .brand .mk{background:var(--ink)}
.brand b{display:block;font-size:1rem;line-height:1.15;font-weight:800}
.brand small{display:block;color:var(--muted);font-size:.72rem;font-weight:500}
nav{display:flex;gap:4px;margin-inline-start:auto;flex-wrap:wrap}
.nb{display:inline-flex;align-items:center;gap:6px;border-radius:10px;padding:8px 12px;
  font-size:.9rem;font-weight:600;color:var(--muted);border:1px solid transparent;transition:.15s}
.nb:hover{background:var(--surface2);color:var(--ink)}
.nb.on{background:var(--accent);color:#fff}
:root.hc .nb.on{background:var(--ink);color:var(--bg)}
.nb svg{flex-shrink:0}
@media(max-width:560px){.nb span{display:none}.nb{padding:9px 11px}}

/* ---------- רכיבי בסיס ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:clamp(14px,3.4vw,22px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:11px;
  font-weight:700;padding:12px 18px;transition:.15s;border:1px solid transparent;line-height:1.3}
.btn-p{background:linear-gradient(135deg,var(--accent),var(--c-data));color:#fff}
.btn-p:hover{filter:brightness(1.1)}
:root.hc .btn-p{background:var(--accent)}
.btn-d{background:var(--ink);color:var(--bg)}
.btn-g{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-g:hover{background:var(--surface2)}
.btn[disabled]{opacity:.42;cursor:not-allowed}
.btn.w{width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;
  font-size:.82rem;font-weight:600;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.chip.a{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.h1{font-size:clamp(1.5rem,5.2vw,2.05rem);font-weight:800;line-height:1.2;overflow-wrap:anywhere}
.h2{font-size:clamp(1.1rem,3.6vw,1.3rem);font-weight:700;overflow-wrap:anywhere}
.sub{color:var(--muted);margin-top:5px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.sm{font-size:.85rem}
.xs{font-size:.76rem}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
/* רשימת הקולות: שתי עמודות רק כשבאמת יש מקום, אחרת השמות נקטעים */
.vgrid{grid-template-columns:repeat(auto-fit,minmax(min(100%,215px),1fr));gap:8px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
hr.sep{border:none;border-top:1px solid var(--line);margin:16px 0}

/* ---------- מתמטיקה: תמיד משמאל לימין, מבודד מהעברית ---------- */
.m{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums}
.mline{direction:ltr;unicode-bidi:isolate;text-align:center;font-weight:700;
  font-size:clamp(1.55rem,7vw,2.5rem);letter-spacing:.01em;line-height:1.35;overflow-wrap:anywhere}
.mstep{direction:ltr;unicode-bidi:isolate;text-align:center;font-weight:700;
  font-size:clamp(1.05rem,4.6vw,1.35rem);background:var(--surface2);border-radius:10px;
  padding:9px 12px;margin-top:8px;overflow-wrap:anywhere}
sup{font-size:.62em;vertical-align:super;line-height:0}
sub{font-size:.62em;vertical-align:sub;line-height:0}
/* ---------- מטריצה ווקטור ---------- */
.mtx{display:inline-flex;align-items:stretch;gap:7px;vertical-align:middle;
  padding:3px 10px;margin:0 .2em;position:relative;direction:ltr}
.mtx::before,.mtx::after{content:"";position:absolute;top:0;bottom:0;width:7px;
  border-top:2px solid currentColor;border-bottom:2px solid currentColor}
.mtx::before{inset-inline-start:0;border-inline-start:2px solid currentColor}
.mtx::after{inset-inline-end:0;border-inline-end:2px solid currentColor}
.mtx .mcol{display:flex;flex-direction:column;gap:3px;text-align:center;min-width:1.5em}
.mtx .mcol>span{padding:1px 4px;font-variant-numeric:tabular-nums}
.vec{display:inline-flex;gap:9px;padding:2px 11px;margin:0 .16em;direction:ltr;
  border-inline-start:2px solid currentColor;border-inline-end:2px solid currentColor;border-radius:9px}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;
  line-height:1.05;margin:0 .18em;font-size:.86em}
.frac>span:first-child{border-bottom:.09em solid currentColor;padding:0 .22em}
.frac>span:last-child{padding:0 .22em}

/* ---------- תשובות ---------- */
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
@media(max-width:430px){.opts{grid-template-columns:minmax(0,1fr)}}
.opt{position:relative;border:2px solid var(--line);background:var(--surface);border-radius:12px;
  padding:15px 14px 15px 44px;font-weight:700;font-size:clamp(1rem,4vw,1.2rem);transition:.14s;min-height:58px;
  display:flex;align-items:center;gap:10px}
[dir="rtl"] .opt{padding:15px 44px 15px 14px}
.opt:hover:not([disabled]){border-color:var(--c,var(--accent));background:var(--cs,var(--accent-soft))}
.opt .k{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);
  width:24px;height:24px;border-radius:7px;background:var(--cs,var(--surface2));color:var(--c,var(--faint));
  display:grid;place-items:center;font-size:.76rem;font-weight:700}
/* currentColor כאן היה נפתר לצבע שנקבע באותה הצהרה עצמה,
   ולכן הרקע והטקסט יצאו זהים והספרה נעלמה. */
.opt.right .k{background:var(--ok);color:var(--surface)}
.opt.wrong .k{background:var(--bad);color:var(--surface)}
.opt.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.opt.dim{opacity:.4}
.opt.gone{opacity:.35;text-decoration:line-through}

/* ---------- פתרון מודרך ---------- */
.steps{margin-top:16px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.step{padding:13px 15px;border-top:1px solid var(--line);background:var(--surface)}
.step:first-child{border-top:none}
.step.future{display:none}
.step .st{display:flex;align-items:center;gap:9px;font-weight:700;font-size:.95rem}
.step .num{width:23px;height:23px;border-radius:50%;background:var(--c,var(--accent));color:#fff;
  display:grid;place-items:center;font-size:.76rem;flex-shrink:0;font-weight:700}
.step .sd{color:var(--muted);font-size:.92rem;margin-top:4px;overflow-wrap:anywhere}
.step.last{background:var(--ok-soft)}
.step.last .num{background:var(--ok);color:var(--surface)}

/* ---------- פירוט טעות ---------- */
.diag{margin-top:14px;border-inline-start:4px solid var(--bad);background:var(--bad-soft);
  border-radius:0 10px 10px 0;padding:12px 15px}
[dir="rtl"] .diag{border-radius:10px 0 0 10px}
.diag b{color:var(--bad)}
.hintbox{margin-top:14px;border-inline-start:4px solid var(--warn);background:var(--warn-soft);
  border-radius:0 10px 10px 0;padding:12px 15px}
[dir="rtl"] .hintbox{border-radius:10px 0 0 10px}

/* ---------- מדדים ---------- */
.bar{height:7px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s,background .3s}
.bar.ok>i{background:var(--ok)}
.bar.mid>i{background:var(--warn)}
.bar.low>i{background:var(--bad)}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--surface2);border:1px solid var(--line)}
.dot.ok{background:var(--ok);border-color:var(--ok)}
.dot.no{background:var(--bad);border-color:var(--bad)}
.dot.hp{background:var(--warn);border-color:var(--warn)}
.tile{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--c,var(--accent));
  border-radius:12px;padding:14px;box-shadow:var(--shadow)}
.tile b{display:block;font-size:1.7rem;font-weight:800;line-height:1.2;color:var(--c,var(--ink))}
.tile span{color:var(--muted);font-size:.82rem}

/* ---------- כרטיס נושא ---------- */
.tpc{position:relative;display:flex;flex-direction:column;gap:9px;text-align:start;background:var(--surface);
  border:1px solid var(--line);border-inline-start:4px solid var(--c,var(--accent));
  border-radius:12px;padding:14px;transition:.15s;box-shadow:var(--shadow);min-width:0}
.tpc:hover{border-color:var(--c,var(--accent));transform:translateY(-2px);box-shadow:0 8px 22px -12px var(--c)}
.tpc:hover{border-inline-start-color:var(--c,var(--accent))}
.tpc.on{border-color:var(--c,var(--accent));background:var(--cs,var(--accent-soft))}
.tpc .tn{color:var(--c,var(--ink))}
.tpc .tn{font-weight:700;font-size:.98rem;overflow-wrap:anywhere}
.tpc .td{color:var(--muted);font-size:.8rem;overflow-wrap:anywhere}
.tpc .tm{display:flex;align-items:center;gap:7px;font-size:.74rem;color:var(--faint)}
.tpc .tm .bar{flex:1;min-width:0}

/* ---------- מתגים והגדרות ---------- */
.tog{display:flex;align-items:center;gap:13px;width:100%;text-align:start;background:var(--surface2);
  border:1px solid transparent;border-radius:12px;padding:13px 15px;transition:.15s;min-width:0}
.tog:hover{border-color:var(--line)}
.tog+.tog{margin-top:9px}
.tog .tt{flex:1;min-width:0}
.tog .tt b{display:block;font-size:.97rem;overflow-wrap:anywhere}
.tog .tt span{display:block;color:var(--muted);font-size:.82rem;overflow-wrap:anywhere}
.sw{position:relative;width:46px;height:27px;border-radius:99px;background:var(--line);flex-shrink:0;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:21px;height:21px;border-radius:50%;
  background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .2s}
.tog[aria-checked="true"] .sw{background:var(--accent)}
.tog[aria-checked="true"] .sw::after{transform:translateX(-19px)}
[dir="ltr"] .tog[aria-checked="true"] .sw::after{transform:translateX(19px)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 auto;min-width:0;border:1px solid var(--line);background:var(--surface);
  border-radius:10px;padding:10px 12px;font-weight:600;font-size:.9rem;color:var(--muted);transition:.15s}
.seg button.on{background:var(--c,var(--ink));color:#fff;border-color:transparent}
:root.hc .seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--accent)}
.field{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:11px;
  padding:12px 14px;font-size:1rem;outline:none}
.field:focus{border-color:var(--accent)}

/* ---------- דף נוסחאות ---------- */
.a-base{--c:var(--c-base);--cs:var(--cs-base)}
.a-alg{--c:var(--c-alg);--cs:var(--cs-alg)}
.a-geo{--c:var(--c-geo);--cs:var(--cs-geo)}
.a-data{--c:var(--c-data);--cs:var(--cs-data)}
.chip.area{background:var(--cs);color:var(--c);border-color:transparent}
.arh{display:flex;align-items:center;gap:9px}
.arh::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c);flex-shrink:0}
.fcard{background:var(--surface);border:1px solid var(--line);border-inline-start:4px solid var(--c,var(--line));
  border-radius:12px;padding:13px 15px;min-width:0}
.fcard .fm{color:var(--c,var(--ink))}
.fcard .ft{font-weight:700;font-size:.93rem}
.fcard .fm{margin-top:7px;font-size:1.05rem}
.fcard .fn{color:var(--muted);font-size:.82rem;margin-top:6px;overflow-wrap:anywhere}

/* ---------- שורת מצב הקול ---------- */
.vstrip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;
  padding:9px 13px;border-radius:11px;font-size:.86rem;font-weight:600;line-height:1.5}
.vstrip>span{flex:1;min-width:0}
.vstrip .btn{padding:6px 12px;font-size:.8rem;background:var(--surface);border-color:currentColor}
.vstrip.ok{background:var(--ok-soft);color:var(--ok)}
.vstrip.warn{background:var(--warn-soft);color:var(--warn)}
.vstrip.bad{background:var(--bad-soft);color:var(--bad)}
.vstrip svg{flex-shrink:0}

/* ---------- שכבות ---------- */

  font-weight:700;color:var(--muted);flex-shrink:0;display:grid;place-items:center}

/* ---------- אנימציות מדודות ---------- */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ============================================================
   1. עזרים כלליים
   ============================================================ */
function $(s){return document.querySelector(s)}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){var i,j,t;for(i=a.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=a[i];a[i]=a[j];a[j]=t}return a}
/* מספר שלם שאינו אפס — הרבה מחוללים צריכים בדיוק את זה */
function rnz(a,b){var v=0;while(v===0)v=ri(a,b);return v}
function todayIso(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/86400000)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function uniq(a){return a.filter(function(v,i){return a.indexOf(v)===i})}

/* ============================================================
   2. עזרי מתמטיקה — שברים, מספרים, ביטויים
   כל התצוגה במתמטיקה נבנית כאן, כדי שהעברית והנוסחאות
   לא יתערבבו בכיוון הכתיבה.
   ============================================================ */
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t}return a||1}
function lcm(a,b){return Math.abs(a*b)/gcd(a,b)}

/* שבר מצומצם. den תמיד חיובי, הסימן יושב במונה. */
function Fr(n,d){
  if(d===undefined)d=1;
  if(d===0)d=1;
  if(d<0){n=-n;d=-d}
  var g=gcd(n,d);
  this.n=n/g;this.d=d/g;
}
Fr.prototype.add=function(o){return new Fr(this.n*o.d+o.n*this.d,this.d*o.d)};
Fr.prototype.sub=function(o){return new Fr(this.n*o.d-o.n*this.d,this.d*o.d)};
Fr.prototype.mul=function(o){return new Fr(this.n*o.n,this.d*o.d)};
Fr.prototype.div=function(o){return new Fr(this.n*o.d,this.d*o.n)};
Fr.prototype.isInt=function(){return this.d===1};
Fr.prototype.val=function(){return this.n/this.d};
Fr.prototype.eq=function(o){return this.n===o.n&&this.d===o.d};
/* טקסט פשוט — להקראה ולהשוואה */
Fr.prototype.txt=function(){return this.d===1?String(this.n):(this.n+"/"+this.d)};
/* HTML — שבר אמיתי עם קו אופקי, קריא הרבה יותר לתלמיד שמתקשה */
Fr.prototype.html=function(){
  if(this.d===1)return String(this.n);
  var sign=this.n<0?"−":"";
  return sign+'<span class="frac"><span>'+Math.abs(this.n)+'</span><span>'+this.d+'</span></span>';
};
Fr.prototype.say=function(){
  if(this.d===1)return String(this.n);
  return (this.n<0?"מינוס ":"")+Math.abs(this.n)+" חלקי "+this.d;
};
function fr(n,d){return new Fr(n,d)}
/* הצגה בלי צמצום. שלב ההרחבה למכנה משותף חייב להראות את 10/15,
   ולא את 2/3 שאליו הוא מצטמצם. */
function rawFr(n,d){
  if(d===1)return String(n);
  var sign=n<0?"−":"";
  return sign+'<span class="frac"><span>'+Math.abs(n)+'</span><span>'+d+'</span></span>';
}

/* מספר לתצוגה: מינוס טיפוגרפי, בלי אפסים מיותרים אחרי הנקודה */
function r2(v){return Math.round(v*100)/100}
function num(v){
  if(typeof v!=="number")return String(v);
  var s=(Math.round(v*1e6)/1e6).toString();
  return s.replace(/^-/,"−");
}
function say(v){return String(v).replace(/−/g,"מינוס ").replace(/·/g," כפול ")}

/* " + 5" / " − 5" — לחיבור איברים בביטוי */
function sgn(v){return (v<0?" − ":" + ")+Math.abs(v)}
/* מקדם לפני משתנה: 1x -> x, -1x -> -x */
function coef(c,v){
  if(c===1)return v;
  if(c===-1)return "−"+v;
  return num(c)+v;
}
/* מקדם שמופיע לפני סוגריים. 1 לא נכתב, ו-−1 נכתב כמינוס בלבד. */
function fac(c){return c===1?"":c===-1?"−":num(c)}
/* איבר עם סימן, לשרשור בתוך ביטוי: " + 3x" / " − x" */
function term(c,v){
  if(c===0)return "";
  var s=c<0?" − ":" + ",a=Math.abs(c);
  return s+(a===1?v:a+v);
}
/* חזקה */
function pw(base,e){
  if(e===1)return base;
  if(e===0)return "1";
  return base+"<sup>"+num(e)+"</sup>";
}
/* פולינום ריבועי מהמקדמים */
function quadStr(a,b,c,v){
  v=v||"x";
  var s=(a===1?"":a===-1?"−":num(a))+v+"<sup>2</sup>";
  s+=term(b,v);
  if(c!==0)s+=sgn(c);
  return s;
}
/* שורש: מציג √50 = 5√2 */
function simpRoot(n){
  var out=1,i;
  for(i=Math.floor(Math.sqrt(n));i>=2;i--){ if(n%(i*i)===0){out=i;n=n/(i*i);break} }
  return {out:out,in:n};
}
function rootHtml(o){
  if(o.in===1)return String(o.out);
  return (o.out===1?"":o.out)+"√"+o.in;
}
function isSquare(n){var r=Math.round(Math.sqrt(n));return r*r===n}

/* מטריצה מ-מערך שורות: mat([[1,2],[3,4]]) */
function mat(rows){
  var cols=rows[0].length,out="",c,r;
  for(c=0;c<cols;c++){
    out+='<span class="mcol">';
    for(r=0;r<rows.length;r++)out+='<span>'+num(rows[r][c])+'</span>';
    out+='</span>';
  }
  return '<span class="mtx">'+out+'</span>';
}
function vecH(a){return '<span class="vec">'+a.map(num).join(" , ")+'</span>'}
/* פולינום ממערך מקדמים מהחזקה הגבוהה לנמוכה: poly([2,0,-5,1]) */
function poly(cs,v){
  v=v||"x";
  var n=cs.length-1,out="",i,c,p,t;
  for(i=0;i<cs.length;i++){
    c=cs[i];p=n-i;
    if(c===0)continue;
    t=(p===0?String(Math.abs(c)):(Math.abs(c)===1?"":Math.abs(c))+pw(v,p));
    out+=out===""?(c<0?"−":"")+t:(c<0?" − ":" + ")+t;
  }
  return out===""?"0":out;
}

var BUILD="u1 · 2026-08-28";
var KEY="axiom-state-v1";

function blankState(){
  return {
    v:1,
    name:"",
    track:1,                 /* 1 מדעים והנדסה · 2 מדעי המחשב · 3 מדעי החברה */
    level:2,                 /* 1 בסיס · 2 רגיל · 3 מאתגר */
    topics:[],               /* הנושאים שנבחרו לתרגול */
    mastery:{},              /* לכל נושא: {seen,ok,help,m} כאשר m הוא 0..100 */
    stats:{answered:0,correct:0,helped:0,xp:0,streakDays:0,lastDay:"",rounds:0},
    days:{},
    wrongBank:[],            /* נושאים שנפלו בהם — חוזרים לתרגול */
    settings:{theme:"auto",ts:1,clearfont:false,spaced:false,hc:false,rm:false,
              calm:false,tts:true,rate:0.95,engine:"gemini",gvoice:"Kore",voice:"",
              roundLen:8,keys:true,autoSteps:false}
  };
}
var state=blankState();

function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(!raw)return false;
    var s=JSON.parse(raw);
    if(!s||typeof s!=="object")return false;
    var base=blankState(),k;
    for(k in base)if(!(k in s))s[k]=base[k];
    for(k in base.settings)if(!(k in s.settings))s.settings[k]=base.settings[k];
    for(k in base.stats)if(!(k in s.stats))s.stats[k]=base.stats[k];
    state=s;
    return true;
  }catch(e){return false}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}

/* רצף ימים — נספר רק כשבאמת תרגלו, ובמצב רגוע לא מוצג בכלל */
function touchDay(){
  var d=todayIso(),st=state.stats;
  if(st.lastDay===d)return;
  if(st.lastDay&&daysBetween(st.lastDay,d)===1)st.streakDays++;
  else st.streakDays=1;
  st.lastDay=d;
}
function dayRec(){
  var d=todayIso();
  if(!state.days[d])state.days[d]={a:0,c:0};
  return state.days[d];
}

/* ============================================================
   5. נגישות: גודל טקסט, פונט, ניגודיות, תנועה, ערכת צבע
   ============================================================ */
function applyModes(){
  var h=document.documentElement,s=state.settings;
  h.classList.toggle("ts2",s.ts===2);
  h.classList.toggle("ts3",s.ts===3);
  h.classList.toggle("clearfont",!!s.clearfont);
  h.classList.toggle("spaced",!!s.spaced);
  h.classList.toggle("hc",!!s.hc);
  h.classList.toggle("rm",!!s.rm);
  if(s.theme==="auto")h.removeAttribute("data-theme");
  else h.setAttribute("data-theme",s.theme);
}

   · קול המכשיר — עובד תמיד ובלי רשת, אבל נשמע רובוטי.
   הקצב אצל Gemini לא נשלח כפרמטר (ה-API מחזיר 400 על audioConfig),

];
function gvName(id){for(var i=0;i<GEM_VOICES.length;i++)if(GEM_VOICES[i].id===id)return GEM_VOICES[i];return GEM_VOICES[0]}
var GKEY="";
function loadKey(){
  try{
    GKEY=localStorage.getItem("axiom-gkey")||"";
    /* מפתח שכבר הוזן באחת האפליקציות האחרות באתר עובד גם כאן */
    if(!GKEY)GKEY=localStorage.getItem("shlav-gkey")||"";
    if(!GKEY)GKEY=localStorage.getItem("reader-gkey")||"";
    if(!GKEY){
      var raw=localStorage.getItem("mlh-state-v2");
      if(raw){var o=JSON.parse(raw);if(o&&o.settings&&o.settings.googleKey)GKEY=String(o.settings.googleKey).trim()}
    }
  }catch(e){GKEY=""}
  return GKEY;
}
function saveKey(k){
  GKEY=String(k||"").trim();
  try{GKEY?localStorage.setItem("axiom-gkey",GKEY):localStorage.removeItem("axiom-gkey")}catch(e){}
}
function hasKey(){return !!GKEY}

function voices(){try{return window.speechSynthesis?speechSynthesis.getVoices():[]}catch(e){return[]}}
function hebVoices(){return voices().filter(function(v){return /^(he|iw)/i.test(v.lang||"")})}
/* עברית קודם, ואחריה כל השאר — כדי שתמיד תהיה רשימה לבחור ממנה */
function pickList(){
  var he=hebVoices(),rest=voices().filter(function(v){return he.indexOf(v)<0});
  return he.concat(rest);
}
function deviceVoice(){
  var list=pickList(),i;
  if(!list.length)return null;
  for(i=0;i<list.length;i++)if(list[i].voiceURI===state.settings.voice)return list[i];
  return list[0];
}
/* "gemini:Kore" או "device" */
function voiceMode(){
  var v=state.settings.engine;
  if(v==="gemini"&&hasKey())return "gemini";
  return "device";
}

var gAudio=null,gCache={};
function gStop(){if(gAudio){try{gAudio.pause();gAudio.src=""}catch(e){}gAudio=null}}
function gSynth(text,voiceName,rate){
  var lead=rate<=0.75?"קרא לאט מאוד וברור, בעברית: "
          :rate<=0.9 ?"קרא לאט וברור, בעברית: "
          :rate>=1.15?"קרא בקצב מהיר, בעברית: "
          :"קרא בקצב טבעי, בעברית: ";
  var body={contents:[{parts:[{text:lead+text}]}],
    generationConfig:{responseModalities:["AUDIO"],
      speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:voiceName}}}}};
  return fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key="+encodeURIComponent(GKEY),
    {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})
  .then(function(r){
    if(r.ok)return r.json();
    /* גוגל מסביר בגוף התשובה למה סירב. בלי זה אי אפשר לדעת אם
       המפתח שגוי, המודל חסום, או שהבקשה עצמה לא תקינה. */
    return r.text().then(function(t){
      var msg="";
      try{var j=JSON.parse(t);msg=(j.error&&j.error.message)||""}catch(e){msg=String(t).slice(0,140)}
      throw new Error(r.status+(msg?" — "+msg:""));
    });
  })
  .then(function(d){
    var parts=(d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts)||[];
    for(var i=0;i<parts.length;i++){
      var pd=parts[i].inlineData;
      if(pd&&pd.data){
        var mt=pd.mimeType||"";
        if(mt.indexOf("wav")>=0||mt.indexOf("pcm")>=0||mt.indexOf("L16")>=0)
          return pcmToWav(pd.data)||("data:audio/wav;base64,"+pd.data);
        return "data:audio/mp3;base64,"+pd.data;
      }
    }
    throw new Error("לא התקבל שמע");
  });
}
/* Gemini מחזיר PCM גולמי. בלי כותרת WAV אף דפדפן לא ינגן אותו. */
function pcmToWav(b64){
  try{
    var bin=atob(b64),len=bin.length,buf=new Uint8Array(len),i;
    for(i=0;i<len;i++)buf[i]=bin.charCodeAt(i);
    var sr=24000,ch=1,bits=16;
    var hdr=new ArrayBuffer(44+len),v=new DataView(hdr);

    v.setUint32(24,sr,true);v.setUint32(28,sr*ch*bits/8,true);
    v.setUint16(32,ch*bits/8,true);v.setUint16(34,bits,true);

    if(ttsState!=="device"){ttsState="device"}

  var ck=name+"|"+rate.toFixed(2)+"|"+text;
  function play(url){gStop();gAudio=new Audio(url);gAudio.play().catch(function(){speakDevice(text)})}

    if(ttsState!=="ok"){ttsState="ok";if(view==="practice")render()}
    play(url);

  });

    ],rule:"liminf",hint:"באינסוף משווים את דרגות המונה והמכנה, ורק אז מסתכלים על המקדמים."};
}

/* ---------- 2. נגזרות בסיסיות ---------- */
function genDeriv(L){
  var a,b,c,n,steps;
  if(L===1){
    a=rnz(-6,6);n=ri(2,6);b=rnz(-8,8);c=rnz(-9,9);
    var d1=a*n,d2=b;
    return {ask:"גזרו את הפונקציה",expr:"f(x) = "+num(a)+pw("x",n)+term(b,"x")+sgn(c),
      ans:W("f'(x) = "+num(d1)+pw("x",n-1)+sgn(b)),
      wrong:[
        W("f'(x) = "+num(d1)+pw("x",n)+sgn(b),"הורדתם את המעריך למקדם אבל לא הפחתתם אותו ב-1."),
        W("f'(x) = "+num(a)+pw("x",n-1)+sgn(b),"הפחתתם את המעריך אבל שכחתם להכפיל בו את המקדם."),
        W("f'(x) = "+num(d1)+pw("x",n-1)+sgn(b)+sgn(c),"האיבר החופשי לא נעלם. נגזרת של קבוע היא תמיד אפס.")
      ],
      steps:[
        S("כלל החזקה","(xⁿ)' = n·xⁿ⁻¹ — המעריך יורד ונעשה מקדם, והחזקה קטנה באחת.","(xⁿ)' = n·xⁿ⁻¹"),
        S("גוזרים איבר איבר","",num(a)+pw("x",n)+" → "+num(d1)+pw("x",n-1)),
        S("האיבר הלינארי והקבוע","נגזרת של "+num(b)+"x היא "+num(b)+", ונגזרת של קבוע היא אפס.",
          num(b)+"x → "+num(b)+"   ,   "+num(c)+" → 0"),
        S("מחברים","","f'(x) = "+num(d1)+pw("x",n-1)+sgn(b))
      ],rule:"dpow",hint:"כל איבר בנפרד: המעריך יורד למקדם והחזקה קטנה באחת. קבוע נעלם."};
  }
  if(L===2){
    a=rnz(-5,5);
    var kind=pick(["exp","ln","sqrt","inv"]);
    var f,df,why=[];
    if(kind==="exp"){f=num(a)+"e<sup>x</sup>";df=num(a)+"e<sup>x</sup>";
      why=[W("f'(x) = "+num(a)+"x·e<sup>x</sup>","גזרתם את e^x כאילו הוא חזקה של x. הנגזרת של eˣ היא eˣ עצמה."),
           W("f'(x) = e<sup>x</sup>","איבדתם את המקדם. מקדם קבוע נשאר בנגזרת."),
           W("f'(x) = "+num(a)+"e<sup>x−1</sup>","הורדתם את המעריך באחת. זה כלל החזקה, והוא לא חל על eˣ.")];}
    else if(kind==="ln"){f=num(a)+"ln x";df='<span class="frac"><span>'+num(a)+'</span><span>x</span></span>';
      why=[W("f'(x) = "+num(a)+"ln x","לא גזרתם בכלל."),
           W('f\'(x) = <span class="frac"><span>1</span><span>x</span></span>',"איבדתם את המקדם "+num(a)+"."),
           W("f'(x) = "+num(a)+"x","הפכתם את הכלל. הנגזרת של ln x היא 1 חלקי x.")];}
    else if(kind==="sqrt"){f=num(a)+"√x";df='<span class="frac"><span>'+num(a)+'</span><span>2√x</span></span>';
      why=[W("f'(x) = "+num(a)+"√x","לא גזרתם."),
           W('f\'(x) = <span class="frac"><span>1</span><span>2√x</span></span>',"איבדתם את המקדם."),
           W('f\'(x) = <span class="frac"><span>'+num(a)+'</span><span>√x</span></span>',"שכחתם את ה-2 במכנה. √x הוא x בחזקת חצי, והחצי יורד למקדם.")];}
    else{f='<span class="frac"><span>'+num(a)+'</span><span>x</span></span>';
      df='<span class="frac"><span>'+num(-a)+'</span><span>x<sup>2</sup></span></span>';
      why=[W('f\'(x) = <span class="frac"><span>'+num(a)+'</span><span>x<sup>2</sup></span></span>',"שכחתם את המינוס. הנגזרת של 1/x היא מינוס 1 חלקי x²."),
           W('f\'(x) = <span class="frac"><span>'+num(-a)+'</span><span>x</span></span>',"המכנה צריך להיות x בריבוע."),
           W("f'(x) = "+num(a)+"ln x","זה האינטגרל של "+num(a)+"/x, לא הנגזרת.")];}
    return {ask:"גזרו את הפונקציה",expr:"f(x) = "+f,ans:W("f'(x) = "+df),wrong:why,
      steps:[
        S("מזהים את הפונקציה הבסיסית","",kind==="exp"?"(eˣ)' = eˣ":kind==="ln"?"(ln x)' = 1/x":kind==="sqrt"?"(√x)' = 1 / (2√x)":"(1/x)' = −1/x²"),
        S("המקדם נשאר","מקדם קבוע פשוט מוכפל בנגזרת — הוא לא משתתף בגזירה.","(c·f)' = c·f'"),
        S("התשובה","","f'(x) = "+df)
      ],rule:"dbasic",hint:"קודם הנגזרת של הפונקציה הבסיסית, והמקדם פשוט נשאר מוכפל."};
  }
  a=rnz(-5,5);b=rnz(-5,5);
  var tk=pick(["sin","cos"]);
  var dtk=tk==="sin"?num(a)+"cos x":num(-a)+"sin x";
  return {ask:"גזרו את הפונקציה",expr:"f(x) = "+num(a)+tk+" x"+term(b,"x"),
    ans:W("f'(x) = "+dtk+sgn(b)),
    wrong:[
      W("f'(x) = "+(tk==="sin"?num(-a)+"cos x":num(a)+"sin x")+sgn(b),
        tk==="sin"?"הוספתם מינוס. המינוס מופיע בנגזרת של קוסינוס, לא של סינוס.":"שכחתם את המינוס. הנגזרת של cos היא מינוס sin."),
      W("f'(x) = "+num(a)+tk+" x"+sgn(b),"לא גזרתם את הפונקציה הטריגונומטרית."),
      W("f'(x) = "+dtk,"שכחתם לגזור את האיבר הלינארי. הנגזרת של "+num(b)+"x היא "+num(b)+".")
    ],
    steps:[
      S("נגזרות טריגונומטריות","(sin x)' = cos x, ו-(cos x)' = −sin x. המינוס נמצא רק אצל הקוסינוס.",
        "(sin x)' = cos x   ,   (cos x)' = −sin x"),
      S("גוזרים איבר איבר","",num(a)+tk+" x → "+dtk),
      S("האיבר הלינארי","",num(b)+"x → "+num(b)),
      S("מחברים","","f'(x) = "+dtk+sgn(b))
    ],rule:"dtrig",hint:"סינוס גוזר לקוסינוס, וקוסינוס גוזר למינוס סינוס."};
}

/* ---------- 3. כלל השרשרת ---------- */
function genChain(L){
  var a,b,n,steps;
  if(L===1){
    a=rnz(-5,5);b=rnz(-8,8);n=ri(2,6);
    return {ask:"גזרו את הפונקציה",expr:"f(x) = (" + coef(a,"x")+sgn(b)+")<sup>"+n+"</sup>",
      ans:W("f'(x) = "+num(n*a)+"("+coef(a,"x")+sgn(b)+")<sup>"+(n-1)+"</sup>"),
      wrong:[
        W("f'(x) = "+n+"("+coef(a,"x")+sgn(b)+")<sup>"+(n-1)+"</sup>",
          "שכחתם להכפיל בנגזרת הפנימית. הנגזרת של "+coef(a,"x")+sgn(b)+" היא "+num(a)+", וצריך להכפיל בה."),
        W("f'(x) = "+num(n*a)+"("+coef(a,"x")+sgn(b)+")<sup>"+n+"</sup>","לא הפחתתם את המעריך."),
        W("f'(x) = "+num(n*a)+pw("x",n-1),"גזרתם כאילו בפנים יש רק x. הביטוי הפנימי כולו נשאר בסוגריים.")
      ],
      steps:[
        S("מזהים חיצוני ופנימי","החיצונית היא ״משהו בחזקת "+n+"״, והפנימית היא "+coef(a,"x")+sgn(b)+".",
          "f = uⁿ  ,  u = "+coef(a,"x")+sgn(b)),
        S("כלל השרשרת","גוזרים את החיצונית ומשאירים את הפנימית כמו שהיא, ואז מכפילים בנגזרת הפנימית.",
          "f' = n·uⁿ⁻¹ · u'"),
        S("מציבים","","f' = "+n+"("+coef(a,"x")+sgn(b)+")<sup>"+(n-1)+"</sup> · "+num(a)),
        S("מסדרים","","f'(x) = "+num(n*a)+"("+coef(a,"x")+sgn(b)+")<sup>"+(n-1)+"</sup>")
      ],rule:"chain",hint:"אחרי שגוזרים את החיצונית — חייבים להכפיל בנגזרת של מה שבפנים."};
  }
  if(L===2){
    a=rnz(-5,5);b=rnz(-8,8);
    var k=pick(["exp","ln","sin"]);
    var inner=coef(a,"x")+sgn(b);
    var f,df,ws;
    if(k==="exp"){f="e<sup>"+inner+"</sup>";df=num(a)+"e<sup>"+inner+"</sup>";
      ws=[W("f'(x) = e<sup>"+inner+"</sup>","שכחתם את הנגזרת הפנימית. eᵘ גוזר ל-eᵘ·u′."),
          W("f'(x) = "+num(a)+"e<sup>"+coef(a,"x")+"</sup>","שיניתם את המעריך. הוא נשאר בדיוק כמו שהוא."),
          W("f'(x) = "+num(a)+"("+inner+")e<sup>"+inner+"</sup>","הכפלתם בביטוי הפנימי במקום בנגזרת שלו.")];}
    else if(k==="ln"){f="ln("+inner+")";df='<span class="frac"><span>'+num(a)+'</span><span>'+inner+'</span></span>';
      ws=[W('f\'(x) = <span class="frac"><span>1</span><span>'+inner+'</span></span>',"שכחתם את הנגזרת הפנימית במונה."),
          W('f\'(x) = <span class="frac"><span>'+num(a)+'</span><span>x</span></span>',"המכנה הוא כל הביטוי הפנימי, לא רק x."),
          W("f'(x) = "+num(a)+"ln("+inner+")","לא גזרתם את הלוגריתם.")];}
    else{f="sin("+inner+")";df=num(a)+"cos("+inner+")";
      ws=[W("f'(x) = cos("+inner+")","שכחתם להכפיל בנגזרת הפנימית."),
          W("f'(x) = "+num(-a)+"cos("+inner+")","הוספתם מינוס. המינוס שייך לנגזרת של קוסינוס."),
          W("f'(x) = "+num(a)+"cos x","הביטוי הפנימי נשאר בתוך הקוסינוס.")];}
    return {ask:"גזרו את הפונקציה",expr:"f(x) = "+f,ans:W("f'(x) = "+df),wrong:ws,
      steps:[
        S("מפרקים לשתי שכבות","הפנימית היא "+inner+", והנגזרת שלה היא "+num(a)+".","u = "+inner+"  ,  u' = "+num(a)),
        S("גוזרים את החיצונית","",k==="exp"?"(eᵘ)' = eᵘ·u'":k==="ln"?"(ln u)' = u'/u":"(sin u)' = cos u · u'"),
        S("מציבים","","f'(x) = "+df)
      ],rule:"chain",hint:"שתי שכבות: גוזרים את החיצונית על הפנימית כמו שהיא, ומכפילים בנגזרת הפנימית."};
  }
  a=rnz(2,6);b=rnz(-9,9);
  return {ask:"גזרו את הפונקציה",expr:"f(x) = √(" + num(a)+"x"+sgn(b)+")",
    ans:W('f\'(x) = <span class="frac"><span>'+num(a)+'</span><span>2√('+num(a)+'x'+sgn(b)+')</span></span>'),
    wrong:[
      W('f\'(x) = <span class="frac"><span>1</span><span>2√('+num(a)+'x'+sgn(b)+')</span></span>',"שכחתם את הנגזרת הפנימית "+num(a)+"."),
      W('f\'(x) = <span class="frac"><span>'+num(a)+'</span><span>√('+num(a)+'x'+sgn(b)+')</span></span>',"חסר ה-2 במכנה — שורש הוא חזקת חצי, והחצי נשאר."),
      W('f\'(x) = <span class="frac"><span>'+num(a)+'</span><span>2√x</span></span>',"הביטוי הפנימי נשאר שלם בתוך השורש.")
    ],
    steps:[
      S("כותבים את השורש כחזקה","√u הוא u בחזקת חצי, וכך רואים שזה בדיוק כלל השרשרת.","f = u^(1/2)  ,  u = "+num(a)+"x"+sgn(b)),
      S("גוזרים","","f' = ½·u^(−1/2) · u' = u' / (2√u)"),
      S("מציבים","","f'(x) = "+num(a)+" / (2√("+num(a)+"x"+sgn(b)+"))")
    ],rule:"chain",hint:"√u גוזר ל-u′ חלקי 2√u. הנגזרת הפנימית עולה למונה."};
}

/* ---------- 4. כלל המכפלה והמנה ---------- */
function genProdQuo(L){
  var a,b,n,steps;
  if(L===1){
    n=ri(2,4);a=rnz(-4,4);
    /* f = xⁿ · e^x  →  f' = xⁿ⁻¹·e^x·(n + x) */
    return {ask:"גזרו את הפונקציה",expr:"f(x) = "+pw("x",n)+"e<sup>x</sup>",
      ans:W("f'(x) = "+n+pw("x",n-1)+"e<sup>x</sup> + "+pw("x",n)+"e<sup>x</sup>"),
      wrong:[
        W("f'(x) = "+n+pw("x",n-1)+"e<sup>x</sup>",
          "גזרתם כל גורם בנפרד והכפלתם. נגזרת של מכפלה איננה מכפלת הנגזרות — צריך שני איברים."),
        W("f'(x) = "+pw("x",n)+"e<sup>x</sup>","גזרתם רק את הגורם השני."),
        W("f'(x) = "+n+pw("x",n-1)+"e<sup>x</sup> · "+pw("x",n)+"e<sup>x</sup>","הכפלתם את שני האיברים במקום לחבר אותם.")
      ],
      steps:[
        S("כלל המכפלה","(f·g)' = f'g + fg'. שני איברים, לא אחד — וזו הטעות הנפוצה ביותר כאן.","(f·g)' = f'g + fg'"),
        S("מזהים את שני הגורמים","","f = "+pw("x",n)+"  ,  g = eˣ"),
        S("גוזרים כל אחד","","f' = "+n+pw("x",n-1)+"  ,  g' = eˣ"),
        S("מציבים","","f'(x) = "+n+pw("x",n-1)+"e<sup>x</sup> + "+pw("x",n)+"e<sup>x</sup>")
      ],rule:"prod",hint:"נגזרת של מכפלה נותנת סכום של שני איברים."};
  }
  if(L===2){
    a=rnz(-6,6);b=rnz(-6,6);
    /* f = (ax+b)/x  →  f' = −b/x²   (כי ax/x = a קבוע) */
    while(b===0)b=rnz(-6,6);
    return {ask:"גזרו את הפונקציה",
      expr:'f(x) = <span class="frac"><span>'+coef(a,"x")+sgn(b)+'</span><span>x</span></span>',
      ans:W('f\'(x) = <span class="frac"><span>'+num(-b)+'</span><span>x<sup>2</sup></span></span>'),
      wrong:[
        W('f\'(x) = <span class="frac"><span>'+num(b)+'</span><span>x<sup>2</sup></span></span>',
          "טעות סימן. בכלל המנה המונה הוא f′g פחות fg′ — הסדר קובע את הסימן."),
        W('f\'(x) = <span class="frac"><span>'+num(a)+'</span><span>1</span></span>',
          "גזרתם מונה ומכנה בנפרד וחילקתם. נגזרת של מנה אינה מנת הנגזרות."),
        W('f\'(x) = <span class="frac"><span>'+num(-b)+'</span><span>x</span></span>',
          "שכחתם להעלות את המכנה בריבוע. בכלל המנה המכנה הוא g².")
      ],
      steps:[
        S("כלל המנה","(f/g)' = (f'g − fg') ÷ g². הסדר במונה קריטי, והמכנה עולה בריבוע.","(f/g)' = (f'g − fg') / g²"),
        S("מזהים","","f = "+coef(a,"x")+sgn(b)+"  ,  g = x"),
        S("גוזרים","","f' = "+num(a)+"  ,  g' = 1"),
        S("מציבים במונה","",num(a)+"·x − ("+coef(a,"x")+sgn(b)+")·1 = "+num(-b)),
        S("מחלקים ב-g²","",'f\'(x) = '+num(-b)+' / x²')
      ],rule:"quo",hint:"כלל המנה: f′g פחות fg′, והכול חלקי g בריבוע."};
  }
  a=rnz(2,5);b=rnz(-6,6);
  /* f = x·ln x + b  →  f' = ln x + 1 */
  return {ask:"גזרו את הפונקציה",expr:"f(x) = x·ln x"+sgn(b),
    ans:W("f'(x) = ln x + 1"),
    wrong:[
      W("f'(x) = ln x","גזרתם רק את הגורם השני. בכלל המכפלה יש שני איברים."),
      W('f\'(x) = <span class="frac"><span>1</span><span>x</span></span>',"הכפלתם את הנגזרות במקום להשתמש בכלל המכפלה."),
      W("f'(x) = ln x + 1"+sgn(b),"האיבר החופשי נעלם בגזירה.")
    ],
    steps:[
      S("כלל המכפלה","","(f·g)' = f'g + fg'"),
      S("מזהים וגוזרים","","f = x → f' = 1   ,   g = ln x → g' = 1/x"),
      S("מציבים","","1·ln x + x·(1/x)"),
      S("מפשטים","x כפול 1 חלקי x מצטמצם ל-1.","f'(x) = ln x + 1")
    ],rule:"prod",hint:"x·ln x הוא מכפלה. אחרי ההצבה, x חלקי x מצטמצם."};
}

/* ---------- 5. נקודות קיצון ---------- */
function genExtrema(L){
  var a,b,c,r1,r2,steps;
  if(L===1){
    a=rnz(-4,4);r1=rnz(-6,6);
    b=-2*a*r1;c=rnz(-9,9);
    return {ask:"מצאו את שיעור ה-x של נקודת הקיצון",expr:"f(x) = "+poly([a,b,c]),
      ans:W("x = "+num(r1)),
      wrong:[
        W("x = "+num(-r1),"טעות סימן בפתרון f′(x)=0."),
        W("x = "+num(c),"האיבר החופשי לא משפיע על מיקום הקיצון — הוא רק מזיז את הגרף מעלה ומטה."),
        W("x = "+num(b),"זה המקדם של x, לא הפתרון של המשוואה.")
      ],
      steps:[
        S("קיצון נמצא היכן שהנגזרת מתאפסת","זו ההגדרה: בנקודת קיצון המשיק אופקי, כלומר השיפוע אפס.","f'(x) = 0"),
        S("גוזרים","","f'(x) = "+num(2*a)+"x"+sgn(b)),
        S("משווים לאפס","",num(2*a)+"x"+sgn(b)+" = 0"),
        S("פותרים","","x = "+num(-b)+" ÷ "+pn(2*a)+" = "+num(r1))
      ],rule:"extr",hint:"גוזרים, משווים לאפס ופותרים. האיבר החופשי לא משתתף."};
  }
  if(L===2){
    r1=rnz(-5,5);r2=rnz(-5,5);
    while(r2===r1)r2=rnz(-5,5);
    var lo=Math.min(r1,r2),hi=Math.max(r1,r2);
    /* f' = 3(x−r1)(x−r2) = 3x² −3(r1+r2)x + 3r1r2 → f = x³ − 1.5(r1+r2)x² + 3r1r2 x */
    var B=-3*(r1+r2)/2, Cc=3*r1*r2;
    if(Math.round(B)!==B){r2=r1+2;lo=Math.min(r1,r2);hi=Math.max(r1,r2);B=-3*(r1+r2)/2;Cc=3*r1*r2}
    return {ask:"כמה נקודות קיצון יש לפונקציה, ומהם שיעורי ה-x שלהן?",
      expr:"f(x) = x<sup>3</sup>"+term(B,"x<sup>2</sup>")+term(Cc,"x"),
      ans:W("x = "+num(lo)+" , x = "+num(hi)),
      wrong:[
        W("x = "+num(-lo)+" , x = "+num(-hi),"טעות סימן בפתרון המשוואה הריבועית."),
        W("x = 0","הנחתם שהקיצון תמיד באפס. צריך לפתור את f′(x)=0."),
        W("x = "+num(lo),"מצאתם פתרון אחד. למשוואה ריבועית עם דיסקרימיננטה חיובית יש שניים.")
      ],
      steps:[
        S("גוזרים","נגזרת של פונקציה ממעלה שלישית היא ריבועית, ולכן ייתכנו שתי נקודות קיצון.",
          "f'(x) = 3x²"+term(2*B,"x")+sgn(Cc)),
        S("משווים לאפס ומחלקים ב-3","","x²"+term(2*B/3,"x")+sgn(Cc/3)+" = 0"),
        S("מפרקים לגורמים","","(x"+sgn(-lo)+")(x"+sgn(-hi)+") = 0"),
        S("שני הפתרונות","","x = "+num(lo)+"   ,   x = "+num(hi))
      ],rule:"extr",hint:"נגזרת של פונקציה ממעלה שלישית היא ריבועית — פותרים אותה ומקבלים עד שתי נקודות."};
  }
  a=pick([1,-1]);r1=rnz(-6,6);
  b=-2*a*r1;c=rnz(-9,9);
  var isMin=a>0;
  return {ask:"איזה סוג קיצון יש לפונקציה?",expr:"f(x) = "+poly([a,b,c]),
    ans:W(isMin?"מינימום":"מקסימום"),
    wrong:[
      W(isMin?"מקסימום":"מינימום","הסתכלו על סימן הנגזרת השנייה: f″ = "+num(2*a)+", והוא "+(isMin?"חיובי ולכן מינימום":"שלילי ולכן מקסימום")+"."),
      W("נקודת פיתול","נקודת פיתול היא מקום שבו הנגזרת השנייה מתאפסת. כאן היא קבועה ושונה מאפס."),
      W("אין קיצון","לפרבולה תמיד יש נקודת קיצון אחת.")
    ],
    steps:[
      S("גוזרים פעמיים","הנגזרת הראשונה מוצאת את המיקום, השנייה מספרת איזה סוג.",
        "f'(x) = "+num(2*a)+"x"+sgn(b)+"   ,   f''(x) = "+num(2*a)),
      S("קוראים את הסימן","f″ חיובי ← הפונקציה קמורה ← מינימום. f″ שלילי ← קעורה ← מקסימום.",
        "f'' = "+num(2*a)+" → "+(isMin?"מינימום":"מקסימום")),
      S("התשובה","",isMin?"מינימום":"מקסימום")
    ],rule:"extr2",hint:"הנגזרת השנייה קובעת את הסוג: חיובית מינימום, שלילית מקסימום."};
}

/* ---------- 6. אינטגרל לא מסוים ---------- */
function genIntegral(L){
  var a,n,b,steps;
  if(L===1){
    a=rnz(-6,6);n=ri(1,5);b=rnz(-8,8);
    var co=fr(a,n+1);
    return {ask:"חשבו את האינטגרל",expr:"∫ ("+num(a)+pw("x",n)+sgn(b)+") dx",
      ans:W(co.html()+pw("x",n+1)+term(b,"x")+" + C"),
      wrong:[
        W(co.html()+pw("x",n+1)+term(b,"x"),"שכחתם את קבוע האינטגרציה. באינטגרל לא מסוים חייבים +C."),
        W(num(a)+pw("x",n+1)+term(b,"x")+" + C","העליתם את החזקה אבל לא חילקתם בחזקה החדשה."),
        W(num(a*n)+pw("x",n-1)+sgn(b)+" + C","גזרתם במקום לאנטגרל. הפעולות הפוכות זו לזו.")
      ],
      steps:[
        S("כלל האינטגרל של חזקה","∫xⁿ dx = xⁿ⁺¹ ÷ (n+1) + C — החזקה עולה באחת ומחלקים בחזקה החדשה.",
          "∫xⁿ dx = xⁿ⁺¹/(n+1) + C"),
        S("מאנטגרלים איבר איבר","",num(a)+pw("x",n)+" → "+co.html()+pw("x",n+1)),
        S("האיבר הקבוע","",num(b)+" → "+num(b)+"x"),
        S("לא שוכחים את C","אינטגרל לא מסוים מייצג משפחה שלמה של פונקציות, ולכן תמיד מוסיפים קבוע.",
          co.html()+pw("x",n+1)+term(b,"x")+" + C")
      ],rule:"intpow",hint:"החזקה עולה באחת ומחלקים בה. ותמיד +C."};
  }
  if(L===2){
    a=rnz(-5,5);
    var k=pick(["exp","inv","sin","cos"]);
    var f,F,ws;
    if(k==="exp"){f=num(a)+"e<sup>x</sup>";F=num(a)+"e<sup>x</sup> + C";
      ws=[W(num(a)+"e<sup>x</sup>","חסר קבוע האינטגרציה."),
          W(fr(a,2).html()+"e<sup>2x</sup> + C","הוספתם חזקה שלא קיימת. eˣ הוא האינטגרל של עצמו."),
          W(num(a)+"x·e<sup>x</sup> + C","התייחסתם ל-eˣ כמו לחזקה של x.")];}
    else if(k==="inv"){f='<span class="frac"><span>'+num(a)+'</span><span>x</span></span>';F=num(a)+"ln|x| + C";
      ws=[W(num(a)+"ln x + C","הערך המוחלט חשוב: ln מוגדר רק לחיוביים, והאינטגרל תקף גם לשליליים."),
          W(fr(a,2).html()+"x<sup>−2</sup> + C","הפעלתם את כלל החזקה. הוא לא תקף כאשר החזקה היא מינוס אחת."),
          W('<span class="frac"><span>'+num(-a)+'</span><span>x<sup>2</sup></span></span> + C',"גזרתם במקום לאנטגרל.")];}
    else if(k==="sin"){f=num(a)+"sin x";F=num(-a)+"cos x + C";
      ws=[W(num(a)+"cos x + C","חסר המינוס. האינטגרל של סינוס הוא מינוס קוסינוס."),
          W(num(a)+"sin x + C","לא ביצעתם אינטגרציה."),
          W(num(a)+"cos x","גם המינוס וגם ה-C חסרים.")];}
    else{f=num(a)+"cos x";F=num(a)+"sin x + C";
      ws=[W(num(-a)+"sin x + C","הוספתם מינוס. המינוס שייך לאינטגרל של סינוס, לא של קוסינוס."),
          W(num(-a)+"cos x + C","זו הנגזרת, לא האינטגרל."),
          W(num(a)+"sin x","חסר קבוע האינטגרציה.")];}
    return {ask:"חשבו את האינטגרל",expr:"∫ "+f+" dx",ans:W(F),wrong:ws,
      steps:[
        S("אינטגרל הוא הפעולה ההפוכה לגזירה","שואלים: איזו פונקציה גוזרת למה שכתוב כאן?",
          k==="exp"?"(eˣ)' = eˣ":k==="inv"?"(ln|x|)' = 1/x":k==="sin"?"(−cos x)' = sin x":"(sin x)' = cos x"),
        S("המקדם נשאר","","∫c·f = c·∫f"),
        S("ומוסיפים C","",F)
      ],rule:"intbasic",hint:"שואלים איזו פונקציה גוזרת לזה, ולא שוכחים את הקבוע."};
  }
  a=rnz(2,5);b=rnz(-8,8);n=ri(2,4);
  return {ask:"חשבו את האינטגרל",expr:"∫ ("+num(a)+"x"+sgn(b)+")<sup>"+n+"</sup> dx",
    ans:W('<span class="frac"><span>('+num(a)+'x'+sgn(b)+')<sup>'+(n+1)+'</sup></span><span>'+(a*(n+1))+'</span></span> + C'),
    wrong:[
      W('<span class="frac"><span>('+num(a)+'x'+sgn(b)+')<sup>'+(n+1)+'</sup></span><span>'+(n+1)+'</span></span> + C',
        "חילקתם רק בחזקה החדשה ושכחתם לחלק גם בנגזרת הפנימית "+num(a)+"."),
      W("("+num(a)+"x"+sgn(b)+")<sup>"+(n+1)+"</sup> + C","לא חילקתם בכלל."),
      W(num(a*n)+"("+num(a)+"x"+sgn(b)+")<sup>"+(n-1)+"</sup> + C","גזרתם במקום לאנטגרל.")
    ],
    steps:[
      S("הצבה","מסמנים u = "+num(a)+"x"+sgn(b)+", ואז du = "+num(a)+"dx, כלומר dx = du/"+num(a)+".",
        "u = "+num(a)+"x"+sgn(b)),
      S("מחליפים משתנה","","∫ uⁿ du / "+num(a)),
      S("מאנטגרלים","","u<sup>"+(n+1)+"</sup> / ("+num(a)+"·"+(n+1)+")"),
      S("חוזרים ל-x","","("+num(a)+"x"+sgn(b)+")<sup>"+(n+1)+"</sup> / "+(a*(n+1))+" + C")
    ],rule:"intsub",hint:"מחלקים גם בחזקה החדשה וגם בנגזרת הפנימית."};
}

/* ---------- 7. אינטגרל מסוים ושטח ---------- */
function genDefInt(L){
  var a,b,n,lo,hi,steps;
  if(L===1){
    n=ri(1,3);a=rnz(1,4);lo=ri(0,2);hi=lo+ri(1,3);
    var F=function(x){return a*Math.pow(x,n+1)/(n+1)};
    var val=F(hi)-F(lo);
    if(Math.round(val*6)!==val*6){a=n+1;val=F(hi)-F(lo)}
    val=a*(Math.pow(hi,n+1)-Math.pow(lo,n+1))/(n+1);
    return {ask:"חשבו את האינטגרל המסוים",
      expr:"∫<sub>"+lo+"</sub><sup>"+hi+"</sup> "+(a===1?"":num(a))+pw("x",n)+" dx",
      ans:W(num(Math.round(val*1000)/1000)),
      wrong:[
        W(num(Math.round((F(lo)-F(hi))*1000)/1000),"הפכתם את סדר הגבולות. מציבים את הגבול העליון פחות התחתון."),
        W(num(Math.round(F(hi)*1000)/1000),"הצבתם רק את הגבול העליון ושכחתם לחסר את התחתון."),
        W(num(a*(Math.pow(hi,n)-Math.pow(lo,n))),"הצבתם בפונקציה המקורית במקום בפונקציה הקדומה.")
      ],
      steps:[
        S("מוצאים פונקציה קדומה","באינטגרל מסוים אין צורך ב-C — הוא מתבטל בחיסור.",
          "F(x) = "+fr(a,n+1).html()+pw("x",n+1)),
        S("משפט ניוטון־לייבניץ","מציבים את הגבול העליון ומחסרים את התחתון.","F("+hi+") − F("+lo+")"),
        S("מציבים","",num(Math.round(F(hi)*1000)/1000)+" − "+pn(Math.round(F(lo)*1000)/1000)),
        S("מחשבים","",num(Math.round(val*1000)/1000))
      ],rule:"defint",hint:"פונקציה קדומה, ואז עליון פחות תחתון."};
  }
  if(L===2){
    a=ri(1,4);hi=ri(2,5);
    /* שטח מתחת ל-y = a·x בין 0 ל-hi — משולש, כדי שאפשר לבדוק גיאומטרית */
    var area=a*hi*hi/2;
    return {ask:"חשבו את השטח הכלוא בין הפונקציה, ציר ה-x והישרים x=0 ו-x="+hi,
      expr:"y = "+coef(a,"x"),
      ans:W(num(area)),
      wrong:[
        W(num(a*hi),"זה ערך הפונקציה בנקודה, לא השטח."),
        W(num(a*hi*hi),"שכחתם לחלק ב-2 — האינטגרל של ax הוא ax²/2."),
        W(num(hi*hi/2),"איבדתם את המקדם "+a+".")
      ],
      steps:[
        S("שטח הוא אינטגרל מסוים","כשהפונקציה חיובית בקטע, השטח שווה בדיוק לאינטגרל.",
          "S = ∫<sub>0</sub><sup>"+hi+"</sup> "+coef(a,"x")+" dx"),
        S("פונקציה קדומה","","F(x) = "+fr(a,2).html()+"x²"),
        S("מציבים גבולות","","F("+hi+") − F(0) = "+num(area)+" − 0"),
        S("בדיקה גיאומטרית","הצורה כאן היא משולש עם בסיס "+hi+" וגובה "+num(a*hi)+", ושטחו "+num(area)+" — מתאים.",
          "S = "+num(area))
      ],rule:"area",hint:"שטח מתחת לגרף הוא האינטגרל המסוים בין הגבולות."};
  }
  a=ri(1,3);lo=-ri(1,3);hi=ri(1,3);
  /* אינטגרל של פונקציה אי־זוגית בקטע סימטרי מתאפס */
  return {ask:"חשבו את האינטגרל המסוים",
    expr:"∫<sub>"+num(-hi)+"</sub><sup>"+hi+"</sup> "+(a===1?"":num(a))+"x<sup>3</sup> dx",
    ans:W("0"),
    wrong:[
      W(num(a*Math.pow(hi,4)/2),"חישבתם רק את החלק החיובי. בקטע סימטרי החלק השלילי מבטל אותו."),
      W(num(a*Math.pow(hi,4)/4),"זה הערך של הפונקציה הקדומה בגבול העליון, לא ההפרש."),
      W(num(2*a*Math.pow(hi,4)/4),"חיברתם את שני החלקים במקום לחסר.")
    ],
    steps:[
      S("שמים לב לסימטריה","x³ היא פונקציה אי־זוגית: f(−x) = −f(x). הקטע סימטרי סביב אפס.",
        "f(−x) = −f(x)"),
      S("מה זה אומר","כל תרומה מצד ימין מתקזזת בדיוק מול צד שמאל.","∫ מקטע סימטרי = 0"),
      S("בדיקה בחישוב","","F(x) = "+fr(a,4).html()+"x⁴  →  F("+hi+") − F("+num(-hi)+") = 0")
    ],rule:"defint",hint:"פונקציה אי־זוגית בקטע סימטרי סביב אפס — האינטגרל מתאפס."};
}

/* ---------- 8. פעולות במטריצות ---------- */
function genMatOps(L){
  var A,B,i,j,steps;
  function m2(){return [[rnz(-6,6),rnz(-6,6)],[rnz(-6,6),rnz(-6,6)]]}
  if(L===1){
    A=m2();B=m2();
    var S1=[[A[0][0]+B[0][0],A[0][1]+B[0][1]],[A[1][0]+B[1][0],A[1][1]+B[1][1]]];
    return {ask:"חשבו את סכום המטריצות",expr:mat(A)+" + "+mat(B),ans:W(mat(S1)),
      wrong:[
        W(mat([[A[0][0]-B[0][0],A[0][1]-B[0][1]],[A[1][0]-B[1][0],A[1][1]-B[1][1]]]),"חיסרתם במקום לחבר."),
        W(mat([[A[0][0]+B[0][0],A[0][1]+B[1][0]],[A[1][0]+B[0][1],A[1][1]+B[1][1]]]),"החלפתם אינדקסים באלכסון. בחיבור כל איבר מתחבר עם האיבר שבאותו מקום בדיוק."),
        W(mat([[A[0][0]*B[0][0],A[0][1]*B[0][1]],[A[1][0]*B[1][0],A[1][1]*B[1][1]]]),"הכפלתם איבר באיבר. זו לא הפעולה שנדרשה, וגם לא כפל מטריצות.")
      ],
      steps:[
        S("חיבור מטריצות הוא איבר־איבר","זו הפעולה הפשוטה מבין השתיים: כל איבר מתחבר עם זה שבאותו מקום.",
          "(A+B)ᵢⱼ = Aᵢⱼ + Bᵢⱼ"),
        S("שורה ראשונה","",num(A[0][0])+" + "+pn(B[0][0])+" = "+num(A[0][0]+B[0][0])+"   ,   "+num(A[0][1])+" + "+pn(B[0][1])+" = "+num(A[0][1]+B[0][1])),
        S("שורה שנייה","",num(A[1][0])+" + "+pn(B[1][0])+" = "+num(A[1][0]+B[1][0])+"   ,   "+num(A[1][1])+" + "+pn(B[1][1])+" = "+num(A[1][1]+B[1][1])),
        S("התוצאה","",mat(S1))
      ],rule:"matadd",hint:"בחיבור מטריצות כל איבר מתחבר עם האיבר שבאותו מקום."};
  }
  if(L===2){
    A=m2();var k=rnz(-5,5);
    var K=[[A[0][0]*k,A[0][1]*k],[A[1][0]*k,A[1][1]*k]];
    return {ask:"חשבו",expr:num(k)+" · "+mat(A),ans:W(mat(K)),
      wrong:[
        W(mat([[A[0][0]*k,A[0][1]],[A[1][0],A[1][1]]]),"הכפלתם רק את האיבר הראשון. בכפל בסקלר כל איבר מוכפל."),
        W(mat([[A[0][0]+k,A[0][1]+k],[A[1][0]+k,A[1][1]+k]]),"חיברתם את הסקלר לכל איבר במקום להכפיל בו."),
        W(mat([[A[0][0]*k,A[0][1]*k],[A[1][0],A[1][1]]]),"הכפלתם רק את השורה הראשונה.")
      ],
      steps:[
        S("כפל בסקלר","כל איבר במטריצה מוכפל במספר — בלי יוצאים מן הכלל.","(cA)ᵢⱼ = c·Aᵢⱼ"),
        S("מכפילים","",num(k)+"·"+pn(A[0][0])+" = "+num(A[0][0]*k)+"   ,   "+num(k)+"·"+pn(A[0][1])+" = "+num(A[0][1]*k)),
        S("וכך בשורה השנייה","",num(k)+"·"+pn(A[1][0])+" = "+num(A[1][0]*k)+"   ,   "+num(k)+"·"+pn(A[1][1])+" = "+num(A[1][1]*k)),
        S("התוצאה","",mat(K))
      ],rule:"matadd",hint:"סקלר מוכפל בכל אחד מאיברי המטריצה."};
  }
  A=[[rnz(-4,4),rnz(-4,4)],[rnz(-4,4),rnz(-4,4)]];
  B=[[rnz(-4,4),rnz(-4,4)],[rnz(-4,4),rnz(-4,4)]];
  var P=[[A[0][0]*B[0][0]+A[0][1]*B[1][0], A[0][0]*B[0][1]+A[0][1]*B[1][1]],
         [A[1][0]*B[0][0]+A[1][1]*B[1][0], A[1][0]*B[0][1]+A[1][1]*B[1][1]]];
  var elem=[[A[0][0]*B[0][0],A[0][1]*B[0][1]],[A[1][0]*B[1][0],A[1][1]*B[1][1]]];
  var BA=[[B[0][0]*A[0][0]+B[0][1]*A[1][0], B[0][0]*A[0][1]+B[0][1]*A[1][1]],
          [B[1][0]*A[0][0]+B[1][1]*A[1][0], B[1][0]*A[0][1]+B[1][1]*A[1][1]]];
  return {ask:"חשבו את מכפלת המטריצות",expr:mat(A)+" · "+mat(B),ans:W(mat(P)),
    wrong:[
      W(mat(elem),"הכפלתם איבר באיבר. בכפל מטריצות כל איבר בתוצאה הוא מכפלה סקלרית של שורה בעמודה."),
      W(mat(BA),"הכפלתם בסדר ההפוך. כפל מטריצות אינו חילופי — A·B ו-B·A בדרך כלל שונים."),
      W(mat([[P[0][0],P[1][0]],[P[0][1],P[1][1]]]),"שחלפתם את התוצאה — החלפתם בין שורות לעמודות.")
    ],
    steps:[
      S("כל איבר הוא שורה כפול עמודה","האיבר במקום (i,j) נבנה משורה i של A ומעמודה j של B — לא מהאיברים שבאותו מקום.",
        "Cᵢⱼ = Σ Aᵢₖ·Bₖⱼ"),
      S("האיבר בפינה השמאלית העליונה","",num(A[0][0])+"·"+pn(B[0][0])+" + "+num(A[0][1])+"·"+pn(B[1][0])+" = "+num(P[0][0])),
      S("וכך שאר האיברים","",num(P[0][1])+"  ,  "+num(P[1][0])+"  ,  "+num(P[1][1])),
      S("התוצאה","",mat(P))
    ],rule:"matmul",hint:"שורה של הראשונה כפול עמודה של השנייה, איבר איבר ומחברים."};
}

/* ---------- 9. דטרמיננטה ---------- */
function genDet(L){
  var a,b,c,d,steps;
  if(L===1){
    a=rnz(-8,8);b=rnz(-8,8);c=rnz(-8,8);d=rnz(-8,8);
    var det=a*d-b*c;
    return {ask:"חשבו את הדטרמיננטה",expr:"det "+mat([[a,b],[c,d]]),ans:W(num(det)),
      wrong:[
        W(num(a*d+b*c),"חיברתם את שתי המכפלות. באלכסון המשני יש מינוס."),
        W(num(b*c-a*d),"הפכתם את הסדר. מתחילים מהאלכסון הראשי ומחסרים ממנו את המשני."),
        W(num(a*b-c*d),"הכפלתם שורות במקום אלכסונים.")
      ],
      steps:[
        S("נוסחת הדטרמיננטה למטריצה 2×2","מכפלת האלכסון הראשי פחות מכפלת האלכסון המשני.","det = ad − bc"),
        S("האלכסון הראשי","",num(a)+"·"+pn(d)+" = "+num(a*d)),
        S("האלכסון המשני","",num(b)+"·"+pn(c)+" = "+num(b*c)),
        S("מחסרים","",num(a*d)+" − "+pn(b*c)+" = "+num(det))
      ],rule:"det2",hint:"אלכסון ראשי פחות אלכסון משני."};
  }
  if(L===2){
    var M=[[rnz(-4,4),rnz(-4,4),rnz(-4,4)],[rnz(-4,4),rnz(-4,4),rnz(-4,4)],[rnz(-4,4),rnz(-4,4),rnz(-4,4)]];
    var p1=M[0][0]*(M[1][1]*M[2][2]-M[1][2]*M[2][1]);
    var p2=M[0][1]*(M[1][0]*M[2][2]-M[1][2]*M[2][0]);
    var p3=M[0][2]*(M[1][0]*M[2][1]-M[1][1]*M[2][0]);
    var det3=p1-p2+p3;
    return {ask:"חשבו את הדטרמיננטה",expr:"det "+mat(M),ans:W(num(det3)),
      wrong:[
        W(num(p1+p2+p3),"חיברתם את שלושת האיברים. בפיתוח לפי שורה הסימנים מתחלפים: פלוס, מינוס, פלוס."),
        W(num(p1-p2-p3),"הסימן של האיבר השלישי צריך להיות פלוס."),
        W(num(M[0][0]*M[1][1]*M[2][2]),"הכפלתם רק את האלכסון הראשי. זה נכון רק במטריצה משולשת.")
      ],
      steps:[
        S("מפתחים לפי השורה הראשונה","כל איבר מוכפל בדטרמיננטה של המטריצה שנשארת כשמוחקים את שורתו ועמודתו.",
          "det = a₁₁·M₁₁ − a₁₂·M₁₂ + a₁₃·M₁₃"),
        S("שימו לב לסימנים","הם מתחלפים: פלוס, מינוס, פלוס. זה מקור טעות נפוץ מאוד.","+ , − , +"),
        S("שלושת האיברים","",num(p1)+"  ,  "+num(p2)+"  ,  "+num(p3)),
        S("מחברים לפי הסימנים","",num(p1)+" − "+pn(p2)+" + "+pn(p3)+" = "+num(det3))
      ],rule:"det3",hint:"פיתוח לפי שורה, וסימנים מתחלפים פלוס מינוס פלוס."};
  }
  a=rnz(-6,6);b=rnz(-6,6);c=rnz(-6,6);d=rnz(-6,6);
  var D=a*d-b*c,k=rnz(2,4);
  return {ask:"נתון שהדטרמיננטה של מטריצה A בגודל 2×2 היא "+num(D)+". מהי הדטרמיננטה של "+k+"A?",
    expr:"det("+k+"A) = ?",ans:W(num(k*k*D)),
    wrong:[
      W(num(k*D),"הכפלתם ב-k פעם אחת. כפל בסקלר מכפיל כל שורה, ובמטריצה n×n יש n שורות — לכן k בחזקת n."),
      W(num(D),"כפל בסקלר כן משנה את הדטרמיננטה."),
      W(num(k*k*k*D),"החזקה היא לפי סדר המטריצה. כאן 2×2, ולכן k בריבוע.")
    ],
    steps:[
      S("מה קורה כשמכפילים מטריצה בסקלר","כל אחת מהשורות מוכפלת ב-k, וכל שורה כזאת מוציאה k מחוץ לדטרמיננטה.",
        "det(kA) = kⁿ · det(A)"),
      S("כאן n שווה 2","",	"det("+k+"A) = "+k+"² · "+num(D)),
      S("מחשבים","",num(k*k)+" · "+num(D)+" = "+num(k*k*D))
    ],rule:"detprop",hint:"det(kA) = k בחזקת סדר המטריצה, כפול det(A)."};
}

/* ---------- 10. מטריצה הופכית ---------- */
function genInverse(L){
  var a,b,c,d,steps;
  if(L===1){
    /* det = 1 כדי שההופכית תצא שלמה */
    a=rnz(-4,4);b=rnz(-4,4);
    var tries=0;c=rnz(-4,4);d=0;
    while(tries<200){c=rnz(-4,4);if(a!==0&&(1+b*c)%a===0){d=(1+b*c)/a;if(Math.abs(d)<=9)break}tries++}
    if(tries>=200){a=1;b=2;c=1;d=3}
    var det=a*d-b*c;
    var inv=[[d/det,-b/det],[-c/det,a/det]];
    return {ask:"מצאו את המטריצה ההופכית",expr:"A = "+mat([[a,b],[c,d]]),ans:W(mat(inv)),
      wrong:[
        W(mat([[a,-b],[-c,d]]),"החלפתם סימנים אבל לא החלפתם בין האיברים שעל האלכסון הראשי."),
        W(mat([[d,b],[c,a]]),"החלפתם בין a ל-d אבל שכחתם את המינוסים על האלכסון המשני."),
        W(mat([[1/a,1/b],[1/c,1/d]].map(function(r){return r.map(function(v){return Math.round(v*100)/100})})),
          "הפכתם כל איבר בנפרד. הופכית של מטריצה איננה מטריצת ההופכיים.")
      ],
      steps:[
        S("בודקים שהמטריצה הפיכה","מטריצה הפיכה אם ורק אם הדטרמיננטה שלה שונה מאפס.","det = "+num(a)+"·"+pn(d)+" − "+pn(b)+"·"+pn(c)+" = "+num(det)),
        S("נוסחת ההופכית ל-2×2","מחליפים בין a ל-d, הופכים סימן ל-b ול-c, ומחלקים בדטרמיננטה.",
          "A⁻¹ = (1/det)·[[d, −b], [−c, a]]"),
        S("מציבים","",mat([[d,-b],[-c,a]])),
        S("הדטרמיננטה כאן היא "+num(det),"","A⁻¹ = "+mat(inv))
      ],rule:"inv2",hint:"מחליפים a ו-d, הופכים סימן ל-b ול-c, ומחלקים בדטרמיננטה."};
  }
  if(L===2){
    a=rnz(-5,5);b=rnz(-5,5);c=rnz(-5,5);d=rnz(-5,5);
    var D2=a*d-b*c;
    while(D2===0){d=rnz(-5,5);D2=a*d-b*c}
    return {ask:"מהי הדטרמיננטה שבמכנה של המטריצה ההופכית?",expr:"A = "+mat([[a,b],[c,d]]),
      ans:W(num(D2)),
      wrong:[
        W(num(a*d+b*c),"סימן שגוי — האלכסון המשני מחוסר."),
        W(num(a+d),"זה העקבה, סכום האלכסון הראשי, ולא הדטרמיננטה."),
        W(num(1/D2===Math.round(1/D2)?1/D2:Math.round(100/D2)/100),"זה כבר ההופכי של הדטרמיננטה. השאלה מבקשת אותה עצמה.")
      ],
      steps:[
        S("ההופכית מוגדרת רק כשהדטרמיננטה שונה מאפס","היא מופיעה במכנה, ולכן אפס היה הופך את הביטוי לחסר משמעות.",
          "A⁻¹ = (1/det)·adj(A)"),
        S("מחשבים","",	"det = "+num(a)+"·"+pn(d)+" − "+pn(b)+"·"+pn(c)),
        S("התוצאה","",num(D2))
      ],rule:"inv2",hint:"הדטרמיננטה היא ad פחות bc, והיא זו שיושבת במכנה."};
  }
  a=rnz(-5,5);b=rnz(-5,5);
  var k2=rnz(2,4);c=a*k2;d=b*k2;    /* שורות תלויות → det = 0 */
  return {ask:"האם המטריצה הפיכה?",expr:"A = "+mat([[a,b],[c,d]]),
    ans:W("לא הפיכה"),
    wrong:[
      W("הפיכה","הדטרמיננטה כאן היא אפס: השורה השנייה היא בדיוק פי "+k2+" מהראשונה, ולכן השורות תלויות לינארית."),
      W("הפיכה רק אם a שונה מאפס","התנאי היחיד הוא שהדטרמיננטה תהיה שונה מאפס, ולא תנאי על איבר בודד."),
      W("אי אפשר לדעת","אפשר בהחלט — מחשבים דטרמיננטה ובודקים אם היא אפס.")
    ],
    steps:[
      S("התנאי להפיכות","מטריצה הפיכה אם ורק אם הדטרמיננטה שלה שונה מאפס.","A הפיכה ⇔ det(A) ≠ 0"),
      S("מחשבים","",	"det = "+num(a)+"·"+pn(d)+" − "+pn(b)+"·"+pn(c)+" = "+num(a*d-b*c)),
      S("מה זה אומר","השורה השנייה היא פי "+k2+" מהראשונה — השורות תלויות, ולכן הדטרמיננטה מתאפסת.",
        "det = 0 → לא הפיכה")
    ],rule:"inv2",hint:"בודקים דטרמיננטה. אפס פירושו שהשורות תלויות ואין הופכית."};
}

/* ---------- 11. מערכת משוואות ודירוג ---------- */
function genLinEq(L){
  var x,y,a1,b1,c1,a2,b2,c2,steps;
  if(L===1){
    x=rnz(-7,7);y=rnz(-7,7);
    a1=rnz(-4,4);b1=rnz(-4,4);a2=rnz(-4,4);b2=rnz(-4,4);
    var t=0;
    while(a1*b2-a2*b1===0&&t<60){a2=rnz(-4,4);b2=rnz(-4,4);t++}
    if(a1*b2-a2*b1===0){a1=1;b1=1;a2=1;b2=-1}
    c1=a1*x+b1*y;c2=a2*x+b2*y;
    return {ask:"פתרו את המערכת",
      expr:coef(a1,"x")+term(b1,"y")+" = "+num(c1)+"<br>"+coef(a2,"x")+term(b2,"y")+" = "+num(c2),
      ans:W("x = "+num(x)+" , y = "+num(y)),
      wrong:[
        W("x = "+num(y)+" , y = "+num(x),"החלפתם בין הנעלמים בסוף."),
        W("x = "+num(-x)+" , y = "+num(y),"טעות סימן בשלב הסילוק."),
        W("אין פתרון","הדטרמיננטה של מטריצת המקדמים היא "+num(a1*b2-a2*b1)+", שונה מאפס, ולכן יש פתרון יחיד.")
      ],
      steps:[
        S("כותבים כמטריצה מורחבת","זו בדיוק אותה מערכת, רק בלי לכתוב שוב ושוב x ו-y.",
          mat([[a1,b1,c1],[a2,b2,c2]])),
        S("מסלקים נעלם","מכפילים שורות כך שמקדמי y יתבטלו בחיבור.",
          num(a1*b2-a2*b1)+"x = "+num(c1*b2-c2*b1)),
        S("מוצאים x","","x = "+num(x)),
        S("מציבים חזרה ומוצאים y","","y = "+num(y))
      ],rule:"gauss",hint:"מסלקים נעלם אחד, פותרים לשני, ומציבים חזרה."};
  }
  if(L===2){
    a1=rnz(-4,4);b1=rnz(-4,4);
    var k=rnz(2,3);
    var kind=pick(["one","none","inf"]);
    a2=a1*k;b2=b1*k;c1=rnz(-9,9);
    if(kind==="one"){a2=b1;b2=-a1;c2=rnz(-9,9)}     /* דטרמיננטה שונה מאפס */
    else if(kind==="inf"){c2=c1*k}
    else{c2=c1*k+rnz(1,4)}
    var ansTxt=kind==="one"?"פתרון יחיד":kind==="inf"?"אינסוף פתרונות":"אין פתרון";
    var det=a1*b2-a2*b1;
    return {ask:"כמה פתרונות יש למערכת?",
      expr:coef(a1,"x")+term(b1,"y")+" = "+num(c1)+"<br>"+coef(a2,"x")+term(b2,"y")+" = "+num(c2),
      ans:W(ansTxt),
      wrong:["פתרון יחיד","אינסוף פתרונות","אין פתרון"].filter(function(v){return v!==ansTxt})
        .map(function(v){return W(v,
          kind==="one"?"הדטרמיננטה היא "+num(det)+", שונה מאפס, ולכן הפתרון יחיד."
          :kind==="inf"?"המשוואה השנייה היא בדיוק המשוואה הראשונה כפול "+k+" — אותה משוואה פעמיים, ולכן אינסוף פתרונות."
          :"המקדמים פרופורציוניים אבל האגפים הימניים לא — שתי משוואות סותרות, ולכן אין פתרון.")}),
      steps:[
        S("בודקים את הדטרמיננטה","det שונה מאפס פירושו פתרון יחיד. det אפס דורש בדיקה נוספת.",
          "det = "+num(a1)+"·"+pn(b2)+" − "+pn(a2)+"·"+pn(b1)+" = "+num(det)),
        S(det!==0?"דטרמיננטה שונה מאפס":"דטרמיננטה מתאפסת",
          det!==0?"השורות בלתי תלויות, והמערכת נחתכת בנקודה אחת בדיוק."
                 :"השורות פרופורציוניות. עכשיו בודקים אם גם האגפים הימניים באותו יחס.",
          det!==0?"פתרון יחיד":(kind==="inf"?"גם האגפים ביחס "+k+" → אותה משוואה":"האגפים לא ביחס → סתירה")),
        S("התשובה","",ansTxt)
      ],rule:"gauss",hint:"דטרמיננטה שונה מאפס — פתרון יחיד. אפס — בודקים אם המשוואות זהות או סותרות."};
  }
  a1=rnz(-4,4);b1=rnz(-4,4);
  var k3=rnz(2,4);a2=a1*k3;b2=b1*k3;
  return {ask:"למערכת ההומוגנית הבאה יש פתרון לא טריוויאלי. מדוע?",
    expr:coef(a1,"x")+term(b1,"y")+" = 0<br>"+coef(a2,"x")+term(b2,"y")+" = 0",
    ans:W("כי הדטרמיננטה מתאפסת"),
    wrong:[
      W("כי האגפים הימניים אפס","לכל מערכת הומוגנית יש אגף ימני אפס, וברוב המקרים הפתרון היחיד הוא הטריוויאלי."),
      W("כי יש שתי משוואות ושני נעלמים","מספר שווה של משוואות ונעלמים דווקא מרמז על פתרון יחיד."),
      W("כי המקדמים שליליים","סימן המקדמים לא קובע דבר בעניין הזה.")
    ],
    steps:[
      S("מערכת הומוגנית תמיד פתירה","הפתרון x=0, y=0 תמיד מקיים אותה. השאלה היא אם יש גם פתרון אחר.",
        "x = 0 , y = 0 תמיד פתרון"),
      S("מתי יש פתרון נוסף","בדיוק כאשר הדטרמיננטה מתאפסת, כלומר כשהשורות תלויות לינארית.",
        "det = "+num(a1*b2-a2*b1)),
      S("כאן","השורה השנייה היא פי "+k3+" מהראשונה, ולכן יש למעשה משוואה אחת ואינסוף פתרונות.",
        "פתרון לא טריוויאלי קיים")
    ],rule:"gauss",hint:"למערכת הומוגנית יש פתרון לא טריוויאלי בדיוק כשהדטרמיננטה אפס."};
}

/* ---------- 12. וקטורים ---------- */
function genVectors(L){
  var u,v,steps;
  var TRIP=[[3,4,5],[6,8,10],[5,12,13],[8,15,17],[9,12,15],[7,24,25]];
  if(L===1){
    var t=pick(TRIP);
    u=[t[0]*pick([1,-1]),t[1]*pick([1,-1])];
    return {ask:"חשבו את אורך הווקטור",expr:"u = "+vecH(u),ans:W(String(t[2])),
      wrong:[
        W(num(Math.abs(u[0])+Math.abs(u[1])),"חיברתם את הרכיבים. האורך מחושב לפי פיתגורס, על הריבועים."),
        W(num(t[2]*t[2]),"עצרתם לפני הוצאת השורש."),
        W(num(Math.abs(u[0]*u[1])),"הכפלתם את הרכיבים.")
      ],
      steps:[
        S("נורמה היא פיתגורס","האורך הוא שורש סכום ריבועי הרכיבים. הסימנים נעלמים בהעלאה בריבוע.",
          "|u| = √(u₁² + u₂²)"),
        S("מציבים","","√("+pn(u[0])+"² + "+pn(u[1])+"²) = √("+(u[0]*u[0])+" + "+(u[1]*u[1])+")"),
        S("מחשבים","","√"+(t[2]*t[2])+" = "+t[2])
      ],rule:"norm",hint:"אורך וקטור = שורש של סכום ריבועי הרכיבים."};
  }
  if(L===2){
    u=[rnz(-6,6),rnz(-6,6)];v=[rnz(-6,6),rnz(-6,6)];
    var dot=u[0]*v[0]+u[1]*v[1];
    return {ask:"חשבו את המכפלה הסקלרית",expr:"u = "+vecH(u)+" ,  v = "+vecH(v),
      ans:W(num(dot)),
      wrong:[
        W(vecH([u[0]*v[0],u[1]*v[1]]),"התוצאה של מכפלה סקלרית היא מספר, לא וקטור. אחרי הכפל מחברים."),
        W(num(u[0]*v[0]-u[1]*v[1]),"חיסרתם בין המכפלות. במכפלה סקלרית מחברים."),
        W(num(u[0]*v[1]+u[1]*v[0]),"הצלבתם רכיבים. מכפילים רכיב ראשון ברכיב ראשון ושני בשני.")
      ],
      steps:[
        S("הגדרת המכפלה הסקלרית","מכפילים רכיבים מתאימים ומחברים. התוצאה היא מספר יחיד.",
          "u·v = u₁v₁ + u₂v₂"),
        S("מציבים","",pn(u[0])+"·"+pn(v[0])+" + "+pn(u[1])+"·"+pn(v[1])),
        S("מחשבים","",num(u[0]*v[0])+" + "+pn(u[1]*v[1])+" = "+num(dot)),
        S("מה זה אומר",dot===0?"מכפלה סקלרית אפס פירושה שהווקטורים מאונכים.":"המכפלה שונה מאפס, ולכן הווקטורים אינם מאונכים.","")
      ],rule:"dot",hint:"רכיב כפול רכיב, ואז מחברים. התוצאה מספר."};
  }
  u=[rnz(-6,6),rnz(-6,6)];
  var w=[-u[1],u[0]];        /* מאונך לפי בנייה */
  var wNot=[u[0],rnz(-6,6)];
  while(u[0]*wNot[0]+u[1]*wNot[1]===0)wNot[1]=rnz(-6,6);
  return {ask:"איזה מהווקטורים מאונך ל-u?",expr:"u = "+vecH(u),
    ans:W(vecH(w)),
    wrong:[
      W(vecH([u[0],u[1]]),"זה הווקטור עצמו. וקטור מאונך לעצמו רק אם הוא וקטור האפס."),
      W(vecH([-u[0],-u[1]]),"זה הווקטור ההפוך — הוא מקביל ל-u, לא מאונך לו."),
      W(vecH(wNot),"המכפלה הסקלרית כאן היא "+num(u[0]*wNot[0]+u[1]*wNot[1])+" ולא אפס.")
    ],
    steps:[
      S("תנאי הניצבות","שני וקטורים מאונכים בדיוק כאשר המכפלה הסקלרית שלהם מתאפסת.","u·v = 0 ⇔ u ⊥ v"),
      S("בונים מאונך במישור","מחליפים בין הרכיבים והופכים סימן לאחד מהם.","u = (a,b) → (−b,a)"),
      S("בודקים","",pn(u[0])+"·"+pn(w[0])+" + "+pn(u[1])+"·"+pn(w[1])+" = 0")
    ],rule:"dot",hint:"מאונכים כשהמכפלה הסקלרית אפס. במישור: מחליפים רכיבים והופכים סימן לאחד."};
}

/* ---------- 13. ערכים עצמיים ---------- */
function genEigen(L){
  var l1,l2,a,b,c,d,steps;
  if(L===1){
    l1=rnz(-5,5);l2=rnz(-5,5);
    while(l2===l1)l2=rnz(-5,5);
    a=l1;d=l2;b=rnz(-4,4);c=0;      /* משולשת — הערכים העצמיים על האלכסון */
    return {ask:"מצאו את הערכים העצמיים",expr:"A = "+mat([[a,b],[c,d]]),
      ans:W("λ = "+num(l1)+" , λ = "+num(l2)),
      wrong:[
        W("λ = "+num(b)+" , λ = "+num(a),"לקחתם איברים שאינם על האלכסון. במטריצה משולשת הערכים העצמיים הם בדיוק איברי האלכסון."),
        W("λ = "+num(a+d)+" , λ = "+num(a*d),"אלה העקבה והדטרמיננטה, ולא הערכים העצמיים עצמם."),
        W("λ = "+num(-l1)+" , λ = "+num(-l2),"טעות סימן. במשוואה det(A−λI)=0 המינוס כבר נלקח בחשבון.")
      ],
      steps:[
        S("המשוואה האופיינית","מחפשים λ שעבורו המטריצה A מינוס λI מאבדת הפיכות.","det(A − λI) = 0"),
        S("כותבים את המטריצה","",mat([["a−λ",b],[c,"d−λ"]])),
        S("המטריצה משולשת","כשיש אפס מתחת לאלכסון, הדטרמיננטה היא מכפלת האלכסון.",
          "("+num(a)+" − λ)("+num(d)+" − λ) = 0"),
        S("הפתרונות","","λ = "+num(l1)+"   ,   λ = "+num(l2))
      ],rule:"eigen",hint:"במטריצה משולשת הערכים העצמיים יושבים על האלכסון."};
  }
  l1=rnz(-4,4);l2=rnz(-4,4);
  while(l2===l1)l2=rnz(-4,4);
  var tr=l1+l2,de=l1*l2;
  a=rnz(-4,4);d=tr-a;
  b=rnz(1,4);c=(a*d-de)/b;
  var t2=0;
  while((Math.round(c)!==c||Math.abs(c)>9)&&t2<120){a=rnz(-4,4);d=tr-a;b=rnz(1,4);c=(a*d-de)/b;t2++}
  if(Math.round(c)!==c){a=l1;d=l2;b=0;c=0}
  if(L===2){
    return {ask:"מצאו את הערכים העצמיים",expr:"A = "+mat([[a,b],[c,d]]),
      ans:W("λ = "+num(Math.min(l1,l2))+" , λ = "+num(Math.max(l1,l2))),
      wrong:[
        W("λ = "+num(a)+" , λ = "+num(d),"לקחתם את איברי האלכסון. זה נכון רק במטריצה משולשת."),
        W("λ = "+num(-Math.min(l1,l2))+" , λ = "+num(-Math.max(l1,l2)),"טעות סימן בפתרון המשוואה הריבועית."),
        W("λ = "+num(tr)+" , λ = "+num(de),"אלה סכום ומכפלת הערכים העצמיים, לא הם עצמם.")
      ],
      steps:[
        S("שתי עובדות שחוסכות עבודה","סכום הערכים העצמיים הוא העקבה, ומכפלתם היא הדטרמיננטה.",
          "λ₁+λ₂ = "+num(tr)+"   ,   λ₁·λ₂ = "+num(de)),
        S("המשוואה האופיינית","","λ²"+term(-tr,"λ")+sgn(de)+" = 0"),
        S("מפרקים לגורמים","","(λ"+sgn(-l1)+")(λ"+sgn(-l2)+") = 0"),
        S("הפתרונות","","λ = "+num(Math.min(l1,l2))+"   ,   λ = "+num(Math.max(l1,l2)))
      ],rule:"eigen",hint:"סכום הערכים העצמיים הוא העקבה, ומכפלתם הדטרמיננטה."};
  }
  return {ask:"סכום הערכים העצמיים של מטריצה שווה תמיד ל־",expr:"",
    ans:W("עקבת המטריצה"),
    wrong:[
      W("דטרמיננטת המטריצה","הדטרמיננטה שווה למכפלת הערכים העצמיים, לא לסכומם."),
      W("סכום כל איברי המטריצה","רק איברי האלכסון הראשי נספרים בעקבה."),
      W("מספר השורות","זה נכון רק במקרה פרטי של מטריצת היחידה.")
    ],
    steps:[
      S("שני קשרים שכדאי לזכור","הם חוסכים פתרון מלא של המשוואה האופיינית, ומאפשרים לבדוק תשובה בשנייה.",
        "Σλ = trace(A)   ,   Πλ = det(A)"),
      S("העקבה","סכום איברי האלכסון הראשי בלבד.","trace = a₁₁ + a₂₂"),
      S("שימוש מעשי","אם חישבתם ערכים עצמיים והסכום לא יוצא כמו העקבה — יש טעות.","")
    ],rule:"eigen",hint:"עקבה = סכום האלכסון הראשי = סכום הערכים העצמיים."};
}
