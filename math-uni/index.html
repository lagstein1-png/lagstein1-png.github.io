<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>אקסיומה — מתמטיקה לתואר ראשון, צעד אחר צעד</title>
<meta name="description" content="תרגול מתמטיקה לשנה א׳ באוניברסיטה: חדו״א, אלגברה לינארית, הסתברות ובדידה. כל שאלה עם פתרון מודרך צעד־צעד, זיהוי הטעות, דף נוסחאות והקראה בקול טבעי." />
<meta name="theme-color" content="#f5f7fb" media="(prefers-color-scheme:light)" />
<meta name="theme-color" content="#0e1117" media="(prefers-color-scheme:dark)" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   אקסיומה — מתמטיקה לתואר ראשון
   אותו עיקרון של ״שלב״, בחומר של שנה א׳: חדו״א, אלגברה לינארית,
   הסתברות ובדידה. סטודנט שמתקשה לא צריך פחות חומר — הוא צריך
   לראות את הצעדים שבין שורה לשורה.
   ============================================================ */
:root{
  --ar:"Noto Sans Arabic",system-ui,"Segoe UI",Arial,sans-serif;
  --font:"Heebo","Rubik",system-ui,"Segoe UI",Arial,sans-serif;
  --bg:#f5f7fb; --surface:#ffffff; --surface2:#eef1f7;
  --ink:#101828; --muted:#5b6478; --faint:#687080; --line:#e0e4ee;
  --accent:#4f46e5; --accent-ink:#ffffff; --accent-soft:#e9e8fd;
  /* צהוב ההדגשה — אותו צהוב של מקריא קולי, כדי שמעקב ההקראה
     ייראה אותו דבר בכל האתר. */
  --hit:#f5c451; --hit-ink:#1a1300;
  --cyan:#0e7490; --cyan-soft:#dcf3f8;
  --ok:#15803d; --ok-soft:#dcfce7; --bad:#be123c; --bad-soft:#ffe4e9;
  --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px -12px rgba(16,24,40,.18);
  --r:14px;
  /* צבע לכל תחום לימוד. זה לא קישוט — זה עוזר לזהות מיד באיזה
     סוג חומר מדובר, וזה בדיוק מה שעוזר למי שמתקשה להתמצא. */
  --c-base:#0a6f66; --cs-base:#d2f4ef;
  --c-alg:#4a45c9;  --cs-alg:#e6e5fe;
  --c-geo:#9a4708;  --cs-geo:#fbecd3;
  --c-data:#be185d; --cs-data:#fbdfeb;
}

/* Heebo, Fredoka ו-Assistant אינם מכילים גליפים ערביים. בלי
   המשפחה הזאת הממשק הערבי נופל לגופן ברירת המחדל של המערכת —
   נמדד: הוא הוצג כאן ב-Heebo. Noto Sans Arabic נטען מאותה בקשת
   גופנים שכבר קיימת, ולכן אין כאן תלות חיצונית חדשה, וקובצי
   הגופן נמשכים רק כשבאמת מוצג טקסט ערבי. */
html[lang="ar"] body,html[lang="ar"] input,html[lang="ar"] button,
html[lang="ar"] textarea,html[lang="ar"] select{font-family:var(--ar)}
:root[data-theme="dark"]{
  --bg:#0e1117; --surface:#161b26; --surface2:#1e2532;
  --ink:#e8ecf4; --muted:#9aa4ba; --faint:#8f99ae; --line:#28313f;
  --accent:#818cf8; --accent-ink:#0e1117; --accent-soft:#232842;
  --hit:#ffd24d; --hit-ink:#241a00;
  --cyan:#22d3ee; --cyan-soft:#132b33;
  --ok:#4ade80; --ok-soft:#132a1c; --bad:#fb7185; --bad-soft:#33161f;
  --warn:#fbbf24; --warn-soft:#33260f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  --c-base:#2dd4bf; --cs-base:#0f2e2b;
  --c-alg:#a5b4fc;  --cs-alg:#1e2140;
  --c-geo:#fbbf24;  --cs-geo:#33270f;
  --c-data:#f472b6; --cs-data:#33162a;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1117; --surface:#161b26; --surface2:#1e2532;
    --ink:#e8ecf4; --muted:#9aa4ba; --faint:#8f99ae; --line:#28313f;
    --accent:#818cf8; --accent-ink:#0e1117; --accent-soft:#232842;
    --hit:#ffd24d; --hit-ink:#241a00;
    --cyan:#22d3ee; --cyan-soft:#132b33;
    --ok:#4ade80; --ok-soft:#132a1c; --bad:#fb7185; --bad-soft:#33161f;
    --warn:#fbbf24; --warn-soft:#33260f;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  --c-base:#2dd4bf; --cs-base:#0f2e2b;
  --c-alg:#a5b4fc;  --cs-alg:#1e2140;
  --c-geo:#fbbf24;  --cs-geo:#33270f;
  --c-data:#f472b6; --cs-data:#33162a;
  }
}
/* ניגודיות גבוהה — שחור על לבן, מסגרות מלאות, בלי גוונים רכים */
:root.hc{
  --bg:#ffffff; --surface:#ffffff; --surface2:#ffffff;
  --ink:#000000; --muted:#1a1a1a; --faint:#333333; --line:#000000;
  --accent:#00308f; --accent-ink:#ffffff; --accent-soft:#e8edf8;
  --hit:#ffe600; --hit-ink:#000000;
  --cyan:#004b57; --cyan-soft:#e6f2f4;
  --ok:#0a5c2a; --ok-soft:#e6f4ea; --bad:#8c0f2c; --bad-soft:#fbe9ed;
  --warn:#6b3d00; --warn-soft:#f7efdf; --shadow:none;
  --c-base:#00308f; --cs-base:#e8edf8; --c-alg:#00308f; --cs-alg:#e8edf8;
  --c-geo:#00308f;  --cs-geo:#e8edf8;  --c-data:#00308f; --cs-data:#e8edf8;
}
:root.hc .card,:root.hc .opt,:root.hc .btn,:root.hc .chip,:root.hc .tile{border:2px solid #000}
:root.hc .deco{display:none}

*{box-sizing:border-box;margin:0}
html{font-size:100%}
html.ts2{font-size:112%}
html.ts3{font-size:126%}
/* פונט ברור לקריאה: Tahoma ו-Verdana קיימים כמעט בכל מכשיר וכוללים עברית */
html.clearfont{--font:Tahoma,Verdana,Arial,sans-serif}
/* ריווח מוגדל — עוזר למי שקשה לו לעקוב אחרי השורה */
html.spaced body{letter-spacing:.03em;word-spacing:.16em;line-height:1.95}
html.rm *,html.rm *::before,html.rm *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.65;
  -webkit-text-size-adjust:100%;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:inherit}
input,select,textarea{font:inherit;color:var(--ink)}
a{color:var(--accent)}
::selection{background:var(--accent);color:var(--accent-ink)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---------- שלד ---------- */
#app{min-height:100vh;display:flex;flex-direction:column}
/* בלי זה כרום מותח כל מסך לרוחב המינימלי של התוכן שלו והעמוד גולש בטלפון */
#app>*{min-width:0;width:100%}
.wrap{max-width:1120px;margin:0 auto;padding:0 clamp(12px,4vw,22px)}
.deco{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.85;
  background:
    radial-gradient(760px 380px at 92% -6%,var(--cs-alg),transparent 62%),
    radial-gradient(620px 340px at 2% 18%,var(--cs-data),transparent 58%),
    radial-gradient(700px 380px at 10% 102%,var(--cs-base),transparent 60%),
    radial-gradient(520px 300px at 96% 78%,var(--cs-geo),transparent 58%)}
#app{position:relative;z-index:1}

/* ---------- כותרת עליונה ---------- */
header{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:10px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand .mk{width:38px;height:38px;border-radius:11px;
  background:linear-gradient(140deg,var(--c-alg),var(--c-data) 55%,var(--c-geo));color:#fff;
  display:grid;place-items:center;font-weight:800;font-size:1.05rem;flex-shrink:0}
:root.hc .brand .mk{background:var(--ink)}
.brand b{display:block;font-size:1rem;line-height:1.15;font-weight:800}
.brand small{display:block;color:var(--muted);font-size:.72rem;font-weight:500}
nav{display:flex;gap:4px;margin-inline-start:auto;flex-wrap:wrap}
.nb{display:inline-flex;align-items:center;gap:6px;border-radius:10px;padding:8px 12px;
  font-size:.9rem;font-weight:600;color:var(--muted);border:1px solid transparent;transition:.15s}
.nb:hover{background:var(--surface2);color:var(--ink)}
.nb.on{background:var(--accent);color:var(--accent-ink)}
:root.hc .nb.on{background:var(--ink);color:var(--bg)}
.nb svg{flex-shrink:0}
@media(max-width:560px){.nb span{display:none}.nb{padding:9px 11px}}

/* ---------- רכיבי בסיס ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:clamp(14px,3.4vw,22px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:11px;
  font-weight:700;padding:12px 18px;transition:.15s;border:1px solid transparent;line-height:1.3}
.btn-p{background:linear-gradient(135deg,var(--accent),var(--c-data));color:#fff}
.btn-p:hover{filter:brightness(1.1)}
:root.hc .btn-p{background:var(--accent)}
.btn-d{background:var(--ink);color:var(--bg)}
.btn-g{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-g:hover{background:var(--surface2)}
.btn[disabled]{opacity:.42;cursor:not-allowed}
.btn.w{width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;
  font-size:.82rem;font-weight:600;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.chip.a{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.h1{font-size:clamp(1.5rem,5.2vw,2.05rem);font-weight:800;line-height:1.2;overflow-wrap:anywhere}
.h2{font-size:clamp(1.1rem,3.6vw,1.3rem);font-weight:700;overflow-wrap:anywhere}
.sub{color:var(--muted);margin-top:5px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.sm{font-size:.85rem}
.xs{font-size:.76rem}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
/* רשימת הקולות: שתי עמודות רק כשבאמת יש מקום, אחרת השמות נקטעים */
.vgrid{grid-template-columns:repeat(auto-fit,minmax(min(100%,215px),1fr));gap:8px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
hr.sep{border:none;border-top:1px solid var(--line);margin:16px 0}

/* ---------- מתמטיקה: תמיד משמאל לימין, מבודד מהעברית ---------- */
.m{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums}
.mline{direction:ltr;unicode-bidi:isolate;text-align:center;font-weight:700;
  font-size:clamp(1.55rem,7vw,2.5rem);letter-spacing:.01em;line-height:1.35;overflow-wrap:anywhere}
.mstep{direction:ltr;unicode-bidi:isolate;text-align:center;font-weight:700;
  font-size:clamp(1.05rem,4.6vw,1.35rem);background:var(--surface2);border-radius:10px;
  padding:9px 12px;margin-top:8px;overflow-wrap:anywhere}
sup{font-size:.62em;vertical-align:super;line-height:0}
sub{font-size:.62em;vertical-align:sub;line-height:0}
/* ---------- מטריצה ווקטור ---------- */
.mtx{display:inline-flex;align-items:stretch;gap:7px;vertical-align:middle;
  padding:3px 10px;margin:0 .2em;position:relative;direction:ltr}
.mtx::before,.mtx::after{content:"";position:absolute;top:0;bottom:0;width:7px;
  border-top:2px solid currentColor;border-bottom:2px solid currentColor}
.mtx::before{inset-inline-start:0;border-inline-start:2px solid currentColor}
.mtx::after{inset-inline-end:0;border-inline-end:2px solid currentColor}
.mtx .mcol{display:flex;flex-direction:column;gap:3px;text-align:center;min-width:1.5em}
.mtx .mcol>span{padding:1px 4px;font-variant-numeric:tabular-nums}
.vec{display:inline-flex;gap:9px;padding:2px 11px;margin:0 .16em;direction:ltr;
  border-inline-start:2px solid currentColor;border-inline-end:2px solid currentColor;border-radius:9px}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;
  line-height:1.05;margin:0 .18em;font-size:.86em}
.frac>span:first-child{border-bottom:.09em solid currentColor;padding:0 .22em}
.frac>span:last-child{padding:0 .22em}

/* ---------- תשובות ---------- */
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
@media(max-width:430px){.opts{grid-template-columns:minmax(0,1fr)}}
.opt{position:relative;border:2px solid var(--line);background:var(--surface);border-radius:12px;
  padding:15px 14px 15px 44px;font-weight:700;font-size:clamp(1rem,4vw,1.2rem);transition:.14s;min-height:58px;
  display:flex;align-items:center;gap:10px}
[dir="rtl"] .opt{padding:15px 44px 15px 14px}
.opt:hover:not([disabled]){border-color:var(--c,var(--accent));background:var(--cs,var(--accent-soft))}
.opt .k{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);
  width:24px;height:24px;border-radius:7px;background:var(--cs,var(--surface2));color:var(--c,var(--faint));
  display:grid;place-items:center;font-size:.76rem;font-weight:700}
/* currentColor כאן היה נפתר לצבע שנקבע באותה הצהרה עצמה,
   ולכן הרקע והטקסט יצאו זהים והספרה נעלמה. */
.opt.right .k{background:var(--ok);color:var(--surface)}
.opt.wrong .k{background:var(--bad);color:var(--surface)}
.opt.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
/* בחירה במבחן היא בחירה, לא תשובה נכונה. במסכי התרגול הצבע
   הירוק אומר "צדקת", ובמבחן אסור לו להופיע כלל — הוא נותן
   משוב שגוי לכל בחירה. ניטרלי, ורק מסמן מה סומן. */
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.opt.dim{opacity:.4}
.opt.gone{opacity:.35;text-decoration:line-through}

/* ---------- פתרון מודרך ---------- */
.steps{margin-top:16px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.step{padding:13px 15px;border-top:1px solid var(--line);background:var(--surface)}
.step:first-child{border-top:none}
.step.future{display:none}
.step .st{display:flex;align-items:center;gap:9px;font-weight:700;font-size:.95rem}
.step .num{width:23px;height:23px;border-radius:50%;background:var(--c,var(--accent));color:var(--accent-ink);
  display:grid;place-items:center;font-size:.76rem;flex-shrink:0;font-weight:700}
.step .sd{color:var(--muted);font-size:.92rem;margin-top:4px;overflow-wrap:anywhere}
.step.last{background:var(--ok-soft)}
.step.last .num{background:var(--ok);color:var(--surface)}

/* ---------- פירוט טעות ---------- */
.diag{margin-top:14px;border-inline-start:4px solid var(--bad);background:var(--bad-soft);
  border-radius:0 10px 10px 0;padding:12px 15px}
[dir="rtl"] .diag{border-radius:10px 0 0 10px}
.diag b{color:var(--bad)}
.hintbox{margin-top:14px;border-inline-start:4px solid var(--warn);background:var(--warn-soft);
  border-radius:0 10px 10px 0;padding:12px 15px}
.wd{border-radius:5px;padding:1px 3px}
.wd.hit{background:var(--hit);color:var(--hit-ink);font-weight:600}
/* כשמנוע הדיבור אינו מדווח על גבולות מילים — קורה הרבה בעברית
   באנדרואיד — אין מה להדגיש מילה־מילה, ואז מודגש כל האיבר. הכלל
   הזה חסר, ולכן ההדגשה החלופית לא נראתה כלל: מי שהמנוע שלו שקט
   קיבל טקסט בלי שום סימון והמשיך לחפש את המקום בעיניים. */
.now{background:var(--hit);color:var(--hit-ink);border-radius:8px;
  box-shadow:0 0 0 4px var(--hit)}
[dir="rtl"] .hintbox{border-radius:10px 0 0 10px}

/* ---------- מדדים ---------- */
.bar{height:7px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s,background .3s}
.bar.ok>i{background:var(--ok)}
.bar.mid>i{background:var(--warn)}
.bar.low>i{background:var(--bad)}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--surface2);border:1px solid var(--line)}
.dot.ok{background:var(--ok);border-color:var(--ok)}
.dot.no{background:var(--bad);border-color:var(--bad)}
.dot.flag{box-shadow:0 0 0 2px var(--accent)}
.dot.hp{background:var(--warn);border-color:var(--warn)}
.tile{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--c,var(--accent));
  border-radius:12px;padding:14px;box-shadow:var(--shadow)}
.tile b{display:block;font-size:1.7rem;font-weight:800;line-height:1.2;color:var(--c,var(--ink))}
.tile span{color:var(--muted);font-size:.82rem}

/* ---------- כרטיס נושא ---------- */
.tpc{position:relative;display:flex;flex-direction:column;gap:9px;text-align:start;background:var(--surface);
  border:1px solid var(--line);border-inline-start:4px solid var(--c,var(--accent));
  border-radius:12px;padding:14px;transition:.15s;box-shadow:var(--shadow);min-width:0}
.tpc:hover{border-color:var(--c,var(--accent));transform:translateY(-2px);box-shadow:0 8px 22px -12px var(--c)}
.tpc:hover{border-inline-start-color:var(--c,var(--accent))}
.tpc.on{border-color:var(--c,var(--accent));background:var(--cs,var(--accent-soft))}
.tpc .tn{color:var(--c,var(--ink))}
.tpc .tn{font-weight:700;font-size:.98rem;overflow-wrap:anywhere}
.tpc .td{color:var(--muted);font-size:.8rem;overflow-wrap:anywhere}
.tpc .tm{display:flex;align-items:center;gap:7px;font-size:.74rem;color:var(--faint)}
.tpc .tm .bar{flex:1;min-width:0}

/* ---------- מתגים והגדרות ---------- */
.tog{display:flex;align-items:center;gap:13px;width:100%;text-align:start;background:var(--surface2);
  border:1px solid transparent;border-radius:12px;padding:13px 15px;transition:.15s;min-width:0}
.tog:hover{border-color:var(--line)}
.tog+.tog{margin-top:9px}
.tog .tt{flex:1;min-width:0}
.tog .tt b{display:block;font-size:.97rem;overflow-wrap:anywhere}
.tog .tt span{display:block;color:var(--muted);font-size:.82rem;overflow-wrap:anywhere}

function demoMountUI(){
  var st=document.createElement("style");
  st.id="demo-style"; st.textContent=DEMO_CSS;
  (document.head||document.documentElement).appendChild(st);

  var b=document.createElement("button");
  b.id="demo-start"; b.type="button";
  b.innerHTML='<span aria-hidden="true">▶</span><span>התחל הדגמה</span>';
  b.addEventListener("click",demoStart);
  document.body.appendChild(b);

  var bar=document.createElement("div");
  bar.id="demo-bar"; bar.hidden=true;
  bar.setAttribute("role","status");
  bar.setAttribute("aria-live","polite");
  bar.innerHTML='<div id="demo-sub"><p id="demo-txt"></p>'+
    '<div id="demo-meta"><span id="demo-step"></span>'+
    '<button id="demo-exit" type="button">יציאה · ESC</button></div>'+
    '<div id="demo-prog"><i></i></div></div>';
  document.body.appendChild(bar);

  DEMO.btn=b; DEMO.bar=bar;
  DEMO.txt=document.getElementById("demo-txt");
  DEMO.step=document.getElementById("demo-step");
  DEMO.fill=bar.querySelector("#demo-prog i");
  document.getElementById("demo-exit").addEventListener("click",function(){demoStop()});
  document.addEventListener("keydown",demoKey,true);

/* ESC יוצא. הקשבה בשלב הלכידה, כדי שמסך שכבר מטפל ב-Escape
   לא יבלע את המקש לפני שההדגמה ראתה אותו. */
function demoKey(e){
  if(!DEMO.on)return;
  if(e.key==="Escape"||e.keyCode===27){
    e.preventDefault(); e.stopPropagation();
    demoStop();
  }
}

function demoStart(){
  if(DEMO.on)return;
  DEMO.on=true; DEMO.i=0;
  DEMO.btn.hidden=true; DEMO.bar.hidden=false;
  document.documentElement.classList.add("demo-running");
  demoNext();
}

function demoNext(){
  if(!DEMO.on)return;
  if(DEMO.i>=DEMO_SCRIPT.length){demoStop();return}
  var it=DEMO_SCRIPT[DEMO.i++]||{};
  var d=Math.max(600,it.duration||3000);
  DEMO.txt.textContent=it.subtitle||"";
  DEMO.step.textContent=DEMO.i+" / "+DEMO_SCRIPT.length;
  DEMO.fill.style.transition="none"; DEMO.fill.style.width="0";
  void DEMO.fill.offsetWidth;
  DEMO.fill.style.transition="width "+d+"ms linear";
  DEMO.fill.style.width="100%";
  if(typeof it.action==="function"){
    try{it.action()}catch(err){if(window.console)console.warn("demo:",err)}
  }
  DEMO.timer=setTimeout(demoNext,d);
}

function demoStop(){
  DEMO.on=false;
  if(DEMO.timer){clearTimeout(DEMO.timer);DEMO.timer=null}
  DEMO.extra.forEach(function(t){clearTimeout(t);clearInterval(t)});
  DEMO.extra=[];
  var m=document.querySelectorAll(".demo-tap"),i;
  for(i=0;i<m.length;i++)m[i].classList.remove("demo-tap");
  if(DEMO.bar)DEMO.bar.hidden=true;
  if(DEMO.btn)DEMO.btn.hidden=false;
  document.documentElement.classList.remove("demo-running");
  demoQuiet();
}

function _(h){

   שמשולב בו מספר נשמר כתבנית שלמה ולא כשני חלקים מודבקים. */
function _f(h){
  var t=_(h),i,args=arguments;
  for(i=1;i<args.length;i++)t=t.split("{"+(i-1)+"}").join(String(args[i]));

   בעברית. ערבית ורוסית כן נחשבות — שם זו שפת אם של ממש. מי
   שרוצה אנגלית בוחר אותה, והבחירה נשמרת. */
function guessLang(){
  var ls=(navigator.languages||[navigator.language||"he"]);
  for(var i=0;i<ls.length;i++){

    if(c==="iw")c="he";
    if(c==="en")continue;

  }
  return "he";
}

  HL={el:null,raw:"",spans:[],map:[],timer:null,got:false,added:false};

/* ------------------------------------------------------------
   פיצול לאמירות קצרות — הועתק מ"תאוריה מדברת", שם ההקראה נשמעת
   הכי טוב. מנועי מכשיר מאיצים ובולעים סופי מילים במשפט ארוך;
   כאן נשלחה שאלה שלמה באמירה אחת, לפעמים 300 תווים.
   כל מקטע נושא את ההיסט שלו במחרוזת המלאה, כי charIndex מתאפס
   בכל אמירה ובלעדיו ההדגשה קופצת לתחילת המשפט בכל מקטע.
   ------------------------------------------------------------ */
var SEG_MAX=90, SEG_GAP=260;
/* סימן פיסוק בין שתי ספרות הוא חלק מהמספר ולא מקום לחתוך בו:
   בלי הבדיקה הזאת "3,500" נשבר והמנוע קורא "שלוש, חמש מאות". */
function insideNumber(str,i){
  return i>0&&i+1<str.length&&/[0-9]/.test(str[i-1])&&/[0-9]/.test(str[i+1]);
}
function segments(spoken){
  var out=[],parts=[],from=0,i,j;
  function push(t,start){ if(String(t).trim())out.push({text:t,start:start}) }
  for(i=0;i<spoken.length;i++){
    if(".!?:;".indexOf(spoken[i])<0)continue;
    if(insideNumber(spoken,i))continue;
    j=i+1; while(j<spoken.length&&/\s/.test(spoken[j]))j++;
    parts.push({text:spoken.slice(from,j),start:from});
    from=j; i=j-1;
  }
  if(from<spoken.length)parts.push({text:spoken.slice(from),start:from});
  for(var k=0;k<parts.length;k++){
    var p=parts[k];
    if(p.text.length<=SEG_MAX){ push(p.text,p.start); continue }
    var rest=p.text,base=p.start;
    while(rest.length>SEG_MAX){
      var cut=rest.lastIndexOf(",",SEG_MAX);
      while(cut>0&&insideNumber(rest,cut))cut=rest.lastIndexOf(",",cut-1);
      if(cut<SEG_MAX*0.4)cut=rest.lastIndexOf(" ",SEG_MAX);
      if(cut<=0)break;
      push(rest.slice(0,cut+1),base);
      base+=cut+1; rest=rest.slice(cut+1);
    }
    push(rest,base);
  }
  /* מקטע זעיר — "12." או ")" — עם הפסקה של רבע שנייה אחריו נשמע
     כמו גמגום. מאחדים אותו לזה שאחריו. */
  var merged=[];
  for(i=0;i<out.length;i++){
    if(merged.length&&out[i].text.trim().length<12&&
       merged[merged.length-1].text.length+out[i].text.length<=SEG_MAX*1.4){
      merged[merged.length-1].text+=out[i].text; continue;
    }
    if(out[i].text.trim().length<12&&i+1<out.length){
      out[i+1]={text:out[i].text+out[i+1].text,start:out[i].start}; continue;
    }
    merged.push(out[i]);
  }
  out=merged;
  return out.length?out:[{text:spoken,start:0}];
}
/* קצב לפי שפה — אותם ערכים שנבחרו בתאוריה מדברת אחרי האזנה */
var VOICE_TUNE={he:0.82,ar:0.85,en:0.90,ru:0.88};
function tuneRate(lang,rate){
  var t=VOICE_TUNE[String(lang||"he").split("-")[0].toLowerCase()]||0.88;
  var r=t*(rate||1);
  return Math.max(0.5,Math.min(1.6,Math.round(r*100)/100));
}

  return _("במכשיר הזה אין קול נשי בשפה הנוכחית, ולכן גובה הקול הורם. זה לא קול נשי אמיתי — כדי לקבל אחד צריך להתקין אותו.")+" "+how;

   במקביל. מונה אחד פותר את זה: כל הקראה מקבלת מספר, stopSpeak

     כשהרשימה כבר כאן, בוחרים קול ומדברים. כשהיא ריקה — מדברים
     בכל זאת, עם u.lang בלבד: קול ברירת מחדל בשפה הנכונה עדיף על

     כשרשימת הקולות התיישנה אחרי שהמערכת החליפה מנוע — עדיף להקריא
     בשפה הנכונה בקול ברירת המחדל מאשר לשתוק לגמרי. */

     לבד, וניקוי חוזר אינו משנה דבר — אבל בלעדיו כל מחרוזת שנשארה

  else if(n1<n2){ansTxt="0";why1=_("דרגת המכנה גבוהה יותר, ולכן המכנה גדל מהר יותר והמנה שואפת לאפס.");}
  else{ansTxt="∞";why1=_("דרגת המונה גבוהה יותר, ולכן הביטוי גדל ללא גבול.");}
  var others=[fr(a,b).html(),"0","∞"].filter(function(v){return v!==ansTxt});
  return {ask:_("חשבו את הגבול"),
    expr:'lim<sub>x→∞</sub> <span class="frac"><span>'+coef(a,pw("x",n1))+' + 3</span><span>'+coef(b,pw("x",n2))+' − 1</span></span>',
    ans:W(ansTxt),
    wrong:others.map(function(v){return W(v,why1)}).concat([
      W(fr(b,a).html(),_("הפכתם את יחס המקדמים. המונה נשאר במונה."))
    ]),
    steps:[
      S(_("מסתכלים רק על הדרגות הגבוהות"),_("באינסוף האיברים הקטנים לא משנים כלום. מה שקובע הוא החזקה הגבוהה בכל צד."),
        _f("דרגת מונה: {0}   דרגת מכנה: {1}", n1, n2)),
      S(_("משווים דרגות"),_("דרגת מונה גדולה יותר ← אינסוף. שווה ← יחס המקדמים המובילים. קטנה יותר ← אפס."),
        n1>n2?_("גדולה"):n1===n2?_("שווה"):_("קטנה")),
      S(_("התשובה"),"",ansTxt)
    ],rule:"liminf",hint:_("באינסוף משווים את דרגות המונה והמכנה, ורק אז מסתכלים על המקדמים.")};
}

/* ---------- 2. נגזרות בסיסיות ---------- */
function genDeriv(L){
  /* ---- רמה 4 ----
     ברמות 1–3 נאמר "גזרו" והכלל היה ידוע מראש. כאן הבסיס והמעריך
     מוגרלים בנפרד, והשאלה היא איזה כלל בכלל חל: חזקה, מעריכית,
     קבוע, או אף לא אחד מהם. */
  if(L===4){
    var b4=pick([2,3,5]),n4=ri(2,5),k4=pick(["pow","exp","const","tower"]);
    var f4=k4==="pow"?"f(x) = "+pw("x",n4)
          :k4==="exp"?"f(x) = "+pw(String(b4),"x")
          :k4==="const"?"f(x) = "+pw(String(b4),n4)
          :"f(x) = x<sup>x</sup>";
    var oPow=_("כלל החזקה: המעריך קבוע והבסיס הוא x, ולכן f′ = n·xⁿ⁻¹.");
    var oExp=_("הכלל המעריכי: הבסיס קבוע והמעריך הוא x, ולכן f′ = bˣ·ln b.");
    var oConst=_("הפונקציה קבועה — אין בה x כלל, ולכן f′ = 0.");
    var oTower=_("אף אחד משני הכללים אינו חל: גם הבסיס וגם המעריך משתנים, וצריך גזירה לוגריתמית.");
    var map4=[["pow",oPow],["exp",oExp],["const",oConst],["tower",oTower]];
    var wh4={pow:_("כלל החזקה תקף רק כשהמעריך קבוע והבסיס הוא x."),
             exp:_("הכלל המעריכי תקף רק כשהבסיס קבוע והמעריך הוא x."),
             "const":_("פונקציה קבועה היא כזו שאין בה x בכלל."),
             tower:_("גזירה לוגריתמית נדרשת רק כששני הצדדים משתנים.")};
    return {ask:_("איזה כלל גזירה חל על הפונקציה?"),expr:f4,
      ans:W(map4.filter(function(o){return o[0]===k4})[0][1]),
      wrong:map4.filter(function(o){return o[0]!==k4}).map(function(o){return W(o[1],wh4[o[0]])}),
      steps:[
        S(_("מסתכלים איפה יושב ה-x"),_("ארבע הצורות נראות דומות ונבדלות רק במיקום ה-x: בבסיס, במעריך, בשניהם או באף אחד."),
          "xⁿ   ·   bˣ   ·   bⁿ   ·   xˣ"),
        S(_("כאן"),"",f4),
        S(_("ולכן"),"",map4.filter(function(o){return o[0]===k4})[0][1])
      ],rule:"dpow",hint:_("שאלו קודם: מי משתנה — הבסיס, המעריך, שניהם או אף אחד?")};
  }
  var a,b,c,n,steps;
  if(L===1){
    a=rnz(-6,6);n=ri(2,6);b=rnz(-8,8);c=rnz(-9,9);
    var d1=a*n,d2=b;
    /* fac ולא num: מקדם 1 אינו נכתב, ומקדם ‎−1 נכתב כמינוס בלבד */
    return {ask:_("גזרו את הפונקציה"),expr:"f(x) = "+fac(a)+pw("x",n)+term(b,"x")+sgn(c),
      ans:W("f'(x) = "+num(d1)+pw("x",n-1)+sgn(b)),
      wrong:[
        W("f'(x) = "+num(d1)+pw("x",n)+sgn(b),_("הורדתם את המעריך למקדם אבל לא הפחתתם אותו ב-1.")),
        W("f'(x) = "+fac(a)+pw("x",n-1)+sgn(b),_("הפחתתם את המעריך אבל שכחתם להכפיל בו את המקדם.")),
        W("f'(x) = "+num(d1)+pw("x",n-1)+sgn(b)+sgn(c),_("האיבר החופשי לא נעלם. נגזרת של קבוע היא תמיד אפס."))
      ],
      steps:[
        S(_("כלל החזקה"),_("(xⁿ)' = n·xⁿ⁻¹ — המעריך יורד ונעשה מקדם, והחזקה קטנה באחת."),"(xⁿ)' = n·xⁿ⁻¹"),
        S(_("גוזרים איבר איבר"),"",fac(a)+pw("x",n)+" → "+num(d1)+pw("x",n-1)),
        S(_("האיבר הלינארי והקבוע"),_f("נגזרת של {0}x היא {1}, ונגזרת של קבוע היא אפס.", num(b), num(b)),
          num(b)+"x → "+num(b)+"   ,   "+num(c)+" → 0"),
        S(_("מחברים"),"","f'(x) = "+num(d1)+pw("x",n-1)+sgn(b))
      ],rule:"dpow",hint:_("כל איבר בנפרד: המעריך יורד למקדם והחזקה קטנה באחת. קבוע נעלם.")};
  }
  if(L===2){
    a=rnz(-5,5);
    /* מקדם 1 היה הופך את המסיח "איבדתם את המקדם" לתשובה עצמה */
    while(a===1)a=rnz(-5,5);
    var kind=pick(["exp","ln","sqrt","inv"]);
    var f,df,why=[];
    if(kind==="exp"){f=fac(a)+"e<sup>x</sup>";df=fac(a)+"e<sup>x</sup>";
      why=[W("f'(x) = "+fac(a)+"x·e<sup>x</sup>",_("גזרתם את e^x כאילו הוא חזקה של x. הנגזרת של eˣ היא eˣ עצמה.")),
           W("f'(x) = e<sup>x</sup>",_("איבדתם את המקדם. מקדם קבוע נשאר בנגזרת.")),
           W("f'(x) = "+fac(a)+"e<sup>x−1</sup>",_("הורדתם את המעריך באחת. זה כלל החזקה, והוא לא חל על eˣ."))];}
    else if(kind==="ln"){f=fac(a)+"ln x";df='<span class="frac"><span>'+num(a)+'</span><span>x</span></span>';
      why=[W("f'(x) = "+fac(a)+"ln x",_("לא גזרתם בכלל.")),
           W('f\'(x) = <span class="frac"><span>1</span><span>x</span></span>',_f("איבדתם את המקדם {0}.", num(a))),
           W("f'(x) = "+coef(a,"x"),_("הפכתם את הכלל. הנגזרת של ln x היא 1 חלקי x."))];}
    else if(kind==="sqrt"){f=fac(a)+"√x";df='<span class="frac"><span>'+num(a)+'</span><span>2√x</span></span>';
      why=[W("f'(x) = "+fac(a)+"√x",_("לא גזרתם.")),
           W('f\'(x) = <span class="frac"><span>1</span><span>2√x</span></span>',_("איבדתם את המקדם.")),
           W('f\'(x) = <span class="frac"><span>'+num(a)+'</span><span>√x</span></span>',_("שכחתם את ה-2 במכנה. √x הוא x בחזקת חצי, והחצי יורד למקדם."))];}
    else{f='<span class="frac"><span>'+num(a)+'</span><span>x</span></span>';
      df='<span class="frac"><span>'+num(-a)+'</span><span>x<sup>2</sup></span></span>';
      why=[W('f\'(x) = <span class="frac"><span>'+num(a)+'</span><span>x<sup>2</sup></span></span>',_("שכחתם את המינוס. הנגזרת של 1/x היא מינוס 1 חלקי x².")),
           W('f\'(x) = <span class="frac"><span>'+num(-a)+'</span><span>x</span></span>',_("המכנה צריך להיות x בריבוע.")),
           W("f'(x) = "+fac(a)+"ln x",_f("זה האינטגרל של {0}/x, לא הנגזרת.", num(a)))];}
    return {ask:_("גזרו את הפונקציה"),expr:"f(x) = "+f,ans:W("f'(x) = "+df),wrong:why,
      steps:[
        S(_("מזהים את הפונקציה הבסיסית"),"",kind==="exp"?"(eˣ)' = eˣ":kind==="ln"?"(ln x)' = 1/x":kind==="sqrt"?"(√x)' = 1 / (2√x)":"(1/x)' = −1/x²"),
        S(_("המקדם נשאר"),_("מקדם קבוע פשוט מוכפל בנגזרת — הוא לא משתתף בגזירה."),"(c·f)' = c·f'"),
        S(_("התשובה"),"","f'(x) = "+df)
      ],rule:"dbasic",hint:_("קודם הנגזרת של הפונקציה הבסיסית, והמקדם פשוט נשאר מוכפל.")};
  }
  a=rnz(-5,5);b=rnz(-5,5);
  var tk=pick(["sin","cos"]);
  var dtk=tk==="sin"?fac(a)+"cos x":fac(-a)+"sin x";
  return {ask:_("גזרו את הפונקציה"),expr:"f(x) = "+fac(a)+tk+" x"+term(b,"x"),
    ans:W("f'(x) = "+dtk+sgn(b)),
    wrong:[
      W("f'(x) = "+(tk==="sin"?fac(-a)+"cos x":fac(a)+"sin x")+sgn(b),
        tk==="sin"?_("הוספתם מינוס. המינוס מופיע בנגזרת של קוסינוס, לא של סינוס."):_("שכחתם את המינוס. הנגזרת של cos היא מינוס sin.")),
      W("f'(x) = "+fac(a)+tk+" x"+sgn(b),_("לא גזרתם את הפונקציה הטריגונומטרית.")),
      W("f'(x) = "+dtk,_f("שכחתם לגזור את האיבר הלינארי. הנגזרת של {0}x היא {1}.", num(b), num(b)))
    ],
    steps:[
      S(_("נגזרות טריגונומטריות"),_("(sin x)' = cos x, ו-(cos x)' = −sin x. המינוס נמצא רק אצל הקוסינוס."),
        "(sin x)' = cos x   ,   (cos x)' = −sin x"),
      S(_("גוזרים איבר איבר"),"",fac(a)+tk+" x → "+dtk),
      S(_("האיבר הלינארי"),"",num(b)+"x → "+num(b)),
      S(_("מחברים"),"","f'(x) = "+dtk+sgn(b))
    ],rule:"dtrig",hint:_("סינוס גוזר לקוסינוס, וקוסינוס גוזר למינוס סינוס.")};
}

/* ---------- 3. כלל השרשרת ---------- */
function genChain(L){
  /* ---- רמה 4 ----
     טבלת ערכים במקום ביטוי. הכלל עצמו מוכר מרמות 1–3, אבל כאן צריך
     לבחור לבד את הנקודה שבה נקראת הנגזרת החיצונית — f′ ב-g(a) ולא
     ב-a. זו הטעות שנופלים בה במבחן, והיא בלתי נראית בגזירה סמלית. */
  if(L===4){
    var a4=ri(1,4),p4,q4,s4,t4,gd=0,ok4=false;
    do{
      p4=ri(1,6);q4=rnz(-5,5);s4=rnz(-5,5);t4=rnz(-5,5);
      var c1=s4*q4,c2=t4*q4,c3=s4,c4c=p4*q4;
      ok4=(p4!==a4)&&(c1!==c2)&&(c1!==c3)&&(c1!==c4c)&&(c2!==c3)&&(c2!==c4c)&&(c3!==c4c);
    }while(!ok4&&gd++<300);
    return {ask:_f("נתון h(x) = f(g(x)). חשבו את h′({0}).", a4),
      expr:"g("+a4+") = "+num(p4)+"  ,  g′("+a4+") = "+num(q4)+"<br>f′("+a4+") = "+num(t4)+"  ,  f′("+num(p4)+") = "+num(s4),
      ans:W("h′("+a4+") = "+num(s4*q4)),
      wrong:[
        W("h′("+a4+") = "+num(t4*q4),_f("לקחתם את f′ בנקודה {0}. הנגזרת החיצונית נקראת בנקודה g({1}) = {2}.", a4, a4, num(p4))),
        W("h′("+a4+") = "+num(s4),_("שכחתם להכפיל בנגזרת הפנימית g′.")),
        W("h′("+a4+") = "+num(p4*q4),_("הכפלתם ב-g(a) במקום ב-f′(g(a)). ערך הפונקציה הפנימית קובע רק היכן קוראים את f′."))
      ],
      steps:[
        S(_("אין כאן ביטוי לגזור"),_("נתונים רק ערכים בנקודה, ולכן הכלי היחיד שאפשר להפעיל הוא כלל השרשרת בצורתו הכללית."),
          "h′(a) = f′(g(a)) · g′(a)"),
        S(_("קודם מוצאים את הנקודה הפנימית"),"","g("+a4+") = "+num(p4)),
        S(_("קוראים את f′ שם, ולא ב-a"),"","f′("+num(p4)+") = "+num(s4)),
        S(_("מכפילים"),"",num(s4)+" · "+pn(q4)+" = "+num(s4*q4))
      ],rule:"chain",hint:_("f′ נקראת בנקודה g(a), לא ב-a. זה כל ההבדל.")};
  }
  var a,b,n,steps;
  if(L===1){
    a=rnz(-5,5);b=rnz(-8,8);n=ri(2,6);
    /* מקדם פנימי 1 היה הופך את "שכחתם את הנגזרת הפנימית" לתשובה עצמה */
    while(a===1)a=rnz(-5,5);
    var inr="("+coef(a,"x")+sgn(b)+")";
    return {ask:_("גזרו את הפונקציה"),expr:"f(x) = "+pw(inr,n),
      ans:W("f'(x) = "+num(n*a)+pw(inr,n-1)),
      wrong:[
        W("f'(x) = "+n+pw(inr,n-1),
          _f("שכחתם להכפיל בנגזרת הפנימית. הנגזרת של {0}{1} היא {2}, וצריך להכפיל בה.", coef(a,"x"), sgn(b), num(a))),
        W("f'(x) = "+num(n*a)+pw(inr,n),_("לא הפחתתם את המעריך.")),
        W("f'(x) = "+num(n*a)+pw("x",n-1),_("גזרתם כאילו בפנים יש רק x. הביטוי הפנימי כולו נשאר בסוגריים."))
      ],
      steps:[
        S(_("מזהים חיצוני ופנימי"),_f("החיצונית היא ״משהו בחזקת {0}״, והפנימית היא {1}{2}.", n, coef(a,"x"), sgn(b)),
          "f = uⁿ  ,  u = "+coef(a,"x")+sgn(b)),
        S(_("כלל השרשרת"),_("גוזרים את החיצונית ומשאירים את הפנימית כמו שהיא, ואז מכפילים בנגזרת הפנימית."),
          "f' = n·uⁿ⁻¹ · u'"),
        S(_("מציבים"),"","f' = "+n+pw(inr,n-1)+" · "+num(a)),
        S(_("מסדרים"),"","f'(x) = "+num(n*a)+pw(inr,n-1))
      ],rule:"chain",hint:_("אחרי שגוזרים את החיצונית — חייבים להכפיל בנגזרת של מה שבפנים.")};
  }
  if(L===2){
    a=rnz(-5,5);b=rnz(-8,8);
    /* |a| = 1 מוחק את הנגזרת הפנימית מהתצוגה, ואז המסיחים חופפים */
    while(Math.abs(a)===1)a=rnz(-5,5);
    var k=pick(["exp","ln","sin"]);
    var inner=coef(a,"x")+sgn(b);
    var f,df,ws;
    if(k==="exp"){f="e<sup>"+inner+"</sup>";df=fac(a)+"e<sup>"+inner+"</sup>";
      ws=[W("f'(x) = e<sup>"+inner+"</sup>",_("שכחתם את הנגזרת הפנימית. eᵘ גוזר ל-eᵘ·u′.")),
          W("f'(x) = "+fac(a)+"e<sup>"+coef(a,"x")+"</sup>",_("שיניתם את המעריך. הוא נשאר בדיוק כמו שהוא.")),
          W("f'(x) = "+fac(a)+"("+inner+")e<sup>"+inner+"</sup>",_("הכפלתם בביטוי הפנימי במקום בנגזרת שלו."))];}
    else if(k==="ln"){f="ln("+inner+")";df='<span class="frac"><span>'+num(a)+'</span><span>'+inner+'</span></span>';
      ws=[W('f\'(x) = <span class="frac"><span>1</span><span>'+inner+'</span></span>',_("שכחתם את הנגזרת הפנימית במונה.")),
          W('f\'(x) = <span class="frac"><span>'+num(a)+'</span><span>x</span></span>',_("המכנה הוא כל הביטוי הפנימי, לא רק x.")),
          W("f'(x) = "+fac(a)+"ln("+inner+")",_("לא גזרתם את הלוגריתם."))];}
    else{f="sin("+inner+")";df=fac(a)+"cos("+inner+")";
      ws=[W("f'(x) = cos("+inner+")",_("שכחתם להכפיל בנגזרת הפנימית.")),
          W("f'(x) = "+fac(-a)+"cos("+inner+")",_("הוספתם מינוס. המינוס שייך לנגזרת של קוסינוס.")),
          W("f'(x) = "+fac(a)+"cos x",_("הביטוי הפנימי נשאר בתוך הקוסינוס."))];}
    return {ask:_("גזרו את הפונקציה"),expr:"f(x) = "+f,ans:W("f'(x) = "+df),wrong:ws,
      steps:[
        S(_("מפרקים לשתי שכבות"),_f("הפנימית היא {0}, והנגזרת שלה היא {1}.", inner, num(a)),"u = "+inner+"  ,  u' = "+num(a)),
        S(_("גוזרים את החיצונית"),"",k==="exp"?"(eᵘ)' = eᵘ·u'":k==="ln"?"(ln u)' = u'/u":"(sin u)' = cos u · u'"),
        S(_("מציבים"),"","f'(x) = "+df)
      ],rule:"chain",hint:_("שתי שכבות: גוזרים את החיצונית על הפנימית כמו שהיא, ומכפילים בנגזרת הפנימית.")};
  }
  a=rnz(2,6);b=rnz(-9,9);
  return {ask:_("גזרו את הפונקציה"),expr:"f(x) = √(" + num(a)+"x"+sgn(b)+")",
    ans:W('f\'(x) = <span class="frac"><span>'+num(a)+'</span><span>2√('+num(a)+'x'+sgn(b)+')</span></span>'),
    wrong:[
      W('f\'(x) = <span class="frac"><span>1</span><span>2√('+num(a)+'x'+sgn(b)+')</span></span>',_f("שכחתם את הנגזרת הפנימית {0}.", num(a))),
      W('f\'(x) = <span class="frac"><span>'+num(a)+'</span><span>√('+num(a)+'x'+sgn(b)+')</span></span>',_("חסר ה-2 במכנה — שורש הוא חזקת חצי, והחצי נשאר.")),
      W('f\'(x) = <span class="frac"><span>'+num(a)+'</span><span>2√x</span></span>',_("הביטוי הפנימי נשאר שלם בתוך השורש."))
    ],
    steps:[
      S(_("כותבים את השורש כחזקה"),_("√u הוא u בחזקת חצי, וכך רואים שזה בדיוק כלל השרשרת."),"f = u^(1/2)  ,  u = "+num(a)+"x"+sgn(b)),
      S(_("גוזרים"),"","f' = ½·u^(−1/2) · u' = u' / (2√u)"),
      S(_("מציבים"),"","f'(x) = "+num(a)+" / (2√("+num(a)+"x"+sgn(b)+"))")
    ],rule:"chain",hint:_("√u גוזר ל-u′ חלקי 2√u. הנגזרת הפנימית עולה למונה.")};
}

/* ---------- 4. כלל המכפלה והמנה ---------- */
function genProdQuo(L){
  /* ---- רמה 4 ----
     שוב טבלת ערכים: לא נאמר איזה כלל, ואין ביטוי לגזור. הבחירה בין
     כלל המכפלה לכלל המנה, והצבה נכונה בשניהם, היא כל השאלה. */
  if(L===4){
    var pa=ri(1,4),A4,B4,C4,D4,isQ=Math.random()<0.5,gp=0,okp=false,qn=0,qd=1;
    do{
      A4=rnz(-6,6);B4=rnz(-6,6);C4=rnz(-4,4);D4=rnz(-4,4);
      qn=B4*C4-A4*D4;qd=C4*C4;
      if(isQ){
        okp=(qn!==0)&&(Math.abs(C4)!==1)&&
            !fr(qn,qd).eq(fr(-qn,qd))&&!fr(qn,qd).eq(fr(qn,C4))&&!fr(qn,qd).eq(fr(B4,D4))&&
            !fr(-qn,qd).eq(fr(qn,C4))&&!fr(-qn,qd).eq(fr(B4,D4))&&!fr(qn,C4).eq(fr(B4,D4));
      }else{
        var s1=B4*C4+A4*D4,s2=B4*D4,s3=qn,s4p=A4*C4;
        okp=(A4*D4!==0)&&(B4*C4!==0)&&(s1!==s2)&&(s1!==s3)&&(s1!==s4p)&&(s2!==s3)&&(s2!==s4p)&&(s3!==s4p);
      }
    }while(!okp&&gp++<300);
    var tbl4="f("+pa+") = "+num(A4)+"  ,  f′("+pa+") = "+num(B4)+"<br>g("+pa+") = "+num(C4)+"  ,  g′("+pa+") = "+num(D4);
    if(isQ){
      return {ask:_f("חשבו את הנגזרת של המנה f/g בנקודה x = {0}.", pa),expr:tbl4,
        ans:W(fr(qn,qd).html()),
        wrong:[
          W(fr(-qn,qd).html(),_("הפכתם את הסדר במונה. בכלל המנה המונה הוא f′g פחות fg′, והסדר קובע את הסימן.")),
          W(fr(qn,C4).html(),_("שכחתם להעלות את המכנה בריבוע. בכלל המנה מחלקים ב-g².")),
          W(fr(B4,D4).html(),_("חילקתם נגזרת בנגזרת. נגזרת של מנה אינה מנת הנגזרות."))
        ],
        steps:[
          S(_("בוחרים כלל"),_("נתונים ערכי שתי פונקציות ונגזרותיהן בנקודה אחת, ולא ביטוי לגזור. מנה של השתיים מחייבת את כלל המנה."),"(f/g)′ = (f′g − fg′) / g²"),
          S(_("מציבים במונה"),"",num(B4)+"·"+pn(C4)+" − "+pn(A4)+"·"+pn(D4)+" = "+num(qn)),
          S(_("מציבים במכנה"),"",pn(C4)+"² = "+num(qd)),
          S(_("מחלקים"),"",fr(qn,qd).html())
        ],rule:"quo",hint:_("f′g פחות fg′, והכול חלקי g בריבוע — עם הערכים של אותה נקודה.")};
    }
    return {ask:_f("חשבו את הנגזרת של המכפלה f·g בנקודה x = {0}.", pa),expr:tbl4,
      ans:W(num(B4*C4+A4*D4)),
      wrong:[
        W(num(B4*D4),_("הכפלתם נגזרת בנגזרת. נגזרת של מכפלה אינה מכפלת הנגזרות.")),
        W(num(qn),_("חיסרתם. המינוס שייך לכלל המנה, ובכלל המכפלה מחברים.")),
        W(num(A4*C4),_("זו מכפלת ערכי הפונקציות עצמן, בלי לגזור אף אחת מהן."))
      ],
      steps:[
        S(_("בוחרים כלל"),_("נתונים ערכי שתי פונקציות ונגזרותיהן בנקודה אחת, ולא ביטוי לגזור. מכפלה שלהן מחייבת את כלל המכפלה."),"(f·g)′ = f′g + fg′"),
        S(_("איבר ראשון"),"",num(B4)+"·"+pn(C4)+" = "+num(B4*C4)),
        S(_("איבר שני"),"",num(A4)+"·"+pn(D4)+" = "+num(A4*D4)),
        S(_("מחברים"),"",num(B4*C4)+" + "+pn(A4*D4)+" = "+num(B4*C4+A4*D4))
      ],rule:"prod",hint:_("שני איברים: f′g ועוד fg′, כל אחד בערכים של אותה נקודה.")};
  }
  var a,b,n,steps;
  if(L===1){
    n=ri(2,4);a=rnz(-4,4);
    /* f = a·xⁿ · e^x  →  f' = a·n·xⁿ⁻¹·e^x + a·xⁿ·e^x
       a הוגרל כאן מאז ומתמיד ולא הופיע בשום מקום — קוד מת שהשאיר
       לרמה שלוש הגרלות בלבד. עכשיו הוא המקדם. נוסף גם מסיח בעל שני
       איברים, כדי שהתשובה לא תהיה כמעט תמיד הארוכה ביותר. */
    var e1p=fac(a*n)+pw("x",n-1)+"e<sup>x</sup>";
    var e2p=function(c){return (c<0?" − ":" + ")+fac(Math.abs(c))+pw("x",n)+"e<sup>x</sup>"};
    var ansP1="f'(x) = "+e1p+e2p(a);
    return {ask:_("גזרו את הפונקציה"),expr:"f(x) = "+fac(a)+pw("x",n)+"e<sup>x</sup>",
      ans:W(ansP1),
      wrong:[
        W("f'(x) = "+e1p,
          _("גזרתם כל גורם בנפרד והכפלתם. נגזרת של מכפלה איננה מכפלת הנגזרות — צריך שני איברים.")),
        W("f'(x) = "+fac(a)+pw("x",n)+"e<sup>x</sup>",_("גזרתם רק את הגורם השני.")),
        W("f'(x) = "+e1p+e2p(-a),_("טעות סימן: בכלל המכפלה מחברים את שני האיברים, לא מחסרים.")),
        W("f'(x) = "+e1p+" · "+fac(a)+pw("x",n)+"e<sup>x</sup>",_("הכפלתם את שני האיברים במקום לחבר אותם."))
      ],
      steps:[
        S(_("כלל המכפלה"),_("(f·g)' = f'g + fg'. שני איברים, לא אחד — וזו הטעות הנפוצה ביותר כאן."),"(f·g)' = f'g + fg'"),
        S(_("מזהים את שני הגורמים"),"","f = "+fac(a)+pw("x",n)+"  ,  g = eˣ"),
        S(_("גוזרים כל אחד"),"","f' = "+fac(a*n)+pw("x",n-1)+"  ,  g' = eˣ"),
        S(_("מציבים"),"",ansP1)
      ],rule:"prod",hint:_("נגזרת של מכפלה נותנת סכום של שני איברים.")};
  }
  if(L===2){
    a=rnz(-6,6);b=rnz(-6,6);
    /* f = (ax+b)/x  →  f' = −b/x²   (כי ax/x = a קבוע) */
    while(b===0)b=rnz(-6,6);
    return {ask:_("גזרו את הפונקציה"),
      expr:'f(x) = <span class="frac"><span>'+coef(a,"x")+sgn(b)+'</span><span>x</span></span>',
      ans:W('f\'(x) = <span class="frac"><span>'+num(-b)+'</span><span>x<sup>2</sup></span></span>'),
      wrong:[
        W('f\'(x) = <span class="frac"><span>'+num(b)+'</span><span>x<sup>2</sup></span></span>',
          _("טעות סימן. בכלל המנה המונה הוא f′g פחות fg′ — הסדר קובע את הסימן.")),
        W('f\'(x) = <span class="frac"><span>'+num(a)+'</span><span>1</span></span>',
          _("גזרתם מונה ומכנה בנפרד וחילקתם. נגזרת של מנה אינה מנת הנגזרות.")),
        W('f\'(x) = <span class="frac"><span>'+num(-b)+'</span><span>x</span></span>',
          _("שכחתם להעלות את המכנה בריבוע. בכלל המנה המכנה הוא g²."))
      ],
      steps:[
        S(_("כלל המנה"),_("(f/g)' = (f'g − fg') ÷ g². הסדר במונה קריטי, והמכנה עולה בריבוע."),"(f/g)' = (f'g − fg') / g²"),
        S(_("מזהים"),"","f = "+coef(a,"x")+sgn(b)+"  ,  g = x"),
        S(_("גוזרים"),"","f' = "+num(a)+"  ,  g' = 1"),
        S(_("מציבים במונה"),"",num(a)+"·x − ("+coef(a,"x")+sgn(b)+")·1 = "+num(-b)),
        S(_("מחלקים ב-g²"),"",'f\'(x) = '+num(-b)+' / x²')
      ],rule:"quo",hint:_("כלל המנה: f′g פחות fg′, והכול חלקי g בריבוע.")};
  }
  /* רמה 3. קודם הייתה כאן תמיד x·ln x ועוד קבוע, והקבוע נעלם בגזירה —
     כלומר הדבר היחיד שהשתנה בשאלה היה הדבר היחיד שאינו משפיע על התשובה.
     עכשיו המקדם a והחזקה n נכנסים לתשובה, ושתי הצורות — מכפלה
     ומנה — מופיעות ברמה הזאת, כשם ששם הנושא מבטיח. */
  a=ri(1,5);n=ri(1,3);
  /* c·x^p לתצוגה, גם כשהחזקה שלילית וצריך שבר */
  var mx=function(c,p){
    if(c===0)return "0";
    if(p===0)return num(c);
    if(p>0)return coef(c,pw("x",p));
    return (c<0?"−":"")+'<span class="frac"><span>'+Math.abs(c)+'</span><span>'+pw("x",-p)+'</span></span>';
  };
  var lnt=function(c,p){var s=mx(c,p);return s==="1"?"ln x":s+"·ln x"};
  if(Math.random()<0.5){
    /* f = a·xⁿ·ln x  →  f' = a·n·xⁿ⁻¹·ln x + a·xⁿ⁻¹ */
    return {ask:_("גזרו את הפונקציה"),expr:"f(x) = "+mx(a,n)+"·ln x",
      ans:W("f'(x) = "+lnt(a*n,n-1)+" + "+mx(a,n-1)),
      wrong:[
        W("f'(x) = "+lnt(a*n,n-1),_("גזרתם רק את הגורם הראשון. בכלל המכפלה יש שני איברים.")),
        W("f'(x) = "+mx(a,n-1),_("גזרתם רק את הגורם השני. בכלל המכפלה יש שני איברים.")),
        W("f'(x) = "+mx(a*n,n-2),_("הכפלתם את הנגזרות במקום להשתמש בכלל המכפלה."))
      ],
      steps:[
        S(_("כלל המכפלה"),_("(f·g)' = f'g + fg'. שני איברים, לא אחד — וזו הטעות הנפוצה ביותר כאן."),"(f·g)' = f'g + fg'"),
        S(_("מזהים את שני הגורמים"),"","f = "+mx(a,n)+"  ,  g = ln x"),
        S(_("גוזרים כל אחד"),"","f' = "+mx(a*n,n-1)+"  ,  g' = 1/x"),
        S(_("מציבים"),"","f'(x) = "+lnt(a*n,n-1)+" + "+mx(a,n)+"·(1/x) = "+lnt(a*n,n-1)+" + "+mx(a,n-1))
      ],rule:"prod",hint:_("נגזרת של מכפלה נותנת סכום של שני איברים.")};
  }
  /* f = a·ln x / xⁿ  →  f' = a(1 − n·ln x) / xⁿ⁺¹ */
  var lnA=(a===1?"ln x":num(a)+"·ln x");
  var topR=num(a)+" − "+(a*n===1?"ln x":num(a*n)+"·ln x");
  var topW=(a*n===1?"ln x":num(a*n)+"·ln x")+" − "+num(a);
  var fq=function(t,bo){return '<span class="frac"><span>'+t+'</span><span>'+bo+'</span></span>'};
  return {ask:_("גזרו את הפונקציה"),
    expr:"f(x) = "+fq(lnA,pw("x",n)),
    ans:W("f'(x) = "+fq(topR,pw("x",n+1))),
    wrong:[
      W("f'(x) = "+fq(topW,pw("x",n+1)),
        _("טעות סימן. בכלל המנה המונה הוא f′g פחות fg′ — הסדר קובע את הסימן.")),
      W("f'(x) = "+fq(topR,pw("x",n)),
        _("שכחתם להעלות את המכנה בריבוע. בכלל המנה המכנה הוא g².")),
      W("f'(x) = "+fq(num(a),(n===1?"":num(n))+pw("x",n)),
        _("גזרתם מונה ומכנה בנפרד וחילקתם. נגזרת של מנה אינה מנת הנגזרות."))
    ],
    steps:[
      S(_("כלל המנה"),_("(f/g)' = (f'g − fg') ÷ g². הסדר במונה קריטי, והמכנה עולה בריבוע."),"(f/g)' = (f'g − fg') / g²"),
      S(_("מזהים"),"","f = "+lnA+"  ,  g = "+pw("x",n)),
      S(_("גוזרים"),"","f' = "+fq(num(a),"x")+"  ,  g' = "+mx(n,n-1)),
      S(_("מציבים במונה"),"",fq(num(a),"x")+"·"+pw("x",n)+" − "+lnA+"·"+mx(n,n-1)+" = "+mx(a,n-1)+"·(1 − "+(n===1?"ln x":num(n)+"·ln x")+")"),
      S(_("מחלקים ב-g²"),"","f'(x) = "+fq(topR,pw("x",n+1)))
    ],rule:"quo",hint:_("כלל המנה: f′g פחות fg′, והכול חלקי g בריבוע.")};
}

/* ---------- 5. נקודות קיצון ---------- */
function genExtrema(L){
  /* ---- רמה 4 ----
     ברמה 3 f″ קבועה ושונה מאפס, ולכן מבחן הנגזרת השנייה תמיד מכריע.
     כאן החזקה מוגרלת, וכשהיא 3 או 4 מתקיים f″(c)=0 — ההנחה של המבחן
     נשברת והוא אינו מכריע. שני הכיוונים מוגרלים: חזקה זוגית שיש בה
     קיצון, וחזקה אי־זוגית שאין. */
  if(L===4){
    var c4=rnz(-5,5),d4=rnz(-9,9),ke=pick([2,3,3,4,4]),ae=rnz(-4,4);
    var kind4=(ke%2===1)?"none":(ae>0?"min":"max");
    var oMin=_("מינימום מקומי"),oMax=_("מקסימום מקומי");
    var oNo=_("אינה נקודת קיצון — הפונקציה מונוטונית משני צדי הנקודה");
    var oUnk=_("אי אפשר לקבוע, מפני שמבחן הנגזרת השנייה אינו מכריע כאן");
    var mape=[["min",oMin],["max",oMax],["none",oNo]];
    var f2z=(ke>2);
    var whyUnk=f2z?_("נכון שהמבחן אינו מכריע, אבל אפשר בהחלט לקבוע — לפי סימן f′ משני צדי הנקודה.")
                  :_f("כאן f″ שווה {0}, שונה מאפס, ולכן המבחן דווקא כן מכריע.", num(2*ae));
    var whyOther=ke%2===1?_("החזקה אי־זוגית, ולכן בנגזרת נשאר מעריך זוגי: הסימן שלה זהה משני צדי הנקודה ואין קיצון.")
                         :_f("החזקה זוגית ו-a שווה {0}, ולכן f′ מחליפה סימן בנקודה — יש קיצון, וסימן a קובע את סוגו.", num(ae));
    return {ask:_f("בנקודה x = {0} מתאפסת הנגזרת. מהו סוג הנקודה?", num(c4)),
      expr:"f(x) = "+fac(ae)+pw("(x"+sgn(-c4)+")",ke)+sgn(d4),
      ans:W(mape.filter(function(o){return o[0]===kind4})[0][1]),
      wrong:mape.filter(function(o){return o[0]!==kind4}).map(function(o){return W(o[1],whyOther)}).concat([W(oUnk,whyUnk)]),
      steps:[
        S(_("הנגזרת הראשונה"),_("גוזרים בכלל השרשרת ורואים שהיא אכן מתאפסת בנקודה."),
          "f′(x) = "+num(ke*ae)+pw("(x"+sgn(-c4)+")",ke-1)),
        S(_("מה אומרת הנגזרת השנייה"),f2z?_("f″ מתאפסת בנקודה, ולכן מבחן הנגזרת השנייה אינו מכריע. ההנחה שלו — ש-f″ שונה מאפס — פשוט אינה מתקיימת כאן.")
                                          :_("f″ שונה מאפס בנקודה, ולכן המבחן כן מכריע: חיובית מינימום, שלילית מקסימום."),
          "f″("+num(c4)+") = "+(f2z?"0":num(2*ae))),
        S(_("בודקים את סימן f′ משני הצדדים"),
          ke%2===1?_("המעריך שנשאר בנגזרת זוגי, ולכן הביטוי חיובי משני הצדדים והסימן נקבע רק לפי המקדם: אין החלפת סימן ואין קיצון.")
                  :_("המעריך שנשאר בנגזרת אי־זוגי, ולכן הביטוי מחליף סימן — ויש קיצון."),
          mape.filter(function(o){return o[0]===kind4})[0][1])
      ],rule:"extr2",hint:_("f″ שמתאפסת אינה מוכיחה דבר. בודקים את סימן f′ משני צדי הנקודה.")};
  }
  var a,b,c,r1,r2,steps;
  if(L===1){
    a=rnz(-4,4);r1=rnz(-6,6);
    b=-2*a*r1;c=rnz(-9,9);
    return {ask:_("מצאו את שיעור ה-x של נקודת הקיצון"),expr:"f(x) = "+poly([a,b,c]),
      ans:W("x = "+num(r1)),
      wrong:[
        W("x = "+num(-r1),_("טעות סימן בפתרון f′(x)=0.")),
        W("x = "+num(c),_("האיבר החופשי לא משפיע על מיקום הקיצון — הוא רק מזיז את הגרף מעלה ומטה.")),
        W("x = "+num(b),_("זה המקדם של x, לא הפתרון של המשוואה."))
      ],
      steps:[
        S(_("קיצון נמצא היכן שהנגזרת מתאפסת"),_("זו ההגדרה: בנקודת קיצון המשיק אופקי, כלומר השיפוע אפס."),"f'(x) = 0"),
        S(_("גוזרים"),"","f'(x) = "+num(2*a)+"x"+sgn(b)),
        S(_("משווים לאפס"),"",num(2*a)+"x"+sgn(b)+" = 0"),
        S(_("פותרים"),"","x = "+num(-b)+" ÷ "+pn(2*a)+" = "+num(r1))
      ],rule:"extr",hint:_("גוזרים, משווים לאפס ופותרים. האיבר החופשי לא משתתף.")};
  }
  if(L===2){
    r1=rnz(-5,5);r2=rnz(-5,5);
    /* שלושה תנאים: r2===r1 מוחק קיצון אחד, r2===-r1 הופך את המסיח
       "טעות סימן" לאותה קבוצה עצמה, ו-r1+r2 אי-זוגי נותן B שאינו שלם. */
    while(r2===r1||r2===-r1||(r1+r2)%2!==0)r2=rnz(-5,5);
    var lo=Math.min(r1,r2),hi=Math.max(r1,r2);
    /* f' = 3(x−r1)(x−r2) = 3x² −3(r1+r2)x + 3r1r2 → f = x³ − 1.5(r1+r2)x² + 3r1r2 x */
    var B=-3*(r1+r2)/2, Cc=3*r1*r2;
    return {ask:_("כמה נקודות קיצון יש לפונקציה, ומהם שיעורי ה-x שלהן?"),
      expr:"f(x) = x<sup>3</sup>"+term(B,"x<sup>2</sup>")+term(Cc,"x"),
      ans:W("x = "+num(lo)+" , x = "+num(hi)),
      wrong:[
        W("x = "+num(-lo)+" , x = "+num(-hi),_("טעות סימן בפתרון המשוואה הריבועית.")),
        W("x = 0",_("הנחתם שהקיצון תמיד באפס. צריך לפתור את f′(x)=0.")),
        W("x = "+num(lo),_("מצאתם פתרון אחד. למשוואה ריבועית עם דיסקרימיננטה חיובית יש שניים."))
      ],
      steps:[
        S(_("גוזרים"),_("נגזרת של פונקציה ממעלה שלישית היא ריבועית, ולכן ייתכנו שתי נקודות קיצון."),
          "f'(x) = 3x²"+term(2*B,"x")+sgn(Cc)),
        S(_("משווים לאפס ומחלקים ב-3"),"","x²"+term(2*B/3,"x")+sgn(Cc/3)+" = 0"),
        S(_("מפרקים לגורמים"),"","(x"+sgn(-lo)+")(x"+sgn(-hi)+") = 0"),
        S(_("שני הפתרונות"),"","x = "+num(lo)+"   ,   x = "+num(hi))
      ],rule:"extr",hint:_("נגזרת של פונקציה ממעלה שלישית היא ריבועית — פותרים אותה ומקבלים עד שתי נקודות.")};
  }
  /* קודם הוצגה כאן תמיד פרבולה, ולכן "נקודת פיתול" ו"אין קיצון" לא היו
     התשובה אף פעם — התלמיד מחק אותן וניחש אחד לשניים. עכשיו מוגרלים
     ארבעה מצבים: מינימום, מקסימום, נקודה שהנגזרת מתאפסת בה בלי קיצון,
     ופונקציה מונוטונית שהנגזרת שלה אינה מתאפסת כלל. שתי האפשרויות
     האחרונות נוסחו כך שהן מוציאות זו את זו: האחת אומרת שהנגזרת כן
     מתאפסת ואין קיצון, והשנייה שהיא אינה מתאפסת בכלל. */
  var sh3=pick(["min","max","infl","mono"]),r3=rnz(-6,6),d3=rnz(-9,9),a3=pick([1,-1]),b3;
  var oMin3=_("מינימום"),oMax3=_("מקסימום");
  var oInf3=_("נקודת פיתול — הנגזרת מתאפסת שם, אך אין קיצון");
  var oNo3=_("אין נקודה כזאת — הנגזרת אינה מתאפסת באף נקודה");
  var ex3,dd1,dd2,ans3,why3,at3;
  if(sh3==="min"||sh3==="max"){
    a3=sh3==="min"?1:-1;
    ex3="f(x) = "+poly([a3,-2*a3*r3,d3]);
    dd1="f'(x) = "+num(2*a3)+"x"+sgn(-2*a3*r3);
    dd2="f''(x) = "+num(2*a3);
    ans3=sh3==="min"?oMin3:oMax3;at3="x = "+num(r3);
    why3=_f("f′ מתאפסת ב-x = {0}, ושם f″ = {1} — שונה מאפס, ולכן זו נקודת קיצון ולא נקודת פיתול.", num(r3), num(2*a3));
  }else if(sh3==="infl"){
    ex3="f(x) = "+fac(a3)+pw("(x"+sgn(-r3)+")",3)+sgn(d3);
    dd1="f'(x) = "+num(3*a3)+pw("(x"+sgn(-r3)+")",2);
    dd2="f''(x) = "+num(6*a3)+"(x"+sgn(-r3)+")";
    ans3=oInf3;at3="x = "+num(r3);
    why3=_f("f′ אמנם מתאפסת ב-x = {0}, אבל היא ריבוע ולכן אינה מחליפה שם סימן — אין קיצון. f″ כן מחליפה סימן, וזו נקודת פיתול.", num(r3));
  }else{
    b3=a3*ri(1,5);
    ex3="f(x) = "+fac(a3)+"x<sup>3</sup>"+term(b3,"x")+sgn(d3);
    dd1="f'(x) = "+num(3*a3)+"x<sup>2</sup>"+sgn(b3);
    dd2="f''(x) = "+num(6*a3)+"x";
    ans3=oNo3;at3="f′(x) ≠ 0";
    why3=_f("מ-f′(x) = 0 נובע x² = {0}, ולריבוע אין ערך שלילי. הנגזרת אינה מתאפסת באף נקודה, והפונקציה מונוטונית.", fr(-b3,3*a3).txt());
  }
  var map3=[["min",oMin3],["max",oMax3],["infl",oInf3],["mono",oNo3]];
  return {ask:_("מה סוג הנקודה שבה הנגזרת מתאפסת?"),expr:ex3,
    ans:W(ans3),
    wrong:map3.filter(function(o){return o[0]!==sh3}).map(function(o){
      return W(o[1],((o[0]==="min"||o[0]==="max")&&(sh3==="min"||sh3==="max"))
        ?_f("הסתכלו על סימן הנגזרת השנייה: f″ = {0}, והוא {1}.", num(2*a3), (sh3==="min"?_("חיובי ולכן מינימום"):_("שלילי ולכן מקסימום")))
        :why3)}),
    steps:[
      S(_("גוזרים פעמיים"),_("הנגזרת הראשונה מוצאת את המיקום, השנייה מספרת איזה סוג."),dd1+"   ,   "+dd2),
      S(_("קוראים את הסימן"),why3,at3),
      S(_("התשובה"),"",ans3)
    ],rule:"extr2",hint:_("קודם בודקים אם הנגזרת בכלל מתאפסת. רק אחר כך שואלים איזה סוג נקודה זו.")};
}

/* ---------- 6. אינטגרל לא מסוים ---------- */
function genIntegral(L){
  /* ---- רמה 4 ----
     הכיוון ההפוך: לא "אנטגרלו", אלא "איזו מהפונקציות היא קדומה".
     הכלי היחיד שמכריע הוא גזירה של כל מועמדת, והתלמיד צריך לבחור
     אותו בעצמו. המועמדות השגויות הן בדיוק התוצאות של אינטגרציה
     איבר־איבר, שהיא הטעות הנפוצה במכפלות. */
  if(L===4){
    var ai=ri(2,5),sh4=pick(["ln","xex","xcos","xsin"]);
    var fx4,Fx4,ws4;
    if(sh4==="ln"){
      fx4=fac(ai)+"ln x";
      Fx4=fac(ai)+"(x·ln x − x)";
      ws4=[W(fac(ai)+"x·ln x",_("גזרו את המועמדת הזאת ותקבלו a(ln x + 1). חסר בה החיסור של x.")),
           W('<span class="frac"><span>'+num(ai)+'</span><span>x</span></span>',_("זו הנגזרת של a·ln x, ולא פונקציה קדומה שלה.")),
           W(fac(ai)+'<span class="frac"><span>(ln x)<sup>2</sup></span><span>2</span></span>',_("הפעלתם כלל חזקה על ln x. גזירה של הביטוי הזה נותנת a·ln x חלקי x."))];
    }else if(sh4==="xex"){
      fx4=fac(ai)+"x·e<sup>x</sup>";
      Fx4=fac(ai)+"(x − 1)e<sup>x</sup>";
      ws4=[W(fac(ai)+'<span class="frac"><span>x<sup>2</sup></span><span>2</span></span>e<sup>x</sup>',_("אנטגרלתם כל גורם בנפרד והכפלתם. אינטגרל של מכפלה אינו מכפלת האינטגרלים.")),
           W(fac(ai)+"x·e<sup>x</sup>",_("זו הפונקציה עצמה. גזירה שלה נותנת a(x+1)eˣ.")),
           W(fac(ai)+"(x + 1)e<sup>x</sup>",_("טעות סימן. גזרו ותקבלו a(x+2)eˣ."))];
    }else if(sh4==="xcos"){
      fx4=fac(ai)+"x·cos x";
      Fx4=fac(ai)+"(cos x + x·sin x)";
      ws4=[W(fac(ai)+"(sin x − x·cos x)",_("זו פונקציה קדומה של a·x·sin x, ולא של a·x·cos x.")),
           W(fac(ai)+'<span class="frac"><span>x<sup>2</sup></span><span>2</span></span>sin x',_("אנטגרלתם כל גורם בנפרד והכפלתם. אינטגרל של מכפלה אינו מכפלת האינטגרלים.")),
           W(fac(ai)+"sin x",_("התעלמתם מהגורם x. גזירה נותנת a·cos x בלבד."))];
    }else{
      fx4=fac(ai)+"x·sin x";
      Fx4=fac(ai)+"(sin x − x·cos x)";
      ws4=[W(fac(ai)+"(cos x + x·sin x)",_("זו פונקציה קדומה של a·x·cos x, ולא של a·x·sin x.")),
           W(fac(-ai)+'<span class="frac"><span>x<sup>2</sup></span><span>2</span></span>cos x',_("אנטגרלתם כל גורם בנפרד והכפלתם. אינטגרל של מכפלה אינו מכפלת האינטגרלים.")),
           W(fac(-ai)+"cos x",_("התעלמתם מהגורם x. גזירה נותנת a·sin x בלבד."))];
    }
    return {ask:_("איזו מהפונקציות היא פונקציה קדומה של f?"),expr:"f(x) = "+fx4,
      ans:W(Fx4),wrong:ws4,
      steps:[
        S(_("לא צריך לדעת לאנטגרל כדי לענות"),_("פונקציה קדומה מוגדרת בדיוק כך: הנגזרת שלה היא f. אז גוזרים כל מועמדת ובודקים מי מחזירה את f."),
          "F′(x) = f(x)"),
        S(_("גוזרים את המועמדת הנכונה"),_("כלל המכפלה נותן שני איברים, ואחד מהם מבטל את השני."),
          "("+Fx4+")′ = "+fx4),
        S(_("המסקנה"),"",Fx4)
      ],rule:"intbasic",hint:_("במקום לאנטגרל — גזרו כל אפשרות ובדקו מי מחזירה בדיוק את f.")};
  }
  var a,n,b,steps;
  if(L===1){
    a=rnz(-6,6);n=ri(1,5);b=rnz(-8,8);
    var co=fr(a,n+1);
    /* מקדם שהוא שלם נכתב כמקדם ולא כשבר, ו-1 לא נכתב בכלל */
    var coH=co.isInt()?fac(co.n):co.html();
    return {ask:_("חשבו את האינטגרל"),expr:"∫ ("+fac(a)+pw("x",n)+sgn(b)+") dx",
      ans:W(coH+pw("x",n+1)+term(b,"x")+" + C"),
      wrong:[
        W(coH+pw("x",n+1)+term(b,"x"),_("שכחתם את קבוע האינטגרציה. באינטגרל לא מסוים חייבים +C.")),
        W(fac(a)+pw("x",n+1)+term(b,"x")+" + C",_("העליתם את החזקה אבל לא חילקתם בחזקה החדשה.")),
        W((n===1?num(a):num(a*n)+pw("x",n-1))+sgn(b)+" + C",_("גזרתם במקום לאנטגרל. הפעולות הפוכות זו לזו."))
      ],
      steps:[
        S(_("כלל האינטגרל של חזקה"),_("∫xⁿ dx = xⁿ⁺¹ ÷ (n+1) + C — החזקה עולה באחת ומחלקים בחזקה החדשה."),
          "∫xⁿ dx = xⁿ⁺¹/(n+1) + C"),

        S(_("לא שוכחים את C"),_("אינטגרל לא מסוים מייצג משפחה שלמה של פונקציות, ולכן תמיד מוסיפים קבוע."),
          coH+pw("x",n+1)+term(b,"x")+" + C")
      ],rule:"intpow",hint:_("החזקה עולה באחת ומחלקים בה. ותמיד +C.")};
  }
  if(L===2){
    a=rnz(-5,5);
    var k=pick(["exp","inv","sin","cos"]);
    var f,F,ws;
    /* חצי המקדם: כשהוא שלם הוא מקדם ולא שבר, ו-±1 אינו נכתב כמספר */
    var hf=fr(a,2),hfH=hf.isInt()?fac(hf.n):hf.html();
    if(k==="exp"){f=fac(a)+"e<sup>x</sup>";F=fac(a)+"e<sup>x</sup> + C";
      ws=[W(fac(a)+"e<sup>x</sup>",_("חסר קבוע האינטגרציה.")),
          W(hfH+"e<sup>2x</sup> + C",_("הוספתם חזקה שלא קיימת. eˣ הוא האינטגרל של עצמו.")),
          W(fac(a)+"x·e<sup>x</sup> + C",_("התייחסתם ל-eˣ כמו לחזקה של x."))];}
    else if(k==="inv"){f='<span class="frac"><span>'+num(a)+'</span><span>x</span></span>';F=fac(a)+"ln|x| + C";
      ws=[W(fac(a)+"ln x + C",_("הערך המוחלט חשוב: ln מוגדר רק לחיוביים, והאינטגרל תקף גם לשליליים.")),
          W(hfH+"x<sup>−2</sup> + C",_("הפעלתם את כלל החזקה. הוא לא תקף כאשר החזקה היא מינוס אחת.")),
          W('<span class="frac"><span>'+num(-a)+'</span><span>x<sup>2</sup></span></span> + C',_("גזרתם במקום לאנטגרל."))];}
    else if(k==="sin"){f=fac(a)+"sin x";F=fac(-a)+"cos x + C";
      ws=[W(fac(a)+"cos x + C",_("חסר המינוס. האינטגרל של סינוס הוא מינוס קוסינוס.")),
          W(fac(a)+"sin x + C",_("לא ביצעתם אינטגרציה.")),
          W(fac(a)+"cos x",_("גם המינוס וגם ה-C חסרים."))];}
    else{f=fac(a)+"cos x";F=fac(a)+"sin x + C";
      ws=[W(fac(-a)+"sin x + C",_("הוספתם מינוס. המינוס שייך לאינטגרל של סינוס, לא של קוסינוס.")),
          W(fac(-a)+"cos x + C",_("זו הנגזרת, לא האינטגרל.")),
          W(fac(a)+"sin x",_("חסר קבוע האינטגרציה."))];}
    return {ask:_("חשבו את האינטגרל"),expr:"∫ "+f+" dx",ans:W(F),wrong:ws,
      steps:[
        S(_("אינטגרל הוא הפעולה ההפוכה לגזירה"),_("שואלים: איזו פונקציה גוזרת למה שכתוב כאן?"),
          k==="exp"?"(eˣ)' = eˣ":k==="inv"?"(ln|x|)' = 1/x":k==="sin"?"(−cos x)' = sin x":"(sin x)' = cos x"),
        S(_("המקדם נשאר"),"","∫c·f = c·∫f"),
        S(_("ומוסיפים C"),"",F)
      ],rule:"intbasic",hint:_("שואלים איזו פונקציה גוזרת לזה, ולא שוכחים את הקבוע.")};
  }
  a=rnz(2,5);b=rnz(-8,8);n=ri(2,4);
  return {ask:_("חשבו את האינטגרל"),expr:"∫ ("+num(a)+"x"+sgn(b)+")<sup>"+n+"</sup> dx",
    ans:W('<span class="frac"><span>('+num(a)+'x'+sgn(b)+')<sup>'+(n+1)+'</sup></span><span>'+(a*(n+1))+'</span></span> + C'),
    wrong:[
      W('<span class="frac"><span>('+num(a)+'x'+sgn(b)+')<sup>'+(n+1)+'</sup></span><span>'+(n+1)+'</span></span> + C',
        _f("חילקתם רק בחזקה החדשה ושכחתם לחלק גם בנגזרת הפנימית {0}.", num(a))),
      W("("+num(a)+"x"+sgn(b)+")<sup>"+(n+1)+"</sup> + C",_("לא חילקתם בכלל.")),
      W(num(a*n)+pw("("+num(a)+"x"+sgn(b)+")",n-1)+" + C",_("גזרתם במקום לאנטגרל."))
    ],
    steps:[
      S(_("הצבה"),_f("מסמנים u = {0}x{1}, ואז du = {2}dx, כלומר dx = du/{3}.", num(a), sgn(b), num(a), num(a)),
        "u = "+num(a)+"x"+sgn(b)),
      S(_("מחליפים משתנה"),"","∫ uⁿ du / "+num(a)),
      S(_("מאנטגרלים"),"","u<sup>"+(n+1)+"</sup> / ("+num(a)+"·"+(n+1)+")"),
      S(_("חוזרים ל-x"),"","("+num(a)+"x"+sgn(b)+")<sup>"+(n+1)+"</sup> / "+(a*(n+1))+" + C")
    ],rule:"intsub",hint:_("מחלקים גם בחזקה החדשה וגם בנגזרת הפנימית.")};
}

/* ---------- 7. אינטגרל מסוים ושטח ---------- */
function genDefInt(L){
  /* ---- רמה 4 ----
     משפט ניוטון־לייבניץ דורש רציפות בכל הקטע. ברמות 1–3 התנאי תמיד
     התקיים ולכן מעולם לא נבדק. כאן מוגרל גם קטע שיש בתוכו קוטב,
     ואז ההצבה הפורמלית נותנת מספר — לפעמים אפילו שלילי לפונקציה
     חיובית — והתשובה הנכונה היא שהמשפט אינו חל. */
  if(L===4){
    var cs4=pick(["ok","sq","inv"]),m4=ri(1,3),n4=m4+ri(1,3),kk4=ri(1,3),sg4=pick([1,-1]);
    var badTxt=_("אסור — הפונקציה אינה רציפה ב-x = 0 שבתוך הקטע, והאינטגרל מתבדר");
    var condStep=_("קודם בודקים את תנאי המשפט");
    var condWhy=_("ניוטון־לייבניץ דורש שהפונקציה תהיה רציפה בכל הקטע הסגור. בלי התנאי הזה אין למשפט תוקף, גם אם ההצבה נותנת מספר יפה.");
    if(cs4==="ok"){
      if(n4===2*m4)n4=n4+1;
      var c4=m4*n4*kk4,lo4=sg4>0?m4:-n4,hi4=sg4>0?n4:-m4;
      var val4=kk4*(n4-m4),only4=-c4/hi4;
      return {ask:_("האם מותר להפעיל כאן את משפט ניוטון־לייבניץ, ומה התוצאה?"),
        expr:"∫<sub>"+num(lo4)+"</sub><sup>"+num(hi4)+"</sup> "+'<span class="frac"><span>'+c4+'</span><span>x<sup>2</sup></span></span>'+" dx",
        ans:W(_f("מותר — הפונקציה רציפה בכל הקטע, והתוצאה {0}", num(val4))),
        wrong:[
          W(badTxt,_f("אפס אינו בקטע שבין {0} ל-{1}, ולכן הפונקציה רציפה כאן לכל אורכו.", num(lo4), num(hi4))),
          W(_f("מותר, והתוצאה {0}", num(-val4)),_("הפכתם את סדר הגבולות. מציבים את הגבול העליון ומחסרים את התחתון.")),
          W(_f("מותר, והתוצאה {0}", num(only4)),_("הצבתם רק בגבול העליון ושכחתם לחסר את התחתון."))
        ],
        steps:[
          S(condStep,condWhy,_f("הקטע: מ-{0} עד {1}   ,   נקודת אי־הרציפות: x = 0", num(lo4), num(hi4))),
          S(_("כאן התנאי מתקיים"),_("אפס נמצא מחוץ לקטע, ולכן מותר להמשיך כרגיל."),"F(x) = −"+c4+"/x"),
          S(_("מציבים"),"","F("+num(hi4)+") − F("+num(lo4)+") = "+num(val4))
        ],rule:"defint",hint:_("לפני החישוב בודקים אם הפונקציה רציפה בכל הקטע. אחרת המשפט אינו חל.")};
    }
    var h4=ri(1,3);
    if(cs4==="sq"){
      var cq=h4*kk4;
      return {ask:_("האם מותר להפעיל כאן את משפט ניוטון־לייבניץ, ומה התוצאה?"),
        expr:"∫<sub>"+num(-h4)+"</sub><sup>"+h4+"</sup> "+'<span class="frac"><span>'+cq+'</span><span>x<sup>2</sup></span></span>'+" dx",
        ans:W(badTxt),
        wrong:[
          W(_f("מותר, והתוצאה {0}", num(-2*cq/h4)),_("זו ההצבה הפורמלית, והיא נותנת מספר שלילי לפונקציה חיובית — סימן ודאי שהמשפט אינו חל כאן.")),
          W(_("מותר, והתוצאה 0 — הפונקציה זוגית והקטע סימטרי"),_("סימטריה עוזרת רק אחרי שידוע שהאינטגרל קיים. כאן הוא מתבדר, ואין מה לחצות לשניים.")),
          W(_f("מותר, והתוצאה {0}", num(2*cq/h4)),_("גם תיקון הסימן אינו עוזר: אין כאן ערך סופי כלל."))
        ],
        steps:[
          S(condStep,condWhy,_f("הקטע: מ-{0} עד {1}   ,   נקודת אי־הרציפות: x = 0", num(-h4), num(h4))),
          S(_("התנאי נשבר"),_("אפס נמצא בתוך הקטע, והפונקציה אינה חסומה בסביבתו."),"x = 0"),
          S(_("מה הייתה נותנת ההצבה"),_("מספר שלילי, לפונקציה שחיובית בכל נקודה. תוצאה כזאת אינה יכולה להיות שטח, והיא ההוכחה שהמשפט לא חל."),
            num(-2*cq/h4))
        ],rule:"defint",hint:_("קוטב בתוך הקטע פוסל את המשפט. ההצבה עדיין נותנת מספר — והוא חסר משמעות.")};
    }
    var ci=ri(1,4);
    return {ask:_("האם מותר להפעיל כאן את משפט ניוטון־לייבניץ, ומה התוצאה?"),
      expr:"∫<sub>"+num(-h4)+"</sub><sup>"+h4+"</sup> "+'<span class="frac"><span>'+ci+'</span><span>x</span></span>'+" dx",
      ans:W(badTxt),
      wrong:[
        W(_("מותר, והתוצאה 0 — הפונקציה אי־זוגית והקטע סימטרי"),_("טיעון הסימטריה תקף רק לפונקציה שהאינטגרל שלה קיים. כאן שני החצאים מתבדרים, ואינסוף פחות אינסוף אינו אפס.")),
        W(_("אסור — אבל רק משום שהקטע סימטרי"),_("סימטריה אינה פוסלת דבר. מה שפוסל כאן הוא אי־הרציפות באפס.")),
        W(_("מותר — למשפט די בכך שקיימת פונקציה קדומה"),_("ln|x| אכן קדומה בכל אחד מחצאי הקטע בנפרד, אבל לא בקטע כולו: היא אינה מוגדרת באפס."))
      ],
      steps:[
        S(condStep,condWhy,_f("הקטע: מ-{0} עד {1}   ,   נקודת אי־הרציפות: x = 0", num(-h4), num(h4))),
        S(_("התנאי נשבר"),_("אפס נמצא בתוך הקטע, והפונקציה אינה חסומה בסביבתו."),"x = 0"),
        S(_("למה אי־זוגיות אינה מצילה"),_("כל אחד משני החצאים מתבדר בנפרד. אי־זוגיות מקזזת ערכים סופיים, ואין כאן כאלה."),_("מתבדר"))
      ],rule:"defint",hint:_("קוטב בתוך הקטע פוסל את המשפט. ההצבה עדיין נותנת מספר — והוא חסר משמעות.")};
  }
  var a,b,n,lo,hi,steps;
  if(L===1){
    /* המקדם היה תמיד חיובי, ולכן האינטגרל יצא תמיד חיובי והמסיח
       "הפכתם את סדר הגבולות" היה היחיד השלילי — סימן היכר שאפשר
       למחוק לפיו בלי לחשב. עכשיו הסימן מוגרל. */
    n=ri(1,3);a=rnz(-4,4);lo=ri(0,2);hi=lo+ri(1,3);
    var F=function(x){return a*Math.pow(x,n+1)/(n+1)};
    var val=F(hi)-F(lo);
    if(Math.round(val*6)!==val*6){a=(n+1)*(a<0?-1:1);val=F(hi)-F(lo)}
    val=a*(Math.pow(hi,n+1)-Math.pow(lo,n+1))/(n+1);
    return {ask:_("חשבו את האינטגרל המסוים"),
      expr:"∫<sub>"+lo+"</sub><sup>"+hi+"</sup> "+fac(a)+pw("x",n)+" dx",
      ans:W(num(Math.round(val*1000)/1000)),
      wrong:[
        W(num(Math.round((F(lo)-F(hi))*1000)/1000),_("הפכתם את סדר הגבולות. מציבים את הגבול העליון פחות התחתון.")),
        W(num(Math.round(F(hi)*1000)/1000),_("הצבתם רק את הגבול העליון ושכחתם לחסר את התחתון.")),
        W(num(a*(Math.pow(hi,n)-Math.pow(lo,n))),_("הצבתם בפונקציה המקורית במקום בפונקציה הקדומה."))
      ],
      steps:[
        S(_("מוצאים פונקציה קדומה"),_("באינטגרל מסוים אין צורך ב-C — הוא מתבטל בחיסור."),
          "F(x) = "+fr(a,n+1).html()+pw("x",n+1)),
        S(_("משפט ניוטון־לייבניץ"),_("מציבים את הגבול העליון ומחסרים את התחתון."),"F("+hi+") − F("+lo+")"),
        S(_("מציבים"),"",num(Math.round(F(hi)*1000)/1000)+" − "+pn(Math.round(F(lo)*1000)/1000)),
        S(_("מחשבים"),"",num(Math.round(val*1000)/1000))
      ],rule:"defint",hint:_("פונקציה קדומה, ואז עליון פחות תחתון.")};
  }
  if(L===2){
    a=ri(1,4);hi=ri(2,5);
    /* שטח מתחת ל-y = a·x בין 0 ל-hi — משולש, כדי שאפשר לבדוק גיאומטרית */
    var area=a*hi*hi/2;
    return {ask:_f("חשבו את השטח הכלוא בין הפונקציה, ציר ה-x והישרים x=0 ו-x={0}", hi),
      expr:"y = "+coef(a,"x"),
      ans:W(num(area)),
      wrong:[
        W(num(a*hi),_("זה ערך הפונקציה בנקודה, לא השטח.")),
        W(num(a*hi*hi),_("שכחתם לחלק ב-2 — האינטגרל של ax הוא ax²/2.")),
        W(num(hi*hi/2),_f("איבדתם את המקדם {0}.", a))
      ],
      steps:[
        S(_("שטח הוא אינטגרל מסוים"),_("כשהפונקציה חיובית בקטע, השטח שווה בדיוק לאינטגרל."),
          "S = ∫<sub>0</sub><sup>"+hi+"</sup> "+coef(a,"x")+" dx"),
        S(_("פונקציה קדומה"),"","F(x) = "+fr(a,2).html()+"x²"),
        S(_("מציבים גבולות"),"","F("+hi+") − F(0) = "+num(area)+" − 0"),
        S(_("בדיקה גיאומטרית"),_f("הצורה כאן היא משולש עם בסיס {0} וגובה {1}, ושטחו {2} — מתאים.", hi, num(a*hi), num(area)),
          "S = "+num(area))
      ],rule:"area",hint:_("שטח מתחת לגרף הוא האינטגרל המסוים בין הגבולות.")};
  }
  /* רמה 3 — סימטריה. קודם הופיעה כאן רק פונקציה אי־זוגית, ולכן
     התשובה הייתה 0 בכל הגרלה: הכלל שהרמה מלמדת הודגם רק בכיוון אחד,
     והתלמיד יכול היה לענות 0 בלי להסתכל בפונקציה. עכשיו מוגרל גם
     המקרה הזוגי, שבו האינטגרל דווקא כפול מחצי הקטע. */
  var even=Math.random()<0.5;
  if(even){
    /* ∫ מ-−h עד h של a·x² שווה 2a·h³/3. a כפולה של 3 כדי שהתוצאה שלמה. */
    hi=ri(1,3);a=3*ri(1,3);
    var ev=2*a*Math.pow(hi,3)/3;
    return {ask:_("חשבו את האינטגרל המסוים"),
      expr:"∫<sub>"+num(-hi)+"</sub><sup>"+hi+"</sup> "+num(a)+"x<sup>2</sup> dx",
      ans:W(num(ev)),
      wrong:[
        W("0",_("x² היא פונקציה זוגית, לא אי־זוגית. רק אי־זוגית מתאפסת בקטע סימטרי — זוגית מכפילה את חצי הקטע פי שתיים.")),
        W(num(ev/2),_("חישבתם רק את החלק החיובי. בפונקציה זוגית שני החצאים שווים, ולכן צריך להכפיל פי שתיים.")),
        W(num(2*a*Math.pow(hi,3)),_("שכחתם לחלק ב-3. הפונקציה הקדומה של x² היא x³ חלקי 3."))
      ],
      steps:[
        S(_("שמים לב לסימטריה"),_("x² היא פונקציה זוגית: f(−x) = f(x). הקטע סימטרי סביב אפס."),
          "f(−x) = f(x)"),
        S(_("מה זה אומר"),_("שני החצאים שווים, ולכן מספיק לחשב אחד ולהכפיל פי שתיים."),
          "∫<sub>−h</sub><sup>h</sup> = 2·∫<sub>0</sub><sup>h</sup>"),
        S(_("מחשבים"),"","F(x) = "+fr(a,3).html()+"x³  →  2·F("+hi+") = "+num(ev))
      ],rule:"defint",hint:_("פונקציה זוגית בקטע סימטרי — פעמיים האינטגרל על חצי הקטע.")};
  }
  /* אינטגרל של פונקציה אי־זוגית בקטע סימטרי מתאפס */
  /* a נבחר כך שכל הערכים שלמים, ו-h מדלג על 2 כשהחזקה 1 — שם שניים
     מהמסיחים היו יוצאים שווים זה לזה והשאלה הייתה מציגה שלוש אפשרויות. */
  n=pick([1,3]);
  hi=(n===1?pick([1,3]):ri(1,3));
  a=(n===1?2*ri(1,3):4*ri(1,2));
  var half=a*Math.pow(hi,n+1)/(n+1);
  return {ask:_("חשבו את האינטגרל המסוים"),
    expr:"∫<sub>"+num(-hi)+"</sub><sup>"+hi+"</sup> "+num(a)+pw("x",n)+" dx",
    ans:W("0"),
    wrong:[
      W(num(half),_("חישבתם רק את החלק החיובי. בקטע סימטרי החלק השלילי מבטל אותו.")),
      W(num(2*a*Math.pow(hi,n)),_("הצבתם בפונקציה המקורית במקום בפונקציה הקדומה.")),
      W(num(2*half),_("חיברתם את שני החלקים במקום לחסר."))
    ],
    steps:[
      S(_("שמים לב לסימטריה"),_f("{0} היא פונקציה אי־זוגית: f(−x) = −f(x). הקטע סימטרי סביב אפס.", "x"+(n===1?"":"³")),
        "f(−x) = −f(x)"),
      S(_("מה זה אומר"),_("כל תרומה מצד ימין מתקזזת בדיוק מול צד שמאל."),_("∫ מקטע סימטרי = 0")),
      S(_("בדיקה בחישוב"),"","F(x) = "+fr(a,n+1).html()+pw("x",n+1)+"  →  F("+hi+") − F("+num(-hi)+") = 0")
    ],rule:"defint",hint:_("פונקציה אי־זוגית בקטע סימטרי סביב אפס — האינטגרל מתאפס.")};
}

/* ---------- 8. פעולות במטריצות ---------- */
function genMatOps(L){
  /* ---- רמה 4 ----
     רמות 1–3 עוסקות כולן בחשבון על מטריצות 2×2, ולכן תנאי ההגדרה של
     כפל מטריצות אינו נבדק בהן מעולם. כאן הגדלים מוגרלים, וארבעת
     המקרים — רק AB מוגדרת, שתיהן בגדלים שונים, שתיהן באותו גודל,
     ואף אחת — ממצים וזרים זה לזה. */
  if(L===4){
    var cs4=pick(["ab","both","same","none"]),m4=ri(2,5),n4=ri(2,5),p4=ri(2,5),q4=ri(2,5),g4=0;
    while(m4===n4&&g4++<40)n4=ri(2,5);
    if(m4===n4)n4=(m4===5?2:m4+1);
    if(cs4==="ab"){p4=n4;q4=ri(2,5);while(q4===m4)q4=ri(2,5)}
    else if(cs4==="both"){p4=n4;q4=m4}
    else if(cs4==="same"){n4=m4;p4=m4;q4=m4}
    else{p4=ri(2,5);while(p4===n4)p4=ri(2,5);q4=ri(2,5);while(q4===m4)q4=ri(2,5)}
    var oAb=_f("רק AB מוגדרת, והיא בגודל {0}×{1}. BA אינה מוגדרת.", m4, q4);
    var oBoth=_f("שתיהן מוגדרות אך בגדלים שונים: AB היא {0}×{1} ו-BA היא {2}×{3}.", m4, q4, p4, n4);
    var oSame=_f("שתיהן מוגדרות ושתיהן בגודל {0}×{1} — ובכל זאת אין הכרח שיהיו שוות.", m4, q4);
    var oNone=_("אף אחת משתי המכפלות אינה מוגדרת.");
    var map4=[["ab",oAb],["both",oBoth],["same",oSame],["none",oNone]];
    var why4=_f("מכפלה מוגדרת רק כשמספר העמודות של השמאלית שווה למספר השורות של הימנית. כאן: A היא {0}×{1} ו-B היא {2}×{3}.", m4, n4, p4, q4);
    return {ask:_f("A היא מטריצה בגודל {0}×{1}, ו-B בגודל {2}×{3}. מה נכון לגבי AB ו-BA?", m4, n4, p4, q4),
      expr:"A<sub>"+m4+"×"+n4+"</sub>  ,  B<sub>"+p4+"×"+q4+"</sub>",
      ans:W(map4.filter(function(o){return o[0]===cs4})[0][1]),
      wrong:map4.filter(function(o){return o[0]!==cs4}).map(function(o){return W(o[1],why4)}),
      steps:[
        S(_("תנאי ההגדרה של כפל מטריצות"),_("העמודות של השמאלית חייבות להתאים לשורות של הימנית. אחרת אין מה להכפיל במה."),
          "(m×n)·(n×q) = m×q"),
        S(_("בודקים את AB"),"",m4+"×"+n4+"  ·  "+p4+"×"+q4+"  →  "+(n4===p4?m4+"×"+q4:_("אינה מוגדרת"))),
        S(_("בודקים את BA"),_("סדר הכפל אינו סימטרי, ולכן צריך בדיקה נפרדת."),
          p4+"×"+q4+"  ·  "+m4+"×"+n4+"  →  "+(q4===m4?p4+"×"+n4:_("אינה מוגדרת"))),
        S(_("המסקנה"),"",map4.filter(function(o){return o[0]===cs4})[0][1])
      ],rule:"matmul",hint:_("בודקים בנפרד לכל סדר: העמודות של הראשונה מול השורות של השנייה.")};
  }
  var A,B,i,j,steps;
  function m2(){return [[rnz(-6,6),rnz(-6,6)],[rnz(-6,6),rnz(-6,6)]]}
  if(L===1){
    A=m2();B=m2();
    var S1=[[A[0][0]+B[0][0],A[0][1]+B[0][1]],[A[1][0]+B[1][0],A[1][1]+B[1][1]]];
    return {ask:_("חשבו את סכום המטריצות"),expr:mat(A)+" + "+mat(B),ans:W(mat(S1)),
      wrong:[
        W(mat([[A[0][0]-B[0][0],A[0][1]-B[0][1]],[A[1][0]-B[1][0],A[1][1]-B[1][1]]]),_("חיסרתם במקום לחבר.")),
        W(mat([[A[0][0]+B[0][0],A[0][1]+B[1][0]],[A[1][0]+B[0][1],A[1][1]+B[1][1]]]),_("החלפתם אינדקסים באלכסון. בחיבור כל איבר מתחבר עם האיבר שבאותו מקום בדיוק.")),
        W(mat([[A[0][0]*B[0][0],A[0][1]*B[0][1]],[A[1][0]*B[1][0],A[1][1]*B[1][1]]]),_("הכפלתם איבר באיבר. זו לא הפעולה שנדרשה, וגם לא כפל מטריצות."))
      ],
      steps:[
        S(_("חיבור מטריצות הוא איבר־איבר"),_("זו הפעולה הפשוטה מבין השתיים: כל איבר מתחבר עם זה שבאותו מקום."),
          "(A+B)ᵢⱼ = Aᵢⱼ + Bᵢⱼ"),
        S(_("שורה ראשונה"),"",num(A[0][0])+" + "+pn(B[0][0])+" = "+num(A[0][0]+B[0][0])+"   ,   "+num(A[0][1])+" + "+pn(B[0][1])+" = "+num(A[0][1]+B[0][1])),
        S(_("שורה שנייה"),"",num(A[1][0])+" + "+pn(B[1][0])+" = "+num(A[1][0]+B[1][0])+"   ,   "+num(A[1][1])+" + "+pn(B[1][1])+" = "+num(A[1][1]+B[1][1])),

        W(mat([[A[0][0]+k,A[0][1]+k],[A[1][0]+k,A[1][1]+k]]),_("חיברתם את הסקלר לכל איבר במקום להכפיל בו.")),
        W(mat([[A[0][0]*k,A[0][1]*k],[A[1][0],A[1][1]]]),_("הכפלתם רק את השורה הראשונה."))
      ],
      steps:[
        S(_("כפל בסקלר"),_("כל איבר במטריצה מוכפל במספר — בלי יוצאים מן הכלל."),"(cA)ᵢⱼ = c·Aᵢⱼ"),
        S(_("מכפילים"),"",num(k)+"·"+pn(A[0][0])+" = "+num(A[0][0]*k)+"   ,   "+num(k)+"·"+pn(A[0][1])+" = "+num(A[0][1]*k)),
        S(_("וכך בשורה השנייה"),"",num(k)+"·"+pn(A[1][0])+" = "+num(A[1][0]*k)+"   ,   "+num(k)+"·"+pn(A[1][1])+" = "+num(A[1][1]*k)),
        S(_("התוצאה"),"",mat(K))

  }
  A=[[rnz(-4,4),rnz(-4,4)],[rnz(-4,4),rnz(-4,4)]];
  B=[[rnz(-4,4),rnz(-4,4)],[rnz(-4,4),rnz(-4,4)]];
  var P=[[A[0][0]*B[0][0]+A[0][1]*B[1][0], A[0][0]*B[0][1]+A[0][1]*B[1][1]],
         [A[1][0]*B[0][0]+A[1][1]*B[1][0], A[1][0]*B[0][1]+A[1][1]*B[1][1]]];

      W(mat([[P[0][0],P[1][0]],[P[0][1],P[1][1]]]),_("שחלפתם את התוצאה — החלפתם בין שורות לעמודות."))
    ],
    steps:[
      S(_("כל איבר הוא שורה כפול עמודה"),_("האיבר במקום (i,j) נבנה משורה i של A ומעמודה j של B — לא מהאיברים שבאותו מקום."),
        "Cᵢⱼ = Σ Aᵢₖ·Bₖⱼ"),
      S(_("האיבר בפינה השמאלית העליונה"),"",num(A[0][0])+"·"+pn(B[0][0])+" + "+num(A[0][1])+"·"+pn(B[1][0])+" = "+num(P[0][0])),
      S(_("וכך שאר האיברים"),"",num(P[0][1])+"  ,  "+num(P[1][0])+"  ,  "+num(P[1][1])),
      S(_("התוצאה"),"",mat(P))
