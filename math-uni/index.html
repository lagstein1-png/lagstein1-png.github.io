      steps:[
        S(_("שייכות — איבר בתוך קבוצה"),_("הסימן ∈ אומר שמה שעומד משמאלו הוא אחד הדברים הכתובים בין הסוגריים."),""),
        S(_("הכלה — קבוצה בתוך קבוצה"),_("הסימן ⊆ אומר שכל איבר של הקבוצה שמשמאלו נמצא גם בקבוצה שמימינו. שני הצדדים חייבים להיות קבוצות."),""),
        S(_("שני כללים שתמיד נכונים"),_("הקבוצה הריקה מוכלת בכל קבוצה, וכל קבוצה מוכלת בעצמה."),"∅ ⊆ A ⊆ A"),
        S(_("המסקנה"),"",okTx)
      ],rule:"sets",hint:_("בודקים מי עומד משמאל לסימן: מספר בודד — שייכות, ∈. קבוצה — הכלה, ⊆.")};
  }
  /* ---- רמה 2 ----
     שתי נוסחאות ספירה מוגרלות: הכלה והדחה, שעמדה קודם
     ברמה 1, והמשלים שעמד כאן מלכתחילה. שתיהן ספירה
     לפי נוסחה, ולכן הן באותה רמה. */
  if(L===2){
    if(Math.random()<0.5){
      A=ri(10,30);B=ri(10,30);AB=ri(2,Math.min(A,B)-1);
      return {ask:_f("בקבוצה A יש {0} איברים, ב-B יש {1}, ובחיתוך {2}. כמה איברים באיחוד?", A, B, AB),
        expr:"|A ∪ B| = ?",ans:W(String(A+B-AB)),
        wrong:[
          W(String(A+B),_("חיברתם בלי לחסר את החיתוך, ולכן ספרתם את האיברים המשותפים פעמיים.")),
          W(String(A+B+AB),_("הוספתם את החיתוך במקום לחסר אותו.")),
          W(String(AB),_("זה גודל החיתוך, לא האיחוד."))
        ],
        steps:[
          S(_("עקרון ההכלה וההדחה"),_("כשמחברים שתי קבוצות, האיברים המשותפים נספרים פעמיים — ולכן מחסרים אותם פעם אחת."),
            "|A∪B| = |A| + |B| − |A∩B|"),
          S(_("מציבים"),"",A+" + "+B+" − "+AB),
          S(_("מחשבים"),"","= "+(A+B-AB))
        ],rule:"sets",hint:_("מחברים ומחסרים את החיתוך פעם אחת.")};
    }
    U=ri(40,80);A=ri(10,U-15);
    return {ask:_f("בקבוצה האוניברסלית {0} איברים ובקבוצה A יש {1}. כמה איברים במשלים של A?", U, A),
      expr:"|A<sup>c</sup>| = ?",ans:W(String(U-A)),
      wrong:[
        W(String(U+A),_("חיברתם. המשלים הוא מה שנשאר, ולכן מחסרים.")),
        W(String(A),_("זו הקבוצה עצמה, לא המשלים.")),
        W(String(U),_("זו הקבוצה האוניברסלית כולה."))
      ],
      steps:[
        S(_("הגדרת המשלים"),_("כל מה שנמצא בקבוצה האוניברסלית ואינו ב-A."),"Aᶜ = U \\ A"),
        S(_("מחשבים"),"",U+" − "+A+" = "+(U-A)),
        S(_("בדיקה"),_("הקבוצה ומשלימה מכסות יחד בדיוק את הכול."),A+" + "+(U-A)+" = "+U)
      ],rule:"sets",hint:_("משלים = הכול פחות הקבוצה.")};
  }
  /* רמה 3. קודם עמד כאן ביטוי אחד קבוע, (A∪B)ᶜ, ולכן התשובה הנכונה
     הייתה זהה בכל הגרלה, וגם הכיוון השני של דה־מורגן — משלים של
     חיתוך — לא הופיע מעולם. עכשיו מוגרל ביטוי מתוך שישה, כולל
     ביטויים מקוננים שבהם צריך להפוך שני קשרים. */
  var c1=Math.random()<0.5?"∪":"∩",c2=(c1==="∪"?"∩":"∪"),shape=ri(1,3);
  var C=function(s){return s+"<sup>c</sup>"};
  var src,goal,keep,plain2;
  if(shape===1){
    src="(A "+c1+" B)";
    goal=C("A")+" "+c2+" "+C("B");
    keep=C("A")+" "+c1+" "+C("B");
    plain2="A "+c2+" B";
  }else if(shape===2){
    src="(A "+c1+" B "+c1+" C)";
    goal=C("A")+" "+c2+" "+C("B")+" "+c2+" "+C("C");
    keep=C("A")+" "+c1+" "+C("B")+" "+c1+" "+C("C");
    plain2="A "+c2+" B "+c2+" C";
  }else{
    src="(A "+c1+" (B "+c2+" C))";
    goal=C("A")+" "+c2+" ("+C("B")+" "+c1+" "+C("C")+")";
    keep=C("A")+" "+c1+" ("+C("B")+" "+c2+" "+C("C")+")";
    plain2="A "+c2+" (B "+c1+" C)";
  }
  return {ask:_("מהי הצורה השקולה?"),expr:C(src),
    ans:W(goal),
    wrong:[
      W(keep,_("שמרתם על הפעולות כמו שהן. לפי דה־מורגן לקבוצות כל פעולה מתהפכת: איחוד נעשה חיתוך ולהפך.")),
      W(plain2,_("הפכתם את הפעולות אבל לא לקחתם משלימים.")),
      W(C(src.replace(new RegExp(c1==="∪"?"∪":"∩","g"),c2)),_("החלפתם את הפעולות בתוך הסוגריים במקום לפרק את המשלים. המשלים חייב לרדת אל כל קבוצה בנפרד."))
    ],
    steps:[
      S(_("דה־מורגן לקבוצות"),_("זהה בדיוק לדה־מורגן בלוגיקה: כל קבוצה מוחלפת במשלימה, וכל פעולה מתהפכת."),
        "(A∪B)ᶜ = Aᶜ ∩ Bᶜ   ·   (A∩B)ᶜ = Aᶜ ∪ Bᶜ"),
      S(_("למה"),c1==="∪"?_("אם איבר אינו באיחוד — הוא לא ב-A וגם לא ב-B.")
        :_("אם איבר אינו בחיתוך — הוא חסר לפחות באחת מהקבוצות."),""),
      S(_("התשובה"),"",goal)
    ],rule:"demorgan",hint:_("משלים מתפרק פנימה: כל קבוצה עוברת למשלימה וכל פעולה מתהפכת.")};
}

/* ---------- 21. סדרות וטורים ---------- */
function genSeries(L){
  /* ---- רמה 4 ----
     ברמה 3 נשאל רק על טור הנדסי, ותנאי ההתכנסות היה |q|<1. כאן
     מוגרל גם טור p, שבו הכלל הוא p>1 — ושני הכיוונים מופיעים,
     כולל הטור ההרמוני שאיבריו שואפים לאפס ובכל זאת הוא מתבדר.
     בדיוק שם נשבר מבחן האיבר הכללי. */
  if(L===4){
    var cs4=pick(["pconv","pdiv","gconv","gdiv"]);
    var pp=pick([2,3]),qq4=pick([2,3,4,5]),half=Math.random()<0.5;
    var ser=cs4==="pconv"?'<span class="frac"><span>1</span><span>'+pw("n",pp)+'</span></span>'
           :cs4==="pdiv"?(half?'<span class="frac"><span>1</span><span>n</span></span>':'<span class="frac"><span>1</span><span>√n</span></span>')
           :cs4==="gconv"?'<span class="frac"><span>1</span><span>'+pw(String(qq4),"n")+'</span></span>'
           :pw(String(qq4),"n");
    var oPc=_("מתכנס — זהו טור p עם p גדול מ-1");
    var oPd=_("מתבדר — זהו טור p עם p קטן או שווה ל-1");
    var oGc=_("מתכנס — זהו טור הנדסי עם |q| קטן מ-1");
    var oGd=_("מתבדר — האיבר הכללי אינו שואף לאפס");
    var map4=[["pconv",oPc],["pdiv",oPd],["gconv",oGc],["gdiv",oGd]];
    var pTxt=cs4==="pdiv"?(half?"p = 1":"p = "+fr(1,2).txt()):"p = "+pp;
    var why4=_("שתי משפחות ושני כללים שונים: בטור הנדסי מכריע |q| מול 1, ובטור p מכריע p מול 1. קודם מזהים למי מהן הטור שייך.");
    return {ask:_("האם הטור מתכנס, ומהו הנימוק?"),
      expr:"Σ<sub>n=1</sub><sup>∞</sup> "+ser,
      ans:W(map4.filter(function(o){return o[0]===cs4})[0][1]),
      wrong:map4.filter(function(o){return o[0]!==cs4}).map(function(o){return W(o[1],why4)}),
      steps:[
        S(_("מזהים את משפחת הטור"),_("חזקה של n במכנה — טור p. חזקה של מספר קבוע — טור הנדסי. הכללים שונים לגמרי."),
          (cs4==="pconv"||cs4==="pdiv")?_("טור p")+"  ,  "+pTxt:_("טור הנדסי")+"  ,  q = "+(cs4==="gconv"?fr(1,qq4).txt():String(qq4))),
        S(_("מפעילים את הכלל של אותה משפחה"),
          (cs4==="pconv"||cs4==="pdiv")?_("טור p מתכנס אם ורק אם p גדול מ-1. ב-p = 1 זה הטור ההרמוני, והוא מתבדר.")
                                       :_("טור הנדסי מתכנס אם ורק אם הערך המוחלט של המנה קטן מ-1."),
          (cs4==="pconv"||cs4==="pdiv")?pTxt+(cs4==="pconv"?" > 1":" ≤ 1"):"|q| "+(cs4==="gconv"?"< 1":"> 1")),
        S(_("ומה עם מבחן האיבר הכללי"),
          cs4==="gdiv"?_("כאן האיברים גדלים ואינם שואפים לאפס, ולכן המבחן לבדו כבר מכריע שהטור מתבדר.")
                      :_("בשלושת הטורים האחרים האיבר הכללי שואף לאפס, והמבחן אינו אומר דבר. הטור ההרמוני הוא הדוגמה הנגדית: אבריו שואפים לאפס והוא מתבדר."),
          map4.filter(function(o){return o[0]===cs4})[0][1])
      ],rule:"geoinf",hint:_("קודם מזהים אם זה טור p או טור הנדסי, ורק אז מפעילים את הכלל המתאים.")};
  }
  var a1,q,n,steps;
  if(L===1){
    a1=rnz(1,6);q=pick([2,3,-2,-3]);n=ri(3,6);
    var an=a1*Math.pow(q,n-1);
    return {ask:_f("בסדרה הנדסית a₁ = {0} ו-q = {1}. מהו האיבר ה-{2}?", num(a1), num(q), n),
      expr:"",ans:W(num(an)),
      wrong:[
        W(num(a1*Math.pow(q,n)),_f("השתמשתם ב-n במקום ב-n מינוס 1. מהאיבר הראשון ל-n עושים {0} הכפלות.", (n-1))),
        W(num(a1+(n-1)*q),_("זו נוסחת הסדרה החשבונית. בהנדסית מכפילים, לא מחברים.")),
        W(num(a1*q*n),_("הכפלתם ב-n במקום להעלות בחזקה."))
      ],
      steps:[
        S(_("נוסחת האיבר הכללי"),_("aₙ = a₁·qⁿ⁻¹. שימו לב למינוס אחד בחזקה — הוא מספר ההכפלות, לא מספר האיברים."),
          "aₙ = a₁·qⁿ⁻¹"),
        S(_("מציבים"),"","a"+n+" = "+num(a1)+" · "+pn(q)+"<sup>"+(n-1)+"</sup>"),
        S(_("מחשבים"),"","= "+num(an))
      ],rule:"geo",hint:_("בהנדסית מכפילים במנה, והחזקה היא n מינוס אחת.")};
  }
  if(L===2){
    a1=rnz(1,5);q=pick([2,3]);n=ri(3,6);
    var Sn=a1*(Math.pow(q,n)-1)/(q-1);
    return {ask:_f("חשבו את סכום {0} האיברים הראשונים של סדרה הנדסית עם a₁ = {1} ו-q = {2}.", n, num(a1), q),
      expr:"",ans:W(num(Sn)),
      wrong:[
        W(num(a1*Math.pow(q,n-1)),_f("זה האיבר ה-{0} עצמו, לא הסכום.", n)),
        W(num(a1*n),_("זה היה נכון אילו כל האיברים היו שווים.")),
        W(num(a1*(Math.pow(q,n)-1)),_("שכחתם לחלק ב-(q−1)."))
      ],
      steps:[
        S(_("נוסחת הסכום"),_("Sₙ = a₁·(qⁿ − 1) ÷ (q − 1), תקפה לכל q ששונה מ-1."),"Sₙ = a₁(qⁿ−1)/(q−1)"),
        S(_("מציבים"),"","S"+n+" = "+num(a1)+"·("+q+"<sup>"+n+"</sup> − 1) / ("+q+" − 1)"),
        S(_("מחשבים"),"","= "+num(a1)+"·"+(Math.pow(q,n)-1)+" / "+(q-1)+" = "+num(Sn))
      ],rule:"geosum",hint:_("סכום סדרה הנדסית: a₁ כפול (qⁿ פחות 1) חלקי (q פחות 1).")};
  }
  var den=pick([2,3,4,5]);
  var conv=Math.random()<0.6;
  a1=rnz(1,6);
  var qq=conv?fr(1,den):fr(den,1);
  var ansTxt=conv?fr(a1*den,den-1).html():_("הטור מתבדר");
  return {ask:_("האם הטור ההנדסי האינסופי מתכנס, ואם כן — לכמה?"),
    expr:"a₁ = "+num(a1)+"  ,  q = "+qq.html(),
    ans:W(ansTxt),
    wrong:conv?[
      W(_("הטור מתבדר"),_("מנה שערכה המוחלט קטן מ-1 גורמת לאיברים לדעוך, והטור מתכנס.")),
      W(fr(a1,den-1).html(),_("שכחתם את a₁ במונה או טעיתם בחישוב 1 פחות q.")),
      W(fr(a1*den,den+1).html(),_("במכנה צריך 1 פחות q, ולא 1 ועוד q."))
    ]:[
      W(fr(a1,1-den===0?1:1-den).html(),_("הצבתם בנוסחת הסכום בלי לבדוק את תנאי ההתכנסות. עם q גדול מ-1 היא לא תקפה.")),
      W(num(a1),_("זה האיבר הראשון בלבד.")),
      W("0",_("האיברים גדלים ולא דועכים."))
    ],
    steps:[
      S(_("קודם בודקים התכנסות"),_("טור הנדסי אינסופי מתכנס אם ורק אם הערך המוחלט של המנה קטן מ-1."),
        _("|q| < 1 ⇔ מתכנס")),
      S(_("כאן"),"","|q| = "+qq.html()+" → "+(conv?_("קטן מ-1, מתכנס"):_("גדול מ-1, מתבדר"))),
      S(conv?_("מציבים בנוסחת הסכום"):_("אין סכום סופי"),
        conv?"S = a₁ / (1 − q)":_("האיברים גדלים ללא גבול, ולכן אין ערך סופי."),
        conv?"S = "+num(a1)+" / (1 − "+qq.html()+") = "+ansTxt:_("מתבדר"))
    ],rule:"geoinf",hint:_("טור אינסופי מתכנס רק כשהערך המוחלט של המנה קטן מ-1.")};
}

/* ---------- 22. לוגריתמים ---------- */
function genLogs(L){
  /* ---- רמה 4 ----
     שני רעיונות בשאלה אחת, ולא נאמר מאיפה מתחילים: חוק הלוג של
     מכפלה הופך את המשוואה לריבועית, ואז צריך לחזור לתחום ההגדרה
     ולפסול את השורש שמכניס מספר שלילי לתוך הלוג. */
  if(L===4){
    /* קודם הוגרלה כאן רק משוואת סכום לוגריתמים. בצורה הזאת תמיד יש
       שורש אחד בתחום ההגדרה — אפשר להוכיח זאת — ולכן "אין פתרון"
       היה מסיח שלעולם אינו נכון, והתלמיד יכול היה לפסול אותו בלי
       לחשב. נוספה כאן משוואת הפרש לוגריתמים: היא נותנת שורש לינארי
       יחיד, ובחצי מהמקרים הוא נופל מחוץ לתחום ההגדרה — ואז באמת אין
       פתרון. זו בדיוק הסיבה שבודקים תחום הגדרה. */
    var qs=pick([[2,1,1],[2,2,3],[3,1,2],[5,1,4],[10,1,9],[2,3,7],[3,2,8]]);
    var qShape=pick(["prod","prod","quotOk","quotNo"]);
    if(qShape!=="prod"){
      var qb=qs[0],qk=qs[1],qd=qs[2],qm=Math.pow(qb,qk);
      var qj=ri(1,3),qgap=qd*qj,qlow=ri(3,7);
      var qp,qq,qAns,qRoot,qFlip,qBound,qWr;
      var lgQ="log<sub>"+qb+"</sub>";
      if(qShape==="quotOk"){
        /* המכנה הוא בעל הגבול הגדול → יש פתרון */
        qp=qlow;qq=qlow+qgap;qRoot=qq+qj;qFlip=qp-qj;qBound=qq;
        qAns="x = "+num(qRoot);
        qWr=[
          W("x = "+num(qFlip),_("הפכתם את המנה. בחוק הלוג להפרש הארגומנט הראשון הוא המונה והשני הוא המכנה.")),
          W("x = "+num(qBound),_("זהו גבול תחום ההגדרה עצמו, ושם הלוג אינו מוגדר — הביטוי שבתוכו מתאפס.")),
          W(_("אין פתרון"),_("יש בדיוק פתרון אחד: השורש שיצא גדול משני הגבולות, ולכן הוא בתחום ההגדרה."))
        ];
      }else{
        /* המונה הוא בעל הגבול הגדול → השורש נופל מתחת לתחום, ואין פתרון */
        qq=qlow;qp=qlow+qgap;qRoot=qq-qj;qFlip=qp+qj;qBound=qp;
        qAns=_("אין פתרון");
        qWr=[
          W("x = "+num(qRoot),_f("זה השורש שיוצא מהאלגברה, אבל הוא קטן מ-{0} ולכן שני הלוגים אינם מוגדרים בו. הוא נפסל, ואחר אין.", num(qBound))),
          W("x = "+num(qFlip),_("הפכתם את המנה. בחוק הלוג להפרש הארגומנט הראשון הוא המונה והשני הוא המכנה.")),
          W("x = "+num(qBound),_("זהו גבול תחום ההגדרה עצמו, ושם הלוג אינו מוגדר — הביטוי שבתוכו מתאפס."))
        ];
      }
      /* ב-math-uni אין frac() כללי — רק fr/rawFr למספרים. השבר כאן
         נבנה באותה תגית שהאפליקציה משתמשת בה בכל מקום אחר.
         **הבנייה חייבת להיות כאן ולא לפני ה-if.** qp ו-qq מוצהרים
         למעלה אך מקבלים ערך רק בתוך שני הענפים, ולכן שורה שנבנתה
         לפניהם הציגה לתלמיד "x − undefined" בשני צעדי פתרון. */
      var qfrT='<span class="frac"><span>x − '+num(qp)+'</span><span>x − '+num(qq)+'</span></span>';
      return {ask:_("פתרו את המשוואה"),
        expr:lgQ+"(x − "+num(qp)+") − "+lgQ+"(x − "+num(qq)+") = "+num(qk),
        ans:W(qAns),
        wrong:qWr,
        steps:[
          S(_("קודם קובעים את תחום ההגדרה"),_("לוג מוגדר רק על מספרים חיוביים, ולכן שני הביטויים שבתוכו חייבים להיות חיוביים. התנאי הזה נקבע לפני הפתרון, לא אחריו."),
            "x > "+num(Math.max(qp,qq))),
          S(_("מאחדים בחוק הלוג של מנה"),_("הפרש לוגריתמים באותו בסיס הוא לוג של המנה."),
            lgQ+"("+qfrT+") = "+num(qk)),
          S(_("משחררים את הלוג"),"",qfrT+" = "+qb+"<sup>"+qk+"</sup> = "+num(qm)),
          S(_("פותרים את המשוואה הלינארית"),_("מכפילים במכנה ומעבירים אגפים. נשאר שורש אחד בלבד, ולא שניים."),
            "x − "+num(qp)+" = "+num(qm)+"(x − "+num(qq)+")   →   x = "+num(qRoot)),
          S(_("חוזרים לתחום ההגדרה"),
            qShape==="quotOk"?_f("השורש היחיד גדול מ-{0}, ולכן הוא תקף.", num(qBound))
                             :_f("השורש היחיד קטן מ-{0}, ולכן הוא נפסל — ואין שורש אחר שיחליף אותו.", num(qBound)),
            qAns)
        ],rule:"logrules",hint:_("אחדו לוגריתם אחד, פתרו — ואז חזרו לבדוק אילו שורשים בכלל בתחום ההגדרה.")};
    }
    var PR=[[2,3,2,4],[2,4,2,8],[2,5,4,8],[3,2,1,9],[3,3,3,9],[5,2,1,25],[10,2,5,20],[10,2,4,25]];
    var t4=pick(PR),bb=t4[0],kk=t4[1],uu=t4[2],vv=t4[3];
    var rr=Math.max(uu,vv)+ri(1,4),pp=rr-uu,qq=rr-vv,ss=rr-uu-vv;
    var lg4="log<sub>"+bb+"</sub>";
    return {ask:_("פתרו את המשוואה"),
      expr:lg4+"(x − "+pp+") + "+lg4+"(x − "+qq+") = "+kk,
      ans:W("x = "+num(rr)),
      wrong:[
        W("x = "+num(ss)+" , x = "+num(rr),_f("שני השורשים אמנם פותרים את המשוואה הריבועית, אבל x = {0} מכניס מספר שלילי לתוך הלוג — הוא מחוץ לתחום ההגדרה.", num(ss))),
        W("x = "+num(ss),_f("זהו דווקא השורש שנפסל: ב-x = {0} הביטוי x − {1} יוצא שלילי, והלוג אינו מוגדר שם.", num(ss), pp)),
        W(_("אין פתרון"),_("יש בדיוק פתרון אחד. שני שורשים יצאו מהמשוואה הריבועית, אחד מהם נפסל בתחום ההגדרה והשני תקף."))
      ],
      steps:[
        S(_("קודם קובעים את תחום ההגדרה"),_("לוג מוגדר רק על מספרים חיוביים, ולכן שני הביטויים שבתוכו חייבים להיות חיוביים. התנאי הזה נקבע לפני הפתרון, לא אחריו."),
          "x > "+Math.max(pp,qq)),
        S(_("מאחדים בחוק הלוג של מכפלה"),_("סכום לוגריתמים באותו בסיס הוא לוג של המכפלה."),
          lg4+"((x − "+pp+")(x − "+qq+")) = "+kk),
        S(_("משחררים את הלוג"),"","(x − "+pp+")(x − "+qq+") = "+bb+"<sup>"+kk+"</sup> = "+Math.pow(bb,kk)),
        S(_("פותרים את המשוואה הריבועית"),"","x<sup>2</sup>"+term(-(pp+qq),"x")+sgn(pp*qq-Math.pow(bb,kk))+" = 0  →  x = "+num(rr)+"  ,  x = "+num(ss)),
        S(_("חוזרים לתחום ההגדרה"),_f("רק שורש שגדול מ-{0} תקף. השני נפסל.", Math.max(pp,qq)),"x = "+num(rr))
      ],rule:"logrules",hint:_("אחדו לוגריתם אחד, פתרו — ואז חזרו לבדוק אילו שורשים בכלל בתחום ההגדרה.")};
  }
  var b,n,steps;
  if(L===1){
    b=pick([2,3,5,10]);n=ri(2,5);
    var val=Math.pow(b,n);
    return {ask:_("חשבו"),expr:"log<sub>"+b+"</sub> "+val,ans:W(String(n)),
      wrong:[
        W(String(val/b),_("זה המספר חלקי הבסיס. לוגריתם שואל באיזו חזקה, ולא כמה פעמים.")),
        W(String(b*n),_("הכפלתם את הבסיס במעריך.")),
        W(String(val),_("זה המספר עצמו."))
      ],
      steps:[
        S(_("מה לוגריתם שואל"),_f("באיזו חזקה צריך להעלות את {0} כדי לקבל {1}?", b, val),"log_b(x) = y ⇔ bʸ = x"),
        S(_("בודקים"),"",b+"<sup>"+n+"</sup> = "+val),
        S(_("התשובה"),"",String(n))
      ],rule:"log",hint:_("לוגריתם הוא החזקה שאליה מעלים את הבסיס.")};
  }
  if(L===2){
    b=pick([2,3,10]);var u=ri(2,6),v=ri(2,6);
    var lg="log<sub>"+b+"</sub>";
    return {ask:_f("נתון {0}(a) = {1} ו-{2}(c) = {3}. חשבו את {4}(a·c).", lg, u, lg, v, lg),
      expr:"",ans:W(String(u+v)),
      wrong:[
        W(String(u*v),_("הכפלתם את הלוגריתמים. לוג של מכפלה הוא סכום הלוגים, לא מכפלתם.")),
        W(num(u-v),_("חיסור מתאים ללוג של מנה, לא של מכפלה.")),
        W(String(Math.pow(u,v)),_("העלאה בחזקה מתאימה ללוג של חזקה."))
      ],
      steps:[
        S(_("חוק הלוג של מכפלה"),_("הלוגריתם מתרגם כפל לחיבור — זו כל התועלת שלו."),"log(a·c) = log a + log c"),
        S(_("מציבים"),"",u+" + "+v),
        S(_("מחשבים"),"","= "+(u+v))
      ],rule:"logrules",hint:_("לוג של מכפלה = סכום הלוגים. של מנה = הפרש.")};
  }
  b=pick([2,3,5]);n=ri(2,5);
  var target=Math.pow(b,n);
  return {ask:_("פתרו את המשוואה"),expr:b+"<sup>x</sup> = "+target,
    ans:W("x = "+n),
    wrong:[
      W("x = "+num(target/b),_("חילקתם בבסיס. משוואה מעריכית נפתרת בלוגריתם, לא בחילוק.")),
      W("x = "+num(target-b),_("חיסרתם.")),
      W("x = "+num(Math.round(target/n*100)/100),_("חילקתם במעריך."))
    ],
    steps:[
      S(_("הנעלם נמצא בחזקה"),_("כשהנעלם במעריך, הכלי הוא לוגריתם — הוא הפעולה ההפוכה להעלאה בחזקה."),
        b+"ˣ = "+target),
      S(_("מפעילים לוג על שני האגפים"),"","x = log<sub>"+b+"</sub>("+target+")"),
      S(_("מחשבים"),"",b+"<sup>"+n+"</sup> = "+target+"  →  x = "+n)
    ],rule:"log",hint:_("נעלם בחזקה — מפעילים לוגריתם על שני האגפים.")};
}

/* ---------- 23. מספרים מרוכבים ---------- */
function genComplex(L){
  /* ---- רמה 4 ----
     שלוש צורות שאין להן מקבילה ברמות 1–3: הכלל √a·√b = √(ab) שאינו
     תקף לשליליים, מכפלת מספר בצמוד שלו, וחילוק — שדורש להבין לבד
     שצריך להרחיב בצמוד. */
  if(L===4){
    var sh4=pick(["root","conj","div"]),g4=0;
    if(sh4==="root"){
      var aa=ri(1,6),bd=ri(1,6);
      while(bd===aa&&g4++<20)bd=ri(1,6);
      return {ask:_("חשבו"),expr:"√(−"+(aa*aa)+") · √(−"+(bd*bd)+")",
        ans:W(num(-aa*bd)),
        wrong:[
          W(num(aa*bd),_("הכפלתם את השורשים לשורש אחד. הכלל √a·√b = √(ab) תקף רק כאשר שני המספרים אי־שליליים, ובדיוק כאן הוא נשבר.")),
          W(num(aa*bd)+"i",_("שני הגורמים תרמו i אחד כל אחד, ו-i בריבוע הוא מספר ממשי — התוצאה ממשית.")),
          W(num(-aa*bd)+"i",_("הסימן נכון אבל ה-i מיותר. i בריבוע כבר הפך לממשי."))
        ],
        steps:[
          S(_("מוציאים i מכל שורש בנפרד"),_("שורש של מספר שלילי מוגדר דרך i, וזה השלב היחיד שמותר לעשות כאן."),
            "√(−"+(aa*aa)+") = "+aa+"i   ,   √(−"+(bd*bd)+") = "+bd+"i"),
          S(_("מכפילים"),"",aa+"i · "+bd+"i = "+(aa*bd)+"i²"),
          S(_("מציבים i² = −1"),_("כאן נכנס הכלל היחיד שצריך לזכור."),num(-aa*bd)),
          S(_("למה הדרך הקצרה שגויה"),_("״שורש כפול שורש שווה שורש המכפלה״ מניח ששני המספרים אי־שליליים. בלי ההנחה הזאת מקבלים סימן הפוך."),
            "√(−"+(aa*aa)+")·√(−"+(bd*bd)+") ≠ √"+(aa*aa*bd*bd))
        ],rule:"cxmul",hint:_("אין כלל שמאחד שני שורשים של מספרים שליליים. מוציאים i מכל אחד בנפרד.")};
    }
    if(sh4==="conj"){
      var ca=rnz(-6,6),cb=rnz(-6,6);
      while(Math.abs(ca)===Math.abs(cb)&&g4++<20)cb=rnz(-6,6);
      return {ask:_("חשבו את המכפלה של z בצמוד שלו"),expr:"z = "+cx(ca,cb),
        ans:W(num(ca*ca+cb*cb)),
        wrong:[
          W(num(ca*ca-cb*cb),_("שכחתם ש-i² = −1. במכפלת (a+bi)(a−bi) האיבר −b²i² הופך ל-+b², ולכן מחברים.")),
          W(cx(ca*ca-cb*cb,2*ca*cb),_("זה z בריבוע, ולא z כפול הצמוד. בצמוד הסימן של החלק המדומה מתהפך.")),
          W("√"+(ca*ca+cb*cb),_("זה |z|. המכפלה בצמוד שווה ל-|z| בריבוע, כלומר למספר שמתחת לשורש."))
        ],
        steps:[
          S(_("כותבים את הצמוד"),_("הצמוד הוא אותו מספר עם סימן הפוך בחלק המדומה."),"z̄ = "+cx(ca,-cb)),
          S(_("פותחים סוגריים"),"","("+cx(ca,cb)+")("+cx(ca,-cb)+") = "+(ca*ca)+" − "+(cb*cb)+"i²"),
          S(_("מציבים i² = −1"),_("המינוס מתהפך, ולכן שני האיברים מתחברים — והתוצאה ממשית וחיובית תמיד."),
            (ca*ca)+" + "+(cb*cb)+" = "+num(ca*ca+cb*cb)),
          S(_("זה בדיוק |z|²"),"","z·z̄ = |z|²")
        ],rule:"cxabs",hint:_("z כפול הצמוד הוא תמיד מספר ממשי, והוא |z| בריבוע.")};
    }
    var dc=rnz(-5,5),dd=rnz(-5,5);
    while((Math.abs(dc)===Math.abs(dd)||dc===0||dd===0)&&g4++<40){dc=rnz(-5,5);dd=rnz(-5,5)}
    var mm=dc*dc+dd*dd;
    return {ask:_("חשבו"),expr:'<span class="frac"><span>'+mm+'</span><span>'+cx(dc,dd)+'</span></span>',
      ans:W(cx(dc,-dd)),
      wrong:[
        W(cx(dc,dd),_("זה המכנה עצמו. חילוק אינו מסתיים בהעתקת המכנה למונה.")),
        W(cx(-dc,dd),_("הפכתם את הסימן של החלק הלא נכון. הצמוד הופך רק את החלק המדומה.")),
        W(cx(dd,-dc),_("החלפתם בין החלק הממשי למדומה."))
      ],
      steps:[
        S(_("איך בכלל מחלקים במספר מרוכב"),_("אין כלל חילוק ישיר. מרחיבים את השבר בצמוד המכנה, וכך המכנה הופך לממשי."),
          "1/z = z̄ / (z·z̄)"),
        S(_("מרחיבים בצמוד"),"",'<span class="frac"><span>'+mm+'('+cx(dc,-dd)+')</span><span>('+cx(dc,dd)+')('+cx(dc,-dd)+')</span></span>'),
        S(_("המכנה הופך לממשי"),"","("+cx(dc,dd)+")("+cx(dc,-dd)+") = "+(dc*dc)+" + "+(dd*dd)+" = "+mm),
        S(_("מצמצמים"),"",cx(dc,-dd))
      ],rule:"cxmul",hint:_("מרחיבים בצמוד המכנה — זה הופך את המכנה למספר ממשי.")};
  }
  var a,b,c,d,steps;
  function cx(re,im){
    if(im===0)return num(re);
    if(re===0)return (im===1?"":im===-1?"−":num(im))+"i";
    return num(re)+(im<0?" − ":" + ")+(Math.abs(im)===1?"":Math.abs(im))+"i";
  }
  if(L===1){
    a=rnz(-6,6);b=rnz(-6,6);c=rnz(-6,6);d=rnz(-6,6);
    /* בחלק מההגרלות החלקים המדומים מתבטלים והסכום עצמו ממשי. בלי זה
       "היחיד בלי i" היה מסיח קבוע שאפשר למחוק בלי לחשב — הוא הופיע
       בכל שאלה ולא היה נכון אף פעם. עכשיו לפעמים דווקא התשובה היא
       היחידה בלי i, והסימן ההוא כבר אינו מלמד דבר. */
    var realSum=Math.random()<0.35;
    if(realSum){d=-b;while(b+c===0)c=rnz(-6,6)}
    return {ask:_("חשבו את הסכום"),expr:"("+cx(a,b)+") + ("+cx(c,d)+")",
      ans:W(cx(a+c,b+d)),
      wrong:[
        W(realSum?cx(a+c,b-d):cx(a+c+b+d,0),
          realSum?_("חיסרתם את החלקים המדומים במקום לחבר אותם."):_("חיברתם הכול יחד. החלק הממשי והחלק המדומה נשארים נפרדים.")),
        W(cx(a+d,b+c),_("החלפתם בין החלקים.")),
        W(cx(a*c,b*d),_("הכפלתם במקום לחבר."))
      ],
      steps:[
        S(_("מחברים חלק ממשי עם ממשי"),_("i הוא כמו משתנה — מחברים רק איברים דומים."),"(a+bi)+(c+di) = (a+c)+(b+d)i"),
        S(_("החלק הממשי"),"",num(a)+" + "+pn(c)+" = "+num(a+c)),
        S(_("החלק המדומה"),"",num(b)+" + "+pn(d)+" = "+num(b+d)),
        S(_("התוצאה"),"",cx(a+c,b+d))
      ],rule:"cxadd",hint:_("ממשי עם ממשי, מדומה עם מדומה.")};
  }
  if(L===2){
    a=rnz(-5,5);b=rnz(-5,5);c=rnz(-5,5);d=rnz(-5,5);
    var re=a*c-b*d,im=a*d+b*c;
    return {ask:_("חשבו את המכפלה"),expr:"("+cx(a,b)+")("+cx(c,d)+")",
      ans:W(cx(re,im)),
      wrong:[
        W(cx(a*c+b*d,im),_("שכחתם ש-i בריבוע שווה מינוס אחת. bd·i² הופך ל-−bd, ולכן מחסרים.")),
        W(cx(a*c,b*d),_("הכפלתם חלק בחלק. צריך לפתוח סוגריים במלואם, ארבע מכפלות.")),
        W(cx(re,a*c+b*d),_("החלק המדומה מורכב מ-ad ועוד bc."))
      ],
      steps:[
        S(_("פותחים סוגריים כרגיל"),_("ארבע מכפלות, בדיוק כמו במכפלת בינומים."),
          "ac + adi + bci + bd·i²"),
        S(_("כאן נכנס הכלל היחיד שצריך לזכור"),_("i בריבוע שווה מינוס אחת, ולכן האיבר האחרון משנה סימן."),
          "i² = −1  →  bd·i² = −bd"),
        S(_("מכנסים"),"","("+num(a*c)+" − "+pn(b*d)+") + ("+num(a*d)+" + "+pn(b*c)+")i"),
        S(_("התוצאה"),"",cx(re,im))
      ],rule:"cxmul",hint:_("פותחים סוגריים כרגיל, וזוכרים ש-i בריבוע הוא מינוס אחת.")};
  }
  var TRIP2=[[3,4,5],[6,8,10],[5,12,13],[8,15,17]];
  var t=pick(TRIP2);
  a=t[0]*pick([1,-1]);b=t[1]*pick([1,-1]);
  return {ask:_("חשבו את הערך המוחלט"),expr:"|"+cx(a,b)+"|",
    ans:W(String(t[2])),
    wrong:[
      W(num(Math.abs(a)+Math.abs(b)),_("חיברתם את החלקים. הערך המוחלט מחושב לפי פיתגורס.")),
      W(num(t[2]*t[2]),_("עצרתם לפני הוצאת השורש.")),
      W(num(a),_("זה החלק הממשי בלבד."))
    ],
    steps:[
      S(_("הערך המוחלט הוא מרחק"),_("במישור המרוכב זהו המרחק מהראשית, כלומר בדיוק פיתגורס."),
        "|a+bi| = √(a² + b²)"),
      S(_("מציבים"),"","√("+pn(a)+"² + "+pn(b)+"²) = √("+(a*a)+" + "+(b*b)+")"),
      S(_("מחשבים"),"","√"+(t[2]*t[2])+" = "+t[2])
    ],rule:"cxabs",hint:_("ערך מוחלט של מרוכב = שורש של סכום ריבועי החלקים.")};
}

/* ============================================================
   10. רשימת הנושאים
   tracks — 1 מדעים והנדסה · 2 מדעי המחשב · 3 מדעי החברה
   pre    — נושא שכדאי לחזק קודם אם נופלים כאן שוב ושוב
   ============================================================ */
var TOPICS=[
  {id:"limits",  area:"calc",           tracks:[1,2,3],pre:[],          gen:genLimits,  name:"גבולות",              desc:"הצבה, ביטול 0/0 וגבול באינסוף"},
  {id:"deriv",   area:"calc",           tracks:[1,2,3],pre:["limits"],  gen:genDeriv,   name:"נגזרות בסיסיות",      desc:"כלל החזקה, eˣ, ln x וטריגונומטריות"},
  {id:"chain",   area:"calc",           tracks:[1,2],  pre:["deriv"],   gen:genChain,   name:"כלל השרשרת",          desc:"פונקציה בתוך פונקציה, והנגזרת הפנימית"},

function badStr(s){return !s||/NaN|Infinity|undefined|null/.test(s)}

function buildQ(topicId,level){
  var t=topicById(topicId);
  if(!t)t=TOPICS[0];
  var raw=null,tries=0,opts=null,i,p,seen,ansP,best=null;
  /* מגרילים עד שיוצאות ארבע אפשרויות שונות. מסיח שיצא במקרה שווה
     לתשובה נעלם בסינון, והשאלה הייתה מציגה שלוש — קל מדי בלי סיבה.
     אם אחרי כמה ניסיונות עדיין לא, לוקחים את ההגרלה העשירה ביותר. */
  while(tries<12){
    tries++;
    try{raw=t.gen(level)}catch(e){raw=null}
    if(!raw||!raw.ans||badStr(plainOf(raw.ans.h)))continue;
    ansP=plainOf(raw.ans.h);
    seen={};seen[ansP]=1;
    opts=[{h:raw.ans.h,t:ansP,ok:true,why:""}];
    for(i=0;i<(raw.wrong||[]).length;i++){
      p=plainOf(raw.wrong[i].h);
      if(badStr(p)||seen[p])continue;
      seen[p]=1;
      opts.push({h:raw.wrong[i].h,t:p,ok:false,why:raw.wrong[i].why||""});
    }
    if(!best||opts.length>best.opts.length)best={raw:raw,opts:opts};
    if(opts.length>=4)break;
  }
  if(best){raw=best.raw;opts=best.opts}
  if(!raw)raw={ask:_("חשבו"),expr:"1 + 1",ans:W("2"),wrong:[W("1"),W("3"),W("11")],steps:[S(_("חיבור"),"","1 + 1 = 2")],hint:"",rule:"order"};
  if(!opts||opts.length<2){
    ansP=plainOf(raw.ans.h);
    opts=[{h:raw.ans.h,t:ansP,ok:true,why:""}];
  }
  /* יותר מארבע אפשרויות שוברת את הממשק: מערך התוויות ומקשי 1–4
     מניחים ארבע בדיוק, והחמישית הייתה מקבלת תווית undefined ולא
     הייתה נגישה מהמקלדת. מורידים מסיח — אקראי ולא הראשון, כדי שכל
     המסיחים שהמחולל כתב יופיעו לאורך זמן ולא רק שלושת הראשונים. */
  while(opts.length>4)opts.splice(1+Math.floor(Math.random()*(opts.length-1)),1);
  shuffle(opts);
  var sayTxt=raw.ask+(raw.expr?". "+speakMath(plainOf(raw.expr)):"");
  return {
    topic:t.id,topicName:t.name,level:level,
    ask:raw.ask,expr:raw.expr||"",fig:raw.fig||"",
    options:opts,steps:raw.steps||[],hint:raw.hint||"",rule:raw.rule||"",
    say:sayTxt
  };
}

  var chosen=state.topics.filter(function(id){return !!topicById(id)});
  if(chosen.length)return chosen;
  return topicsForTrack(state.track).map(function(t){return t.id});
}
/* בחירת הנושא הבא: מי שחלש יותר מקבל יותר תורות, ומדי כמה
   שאלות חוזר נושא שנפלו בו קודם. ככה החזרה קורית לבד. */
function nextTopic(idx){
  var pool=activeTopics();
  if(idx>0&&idx%3===2&&state.wrongBank.length){
    var w=state.wrongBank[state.wrongBank.length-1-Math.floor(Math.random()*Math.min(5,state.wrongBank.length))];
    if(w&&pool.indexOf(w.topic)>=0)return w.topic;
  }
  var weights=pool.map(function(id){return 110-mastery(id).m}),total=0,i;
  for(i=0;i<weights.length;i++)total+=weights[i];
  var r=Math.random()*total;
  for(i=0;i<pool.length;i++){r-=weights[i];if(r<=0)return pool[i]}
  return pool[pool.length-1];
}
function startRound(forceTopic){
  var n=state.settings.roundLen,i;
  P.list=[];
  for(i=0;i<n;i++)P.list.push(forceTopic||nextTopic(i));
  P.i=0;P.results=[];P.startedAt=Date.now();
  loadQ();
}
function loadQ(){
  P.q=buildQ(P.list[P.i],state.level);
  P.phase="ask";P.picked=[];P.hints=0;P.steps=0;P.usedHelp=false;
  if(state.settings.autoSteps)P.steps=1;
}
function roundDone(){return P.i>=P.list.length}

/* השליטה בנושא נמדדת כממוצע נע של הביצועים האחרונים, ולא
   כמונה שמטפס לאט. תלמיד שענה נכון צריך לראות מספר שמשקף
   את זה מיד — אחרת המדד מתסכל במקום לעזור. */
function scoreAnswer(ok){
  var m=mastery(P.q.topic),d=dayRec(),score;
  m.seen++;d.a++;state.stats.answered++;
  touchDay();
  if(ok&&!P.usedHelp&&P.picked.length===1){
    m.ok++;d.c++;state.stats.correct++;state.stats.xp+=10;
    score=1;P.results.push("ok");
  }else if(ok&&!P.usedHelp){
    m.ok++;d.c++;state.stats.correct++;state.stats.xp+=4;
    score=0.7;P.results.push("ok");
  }else if(P.usedHelp){
    m.help++;state.stats.helped++;state.stats.xp+=2;
    score=0.35;P.results.push("hp");
  }else{
    score=0;P.results.push("no");
  }
  m.m=m.seen===1?Math.round(score*100):Math.round(m.m*0.6+score*40);
  if(!ok||P.usedHelp){
    state.wrongBank.push({topic:P.q.topic,ts:Date.now()});
    if(state.wrongBank.length>40)state.wrongBank.shift();
  }
  save();
}

  h+='</div>';

  if(P.steps>0||P.phase==="reveal"){
    var showAll=P.phase==="reveal";
    var shown=showAll?q.steps.length:Math.min(P.steps,q.steps.length);
    h+=_f("{0}{1}{2}{3} הפתרון, צעד אחר צעד</div>", '<div class="card pad rise ', topicCls(q.topic), '"><div class="spread"><div class="h2" style="color:var(--c)">', ic("steps",18))+
       (state.settings.tts?_f("{0}{1} הקראה</button>", '<button class="btn btn-g" style="padding:8px 12px;font-size:.85rem" data-a="readsteps">', ic("speaker",15)):"")+'</div>';
    h+='<div class="steps">'+q.steps.map(function(s,i){
      if(i>=shown)return "";
      return '<div class="step'+(i===q.steps.length-1?" last":"")+'"><div class="st"><span class="num">'+(i+1)+'</span>'+s.t+'</div>'+
        (s.d?'<div class="sd">'+s.d+'</div>':"")+
        (s.m?'<div class="mstep">'+s.m+'</div>':"")+'</div>';
    }).join("")+'</div>';
    if(!showAll&&shown<q.steps.length){
      h+='<button class="btn btn-p w" style="margin-top:12px" data-a="nextstep">'+_('הצעד הבא')+' '+ic("arrow",17)+'</button>';
      h+='<p class="sub xs" style="text-align:center;margin-top:8px">'+_('אפשר לעצור בכל שלב ולנסות להמשיך לבד.')+'</p>';
    }
    h+='</div>';
  }
  /* פס תחתון אחרי מענה */
  if(P.phase==="reveal"){
    var kind=P.results[P.results.length-1];
    h+='<div class="card pad rise" style="border-inline-start:4px solid var(--'+(kind==="ok"?"ok":kind==="hp"?"accent":"bad")+')">'+
       '<div class="row">'+ic(kind==="ok"?"check":"bulb",19)+'<b>'+lineFor(kind)+'</b></div>'+
       '<button class="btn btn-p w" style="margin-top:12px;padding:14px" data-a="next">'+
         (P.i+1>=P.list.length?_("לסיכום הסבב"):_("לשאלה הבאה"))+' '+ic("arrow",18)+'</button>'+
       (state.settings.keys?'<p class="sub xs" style="text-align:center;margin-top:8px">'+_('אפשר גם ללחוץ Enter')+'</p>':"")+
       '</div>';
  }
  h+='</div>';
  if(state.settings.keys&&P.phase==="ask")
    h+='<p class="sub xs" style="margin-top:14px;text-align:center">'+_('מקלדת: 1–4 תשובה · רווח הקראה · H רמז · S פתרון')+'</p>';
  return h+'</main>';
}

/* ---------- סיכום סבב ---------- */
function viewSummary(){
  var ok=P.results.filter(function(r){return r==="ok"}).length;
  var hp=P.results.filter(function(r){return r==="hp"}).length;
  var no=P.results.length-ok-hp;
  var pct=Math.round(ok/Math.max(1,P.results.length)*100);
  var byTopic={},i;
  for(i=0;i<P.list.length&&i<P.results.length;i++){
    var id=P.list[i];
    if(!byTopic[id])byTopic[id]={ok:0,n:0};
    byTopic[id].n++;if(P.results[i]==="ok")byTopic[id].ok++;
  }
  var worst=null;
  for(var k in byTopic)if(byTopic[k].n>=2&&(!worst||byTopic[k].ok/byTopic[k].n<byTopic[worst].ok/byTopic[worst].n))worst=k;
  var title=pct>=85?_("סבב חזק."):pct>=60?_("סבב טוב."):pct>=35?_("סבב עם עבודה."):_("סבב קשה — וזה בסדר.");
  var sub=pct>=85?_("אתם שולטים ברוב מה שתרגלתם כאן.")
       :pct>=60?_("רוב הדברים במקום. יש נקודה אחת או שתיים שכדאי לחדד.")
       :pct>=35?_("חלק מהחומר עוד לא יושב. זה בדיוק מה שמדידה כזאת נועדה להראות.")
       :_("סבב כזה לא אומר עליכם כלום חוץ מזה שהחומר הזה חדש. שווה לרדת רמה ולבנות מלמטה.");
  var h='<main id="main" class="wrap" style="padding-top:26px;padding-bottom:44px;max-width:760px">';
  h+='<div class="card pad rise"><h1 class="h1">'+title+'</h1><p class="sub">'+sub+'</p>'+
     '<div class="grid g4" style="margin-top:18px">'+
_f("{0}{1}</b><span>נכון לבד</span></div>", '<div class="tile" style="--c:var(--ok)"><b>', ok)+
_f("{0}{1}</b><span>עם פתרון מודרך</span></div>", '<div class="tile" style="--c:var(--c-alg)"><b>', hp)+
_f("{0}{1}</b><span>לא נפתרו</span></div>", '<div class="tile" style="--c:var(--bad)"><b>', no)+
_f("{0}{1}%</b><span>דיוק</span></div>", '<div class="tile" style="--c:var(--c-geo)"><b>', pct)+
     '</div>';
  h+='<hr class="sep"><div class="h2">'+_('לפי נושא')+'</div><div class="grid" style="margin-top:10px">'+
     Object.keys(byTopic).map(function(id){
       var b=byTopic[id],tp=topicById(id);
       return '<div class="spread '+topicCls(id)+'" style="gap:8px"><span class="arh">'+tp.name+'</span>'+
_f("{0}{1}{2}{3} מתוך {4}</span></div>", '<span class="chip ', (b.ok===b.n?"ok":b.ok===0?"bad":"warn"), '">', b.ok, b.n);
     }).join("")+'</div>';
  if(worst&&byTopic[worst].ok<byTopic[worst].n){
    var wt=topicById(worst);
    h+='<div class="card pad" style="margin-top:16px;background:var(--surface2)">'+
_f("{0}{1}<b>מה לקחת מכאן</b></div>", '<div class="row">', ic("target",17))+
_f("{0}{1} היה הנושא שהכי הפריע בסבב הזה. סבב ממוקד אחד בו יעשה יותר מעוד עשר שאלות מעורבות.</p>", '<p class="sub sm">', wt.name)+
_f("{0}{1}{2}{3} סבב ממוקד ב{4}</button></div>", '<button class="btn btn-p" style="margin-top:10px" data-a="starttopic" data-t="', worst, '">', ic("pencil",16), wt.name);
  }
  h+='<div class="row" style="margin-top:18px">'+
_f("{0}{1} סבב נוסף</button>", '<button class="btn btn-p" data-a="start">', ic("refresh",17))+
_f("{0}{1} לדף הבית</button>", '<button class="btn btn-g" data-a="go" data-v="home">', ic("home",17))+
_f("{0}{1} להתקדמות</button></div>", '<button class="btn btn-g" data-a="go" data-v="progress">', ic("chart",17));
  return h+'</div></main>';
}

/* ---------- התקדמות ---------- */
function viewProgress(){
  var st=state.stats;
  var acc=st.answered?Math.round(st.correct/st.answered*100):0;
  var days=[],i,d=new Date();
  for(i=13;i>=0;i--){
    var dd=new Date(d.getTime()-i*86400000);
    var key=dd.getFullYear()+"-"+String(dd.getMonth()+1).padStart(2,"0")+"-"+String(dd.getDate()).padStart(2,"0");
    days.push({k:key,r:state.days[key]||{a:0,c:0},lbl:_("אבגדהוש").charAt(dd.getDay())});
  }
  var maxA=Math.max.apply(null,days.map(function(x){return x.r.a}).concat([1]));
  var seen=TOPICS.filter(function(t){return mastery(t.id).seen>0});
  var h='<main id="main" class="wrap" style="padding-top:22px;padding-bottom:44px">';
  h+='<h1 class="h1">'+_('התקדמות')+'</h1><p class="sub">'+_('המספרים כאן הם כלי עבודה, לא ציון.')+'</p>';
  h+='<div class="grid g4" style="margin-top:16px">'+
_f("{0}{1}</b><span>שאלות שנפתרו</span></div>", '<div class="tile" style="--c:var(--c-base)"><b>', st.answered)+
_f("{0}{1}%</b><span>דיוק כולל</span></div>", '<div class="tile" style="--c:var(--ok)"><b>', acc)+
_f("{0}{1}</b><span>עם פתרון מודרך</span></div>", '<div class="tile" style="--c:var(--c-alg)"><b>', st.helped)+
_f("{0}{1}</b><span>נקודות</span></div></div>", '<div class="tile" style="--c:var(--c-geo)"><b>', st.xp);
  h+='<div class="card pad" style="margin-top:16px"><div class="h2">'+_('שבועיים אחרונים')+'</div>'+
     '<div style="display:flex;gap:5px;align-items:flex-end;height:120px;margin-top:14px;direction:ltr">'+
     days.map(function(x){
       var hh=Math.round(x.r.a/maxA*88);
       return '<div style="flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%">'+
         '<i style="display:block;width:100%;border-radius:5px 5px 0 0;background:'+(x.r.a?"linear-gradient(180deg,var(--c-alg),var(--c-data))":"var(--surface2)")+';height:'+Math.max(hh,4)+'px" title="'+x.r.a+' '+_('שאלות">')+'</i>'+
         '<span class="xs faint">'+x.lbl+'</span></div>';
     }).join("")+'</div></div>';
  h+='<div class="card pad" style="margin-top:16px"><div class="h2">'+_('שליטה לפי נושא')+'</div>';
  if(!seen.length)h+='<p class="sub sm">'+_('עוד לא תרגלתם נושאים. אחרי הסבב הראשון תופיע כאן תמונה.')+'</p>';
  else h+='<div class="grid" style="margin-top:12px;gap:11px">'+seen.sort(function(a,b){return mastery(a.id).m-mastery(b.id).m}).map(function(tp){
    var m=mastery(tp.id);
    return '<div class="'+areaCls(tp.area)+'"><div class="spread" style="gap:8px"><span class="arh" style="font-weight:600">'+tp.name+'</span>'+
_f("{0}{1} מתוך {2}{3}</span></div>", '<span class="xs faint">', m.ok, m.seen, (m.help?_f(" · {0} עם עזרה", m.help):""))+
      '<div class="bar '+barCls(m)+'" style="margin-top:5px"><i style="width:'+m.m+'%"></i></div></div>';
  }).join("")+'</div>';
  h+='</div>';
  return h+'</main>';
}

/* ============================================================
   18. מבחן כיתתי — פרסום בוואטסאפ, קבלת תשובות וציונים
   ------------------------------------------------------------
   אין שרת, ואין כוונה שיהיה. לכן המבחן אינו נשלח לשום מקום:
   הוא *נארז לתוך הקישור*. המורה מקבל קישור, שולח אותו בוואטסאפ,
   והמכשיר של התלמיד בונה מהקישור בדיוק את אותן שאלות.

   מה שהופך את זה לאפשרי הוא שכל מחולל שאלות כאן משתמש ב-
   Math.random בלבד. אם מזרעים אותו, אותו זרע מייצר את אותן
   שאלות ואת אותו סדר תשובות — אצל המורה ואצל התלמיד. הקישור
   נושא זרע ורשימת נושאים, לא עשרים שאלות מלאות, ולכן הוא נשאר
   קצר מספיק לוואטסאפ.

   שלוש מגבלות שנאמרות כאן במפורש כי הן חלק מהתכנון:
   · אין איסוף אוטומטי. התלמיד שולח קוד תשובות בוואטסאפ, והמורה
     מדביק אותו. זה המחיר של אפס שרת ואפס עלות.
   · אפשר לזייף קוד. הציון מחושב מחדש אצל המורה מתוך התשובות
     ולא נלקח מהתלמיד, אבל אין כאן הגנה קריפטוגרפית — זה מבחן
     כיתתי מעצב, לא בגרות.
   · שמות התלמידים נשארים במכשיר של המורה. הם לא עוברים דרך
     שום שרת, כי אין שרת.
   ============================================================ */
var GENV=5;                 /* גרסת המחוללים. מבחן שנוצר בגרסה אחרת
                               אינו נפתח — עדיף הודעה ברורה מאשר
                               עשרים שאלות אחרות בשקט. */
var EKEY="shlav-exams-math-uni-v1";   /* מפתח לאפליקציה הזאת בלבד */
var EKEY_OLD="shlav-exams-v1";  /* המפתח המשותף הישן. לקריאה בלבד, לא נמחק. */

/* --- מחולל מזורע. mulberry32: קצר, מהיר, ופיזור טוב דיו --- */
function withSeed(seed,fn){
  var real=Math.random,s=(seed>>>0)||1;
  Math.random=function(){
    s|=0; s=s+0x6D2B79F5|0;
    var t=Math.imul(s^s>>>15,1|s);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
  try{return fn()}finally{Math.random=real}
}
function hash32(str){
  var h=0x811c9dc5,i;
  for(i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193)}
  return (h>>>0);
}
/* base64url. הניקוי בפענוח אינו קוסמטי: וואטסאפ שובר מחרוזות
   ארוכות בשורות, ורווח אחד הורס את כל הקוד. */
function b64e(str){
  var bytes=new TextEncoder().encode(str),bin="",i;
  for(i=0;i<bytes.length;i+=8192)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));
  return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function b64d(s){
  s=String(s||"").replace(/[^A-Za-z0-9\-_]/g,"").replace(/-/g,"+").replace(/_/g,"/");
  while(s.length%4)s+="=";
  var bin=atob(s),bytes=new Uint8Array(bin.length),i;
  for(i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
/* הזרע של המשבצת נכנס למזהה: שני מבחנים באותם נושאים ובאותה
   רמה, שהמורה החליף באחד מהם שאלה, אינם אותו מבחן. מבחן ישן
   שאין לו זרעים מקבל בדיוק את המזהה שקיבל תמיד — אחרת ההגשות
   שכבר נקלטו אליו מתייתמות. */
function examId(spec){return hash32(spec.s+"|"+spec.q.map(function(x){
  return x[0]+x[1]+(x.length>2?"@"+x[2]:"")}).join(",")).toString(36)}
function encodeExam(spec){return b64e(JSON.stringify(spec))}
function decodeExam(code){
  try{
    var o=JSON.parse(b64d(code));
    if(!o||!o.q||!o.q.length||typeof o.s!=="number")return null;
    o.q=o.q.filter(function(x){return topicById(x[0])});
    return o.q.length?o:null;
  }catch(e){return null}
}
/* בונה את שאלות המבחן. אותו זרע → אותן שאלות, גם אצל המורה
   כשהוא בודק וגם אצל התלמיד כשהוא נבחן. */
function examQuestions(spec){
  /* מסננים נושאים שאינם מוכרים לאפליקציה הזאת, בדיוק כמו decodeExam.
     בלי הסינון buildQ מחזיר null על נושא זר, והמסך נופל על
     q.topic של null. עדיף לדלג בשקט מאשר להתרסק. */
  var pairs=(spec.q||[]).filter(function(x){return !!topicById(x[0])});
  /* מבחן שנבנה עם זרע לכל משבצת נבנה משבצת אחרי משבצת, וכל
     שאלה תלויה בזרע שלה בלבד — כך המורה יכול להחליף אחת מהן.
     מבחן ישן, בלי זרעים, חייב להיבנות בדיוק כפי שנבנה ביום
     שנשלח: אחרת הציון של מי שכבר נבחן משתנה למפרע. */
  if(pairs.length&&pairs.every(function(x){return typeof x[2]==="number"}))
    return pairs.map(function(p){return exBuildSlot(p)})
                .filter(function(q){return !!q});
  return withSeed(spec.s,function(){
    return pairs.map(function(pair){return buildQ(pair[0],pair[1])})
                .filter(function(q){return !!q});
  });
}
/* --- בחירת השאלות בידי המורה ---------------------------------
   עד כאן המורה בחר נושאים, רמה ומספר שאלות — והשאלות עצמן הוגרלו
   מאחורי גבו. הוא ראה אותן לראשונה רק אחרי שהמבחן כבר היה אצל
   התלמידים. מעכשיו כל שאלה היא משבצת נפרדת עם זרע משלה: המורה
   רואה אותה לפני השליחה, מחליף אותה בשאלה אחרת מאותו נושא,
   מסיר אותה, או מוסיף שאלה מנושא שחסר לו.

   הזרע הנפרד לכל משבצת הוא מה שמאפשר את זה. בזרם אקראי אחד
   ומשותף, כפי שהיה עד כאן, החלפה של השאלה השלישית הייתה משנה
   גם את הרביעית ואת החמישית — כלומר לא "החלפה" אלא הגרלה מחדש
   של כל מה שאחריה.

   24 ביט ולא 32: הזרע נוסע בתוך הקישור שנשלח בוואטסאפ, וזרע
   קצר יותר הוא קישור קצר יותר. שישה־עשר מיליון אפשרויות למשבצת
   הן הרבה מעבר למה שהמחולל עצמו יודע לייצר. */
function exNewSeed(){return (Math.random()*16777215)>>>0}
function exSlot(topicId,level){return [topicId,level,exNewSeed()]}
/* אותו זרע → אותה שאלה בדיוק: אצל המורה כשהוא בוחר, ואצל
   התלמיד כשהוא נבחן. */
function exBuildSlot(slot){
  if(!slot||!topicById(slot[0]))return null;
  return withSeed(slot[2],function(){return buildQ(slot[0],slot[1])})||null;
}
/* מסך הבנייה מצייר את עצמו מחדש אחרי כל לחיצה, ובניית עשרים
   וחמש שאלות בכל ציור מיותרת. המטמון הוא לתצוגה בלבד — מי
   שנבחן בונה את שאלותיו מחדש, כדי שאיש לא יערוך בטעות אובייקט
   שגם מסך אחר מחזיק בו. */
var EXQCACHE={};
/* לכל אפליקציה מנגנון שפה משלה, ולא לכולן אותם שמות. הפנייה
   דרך window ולא בשם ישיר, כי שם שאינו קיים באפליקציה מסוימת
   הוא שגיאה בעיני הבודקים — רעש שמסתיר שגיאה אמיתית. */
function exLangKey(){
  try{
    var g=(typeof window!=="undefined")?window:{};
    if(typeof g.xlg==="function")return g.xlg();
    if(typeof g.LG==="string")return g.LG;
    return (state&&state.settings&&state.settings.lang)||"he";
  }catch(e){return "he"}
}
function exPreviewQ(slot){
  if(!slot)return null;
  var k=slot[0]+"|"+slot[1]+"|"+slot[2]+"|"+exLangKey();
  if(!(k in EXQCACHE)){
    /* מורה שמחליף שאלות שוב ושוב מייצר מפתח חדש בכל לחיצה.
       מטמון שרק גדל הוא דליפה; מרוקנים אותו ומתחילים מחדש. */
    if(Object.keys(EXQCACHE).length>400)EXQCACHE={};
    EXQCACHE[k]=exBuildSlot(slot);
  }
  return EXQCACHE[k];
}
function exTopicName(id){
  var t=topicById(id); if(!t)return "";
  var g=(typeof window!=="undefined")?window:{};
  return (typeof g.tName==="function"?g.tName(t):t.name)||"";
}
function exRightAnswer(q){
  var i; if(!q||!q.options)return null;
  for(i=0;i<q.options.length;i++)if(q.options[i].ok)return q.options[i];
  return null;
}
/* המשבצות שהמורה עורך. נבנות מחדש רק כשנושא, רמה או מספר
   השאלות משתנים; עריכה של משבצת בודדת נשמרת. */
function exSlots(){
  if(EB.q&&EB.q.length)return EB.q;
  var tops=EB.topics.filter(function(x){return topicById(x)});
  if(!tops.length)tops=topicsForTrack(state.track).slice(0,3).map(function(t){return t.id});
  var q=[],i;
  for(i=0;i<EB.n;i++)q.push(exSlot(tops[i%tops.length],EB.level));
  /* מערבבים כאן ולא בשליחה: המורה רואה את הסדר הסופי ומאשר אותו. */
  EB.q=shuffle(q);
  return EB.q;
}
function examUrl(spec){
  var base=location.origin+location.pathname;
  return base+"#x="+encodeExam(spec);
}
function waLink(text,phone){
  var p=String(phone||"").replace(/[^0-9]/g,"");
  return "https://wa.me/"+p+"?text="+encodeURIComponent(text);
}

/* --- אחסון מבחנים והגשות, בנפרד מהתקדמות התלמיד --- */
var EX={list:[]};
/* --- הגירה מהמפתח המשותף הישן ---------------------------------
   עד הגרסה הזאת כל האפליקציות כתבו מבחנים לאותו מפתח localStorage
   ובאותו origin, ולכן מבחן שנבנה במתמטיקה הופיע ברשימת המבחנים של
   אנגלית והפיל את המסך. מעכשיו לכל אפליקציה מפתח משלה, ובטעינה
   מועתקות מהמפתח הישן רק רשומות שכל נושאיהן מוכרים כאן.
   המפתח הישן נשאר על כנו ואינו נמחק, כדי שגם אפליקציה אחרת תוכל
   לקלוט ממנו את המבחנים ששייכים לה. --------------------------- */
function exSpecKnown(spec){
  if(!spec||!spec.q||!spec.q.length)return false;
  for(var i=0;i<spec.q.length;i++){
    var pair=spec.q[i];
    if(!pair||!topicById(pair[0]))return false;
  }
  return true;
}
function exAdoptLegacy(){
  var added=0;
  try{
    var raw=localStorage.getItem(EKEY_OLD); if(!raw)return;
    var old=JSON.parse(raw); if(!old||!old.list||!old.list.length)return;
    var have={},i,ex;
    for(i=0;i<EX.list.length;i++)have[EX.list[i].id]=1;
    for(i=0;i<old.list.length;i++){
      ex=old.list[i];
      if(!ex||!ex.id||have[ex.id])continue;
      if(!exSpecKnown(ex.spec))continue;
      EX.list.push(ex); have[ex.id]=1; added++;
    }
  }catch(e){return}
  if(added)exSave();

function xlg(){return LG}
function xt(k){var d=XT[xlg()];var v=d&&d[k];return v===undefined?(XK[k]===undefined?k:XK[k]):v}
/* {0} ו-{1} — סדר המילים משתנה בין השפות, ולכן מספרים ולא רצף */
function xf(k){var s=xt(k),a=arguments,i;
  for(i=1;i<a.length;i++)s=s.split("{"+(i-1)+"}").join(String(a[i]));
  return s}

function viewExamSlots(){
  var ls=exSlots(),h="",tops=EB.topics.filter(function(x){return topicById(x)});
  h+='<div style="margin-top:18px"><b>'+esc(xt("exQs"))+'</b>'+
     '<p class="sub" style="margin:4px 0 8px">'+esc(xt("exQsNote"))+'</p>';
  h+='<div class="row" style="margin:0 0 10px">'+
     '<button class="xq-b" data-a="exqans" aria-pressed="'+(EB.ans?"true":"false")+'">'+
     (EB.ans?esc(xt("exQsHide")):esc(xt("exQsShow")))+'</button>'+
     '<button class="xq-b" data-a="exqreset">'+esc(xt("exQsReset"))+'</button></div>';
  h+='<ol class="xq-list">';
  ls.forEach(function(sl,i){
    var q=exPreviewQ(sl),ok=exRightAnswer(q);
    h+='<li class="xq"><div class="xq-top">'+
       '<span class="xq-n">'+(i+1)+'</span>'+
       '<span class="xq-tp">'+esc(q&&q.topicName?q.topicName:exTopicName(sl[0]))+'</span>'+
       '<span class="xq-acts">'+
       '<button class="xq-b" data-a="exqroll" data-i="'+i+'">'+esc(xt("exQsSwap"))+'</button>'+
       /* המבחן חייב להישאר עם שאלה אחת לפחות, ולכן הכפתור נעלם
          ולא מוצג כבוי: כפתור שאי אפשר ללחוץ עליו מבלבל. */
       (ls.length>1?'<button class="xq-b" data-a="exqdel" data-i="'+i+'">'+esc(xt("exQsDrop"))+'</button>':"")+
       '</span></div>';
    if(q){
      h+='<div class="xq-q">'+q.ask+(q.expr?'<div class="xq-e">'+q.expr+'</div>':"")+'</div>';
      if(EB.ans&&ok)h+='<div class="xq-a"><b>'+esc(xt("exQsAns"))+'</b> '+ok.h+'</div>';
    }else h+='<div class="xq-q sub">'+esc(xt("exQsFail"))+'</div>';
    h+='</li>';
  });
  h+='</ol>';
  /* כפתור לכל נושא שנבחר, כדי שהמורה יוסיף בדיוק את מה שחסר לו
     ולא שאלה אקראית מנושא כלשהו. */
  if(tops.length){
    h+='<div class="row xq-add"><span class="sub">'+esc(xt("exQsAdd"))+'</span>';
    tops.forEach(function(id){
      h+='<button class="xq-b" data-a="exqadd" data-t="'+esc(id)+'">'+
         '<b aria-hidden="true">+</b> <span>'+esc(exTopicName(id))+'</span></button>';
    });
    h+='</div>';
  }
  return h+'</div>';
}

var MK={open:"",paste:"",msg:null,del:""};
function viewMarks(){
  var h='<div class="wrap" style="padding-block:22px">';
  h+='<h1 class="h1">'+esc(xt("mkTitle"))+'</h1>'+
     '<p class="sub">'+esc(xt("mkLead"))+'</p>';
  h+='<div class="row" style="margin-top:14px"><button class="btn btn-p" data-a="go" data-v="exam">'+
     ic("plus",17)+' '+esc(xt("mkNew"))+'</button></div>';

  if(!EX.list.length){
    h+='<div class="card pad" style="margin-top:16px"><p class="sub" style="margin:0">'+
       esc(xt("mkEmpty"))+'</p></div>';
    return h+'</div>';
  }
  EX.list.forEach(function(ex){
    var open=MK.open===ex.id;
    var subs=ex.subs||[];
    var avg=subs.length?Math.round(subs.reduce(function(a,b){return a+b.pct},0)/subs.length):0;
    h+='<div class="card pad" style="margin-top:14px">';
    h+='<button class="row" data-a="mkopen" data-i="'+esc(ex.id)+'" style="width:100%;background:none;border:0;text-align:start;cursor:pointer">'+
       '<span style="flex:1;min-width:0"><b>'+esc(ex.spec.t||xt("exam"))+'</b>'+
       '<span class="sub" style="display:block">'+ex.spec.q.length+' '+esc(xt("qs"))+' · '+esc(ex.date)+
       ' · '+subs.length+' '+esc(xt("mkSubs"))+(subs.length?' · '+esc(xt("mkAvg"))+' '+avg:'')+'</span></span>'+
       '<span class="chip'+(subs.length?(avg>=70?" ok":avg>=55?" warn":" bad"):"")+'">'+
       (subs.length?avg+"%":"—")+'</span></button>';
    if(!open){h+='</div>';return}

    h+='<div style="margin-top:14px"><label class="tt"><b>'+esc(xt("mkPaste"))+'</b></label>'+
       '<textarea class="field" id="mkPaste" rows="3" placeholder="'+esc(xt("mkPastePh"))+'"></textarea>'+
       '<div class="row" style="margin-top:8px">'+
       '<button class="btn btn-p" data-a="mkadd" data-i="'+esc(ex.id)+'">'+ic("check",17)+' '+esc(xt("mkTake"))+'</button>'+
       '<a class="btn" href="'+esc(waLink((ex.spec.t||xt("exam"))+"\n"+examUrl(ex.spec),""))+'" target="_blank" rel="noopener">'+
       ic("share",17)+' '+esc(xt("mkResend"))+'</a>'+
       (subs.length?'<button class="btn btn-g" data-a="mkcopy" data-i="'+esc(ex.id)+'">'+ic("copy",17)+' '+esc(xt("mkCopyTbl"))+'</button>'+
         '<button class="btn btn-g" data-a="mkcsv" data-i="'+esc(ex.id)+'">'+ic("share",17)+' '+esc(xt("mkCsv"))+'</button>':"")+
       (MK.del===ex.id?
         '<span class="row" style="gap:6px"><span class="chip bad">'+esc(xf("mkDelQ",subs.length||0))+'</span>'+
         '<button class="btn btn-d" data-a="mkdelyes" data-i="'+esc(ex.id)+'">'+esc(xt("mkDelYes"))+'</button>'+
         '<button class="btn btn-g" data-a="mkdelno">'+esc(xt("mkCancel"))+'</button></span>':
         '<button class="btn btn-g" data-a="mkdel" data-i="'+esc(ex.id)+'">'+esc(xt("mkDel"))+'</button>')+
       '</div>';
    if(MK.msg&&MK.msg.id===ex.id)
      h+='<p class="chip '+(MK.msg.ok?"ok":"bad")+'" style="margin-top:10px">'+esc(MK.msg.m)+'</p>';
    h+='</div>';

    if(subs.length){
      /* לפי תלמיד */
      h+='<div style="margin-top:16px"><b>'+esc(xt("mkByStudent"))+'</b>';
      subs.slice().sort(function(a,b){return b.pct-a.pct}).forEach(function(s){
        var wrong=s.per.filter(function(p){return !p.ok});
        h+='<div class="tog" style="align-items:flex-start"><span class="tt"><b>'+esc(s.name||xt("mkNoName"))+'</b>'+
          '<span>'+s.ok+' '+esc(xt("outOf"))+' '+s.n+
          (wrong.length?' · '+esc(xt("mkFell"))+' '+esc(uniq(wrong.map(function(p){return p.topicName})).join(", ")):' · '+esc(xt("mkAllOk")))+
          (s.valid?"":' · <b style="color:var(--bad)">'+esc(xt("mkBadCode"))+'</b>')+'</span></span>'+
          '<span class="chip '+(s.pct>=70?"ok":s.pct>=55?"warn":"bad")+'">'+s.pct+'%</span></div>';
      });
      h+='</div>';
      /* לפי נושא — זה מה שמורה באמת צריך: לא מי נכשל, אלא מה ללמד שוב */
      var byT={};
      subs.forEach(function(s){s.per.forEach(function(p){
        if(!byT[p.topic])byT[p.topic]={n:0,ok:0,name:p.topicName};
        byT[p.topic].n++; byT[p.topic].ok+=p.ok;
      })});
      h+='<div style="margin-top:16px"><b>'+esc(xt("mkByTopic"))+'</b>'+
         '<p class="sub" style="margin:4px 0 8px">'+esc(xt("mkByTopicNote"))+'</p>';
      Object.keys(byT).map(function(k){var o=byT[k];o.pct=Math.round(100*o.ok/o.n);return o})
        .sort(function(a,b){return a.pct-b.pct}).forEach(function(o){
        h+='<div class="tog"><span class="tt"><b>'+esc(o.name)+'</b>'+
          '<span>'+o.ok+' '+esc(xt("mkRight"))+' '+o.n+'</span></span>'+
          '<span class="bar '+(o.pct>=70?"ok":o.pct>=40?"mid":"low")+'" style="width:90px;flex:none">'+
          '<i style="width:'+o.pct+'%"></i></span>'+
          '<span class="chip">'+o.pct+'%</span></div>';
      });
      h+='</div>';
    }
    h+='</div>';
  });
  return h+'</div>';
}
/* ------------------------------------------------------------
   ייצוא CSV של ההגשות.
   העתקת הטבלה נותנת טקסט מופרד בטאבים — נוח להדבקה, אבל לא קובץ.
   מורה שרוצה למיין, לסנן או לחשב ממוצע צריך גיליון. שורה לכל תלמיד,
   ועמודה לכל שאלה, כדי שאפשר יהיה לראות מיד באיזו שאלה נפלה הכיתה.
   ה-BOM בהתחלה הוא מה שגורם לאקסל לקרוא עברית, ערבית ורוסית נכון
   במקום ג׳יבריש — בלעדיו הקובץ נפתח שבור בדיוק אצל מי שצריך אותו.
   ------------------------------------------------------------ */
function csvCell(v){
  var s=(v===undefined||v===null)?"":String(v);
  return /[",\n\r;\t]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function csvRow(a){ return a.map(csvCell).join(",") }
/* ============================================================
   מצב מורה.
   בונה המבחן ומסך הציונים נועדו למורה. על טאבלט כיתתי, או על
   טלפון שהילד לוקח לעצמו, אין סיבה שהם יהיו במרחק הקשה אחת:
   ילד יכול למחוק מבחן, לראות ציונים של חברים, או לפתוח מבחן
   ולראות מראש את השאלות.
   זו אינה אבטחה, ואסור להציג אותה ככזאת: מי שיודע לפתוח כלי
   פיתוח יעקוף אותה בשנייה. זו נעילה מפני יד סקרנית — בדיוק מה
   שצריך כאן, ולא יותר.
   כל עוד לא נבחר קוד, שום דבר לא משתנה והמסכים גלויים כתמיד.
   ============================================================ */
var TE={ask:false,mode:"",msg:"",busy:false};
function teRead(){try{return JSON.parse(localStorage.getItem("axiom-teacher")||"null")}catch(e){return null}}
function teWrite(o){try{o===null?localStorage.removeItem("axiom-teacher"):localStorage.setItem("axiom-teacher",JSON.stringify(o))}catch(e){}}
function teHas(){var r=teRead();return !!(r&&r.h)}
function teOpen(){
  if(!teHas())return true;
  try{if(sessionStorage.getItem("axiom-teacher"+"-open")==="1")return true}catch(e){}
  try{if(localStorage.getItem("axiom-teacher"+"-open")==="1")return true}catch(e){}
  return false;
}
function teSetOpen(on,remember){
  try{sessionStorage.removeItem("axiom-teacher"+"-open")}catch(e){}
  try{localStorage.removeItem("axiom-teacher"+"-open")}catch(e){}
  if(!on)return;
  try{(remember?localStorage:sessionStorage).setItem("axiom-teacher"+"-open","1")}catch(e){}
}
/* גיבוב חלש כגיבוי בלבד. SubtleCrypto קיים בכל דפדפן מודרני
   בהקשר מאובטח, ו-GitHub Pages הוא כזה. */
function teWeak(s){var h=5381,i;for(i=0;i<s.length;i++)h=((h*33)^s.charCodeAt(i))>>>0;return "w"+h.toString(16)}
function teHash(pin,salt,cb){
  var msg=salt+"|"+pin;
  try{
    if(window.crypto&&crypto.subtle&&crypto.subtle.digest&&window.TextEncoder){
      crypto.subtle.digest("SHA-256",new TextEncoder().encode(msg)).then(function(d){
        var a=Array.prototype.slice.call(new Uint8Array(d));
        cb(a.map(function(b){return ("0"+b.toString(16)).slice(-2)}).join(""));
      },function(){cb(teWeak(msg))});
      return;
    }
  }catch(e){}
  cb(teWeak(msg));
}
function teSalt(){
  var s="";
  try{
    var a=new Uint8Array(8);crypto.getRandomValues(a);
    s=Array.prototype.slice.call(a).map(function(b){return ("0"+b.toString(16)).slice(-2)}).join("");
  }catch(e){ s=String(Date.now())+Math.random().toString(36).slice(2) }
  return s;
}
/* השהיה אחרי ניסיונות כושלים. ארבע ספרות הן עשרת אלפים
   אפשרויות, וילד סבלני יכול לנסות הרבה. */
function teWait(){
  var r=teRead();if(!r||!r.bad||r.bad<3)return 0;
  var pen=Math.min(300,Math.pow(2,r.bad-3)*5)*1000;
  var left=Math.ceil(((r.badAt||0)+pen-Date.now())/1000);
  return left>0?left:0;
}
function teDialog(){
  var wrap=document.getElementById("te-wrap");
  if(wrap&&wrap.parentNode)wrap.parentNode.removeChild(wrap);
  if(!TE.ask)return;
  var setting=(TE.mode==="set"||TE.mode==="change"||!teHas());
  var dirv=(LANGS[LG]&&LANGS[LG].dir)||"rtl";
  var w=document.createElement("div");
  w.id="te-wrap"; w.className="te-wrap"; w.dir=dirv;
  w.setAttribute("role","dialog"); w.setAttribute("aria-modal","true");
  var wait=teWait();
  w.innerHTML='<div class="te-box" tabindex="-1">'+
    '<h2>'+esc(setting?xt("teSet"):xt("teTitle"))+'</h2>'+
    '<p class="te-lead">'+esc(setting?xt("teLead"):xt("teEnter"))+'</p>'+
    (setting?'<p class="te-warn">'+esc(xt("teWarn"))+'</p>':'')+
    '<label class="te-lab" for="te-pin">'+esc(xt("tePin"))+'</label>'+
    '<input id="te-pin" class="te-in" type="password" inputmode="numeric" '+
      'autocomplete="off" maxlength="8" dir="ltr">'+
    (setting?'<label class="te-lab" for="te-pin2">'+esc(xt("teAgain"))+'</label>'+
      '<input id="te-pin2" class="te-in" type="password" inputmode="numeric" '+
      'autocomplete="off" maxlength="8" dir="ltr">':'')+
    '<label class="te-chk"><input type="checkbox" id="te-rem"> '+esc(xt("teRemember"))+'</label>'+
    '<p class="te-note">'+esc(xt("teRememberNote"))+'</p>'+
    (TE.msg?'<p class="te-msg" role="alert">'+esc(TE.msg)+'</p>':'')+
    (wait?'<p class="te-msg" role="alert">'+esc(xf("teWaitN",wait))+'</p>':'')+
    '<div class="te-row">'+
      '<button class="te-btn pri" id="te-ok"'+(wait?' disabled':'')+'>'+esc(xt("teOk"))+'</button>'+
      '<button class="te-btn" id="te-no">'+esc(xt("teCancel"))+'</button>'+
    '</div>'+
    (!setting&&teHas()?'<button class="te-btn link" id="te-forgot">'+esc(xt("teForgot"))+'</button>':'')+
    '</div>';
  document.body.appendChild(w);
  var box=w.firstChild, pin=document.getElementById("te-pin");
  box.focus(); if(pin&&!wait)pin.focus();
  /* מלכודת פוקוס, כמו בשער התנאים */
  w.addEventListener("keydown",function(e){
    if(e.key==="Escape"){teClose();return}
    if(e.key==="Enter"){e.preventDefault();teSubmit();return}
    if(e.key!=="Tab")return;
    var f=box.querySelectorAll("button:not([disabled]),input");
    if(!f.length)return;
    var a=f[0],z=f[f.length-1];
    if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}
    else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}
  });
  document.getElementById("te-no").onclick=teClose;
  document.getElementById("te-ok").onclick=teSubmit;
  var fg=document.getElementById("te-forgot");
  if(fg)fg.onclick=function(){ TE.msg=xt("teForgotHow"); teDialog() };
}
function teClose(){ TE.ask=false; TE.mode=""; TE.msg=""; teDialog(); }
function teSubmit(){
  if(TE.busy)return;
  var setting=(TE.mode==="set"||TE.mode==="change"||!teHas());
  var pin=(document.getElementById("te-pin")||{}).value||"";
  var rem=!!(document.getElementById("te-rem")||{}).checked;
  if(!/^[0-9]{4,8}$/.test(pin)){TE.msg=xt("teShort");teDialog();return}
  if(setting){
    var p2=(document.getElementById("te-pin2")||{}).value||"";
    if(pin!==p2){TE.msg=xt("teMismatch");teDialog();return}
    var salt=teSalt();
    TE.busy=true;
    teHash(pin,salt,function(h){
      TE.busy=false;
      teWrite({h:h,s:salt,bad:0,badAt:0});
      teSetOpen(true,rem);
      TE.ask=false;TE.mode="";TE.msg="";
      teDialog(); render();
    });
    return;
  }
  if(teWait()){teDialog();return}
  var rec=teRead(); if(!rec){teClose();return}
  TE.busy=true;
  teHash(pin,rec.s,function(h){
    TE.busy=false;
    if(h===rec.h){
      rec.bad=0;rec.badAt=0;teWrite(rec);
      teSetOpen(true,rem);
      TE.ask=false;TE.mode="";TE.msg="";
      teDialog(); render();
    }else{
      rec.bad=(rec.bad||0)+1;rec.badAt=Date.now();teWrite(rec);
      TE.msg=xt("teBad"); teDialog();
    }
  });
}
function teAsk(mode){ TE.ask=true; TE.mode=mode||""; TE.msg=""; teDialog() }
function teLock(){ teSetOpen(false); render() }
function teRemove(){ teWrite(null); teSetOpen(false); render() }
/* נעילה אוטומטית אחרי שהאפליקציה הייתה מוסתרת זמן־מה.
   מורה שבנה מבחן ומסר את הטאבלט בלי ללחוץ "יציאה" השאיר אותו
   פתוח, וזה בדיוק המצב שהתכונה אמורה למנוע. שתי דקות מספיקות
   כדי לא להפריע לעבודה רצופה, ולנעול כשהמכשיר עבר יד.
   נעילה שנשמרה כ"לזכור במכשיר הזה" היא בחירה מפורשת ולא נוגעים בה. */
var TE_HID=0;
try{
  document.addEventListener("visibilitychange",function(){
    if(document.hidden){ TE_HID=Date.now(); return }
    if(!TE_HID||!teHas())return;
    var away=Date.now()-TE_HID; TE_HID=0;
    if(away<120000)return;
    var kept=false;
    try{ kept=localStorage.getItem("axiom-teacher"+"-open")==="1" }catch(e){}
    if(kept)return;
    try{ if(sessionStorage.getItem("axiom-teacher"+"-open")!=="1")return }catch(e){ return }
    teSetOpen(false); render();
  });
}catch(e){}

/* ?teacher=1 פותח את החלון, והפרמטר מוסר מיד מהכתובת כדי שלא
   יישאר בקישור ששותף או בהיסטוריה. */
(function(){
  try{
    var u=new URL(location.href);
    if(u.searchParams.get("teacher")==="1"){
      u.searchParams.delete("teacher");
      history.replaceState(null,"",u.pathname+(u.searchParams.toString()?"?"+u.searchParams:"")+u.hash);
      /* שער התנאים יושב מעל הכול, וכך צריך להיות: אי־אפשר להשתמש
         באפליקציה לפני שהוסכם עליהם. חלון הקוד ממתין לו במקום
         להיפתח מתחתיו ולהיראות תקוע. */
      var tries=0;
      (function waitLegal(){
        if(tries++>=600){ teAsk(teHas()?"":"set"); return }
        /* LEGAL.accepted נוצר רק כש-protect.js מאותחל. עד אז אין
           עדיין מה לבדוק, ובדיקה של ".lg-wrap" לבדה מחזירה "אין
           שער" בדיוק ברגע שלפני שהוא נבנה. */
        var ready=false;
        try{ ready=!!(window.LEGAL&&window.LEGAL.accepted) }catch(e){}
        if(!ready){ setTimeout(waitLegal,200); return }
        var ok=true;
        try{ ok=!!window.LEGAL.accepted() }catch(e){ ok=true }
        if(!ok){ setTimeout(waitLegal,200); return }
        teAsk(teHas()?"":"set");
      })();
    }
  }catch(e){}
})();

function marksCsv(ex){
  var subs=(ex.subs||[]).slice().sort(function(a,b){return b.pct-a.pct});
  var n=ex.spec.q.length,i;
  var head=[xt("mkCsvName"),xt("mkCsvPct"),xt("mkCsvOk"),xt("mkCsvTotal"),
            xt("mkCsvDate"),xt("mkCsvValid")];
  for(i=0;i<n;i++)head.push(xf("mkCsvQ",i+1));
  var rows=[csvRow(head)];
  subs.forEach(function(s){
    var r=[s.name||xt("mkNoName"),s.pct,s.ok,s.n,s.date||"",
           s.valid?xt("mkCsvYes"):xt("mkCsvNo")];
    for(i=0;i<n;i++){
      var p=s.per&&s.per[i];
      r.push(p?(p.ok?xt("mkCsvYes"):xt("mkCsvNo")):"");
    }
    rows.push(csvRow(r));
  });
  return "\ufeff"+rows.join("\r\n")+"\r\n";
}
/* כרום מוחק את שם הקובץ כולו ברגע שיש בו תו אחד שאינו ASCII —
   לא רק עברית: גם é או מקף ארוך. מה שיורד נקרא "download", בלי
   סיומת, ואקסל לא יודע לפתוח אותו. מורה שקרא למבחן שלו בעברית
   קיבל קובץ בלי שם ובלי סוג. לכן השם מתועתק ללטינית. */
var TRLIT={
  "א":"a","ב":"b","ג":"g","ד":"d","ה":"h","ו":"v","ז":"z","ח":"ch","ט":"t","י":"y",
  "כ":"k","ך":"k","ל":"l","מ":"m","ם":"m","נ":"n","ן":"n","ס":"s","ע":"","פ":"f",
  "ף":"f","צ":"tz","ץ":"tz","ק":"k","ר":"r","ש":"sh","ת":"t",
  "ا":"a","ب":"b","ت":"t","ث":"th","ج":"j","ح":"h","خ":"kh","د":"d","ذ":"dh","ر":"r",
  "ز":"z","س":"s","ش":"sh","ص":"s","ض":"d","ط":"t","ظ":"z","ع":"","غ":"gh","ف":"f",
  "ق":"q","ك":"k","ل":"l","م":"m","ن":"n","ه":"h","و":"w","ي":"y","ة":"h","ى":"a","ء":"",
  "أ":"a","إ":"i","آ":"a","ؤ":"w","ئ":"y",
  "а":"a","б":"b","в":"v","г":"g","д":"d","е":"e","ё":"e","ж":"zh","з":"z","и":"i",
  "й":"y","к":"k","л":"l","м":"m","н":"n","о":"o","п":"p","р":"r","с":"s","т":"t",
  "у":"u","ф":"f","х":"kh","ц":"ts","ч":"ch","ш":"sh","щ":"sch","ъ":"","ы":"y","ь":"",
  "э":"e","ю":"yu","я":"ya"
};
function asciiName(s){
  var i,c,out="";
  /* é ו-ü הם אות לטינית ועוד סימן מצורף. פירוק והסרת הסימן משאיר e ו-u. */
  try{ s=s.normalize("NFD").replace(/[\u0300-\u036f]/g,"") }catch(e){}
  for(i=0;i<s.length;i++){
    c=s.charAt(i);
    if(/[A-Za-z0-9]/.test(c)){ out+=c; continue }
    var lower=c.toLowerCase();
    if(TRLIT[lower]!==undefined){ out+=TRLIT[lower]; continue }
    out+=" ";                     /* כל השאר — רווח, שיתכווץ בהמשך */
  }
  return out.replace(/\s+/g," ").trim();
}
function csvFileName(ex){
  var t=asciiName(String(ex.spec.t||"")).slice(0,60).trim();
  var d=String(ex.date||todayIso()).replace(/[^0-9-]/g,"");
  /* כשלא נשאר כלום קריא, מזהה המבחן הוא מה שמבדיל בין שני קבצים
     שירדו באותו יום. */
  if(!t) t="exam "+String(ex.id||"").slice(0,6);
  return (t+" "+d).trim()+".csv";
}
function downloadCsv(ex){
  var txt=marksCsv(ex),url=null,a=document.createElement("a");
  try{
    url=URL.createObjectURL(new Blob([txt],{type:"text/csv;charset=utf-8"}));
  }catch(e){
    url="data:text/csv;charset=utf-8,"+encodeURIComponent(txt);
  }
  a.href=url; a.download=csvFileName(ex);
  a.style.cssText="position:fixed;inset-inline-start:-9999px";
  document.body.appendChild(a); a.click();
  setTimeout(function(){
    if(a.parentNode)a.parentNode.removeChild(a);
    if(url&&url.indexOf("blob:")===0){try{URL.revokeObjectURL(url)}catch(e){}}
  },400);
}
function marksTable(ex){
  var out=(ex.spec.t||xt("exam"))+"\n";
  out+=xt("mkTblHead")+"\n";
  (ex.subs||[]).slice().sort(function(a,b){return b.pct-a.pct}).forEach(function(s){
    var wrong=uniq(s.per.filter(function(p){return !p.ok}).map(function(p){return p.topicName}));
    out+=(s.name||xt("mkNoName"))+"\t"+s.pct+"\t"+s.ok+"/"+s.n+"\t"+wrong.join(", ")+"\n";
  });
  return out;
}

/* ------------------------------------------------------------
   מסך התלמיד — מבחן מתוך קישור
   ------------------------------------------------------------ */
var SIT={spec:null,id:"",qs:[],i:0,name:"",answers:[],flags:[],
         t0:0,tick:null,phase:"intro",code:"",copied:false};

/* ------------------------------------------------------------
   מבחן שנפתח מחדש — ריענון, שיחה נכנסת, נעילת מסך
   ------------------------------------------------------------
   תלמיד שדפדפן שלו רענן באמצע מבחן איבד עד כה את הכול. התשובות
   נשמרות עכשיו במכשיר, לפי מזהה המבחן, יחד עם שעת ההתחלה — כדי
   שגם טיימר לא יתאפס ויעניק זמן נוסף. השמירה מקומית בלבד.
   ------------------------------------------------------------ */
function sitKey(){return EKEY+"-run-"+SIT.id}
function sitSave(){
  if(!SIT.id)return;
  try{localStorage.setItem(sitKey(),JSON.stringify({
    n:SIT.name,a:SIT.answers,f:SIT.flags,t:SIT.t0,i:SIT.i,p:SIT.phase}))}catch(e){}
}
function sitKeyOld(){return EKEY_OLD+"-run-"+SIT.id}
function sitDrop(){try{localStorage.removeItem(sitKey());localStorage.removeItem(sitKeyOld())}catch(e){}}
function sitRestore(){
  if(!SIT.id)return false;
  try{
    /* מבחן שהתחיל לפני פיצול המפתחות נשמר תחת המפתח הישן. */
    var o=JSON.parse(localStorage.getItem(sitKey())||localStorage.getItem(sitKeyOld())||"null");
    if(!o||!o.a||!o.a.length)return false;
    SIT.qs=examQuestions(SIT.spec);
    if(o.a.length!==SIT.qs.length)return false;   /* מבחן אחר תחת אותו מזהה */
    SIT.name=o.n||""; SIT.answers=o.a;
    SIT.flags=o.f&&o.f.length===o.a.length?o.f:SIT.qs.map(function(){return false});
    SIT.t0=o.t||0; SIT.i=Math.min(Math.max(0,o.i|0),SIT.qs.length-1);
    SIT.phase=o.p==="done"?"done":"ask";
    if(SIT.phase==="done")SIT.code=encodeResult(SIT.id,SIT.name,SIT.answers);
    return true;
  }catch(e){return false}
}
/* שניות שנותרו, או null כשלא הוגדרה הגבלת זמן */
function sitLeft(){
  var m=SIT.spec&&SIT.spec.m;
  if(!m||!SIT.t0)return null;
  return Math.max(0,Math.round((SIT.t0+m*60000-Date.now())/1000));
}
function sitClock(){
  var l=sitLeft(); if(l===null)return "";
  var mm=Math.floor(l/60),ss=l%60;
  return mm+":"+(ss<10?"0":"")+ss;
}
/* הזמן נגמר — מגישים. לא מבקשים אישור: אישור שאיש לא לוחץ עליו
   פירושו מבחן שנשאר פתוח לנצח. */
function sitTimerOn(){
  sitTimerOff();
  if(sitLeft()===null)return;
  SIT.tick=setInterval(function(){
    if(SIT.phase!=="ask"){sitTimerOff();return}
    if(sitLeft()<=0){sitTimerOff();sitFinish();return}
    var el=$("#sitclock"); if(el)el.textContent=sitClock();
  },1000);
}
function sitTimerOff(){if(SIT.tick){clearInterval(SIT.tick);SIT.tick=null}}

function sitStart(){
  var nm=$("#sitName"); SIT.name=nm?nm.value.trim():"";
  SIT.qs=examQuestions(SIT.spec);
  /* אם לא נותרה אף שאלה שאפשר לבנות (למשל מבחן של אפליקציה אחרת),
     מציגים את מסך המבחן השבור במקום ליפול על שאלה שאינה קיימת. */
  if(!SIT.qs.length){view="badexam"; render(); return}
  SIT.answers=SIT.qs.map(function(){return -1});
  SIT.flags=SIT.qs.map(function(){return false});
  SIT.i=0; SIT.phase="ask"; SIT.t0=Date.now();
  sitSave(); sitTimerOn();
  window.scrollTo(0,0); render();
}
function sitAnswer(i){
  if(SIT.phase!=="ask")return;
  SIT.answers[SIT.i]=i;
  sitSave();
  sitNext();
}
/* סימון לחזרה אינו תשובה ואינו משנה אותה — הוא רק מסמן. */
function sitFlag(){
  if(SIT.phase!=="ask")return;
  SIT.flags[SIT.i]=!SIT.flags[SIT.i];
  sitSave(); render();
}
function sitNext(){
  if(SIT.i+1<SIT.qs.length){SIT.i++;window.scrollTo(0,0);render();return}
  /* לא מגישים בלחיצה על תשובה. לחיצה בטעות על האפשרות האחרונה
     אינה אמורה לסיים מבחן. */
  SIT.phase="review"; stopSpeak(); window.scrollTo(0,0); render();
}
function sitGo(i){
  SIT.i=clamp(i,0,SIT.qs.length-1); SIT.phase="ask";
  window.scrollTo(0,0); render();
}
function sitFinish(){
  SIT.phase="done";
  sitTimerOff();
  SIT.code=encodeResult(SIT.id,SIT.name,SIT.answers);
  sitSave();

}
function sitGrade(){
  var ok=0,i;
  for(i=0;i<SIT.qs.length;i++){
    var a=SIT.answers[i];
    if(a>=0&&SIT.qs[i].options[a]&&SIT.qs[i].options[a].ok)ok++;

  return {ok:ok,n:SIT.qs.length,pct:Math.round(100*ok/SIT.qs.length)};
}

function copyText(txt,done){
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(done,function(){fallbackCopy(txt,done)});
      return;
    }
  }catch(e){}
  fallbackCopy(txt,done);
}
function fallbackCopy(txt,done){
  try{
    var ta=document.createElement("textarea");
    ta.value=txt; ta.setAttribute("readonly","");
    ta.style.position="fixed"; ta.style.top="-1000px";
    document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); document.body.removeChild(ta);
    done();
  }catch(e){}
}
function examAction(a,el){
  /* --- בניית מבחן --- */
  if(a==="exlvl"){EB.level=parseInt(el.getAttribute("data-l"),10)||2;EB.q=null;EB.built=null;render();return true}
  if(a==="extopic"){
    var id=el.getAttribute("data-t"),k=EB.topics.indexOf(id);
    if(k>=0)EB.topics.splice(k,1);else EB.topics.push(id);
    EB.q=null;EB.built=null;render();return true;
  }
  if(a==="exflag"){var f=el.getAttribute("data-f");EB[f]=!EB[f];EB.built=null;render();return true}
  /* --- בחירת השאלות --- */
  if(a==="exqans"){EB.ans=!EB.ans;render();return true}
  if(a==="exqreset"){EB.q=null;EB.built=null;render();return true}
  if(a==="exqroll"){
    var qi=parseInt(el.getAttribute("data-i"),10),ql=exSlots();
    /* משבצת חדשה ולא רק זרע חדש, כדי שהמערך יישאר בן שלושה
       איברים גם אם מישהו יוסיף שדה בעתיד. */
    if(ql[qi])
      {ql[qi]=exSlot(ql[qi][0],ql[qi][1]);EB.built=null}
    render();return true;
  }
  if(a==="exqdel"){
    var di=parseInt(el.getAttribute("data-i"),10),dl=exSlots();
    /* מבחן בלי שאלות אינו מבחן. משאירים אחת. */
    if(dl.length>1&&di>=0&&di<dl.length){dl.splice(di,1);EB.n=dl.length;EB.built=null}
    render();return true;
  }
  if(a==="exqadd"){
    var at=el.getAttribute("data-t"),al=exSlots();
    /* עשרים וחמש — גם הגבול של המחוון, וגם מבחן ארוך דיו. */
    if(topicById(at)&&al.length<25){al.push(exSlot(at,EB.level));EB.n=al.length;EB.built=null}
    render();return true;
  }
  if(a==="exbuild"){
    var ti=$("#exTitle"),ph=$("#exPhone");
    EB.title=ti?ti.value.trim():""; EB.phone=ph?ph.value.trim():"";
    /* המבחן נארז מהמשבצות שעל המסך — אותן שאלות ואותו סדר
       שהמורה אישר. ערבוב כאן היה מסדר מחדש מבחן שכבר נבדק. */
    var q=exSlots().slice();
    var spec={v:GENV,t:EB.title||xt("exam"),s:(Math.random()*4294967295)>>>0,l:EB.level,
              q:q,r:!!EB.tts,f:!!EB.formulas,w:true,m:EB.mins||0};
    if(EB.phone)spec.p=EB.phone.replace(/[^0-9]/g,"");
    EB.built=spec; EB.copied="";
    var id=examId(spec);
    if(!exFind(id)){EX.list.unshift({id:id,spec:spec,date:todayIso(),subs:[]});exSave()}
    render(); return true;
  }
  if(a==="excopy"){var u=el.getAttribute("data-v");copyText(u,function(){EB.copied="url";render()});return true}

  /* --- ציונים --- */
  if(a==="mkopen"){var i2=el.getAttribute("data-i");MK.open=MK.open===i2?"":i2;MK.msg=null;render();return true}
  /* מחיקה מוחקת גם את כל ההגשות. שאלה אחת לפני זה היא לא נימוס —
     היא ההבדל בין טעות לבין אובדן של כיתה שלמה. */
  if(a==="mkdel"){MK.del=el.getAttribute("data-i");render();return true}
  if(a==="mkdelno"){MK.del="";render();return true}
  if(a==="mkdelyes"){
    var id3=el.getAttribute("data-i");
    EX.list=EX.list.filter(function(x){return x.id!==id3});
    exSave(); MK.open=""; MK.del=""; render(); return true;
  }
  if(a==="teask"){ teAsk(teHas()?"":"set"); return true }
  if(a==="techange"){ teAsk("change"); return true }
  if(a==="telock"){ teLock(); return true }
  if(a==="teremove"){ teRemove(); return true }
  if(a==="mkcsv"){
    var exc=exFind(el.getAttribute("data-i")); if(!exc)return true;
    downloadCsv(exc);
    MK.msg={id:exc.id,ok:true,m:xt("mkCsvDone")}; render();
    return true;
  }
  if(a==="mkcopy"){
    var ex4=exFind(el.getAttribute("data-i")); if(!ex4)return true;
    copyText(marksTable(ex4),function(){MK.msg={id:ex4.id,ok:true,m:xt("mkTblCopied")};render()});
    return true;
  }
  if(a==="mkadd"){
    var ex=exFind(el.getAttribute("data-i")); if(!ex)return true;
    var ta=$("#mkPaste"),raw=ta?ta.value:"";
    var res=decodeResult(raw);
    if(!res){MK.msg={id:ex.id,ok:false,m:xt("mkErrRead")};render();return true}
    if(res.i!==ex.id){
      var other=exFind(res.i);
      MK.msg={id:ex.id,ok:false,m:other?xf("mkErrOther",other.spec.t||xt("exam")):xt("mkErrUnknown")};
      render(); return true;
    }
    if(res.a.length!==ex.spec.q.length){
      MK.msg={id:ex.id,ok:false,m:xt("mkErrCount")};render();return true}
    var g=gradeResult(ex.spec,res);
    var sub={name:res.n||"",date:res.d||todayIso(),ok:g.ok,n:g.n,pct:g.pct,per:g.per,valid:!!res.ok};
    /* הגשה חוזרת של אותו תלמיד מחליפה את הקודמת ולא מצטברת לידה */
    /* הגשה חדשה מחליפה קודמת רק כששני השמות זהים אחרי נירמול, והשם
       אינו ריק. בלי זה כל ההגשות בלי שם נראו כאותו תלמיד ודרסו זו את
       זו בשקט, וגם "דני" מול "דני  " (רווח כפול פנימי) נחשבו לשניים. */
    var nrm=function(x){return String(x==null?"":x).replace(/\s+/g," ").trim()};
    var sn=nrm(sub.name);
    var k2=sn?(ex.subs||[]).findIndex(function(s){return nrm(s.name)===sn}):-1;
    if(!ex.subs)ex.subs=[];
    if(k2>=0)ex.subs[k2]=sub; else ex.subs.push(sub);
    exSave();
    MK.msg={id:ex.id,ok:true,m:(sub.name||xt("student"))+" "+xt("mkTaken")+" · "+g.pct+" ("+g.ok+"/"+g.n+")"+
      (sub.valid?"":" · "+xt("mkNoteBad"))};
    if(ta)ta.value="";
    render(); return true;
  }

  /* --- התלמיד --- */
  if(a==="sitstart"){sitStart();return true}
  if(a==="sitans"){sitAnswer(parseInt(el.getAttribute("data-i"),10));return true}
  if(a==="sitskip"){SIT.answers[SIT.i]=-1;sitSave();sitNext();return true}
  if(a==="sitflag"){sitFlag();return true}
  if(a==="sitprev"){sitGo(SIT.i-1);return true}
  if(a==="sitfwd"){sitNext();return true}
  if(a==="sitgo"){sitGo(parseInt(el.getAttribute("data-i"),10));return true}
  if(a==="sitfinish"){sitFinish();return true}
  if(a==="sitread"){var q2=SIT.qs[SIT.i];if(q2)speak(q2.say);return true}
  if(a==="sitform"){view="formulas";render();window.scrollTo(0,0);return true}
  if(a==="sitcopy"){copyText(SIT.code,function(){SIT.copied=true;render()});return true}
  if(a==="sitback"){view="sit";render();window.scrollTo(0,0);return true}
  return false;
}

/* קליטת מבחן מהכתובת. עושים את זה לפני ה-render הראשון, אחרת
   התלמיד רואה לרגע את מסך הבית של אפליקציה שהוא לא מכיר. */
function examFromUrl(){
  var m=String(location.hash||"").match(/^#x=(.+)$/);
  if(!m)return false;
  var sp=decodeExam(m[1]);
  if(!sp){
    view="badexam"; return true;
  }
  if(sp.v!==GENV){view="oldexam";return true}
  SIT.spec=sp; SIT.id=examId(sp); SIT.phase="intro";
  /* מבחן שכבר התחיל במכשיר הזה נמשך מהמקום שבו נעצר, עם הזמן
     שכבר חלף. בלי זה ריענון היה מוחק תשובות ומאפס טיימר. */
  if(sitRestore()&&SIT.phase==="ask")sitTimerOn();
  view="sit"; return true;
}

var LGFOOT={he:"© 2026 יהושע לגשטיין",ar:"© 2026 يهوشع لچشطاين",ru:"© 2026 Иехошуа Лагштейн",en:"© 2026 Joshua Lagstein"};

function render(){ try{lgChrome()}catch(e){}
  var html="";
  /* תלמיד שפתח את דף הנוסחאות באמצע מבחן חייב דרך חזרה מפורשת.
     סרגל הניווט הרגיל לא מכיר את המבחן ולא יחזיר אותו אליו. */
  if(view==="formulas"&&SIT.spec&&SIT.phase==="ask"){
    $("#app").innerHTML=header()+
      '<div class="wrap" style="padding-top:14px"><div class="row">'+
      '<button class="btn btn-p" data-a="sitback">'+ic("back",17)+' '+
      esc(xf("stBackTo",SIT.i+1,SIT.qs.length))+'</button></div></div>'+viewFormulas();
    afterRender(); return;
  }
  /* מבחן שהגיע מקישור עוקף הכול, כולל מסך הפתיחה: מי שנכנס להיבחן
     לא בהכרח פתח את האפליקציה הזאת אי פעם. */
  if(view==="sit"&&SIT.spec){ $("#app").innerHTML=viewSit(); afterRender(); return; }

    afterRender(); return;

  if(!state.onboarded){
    html=viewOnboard();
  }else{
    html=header();
    if(view==="home")html+=viewHome();
    else if(view==="practice")html+=viewPractice();
    else if(view==="topics")html+=viewTopics();
    else if(view==="formulas")html+=viewFormulas();
    else if(view==="progress")html+=viewProgress();
    else if(view==="settings")html+=viewSettings();
    else if(view==="exam")html+=teOpen()?viewExamNew():viewLocked();
    else if(view==="marks")html+=teOpen()?viewMarks():viewLocked();
    html+='<footer><div class="wrap fbar">'+
      _f("<span>אקסיומה · מתמטיקה לתואר ראשון, צעד אחר צעד</span>")+
      '<span class="faint">'+_('הכול נשמר במכשיר הזה ·')+' '+BUILD+'</span></div></footer>';
  }
  $("#app").innerHTML=html;
  afterRender();
}
function afterRender(){
  if(pendingScroll){
    var el=document.getElementById(pendingScroll);
    if(el){
      el.scrollIntoView({block:"center",behavior:state.settings.rm?"auto":"smooth"});
      el.style.outline="3px solid var(--accent)";el.style.outlineOffset="3px";
      setTimeout(function(){el.style.outline="";},2600);
    }
    pendingScroll=null;
  }
}
