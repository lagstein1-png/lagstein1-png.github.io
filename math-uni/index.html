}

/* ---------- 9. דטרמיננטה ---------- */
function genDet(L){
  /* ---- רמה 4 ----
     כאן לא נתונה מטריצה אלא רק שתי דטרמיננטות, והשאלה איזו תכונה
     מותר להפעיל. בכפל, בשחלוף, בהופכית ובריבוע יש כלל — ובחיבור אין,
     והדטרמיננטה של הסכום אינה נקבעת מהנתונים. */
  if(L===4){
    var P4=pick([-5,-4,-3,3,4,5]),Q4=pick([-5,-4,-3,3,4,5]),ex4=pick(["mul","sum","tr","inv","sq"]),g4=0;
    while((P4+Q4===0||P4*Q4===P4+Q4)&&g4++<40)Q4=pick([-5,-4,-3,3,4,5]);
    var unk=_("אי אפשר לקבוע מהנתונים");
    var head=_f("נתון ש-A ו-B הן מטריצות 2×2 עם det(A) = {0} ו-det(B) = {1}.", num(P4), num(Q4));
    if(ex4==="mul"){
      return {ask:head+" "+_("מהו det(AB)?"),expr:"det(AB) = ?",
        ans:W(num(P4*Q4)),
        wrong:[
          W(num(P4+Q4),_("חיברתם. הדטרמיננטה כפלית: det(AB) = det(A)·det(B), ואין כלל דומה לחיבור.")),
          W(num(P4),_("זו det(A) בלבד.")),
          W(unk,_("דווקא כאן אפשר: משפט הכפליות נותן את det(AB) מתוך שתי הדטרמיננטות."))
        ],
        steps:[
          S(_("שואלים קודם אם יש בכלל כלל"),_("לא לכל פעולה על מטריצות יש נוסחה לדטרמיננטה. לכפל, לשחלוף, להופכית ולחזקה יש — לחיבור אין."),
            _("כפל · שחלוף · הופכית · חזקה")),
          S(_("איזו תכונה חלה"),_("הדטרמיננטה כפלית: היא הופכת מכפלת מטריצות למכפלת מספרים."),"det(AB) = det(A)·det(B)"),
          S(_("מציבים"),"",num(P4)+" · "+pn(Q4)+" = "+num(P4*Q4))
        ],rule:"detprop",hint:_("det(AB) = det(A) כפול det(B).")};
    }
    if(ex4==="sum"){
      return {ask:head+" "+_("מהו det(A+B)?"),expr:"det(A+B) = ?",
        ans:W(unk),
        wrong:[
          W(num(P4+Q4),_("הדטרמיננטה אינה אדיטיבית. קל למצוא שתי מטריצות שסכומן מטריצת היחידה, ובכל זאת det שונה מסכום הדטרמיננטות.")),
          W(num(P4*Q4),_("כלל הכפליות תקף למכפלת מטריצות, לא לסכומן.")),
          W("0",_("אין שום סיבה שסכום של שתי מטריצות הפיכות יהיה סינגולרי."))
        ],
        steps:[
          S(_("איזו תכונה חלה"),_("לכפל יש כלל, לשחלוף יש כלל, להופכית יש כלל — לחיבור אין."),"det(A+B) ≠ det(A) + det(B)"),
          S(_("דוגמה נגדית"),_("קחו A = I ו-B = −I. אז det(A) = det(B) = 1, אבל A+B היא מטריצת האפס ו-det שלה 0, ולא 2."),
            "det(I) + det(−I) = 2   ,   det(I + (−I)) = 0"),
          S(_("המסקנה"),"",unk)
        ],rule:"detprop",hint:_("לדטרמיננטה של סכום אין נוסחה. חפשו דוגמה נגדית.")};
    }
    if(ex4==="tr"){
      return {ask:head+" "+_("מהו det(Aᵀ)?"),expr:"det(A<sup>T</sup>) = ?",
        ans:W(num(P4)),
        wrong:[
          W(num(-P4),_("שחלוף אינו הופך את הסימן. הוא אינו משנה את הדטרמיננטה כלל.")),
          W(fr(1,P4).html(),_("זו הדטרמיננטה של ההופכית, לא של המשוחלפת.")),
          W(unk,_("דווקא כאן אפשר: פיתוח לפי שורה של Aᵀ זהה לפיתוח לפי עמודה של A."))
        ],
        steps:[
          S(_("שואלים קודם אם יש בכלל כלל"),_("לא לכל פעולה על מטריצות יש נוסחה לדטרמיננטה. לכפל, לשחלוף, להופכית ולחזקה יש — לחיבור אין."),
            _("כפל · שחלוף · הופכית · חזקה")),
          S(_("איזו תכונה חלה"),_("שחלוף מחליף שורות בעמודות, והדטרמיננטה אדישה להחלפה הזאת."),"det(Aᵀ) = det(A)"),
          S(_("המסקנה"),"",num(P4))
        ],rule:"detprop",hint:_("שחלוף אינו משנה את הדטרמיננטה.")};
    }
    if(ex4==="inv"){
      return {ask:head+" "+_("מהו det(A⁻¹)?"),expr:"det(A<sup>−1</sup>) = ?",
        ans:W(fr(1,P4).html()),
        wrong:[
          W(num(P4),_("ההופכית הופכת גם את הדטרמיננטה.")),
          W(num(-P4),_("הסימן אינו מתהפך — הערך מתהפך.")),
          W(unk,_("דווקא כאן אפשר: מ-A·A⁻¹ = I ומכפליות הדטרמיננטה נובע הערך."))
        ],
        steps:[
          S(_("שואלים קודם אם יש בכלל כלל"),_("לא לכל פעולה על מטריצות יש נוסחה לדטרמיננטה. לכפל, לשחלוף, להופכית ולחזקה יש — לחיבור אין."),
            _("כפל · שחלוף · הופכית · חזקה")),
          S(_("מאיפה זה נובע"),_("מכפילים את A בהופכית שלה ומקבלים את מטריצת היחידה, שהדטרמיננטה שלה 1."),"det(A)·det(A⁻¹) = det(I) = 1"),
          S(_("מבודדים"),"","det(A⁻¹) = "+fr(1,P4).html())
        ],rule:"detprop",hint:_("det של ההופכית הוא ההופכי של det.")};
    }
    return {ask:head+" "+_("מהו det(A²)?"),expr:"det(A<sup>2</sup>) = ?",
      ans:W(num(P4*P4)),
      wrong:[
        W(num(2*P4),_("ריבוע של מטריצה הוא A·A, ולכן הדטרמיננטה מוכפלת בעצמה — לא כפול שתיים.")),
        W(num(P4),_("זו det(A) עצמה.")),
        W(unk,_("דווקא כאן אפשר: A² היא מכפלה, ולכן חל כלל הכפליות."))
      ],
      steps:[
        S(_("שואלים קודם אם יש בכלל כלל"),_("לא לכל פעולה על מטריצות יש נוסחה לדטרמיננטה. לכפל, לשחלוף, להופכית ולחזקה יש — לחיבור אין."),
          _("כפל · שחלוף · הופכית · חזקה")),
        S(_("איזו תכונה חלה"),_("A² היא מכפלה של A בעצמה, ולכן חל אותו כלל כפליות."),"det(A²) = det(A)·det(A)"),
        S(_("מציבים"),"",pn(P4)+"² = "+num(P4*P4))
      ],rule:"detprop",hint:_("det(A²) = det(A) בריבוע.")};
  }
  var a,b,c,d,steps;
  if(L===1){
    a=rnz(-8,8);b=rnz(-8,8);c=rnz(-8,8);d=rnz(-8,8);
    var det=a*d-b*c;
    return {ask:_("חשבו את הדטרמיננטה"),expr:"det "+mat([[a,b],[c,d]]),ans:W(num(det)),
      wrong:[
        W(num(a*d+b*c),_("חיברתם את שתי המכפלות. באלכסון המשני יש מינוס.")),
        W(num(b*c-a*d),_("הפכתם את הסדר. מתחילים מהאלכסון הראשי ומחסרים ממנו את המשני.")),
        W(num(a*b-c*d),_("הכפלתם שורות במקום אלכסונים."))
      ],
      steps:[
        S(_("נוסחת הדטרמיננטה למטריצה 2×2"),_("מכפלת האלכסון הראשי פחות מכפלת האלכסון המשני."),"det = ad − bc"),
        S(_("האלכסון הראשי"),"",num(a)+"·"+pn(d)+" = "+num(a*d)),
        S(_("האלכסון המשני"),"",num(b)+"·"+pn(c)+" = "+num(b*c)),
        S(_("מחסרים"),"",num(a*d)+" − "+pn(b*c)+" = "+num(det))
      ],rule:"det2",hint:_("אלכסון ראשי פחות אלכסון משני.")};
  }
  if(L===2){
    var M=[[rnz(-4,4),rnz(-4,4),rnz(-4,4)],[rnz(-4,4),rnz(-4,4),rnz(-4,4)],[rnz(-4,4),rnz(-4,4),rnz(-4,4)]];
    var p1=M[0][0]*(M[1][1]*M[2][2]-M[1][2]*M[2][1]);
    var p2=M[0][1]*(M[1][0]*M[2][2]-M[1][2]*M[2][0]);
    var p3=M[0][2]*(M[1][0]*M[2][1]-M[1][1]*M[2][0]);
    var det3=p1-p2+p3;
    return {ask:_("חשבו את הדטרמיננטה"),expr:"det "+mat(M),ans:W(num(det3)),
      wrong:[
        W(num(p1+p2+p3),_("חיברתם את שלושת האיברים. בפיתוח לפי שורה הסימנים מתחלפים: פלוס, מינוס, פלוס.")),
        W(num(p1-p2-p3),_("הסימן של האיבר השלישי צריך להיות פלוס.")),
        W(num(M[0][0]*M[1][1]*M[2][2]),_("הכפלתם רק את האלכסון הראשי. זה נכון רק במטריצה משולשת."))
      ],
      steps:[
        S(_("מפתחים לפי השורה הראשונה"),_("כל איבר מוכפל בדטרמיננטה של המטריצה שנשארת כשמוחקים את שורתו ועמודתו."),
          "det = a₁₁·M₁₁ − a₁₂·M₁₂ + a₁₃·M₁₃"),
        S(_("שימו לב לסימנים"),_("הם מתחלפים: פלוס, מינוס, פלוס. זה מקור טעות נפוץ מאוד."),"+ , − , +"),
        S(_("שלושת האיברים"),"",num(p1)+"  ,  "+num(p2)+"  ,  "+num(p3)),
        S(_("מחברים לפי הסימנים"),"",num(p1)+" − "+pn(p2)+" + "+pn(p3)+" = "+num(det3))
      ],rule:"det3",hint:_("פיתוח לפי שורה, וסימנים מתחלפים פלוס מינוס פלוס.")};
  }
  a=rnz(-6,6);b=rnz(-6,6);c=rnz(-6,6);d=rnz(-6,6);
  var D=a*d-b*c,k=rnz(2,4);
  return {ask:_f("נתון שהדטרמיננטה של מטריצה A בגודל 2×2 היא {0}. מהי הדטרמיננטה של {1}A?", num(D), k),
    expr:"det("+k+"A) = ?",ans:W(num(k*k*D)),
    wrong:[
      W(num(k*D),_("הכפלתם ב-k פעם אחת. כפל בסקלר מכפיל כל שורה, ובמטריצה n×n יש n שורות — לכן k בחזקת n.")),
      W(num(D),_("כפל בסקלר כן משנה את הדטרמיננטה.")),
      W(num(k*k*k*D),_("החזקה היא לפי סדר המטריצה. כאן 2×2, ולכן k בריבוע."))
    ],
    steps:[
      S(_("מה קורה כשמכפילים מטריצה בסקלר"),_("כל אחת מהשורות מוכפלת ב-k, וכל שורה כזאת מוציאה k מחוץ לדטרמיננטה."),
        "det(kA) = kⁿ · det(A)"),
      S(_("כאן n שווה 2"),"",	"det("+k+"A) = "+k+"² · "+num(D)),
      S(_("מחשבים"),"",num(k*k)+" · "+num(D)+" = "+num(k*k*D))
    ],rule:"detprop",hint:_("det(kA) = k בחזקת סדר המטריצה, כפול det(A).")};
}

/* ---------- 10. מטריצה הופכית ---------- */
function genInverse(L){
  /* ---- רמה 4 ----
     ברמה 3 נשאלת שאלת כן/לא על מטריצה נתונה. כאן יש פרמטר, וצריך
     לתרגם את תנאי ההפיכות למשוואה ולפתור אותה. מוגרלים גם המקרה
     שבו יש שני ערכים אסורים וגם המקרה שבו למשוואה אין פתרון ממשי
     כלל, ואז המטריצה הפיכה לכל t. */
  if(L===4){
    var k4=ri(1,4),neg=Math.random()<0.5,prod=k4*k4*(neg?-1:1);
    var divs=[],i4;
    for(i4=1;i4<=k4*k4;i4++)if((k4*k4)%i4===0)divs.push(i4);
    var u4=pick(divs),v4=(k4*k4)/u4;
    var b4=u4,c4=neg?-v4:v4;
    var oPair=_f("t = {0} וגם t = {1}", num(k4), num(-k4));
    var oOne=_f("רק t = {0}", num(k4));
    var oNone=_("אין ערך כזה — לכל t ממשי המטריצה הפיכה");
    var oZero=_("רק t = 0");
    return {ask:_("לאילו ערכי t המטריצה אינה הפיכה?"),
      expr:"A = "+mat([["t",b4],[c4,"t"]]),
      ans:W(neg?oNone:oPair),
      wrong:neg?[
        W(oPair,_f("t² = {0} אינה משוואה פתירה בממשיים — אין מספר ממשי שריבועו שלילי.", num(prod))),
        W(oOne,_f("t² = {0} אינה משוואה פתירה בממשיים — אין מספר ממשי שריבועו שלילי.", num(prod))),
        W(oZero,_f("ב-t = 0 הדטרמיננטה היא {0}, שונה מאפס, ולכן המטריצה דווקא הפיכה שם.", num(-prod)))
      ]:[
        W(oOne,_("למשוואה t² = c עם c חיובי שני פתרונות, ושניהם פוסלים את ההפיכות.")),
        W(oNone,_f("יש בהחלט ערכים כאלה: t² = {0} פתירה.", num(prod))),
        W(oZero,_f("ב-t = 0 הדטרמיננטה היא {0}, שונה מאפס, ולכן המטריצה דווקא הפיכה שם.", num(-prod)))
      ],
      steps:[
        S(_("תנאי ההפיכות"),_("מטריצה הפיכה אם ורק אם הדטרמיננטה שלה שונה מאפס. אז מחפשים מתי היא כן מתאפסת."),_("A הפיכה ⇔ det(A) ≠ 0")),
        S(_("מחשבים את הדטרמיננטה כפונקציה של t"),"","det(A) = t² − "+pn(b4)+"·"+pn(c4)+" = t² − "+pn(prod)),
        S(_("משווים לאפס"),"","t² = "+num(prod)),
        S(_("פותרים"),neg?_("ריבוע של מספר ממשי לעולם אינו שלילי, ולכן למשוואה אין פתרון והדטרמיננטה לעולם אינה מתאפסת.")
                        :_("שורש של מספר חיובי נותן שני פתרונות, חיובי ושלילי."),
          neg?oNone:oPair)
      ],rule:"inv2",hint:_("מחשבים det כפונקציה של t, משווים לאפס, ובודקים אם למשוואה יש פתרון ממשי בכלל.")};
  }
  var a,b,c,d,steps;
  if(L===1){
    /* det = 1 כדי שההופכית תצא שלמה */
    a=rnz(-4,4);b=rnz(-4,4);
    var tries=0;c=rnz(-4,4);d=0;
    /* d=0 היה מייצר 1/d = אינסוף במסיח "הפכתם כל איבר בנפרד" */
    while(tries<200){c=rnz(-4,4);if(a!==0&&(1+b*c)%a===0){d=(1+b*c)/a;if(d!==0&&Math.abs(d)<=9)break}tries++}
    if(tries>=200){a=1;b=2;c=1;d=3}
    var det=a*d-b*c;
    var inv=[[d/det,-b/det],[-c/det,a/det]];
    return {ask:_("מצאו את המטריצה ההופכית"),expr:"A = "+mat([[a,b],[c,d]]),ans:W(mat(inv)),
      wrong:[
        W(mat([[a,-b],[-c,d]]),_("החלפתם סימנים אבל לא החלפתם בין האיברים שעל האלכסון הראשי.")),
        W(mat([[d,b],[c,a]]),_("החלפתם בין a ל-d אבל שכחתם את המינוסים על האלכסון המשני.")),
        W(mat([[1/a,1/b],[1/c,1/d]].map(function(r){return r.map(function(v){return Math.round(v*100)/100})})),
          _("הפכתם כל איבר בנפרד. הופכית של מטריצה איננה מטריצת ההופכיים."))
      ],
      steps:[
        S(_("בודקים שהמטריצה הפיכה"),_("מטריצה הפיכה אם ורק אם הדטרמיננטה שלה שונה מאפס."),"det = "+num(a)+"·"+pn(d)+" − "+pn(b)+"·"+pn(c)+" = "+num(det)),
        S(_("נוסחת ההופכית ל-2×2"),_("מחליפים בין a ל-d, הופכים סימן ל-b ול-c, ומחלקים בדטרמיננטה."),
          "A⁻¹ = (1/det)·[[d, −b], [−c, a]]"),
        S(_("מציבים"),"",mat([[d,-b],[-c,a]])),
        S(_f("הדטרמיננטה כאן היא {0}", num(det)),"","A⁻¹ = "+mat(inv))
      ],rule:"inv2",hint:_("מחליפים a ו-d, הופכים סימן ל-b ול-c, ומחלקים בדטרמיננטה.")};
  }
  if(L===2){
    a=rnz(-5,5);b=rnz(-5,5);c=rnz(-5,5);d=rnz(-5,5);
    var D2=a*d-b*c;
    while(D2===0){d=rnz(-5,5);D2=a*d-b*c}
    return {ask:_("מהי הדטרמיננטה שבמכנה של המטריצה ההופכית?"),expr:"A = "+mat([[a,b],[c,d]]),
      ans:W(num(D2)),
      wrong:[
        W(num(a*d+b*c),_("סימן שגוי — האלכסון המשני מחוסר.")),
        W(num(a+d),_("זה העקבה, סכום האלכסון הראשי, ולא הדטרמיננטה.")),
        W(num(1/D2===Math.round(1/D2)?1/D2:Math.round(100/D2)/100),_("זה כבר ההופכי של הדטרמיננטה. השאלה מבקשת אותה עצמה."))
      ],
      steps:[
        S(_("ההופכית מוגדרת רק כשהדטרמיננטה שונה מאפס"),_("היא מופיעה במכנה, ולכן אפס היה הופך את הביטוי לחסר משמעות."),
          "A⁻¹ = (1/det)·adj(A)"),
        S(_("מחשבים"),"",	"det = "+num(a)+"·"+pn(d)+" − "+pn(b)+"·"+pn(c)),
        S(_("התוצאה"),"",num(D2))
      ],rule:"inv2",hint:_("הדטרמיננטה היא ad פחות bc, והיא זו שיושבת במכנה.")};
  }
  /* קודם עמדה כאן שאלת כן/לא על מטריצה מספרית, ולכן שני המסיחים
     האחרים — "הפיכה רק אם a שונה מאפס" ו"אי אפשר לדעת" — לא היו
     התשובה אף פעם, והתלמיד ניחש אחד לשניים. עכשיו בכל הגרלה יושב
     בפינה השמאלית העליונה הפרמטר a, וארבע האפשרויות הן ארבע
     התוצאות האפשריות של det(A) = a·d − b·c:
       d ≠ 0 ו-bc/d = 0  → הפיכה לכל a פרט לאפס
       d ≠ 0 ו-bc/d ≠ 0  → הפיכה לכל a פרט לערך אחר
       d = 0 ו-bc ≠ 0    → det קבוע ושונה מאפס, הפיכה לכל a
       d = 0 ו-bc = 0    → det קבוע ואפס, אינה הפיכה לאף a
     ארבעתן דורשות חישוב, ואף אחת מהן אינה נפסלת במבט. */
  var cs3=pick(["zero","kval","all","never"]),b3,c3,d3,m3;
  if(cs3==="zero"){b3=0;c3=rnz(-5,5);d3=rnz(-4,4)}
  else if(cs3==="kval"){m3=rnz(-3,3);c3=rnz(-4,4);d3=rnz(-4,4);b3=m3*d3}
  else if(cs3==="all"){b3=rnz(-5,5);c3=rnz(-5,5);d3=0}
  else{d3=0;if(Math.random()<0.5){b3=rnz(-5,5);c3=0}else{b3=0;c3=rnz(-5,5)}}
  var k3=(d3!==0)?(b3*c3)/d3:0;
  /* הערך המוצג במסיח הרביעי חייב להיות שונה מאפס ומהתשובה עצמה */
  var kShow=(cs3==="kval")?k3:rnz(-6,6);
  while(kShow===0||kShow===k3)kShow=rnz(-6,6);
  var detTxt=(d3!==0)?(num(d3)+"a"+sgn(-b3*c3)):num(-b3*c3);
  var oAll3=_("הפיכה לכל ערך של a"),oNever3=_("אינה הפיכה לאף ערך של a");
  var oZero3=_("הפיכה רק אם a שונה מאפס");
  var oK3=_f("הפיכה רק אם a שונה מ-{0}", num(cs3==="kval"?k3:kShow));
  var map3i=[["zero",oZero3],["kval",oK3],["all",oAll3],["never",oNever3]];
  var whyI=_f("det(A) = a·{0} − {1}·{2} = {3}. פותרים det(A) = 0 ורואים בדיוק אילו ערכי a נפסלים.", pn(d3), pn(b3), pn(c3), detTxt);
  return {ask:_("לאילו ערכי a המטריצה הפיכה?"),expr:"A = "+mat([["a",b3],[c3,d3]]),
    ans:W(map3i.filter(function(o){return o[0]===cs3})[0][1]),
    wrong:map3i.filter(function(o){return o[0]!==cs3}).map(function(o){return W(o[1],whyI)}),
    steps:[
      S(_("התנאי להפיכות"),_("מטריצה הפיכה אם ורק אם הדטרמיננטה שלה שונה מאפס."),_("A הפיכה ⇔ det(A) ≠ 0")),
      S(_("מחשבים את הדטרמיננטה כפונקציה של a"),"","det(A) = a·"+pn(d3)+" − "+pn(b3)+"·"+pn(c3)+" = "+detTxt),
      S(_("משווים לאפס"),(d3===0?_("a נעלם מהדטרמיננטה, ולכן היא קבועה — התשובה זהה לכל a."):_("זו משוואה לינארית אחת ב-a, ולה פתרון יחיד — הערך היחיד שנפסל.")),detTxt+" = 0"),
      S(_("מסקנה"),"",map3i.filter(function(o){return o[0]===cs3})[0][1])
    ],rule:"inv2",hint:_("מחשבים det כפונקציה של a. אם a נעלם ממנה — התשובה זהה לכל a.")};
}

/* ---------- 11. מערכת משוואות ודירוג ---------- */
function genLinEq(L){
  /* ---- רמה 4 ----
     מערכת עם פרמטר. הדטרמיננטה מתאפסת בערך אחד של t, ומה שקורה שם
     תלוי באגפים הימניים: אותה משוואה פעמיים, או שתי משוואות סותרות.
     שני המצבים מוגרלים, ולכן אי אפשר לנחש. */
  if(L===4){
    /* קודם היה t מופיע רק בשורה השנייה, ולכן הדטרמיננטה הייתה תמיד
       לינארית ב-t עם שורש אחד ושונה מאפס — ושתי אפשרויות, "לכל t יש
       פתרון יחיד" ו"t = 0", לא היו נכונות אף פעם. עכשיו מוגרלות גם
       מערכת שבה t מכפיל את x בשתי השורות (ואז הדטרמיננטה מתאפסת
       בדיוק ב-t = 0) ומערכת שבה t יושב על האלכסון (ואז הדטרמיננטה
       היא t² ועוד מספר חיובי, ולעולם אינה מתאפסת). */
    var ea1=rnz(-4,4),eb1=rnz(-4,4),k4=pick([-3,-2,2,3]),ec1=rnz(-9,9),cons=Math.random()<0.5;
    var eb2=eb1*k4,t0=ea1*k4,ec2=cons?ec1*k4:ec1*k4+rnz(1,4);
    var oNo=_f("t = {0} — ואז למערכת אין פתרון כלל", num(t0));
    var oInf=_f("t = {0} — ואז למערכת אינסוף פתרונות", num(t0));
    var oAll=_("לכל t יש פתרון יחיד");
    var oZero=_("t = 0 — ואז למערכת אין פתרון");
    var oZeroInf=_("t = 0 — ואז למערכת אינסוף פתרונות");
    var shape4=pick(["lin","lin","zero","all"]);
    if(shape4==="zero"){
      /* t·x + b₁y = c₁  ,  t·x + b₂y = c₂   →   det = t·(b₂ − b₁) */
      var zb1=rnz(-4,4),zb2=rnz(-4,4);
      while(zb2===zb1)zb2=rnz(-4,4);
      var zy=rnz(-4,4),zc1=zb1*zy,zc2=cons?zb2*zy:zb2*zy+rnz(1,3);
      var tW=zb2-zb1;
      return {ask:_("עבור אילו ערכי t אין למערכת פתרון יחיד, ומה קורה שם?"),
        expr:"t·x"+term(zb1,"y")+" = "+num(zc1)+"<br>t·x"+term(zb2,"y")+" = "+num(zc2),
        ans:W(cons?oZeroInf:oZero),
        wrong:[
          W(cons?oZero:oZeroInf,cons
            ?_f("ב-t = 0 שתי המשוואות נותנות ל-y את אותו ערך {0}, ו-x נשאר חופשי — ולכן דווקא אינסוף פתרונות.", num(zy))
            :_("ב-t = 0 שתי המשוואות מדברות על y בלבד ונותנות לו שני ערכים שונים — סתירה, ולכן אין פתרון.")),
          W(oAll,_("ב-t = 0 שני המקדמים של x מתאפסים יחד, הדטרמיננטה מתאפסת, ושם הפתרון אינו יחיד.")),
          W(_f("t = {0} — ואז למערכת אין פתרון כלל", num(tW)),
            _f("הדטרמיננטה היא t כפול {0}, והיא מתאפסת רק ב-t = 0.", num(tW)))
        ],
        steps:[
          S(_("מתי הפתרון אינו יחיד"),_("בדיוק כשהדטרמיננטה של מטריצת המקדמים מתאפסת. לפני כן זו רק משוואה אחת ב-t."),
            "det = t·"+pn(zb2)+" − t·"+pn(zb1)+" = t·"+pn(tW)),
          S(_("פותרים ל-t"),"","t·"+pn(tW)+" = 0  →  t = 0"),
          S(_("אבל זה עוד לא סוף התשובה"),_("דטרמיננטה מתאפסת פירושה ״לא יחיד״ — ועדיין צריך להכריע בין אינסוף פתרונות לבין אין פתרון."),
            _("בודקים את האגפים הימניים")),
          S(_("מציבים ומשווים"),cons?_("שתי המשוואות נותנות ל-y את אותו ערך, ו-x כלל אינו מופיע — ולכן הוא חופשי.")
                                   :_("שתי המשוואות דורשות מ-y שני ערכים שונים — סתירה."),
            num(zb1)+"y = "+num(zc1)+"   ,   "+num(zb2)+"y = "+num(zc2))
        ],rule:"gauss",hint:_("קודם מוצאים איפה הדטרמיננטה מתאפסת, ורק אז בודקים את האגפים הימניים.")};
    }
    if(shape4==="all"){
      /* t·x + b₁y = c₁  ,  b₂x + t·y = c₂   →   det = t² − b₁b₂ , ו-b₁b₂ שלילי */
      var ab1=ri(1,4),ab2=-ri(1,4),pos=-ab1*ab2,ac1=rnz(-9,9),ac2=rnz(-9,9);
      var atW=pick([ab1,-ab1,ri(1,4)]);
      return {ask:_("עבור אילו ערכי t אין למערכת פתרון יחיד, ומה קורה שם?"),
        expr:"t·x"+term(ab1,"y")+" = "+num(ac1)+"<br>"+coef(ab2,"x")+" + t·y = "+num(ac2),
        ans:W(oAll),
        wrong:[
          W(oZero,_f("ב-t = 0 הדטרמיננטה היא {0}, שונה מאפס, ולכן שם דווקא יש פתרון יחיד.", num(pos))),
          W(_f("t = {0} — ואז למערכת אין פתרון כלל", num(atW)),
            _f("הדטרמיננטה היא t² ועוד {0}, והיא חיובית לכל t ממשי — ולכן לעולם אינה מתאפסת.", num(pos))),
          W(_f("t = {0} — ואז למערכת אינסוף פתרונות", num(atW)),
            _f("הדטרמיננטה היא t² ועוד {0}, והיא חיובית לכל t ממשי — ולכן לעולם אינה מתאפסת.", num(pos)))
        ],
        steps:[
          S(_("מתי הפתרון אינו יחיד"),_("בדיוק כשהדטרמיננטה של מטריצת המקדמים מתאפסת. לפני כן זו רק משוואה אחת ב-t."),
            "det = t·t − "+pn(ab1)+"·"+pn(ab2)+" = t² + "+num(pos)),
          S(_("פותרים ל-t"),_("סכום של ריבוע ומספר חיובי לעולם אינו אפס."),"t² + "+num(pos)+" = 0   ⇒   "+_("אין פתרון ממשי")),
          S(_("מה זה אומר"),_("הדטרמיננטה שונה מאפס לכל t ממשי, ולכן המערכת הפיכה תמיד."),oAll),
          S(_("שימו לב"),_("פרמטר במערכת אינו מבטיח שיהיה לו ערך בעייתי. קודם בודקים אם הדטרמיננטה בכלל מתאפסת."),"")
        ],rule:"gauss",hint:_("קודם מוצאים איפה הדטרמיננטה מתאפסת, ורק אז בודקים את האגפים הימניים.")};
    }
    return {ask:_("עבור אילו ערכי t אין למערכת פתרון יחיד, ומה קורה שם?"),
      expr:coef(ea1,"x")+term(eb1,"y")+" = "+num(ec1)+"<br>t·x"+term(eb2,"y")+" = "+num(ec2),
      ans:W(cons?oInf:oNo),
      wrong:[
        W(cons?oNo:oInf,cons?_f("כשמכפילים את המשוואה הראשונה ב-{0} מתקבלת בדיוק המשוואה השנייה, כולל האגף הימני — אותה משוואה פעמיים, ולכן אינסוף פתרונות.", num(k4))
                            :_f("המקדמים אמנם פרופורציוניים ביחס {0}, אבל האגפים הימניים אינם — שתי משוואות סותרות, ולכן אין פתרון.", num(k4))),
        W(oAll,_f("ב-t = {0} הדטרמיננטה מתאפסת, ולכן שם הפתרון אינו יחיד.", num(t0))),
        W(oZero,_f("ב-t = 0 הדטרמיננטה היא {0}, שונה מאפס, ולכן שם דווקא יש פתרון יחיד.", num(ea1*eb2)))
      ],
      steps:[
        S(_("מתי הפתרון אינו יחיד"),_("בדיוק כשהדטרמיננטה של מטריצת המקדמים מתאפסת. לפני כן זו רק משוואה אחת ב-t."),
          "det = "+num(ea1)+"·"+pn(eb2)+" − t·"+pn(eb1)),
        S(_("פותרים ל-t"),"",num(ea1*eb2)+" − "+pn(eb1)+"t = 0  →  t = "+num(t0)),
        S(_("אבל זה עוד לא סוף התשובה"),_("דטרמיננטה מתאפסת פירושה ״לא יחיד״ — ועדיין צריך להכריע בין אינסוף פתרונות לבין אין פתרון."),
          _("בודקים את האגפים הימניים")),
        S(_("מציבים ומשווים"),cons?_("המשוואה השנייה היא בדיוק הראשונה מוכפלת, ולכן אין בה מידע חדש.")
                                 :_("המקדמים ביחס קבוע והאגפים לא — סתירה."),
          num(ec1)+" · "+pn(k4)+" = "+num(ec1*k4)+(cons?" = ":" ≠ ")+num(ec2))
      ],rule:"gauss",hint:_("קודם מוצאים איפה הדטרמיננטה מתאפסת, ורק אז בודקים את האגפים הימניים.")};
  }
  var x,y,a1,b1,c1,a2,b2,c2,steps;
  if(L===1){
    x=rnz(-7,7);y=rnz(-7,7);
    a1=rnz(-4,4);b1=rnz(-4,4);a2=rnz(-4,4);b2=rnz(-4,4);
    var t=0;
    while(a1*b2-a2*b1===0&&t<60){a2=rnz(-4,4);b2=rnz(-4,4);t++}
    if(a1*b2-a2*b1===0){a1=1;b1=1;a2=1;b2=-1}
    c1=a1*x+b1*y;c2=a2*x+b2*y;
    return {ask:_("פתרו את המערכת"),
      expr:coef(a1,"x")+term(b1,"y")+" = "+num(c1)+"<br>"+coef(a2,"x")+term(b2,"y")+" = "+num(c2),
      ans:W("x = "+num(x)+" , y = "+num(y)),
      wrong:[
        W("x = "+num(y)+" , y = "+num(x),_("החלפתם בין הנעלמים בסוף.")),
        W("x = "+num(-x)+" , y = "+num(y),_("טעות סימן בשלב הסילוק.")),
        W(_("אין פתרון"),_f("הדטרמיננטה של מטריצת המקדמים היא {0}, שונה מאפס, ולכן יש פתרון יחיד.", num(a1*b2-a2*b1)))
      ],
      steps:[
        S(_("כותבים כמטריצה מורחבת"),_("זו בדיוק אותה מערכת, רק בלי לכתוב שוב ושוב x ו-y."),
          mat([[a1,b1,c1],[a2,b2,c2]])),
        S(_("מסלקים נעלם"),_("מכפילים שורות כך שמקדמי y יתבטלו בחיבור."),
          num(a1*b2-a2*b1)+"x = "+num(c1*b2-c2*b1)),
        S(_("מוצאים x"),"","x = "+num(x)),
        S(_("מציבים חזרה ומוצאים y"),"","y = "+num(y))
      ],rule:"gauss",hint:_("מסלקים נעלם אחד, פותרים לשני, ומציבים חזרה.")};
  }
  if(L===2){
    a1=rnz(-4,4);b1=rnz(-4,4);
    var k=rnz(2,3);
    var kind=pick(["one","none","inf"]);
    a2=a1*k;b2=b1*k;c1=rnz(-9,9);
    if(kind==="one"){a2=b1;b2=-a1;c2=rnz(-9,9)}     /* דטרמיננטה שונה מאפס */
    else if(kind==="inf"){c2=c1*k}
    else{c2=c1*k+rnz(1,4)}
    var ansTxt=kind==="one"?_("פתרון יחיד"):kind==="inf"?_("אינסוף פתרונות"):_("אין פתרון");
    var det=a1*b2-a2*b1;
    return {ask:_("כמה פתרונות יש למערכת?"),
      expr:coef(a1,"x")+term(b1,"y")+" = "+num(c1)+"<br>"+coef(a2,"x")+term(b2,"y")+" = "+num(c2),
      ans:W(ansTxt),
      wrong:[_("פתרון יחיד"),_("אינסוף פתרונות"),_("אין פתרון")].filter(function(v){return v!==ansTxt})
        .map(function(v){return W(v,
          kind==="one"?_f("הדטרמיננטה היא {0}, שונה מאפס, ולכן הפתרון יחיד.", num(det))
          :kind==="inf"?_f("המשוואה השנייה היא בדיוק המשוואה הראשונה כפול {0} — אותה משוואה פעמיים, ולכן אינסוף פתרונות.", k)
          :_("המקדמים פרופורציוניים אבל האגפים הימניים לא — שתי משוואות סותרות, ולכן אין פתרון."))}),
      steps:[
        S(_("בודקים את הדטרמיננטה"),_("det שונה מאפס פירושו פתרון יחיד. det אפס דורש בדיקה נוספת."),
          "det = "+num(a1)+"·"+pn(b2)+" − "+pn(a2)+"·"+pn(b1)+" = "+num(det)),
        S(det!==0?_("דטרמיננטה שונה מאפס"):_("דטרמיננטה מתאפסת"),
          det!==0?_("השורות בלתי תלויות, והמערכת נחתכת בנקודה אחת בדיוק.")
                 :_("השורות פרופורציוניות. עכשיו בודקים אם גם האגפים הימניים באותו יחס."),
          det!==0?_("פתרון יחיד"):(kind==="inf"?_f("גם האגפים ביחס {0} → אותה משוואה", k):_("האגפים לא ביחס → סתירה"))),
        S(_("התשובה"),"",ansTxt)
      ],rule:"gauss",hint:_("דטרמיננטה שונה מאפס — פתרון יחיד. אפס — בודקים אם המשוואות זהות או סותרות.")};
  }
  /* רמה 3. קודם הוצגה כאן תמיד מערכת הומוגנית עם שורות תלויות, והשאלה
     הייתה "מדוע יש פתרון לא טריוויאלי" — תשובה אחת קבועה בכל הגרלה,
     והכיוון השני של הכלל (det ≠ 0 ← רק הפתרון הטריוויאלי) לא הודגם
     אף פעם. עכשיו מוגרלים שני המקרים, והפתרון עצמו נכתב במפורש. */
  a1=rnz(-4,4);b1=rnz(-4,4);
  var dep=Math.random()<0.5,k3=pick([-3,-2,2,3]),tt=0;
  if(dep){a2=a1*k3;b2=b1*k3}
  else{
    a2=rnz(-4,4);b2=rnz(-4,4);
    while(a1*b2-a2*b1===0&&tt<60){a2=rnz(-4,4);b2=rnz(-4,4);tt++}
    if(a1*b2-a2*b1===0){a2=b1;b2=-a1}
  }
  var det3=a1*b2-a2*b1,g3=gcd(a1,b1),dx=-b1/g3,dy=a1/g3;
  if(dy<0){dx=-dx;dy=-dy}
  /* כיוון הפתרון כשהשורות תלויות: (−b, a) מאפס את a·x + b·y */
  var lineTxt="x = "+coef(dx,"t")+" , y = "+coef(dy,"t");
  var trivTxt=_("רק x = 0 , y = 0");
  var coefTxt="x = "+coef(a1/g3,"t")+" , y = "+coef(b1/g3,"t");
  return {ask:_("מהי קבוצת הפתרונות של המערכת ההומוגנית?"),
    expr:coef(a1,"x")+term(b1,"y")+" = 0<br>"+coef(a2,"x")+term(b2,"y")+" = 0",
    ans:W(dep?lineTxt:trivTxt),
    wrong:[
      dep?W(trivTxt,_("הדטרמיננטה כאן מתאפסת, ולכן יש גם פתרונות שאינם אפס. הפתרון הטריוויאלי אינו היחיד."))
         :W(lineTxt,_("כאן הדטרמיננטה שונה מאפס, ולכן הפתרון היחיד הוא הטריוויאלי. ישר של פתרונות מתקבל רק כששתי השורות תלויות.")),
      W(coefTxt,_("לקחתם את וקטור המקדמים במקום את כיוון הפתרון. הציבו אותו במשוואה ותראו שהוא אינו מאפס אותה.")),
      W(_("אין פתרון"),_("למערכת הומוגנית תמיד יש לפחות את הפתרון x = 0 , y = 0, ולכן היא לעולם אינה חסרת פתרון."))
    ],
    steps:[
      S(_("מערכת הומוגנית תמיד פתירה"),_("הפתרון x=0, y=0 תמיד מקיים אותה. השאלה היא אם יש גם פתרון אחר."),
        _("x = 0 , y = 0 תמיד פתרון")),
      S(_("מתי יש פתרון נוסף"),_("בדיוק כאשר הדטרמיננטה מתאפסת, כלומר כשהשורות תלויות לינארית."),
        "det = "+num(det3)),
      S(dep?_("דטרמיננטה מתאפסת"):_("דטרמיננטה שונה מאפס"),
        dep?_f("השורה השנייה היא פי {0} מהראשונה, ולכן יש למעשה משוואה אחת ואינסוף פתרונות.", k3)
           :_("השורות בלתי תלויות, והמערכת נחתכת בנקודה אחת בדיוק."),
        dep?lineTxt:trivTxt)
    ],rule:"gauss",hint:_("דטרמיננטה אפס — ישר שלם של פתרונות. דטרמיננטה שונה מאפס — רק x = 0 , y = 0.")};
}

/* ---------- 12. וקטורים ---------- */
function genVectors(L){
  /* ---- רמה 4 ----
     ברמה 2 מחשבים מכפלה סקלרית ומקבלים מספר. כאן שואלים מה המספר
     הזה אומר: הסימן שלו קובע את סוג הזווית, בלי לחשב אורכים ובלי
     טבלת קוסינוסים. שלושת הכיוונים — חדה, ישרה וקהה — מוגרלים. */
  if(L===4){
    var u4,v4,dot4,cr4,g4=0,want=pick(["acute","right","obtuse"]);
    do{
      u4=[rnz(-5,5),rnz(-5,5)];
      if(want==="right"){var sc=pick([1,-1,2,-2]);v4=[-u4[1]*sc,u4[0]*sc]}
      else v4=[rnz(-5,5),rnz(-5,5)];
      dot4=u4[0]*v4[0]+u4[1]*v4[1];
      cr4=u4[0]*v4[1]-u4[1]*v4[0];
    }while((cr4===0||(want==="acute"&&dot4<=0)||(want==="obtuse"&&dot4>=0)||(want==="right"&&dot4!==0))&&g4++<300);
    var oAc=_("חדה — המכפלה הסקלרית חיובית"),oRt=_("ישרה — המכפלה הסקלרית מתאפסת"),oOb=_("קהה — המכפלה הסקלרית שלילית");
    var oCant=_("אי אפשר לקבוע בלי לחשב את אורכי הווקטורים");
    var map4=[["acute",oAc],["right",oRt],["obtuse",oOb]];
    var why4=_f("המכפלה הסקלרית כאן היא {0}, והסימן שלה הוא שקובע.", num(dot4));
    return {ask:_("איזו זווית כלואה בין שני הווקטורים?"),expr:"u = "+vecH(u4)+" ,  v = "+vecH(v4),
      ans:W(map4.filter(function(o){return o[0]===want})[0][1]),
      wrong:map4.filter(function(o){return o[0]!==want}).map(function(o){return W(o[1],why4)})
        .concat([W(oCant,_("האורכים תמיד חיוביים, ולכן הם אינם משפיעים על הסימן. הסימן של המכפלה הסקלרית לבדו קובע את סוג הזווית."))]),
      steps:[
        S(_("מאיפה מגיעה הזווית"),_("מהנוסחה u·v = |u|·|v|·cos α. שני האורכים חיוביים תמיד, ולכן הסימן של המכפלה הסקלרית הוא בדיוק הסימן של cos α."),
          "u·v = |u|·|v|·cos α"),
        S(_("מחשבים את המכפלה הסקלרית"),"",pn(u4[0])+"·"+pn(v4[0])+" + "+pn(u4[1])+"·"+pn(v4[1])+" = "+num(dot4)),
        S(_("קוראים את הסימן"),_("cos חיובי בזווית חדה, אפס בישרה, שלילי בקהה."),
          map4.filter(function(o){return o[0]===want})[0][1])
      ],rule:"dot",hint:_("סימן המכפלה הסקלרית הוא סימן הקוסינוס, והוא לבדו קובע את סוג הזווית.")};
  }
  var u,v,steps;
  var TRIP=[[3,4,5],[6,8,10],[5,12,13],[8,15,17],[9,12,15],[7,24,25]];
  if(L===1){
    var t=pick(TRIP);
    u=[t[0]*pick([1,-1]),t[1]*pick([1,-1])];
    return {ask:_("חשבו את אורך הווקטור"),expr:"u = "+vecH(u),ans:W(String(t[2])),
      wrong:[
        W(num(Math.abs(u[0])+Math.abs(u[1])),_("חיברתם את הרכיבים. האורך מחושב לפי פיתגורס, על הריבועים.")),
        W(num(t[2]*t[2]),_("עצרתם לפני הוצאת השורש.")),
        W(num(Math.abs(u[0]*u[1])),_("הכפלתם את הרכיבים."))
      ],
      steps:[
        S(_("נורמה היא פיתגורס"),_("האורך הוא שורש סכום ריבועי הרכיבים. הסימנים נעלמים בהעלאה בריבוע."),
          "|u| = √(u₁² + u₂²)"),
        S(_("מציבים"),"","√("+pn(u[0])+"² + "+pn(u[1])+"²) = √("+(u[0]*u[0])+" + "+(u[1]*u[1])+")"),
        S(_("מחשבים"),"","√"+(t[2]*t[2])+" = "+t[2])
      ],rule:"norm",hint:_("אורך וקטור = שורש של סכום ריבועי הרכיבים.")};
  }
  if(L===2){
    u=[rnz(-6,6),rnz(-6,6)];v=[rnz(-6,6),rnz(-6,6)];
    var dot=u[0]*v[0]+u[1]*v[1];
    return {ask:_("חשבו את המכפלה הסקלרית"),expr:"u = "+vecH(u)+" ,  v = "+vecH(v),
      ans:W(num(dot)),
      wrong:[
        W(vecH([u[0]*v[0],u[1]*v[1]]),_("התוצאה של מכפלה סקלרית היא מספר, לא וקטור. אחרי הכפל מחברים.")),
        W(num(u[0]*v[0]-u[1]*v[1]),_("חיסרתם בין המכפלות. במכפלה סקלרית מחברים.")),
        W(num(u[0]*v[1]+u[1]*v[0]),_("הצלבתם רכיבים. מכפילים רכיב ראשון ברכיב ראשון ושני בשני."))
      ],
      steps:[
        S(_("הגדרת המכפלה הסקלרית"),_("מכפילים רכיבים מתאימים ומחברים. התוצאה היא מספר יחיד."),
          "u·v = u₁v₁ + u₂v₂"),
        S(_("מציבים"),"",pn(u[0])+"·"+pn(v[0])+" + "+pn(u[1])+"·"+pn(v[1])),
        S(_("מחשבים"),"",num(u[0]*v[0])+" + "+pn(u[1]*v[1])+" = "+num(dot)),
        S(_("מה זה אומר"),dot===0?_("מכפלה סקלרית אפס פירושה שהווקטורים מאונכים."):_("המכפלה שונה מאפס, ולכן הווקטורים אינם מאונכים."),"")
      ],rule:"dot",hint:_("רכיב כפול רכיב, ואז מחברים. התוצאה מספר.")};
  }
  u=[rnz(-6,6),rnz(-6,6)];
  var w=[-u[1],u[0]];        /* מאונך לפי בנייה */
  var wNot=[u[0],rnz(-6,6)];
  while(u[0]*wNot[0]+u[1]*wNot[1]===0)wNot[1]=rnz(-6,6);
  return {ask:_("איזה מהווקטורים מאונך ל-u?"),expr:"u = "+vecH(u),
    ans:W(vecH(w)),
    wrong:[
      W(vecH([u[0],u[1]]),_("זה הווקטור עצמו. וקטור מאונך לעצמו רק אם הוא וקטור האפס.")),
      W(vecH([-u[0],-u[1]]),_("זה הווקטור ההפוך — הוא מקביל ל-u, לא מאונך לו.")),
      W(vecH(wNot),_f("המכפלה הסקלרית כאן היא {0} ולא אפס.", num(u[0]*wNot[0]+u[1]*wNot[1])))
    ],
    steps:[
      S(_("תנאי הניצבות"),_("שני וקטורים מאונכים בדיוק כאשר המכפלה הסקלרית שלהם מתאפסת."),"u·v = 0 ⇔ u ⊥ v"),
      S(_("בונים מאונך במישור"),_("מחליפים בין הרכיבים והופכים סימן לאחד מהם."),"u = (a,b) → (−b,a)"),
      S(_("בודקים"),"",pn(u[0])+"·"+pn(w[0])+" + "+pn(u[1])+"·"+pn(w[1])+" = 0")
    ],rule:"dot",hint:_("מאונכים כשהמכפלה הסקלרית אפס. במישור: מחליפים רכיבים והופכים סימן לאחד.")};
}

/* ---------- 13. ערכים עצמיים ---------- */
function genEigen(L){
  /* ---- רמה 4 ----
     רמות 1–3 מוצאות ערכים עצמיים ומפעילות עליהם פעולה. כאן השאלה
     אינה מה הערכים אלא מה מותר להסיק מהם: ערכים שונים מבטיחים
     לכסינות, ערך כפול אינו מבטיח דבר — וצריך להסתכל במטריצה עצמה
     כדי להבחין בין מטריצה סקלרית לבין בלוק ז׳ורדן. */
  if(L===4){
    var cs4=pick(["distinct","scalar","jordan"]),lm=rnz(-4,4),lz2=rnz(-4,4),bb=rnz(-4,4),g4=0;
    while(lz2===lm&&g4++<40)lz2=rnz(-4,4);
    if(lz2===lm)lz2=lm+1;
    var M4=cs4==="distinct"?[[lm,bb],[0,lz2]]:cs4==="scalar"?[[lm,0],[0,lm]]:[[lm,bb],[0,lm]];
    if(cs4!=="scalar"&&bb===0)M4[0][1]=bb=1;
    var oDist=_("כן — שני ערכים עצמיים ממשיים שונים, ולכן יש שני וקטורים עצמיים בלתי תלויים");
    var oScal=_("כן — המטריצה סקלרית, כלומר כבר אלכסונית, וכל וקטור הוא וקטור עצמי שלה");
    var oJord=_("לא — הערך העצמי כפול, אך המרחב העצמי שלו הוא ממימד אחד בלבד");
    var oDet=_("לא — הדטרמיננטה מתאפסת");
    var map4=[["distinct",oDist],["scalar",oScal],["jordan",oJord]];
    var evTxt=cs4==="distinct"?"λ = "+num(Math.min(lm,lz2))+" , λ = "+num(Math.max(lm,lz2)):_f("λ = {0} (ערך כפול)", num(lm));
    return {ask:_("האם המטריצה לכסינה?"),expr:"A = "+mat(M4),
      ans:W(map4.filter(function(o){return o[0]===cs4})[0][1]),
      wrong:map4.filter(function(o){return o[0]!==cs4}).map(function(o){return W(o[1],
        cs4==="distinct"?_f("איברי האלכסון כאן הם {0} ו-{1}, שני ערכים עצמיים שונים.", num(lm), num(lz2))
        :cs4==="scalar"?_f("כל האיברים מחוץ לאלכסון הם אפס, והאלכסון כולו {0}.", num(lm))
        :_f("הערך העצמי {0} מופיע פעמיים, והאיבר שמעל האלכסון שונה מאפס.", num(lm)))})
        .concat([W(oDet,_f("הדטרמיננטה כאן היא {0}, שונה מאפס — ובכל מקרה הפיכות ולכסינות הן שתי תכונות שונות לגמרי.", num(M4[0][0]*M4[1][1]-M4[0][1]*M4[1][0])))]),
      steps:[
        S(_("קודם הערכים העצמיים"),_("המטריצה משולשת, ולכן הם יושבים על האלכסון."),evTxt),
        S(_("מה הערכים מבטיחים ומה לא"),_("שני ערכים עצמיים שונים מבטיחים לכסינות. ערך כפול אינו מבטיח כלום לשום כיוון, וצריך לבדוק את המרחב העצמי."),
          _("ערכים שונים ⇒ לכסינה   ·   ערך כפול ⇒ צריך בדיקה")),
        S(_("המסקנה"),cs4==="jordan"?_("פותרים (A − λI)v = 0 ומוצאים ישר אחד של פתרונות בלבד, כלומר וקטור עצמי אחד — לא די בו לבסיס.")
                     :cs4==="scalar"?_("A − λI היא מטריצת האפס, ולכן כל וקטור פותר, והמרחב העצמי דו־ממדי.")
                     :_("שני וקטורים עצמיים לערכים שונים הם תמיד בלתי תלויים."),
          map4.filter(function(o){return o[0]===cs4})[0][1])
      ],rule:"eigen",hint:_("ערכים עצמיים שונים מספיקים ללכסינות. ערך כפול מחייב לבדוק את המרחב העצמי עצמו.")};
  }
  var l1,l2,a,b,c,d,steps;
  if(L===1){
    l1=rnz(-5,5);l2=rnz(-5,5);
    /* l2===-l1 הופך את המסיח "טעות סימן" לאותה קבוצת ערכים עצמיים
       עצמה — תשובה נכונה שנייה שמסומנת שגויה. והתנאי השלישי: כש-
       {−l1,−l2} שווה ל-{l1+l2, l1·l2} שני מסיחים מתלכדים זה בזה,
       והתלמיד רואה שלוש אפשרויות במקום ארבע. */
    while(l2===l1||l2===-l1||eqPair(-l1,-l2,l1+l2,l1*l2))l2=rnz(-5,5);
    a=l1;d=l2;b=rnz(-4,4);c=0;      /* משולשת — הערכים העצמיים על האלכסון */
    /* b===l2 הופך את המסיח "לקחתם איברים שאינם על האלכסון", שהוא
       {b, a}, לאותה קבוצה כמו התשובה {l1, l2}. */
    while(b===l2)b=rnz(-4,4);
    return {ask:_("מצאו את הערכים העצמיים"),expr:"A = "+mat([[a,b],[c,d]]),
      ans:W("λ = "+num(l1)+" , λ = "+num(l2)),
      wrong:[
        W("λ = "+num(b)+" , λ = "+num(a),_("לקחתם איברים שאינם על האלכסון. במטריצה משולשת הערכים העצמיים הם בדיוק איברי האלכסון.")),
        W("λ = "+num(a+d)+" , λ = "+num(a*d),_("אלה העקבה והדטרמיננטה, ולא הערכים העצמיים עצמם.")),
        W("λ = "+num(-l1)+" , λ = "+num(-l2),_("טעות סימן. במשוואה det(A−λI)=0 המינוס כבר נלקח בחשבון."))
      ],
      steps:[
        S(_("המשוואה האופיינית"),_("מחפשים λ שעבורו המטריצה A מינוס λI מאבדת הפיכות."),"det(A − λI) = 0"),
        S(_("כותבים את המטריצה"),"",mat([["a−λ",b],[c,"d−λ"]])),
        S(_("המטריצה משולשת"),_("כשיש אפס מתחת לאלכסון, הדטרמיננטה היא מכפלת האלכסון."),
          "("+num(a)+" − λ)("+num(d)+" − λ) = 0"),
        S(_("הפתרונות"),"","λ = "+num(l1)+"   ,   λ = "+num(l2))
      ],rule:"eigen",hint:_("במטריצה משולשת הערכים העצמיים יושבים על האלכסון.")};
  }
  l1=rnz(-4,4);l2=rnz(-4,4);
  /* כמו ברמה 1: קבוצה סימטרית מייתרת את המסיח של טעות הסימן. */
  while(l2===l1||l2===-l1)l2=rnz(-4,4);
  var tr=l1+l2,de=l1*l2;
  a=rnz(-4,4);d=tr-a;
  b=rnz(1,4);c=(a*d-de)/b;
  /* גם a שווה לאחד הערכים העצמיים נפסל: אז איברי האלכסון הם בדיוק
     הערכים העצמיים, והמסיח "לקחתם את האלכסון" נעשה תשובה נכונה. */
  var t2=0;
  while((Math.round(c)!==c||Math.abs(c)>9||a===l1||a===l2)&&t2<120){a=rnz(-4,4);d=tr-a;b=rnz(1,4);c=(a*d-de)/b;t2++}
  if(Math.round(c)!==c||a===l1||a===l2){
    var sh=1;while(sh===l2-l1)sh++;
    a=l1+sh;d=tr-a;b=1;c=a*d-de;
  }
  if(L===2){
    return {ask:_("מצאו את הערכים העצמיים"),expr:"A = "+mat([[a,b],[c,d]]),
      ans:W("λ = "+num(Math.min(l1,l2))+" , λ = "+num(Math.max(l1,l2))),
      wrong:[
        W("λ = "+num(a)+" , λ = "+num(d),_("לקחתם את איברי האלכסון. זה נכון רק במטריצה משולשת.")),
        W("λ = "+num(-Math.min(l1,l2))+" , λ = "+num(-Math.max(l1,l2)),_("טעות סימן בפתרון המשוואה הריבועית.")),
        W("λ = "+num(tr)+" , λ = "+num(de),_("אלה סכום ומכפלת הערכים העצמיים, לא הם עצמם."))
      ],
      steps:[
        S(_("שתי עובדות שחוסכות עבודה"),_("סכום הערכים העצמיים הוא העקבה, ומכפלתם היא הדטרמיננטה."),
          "λ₁+λ₂ = "+num(tr)+"   ,   λ₁·λ₂ = "+num(de)),
        S(_("המשוואה האופיינית"),"","λ²"+term(-tr,"λ")+sgn(de)+" = 0"),
        S(_("מפרקים לגורמים"),"","(λ"+sgn(-l1)+")(λ"+sgn(-l2)+") = 0"),
        S(_("הפתרונות"),"","λ = "+num(Math.min(l1,l2))+"   ,   λ = "+num(Math.max(l1,l2)))
      ],rule:"eigen",hint:_("סכום הערכים העצמיים הוא העקבה, ומכפלתם הדטרמיננטה.")};
  }
  /* רמה 3. קודם עמדה כאן שאלת תיאוריה יחידה, "סכום הערכים העצמיים
     שווה ל…", ולכן התשובה הנכונה הייתה אותה מילה בכל 500 ההגרלות.
     עכשיו זו שאלה מחושבת: מוצאים את הערכים העצמיים של A ואז מפעילים
     עליהם פעולה — וזה גם מדרג את הרמה מעל רמה 2, שבה עוצרים באמצע. */
  var op=pick(["sq","shift","scale"]);
  var kk=(op==="shift"?rnz(-4,4):pick([-3,-2,2,3]));
  var T=function(v){return op==="sq"?v*v:op==="shift"?v+kk:v*kk};
  var Wr=function(v){return op==="sq"?2*v:op==="shift"?v*kk:v+kk};
  var pair=function(p,q){return "λ = "+num(Math.min(p,q))+" , λ = "+num(Math.max(p,q))};
  var mEx=op==="sq"?"A²":op==="shift"?("A"+sgn(kk)+"I"):(num(kk)+"A");
  var ruleTxt=op==="sq"?_("ריבוע המטריצה מעלה בריבוע כל ערך עצמי: אם λ ערך עצמי של A, אז λ² ערך עצמי של A².")
    :op==="shift"?_("הוספת כפולה של מטריצת היחידה מוסיפה את אותו מספר לכל ערך עצמי: λ הופך ל-λ+k.")
    :_("כפל המטריצה בסקלר מכפיל בו כל ערך עצמי: λ הופך ל-k·λ.");
  return {ask:_f("מצאו את הערכים העצמיים של {0}", mEx),expr:"A = "+mat([[a,b],[c,d]]),
    ans:W(pair(T(l1),T(l2))),
    wrong:[
      W(pair(l1,l2),_("אלה הערכים העצמיים של A עצמה. עוד לא הפעלתם עליהם את הפעולה שבשאלה.")),
      W(pair(Wr(l1),Wr(l2)),ruleTxt),
      W(pair(T(a),T(d)),_("לקחתם את איברי האלכסון. זה נכון רק במטריצה משולשת."))
    ],
    steps:[
      S(_("קודם מוצאים את הערכים העצמיים של A"),_("סכום הערכים העצמיים הוא העקבה, ומכפלתם היא הדטרמיננטה."),
        "λ₁+λ₂ = "+num(tr)+"   ,   λ₁·λ₂ = "+num(de)),
      S(_("הפתרונות"),"","λ = "+num(Math.min(l1,l2))+"   ,   λ = "+num(Math.max(l1,l2))),
      S(_("מפעילים את הפעולה על כל ערך עצמי"),ruleTxt,mEx+"  →  "+pair(T(l1),T(l2)))
    ],rule:"eigen",hint:_("מוצאים את הערכים העצמיים של A, ואז מפעילים עליהם את אותה פעולה.")};
}

/* ============================================================
   מחוללי השאלות — הסתברות וסטטיסטיקה
   ============================================================ */

/* ---------- 14. קומבינטוריקה ---------- */
function genComb(L){
  /* ---- רמה 4 ----
     ברמות 1–3 נאמר במפורש אם הסדר משנה ואם יש חזרות, ולכן הנוסחה
     הייתה נתונה למעשה. כאן הסיפור מוגרל והנוסחה לא נאמרת: שתי
     ההכרעות — סדר וחזרות — הן כל השאלה. ארבע האפשרויות הן ארבעת
     המודלים, וערכיהן נבדקים כדי שלא ייצא ששניים מהם שווים. */
  if(L===4){
    var n4=ri(4,6),k4=ri(2,3),g4=0,cs4=pick(["all","choose","roles","code"]);
    var vC,vP,vR,vF;
    do{
      vC=Cnk(n4,k4);vP=Math.round(fact(n4)/fact(n4-k4));vR=Math.pow(n4,k4);vF=fact(n4);
      if(vC!==vP&&vC!==vR&&vC!==vF&&vP!==vR&&vP!==vF&&vR!==vF)break;
      n4=ri(4,6);k4=ri(2,3);
    }while(g4++<200);
    var story=cs4==="all"?_f("על מדף מסדרים את כל {0} הספרים בשורה. בכמה סדרים אפשר?", n4)
             :cs4==="choose"?_f("מתוך {0} מועמדים בוחרים ועדה של {1} חברים שווי מעמד. בכמה דרכים?", n4, k4)
             :cs4==="roles"?_f("מתוך {0} מועמדים בוחרים {1} לתפקידים שונים זה מזה. בכמה דרכים?", n4, k4)
             :_f("בונים סיסמה באורך {0} מתוך {1} תווים אפשריים, ותו יכול לחזור. בכמה דרכים?", k4, n4);
    var oF=_f("סידור של כל האיברים — n! = {0}", vF);
    var oC=_f("בלי סדר ובלי חזרות, צירופים — C(n,k) = {0}", vC);
    var oP=_f("עם סדר ובלי חזרות, חליפות — P(n,k) = {0}", vP);
    var oR=_f("עם סדר ועם חזרות — n בחזקת k = {0}", vR);
    var map4=[["all",oF],["choose",oC],["roles",oP],["code",oR]];
    var why4=_("שתי שאלות מכריעות כאן: האם הסדר משנה, והאם מותר לחזור על אותו פריט. ארבעת הצירופים נותנים ארבע נוסחאות שונות.");
    return {ask:_("איזו נוסחה מתאימה, ומה התוצאה?"),expr:story,
      ans:W(map4.filter(function(o){return o[0]===cs4})[0][1]),
      wrong:map4.filter(function(o){return o[0]!==cs4}).map(function(o){return W(o[1],why4)}),
      steps:[
        S(_("שאלה ראשונה: האם הסדר משנה?"),_("תפקידים שונים או מקומות בשורה — הסדר משנה. ועדה שכל חבריה שווים — לא משנה."),
          cs4==="choose"?_("הסדר אינו משנה"):_("הסדר משנה")),
        S(_("שאלה שנייה: האם מותר לחזור?"),_("אדם אינו יכול לשבת בשני מקומות, אבל תו בסיסמה כן יכול לחזור."),
          cs4==="code"?_("חזרות מותרות"):_("בלי חזרות")),
        S(_("ולכן הנוסחה"),"",map4.filter(function(o){return o[0]===cs4})[0][1])
      ],rule:cs4==="choose"?"comb":"perm",hint:_("קודם מכריעים סדר וחזרות, ורק אז בוחרים נוסחה.")};
  }
  var n,k,steps;
  if(L===1){
    /* n=4 נמחק כאן בשקט במשך כל חיי האפליקציה: שם n·n ו-2ⁿ שווים שניהם
       16, buildQ ראה שלוש אפשרויות בלבד והגריל מחדש. 2ⁿ הוחלף ב-(n−1)!,
       שאינו מתנגש באף n, והטווח הורחב. */
    n=ri(4,9);
    return {ask:_f("בכמה סדרים שונים אפשר להושיב {0} אנשים בשורה?", n),expr:"",
      ans:W(String(fact(n))),
      wrong:[
        W(String(n*n),_("הכפלתם ב-n בכל מקום. אחרי שאדם התיישב הוא כבר לא זמין, ולכן המספר יורד באחד בכל שלב.")),
        W(String(fact(n-1)),_f("זה מספר הסדרים של {0} אנשים בלבד — שכחתם את האחרון.", (n-1))),
        W(String(n*(n-1)),_("עצרתם אחרי שני מקומות. צריך להמשיך עד המקום האחרון."))
      ],
      steps:[
        S(_("סופרים מקום אחרי מקום"),_f("למקום הראשון יש {0} מועמדים. אחרי שאחד התיישב נשארו {1}, וכן הלאה.", n, (n-1)),
          n+" · "+(n-1)+" · … · 1"),
        S(_("זו בדיוק העצרת"),"","n! = "+n+"!"),
        S(_("מחשבים"),"","= "+fact(n))
      ],rule:"perm",hint:_("סידור של כל האנשים בשורה הוא n עצרת.")};
  }
  if(L===2){
    n=ri(5,9);k=ri(2,Math.min(4,n-1));
    var c=Cnk(n,k),p=Math.round(fact(n)/fact(n-k));
    return {ask:_f("בוחרים ועדה של {0} אנשים מתוך {1}. בכמה דרכים?", k, n),expr:"",
      ans:W(String(c)),
      wrong:[
        W(String(p),_f("ספרתם גם את הסדר. בוועדה אין תפקידים, ולכן צריך לחלק ב-{0}! כדי לא לספור את אותה קבוצה שוב ושוב.", k)),
        W(String(n*k),_("הכפלתם את המספרים. זו לא נוסחת הבחירה.")),
        W(String(Cnk(n,k-1)),_f("בחרתם {0} אנשים במקום {1}.", (k-1), k))
      ],
      steps:[
        S(_("סדר או לא סדר — זו השאלה"),_("בוועדה כל החברים שווים, ולכן הסדר לא משנה. במקרה כזה משתמשים בצירופים."),
          "C(n,k) = n! / (k!·(n−k)!)"),
        S(_("מציבים"),"","C("+n+","+k+") = "+n+"! / ("+k+"!·"+(n-k)+"!)"),
        S(_("מחשבים"),"","= "+c),
        S(_f("למה מחלקים ב-{0}!", k),_f("אילו ספרנו בסדר היינו מקבלים {0}, וכל ועדה הייתה נספרת {1} פעמים.", p, fact(k)),
          p+" ÷ "+fact(k)+" = "+c)
      ],rule:"comb",hint:_("אין סדר — צירופים. יש סדר — חליפות.")};
  }
  n=ri(4,6);k=ri(2,3);
  var perm=Math.round(fact(n)/fact(n-k));
  return {ask:_f("בוחרים {0} אנשים מתוך {1} לתפקידים שונים. בכמה דרכים?", k, n),expr:"",
    ans:W(String(perm)),
    wrong:[
      W(String(Cnk(n,k)),_("התעלמתם מהסדר. תפקידים שונים פירושם שהסדר כן משנה, ולכן חליפות ולא צירופים.")),
      W(String(fact(n)),_f("סידרתם את כולם. בוחרים רק {0} מתוך {1}.", k, n)),
      W(String(Math.pow(n,k)),_("אותו אדם לא יכול למלא שני תפקידים, ולכן אין החזרה."))
    ],
    steps:[
      S(_("כאן הסדר משנה"),_("מי שקיבל תפקיד א׳ אינו במצב זהה למי שקיבל תפקיד ב׳, ולכן זו חליפה."),
        "P(n,k) = n! / (n−k)!"),
      S(_("סופרים"),"",_f("למקום הראשון {0} אפשרויות, לשני {1}, וכן הלאה", n, (n-1))),
      S(_("מחשבים"),"","= "+perm)
    ],rule:"perm",hint:_("תפקידים שונים = הסדר משנה = חליפות.")};
}

/* ---------- 15. הסתברות מותנית ובייס ---------- */
function genCondProb(L){
  /* ---- רמה 4 ----
     לא "חשבו את P(A|B)" אלא "מה ההתניה עושה": מגדילה, מקטינה או
     לא משנה. ההשוואה שקולה להשוואה בין P(A∩B) לבין P(A)·P(B), ולכן
     היא גם המבחן לאי־תלות — ושלושת הכיוונים מוגרלים. */
  if(L===4){
    var TR4=[[12,6,6,3],[12,8,6,4],[12,9,8,6],[12,10,6,5],[20,10,8,4],[20,15,8,6],
             [20,12,10,6],[20,16,15,12],[24,12,8,4],[24,16,9,6],[24,18,8,6],[24,16,12,8],[24,20,18,15]];
    var t4=pick(TR4),D4=t4[0],a4=t4[1],b4=t4[2],c0=t4[3],dir=pick(["up","eq","down"]);
    var c4=dir==="up"?c0+1:dir==="down"?c0-1:c0;
    var oUp=_("P(A|B) גדולה מ-P(A) — הידיעה ש-B קרה מגדילה את הסיכוי ל-A");
    var oEq=_("P(A|B) שווה ל-P(A) — המאורעות בלתי תלויים");
    var oDown=_("P(A|B) קטנה מ-P(A) — הידיעה ש-B קרה מקטינה את הסיכוי ל-A");
    var oCant=_("אי אפשר להשוות בלי לדעת גם את P(B|A)");
    var map4=[["up",oUp],["eq",oEq],["down",oDown]];
    var why4=_f("P(A|B) = {0} חלקי {1} = {2}, ואילו P(A) = {3}. השוו את שני המספרים.", fr(c4,D4).txt(), fr(b4,D4).txt(), fr(c4,b4).txt(), fr(a4,D4).txt());
    return {ask:_("מה עושה הידיעה ש-B קרה להסתברות של A?"),
      expr:"P(A) = "+fr(a4,D4).html()+"  ,  P(B) = "+fr(b4,D4).html()+"  ,  P(A∩B) = "+fr(c4,D4).html(),
      ans:W(map4.filter(function(o){return o[0]===dir})[0][1]),
      wrong:map4.filter(function(o){return o[0]!==dir}).map(function(o){return W(o[1],why4)})
        .concat([W(oCant,_("שלושת הנתונים מספיקים לגמרי: P(A|B) הוא החיתוך חלקי P(B), וזה כל מה שצריך כדי להשוות."))]),
      steps:[
        S(_("מחשבים את ההסתברות המותנית"),_("המכנה מצטמצם לתנאי בלבד."),
          "P(A|B) = "+fr(c4,D4).html()+" ÷ "+fr(b4,D4).html()+" = "+fr(c4,b4).html()),
        S(_("משווים ל-P(A)"),"",fr(c4,b4).html()+(dir==="up"?" > ":dir==="down"?" < ":" = ")+fr(a4,D4).html()),
        S(_("קיצור דרך שקול"),_("במקום לחלק אפשר להשוות ישירות את P(A∩B) למכפלה P(A)·P(B): שווים פירושו אי־תלות, גדול פירושו שההתניה מגדילה."),
          fr(c4,D4).html()+(dir==="up"?" > ":dir==="down"?" < ":" = ")+fr(a4*b4,D4*D4).html()),
        S(_("המסקנה"),"",map4.filter(function(o){return o[0]===dir})[0][1])
      ],rule:"indep",hint:_("השוו את P(A∩B) למכפלה P(A)·P(B). שווה — אי־תלות. גדול או קטן — ההתניה משנה.")};
  }
  var a,b,ab,tot,steps;
  if(L===1){
    tot=pick([40,50,60,80,100]);
    a=Math.round(tot*pick([0.3,0.4,0.5,0.6]));
    b=Math.round(tot*pick([0.3,0.4,0.5]));
    ab=Math.round(Math.min(a,b)*pick([0.4,0.5,0.6]));
    var p=fr(ab,b);
    return {ask:_f("מתוך {0} סטודנטים, {1} לומדים סטטיסטיקה ו-{2} מהם לומדים גם אלגברה. סטודנט נבחר באקראי מבין לומדי הסטטיסטיקה — מה ההסתברות שהוא לומד גם אלגברה?", tot, b, ab),
      expr:"",ans:W(p.html()),
      wrong:[
        W(fr(ab,tot).html(),_("חילקתם בכלל הסטודנטים. בהסתברות מותנית המכנה מצטמצם לתנאי בלבד.")),
        W(fr(b,tot).html(),_("זו ההסתברות ללמוד סטטיסטיקה, ולא ההסתברות המבוקשת.")),
        W(fr(b,ab).html(),_("הפכתם את השבר."))
      ],
      steps:[
        S(_("הגדרת הסתברות מותנית"),_("המכנה מצטמצם: כבר ידוע שהסטודנט מקבוצת הסטטיסטיקה, ולכן זה כל המרחב שלנו."),
          "P(A|B) = P(A∩B) / P(B)"),
        S(_("סופרים"),"",_f("החיתוך: {0}   ,   התנאי: {1}", ab, b)),
        S(_("מחלקים"),"",fr(ab,b).html())
      ],rule:"cond",hint:_("בהסתברות מותנית המכנה הוא התנאי, לא כל המרחב.")};
  }
  if(L===2){
    /* קודם היו הרגישות והסגוליות מוגרלות מתוך {90 , 95} בלבד, ולכן
       שני המסיחים האלה הציגו את אותם שני מספרים בכל הגרלה בלי להיות
       נכונים אף פעם — והתלמיד יכול היה לפסול אותם בלי לחשב. עכשיו
       שני הפרמטרים מוגרלים מטווח רחב, וגם השכיחות מגיעה עד 40%,
       כך שהתשובה אינה תמיד מספר קטן. */
    var pd,sens,fp,pop=1000,sick,tp,fpN,post,pct,btry=0,bBad;
    do{
      pd=pick([1,2,4,5,10,20,30,40]);
      sens=pick([80,85,90,95,98]);
      fp=pick([2,5,10,20]);
      sick=Math.round(pop*pd/100);
      tp=Math.round(sick*sens/100);fpN=Math.round((pop-sick)*fp/100);
      post=fr(tp,tp+fpN);pct=Math.round(post.val()*100);
      /* 100 פחות fp הוא הסגוליות. כשהיא שווה לרגישות, שני מסיחים
         שונים מציגים את אותו מספר ואחד מהם נעלם — וכשהתשובה עצמה
         שווה לאחד מהשלושה, המסיח נבלע בתשובה ונשארות שלוש אפשרויות. */
      bBad=(100-fp===sens||tp+fpN===0||pct===sens||pct===100-fp||pct===pd);
    }while(btry++<200&&bBad);
    if(bBad){pd=2;sens=90;fp=5;sick=20;tp=18;fpN=49;post=fr(tp,tp+fpN);pct=Math.round(post.val()*100)}
    return {ask:_f("מחלה מופיעה אצל {0}% מהאוכלוסייה. בדיקה מזהה חולה בהסתברות {1}%, ונותנת תוצאה חיובית שגויה אצל {2}% מהבריאים. אדם קיבל תוצאה חיובית — מה ההסתברות שהוא חולה?", pd, sens, fp),
      expr:"",ans:W(post.html()+" ≈ "+pct+"%"),
      wrong:[
        W(sens+"%",_("זו רגישות הבדיקה — ההסתברות לתוצאה חיובית בהינתן מחלה. השאלה מבקשת את הכיוון ההפוך.")),
        W(pd+"%",_("זו השכיחות באוכלוסייה, לפני שהתקבל מידע מהבדיקה.")),
        W((100-fp)+"%",_("זו הסגוליות של הבדיקה, לא ההסתברות המבוקשת."))
      ],
      steps:[
        S(_("למה האינטואיציה נכשלת כאן"),_("הבריאים הם רוב עצום, ולכן גם אחוז קטן של טעויות אצלם מייצר הרבה תוצאות חיוביות שגויות."),
          _("רוב החיוביים מגיעים דווקא מהבריאים")),
        S(_f("סופרים על {0} אנשים", pop),"",	_f("חולים: {0}   ,   בריאים: {1}", sick, (pop-sick))),
        S(_("כמה חיוביים מכל קבוצה"),"",	_f("חולים חיוביים: {0}   ,   בריאים חיוביים בטעות: {1}", tp, fpN)),
        S(_("מחלקים"),"",tp+" ÷ ("+tp+" + "+fpN+") = "+post.html()+" ≈ "+pct+"%")
      ],rule:"bayes",hint:_("סופרים על אוכלוסייה שלמה: כמה חיוביים אמיתיים מול כמה חיוביים שגויים.")};
  }
  /* קודם הוגרלו כאן שני מצבים בלבד — תלויים או בלתי תלויים — ולכן
     "זרים" ו"אי אפשר לקבוע" לא היו התשובה אף פעם. עכשיו מוגרלים
     ארבעה מצבים: חיתוך ששווה למכפלה, חיתוך שאינו שווה לה, חיתוך ריק
     (ואז המאורעות זרים, ומכאן גם תלויים), ושאלה שבה החיתוך כלל אינו
     נתון — ואז באמת אי אפשר לקבוע, כי השוליים לבדם אינם מכריעים
     אי־תלות. ניסוח שתי האפשרויות האמצעיות מוציא זו את זו. */
  var pa=pick([2,3,4,5]),pb=pick([2,3,4,5]);
  var cs3p=pick(["indep","dep","disj","unknown"]);
  var pAB=cs3p==="indep"?fr(1,pa*pb):cs3p==="disj"?fr(0,1):fr(1,pa*pb+1);
  var oInd3=_("בלתי תלויים"),oDep3=_("תלויים, אך אינם זרים");
  var oDis3=_("זרים — ומכאן גם תלויים"),oCant3=_("אי אפשר לקבוע");
  var map3p=[["indep",oInd3],["dep",oDep3],["disj",oDis3],["unknown",oCant3]];
  var why3p=cs3p==="unknown"?_("שתי ההסתברויות השוליות לבדן אינן קובעות אי־תלות: לאותם P(A) ו-P(B) יש חיתוכים שונים, וכל אחד מהם נותן תשובה אחרת.")
    :_f("מכפלת ההסתברויות היא {0}, והחיתוך הוא {1}. {2}", fr(1,pa*pb).html(), pAB.html(),
        (cs3p==="indep"?_("הם שווים, ולכן בלתי תלויים.")
         :cs3p==="disj"?_("החיתוך ריק והמכפלה אינה אפס — המאורעות זרים, ולכן גם תלויים.")
         :_("הם שונים, ולכן תלויים. החיתוך אינו ריק, ולכן אינם זרים.")));
  return {ask:cs3p==="unknown"
      ?_f("נתון P(A) = {0} , P(B) = {1}, ואין מידע על החיתוך. האם המאורעות בלתי תלויים?", fr(1,pa).html(), fr(1,pb).html())
      :_f("נתון P(A) = {0} , P(B) = {1} , P(A∩B) = {2}. האם המאורעות בלתי תלויים?", fr(1,pa).html(), fr(1,pb).html(), pAB.html()),
    expr:"",ans:W(map3p.filter(function(o){return o[0]===cs3p})[0][1]),
    wrong:map3p.filter(function(o){return o[0]!==cs3p}).map(function(o){return W(o[1],why3p)}),
    steps:[
      S(_("מבחן אי־התלות"),_("אי־תלות אינה עניין של תחושה אלא של שוויון מספרי אחד."),_("A,B בלתי תלויים ⇔ P(A∩B) = P(A)·P(B)")),
      S(_("מחשבים את המכפלה"),"",fr(1,pa).html()+" · "+fr(1,pb).html()+" = "+fr(1,pa*pb).html()),
      S(cs3p==="unknown"?_("אין מה להשוות אליו"):_("משווים לחיתוך"),
        cs3p==="unknown"?_("המבחן דורש את P(A∩B), והוא אינו נתון. השוליים לבדם אינם מספיקים."):"",
        cs3p==="unknown"?"P(A∩B) = ?":(pAB.html()+(cs3p==="indep"?" = ":" ≠ ")+fr(1,pa*pb).html())),
      S(_("מסקנה"),why3p,map3p.filter(function(o){return o[0]===cs3p})[0][1])
    ],rule:"indep",hint:_("בלתי תלויים אם ורק אם ההסתברות של החיתוך שווה למכפלת ההסתברויות.")};
}

/* ---------- 16. תוחלת ושונות ---------- */
function genExpVar(L){
  /* ---- רמה 4 ----
     ההנחה שנשברת. תוחלת של סכום היא תמיד סכום התוחלות, בלי שום
     הנחה. שונות של סכום מתחברת רק כשהמשתנים בלתי תלויים — ובלי
     ההנחה הזאת אי אפשר לקבוע. מוגרלים גם הכמות הנשאלת וגם עצם
     הופעת ההנחה בשאלה. */
  if(L===4){
    var ex=ri(2,9),ey=ri(2,9),vx=ri(2,8),vy=ri(2,8),ind=Math.random()<0.5,askV=Math.random()<0.6,g4=0,fine=false;
    do{
      var q1=ex+ey,q2=vx+vy,q3=vx*vy,q4=ex*ey;
      fine=(q1!==q2&&q1!==q3&&q1!==q4&&q2!==q3&&q2!==q4&&q3!==q4);
      if(!fine){ex=ri(2,9);ey=ri(2,9);vx=ri(2,8);vy=ri(2,8)}
    }while(!fine&&g4++<200);
    var unk=_("אי אפשר לקבוע מהנתונים");
    var given=_f("נתון E(X) = {0} , V(X) = {1} , E(Y) = {2} , V(Y) = {3}.", ex, vx, ey, vy)+
              (ind?" "+_("המשתנים בלתי תלויים."):" "+_("על הקשר בין X ל-Y לא נאמר דבר."));
    if(!askV){
      return {ask:given+" "+_("חשבו את E(X+Y)."),expr:"E(X+Y) = ?",
        ans:W(num(ex+ey)),
        wrong:[
          W(unk,_("תוחלת של סכום היא תמיד סכום התוחלות. זה נכון לכל שני משתנים, תלויים או לא, ואין כאן שום הנחה שצריך.")),
          W(num(vx+vy),_("אלה השונויות. השאלה מבקשת תוחלת.")),
          W(num(ex*ey),_("מכפלת התוחלות מתאימה ל-E(X·Y), וגם היא רק תחת אי־תלות. סכום הוא תמיד סכום."))
        ],
        steps:[
          S(_("קודם שואלים איזו הנחה צריך"),_("תוחלת ושונות אינן מתנהגות אותו הדבר: אחת מהן דורשת אי־תלות והשנייה לא. זו ההכרעה הראשונה כאן."),
            "E(X+Y) ?   ·   V(X+Y) ?"),
          S(_("לינאריות התוחלת"),_("זו התכונה החזקה ביותר בפרק: היא אינה דורשת שום הנחה על הקשר בין המשתנים."),"E(X+Y) = E(X) + E(Y)"),
          S(_("מציבים"),"",ex+" + "+ey+" = "+num(ex+ey))
        ],rule:"exp",hint:_("תוחלת של סכום היא סכום התוחלות — תמיד, בלי תנאי.")};
    }
    return {ask:given+" "+_("חשבו את V(X+Y)."),expr:"V(X+Y) = ?",
      ans:W(ind?num(vx+vy):unk),
      wrong:ind?[
        W(unk,_("כאן אי־התלות נתונה במפורש, ולכן השונויות כן מתחברות.")),
        W(num(ex+ey),_("אלה התוחלות. השאלה מבקשת שונות.")),
        W(num(vx*vy),_("שונויות מתחברות, לא מוכפלות."))
      ]:[
        W(num(vx+vy),_("זה נכון רק כשהמשתנים בלתי תלויים, ולא נאמר כאן דבר על הקשר ביניהם. באופן כללי V(X+Y) = V(X) + V(Y) + 2Cov(X,Y).")),
        W(num(ex+ey),_("אלה התוחלות. השאלה מבקשת שונות.")),
        W(num(vx*vy),_("שונויות אינן מוכפלות, גם לא תחת אי־תלות."))
      ],
      steps:[
        S(_("שונות של סכום"),_("הנוסחה המלאה כוללת איבר שלישי, איבר השונות המשותפת, והוא מתאפס בדיוק כשהמשתנים בלתי תלויים."),
          "V(X+Y) = V(X) + V(Y) + 2Cov(X,Y)"),
        S(ind?_("ההנחה נתונה"):_("ההנחה חסרה"),
          ind?_("אי־תלות מאפסת את השונות המשותפת, ולכן השונויות מתחברות."):_("בלי אי־תלות איבר השונות המשותפת יכול להיות כל דבר, ואי אפשר לקבוע ערך יחיד."),
          ind?"Cov(X,Y) = 0":"Cov(X,Y) = ?"),
        S(_("המסקנה"),"",ind?num(vx+vy):unk)
      ],rule:"var",hint:_("תוחלת מתחברת תמיד. שונות מתחברת רק תחת אי־תלות.")};
  }
  var vals,probs,i,E,steps;
  if(L===1){
    var n=3,den=pick([4,6,8,10]);
    var p1=ri(1,den-2),p2=ri(1,den-p1-1),p3=den-p1-p2;
    vals=[rnz(-5,10),rnz(-5,10),rnz(-5,10)];
    while(vals[1]===vals[0])vals[1]=rnz(-5,10);
    while(vals[2]===vals[0]||vals[2]===vals[1])vals[2]=rnz(-5,10);
    probs=[fr(p1,den),fr(p2,den),fr(p3,den)];
    E=(vals[0]*p1+vals[1]*p2+vals[2]*p3)/den;
    return {ask:_("חשבו את התוחלת"),
      expr:"x:  "+vals.map(num).join(" , ")+"<br>P:  "+probs.map(function(f){return f.html()}).join(" , "),
      ans:W(num(Math.round(E*1000)/1000)),
      wrong:[
        W(num(Math.round((vals[0]+vals[1]+vals[2])/3*1000)/1000),_("חישבתם ממוצע פשוט. בתוחלת כל ערך מקבל משקל לפי ההסתברות שלו.")),
        W(num(vals[0]+vals[1]+vals[2]),_("חיברתם את הערכים בלי להכפיל בהסתברויות.")),
        W(num(Math.round((p1+p2+p3)/den*1000)/1000),_("סכמתם את ההסתברויות. הן תמיד מסתכמות ל-1."))
      ],
      steps:[
        S(_("תוחלת היא ממוצע משוקלל"),_("כל ערך נכנס לחישוב לפי ההסתברות שלו, ולא בחלקים שווים."),"E(X) = Σ xᵢ·P(xᵢ)"),
        S(_("מכפילים כל ערך בהסתברות"),"",vals.map(function(v,ix){return num(v)+"·"+[p1,p2,p3][ix]+"/"+den}).join(" + ")),
        S(_("מחברים"),"","E(X) = "+num(Math.round(E*1000)/1000))
      ],rule:"exp",hint:_("תוחלת = סכום של ערך כפול ההסתברות שלו.")};
  }
  if(L===2){
    var a=ri(1,6),b=a+ri(1,6);
    /* משתנה עם שני ערכים בהסתברות חצי־חצי — שונות פשוטה לבדיקה */
    E=(a+b)/2;
    var E2=(a*a+b*b)/2,V=E2-E*E;
    return {ask:_f("משתנה מקרי מקבל את הערכים {0} ו-{1}, כל אחד בהסתברות חצי. חשבו את השונות.", a, b),
      expr:"",ans:W(num(Math.round(V*1000)/1000)),
      wrong:[
        W(num(Math.round(E*1000)/1000),_("זו התוחלת, לא השונות.")),
        W(num(Math.round((E2)*1000)/1000),_("זו E(X²). צריך עוד לחסר ממנה את התוחלת בריבוע.")),
        W(num(Math.round(Math.sqrt(V)*1000)/1000),_("זו סטיית התקן — שורש השונות."))
      ],
      steps:[
        S(_("נוסחת השונות"),_("V(X) = E(X²) − [E(X)]². שימו לב: קודם מרבעים ואז ממצעים, ולא להפך."),
          "V(X) = E(X²) − E(X)²"),
        S(_("מחשבים תוחלת"),"","E(X) = ("+a+" + "+b+") / 2 = "+num(E)),
        S(_("מחשבים E(X²)"),"","E(X²) = ("+(a*a)+" + "+(b*b)+") / 2 = "+num(E2)),
        S(_("מחסרים"),"","V = "+num(E2)+" − "+pn(E)+"² = "+num(Math.round(V*1000)/1000))
      ],rule:"var",hint:_("שונות = תוחלת הריבוע פחות ריבוע התוחלת.")};
  }
  var m=ri(2,8),v=ri(2,6),k=ri(2,5),c=rnz(-6,6);
  return {ask:_f("נתון E(X) = {0} ו-V(X) = {1}. חשבו את השונות של {2}X{3}.", m, v, k, sgn(c)),
    expr:"",ans:W(num(k*k*v)),
    wrong:[
      W(num(k*v),_("הכפלתם ב-k פעם אחת. בשונות המקדם עולה בריבוע, כי השונות עצמה מדודה ביחידות בריבוע.")),
      W(num(k*k*v+c),_("הוספתם את הקבוע. הזזה לא משנה את הפיזור, ולכן היא לא משפיעה על השונות.")),
      W(num(k*m+c),_("זו התוחלת של הביטוי, לא השונות."))
    ],
    steps:[
      S(_("שני כללים"),_("התוחלת לינארית לגמרי. השונות מתעלמת מהזזה ומעלה את המקדם בריבוע."),
        "E(aX+b) = aE(X)+b   ,   V(aX+b) = a²V(X)"),
      S(_("למה הקבוע נעלם"),_("הוספת קבוע מזיזה את כל ההתפלגות, אבל לא משנה כמה היא מפוזרת."),
        "V(X + b) = V(X)"),
      S(_("מציבים"),"","V("+k+"X"+sgn(c)+") = "+k+"²·"+v+" = "+(k*k*v))
    ],rule:"var",hint:_("בשונות: הקבוע נעלם, והמקדם עולה בריבוע.")};
}

/* ---------- 17. התפלגות בינומית ---------- */
function genBinom(L){
  /* ---- רמה 4 ----
     רמות 1–3 מניחות שההתפלגות בינומית ורק מחשבות. כאן השאלה היא אם
     המודל בכלל תקף: n קבוע מראש, ניסויים בלתי תלויים, ו-p אחיד.
     מוגרל גם מצב שבו כן, וגם שני מצבים שבהם הנחה אחת נשברת. */
  if(L===4){
    var cs4=pick(["yes","noreplace","geom"]),n4=ri(6,12),m4=ri(3,6),tot=ri(10,16),k4=ri(2,4);
    var story=cs4==="yes"?_f("מטילים מטבע הוגן {0} פעמים וסופרים כמה פעמים יצא ״עץ״.", n4)
             :cs4==="noreplace"?_f("בכד {0} כדורים, {1} מהם אדומים. מוציאים {2} כדורים בזה אחר זה בלי החזרה, וסופרים כמה מהם אדומים.", tot, m4, k4)
             :_("מטילים קובייה שוב ושוב עד שמופיע 6 בפעם הראשונה, וסופרים כמה הטלות נדרשו.");
    var oYes=_("כן — מספר הניסויים קבוע מראש, הם בלתי תלויים, ובכולם אותה הסתברות הצלחה");
    var oNr=_("לא — ההסתברות משתנה מניסוי לניסוי, מפני שהדגימה נעשית בלי החזרה");
    var oGe=_("לא — מספר הניסויים אינו קבוע מראש אלא נקבע בדיעבד");
    var oMany=_("לא — בכל ניסוי יש יותר משתי תוצאות אפשריות");
    var map4=[["yes",oYes],["noreplace",oNr],["geom",oGe]];
    var why4=_("שלושה תנאים למודל הבינומי: n קבוע מראש, ניסויים בלתי תלויים, ואותה p בכולם. בדקו כל אחד מהם בנפרד על הסיפור שכאן.");
    return {ask:_("האם המשתנה הנספר מתפלג בינומית?"),expr:story,
      ans:W(map4.filter(function(o){return o[0]===cs4})[0][1]),
      wrong:map4.filter(function(o){return o[0]!==cs4}).map(function(o){return W(o[1],why4)})
        .concat([W(oMany,_("בכל אחד מהסיפורים כאן יש בדיוק שתי תוצאות: הצלחה או כישלון. זה אינו התנאי שנשבר."))]),
      steps:[
        S(_("שלושת תנאי המודל הבינומי"),_("מספר ניסויים קבוע מראש, אי־תלות ביניהם, ואותה הסתברות הצלחה בכל אחד. די שאחד נשבר כדי שהמודל לא יחול."),
          "n "+_("קבוע")+"   ·   "+_("בלתי תלויים")+"   ·   p "+_("אחידה")),
        S(_("בודקים את הסיפור"),
          cs4==="yes"?_("מספר ההטלות נקבע מראש, הטלה אינה משפיעה על חברתה, וההסתברות לעץ היא חצי בכל פעם.")
          :cs4==="noreplace"?_("אחרי כל הוצאה מספר הכדורים בכד קטן, ולכן ההסתברות להוציא אדום משתנה. זו התפלגות היפרגאומטרית.")
          :_("לא ידוע מראש כמה הטלות יהיו — המספר הזה הוא בעצמו המשתנה המקרי. זו התפלגות גאומטרית."),
          map4.filter(function(o){return o[0]===cs4})[0][1])
      ],rule:"binom",hint:_("בדקו שלושה דברים: האם n קבוע מראש, האם הניסויים בלתי תלויים, והאם p זהה בכולם.")};
  }
  var n,k,den,steps;
  if(L===1){
    n=ri(3,6);k=ri(1,n-1);den=pick([2,3,4]);
    var c=Cnk(n,k);
    var p=fr(c*Math.pow(den-1,n-k),Math.pow(den,n));
    return {ask:_f("מבצעים {0} ניסויים בלתי תלויים, בכל אחד הסתברות הצלחה {1}. מה ההסתברות ל-{2} הצלחות בדיוק?", n, fr(1,den).html(), k),
      expr:"",ans:W(p.html()),
      wrong:[
        W(fr(Math.pow(den-1,n-k),Math.pow(den,n)).html(),_f("שכחתם את מקדם הבחירה. יש {0} סדרים שונים שבהם {1} ההצלחות יכולות להופיע.", c, k)),
        W(fr(c,Math.pow(den,n)).html(),_("השתמשתם ב-p גם לכישלונות. הסתברות הכישלון היא 1 פחות p.")),
        W(fr(k,n).html(),_("זה היחס בין מספר ההצלחות למספר הניסויים, ולא הסתברות."))
      ],
      steps:[
        S(_("נוסחת ההתפלגות הבינומית"),_("שלושה חלקים: כמה סדרים, ההסתברות להצלחות, וההסתברות לכישלונות."),
          "P(X=k) = C(n,k)·pᵏ·(1−p)ⁿ⁻ᵏ"),
        S(_("מספר הסדרים"),"","C("+n+","+k+") = "+c),
        S(_("הסתברות הרצף"),"",fr(1,den).html()+"<sup>"+k+"</sup> · "+fr(den-1,den).html()+"<sup>"+(n-k)+"</sup>"),
        S(_("מכפילים"),"",p.html())
      ],rule:"binom",hint:_("מקדם בינומי, כפול ההצלחות, כפול הכישלונות.")};
  }
  if(L===2){
    n=ri(10,40);den=pick([2,4,5,10]);
    var E=n/den,V=n*(1/den)*(1-1/den);
    return {ask:_f("משתנה מקרי בינומי עם n = {0} ו-p = {1}. חשבו את התוחלת ואת השונות.", n, fr(1,den).html()),
      expr:"",ans:W("E = "+num(E)+" , V = "+num(Math.round(V*100)/100)),
      wrong:[
        W("E = "+num(E)+" , V = "+num(E),_("בלבלתם בין בינומית לפואסונית. בבינומית השונות היא np(1−p), והיא תמיד קטנה מהתוחלת.")),
        W("E = "+num(n)+" , V = "+num(Math.round(V*100)/100),_("התוחלת היא n כפול p, לא n.")),
        W("E = "+num(Math.round(V*100)/100)+" , V = "+num(E),_("החלפתם בין השניים."))
      ],
      steps:[
        S(_("נוסחאות ההתפלגות הבינומית"),"","E(X) = np   ,   V(X) = np(1−p)"),
        S(_("מציבים בתוחלת"),"","E = "+n+" · "+fr(1,den).html()+" = "+num(E)),
        S(_("מציבים בשונות"),"","V = "+n+" · "+fr(1,den).html()+" · "+fr(den-1,den).html()+" = "+num(Math.round(V*100)/100)),
        S(_("בדיקת סבירות"),_("השונות תמיד קטנה מהתוחלת בבינומית, כי (1−p) קטן מ-1."),"")
      ],rule:"binom",hint:_("E = np, ו-V = np(1−p).")};
  }
  n=ri(3,6);den=pick([2,3,4]);
  var pNone=fr(Math.pow(den-1,n),Math.pow(den,n));
  var pAtLeast=fr(1,1).sub(pNone);
  return {ask:_f("מבצעים {0} ניסויים בלתי תלויים, בכל אחד הסתברות הצלחה {1}. מה ההסתברות שתהיה לפחות הצלחה אחת?", n, fr(1,den).html()),
    expr:"",ans:W(pAtLeast.html()),
    wrong:[
      W(pNone.html(),_("זו ההסתברות לאפס הצלחות. השאלה מבקשת את המשלים שלה.")),
      W(fr(n,den).html(),_("חיברתם הסתברויות. מאורעות ״לפחות אחת״ אינם זרים, ולכן אי אפשר לחבר.")),
      W(fr(1,den).html(),_("זו ההסתברות בניסוי בודד."))
    ],
    steps:[
      S(_("״לפחות אחת״ נפתר דרך המשלים"),_("לספור אחת, שתיים, שלוש הצלחות זו עבודה מיותרת. יש רק מקרה אחד לשלול."),
        _("P(לפחות 1) = 1 − P(אף אחת)")),
      S(_("ההסתברות לאפס הצלחות"),_f("כל {0} הניסויים נכשלים.", n),fr(den-1,den).html()+"<sup>"+n+"</sup> = "+pNone.html()),
      S(_("משלימים ל-1"),"","1 − "+pNone.html()+" = "+pAtLeast.html())
    ],rule:"binom",hint:_("״לפחות אחת״ = 1 פחות ההסתברות לאף אחת.")};
}

/* ---------- 18. התפלגות נורמלית ---------- */
function genNormal(L){
  /* ---- רמה 4 ----
     רמות 1–3 עושות צעד אחד: תקנון, או סימטריה, או חזרה ל-x. כאן
     צריך את שלושתם ברצף ובלי שנאמר מאיפה מתחילים — תקנון, ואז
     סימטריה כש-z שלילי, ואז מעבר להשלמה מפני שהשאלה על הזנב הימני. */
  if(L===4){
    var mu4=pick([50,60,80,100]),sg4=pick([4,5,10,20]),z4=pick([-2,-1.5,-1,-0.5,0.5,1,1.5,2]);
    var PHI={"0.5":0.6915,"1":0.8413,"1.5":0.9332,"2":0.9772};
    var az=Math.abs(z4),ph=PHI[String(az)],x4=mu4+z4*sg4;
    var r4=function(v){return num(Math.round(v*10000)/10000)};
    var ansV=z4>0?1-ph:ph;
    return {ask:_f("נתון Φ({0}) = {1}. מהי ההסתברות P(X > {2})?", az, ph, num(x4)),
      expr:"X ~ N("+mu4+" , "+(sg4*sg4)+")",
      ans:W(r4(ansV)),
      wrong:[
        W(r4(z4>0?ph:1-ph),z4>0?_("זו ההסתברות להיות קטן מ-x. השאלה מבקשת את הזנב הימני, כלומר את ההשלמה ל-1.")
                              :_("z כאן שלילי, ולכן צריך גם את הסימטריה. שרטטו את הגרף ובדקו איזה צד גדול מחצי.")),
        W(r4(ph-0.5),_("זו ההסתברות שבין התוחלת לבין x, ולא הזנב שמעבר ל-x.")),
        W(r4(2*(1-ph)),_("זו ההסתברות לסטות יותר מ-|z| לשני הכיוונים יחד. השאלה על כיוון אחד בלבד."))
      ],
      steps:[
        S(_("קודם מתקננים"),_f("σ הוא השורש של המספר השני בסימון, כלומר {0}.", sg4),
          "z = ("+num(x4)+" − "+mu4+") / "+sg4+" = "+num(z4)),
        S(z4<0?_("z שלילי — משתמשים בסימטריה"):_("z חיובי — עוברים להשלמה"),
          z4<0?_("הטבלה נותנת רק ערכים חיוביים. הזנב הימני של z שלילי שווה לזנב השמאלי של z חיובי, כלומר ל-Φ(|z|) עצמו.")
              :_("הטבלה נותנת שטח משמאל, והשאלה מבקשת מימין. משלימים ל-1."),
          z4<0?"P(Z > "+num(z4)+") = Φ("+az+")":"P(Z > "+num(z4)+") = 1 − Φ("+az+")"),
        S(_("מחשבים"),"",r4(ansV))
      ],rule:"znorm",hint:_("תקננו, ואז החליטו לבד: סימטריה כש-z שלילי, השלמה ל-1 כשמבקשים את הזנב הימני.")};
  }
  var mu,sig,x,z,steps;
  if(L===1){
    mu=pick([50,70,80,100,120]);sig=pick([4,5,8,10,15,20]);
    z=pick([-2,-1.5,-1,1,1.5,2,2.5]);
    x=mu+z*sig;
    return {ask:_("תקננו את הערך"),expr:"X ~ N("+mu+" , "+(sig*sig)+")  ,  x = "+num(x),
      ans:W("z = "+num(z)),
      wrong:[
        W("z = "+num(-z),_("טעות סימן. מחסרים את התוחלת מהערך, ולא להפך.")),
        W("z = "+num(Math.round((x-mu)/(sig*sig)*1000)/1000),_("חילקתם בשונות. בתקנון מחלקים בסטיית התקן, שהיא השורש שלה.")),
        W("z = "+num(x-mu),_("עצרתם אחרי החיסור, בלי לחלק בסטיית התקן."))
      ],
      steps:[
        S(_("מה עושה התקנון"),_("הוא מתרגם ״כמה רחוק״ ליחידות של סטיות תקן, וכך אפשר להשוות בין התפלגויות שונות."),
          "z = (x − μ) / σ"),
        S(_("שימו לב לסימון"),_f("N({0} , {1}) — המספר השני הוא השונות, וסטיית התקן היא השורש שלו.", mu, (sig*sig)),
          "σ = √"+(sig*sig)+" = "+sig),
        S(_("מציבים"),"","z = ("+num(x)+" − "+mu+") / "+sig),
        S(_("מחשבים"),"","z = "+num(z))
      ],rule:"znorm",hint:_("מחסרים תוחלת ומחלקים בסטיית תקן — לא בשונות.")};
  }
  if(L===2){
    var zz=pick([0.5,1,1.5,2]);
    var phi={"0.5":0.6915,"1":0.8413,"1.5":0.9332,"2":0.9772}[String(zz)];
    return {ask:_f("נתון Φ({0}) = {1}. חשבו את Φ(−{2}).", zz, phi, zz),expr:"",
      ans:W(num(Math.round((1-phi)*10000)/10000)),
      wrong:[
        W(num(Math.round((2*phi-1)*10000)/10000),_f("זו ההסתברות ליפול בין −{0} ל-{1}, כלומר 2Φ(z) − 1, ולא Φ(−{2}).", zz, zz, zz)),
        W(num(phi),_("Φ אינה זוגית. הערך בצד השלילי הוא המשלים.")),
        W(num(Math.round((phi-0.5)*10000)/10000),_f("זו ההסתברות בין 0 ל-{0}, ולא Φ(−{1}).", zz, zz))
      ],
      steps:[
        S(_("ההתפלגות סימטרית סביב אפס"),_("השטח משמאל ל-−z שווה בדיוק לשטח מימין ל-z."),"Φ(−z) = 1 − Φ(z)"),
        S(_("מציבים"),"","Φ(−"+zz+") = 1 − "+phi),
        S(_("מחשבים"),"","= "+num(Math.round((1-phi)*10000)/10000))
      ],rule:"znorm",hint:_("Φ(−z) = 1 פחות Φ(z), מתוך הסימטריה.")};
  }
  mu=pick([60,80,100]);sig=pick([5,10,20]);
  z=pick([1,1.5,2,-1,-2]);
  x=mu+z*sig;
  return {ask:_f("בהתפלגות N({0} , {1}), איזה ערך של x מתאים ל-z = {2}?", mu, (sig*sig), num(z)),
    expr:"",ans:W("x = "+num(x)),
    wrong:[
      W("x = "+num(mu-z*sig),_("טעות סימן. מהנוסחה z=(x−μ)/σ נובע x = μ + zσ.")),
      W("x = "+num(mu+z),_("שכחתם להכפיל בסטיית התקן. z נמדד ביחידות של σ.")),
      W("x = "+num(mu+z*sig*sig),_("הכפלתם בשונות במקום בסטיית התקן."))
    ],
    steps:[
      S(_("מבודדים את x"),_("מתחילים מנוסחת התקנון ומעבירים אגפים."),"z = (x−μ)/σ  →  x = μ + z·σ"),
      S(_("מציבים"),"","x = "+mu+" + "+pn(z)+"·"+sig),
      S(_("מחשבים"),"","x = "+num(x))
    ],rule:"znorm",hint:_("x = μ ועוד z כפול σ.")};
}

/* ============================================================
   מחוללי השאלות — בדידה ויסודות
   ============================================================ */

/* ---------- 19. לוגיקה ---------- */
function genLogic(L){
  /* ---- רמה 4 ----
     רמות 1–3 שואלות על ערך אמת ועל שקילות. כאן השאלה היא אם הסקה
     מסוימת בכלל מותרת: מודוס פוננס ומודוס טולנס תקפים, ואילו אישוש
     המסקנה ושלילת ההנחה אינם — ומהם לא נובע דבר. ארבעת המצבים
     מוגרלים, ולכן ״לא נובע דבר״ אינו ניחוש בטוח יותר מכל תשובה. */
  if(L===4){
    var A4=pick(["p","¬p"]),B4=pick(["q","¬q"]);
    var nA4=A4==="p"?"¬p":"p",nB4=B4==="q"?"¬q":"q";
    var cs4=pick(["mp","mt","ac","da"]);
    var second=cs4==="mp"?A4:cs4==="da"?nA4:cs4==="mt"?nB4:B4;
    var side=(cs4==="mp"||cs4==="da")?"q":"p";
    var tgt=side==="q"?B4:nA4,alt=side==="q"?nB4:A4;
    var oNone=_f("לא נובע דבר על {0}", side);
    var oContra=_("ההנחות סותרות זו את זו, ולכן אפשר להסיק מהן כל דבר");
    var isValid=(cs4==="mp"||cs4==="mt");
    var whyValid=cs4==="mp"?_("זהו מודוס פוננס: ההנחה מתקיימת, ולכן המסקנה מתקיימת.")
                           :_("זהו מודוס טולנס: המסקנה אינה מתקיימת, ולכן גם ההנחה אינה יכולה להתקיים.");
    var whyNo=cs4==="ac"?_("זהו כשל אישוש המסקנה. גרירה מבטיחה כיוון אחד בלבד, ומהמסקנה לא נובע דבר על ההנחה.")
                        :_("זהו כשל שלילת ההנחה. כשההנחה אינה מתקיימת הגרירה שותקת, והמסקנה עשויה להתקיים או לא.");
    return {ask:_f("נתון {0} וגם נתון {1}. מה מותר להסיק?", A4+" ⇒ "+B4, second),
      expr:A4+" ⇒ "+B4+"  ,  "+second,
      ans:W(isValid?tgt:oNone),
      wrong:isValid?[
        W(alt,_("זו בדיוק ההפך מהמסקנה הנכונה. בדקו את טבלת האמת של הגרירה.")),
        W(oNone,whyValid),

/* ---------- 20. קבוצות ---------- */
