<style>
/* ============================================================
   מתח — חשמל לתיכון
   מגמת חשמל: חוק אוהם, נגדים, הספק, קבלים וזרם חילופין.
   נבנתה בהעתקה מ-math-uni3 (24.9.2026): אותו מנוע, והמחוללים,
   הנושאים ודף הנוסחאות הוחלפו. כל שאלה נפתחת לצעדים.
   ============================================================ */
:root{
  --ar:"Noto Sans Arabic",system-ui,"Segoe UI",Arial,sans-serif;
  --ru:"Noto Sans",system-ui,"Segoe UI",Arial,sans-serif;   /* קירילית — Heebo אינו מכיל אותה, נמדד 7.9 */
  --font:"Heebo","Rubik",system-ui,"Segoe UI",Arial,sans-serif;
  --bg:#f5f7fb; --btn-ink:#fff; --surface:#ffffff; --surface2:#eef1f7;
  --ink:#101828; --muted:#5b6478; --faint:#687080; --line:#e0e4ee;
  --accent:#a21caf; --accent-ink:#ffffff; --accent-soft:#fce4fe;
  /* צהוב ההדגשה — אותו צהוב של מקריא קולי, כדי שמעקב ההקראה
     ייראה אותו דבר בכל האתר. */
  --hit:#f5c451; --hit-ink:#1a1300;
  --cyan:#0e7490; --cyan-soft:#dcf3f8;
  --ok:#15803d; --ok-soft:#dcfce7; --bad:#be123c; --bad-soft:#ffe4e9;
  --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px -12px rgba(16,24,40,.18);
  --r:14px;
  /* צבע לכל תחום לימוד. זה לא קישוט — זה עוזר לזהות מיד באיזה
     סוג חומר מדובר, וזה בדיוק מה שעוזר למי שמתקשה להתמצא. */
  --c-base:#0a6f66; --cs-base:#d2f4ef;
  --c-alg:#4a45c9;  --cs-alg:#e6e5fe;
  --c-geo:#9a4708;  --cs-geo:#fbecd3;
  --c-data:#be185d; --cs-data:#fbdfeb;
}

/* Heebo, Fredoka ו-Assistant אינם מכילים גליפים ערביים. בלי
   המשפחה הזאת הממשק הערבי נופל לגופן ברירת המחדל של המערכת —
   נמדד: הוא הוצג כאן ב-Heebo. Noto Sans Arabic נטען מאותה בקשת
   גופנים שכבר קיימת, ולכן אין כאן תלות חיצונית חדשה, וקובצי
   הגופן נמשכים רק כשבאמת מוצג טקסט ערבי. */
html[lang="ar"] body,html[lang="ar"] input,html[lang="ar"] button,
html[lang="ar"] textarea,html[lang="ar"] select{font-family:var(--ar)}
html[lang="ru"] body,html[lang="ru"] input,html[lang="ru"] button,
html[lang="ru"] textarea,html[lang="ru"] select{font-family:var(--ru)}
:root[data-theme="dark"]{
  --bg:#0e1117; --btn-ink:var(--bg); --surface:#161b26; --surface2:#1e2532;
  --ink:#e8ecf4; --muted:#9aa4ba; --faint:#8f99ae; --line:#28313f;
  --accent:#f0abfc; --accent-ink:#0e1117; --accent-soft:#3d1642;
  --hit:#ffd24d; --hit-ink:#241a00;
  --cyan:#22d3ee; --cyan-soft:#132b33;
  --ok:#4ade80; --ok-soft:#132a1c; --bad:#fb7185; --bad-soft:#33161f;
  --warn:#fbbf24; --warn-soft:#33260f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  --c-base:#2dd4bf; --cs-base:#0f2e2b;
  --c-alg:#a5b4fc;  --cs-alg:#1e2140;
  --c-geo:#fbbf24;  --cs-geo:#33270f;
  --c-data:#f472b6; --cs-data:#33162a;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1117; --btn-ink:var(--bg); --surface:#161b26; --surface2:#1e2532;
    --ink:#e8ecf4; --muted:#9aa4ba; --faint:#8f99ae; --line:#28313f;
    --accent:#f0abfc; --accent-ink:#0e1117; --accent-soft:#3d1642;
    --hit:#ffd24d; --hit-ink:#241a00;
    --cyan:#22d3ee; --cyan-soft:#132b33;
    --ok:#4ade80; --ok-soft:#132a1c; --bad:#fb7185; --bad-soft:#33161f;
    --warn:#fbbf24; --warn-soft:#33260f;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  --c-base:#2dd4bf; --cs-base:#0f2e2b;
  --c-alg:#a5b4fc;  --cs-alg:#1e2140;
  --c-geo:#fbbf24;  --cs-geo:#33270f;
  --c-data:#f472b6; --cs-data:#33162a;
  }
}
/* ניגודיות גבוהה — שחור על לבן, מסגרות מלאות, בלי גוונים רכים */
:root.hc{
  --bg:#ffffff; --btn-ink:#fff; --surface:#ffffff; --surface2:#ffffff;
  --ink:#000000; --muted:#1a1a1a; --faint:#333333; --line:#000000;
  --accent:#00308f; --accent-ink:#ffffff; --accent-soft:#e8edf8;
  --hit:#ffe600; --hit-ink:#000000;
  --cyan:#004b57; --cyan-soft:#e6f2f4;
  --ok:#0a5c2a; --ok-soft:#e6f4ea; --bad:#8c0f2c; --bad-soft:#fbe9ed;
  --warn:#6b3d00; --warn-soft:#f7efdf; --shadow:none;
  --c-base:#00308f; --cs-base:#e8edf8; --c-alg:#00308f; --cs-alg:#e8edf8;
  --c-geo:#00308f;  --cs-geo:#e8edf8;  --c-data:#00308f; --cs-data:#e8edf8;
}
:root.hc .card,:root.hc .opt,:root.hc .btn,:root.hc .chip,:root.hc .tile{border:2px solid #000}
:root.hc .deco{display:none}

*{box-sizing:border-box;margin:0}
html{font-size:100%}
html.ts2{font-size:112%}
html.ts3{font-size:126%}
/* פונט ברור לקריאה: Tahoma ו-Verdana קיימים כמעט בכל מכשיר וכוללים עברית */
html.clearfont{--font:Tahoma,Verdana,Arial,sans-serif}
/* ריווח מוגדל — עוזר למי שקשה לו לעקוב אחרי השורה */
html.spaced body{letter-spacing:.03em;word-spacing:.16em;line-height:1.95}
html.rm *,html.rm *::before,html.rm *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.65;
  -webkit-text-size-adjust:100%;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:inherit}
input,select,textarea{font:inherit;color:var(--ink)}
a{color:var(--accent)}
::selection{background:var(--accent);color:var(--accent-ink)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---------- שלד ---------- */
#app{min-height:100vh;display:flex;flex-direction:column}
/* בלי זה כרום מותח כל מסך לרוחב המינימלי של התוכן שלו והעמוד גולש בטלפון */
#app>*{min-width:0;width:100%}
.wrap{max-width:1120px;margin:0 auto;padding:0 clamp(12px,4vw,22px)}
.deco{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.85;
  background:
    radial-gradient(760px 380px at 92% -6%,var(--cs-alg),transparent 62%),
    radial-gradient(620px 340px at 2% 18%,var(--cs-data),transparent 58%),
    radial-gradient(700px 380px at 10% 102%,var(--cs-base),transparent 60%),
    radial-gradient(520px 300px at 96% 78%,var(--cs-geo),transparent 58%)}
#app{position:relative;z-index:1}

/* ---------- כותרת עליונה ---------- */
header{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:10px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand .mk{width:38px;height:38px;border-radius:11px;
  background:linear-gradient(140deg,var(--c-alg),var(--c-data) 55%,var(--c-geo));color:#fff;
  display:grid;place-items:center;font-weight:800;font-size:1.05rem;flex-shrink:0}
:root.hc .brand .mk{background:var(--ink)}
.brand b{display:block;font-size:1rem;line-height:1.15;font-weight:800}
.brand small{display:block;color:var(--muted);font-size:.72rem;font-weight:500}
nav{display:flex;gap:4px;margin-inline-start:auto;flex-wrap:wrap}
.nb{display:inline-flex;align-items:center;gap:6px;border-radius:10px;padding:8px 12px;
  font-size:.9rem;font-weight:600;color:var(--muted);border:1px solid transparent;transition:.15s}
.nb:hover{background:var(--surface2);color:var(--ink)}
.nb.on{background:var(--accent);color:var(--accent-ink)}
:root.hc .nb.on{background:var(--ink);color:var(--bg)}
.nb svg{flex-shrink:0}
@media(max-width:560px){.nb span{display:none}.nb{padding:9px 11px}}

/* ---------- רכיבי בסיס ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:clamp(14px,3.4vw,22px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:11px;
  font-weight:700;padding:12px 18px;transition:.15s;border:1px solid transparent;line-height:1.3}
/* **--btn-ink ולא #fff — תוקן 16.9.2026.** `--accent` מתהפך בין
   המצבים: בבהיר הוא כהה (#c026d3 ב-math-uni3) ולבן עליו 4.71:1,
   ובכהה הוא פסטל (#f0abfc) ולבן עליו **1.76:1** — טקסט שאינו
   נקרא על כפתור הפעולה הראשי. נמדד בארבע האפליקציות. */
.btn-p{background:linear-gradient(135deg,var(--accent),var(--c-data));color:var(--btn-ink)}
.btn-p:hover{filter:brightness(1.1)}
:root.hc .btn-p{background:var(--accent)}
.btn-d{background:var(--ink);color:var(--bg)}
.btn-g{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-g:hover{background:var(--surface2)}
.btn[disabled]{opacity:.42;cursor:not-allowed}
.btn.w{width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;
  font-size:.82rem;font-weight:600;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.chip.a{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.h1{font-size:clamp(1.5rem,5.2vw,2.05rem);font-weight:800;line-height:1.2;overflow-wrap:anywhere}
.h2{font-size:clamp(1.1rem,3.6vw,1.3rem);font-weight:700;overflow-wrap:anywhere}
.sub{color:var(--muted);margin-top:5px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.sm{font-size:.85rem}
.xs{font-size:.76rem}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
/* רשימת הקולות: שתי עמודות רק כשבאמת יש מקום, אחרת השמות נקטעים */
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
hr.sep{border:none;border-top:1px solid var(--line);margin:16px 0}

/* ---------- מתמטיקה: תמיד משמאל לימין, מבודד מהעברית ---------- */
.m{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums}
.mline{direction:ltr;unicode-bidi:isolate;text-align:center;font-weight:700;
  font-size:clamp(1.55rem,7vw,2.5rem);letter-spacing:.01em;line-height:1.35;overflow-wrap:anywhere}
.mstep{direction:ltr;unicode-bidi:isolate;text-align:center;font-weight:700;
  font-size:clamp(1.05rem,4.6vw,1.35rem);background:var(--surface2);border-radius:10px;
  padding:9px 12px;margin-top:8px;overflow-wrap:anywhere}
sup{font-size:.62em;vertical-align:super;line-height:0}
sub{font-size:.62em;vertical-align:sub;line-height:0}
/* ---------- מטריצה ווקטור ---------- */
.mtx{display:inline-flex;align-items:stretch;gap:7px;vertical-align:middle;
  padding:3px 10px;margin:0 .2em;position:relative;direction:ltr}
.mtx::before,.mtx::after{content:"";position:absolute;top:0;bottom:0;width:7px;
  border-top:2px solid currentColor;border-bottom:2px solid currentColor}
.mtx::before{inset-inline-start:0;border-inline-start:2px solid currentColor}
.mtx::after{inset-inline-end:0;border-inline-end:2px solid currentColor}
.mtx .mcol{display:flex;flex-direction:column;gap:3px;text-align:center;min-width:1.5em}
.mtx .mcol>span{padding:1px 4px;font-variant-numeric:tabular-nums}
.vec{display:inline-flex;gap:9px;padding:2px 11px;margin:0 .16em;direction:ltr;
  border-inline-start:2px solid currentColor;border-inline-end:2px solid currentColor;border-radius:9px}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;
  line-height:1.05;margin:0 .18em;font-size:.86em}
.frac>span:first-child{border-bottom:.09em solid currentColor;padding:0 .22em}
.frac>span:last-child{padding:0 .22em}

/* ---------- תשובות ---------- */
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
@media(max-width:430px){.opts{grid-template-columns:minmax(0,1fr)}}
.opt{position:relative;border:2px solid var(--line);background:var(--surface);border-radius:12px;
  padding:15px 14px 15px 44px;font-weight:700;font-size:clamp(1rem,4vw,1.2rem);transition:.14s;min-height:58px;
  display:flex;align-items:center;gap:10px}
[dir="rtl"] .opt{padding:15px 44px 15px 14px}
.opt:hover:not([disabled]){border-color:var(--c,var(--accent));background:var(--cs,var(--accent-soft))}
.opt .k{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);
  width:24px;height:24px;border-radius:7px;background:var(--cs,var(--surface2));color:var(--c,var(--faint));
  display:grid;place-items:center;font-size:.76rem;font-weight:700}
/* currentColor כאן היה נפתר לצבע שנקבע באותה הצהרה עצמה,
   ולכן הרקע והטקסט יצאו זהים והספרה נעלמה. */
.opt.right .k{background:var(--ok);color:var(--surface)}
.opt.wrong .k{background:var(--bad);color:var(--surface)}
.opt.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
/* בחירה במבחן היא בחירה, לא תשובה נכונה. במסכי התרגול הצבע
   הירוק אומר "צדקת", ובמבחן אסור לו להופיע כלל — הוא נותן
   משוב שגוי לכל בחירה. ניטרלי, ורק מסמן מה סומן. */
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.opt.dim{opacity:.4}
.opt.gone{opacity:.35;text-decoration:line-through}

/* ---------- פתרון מודרך ---------- */
.steps{margin-top:16px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.step{padding:13px 15px;border-top:1px solid var(--line);background:var(--surface)}
.step:first-child{border-top:none}
.step.future{display:none}
.step .st{display:flex;align-items:center;gap:9px;font-weight:700;font-size:.95rem}
.step .num{width:23px;height:23px;border-radius:50%;background:var(--c,var(--accent));color:var(--accent-ink);
  display:grid;place-items:center;font-size:.76rem;flex-shrink:0;font-weight:700}
.step .sd{color:var(--muted);font-size:.92rem;margin-top:4px;overflow-wrap:anywhere}
.step.last{background:var(--ok-soft)}
.step.last .num{background:var(--ok);color:var(--surface)}

/* ---------- פירוט טעות ---------- */
.diag{margin-top:14px;border-inline-start:4px solid var(--bad);background:var(--bad-soft);
  border-radius:0 10px 10px 0;padding:12px 15px}
[dir="rtl"] .diag{border-radius:10px 0 0 10px}
.diag b{color:var(--bad)}
.hintbox{margin-top:14px;border-inline-start:4px solid var(--warn);background:var(--warn-soft);
  border-radius:0 10px 10px 0;padding:12px 15px}
.wd{border-radius:5px;padding:1px 3px}
.wd.hit{background:var(--hit);color:var(--hit-ink);font-weight:600}
/* כשמנוע הדיבור אינו מדווח על גבולות מילים — קורה הרבה בעברית
   באנדרואיד — אין מה להדגיש מילה־מילה, ואז מודגש כל האיבר. הכלל
   הזה חסר, ולכן ההדגשה החלופית לא נראתה כלל: מי שהמנוע שלו שקט
   קיבל טקסט בלי שום סימון והמשיך לחפש את המקום בעיניים. */
.now{background:var(--hit);color:var(--hit-ink);border-radius:8px;
  box-shadow:0 0 0 4px var(--hit)}
[dir="rtl"] .hintbox{border-radius:10px 0 0 10px}

/* ---------- מדדים ---------- */
.bar{height:7px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s,background .3s}
.bar.ok>i{background:var(--ok)}
.bar.mid>i{background:var(--warn)}
.bar.low>i{background:var(--bad)}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--surface2);border:1px solid var(--line)}
.dot.ok{background:var(--ok);border-color:var(--ok)}
.dot.no{background:var(--bad);border-color:var(--bad)}
.dot.flag{box-shadow:0 0 0 2px var(--accent)}
.dot.hp{background:var(--warn);border-color:var(--warn)}
.tile{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--c,var(--accent));

.tile b{display:block;font-size:1.7rem;font-weight:800;line-height:1.2;color:var(--c,var(--ink))}

/* ---------- כרטיס נושא ---------- */
.tpc{position:relative;display:flex;flex-direction:column;gap:9px;text-align:start;background:var(--surface);
  border:1px solid var(--line);border-inline-start:4px solid var(--c,var(--accent));
  border-radius:12px;padding:14px;transition:.15s;box-shadow:var(--shadow);min-width:0}
.tpc:hover{border-color:var(--c,var(--accent));transform:translateY(-2px);box-shadow:0 8px 22px -12px var(--c)}
.tpc:hover{border-inline-start-color:var(--c,var(--accent))}
.tpc.on{border-color:var(--c,var(--accent));background:var(--cs,var(--accent-soft))}
.tpc .tn{color:var(--c,var(--ink))}
.tpc .tn{font-weight:700;font-size:.98rem;overflow-wrap:anywhere}
.tpc .td{color:var(--muted);font-size:.8rem;overflow-wrap:anywhere}
.tpc .tm{display:flex;align-items:center;gap:7px;font-size:.74rem;color:var(--faint)}
.tpc .tm .bar{flex:1;min-width:0}

/* ---------- מתגים והגדרות ---------- */
.tog{display:flex;align-items:center;gap:13px;width:100%;text-align:start;background:var(--surface2);
  border:1px solid transparent;border-radius:12px;padding:13px 15px;transition:.15s;min-width:0}
.tog:hover{border-color:var(--line)}
.tog+.tog{margin-top:9px}
.tog .tt{flex:1;min-width:0}
.tog .tt b{display:block;font-size:.97rem;overflow-wrap:anywhere}
.tog .tt span{display:block;color:var(--muted);font-size:.82rem;overflow-wrap:anywhere}
.sw{position:relative;width:46px;height:27px;border-radius:99px;background:var(--line);flex-shrink:0;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:21px;height:21px;border-radius:50%;
  background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .2s}
.tog[aria-checked="true"] .sw{background:var(--accent)}
.tog[aria-checked="true"] .sw::after{transform:translateX(-19px)}
[dir="ltr"] .tog[aria-checked="true"] .sw::after{transform:translateX(19px)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 auto;min-width:0;border:1px solid var(--line);background:var(--surface);
  border-radius:10px;padding:10px 12px;font-weight:600;font-size:.9rem;color:var(--muted);transition:.15s}
.seg button.on{background:var(--c,var(--ink));color:var(--bg);border-color:transparent}
:root.hc .seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--accent)}
.field{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:11px;
  padding:12px 14px;font-size:1rem;outline:none}
.field:focus{border-color:var(--accent)}

/* ---------- דף נוסחאות ---------- */
.a-base{--c:var(--c-base);--cs:var(--cs-base)}
.a-alg{--c:var(--c-alg);--cs:var(--cs-alg)}
.a-geo{--c:var(--c-geo);--cs:var(--cs-geo)}
.a-data{--c:var(--c-data);--cs:var(--cs-data)}
.chip.area{background:var(--cs);color:var(--c);border-color:transparent}
.arh{display:flex;align-items:center;gap:9px}
.arh::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c);flex-shrink:0}
.fcard{background:var(--surface);border:1px solid var(--line);border-inline-start:4px solid var(--c,var(--line));
  border-radius:12px;padding:13px 15px;min-width:0}
.fcard .fm{color:var(--c,var(--ink))}
.fcard .ft{font-weight:700;font-size:.93rem}
.fcard .fm{margin-top:7px;font-size:1.05rem}
.fcard .fn{color:var(--muted);font-size:.82rem;margin-top:6px;overflow-wrap:anywhere}

/* ---------- שכבות ---------- */
.ov{position:fixed;inset:0;z-index:80;background:rgba(8,11,18,.62);backdrop-filter:blur(3px);
  display:grid;place-items:center;padding:14px}
.ovbox{background:var(--surface);border-radius:16px;width:100%;max-width:560px;max-height:92vh;
  overflow-y:auto;padding:20px;box-shadow:0 24px 70px rgba(0,0,0,.45)}
.ovx{width:36px;height:36px;border-radius:50%;background:var(--surface2);font-size:1.1rem;
  font-weight:700;color:var(--muted);flex-shrink:0;display:grid;place-items:center}

/* ---------- אנימציות מדודות ---------- */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes nudge{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.rise{animation:rise .3s ease both}
.nudge{animation:nudge .3s ease}

footer{border-top:1px solid var(--line);margin-top:auto;background:var(--surface)}
.fbar{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;
  padding-block:16px;font-size:.82rem;color:var(--muted)}
.skip{position:absolute;inset-inline-start:-9999px}
.skip:focus{position:static;display:inline-flex;align-items:center;min-height:44px;margin:8px;padding:8px 14px;background:var(--accent);color:var(--accent-ink);border-radius:8px}

/* יעד מגע לקישור התחתית. קישור טקסט בשורה יוצא בגובה הטקסט —
   15 פיקסלים — וזה קטן מדי לאצבע, גם כשהוא רק לתנאי השימוש. */
.lg-foot a{display:inline-flex;align-items:center;min-height:44px;padding-inline:6px}

/* ---------- יעדי מגע ----------
   44 פיקסלים היא המידה שהפרויקט הזה מחייב את עצמו בה, והיא לא
   נשמרה במסכי התרגול: כפתורי הניווט יצאו 37, "הקראה" ו"רמז" 38,
   ו"עצור" 36. הרוחב נקבע לפי הטקסט; רק הגובה מוצמד. */
.btn,.nb,button.chip,.brand{min-block-size:44px}

/* טקסט על רקע ההדגשה: --accent-ink ולא לבן קבוע. במצב כהה
   ההדגשה בהירה, ולבן עליה יצא 1.5–2.0:1 — כמעט בלתי קריא. */
/* ---------- מצב מורה ---------- */
.te-wrap{position:fixed;inset:0;z-index:2147482500;background:rgba(8,12,20,.72);

/* ---------- רשימת השאלות במסך בניית המבחן ---------- */

/* **הביטוי במסך המבחן, בכיוון שלו — נוסף 17.9.2026.**

   שש האפליקציות האחרות מחזיקות את השורה הזאת; ארבע אפליקציות
   המתמטיקה לא — **ודווקא בהן הביטוי הוא כל השאלה.** בלעדיה
   `2x + 5 = 13` מוצג הפוך במסמך RTL: הדפדפן מסדר את המספרים
   והסימנים לפי כיוון המסמך, ולא לפי כיוון הנוסחה.

   `text-align:right` נשמר בכוונה — הביטוי יושב מתחת לשאלה
   העברית, לא בקצה השמאלי. */
[dir="rtl"] .xq-e{direction:ltr;unicode-bidi:isolate;text-align:right}
.xq-a{margin-top:7px;font-size:.92rem;color:var(--ok);overflow-wrap:anywhere}

/* שאלת מקור נושאת קטע שלם. בלי תקרה הוא דוחף את שאר הרשימה

/* בורר השפה מציג ״العربية״ ו-״Русский״ גם כשהממשק עברי — זה כל
   תפקידו — ולכן `html[lang]` אינו חל עליהם והם יורשים את `--font`,
   שאין בו לא ערבית ולא קירילית. הגופן נקבע לפי השפה שהכפתור מציע,
   ולא לפי שפת הממשק. הסימון אינו אחיד בין האפליקציות (`data-v`,
   `data-n`, `data-l`, ולעיתים גם `lang`), ולכן הכלל מונה את כולם —
   בלוק זהה בתשע האפליקציות, כדי שלא ייסחף ביניהן. */

/* עוזרים לתסריט. כולם מחזירים false כשהאיבר אינו על המסך, כדי
   שצעד שלא מצא את מה שחיפש ידלג ולא יפיל את ההדגמה כולה. */
function demoEl(s){return typeof s==="string"?document.querySelector(s):s}
function demoShow(s){
  var e=demoEl(s); if(!e)return false;
  try{e.scrollIntoView({behavior:"smooth",block:"center"})}catch(err){try{e.scrollIntoView()}catch(err2){}}
  return true;
}
/* מדגיש את האיבר, ורק אז לוחץ — צופה שלא ראה לאן נלחץ לא הבין
   מה קרה. לכן אין צעד קצר מ-1200 אלפיות בתסריטים. */
function demoTap(s){
  var e=demoEl(s); if(!e||e.disabled)return false;
  demoShow(e);
  e.classList.add("demo-tap");
  DEMO.extra.push(setTimeout(function(){
    e.classList.remove("demo-tap");
    /* המסך מצטייר מחדש כל הזמן. אם האיבר שסומן כבר אינו במסמך,
       מחפשים אותו שוב לפי אותו בורר — לחיצה על איבר מת אינה
       עושה דבר, וזה בדיוק צעד שנראה כאילו נתקע. */
    var live=(typeof s==="string"&&!document.contains(e))?demoEl(s):e;
    if(DEMO.on&&live&&!live.disabled&&document.contains(live))try{live.click()}catch(err){}
  },430));
  return true;
}
function demoClick(s){
  var e=demoEl(s); if(!e||e.disabled)return false;
  try{e.click()}catch(err){return false}
  return true;

/* הקלדה אות אחר אות, עם אירוע input אמיתי — שדה חיפוש שמאזין
   ל-input לא היה מגיב להשמה ישירה ל-value. */
function demoType(s,text){
  var e=demoEl(s); if(!e)return false;
  demoShow(e); try{e.focus()}catch(err){}
  e.value=""; var i=0;
  var t=setInterval(function(){
    if(!DEMO.on||!e.parentNode){clearInterval(t);return}
    e.value=String(text).slice(0,++i);
    e.dispatchEvent(new Event("input",{bubbles:true}));
    if(i>=String(text).length)clearInterval(t);
  },85);
  DEMO.extra.push(t);
  return true;
}

/* ESC יוצא. הקשבה בשלב הלכידה, כדי שמסך שכבר מטפל ב-Escape
   לא יבלע את המקש לפני שההדגמה ראתה אותו. */
function demoKey(e){
  if(!DEMO.on)return;
  if(e.key==="Escape"||e.keyCode===27){
    e.preventDefault(); e.stopPropagation();
    demoStop();
  }
}

function demoStart(){
  if(DEMO.on)return;
  DEMO.on=true; DEMO.i=0;
  DEMO.btn.hidden=true; DEMO.bar.hidden=false;
  document.documentElement.classList.add("demo-running");
  demoNext();
}

function demoNext(){
  if(!DEMO.on)return;
  if(DEMO.i>=DEMO_SCRIPT.length){demoStop();return}
  var it=DEMO_SCRIPT[DEMO.i++]||{};
  var d=Math.max(600,it.duration||3000);
  DEMO.txt.textContent=it.subtitle||"";
  DEMO.step.textContent=DEMO.i+" / "+DEMO_SCRIPT.length;
  DEMO.fill.style.transition="none"; DEMO.fill.style.width="0";
  void DEMO.fill.offsetWidth;
  DEMO.fill.style.transition="width "+d+"ms linear";
  DEMO.fill.style.width="100%";
  if(typeof it.action==="function"){
    try{it.action()}catch(err){if(window.console)console.warn("demo:",err)}
  }
  DEMO.timer=setTimeout(demoNext,d);
}

function demoStop(){
  DEMO.on=false;
  if(DEMO.timer){clearTimeout(DEMO.timer);DEMO.timer=null}
  DEMO.extra.forEach(function(t){clearTimeout(t);clearInterval(t)});
  DEMO.extra=[];
  var m=document.querySelectorAll(".demo-tap"),i;
  for(i=0;i<m.length;i++)m[i].classList.remove("demo-tap");
  if(DEMO.bar)DEMO.bar.hidden=true;
  if(DEMO.btn)DEMO.btn.hidden=false;
  document.documentElement.classList.remove("demo-running");
  demoQuiet();
}

}

function fac(c){return c===1?"":c===-1?"−":num(c)}

function term(c,v){

function mat(rows){
  var cols=rows[0].length,out="",c,r;

/* פולינום ממערך מקדמים מהחזקה הגבוהה לנמוכה: poly([2,0,-5,1]) */
function poly(cs,v){
  v=v||"x";

var LANGS={

    poll=setInterval(function(){if(voices().length)finish()},120);

    var l=String(v.lang||"").replace("_","-").toLowerCase();

   של המכשיר, ובמכשיר אחד יושבים כמה קולות באותה שפה באיכות שונה
   מאוד — הראשון הוא לרוב של יצרן המכשיר ולא הטוב שבהם. הניקוד
   הועתק מ"תאוריה מדברת": שם יצרן ומנוע נוירלי מעלים, espeak
   ו-compact מורידים. */

   ממותג מנצח קול נשי שקיים באותו מכשיר — בדיוק מה שהעדפת המגדר
   נועדה למנוע. קודם נשי, אחריו מי שלא זוהה, ורק אז גברי; ובתוך
   כל קבוצה מכריעה האיכות. */

  return pool.slice().sort(function(a,b){

function deviceVoice(){

     כשעוברים לרוסית, והחזרה אליו הייתה מקריאה קירילית במבטא עברי. */
  var want=(state.settings.voiceByLang||{})[LG]||
           (LG==="he"?state.settings.voice:"");

     כל הרשימה, וכפתור "לשמוע" ברשימת הקולות אינו משמיע אלא בוחר —
     לחיצה אחת ליד קול אנגלי נשמרה כקול שמקריא עברית, ומאז כל
     המשפטים נקראו באנגלית. מחפשים רק בתוך שפת הממשק. */
  var mineFirst=hebVoices();
  for(i=0;i<mineFirst.length;i++)if(mineFirst[i].voiceURI===want)return mineFirst[i];

     סריקה על כל הרשימה מצאה קול אנגלי נשי במכשיר שאין בו קול
     עברי נשי — והעברית הוקראה באנגלית. שפה קודמת למגדר. */
  var mine=hebVoices();

     קול אנגלי שמושם על משפט עברי גורר איתו גם את u.lang, והמשפט
     נקרא באנגלית. null משאיר את u.lang בשפה הנכונה ומשאיר לדפדפן
     לבחור — גרוע פחות מהקראה בשפה הלא נכונה. */
  return null;

var HL={el:null,raw:"",spans:[],map:[],timer:null,got:false,added:false};

  if(HL.timer){clearTimeout(HL.timer);HL.timer=null}
  if(HL.el){try{HL.el.innerHTML=HL.raw;HL.el.classList.remove("now")}catch(e){}}
  HL={el:null,raw:"",spans:[],map:[],timer:null,got:false,added:false};

  var shown=(el.textContent||"").replace(/\s+/g," ").trim();
  var said=String(text).replace(/\s+/g," ").trim();

    HL.map.push({from:pos,to:pos+pt.length,i:idx});
    html+='<span class="wd" data-i="'+idx+'">'+esc(pt)+'</span>';
    pos+=pt.length; idx++;

  if(!HL.map.length){hlClear();return}
  el.innerHTML=html;
  HL.spans=el.querySelectorAll(".wd");
  HL.timer=setTimeout(function(){if(!HL.got&&HL.el){HL.added=true;HL.el.classList.add("now")}},1500);
}
function hlAt(c){
  if(!HL.el||!HL.map.length)return;
  HL.got=true;
  if(HL.timer){clearTimeout(HL.timer);HL.timer=null}
  if(HL.added){HL.el.classList.remove("now");HL.added=false}
  for(var k=0;k<HL.map.length;k++){
    if(c>=HL.map[k].from&&c<HL.map[k].to){
      for(var j=0;j<HL.spans.length;j++)HL.spans[j].classList.toggle("hit",j===HL.map[k].i);
      return;
    }
  }
}

    if(insideNumber(spoken,i))continue;

    from=j; i=j-1;

  for(var k=0;k<parts.length;k++){
    var p=parts[k];
    if(p.text.length<=SEG_MAX){ push(p.text,p.start); continue }

      if(cut<SEG_MAX*0.4)cut=rest.lastIndexOf(" ",SEG_MAX);

var GATES={AND:function(a,b){return a&b},OR:function(a,b){return a|b},XOR:function(a,b){return a^b},

  NAND:"NAND הוא ההפך של AND: הוא נותן 0 רק כששתי הכניסות הן 1.",
  NOR:"NOR הוא ההפך של OR: הוא נותן 1 רק כששתי הכניסות הן 0."};

  return c;
}

      steps:[S(_("הפסדים"),_("זרם בליפופים, שינויי שדה בליבה וחיכוך — כולם מחממים."),"P<sub>loss</sub> > 0"),

      rule:"eff",hint:_("האם יש מכונה שלא מתחממת בכלל?")};
  }
  return {ask:_("לאן הולך ההספק שאובד במנוע חשמלי?"),expr:"",
    ans:W(_("בעיקר לחום")),
    wrong:[W(_("חוזר לרשת"),_("ההפסדים אינם חוזרים לרשת. רובם הופכים לחום בליפופים, בליבה ובמסבים.")),
           W(_("נאגר בליבה"),_("הליבה אינה אוגרת אנרגיה לאורך זמן. ההפסדים בה הופכים לחום.")),
           W(_("הופך למתח גבוה יותר"),_("מנוע אינו מעלה מתח. הוא הופך אנרגיה חשמלית למכנית, והשאר הופך לחום."))],
    steps:[S(_("המרת אנרגיה"),_("מנוע הופך אנרגיה חשמלית לאנרגיה מכנית."),""),
           S(_("הפסדים"),_("זרם בליפופים, שינויי שדה בליבה וחיכוך — כולם מחממים."),"P<sub>loss</sub> = P<sub>in</sub> − P<sub>out</sub>")],
    rule:"eff",hint:_("למה מנוע מתחמם כשהוא עובד?")};

/* ---------- 15. מנוע השראה ---------- */
function genMotor(L){
  var p,f=50,ns,s,n;
  p=ri(2,4);ns=60*f/p;
  if(L===1){
    return {ask:_("מהי המהירות הסינכרונית של המנוע?"),expr:"f = 50 Hz ,  p = "+p+" "+_("זוגות קטבים"),
      ans:W(U(ns,"rpm")),
      wrong:[W(U(60*f,"rpm"),_("שכחתם לחלק במספר זוגות הקטבים.")),
             p===2?W(U(60*f*p,"rpm"),_("הכפלתם במספר זוגות הקטבים במקום לחלק. יותר קטבים נותנים מהירות נמוכה יותר.")):
                   W(U(120*f/p,"rpm"),_("הנוסחה עם 120 היא למספר הקטבים. כאן נתון מספר זוגות הקטבים.")),
             W(U(f/p,"rpm"),_("שכחתם להכפיל ב-60. התדר הוא בשניות, והמהירות בסיבובים לדקה."))],
      steps:[S(_("מהירות סינכרונית"),_("המהירות שבה מסתובב השדה המגנטי של הסטטור."),"n<sub>s</sub> = 60 · f ÷ p"),
             S(_("מציבים"),"","n<sub>s</sub> = 60 · 50 ÷ "+p+" = "+U(ns,"rpm"))],
      rule:"ns",hint:_("n<sub>s</sub> = 60 · f ÷ p, כש-p הוא מספר זוגות הקטבים.")};
  }
  s=pick([2,2.5,3,3.5,4,5,6]);n=ns*(100-s)/100;
  if(L===2){
    return {ask:_("מהי ההחלקה של המנוע?"),expr:"n<sub>s</sub> = "+U(ns,"rpm")+" ,  n = "+U(n,"rpm"),
      ans:W(U(s,"%")),
      wrong:[W(U(ns-n,"%"),_("זה ההפרש בסיבובים לדקה. ההחלקה היא ההפרש חלקי המהירות הסינכרונית.")),
             W(U((ns-n)/n*100,"%"),_("חילקתם במהירות הרוטור. מחלקים במהירות הסינכרונית.")),
             W(U(100-s,"%"),_("זו מהירות הרוטור באחוזים מהמהירות הסינכרונית, ולא ההחלקה."))],
      steps:[S(_("החלקה"),_("בכמה הרוטור מפגר אחרי השדה המסתובב."),"s = (n<sub>s</sub> − n) ÷ n<sub>s</sub>"),
             S(_("מציבים"),"","s = ("+ns+" − "+n+") ÷ "+ns+" = "+num(s/100)+" = "+U(s,"%"))],
      rule:"slip",hint:_("s = (n<sub>s</sub> − n) ÷ n<sub>s</sub>.")};
  }
  if(L===3){
    return {ask:_("מהי מהירות הרוטור?"),expr:"f = 50 Hz ,  p = "+p+" "+_("זוגות קטבים")+" ,  s = "+U(s,"%"),
      ans:W(U(n,"rpm")),
      wrong:[W(U(ns,"rpm"),_("זו המהירות הסינכרונית. הרוטור מסתובב מעט לאט יותר.")),
             W(U(ns*(100+s)/100,"rpm"),_("הוספתם את ההחלקה. במנוע הרוטור מפגר אחרי השדה, ולכן מחסרים.")),
             W(U(ns*s/100,"rpm"),_("זה ההפרש בין המהירויות, ולא מהירות הרוטור."))],
      steps:[S(_("מהירות סינכרונית"),"","n<sub>s</sub> = 60 · 50 ÷ "+p+" = "+U(ns,"rpm")),
             S(_("מהירות הרוטור"),"","n = n<sub>s</sub> · (1 − s) = "+ns+" · "+num(1-s/100)+" = "+U(n,"rpm"))],
      rule:"slip",hint:_("קודם n<sub>s</sub>, ואז n = n<sub>s</sub> · (1 − s).")};
  }
  if(Math.random()<0.5){
    return {ask:_("מחליפים בין שתי פאזות בחיבור של מנוע תלת־פאזי. מה קורה?"),expr:"",
      ans:W(_("כיוון הסיבוב מתהפך")),
      wrong:[W(_("המהירות גדלה פי שניים"),_("המהירות תלויה בתדר ובמספר הקטבים, והם לא השתנו.")),
             W(_("המנוע נעצר ולא מתניע"),_("השדה המסתובב עדיין קיים. רק הכיוון שלו התהפך.")),
             W(_("ההספק שלו קטן לחצי"),_("סדר הפאזות קובע את הכיוון, ולא את ההספק."))],
      steps:[S(_("שדה מסתובב"),_("סדר הפאזות קובע לאיזה צד מסתובב השדה בסטטור."),""),
             S(_("החלפה"),_("החלפת שתי פאזות הופכת את הסדר, ולכן גם את הכיוון."),"")],
      rule:"ns",hint:_("מה קובע את כיוון הסיבוב של השדה?")};
  }
  return {ask:_("למה הרוטור של מנוע השראה אינו מגיע למהירות הסינכרונית?"),expr:"",
    ans:W(_("בלי הפרש מהירות אין השראה ואין מומנט")),
    wrong:[W(_("בגלל החיכוך במסבים, ורק בגללו"),_("גם בלי חיכוך בכלל, רוטור במהירות השדה לא היה מקבל זרם מושרה.")),
           W(_("כי המתח ברשת נמוך מדי בשבילו"),_("גם במתח מלא הרוטור מפגר. ההחלקה היא חלק מאופן הפעולה.")),
           W(_("כי התדר ברשת משתנה כל הזמן"),_("התדר ברשת קבוע. הפיגור נובע מהצורך בהשראה."))],
    steps:[S(_("השראה"),_("זרם ברוטור נוצר רק כשהשדה חותך אותו, כלומר כשיש הפרש מהירויות."),""),
           S(_("מסקנה"),_("במהירות סינכרונית אין זרם ברוטור, ולכן גם אין מומנט."),"s > 0")],
    rule:"slip",hint:_("מה צריך כדי שייווצר זרם מושרה ברוטור?")};
}

/* ---------- 16. שנאי ---------- */
function genTrafo(L){
  var Np,Ns,Vp,Vs,Ip,Is,k;
  k=pick([2,4,5,10,20]);Vp=pick([230,400]);
  if(L===1){
    Np=pick([200,400,500,1000]);Ns=Np/k;Vs=Vp/k;
    return {ask:_("מה המתח בליפוף המשני של שנאי אידיאלי?"),
      expr:"V<sub>p</sub> = "+U(Vp,"V")+" ,  N<sub>p</sub> = "+Np+" ,  N<sub>s</sub> = "+Ns,
      ans:W(U(Vs,"V")),
      wrong:[W(U(Vp*k,"V"),_("הפכתם את היחס. במשני יש פחות כריכות, ולכן המתח שם נמוך יותר.")),
             W(U(Vp,"V"),_("בשנאי המתח משתנה לפי יחס הכריכות.")),
             W(U(Vp-k,"V"),_("היחס בין הכריכות מחלק את המתח, ולא מחסר ממנו."))],
      steps:[S(_("יחס כריכות"),_("המתח ביחס ישר למספר הכריכות."),"V<sub>s</sub> ÷ V<sub>p</sub> = N<sub>s</sub> ÷ N<sub>p</sub>"),
             S(_("מציבים"),"","V<sub>s</sub> = "+Vp+" · "+Ns+" ÷ "+Np+" = "+U(Vs,"V"))],
      rule:"trafo",hint:_("V<sub>s</sub> ÷ V<sub>p</sub> = N<sub>s</sub> ÷ N<sub>p</sub>.")};
  }
  if(L===2){
    Vs=Vp/k;Np=pick([500,1000,2000]);Ns=Np/k;
    return {ask:_("כמה כריכות צריך בליפוף המשני?"),
      expr:"V<sub>p</sub> = "+U(Vp,"V")+" ,  V<sub>s</sub> = "+U(Vs,"V")+" ,  N<sub>p</sub> = "+Np,
      ans:W(num(Ns)),
      wrong:[W(num(Np*k),_("הפכתם את היחס. מתח נמוך יותר דורש פחות כריכות.")),
             W(num(Np),_("זה מספר הכריכות בראשוני. כדי לשנות מתח צריך מספר אחר במשני.")),
             W(num(Vs),_("זה המתח במשני, ולא מספר הכריכות."))],
      steps:[S(_("יחס כריכות"),"","N<sub>s</sub> = N<sub>p</sub> · V<sub>s</sub> ÷ V<sub>p</sub>"),
             S(_("מציבים"),"","N<sub>s</sub> = "+Np+" · "+num(Vs)+" ÷ "+Vp+" = "+num(Ns))],
      rule:"trafo",hint:_("מספר הכריכות ביחס ישר למתח.")};
  }
  if(L===3){
    Ip=pick([1,2,5]);Is=Ip*k;Vs=Vp/k;
    return {ask:_("מה הזרם בליפוף המשני של שנאי אידיאלי מוריד מתח?"),
      expr:"V<sub>p</sub> = "+U(Vp,"V")+" ,  V<sub>s</sub> = "+U(Vs,"V")+" ,  I<sub>p</sub> = "+U(Ip,"A"),
      ans:W(U(Is,"A")),
      wrong:[W(U(Ip/k,"A"),_("הזרם הפוך למתח. מתח נמוך יותר במשני בא עם זרם גבוה יותר.")),
             W(U(Ip,"A"),_("בשנאי אידיאלי ההספק נשמר, ולא הזרם.")),
             W(U(Vp*Ip,"A"),_("זה ההספק בליפוף הראשוני, ולא זרם."))],
      steps:[S(_("שימור הספק"),_("בשנאי אידיאלי ההספק בראשוני שווה להספק במשני."),"V<sub>p</sub> · I<sub>p</sub> = V<sub>s</sub> · I<sub>s</sub>"),
             S(_("מציבים"),"","I<sub>s</sub> = "+Vp+" · "+Ip+" ÷ "+num(Vs)+" = "+U(Is,"A"))],
      rule:"trafo",hint:_("בשנאי אידיאלי ההספק בשני הצדדים שווה.")};
  }
  if(Math.random()<0.5){
    return {ask:_("שנאי אידיאלי מעלה את המתח פי 10. מה קורה לזרם בליפוף המשני, ביחס לראשוני?"),expr:"V<sub>s</sub> = 10 · V<sub>p</sub>",
      ans:W(_("קטן פי 10")),
      wrong:[W(_("גדל פי 10"),_("ההספק נשמר, ולכן כשהמתח עולה הזרם יורד.")),
             W(_("לא משתנה"),_("הזרם משתנה הפוך למתח, כי ההספק בשני הצדדים שווה.")),
             W(_("קטן פי 100"),_("הזרם הפוך למתח עצמו, ולא לריבוע שלו."))],
      steps:[S(_("שימור הספק"),"","V<sub>p</sub> · I<sub>p</sub> = V<sub>s</sub> · I<sub>s</sub>"),
             S(_("יחס הפוך"),_("מתח גבוה פי 10 בא עם זרם קטן פי 10."),"I<sub>s</sub> = I<sub>p</sub> ÷ 10")],
      rule:"trafo",hint:_("בשנאי אידיאלי ההספק בשני הצדדים שווה.")};
  }
  return {ask:_("למה מעבירים חשמל למרחקים במתח גבוה מאוד?"),expr:"",
    ans:W(_("כדי להקטין את הזרם ואת ההפסדים בקווים")),
    wrong:[W(_("כדי שהחשמל יגיע מהר יותר"),_("מהירות ההעברה אינה תלויה במתח. המתח הגבוה מקטין את הזרם.")),
           W(_("כי כך קל יותר לייצר חשמל"),_("תחנות הכוח מייצרות במתח נמוך יותר, ושנאים מעלים אותו להעברה.")),
           W(_("כדי להגדיל את ההספק שמגיע לצרכן"),_("ההספק נקבע לפי הצריכה. במתח גבוה אותו הספק עובר בזרם קטן."))],
    steps:[S(_("אותו הספק"),_("P = V · I: מתח גבוה פי 10 נותן זרם קטן פי 10."),""),
           S(_("הפסדים"),_("ההפסדים בקו הם I² · R, ולכן זרם קטן פי 10 נותן הפסד קטן פי 100."),"P<sub>loss</sub> = I² · R")],
    rule:"trafo",hint:_("ההפסד בקו הוא I² · R.")};
}

/* מזהי התחומים הם ASCII ולא השם המוצג. שם עברי ששימש גם כמפתח וגם
   ככותרת אינו יכול להיות מתורגם — כל תרגום היה שובר את החיפוש. */
function lazyTr(obj,fields){
  fields.forEach(function(k){
    var raw=obj[k];
    if(typeof raw!=="string")return;
    Object.defineProperty(obj,k,{enumerable:true,configurable:true,
      get:function(){return _(raw)}});
  });
}

function badStr(s){return !s||/NaN|Infinity|undefined|null/.test(s)}

function buildQ(topicId,level){
  var t=topicById(topicId);
  if(!t)t=TOPICS[0];
  var raw=null,tries=0,opts=null,i,p,seen,ansP,best=null;
  /* מגרילים עד שיוצאות ארבע אפשרויות שונות. מסיח שיצא במקרה שווה
     לתשובה נעלם בסינון, והשאלה הייתה מציגה שלוש — קל מדי בלי סיבה.
     אם אחרי כמה ניסיונות עדיין לא, לוקחים את ההגרלה העשירה ביותר. */
  while(tries<12){
    tries++;
    try{raw=t.gen(level)}catch(e){raw=null}
    if(!raw||!raw.ans||badStr(plainOf(raw.ans.h)))continue;
    ansP=plainOf(raw.ans.h);
    seen={};seen[ansP]=1;
    opts=[{h:raw.ans.h,t:ansP,ok:true,why:""}];
    for(i=0;i<(raw.wrong||[]).length;i++){
      p=plainOf(raw.wrong[i].h);
      if(badStr(p)||seen[p])continue;
      seen[p]=1;
      opts.push({h:raw.wrong[i].h,t:p,ok:false,why:raw.wrong[i].why||""});
    }
    if(!best||opts.length>best.opts.length)best={raw:raw,opts:opts};
    if(opts.length>=4)break;
  }
  if(best){raw=best.raw;opts=best.opts}
  if(!raw)raw={ask:_("חשבו"),expr:"1 + 1",ans:W("2"),wrong:[W("1"),W("3"),W("11")],steps:[S(_("חיבור"),"","1 + 1 = 2")],hint:"",rule:"order"};
  if(!opts||opts.length<2){
    ansP=plainOf(raw.ans.h);
    opts=[{h:raw.ans.h,t:ansP,ok:true,why:""}];
  }
  shuffle(opts);
  var sayTxt=speakProse(plainOf(raw.ask))+(raw.expr?". "+speakMath(plainOf(raw.expr)):"");
  return {
    topic:t.id,topicName:t.name,level:level,
    ask:raw.ask,expr:raw.expr||"",fig:raw.fig||"",
    options:opts,steps:raw.steps||[],hint:raw.hint||"",rule:raw.rule||"",
    say:sayTxt
  };
}

var P={list:[],i:0,q:null,phase:"ask",picked:[],hints:0,steps:0,usedHelp:false,results:[],startedAt:0};

function mastery(id){
  var m=state.mastery[id];
  if(!m){m={seen:0,ok:0,help:0,m:0};state.mastery[id]=m}
  return m;
}
function activeTopics(){
  var chosen=state.topics.filter(function(id){return !!topicById(id)});
  if(chosen.length)return chosen;
  return topicsForTrack(state.track).map(function(t){return t.id});
}
/* בחירת הנושא הבא: מי שחלש יותר מקבל יותר תורות, ומדי כמה
   שאלות חוזר נושא שנפלו בו קודם. ככה החזרה קורית לבד. */
function nextTopic(idx){
  var pool=activeTopics();
  if(idx>0&&idx%3===2&&state.wrongBank.length){
    var w=state.wrongBank[state.wrongBank.length-1-Math.floor(Math.random()*Math.min(5,state.wrongBank.length))];
    if(w&&pool.indexOf(w.topic)>=0)return w.topic;
  }
  var weights=pool.map(function(id){return 110-mastery(id).m}),total=0,i;
  for(i=0;i<weights.length;i++)total+=weights[i];
  var r=Math.random()*total;
  for(i=0;i<pool.length;i++){r-=weights[i];if(r<=0)return pool[i]}
  return pool[pool.length-1];
}
function startRound(forceTopic){
  var n=state.settings.roundLen,i;
  P.list=[];
  for(i=0;i<n;i++)P.list.push(forceTopic||nextTopic(i));
  P.i=0;P.results=[];P.startedAt=Date.now();
  loadQ();
}
function loadQ(){
  P.jsT0=Date.now();
  P.q=buildQ(P.list[P.i],state.level);
  P.phase="ask";P.picked=[];P.hints=0;P.steps=0;P.usedHelp=false;
  if(state.settings.autoSteps)P.steps=1;
}
function roundDone(){return P.i>=P.list.length}

/* השליטה בנושא נמדדת כממוצע נע של הביצועים האחרונים, ולא
   כמונה שמטפס לאט. תלמיד שענה נכון צריך לראות מספר שמשקף
   את זה מיד — אחרת המדד מתסכל במקום לעזור. */
function scoreAnswer(ok){
  jsAnswer(ok);
  var m=mastery(P.q.topic),d=dayRec(),score;
  m.seen++;d.a++;state.stats.answered++;
  touchDay();
  if(ok&&!P.usedHelp&&P.picked.length===1){
    m.ok++;d.c++;state.stats.correct++;state.stats.xp+=10;
    score=1;P.results.push("ok");
  }else if(ok&&!P.usedHelp){
    m.ok++;d.c++;state.stats.correct++;state.stats.xp+=4;
    score=0.7;P.results.push("ok");
  }else if(P.usedHelp){
    m.help++;state.stats.helped++;state.stats.xp+=2;
    score=0.35;P.results.push("hp");
  }else{
    score=0;P.results.push("no");
  }
  m.m=m.seen===1?Math.round(score*100):Math.round(m.m*0.6+score*40);
  if(!ok||P.usedHelp){
    state.wrongBank.push({topic:P.q.topic,ts:Date.now()});
    if(state.wrongBank.length>40)state.wrongBank.shift();
  }
  save();
}

function viewHome(){

  var weak=pool.slice().sort(function(a,b){
    var ma=mastery(a),mb=mastery(b);
    if(!ma.seen&&mb.seen)return 1;
    if(ma.seen&&!mb.seen)return -1;
    return ma.m-mb.m;
  })[0];
  var wt=topicById(weak);
  var hello=state.name?_f("היי {0}.", esc(state.name)):_("היי.");
  var h='<div class="wrap" style="padding-top:22px;padding-bottom:40px">';

     '<div class="row">'+
       (!state.settings.calm&&state.stats.streakDays>1?_f("{0}{1} {2} ימים ברצף</span>", '<span class="chip warn">', ic("flame",14), state.stats.streakDays):"")+
_f("{0}{1} {2} נק'</span>", '<span class="chip">', ic("star",14), state.stats.xp)+
     '</div></div>';
  h+='<div class="card pad" style="margin-top:18px">'+
     '<div class="spread"><div style="min-width:0"><div class="h2">'+_('תרגול')+'</div>'+
_f("{0}{1} שאלות · {2} · {3} נושאים</p></div>", '<p class="sub sm">', state.settings.roundLen, LVL[state.level-1], pool.length)+
     levelPicker()+'</div>'+
     '<button class="btn btn-p w" style="margin-top:14px;padding:15px;font-size:1.1rem" data-a="start">'+
_f("{0} מתחילים סבב</button>", ic("pencil",19))+
     (wt?'<button class="btn btn-g w" style="margin-top:9px" data-a="starttopic" data-t="'+wt.id+'">'+
_f("{0} תרגול ממוקד: {1}</button>", ic("target",17), wt.name):"")+
     '</div>';
  if(wt&&mastery(wt.id).seen){
    var pre=wt.pre&&wt.pre.length?topicById(wt.pre[0]):null;
    if(pre&&mastery(wt.id).m<40&&mastery(pre.id).m<70){
      h+='<div class="card pad" style="margin-top:14px;border-inline-start:4px solid var(--warn)">'+
_f("{0}{1}<b>הצעה</b></div>", '<div class="row">', ic("bulb",18))+
_f("{0}{1} עדיין תופס. הרבה פעמים זה לא הנושא עצמו אלא מה שמתחתיו — כאן זה {2}. שווה לתרגל אותו קודם.</p>", '<p class="sub sm">'+_('נראה ש-'), wt.name, pre.name)+
_f("{0}{1}{2}{3} לתרגל {4}</button></div>", '<button class="btn btn-g" style="margin-top:10px" data-a="starttopic" data-t="', pre.id, '">', ic("arrow",16), pre.name);
    }
  }
  var byNeed=pool.slice().sort(function(a,b){
    var ma=mastery(a),mb=mastery(b);
    if(!ma.seen&&!mb.seen)return 0;
    if(!ma.seen)return 1;
    if(!mb.seen)return -1;
    return ma.m-mb.m;
  }).slice(0,6);
  h+='<h2 class="h2" style="margin-top:26px">'+_('מה כדאי לתרגל עכשיו')+'</h2>'+
     '<p class="sub sm">'+_('שישה נושאים לפי מה שעדיין לא יושב. לחיצה פותחת תרגול ממוקד.')+'</p>'+

     byNeed.map(function(id){

         '<span class="tn">'+tp.name+'</span><span class="td">'+tp.desc+'</span>'+masteryBar(id)+'</button>';
     }).join("")+'</div>';
  h+=_f("{0}{1} כל {2} הנושאים</button>", '<div class="row" style="margin-top:20px"><button class="btn btn-g" data-a="go" data-v="topics">', ic("list",17), pool.length)+
_f("{0}{1} דף נוסחאות</button></div>", '<button class="btn btn-g" data-a="go" data-v="formulas">', ic("book",17));

}
/* ---------- תרגול ---------- */
function viewPractice(){
  if(!P.q)startRound();
  if(P.phase==="done")return viewSummary();
  var q=P.q,calm=state.settings.calm;
  var h='<div class="wrap" style="padding-top:18px;padding-bottom:44px">';
  /* שורת מצב */
  h+='<div class="spread">'+
      '<div class="row"><span class="chip area '+topicCls(q.topic)+'">'+q.topicName+'</span>'+
_f("{0}{1} מתוך {2}</span></div>", '<span class="chip">'+_('שאלה')+' ', (P.i+1), P.list.length)+
      '<div class="row"><span class="dots">'+
        P.list.map(function(ignored,i){
          var c=i<P.results.length?(P.results[i]==="ok"?"ok":P.results[i]==="hp"?"hp":"no"):"";
          return '<span class="dot '+c+'"></span>';
        }).join("")+'</span>'+
_f("{0}{1} עצירה</button></div>", '<button class="btn btn-g" style="padding:8px 12px;font-size:.85rem" data-a="stop">', ic("pause",15))+
     '</div>';
  h+='<div class="grid" style="grid-template-columns:minmax(0,1fr);margin-top:14px">';
  /* כרטיס השאלה */
  h+='<div class="card pad rise '+topicCls(q.topic)+'" style="border-top:3px solid var(--c)">';
  h+='<p style="font-size:clamp(1rem,3.6vw,1.15rem);font-weight:600">'+q.ask+'</p>';
  if(q.expr)h+='<p class="mline" style="margin-top:14px">'+q.expr+'</p>';
  if(q.fig)h+=q.fig;
  /* כפתורי עזר */
  h+='<div class="row" style="margin-top:16px;gap:8px">'+
     (state.settings.tts?_f("{0}{1} הקראה</button>", '<button class="btn btn-g" style="padding:9px 13px;font-size:.88rem" data-a="read">', ic("speaker",16)):"")+
_f("{0}{1}>{2} רמז</button>", '<button class="btn btn-g" style="padding:9px 13px;font-size:.88rem" data-a="hint"', (P.hints>0?" disabled":""), ic("bulb",16))+(window.TUTOR&&TUTOR.on()?'<button class="btn ghost" data-a="tutor" style="margin-inline-start:6px">'+esc(TUTOR.label())+"</button>":"")+
_f("{0}{1}>{2} פתרון מודרך</button>", '<button class="btn btn-g" style="padding:9px 13px;font-size:.88rem" data-a="guide"', (P.steps>0?" disabled":""), ic("steps",16))+
     (q.rule?_f("{0}{1}{2}{3} הנוסחה</button>", '<button class="btn btn-g" style="padding:9px 13px;font-size:.88rem" data-a="rule" data-r="', q.rule, '">', ic("book",16)):"")+
     '</div>';
  if(P.hints>0&&q.hint)h+='<div class="hintbox rise"><b>'+_('רמז')+'</b><div class="sm hintxt" style="margin-top:3px">'+q.hint+'</div></div>';
  /* תשובות */
  var keys=["1","2","3","4"];
  h+='<div class="opts">'+q.options.map(function(o,i){
    var cls="opt",dis="";
    var wasPicked=P.picked.indexOf(i)>=0;
    if(P.phase==="reveal"){
      dis=" disabled";
      if(o.ok)cls+=" right";
      else if(wasPicked)cls+=calm?" gone":" wrong";
      else cls+=" dim";
    }else if(wasPicked){cls+=calm?" gone":" wrong";dis=" disabled"}
    return '<button class="'+cls+'"'+dis+' data-a="ans" data-i="'+i+'">'+
      '<span class="k">'+keys[i]+'</span><span class="m">'+o.h+'</span></button>';
  }).join("")+'</div>';
  /* אבחון הטעות האחרונה */
  if(P.lastWhy&&P.phase!=="reveal"){
    h+='<div class="diag rise"><b>'+_('מה קרה כאן')+'</b><div class="sm" style="margin-top:3px">'+P.lastWhy+'</div></div>';
  }
  h+='</div>';
  /* פתרון מודרך */
  if(P.steps>0||P.phase==="reveal"){
    var showAll=P.phase==="reveal";
    var shown=showAll?q.steps.length:Math.min(P.steps,q.steps.length);
    h+=_f("{0}{1}{2}{3} הפתרון, צעד אחר צעד</div>", '<div class="card pad rise ', topicCls(q.topic), '"><div class="spread"><div class="h2" style="color:var(--c)">', ic("steps",18))+
       (state.settings.tts?_f("{0}{1} הקראה</button>", '<button class="btn btn-g" style="padding:8px 12px;font-size:.85rem" data-a="readsteps">', ic("speaker",15)):"")+'</div>';
    h+='<div class="steps">'+q.steps.map(function(s,i){
      if(i>=shown)return "";
      return '<div class="step'+(i===q.steps.length-1?" last":"")+'"><div class="st"><span class="num">'+(i+1)+'</span>'+s.t+'</div>'+
        (s.d?'<div class="sd">'+s.d+'</div>':"")+
        (s.m?'<div class="mstep">'+s.m+'</div>':"")+'</div>';
    }).join("")+'</div>';
    if(!showAll&&shown<q.steps.length){
      h+='<button class="btn btn-p w" style="margin-top:12px" data-a="nextstep">'+_('הצעד הבא')+' '+ic("arrow",17)+'</button>';
      h+='<p class="sub xs" style="text-align:center;margin-top:8px">'+_('אפשר לעצור בכל שלב ולנסות להמשיך לבד.')+'</p>';
    }
    h+='</div>';
  }
  /* פס תחתון אחרי מענה */
  if(P.phase==="reveal"){
    var kind=P.results[P.results.length-1];
    h+='<div class="card pad rise" style="border-inline-start:4px solid var(--'+(kind==="ok"?"ok":kind==="hp"?"accent":"bad")+')">'+
       '<div class="row">'+ic(kind==="ok"?"check":"bulb",19)+'<b>'+lineFor(kind)+'</b></div>'+
       '<button class="btn btn-p w" style="margin-top:12px;padding:14px" data-a="next">'+
         (P.i+1>=P.list.length?_("לסיכום הסבב"):_("לשאלה הבאה"))+' '+ic("arrow",18)+'</button>'+
       (state.settings.keys?'<p class="sub xs" style="text-align:center;margin-top:8px">'+_('אפשר גם ללחוץ Enter')+'</p>':"")+
       '</div>';
  }
  h+='</div>';
  if(state.settings.keys&&P.phase==="ask")
    h+='<p class="sub xs" style="margin-top:14px;text-align:center">'+_('מקלדת: 1–4 תשובה · רווח הקראה · H רמז · S פתרון')+'</p>';
  return h+'</div>';
}

/* ---------- סיכום סבב ---------- */
function viewSummary(){
  var ok=P.results.filter(function(r){return r==="ok"}).length;
  var hp=P.results.filter(function(r){return r==="hp"}).length;
  var no=P.results.length-ok-hp;
  var pct=Math.round(ok/Math.max(1,P.results.length)*100);
  var byTopic={},i;
  for(i=0;i<P.list.length&&i<P.results.length;i++){
    var id=P.list[i];
    if(!byTopic[id])byTopic[id]={ok:0,n:0};
    byTopic[id].n++;if(P.results[i]==="ok")byTopic[id].ok++;
  }
  var worst=null;
  for(var k in byTopic)if(byTopic[k].n>=2&&(!worst||byTopic[k].ok/byTopic[k].n<byTopic[worst].ok/byTopic[worst].n))worst=k;
  var title=pct>=85?_("סבב חזק."):pct>=60?_("סבב טוב."):pct>=35?_("סבב עם עבודה."):_("סבב קשה — וזה בסדר.");
  var sub=pct>=85?_("אתם שולטים ברוב מה שתרגלתם כאן.")
       :pct>=60?_("רוב הדברים במקום. יש נקודה אחת או שתיים שכדאי לחדד.")
       :pct>=35?_("חלק מהחומר עוד לא יושב. זה בדיוק מה שמדידה כזאת נועדה להראות.")
       :_("סבב כזה לא אומר עליכם כלום חוץ מזה שהחומר הזה חדש. שווה לרדת רמה ולבנות מלמטה.");
  var h='<div class="wrap" style="padding-top:26px;padding-bottom:44px;max-width:760px">';
  h+='<div class="card pad rise"><h1 class="h1">'+title+'</h1><p class="sub">'+sub+'</p>'+
     '<div class="grid g4" style="margin-top:18px">'+
_f("{0}{1}</b><span>נכון לבד</span></div>", '<div class="tile" style="--c:var(--ok)"><b>', ok)+
_f("{0}{1}</b><span>עם פתרון מודרך</span></div>", '<div class="tile" style="--c:var(--c-alg)"><b>', hp)+
_f("{0}{1}</b><span>לא נפתרו</span></div>", '<div class="tile" style="--c:var(--bad)"><b>', no)+
_f("{0}{1}%</b><span>דיוק</span></div>", '<div class="tile" style="--c:var(--c-geo)"><b>', pct)+
     '</div>';
  h+='<hr class="sep"><div class="h2">'+_('לפי נושא')+'</div><div class="grid" style="margin-top:10px">'+
     Object.keys(byTopic).map(function(id){
       var b=byTopic[id],tp=topicById(id);
       return '<div class="spread '+topicCls(id)+'" style="gap:8px"><span class="arh">'+tp.name+'</span>'+
_f("{0}{1}{2}{3} מתוך {4}</span></div>", '<span class="chip ', (b.ok===b.n?"ok":b.ok===0?"bad":"warn"), '">', b.ok, b.n);
     }).join("")+'</div>';
  if(worst&&byTopic[worst].ok<byTopic[worst].n){
    var wt=topicById(worst);
    h+='<div class="card pad" style="margin-top:16px;background:var(--surface2)">'+
_f("{0}{1}<b>מה לקחת מכאן</b></div>", '<div class="row">', ic("target",17))+
_f("{0}{1} היה הנושא שהכי הפריע בסבב הזה. סבב ממוקד אחד בו יעשה יותר מעוד עשר שאלות מעורבות.</p>", '<p class="sub sm">', wt.name)+
_f("{0}{1}{2}{3} סבב ממוקד ב{4}</button></div>", '<button class="btn btn-p" style="margin-top:10px" data-a="starttopic" data-t="', worst, '">', ic("pencil",16), wt.name);
  }
  h+='<div class="row" style="margin-top:18px">'+
_f("{0}{1} סבב נוסף</button>", '<button class="btn btn-p" data-a="start">', ic("refresh",17))+
_f("{0}{1} לדף הבית</button>", '<button class="btn btn-g" data-a="go" data-v="home">', ic("home",17))+
_f("{0}{1} להתקדמות</button></div>", '<button class="btn btn-g" data-a="go" data-v="progress">', ic("chart",17));
  return h+'</div></div>';
}

/* ============================================================
   18. מבחן כיתתי — פרסום בוואטסאפ, קבלת תשובות וציונים
   ------------------------------------------------------------
   אין שרת, ואין כוונה שיהיה. לכן המבחן אינו נשלח לשום מקום:
   הוא *נארז לתוך הקישור*. המורה מקבל קישור, שולח אותו בוואטסאפ,
   והמכשיר של התלמיד בונה מהקישור בדיוק את אותן שאלות.

   מה שהופך את זה לאפשרי הוא שכל מחולל שאלות כאן משתמש ב-
   Math.random בלבד. אם מזרעים אותו, אותו זרע מייצר את אותן
   שאלות ואת אותו סדר תשובות — אצל המורה ואצל התלמיד. הקישור
   נושא זרע ורשימת נושאים, לא עשרים שאלות מלאות, ולכן הוא נשאר
   קצר מספיק לוואטסאפ.

   שלוש מגבלות שנאמרות כאן במפורש כי הן חלק מהתכנון:
   · אין איסוף אוטומטי. התלמיד שולח קוד תשובות בוואטסאפ, והמורה
     מדביק אותו. זה המחיר של אפס שרת ואפס עלות.
   · אפשר לזייף קוד. הציון מחושב מחדש אצל המורה מתוך התשובות
     ולא נלקח מהתלמיד, אבל אין כאן הגנה קריפטוגרפית — זה מבחן
     כיתתי מעצב, לא בגרות.
   · שמות התלמידים נשארים במכשיר של המורה. הם לא עוברים דרך
     שום שרת, כי אין שרת.
   ============================================================ */
var GENV=7;                 /* גרסת המחוללים. מבחן שנוצר בגרסה אחרת
                               אינו נפתח — עדיף הודעה ברורה מאשר
                               עשרים שאלות אחרות בשקט. */
var EKEY="shlav-exams-electric-v1";   /* מפתח לאפליקציה הזאת בלבד */
var EKEY_OLD="shlav-exams-v1";  /* המפתח המשותף הישן. לקריאה בלבד, לא נמחק. */

/* --- מחולל מזורע. mulberry32: קצר, מהיר, ופיזור טוב דיו --- */
function withSeed(seed,fn){
  var real=Math.random,s=(seed>>>0)||1;
  Math.random=function(){
    s|=0; s=s+0x6D2B79F5|0;
    var t=Math.imul(s^s>>>15,1|s);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
  try{return fn()}finally{Math.random=real}
}
function hash32(str){
  var h=0x811c9dc5,i;
  for(i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193)}
  return (h>>>0);
}
/* base64url. הניקוי בפענוח אינו קוסמטי: וואטסאפ שובר מחרוזות
   ארוכות בשורות, ורווח אחד הורס את כל הקוד. */
function b64e(str){
  var bytes=new TextEncoder().encode(str),bin="",i;
  for(i=0;i<bytes.length;i+=8192)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));
  return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function b64d(s){
  s=String(s||"").replace(/[^A-Za-z0-9\-_]/g,"").replace(/-/g,"+").replace(/_/g,"/");
  while(s.length%4)s+="=";
  var bin=atob(s),bytes=new Uint8Array(bin.length),i;
  for(i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
/* הזרע של המשבצת נכנס למזהה: שני מבחנים באותם נושאים ובאותה
   רמה, שהמורה החליף באחד מהם שאלה, אינם אותו מבחן. מבחן ישן
   שאין לו זרעים מקבל בדיוק את המזהה שקיבל תמיד — אחרת ההגשות
   שכבר נקלטו אליו מתייתמות. */
function examId(spec){return hash32(spec.s+"|"+spec.q.map(function(x){
  return x[0]+x[1]+(x.length>2?"@"+x[2]:"")}).join(",")).toString(36)}
function encodeExam(spec){return b64e(JSON.stringify(spec))}
function decodeExam(code){
  try{
    var o=JSON.parse(b64d(code));
    if(!o||!o.q||!o.q.length||typeof o.s!=="number")return null;
    o.q=o.q.filter(function(x){return topicById(x[0])});
    return o.q.length?o:null;
  }catch(e){return null}
}
/* בונה את שאלות המבחן. אותו זרע → אותן שאלות, גם אצל המורה
   כשהוא בודק וגם אצל התלמיד כשהוא נבחן. */
function examQuestions(spec){
  /* מסננים נושאים שאינם מוכרים לאפליקציה הזאת, בדיוק כמו decodeExam.
     בלי הסינון buildQ מחזיר null על נושא זר, והמסך נופל על
     q.topic של null. עדיף לדלג בשקט מאשר להתרסק. */
  var pairs=(spec.q||[]).filter(function(x){return !!topicById(x[0])});
  /* מבחן שנבנה עם זרע לכל משבצת נבנה משבצת אחרי משבצת, וכל
     שאלה תלויה בזרע שלה בלבד — כך המורה יכול להחליף אחת מהן.
     מבחן ישן, בלי זרעים, חייב להיבנות בדיוק כפי שנבנה ביום

/* --- בחירת השאלות בידי המורה ---------------------------------
   עד כאן המורה בחר נושאים, רמה ומספר שאלות — והשאלות עצמן הוגרלו

   התלמידים. מעכשיו כל שאלה היא משבצת נפרדת עם זרע משלה: המורה
   רואה אותה לפני השליחה, מחליף אותה בשאלה אחרת מאותו נושא,
   מסיר אותה, או מוסיף שאלה מנושא שחסר לו.

   הזרע הנפרד לכל משבצת הוא מה שמאפשר את זה. בזרם אקראי אחד
   ומשותף, כפי שהיה עד כאן, החלפה של השאלה השלישית הייתה משנה
   גם את הרביעית ואת החמישית — כלומר לא "החלפה" אלא הגרלה מחדש
   של כל מה שאחריה.

   24 ביט ולא 32: הזרע נוסע בתוך הקישור שנשלח בוואטסאפ, וזרע
   קצר יותר הוא קישור קצר יותר. שישה־עשר מיליון אפשרויות למשבצת
   הן הרבה מעבר למה שהמחולל עצמו יודע לייצר. */
function exNewSeed(){return (Math.random()*16777215)>>>0}
function exSlot(topicId,level){return [topicId,level,exNewSeed()]}
/* אותו זרע → אותה שאלה בדיוק: אצל המורה כשהוא בוחר, ואצל
   התלמיד כשהוא נבחן. */
function exBuildSlot(slot){
  if(!slot||!topicById(slot[0]))return null;
  return withSeed(slot[2],function(){return buildQ(slot[0],slot[1])})||null;
}
/* מסך הבנייה מצייר את עצמו מחדש אחרי כל לחיצה, ובניית עשרים
   וחמש שאלות בכל ציור מיותרת. המטמון הוא לתצוגה בלבד — מי
   שנבחן בונה את שאלותיו מחדש, כדי שאיש לא יערוך בטעות אובייקט
   שגם מסך אחר מחזיק בו. */
var EXQCACHE={};
/* לכל אפליקציה מנגנון שפה משלה, ולא לכולן אותם שמות. הפנייה
   דרך window ולא בשם ישיר, כי שם שאינו קיים באפליקציה מסוימת
   הוא שגיאה בעיני הבודקים — רעש שמסתיר שגיאה אמיתית. */
function exLangKey(){
  try{
    var g=(typeof window!=="undefined")?window:{};
    if(typeof g.xlg==="function")return g.xlg();
    if(typeof g.LG==="string")return g.LG;
    return (state&&state.settings&&state.settings.lang)||"he";
  }catch(e){return "he"}
}
function exPreviewQ(slot){
  if(!slot)return null;
  var k=slot[0]+"|"+slot[1]+"|"+slot[2]+"|"+exLangKey();
  if(!(k in EXQCACHE)){
    /* מורה שמחליף שאלות שוב ושוב מייצר מפתח חדש בכל לחיצה.
       מטמון שרק גדל הוא דליפה; מרוקנים אותו ומתחילים מחדש. */
    if(Object.keys(EXQCACHE).length>400)EXQCACHE={};
    EXQCACHE[k]=exBuildSlot(slot);
  }
  return EXQCACHE[k];
}
function exTopicName(id){
  var t=topicById(id); if(!t)return "";
  var g=(typeof window!=="undefined")?window:{};

function exRightAnswer(q){
  var i; if(!q||!q.options)return null;
  for(i=0;i<q.options.length;i++)if(q.options[i].ok)return q.options[i];
  return null;
}
/* המשבצות שהמורה עורך. נבנות מחדש רק כשנושא, רמה או מספר
   השאלות משתנים; עריכה של משבצת בודדת נשמרת. */
function exSlots(){
  if(EB.q&&EB.q.length)return EB.q;
  var tops=EB.topics.filter(function(x){return topicById(x)});
  if(!tops.length)tops=topicsForTrack(state.track).slice(0,3).map(function(t){return t.id});
  /* אותה שאלה פעמיים באותו מבחן היא שאלה מבוזבזת, והיא ודאית כשברמה
     ארבעה פריטים והמורה ביקש עשר שאלות: הזרע נבחר באקראי ובלי זיכרון,
     ונמדד מבחן שבו אותו מושג הופיע ארבע פעמים מתוך עשר. מגלגלים מחדש
     עד שתים־עשרה פעמים, ואם כל השאלות האפשריות כבר נלקחו — משאירים
     כפילות במקום להיתקע. */
  var q=[],seen={},i,tries,sl,pq,key;
  for(i=0;i<EB.n;i++){
    for(tries=0;tries<12;tries++){
      sl=exSlot(tops[i%tops.length],EB.level);
      pq=exPreviewQ(sl); key=pq&&pq.ask?plainOf(pq.ask):"";
      if(!key||!seen[key])break;
    }
    if(key)seen[key]=1;
    q.push(sl);
  }
  /* מערבבים כאן ולא בשליחה: המורה רואה את הסדר הסופי ומאשר אותו. */
  EB.q=shuffle(q);

}

   חסרה קידומת חיוג", והתשובות לא נשלחו. אפס מוביל הוא מספר ישראלי
   מקומי ומקבל 972; "00" בהתחלה הוא קידומת בינלאומית ונופל; מספר
   שכבר מתחיל בקידומת מדינה נשאר כפי שהוא. */
function waLink(text,phone){
  var p=String(phone||"").replace(/[^0-9]/g,"");
  if(p.indexOf("00")===0)p=p.slice(2);
  else if(p.charAt(0)==="0")p="972"+p.slice(1);
  return "https://wa.me/"+p+"?text="+encodeURIComponent(text);
}

function exAdoptLegacy(){
  var added=0;
  try{
    var raw=localStorage.getItem(EKEY_OLD); if(!raw)return;
    var old=JSON.parse(raw); if(!old||!old.list||!old.list.length)return;
    var have={},i,ex;
    for(i=0;i<EX.list.length;i++)have[EX.list[i].id]=1;
    for(i=0;i<old.list.length;i++){
      ex=old.list[i];
      if(!ex||!ex.id||have[ex.id])continue;
      if(!exSpecKnown(ex.spec))continue;
      EX.list.push(ex); have[ex.id]=1; added++;

}
function exLoad(){
  try{var r=localStorage.getItem(EKEY);if(r){var o=JSON.parse(r);if(o&&o.list)EX=o}}catch(e){}
  if(!EX.list)EX.list=[];
  exAdoptLegacy();
}

function decodeResult(code){

    if(!o||!o.i||!o.a||!o.a.length)return null;
    o.ok=(o.c===hash32(JSON.stringify([o.i,o.n,o.a])).toString(36));

/* הציון מחושב כאן מחדש מתוך התשובות. מה שהתלמיד שלח הוא מה
   שסימן, לא כמה הוא קיבל. */
function gradeResult(spec,res){

              picked:(a>=0&&q.options[a])?q.options[a].t:"—",
              answer:(q.options.filter(function(o){return o.ok})[0]||{}).t||""});

/* ------------------------------------------------------------
   ייצוא CSV של ההגשות.
   העתקת הטבלה נותנת טקסט מופרד בטאבים — נוח להדבקה, אבל לא קובץ.
   מורה שרוצה למיין, לסנן או לחשב ממוצע צריך גיליון. שורה לכל תלמיד,
   ועמודה לכל שאלה, כדי שאפשר יהיה לראות מיד באיזו שאלה נפלה הכיתה.
   ה-BOM בהתחלה הוא מה שגורם לאקסל לקרוא עברית, ערבית ורוסית נכון
   במקום ג׳יבריש — בלעדיו הקובץ נפתח שבור בדיוק אצל מי שצריך אותו.
   ------------------------------------------------------------ */
function csvCell(v){
  var s=(v===undefined||v===null)?"":String(v);
  return /[",\n\r;\t]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function csvRow(a){ return a.map(csvCell).join(",") }

   ילד יכול למחוק מבחן, לראות ציונים של חברים, או לפתוח מבחן
   ולראות מראש את השאלות.
   זו אינה אבטחה, ואסור להציג אותה ככזאת: מי שיודע לפתוח כלי
   פיתוח יעקוף אותה בשנייה. זו נעילה מפני יד סקרנית — בדיוק מה
   שצריך כאן, ולא יותר.
   כל עוד לא נבחר קוד, שום דבר לא משתנה והמסכים גלויים כתמיד.
   ============================================================ */

/* גיבוב חלש כגיבוי בלבד. SubtleCrypto קיים בכל דפדפן מודרני
   בהקשר מאובטח, ו-GitHub Pages הוא כזה. */
function teWeak(s){var h=5381,i;for(i=0;i<s.length;i++)h=((h*33)^s.charCodeAt(i))>>>0;return "w"+h.toString(16)}
function teHash(pin,salt,cb){
  var msg=salt+"|"+pin;
  try{
    if(window.crypto&&crypto.subtle&&crypto.subtle.digest&&window.TextEncoder){
      crypto.subtle.digest("SHA-256",new TextEncoder().encode(msg)).then(function(d){
        var a=Array.prototype.slice.call(new Uint8Array(d));
        cb(a.map(function(b){return ("0"+b.toString(16)).slice(-2)}).join(""));
      },function(){cb(teWeak(msg))});
      return;
    }
  }catch(e){}
  cb(teWeak(msg));
}
function teSalt(){
  var s="";
  try{
    var a=new Uint8Array(8);crypto.getRandomValues(a);
    s=Array.prototype.slice.call(a).map(function(b){return ("0"+b.toString(16)).slice(-2)}).join("");
  }catch(e){ s=String(Date.now())+Math.random().toString(36).slice(2) }
  return s;
}
/* השהיה אחרי ניסיונות כושלים. ארבע ספרות הן עשרת אלפים
   אפשרויות, וילד סבלני יכול לנסות הרבה. */
function teWait(){
  var r=teRead();if(!r||!r.bad||r.bad<3)return 0;
  var pen=Math.min(300,Math.pow(2,r.bad-3)*5)*1000;
  var left=Math.ceil(((r.badAt||0)+pen-Date.now())/1000);
  return left>0?left:0;
}

    (!setting&&teHas()?'<button class="te-btn link" id="te-forgot">'+esc(xt("teForgot"))+'</button>':'')+

  document.body.appendChild(w);

  /* מלכודת פוקוס, כמו בשער התנאים */
  w.addEventListener("keydown",function(e){
    if(e.key==="Escape"){teClose();return}
    if(e.key==="Enter"){e.preventDefault();teSubmit();return}
    if(e.key!=="Tab")return;
    var f=box.querySelectorAll("button:not([disabled]),input");
    if(!f.length)return;
    var a=f[0],z=f[f.length-1];
    if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}
    else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}
  });
  document.getElementById("te-no").onclick=teClose;

  if(fg)fg.onclick=function(){ TE.msg=xt("teForgotHow"); teDialog() };
}
function teClose(){ TE.ask=false; TE.mode=""; TE.msg=""; teDialog(); }
function teSubmit(){
  if(TE.busy)return;
  var setting=(TE.mode==="set"||TE.mode==="change"||!teHas());
  var pin=(document.getElementById("te-pin")||{}).value||"";
  var rem=!!(document.getElementById("te-rem")||{}).checked;
  if(!/^[0-9]{4,8}$/.test(pin)){TE.msg=xt("teShort");teDialog();return}
  if(setting){
    var p2=(document.getElementById("te-pin2")||{}).value||"";
    if(pin!==p2){TE.msg=xt("teMismatch");teDialog();return}
    var salt=teSalt();
    TE.busy=true;
    teHash(pin,salt,function(h){
      TE.busy=false;
      teWrite({h:h,s:salt,bad:0,badAt:0});
      teSetOpen(true,rem);
      TE.ask=false;TE.mode="";TE.msg="";
      teDialog(); render();
    });
    return;
  }
  if(teWait()){teDialog();return}
  var rec=teRead(); if(!rec){teClose();return}
  TE.busy=true;
  teHash(pin,rec.s,function(h){
    TE.busy=false;
    if(h===rec.h){
      rec.bad=0;rec.badAt=0;teWrite(rec);
      teSetOpen(true,rem);
      TE.ask=false;TE.mode="";TE.msg="";
      teDialog(); render();
    }else{
      rec.bad=(rec.bad||0)+1;rec.badAt=Date.now();teWrite(rec);
      TE.msg=xt("teBad"); teDialog();
    }
  });
}
function teAsk(mode){ TE.ask=true; TE.mode=mode||""; TE.msg=""; teDialog() }
function teLock(){ teSetOpen(false); render() }
function teRemove(){ teWrite(null); teSetOpen(false); render() }
/* נעילה אוטומטית אחרי שהאפליקציה הייתה מוסתרת זמן־מה.
   מורה שבנה מבחן ומסר את הטאבלט בלי ללחוץ "יציאה" השאיר אותו
   פתוח, וזה בדיוק המצב שהתכונה אמורה למנוע. שתי דקות מספיקות
   כדי לא להפריע לעבודה רצופה, ולנעול כשהמכשיר עבר יד.
   נעילה שנשמרה כ"לזכור במכשיר הזה" היא בחירה מפורשת ולא נוגעים בה. */
var TE_HID=0;
try{
  document.addEventListener("visibilitychange",function(){
    if(document.hidden){ TE_HID=Date.now(); return }
    if(!TE_HID||!teHas())return;
    var away=Date.now()-TE_HID; TE_HID=0;
    if(away<120000)return;
    var kept=false;
    try{ kept=localStorage.getItem("electric-teacher"+"-open")==="1" }catch(e){}
    if(kept)return;
    try{ if(sessionStorage.getItem("electric-teacher"+"-open")!=="1")return }catch(e){ return }
    teSetOpen(false); render();
  });
}catch(e){}

/* ?teacher=1 פותח את החלון, והפרמטר מוסר מיד מהכתובת כדי שלא
   יישאר בקישור ששותף או בהיסטוריה. */
(function(){
  try{
    var u=new URL(location.href);
    if(u.searchParams.get("teacher")==="1"){
      u.searchParams.delete("teacher");
      history.replaceState(null,"",u.pathname+(u.searchParams.toString()?"?"+u.searchParams:"")+u.hash);
      /* שער התנאים יושב מעל הכול, וכך צריך להיות: אי־אפשר להשתמש
         באפליקציה לפני שהוסכם עליהם. חלון הקוד ממתין לו במקום
         להיפתח מתחתיו ולהיראות תקוע. */
      var tries=0;
      (function waitLegal(){
        if(tries++>=600){ teAsk(teHas()?"":"set"); return }
        /* LEGAL.accepted נוצר רק כש-protect.js מאותחל. עד אז אין
           עדיין מה לבדוק, ובדיקה של ".lg-wrap" לבדה מחזירה "אין
           שער" בדיוק ברגע שלפני שהוא נבנה. */
        var ready=false;
        try{ ready=!!(window.LEGAL&&window.LEGAL.accepted) }catch(e){}
        if(!ready){ setTimeout(waitLegal,200); return }
        var ok=true;
        try{ ok=!!window.LEGAL.accepted() }catch(e){ ok=true }
        if(!ok){ setTimeout(waitLegal,200); return }
        teAsk(teHas()?"":"set");
      })();
    }
  }catch(e){}
})();

function marksCsv(ex){
  var subs=(ex.subs||[]).slice().sort(function(a,b){return b.pct-a.pct});
  var n=ex.spec.q.length,i;
  var head=[xt("mkCsvName"),xt("mkCsvPct"),xt("mkCsvOk"),xt("mkCsvTotal"),
            xt("mkCsvDate"),xt("mkCsvValid")];
  for(i=0;i<n;i++)head.push(xf("mkCsvQ",i+1));
  var rows=[csvRow(head)];
  subs.forEach(function(s){
    var r=[s.name||xt("mkNoName"),s.pct,s.ok,s.n,s.date||"",
           s.valid?xt("mkCsvYes"):xt("mkCsvNo")];
    for(i=0;i<n;i++){
      var p=s.per&&s.per[i];
      r.push(p?(p.ok?xt("mkCsvYes"):xt("mkCsvNo")):"");
    }
    rows.push(csvRow(r));
  });
  return "\ufeff"+rows.join("\r\n")+"\r\n";
}
/* כרום מוחק את שם הקובץ כולו ברגע שיש בו תו אחד שאינו ASCII —
   לא רק עברית: גם é או מקף ארוך. מה שיורד נקרא "download", בלי
   סיומת, ואקסל לא יודע לפתוח אותו. מורה שקרא למבחן שלו בעברית
   קיבל קובץ בלי שם ובלי סוג. לכן השם מתועתק ללטינית. */
var TRLIT={
  "א":"a","ב":"b","ג":"g","ד":"d","ה":"h","ו":"v","ז":"z","ח":"ch","ט":"t","י":"y",
  "כ":"k","ך":"k","ל":"l","מ":"m","ם":"m","נ":"n","ן":"n","ס":"s","ע":"","פ":"f",
  "ף":"f","צ":"tz","ץ":"tz","ק":"k","ר":"r","ש":"sh","ת":"t",
  "ا":"a","ب":"b","ت":"t","ث":"th","ج":"j","ح":"h","خ":"kh","د":"d","ذ":"dh","ر":"r",
  "ز":"z","س":"s","ش":"sh","ص":"s","ض":"d","ط":"t","ظ":"z","ع":"","غ":"gh","ف":"f",
  "ق":"q","ك":"k","ل":"l","م":"m","ن":"n","ه":"h","و":"w","ي":"y","ة":"h","ى":"a","ء":"",
  "أ":"a","إ":"i","آ":"a","ؤ":"w","ئ":"y",
  "а":"a","б":"b","в":"v","г":"g","д":"d","е":"e","ё":"e","ж":"zh","з":"z","и":"i",
  "й":"y","к":"k","л":"l","м":"m","н":"n","о":"o","п":"p","р":"r","с":"s","т":"t",
  "у":"u","ф":"f","х":"kh","ц":"ts","ч":"ch","ш":"sh","щ":"sch","ъ":"","ы":"y","ь":"",
  "э":"e","ю":"yu","я":"ya"
};
function asciiName(s){
  var i,c,out="";
  /* é ו-ü הם אות לטינית ועוד סימן מצורף. פירוק והסרת הסימן משאיר e ו-u. */
  try{ s=s.normalize("NFD").replace(/[\u0300-\u036f]/g,"") }catch(e){}
  for(i=0;i<s.length;i++){
    c=s.charAt(i);
    if(/[A-Za-z0-9]/.test(c)){ out+=c; continue }
    var lower=c.toLowerCase();
    if(TRLIT[lower]!==undefined){ out+=TRLIT[lower]; continue }
    out+=" ";                     /* כל השאר — רווח, שיתכווץ בהמשך */
  }
  return out.replace(/\s+/g," ").trim();
}
function csvFileName(ex){
  var t=asciiName(String(ex.spec.t||"")).slice(0,60).trim();
  var d=String(ex.date||todayIso()).replace(/[^0-9-]/g,"");
  /* כשלא נשאר כלום קריא, מזהה המבחן הוא מה שמבדיל בין שני קבצים
     שירדו באותו יום. */
  if(!t) t="exam "+String(ex.id||"").slice(0,6);
  return (t+" "+d).trim()+".csv";
}
function downloadCsv(ex){
  var txt=marksCsv(ex),url=null,a=document.createElement("a");
  try{
    url=URL.createObjectURL(new Blob([txt],{type:"text/csv;charset=utf-8"}));
  }catch(e){
    url="data:text/csv;charset=utf-8,"+encodeURIComponent(txt);
  }
  a.href=url; a.download=csvFileName(ex);
  a.style.cssText="position:fixed;inset-inline-start:-9999px";
  document.body.appendChild(a); a.click();
  setTimeout(function(){
    if(a.parentNode)a.parentNode.removeChild(a);
    if(url&&url.indexOf("blob:")===0){try{URL.revokeObjectURL(url)}catch(e){}}
  },400);
}
function marksTable(ex){
  var out=(ex.spec.t||xt("exam"))+"\n";
  out+=xt("mkTblHead")+"\n";
  (ex.subs||[]).slice().sort(function(a,b){return b.pct-a.pct}).forEach(function(s){
    var wrong=uniq(s.per.filter(function(p){return !p.ok}).map(function(p){return p.topicName}));
    out+=(s.name||xt("mkNoName"))+"\t"+s.pct+"\t"+s.ok+"/"+s.n+"\t"+wrong.join(", ")+"\n";
  });
  return out;
}

/* ------------------------------------------------------------
   מסך התלמיד — מבחן מתוך קישור
   ------------------------------------------------------------ */
var SIT={spec:null,id:"",qs:[],i:0,name:"",answers:[],flags:[],
         t0:0,tick:null,phase:"intro",code:"",copied:false};

/* ------------------------------------------------------------
   מבחן שנפתח מחדש — ריענון, שיחה נכנסת, נעילת מסך
   ------------------------------------------------------------
   תלמיד שדפדפן שלו רענן באמצע מבחן איבד עד כה את הכול. התשובות
   נשמרות עכשיו במכשיר, לפי מזהה המבחן, יחד עם שעת ההתחלה — כדי
   שגם טיימר לא יתאפס ויעניק זמן נוסף. השמירה מקומית בלבד.
   ------------------------------------------------------------ */
function sitKey(){return EKEY+"-run-"+SIT.id}
function sitSave(){
  if(!SIT.id)return;
  try{localStorage.setItem(sitKey(),JSON.stringify({
    n:SIT.name,a:SIT.answers,f:SIT.flags,t:SIT.t0,i:SIT.i,p:SIT.phase}))}catch(e){}
}
function sitKeyOld(){return EKEY_OLD+"-run-"+SIT.id}
function sitDrop(){try{localStorage.removeItem(sitKey());localStorage.removeItem(sitKeyOld())}catch(e){}}
function sitRestore(){
  if(!SIT.id)return false;
  try{
    /* מבחן שהתחיל לפני פיצול המפתחות נשמר תחת המפתח הישן. */
    var o=JSON.parse(localStorage.getItem(sitKey())||localStorage.getItem(sitKeyOld())||"null");
    if(!o||!o.a||!o.a.length)return false;
    SIT.qs=examQuestions(SIT.spec);
    if(o.a.length!==SIT.qs.length)return false;   /* מבחן אחר תחת אותו מזהה */
    SIT.name=o.n||""; SIT.answers=o.a;
    SIT.flags=o.f&&o.f.length===o.a.length?o.f:SIT.qs.map(function(){return false});
    SIT.t0=o.t||0; SIT.i=Math.min(Math.max(0,o.i|0),SIT.qs.length-1);
    SIT.phase=o.p==="done"?"done":"ask";
    if(SIT.phase==="done")SIT.code=encodeResult(SIT.id,SIT.name,SIT.answers);
    return true;
  }catch(e){return false}
}
/* שניות שנותרו, או null כשלא הוגדרה הגבלת זמן */
function sitLeft(){
  var m=SIT.spec&&SIT.spec.m;
  if(!m||!SIT.t0)return null;
  return Math.max(0,Math.round((SIT.t0+m*60000-Date.now())/1000));
}
function sitClock(){
  var l=sitLeft(); if(l===null)return "";
  var mm=Math.floor(l/60),ss=l%60;
  return mm+":"+(ss<10?"0":"")+ss;
}
/* הזמן נגמר — מגישים. לא מבקשים אישור: אישור שאיש לא לוחץ עליו
   פירושו מבחן שנשאר פתוח לנצח. */
function sitTimerOn(){
  sitTimerOff();
  if(sitLeft()===null)return;
  SIT.tick=setInterval(function(){
    if(SIT.phase!=="ask"){sitTimerOff();return}
    if(sitLeft()<=0){sitTimerOff();sitFinish();return}
    var el=$("#sitclock"); if(el)el.textContent=sitClock();
  },1000);
}
function sitTimerOff(){if(SIT.tick){clearInterval(SIT.tick);SIT.tick=null}}

function sitStart(){
  var nm=$("#sitName"); SIT.name=nm?nm.value.trim():"";
  SIT.qs=examQuestions(SIT.spec);
  /* אם לא נותרה אף שאלה שאפשר לבנות (למשל מבחן של אפליקציה אחרת),
     מציגים את מסך המבחן השבור במקום ליפול על שאלה שאינה קיימת. */
  if(!SIT.qs.length){view="badexam"; render(); return}
  SIT.answers=SIT.qs.map(function(){return -1});
  SIT.flags=SIT.qs.map(function(){return false});
  SIT.i=0; SIT.phase="ask"; SIT.t0=Date.now();
  sitSave(); sitTimerOn();
  window.scrollTo(0,0); render();
}
function sitAnswer(i){
  if(SIT.phase!=="ask")return;
  SIT.answers[SIT.i]=i;
  sitSave();
  sitNext();
}
/* סימון לחזרה אינו תשובה ואינו משנה אותה — הוא רק מסמן. */
function sitFlag(){
  if(SIT.phase!=="ask")return;
  SIT.flags[SIT.i]=!SIT.flags[SIT.i];
  sitSave(); render();
}
function sitNext(){
  if(SIT.i+1<SIT.qs.length){SIT.i++;window.scrollTo(0,0);render();return}
  /* לא מגישים בלחיצה על תשובה. לחיצה בטעות על האפשרות האחרונה
     אינה אמורה לסיים מבחן. */
  SIT.phase="review"; stopSpeak(); window.scrollTo(0,0); render();
}
function sitGo(i){
  SIT.i=clamp(i,0,SIT.qs.length-1); SIT.phase="ask";
  window.scrollTo(0,0); render();
}
/* התוצאה נשלחת כקישור ולא כקוד: המורה לוחץ, האפליקציה נפתחת אצלו
   וקולטת. הקוד עצמו יושב אחרי #r=, ולכן גם הדבקה של הקישור השלם
   בתיבת הקוד עובדת — codeOf מחלץ אותו משם. */
function resultUrl(code){return location.origin+location.pathname+"#r="+code}
function codeOf(raw){
  var m=String(raw||"").match(/#r=([A-Za-z0-9\-_]+)/);
  return (m?m[1]:String(raw||"")).trim();
}
function sitFinish(){
  SIT.phase="done";
  sitTimerOff();
  SIT.code=encodeResult(SIT.id,SIT.name,SIT.answers);
  sitSave();
  stopSpeak(); window.scrollTo(0,0); render();
}
function sitGrade(){
  var ok=0,i;
  for(i=0;i<SIT.qs.length;i++){
    var a=SIT.answers[i];
    if(a>=0&&SIT.qs[i].options[a]&&SIT.qs[i].options[a].ok)ok++;
  }
  return {ok:ok,n:SIT.qs.length,pct:Math.round(100*ok/SIT.qs.length)};
}
