function copyText(txt,done){
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(done,function(){fallbackCopy(txt,done)});
      return;
    }
  }catch(e){}
  fallbackCopy(txt,done);
}
function fallbackCopy(txt,done){
  try{
    var ta=document.createElement("textarea");
    ta.value=txt; ta.setAttribute("readonly","");
    ta.style.position="fixed"; ta.style.top="-1000px";
    document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); document.body.removeChild(ta);
    done();
  }catch(e){}
}
function examAction(a,el){
  /* --- בניית מבחן --- */
  if(a==="exlvl"){EB.level=parseInt(el.getAttribute("data-l"),10)||2;EB.q=null;EB.built=null;render();return true}
  if(a==="extopic"){
    var id=el.getAttribute("data-t"),k=EB.topics.indexOf(id);
    if(k>=0)EB.topics.splice(k,1);else EB.topics.push(id);
    EB.q=null;EB.built=null;render();return true;
  }
  if(a==="exflag"){var f=el.getAttribute("data-f");EB[f]=!EB[f];EB.built=null;render();return true}
  /* --- בחירת השאלות --- */
  if(a==="exqans"){EB.ans=!EB.ans;render();return true}
  if(a==="exqreset"){EB.q=null;EB.built=null;render();return true}
  if(a==="exqroll"){
    var qi=parseInt(el.getAttribute("data-i"),10),ql=exSlots();
    /* משבצת חדשה ולא רק זרע חדש, כדי שהמערך יישאר בן שלושה
       איברים גם אם מישהו יוסיף שדה בעתיד. */
    if(ql[qi])
      {ql[qi]=exSlot(ql[qi][0],ql[qi][1]);EB.built=null}
    render();return true;
  }
  if(a==="exqdel"){
    var di=parseInt(el.getAttribute("data-i"),10),dl=exSlots();
    /* מבחן בלי שאלות אינו מבחן. משאירים אחת. */
    if(dl.length>1&&di>=0&&di<dl.length){dl.splice(di,1);EB.n=dl.length;EB.built=null}
    render();return true;
  }
  if(a==="exqadd"){
    var at=el.getAttribute("data-t"),al=exSlots();
    /* עשרים וחמש — גם הגבול של המחוון, וגם מבחן ארוך דיו. */
    if(topicById(at)&&al.length<25){al.push(exSlot(at,EB.level));EB.n=al.length;EB.built=null}
    render();return true;
  }
  if(a==="exbuild"){
    var ti=$("#exTitle"),ph=$("#exPhone");
    EB.title=ti?ti.value.trim():""; EB.phone=ph?ph.value.trim():"";
    /* המבחן נארז מהמשבצות שעל המסך — אותן שאלות ואותו סדר
       שהמורה אישר. ערבוב כאן היה מסדר מחדש מבחן שכבר נבדק. */
    var q=exSlots().slice();
    var spec={v:GENV,t:EB.title||xt("exam"),s:(Math.random()*4294967295)>>>0,l:EB.level,
              q:q,r:!!EB.tts,f:!!EB.formulas,w:true,m:EB.mins||0};
    if(EB.phone)spec.p=EB.phone.replace(/[^0-9]/g,"");
    EB.built=spec; EB.copied="";
    var id=examId(spec);
    if(!exFind(id)){EX.list.unshift({id:id,spec:spec,date:todayIso(),subs:[]});exSave()}
    render(); return true;
  }
  if(a==="excopy"){var u=el.getAttribute("data-v");copyText(u,function(){EB.copied="url";render()});return true}

  /* --- ציונים --- */
  if(a==="mkopen"){var i2=el.getAttribute("data-i");MK.open=MK.open===i2?"":i2;MK.msg=null;render();return true}
  /* מחיקה מוחקת גם את כל ההגשות. שאלה אחת לפני זה היא לא נימוס —
     היא ההבדל בין טעות לבין אובדן של כיתה שלמה. */
  if(a==="mkdel"){MK.del=el.getAttribute("data-i");render();return true}
  if(a==="mkdelno"){MK.del="";render();return true}
  if(a==="mkdelyes"){
    var id3=el.getAttribute("data-i");
    EX.list=EX.list.filter(function(x){return x.id!==id3});
    exSave(); MK.open=""; MK.del=""; render(); return true;
  }
  if(a==="teask"){ teAsk(teHas()?"":"set"); return true }
  if(a==="techange"){ teAsk("change"); return true }
  if(a==="telock"){ teLock(); return true }
  if(a==="teremove"){ teRemove(); return true }
  if(a==="mkcsv"){
    var exc=exFind(el.getAttribute("data-i")); if(!exc)return true;
    downloadCsv(exc);
    MK.msg={id:exc.id,ok:true,m:xt("mkCsvDone")}; render();
    return true;
  }
  if(a==="mkcopy"){
    var ex4=exFind(el.getAttribute("data-i")); if(!ex4)return true;
    copyText(marksTable(ex4),function(){MK.msg={id:ex4.id,ok:true,m:xt("mkTblCopied")};render()});
    return true;
  }
  if(a==="mkadd"){
    var ex=exFind(el.getAttribute("data-i")); if(!ex)return true;
    var ta=$("#mkPaste"),raw=ta?ta.value:"";
    var res=decodeResult(codeOf(raw));
    if(!res){MK.msg={id:ex.id,ok:false,m:xt("mkErrRead")};render();return true}
    if(mkImport(ex,res)&&ta)ta.value="";
    render(); return true;
  }

  /* --- התלמיד --- */
  if(a==="sitstart"){sitStart();return true}
  if(a==="sitans"){sitAnswer(parseInt(el.getAttribute("data-i"),10));return true}
  if(a==="sitskip"){SIT.answers[SIT.i]=-1;sitSave();sitNext();return true}
  if(a==="sitflag"){sitFlag();return true}
  if(a==="sitprev"){sitGo(SIT.i-1);return true}
  if(a==="sitfwd"){sitNext();return true}
  if(a==="sitgo"){sitGo(parseInt(el.getAttribute("data-i"),10));return true}
  if(a==="sitfinish"){sitFinish();return true}
  if(a==="sitread"){var q2=SIT.qs[SIT.i];if(q2)speak(q2.say);return true}
  if(a==="sitform"){view="formulas";render();window.scrollTo(0,0);return true}
  if(a==="sitcopy"){copyText(SIT.code,function(){SIT.copied=true;render()});return true}
  if(a==="sitback"){view="sit";render();window.scrollTo(0,0);return true}
  return false;
}

/* קליטת מבחן מהכתובת. עושים את זה לפני ה-render הראשון, אחרת
   התלמיד רואה לרגע את מסך הבית של אפליקציה שהוא לא מכיר. */
/* קולט תוצאה אחת למבחן. מחזיר true כשנשמרה; בכל מקרה משאיר הודעה
   ב-MK.msg למסך הציונים. משמש גם את תיבת ההדבקה וגם את הקישור. */
function mkImport(ex,res){
    if(res.i!==ex.id){
      var other=exFind(res.i);
      MK.msg={id:ex.id,ok:false,m:other?xf("mkErrOther",other.spec.t||xt("exam")):xt("mkErrUnknown")};
      return false;
    }
    if(res.a.length!==ex.spec.q.length){
      MK.msg={id:ex.id,ok:false,m:xt("mkErrCount")};return false}
    var g=gradeResult(ex.spec,res);
    var sub={name:res.n||"",date:res.d||todayIso(),ok:g.ok,n:g.n,pct:g.pct,per:g.per,valid:!!res.ok};
    /* הגשה חוזרת של אותו תלמיד מחליפה את הקודמת ולא מצטברת לידה */
    /* הגשה חדשה מחליפה קודמת רק כששני השמות זהים אחרי נירמול, והשם
       אינו ריק. בלי זה כל ההגשות בלי שם נראו כאותו תלמיד ודרסו זו את
       זו בשקט, וגם "דני" מול "דני  " (רווח כפול פנימי) נחשבו לשניים. */
    var nrm=function(x){return String(x==null?"":x).replace(/\s+/g," ").trim()};
    var sn=nrm(sub.name);
    var k2=sn?(ex.subs||[]).findIndex(function(s){return nrm(s.name)===sn}):-1;
    if(!ex.subs)ex.subs=[];
    if(k2>=0)ex.subs[k2]=sub; else ex.subs.push(sub);
    exSave();
    MK.msg={id:ex.id,ok:true,m:(sub.name||xt("student"))+" "+xt("mkTaken")+" · "+g.pct+" ("+g.ok+"/"+g.n+")"+
      (sub.valid?"":" · "+xt("mkNoteBad"))};
    return true;
}
/* קליטת תוצאה מהכתובת — הצד של המורה. הכתובת מנוקה מיד, כדי שרענון
   לא יקלוט שוב; קליטה חוזרת של אותו תלמיד הייתה מחליפה ולא מכפילה,
   אבל אין סיבה להשאיר קוד בשורת הכתובת. */
function resultFromUrl(){
  var m=String(location.hash||"").match(/^#r=(.+)$/);
  if(!m)return false;
  var res=decodeResult(m[1]),ex=res?exFind(res.i):null;
  try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}
  if(!res)MK.msg={id:"",ok:false,m:xt("mkErrRead")};
  else if(!ex)MK.msg={id:"",ok:false,m:xt("mkErrUnknown")};
  else if(mkImport(ex,res))MK.open=ex.id;
  view="marks"; return true;
}
function examFromUrl(){
  var m=String(location.hash||"").match(/^#x=(.+)$/);
  if(!m)return false;
  var sp=decodeExam(m[1]);
  if(!sp){
    view="badexam"; return true;
  }
  if(sp.v!==GENV){view="oldexam";return true}
  SIT.spec=sp; SIT.id=examId(sp); SIT.phase="intro";
  /* מבחן שכבר התחיל במכשיר הזה נמשך מהמקום שבו נעצר, עם הזמן
     שכבר חלף. בלי זה ריענון היה מוחק תשובות ומאפס טיימר. */
  if(sitRestore()&&SIT.phase==="ask")sitTimerOn();
  view="sit"; return true;
}

/* קישור הדילוג מצביע ל-#main, ולכן לכל מסך חייב להיות אחד — גם
   לאונבורדינג ולמסכי המבחן. עד 11.9.2026 ה-<main id="main"> ישב
   בתוך כל view בנפרד, ולכן המסך הראשון שלומד חדש רואה — האונבורדינג —

function wrapMain(h){return '<main id="main" tabindex="-1">'+(h||"")+'</main>'}

/* ---- ג׳וש: גלאי מצב הלומד ------------------------------------------
   `tutor/josh-state.js` הוא **גלאי ותו לא**: הוא מקבל תוצאה של
   שאלה ומחזיר מילה אחת מארבע. הוא אינו בוחר שאלה, אינו נוגע
   ב-`state`, אינו משנה רמה ואין לו אחסון — המצב בזיכרון, וסגירת
   הלשונית שוכחת.

   `jsAnswer` נקרא **פעם אחת לשאלה**, מתוך פונקציית הניקוד, ולכן
   שאלה שנענתה לא־נכון פעמיים היא שאלה שגויה אחת.

   `hint` נקרא מהדגלים שכבר קיימים בסיבוב — אין כאן דגל חדש.
   -------------------------------------------------------------------- */
function jsOn(){ return typeof JOSHSTATE!=="undefined" }
function jsAnswer(ok){
  if(!jsOn()||typeof P==="undefined"||!P)return;
  var t0=P.jsT0,hint=!!(P.hint||P.hints||P.usedHelp);
  JOSHSTATE.answer({ok:!!ok,ms:t0?Date.now()-t0:null,hint:hint});
  P.jsT0=0;
}
/* המבחן הכיתתי אינו מביט בהתקדמות הלומד: כל דבר שמשתנה מלומד
   ללומד מפצל את המבחן לשניים. השער יושב ב-render ולא ליד כל
   השמה ל-view, מפני ש-view נכתב בעשרות מקומות ו-render רץ אחרי
   כל אחד מהם. */
var JS_OFF={sit:1,exam:1,marks:1,badexam:1,oldexam:1,sim:1};
function render(){ try{lgChrome()}catch(e){}
  if(jsOn()){ if(JS_OFF[view])JOSHSTATE.off(); else JOSHSTATE.on() }
  var html="";
  /* תלמיד שפתח את דף הנוסחאות באמצע מבחן חייב דרך חזרה מפורשת.

    afterRender(); return;

     לא בהכרח פתח את האפליקציה הזאת אי פעם. */
  if(view==="sit"&&SIT.spec){ $("#app").innerHTML=wrapMain(viewSit()); afterRender(); return; }
  if(view==="badexam"||view==="oldexam"){
    $("#app").innerHTML=wrapMain(viewBadExam(view==="oldexam"?
      xt("exOld"):xt("exBroken")));
    afterRender(); return;
  }
  if(!state.onboarded){
    html=wrapMain(viewOnboard());
  }else{
    html=header()+'<main id="main" tabindex="-1">';
    if(view==="home")html+=viewHome();
    else if(view==="practice")html+=viewPractice();
    else if(view==="topics")html+=viewTopics();
    else if(view==="formulas")html+=viewFormulas();
    else if(view==="progress")html+=viewProgress();
    else if(view==="settings")html+=viewSettings();
    else if(view==="exam")html+=teOpen()?viewExamNew():viewLocked();
    else if(view==="marks")html+=teOpen()?viewMarks():viewLocked();

      _f("<span>מתח · חשמל לתיכון, צעד אחר צעד</span>")+
      '<span class="faint">'+_('הכול נשמר במכשיר הזה ·')+' '+BUILD+'</span></div></footer>';
  }
  $("#app").innerHTML=html;
  afterRender();
}
function afterRender(){
  if(pendingScroll){
    var el=document.getElementById(pendingScroll);
    if(el){
      el.scrollIntoView({block:"center",behavior:state.settings.rm?"auto":"smooth"});
      el.style.outline="3px solid var(--accent)";el.style.outlineOffset="3px";
      setTimeout(function(){el.style.outline="";},2600);
    }
    pendingScroll=null;

}

function goto(v){
  if(view===v)return;
  view=v;stopSpeak();
  window.scrollTo(0,0);
  render();
}
function readQuestion(){
  if(!P.q)return;
  var body=P.q.expr;
  if(body&&body.indexOf("<br>")>=0){
    var eqs=body.split("<br>");
    body=eqs.map(function(e,i){return (i===0?_("משוואה ראשונה: "):_("משוואה שנייה: "))+speakMath(plainOf(e))}).join(". ");
  }else body=body?speakMath(plainOf(body)):"";
  var head=speakProse(plainOf(P.q.ask)).replace(/\s+$/,"");
  var sep=/[.?!]$/.test(head)?" ":". ";
  var txt=head+(body?sep+body:"")+
    _f(". האפשרויות: {0}", P.q.options.map(function(o,i){return _f("אפשרות {0}. {1}", (i+1), speakMath(o.t))}).join(", "));
  speak(txt);
}
function readSteps(){
  if(!P.q)return;
  var shown=P.phase==="reveal"?P.q.steps.length:Math.min(P.steps,P.q.steps.length);
  var txt=P.q.steps.slice(0,shown).map(function(s){
    return s.t+". "+speakProse(s.d||"")+" "+(s.m?speakMath(plainOf(s.m)):"");
  }).join(". ");
  speak(txt);
}
function onAnswer(i){
  if(P.phase!=="ask"||!P.q)return;
  if(P.picked.indexOf(i)>=0)return;
  var o=P.q.options[i];
  P.picked.push(i);
  if(o.ok){
    P.lastWhy="";
    P.phase="reveal";
    scoreAnswer(true);
    announce(_("נכון"));
    if(state.settings.tts)speak(lineFor(P.results[P.results.length-1]));
  }else{
    P.lastWhy=o.why||_("התשובה הזו לא נכונה. שווה לפתוח את הפתרון המודרך ולראות איפה הדרך מתפצלת.");
    announce(_f("לא נכון. {0}", P.lastWhy));
    if(state.settings.tts)speak(speakProse(P.lastWhy));
    /* אם נגמרו האפשרויות — עוברים לחשיפה ולא משאירים תקועים */
    if(P.picked.length>=P.q.options.length-1){
      P.phase="reveal";
      scoreAnswer(false);
    }
  }
  render();
}
function advance(){
  P.i++;
  P.lastWhy="";
  if(roundDone()){P.phase="done";state.stats.rounds++;save();render();return}
  loadQ();
  window.scrollTo(0,0);
  render();
}
var VOICE_SAMPLE="חוק אוהם: המתח שווה לזרם כפול ההתנגדות. אם הזרם שני אמפר וההתנגדות חמישה אוהם, המתח הוא עשרה וולט.";
function onAction(a,el){
  if(examAction(a,el))return;
  var s=state.settings;
  if(a==="go"){goto(el.getAttribute("data-v"));return}
  if(a==="lvl"){state.level=parseInt(el.getAttribute("data-l"),10);save();if(view==="practice"&&P.phase==="ask")loadQ();render();return}
  if(a==="track"){state.track=parseInt(el.getAttribute("data-t"),10);
    state.topics=state.topics.filter(function(id){var t=topicById(id);return t&&t.tracks.indexOf(state.track)>=0});
    save();render();return}
  if(a==="start"){startRound();view="practice";window.scrollTo(0,0);render();return}
  if(a==="starttopic"){var tid=el.getAttribute("data-t");startRound(tid);view="practice";window.scrollTo(0,0);render();return}
  if(a==="ans"){onAnswer(parseInt(el.getAttribute("data-i"),10));return}
  if(a==="next"){advance();return}
  if(a==="stop"){
    if(P.results.length===0){goto("home");return}
    P.list=P.list.slice(0,P.results.length);P.phase="done";save();window.scrollTo(0,0);render();return}
  if(a==="tutor"){ try{stopSpeak()}catch(e){} if(window.TUTOR)TUTOR.open(); return }
  if(a==="hint"){
    P.hints=1;render();
    if(s.tts&&P.q.hint){
      /* אותה מחרוזת בדיוק להקראה ולהדגשה: hlPrep ממפה תווים לפי
         מה שנאמר, ורמז שיש בו סימן (√, −, Φ) נאמר אחרת ממה שכתוב —
         מיפוי לפי הכתוב היה מדגיש את המילה הלא נכונה. כשהשתיים
         אינן זהות hlPrep מדגיש את הרמז כולו, וזה נכון. */
      var hsay=speakProse(P.q.hint);
      speak(hsay);
      /* אחרי speak — הוא קורא ל-stopSpeak שמנקה הדגשה קודמת. */
      hlPrep(document.querySelector(".hintxt"),hsay);
    }
    return;
  }
  if(a==="guide"){
    P.steps=1;P.usedHelp=true;
    render();if(s.tts)readSteps();return}
  if(a==="nextstep"){
    P.steps++;P.usedHelp=true;
    if(P.steps>=P.q.steps.length&&P.phase==="ask"){P.phase="reveal";scoreAnswer(false)}
    render();
    if(s.tts&&P.q.steps[P.steps-1]){
      var st=P.q.steps[P.steps-1];
      speak(st.t+". "+speakProse(st.d||"")+" "+(st.m?speakMath(plainOf(st.m)):""));
    }
    return}
  if(a==="read"){readQuestion();return}
  if(a==="readsteps"){readSteps();return}
  if(a==="rule"){fq="";view="formulas";pendingScroll="f-"+el.getAttribute("data-r");window.scrollTo(0,0);render();return}
  if(a==="tog"){var k=el.getAttribute("data-k");s[k]=!s[k];save();applyModes();render();return}
  if(a==="lang"){
    var lg=el.getAttribute("data-n");
    if(LANGS[lg]&&lg!==s.lang){
      s.lang=lg;save();applyModes();stopSpeak();
      /* שאלה נבנית פעם אחת, וכל הטקסט שלה — השאלה, הרמז, הצעדים
         ואבחון הטעות — נקבע בשפה שהייתה פעילה אז. החלפת שפה באמצע
         שאלה הייתה משאירה מסך חצי מתורגם, ולכן נבנית שאלה חדשה. */
      if(P.q&&!roundDone()){P.lastWhy="";loadQ()}
      render();window.scrollTo(0,0);
    }
    return}
  if(a==="ts"){s.ts=parseInt(el.getAttribute("data-n"),10);save();applyModes();render();return}
  if(a==="theme"){s.theme=el.getAttribute("data-n");save();applyModes();render();return}
  if(a==="rlen"){s.roundLen=parseInt(el.getAttribute("data-n"),10);save();render();return}
  if(a==="voice"){
    var uri=el.getAttribute("data-u");
    s.voice=uri;
    if(!s.voiceByLang)s.voiceByLang={};
    s.voiceByLang[LG]=uri;
    save();render();speak(_(VOICE_SAMPLE));return}
  if(a==="vcheck"){voiceCheck();return}
  if(a==="test"){speak(_(VOICE_SAMPLE));return}
  if(a==="pick"){
    var id=el.getAttribute("data-t"),ix=state.topics.indexOf(id);
    if(ix>=0)state.topics.splice(ix,1);else state.topics.push(id);
    save();render();return}
  if(a==="selall"){state.topics=topicsForTrack(state.track).map(function(t){return t.id});save();render();return}
  if(a==="selnone"){state.topics=[];save();render();return}
  if(a==="fclear"){fq="";render();return}
  if(a==="obnext"){
    P.obStep=(P.obStep||1)+1;
    if(P.obStep>3){state.onboarded=true;save();applyModes();view="home";window.scrollTo(0,0)}
    save();render();return}
  if(a==="obback"){P.obStep=Math.max(1,(P.obStep||1)-1);render();return}
  if(a==="reset"){
    if(!P.confirmReset){P.confirmReset=true;el.textContent=_("לוחצים שוב כדי למחוק סופית");return}
    try{localStorage.removeItem(KEY)}catch(e){}
    state=blankState();P=({list:[],i:0,q:null,phase:"ask",picked:[],hints:0,steps:0,usedHelp:false,results:[]});
    applyModes();view="home";render();return}
}

/* --- כל לחיצה מושמעת (O-27, 9.9.2026) ---
   כשההקראה דולקת, כפתור שנלחץ מוקרא בשמו בשפת הממשק — לא לפני
   הפעולה אלא חצי שנייה אחריה: פעולה שמדברת בעצמה (שאלה חדשה,
   תשובה, רמז) מנצחת, והתווית לא נחתכת באמצע. אפשרויות התשובה
   אינן כאן: אחרי הבחירה הן מדברות בעצמן, ולפניה אסור (say.js).
   data-nosay על כפתור משתיק אותו. */
function sayClick(el){
  var a=el.getAttribute("data-a")||"";
  if(/^(ans|pick|sitans)$/.test(a)||el.hasAttribute("data-nosay"))return;
  if(!(state.settings&&state.settings.tts))return;
  var label=el.getAttribute("aria-label")||el.textContent||"";
  label=plainOf(String(label)).replace(/\s+/g," ").trim();
  if(!label||label.length>60)return;
  setTimeout(function(){
    /* הפעולה עצמה כבר מדברת? שואלים את המנוע, לא מונה: ניווט קורא
       ל-stopSpeak גם בלי לדבר, ומונה דורות היה משתיק את התווית
       בדיוק בכפתורים שבשבילם היא נועדה; ו-_activeU נשאר תפוס כשאמירה
       נתקעת בלי onend. */
    try{if(speechSynthesis.speaking||speechSynthesis.pending)return}catch(e){}
    speak(label);
  },500);
}
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-a]");
  if(el&&!el.disabled){sayClick(el);onAction(el.getAttribute("data-a"),el)}
});
document.addEventListener("change",function(e){
  var xs=e.target;
  if(xs&&xs.getAttribute&&xs.getAttribute("data-slide")==="exn"){
    EB.n=clamp(parseInt(xs.value,10)||10,5,25);
    EB.q=null;EB.built=null;render();

});
document.addEventListener("input",function(e){
  var el=e.target;
  if(!el.dataset)return;
  if(el.dataset.bind==="name"){state.name=el.value;save();return}
  if(el.dataset.bind==="fq"){fq=el.value;
    var pos=el.selectionStart;render();
    var again=document.querySelector('[data-bind="fq"]');
    if(again){again.focus();try{again.setSelectionRange(pos,pos)}catch(x){}}
    return}
  /* מחווני בונה המבחן. exn היה קיים בלי מטפל מאז ומעולם, ולכן
     מספר השאלות תמיד נשאר על ברירת המחדל ולא משנה מה נגרר.
     מעדכנים תווית בלבד ולא מציירים מסך — ציור מחדש בונה את
     המחוון מאפס ומנתק את הגרירה באמצע. */
  if(el.dataset.slide==="exn"){
    EB.n=parseInt(el.value,10)||10;
    var ln=$("#exNlab"); if(ln)ln.textContent=EB.n;
    /* הרשימה מתבטלת כאן ונבנית מחדש רק כשהגרירה נגמרת: ציור
       מחדש באמצע גרירה מנתק אותה. */
    EB.q=null;EB.built=null;
    return}
  if(el.dataset.slide==="exm"){
    EB.mins=parseInt(el.value,10)||0;
    var lm=$("#exMlab"); if(lm)lm.textContent=EB.mins?EB.mins+" "+xt("minutes"):xt("none");
    EB.built=null;
    return}
  if(el.dataset.slide==="rate"){
    state.settings.rate=parseFloat(el.value);save();
    var lab=$("#ratev");if(lab)lab.textContent=state.settings.rate.toFixed(2);
    return}
});
document.addEventListener("keydown",function(e){
  if(!state.settings.keys)return;
  if(e.target.closest("input,textarea,select"))return;
  if(!state.onboarded||view!=="practice"||!P.q)return;
  if(P.phase==="ask"&&/^[1-4]$/.test(e.key)){
    var i=parseInt(e.key,10)-1;
    if(P.q.options[i]){e.preventDefault();onAnswer(i)}
    return;
  }
  if(e.key===" "){e.preventDefault();readQuestion();return}
  if(e.key==="h"||e.key==="H"){e.preventDefault();if(P.phase==="ask"&&!P.hints)onAction("hint",document.body);return}
  if(e.key==="s"||e.key==="S"){e.preventDefault();if(!P.steps)onAction("guide",document.body);else onAction("nextstep",document.body);return}
  if(e.key==="Enter"&&P.phase==="reveal"){e.preventDefault();advance();return}
});

function trAt(lang,start,arr){
  (TR_PARTS[lang]=TR_PARTS[lang]||[]).push([start,arr]);
}
function trPart(lang,arr){trAt(lang,0,arr)}
function trBuild(){
  Object.keys(TR_PARTS).forEach(function(lang){
    var d={},bad=0;
    TR_PARTS[lang].forEach(function(chunk){
      var start=chunk[0],arr=chunk[1],i;
      if(start+arr.length>TR_KEYS.length){bad++;return}
      for(i=0;i<arr.length;i++)if(arr[i])d[TR_KEYS[start+i]]=arr[i];
    });
    if(bad&&window.console)console.error("TR "+lang+": "+bad+" chunk(s) out of range");
    TR[lang]=d;
  });
}
function trMissing(lang){
  var d=TR[lang]||{},n=0,i;
  for(i=0;i<TR_KEYS.length;i++)if(!d[TR_KEYS[i]])n++;
  return n;
}

<!-- ״עזרה מהמורה״. התשתית ב-/tutor/tutor.js, ההוראות בשרת.
     mount מחזיר false כשאין כתובת שרת, ואז הכפתור אינו נבנה. -->
<script>
if(window.TUTOR){
  /* הניסוח שעל המסך מגיע כ-HTML; לשרת נשלח טקסט בלבד. */
  var txt=TUTOR.plain; /* חזקות נשמרות: <sup>2</sup> → ² (tutor.js, 17.9.2026) */
  TUTOR.mount({
    app:"electric",
    lang:function(){return (typeof state!=="undefined"&&state.settings&&state.settings.lang)||"he"},
    q:function(){
      /* מיפוי אחד לשתי המשפחות. השדות נמדדו בדפדפן, ולא הועתקו
         מ-buildQ של בונה המבחן — שם הם אחרים.
         משפחת המתמטיקה: ask / expr / options[].ok
         משפחת החידון:   prompt / subject / opts[].ok / answer */
      var x=(typeof P!=="undefined")?P.q:null; if(!x)return null;
      var o=x.opts||x.options||[], ok=x.answer!=null?txt(x.answer):null, i;
      if(!ok)for(i=0;i<o.length;i++)if(o[i].ok)ok=txt(o[i].t||o[i].h);
      /* בשפת המסך ולא בעברית — צילום הבעלים 23.9.2026: שאלה עברית
         בראש חלון ״Ask the teacher״. */
      var line=txt(typeof _==="function"?_(x.prompt||x.ask):(x.prompt||x.ask));
      /* ב-english השדה הזה הוא אובייקט ולא מחרוזת, ובלי הפריקה
         הזאת נשלח לשרת "[object Object]". נמדד בדפדפן. */
      var sb=x.subject;
      if(sb&&typeof sb==="object")sb=sb.h||sb.t||sb.text||sb.w||"";
      if(sb)line+=" — "+txt(sb);
      if(x.lead)line+=" "+txt(x.lead);
      if(x.expr)line+=" "+txt(x.expr);
      return {expr:line.trim()||null, ans:ok||null,
              topic:txt(x.topicName||x.tid||"")||null,
              level:(typeof state!=="undefined"&&state.track)?("מסלול "+state.track):
                    (x.level!=null?("רמה "+x.level):null)};
    },
    stopHost:function(){try{stopSpeak()}catch(e){}}
  });
  /* ---- מנוע לימור — המתאם של האפליקציה (16.9.2026) ----
     כמו ב-math-app: getScreenContext מחזיר מה שמוצג עכשיו, ו-actions
     הן מה שלימור רשאי לעשות כאן; כל אחת מחזירה true רק כשבאמת קרה
     משהו. `txt` הוא העוזר שהוצהר למעלה — אין כאן עוזר שני. */
  if(window.BARAK)BARAK.register({
    app:"electric",
    getScreenContext:function(){
      var x=(typeof P!=="undefined"&&P)?P.q:null;
      if(!x||view!=="practice"||P.phase==="done")return null;
      var o=x.options||[],ok=null,st=null,tr=null,i;
      for(i=0;i<o.length;i++)if(o[i].ok)ok=txt(o[i].t||o[i].h);
      /* הבחירה השגויה האחרונה של הלומד, לא כל מה שסומן */
      for(i=P.picked.length-1;i>=0;i--)if(o[P.picked[i]]&&!o[P.picked[i]].ok){st=txt(o[P.picked[i]].t||o[P.picked[i]].h);break}
      for(i=0;i<TRACKS.length;i++)if(TRACKS[i].v===state.track)tr=TRACKS[i].t;
      var line=(txt(typeof _==="function"?_(x.ask):x.ask)+" "+txt(x.expr)).trim(),tn=txt(x.topicName||x.topic);
      return {id:"q"+P.i+"-"+line.slice(0,60), type:P.phase==="ask"?"mcq":"reveal",
        q:line, options:o.map(function(p){return txt(p.t||p.h)}),
        correct:ok, student:st, topic:tn||null,
        level:"רמה "+x.level+" מתוך "+LVL_HE.length+(LVL_HE[x.level-1]?" — "+LVL_HE[x.level-1]:""),
        curriculum:"מגמת חשמל בתיכון"+(tr?" — "+tr:"")+(tn?" — "+tn:"")};
    },
    actions:{
      next_question:{desc:"עובר לשאלה הבאה; באמצע שאלה — מחליף אותה בשאלה אחרת באותו מקום בסבב",
        run:function(){
          if(view!=="practice"||!P.q||P.phase==="done")return false;
          if(P.phase==="reveal"){advance();return true}
          /* שאלה שלא נענתה אינה נספרת — אותו מהלך שהאפליקציה עושה
             כשמחליפים רמה באמצע שאלה. מחולל קטן יכול להחזיר את אותה
             שאלה, ואז מנסים שוב; אם נשארה זהה, barak-core רואה
             שהמזהה לא זז ומדווח כישלון. */
          var was=txt(P.q.ask)+txt(P.q.expr),n=0;
          do{loadQ();n++}while(n<12&&txt(P.q.ask)+txt(P.q.expr)===was);
          stopSpeak();window.scrollTo(0,0);render();return true;
        }},
      show_hint:{desc:"מציג את הרמז לשאלה שעל המסך ומקריא אותו",
        run:function(){
          if(view!=="practice"||!P.q||P.phase!=="ask"||!P.q.hint)return false;
          if(!P.hints){onAction("hint",null);return P.hints>0}
          /* הרמז כבר פתוח — מפנים אליו */
          speak(speakProse(P.q.hint));
          return BARAK.highlight(document.querySelector(".hintbox"));
        }},
      read_aloud:{desc:"מקריא את השאלה והאפשרויות בקול",
        run:function(){
          if(view!=="practice"||!P.q||P.phase==="done"||!state.settings.tts)return false;
          readQuestion();return true;
        }},
      repeat_question:{desc:"מקריא את השאלה עוד פעם",
        run:function(){
          if(view!=="practice"||!P.q||P.phase==="done"||!state.settings.tts)return false;
          readQuestion();return true;
        }},
      highlight_option:{desc:"מדגיש במסך אחת מהאפשרויות, לפי מקומה (0 עד 3)",
        params:{index:{type:"integer",min:0,max:3,required:true}},
        run:function(a){
          if(view!=="practice"||!P.q||P.phase!=="ask"||a.index>=P.q.options.length)return false;
          return BARAK.highlight(document.querySelector('[data-a="ans"][data-i="'+a.index+'"]'));
        }},
      explain_again:{desc:"מפנה אל הפתרון המודרך ומקריא אותו שוב, אחרי שהשאלה נענתה",
        run:function(){
          if(view!=="practice"||!P.q||P.phase!=="reveal"||!P.q.steps.length)return false;
          /* קודם ההקראה ואחריה ההדגשה: ב-math-teen speak מרנדר את המסך
             מחדש, והדגשה שקדמה לו הייתה נמחקת. */
          readSteps();BARAK.highlight(document.querySelector(".steps"));return true;
        }},
      go_screen:{desc:"עובר למסך אחר של האפליקציה",
        params:{name:{type:"string",enum:["home","practice","topics","formulas","progress","settings"],required:true}},
        run:function(a){
          if(!state.onboarded||view==="sit")return false;
          goto(a.name);return view===a.name;
        }},
      formula_sheet:{desc:"פותח את דף הנוסחאות; אם לשאלה יש נוסחה — מגלגל אליה",
        run:function(){
          if(!state.onboarded||view==="sit")return false;
          if(view==="practice"&&P.q&&P.q.rule){fq="";pendingScroll="f-"+P.q.rule}
          if(view==="formulas")window.scrollTo(0,0);else goto("formulas");
          return view==="formulas";
        }}
    }
  });
  try{if(INTERNAL_OK)render()}catch(e){}
}
</script>
