"غاز","ru":"газ","en":"gas"},{"he":"מוצק","ar":"صلب","ru":"твёрдое","en":"solid"},{"he":"נוזל","ar":"سائل","ru":"жидкость","en":"liquid"},{"he":"כולם אותו דבר","ar":"الكل متشابه","ru":"все одинаково","en":"all the same"}],"h":{"he":"איפה יש הכי הרבה מקום בין החלקיקים?","ar":"أين أكبر مساحة بين الجسيمات؟","ru":"Где больше всего места между частицами?","en":"Where is there the most space between particles?"},"y":{"he":"בגז הרווחים גדולים והחלקיקים נעים בחופשיות.","ar":"في الغاز المسافات كبيرة والجسيمات تتحرك بحرية.","ru":"В газе промежутки большие, частицы движутся свободно.","en":"In a gas the gaps are large and particles move freely."}},{"lv":2,"s":{"he":"למה נוזל זורם וצורתו משתנה, אבל מוצק לא?","ar":"لماذا يسيل السائل ويتغيّر شكله لكن الصلب لا؟","ru":"Почему жидкость течёт и меняет форму, а твёрдое нет?","en":"Why does a liquid flow and change shape but a solid does not?"},"o":[{"he":"בנוזל החלקיקים מחליקים זה על פני זה","ar":"في السائل تنزلق الجسيمات فوق بعضها","ru":"в жидкости частицы скользят друг по другу","en":"in a liquid the particles slide past each other"},{"he":"בנוזל אין חלקיקים","ar":"لا جسيمات في السائل","ru":"в жидкости нет частиц","en":"a liquid has no particles"},{"he":"במוצק החלקיקים רחוקים מאוד","ar":"في الصلب الجسيمات بعيدة جدًا","ru":"в твёрдом частицы очень далеки","en":"in a solid the particles are very far apart"},{"he":"נוזל קל ממוצק תמיד","ar":"السائل أخف من الصلب دائمًا","ru":"жидкость всегда легче твёрдого","en":"a liquid is always lighter than a solid"}],"h":{"he":"איך החלקיקים בנוזל זזים?","ar":"كيف تتحرك الجسيمات في السائل؟","ru":"Как движутся частицы в жидкости?","en":"How do the particles in a liquid move?"},"y":{"he":"במוצק החלקיקים נעולים במקומם. בנוזל הם קרובים אך יכולים להחליק, ולכן הנוזל זורם.","ar":"في الصلب الجسيمات مقيّدة بمكانها. في السائل قريبة لكنها تنزلق فيسيل.","ru":"В твёрдом частицы зафиксированы. В жидкости они близки, но скользят, потому жидкость течёт.","en":"In a solid the particles are locked in place. In a liquid they are close but can slide, so it flows."}}]}],"practice":[{"lv":1,"s":{"he":"מה קורה לחלקיקים כשמחממים מוצק?","ar":"ماذا يحدث للجسيمات عند تسخين الصلب؟","ru":"Что происходит с частицами при нагревании твёрдого?","en":"What happens to the particles when you heat a solid?"},"o":[{"he":"הם רועדים חזק יותר","ar":"تهتز بقوة أكبر","ru":"колеблются сильнее","en":"they vibrate harder"},{"he":"הם נעלמים","ar":"تختفي","ru":"исчезают","en":"they disappear"},{"he":"הם נעצרים","ar":"تتوقف","ru":"останавливаются","en":"they stop"},{"he":"הם נהיים קטנים יותר","ar":"تصير أصغر","ru":"становятся меньше","en":"they get smaller"}],"h":{"he":"חום נותן לחלקיקים יותר...?","ar":"الحرارة تعطي الجسيمات المزيد من...؟","ru":"Тепло даёт частицам больше...?","en":"Heat gives particles more...?"},"y":{"he":"חימום מגדיל את תנועת החלקיקים. כשהתנועה חזקה מספיק, המוצק נמס.","ar":"التسخين يزيد حركة الجسيمات. وعندما تقوى الحركة بما يكفي ينصهر الصلب.","ru":"Нагрев усиливает движение частиц. Когда оно достаточно сильное, твёрдое плавится.","en":"Heating increases particle motion. When it is strong enough, the solid melts."}},{"lv":1,"s":{"he":"איזה מצב חומר שומר גם על נפח וגם על צורה?","ar":"أي حالة مادة تحافظ على الحجم والشكل معًا؟","ru":"Какое состояние сохраняет и объём, и форму?","en":"Which state keeps both volume and shape?"},"o":[{"he":"מוצק","ar":"صلب","ru":"твёрдое","en":"solid"},{"he":"נוזל","ar":"سائل","ru":"жидкость","en":"liquid"},{"he":"גז","ar":"غاز","ru":"газ","en":"gas"},{"he":"אף אחד","ar":"لا واحد","ru":"никакое","en":"none"}],"h":{"he":"איפה החלקיקים קבועים במקומם?","ar":"أين الجسيمات ثابتة في أماكنها؟","ru":"Где частицы закреплены на местах?","en":"Where are the particles fixed in place?"},"y":{"he":"במוצק החלקיקים צמודים וקבועים במקומם, לכן הצורה והנפח נשמרים.","ar":"في الصلب الجسيمات متلاصقة وثابتة فيحافظ على الشكل والحجم.","ru":"В твёрдом частицы плотно и на местах, поэтому форма и объём сохраняются.","en":"In a solid the particles are packed and fixed, so shape and volume stay."}},{"lv":2,"s":{"he":"בלון מנופח נלחץ ומתכווץ קצת. מה קורה לחלקיקי האוויר בו?","ar":"بالون منفوخ ضُغط فانكمش قليلًا. ماذا يحدث لجسيمات الهواء فيه؟","ru":"Надутый шарик сжали, и он немного уменьшился. Что с частицами воздуха в нём?","en":"An inflated balloon is squeezed and shrinks a little. What happens to the air particles inside?"},"o":[{"he":"הרווחים ביניהם קטנים","ar":"تصغر المسافات بينها","ru":"промежутки между ними уменьшаются","en":"the gaps between them get smaller"},{"he":"החלקיקים נעלמים","ar":"تختفي الجسيمات","ru":"частицы исчезают","en":"the particles vanish"},{"he":"החלקיקים נהיים קטנים יותר","ar":"تصير الجسيمات أصغر","ru":"частицы становятся меньше","en":"the particles shrink"},{"he":"החלקיקים נהיים מוצקים","ar":"تصير الجسيمات صلبة","ru":"частицы становятся твёрдыми","en":"the particles become solid"}],"h":{"he":"מה אפשר לדחוס בגז?","ar":"ما الذي يمكن ضغطه في الغاز؟","ru":"Что можно сжать в газе?","en":"What can you squeeze in a gas?"},"y":{"he":"בגז יש הרבה רווח בין החלקיקים, ולכן אפשר לדחוס אותו. החלקיקים עצמם לא משתנים.","ar":"في الغاز مسافات كبيرة بين الجسيمات لذلك يمكن ضغطه. الجسيمات نفسها لا تتغيّر.","ru":"В газе много места между частицами, поэтому его можно сжать. Сами частицы не меняются.","en":"A gas has a lot of space between particles, so it can be compressed. The particles themselves do not change."}},{"lv":2,"s":{"he":"מה ההבדל בין חלקיקי מים נוזליים לחלקיקי אדי מים?","ar":"ما الفرق بين جسيمات الماء السائل وجسيمات بخار الماء؟","ru":"Чем отличаются частицы жидкой воды от частиц водяного пара?","en":"How do liquid water particles differ from water vapor particles?"},"o":[{"he":"באדים החלקיקים רחוקים ומהירים יותר","ar":"في البخار الجسيمات أبعد وأسرع","ru":"в паре частицы дальше друг от друга и быстрее","en":"in vapor the particles are farther apart and faster"},{"he":"באדים החלקיקים הם חומר אחר","ar":"في البخار الجسيمات مادة أخرى","ru":"в паре частицы — другое вещество","en":"in vapor the particles are a different substance"},{"he":"בנוזל החלקיקים רחוקים יותר","ar":"في السائل الجسيمات أبعد","ru":"в жидкости частицы дальше","en":"in liquid the particles are farther apart"},{"he":"אין הבדל","ar":"لا فرق","ru":"разницы нет","en":"there is no difference"}],"h":{"he":"האם זה אותו חומר בשני המצבים?","ar":"هل هي المادة نفسها في الحالتين؟","ru":"То же ли вещество в обоих состояниях?","en":"Is it the same substance in both states?"},"y":{"he":"החלקיקים אותם חלקיקים, רק הרווחים והתנועה שונים. זה מסביר שהתאדות היא שינוי פיזיקלי.","ar":"الجسيمات نفسها لكن المسافات والحركة مختلفة. وهذا يفسر أن التبخّر تغيّر فيزيائي.","ru":"Частицы те же, различаются промежутки и движение. Поэтому испарение — физическое изменение.","en":"The particles are the same, only the gaps and motion differ. That is why evaporation is a physical change."}},{"lv":3,"s":{"he":"פעפוע של צבע במים חמים מהיר יותר מבקרים. איך המודל מסביר?","ar":"انتشار الصبغة في ماء ساخن أسرع منه في بارد. كيف يفسّر النموذج؟","ru":"Краситель расходится в горячей воде быстрее, чем в холодной. Как это объясняет модель?","en":"Dye spreads faster in hot water than cold. How does the model explain it?"},"o":[{"he":"בחום החלקיקים נעים מהר יותר ומתערבבים מהר","ar":"بالحرارة تتحرك الجسيمات أسرع فتختلط أسرع","ru":"при нагреве частицы быстрее движутся и быстрее смешиваются","en":"when hot the particles move faster and mix faster"},{"he":"בחום יש יותר חלקיקים","ar":"في الحرارة يوجد جسيمات أكثر","ru":"в тепле больше частиц","en":"hot water has more particles"},{"he":"בקר החלקיקים זזים מהר יותר","ar":"في البارد تتحرك الجسيمات أسرع","ru":"в холодной частицы быстрее","en":"in cold water particles move faster"},{"he":"צבע לא בנוי מחלקיקים","ar":"الصبغة غير مبنية من جسيمات","ru":"краситель не из частиц","en":"dye is not made of particles"}],"h":{"he":"מה משתנה בחלקיקים כשהמים חמים?","ar":"ما الذي يتغيّر في الجسيمات عندما يسخن الماء؟","ru":"Что меняется в частицах, когда вода горячая?","en":"What changes in the particles when water is hot?"},"y":{"he":"חום מגדיל את מהירות החלקיקים, ולכן הפעפוע מהיר יותר.","ar":"الحرارة تزيد سرعة الجسيمات فيكون الانتشار أسرع.","ru":"Тепло увеличивает скорость частиц, поэтому диффузия быстрее.","en":"Heat raises particle speed, so diffusion is faster."}},{"lv":3,"s":{"he":"תלמיד אומר: \"המודל מראה שחלקיקים הם כדורים קטנים ממש כך\". מה נכון להגיד?","ar":"يقول طالب: «النموذج يبيّن أن الجسيمات كرات صغيرة تمامًا هكذا». ما الصحيح قوله؟","ru":"Ученик говорит: «модель показывает, что частицы — именно маленькие шарики». Что верно ответить?","en":"A student says: \"the model shows particles are exactly little balls.\" What is right to say?"},"o":[{"he":"המודל הוא הפשטה שעוזרת להסביר, ויש לו מגבלות","ar":"النموذج تبسيط يساعد على التفسير وله حدود","ru":"модель — упрощение для объяснения, у неё есть ограничения","en":"a model is a simplification for explaining, and it has limits"},{"he":"צריך לראות את הכדורים במיקרוסקופ רגיל","ar":"يجب رؤية الكرات بمجهر عادي","ru":"шарики видны в обычный микроскоп","en":"you can see the balls in an ordinary microscope"},{"he":"המודל שגוי לגמרי","ar":"النموذج خاطئ تمامًا","ru":"модель полностью неверна","en":"the model is totally wrong"},{"he":"מדענים לא משתמשים במודלים","ar":"العلماء لا يستخدمون النماذج","ru":"учёные не используют модели","en":"scientists do not use models"}],"h":{"he":"האם ציור הוא העתק מושלם של המציאות?","ar":"هل الرسم نسخة مثالية من الواقع؟","ru":"Рисунок — идеальная копия реальности?","en":"Is a drawing a perfect copy of reality?"},"y":{"he":"כדורים הם דרך פשוטה לייצג חלקיקים. מודל טוב מסביר הרבה תופעות, ועדיין אינו המציאות עצמה.","ar":"الكرات طريقة بسيطة لتمثيل الجسيمات. النموذج الجيد يفسر ظواهر كثيرة لكنه ليس الواقع نفسه.","ru":"Шарики — простой способ представить частицы. Хорошая модель объясняет многое, но не равна самой реальности.","en":"Balls are a simple way to show particles. A good model explains many things but is not reality itself."}}]},{"id":"z5","grade":7,"t":{"he":"אנרגיה וחום","ar":"الطاقة والحرارة","ru":"Энергия и тепло","en":"Energy and heat"},"pred":{"s":{"he":"כדור מתגלגל פוגע בקובייה והקובייה זזה. מה עבר מהכדור לקובייה?","ar":"كرة متدحرجة تصطدم بمكعب فيتحرك. ماذا انتقل من الكرة إلى المكعب؟","ru":"Катящийся шар ударяет кубик, и тот двигается. Что передалось от шара кубику?","en":"A rolling ball hits a cube and the cube moves. What passed from the ball to the cube?"},"o":[{"he":"אנרגיה","ar":"طاقة","ru":"энергия","en":"energy"},{"he":"חומר","ar":"مادة","ru":"вещество","en":"matter"},{"he":"צבע","ar":"لون","ru":"цвет","en":"color"},{"he":"מסה","ar":"كتلة","ru":"масса","en":"mass"}]},"lessons":[{"t":{"he":"סוגי אנרגיה והמרות","ar":"أنواع الطاقة والتحويلات","ru":"Виды энергии и превращения","en":"Kinds of energy and conversions"},"phen":{"he":"מנורה מדליקה אור, מאוורר מסתובב וגם נהיה חם. מה קורה לאנרגיה?","ar":"مصباح يضيء ومروحة تدور وتسخن أيضًا. ماذا يحدث للطاقة؟","ru":"Лампа светит, вентилятор крутится и нагревается. Что происходит с энергией?","en":"A lamp gives light, a fan spins and also warms up. What happens to the energy?"},"concept":{"he":"אנרגיה היא היכולת לגרום לשינוי. יש אנרגיית תנועה, חום, אור, חשמל, גובה, כימית. אנרגיה לא נעלמת: היא עוברת ממקום למקום ומשתנה מסוג לסוג. זה חוק שימור האנרגיה.","ar":"الطاقة هي القدرة على إحداث تغيير. هناك طاقة حركة وحرارة وضوء وكهرباء وارتفاع وكيميائية. الطاقة لا تختفي: تنتقل من مكان لآخر وتتحوّل من نوع لآخر. هذا قانون حفظ الطاقة.","ru":"Энергия — способность вызывать изменение. Бывает энергия движения, тепло, свет, электричество, высота, химическая. Энергия не исчезает: она переходит с места на место и меняет вид. Это закон сохранения энергии.","en":"Energy is the ability to cause change. There is motion, heat, light, electrical, height and chemical energy. Energy does not vanish: it moves from place to place and changes type. This is the law of conservation of energy."},"steps":[{"he":"מזהים איפה האנרגיה בהתחלה.","ar":"نحدّد أين الطاقة في البداية.","ru":"Определяем, где энергия в начале.","en":"Find where the energy is at the start."},{"he":"מזהים איפה היא בסוף ובאיזה סוג.","ar":"نحدّد أين هي في النهاية وأي نوع.","ru":"Определяем, где она в конце и какого вида.","en":"Find where it is at the end and what type."},{"he":"כותבים שרשרת: מסוג א׳ לסוג ב׳.","ar":"نكتب سلسلة: من نوع أ إلى نوع ب.","ru":"Записываем цепочку: от вида А к виду Б.","en":"Write a chain: from type A to type B."}],"qs":[{"lv":1,"s":{"he":"נורה דולקת. לאילו סוגי אנרגיה עברה האנרגיה החשמלית?","ar":"مصباح مضاء. إلى أي أنواع طاقة تحوّلت الطاقة الكهربائية؟","ru":"Лампочка горит. В какие виды энергии перешла электрическая энергия?","en":"A bulb is lit. Into which kinds did the electrical energy turn?"},"o":[{"he":"אור וחום","ar":"ضوء وحرارة","ru":"свет и тепло","en":"light and heat"},{"he":"קול בלבד","ar":"صوت فقط","ru":"только звук","en":"sound only"},{"he":"אנרגיית גובה","ar":"طاقة ارتفاع","ru":"энергия высоты","en":"height energy"},{"he":"היא נעלמה","ar":"اختفت","ru":"исчезла","en":"it vanished"}],"h":{"he":"מה מרגישים כשנוגעים בנורה אחרי זמן? (רק כשהיא כבויה ומתקררת)","ar":"ماذا نشعر عند لمس المصباح بعد وقت؟ (فقط وهو مطفأ ويبرد)","ru":"Что чувствуем, когда трогаем лампу спустя время? (только выключенную и остывшую)","en":"What do you feel touching a bulb after a while? (only when off and cooling)"},"y":{"he":"נורה נותנת אור, וגם מתחממת. האנרגיה לא נעלמה אלא התפצלה לאור ולחום.","ar":"المصباح يعطي ضوءًا ويسخن أيضًا. الطاقة لم تختفِ بل انقسمت إلى ضوء وحرارة.","ru":"Лампа даёт свет и нагревается. Энергия не исчезла, а разделилась на свет и тепло.","en":"A bulb gives light and also warms up. The energy did not vanish but split into light and heat."}},{"lv":2,"s":{"he":"מה נכון לגבי אנרגיה כשכדור מפסיק להתגלגל?","ar":"ما الصحيح عن الطاقة عندما تتوقف كرة عن التدحرج؟","ru":"Что верно об энергии, когда шар перестаёт катиться?","en":"What is true about energy when a ball stops rolling?"},"o":[{"he":"אנרגיית התנועה עברה בעיקר לחום בגלל חיכוך","ar":"طاقة الحركة تحوّلت أساسًا إلى حرارة بسبب الاحتكاك","ru":"энергия движения в основном перешла в тепло из-за трения","en":"motion energy mostly turned into heat because of friction"},{"he":"האנרגיה נעלמה לגמרי","ar":"اختفت الطاقة تمامًا","ru":"энергия полностью исчезла","en":"the energy vanished completely"},{"he":"האנרגיה הפכה לחומר","ar":"تحوّلت الطاقة إلى مادة","ru":"энергия стала веществом","en":"the energy became matter"},{"he":"הכדור יצר אנרגיה חדשה","ar":"الكرة صنعت طاقة جديدة","ru":"шар создал новую энергию","en":"the ball created new energy"}],"h":{"he":"מה קורה למשטח ולכדור כשמתחככים?","ar":"ماذا يحدث للسطح والكرة عند الاحتكاك؟","ru":"Что происходит с поверхностью и шаром при трении?","en":"What happens to the surface and ball when they rub?"},"y":{"he":"אנרגיה לא נעלמת. היא עוברת לסביבה בעיקר כחום, ולכן קשה לראות אותה.","ar":"الطاقة لا تختفي. تنتقل إلى المحيط خاصة كحرارة لذلك يصعب رؤيتها.","ru":"Энергия не исчезает. Она уходит в окружение, в основном как тепло, поэтому её трудно заметить.","en":"Energy does not vanish. It goes to the surroundings mostly as heat, so it is hard to notice."}}]},{"t":{"he":"חום וטמפרטורה","ar":"الحرارة ودرجة الحرارة","ru":"Тепло и температура","en":"Heat and temperature"},"phen":{"he":"כוס תה חם מונחת על שולחן ומתקררת. לאן החום הולך?","ar":"كوب شاي ساخن على الطاولة يبرد. إلى أين تذهب الحرارة؟","ru":"Горячий чай на столе остывает. Куда уходит тепло?","en":"A hot cup of tea on the table cools down. Where does the heat go?"},"concept":{"he":"חום הוא אנרגיה שעוברת מגוף חם לגוף קר, עד שהטמפרטורות שוות. טמפרטורה מודדים במדחום, במעלות צלזיוס. חום אינו אותו דבר כמו טמפרטורה.","ar":"الحرارة طاقة تنتقل من جسم ساخن إلى جسم بارد حتى تتساوى درجتا الحرارة. نقيس درجة الحرارة بالمحرار بالدرجات المئوية. الحرارة ليست هي درجة الحرارة.","ru":"Тепло — энергия, переходящая от горячего тела к холодному, пока температуры не сравняются. Температуру измеряют термометром в градусах Цельсия. Тепло и температура — не одно и то же.","en":"Heat is energy moving from a hot object to a cold one until the temperatures are equal. Temperature is measured with a thermometer in degrees Celsius. Heat and temperature are not the same thing."},"steps":[{"he":"מודדים טמפרטורה לפני.","ar":"نقيس درجة الحرارة قبل.","ru":"Измеряем температуру до.","en":"Measure the temperature before."},{"he":"מחכים ומודדים בכל כמה דקות.","ar":"ننتظر ونقيس كل بضع دقائق.","ru":"Ждём и измеряем каждые несколько минут.","en":"Wait and measure every few minutes."},{"he":"משרטטים גרף: טמפרטורה מול זמן.","ar":"نرسم رسمًا بيانيًا: الحرارة مقابل الزمن.","ru":"Строим график: температура и время.","en":"Draw a graph: temperature against time."}],"qs":[{"lv":1,"s":{"he":"לאיזה כיוון עובר חום?","ar":"في أي اتجاه تنتقل الحرارة؟","ru":"В каком направлении переходит тепло?","en":"Which way does heat flow?"},"o":[{"he":"מגוף חם לגוף קר","ar":"من الجسم الساخن إلى البارد","ru":"от горячего тела к холодному","en":"from a hot object to a cold one"},{"he":"מגוף קר לגוף חם","ar":"من البارد إلى الساخن","ru":"от холодного к горячему","en":"from cold to hot"},{"he":"לשום מקום","ar":"إلى لا مكان","ru":"никуда","en":"nowhere"},{"he":"תמיד כלפי מעלה","ar":"دائمًا إلى الأعلى","ru":"всегда вверх","en":"always upward"}],"h":{"he":"מה קורה לקרח ביד חמה?","ar":"ماذا يحدث للجليد في يد دافئة؟","ru":"Что происходит со льдом в тёплой руке?","en":"What happens to ice in a warm hand?"},"y":{"he":"חום עובר מהיד החמה אל הקרח הקר, ולכן הקרח נמס והיד מרגישה קור.","ar":"تنتقل الحرارة من اليد الدافئة إلى الجليد البارد فيذوب وتشعر اليد بالبرد.","ru":"Тепло идёт от тёплой руки ко льду, поэтому лёд тает, а рука чувствует холод.","en":"Heat goes from the warm hand to the cold ice, so the ice melts and the hand feels cold."}},{"lv":2,"s":{"he":"במדחום רואים 80 מעלות לתה ו-20 לחדר. מה יקרה בסוף?","ar":"المحرار يُظهر 80 درجة للشاي و20 للغرفة. ماذا سيحدث في النهاية؟","ru":"Термометр показывает 80 градусов для чая и 20 для комнаты. Что будет в итоге?","en":"The thermometer shows 80 degrees for the tea and 20 for the room. What happens in the end?"},"o":[{"he":"התה יתקרר לכיוון טמפרטורת החדר","ar":"سيبرد الشاي نحو حرارة الغرفة","ru":"чай остынет до температуры комнаты","en":"the tea cools toward room temperature"},{"he":"התה יתחמם ל-100","ar":"سيسخن الشاي إلى 100","ru":"чай нагреется до 100","en":"the tea warms to 100"},{"he":"החדר יתחמם ל-80","ar":"ستسخن الغرفة إلى 80","ru":"комната нагреется до 80","en":"the room warms to 80"},{"he":"שום דבר לא ישתנה","ar":"لن يتغيّر شيء","ru":"ничего не изменится","en":"nothing will change"}],"h":{"he":"לאן החום עובר מהתה?","ar":"إلى أين تنتقل الحرارة من الشاي؟","ru":"Куда переходит тепло от чая?","en":"Where does the heat from the tea go?"},"y":{"he":"החום עובר מהתה החם אל האוויר הקר עד שהטמפרטורות כמעט שוות.","ar":"تنتقل الحرارة من الشاي الساخن إلى الهواء البارد حتى تتقارب الدرجتان.","ru":"Тепло идёт от горячего чая к холодному воздуху, пока температуры почти не сравняются.","en":"Heat goes from the hot tea to the cooler air until the temperatures are almost equal."}}]}],"practice":[{"lv":1,"s":{"he":"איזה סוג אנרגיה יש לכדור שמונח גבוה על מדף?","ar":"أي نوع طاقة لدى كرة موضوعة عاليًا على رف؟","ru":"Какой вид энергии у шара, лежащего высоко на полке?","en":"What kind of energy does a ball high on a shelf have?"},"o":[{"he":"אנרגיית גובה","ar":"طاقة ارتفاع","ru":"энергия высоты","en":"height energy"},{"he":"אנרגיית אור","ar":"طاقة ضوء","ru":"световая энергия","en":"light energy"},{"he":"אנרגיית קול","ar":"طاقة صوت","ru":"звуковая энергия","en":"sound energy"},{"he":"אין לו אנרגיה","ar":"لا طاقة لديها","ru":"энергии нет","en":"none"}],"h":{"he":"מה יקרה אם ייפול?","ar":"ماذا سيحدث لو سقطت؟","ru":"Что будет, если упадёт?","en":"What happens if it falls?"},"y":{"he":"גוף גבוה יכול ליפול ולהתחיל לנוע, ולכן יש לו אנרגיית גובה.","ar":"الجسم المرتفع يمكن أن يسقط ويتحرك لذلك لديه طاقة ارتفاع.","ru":"Высоко лежащее тело может упасть и начать двигаться, поэтому у него есть энергия высоты.","en":"A high object can fall and begin to move, so it has height energy."}},{"lv":1,"s":{"he":"מה מודדים במעלות צלזיוס?","ar":"ماذا نقيس بالدرجات المئوية؟","ru":"Что измеряют в градусах Цельсия?","en":"What is measured in degrees Celsius?"},"o":[{"he":"טמפרטורה","ar":"درجة الحرارة","ru":"температуру","en":"temperature"},{"he":"מסה","ar":"الكتلة","ru":"массу","en":"mass"},{"he":"נפח","ar":"الحجم","ru":"объём","en":"volume"},{"he":"זמן","ar":"الزمن","ru":"время","en":"time"}],"h":{"he":"באיזה מכשיר משתמשים?","ar":"أي جهاز نستعمل؟","ru":"Каким прибором пользуются?","en":"Which device do we use?"},"y":{"he":"טמפרטורה מודדים במדחום, ביחידת מעלות צלזיוס.","ar":"درجة الحرارة تُقاس بالمحرار بوحدة الدرجة المئوية.","ru":"Температуру измеряют термометром в градусах Цельсия.","en":"Temperature is measured by a thermometer in degrees Celsius."}},{"lv":2,"s":{"he":"מהי המרת האנרגיה כשמרימים ספר ואז משחררים?","ar":"ما تحويل الطاقة عند رفع كتاب ثم تركه؟","ru":"Какое превращение энергии при поднятии книги и её отпускании?","en":"What is the energy conversion when you lift a book and drop it?"},"o":[{"he":"גובה לתנועה, ואז לחום וקול בנחיתה","ar":"ارتفاع إلى حركة ثم إلى حرارة وصوت عند الاصطدام","ru":"высота в движение, затем в тепло и звук при падении","en":"height to motion, then to heat and sound on landing"},{"he":"תנועה לחשמל","ar":"حركة إلى كهرباء","ru":"движение в электричество","en":"motion to electricity"},{"he":"חום לגובה","ar":"حرارة إلى ارتفاع","ru":"тепло в высоту","en":"heat to height"},{"he":"אור לתנועה","ar":"ضوء إلى حركة","ru":"свет в движение","en":"light to motion"}],"h":{"he":"מה קורה בזמן הנפילה ובפגיעה?","ar":"ماذا يحدث أثناء السقوط وعند الاصطدام؟","ru":"Что происходит при падении и ударе?","en":"What happens during the fall and the hit?"},"y":{"he":"בנפילה אנרגיית הגובה הופכת לתנועה, ובפגיעה חלק ממנה עובר לחום ולקול.","ar":"في السقوط تتحوّل طاقة الارتفاع إلى حركة وعند الاصطدام يذهب جزء إلى حرارة وصوت.","ru":"При падении энергия высоты переходит в движение, при ударе часть — в тепло и звук.","en":"In the fall height energy becomes motion, and on impact part goes to heat and sound."}},{"lv":2,"s":{"he":"חום וטמפרטורה: מה נכון?","ar":"الحرارة ودرجة الحرارة: ما الصحيح؟","ru":"Тепло и температура: что верно?","en":"Heat and temperature: what is true?"},"o":[{"he":"חום הוא אנרגיה שעוברת, וטמפרטורה נמדדת במדחום","ar":"الحرارة طاقة تنتقل ودرجة الحرارة تُقاس بالمحرار","ru":"тепло — это переходящая энергия, а температуру измеряют термометром","en":"heat is energy that moves, and temperature is read on a thermometer"},{"he":"הם אותו דבר","ar":"هما الشيء نفسه","ru":"это одно и то же","en":"they are the same thing"},{"he":"טמפרטורה היא סוג של חומר","ar":"درجة الحرارة نوع من المادة","ru":"температура — вид вещества","en":"temperature is a kind of material"},{"he":"חום נמדד בגרמים","ar":"الحرارة تُقاس بالغرام","ru":"тепло измеряют в граммах","en":"heat is measured in grams"}],"h":{"he":"איזה מהם עובר בין גופים?","ar":"أيهما ينتقل بين الأجسام؟","ru":"Что из них переходит между телами?","en":"Which one moves between objects?"},"y":{"he":"חום הוא האנרגיה שעוברת מגוף לגוף. טמפרטורה היא מספר שמראה כמה הגוף חם.","ar":"الحرارة هي الطاقة المنتقلة بين الأجسام. درجة الحرارة رقم يبيّن مدى سخونة الجسم.","ru":"Тепло — энергия, переходящая от тела к телу. Температура — число, показывающее, насколько тело горячее.","en":"Heat is the energy moving between objects. Temperature is a number showing how hot an object is."}},{"lv":3,"s":{"he":"תלמידה טוענת שאנרגיה \"נגמרת\" בפנס. מה התשובה המדעית?","ar":"تقول طالبة إن الطاقة «تنتهي» في المصباح اليدوي. ما الجواب العلمي؟","ru":"Ученица говорит, что энергия в фонарике «заканчивается». Каков научный ответ?","en":"A student says energy \"runs out\" in a flashlight. What is the scientific answer?"},"o":[{"he":"האנרגיה הכימית בסוללה עוברת לאור ולחום, ולא נעלמת","ar":"الطاقة الكيميائية في البطارية تتحوّل إلى ضوء وحرارة ولا تختفي","ru":"химическая энергия батарейки переходит в свет и тепло, а не исчезает","en":"chemical energy in the battery turns into light and heat and does not vanish"},{"he":"האנרגיה נעלמת באמת","ar":"الطاقة تختفي فعلًا","ru":"энергия действительно исчезает","en":"the energy truly disappears"},{"he":"הסוללה מייצרת אנרגיה חדשה לנצח","ar":"البطارية تصنع طاقة جديدة للأبد","ru":"батарейка вечно создаёт новую энергию","en":"the battery makes new energy forever"},{"he":"האור לא באמת אנרגיה","ar":"الضوء ليس طاقة فعلًا","ru":"свет не является энергией","en":"light is not really energy"}],"h":{"he":"לאן הולכת האנרגיה מהסוללה?","ar":"إلى أين تذهب الطاقة من البطارية؟","ru":"Куда идёт энергия батарейки?","en":"Where does the battery energy go?"},"y":{"he":"לפי חוק שימור האנרגיה היא עוברת לסוגים אחרים. \"נגמרת\" בסוללה פירושו שאין עוד אנרגיה כימית שאפשר להמיר.","ar":"حسب قانون حفظ الطاقة تنتقل إلى أنواع أخرى. «انتهت» البطارية تعني لم يبق طاقة كيميائية يمكن تحويلها.","ru":"По закону сохранения энергии она переходит в другие виды. «Села» значит, что химической энергии для превращения не осталось.","en":"By conservation of energy it moves into other types. \"Runs out\" means no more chemical energy is left to convert."}},{"lv":3,"s":{"he":"מה אפשר ללמוד מגרף שמראה ירידת טמפרטורה איטית יותר ויותר?","ar":"ماذا نتعلم من رسم يظهر هبوطًا بطيئًا أكثر فأكثر في الحرارة؟","ru":"Что можно узнать из графика, где температура падает всё медленнее?","en":"What can you learn from a graph where temperature falls more and more slowly?"},"o":[{"he":"ככל שההפרש מהסביבה קטן, החום עובר לאט יותר","ar":"كلما قلّ الفرق عن المحيط انتقلت الحرارة أبطأ","ru":"чем меньше разница с окружением, тем медленнее уходит тепло","en":"the smaller the difference from the surroundings, the slower heat moves"},{"he":"הגוף מייצר חום חדש","ar":"الجسم يصنع حرارة جديدة","ru":"тело производит новое тепло","en":"the object makes new heat"},{"he":"המדחום מקולקל","ar":"المحرار معطّل","ru":"термометр сломан","en":"the thermometer is broken"},{"he":"הזמן מאט","ar":"الزمن يتباطأ","ru":"время замедляется","en":"time slows down"}],"h":{"he":"מה קורה כשהטמפרטורה כבר קרובה לחדר?","ar":"ماذا يحدث عندما تقترب الحرارة من حرارة الغرفة؟","ru":"Что происходит, когда температура уже близка к комнатной?","en":"What happens when the temperature is already close to the room?"},"y":{"he":"כשהטמפרטורות קרובות כמעט אין מניע להעברת חום, ולכן הירידה מאטה.","ar":"عندما تتقارب الدرجتان لا يبقى دافع كبير لانتقال الحرارة فيبطؤ الهبوط.","ru":"Когда температуры близки, почти нет причины для передачи тепла, и спад замедляется.","en":"When temperatures are close there is little push for heat transfer, so the drop slows."}}]},{"id":"z6","grade":7,"t":{"he":"תא וחיים","ar":"الخلية والحياة","ru":"Клетка и жизнь","en":"Cells and life"},"pred":{"s":{"he":"מה משותף לכל היצורים החיים, מחיידק ועד פיל?","ar":"ما المشترك بين كل الكائنات الحية من بكتيريا إلى فيل؟","ru":"Что общего у всех живых существ, от бактерии до слона?","en":"What do all living things share, from bacteria to elephants?"},"o":[{"he":"כולם בנויים מתאים","ar":"كلها مبنية من خلايا","ru":"все состоят из клеток","en":"all are made of cells"},{"he":"כולם גדולים","ar":"كلها كبيرة","ru":"все большие","en":"all are big"},{"he":"כולם ירוקים","ar":"كلها خضراء","ru":"все зелёные","en":"all are green"},{"he":"כולם חיים במים","ar":"كلها تعيش في الماء","ru":"все живут в воде","en":"all live in water"}]},"lessons":[{"t":{"he":"מאפייני חיים","ar":"صفات الحياة","ru":"Признаки жизни","en":"Characteristics of life"},"phen":{"he":"סלע, צמח וחתול. איך נדע מי חי?","ar":"صخرة ونبتة وقطة. كيف نعرف أيها حي؟","ru":"Камень, растение и кошка. Как узнать, кто живой?","en":"A rock, a plant and a cat. How do we know which is alive?"},"concept":{"he":"יצורים חיים גדלים, מתרבים, צריכים אנרגיה ומזון, מגיבים לסביבה, ונושמים או מקבלים גזים. דוגמה: צמח מתכופף לאור. סלע לא עושה אף אחד מאלה.","ar":"الكائنات الحية تنمو وتتكاثر وتحتاج طاقة وغذاء وتستجيب للبيئة وتتبادل الغازات. مثال: النبتة تنحني نحو الضوء. الصخرة لا تفعل أيًا من هذه.","ru":"Живые существа растут, размножаются, нуждаются в энергии и пище, реагируют на среду и обмениваются газами. Пример: растение тянется к свету. Камень ничего этого не делает.","en":"Living things grow, reproduce, need energy and food, respond to the environment, and exchange gases. Example: a plant bends toward light. A rock does none of these."},"steps":[{"he":"בוחרים דבר לבדוק.","ar":"نختار شيئًا لنفحصه.","ru":"Выбираем объект для проверки.","en":"Choose something to examine."},{"he":"בודקים כל מאפיין: האם גדל? האם מגיב? האם צריך מזון?","ar":"نفحص كل صفة: هل ينمو؟ هل يستجيب؟ هل يحتاج غذاء؟","ru":"Проверяем каждый признак: растёт? реагирует? нуждается в пище?","en":"Check each trait: does it grow? respond? need food?"},{"he":"מחליטים לפי כמה מאפיינים, לא לפי אחד.","ar":"نقرر حسب عدة صفات لا صفة واحدة.","ru":"Решаем по нескольким признакам, а не по одному.","en":"Decide by several traits, not one."}],"qs":[{"lv":1,"s":{"he":"מה מאפיין יצור חי?","ar":"ما الذي يميّز الكائن الحي؟","ru":"Что характерно для живого существа?","en":"What marks a living thing?"},"o":[{"he":"הוא גדל ומגיב לסביבה","ar":"ينمو ويستجيب للبيئة","ru":"растёт и реагирует на среду","en":"it grows and responds to the environment"},{"he":"הוא לא משתנה לעולם","ar":"لا يتغيّر أبدًا","ru":"не меняется никогда","en":"it never changes"},{"he":"הוא תמיד זז ממקום למקום","ar":"يتحرك دائمًا من مكان لآخر","ru":"всегда перемещается с места на место","en":"it always moves from place to place"},{"he":"הוא תמיד גדול","ar":"هو دائمًا كبير","ru":"он всегда большой","en":"it is always big"}],"h":{"he":"האם גם צמח שלא זז הוא חי?","ar":"هل النبتة التي لا تتحرك حية أيضًا؟","ru":"Живое ли растение, которое не двигается с места?","en":"Is a plant that stays in place alive too?"},"y":{"he":"יצור חי גדל ומגיב. אין חובה לזוז ממקום למקום, ולכן גם צמחים חיים.","ar":"الكائن الحي ينمو ويستجيب. لا يلزم الانتقال من مكان لآخر لذا النباتات حية.","ru":"Живое растёт и реагирует. Перемещаться необязательно, поэтому растения тоже живые.","en":"A living thing grows and responds. It need not move around, so plants are alive too."}},{"lv":2,"s":{"he":"אש גדלה, צריכה חמצן ומגיבה לרוח. האם היא יצור חי?","ar":"النار تكبر وتحتاج أكسجين وتتأثر بالريح. هل هي كائن حي؟","ru":"Огонь растёт, нуждается в кислороде и реагирует на ветер. Он живой?","en":"Fire grows, needs oxygen and reacts to wind. Is it alive?"},"o":[{"he":"לא, כי היא לא בנויה מתאים ולא מתרבה כיצור חי","ar":"لا، لأنها غير مبنية من خلايا ولا تتكاثر ككائن حي","ru":"нет, она не состоит из клеток и не размножается как живое","en":"no, it is not made of cells and does not reproduce like a living thing"},{"he":"כן, כי היא גדלה","ar":"نعم لأنها تكبر","ru":"да, потому что растёт","en":"yes, because it grows"},{"he":"כן, כי היא חמה","ar":"نعم لأنها ساخنة","ru":"да, потому что горячая","en":"yes, because it is hot"},{"he":"כן, כי היא זזה","ar":"نعم لأنها تتحرك","ru":"да, потому что движется","en":"yes, because it moves"}],"h":{"he":"האם מספיק מאפיין אחד כדי להיות חי?","ar":"هل تكفي صفة واحدة لنكون أحياء؟","ru":"Достаточно ли одного признака, чтобы быть живым?","en":"Is one trait enough to be alive?"},"y":{"he":"צריך כמה מאפיינים יחד, והחשוב ביניהם בנייה מתאים. לאש אין תאים.","ar":"يلزم عدة صفات معًا وأهمها البناء من خلايا. النار ليس لها خلايا.","ru":"Нужно несколько признаков вместе, и главный — клеточное строение. У огня клеток нет.","en":"Several traits are needed together, and a key one is being made of cells. Fire has no cells."}}]},{"t":{"he":"התא","ar":"الخلية","ru":"Клетка","en":"The cell"},"phen":{"he":"מה רואים במיקרוסקופ בקליפת בצל דקה?","ar":"ماذا نرى في المجهر في قشرة بصل رقيقة؟","ru":"Что видно в микроскоп в тонкой плёнке лука?","en":"What do you see in a microscope in a thin onion skin?"},"concept":{"he":"התא הוא היחידה הקטנה של חיים. לכל תא יש קרום שמגן ושולט במה נכנס ויוצא, ציטופלזמה, וגרעין שמכוון את התא. לתאי צמח יש גם דופן תא וכלורופלסטים לצבע ירוק ולפוטוסינתזה.","ar":"الخلية هي الوحدة الصغيرة للحياة. لكل خلية غشاء يحمي ويتحكم بما يدخل ويخرج، وسيتوبلازم، ونواة توجّه الخلية. لخلايا النبات أيضًا جدار خلوي وبلاستيدات خضراء للون الأخضر ولعملية البناء الضوئي.","ru":"Клетка — малая единица жизни. У каждой клетки есть мембрана, которая защищает и регулирует вход и выход, цитоплазма и ядро, управляющее клеткой. У растительных клеток есть ещё клеточная стенка и хлоропласты для зелёного цвета и фотосинтеза.","en":"The cell is the small unit of life. Every cell has a membrane that protects it and controls what goes in and out, cytoplasm, and a nucleus that directs the cell. Plant cells also have a cell wall and chloroplasts for green color and photosynthesis."},"steps":[{"he":"מכינים נקודת צפייה: מורה מציבה את הפרוסה.","ar":"نجهّز: المعلّمة تضع الشريحة.","ru":"Готовим: учитель ставит препарат.","en":"Prepare: the teacher sets the slide."},{"he":"מביטים בהגדלה קטנה ואז בגדולה.","ar":"ننظر بتكبير صغير ثم كبير.","ru":"Смотрим сначала с малым, затем с большим увеличением.","en":"Look at low then high magnification."},{"he":"מציירים ומסמנים: קרום, גרעין, דופן.","ar":"نرسم ونشير: غشاء، نواة، جدار.","ru":"Рисуем и подписываем: мембрана, ядро, стенка.","en":"Draw and label: membrane, nucleus, wall."}],"qs":[{"lv":1,"s":{"he":"מה תפקיד קרום התא?","ar":"ما وظيفة غشاء الخلية؟","ru":"Какова роль клеточной мембраны?","en":"What does the cell membrane do?"},"o":[{"he":"שולט במה נכנס ויוצא","ar":"يتحكم بما يدخل ويخرج","ru":"регулирует, что входит и выходит","en":"controls what enters and leaves"},{"he":"עושה פוטוסינתזה","ar":"يقوم بالبناء الضوئي","ru":"осуществляет фотосинтез","en":"does photosynthesis"},{"he":"מכיל את כל המידע התורשתי","ar":"يحتوي كل المعلومات الوراثية","ru":"хранит всю наследственную информацию","en":"stores all inherited information"},{"he":"נותן צבע ירוק","ar":"يعطي اللون الأخضر","ru":"даёт зелёный цвет","en":"gives green color"}],"h":{"he":"איך תא מקבל מים ומזון?","ar":"كيف تحصل الخلية على الماء والغذاء؟","ru":"Как клетка получает воду и пищу?","en":"How does a cell get water and food?"},"y":{"he":"הקרום הוא כמו שער: מכניס מה שצריך ומוציא פסולת.","ar":"الغشاء مثل بوابة: يدخل ما يلزم ويُخرج الفضلات.","ru":"Мембрана как ворота: пропускает нужное и выводит отходы.","en":"The membrane is like a gate: it lets in what is needed and sends out waste."}},{"lv":2,"s":{"he":"מה יש בתא צמח וחסר בתא של בעל חיים?","ar":"ما الموجود في خلية النبات وغير موجود في خلية الحيوان؟","ru":"Что есть в клетке растения, но нет в клетке животного?","en":"What is in a plant cell but not in an animal cell?"},"o":[{"he":"דופן תא וכלורופלסטים","ar":"جدار خلوي وبلاستيدات خضراء","ru":"клеточная стенка и хлоропласты","en":"a cell wall and chloroplasts"},{"he":"גרעין","ar":"نواة","ru":"ядро","en":"a nucleus"},{"he":"קרום","ar":"غشاء","ru":"мембрана","en":"a membrane"},{"he":"ציטופלזמה","ar":"سيتوبلازم","ru":"цитоплазма","en":"cytoplasm"}],"h":{"he":"מה נותן לצמח צורה יציבה ואיך הוא מייצר מזון?","ar":"ما الذي يعطي النبات شكلًا ثابتًا وكيف يصنع غذاءه؟","ru":"Что даёт растению устойчивую форму и как оно делает пищу?","en":"What gives a plant a firm shape and how does it make food?"},"y":{"he":"לגרעין, לקרום ולציטופלזמה יש בשני סוגי התאים. הדופן והכלורופלסטים מיוחדים לצמח.","ar":"النواة والغشاء والسيتوبلازم في النوعين. الجدار والبلاستيدات خاصة بالنبات.","ru":"Ядро, мембрана и цитоплазма есть в обоих типах. Стенка и хлоропласты — только у растений.","en":"The nucleus, membrane and cytoplasm are in both. The wall and chloroplasts are special to plants."}}]}],"practice":[{"lv":1,"s":{"he":"מה רואים בעזרת מיקרוסקופ?","ar":"ماذا نرى بواسطة المجهر؟","ru":"Что видно с помощью микроскопа?","en":"What does a microscope let us see?"},"o":[{"he":"דברים קטנים מאוד כמו תאים","ar":"أشياء صغيرة جدًا مثل الخلايا","ru":"очень мелкие вещи, например клетки","en":"very small things such as cells"},{"he":"דברים רחוקים מאוד","ar":"أشياء بعيدة جدًا","ru":"очень далёкие вещи","en":"very far away things"},{"he":"רק חומרים כחולים","ar":"مواد زرقاء فقط","ru":"только синие вещества","en":"only blue substances"},{"he":"את הלב מבחוץ","ar":"القلب من الخارج","ru":"сердце снаружи","en":"a heart from outside"}],"h":{"he":"מה גדול מדי לעין ומוקטן למיקרוסקופ?","ar":"ما الصغير على العين الذي يكبّره المجهر؟","ru":"Что слишком мелко для глаза?","en":"What is too small for the eye?"},"y":{"he":"מיקרוסקופ מגדיל עצמים קטנים, ובזכותו ראו לראשונה תאים.","ar":"المجهر يكبّر الأشياء الصغيرة وبفضله شوهدت الخلايا أول مرة.","ru":"Микроскоп увеличивает мелкое, и благодаря ему впервые увидели клетки.","en":"A microscope enlarges tiny things, and with it cells were first seen."}},{"lv":1,"s":{"he":"מהו הגרעין?","ar":"ما هي النواة؟","ru":"Что такое ядро?","en":"What is the nucleus?"},"o":[{"he":"החלק שמכוון את פעילות התא","ar":"الجزء الذي يوجّه نشاط الخلية","ru":"часть, управляющая работой клетки","en":"the part that directs the cell"},{"he":"חלק שעושה אור","ar":"جزء يصنع الضوء","ru":"часть, дающая свет","en":"a part that makes light"},{"he":"קליפה חיצונית של הצמח","ar":"قشرة خارجية للنبات","ru":"наружная оболочка растения","en":"an outer shell of the plant"},{"he":"מים בתא","ar":"الماء في الخلية","ru":"вода в клетке","en":"water in the cell"}],"h":{"he":"מי נותן הוראות?","ar":"من يعطي التعليمات؟","ru":"Кто даёт указания?","en":"Who gives instructions?"},"y":{"he":"בגרעין נמצא המידע שמכוון את פעילות התא.","ar":"في النواة المعلومات التي توجّه نشاط الخلية.","ru":"В ядре информация, управляющая работой клетки.","en":"The nucleus holds the information that directs the cell."}},{"lv":2,"s":{"he":"למה לצמח ירוק יש כלורופלסטים?","ar":"لماذا للنبات الأخضر بلاستيدات خضراء؟","ru":"Зачем у зелёного растения хлоропласты?","en":"Why does a green plant have chloroplasts?"},"o":[{"he":"בהם מתבצעת פוטוסינתזה, ייצור מזון מאור","ar":"فيها يتم البناء الضوئي، صنع الغذاء من الضوء","ru":"в них идёт фотосинтез, создание пищи из света","en":"photosynthesis happens there, making food from light"},{"he":"הם מגנים מקור","ar":"تحمي من البرد","ru":"они защищают от холода","en":"they protect from cold"},{"he":"הם מוציאים פסולת","ar":"تُخرج الفضلات","ru":"они выводят отходы","en":"they remove waste"},{"he":"הם נותנים ריח","ar":"تعطي رائحة","ru":"они дают запах","en":"they give smell"}],"h":{"he":"איזה צבע יש לכלורופיל, ומה צריך הצמח כדי לגדול?","ar":"ما لون الكلوروفيل وماذا يحتاج النبات ليكبر؟","ru":"Какого цвета хлорофилл и что нужно растению для роста?","en":"What color is chlorophyll and what does a plant need to grow?"},"y":{"he":"בכלורופלסטים יש כלורופיל ירוק שקולט אור לייצור מזון.","ar":"في البلاستيدات كلوروفيل أخضر يمتص الضوء لصنع الغذاء.","ru":"В хлоропластах зелёный хлорофилл улавливает свет для создания пищи.","en":"Chloroplasts hold green chlorophyll that captures light to make food."}},{"lv":2,"s":{"he":"מה משותף לכל התאים?","ar":"ما المشترك بين كل الخلايا؟","ru":"Что общего у всех клеток?","en":"What do all cells share?"},"o":[{"he":"יש להם קרום וציטופלזמה","ar":"لها غشاء وسيتوبلازم","ru":"у них есть мембрана и цитоплазма","en":"they have a membrane and cytoplasm"},{"he":"יש להם דופן תא","ar":"لها جدار خلوي","ru":"у них есть клеточная стенка","en":"they have a cell wall"},{"he":"יש להם כלורופלסטים","ar":"لها بلاستيدات خضراء","ru":"у них есть хлоропласты","en":"they have chloroplasts"},{"he":"יש להם אותו צבע","ar":"لها اللون نفسه","ru":"у них один цвет","en":"they have the same color"}],"h":{"he":"מה גם לחיידק וגם לאדם יש?","ar":"ما الذي لدى البكتيريا والإنسان معًا؟","ru":"Что есть и у бактерии, и у человека?","en":"What do both a bacterium and a human have?"},"y":{"he":"קרום וציטופלזמה קיימים בכל סוגי התאים.","ar":"الغشاء والسيتوبلازم موجودان في كل أنواع الخلايا.","ru":"Мембрана и цитоплазма есть во всех типах клеток.","en":"Membrane and cytoplasm exist in every type of cell."}},{"lv":3,"s":{"he":"תלמיד ראה במיקרוסקופ משהו שזז. האם זה בהכרח תא חי?","ar":"رأى طالب في المجهر شيئًا يتحرك. هل هو حتمًا خلية حية؟","ru":"Ученик увидел в микроскоп что-то движущееся. Обязательно ли это живая клетка?","en":"A student sees something moving in a microscope. Is it necessarily a living cell?"},"o":[{"he":"לא בהכרח, צריך לבדוק עוד מאפייני חיים","ar":"ليس حتمًا، يلزم فحص صفات حياة أخرى","ru":"не обязательно, надо проверить другие признаки жизни","en":"not necessarily, more life traits must be checked"},{"he":"כן, כל דבר שזז חי","ar":"نعم كل ما يتحرك حي","ru":"да, всё движущееся живое","en":"yes, anything that moves is alive"},{"he":"לא, תאים אינם זזים","ar":"لا، الخلايا لا تتحرك","ru":"нет, клетки не двигаются","en":"no, cells never move"},{"he":"כן, כי הוא קטן","ar":"نعم لأنه صغير","ru":"да, потому что он маленький","en":"yes, because it is small"}],"h":{"he":"האם גם גרגירי אבק יכולים לזוז במים?","ar":"هل يمكن لذرات الغبار أن تتحرك في الماء؟","ru":"Могут ли и пылинки двигаться в воде?","en":"Can dust grains also move in water?"},"y":{"he":"תנועה אחת אינה מספיקה. גם חלקיקים לא חיים נעים במים, ולכן בודקים גם גדילה, תגובה ומבנה.","ar":"حركة واحدة لا تكفي. جسيمات غير حية تتحرك في الماء أيضًا لذلك نفحص النمو والاستجابة والبنية.","ru":"Одного движения мало. Неживые частицы тоже двигаются в воде, поэтому проверяют рост, реакцию и строение.","en":"Movement alone is not enough. Non-living particles also move in water, so check growth, response and structure."}},{"lv":3,"s":{"he":"מסתכלים במיקרוסקופ בתא מקליפת בצל ומחפשים בו כלורופלסטים. מה נכון?","ar":"ننظر في المجهر إلى خلية من قشرة البصل ونبحث فيها عن بلاستيدات خضراء. ما الصحيح؟","ru":"Смотрим в микроскоп на клетку из кожицы лука и ищем в ней хлоропласты. Что верно?","en":"We look through a microscope at a cell from onion skin and search it for chloroplasts. Which is true?"},"o":[{"he":"לא נראה אותם, כי בקליפת בצל אין כלורופלסטים","ar":"لن نراها لأن قشرة البصل بلا بلاستيدات خضراء","ru":"мы их не увидим, в кожице лука нет хлоропластов","en":"we will not see them, onion skin has no chloroplasts"},{"he":"נראה אותם ירוקים","ar":"سنراها خضراء","ru":"увидим зелёными","en":"we will see them green"},{"he":"התא ימות","ar":"ستموت الخلية","ru":"клетка погибнет","en":"the cell will die"},{"he":"התא יהיה ללא גרעין","ar":"ستكون الخلية بلا نواة","ru":"клетка будет без ядра","en":"the cell will have no nucleus"}],"h":{"he":"האם בצל מקבל אור בתוך האדמה?","ar":"هل يصله ضوء داخل التراب؟","ru":"Получает ли лук свет в земле?","en":"Does an onion get light underground?"},"y":{"he":"חלק מהצמח שאינו נחשף לאור, כמו בצל, לא צריך כלורופלסטים ולכן אין בו.","ar":"الجزء من النبات الذي لا يتعرض للضوء مثل البصل لا يحتاج بلاستيدات لذلك لا توجد.","ru":"Часть растения без света, как лук, не нуждается в хлоропластах, поэтому их нет.","en":"A plant part not exposed to light, like an onion, does not need chloroplasts, so it has none."}}]},{"id":"h9","grade":8,"t":{"he":"כוחות","ar":"القوى","ru":"Силы","en":"Forces"},"pred":{"s":{"he":"כדור מתגלגל על הרצפה ועוצר לבד. לדעתי...","ar":"كرة تتدحرج على الأرض وتتوقف وحدها. أظن أن...","ru":"Мяч катится по полу и сам останавливается. Я думаю...","en":"A ball rolls on the floor and stops by itself. I think..."},"o":[{"he":"הרצפה מפעילה חיכוך נגד התנועה","ar":"الأرض تؤثّر باحتكاك عكس الحركة","ru":"пол создаёт трение против движения","en":"the floor applies friction against the motion"},{"he":"נגמר לכדור הכוח","ar":"نفدت قوة الكرة","ru":"у мяча кончилась сила","en":"the ball ran out of force"},{"he":"הכדור התעייף","ar":"الكرة تعبت","ru":"мяч устал","en":"the ball got tired"},{"he":"האוויר רוצה שיעצור","ar":"الهواء يريد أن تتوقف","ru":"воздух хочет, чтобы он остановился","en":"the air wants it to stop"}]},"lessons":[{"t":{"he":"כוח הוא אינטראקציה","ar":"القوة تفاعل","ru":"Сила — это взаимодействие","en":"A force is an interaction"},"phen":{"he":"דוחפים ארון כבד והוא לא זז. דוחפים כדור והוא זז מיד. מה משותף לשני המקרים?","ar":"ندفع خزانة ثقيلة فلا تتحرك. وندفع كرة فتتحرك فورًا. ما المشترك بين الحالتين؟","ru":"Толкаем тяжёлый шкаф — он не двигается. Толкаем мяч — он сразу катится. Что общего?","en":"You push a heavy cabinet and it does not move. You push a ball and it moves at once. What is common?"},"concept":{"he":"כוח הוא דחיפה או משיכה שגוף אחד מפעיל על גוף אחר. תמיד יש שני גופים. כוח נמדד בניוטון (N) בכוחמד, ויש לו כיוון.","ar":"القوة دفع أو سحب يؤثّر به جسم على جسم آخر. دائمًا هناك جسمان. تُقاس القوة بالنيوتن (N) بميزان القوة، ولها اتجاه.","ru":"Сила — это толчок или притяжение, которое одно тело оказывает на другое. Всегда есть два тела. Силу измеряют в ньютонах (N) динамометром, и у неё есть направление.","en":"A force is a push or a pull that one object applies to another. There are always two objects. Force is measured in newtons (N) with a force meter, and it has a direction."},"steps":[{"he":"מזהים את הגוף שמרגישים עליו את הכוח.","ar":"نحدّد الجسم الذي يتأثّر بالقوة.","ru":"Находим тело, на которое действует сила.","en":"Find the object the force acts on."},{"he":"מזהים מי מפעיל אותו: גוף אחר.","ar":"نحدّد من يؤثّر عليه: جسم آخر.","ru":"Находим, кто на него действует: другое тело.","en":"Find who acts on it: another object."},{"he":"כותבים את הכיוון: ״היד דוחפת את הארון ימינה״.","ar":"نكتب الاتجاه: «اليد تدفع الخزانة إلى اليمين».","ru":"Записываем направление: «рука толкает шкаф вправо».","en":"Write the direction: \"the hand pushes the cabinet to the right\"."}],"qs":[{"lv":1,"s":{"he":"איזה משפט מתאר כוח?","ar":"أي جملة تصف قوة؟","ru":"Какое предложение описывает силу?","en":"Which sentence describes a force?"},"o":[{"he":"היד דוחפת את הקופסה.","ar":"اليد تدفع الصندوق.","ru":"Рука толкает коробку.","en":"The hand pushes the box."},{"he":"הקופסה כחולה.","ar":"الصندوق أزرق.","ru":"Коробка синяя.","en":"The box is blue."},{"he":"הקופסה כבדה מאוד.","ar":"الصندوق ثقيل جدًا.","ru":"Коробка очень тяжёлая.","en":"The box is very heavy."},{"he":"הקופסה עומדת על שולחן.","ar":"الصندوق يقف على طاولة.","ru":"Коробка стоит на столе.","en":"The box sits on a table."}],"h":{"he":"חפשו משפט עם ״דוחפת״ או ״מושכת״ ושני גופים.","ar":"ابحثوا عن جملة فيها «تدفع» أو «تسحب» وجسمين.","ru":"Ищите предложение с «толкает» или «тянет» и двумя телами.","en":"Look for \"pushes\" or \"pulls\" and two objects."},"y":{"he":"כוח הוא פעולה של גוף אחד על גוף אחר: היד על הקופסה.","ar":"القوة فعل جسم على جسم آخر: اليد على الصندوق.","ru":"Сила — действие одного тела на другое: рука на коробку.","en":"A force is one object acting on another: the hand on the box."}},{"lv":2,"s":{"he":"ספר נופל מהיד אל הרצפה. מי מושך אותו כלפי מטה?","ar":"كتاب يسقط من اليد إلى الأرض. من يسحبه إلى الأسفل؟","ru":"Книга падает из руки на пол. Кто тянет её вниз?","en":"A book falls from a hand to the floor. What pulls it down?"},"o":[{"he":"כדור הארץ, בכוח הכובד.","ar":"الأرض، بقوة الجاذبية.","ru":"Земля, силой тяжести.","en":"The Earth, by the force of gravity."},{"he":"הספר עצמו.","ar":"الكتاب نفسه.","ru":"Сама книга.","en":"The book itself."},{"he":"הרצפה.","ar":"الأرض الصلبة.","ru":"Пол.","en":"The floor."},{"he":"האוויר.","ar":"الهواء.","ru":"Воздух.","en":"The air."}],"h":{"he":"כוח דורש גוף שני. איזה גוף גדול מושך הכול לכיוון מטה?","ar":"القوة تحتاج إلى جسم ثانٍ. أي جسم كبير يسحب كل شيء إلى الأسفل؟","ru":"Сила требует второго тела. Какое большое тело тянет всё вниз?","en":"A force needs a second object. Which huge object pulls everything down?"},"y":{"he":"כוח הכובד הוא משיכה של כדור הארץ. הספר לא מושך את עצמו.","ar":"قوة الجاذبية هي سحب الأرض. الكتاب لا يسحب نفسه.","ru":"Сила тяжести — притяжение Земли. Книга не тянет сама себя.","en":"Gravity is the pull of the Earth. The book does not pull itself."}}]},{"t":{"he":"חיכוך","ar":"الاحتكاك","ru":"Трение","en":"Friction"},"phen":{"he":"ילד מחליק על קרח ומחליק רחוק. אותו ילד מחליק על שטיח ועוצר מהר. למה?","ar":"طفل ينزلق على الجليد فيصل بعيدًا. وعلى سجادة يتوقف بسرعة. لماذا؟","ru":"Ребёнок скользит по льду далеко. На ковре он быстро останавливается. Почему?","en":"A child slides far on ice. On a carpet the same child stops fast. Why?"},"concept":{"he":"חיכוך הוא כוח בין שני משטחים שנוגעים זה בזה. הוא פועל נגד כיוון ההחלקה. משטח מחוספס נותן יותר חיכוך. משטח חלק נותן פחות.","ar":"الاحتكاك قوة بين سطحين متلامسين. يؤثّر عكس اتجاه الانزلاق. السطح الخشن يعطي احتكاكًا أكبر. والسطح الأملس يعطي أقل.","ru":"Трение — это сила между двумя соприкасающимися поверхностями. Она действует против направления скольжения. Шероховатая поверхность даёт больше трения, гладкая — меньше.","en":"Friction is a force between two surfaces that touch. It acts against the direction of sliding. A rough surface gives more friction. A smooth one gives less."},"steps":[{"he":"מזהים שני משטחים שנוגעים: נעל וקרקע.","ar":"نحدّد السطحين المتلامسين: حذاء وأرض.","ru":"Находим две соприкасающиеся поверхности: обувь и пол.","en":"Find the two touching surfaces: shoe and floor."},{"he":"מזהים לאן החפץ נע או מנסה לנוע.","ar":"نحدّد إلى أين يتحرك الجسم أو يحاول التحرك.","ru":"Определяем, куда движется или пытается двигаться тело.","en":"Find where the object moves or tries to move."},{"he":"החיכוך מצביע לכיוון ההפוך.","ar":"الاحتكاك يشير إلى الاتجاه المعاكس.","ru":"Трение направлено в противоположную сторону.","en":"Friction points the opposite way."}],"qs":[{"lv":1,"s":{"he":"על איזה משטח החיכוך הכי גדול?","ar":"على أي سطح يكون الاحتكاك أكبر؟","ru":"На какой поверхности трение больше всего?","en":"On which surface is friction biggest?"},"o":[{"he":"שטיח עבה","ar":"سجادة سميكة","ru":"толстый ковёр","en":"a thick carpet"},{"he":"קרח","ar":"جليد","ru":"лёд","en":"ice"},{"he":"רצפה רטובה וחלקה","ar":"أرض مبللة وملساء","ru":"мокрый гладкий пол","en":"a wet smooth floor"},{"he":"זכוכית מבריקה","ar":"زجاج لامع","ru":"блестящее стекло","en":"shiny glass"}],"h":{"he":"איזה משטח הכי מחוספס?","ar":"أي سطح هو الأخشن؟","ru":"Какая поверхность самая шероховатая?","en":"Which surface is roughest?"},"y":{"he":"משטח מחוספס נותן יותר חיכוך, ולכן שטיח עבה עוצר מהר.","ar":"السطح الخشن يعطي احتكاكًا أكبر، لذلك تتوقف الأشياء بسرعة على السجادة السميكة.","ru":"Шероховатая поверхность даёт больше трения, поэтому на толстом ковре всё быстро останавливается.","en":"A rough surface gives more friction, so things stop fast on a thick carpet."}},{"lv":2,"s":{"he":"למה נועלים נעליים עם סוליה מחורצת בגשם?","ar":"لماذا نلبس أحذية بنعل مخدّد في المطر؟","ru":"Зачем в дождь носят обувь с рифлёной подошвой?","en":"Why wear shoes with a grooved sole in the rain?"},"o":[{"he":"החריצים מגדילים את החיכוך עם הרצפה ומונעים החלקה.","ar":"الأخاديد تزيد الاحتكاك مع الأرض وتمنع الانزلاق.","ru":"Канавки увеличивают трение с полом и не дают скользить.","en":"The grooves increase friction with the floor and stop slipping."},{"he":"החריצים מבריקים יותר.","ar":"الأخاديد أكثر لمعانًا.","ru":"Канавки красивее блестят.","en":"The grooves look shinier."},{"he":"החריצים מורידים את החיכוך.","ar":"الأخاديد تقلّل الاحتكاك.","ru":"Канавки уменьшают трение.","en":"The grooves reduce friction."},{"he":"החריצים הופכים את הנעל לקלה.","ar":"الأخاديد تجعل الحذاء أخف.","ru":"Канавки делают обувь легче.","en":"The grooves make the shoe lighter."}],"h":{"he":"מה אנחנו רוצים: יותר חיכוך או פחות?","ar":"ماذا نريد: احتكاكًا أكبر أم أقل؟","ru":"Чего мы хотим: больше трения или меньше?","en":"What do we want: more friction or less?"},"y":{"he":"כשהרצפה רטובה, חיכוך קטן גורם להחלקה. סוליה מחורצת מגדילה אותו.","ar":"عندما تكون الأرض مبللة يقلّ الاحتكاك فننزلق. النعل المخدّد يزيده.","ru":"На мокром полу трение мало, и мы скользим. Рифлёная подошва увеличивает его.","en":"On a wet floor friction is small and you slip. A grooved sole increases it."}}]}],"practice":[{"lv":1,"s":{"he":"באיזו יחידה נמדד כוח?","ar":"بأي وحدة تُقاس القوة؟","ru":"В каких единицах измеряют силу?","en":"In which unit is force measured?"},"o":[{"he":"ניוטון (N)","ar":"نيوتن (N)","ru":"ньютон (N)","en":"newton (N)"},{"he":"גרם","ar":"غرام","ru":"грамм","en":"gram"},{"he":"ליטר","ar":"لتر","ru":"литр","en":"liter"},{"he":"שנייה","ar":"ثانية","ru":"секунда","en":"second"}],"h":{"he":"היחידה קרויה על שם מדען אנגלי.","ar":"الوحدة سُمّيت باسم عالم إنجليزي.","ru":"Единица названа в честь английского учёного.","en":"The unit is named after an English scientist."},"y":{"he":"כוח נמדד בניוטון, בכוחמד.","ar":"القوة تُقاس بالنيوتن بميزان القوة.","ru":"Силу измеряют в ньютонах динамометром.","en":"Force is measured in newtons with a force meter."}},{"lv":1,"s":{"he":"כמה גופים צריך כדי שיהיה כוח?","ar":"كم جسمًا نحتاج كي توجد قوة؟","ru":"Сколько тел нужно, чтобы возникла сила?","en":"How many objects are needed for a force?"},"o":[{"he":"שניים לפחות","ar":"اثنان على الأقل","ru":"минимум два","en":"at least two"},{"he":"אחד","ar":"واحد","ru":"одно","en":"one"},{"he":"אפס","ar":"صفر","ru":"ноль","en":"zero"},{"he":"אין צורך בגוף","ar":"لا حاجة إلى جسم","ru":"тело не нужно","en":"no object is needed"}],"h":{"he":"מי דוחף, ומי נדחף?","ar":"من يدفع ومن يُدفع؟","ru":"Кто толкает и кого толкают?","en":"Who pushes, and who is pushed?"},"y":{"he":"כוח הוא פעולה בין שני גופים: אחד מפעיל ואחד מרגיש.","ar":"القوة فعل بين جسمين: أحدهما يؤثّر والآخر يتأثّر.","ru":"Сила — взаимодействие двух тел: одно действует, другое испытывает действие.","en":"A force is an action between two objects: one acts and one feels it."}},{"lv":2,"s":{"he":"ילד מחליק על רצפה ועוצר. לאיזה כיוון פועל החיכוך?","ar":"طفل ينزلق على الأرض ويتوقف. إلى أي اتجاه يؤثّر الاحتكاك؟","ru":"Ребёнок скользит по полу и останавливается. В какую сторону действует трение?","en":"A child slides on a floor and stops. In which direction does friction act?"},"o":[{"he":"נגד כיוון ההחלקה","ar":"عكس اتجاه الانزلاق","ru":"против направления скольжения","en":"against the sliding direction"},{"he":"באותו כיוון כמו ההחלקה","ar":"في اتجاه الانزلاق نفسه","ru":"в том же направлении, что и скольжение","en":"the same direction as sliding"},{"he":"כלפי מעלה","ar":"إلى الأعلى","ru":"вверх","en":"upward"},{"he":"אין כיוון","ar":"لا اتجاه له","ru":"направления нет","en":"it has no direction"}],"h":{"he":"החיכוך גורם לילד לעצור.","ar":"الاحتكاك يجعل الطفل يتوقف.","ru":"Трение заставляет ребёнка остановиться.","en":"Friction makes the child stop."},"y":{"he":"חיכוך מאט את התנועה, ולכן פועל נגד כיוון ההחלקה.","ar":"الاحتكاك يبطّئ الحركة، لذلك يؤثّر عكس اتجاه الانزلاق.","ru":"Трение замедляет движение, поэтому действует против направления скольжения.","en":"Friction slows motion, so it acts against the sliding direction."}},{"lv":2,"s":{"he":"מה קורה לחיכוך כשמורחים שמן בין שני משטחים?","ar":"ماذا يحدث للاحتكاك عند وضع زيت بين سطحين؟","ru":"Что происходит с трением, если смазать маслом две поверхности?","en":"What happens to friction when you put oil between two surfaces?"},"o":[{"he":"הוא קטן.","ar":"يقلّ.","ru":"Оно уменьшается.","en":"It gets smaller."},{"he":"הוא גדל.","ar":"يزداد.","ru":"Оно увеличивается.","en":"It gets bigger."},{"he":"הוא נעלם לגמרי תמיד.","ar":"يختفي تمامًا دائمًا.","ru":"Оно всегда полностью исчезает.","en":"It always disappears completely."},{"he":"הוא לא משתנה.","ar":"لا يتغيّر.","ru":"Не меняется.","en":"It does not change."}],"h":{"he":"שמן הופך משטח ליותר חלק.","ar":"الزيت يجعل السطح أملس.","ru":"Масло делает поверхность более гладкой.","en":"Oil makes a surface smoother."},"y":{"he":"משטח חלק יותר נותן חיכוך קטן יותר. לכן שמנים מורחים במנועים.","ar":"السطح الأملس يعطي احتكاكًا أقل. لذلك يوضع الزيت في المحرّكات.","ru":"Более гладкая поверхность даёт меньше трения. Поэтому масло наливают в двигатели.","en":"A smoother surface gives less friction. That is why engines use oil."}},{"lv":3,"s":{"he":"כדור מתגלגל ועוצר לבד על רצפה. איזה הסבר מבוסס על כוחות?","ar":"كرة تتدحرج وتتوقف وحدها على الأرض. أي تفسير يعتمد على القوى؟","ru":"Мяч катится и сам останавливается на полу. Какое объяснение опирается на силы?","en":"A ball rolls and stops by itself on a floor. Which explanation is based on forces?"},"o":[{"he":"הרצפה מפעילה על הכדור חיכוך נגד כיוון התנועה, ולכן הוא מאט.","ar":"الأرض تؤثّر على الكرة باحتكاك عكس اتجاه الحركة، لذلك تبطؤ.","ru":"Пол действует на мяч трением против движения, поэтому он замедляется.","en":"The floor applies friction on the ball against its motion, so it slows."},{"he":"נגמר לכדור הכוח שנתנו לו.","ar":"نفدت القوة التي أعطيناها للكرة.","ru":"У мяча кончилась сила, которую ему дали.","en":"The ball ran out of the force we gave it."},{"he":"הכדור מתעייף.","ar":"الكرة تتعب.","ru":"Мяч устаёт.","en":"The ball gets tired."},{"he":"הכדור רוצה לנוח.","ar":"الكرة تريد أن ترتاح.","ru":"Мяч хочет отдохнуть.","en":"The ball wants to rest."}],"h":{"he":"איזה גוף נוגע בכדור ומפעיל עליו כוח?","ar":"أي جسم يلامس الكرة ويؤثّر عليها بقوة؟","ru":"Какое тело касается мяча и действует на него?","en":"Which object touches the ball and acts on it?"},"y":{"he":"הסבר בכוחות מזהה גוף שני: הרצפה. הכדור לא ״מתעייף״ ואין בו כוח שנגמר.","ar":"التفسير بالقوى يحدّد جسمًا ثانيًا: الأرض. الكرة لا «تتعب» وليس فيها قوة تنفد.","ru":"Объяснение через силы называет второе тело: пол. Мяч не «устаёт» и в нём нет силы, которая кончается.","en":"A force explanation names a second object: the floor. The ball does not \"get tired\" and has no force that runs out."}},{"lv":3,"s":{"he":"למה קשה יותר להזיז ארון כבד על הרצפה מאשר ארון ריק?","ar":"لماذا يصعب سحب خزانة ثقيلة على الأرض أكثر من خزانة فارغة؟","ru":"Почему тяжёлый шкаф двигать по полу труднее, чем пустой?","en":"Why is a heavy cabinet harder to slide across a floor than an empty one?"},"o":[{"he":"כוח הכובד לוחץ חזק יותר על הרצפה, ולכן החיכוך גדול יותר.","ar":"قوة الجاذبية تضغط الأرض أكثر فيزداد الاحتكاك.","ru":"Сила тяжести сильнее прижимает шкаф к полу, и трение больше.","en":"Gravity presses it harder on the floor, so friction is bigger."},{"he":"כי הרצפה נהיית חלקה יותר.","ar":"لأن الأرض تصبح أملس.","ru":"Потому что пол становится более гладким.","en":"Because the floor gets smoother."},{"he":"כי החיכוך נעלם כשהארון כבד.","ar":"لأن الاحتكاك يختفي عندما تكون الخزانة ثقيلة.","ru":"Потому что трение исчезает, когда шкаф тяжёлый.","en":"Because friction disappears when the cabinet is heavy."},{"he":"כי הארון הריק מושך את הרצפה.","ar":"لأن الخزانة الفارغة تسحب الأرض.","ru":"Потому что пустой шкаф притягивает пол.","en":"Because the empty cabinet pulls the floor."}],"h":{"he":"מה משתנה בין שני המקרים: המסה, ולכן הלחיצה על הרצפה.","ar":"ما الذي يتغير بين الحالتين: الكتلة، وبالتالي الضغط على الأرض.","ru":"Что меняется в двух случаях: масса, а значит и прижатие к полу.","en":"What changes between the cases: the mass, so the pressing on the floor."},"y":{"he":"ככל שהגוף לוחץ חזק יותר על המשטח, כך החיכוך גדול יותר.","ar":"كلما ضغط الجسم أكثر على السطح زاد الاحتكاك.","ru":"Чем сильнее тело давит на поверхность, тем больше трение.","en":"The harder an object presses on a surface, the bigger the friction."}}]},{"id":"a1","grade":8,"t":{"he":"אטומים ויסודות","ar":"الذرّات والعناصر","ru":"Атомы и элементы","en":"Atoms and elements"},"pred":{"s":{"he":"מה קטן יותר: אטום או תא חי?","ar":"ما الأصغر: الذرة أم الخلية الحية؟","ru":"Что меньше: атом или живая клетка?","en":"Which is smaller: an atom or a living cell?"},"o":[{"he":"אטום","ar":"ذرة","ru":"атом","en":"an atom"},{"he":"תא","ar":"خلية","ru":"клетка","en":"a cell"},{"he":"אותו גודל","ar":"الحجم نفسه","ru":"одного размера","en":"the same size"},{"he":"אי אפשר לדעת","ar":"لا يمكن معرفة ذلك","ru":"узнать нельзя","en":"it cannot be known"}]},"lessons":[{"t":{"he":"מבנה האטום","ar":"بنية الذرة","ru":"Строение атома","en":"The structure of the atom"},"phen":{"he":"כל חומר, מאוויר ועד אבן, בנוי מאטומים. מה יש בתוך אטום?","ar":"كل مادة من الهواء إلى الحجر مبنية من ذرات. ماذا يوجد داخل الذرة؟","ru":"Всё вещество, от воздуха до камня, состоит из атомов. Что внутри атома?","en":"All matter, from air to stone, is built of atoms. What is inside an atom?"},"concept":{"he":"באטום יש גרעין במרכז ואלקטרונים סביבו. בגרעין יש פרוטונים (מטען חיובי) ונייטרונים (בלי מטען). לאלקטרון מטען שלילי. באטום רגיל מספר הפרוטונים שווה למספר האלקטרונים, ולכן הוא ניטרלי.","ar":"في الذرة نواة في المركز وإلكترونات حولها. في النواة بروتونات (شحنة موجبة) ونيوترونات (بلا شحنة). للإلكترون شحنة سالبة. في الذرة العادية عدد البروتونات يساوي عدد الإلكترونات لذلك هي متعادلة.","ru":"В атоме в центре ядро, вокруг него электроны. В ядре протоны (положительный заряд) и нейтроны (без заряда). У электрона отрицательный заряд. В обычном атоме число протонов равно числу электронов, поэтому он нейтрален.","en":"An atom has a nucleus in the center and electrons around it. The nucleus holds protons (positive charge) and neutrons (no charge). An electron has a negative charge. In a regular atom the number of protons equals the number of electrons, so it is neutral."},"steps":[{"he":"מציירים גרעין במרכז.","ar":"نرسم نواة في المركز.","ru":"Рисуем ядро в центре.","en":"Draw a nucleus in the center."},{"he":"מוסיפים פרוטונים ונייטרונים בתוכו.","ar":"نضيف بروتونات ونيوترونات فيها.","ru":"Добавляем протоны и нейтроны внутрь.","en":"Add protons and neutrons inside."},{"he":"מוסיפים אלקטרונים סביבו, ובודקים שהמספרים מאוזנים.","ar":"نضيف إلكترونات حوله ونتأكد من تعادل الأعداد.","ru":"Добавляем электроны вокруг и проверяем баланс чисел.","en":"Add electrons around it and check the numbers balance."}],"qs":[{"lv":1,"s":{"he":"איזה חלקיק באטום בעל מטען שלילי?","ar":"أي جسيم في الذرة له شحنة سالبة؟","ru":"Какая частица в атоме имеет отрицательный заряд?","en":"Which particle in an atom is negatively charged?"},"o":[{"he":"אלקטרון","ar":"إلكترون","ru":"электрон","en":"electron"},{"he":"פרוטון","ar":"بروتون","ru":"протон","en":"proton"},{"he":"נייטרון","ar":"نيوترون","ru":"нейтрон","en":"neutron"},{"he":"גרעין","ar":"نواة","ru":"ядро","en":"nucleus"}],"h":{"he":"איזה חלקיק נע סביב הגרעין?","ar":"أي جسيم يتحرك حول النواة؟","ru":"Какая частица движется вокруг ядра?","en":"Which particle moves around the nucleus?"},"y":{"he":"אלקטרון הוא החלקיק השלילי. פרוטון חיובי ונייטרון ללא מטען.","ar":"الإلكترون هو الجسيم السالب. البروتون موجب والنيوترون بلا شحنة.","ru":"Электрон — отрицательная частица. Протон положительный, нейтрон без заряда.","en":"The electron is the negative particle. The proton is positive and the neutron has no charge."}},{"lv":2,"s":{"he":"באטום 6 פרוטונים. כמה אלקטרונים יש באטום ניטרלי?","ar":"في ذرة 6 بروتونات. كم إلكترونًا في ذرة متعادلة؟","ru":"В атоме 6 протонов. Сколько электронов в нейтральном атоме?","en":"An atom has 6 protons. How many electrons does a neutral atom have?"},"o":[{"he":"6","ar":"6","ru":"6","en":"6"},{"he":"12","ar":"12","ru":"12","en":"12"},{"he":"0","ar":"0","ru":"0","en":"0"},{"he":"3","ar":"3","ru":"3","en":"3"}],"h":{"he":"מה צריך כדי שהמטען הכולל יהיה אפס?","ar":"ماذا يلزم ليكون المجموع صفرًا؟","ru":"Что нужно, чтобы общий заряд был нулём?","en":"What is needed for the total charge to be zero?"},"y":{"he":"חיובי ושלילי מתאזנים כשיש מספר שווה של פרוטונים ואלקטרונים.","ar":"الموجب والسالب يتعادلان عندما يتساوى عدد البروتونات والإلكترونات.","ru":"Плюс и минус уравновешиваются при равном числе протонов и электронов.","en":"Positive and negative balance when protons and electrons are equal in number."}}]},{"t":{"he":"יסודות וטבלת היסודות","ar":"العناصر والجدول الدوري","ru":"Элементы и таблица элементов","en":"Elements and the periodic table"},"phen":{"he":"חמצן, זהב ופחמן הם חומרים שונים. במה הם שונים ברמת האטום?","ar":"الأكسجين والذهب والكربون مواد مختلفة. بماذا تختلف على مستوى الذرة؟","ru":"Кислород, золото и углерод — разные вещества. Чем они различаются на уровне атома?","en":"Oxygen, gold and carbon are different materials. How do they differ at the atom level?"},"concept":{"he":"יסוד הוא חומר שכל האטומים בו מאותו סוג, עם אותו מספר פרוטונים. המספר הזה הוא המספר האטומי. בטבלת היסודות היסודות מסודרים לפי המספר האטומי, ויסודות עם תכונות דומות באותה עמודה.","ar":"العنصر مادة كل ذراتها من النوع نفسه ولها العدد نفسه من البروتونات. هذا العدد هو العدد الذري. في الجدول الدوري ترتّب العناصر حسب العدد الذري والعناصر المتشابهة في عمود واحد.","ru":"Элемент — вещество, все атомы которого одного вида, с одинаковым числом протонов. Это число — атомный номер. В таблице элементы идут по атомному номеру, а похожие по свойствам стоят в одном столбце.","en":"An element is a substance whose atoms are all of one kind, with the same number of protons. That number is the atomic number. The table lists elements by atomic number, with similar elements in the same column."},"steps":[{"he":"מוצאים את היסוד בטבלה לפי הסמל, למשל O לחמצן.","ar":"نجد العنصر في الجدول من الرمز مثل O للأكسجين.","ru":"Находим элемент в таблице по символу, например O — кислород.","en":"Find the element in the table by its symbol, e.g. O for oxygen."},{"he":"קוראים את המספר האטומי: זה מספר הפרוטונים.","ar":"نقرأ العدد الذري: هو عدد البروتونات.","ru":"Читаем атомный номер: это число протонов.","en":"Read the atomic number: that is the number of protons."},{"he":"משווים לשכנים בעמודה: יש להם תכונות דומות.","ar":"نقارن مع الجيران في العمود: لهم خصائص متشابهة.","ru":"Сравниваем с соседями по столбцу: у них схожие свойства.","en":"Compare with the column neighbors: they have similar properties."}],"qs":[{"lv":1,"s":{"he":"מה קובע איזה יסוד זה האטום?","ar":"ما الذي يحدد أي عنصر هو الذرة؟","ru":"Что определяет, к какому элементу относится атом?","en":"What decides which element an atom is?"},"o":[{"he":"מספר הפרוטונים","ar":"عدد البروتونات","ru":"число протонов","en":"the number of protons"},{"he":"הצבע שלו","ar":"لونها","ru":"его цвет","en":"its color"},{"he":"כמה הוא כבד בערך","ar":"مدى ثقلها تقريبًا","ru":"насколько он тяжёлый","en":"roughly how heavy it is"},{"he":"איפה מצאו אותו","ar":"أين وُجدت","ru":"где его нашли","en":"where it was found"}],"h":{"he":"איזה מספר הוא \"תעודת הזהות\" של היסוד?","ar":"أي رقم هو «هوية» العنصر؟","ru":"Какое число — «паспорт» элемента?","en":"Which number is the element's ID?"},"y":{"he":"לכל יסוד יש מספר פרוטונים משלו, והוא המספר האטומי.","ar":"لكل عنصر عدد بروتونات خاص به وهو العدد الذري.","ru":"У каждого элемента своё число протонов — атомный номер.","en":"Each element has its own number of protons, the atomic number."}},{"lv":2,"s":{"he":"יסודות באותה עמודה בטבלה. מה נכון עליהם?","ar":"عناصر في العمود نفسه من الجدول. ما الصحيح عنها؟","ru":"Элементы в одном столбце таблицы. Что верно о них?","en":"Elements in the same column of the table. What is true?"},"o":[{"he":"יש להם תכונות דומות","ar":"لها خصائص متشابهة","ru":"у них схожие свойства","en":"they have similar properties"},{"he":"אותו מספר פרוטונים","ar":"العدد نفسه من البروتونات","ru":"одинаковое число протонов","en":"the same number of protons"},{"he":"הם תמיד גזים","ar":"هي دائمًا غازات","ru":"они всегда газы","en":"they are always gases"},{"he":"הם אותו יסוד","ar":"هي العنصر نفسه","ru":"это один элемент","en":"they are the same element"}],"h":{"he":"למה הטבלה מסודרת בעמודות?","ar":"لماذا الجدول مرتب في أعمدة؟","ru":"Почему таблица разбита на столбцы?","en":"Why is the table arranged in columns?"},"y":{"he":"עמודה כוללת משפחה של יסודות עם התנהגות דומה, אך עם מספרי פרוטונים שונים.","ar":"العمود يضم عائلة عناصر ذات سلوك متشابه لكن بأعداد بروتونات مختلفة.","ru":"Столбец — семейство элементов со схожим поведением, но с разным числом протонов.","en":"A column is a family of elements that behave alike, but with different numbers of protons."}}]}],"practice":[{"lv":1,"s":{"he":"מה סמל היסוד חמצן?","ar":"ما رمز عنصر الأكسجين؟","ru":"Каков символ кислорода?","en":"What is the symbol of oxygen?"},"o":[{"he":"O","ar":"O","ru":"O","en":"O"},{"he":"Ox","ar":"Ox","ru":"Ox","en":"Ox"},{"he":"Cl","ar":"Cl","ru":"Cl","en":"Cl"},{"he":"H","ar":"H","ru":"H","en":"H"}],"h":{"he":"איזו אות ראשונה בשם האנגלי?","ar":"ما أول حرف في الاسم الإنجليزي؟","ru":"Какая первая буква английского названия?","en":"What is the first letter of the English name?"},"y":{"he":"הסמל של חמצן הוא האות O.","ar":"رمز الأكسجين هو الحرف O.","ru":"Символ кислорода — буква O.","en":"The symbol of oxygen is the letter O."}},{"lv":1,"s":{"he":"מה נמצא בגרעין האטום?","ar":"ماذا يوجد في نواة الذرة؟","ru":"Что находится в ядре атома?","en":"What is inside the atom's nucleus?"},"o":[{"he":"פרוטונים ונייטרונים","ar":"بروتونات ونيوترونات","ru":"протоны и нейтроны","en":"protons and neutrons"},{"he":"אלקטרונים בלבד","ar":"إلكترونات فقط","ru":"только электроны","en":"electrons only"},{"he":"מים","ar":"ماء","ru":"вода","en":"water"},{"he":"אוויר","ar":"هواء","ru":"воздух","en":"air"}],"h":{"he":"איפה האלקטרונים?","ar":"أين الإلكترونات؟","ru":"Где электроны?","en":"Where are the electrons?"},"y":{"he":"הגרעין מכיל פרוטונים ונייטרונים. האלקטרונים נעים סביבו.","ar":"النواة تحتوي بروتونات ونيوترونات. الإلكترونات تتحرك حولها.","ru":"Ядро содержит протоны и нейтроны. Электроны движутся вокруг него.","en":"The nucleus holds protons and neutrons. Electrons move around it."}},{"lv":2,"s":{"he":"ליסוד יש מספר אטומי 8. כמה פרוטונים באטום?","ar":"لعنصر عدد ذري 8. كم بروتونًا في الذرة؟","ru":"У элемента атомный номер 8. Сколько протонов в атоме?","en":"An element has atomic number 8. How many protons are in the atom?"},"o":[{"he":"8","ar":"8","ru":"8","en":"8"},{"he":"16","ar":"16","ru":"16","en":"16"},{"he":"4","ar":"4","ru":"4","en":"4"},{"he":"1","ar":"1","ru":"1","en":"1"}],"h":{"he":"מה המספר האטומי אומר?","ar":"ماذا يعني العدد الذري؟","ru":"Что означает атомный номер?","en":"What does the atomic number mean?"},"y":{"he":"המספר האטומי הוא מספר הפרוטונים בגרעין.","ar":"العدد الذري هو عدد البروتونات في النواة.","ru":"Атомный номер — число протонов в ядре.","en":"The atomic number is the number of protons in the nucleus."}},{"lv":2,"s":{"he":"אטום ניטרלי הופך לחיובי. מה קרה?","ar":"ذرة متعادلة صارت موجبة. ماذا حدث؟","ru":"Нейтральный атом стал положительным. Что случилось?","en":"A neutral atom became positive. What happened?"},"o":[{"he":"הוא איבד אלקטרון","ar":"فقدت إلكترونًا","ru":"он потерял электрон","en":"it lost an electron"},{"he":"הוא קיבל פרוטון","ar":"اكتسبت بروتونًا","ru":"он получил протон","en":"it gained a proton"},{"he":"הוא איבד נייטרון","ar":"فقدت نيوترونًا","ru":"он потерял нейтрон","en":"it lost a neutron"},{"he":"הוא נהיה גז","ar":"صارت غازًا","ru":"он стал газом","en":"it became a gas"}],"h":{"he":"איזה חלקיק קל להסיר מהאטום?","ar":"أي جسيم يسهل إزالته من الذرة؟","ru":"Какую частицу легко убрать из атома?","en":"Which particle is easiest to remove?"},"y":{"he":"אם יוצא אלקטרון שלילי, נשאר באטום עודף של מטען חיובי.","ar":"إن خرج إلكترون سالب يبقى فائض موجب في الذرة.","ru":"Если уходит отрицательный электрон, остаётся избыток положительного заряда.","en":"If a negative electron leaves, a positive excess remains."}},{"lv":3,"s":{"he":"ליסוד X יש 11 פרוטונים, וליסוד Y יש 11 פרוטונים. מה נכון?","ar":"للعنصر X 11 بروتونًا وللعنصر Y 11 بروتونًا. ما الصحيح؟","ru":"У элемента X 11 протонов, у Y тоже 11. Что верно?","en":"Element X has 11 protons and element Y has 11 protons. What is true?"},"o":[{"he":"הם אותו יסוד","ar":"هما العنصر نفسه","ru":"это один элемент","en":"they are the same element"},{"he":"הם יסודות שונים","ar":"هما عنصران مختلفان","ru":"это разные элементы","en":"they are different elements"},{"he":"אחד מהם גז","ar":"أحدهما غاز","ru":"один из них газ","en":"one is a gas"},{"he":"אי אפשר לדעת","ar":"لا يمكن المعرفة","ru":"узнать нельзя","en":"it cannot be known"}],"h":{"he":"מה קובע את זהות היסוד?","ar":"ما الذي يحدد هوية العنصر؟","ru":"Что определяет личность элемента?","en":"What defines the identity of an element?"},"y":{"he":"אותו מספר פרוטונים אומר אותו יסוד, גם אם מספר הנייטרונים שונה.","ar":"العدد نفسه من البروتونات يعني العنصر نفسه حتى لو اختلف عدد النيوترونات.","ru":"Одинаковое число протонов — один элемент, даже если нейтронов разное число.","en":"The same number of protons means the same element, even if neutron counts differ."}},{"lv":3,"s":{"he":"מדוע אנחנו משתמשים במודל האטום ולא רואים אטומים?","ar":"لماذا نستخدم نموذج الذرة ولا نرى الذرات؟","ru":"Почему мы пользуемся моделью атома, а не видим атомы?","en":"Why do we use a model of the atom instead of seeing atoms?"},"o":[{"he":"האטומים קטנים מדי לראות ישירות, והמודל מסביר תצפיות","ar":"الذرات أصغر من أن تُرى مباشرة والنموذج يفسر الملاحظات","ru":"атомы слишком малы, чтобы увидеть прямо, а модель объясняет наблюдения","en":"atoms are too small to see directly and the model explains observations"},{"he":"כי המודל מדויק לגמרי","ar":"لأن النموذج دقيق تمامًا","ru":"потому что модель совершенно точна","en":"because the model is perfectly exact"},{"he":"כי אין אטומים באמת","ar":"لأنه لا توجد ذرات فعلًا","ru":"потому что атомов на самом деле нет","en":"because atoms are not real"},{"he":"כי אסור להסתכל עליהם","ar":"لأن النظر إليها ممنوع","ru":"потому что на них смотреть запрещено","en":"because looking at them is forbidden"}],"h":{"he":"מה תפקיד מודל?","ar":"ما وظيفة النموذج؟","ru":"Какова роль модели?","en":"What is a model for?"},"y":{"he":"מודלים עוזרים להסביר ולחזות תופעות שלא רואים. הם משתפרים כשיש ראיות חדשות.","ar":"النماذج تساعد على تفسير وتوقّع ظواهر لا نراها. وتتحسن عند ظهور أدلة جديدة.","ru":"Модели помогают объяснять и предсказывать то, что не видно. Они улучшаются с новыми данными.","en":"Models help explain and predict things we cannot see. They improve with new evidence."}}]},{"id":"a2","grade":8,"t":{"he":"תערובות והפרדה","ar":"المخاليط والفصل","ru":"Смеси и разделение","en":"Mixtures and separation"},"pred":{"s":{"he":"מים עם חול. איך מפרידים ביניהם?","ar":"ماء مع رمل. كيف نفصل بينهما؟","ru":"Вода с песком. Как их разделить?","en":"Water with sand. How do we separate them?"},"o":[{"he":"מסננים","ar":"نرشّح","ru":"фильтруем","en":"we filter"},{"he":"מאדים את החול","ar":"نبخّر الرمل","ru":"выпариваем песок","en":"we evaporate the sand"},{"he":"מקפיאים את החול","ar":"نجمّد الرمل","ru":"замораживаем песок","en":"we freeze the sand"},{"he":"אי אפשר להפריד","ar":"لا يمكن الفصل","ru":"разделить нельзя","en":"it cannot be separated"}]},"lessons":[{"t":{"he":"תערובות וחומרים טהורים","ar":"المخاليط والمواد النقية","ru":"Смеси и чистые вещества","en":"Mixtures and pure substances"},"phen":{"he":"מלח וחול מעורבבים בצלחת. האם זה חומר אחד?","ar":"ملح ورمل مخلوطان في طبق. هل هي مادة واحدة؟","ru":"Соль и песок смешаны в тарелке. Это одно вещество?","en":"Salt and sand mixed on a plate. Is it one substance?"},"concept":{"he":"חומר טהור הוא חומר אחד בלבד. תערובת היא כמה חומרים מעורבבים, וכל אחד שומר על תכונותיו. בתערובת הרכב יכול להשתנות. תמיסה היא תערובת אחידה, כמו מלח במים.","ar":"المادة النقية مادة واحدة فقط. الخليط عدة مواد ممزوجة وكل منها يحتفظ بخصائصه. في الخليط يمكن أن يتغيّر التركيب. المحلول خليط متجانس مثل الملح في الماء.","ru":"Чистое вещество — только одно вещество. Смесь — несколько веществ вместе, и каждое сохраняет свои свойства. В смеси состав может меняться. Раствор — однородная смесь, например соль в воде.","en":"A pure substance is only one substance. A mixture is several substances together, each keeping its own properties. A mixture can vary in makeup. A solution is a uniform mixture, like salt in water."},"steps":[{"he":"מסתכלים: האם רואים חלקים שונים?","ar":"ننظر: هل نرى أجزاء مختلفة؟","ru":"Смотрим: видны ли разные части?","en":"Look: can you see different parts?"},{"he":"בודקים תכונה שונה לכל מרכיב, למשל נמס במים או לא.","ar":"نفحص خاصية مختلفة لكل مكوّن مثل يذوب في الماء أم لا.","ru":"Проверяем разное свойство каждой составляющей, например растворяется ли в воде.","en":"Test a different property for each part, e.g. dissolves in water or not."},{"he":"מחליטים: תערובת או חומר טהור.","ar":"نقرر: خليط أم مادة نقية.","ru":"Решаем: смесь или чистое вещество.","en":"Decide: mixture or pure substance."}],"qs":[{"lv":1,"s":{"he":"מה מהבאים הוא תערובת?","ar":"أي مما يلي خليط؟","ru":"Что из этого — смесь?","en":"Which of these is a mixture?"},"o":[{"he":"מים עם מלח","ar":"ماء مع ملح","ru":"вода с солью","en":"water with salt"},{"he":"מים טהורים","ar":"ماء نقي","ru":"чистая вода","en":"pure water"},{"he":"זהב טהור","ar":"ذهب نقي","ru":"чистое золото","en":"pure gold"},{"he":"חמצן בלבד","ar":"أكسجين فقط","ru":"только кислород","en":"oxygen alone"}],"h":{"he":"כמה חומרים יש?","ar":"كم مادة هناك؟","ru":"Сколько веществ?","en":"How many substances are there?"},"y":{"he":"במים עם מלח יש שני חומרים מעורבבים, ולכן זו תערובת.","ar":"في الماء مع الملح مادتان ممزوجتان لذلك هو خليط.","ru":"В воде с солью два вещества вместе, значит это смесь.","en":"Salt water has two substances together, so it is a mixture."}},{"lv":2,"s":{"he":"מה קורה למרכיבים בתערובת?","ar":"ماذا يحدث للمكوّنات في الخليط؟","ru":"Что происходит с составляющими смеси?","en":"What happens to the parts of a mixture?"},"o":[{"he":"הם שומרים על תכונותיהם","ar":"تحتفظ بخصائصها","ru":"они сохраняют свои свойства","en":"they keep their properties"},{"he":"הם הופכים לחומר חדש","ar":"تتحول إلى مادة جديدة","ru":"они становятся новым веществом","en":"they become a new substance"},{"he":"הם נעלמים","ar":"تختفي","ru":"они исчезают","en":"they vanish"},{"he":"הם תמיד באותה כמות","ar":"هي دائمًا بالكمية نفسها","ru":"их всегда одинаковое количество","en":"they are always in the same amount"}],"h":{"he":"האם מלח במים עדיין מלוח?","ar":"هل الملح في الماء ما زال مالحًا؟","ru":"Остаётся ли соль в воде солёной?","en":"Does salt in water still taste salty?"},"y":{"he":"בתערובת אין תגובה כימית, ולכן כל מרכיב שומר על תכונותיו.","ar":"في الخليط لا يوجد تفاعل كيميائي لذلك يحتفظ كل مكوّن بخصائصه.","ru":"В смеси нет химической реакции, поэтому каждая составляющая сохраняет свойства.","en":"A mixture has no chemical reaction, so each part keeps its properties."}}]},{"t":{"he":"שיטות הפרדה","ar":"طرق الفصل","ru":"Способы разделения","en":"Separation methods"},"phen":{"he":"בבית רוצים להפריד פסטה ממים, ובמעבדה מלח ממים. מה משותף לשיטות?","ar":"في البيت نفصل المعكرونة عن الماء وفي المختبر الملح عن الماء. ما المشترك بين الطرق؟","ru":"Дома отделяют макароны от воды, в лаборатории — соль от воды. Что общего у способов?","en":"At home we separate pasta from water, in a lab salt from water. What do the methods share?"},"concept":{"he":"מפרידים לפי תכונה שונה בין המרכיבים. סינון: לפי גודל החלקיקים. התאדות: מי מתאדה ומי לא. זיקוק: לפי נקודות רתיחה שונות. מגנט: חומר שמושך מגנט. התמיסה והמוצק בסינון נשארים אותם חומרים.","ar":"نفصل حسب خاصية تختلف بين المكوّنات. ترشيح: حسب حجم الجسيمات. تبخير: من يتبخر ومن لا. تقطير: حسب نقاط غليان مختلفة. مغناطيس: مادة يجذبها المغناطيس.","ru":"Разделяют по свойству, которое различается у составляющих. Фильтрация — по размеру частиц. Выпаривание — что испаряется, а что нет. Перегонка — по разным температурам кипения. Магнит — вещество, притягивающееся магнитом.","en":"We separate using a property that differs between the parts. Filtering: particle size. Evaporation: what evaporates and what does not. Distillation: different boiling points. Magnet: a material a magnet attracts."},"steps":[{"he":"שואלים במה המרכיבים שונים.","ar":"نسأل بماذا تختلف المكوّنات.","ru":"Спрашиваем, чем различаются составляющие.","en":"Ask how the parts differ."},{"he":"בוחרים שיטה שמנצלת את ההבדל.","ar":"نختار طريقة تستغل الفرق.","ru":"Выбираем способ, использующий различие.","en":"Choose a method that uses the difference."},{"he":"מחממים רק בהדגמת מורה או בסימולציה.","ar":"نسخّن فقط بعرض المعلّم أو بمحاكاة.","ru":"Нагреваем только при демонстрации учителя или в симуляции.","en":"Heat only in a teacher demo or in a simulation."}],"qs":[{"lv":1,"s":{"he":"איך מפרידים חול ממים?","ar":"كيف نفصل الرمل عن الماء؟","ru":"Как отделить песок от воды?","en":"How do you separate sand from water?"},"o":[{"he":"בסינון","ar":"بالترشيح","ru":"фильтрованием","en":"by filtering"},{"he":"במגנט","ar":"بالمغناطيس","ru":"магнитом","en":"with a magnet"},{"he":"בקירור","ar":"بالتبريد","ru":"охлаждением","en":"by cooling"},{"he":"בהקשה","ar":"بالطرق","ru":"постукиванием","en":"by tapping"}],"h":{"he":"מה עובר דרך הנייר ומה נשאר עליו?","ar":"ما الذي يعبر الورق وما الذي يبقى عليه؟","ru":"Что проходит через бумагу, а что остаётся?","en":"What passes through the paper and what stays?"},"y":{"he":"החול גדול מדי לעבור דרך נייר הסינון והמים עוברים.","ar":"الرمل أكبر من أن يعبر ورق الترشيح والماء يعبر.","ru":"Песок слишком крупен для фильтра, а вода проходит.","en":"Sand is too big to pass the filter paper while water passes through."}},{"lv":2,"s":{"he":"איך משיגים מלח ממי ים?","ar":"كيف نحصل على الملح من ماء البحر؟","ru":"Как получить соль из морской воды?","en":"How do you get salt from sea water?"},"o":[{"he":"מאדים את המים והמלח נשאר","ar":"نبخّر الماء ويبقى الملح","ru":"выпариваем воду, и соль остаётся","en":"evaporate the water and the salt stays"},{"he":"מסננים בנייר","ar":"نرشّح بورق","ru":"фильтруем бумагой","en":"filter with paper"},{"he":"משתמשים במגנט","ar":"نستعمل المغناطيس","ru":"используем магнит","en":"u
