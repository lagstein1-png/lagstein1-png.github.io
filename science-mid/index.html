الخلوي؟","ru":"Что происходит при клеточном дыхании?","en":"What happens in cellular respiration?"},"o":[{"he":"גלוקוז מתפרק עם חמצן ומשתחררת אנרגיה","ar":"يتفكك الغلوكوز مع الأكسجين وتتحرر طاقة","ru":"глюкоза расщепляется с кислородом, высвобождается энергия","en":"glucose breaks down with oxygen and energy is released"},{"he":"נוצר גלוקוז מאור","ar":"يتكوّن غلوكوز من الضوء","ru":"из света создаётся глюкоза","en":"glucose forms from light"},{"he":"התא מפסיק לפעול","ar":"تتوقف الخلية","ru":"клетка перестаёт работать","en":"the cell stops working"},{"he":"החמצן נעלם בלי להשאיר דבר","ar":"يختفي الأكسجين بلا أثر","ru":"кислород исчезает бесследно","en":"oxygen vanishes without trace"}],"h":{"he":"איזה חומר נצרך בתהליך ואיזה נפלט?","ar":"أي مادة تُستهلك وأيها تنطلق؟","ru":"Что расходуется, а что выделяется?","en":"What is used and what is released?"},"y":{"he":"בנשימה תאית מפיקים אנרגיה מגלוקוז, ונפלטים פחמן דו-חמצני ומים.","ar":"في التنفس الخلوي تُستخرج طاقة من الغلوكوز وينطلق ثاني أكسيد الكربون والماء.","ru":"При дыхании получают энергию из глюкозы, выделяются углекислый газ и вода.","en":"Respiration gets energy from glucose and releases carbon dioxide and water."}},{"lv":2,"s":{"he":"למה אדם מתנשם חזק אחרי ריצה?","ar":"لماذا يتنفس الإنسان بقوة بعد الركض؟","ru":"Почему после бега человек дышит часто?","en":"Why does a person breathe hard after running?"},"o":[{"he":"התאים צריכים יותר חמצן לנשימה תאית","ar":"الخلايا تحتاج أكسجين أكثر للتنفس الخلوي","ru":"клеткам нужно больше кислорода для клеточного дыхания","en":"cells need more oxygen for cellular respiration"},{"he":"כדי לייצר פוטוסינתזה","ar":"ليصنع بناءً ضوئيًا","ru":"чтобы делать фотосинтез","en":"to make photosynthesis"},{"he":"כי האוויר מתחמם","ar":"لأن الهواء يسخن","ru":"потому что воздух нагревается","en":"because the air warms up"},{"he":"בלי סיבה","ar":"بلا سبب","ru":"без причины","en":"for no reason"}],"h":{"he":"מה צריכים השרירים כשהם עובדים קשה?","ar":"ماذا تحتاج العضلات عند العمل الشاق؟","ru":"Что нужно мышцам при тяжёлой работе?","en":"What do muscles need when working hard?"},"y":{"he":"שרירים עובדים צורכים יותר אנרגיה, ולכן יותר חמצן וגלוקוז.","ar":"العضلات العاملة تستهلك طاقة أكثر لذلك أكسجين وغلوكوز أكثر.","ru":"Работающие мышцы тратят больше энергии, значит нужно больше кислорода и глюкозы.","en":"Working muscles use more energy, so they need more oxygen and glucose."}},{"lv":3,"s":{"he":"צמח הונח בחושך כמה ימים ונחלש. מה ההסבר?","ar":"وُضعت نبتة في الظلام أيامًا فضعفت. ما التفسير؟","ru":"Растение несколько дней стояло в темноте и ослабло. Каково объяснение?","en":"A plant sat in the dark for days and weakened. What is the explanation?"},"o":[{"he":"בלי אור אין פוטוסינתזה ולכן אין ייצור סוכר","ar":"بلا ضوء لا بناء ضوئي فلا ينتج سكر","ru":"без света нет фотосинтеза, поэтому нет сахара","en":"without light there is no photosynthesis, so no sugar is made"},{"he":"בחושך התאים לא נושמים כלל","ar":"في الظلام لا تتنفس الخلايا إطلاقًا","ru":"в темноте клетки вообще не дышат","en":"in the dark cells do not respire at all"},{"he":"הצמח צמא ולא קשור לאור","ar":"النبتة عطشى ولا علاقة للضوء","ru":"растение хочет пить, а свет ни при чём","en":"the plant is thirsty and light is unrelated"},{"he":"החושך הפך אותו לחיה","ar":"الظلام حوّلها إلى حيوان","ru":"темнота сделала его животным","en":"darkness turned it into an animal"}],"h":{"he":"איזה רכיב חסר לצמח בחושך?","ar":"أي مكوّن ينقص النبتة في الظلام؟","ru":"Чего не хватает растению в темноте?","en":"What input is missing in the dark?"},"y":{"he":"בלי אור הצמח לא מייצר גלוקוז, והוא מנצל את מה שצבר עד שהוא נגמר.","ar":"بلا ضوء لا يصنع النبات الغلوكوز ويستهلك مخزونه حتى ينفد.","ru":"Без света растение не делает глюкозу и тратит запасы, пока они не кончатся.","en":"Without light the plant makes no glucose and uses its stores until they run out."}},{"lv":3,"s":{"he":"ארוחה כוללת רק פחמימות. מה חסר לתזונה מאוזנת?","ar":"وجبة فيها كربوهيدرات فقط. ماذا ينقص التغذية المتوازنة؟","ru":"В приёме пищи только углеводы. Чего не хватает сбалансированному питанию?","en":"A meal has only carbohydrates. What is missing for a balanced diet?"},"o":[{"he":"חלבונים, שומנים, ויטמינים, מינרלים ומים","ar":"بروتينات ودهون وفيتامينات ومعادن وماء","ru":"белки, жиры, витамины, минералы и вода","en":"proteins, fats, vitamins, minerals and water"},{"he":"שום דבר","ar":"لا شيء","ru":"ничего","en":"nothing"},{"he":"רק עוד סוכר","ar":"المزيد من السكر فقط","ru":"только ещё сахар","en":"only more sugar"},{"he":"רק עוד מלח","ar":"المزيد من الملح فقط","ru":"только ещё соль","en":"only more salt"}],"h":{"he":"מהם אבני בניין לשרירים?","ar":"ما اللبنات للعضلات؟","ru":"Что строит мышцы?","en":"What builds muscles?"},"y":{"he":"גוף צריך מגוון חומרים: חלבון לבנייה, ויטמינים ומינרלים לתפקוד, ומים.","ar":"يحتاج الجسم تنوعًا: بروتين للبناء وفيتامينات ومعادن للوظائف وماء.","ru":"Телу нужно разнообразие: белок для строения, витамины и минералы для работы, вода.","en":"The body needs variety: protein to build, vitamins and minerals to function, and water."}}]},{"id":"b4","grade":9,"t":{"he":"תורשה","ar":"الوراثة","ru":"Наследственность","en":"Heredity"},"pred":{"s":{"he":"איפה שמור המידע שקובע תכונות של יצור חי?","ar":"أين المعلومات التي تحدد صفات الكائن؟","ru":"Где хранится информация, определяющая признаки существа?","en":"Where is the information that determines a living thing's traits stored?"},"o":[{"he":"ב-DNA שבגרעין התא","ar":"في الـDNA في نواة الخلية","ru":"в ДНК в ядре клетки","en":"in the DNA in the cell nucleus"},{"he":"בקרום התא בלבד","ar":"في غشاء الخلية فقط","ru":"только в мембране клетки","en":"only in the cell membrane"},{"he":"באוויר","ar":"في الهواء","ru":"в воздухе","en":"in the air"},{"he":"באף אחד מהם","ar":"في أي منها","ru":"ни в чём из этого","en":"in none of these"}]},"lessons":[{"t":{"he":"DNA, גנים וכרומוזומים","ar":"DNA والجينات والصبغيات","ru":"ДНК, гены и хромосомы","en":"DNA, genes and chromosomes"},"phen":{"he":"כל התאים של הגוף מכילים את אותו מידע. איך הוא שמור?","ar":"كل خلايا الجسم تحتوي المعلومات نفسها. كيف تُحفظ؟","ru":"Все клетки тела содержат одну и ту же информацию. Как она хранится?","en":"All body cells hold the same information. How is it stored?"},"concept":{"he":"החומר התורשתי הוא DNA, בגרעין התא. מקטע DNA שמקודד לתכונה הוא גן. DNA ארוז בכרומוזומים. אצל האדם יש 46 כרומוזומים בתא גוף, ובתאי מין 23. בתא יש שני עותקים מכל גן, אחד מכל הורה. לימוד כללי בלבד, בלי מידע על משפחה אישית.","ar":"المادة الوراثية هي DNA في نواة الخلية. مقطع DNA يرمّز لصفة هو جين. يُعبّأ DNA في صبغيات. عند الإنسان 46 صبغيًا في خلية الجسم و23 في الخلايا الجنسية. في الخلية نسختان من كل جين واحدة من كل والد. تعلّم عام دون معلومات عن العائلة الشخصية.","ru":"Наследственный материал — ДНК в ядре клетки. Участок ДНК, кодирующий признак, — ген. ДНК упакована в хромосомы. У человека 46 хромосом в клетке тела и 23 в половых клетках. В клетке по две копии каждого гена, по одной от каждого родителя. Изучаем в общем виде, без личных данных семьи.","en":"The genetic material is DNA, in the cell nucleus. A DNA segment coding for a trait is a gene. DNA is packed into chromosomes. Humans have 46 chromosomes in a body cell and 23 in sex cells. A cell has two copies of each gene, one from each parent. General learning only, with no personal family info."},"steps":[{"he":"מציירים תא וגרעין.","ar":"نرسم خلية ونواة.","ru":"Рисуем клетку и ядро.","en":"Draw a cell and a nucleus."},{"he":"בתוך הגרעין מציירים כרומוזומים.","ar":"داخل النواة نرسم صبغيات.","ru":"Внутри ядра рисуем хромосомы.","en":"Inside the nucleus draw chromosomes."},{"he":"מסמנים על כרומוזום מקטע אחד כגן.","ar":"نعلّم على صبغي مقطعًا كجين.","ru":"Отмечаем на хромосоме один участок как ген.","en":"Mark one segment on a chromosome as a gene."}],"qs":[{"lv":1,"s":{"he":"מה זה גן?","ar":"ما هو الجين؟","ru":"Что такое ген?","en":"What is a gene?"},"o":[{"he":"מקטע DNA שקובע תכונה","ar":"مقطع DNA يحدد صفة","ru":"участок ДНК, определяющий признак","en":"a DNA segment that determines a trait"},{"he":"סוג של תא","ar":"نوع من الخلايا","ru":"вид клетки","en":"a kind of cell"},{"he":"חלק מהעין","ar":"جزء من العين","ru":"часть глаза","en":"part of the eye"},{"he":"אנזים בקיבה","ar":"إنزيم في المعدة","ru":"фермент в желудке","en":"an enzyme in the stomach"}],"h":{"he":"מה נמצא על הכרומוזום?","ar":"ماذا على الصبغي؟","ru":"Что находится на хромосоме?","en":"What is found on a chromosome?"},"y":{"he":"גן הוא יחידה בתוך DNA שמקודדת לתכונה.","ar":"الجين وحدة في DNA ترمّز لصفة.","ru":"Ген — единица ДНК, кодирующая признак.","en":"A gene is a unit within DNA that codes for a trait."}},{"lv":2,"s":{"he":"כמה כרומוזומים יש בתא גוף רגיל של אדם?","ar":"كم صبغيًا في خلية جسم عادية للإنسان؟","ru":"Сколько хромосом в обычной клетке тела человека?","en":"How many chromosomes in a typical human body cell?"},"o":[{"he":"46","ar":"46","ru":"46","en":"46"},{"he":"23","ar":"23","ru":"23","en":"23"},{"he":"92","ar":"92","ru":"92","en":"92"},{"he":"10","ar":"10","ru":"10","en":"10"}],"h":{"he":"כמה בתא מין ומה בתא רגיל?","ar":"كم في خلية جنسية وكم في العادية؟","ru":"Сколько в половой и сколько в обычной клетке?","en":"How many in a sex cell and in a regular cell?"},"y":{"he":"בתא גוף 46, ובתא מין חצי מהם, 23.","ar":"في خلية الجسم 46 وفي الجنسية نصفها 23.","ru":"В клетке тела 46, в половой — половина, 23.","en":"A body cell has 46 and a sex cell half of that, 23."}}]},{"t":{"he":"העברת תכונות","ar":"انتقال الصفات","ru":"Передача признаков","en":"Passing on traits"},"phen":{"he":"תכונות כמו סוג קבוצת דם עוברות מדור לדור. איך?","ar":"صفات مثل فصيلة الدم تنتقل من جيل لجيل. كيف؟","ru":"Признаки вроде группы крови передаются из поколения в поколение. Как?","en":"Traits like blood type pass between generations. How?"},"concept":{"he":"מכל הורה מתקבל עותק אחד של כל גן, דרך תא מין. גרסאות שונות של גן נקראות אללים. אלל שולט (דומיננטי) בא לידי ביטוי גם בעותק אחד, ואלל רצסיבי רק כששני העותקים רצסיביים. גם הסביבה משפיעה על תכונות. נלמד בדוגמאות כלליות.","ar":"من كل والد تصل نسخة واحدة من كل جين عبر خلية جنسية. الصور المختلفة للجين تسمى أليلات. الأليل السائد يظهر حتى بنسخة واحدة والمتنحي لا يظهر إلا إذا كانت النسختان متنحيتين. والبيئة تؤثر أيضًا في الصفات. ندرس أمثلة عامة.","ru":"От каждого родителя приходит по одной копии каждого гена через половую клетку. Разные варианты гена — аллели. Доминантный аллель проявляется и в одной копии, рецессивный — только если обе копии рецессивные. На признаки влияет и среда. Разбираем общие примеры.","en":"From each parent one copy of every gene arrives through a sex cell. Different versions of a gene are alleles. A dominant allele shows even with one copy, and a recessive one only when both copies are recessive. Environment also affects traits. We study general examples."},"steps":[{"he":"כותבים אלל שולט באות גדולה ורצסיבי באות קטנה.","ar":"نكتب الأليل السائد بحرف كبير والمتنحي بحرف صغير.","ru":"Пишем доминантный аллель заглавной буквой, рецессивный — строчной.","en":"Write a dominant allele as a capital and a recessive as a lowercase letter."},{"he":"משלבים אלל אחד מכל הורה בטבלת הצלבה.","ar":"نجمع أليلًا من كل والد في جدول تهجين.","ru":"Сочетаем по аллелю от каждого родителя в таблице.","en":"Combine one allele from each parent in a cross table."},{"he":"קובעים איזו תכונה תופיע בכל שילוב.","ar":"نحدّد أي صفة تظهر في كل تركيب.","ru":"Определяем, какой признак проявится в каждом сочетании.","en":"Decide which trait shows in each combination."}],"qs":[{"lv":1,"s":{"he":"מה זה אלל?","ar":"ما الأليل؟","ru":"Что такое аллель?","en":"What is an allele?"},"o":[{"he":"גרסה של גן","ar":"صورة من جين","ru":"вариант гена","en":"a version of a gene"},{"he":"סוג מזון","ar":"نوع غذاء","ru":"вид пищи","en":"a kind of food"},{"he":"חלק מהלב","ar":"جزء من القلب","ru":"часть сердца","en":"part of the heart"},{"he":"כלי מדידה","ar":"أداة قياس","ru":"прибор для измерения","en":"a measuring tool"}],"h":{"he":"האם לכל הגנים יש אותה גרסה אצל כולם?","ar":"هل لجميع الناس النسخة نفسها؟","ru":"Одинаков ли вариант гена у всех?","en":"Is the gene version the same in everyone?"},"y":{"he":"אלל הוא גרסה אחת של גן, וליצורים שונים יש גרסאות שונות.","ar":"الأليل صورة من الجين ولكائنات مختلفة صور مختلفة.","ru":"Аллель — вариант гена, у разных существ варианты разные.","en":"An allele is one version of a gene, and different individuals can have different versions."}},{"lv":2,"s":{"he":"אצל אפונה גבוהה (T) שולטת על נמוכה (t). איזו תכונה תהיה לצמח Tt?","ar":"عند البازلاء الطويلة (T) سائدة على القصيرة (t). أي صفة للنبتة Tt؟","ru":"У гороха высокий (T) доминирует над низким (t). Какой признак у растения Tt?","en":"In peas tall (T) dominates short (t). What trait does a Tt plant show?"},"o":[{"he":"גבוה","ar":"طويل","ru":"высокий","en":"tall"},{"he":"נמוך","ar":"قصير","ru":"низкий","en":"short"},{"he":"בינוני","ar":"متوسط","ru":"средний","en":"medium"},{"he":"אין תכונה","ar":"لا صفة","ru":"признака нет","en":"no trait"}],"h":{"he":"איזה אלל שולט?","ar":"أي أليل سائد؟","ru":"Какой аллель доминирует?","en":"Which allele dominates?"},"y":{"he":"אלל שולט בא לידי ביטוי גם בעותק אחד, ולכן Tt גבוה.","ar":"الأليل السائد يظهر بنسخة واحدة لذلك Tt طويل.","ru":"Доминантный аллель проявляется и в одной копии, поэтому Tt высокий.","en":"A dominant allele shows with one copy, so Tt is tall."}}]}],"practice":[{"lv":1,"s":{"he":"מי נותן לילד את הגנים?","ar":"من يعطي الطفل الجينات؟","ru":"Кто передаёт ребёнку гены?","en":"Who gives a child its genes?"},"o":[{"he":"שני ההורים, חצי מכל אחד","ar":"الوالدان نصف من كل منهما","ru":"оба родителя, по половине","en":"both parents, half from each"},{"he":"האם בלבד","ar":"الأم فقط","ru":"только мать","en":"only the mother"},{"he":"האב בלבד","ar":"الأب فقط","ru":"только отец","en":"only the father"},{"he":"הסביבה בלבד","ar":"البيئة فقط","ru":"только среда","en":"only the environment"}],"h":{"he":"כמה כרומוזומים מכל הורה?","ar":"كم صبغيًا من كل والد؟","ru":"Сколько хромосом от каждого родителя?","en":"How many chromosomes from each parent?"},"y":{"he":"הילד מקבל 23 כרומוזומים מכל הורה, חצי מהגנים מכל אחד.","ar":"يحصل الطفل على 23 صبغيًا من كل والد.","ru":"Ребёнок получает 23 хромосомы от каждого родителя.","en":"A child gets 23 chromosomes from each parent."}},{"lv":1,"s":{"he":"איפה נמצא ה-DNA בתא של אדם?","ar":"أين يوجد الـDNA في خلية الإنسان؟","ru":"Где находится ДНК в клетке человека?","en":"Where is DNA in a human cell?"},"o":[{"he":"בגרעין","ar":"في النواة","ru":"в ядре","en":"in the nucleus"},{"he":"בקרום","ar":"في الغشاء","ru":"в мембране","en":"in the membrane"},{"he":"בדופן התא","ar":"في الجدار الخلوي","ru":"в клеточной стенке","en":"in the cell wall"},{"he":"אין DNA","ar":"لا DNA","ru":"ДНК нет","en":"there is no DNA"}],"h":{"he":"איפה \"מרכז הבקרה\" של התא?","ar":"أين «مركز التحكم» في الخلية؟","ru":"Где «центр управления» клетки?","en":"Where is the cell's \"control center\"?"},"y":{"he":"החומר התורשתי נמצא בגרעין, ארוז בכרומוזומים.","ar":"المادة الوراثية في النواة معبّأة في صبغيات.","ru":"Наследственный материал в ядре, упакован в хромосомы.","en":"The genetic material is in the nucleus, packed in chromosomes."}},{"lv":2,"s":{"he":"צמח צמח בצל ונראה חיוור. איזה גורם משפיע על תכונה, לא רק הגנים?","ar":"نبتة نمت في الظل وبدت شاحبة. أي عامل يؤثر في الصفة وليس الجينات فقط؟","ru":"Растение выросло в тени и бледное. Какой фактор влияет на признак, помимо генов?","en":"A plant grew in shade and looks pale. Which factor affects a trait besides genes?"},"o":[{"he":"הסביבה, כמו אור","ar":"البيئة مثل الضوء","ru":"среда, например свет","en":"the environment, such as light"},{"he":"אין גורם נוסף","ar":"لا عامل آخر","ru":"других факторов нет","en":"there is no other factor"},{"he":"רק מזל","ar":"الحظ فقط","ru":"только удача","en":"only luck"},{"he":"השם של הצמח","ar":"اسم النبتة","ru":"название растения","en":"the plant's name"}],"h":{"he":"מה חסר לצמח בצל?","ar":"ماذا ينقص النبتة في الظل؟","ru":"Чего не хватает растению в тени?","en":"What does a shaded plant lack?"},"y":{"he":"תכונות מושפעות מגנים וגם מהסביבה.","ar":"الصفات تتأثر بالجينات وبالبيئة.","ru":"Признаки зависят и от генов, и от среды.","en":"Traits depend on genes and on the environment."}},{"lv":2,"s":{"he":"שני צמחים Tt מוצלבים. איזה אחוז מהצאצאים צפוי להיות נמוך (tt)?","ar":"تهجين نبتتين Tt. ما نسبة النسل المتوقعة القصيرة (tt)؟","ru":"Скрещены два растения Tt. Какая доля потомков ожидается низкой (tt)?","en":"Two Tt plants are crossed. What share of offspring is expected to be short (tt)?"},"o":[{"he":"כרבע","ar":"حوالي الربع","ru":"около четверти","en":"about a quarter"},{"he":"חצי","ar":"النصف","ru":"половина","en":"half"},{"he":"כולם","ar":"الجميع","ru":"все","en":"all of them"},{"he":"אף אחד","ar":"لا أحد","ru":"никто","en":"none"}],"h":{"he":"כמה אפשרויות יש בטבלת ההצלבה?","ar":"كم احتمالًا في جدول التهجين؟","ru":"Сколько вариантов в таблице скрещивания?","en":"How many cells in the cross table?"},"y":{"he":"בטבלה 4 שילובים: TT, Tt, Tt, tt. רק אחד מהם נמוך, כלומר כרבע.","ar":"في الجدول 4 تراكيب: TT وTt وTt وtt. واحد فقط قصير أي الربع.","ru":"В таблице 4 сочетания: TT, Tt, Tt, tt. Только одно низкое — четверть.","en":"The table has 4 combos: TT, Tt, Tt, tt. Only one is short, so a quarter."}},{"lv":3,"s":{"he":"תלמיד אומר: \"תכונה נקבעת רק מהגנים\". איך מעריכים?","ar":"يقول طالب: «الصفة تُحدَّد بالجينات فقط». كيف نقيّم؟","ru":"Ученик говорит: «признак определяется только генами». Как оценить?","en":"A student says: \"a trait is set by genes only.\" How do we evaluate?"},"o":[{"he":"זה לא מדויק, גם הסביבה משפיעה, למשל תזונה ואור","ar":"هذا غير دقيق فللبيئة أثر مثل التغذية والضوء","ru":"это неточно, влияет и среда, например питание и свет","en":"it is not accurate, environment also matters, such as nutrition and light"},{"he":"זה נכון תמיד","ar":"صحيح دائمًا","ru":"верно всегда","en":"it is always true"},{"he":"הסביבה קובעת הכול","ar":"البيئة تحدد كل شيء","ru":"среда определяет всё","en":"the environment decides everything"},{"he":"הגנים לא משפיעים","ar":"الجينات لا تؤثر","ru":"гены не влияют","en":"genes have no effect"}],"h":{"he":"איזה גורם משפיע על גובה לצד הגנים?","ar":"أي عامل يؤثر في الطول إلى جانب الجينات؟","ru":"Что влияет на рост кроме генов?","en":"What affects height besides genes?"},"y":{"he":"טענה חד צדדית מתעלמת מראיות. תכונות רבות תלויות בגנים ובסביבה יחד.","ar":"الادعاء أحادي الجانب يتجاهل أدلة. كثير من الصفات تعتمد على الجينات والبيئة معًا.","ru":"Однобокое утверждение игнорирует факты. Многие признаки зависят и от генов, и от среды.","en":"A one-sided claim ignores evidence. Many traits depend on genes and environment together."}},{"lv":3,"s":{"he":"לאדם יש גן אחד לכל תכונה? או שניים? ולמה זה חשוב?","ar":"هل للإنسان جين واحد لكل صفة أم اثنان؟ ولماذا يهم؟","ru":"Один ген на признак у человека или два? И почему это важно?","en":"Does a person have one gene per trait or two? And why does it matter?"},"o":[{"he":"שני עותקים, אחד מכל הורה, ולכן אלל רצסיבי יכול להיסתר","ar":"نسختان واحدة من كل والد لذلك قد يختبئ الأليل المتنحي","ru":"две копии, по одной от родителя, поэтому рецессивный аллель может быть скрыт","en":"two copies, one from each parent, so a recessive allele can stay hidden"},{"he":"עותק אחד בלבד","ar":"نسخة واحدة فقط","ru":"только одна копия","en":"only one copy"},{"he":"שלושה עותקים","ar":"ثلاث نسخ","ru":"три копии","en":"three copies"},{"he":"אין עותקים","ar":"لا نسخ","ru":"копий нет","en":"no copies"}],"h":{"he":"מי תורם עותק לכל גן?","ar":"من يساهم بنسخة لكل جين؟","ru":"Кто даёт копию каждого гена?","en":"Who contributes a copy of each gene?"},"y":{"he":"שני עותקים מסבירים איך תכונה יכולה להיעלם בדור אחד ולהופיע בדור הבא.","ar":"نسختان تفسران كيف تختفي صفة في جيل وتظهر في التالي.","ru":"Две копии объясняют, как признак исчезает в одном поколении и появляется в следующем.","en":"Two copies explain how a trait can vanish in one generation and reappear in the next."}}]},{"id":"b5","grade":9,"t":{"he":"אנרגיה במערכות","ar":"الطاقة في الأنظمة","ru":"Энергия в системах","en":"Energy in systems"},"pred":{"s":{"he":"מה היחידה למדידת אנרגיה?","ar":"ما وحدة قياس الطاقة؟","ru":"Какая единица измерения энергии?","en":"What is the unit of energy?"},"o":[{"he":"ג׳אול (J)","ar":"جول (J)","ru":"джоуль (Дж)","en":"joule (J)"},{"he":"מטר","ar":"متر","ru":"метр","en":"meter"},{"he":"קילוגרם","ar":"كيلوغرام","ru":"килограмм","en":"kilogram"},{"he":"שנייה","ar":"ثانية","ru":"секунда","en":"second"}]},"lessons":[{"t":{"he":"אנרגיית גובה ואנרגיית תנועה","ar":"طاقة الارتفاع وطاقة الحركة","ru":"Энергия высоты и энергия движения","en":"Height energy and motion energy"},"phen":{"he":"רכבת הרים עולה לאט למעלה ואז יורדת מהר. מה קורה לאנרגיה?","ar":"قطار الملاهي يصعد ببطء ثم ينزل بسرعة. ماذا يحدث للطاقة؟","ru":"Американские горки медленно поднимаются, затем быстро спускаются. Что с энергией?","en":"A roller coaster climbs slowly then drops fast. What happens to the energy?"},"concept":{"he":"גוף גבוה בעל אנרגיית גובה, וככל שהוא גבוה או כבד יותר היא גדולה יותר. גוף נע בעל אנרגיית תנועה, וככל שהוא מהיר או כבד יותר היא גדולה יותר. בנפילה אנרגיית גובה הופכת לאנרגיית תנועה, וסכום האנרגיות נשמר פרט לחיכוך שמוסיף חום.","ar":"الجسم المرتفع لديه طاقة ارتفاع وكلما كان أعلى أو أثقل زادت. الجسم المتحرك لديه طاقة حركة وكلما كان أسرع أو أثقل زادت. في السقوط تتحول طاقة الارتفاع إلى حركة ومجموع الطاقات محفوظ ما عدا الاحتكاك الذي يضيف حرارة.","ru":"У высоко поднятого тела есть энергия высоты, она больше, если тело выше или тяжелее. У движущегося тела есть энергия движения, она больше, если оно быстрее или тяжелее. При падении энергия высоты переходит в энергию движения, сумма сохраняется, кроме трения, которое добавляет тепло.","en":"A high object has height energy, larger when it is higher or heavier. A moving object has motion energy, larger when it is faster or heavier. In a fall height energy becomes motion energy, and the total is conserved except for friction, which adds heat."},"steps":[{"he":"מזהים את הנקודה הגבוהה: הרבה אנרגיית גובה.","ar":"نحدّد النقطة العالية: طاقة ارتفاع كبيرة.","ru":"Находим высокую точку: много энергии высоты.","en":"Find the high point: lots of height energy."},{"he":"בירידה האנרגיה עוברת לתנועה.","ar":"في النزول تنتقل الطاقة إلى حركة.","ru":"При спуске энергия переходит в движение.","en":"On the way down the energy moves to motion."},{"he":"בקרקעית הכי מהיר: הכי הרבה אנרגיית תנועה.","ar":"في القاع الأسرع: أكبر طاقة حركة.","ru":"Внизу быстрее всего: больше всего энергии движения.","en":"At the bottom it is fastest: the most motion energy."}],"qs":[{"lv":1,"s":{"he":"איפה לרכבת ההרים הכי הרבה אנרגיית גובה?","ar":"أين لقطار الملاهي أكبر طاقة ارتفاع؟","ru":"Где у горок больше всего энергии высоты?","en":"Where does the coaster have the most height energy?"},"o":[{"he":"בנקודה הגבוהה ביותר","ar":"في أعلى نقطة","ru":"в самой высокой точке","en":"at the highest point"},{"he":"בנקודה הנמוכה ביותר","ar":"في أدنى نقطة","ru":"в самой низкой точке","en":"at the lowest point"},{"he":"בכל מקום שווה","ar":"متساوية في كل مكان","ru":"везде одинаково","en":"equal everywhere"},{"he":"אין אנרגיית גובה","ar":"لا طاقة ارتفاع","ru":"энергии высоты нет","en":"there is none"}],"h":{"he":"איפה הכי גבוה?","ar":"أين الأعلى؟","ru":"Где выше всего?","en":"Where is it highest?"},"y":{"he":"אנרגיית גובה גדלה עם הגובה.","ar":"طاقة الارتفاع تزداد مع الارتفاع.","ru":"Энергия высоты растёт с высотой.","en":"Height energy grows with height."}},{"lv":2,"s":{"he":"למה הרכבת מהירה בקרקעית?","ar":"لماذا القطار سريع في القاع؟","ru":"Почему вагон быстрее внизу?","en":"Why is the coaster fastest at the bottom?"},"o":[{"he":"אנרגיית הגובה הפכה לאנרגיית תנועה","ar":"تحوّلت طاقة الارتفاع إلى طاقة حركة","ru":"энергия высоты перешла в энергию движения","en":"height energy turned into motion energy"},{"he":"היא נהיית קלה","ar":"يصير أخف","ru":"он становится легче","en":"it gets lighter"},{"he":"האנרגיה נעלמה","ar":"اختفت الطاقة","ru":"энергия исчезла","en":"the energy vanished"},{"he":"הרוח דוחפת אותה","ar":"الريح تدفعه","ru":"ветер толкает","en":"wind pushes it"}],"h":{"he":"לאן הלכה אנרגיית הגובה?","ar":"إلى أين ذهبت طاقة الارتفاع؟","ru":"Куда ушла энергия высоты?","en":"Where did the height energy go?"},"y":{"he":"בנפילה אנרגיית הגובה עוברת לתנועה.","ar":"في السقوط تنتقل طاقة الارتفاع إلى حركة.","ru":"При спуске энергия высоты переходит в движение.","en":"In the drop height energy becomes motion energy."}}]},{"t":{"he":"הספק ונצילות","ar":"الاستطاعة والكفاءة","ru":"Мощность и КПД","en":"Power and efficiency"},"phen":{"he":"שתי נורות נותנות אור, אחת 60 וואט ואחת 10 וואט. מה ההבדל?","ar":"لمبتان تعطيان ضوءًا واحدة 60 واط وأخرى 10 واط. ما الفرق؟","ru":"Две лампы светят, одна 60 Вт, другая 10 Вт. В чём разница?","en":"Two bulbs give light, one 60 watts and one 10 watts. What is the difference?"},"concept":{"he":"הספק הוא כמה אנרגיה מכשיר צורך או ממיר בכל שנייה, ביחידות וואט (W). נצילות היא החלק מהאנרגיה שהופך לצורה שרוצים. בנורת להט חלק גדול הופך לחום, ובנורת לד נצילות גבוהה יותר. נצילות גבוהה חוסכת אנרגיה וכסף.","ar":"الاستطاعة هي مقدار الطاقة التي يستهلكها الجهاز أو يحوّلها في كل ثانية بوحدة واط (W). الكفاءة هي الجزء من الطاقة الذي يتحول إلى الشكل المطلوب. في المصباح المتوهج جزء كبير يتحول إلى حرارة وفي مصباح LED كفاءة أعلى. الكفاءة العالية توفر الطاقة والمال.","ru":"Мощность — сколько энергии прибор потребляет или преобразует за секунду, в ваттах (Вт). КПД — доля энергии, перешедшая в нужную форму. В лампе накаливания много уходит в тепло, а у светодиодной КПД выше. Высокий КПД экономит энергию и деньги.","en":"Power is how much energy a device uses or converts each second, in watts (W). Efficiency is the part of the energy that becomes the wanted form. In an incandescent bulb much turns into heat, and an LED is more efficient. High efficiency saves energy and money."},"steps":[{"he":"קוראים את ההספק על המכשיר.","ar":"نقرأ الاستطاعة على الجهاز.","ru":"Читаем мощность на приборе.","en":"Read the power on the device."},{"he":"שואלים כמה מהאנרגיה הולכת למטרה וכמה לחום.","ar":"نسأل كم من الطاقة للغرض وكم للحرارة.","ru":"Спрашиваем, сколько энергии идёт на цель, сколько в тепло.","en":"Ask how much goes to the goal and how much to heat."},{"he":"משווים בין שני מכשירים.","ar":"نقارن بين جهازين.","ru":"Сравниваем два прибора.","en":"Compare two devices."}],"qs":[{"lv":1,"s":{"he":"באיזו יחידה נמדד הספק?","ar":"بأي وحدة تُقاس الاستطاعة؟","ru":"В какой единице измеряют мощность?","en":"In which unit is power measured?"},"o":[{"he":"וואט","ar":"واط","ru":"ватт","en":"watt"},{"he":"ג׳אול","ar":"جول","ru":"джоуль","en":"joule"},{"he":"מטר","ar":"متر","ru":"метр","en":"meter"},{"he":"מעלה","ar":"درجة","ru":"градус","en":"degree"}],"h":{"he":"כמה אנרגיה בכל שנייה?","ar":"كم طاقة في كل ثانية؟","ru":"Сколько энергии за секунду?","en":"How much energy per second?"},"y":{"he":"הספק הוא אנרגיה לשנייה, ביחידות וואט.","ar":"الاستطاعة طاقة في الثانية بوحدة واط.","ru":"Мощность — энергия в секунду, в ваттах.","en":"Power is energy per second, in watts."}},{"lv":2,"s":{"he":"נורה אחת מנצלת 20% מהאנרגיה לאור, ואחרת 80%. איזו יעילה יותר?","ar":"لمبة تستغل 20% من الطاقة للضوء وأخرى 80%. أيها أكفأ؟","ru":"Одна лампа превращает в свет 20% энергии, другая 80%. Какая эффективнее?","en":"One bulb turns 20% of energy into light and another 80%. Which is more efficient?"},"o":[{"he":"זו שמנצלת 80%","ar":"التي تستغل 80%","ru":"та, что даёт 80%","en":"the one using 80%"},{"he":"זו שמנצלת 20%","ar":"التي تستغل 20%","ru":"та, что даёт 20%","en":"the one using 20%"},{"he":"שתיהן שוות","ar":"متساويتان","ru":"обе равны","en":"both are equal"},{"he":"אי אפשר לדעת","ar":"لا يمكن المعرفة","ru":"узнать нельзя","en":"cannot be known"}],"h":{"he":"איזו שולחת פחות חום לחינם?","ar":"أيهما ترسل حرارة أقل بلا فائدة؟","ru":"Какая теряет меньше тепла впустую?","en":"Which wastes less heat?"},"y":{"he":"נצילות גבוהה אומרת שחלק גדול מהאנרגיה הופך לאור ופחות הולך לחום.","ar":"الكفاءة العالية تعني أن جزءًا كبيرًا يتحول إلى ضوء وأقل إلى حرارة.","ru":"Высокий КПД значит, что большая часть идёт в свет и меньше — в тепло.","en":"High efficiency means more energy becomes light and less becomes heat."}}]}],"practice":[{"lv":1,"s":{"he":"מה יש לגוף מהיר שנע?","ar":"ماذا لدى جسم سريع يتحرك؟","ru":"Что есть   try{

    var v=femaleVoice(code),segs=segments(String(text));
    try{speechSynthesis.cancel()}catch(e){}
    (function sayseg(k){
      if(my!==_gen)return;
      if(k>=segs.length){done&&done();return}
      var u=new SpeechSynthesisUtterance(segs[k].text);
      u.lang=code;u.rate=0.95*state.rate;u.volume=1;
      if(v){try{u.voice=v}catch(e2){}}
      _liveU=u;
      u.onend=function(){if(my!==_gen)return;
        if(k+1<segs.length)setTimeout(function(){sayseg(k+1)},SEG_GAP);else done&&done()};
      u.onerror=function(){if(my!==_gen)return;done&&done()};
      speechSynthesis.speak(u);
    })(0);
  }catch(e){done&&done()}
}
function hlClear(){var a=document.querySelectorAll(".say.hl");for(var i=0;i<a.length;i++)a[i].classList.remove("hl")}
function stopSpeak(){_gen++;try{if(window.RECORDED)RECORDED.stop()}catch(e){}try{speechSynthesis.cancel()}catch(e){}hlClear()}
/* עוזבים את הדף — הקול נעצר. בלעדיו הוא ממשיך ברקע אחרי מעבר לטאב
   אחר, ולפעמים נתקע עד סגירת הדפדפן. */
try{document.addEventListener("visibilitychange",function(){
  if(document.hidden)stopSpeak();
});}catch(e){}
/* iOS לא ישמיע כלום עד שאמירה אחת יצאה מתוך handler של מגע אמיתי.
   אמירה שיוצאת אחרי המתנה נבלעת בשקט — בלי חריגה ובלי לוג. משחררים
   פעם אחת עם אמירה ריקה. קריאה ישירה, בלי המתנה לרשימת הקולות:
   הבטחה שוברת את שרשרת המגע ו-Safari כבר לא מזהה אותה כיוזמת משתמש.
   /speech/recorded.js משחרר את אלמנט השמע שלו לבד, לא את speechSynthesis. */
try{document.addEventListener("pointerdown",function(){
  try{speechSynthesis.speak(new SpeechSynthesisUtterance(""))}catch(e){}
},{once:true});}catch(e){}
function speakOne(text,lang,el,done){
  var my=_gen;hlClear();if(el)el.classList.add("hl");
  var fin=function(){if(my!==_gen)return;if(el)el.classList.remove("hl");done&&done()};
  if(window.RECORDED&&RECORDED.play(text,lang,{rate:state.rate,onEnd:fin,onError:function(){if(my===_gen)deviceSpeak(text,lang,fin)}}))return;
  deviceSpeak(text,lang,fin);
}
function sayEl(el){stopSpeak();speakOne(el.getAttribute("data-say"),state.lang,el)}
function readScreen(){
  stopSpeak();var my=_gen;
  var els=[].slice.call(document.querySelectorAll("#app [data-say]"));
  (function go(i){if(my!==_gen||i>=els.length)return;speakOne(els[i].getAttribute("data-say"),state.lang,els[i],function(){go(i+1)})})(0);
}
function S(text,tag,cls){return "<"+(tag||"p")+' class="say '+(cls||"")+'" data-say="'+esc(text)+'">'+esc(text)+"</"+(tag||"p")+">"}
function readBar(){
  return '<div class="read"><button class="btn play" data-a="read">▶ '+esc(t("listen"))+'</button>'+
   '<button class="btn slow" data-a="slow" aria-pressed="'+(state.rate<1)+'">🐢 '+esc(t("slow"))+'</button>'+
   '<button class="btn stop" data-a="stop">■ '+esc(t("stop"))+'</button></div>';
}
function hashN(s){var h=7;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)}
function order(qid){var o=[0,1,2,3],h=hashN(qid+"|"+view.round);for(var i=3;i>0;i--){var j=h%(i+1);h=Math.floor(h/(i+1))+7;var x=o[i];o[i]=o[j];o[j]=x}return o}
function renderQuestion(q,qid){Q_CUR={q:q,id:qid,key:qid+"|"+view.round,ord:order(qid),picked:{},done:false,hint:false,sol:false,msg:""};return qHTML()}
/* ציור מחדש של אותו מסך (גילוי שלב, החלפת שפה, שינוי תצוגה) אינו
   שאלה חדשה. בלי זה render() היה בונה Q_CUR נקי, והתשובה שנבחרה,
   הרמז וההסבר נעלמו מהמסך. שאלה הבאה מקדמת view.round, ולכן המפתח
   משתנה והשאלה כן נבנית מחדש — כולל סדר מסיחים חדש. */
function keepQ(q,qid){
  if(Q_CUR&&Q_CUR.key===qid+"|"+view.round&&Q_CUR.q===q)return qHTML();
  return renderQuestion(q,qid);
}
function qHTML(){
  var c=Q_CUR,q=c.q,h='<div class="card" id="qcard">'+S(L(q.s),"h2","");
  for(var k=0;k<4;k++){
    var i=c.ord[k],txt=L(q.o[i]);
    var cls="opt"+(c.picked[i]?(i===0?" right":" wrong"):"")+(c.done&&i===0?" right":"");
    h+='<div class="row"><button class="'+cls+'" data-a="pick" data-i="'+i+'"'+(c.done?" disabled":"")+'><span class="say" data-say="'+esc(txt)+'">'+esc(txt)+'</span></button>'+
       '<button class="spk" data-a="spk" aria-label="'+esc(t("listen"))+'">🔊</button></div>';
  }
  h+='<div class="read">';
  if(!c.done)h+='<button class="btn hintb" data-a="hint">💡 '+esc(t("hint"))+'</button>';
  h+='<button class="btn sol" data-a="sol">✔ '+esc(t("solution"))+'</button>';
  if(window.TUTOR&&TUTOR.on&&TUTOR.on())h+='<button class="btn" style="background:#7c3aed" data-a="tutor">'+esc(TUTOR.label())+'</button>';
  h+='</div>';
  if(c.hint)h+='<div class="hintbox">'+S(L(q.h),"p","")+'</div>';
  if(c.msg)h+='<p class="note" role="status">'+esc(c.msg)+'</p>';
  if(c.done||c.sol)h+='<div class="solbox">'+S(t("gotIt"),"p","")+S(L(q.y),"p","")+'</div><div class="read"><button class="btn" data-a="qnext">'+esc(t("next"))+' ›</button></div>';
  return h+"</div>";
}
function dots(n,cur,doneFn){var h='<div class="dots" aria-hidden="true">';for(var i=0;i<n;i++)h+='<span class="dot'+(doneFn(i)?" on":"")+(i===cur?" cur":"")+'"></span>';return h+"</div>"}
function screenHome(){
  var h="<h1>"+esc(t("appName"))+"</h1>"+S(t("tag"),"p","note")+readBar()+'<div class="grades" role="group">';
  [7,8,9].forEach(function(g){h+='<button class="btn '+(state.grade===g?"":"ghost")+'" data-a="grade" data-g="'+g+'" aria-pressed="'+(state.grade===g)+'">'+esc(t("g"+g))+"</button>"});
  h+="</div>";
  UNITS.filter(function(u){return u.grade===state.grade}).forEach(function(u){
    var n=u.lessons.length,d=0;u.lessons.forEach(function(_,i){if(state.done[u.id+":"+i])d++});
    h+='<div class="card unit"><div><div class="tt say" data-say="'+esc(L(u.t))+'">'+esc(L(u.t))+'</div><div class="note">'+esc(t("lessons"))+": "+d+"/"+n+'</div></div>'+
       '<button class="btn" data-a="unit" data-u="'+u.id+'">'+esc(t("open"))+" ›</button></div>"
  });
  SOON.filter(function(s){return s.grade===state.grade}).forEach(function(s){
    h+='<div class="card unit soon"><div class="tt">'+esc(L(s.t))+'</div><span class="badge">'+esc(t("soon"))+"</span></div>"
  });
  if(!UNITS.some(function(u){return u.grade===state.grade}))h+=S(t("nothingYet"),"p","note");
  return h+'<p class="note">'+esc(t("labNote"))+"</p>";
}
function screenUnit(){
  var u=unit(view.u),h='<button class="btn ghost" data-a="home">‹ '+esc(t("home"))+"</button><h1>"+esc(L(u.t))+"</h1>"+readBar();
  h+='<div class="card">'+S(t("myIdea"),"p","note")+S(L(u.pred.s),"h2","");
  u.pred.o.forEach(function(o,i){var x=L(o);h+='<div class="row"><button class="opt'+(state.pred[u.id]===i?" right":"")+'" data-a="pred" data-i="'+i+'"><span class="say" data-say="'+esc(x)+'">'+esc(x)+'</span></button><button class="spk" data-a="spk" aria-label="'+esc(t("listen"))+'">🔊</button></div>'});
  h+="</div><h2>"+esc(t("unitMap"))+"</h2>";
  u.lessons.forEach(function(l,i){
    h+='<div class="card unit"><div><div class="tt say" data-say="'+esc(L(l.t))+'">'+(i+1)+". "+esc(L(l.t))+'</div>'+(state.done[u.id+":"+i]?'<span class="badge">'+esc(t("doneMark"))+'</span>':"")+'</div><button class="btn" data-a="lesson" data-l="'+i+'">'+esc(t("open"))+" ›</button></div>"
  });
  h+='<div class="card unit"><div class="tt">'+esc(t("practiceT"))+'</div><div class="read">';
  [1,2,3].forEach(function(lv){h+='<button class="btn" data-a="practice" data-lv="'+lv+'">'+esc(t("level"+lv))+"</button>"});
  h+="</div></div>";
  var p=state.pred[u.id];
  if(p!=null&&u.lessons.every(function(_,i){return state.done[u.id+":"+i]})){
    h+='<div class="card">'+S(t("myIdeaWas")+" "+L(u.pred.o[p]),"p","")+S(t("endNote"),"p","")+"</div>"}
  return h;
}
function screenLesson(){
  var u=unit(view.u),l=u.lessons[view.l];
  var h='<button class="btn ghost" data-a="unit" data-u="'+u.id+'">‹ '+esc(L(u.t))+"</button><h1>"+(view.l+1)+". "+esc(L(l.t))+"</h1>"+readBar();
  h+='<div class="card"><h2>'+esc(t("phenT"))+"</h2>"+S(L(l.phen))+"</div>";
  h+='<div class="card"><h2>'+esc(t("conceptT"))+"</h2>"+S(L(l.concept))+"</div>";
  h+='<div class="card"><h2>'+esc(t("stepsT"))+"</h2>";
  for(var i=0;i<=view.step&&i<l.steps.length;i++)h+='<div class="step">'+S((i+1)+". "+L(l.steps[i]))+"</div>";
  if(view.step<l.steps.length-1)h+='<button class="btn" data-a="stepnext">'+esc(t("showStep"))+"</button>";
  h+="</div><h2>"+esc(t("checkT"))+"</h2>"+keepQ(l.qs[view.qi%l.qs.length],u.id+"-L"+view.l+"-"+(view.qi%l.qs.length));
  h+='<div class="read"><button class="btn sol" data-a="lessondone">'+esc(t("doneL"))+"</button></div>";
  return h;
}
function screenPractice(){
  var u=unit(view.u),qs=u.practice.filter(function(q){return q.lv===view.lv}),i=view.qi%qs.length;
  var h='<button class="btn ghost" data-a="unit" data-u="'+u.id+'">‹ '+esc(L(u.t))+"</button><h1>"+esc(t("practiceT"))+": "+esc(t("level"+view.lv))+"</h1>"+readBar();
  h+=dots(qs.length,i,function(k){return !!state.done["q:"+u.id+"-P"+view.lv+"-"+k]});
  return h+keepQ(qs[i],u.id+"-P"+view.lv+"-"+i);
}
function screenSettings(){
  return '<button class="btn ghost" data-a="home">‹ '+esc(t("home"))+"</button><h1>"+esc(t("settings"))+"</h1>"+readBar()+'<div class="card"><div class="read">'+[["dark","dark"],["big","bigT"],["clear","clearT"],["spaced","spacedT"],["hc","hcT"],["rm","rmT"]].map(function(m){return '<button class="btn ghost" data-a="mode" data-m="'+m[0]+'" aria-pressed="'+!!state[m[0]]+'">'+esc(t(m[1]))+"</button>"}).join("")+"</div></div>"+S(t("mtNote"),"p","note")+S(t("credit"),"p","note");
}
function render(){
  var d=dirOf(state.lang);
  document.documentElement.lang=state.lang;document.documentElement.dir=d;document.body.setAttribute("dir",d);
  applyModes();
  document.getElementById("brand").textContent=t("appName");
  var lg=document.getElementById("lg"),h="";
  LANGS.forEach(function(x){h+='<button data-a="lang" data-l="'+x[0]+'" aria-pressed="'+(state.lang===x[0])+'" lang="'+x[0]+'">'+x[1]+"</button>"});
  h+='<button data-a="settings" aria-label="'+esc(t("settings"))+'">⚙</button>';lg.innerHTML=h;
  document.getElementById("foot").textContent=t("mtNote");
  document.getElementById("app").innerHTML=view.s==="unit"?screenUnit():view.s==="lesson"?screenLesson():view.s==="practice"?screenPractice():view.s==="settings"?screenSettings():screenHome();
  document.title=t("appName");
}
function applyModes(){
  var r=document.documentElement;
  r.setAttribute("data-theme",state.dark?"dark":"light");
  r.style.fontSize=state.big?"21px":"18px";
  r.classList.toggle("clear",!!state.clear);r.classList.toggle("spaced",!!state.spaced);
  r.classList.toggle("hc",!!state.hc);r.classList.toggle("rm",!!state.rm);
}
function go(s,o){stopSpeak();Q_CUR=null;view.s=s;for(var k in (o||{}))view[k]=o[k];render();window.scrollTo(0,0)}
function rerenderQ(){var c=document.getElementById("qcard");if(!c)return render();var d=document.createElement("div");d.innerHTML=qHTML();c.replaceWith(d.firstChild)}
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-a]");if(!b)return;var a=b.getAttribute("data-a");
  if(a==="lang"){stopSpeak();state.lang=b.getAttribute("data-l");save();render()}
  else if(a==="read")readScreen();
  else if(a==="stop")stopSpeak();
  else if(a==="slow"){state.rate=state.rate<1?1:0.7;save();b.setAttribute("aria-pressed",String(state.rate<1))}
  else if(a==="spk"){var el=b.parentNode.querySelector("[data-say]");if(el)sayEl(el)}
  else if(a==="grade"){state.grade=+b.getAttribute("data-g");save();render()}
  else if(a==="home")go("home");
  else if(a==="settings")go("settings");
  else if(a==="mode"){var m=b.getAttribute("data-m");state[m]=!state[m];save();render()}
  else if(a==="unit")go("unit",{u:b.getAttribute("data-u")});
  else if(a==="pred"){state.pred[view.u]=+b.getAttribute("data-i");save();render()}
  else if(a==="lesson")go("lesson",{l:+b.getAttribute("data-l"),step:0,qi:0,round:0});
  else if(a==="stepnext"){view.step++;render()}
  else if(a==="lessondone"){state.done[view.u+":"+view.l]=1;save();go("unit")}
  else if(a==="practice")go("practice",{lv:+b.getAttribute("data-lv"),qi:0,round:0});
  else if(a==="pick"){
    var i=+b.getAttribute("data-i"),c=Q_CUR;if(!c||c.done)return;
    c.picked[i]=1;
    if(i===0){c.done=true;c.msg="";state.done["q:"+c.id]=1;save()}else c.msg=t("tryAgain");
    stopSpeak();rerenderQ();
  }
  else if(a==="tutor"){stopSpeak();if(window.TUTOR)TUTOR.open()}
  else if(a==="hint"){if(!Q_CUR)return;Q_CUR.hint=true;rerenderQ()}
  else if(a==="sol"){if(!Q_CUR)return;Q_CUR.sol=true;Q_CUR.done=true;rerenderQ()}
  else if(a==="qnext"){view.qi++;view.round++;render();window.scrollTo(0,0)}
});
function tutorCtx(){
  var c=Q_CUR;if(!c||!c.q||view.s==="home"||view.s==="settings")return null;
  return {id:c.id,type:c.done?"reveal":"mcq",q:L(c.q.s),options:c.ord.map(function(i){return L(c.q.o[i])}),correct:c.done?L(c.q.o[0]):null,
    student:null,topic:unit(view.u)?L(unit(view.u).t):null,curriculum:"מדע וטכנולוגיה לחטיבה ז-ט"}
}
function boot(){
  load();render();
  try{if(window.RECORDED)RECORDED.setup({base:"audio"})}catch(e){}
  try{if("speechSynthesis" in window)speechSynthesis.getVoices()}catch(e){}
  try{if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js?v=scimid2-pwa1").catch(function(){})}catch(e){}
  if(window.TUTOR){
    var txt=TUTOR.plain;
    TUTOR.mount({app:"scimid",
      lang:function(){return state.lang},
      q:function(){var c=tutorCtx();if(!c)return null;return {expr:txt(c.q),ans:c.correct?txt(c.correct):null,topic:c.topic,level:c.q?t("level"+Q_CUR.q.lv):null}},
      stopHost:function(){stopSpeak()}});
    var ENG=window.BARAK||window.LIMOR;
    if(ENG)ENG.register({app:"scimid",
      getScreenContext:tutorCtx,
      actions:{
        read_aloud:{desc:"מקריא את המסך",run:function(){readScreen();return true}},
        show_hint:{desc:"מציג את הרמז לשאלה",run:function(){if(!Q_CUR||Q_CUR.done||view.s==="home")return false;Q_CUR.hint=true;rerenderQ();return true}},
        go_screen:{desc:"עובר למסך הבית",params:{name:{type:"string",enum:["home"],required:true}},run:function(){go("home");return true}}
      }});
  }
}
if(!INTERNAL_OK){document.getElementById("gate").hidden=false;document.title="לא פורסם"}else{boot()}
</script>
