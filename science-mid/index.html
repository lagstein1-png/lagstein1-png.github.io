:root{--bg:#f3f7f4;--card:#fff;--ink:#14231c;--mute:#4a5d54;--line:#cfe0d6;--g:#16a34a;--gd:#0f7a36;--r:#dc2626;--y:#fde047;--yi:#713f12;--b:#2563eb;--p:#7c3aed;--ok:#dcfce7;--hl:#fef08a}

*{box-sizing:border-box}
html{font-size:18px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,"Noto Sans Arabic","Noto Sans",system-ui,sans-serif;line-height:1.6}

main{max-width:760px;margin:0 auto;padding:12px 14px 90px}
header.top{display:flex;gap:4px 8px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--card);border-bottom:2px solid var(--line);position:sticky;top:0;z-index:20}
header.top .brand{font-weight:800;font-size:1.05rem}
.lg{display:flex;gap:4px;flex-wrap:nowrap}
.lg button{min-height:44px;min-width:44px;padding:4px 8px;font-size:.9rem;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.lg button[aria-pressed=true]{background:#1d4ed8;border-color:#1d4ed8;color:#fff}
h1{font-size:1.5rem;margin:.6rem 0}h2{font-size:1.2rem;margin:1rem 0 .4rem}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;margin:10px 0}
.read{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.btn{min-height:52px;padding:8px 18px;border-radius:16px;border:0;font:inherit;font-weight:800;font-size:1.05rem;cursor:pointer;color:#fff;background:#1d4ed8;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.play{background:#15803d;font-size:1.2rem;min-height:60px;padding-inline:24px}
.btn.stop{background:#b91c1c}.btn.slow{background:#6d28d9}.btn.hintb{background:var(--y);color:#713f12}.btn.sol{background:#0f7a36}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.btn[aria-pressed=true]{outline:4px solid var(--y)}
.btn:focus-visible,.opt:focus-visible,.spk:focus-visible,.lg button:focus-visible{outline:4px solid #f59e0b;outline-offset:2px}
.say{padding:2px 6px;border-radius:8px;transition:background .15s}.say.hl{background:var(--hl);color:var(--ink)}
.grades{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.unit{display:flex;gap:12px;align-items:center;justify-content:space-between}
.unit .tt{font-size:1.25rem;font-weight:800}
.unit.soon{opacity:.8}
.badge{display:inline-block;padding:2px 12px;border-radius:99px;background:var(--y);color:#713f12;font-weight:800;font-size:.9rem}
.row{display:flex;gap:8px;align-items:stretch;margin:8px 0}
.opt{flex:1;text-align:start;min-height:56px;padding:10px 14px;border-radius:16px;border:3px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:1.05rem;cursor:pointer}
.opt.right{border-color:#16a34a;background:var(--ok)}.opt.wrong{border-color:#f59e0b;opacity:.75}
.spk{min-width:56px;border-radius:16px;border:0;background:#15803d;color:#fff;font-size:1.3rem;cursor:pointer}
.hintbox{border:3px solid var(--y);background:color-mix(in srgb,var(--y) 25%,var(--card));border-radius:16px;padding:10px 14px;margin:8px 0}
.solbox{border:3px solid #16a34a;background:var(--ok);border-radius:16px;padding:10px 14px;margin:8px 0}
.dots{display:flex;gap:6px;margin:6px 0}.dot{width:14px;height:14px;border-radius:50%;background:var(--line)}.dot.on{background:#16a34a}.dot.cur{outline:3px solid #2563eb}
.note{color:var(--mute);font-size:.9rem}
.step{border-inline-start:6px solid #2563eb;padding:6px 12px;margin:8px 0;background:var(--card);border-radius:10px}
footer{max-width:760px;margin:0 auto;padding:10px 14px 40px}
#gate[hidden]{display:none!important}

:root.clear body{font-family:"Verdana","Tahoma","Heebo",sans-serif;letter-spacing:.012em}
:root.spaced body{word-spacing:.22em;line-height:1.95}
:root.hc{--bg:#fff;--card:#fff;--ink:#000;--mute:#1a1a1a;--line:#000}

:root.rm *{transition:none!important;animation:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

var UNITS=[{"id":"z0","grade":7,"t":{"he":"מתחילים לחקור בבטחה","ar":"نبدأ البحث بأمان","ru":"Начинаем исследовать безопасно","en":"Starting to investigate safely"},"pred":{"s":{"he":"אחרי שבוע, המים שבכוס שעמדה פתוחה על החלון נהיו פחות. לדעתי...","ar":"بعد أسبوع قلّ الماء في كوب مكشوف على الشباك. أظن أن...","ru":"Через неделю воды в открытом стакане на окне стало меньше. Я думаю...","en":"After a week, the water in an open glass on the window went down. I think..."},"o":[{"he":"המים התאדו לאוויר","ar":"الماء تبخّر إلى الهواء","ru":"вода испарилась в воздух","en":"the water evaporated into the air"},{"he":"הכוס שתתה את המים","ar":"الكوب شرب الماء","ru":"стакан выпил воду","en":"the glass drank the water"},{"he":"המים נעלמו לגמרי מהעולם","ar":"اختفى الماء من العالم تمامًا","ru":"вода совсем исчезла из мира","en":"the water vanished from the world"},{"he":"מישהו שפך אותם","ar":"شخص ما سكبه","ru":"кто-то её вылил","en":"someone poured it out"}]},"lessons":[{"t":{"he":"מה ראיתי ומה אני חושב","ar":"ماذا رأيت وماذا أظن","ru":"Что я видел и что я думаю","en":"What I saw and what I think"},"phen":{"he":"מורה שמה קובייה צבעונית בכוס מים. אחרי שעה, המים ליד הקובייה הפכו ירוקים.","ar":"وضع المعلّم مكعّبًا ملوّنًا في كوب ماء. بعد ساعة صار الماء قرب المكعّب أخضر.","ru":"Учитель положил цветной кубик в стакан с водой. Через час вода возле кубика стала зелёной.","en":"A teacher put a colored cube in a glass of water. After an hour, the water near the cube turned green."},"concept":{"he":"תצפית היא מה שאפשר לראות, לשמוע או למדוד. הסבר הוא מה שאנחנו חושבים על הסיבה. תצפית אפשר לבדוק. הסבר צריך ראיות.","ar":"الملاحظة هي ما يمكن أن نراه أو نسمعه أو نقيسه. التفسير هو ما نظنه عن السبب. الملاحظة يمكن فحصها. التفسير يحتاج إلى أدلة.","ru":"Наблюдение — это то, что можно увидеть, услышать или измерить. Объяснение — это то, что мы думаем о причине. Наблюдение можно проверить. Объяснению нужны доказательства.","en":"An observation is what you can see, hear or measure. An explanation is what you think the cause is. You can check an observation. An explanation needs evidence."},"steps":[{"he":"קוראים משפט אחד.","ar":"نقرأ جملة واحدة.","ru":"Читаем одно предложение.","en":"Read one sentence."},{"he":"שואלים: אפשר לראות או למדוד את זה?","ar":"نسأل: هل يمكن أن نراه أو نقيسه؟","ru":"Спрашиваем: это можно увидеть или измерить?","en":"Ask: can I see or measure this?"},{"he":"אם כן, זו תצפית. אם יש בו ״כי״ או ״בגלל״, זה הסבר.","ar":"إن كان نعم فهي ملاحظة. وإن فيها «لأن» فهي تفسير.","ru":"Если да, это наблюдение. Если есть «потому что», это объяснение.","en":"If yes, it is an observation. If it has \"because\", it is an explanation."}],"qs":[{"lv":1,"s":{"he":"איזה משפט הוא תצפית?","ar":"أي جملة هي ملاحظة؟","ru":"Какое предложение — наблюдение?","en":"Which sentence is an observation?"},"o":[{"he":"המים ליד הקובייה הפכו ירוקים.","ar":"صار الماء قرب المكعّب أخضر.","ru":"Вода возле кубика стала зелёной.","en":"The water near the cube turned green."},{"he":"הקובייה ממיסה צבע בגלל החום.","ar":"المكعّب يذيب اللون بسبب الحرارة.","ru":"Кубик растворяет краску из-за тепла.","en":"The cube dissolves color because of heat."},{"he":"המים רוצים להיות ירוקים.","ar":"الماء يريد أن يكون أخضر.","ru":"Вода хочет быть зелёной.","en":"The water wants to be green."},{"he":"הצבע חזק כי הקובייה גדולה.","ar":"اللون قوي لأن المكعّب كبير.","ru":"Цвет сильный, потому что кубик большой.","en":"The color is strong because the cube is big."}],"h":{"he":"חפשו משפט שאפשר לראות בעיניים, בלי ״כי״.","ar":"ابحثوا عن جملة يمكن رؤيتها بالعين، بدون «لأن».","ru":"Ищите предложение, которое можно увидеть глазами, без «потому что».","en":"Look for a sentence you can see with your eyes, with no \"because\"."},"y":{"he":"תצפית מתארת מה קרה. שאר המשפטים מסבירים למה, ולכן צריך ראיות כדי לדעת אם הם נכונים.","ar":"الملاحظة تصف ما حدث. أما الجمل الأخرى فتفسّر السبب، ولذلك نحتاج إلى أدلة لنعرف إن كانت صحيحة.","ru":"Наблюдение описывает, что произошло. Остальные предложения объясняют почему, и нужны доказательства, чтобы проверить их.","en":"An observation describes what happened. The other sentences explain why, so we need evidence to know if they are right."}},{"lv":2,"s":{"he":"ראית שעלה נושר מהעץ בסתיו. איזה משפט הוא הסבר?","ar":"رأيت ورقة تسقط من الشجرة في الخريف. أي جملة هي تفسير؟","ru":"Вы видели, как осенью лист падает с дерева. Какое предложение — объяснение?","en":"You saw a leaf fall from a tree in autumn. Which sentence is an explanation?"},"o":[{"he":"העלה נשר כי הימים התקצרו והעץ מתכונן לחורף.","ar":"سقطت الورقة لأن الأيام قصرت والشجرة تستعد للشتاء.","ru":"Лист упал, потому что дни стали короче и дерево готовится к зиме.","en":"The leaf fell because the days got shorter and the tree is preparing for winter."},{"he":"העלה צהוב וחום.","ar":"الورقة صفراء وبنية.","ru":"Лист жёлтый и коричневый.","en":"The leaf is yellow and brown."},{"he":"העלה נחת על הדשא.","ar":"هبطت الورقة على العشب.","ru":"Лист упал на траву.","en":"The leaf landed on the grass."},{"he":"יש הרבה עלים על הקרקע.","ar":"هناك أوراق كثيرة على الأرض.","ru":"На земле много листьев.","en":"There are many leaves on the ground."}],"h":{"he":"הסבר עונה על השאלה ״למה?״","ar":"التفسير يجيب عن سؤال «لماذا؟»","ru":"Объяснение отвечает на вопрос «почему?»","en":"An explanation answers \"why?\""},"y":{"he":"רק המשפט הראשון נותן סיבה. האחרים מתארים מה רואים.","ar":"الجملة الأولى فقط تعطي سببًا. الباقي يصف ما نراه.","ru":"Только первое предложение даёт причину. Остальные описывают то, что видно.","en":"Only the first sentence gives a cause. The others describe what you see."}}]},{"t":{"he":"בטיחות ותיעוד נתון","ar":"السلامة وتسجيل البيانات","ru":"Безопасность и запись данных","en":"Safety and recording data"},"phen":{"he":"בכיתה מחממים מים. תלמיד אחד רוצה להריח מקרוב, ואחר רוצה להרים את הכוס החמה ביד.","ar":"في الصف يسخّنون الماء. تلميذ يريد أن يشمّ عن قرب وآخر يريد رفع الكوب الساخن بيده.","ru":"В классе греют воду. Один ученик хочет понюхать вблизи, другой — взять горячий стакан рукой.","en":"In class, water is being heated. One student wants to smell it up close, another wants to lift the hot glass by hand."},"concept":{"he":"לפני ניסוי בודקים בטיחות. לובשים משקפי מגן, אוספים שיער, לא טועמים ולא מריחים ישר מהכלי. כשיש חימום או חשמל, מחכים למורה. כותבים נתון עם מספר ויחידה.","ar":"قبل التجربة نفحص السلامة. نلبس نظارات واقية ونجمع الشعر ولا نتذوّق ولا نشمّ مباشرة من الوعاء. عند التسخين أو الكهرباء ننتظر المعلّم. نكتب القياس برقم ووحدة.","ru":"Перед опытом проверяем безопасность. Надеваем защитные очки, убираем волосы, не пробуем на вкус и не нюхаем прямо из сосуда. При нагревании или электричестве ждём учителя. Данные записываем с числом и единицей.","en":"Before an experiment, check safety. Wear goggles, tie back hair, never taste, and do not sniff straight from the container. With heat or electricity, wait for the teacher. Write each result with a number and a unit."},"steps":[{"he":"עוצרים ושואלים: מה עלול להיות מסוכן?","ar":"نتوقف ونسأل: ما الخطر المحتمل؟","ru":"Останавливаемся и спрашиваем: что может быть опасно?","en":"Stop and ask: what could be dangerous?"},{"he":"בוחרים הגנה: משקפיים, שיער אסוף, מורה לידנו.","ar":"نختار الحماية: نظارات، شعر مجموع، المعلّم بجانبنا.","ru":"Выбираем защиту: очки, убранные волосы, учитель рядом.","en":"Pick protection: goggles, hair tied, teacher nearby."},{"he":"מודדים וכותבים: מספר ויחידה, למשל 24°C.","ar":"نقيس ونكتب: رقمًا ووحدة، مثل 24°C.","ru":"Измеряем и записываем: число и единица, например 24°C.","en":"Measure and write: a number and a unit, like 24°C."}],"qs":[{"lv":1,"s":{"he":"לפני שמחממים מים בניסוי בכיתה, מה עושים?","ar":"قبل تسخين الماء في تجربة بالصف، ماذا نفعل؟","ru":"Что делать перед нагреванием воды на опыте в классе?","en":"Before heating water in a class experiment, what do you do?"},"o":[{"he":"לובשים משקפי מגן ומחכים להנחיית המורה.","ar":"نلبس نظارات واقية وننتظر تعليمات المعلّم.","ru":"Надеваем защитные очки и ждём указаний учителя.","en":"Put on goggles and wait for the teacher's instructions."},{"he":"מתחילים מהר כדי לחסוך זמן.","ar":"نبدأ بسرعة لنوفّر الوقت.","ru":"Начинаем быстро, чтобы сэкономить время.","en":"Start fast to save time."},{"he":"מריחים את המים מקרוב.","ar":"نشمّ الماء عن قرب.","ru":"Нюхаем воду вблизи.","en":"Smell the water up close."},{"he":"נוגעים בכוס כדי לבדוק אם היא חמה.","ar":"نلمس الكوب لنرى إن كان ساخنًا.","ru":"Трогаем стакан, чтобы проверить, горячий ли он.","en":"Touch the glass to see if it is hot."}],"h":{"he":"חימום הוא מצב שבו צריך הגנה ומבוגר לידך.","ar":"التسخين حالة تحتاج إلى حماية وشخص بالغ بجانبك.","ru":"При нагревании нужны защита и взрослый рядом.","en":"Heating needs protection and an adult nearby."},"y":{"he":"חימום יכול לגרום כוויה או התזה. לכן מתכוננים ומחכים למורה.","ar":"التسخين قد يسبب حروقًا أو رذاذًا. لذلك نستعد وننتظر المعلّم.","ru":"Нагревание может вызвать ожог или брызги. Поэтому готовимся и ждём учителя.","en":"Heating can burn or splash. So we prepare and wait for the teacher."}},{"lv":2,"s":{"he":"מדדתם טמפרטורה וראיתם 24. איך כותבים את התוצאה בטבלה?","ar":"قست درجة الحرارة فرأيت 24. كيف تكتبون النتيجة في الجدول؟","ru":"Вы измерили температуру и увидели 24. Как записать результат в таблицу?","en":"You measured temperature and saw 24. How do you write the result in the table?"},"o":[{"he":"24 מעלות צלזיוס (°C)","ar":"24 درجة مئوية (°C)","ru":"24 градуса Цельсия (°C)","en":"24 degrees Celsius (°C)"},{"he":"24","ar":"24","ru":"24","en":"24"},{"he":"חם","ar":"ساخن","ru":"тепло","en":"warm"},{"he":"בערך כמו אתמול","ar":"تقريبًا مثل أمس","ru":"примерно как вчера","en":"about like yesterday"}],"h":{"he":"מה חסר למספר כדי שיהיה ברור מה נמדד?","ar":"ماذا ينقص الرقم ليكون واضحًا ما الذي قيس؟","ru":"Чего не хватает числу, чтобы было ясно, что измерили?","en":"What does the number need so it is clear what was measured?"},"y":{"he":"נתון מדעי כולל מספר ויחידה. בלי יחידה אי אפשר להשוות או לחזור על המדידה.","ar":"القياس العلمي فيه رقم ووحدة. بدون وحدة لا يمكن المقارنة أو إعادة القياس.","ru":"Научные данные — это число и единица. Без единицы нельзя сравнивать или повторить измерение.","en":"Scientific data has a number and a unit. Without a unit you cannot compare or repeat the measurement."}}]}],"practice":[{"lv":1,"s":{"he":"מה מבדיל תצפית מהסבר?","ar":"ما الفرق بين الملاحظة والتفسير؟","ru":"Чем наблюдение отличается от объяснения?","en":"How is an observation different from an explanation?"},"o":[{"he":"תצפית אפשר לראות או למדוד, והסבר אומר למה זה קרה.","ar":"الملاحظة يمكن رؤيتها أو قياسها، والتفسير يقول لماذا حدث.","ru":"Наблюдение можно увидеть или измерить, а объяснение говорит, почему это произошло.","en":"You can see or measure an observation, and an explanation says why it happened."},{"he":"אין הבדל.","ar":"لا فرق.","ru":"Разницы нет.","en":"There is no difference."},{"he":"הסבר תמיד נכון ותצפית תמיד שגויה.","ar":"التفسير دائمًا صحيح والملاحظة دائمًا خاطئة.","ru":"Объяснение всегда верно, а наблюдение всегда неверно.","en":"An explanation is always right and an observation is always wrong."},{"he":"תצפית היא מה שהמורה אומר.","ar":"الملاحظة هي ما يقوله المعلّم.","ru":"Наблюдение — это то, что говорит учитель.","en":"An observation is what the teacher says."}],"h":{"he":"חשבו על המילה ״למה״.","ar":"فكّروا في كلمة «لماذا».","ru":"Подумайте о слове «почему».","en":"Think about the word \"why\"."},"y":{"he":"תצפית מתארת, הסבר נותן סיבה, והסבר צריך ראיות.","ar":"الملاحظة تصف، والتفسير يعطي سببًا، والتفسير يحتاج إلى أدلة.","ru":"Наблюдение описывает, объяснение даёт причину, а ему нужны доказательства.","en":"An observation describes, an explanation gives a cause, and it needs evidence."}},{"lv":1,"s":{"he":"מה אסור לעשות עם חומר לא מוכר בכיתה?","ar":"ماذا يُمنع فعله بمادة غير معروفة في الصف؟","ru":"Что нельзя делать с незнакомым веществом в классе?","en":"What must you never do with an unknown substance in class?"},"o":[{"he":"לטעום אותו.","ar":"تذوّقها.","ru":"Пробовать его на вкус.","en":"Taste it."},{"he":"להסתכל עליו.","ar":"النظر إليها.","ru":"Смотреть на него.","en":"Look at it."},{"he":"לשאול את המורה עליו.","ar":"سؤال المعلّم عنها.","ru":"Спрашивать о нём учителя.","en":"Ask the teacher about it."},{"he":"לרשום את הצבע שלו.","ar":"تسجيل لونها.","ru":"Записывать его цвет.","en":"Write down its color."}],"h":{"he":"איזו פעולה עלולה לפגוע בגוף?","ar":"أي فعل قد يؤذي الجسم؟","ru":"Какое действие может навредить телу?","en":"Which action could hurt your body?"},"y":{"he":"טעימה עלולה להכניס חומר מסוכן לגוף. הסתכלות ורישום בטוחים.","ar":"التذوّق قد يُدخل مادة خطرة إلى الجسم. النظر والتسجيل آمنان.","ru":"Проба на вкус может ввести опасное вещество в организм. Смотреть и записывать безопасно.","en":"Tasting can put a harmful substance in your body. Looking and writing are safe."}},{"lv":2,"s":{"he":"ראיתם שהצמח ליד החלון גבוה יותר. מה הוא ניסוח של תצפית?","ar":"رأيتم أن النبتة قرب الشباك أطول. أي صياغة هي ملاحظة؟","ru":"Вы увидели, что растение у окна выше. Какая формулировка — наблюдение?","en":"You saw that the plant by the window is taller. Which wording is an observation?"},"o":[{"he":"הצמח ליד החלון גבוה ב-3 ס״מ מהצמח בפינה.","ar":"النبتة قرب الشباك أطول بـ 3 سم من النبتة في الزاوية.","ru":"Растение у окна выше на 3 см, чем растение в углу.","en":"The plant by the window is 3 cm taller than the plant in the corner."},{"he":"הצמח אוהב אור.","ar":"النبتة تحب الضوء.","ru":"Растение любит свет.","en":"The plant likes light."},{"he":"האור גורם לצמח לגדול.","ar":"الضوء يجعل النبتة تنمو.","ru":"Свет заставляет растение расти.","en":"Light makes the plant grow."},{"he":"הצמח שמח ליד החלון.","ar":"النبتة سعيدة قرب الشباك.","ru":"Растение радо у окна.","en":"The plant is happy by the window."}],"h":{"he":"תצפית טובה כוללת מדידה.","ar":"الملاحظة الجيدة فيها قياس.","ru":"В хорошем наблюдении есть измерение.","en":"A good observation includes a measurement."},"y":{"he":"רק המשפט הראשון מתאר מה נמדד, עם מספר ויחידה. האחרים מוסיפים רגש או סיבה.","ar":"الجملة الأولى فقط تصف ما قيس برقم ووحدة. الباقي يضيف شعورًا أو سببًا.","ru":"Только первое предложение описывает измерение с числом и единицей. Остальные добавляют чувство или причину.","en":"Only the first sentence describes a measurement with a number and unit. The others add feeling or cause."}},{"lv":2,"s":{"he":"מה עושים אם יש בניסוי מכשיר חשמלי ואתם לא בטוחים איך להפעיל אותו?","ar":"ماذا تفعلون إذا كان في التجربة جهاز كهربائي ولستم متأكدين كيف يُشغَّل؟","ru":"Что делать, если в опыте есть электроприбор и вы не уверены, как его включать?","en":"What do you do if an experiment has an electrical device and you are not sure how to start it?"},"o":[{"he":"עוצרים ושואלים את המורה.","ar":"نتوقف ونسأل المعلّم.","ru":"Останавливаемся и спрашиваем учителя.","en":"Stop and ask the teacher."},{"he":"מנסים ללחוץ על כל הכפתורים.","ar":"نجرّب الضغط على كل الأزرار.","ru":"Пробуем нажать все кнопки.","en":"Try pressing every button."},{"he":"מחכים שמישהו אחר יתחיל.","ar":"ننتظر أن يبدأ شخص آخر.","ru":"Ждём, пока кто-то другой начнёт.","en":"Wait for someone else to start."},{"he":"מחברים לשקע בקיר כדי לבדוק.","ar":"نوصله بمقبس الحائط لنرى.","ru":"Подключаем к розетке, чтобы проверить.","en":"Plug it into the wall to test."}],"h":{"he":"מי יודע איך להפעיל בבטחה?","ar":"من يعرف التشغيل بأمان؟","ru":"Кто знает, как включать безопасно?","en":"Who knows how to start it safely?"},"y":{"he":"כשלא בטוחים, שואלים לפני שמפעילים. חשמל לא מנסים בניסוי וטעייה.","ar":"عندما لا نكون متأكدين نسأل قبل التشغيل. الكهرباء لا نجرّبها بالمحاولة والخطأ.","ru":"Если не уверены, сначала спрашиваем. С электричеством не действуют методом проб и ошибок.","en":"When unsure, ask before starting. Electricity is not for trial and error."}},{"lv":3,"s":{"he":"שני תלמידים מדדו את אותו שולחן. האחד כתב ״120״, והשני ״120 ס״מ״. למה השני טוב יותר?","ar":"قاس تلميذان الطاولة نفسها. كتب الأول «120» والثاني «120 سم». لماذا الثاني أفضل؟","ru":"Два ученика измерили один стол. Один записал «120», другой «120 см». Почему второй лучше?","en":"Two students measured the same table. One wrote \"120\", the other \"120 cm\". Why is the second better?"},"o":[{"he":"כי היחידה מבהירה מה המספר אומר, ואפשר לשחזר את המדידה.","ar":"لأن الوحدة توضّح ما يعنيه الرقم ويمكن إعادة القياس.","ru":"Потому что единица показывает, что означает число, и измерение можно повторить.","en":"Because the unit shows what the number means, and the measurement can be repeated."},{"he":"כי המספר שלו גדול יותר.","ar":"لأن رقمه أكبر.","ru":"Потому что его число больше.","en":"Because his number is bigger."},{"he":"כי הוא כתב יותר סימנים.","ar":"لأنه كتب رموزًا أكثر.","ru":"Потому что он написал больше знаков.","en":"Because he wrote more symbols."},{"he":"אין הבדל בין שתי התשובות.","ar":"لا فرق بين الإجابتين.","ru":"Между ответами нет разницы.","en":"There is no difference between the answers."}],"h":{"he":"120 מה? שנייה? קילו? סנטימטר?","ar":"120 ماذا؟ ثانية؟ كيلو؟ سنتيمتر؟","ru":"120 чего? секунд? кило? сантиметров?","en":"120 what? Seconds? Kilos? Centimeters?"},"y":{"he":"בלי יחידה המספר לא אומר מה נמדד. עם יחידה אחרים יכולים לבדוק אותך.","ar":"بدون وحدة لا يوضح الرقم ما الذي قيس. ومع الوحدة يستطيع غيرك أن يتحقق.","ru":"Без единицы число не говорит, что измерено. С единицей другие могут вас проверить.","en":"Without a unit, a number does not say what was measured. With a unit, others can check you."}},{"lv":3,"s":{"he":"נועה טוענת: ״המים בכוס התאדו, כי הם נעלמו.״ מה חסר לטענה?","ar":"تقول نوعا: «تبخّر الماء في الكوب لأنه اختفى.» ماذا ينقص هذا الادعاء؟","ru":"Ноа говорит: «Вода в стакане испарилась, потому что исчезла». Чего не хватает?","en":"Noa says: \"The water in the cup evaporated because it disappeared.\" What is missing?"},"o":[{"he":"ראיה: למשל מדידת מפלס המים לפני ואחרי, ובדיקה שהכוס לא דלפה.","ar":"دليل: مثل قياس مستوى الماء قبل وبعد والتأكد أن الكوب لا يسرّب.","ru":"Доказательство: например, измерить уровень воды до и после и проверить, что стакан не течёт.","en":"Evidence: for example, measuring the water level before and after and checking that the cup did not leak."},{"he":"צריך רק לומר את זה בקול רם יותר.","ar":"يكفي أن نقولها بصوت أعلى.","ru":"Надо просто сказать громче.","en":"It only needs to be said louder."},{"he":"צריך שכולם יסכימו.","ar":"يجب أن يوافق الجميع.","ru":"Нужно, чтобы все согласились.","en":"Everyone has to agree."},{"he":"לא חסר כלום, זו עובדה.","ar":"لا ينقص شيء، هذه حقيقة.","ru":"Ничего не хватает, это факт.","en":"Nothing is missing, it is a fact."}],"h":{"he":"״נעלמו״ זו תצפית. איך נדע שהתאדו ולא נשפכו?","ar":"«اختفى» ملاحظة. كيف نعرف أنه تبخّر ولم ينسكب؟","ru":"«Исчезла» — наблюдение. Как узнать, что испарилась, а не вылилась?","en":"\"Disappeared\" is an observation. How do we know it evaporated and was not spilled?"},"y":{"he":"הסבר מדעי נתמך בראיות שאפשר לבדוק, לא רק בכך שאומרים אותו.","ar":"التفسير العلمي تدعمه أدلة يمكن فحصها وليس مجرد قوله.","ru":"Научное объяснение опирается на проверяемые доказательства, а не просто на слова.","en":"A scientific explanation rests on evidence you can check, not just on saying it."}}]},{"id":"z1","grade":7,"t":{"he":"גוף, חומר ומדידה","ar":"جسم ومادة وقياس","ru":"Тело, вещество и измерение","en":"Object, material and measuring"},"pred":{"s":{"he":"איזה כלי הכי מתאים כדי לדעת כמה מים יש בכוס?","ar":"ما الأداة الأنسب لمعرفة كمية الماء في الكوب؟","ru":"Какой прибор лучше всего подходит, чтобы узнать, сколько воды в стакане?","en":"Which tool fits best to find out how much water is in a glass?"},"o":[{"he":"גליל מדידה","ar":"أسطوانة مدرّجة","ru":"мерный цилиндр","en":"measuring cylinder"},{"he":"סרגל","ar":"مسطرة","ru":"линейка","en":"ruler"},{"he":"שעון עצר","ar":"ساعة إيقاف","ru":"секундомер","en":"stopwatch"},{"he":"מצפן","ar":"بوصلة","ru":"компас","en":"compass"}]},"lessons":[{"t":{"he":"מסה ונפח","ar":"الكتلة والحجم","ru":"Масса и объём","en":"Mass and volume"},"phen":{"he":"ספל תה ושקית סוכר נראים באותו גודל בערך. האם יש בהם אותה כמות חומר?","ar":"كوب شاي وكيس سكر يبدوان بالحجم نفسه تقريبًا. هل فيهما الكمية نفسها من المادة؟","ru":"Чашка чая и пакетик сахара выглядят примерно одинаково. Одинаково ли в них вещества?","en":"A cup of tea and a bag of sugar look about the same size. Do they hold the same amount of matter?"},"concept":{"he":"מסה היא כמה חומר יש בגוף. מודדים אותה במאזניים, בגרם (g) או בקילוגרם (kg). נפח הוא כמה מקום הגוף תופס. מודדים אותו במיליליטר (מ״ל) או בסנטימטר מעוקב.","ar":"الكتلة هي كمية المادة في الجسم. نقيسها بالميزان بالغرام (g) أو بالكيلوغرام (kg). الحجم هو المكان الذي يشغله الجسم. نقيسه بالمليلتر (ml) أو بالسنتيمتر المكعّب.","ru":"Масса — это количество вещества в теле. Её измеряют весами в граммах (g) или килограммах (kg). Объём — это место, которое занимает тело. Его измеряют в миллилитрах (мл) или кубических сантиметрах.","en":"Mass is how much matter is in an object. You measure it with a balance, in grams (g) or kilograms (kg). Volume is how much space it takes up. You measure it in milliliters (ml) or cubic centimeters."},"steps":[{"he":"מחליטים מה מודדים: מסה או נפח.","ar":"نقرر ما الذي نقيسه: كتلة أم حجمًا.","ru":"Решаем, что измеряем: массу или объём.","en":"Decide what to measure: mass or volume."},{"he":"בוחרים כלי: מאזניים למסה, גליל מדידה לנפח נוזל.","ar":"نختار الأداة: ميزان للكتلة وأسطوانة مدرّجة لحجم السائل.","ru":"Выбираем прибор: весы для массы, мерный цилиндр для объёма жидкости.","en":"Choose a tool: a balance for mass, a measuring cylinder for liquid volume."},{"he":"קוראים בגובה העיניים וכותבים מספר ויחידה.","ar":"نقرأ على مستوى العين ونكتب رقمًا ووحدة.","ru":"Читаем на уровне глаз и записываем число и единицу.","en":"Read at eye level and write a number and a unit."}],"qs":[{"lv":1,"s":{"he":"מה מודדים במאזניים?","ar":"ماذا نقيس بالميزان؟","ru":"Что измеряют весами?","en":"What do you measure with a balance?"},"o":[{"he":"מסה, בגרם או בקילוגרם.","ar":"الكتلة، بالغرام أو الكيلوغرام.","ru":"Массу, в граммах или килограммах.","en":"Mass, in grams or kilograms."},{"he":"נפח, במיליליטר.","ar":"الحجم، بالمليلتر.","ru":"Объём, в миллилитрах.","en":"Volume, in milliliters."},{"he":"זמן, בשניות.","ar":"الزمن، بالثواني.","ru":"Время, в секундах.","en":"Time, in seconds."},{"he":"אורך, בסנטימטרים.","ar":"الطول، بالسنتيمترات.","ru":"Длину, в сантиметрах.","en":"Length, in centimeters."}],"h":{"he":"גרם וקילוגרם הם יחידות של אותו גודל.","ar":"الغرام والكيلوغرام وحدتان للكمية نفسها.","ru":"Грамм и килограмм — единицы одной величины.","en":"Gram and kilogram are units of the same quantity."},"y":{"he":"גרם וקילוגרם הם יחידות של מסה, וזה מה שהמאזניים מראים.","ar":"الغرام والكيلوغرام وحدتا كتلة، وهذا ما يبيّنه الميزان.","ru":"Грамм и килограмм — единицы массы, и именно это показывают весы.","en":"Gram and kilogram are units of mass, and that is what a balance shows."}},{"lv":2,"s":{"he":"רוצים לדעת כמה מים יש בכוס. מה עושים?","ar":"نريد معرفة كمية الماء في الكوب. ماذا نفعل؟","ru":"Хотим узнать, сколько воды в стакане. Что делаем?","en":"You want to know how much water is in a glass. What do you do?"},"o":[{"he":"שופכים לגליל מדידה וקוראים במ״ל בגובה העיניים.","ar":"نسكب في أسطوانة مدرّجة ونقرأ بالمل على مستوى العين.","ru":"Переливаем в мерный цилиндр и читаем в мл на уровне глаз.","en":"Pour it into a measuring cylinder and read the ml at eye level."},{"he":"מודדים את הכוס בסרגל.","ar":"نقيس الكوب بالمسطرة.","ru":"Измеряем стакан линейкой.","en":"Measure the glass with a ruler."},{"he":"מודדים כמה זמן לוקח לשתות.","ar":"نقيس كم يستغرق شربه.","ru":"Измеряем, сколько времени уйдёт, чтобы выпить.","en":"Time how long it takes to drink."},{"he":"מנחשים לפי הצבע.","ar":"نخمّن حسب اللون.","ru":"Угадываем по цвету.","en":"Guess by the color."}],"h":{"he":"כמה מקום תופסים המים? איזה כלי מודד את זה?","ar":"كم مكانًا يشغل الماء؟ أي أداة تقيس ذلك؟","ru":"Сколько места занимает вода? Какой прибор это измеряет?","en":"How much space does the water take? Which tool measures it?"},"y":{"he":"נוזל תופס נפח, ולכן משתמשים בגליל מדידה. קוראים בגובה העיניים כדי לא לטעות.","ar":"السائل يشغل حجمًا، لذلك نستخدم أسطوانة مدرّجة ونقرأ على مستوى العين كي لا نخطئ.","ru":"Жидкость занимает объём, поэтому используем мерный цилиндр. Читаем на уровне глаз, чтобы не ошибиться.","en":"A liquid takes up volume, so we use a measuring cylinder. Read at eye level to avoid mistakes."}}]},{"t":{"he":"נפח של אבן","ar":"حجم حجر","ru":"Объём камня","en":"The volume of a stone"},"phen":{"he":"אבן קטנה בצורה לא סדירה. אי אפשר למדוד אותה בסרגל. איך נדע כמה מקום היא תופסת?","ar":"حجر صغير بشكل غير منتظم. لا يمكن قياسه بالمسطرة. كيف نعرف كم مكانًا يشغل؟","ru":"Небольшой камень неправильной формы. Линейкой его не измерить. Как узнать, сколько места он занимает?","en":"A small stone with an uneven shape. You cannot measure it with a ruler. How do we find the space it takes?"},"concept":{"he":"מכניסים את האבן לגליל עם מים. המים עולים. ההפרש בין הקריאה אחרי לקריאה לפני הוא נפח האבן.","ar":"نضع الحجر في أسطوانة فيها ماء. يرتفع الماء. الفرق بين القراءة بعد والقراءة قبل هو حجم الحجر.","ru":"Опускаем камень в цилиндр с водой. Вода поднимается. Разница между показаниями после и до — это объём камня.","en":"Put the stone in a cylinder with water. The water rises. The difference between the reading after and before is the volume of the stone."},"steps":[{"he":"קוראים את המים לפני: למשל 50 מ״ל.","ar":"نقرأ الماء قبل: مثلًا 50 مل.","ru":"Читаем воду до: например 50 мл.","en":"Read the water before: for example 50 ml."},{"he":"מכניסים אבן ומחכים שהמים ישקטו. קוראים: 62 מ״ל.","ar":"نضع الحجر وننتظر هدوء الماء. نقرأ: 62 مل.","ru":"Опускаем камень и ждём, пока вода успокоится. Читаем: 62 мл.","en":"Add the stone and wait for the water to settle. Read: 62 ml."},{"he":"מחסרים: 62 פחות 50 הם 12. נפח האבן הוא 12 מ״ל.","ar":"نطرح: 62 ناقص 50 يساوي 12. حجم الحجر 12 مل.","ru":"Вычитаем: 62 минус 50 — 12. Объём камня 12 мл.","en":"Subtract: 62 minus 50 is 12. The stone's volume is 12 ml."}],"qs":[{"lv":1,"s":{"he":"המים עמדו על 40 מ״ל. אחרי שהכנסנו אבן הם עמדו על 55 מ״ל. מה נפח האבן?","ar":"كان الماء عند 40 مل. بعد وضع الحجر صار عند 55 مل. ما حجم الحجر؟","ru":"Вода стояла на 40 мл. После камня — 55 мл. Каков объём камня?","en":"The water was at 40 ml. After adding a stone it was at 55 ml. What is the stone's volume?"},"o":[{"he":"15 מ״ל","ar":"15 مل","ru":"15 мл","en":"15 ml"},{"he":"55 מ״ל","ar":"55 مل","ru":"55 мл","en":"55 ml"},{"he":"95 מ״ל","ar":"95 مل","ru":"95 мл","en":"95 ml"},{"he":"40 מ״ל","ar":"40 مل","ru":"40 мл","en":"40 ml"}],"h":{"he":"מחסרים את הקריאה הראשונה מהשנייה.","ar":"نطرح القراءة الأولى من الثانية.","ru":"Вычтите первое показание из второго.","en":"Subtract the first reading from the second."},"y":{"he":"55 פחות 40 הם 15. הפרש הקריאות הוא כמה מקום האבן תופסת.","ar":"55 ناقص 40 يساوي 15. الفرق بين القراءتين هو المكان الذي يشغله الحجر.","ru":"55 минус 40 — 15. Разница показаний — это место, которое занимает камень.","en":"55 minus 40 is 15. The difference in readings is the space the stone takes."}},{"lv":2,"s":{"he":"למה מאזניים לא נותנים לנו את נפח האבן?","ar":"لماذا لا يعطينا الميزان حجم الحجر؟","ru":"Почему весы не дают объём камня?","en":"Why would a balance not give the stone's volume?"},"o":[{"he":"כי הם מודדים מסה ולא כמה מקום האבן תופסת.","ar":"لأنه يقيس الكتلة وليس المكان الذي يشغله الحجر.","ru":"Потому что они измеряют массу, а не то, сколько места занимает камень.","en":"Because they measure mass, not how much space the stone takes."},{"he":"כי אבנים לא עולות על מאזניים.","ar":"لأن الحجارة لا توضع على الميزان.","ru":"Потому что камни нельзя класть на весы.","en":"Because stones cannot go on a balance."},{"he":"כי מאזניים מודדים רק מים.","ar":"لأن الميزان يقيس الماء فقط.","ru":"Потому что весы измеряют только воду.","en":"Because a balance only measures water."},{"he":"כי נפח ומסה הם אותו דבר.","ar":"لأن الحجم والكتلة شيء واحد.","ru":"Потому что объём и масса — одно и то же.","en":"Because volume and mass are the same thing."}],"h":{"he":"נפח ומסה הם שני גדלים שונים.","ar":"الحجم والكتلة كمّيتان مختلفتان.","ru":"Объём и масса — две разные величины.","en":"Volume and mass are two different quantities."},"y":{"he":"מאזניים נותנים מסה בגרם. נפח נמדד ביחידות אחרות, כמו מ״ל.","ar":"الميزان يعطي الكتلة بالغرام. الحجم يُقاس بوحدات أخرى مثل المل.","ru":"Весы дают массу в граммах. Объём измеряют в других единицах, например в мл.","en":"A balance gives mass in grams. Volume is measured in other units, like ml."}}]}],"practice":[{"lv":1,"s":{"he":"כמה גרם יש בקילוגרם אחד?","ar":"كم غرامًا في كيلوغرام واحد؟","ru":"Сколько граммов в одном килограмме?","en":"How many grams are in one kilogram?"},"o":[{"he":"1000","ar":"1000","ru":"1000","en":"1000"},{"he":"10","ar":"10","ru":"10","en":"10"},{"he":"100","ar":"100","ru":"100","en":"100"},{"he":"1","ar":"1","ru":"1","en":"1"}],"h":{"he":"קילו פירושו ״אלף״.","ar":"«كيلو» تعني «ألف».","ru":"«Кило» означает «тысяча».","en":"\"Kilo\" means a thousand."},"y":{"he":"ק״ג אחד שווה 1000 גרם.","ar":"1 كغ يساوي 1000 غرام.","ru":"1 кг равен 1000 г.","en":"1 kg equals 1000 g."}},{"lv":1,"s":{"he":"באיזו יחידה מודדים נפח של מים?","ar":"بأي وحدة نقيس حجم الماء؟","ru":"В каких единицах измеряют объём воды?","en":"Which unit measures the volume of water?"},"o":[{"he":"מיליליטר (מ״ל)","ar":"مليلتر (ml)","ru":"миллилитр (мл)","en":"milliliter (ml)"},{"he":"גרם","ar":"غرام","ru":"грамм","en":"gram"},{"he":"שנייה","ar":"ثانية","ru":"секунда","en":"second"},{"he":"מעלה צלזיוס","ar":"درجة مئوية","ru":"градус Цельсия","en":"degree Celsius"}],"h":{"he":"כמה מקום תופסים המים?","ar":"كم مكانًا يشغل الماء؟","ru":"Сколько места занимает вода?","en":"How much space does the water take?"},"y":{"he":"נפח של נוזל נמדד במיליליטרים או בליטרים.","ar":"حجم السائل يُقاس بالمليلترات أو اللترات.","ru":"Объём жидкости измеряют в миллилитрах или литрах.","en":"The volume of a liquid is measured in milliliters or liters."}},{"lv":2,"s":{"he":"בגליל יש 30 מ״ל מים. מכניסים אבן והמים עולים ל-41 מ״ל. מה נפח האבן?","ar":"في الأسطوانة 30 مل ماء. نضع حجرًا فيرتفع الماء إلى 41 مل. ما حجم الحجر؟","ru":"В цилиндре 30 мл воды. Кладём камень — вода поднялась до 41 мл. Каков объём камня?","en":"A cylinder has 30 ml of water. You add a stone and it rises to 41 ml. What is the stone's volume?"},"o":[{"he":"11 מ״ל","ar":"11 مل","ru":"11 мл","en":"11 ml"},{"he":"41 מ״ל","ar":"41 مل","ru":"41 мл","en":"41 ml"},{"he":"71 מ״ל","ar":"71 مل","ru":"71 мл","en":"71 ml"},{"he":"30 מ״ל","ar":"30 مل","ru":"30 мл","en":"30 ml"}],"h":{"he":"41 פחות 30.","ar":"41 ناقص 30.","ru":"41 минус 30.","en":"41 minus 30."},"y":{"he":"41 פחות 30 הם 11, וזה כמה מקום האבן תופסת.","ar":"41 ناقص 30 يساوي 11، وهذا هو المكان الذي يشغله الحجر.","ru":"41 минус 30 — 11, это место, которое занимает камень.","en":"41 minus 30 is 11, the space the stone takes."}},{"lv":2,"s":{"he":"למה קוראים את גליל המדידה בגובה העיניים?","ar":"لماذا نقرأ الأسطوانة المدرّجة على مستوى العين؟","ru":"Почему мерный цилиндр читают на уровне глаз?","en":"Why do we read a measuring cylinder at eye level?"},"o":[{"he":"כדי לא לטעות בקריאה כשמסתכלים מלמעלה או מלמטה.","ar":"كي لا نخطئ في القراءة عند النظر من الأعلى أو الأسفل.","ru":"Чтобы не ошибиться, глядя сверху или снизу.","en":"To avoid reading mistakes from looking from above or below."},{"he":"כי אז המים מתחממים.","ar":"لأن الماء يسخن حينها.","ru":"Потому что тогда вода нагревается.","en":"Because then the water warms up."},{"he":"כי זה מהיר יותר.","ar":"لأن ذلك أسرع.","ru":"Потому что так быстрее.","en":"Because it is faster."},{"he":"אין סיבה, אפשר מכל מקום.","ar":"لا سبب، يمكن من أي مكان.","ru":"Нет причины, можно откуда угодно.","en":"There is no reason, any angle works."}],"h":{"he":"מה קורה לקריאה כשהעין גבוהה או נמוכה?","ar":"ماذا يحدث للقراءة عندما تكون العين أعلى أو أخفض؟","ru":"Что происходит с показанием, если глаз выше или ниже?","en":"What happens to the reading if your eye is higher or lower?"},"y":{"he":"זווית צפייה משנה את הקריאה. בגובה העיניים הקריאה נכונה יותר.","ar":"زاوية النظر تغيّر القراءة. على مستوى العين تكون القراءة أصحّ.","ru":"Угол обзора меняет показание. На уровне глаз оно точнее.","en":"The viewing angle changes the reading. At eye level it is more accurate."}},{"lv":3,"s":{"he":"אסף שקל שקית סוכר וכתב ״500״. נועה שקלה את אותה שקית וכתבה ״0.5 ק״ג״. מה נכון?","ar":"وزن آسف كيس سكر وكتب «500». ووزنت نوعا الكيس نفسه وكتبت «0.5 كغ». ما الصحيح؟","ru":"Асаф взвесил пакет сахара и записал «500». Ноа взвесила тот же пакет и записала «0,5 кг». Что верно?","en":"Asaf weighed a bag of sugar and wrote \"500\". Noa weighed the same bag and wrote \"0.5 kg\". What is true?"},"o":[{"he":"אפשר לדעת רק אם אסף כתב יחידה. אם זה 500 גרם, הם מסכימים.","ar":"لا نعرف إلا إن كتب آسف الوحدة. إن كانت 500 غرام فهما متفقان.","ru":"Можно понять, только если Асаф записал единицу. Если это 500 г, они согласны.","en":"We can only tell if Asaf wrote a unit. If it is 500 g, they agree."},{"he":"אסף טעה כי 500 גדול מ-0.5.","ar":"آسف أخطأ لأن 500 أكبر من 0.5.","ru":"Асаф ошибся, потому что 500 больше 0,5.","en":"Asaf is wrong because 500 is bigger than 0.5."},{"he":"נועה טעתה כי היא כתבה נקודה.","ar":"نوعا أخطأت لأنها كتبت نقطة.","ru":"Ноа ошиблась, потому что написала точку.","en":"Noa is wrong because she wrote a dot."},{"he":"לא יכול להיות שקית אחת בשני משקלים.","ar":"لا يمكن لكيس واحد أن يملك وزنين.","ru":"Один пакет не может иметь два веса.","en":"One bag cannot have two weights."}],"h":{"he":"500 גרם הם חצי קילוגרם.","ar":"500 غرام هي نصف كيلوغرام.","ru":"500 граммов — это полкилограмма.","en":"500 grams is half a kilogram."},"y":{"he":"בלי יחידה אי אפשר להשוות. 500 g שווה 0.5 kg.","ar":"بدون وحدة لا يمكن المقارنة. 500 غ تساوي 0.5 كغ.","ru":"Без единицы сравнивать нельзя. 500 г равно 0,5 кг.","en":"Without a unit you cannot compare. 500 g equals 0.5 kg."}},{"lv":3,"s":{"he":"רוצים לדעת איזו משתי אבנים לא סדירות תופסת יותר מקום. מה הכי נכון?","ar":"نريد أن نعرف أي حجرين غير منتظمين يشغل مكانًا أكبر. ما الأصح؟","ru":"Хотим узнать, какой из двух камней неправильной формы занимает больше места. Что вернее всего?","en":"You want to know which of two uneven stones takes more space. What is best?"},"o":[{"he":"מודדים את נפח כל אחת בעזרת עליית המים בגליל ומשווים.","ar":"نقيس حجم كل واحد بارتفاع الماء في الأسطوانة ونقارن.","ru":"Измеряем объём каждого по подъёму воды в цилиндре и сравниваем.","en":"Measure each volume by the rise of water in a cylinder and compare."},{"he":"שוקלים אותן ומחליטים לפי הכבדה יותר.","ar":"نزنهما ونقرر حسب الأثقل.","ru":"Взвешиваем и решаем по тому, который тяжелее.","en":"Weigh them and decide by the heavier one."},{"he":"מסתכלים ובוחרים את הגבוהה יותר.","ar":"ننظر ونختار الأعلى.","ru":"Смотрим и выбираем более высокий.","en":"Look and pick the taller one."},{"he":"מחכים שהמורה יגיד.","ar":"ننتظر ما يقوله المعلّم.","ru":"Ждём, что скажет учитель.","en":"Wait for the teacher to tell you."}],"h":{"he":"״תופס יותר מקום״ היא שאלה על נפח.","ar":"«يشغل مكانًا أكبر» سؤال عن الحجم.","ru":"«Занимает больше места» — вопрос об объёме.","en":"\"Takes more space\" is a question about volume."},"y":{"he":"נפח של גוף לא סדיר נמדד בעליית המים. כבדה יותר היא לא בהכרח גדולה יותר.","ar":"حجم الجسم غير المنتظم يُقاس بارتفاع الماء. الأثقل ليس بالضرورة الأكبر.","ru":"Объём неправильного тела измеряют по подъёму воды. Более тяжёлый не обязательно больший.","en":"The volume of an uneven object is measured by the water rise. Heavier is not always bigger."}}]},{"id":"z2","grade":7,"t":{"he":"תכונות ושימושים בחומרים","ar":"خصائص المواد واستخداماتها","ru":"Свойства и применение веществ","en":"Properties and uses of materials"},"pred":{"s":{"he":"איזה חומר הכי מתאים לעשות ממנו כף למרק חם?","ar":"أي مادة هي الأنسب لصنع ملعقة لحساء ساخن؟","ru":"Из какого вещества лучше всего сделать ложку для горячего супа?","en":"Which material fits best for a spoon for hot soup?"},"o":[{"he":"עץ","ar":"خشب","ru":"дерево","en":"wood"},{"he":"מתכת דקה","ar":"معدن رقيق","ru":"тонкий металл","en":"thin metal"},{"he":"סוכר","ar":"سكر","ru":"сахар","en":"sugar"},{"he":"נייר","ar":"ورق","ru":"бумага","en":"paper"}]},"lessons":[{"t":{"he":"תכונות של חומרים","ar":"خصائص المواد","ru":"Свойства веществ","en":"Properties of materials"},"phen":{"he":"כוס זכוכית וכוס פלסטיק נראות דומות. מה ההבדל ביניהן?","ar":"كوب زجاج وكوب بلاستيك يبدوان متشابهين. ما الفرق بينهما؟","ru":"Стеклянный и пластиковый стакан выглядят похоже. В чём разница?","en":"A glass cup and a plastic cup look alike. What is the difference?"},"concept":{"he":"לכל חומר יש תכונות שאפשר לבדוק ולהשוות: קשיחות, שקיפות, גמישות, האם הוא מוליך חום, האם הוא נמס במים. לפי התכונות בוחרים חומר לכל שימוש.","ar":"لكل مادة خصائص يمكن فحصها ومقارنتها: الصلابة، الشفافية، المرونة، هل توصل الحرارة، هل تذوب في الماء. حسب الخصائص نختار المادة لكل استخدام.","ru":"У каждого вещества есть свойства, которые можно проверить и сравнить: твёрдость, прозрачность, гибкость, проводит ли тепло, растворяется ли в воде. По свойствам выбирают вещество для каждого применения.","en":"Every material has properties you can test and compare: hardness, transparency, flexibility, whether it conducts heat, whether it dissolves in water. We choose a material for a job by its properties."},"steps":[{"he":"בוחרים תכונה אחת לבדוק, למשל גמישות.","ar":"نختار خاصية واحدة لفحصها، مثلًا المرونة.","ru":"Выбираем одно свойство для проверки, например гибкость.","en":"Pick one property to test, for example flexibility."},{"he":"בודקים את כל החומרים באותו אופן.","ar":"نفحص كل المواد بالطريقة نفسها.","ru":"Проверяем все вещества одинаково.","en":"Test all the materials in the same way."},{"he":"רושמים בטבלה ומשווים.","ar":"نسجّل في جدول ونقارن.","ru":"Записываем в таблицу и сравниваем.","en":"Record in a table and compare."}],"qs":[{"lv":1,"s":{"he":"איזו מהתכונות האלה אפשר לבדוק?","ar":"أي من هذه الخصائص يمكن فحصها؟","ru":"Какое из этих свойств можно проверить?","en":"Which of these properties can you test?"},"o":[{"he":"האם החומר מתכופף","ar":"هل تنثني المادة","ru":"гнётся ли вещество","en":"whether the material bends"},{"he":"האם החומר יפה לי","ar":"هل المادة جميلة بنظري","ru":"красиво ли вещество мне","en":"whether I find the material pretty"},{"he":"האם החומר מוצא חן בעיני חבר","ar":"هل تعجب المادة صديقًا","ru":"нравится ли вещество другу","en":"whether a friend likes the material"},{"he":"האם החומר היה פעם יקר","ar":"هل كانت المادة غالية يومًا","ru":"было ли вещество когда-то дорогим","en":"whether the material was once expensive"}],"h":{"he":"אפשר לבדוק בניסוי, ולא לפי דעה.","ar":"يمكن الفحص بتجربة وليس حسب الرأي.","ru":"Проверяют опытом, а не мнением.","en":"You can test it in an experiment, not by opinion."},"y":{"he":"תכונה שאפשר לבדוק היא תכונה שאפשר למדוד או לראות בניסוי. הטעם האישי אינו תכונה של החומר.","ar":"الخاصية القابلة للفحص هي ما يمكن قياسه أو رؤيته في تجربة. الذوق الشخصي ليس خاصية للمادة.","ru":"Проверяемое свойство можно измерить или увидеть в опыте. Личный вкус — не свойство вещества.","en":"A testable property is one you can measure or see in an experiment. Personal taste is not a property of the material."}},{"lv":2,"s":{"he":"למה שקיות קניות עשויות מפלסטיק ולא מזכוכית?","ar":"لماذا تُصنع أكياس التسوق من البلاستيك لا من الزجاج؟","ru":"Почему пакеты для покупок делают из пластика, а не из стекла?","en":"Why are shopping bags made of plastic and not glass?"},"o":[{"he":"פלסטיק גמיש וקל, וזכוכית שבירה וכבדה.","ar":"البلاستيك مرن وخفيف، والزجاج هش وثقيل.","ru":"Пластик гибкий и лёгкий, а стекло хрупкое и тяжёлое.","en":"Plastic is flexible and light, while glass is breakable and heavy."},{"he":"זכוכית נמסה במים.","ar":"الزجاج يذوب في الماء.","ru":"Стекло растворяется в воде.","en":"Glass dissolves in water."},{"he":"פלסטיק תמיד זול יותר מכל חומר.","ar":"البلاستيك دائمًا أرخص من أي مادة.","ru":"Пластик всегда дешевле любого вещества.","en":"Plastic is always cheaper than any material."},{"he":"אי אפשר לראות דרך פלסטיק.","ar":"لا يمكن الرؤية عبر البلاستيك.","ru":"Сквозь пластик ничего не видно.","en":"You cannot see through plastic."}],"h":{"he":"חושבים איזו תכונה צריכה שקית: לא להישבר ולהיות קלה.","ar":"فكّر أي خاصية تلزم للكيس: ألا ينكسر وأن يكون خفيفًا.","ru":"Подумайте, какое свойство нужно пакету: не ломаться и быть лёгким.","en":"Think which property a bag needs: not to break and to be light."},"y":{"he":"בוחרים חומר לפי התכונה שהשימוש דורש. לשקית צריך חומר גמיש וקל.","ar":"نختار المادة حسب الخاصية التي يتطلبها الاستخدام. الكيس يحتاج مادة مرنة وخفيفة.","ru":"Вещество выбирают по свойству, нужному для применения. Для пакета нужно гибкое и лёгкое.","en":"Pick the material by the property the job needs. A bag needs something flexible and light."}}]},{"t":{"he":"מוליכות חום","ar":"توصيل الحرارة","ru":"Теплопроводность","en":"Heat conduction"},"phen":{"he":"מזלג מתכת בתוך מרק חם נעשה חם מהר. מזלג עץ כמעט לא. למה?","ar":"شوكة معدن في حساء ساخن تسخن بسرعة. شوكة الخشب بالكاد. لماذا؟","ru":"Металлическая вилка в горячем супе быстро нагревается. Деревянная почти нет. Почему?","en":"A metal fork in hot soup warms up fast. A wooden one hardly does. Why?"},"concept":{"he":"חומרים שמעבירים חום מהר נקראים מוליכי חום טובים, כמו מתכות. חומרים שמעבירים חום לאט הם מבודדים, כמו עץ, פלסטיק וצמר.","ar":"المواد التي تنقل الحرارة بسرعة موصلات جيدة للحرارة، مثل المعادن. المواد التي تنقلها ببطء عوازل، مثل الخشب والبلاستيك والصوف.","ru":"Вещества, которые быстро передают тепло, — хорошие проводники тепла, например металлы. Те, что передают медленно, — изоляторы, например дерево, пластик и шерсть.","en":"Materials that pass heat quickly are good heat conductors, like metals. Materials that pass heat slowly are insulators, like wood, plastic and wool."},"steps":[{"he":"מניחים כמה כפות מחומרים שונים בכוס מים חמים (המורה מוזגת).","ar":"نضع عدة ملاعق من مواد مختلفة في كوب ماء ساخن (المعلّمة تسكب).","ru":"Кладём несколько ложек из разных материалов в стакан с горячей водой (наливает учитель).","en":"Place spoons of different materials in a cup of hot water (the teacher pours)."},{"he":"מחכים דקה ובודקים בזהירות איזו כף התחממה.","ar":"ننتظر دقيقة ونفحص بحذر أي ملعقة سخنت.","ru":"Ждём минуту и осторожно проверяем, какая ложка нагрелась.","en":"Wait a minute and carefully check which spoon got warm."},{"he":"מסיקים: איזה חומר מוליך חום טוב?","ar":"نستنتج: أي مادة توصل الحرارة جيدًا؟","ru":"Делаем вывод: какое вещество хорошо проводит тепло?","en":"Conclude: which material conducts heat well?"}],"qs":[{"lv":1,"s":{"he":"למה ידית של סיר עשויה לפעמים מפלסטיק או עץ?","ar":"لماذا تُصنع مقبض القدر أحيانًا من البلاستيك أو الخشب؟","ru":"Почему ручку кастрюли иногда делают из пластика или дерева?","en":"Why is a pot handle sometimes made of plastic or wood?"},"o":[{"he":"הם מבודדים ולא מעבירים חום מהר לידיים.","ar":"هي عوازل ولا تنقل الحرارة بسرعة إلى اليدين.","ru":"Они изоляторы и не передают тепло быстро рукам.","en":"They are insulators and do not pass heat quickly to the hands."},{"he":"הם מוליכים חום מהר.","ar":"هي توصل الحرارة بسرعة.","ru":"Они быстро проводят тепло.","en":"They conduct heat fast."},{"he":"הם נמסים במים.","ar":"هي تذوب في الماء.","ru":"Они растворяются в воде.","en":"They dissolve in water."},{"he":"הם כבדים מאוד.","ar":"هي ثقيلة جدًا.","ru":"Они очень тяжёлые.","en":"They are very heavy."}],"h":{"he":"איזה חומר לא מעביר חום מהר?","ar":"أي مادة لا تنقل الحرارة بسرعة؟","ru":"Какое вещество не передаёт тепло быстро?","en":"Which material does not pass heat fast?"},"y":{"he":"בידוד חום מונע מהחום לעבור ליד, ולכן היד לא נשרפת.","ar":"العزل الحراري يمنع انتقال الحرارة إلى اليد فلا تحترق.","ru":"Теплоизоляция не даёт теплу дойти до руки, поэтому рука не обжигается.","en":"Heat insulation stops heat from reaching the hand, so it does not get burned."}},{"lv":2,"s":{"he":"שתי כפות, אחת מתכת ואחת עץ, היו בכוס חמה. בדקנו: רק כף המתכת התחממה. מה אפשר להסיק?","ar":"ملعقتان، واحدة معدن وأخرى خشب، كانتا في كوب ساخن. فحصنا: ملعقة المعدن فقط سخنت. ماذا نستنتج؟","ru":"Две ложки, металлическая и деревянная, стояли в горячем стакане. Проверили: нагрелась только металлическая. Какой вывод?","en":"Two spoons, one metal and one wood, sat in a hot cup. We checked: only the metal spoon got warm. What can we conclude?"},"o":[{"he":"מתכת מוליכה חום טוב יותר מעץ.","ar":"المعدن يوصل الحرارة أفضل من الخشب.","ru":"Металл проводит тепло лучше дерева.","en":"Metal conducts heat better than wood."},{"he":"עץ מוליך חום טוב יותר.","ar":"الخشب يوصل الحرارة أفضل.","ru":"Дерево проводит тепло лучше.","en":"Wood conducts heat better."},{"he":"כל החומרים מוליכים חום באותה מידה.","ar":"كل المواد توصل الحرارة بالمقدار نفسه.","ru":"Все вещества проводят тепло одинаково.","en":"All materials conduct heat equally."},{"he":"מתכת תמיד חמה יותר מעץ.","ar":"المعدن دائمًا أسخن من الخشب.","ru":"Металл всегда горячее дерева.","en":"Metal is always hotter than wood."}],"h":{"he":"מה קרה לכל כף? מה אפשר לומר רק לפי מה שנמדד?","ar":"ماذا حدث لكل ملعقة؟ ماذا نقول فقط حسب ما قِيس؟","ru":"Что произошло с каждой ложкой? Что можно сказать только по измеренному?","en":"What happened to each spoon? What can you say only from what was measured?"},"y":{"he":"המסקנה צריכה להתאים לתוצאה: כף המתכת התחממה, ולכן המתכת הוליכה חום טוב יותר.","ar":"يجب أن يوافق الاستنتاج النتيجة: ملعقة المعدن سخنت، فالمعدن وصّل الحرارة أفضل.","ru":"Вывод должен соответствовать результату: металлическая ложка нагрелась, значит металл лучше проводит тепло.","en":"The conclusion should match the result: the metal spoon warmed, so metal conducted heat better."}}]}],"practice":[{"lv":1,"s":{"he":"איזו תכונה חשובה לחלון?","ar":"أي خاصية مهمة للنافذة؟","ru":"Какое свойство важно для окна?","en":"Which property matters for a window?"},"o":[{"he":"שקיפות","ar":"الشفافية","ru":"прозрачность","en":"transparency"},{"he":"צבע כהה","ar":"لون داكن","ru":"тёмный цвет","en":"dark color"},{"he":"טעם טוב","ar":"طعم جيد","ru":"хороший вкус","en":"good taste"},{"he":"ריח","ar":"رائحة","ru":"запах","en":"smell"}],"h":{"he":"דרך חלון רוצים לראות.","ar":"نريد أن نرى من خلال النافذة.","ru":"Через окно хотят смотреть.","en":"You want to see through a window."},"y":{"he":"לחלון מתאים חומר שקוף, כמו זכוכית.","ar":"للنافذة تناسب مادة شفافة مثل الزجاج.","ru":"Для окна подходит прозрачный материал, например стекло.","en":"A transparent material such as glass suits a window."}},{"lv":1,"s":{"he":"איזה חומר מתאים לבגד חם בחורף?","ar":"أي مادة تناسب ملابس دافئة في الشتاء؟","ru":"Какой материал подходит для тёплой зимней одежды?","en":"Which material suits warm clothes in winter?"},"o":[{"he":"צמר, כי הוא מבודד","ar":"الصوف لأنه عازل","ru":"шерсть, потому что она изолятор","en":"wool, because it insulates"},{"he":"מתכת, כי היא מוליכה חום","ar":"المعدن لأنه يوصل الحرارة","ru":"металл, потому что проводит тепло","en":"metal, because it conducts heat"},{"he":"זכוכית, כי היא שקופה","ar":"الزجاج لأنه شفاف","ru":"стекло, потому что прозрачно","en":"glass, because it is transparent"},{"he":"סוכר, כי הוא מתוק","ar":"السكر لأنه حلو","ru":"сахар, потому что сладкий","en":"sugar, because it is sweet"}],"h":{"he":"אנחנו רוצים שהחום של הגוף יישאר קרוב אלינו.","ar":"نريد أن تبقى حرارة الجسم قريبة منا.","ru":"Мы хотим, чтобы тепло тела осталось рядом.","en":"We want body heat to stay near us."},"y":{"he":"חומר מבודד מאט את בריחת החום מהגוף, ולכן מתאים לבגדי חורף.","ar":"العازل يبطّئ هروب الحرارة من الجسم لذلك يناسب ملابس الشتاء.","ru":"Изолятор замедляет уход тепла от тела, поэтому подходит для зимней одежды.","en":"An insulator slows heat leaving the body, so it suits winter clothes."}},{"lv":2,"s":{"he":"רוצים לבדוק איזה חומר מתכופף הכי טוב. מה חשוב לעשות?","ar":"نريد فحص أي مادة تنثني أفضل. ما المهم فعله؟","ru":"Хотим проверить, какой материал лучше гнётся. Что важно сделать?","en":"We want to test which material bends best. What is important?"},"o":[{"he":"להפעיל אותו כוח על כל החומרים באותו אופן","ar":"تطبيق القوة نفسها على كل المواد بالطريقة نفسها","ru":"прикладывать к каждому одну и ту же силу одинаково","en":"apply the same force to every material in the same way"},{"he":"ללחוץ חזק יותר על החומר שאני אוהב","ar":"الضغط أكثر على المادة التي أحبها","ru":"давить сильнее на любимое вещество","en":"press harder on the one I like"},{"he":"לבדוק חומר אחד בלבד","ar":"فحص مادة واحدة فقط","ru":"проверить только одно вещество","en":"test only one material"},{"he":"לנחש בלי לבדוק","ar":"التخمين دون فحص","ru":"угадать без проверки","en":"guess without testing"}],"h":{"he":"מה צריך להישאר זהה בכל הבדיקות?","ar":"ما الذي يجب أن يبقى ثابتًا في كل الفحوص؟","ru":"Что должно остаться одинаковым во всех проверках?","en":"What must stay the same in every test?"},"y":{"he":"בניסוי הוגן משנים דבר אחד בלבד (החומר) ושומרים את השאר קבוע.","ar":"في التجربة العادلة نغيّر شيئًا واحدًا فقط (المادة) ونثبّت الباقي.","ru":"В честном опыте меняют только одно (вещество), остальное оставляют неизменным.","en":"In a fair test you change only one thing (the material) and keep the rest the same."}},{"lv":2,"s":{"he":"פס מתכת מתחמם מצד אחד. מה יקרה לצד השני אחרי זמן?","ar":"شريط معدن يسخن من طرف واحد. ماذا سيحدث للطرف الآخر بعد وقت؟","ru":"Металлическую полоску нагревают с одного конца. Что будет с другим концом через время?","en":"A metal strip is heated at one end. What will happen to the other end after a while?"},"o":[{"he":"גם הוא יתחמם","ar":"سيسخن هو أيضًا","ru":"тоже нагреется","en":"it will warm up too"},{"he":"יישאר קר לתמיד","ar":"سيبقى باردًا دائمًا","ru":"останется холодным навсегда","en":"it stays cold forever"},{"he":"יתמוסס מיד","ar":"سيذوب فورًا","ru":"сразу расплавится","en":"it melts at once"},{"he":"ייעלם","ar":"سيختفي","ru":"исчезнет","en":"it disappears"}],"h":{"he":"האם מתכת מוליכה חום?","ar":"هل يوصل المعدن الحرارة؟","ru":"Проводит ли металл тепло?","en":"Does metal conduct heat?"},"y":{"he":"מתכת מוליכה חום, והחום עובר לאורכה אל הקצה השני.","ar":"المعدن يوصل الحرارة وتنتقل على طوله إلى الطرف الآخر.","ru":"Металл проводит тепло, и оно идёт по полоске к другому концу.","en":"Metal conducts heat, and it travels along the strip to the other end."}},{"lv":3,"s":{"he":"מדוע כוס תרמוס שומרת על חום המשקה?","ar":"لماذا يحافظ كوب الترمس على حرارة المشروب؟","ru":"Почему термос сохраняет тепло напитка?","en":"Why does a thermos keep a drink warm?"},"o":[{"he":"יש בו שכבת בידוד שמאטה מעבר חום החוצה","ar":"فيه طبقة عزل تبطّئ انتقال الحرارة إلى الخارج","ru":"в нём слой изоляции, замедляющий уход тепла наружу","en":"it has an insulating layer that slows heat leaving"},{"he":"הוא מייצר חום בעצמו","ar":"يصنع حرارة بنفسه","ru":"он сам вырабатывает тепло","en":"it makes heat by itself"},{"he":"הוא עשוי מסוכר","ar":"مصنوع من السكر","ru":"он сделан из сахара","en":"it is made of sugar"},{"he":"הוא מוליך חום מהר מאוד","ar":"يوصل الحرارة بسرعة كبيرة","ru":"он очень быстро проводит тепло","en":"it conducts heat very fast"}],"h":{"he":"לאן החום רוצה לברוח?","ar":"إلى أين تريد الحرارة أن تهرب؟","ru":"Куда стремится уйти тепло?","en":"Where does the heat want to escape?"},"y":{"he":"בידוד מקשה על מעבר חום, ולכן המשקה נשאר חם זמן רב יותר.","ar":"العزل يصعّب انتقال الحرارة فيبقى المشروب ساخنًا وقتًا أطول.","ru":"Изоляция затрудняет передачу тепла, поэтому напиток дольше остаётся тёплым.","en":"Insulation makes heat transfer hard, so the drink stays warm longer."}},{"lv":3,"s":{"he":"בטבלה: כף A התחממה ב-8 מעלות, כף B ב-1 מעלה, כף C ב-6 מעלות. איזו כף כנראה עשויה מבודד?","ar":"في الجدول: الملعقة A سخنت 8 درجات، B درجة واحدة، C 6 درجات. أي ملعقة غالبًا من عازل؟","ru":"В таблице: ложка A нагрелась на 8 градусов, B на 1, C на 6. Какая, скорее всего, из изолятора?","en":"In the table: spoon A warmed by 8 degrees, B by 1, C by 6. Which is probably made of an insulator?"},"o":[{"he":"B","ar":"B","ru":"B","en":"B"},{"he":"A","ar":"A","ru":"A","en":"A"},{"he":"C","ar":"C","ru":"C","en":"C"},{"he":"אף אחת","ar":"لا واحدة","ru":"ни одна","en":"none"}],"h":{"he":"מי התחממה הכי מעט?","ar":"أيها سخنت أقل؟","ru":"Какая нагрелась меньше всего?","en":"Which warmed the least?"},"y":{"he":"כף B התחממה מעט, כלומר העבירה חום לאט, ולכן כנראה היא מבודד.","ar":"الملعقة B سخنت قليلًا أي نقلت الحرارة ببطء لذلك غالبًا عازل.","ru":"Ложка B нагрелась мало, то есть медленно передавала тепло, значит, скорее всего, изолятор.","en":"Spoon B warmed little, so it passed heat slowly, which makes it probably an insulator."}}]},{"id":"z3","grade":7,"t":{"he":"שינויים בחומר","ar":"التغيّرات في المادة","ru":"Изменения вещества","en":"Changes in matter"},"pred":{"s":{"he":"קרח נמס בכוס. האם נוצר חומר חדש?","ar":"ذاب الجليد في الكوب. هل تكوّنت مادة جديدة؟","ru":"Лёд растаял в стакане. Появилось ли новое вещество?","en":"Ice melts in a glass. Is a new substance formed?"},"o":[{"he":"לא, זה אותו חומר (מים) במצב אחר","ar":"لا، هي المادة نفسها (ماء) في حالة أخرى","ru":"нет, это то же вещество (вода) в другом состоянии","en":"no, it is the same substance (water) in another state"},{"he":"כן, נוצר חומר חדש","ar":"نعم، تكوّنت مادة جديدة","ru":"да, возникло новое вещество","en":"yes, a new substance is formed"},{"he":"המים נעלמו","ar":"اختفى الماء","ru":"вода исчезла","en":"the water disappeared"},{"he":"הקרח הפך למתכת","ar":"تحوّل الجليد إلى معدن","ru":"лёд стал металлом","en":"the ice turned into metal"}]},"lessons":[{"t":{"he":"שינוי פיזיקלי: התכה והקפאה","ar":"تغيّر فيزيائي: الانصهار والتجمّد","ru":"Физическое изменение: плавление и замерзание","en":"A physical change: melting and freezing"},"phen":{"he":"שוקולד נמס ביד ומתקשה במקרר. האם הוא חומר אחר?","ar":"الشوكولاتة تذوب في اليد وتتصلب في الثلاجة. هل هي مادة أخرى؟","ru":"Шоколад тает в руке и твердеет в холодильнике. Это другое вещество?","en":"Chocolate melts in the hand and hardens in the fridge. Is it another substance?"},"concept":{"he":"חומר יכול להיות מוצק, נוזל או גז. כשמחממים או מקררים, הוא עובר ממצב למצב: התכה, קפיאה, התאדות, התעבות. החומר נשאר אותו חומר, ולכן זה שינוי פיזיקלי.","ar":"يمكن أن تكون المادة صلبة أو سائلة أو غازية. عند التسخين أو التبريد تنتقل من حالة إلى أخرى: انصهار، تجمّد، تبخّر، تكاثف. تبقى المادة نفسها، لذلك هو تغيّر فيزيائي.","ru":"Вещество может быть твёрдым, жидким или газообразным. При нагревании или охлаждении оно переходит из состояния в состояние: плавление, замерзание, испарение, конденсация. Вещество остаётся тем же, поэтому это физическое изменение.","en":"A substance can be solid, liquid or gas. When heated or cooled it moves from one state to another: melting, freezing, evaporation, condensation. It stays the same substance, so this is a physical change."},"steps":[{"he":"מתבוננים: באיזה מצב החומר עכשיו?","ar":"نلاحظ: في أي حالة المادة الآن؟","ru":"Наблюдаем: в каком состоянии вещество сейчас?","en":"Observe: what state is the material in now?"},{"he":"שואלים: האם הוא התחמם או התקרר?","ar":"نسأل: هل سخن أم برد؟","ru":"Спрашиваем: нагрелось оно или остыло?","en":"Ask: was it heated or cooled?"},{"he":"אומרים את שם התהליך: התכה, קפיאה, התאדות או התעבות.","ar":"نسمّي العملية: انصهار أو تجمّد أو تبخّر أو تكاثف.","ru":"Называем процесс: плавление, замерзание, испарение или конденсация.","en":"Name the process: melting, freezing, evaporation or condensation."}],"qs":[{"lv":1,"s":{"he":"איך קוראים למעבר ממים נוזליים לאדים?","ar":"ماذا نسمّي الانتقال من ماء سائل إلى بخار؟","ru":"Как называется переход жидкой воды в пар?","en":"What is turning liquid water into vapor called?"},"o":[{"he":"התאדות","ar":"تبخّر","ru":"испарение","en":"evaporation"},{"he":"התכה","ar":"انصهار","ru":"плавление","en":"melting"},{"he":"קפיאה","ar":"تجمّد","ru":"замерзание","en":"freezing"},{"he":"התעבות","ar":"تكاثف","ru":"конденсация","en":"condensation"}],"h":{"he":"מצב הסוף הוא גז.","ar":"حالة النهاية غاز.","ru":"Конечное состояние — газ.","en":"The end state is a gas."},"y":{"he":"מנוזל לגז זה התאדות. מגז לנוזל זה התעבות.","ar":"من سائل إلى غاز تبخّر. ومن غاز إلى سائل تكاثف.","ru":"Из жидкости в газ — испарение. Из газа в жидкость — конденсация.","en":"Liquid to gas is evaporation. Gas to liquid is condensation."}},{"lv":2,"s":{"he":"חמאה נמסה במחבת. מה נכון?","ar":"ذابت الزبدة في المقلاة. ما الصحيح؟","ru":"Масло растаяло на сковороде. Что верно?","en":"Butter melted in a pan. What is true?"},"o":[{"he":"זה שינוי פיזיקלי, והחמאה נשארה חמאה","ar":"هذا تغيّر فيزيائي والزبدة بقيت زبدة","ru":"это физическое изменение, масло осталось маслом","en":"it is a physical change, the butter is still butter"},{"he":"נוצר חומר חדש לגמרי","ar":"تكوّنت مادة جديدة تمامًا","ru":"возникло совсем новое вещество","en":"a totally new substance formed"},{"he":"החמאה נעלמה","ar":"اختفت الزبدة","ru":"масло исчезло","en":"the butter vanished"},{"he":"החמאה הפכה לגז","ar":"تحوّلت الزبدة إلى غاز","ru":"масло стало газом","en":"the butter became a gas"}],"h":{"he":"אפשר להקפיא שוב ולקבל חמאה מוצקה?","ar":"هل يمكن تجميدها مجددًا لتعود زبدة صلبة؟","ru":"Можно ли снова охладить и получить твёрдое масло?","en":"Can you cool it again to get solid butter?"},"y":{"he":"התכה היא שינוי פיזיקלי: אפשר להחזיר את המצב הקודם בקירור.","ar":"الانصهار تغيّر فيزيائي: يمكن العودة للحالة السابقة بالتبريد.","ru":"Плавление — физическое изменение: охлаждением можно вернуть прежнее состояние.","en":"Melting is a physical change: cooling brings the old state back."}}]},{"t":{"he":"שינוי כימי","ar":"تغيّر كيميائي","ru":"Химическое изменение","en":"A chemical change"},"phen":{"he":"פרוסת לחם נשרפה בטוסטר והפכה שחורה. אפשר להחזיר אותה ללחם?","ar":"شريحة خبز احترقت في المحمصة وصارت سوداء. هل يمكن إعادتها خبزًا؟","ru":"Ломтик хлеба подгорел в тостере и почернел. Можно ли вернуть его в хлеб?","en":"A slice of bread burned in the toaster and turned black. Can it become bread again?"},"concept":{"he":"בשינוי כימי נוצר חומר חדש עם תכונות חדשות, ואי אפשר להחזיר אותו בפשטות. סימנים: צבע חדש, גז שנוצר, ריח חדש, חום או אור. דוגמאות: שריפה, חלודה, אפייה.","ar":"في التغيّر الكيميائي تتكوّن مادة جديدة بخصائص جديدة ولا يمكن إعادتها ببساطة. علامات: لون جديد، غاز، رائحة جديدة، حرارة أو ضوء. أمثلة: احتراق، صدأ، خَبز.","ru":"При химическом изменении образуется новое вещество с новыми свойствами, вернуть его просто так нельзя. Признаки: новый цвет, газ, новый запах, тепло или свет. Примеры: горение, ржавчина, выпечка.","en":"In a chemical change a new substance forms with new properties, and you cannot simply undo it. Signs: a new color, a gas, a new smell, heat or light. Examples: burning, rust, baking."},"steps":[{"he":"משווים את החומר לפני ואחרי.","ar":"نقارن المادة قبل وبعد.","ru":"Сравниваем вещество до и после.","en":"Compare the material before and after."},{"he":"מחפשים סימנים: צבע, גז, ריח, חום.","ar":"نبحث عن علامات: لون، غاز، رائحة، حرارة.","ru":"Ищем признаки: цвет, газ, запах, тепло.","en":"Look for signs: color, gas, smell, heat."},{"he":"שואלים: האם התכונות השתנו? אם כן, כנראה נוצר חומר חדש.","ar":"نسأل: هل تغيّرت الخصائص؟ إن نعم فغالبًا تكوّنت مادة جديدة.","ru":"Спрашиваем: изменились ли свойства? Если да, скорее всего, образовалось новое вещество.","en":"Ask: did the properties change? If so, a new substance probably formed."}],"qs":[{"lv":1,"s":{"he":"מה מהבאים הוא שינוי כימי?","ar":"أي مما يلي تغيّر كيميائي؟","ru":"Что из перечисленного — химическое изменение?","en":"Which of these is a chemical change?"},"o":[{"he":"ברזל מחליד","ar":"الحديد يصدأ","ru":"железо ржавеет","en":"iron rusts"},{"he":"סוכר נמס במים","ar":"السكر يذوب في الماء","ru":"сахар растворяется в воде","en":"sugar dissolves in water"},{"he":"נייר נקרע","ar":"ورقة تتمزق","ru":"бумага рвётся","en":"paper is torn"},{"he":"קרח נמס","ar":"الجليد يذوب","ru":"лёд тает","en":"ice melts"}],"h":{"he":"באיזה שינוי נוצר חומר חדש?","ar":"في أي تغيّر تتكوّن مادة جديدة؟","ru":"При каком изменении возникает новое вещество?","en":"In which change does a new substance form?"},"y":{"he":"חלודה היא חומר חדש שנוצר מברזל, חמצן ומים, לכן זה שינוי כימי.","ar":"الصدأ مادة جديدة تتكوّن من الحديد والأكسجين والماء لذلك هو تغيّر كيميائي.","ru":"Ржавчина — новое вещество из железа, кислорода и воды, поэтому это химическое изменение.","en":"Rust is a new substance made from iron, oxygen and water, so it is a chemical change."}},{"lv":2,"s":{"he":"מערבבים סודה לשתייה וחומץ, ויוצאות בועות. מה אפשר להסיק?","ar":"نخلط بيكربونات الصودا والخل فتظهر فقاعات. ماذا نستنتج؟","ru":"Смешиваем соду и уксус, появляются пузырьки. Какой вывод?","en":"Baking soda and vinegar are mixed and bubbles appear. What can we conclude?"},"o":[{"he":"כנראה נוצר גז חדש, כלומר שינוי כימי","ar":"غالبًا تكوّن غاز جديد أي تغيّر كيميائي","ru":"скорее всего образовался новый газ, то есть химическое изменение","en":"a new gas probably formed, so it is a chemical change"},{"he":"המים נעלמו","ar":"اختفى الماء","ru":"вода исчезла","en":"water vanished"},{"he":"זה שינוי פיזיקלי בהכרח","ar":"هو تغيّر فيزيائي حتمًا","ru":"это обязательно физическое изменение","en":"it must be a physical change"},{"he":"לא קרה כלום","ar":"لم يحدث شيء","ru":"ничего не произошло","en":"nothing happened"}],"h":{"he":"מאיפה באו הבועות?","ar":"من أين جاءت الفقاعات؟","ru":"Откуда взялись пузырьки?","en":"Where did the bubbles come from?"},"y":{"he":"בועות גז הן סימן ליצירת חומר חדש. זה סימן, לא הוכחה, אבל כאן הוא מתאים.","ar":"فقاعات الغاز علامة على تكوّن مادة جديدة. هي علامة لا إثبات لكنها هنا مناسبة.","ru":"Пузырьки газа — признак образования нового вещества. Это признак, не доказательство, но здесь он подходит.","en":"Gas bubbles are a sign of a new substance. A sign is not proof, but it fits here."}}]}],"practice":[{"lv":1,"s":{"he":"סוכר נמס בתה. אפשר לקבל אותו בחזרה בהתאדות המים. איזה שינוי זה?","ar":"يذوب السكر في الشاي. يمكن استرجاعه بتبخير الماء. أي تغيّر هذا؟","ru":"Сахар растворился в чае. Его можно вернуть выпариванием воды. Какое это изменение?","en":"Sugar dissolves in tea. You can get it back by evaporating the water. What kind of change is it?"},"o":[{"he":"פיזיקלי","ar":"فيزيائي","ru":"физическое","en":"physical"},{"he":"כימי","ar":"كيميائي","ru":"химическое","en":"chemical"},{"he":"אין שינוי","ar":"لا تغيّر","ru":"нет изменения","en":"no change"},{"he":"שינוי של צבע בלבד","ar":"تغيّر لون فقط","ru":"только смена цвета","en":"only a color change"}],"h":{"he":"האם אפשר להחזיר?","ar":"هل يمكن الاسترجاع؟","ru":"Можно ли вернуть?","en":"Can it be reversed?"},"y":{"he":"כשהחומר חוזר בקלות, זה בדרך כלל שינוי פיזיקלי.","ar":"عندما تعود المادة بسهولة فغالبًا هو تغيّر فيزيائي.","ru":"Если вещество легко вернуть, это обычно физическое изменение.","en":"When the material comes back easily, it is usually a physical change."}},{"lv":1,"s":{"he":"מה קורה לטיפות מים על כוס קרה?","ar":"ماذا يحدث لقطرات الماء على كوب بارد؟","ru":"Что происходит с каплями воды на холодном стакане?","en":"What happens to water drops on a cold glass?"},"o":[{"he":"אדי מים באוויר מתעבים לנוזל","ar":"بخار الماء في الهواء يتكاثف إلى سائل","ru":"водяной пар из воздуха конденсируется в жидкость","en":"water vapor in the air condenses to liquid"},{"he":"המים עוברים דרך הזכוכית","ar":"الماء يعبر الزجاج","ru":"вода проходит сквозь стекло","en":"water passes through the glass"},{"he":"הזכוכית נמסה","ar":"الزجاج ذاب","ru":"стекло расплавилось","en":"the glass melted"},{"he":"נוצר חומר חדש","ar":"تكوّنت مادة جديدة","ru":"возникло новое вещество","en":"a new substance forms"}],"h":{"he":"הכוס קרה והאוויר סביבה חם יותר.","ar":"الكوب بارد والهواء حوله أدفأ.","ru":"Стакан холодный, воздух вокруг теплее.","en":"The glass is cold and the air around is warmer."},"y":{"he":"התעבות היא שינוי פיזיקלי: גז הופך לנוזל כשהוא מתקרר.","ar":"التكاثف تغيّر فيزيائي: الغاز يصير سائلًا عند التبريد.","ru":"Конденсация — физическое изменение: газ при охлаждении становится жидкостью.","en":"Condensation is a physical change: gas becomes liquid when cooled."}},{"lv":2,"s":{"he":"מה מבדיל שינוי כימי משינוי פיזיקלי?","ar":"ما الذي يميّز التغيّر الكيميائي عن الفيزيائي؟","ru":"Чем химическое изменение отличается от физического?","en":"What separates a chemical change from a physical one?"},"o":[{"he":"בכימי נוצר חומר חדש","ar":"في الكيميائي تتكوّن مادة جديدة","ru":"при химическом образуется новое вещество","en":"in a chemical change a new substance forms"},{"he":"בכימי החומר תמיד מתחמם","ar":"في الكيميائي تسخن المادة دائمًا","ru":"при химическом вещество всегда нагревается","en":"in a chemical change the material always heats"},{"he":"בפיזיקלי החומר נעלם","ar":"في الفيزيائي تختفي المادة","ru":"при физическом вещество исчезает","en":"in a physical change the material disappears"},{"he":"אין הבדל","ar":"لا فرق","ru":"разницы нет","en":"there is no difference"}],"h":{"he":"האם הוא אותו חומר אחרי?","ar":"هل هي المادة نفسها بعد ذلك؟","ru":"То же ли вещество после?","en":"Is it the same substance afterward?"},"y":{"he":"אם החומר נשאר אותו חומר, זה פיזיקלי. אם נוצר חומר בעל תכונות חדשות, זה כימי.","ar":"إن بقيت المادة نفسها فهو فيزيائي. وإن تكوّنت مادة بخصائص جديدة فهو كيميائي.","ru":"Если вещество осталось тем же, это физическое. Если возникло с новыми свойствами — химическое.","en":"If it is still the same substance, it is physical. If a substance with new properties forms, it is chemical."}},{"lv":2,"s":{"he":"שקלנו נר בתוך צנצנת סגורה לפני ואחרי שנכבה. מה צפוי למסה?","ar":"وزنّا شمعة داخل برطمان مغلق قبل وبعد انطفائها. ماذا نتوقع للكتلة؟","ru":"Взвесили свечу в закрытой банке до и после того, как она погасла. Что ожидать с массой?","en":"We weighed a candle in a closed jar before and after it went out. What do we expect for the mass?"},"o":[{"he":"המסה נשארת אותו דבר","ar":"تبقى الكتلة نفسها","ru":"масса остаётся прежней","en":"the mass stays the same"},{"he":"המסה נעלמת","ar":"تختفي الكتلة","ru":"масса исчезает","en":"the mass disappears"},{"he":"המסה גדלה פי שניים","ar":"تتضاعف الكتلة","ru":"масса удваивается","en":"the mass doubles"},{"he":"המסה קטנה לאפס","ar":"تصير الكتلة صفرًا","ru":"масса становится нулевой","en":"the mass drops to zero"}],"h":{"he":"הצנצנת סגורה, אז שום דבר לא יצא או נכנס.","ar":"البرطمان مغلق فلا شيء يخرج أو يدخل.","ru":"Банка закрыта, ничего не вышло и не вошло.","en":"The jar is closed, so nothing left or entered."},"y":{"he":"בשינוי בתוך מערכת סגורה המסה נשמרת, גם כשנוצרים חומרים חדשים.","ar":"في تغيّر داخل نظام مغلق تُحفظ الكتلة حتى لو تكوّنت مواد جديدة.","ru":"При изменении в закрытой системе масса сохраняется, даже если образуются новые вещества.","en":"In a change inside a closed system the mass is conserved, even when new substances form."}},{"lv":3,"s":{"he":"ברזל שהחליד נהיה כבד יותר מהברזל שהיה. איך זה מתיישב עם שימור המסה?","ar":"الحديد الذي صدأ صار أثقل مما كان. كيف يتفق ذلك مع حفظ الكتلة؟","ru":"Заржавевшее железо стало тяжелее, чем было. Как это согласуется с сохранением массы?","en":"Rusted iron is heavier than the iron was. How does this fit conservation of mass?"},"o":[{"he":"החלודה כוללת גם חמצן מהאוויר שהצטרף לברזל","ar":"الصدأ يشمل أكسجين الهواء الذي انضمّ إلى الحديد","ru":"в ржавчину вошёл кислород из воздуха, присоединившийся к железу","en":"the rust includes oxygen from the air that joined the iron"},{"he":"המסה לא נשמרת בחלודה","ar":"لا تُحفظ الكتلة في الصدأ","ru":"масса при ржавлении не сохраняется","en":"mass is not conserved in rusting"},{"he":"הברזל יצר מסה חדשה משום מקום","ar":"الحديد صنع كتلة جديدة من لا شيء","ru":"железо создало массу из ничего","en":"iron made new mass from nothing"},{"he":"המאזניים טעו תמיד","ar":"الميزان أخطأ دائمًا","ru":"весы всегда ошибаются","en":"the balance is always wrong"}],"h":{"he":"מה עוד היה במגע עם הברזל?","ar":"ما الذي كان أيضًا على تماس مع الحديد؟","ru":"Что ещё контактировало с железом?","en":"What else touched the iron?"},"y":{"he":"מסת הברזל ועוד מסת החמצן שהצטרף שווה למסת החלודה. הסך הכול נשמר.","ar":"كتلة الحديد مع كتلة الأكسجين المنضمّ تساوي كتلة الصدأ. المجموع محفوظ.","ru":"Масса железа плюс масса присоединившегося кислорода равна массе ржавчины. Сумма сохраняется.","en":"The iron mass plus the mass of the oxygen that joined equals the rust mass. The total is conserved."}},{"lv":3,"s":{"he":"תלמיד טוען: \"הסוכר נעלם במים, אז המסה ירדה\". איך בודקים?","ar":"يقول طالب: «اختفى السكر في الماء فنقصت الكتلة». كيف نفحص؟","ru":"Ученик говорит: «сахар исчез в воде, значит масса уменьшилась». Как проверить?","en":"A student says: \"the sugar vanished in water, so the mass dropped.\" How do we check?"},"o":[{"he":"שוקלים את הכוס עם המים והסוכר לפני ואחרי ההמסה","ar":"نزن الكوب بالماء والسكر قبل الإذابة وبعدها","ru":"взвешиваем стакан с водой и сахаром до и после растворения","en":"weigh the cup with water and sugar before and after dissolving"},{"he":"מסתכלים רק על הסוכר","ar":"ننظر إلى السكر فقط","ru":"смотрим только на сахар","en":"look only at the sugar"},{"he":"מאמינים לתלמיד","ar":"نصدّق الطالب","ru":"верим ученику","en":"believe the student"},{"he":"שוקלים את הכוס הריקה","ar":"نزن الكوب الفارغ","ru":"взвешиваем пустой стакан","en":"weigh the empty cup"}],"h":{"he":"איך אפשר להשוות מסה לפני ואחרי?","ar":"كيف نقارن الكتلة قبل وبعد؟","ru":"Как сравнить массу до и после?","en":"How can we compare mass before and after?"},"y":{"he":"הסוכר לא נעלם, הוא התפזר במים. המסה הכוללת נשארת זהה, וכך בודקים בשקילה.","ar":"السكر لم يختفِ بل تفرّق في الماء. الكتلة الكلية تبقى نفسها ويُفحص ذلك بالوزن.","ru":"Сахар не исчез, он распределился в воде. Общая масса та же, это проверяют взвешиванием.","en":"The sugar did not vanish, it spread in the water. The total mass stays the same, and weighing checks it."}}]},{"id":"z4","grade":7,"t":{"he":"מודל החלקיקים","ar":"نموذج الجسيمات","ru":"Модель частиц","en":"The particle model"},"pred":{"s":{"he":"למה אפשר לדחוס גז בבוכנה אבל לא מוצק?","ar":"لماذا يمكن ضغط الغاز في مكبس ولا يمكن ضغط الصلب؟","ru":"Почему газ можно сжать в поршне, а твёрдое тело нельзя?","en":"Why can you squeeze a gas in a syringe but not a solid?"},"o":[{"he":"בגז יש הרבה רווח בין החלקיקים","ar":"في الغاز مسافات كبيرة بين الجسيمات","ru":"в газе много места между частицами","en":"a gas has lots of space between its particles"},{"he":"בגז אין חלקיקים","ar":"لا جسيمات في الغاز","ru":"в газе нет частиц","en":"a gas has no particles"},{"he":"החלקיקים של מוצק קטנים יותר","ar":"جسيمات الصلب أصغر","ru":"частицы твёрдого меньше","en":"solid particles are smaller"},{"he":"בגז החלקיקים חמים מדי","ar":"جسيمات الغاز ساخنة جدًا","ru":"частицы газа слишком горячие","en":"gas particles are too hot"}]},"lessons":[{"t":{"he":"חומר עשוי חלקיקים","ar":"المادة مصنوعة من جسيمات","ru":"Вещество состоит из частиц","en":"Matter is made of particles"},"phen":{"he":"טיפת צבע בכוס מים מתפזרת לאט בלי לערבב. למה?","ar":"قطرة صبغة في كوب ماء تنتشر ببطء دون تحريك. لماذا؟","ru":"Капля красителя в стакане воды медленно расплывается без перемешивания. Почему?","en":"A drop of dye in water spreads slowly without stirring. Why?"},"concept":{"he":"המודל אומר: כל חומר בנוי מחלקיקים קטנים מאוד שאי אפשר לראות. החלקיקים נעים כל הזמן. מודל הוא כלי לחשוב איתו, לא תמונה מדויקת של המציאות.","ar":"يقول النموذج: كل مادة مبنية من جسيمات صغيرة جدًا لا نراها. الجسيمات تتحرك دائمًا. النموذج أداة للتفكير وليس صورة دقيقة للواقع.","ru":"Модель говорит: всё вещество состоит из очень маленьких невидимых частиц. Частицы всё время движутся. Модель — инструмент для размышления, а не точная картинка реальности.","en":"The model says: all matter is built from tiny particles we cannot see. The particles are always moving. A model is a tool for thinking, not an exact picture of reality."},"steps":[{"he":"מציירים את החלקיקים של הצבע ושל המים.","ar":"نرسم جسيمات الصبغة والماء.","ru":"Рисуем частицы красителя и воды.","en":"Draw the dye and water particles."},{"he":"מוסיפים חיצים לתנועה.","ar":"نضيف أسهمًا للحركة.","ru":"Добавляем стрелки движения.","en":"Add arrows for motion."},{"he":"מסבירים איך התנועה גורמת להתפזרות.","ar":"نشرح كيف تسبب الحركة الانتشار.","ru":"Объясняем, как движение вызывает расплывание.","en":"Explain how the motion causes the spreading."}],"qs":[{"lv":1,"s":{"he":"מה אומר מודל החלקיקים על חומרים?","ar":"ماذا يقول نموذج الجسيمات عن المواد؟","ru":"Что говорит модель частиц о веществах?","en":"What does the particle model say about materials?"},"o":[{"he":"הם בנויים מחלקיקים קטנים שנעים","ar":"هي مبنية من جسيمات صغيرة تتحرك","ru":"они состоят из мелких движущихся частиц","en":"they are made of tiny moving particles"},{"he":"הם חלקים ורציפים בלי חלקיקים","ar":"هي متصلة بلا جسيمات","ru":"они сплошные, без частиц","en":"they are smooth and continuous with no particles"},{"he":"החלקיקים לא זזים","ar":"الجسيمات لا تتحرك","ru":"частицы не движутся","en":"the particles do not move"},{"he":"החלקיקים רק במוצקים","ar":"الجسيمات في الصلب فقط","ru":"частицы только в твёрдых","en":"particles exist only in solids"}],"h":{"he":"האם החלקיקים נחים או זזים?","ar":"هل تستريح الجسيمات أم تتحرك؟","ru":"Частицы стоят или движутся?","en":"Do the particles rest or move?"},"y":{"he":"לפי המודל כל חומר בנוי מחלקיקים הנמצאים בתנועה תמידית.","ar":"حسب النموذج كل مادة مبنية من جسيمات في حركة دائمة.","ru":"По модели любое вещество состоит из частиц в постоянном движении.","en":"By the model, all matter is made of particles in constant motion."}},{"lv":2,"s":{"he":"למה ריח של בישול מגיע גם לחדר אחר?","ar":"لماذا تصل رائحة الطبخ إلى غرفة أخرى؟","ru":"Почему запах готовки доходит до другой комнаты?","en":"Why does cooking smell reach another room?"},"o":[{"he":"חלקיקים של ריח נעים באוויר ומתפזרים","ar":"جسيمات الرائحة تتحرك في الهواء وتنتشر","ru":"частицы запаха движутся по воздуху и расходятся","en":"smell particles move through the air and spread"},{"he":"הריח הוא חומר שלא בנוי מחלקיקים","ar":"الرائحة مادة غير مبنية من جسيمات","ru":"запах — вещество без частиц","en":"smell is a material with no particles"},{"he":"הרוח תמיד נושבת לחדר השני","ar":"الريح تهب دائمًا إلى الغرفة الأخرى","ru":"ветер всегда дует в другую комнату","en":"wind always blows to the other room"},{"he":"הקירות מעבירים ריח","ar":"الجدران تنقل الرائحة","ru":"стены передают запах","en":"the walls carry smell"}],"h":{"he":"מה נע באוויר ומגיע לאף?","ar":"ما الذي يتحرك في الهواء ويصل إلى الأنف؟","ru":"Что движется по воздуху и доходит до носа?","en":"What travels through the air to the nose?"},"y":{"he":"החלקיקים נעים ומתפזרים. זה נקרא פעפוע, והוא מסביר איך הריח מתפשט.","ar":"الجسيمات تتحرك وتنتشر. هذا يسمى الانتشار ويفسر كيف تنتشر الرائحة.","ru":"Частицы движутся и расходятся. Это диффузия, она объясняет распространение запаха.","en":"Particles move and spread. This is diffusion, and it explains how smell travels."}}]},{"t":{"he":"מוצק, נוזל וגז במודל","ar":"الصلب والسائل والغاز في النموذج","ru":"Твёрдое, жидкое и газ в модели","en":"Solid, liquid and gas in the model"},"phen":{"he":"אבן לא משנה צורה, מים לוקחים צורת כוס, ואוויר ממלא חדר. איך החלקיקים מסבירים?","ar":"الحجر لا يغيّر شكله، والماء يأخذ شكل الكوب، والهواء يملأ الغرفة. كيف تفسّر الجسيمات ذلك؟","ru":"Камень не меняет форму, вода принимает форму стакана, воздух заполняет комнату. Как это объясняют частицы?","en":"A stone keeps its shape, water takes the shape of a cup, air fills a room. How do particles explain this?"},"concept":{"he":"במוצק החלקיקים צמודים ומסודרים ורק רועדים במקומם. בנוזל הם קרובים אך מחליקים זה על פני זה. בגז הם רחוקים וזזים מהר בכל הכיוונים.","ar":"في الصلب الجسيمات متلاصقة ومرتبة وتهتز في مكانها فقط. في السائل قريبة لكنها تنزلق فوق بعضها. في الغاز بعيدة وتتحرك بسرعة في كل الاتجاهات.","ru":"В твёрдом частицы прижаты и упорядочены, лишь колеблются на месте. В жидкости близки, но скользят друг по другу. В газе далеки и быстро летят во все стороны.","en":"In a solid the particles are packed and ordered, only vibrating in place. In a liquid they are close but slide past each other. In a gas they are far apart and move fast in all directions."},"steps":[{"he":"מציירים שלושה ריבועים: מוצק, נוזל, גז.","ar":"نرسم ثلاثة مربعات: صلب، سائل، غاز.","ru":"Рисуем три квадрата: твёрдое, жидкость, газ.","en":"Draw three boxes: solid, liquid, gas."},{"he":"מוסיפים בכל ריבוע את החלקיקים ברווחים המתאימים.","ar":"نضيف في كل مربع الجسيمات بالمسافات المناسبة.","ru":"В каждый добавляем частицы с подходящими промежутками.","en":"Add particles in each box with fitting gaps."},{"he":"מוסיפים חיצים: קצרים במוצק, ארוכים בגז.","ar":"نضيف أسهمًا: قصيرة في الصلب وطويلة في الغاز.","ru":"Добавляем стрелки: короткие у твёрдого, длинные у газа.","en":"Add arrows: short in the solid, long in the gas."}],"qs":[{"lv":1,"s":{"he":"באיזה מצב החלקיקים רחוקים זה מזה ומהירים?","ar":"في أي حالة تكون الجسيمات متباعدة وسريعة؟","ru":"В каком состоянии частицы далеко друг от друга и быстрые?","en":"In which state are particles far apart and fast?"},"o":[{"he":"גז","ar":
