se a magnet"},{"he":"מקפיאים את הים","ar":"نجمّد البحر","ru":"замораживаем море","en":"freeze the sea"}],"h":{"he":"איזה חומר מתאדה ואיזה נשאר?","ar":"أي مادة تتبخر وأي مادة تبقى؟","ru":"Что испаряется, а что остаётся?","en":"What evaporates and what stays behind?"},"y":{"he":"מים מתאדים והמלח לא, ולכן המלח נשאר בסוף התאדות.","ar":"الماء يتبخر والملح لا لذلك يبقى الملح بعد التبخير.","ru":"Вода испаряется, соль нет, поэтому соль остаётся.","en":"Water evaporates and salt does not, so the salt remains after evaporation."}}]}],"practice":[{"lv":1,"s":{"he":"איזו שיטה מפרידה ברזל מחול?","ar":"أي طريقة تفصل الحديد عن الرمل؟","ru":"Какой способ отделяет железо от песка?","en":"Which method separates iron from sand?"},"o":[{"he":"מגנט","ar":"مغناطيس","ru":"магнит","en":"magnet"},{"he":"סינון","ar":"ترشيح","ru":"фильтрация","en":"filtering"},{"he":"התאדות","ar":"تبخير","ru":"выпаривание","en":"evaporation"},{"he":"זיקוק","ar":"تقطير","ru":"перегонка","en":"distillation"}],"h":{"he":"איזה מהם נמשך למגנט?","ar":"أيهما ينجذب للمغناطيس؟","ru":"Что притягивается к магниту?","en":"Which is drawn to a magnet?"},"y":{"he":"ברזל נמשך למגנט והחול לא, לכן המגנט מפריד.","ar":"الحديد ينجذب للمغناطيس والرمل لا لذلك يفصل المغناطيس.","ru":"Железо притягивается магнитом, песок нет, поэтому магнит разделяет.","en":"Iron is attracted and sand is not, so a magnet separates them."}},{"lv":1,"s":{"he":"מה זו תמיסה?","ar":"ما المحلول؟","ru":"Что такое раствор?","en":"What is a solution?"},"o":[{"he":"תערובת אחידה, כמו מלח מומס במים","ar":"خليط متجانس مثل ملح مذاب في الماء","ru":"однородная смесь, как соль в воде","en":"a uniform mixture like salt dissolved in water"},{"he":"חומר טהור","ar":"مادة نقية","ru":"чистое вещество","en":"a pure substance"},{"he":"מוצק בלבד","ar":"صلب فقط","ru":"только твёрдое","en":"only a solid"},{"he":"גז בלבד","ar":"غاز فقط","ru":"только газ","en":"only a gas"}],"h":{"he":"האם רואים בתמיסה חלקים נפרדים?","ar":"هل نرى أجزاءً منفصلة في المحلول؟","ru":"Видны ли в растворе отдельные части?","en":"Can you see separate parts in a solution?"},"y":{"he":"בתמיסה החומר המומס מתפזר באופן אחיד, ולכן היא נראית אחידה.","ar":"في المحلول تتوزع المادة المذابة بانتظام فيبدو متجانسًا.","ru":"В растворе растворённое вещество равномерно распределено, поэтому он выглядит однородным.","en":"In a solution the dissolved substance spreads evenly, so it looks uniform."}},{"lv":2,"s":{"he":"מי ים ומי ברז נראים שקופים. איך נדע איזה מהם מכיל מלח?","ar":"ماء البحر وماء الصنبور يبدوان شفافين. كيف نعرف أيهما فيه ملح؟","ru":"Морская и водопроводная вода прозрачны. Как узнать, в какой есть соль?","en":"Sea water and tap water look clear. How can we tell which has salt?"},"o":[{"he":"מאדים מעט ורואים שאריות מלח (בהדגמת מורה)","ar":"نبخّر قليلًا ونرى بقايا ملح (بعرض المعلّم)","ru":"выпариваем немного и видим остаток соли (демонстрация учителя)","en":"evaporate a little and see salt left (teacher demo)"},{"he":"מתבוננים בצבע בלבד","ar":"ننظر إلى اللون فقط","ru":"смотрим только на цвет","en":"look at color only"},{"he":"מוסיפים נייר","ar":"نضيف ورقًا","ru":"добавляем бумагу","en":"add paper"},{"he":"שוקלים בלי לעשות כלום","ar":"نزن دون فعل شيء","ru":"взвешиваем и ничего не делаем","en":"weigh without doing anything"}],"h":{"he":"איזה חומר נשאר אחרי שהמים נעלמים?","ar":"أي مادة تبقى بعد اختفاء الماء؟","ru":"Что остаётся после исчезновения воды?","en":"What remains when the water is gone?"},"y":{"he":"התאדות משאירה את המלח המומס, ולכן אפשר לגלות אותו. לא טועמים חומרים במעבדה.","ar":"التبخير يترك الملح المذاب فيمكن كشفه. لا نتذوق مواد في المختبر أبدًا.","ru":"Выпаривание оставляет растворённую соль, так её обнаруживают. В лаборатории вещества на вкус не пробуют.","en":"Evaporation leaves the dissolved salt, so you can detect it. Never taste substances in a lab."}},{"lv":2,"s":{"he":"תערובת של מים ושמן. איך מפרידים בקלות?","ar":"خليط ماء وزيت. كيف نفصلهما بسهولة؟","ru":"Смесь воды и масла. Как легко разделить?","en":"A mix of water and oil. How do you separate easily?"},"o":[{"he":"משאירים לעמוד והשמן צף למעלה, ואז מוזגים בזהירות","ar":"نتركه فيطفو الزيت ثم نسكب بحذر","ru":"оставляем, масло всплывает, затем осторожно сливаем","en":"let it stand, the oil floats on top, then pour carefully"},{"he":"מסננים בנייר","ar":"نرشّح بالورق","ru":"фильтруем бумагой","en":"filter with paper"},{"he":"מגנט","ar":"مغناطيس","ru":"магнит","en":"magnet"},{"he":"מקפיאים","ar":"نجمّد","ru":"замораживаем","en":"freeze"}],"h":{"he":"מה קורה לשמן במים?","ar":"ماذا يحدث للزيت في الماء؟","ru":"Что делает масло в воде?","en":"What does oil do in water?"},"y":{"he":"שמן קל ממים ולא מתערבב איתם, ולכן הוא מצטבר בשכבה עליונה.","ar":"الزيت أخف من الماء ولا يختلط به فيتجمع في طبقة علوية.","ru":"Масло легче воды и не смешивается, поэтому собирается сверху.","en":"Oil is lighter than water and does not mix, so it collects on top."}},{"lv":3,"s":{"he":"ברצוננו להפריד שלושה חומרים: ברזל, חול ומלח. מה סדר הפעולות הסביר?","ar":"نريد فصل ثلاث مواد: حديد ورمل وملح. ما الترتيب المعقول؟","ru":"Нужно разделить три вещества: железо, песок и соль. Каков разумный порядок?","en":"We want to separate iron, sand and salt. What is a sensible order?"},"o":[{"he":"מגנט לברזל, אחר כך מים וסינון לחול, ואז התאדות למלח","ar":"مغناطيس للحديد ثم ماء وترشيح للرمل ثم تبخير للملح","ru":"магнит для железа, затем вода и фильтр для песка, потом выпаривание для соли","en":"magnet for iron, then water and filter for sand, then evaporation for salt"},{"he":"קודם התאדות ואז מגנט","ar":"التبخير أولًا ثم المغناطيس","ru":"сначала выпаривание, потом магнит","en":"evaporation first then magnet"},{"he":"רק סינון","ar":"ترشيح فقط","ru":"только фильтр","en":"filter only"},{"he":"אין דרך","ar":"لا توجد طريقة","ru":"способа нет","en":"there is no way"}],"h":{"he":"איזה הבדל מנצלים בכל שלב?","ar":"أي فرق نستغل في كل مرحلة؟","ru":"Какое различие используем на каждом шаге?","en":"Which difference is used at each step?"},"y":{"he":"כל שלב מנצל תכונה אחרת: מגנטיות, מסיסות במים ואז התאדות המים.","ar":"كل مرحلة تستغل خاصية: المغناطيسية ثم الذوبان في الماء ثم تبخر الماء.","ru":"Каждый шаг использует свою особенность: магнитность, растворимость, затем испарение воды.","en":"Each step uses a different property: magnetism, solubility in water, then evaporation of water."}},{"lv":3,"s":{"he":"המלח הופרד מהמים בהתאדות. האם נוצר חומר חדש?","ar":"فُصل الملح عن الماء بالتبخير. هل تكوّنت مادة جديدة؟","ru":"Соль отделили от воды выпариванием. Образовалось ли новое вещество?","en":"Salt was separated from water by evaporation. Was a new substance formed?"},"o":[{"he":"לא, הפרדה היא שינוי פיזיקלי","ar":"لا، الفصل تغيّر فيزيائي","ru":"нет, разделение — физическое изменение","en":"no, separating is a physical change"},{"he":"כן, המלח הפך למים","ar":"نعم، صار الملح ماءً","ru":"да, соль стала водой","en":"yes, the salt became water"},{"he":"כן, נוצר גז חדש","ar":"نعم، تكوّن غاز جديد","ru":"да, образовался новый газ","en":"yes, a new gas formed"},{"he":"כן, הכול השתנה","ar":"نعم، تغيّر كل شيء","ru":"да, всё изменилось","en":"yes, everything changed"}],"h":{"he":"האם קיבלנו חזרה את אותו מלח?","ar":"هل استرجعنا الملح نفسه؟","ru":"Получили ли мы ту же соль?","en":"Did we get the same salt back?"},"y":{"he":"בהפרדת תערובת החומרים נשארים אותם חומרים, ולכן זה שינוי פיזיקלי.","ar":"عند فصل الخليط تبقى المواد نفسها لذلك هو تغيّر فيزيائي.","ru":"При разделении смеси вещества остаются теми же, поэтому это физическое изменение.","en":"When a mixture is separated the substances stay the same, so it is a physical change."}}]},{"id":"a3","grade":8,"t":{"he":"חשמל ומשאבי אנרגיה","ar":"الكهرباء ومصادر الطاقة","ru":"Электричество и источники энергии","en":"Electricity and energy resources"},"pred":{"s":{"he":"מה צריך כדי שנורה תידלק מסוללה?","ar":"ماذا يلزم لتضيء لمبة من بطارية؟","ru":"Что нужно, чтобы лампочка загорелась от батарейки?","en":"What does a bulb need to light from a battery?"},"o":[{"he":"מעגל סגור שלם","ar":"دارة مغلقة كاملة","ru":"замкнутая цепь","en":"a complete closed circuit"},{"he":"רק חוט אחד לצד אחד","ar":"سلك واحد لجانب واحد","ru":"только один провод к одной стороне","en":"just one wire to one side"},{"he":"מעגל פתוח","ar":"دارة مفتوحة","ru":"разомкнутая цепь","en":"an open circuit"},{"he":"מים","ar":"ماء","ru":"вода","en":"water"}]},"lessons":[{"t":{"he":"מעגל חשמלי","ar":"الدارة الكهربائية","ru":"Электрическая цепь","en":"The electric circuit"},"phen":{"he":"בפנס יש סוללה, נורה ומתג. למה הנורה נדלקת רק כשסוגרים את המתג?","ar":"في المصباح بطارية ولمبة ومفتاح. لماذا تضيء اللمبة فقط عند إغلاق المفتاح؟","ru":"В фонарике батарейка, лампочка и выключатель. Почему лампочка горит только при замкнутом выключателе?","en":"A flashlight has a battery, a bulb and a switch. Why does the bulb light only when the switch is closed?"},"concept":{"he":"זרם חשמלי הוא תנועה של מטענים (אלקטרונים) במעגל סגור. מעגל כולל מקור אנרגיה (סוללה), מוליכים, צרכן (נורה) ואפשר מתג. כשהמעגל פתוח הזרם נעצר. עובדים רק עם סוללות קטנות או סימולציה, לעולם לא עם שקע בקיר.","ar":"التيار الكهربائي حركة شحنات (إلكترونات) في دارة مغلقة. تتضمن الدارة مصدر طاقة (بطارية) وموصلات ومستهلكًا (لمبة) ويمكن مفتاحًا. عندما تكون الدارة مفتوحة يتوقف التيار. نعمل فقط ببطاريات صغيرة أو بمحاكاة وليس بمقبس الجدار.","ru":"Электрический ток — движение зарядов (электронов) в замкнутой цепи. В цепи есть источник энергии (батарейка), проводники, потребитель (лампочка) и, возможно, ключ. При разомкнутой цепи ток прекращается. Работаем только с маленькими батарейками или в симуляции, никогда с розеткой.","en":"An electric current is the motion of charges (electrons) in a closed loop. A circuit has an energy source (battery), conductors, a consumer (bulb) and maybe a switch. When the circuit is open the current stops. Use only small batteries or a simulation, never a wall outlet."},"steps":[{"he":"מציירים מעגל: סוללה, חוטים, נורה.","ar":"نرسم دارة: بطارية وأسلاك ولمبة.","ru":"Рисуем цепь: батарейка, провода, лампочка.","en":"Draw a circuit: battery, wires, bulb."},{"he":"בודקים שהוא סגור ללא רווחים.","ar":"نتأكد أنها مغلقة بلا فجوات.","ru":"Проверяем, что она замкнута без разрывов.","en":"Check it is closed with no gaps."},{"he":"פותחים את המתג בסימולציה ורואים מה קורה.","ar":"نفتح المفتاح في المحاكاة ونرى ما يحدث.","ru":"Размыкаем ключ в симуляции и смотрим.","en":"Open the switch in the simulation and see."}],"qs":[{"lv":1,"s":{"he":"מה קורה לנורה כשהמתג פתוח?","ar":"ماذا يحدث للمبة عندما يكون المفتاح مفتوحًا؟","ru":"Что с лампочкой, когда выключатель разомкнут?","en":"What happens to the bulb when the switch is open?"},"o":[{"he":"היא כבויה כי אין זרם","ar":"مطفأة لأنه لا تيار","ru":"не горит, потому что нет тока","en":"it is off because there is no current"},{"he":"היא דולקת חזק יותר","ar":"تضيء أقوى","ru":"горит ярче","en":"it glows brighter"},{"he":"היא נמסה","ar":"تذوب","ru":"плавится","en":"it melts"},{"he":"היא מזיזה את המתג","ar":"تحرّك المفتاح","ru":"двигает выключатель","en":"it moves the switch"}],"h":{"he":"האם המעגל סגור?","ar":"هل الدارة مغلقة؟","ru":"Замкнута ли цепь?","en":"Is the circuit closed?"},"y":{"he":"מתג פתוח שובר את המעגל, ולכן הזרם נעצר.","ar":"المفتاح المفتوح يقطع الدارة فيتوقف التيار.","ru":"Разомкнутый ключ разрывает цепь, и ток прекращается.","en":"An open switch breaks the circuit, so the current stops."}},{"lv":2,"s":{"he":"למה אסור להכניס חוט למקור חשמל בקיר?","ar":"لماذا يُمنع إدخال سلك في مصدر كهرباء الجدار؟","ru":"Почему нельзя вставлять провод в розетку?","en":"Why must you never put a wire into a wall outlet?"},"o":[{"he":"המתח גבוה ומסוכן לחיים","ar":"الجهد عالٍ ويهدد الحياة","ru":"напряжение высокое и опасно для жизни","en":"the voltage is high and can be deadly"},{"he":"כי החוט ייעלם","ar":"لأن السلك سيختفي","ru":"провод исчезнет","en":"the wire would vanish"},{"he":"כי הקיר יתקלף","ar":"لأن الجدار سيتقشر","ru":"стена облупится","en":"the wall would peel"},{"he":"כי זה לא מעניין","ar":"لأنه غير مثير","ru":"это неинтересно","en":"it is not interesting"}],"h":{"he":"איזה מתח יש בסוללה קטנה לעומת הקיר?","ar":"ما جهد بطارية صغيرة مقارنة بالجدار؟","ru":"Какое напряжение у маленькой батарейки по сравнению с розеткой?","en":"How does a small battery voltage compare to the wall?"},"y":{"he":"חשמל הרשת מסוכן. בכיתה משתמשים רק בסוללות קטנות ובסימולציות.","ar":"كهرباء الشبكة خطرة. في الصف نستعمل بطاريات صغيرة ومحاكاة فقط.","ru":"Сетевое электричество опасно. В классе используют только маленькие батарейки и симуляции.","en":"Mains electricity is dangerous. In class only small batteries and simulations are used."}}]},{"t":{"he":"משאבי אנרגיה והפקת חשמל","ar":"مصادر الطاقة وتوليد الكهرباء","ru":"Источники энергии и выработка электричества","en":"Energy resources and generating electricity"},"phen":{"he":"החשמל בבית מגיע ממקורות שונים. איך מפיקים אותו?","ar":"الكهرباء في البيت تأتي من مصادر مختلفة. كيف تُولَّد؟","ru":"Электричество дома поступает из разных источников. Как его вырабатывают?","en":"Electricity at home comes from different sources. How is it generated?"},"concept":{"he":"משאבים מתכלים, כמו נפט, פחם וגז, נוצרו לאורך מיליוני שנים וייגמרו, וכשהם נשרפים נפלט פחמן דו-חמצני. משאבים מתחדשים, כמו שמש, רוח ומים, לא נגמרים. תחנת כוח ממירה אנרגיה של משאב לחשמל.","ar":"الموارد غير المتجددة مثل النفط والفحم والغاز تكوّنت عبر ملايين السنين وستنفد وعند حرقها ينطلق ثاني أكسيد الكربون. الموارد المتجددة مثل الشمس والرياح والماء لا تنفد. محطة الطاقة تحوّل طاقة مورد إلى كهرباء.","ru":"Невозобновляемые ресурсы — нефть, уголь, газ — создавались миллионы лет и закончатся, при их сжигании выделяется углекислый газ. Возобновляемые — солнце, ветер, вода — не заканчиваются. Электростанция превращает энергию ресурса в электричество.","en":"Non-renewable resources like oil, coal and gas formed over millions of years and will run out, and burning them releases carbon dioxide. Renewable resources like sun, wind and water do not run out. A power station converts a resource's energy into electricity."},"steps":[{"he":"מתארים את מקור האנרגיה.","ar":"نصف مصدر الطاقة.","ru":"Описываем источник энергии.","en":"Describe the energy source."},{"he":"כותבים שרשרת המרות עד חשמל.","ar":"نكتب سلسلة التحويلات حتى الكهرباء.","ru":"Пишем цепочку превращений до электричества.","en":"Write the conversion chain to electricity."},{"he":"מוסיפים יתרון וחיסרון: עלות, זיהום, זמינות.","ar":"نضيف ميزة وعيبًا: التكلفة والتلوث والتوفر.","ru":"Добавляем плюс и минус: стоимость, загрязнение, доступность.","en":"Add a pro and a con: cost, pollution, availability."}],"qs":[{"lv":1,"s":{"he":"איזה משאב הוא מתחדש?","ar":"أي مورد متجدد؟","ru":"Какой ресурс возобновляемый?","en":"Which resource is renewable?"},"o":[{"he":"אנרגיית השמש","ar":"طاقة الشمس","ru":"энергия солнца","en":"solar energy"},{"he":"פחם","ar":"فحم","ru":"уголь","en":"coal"},{"he":"נפט","ar":"نفط","ru":"нефть","en":"oil"},{"he":"גז טבעי","ar":"غاز طبيعي","ru":"природный газ","en":"natural gas"}],"h":{"he":"איזה מהם לא ייגמר?","ar":"أيها لن ينفد؟","ru":"Какой не закончится?","en":"Which will not run out?"},"y":{"he":"אור שמש מגיע כל יום. פחם, נפט וגז ייגמרו.","ar":"ضوء الشمس يأتي كل يوم. الفحم والنفط والغاز ستنفد.","ru":"Свет солнца приходит каждый день. Уголь, нефть и газ закончатся.","en":"Sunlight arrives every day. Coal, oil and gas will run out."}},{"lv":2,"s":{"he":"מהי המרת האנרגיה בטורבינת רוח?","ar":"ما تحويل الطاقة في توربين الرياح؟","ru":"Какое превращение энергии в ветряной турбине?","en":"What is the energy conversion in a wind turbine?"},"o":[{"he":"תנועה של הרוח לחשמל","ar":"حركة الرياح إلى كهرباء","ru":"движение ветра в электричество","en":"wind motion to electricity"},{"he":"חום לאור","ar":"حرارة إلى ضوء","ru":"тепло в свет","en":"heat to light"},{"he":"חשמל לתנועה","ar":"كهرباء إلى حركة","ru":"электричество в движение","en":"electricity to motion"},{"he":"אור לקול","ar":"ضوء إلى صوت","ru":"свет в звук","en":"light to sound"}],"h":{"he":"מה מסובב את הלהבים?","ar":"ما الذي يدير الريش؟","ru":"Что вращает лопасти?","en":"What turns the blades?"},"y":{"he":"הרוח מסובבת את הלהבים והמחולל ממיר את התנועה לחשמל.","ar":"الرياح تدير الريش والمولّد يحوّل الحركة إلى كهرباء.","ru":"Ветер вращает лопасти, а генератор превращает движение в электричество.","en":"Wind turns the blades and the generator converts the motion to electricity."}}]}],"practice":[{"lv":1,"s":{"he":"מה כולל מעגל חשמלי?","ar":"ماذا تتضمن الدارة الكهربائية؟","ru":"Что входит в электрическую цепь?","en":"What does an electric circuit include?"},"o":[{"he":"מקור, חוטים וצרכן","ar":"مصدر وأسلاك ومستهلك","ru":"источник, провода и потребитель","en":"source, wires and consumer"},{"he":"רק נורה","ar":"لمبة فقط","ru":"только лампочка","en":"only a bulb"},{"he":"רק מתג","ar":"مفتاح فقط","ru":"только выключатель","en":"only a switch"},{"he":"רק מים","ar":"ماء فقط","ru":"только вода","en":"only water"}],"h":{"he":"מה מספק אנרגיה ומה משתמש בה?","ar":"ما الذي يوفر الطاقة وما الذي يستخدمها؟","ru":"Что даёт энергию и что её использует?","en":"What gives energy and what uses it?"},"y":{"he":"מעגל צריך מקור אנרגיה, מוליכים וצרכן.","ar":"الدارة تحتاج مصدر طاقة وموصلات ومستهلكًا.","ru":"Цепи нужны источник энергии, проводники и потребитель.","en":"A circuit needs an energy source, conductors and a consumer."}},{"lv":1,"s":{"he":"איזה חומר מוליך חשמל טוב?","ar":"أي مادة توصل الكهرباء جيدًا؟","ru":"Какое вещество хорошо проводит ток?","en":"Which material conducts electricity well?"},"o":[{"he":"נחושת","ar":"نحاس","ru":"медь","en":"copper"},{"he":"גומי","ar":"مطاط","ru":"резина","en":"rubber"},{"he":"פלסטיק","ar":"بلاستيك","ru":"пластик","en":"plastic"},{"he":"עץ יבש","ar":"خشب جاف","ru":"сухое дерево","en":"dry wood"}],"h":{"he":"ממה עשויים החוטים בתוך הכבל?","ar":"مم صُنعت الأسلاك داخل الكبل؟","ru":"Из чего провода внутри кабеля?","en":"What are the wires inside a cable made of?"},"y":{"he":"מתכות כמו נחושת מוליכות חשמל. גומי ופלסטיק הם מבודדים.","ar":"المعادن كالنحاس توصل الكهرباء. المطاط والبلاستيك عوازل.","ru":"Металлы вроде меди проводят ток. Резина и пластик — изоляторы.","en":"Metals like copper conduct electricity. Rubber and plastic are insulators."}},{"lv":2,"s":{"he":"למה כבל חשמל עטוף בפלסטיק?","ar":"لماذا يُغلَّف كبل الكهرباء بالبلاستيك؟","ru":"Почему провод обёрнут пластиком?","en":"Why is a cable wrapped in plastic?"},"o":[{"he":"כדי שהזרם לא יעבור למי שנוגע בו","ar":"حتى لا ينتقل التيار لمن يلمسه","ru":"чтобы ток не перешёл на того, кто касается","en":"so current does not pass to whoever touches it"},{"he":"כדי שיהיה יפה","ar":"ليكون جميلًا","ru":"чтобы было красиво","en":"to look nice"},{"he":"כדי להפוך חשמל לאור","ar":"ليحوّل الكهرباء إلى ضوء","ru":"чтобы превращать ток в свет","en":"to turn electricity into light"},{"he":"כדי שיהיה כבד","ar":"ليكون ثقيلًا","ru":"чтобы был тяжёлым","en":"to make it heavy"}],"h":{"he":"פלסטיק מוליך או מבודד?","ar":"هل البلاستيك موصل أم عازل؟","ru":"Пластик проводник или изолятор?","en":"Is plastic a conductor or an insulator?"},"y":{"he":"הפלסטיק מבודד וחוסם זרם, ולכן הכבל בטוח יותר לנגיעה.","ar":"البلاستيك عازل يمنع التيار لذلك يكون الكبل أكثر أمانًا للمس.","ru":"Пластик — изолятор, он блокирует ток, поэтому кабель безопаснее.","en":"Plastic insulates and blocks current, so the cable is safer to touch."}},{"lv":2,"s":{"he":"מהו יתרון של אנרגיית שמש?","ar":"ما ميزة الطاقة الشمسية؟","ru":"В чём плюс солнечной энергии?","en":"What is an advantage of solar energy?"},"o":[{"he":"לא נפלט פחמן דו-חמצני בייצור החשמל","ar":"لا ينبعث ثاني أكسيد الكربون عند توليد الكهرباء","ru":"при выработке не выделяется углекислый газ","en":"no carbon dioxide is released when generating electricity"},{"he":"היא עובדת גם בלילה","ar":"تعمل أيضًا ليلًا","ru":"работает и ночью","en":"it works at night too"},{"he":"היא לא עולה כסף כלל","ar":"لا تكلف مالًا أبدًا","ru":"она вообще бесплатна","en":"it costs nothing at all"},{"he":"היא נגמרת מהר","ar":"تنفد بسرعة","ru":"быстро заканчивается","en":"it runs out fast"}],"h":{"he":"מה נפלט כשפחם נשרף?","ar":"ماذا ينطلق عند حرق الفحم؟","ru":"Что выделяется при сжигании угля?","en":"What is released when coal burns?"},"y":{"he":"בייצור חשמל מהשמש אין שריפה. אבל היא תלויה באור ויש לה עלות להתקנה.","ar":"توليد الكهرباء من الشمس بلا حرق. لكنها تعتمد على الضوء ولها تكلفة تركيب.","ru":"При выработке из солнца нет горения. Но она зависит от света и требует затрат на установку.","en":"Solar power involves no burning. But it depends on light and has an installation cost."}},{"lv":3,"s":{"he":"בעיר יש הרבה שמש וגם הרבה בניינים. מה כדאי לשקול להפקת חשמל?","ar":"في مدينة شمس كثيرة ومبانٍ كثيرة. ماذا يُفضَّل أن نفكّر به لتوليد الكهرباء؟","ru":"В городе много солнца и много зданий. Что стоит рассмотреть для выработки электричества?","en":"A city has lots of sun and many buildings. What is worth considering for electricity?"},"o":[{"he":"פאנלים סולאריים על גגות","ar":"ألواح شمسية على الأسطح","ru":"солнечные панели на крышах","en":"solar panels on roofs"},{"he":"לשרוף עוד פחם","ar":"حرق مزيد من الفحم","ru":"жечь больше угля","en":"burn more coal"},{"he":"לא להשתמש בחשמל כלל","ar":"عدم استخدام الكهرباء مطلقًا","ru":"совсем не использовать электричество","en":"use no electricity at all"},{"he":"לחכות לנפט חדש","ar":"انتظار نفط جديد","ru":"ждать новой нефти","en":"wait for new oil"}],"h":{"he":"איזה משאב מתחדש יש בשפע שם?","ar":"أي مورد متجدد متوفر بكثرة هناك؟","ru":"Какой возобновляемый ресурс там в избытке?","en":"Which renewable resource is plentiful there?"},"y":{"he":"כשיש שמש ושטחי גגות פנויים, פאנלים סולאריים מנצלים אותם. צריך להשוות גם עלות והספק.","ar":"عند وفرة الشمس وأسطح فارغة تستغلها الألواح الشمسية. يجب مقارنة التكلفة والقدرة أيضًا.","ru":"При обилии солнца и свободных крыш панели используют их. Надо сравнить и стоимость, и мощность.","en":"With lots of sun and free roof space, solar panels use them. Compare cost and output too."}},{"lv":3,"s":{"he":"בניסוי נורה אחת נדלקת ועוד אחת במעגל זהה לא. מה כדאי לבדוק קודם?","ar":"في تجربة تضيء لمبة ولا تضيء أخرى في دارة مماثلة. ماذا نفحص أولًا؟","ru":"В опыте одна лампочка горит, другая в такой же цепи нет. Что проверить сначала?","en":"In an experiment one bulb lights and another in an identical circuit does not. What should we check first?"},"o":[{"he":"האם המעגל סגור וכל החיבורים מחוברים, והנורה תקינה","ar":"هل الدارة مغلقة وكل التوصيلات سليمة واللمبة صالحة","ru":"замкнута ли цепь, все ли соединения целы и исправна ли лампочка","en":"whether the circuit is closed, all connections are secure and the bulb works"},{"he":"לשנות את כל החומרים בבת אחת","ar":"نغيّر كل المواد دفعة واحدة","ru":"поменять все материалы сразу","en":"change all materials at once"},{"he":"להניח שהטבע טעה","ar":"نفترض أن الطبيعة أخطأت","ru":"считать, что природа ошиблась","en":"assume nature is wrong"},{"he":"להתעלם מהבעיה","ar":"نتجاهل المشكلة","ru":"игнорировать проблему","en":"ignore the problem"}],"h":{"he":"איפה יכול להיות פתח במעגל?","ar":"أين قد توجد فتحة في الدارة؟","ru":"Где может быть разрыв цепи?","en":"Where might the circuit have a gap?"},"y":{"he":"בודקים משתנה אחד בכל פעם: סגירות המעגל, חיבורים והנורה עצמה.","ar":"نفحص متغيّرًا واحدًا كل مرة: إغلاق الدارة والتوصيلات واللمبة نفسها.","ru":"Проверяют по одному параметру: замкнутость, соединения, саму лампочку.","en":"Check one variable at a time: circuit closure, connections, the bulb itself."}}]},{"id":"a4","grade":8,"t":{"he":"שינוי אקלים","ar":"تغيّر المناخ","ru":"Изменение климата","en":"Climate change"},"pred":{"s":{"he":"מה ההבדל בין מזג אוויר לאקלים?","ar":"ما الفرق بين الطقس والمناخ؟","ru":"Чем отличается погода от климата?","en":"What is the difference between weather and climate?"},"o":[{"he":"מזג אוויר הוא יום מסוים, ואקלים הוא דפוס לאורך שנים","ar":"الطقس يوم معيّن والمناخ نمط عبر سنوات","ru":"погода — конкретный день, климат — закономерность за годы","en":"weather is a particular day, climate is a pattern over years"},{"he":"אין הבדל","ar":"لا فرق","ru":"разницы нет","en":"there is no difference"},{"he":"אקלים הוא ליום אחד","ar":"المناخ ليوم واحد","ru":"климат на один день","en":"climate is for one day"},{"he":"מזג אוויר נמשך עשרות שנים","ar":"الطقس يستمر عشرات السنين","ru":"погода длится десятилетиями","en":"weather lasts decades"}]},"lessons":[{"t":{"he":"אפקט החממה","ar":"تأثير الدفيئة","ru":"Парниковый эффект","en":"The greenhouse effect"},"phen":{"he":"מכונית חונה בשמש ונעשית חמה בפנים. למה האוויר בתוכה חם יותר מאשר בחוץ?","ar":"سيارة واقفة في الشمس ساخنة من الداخل. لماذا الهواء داخلها أسخن؟","ru":"Машина на солнце нагрета внутри. Почему воздух внутри теплее, чем снаружи?","en":"A car parked in the sun is hot inside. Why is the air inside warmer than outside?"},"concept":{"he":"אור השמש מחמם את כדור הארץ. גזים באטמוספרה, כמו פחמן דו-חמצני ומתאן, לוכדים חלק מהחום ושומרים עלינו חמים. זה אפקט החממה הטבעי, והוא הכרחי לחיים. כשאנחנו מוסיפים עוד גזים, כדור הארץ מתחמם יותר.","ar":"ضوء الشمس يسخّن الأرض. غازات في الغلاف الجوي مثل ثاني أكسيد الكربون والميثان تحبس جزءًا من الحرارة وتبقينا دافئين. هذا تأثير الدفيئة الطبيعي وهو ضروري للحياة. عندما نضيف غازات أكثر تسخن الأرض أكثر.","ru":"Солнечный свет нагревает Землю. Газы в атмосфере, такие как углекислый газ и метан, удерживают часть тепла и согревают нас. Это природный парниковый эффект, он необходим для жизни. Когда мы добавляем газов, Земля нагревается сильнее.","en":"Sunlight warms Earth. Gases in the atmosphere, such as carbon dioxide and methane, trap some heat and keep us warm. This is the natural greenhouse effect, and life needs it. When we add more of these gases, Earth warms more."},"steps":[{"he":"מתארים: אור מגיע ומחמם את הקרקע.","ar":"نصف: يصل الضوء ويسخّن الأرض.","ru":"Описываем: свет приходит и нагревает поверхность.","en":"Describe: light arrives and warms the ground."},{"he":"מוסיפים: הקרקע שולחת חום, וגזים לוכדים חלק.","ar":"نضيف: الأرض ترسل حرارة وغازات تحبس جزءًا.","ru":"Добавляем: поверхность отдаёт тепло, газы удерживают часть.","en":"Add: the ground sends heat back and gases trap some."},{"he":"מסבירים מה קורה כשיש יותר גזים.","ar":"نشرح ما يحدث مع غازات أكثر.","ru":"Объясняем, что будет при большем количестве газов.","en":"Explain what happens with more gases."}],"qs":[{"lv":1,"s":{"he":"מה אפקט החממה הטבעי עושה?","ar":"ماذا يفعل تأثير الدفيئة الطبيعي؟","ru":"Что делает природный парниковый эффект?","en":"What does the natural greenhouse effect do?"},"o":[{"he":"שומר על כדור הארץ חם מספיק לחיים","ar":"يبقي الأرض دافئة بما يكفي للحياة","ru":"сохраняет Землю достаточно тёплой для жизни","en":"keeps Earth warm enough for life"},{"he":"הורס את כדור הארץ תמיד","ar":"يدمّر الأرض دائمًا","ru":"всегда разрушает Землю","en":"always destroys Earth"},{"he":"מקרר את כדור הארץ","ar":"يبرّد الأرض","ru":"охлаждает Землю","en":"cools Earth"},{"he":"מייצר אור","ar":"يصنع ضوءًا","ru":"создаёт свет","en":"makes light"}],"h":{"he":"מה היה קורה בלי אטמוספרה?","ar":"ماذا يحدث بلا غلاف جوي؟","ru":"Что было бы без атмосферы?","en":"What if there were no atmosphere?"},"y":{"he":"אפקט החממה הטבעי הכרחי. הבעיה היא הגברה שלו על ידי פעילות אדם.","ar":"تأثير الدفيئة الطبيعي ضروري. المشكلة في تضخيمه بنشاط الإنسان.","ru":"Природный эффект необходим. Проблема в его усилении человеческой деятельностью.","en":"The natural effect is needed. The problem is humans strengthening it."}},{"lv":2,"s":{"he":"איזה גז גורם לחיזוק אפקט החממה כששורפים דלק?","ar":"أي غاز يعزّز تأثير الدفيئة عند حرق الوقود؟","ru":"Какой газ усиливает парниковый эффект при сжигании топлива?","en":"Which gas strengthens the greenhouse effect when fuel burns?"},"o":[{"he":"פחמן דו-חמצני","ar":"ثاني أكسيد الكربون","ru":"углекислый газ","en":"carbon dioxide"},{"he":"חנקן","ar":"نيتروجين","ru":"азот","en":"nitrogen"},{"he":"הליום","ar":"هيليوم","ru":"гелий","en":"helium"},{"he":"אדי מים בלבד","ar":"بخار الماء فقط","ru":"только водяной пар","en":"water vapor only"}],"h":{"he":"מה נפלט מארובה ומאגזוז?","ar":"ماذا ينطلق من المداخن والعوادم؟","ru":"Что выходит из труб и выхлопа?","en":"What comes out of chimneys and exhaust?"},"y":{"he":"שריפת דלק פולטת פחמן דו-חמצני, גז חממה עיקרי.","ar":"حرق الوقود يطلق ثاني أكسيد الكربون وهو غاز دفيئة رئيسي.","ru":"Сжигание топлива выделяет углекислый газ, главный парниковый газ.","en":"Burning fuel releases carbon dioxide, a main greenhouse gas."}}]},{"t":{"he":"שינוי אקלים והתמודדות","ar":"تغيّر المناخ والتعامل معه","ru":"Изменение климата и меры","en":"Climate change and responses"},"phen":{"he":"בעשורים האחרונים הטמפרטורה הממוצעת בעולם עולה. מה ההשלכות?","ar":"في العقود الأخيرة ترتفع درجة الحرارة العالمية. ما النتائج؟","ru":"В последние десятилетия средняя температура в мире растёт. Каковы последствия?","en":"In recent decades the world's average temperature has risen. What follows?"},"concept":{"he":"התחממות עולמית גורמת לגל חום, לשינוי בגשמים, להמסת קרחונים ולעליית פני הים. יש דרכים להפחית את הבעיה: לחסוך חשמל, להשתמש באנרגיה מתחדשת, לנסוע פחות במכונית פרטית ולשמור על צמחייה. מדענים משתמשים בנתונים ובמודלים כדי להעריך ולא רק בדעות.","ar":"الاحترار العالمي يسبب موجات حر وتغيّرًا في الأمطار وذوبان الجليد وارتفاع البحر. هناك طرق لتخفيف المشكلة: توفير الكهرباء واستعمال طاقة متجددة والتنقل بالسيارة الخاصة أقل والحفاظ على النباتات. يستخدم العلماء بيانات ونماذج وليس آراء فقط.","ru":"Глобальное потепление вызывает волны жары, изменение осадков, таяние ледников и подъём уровня моря. Есть способы уменьшить проблему: экономить электричество, использовать возобновляемую энергию, реже ездить на личной машине, сохранять растительность. Учёные опираются на данные и модели, а не только на мнения.","en":"Global warming causes heat waves, changing rainfall, melting glaciers and rising seas. We can reduce the problem: save electricity, use renewable energy, drive less in private cars and protect vegetation. Scientists rely on data and models, not just opinions."},"steps":[{"he":"מסתכלים בגרף של טמפרטורה לאורך שנים.","ar":"ننظر إلى رسم الحرارة عبر السنين.","ru":"Смотрим на график температуры по годам.","en":"Look at a temperature graph over years."},{"he":"מזהים מגמה: עולה, יורדת או יציבה.","ar":"نحدّد الاتجاه: صاعد أم هابط أم ثابت.","ru":"Определяем тенденцию: растёт, падает или стабильна.","en":"Spot the trend: rising, falling or steady."},{"he":"מציעים פעולה אחת שלנו שמפחיתה פליטות.","ar":"نقترح عملًا واحدًا منا يقلل الانبعاثات.","ru":"Предлагаем одно наше действие, снижающее выбросы.","en":"Suggest one action of ours that reduces emissions."}],"qs":[{"lv":1,"s":{"he":"איזו פעולה עוזרת להפחית פליטות?","ar":"أي عمل يساعد على تقليل الانبعاثات؟","ru":"Какое действие помогает снизить выбросы?","en":"Which action helps reduce emissions?"},"o":[{"he":"לכבות אורות שלא צריך","ar":"إطفاء الأضواء غير اللازمة","ru":"выключать ненужный свет","en":"turn off lights you do not need"},{"he":"להדליק מזגן בלי סיבה","ar":"تشغيل المكيّف بلا سبب","ru":"включать кондиционер без причины","en":"run the AC for no reason"},{"he":"לשרוף יותר פסולת","ar":"حرق مزيد من النفايات","ru":"сжигать больше мусора","en":"burn more waste"},{"he":"לשפוך מים","ar":"سكب الماء","ru":"лить воду","en":"pour out water"}],"h":{"he":"איך חיסכון בחשמל קשור לפחם?","ar":"كيف يرتبط توفير الكهرباء بالفحم؟","ru":"Как экономия электричества связана с углём?","en":"How is saving electricity related to coal?"},"y":{"he":"פחות חשמל אומר פחות שריפת דלק בתחנות כוח, ולכן פחות פחמן דו-חמצני.","ar":"كهرباء أقل تعني حرقًا أقل للوقود في المحطات فينبعث ثاني أكسيد كربون أقل.","ru":"Меньше электричества — меньше сжигания топлива на станциях, значит меньше углекислого газа.","en":"Less electricity means less fuel burned in power stations, so less carbon dioxide."}},{"lv":2,"s":{"he":"גרף מראה טמפרטורה ממוצעת שעולה לאורך 50 שנה. מה מסיקים?","ar":"رسم يبيّن حرارة وسطية ترتفع على مدى 50 سنة. ماذا نستنتج؟","ru":"График показывает рост средней температуры за 50 лет. Какой вывод?","en":"A graph shows an average temperature rising over 50 years. What do we conclude?"},"o":[{"he":"יש מגמת התחממות לאורך זמן","ar":"هناك اتجاه احترار عبر الزمن","ru":"есть тенденция потепления со временем","en":"there is a warming trend over time"},{"he":"בכל יום חם יותר מאתמול","ar":"كل يوم أسخن من الأمس","ru":"каждый день теплее вчерашнего","en":"every day is hotter than yesterday"},{"he":"הטמפרטורה תמיד יציבה","ar":"الحرارة دائمًا ثابتة","ru":"температура всегда стабильна","en":"temperature is always steady"},{"he":"אין מה ללמוד","ar":"لا شيء نتعلمه","ru":"узнать нечего","en":"nothing can be learned"}],"h":{"he":"האם זה על יום אחד או על שנים?","ar":"هل هو عن يوم أم عن سنوات؟","ru":"Речь об одном дне или о годах?","en":"Is it about one day or many years?"},"y":{"he":"מגמה נקבעת מנתונים לאורך זמן. יום קר אחד אינו מבטל מגמה.","ar":"الاتجاه يُحدَّد من بيانات عبر زمن. يوم بارد لا يلغي الاتجاه.","ru":"Тенденцию определяют по данным за долгое время. Один холодный день её не отменяет.","en":"A trend comes from data over time. One cold day does not cancel a trend."}}]}],"practice":[{"lv":1,"s":{"he":"איזה גז מייצרים עצים כשהם עושים פוטוסינתזה?","ar":"أي غاز تنتجه الأشجار في البناء الضوئي؟","ru":"Какой газ выделяют деревья при фотосинтезе?","en":"Which gas do trees produce in photosynthesis?"},"o":[{"he":"חמצן","ar":"أكسجين","ru":"кислород","en":"oxygen"},{"he":"פחמן דו-חמצני","ar":"ثاني أكسيد الكربون","ru":"углекислый газ","en":"carbon dioxide"},{"he":"מתאן","ar":"ميثان","ru":"метан","en":"methane"},{"he":"חנקן","ar":"نيتروجين","ru":"азот","en":"nitrogen"}],"h":{"he":"מה הם קולטים ומה פולטים?","ar":"ماذا يمتصون وماذا يطلقون؟","ru":"Что они поглощают и что выделяют?","en":"What do they take in and what do they give out?"},"y":{"he":"עצים קולטים פחמן דו-חמצני ופולטים חמצן, ולכן צמחייה עוזרת לאיזון.","ar":"الأشجار تمتص ثاني أكسيد الكربون وتطلق الأكسجين لذلك تساعد النباتات التوازن.","ru":"Деревья поглощают углекислый газ и выделяют кислород, поэтому растительность помогает равновесию.","en":"Trees take in carbon dioxide and release oxygen, so vegetation helps the balance."}},{"lv":1,"s":{"he":"מה משמעות המילה אקלים?","ar":"ما معنى كلمة المناخ؟","ru":"Что означает слово «климат»?","en":"What does climate mean?"},"o":[{"he":"דפוס מזג אוויר לאורך שנים באזור","ar":"نمط طقس عبر سنوات في منطقة","ru":"закономерность погоды в районе за годы","en":"a region's weather pattern over years"},{"he":"מזג האוויר של אתמול","ar":"طقس الأمس","ru":"вчерашняя погода","en":"yesterday's weather"},{"he":"תחזית ליום אחד","ar":"توقع ليوم واحد","ru":"прогноз на один день","en":"a one-day forecast"},{"he":"כמות גשם אחת","ar":"كمية مطر واحدة","ru":"одно количество дождя","en":"one rain amount"}],"h":{"he":"כמה זמן צריך למדוד?","ar":"كم من الزمن يلزم للقياس؟","ru":"Сколько времени надо измерять?","en":"How long do we need to measure?"},"y":{"he":"אקלים מתייחס לתבנית ארוכה, ולכן לא משתנה מיום ליום.","ar":"المناخ يخص نمطًا طويلًا فلا يتغيّر من يوم لآخر.","ru":"Климат — длинная закономерность, он не меняется ото дня ко дню.","en":"Climate is a long pattern, so it does not change day to day."}},{"lv":2,"s":{"he":"מה גורם לעליית פני הים?","ar":"ما سبب ارتفاع مستوى البحر؟","ru":"Что вызывает подъём уровня моря?","en":"What causes sea levels to rise?"},"o":[{"he":"המסת קרחונים והתפשטות מים חמים","ar":"ذوبان الأنهار الجليدية وتمدد الماء الساخن","ru":"таяние ледников и расширение тёплой воды","en":"melting glaciers and warm water expanding"},{"he":"הרבה גשם ביום אחד","ar":"أمطار كثيرة في يوم واحد","ru":"много дождя за один день","en":"a lot of rain in one day"},{"he":"ירח מלא","ar":"قمر مكتمل","ru":"полнолуние","en":"a full moon"},{"he":"רוח חזקה","ar":"ريح قوية","ru":"сильный ветер","en":"strong wind"}],"h":{"he":"מה קורה לקרח יבשתי כשהוא נמס?","ar":"ماذا يحدث للجليد البري عند ذوبانه؟","ru":"Что с ледником на суше, когда он тает?","en":"What happens to land ice when it melts?"},"y":{"he":"קרח שמתמוסס מיבשה זורם לים, והמים החמים תופסים נפח גדול יותר.","ar":"الجليد الذائب من اليابسة يصب في البحر والماء الساخن يشغل حجمًا أكبر.","ru":"Растаявший ледник стекает в море, а тёплая вода занимает больший объём.","en":"Melted land ice flows into the sea and warm water takes up more volume."}},{"lv":2,"s":{"he":"מי מהבאים הוא פעולה אישית שמפחיתה פליטות?","ar":"أيٌّ مما يلي عمل شخصي يقلل الانبعاثات؟","ru":"Что из перечисленного — личное действие для снижения выбросов?","en":"Which is a personal action that reduces emissions?"},"o":[{"he":"ללכת ברגל או לנסוע באוטובוס לקרוב","ar":"المشي أو ركوب الحافلة للمسافات القريبة","ru":"ходить пешком или ездить автобусом на близкие расстояния","en":"walking or taking the bus for short trips"},{"he":"לנסוע לבד ברכב לכל מקום","ar":"القيادة وحدك إلى كل مكان","ru":"ездить одному на машине везде","en":"driving alone everywhere"},{"he":"להשאיר מכשירים דולקים","ar":"ترك الأجهزة مشغّلة","ru":"оставлять приборы включёнными","en":"leaving devices on"},{"he":"לזרוק פסולת בטבע","ar":"رمي النفايات في الطبيعة","ru":"выбрасывать мусор в природе","en":"dumping waste outdoors"}],"h":{"he":"מה פולט פחות פחמן דו-חמצני לנוסע?","ar":"ما الذي يطلق ثاني أكسيد كربون أقل لكل راكب؟","ru":"Что выбрасывает меньше углекислого газа на человека?","en":"What emits less carbon dioxide per person?"},"y":{"he":"הליכה ותחבורה ציבורית פולטות פחות לנוסע מאשר נסיעה פרטית.","ar":"المشي والمواصلات العامة تطلق أقل لكل شخص من السيارة الخاصة.","ru":"Ходьба и общественный транспорт дают меньше выбросов на человека, чем личная машина.","en":"Walking and public transport emit less per person than a private car."}},{"lv":3,"s":{"he":"מישהו אומר: \"היה קר אתמול, אז אין התחממות\". מה שגוי בטיעון?","ar":"يقول شخص: «كان باردًا أمس فلا احترار». ما الخطأ في الحجة؟","ru":"Кто-то говорит: «вчера было холодно, значит потепления нет». Что неверно в аргументе?","en":"Someone says: \"it was cold yesterday so there is no warming.\" What is wrong?"},"o":[{"he":"יום אחד הוא מזג אוויר ולא מגמה אקלימית","ar":"يوم واحد طقس وليس اتجاهًا مناخيًا","ru":"один день — погода, а не климатическая тенденция","en":"one day is weather, not a climate trend"},{"he":"אין שום בעיה בטיעון","ar":"لا مشكلة في الحجة","ru":"в аргументе нет проблем","en":"there is nothing wrong"},{"he":"קור מוכיח התחממות","ar":"البرد يثبت الاحترار","ru":"холод доказывает потепление","en":"cold proves warming"},{"he":"כי אתמול לא היה אמיתי","ar":"لأن أمس لم يكن حقيقيًا","ru":"потому что вчерашнего дня не было","en":"because yesterday was not real"}],"h":{"he":"כמה שנים של נתונים צריך?","ar":"كم سنة من البيانات يلزم؟","ru":"Сколько лет данных нужно?","en":"How many years of data are needed?"},"y":{"he":"הכללת יתר מיום בודד מתעלמת מנתונים רבים. אקלים נבחן לאורך עשורים.","ar":"التعميم من يوم واحد يتجاهل بيانات كثيرة. المناخ يُقاس عبر عقود.","ru":"Обобщение по одному дню игнорирует множество данных. Климат оценивают по десятилетиям.","en":"Over-generalizing from one day ignores lots of data. Climate is judged over decades."}},{"lv":3,"s":{"he":"ארגון מציג גרף שמראה רק 3 שנים קרות כדי לטעון שאין התחממות. מה עדיף לבקש?","ar":"منظمة تعرض رسمًا يبيّن 3 سنوات باردة فقط لتزعم عدم وجود احترار. ماذا نطلب؟","ru":"Организация показывает график только из трёх холодных лет, чтобы доказать отсутствие потепления. Что лучше запросить?","en":"A group shows a graph with only 3 cold years to claim there is no warming. What is better to ask for?"},"o":[{"he":"נתונים של עשרות שנים ומקור אמין","ar":"بيانات عشرات السنين ومصدر موثوق","ru":"данные за десятилетия и надёжный источник","en":"data over decades and a reliable source"},{"he":"להאמין להם","ar":"أن نصدّقهم","ru":"поверить им","en":"believe them"},{"he":"לא לבדוק","ar":"ألا نفحص","ru":"не проверять","en":"do not check"},{"he":"לחפש רק גרפים שמתאימים לנו","ar":"نبحث عن رسوم تناسبنا فقط","ru":"искать только подходящие графики","en":"look only for graphs we like"}],"h":{"he":"האם הנתונים נבחרו בהטיה?","ar":"هل اختيرت البيانات بتحيّز؟","ru":"Подобраны ли данные предвзято?","en":"Were the data picked in a biased way?"},"y":{"he":"בחירת נתונים סלקטיבית מטעה. צריך תקופה ארוכה ומקור שאפשר לבדוק.","ar":"اختيار البيانات الانتقائي مضلل. يلزم زمن طويل ومصدر يمكن فحصه.","ru":"Выборочный подбор данных вводит в заблуждение. Нужны длинный период и проверяемый источник.","en":"Cherry-picking data misleads. We need a long period and a checkable source."}}]},{"id":"b1","grade":9,"t":{"he":"קשרים ותהליכים כימיים","ar":"الروابط والعمليات الكيميائية","ru":"Химические связи и процессы","en":"Chemical bonds and processes"},"pred":{"s":{"he":"מה קורה לאטומים בתגובה כימית?","ar":"ماذا يحدث للذرات في التفاعل الكيميائي؟","ru":"Что происходит с атомами в химической реакции?","en":"What happens to atoms in a chemical reaction?"},"o":[{"he":"הם מסתדרים מחדש ויוצרים חומרים חדשים","ar":"تُعاد ترتيبها فتتكوّن مواد جديدة","ru":"они перестраиваются и образуют новые вещества","en":"they rearrange to make new substances"},{"he":"הם נעלמים","ar":"تختفي","ru":"они исчезают","en":"they disappear"},{"he":"הם הופכים לאנרגיה בלבד","ar":"تصير طاقة فقط","ru":"они становятся только энергией","en":"they turn into energy only"},{"he":"הם מוכפלים","ar":"تتضاعف","ru":"они удваиваются","en":"they double"}]},"lessons":[{"t":{"he":"תגובה כימית ושימור המסה","ar":"التفاعل الكيميائي وحفظ الكتلة","ru":"Химическая реакция и сохранение массы","en":"A chemical reaction and conservation of mass"},"phen":{"he":"מתכת חלודה, נר נשרף, ולחם נאפה. מה משותף?","ar":"حديد يصدأ وشمعة تحترق وخبز يُخبز. ما المشترك؟","ru":"Железо ржавеет, свеча горит, хлеб печётся. Что общего?","en":"Iron rusts, a candle burns, bread bakes. What is common?"},"concept":{"he":"בתגובה כימית חומרי המוצא (המגיבים) הופכים לחומרים חדשים (התוצרים). האטומים לא נוצרים ולא נעלמים, הם רק מסתדרים מחדש. לכן מסת המגיבים שווה למסת התוצרים. אפשר לכתוב: מגיבים ← תוצרים.","ar":"في التفاعل الكيميائي تتحول المواد الأولية (المتفاعلات) إلى مواد جديدة (النواتج). الذرات لا تُخلق ولا تفنى بل تُعاد ترتيبها. لذلك كتلة المتفاعلات تساوي كتلة النواتج. نكتب: متفاعلات ← نواتج.","ru":"В химической реакции исходные вещества (реагенты) превращаются в новые (продукты). Атомы не создаются и не исчезают, а перестраиваются. Поэтому масса реагентов равна массе продуктов. Пишем: реагенты → продукты.","en":"In a chemical reaction the starting substances (reactants) become new substances (products). Atoms are not created or destroyed, only rearranged. So the mass of reactants equals the mass of products. We write: reactants → products."},"steps":[{"he":"מזהים מה היה לפני: המגיבים.","ar":"نحدّد ما كان قبل: المتفاعلات.","ru":"Определяем, что было до: реагенты.","en":"Identify what was before: the reactants."},{"he":"מזהים מה נוצר: התוצרים.","ar":"نحدّد ما تكوّن: النواتج.","ru":"Определяем, что образовалось: продукты.","en":"Identify what formed: the products."},{"he":"סופרים אטומים משני הצדדים ובודקים שהם שווים.","ar":"نعدّ الذرات على الجانبين ونتأكد من تساويها.","ru":"Считаем атомы с обеих сторон и проверяем равенство.","en":"Count atoms on both sides and check they match."}],"qs":[{"lv":1,"s":{"he":"מה הם התוצרים בתגובה?","ar":"ما هي النواتج في التفاعل؟","ru":"Что такое продукты реакции?","en":"What are the products of a reaction?"},"o":[{"he":"החומרים החדשים שנוצרים","ar":"المواد الجديدة التي تتكوّن","ru":"новые образовавшиеся вещества","en":"the new substances that form"},{"he":"החומרים שהיו בהתחלה","ar":"المواد التي كانت في البداية","ru":"вещества, бывшие в начале","en":"the substances at the start"},{"he":"הכלים במעבדה","ar":"أدوات المختبر","ru":"лабораторная посуда","en":"the lab tools"},{"he":"האנרגיה בלבד","ar":"الطاقة فقط","ru":"только энергия","en":"energy only"}],"h":{"he":"מה כתוב אחרי החץ?","ar":"ماذا يُكتب بعد السهم؟","ru":"Что пишется после стрелки?","en":"What is written after the arrow?"},"y":{"he":"מגיבים הם חומרי ההתחלה, ותוצרים הם החומרים החדשים.","ar":"المتفاعلات مواد البداية والنواتج المواد الجديدة.","ru":"Реагенты — исходные вещества, продукты — новые.","en":"Reactants are the starting materials and products are the new ones."}},{"lv":2,"s":{"he":"מסת המגיבים 20 גרם בצנצנת סגורה. מה מסת התוצרים?","ar":"كتلة المتفاعلات 20 غرامًا في برطمان مغلق. ما كتلة النواتج؟","ru":"Масса реагентов 20 г в закрытой банке. Какова масса продуктов?","en":"Reactants are 20 g in a closed jar. What is the mass of the products?"},"o":[{"he":"20 גרם","ar":"20 غرامًا","ru":"20 г","en":"20 g"},{"he":"10 גרם","ar":"10 غرامات","ru":"10 г","en":"10 g"},{"he":"40 גרם","ar":"40 غرامًا","ru":"40 г","en":"40 g"},{"he":"0 גרם","ar":"0 غرام","ru":"0 г","en":"0 g"}],"h":{"he":"האם משהו יכול לצאת או להיכנס?","ar":"هل يمكن لشيء أن يخرج أو يدخل؟","ru":"Может ли что-то выйти или войти?","en":"Can anything leave or enter?"},"y":{"he":"במערכת סגורה מסה נשמרת, כי אותם אטומים רק מסתדרים מחדש.","ar":"في نظام مغلق تُحفظ الكتلة لأن الذرات نفسها فقط يُعاد ترتيبها.","ru":"В закрытой системе масса сохраняется, ведь те же атомы лишь перестраиваются.","en":"In a closed system mass is conserved because the same atoms are just rearranged."}}]},{"t":{"he":"קשר יוני ותרכובות","ar":"الرابطة الأيونية والمركبات","ru":"Ионная связь и соединения","en":"Ionic bonds and compounds"},"phen":{"he":"מלח שולחן הוא חומר שונה מאוד מהמתכת נתרן ומהגז כלור. איך נוצר?","ar":"ملح الطعام مادة مختلفة جدًا عن فلز الصوديوم وغاز الكلور. كيف تكوّن؟","ru":"Поваренная соль очень отличается от металла натрия и газа хлора. Как она образовалась?","en":"Table salt is very different from the metal sodium and the gas chlorine. How did it form?"},"concept":{"he":"בקשר יוני אטום מוסר אלקטרון לאטום אחר. מי שמוסר נעשה חיובי (יון חיובי), ומי שמקבל נעשה שלילי. מטענים מנוגדים מושכים זה את זה וכך נוצר קשר. תרכובת היא חומר מאטומים של יותר מיסוד אחד, כמו מלח (NaCl).","ar":"في الرابطة الأيونية تعطي ذرة إلكترونًا لذرة أخرى. التي تعطي تصبح موجبة (أيون موجب) والتي تأخذ تصبح سالبة. الشحنات المتعاكسة تتجاذب فتتكوّن رابطة. المركّب مادة من ذرات أكثر من عنصر مثل الملح (NaCl).","ru":"В ионной связи один атом отдаёт электрон другому. Отдавший становится положительным (положительный ион), принявший — отрицательным. Противоположные заряды притягиваются, так возникает связь. Соединение — вещество из атомов более чем одного элемента, как соль (NaCl).","en":"In an ionic bond one atom gives an electron to another. The giver becomes positive (a positive ion) and the receiver negative. Opposite charges attract, forming the bond. A compound is made of atoms of more than one element, like salt (NaCl)."},"steps":[{"he":"מזהים מי מוסר ומי מקבל אלקטרון.","ar":"نحدّد من يعطي ومن يأخذ إلكترونًا.","ru":"Определяем, кто отдаёт и кто принимает электрон.","en":"Find who gives and who takes an electron."},{"he":"כותבים את המטען של כל יון.","ar":"نكتب شحنة كل أيون.","ru":"Записываем заряд каждого иона.","en":"Write each ion's charge."},{"he":"בודקים שהמטען הכולל אפס.","ar":"نتحقق أن الشحنة الكلية صفر.","ru":"Проверяем, что общий заряд равен нулю.","en":"Check the total charge is zero."}],"qs":[{"lv":1,"s":{"he":"מה קורה באטום שמוסר אלקטרון?","ar":"ماذا يحدث للذرة التي تعطي إلكترونًا؟","ru":"Что происходит с атомом, отдавшим электрон?","en":"What happens to an atom that gives away an electron?"},"o":[{"he":"הוא נעשה יון חיובי","ar":"يصبح أيونًا موجبًا","ru":"становится положительным ионом","en":"it becomes a positive ion"},{"he":"הוא נעשה יון שלילי","ar":"يصبح أيونًا سالبًا","ru":"становится отрицательным ионом","en":"it becomes a negative ion"},{"he":"הוא נעלם","ar":"يختفي","ru":"исчезает","en":"it vanishes"},{"he":"הוא נשאר ניטרלי","ar":"يبقى متعادلًا","ru":"остаётся нейтральным","en":"it stays neutral"}],"h":{"he":"איזה מטען יצא ממנו?","ar":"أي شحنة غادرته؟","ru":"Какой заряд ушёл?","en":"What charge left it?"},"y":{"he":"כשיוצא מטען שלילי, נשאר עודף חיובי.","ar":"عندما تخرج شحنة سالبة يبقى فائض موجب.","ru":"Когда уходит отрицательный заряд, остаётся избыток положительного.","en":"When a negative charge leaves, a positive excess remains."}},{"lv":2,"s":{"he":"למה קשר יוני מחזיק?","ar":"لماذا تثبت الرابطة الأيونية؟","ru":"Почему держится ионная связь?","en":"Why does an ionic bond hold?"},"o":[{"he":"מטענים מנוגדים מושכים זה את זה","ar":"الشحنات المتعاكسة تتجاذب","ru":"противоположные заряды притягиваются","en":"opposite charges attract each other"},{"he":"אותו מטען מושך","ar":"الشحنة نفسها تجذب","ru":"одинаковые заряды притягиваются","en":"same charges attract"},{"he":"האטומים נדבקים בדבק","ar":"تلتصق الذرات بالصمغ","ru":"атомы склеены клеем","en":"atoms are glued"},{"he":"הם נמצאים בקרבת מגנט","ar":"هي قرب مغناطيس","ru":"они около магнита","en":"they are near a magnet"}],"h":{"he":"מה אפשר לומר על מטען חיובי ושלילי?","ar":"ماذا نقول عن شحنة موجبة وسالبة؟","ru":"Что сказать о положительном и отрицательном заряде?","en":"What can we say about positive and negative charges?"},"y":{"he":"יון חיובי ויון שלילי נמשכים זה לזה, וזה הקשר היוני.","ar":"الأيون الموجب والسالب يتجاذبان وهذه هي الرابطة الأيونية.","ru":"Положительный и отрицательный ионы притягиваются, это и есть ионная связь.","en":"A positive and a negative ion attract each other, and that is the ionic bond."}}]}],"practice":[{"lv":1,"s":{"he":"איזה מהבאים הוא תרכובת?","ar":"أي مما يلي مركّب؟","ru":"Что из этого — соединение?","en":"Which of these is a compound?"},"o":[{"he":"מלח NaCl","ar":"ملح NaCl","ru":"соль NaCl","en":"salt NaCl"},{"he":"חמצן O₂","ar":"أكسجين O₂","ru":"кислород O₂","en":"oxygen O₂"},{"he":"ברזל טהור","ar":"حديد نقي","ru":"чистое железо","en":"pure iron"},{"he":"הליום","ar":"هيليوم","ru":"гелий","en":"helium"}],"h":{"he":"כמה יסודות שונים יש בו?","ar":"كم عنصرًا مختلفًا فيه؟","ru":"Сколько в нём разных элементов?","en":"How many different elements does it hold?"},"y":{"he":"תרכובת בנויה מיותר מיסוד אחד, כמו Na ו-Cl.","ar":"المركّب مبني من أكثر من عنصر مثل Na وCl.","ru":"Соединение состоит из более чем одного элемента, как Na и Cl.","en":"A compound has more than one element, such as Na and Cl."}},{"lv":1,"s":{"he":"מה נכון לגבי אטומים בתגובה כימית?","ar":"ما الصحيح عن الذرات في التفاعل الكيميائي؟","ru":"Что верно об атомах в химической реакции?","en":"What is true about atoms in a chemical reaction?"},"o":[{"he":"הם לא נעלמים","ar":"لا تختفي","ru":"они не исчезают","en":"they do not disappear"},{"he":"הם נוצרים מחדש","ar":"تُخلق من جديد","ru":"они создаются заново","en":"they are made new"},{"he":"הם הופכים ליסוד אחר","ar":"تتحول إلى عنصر آخر","ru":"они становятся другим элементом","en":"they turn into another element"},{"he":"הם נעלמים בתוצרים","ar":"تختفي في النواتج","ru":"они исчезают в продуктах","en":"they vanish in the products"}],"h":{"he":"כמה אטומים היו וכמה נשארו?","ar":"كم ذرة كانت وكم بقيت؟","ru":"Сколько атомов было и сколько осталось?","en":"How many atoms were there and how many remain?"},"y":{"he":"אטומים נשמרים בתגובה. רק הקשרים ביניהם משתנים.","ar":"الذرات تُحفظ في التفاعل. فقط الروابط بينها تتغيّر.","ru":"Атомы сохраняются в реакции. Меняются лишь связи между ними.","en":"Atoms are conserved in a reaction. Only the bonds between them change."}},{"lv":2,"s":{"he":"נתרן נותן אלקטרון לכלור. מה נוצר?","ar":"الصوديوم يعطي إلكترونًا للكلور. ماذا يتكوّن؟","ru":"Натрий отдаёт электрон хлору. Что образуется?","en":"Sodium gives an electron to chlorine. What forms?"},"o":[{"he":"יון Na⁺ ויון Cl⁻","ar":"أيون Na⁺ وأيون Cl⁻","ru":"ион Na⁺ и ион Cl⁻","en":"an Na⁺ ion and a Cl⁻ ion"},{"he":"שני יונים חיוביים","ar":"أيونان موجبان","ru":"два положительных иона","en":"two positive ions"},{"he":"שני אטומים ניטרליים","ar":"ذرتان متعادلتان","ru":"два нейтральных атома","en":"two neutral atoms"},{"he":"שני יונים שליליים","ar":"أيونان سالبان","ru":"два отрицательных иона","en":"two negative ions"}],"h":{"he":"מי איבד ומי קיבל אלקטרון?","ar":"من فقد ومن اكتسب إلكترونًا؟","ru":"Кто потерял и кто получил электрон?","en":"Who lost and who gained an electron?"},"y":{"he":"הנותן נעשה חיובי והמקבל שלילי. הם נקשרים בקשר יוני ונוצר מלח.","ar":"المعطي يصير موجبًا والآخذ سالبًا. يرتبطان برابطة أيونية فيتكوّن ملح.","ru":"Отдавший становится положительным, принявший — отрицательным. Они связаны ионной связью — образуется соль.","en":"The giver is positive and the receiver negative. They bond ionically and make salt."}},{"lv":2,"s":{"he":"בתגובה: 10 גרם מגיב א׳ ועוד 6 גרם מגיב ב׳ הגיבו בכלי סגור. מה מסת התוצרים?","ar":"في تفاعل: 10 غرامات متفاعل أ و6 غرامات متفاعل ب في وعاء مغلق. ما كتلة النواتج؟","ru":"В реакции: 10 г реагента А и 6 г реагента Б в закрытом сосуде. Какова масса продуктов?","en":"In a reaction 10 g of reactant A and 6 g of reactant B react in a closed vessel. What is the mass of the products?"},"o":[{"he":"16 גרם","ar":"16 غرامًا","ru":"16 г","en":"16 g"},{"he":"4 גרם","ar":"4 غرامات","ru":"4 г","en":"4 g"},{"he":"10 גרם","ar":"10 غرامات","ru":"10 г","en":"10 g"},{"he":"60 גרם","ar":"60 غرامًا","ru":"60 г","en":"60 g"}],"h":{"he":"מה סכום המגיבים?","ar":"ما مجموع المتفاعلات؟","ru":"Какова сумма реагентов?","en":"What is the sum of the reactants?"},"y":{"he":"מסת התוצרים שווה לסכום מסות המגיבים: 10 ועוד 6 הם 16.","ar":"كتلة النواتج تساوي مجموع كتل المتفاعلات: 10 زائد 6 يساوي 16.","ru":"Масса продуктов равна сумме масс реагентов: 10 плюс 6 — 16.","en":"Product mass equals the sum of reactant masses: 10 plus 6 is 16."}},{"lv":3,"s":{"he":"בתגובה בכלי פתוח המסה ירדה. האם המסה לא נשמרת?","ar":"في تفاعل بوعاء مفتوح نقصت الكتلة. هل لا تُحفظ الكتلة؟","ru":"В открытом сосуде масса уменьшилась. Значит, масса не сохраняется?","en":"In an open vessel the mass dropped. Does that mean mass is not conserved?"},"o":[{"he":"לא, גז כנראה יצא מהכלי ולכן צריך לבדוק בכלי סגור","ar":"لا، غاز خرج على الأرجح لذلك نفحص بوعاء مغلق","ru":"нет, скорее всего вышел газ, поэтому проверяют в закрытом сосуде","en":"no, a gas probably escaped, so test in a closed vessel"},{"he":"כן, המסה נעלמה באמת","ar":"نعم اختفت الكتلة فعلًا","ru":"да, масса действительно исчезла","en":"yes, mass truly vanished"},{"he":"כן, החוק שגוי","ar":"نعم القانون خاطئ","ru":"да, закон неверен","en":"yes, the law is wrong"},{"he":"לא קרה כלום","ar":"لم يحدث شيء","ru":"ничего не случилось","en":"nothing happened"}],"h":{"he":"לאן יכול גז ללכת בכלי פתוח?","ar":"إلى أين يذهب الغاز في وعاء مفتوح؟","ru":"Куда может уйти газ из открытого сосуда?","en":"Where can gas go in an open vessel?"},"y":{"he":"אם גז בורח, מסתו לא נספרת. בכלי סגור רואים שהסכום נשמר.","ar":"إن هرب الغاز لا تُحسب كتلته. في وعاء مغلق نرى أن المجموع محفوظ.","ru":"Если газ улетучивается, его масса не учитывается. В закрытом сосуде видно, что сумма сохраняется.","en":"If gas escapes its mass is not counted. In a closed vessel you see the total is kept."}},{"lv":3,"s":{"he":"למה לנתרן וכלור נפרדים יש תכונות שונות לגמרי ממלח?","ar":"لماذا للصوديوم والكلور منفصلين خصائص مختلفة تمامًا عن الملح؟","ru":"Почему у натрия и хлора отдельно свойства совсем иные, чем у соли?","en":"Why do separate sodium and chlorine have totally different properties from salt?"},"o":[{"he":"כי נוצר חומר חדש עם קשר חדש בין האטומים","ar":"لأنه تكوّنت مادة جديدة بين الذرات برابطة جديدة","ru":"потому что образовалось новое вещество с новой связью между атомами","en":"because a new substance formed with a new bond between the atoms"},{"he":"כי האטומים קטנו","ar":"لأن الذرات صغرت","ru":"потому что атомы уменьшились","en":"because the atoms got smaller"},{"he":"כי מלח הוא תערובת","ar":"لأن الملح خليط","ru":"потому что соль — смесь","en":"because salt is a mixture"},{"he":"כי אין הבדל","ar":"لأنه لا فرق","ru":"потому что разницы нет","en":"because there is no difference"}],"h":{"he":"האם תערובת משנה את תכונות המרכיבים?","ar":"هل يغيّر الخليط خصائص مكوّناته؟","ru":"Меняет ли смесь свойства составляющих?","en":"Does a mixture change the properties of its parts?"},"y":{"he":"בתרכובת הקשר משנה את התכונות, ולכן מלח שונה מאוד מהיסודות שבו.","ar":"في المركّب تغيّر الرابطة الخصائص لذلك يختلف الملح كثيرًا عن عناصره.","ru":"В соединении связь меняет свойства, поэтому соль сильно отличается от своих элементов.","en":"In a compound the bond changes the properties, so salt is very different from its elements."}}]},{"id":"b2","grade":9,"t":{"he":"חומצות ובסיסים","ar":"الأحماض والقواعد","ru":"Кислоты и основания","en":"Acids and bases"},"pred":{"s":{"he":"לימון חמוץ וסבון חלקלק. מה מבדיל ביניהם?","ar":"الليمون حامض والصابون زلق. ما الذي يميّز بينهما؟","ru":"Лимон кислый, мыло скользкое. Чем они различаются?","en":"A lemon is sour and soap is slippery. What separates them?"},"o":[{"he":"לימון חומצי וסבון בסיסי","ar":"الليمون حمضي والصابون قاعدي","ru":"лимон кислотный, а мыло щелочное","en":"lemon is acidic and soap is basic"},{"he":"שניהם חומצות","ar":"كلاهما أحماض","ru":"оба — кислоты","en":"both are acids"},{"he":"שניהם בסיסים","ar":"كلاهما قواعد","ru":"оба — основания","en":"both are bases"},{"he":"אין הבדל","ar":"لا فرق","ru":"разницы нет","en":"there is no difference"}]},"lessons":[{"t":{"he":"חומצות, בסיסים ו-pH","ar":"الأحماض والقواعد وpH","ru":"Кислоты, основания и pH","en":"Acids, bases and pH"},"phen":{"he":"איך נדע אם נוזל הוא חומצי או בסיסי בלי לטעום?","ar":"كيف نعرف أن السائل حمضي أو قاعدي دون تذوّق؟","ru":"Как узнать, кислая жидкость или щелочная, не пробуя?","en":"How do we know if a liquid is acidic or basic without tasting?"},"concept":{"he":"סולם pH מראה כמה נוזל חומצי או בסיסי: מתחת ל-7 חומצי, 7 ניטרלי (מים טהורים), מעל 7 בסיסי. חומר מחוון משנה צבע לפי ה-pH. לעולם לא טועמים ולא נוגעים בחומצות או בסיסים חזקים, והבדיקה נעשית עם מורה.","ar":"يبيّن مقياس pH مدى حمضية أو قاعدية السائل: أقل من 7 حمضي و7 متعادل (ماء نقي) وأكثر من 7 قاعدي. الكاشف يغيّر لونه حسب pH. لا نتذوق ولا نلمس أبدًا أحماضًا أو قواعد قوية، والفحص بحضور المعلّم.","ru":"Шкала pH показывает, насколько жидкость кислая или щелочная: ниже 7 — кислая, 7 — нейтральная (чистая вода), выше 7 — щелочная. Индикатор меняет цвет по pH. Сильные кислоты и щёлочи никогда не пробуют и не трогают, опыт проводят с учителем.","en":"The pH scale shows how acidic or basic a liquid is: below 7 is acidic, 7 is neutral (pure water), above 7 is basic. An indicator changes color with pH. Never taste or touch strong acids or bases, and test only with a teacher."},"steps":[{"he":"לוקחים מעט נוזל לבדיקה (מורה מנחה).","ar":"نأخذ قليلًا من السائل للفحص (المعلّم يوجّه).","ru":"Берём немного жидкости для проверки (под руководством учителя).","en":"Take a little liquid to test (teacher guides)."},{"he":"מוסיפים חומר מחוון ורואים צבע.","ar":"نضيف كاشفًا ونرى اللون.","ru":"Добавляем индикатор и смотрим цвет.","en":"Add an indicator and see the color."},{"he":"משווים לסולם ומחליטים: חומצי, ניטרלי או בסיסי.","ar":"نقارن بالمقياس ونقرر: حمضي أو متعادل أو قاعدي.","ru":"Сравниваем со шкалой и решаем: кислый, нейтральный или щелочной.","en":"Compare to the scale and decide: acidic, neutral or basic."}],"qs":[{"lv":1,"s":{"he":"מה ה-pH של מים טהורים?","ar":"كم pH الماء النقي؟","ru":"Каков pH чистой воды?","en":"What is the pH of pure water?"},"o":[{"he":"7","ar":"7","ru":"7","en":"7"},{"he":"1","ar":"1","ru":"1","en":"1"},{"he":"14","ar":"14","ru":"14","en":"14"},{"he":"0","ar":"0","ru":"0","en":"0"}],"h":{"he":"באמצע הסולם.","ar":"في منتصف المقياس.","ru":"В середине шкалы.","en":"In the middle of the scale."},"y":{"he":"pH 7 הוא ניטרלי, לא חומצי ולא בסיסי.","ar":"pH 7 متعادل لا حمضي ولا قاعدي.","ru":"pH 7 — нейтральный, ни кислый, ни щелочной.","en":"pH 7 is neutral, neither acidic nor basic."}},{"lv":2,"s":{"he":"נוזל עם pH 3. מה הוא?","ar":"سائل بـ pH 3. ما هو؟","ru":"Жидкость с pH 3. Что это?","en":"A liquid with pH 3. What is it?"},"o":[{"he":"חומצי","ar":"حمضي","ru":"кислая","en":"acidic"},{"he":"בסיסי","ar":"قاعدي","ru":"щелочная","en":"basic"},{"he":"ניטרלי","ar":"متعادل","ru":"нейтральная","en":"neutral"},{"he":"אי אפשר לדעת","ar":"لا يمكن المعرفة","ru":"узнать нельзя","en":"cannot be known"}],"h":{"he":"האם 3 קטן או גדול מ-7?","ar":"هل 3 أصغر أم أكبر من 7؟","ru":"3 меньше или больше 7?","en":"Is 3 below or above 7?"},"y":{"he":"מתחת ל-7 הוא חומצי.","ar":"أقل من 7 حمضي.","ru":"Ниже 7 — кислая.","en":"Below 7 is acidic."}}]},{"t":{"he":"תגובת חומצה ובסיס","ar":"تفاعل الحمض والقاعدة","ru":"Реакция кислоты и основания","en":"Acid and base reaction"},"phen":{"he":"חומצה ובסיס יכולים \"לבטל\" זה את זה. מה קורה כשמערבבים?","ar":"الحمض والقاعدة يمكن أن «يلغيا» بعضهما. ماذا يحدث عند الخلط؟","ru":"Кислота и основание могут «погасить» друг друга. Что при смешивании?","en":"An acid and a base can \"cancel\" each other. What happens when mixed?"},"concept":{"he":"כשחומצה ובסיס מגיבים נוצרים מים ומלח, וה-pH מתקרב ל-7. זה נקרא נטרול. לדוגמה, אנטי-חומצה בתרופה מנטרלת עודף חומצה בקיבה. דרושה הדרכה מקצועית והדגמת מורה.","ar":"عندما يتفاعل حمض وقاعدة يتكوّن ماء وملح ويقترب pH من 7. هذا يسمى التعادل. مثلًا مضاد الحموضة في الدواء يعادل فائض الحمض في المعدة. يلزم إشراف مهني وعرض المعلّم.","ru":"Когда кислота и основание реагируют, образуются вода и соль, а pH приближается к 7. Это нейтрализация. Например, антацид в лекарстве нейтрализует избыток кислоты в желудке. Нужны указания специалиста и демонстрация учителя.","en":"When an acid and a base react, water and a salt form and the pH moves toward 7. This is neutralization. For example an antacid in medicine neutralizes extra stomach acid. It needs expert guidance and a teacher demo."},"steps":[{"he":"מזהים מי החומצה ומי הבסיס.","ar":"نحدّد الحمض والقاعدة.","ru":"Определяем кислоту и основание.","en":"Identify the acid and the base."},{"he":"כותבים: חומצה + בסיס ← מים + מלח.","ar":"نكتب: حمض + قاعدة ← ماء + ملح.","ru":"Пишем: кислота + основание → вода + соль.","en":"Write: acid + base → water + salt."},{"he":"בודקים אם ה-pH התקרב ל-7.","ar":"نتحقق إن اقترب pH من 7.","ru":"Проверяем, приблизился ли pH к 7.","en":"Check whether the pH moved toward 7."}],"qs":[{"lv":1,"s":{"he":"מה נוצר בנטרול חומצה ובסיס?","ar":"ماذا يتكوّن عند معادلة حمض وقاعدة؟","ru":"Что образуется при нейтрализации кислоты и основания?","en":"What forms when an acid and base neutralize?"},"o":[{"he":"מים ומלח","ar":"ماء وملح","ru":"вода и соль","en":"water and a salt"},{"he":"מתכת בלבד","ar":"فلز فقط","ru":"только металл","en":"metal only"},{"he":"חמצן בלבד","ar":"أكسجين فقط","ru":"только кислород","en":"oxygen only"},{"he":"לא נוצר דבר","ar":"لا يتكوّن شيء","ru":"ничего не образуется","en":"nothing forms"}],"h":{"he":"מה נשאר אחרי שהם מבטלים זה את זה?","ar":"ما الذي يبقى بعد أن يلغيا بعضهما؟","ru":"Что остаётся после взаимного погашения?","en":"What is left after they cancel each other?"},"y":{"he":"בנטרול נוצרים מים ומלח.","ar":"في المعادلة يتكوّن ماء وملح.","ru":"При нейтрализации образуются вода и соль.","en":"Neutralization makes water and a salt."}},{"lv":2,"s":{"he":"למה תרופה לצרבת מכילה בסיס חלש?","ar":"لماذا يحتوي دواء الحرقة على قاعدة ضعيفة؟","ru":"Почему лекарство от изжоги содержит слабое основание?","en":"Why does a heartburn medicine contain a weak base?"},"o":[{"he":"כדי לנטרל עודף חומצה בקיבה","ar":"ليعادل فائض الحمض في المعدة","ru":"чтобы нейтрализовать избыток кислоты в желудке","en":"to neutralize extra stomach acid"},{"he":"כדי להוסיף חומצה","ar":"ليضيف حمضًا","ru":"чтобы добавить кислоту","en":"to add more acid"},{"he":"כדי לצבוע את הקיבה","ar":"ليلوّن المعدة","ru":"чтобы покрасить желудок","en":"to color the stomach"},{"he":"כדי לייצר אור","ar":"ليصنع ضوءًا","ru":"чтобы давать свет","en":"to make light"}],"h":{"he":"מה נעשה לחומצה כשמוסיפים בסיס?","ar":"ماذا يحدث للحمض عند إضافة قاعدة؟","ru":"Что с кислотой при добавлении основания?","en":"What happens to an acid when you add a base?"},"y":{"he":"בסיס חלש מנטרל חלק מהחומצה ומקל על הכאב. תרופה נלקחת רק לפי הוראות.","ar":"القاعدة الضعيفة تعادل جزءًا من الحمض وتخفف الألم. الدواء يؤخذ حسب التعليمات فقط.","ru":"Слабое основание нейтрализует часть кислоты и облегчает боль. Лекарство принимают только по инструкции.","en":"A weak base neutralizes part of the acid and eases the pain. Medicine is taken only as directed."}}]}],"practice":[{"lv":1,"s":{"he":"מה החומר המחוון עושה?","ar":"ماذا يفعل الكاشف؟","ru":"Что делает индикатор?","en":"What does an indicator do?"},"o":[{"he":"משנה צבע לפי ה-pH","ar":"يغيّر لونه حسب pH","ru":"меняет цвет в зависимости от pH","en":"changes color with pH"},{"he":"מנטרל חומצה","ar":"يعادل الحمض","ru":"нейтрализует кислоту","en":"neutralizes acid"},{"he":"מייצר מלח","ar":"يصنع ملحًا","ru":"делает соль","en":"makes salt"},{"he":"שוקל נוזל","ar":"يزن السائل","ru":"взвешивает жидкость","en":"weighs liquid"}],"h":{"he":"מה רואים בעיניים?","ar":"ماذا نرى بالعين؟","ru":"Что видно глазами?","en":"What do you see with your eyes?"},"y":{"he":"מחוון הופך שינוי בלתי נראה בחומציות לצבע שרואים.","ar":"الكاشف يحوّل تغيّرًا غير مرئي في الحموضة إلى لون مرئي.","ru":"Индикатор превращает невидимое изменение кислотности в видимый цвет.","en":"An indicator turns an unseen change in acidity into a visible color."}},{"lv":1,"s":{"he":"מה נכון לגבי חומצות וטעם?","ar":"ما الصحيح عن الأحماض والتذوق؟","ru":"Что верно о кислотах и вкусе?","en":"What is right about acids and tasting?"},"o":[{"he":"לעולם לא טועמים חומרים במעבדה","ar":"لا نتذوق مواد المختبر أبدًا","ru":"вещества в лаборатории никогда не пробуют","en":"never taste lab substances"},{"he":"טועמים כדי לבדוק","ar":"نتذوق للفحص","ru":"пробуем для проверки","en":"taste to test"},{"he":"טועמים טיפה","ar":"نتذوق نقطة","ru":"пробуем каплю","en":"taste a drop"},{"he":"מותר אם חברים מסכימים","ar":"مسموح إن وافق الأصدقاء","ru":"можно, если друзья согласны","en":"allowed if friends agree"}],"h":{"he":"איך בודקים בבטחה?","ar":"كيف نفحص بأمان؟","ru":"Как проверять безопасно?","en":"How do we test safely?"},"y":{"he":"בטיחות קודמת: בודקים עם מחוון ובהנחיית מורה, לא בטעימה.","ar":"السلامة أولًا: نفحص بكاشف وبإشراف المعلّم لا بالتذوق.","ru":"Безопасность прежде всего: проверяют индикатором с учителем, а не вкусом.","en":"Safety first: test with an indicator and a teacher, not by taste."}},{"lv":2,"s":{"he":"pH של סבון 10. מה הוא?","ar":"pH الصابون 10. ما هو؟","ru":"pH мыла 10. Какое оно?","en":"Soap has pH 10. What is it?"},"o":[{"he":"בסיסי","ar":"قاعدي","ru":"щелочное","en":"basic"},{"he":"חומצי","ar":"حمضي","ru":"кислое","en":"acidic"},{"he":"ניטרלי","ar":"متعادل","ru":"нейтральное","en":"neutral"},{"he":"אין לו pH","ar":"لا pH له","ru":"у него нет pH","en":"it has no pH"}],"h":{"he":"האם 10 מעל או מתחת ל-7?","ar":"هل 10 فوق أم تحت 7؟","ru":"10 выше или ниже 7?","en":"Is 10 above or below 7?"},"y":{"he":"מעל 7 הוא בסיסי.","ar":"فوق 7 قاعدي.","ru":"Выше 7 — щелочное.","en":"Above 7 is basic."}},{"lv":2,"s":{"he":"מערבבים חומצה עם בסיס וה-pH מגיע ל-7. מה קרה?","ar":"خُلط حمض مع قاعدة فصار pH 7. ماذا حدث؟","ru":"Смешали кислоту с основанием, pH стал 7. Что произошло?","en":"An acid and a base were mixed and the pH reached 7. What happened?"},"o":[{"he":"הם נוטרלו","ar":"تعادلا","ru":"они нейтрализовались","en":"they neutralized"},{"he":"החומצה גדלה","ar":"زاد الحمض","ru":"кислота выросла","en":"the acid grew"},{"he":"הבסיס נעלם בלי להשאיר דבר","ar":"اختفت القاعدة دون أثر","ru":"основание исчезло бесследно","en":"the base vanished without trace"},{"he":"נוצר גז רעיל","ar":"تكوّن غاز سام","ru":"образовался ядовитый газ","en":"a toxic gas formed"}],"h":{"he":"מה 7 אומר על הנוזל?","ar":"ماذا يعني 7 للسائل؟","ru":"Что означает 7 для жидкости?","en":"What does 7 mean for the liquid?"},"y":{"he":"pH 7 הוא ניטרלי, כלומר החומצה והבסיס ביטלו זה את זה.","ar":"pH 7 متعادل أي أن الحمض والقاعدة ألغيا بعضهما.","ru":"pH 7 — нейтральный, то есть кислота и основание погасили друг друга.","en":"pH 7 is neutral, so the acid and base cancelled each other."}},{"lv":3,"s":{"he":"תלמיד ראה שהמחוון נהיה אדום ואמר \"זה בסיס\". מה ראוי לבדוק?","ar":"رأى طالب أن الكاشف صار أحمر وقال «هذه قاعدة». ماذا يجب فحصه؟","ru":"Ученик увидел, что индикатор покраснел, и сказал «это основание». Что надо проверить?","en":"A student saw the indicator turn red and said \"it is a base.\" What should be checked?"},"o":[{"he":"איזה צבע המחוון נותן לחומצה ולבסיס לפי הטבלה","ar":"ما لون الكاشف للحمض وللقاعدة حسب الجدول","ru":"какой цвет индикатор даёт для кислоты и основания по таблице","en":"which colors the indicator shows for acid and base per its chart"},{"he":"שום דבר, הוא צודק","ar":"لا شيء هو محق","ru":"ничего, он прав","en":"nothing, he is right"},{"he":"צריך לשפוך עוד","ar":"يجب صب المزيد","ru":"нужно налить ещё","en":"pour in more"},{"he":"לטעום קצת","ar":"نتذوق قليلًا","ru":"попробовать на вкус","en":"taste a little"}],"h":{"he":"האם כל מחוון משתמש באותם צבעים?","ar":"هل يستخدم كل كاشف الألوان نفسها؟","ru":"Одни ли и те же цвета у всех индикаторов?","en":"Does every indicator use the same colors?"},"y":{"he":"צבעי המחוון שונים בין חומרים. בודקים בטבלת הצבעים שלו לפני שמסיקים.","ar":"ألوان الكاشف تختلف بين المواد. نفحص جدول ألوانه قبل الاستنتاج.","ru":"Цвета индикаторов различаются. Прежде чем делать вывод, сверяются с их таблицей.","en":"Indicator colors differ. Check its color chart before concluding."}},{"lv":3,"s":{"he":"אם מערבבים יותר מדי בסיס בחומצה, מה יהיה ה-pH?","ar":"إذا أضفنا قاعدة كثيرة جدًا إلى حمض فماذا يكون pH؟","ru":"Если добавить слишком много основания в кислоту, каким станет pH?","en":"If too much base is added to an acid, what will the pH be?"},"o":[{"he":"מעל 7","ar":"فوق 7","ru":"выше 7","en":"above 7"},{"he":"מתחת ל-7","ar":"تحت 7","ru":"ниже 7","en":"below 7"},{"he":"בדיוק 0","ar":"صفر تمامًا","ru":"ровно 0","en":"exactly 0"},{"he":"לא משתנה","ar":"لا يتغيّر","ru":"не меняется","en":"does not change"}],"h":{"he":"מה נשאר בעודף אחרי הנטרול?","ar":"ما الذي يبقى زائدًا بعد التعادل؟","ru":"Что остаётся в избытке после нейтрализации?","en":"What is left in excess after neutralizing?"},"y":{"he":"אחרי שהחומצה נוטרלה, הבסיס העודף מעלה את ה-pH מעל 7.","ar":"بعد معادلة الحمض تزيد القاعدة الفائضة pH فوق 7.","ru":"После нейтрализации кислоты избыток основания поднимает pH выше 7.","en":"Once the acid is neutralized, extra base pushes the pH above 7."}}]},{"id":"b3","grade":9,"t":{"he":"תהליכים בתא ותזונה","ar":"العمليات في الخلية والتغذية","ru":"Процессы в клетке и питание","en":"Cell processes and nutrition"},"pred":{"s":{"he":"מאיפה מקבל התא אנרגיה לפעולה?","ar":"من أين تحصل الخلية على الطاقة للعمل؟","ru":"Откуда клетка берёт энергию для работы?","en":"Where does a cell get energy to work?"},"o":[{"he":"מפירוק גלוקוז עם חמצן בנשימה תאית","ar":"من تفكيك الغلوكوز مع الأكسجين في التنفس الخلوي","ru":"из распада глюкозы с кислородом при клеточном дыхании","en":"from breaking down glucose with oxygen in cellular respiration"},{"he":"מהשמש ישירות לכל תא","ar":"من الشمس مباشرة لكل خلية","ru":"от солнца напрямую в каждую клетку","en":"from the sun directly into every cell"},{"he":"מהמים בלבד","ar":"من الماء فقط","ru":"только из воды","en":"from water alone"},{"he":"התא לא צריך אנרגיה","ar":"الخلية لا تحتاج طاقة","ru":"клетке энергия не нужна","en":"a cell needs no energy"}]},"lessons":[{"t":{"he":"פוטוסינתזה ונשימה תאית","ar":"البناء الضوئي والتنفس الخلوي","ru":"Фотосинтез и клеточное дыхание","en":"Photosynthesis and cellular respiration"},"phen":{"he":"צמח ירוק עומד ליד חלון. מאיפה הוא מקבל מזון, ומה הוא נותן לנו?","ar":"نبتة خضراء قرب النافذة. من أين تحصل على الغذاء وماذا تعطينا؟","ru":"Зелёное растение у окна. Откуда оно получает пищу и что даёт нам?","en":"A green plant by a window. Where does it get food and what does it give us?"},"concept":{"he":"בפוטוסינתזה צמח קולט אור, פחמן דו-חמצני ומים ויוצר גלוקוז (סוכר) וחמצן. בנשימה תאית כל תא מפרק גלוקוז עם חמצן ומשחרר אנרגיה, ונוצרים פחמן דו-חמצני ומים. התהליכים משלימים זה את זה.","ar":"في البناء الضوئي يمتص النبات الضوء وثاني أكسيد الكربون والماء ويصنع غلوكوزًا (سكرًا) وأكسجينًا. في التنفس الخلوي تفكك كل خلية الغلوكوز مع الأكسجين وتحرر طاقة وينتج ثاني أكسيد الكربون وماء. العمليتان تكمّل إحداهما الأخرى.","ru":"При фотосинтезе растение поглощает свет, углекислый газ и воду и создаёт глюкозу (сахар) и кислород. При клеточном дыхании каждая клетка расщепляет глюкозу с кислородом и высвобождает энергию, образуются углекислый газ и вода. Процессы дополняют друг друга.","en":"In photosynthesis a plant takes in light, carbon dioxide and water and makes glucose (sugar) and oxygen. In cellular respiration every cell breaks down glucose with oxygen and releases energy, producing carbon dioxide and water. The two processes complement each other."},"steps":[{"he":"כותבים את המגיבים והתוצרים של פוטוסינתזה.","ar":"نكتب متفاعلات ونواتج البناء الضوئي.","ru":"Пишем реагенты и продукты фотосинтеза.","en":"Write the reactants and products of photosynthesis."},{"he":"כותבים את אלה של נשימה תאית.","ar":"نكتب ما للتنفس الخلوي.","ru":"Пишем то же для клеточного дыхания.","en":"Write those of cellular respiration."},{"he":"מבחינים שהתוצרים של האחד הם המגיבים של השני.","ar":"نلاحظ أن نواتج أحدهما متفاعلات الآخر.","ru":"Замечаем: продукты одного — реагенты другого.","en":"Notice the products of one are the reactants of the other."}],"qs":[{"lv":1,"s":{"he":"מה צמח יוצר בפוטוסינתזה?","ar":"ماذا يصنع النبات في البناء الضوئي؟","ru":"Что создаёт растение при фотосинтезе?","en":"What does a plant make in photosynthesis?"},"o":[{"he":"גלוקוז וחמצן","ar":"غلوكوز وأكسجين","ru":"глюкозу и кислород","en":"glucose and oxygen"},{"he":"פחמן דו-חמצני ומים","ar":"ثاني أكسيد الكربون وماء","ru":"углекислый газ и воду","en":"carbon dioxide and water"},{"he":"מלח ושמן","ar":"ملحًا وزيتًا","ru":"соль и масло","en":"salt and oil"},{"he":"אבנים","ar":"حجارة","ru":"камни","en":"stones"}],"h":{"he":"מה צמח נותן לאוויר?","ar":"ماذا يعطي النبات للهواء؟","ru":"Что растение отдаёт воздуху?","en":"What does a plant give the air?"},"y":{"he":"בפוטוסינתזה נוצרים סוכר לצמח וחמצן לאוויר.","ar":"في البناء الضوئي يتكوّن سكر للنبات وأكسجين للهواء.","ru":"При фотосинтезе образуются сахар для растения и кислород для воздуха.","en":"Photosynthesis makes sugar for the plant and oxygen for the air."}},{"lv":2,"s":{"he":"מה משותף לתא של צמח ולתא של אדם?","ar":"ما المشترك بين خلية نبات وخلية إنسان؟","ru":"Что общего у клетки растения и клетки человека?","en":"What do plant and human cells share?"},"o":[{"he":"שניהם מבצעים נשימה תאית","ar":"كلاهما يقوم بالتنفس الخلوي","ru":"обе осуществляют клеточное дыхание","en":"both carry out cellular respiration"},{"he":"שניהם עושים פוטוסינתזה","ar":"كلاهما يقوم بالبناء الضوئي","ru":"обе делают фотосинтез","en":"both do photosynthesis"},{"he":"לשניהם כלורופלסטים","ar":"لكلاهما بلاستيدات خضراء","ru":"у обеих хлоропласты","en":"both have chloroplasts"},{"he":"לשניהם דופן תא","ar":"لكلاهما جدار خلوي","ru":"у обеих клеточная стенка","en":"both have cell walls"}],"h":{"he":"מי צריך אנרגיה מגלוקוז?","ar":"من يحتاج طاقة من الغلوكوز؟","ru":"Кому нужна энергия из глюкозы?","en":"Who needs energy from glucose?"},"y":{"he":"כל התאים החיים נושמים ומפיקים אנרגיה מגלוקוז. רק לצמח יש כלורופלסטים.","ar":"كل الخلايا الحية تتنفس وتستخرج طاقة من الغلوكوز. الكلوروبلاست للنبات فقط.","ru":"Все живые клетки дышат и получают энергию из глюкозы. Хлоропласты только у растений.","en":"All living cells respire and get energy from glucose. Only plants have chloroplasts."}}]},{"t":{"he":"הזנה ועיכול","ar":"التغذية والهضم","ru":"Питание и пищеварение","en":"Nutrition and digestion"},"phen":{"he":"אנחנו אוכלים לחם, אבל תאי הגוף צריכים חומרים קטנים. איך זה מגיע?","ar":"نأكل الخبز لكن خلايا الجسم تحتاج مواد صغيرة. كيف تصل؟","ru":"Мы едим хлеб, но клеткам нужны мелкие вещества. Как они до них доходят?","en":"We eat bread but body cells need tiny substances. How do they get them?"},"concept":{"he":"בעיכול המזון מתפרק לחומרים קטנים: פחמימות לגלוקוז, חלבונים לחומצות אמינו, שומנים לחומצות שומן וגליצרול. הם נספגים במעי הדק לדם ומגיעים לכל תא. תזונה מאוזנת כוללת פחמימות, חלבונים, שומנים, ויטמינים, מינרלים ומים.","ar":"في الهضم يتفكك الطعام إلى مواد صغيرة: الكربوهيدرات إلى غلوكوز والبروتينات إلى أحماض أمينية والدهون إلى أحماض دهنية وغليسرول. تُمتص في الأمعاء الدقيقة إلى الدم وتصل لكل خلية. التغذية المتوازنة تشمل كربوهيدرات وبروتينات ودهونًا وفيتامينات ومعادن وماء.","ru":"При пищеварении пища распадается на мелкие вещества: углеводы до глюкозы, белки до аминокислот, жиры до жирных кислот и глицерина. Они всасываются в тонком кишечнике в кровь и доходят до каждой клетки. Сбалансированное питание включает углеводы, белки, жиры, витамины, минералы и воду.","en":"In digestion food breaks into small substances: carbohydrates to glucose, proteins to amino acids, fats to fatty acids and glycerol. They are absorbed in the small intestine into the blood and reach every cell. A balanced diet includes carbohydrates, proteins, fats, vitamins, minerals and water."},"steps":[{"he":"הפה והשיניים מרסקים את המזון.","ar":"الفم والأسنان يطحنان الطعام.","ru":"Рот и зубы измельчают пищу.","en":"The mouth and teeth crush the food."},{"he":"הקיבה והמעי מפרקים אותו לחומרים קטנים.","ar":"المعدة والأمعاء تفككانه إلى مواد صغيرة.","ru":"Желудок и кишечник расщепляют его на мелкие вещества.","en":"The stomach and intestine break it into small substances."},{"he":"המעי הדק סופג אותם לדם, והדם מוביל לתאים.","ar":"الأمعاء الدقيقة تمتصها إلى الدم والدم ينقلها للخلايا.","ru":"Тонкий кишечник всасывает их в кровь, кровь несёт к клеткам.","en":"The small intestine absorbs them into the blood, which carries them to cells."}],"qs":[{"lv":1,"s":{"he":"איפה נספגים רוב החומרים המזינים?","ar":"أين تُمتص معظم المواد المغذية؟","ru":"Где всасывается большая часть питательных веществ?","en":"Where are most nutrients absorbed?"},"o":[{"he":"במעי הדק","ar":"في الأمعاء الدقيقة","ru":"в тонком кишечнике","en":"in the small intestine"},{"he":"בפה","ar":"في الفم","ru":"во рту","en":"in the mouth"},{"he":"בוושט","ar":"في المريء","ru":"в пищеводе","en":"in the esophagus"},{"he":"בריאות","ar":"في الرئتين","ru":"в лёгких","en":"in the lungs"}],"h":{"he":"איפה המזון עובר אחרי הקיבה?","ar":"أين يمر الطعام بعد المعدة؟","ru":"Куда идёт пища после желудка?","en":"Where does food go after the stomach?"},"y":{"he":"המעי הדק ארוך ובעל שטח גדול, ולכן הוא מתאים לספיגה.","ar":"الأمعاء الدقيقة طويلة وواسعة السطح لذلك تناسب الامتصاص.","ru":"Тонкий кишечник длинный с большой поверхностью, поэтому подходит для всасывания.","en":"The small intestine is long with a large surface, so it suits absorption."}},{"lv":2,"s":{"he":"מה מקבלים מפירוק חלבונים?","ar":"ماذا ينتج من تفكيك البروتينات؟","ru":"Что получается при расщеплении белков?","en":"What do proteins break down into?"},"o":[{"he":"חומצות אמינו","ar":"أحماض أمينية","ru":"аминокислоты","en":"amino acids"},{"he":"גלוקוז","ar":"غلوكوز","ru":"глюкоза","en":"glucose"},{"he":"מים בלבד","ar":"ماء فقط","ru":"только вода","en":"water only"},{"he":"מלח","ar":"ملح","ru":"соль","en":"salt"}],"h":{"he":"אילו אבני בניין יש בחלבון?","ar":"ما اللبنات في البروتين؟","ru":"Из каких блоков состоит белок?","en":"What building blocks make a protein?"},"y":{"he":"חלבון בנוי מחומצות אמינו שמופרדות בעיכול.","ar":"البروتين مبني من أحماض أمينية تنفصل في الهضم.","ru":"Белок построен из аминокислот, которые отделяются при пищеварении.","en":"A protein is built of amino acids that separate in digestion."}}]}],"practice":[{"lv":1,"s":{"he":"איזה גז הצמח קולט לפוטוסינתזה?","ar":"أي غاز يمتصه النبات للبناء الضوئي؟","ru":"Какой газ растение поглощает для фотосинтеза?","en":"Which gas does a plant take in for photosynthesis?"},"o":[{"he":"פחמן דו-חמצני","ar":"ثاني أكسيد الكربون","ru":"углекислый газ","en":"carbon dioxide"},{"he":"חמצן","ar":"أكسجين","ru":"кислород","en":"oxygen"},{"he":"חנקן","ar":"نيتروجين","ru":"азот","en":"nitrogen"},{"he":"מימן","ar":"هيدروجين","ru":"водород","en":"hydrogen"}],"h":{"he":"מה צמח נושף שיוצא מהעלים?","ar":"ماذا يخرج من الأوراق؟","ru":"Что выходит из листьев?","en":"What leaves the leaves?"},"y":{"he":"פוטוסינתזה קולטת פחמן דו-חמצני ומשחררת חמצן.","ar":"البناء الضوئي يمتص ثاني أكسيد الكربون ويطلق الأكسجين.","ru":"Фотосинтез поглощает углекислый газ и выделяет кислород.","en":"Photosynthesis takes in carbon dioxide and releases oxygen."}},{"lv":1,"s":{"he":"איזה ויטמין חשוב מאוד בפירות הדר?","ar":"أي فيتامين مهم في الحمضيات؟","ru":"Какой витамин много в цитрусовых?","en":"Which vitamin is plentiful in citrus fruit?"},"o":[{"he":"ויטמין C","ar":"فيتامين C","ru":"витамин C","en":"vitamin C"},{"he":"ויטמין ברזל","ar":"فيتامين الحديد","ru":"витамин железо","en":"vitamin iron"},{"he":"ויטמין סוכר","ar":"فيتامين السكر","ru":"витамин сахар","en":"vitamin sugar"},{"he":"אין ויטמין","ar":"لا فيتامين","ru":"витамина нет","en":"no vitamin"}],"h":{"he":"מה מצוי בתפוז ובלימון?","ar":"ماذا يوجد في البرتقال والليمون؟","ru":"Что есть в апельсине и лимоне?","en":"What is in oranges and lemons?"},"y":{"he":"פירות הדר עשירים בוויטמין C.","ar":"الحمضيات غنية بفيتامين C.","ru":"Цитрусовые богаты витамином C.","en":"Citrus fruits are rich in vitamin C."}},{"lv":2,"s":{"he":"מה קורה בנשימה תאית?","ar":"ماذا يحدث في التنفس
