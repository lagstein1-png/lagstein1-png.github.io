  Q("isl-fiqh-3-05",{"he": "מתי נותנים זכאת אל-פיטר ומדוע?", "ar": "متى تُخرج زكاة الفطر ولماذا؟", "ru": "Когда отдают закят аль-фитр и зачем?", "en": "When is zakat al-fitr given and why?"},[{"he": "אחרי חצי שנה מסוף הצום, כדי שיהיה אפשר לקנות בית לעני", "ar": "بعد نصف سنة من آخر الصيام ليُشترى بها بيت للفقير", "ru": "Через полгода после поста, чтобы можно было купить дом бедному", "en": "Half a year after the fast, so that a house can be bought for the poor"}, {"he": "בכל יום שישי בשנה, לפני תפילת הצהריים במסגד", "ar": "كل يوم جمعة من السنة قبل صلاة الظهر في المسجد", "ru": "Каждую пятницу в году, перед полуденной молитвой в мечети", "en": "Every Friday of the year, before the noon prayer at the mosque"}, {"he": "לפני תפילת החג, לטהר את מי שצם ולהאכיל עניים", "ar": "قبل صلاة العيد، طُهرة للصائم وطعمة للمساكين", "ru": "Перед праздничной молитвой: очищение постившегося и пища для бедных", "en": "Before the Eid prayer: to purify the fasting person and feed the poor"}, {"he": "רק בזמן החג' במכה, ורק מי שעלה לרגל נותן אותה", "ar": "في وقت الحج بمكة فقط، ولا يخرجها إلا من حج", "ru": "Только во время хаджа в Мекке, и даёт её только совершивший хадж", "en": "Only during the hajj in Makkah, and only a pilgrim gives it"}],2,{"he": "זה קשור לסוף הצום.", "ar": "يتعلق بنهاية الصيام.", "ru": "Связано с концом поста.", "en": "It relates to the end of the fast."},{"he": "לפי החדית' של אבן עבאס, זכאת אל-פיטר מטהרת את מי שצם מדברי הבל ומאכילה את העניים, ונתינתה לפני תפילת החג.", "ar": "في حديث ابن عباس: «فرض زكاة الفطر طُهرة للصائم من اللغو والرفث وطعمة للمساكين»، وتُؤدى قبل الصلاة.", "ru": "Согласно хадису Ибн Аббаса, она очищает постившегося от праздных слов и кормит бедных; отдаётся до молитвы.", "en": "According to Ibn Abbas's hadith it purifies the fasting from idle talk and feeds the poor, and is given before the prayer."},null),
],
]);

topic("isl-seera","faith",{"he": "הסירה: קרב בדר ואל-אסראא והמיעראג'", "ar": "السيرة النبوية: غزوة بدر والإسراء والمعراج", "ru": "Сира: битва при Бадре, аль-Исра и аль-Мирадж", "en": "The Seerah: Badr and the Night Journey"},{"he": "חיי הנביא (עליו השלום): הכנות בדר, השבויים, והמסע הלילי", "ar": "من سيرة النبي ﷺ: الاستعداد لبدر والأسرى والإسراء والمعراج", "ru": "Из жизни Пророка (мир ему): подготовка к Бадру, пленные и ночное путешествие", "en": "The Prophet's (peace be upon him) life: preparing for Badr, the captives and the Night Journey"}, [
[
  Q("isl-seera-1-01",{"he": "באיזו עיר נולד הנביא מוחמד (עליו השלום)?", "ar": "في أي مدينة وُلد النبي محمد ﷺ؟", "ru": "В каком городе родился пророк Мухаммад (мир ему)?", "en": "In which city was the Prophet Muhammad (peace be upon him) born?"},[{"he": "אל-מדינה", "ar": "المدينة المنورة", "ru": "Медина", "en": "Medina"}, {"he": "מכה", "ar": "مكة المكرمة", "ru": "Мекка", "en": "Makkah"}, {"he": "ירושלים", "ar": "القدس", "ru": "Иерусалим", "en": "Jerusalem"}, {"he": "דמשק", "ar": "دمشق", "ru": "Дамаск", "en": "Damascus"}],1,{"he": "העיר של הכעבה.", "ar": "مدينة الكعبة.", "ru": "Город Каабы.", "en": "The city of the Kaaba."},{"he": "הנביא נולד במכה בשנת הפיל, בערך בשנת 570 למניין הנוצרים.", "ar": "وُلد النبي في مكة عام الفيل نحو سنة 570م.", "ru": "Пророк родился в Мекке в год слона, около 570 года.", "en": "The Prophet was born in Makkah in the Year of the Elephant, about 570 CE."},null),
  Q("isl-seera-1-02",{"he": "לאיזו עיר היגר הנביא (עליו השלום)?", "ar": "إلى أي مدينة هاجر النبي ﷺ؟", "ru": "В какой город переселился Пророк (мир ему)?", "en": "To which city did the Prophet (peace be upon him) migrate?"},[{"he": "לבגדאד, העיר שעל נהר החידקל", "ar": "إلى بغداد المدينة التي على نهر دجلة", "ru": "В Багдад, город на реке Тигр", "en": "To Baghdad, the city on the Tigris"}, {"he": "לקהיר, העיר הגדולה שבמצרים", "ar": "إلى القاهرة المدينة الكبرى في مصر", "ru": "В Каир, большой город в Египте", "en": "To Cairo, the great city in Egypt"}, {"he": "ליתריב, שנקראה אל-מדינה", "ar": "إلى يثرب التي سُمّيت المدينة المنورة", "ru": "В Ясриб, получивший имя Медина", "en": "To Yathrib, which became al-Madina"}, {"he": "לדמשק, העיר שבארץ אל-שאם", "ar": "إلى دمشق المدينة التي في بلاد الشام", "ru": "В Дамаск, город в земле аш-Шам", "en": "To Damascus, the city in the land of Sham"}],2,{"he": "העיר נקראה על שם \"העיר\" של הנביא.", "ar": "سُميت «مدينة الرسول».", "ru": "Её называли «городом Пророка».", "en": "It came to be called \"the Prophet's city\"."},{"he": "בשנת 622 היגר הנביא מן מכה אל יתריב. זו ההג'רה, ומתחילה בה ספירת השנים המוסלמית.", "ar": "هاجر النبي من مكة إلى يثرب سنة 622م، ومنها بدأ التقويم الهجري.", "ru": "В 622 году Пророк переселился из Мекки в Ясриб. Это хиджра, с неё начинается мусульманский счёт лет.", "en": "In 622 the Prophet migrated from Makkah to Yathrib. This is the Hijra, from which the Muslim calendar starts."},null),
  Q("isl-seera-1-03",{"he": "באיזה חודש התרחש קרב בדר?", "ar": "في أي شهر وقعت غزوة بدر؟", "ru": "В каком месяце произошла битва при Бадре?", "en": "In which month did the Battle of Badr take place?"},[{"he": "שוואל, שנה שלישית להג'רה", "ar": "شوال من السنة الثالثة للهجرة", "ru": "Шавваль третьего года хиджры", "en": "Shawwal of the third year after the Hijra"}, {"he": "מוחרם, שנה ראשונה להג'רה", "ar": "محرم من السنة الأولى للهجرة", "ru": "Мухаррам первого года хиджры", "en": "Muharram of the first year after the Hijra"}, {"he": "רג'ב, שנה עשירית להג'רה", "ar": "رجب من السنة العاشرة للهجرة", "ru": "Раджаб десятого года хиджры", "en": "Rajab of the tenth year after the Hijra"}, {"he": "ראמדאן, שנה שנייה להג'רה", "ar": "رمضان من السنة الثانية للهجرة", "ru": "Рамадан второго года хиджры", "en": "Ramadan of the second year after the Hijra"}],3,{"he": "זה היה בחודש הצום.", "ar": "كان في شهر الصيام.", "ru": "Это был месяц поста.", "en": "It was in the month of fasting."},{"he": "קרב בדר היה ב-17 בראמדאן בשנה השנייה להג'רה. המוסלמים היו כ-313 ואנשי קורייש כאלף.", "ar": "كانت غزوة بدر في 17 رمضان من السنة الثانية للهجرة، والمسلمون نحو 313 ومشركو قريش نحو ألف.", "ru": "Битва при Бадре была 17 рамадана 2 года хиджры. Мусульман было около 313, курайшитов около тысячи.", "en": "Badr was on 17 Ramadan, year 2 AH. The Muslims were about 313, the Quraysh about a thousand."},null),
  Q("isl-seera-1-04",{"he": "מהו \"אל-אסראא\"?", "ar": "ما هو «الإسراء»؟", "ru": "Что такое «аль-Исра»?", "en": "What is \"al-Isra\"?"},[{"he": "מסע הלילה של הנביא ממכה לירושלים", "ar": "رحلة النبي ليلًا من المسجد الحرام إلى المسجد الأقصى", "ru": "Ночное путешествие Пророка из Мекки в Иерусалим", "en": "The Prophet's night journey from Makkah to Jerusalem"}, {"he": "מסע בים מחצי האי אל ארץ חבש", "ar": "رحلة بحرية من الجزيرة إلى أرض الحبشة", "ru": "Морское путешествие с полуострова в Абиссинию", "en": "A sea voyage from the peninsula to Abyssinia"}, {"he": "צום בן ארבעים יום שצם הנביא בהר חירא", "ar": "صيام أربعين يومًا صامه النبي في غار حراء قبل نزول الوحي", "ru": "Сорокадневный пост, который Пророк держал на горе Хира", "en": "A forty-day fast the Prophet kept at Mount Hira"}, {"he": "קרב שהתרחש ליד מכה בשנה הראשונה להג'רה", "ar": "معركة وقعت قرب مكة في السنة الأولى للهجرة", "ru": "Бой, произошедший у Мекки в первый год хиджры", "en": "A battle that took place near Makkah in year 1 AH"}],0,{"he": "הוא מוזכר בתחילת סורה שנקראת על שמו.", "ar": "ذُكر في مطلع سورة سُميت به.", "ru": "Упомянут в начале суры, названной его именем.", "en": "It is mentioned at the start of a surah named after it."},{"he": "אל-אסראא הוא מסע הלילה מן המסגד אל-חראם אל המסגד אל-אקצא, כמו בסורת אל-אסראא 1.", "ar": "الإسراء رحلة ليلية من المسجد الحرام إلى المسجد الأقصى، كما في سورة الإسراء 1.", "ru": "Аль-Исра - ночное путешествие от мечети аль-Харам к мечети аль-Акса, как в суре аль-Исра, 1.", "en": "Al-Isra is the night journey from al-Masjid al-Haram to al-Masjid al-Aqsa, as in al-Isra 1."},null),
  Q("isl-seera-1-05",{"he": "מה הוטל כחובה על המוסלמים בליל המיעראג'?", "ar": "ما الذي فُرض في ليلة المعراج على المسلمين؟", "ru": "Что было предписано мусульманам в ночь аль-Мирадж?", "en": "What was made obligatory on the Muslims on the night of al-Mi'raj?"},[{"he": "הצום בחודש ראמדאן", "ar": "صيام شهر رمضان", "ru": "Пост в течение месяца рамадан", "en": "Fasting the month of Ramadan"}, {"he": "חמש התפילות ביום", "ar": "الصلوات الخمس", "ru": "Пять ежедневных молитв", "en": "The five daily prayers"}, {"he": "הזכאת על הממון", "ar": "زكاة المال", "ru": "Закят с имущества", "en": "Zakat on wealth"}, {"he": "החג' אל הכעבה", "ar": "الحج إلى الكعبة", "ru": "Хадж к Каабе", "en": "Hajj to the Kaaba"}],1,{"he": "זה דבר שעושים כמה פעמים ביום.", "ar": "هو أمر يُؤدّى عدة مرات في اليوم.", "ru": "То, что делают несколько раз в день.", "en": "Something done several times a day."},{"he": "במיעראג' נקבעו חמש התפילות. בתחילה נאמרו חמישים והוקלו לחמש, שנחשבות כחמישים בשכר.", "ar": "فُرضت الصلوات الخمس في المعراج، من خمسين خُفّفت إلى خمس بأجر خمسين.", "ru": "В Мирадж были предписаны пять молитв: сначала пятьдесят, потом облегчено до пяти с наградой за пятьдесят.", "en": "The five prayers were made obligatory at al-Mi'raj: first fifty, reduced to five with the reward of fifty."},null),
],
[
  Q("isl-seera-2-01",{"he": "איזה צעד נקט הנביא (עליו השלום) לפני קרב בדר?", "ar": "ما الذي فعله النبي ﷺ استعدادًا لبدر؟", "ru": "Что сделал Пророк (мир ему) перед битвой при Бадре?", "en": "What did the Prophet (peace be upon him) do in preparing for Badr?"},[{"he": "החליט לבדו בלי להתייעץ עם חבריו, ויצא לקרב כפי שראה לנכון", "ar": "قرر وحده دون مشورة أصحابه، وخرج إلى المعركة كما رأى", "ru": "Решил один, не советуясь со сподвижниками, и вышел в бой как счёл нужным", "en": "He decided alone without consulting the Companions and went out as he saw fit"}, {"he": "ויתר על כל הכנה וסידור, וסמך רק על מספר הלוחמים שהיו אתו", "ar": "ترك كل استعداد وترتيب، واعتمد على عدد المقاتلين معه فقط", "ru": "Отказался от всякой подготовки и полагался лишь на число бойцов с ним", "en": "He skipped all preparation and relied only on the number of fighters with him"}, {"he": "התייעץ עם חבריו, סידר את השורות ובחר מקום ליד המים", "ar": "استشار أصحابه ورتّب الصفوف واختار موضعًا عند الماء", "ru": "Советовался с сподвижниками, выстроил ряды и выбрал место у воды", "en": "He consulted his Companions, arranged the ranks and chose a site by the water"}, {"he": "בנה חומה גבוהה סביב מקום הקרב, כדי שהאויב לא יוכל להתקרב", "ar": "بنى سورًا عاليًا حول موضع المعركة كي لا يقترب العدو", "ru": "Построил высокую стену вокруг места боя, чтобы враг не мог подойти", "en": "He built a high wall around the battlefield so the enemy could not approach"}],2,{"he": "המילה \"שורא\" מופיעה בסיפור.", "ar": "كلمة «الشورى» تظهر في القصة.", "ru": "В рассказе есть слово «шура».", "en": "The word \"shura\" appears in the story."},{"he": "הנביא התייעץ (שורא), וקיבל את הצעת אל-חבאב בן אל-מונדיר להתמקם ליד באר הקרובה לאויב. הוא גם התפלל לאללה.", "ar": "استشار النبي أصحابه فأخذ برأي الحباب بن المنذر بالنزول عند أدنى ماء، ودعا ربه.", "ru": "Пророк советовался и принял совет аль-Хубаба ибн аль-Мунзира занять колодец ближе к врагу. Он также молился Аллаху.", "en": "The Prophet consulted and accepted al-Hubab ibn al-Mundhir's advice to camp by the nearest well. He also prayed to Allah."},null),
  Q("isl-seera-2-02",{"he": "איך נהג הנביא (עליו השלום) בשבויי בדר?", "ar": "كيف تصرف النبي ﷺ مع أسرى بدر؟", "ru": "Как поступил Пророк (мир ему) с пленными при Бадре?", "en": "How did the Prophet (peace be upon him) treat the captives of Badr?"},[{"he": "הורה להרוג את כל השבויים מיד אחרי הקרב, כדי שלא יחזרו להילחם במוסלמים", "ar": "أمر بقتل جميع الأسرى بعد المعركة مباشرة لئلا يعودوا إلى قتال المسلمين", "ru": "Велел казнить всех пленных сразу после боя, чтобы они не вернулись к войне с мусульманами", "en": "He ordered all the captives killed right after the battle so they would not fight the Muslims again"}, {"he": "השאיר את השבויים בלי אוכל ובלי מים עד שמשפחותיהם יבואו לקחת אותם", "ar": "ترك الأسرى بلا طعام ولا ماء حتى تأتي عائلاتهم لأخذهم", "ru": "Оставил пленных без еды и воды, пока за ними не придут их семьи", "en": "He left the captives without food or water until their families came to take them"}, {"he": "שלח את השבויים לעבוד בהרים שסביב אל-מדינה עד סוף ימיהם", "ar": "أرسل الأسرى للعمل في جبال المدينة بقية أعمارهم", "ru": "Отправил пленных работать в горах вокруг Медины до конца их дней", "en": "He sent the captives to labour in the hills around Medina for the rest of their lives"}, {"he": "הורה להתייחס אליהם יפה, ושחרר רבים תמורת כופר או הוראת קריאה וכתיבה", "ar": "أوصى بهم خيرًا وفدى كثيرًا منهم بالمال أو بتعليم الصبيان القراءة والكتابة", "ru": "Велел хорошо обращаться, многих отпустили за выкуп или обучение грамоте", "en": "He urged good treatment and freed many for ransom or for teaching children to read and write"}],3,{"he": "מי שידע לקרוא היה יכול ללמד.", "ar": "من كان يعرف الكتابة يستطيع أن يعلّم.", "ru": "Умеющий читать мог учить.", "en": "Someone who could read could teach."},{"he": "הנביא ציווה: \"השאירו להם יחס טוב\". שבויים רבים שוחררו תמורת כופר, ומי שידע לכתוב לימד עשרה ילדים. זה מראה רחמים וערך הלימוד.", "ar": "قال النبي: «استوصوا بالأسارى خيرًا»، وفُدي كثير منهم بالمال، ومن كان يكتب علّم عشرة من صبيان المدينة. وفيه الرحمة وقيمة العلم.", "ru": "Пророк сказал: «Относитесь к пленным хорошо». Многих освободили за выкуп, а умевший писать учил десять детей. Это милосердие и ценность знания.", "en": "The Prophet said to treat captives well. Many were ransomed and one who could write taught ten Medina children. It shows mercy and the value of knowledge."},null),
  Q("isl-seera-2-03",{"he": "מה פירוש \"אל-מיעראג'\" במובן הדתי?", "ar": "ما المقصود بـ«المعراج» شرعًا؟", "ru": "Что такое «аль-Мирадж» в шариате?", "en": "What is meant by \"al-Mi'raj\" in religious terms?"},[{"he": "העלייה של הנביא מירושלים אל השמים", "ar": "عروج النبي من بيت المقدس إلى السماوات العلى", "ru": "Вознесение Пророка из Иерусалима в небеса", "en": "The Prophet's ascent from Jerusalem to the heavens"}, {"he": "הירידה מהר חירא אחרי ההתגלות הראשונה", "ar": "النزول من جبل حراء بعد أول وحي", "ru": "Спуск с горы Хира после первого откровения", "en": "Coming down from Mount Hira after the first revelation"}, {"he": "המסע מדמשק אל מכה שעשו סוחרי קורייש בקיץ", "ar": "الرحلة من دمشق إلى مكة التي كان يقوم بها تجار قريش في الصيف", "ru": "Путь из Дамаска в Мекку, который летом проделывали купцы Курайша", "en": "The trip from Damascus to Makkah that Quraysh’s merchants made in summer"}, {"he": "הפלגה בים האדום בדרך אל ארץ חבש", "ar": "السفر بحرًا في البحر الأحمر إلى أرض الحبشة", "ru": "Плавание по Красному морю в сторону Абиссинии", "en": "A voyage on the Red Sea toward Abyssinia"}],0,{"he": "השם דומה ל\"סולם\" או \"עלייה\".", "ar": "الاسم من «السُّلَّم» أي الصعود.", "ru": "Название от «лестница, подъём».", "en": "The name comes from \"ladder, ascent\"."},{"he": "אל-אסראא הוא המסע האופקי ממכה לירושלים, והמיעראג' הוא העלייה אל השמים עד סדרת אל-מונתהא.", "ar": "الإسراء أفقي من مكة إلى القدس والمعراج صعود إلى السماوات حتى سدرة المنتهى.", "ru": "Исра - горизонтальный путь из Мекки в Иерусалим, Мирадж - вознесение к небесам до сидрат аль-мунтаха.", "en": "Isra is the horizontal journey Makkah to Jerusalem; Mi'raj is the ascent to the heavens up to Sidrat al-Muntaha."},null),
  Q("isl-seera-2-04",{"he": "איזה אירוע קדם לאל-אסראא ולמיעראג', והיה בו נחמה לנביא?", "ar": "ما الحدث الذي سبق الإسراء والمعراج وكان فيه تسلية للنبي؟", "ru": "Что предшествовало аль-Исре и Мираджу и стало утешением для Пророка?", "en": "What came before al-Isra and al-Mi'raj and was a comfort to the Prophet?"},[{"he": "קרב בדר, שבו ניצחו המוסלמים את אנשי קורייש", "ar": "غزوة بدر التي انتصر فيها المسلمون على قريش", "ru": "Битва при Бадре, где мусульмане победили курайшитов", "en": "The Battle of Badr, where the Muslims defeated Quraysh"}, {"he": "מות חדיג'ה ואבו טאלב, \"שנת האבל\"", "ar": "وفاة خديجة وأبي طالب في «عام الحزن»", "ru": "Смерть Хадиджи и Абу Талиба - «год печали»", "en": "The deaths of Khadija and Abu Talib, \"the Year of Sorrow\""}, {"he": "פתיחת מכה, שבה נכנס הנביא אל העיר בלי קרב", "ar": "فتح مكة الذي دخل فيه النبي مكة من غير قتال", "ru": "Покорение Мекки, когда Пророк вошёл в город без боя", "en": "The conquest of Makkah, when the Prophet entered the city without a battle"}, {"he": "חג'ת הפרידה, החג' האחרון של הנביא לפני מותו", "ar": "حجة الوداع، آخر حج للنبي قبل وفاته", "ru": "Прощальный хадж - последний хадж Пророка перед смертью", "en": "The farewell pilgrimage, the Prophet's last hajj before his death"}],1,{"he": "זה קרה זמן קצר לפני ההג'רה, ואבלו כבד.", "ar": "كان ذلك قبل الهجرة بقليل وكان الحزن شديدًا.", "ru": "Это было незадолго до хиджры, и горе было велико.", "en": "It was shortly before the Hijra, and the grief was heavy."},{"he": "אחרי מות אשתו חדיג'ה ודודו אבו טאלב ירד על הנביא קושי רב. האסראא והמיעראג' היו חיזוק ונחמה.", "ar": "بعد وفاة خديجة وأبي طالب اشتد الأذى على النبي، فكان الإسراء والمعراج تثبيتًا وتسلية.", "ru": "После смерти Хадиджи и Абу Талиба Пророку стало очень трудно. Исра и Мирадж были опорой и утешением.", "en": "After Khadija and Abu Talib died, hardship grew. Al-Isra and al-Mi'raj were support and comfort."},null),
  Q("isl-seera-2-05",{"he": "מה הייתה התוצאה של קרב בדר?", "ar": "ما نتيجة غزوة بدر؟", "ru": "Каков был итог битвы при Бадре?", "en": "What was the result of the Battle of Badr?"},[{"he": "תבוסת המוסלמים, שנסוגו אל אל-מדינה אחרי שאיבדו לוחמים רבים", "ar": "هزيمة المسلمين وانسحابهم إلى المدينة بعد خسارة كثير من المقاتلين", "ru": "Поражение мусульман: они отступили в Медину, потеряв много бойцов", "en": "A Muslim defeat: they withdrew to Medina after losing many fighters"}, {"he": "שביתת נשק בלי מנצח, ושני הצדדים חזרו לבתיהם כפי שבאו", "ar": "هدنة بلا منتصر، وعاد الطرفان إلى ديارهما كما جاءا", "ru": "Перемирие без победителя: обе стороны вернулись домой, как пришли", "en": "A truce with no winner: both sides went home as they had come"}, {"he": "ניצחון המוסלמים, כשבעים מאנשי קורייש נהרגו וכשבעים נשבו", "ar": "انتصر المسلمون وقُتل نحو سبعين من قريش وأُسر نحو سبعين", "ru": "Победа мусульман: около семидесяти курайшитов убито и около семидесяти пленено", "en": "A Muslim victory: about seventy Quraysh killed and about seventy captured"}, {"he": "הקרב הופסק בגלל סופת חול כבדה, ולא הוכרע באותו יום", "ar": "توقفت المعركة بسبب عاصفة رملية شديدة ولم تُحسم في ذلك اليوم", "ru": "Битва прервалась из-за сильной песчаной бури, и её исход остался неясным в тот день", "en": "The battle stopped in a heavy sandstorm and was not decided that day"}],2,{"he": "הקוראן קורא ליום הזה \"יום אל-פורקאן\".", "ar": "يسميه القرآن «يوم الفرقان».", "ru": "Коран называет этот день «днём различения».", "en": "The Quran calls this day \"the Day of Criterion\"."},{"he": "המוסלמים, שהיו מעטים, ניצחו. הקוראן קורא ליום \"יום אל-פורקאן\" (אל-אנפאל 41), והוא חיזק את מעמדם במדינה.", "ar": "انتصر المسلمون وهم قلة، وسمّاه القرآن «يوم الفرقان» (الأنفال 41)، وقوّى مكانتهم في المدينة.", "ru": "Мусульмане, хотя их было мало, победили. Коран называет его «днём различения» (аль-Анфаль, 41), он укрепил их положение.", "en": "The Muslims, though few, won. The Quran calls it \"the Day of the Criterion\" (al-Anfal 41), and it strengthened their standing."},null),
],
[
  Q("isl-seera-3-01",{"he": "מהי אחת המשמעויות של האסראא והמיעראג'?", "ar": "ما إحدى دلالات الإسراء والمعراج؟", "ru": "Каково одно из значений аль-Исры и Мираджа?", "en": "What is one significance of al-Isra and al-Mi'raj?"},[{"he": "שמסגד אל-אקצא אינו חשוב, ואין לו מקום בדת האיסלאם", "ar": "أن المسجد الأقصى غير مهم ولا مكانة له في الإسلام", "ru": "Что мечеть аль-Акса неважна и не имеет места в исламе", "en": "That al-Aqsa mosque is unimportant and has no place in Islam"}, {"he": "שהתפילה אינה חובה, ומי שרוצה מתפלל ומי שלא רוצה פטור", "ar": "أن الصلاة ليست واجبة، فمن شاء صلى ومن شاء ترك", "ru": "Что молитва необязательна: кто хочет - молится, кто нет - свободен", "en": "That prayer is not obligatory: whoever wishes prays, whoever does not is exempt"}, {"he": "שהמסע היה חלום בלבד, ולא קרה דבר במציאות באותו לילה", "ar": "أن الرحلة كانت رؤيا منام فقط ولم يقع شيء في الواقع تلك الليلة", "ru": "Что путешествие было лишь сном и в ту ночь наяву ничего не произошло", "en": "That the journey was only a dream and nothing really happened that night"}, {"he": "הקשר שבין המסגד אל-חראם לבין אל-אקצא, ומקומה של התפילה", "ar": "الربط بين المسجد الحرام والمسجد الأقصى ومكانة الصلاة", "ru": "Связь между мечетью аль-Харам и мечетью аль-Акса и место молитвы", "en": "The link between al-Masjid al-Haram and al-Aqsa and the place of prayer"}],3,{"he": "בסורת אל-אסראא נזכרים שני המסגדים.", "ar": "في سورة الإسراء ذُكر المسجدان.", "ru": "В суре аль-Исра названы обе мечети.", "en": "Both mosques are named in surah al-Isra."},{"he": "מן הדלאלות: קשר בין שני המסגדים, ההוכחה לגודל מעמדו של הנביא, וחשיבות התפילה שנקבעה שם.", "ar": "من الدلالات: الربط بين المسجدين وتكريم النبي وبيان عظمة الصلاة التي فُرضت هناك.", "ru": "Среди значений: связь двух мечетей, возвышение Пророка и важность молитвы, предписанной там.", "en": "Significances include linking the two mosques, honouring the Prophet and the importance of the prayer made obligatory there."},null),
  Q("isl-seera-3-02",{"he": "מי ליווה את הנביא (עליו השלום) בדרכו להג'רה?", "ar": "من رافق النبي ﷺ في هجرته؟", "ru": "Кто сопровождал Пророка (мир ему) в хиджре?", "en": "Who accompanied the Prophet (peace be upon him) on the Hijra?"},[{"he": "אבו בכר, ובמערת ת'ור הם התחבאו", "ar": "أبو بكر، واختبآ في غار ثور", "ru": "Абу Бакр, они укрывались в пещере Саур", "en": "Abu Bakr, and they hid in the cave of Thawr"}, {"he": "עומר, והם התחבאו במערת חירא", "ar": "عمر، واختبآ في غار حراء", "ru": "Умар, они укрывались в пещере Хира", "en": "Umar, and they hid in the cave of Hira"}, {"he": "עלי, והם התחבאו במערת אל-כהף", "ar": "علي، واختبآ في غار الكهف", "ru": "Али, они укрывались в пещере аль-Кахф", "en": "Ali, and they hid in the cave of al-Kahf"}, {"he": "בלאל, והם יצאו בגלוי ביום החג'", "ar": "بلال، وخرجا علنًا في موسم الحج", "ru": "Билал, они вышли открыто в дни хаджа", "en": "Bilal, and they left openly during the hajj season"}],0,{"he": "הוא נקרא \"אל-צדיק\" ואחר כך ח'ליפה ראשון.", "ar": "لقبه «الصديق» وصار أول الخلفاء.", "ru": "Его прозвали «ас-Сиддик», он стал первым халифом.", "en": "He was called \"al-Siddiq\" and became the first caliph."},{"he": "אבו בכר ליווה את הנביא בהג'רה. הם הסתתרו במערת ת'ור שלושה ימים, ואללה הציל אותם.", "ar": "رافق أبو بكر النبي في الهجرة واختبآ في غار ثور ثلاثة أيام، ونجّاهما الله.", "ru": "Абу Бакр сопровождал Пророка, они укрывались в пещере Саур три дня, и Аллах их спас.", "en": "Abu Bakr accompanied him; they hid in the cave of Thawr for three days and Allah saved them."},null),
  Q("isl-seera-3-03",{"he": "מה עשה הנביא (עליו השלום) כדי לחזק את הקשר בין המהאג'רון והאנצאר באל-מדינה?", "ar": "ماذا فعل النبي ﷺ لتقوية الصلة بين المهاجرين والأنصار؟", "ru": "Что сделал Пророк (мир ему) для связи мухаджиров и ансаров?", "en": "What did the Prophet (peace be upon him) do to strengthen ties between the Muhajirun and Ansar?"},[{"he": "הפריד בין המהאג'רון לאנצאר, וכל קבוצה גרה לבדה", "ar": "فرّق بين المهاجرين والأنصار، وسكنت كل جماعة وحدها", "ru": "Разделил мухаджиров и ансаров: каждая группа жила отдельно", "en": "He kept the Muhajirun and the Ansar apart, each group living on its own"}, {"he": "יצר אחווה (מואח'את) בין כל מהאג'ר לבין כל אנצארי", "ar": "آخى النبي بين كل مهاجر وأنصاري من أهل المدينة", "ru": "Установил братство (муаха) между каждым мухаджиром и ансаром", "en": "He created brotherhood (mu'akhat) between each Muhajir and an Ansari"}, {"he": "ביטל את התפילה בציבור, וכל אחד התפלל לבדו בביתו", "ar": "ألغى صلاة الجماعة، وصلى كل واحد وحده في بيته", "ru": "Отменил общую молитву: каждый молился один у себя дома", "en": "He abolished congregational prayer, each praying alone at home"}, {"he": "אסר על מסחר בין המהאג'רון לאנצאר בשוק אל-מדינה", "ar": "منع التجارة بين المهاجرين والأنصار في سوق المدينة", "ru": "Запретил торговлю между мухаджирами и ансарами на рынке Медины", "en": "He forbade trade between the Muhajirun and the Ansar in Medina’s market"}],1,{"he": "המילה פירושה \"לעשות לאחים\".", "ar": "الكلمة من «الإخاء».", "ru": "Слово от «братства».", "en": "The word means \"making brothers\"."},{"he": "בנה הנביא את מסגדו באל-מדינה ויצר אחווה בין המהאג'רון לאנצאר, כך שחלקו ביניהם בית וממון.", "ar": "بنى النبي مسجده في المدينة وآخى بين المهاجرين والأنصار فتشاركوا الدار والمال.", "ru": "Пророк построил мечеть в Медине и установил братство между мухаджирами и ансарами; они делили дом и имущество.", "en": "The Prophet built his mosque in Medina and paired Muhajirun with Ansar, who shared home and wealth."},null),
  Q("isl-seera-3-04",{"he": "מהו הסכם אל-חודיביה?", "ar": "ما هو صلح الحديبية؟", "ru": "Что такое Худайбийский договор?", "en": "What was the Treaty of al-Hudaybiyya?"},[{"he": "קרב גדול ליד באר בדר בשנה השנייה להג'רה, שבו ניצחו המוסלמים", "ar": "معركة كبرى عند بئر بدر في السنة الثانية للهجرة انتصر فيها المسلمون", "ru": "Большое сражение у колодца Бадр во втором году хиджры, где победили мусульмане", "en": "A great battle at the well of Badr in year 2 AH, which the Muslims won"}, {"he": "בניית המסגד הראשון בקובא, בדרכו של הנביא ממכה אל אל-מדינה", "ar": "بناء أول مسجد في قباء في طريق النبي من مكة إلى المدينة", "ru": "Постройка первой мечети в Кубе на пути Пророка из Мекки в Медину", "en": "The building of the first mosque at Quba on the Prophet’s way from Makkah to Medina"}, {"he": "הסכם הפסקת אש עם קורייש לעשר שנים, שנחתם בשנה השישית להג'רה", "ar": "هدنة مع قريش لمدة عشر سنين عُقدت في السنة السادسة للهجرة", "ru": "Перемирие с курайшитами на десять лет, заключённое в шестом году хиджры", "en": "A ten-year truce with Quraysh, concluded in year 6 after the Hijra"}, {"he": "ההוראה הראשונה לצום בחודש ראמדאן, בשנה השנייה להג'רה באל-מדינה", "ar": "أول فرض لصيام شهر رمضان في السنة الثانية للهجرة بالمدينة", "ru": "Первое предписание поста в месяц рамадан во втором году хиджры в Медине", "en": "The first obligation to fast in Ramadan, in year 2 AH in Medina"}],2,{"he": "הוא נחתם ליד מכה, אחרי שהמוסלמים לא נכנסו אליה באותה שנה.", "ar": "عُقد قرب مكة بعد أن مُنع المسلمون من دخولها ذلك العام.", "ru": "Был заключён у Мекки после того, как мусульман не пустили в тот год.", "en": "It was signed near Makkah after the Muslims were prevented from entering that year."},{"he": "בהודיביה נחתם הסכם הפסקת אש, והוא נקרא בקוראן \"ניצחון גלוי\" (אל-פתח). שנתיים אחר כך נפתחה מכה.", "ar": "عُقد صلح الحديبية سنة 6هـ وسمّاه القرآن «فتحًا مبينًا»، وبعد نحو سنتين فُتحت مكة.", "ru": "В Худайбии заключили перемирие, названное в Коране «явной победой» (аль-Фатх). Спустя около двух лет была взята Мекка.", "en": "At al-Hudaybiyya a truce was signed, which the Quran calls a \"clear victory\" (al-Fath). About two years later Makkah opened."},null),
  Q("isl-seera-3-05",{"he": "מדוע נקרא קרב בדר \"יום אל-פורקאן\"?", "ar": "لماذا سُميت غزوة بدر «يوم الفرقان»؟", "ru": "Почему битву при Бадре называют «днём различения»?", "en": "Why is Badr called \"the Day of al-Furqan (the Criterion)\"?"},[{"he": "כי מזג האוויר באותו יום היה חם מאוד, והקרב נקרא על שם החום", "ar": "لأن الطقس كان حارًا جدًا في ذلك اليوم فسُمّيت المعركة باسم الحر", "ru": "Потому что в тот день стояла сильная жара, и битву назвали по жаре", "en": "Because the day was very hot, and the battle was named after the heat"}, {"he": "כי נשבו בו מלכים מארצות רחוקות, והם שוחררו תמורת ממון רב", "ar": "لأنه أُسر فيه ملوك من بلاد بعيدة وفُدوا بمال كثير", "ru": "Потому что в нём пленили царей из дальних стран и выкупили за большие деньги", "en": "Because kings from distant lands were captured and ransomed for much money"}, {"he": "כי המשוררים חיברו עליו שירים רבים, ומהם נשאר לו השם", "ar": "لأن الشعراء نظموا فيه قصائد كثيرة ومنها بقي له الاسم", "ru": "Потому что поэты сложили о нём много стихов, от них и осталось название", "en": "Because poets composed many poems about it, and the name stayed from them"}, {"he": "כי בו הובחן בין האמת לבין השקר, ואללה חיזק בו את המוסלמים", "ar": "لأن الله فرّق فيه بين الحق والباطل ونصر فيه المسلمين", "ru": "Потому что в нём Аллах различил истину и ложь и помог мусульманам победить", "en": "Because Allah separated truth from falsehood on it and aided the Muslims"}],3,{"he": "\"אל-פורקאן\" פירושו \"ההבחנה\".", "ar": "«الفرقان» معناه «التفريق».", "ru": "«Аль-Фуркан» значит «различение».", "en": "\"Al-Furqan\" means \"the distinction\"."},{"he": "בסורת אל-אנפאל 41 נאמר \"יום אל-פורקאן, יום התנגשו שתי הקבוצות\". בו התבדלה האמת מן השקר.", "ar": "في الأنفال 41: ﴿يَوْمَ الْفُرْقَانِ يَوْمَ الْتَقَى الْجَمْعَانِ﴾. ففيه تميّز الحق من الباطل.", "ru": "В аль-Анфаль, 41: «день различения, день встречи двух войск». В нём истина отделилась от лжи.", "en": "Al-Anfal 41 says \"the Day of Criterion, the day the two forces met\". On it truth was distinguished from falsehood."},null),

function itemId(tid,lv,i){return tid+"|"+lv+"|"+i}
function itemRec(id){
  if(!state.item[id])state.item[id]={n:0,ok:0};
  return state.item[id];
}
function poolOf(tp,lv){return (tp.L[lv-1]||tp.L[0]||[])}

/* בחירת פריט לתרגול. משקל גבוה לחדש, בינוני לנכשל, נמוך לנשלט. */
function chooseIndex(tid,lv,pool,avoid){
  var cand=[],i,w;
  for(i=0;i<pool.length;i++){
    if(avoid!==undefined&&i===avoid&&pool.length>1)continue;
    var r=state.item[itemId(tid,lv,i)];
    if(!r||!r.n)w=6;                            /* חדש */
    else if(r.ok<r.n)w=1+Math.min(4,r.n-r.ok);  /* נכשל בעבר */
    else w=1;                                   /* נשלט */
    for(var j=0;j<w;j++)cand.push(i);
  }
  if(!cand.length)return 0;
  return pick(cand);
}
/* בחירת פריט למבחן. אחידה, ואינה נוגעת ב-state כלל. */
function pureIndex(pool,avoid){
  var cand=[],i;
  for(i=0;i<pool.length;i++){
    if(avoid!==undefined&&i===avoid&&pool.length>1)continue;
    cand.push(i);
  }
  return cand.length?pick(cand):0;
}


/* ------------------------------------------------------------
   ניקוי להקראה בלבד. המסך אינו משתנה ממנו.

   הגרשיים העבריים משמשים לשני דברים: ראשי תיבות (חוק־יסוד,
   בג״ץ) ומירכאות (״מדינה יהודית״). המנוע מכיר רק את הראשון.
   הכלל שמפריד: בראשי תיבות באה אחרי הגרשיים אות עברית אחת
   בדיוק וסוף מילה. הסיכון א־סימטרי — מירכאה שהוסרה אינה
   יכולה להזיק, מירכאה שנשארה כן.

   המירכאות המסולסלות (“ ”) משמשות כאן לציטוט מונחים בלבד,
   ולכן הן נופלות תמיד. הקו המפריד הופך לפסיק, כדי שהקול
   ייעצר במקום לרוץ הלאה.
   ------------------------------------------------------------ */
function saySpell(x){
  return String(x==null?"":x)
    .replace(/[“”‘’]/g,"")
    .replace(/״/g,function(m,i,str){
      return /^[א-ת](?![א-ת])/.test(str.slice(i+1))?m:"";
    })
    .replace(/\s—\s/g,", ");
}

function O(html,ok,why){return {h:html,ok:!!ok,why:why||""}}

/* בונה שאלה מפריט אחד. סדר האפשרויות מעורבב בכל בנייה, ולכן
   האינדקס ok שבתוכן אינו מגיע למסך לעולם. */
/* קטע הקריאה נשאר בעברית בכל שפת ממשק: המיומנות הנבחנת היא הבנת
   הנקרא בעברית, והבעלים אישר (29.9) שהקטע לא יתורגם. ההוראה והשאלה
   מסביב מתורגמות. רק שאלות ha-read בנויות הוראה<br>קטע<br>שאלה. */
function leadFor(it){
  var s=gl(it.q);
  if(state.lang==="he")return s;
  var he=it.q&&it.q.he;
  if(!he||he.indexOf("<br>")<0||s.indexOf("<br>")<0)return s;
  var a=s.split("<br>"), b=he.split("<br>");
  if(a.length<3||a.length!==b.length)return s;
  return a[0]+"<br>"+b.slice(1,b.length-1).join("<br>")+"<br>"+a[a.length-1];
}
function buildFromItem(it){
  var opts=it.o.map(function(o,i){return O(esc(gl(o)),i===it.ok,it.wrong&&it.wrong[i]?gl(it.wrong[i]):"")});
  var ans=gl(it.o[it.ok]);
  return {
    type:"mcq",
    prompt:t("qPick"),
    lead:leadFor(it),
    fig:figHtml(it.fig),
    opts:shuffle(opts),
    answer:ans,
    /* מה שנאמר אחרי המענה: השאלה, התשובה הנכונה, וההסבר.
       תשובה בלי ההסבר נשמעת כמו עובדה לשינון, וזה בדיוק מה
       שהאפליקציה הזאת קיימת כדי להחליף. */
    say:leadFor(it)+" "+ans+". "+gl(it.ex),
    reveal:it
  };
}
function buildQuestion(tid,lv,avoid,pure){
  var tp=topicOf(tid); if(!tp)return null;
  var pool=poolOf(tp,lv);
  if(!pool.length)return null;
  var idx=pure?pureIndex(pool,avoid):chooseIndex(tid,lv,pool,avoid);
  var it=pool[idx];
  if(!it)return null;
  var q=buildFromItem(it);
  q.tid=tid; q.lv=lv; q.idx=idx; q.id=itemId(tid,lv,idx);
  q.hint=gl(it.hint);
  return q;
}

   ============================================================ */

function viewFormulas(){
  var h='<div class="wrap" style="padding-top:22px;padding-bottom:44px">';
  h+='<h2 style="font-size:1.5rem">'+esc(t("cfT"))+'</h2>'+
     '<p style="color:var(--muted);margin:.5rem 0 0">'+esc(t("cfP"))+'</p>';
  TRACKS.forEach(function(tr){
    var items=CONCEPTS.filter(function(c){return c.trk===tr.id});
    if(!items.length)return;
    h+='<div class="trk '+tr.cls+'" style="margin:1.4rem 0 .6rem">'+
       '<div class="thead"><span class="tdot"></span><h2 style="font-size:1.15rem">'+
       esc(t(tr.nk))+'</h2><span class="tpill">'+items.length+'</span></div></div>';
    h+='<div class="grid g2">';
    items.forEach(function(c){
      var term=gl(c.t),def=gl(c.d);
      h+='<div class="card tcard trk '+tr.cls+'" style="cursor:default;text-align:start">'+
        '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:.5rem">'+
        '<h3 style="margin:0">'+esc(term)+'</h3>'+
        spkBtn(term+". "+def,state.lang,false,t("hear"))+'</div>'+
        '<div class="sub">'+esc(def)+'</div></div>';
    });
    h+='</div>';
  });
  return h+'</div>'+fbar();
}

var CH_GATE=false; /* מצב האתגר שימש בדיקה פנימית בלבד והוסר עם הפרסום */
var P={q:null,picked:-1,done:false,slot:[],used:[],ok:false,hint:false};

function hdr(){
  var s=state.screen;
  return '<div class="hbar"><div class="wrap hrow">'+
    '<h1 class="brand">'+esc(t("app"))+'<small>'+esc(t("tagline"))+'</small></h1>'+
    (s==="home"?"":'<button class="gbtn" data-a="home">'+ic("home",16)+" "+esc(t("navHome"))+"</button>")+
    '<button class="gbtn'+(s==="sim"?" on":"")+'" data-a="sim">'+ic("play",16)+" "+esc(t("navSim"))+"</button>"+
    /* בנק הטעויות מופיע רק כשיש בו משהו. כפתור שמוביל תמיד
       למסך ריק מלמד להתעלם ממנו. */
    (badList().length?'<button class="gbtn'+(s==="bad"?" on":"")+'" data-a="bad">'+ic("redo",16)+" "+
      esc(t("navBad"))+" ("+badList().length+")</button>":"")+
    '<button class="gbtn'+(s==="form"?" on":"")+'" data-a="form">'+ic("book",16)+" "+esc(t("navForm"))+"</button>"+
    '<button class="gbtn'+(s==="prog"?" on":"")+'" data-a="prog">'+ic("chart",16)+" "+esc(t("navProg"))+"</button>"+
    /* מסך המורה נעלם מהכותרת כשנבחר קוד והמכשיר נעול. */
    (teOpen()?'<button class="gbtn'+(view==="marks"?" on":"")+'" data-a="marks">'+ic("share",16)+" "+esc(t("navExam"))+"</button>":"")+
    '<button class="gbtn'+(s==="set"?" on":"")+'" data-a="set">'+ic("gear",16)+" "+esc(t("navSet"))+"</button>"+
    '<span class="hlang" role="group">'+Object.keys(LANGS).map(function(k){
      return '<button class="'+(state.lang===k?"on":"")+'" data-a="lang" data-v="'+k+
        '" lang="'+k+'" dir="'+LANGS[k].dir+'">'+esc(LANGS[k].name)+'</button>';
    }).join("")+'</span>'+
  "</div></div>"}

function fbar(){
  return '<div class="fbar"><div class="wrap">'+esc(t("savedNote"))+" · "+BUILD+"</div></div>"}

function vstrip(){
  var st=voiceStatus();
  if(st==="ok")return '<div class="vstrip ok">'+ic("spark",15)+" "+esc(t("vsOk"))+"</div>";
  if(st==="dev")return '<div class="vstrip warn">'+ic("play",15)+" "+esc(t("vsDev"))+
    ' <button class="btn ghost" data-a="set">'+esc(t("vGem"))+"</button></div>";
  return '<div class="vstrip bad">'+ic("x",15)+" <b>"+esc(t("vsNoEn"))+"</b> "+esc(t("vsNoEnD"))+
    ' <button class="btn ghost" data-a="set">'+esc(t("setVoice"))+"</button></div>";
}

function screenHome(){
  var h='<div class="wrap">';
  h+='<div class="card" style="margin:1.1rem 0"><h2 style="font-size:1.5rem">'+esc(t("heroT"))+"</h2>"+
     '<p style="color:var(--muted);margin:.5rem 0 0">'+esc(t("heroP"))+"</p></div>";
  h+=vstrip();
  h+='<div class="card gcard" style="margin:1.1rem 0;background:var(--gold-soft);border-inline-start:5px solid #aa6c0c"><h2 style="font-size:1.1rem">'+esc(t("bgT"))+'</h2>'+
     '<p style="color:var(--muted);margin:.4rem 0;font-size:.95rem">'+esc(t("bgP"))+'</p>'+
     '<p style="margin:.3rem 0 0;font-size:.9rem"><a href="https://pop.education.gov.il/tchumey_daat/islam/high-school/pedagogy-of-islam/matriculation-exams/" target="_blank" rel="noopener">'+esc(t("bgL1"))+'</a><br>'+
     '<a href="https://pop.education.gov.il/sherutey-tiksuv-bachinuch/focus-matriculation-exams/" target="_blank" rel="noopener">'+esc(t("bgL2"))+'</a></p></div>';
  TRACKS.forEach(function(tr){
    var tops=TOPICS.filter(function(x){return x.trk===tr.id});
    if(!tops.length)return;
    h+='<div class="trk '+tr.cls+'" style="margin:1.4rem 0 .6rem">'+
       '<div class="thead"><span class="tdot"></span><h2 style="font-size:1.15rem">'+
       esc(t(tr.nk))+'</h2><span class="tpill">'+tops.length+"</span></div>"+
       '<p style="color:var(--muted);font-size:.9rem;margin:.25rem 0 0">'+esc(t(tr.dk))+"</p></div>";
    h+='<div class="grid g2">';
    tops.forEach(function(tp){
      var best=0,li;
      for(li=1;li<=3;li++)best=Math.max(best,mastery(tp.id,li));
      h+='<button class="card tcard trk '+tr.cls+'" data-a="open" data-t="'+esc(tp.id)+'">'+
        "<h3>"+esc(tName(tp))+"</h3>"+
        '<div class="sub">'+esc(tDesc(tp))+"</div>"+
        '<div style="display:flex;align-items:center;gap:.5rem;margin-top:.35rem">'+
        '<span class="bar '+barCls(best)+'"><i style="width:'+Math.round(best*100)+'%"></i></span>'+
        '<span class="chip">'+Math.round(best*100)+"%</span></div></button>";
    });
    h+="</div>";
  });
  return h+"</div>"+fbar();

function levelBar(tp){
  var h='<div class="lvls">',i;
  for(i=1;i<=3;i++){
    var m=mastery(tp.id,i);
    h+='<button class="lvl'+(state.level===i&&!state.challenge?" on":"")+'" data-a="lvl" data-v="'+i+'">'+
      esc(t("lv"+i))+' <span class="bar '+barCls(m)+'" style="width:2.6rem;flex:none">'+
      '<i style="width:'+Math.round(m*100)+'%"></i></span></button>';
  }
  if(CH_GATE){
    h+='<button class="lvl'+(state.challenge?" on":"")+'" data-a="chal"'+(state.challenge?' style="background:#6d28d9;color:#fff;border-color:#6d28d9;font-weight:700"':"")+'>'+esc(t("lvC"))+'</button>';
  }
  h+="</div>";
  if(CH_GATE&&state.challenge){
    h+='<div style="display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin:.4rem 0">'+
       '<span style="font-size:.88rem;color:var(--muted)">'+esc(t("chMixed"))+'</span>'+
       '<span style="font-size:.88rem;color:var(--muted)">· '+esc(t("chTimer"))+':</span>'+
       [0,30,60].map(function(s){
         return '<button class="lvl'+(state.chSecs===s?" on":"")+'" data-a="chsec" data-v="'+s+'" style="min-height:46px">'+(s===0?esc(t("chOff")):esc(t("chSec").replace("{0}",s)))+'</button>';
       }).join("")+'</div>';
  }
  return h;
}

function spkBtn(text,lang,slow,label){
  return '<button class="spk'+(slow?" sm":"")+'" data-a="say" data-say="'+esc(text)+
    '" data-lang="'+esc(lang)+'"'+(slow?' data-slow="1"':"")+
    ' aria-label="'+esc(label||t("hear"))+'">'+(slow?ic("slow",15):'\u266b '+esc(label||t("hear")))+"</button>";
}
function spkStop(){
  return '<button class="spk spkStop" data-a="stop" aria-label="'+esc(t("stopB"))+'">'+esc(t("stopB"))+"</button>";
}

/* כרטיס הנושא: מה שמוצג מעל האפשרויות. בהיסטוריה זו כותרת
   האירוע או המושג, ולצידה כפתורי השמעה בשפת הממשק. */
function leadBox(txt,sub){
  if(!txt)return "";
  return '<div class="subject"><span class="word" style="font-size:1.15rem">'+esc(txt)+"</span>"+
    (sub?'<span class="ipa">'+esc(sub)+"</span>":"")+
    '<span style="margin-inline-start:auto;display:flex;gap:.4rem">'+
    spkBtn(txt,state.lang,false,t("hearWord"))+spkBtn(txt,state.lang,true,t("hearSlow"))+spkStop()+"</span></div>";
}

/* נוסח השאלה, ולצידו כפתורי השמעה. באזרחות השאלה היא משפט שלם
   ולא מילה בודדת, ולכן היא יושבת בשורה משלה ולא בתוך שורת נושא. */
function askBox(txt){
  if(!txt)return "";
  return '<div class="subject" style="align-items:flex-start">'+
    '<span class="qtext" style="flex:1;margin:0">'+brOk(esc(txt))+"</span>"+
    '<span style="display:flex;gap:.4rem;flex:none">'+
    spkBtn(txt,state.lang,false,t("hearWord"))+spkBtn(txt,state.lang,true,t("hearSlow"))+spkStop()+"</span></div>";
}

function screenPractice(){
  var tp=topicOf(state.topic); if(!tp){state.screen="home";return screenHome()}
  var tr=trackOf(tp.trk), q=P.q;
  var h='<div class="wrap"><div class="trk '+tr.cls+'">';
  h+='<div style="display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin:1rem 0 .6rem">'+
     '<span class="tdot"></span><h2 style="font-size:1.2rem">'+esc(tName(tp))+"</h2>"+
     '<span class="tpill">'+esc(t(tr.nk))+"</span></div>";
  h+=levelBar(tp);
  h+='<p style="color:var(--muted);font-size:.88rem;margin:.5rem 0 .8rem">'+esc(t("lv"+state.level+"D"))+"</p>";
  h+=vstrip();
  if(!q)return h+"</div></div>"+fbar();

  h+='<div class="card qcard">';
  h+='<div class="qtop"><span class="chip">'+esc(q.prompt)+"</span>"+
     '<span class="chip" style="margin-inline-start:auto">'+esc(t("todayL"))+" "+(state.day.n||0)+"</span></div>";

  h+=askBox(q.lead||"");
  /* האיור, כשיש. הוא אינו נדרש לפתרון — הוא מראה במבט אחד את
     מה שהטקסט מתאר במילים, ולכן הוא עוזר בדיוק למי שהטקסט
     מכביד עליו. */
  if(q.fig)h+=q.fig;

  {
    h+='<div class="opts'+(q.opts.length>3?"":" two")+'" id="opts">';
    /* רמקול לכל אפשרות, כמו באנגלית: מי שאינו יודע לקרוא את הניסוח
       לא יכול לבחור בו. הקראת אפשרות אינה הסגרת תשובה — היא זמינה
       על כל ארבע במידה שווה, והמעקב הצהוב עובד כמו בנוסח השאלה. */
    q.opts.forEach(function(o,i){
      var cls="opt";
      if(P.done){
        if(o.ok)cls+=" ok";
        else if(i===P.picked)cls+=" bad";
        else cls+=" dim";
      }
      var ob='<button class="'+cls+'" data-a="pick" data-i="'+i+'"'+(P.done?" disabled":"")+'>'+
        '<span class="k">'+String.fromCharCode(65+i)+"</span><span>"+o.h+"</span></button>";
      h+='<div class="orow">'+ob+
        '<button class="spk sm" data-a="say" data-say="'+esc(plainOf(o.h))+'" data-lang="'+esc(state.lang)+
        '" aria-label="'+esc(t("hearOpt"))+'">'+ic("play",15)+"</button></div>";
    });
    h+="</div>";
  }

  if(P.done){
    var it=q.reveal;
    h+='<div class="fb '+(P.ok?"ok":"bad")+'"><b>'+(P.ok?esc(t("correct")):esc(t("wrong")))+"</b>";
    if(!P.ok){h+='<div class="body">'+esc(t("answerIs"))+" <b>"+esc(q.answer)+"</b></div>";
      if(P.timeUp)h+='<div class="body" style="color:#b45309;font-weight:700">'+esc(t("chTimeUp"))+'</div>';
      var wp=P.picked>=0&&q.opts[P.picked]?q.opts[P.picked].why:"";
      if(wp)h+='<div class="why"><b>'+esc(t("whyNot"))+":</b> "+esc(wp)+"</div>";}
    /* ההסבר נפתח גם כשצדקו. תשובה נכונה שנוחשה נראית בדיוק כמו
       תשובה נכונה שנודעה, ורק ההסבר מבדיל ביניהן. */
    if(it&&it.ex)h+='<div class="why"><b>'+esc(t("whyT"))+":</b> "+esc(gl(it.ex))+"</div>";
    h+="</div>";
    h+='<div style="display:flex;gap:.5rem;margin-top:.9rem;flex-wrap:wrap">'+
       spkBtn(saySpell(q.say),state.lang,false,t("hearSent"))+spkBtn(saySpell(q.say),state.lang,true,t("hearSlow"))+spkStop()+
       '<button class="btn pri" data-a="next" style="margin-inline-start:auto">'+
       esc(t("next"))+" "+ic("arrow",16)+"</button></div>";
  } else {
    h+='<div style="display:flex;gap:.5rem;margin-top:.9rem;flex-wrap:wrap;align-items:center">'+
       (state.challenge&&state.chSecs>0?'<span id="chtimer" style="font-weight:800;color:#b45309;min-width:2.6rem;font-size:1.1rem">'+state.chSecs+'</span>':"")+
       (P.hint||state.challenge?"":'<button class="btn ghost" data-a="hint">'+esc(t("hintB"))+"</button>")+
       '<button class="btn ghost" data-a="dunno">'+esc(t("dunno"))+"</button>"+
       (window.TUTOR&&TUTOR.on()?'<button class="btn ghost" data-a="tutor">'+esc(TUTOR.label())+"</button>":"")+"</div>";
    if(P.hint&&q.hint)h+='<div class="qhint" style="margin-top:.6rem">'+esc(q.hint)+"</div>";
  }
  h+="</div></div></div>"+fbar();
  return h;
}

function screenProg(){
  var h='<div class="wrap"><h2 style="margin:1.1rem 0 .3rem;font-size:1.4rem">'+esc(t("progT"))+"</h2>";
  var acc=state.totalAsk?Math.round(100*state.totalOk/state.totalAsk):0;
  var seen=0,mast=0;
  TOPICS.forEach(function(tp){for(var l=1;l<=3;l++){
    var s=state.stats[stKey(tp.id,l)];
    if(s&&s.seen){seen++;if(mastery(tp.id,l)>=.75)mast++}}});
  h+='<div class="grid g3" style="margin:.8rem 0 1.2rem">';
  [[t("streakL"),state.streak||0],[t("todayL"),state.day.n||0],[t("accL"),acc+"%"]].forEach(function(p){
    h+='<div class="card" style="text-align:center"><div style="font-size:1.9rem;font-weight:800">'+
      esc(String(p[1]))+'</div><div style="color:var(--muted);font-size:.9rem">'+esc(p[0])+"</div></div>";
  });
  h+="</div>";
  if(!state.totalAsk)h+='<div class="card"><p style="margin:0;color:var(--muted)">'+esc(t("progNone"))+"</p></div>";
  TRACKS.forEach(function(tr){
    var tops=TOPICS.filter(function(x){return x.trk===tr.id&&
      [1,2,3].some(function(l){var s=state.stats[stKey(x.id,l)];return s&&s.seen})});
    if(!tops.length)return;
    h+='<div class="trk '+tr.cls+'"><div class="thead" style="margin:1.2rem 0 .5rem">'+
       '<span class="tdot"></span><h3 style="font-size:1.05rem">'+esc(t(tr.nk))+"</h3></div>";
    h+='<div class="card">';
    tops.forEach(function(tp){
      h+='<div class="row"><div><div class="lab">'+esc(tName(tp))+"</div>"+
        '<div class="desc">';
      for(var l=1;l<=3;l++){
        var s=state.stats[stKey(tp.id,l)];
        if(s&&s.seen)h+=esc(t("lv"+l))+" "+s.ok+"/"+s.seen+"   ";
      }
      h+="</div></div>";
      var best=Math.max(mastery(tp.id,1),mastery(tp.id,2),mastery(tp.id,3));
      h+='<span class="bar '+barCls(best)+'" style="max-width:8rem"><i style="width:'+
        Math.round(best*100)+'%"></i></span></div>';
    });
    h+="</div></div>";
  });
  h+='<p style="color:var(--muted);font-size:.9rem;margin-top:1rem">'+esc(t("seen"))+": "+seen+
     " · "+esc(t("mastered"))+": "+mast+"</p>";
  return h+"</div>"+fbar();
}

   מבחן מדומה
   ------------------------------------------------------------
   עשרים שאלות מכל הנושאים ומכל הרמות, בחוברת אחת שגוללים בה —
   ולא שאלה־שאלה. מי שקורא לאט צריך לראות כמה נשאר, לחזור אחורה
   ולשנות תשובה; ניווט שמסתיר את שאר השאלות לוקח ממנו בדיוק את זה.

   המבחן אינו נשמר. הוא מצב זמני בזיכרון בלבד, ורענון הדף מתחיל
   אותו מחדש — זו הצהרה ולא פער: שעון שממשיך לרוץ בין ביקורים
   הוא בדיוק המקום שבו נולדים באגים שקשה לשחזר.
   ============================================================ */
var SIM_N=20, SIM_MIN=30;
var SIM={on:false,done:false,q:[],ans:[],end:0,tick:null};

function simStop(){if(SIM.tick){clearInterval(SIM.tick);SIM.tick=null}}
function simFmt(ms){
  if(ms<0)ms=0;
  var sec=Math.round(ms/1000),m=Math.floor(sec/60),c=sec%60;
  return m+":"+(c<10?"0":"")+c;
}
function simLeftN(){
  var n=0,i;
  for(i=0;i<SIM.ans.length;i++)if(SIM.ans[i]<0)n++;
  return n;
}
function simRight(){
  var n=0,i;
  for(i=0;i<SIM.q.length;i++)if(SIM.ans[i]>=0&&SIM.q[i].opts[SIM.ans[i]].ok)n++;
  return n;
}
function simStart(){
  var pairs=[],qs=[],i,q;
  TOPICS.forEach(function(tp){for(var l=1;l<=3;l++)pairs.push([tp.id,l])});
  shuffle(pairs);
  for(i=0;i<pairs.length&&qs.length<SIM_N;i++){
    q=buildQuestion(pairs[i][0],pairs[i][1],undefined,true);
    if(q)qs.push(q);
  }
  /* פחות צמדי נושא-רמה מ-SIM_N: סבב נוסף, בלי לחזור על אותו פריט. */
  var guard=0;
  while(qs.length<SIM_N&&guard<400){
    var pr=pairs[guard%pairs.length]; guard++;
    q=buildQuestion(pr[0],pr[1],undefined,true);
    if(!q)continue;
    var dup=false,k;
    for(k=0;k<qs.length;k++)if(qs[k].id===q.id){dup=true;break}
    if(!dup)qs.push(q);
  }
  SIM.q=qs;
  SIM.ans=qs.map(function(){return -1});
  SIM.on=true; SIM.done=false; SIM.end=Date.now()+SIM_MIN*60000;
  simArm();
}
function simArm(){
  simStop();
  if(SIM.on&&!SIM.done)SIM.tick=setInterval(simClock,1000);
}
function simClock(){
  var el=$("#simclock");
  /* המסך הוחלף — אין מה לעדכן, והשעון נעצר מעצמו. */
  if(!el){simStop();return}
  var left=SIM.end-Date.now();
  el.textContent=simFmt(left);
  if(left<=60000)el.classList.add("low");
  if(left<=0){simStop();simSubmit()}
}
/* ההגשה היא גם רגע הרישום: עד כאן לא נספרה אף תשובה, כדי
   שהמבחן לא ידחוף לבנק הטעויות שאלה שהנבחן עוד עמד לשנות. */
function simSubmit(){
  if(!SIM.on||SIM.done)return;
  simStop();
  var i;
  for(i=0;i<SIM.q.length;i++){
    var q=SIM.q[i],pk=SIM.ans[i];
    recordItem(q.tid,q.lv,q.id,pk>=0&&!!q.opts[pk].ok);
  }
  SIM.done=true; save(); render(); window.scrollTo(0,0);
}

function screenSim(){
  var h='<div class="wrap"><h2 style="margin:1.1rem 0 .3rem;font-size:1.4rem">'+esc(t("simT"))+"</h2>";
  if(!SIM.on){
    h+='<div class="card"><p style="margin:0 0 .8rem;color:var(--muted)">'+esc(t("simD"))+"</p>"+
       '<button class="btn pri" data-a="simstart">'+ic("play",16)+" "+esc(t("simStart"))+"</button></div>";
    return h+"</div>"+fbar();
  }
  if(SIM.done){
    var right=simRight(),pc=Math.round(100*right/Math.max(1,SIM.q.length));
    h+='<div class="card" style="text-align:center"><div style="font-size:2.2rem;font-weight:800">'+
       pc+'%</div><div style="color:var(--muted)">'+esc(t("simScore"))+" — "+right+" / "+SIM.q.length+"</div>"+
       '<div style="margin-top:.8rem"><button class="btn pri" data-a="simstart">'+
       ic("redo",16)+" "+esc(t("simAgain"))+"</button></div></div>";
    h+='<h3 style="margin:1.2rem 0 .2rem;font-size:1.1rem">'+esc(t("simReview"))+"</h3>";
    SIM.q.forEach(function(q,i){
      var pk=SIM.ans[i],ok=pk>=0&&!!q.opts[pk].ok;
      h+='<div class="simq"><div class="simn">'+esc(t("simQ"))+" "+(i+1)+" · "+
         esc(topicOf(q.tid)?tName(topicOf(q.tid)):"")+" · "+esc(t("lv"+q.lv))+"</div>";
      h+=askBox(q.lead||"");
      if(q.fig)h+=q.fig;
      h+='<div class="fb '+(ok?"ok":"bad")+'"><b>'+(ok?esc(t("correct")):esc(t("wrong")))+"</b>"+
         '<div class="body">'+esc(t("simYours"))+": <b>"+
         esc(pk>=0?plainOf(q.opts[pk].h):t("simNone"))+"</b><br>"+
         esc(t("answerIs"))+" <b>"+esc(q.answer)+"</b></div>";
      var wsim=pk>=0&&!ok&&q.opts[pk]?q.opts[pk].why:"";
      if(wsim)h+='<div class="why"><b>'+esc(t("whyT"))+":</b> "+esc(wsim)+"</div>";
      else if(q.reveal&&q.reveal.ex)
        h+='<div class="why"><b>'+esc(t("whyT"))+":</b> "+esc(gl(q.reveal.ex))+"</div>";
      h+="</div>";
      h+='<div style="display:flex;gap:.5rem;margin-top:.6rem">'+
         spkBtn(saySpell(q.say),state.lang,false,t("hearSent"))+
         spkBtn(saySpell(q.say),state.lang,true,t("hearSlow"))+spkStop()+"</div>";
      h+="</div>";
    });
    return h+"</div>"+fbar();
  }
  /* המבחן עצמו. השעון נדרך אחרי הציור, כי הוא מעדכן אלמנט
     שעדיין לא קיים בזמן שבניית ה-HTML רצה. */
  setTimeout(simArm,0);
  h+='<div class="simbar"><span class="clock" id="simclock">'+esc(simFmt(SIM.end-Date.now()))+"</span>"+
     '<span class="chip"><span id="simleft">'+simLeftN()+"</span> "+esc(t("simLeft"))+"</span>"+
     '<button class="btn pri" data-a="simsubmit" style="margin-inline-start:auto">'+
     esc(t("simSubmit"))+"</button></div>";
  SIM.q.forEach(function(q,i){
    h+='<div class="simq"><div class="simn">'+esc(t("simQ"))+" "+(i+1)+" / "+SIM.q.length+"</div>";
    h+=askBox(q.lead||"");
    if(q.fig)h+=q.fig;
    h+='<div class="opts">';
    q.opts.forEach(function(o,j){
      h+='<button class="opt'+(SIM.ans[i]===j?" sel":"")+'" data-a="simpick" data-i="'+i+
        '" data-j="'+j+'"><span class="k">'+String.fromCharCode(65+j)+"</span><span>"+o.h+"</span></button>";
    });
    h+="</div></div>";
  });
  h+='<div style="margin:1rem 0"><button class="btn pri" data-a="simsubmit">'+
     esc(t("simSubmit"))+"</button></div>";
  return h+"</div>"+fbar();
}

/* ============================================================
   מתאם למסכי המבחן
   ------------------------------------------------------------
   מסכי המבחן נכתבו לאפליקציות המתמטיקה. שם השאלה נראית אחרת —
   ask, options, topicName — וכאן היא prompt, lead ו-opts. גם
   הניווט שונה: שם משתנה view, וכאן state.screen. ההמרה נעשית
   כאן, במקום אחד, ולא בפיזור תנאים בתוך המסכים.
   ============================================================ */

   שהוא מערך, הוא מתרענן בכל ציור מסך, אחרת החלפת שפה לא הייתה
   משנה את מה שכתוב במבחן. */

/* ============================================================
   18. מבחן כיתתי — פרסום בוואטסאפ, קבלת תשובות וציונים
   ------------------------------------------------------------
   אין שרת, ואין כוונה שיהיה. לכן המבחן אינו נשלח לשום מקום:
   הוא *נארז לתוך הקישור*. המורה מקבל קישור, שולח אותו בוואטסאפ,
   והמכשיר של התלמיד בונה מהקישור בדיוק את אותן שאלות.

   מה שהופך את זה לאפשרי הוא שכל מחולל שאלות כאן משתמש ב-
   Math.random בלבד. אם מזרעים אותו, אותו זרע מייצר את אותן
   שאלות ואת אותו סדר תשובות — אצל המורה ואצל התלמיד. הקישור
   נושא זרע ורשימת נושאים, לא עשרים שאלות מלאות, ולכן הוא נשאר
   קצר מספיק לוואטסאפ.

   שלוש מגבלות שנאמרות כאן במפורש כי הן חלק מהתכנון:
   · אין איסוף אוטומטי. התלמיד שולח קוד תשובות בוואטסאפ, והמורה
     מדביק אותו. זה המחיר של אפס שרת ואפס עלות.
   · אפשר לזייף קוד. הציון מחושב מחדש אצל המורה מתוך התשובות
     ולא נלקח מהתלמיד, אבל אין כאן הגנה קריפטוגרפית — זה מבחן
     כיתתי מעצב, לא בגרות.
   · שמות התלמידים נשארים במכשיר של המורה. הם לא עוברים דרך
     שום שרת, כי אין שרת.
   ============================================================ */
var GENV=2;                 /* גרסת המחוללים. מבחן שנוצר בגרסה אחרת
                               אינו נפתח — עדיף הודעה ברורה מאשר
                               עשרים שאלות אחרות בשקט. */
var EKEY="shlav-exams-islam-v1";   /* מפתח לאפליקציה הזאת בלבד */
var EKEY_OLD="shlav-exams-v1";  /* המפתח המשותף הישן. לקריאה בלבד, לא נמחק. */

/* --- מחולל מזורע. mulberry32: קצר, מהיר, ופיזור טוב דיו --- */
function withSeed(seed,fn){
  var real=Math.random,s=(seed>>>0)||1;
  Math.random=function(){
    s|=0; s=s+0x6D2B79F5|0;
    var t=Math.imul(s^s>>>15,1|s);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
  try{return fn()}finally{Math.random=real}
}
function hash32(str){
  var h=0x811c9dc5,i;
  for(i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193)}
  return (h>>>0);
}
/* base64url. הניקוי בפענוח אינו קוסמטי: וואטסאפ שובר מחרוזות
   ארוכות בשורות, ורווח אחד הורס את כל הקוד. */
function b64e(str){
  var bytes=new TextEncoder().encode(str),bin="",i;
  for(i=0;i<bytes.length;i+=8192)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));
  return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function b64d(s){
  s=String(s||"").replace(/[^A-Za-z0-9\-_]/g,"").replace(/-/g,"+").replace(/_/g,"/");
  while(s.length%4)s+="=";
  var bin=atob(s),bytes=new Uint8Array(bin.length),i;
  for(i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
/* הזרע של המשבצת נכנס למזהה: שני מבחנים באותם נושאים ובאותה
   רמה, שהמורה החליף באחד מהם שאלה, אינם אותו מבחן. מבחן ישן
   שאין לו זרעים מקבל בדיוק את המזהה שקיבל תמיד — אחרת ההגשות
   שכבר נקלטו אליו מתייתמות. */
function examId(spec){return hash32(spec.s+"|"+spec.q.map(function(x){
  return x[0]+x[1]+(x.length>2?"@"+x[2]:"")}).join(",")).toString(36)}
function encodeExam(spec){return b64e(JSON.stringify(spec))}
function decodeExam(code){
  try{
    var o=JSON.parse(b64d(code));
    if(!o||!o.q||!o.q.length||typeof o.s!=="number")return null;
    o.q=o.q.filter(function(x){return topicById(x[0])});
    return o.q.length?o:null;
  }catch(e){return null}
}
/* בונה את שאלות המבחן. אותו זרע → אותן שאלות, גם אצל המורה
   כשהוא בודק וגם אצל התלמיד כשהוא נבחן. */
function examQuestions(spec){
  /* מסננים נושאים שאינם מוכרים לאפליקציה הזאת, בדיוק כמו decodeExam.
     בלי הסינון buildQ מחזיר null על נושא זר, והמסך נופל על
     q.topic של null. עדיף לדלג בשקט מאשר להתרסק. */
  var pairs=(spec.q||[]).filter(function(x){return !!topicById(x[0])});
  /* מבחן שנבנה עם זרע לכל משבצת נבנה משבצת אחרי משבצת, וכל
     שאלה תלויה בזרע שלה בלבד — כך המורה יכול להחליף אחת מהן.
     מבחן ישן, בלי זרעים, חייב להיבנות בדיוק כפי שנבנה ביום
     שנשלח: אחרת הציון של מי שכבר נבחן משתנה למפרע. */
  if(pairs.length&&pairs.every(function(x){return typeof x[2]==="number"}))
    return pairs.map(function(p){return exBuildSlot(p)})
                .filter(function(q){return !!q});
  return withSeed(spec.s,function(){
    return pairs.map(function(pair){return buildQ(pair[0],pair[1])})
                .filter(function(q){return !!q});
  });
}
/* --- בחירת השאלות בידי המורה ---------------------------------
   עד כאן המורה בחר נושאים, רמה ומספר שאלות — והשאלות עצמן הוגרלו
   מאחורי גבו. הוא ראה אותן לראשונה רק אחרי שהמבחן כבר היה אצל
   התלמידים. מעכשיו כל שאלה היא משבצת נפרדת עם זרע משלה: המורה
   רואה אותה לפני השליחה, מחליף אותה בשאלה אחרת מאותו נושא,
   מסיר אותה, או מוסיף שאלה מנושא שחסר לו.

   הזרע הנפרד לכל משבצת הוא מה שמאפשר את זה. בזרם אקראי אחד
   ומשותף, כפי שהיה עד כאן, החלפה של השאלה השלישית הייתה משנה
   גם את הרביעית ואת החמישית — כלומר לא "החלפה" אלא הגרלה מחדש
   של כל מה שאחריה.

   24 ביט ולא 32: הזרע נוסע בתוך הקישור שנשלח בוואטסאפ, וזרע
   קצר יותר הוא קישור קצר יותר. שישה־עשר מיליון אפשרויות למשבצת
   הן הרבה מעבר למה שהמחולל עצמו יודע לייצר. */
function exNewSeed(){return (Math.random()*16777215)>>>0}
function exSlot(topicId,level){return [topicId,level,exNewSeed()]}
/* אותו זרע → אותה שאלה בדיוק: אצל המורה כשהוא בוחר, ואצל
   התלמיד כשהוא נבחן. */
function exBuildSlot(slot){
  if(!slot||!topicById(slot[0]))return null;
  return withSeed(slot[2],function(){return buildQ(slot[0],slot[1])})||null;
}
/* מסך הבנייה מצייר את עצמו מחדש אחרי כל לחיצה, ובניית עשרים
   וחמש שאלות בכל ציור מיותרת. המטמון הוא לתצוגה בלבד — מי
   שנבחן בונה את שאלותיו מחדש, כדי שאיש לא יערוך בטעות אובייקט
   שגם מסך אחר מחזיק בו. */
var EXQCACHE={};
/* לכל אפליקציה מנגנון שפה משלה, ולא לכולן אותם שמות. הפנייה
   דרך window ולא בשם ישיר, כי שם שאינו קיים באפליקציה מסוימת
   הוא שגיאה בעיני הבודקים — רעש שמסתיר שגיאה אמיתית. */
function exLangKey(){
  try{
    var g=(typeof window!=="undefined")?window:{};
    if(typeof g.xlg==="function")return g.xlg();
    if(typeof g.LG==="string")return g.LG;
    return (state&&state.settings&&state.settings.lang)||"he";
  }catch(e){return "he"}
}
function exPreviewQ(slot){
  if(!slot)return null;
  var k=slot[0]+"|"+slot[1]+"|"+slot[2]+"|"+exLangKey();
  if(!(k in EXQCACHE)){
    /* מורה שמחליף שאלות שוב ושוב מייצר מפתח חדש בכל לחיצה.
       מטמון שרק גדל הוא דליפה; מרוקנים אותו ומתחילים מחדש. */
    if(Object.keys(EXQCACHE).length>400)EXQCACHE={};
    EXQCACHE[k]=exBuildSlot(slot);
  }
  return EXQCACHE[k];
}
function exTopicName(id){
  var t=topicById(id); if(!t)return "";
  var g=(typeof window!=="undefined")?window:{};
  return (typeof g.tName==="function"?g.tName(t):t.name)||"";
}
function exRightAnswer(q){
  var i; if(!q||!q.options)return null;
  for(i=0;i<q.options.length;i++)if(q.options[i].ok)return q.options[i];
  return null;
}
/* המשבצות שהמורה עורך. נבנות מחדש רק כשנושא, רמה או מספר
   השאלות משתנים; עריכה של משבצת בודדת נשמרת. */
function exSlots(){
  if(EB.q&&EB.q.length)return EB.q;
  var tops=EB.topics.filter(function(x){return topicById(x)});
  if(!tops.length)tops=topicsForTrack(state.track).slice(0,3).map(function(t){return t.id});
  var q=[],i;
  for(i=0;i<EB.n;i++)q.push(exSlot(tops[i%tops.length],EB.level));
  /* מערבבים כאן ולא בשליחה: המורה רואה את הסדר הסופי ומאשר אותו. */
  EB.q=shuffle(q);
  return EB.q;
}
function examUrl(spec){
  var base=location.origin+location.pathname;
  return base+"#x="+encodeExam(spec);
}
function waLink(text,phone){
  var p=String(phone||"").replace(/[^0-9]/g,"");
  return "https://wa.me/"+p+"?text="+encodeURIComponent(text);
}

/* --- אחסון מבחנים והגשות, בנפרד מהתקדמות התלמיד --- */
var EX={list:[]};
/* --- הגירה מהמפתח המשותף הישן ---------------------------------
   עד הגרסה הזאת כל האפליקציות כתבו מבחנים לאותו מפתח localStorage
   ובאותו origin, ולכן מבחן שנבנה במתמטיקה הופיע ברשימת המבחנים של
   אנגלית והפיל את המסך. מעכשיו לכל אפליקציה מפתח משלה, ובטעינה
   מועתקות מהמפתח הישן רק רשומות שכל נושאיהן מוכרים כאן.
   המפתח הישן נשאר על כנו ואינו נמחק, כדי שגם אפליקציה אחרת תוכל
   לקלוט ממנו את המבחנים ששייכים לה. --------------------------- */
function exSpecKnown(spec){
  if(!spec||!spec.q||!spec.q.length)return false;
  for(var i=0;i<spec.q.length;i++){
    var pair=spec.q[i];
    if(!pair||!topicById(pair[0]))return false;
  }
  return true;
}
function exAdoptLegacy(){
  var added=0;
  try{
    var raw=localStorage.getItem(EKEY_OLD); if(!raw)return;
    var old=JSON.parse(raw); if(!old||!old.list||!old.list.length)return;
    var have={},i,ex;
    for(i=0;i<EX.list.length;i++)have[EX.list[i].id]=1;
    for(i=0;i<old.list.length;i++){
      ex=old.list[i];
      if(!ex||!ex.id||have[ex.id])continue;
      if(!exSpecKnown(ex.spec))continue;
      EX.list.push(ex); have[ex.id]=1; added++;
    }
  }catch(e){return}
  if(added)exSave();
}
function exLoad(){
  try{var r=localStorage.getItem(EKEY);if(r){var o=JSON.parse(r);if(o&&o.list)EX=o}}catch(e){}
  if(!EX.list)EX.list=[];
  exAdoptLegacy();
}
function exSave(){try{localStorage.setItem(EKEY,JSON.stringify(EX))}catch(e){}}
function exFind(id){for(var i=0;i<EX.list.length;i++)if(EX.list[i].id===id)return EX.list[i];return null}

/* --- קוד ההגשה של התלמיד --- */
function encodeResult(id,name,answers){
  var body={i:id,n:String(name||"").slice(0,40),a:answers,d:todayIso()};
  body.c=hash32(JSON.stringify([body.i,body.n,body.a])).toString(36);
  return b64e(JSON.stringify(body));
}
function decodeResult(code){
  try{
    var o=JSON.parse(b64d(code));
    if(!o||!o.i||!o.a||!o.a.length)return null;
    o.ok=(o.c===hash32(JSON.stringify([o.i,o.n,o.a])).toString(36));
    return o;
  }catch(e){return null}
}
/* הציון מחושב כאן מחדש מתוך התשובות. מה שהתלמיד שלח הוא מה
   שסימן, לא כמה הוא קיבל. */
function gradeResult(spec,res){
  var qs=examQuestions(spec),per=[],ok=0,i,q,a;
  for(i=0;i<qs.length;i++){
    q=qs[i]; a=res.a[i];
    var right=(a>=0&&q.options[a]&&q.options[a].ok)?1:0;
    if(right)ok++;
    per.push({topic:q.topic,topicName:q.topicName,ok:right,
              picked:(a>=0&&q.options[a])?q.options[a].t:"—",
              answer:(q.options.filter(function(o){return o.ok})[0]||{}).t||""});
  }
  return {ok:ok,n:qs.length,pct:Math.round(100*ok/qs.length),per:per};
}

var EB={title:"",n:10,mins:0,level:2,topics:[],phone:"",tts:true,formulas:true,built:null,copied:"",q:null,ans:false};


/* ------------------------------------------------------------
   מילון המבחן. הוא עומד בפני עצמו ואינו נשען על המילון הכללי
   של האפליקציה: מודול המבחן זהה בכל האפליקציות ומועתק ביניהן
   כמו שהוא, וכל אחת מהן מתרגמת בדרך אחרת. כך ההעתקה נשארת

/* ------------------------------------------------------------
   ייצוא CSV של ההגשות.
   העתקת הטבלה נותנת טקסט מופרד בטאבים — נוח להדבקה, אבל לא קובץ.
   מורה שרוצה למיין, לסנן או לחשב ממוצע צריך גיליון. שורה לכל תלמיד,
   ועמודה לכל שאלה, כדי שאפשר יהיה לראות מיד באיזו שאלה נפלה הכיתה.
   ה-BOM בהתחלה הוא מה שגורם לאקסל לקרוא עברית, ערבית ורוסית נכון
   במקום ג׳יבריש — בלעדיו הקובץ נפתח שבור בדיוק אצל מי שצריך אותו.
   ------------------------------------------------------------ */
function csvCell(v){
  var s=(v===undefined||v===null)?"":String(v);
  return /[",\n\r;\t]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function csvRow(a){ return a.map(csvCell).join(",") }
/* ============================================================
   מצב מורה.
   בונה המבחן ומסך הציונים נועדו למורה. על טאבלט כיתתי, או על
   טלפון שהילד לוקח לעצמו, אין סיבה שהם יהיו במרחק הקשה אחת:
   ילד יכול למחוק מבחן, לראות ציונים של חברים, או לפתוח מבחן
   ולראות מראש את השאלות.
   זו אינה אבטחה, ואסור להציג אותה ככזאת: מי שיודע לפתוח כלי
   פיתוח יעקוף אותה בשנייה. זו נעילה מפני יד סקרנית — בדיוק מה
   שצריך כאן, ולא יותר.
   כל עוד לא נבחר קוד, שום דבר לא משתנה והמסכים גלויים כתמיד.
   ============================================================ */

/* גיבוב חלש כגיבוי בלבד. SubtleCrypto קיים בכל דפדפן מודרני
   בהקשר מאובטח, ו-GitHub Pages הוא כזה. */
function teWeak(s){var h=5381,i;for(i=0;i<s.length;i++)h=((h*33)^s.charCodeAt(i))>>>0;return "w"+h.toString(16)}
function teHash(pin,salt,cb){
  var msg=salt+"|"+pin;
  try{
    if(window.crypto&&crypto.subtle&&crypto.subtle.digest&&window.TextEncoder){
      crypto.subtle.digest("SHA-256",new TextEncoder().encode(msg)).then(function(d){
        var a=Array.prototype.slice.call(new Uint8Array(d));
        cb(a.map(function(b){return ("0"+b.toString(16)).slice(-2)}).join(""));
      },function(){cb(teWeak(msg))});
      return;
    }
  }catch(e){}
  cb(teWeak(msg));
}
function teSalt(){
  var s="";
  try{
    var a=new Uint8Array(8);crypto.getRandomValues(a);
    s=Array.prototype.slice.call(a).map(function(b){return ("0"+b.toString(16)).slice(-2)}).join("");
  }catch(e){ s=String(Date.now())+Math.random().toString(36).slice(2) }
  return s;
}
/* השהיה אחרי ניסיונות כושלים. ארבע ספרות הן עשרת אלפים
   אפשרויות, וילד סבלני יכול לנסות הרבה. */
function teWait(){
  var r=teRead();if(!r||!r.bad||r.bad<3)return 0;
  var pen=Math.min(300,Math.pow(2,r.bad-3)*5)*1000;
  var left=Math.ceil(((r.badAt||0)+pen-Date.now())/1000);
  return left>0?left:0;
}

    (!setting&&teHas()?'<button class="te-btn link" id="te-forgot">'+esc(xt("teForgot"))+'</button>':'')+
    '</div>';
  document.body.appendChild(w);
  var box=w.firstChild, pin=document.getElementById("te-pin");
  box.focus(); if(pin&&!wait)pin.focus();
  /* מלכודת פוקוס, כמו בשער התנאים */
  w.addEventListener("keydown",function(e){
    if(e.key==="Escape"){teClose();return}
    if(e.key==="Enter"){e.preventDefault();teSubmit();return}
    if(e.key!=="Tab")return;
    var f=box.querySelectorAll("button:not([disabled]),input");
    if(!f.length)return;
    var a=f[0],z=f[f.length-1];
    if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}
    else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}
  });
  document.getElementById("te-no").onclick=teClose;
  document.getElementById("te-ok").onclick=teSubmit;
  var fg=document.getElementById("te-forgot");
  if(fg)fg.onclick=function(){ TE.msg=xt("teForgotHow"); teDialog() };
}
function teClose(){ TE.ask=false; TE.mode=""; TE.msg=""; teDialog();
  var b=_teOpener; _teOpener=null;
  try{ if(b&&b.focus&&document.contains(b))b.focus() }catch(e){} }
function teSubmit(){
  if(TE.busy)return;
  var setting=(TE.mode==="set"||TE.mode==="change"||!teHas());
  var pin=(document.getElementById("te-pin")||{}).value||"";
  var rem=!!(document.getElementById("te-rem")||{}).checked;
  if(!/^[0-9]{4,8}$/.test(pin)){TE.msg=xt("teShort");teDialog();return}
  if(setting){
    var p2=(document.getElementById("te-pin2")||{}).value||"";
    if(pin!==p2){TE.msg=xt("teMismatch");teDialog();return}
    var salt=teSalt();
    TE.busy=true;
    teHash(pin,salt,function(h){
      TE.busy=false;
      teWrite({h:h,s:salt,bad:0,badAt:0});
      teSetOpen(true,rem);
      TE.ask=false;TE.mode="";TE.msg="";
      teDialog(); render();
    });
    return;
  }
  if(teWait()){teDialog();return}
  var rec=teRead(); if(!rec){teClose();return}
  TE.busy=true;
  teHash(pin,rec.s,function(h){
    TE.busy=false;
    if(h===rec.h){
      rec.bad=0;rec.badAt=0;teWrite(rec);
      teSetOpen(true,rem);
      TE.ask=false;TE.mode="";TE.msg="";
      teDialog(); render();
    }else{
      rec.bad=(rec.bad||0)+1;rec.badAt=Date.now();teWrite(rec);
      TE.msg=xt("teBad"); teDialog();
    }
  });
}
/* הכפתור שפתח את החלון. בלעדיו, סגירה ב-Escape או ב"ביטול" מחזירה
   את המיקוד לתחילת הדף, ומי שמנווט במקלדת מאבד את מקומו. */
var _teOpener=null;
function teAsk(mode){ try{_teOpener=document.activeElement}catch(e){_teOpener=null}
  TE.ask=true; TE.mode=mode||""; TE.msg=""; teDialog() }
function teLock(){ teSetOpen(false); render() }
function teRemove(){ teWrite(null); teSetOpen(false); render() }
/* נעילה אוטומטית אחרי שהאפליקציה הייתה מוסתרת זמן־מה.
   מורה שבנה מבחן ומסר את הטאבלט בלי ללחוץ "יציאה" השאיר אותו
   פתוח, וזה בדיוק המצב שהתכונה אמורה למנוע. שתי דקות מספיקות
   כדי לא להפריע לעבודה רצופה, ולנעול כשהמכשיר עבר יד.
   נעילה שנשמרה כ"לזכור במכשיר הזה" היא בחירה מפורשת ולא נוגעים בה. */
var TE_HID=0;
try{
  document.addEventListener("visibilitychange",function(){
    if(document.hidden){ TE_HID=Date.now(); return }
    if(!TE_HID||!teHas())return;
    var away=Date.now()-TE_HID; TE_HID=0;
    if(away<120000)return;
    var kept=false;
    try{ kept=localStorage.getItem("islam-teacher"+"-open")==="1" }catch(e){}
    if(kept)return;
    try{ if(sessionStorage.getItem("islam-teacher"+"-open")!=="1")return }catch(e){ return }
    teSetOpen(false); render();
  });
}catch(e){}

/* ?teacher=1 פותח את החלון, והפרמטר מוסר מיד מהכתובת כדי שלא
   יישאר בקישור ששותף או בהיסטוריה. */
(function(){
  try{
    var u=new URL(location.href);
    if(u.searchParams.get("teacher")==="1"){
      u.searchParams.delete("teacher");
      history.replaceState(null,"",u.pathname+(u.searchParams.toString()?"?"+u.searchParams:"")+u.hash);
      /* שער התנאים יושב מעל הכול, וכך צריך להיות: אי־אפשר להשתמש
         באפליקציה לפני שהוסכם עליהם. חלון הקוד ממתין לו במקום
         להיפתח מתחתיו ולהיראות תקוע. */
      var tries=0;
      (function waitLegal(){
        if(tries++>=600){ teAsk(teHas()?"":"set"); return }
        /* LEGAL.accepted נוצר רק כש-protect.js מאותחל. עד אז אין
           עדיין מה לבדוק, ובדיקה של ".lg-wrap" לבדה מחזירה "אין
           שער" בדיוק ברגע שלפני שהוא נבנה. */
        var ready=false;
        try{ ready=!!(window.LEGAL&&window.LEGAL.accepted) }catch(e){}
        if(!ready){ setTimeout(waitLegal,200); return }
        var ok=true;
        try{ ok=!!window.LEGAL.accepted() }catch(e){ ok=true }
        if(!ok){ setTimeout(waitLegal,200); return }
        teAsk(teHas()?"":"set");
      })();
    }
  }catch(e){}
})();

function marksCsv(ex){
  var subs=(ex.subs||[]).slice().sort(function(a,b){return b.pct-a.pct});
  var n=ex.spec.q.length,i;
  var head=[xt("mkCsvName"),xt("mkCsvPct"),xt("mkCsvOk"),xt("mkCsvTotal"),
            xt("mkCsvDate"),xt("mkCsvValid")];
  for(i=0;i<n;i++)head.push(xf("mkCsvQ",i+1));
  var rows=[csvRow(head)];
  subs.forEach(function(s){
    var r=[s.name||xt("mkNoName"),s.pct,s.ok,s.n,s.date||"",
           s.valid?xt("mkCsvYes"):xt("mkCsvNo")];
    for(i=0;i<n;i++){
      var p=s.per&&s.per[i];
      r.push(p?(p.ok?xt("mkCsvYes"):xt("mkCsvNo")):"");
    }
    rows.push(csvRow(r));
  });
  return "\ufeff"+rows.join("\r\n")+"\r\n";
}
/* כרום מוחק את שם הקובץ כולו ברגע שיש בו תו אחד שאינו ASCII —
   לא רק עברית: גם é או מקף ארוך. מה שיורד נקרא "download", בלי
   סיומת, ואקסל לא יודע לפתוח אותו. מורה שקרא למבחן שלו בעברית
   קיבל קובץ בלי שם ובלי סוג. לכן השם מתועתק ללטינית. */
var TRLIT={
  "א":"a","ב":"b","ג":"g","ד":"d","ה":"h","ו":"v","ז":"z","ח":"ch","ט":"t","י":"y",
  "כ":"k","ך":"k","ל":"l","מ":"m","ם":"m","נ":"n","ן":"n","ס":"s","ע":"","פ":"f",
  "ף":"f","צ":"tz","ץ":"tz","ק":"k","ר":"r","ש":"sh","ת":"t",
  "ا":"a","ب":"b","ت":"t","ث":"th","ج":"j","ح":"h","خ":"kh","د":"d","ذ":"dh","ر":"r",
  "ز":"z","س":"s","ش":"sh","ص":"s","ض":"d","ط":"t","ظ":"z","ع":"","غ":"gh","ف":"f",
  "ق":"q","ك":"k","ل":"l","م":"m","ن":"n","ه":"h","و":"w","ي":"y","ة":"h","ى":"a","ء":"",
  "أ":"a","إ":"i","آ":"a","ؤ":"w","ئ":"y",
  "а":"a","б":"b","в":"v","г":"g","д":"d","е":"e","ё":"e","ж":"zh","з":"z","и":"i",
  "й":"y","к":"k","л":"l","м":"m","н":"n","о":"o","п":"p","р":"r","с":"s","т":"t",
  "у":"u","ф":"f","х":"kh","ц":"ts","ч":"ch","ш":"sh","щ":"sch","ъ":"","ы":"y","ь":"",
  "э":"e","ю":"yu","я":"ya"
};
function asciiName(s){
  var i,c,out="";
  /* é ו-ü הם אות לטינית ועוד סימן מצורף. פירוק והסרת הסימן משאיר e ו-u. */
  try{ s=s.normalize("NFD").replace(/[\u0300-\u036f]/g,"") }catch(e){}
  for(i=0;i<s.length;i++){
    c=s.charAt(i);
    if(/[A-Za-z0-9]/.test(c)){ out+=c; continue }
    var lower=c.toLowerCase();
    if(TRLIT[lower]!==undefined){ out+=TRLIT[lower]; continue }
    out+=" ";                     /* כל השאר — רווח, שיתכווץ בהמשך */
  }
  return out.replace(/\s+/g," ").trim();
}
function csvFileName(ex){
  var t=asciiName(String(ex.spec.t||"")).slice(0,60).trim();
  var d=String(ex.date||todayIso()).replace(/[^0-9-]/g,"");
  /* כשלא נשאר כלום קריא, מזהה המבחן הוא מה שמבדיל בין שני קבצים
     שירדו באותו יום. */
  if(!t) t="exam "+String(ex.id||"").slice(0,6);
  return (t+" "+d).trim()+".csv";
}
function downloadCsv(ex){
  var txt=marksCsv(ex),url=null,a=document.createElement("a");
  try{
    url=URL.createObjectURL(new Blob([txt],{type:"text/csv;charset=utf-8"}));
  }catch(e){
    url="data:text/csv;charset=utf-8,"+encodeURIComponent(txt);
  }
  a.href=url; a.download=csvFileName(ex);
  a.style.cssText="position:fixed;inset-inline-start:-9999px";
  document.body.appendChild(a); a.click();
  setTimeout(function(){
    if(a.parentNode)a.parentNode.removeChild(a);
    if(url&&url.indexOf("blob:")===0){try{URL.revokeObjectURL(url)}catch(e){}}
  },400);
}
function marksTable(ex){
  var out=(ex.spec.t||xt("exam"))+"\n";
  out+=xt("mkTblHead")+"\n";
  (ex.subs||[]).slice().sort(function(a,b){return b.pct-a.pct}).forEach(function(s){
    var wrong=uniq(s.per.filter(function(p){return !p.ok}).map(function(p){return p.topicName}));
    out+=(s.name||xt("mkNoName"))+"\t"+s.pct+"\t"+s.ok+"/"+s.n+"\t"+wrong.join(", ")+"\n";
  });
  return out;
}

/* ------------------------------------------------------------
   מסך התלמיד — מבחן מתוך קישור
   ------------------------------------------------------------ */
var SIT={spec:null,id:"",qs:[],i:0,name:"",answers:[],flags:[],
         t0:0,tick:null,phase:"intro",code:"",copied:false};

/* ------------------------------------------------------------
   מבחן שנפתח מחדש — ריענון, שיחה נכנסת, נעילת מסך
   ------------------------------------------------------------
   תלמיד שדפדפן שלו רענן באמצע מבחן איבד עד כה את הכול. התשובות
   נשמרות עכשיו במכשיר, לפי מזהה המבחן, יחד עם שעת ההתחלה — כדי
   שגם טיימר לא יתאפס ויעניק זמן נוסף. השמירה מקומית בלבד.
   ------------------------------------------------------------ */
function sitKey(){return EKEY+"-run-"+SIT.id}
function sitSave(){
  if(!SIT.id)return;
  try{localStorage.setItem(sitKey(),JSON.stringify({
    n:SIT.name,a:SIT.answers,f:SIT.flags,t:SIT.t0,i:SIT.i,p:SIT.phase}))}catch(e){}
}
function sitKeyOld(){return EKEY_OLD+"-run-"+SIT.id}
function sitDrop(){try{localStorage.removeItem(sitKey());localStorage.removeItem(sitKeyOld())}catch(e){}}
function sitRestore(){
  if(!SIT.id)return false;
  try{
    /* מבחן שהתחיל לפני פיצול המפתחות נשמר תחת המפתח הישן. */
    var o=JSON.parse(localStorage.getItem(sitKey())||localStorage.getItem(sitKeyOld())||"null");
    if(!o||!o.a||!o.a.length)return false;
    SIT.qs=examQuestions(SIT.spec);
    if(o.a.length!==SIT.qs.length)return false;   /* מבחן אחר תחת אותו מזהה */
    SIT.name=o.n||""; SIT.answers=o.a;
    SIT.flags=o.f&&o.f.length===o.a.length?o.f:SIT.qs.map(function(){return false});
    SIT.t0=o.t||0; SIT.i=Math.min(Math.max(0,o.i|0),SIT.qs.length-1);
    SIT.phase=o.p==="done"?"done":"ask";
    if(SIT.phase==="done")SIT.code=encodeResult(SIT.id,SIT.name,SIT.answers);
    return true;
  }catch(e){return false}
}
/* שניות שנותרו, או null כשלא הוגדרה הגבלת זמן */
function sitLeft(){
  var m=SIT.spec&&SIT.spec.m;
  if(!m||!SIT.t0)return null;
  return Math.max(0,Math.round((SIT.t0+m*60000-Date.now())/1000));
}
function sitClock(){
  var l=sitLeft(); if(l===null)return "";
  var mm=Math.floor(l/60),ss=l%60;
  return mm+":"+(ss<10?"0":"")+ss;
}
/* הזמן נגמר — מגישים. לא מבקשים אישור: אישור שאיש לא לוחץ עליו
   פירושו מבחן שנשאר פתוח לנצח. */
function sitTimerOn(){
  sitTimerOff();
  if(sitLeft()===null)return;
  SIT.tick=setInterval(function(){
    if(SIT.phase!=="ask"){sitTimerOff();return}
    if(sitLeft()<=0){sitTimerOff();sitFinish();return}
    var el=$("#sitclock"); if(el)el.textContent=sitClock();
  },1000);
}
function sitTimerOff(){if(SIT.tick){clearInterval(SIT.tick);SIT.tick=null}}

function sitStart(){
  var nm=$("#sitName"); SIT.name=nm?nm.value.trim():"";
  SIT.qs=examQuestions(SIT.spec);
  /* אם לא נותרה אף שאלה שאפשר לבנות (למשל מבחן של אפליקציה אחרת),
     מציגים את מסך המבחן השבור במקום ליפול על שאלה שאינה קיימת. */
  if(!SIT.qs.length){view="badexam"; render(); return}
  SIT.answers=SIT.qs.map(function(){return -1});
  SIT.flags=SIT.qs.map(function(){return false});
  SIT.i=0; SIT.phase="ask"; SIT.t0=Date.now();
  sitSave(); sitTimerOn();
  window.scrollTo(0,0); render();
}
function sitAnswer(i){
  if(SIT.phase!=="ask")return;
  SIT.answers[SIT.i]=i;
  sitSave();
  sitNext();
}
/* סימון לחזרה אינו תשובה ואינו משנה אותה — הוא רק מסמן. */
function sitFlag(){
  if(SIT.phase!=="ask")return;
  SIT.flags[SIT.i]=!SIT.flags[SIT.i];
  sitSave(); render();
}
function sitNext(){
  if(SIT.i+1<SIT.qs.length){SIT.i++;window.scrollTo(0,0);render();return}
  /* לא מגישים בלחיצה על תשובה. לחיצה בטעות על האפשרות האחרונה
     אינה אמורה לסיים מבחן. */
  SIT.phase="review"; stopSpeak(); window.scrollTo(0,0); render();
}
function sitGo(i){
  SIT.i=clamp(i,0,SIT.qs.length-1); SIT.phase="ask";
  window.scrollTo(0,0); render();
}
function sitFinish(){
  SIT.phase="done";
  sitTimerOff();
  SIT.code=encodeResult(SIT.id,SIT.name,SIT.answers);
  sitSave();
  stopSpeak(); window.scrollTo(0,0); render();

function sitGrade(){

    if(a>=0&&SIT.qs[i].options[a]&&SIT.qs[i].options[a].ok)ok++;

  return {ok:ok,n:SIT.qs.length,pct:Math.round(100*ok/SIT.qs.length)};
