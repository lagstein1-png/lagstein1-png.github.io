<script>
/* INTERNAL-GATE — שער פנימי. ראו .claude/qa/internal-gate.html.
   המפתח נשמר במגירה משל האפליקציה (shlav-internal-islam) ולא
   במגירה המשותפת shlav-internal, כדי שפתיחת אזרח לא תסגור את
   מתח ולהפך. */
var INTERNAL_KEY="shlav-internal-islam";
var INTERNAL_OK=(function(){
  try{
    var q=(location.search.match(/[?&]internal=([^&]*)/)||[])[1];
    if(q) localStorage.setItem("shlav-internal-islam", decodeURIComponent(q));
    return localStorage.getItem("shlav-internal-islam")===INTERNAL_KEY;
  }catch(e){ return false }   /* localStorage חסום — סגור, לא פתוח */
})();
</script>

/* ============================================================
   מורשת ודת האיסלאם — בגרות
   קהל היעד הוא תלמידי החינוך הערבי שנבחנים במורשת ודת האיסלאם. הוא נכשל בה שוב
   ושוב, מפני
   שהמקצוע כולו טקסט ומושגים — ולכן כל החלטה כאן נמדדת בשאלה
   אחת: האם היא מורידה עומס, או מוסיפה.
   · כל שאלה נושאת רמז שאינו התשובה, והסבר שנפתח גם כשצדקו.
   · שום טקסט לא מוצג בלי שאפשר לשמוע אותו.
   · שפת האם אינה קישוט: מושג נלמד קודם בשפה שחושבים בה.
   כל המידות ב-rem, כדי שהגדלת טקסט תגדיל את הכול יחד.
   ============================================================ */
:root{
  --font:"Heebo","Rubik",system-ui,"Segoe UI",Arial,sans-serif;
  --en:"Lexend","Heebo",system-ui,"Segoe UI",Arial,sans-serif;
  --ar:"Noto Sans Arabic",system-ui,"Segoe UI",Arial,sans-serif;
  --ru:"Noto Sans","Heebo",system-ui,"Segoe UI",Arial,sans-serif;   /* קירילית — Heebo אינו מכיל אותה */
  --bg:#f5f7fb; --surface:#ffffff; --surface2:#e8ecf6;
  --ink:#101828; --muted:#55607a; --faint:#6f7a95; --line:#dde3f0;
  --accent:#1d4ed8; --accent-ink:#ffffff; --accent-soft:#dbe4fe;
  --gold:#a16207; --gold-soft:#fbf0d5; --hit:#f5c451; --hit-ink:#1a1300;
  --ok:#15803d; --ok-soft:#dcfce7; --bad:#be123c; --bad-soft:#ffe4e9;
  --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px -12px rgba(16,24,40,.2);
  --r:14px;
  /* צבע לכל מסלול. לא קישוט: ארבעה סוגי לימוד שונים לגמרי, וצבע
     קבוע לכל אחד חוסך למי שמתקשה להתמצא את השאלה "איפה אני". */
  --c-sound:#0369a1; --cs-sound:#dbeefc;   /* צליל ואות   */
  --c-words:#15803d; --cs-words:#dcfce7;   /* מילים       */
  --c-talk:#b43a0a;  --cs-talk:#fde5d8;    /* מדוברת — #c2410c היה 4.28:1 על ה-cs (30.9) */
  --c-read:#6d28d9;  --cs-read:#eae2fd;    /* ספרותית     */
}
:root[data-theme="dark"]{
  --bg:#0e1425; --surface:#17203a; --surface2:#202c4d;
  --ink:#e8edf8; --muted:#9aa5c0; --faint:#78829e; --line:#2a3762;
  --accent:#93c5fd; --accent-ink:#0e1425; --accent-soft:#1b2a5c;
  --gold:#fbbf24; --gold-soft:#33270f; --hit:#ffd24d; --hit-ink:#241a00;
  --ok:#4ade80; --ok-soft:#132a1c; --bad:#fb7185; --bad-soft:#33161f;
  --warn:#fbbf24; --warn-soft:#33260f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  --c-sound:#7dd3fc; --cs-sound:#0b2a3d;
  --c-words:#86efac; --cs-words:#0f2a1a;
  --c-talk:#fdba74;  --cs-talk:#3a2113;
  --c-read:#c4b5fd;  --cs-read:#261a45;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1425; --surface:#17203a; --surface2:#202c4d;
    --ink:#e8edf8; --muted:#9aa5c0; --faint:#78829e; --line:#2a3762;
    --accent:#93c5fd; --accent-ink:#0e1425; --accent-soft:#1b2a5c;
    --gold:#fbbf24; --gold-soft:#33270f; --hit:#ffd24d; --hit-ink:#241a00;
    --ok:#4ade80; --ok-soft:#132a1c; --bad:#fb7185; --bad-soft:#33161f;
    --warn:#fbbf24; --warn-soft:#33260f;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
    --c-sound:#7dd3fc; --cs-sound:#0b2a3d;
    --c-words:#86efac; --cs-words:#0f2a1a;
    --c-talk:#fdba74;  --cs-talk:#3a2113;
    --c-read:#c4b5fd;  --cs-read:#261a45;
  }
}
/* ניגודיות גבוהה — שחור על לבן, מסגרות מלאות, בלי גוונים רכים */
:root.hc{
  --bg:#ffffff; --surface:#ffffff; --surface2:#ffffff;
  --ink:#000000; --muted:#1a1a1a; --faint:#333333; --line:#000000;
  --accent:#00434b; --accent-ink:#ffffff; --accent-soft:#e6f2f3;
  --gold:#5c3d00; --gold-soft:#f7efdf; --hit:#ffe600; --hit-ink:#000000;
  --ok:#0a5c2a; --ok-soft:#e6f4ea; --bad:#8c0f2c; --bad-soft:#fbe9ed;
  --warn:#6b3d00; --warn-soft:#f7efdf; --shadow:none;
  --c-sound:#00305c; --cs-sound:#e8eef7;
  --c-words:#0a5c2a; --cs-words:#e6f4ea;
  --c-talk:#7a2c00;  --cs-talk:#f9ece4;
  --c-read:#3d1a75;  --cs-read:#eee8f9;
}
:root.hc *{box-shadow:none!important}
:root.hc .card,:root.hc .btn,:root.hc .opt{border-width:2px!important}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs,17px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  font-size:1rem;line-height:1.65;-webkit-text-size-adjust:100%}
:root.clear body{font-family:"Verdana","Tahoma","Heebo",sans-serif;letter-spacing:.012em}
:root.spaced body{word-spacing:.22em;line-height:1.95}
:root.rm *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
h1,h2,h3{margin:0;line-height:1.3;font-weight:800}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}
/* כרטיס ״מבנה הבגרות״ (--gold-soft): הקישור לאתר משרד החינוך בלי צבע נפל לכחול ברירת המחדל — 1.55:1 בכהה (30.9) */
.gcard a{color:var(--accent)}
.skip{position:absolute;inset-inline-start:-9999px}
.skip:focus{position:static;display:inline-flex;align-items:center;min-height:44px;
  margin:8px;padding:8px 14px;background:#0b7c71;color:#fff;
  border-radius:8px;font-weight:700;text-decoration:none;z-index:100}

/* כל טקסט אנגלי — כיוון, גופן ומרווח משלו. unicode-bidi:isolate מונע
   מהמשפט האנגלי לגרור אחריו את סימני הפיסוק של המשפט העברי. */
.en{font-family:var(--en);direction:ltr;unicode-bidi:isolate;text-align:start}
.en-b{font-family:var(--en);direction:ltr;unicode-bidi:isolate;display:inline-block}

.wrap{max-width:56rem;margin:0 auto;padding:0 clamp(.9rem,3vw,1.5rem)}
.hbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-block:.6rem}
:root.hc .hbar{background:var(--bg);backdrop-filter:none}
.hrow{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
.brand{font-size:1.35rem;font-weight:800;letter-spacing:-.01em;display:flex;
  align-items:baseline;gap:.5rem;margin-inline-end:auto}
.brand small{font-size:.72rem;font-weight:600;color:var(--muted);letter-spacing:.06em}
.gbtn{display:inline-flex;align-items:center;gap:.4rem;background:var(--surface);
  border:1px solid var(--line);border-radius:999px;padding:.42rem .8rem;cursor:pointer;
  font-size:.86rem;font-weight:600;box-shadow:var(--shadow);min-height:44px}
.gbtn:hover{border-color:var(--accent)}
.gbtn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:1.1rem}
.grid{display:grid;gap:.85rem}
@media(min-width:640px){.g2{grid-template-columns:1fr 1fr}}
@media(min-width:900px){.g3{grid-template-columns:repeat(3,1fr)}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;
  border:1px solid var(--line);background:var(--surface);border-radius:12px;
  padding:.72rem 1.1rem;font-weight:700;cursor:pointer;box-shadow:var(--shadow);
  min-height:2.9rem;font-size:1rem}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;box-shadow:none}
.btn[disabled]{opacity:.45;cursor:default}
.btn.wide{width:100%}

.chip{display:inline-flex;align-items:center;gap:.35rem;border-radius:999px;
  padding:.22rem .6rem;font-size:.78rem;font-weight:700;background:var(--surface2);color:var(--muted)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}

/* גופני שפה: Heebo אינו מכיל ערבית וקירילית, ולכן שפת הממשק
   מחליפה גופן ולא רק כיוון. */
html[lang="ar"] body,html[lang="ar"] input,html[lang="ar"] button,
html[lang="ar"] textarea,html[lang="ar"] select{font-family:var(--ar)}
html[lang="ru"] body,html[lang="ru"] input,html[lang="ru"] button,
html[lang="ru"] textarea,html[lang="ru"] select{font-family:var(--ru)}
button[data-a="lang"][lang="ar"]{font-family:var(--ar)}
button[data-a="lang"][lang="ru"]{font-family:var(--ru)}

/* ===== מסלולים: הצבע נכנס ככרטיס, לא כרקע של טקסט ===== */
.trk{--c:var(--accent);--cs:var(--accent-soft)}
.t-sound{--c:var(--c-sound);--cs:var(--cs-sound)}
.t-words{--c:var(--c-words);--cs:var(--cs-words)}
.t-talk{--c:var(--c-talk); --cs:var(--cs-talk)}
.t-read{--c:var(--c-read); --cs:var(--cs-read)}
.tcard{border-inline-start:5px solid var(--c);cursor:pointer;text-align:start;width:100%;
  display:flex;flex-direction:column;gap:.4rem;align-items:stretch}
.tcard:hover{border-color:var(--c)}
.tcard h3{font-size:1.05rem}
.tcard .sub{font-size:.85rem;color:var(--muted)}
.tdot{width:.62rem;height:.62rem;border-radius:50%;background:var(--c);flex:none}
.thead{display:flex;align-items:center;gap:.5rem}
.tpill{background:var(--cs);color:var(--c);border-radius:999px;padding:.15rem .55rem;
  font-size:.72rem;font-weight:800}

/* ===== סרגל שליטה ברמות ===== */
.lvls{display:flex;gap:.4rem;flex-wrap:wrap}
.lvl{border:1px solid var(--line);background:var(--surface);border-radius:10px;
  padding:.4rem .7rem;font-size:.82rem;font-weight:700;cursor:pointer;
  display:inline-flex;align-items:center;gap:.4rem}
.lvl.on{background:var(--c,var(--accent));color:var(--accent-ink);border-color:var(--c,var(--accent))}
.bar{height:.42rem;border-radius:999px;background:var(--surface2);overflow:hidden;flex:1;min-width:3rem}
.bar i{display:block;height:100%;background:var(--c,var(--accent))}
.bar.b0 i{background:var(--bad)} .bar.b1 i{background:var(--warn)} .bar.b2 i{background:var(--ok)}

/* ===== תרגול ===== */
.qcard{border-top:5px solid var(--c,var(--accent))}
.qtop{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.7rem}
.qtext{font-size:1.12rem;font-weight:600;margin:.2rem 0 .3rem}
.qhint{color:var(--muted);font-size:.9rem}
/* המילה או המשפט שנלמדים. גדול, מרווח, ותמיד לצד כפתור השמעה. */
.subject{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;
  background:var(--surface2);border-radius:12px;padding:.85rem 1rem;margin:.5rem 0}
.subject .word{font-family:var(--en);direction:ltr;unicode-bidi:isolate;
  font-size:1.7rem;font-weight:700;letter-spacing:.01em;line-height:1.25}
.subject .ipa{font-family:var(--en);direction:ltr;unicode-bidi:isolate;
  color:var(--muted);font-size:.95rem}
.spk{border:1px solid var(--line);background:var(--surface);border-radius:999px;
  width:2.7rem;height:2.7rem;display:inline-flex;align-items:center;justify-content:center;
  cursor:pointer;flex:none;box-shadow:var(--shadow)}
.spk:hover{border-color:var(--accent);color:var(--accent)}
.spk.sm{width:2.1rem;height:2.1rem;background:#0b7c71;border-color:#0b7c71;color:#fff}
/* הרמקול הקטן — אותו ירוק של כפתור ההקראה הגדול, התקן המשותף */
.spk.sm:hover{background:#0b7c71;border-color:#0b7c71;color:#fff}
.spk.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.opts{display:grid;gap:.6rem;margin-top:.9rem}
.orow{display:flex;gap:.45rem;align-items:center;min-width:0}
/* min-width:0 — פריט grid נולד עם min-width:auto, ולכן משפט ארוך
   באפשרות היה מרחיב את השורה מעבר למכל ודוחף את הרמקול מחוץ למסך. */
.orow .opt{flex:1;min-width:0}
@media(min-width:560px){.opts.two{grid-template-columns:1fr 1fr}}
.opt{display:flex;align-items:center;gap:.6rem;text-align:start;width:100%;
  border:2px solid var(--line);background:var(--surface);border-radius:12px;
  padding:.8rem .9rem;cursor:pointer;font-size:1.02rem;font-weight:600;min-height:3.1rem}
.opt:hover{border-color:var(--accent)}
.opt .k{width:1.9rem;height:1.9rem;border-radius:8px;background:var(--surface2);
  display:inline-flex;align-items:center;justify-content:center;font-size:.85rem;
  font-weight:800;color:var(--muted);flex:none}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .k{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .k{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.55}
/* בחירה במבחן היא בחירה, לא תשובה נכונה. במסכי התרגול הצבע
   הירוק אומר "צדקת", ובמבחן אסור לו להופיע כלל — הוא נותן
   משוב שגוי לכל בחירה. ניטרלי, ורק מסמן מה סומן. */
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);margin-inline-start:3px}
.dot.ok{background:var(--ok);border-color:var(--ok)}
.dot.no{background:var(--bad);border-color:var(--bad)}
.dot.flag{box-shadow:0 0 0 2px var(--accent)}

/* אריחי בניית משפט. הסדר הוא התרגיל, ולכן האריח חייב להיראות כמשהו
   שאפשר להרים — מסגרת מלאה ורקע משלו, לא טקסט על רקע הכרטיס. */
.tiles{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:.7rem}
.tile{font-family:var(--en);direction:ltr;border:2px solid var(--line);
  background:var(--surface);border-radius:10px;padding:.5rem .8rem;font-weight:600;
  cursor:pointer;font-size:1.02rem;min-height:2.7rem}
.tile:hover{border-color:var(--accent)}
.slot{min-height:3.2rem;border:2px dashed var(--line);border-radius:12px;
  background:var(--surface2);padding:.5rem;display:flex;flex-wrap:wrap;gap:.45rem;
  align-items:center;direction:ltr}
.slot.ok{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.slot.bad{border-style:solid;border-color:var(--bad);background:var(--bad-soft)}
.slot .tile{background:var(--surface)}

/* ===== משוב ===== */
.fb{margin-top:.9rem;border-radius:12px;padding:.85rem 1rem;border:1px solid transparent}
.fb.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.fb.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.fb b{display:block;font-size:1.02rem;margin-bottom:.2rem}
.fb .body{color:var(--ink);font-weight:500;font-size:.95rem}
.why{margin-top:.55rem;padding-top:.55rem;border-top:1px dashed currentColor;color:var(--ink);
  font-weight:500;font-size:.93rem}

/* ===== קטע קריאה ===== */
/* איור בתוך כרטיס שאלה. הצבע יורש מ-color, ולכן אותו SVG נראה
   נכון גם בערכה הבהירה וגם בכהה בלי גרסה שנייה. */
.figure{margin:.7rem 0;padding:.6rem;border:1px solid var(--line);border-radius:12px;
  background:var(--surface2);color:var(--ink);overflow-x:auto}
.figure svg{display:block;max-width:100%}
/* המבחן המדומה: השאלות זו אחר זו, כמו חוברת בחינה. */
.simq{border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;margin:.8rem 0;
  background:var(--surface)}
.simq.miss{border-color:var(--warn)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.simn{font-weight:800;color:var(--muted);font-size:.86rem}
.simbar{position:sticky;top:0;z-index:5;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:.6rem .8rem;margin:.8rem 0;display:flex;gap:.6rem;
  align-items:center;flex-wrap:wrap;box-shadow:var(--shadow)}
.clock{font-weight:800;font-variant-numeric:tabular-nums;font-size:1.1rem}
.clock.low{color:var(--bad)}
.passage{background:var(--surface2);border-radius:12px;padding:1rem 1.1rem;margin:.6rem 0;
  font-family:var(--en);direction:ltr;unicode-bidi:isolate;font-size:1.08rem;line-height:2}
.passage .s{border-radius:5px;padding:.05em .12em;cursor:pointer}
.passage .s:hover{background:var(--accent-soft)}
.passage .s.now{background:var(--accent-soft);box-shadow:0 2px 0 var(--accent)}
.wd{border-radius:5px;padding:1px 3px}
.wd.hit{background:var(--hit);color:var(--hit-ink);font-weight:600}
/* כשמנוע הדיבור אינו מדווח על גבולות מילים — קורה הרבה בעברית
   באנדרואיד — אין מה להדגיש מילה־מילה, ואז מודגש כל האיבר. הכלל
   שקיים כאן מכוון למשפט בתוך קטע קריאה בלבד, ולכן ההדגשה החלופית
   על איבר אחר לא נראתה כלל. */
.wd.now,p.now,div.now,span.now,b.now{background:var(--hit);color:var(--hit-ink);
  border-radius:8px;box-shadow:0 0 0 4px var(--hit)}
.gloss{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.5rem}
.gword{border:1px solid var(--line);background:var(--surface);border-radius:999px;
  padding:.25rem .6rem;font-size:.85rem;cursor:pointer}
.gword b{font-family:var(--en);direction:ltr;unicode-bidi:isolate}

/* ===== סרגל מצב הקול ===== */
.vstrip{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;border-radius:10px;
  padding:.45rem .7rem;font-size:.85rem;font-weight:600;margin-bottom:.7rem}
.vstrip.ok{background:var(--ok-soft);color:var(--ok)}
.vstrip.warn{background:var(--warn-soft);color:var(--warn)}
.vstrip.bad{background:var(--bad-soft);color:var(--bad)}
.vstrip .btn{padding:.3rem .7rem;min-height:44px;font-size:.82rem}  /* 2.1rem היו 36 פיקסלים — מתחת ליעד המגע */

/* ===== הגדרות ===== */
.row{display:flex;align-items:center;justify-content:space-between;gap:.8rem;
  padding:.7rem 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row:last-child{border-bottom:0}
.row .lab{font-weight:700}
.row .desc{font-size:.85rem;color:var(--muted);font-weight:500}
.sw{width:3.2rem;height:1.8rem;border-radius:999px;background:var(--surface2);
  border:1px solid var(--line);position:relative;cursor:pointer;flex:none}
.sw i{position:absolute;top:.18rem;inset-inline-start:.2rem;width:1.3rem;height:1.3rem;
  border-radius:50%;background:var(--faint);transition:.15s}
.sw.on{background:var(--accent);border-color:var(--accent)}
.sw.on i{inset-inline-start:1.5rem;background:#fff}
.vgrid{display:grid;gap:.5rem;grid-template-columns:1fr}
@media(min-width:560px){.vgrid{grid-template-columns:1fr 1fr}}
.vopt{display:flex;align-items:center;gap:.6rem;border:2px solid var(--line);
  background:var(--surface);border-radius:12px;padding:.6rem .75rem;cursor:pointer;text-align:start}
.vopt.on{border-color:var(--accent);background:var(--accent-soft)}
.vopt .nm{font-weight:700}
.vopt .ds{font-size:.8rem;color:var(--muted)}
input[type=password],input[type=text]{font:inherit;background:var(--surface);color:var(--ink);
  border:1px solid var(--line);border-radius:10px;padding:.6rem .7rem;min-width:0;flex:1;
  direction:ltr;text-align:left}
input[type=range]{width:100%;accent-color:var(--accent)}

.fbar{border-top:1px solid var(--line);margin-top:2rem;padding-block:1rem;
  color:var(--muted);font-size:.82rem}   /* --faint יצא 2.96:1 */
.hidden{display:none!important}

/* ---------- שדה קלט של המבחן ----------
   מודול המבחן הועתק לכאן מאפליקציה שבה .field כבר היה מוגדר.
   בלי הכלל הזה שדה השם של הנבחן נשאר תיבת ברירת המחדל של
   הדפדפן — 21 פיקסלים גובה, הרבה מתחת ליעד המגע של 44. */
.field{width:100%;box-sizing:border-box;font:inherit;font-size:1rem;
  min-height:48px;padding:12px 14px;border-radius:11px;outline:none;background:var(--surface2);color:inherit;border:1px solid var(--line)}
.field:focus{border-color:var(--accent)}
/* `outline:none` של `.field` הוא (0,1,0) ויושב אחרי הכלל הכללי
   `:focus-visible` שבראש הקובץ — אותה ספציפיות, ולכן המאוחר מנצח
   והשדה נשאר בלי סימן מיקוד במקלדת. אותו כלל קיים ב-literature וב-biology. */
.field:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
textarea.field{min-height:96px;resize:vertical}

/* ---------- שורות המבחן ----------
   .tog הגיע ממודול המבחן שהועתק לכאן, ולא היה לו עיצוב כלל: השם
   והמידע שמתחתיו נדבקו לשורה אחת בלי רווח. */
.tog{display:flex;align-items:center;gap:13px;width:100%;text-align:start;
  background:var(--surface2);border:1px solid transparent;border-radius:12px;
  padding:13px 15px;min-width:0}
.tog:hover{border-color:var(--line)}
.tog+.tog{margin-top:9px}
.tog .tt{flex:1;min-width:0}
.tog .tt b{display:block;font-size:.97rem;overflow-wrap:anywhere}
.tog .tt span{display:block;color:var(--muted);font-size:.85rem;overflow-wrap:anywhere;margin-top:2px}

/* יעד מגע לקישור התחתית. קישור טקסט בשורה יוצא בגובה הטקסט —
   15 פיקסלים — וזה קטן מדי לאצבע, גם כשהוא רק לתנאי השימוש. */
.lg-foot a{display:inline-flex;align-items:center;min-height:44px;padding-inline:6px}

/* ---------- יעדי מגע ----------
   .lvl יצא 39 פיקסלים ומתג ה-.sw רק 31, שניהם מתחת ל-44 שהפרויקט
   מחייב את עצמו בהם. במתג לא מגדילים את המסילה — היא תיראה מגושמת —
   אלא מרחיבים את שטח הלחיצה סביבה. */
.lvl{min-height:44px}
.sw{position:relative}
.sw::after{content:"";position:absolute;inset-block:-7px;inset-inline:-4px}

/* ---------- מסך בניית המבחן ----------
   .seg ו-.tpc הגיעו עם מודול המבחן שהועתק לכאן, ולא היה להם עיצוב:
   כפתורי הבחירה יצאו 34 פיקסלים, וכרטיסי הנושאים 6 פיקסלים בלבד —
   כלומר המורה לא יכול היה לבחור נושאים בכלל. */
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 auto;min-width:0;min-height:44px;border:1px solid var(--line);
  background:var(--surface);border-radius:10px;padding:10px 12px;font:inherit;
  font-weight:600;font-size:.9rem;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.tpc{position:relative;display:flex;flex-direction:column;gap:9px;text-align:start;
  background:var(--surface);border:1px solid var(--line);
  border-inline-start:4px solid var(--c,var(--accent));border-radius:12px;padding:14px;
  box-shadow:var(--shadow);min-width:0;min-height:44px;cursor:pointer;font:inherit;color:inherit}
.tpc.on{border-color:var(--accent);background:var(--accent-soft)}
.tpc .tn{font-weight:700;font-size:.98rem;overflow-wrap:anywhere;color:var(--c,var(--ink))}
.tpc .td{color:var(--muted);font-size:.8rem;overflow-wrap:anywhere}

/* טקסט על רקע ההדגשה: --accent-ink ולא לבן קבוע. במצב כהה
   ההדגשה בהירה, ולבן עליה יצא 1.5–2.0:1 — כמעט בלתי קריא. */
/* ---------- מצב מורה ---------- */
.te-wrap{position:fixed;inset:0;z-index:2147482500;background:rgba(8,12,20,.72);
  display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto;
  font-family:system-ui,"Heebo","Rubik",Arial,sans-serif}
.te-box{background:#fff;color:#111827;max-width:26rem;width:100%;border-radius:18px;
  box-shadow:0 24px 70px -20px rgba(0,0,0,.6);padding:clamp(18px,4vw,26px);
  max-height:92vh;overflow-y:auto;font-size:16px;line-height:1.6}
.te-box h2{margin:0 0 6px;font-size:1.35rem;font-weight:800;line-height:1.25}
.te-lead{margin:0 0 10px;color:#374151}
.te-warn{margin:0 0 12px;font-size:.88rem;color:#7c2d12;background:#fef3c7;
  border-radius:10px;padding:9px 11px}
.te-lab{display:block;margin:10px 0 4px;font-weight:700;font-size:.92rem}
.te-in{width:100%;box-sizing:border-box;font:inherit;letter-spacing:.3em;
  border:1px solid #d1d5db;border-radius:11px;padding:.7rem .8rem;min-height:48px;
  background:#fff;color:#111827}
.te-in:focus-visible{outline:3px solid #2563eb;outline-offset:1px}
.te-chk{display:flex;align-items:center;gap:.5rem;margin-top:14px;min-height:44px;
  font-size:.94rem;cursor:pointer}
.te-chk input{width:20px;height:20px}
.te-note{margin:2px 0 0;font-size:.82rem;color:#6b7280}
.te-msg{margin:10px 0 0;font-size:.92rem;font-weight:700;color:#7f1d1d;
  background:#fee2e2;border-radius:10px;padding:9px 11px}
.te-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.te-btn{font:inherit;font-weight:700;border-radius:12px;padding:.75rem 1.2rem;
  cursor:pointer;border:1px solid #d1d5db;background:#fff;color:#111827;min-height:48px}
.te-btn.pri{background:#111827;color:#fff;border-color:#111827;flex:1 1 9rem}
.te-btn.pri[disabled]{opacity:.5;cursor:default}
.te-btn.link{border:0;background:none;text-decoration:underline;padding:.6rem .2rem;
  color:#374151;margin-top:8px;min-height:44px}
.te-btn:focus-visible{outline:3px solid #2563eb;outline-offset:2px}
@media (prefers-color-scheme:dark){
  .te-box{background:#141a24;color:#e8ecf4}
  .te-lead,.te-note{color:#b9c2d4}
  .te-warn{background:#3a2a10;color:#fcd9a5}
  .te-in{background:#1d2531;color:#e8ecf4;border-color:#2c3648}
  .te-msg{background:#4a1717;color:#ffd7d7}
  .te-btn{background:#1d2531;color:#e8ecf4;border-color:#2c3648}
  .te-btn.pri{background:#e8ecf4;color:#141a24;border-color:#e8ecf4}
  .te-btn.link{color:#b9c2d4}
}

/* ---------- רשימת השאלות במסך בניית המבחן ---------- */
.xq-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.xq{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface2)}
.xq-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.xq-n{flex:0 0 auto;min-width:27px;height:27px;border-radius:8px;display:inline-flex;
  align-items:center;justify-content:center;font-weight:800;font-size:.85rem;background:var(--line)}
.xq-tp{font-weight:700;font-size:.88rem;color:var(--muted);overflow-wrap:anywhere}
.xq-acts{margin-inline-start:auto;display:flex;gap:6px;flex-wrap:wrap}
/* 44 פיקסלים גם כאן. כפתור קטן בתוך רשימה ארוכה הוא בדיוק
   הכפתור שנהג מבוגר או ילד עם ADHD לא מצליח לפגוע בו. */
.xq-b{padding:8px 13px;font-size:.88rem;font-weight:700;border-radius:10px;min-height:44px;
  border:1px solid var(--line);background:transparent;color:inherit;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:inherit}
.xq-b:hover{background:var(--line)}
.xq-b[aria-pressed="true"]{background:var(--line)}
.xq-q{margin-top:8px;line-height:1.5;overflow-wrap:anywhere}
.xq-e{margin-top:5px;font-weight:700;overflow-wrap:anywhere}
.xq-a{margin-top:7px;font-size:.92rem;color:var(--ok);overflow-wrap:anywhere}
.xq-add{margin-top:12px;gap:8px}
.xq-add .sub{margin:0}
/* שאלת מקור נושאת קטע שלם. בלי תקרה הוא דוחף את שאר הרשימה
   אל מחוץ למסך. */
.xq .passage{max-height:11rem;overflow:auto}
.hlang{display:flex;gap:4px;flex:none;align-items:center;flex-wrap:wrap}
.hlang button{border:1px solid #d4dbe7;background:transparent;color:inherit;border-radius:10px;padding:3px 9px;font:inherit;font-size:.82rem;cursor:pointer;min-height:36px}
.hlang button.on{border-color:#2f5fd8;color:#fff;background:#2f5fd8;font-weight:700}

/* ---------- יעדי מגע ≥44px — 1.10.2026 ----------
   נמדד בדפדפן ב-390px וב-360px, בדף הפתיחה ובשני צעדי לחיצה ממנו.
   הבלוק אחרון ב-style כדי לגבור על ההגדרות שמעליו. מגדילים בריפוד
   ובגובה מינימלי, לא בגובה קשיח — ערבית ורוסית ארוכות יותר. */
.hlang button{min-height:44px;padding-block:6px}
input[type=range]{min-height:44px}
.spk.sm{min-width:44px;min-height:44px}
.lvl{min-width:44px}

/* ---------- קישור בתוך טקסט — אזור נגיעה ≥44px · 2.10.2026 (O-110) ----------
   שני מקרים, ונמדדו שניהם ב-390px וב-360px:
   - קישור בתוך שורת טקסט רצה: ריפוד אנכי בלבד. ב-inline הוא מגדיל את
     אזור הנגיעה ואינו נכנס לגובה השורה — אף אלמנט לא זז.
   - קישורים זה מתחת לזה (<br>), וקישור בתוך פס ההקראה הקבוע: שם הריפוד
     חרג מהשורה וכיסה את הקישור או הכפתור שלידו, ולכן inline-flex
     בגובה 44 — כמו `.lg-foot a`. השורה גדלה, ואין חפיפה.
   לא `a` כללי: `.lg-foot a` ודומיו כבר 44px בבנייה אחרת. */
#tts-fail a,a[href*="education.gov.il"]{display:inline-flex;align-items:center;min-height:44px}
</style>

<style>#gate[hidden]{display:none!important}
/* כפתורי הקראה גדולים וצבעוניים — התקן המשותף (ירוק הקראה, אדום עצירה) */
.spk:not(.sm){border-radius:12px;background:#0b7c71;border-color:#0b7c71;color:#fff;font-weight:700;min-height:46px;width:auto;height:auto;padding:8px 18px;font-size:1.02rem;gap:.4rem}
.spk:not(.sm):hover{background:#0b7c71;color:#fff}
.spkStop{background:#bf4426!important;border-color:#a03a20!important;color:#fff!important}
.spkStop:hover{background:#a03a20!important;color:#fff!important}
/* כפתורי העזר הצבעוניים — התקן המשותף המלא (26.9.2026, דיווח הבעלים:
   ״הכפתורים רמז הקראה וכו קטנים יש להסיף צבע״). ירוק הקראה, אדום עצירה,
   כתום רמז, סגול לימור, כחול פתרון מודרך, אפור־כחלחל נוסחה — אותם
   צבעים בדיוק בכל האפליקציות, והסריקה הרוחבית בודקת את זה. */
.btn[data-a="read"],.btn[data-a="readsteps"]{background:#0b7c71!important;border-color:#0b7c71!important;color:#fff!important;font-weight:700;min-height:46px;padding:10px 16px!important;font-size:1rem!important}
.btn[data-a="read"]:hover,.btn[data-a="readsteps"]:hover{background:#0b7c71!important;color:#fff!important}
.btn[data-a="hush"],.btn[data-a="stop"]{background:#bf4426!important;border-color:#a03a20!important;color:#fff!important;font-weight:700;min-height:46px;padding:10px 16px!important;font-size:1rem!important}
.btn[data-a="hush"]:hover,.btn[data-a="stop"]:hover{background:#a03a20!important;color:#fff!important}
.btn[data-a="hint"]{background:#b45309!important;border-color:#92400e!important;color:#fff!important;font-weight:700;min-height:46px;padding:10px 16px!important;font-size:1rem!important}
.btn[data-a="hint"]:hover{background:#92400e!important;color:#fff!important}
.btn[data-a="tutor"],.btn[data-a="tutor"].ghost{background:#6d28d9!important;border-color:#5b21b6!important;color:#fff!important;font-weight:700;min-height:46px;padding:10px 16px!important;font-size:1rem!important}
.btn[data-a="tutor"]:hover,.btn[data-a="tutor"].ghost:hover{background:#5b21b6!important;color:#fff!important}
.btn[data-a="guide"]{background:#1d4ed8!important;border-color:#1e40af!important;color:#fff!important;font-weight:700;min-height:46px;padding:10px 16px!important;font-size:1rem!important}
.btn[data-a="guide"]:hover{background:#1e40af!important;color:#fff!important}
.btn[data-a="rule"]{background:#334155!important;border-color:#1e293b!important;color:#fff!important;font-weight:700;min-height:46px;padding:10px 16px!important;font-size:1rem!important}
.btn[data-a="rule"]:hover{background:#1e293b!important;color:#fff!important}
/* רמקול לכל תשובה — מי שקורא בקושי בוחר באוזן (אותו תקן של history) */
.opts .orow{display:flex;gap:6px;align-items:stretch}
.opts .orow .opt{flex:1 1 auto}
.optspk{flex:0 0 auto;min-width:46px;min-height:46px;border:2px solid #0b7c71;border-radius:12px;background:#0b7c71;color:#fff;font:inherit;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:8px 10px}
.optspk:hover{background:#0b7c71}

<script>
/* ============================================================
   מצב הדגמה — נכנס אך ורק דרך ?demo=1 בכתובת.
   ------------------------------------------------------------
   התסריט הוא נתון, לא קוד שפזור במסכים: כל פריט אומר מה נכתב
   בכתוביות (subtitle), מה נעשה על המסך (action) וכמה זמן הצופה

/* עוזרים לתסריט. כולם מחזירים false כשהאיבר אינו על המסך, כדי
   שצעד שלא מצא את מה שחיפש ידלג ולא יפיל את ההדגמה כולה. */
function demoEl(s){return typeof s==="string"?document.querySelector(s):s}
function demoShow(s){
  var e=demoEl(s); if(!e)return false;
  try{e.scrollIntoView({behavior:"smooth",block:"center"})}catch(err){try{e.scrollIntoView()}catch(err2){}}

/* מדגיש את האיבר, ורק אז לוחץ — צופה שלא ראה לאן נלחץ לא הבין
   מה קרה. לכן אין צעד קצר מ-1200 אלפיות בתסריטים. */
function demoTap(s){
  var e=demoEl(s); if(!e||e.disabled)return false;
  demoShow(e);
  e.classList.add("demo-tap");
  DEMO.extra.push(setTimeout(function(){
    e.classList.remove("demo-tap");
    /* המסך מצטייר מחדש כל הזמן. אם האיבר שסומן כבר אינו במסמך,
       מחפשים אותו שוב לפי אותו בורר — לחיצה על איבר מת אינה
       עושה דבר, וזה בדיוק צעד שנראה כאילו נתקע. */
    var live=(typeof s==="string"&&!document.contains(e))?demoEl(s):e;
    if(DEMO.on&&live&&!live.disabled&&document.contains(live))try{live.click()}catch(err){}
  },430));
  return true;
}
function demoClick(s){

  try{e.click()}catch(err){return false}

/* הקלדה אות אחר אות, עם אירוע input אמיתי — שדה חיפוש שמאזין
   ל-input לא היה מגיב להשמה ישירה ל-value. */
function demoType(s,text){
  var e=demoEl(s); if(!e)return false;
  demoShow(e); try{e.focus()}catch(err){}
  e.value=""; var i=0;
  var t=setInterval(function(){
    if(!DEMO.on||!e.parentNode){clearInterval(t);return}
    e.value=String(text).slice(0,++i);

  DEMO.extra.push(t);

   לא יבלע את המקש לפני שההדגמה ראתה אותו. */
function demoKey(e){
  if(!DEMO.on)return;
  if(e.key==="Escape"||e.keyCode===27){
    e.preventDefault(); e.stopPropagation();
    demoStop();
  }

function demoStart(){
  if(DEMO.on)return;
  DEMO.on=true; DEMO.i=0;
  DEMO.btn.hidden=true; DEMO.bar.hidden=false;
  document.documentElement.classList.add("demo-running");
  demoNext();
}

function demoNext(){
  if(!DEMO.on)return;
  if(DEMO.i>=DEMO_SCRIPT.length){demoStop();return}
  var it=DEMO_SCRIPT[DEMO.i++]||{};
  var d=Math.max(600,it.duration||3000);
  DEMO.txt.textContent=it.subtitle||"";
  DEMO.step.textContent=DEMO.i+" / "+DEMO_SCRIPT.length;
  DEMO.fill.style.transition="none"; DEMO.fill.style.width="0";
  void DEMO.fill.offsetWidth;
  DEMO.fill.style.transition="width "+d+"ms linear";
  DEMO.fill.style.width="100%";
  if(typeof it.action==="function"){
    try{it.action()}catch(err){if(window.console)console.warn("demo:",err)}
  }
  DEMO.timer=setTimeout(demoNext,d);
}

function demoStop(){
  DEMO.on=false;
  if(DEMO.timer){clearTimeout(DEMO.timer);DEMO.timer=null}
  DEMO.extra.forEach(function(t){clearTimeout(t);clearInterval(t)});
  DEMO.extra=[];

  if(DEMO.bar)DEMO.bar.hidden=true;

}

   המכשיר, לא כבחירה, והאפליקציה נפתחה באנגלית למי שבא ללמוד

function guessLang(){
  var ls=(navigator.languages||[navigator.language||"he"]).map(function(x){
    return String(x).toLowerCase().split("-")[0]});

    if(c==="en")continue;
    if(LANGS[c])return c;
  }
  return "he";
}

    state.streak=(state.lastDay===yi)?(state.streak||0)+1:1;
    state.lastDay=d; state.day={d:d,n:0};
  }
}

function mastery(tid,lv){

   לפני כן מקבל את ברירת המחדל של הדפדפן — לרוב קול אנגלי, גם כשמותקן
   קול עברי טוב. onvoiceschanged לבדו אינו פתרון: הוא מרענן תפריט,

var _voicesP=null;
function voicesReady(){
  if(_voicesP)return _voicesP;
  _voicesP=new Promise(function(done){
    if(!("speechSynthesis" in window)){done();return}
    if(allVoices().length){done();return}
    var poll=null,cap=null,fired=false;
    function finish(){
      if(fired)return; fired=true;
      clearInterval(poll); clearTimeout(cap);
      try{speechSynthesis.removeEventListener("voiceschanged",finish)}catch(e){}
      done();
    }
    try{speechSynthesis.addEventListener("voiceschanged",finish)}catch(e){}
    /* Safari לא תמיד יורה את האירוע — לכן גם דגימה */
    poll=setInterval(function(){if(allVoices().length)finish()},120);
    /* תקרה: יש מכשירים שמחזירים רשימה ריקה לצמיתות ומדברים מצוין.
       עדיף לדבר בקול ברירת מחדל מאשר לשתוק לנצח. */
    cap=setTimeout(finish,4000);
  });
  return _voicesP;

var _kaTimer=null;
function startKeepAlive(){
  if(!NEEDS_KEEPALIVE||!("speechSynthesis" in window)||_kaTimer)return;
  _kaTimer=setInterval(function(){
    try{
      if(!speechSynthesis.speaking){stopKeepAlive();return}
      if(speechSynthesis.paused)return;   /* עצירה מכוונת — לא נוגעים */
      speechSynthesis.pause();speechSynthesis.resume();
    }catch(e){stopKeepAlive()}
  },9000);
}
function stopKeepAlive(){if(_kaTimer){clearInterval(_kaTimer);_kaTimer=null}}
/* עוצרים רק כששום דבר כבר לא מדבר — אחרת מקטע שהתחיל זה עתה מאבד
   את השמירה שלו כשהמקטע הקודם מסיים להתנקות. */
function maybeStopKeepAlive(){
  try{if(speechSynthesis.speaking||speechSynthesis.pending)return}catch(e){}
  stopKeepAlive();
}

/* 2 · הפניה חיה ל-utterance. Chrome אוסף אובייקט שאין אליו הפניה,
   ואיתו נעלמים onend ו-onboundary: ההקראה נתקעת באמצע, ההדגשה
   קופאת על מילה אחת, והמקטע הבא לא יוצא לעולם. */
var _activeU=null;

/* 3 · קול רשת שנכשל. הקולות הנוירליים של Edge הם קולות רשת, והם
   שותקים בלי אינטרנט. הדגל נכבה ברגע שאחד מהם נכשל, ומאותו רגע
   הדירוג מעדיף קול מקומי לשארית הסשן. */
var _netVoiceOK=true;

/* קול רשת שאי אפשר להשתמש בו עכשיו — אין אינטרנט, או שאחד כבר
   נכשל בסשן הזה — אינו "פחות טוב", הוא פשוט לא יעבוד. לכן זה מיון
   ראשון ולא עוד סעיף בתוך הניקוד: קנס בניקוד לא הספיק, מפני שקול
   נוירלי של Microsoft צובר על שם היצרן ועל "Natural" יותר ממה שכל
   קנס סביר מוריד — והוא נבחר שוב ושוב אחרי שכבר נכשל.
   כשהוא הקול היחיד שיש הוא עדיין נבחר: מיון של רשימה בת אחד
   מחזיר אותה כמו שהיא. */
function voiceUsable(v){
  if(!v||v.localService!==false)return 1;
  return (_netVoiceOK&&navigator.onLine!==false)?1:0;
}

/* 4 · שומר זמן. יש מכשירים שבהם onend פשוט לא נורה. בלי השומר הזה
   התור נתקע: הכפתור נשאר על "עצירה" וההקראה לא ממשיכה לעולם. ארבע
   שניות שבהן המנוע לא מדבר ולא ממתין נחשבות סוף.
   מחזיר פונקציית ביטול — מי שסיים בדרך הרגילה מכבה את השומר. */
function ttsWatchdog(alive,onSilent){
  var idle=0,dog=setInterval(function(){
    if(!alive()){clearInterval(dog);return}
    var busy=false;
    try{busy=!!(speechSynthesis.speaking||speechSynthesis.pending)}catch(e){}
    if(busy){idle=0;return}
    if(++idle>=4){clearInterval(dog);onSilent()}
  },1000);
  return function(){clearInterval(dog)};
}


/* ------------------------------------------------------------
   פיצול לאמירות קצרות — הועתק מ"תאוריה מדברת", שם ההקראה נשמעת
   הכי טוב. מנועי מכשיר מאיצים ובולעים סופי מילים במשפט ארוך;
   כאן נשלחה שאלה שלמה באמירה אחת, לפעמים 300 תווים.
   כל מקטע נושא את ההיסט שלו במחרוזת המלאה, כי charIndex מתאפס
   בכל אמירה ובלעדיו ההדגשה קופצת לתחילת המשפט בכל מקטע.
   ------------------------------------------------------------ */
var SEG_MAX=90, SEG_GAP=260;
/* סימן פיסוק בין שתי ספרות הוא חלק מהמספר ולא מקום לחתוך בו:
   בלי הבדיקה הזאת "3,500" נשבר והמנוע קורא "שלוש, חמש מאות". */
function insideNumber(str,i){
  return i>0&&i+1<str.length&&/[0-9]/.test(str[i-1])&&/[0-9]/.test(str[i+1]);
}
function segments(spoken){
  var out=[],parts=[],from=0,i,j;
  function push(t,start){ if(String(t).trim())out.push({text:t,start:start}) }
  for(i=0;i<spoken.length;i++){
    if(".!?:;".indexOf(spoken[i])<0)continue;
    if(insideNumber(spoken,i))continue;
    j=i+1; while(j<spoken.length&&/\s/.test(spoken[j]))j++;
    parts.push({text:spoken.slice(from,j),start:from});
    from=j; i=j-1;
  }
  if(from<spoken.length)parts.push({text:spoken.slice(from),start:from});
  for(var k=0;k<parts.length;k++){
    var p=parts[k];
    if(p.text.length<=SEG_MAX){ push(p.text,p.start); continue }
    var rest=p.text,base=p.start;
    while(rest.length>SEG_MAX){
      var cut=rest.lastIndexOf(",",SEG_MAX);
      while(cut>0&&insideNumber(rest,cut))cut=rest.lastIndexOf(",",cut-1);
      if(cut<SEG_MAX*0.4)cut=rest.lastIndexOf(" ",SEG_MAX);
      if(cut<=0)break;
      push(rest.slice(0,cut+1),base);
      base+=cut+1; rest=rest.slice(cut+1);
    }
    push(rest,base);
  }
  /* מקטע זעיר — "12." או ")" — עם הפסקה של רבע שנייה אחריו נשמע
     כמו גמגום. מאחדים אותו לזה שאחריו. */
  var merged=[];
  for(i=0;i<out.length;i++){
    if(merged.length&&out[i].text.trim().length<12&&
       merged[merged.length-1].text.length+out[i].text.length<=SEG_MAX*1.4){
      merged[merged.length-1].text+=out[i].text; continue;
    }
    if(out[i].text.trim().length<12&&i+1<out.length){
      out[i+1]={text:out[i].text+out[i+1].text,start:out[i].start}; continue;
    }
    merged.push(out[i]);
  }
  out=merged;
  return out.length?out:[{text:spoken,start:0}];
}
/* קצב לפי שפה — אותם ערכים שנבחרו בתאוריה מדברת אחרי האזנה */
var VOICE_TUNE={he:0.82,ar:0.85,en:0.90,ru:0.88};
function tuneRate(lang,rate){
  var t=VOICE_TUNE[String(lang||"he").split("-")[0].toLowerCase()]||0.88;
  var r=t*(rate||1);
  return Math.max(0.5,Math.min(1.6,Math.round(r*100)/100));
}

   כשאין במכשיר קול נשי בשפה הנוכחית — ווינדוס עם Asaf בלבד הוא
   המקרה הנפוץ בעברית — מרימים את גובה הקול. זה לא קול נשי אמיתי,
   וגם לא מתיימר להיות: זו הדרך היחידה בדפדפן להזיז קול גברי לכיוון
   הנשי בלי הקלטות ובלי שירות חיצוני. מי שמתקין קול נשי מקבל אותו
   מיד ובלי שינוי הגובה.
   ------------------------------------------------------------ */

function vchkT(){ var g=state.lang||"he"; return VCHKMSG[g]||VCHKMSG.he }
function voiceCheck(){
  var M=vchkT();
  VCHK=M.sent; render();
  function show(m){ VCHK=m; render() }
  if(!("speechSynthesis" in window)){ show(M.noSup); return }
  var list=[]; try{ list=speechSynthesis.getVoices()||[] }catch(e){}
  try{ speechSynthesis.cancel() }catch(e){}
  var u;
  try{ u=new SpeechSynthesisUtterance(M.say) }
  catch(e){ show(M.mkFail+e.message); return }
  u.lang=(LANGS[state.lang||"he"]||LANGS.he).tts; u.volume=1; u.rate=1; u.pitch=1;
  var done=false;
  u.onstart=function(){ done=true; show(M.okN[0]+list.length+M.okN[1]) };
  u.onerror=function(e){ done=true;
    var er=(e&&e.error)||M.unk;
    if(er==="interrupted"||er==="canceled"){ show(M.ok); return }
    show(M.engine[0]+er+" · "+list.length+M.engine[1]); };
  try{ speechSynthesis.speak(u) }
  catch(e){ show(M.spFail+e.message); return }

/* ------------------------------------------------------------
   דור ההקראה. speechSynthesis.cancel() אינו מבטל setTimeout:
   כרום יורה onend על האמירה שבוטלה, המקטע הבא נרשם בכל זאת,
   וכעבור SEG_GAP ההקראה הישנה חוזרת מעל החדשה — שני קולות
   במקביל. מונה אחד פותר את זה: כל הקראה מקבלת מספר, stopSpeak
   מקדם אותו, ומקטע מדור ישן פשוט אינו מדבר.
   ------------------------------------------------------------ */
var _sayGen=0;
function speakDevice(text,code,rate){
  if(!("speechSynthesis" in window))return false;
  try{speechSynthesis.cancel()}catch(e){}
  var my=++_sayGen;
  /* האמירה יוצאת מיד, בתוך הלחיצה. קודם היא נעטפה ב-voicesReady,
     שממתין לרשימת הקולות ועד ארבע שניות אם היא לא מגיעה — ואמירה
     שיוצאת ארבע שניות אחרי המגע נזרקת בשקט באנדרואיד ובספארי.
     כשהרשימה כבר כאן, בוחרים קול ומדברים. כשהיא ריקה — מדברים
     בכל זאת, עם u.lang בלבד: קול ברירת מחדל בשפה הנכונה עדיף על
     שתיקה, ויש מכשירים שמחזירים רשימה ריקה לצמיתות ומדברים היטב.
     voicesReady נשאר בשימוש למסך בחירת הקול, שם ההמתנה במקומה. */
  (function(){
    try{
      var v=bestVoice(code), lang=(v&&v.lang)||code;
      var segs=segments(String(text)), rt=tuneRate(lang,clamp(rate,0.55,1.4));
      var pit=femLift(v);
      var retried=false;
      function alive(){return my===_sayGen}
      function allDone(){ maybeStopKeepAlive(); hlClear(); ttsOK() }
      (function sayseg(k){
        if(!alive())return;   /* ההקראה הזאת בוטלה — המקטע הבא לא יוצא */
        if(k>=segs.length){ allDone(); return }
        /* moved מבטיח שמקטע מתקדם פעם אחת בלבד: onend ושומר הזמן
           יכולים שניהם לרצות לקדם אותו, וקידום כפול מדלג על מקטע. */
        var seg=segs[k], moved=false, disarm=null;
        function next(){
          if(moved||!alive())return;
          moved=true; if(disarm)disarm();
          if(k+1<segs.length) setTimeout(function(){sayseg(k+1)},SEG_GAP);
          else allDone();
        }
        var u=new SpeechSynthesisUtterance(seg.text);
        u.lang=lang;
        if(v){ try{ u.voice=v }catch(e2){} }
        u.rate=rt; u.pitch=pit; u.volume=1;
        u.onboundary=function(e){if(!e.name||e.name==="word")hlAt(seg.start+e.charIndex)};
        u.onend=next;
        u.onerror=function(e){
          if(moved||!alive())return;
          var err=(e&&e.error)||"";
          /* ביטול יזום אינו תקלה — stopSpeak כבר ניקה אחריו */
          if(err==="canceled"||err==="interrupted"){moved=true;if(disarm)disarm();return}
          /* קול רשת שנכשל פירושו כמעט תמיד שאין אינטרנט. עוברים לקול
             מקומי וחוזרים על אותו מקטע, פעם אחת, כדי שההקראה לא
             תישבר בשקט באמצע שאלה. */
          if(!retried&&v&&v.localService===false){
            retried=true; _netVoiceOK=false; moved=true;
            if(disarm)disarm(); _activeU=null;
            v=bestVoice(code); lang=(v&&v.lang)||code; pit=femLift(v);
            setTimeout(function(){sayseg(k)},SEG_GAP);
            return;
          }
          moved=true; if(disarm)disarm(); maybeStopKeepAlive(); ttsFail(err);
        };
        _activeU=u;                        /* מגן מפני איסוף זבל */
        try{if(speechSynthesis.paused)speechSynthesis.resume()}catch(e2){}
        speechSynthesis.speak(u);
        startKeepAlive();
        disarm=ttsWatchdog(function(){return alive()&&!moved},next);
      })(0);
    }catch(e){}
  })();

}
/* lang: "en" לחומר הנלמד, או קוד שפת האם להוראה. */
function speak(text,lang,rateMul){
  /* כל טקסט שמגיע להקראה מנוקה מתגיות. חלק מהקריאות כבר מנקות
     לבד, וניקוי חוזר אינו משנה דבר — אבל בלעדיו כל מחרוזת שנשארה
     עם <sub> או <span class="frac"> הוקראה בקול כתגית: הסטודנט
     שמע "span class frac" באמצע השאלה. */
  text=plainOf(String(text||"")).trim().replace(/_{2,}/g,"\u2026"); if(!text)return;
  lang=lang||"en";
  var code=lang==="en"?EN_TTS:LANGS[lang].tts;
  var rate=clamp(state.rate*(rateMul||1),0.55,1.4);
  stopSpeak();
  var my=_sayGen;   /* גם תשובת רשת שמגיעה אחרי עצירה לא תושמע */
  /* שכבה 1 - קובץ מוקלט (המנוע של תאוריה מדברת). יש קובץ:
     מנגנים וזהו; אין: קול המכשיר כרגיל. מבדק חוסרים 30.9 סעיף 4. */
  if(typeof RECORDED!=="undefined"&&RECORDED.play(text,lang,{rate:state.rate,
      onError:function(){ if(my===_sayGen)speakDevice(text,code,rate) }})){
    return;
  }
  if(gemOn()){
    var vid=gvOf(state.gemVoice).id;
    var ck=lang+"|"+vid+"|"+rate.toFixed(2)+"|"+text;
    if(gCache[ck]){playUrl(gCache[ck],text,code,rate);return}
    gBusy=true; renderSpeakState();
    gSynth(text,vid,rate,lang).then(function(u){
      if(my!==_sayGen)return;
      gCache[ck]=u; gBusy=false; renderSpeakState(); playUrl(u,text,code,rate);
    }).catch(function(){
      gBusy=false; renderSpeakState(); speakDevice(text,code,rate);
    });
    return;
  }
  speakDevice(text,code,rate);
}
function playUrl(url,text,code,rate){
  gStop();
  /* משתמשים באלמנט ששוחרר במגע ולא יוצרים חדש. */
  if(!GEL)GEL=new Audio();
  gAudio=GEL; gAudio.src=url;
  gAudio.play().catch(function(){speakDevice(text,code,rate)});
}
function stopSpeak(){_sayGen++;gStop();if(typeof RECORDED!=="undefined")RECORDED.stop();hlClear();stopKeepAlive();_activeU=null;try{if(window.speechSynthesis)speechSynthesis.cancel()}catch(e){}}
/* עוזבים את הדף — הקול נעצר. בלעדיו הוא ממשיך ברקע אחרי מעבר לטאב
   אחר, ולפעמים נתקע עד סגירת הדפדפן. */
try{document.addEventListener("visibilitychange",function(){
  if(document.hidden)stopSpeak();
});}catch(e){}
/* iOS לא ישמיע כלום עד שאמירה אחת יצאה מתוך handler של מגע אמיתי.
   אמירה אוטומטית בטעינת הדף נבלעת בשקט — בלי חריגה, בלי לוג, בלי
   דרך לדעת. משחררים פעם אחת עם אמירה ריקה.
   חשוב: קריאה ישירה, בלי voicesReady — הבטחה שוברת את שרשרת המגע
   ו-Safari כבר לא יזהה את האמירה כיוזמת משתמש. */
try{document.addEventListener("pointerdown",function(){
  try{speechSynthesis.speak(new SpeechSynthesisUtterance(""))}catch(e){}
  /* ואותו דבר לאלמנט השמע: מקור שקט, play בתוך המגע עצמו. */
  try{
    if(!GEL)GEL=new Audio();
    GEL.src=SILENT_WAV;
    var pr=GEL.play();
    if(pr&&pr.then)pr.then(function(){try{GEL.pause();GEL.currentTime=0}catch(e){}},function(){});
  }catch(e){}
},{once:true});}catch(e){}

/* ============================================================
   7. תוכן
   ------------------------------------------------------------
   בנק שאלות כתוב, ולא מחולל. באזרחות אין נוסחה שממנה נגזרת
   שאלה: הניסוח המדויק הוא החומר הנלמד, ומסיח שנבנה אוטומטית
   מנוסח אחר היה יוצא או מופרך מדי או נכון בעצמו.

   Q(id, q, opts, ok, hint, ex, fig)
     id   — מזהה יציב לפריט. הוא נכנס לסטטיסטיקה של הלומד, ולכן
            אסור לו להשתנות כשמוסיפים פריט לפניו.
     q    — נוסח השאלה, בארבע שפות.
     opts — ארבע תשובות, כל אחת בארבע שפות. תמיד ארבע: שלוש
            אפשרויות הן ניחוש של אחד משלושה.
     ok   — אינדקס התשובה הנכונה במערך opts (0..3). הסדר על
            המסך מעורבב בכל הצגה, ולכן האינדקס אינו רמז.
     hint — רמז שמכוון לחשיבה ואינו מוסר את התשובה.
     ex   — ההסבר שנפתח אחרי המענה, גם כשענו נכון.
     fig  — מפתח איור מתוך FIGS, או null. אופציונלי בהגדרה:
            רוב השאלות באזרחות הן טקסט בלבד.

   כל שדה קיים בארבע השפות. אזרחות נלמדת בשפת האם — מי שקורא
   בקושי בעברית לא ילמד ממנה מדרג נורמות, ולכן התוכן עצמו
   מתורגם ולא רק הממשק.

   מקור: נושאי בחינת הבגרות במורשת ודת האיסלאם באתר משרד החינוך (pop.education.gov.il), בחינות דת האיסלאם 074501 (2007) כמבנה תחומים. הניסוח מקורי של בקול, עם קרדיט וקישור למשרד החינוך.
   השאלות נכתבו לאפליקציה הזאת ואינן העתק של בחינה.
   ============================================================ */
function Q(id,q,opts,ok,hint,ex,fig,wrong){
  return {id:id,q:q,o:opts,ok:ok,hint:hint,ex:ex,fig:fig||null,wrong:wrong||null};
}

function figBox(x,y,w,h,label,sub){
  return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="6" '+
    'fill="var(--surface2)" stroke="currentColor" stroke-width="1.2"/>'+
    '<text x="'+(x+w/2)+'" y="'+(y+(sub?h/2-2:h/2+4))+'" text-anchor="middle" '+
    'font-size="10" font-weight="700" fill="currentColor">'+esc(label)+'</text>'+
    (sub?'<text x="'+(x+w/2)+'" y="'+(y+h/2+11)+'" text-anchor="middle" '+
      'font-size="8" fill="currentColor" opacity=".75">'+esc(sub)+'</text>':"");
}

  Q("isl-quran-1-03",{"he": "מהי הסורה הראשונה בקוראן לפי סדר הספר?", "ar": "ما هي أول سورة في ترتيب المصحف؟", "ru": "Какая сура первая в порядке мусхафа?", "en": "Which surah is first in the order of the Quran?"},[{"he": "אל-בקרה", "ar": "البقرة", "ru": "аль-Бакара", "en": "Al-Baqara"}, {"he": "אל-עלק", "ar": "العلق", "ru": "аль-Алак", "en": "Al-Alaq"}, {"he": "אל-אח'לאץ'", "ar": "الإخلاص", "ru": "аль-Ихлас", "en": "Al-Ikhlas"}, {"he": "אל-פאתחה", "ar": "الفاتحة", "ru": "аль-Фатиха", "en": "Al-Fatiha"}],3,{"he": "היא נקראת גם \"פותחת הספר\".", "ar": "تسمى أيضًا «فاتحة الكتاب».", "ru": "Её называют также «Открывающей Книгу».", "en": "It is also called \"the Opening of the Book\"."},{"he": "הסורה הראשונה בסדר הקוראן היא אל-פאתחה, ויש בה שבעה פסוקים. קוראים אותה בכל תפילה.", "ar": "أول سورة في ترتيب المصحف هي الفاتحة، وفيها سبع آيات، وتُقرأ في كل صلاة.", "ru": "Первая в порядке мусхафа - аль-Фатиха, в ней семь аятов. Её читают в каждой молитве.", "en": "The first surah in the order of the Quran is al-Fatiha, with seven verses. It is read in every prayer."},null),
  Q("isl-quran-1-04",{"he": "באיזה חודש התחילה ירידת הקוראן?", "ar": "في أي شهر بدأ نزول القرآن؟", "ru": "В каком месяце началось ниспослание Корана?", "en": "In which month did the revelation of the Quran begin?"},[{"he": "ברמדאן", "ar": "في رمضان", "ru": "В рамадане", "en": "In Ramadan"}, {"he": "בשוואל", "ar": "في شوال", "ru": "В шавваль", "en": "In Shawwal"}, {"he": "במוחרם", "ar": "في محرم", "ru": "В мухаррам", "en": "In Muharram"}, {"he": "ברג'ב", "ar": "في رجب", "ru": "В раджаб", "en": "In Rajab"}],0,{"he": "זה גם חודש הצום.", "ar": "هو أيضًا شهر الصيام.", "ru": "Это же месяц поста.", "en": "It is also the month of fasting."},{"he": "הקוראן התחיל לרדת בליל אל-קדר שברמדאן, כפי שנאמר בסורת אל-בקרה ובסורת אל-קדר.", "ar": "بدأ نزول القرآن في ليلة القدر من رمضان، كما في سورتي البقرة والقدر.", "ru": "Откровение Корана началось в ночь предопределения в рамадане, как сказано в сурах аль-Бакара и аль-Кадр.", "en": "The Quran began to be revealed on the Night of Power in Ramadan, as stated in surahs al-Baqara and al-Qadr."},null),
  Q("isl-quran-1-05",{"he": "מה פירוש המילה \"נסח\" בלימודי הדת?", "ar": "ماذا يعني «النسخ» في علوم الدين؟", "ru": "Что означает «наск» в религиозных науках?", "en": "What does \"naskh\" mean in religious studies?"},[{"he": "כתיבת הקוראן מחדש בנוסח אחר, אחרי שעברו עליו שנים רבות", "ar": "كتابة القرآن من جديد بنص آخر بعد مرور سنين كثيرة", "ru": "Переписывание Корана заново другим текстом спустя много лет", "en": "Writing the Quran again in a different wording after many years"}, {"he": "ביטול הוראה דתית קודמת על ידי הוראה מאוחרת יותר", "ar": "رفع حكم شرعي سابق بحكم شرعي لاحق", "ru": "Отмена прежнего предписания более поздним", "en": "Replacing an earlier ruling with a later ruling"}, {"he": "תרגום הקוראן לשפה אחרת, כדי שמי שאינו דובר ערבית יבין אותו", "ar": "ترجمة القرآن إلى لغة أخرى ليفهمه من لا يتكلم العربية", "ru": "Перевод Корана на другой язык, чтобы его понял тот, кто не знает арабского", "en": "Translating the Quran into another language so non-Arabic speakers understand it"}, {"he": "שינון סורה בעל פה, עד שאפשר לקרוא אותה בתפילה בלי להסתכל", "ar": "حفظ سورة عن ظهر قلب حتى تُقرأ في الصلاة من غير نظر", "ru": "Заучивание суры наизусть, чтобы читать её в молитве не глядя", "en": "Memorizing a surah by heart so it can be recited in prayer without looking"}],1,{"he": "המילה קשורה להסרה ולהחלפה.", "ar": "الكلمة مرتبطة بالرفع والإزالة.", "ru": "Слово связано со снятием и заменой.", "en": "The word is about lifting and replacing."},{"he": "נסח הוא כשהמחוקק מבטל דין מוקדם ונותן במקומו דין חדש. הוא קשור להוראות ולא לסיפורים.", "ar": "النسخ أن يرفع الشارع حكمًا سابقًا ويضع مكانه حكمًا جديدًا. وهو يتعلق بالأحكام لا بالقصص.", "ru": "Наск - когда законодатель отменяет прежнее предписание и вводит новое. Он касается предписаний, а не рассказов.", "en": "Naskh is when the lawgiver cancels an earlier ruling and sets a new one. It concerns rulings, not stories."},null),
  Q("isl-quran-1-06",{"he": "לאיזה כיוון התפללו המוסלמים בתחילה, לפני שהשתנה כיוון התפילה?", "ar": "إلى أي جهة صلّى المسلمون في البداية قبل تغيير القبلة؟", "ru": "В какую сторону молились мусульмане сначала, до смены киблы?", "en": "Which direction did the Muslims first pray toward, before the qibla changed?"},[{"he": "אל הר סיני שבארץ מצרים", "ar": "إلى جبل سيناء في أرض مصر", "ru": "К горе Синай в земле Египта", "en": "Toward Mount Sinai in the land of Egypt"}, {"he": "אל הים הגדול, לכיוון המערב", "ar": "إلى جهة البحر الكبير غربًا", "ru": "В сторону великого моря, на запад", "en": "Toward the great sea, to the west"}, {"he": "לבית המקדש בירושלים", "ar": "إلى بيت المقدس في القدس", "ru": "К Байт аль-Макдису в Иерусалиме", "en": "Toward Bayt al-Maqdis in Jerusalem"}, {"he": "אל אל-מדינה שבצפון חצי האי", "ar": "إلى المدينة المنورة شمالًا", "ru": "К Медине на севере полуострова", "en": "Toward Medina in the north of the peninsula"}],2,{"he": "המקום הזה הוא המסגד אל-אקצא.", "ar": "هذا المكان فيه المسجد الأقصى.", "ru": "В этом месте находится мечеть аль-Акса.", "en": "This place has al-Aqsa Mosque."},{"he": "בתחילה התפללו לבית המקדש. אחר כך ירדה הוראה להתפלל אל הכעבה (אל-בקרה, 144). זו דוגמה מפורסמת לנסח.", "ar": "صلّوا أولًا إلى بيت المقدس، ثم نزل الأمر بالتوجه إلى الكعبة (البقرة 144). وهذا مثال مشهور للنسخ.", "ru": "Сначала молились в сторону Байт аль-Макдиса, потом пришло веление обращаться к Каабе (аль-Бакара, 144). Это известный пример наска.", "en": "At first they prayed toward Bayt al-Maqdis, then came the command to face the Kaaba (al-Baqara 144). This is a famous example of naskh."},null),
],
[
  Q("isl-quran-2-01",{"he": "מי ציווה לאסוף את הקוראן לדפים אחרי קרב אל-יאמאמה?", "ar": "من الذي أمر بجمع القرآن في صحف بعد معركة اليمامة؟", "ru": "Кто распорядился собрать Коран в свитки после битвы при Ямаме?", "en": "Who ordered the Quran to be gathered into sheets after the Battle of al-Yamama?"},[{"he": "ח'ליפה עלי בן אבי טאלב, בשנות שלטונו", "ar": "الخليفة علي بن أبي طالب في سنوات خلافته", "ru": "Халиф Али ибн Абу Талиб в годы своего правления", "en": "Caliph Ali ibn Abi Talib, during his caliphate"}, {"he": "ח'ליפה מועאוויה, בימי שלטונו בדמשק", "ar": "الخليفة معاوية في أيام حكمه بدمشق", "ru": "Халиф Муавия в годы его правления в Дамаске", "en": "Caliph Muawiya, in his years of rule in Damascus"}, {"he": "ח'ליפה אבו בכר, אחרי הצעתו של עומר", "ar": "الخليفة أبو بكر بعد اقتراح عمر", "ru": "Халиф Абу Бакр по совету Умара", "en": "Caliph Abu Bakr, after a suggestion from Umar"}, {"he": "הנביא עצמו, בליל אל-אסראא והמיעראג'", "ar": "النبي نفسه في ليلة الإسراء والمعراج", "ru": "Сам Пророк в ночь аль-Исра и Мираджа", "en": "The Prophet himself, on the night of al-Isra and Mi'raj"}],2,{"he": "זה קרה זמן קצר אחרי מות הנביא, כשרבים משומרי הקוראן נהרגו.", "ar": "حدث هذا بعد وفاة النبي بقليل، حين استُشهد كثير من حفظة القرآن.", "ru": "Это было вскоре после смерти Пророка, когда погибло много знатоков Корана.", "en": "This was soon after the Prophet's death, when many who had memorized the Quran were killed."},{"he": "אחרי קרב אל-יאמאמה חשש עומר שהקוראן יאבד. אבו בכר ציווה על זיד בן ת'אבית לאסוף את הדפים.", "ar": "بعد اليمامة خشي عمر ضياع القرآن، فأمر أبو بكر زيد بن ثابت بجمعه.", "ru": "После Ямамы Умар боялся потери Корана. Абу Бакр поручил Зайду ибн Сабиту собрать его.", "en": "After al-Yamama Umar feared the Quran would be lost. Abu Bakr told Zayd ibn Thabit to collect it."},null),
  Q("isl-quran-2-02",{"he": "מה עשה הח'ליפה עות'מאן בקשר לקוראן?", "ar": "ماذا فعل الخليفة عثمان بن عفان في شأن القرآن؟", "ru": "Что сделал халиф Усман для Корана?", "en": "What did Caliph Uthman do for the Quran?"},[{"he": "כתב סורה חדשה והוסיף אותה לסוף הקוראן", "ar": "كتب سورة جديدة وأضافها إلى آخر القرآن", "ru": "Написал новую суру и добавил её в конец Корана", "en": "He wrote a new surah and added it at the end of the Quran"}, {"he": "ביטל את סורת אל-פאתחה והוציא אותה מן המצחף", "ar": "ألغى سورة الفاتحة وأخرجها من المصحف", "ru": "Отменил суру аль-Фатиха и убрал её из мусхафа", "en": "He removed surah al-Fatiha and took it out of the mushaf"}, {"he": "תרגם את הקוראן לפרסית ושלח את התרגום לערים הגדולות", "ar": "ترجم القرآن إلى الفارسية وأرسل الترجمة إلى الأمصار", "ru": "Перевёл Коран на персидский и разослал перевод по городам", "en": "He translated the Quran into Persian and sent the translation to the cities"}, {"he": "העתיק עותקים מהמצחף ושלח אותם לערים הגדולות", "ar": "نسخ مصاحف وأرسلها إلى الأمصار", "ru": "Сделал списки мусхафа и разослал их по городам", "en": "Had copies of the mushaf made and sent them to the major cities"}],3,{"he": "המטרה הייתה שכולם יקראו בנוסח אחד.", "ar": "الهدف أن يقرأ الجميع بنص واحد.", "ru": "Цель была в том, чтобы все читали один текст.", "en": "The aim was that everyone would read one text."},{"he": "עות'מאן איחד את הקריאה והעתיק עותקים אחידים. כך נשמר הנוסח אחד בכל העולם המוסלמי.", "ar": "وحّد عثمان القراءة ونسخ مصاحف موحدة، فبقي النص واحدًا في العالم الإسلامي.", "ru": "Усман унифицировал чтение и разослал одинаковые списки, так текст остался единым.", "en": "Uthman unified the text and sent identical copies, so the text stayed one across the Muslim world."},null),
  Q("isl-quran-2-03",{"he": "במה סורות מכה (מכיות) מתמקדות בדרך כלל?", "ar": "بماذا تتميز السور المكية في الغالب؟", "ru": "Чем в основном отличаются мекканские суры?", "en": "What do the Makkan surahs mostly focus on?"},[{"he": "באמונה באל אחד, בחיי העולם הבא ובטוב הלב", "ar": "بالعقيدة والتوحيد واليوم الآخر ومكارم الأخلاق", "ru": "Верой в Единого Бога, жизнью после смерти, добрыми качествами", "en": "Faith in one God, the afterlife and good character"}, {"he": "בפרטי הדין של הירושה ושל חלוקת הרכוש", "ar": "بتفاصيل أحكام الميراث وقسمة التركة", "ru": "Деталями наследства и раздела имущества между наследниками", "en": "The details of inheritance and dividing property"}, {"he": "בסדר הקרבות ובחלוקת השלל שאחריהם", "ar": "بترتيب الغزوات وقسمة الغنائم بعدها", "ru": "Порядком сражений и разделом военной добычи после них", "en": "The order of the battles and dividing the spoils"}, {"he": "בהסדרי המסחר במידות ובמשקלות שבשוק אל-מדינה", "ar": "بتنظيم التجارة والمكاييل والموازين في سوق المدينة", "ru": "Правилами торговли, мер и весов на рынке города Медины", "en": "Rules of trade, measures and weights in the Medina market"}],0,{"he": "חשבו על המסר הראשון שנאמר לאנשים בתחילת הדרך.", "ar": "فكّر في الرسالة الأولى التي قيلت للناس في البداية.", "ru": "Подумайте о первом послании людям в начале пути.", "en": "Think of the first message given to people at the start."},{"he": "בימי מכה הדגש היה על יסודות האמונה. בימי מדינה ירדו יותר הוראות על חוק וחברה.", "ar": "ركّز العهد المكي على أسس العقيدة، وفي المدني نزلت أحكام التشريع والمجتمع أكثر.", "ru": "В мекканский период упор был на основы веры, в мединский - больше предписаний о праве и обществе.", "en": "The Makkan period stressed the foundations of faith; in Medina more rulings on law and society came down."},null),
  Q("isl-quran-2-04",{"he": "איך נאסר היין בקוראן, ומה אפשר ללמוד מכך?", "ar": "كيف حُرّمت الخمر في القرآن؟ وما الحكمة العامة في ذلك؟", "ru": "Как в Коране был запрещён хмельной напиток и чему это учит?", "en": "How was wine prohibited in the Quran? And what general wisdom does this show?"},[{"he": "ביום אחד בלי הכנה, כדי להלחיץ", "ar": "دفعة واحدة دون تمهيد", "ru": "Сразу, без подготовки", "en": "All at once with no preparation"}, {"he": "בהדרגה, כדי להקל על האנשים", "ar": "بالتدرج تيسيرًا على الناس", "ru": "Постепенно, чтобы облегчить людям", "en": "Gradually, to make it easier for people"}, {"he": "בפעם אחת, בהוראה שירדה בימי מכה", "ar": "دفعة واحدة بآية نزلت في مكة", "ru": "Сразу, одним аятом, ниспосланным в Мекке", "en": "All at once, in a verse revealed in Makkah"}, {"he": "הוא לא נאסר, אלא רק הומלץ להפחית בו", "ar": "لم يُحرَّم، وإنما نُدب إلى الإقلال منه", "ru": "Не был запрещён, лишь советовали пить меньше", "en": "It was never prohibited, only drinking less was advised"}],1,{"he": "חשבו על \"צעד אחר צעד\".", "ar": "فكّر في «خطوة بعد خطوة».", "ru": "Подумайте о «шаг за шагом».", "en": "Think \"step by step\"."},{"he": "האיסור בא בשלבים, עד הוראה סופית בסורת אל-מאאידה. זו חכמת הנסח: חוק בהדרגה וקלות על העם.", "ar": "جاء التحريم على مراحل حتى الحكم النهائي في سورة المائدة، وهذه من حكم النسخ: التدرج والتيسير.", "ru": "Запрет шёл этапами до окончательного веления в суре аль-Маида. Это мудрость наска: постепенность и облегчение.", "en": "The ban came in stages until the final ruling in al-Ma'ida. This is a wisdom of naskh: gradual law and ease for people."},null),
  Q("isl-quran-2-05",{"he": "מה פירוש \"אעג'אז אל-קוראן\"?", "ar": "ما معنى «إعجاز القرآن»؟", "ru": "Что значит «иджаз Корана»?", "en": "What does \"i'jaz of the Quran\" mean?"},[{"he": "שהקוראן קצר מאוד, ולכן קל לשנן אותו בעל פה", "ar": "أن القرآن قصير جدًا فيسهل حفظه عن ظهر قلب", "ru": "Что Коран очень короткий, и потому его легко заучить", "en": "That the Quran is very short, so it is easy to memorize"}, {"he": "שאפשר לכתוב כמוהו בקלות, אם יושבים על כך זמן מה", "ar": "أنه يسهل تأليف مثله إذا جلس المرء لذلك مدة", "ru": "Что подобное ему легко сочинить, если посидеть над этим время", "en": "That something like it is easy to compose if one sits over it a while"}, {"he": "שבני אדם אינם מסוגלים להביא דבר כמוהו", "ar": "عجز البشر عن الإتيان بمثله", "ru": "Люди не могут создать подобное ему", "en": "That people are unable to produce anything like it"}, {"he": "שאין בו שום פסוק, אלא רק סיפורים על הנביאים", "ar": "أنه لا آيات فيه وإنما قصص عن الأنبياء فقط", "ru": "Что в нём нет аятов, а только рассказы о пророках", "en": "That it has no verses, only stories about the prophets"}],2,{"he": "המילה באה מ\"חוסר יכולת\".", "ar": "الكلمة من «العجز».", "ru": "Слово происходит от «бессилие».", "en": "The word comes from \"inability\"."},{"he": "אעג'אז הוא חוסר היכולת של בני אדם להביא משהו דומה לקוראן, אף שהוא נאמר להם באתגר.", "ar": "الإعجاز هو عجز الناس عن الإتيان بمثل القرآن مع التحدي.", "ru": "Иджаз - неспособность людей создать подобное Корану, хотя им был брошен вызов.", "en": "I'jaz is people's inability to bring anything like the Quran, even after being challenged."},null),
  Q("isl-quran-2-06",{"he": "מהו \"האתגר\" (אל-תחדי) בקוראן?", "ar": "ما هو «التحدي» في القرآن؟", "ru": "Что такое «вызов» (ат-тахадди) в Коране?", "en": "What is the \"challenge\" (al-tahaddi) in the Quran?"},[{"he": "חידת שעשוע שילדים ערבים היו שואלים זה את זה", "ar": "لعبة ألغاز كان أطفال العرب يسألها بعضهم بعضًا", "ru": "Игра в загадки, которую арабские дети задавали друг другу", "en": "A riddle game Arab children would ask one another"}, {"he": "מירוץ סוסים שנערך בשוק, והזוכה בו קיבל פרס", "ar": "سباق خيل يُقام في السوق وينال الفائز فيه جائزة", "ru": "Скачки, которые устраивали на рынке, и победитель получал приз", "en": "A horse race held at the market, with a prize for the winner"}, {"he": "מחלוקת על חלוקת הירושה בין בני המשפחה אחרי מוות", "ar": "خلاف على قسمة الميراث بين أفراد الأسرة بعد الوفاة", "ru": "Спор о разделе наследства между членами семьи после смерти", "en": "A dispute over dividing an inheritance among the family after a death"}, {"he": "הקריאה להביא סורה כמו סורותיו אם הם בספק", "ar": "دعوتهم إلى الإتيان بسورة مثله إن كانوا في شك", "ru": "Призыв создать суру, подобную ему, если сомневаются", "en": "The call to bring a surah like it if they doubt it"}],3,{"he": "אחד הפסוקים הוא באל-בקרה 23.", "ar": "إحدى الآيات في البقرة 23.", "ru": "Один из аятов - в аль-Бакаре 23.", "en": "One verse is in al-Baqara 23."},{"he": "הקוראן קרא למי שמפקפק בו להביא סורה דומה, והם לא הצליחו. זהו האתגר.", "ar": "دعا القرآن المشككين إلى الإتيان بسورة مثله فعجزوا، وهذا هو التحدي.", "ru": "Коран призвал сомневающихся создать суру подобную ему, и они не смогли. Это и есть вызов.", "en": "The Quran called the doubters to bring a surah like it, and they could not. That is the challenge."},null),
],
[
  Q("isl-quran-3-01",{"he": "איזה מהבאים הוא צד של אעג'אז הקוראן?", "ar": "أي مما يأتي وجه من وجوه إعجاز القرآن؟", "ru": "Что из этого - сторона иджаза Корана?", "en": "Which of these is an aspect of the Quran's i'jaz?"},[{"he": "מספר הדפים שבעותק אחד, השווה בכל ההוצאות", "ar": "عدد أوراق النسخة الواحدة وتساويه في كل الطبعات", "ru": "Число страниц в одном экземпляре, равное во всех изданиях", "en": "The number of pages in one copy, the same in every edition"}, {"he": "צבע הדיו שבו נכתבו העותקים הראשונים", "ar": "لون الحبر الذي كُتبت به النسخ الأولى", "ru": "Цвет чернил, которыми написаны первые списки", "en": "The colour of the ink the first copies were written in"}, {"he": "הדפוס שבו מודפסים העותקים בימינו", "ar": "المطبعة التي تُطبع بها النسخ في أيامنا", "ru": "Типография, в которой печатают списки в наши дни", "en": "The printing press that prints copies nowadays"}, {"he": "הסגנון והרטוריקה הערבית שאין כמותם", "ar": "البلاغة والأسلوب العربي الذي لا نظير له", "ru": "Несравненная красота и риторика арабского слога", "en": "Its unmatched Arabic eloquence and style"}],3,{"he": "הערבים היו מומחים לשפה, ובכל זאת נדהמו.", "ar": "كان العرب أهل فصاحة ومع ذلك دُهشوا.", "ru": "Арабы были мастерами слова и всё же были поражены.", "en": "The Arabs were masters of language and were still amazed."},{"he": "מהצדדים: הסגנון והרטוריקה, החוקים שבו, והידיעות על דברים נסתרים. מספר דפים וצבע דיו אינם חלק מכך.", "ar": "من الوجوه: البلاغة والتشريع والإخبار بالغيب. أما عدد الأوراق ولون الحبر فليسا منها.", "ru": "Среди сторон: слог и риторика, законы и вести о сокрытом. Число страниц и цвет чернил к ним не относятся.", "en": "Aspects include its eloquence, its legislation and news of the unseen. Page count and ink colour are not aspects."},null),
  Q("isl-quran-3-02",{"he": "איזו ידיעה על העתיד בקוראן נחשבת לצד של אעג'אז?", "ar": "أي خبر عن المستقبل في القرآن يعد من وجوه الإعجاز؟", "ru": "Какая весть о будущем в Коране считается стороной иджаза?", "en": "Which news of the future in the Quran is considered an aspect of i'jaz?"},[{"he": "ניצחון הביזנטים (אר-רום) על הפרסים אחרי כמה שנים", "ar": "انتصار الروم على الفرس بعد بضع سنين", "ru": "Победа ромеев над персами через несколько лет", "en": "The Romans' victory over the Persians after a few years"}, {"he": "ניצחון הפרסים על הרומאים, ששלטו מאז בכל ארצות המזרח", "ar": "انتصار الفرس على الروم وحكمهم بلاد المشرق منذ ذلك الحين", "ru": "Победа персов над ромеями, после которой они правили всем Востоком", "en": "A Persian victory over the Romans, after which they ruled all the East"}, {"he": "הפסקת כל הקרבות בעולם מיד אחרי ירידת הסורה", "ar": "توقف كل الحروب في العالم فور نزول السورة", "ru": "Прекращение всех войн в мире сразу после ниспослания суры", "en": "The end of all wars in the world right after the surah was revealed"}, {"he": "מציאת אוצר גדול בדרום חצי האי, שחילקו אותו לעניים", "ar": "العثور على كنز كبير في جنوب الجزيرة ووُزّع على الفقراء", "ru": "Находка большого клада на юге полуострова, который раздали бедным", "en": "Finding a great treasure in the south of the peninsula, shared with the poor"}],0,{"he": "הסורה נקראת על שם האימפריה.", "ar": "السورة سُميت باسم الإمبراطورية.", "ru": "Сура названа по имени империи.", "en": "The surah is named after the empire."},{"he": "בסורת אר-רום נאמר שהרומאים ינצחו בעוד כמה שנים. זה קרה, וזו ידיעה על העתיד שמוכיחה את מקור הקוראן.", "ar": "في سورة الروم وعد بأن الروم سينتصرون بعد بضع سنين، وقد وقع ذلك، وهو إخبار بالغيب.", "ru": "В суре ар-Рум сказано, что ромеи победят через несколько лет. Так и случилось - это весть о сокрытом.", "en": "Surat ar-Rum says the Romans would win within a few years. It happened, and it is news of the unseen."},null),
  Q("isl-quran-3-03",{"he": "איזה פסוק מראה שאלוהים שומר על הקוראן?", "ar": "أي آية تدل على أن الله يحفظ القرآن؟", "ru": "Какой аят указывает, что Аллах хранит Коран?", "en": "Which verse shows that Allah protects the Quran?"},[{"he": "\"אמור: הוא אללה אחד, אללה הנצחי, לא ילד ולא נולד\" (אל-אח'לאץ' 1-3)", "ar": "﴿قُلْ هُوَ اللَّهُ أَحَدٌ * اللَّهُ الصَّمَدُ * لَمْ يَلِدْ وَلَمْ يُولَدْ﴾ (الإخلاص 1-3)", "ru": "«Скажи: Он - Аллах Единый, Аллах Самодостаточный, не родил и не был рождён» (аль-Ихлас, 1-3)", "en": "\"Say: He is Allah, the One; Allah, the Eternal; He begets not, nor was He begotten\" (al-Ikhlas 1-3)"}, {"he": "\"אנו הורדנו את הזכר ואנו שומרים עליו\" (אל-חיג'ר 9)", "ar": "﴿إِنَّا نَحْنُ نَزَّلْنَا الذِّكْرَ وَإِنَّا لَهُ لَحَافِظُونَ﴾ (الحجر 9)", "ru": "«Воистину, Мы ниспослали Напоминание и Мы его охраняем» (аль-Хиджр, 9)", "en": "\"We sent down the Reminder and We will protect it\" (al-Hijr 9)"}, {"he": "\"קרא בשם ריבונך אשר ברא, ברא את האדם מקריש דם\" (אל-עלק 1-2)", "ar": "﴿اقْرَأْ بِاسْمِ رَبِّكَ الَّذِي خَلَقَ * خَلَقَ الْإِنْسَانَ مِنْ عَلَقٍ﴾ (العلق 1-2)", "ru": "«Читай во имя твоего Господа, Который сотворил, сотворил человека из сгустка» (аль-Алак, 1-2)", "en": "\"Read in the name of your Lord who created, created man from a clot\" (al-Alaq 1-2)"}, {"he": "\"הוא הראשון והאחרון, הגלוי והנסתר, והוא יודע כל דבר\" (אל-חדיד 3)", "ar": "﴿هُوَ الْأَوَّلُ وَالْآخِرُ وَالظَّاهِرُ وَالْبَاطِنُ وَهُوَ بِكُلِّ شَيْءٍ عَلِيمٌ﴾ (الحديد 3)", "ru": "«Он - Первый и Последний, Явный и Сокрытый, и Он знает обо всём» (аль-Хадид, 3)", "en": "\"He is the First and the Last, the Manifest and the Hidden, and He knows all things\" (al-Hadid 3)"}],1,{"he": "חפשו פסוק שמדבר על \"שמירה\".", "ar": "ابحث عن آية فيها «الحفظ».", "ru": "Ищите аят о «хранении».", "en": "Look for a verse about \"protecting\"."},{"he": "בסורת אל-חיג'ר 9 נאמר שאלוהים הוריד את הזכר ושהוא שומר עליו. זה ההוכחה מן הקוראן לשמירתו.", "ar": "في الحجر 9 أخبر الله أنه نزّل الذكر وتكفّل بحفظه، وهذا دليل حفظ القرآن.", "ru": "В аль-Хиджр 9 сказано, что Аллах ниспослал Напоминание и сохранит его. Это довод о сохранности Корана.", "en": "In al-Hijr 9 Allah says He sent down the Reminder and will protect it. This is the proof of the Quran's preservation."},null),
  Q("isl-quran-3-04",{"he": "כמה זמן ירד הקוראן בערך?", "ar": "كم استغرق نزول القرآن تقريبًا؟", "ru": "Сколько примерно длилось ниспосылание Корана?", "en": "About how long did the revelation of the Quran take?"},[{"he": "כשנה אחת בלבד, כולה במכה לפני ההג'רה", "ar": "نحو سنة واحدة فقط، كلها في مكة قبل الهجرة", "ru": "Около одного года, целиком в Мекке до хиджры", "en": "About one year only, all of it in Makkah before the hijra"}, {"he": "כ-7 שנים, כ-4 במכה וכ-3 במדינה", "ar": "نحو 7 سنوات: 4 في مكة و3 في المدينة", "ru": "Около 7 лет: 4 в Мекке и 3 в Медине", "en": "About 7 years: about 4 in Makkah and 3 in Medina"}, {"he": "כ-23 שנה, כ-13 במכה וכ-10 במדינה", "ar": "نحو 23 سنة: 13 في مكة و10 في المدينة", "ru": "Около 23 лет: 13 в Мекке и 10 в Медине", "en": "About 23 years: about 13 in Makkah and 10 in Medina"}, {"he": "כ-50 שנה, כ-30 במכה וכ-20 במדינה", "ar": "نحو 50 سنة: 30 في مكة و20 في المدينة", "ru": "Около 50 лет: 30 в Мекке и 20 в Медине", "en": "About 50 years: about 30 in Makkah and 20 in Medina"}],2,{"he": "עשרות בשנים, אבל לא חמישים.", "ar": "أكثر من عقدين، لكن ليس خمسين.", "ru": "Больше двух десятилетий, но не пятьдесят.", "en": "More than two decades, but not fifty."},{"he": "הקוראן ירד בהדרגה, בערך 23 שנה מהתגלות חירא עד סוף חיי הנביא.", "ar": "نزل القرآن منجَّمًا نحو ثلاث وعشرين سنة، من غار حراء إلى قرب وفاة النبي.", "ru": "Коран ниспосылался постепенно примерно 23 года - от Хиры до конца жизни Пророка.", "en": "The Quran came down gradually over about 23 years, from Hira until near the end of the Prophet's life."},null),
  Q("isl-quran-3-05",{"he": "מהו ההבדל בין נסח של פסוק לבין חוק שנשאר?", "ar": "ما الذي يميز الحكم المنسوخ عن الحكم المحكم الباقي؟", "ru": "Чем отменённое предписание отличается от действующего?", "en": "What distinguishes an abrogated ruling from a standing ruling?"},[{"he": "המבוטל תמיד ארוך יותר מן ההוראה שבאה אחריו", "ar": "المنسوخ دائمًا أطول من الحكم الذي جاء بعده", "ru": "Отменённое всегда длиннее предписания, пришедшего после него", "en": "The abrogated one is always longer than the ruling that came after it"}, {"he": "שניהם זהים בכל מקרה, ואין הבדל בין המבוטל לנשאר", "ar": "هما متماثلان دائمًا ولا فرق بين المنسوخ والمحكم", "ru": "Они всегда одинаковы, и нет разницы между отменённым и действующим", "en": "They are always identical, with no difference between abrogated and standing"}, {"he": "המבוטל נמחק מן המצחף תמיד, ואינו נקרא עוד בתפילה", "ar": "المنسوخ يُحذف من المصحف دائمًا ولا يُقرأ في الصلاة", "ru": "Отменённое всегда удаляется из мусхафа и больше не читается в молитве", "en": "The abrogated one is always deleted from the mushaf and no longer recited"}, {"he": "המבוטל כבר אינו מחייב, והנשאר ממשיך לחייב", "ar": "المنسوخ لا يُعمل به والمحكم يبقى معمولًا به", "ru": "Отменённое больше не обязательно, действующее остаётся обязательным", "en": "The abrogated one is no longer binding; the standing one still binds"}],3,{"he": "שימו לב לשאלה: מה מחייב היום?", "ar": "انتبه: ما الذي يُعمل به اليوم؟", "ru": "Спросите: что обязательно сегодня?", "en": "Ask: what is binding today?"},{"he": "הנסח מבטל את תוקף ההוראה הישנה. כך יודעים מה מחייב: מבררים אם הוראה אחת באה אחרי האחרת.", "ar": "النسخ يرفع العمل بالحكم القديم، ونعرف ما يلزم بمعرفة المتقدم والمتأخر.", "ru": "Наск снимает силу старого предписания. Что обязательно, узнают, выяснив, что пришло позже.", "en": "Naskh removes the force of the older ruling. We know which binds by finding which came later."},null),
  Q("isl-quran-3-06",{"he": "איך מכירים איזה פסוק או הוראה מבטל ואיזה מבוטל?", "ar": "كيف نعرف الناسخ من المنسوخ؟", "ru": "Как узнают отменяющее и отменённое?", "en": "How do we know which is the abrogating and which the abrogated?"},[{"he": "לפי דברי הנביא או הסחאבי, או לפי ידיעת הסדר בזמן", "ar": "بنص النبي أو قول الصحابي أو بمعرفة المتقدم والمتأخر", "ru": "По словам Пророка или сподвижника или по знанию порядка во времени", "en": "By the Prophet's words, a Companion's statement, or knowing which came first"}, {"he": "לפי אורך הפסוק: הפסוק הארוך מבטל תמיד את הקצר ממנו", "ar": "بطول الآية: الآية الطويلة تنسخ القصيرة دائمًا", "ru": "По длине аята: длинный аят всегда отменяет короткий", "en": "By the length of the verse: a longer verse always abrogates a shorter one"}, {"he": "לפי דעתו האישית של כל אדם, וכל קורא מחליט בעצמו מה מבוטל", "ar": "برأي كل شخص، فكل قارئ يقرر بنفسه ما المنسوخ", "ru": "По личному мнению каждого: читатель сам решает, что отменено", "en": "By each person's own opinion, with every reader deciding what is abrogated"}, {"he": "לפי מספר המילים בלבד: ההוראה שיש בה יותר מילים גוברת", "ar": "بعدد الكلمات فقط: الحكم الذي فيه كلمات أكثر هو المقدَّم", "ru": "Только по числу слов: предписание с большим числом слов берёт верх", "en": "Only by word count: the ruling with more words prevails"}],0,{"he": "הידע על הזמן הוא חשוב.", "ar": "المعرفة بالزمن مهمة.", "ru": "Знание времени важно.", "en": "Knowing the timing is important."},{"he": "מזהים נסח לפי נוסח מפורש מהנביא, לפי עדות הסחאבה, או לפי ידיעת מי ירד קודם ומי אחר כך.", "ar": "يُعرف النسخ بالنص الصريح عن النبي أو بقول الصحابي أو بمعرفة التاريخ.", "ru": "Наск узнают по прямому слову Пророка, по свидетельству сподвижника или по знанию хронологии.", "en": "Naskh is known by explicit words of the Prophet, a Companion's report, or knowing the chronology."},null),
],
]);

topic("isl-hadith","sources",{"he": "החדית': הסונה, אל-מועטא ובדיית חדית'", "ar": "الحديث النبوي: السنة والموطأ والوضع", "ru": "Хадис: Сунна, аль-Муватта и выдумывание хадисов", "en": "Hadith: the Sunnah, al-Muwatta' and fabrication"},{"he": "מהו חדית', האימאם מאלכ וספרו, ולמה בדו חדית'ים", "ar": "ما الحديث، والإمام مالك وكتابه، ولماذا وُضعت أحاديث", "ru": "Что такое хадис, имам Малик и его книга, почему сочиняли хадисы", "en": "What a hadith is, Imam Malik and his book, and why hadiths were invented"}, [
[
  Q("isl-hadith-1-01",{"he": "מהו חדית'?", "ar": "ما هو الحديث النبوي؟", "ru": "Что такое хадис?", "en": "What is a hadith?"},[{"he": "ספר היסטוריה שמספר על העמים שחיו בעולם לפני האיסלאם", "ar": "كتاب تاريخ يروي أخبار الأمم التي عاشت قبل الإسلام", "ru": "Книга по истории, рассказывающая о народах, живших до ислама", "en": "A history book telling of the peoples who lived in the world before Islam"}, {"he": "שיר ערבי ישן שחיברו המשוררים לפני בוא האיסלאם", "ar": "قصيدة عربية قديمة نظمها الشعراء قبل مجيء الإسلام", "ru": "Старое арабское стихотворение, сложенное поэтами до прихода ислама", "en": "An old Arabic poem composed by poets before Islam came"}, {"he": "דברי הנביא, מעשיו או אישורו לדבר שנעשה לפניו", "ar": "أقوال النبي وأفعاله وتقريره", "ru": "Слова Пророка, его поступки или одобрение", "en": "The Prophet's words, actions or approval of something done before him"}, {"he": "פסק דין שכתב שופט מוסלמי, והוא מחייב את כל המוסלמים", "ar": "حكم كتبه قاضٍ مسلم وهو ملزم لجميع المسلمين", "ru": "Приговор, написанный мусульманским судьёй и обязательный для всех", "en": "A ruling written by a Muslim judge that binds all Muslims"}],2,{"he": "ההגדרה כוללת שלושה דברים: מה שנאמר, מה שנעשה, ומה שאושר.", "ar": "التعريف فيه ثلاثة أمور: ما قيل وما فُعل وما أُقِرّ.", "ru": "В определение входят три вещи: сказанное, сделанное и одобренное.", "en": "The definition has three parts: what was said, done and approved."},{"he": "החדית' הוא מה שיוחס לנביא (עליו השלום): אמירה, מעשה או אישור (תקריר).", "ar": "الحديث ما نُسب إلى النبي ﷺ من قول أو فعل أو تقرير.", "ru": "Хадис - то, что приписывается Пророку (мир ему): слово, поступок или одобрение (такрир).", "en": "A hadith is what is attributed to the Prophet (peace be upon him): a saying, an action or an approval (taqrir)."},null),
  Q("isl-hadith-1-02",{"he": "מהו מקור החוק השני באיסלאם אחרי הקוראן?", "ar": "ما هو المصدر الثاني للتشريع بعد القرآن؟", "ru": "Какой второй источник права после Корана?", "en": "What is the second source of Islamic law after the Quran?"},[{"he": "הסיפורים העממיים שסופרו בשווקים", "ar": "الحكايات الشعبية المتداولة في الأسواق", "ru": "Народные рассказы, ходившие на рынках", "en": "Folk stories told in the markets"}, {"he": "דעתו האישית של השליט", "ar": "رأي الحاكم الشخصي", "ru": "Личное мнение правителя", "en": "The ruler's personal opinion"}, {"he": "המנהג המקומי בכל עיר", "ar": "العرف المحلي في كل مدينة", "ru": "Местный обычай каждого города", "en": "The local custom of each city"}, {"he": "הסונה (דרכו של הנביא)", "ar": "السنة النبوية", "ru": "Сунна - путь и обычай Пророка", "en": "The Sunnah (the Prophet's way)"}],3,{"he": "היא מפרשת את הקוראן ומוסיפה עליו.", "ar": "تفسّر القرآن وتضيف إليه.", "ru": "Она разъясняет Коран и дополняет его.", "en": "It explains the Quran and adds to it."},{"he": "הסונה היא המקור השני אחרי הקוראן. היא מפרשת אותו ומוסיפה הוראות, כמו פרטי התפילה.", "ar": "السنة المصدر الثاني بعد القرآن، تبيّن مجمله وتضيف أحكامًا، كتفاصيل الصلاة.", "ru": "Сунна - второй источник после Корана. Она поясняет его и добавляет предписания, например детали молитвы.", "en": "The Sunnah is the second source after the Quran. It explains it and adds rulings, such as prayer details."},null),
