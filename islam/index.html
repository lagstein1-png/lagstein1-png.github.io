  Q("isl-hadith-1-03",{"he": "מי הוא מחבר \"אל-מועטא\"?", "ar": "من هو مؤلف كتاب «الموطأ»؟", "ru": "Кто автор книги «аль-Муватта»?", "en": "Who wrote \"al-Muwatta'\"?"},[{"he": "האימאם מאלכ בן אנס", "ar": "الإمام مالك بن أنس", "ru": "Имам Малик ибн Анас", "en": "Imam Malik ibn Anas"}, {"he": "האימאם אל-בוח'ארי", "ar": "الإمام البخاري", "ru": "Имам аль-Бухари", "en": "Imam al-Bukhari"}, {"he": "האימאם אחמד בן חנבל", "ar": "الإمام أحمد بن حنبل", "ru": "Имам Ахмад ибн Ханбаль", "en": "Imam Ahmad ibn Hanbal"}, {"he": "האימאם אל-נוואוי", "ar": "الإمام النووي", "ru": "Имам ан-Навави", "en": "Imam al-Nawawi"}],0,{"he": "הוא חי בעיר של הנביא.", "ar": "عاش في مدينة النبي.", "ru": "Он жил в городе Пророка.", "en": "He lived in the Prophet's city."},{"he": "אל-מועטא נכתב בידי האימאם מאלכ, תושב אל-מדינה. הוא ממקימי אחת מארבע האסכולות.", "ar": "ألّف الموطأ الإمام مالك بن أنس من أهل المدينة، وهو صاحب أحد المذاهب الأربعة.", "ru": "«Аль-Муватта» написал имам Малик, житель Медины. Он основатель одной из четырёх школ.", "en": "Al-Muwatta' was written by Imam Malik, a man of Medina. He founded one of the four schools of law."},null),
  Q("isl-hadith-1-04",{"he": "באיזו עיר חי רוב חייו האימאם מאלכ?", "ar": "في أي مدينة عاش الإمام مالك معظم حياته؟", "ru": "В каком городе прожил большую часть жизни имам Малик?", "en": "In which city did Imam Malik spend most of his life?"},[{"he": "בגדאד, בירת העבאסים", "ar": "بغداد عاصمة العباسيين", "ru": "Багдад, столица Аббасидов", "en": "Baghdad, the Abbasid capital"}, {"he": "אל-מדינה אל-מנוורה", "ar": "المدينة المنورة", "ru": "Медина (аль-Мунаввара)", "en": "Medina (al-Munawwara)"}, {"he": "דמשק, עיר האומאים", "ar": "دمشق عاصمة الأمويين", "ru": "Дамаск, столица Омейядов", "en": "Damascus, the Umayyad capital"}, {"he": "קהיר שבמצרים", "ar": "القاهرة في مصر", "ru": "Каир в Египте", "en": "Cairo, in Egypt"}],1,{"he": "העיר שאליה היגר הנביא.", "ar": "المدينة التي هاجر إليها النبي.", "ru": "Город, куда переселился Пророк.", "en": "The city the Prophet migrated to."},{"he": "מאלכ חי בעיר אל-מדינה ולמד מחכמיה ומתושביה. לכן נקרא \"אימאם דאר אל-הג'רה\".", "ar": "عاش مالك في المدينة المنورة وأخذ عن علمائها فلُقّب «إمام دار الهجرة».", "ru": "Малик жил в Медине и учился у её учёных, поэтому его называли «имамом города хиджры».", "en": "Malik lived in Medina and learned from its scholars, so he was called \"Imam of the abode of the Hijra\"."},null),
  Q("isl-hadith-1-05",{"he": "מהם שני הספרים הנחשבים הנאמנים ביותר של חדית'ים?", "ar": "ما أصح كتابين في الحديث؟", "ru": "Какие две книги хадисов считаются самыми достоверными?", "en": "Which two hadith books are considered the most authentic?"},[{"he": "אל-מועטא ואל-מוסנד בלבד", "ar": "الموطأ والمسند فقط", "ru": "Только «аль-Муватта» и «аль-Муснад»", "en": "Only al-Muwatta' and al-Musnad"}, {"he": "סירת אבן הישאם ותפסיר אל-טברי", "ar": "سيرة ابن هشام وتفسير الطبري", "ru": "Сира Ибн Хишама и тафсир ат-Табари", "en": "Ibn Hisham's Sira and al-Tabari's tafsir"}, {"he": "אל-בוח'ארי ומוסלם", "ar": "صحيح البخاري وصحيح مسلم", "ru": "Сахих аль-Бухари и Сахих Муслима", "en": "Sahih al-Bukhari and Sahih Muslim"}, {"he": "כתבי הפואטיקה הערבית", "ar": "كتب الشعر العربي", "ru": "Книги арабской поэзии", "en": "Books of Arabic poetry"}],2,{"he": "קוראים להם \"שני הצחיחים\".", "ar": "يسمّيان «الصحيحين».", "ru": "Их называют «двумя сахихами».", "en": "They are called \"the two Sahihs\"."},{"he": "הצחיח של אל-בוח'ארי והצחיח של מוסלם נקראים \"אל-צחיחאן\" והם מהאמינים ביותר בחדית'ים.", "ar": "صحيحا البخاري ومسلم يُسمَّيان «الصحيحين» وهما أصح كتب الحديث.", "ru": "Сахихи аль-Бухари и Муслима называют «ас-Сахихайн», они самые надёжные сборники.", "en": "Sahih al-Bukhari and Sahih Muslim are called \"the two Sahihs\" and are the most reliable hadith collections."},null),
  Q("isl-hadith-1-06",{"he": "מהו חדית' מבודה (מוצ'וע)?", "ar": "ما هو الحديث الموضوع؟", "ru": "Что такое выдуманный хадис (маудуъ)?", "en": "What is a fabricated (mawdu') hadith?"},[{"he": "חדית' חזק מאוד, שכל המוסרים שלו נאמנים ומדויקים", "ar": "حديث قوي جدًا كل رواته عدول ضابطون", "ru": "Очень сильный хадис, все передатчики которого надёжны и точны", "en": "A very strong hadith whose narrators are all upright and precise"}, {"he": "פירוש לקוראן שכתבו החכמים אחרי דור הסחאבה", "ar": "تفسير للقرآن كتبه العلماء بعد جيل الصحابة", "ru": "Толкование Корана, написанное учёными после поколения сподвижников", "en": "A Quran commentary written by scholars after the Companions’ generation"}, {"he": "קיצור של סורה ארוכה, שעשו כדי שיהיה קל לשנן אותה", "ar": "اختصار لسورة طويلة صُنع ليسهل حفظها", "ru": "Сокращение длинной суры, сделанное для облегчения заучивания", "en": "A shortened version of a long surah, made to be easier to memorize"}, {"he": "דבר שנבדה והוצג בשקר כדברי הנביא", "ar": "كلام مختلق نُسب كذبًا إلى النبي", "ru": "Выдуманные слова, ложно приписанные Пророку", "en": "Invented words falsely attributed to the Prophet"}],3,{"he": "המילה \"מוצ'וע\" קרובה ל\"הוצא מהראש\".", "ar": "كلمة «موضوع» قريبة من «مُصطنع».", "ru": "Слово «маудуъ» близко к «выдуманный».", "en": "The word \"mawdu'\" is close to \"made up\"."},{"he": "חדית' מוצ'וע הוא שקר שיוחס לנביא. הוא אינו חדית' כלל ואין לפעול לפיו.", "ar": "الموضوع كذب مختلق نُسب إلى النبي، وليس حديثًا في الحقيقة ولا يُعمل به.", "ru": "Маудуъ - ложь, приписанная Пророку. Это не хадис, и по нему не поступают.", "en": "A mawdu' hadith is a lie attributed to the Prophet. It is not a hadith at all and is not to be followed."},null),
],
[
  Q("isl-hadith-2-01",{"he": "מי היה אחד ממוריו של האימאם מאלכ?", "ar": "من كان من شيوخ الإمام مالك؟", "ru": "Кто был одним из учителей имама Малика?", "en": "Who was one of Imam Malik's teachers?"},[{"he": "אל-בוח'ארי, מחבר הצחיח", "ar": "البخاري صاحب الصحيح", "ru": "Аль-Бухари, автор «Сахиха»", "en": "Al-Bukhari, author of the Sahih"}, {"he": "אבו הוריירה, מן הסחאבה", "ar": "أبو هريرة من الصحابة", "ru": "Абу Хурайра, сподвижник Пророка", "en": "Abu Hurayra, a Companion of the Prophet"}, {"he": "אחמד בן חנבל, בעל ספר המוסנד", "ar": "أحمد بن حنبل صاحب المسند", "ru": "Ахмад ибн Ханбаль, автор «Муснада»", "en": "Ahmad ibn Hanbal, author of the Musnad"}, {"he": "נאפע', משוחרר של אבן עומר", "ar": "نافع مولى عبد الله بن عمر", "ru": "Нафиъ, вольноотпущенник Ибн Умара", "en": "Nafi', the freedman of Ibn Umar"}],3,{"he": "המורה צריך להיות חי לפני מאלכ.", "ar": "يجب أن يكون المعلم أقدم من مالك.", "ru": "Учитель должен был жить раньше Малика.", "en": "The teacher must have lived before Malik."},{"he": "מאלכ למד מנאפע' ומאבן שהאב אל-זוהרי ועוד. אל-בוח'ארי ואחמד חיו אחריו, ואבו הוריירה מת לפניו בהרבה.", "ar": "أخذ مالك عن نافع وابن شهاب الزهري وغيرهما. أما البخاري وأحمد فبعده، وأبو هريرة قبله بكثير.", "ru": "Малик учился у Нафиъ, аз-Зухри и других. Бухари и Ахмад жили позже, а Абу Хурайра гораздо раньше.", "en": "Malik studied with Nafi', al-Zuhri and others. Bukhari and Ahmad came after him; Abu Hurayra lived much earlier."},null),
  Q("isl-hadith-2-02",{"he": "מה מבדיל את \"אל-מועטא\" מספרי חדית' אחרים?", "ar": "بماذا يختلف «الموطأ» عن غيره من كتب الحديث؟", "ru": "Чем «аль-Муватта» отличается от других сборников хадисов?", "en": "How does \"al-Muwatta'\" differ from other hadith books?"},[{"he": "הוא מערב חדית'ים ופסקי הלכה לפי נושאים", "ar": "يجمع الأحاديث والأحكام الفقهية مرتبة على أبواب الفقه", "ru": "Объединяет хадисы и правовые решения по темам", "en": "It combines hadiths with legal rulings arranged by topics"}, {"he": "הוא אוסף שירה ערבית מתקופת הנביא", "ar": "هو ديوان شعر عربي من زمن النبي", "ru": "Это сборник арабской поэзии времён Пророка", "en": "It is a collection of Arabic poetry from the Prophet's time"}, {"he": "הוא ספר היסטוריה של מלחמות הח'ליפים", "ar": "هو كتاب تاريخ لحروب الخلفاء", "ru": "Это книга по истории войн халифов", "en": "It is a history book of the caliphs' wars"}, {"he": "הוא כתוב בלי מקורות ובלי שרשרת של מוסרים", "ar": "هو مكتوب بلا ذكر لمصادره ولا أسانيد لرواة أحاديثه", "ru": "Он написан без источников и без цепочек передатчиков", "en": "It is written with no sources and no chains of narrators"}],0,{"he": "שם הספר מרמז שהוא \"מוסדר ומוכן\" לפי נושאים.", "ar": "اسم الكتاب يوحي بأنه «مُمهَّد ومرتَّب».", "ru": "Название намекает, что он «упорядочен».", "en": "The title hints that it is \"smoothed and arranged\"."},{"he": "מאלכ סידר את הספר בפרקי הלכה, והביא בו חדית'ים, דברי הסחאבה והתאבעין ומנהג אנשי אל-מדינה.", "ar": "رتّب مالك كتابه على أبواب الفقه، وجمع فيه الأحاديث وأقوال الصحابة والتابعين وعمل أهل المدينة.", "ru": "Малик расположил книгу по главам фикха и включил хадисы, слова сподвижников, преемников и обычай мединцев.", "en": "Malik arranged it in chapters of law and included hadiths, sayings of Companions and Successors, and the practice of Medina."},null),
  Q("isl-hadith-2-03",{"he": "מדוע הדרך שבה סידר מאלכ את ספרו חשובה להלכה?", "ar": "لماذا يهم ترتيب مالك لكتابه الفقه؟", "ru": "Почему порядок книги Малика важен для права?", "en": "Why does Malik's arrangement of his book matter for law?"},[{"he": "כי הוא סידר את הספר לפי סדר האלף-בית של שמות המוסרים", "ar": "لأنه رتبه على الحروف الهجائية لأسماء الرواة", "ru": "Потому что он расположил материал по алфавиту имён передатчиков", "en": "Because it is arranged in alphabetical order by the names of the narrators"}, {"he": "כי אפשר למצוא חדית' ופסק על כל נושא באותו פרק", "ar": "لأنه يجد الباحث الحديث والحكم في الباب نفسه", "ru": "Потому что хадис и решение по теме находятся в одной главе", "en": "Because the hadith and the ruling on a topic are found in the same chapter"}, {"he": "כי אין בו פסקי הלכה, אלא חדית'ים בלבד", "ar": "لأنه لا أحكام فقهية فيه بل أحاديث فقط", "ru": "Потому что в нём нет правовых решений, только хадисы", "en": "Because it contains no legal rulings, only hadiths"}, {"he": "כי הוא קצר מאוד ואפשר לשנן אותו בשבוע", "ar": "لأنه قصير جدًا ويمكن حفظه في أسبوع", "ru": "Потому что он очень короткий и его можно выучить за неделю", "en": "Because it is very short and can be memorized in a week"}],1,{"he": "חשבו על \"נושא\" ולא על אותיות.", "ar": "فكّر في «الموضوع» لا في الحروف.", "ru": "Подумайте о «теме», а не о буквах.", "en": "Think of \"topic\", not letters."},{"he": "הסידור לפי ספרים ופרקים (טהרה, תפילה, זכאת, חג') מאפשר ללמוד את הדין והראיה יחד.", "ar": "الترتيب على الكتب والأبواب (الطهارة والصلاة والزكاة والحج) يتيح تعلم الحكم مع دليله.", "ru": "Расположение по книгам и главам (очищение, молитва, закят, хадж) позволяет изучать правило вместе с доводом.", "en": "Arranging by books and chapters (purity, prayer, zakat, hajj) lets one learn the ruling together with its evidence."},null),
  Q("isl-hadith-2-04",{"he": "איזה מאורע גרם לפילוג מדיני בקרב המוסלמים?", "ar": "أي حدث أدى إلى انقسام سياسي بين المسلمين؟", "ru": "Какое событие привело к политическому расколу мусульман?", "en": "Which event led to political division among the Muslims?"},[{"he": "בניית המסגד הראשון באל-מדינה, בימים הראשונים אחרי ההג'רה", "ar": "بناء أول مسجد في المدينة في الأيام الأولى بعد الهجرة", "ru": "Постройка первой мечети в Медине в первые дни после хиджры", "en": "The building of the first mosque in Medina in the first days after the hijra"}, {"he": "הצום הראשון של ראמדאן, שנקבע בשנה השנייה להג'רה", "ar": "أول صيام لرمضان الذي فُرض في السنة الثانية للهجرة", "ru": "Первый пост рамадана, предписанный во втором году хиджры", "en": "The first Ramadan fast, made obligatory in year 2 AH"}, {"he": "רצח עות'מאן והמלחמות שאחריו (אל-ג'מל וצפין)", "ar": "مقتل عثمان وما تلاه من الجمل وصفين", "ru": "Убийство Усмана и последовавшие войны (Верблюда и Сиффин)", "en": "The killing of Uthman and the wars after it (Jamal and Siffin)"}, {"he": "קרב בדר, שבו ניצחו המוסלמים בשנה השנייה להג'רה", "ar": "غزوة بدر التي انتصر فيها المسلمون في السنة الثانية للهجرة", "ru": "Битва при Бадре, в которой мусульмане победили во втором году хиджры", "en": "The Battle of Badr, which the Muslims won in year 2 AH"}],2,{"he": "זה קרה אחרי מות הנביא, בימי החליפים.", "ar": "حدث بعد وفاة النبي في عهد الخلفاء.", "ru": "Это было после смерти Пророка, при халифах.", "en": "It happened after the Prophet's death, in the caliphs' era."},{"he": "אחרי רצח עות'מאן נוצרו מפלגות (שיעה, ח'ואריג' ותומכי הבית האומאי). חלקם בדו חדית'ים כדי לחזק את דעתם.", "ar": "بعد مقتل عثمان نشأت أحزاب (الشيعة والخوارج وأنصار بني أمية)، ووضع بعضهم أحاديث لتقوية رأيه.", "ru": "После убийства Усмана возникли партии (шииты, хариджиты, сторонники Омейядов). Некоторые сочиняли хадисы в поддержку своих взглядов.", "en": "After Uthman's killing, parties arose (Shia, Kharijites, Umayyad supporters). Some invented hadiths to support their views."},null),
  Q("isl-hadith-2-05",{"he": "איזו סיבה הובילה לבדיית חדית'ים?", "ar": "أي سبب أدى إلى وضع الأحاديث؟", "ru": "Какая причина вела к сочинению хадисов?", "en": "Which reason led to hadith fabrication?"},[{"he": "אהבה לאמת ורצון למסור בדיוק את דברי הנביא", "ar": "حب الصدق والحرص على نقل كلام النبي بدقة", "ru": "Любовь к правде и желание точно передать слова Пророка", "en": "Love of truth and a wish to pass on the Prophet’s words exactly"}, {"he": "לימוד קפדני של שרשרת המוסרים ובדיקת כל שם שבה", "ar": "التدقيق في سلسلة الرواة وفحص كل اسم فيها", "ru": "Тщательное изучение цепочки передатчиков и проверка каждого имени", "en": "Careful study of the chain of narrators and checking every name in it"}, {"he": "שינון מדויק של החדית' מילה במילה, בלי לשנות דבר", "ar": "حفظ الحديث كلمة بكلمة من غير تغيير", "ru": "Точное заучивание хадиса слово в слово, без изменений", "en": "Memorizing the hadith word for word without changing anything"}, {"he": "רצון לזכות בחסד שליטים או לחזק מפלגה", "ar": "التقرب من الحكام أو نصرة فرقة", "ru": "Желание угодить правителям или поддержать свою партию", "en": "Wanting favour with rulers or supporting a party"}],3,{"he": "הסיבה אינה קשורה לדיוק או לאמת.", "ar": "السبب لا يتعلق بالدقة أو الصدق.", "ru": "Причина не связана с точностью или правдой.", "en": "The reason has nothing to do with accuracy or truth."},{"he": "בין הסיבות: מפלגות, חנופה לשליטים, מספרי סיפורים, אנשים \"אדוקים\" שבדו לעידוד ואויבי האיסלאם. כולן אסורות.", "ar": "من الأسباب: الفرق السياسية والتقرب من الحكام والقصّاص وبعض الزهّاد ومحاولات الزنادقة. وكلها محرّمة.", "ru": "Среди причин: партии, угождение правителям, рассказчики, «набожные», желавшие поощрить людей, и враги ислама. Всё это запрещено.", "en": "Reasons include parties, flattering rulers, storytellers, \"pious\" people wanting to encourage, and enemies of Islam. All are forbidden."},null),
  Q("isl-hadith-2-06",{"he": "מה דינו של מי שמבדה חדית' ומייחס אותו לנביא?", "ar": "ما حكم من يختلق حديثًا وينسبه إلى النبي؟", "ru": "Каково положение того, кто сочиняет хадис и приписывает его Пророку?", "en": "What is the ruling on someone who invents a hadith and attributes it to the Prophet?"},[{"he": "אסור, והוא מן החטאים הגדולים", "ar": "حرام، وهو من كبائر الذنوب", "ru": "Запрещено, это великий грех", "en": "It is forbidden and a major sin"}, {"he": "מותר אם הכוונה טובה", "ar": "جائز إذا كانت النية حسنة", "ru": "Разрешено, если намерение доброе", "en": "Permitted if the intention is good"}, {"he": "מצווה, אם החדית' מעודד למעשים טובים", "ar": "مستحب إذا كان الحديث يحث على الخير", "ru": "Желательно, если хадис побуждает к добру", "en": "Recommended, if the hadith urges people to good"}, {"he": "אין בכך איסור, כי הכוונה נמדדת ולא הנוסח", "ar": "لا حرج فيه، فالعبرة بالنية لا باللفظ", "ru": "В этом нет запрета, ведь важно намерение, а не слова", "en": "There is no prohibition, since intention counts, not wording"}],0,{"he": "יש חדית' מפורסם על \"המקום באש\".", "ar": "هناك حديث مشهور عن «مقعده من النار».", "ru": "Есть известный хадис о «месте в огне».", "en": "A famous hadith speaks of \"his seat in the Fire\"."},{"he": "אהל אל-סונה אוסרים בדיית חדית'. הנביא אמר: \"מי שמשקר עליי בכוונה, שיכין את מקומו באש\".", "ar": "أهل السنة على تحريم الوضع. قال النبي ﷺ: «من كذب عليّ متعمدًا فليتبوأ مقعده من النار».", "ru": "Ахль ас-сунна запрещают сочинение хадисов. Пророк сказал: «Кто намеренно солжёт на меня, пусть займёт своё место в огне».", "en": "The Sunni scholars forbid fabrication. The Prophet said: \"Whoever lies about me on purpose, let him take his seat in the Fire\"."},null),
],
[
  Q("isl-hadith-3-01",{"he": "איזה מדע בודק את אמינות מוסרי החדית'?", "ar": "أي علم يبحث في عدالة الرواة وضبطهم؟", "ru": "Какая наука изучает надёжность передатчиков хадисов?", "en": "Which science examines the reliability of hadith narrators?"},[{"he": "אל-ג'רח ואל-תעדיל", "ar": "الجرح والتعديل", "ru": "Аль-джарх ва ат-таъдиль", "en": "Al-jarh wa al-ta'dil"}, {"he": "אל-נחו (דקדוק)", "ar": "النحو (قواعد العربية)", "ru": "Ан-нахв, грамматика арабского", "en": "Nahw, Arabic grammar"}, {"he": "אל-חסאב, מדע החשבון", "ar": "الحساب، علم الأرقام", "ru": "Аль-хисаб, наука о числах", "en": "Al-hisab, the science of numbers"}, {"he": "אל-ג'ע'ראפיה, מדע הארצות", "ar": "الجغرافيا، علم البلدان", "ru": "Аль-джуграфия, наука о странах", "en": "Al-jughrafiya, the science of lands"}],0,{"he": "המדע בוחן אם אדם \"נאמן\" או \"חלש\".", "ar": "هذا العلم يحكم على الراوي بالتوثيق أو التجريح.", "ru": "Эта наука оценивает передатчика как надёжного или слабого.", "en": "This science judges a narrator as trustworthy or weak."},{"he": "אל-ג'רח ואל-תעדיל בודק את אמינות המוסרים, ובכך עוזר להפריד בין חדית' נכון למבודה.", "ar": "علم الجرح والتعديل يميّز الرواة الثقات من الضعفاء ويُفرّق بين الصحيح والموضوع.", "ru": "Наука аль-джарх ва ат-таъдиль различает надёжных и слабых передатчиков и отделяет достоверное от выдуманного.", "en": "Al-jarh wa al-ta'dil separates trustworthy narrators from weak ones and distinguishes the sound from the fabricated."},null),
  Q("isl-hadith-3-02",{"he": "מהו \"אסנאד\" ומהו \"מתן\"?", "ar": "ما هو «الإسناد» وما هو «المتن»؟", "ru": "Что такое «иснад» и что такое «матн»?", "en": "What are \"isnad\" and \"matn\"?"},[{"he": "אסנאד הוא נוסח הדברים, ומתן הוא שרשרת המוסרים", "ar": "الإسناد نص الكلام والمتن سلسلة الرواة", "ru": "Иснад - текст слов, матн - цепочка передатчиков", "en": "Isnad is the text of the words, matn is the chain of narrators"}, {"he": "אסנאד הוא שרשרת המוסרים, ומתן הוא נוסח הדברים", "ar": "الإسناد سلسلة الرواة والمتن نص الكلام", "ru": "Иснад - цепочка передатчиков, матн - текст слов", "en": "Isnad is the chain of narrators, matn is the text"}, {"he": "שניהם שמות של ספרי חדית' מפורסמים", "ar": "كلاهما اسم كتاب من كتب الحديث المشهورة", "ru": "Оба - названия известных сборников хадисов", "en": "Both are names of well-known hadith books"}, {"he": "שניהם שמות של סורות שבקוראן", "ar": "كلاهما اسم سورة من سور القرآن", "ru": "Оба - названия сур из Корана", "en": "Both are names of surahs in the Quran"}],1,{"he": "אחד \"נשען\" על מי שמסר, והשני הוא \"גוף\" הדברים.", "ar": "أحدهما «سند» من نقل والآخر «جسم» الكلام.", "ru": "Один - «опора» передавших, другой - «тело» слов.", "en": "One \"leans on\" those who passed it on, the other is the \"body\" of the words."},{"he": "בחדית' כותבים: \"סיפר לי פלוני מפלוני... שהנביא אמר...\". הרשימה היא האסנאד, והדברים הם המתן.", "ar": "في الحديث: «حدثنا فلان عن فلان… أن النبي قال…». سلسلة الرواة هي الإسناد والكلام هو المتن.", "ru": "В хадисе: «Рассказал нам такой-то от такого-то... что Пророк сказал...». Цепочка - иснад, слова - матн.", "en": "A hadith says: \"So-and-so told us from so-and-so... that the Prophet said...\". The chain is the isnad, the words are the matn."},null),
  Q("isl-hadith-3-03",{"he": "למה גדלה חשיבות האסנאד אחרי הפילוג והבדייה?", "ar": "لماذا ازدادت أهمية الإسناد بعد الفتنة وظهور الوضع؟", "ru": "Почему иснад стал важнее после раскола и появления выдумок?", "en": "Why did the isnad become more important after the division and fabrication?"},[{"he": "כדי להאריך את ספרי החדית' ולהראות שהמחבר אסף הרבה חומר", "ar": "لإطالة كتب الحديث وإظهار أن المؤلف جمع مادة كثيرة", "ru": "Чтобы удлинить книги хадисов и показать, что автор собрал много материала", "en": "To lengthen the hadith books and show the author had gathered a lot"}, {"he": "כדי לשנות את נוסח הקוראן ולהתאים אותו לדעות המפלגות", "ar": "لتغيير نص القرآن وموافقته لآراء الفرق", "ru": "Чтобы изменить текст Корана и подогнать его под мнения групп", "en": "To change the Quran's text and fit it to the parties' views"}, {"he": "כדי לבדוק מי מסר את הדברים ולהבדיל נכון ממבודה", "ar": "ليُعرف من نقل الحديث فيُميَّز الصحيح من المكذوب", "ru": "Чтобы знать, кто передал, и отличить подлинное от выдуманного", "en": "To know who passed it on and tell the sound from the fabricated"}, {"he": "כדי להפסיק את לימוד החדית' ולהשאיר ללומדים את הקוראן בלבד", "ar": "لإيقاف دراسة الحديث والاكتفاء بالقرآن وحده", "ru": "Чтобы прекратить изучение хадисов и оставить учащимся только Коран", "en": "To stop the study of hadith and leave learners with the Quran alone"}],2,{"he": "השאלה: איך יודעים מי אמר?", "ar": "السؤال: كيف نعرف من نقل؟", "ru": "Вопрос: как узнать, кто передал?", "en": "The question: how do we know who passed it on?"},{"he": "אחרי הפילוג ביקשו להכיר כל מוסר. כך נולד הכלל: \"האסנאד מן הדת\", ודרשו שרשרת ברורה לכל חדית'.", "ar": "بعد الفتنة صاروا يسألون عن الرواة، فصار الإسناد من الدين، وطُلبت سلسلة واضحة لكل حديث.", "ru": "После раздора стали выяснять передатчиков. Так иснад стал частью религиозной науки, и для каждого хадиса требовали ясную цепочку.", "en": "After the fitna people began asking who narrated. So the isnad became part of the religion's science, and a clear chain was required."},null),
  Q("isl-hadith-3-04",{"he": "איזה תנאי נחוץ כדי שחדית' יהיה צחיח (נכון)?", "ar": "أي شرط من شروط الحديث الصحيح؟", "ru": "Какое условие нужно для достоверного (сахих) хадиса?", "en": "Which is a condition for a sound (sahih) hadith?"},[{"he": "שיהיה בשרשרת מוסר אחד לפחות שאינו ידוע לחכמים", "ar": "أن يكون في السند راوٍ واحد على الأقل مجهول عند العلماء", "ru": "Чтобы в цепочке был хотя бы один передатчик, неизвестный учёным", "en": "That the chain have at least one narrator unknown to the scholars"}, {"he": "שתהיה בשרשרת המוסרים הפסקה, ושם אחד או יותר חסר", "ar": "أن يكون في سلسلة الرواة انقطاع ويسقط منها اسم أو أكثر", "ru": "Чтобы в цепочке передатчиков был разрыв и выпало имя или больше", "en": "That the chain of narrators be broken, with one name or more missing"}, {"he": "שהחדית' יהיה ארוך, שכן האורך מעיד על אמינותו", "ar": "أن يكون الحديث طويلًا، فالطول دليل على صحته", "ru": "Чтобы хадис был длинным, ведь длина указывает на достоверность", "en": "That the hadith be long, since length shows it is sound"}, {"he": "מוסרים נאמנים וזכרונם מדויק, ושרשרת רצופה", "ar": "رواة عدول ضابطون وسند متصل", "ru": "Надёжные и точные передатчики и непрерывная цепочка", "en": "Upright, precise narrators and a connected chain"}],3,{"he": "חשבו על נאמנות ועל רצף.", "ar": "فكّر في العدالة والاتصال.", "ru": "Подумайте о честности и непрерывности.", "en": "Think of integrity and continuity."},{"he": "התנאים: צדק המוסרים, דיוק זיכרונם, רצף השרשרת, ושאין בחדית' חריגה וגם לא פגם נסתר.", "ar": "الشروط: عدالة الرواة وضبطهم واتصال السند وسلامة الحديث من الشذوذ والعلة.", "ru": "Условия: честность и точность передатчиков, непрерывность цепочки и отсутствие отклонения (шузуз) и скрытого изъяна.", "en": "Conditions: upright and precise narrators, a connected chain, and no irregularity or hidden defect."},null),
  Q("isl-hadith-3-05",{"he": "מה פירוש חדית' \"מותוואתר\"?", "ar": "ما معنى الحديث «المتواتر»؟", "ru": "Что значит «мутаватир» хадис?", "en": "What does a \"mutawatir\" hadith mean?"},[{"he": "הרבה אנשים בכל דור מסרו אותו, עד שאי אפשר שהסכימו לשקר", "ar": "رواه جمع كثير في كل طبقة يستحيل تواطؤهم على الكذب", "ru": "Его передавало столько людей в каждом поколении, что сговор невозможен", "en": "So many narrated it in every generation that collusion on a lie is impossible"}, {"he": "רק אדם אחד מסר אותו בכל דור, ולכן אי אפשר לדעת אם הוא נכון", "ar": "رواه راوٍ واحد في كل طبقة، فلا يُعرف أصحيح هو أم لا", "ru": "Его передавал один человек в каждом поколении, поэтому неизвестно, верен ли он", "en": "Only one person narrated it in each generation, so it cannot be known to be sound"}, {"he": "הוא נכתב בשירה ערבית מחורזת, כדי שיהיה קל לשנן אותו בעל פה", "ar": "كُتب شعرًا عربيًا موزونًا ليسهل حفظه عن ظهر قلب", "ru": "Он записан рифмованными арабскими стихами, чтобы его легче было заучить", "en": "It was written in rhymed Arabic verse so it would be easy to memorize"}, {"he": "הוא אינו מופיע בשום ספר חדית', ונמסר רק בעל פה בתוך המשפחה", "ar": "لا يوجد في أي كتاب حديث، وإنما يُنقل مشافهة داخل الأسرة", "ru": "Его нет ни в одной книге хадисов, он передаётся только устно в семье", "en": "It appears in no hadith book and is passed on only orally within the family"}],0,{"he": "המילה קשורה ל\"רבים ורצופים\".", "ar": "الكلمة تدل على «كثرة وتتابع».", "ru": "Слово связано с «многочисленные и подряд».", "en": "The word suggests \"many and in succession\"."},{"he": "מותוואתר הוא חדית' שמסרו אותו רבים בכל שכבה, ולכן הוא ודאי. למשל: \"מי שמשקר עליי בכוונה...\".", "ar": "المتواتر ما رواه جمع كبير في كل طبقة فيفيد اليقين، ومنه «من كذب علي متعمدا…».", "ru": "Мутаватир - хадис, переданный многими в каждом поколении, поэтому он достоверен. Например: «Кто намеренно солжёт на меня...».", "en": "A mutawatir hadith is narrated by many in every generation, so it is certain. For example: \"Whoever lies about me on purpose...\"."},null),
  Q("isl-hadith-3-06",{"he": "איזה תואר ניתן לאימאם מאלכ בהיסטוריה של ההלכה?", "ar": "ما مكانة الإمام مالك في تاريخ الفقه؟", "ru": "Какое место имеет имам Малик в истории права?", "en": "What is Imam Malik's place in the history of Islamic law?"},[{"he": "מייסד האסכולה השיעית, שהלכו לפיה תושבי עיראק", "ar": "مؤسس المذهب الشيعي الذي اتبعه أهل العراق", "ru": "Основатель шиитской школы, за которой пошли жители Ирака", "en": "Founder of the Shia school, which the people of Iraq followed"}, {"he": "מייסד האסכולה המאלכית, אחת מארבע האסכולות", "ar": "إمام المذهب المالكي أحد المذاهب الأربعة", "ru": "Основатель маликитского мазхаба, одной из четырёх школ", "en": "Founder of the Maliki school, one of the four schools"}, {"he": "הח'ליפה הראשון שעמד בראש המוסלמים אחרי מות הנביא", "ar": "الخليفة الأول الذي قاد المسلمين بعد وفاة النبي", "ru": "Первый халиф, возглавивший мусульман после смерти Пророка", "en": "The first caliph, who led the Muslims after the Prophet's death"}, {"he": "מחבר ספר סירת הנביא, שבו סופרו חייו מלידתו עד מותו", "ar": "مؤلف كتاب سيرة النبي الذي روى حياته من مولده إلى وفاته", "ru": "Автор книги о жизни Пророка от рождения до смерти", "en": "Author of the Prophet's biography, telling his life from birth to death"}],1,{"he": "אחד משמות ארבע האסכולות הסוניות מופיע בשמו.", "ar": "اسم أحد المذاهب السنية الأربعة منسوب إليه.", "ru": "Название одного из четырёх суннитских мазхабов происходит от его имени.", "en": "One of the four Sunni schools bears his name."},{"he": "ארבע האסכולות הסוניות: חנפית, מאלכית, שאפעית וחנבלית. המאלכית נקראת על שם מאלכ בן אנס.", "ar": "المذاهب السنية الأربعة: الحنفي والمالكي والشافعي والحنبلي، والمالكي نسبة إلى مالك بن أنس.", "ru": "Четыре суннитских мазхаба: ханафитский, маликитский, шафиитский и ханбалитский. Маликитский назван по Малику ибн Анасу.", "en": "The four Sunni schools are Hanafi, Maliki, Shafi'i and Hanbali. The Maliki school is named after Malik ibn Anas."},null),
],
]);

topic("isl-aqeeda","faith",{"he": "האמונה: ספרי אללה ושמותיו", "ar": "العقيدة: كتب الله وأسماؤه وصفاته", "ru": "Вероубеждение: книги и имена Аллаха", "en": "Creed: the books of Allah and His names"},{"he": "שישה עיקרי אמונה, הספרים הקדושים, שמות אללה ותכונותיו", "ar": "أركان الإيمان الستة والكتب السماوية وأسماء الله وصفاته", "ru": "Шесть столпов веры, священные книги, имена и качества Аллаха", "en": "The six pillars of faith, the revealed books, and the names and attributes of Allah"}, [
[
  Q("isl-aqeeda-1-01",{"he": "כמה עיקרי אמונה (אראכאן אל-איימאן) יש?", "ar": "كم عدد أركان الإيمان؟", "ru": "Сколько столпов веры (аркан аль-иман)?", "en": "How many pillars of faith (arkan al-iman) are there?"},[{"he": "חמישה", "ar": "خمسة", "ru": "Пять", "en": "Five"}, {"he": "שבעה", "ar": "سبعة", "ru": "Семь", "en": "Seven"}, {"he": "שישה", "ar": "ستة", "ru": "Шесть", "en": "Six"}, {"he": "ארבעה", "ar": "أربعة", "ru": "Четыре", "en": "Four"}],2,{"he": "אל תבלבלו עם חמשת עמודי האיסלאם.", "ar": "لا تخلط مع أركان الإسلام الخمسة.", "ru": "Не путайте с пятью столпами ислама.", "en": "Do not confuse with the five pillars of Islam."},{"he": "עיקרי האמונה הם שישה: אללה, המלאכים, הספרים, השליחים, יום הדין והקדר (טוב ורע).", "ar": "أركان الإيمان ستة: الله والملائكة والكتب والرسل واليوم الآخر والقدر خيره وشره.", "ru": "Столпов веры шесть: Аллах, ангелы, книги, посланники, Судный день и предопределение (добро и зло).", "en": "There are six pillars of faith: Allah, angels, books, messengers, the Last Day, and destiny (good and bad)."},null),
  Q("isl-aqeeda-1-02",{"he": "על איזה נביא ירדה התורה (אל-תוראה)?", "ar": "على أي نبي أُنزلت التوراة؟", "ru": "На какого пророка была ниспослана Тора (ат-Таурат)?", "en": "On which prophet was the Torah (al-Tawrat) revealed?"},[{"he": "עיסא (ישוע)", "ar": "عيسى", "ru": "Иса (Иисус)", "en": "Isa (Jesus)"}, {"he": "דאוד (דוד)", "ar": "داود", "ru": "Дауд (Давид)", "en": "Dawud (David)"}, {"he": "מוחמד", "ar": "محمد", "ru": "Мухаммад", "en": "Muhammad"}, {"he": "מוסא (משה)", "ar": "موسى", "ru": "Муса (Моисей)", "en": "Musa (Moses)"}],3,{"he": "הנביא הזה דיבר אל אללה על הר.", "ar": "هذا النبي كلّمه الله على الجبل.", "ru": "Этот пророк говорил с Аллахом на горе.", "en": "This prophet was spoken to by Allah on the mountain."},{"he": "התורה ירדה על מוסא (משה) עליו השלום, לבני ישראל.", "ar": "أُنزلت التوراة على موسى عليه السلام لبني إسرائيل.", "ru": "Тора была ниспослана Мусе (мир ему) для сынов Исраила.", "en": "The Torah was revealed to Musa (Moses), peace be upon him, for the Children of Israel."},null),
  Q("isl-aqeeda-1-03",{"he": "על איזה נביא ירדה הבשורה (אל-אנג'יל)?", "ar": "على أي نبي أُنزل الإنجيل؟", "ru": "На какого пророка был ниспослан Инджиль?", "en": "On which prophet was the Injil (Gospel) revealed?"},[{"he": "עיסא (ישוע)", "ar": "عيسى", "ru": "Иса (Иисус)", "en": "Isa (Jesus)"}, {"he": "מוסא (משה)", "ar": "موسى", "ru": "Муса (Моисей)", "en": "Musa (Moses)"}, {"he": "יוסוף (יוסף)", "ar": "يوسف", "ru": "Юсуф (Иосиф)", "en": "Yusuf (Joseph)"}, {"he": "נוח", "ar": "نوح", "ru": "Нух (Ноах)", "en": "Nuh (Noah)"}],0,{"he": "הוא נולד למרים בלי אב.", "ar": "وُلد من مريم بلا أب.", "ru": "Он родился у Марьям без отца.", "en": "He was born of Maryam without a father."},{"he": "האנג'יל ירד על עיסא בן מרים, עליו השלום.", "ar": "أُنزل الإنجيل على عيسى بن مريم عليه السلام.", "ru": "Инджиль был ниспослан Исе, сыну Марьям (мир ему).", "en": "The Injil was revealed to Isa, son of Maryam, peace be upon him."},null),
  Q("isl-aqeeda-1-04",{"he": "על מי ירד הזבור?", "ar": "على من أُنزل الزبور؟", "ru": "На кого был ниспослан Забур?", "en": "On whom was the Zabur revealed?"},[{"he": "סולימאן", "ar": "سليمان", "ru": "Сулейман (Соломон)", "en": "Sulayman (Solomon)"}, {"he": "דאוד (דוד)", "ar": "داود", "ru": "Дауд (Давид)", "en": "Dawud (David)"}, {"he": "אברהים", "ar": "إبراهيم", "ru": "Ибрахим (Авраам)", "en": "Ibrahim (Abraham)"}, {"he": "יחיא", "ar": "يحيى", "ru": "Яхья (Иоанн)", "en": "Yahya (John)"}],1,{"he": "הנביא הזה היה גם מלך, והזבור הוא מזמורים.", "ar": "كان هذا النبي ملكًا أيضًا، والزبور مزامير.", "ru": "Этот пророк был и царём, а Забур - псалмы.", "en": "This prophet was also a king, and the Zabur is psalms."},{"he": "הזבור ירד על דאוד, עליו השלום. בקוראן נאמר: \"ולדאוד נתנו זבור\".", "ar": "أُنزل الزبور على داود عليه السلام، قال تعالى: ﴿وَآتَيْنَا دَاوُودَ زَبُورًا﴾.", "ru": "Забур был ниспослан Дауду (мир ему). В Коране: «И Мы даровали Дауду Забур».", "en": "The Zabur was revealed to Dawud, peace be upon him. The Quran says: \"And We gave Dawud the Zabur\"."},null),
  Q("isl-aqeeda-1-05",{"he": "כמה שמות יפים לאללה מוזכרים בחדית' המפורסם?", "ar": "كم عدد أسماء الله الحسنى في الحديث المشهور؟", "ru": "Сколько прекрасных имён Аллаха названо в известном хадисе?", "en": "How many beautiful names of Allah are mentioned in the famous hadith?"},[{"he": "מאה ועשרה", "ar": "مئة وعشرة", "ru": "Сто десять", "en": "One hundred and ten"}, {"he": "שבעים", "ar": "سبعون", "ru": "Семьдесят", "en": "Seventy"}, {"he": "תשעים ותשעה", "ar": "تسعة وتسعون", "ru": "Девяносто девять", "en": "Ninety-nine"}, {"he": "תשעה", "ar": "تسعة", "ru": "Девять", "en": "Nine"}],2,{"he": "זה \"מאה פחות אחד\".", "ar": "هو «مئة إلا واحدًا».", "ru": "Это «сто без одного».", "en": "It is \"one hundred minus one\"."},{"he": "נאמר בחדית': \"לאללה תשעים ותשעה שמות, מאה פחות אחד. מי שמונה אותם נכנס לגן עדן\" (אל-בוח'ארי ומוסלם).", "ar": "في الحديث: «إن لله تسعة وتسعين اسمًا، مئة إلا واحدًا، من أحصاها دخل الجنة» (البخاري ومسلم).", "ru": "В хадисе: «У Аллаха девяносто девять имён, сто без одного; кто их сохранит, войдёт в рай» (аль-Бухари и Муслим).", "en": "The hadith says: \"Allah has ninety-nine names, one hundred minus one; whoever preserves them enters Paradise\" (al-Bukhari and Muslim)."},null),
  Q("isl-aqeeda-1-06",{"he": "איזה שם מהבאים הוא משמות אללה?", "ar": "أي اسم مما يأتي من أسماء الله الحسنى؟", "ru": "Какое из этих имён - одно из имён Аллаха?", "en": "Which of these is one of Allah's names?"},[{"he": "אל-אינסאן (האדם)", "ar": "الإنسان", "ru": "Аль-Инсан (Человек)", "en": "Al-Insan (the human being)"}, {"he": "אל-מוג'אהד (הלוחם)", "ar": "المجاهد", "ru": "Аль-Муджахид (Борец)", "en": "Al-Mujahid (the fighter)"}, {"he": "מלך אדם", "ar": "ملك آدم", "ru": "Малик Адама", "en": "The king of Adam"}, {"he": "אר-רחמאן (הרחום)", "ar": "الرحمن", "ru": "Ар-Рахман (Милостивый)", "en": "Ar-Rahman (the Most Merciful)"}],3,{"he": "הוא מופיע בתחילת \"בסמלה\".", "ar": "يرد في «البسملة».", "ru": "Он встречается в «басмале».", "en": "It appears in the \"basmala\"."},{"he": "אר-רחמאן הוא אחד מהשמות היפים ומופיע בבסמלה: \"בשם אללה הרחמן הרחום\".", "ar": "الرحمن من الأسماء الحسنى ويرد في البسملة: «بسم الله الرحمن الرحيم».", "ru": "Ар-Рахман - одно из прекрасных имён и звучит в басмале: «Во имя Аллаха, Милостивого, Милосердного».", "en": "Ar-Rahman is one of the beautiful names and appears in the basmala: \"In the name of Allah, the Most Merciful, the Especially Merciful\"."},null),
],
[
  Q("isl-aqeeda-2-01",{"he": "מהו הסדר הנכון לירידת הספרים?", "ar": "ما الترتيب الصحيح لنزول الكتب السماوية؟", "ru": "Каков правильный порядок ниспослания книг?", "en": "What is the correct order in which the books were revealed?"},[{"he": "הקוראן, התורה, הזבור, הבשורה", "ar": "القرآن ثم التوراة ثم الزبور ثم الإنجيل", "ru": "Коран, Тора, Забур, Инджиль", "en": "Quran, Torah, Zabur, Injil"}, {"he": "הבשורה, התורה, הקוראן, הזבור", "ar": "الإنجيل ثم التوراة ثم القرآن ثم الزبور", "ru": "Инджиль, Тора, Коран, Забур", "en": "Injil, Torah, Quran, Zabur"}, {"he": "הזבור, הבשורה, התורה, הקוראן", "ar": "الزبور ثم الإنجيل ثم التوراة ثم القرآن", "ru": "Забур, Инджиль, Тора, Коран", "en": "Zabur, Injil, Torah, Quran"}, {"he": "התורה, הזבור, הבשורה, הקוראן", "ar": "التوراة ثم الزبور ثم الإنجيل ثم القرآن", "ru": "Тора, Забур, Инджиль, Коран", "en": "Torah, Zabur, Injil, Quran"}],3,{"he": "הקוראן האחרון, ומוסא קדם לעיסא.", "ar": "القرآن آخرها، وموسى قبل عيسى.", "ru": "Коран последний, а Муса раньше Исы.", "en": "The Quran is last, and Musa came before Isa."},{"he": "לפי סדר הזמן: התורה (מוסא), הזבור (דאוד), הבשורה (עיסא) והקוראן (מוחמד (עליו השלום)), החותם.", "ar": "الترتيب الزمني: التوراة لموسى فالزبور لداود فالإنجيل لعيسى فالقرآن لمحمد ﷺ خاتمها.", "ru": "По времени: Тора (Муса), Забур (Дауд), Инджиль (Иса) и Коран (Мухаммад (мир ему)), завершающий.", "en": "In time order: the Torah (Musa), the Zabur (Dawud), the Injil (Isa), then the Quran (Muhammad (peace be upon him)), the final one."},null),
  Q("isl-aqeeda-2-02",{"he": "על מי ירדו \"סוחוף\" (דפים) שהוזכרו בקוראן?", "ar": "على من أُنزلت «الصحف» المذكورة في القرآن؟", "ru": "На кого были ниспосланы «свитки» (сухуф), упомянутые в Коране?", "en": "On whom were the \"suhuf\" (scrolls) mentioned in the Quran revealed?"},[{"he": "אברהים ומוסא", "ar": "إبراهيم وموسى", "ru": "Ибрахима и Мусы", "en": "Ibrahim and Musa"}, {"he": "נוח ויוסף", "ar": "نوح ويوسف", "ru": "Нуха и Юсуфа", "en": "Nuh and Yusuf"}, {"he": "עיסא ומרים", "ar": "عيسى ومريم", "ru": "Исы и Марьям", "en": "Isa and Maryam"}, {"he": "מוחמד ועלי", "ar": "محمد وعلي", "ru": "Мухаммада и Али", "en": "Muhammad and Ali"}],0,{"he": "זה כתוב בסורת אל-אעלא ובסורת אן-נג'ם.", "ar": "ذُكر في سورتي الأعلى والنجم.", "ru": "Об этом в сурах аль-А'ля и ан-Наджм.", "en": "It is in surahs al-A'la and an-Najm."},{"he": "בסורת אל-אעלא נאמר: \"בדפי אברהים ומוסא\". הם נחשבים לספרי הנביאים הללו.", "ar": "في سورة الأعلى: ﴿صُحُفِ إِبْرَاهِيمَ وَمُوسَى﴾، وهي كتب هذين النبيين.", "ru": "В суре аль-А'ля: «свитки Ибрахима и Мусы». Это книги этих пророков.", "en": "Surat al-A'la says: \"the scrolls of Ibrahim and Musa\". These are those prophets' books."},null),
  Q("isl-aqeeda-2-03",{"he": "מה מקומו של הקוראן ביחס לספרים שלפניו לפי אל-מאאידה 48?", "ar": "ما منزلة القرآن بين الكتب السابقة وفق المائدة 48؟", "ru": "Каково положение Корана по отношению к прежним книгам (аль-Маида, 48)?", "en": "What is the Quran's position relative to earlier books, according to al-Ma'ida 48?"},[{"he": "מבטל את כל מה שבספרים הקודמים ואוסר לקרוא בהם", "ar": "يُلغي كل ما في الكتب السابقة ويمنع قراءتها", "ru": "Отменяет всё, что в прежних книгах, и запрещает их читать", "en": "It cancels everything in the earlier books and forbids reading them"}, {"he": "מאשר מה שנכון בהם ושומר עליהם (מוהימין)", "ar": "مصدّق لما بين يديه ومهيمن عليه", "ru": "Подтверждает истинное в них и является хранителем (мухаймин)", "en": "It confirms what is true in them and is a guardian (muhaymin) over them"}, {"he": "שווה להם בכל דבר, ואין בינו לבינם שום הבדל", "ar": "مساوٍ لها في كل شيء ولا فرق بينه وبينها", "ru": "Во всём равен им, и нет между ними никакой разницы", "en": "Equal to them in every way, with no difference between them"}, {"he": "קודם להם בזמן, שהרי הוא ירד לפני התורה ולפני הבשורה", "ar": "أقدم منها زمنًا، فقد نزل قبل التوراة والإنجيل", "ru": "Старше их по времени: он был ниспослан до Торы и Евангелия", "en": "Earlier than them in time, revealed before the Torah and the Gospel"}],1,{"he": "המילה \"מהימין\" באה מ\"שמירה ופיקוח\".", "ar": "«مهيمن» من الحفظ والرقابة.", "ru": "«Мухаймин» - от «охраны и надзора».", "en": "\"Muhaymin\" comes from guarding and supervising."},{"he": "הקוראן מאשר את האמת שבספרים הקודמים, ושופט עליהם, ולכן הוא \"מוהימין\".", "ar": "القرآن يصدّق ما في الكتب السابقة من الحق ويحكم عليها، فهو «مهيمن».", "ru": "Коран подтверждает истину прежних книг и судит о них, поэтому он «мухаймин».", "en": "The Quran confirms the truth in earlier books and judges over them, so it is \"muhaymin\"."},null),
  Q("isl-aqeeda-2-04",{"he": "איזו הוכחה שכלית מראה שהקוראן הוא דבר אללה?", "ar": "أي دليل عقلي على أن القرآن كلام الله؟", "ru": "Какой разумный довод показывает, что Коран - слово Аллаха?", "en": "Which rational proof shows that the Quran is the word of Allah?"},[{"he": "הוא כתוב בכתב יפה ובצבעים, ולכן אנשים אוהבים אותו", "ar": "مكتوب بخط جميل وبألوان، ولذلك يحبه الناس", "ru": "Он написан красивым почерком и красками, поэтому его любят", "en": "It is written in beautiful script and colours, so people love it"}, {"he": "הוא נכתב בידי חכמי מכה, שישבו יחד וחיברו אותו", "ar": "ألّفه علماء مكة الذين اجتمعوا وكتبوه", "ru": "Его написали учёные Мекки, которые собрались и составили его", "en": "It was written by Makkah’s scholars, who sat together and composed it"}, {"he": "אין בו סתירות אף שירד על פני שנים רבות", "ar": "خلوّه من التناقض مع نزوله على مدى سنين", "ru": "В нём нет противоречий, хотя он ниспосылался много лет", "en": "It has no contradictions although it came down over many years"}, {"he": "הוא פורסם בעיתון, וכך ידעו עליו אנשים רבים", "ar": "نُشر في صحيفة فعرفه كثير من الناس", "ru": "Он напечатан в газете, и так о нём узнали многие", "en": "It was published in a newspaper, and so many came to know it"}],2,{"he": "אל-נסאא 82 מדבר על \"סתירה\".", "ar": "النساء 82 تتحدث عن «الاختلاف».", "ru": "Ан-Ниса, 82 говорит о «несогласованности».", "en": "An-Nisa 82 talks about \"discrepancy\"."},{"he": "בסורת אן-נסאא 82 נאמר שאילו היה מאחר אללה היו בו סתירות רבות. מוחמד היה אומי, וזה עוד סימן.", "ar": "في النساء 82: ﴿وَلَوْ كَانَ مِنْ عِنْدِ غَيْرِ اللَّهِ لَوَجَدُوا فِيهِ اخْتِلَافًا كَثِيرًا﴾، وكان النبي أميًا وهذا دليل آخر.", "ru": "В ан-Ниса, 82 сказано: будь он не от Аллаха, нашли бы много противоречий. А Пророк был неграмотен - ещё довод.", "en": "An-Nisa 82 says: had it been from other than Allah they would find many discrepancies. The Prophet was unlettered - another proof."},null),
  Q("isl-aqeeda-2-05",{"he": "מה פירוש שהשמות היפים הם \"תוֹקיפִיה\"?", "ar": "ما معنى أن أسماء الله «توقيفية»؟", "ru": "Что значит, что имена Аллаха «таукифийя»?", "en": "What does it mean that Allah's names are \"tawqifiyya\"?"},[{"he": "כל אדם יכול להוסיף שם לאללה, אם השם נשמע לו יפה", "ar": "يستطيع كل إنسان أن يضيف اسمًا لله إذا استحسنه", "ru": "Каждый может добавить имя Аллаху, если оно кажется ему красивым", "en": "Anyone may add a name for Allah if the name seems fitting to him"}, {"he": "הם מופיעים רק בשירה הערבית, ולא בקוראן ולא בסונה", "ar": "لا ترد إلا في الشعر العربي، لا في القرآن ولا في السنة", "ru": "Они встречаются только в арабской поэзии, но не в Коране и Сунне", "en": "They appear only in Arabic poetry, not in the Quran or the Sunnah"}, {"he": "הם משתנים לפי השפה, ולכל עם שמות אחרים לאללה", "ar": "تتغير بحسب اللغة، ولكل قوم أسماء أخرى لله", "ru": "Они меняются по языкам, и у каждого народа свои имена Аллаха", "en": "They change with the language, each people having its own names for Allah"}, {"he": "ידועים רק מהקוראן והסונה, ואין להמציא שמות", "ar": "لا تُعرف إلا بالنص من القرآن والسنة ولا تثبت بالعقل", "ru": "Известны только из Корана и Сунны, их нельзя придумывать", "en": "Known only from the Quran and Sunnah; names cannot be invented"}],3,{"he": "המילה קשורה ל\"עצירה\" - עוצרים אצל הטקסט.", "ar": "الكلمة من «الوقوف» عند النص.", "ru": "Слово от «остановиться» на тексте.", "en": "The word means \"stopping\" at the text."},{"he": "\"תוקיפיה\" - רק ההתגלות קובעת את שמות אללה. אין להוסיף או להמציא לפי הדעת.", "ar": "التوقيفية أن الوحي وحده يثبت أسماء الله، فلا يُزاد عليها ولا يُخترع منها.", "ru": "«Таукифийя»: имена Аллаха устанавливает только откровение, их нельзя добавлять или выдумывать по мнению.", "en": "\"Tawqifiyya\": only revelation establishes Allah's names; none may be added or invented by opinion."},null),
  Q("isl-aqeeda-2-06",{"he": "איזו תכונה היא תכונת עצמות (צפאת אל-דאת) של אללה?", "ar": "أي صفة من صفات الذات الإلهية؟", "ru": "Какое из этих качеств - качество сущности (сифат аз-зат) Аллаха?", "en": "Which is an attribute of Allah's essence (sifat al-dhat)?"},[{"he": "הקיום (אל-וג'וד)", "ar": "الوجود", "ru": "Существование (аль-вуджуд)", "en": "Existence (al-wujud)"}, {"he": "היותו יצור מסוים", "ar": "كونه مخلوقًا", "ru": "Быть сотворённым", "en": "Being created"}, {"he": "צורך בעזרה מאחרים", "ar": "احتياجه إلى غيره", "ru": "Нуждаться в других", "en": "Needing help from others"}, {"he": "תחילה וסוף", "ar": "أن له بداية ونهاية", "ru": "Иметь начало и конец", "en": "Having a beginning and an end"}],0,{"he": "התכונה שאי אפשר בלעדיה: שהוא קיים.", "ar": "الصفة التي لا بد منها: أنه موجود.", "ru": "Качество, без которого нельзя: Он существует.", "en": "The attribute without which nothing else: that He exists."},{"he": "מתכונות העצמות: הקיום, הקדמות (ללא תחילה), הקיום הנצחי והייחוד. אללה אינו יצור ואינו זקוק לאחרים.", "ar": "من صفات الذات: الوجود والقدم والبقاء والوحدانية. والله ليس مخلوقًا ولا يحتاج إلى غيره.", "ru": "Среди качеств сущности: существование, вечность без начала, непреходящесть и единство. Аллах не создан и не нуждается в другом.", "en": "Attributes of the essence include existence, eternity without beginning, everlastingness and oneness. Allah is not created and needs no one."},null),
],
[
  Q("isl-aqeeda-3-01",{"he": "באיזה חדית' מוזכרים שישה עיקרי האמונה, האיסלאם והאיחסאן?", "ar": "في أي حديث ذُكرت أركان الإيمان والإسلام والإحسان؟", "ru": "В каком хадисе названы столпы веры, ислама и ихсана?", "en": "In which hadith are the pillars of faith, Islam and ihsan mentioned?"},[{"he": "חדית' ג'יבריל (בשאלת ג'יבריל לנביא)", "ar": "حديث جبريل المشهور", "ru": "Хадис Джибриля", "en": "The hadith of Jibril"}, {"he": "חדית' ההגירה, שבו נאמר שהמעשים נמדדים בכוונה", "ar": "حديث الهجرة الذي فيه أن الأعمال بالنيات", "ru": "Хадис о переселении, где сказано, что дела судятся по намерениям", "en": "The hadith of migration, which says deeds are judged by intentions"}, {"he": "חדית' המסחר, שבו נקבעו כללי המכירה והקנייה", "ar": "حديث البيوع الذي فيه أحكام البيع والشراء", "ru": "Хадис о торговле, в котором даны правила купли-продажи", "en": "The hadith of trade, which sets the rules of buying and selling"}, {"he": "חדית' הזכאת, שבו נאמר על מי ועל מה היא חלה", "ar": "حديث الزكاة الذي فيه على من تجب وفيم تجب", "ru": "Хадис о закяте, где сказано, на ком и на чём он лежит", "en": "The hadith of zakat, saying on whom and on what it is due"}],0,{"he": "ג'יבריל בא בדמות אדם ושאל את הנביא שאלות.", "ar": "جاء جبريل في صورة رجل وسأل النبي.", "ru": "Джибриль пришёл в облике человека и задавал вопросы Пророку.", "en": "Jibril came in the form of a man and questioned the Prophet."},{"he": "בחדית' ג'יבריל, שמסר עומר, שאל ג'יבריל על האיסלאם, האיימאן והאיחסאן, ועל השעה. הנביא ענה והסביר.", "ar": "في حديث جبريل عن عمر سأل جبريل عن الإسلام والإيمان والإحسان والساعة، فأجابه النبي.", "ru": "В хадисе Джибриля, переданном Умаром, он спросил об исламе, имане, ихсане и Часе, и Пророк ответил.", "en": "In the hadith of Jibril, narrated by Umar, he asked about Islam, iman, ihsan and the Hour, and the Prophet answered."},null),
  Q("isl-aqeeda-3-02",{"he": "מה כולל האמונה בקדר?", "ar": "ماذا يشمل الإيمان بالقدر؟", "ru": "Что включает вера в предопределение?", "en": "What does belief in destiny (qadar) include?"},[{"he": "רק שהאדם קובע הכול, ואין לאללה ידיעה במעשיו", "ar": "أن الإنسان يقرر كل شيء وليس لله علم بأفعاله", "ru": "Что человек всё решает сам и у Аллаха нет знания о его делах", "en": "That the human decides everything and Allah has no knowledge of his deeds"}, {"he": "ידיעה, כתיבה, רצון ובריאה של אללה", "ar": "علم الله وكتابته ومشيئته وخلقه", "ru": "Знание Аллаха, запись, воля и творение", "en": "Allah's knowledge, writing, will and creation"}, {"he": "שמה שקורה לאדם קורה במקרה, בלי ידיעה ובלי כתיבה מראש", "ar": "أن ما يصيب الإنسان يقع مصادفة بلا علم سابق ولا كتابة", "ru": "Что происходящее с человеком случается само собой, без предзнания и записи", "en": "That what happens to a person occurs by chance, with no prior knowledge and no record"}, {"he": "שאין לאדם אחריות על מעשיו, ואין הוא נשאל עליהם", "ar": "ألا مسؤولية على الإنسان في أفعاله ولا يُسأل عنها", "ru": "Что человек не отвечает за свои дела и с него не спросят", "en": "That a person bears no responsibility for his deeds and is not asked about them"}],1,{"he": "ארבע דרגות.", "ar": "أربع مراتب.", "ru": "Четыре ступени.", "en": "Four levels."},{"he": "האמונה בקדר כוללת ארבע דרגות: ידיעה, כתיבה בלוח, רצון ובריאה. ויש לאדם בחירה ואחריות.", "ar": "الإيمان بالقدر أربع مراتب: العلم والكتابة والمشيئة والخلق، وللإنسان اختيار ومسؤولية.", "ru": "Вера в предопределение - четыре ступени: знание, запись, воля, творение. У человека есть выбор и ответственность.", "en": "Belief in qadar has four levels: knowledge, writing, will and creation. Humans still have choice and responsibility."},null),
  Q("isl-aqeeda-3-03",{"he": "מאיזה חומר נבראו המלאכים לפי הסונה?", "ar": "مم خُلقت الملائكة بحسب السنة؟", "ru": "Из чего созданы ангелы согласно Сунне?", "en": "From what were the angels created, according to the Sunnah?"},[{"he": "מחומר טינה", "ar": "من طين", "ru": "Из глины", "en": "From clay"}, {"he": "מאש בלי עשן", "ar": "من نار لا دخان فيها", "ru": "Из бездымного огня", "en": "From smokeless fire"}, {"he": "מאור", "ar": "من نور", "ru": "Из света", "en": "From light"}, {"he": "ממים", "ar": "من ماء", "ru": "Из воды", "en": "From water"}],2,{"he": "החדית' מונה שלוש בריאות - המלאכים, הג'אן והאדם - וכל אחת מחומר אחר.", "ar": "الحديث يذكر ثلاث خلائق: الملائكة والجانّ وآدم، كلٌّ من مادة.", "ru": "В хадисе названы три творения: ангелы, джинны и Адам - каждое из своего вещества.", "en": "The hadith names three creations - angels, jinn and Adam - each from a different substance."},{"he": "בחדית' במוסלם: \"נבראו המלאכים מאור, הג'אן מאש ללא עשן, ואדם ממה שתוארה לכם\".", "ar": "في صحيح مسلم: «خُلقت الملائكة من نور وخُلق الجانّ من مارجٍ من نار وخُلق آدم مما وُصف لكم».", "ru": "В хадисе у Муслима: «Ангелы созданы из света, джинны - из бездымного огня, а Адам - из того, что вам описано».", "en": "In Muslim: \"The angels were created from light, the jinn from smokeless fire, and Adam from what has been described to you\"."},null),
  Q("isl-aqeeda-3-04",{"he": "מי מוטל עליו לנשוף בקרן (אל-סור) ביום הדין?", "ar": "من الملَك الموكَّل بالنفخ في الصور؟", "ru": "Какой ангел трубит в рог (ас-сур)?", "en": "Which angel is charged with blowing the Horn (al-Sur)?"},[{"he": "ג'יבריל", "ar": "جبريل", "ru": "Джибриль", "en": "Jibril"}, {"he": "מיכאל", "ar": "ميكائيل", "ru": "Микаиль", "en": "Mikail"}, {"he": "מלאך המוות", "ar": "ملك الموت", "ru": "Ангел смерти", "en": "The angel of death"}, {"he": "אסראפיל", "ar": "إسرافيل", "ru": "Исрафил", "en": "Israfil"}],3,{"he": "הוא זה שיבשר את ההתחלה ואת הקץ.", "ar": "هو الذي يعلن نهاية الدنيا وبعثها.", "ru": "Он возвестит конец и воскресение.", "en": "He announces the end and the resurrection."},{"he": "אסראפיל ינשוף בקרן, ובפעם הראשונה כל החיים ימותו ובשנייה יקומו לחיים.", "ar": "ينفخ إسرافيل في الصور فيصعق من في الأرض ثم يُنفخ فيه أخرى فيقومون.", "ru": "Исрафил подует в рог: сначала всё живое умрёт, во второй раз - воскреснет.", "en": "Israfil will blow the Horn; first all die, then at the second blast they rise."},null),
  Q("isl-aqeeda-3-05",{"he": "מיהם חמשת \"אולו אל-עזם\" (בעלי החלטה)?", "ar": "من هم أولو العزم من الرسل؟", "ru": "Кто такие пять «улу-ль-азм»?", "en": "Who are the five \"ulu al-'azm\" (messengers of firm resolve)?"},[{"he": "נוח, אברהים, מוסא, עיסא ומוחמד", "ar": "نوح وإبراهيم وموسى وعيسى ومحمد", "ru": "Нух, Ибрахим, Муса, Иса и Мухаммад", "en": "Nuh, Ibrahim, Musa, Isa and Muhammad"}, {"he": "אדם, נוח, יונס, לוט ויוסף", "ar": "آدم ونوح ويونس ولوط ويوسف", "ru": "Адам, Нух, Юнус, Лут и Юсуф", "en": "Adam, Nuh, Yunus, Lut and Yusuf"}, {"he": "דאוד, סולימאן, איוב, יחיא וזכריה", "ar": "داود وسليمان وأيوب ويحيى وزكريا", "ru": "Дауд, Сулейман, Аюб, Яхья и Закария", "en": "Dawud, Sulayman, Ayyub, Yahya and Zakariya"}, {"he": "הארון, הוד, שועיב, אידריס ויעקוב", "ar": "هارون وهود وشعيب وإدريس ويعقوب", "ru": "Харун, Худ, Шуайб, Идрис и Якуб", "en": "Harun, Hud, Shu'ayb, Idris and Yaqub"}],0,{"he": "בהם מוסא, עיסא ומוחמד, ועוד שניים מהחזקים.", "ar": "فيهم موسى وعيسى ومحمد وإبراهيم ونوح.", "ru": "Среди них Муса, Иса, Мухаммад.", "en": "They include Musa, Isa and Muhammad."},{"he": "אולו אל-עזם, לפי המקובל, הם חמשת הנביאים הללו, שסבלו רבות והיו עקשנים בדרך אללה.", "ar": "أولو العزم على المشهور هؤلاء الخمسة، صبروا كثيرًا وثبتوا على أمر الله.", "ru": "Улу-ль-азм, по распространённому мнению, - эти пятеро, которые были стойки в пути Аллаха.", "en": "The ulu al-'azm, by the common view, are these five, who showed great patience and firmness in Allah's path."},null),
  Q("isl-aqeeda-3-06",{"he": "איזה דבר אי אפשר לומר על אללה?", "ar": "أي شيء لا يجوز أن يوصف الله به؟", "ru": "Что нельзя сказать об Аллахе?", "en": "What can never be said of Allah?"},[{"he": "שהוא חי, ושחייו אינם נגמרים לעולם", "ar": "أنه حي حياة لا تنتهي أبدًا", "ru": "Что Он жив и Его жизнь никогда не кончается", "en": "That He is Living, and His life never ends"}, {"he": "שיש לו תחילה או שהוא זקוק לאחרים", "ar": "أن له بداية أو أنه محتاج إلى غيره", "ru": "Что у Него есть начало или что Он нуждается в других", "en": "That He has a beginning or needs others"}, {"he": "שהוא יודע הכול, הגלוי והנסתר, בלי שנעלם ממנו דבר", "ar": "أنه يعلم كل شيء، الظاهر والخفي، ولا يغيب عنه شيء", "ru": "Что Он знает всё, явное и скрытое, и ничто от Него не скрыто", "en": "That He knows everything, the seen and the hidden, with nothing hidden from Him"}, {"he": "שהוא יחיד, ואין לו שותף ואין כמוהו דבר", "ar": "أنه واحد لا شريك له وليس كمثله شيء", "ru": "Что Он Один, у Него нет сотоварища и нет Ему подобного", "en": "That He is One, with no partner and nothing like Him"}],1,{"he": "שלושת האחרים הם תכונות שלמות.", "ar": "الثلاثة الباقية صفات كمال.", "ru": "Остальные три - качества совершенства.", "en": "The other three are attributes of perfection."},{"he": "אללה קדמון ואינו זקוק לכלום (אל-ע'ני). לכן אסור לייחס לו תחילה, תלות או חולשה.", "ar": "الله قديم غني عن كل شيء، فلا يوصف ببداية أو حاجة أو نقص.", "ru": "Аллах предвечен и ни в чём не нуждается. Поэтому Ему нельзя приписывать начало, зависимость или слабость.", "en": "Allah is eternal and self-sufficient, so no beginning, need or weakness may be attributed to Him."},null),
],
]);

topic("isl-fiqh","faith",{"he": "ההלכה: זכאת ואג'מאע", "ar": "الفقه: الزكاة والإجماع", "ru": "Фикх: закят и иджма", "en": "Fiqh: zakat and ijma'"},{"he": "הזכאת, מי מקבל אותה, ואג'מאע - הסכמת החכמים", "ar": "الزكاة ومصارفها والإجماع", "ru": "Закят, кто его получает, и иджма - согласие учёных", "en": "Zakat, who receives it, and ijma' - the scholars' agreement"}, [
[
  Q("isl-fiqh-1-01",{"he": "כמה עמודים יש לאיסלאם?", "ar": "كم عدد أركان الإسلام؟", "ru": "Сколько столпов у ислама?", "en": "How many pillars does Islam have?"},[{"he": "חמישה", "ar": "خمسة", "ru": "Пять", "en": "Five"}, {"he": "שישה", "ar": "ستة", "ru": "Шесть", "en": "Six"}, {"he": "שלושה", "ar": "ثلاثة", "ru": "Три", "en": "Three"}, {"he": "עשרה", "ar": "عشرة", "ru": "Десять", "en": "Ten"}],0,{"he": "מספר קטן מעשרה וגדול מארבעה.", "ar": "عدد أكبر من أربعة وأقل من ستة.", "ru": "Число больше четырёх и меньше шести.", "en": "A number greater than four and less than six."},{"he": "חמשת העמודים: העדות, התפילה, הזכאת, הצום בראמדאן והחג'.", "ar": "أركان الإسلام: الشهادتان والصلاة والزكاة وصوم رمضان وحج البيت.", "ru": "Пять столпов: свидетельство веры, молитва, закят, пост в рамадан и хадж.", "en": "The five pillars: the testimony of faith, prayer, zakat, fasting in Ramadan and hajj."},null),
  Q("isl-fiqh-1-02",{"he": "מה פירוש המילה \"זכאת\" בשפה?", "ar": "ما معنى كلمة «زكاة» في اللغة؟", "ru": "Что значит слово «закят» в языке?", "en": "What does the word \"zakat\" mean in the language?"},[{"he": "מסחר וחליפין", "ar": "التجارة والمبادلة", "ru": "Торговля и обмен", "en": "Trade and exchange"}, {"he": "טהרה וצמיחה", "ar": "الطهارة والنماء", "ru": "Очищение и рост", "en": "Purification and growth"}, {"he": "מלחמה והגנה", "ar": "الحرب والدفاع", "ru": "Война и защита", "en": "War and defence"}, {"he": "הליכה ונסיעה", "ar": "المشي والسفر", "ru": "Ходьба и дорога", "en": "Walking and travel"}],1,{"he": "יש קשר ל\"ניקוי\" של הממון והנפש.", "ar": "لها صلة بتطهير المال والنفس.", "ru": "Связано с очищением имущества и души.", "en": "It is linked to cleansing wealth and the soul."},{"he": "זכאת פירושה טהרה וגידול. נותנים חלק מהממון ובכך מטהרים אותו ואת הנפש.", "ar": "الزكاة في اللغة الطهارة والنماء، فبإخراجها يطهر المال والنفس.", "ru": "Закят в языке - очищение и рост. Отдавая часть имущества, очищают его и душу.", "en": "Zakat means purification and growth. By giving part of one's wealth, wealth and soul are purified."},null),
  Q("isl-fiqh-1-03",{"he": "מהו \"ניסאב\"?", "ar": "ما هو «النصاب»؟", "ru": "Что такое «ниcаб»?", "en": "What is the \"nisab\"?"},[{"he": "סוג של תפילה מיוחדת שמתפללים לפני שנותנים את הזכאת", "ar": "نوع من الصلاة الخاصة تُصلى قبل إخراج الزكاة", "ru": "Особый вид молитвы, которую читают перед выплатой закята", "en": "A special kind of prayer said before the zakat is given"}, {"he": "שם של חג שחוגגים בו אחרי שמחלקים את הזכאת לעניים", "ar": "اسم عيد يُحتفل به بعد توزيع الزكاة على الفقراء", "ru": "Название праздника, который отмечают после раздачи закята бедным", "en": "The name of a feast held after the zakat is handed out to the poor"}, {"he": "הכמות המינימלית של ממון שחייבת בזכאת", "ar": "المقدار الأدنى من المال الذي تجب فيه الزكاة", "ru": "Минимальная сумма имущества, с которой платят закят", "en": "The minimum amount of wealth on which zakat is due"}, {"he": "קרבן שמקריבים בחג' במכה, ובשרו מחולק לעניים", "ar": "ذبيحة تُذبح في الحج بمكة ويوزَّع لحمها على الفقراء", "ru": "Жертвенное животное в хадже в Мекке, мясо которого раздают бедным", "en": "An animal sacrificed at hajj in Makkah whose meat is given to the poor"}],2,{"he": "מי שיש לו פחות מהכמות הזאת אינו חייב.", "ar": "من ملك أقل منه لا تجب عليه.", "ru": "Тот, у кого меньше, не обязан.", "en": "One who has less is not required."},{"he": "הניסאב הוא הסכום המינימלי. מי שיש לו פחות ממנו אינו חייב בזכאת על אותו ממון.", "ar": "النصاب هو الحد الأدنى من المال، ومن ملك دونه لم تجب عليه الزكاة.", "ru": "Ниcаб - минимальный порог. У кого меньше, тот не платит закят с этого имущества.", "en": "The nisab is the minimum threshold. Whoever has less is not obliged to pay zakat on that wealth."},null),
  Q("isl-fiqh-1-04",{"he": "מהו שיעור הזכאת על כסף וזהב שהגיעו לניסאב?", "ar": "ما مقدار زكاة النقدين إذا بلغا النصاب؟", "ru": "Каков размер закята с денег и золота, достигших ниcаба?", "en": "What is the rate of zakat on money and gold that reach the nisab?"},[{"he": "10%", "ar": "10%", "ru": "10%", "en": "10%"}, {"he": "50%", "ar": "50%", "ru": "50%", "en": "50%"}, {"he": "1%", "ar": "1%", "ru": "1%", "en": "1%"}, {"he": "2.5%", "ar": "2.5%", "ru": "2,5%", "en": "2.5%"}],3,{"he": "פחות מחמישה אחוזים.", "ar": "أقل من خمسة بالمئة.", "ru": "Меньше пяти процентов.", "en": "Less than five percent."},{"he": "שיעור הזכאת על כסף וזהב הוא רבע העשירית, כלומר 2.5% מדי שנה על הממון שהגיע לניסאב.", "ar": "مقدار زكاة المال ربع العشر أي 2.5% كل عام عمّا بلغ النصاب.", "ru": "Размер закята - одна сороковая, то есть 2,5% в год с имущества, достигшего нисаба.", "en": "The rate is one fortieth, that is 2.5% each year on wealth that reaches the nisab."},null),
  Q("isl-fiqh-1-05",{"he": "כמה קבוצות זכאיות לקבל זכאת לפי אל-תוֹבה 60?", "ar": "كم صنفًا من المستحقين للزكاة في سورة التوبة 60؟", "ru": "Сколько категорий получателей закята в суре ат-Тауба, 60?", "en": "How many categories of zakat recipients are in al-Tawba 60?"},[{"he": "שמונה", "ar": "ثمانية", "ru": "Восемь", "en": "Eight"}, {"he": "שלוש", "ar": "ثلاثة", "ru": "Три", "en": "Three"}, {"he": "שתים עשרה", "ar": "اثنا عشر", "ru": "Двенадцать", "en": "Twelve"}, {"he": "אחת", "ar": "واحد", "ru": "Одна", "en": "One"}],0,{"he": "מספר זוגי קטן מעשר.", "ar": "عدد زوجي أقل من عشرة.", "ru": "Чётное число меньше десяти.", "en": "An even number less than ten."},{"he": "שמונה: העניים, הדלים, העובדים על הגבייה, מי שמרככים את לבו, שחרור עבדים, החייבים, בדרך אללה ובן הדרך.", "ar": "ثمانية: الفقراء والمساكين والعاملون عليها والمؤلفة قلوبهم والرقاب والغارمون وفي سبيل الله وابن السبيل.", "ru": "Восемь: бедные, нуждающиеся, сборщики, те, чьи сердца привлекаются, освобождение рабов, должники, на пути Аллаха и путник.", "en": "Eight: the poor, the needy, collectors, those whose hearts are reconciled, freeing slaves, debtors, in Allah's cause and the wayfarer."},null),
  Q("isl-fiqh-1-06",{"he": "מהי זכאת אל-פיטר?", "ar": "ما هي زكاة الفطر؟", "ru": "Что такое закят аль-фитр?", "en": "What is zakat al-fitr?"},[{"he": "מס שנתי על הקרקע, שמשלמים לפי גודל השדה", "ar": "ضريبة سنوية على الأرض تُدفع بحسب مساحة الحقل", "ru": "Ежегодный налог на землю, который платят по размеру поля", "en": "A yearly tax on land, paid according to the size of the field"}, {"he": "מזון שנותנים בסוף ראמדאן עבור כל אדם", "ar": "صدقة تُخرج في آخر رمضان عن كل شخص", "ru": "Милостыня в конце рамадана за каждого человека", "en": "Charity given at the end of Ramadan for each person"}, {"he": "תשלום לבית הספר של המסגד, עבור לימוד הילדים", "ar": "رسوم لمدرسة المسجد مقابل تعليم الأطفال", "ru": "Плата школе при мечети за обучение детей", "en": "A payment to the mosque school for teaching the children"}, {"he": "מתנה שנותנים לקרובי המשפחה בלבד בסוף ראמדאן", "ar": "هدية تُعطى للأقارب وحدهم في آخر رمضان", "ru": "Подарок, который дают только родственникам в конце рамадана", "en": "A gift given only to relatives at the end of Ramadan"}],1,{"he": "השם מרמז על \"שבירת הצום\".", "ar": "الاسم يدل على «الفطر» من الصيام.", "ru": "Название намекает на «разговение».", "en": "The name hints at \"breaking the fast\"."},{"he": "זכאת אל-פיטר חובה על האדם, ונותנים אותה אחרי ראמדאן לפני תפילת החג, לעניים.", "ar": "زكاة الفطر واجبة على الأفراد وتُخرج قبل صلاة العيد للفقراء.", "ru": "Закят аль-фитр обязателен для каждого и отдаётся бедным перед праздничной молитвой.", "en": "Zakat al-fitr is due on each person and is given to the poor before the Eid prayer."},null),
],
[
  Q("isl-fiqh-2-01",{"he": "מהם שני סוגי הזכאת ובמה כל אחד קשור?", "ar": "ما نوعا الزكاة وبماذا يتعلق كل منهما؟", "ru": "Каковы два вида закята и с чем связан каждый?", "en": "What are the two types of zakat and what is each tied to?"},[{"he": "שניהם קשורים לקרקע ולגודל השדה", "ar": "كلاهما يتعلق بالأرض وبمساحة الحقل", "ru": "Оба связаны с землёй и размером поля", "en": "Both are tied to land and to the size of the field"}, {"he": "זכאת הממון קשורה לרכוש, וזכאת אל-פיטר קשורה לאדם", "ar": "زكاة المال تتعلق بالمال وزكاة الفطر تتعلق بالبدن", "ru": "Закят имущества связан с имуществом, закят аль-фитр - с самим человеком", "en": "Zakat of wealth is tied to property; zakat al-fitr is tied to the person"}, {"he": "זכאת הממון ניתנת בראמדאן, וזכאת אל-פיטר ניתנת בחג'", "ar": "زكاة المال تُدفع في رمضان وزكاة الفطر تُدفع في الحج", "ru": "Закят имущества выплачивают в рамадан, а закят аль-фитр - в хадж", "en": "Zakat of wealth is paid in Ramadan and zakat al-fitr is paid at hajj"}, {"he": "שניהם חלים על ילדים ולא על מבוגרים", "ar": "كلاهما يجب على الأطفال دون البالغين", "ru": "Оба обязательны для детей, а не для взрослых", "en": "Both are due from children and not from adults"}],1,{"he": "אחד נקרא על שם הממון והשני על שם חג.", "ar": "أحدهما باسم المال والآخر باسم الفطر.", "ru": "Один назван по имуществу, другой - по разговению.", "en": "One is named for wealth, the other for the fast-breaking."},{"he": "זכאת הממון נקבעת לפי הרכוש והניסאב. זכאת אל-פיטר נקבעת לפי הנפש, בסוף הצום.", "ar": "زكاة المال تتعلق بالمال والنصاب، وزكاة الفطر تتعلق بالنفس عند ختام الصيام.", "ru": "Закят имущества зависит от имущества и нисаба. Закят аль-фитр - от человека, в конце поста.", "en": "Wealth zakat depends on property and the nisab. Zakat al-fitr depends on the person, at the end of the fast."},null),
  Q("isl-fiqh-2-02",{"he": "מי מהבאים זכאי לקבל זכאת?", "ar": "أي من الآتي يستحق الزكاة؟", "ru": "Кто из перечисленных имеет право получать закят?", "en": "Which of these may receive zakat?"},[{"he": "סוחר עשיר מאוד שעסקו משגשג", "ar": "تاجر غني جدًا تجارته رابحة", "ru": "Очень богатый торговец с прибыльным делом", "en": "A very rich merchant whose business thrives"}, {"he": "האב של הנותן, שהוא קשיש ועני", "ar": "أبو المعطي وهو شيخ كبير فقير", "ru": "Отец дающего, пожилой и бедный", "en": "The giver's own father, elderly and poor"}, {"he": "חייב שאינו מסוגל לשלם חובו", "ar": "الغارم العاجز عن سداد دينه", "ru": "Должник, не способный вернуть долг", "en": "A debtor unable to repay his debt"}, {"he": "בנו של הנותן, שעדיין לומד", "ar": "ابن المعطي وهو ما زال طالب علم", "ru": "Сын дающего, который ещё учится", "en": "The giver's own son, still a student"}],2,{"he": "הוא אחד משמונת הסוגים.", "ar": "هو أحد الأصناف الثمانية.", "ru": "Он один из восьми разрядов.", "en": "He is one of the eight categories."},{"he": "החייב (אל-גארם) הוא אחד משמונת הסוגים. עשיר, הורה או ילד של הנותן אינם מקבלים.", "ar": "الغارم من الأصناف الثمانية، أما الغني وأصل المزكّي وفرعه فلا يُعطَون.", "ru": "Должник (гарим) - одна из восьми категорий. Богатому, родителю и ребёнку дающего не дают.", "en": "The debtor (gharim) is one of the eight categories. The rich, and the giver's parents or children, do not receive it."},null),
  Q("isl-fiqh-2-03",{"he": "למי אסור לתת את הזכאת?", "ar": "لمن لا يجوز دفع الزكاة؟", "ru": "Кому нельзя отдавать закят?", "en": "To whom may zakat not be given?"},[{"he": "לעני שאינו מקרובי המשפחה של הנותן ואין לו ממון", "ar": "للفقير الذي ليس من أقارب المزكي ولا مال له", "ru": "Бедному, который не родственник дающего и не имеет средств", "en": "To a poor person who is not the giver's relative and has no means"}, {"he": "לחייב שלקח הלוואה ואינו מסוגל להחזיר את חובו", "ar": "للغارم الذي استدان ولا يقدر على سداد دينه", "ru": "Должнику, который взял в долг и не может его вернуть", "en": "To a debtor who borrowed and cannot repay his debt"}, {"he": "לבן הדרך, הנוסע שנתקע בדרך ואין לו כסף לחזור", "ar": "لابن السبيل المسافر الذي انقطع به الطريق ولا مال له", "ru": "Путнику, который застрял в дороге и не имеет денег вернуться", "en": "To a wayfarer stranded on the road with no money to return"}, {"he": "להורים ולילדים של הנותן, ולאישה או בעל", "ar": "لأصول المزكي وفروعه وزوجه", "ru": "Родителям и детям дающего и его супругу", "en": "To the giver's parents, children and spouse"}],3,{"he": "החיוב לפרנס את הקרובים כבר קיים.", "ar": "نفقة الأقارب واجبة أصلًا.", "ru": "Содержание родных и так обязательно.", "en": "Supporting close family is already an obligation."},{"he": "אין נותנים זכאת להורים, לילדים, ולבן/בת זוג, כי הם מחויבים בפרנסתם. אין נותנים גם לעשיר ולבני בית הנביא (בני הישאם).", "ar": "لا تُدفع الزكاة للأصول والفروع والزوجة لأن نفقتهم واجبة، ولا للغني ولا لبني هاشم.", "ru": "Закят не дают родителям, детям и супругу, так как их содержание обязательно. Также богатому и роду Хашима.", "en": "Zakat is not given to parents, children or spouse since supporting them is already due; nor to the rich or the family of the Prophet (Banu Hashim)."},null),
  Q("isl-fiqh-2-04",{"he": "מה פירוש \"אל-איג'מאע\" במדעי ההלכה?", "ar": "ما معنى «الإجماع» في علم أصول الفقه؟", "ru": "Что значит «иджма» в науке о праве?", "en": "What does \"ijma'\" mean in the science of Islamic law?"},[{"he": "הסכמת חכמי האומה בדור מסוים על דין אחרי מות הנביא", "ar": "اتفاق مجتهدي الأمة في عصر على حكم شرعي بعد وفاة النبي", "ru": "Согласие муджтахидов общины в какую-то эпоху о предписании после смерти Пророка", "en": "Agreement of the community's scholars in an era on a ruling after the Prophet's death"}, {"he": "הכרעה של שופט אחד בבית הדין, שמחייבת את כל המוסלמים", "ar": "حكم قاضٍ واحد في المحكمة يلزم المسلمين جميعًا", "ru": "Решение одного судьи в суде, обязательное для всех мусульман", "en": "A single judge's ruling in court that binds all Muslims"}, {"he": "תפילה בציבור במסגד, שבה כל המתפללים עומדים יחד מאחורי האימאם", "ar": "الصلاة في جماعة في المسجد خلف الإمام صفًّا واحدًا", "ru": "Общая молитва в мечети, где все молящиеся стоят вместе за имамом", "en": "A congregational prayer in the mosque, all standing together behind the imam"}, {"he": "שירה ערבית על האיסלאם שחיברו המשוררים בדור שאחרי הנביא", "ar": "شعر عربي عن الإسلام نظمه الشعراء في الجيل الذي بعد النبي", "ru": "Арабские стихи об исламе, сложенные поэтами в поколении, пришедшем после Пророка", "en": "Arabic poetry about Islam composed by poets in the generation after the Prophet"}],0,{"he": "המילה פירושה \"הסכמה\".", "ar": "الكلمة تعني «الاتفاق».", "ru": "Слово значит «согласие».", "en": "The word means \"agreement\"."},{"he": "אג'מאע הוא הסכמה של כל החכמים (מוג'תהידון) בדור אחד על הוראה דתית, אחרי הנביא.", "ar": "الإجماع اتفاق جميع المجتهدين في عصر على حكم شرعي بعد النبي.", "ru": "Иджма - согласие всех муджтахидов одной эпохи о предписании, после Пророка.", "en": "Ijma' is the agreement of all mujtahids of one era on a ruling, after the Prophet."},null),
  Q("isl-fiqh-2-05",{"he": "מהו המקור השלישי של ההלכה אחרי הקוראן והסונה?", "ar": "ما المصدر الثالث للتشريع بعد القرآن والسنة؟", "ru": "Какой третий источник права после Корана и Сунны?", "en": "What is the third source of law after the Quran and Sunnah?"},[{"he": "המסורת המקומית", "ar": "العرف المحلي", "ru": "Местный обычай", "en": "Local custom"}, {"he": "האג'מאע", "ar": "الإجماع", "ru": "Иджма", "en": "Ijma'"}, {"he": "הדעה הפרטית", "ar": "الرأي الشخصي", "ru": "Личное мнение", "en": "Personal opinion"}, {"he": "הצבעה בשוק", "ar": "التصويت في السوق", "ru": "Голосование на рынке", "en": "A vote in the market"}],1,{"he": "הוא קשור להסכמה כללית.", "ar": "يرتبط بالاتفاق العام.", "ru": "Связан с общим согласием.", "en": "It is linked to general agreement."},{"he": "מקורות הדין: הקוראן, הסונה, האג'מאע והקיאס (היקש). האג'מאע שלישי.", "ar": "أدلة الأحكام: القرآن والسنة والإجماع والقياس، والإجماع ثالثها.", "ru": "Источники: Коран, Сунна, иджма и кыйас. Иджма - третий.", "en": "Sources: Quran, Sunnah, ijma' and qiyas. Ijma' is third."},null),
  Q("isl-fiqh-2-06",{"he": "מהו קיאס (היקש)?", "ar": "ما هو القياس؟", "ru": "Что такое кыйас (аналогия)?", "en": "What is qiyas (analogy)?"},[{"he": "לפסוק בכל מקרה חדש לפי דעתו האישית של החכם, בלי לחפש מקור בקוראן", "ar": "الحكم في كل مسألة جديدة بالرأي الشخصي من غير رجوع إلى القرآن", "ru": "Решать каждый новый случай личным мнением, не обращаясь к Корану", "en": "Ruling on every new case by personal opinion without going back to the Quran"}, {"he": "לשנן את פסוקי הקוראן בעל פה, ומתוך השינון לדעת את הדין בכל מקרה", "ar": "حفظ آيات القرآن عن ظهر قلب، ومن الحفظ يُعرف حكم كل مسألة", "ru": "Заучивать аяты Корана наизусть и по памяти узнавать решение каждого случая", "en": "Memorizing the Quran's verses by heart and knowing every ruling from that memory"}, {"he": "לדון במקרה חדש כמו מקרה שיש עליו הוראה, כי יש ביניהם סיבה משותפת", "ar": "إلحاق مسألة جديدة بمسألة ثبت حكمها لعلة مشتركة", "ru": "Применение правила известного случая к новому из-за общей причины", "en": "Applying the ruling of a known case to a new one because of a shared reason"}, {"he": "ספר דינים חדש שנכתב אחרי הקוראן והסונה ומוסיף עליהם הוראות", "ar": "كتاب أحكام جديد أُلّف بعد القرآن والسنة ويزيد عليهما أحكامًا", "ru": "Новая книга законов, написанная после Корана и Сунны и добавляющая к ним предписания", "en": "A new book of rulings written after the Quran and Sunnah that adds to them"}],2,{"he": "\"היקש\" פירושו להשוות.", "ar": "«القياس» معناه المقارنة.", "ru": "«Кыйас» - сравнение.", "en": "\"Qiyas\" means comparing."},{"he": "בקיאס מוצאים את הסיבה (עילה) שבגללה נקבע דין, ובמקרה חדש שיש בו אותה סיבה נותנים את אותו דין.", "ar": "في القياس نجد علة الحكم، فإذا وُجدت في مسألة جديدة ثبت لها الحكم نفسه.", "ru": "В кыйасе находят причину (иллю) правила и, если она есть в новом случае, дают то же правило.", "en": "In qiyas one finds the reason (illa) behind a ruling and gives the same ruling to a new case with the same reason."},null),
],
[
  Q("isl-fiqh-3-01",{"he": "איזה פסוק משמש הוכחה לתוקף האג'מאע?", "ar": "أي آية تُستدل بها على حجية الإجماع؟", "ru": "Какой аят приводят как довод о силе иджмы?", "en": "Which verse is used as evidence for the authority of ijma'?"},[{"he": "\"אמור: הוא אללה אחד, אללה הנצחי, לא ילד ולא נולד\" (אל-אח'לאץ' 1-3)", "ar": "﴿قُلْ هُوَ اللَّهُ أَحَدٌ * اللَّهُ الصَّمَدُ * لَمْ يَلِدْ وَلَمْ يُولَدْ﴾ (الإخلاص 1-3)", "ru": "«Скажи: Он - Аллах Единый, Аллах Самодостаточный, не родил и не был рождён» (аль-Ихлас, 1-3)", "en": "\"Say: He is Allah, the One; Allah, the Eternal; He begets not, nor was He begotten\" (al-Ikhlas 1-3)"}, {"he": "\"הלל לאללה רב העולמים, הרחמן הרחום, מלך יום הדין\" (אל-פאתחה 2-4)", "ar": "﴿الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ * الرَّحْمَٰنِ الرَّحِيمِ * مَالِكِ يَوْمِ الدِّينِ﴾ (الفاتحة 2-4)", "ru": "«Хвала Аллаху, Господу миров, Милостивому, Милосердному, Владыке Дня воздаяния» (аль-Фатиха, 2-4)", "en": "\"Praise be to Allah, Lord of the worlds, the Most Merciful, Master of the Day of Judgment\" (al-Fatiha 2-4)"}, {"he": "\"ומי שחולק על השליח... ועוקב אחר דרך שאינה דרך המאמינים\" (אל-נסאא 115)", "ar": "﴿وَمَنْ يُشَاقِقِ الرَّسُولَ مِنْ بَعْدِ مَا تَبَيَّنَ لَهُ الْهُدَى وَيَتَّبِعْ غَيْرَ سَبِيلِ الْمُؤْمِنِينَ﴾ (النساء 115)", "ru": "«А кто противится Посланнику... и следует не путём верующих» (ан-Ниса, 115)", "en": "\"Whoever opposes the Messenger... and follows a path other than that of the believers\" (an-Nisa 115)"}, {"he": "\"וקימו את התפילה, ותנו את הזכאת, וכרעו עם הכורעים\" (אל-בקרה 43)", "ar": "﴿وَأَقِيمُوا الصَّلَاةَ وَآتُوا الزَّكَاةَ وَارْكَعُوا مَعَ الرَّاكِعِينَ﴾ (البقرة 43)", "ru": "«Совершайте молитву, выплачивайте закят и кланяйтесь вместе с кланяющимися» (аль-Бакара, 43)", "en": "\"Establish the prayer, give the zakat, and bow with those who bow\" (al-Baqara 43)"}],2,{"he": "חפשו פסוק על \"דרך המאמינים\".", "ar": "ابحث عن آية فيها «سبيل المؤمنين».", "ru": "Ищите аят о «пути верующих».", "en": "Look for the verse about \"the path of the believers\"."},{"he": "בסורת אל-נסאא 115 נאמר שמי שעוקב אחר דרך שאינה דרך המאמינים יענש. ממנה למדו שהסכמת האומה היא ראיה.", "ar": "في النساء 115 وعيد لمن اتبع غير سبيل المؤمنين، ومنها استدل العلماء على حجية الإجماع.", "ru": "В ан-Ниса, 115 предупреждение тому, кто следует не путём верующих; отсюда учёные выводят силу иджмы.", "en": "An-Nisa 115 warns whoever follows other than the believers' path; scholars derive from it that the community's agreement is evidence."},null),
  Q("isl-fiqh-3-02",{"he": "מהם שני סוגי האג'מאע?", "ar": "ما نوعا الإجماع؟", "ru": "Каковы два вида иджмы?", "en": "What are the two types of ijma'?"},[{"he": "אג'מאע של גברים, שבו פוסקים הגברים, ואג'מאע של נשים, שבו פוסקות הנשים", "ar": "إجماع الرجال يفتي فيه الرجال، وإجماع النساء تفتي فيه النساء", "ru": "Иджма мужчин, где решают мужчины, и иджма женщин, где решают женщины", "en": "Men's ijma', in which the men rule, and women's ijma', in which the women rule"}, {"he": "אג'מאע של חכמי מכה בלבד, ואג'מאע של חכמי אל-מדינה בלבד", "ar": "إجماع علماء مكة وحدهم، وإجماع علماء المدينة وحدهم", "ru": "Иджма только учёных Мекки и иджма только учёных Медины", "en": "The ijma' of Makkah's scholars alone and of Medina's scholars alone"}, {"he": "אג'מאע שנכתב בספר, ואג'מאע שנמסר בעל פה מדור לדור בלי כתיבה", "ar": "إجماع مكتوب في كتاب، وإجماع ينتقل مشافهة من جيل إلى جيل بلا كتابة", "ru": "Иджма, записанная в книге, и иджма, передаваемая устно из поколения в поколение", "en": "An ijma' written in a book and an ijma' passed on orally from generation to generation"}, {"he": "מפורש (צריח), שבו כולם אומרים דעתם, ושתיקה (סכוּתי), שבו חלקם שותקים", "ar": "صريح يصرّح فيه الجميع، وسكوتي يسكت فيه بعضهم", "ru": "Явная (сарих), где все высказываются, и молчаливая (сукути), где часть молчит", "en": "Explicit (sarih), where all state their view, and tacit (sukuti), where some stay silent"}],3,{"he": "הבדל אחד: האם כולם דיברו.", "ar": "الفرق: هل صرّح الجميع.", "ru": "Различие: все ли высказались.", "en": "The difference: did everyone speak."},{"he": "אג'מאע צריח - כל המוג'תהידון אמרו ברור. אג'מאע סכוּתי - חלקם אמרו והאחרים שתקו ולא התנגדו.", "ar": "الإجماع الصريح يقول فيه كل المجتهدين قولهم، والسكوتي يقول بعضهم ويسكت الباقون دون إنكار.", "ru": "Явная иджма - все муджтахиды высказались. Молчаливая - часть высказалась, остальные молчали без возражений.", "en": "In explicit ijma' all mujtahids state it. In tacit ijma' some state it and the others stay silent without objecting."},null),
  Q("isl-fiqh-3-03",{"he": "מי חייב בחג' ומתי?", "ar": "على من يجب الحج ومتى؟", "ru": "На кого обязателен хадж и когда?", "en": "Who must perform hajj and when?"},[{"he": "מי שמסוגל (בריאות וממון), פעם אחת בחיים", "ar": "المستطيع صحة ومالًا، مرة في العمر", "ru": "Тот, кто способен (здоровьем и средствами), один раз в жизни", "en": "Whoever is able (health and means), once in a lifetime"}, {"he": "כל אדם מוסלמי חייב בחג' בכל שנה, גם אם אין לו ממון", "ar": "كل مسلم يجب عليه الحج كل سنة ولو لم يملك مالًا", "ru": "Каждый мусульманин обязан совершать хадж каждый год, даже без средств", "en": "Every Muslim must perform hajj every year, even without means"}, {"he": "רק גברים חייבים בחג', ונשים אינן עולות לרגל כלל", "ar": "الرجال وحدهم يجب عليهم الحج، والنساء لا يحججن أصلًا", "ru": "Хадж обязателен только для мужчин, женщины вообще его не совершают", "en": "Only men must perform hajj; women do not make the pilgrimage at all"}, {"he": "רק עשירים מאוד חייבים בחג', ועליהם לעלות לרגל בכל שנה", "ar": "الأغنياء جدًا وحدهم يجب عليهم الحج، وعليهم أن يحجوا كل سنة", "ru": "Только очень богатые обязаны совершать хадж, и каждый год", "en": "Only the very rich must perform hajj, and they must go every year"}],0,{"he": "המילה \"מסוגל\" חשובה כאן.", "ar": "كلمة «المستطيع» مهمة هنا.", "ru": "Слово «способный» здесь важно.", "en": "The word \"able\" matters here."},{"he": "החג' חובה פעם בחיים על מי שיכול (אל-איסתיטאעה) בבריאות וברכוש, כפי שנאמר באאל עמראן 97.", "ar": "الحج واجب مرة في العمر على المستطيع بالبدن والمال، كما في آل عمران 97.", "ru": "Хадж обязателен раз в жизни для способного (аль-истиаа), как сказано в Аль Имран, 97.", "en": "Hajj is obligatory once in a lifetime on those able in body and means, as in Al Imran 97."},null),
  Q("isl-fiqh-3-04",{"he": "מי רשאי שלא לצום בראמדאן, ומה עליו לעשות?", "ar": "من يُرخَّص له بالفطر في رمضان وماذا عليه؟", "ru": "Кому разрешено не поститься в рамадан и что делать?", "en": "Who may skip the fast in Ramadan, and what must he do?"},[{"he": "כל מי שמעדיף לא לצום, ואינו חייב להשלים", "ar": "كل من يفضل ألا يصوم، ولا قضاء عليه", "ru": "Любой, кто предпочитает не поститься, и восполнять не должен", "en": "Anyone who prefers not to fast, with nothing to make up"}, {"he": "החולה והנוסע, וישלימו ימים אחרים", "ar": "المريض والمسافر ويقضيان أياميَ أخر", "ru": "Больной и путник, они восполняют дни позже", "en": "The sick and the traveler, who make up the days later"}, {"he": "מי שלא רוצה לקום לסעודת השחר בבוקר", "ar": "من لا يريد الاستيقاظ للسحور في الصباح", "ru": "Тот, кто не хочет вставать на предрассветную еду", "en": "Someone who does not want to wake for the pre-dawn meal"}, {"he": "אין מי שרשאי, והכול חייבים לצום בלי יוצא מן הכלל", "ar": "لا أحد يُرخَّص له، والجميع يصومون بلا استثناء", "ru": "Никому не дозволено: все обязаны поститься без исключения", "en": "No one is permitted; all must fast without exception"}],1,{"he": "אל-בקרה 184-185 מזכירות את המצבים.", "ar": "البقرة 184-185 تذكران الحالات.", "ru": "Аль-Бакара 184-185 упоминают случаи.", "en": "Al-Baqara 184-185 mention the cases."},{"he": "החולה והנוסע רשאים לא לצום, ועליהם להשלים ימים אחרים (אל-בקרה 184). יש גם הקלות אחרות לדין.", "ar": "يُرخَّص للمريض والمسافر الفطر وعليهما القضاء (البقرة 184)، وهناك رخص أخرى.", "ru": "Больному и путнику разрешено не поститься, они возмещают другие дни (аль-Бакара, 184). Есть и другие послабления.", "en": "The sick and the traveler may skip the fast and make up other days (al-Baqara 184). There are other allowances too."},null),
